    ## Health Record


    It is important to guarantee the privacy of patients. Hacking incidents on EHR
    (Electronic Health Record) systems may lead to modifying the data of patients.


    The advent of big data has caused multiple obstacles in various research fields.
    The term “big data” refers to the vast and huge volume of structured and unstructured
    data. It consists of patient’s data and helps them to select the prime possibility
    and also to support the medicinal treatment plan. However, they have made it hard
    to manipulate and process the data as the healthcare data became much larger.
    Contrastingly, the processing of big data on distributed sources is done by MapReduce.
    One of the main reasons for faults in healthcare domains is the incomplete and
    imperfect access to patient-related data and information, and unsuccessful communication
    among the stakeholders involved in the process [3].


    ## 2 Cloud Deployment Models in Healthcare


    Cloud deployment models are represented in Fig. 1 as shown below.


    ### 2.1 Public cloud


    This type of cloud model is available for anyone who wants to use or purchase
    them. It is based on a shared cost model or pay per use policy.


    ### 2.2 Private cloud


    This model is mainly used by stand-alone organizations. Private clouds are best
    for organizations that require high-security and high management demands.


    ### 2.3 Community cloud


    Community cloud is a shared model that is limited to only a set of organizations
    or employees. This type of deployment model of cloud computing is managed and
    hosted internally or by a third-party vendor.


    ### 2.4 Hybrid cloud


    Hybrid cloud combines two or more models such as public cloud, private cloud or
    community cloud. Based on business requirements, Hybrid cloud architecture allows
    an enterprise to move data and applications between private and public environments.


    ![](img/09fa00ca1419044515be1e45aa422bc8_86_0.png)


    **Fig. 1:** Cloud deployment models for healthcare


    ## 3 Cloud Service Models in Healthcare


    Cloud service models are represented in Fig. 2.


    ### 3.1 Software as a service (SaaS)


    SaaS describes a cloud service where consumers are able to access software applications
    running on a cloud infrastructure, over the internet. SaaS solutions do not require
    the client to maintain anything, including the storage of data and the network,
    and are managed by the vendor.


    ### 3.2 Platform as a service (PaaS)


    Platform as a Service (PaaS) is an integrated and abstracted cloud-based model
    that supports the development and management of applications. The whole storage
    and management of data is left to the vendor.


    ### 3.3 Infrastructure as a service (IaaS)


    IaaS is the virtual delivery of computing resources in the form of hardware, networking,
    and storage facilities. Based on the amount of storage and the amount of processing
    power you use over a time period, you will be charged according to that.


    ## 4 Factors to be Considered for the Evaluation of the Cloud System Security


    ### 4.1 Confidentiality


    Confidentiality refers to the protection of data from unauthorized users. In a
    Cloud System, such users might want to get unauthorized access to the data of
    some other individual. Patient’s information should be kept confidential in healthcare
    settings. Patient’s reputation, opportunities, and human dignity may be under
    threat with inappropriate disclosure of that information.


    ### 4.2 Integrity


    Integrity guarantees that the security property of an asset has not been modified
    by some unauthorized third-party personnel. It maintains the accuracy, reliability
    and consistency of data throughout its entire “life-cycle.” Integrity ensures
    an asset’s accuracy and correctness with respect to its owner. In healthcare,
    the accuracy of a patient’s personal details, health summary, clinical notes,
    test results etc. can be maintained by integrity.


    ### 4.3 Availability


    One of the most important aspects of security that needs to be maintained is Availability.
    A service-level agreement is a bond between the customer and the service provider
    about services to deliver in terms of availability and response to demand. Earlier,
    the SLA were negotiated between the service consumer and a client. But today there
    are different levels of SLA like customer-based SLA, service-based SLA, and multi-level
    SLA.


    ![](img/09fa00ca1419044515be1e45aa422bc8_88_0.png)


    **Fig. 2:** Cloud service models for healthcare


    Three important factors to be considered for the evaluation of the cloud system
    security are represented in Fig. 3.


    ![](img/09fa00ca1419044515be1e45aa422bc8_89_0.png)


    **Fig. 3:** Factors to be considered for the evaluation of the cloud system security


