    - 我们使用最权威的数据集进行了广泛的研究，以证明 Predis 的及时性和准确性。我们表明，我们的系统不仅能判断流量是否正常，还能在 DDoS 攻击初期检测到异常流量。结果表明，Predis\
    \ 比现有的保护参与方隐私的方案更准确。限制在单一域内的检测尝试将无法在攻击初期发现攻击。因此，多个域参与攻击检测将有助于实现更准确和及时的检测。\n\n\
    ## 8 DDoS 攻击检测方法总结\n\n由于 DDoS 攻击的普遍性和严重性，关于 DDoS 攻击检测的研究有很多。因此，我们从两个角度简要总结了相关工作，即传统网络中的\
    \ DDoS 攻击检测和 SDN 中的 DDoS 攻击检测。DDoS 攻击的检测方法已在传统网络模型中得到广泛研究[11-12]。\n\n### 8.1 传统网络熵\n\
    \n- 支持向量机\n- 朴素贝叶斯\n- 神经网络\n- 聚类分析\n- 人工神经网络\n- K 最近邻\n\n### 8.2 SDN\n\n- 自组织映射\n\
    - 支持向量机\n- 目的 IP 地址的熵变化\n- 深度学习\n- 贝叶斯网络\n\nDDoS 攻击者可以同时控制多台计算机，并在计算环境中构建一个包含控制傀儡/替身和攻击傀儡/替身的攻击架构。传统攻击架构类似于哑铃状结构。其中，中间网络主要负责数据转发，安全事件和控制功能由管理层完成，而网络本身无法检测网络攻击并处理它们。\n\
    \n## 9 跨域检测中的隐私保护\n\nPredis 中的 SDN 域是指受 SDN 架构控制的域，它位于网络域中，部署了 SDN 技术，可以由运营商独立控制。SDN\
    \ 域采用集中式方式控制数据转发。我们论文中解释的多个 SDN 域进行协作，这些 SDN 域在物理上或地理位置上可能相邻，也可能不相邻。该域的控制平面将流表发送到计算服务器上的选定位置。计算服务器提供\
    \ DDoS 检测服务，并将检测结果返回给控制器。\n\n用于流量转发的传统网络域是分布式控制，无法实现集中控制。隐私保护的跨域攻击检测通常被视为安全多方计算（SMC）问题，即在没有可信第三方的情况下，如何安全地计算一个函数[13-14]。\n\
    \nKNN 算法出现在嵌入加密步骤中。在提供训练细节之后，KNN 可以通过在训练阶段之外选择距离度量公式（Predis 中选择的是欧几里得距离）来分离测试样本。\n\
    \n## 10 模型\n\n### 10.1 系统模型/方法与威胁模型\n\n我们首先概述系统模型/方法以及 Predis 中包含的角色。然后我们介绍威胁模型，接着讨论安全性。\n\
    \n它有三种角色：\n\n- 计算服务器（CS）\n- 检测服务器（DS）\n- 软件定义网络（SDN）域\n\n域 Dn 是参与攻击检测的第 n 个域，并向\
    \ CS 和 DS 提供数据。CS 和 DS 反过来为域 Dn 提供计算和加密服务。每个域将流量信息发送到 CS 以进行计算，并从 DS 接收检测结果。CS\
    \ 提供计算服务并将中间结果发送给 DS。后者基于中间结果提供检测服务，并回复每个域的检测结果。因此，CS 和 DS 相互协作执行计算。Predis 为各个域提供准确的\
    \ DDoS 攻击检测服务，而这些域不愿意共享隐私流量信息。\n\n在这里，我们给出隐私的正式定义。由参与检测的域提供的流表知识称为隐私。重要的是，隐私包括\
    \ IP 源地址、IP 目的地址、端口源、端口目的、长度和流数据包。基本操作包括前面提到的三种角色，作为具有输入和输出的函数。每个函数旨在对实时数据中划分到特定区间的连续输入运行，Predis\
    \ 为此配备了一组 n 个输入对等方。DDoS 的示例代码如下所示。\n\n**清单 1：** 执行 DDoS 攻击导致服务不可用\n\n```\nimport\
    \ socket\nimport sys as s1\nimport os\nprint(\"DDoS Attacking: \"+s1.argv[1]+\"\
    \ Initiating...\")\nprint(\"Inject Code \"+s1.argv[2])\ndef attackFunc():\n  \
    \  s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)\n    s.connect((s1.argv[1],\
    \ 80))\n    print(\">>> GET Message /\" + s1.argv[2] + \" HTTP/1.1\\n\")\n   \
    \ s.send(\"GET Message /\" + s1.argv[2] + \" HTTP/1.1\\n\")\n    s.send(\"From\
    \ Host Initiate: \" + s1.argv[1] + \"\\n\");\ns.close()\nfor var in range(1, 10000):\n\
    \    attackFunc()\n```\n\n## 11 不同云计算服务模型中的安全性\n\n提供不同层级服务的三种云服务模型分别是软件即服务、平台即服务和基础设施即服务。\n\
    \n- SaaS——客户对安全的控制力最小，因为后端基础设施和执行平台都位于客户范围之外。\n- PaaS——在 PaaS 中，客户对部署的应用程序有一定程度的控制权，并对应用程序环境的配置设置进行远程控制。与\
    \ SaaS 相比，该框架对安全有更多控制，但比 IaaS 提供的控制要少。\n- IaaS——在 IaaS 中，客户对安全的控制力远大于其他两种模型，因为\
    \ IaaS 提供虚拟计算资源，如网络、存储设备和硬件。\n\n## 12 不同云部署模型中的安全性\n\n云计算的四种部署模型分别是公共云、私有云、社区云和混合云，客户根据适用性、需求和用户云的目的从中选择。\n\
    \n- 公共云——在此部署模型中，组织必须牺牲某些方面的安全性，因为云位于服务提供商端。客户不知道其数据的地理位置、CSP 使用的存储类型，因此该模型的安全性稍差。\n\
    - 私有云——它由单一组织或位于内部或外部的第三方拥有。该部署模型在一定程度上解决了公共云中面临的一些安全问题，但也有其困难，如资源调配、存储管理和容量监控。\n\
    - 社区云——它由具有共同兴趣的组织社区拥有。该模型的缺点是，在跨多个域和组织的数据扩散以及服务中断方面，存在许多未解决的问题。\n- 混合云——由于混合云是任意两种部署模型的组合，它兼具扩展性、成本和安全方面的优势。数据隐私和完整性在混合模型中构成威胁。\n\
    \n"
