  md: '# 7.5 Managing multiple clouds or servers


    With the ever increasing need to store any sort of data, we need an expanding
    storage. This is too costly to manage. The next solution is to manage multiple
    servers or cloud environments. This makes it really difficult to track and filter
    the data. In blockchain we can use multiple systems and solve this issue. We don’t
    require multiple servers as the data on blockchain is stored in a decentralized
    manner.


    # 7.6 Building a private cloud


    If the data or any information is highly confidential then there is a need for
    a private cloud. This is not cost effective and costly; this can be solved using
    a private blockchain. Using a private blockchain has multiple advantages such
    as select granting of access and secure data transfer. Building a private blockchain
    is much easier than having a private cloud. Maintaining the storage modules and
    the server setup is a tedious and high maintenance work.


    # 7.7 Limited features


    Not all the cloud services were made with the same features. If there is a need
    for changing any characteristic on the cloud, migration of all the data is an
    extremely long and painstaking process. Using blockchain we can decide the initial
    set of characteristics and use them. As blockchain technology is constantly evolving
    the security measures and any other features can be updated whenever required.


    # 7.8 Reliable internet connection


