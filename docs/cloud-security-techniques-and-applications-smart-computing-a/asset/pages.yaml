    in it [21].


    # 2.6 QoS driven resource management and scheduling


    Resource management can be defined as a factor which represents the efficient
    usage and maintenance of the resources. Various types of resources are mapped
    to the submitted jobs so as to schedule them in a more efficient manner. A better
    resource scheduling or provision can be achieved by using a better scheduling
    policy. By using these scheduling algorithms, we can optimize cloud services to
    achieve high level of quality of service. There are many categories of users,
    tasks and resources using which task mapping and execution is achieved [22-24].


    # 2.7 Efficient energy consumption infrastructure


    Any cloud data centre or storage consists of infrastructure in large and voluminous
    amounts. Cloud computing environment is delivering various types of services to
    enormous users by using its massive infrastructure. Cooling infrastructure is
    needed to compensate the heat which is produced by these servers. This Expensive
    infrastructure should be developed; operated and maintained very carefully as
    it produces greenhouse gases which are adverse to environmental balance. Proper
    cooling system and mechanisms are maintained by cloud centres to maintain the
    cloud infrastructure as environment friendly [25].


    # 2.8 Able distributed computing with virtualization


    In distributed and cloud computing environment, the concept of virtualization
    plays a very important role. This refers to the process of creating virtual machines
    for the various physical resources. This concept is closely related to task scheduling
    process where task queue is mapped to various virtual machines for scheduling.
    The main advantages of virtualization are cost reduction, highly scalable and
    provide elastic behaviour to the cloud computing environment [26].


    # 2.9 Cost sensitive infrastructure with better throughput


    According to cloud computing, bandwidth refers to the rate in which bits are transferred.
    This measurement is mainly useful when we are calculating throughput of the system.
    Since cloud computing environment is providing high speed transfer of data among
    systems it requires high bandwidth [27].'
