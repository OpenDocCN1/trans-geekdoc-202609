  md: 'Sirisha Potluri, Sachi Nandan Mohanty, T. Kundana, D. Abhinav, P. Sushrutha


    # Security and Privacy Preservation Model to Mitigate DDoS Attacks in Cloud


    **Abstract:** Denial-of-service (DoS) attack occurrences are among the key security
    challenges within the rising cloud computing models. Currently, a number of different
    types of DoS attacks are conducted against the various cloud services and resources,
    which target their availability, service level agreements SLAs, and performance.
    A successful DDoS attack would possibly lead to service degradation or complete
    outage. DDoS attacks will reduce the network re-sources which may result in bandwidth
    depletion. The main objective of DDoS attacks is to prevent certain users from
    accessing the services in the cloud. In this research, we propose a privacy-preserving
    cross-domain at-tacks detection scheme for SDNs. Predis may be a combination of
    perturbation encryption and encoding to guard the privacy and uses a computationally
    simple and efficient machine learning algorithm k-Nearest Neighbour (KNN) for
    its detection. Here we also improve the KNN to achieve much better efficiency.
    Through extensive simulations and theoretical analysis. The DEMO of this algorithm
    is capable to realize the detection process efficient and accurate attack detection
    by keeping sensitive information secure. Virtualization enables simultaneous sharing
    of resources from a single server to some applications or services, this induces
    a certain amount of threats and security issues for the cloud. This module focuses
    on identifying challenges related to cloud security and tries to introduce ways
    in resolving these issues


    **Keywords:** Denial-of-Service, KNN, Software Defined Networks, Cryptography,
    Virtualization, Cloud Security, Cloud Privacy


