  md: 'Software-Defined Networks (SDNs) have emerged as a new communication paradigm,
    released from direct integration into traditional networks and provides a system
    and network flexibility through a sensible network controller. SDNs contain a
    data plane, a control plane, and an application plane. The control plane contains
    some controllers that use the logic control strategy and maintain the entire network
    view as logic-centric. Administrators remove all network views from network services
    and provide an easy-to-use interface for providers, researchers, or third parties
    to facilitate these employees to customize transaction plans and see reasonable
    network management. SDNs users do not have to worry about the technical details
    of the device below, a simple system can detect the fast delivery of new applications


    Advanced control features and systems enable SDNs to be exposed to known as Distributed
    Denial-of-Service (DDoS) attacks. For example, the controller, which plays a very
    important role in determining the performance of each component in SDNs, is the
    main target of DDoS attacks. A compromised controller can lead to the misconduct
    of all the switches under their control. Denial of service (DoS) attacks can run
    out of system resources on a targeted computer, stop services, and leave its normal
    users inaccessible. When hackers use two or more compromised computers as a “doll
    machine” to launch a DDoS attack on a particular target, it is called a DDoS attack.
    The IP address of the grinding machine and the composition and type of attack
    package are not set, making it difficult to locate the attacker.


    DDoS attacks have become a major threat to the Internet today and attacks make
    online services unavailable to large victims on the road from multiple attackers.
    With the number of businesses offering their services online growing exponentially,
    a DDoS attack could lead to significant financial losses. A recent report reveals
    that DDoS is attacking a 22% data recovery account for 2015 [3-4].


    DDoS attacks work in three steps, namely scanning, logging in, and launching attacks.
    The unusual mobility of DDoS attacks often affects multiple paths and network
    domains. The paper also deals majorly with KNN models which will be improvised
    to detect attacks.


    Cloud computing is one form of distributed system containing a set of virtual
    machines that can be dynamically provisioned to meet the changing requirements
    of resources by the customer. The cloud-customer relationship is governed by the
    service level agreement (SLA).


    Overhead of physical installation and maintenance of such a huge system issue
    is relieved by the cloud thus reducing the overall costs and also increases efficiency.
    Virtualization in cloud computing assumes Service-Oriented Architecture (SOA)
    that enables the transformation of customer requirement problems into services
    thus benefitting the idea of cloud computing. The cloud customer has to depend
    on the Cloud Service Provider (CSP) for security and privacy of their information.'
  merge: -1
  img_proc: true
