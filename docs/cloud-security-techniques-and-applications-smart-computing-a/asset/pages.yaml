  md: '# 11 Security and Privacy Related Issues in VANET


    Various security schemes have been used to safeguard privacy based on the security
    mechanisms they use, these schemes can be classified as:


    +   - Pseudonyms coupled with public key infrastructure (PKI)

    +   - Trust-based schemes

    +   - Group signatures


    # 11.1 Pseudonyms coupled with PKI-based schemes


    Pseudonyms preserve and protect the privacy of the users. It hides the original
    identity of the user and avoids any kind of link ability of the identity with
    a pseudonym. However pseudonyms can reveal the true identity in case the user
    commits any type of illegal activity hence providing traceability in case of any
    wrong actions.


    The disadvantage of the pseudonym scheme is that the On Board unit has thousands
    of pseudonyms stored which need to be refreshed on a timely basis. The pseudonyms
    are continuously changed in order to maintain the privacy of the user.


    The pseudonyms need to maintain CRL. CRL stands for Certificate Revocation List.
    This list keeps information of all the vehicles that are unreliable and untrustworthy.
    This list needs to be checked continuously which can be both time consuming as
    well as resource consuming. The certificate authority termed CA links the pseudonyms
    to the vehicles and hence it must be kept secure in order to maintain the privacy
    of the users.


    # 11.2 Trust based schemes


    Trust-based schemes have been proposed for MANETs. The same has been applied to
    VANETs as well. In VANETs it includes a large number of nodes and as the vehicles
    move very quickly the topology keeps on changing quickly. So it becomes difficult
    to maintain the trustworthiness of the vehicles.


    In VANETs the purpose is to increase road safety and hence the decision-making
    process needs to be very fast due to the high speeds and limited amount of time
    involved. Trust establishment is done through central authority or by means of
    security infrastructure. Security infrastructure requires development of a trust
    score dynamically. The trust score needs to be maintained and checked.


    Protection against inside attackers gets difficult in trust based schemes when
    a group of vehicles combine together to form a network. In order to solve this
    issue data centric trust schemes have been proposed. In this a false node can
    be determined easily based upon the information exchange of whether they are forwarding
    the wrong kind of data. This kind of false node can be reported and ignored.'
