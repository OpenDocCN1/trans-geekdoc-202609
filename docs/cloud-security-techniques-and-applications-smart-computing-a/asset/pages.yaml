  md: 'I. Indrani, SVB Revanth, S. Akhil Durga, Sirisha Potluri, Sachi Nandan Mohanty


    # Internet of Cloud: Secure and Privacy Preserving Cloud Model with IoT Enabled
    Service


    **Abstract:** Security and safety are among the critical difficulties of Internet
    of Things (IoT). Updating inappropriate gadgets, the lack of productive and powerful
    security meetings, customer ignorance, and viewing a well-known powerful gadget
    are some of the problems IoT faces. In this work, we explore the basis of IoT
    frameworks and security efforts, and we see other safety and security matters,
    methods used to verify IoT-based components and structures, security arrangements
    in place, and the best protection models are important and suitable for the various
    layers of IoT-operated applications. In this work, we have proposed another embossed
    IoT model: standard and expanded with security and safety components and layers
    of physical evidence. The proposed cloud/edge IoT framework is developed and tested.
    The background below spoke to IoT centres created via Amazon Web Service (AWS)
    such as Virtual Machines. The centre layer (edge) has been developed as a resource
    unit for Raspberry Pi 4 with the help of Greengrass Edge Environment in AWS. We
    used cloud-enabled IoT weather in AWS to create the top layer (cloud). Security
    meetings and basic management meetings were among all these areas to ensure the
    security of customer data. We have verified security announcements to allow data
    to flow between layers of the proposed cloud-enabled model. Not only does the
    proposed framework model eliminate the perceived security vulnerabilities, but
    it can also be used alongside the best security measures to combat network security
    risks facing all the latter layers; cloud, edge, and IoT


