- pgno: 51
  md: '![](img/09fa00ca1419044515be1e45aa422bc8_51_0.png)


    Fig. 4: The workflow of a blockchain


    Firstly, a transaction is initiated by a participant and it is broadcasted to
    the other participants in the network. The participants who get this transaction
    use the digital signature to check the authentication of the transaction. After
    the verification, the transaction is attached to the list of authentic transactions
    in the participant’s respective ledgers. To register the authentic transactions,
    the participants in the network work to mine the new block, i.e., finding the
    nonce of the block. Once a participant finds a valid nonce, they can mine the
    block that contains the concerned transaction. The other participants then check
    the trans-actions in the received block by analysing the Merkle root, and once
    the transactions in the newly mined block are authenticated and have not been
    tampered with, the new block is appended to the local replica of the blockchain.
    Once this entire procedure has been completed, the newly mined block can be appended
    to the current blockchain [21]. Sample code for blockchain as a service to declare
    the data of transactions and blockchain mining is given as below.'
