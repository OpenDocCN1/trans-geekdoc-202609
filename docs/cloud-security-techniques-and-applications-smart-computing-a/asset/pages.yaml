  md: '# 1 Introduction


    The practice of employing a network of remote servers hosted on the web to store,
    manage, and process data, instead of a local server or a private computer is called
    cloud computing. It is a pay-for-use model. Cloud computing can be considered
    as the future of the emerging technologies because of the combination of emerging
    technologies like virtualization and service oriented architecture. Based on the
    deployment models there are various types of clouds [1].


    +   - Public/Internet Cloud

    +   - Private/Enterprise Cloud

    +   - Hybrid/Mixed Cloud

    +   - Community Cloud


    Public cloud is designed for a substantial set of public clients, Private clouds
    services are available only for the cloud owners. The combination of two or more
    clouds can be considered as hybrid cloud where in the two clouds can be either
    public or community or private clouds, broadly community clouds services are shared
    between several organizations.


    Cloud provides services using various models like Software as a Service, Platform
    as a Service and Infrastructure as a Service.


    +   - SaaS: It provides user access to software applications. These software applications
    which are present in the cloud are used for an enormous range of tasks.

    +   - PaaS: It provides all the hardware and software components that are required
    to build cloud-based applications.

    +   - IaaS: It dispenses services like storage, security tools, and networking
    for end users.


    Several critical security attacks are designed and proposed against various cloud
    deployment models which pose severe security risks to the adaptor. Attacks such
    as wrapping, malware injection, and other attacks can be conducted against cloud
    computing. One such security attack is the Denial of Service (DoS) attack. It
    is an event or malicious behaviour that mitigates or prevents the cloud’s security
    to perform its expected functions and services. A distributed form of DoS attack
    is called a Distributed Denial of Service (DDoS) attack which applies numerous
    network hosts to inflict more effects on the dupe [2].


    DDoS attacks can be classified into the subsequent categories


    +   - Attacks on Bandwidth

    +   - Physical Disruption.

    +   - Limitation Exploitation

    +   - Attacks on Connectivity

    +   - Exhaustion of Resources

    +   - Process disruption

    +   - Data corruption'
  merge: -1
  img_proc: true
