    # 12.1.2 Integrity


    It certifies that message should be valid and the contents of the message are
    not adjusted during communication process.


    # 12.1.3 Availability


    Whenever the vehicle requires some data resources they must be available.


    # 12.1.4 Authentication


    In this the VC will be protected by authentication from suspected nodes by checking
    the user identity and sender address.


    # 12.1.5 Privacy


    The vehicles or passengers will be protected from the attackers by the sensitive
    and confidential information.


