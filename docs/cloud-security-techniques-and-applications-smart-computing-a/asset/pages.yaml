    security and privacy issues. Due to these reasons of security and privacy, cloud
    computing is taking slightly a back step apart from its wider adoption. Machine
    learning based cloud computing models and approaches gives next generation privacy
    and security in computing platforms [17].


    # 2.2 Performance and its measurement


    In cloud environment, this issue is very much important as it is one of the measuring
    techniques in computing environment. Performance is a major concern in cloud system
    which affects the delivery of various services, revenue generated due to service
    delivery and the number of customers involved in the process [18].


    # 2.3 Attentive solutions through reliability and availability


    Reliability defines the certain expected functioning of the system under selected
    time interval and with given conditions. Availability of any system can be defined
    as degree in which the set of resources are available and these available resources
    are used whenever and wherever there is a need. These two factors comes together
    and defines the strength and potency of the system [19].


    # 2.4 Accustomed solutions through scalability and elasticity


    Scalability can be defined as its ability to adapt to the changes. When there
    is a need of resources by various cloud users, the system should take care of
    workloads efficiently. Elasticity of the system can be defined as the factor up
    to which it can handle the workloads efficiently. Elasticity ensures allocation
    and deallocation of resources to handle the needs of on demand users [20].


    # 2.5 Adaptive solution through interoperability and portability


    Interoperability of cloud computing environment can be defined as the power or
    ability which is adopted by the system to run various services which are from
    various vendors. Its associated factor interoperability can be defined as the
    way in which different platforms are effectively used among different cloud service
    providers. Portability is an important factor which defines the ability to transfer
    the related'
