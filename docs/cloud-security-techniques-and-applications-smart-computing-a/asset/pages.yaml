  md: '# 7 Summary of Our Contributions Using KNN


    +   - We recommend Predis, a DDoS privacy protection program for SDNs privacy,
    which looks at both the detection of DDoS attacks and privacy protection in multi-party
    partnerships. Predis uses SDN features and an improved KNN algorithm to detect
    DDoS attacks accurately during real-time and integrates digital cryptography and
    perturbation encryption to provide each participant’s privacy and confidentiality.

    +   - We attest to Predis’s security in the asymptotic form of computer security
    in modern cryptography. By strict security analysis, we confirm that the traffic
    data provided by each participant is inseparable from its potential adversary.

    +   - We do extensive research using the most authoritative data sets to show
    that Predis is timely and accurate. We show that our system can not only determine
    if traffic is normal, but can also detect unusual traffic at the beginning of
    a DDoS attack. The results show that Predis is more accurate than the existing
    adoption schemes, which currently protect participant’s privacy. A detection attempt
    restricted within one domain would be unable to spot the attacks at their primary
    stages. Thus, the involvement of multiple domains in attack detection will help
    to realize more accurate and timely detections.


    # 8 Summary of DDoS Attacks Detection Methods


    There are no. studies on DDoS attack detection because of the prevalence and severity
    of DDoS attacks. So we briefly summarize related work from 2 perspectives, i.e.-DDoS
    attacks detection in conventional networks and DDoS attacks detection in SDNs.
    Detection approaches of DDoS attacks have been researched exceedingly in conventional
    network models [11-12].


    # 8.1 Conventional network entropy


    +   - Support Vector Machine

    +   - Naive Bayesian

    +   - Neural Network

    +   - Cluster Analysis

    +   - Artificial Neural Network

    +   - K-Nearest Neighbours'
