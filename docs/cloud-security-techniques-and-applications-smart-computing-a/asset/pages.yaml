  md: '# ## 5.2 Increased uptime


    Cloud enables its users to continuously have the latest and state of the art version
    of the software for its users. So, at whatever time the software is improved or
    updated for better quality, everyone is benefitted by getting the updates immediately
    and right away.


    # ## 5.3 Standardization


    Standardization improves the consistency of the resource utilization and usage
    by streamlining the business practices and creation of standardization across
    the entire operation.


    # ## 5.4 Faster implementation


    Due to faster implementation of cloud customer requirements, time and money are
    saved.


    # ## 5.5 Agility


    Due to agility entire manufacturing process involves less operational cost by
    using cloud manufacturing model.


    Cloud computing system can be divided into three categories according to manufacturing
    resources are follows:


    +   - Service oriented and adapted input

    +   - Operating and working platform of the manufacturing resource

    +   - Service oriented and adapted output


    There are three categories of key stake holders in cloud manufacturing system.
    They are:


    +   - Providers

    +   - Operators

    +   - Consumers


    Providers will publish their resources to cloud manufacturing platform, the operators
    manage all aspects of platform that are relevant to the platform running and operation,
    and the consumers requests the services from cloud platform.


    A cloud based manufacturing platform consists of five layers as shown in fig.
    3. They are:


    +   - Business planning'
  merge: -1
  img_proc: true
- pgno: 197
  md: '+   - Manufacturing operations management

    +   - Automation and control

    +   - Sensors and actuators

    +   - Production process


    ![](img/09fa00ca1419044515be1e45aa422bc8_197_0.png)


    **Fig. 3:** Layer wise architecture of cloud based manufacturing platform


    Cloud manufacturing is facing many challenges due to its integration with many
    technologies. Cloud computing ensures high performance using semantic web, internet
    of things and embedded systems. Several technical issues must be solved such as
    cloud management engines, collaboration between cloud manufacturing applications,
    knowledge base resource clouding and visualization and user interface in cloud
    computing environments [17-18].'
  merge: -1
