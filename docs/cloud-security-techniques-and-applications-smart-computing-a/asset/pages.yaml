- pgno: 198
  md: '# # 6 Security and Privacy Aspects of Cloud Manufacturing


    Security in cloud computing is a set of control based integrated technologies
    & policies aimed to stick with the regular organizations, rules and protect/guard
    data application and cloud technology infrastructure. Due to efficient resource
    sharing, cloud security gives main problem to identity management, access control
    and privacy. The data in the cloud should be stored in an encrypted form. It processes
    the security control in cloud and provides customer data security, compliance,
    and privacy with necessary regulations.


    # ## 6.1 Security challenges in cloud manufacturing


    Cloud provides all its resources to many organisations in the subscription manner.
    Though it has many advantages cloud needs to address many challenges as given
    below.


    # ### 6.1.1 Reliability


    The consumers’ data are stored in third party’s server. They do not know where
    or which location their data are being stored. They are not aware of what security
    mechanisms provided to safeguard their data.


    # ### 6.1.2 Privacy


    All the cloud users store their data in the cloud and that is stored in some of
    the physical machines in various places around the world. All the data is being
    transferred through the internet.


    # ### 6.1.3 Data loss


    Data loss is the one of the most security challenge in the cloud computing. If
    any cloud user stores the important data in the cloud, we need to concern about
    the security issues. If the data is lost through natural disasters or accidents
    or through the DDoS it leads to disastrous to the organisation.'
  merge: -1
  img_proc: true
- pgno: 199
  md: '# 6.1.4 Bandwidth


    When there is high demand of the resources or high volume of data is to be stored,
    then high bandwidth is required.


    # 6.1.5 Availability


    At sometimes, when the huge amounts of resources are to be served at a time, then
    the cloud becomes unable to give all the consumers’ demands.


    # 6.1.6 Integrity


    Cloud need to ensure the correctness and trustworthy of the consumers data. The
    data should not be modified, maliciously fabricated, deliberately deleted or tampered.


    # 6.1.7 DoS


    Denial of Service attack thrown by malicious users by selecting/choosing a victim
    machine and by sending the bulk requests to the virtual machines at the same time,
    then the services will not be made available to the reliable and true users.


    # 6.1.8 Authentication


    Every cloud user should be checked and authenticated before accessing the cloud
    resources.


    # 6.1.9 Access control


    The cloud users or consumers need to be categorized and given permissions according
    to the type of the cloud users.


    Cloud service providers like Google cloud platform, Microsoft Azure, Amazon web
    services are providing the best sources to the users to shift to the cloud computing.
    And users need not worry about their data security, because it’s being maintained
    by set of policies and protocols, virtual machines and data security as per the
    rules and regulations.'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# 6.2 Significant factors effecting security in cloud system


    Significant factors effecting security in cloud system are confidentiality, integrity,
    and availability.


    # 6.2.1 Confidentiality


    Confidentiality is very important using which our data is not accessible to unauthorized
    parties. It means that the sensitive data is accessible to only the authorized
    persons. A failure in maintaining confidentiality means that unauthorized person
    has the access to all the required sources provided by the provider which will
    be caused due to intentional behaviour or by accident. This failure is known as
    confidentiality failure or breach. Once the confidential data is leaked like bank
    details it leads to high risks.


    Requirements of confidentiality are divided into two categories namely data confidentiality
    and virtualization confidentiality.


    # 6.2.1.1 Data confidentiality


    Cloud providers provide many online services to store the cloud user data. This
    may sometimes result in potential loss of data security and confidentiality. When
    the data is shared in a group using a distributed cloud storage service, the client
    should get periodic update regarding the data changes by any user in the group.
    They are many more interesting things by knowing the contents of the cloud user
    as well as the cloud user’s access account and privilege information.


    # 6.2.1.2 Virtualization confidentiality


    In infrastructure as a service, cloud service provider hosts virtual machines
    when there is a requirement from cloud users or customers. In cloud system, anyone
    with the privileged access can read or change the deployed service. This means
    that the total virtualization layer induces some security issues by considering
    all cloud security related issues. Virtual machines allows elastic scaling, fault
    tolerance, hardware pooling, easy maintenance, load balancing, and resource maintenance.


    # 6.2.2 Integrity


    Integrity is asset that promises the data or information is not been modified
    by any third-party personnel who is not an authorized individual for such activity.
    Thus the correctness and accuracy of an asset is with respect to its owner to
    ensure integrity. Usually delete, edit, and append operations are believed by
    the change in integrity.'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'Consequently all the web related attacks are highly prevailing in cloud environment
    that can alter or change the contents of the virtual machine metadata, databases,
    user files/log files, and WSDE files.


    Integrity requirements are divided into two categories namely data integrity and
    virtualization integrity.


    # 6.2.2.1 Data integrity


    Cloud scheme allows decent number of data centric operations and tasks with very
    huge data requirements where huge refers to terabytes and petabytes. Thus data
    reliability challenges related with the PaaS (platform as a service), DaaS (data
    as a service) etc. needs to be handled very carefully. Some of the cloud specific
    data integrity issues are as follows:


    +   - Data transfer/outsourcing

    +   - SQL injection

    +   - Cross scripting

    +   - Metadata Spoofing attack

    +   - Wrapping attack


    # 6.2.2.2 Virtualization Integrity


    As we have discussed in the earlier section, the virtualization layer it has of
    its own security related challenges and issues which are not limited with privacy
    and security but also integrity of the virtual machines. Some of the cloud specific
    virtualization integrity issues are as follows:


    +   - Cloud Service Provider administrators

    +   - Virtual Machine replication

    +   - Virtual Machine rollback

    +   - Virtual Machine escape

    +   - VM hopping


    # 6.2.3 Availability


    Availability is one of the significant aspects of security that has to be maintained
    and preserved by the cloud service provider. Diverse business enterprises and
    initiatives who use the cloud based services to serve and work for their customers
    must guarantee the highest availability of these services. Even a smallest amount
    of downtime or stoppage of the service can result into a large financial loss
    which is irredeemable.


    This availability requirements are divided into two categories namely data availability
    and virtualization availability'
  merge: -1
  img_proc: true
