  md: '# 4 DDoS Mitigation Techniques


    DDoS mitigation techniques help us in effectively combating the attacks. Few of
    the mitigation techniques are as follows:


    # 4.1 Reducing attack surface


    Reducing the services which will be attacked limits the choices for attackers.
    Using Firewalls and Network Access Control Lists will allow only necessary traffic,
    to necessary ports from essential hosts only. Considering the case of web servers,
    they permit traffic from anywhere to port 80 of your webserver. And in such cases,
    one should further take other protective measures. Even for the websites which
    are accessible across the web, one can reduce the area by restricting traffic
    to countries where users are located.


    # 4.2 CDN’s


    CDN’S distributes the content and boosts the performance by minimizing the space
    between resources and between the end-users. It stores the cached version of the
    content in multiple locations and this eventually mitigates DDoS attacks by avoiding
    one point of failure, when the attacker is trying to pivot on a single target.


    # 4.3 Black hole routing


    As the name propounds, black hole routing, with none of the filtering routes both
    legitimate and malicious traffic route to a null route or black hole where the
    traffic will be dropped from the network. Depending on the pattern, if one can
    identify the attacker, then the packets are often filtered and can be routed back
    to the black hole.


    # 5 Stages of DDoS Mitigation


    # 5.1 Detection


    Initially there is a need to detect if an attack is present or not. At this phase,
    there is a need to identify the legitimate traffic and malicious software. In
    the event of mitigating DDoS one shouldn’t drop potential customer traffic which
    would be disastrous.'
  merge: -1
  img_proc: true
