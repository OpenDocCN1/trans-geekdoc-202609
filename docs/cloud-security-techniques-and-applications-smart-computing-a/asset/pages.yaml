    new heights and like all precious resources, even data requires security and privacy.
    Unfortunately, this is an issue that concerns many cloud computing users as the
    data proprietors cannot have complete control over certain aspects like the location
    of the data storage and access permissions. Blockchain Technology, one of the
    emerging technologies can be used to complement the issues concerning cloud users.
    This technology provides features like decentralization, distribution, authenticity,
    immutability, trust, etc. that can be used to face the threats of data integrity.
    In this chapter, we will address the issues concerning the security and privacy
    of the data in the cloud model and how the features of the blockchain technology
    can enhance the integrity of this model. Although, there are certain limitations
    like high latency and low throughput, decreasing the practical utility of blockchain
    technology


    **Keywords:** Security, Privacy, Cloud, Decentralization, Integrity, Blockchain
    Technology


