  md: '# 9 Security & Privacy


    Data privacy makes sure that data is used appropriately and data is available
    to those who have authorized access. Privacy can be interpreted as an individual''s
    right to determine to what extent information is communicated and how it is communicated
    to others.


    The two main classes of data privacy are:


    +   - Data is shared or released with third parties. This includes data collection,
    privacy-preserving and data integration data sharing and publishing.

    +   - Privacy-preserving data mining.


    A great deal of study has been carried out on the subject of privacy security,
    and in recent years there have been many significant review articles reviewing
    data privacy taxonomy, privacy protection mechanisms, proposed architectures,
    and data privacy protection methods; their advantages and disadvantages have been
    published. Suggested data privacy security techniques can be categorized into
    initial approaches, mathematical analysis, soft computing based on information
    and machine learning methods.


    Privacy issue is one of the major threats in addition to loss of data, malicious
    modification, server crash are some examples of cyber threats such as Yahoo''s
    three billion accounts exposure by hackers in 2013.


    We proposed CNN based data privacy protection approach to ensure better quality
    standards in cloud computing environment. The extraction and inference phases
    of the function are divided here and the former takes place locally, while the
    latter takes place in the cloud. In this way, during the function extraction stage
    on the edge node, confidential information is extracted from the data and data
    transmission rates to the cloud are reduced. The privacy-preserving issue in the
    processing of data classification is taken into account through the application
    of deep neural networks. The CNN (Convolutional Neural Network) algorithm is used
    here as a deep neural network. Here, both in the learning and classification processes,
    a law-degree non-linear polynomial is replaced to obtain the high precision activation
    function. A classical deep neural network (with the ReLU activation function)
    is retained to provide data privacy security for the training process, after which
    the network changes only when it is used for classification. Combining the above
    polynomial approximation with batch normalization is the theoretical main innovation
    of this work.


    In order to effectively solve the data privacy protection problem, encrypted storage
    of cloud data is a very outstanding solution. After encryption, the data is stored
    in the server provided by the cloud service provider in the form of cipher text,
    and in the meantime, the server is also required to return the data to the user
    when the user requires it. When the user needs to use the data frequently, it
    requires a lot'
