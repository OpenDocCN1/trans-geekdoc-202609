- pgno: 193
  md: 'SaaS- Software as a service makes use of all the software services through
    the internet, they are like paid and use purpose. By using this SaaS, we do not
    need to install any other kind of software applications on your computer. All
    these software applications are available on the cloud and we can access them
    through the internet when you require them.


    PaaS- Platform as a service is one of the cloud computing service which uses virtualization
    technology for the development platform for the cloud users and the organizations.
    This platform is also include the memory, databases, computing, storage, and also
    some other application development services. PaaS is mostly useful for the environment
    for developing and the testing the applications. The main advantages of this platform
    as a service is that it has no need to purchase hardware, no need to spend more
    time, it will be speed up your applications, any person can just login and use
    the applications from anywhere, and has high security for the data being stored
    in it and no need to worry for the data loss [6-9].


    # 3 Manufacturing Cloud Organization Models


    Depending upon the deployment, cloud is divided into four models namely public
    cloud, private cloud, hybrid cloud and community cloud.


    Public Cloud- Public cloud provides all the resources to the cloud users and the
    resources can be accessed by everyone through the internet. Examples for the public
    cloud is Microsoft Azure, in public cloud you can share same storage and hardware
    with other organisations. The key benefits of the public cloud are security, flexibility,
    controllability and cost effectiveness.


    Private Cloud- Private cloud allows the resources only with the specific or selected
    users instead of using them by all public users. It solves the security issues
    of public cloud with the help of dedicated resource usage. The main advantages
    of this private cloud are increase in security, efficient performance and competent
    capability.


    Hybrid Cloud- Hybrid cloud is a combination of both public cloud and the private
    cloud. This type of cloud suits when an organisation uses the public cloud and
    private for various requirements and demands. The advantages of the hybrid cloud
    are flexibility, backup clouds, cost saving, security for the sensitive data.


    Community Cloud- Community cloud shares the computing services to the mainly targeted
    or some organisations. This type of cloud computing is also used for the business
    organisations, research organisations and tenders and also heads of trading firms.
    The main advantage of this community cloud are availability, reliability, security
    and improved service provisioning [10-13].


    Manufacturing cloud provision and organization models are represented in the following
    fig. 1.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '![](img/09fa00ca1419044515be1e45aa422bc8_194_0.png)


    **Fig. 1:** Manufacturing cloud provision and organization models


    # 4 Cloud Manufacturing Paradigms


    Cloud manufacturing is a parallel, thin, networked, interacted and distributed
    system that includes an interlinked and integrated virtualized service pool of
    manufacturing resources. This paradigm has the ability of intelligent management
    and controlling of on demand use of services by providing solutions for all kinds
    of users that are included in entire lifecycle of manufacturing [14-16]. The idea
    of cloud manufacturing implies to a paradigm which includes the entire lifecycle
    of a product like production, simulation, designing, test and maintenance. Applications
    of cloud based manufacturing are fabricated metal products, automobile manufacturing,
    housing, building'
  merge: -1
  img_proc: true
