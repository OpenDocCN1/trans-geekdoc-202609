  md: '# 1 Introduction


    # 1.1 Cloud computing


    Cloud computing is a new distributed and computing technology using which we can
    achieve enhancement in the use of virtualized resources. These virtualized resources
    are designed for the service provisioning of the end users in the dynamic cloud
    environment in order to provide reliable and trusted services to cloud users all
    the time. The main advantage of cloud computing environment is that we can improve
    and optimize the utilization of physical resources as much as possible. The beauty
    of this technology mainly lies by applying abstraction and isolation of physical
    resources so as to reduce the requirement of the hardware equipment. To handle
    the dynamic tasks which are highly based on the demand, the cloud computing is
    making use of virtualization. Virtualization is the technology using which many
    virtual machines for a given single physical resource/server can be created to
    handle/execute the multiple tasks. Resource management plays an important and
    vital role here because of this dynamic provisioning of the resources to handle
    the on demand service requirement of the cloud computing environment. The main
    objectives of the resource management are to maximize the utilization time of
    resources, to reduce the task execution time, to achieve high system throughput
    and to improve load balancing. In any cloud system architecture mainly there are
    three main modules namely application (source for task submission), mapping algorithms
    (uses various algorithms to map the submitted tasks to physical resources) and
    virtual machine. Using mapping algorithms a set of cloudlets are mapped to resources
    by estimating the expected time of completion of cloudlets and then execute the
    cloudlets on selected resources [1-2].


    # 1.2 Machine learning


    Machine learning based systems were proved as best solutions to every alternative
    in far and wide. Foremost cloud service providers like Amazon internet services,
    Microsoft azure, and Google cloud implements machine learning for their enterprise
    level security. All major cloud service providers use totally different machine
    learning systems which are different from one another in terms of their functionality
    and hierarchy [3].


    # 1.3 Advantages of machine learning systems on the cloud


    The advantages of the machine learning systems on the cloud are summarized as
    below [4-5].'
  merge: -1
  img_proc: true
