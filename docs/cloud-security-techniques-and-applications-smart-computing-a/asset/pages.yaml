  md: 'Therefore, clearly there should be goals for the information security that
    should be satisfied which are:


    +   - C – Confidentiality

    +   - I – Integrity

    +   - A – Availability


    Confidentiality means making sure that the information that has to be kept secured
    is secured and there shall be no access for unauthorized users to read the information.
    Integrity means making sure that unauthorized users cannot modify or destroy the
    information. Availability means making sure that authorized people are not prevented
    from accessing the information.


    Cloud architecture and its disparity from standardized traditional onsite system
    makes the identification and separation of different aspects in cloud security
    an arduous task.


    This module is an attempt in exploring various security challenges and proposing
    suitable solutions for cloud security.


    # 2 Literature Analysis


    In the DDoS attacks, the attacker dispatches an order to a system called as command
    and control server (C&C server) which will coordinate and trigger a botnet. Generally,
    a botnet can be considered as a set of compromised hosts, which obscure the attacker
    by providing a level of indirection. The C&C server orders the botnet to launch
    a DDoS attack against the victim (server), and afterward, the bots will direct
    the attack packets to the victim whose content depends on the type of attack.
    Thus, the attacker host is separated from its victim by one or by tons of intermediate
    layers of zombie hosts. A zombie or bot is a compromised computer under the control
    of an attacker who controls many other machines which altogether form a botnet
    [5-7].


    # 3 Classification of DDoS Attacks


    Distributed denial-of-service attacks can be categorized based upon on its various
    features and origin of an attack. DDoS attacks can be categorized as external
    DDoS attacks and internal DDoS attacks [8-10].'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# 3.1 Various types of external and internal attacks


    # 3.1.1 External attacks to internal attacks


    In this case, the botnet which performs the attack comes from an exterior target
    system. The attack can target a net entrée of the Cloud infrastructure or the
    servers. If a specific client in a virtual machine becomes a victim of an attack,
    it’ll also affect the opposite virtual machines present on the equivalent server
    of the Cloud.


    # 3.1.2 Internal attacks to external attacks


    In this case, the attack can tackle by taking possession of a virtual machine
    that is running within the Cloud. This can be done with a Trojan horse. A Trojan
    horse is malicious software or a code that can take control of the system. The
    choice of which depends on the customer’s virtual machine to infect is important
    because if a customer owns a large number of virtual machines, the Trojan horse
    can probably spread all over the virtual machines, thus forming a botnet.


    # 3.1.3 Internal attacks to internal attacks


    In the Cloud infrastructure, an internal botnet is formed which can attack another
    target inside the system such as a single virtual machine or a bunch of virtual
    machines. All the Cloud infrastructures may break down under these kinds of attacks.
    Different kinds of attacks approach different types of attackers where each type
    of attack scenario correlates to a particular attacker with a specific location
    and goals.


    # 3.2 Classifications of DDoS attacks


    # 3.2.1 Protocol vulnerability exploitation


    These attacks take advantage of the known weaknesses which are present in the
    protocol such as flaws in design or implementation of triggers, inappropriate
    activities, and can change the data that goes to and from a particular goal. Depending
    on the design certain protocol steps might be created to check the potential for
    DoS attacks.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# 3.2.2 Malformed packets


    A malformed packet attack are often launched against many protocols. For instance
    malformed packet attack against IP protocol. In IP packet options attacks, malformed
    packets can randomize the optional fields which are within an IP packet and can
    set all the standard of service bits to at least one, which could cause more processing
    within the victim for packet handling


    # 3.2.3 Flooding attacks


    Flooding attack is also called Bandwidth distributed Dos (BW-DDoS), the attacker
    tries to flood the victim with unwanted traffic to prevent legitimate traffic.
    Based on the type of protocol flooding attacks differs. Few of the strong attacking
    agents include privileged zombie which has control over its host whereas weak
    agents include programs that are downloaded automatically and run in sandboxes.


    # 3.2.4 Amplification attacks


    They are the devastating version of reflective DDoS attacks. They utilize the
    inherited nature of network protocols to increase the amount of traffic that is
    reflected in the victim. As a result, the traffic that reaches the victim is amplified
    by the reflector server. Amplification DDoS attacks are created by the amplification
    through flow multiplication attacks or through payload magnification where a large
    number of responses are reproduced or response messages bigger than the corresponding
    requests are issued by the reflector


    # 3.2.5 Reflective attacks


    Another method that’s applied by the DDoS attackers is the reflective method.
    This method helps the attacker to send traffic to the victim indirectly and helps
    the attacker to stay undetected. During this method, all attack packets, which
    the attacker sends contain the IP address of the victim within the source address
    field of IP packets.


    Classification of DDoS attacks is given fig. 1.'
