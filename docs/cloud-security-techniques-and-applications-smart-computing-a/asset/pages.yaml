  md: '# 4 Privacy


    Privacy and security often confuse words. Data security ensures that data is available
    when those with authorized access need it. Data privacy ensures that data is used
    properly. Privacy is defined as the individual’s right to determine how and to
    whom information is transmitted. Data privacy can be protected by restricting
    access to data through access control methods or by anonymously disclosing information.


    A lot of research on the topic of privacy protection has been done and in recent
    years, there are a number of important review topics that analyse data confidentiality,
    privacy protections, proposed structures, and data privacy measures; their pros
    and cons are published. Suggested methods of data privacy protection are divided
    into initial methods, statistical analysis used, helpful computer-based information,
    and machine learning methods.


    The privacy of artificial intelligence can be violated by blocking communication
    channels and accessing corporate private networks. In the area of artificial intelligence,
    there are three major privacy risks that have taken place including privacy issues,
    identity theft crimes, and unauthorized signs transmitted by criminals. Therefore,
    it is important to focus on privacy while using AI networks in business and companies
    should ensure that they only use independent networks rather than third parties
    [12].


    In order to effectively solve the data privacy protection problem, encrypted storage
    of cloud data is a very outstanding solution. After encryption, the data is stored
    in the server provided by cloud service provider in the form of ciphertext, and
    in the meantime, the server is also required to return the data to user when the
    user requires. When the user needs to use the data frequently, it requires a lot
    of network bandwidth and user’s time to conduct communication with the server
    and realize data encryption and decryption, which will significantly reduce the
    usability of cloud computing.


    In the meantime, after the encrypted data stored in cloud server has developed
    to a certain scale, effective retrieval of encrypted data has become a new problem
    that needs to be solved, while the traditional information retrieval technology
    can no long satisfy the requirement of mass data retrieval in the cloud storage
    environment.


    The homomorphic encryption technology is an encryption method which can directly
    process the encrypted data, and it can effectively protect the security of user’s
    data content, which has very broad development potential under the background
    of cloud storage application.


    By utilizing the homomorphic encryption algorithm, it can not only ensure that
    the encrypted data won’t be statistically analysed to decrypt corresponding plaintext,
    but also conduct homomorphic operation (such as addition and multiplication) to
    the ciphertext, while maintaining corresponding plaintext order of this ciphertext
    during operation.'
