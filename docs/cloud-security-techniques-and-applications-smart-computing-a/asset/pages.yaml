- pgno: 71
  md: '# ## 8.2 SDNs


    +   - Self-organizing map B

    +   - Support Vector Machine

    +   - Entropy variation of the destination IP address

    +   - Deep Learning

    +   - Bayesian Networks


    The attackers of DDoS can simultaneously control several computers and make an
    attack architecture that contains control puppets/dummies and attack puppets/dummies
    in the computing environment. The traditional attack architecture is analogous
    to the dumbbell shape structure. Wherein an intermediate network is mainly responsible
    for data forwarding, security events and control functions are done by the management,
    while the network itself can’t detect network attacks and deal with them.


    # ## 9 Privacy Preserving in Cross-Domain Detection


    A SDNs domain in Predis refers to the controlled domain which is under SDNs architecture,
    which is in the network domain along with deployment of the SDNs techniques and
    can independently get controlled by operators. The SDNs domains conduct a centralized
    way of controlling data forwarding. The multiple SDNs domains explain in our paper
    collaborate and these SDNs domains may or may not be adjacent to each other physically
    or in geographical location. Control plane of this domain sends the flow table
    to a selected location on the computing server. The computing server provides
    the DDOS detection service and returns detected results to controllers.


    The traditional network domain for traffic forwarding is a distributed control
    where it cannot achieve centralized control. Privacy-preserving cross-domain attacks
    detection are often seen as a Secure Multiparty Computation (SMC) problem, which
    is that the matter of the way to calculate a function safely when no credible
    third party is present there [13-14].


