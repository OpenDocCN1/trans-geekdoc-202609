    It is magnificent that the new era of history and new technological change is
    on the rise in every platform. We tend to believe that a new era of “Internet
    and artificial intelligence (AI)”, characterized by ubiquitous networks, data
    technologies, shared services, border integration, automation, and mass production
    is coming. The rapid development and integration of the latest AI and web technologies,
    new data technologies, new energy technologies, mechanical technologies, and biotechnology
    are a necessary requirement in this new era, which can transform models, methods
    and natural resources, welfare and national security.


    Cloud platform provides significant services such as software package resources
    with many benefits such as data storage, server maintenance and accessibility
    for cloud tip users using data access. Due to the rising popularity of the cloud,
    a large number of databases have been exported to reduce the amount of storage
    and cost. In addition, data integrity (DI) is an ongoing problem in the cloud
    to deal with data security and data consistency. Therefore, data usage (DU) face
    the risk of using cloud computing for storage and data transfer applications,
    due to the shortage of DI. For the purpose of partitioning the DI problem, the
    cloud has a high reliability band using trusted third party based encryption scheme
    (TTP). The TTP function is to ensure continuous DU authentication with continuous
    DI protection. To ensure data privacy, cloud must use efficient data encryption
    methods.


    Cloud Computing is an expanding field in the area of computing. It is a way to
