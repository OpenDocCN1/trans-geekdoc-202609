  \ 使用同一组数据的机器将面临无数挑战。\n- 人工智能是指在机器中模拟智能。\n- 人工智能已经在金融、医疗保健、翻译和游戏领域留下了深刻印象。\n\n# 第\
  \ 14 章：技术领域及其运作方式\n\n即使是最先进的神经网络，与人类大脑相比也相当原始。它们倾向于一次处理一条信息，而生物大脑可以轻而举地进行多任务处理，能够同时完成几件事，而且这一切不需要消耗额外的能量来完成。想一想你每天做的事情。你可以同时准备饭菜、聊天并填写购物清单。如果你在办公室工作，你可能在同时写信件、接听电话并进行研究。相比之下，人工神经网络通常通过比较一条记录的某种分类与另一种分类来“学习”。当这一过程中产生错误时，¬它们会重新调整公式并修改算法，然后重复该过程，每次都减少错误率，直到找到最符合当前任务的解决方案。\n\
  \n## 训练神经网络\n\n让我们更详细地观察这个过程。首先，看看神经网络到底是由什么组成的：\n\n1. 一组输入值及其权重。\n2. 一个计算权重之和并将结果映射到输出的函数。\n\
  \n这两个元素以及它们如何协同工作可以在下面的图中清楚地看到。如你所示，输入层上的神经元接收输入数据。输入层正上隐藏层复制数据以及与之相关的任何权重。然后，这些和会被总加，并与已知的偏差进行衡量，最后将数据传递到激活层，在激活层中将决定是否触发神经元。如果神经元被触发，就会确定一个相应的输出，该输出将向外部环境发送信号，规定应该采取什么行动（如果有的话）。为了更好地可视化，需要知道在不同层上并没有物理神经元，而是包含在数据记录中的编码值合集。下一层或一系列层是隐藏层，大部分计算将在那里进行，而最后层（或输出层）包含每个类的一个单节点。\n\
  \n当数据通过网络时，输出层中的每个节点都被分配一个特定的值，记录被分配给包含最高值的节点。在监督训练中，在训练阶段，每条记录都有已知值，因此输出节点可以分配正确的值。给正确类别的节点分配“1”，给所有其他节点分配“0”。这样，计算机就可以将计算值与正确值进行比较，并确定每个节点的错误率。这被称为\
  \ Delta 规则（Delta Rule）。\n\n### Delta 规则\n\n有时被称为“最小均方法”，Delta 规则可能是训练神经网络时最常用的规则。对于每一个输入向量，系统都会将输出向量与正确解进行比较。如果差异为\
  \ `0`，意味着系统在过程中没有学到任何东西。如果该值不是零，系统会自动返回与输入数据相关的权重，并进行调整以使差异更接近零。\n\n例如，如果你想计算 `3\
  \ x 4` 的答案，计算机可能会以 `4 + 4 + 4` 来处理信息，并给你一个 `12` 的输出。这是非常基础的思维，人类大脑和神经网络都可以在几秒钟内结果。然而，假设问题稍微复杂一点。也许我们不知道计算正确答案的正确公式。我们只知道信息是线性的，这意味着如果方程中的一个数字增加倍，另一个数字也必须增加倍。在生物大脑中，这种线性思维被称为“直觉”。不同因素之间的关系提供了需要做某事的指示。计算机将应用一个反映这种关系的方程来解决问题。程序将处理计算结果并与已有的数据进行比较。如果存在偏差，它将返回进行调整，然后重新计算以获得更好的答案。它将继续这样做，直到获得一个精确或足够无法降低错误率的答案。网络通过检查错误率并不断调整直到找到解决方案，这种为了接近正确答案而不断完善答案的方法是神经网络最简单的形式。系统中已经程序了许多算法，可以被调用以找到给定问题的解决方案。\n\
  \n### 聚类\n\n但我们如何让网络对数据进行分类而不是计算呢？这只需要使用不同类型的算法。假设你有一组混合在一起的狗的图像，你想让计算机分离这些图像。在生物大脑中，你可以在几分之一钟内判断哪些是猫，哪些是狗，但这是计算机无法做到的。这几乎是重复算法并不断完善答案直到成功完成任务的通用过程。\n\
  \n\n\n\n网络将使用这组示例来绘制一条斜线，将任何符合标准的数据隔离开。它将从随机划分开始，以便获得一个工作基准。然后，它将将其答案与已有的已知事实进行比对，查看其与正确划分之间有多接近。接着，它会不断重复这一过程，直到找到正确的解决方案。这个过程被称为“聚类”，用于对不同的事物进行分类，并根据接收的数据进行预测。一旦获得正确的结果，数据就会被存储在存储库中，并在下次出现类似问题时作为示例。通过这种方式，计算机实际上学会了“学习”。\n\
  \n这些并不是神经网络学习的唯一方式，但正如你从示例中看到的，这个过程非常基础。然而，点重要的是要理解，当系统必须解决包含多个元素的问题时，网络中的每个隐藏层只能执行一个功能。因此，一个极其复杂的问题可能需要许多隐藏层才能得出正确的解决方案。简单来说，这些程序无法识别单词，因此使用基础的数学算法来确定问题的输出误差与正确答案（或能够解决问题的方案）之间的关系。这个过程会不断重复，不断完善答案，直到达到无法进一步改进的程度。为了实现这一目标，神经网络必须使用真实世界中已知真实且准确的数据示例进行设置。如果系统所依赖的数据不准确，计算机就不可能学习并扩展这些知识。\n\
  \n# 第 14 章总结\n\n- 人工神经网络通常通过比较一个记录的某类分类与另一种分类来“学习”。\n- 输入层面的神经元接收数据输入。\n- 当数据通过网络时，输出层中的每个节点都会被分配一个特定的值。\n\
  - 网络通过检查错误率并持续调整，直到得到正确的解决方案来“学习”。\n- 接收到的数据可能详细描述狗和鸟的特定特征。\n\n## 第 15 章\n\n\n\n\
  \n# 未来的神经网络\n\n![](img/rsrc64M.jpg)\n\n很难想象未来为神经网络带来的何种可能性。由于这项技术已经整合到我们生活的方方面面，产生新颖创新想法的潜力比以往任何时候都要高。我们可以预见到一个类似\
  \ Jetson 的世界，在那里我们将拥有自动驾驶汽车，而不是需要预先设定目的地的 GPS 设备。想象一辆汽车已经学习了你对音乐的个人偏好、你最舒适的温度，以及如何完美调整你的座椅。但这一切在现在都是可能的。未来还有许多神经网络可以应用的巨大可能性。\n\
  \n这种新的学习技术可以通过两种不同的方式进行增长。\n\n## 虚拟智能\n\n一个领域是虚拟智能领域。这类程序是可以被计划、控制和预测的，并最终可能成为人工智能的下一个演进阶段。这种智能将更接近于匹配人类的智能。通过部署机器为那些因灾难性事件与世界其他地区隔绝的人提供援助，现在可以进入那些对人类来说是不安全的区域了。想象一下，这些智能程序如何安装在能够在废墟建筑残骸下寻找生命的机器中。食品供应如何被快速安全地送达。重建工作将如何快得多，伤员的治疗将如何快速高效地进行。随着时间的推移，我们将在电影行业、音乐、农业以及其他无止尽的行业中看到这项技术。\n\
  \n现在，我们对神经网络及其许多应用的未来有相当肯定的认识。我们不确定人类将以多快的速度拥抱它。毫无疑问，更年轻、更具冒险精神的一代将首先拥抱它。他们将是利用其巨大潜力的人，也将是必须设定其界限的人。科学在先进计算机技术方面为我们提供了很多东西。明天以及未来几年内生产的机器将开启通往全新冒险世界的大门。但它的发生是因为人类受到人类欲望这种强大力量的驱动——人们总想找到更好的方法来做事，这种力量比许多权者都要强大，最终他们将使过去的科小说变成如今的现实。\n\
  \n# 实现与解释\n\n你已经分析了数据，选择了一种算法，并开始使用你想要用来解释的数据类型对其进行训练。尽管即使在你的机器学习算法已经完成训练并准备就绪，在真正开始让你的智能软件工作之前，你还需要做几件事。\n\
  \n## 数据分析\n\n数据分析将告诉你应该使用哪种算法来解释它，但在你实际使用算法之前，你可能需要对数据进行一些准备工作。妥善地准备数据有助于确保你获得想要的结果，并确保算法按照你预期的方式运行。你需要做多少准备工作取决于数据的性质。在有大量未标记数据的情况下，你可能想先在数据上运行无监督算法，以熟悉底层结构，并帮助你决定如何最好利用它。你想要考虑的特征数量和类型也会影响你需要做的准备工作量。如果有许多缺失特征或离群值，清理数据可以帮助你的模型高效运行。你可能还需要通过编译或缩放来转换数据，以便程序更容易处理。你还可能发现，你并不想使用所有可用数据进行训练。策策划算法学习的数据集可以帮助引导结果。\n\
  \n## 迭代\n\n机器学习算法通过实践来学习。`Alexa` 就是这方面的典型例子。你与它的交互得越多，它对你的风格和偏好的了解就越多，它就越能预判你的需求。你的算法处理的数据越多，它们执行预期功能的能力就越强。不过，这并不意味着你应该一次性倾倒一大堆数据。就像人一样，算法在能够增量学习时效果最好。通过你的算法运行数据的迭代循环，可以允许你在过程中对其进行微调，简化流程并最终让你更快地创建工作模型。当你在每次迭代结束查看结果时，不要只看整体准确率。你还应该在你正在寻找的信息类型的背景下考虑结果。如果结果不符合，你可以重新调整特征以使算法效用最大化。\n\
  \n## 解释\n\n能够理解并信任你的模型是优秀数据科学的核心要求。很容易掉入一种陷阱，认为机器学习算法是解决所有解释问题的答案。虽然它们可以提供巨大的帮助，但你有效使用算法的能力对你的成功同样重要。如果你不知道如何以你和他人能理解的方式来构建这些数据，那么从机器学习算法中获得的数据就是徒劳的。这是过程末尾的基本概念，有助于确保每个人都能理解你产生的结果。始终展示问题的背景以及你为找到解决方案而所采取的步骤。即使是有价值的数据分析，如果脱离了背景或在真空中被观察，看起来也可以是毫无用处的。将你的结果放在背景中可以让你看到大局，这有助于建立进一步的联系，至少确保你从数据中获得了最大的价值。\n\
  \n能够用即使是外行也能理解的语言表达你的结果，是完全完全理解问题、模型和数据的迹之一。即使你不会向行业之外的任何人展示数据，以一种外行人士可以理解的方式进行汇总也可以对你对数据的熟悉程度进行良好测试。你的数据价值取决于你能够从中得出多少结果。如果你没有获得可以使用的结果，你应该问问自己是否真的理解了你的数据和模型。双检模型的准确性，以确保它给出的答案是你可以信任的。由于给定变量的每一个变化都以固定的速率并朝一个方向发生，因此模型更加直观。更容易得出清晰的结论。\n\
  \n\n\n\n\n# 第 15 章总结\n\n- 久而久之，无人机将变得自主并在没有人类指导的情况下工作。\n- 新技术将改善灾害响应领域的人类生活。\n-\
  \ 数据分析将告诉你应该使用哪种算法来解释数据。\n- 你的算法处理的数据越多，它们执行预期功能的能力就越强。\n- 你的数据价值仅取决于你能够从中得出的结果。\n\
  - 解释数据时可以使用两种通用的范围：全局范围和局部范围。\n\n# 第 16 章：人工神经网络的应用\n\n`ANN` 或 `Artificial Neural\
  \ Networks`（人工神经网络）在适用性方面非常广泛。在今天我们所处的这个技术时代，神经网络已被应用于各个行业中。\n\n## 模式识别\n模式识别可能是大多数有趣问题所属的类别。神经网络已被证明在解决模式识别问题上是成功的。最流行的问题之一是自动手写识别。使用传统技术来识别某人的字迹非常困难，因为有很多不同的尺寸、样式和位置。`backpropagation`（反向传播）算法被认为对模式识别非常有用。最棒的一点是，即使应用程序是基于某种训练算法的，也可以轻松更改其架构以提升性能。\n\
  \n## 控制\n想象一个新司机正在倒车挂车车。如果你曾经尝试过但失败了，甚至在这一操作中成功过，那么你已经知道这非常棘手且困难。另一方面，一个经历过无数次这种过程的经验司机现在可以轻而易举地完成。现在，让我们用训练神经网络为挂车车提供方向，使其能够倒车装货平台，作为\
  \ `ANN` 控制应用的一个示例。我们拥有描述卡车驾驶室位置、装货平台位置、后部位置，以及挂车和卡车与装货平台之间角度的信息。现在，这个神经网络能够学习引导卡车到达装货平台的最佳方式。神经网络可以通过两种方式解决该问题：\n\
  \n1. `emulator`（仿真器）学习如何计算卡车新位置的第一种方法是使用其当前的位置和转向角。在每一步中，卡车移动特定的距离。通过这种方法，模块可以“感觉到”卡车对不同转向信号的反应。这个\
  \ `emulator` 包含隐藏层，并在 `backpropagation` 算法的帮助下进行训练。\n2. 第二个模块或 `controller`（控制器）只在\
  \ `emulator` 训练完成后才开始工作。`controller` 用于提供正确的转向信号，使挂车车到达装货平台并使其后端平行。在 `controller`\
  \ 给出的每个转向信号之后，`emulator` 确定一个新位置。这一过程一直持续到卡车到达装货平台。然后，可以确定误差并轻松地调整权重。\n\n## 语音合成\n\
  神经网络也用于生成语音。虽然这看起来像是一项简单的任务，但学习大声说英语并不简单。有许多音标发音规则需要遵循，而且考虑到每个字母主要取决于它所处的语境，这可能会变得非常复杂。教机器说话与教孩子没有太大区别。起初，你只能听到几个元音和辅音以及一种非常滑稽的牙牙声。婴儿只会说\
  \ `dada`、`mama` 和其他简单的音节。随着教学过程的持续，婴儿发育出更丰富的词汇，并能说 50 个单词，以此类推，直到婴儿准备好参加真正的对话。机器也使用同样的过程。以\
  \ `NETtalk` 为例。`NETtalk` 是 1986 年创建的一个神经网络，通过显示单词作为输入来朗读英语。`NETtalk` 说话的唯一要求是知道用于比较的正确音标转录。`NETtalk`\
  \ 使用最常见的 1000 个英语单词进行训练，并能以很少错误读取新单词。然而，`NETtalk` 也是分阶段学习的。首先，它必须学会区分辅音和元音，然后它必须学会识别单词之间的边界等等，就像孩子一样。\n\
  \n## 语音识别\n语音识别是我们日常生活的一部分。想想苹果的 `Siri` 或亚马逊的 `Alexa`。你只需要按一下按钮，砰，你就可以在不实际向手机输入文本的情况下发送短信了。然而，你是否考虑过这是如何做到的？为了让机器识别语音，显然它必须经过训练才能做到，这意味着它必须有模型可供比较。显然，最简单的方法是向机器输入语音录音，但遗憾的是，我们还没有到那一步（希望这在不久的未来会改变）。点在于语音的速度各异。这意味着什么？这意味着如果你说“sugar”，而另一个人说“suuuuuugaaaaaaar”，你会产生不同的音频文件。第二个文件需要更多数据，意味着自动对齐不同长度的音频记录是很的。为了让机器能够识别语音，它必须经过许多训练过程。它必须以图片和数字的形式被喂声波；它必须经过采样等。神经网络一直是语音识别进展的真正救星，在今天，这是它们最受欢迎的应用之一。\n\
  \n## 业务\n神经网络也应用于许多不同的业务场景，例如贷款贷款评估。此外，尽管你可能认为贷款评估非常直接且简单，但事实是，要完全指定专家用于做出边缘案例决策是非常困难的。使用神经网络进行抵押贷款评估的整个理念是通过过去的案例提供更可靠、更一致的评估。通过抵押贷款评估员的训练，神经网络可以轻松筛选申请并确定哪些申请人应该获得贷款。这里的输入是关于申请人的就业、养养、每月收入等信息，结果是简单的“拒绝”或“接受”响应。你可以说这是一个简单的阈值类型决策。如果申请人符合要求，他们将获得积极回复。否则，他们将被拒绝。简单如此。\n\
  \n## 医学\n神经网络的这一应用非常有益且重要。该应用的最佳例子来自 20 世纪 80 年代中期的创建。该应用被称为 `Instant Physician`，其背后的想法是能够训练网络存储医疗记录，以便其提供正确的治疗。通过学习不同的状况、症状和诊断，网络能够识别疾病并给出诊断。我们知道这种机会对我们现在并不陌生，但正是归功于神经网络的影响，我们才能以许多不同的方式简化生活。这种简化是\
  \ 20 世纪 80 年代初的人梦寐以求的。\n\n\n\n\n\n# 第 16 章总结\n\n- 人工神经网络在应用范围上非常广泛。\n- 神经网络也用于生成语音文本。\n\
  - 神经网络还应用于许多不同的业务场景，例如抵押评估。\n- 神经网络在识别疾病和给出诊断方面的应用极其有用且重要。\n\n# 第 17 章：人工神经网络中的学习\n\
  \n最重要的部分，也是让机器变得智能的部分，是神经网络的学习能力。通过接收来自环境的信息，人工神经网络可以从其中学习以提高其性能。通过学习过程的迭代，网络对环境有了了更多的了解，而应用于其偏置水平（bias\
  \ levels）和突触水平（synaptic levels）的调整过程使得这些网络变得更加博。学习过程包含这些事件：\n\n1. `ANN` 受到环境的刺激。\n\
  2. 这种刺激导致网络自由参数的变化。\n3. 由于这种变化，`ANN` 能够以新的方式响应环境。\n\n机器学习有许多不同的方式。下面你将看到对每种方法的解释和简化，以便你理解。\n\
  \n## 误差纠正学习\n\n这种学习技术正如其名所示，利用误差来指导训练过程。这意味着当将系统输出与期望输出进行比较时，如果发生了误差，这些误差就会被用于学习。这种技术类似于“从错误中学习”类型的学习。通过使用某些算法（通常是反向传播算法），直接通过误差值来调整权重。这种从误差中学习的学习过程非常擅防止错误在每次训练迭代中发生。\n\
  \n## 基于记忆的学习\n\n基于记忆的学习是一个存储和检索信息的过程。所有或大部分的过去经验都存储在一个大型内存中，该内存由分类的输入-输出对示例组成。基于记忆的学习使用了包含以下内容的算法：\n\
  - A) 用于定义测试向量局部邻域的准则。\n- B 应用于局部邻域训练示例的学习规则。\n\n## 赫布学习\n\n赫布学习，或称赫布规则（Hebb’s rule），是最古老且最流行的学习规则。你可以在\
  \ `http://penta.ufrgs.br/edu/telelab/3/hebbian_.htm` 中了解更多关于赫布规则的内容。\n\n## 竞争学习\n\
  \n在这个学习过程中，网络的输出神经元处于持续竞争中，以决定哪一个最终激活。赫布规则允许几个神经元同时激活，但在这里，在给定时刻只有一个神经元可以是激活。这种学习规则有三个基本元素：\n\
  \n1. 一组相同的神经元，除了分布权重外，它们对给定的输入模式产生不同的响应。\n2. 对每个神经元的强度或权重施加的限制。\n3. 一种竞争机制，允许神经元竞争激活和响应输入的权利。\n\
  \n这种学习过程最简单的形式是网络具有单层输出神经元，这些层连接到输入节点。网络通常包含执行侧抑制的反馈连接，这意味着每个神经元都倾向于抑制与其连接的那个神经元。\n\
  \n## 玻尔兹曼学习\n\n这种学习规则以路德维希·玻尔兹曼（Ludwig Boltzmann）命名，是一种根源于统计力学的随机算法。基于这种学习规则的网络被称为玻尔兹曼机。玻尔兹曼机中的神经元具有循环结构，这意味着它们要么处于“开启”状态并用\
  \ `+1` 表示，要么处于“关闭”状态并用 `-1` 表示。\n\n## 范式\n\n尽管有很多不同的学习规则，但只有三种主要的学习范式。\n\n## 监督学习\n\
  \n监督学习是带老师的学习。在概念上，你可以认为老师是拥有环境知识的人，而网络对环境是未知的。老师通过学习过程，可能会使用不同的输入方法教授 `ANN` 期望的输出，并最终接收它。这就像教孩子一样。你使用内置的知识，通过不同的学习方法，期望孩子会以期望的输出做出响应并向你证明他们确实学到了东西。\n\
  \n误差纠正学习过程是监督学习或带老师学习的绝佳例子。通过许多输入-输出示例，老师能够计算误差、进行调整，甚至改变教学过程以获得想要的结果。\n\n## 无监督学习\n\
  \n与监督学习相反，无监督学习意味着自己学习，或者在没有老师的情况下学习。在这里，网络需要独立寻找期望的输出。没有人监督学习过程，这意味着只有输入，而网络的工作是在这些输入中找到模式并生成正确的。。这种学习被用于数据挖掘和推荐算法，因为它们能够预测被归类在一起的用户的偏好。执行无监督学习的一种很好的方法是使用竞争学习。事实上，最好的方法是使用一个具有两层的\
  \ `ANN`。其中一层是负责接收数据的输入层，而另一层由竞争首个“激活”机会的神经元组成。\n\n## 强化学习\n\n强化学习虽然大部分被认为是一种无监督学习，但实际上处于带老师和不带老师的学习之间。在这里，会给出一些反馈，但仍不输出。强化学习意味着通过奖励学习。这里的主要目标是通过试错过程增加奖励。强化学习是学习的一种极佳方式，因为大自然就是这样运作的。你认为为什么小狗每次找到正确的排泄地点或响应“坐”的指令都会给它们零食？原因在于，记住被奖励的行为要容易得多。\n\
  \n# 第 17 章总结\n\n- 误差纠正学习利用误差来指导训练过程。\n- 基于记忆的学习是一个存储和检索信息的过程。\n- 玻尔兹曼学习是一种根源于统计力学的随机算法。\n\
  - 监督学习使用不同的输入方法教授 `ANN` 期望的输出。\n- 无监督学习只有输入，而网络的工作是在这些输入中找到模式并生成正确的结果。\n\n# 第 18\
  \ 章\n\n\n\n\n\n# Theano 中的递归神经网络![](img/rsrc64R.jpg)\n\n```python\nimport sys\n\
  import numpy as np\nimport matplotlib.pyplot as plt\nimport theano\nimport theano.tensor\
  \ as T\nfrom sklearn.utils import shuffle\nfrom util import init_weight, get_ptb_data,\
  \ display_tree\nfrom datetime import datetime\n\nclass RecursiveNN:\n    def __init__(self,\
  \ V, D, K):\n        self.V = V\n        self.D = D\n        self.K = K\n\n    def\
  \ fit(self, trees, learning_rate=3*10e-4, mu=0.99, reg=10e-5, epochs=15, activation=T.nnet.relu,\
  \ train_inner_nodes=False):\n        D = self.D\n        V = self.V\n        K =\
  \ self.K\n        self.f = activation\n        N = len(trees)\n        We = init_weight(V,\
  \ D)\n        Wh = np.random.randn(2, D, D) / np.sqrt(2 + D + D)\n        bh = np.zeros(D)\n\
  \        Wo = init_weight(D, K)\n        bo = np.zeros(K)\n        self.We = theano.shared(We)\n\
  \        self.Wh = theano.shared(Wh)\n        self.bh = theano.shared(bh)\n    \
  \    self.Wo = theano.shared(Wo)\n        self.bo = theano.shared(bo)\n        self.params\
  \ = [self.We, self.Wh, self.bh, self.Wo, self.bo]\n        words = T.ivector('words')\n\
  \        parents = T.ivector('parents')\n        relations = T.ivector('relations')\n\
  \        labels = T.ivector('labels')\n\n        def recurrence(n, hiddens, words,\
  \ parents, relations):\n            w = words[n] # any non-word will have index\
  \ -1\n            hiddens = T.switch(\n                T.ge(w, 0),\n           \
  \     T.set_subtensor(hiddens[n], self.We[w]),\n                T.set_subtensor(hiddens[n],\
  \ self.f(hiddens[n] + self.bh))\n            )\n            r = relations[n] # 0\
  \ = is_left, 1 = is_right\n            p = parents[n] # parent idx\n           \
  \ hiddens = T.switch(\n                T.ge(p, 0),\n                T.set_subtensor(hiddens[p],\
  \ hiddens[p] + hiddens[n].dot(self.Wh[r])),\n                hiddens\n         \
  \   )\n            return hiddens\n\n        hiddens = T.zeros((words.shape[0],\
  \ D))\n        h, _ = theano.scan(\n            fn=recurrence,\n            outputs_info=[hiddens],\n\
  \            n_steps=words.shape[0],\n            sequences=T.arange(words.shape[0]),\n\
  \            non_sequences=[words, parents, relations],\n        )\n        # shape\
  \ of h that is returned by scan is TxTxD\n        # because hiddens is TxD, and\
  \ it does the recurrence T times\n        # technically this stores T times too\
  \ much data\n        py_x = T.nnet.softmax(h[-1].dot(self.Wo) + self.bo)\n     \
  \   prediction = T.argmax(py_x, axis=1)\n        rcost = reg*T.mean([(p*p).sum()\
  \ for p in self.params])\n        if train_inner_nodes:\n            # won't work\
  \ for binary classification\n            cost = -T.mean(T.log(py_x[T.arange(labels.shape[0]),\
  \ labels])) + rcost)\n        else:\n            cost = -T.mean(T.log(py_x[-1, labels[-1]]))\
  \ + rcost)\n        grads = T.grad(cost, self.params)\n        dparams = [theano.shared(p.get_value()*0)\
  \ for p in self.params]\n        updates = [(p, p + mu*dp - learning_rate*g) for\
  \ p, dp, g in zip(self.params, dparams, grads)] + \\\n                  [(dp, mu*dp\
  \ - learning_rate*g) for dp, g in zip(dparams, grads)]\n        self.cost_predict_op\
  \ = theano.function(\n            inputs=[words, parents, relations, labels],\n\
  \            outputs=[cost, prediction],\n            allow_input_downcast=True,\n\
  \        )\n        self.train_op = theano.function(\n            inputs=[words,\
  \ parents, relations, labels],\n            outputs=[h, cost, prediction],\n   \
  \         updates=updates\n        )\n```\n\n```python\nimport sys\nimport numpy\
  \ as np\nimport matplotlib.pyplot as plt\nimport theano\nimport theano.tensor as\
  \ T\nfrom sklearn.utils import shuffle\nfrom util import init_weight, get_ptb_data,\
  \ display_tree\nfrom datetime import datetime\n\nclass RecursiveNN:\n    def __init__(self,\
  \ V, D, K):\n        self.V = V\n        self.D = D\n        self.K = K\n    def\
  \ fit(self, trees, learning_rate=3*10e-4, mu=0.99, reg=10e-5, epochs=15, activation=T.nnet.relu,\
  \ train_inner_nodes=False):\n        D = self.D\n        V = self.V\n        K =\
