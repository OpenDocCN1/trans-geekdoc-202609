- "# 计算机编程：Python - 3合1：深入人工智能的快速上手指南。使用机器学习和数据科学实现神经网络的工具、技巧与窍门\n\n\n\n![](img/rsrc635.jpg)\n\
  ![](img/rsrc635.jpg)\n\n\n\n\n献给 Enza 和 Angelomaria\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  # 总体介绍\n\n人工智能不仅仅是那些巨头成功背后的元素之一。事实上，当你思考 Google、Amazon、Facebook，以及它们如何从一个受启发的想法通过指数级增长发展成为如今的帝国并达到今天的成就时，你确信人工智能是让这一切成为可能的唯一因素。\n\
  \n这听起来有点过头了，不是吗？我知道，我们习惯了听另一种叙述方式。关于这些不可思信的成功案例的构建，通常是关于这些富有远见的天才的“英雄之旅”：他们向着目标奋斗，克服日常的困难和周围所有人的怀疑，固执地朝着目标迈进，最终在重重困难下取得成功。当然，这并非虚假。在这些成功故事的背后，确实有拥有非凡远见和非凡决心的优秀人物。这不仅适用于上述的巨头，也适用于像\
  \ Airbnb 或 Uber 这样的一些“小型”公司（尽管它们价值数十亿美元）。它们被讲述为伟大的企业家在不同领域取得惊人成果的故事。这些创业者的伟大是不容疑的，无论任何方面都是如此。\n\
  \n但是……所有这些非凡的经济和社会企业有什么共同点？难道仅仅是他们的领导者拥有不可否认的决心和能力，能够在零开始的如此短时间内让这些公司取得如此不可思信的结果吗？嗯，实际上，他们还有另一个共同点。想一想，如果没有处理海量数据并以非常智能的方式处理数据的卓越能力，这些公司都不可能有今天的成就。这不仅仅是硬性处理数十亿条数据，而是通过与人类大脑极其极其相似的过程来实现这一点的智能。\n\
  \n想想 AI 时代之前的成功案例。你当然可以找到很多，而且它们通常由企业家领导，这些这些人在心态、愿景和决心上与我们刚刚提到的那些有许多共同点。但它们是一一辈子的故事，有时是几代人的故事，一年又一年地成就伟大。我们这些年看到的这种极速增长在当时是非常罕见的。而\
  \ AI 是导致这种差异的主要原因（也许是唯一原因）。\n\n现在，当然，这并不意味着通过学习 `Python`、`神经网络`、`深度学习`和`机器学习`，你就能在几年内拥有自己的亿万富公司。我当然希望你如愿，如果那是你对生活的渴望，但由于，这可能不会发生。而且说实话，在大多数情况下，这些企业家甚至对计算机编程并不了解多少。但重点是，人工智能改变了我们的生活，它无处不在，我们已经习惯了它，以至于不再察觉。但这就是职场的现在和未来，理解并与这种技术工作将变得一天比一天重要。\n\
  \n如果你对计算机编程和人工智能感兴趣，`Python 编程`是你现在想要拥有的技能，而本合集中的三本书将引导你从初学者水平迈向中级水平，在这条永无止境的道路上迈出第一步。你将探索`Python\
  \ 编程`、`神经网络`和`机器学习`的秘密，为它们提供的无限可能敞开思维大门。你将通过实操练习，亲自尝试`Python 编程`。这些书的目标不是给你提供一个完整的培训（假设在计算机编程领域存在所谓的完整培训），而是让你入门并让你渴望更多。我能对你许下的最好愿望是在在读完这些书之后，你会在在这个名为`机器学习`的奇妙旅程中发现更多、学习更多并测试更多。如果这是你终身学习之路的起点，我将感到无比快乐。祝你发现之旅！\n\
  \n## 第一本书：学习 Python 编程——入门机器学习、数据科学和数据分析的 Python 语言上手教程\n\n献给 Enza 和 Angelomaria\n\
  \n\n\n\n\n# 简介\n\n有很多理由导致你将喜欢使用 Python 代码。它易于使用、易于学习，拥有许多出色的框架和库可以使用（在我们阅读指南的过程中，我们将讨论其中几个），而且它仍然足够强大，可以让机器学习变得变得简单易行。虽然可以使用其他的编程语言来帮助你获得想要的结果，但由于我们已经讨论过的所有优势，大多数人更倾向于使用\
  \ Python。在查看如何设置 Python 环境以便你正确使用它之前，让我们先看看 Python 语言的几个不同部分，这样你就能理解这些代码是如何运作的。\n\
  \n## 你应该了解 Python 代码部分\n\n首先，我们需要查看 Python 语言中这些重要的关键字。就像你在其他编程语言中发现的那样，Python 中也有一系列关键字，用于告诉你的文本编辑器执行什么。这些关键字是保留的，如果你想避免编写代码时出现问题，就应该只按照它们的意图使用它们。它们基本上是告诉编译器如何行为的命令，并且它们保持保留状态，以便你在执行代码的过程中不会遇到很多问题。\n\
  \n变量变量非常重要，因为它们会在你的计算机内存中开辟空间来存储代码的部分。当你创建新变量时，你实际上是在为你的计算机预留一些空间。在某些情况下（例如当你处理数据类型时），你的解释器将决定这些信息应该存储在哪里，因为这可以加快过程。\n\
  \n在处理变量时，你的工作是确保正确的变量与正确的值对应。这将确保正确的部分在正确的时间出现在你的代码中。好消息是，你可以给变量你想要的值，但请检查它在你的代码中是否运行正常。当你准备好为变量分配新值时，可以使用等号来实现。让我们来看一个这种运作方式的良好示例：\n\
  \n```python\n#!/usr/bin/python\ncounter = 100      # 整数赋值\nmiles   = 1000.0   #\
  \ 浮点数\nname    = \"John\"    # 字符串\nprint counter\nprint miles\nprint name\n```\n\
  \n通过上面的示例，你将看到带有你放置的值的变量结果。因此，当 `counter` 出现时，它将显示 `counter` 为 100，`miles` 为 1000，`name`\
  \ 的结果为 `John`。\n\n接下来是 Python 注释。这些注释对于在代码中留下一些备注非常有帮助，并且可以影响他人查看代码以及知道哪些部分应该协同工作的方式。在\
  \ Python 中处理注释相对简单。你只需要在任何你想编写的注释前面添加 `#` 符号即可。编译器将知道如何避开那部分代码并跳过它，而不会中断程序的运行。\n\
  \n一个需要注意的点是你编写了多少注释。虽然从技术上讲，你可以写任何数量或你认为代码需要的数量的注释，但请尝试只保留绝对必要的注释。你不希望写这么多注释，以至于难以阅读代码的其他部分。只在需要的时候写注释，而不是无处不写。\n\
  \nPython 语句是代码中一个简单的部分，但可以产生巨大的影响，因此我们将花一点时间在这里快速探索它们。语句将是编译器为你执行的部分。你可以编写任何种你想要的语句，但要确保它们处于正确的位置，并且不要在语句中使用任何关键字，否则编译器会感到困惑。\n\
  \n你在这里需要查看的下一个事物是函数。\n\n函数可以是你需要学习的语言的另一个部分。这基本上是可以重复使用的代码部分，它可以帮助完成你代码中的某项操作。基本上，这些函数在编写代码时通常非常有效，不会产生大量的代码浪费空间。Python\
  \ 中有很多你可以使用的函数，这对程序员来说是一个巨大的优势。\n\n当你编写代码时，你需要确保你正在定义该函数。一旦你定义了函数并认为已最终确定，就是时候执行它使其在代码中运行了。你可以选择从\
  \ Python 提示符调用它，也可以从另一个函数中调用它。下面是你如何执行此操作示例：\n\n```python\n#!/usr/bin/python\n#\
  \ 函数定义在这里\ndef print( str ):\n  \"将传递的字符串打印到此函数\"\n  print str\n  return;\n\n# 现在你可以调用\
  \ printme 函数\nprintme(\"I'm first call to user defined function!\")\nprintme(\"\
  Again second call to the same function\")\n```\n\n当将其放入你的编译器时，你将看到我们在代码内部编写的两个语句像消息一样出现。这只是你调用函数的一个示例，你可以随时更改语句。\n\
