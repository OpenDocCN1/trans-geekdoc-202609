  \n## 翻译中的人工智能\n\n今天，全球范围内有 6,000 多种语言。每当有人需要与另一种语言背景的人交流时，问题就会出现。在大多数情况下，如果一方不理解另一方，就需要翻译员。这不仅耗时而且昂贵。但现在，根据专门的研究，人工智能开始成为翻译的主要组成部分。现在有几种不同的使用无监督智能的\
