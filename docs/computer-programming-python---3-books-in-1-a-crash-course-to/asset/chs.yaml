  \ <br>● 当你在计划创建日期和时间戳时，需要记住有很多模块可以用于创建它们。 <br>● Python 日期时间模块将帮助人们创建在他们工作的所有项目中都能良好运行的时钟和日历。\
  \ |\n\n第 16 章：\n\n\n\n\n\n# 如何使用 OOP ![](img/rsrc645.jpg)\n\n既然你已经了解了什么是 OOP（面向对象编程）以及它在\
  \ Python 编程中是如何工作的，那么了解与 OOP 相关的所有概念及其使用方法就非常重要。在本章中，你可以学习更多关于 OOP 的工作原理，以及如何确保在\
  \ Python 体验中使用不同的选项。它将为你提供尝试新事物的机会，并为你创建的程序添加不同的元素。此外它还将赋予你对 Python 体验中的实现方式进行重大更改的能力。你的程序将让你有机会看到如何让编码过程变得更容易，以及如何在你编写的代码中包含各种选项。\n\
  \n## 继承 (Inherit)\n\n“继承”因素是在使用 OOP 时将学习的概念之一。它是你可以在 Python 中编写的最简单且使用最广泛的概念。它还让你有机会学习关于你正在编写的程序的新新知识，并让你能够根据现有的\
  \ Python 经验进行重大更改。\n\n通过再次观察车辆，你可以更好地理解继承是如何工作的。所有的 SUV 都是车辆。然而，并非所有可用车辆都是 SUV。所有的面包车都是车辆，同样，并非所有车辆都是面包车。当你观察不同类型的车辆时，你可以清楚地看到，并非所有的面包车都是\
  \ SUV，而且除了这两种之外，实际上很多车辆可以用于不同的用途。\n\nOOP 背后的概念是事物可以被拆分为尽可能小的部分，如下：`Vehicles -> SUVS\
  \ -> Four Wheel Drive -> Class (seating) -> Make -> Model -> Trim`\n\n通过这一点，你可以看到车辆是场景中使用的实际父类，而\
  \ `Trim` 变成了它的子类。对于一组特定的分类只能有一个父类，但父类可以有很多子类。\n\n如果你打算使用相同的序列将信息转换为你自己的 Python 代码，然后将信息放到你的网站或任何你使用程序的地方，它看起来是这样的：为了确保代码中拥有你所需的一切，你实际上需要编写它：通过这样做，你将获得一个机会看到代码中包含许多不同的选项，这将让你有机会看到你拥有的每段代码的不同方面。你需要确保对正在处理的代码尽尽所能，以便能够发挥更多功能，并在你在\
  \ Python 中使用的代码中包含所有必要内容。你可以测试一切，并使用其中包含的精确代码将其引入你用 Python 创建的程序中。\n\n## 多态 (Polym)\n\
  \n与继承背后的理念相同，多态允许在你正在进行的所有不同更改中，对包含在费用中的不同方面进行更改。当你能够使用多态时，你将确保获得最好的体验，并可以在无需进入代码的情况下进行一些更改。如果你要在\
  \ Python 中使用它，将需要使用方法重载（method overloading）或重写（overriding）。\n\n当你能够使用重载来更改编码外观时，你需要编写代码使得一个区域有大量代码。这将“过载”系统并导致它在你想要执行的更改处停止。对于它来说，处理的信息太多了，这会完全改变系统。它要么无法识别到你放入代码中的信息，要么会导致它在执行方式中被完全删除。\n\
  \n如果你打算使用重写，你需要编写一种能够覆盖整个系统的代码。仅仅因为你需要移除一个代码实例，并不意味着你能够选择想要删除的区域。重要的是，要尝试确保你正在尽尽所能来进行这些更改，并且你所做的每种更改都取决于整个系统。在覆盖系统之后，你需要向其添加额外信息并使其运行，以便你更改它的功能方式。\n\
  \n现在，你已经意识到了在编写代码之后可以进行的所有更改，你将能够进行你想要的更改。这并不意味着你一定会拥有那些更改，但它将给你一个尝试更多、在你正在使用的区域中做得更多的机会。在整合代码和尝试不同的文件时，你会感到压力更小，因为你现在知道一切都可以通过多态或继承来修复。\n\
  \n# 第 16 章总结\n\n* 继承因素是在使用 OOP 时将学习的概念之一。\n* OOP 背后的概念是，物可以被拆分为尽可能小的部分。\n* 多态允许在你正在进行的所有不同更改中，对包含在费用中的不同方面进行更改。\n\
