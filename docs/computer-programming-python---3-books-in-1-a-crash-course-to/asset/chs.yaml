  \n## 第二本书：初学者神经网络\n一本关于机器学习基础的简易教材，引导你使用 `Python` 和深度学习实现神经网络\n\n献给 Enza 和 Angelomaria\n\
  \n\n\n\n\n# 引言\n\n我们都清楚，计算机在分析系列数字方面比人类更擅长。然而，更复杂的任务呢？你该如何教电脑猫喜欢什么，或者如何玩一款复杂的策略游戏，甚至是如何开车？它能对股市做出预测吗？这些都是涉及人工智能的更具挑战性的任务，而且对于机器学习和人工智能的能力来说，这些任务要复杂得多。在这种情况下，科学家们会寻求神经网络的帮助。\n\
  \n神经网络之所以在广泛的行业和学科中与其他 ML 算法区别开来。让我们抛开这些流行术语，看看神经网络到底是什么，它们与其他学习算法有何不同，以及它们是如何应用于现代场景的。神经网络基础的这一概念已经存在了几十年了。然而，在最近，它的计算能力跟上了。诸如\
  \ `Hadoop` 和 `MapReduce` 等分布式系统明确意味着，不需要超级计算机来处理大规模计算。神经网络需要你将工作分布在廉价硬件的集群上。媒体上有许多报告暗示人工神经网络的工作原理类似于人脑，但实际上它们太简单了。尽管神经网络的规模已经大大增加，但它们仍然由几百万个神经元组成，与人类大脑中存在的数十亿个神经元相比，这显得微不足道。\n\
  \n另一个主要区别在于神经元的连接方式。在人脑内部，所有的神经元都是连接的。在典型的网络中，信息在层之间仅单向流动：\n\n* **输入层**：输入层包含仅执行接收和传递数据的神经元。输入层内部神经元的数量将等于数据中的特征。\n\
  * **输出层**：输出层包含节点取决于你正在构建的模型类型。对于分类系统，每个应用的标签都将有一个节点。同样，回归系统也会有一个节点。\n* **隐藏层**：在这两层之间，事情开始变得有趣，这就是所谓的隐藏层。它包含神经元，数量取决于输入层和输出层中的数量。隐藏层中的这些节点在传递输入之前会对其进行变换（transformers）。随着网络接受训练，这些节点会变得更具预测性和准确性，输出开始获得更大的权重。\n\
  \n## 训练模型\n\n理解神经网络的一种方式是将其想象成侧面带有多个旋钮的黑箱。神经网络的先驱 Yann LeCun 正是这样描述它们的。让我们以一个神经网络为例，我们正试图训练网络来预测一张照片是否为猫。训练模型涉及调节这些旋钮。由于涉及许多旋钮，无法进行手动调节。这时复杂的机器学习算法上场了，自动调整这些旋钮，直到模型拟合输入数据。这意味着它们正在调整隐藏层中不同神经元的权重函数。另一个需要考虑的重要点是，我们不断调整旋钮，直到我们有一个出色的检测器，或者我们可以对其进行微调。点在于结构是泛泛化的，这意味着相同的底层结构可以被训练以响应许多查询。这就是为什么神经网络比机器学习算法和函数所采用的更强大。\n\
  \n## 所需技能与工具\n\n神经网络为机器语言增加了了前沿性。实现这项技术需要统计分析、大数据处理和分布式系统方面的专业知识。幸运的是，有很多可用的库，使得设计和实现神经网络变得相对简单。以下是更流行的选项：\n\
  \n* **TensorFlow**：它是机器学习领域一个非常盛名的成员，由 Google 开发，作为 `Distief` 的开源继任者（`Distief` 是他们以前训练神经网络的框架）。该框架利用多层节点系统，允许你使用海量数据集设置、训练和安装人工神经网络。这使得\
  \ Google 能够发现照片中的物体或理解语音中的词汇。\n* **Scikit-learn**：它基于基础 Python 库（如 `SciPy` 和 `NumPy`），增加了常用数据挖掘和机器学习任务所需的算法集。这些包括对监督和无监督神经网络的支持。`Scikit-learn`\
  \ 作为一个库有很多工具；它的文档完备，贡献由几位 ML 专家准备。意义上，它是一个精选库，这意味着开发者不需要在各种版本的算法之间进行选择。其易用性和强大使其在包括\
  \ OkCupid、Birchbox 和 Evernote 在内的许多数据密集型初创公司中流行。\n* **Theano**：这是一个来自 Python 的机器学习库，使用与\
  \ `NumPy` 相似的语法来评估和优化数学表达式。它与众不同之处是利用 `GPU` 进行数据密集型计算，其速度比 `CPU` 快 100 倍。Theano\
  \ 的速度使其对于深度学习和其他复杂的计算任务具有极高的价值。\n* **DeepLearning4j**：这是一个基于 Java 的库，用于实现神经网络，广泛用于异常检测、推荐系统和图像识别。它附有\
  \ API，允许软件与更多面向数据的语言（如 Python、`Clojure` 和 `Scala`）配合使用。\n\n## 历史背景\n\n虽然神经网络在计算机发明之前就已经开发出来，但它们曾遭受过挫折，因为人们并不完全擅长使用这些网络。正因如此，神经网络的模拟是最近的进展。计算机的改进推动了神经网络开发领域的许多进步。\n\
  \n当这一概念开始变得重要时，人们无法获得任何关于如何使用这些网络来提高机器准确性和效率的信息，这导致了热情的下降。一些研究人员继续研究神经网络，并努力开发人们能够接受的技术。Warren\
  \ McCulloch 和 Walter Pitts 在 1943 年开发并生产了第一个人工神经网络。这种神经元被称为 `McCulloch-Pitts neuron`。由于当时还没有进一步开发网络的技术，他们无法利用神经网络执行复杂任务。\n\
  \n## 为什么使用神经网络？今天每个行业都在利用海量数据来改进功能。这些数据集具有许多变量，使得人类难以理解其中的模式；而神经网络使得识别数据中的这些隐藏模式变得更容易。如果没有神经网络架构，某些计算机也难以识别数据集中的趋势。工程师可以使用大型数据集训练神经网络，使其成为该领域的专家。然后，他们可以使用网络预测任何未来输入的输出。这让工程师有机会回答一些关于未来的重要问题。\n\
  \n神经网络的一些优势包括：\n* 它们使用一种名为监督学习的机器学习技术来适应和学习新任务。\n* 它们可以表示复杂信息。\n* 它们可以并行处理数据。\n\
  * 即使在部分受损时也能保留某些特性。\n\n## 神经网络与传统计算机\n\n神经网络和传统计算机互为补充。某些算术计算任务更适合传统的算法计算机，而各种复杂任务更适合神经网络；然而，大多数任务需要这些方法的结合，以确保机器以最高效率运行。\n\
  \n\n\n\n\n# 第 1 章：神经网络的类型\n\n## 卷积神经网络\n\n对于人类来说，图像识别是不经过思考就能完成的。它几乎是瞬间发生的。当我们看到奶奶的照片时，不需要分析就能确定她是是谁，我们直觉就知道。每个人在看到鸟时都能识别出它。在我们的大脑中，这个过程是本能，但要教计算机做到这一点绝非易事。现在，计算机可以使用卷积神经网络来完成这一点。这是一种使用相同神经元完全相同副本的神经网络。这使得网络能够学习单个神经元的特征，然后将其用于各种不同的地方。\n\
  \n卷积神经网络的架构基于人类通过视觉识别某物时所经历的生物学过程。在人眼中，当光线进入人的视野范围时，单个皮层神经元会对光光刺激产生反应。这被称为“感受野”，它几乎完全被神经元覆盖。在计算机中，这一过程通过卷积神经网络（`CNN`）来实现。\n\
  \n这些是一类特殊的网络，在图像识别和分类等特定领域经过增强后变得极其强大。它们可以识别物体、标志，并且是自动驾驶汽车等现代发明的主要工具。每个 `CNN` 都有几个子采样层以及若干个相互连接的额外层。当收集输入数据时，它是基于一个非常特定的公式，该公式告诉计算机图像的高宽、颜色数量以及允许计算机进行识别的任何其他特征。\n\
  \n要创建一个 `CNN`，必须对计算机进行编程以识别物体。任何物体。与其他类型的神经网络一样，计算机可以通过连接一系列神经元来解决许多不同的问题。通过这种方式，所有神经元共同工作计算问题的相关特征。通过\
  \ `CNN`，你可以使用相同的算法，但使其适应于不同类型的问题。通过调整算法来识别物体而不是进行数值计算，你可以简化任务。\n\n为此，研究人员已经创建了一个名为\
  \ `MNIST` 的手写数字数据集，其中包含 60,000 多张手写数字图像。然而，计算机只识别数值而不是图像，因此你必须将这些图像转换为数字矩阵，用来表示其不同的特征。为了将此图像输入神经网络，它需要将其从视觉图像转换为一个由\
  \ 300 多个数字组成的矩阵。为了管理所有这些输入，必须扩展神经网络，使其至少有 2 个输出而不是 1 个。第一个输出将计算图片是给定数字（例如 `7`）的概率，而另一个输出则相反，计算该图像不是该数字的概率。系统将对数据库中的所有图像进行分类，为它必须识别的每个组项目提供单独的输出。\n\
  \n虽然神经网络无法匹配人眼的识别能力，但在经过适当编程后，它可以识别物体。这种功能在需要人类无法极快速度运行所需的识别技能的广泛行业中非常有用。\n\n##\
  \ 感知机与反向传播\n\n神经网络最基本、最简单的形式是感知机 `perceptron`。它有一个简单的二函数，只能产生两个可能的结果。如果它产生的解为正，函数将产生\
  \ `1`，但如果为负，结果将是 `0`。这种类型的网络是为一类非常特定的问题设计的，例如物体识别。单个 `perceptron` 可以识别分界线，并判断任何给定点位于该线上方还是下方\n\
  \n## 多层感知器\n\n多层感知器通常用于分析以表格形式存在的大量数据。它们可以解析行和列并将它们作为变量。当行和列可以互换时，该系统工作效果最好。它们可以交换彼此，而没有改变数据含义或数值的风险。\n\
  \n在 `MLP` 中，分类器的输入首先通过非线性变换公式进行更改。这把输入数据置于一个区域，随后可以对其进行线性分离。这通常在网络的一个隐藏层中完成。要训练\
  \ `MLP`，必须设置参数。这些参数必须代表需要进行的分类的特征。好消息是，在过去的几十年里，已经制定了准则，使得选择这些参数变得简单得多。许多准则已经存在，并可以在\
  \ `Efficient BackProp` 等程序中找到。\n\n# 第 1 章总结\n- 在人眼中，当光线进入人的视野范围时，单个皮层神经元会对光线刺激产生反应。\n\
  - 要创建一个 `CNN`，必须对计算机进行编程以识别物体。\n- 神经网络在经过适当编程后可以识别物体。\n- 神经网络最基本、最简单的形式是感知机 `perceptron`。\n\
  - 多层感知器通常用于分析以表格形式存在的大量数据。\n\n\n\n\n\n# 神经网络的组件 ![](img/rsrc647.jpg)\n\n在本指南中，我们最后将查看的是神经网络的概念，以及它们如何在\
  \ Python 和机器学习中发挥作用。神经网络将是你可以在机器学习中使用的框架之一，它试图模仿人类机体中自然生物神经网的运行方式。\n\n人类的大脑非常神奇。它能够观察周围的许多不同的事物，并以极高的准确度识别模式。例如，每当你开车并看到一头牛时，你会识别出它是一头牛。这同样适用于你在路途中看到的任何动物或其他事物。我们之所以能做到这一点，是因为我们在很长一段时间内学习了这些物品长什么样，以及什么可以将一个物品与另一个物品区分开来。\n\
  \n人工神经网络的目标是尽可能地模仿人类大脑的工作方式。为了实现这一点，需要一个复杂的架构。但一旦构建完成，它就能让系统完成许多在其他情况下无法完成的惊工作。让我们来看看这些神经网络是如何工作的，以及为什么它们对我们的机器学习工作如此重要。\n\
  \n## 神经元的结构\n\n一个神经元由细胞体和从其延伸出的几个分支组成。这些分支大部分以分支的形式存在，被称为`树突`。一个长突起或分支会存在，这部分被称为`轴突`。信号的传输从这个`轴突`中的一个区域开始，那里被称为`轴丘`。\n\
  \n神经元有一个边界，我们喜欢称之为`细胞膜`。在这个`细胞膜`的外部和内部存在一个电位，这种差异被称为`膜电位`。如果你能够让输入足够大，就会产生一些动作电位。这种动作电位将沿着整个`轴突`一直向下，远离细胞体。\n\
  \n下一个是神经元。这个神经元通过`突触`与另一个神经元连接，并在链的下游与其他神经元相连。信息通过`轴突`离开神经元，然后传递给`突触`以及接收该信息的神经元。请注意，只有当值值超过指定的数量时，神经元才会放电。在这个过程中的信号非常重要，因为它们将由链中的其他神经元接收。神经元将利用信号来帮助它们相互通信。\n\
  \n当涉及到`突触`时，它们可以是兴奋性的，也可以是抑制性的。当脉冲或信号到达一个兴奋性突触之一时，接收到的神经元会被激活。如果信号是抑制性的，那么神经元就不会向下传递放电。`突触`和`细胞体`能够协同工作，计算兴奋性输入和抑制输入之间的差异。如果这里的差异很大，就会告诉神经元向下传递电信息。\n\
  \n## 网络学习\n\n这些类型的网络会被频繁使用，因为它们非常擅长通过几个不同的层进行观察来学习和分析模式。它经过的每一层都会花时间检查图像内部是否存在模式。如果神经网络发现了一个新模式，它将激活该过程以帮助下一层开始。这个过程将一直持续，直到算法中的所有层都创建完成，程序能够预测图像中的内容。\n\
  \n现在，从这一点开始将发生几件事。如果算法通过了所有层并能够利用这些信息做出准确的预测，神经元就会变得更强大。这导致模式与物体之间建立了良好的关联，系统在下一次使用程序时执行此操作将更加高效。\n\
  \n这看起来可能有点复杂，让我们来看看这些神经网络是如何协同工作的。假设你正尝试创建一个程序，它可以接受图片的输入，然后识别出图片中有一辆汽车。它将根据汽车的特征做到这一点，包括汽车的颜色、车牌上的数字甚至更多。\n\
  \n当你使用现有的传统编码方法工作时，这个过程执行起来可能非常困难。你会发现神经网络系统可以使其变成一个非常易于操作的系统。为了让算法运行，你需要为系统提供一张汽车的图片。神经网络将查看这张照片。它将从第一层开始，即汽车的外边缘。然后，它将经过许多其他层，帮助神经网络理解图片中是否存在任何勾勒出这是一辆汽车的独特特征。如果程序擅长这项工作，它将越来越擅长发现汽车的一些细微细节，包括窗户甚至是轮纹图案。\n\
  \n现在，当你进行这项工作时，你可能会注意到可能有成上万层与其工作。你决定寻找的细节越多、层数越多，神经网络的预测就越准确。当层数更多时，算法能够学习的机会就越大。从以后，该算法将更擅长做出预测，速度也更快。当你想要让它识别图片，甚至是某些面部识别软件时，这是一个很好的算法。通过这些方法，你可以输入所有可能的信息。\n\
  \n## 反向传播\n\n为了让你训练神经网络以在正确的时间完成特定任务，每个部分的单元都需要进行调整。这确保了目标输出和实际输出之间的误差得到减少。这意味着需要由网络计算导数。因此，这意味着网络必须根据情况监测权重增加或减少时的误差变化。`反向传播`算法是你将选择来帮助解决这个部分的算法。\n\
  \n\n\n\n\n# 第二章总结\n\n-   人工神经网络的目标是模拟人类大脑的工作方式。\n-   神经元将有一个边界，我们称之为细胞膜。\n-   为了让你能够训练神经网络在正确的时间完成特定任务，每个部分的单元都\
  \ {进行调整。\n\n# 第 3 章：使用神经网络的优势\n\n神经网络背后的理念是它的运作方式将类似于人类大脑的运作。正如我们已经讨论过的，这有助于人们更好地理解事物的运作方式，以及计算机系统可以实现的不同学习方法。通过神经网络，你将获得许多益处，为你提供一个可以执行许多不同自动化任务的系统。神经网络的优势是广泛的，无论你将神经网络用于什么，它都能为你提供帮助。\n\
  \n## 缩短时间\n神经网络完成任务的速度远高于人类大脑完成的速度。计算机系统完成任务的机会比人类多得多。因此，完成特定任务所需的时间缩短到了非常低的水平。神经网络完成工作的速度越快越好。配置了神经网络的计算机系统，其工作速度几乎是执行相同工作的人类员工的两倍。\n\
  \n## 增加产量\n由于神经网络完成任务的时间更快，在该时间内产生的产量也随之增加。对于有大量事务的人和有大量任务需要完成的企业来说，高水平的产量是巨大的。产量增加时，利润就会增加。即使对于小企业主来说，神经网络也意味着利润的巨大变化。对于想要赚更多钱以及想要以正确方式完成任务的人来说，这些非常棒。转用神经网络处理方式的企业已经看到产量大幅增加。他们能够在更短的时间内完成更多、产出更多，并从中获利，这比他们使用人类完成一半工作所需的时间要快得多。\n\
  \n## 技术展望\n在一个技术影响巨大的世界里，对于希望保持在正确轨道的企业来说，跟上所有可用的技术至关重要。因此，使用神经网络可以提供巨大的帮助，并在他们处理业务不同事务的同时将他们带入\
  \ 21 世纪。需要注意的是，神经网络并不是将技术引入生产的唯一方法，但它们是最高效的方法。当企业主利用神经网络处理他们正在做的事情时，他们将有更大的机会对其业务做出重大改变。\n\
  \n通过神经网络，所使用的技术能够让事情变得好得多，并为使用者创造更好的环境。在神经网络的运作方式方面，大多数企业主和生产公司能够完成以前依赖人类完成的任务。神经网络最大的优势之一是，它们可以产生以前由人类执行的缓慢且往往错误的工作。那些被神经网络取代的人将能够控制网络，但其速度比他们过去工作的速度快得多。\n\
  \n## 额外位置\n由于神经网络在网络上运行而不是在物理位置，因此它们可以在几乎任何地方进行控制。只要有人可以访问该网络，他们就能控制该网络。这将使得即使是最先进的企业也能更轻松地完成任务。当人们使用神经网络时，他们不需要再担心自己在何处做事情——他们只需要担心从该位置完成任务即可。\n\
  \n企业运行的神经网络取决于业务和生产中正在发生的不同情况。现在你已经了解了不同类型的神经网络以及它们的能力，你可以确保为你的业务选择正确的一个。无论你的业务位于何处，或者无论你想让你的神经网络做什么，你都有可能获得你想要的神经网络。它将让你对可以做什么以及神经网络可以为你做的不同事情有一个直观的认识（注：此处译为“给你一个想法”）。\n\
  \n## 更水平的准确率\n人类会犯错。也许是因为他们直觉的大脑，或者是因为他们具有如此强的自我意识以至于可以做出自己的选择。自由意志始终主主人类的行为，他们会有不同的机会犯错。由于他们处理的是与技术进步相关的不同事物，这些就是在使用人类执行这些任务时随之产生的问题。\n\
  \n然而，计算机不会出错。对于你使用的功能，你的网络不会出错。无论你是使用网络来帮助获取你想要的交易选项，还是使用它生产你公司开发的最新产品，它在生产过程中都不会出错。在人类身上看到的问题不会在神经网络上发生。\n\
  \n# 第 3 章总结\n-   神经网络背后的理念是运作方式类似于人类大脑。\n-   神经网络运行的速度远高于人类大脑。\n-   使用神经网络的企业看到了产大幅增加。\n\
  -   神经网络在网络上运行而不是在物理位置，因此它们可以在几乎任何地方被控制。\n-   神经网络应该防止自动化响应中可能发生的几乎每一个错误。\n\n# 第\
  \ 4 章：\n\n\n\n\n\n# 神经网络计算的缺点 ![](img/rsrc649.jpg)\n\n显而易，神经网络对世界是有益的，但当由于为了特定目的而创建的神经网络导致无法解决某些问题时，会发生什么？当网络像你体内的神经一样发生“误触”时，会发生什么？神经网络并非万无一失，但它们对你处理不同事务的方式以及改变不同流程的能力是有益的。神经网络带来的好处是否足以抵消它们可能产生的问题？在这里，我们将详细分析神经网络在不同应用领域可能带来的各种缺点。\n\
  \n## 系统过载\n神经网络所属的系统总有因随之而来的各种问题而过载的风险。它随时可能像过去一样变得过度负荷。确保你以正确的方法办事以避免这种情况的发生至关重要，但这种情况总是有可能发生的。当系统过载并出现严重问题时，整个神经网络都可能会崩溃。这不仅是有害的，因为会丢失所有不同的输出结果，而且投入构建神经网络的时间也会付诸东流。\n\
  \n## “误触”\n就像大脑可能会误触一样，神经网络也存在发生误触的可能性。虽然在计算机系统中发生这种情况的概率比人类低，但仍然存在可能。如果你观察所有与神经误触相关的问题，就会发现它也会给人工神经网络带来问题。误触最大的问题在于，由于神经网络在处理后会输出大量数据，在发生非常灾难性的错误之前，几乎不可能找到误触的问题。在被发现之前，它可能已经关联了许多不同的问题。大多数情况下，误触是微小的，对数据输入处理方式没有产生实际影响，但有时也是需要处理的更大问题。计算机不会犯错，但它可能会出现误触的情况。\n\
  \n## 技术忧虑\n目前，技术处于蓬勃发展阶段。这种情况多年一直如此，并且预计将持续。但是，当技术不再显赫，且没有基础设施来维持如今现有的所有技术时，会发生什么？依赖技术进步的人将无处依从，实际上不得不回到过去的办事方式。当技术不再受到支持时，使用神经网络的人可能需要重新思考策略，并可能因此损失时间（即：资本）。虽然你目前并不一定需要为此做好准备，但考虑到这一点很重要，因为未来你可能会由于目前用于神经网络的技术而产生问题。\n\
  \n## 能量消耗增加\n人类不需要插电就能正常工作。他们不需要无线网络，而且不会仅仅因为处于“开启”模式就浪费大量能量。然而，神经网络需要。无论你是在远程位置运行神经网络，还是在自己所在的物理位置运行它，你都需要使用能量来运行神经网络。大多数神经网络消耗的能量微不足其道，但当成千上万个神经网络同时运行时，你将开始看到能量消耗的增加。虽然有很多方法可以解决这个问题，但这又是你需要处理的另一件事。例如，你可以简单地切换到更“绿色”的方法来运行网络，或者尝试寻找更可持续的能源源来运行网络。如果你做了所有这些，可能会对你使用的能量产生负面影响，但将比使用传统能源源要少得多。考虑到能量消耗问题，请考虑神经网络带来的益处。\n\
  \n## 黑客攻击的可能性\n每当你在线上或“通过波段”做任何事情时，都有被黑客攻击的可能性。这并不意味着有人会“穿过”你的神经网络并获取你所有的信用卡信息来让你处境更艰难。它实际上意味着未经授权的人将进入你的神经网络，并获取他们无权获得的信息。他们可以弄清楚你生产产品、处理不同事务的方式，甚至是你的神经网络运行的方式。由于神经网络并不一定是专利性的，如果有人进入了你的网络，你就无法阻止这种情况发生。你唯一能做的就是设置防止他人进入网络的保护措施。这将有助于保护网络，但你无法做任何事情来\
  \ 100%减少被想要访问你神经网络的人黑客攻击的可能性。\n\n| 第 4 章总结 | 神经网络总有可能发生误触。 | 计算机不会犯错，但它可能会出现误触的情况。\
  \ | 每当你在线上做任何事情时，都有被黑客攻击的可能性。 | 设置防止他人进入网络的保护措施 |\n| --- | |\n\n第 5 章：\n\n\n\n\n\
  \n# 从神经网络中获利\n\n如果你希望能够在计算机或流程中创建各种自动化的产物，那么神经网络是非常棒的。然而，当你能够投入所需的时间并开始从中获利时，它们的表现会更加出色。从你的神经网络中获利远不仅仅是能够为你的计算机添加不同的选项那么简单。你现在可以利用神经网络在股票市场甚至外汇市场中获取巨额利润。随着神经网络变得越来越流行，并且能够被训练成自学能力，你可以用它们做的事情比你过去任何时候能做的都要得多。\n\
  \n你的神经网络需要进行调整以达到不同的水平，你应该确保能够根据你学到的信息，将所有不同的赚钱技能包含在内。当你学会如何构建神经网络时，你拥有的不仅仅是一项技能——你拥有一项盈利技能，你可以利用它来积累资本并为自己创造财务自由。\n\
  \n## 计算机优于大脑\n\n人类大脑之所以伟大是因为它们具有直觉性，但神经网络可以变得几乎和大脑一样直觉。当它们以正确的方式被训练成自学时，在涉及到神经网络包含的选项时，它们能够做出最佳决策。在过去，人类是传统交易的首选方法。虽然某些计算机能够在直觉层面上帮助交易，但它们无法捕捉到人类能感知到的相同信息。有了神经网络，人们真的不再需要参与到交易过程中。\n\
  \n## 具体的盈利定义\n\n神经网络赚钱的能力完全取决于它学习管理员教给它的执行不同任务的能力。确保通过包含你想要它做的一切事，让你的神经网络获得尽可能可能的体验是至关重要的。如果你设置你的网络进行交易，并学习如何与交易领域中进入它的各种刺激的各个方面进行交互，你就能从中赚钱。\n\
  \n### 通过数据进行训练\n\n当你对网络进行不同的操作时，让网络赚钱的最好方法是让各种类型的数据流过它。这将允许计算机从本质上“学习”数据，并学习如何与数据交互。这是一个神经网络在它所处的不同领域中需要经历的训练过程。你应该确保尽尽所能，将神经网络调整到适应你的交易能力。\n\
  \n### 为网络创建规则\n\n当你与神经网络工作并向其输入数据时，你需要在交易过程开始时设置一些规则。这意味着你需要密切关注它正在做的不同事情，以及不同类型的刺激穿过它的方式。在你观察它时，你应该更改为神经网络设置的规则。\n\
  \n## 利用它们获取货币收益\n\n随着你了解更多关于神经网络以及它发生的不同事情，你将学会如何从它们中赚钱。通过神经网络可以通过许多不同的方式获得钱。最流行的方式是通过为其他实体创建网络，以及通过它们进行交易。你也可以投资于神经网络，但那种回报需要很长时间，而且通常不值得你为此等待的时间。\n\
  \n### 交易系统\n\n存在一套与神经网络相关的整个交易系统。人们可以购买、交易、出售和移动他们拥有的不同网络。作为神经网络交易领域的不同实体将有助于决定交易中包含的金额。当你从事神经网络时，值得研究随之来的交易领域——一些人会为这些网络的创建支付大量资金，而另一些人将付费交易他们创建的网络的不同方面。虽然交易在你的神经网络积累资本的过程中起着巨大的作用，但它也有助于在网络内部建立一种社区感。\n\
  \n### 通过网络进行投资\n\n你在构建神经网络时向其投入的投资通常由你的时间组成。与神经网络通常不涉及非常高的成本，但你应该始终对在使用神经网络期间可能产生的费用做好准备。相反，你可以投资于实际的神经网络业务。如果你想从交易中获得回报，并且能够增加用于神经网络投资的资金，你可以这样做。\n\
  \n\n\n\n\n# 神经网络架构搜索 ![](img/rsrc64B.jpg)\n\n“神经网络架构搜索：综述”侧重于构建一种能够自主进化的神经网络，它可以产生后代神经网络并为任何给定问题找到最优的神经网络布局。神经网络架构搜索（`NAS`）本质上是自动化机器学习，涉及三个参数：`search\
  \ space`（搜索空间）、`search strategy`（搜索策略）和 `performance estimation`（性能估计）。人类唯一参与的部分是设置这三个参数并评估结果，尽管论文也遗憾于人类通过限制神经网络的搜索空间引入了自身的偏见。\n\
  \n`Search space`指的是我们让神经网络评估并组合的架构模型数量，以达到真正新颖且比其中任何一个都更好的结果。关于 `search space` 的一个新颖的观点是引入了“细胞”（cells），这是一种手工构建的神经网络组件，可以保留数据的多维性，或将数据还原为向量。细胞可以被移植到另一个神经网络中，或者相互堆叠以获得无与伦比的性能提升，但其理念是让神经网络以任意方式组合它们，直到取得显著进展。\n\
  \n神经网络可以采用任何数量的 `search strategies`，尽管某些策略的性能会随着网络规模的扩大而下降，使其变得不可行。例如，`Zoph`和`Le`在\
  \ 2017 使用的强化学习搜索策略需要 800 块图形显卡运行三到四周。然而，进化方法早在世纪 90 年代初就已经被使用了，并且能够以较低的资源消耗进行大量的\
  \ `search space` 探索。进化方法背后的核心思想是：父代神经网络运行一段时间直到达到某种架构，记录其在任务上的效率，然后将布局传递给它的后代——一个全新的神经网络，这个新网络现在对某些细胞在任务中的表现有了初步了解，并可以据此对其加权。通过逐渐剔除某些细胞及其布局，后代最终可以达到给定任务的终极神经网络架构。\n\
  \n现在，剩下的就是 `performance estimation`。尽管通过细胞简化了捷径并使用进化方法增加了可扩展性，但在测试建议的神经网络架构时，`NAS`\
  \ 仍然产生巨大的资源消耗，这迫使作者诉助于 `performance estimation`，即本质上是低保真测量。技巧在于估计不能过度简化，否则结果将很糟糕，因此作者们仅仅根据性能对生成的神经网络进行排名，其想法是我们不需要知道最好的那个有多好，只需要知道它是这一群中最好的。作者得出结论认为\
  \ `NAS` 表现良好，但由于深度学习缺乏通用的基准标准，排名仍然非常困难。另一个备注是，`NAS` 并没有揭示为什么某种架构会以某种方式运行，而理解细胞分组（论文中也称为“motifs”）将为神经网络的工作原理提供见解。\n\
  \n## 噪声识别\n\n2018 年的研究论文“基于领域对抗训练的自适应语音增强”研究了使用深度学习训练的语音识别神经网络，以及它们处理训练阶段未遇到过的带有额外背景噪声的音频源的能力。论文并没有列出所有创建过的噪声，而是建议使用领域对抗训练（`DAT`）来训练神经网络的两个额外子程序：一个试图确定噪声是否来自原始音频源的\
  \ `discriminator`（判别器），另一个试图产生最佳噪声以迷惑 `discriminator` 的 `feature extractor`（特征提取器）。\n\
  \n通过在任意长时间内让 `discriminator` 与 `feature extractor` 对抗，`DAT` 技术允许专门的 `discriminator\
  \ module` 演化，该模块随后可以与语音识别神经网络合并，从而在人工蜗蜗和语音转文本软件等设备中获得 26-55%的性能提升。这种对抗训练对于神经网络是典型的，因为它允许科学家利用计算机的极快速度进行高效学习，这比手动喂入示例要有效得多。\n\
  \n## 场景识别\n\n“从火山到玩具店：场景识别的自适应判别区域发现”研究了一种图像分类神经网络，它首先被训练标记场景中的物体，然后标记景观本身，最后对两者进行语境化以得出对位置的描述，例如“艺术学校”或“营地”。其想法是训练神经网络将某些物体识别为位置的高度确定性因素，例如，在图像中找到帐篷强烈暗示它在户外。这种神经网络已经存在，但在训练和运行中对计算的需求都很大；深度学习允许操作者在图像中设置任意数量的标识符以实现可扩展性。\n\
  \n## 解密隐藏信息\n\n信息隐藏术故意将信息隐藏在其他数据中，而隐写分析揭示此类隐藏信息的方法，正如“通过生成对抗网络的隐形隐写”所示，神经网络在这方面的表现远好于人类。其想法是训练两个独立的神经网络，一个用于隐藏信息，另一个用于揭示信息，通过让它们相互对抗来实现。测试的任务是让一个神经网络分析覆盖图像，找到最合适的像素，成功地将一个灰色图像隐藏到彩色图像中，然后发送给另一个神经网络进行分析。在协同工作时，这两个网络允许例如让总部通过公共通道将编码在普通图像中的秘密信息发送给外外特工，特工们可以使用该组合的另一部分进行解码。\n\
  \n## 自动问题生成\n\n高中测验教了我们许多的事实，例如 `线粒体` 是细胞的动力工厂。准备测验需要大量细致但快速的工作，可能在任何地方出错，导致学生因为问题格式错误而感到被剥夺了高分。在深度学习的帮助下，我们可能处于这样一个时代的边缘：在这个时代，问题和答案由神经网络从大量文本中创建，这是学习过程的工厂。\n\
  \n“使用答案分离改进问题生成”研究了从单句到大段落的任何文本自动创建问题和答案。目标不是让神经网络创建一个测试的草稿，而是创建一个不需要任何校对或编辑的实际版本。这是通过让神经网络识别并使用\
  \ `token signifier`（标记标识符）掩码答案来实现的，从而从语义上得出正确的单词序列。例如，“John Francis O’Hara 在 1934\
  \ 年当选诺特大学校长”包含了三个问题：谁 (`John`)、什么 (`president`) 和什么时候 (`1934`)。通过掩码三个答案之一，我们教会神经网络如何提出问题并针对掩码答案进行测试；通过添加\
  \ `attention mechanism`（注意力机制），我们给关键词和信息更高的权重。这种方法允许从相同文本中提取最大价值，同时也测试的反作弊手段，因为学生无法再从那里抄袭答案。神经网络使用\
  \ 23215 个文本样本和约 10000 个手动创建的问题和答案进行测试，结果显示只有 0.6%的问题错误地揭示了整个答案，9.5%提供了答案的提示，“什么”和“谁”是神经网络猜对的三个常见问题，尽管其他类型在训练数据集中的占比为\
  \ 55.4%。\n\n## 2D 对象的 3D 视觉重建\n\n伟大的画家知道如何利用阴影和视角使画布成为通另一个世界的窗口。尽管在某些层面上知道这种绘画是幻觉，但我们大脑会将\
  \ 3D 图像拼接在一起并呈现为真实。事实证明神经网络能够做到类似的事情，根据物体的 2D 视图来重建未见的部分。\n\n“基于单视图的深度学习全 3D 对象完成”是一项美意意大利联合研究论文，研究像素如何转换为\
  \ `voxels`（体素）。该研究的主要目标是最小化完成 3D 对象所需的视角数量，可能用于在预算有限的环境中移动的机器人。由于作者需要至少一个视图，他们决定采用这种方法并获得了成功。神经网络使用来自\
  \ `CAD` 的 5000 个预设进行训练，每个模型都有不同角度的快照以达到 `30x30x30` 分辨率，这在保留所有细微特征方面面临了挑战，但神经网络取得了惊人的结果，恢复了原始的\
  \ 92%。\n\n## 从图像或视频流中去雨\n\n这种效果的真实原因是雨滴在反射光时具有很高的速度，导致任何捕捉图像出现白色条纹。设置远程的摄像头听起来像是一个有趣的实验；内核引导\
  \ CNN 的单图像去雨”建议使用名为 `KGCNN` 的神经网络来清理图像，目标是尽可能保留质量并去除雨痕。`KGCNN` 将利用雨滴的一个已知特性，即它们会引起微小但可感知的运动模糊，使其易于识别。知道雨滴的大致方向可以帮助我们构建\
  \ `KGCNN` 将任何图像解构为背景层和纹理层。背景层包含雨之外的一切，纹理层只包含雨滴，使得 `KGCNN` 按预期工作。\n\n## 计算机系统入侵\n\
  \n威廉·吉布斯的《赛博朋克》等科幻小说中的入侵检测（通过插入基础物理插头接入互联网）是由名为 `Black Ice` 的人工智能完成的。黑客和入侵检测目前以更平庸的方式存在，但神经网络承诺至少后一部分将变得非常有趣。“基于统计分析的入侵深度学习入侵系统”调查了智能恶意软件和攻击攻击日益增长的威胁，这些威胁可能危害银行系统、电网或医院记录。不仅是因为所有事物都连接了网络，而且网络的巨大规模使其攻击面暴露，使其面临任何机会。研究论文显示了一种保持巨大网络安全的扩展方法，无论组件是否更新。这在部分是\
  \ `WannaCry` 在 2017 年 5 月袭击医院的方式，除非支付 300 美元赎金，否则医疗文件将被锁定在付费墙后。入侵检测是重中之重。目前存在几种去雨程序，其中一些使用机器学习，但通常会破坏图像质量。通常，入侵表现为数据预处理、寻找共性的特征提取以及区分良性和恶性的分类。\n\
  \n## 逻辑思维\n\n逻辑思维将人类与单细胞区分开来，并让我们以高度的确定性看到我们自己和单细胞。逻辑推理的能力源于对世界的符号表示，是科学家希望他们的神经网络拥有的最理想特征。它不是任何逻辑，而是一种特殊的名为\
  \ `ontological logic`（本体论逻辑）的逻辑，处理我们如何产生以及什么连接着我们。本体论逻辑可以应用于国家、动物、树或任何可以想象的物质实体，以抓住时间的结构并将其还原到起点。随着神经网络被设定在所有生活领域进行竞争，它们将缓慢但确实学会像我们一样进行审视。\n\
  \n## 欺骗智能机器\n\nOpen AI 博客上的视频研究了图像分类神经网络如何被一张经过数字修改的猫的打印图像所欺骗，这张图像肉眼清晰易于识别，但神经网络在几乎所有角度和缩放因子下看到的都是台电脑，即使图像被旋转或移动。\n\
  \n\n\n\n\n# 第 6 章总结\n\n- 搜索空间指的是我们让神经网络评估的架构模型数量。\n- 神经网络可以使用任意数量的搜索策略。\n- 隐写术（Steganography）是在其他数据中故意隐藏信息，而隐写分析（stegalysis）是揭示此类隐藏信息的方法。\n\
  - 神经网络首次使用 125,973 个属于任何入侵类别的样本进行训练。\n\n# 第 7 章：神经网络算法\n\n毫无疑问，你以前听过这个术语。它通常与各种技术机制联系在一起，但近年来，算法被应用于自动学习开发中，这一领域正引导我们向人工智能和计算智能的发展迈进。为了实现这一点，算法必须足够灵活，以便在呈现新数据时能够适应并做出调整。因此，它们能够在无需创建特定代码来解决问题的情况下提供所需的解决方案。与其在系统中编写硬化的代码，不如相关数据成为算法的一部分，反过来，这允许机器根据提供的数据创建它自己的推理。\n\
  \n这是如何运作的呢？这听起来可能有点困惑，但我们将尝试将其分解为一些你可以联系的特定示例。机器的“学习”功能之一是分类信息的能力。为了做到这一点，输入数据可以是所有类型信息的混合。算法需要识别数据的不同元素，然后根据相似性、差异和其他因素的特征将它们分为若干不同的类别。这些特征可以是任何事物，范围从识别手写样本到收到的文档类型不等。如果这是代码，机器只能执行一个单一功能，但因为它是一种可以修改以适应各种情况的算法，计算机可以接收这些数据并对符合特定特定参数的所有组进行分类。这就是机器如何改变其功能以适应当前状况的方法。\n\
  \n你的电子邮件账户可以根据你遵循的模式分析你收到的所有邮件，并将其它们分为不同的组。它可以识别出哪些邮件是重要的且你应该立即查看的，哪些是垃圾邮件和推销邮件，甚至可以筛选出那些由于携带病毒或恶意软件而可能对你的计算机构成风险的邮件。通过这类算法，机器现在可以通过观察你的习惯和模式来学习，并相应地调整其行为。因此，成功且有效的神经通路的关键在很大程度上取决于你的系统使用的算法。在最基础的层，机器学习是使用不同的预程序算法来收集和分析数据，以确定接受范围内的可能结果。每当这些算法接收到新数据时，系统就会学习并适应以提高性能。\n\
  \n### 你应该了解的常用算法\n\n#### 逻辑回归 (Logistic Regression)\n当你需要解决二分类问题时，逻辑回归非常流行。当解决方案只有两个选项之一时。它有时被称为二分法（dichotomy），它非常适用于需要真/假或是/否答案的问题。为了更好地理解逻辑回归，你首先必须对线性回归有清晰的理解。作为分析师，你必须找到最佳直线来显示特定的趋势。这需要找到一个能够提供最佳直接特征以解决回归问题的方程。标准做法是使用最小二乘法，其思想是缩短直线与训练数据之间的距离。基本上，系统在寻找一条“最接近”所有输入数据的线。逻辑回归是一种称为广义线性模型（generalized\
  \ linear model）的特定算法。与线性回归不同，你的目标是找到一个与结果或变量最终值最接近的模型。然而，请记住你解决的是二分类问题，所以没有固定的值要预测。这只是两种可能的结果。你实际上是在寻找一个结果实际发生的较高概率。\n\
  \n- 线性回归可以解决的问题：我们今年会有多少英寸的雪？\n- 逻辑回归可以解决的问题：明天会下雪吗？\n\n#### 决策树 (Decision Trees)\n\
  决策树算法更多用于对模型进行分类并在树结构中对其标记。许多分析师发现它们是极好的工具，可以提供准确且可靠的输出数据。决策树易于阅读和理解。事实上，在使用它们时，你能够清楚地看到为什么需要某些分类器来做出决策。如果你是编写代码的新手，这可能是你练手的最佳算法。这些算法都采用完全相同的方法；将数据分解为尽可能小的子集（仅包含一组结果的子集）。根据可用的任何预测变量进行划分。然后它们将所有相同类别的子集分在一起。它们将继续这样做，直到拥有尽可能小的数据集。一旦完成这一点，对预期行为做出预测就非常容易。做出这种预测非常简单。系统所做的只是遵循给定预测变量的路径。它将引导至包含所有“是”答案的子集。\n\
  \n#### 支持向量机 (Support Vector Machines)\n支持向量机或 `SVM` 是可以像武器一样使用的算法。这类算法极其复杂，利用了一些存在的最挑战性的方程。由于这种独特的复杂性，`SVM`\
  \ 只能处理极少量的数据集。因此，如果初始训练数据过于广泛，`SVM` 可能不是最佳选择。\n\n# 第 7 章总结\n\n- 算法用于自动学习的发展。\n-\
  \ 机器的“学习”功能之一是分类信息的能力。\n- 当你需要解决二分类问题时，逻辑回归非常流行。\n- 决策树算法更多用于对模型进行分类并在树结构中对其标记。\n\
  - 支持向量机或 `SVM` 是可以像武器一样使用的算法。\n\n## 第 8 章\n\n\n\n\n\n# 机器学习与大数据\n\n大数据顾其实虚名——处理海量数据的实践。我们所说的“海量”，是指规模惊人的数据量——吉字节（GB）、太字节（TB）、拍字节（PB）级的数据。为了让你直观理解这个规模，1\
  \ PB 等于 $10^{15}$ 个字节。写出来就是 `1 PB = 1,000,000,000,000,000 byte`。这些规模每天都在增长。\n\n\
  “大数据”一词源于 20 世纪 90 年代，尽管计算机科学家几十年来一直在处理大量数据。大数据与以前的数据集之间的区别在于，数据集的规模开始超过传统数据分析软件的处理能力。人们必须创建新的数据库存储系统（例如\
  \ `Hadoop`）仅仅为了存储数据，并编写新软件以便以有意义的方式处理如此大量的信息。\n\n## 规模 (Volume)\n“规模”一词指的是可用数据的巨大量。当\
  \ 21 世纪初“大数据”这一词被创造出来时，可供分析的数据量大得令人震惊。从那时起，产生的数据量呈指数级增长。事实上，产生的数据量已经变得如此巨大，以至于必须创建新的存储解决方案来处理。这种可用数据的增加没有放缓迹象，事实上实际上正在以每两年翻倍的速度几何级增长。\n\
  \n## 速度 (Velocity)\n随着产生数据量的增加，其产生速度也在加快。智能手机、`RFID` 芯片和实时人脸识别等设备不仅产生了大量数据，而且数据是实时产生的，必须在创建时就进行处理。如果不进行实时处理，就将其存储起来稍后处理。数据到达速度的提高增加了带宽、处理能力和存储空间将其以备后用的压力。\n\
  \n## 多样性 (Variety)\n数据并不是以单一格式产生的。它以数值形式存储在详细的数据库中，以无结构文本和电子邮件文档产生，并以数字形式存储在流媒体音频视频中。还有股市数据、金融交易等，所有这些都有独特的结构。因此，不仅必须非常快速处理大量数据，而且数据以多种格式产生，每种类型都需要不同的处理方法。\n\
  \n最近，又增加了两个 V：\n\n### 价值 (Value)\n数据本身具有价值，但只有当你能够从中提取这种价值时，它才有意义。此外，输入数据的状态（无论是良好地结构在数值数据库中，还是在无结构的文本消息链中）会影响其价值。数据集的结构越少，在处理之前需要投入的工作越多。从这个意义上说，结构良好的数据比结构少的数据更有价值。\n\
  \n### 真实性 (Veracity)\n并非所有捕获的数据质量都相等。在处理从大数据库集中解析出的假设和预测时，了解所用数据的真实性对于研究研究产生的信息所被赋予的权重具有重要影响。有许多因素限制了数据的真实性。数据可能会受到收集者所做的假设的影响而产生偏差。软件漏洞可能会在数据集中引入错误和遗漏。异常情况也会降低数据的真实性，例如两个相邻的风速传感器报告了不同的风向。其中一个传感器可能故障了，但无法从数据本身判断这一点。数据源的真实性也可能值得怀疑——例如在某公司的社交媒体动态中出现了一系列非常负面的评论。它们是人类创建的还是机器人创建的？还有人为错误，例如人在注册网络服务时错误地输入了电话号码。数据真实性受到损害的方式还有很多。\n\
  \n处理所有这些数据的目的是从所有噪声中识别出有用的细节——企业可以找到降低成本、提高速度和效率、设计新产品和品牌并做出更明智决策的方法。政府可以通过研究其公民和行业产生的数据获得类似的益处。\n\
  \n## 大数据的当前应用示例\n\n### 产品开发\n大数据可用于预测客户需求。通过使用当前和过去的产品和服务对关键属性进行分类，他们可以对这些属性的关系及其在市场上的成功进行建模。\n\
  \n### 预测性维护\n结构化数据中隐藏着可以预测机器部件和系统机械故障的索引。制造年份、品牌和型号等提供了预测未来故障的方法。此外，错误信息、服务日志、运行温度和传感器数据中存在大量的非结构化数据。这些数据经过正确分析后，可以在问题发生之前进行预测，从而可以先部署维护，减少成本和系统停机时间。\n\
  \n### 客户体验\n许多企业没有客户一无所有。然而，在竞争环境中获取和留住客户是困难且昂贵的。任何能给企业带来优势的被积极利用。利用大数据，企业可以通过检查社交媒体、网站访问指标、通话日志和任何记录的客户互动来修改和改进客户体验，从而获得更清晰的客户体验视图。这一切都是为了最大化交付的价值以获取和维护客户。针对个人客户的优惠不仅变得更加个性化，而且更加相关和准确。通过大数据识别问题问题，企业可以快速有效地处理这些问题，减少客户流失和负面媒体报道。\n\
  \n### 欺诈与合规\n虽然数字宇宙中可能存在个别鲁莽的坏分子试图破解系统安全，但真正的威胁来自有组织、资金充足的专家团队，有时甚至是由外国政府支持的团队。同时，安全实践和标准从不停滞，而是随着新技术和破解现有系统的新方法不断变化。大数据有助于识别暗示存在欺诈或篡改的数据模式，这些大型数据集的聚合使得监管报告变得快得多。\n\
  \n### 运营效率\n这不是最吸引人的话题，但这是目前大数据提供最大价值和回报的领域。分析和评估生产系统，检查客户反馈和退货，检查许多其他业务因素以减少停机和浪费，甚至预测未来的需求和趋势。\n\
  \n### 创新\n大数据的核心在于有意义标签之间的关系。对于大型企业来说，这可能意味着检查人员、机构、其他实体和业务流程如何交叉，并利用任何相互依赖关系来驱动利用这些见解的新方法。可以预测新趋势，并更好地理解现有趋势。这所有导致了理解客户真正想要什么并预测他们未来可能想要什么。充分了解单个客户可能会带来利用动态定价模型的能力。大数据驱动的创新实际上受限于策划它的人的才智和创造力。\n\
  \n### 比较\n机器学习也旨在快速处理大量数据。但大数据侧重于使用现有数据来寻找趋势、离群值和异常，而机器学习使用相同的数据来“学习”这些模式，以便主动处理未来的数据。大数据查看过去和现在的数据，而机器学习检查现在的数据以学习如何处理未来收集的数据。在大数据中，是由人定义寻找什么以及如何组织和结构化这些信息。在机器学习中，算法通过对测试数据的迭代自学习什么是重要的，当这个过程完成后，算法就可以处理它从未经历过的新数据。\n\
  \n\n\n\n\n# 第 8 章总结\n\n- 自 21 世纪 00 年代初，产生的数据量呈指数级增长。\n- 如果数据不进行实时处理，则必须将其存储起来以备后处理。\n\
  - 大数据可以预测客户需求。\n- 许多企业离开了客户将无从生存。\n- 大数据的核心在于意义标签之间的关系。\n- 机器学习也旨在快速处理大量数据。\n\n\
  # 第 9 章\n\n\n\n\n\n# 什么是预测性分析？![](img/r64E.jpg)\n\n对于许多公司而言，海量数据——即大量的非结构化、半结构化和原始结构化数据是一个尚未开发的信息源，可以帮助业务决策并改进运营。随着这些数据的不断变化和多样化，越来越多的公司开始采用预测性分析来挖掘这一源，并从大规模数据中获益。人们有一个常见的误解，认为机器学习和预测性分析是同一回事。事实并非如此。然而，它们在一个领域上确实重叠，那就是预测建模。基本上，预测性分析包含了一系列统计技术，包括\
  \ `ML`、数据挖掘和预测建模，并利用历史和当前的统计数据来估计或预测未来结果。这些结果可能是客户在购买期间的行为，也可能是市场的变化。它帮助我们通过分析过去的模式来猜测可能的未来事件。\n\
  \n## 预测性分析是如何工作的？\n\n预测性分析由预测模型驱动。它是一种方法而非一个过程。`ML` 和预测性分析是密不可分的，因为预测模型通常包含 `ML`\
  \ 算法。创建的模型可以在一段时间内进行训练，以对新值或其他数据做出反应，从而交付组织所需的结果。\n\n预测模型有两种。一种是预测类别成员的分类模型，另一种是预测数字的回归模型。这些模型由算法组成，算法执行数据挖掘和统计分析以确定数据中的模式和趋势。预测性分析软件将具有用于创建预测模型的内置算法。算法被称为分类器，它们能够识别数据所属的类别集。\n\
  \n## 常见的预测模型\n\n最广泛使用的预测模型有：\n*   回归（线性和逻辑回归）\n*   决策树\n*   神经网络\n\n### 回归（线性和逻辑）\n\
  它是统计学中最流行的方法之一。回归分析提供了变量之间的关系，并在多样化的大数据集中发现关键模式。它还能发现它们之间如何联系。\n\n### 决策树\n决策树是简单而强大的多变量分析形式。`Decision\
  \ trees` 由算法产生，这些算法识别将数据划分为分支段的不同方法。它们根据输入变量的不同类别将数据划分为子集。它可以帮助你理解用户决策的路径。\n\n###\
  \ 神经网络\n它们建立在人类神经元的模式之上。`Neural networks` 通常被称为人工神经网络，是深度学习技术的一种变体。它们通常用于解决复杂的模式识别问题，对于分析大数据具有不可思议的有用性。它们非常擅长处理非线性数据关系，并且在某些变量未知时也能良好运行。\n\
  \n### 分类器\n每个分类器以不同的方式处理数据，因此，经理为了获得所需的结果，必须选择正确的分类器和模型。\n*   **聚类算法**：它们将数据组织成具有相似成员的不同组。\n\
  *   **时间序列算法**：它们按顺序绘制数据，对于预测一段时间内的常数值有用。\n*   **离群点检测算法**：它们完全关注异常检测，识别数据集中不符合特定预期模式或标准的事件、观察值或项目。\n\
  *   **集成模型**：这些模型利用多个 `ML` 算法来获得比单一算法预期输出更好的预测性能。\n*   `Naive Bayes`（朴素贝叶斯）：这种分类器允许你根据提供的特征预测类别或类类。\n\
  *   `Factor Analysis`：这是一种用于描述变异的方法，旨在寻找独立性。\n*   `Support Vector Machines`：它们是一种监督学习的机器学习技术，使用关联学习来分析数据和识别模式。\n\
  \n## 机器学习与预测性分析的应用\n\n数据泛滥的公司正挣扎于将所有信息转化为有用的洞察。对于这些机构，`ML` 和预测性分析可以提供解决方案。无论数据有多大，如果无法被使用，它就会变成无用的资源。预测分析在营销、安全和运营中应用更为常见。以下是它们在各个行业中使用的某些示例：\n\
  \n*   **金融服务与银行**：在金融服务和银行业，`ML` 和预测性分析被一起用于衡量市场风险、检测欺诈和识别机会。\n*   **安全**：网络安全是现代世界所有企业的首要议程。`ML`\
  \ 和预测性分析在安全领域发挥关键作用并不令人意外。安全组织经常使用预测分析来提高他们的性能和服务。它们可以检测异常，理解客户行为，并因此增强数据安全。\n*\
  \   **零售**：零售行业正在使用 `ML` 更好地理解客户行为。谁在买什么？在哪里买？这些问题可以通过准确的预测模型和数据集来回答，从而帮助零售商提前计划并根据消费者趋势和季节性备货，这大大提高了投资回报率（ROI）。\n\
  \n## 开发正确的环境\n\n尽管预测性分析和 `ML` 可以为大多数公司提供巨大的推动，但如果不考虑它们与日常运营的适配性而半心地实施这些解决方案，只会阻碍它们提供公司所需洞察的能力。要充分发挥\
  \ `ML` 和预测性分析的优势，公司需要确保它们有支持解决方案的架构，并拥有有助于它们学习的高质量数据。\n\n数据准备及其质量是预测性分析的关键部分。输入数据可能跨越多个平台并由多个数据源组成，需要以连贯的方式集中和统一。为了实现这一点，公司需要开发良好的可靠的数据治理计划来管理整体数据管理，并确保只有高质量的数据被采集和使用。另一点是，当前的流程可能需要更改以包含\
  \ `ML` 和预测性分析，因为这将使公司在业务的各个点提高效率。最重要的是，公司必须知道它们想要解决的问题，这将帮助它们确定最适合使用的模型。\n\n## 预测模型\n\
  \n\n\n\n\n# 第 9 章总结\n\n- 预测分析包含了一系列统计技术，包括 `ML`、数据挖掘和预测建模。\n- 预测分析使用历史和当前统计数据来估算或预测未来结果。\n\
  - 机器学习和预测分析并非同一事物，但它们在一个领域上有重叠，那就是预测建模。\n- 算法被称为分类器，它们能够识别数据所所属的类别集合。\n\n# 第 10\
  \ 章：什么是数据挖掘？\n\n数据挖掘意味着从海量数据中提取知识。换句话说，我们可以说它是一个发现数据集中继承的各种模式的过程，这些模式是新的、实用的且准确的。数据挖掘是一个迭代过程，通过揭示大量数据中此前未知的模式和趋势来创建描述性模型预测性模型。执行这项练习是为了支持决策制定。它本质上是业务分析的一个子集，类似于实验研究。\n\
  \n数据挖掘的起源可以从统计学和数据库中找到。另一方面，`ML` 通过从数据中获得的经验来自动改进算法来工作。换句话说，在机器学习中，我们从经验中发现新算法。这些\
  \ `ML` 算法可以自动提取信息，但用于机器学习的源也是数据。它涉及两种数据，一种是测试数据，另一种是训练数据。数据挖掘技术通常用于机器学习，并与学习算法一起，用于构建后台发生情况的模型，以预测未来的结果。\n\
  \n### 什么是数据挖掘，`ML` 和数据挖掘之间是什么关系？\n\n数据挖掘意味着从大量数据中提取知识。它于 1930 年引入，最初被称为数据库中的知识发现。数据挖掘被用于从现有数据中获取规则。它的起源于拥有非结构化数据的传统数据库。它实现在你可以开发模型并使用数据挖掘技术的地方。它更加自然，并且涉及更多的人为参与。它们被用于聚类分析。数据挖掘是从数据仓库中抽象化出来的。它更像是一项研究，使用了与\
  \ `ML` 类似的方法，但应用于有限的领域。\n\n### 数据挖掘技术\n\n工作在数据挖掘领域的专家依赖于统计学、数据库管理和机器学习的技术及其交叉领域。他们将职业生涯致力于理解从海量信息中可以得出什么结论。将这些变为现实的技巧是什么？当数据挖掘利用其中一些技术进行分析时，它就是有效的：\n\
  \n1. **模式跟踪**：数据挖掘中使用的基本技术之一是学习识别数据集中的模式。通常，这是数据在某些间隔期间发生的异常情况，或者是某些变量在一段时间内的缺陷或衰减。例如，你可能会观察到某些产品的销售量在假期之前立即激增。或者你可能会注意到温暖天气吸引了人们访问你的网站。\n\
  2. **分类**：这是一种更复杂的数据挖掘技术，要求你将不同的属性收集到可区分的类别中，这些类别以后可以用于得出进一步的结论或用于其他功能。例如，在评估独立客户的财务背景和购买历史数据时，你可能可以将这些人分类为高风险、中风险或低风险的贷款候选人。然后你可以使用分类结果来更多地了解客户。\n\
  3. **关联**：这与模式跟踪相关，但它更具体地涉及依赖链接的变量。在关联案例中，你寻找与其他属性或事件相关的特定属性或事件。例如，你可能会注意到当你的客户购买某些特定物品时，他们也会购买另一个相关物品。这种事件序列用于填充在线商店中的“人们还购买了”部分。\n\
  4. **异常值检测**：在某些情况下，仅仅识别超出范围的模式无法让你对数据集有清晰的理解。你还需要理解数据中的异常，也称为异常值。例如，你的买家几乎全是男性，但在\
  \ 7 月的某一周，女性买家突然增加。你可能想调查该事件的原因并找出是什么推动了销售，这样你就可以复制它，或者更好地理解你的受众的行为。\n5. **聚类**：这与分类相似，但涉及将数据块分组，这一点是类似的。例如，你可能会根据客户的额外收入多少或他们在在线商店购物的频率，将不同的人口特征分成不同的包进行聚类。\n\
  6. **回归**：回归基本上用作建模和规划的形式。它被用于发现由于其他变量的存在而某些变量出现的概率。例如，你可以用它根据消费者需求、竞争和可用性等因素预测某些价格。更具体地说，回归的主要重点是帮助你发现特定数据集内部两个或多个变量之间的准确关系。\n\
  7. **预测**：这无疑是最有价值的数据挖掘技术之一。这是因为被用于预测你未来将看到的数据类型。在某些情况下，仅仅通过理解和识别历史趋势，我们就可以对未来发生的情况制定准确预测。例如，我们可以查看客户的信誉历史和过去的购买记录，以预测在提供贷款的情况下未来是否会有信贷风险。\n\
  \n# 第 10 章总结\n\n- 数据挖掘意味着从海量数据中提取知识。\n- 数据挖掘被用于从现有数据中获取规则。\n- 数据挖掘是从数据仓库中抽象化出来的。\n\
  - 数据挖掘是学习识别数据集中的模式。\n- 回归基本上用作建模和规划的形式。\n\n\n\n\n\n## 循环神经网络\n\n在本章中，我们将转向另一种现代且新颖的神经网络架构，即循环神经网络（Recurrent\
  \ Neural Network）。卷积神经网络允许我们处理原始图像，而循环神经网络则允许我们处理原始序列。与图像一样，你仍然可以使用普通的前馈神经网络来“处理”序列，但这种方法既低效也不有效。请记住，`CNNs`\
  \ 允许你拥有比 `ANN` 更少的参数，这在 `RNNs` 中也是如此。正如我承诺的那样，我们在本书中仍然不会涉及数学问题，所以你只需要相信我就行。由于本书的主题是关于理解\
  \ `Keras API` 与底层数学之间的区别，我们将跳过涉及 `RNN` 的等式。\n\n让我们从考虑数据应该是什么什么样开始。什么是序列？它是一个有序项的列表。例如：`1,\
  \ 2, 3, 4, 5, …`。序列的一个例子是随时间变化的 `USD-EUR` 汇率。人们也可能将这样的序列看作时间序列，或者更广泛地称为“信号”。注意，图像也是一种信号，但它是一个\
  \ 2 维信号（两个维度是高度和宽度）。时间序列是一个 1 维信号，因为只有一个 1 维度（时间）。\n\n顺带提一下，你可能会想：如果 `CNNs` 处理信号而\
  \ `RNNs` 处理序列，但序列实际上只是 1 维信号，那么 `CNNs` 能用于序列而 `RNNs` 能用于图像吗？答案是肯定的！研究人员已经尝试过，并发现这种方法是成功的。事实上，`CNNs`\
  \ 是像 Google 的 `WaveNet` 这种先进语音生成系统的后技术。但我们在这里有点操之过急。人们能想的最简单的时间序列是什么？正弦波如何？我们可以在给定一组之前值的情况下，构建一个\
  \ `RNN` 来预测该时间序列中的下一个值吗？当然可以！\n\n### 第 11 章总结\n- `CNNs` 允许你拥有比 `ANN` 更少的参数。\n- `CNNs`\
  \ 是像 Google 的 `WaveNet` 这种先进语音生成系统的后技术。\n- 我们可以构建一个 `RNN` 来预测该时间序列中的下一个值。\n\n# 第\
  \ 12 章\n\n\n\n\n\n# 预测时间序列 ![](img/rsrc64H.jpg)\n\n此示例的相关文件是 `sine.py`。警告：如果你现在还没有跟着我一起写代码，这一章将会变得极其混乱。让我们从导入部分开始。\n\
  \n```python\nimport numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as\
  \ plt\nfrom keras.models import Model\nfrom keras.layers import Input, SimpleRNN,\
  \ Dense\n```\n\n我们在这里唯一的新层是 `SimpleRNN`。我们要做的第一件事是生成数据。\n\n```python\n# 生成原始数据序列\n\
  series = np.sin(0.1*np.arange(200)) + np.random.randn(200)*0.1\n## 绘制图像\nplt.plot(series)\n\
  plt.show()\n```\n\n我们添加了一些噪声（因为“真实”数据是有噪声的），并对其进行了绘图，这样你就知道数据的样子（尽管你可能已经知道噪声正弦波是什么样的了）。\n\
  \n接下来，我们需要构建数据集。这需要稍微思考一下序列数据集应该是什么样的。回想一下，对于反馈神经网络（ANN），数据矩阵 `X` 是一个形状为 `NXD` 的\
  \ 2 数组。对于卷积神经网络（CNN），数据矩阵 `X` 是一个形状为 `NxHxWxC` 的 4 数组。对于循环神经网络（RNN），数据矩阵 `X` 是一个形状为\
  \ `NxTxD` 的 3 数组。按照习惯，`N` 代表样本数量。`T` 代表序列长度（你可以通过记住 Time 以 T 开头来记住这一点）。`D`（在 ANN\
  \ 的情况下）代表向量维度。因此，RNN “类似于” ANN，其输入是一个长度为 `D` 的特征向量，但对于 `N` 个样本中的每一个，我们在序列中考虑了 `T`\
  \ 个长度为 `D` 的特征向量。在正弦波的情况下，`D=1`，因为只有一个维度。\n\n`T` 是什么？在这种情况下，我们可以自己选择 `T`。我们生成了一个长度为\
  \ 200 的正弦波。你可以想象将正弦波分成重叠的窗口，每个窗口的大小为 `T`。假设 `T=10`。这意味着每个样本序列 `X[n]` 将包含来自正弦波的 10\
  \ 个连续值，而 `Y[n]`（对应的目标）将是正弦波的第 11 个值。换句话之，我们的 RNN 模型将学习将时间序列中的 10 步序列作为输入，并预测下一步。让我们用代码表示它：\n\
  \n```python\nT = 10\nD = 1\nX = []\nY = []\nfor t in range(len(series) - T - 1):\n\
  \    x = series[t:t+T]\n    X.append(x)\n    y = series[t+T]\n    Y.append(y)\n\
  X = np.array(X)\nY = np.array(Y)\nN = len(X)\n```\n\n我们首先将 `X` 和 `Y` 初始化为空列表。由于每个样本将包含\
  \ `T+1` 个值（`T` 用于输入，1 用于输出），我们只能循环到 `len(series) - T - 1`。对应输入的 `T` 个样本是 `series[t:t+T]`，对应输出的\
  \ 1 个样本是 `series[t+T]`。我们在循环的每次迭代中将它们添加到 `X` 和 `Y` 中。循环完成后，我们将 `X` 和 `Y` 转换为 Numpy\
  \ 数组。注意，此时 `X` 只是一个形状为 `NxT` 的 2 数组（这是因为我们添加到 `X` 中的每个 `x` 都是一个长度为 `T` 的 1 数组）。因此，为了让\
  \ `X` 符合 RNN 的正确格式（形状为 `NxTxD` 的 3 数组），我们需要添加额外的 1 个维度使其变为 `NxTx1`。\n\n```python\n\
  inputs = np.expand_dims(X, -1)\n```\n\n接下来，我们构建模型：\n\n```python\ni = Input(shape=(T,\
  \ D))\nx = SimpleRNN(5)(i)\nx = Dense(1)(x)\nmodel = Model(i, x)\n```\n\n比 CNN 简单得多，几乎和\
  \ ANN 一样简单。很好！按照习惯，我们从 `Input` 层开始。如预期，我们将输入形状指定为 `(T, D)`（记住样本数量 `N` 是隐式的）。我们将其通过一个\
  \ `SimpleRNN` 层。我们创建一个最后的 `Dense` 层，将 `SimpleRNN` 的隐藏值映射到单个值（因此 `Dense` 构造函数中的参数是\
  \ 1）。与本书中之前的示例不同，我们现在正在执行回归而不是分类。由于我们正在做回归，我们不希望最后的全连接层有任何激活函数。回想 `softmax` 激活函数会将输出限制在\
  \ 0 到 1 之间，使其代表一个有效的概率分布。回归输出可以是任何值，因为你不是在预测一个类别，而是在尝试预测一个数字。\n\n```python\nmodel.compile(loss='mse',\
  \ optimizer='adam')\n```\n\n相应，我们也不想使用 `categorical_crossentropy` 损失函数，因为那是用于分类的。相反，我们想要均方误差，指定为“mse”。按照习惯，我们使用“adam”优化器。\n\
  \n接下来，我们拟合数据：\n\n```python\nr = model.fit(inputs[:-N//2], Y[:-N//2], batch_size=32,\
  \ epochs=80, validation_data=(inputs[-N//2:], Y[-N//2:]))\n```\n\n我选择了数据的前半部分作为训练样本，后半部分作为验证样本。为什么？不像分类任务可以打乱数据，当你处理时间序列时，这样做并没有真正的意义。对于分类任务，打乱数据是合理的，因为它不依赖于时间。\n\
  \n\n\n\n\n# 神经网络与人工智能![](img/rsrc64J.jpg)\n\n只有人类具有思考、分析和理解其环境、其行为以及存在的现实的能力。只有人类可以解释自己的世界并进行抽象思考。我们的大脑可以接收大量信息并在几秒钟内得出结论。相比之下，机器使用相同的数据集将面临许多挑战。例如，今天，计算机可以包含一个拥有数千张相似图像的数据库，对它们进行评估并以\
  \ 95% 的效率得出结论。无论从哪个角度看，这都令人印象深刻，尽管如此，它仍然无法解释为什么选择这些图像，确定它们的含义，或者区分为什么一张图像与另一张不同。换句话说，计算机可以计算，但它们不能推理。因此，尽管它们能够完成给定的任务产生惊人的结果，但在许多方面，它们仍然远落于人脑的能力。\n\
  \n为了克服这些障碍，一种独特的机器学习形式应运而生。我们大多数人称其为人工智能或 `AI`。该术语指的是在机器中模拟智能。如今的机器被编程为“思考”并模仿人类大脑的运作方式。这些机器正在慢慢学会在特定情况下进行合理化处理，分析并选择最有可能实现最佳目标的行动方案。\n\
  \n随着技术的不断进步，旧机器变得过时是自然趋势。例如，执行基本功能或可以识别和识别文本的机器曾是尖端技术，但今天它们已经如此过时，不再被认为是人工智能。这是因为这种功能现在被认为是所当然的。这种能力已变得如此普通，以至于被视为普通的计算机功能。\n\
  \n今天被称为具有人工智能的计算机是那些展示出更令人印象深刻的能力的，例如下棋、自动驾驶汽车和智能家居。为什么这些功能被贴上了人工智能的标签？对于会下棋的机器，这些机器可以战胜人类对手；自动驾驶汽车已经掌握了吸收周围所有外部数据并进行快速计算的能力，使其能够导航并到达目的地而不会发生任何事故；智能家居可以与家庭成员互动，控制温度，管理安全，甚至提供食物供应以确保居住者的舒适。\n\
  \n当然，当任何全新的事物被引入世界时，往往会带有一些怀疑，人工智能也是如此。尽管我们每天都在与 `AI` 接触道，但大多数人并没有意识到。每当你通过 Apple\
  \ 设备与 `SIRI` 说话时，你就在使用人工智能。亚马逊的 `Alexa` 也使用了同样的技术。这些设备虽然印象深刻，但被认为是所谓的“窄人工智能”或“弱人工智能”。它们仅被编程执行极少数的任务。这些仅仅代表了\
  \ `AI` 在迈向更人性化的人机交互的长期目标上迈出的第一步入门阶段。尽管如此，除了许多人对 `AI` 的恐惧外，我们还将从这些优势中获得许多益处。\n\n\
