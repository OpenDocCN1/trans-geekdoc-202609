  \ `print` 语句在屏幕上显示一个虚拟的余额。\n\n# 第 14 章：目录\n\n### `mkdir()` 方法\n使用此方法在当前目录下创建目录。然而，你必须提供包含你想创建的目录名称的参数。`mkdir()`\
