  \ `Pandas` 和 `NumPy` 库处理 Python 数据集中的数据。\n- `NumPy` 模块提供了广泛的数学函数，这些函数对于 Python 中的数据处理至关重要。\n\
  - Python 中处理数据时常用的主要函数包括 `mod`、`multiple`、`log`、`tan`、`cos`、`sin`、`divide`、`sum`、`power`、`min`、`mean`、`var`、`max`\
  \ 等。\n- 常用于处理变量和整数的统计摘要。\n\n# 第 6 章：理解 K-Means 聚类\n\n我们在这里需要探索的下一步是 k-means 聚类算法。这是一个在机器学习中非常好用的算法，能够对你所做的编程提供很大帮助。它的基本思想是，你可以从系统中获取数据——即那些尚未标记类型的数据——然后将它们组合成不同的簇。\n\
  \n聚类是一种无监督机器学习。当你的数据没有标签时，就会应用它——使用该算法而非其他可用算法的目标，是为了更容易找到数据中已经存在的各种分组或相关聚类。处理这些聚类的程序员的主要目标是：最终位于同一个簇中的对象之间应该是密切相关的，并且它们与其他簇中的对象没有太大的相似性。\n\
  \n这里的相似性将是某种指标，用于显示数据对象之间这种关系的强度。数据挖掘领域将经常使用这种聚类，在进行探索性工作时尤其如此。但这并不是唯一从该算法受益的领域。你也可以将其用于数据压缩、信息检索、图像分析、模式识别和生物信息学等领域。\n\
  \n该算法可以根据数据不同值的相似性来形成一些数据簇。然后你将指定你希望的 `K` 值，即你希望算法从数据中生成的簇的数量。该算法可以从为每个簇选择一个质心值开始，然后经过共三个步骤，包括：\n\
  \n1. 你将从每个数据实例与所有簇质心之间的欧几里距离开始。\n2. 将数据实例分配给距离尽可能的质心所在的簇。\n3. 根据对应簇数据实例坐标的平均值，计算新的质心值。\n\
  \n\n\n\n\n# 使用 K-Means 聚类算法\n\n要使用此算法，k-means 的输入将位于矩阵 `X` 中。然后你可以对它进行处理并添加你选择的组织方式，以确保创建的每一行都是不同的样本，而每一列都包含你想要考虑的不同因素或特征。为了确保这一点的实现，你必须关注两个主要步骤。\n\
  \n### 初始化与步骤\n对于第一部分，你需要花时间选择组成各个簇的中心点。如果你在查看数据但不确定应该将这些中心点放在哪里，你可能需要从一些随机点开始，看看会发生什么。如果你这样做发现结果看起来并不太吻合，你可以返回并进行修改，看看新的中心点是否效果更好。\n\
  \n### 主循环\n我们需要关注的第二个步骤是主循环。在你确定了中心点之后，就可以决定所有数据点应该属于哪个簇。你可以查看所有的样本来帮助你判断数据点将属于哪一个簇。从这一点开始，你需要对聚类的中心点进行一些重新计算。你将根据分配给每个部分的点来执行此操作。\n\
  \n为了实现这一点，你需要获取所有的样本，然后确定这些样本的含义。一旦你得出了答案，你就拥有了 k-means。你需要不断重复这些步骤，直到算法实现收敛。一旦发生这种情况，聚类中心将不再有进一步的变化。在大多数情况下，取决于你起始的数据量，这将在五步或更少完成。但如果你有大量具有显著差异的数据点，那么可能需要更多步骤才能完成。\n\
  \n为了理解正在发生什么，让我们来看看 k-means 是如何工作的。\n```\n- - -  - ^ - | 1 |   | 2 | - - -  - -\
  \ - |  | |  | |  | \\ * - - - - | 3 | | 4 | - - - - - -\n```\n这是我们的初始化点。在这里，我们将会有四个标记为\
  \ 1、2、3 和 4 的向量。这两个聚类中心（`k=2`）在这一次中被随机分配给点 2 和 3。我们使用了 `*` 和 `^` 符号来帮助表示这些点。\n\n\
  现在是开始主循环的时候了。在这个阶段，我们需要完成的第一步是决定我们的点将移动到哪一个簇。看上方，我们可以看到点 1 和 3 都将成为左侧的中心，因为它们都离该中心更近。而右侧的中心点将分别属于\
  \ 2 和 4。我们在这里需要处理的第二件事是进行重新计算。这需要对聚类的中心进行，并基于每个簇内部的点。`*` 簇将在点 1 和 2 之间移动。`^` 簇也会发生同样的情况，但它将在点\
  \ 2 和 4 之间移动。对于这个示例，你需要使用以下代码为更复杂的数据实现这一操作：\n```\n- - - - ^ - | 1 |   | 2 | - -\
  \ -  - - - |  | *  |^ | \\ * - - - - | 3 | | 4 | - - - - - -\n```\n\n### 模糊 K-Means\
  \ 与软 K-Means 的区别\n当你处理这些内容时，你可能会注意到在使用 k-means 时，它们对初始化非常敏感。我们如何修复这个问题让区域不再那么敏感呢？你可以使用几种策略，但其中最好的方法之一是至少重启\
  \ k-means 两次。当你这样做时，可以比较结果，并看到哪一个提供了最好的结果，让我们知道代价函数以及它将如何受到影响。\n\n在你执行此操作时，你可能会发现，一种更容易应对任何挑战的方法是确保通过将被称为“成员身份”（membership）的信息添加到每个类别中来找到最佳结果。例如，你的模糊点可能最终属于第一个簇的\
  \ 60%，同时匹配第二个簇中 40% 的信息。然后你将使用软 k-means（soft k-means）的过程对之前使用的算法进行调整。第一部分是相同的，但你需要确保\
  \ k-簇中心回到数据中的部分随机点。为了实现这一点，我们需要遍历并写出聚类的一些责任度（responsibilities）。使用的最佳公式是：\n`r(kn)\
  \ = exp[-b * d(m(k), x(n))] / sum[j=1..K] {exp[-b * d(m(j), x(n))]}`\n\n从这里你可以看到\
  \ `r(kn)` 将以分数的形式出现，即 0 到 1 之间的数字，你可以将硬 k-means（hard k-means）或普通 k-means 解释为 `r(kn)`\
  \ 始终等于 0 或 1 的情况。`d(**)` 可以是任何有效的度量，但欧几里距离是最常用的。\n\n然后第二步，我们将根据我们希望的责任度来重新计算均值。为了实现这一点，我们将使用公式：\n\
  `m(k) = sum[n=1..N] {r(k,n) * x(n)} / sum[n=1..N] {r(k,n)}`\n\n考虑上述算法，你会发现它类似于加权平均。如果\
  \ `r(k,n)` 较高，那么对于簇 `k` 的均值就更重要。当你查看算法时，你会发现反过来也是的。\n\n### K-Means 目标函数是什么？\n就像我们讨论的监督学习一样，你必须花时间查看并讨论目标函数。为了从这个想法开始，我们需要使用所谓的欧几里距离来衡量每个中心的距离。我们将使用以下公式来解决这个问题：\n\
  `J = sum[n=1..N] {sum[k=1..K] {r(k,n) ||m(k) - x(n)|²}`\n\n这意味着你正在处理平方距离。因此，如果 `x(n)`\
  \ 距离均值很远，责任度就会被设为低值。这种情况被称为坐标下降（coordinate descent）。这意味着我们一次查看一个变量 `J`。\n\n当你查看这一切时，你会看到所有的迭代都可以导致目标函数。如果你足够这样做并正确地执行算法，你会发现点收敛了。记住，收敛并不意味着它们找到了寻找的全局最小值。数字将显示模式，而数学是最重要的。\n\
  \n### 如何添加 K-Means？\n在本章中我们仔细观察了 k-means 以及该算法如何结合不同的方法创建解决方案。现在已经完成了，是时候利用机器学习和\
  \ Python 来实现一些想法了。最好的方法是将软 k-means 实现到你的代码中。帮助你确定这些信息的公式与欧几里距离非常相似：\n\n```python\n\
  import numpy as np\nimport matplotlib.pyplot as plt\n\ndef d(u, v):\n    diff =\
  \ u - v\n    return diff.dot(diff)\n\ndef cost(X, R, M):\n    cost = 0\n    for\
  \ k in range(len(M)):\n        for n in range(len(X)):\n            cost += R[n,k]\
  \ * d(M[k], X[n])\n    return cost\n```\n\n一旦花时间将这部分添加到编译器并使用它来定义你的函数，就可以在绘制结果之前运行\
  \ k-means 算法，这意味着你得到一个散点图，其中颜色代表每个簇中的成员数量。要实现这一点，你需要使用下面的代码：\n\n```python\ndef plot_k_means(X,\
  \ K, max_iter=20, beta=1.0):\n    N, D = X.shape\n    M = np.zeros((K, D))\n   \
  \ R = np.ones((N, K)) / K\n    # 初始化 M 为随机\n    for k in range(K):\n        M[k]\
  \ = X[np.random.choice(N)]\n    \n    grid_width = 5\n    grid_height = max_iter\
  \ / grid_width\n    random_colors = np.random.random((K, 3))\n    plt.figure()\n\
  \    costs = np.zeros(max_iter)\n    \n    for i in range(max_iter):\n        #\
  \ 将绘图移动到循环内部\n        colors = R.dot(random_colors)\n        plt.subplot(grid_width,\
  \ grid_height, i+1)\n        plt.scatter(X[:,0], X[:,1], c=colors)\n        \n \
  \       # 步骤步：确定分配 / 责任度\n        # 这效率低吗？\n        for k in range(K):\n       \
  \     for n in range(N):\n                R[n,k] = np.exp(-beta * d(M[k], X[n]))\
  \ / np.sum(np.exp(-beta * d(M[j], X[n])) for j in range(K))\n        \n        #\
  \ 步骤步：重新计算均值\n        for k in range(K):\n            M[k] = R[:,k].dot(X) / R[:,k].sum()\n\
  \        \n        costs[i] = cost(X, R, M)\n        if i > 0:\n            if np.abs(costs[i]\
  \ - costs[i-1]) < 10e-5:\n                break\n    plt.show()\n```\n\n\n\n\n\n\
  # 第 6 章总结\n\n- K-means 聚类算法有助于将无标签的数据分组为不同的且定义的类，这些类包含关联紧密的数据。\n- 这为有效机器学习的进一步处理和分析奠定了基础。\n\
  - 无监督聚类是机器学习中至关重要的一步，因为它消除了人类在过程中的作用，提升了所涉及机器的“独立性”。\n- 聚类为数据挖掘领域提供了至关重要的基础，特别是该过程的无监督方面。\n\
  - 在 `k-means` 聚类中，到中心的距离决定了机器学习的效能。在这种情况下，该距离的建立方式如下：\n\n```\nJ = sum[n=1..N] {sum[k=1..K]\
  \ { r(k,n) || m(k) = x(n) ||²} }\n```\n\n\n\n\n\n# 第 7 章：列表 ![](img/rsrc64Y.jpg)\n\
  \n列表是 Python 中的另一种数据结构，它们也使用像字符串这样的序列。对于列表中的每个元素，都会被分配一个数字，以便将其放置在你正在操作的索引上。索引始终从零开始，一直到你告诉它停止为止。Python\
  \ 内置了大约六种序列。然而，你最经常注意到的是列表（lists）和元组（tuples）。在处理序列时，你可以对列表中的项进行切片、索引、添加、成员性检查，甚至对它们进行乘法。Python\
  \ 允许你使用程序内置的函数，因此你可以确定序列的长度，或者定位序列中最大和最小的元素。\n\n## 创建列表\n列表的创建非常简单，因为列表是你将在 Python\
  \ 中处理的最灵活多功能的数据类型之一。要创建一个列表，你只需要将你想放入列表的值放在其中，然后在变量之间加上逗号即可。务必记住将你的值放在一组方括号之间。记住，你并不需要在列表中保持相同的数据类型；如果你想的话，你完全可以混合匹配的选项。\n\
  \n示例：\n```python\nlist a = ['toys', 'cars', 'ducks', 3992, 4929]\nlist b = [1, 2,\
  \ 3, 4, 5]\nlist c = [a, b, c, d, e]\n```\n\n## 访问列表元素\n在 Python 中处理列表时有一条建议：你不应该将它们标记为“list”。然而，为了方便起见，本书中的示例被标记为列表。在创建列表时，你可能想根据你正在处理的内容为它们标记。例如，将它们标记为城市名或姓名。为了访问列表上的元素，你需要打印需要访问的索引。请记住，你访问的是索引开始的位置，以及紧接着在你需要它结束的位置的那个位置。\n\
  \n示例：\n```python\nPrint (list 1[3], list 1[4])\n```\n\n## 向列表添加元素\n有时你可能需要向列表添加元素，这意味着你的列表需要更新。你将使用\
  \ `append` 方法将元素成功地添加到你正在操作的列表中。\n\n示例：\n```python\n#!/usr/bin/Python\nlist 1 =\
  \ ['car', 'truck', '76', '56']\nprint \"the value located at the second index\"\n\
  print list[1]\n# dump truck\nprint \"add a new element at the second index\"\nprint\
  \ list[1]\n```\n结果：之前的值是 truck。新值是 dump truck。\n\n## 修改列表上的元素\n有时更新后的元素可能无法带给你你需要的结果。因此，你必须替换列表上的元素。要做到这一点，你需要引用对象所在列表的位置，然后指定你希望将元素更改为什么什么。\n\
  \n示例：\n```python\nlist 2 = [d, a, n]\nlist 2[3] = n\nlist 2[3] = m\nlist 2 [d, a,\
  \ m]\n```\n\n## 合并和重复列表\n如果你想用 Python 将列表相加，可以使用处理字符串时使用的相同方法。确保你正在操作的两个列表都用加号分隔。通过这样做，Python\
  \ 将将列表相加。\n\n示例：\n```python\nlist 3 = list 2+list 1\n```\n结果：list 3 现在包含了分在 list\
  \ 2 和 list 1 中的所有数据。\n\nPython 为你提供了两种重复代码中所需项的方法。你可以使用较长的方法，也可以使用较短的方法（强烈推荐后者，因为你需要写的代码更少）。无论你决定使用哪种方法，都将遵循相同的步骤并实现相同的目标。\n\
  \n- 方法 1：在 `xrange(d)` 中的次数\n- 方法 2：`[a]*d`\n\n在这个示例中，我们假设你想使用变量 `a`，并且它需要在两个列表中以不同的数量进行重复，以便该变量出现在每个列表中。\n\
  \n示例：\n```python\n[b] * 2 # B, b\n[b] * 6 # B, b, b, b, b, b\n```\n\n## 从列表中移除或删除项\n\
  有时你必须从列表中删除对象，就像你需要重复列表中的对象一样，你有两种方法可以遵循。你可以使用 `del` 语句，这样你就知道自己正在从列表中删除确切的元素。另一个选项是使用\
  \ `remove` 方法，但此方法只有在你不确定确切需要从列表中删除什么时才应该使用。\n\n示例：\n```python\nList 1=['truck',\
  \ 'car', 'toys', 23, 54]\nPrint list 1\ndel list 1[2]\nprint \"delete everything\
  \ that occurs after the second index.\"\nprint list 1\n```\n结果：`list 1 = ['truck',\
  \ 'car']`\n\n## 排序列表\n如果你使用 `sort()` 方法，就可以对列表上的对象进行排序。这类似于你之前看到的 `func`。\n语法：`list.sort([func])`\n\
  此函数没有任何你必须遵循的参数，因此你只需要将语法输入程序中，程序将完成其余工作。\n\n示例：\n```python\n#!/usr/bin/Python\n\
  list = [32, 42, dent, if]\nlist.sort()\nprint list\n```\n结果：`list [32, 42, dent,\
  \ if]` 如你所见，程序对列表进行了排序，因此所有内容都按字母和数字顺序排列。\n\n## count() 方法\n从名称就可以看出，该方法可以统计元素出现的次数。正如你所看到的，这个方法比你认为的更实用。\n\
  语法：`list.count(value)`\n此方法不需要任何你必须遵循的参数，你只需要输入你想要查找的值即可。它会返回该值在列表中出现的次数。\n\n示例：\n\
  ```python\nlist_1 = ['apple', 'banana', 'cherry', 'apple', 'apple']\nprint list_1.count('apple')\n\
  ```\n结果：3\n\n## 列表推导式 (List Comprehension)\n列表推导式是 Python 中创建新列表的一种强大方法。它允许你根据现有的序列快速创建新的列表。\n\
  语法：`[expression for item in iterable if condition]`\n这种方法通常比使用 `for` 循环创建列表更加简洁、易读。\n\
  \n示例：\n```python\nnumbers = [1, 2, 3, 4, 5]\nsquares = [x**2 for x in numbers]\n\
  print(squares)\n```\n结果：`[1, 4, 9, 16, 25]`\n\n你还可以使用 `if` 条件在推导式中过滤元素。\n\n示例：\n\
  ```python\nnumbers = [1, 2, 3, 4, 5, 6]\nevens = [x for x in numbers if x % 2 ==\
  \ 0]\nprint(evens)\n```\n结果：`[2, 4, 6]`\n\n\n\n\n\n# 第 7 章总结\n\n- 列表是 Python 使用字符串等序列的结构。通过操作序列，可以对列表中的项进行索引、切片、成员检查、添加或乘法操作。这些过程通过\
  \ Python 内置函数来实现。\n- 在 Python 中访问列表需要打印所需访问的索引。\n- 列表通过一组特定的数据创建，这些数据旨在植入机器内存中。它支持特定的或有针对性的机器学习。\n\
  - 生成生成器表达式在引导或影响代码编写方面起着至关重要的作用。\n- 调用带有生成器表达式的函数时需要单层括号。\n\n# 第 8 章：使用 Scikit-Learn\
  \ 构建神经网络\n\n神经网络是一种机器学习框架，试图模拟自然生物神经网络的运行方式。人类具有以极高精度识别模式的能力。每当你看到一头牛时，你都能立即识别出它是一头牛。这同样适用于你看到山羊的时候。这是因为你已经在一段时间内学习了牛和山羊长什么样，以及它们之间的区别。\n\
  \n人工神经网络是指计算系统，它们通过一种类似于人类神经系统的复杂架构，试图模仿人类的学习能力。\n\n## 神经元的结构\n\n神经元由细胞体组成，并有许多从中延伸出的结构。其中大部分以分支的形式存在，通常被称为“树突”。存在一个长突起或分支，这被称为“轴突”。信号的传输从轴突上的一个区域开始，该区域被称为“轴突丘”。神经元有一个边界，被称为“细胞膜”。细胞膜内外存在电位差，这被称为“膜电位”。\n\
  \n如果输入足够大，就会产生一些动作电位。然后，这种动作电位将沿着轴突向下传输并远离细胞体。\n\n神经元通过突触连接到另一个神经元。信息通过轴突离开神经元，然后传递给突触并传递到预期接收它的神经元。请注意，只有当阈值超过一定量时，神经元才会发放。信号非常重要，因为它们会被其他神经元接收。神经元利用这些信号进行通信。脉冲也负责对所发送的信息进行编码。突触既可以是抑制性的，也可以是兴奋性的。当脉冲到达兴奋性突触时，接收神经元将被触发发放。如果在抑制性突触处接收到信号，则接收神经元被抑制而不发放。突触和细胞体通常会计算传入的抑制性输入和兴奋性输入之间的差异。如果发现这种差异很大，神经元将被触发发放。\n\
  \n# 第 8 章总结\n\n- 神经网络在功能上在神经元级别运行。\n- 神经元由细胞体组成，细胞体散发出许多称为树突的延伸。\n- 在操作上，神经元的运行方式类似于人体系统内的细胞——具有完整的边界（等同于细胞膜）。\n\
  - 神经元通过突触相互连接，以建立一个复杂的网络。\n- 神经元的集合构成神经网络，并包含一套用于告知推理的信号系统或信息流。\n- 神经元利用信号系统或脉冲进行通信，从而对机器可能需要执行的特定目的或功能的信息进行编码。\n\
  \n\n\n\n\n# 第 9 章：机器学习与大数据 ![](img/rsrc650.jpg)\n\n在机器学习中，我们使用不依赖编程规则的算法来从数据中进行学习。然而，这些数据有时是海量的，并且会极大影响算法的预测准确性以及执行训练过程所需的时间。在机器学习中，这被称为大数据，其规模可以达到拍字节（petabytes），产生海量信息宝库。如果你停下来思考什么是拍字节，你就能直观感受到大数据有多大了。\n\
  \n然而，处理大数据的想法并不新奇。围绕海量数据工作的问题已经存在了数十年，即使在处理能力和存储容量非常有限的旧电脑时代也是如此。经典的分析技术无法处理大数据，仅仅是因为当时的技术太局限了。\n\
  \n## 今日面临的挑战\n\n尽管如此，大数据已成为一个独立的领域，但它仍然是数据科学和机器学习的一部分。人们提出了一个更的定义，它将今天的大数据描述为任何包含各种数据的信息块，这些数据以指数级增长的数量和速度不断产生。在这种情况下，当我们提到数据量时，我们讨论的是一种大到无法进行分析的信息量。\n\
  \n正如提到的，这个问题在互联网时代之前就已经存在了，仅仅因为我们的计算机比以前先进得得多，并不意味着大数据不再是难以应付的。请记住，社会的几乎每个部门都依赖于计算机和需要持续流动的数据流。我们必须处理的数据量正在指数级增长，根据专业机器学习专家和数据科学家的说法，每隔几年数量就会翻倍，而且产生速度也没有减少。\n\
  \n消费电子产品导致了数据流的大幅增加，随着不断演变的处理器和存储系统，以及互联网基础设施的改进，新大数据的产生速度是无法想象的。为了处理海量数据，必须设计新技术，并以更快的速度开发新硬件，以便实时处理所有信息。\n\
  \n想象一下，在 1986 年，世界的通信基础设施大约可以处理 280 拍字节。而到 2017 年，每天上传的信息量已超过了 300 拍字节。花点时间感受一下这个概念。\n\
  \n话虽如此，并不是所有信息都是平等的，因为有许多不同的格式。随处都有各种各异的数据——从电子邮件到股市信息——所有这些都需要被收集和存储。问题在于，并不是所有的存储系统都是平等的，某些格式需要专门设计的应用程序来处理。除了存储空间问题外，所有数据都需要进行分类才能被实际使用。这是另一个让大数据难以处理的方面，也让机器学习算法处理它时面临挑战。记住，所有这些收集起来的数据都需要被赋予价值才有意义。这正是大数据的价值直接取决于我们谈论的是什么类型。\n\
  \n例如，如果我们需要分析涵盖有史以来输入的所有推文的数据，它可能首先需要经过预处理阶段，这将消耗大量的时间和资源来进行管理。从这个问题又引发了另一个与网络安全相关的挑战。继续以\
  \ Twitter 为例，收集和存储的信息与用户有关。当涉及到大数据时，安全性成了一个主要的关注点，特别是在发生像剑桥分析（Cambridge Analytica）之类的丑闻之后。例如，所有这些围绕大数据的挑战和安全问题导致了欧盟采取了《通用数据保护条例》（GDPR），该条例明确定义了不负责任收集数据的后果。小规模的数据泄露可能导致严重问题；然而，大数据的泄露是灾难性的。\n\
  \n现在，如果我们再次观察所有收集的数据，我们会发现质量各不相同。来自巨大数据集信息的准确性是决定这些信息是否有用的主要因素，而且有许多因素会导致不准确。你首先应该问自己的是，收集数据的人是否尝试用不基于事实数据的理论假设来填补某些空白。其次，你可能也会好奇存储数据的系统。它是否被动过手脚？在同一区域由不同传感器进行的气压测量，但所有记录值都在同一时间产生。哪一个是正确的？甚至存在所谓的“正确”的吗？传感器是否故障了？会有很多事情出错，特别是当涉及到大量数据时。甚至于它的来源都可能被污染。如果我们的数据集包含了从某人的社交媒体页面提取的信息呢？无办法知道它是来自机器人还是真人。此外，我们还必须考虑到在上述提到的步骤之间处理数据的人可能犯的错误。正如你所见到的，由于许多因素，处理大数据是极具挑战性的。无论是由于技术局限性、人为错误还是无效的算法，这都是机器学习的一个子领域，仍然需要大量工作。这就是为什么在这一章中，我们将讨论大数据的基础知识以及我们能用它做什么。数据在持续堆积，随着新技术的开发，无论是在明天还是\
  \ 20 年后，你最终都必须处理价值拍字节的数据。\n\n## 现实世界应用\n\n大数据是机器学习的一部分，正如机器学习是大数据的的一部分。只要数据和信息在产生，机器学习在可见的未来就是一个一直存在的领域。例如，假设市场崩盘得很糟糕，谁来处理和分析崩溃期间收集的数据？没错——你将作为一名机器学习专家来完成这项任务。然而，用于预处理、分析和清洗数据的经典技术将在某某一天成为遗迹。随着数据集以以前所未有的更快速度变得越来越大，我们很快将不再处理小数据集。大数据将成为未来，因为比以前的要强大得多，并且提供了提供更准确预测的潜力。目前，处理它并不是一项容易的任务，但这最终会改变，这就是为什么你应该为未来做好准备。话虽如此，让我们看看大数据有多用，并理解它的应用：\n\
  \n1. **预测市场需求**：市场数据是海量的，而且它一直在变得越来越大。企业之间不断相互斗争和竞争，以获取客户和用户数据，以理解消费者的需求和购买习惯，从而进一步增加利润。这是一个大数据的例子，因为我们可以收集过去和现在服务、产品和购买的所有信息来预测模式。\n\
  2. **维护实践**：在如山的数据之下隐藏着可以预测工具或组件何时失效的因素。大数据对所有行业至关重要，未来也是如此，无论我们讨论的是螺丝钉制造商还是航空航天。筛选大数据可以产生有关材料、特定特性、型号、制造年份等更多信息。这些数据可以在机器学习技术的帮助下处理，结果将预测部件在最佳参数下何时会失效。一旦我们有了准确的预测，维护人员就可以在问题发生之前被派去处理，从而降低任何财务或健康风险。\n\
  3. **效率**：大数据在产生价值和回报方面已经证明了其极高价值。即使使用今天昂贵的分析方法，公司也能获得生产设施、产品回报、资源浪费甚至未来趋势的盈利信息。计算生产成本和预测利润并非易事，但越来越多的机器学习专家在这一领域比经济学家更有价值。\n\
  \n\n\n\n\n# 第 9 章总结\n\n- 无处不在的消费级应用程序及其在社会中的普及导致了数据数量和多样性的急剧增长。\n- 机器学习通常独立于编程的。然而，随着大数据的增加，算法在机器学习中已变得至关重要，能够增强相关机构创造价值的能力。\n\
  - 机器学习与大数据交叉领域的重要性，可以在业务中的市场需求预测、效率优化和维护实践中得到体现。\n- 云计算为个人和组织层面的大数据问题提供了一种易于获取的解决方案。\n\
  \n# 第 10 章：机器学习与支持向量机\n\n我们现在已经花时间查看了两种用于机器学习的辅助算法。当我们考虑使用 `SVM` 算法时，你会发现当程序员在处理工作中的数据遇到回归和分类问题时，通常会使用这种算法。当我们观察这一算法时，分类方面有大量工作需要完成，这使得所处理的工作变得更加棘手。但通过\
  \ `SVM` 及其相关的算法，你会发现你能够以整体上更高效的方式来应对这些挑战。\n\n首先，当你准备好使用这种特定算法时，程序员需要对每组数据进行绘图，使它们成为\
  \ `n` 维空间中的一个点。`N` 代表所有特征，以及将这些特征转换到坐标值上的工作。随后到达该点所做的工作是花时间确定 `hyperplane`（超平面）。我们想知道这一点，因为它向我们展示了出现的不同类别。在此处，你可能会注意到在使用\
  \ `SVM` 算法时可能会出现多个支持向量。然而，并不是所有的这些向量都是你想要使用的，某些只是你看到的单个观测值的坐标。然后，你就可以使用 `SVM` 作为边界，帮助将你看到的不同支持向量划分到不同的类别中。一旦按照这样划分，你就可以更容易地关注那些真正重要的部分了。\n\
  \n当我们仅仅列出 `SVM` 的用途和说明，而不查看其工作原理或一些示例时，这可能再次看起来有些困惑。你可以执行并采取以下几个步骤，以帮助使用 `SVM` 来帮助你整理拥有的数据。要开始这个，我们需要查看\
  \ `hyperplane`。可能存在两个或多个超平面供你选择，这增加了一个挑战，因为你想选出一个最适合你且能给你提供整体最准确结果的一个。当你有点担心应该使用哪一个超平面时，好消息是，实际上有一些建议可以遵循，以便查看你的超平面选择并帮助你选出正确的一个。\n\
  \n你需要的步骤包括：\n- 我们将从三个超平面开始，称称为 `1`、`2` 和 `3`。然后花时间确定哪一个超平面是正确的，以便我们对星形和圆形进行分类。\n\
  - 好消息有一个相当简单的规则可以遵循，这使得更容易识别哪一个超平面是正确的。你想选择的超平面将是那个能最好分离类别的。\n- 那一个很容易处理，但在下一个例子中，我们的超平面\
  \ `1`、`2` 和 `3` 都穿过了这些类别，并以类似的方式将它们分离。例如，所有的线或这些超平面将彼此平行。从这里你可能会发现很难选出哪一个超平面是正确的。\n\
  - 对于上述问题，我们使用使用所谓的 `margin`（间隔）。这基本上是 `hyperplane` 与两个类别中任一类最最近的数据点之间的距离。然后你就可以获得一些可以帮助你的数字。这些数字可能靠得很近，但它们会指明哪一个超平面是最好的。\n\
  \n我们在上面步骤中列出的示例只是你将 `SVM` 作为机器学习工具的一个例子。但它是一个很好的例子，让我们了解了将这种算法引入应用时我们能做的事情。当你有一组可以使用的数据时，并且看到有某种\
  \ `margin` 存在帮助你分离这些点时，那么你可能想要引入 `SVM` 算法来帮助你获取你需要的信息。\n\n另一个你想要处理这种特定机器学习算法的原因是，通过这种模型，你可以扩展它，并让它运行在任何维度空间被认为高于常常的项目上。虽然某些时候\
  \ `SVM` 方法对你来说不是最好的，但它仍然是一种很好的机器学习算法，可以帮助你整理数据并获得答案。当你有一组存在 `decision function`（决策函数）中的训练点子时，这就是\
  \ `support vector`（支持向量），并且当你看到任何系统或程序的内存足够可以进行此操作时，这将成为一种技术。引入这种算法并让它为你工作有很多益处。但某些时候，它会导致弊大于利。例如，当你有一组非常大的数据需要整理时，这种算法可能无法像其他选项那样给你最准确的预测。这些算法的训练时间可能更高，这对于一些不习惯机器学习的人来说是令人失望的。最后，当你的某些目标类别重叠时，这种算法将无法向你展示你想要的结果或以你想要的方式运行。\n\
  \n# 第 10 章总结\n\n- `SVM` 算法作为机器学习工具，在处理分类问题时提供了平台。\n- `SVM` 算法可以支持多个向量。\n- 机器学习中的\
  \ `SVM` 算法具有扩展性，可以运行在任何维度空间被认为高于常的项目上。\n- 该机器学习算法能够整理数据以回答特定问题。\n\n\n\n\n\n# 第 11\
  \ 章：使用神经网络 ![](img/rsrc652.jpg)\n\n现在我们需要看看如何实际使用这个库来完成一些操作，而没有比神经网络更适合使用这个库的去处了。当我们观察神经网络时，我们将学习的是一种作为无监督机器学习算法运行的方法。当你需要捕捉你正在查看的数据或信息中存在的模式时，就会使用它们。现在，这种操作将在不同的层级进行，并且其方式比人眼观察更快速、更有效。\n\
  \n在这些神经网络中，你会发现你拥有的每一层都会花费时间观察对象或图像，并查看那里是否存在某种模式。如果这个过程意味着该层能够发现新模式，那么就是时候进入新层并重新开始一切了。这是一个持续的过程，一层完成后就会移动到另一层，直到所有层层都处理完毕。从这里开始，算法能够让程序对图像内部的内容给出良好的预测。\n\
  \n基于这种处理过程，根据程序运行的方式，会出现一些现象。如果算法通过了这种处理过程，并成功地筛选了各个层，它将会做出预测。当该算法能够做出准确的预测时，你会发现系统的神经元会记住这一点并变得更强大。\n\
  \n这种方法之所以有效以及神经元之所以能变得强大，是因为它是基于人工智能的。这有助于系统在出现的模式与对象之间建立非常强的关联。这里很棒的一点是，你的系统执行此过程并为你提供正确答案的次数越多，它执行此操作的效率就越高。\n\
  \n现在，这似乎有些有些实际，好像不是真的会发生。但对这些神经网络进行仔细检查将帮助我们理解它们是如何协同工作的以及为什么它们如此重要。对于我们的示例，假设你的目标是创建一个程序，它可以读取你输入的照片，然后通过观察这张照片并经过各个层，程序能够识别出照片中的图像是一辆汽车。如果程序设置得当，它将做出正确的预测，即图中有一辆汽车。程序根据它已经知道属于汽车的某些特征得出此预测，包括颜色、车牌上的数字、车门的位置、大灯等。当你使用现有的某些常规编码方法时，这个过程可能非常难以实现。你会发现神经网络系统可以让这一工作变得非常简单。\n\
  \n要让这个算法运行起来，你需要提取一张汽车的照片并提供给系统。当神经网络启动时，你会发现它能够查看这张照片。它将从第一层开始工作，在这种情况下，第一层将是汽车的边缘。然后它将继续处理更多的层，以确保它能够找出照片中的哪些独特特征，直到它识别出该图像是一辆汽车。现在，如果程序成功并擅长做出正确的预测，它将存储这些信息，并变得更擅长识别汽车的所有细小细节以供下次使用。它将擅长识别窗户、颜色、轮毂纹样等，并在你下次向它提供信息和汽车照片时使用这些信息。\n\
  \n根据你将在神经网络中处理的图像或处理过程的不同，你会发现它可能伴随着许多不同的层。但这实际上是件好事，尽管最初它会减慢整个过程。它允许神经网络更擅长寻找它正在寻找的特征。例如，当你尝试编写一种用于人脸识别的软件时，神经网络需要通过许多不同的层，以确定谁属于一个区域，谁不属于。\n\
  \n现在，你可以想象会有很多方法可以使用神经网络来帮助机器学习，这也带来了许多益处。当你与神经网络工作时，看到的优势之一是，你可以使用这种方法而不需要从一开始就控制算法的统计数据。即使你无法从一开始引入所有的统计数据，或者你不确定具体将如何使用它们，你会发现神经网络可以用来确保任何存在的复杂关系都能显现出来。这很重要，因为这发生在变量之间，无论它们是依赖的还是独立的，即使你发现变量是非线性的。这种方法并非总是有效，在某些情况下，它会花费太多时间，并且过程太复杂，无法获得你想要的结果。例如，许多程序员在使用此时看到的最大的负面影响是计算成本很高。对于某些项目和某些企业来说，这会花费过多的时间、算力和金钱，变得得不值。\n\
  \n# 脚本与模块化\n\n在脚本模式下，你所做的就是在文本编辑器中编写程序。如果你完成了并想尝试运行，你必须将其保存为 `.py` 文件。如果你正确安装了 Python，只需打开保存的\
  \ `.py` 文件，它就会执行你的程序或脚本。另一方面，如果你正在运行大型项目，可以进行模块化。模块化意味着你使用多个文件来编写程序。例如，你可以将程序的所有函数写在一个名为\
  \ `modFunctions.py` 的 `.py` 文件中，然后将主程序流放在名为 `main.py` 的 `.py` 文件中。当然，它们不会自动协同工作。为了让它们协同工作，你需要在程序中加载已有的模块文件。你可以通过\
  \ `import` 和 `from` 关键字来实现这一点。\n\n## Import 关键字\n\n`import` 关键字允许你在程序中加载模块，然后为你加载的模块创建一个引用。如果你需要访问或使用某个属性或方法，你将需要使用完整路径。如下所示：\n\
  \n```\n# SimpleMath\ndef add(x, y):\n    # 将两个值相加并返回和\n    result = x + y\n    return\
  \ result\n\ndef subtract(x, y):\n    # 从 x 中减去 y 并返回差值\n    result = x - y\n   \
  \ return result\n```\n\n现在，在解释器中导入 `add` 方法：\n\n```python\n>>> import SimpleMath\n\
  >>> SimpleMath.add(1, 2)\n3\n>>> SimpleMath.subtract(1, 1)\n0\n```\n\n## From 关键字\n\
  \n调用模块的另一种方法是使用 `from` 关键字。通过它，你可以从模块中选择性加载。例如：\n\n```python\n>>> from SimpleMath\
  \ import add\n>>> add(2, 3)\n5\n```\n\n如果你想从模块加载所有内容，可以使用星号 (`*`) 表达式。例如：\n\n```python\n\
  >>> from SimpleMath import *\n>>> add(6, 23)\n29\n>>> subtract(10, 2)\n8\n```\n\n\
  ## As 关键字\n\n如果你不想项目和你加载的模块之间产生冲突，可以使用 `as` 关键字为你导入的方法或属性指定别名。如下：\n\n```python\n\
  >>> from SimpleMath import add as addition\n>>> addition(12, 67)\n79\n```\n\n在机器学习和其他大型项目中，加载模块将是常见做法。此外，在机器学习中，你将被使用其他用户的多个模块和库。毕竟，模块化是创建程序的高效方法。作为一个提示，永远不要忘记旧项目。不要删除它们，而是让它们在你的电脑里留一段时间。你以前创建的一些函数在当前项目中可能会很有用。\n\
  \n# 如何使用 Python 进行机器学习\n\n此时，你已经熟悉了编程和 Python。现在，你将学习如何使用 Python 进行机器学习。你需要三样东西：\n\
  - Python\n- 数据集\n- 模型\n\n# 注意事项\n\n作为警告，如果你是初学者，建议编写 Python 程序。玩玩这种语言并熟悉 Python\
  \ 的特性。你在编程上花费的时间越多，处理机器学习就会越“容易”。此外，当你创建一个项目时，请务必完成它。没有什么比不完成项目更阻碍学习进步的了。你应该注意的另外一点是，创建机器学习并不是线性的项目。然而，以下是关于你需要学习和做的事情的大致指南：\n\
  \n\n\n\n\n# 1. 识别你想要解决的问题\n# 2. 准备你所需的数据\n# 3. 建立你的算法\n# 4. 优化你的结果\n# 5. 展示你的结果\n\
  \n在机器学习中，你应该有一个明确的目标。而且通常情况下，机器学习的初始目标是解决某个问题。例如，这个问题可以是识别整个《哈利·波特》系列中哪一句话最令人难忘。要解决这个问题，获取数据是必须的。对于这个问题，你的数据可以是《哈利·波特》系列所有书籍的全文，和/或搜索引擎或哈利·波特相关网站的搜索数据。一旦你有了问题和数据，下一步就是确定如何使用现有的数据来解决问题。对于这部分，你需要创建一个算法。你的程序如何知道《哈利·波特》书中哪一句话是令人难忘的？它将如何判断？它将如何决定？它将如何解析数据？建立算法后的下一步是测试它。让你的程序运行并等待结果。一旦结果出来，就对其进行分析。程序能够解决问题吗？结果令人满意吗？如果程序返回的结果不令人满意，那么是时候对其进行优化了。在优化并获得你想要的结果后，该考虑程序将如何展示它的数据。它只是生成表格吗？还是会创建文字来描述和展示结果？\n\
  \n## 数据可视化与预处理\n如今，数据可视化已经变得非常普遍。毕竟，数据无处不在——社交媒体、书籍、电视，甚至是高管仪表板——人们对数据的渴望就像沙漠里的水。什么是数据可视化？数据可视化是一种呈现数据的方法，通常以易于理解和易消化的方式呈现大量数据。它可能涉及静态和动态元素。它可能利用设计趋势。为什么这在机器学习中很重要？嗯，首先，机器学习的通常工作是摄和生成数据。这通常是机器学习的目的。计算机处理并操作数据。当然，使用所有这些数据的是人。如果计算机或用户不花精力进行数据可视化，机器学习的最终结果将只是字符串和数字的混乱。除了为人们提供易于理解的数据外，机器也可以从数据可视化中受益。在程序中加入数据可视化可以让程序理解哪些数据对终端用户是重要的。例如，如果你为机器学习程序创建数据可视化以寻找《哈利·波特》系列中最流行的句子，程序将立即知道如何展示和挑选数据，这对于它和用户来说都是重要的。\n\
  \n## 数据挖掘的预处理方法\n数据预处理一直是 IT 行业中的一个重要方面。随着大数据的存在以及更现代、高效的数据挖掘技术，数据预处理从未像现在这样关键。没有它，处理海量数据将是不可能的，或者至少会消耗大量的时间和资源。在机器学习中，处理海量数据是一个典型场景。如果你追求效率，为你的数据应用预处理器应该是一个默认组件。在互联网上可以找到多个数据预处理模块。你可以在程序中自由地使用它们。然而，如果你要处理独特的数据集或你想要的结果很，你就需要自己为预处理器编写程序。另一方面，预处理对于你精确地采集和操作数据非常重要。某些数据集可能包含不兼容的数据，这很容易破坏你的程序算法。因此，最好对数据进行过滤，以避免在数据处理过程中出现错误和不准确。如果你的数据集包含不一致性且并非\
  \ 100% 可靠，这一点将尤为重要。\n\n| 第 11 章总结 |\n| :--- |\n| 从功能上讲，神经网络作为无监督机器学习算法运行。<br> 学习通过提供目标数据来引发。<br>\
  \ 算法的设置是其提供任何预测见解或投影的能力的基础。<br> 此外，机器学习和神经网络的功能依赖于学习过程，而这种过程通过持续提供正确答案所建立的效率得到加强。<br>\
  \ Python 为机器学习提供了一个至关重要的平台——它提供了所需的函数、数据集和学习模型。 |\n\n## 第 12 章：人工神经网络![](img/rsrc653.jpg)\n\
  神经网络是非常新颖的领域之一。目前，大型公司和成长型公司都在竞涌进入这一前沿领域。深度学习是一个与神经网络相关的术语。深度学习和神经网络都具有从数据和环境中学习的强大能力。因此，它们是机器学习的首要和首选选择。神经网络的常见应用包括：\n\
  - 汽车自动驾驶\n- 图像处理与识别\n- 咨询和推荐系统\n\n人工神经网络是强大的方案，对各种类型的数据表现出极强的适应能力。“人工”二字揭示了名称的来源。人工神经网络模拟人类神经系统。神经元由以下主要部分组成：\n\
  - 树突：这些是接收来自其他神经元的输入电脉冲的接收器。然后由细胞体做出决定，得出对这些输入所需的动作。\n- 轴突和轴突末端：这些是神经元传输器。它们将输出决策作为电脉冲传输给其他神经元![](img/rsrc654.jpg)\n\
  \n### 人类神经元\n神经元可以分为三个部分/阶段：输入、处理和输出。这是说明生物神经网络与人工神经网络之间类比的关键。\n\n### 人工神经网络\n人工神经网络\
  \ (`ANN`) 是一种计算模型，受益于之前描述的生物神经网络的想法。人工神经网络是一种模拟人类处理数据智能的学习方法。神经网络是一类卓越的监督机器学习算法。它们被用于回归和分类。根据要分析的数据类型，其他已知类型包括卷积神经网络和循环神经网络。前者在图像处理中表现出非常好的。另一方面，循环网络在序列数据相关问题（如动态系统建模和自然语言分析）中取得了很好的水平。\n\
  \n神经网络主要有三个不同的层：\n1. 输入层。\n2. 隐藏层：在这一层中，对来自上一层的输入进行处理。隐藏层可以包含多个层。\n3. 输出层：数据经过处理后，它将在该层中可用。\n\
  \n\n\n\n\n可以注意到，变量由节点表示。网络层通过颜色进行区分：红色、绿色、蓝色分别代表输入层、隐藏层和输出层。让我们将 `X0` 和 `H0` 定义为虚拟变量。它们的值始终为\
  \ 1。虚拟变量见下图。![](img/rsrc655.jpg)\n\n## 神经网络层\n\n### 1- 输入层\n输入层的规则是与外部环境交互。它处理来自数据源的输入。然后，输入被传输到隐藏层。每个输入代表一个影响网络输出的独立变量。输入是一些特征，例如：`Height`、`Age`、`weight`、`image\
  \ data` 或 `hours of sleep`。\n\n### 2- 隐藏层\n隐藏层是中间层，位于输入层和输出层之间。它由应用了激活函数的神经元组成。隐藏层的工作是处理和计算从上一层接收的输入。因此，它的责任是从输入数据中提取感兴趣的特征。隐藏层可以包含多个一个隐藏层。因此，需要考虑的问题之一是根据学习类别选择隐藏层的数量。如果输入数据可以线性分离，那么我们可以跳过隐藏层。这是因为激活函数可以设计成一个能够解决问题的输入层。在具有复杂决策的问题中，可以使用三到五个隐藏层。在有多个隐藏层的情况下，符号\
  \ `H` 将具有一个指示隐藏层数的上标。具有多个一个隐藏层的神经网络也被称为深度学习或深度神经网络。\n\n### 3- 输出层\n输出层是我们获得想要预测的值的阶段。神经网络的一个很好的优点是输出模式可以追溯到输入层。这意味着输出层中神经元的数量与神经网络执行的工作类型之间存在逻辑关系。输出层中神经元的数量与神经网络的预期用途有关。\n\
  \n## 隐变量\n在神经网络中，隐变量项很常见。然而，对于本书的读者来说这并不新鲜。隐变量是输入的函数。在神经网络中，这种关系通过边来表示。每条边从左向右流动，这意味着接收边的每个变量都是其边来源变量的函数，以及与该边相关的权重。\n\
  \n## 神经网络中的流程\n人工神经网络（ANN）中的每个神经元都代表一个激活节点。激活节点与输入节点连接，以便应用学习算法计算加权和。然后，将加权和传递给激活函数，从而预测结果。在这里我们有了“感知机”的概念。感知机意味着接受许多输入并导致一个输出。\n\
  \n\n\n\n\n# 第 12 章总结\n\n- 人工神经网络通常应用于自动驾驶汽车、图像识别与处理、推荐及咨询系统。\n- 人工神经网络（ANNs）由三层组成：输入层、隐藏层和输出层。\n\
  - 神经网络由多个神经元组成。每个神经元都是一个激活节点，与输入节点相连，以便成功应用学习算法。\n- 神经网络的运行机制模拟了人类神经网络的核心功能。\n-\
  \ 这种方法为深度学习奠定了基础，促进了有效的机器学习方法以及神经网络的后续应用。\n\n\n\n\n\n# 第 13 章：数据清洗 ![](img/rsrc657.jpg\n\
  \n与瑞士或日本手表的设计相似，一个良好的机器学习模型应该运行流畅且不包含多余的部件。这意味着要避免阻止代码执行的语法或其他错误，并移除可能堵塞模型决策路径的冗余变量。这种对简单性的追求也适用于开发首个模型的初学者。例如，在处理新算法时，尝试创建一个**最小可行模型**，稍后再向代码中增加复杂性。如果你发现自己陷入了困境，请观察引起问题的元素并问自己：“我需要它吗？”如果模型无法处理缺失值或多种变量类型，最快捷的解决办法是移除这些棘手的元素。这应该有助于受困扰的模型恢复生机并正常运行。一旦模型运行正常，你就可以返回并增加代码的复杂度。\n\
  \n## 什么是数据清洗？\n\n数据清洗是为分析做准备而对数据进行处理的总称。例如，某些算法无法读取特定的数据类型，或者在遇到缺失值或非数值输入时返回错误信息。变量也可能需要缩放大小或转换为更兼容的数据类型。例如，线性回归分析的是连续变量，而梯度提升法要求将离散（类别）变量和连续变量以整数或浮点数的形式数值化。重复信息、冗余变量和数据中的错误也可能破坏模型提供洞察的能力。在处理数据（特别是私有数据）时，另一个潜在的因素是移除个人标识符，这些可能会违反相关数据隐私法规或损害客户、用户和其他利益相关者的信任。对于公共数据集来说，这不是大问题，但在处理私有数据时需要注意。\n\
  \n## 移除变量\n\n为后续处理准备数据通常从移除与选择算法不兼容的变量，或被认为与目标输出关联较小的变量开始。从数据移除哪些变量通常由探索性数据分析和领域知识决定。在探索性数据分析方面，检查变量的数据类型（如\
  \ `string`、`Boolean`、`integer` 等以及变量之间的相关性是消除变量的有效措施。同时，领域知识有助于发现重复变量（例如国家代码和县代码），并消除如经纬度等相关性较小的变量。\n\
  \n在 Python 中，可以使用 `del` 命令配合 dataframe 的变量名以及想要移除的列标题从 dataframe 中删除变量。列标题应嵌套在引号和括号内，如下所示。\n\
  \n```python\ndel df('latitude')\ndel df('longitude')\n```\n\n注意，此代码示例除了你在笔记本中进行的其他更改外，不会影响或更改源数据。你甚至可以通过删除相关的代码行来恢复从开发环境中移除的变量。在用不同的变量组合重新测试模型时，撤销特征的移除是很常见的。\n\
  \n## 独热编码（One-hot Encoding）\n\n数据科学中常见的障碍之一是变量的数据类型与模型算法条件之间的不匹配。虽然变量的内容可能相关，但算法可能无法以默认格式读取数据。例如，基于文本的类别值无法使用通用聚类和回归算法进行解析和数学建模。一种快速补救方法是将类别变量重新表示为数值分类器。这可以使用称为“独热编码”的常用技术来实现，将类别变量转换为二进制形式，表示为“1”或“0”——“True”或“False”。\n\
  \n```python\nimport pandas as pd\ndf = pd.read_csv('~/Downloads/listings.csv')\n\
  df = pd.get_dummies(df, columns=['neighbourhood_group', 'neighbourhood'])\ndf.head()\n\
  ```\n\n在 Jupyter Notebook 中运行该代码。独热编码通过增加新列来水平扩展 dataframe。虽然扩展数据集不是大问题，但你可以使用参数来移除可扩展列，从而简化\
  \ dataframe 并享受更快的处理速度。根据演绎逻辑，该参数为每个原始变量减少一列。Python 解释器可以根据其他变量的虚假参数，在不引用可扩展列的情况下推导出每个变量的真实值。在统计学中，这种概念被称为**多共线性**，描述了根据其他变量的值预测变量的能力。要在\
  \ Python 中移除可扩展列，我们可以添加参数 `drop_first=True`，它会移除每个变量的第一列。\n\n```python\ndf = pd.get_dummies(df,\
  \ columns=['neighbourhood_group', 'neighbourhood'], drop_first = True)\n```\n\n\
  ## 丢弃缺失值\n\n另一个常见但更复杂的数据清洗问题是决定如何处理缺失值。解决这个问题有很多快速修复方法，但让我们先查看检查缺失值的代码。\n\n```python\n\
  df.isnull().sum()\n```\n\n使用 `isnull().sum()` 检查缺失值。通过这种方法，我们可以获得每个特征缺失值的总体概览。从这里我们可以看到四个变量包含缺失值，其中\
  \ `last_review` (3908) 和 `reviews_per_month` (3914) 的值较高。虽然这对于所有算法都不是必须的，但我们有几种方案可以修复这些缺失值。第一方法是使用\
  \ `fillna` 方法用该变量的平均值来填充缺失值。\n\n```python\ndf['reviews_per_month'].fillna((df['reviews_per_month'].mean()),inplace=True)\n\
  ```\n\n这行代码将变量 `reviews_per_month` 的缺失值替换为该变量的平均值（平均值），对于该变量，该值为 1.135525。我们还可以使用\
  \ `fillna` 方法用众数（数据集中该变量常见的值）来近似缺失值。\n\n```python\ndf['reviews_per_month'].fillna(df['reviews_per_month'].mode(),inplace=True)\n\
  ```\n\n\n\n\n\n# 第 13 章总结\n\n- 数据清洗（Data scrubbing）是数据处理的预分析过程。\n- 通过移除不兼容的变量来增强数据的兼容性，以满足目标答案。\n\
  - 高效有效的数据科学要求变量的数据类型与模型算法的条件匹配。可以使用独热编码（One-hot encoding）来建立这种匹配。\n- 机器学习并不一定要求将多维数据集简化为四个或更少的变量。\n\
  - 在机器学习中，对数据进行变形和清洗是必要的。可以使用无监督算法来承担这一角色。\n\n# 第 14 章：语法\n\n我们刚刚接触了 Python 中的各种类型的数据。现在，我们应该找出可以使用哪些命令。首先，我们将研究缩进；其次，我们将解释流程语句——`if`、`for`、`while`、`break`、`continue`\
  \ 和 `pass`。\n\n## 缩进\n\n缩进是 Python 最具特色的语法元素之一。让我们来看经典的例子：\n\n```python\ndef perm(l):\n\
  \    # Compute the list of all permutations of l\n    if len(l) <= 1:\n        return\
  \ [l]\n    r = []\n    for i in range(len(l)):\n        s = l[:i] + l[i+1:]\n  \
  \      p = perm(s)\n        for x in p:\n            r.append(l[i:i+1] + x)\n  \
  \  return r\n```\n\n你可以看到，很容易看出代码在哪里结束，下一行代码在哪里开始。缩进用于指示代码块。显然，你必须对每个块使用相同数量的空格缩进。在\
  \ Python 中，我们使用缩进来指示特定的代码字符串属于哪个块。另一个很棒的特性是块结束规则是通用的，因此我们不需要指定 `end`、`endif`、`fi`、括号、`wend`、`endwhile`、`next`、`loop`、`end\
  \ procedure` 或 `end function`。我们只需要遵守缩进。\n\n## IF 语句\n\n什么是流程语句？它是允许程序根据情况做出决策并按特定顺序读取代码的功能。我们可以使用一些流程工具来控制语句的执行。\n\
  \n`IF` 指令可能是所有编程语言中最常用的命令。我们可以使用 `IF` 来检查条件。这里是 `IF` 如何工作的的示例：只有当 `IF` 条件为真时，我们才运行语句块；否则，我们执行另一个语句。\n\
  \n`IF` 语句语法示例：\n\n```python\nx = int(input(\"Please enter an integer: \"))\n# Please\
  \ enter an integer: 42\nif x < 0:\n    x = 0\n    print('Negative changed to zero')\n\
  elif x == 0:\n    print('Zero')\nelif x == 1:\n    print ('Single')\nelse:\n   \
  \ print('more')\n```\n\n我们可以观察到 `:`，我们用于结束控制程序流程的测试。你可以根据需要插入任意的 `Elif`；在上面的示例中，最后一个\
  \ `Elif` 不是强制性的。\n\n## FOR 语句\n\n`For` 指令允许我们定义迭代。为了决定我们需要多少次迭代以及在哪个元素上执行迭代，我们必须使用任何可以考虑的对象。传统上用于精确地重复某段代码。我们已经见过许多序列示例：列表、元组、字符串。这些都是我们可以用\
  \ `For` 进行迭代的数据：\n\n```python\nfor c in \"abc\":\n    print c\n# Output: A B C\n\
  # >>>\n```\n\n在我们在没有正确序列的情况下如何执行简单的迭代若干次呢？我们可以使用 `range` 对于 `n`：\n\n```python\n\
  for n in range (4):\n    print n\n# 0 1 2 3 \n```\n\n使用 `range` 命令，我们还可以选择迭代的开始和结束。`For`\
  \ 还允许我们同时在更多变量上执行循环。这是可能的因为字典中的 `items()` 方法给出了由其自身的键和值组成的元组列表。`For` 在此列表的每个元素上建立循环，并为变量\
  \ `key` 和 `value` 提供我们在每个元组中的值。\n\n## WHILE 语句\n\n`While` 指令与 `For` 指令类似。唯一的区别是迭代不是基于固定的序列，而是只要给定条件为真就执行操作。这里是\
  \ `While` 如何工作的示例：\n\n```python\nx = 1\nwhile x < 7:\n    print x\n    x += 1\n\
  # 1 2 3 4 5 6\n# >>>\n```\n\n在上面的示例中，递增语句（`x += 1`）一直执行直到计数保持在 7 以下。如果条件保持为真，我们就有了所谓的“死循环”。在这种情况下，你应该按下\
  \ `CTRL + C` 来关闭程序。\n\n## Break 和 Continue\n\n`Break` 和 `Continue` 用于停止当前迭代并跳到下一个迭代。你经常会在\
  \ `for` 循环和 `while` 循环中使用 `Break`，就像这些经典示例：\n\n```python\nfor var in sequence:\n\
  \    # codes inside for loop\n    if condition :\n        break\n# codes outside\
  \ for loop\n\nwhile test expression:\n    # codes inside while loop\n    if condition:\n\
  \        break\n# codes outside while loop\n```\n\n现在我们已经接触了 `break` 和 `continue`\
  \ 指令，让我们回到 `for` 和 `while`，因为它们有另一个特性，指令：`Else`。它是一个 `If` 子句，但 `else` 在循环中也非常有用，这是因为我们在\
  \ `else` 中写的所有指令都将在循环结束时执行（如果我们我们没有先通过 `break` 结束循环）。if – else 的示例：\n\n```python\n\
  num = 8\nif num >= 5:\n    print(\"positive or zero\")\nelse:\n    print(\"negative\
  \ number\")\n# try with different numbers as well\n# With this program, you can\
  \ check if the number is positive, negative, or zero.\n```\n\n# 第 14 章总结\n\n- 数据清洗（Data\
  \ scrubbing）是数据处理的预分析过程。\n- 通过移除不兼容的变量来增强数据的兼容性，以满足目标答案。\n- 高效有效的数据科学要求变量的数据类型与模型算法的条件匹配。可以使用独热编码（One-hot\
  \ encoding）来建立这种匹配。\n- 机器学习并不一定要求将多维数据集简化为四个或更少的变量。\n- 在机器学习中，对数据进行变形和清洗是必要的。可以使用无监督算法来承担这一角色。\n\
  \n## 缩进\n\n缩进是 Python 最具特色的语法元素之一。\n- 它用于指示代码块。\n- 你必须对每个块使用相同数量的空格缩进。\n- 在 Python\
  \ 中，我们使用缩进来指示特定的代码字符串属于哪个块。\n- 块结束规则是通用的，因此我们不需要指定 `end`、`endif`、`fi`、括号、`wend`、`endwhile`、`next`、`loop`、`end\
  \ procedure` 或 `end function`。\n- 我们只需要遵守缩进。\n\n## IF 语句\n\n- 流程语句是允许程序根据情况做出决策并按特定顺序读取代码的功能。\n\
  - 我们可以使用一些流程工具来控制语句的执行。\n- `IF` 指令可能是所有编程语言中最常用的命令。\n- 我们可以使用 `IF` 来检查条件。\n- 只有当\
  \ `IF` 条件为真时，我们才运行语句块；否则，我们执行另一个语句。\n- 我们使用 `:` 来结束控制程序流程的测试。\n- 你可以根据需要插入任意的 `Elif`；在上面的示例中，最后一个\
  \ `Elif` 不是强制性的。\n\n## FOR 语句\n\n- `For` 指令允许我们定义迭代。\n- 为了决定我们需要多少次迭代以及在哪个元素上执行迭代，我们必须使用任何可以考虑的对象。\n\
  - 传统上用于精确地重复某段代码。\n- 列表、元组、字符串都是我们可以用 `For` 进行迭代的数据。\n- 我们使用 `range` 来执行简单的迭代若干次。\n\
  - 使用 `range` 命令，我们还可以选择迭代的开始和结束。\n- `For` 还允许我们同时在更多变量上执行循环。\n- 这是可能的因为字典中的 `items()`\
  \ 方法给出了由其自身的键和值组成的元组列表。\n\n## WHILE 语句\n\n- `While` 指令与 `For` 指令类似。\n- 唯一的区别是迭代不是基于固定的序列，而是只要给定条件为真就执行操作。\n\
  - 这里是 `While` 如何工作的示例。\n- 在上面的示例中，递增语句（`x += 1`）一直执行直到计数保持在 7 以下。\n- 如果条件保持为真，我们就有了“死循环”。\n\
  - 在这种情况下，你应该按下 `CTRL + C` 来关闭程序。\n\n## Break 和 Continue\n\n- `Break` 和 `Continue`\
  \ 用于停止当前迭代并跳到下一个迭代。\n- 你经常会在 `for` 循环和 `while` 循环中使用 `Break`。\n- `Else` 指令在 `for`\
  \ 和 `while` 循环中也非常有用，这是因为我们在 `else` 中写的所有指令都将在循环结束时执行（如果我们我们没有先通过 `break` 结束循环）。\n\
  \n\n\n\n\n# 第 15 章：自动学习的迷思\n\n根据佩德罗·多明戈斯（Pedro Domingos）的观点，机器学习的各种迷思可以总结如下：\n\n\
  ### 1. 机器学习只能发现相关性，不能发现因果关系。\n关于机器学习的主要迷思之一是它无法发现因果关系。机器学习最常见的类型之一是通过尝试不同的操作并观察结果——这正是因果发现的本质。人工智能发现因果关系预测的能力已应用于电子商务行业。例如，一个电子商务网站可以尝试许多不同的产品展示方式，并选择能够驱动最多购买行为的那种方式。你可能在不知情的情况下参与了成千上万次这类实验。即使在实验无关、计算机只能检查历史数据的某些情况下，因果关系也是可以被发现的。\n\
  \n### 2. 机器学习无法预测从未见过的事件。\n这通常被称为“黑天鹅迷思”。人们经常会误解为：如果某件事从未发生过，那么你预测的概率应该是零——否则还能是什么呢？相比之下，机器学习是极高精度预测稀有事件的艺术。如果\
  \ `A` 是 `B` 的原因之一，且 `B` 是 `C` 的原因之一，那么 `A` 就可以导致 `C`，即使我们从未见过它。垃圾邮件过滤器每天都能正确报告新创建的垃圾邮件。黑天鹅和\
  \ 2008 年的房地产危机是被广泛预料到的——而不仅仅是因为当时大多数银行使用的不完善的风险模型。\n\n### 3. 你拥有的数据越多，越可能做出有意义的预测。\n\
  据美国国家安全局（NSA）基于电话的分析越多，他们将一个无辜的人指定为潜在恐怖分子的概率就越大，因为他意外匹配了某个恐怖分子检测规则。利用同一实体的更多属性可能会增加幻觉风险，但机器学习专家非常擅长将其降至最低。另一方面，使用相同的一组属性提取更多实体会降低风险，因为通过这种方式学到的规则将更容易管理。某些学习算法可以找到涉及多个实体的模型，这使得它们更加健壮：一个拍摄纽约市政厅的人可能并不可疑，另一个人购买大量硝酸铵也可能并不可疑；但如果他们有联系，FBI\
  \ 也许应该查看一下，以确保那不是一个炸弹计划。\n\n### 4. 机器学习忽略了预存知识。\n机器学习领域的许多专家首先为他们所熟知的学习算法寻求“空白”方法。真正的知识是长期的推理和实验的结果，你无法通过在数据库上运行通用算法来模仿它。但并非所有的学习算法都从空白开始；某些算法利用数据来完善预存的知识体系，这些知识可能非常复杂，只要将其编码为计算机可以理解的形式即可。\n\
  \n### 5. 计算机学习的模型对人类来说是不可理解的。\n这无疑是一个令人担心的问题。如果一个学习算法是一个黑箱，我们如何能相信它的建议呢？某些类型的模型非常难以理解，例如负责机器学习某些最卓越成就的深度神经网络（如在\
  \ YouTube 视频中识别猫）。但其他模型是相当易于理解的，正如我们之前看到的皮肤癌诊断规则。所有这些迷思都是悲观的，因为它们假设机器学习的局限性比实际的要大。但也存在一些乐观的迷思：\n\
  \n### 6. 越简单的模型越精确。\n这种观点有时与奥卡姆剃刀有关，但剃刀说的是简单的解释是更优的，而不是为什么。它们之所以之所以优，是因为它们更容易理解、记忆和推理。有时，与数据兼容的最简单假设在预测上可能不如一个更复杂的假设精确。一些最强大的学习算法生成的模型似乎是“免费”设计的——有时甚至是完全完美调整数据后才添加的——但这正是它们优于那些较弱算法的原因。\n\
  \n### 7. 计算机发现的模型可以使用名值获得。\n如果一个学习算法指出了皮肤癌的诊断规则，且该规则非常精确（即所有与之对应的肉斑都是肿瘤），这并不意味着你应该相信它。数据的细微变化可能会导致算法推导出一条完全不同但同样准确的规则。只有尽管数据存在随机波动、且可靠生成的规则才能被解释为规则，而不仅仅是预测工具。\n\
  \n### 8. 机器学习有一天将产生超级智能。\n根据对人工智能进展的每日报道，人们很容易相信计算机很快就能像我们一样看、说、和推理，之后它们将迅速把我们抛在脑后。在自动学习（AL）的\
  \ 50 年里，我们已经取得了长远的进步，机器学习是近期成功的主要原因，但我们仍有很长的路要走。计算机可以胜任很多细的工作，但它们仍然没有常识，而且没有人如何教它们。因此，机器学习比我们想象的要强大，也比我们想象的要弱。我们能做什么取决于我们，只要我们是从准确的理解开始的。\n\
  \n# 第 15 章总结\n* 机器学习的新奇性和颠覆性导致了大量的自动学习迷思。\n* 机器学习迷思：\n    * 机器学习在分析中无法预测。\n    *\
  \ 机器学习只能建立相关性，不能建立因果交互。\n    * 机器学习并非基于预存的知识和偏见。\n    * 计算机学习的模型超出了人类的理解。\n    *\
  \ 机器有一天将产生超级智能。\n    * 模型越简单，精确度越高。\n\n\n\n\n\n# 结论\n\n下一步是充分利用你新获得的智慧，应对当今的尖端技术，这些技术催生了硅谷这一强大引擎。\n\
  \n机器能够在完全没有人类帮助的情况下独立运行的那一天，可能并没有你想象的那么遥。今天，`machine learning`和`artificial intelligence`已经诞生了复杂的机器，它们可以通过研究人类的行为和活动，以识别潜在的人类行为模式，并精确预测消费者感兴趣的产品和服务。\n\
  \n展望未来的企业正逐渐在其原定业务模式的掩护下转型科技公司。如今精明且老练的客户很容易被具有独特优势的现代公司所吸引，这些公司为消费者提供了独特、丰富且引入胜的体验。对于传统企业而言，如果不采用书中解释的一项或多种尖端技术，留住客户正变得越来越困难。\n\
  \n当你理解了这对你的业务意味着什么，以及你如何定位自己，不仅能留住现有客户，还能吸引更多最终转化为付费消费者的潜在客户时，你就已经准备好将业务推向新的高度。从一步一步开始，了解你业务的现状和挑战，然后在公司内部审慎地运用数据科学技术的力量，如`artificial\
  \ intelligence`、`machine learning`、`data mining`和`big data analytics`，以便在不损害人类智能的同时增强人类，并创造新的高薪且有回报的工作。\n\
