  dirname\")\n```\n下面的示例显示了如何删除 `/tmp/test` 目录。你需要指定目录的全路径，以防止搜索你的当前目录。\n\n### 用于文件和目录\n\
  在 Python 中，有一些关重要的资源提供了在 UNIX 和 Windows 操作系统上处理文件和目录的各种工具。这些是：\n- OS 对象方法：它们提供了处理文件和目录的方法。\n\
  - 文件对象方法：文件对象提供了操作文件的函数。\n\n\n\n\n\n# Python - 字典\n\nPython 字典是一种可变的键值配对特征。它是可变的，因为内容可以被更改。在每个配对中，它将一个键映射到一个值。Python\
  \ 字典中的键是不可变的，例如数字或字符串，且不能被更改。它们还必须是唯一的。Python 字典可以包含无序条目。在其他编程语言中，这被称为哈希表或关联数组。\n\
  \n## 创建字典\n\n在 Python 中创建字典有多种方法。一种方法是使用字面量代码化，将键值对包含在花括号中，配对之间用逗号分隔。\n\n```python\n\
  months = { \"Jan\": \"January\", \"Feb\": \"February\" }\n```\n第一个值 \"Jan\" 是键，后面跟着冒号，然后是值，在本例中值是\
  \ \"January\"。\n\nPython 字典也可以使用 `dict()` 字典函数创建。\n\n```python\nvals = dict (uno=1,\
  \ dos=2)\n```\n\n在 Python 中创建字典的另一种方法是先创建一个空字典，然后添加一个或多个实例。在这种情况下，添加了 3 个配对。\n\n\
  ```python\nclothing { }\nclothing[\"hat\"] = \"bonnet\"\nclothing[\"shoes\"] = \"\
  hush puppies\"\nclothing[\"jacket\"] = \"leather bomber\"\n```\n键首先分配在方括号内。值位于等号的右侧。\n\
  \n字典通过推导式组合，该推导式由两部分定义。第一部分（所示）被称为对象。第二部分被称为 `for i in range(4)` 循环。在上面的示例中现在创建了\
  \ 4 个配对。\n\n```python\ndic = { i: object() for i in range(4) }\n```\n\n## 字典操作\n\
  \n可以使用字典执行操作。可以使用特定的函数从一个或多个字典中添加或删除值。`pop` 函数将从字典删除配对。还可以使用 `fromkeys()` 函数从列表创建新字典。使用\
  \ `setfault()` 函数时，如果键可用，则创建一个值。可以使用 `update()` 函数合并字典。`clear()` 函数可以移除字典中的所有项。\n\
  \n# Python - 日期与时间\n\n当你在计划创建日期和时间戳时，需要记住有很多模块可以用于创建它们。当你正确使用这些模块时，你可以将时间戳放在任何你想的地方。此外，你将能够创建人们自己可以使用的时间日期戳。考虑在你编程工作中使用该模块的每种方法。\n\
  \n## 时钟\n你可以创建一个轻松贴合屏幕的时钟。这些时钟可以携带日期和时间，你可以在它们中填充日历，人们可以在未来多年中查看。此外，这些时钟可以设计成多种样式。其中某些在特定颜色下看起来更好，你可以更改颜色来创建一个为你的当前项目定制的特殊时钟。\n\
  \n## 戳\n你可以创建用于多个应用程序的时间和日期戳。它们可以用于标记文字处理文档，也可以用于标记信器服务中的消息。此外，当人们编辑文档时可以使用这些戳。\n\
  \n## 计时器\n当你想要创建一个计时器时，你将能够人们提供秒表和计时器。这些计时器可以从任意任何数字开始倒计时，或者你可以创建一个倒计时到百分分之一秒的秒表。人们使用这些计时器来工作，并可以使用秒表测量他们正在处理的过程。计时器和秒表对于计时体育赛事的人来说非常棒，也可以用于在电脑上工作的人。此外，这些人需要确保他们设置的时钟是为了运动或工作目的而运行。\n\
  \n## 时钟设置\n日期时间模块允许人们将时钟设置为按 12 小时或 24 小时计时。这些时间对许多人来说更容易阅读，并允许人们读取他们习惯阅读的时钟。这将有助于欧洲用户，也将帮助那些倾向于阅读现代美国军事时间的人。Python\
  \ 日期时间模块将帮助人们创建在他们工作的所有项目中都能良好运行的时钟和日历。这些模块可以为计算机上的每个项目提供日期和时间。\n\n| 章节总结 |\n| ---\
