  图 14-8 Volatility pstree。\n\n### psscan 命令\n\n该命令在恶意软件调查中特别有趣。`psscan` 可以找到之前终止（非活跃）进程以及被\
  \ rootkit 隐藏或取消链的进程。例如：\n\n```\n![Program code. 在代码中，变量名中的单词已合并。第 1 行。volatility,\
