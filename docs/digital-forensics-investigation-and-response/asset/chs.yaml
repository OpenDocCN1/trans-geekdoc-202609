  \n这可以在图 14-10 中看到。\n\n![图 14-10 Volatility svcscan。](img/9781284244496_CH14_FIGF10.jpg)\n\
  \n图 14-10 Volatility svcscan。\n\n要理解 `svcscan`，你需要以下术语：\n\n*   **Offset**（偏移量）：内存中的实际位置\n\
  *   **Order**（顺序）：DLL 加载到该进程的顺序\n*   **Start**（启动）：它如何启动\n*   **Process ID**（进程\
  \ ID）：标准 PID\n*   **Display Name and Service Name**（显示名称和服务名称）：服务的名称\n*   **Service\
  \ Type**（服务类型）：此服务的特定类型：\n    *   `SERVICE_WIN32_SHARE_PROCESS`：一种服务类型标志，表示与其他服务共享进程的\
  \ Win32 服务\n    *   `SERVICE_WIN32_OWN_PROCESS`：运行在独立进程中的 Win32 服务\n    *   `SERVICE_KERNEL_DRIVER`：Windows\
  \ NT 设备驱动程序\n    *   `SERVICE_FILE_SYSTEM_DRIVER`：Windows NT 文件系统驱动程序\n    *   `SERVICE_ADAPTER`：Windows\
  \ 接口\n    *   `SERVICE_INTERACTIVE_PROCESS`：可以与桌面交互的服务\n*   **Service State**（服务状态）：它是已启动还是已停止？\n\
  *   **Binary Path**（二进制路径）：可执行文件的路径\n\n还有其他 Volatility 命令。本章并未提供所有 Volatility 命令的全面覆盖。你可能想要尝试的几个是：\n\
