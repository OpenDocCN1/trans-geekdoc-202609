  \n根据提供的最终文本块重新格式化：\n\n随后你将 `dd` 命令的输出通过给 `netcat`，它会将位流通过网络发送到监听取证计算机上指定的网络地址和端口。参数\
  \ `-w 3` 表示 `netcat` 在发现没有更多数据时，应等待 3 秒后关闭连接。这假设嫌疑分区为 `hda1`，但它也可能是不同的分区。\n\n此过程可以使用大多数主要的取证工具完成，包括来自\
  \ Guidance Software 的 `EnCase`、来自 PassMark Software 的 `OSForensics` 以及来自 AccessData\
  \ 的 `Forensic Toolkit`。\n\n\n\n\n无论你使用什么种版本的 RAID（`RAID 1` 除外），你拥有的都是一个分布在多个磁盘上的阵列。对于\
  \ `RAID 1`，两块磁盘是彼此的镜像拷贝。\n\n有些人很难理解 `RAID 3`、`4`、`5` 和 `6`，特别是校验位是如何工作并存储数据的。这一切都基于基础的数学运算：异或（`XOR`）。\n\
  \n例如，假设三驱动器 `RAID 5` 阵列中的两个驱动器包含以下数据：\n\n* 驱动器 A：`01101111`\n* 驱动器 B：`11010100`\n\
  \n为了计算这两个驱动器的校验位数据，需要对它们的数据进行异或运算：\n\n* `01101111`\n* `XOR` `11010100`\n* `__________`\n\
  * `10111011`\n\n生成的校验位数据 `10111011` 随后存储在驱动器 C 上。\n\n现在，如果驱动器 A 或 B 任何一个损坏，数据就可以重新创建。假设驱动器\
  \ B 损坏。我们只需存储在驱动器 C 上的数据与留在驱动器 A 上的数据进行异或。\n\n* 驱动器 A：`01101111`\n* 驱动器 C：`10111011`\n\
  \n你就能得到 `11010100`，这原始驱动器 B 上的数据。这就是 RAID 中校验位的工作原理。\n\n获取 RAID 阵列面临一些在获取单个驱动器时不会遇到的挑战。有些人建议单独获取每块磁盘。这对于\
  \ `RAID 1` 是可以的，因为每块磁盘都是一个独立的实体。但对于 `RAID 0`、`3`、`4`、`5` 和 `6`，存在数据条带。数据分布在多个磁盘上。在这些情况下，不建议单独获取磁盘。相反，应对整个\
  \ RAID 阵列进行取证镜像——这需要将其复制到一个较大的目标驱动器。\n\n## 章节总结\n\n## 核心概念与术语\n\n# 第 4 章评估\n\n1.\
  \ 最常用的哈希算法是什么？\n    1. `MD5`\n    2. `Whirlpool`\n    3. `SHA1`\n    4. `CRC`\n\
  2. 哪种 Linux 命令可以创建哈希？\n    1. `SHA`\n    2. `MD5`\n    3. `MD5sum`\n    4. `Sha3sum`\n\
  3. 哪种 Linux 命令可以擦除目标驱动器？\n    1. `Del`\n    2. `Delete`\n    3. `nc`\n    4. `dd`\n\
  4. `RAID 4` 应该作为单个磁盘获取。\n    1. 正\n    2. 错\n5. 下列哪些驱动器在掉落时最不容易损坏？\n    1. `SCSI`\n\
  \    2. `SSD`\n    3. `IDE`\n    4. `SATA`\n6. 当车辆内有证据时，如果车辆已锁，停下来吃饭是可以接受的。\n  \
  \  1. 正\n    2. 错\n7. 下列哪项可能包含存储在内存中但未存储在硬盘上的数据？\n    1. `Swap file`（交换文件）\n   \
  \ 2. `Registry Hive`（注册表单元）\n    3. `Backup File`（备份文件）\n    4. `Log file`（日志文件）\n\
  \n## 章节实验\n\n## 第 5 章\n\n## 理解隐藏和混淆信息的技巧\n\n© phyZick/Shutterstock\n\n> **精通技术的犯罪分子**会试图在他们的计算机上隐藏证据。可以使用许多技术来隐藏或保护信息。这样一来，即使计算机被没收并搜索，调查人员也不太可能发现证据。本章介绍了隐藏和混淆信息的两种方法：隐形术和密码学。这些技术早于现代计算机。事实上，它们非常古老，其起源可以追溯到古希腊。隐形术源于希腊语\
  \ `steganos`，意为覆盖或保护。密码学源于希腊语 `kryptos`，意为隐藏。加密信息显然是被弄乱了，但本身并没有被隐藏。\n\n## 隐形术\n\n\
  `Steganography`（隐形术）是编写隐藏信息的艺术与科学。目标是隐藏信息，使得即使信息被拦截，也不会看出那里隐藏了信息。今天最常见的方法是在图片中隐藏信息。执行这种技术的最常用的方法之一是\
  \ `最低有效位 (LSB)` 方法（当使用最后一位或最低有效位来存储数据时）。明确的是，这不是执行隐形术的唯一技术方法，只是最常用的。`LSB` 方法取决于计算机以位和字节存储东西的事实。现在考虑一个\
  \ 8 位字节。例如，考虑 `11111111`。如果你将其转换为十进制数，它等于 255。现在如果你将第一个 1 改变为 0，你得到 `01111111`。这在十进制数中等于\
  \ 127，这是一个非常显著的变化。\n\n然而，如果——改变的不是第一个 0，而是改变最后一个 0 呢？这将给你 `11111110`，它在十进制数中等于 254。这是一个微不足道的改变。事实如此。\n\
  \n\n\n\n\n- 在古希腊，信使的头部可能会被剃光，在头上写上信息，然后让头发重新长出来。显然，这种方法需要一些时间才能发挥有效作用。\n- 德国学者约翰内斯·特里特米乌斯（1462–1516）写过一本关于密码学的书，并在书中描述了一种技术：通过将每个字母视为特定列中的一个单词来隐藏信息。\n\
  - 在第二次世界大战期间，法国抵抗军使用隐形水在信使的背部书写信息。\n\n## 声学隐写 (Steganophony)\n\n`声学隐写` 是指在音频文件中隐藏信息的术语。这可以通过\
  \ `LSB` 方法实现；然而，另一种可用于声学隐写的方法是回声法。该方法在音频文件的回声中添加额外的声音。正是这些额外的声音包含了信息。声学隐写可以用于静态文件（如\
  \ `MP3` 文件），也可以动态地用于 `VoIP` 和类似的多媒体技术，同样利用 `LSB` 方法并察觉不到地改变正在传输的声音。\n\n## 视频隐写 (Video\
  \ Steganography)\n\n信息也可以隐藏在视频文件中，这种做法被称为视频隐写。有多种实现方法，包括 `LSB` 方法。无论使用哪种方法，重要在于意识到视频文件明显大于其他文件类型。这为隐藏信息提供了大量的机会。\n\
  \n## 更高级的隐写术 (More Advanced Steganography)\n\n虽然简单使用最低有效位（特别是针对图像）是一种相当常见且被广泛使用的隐写术，但它并非唯一的选择。另一种选择是位平面复杂度分割隐写（`BPCS`）。\n\
  \n由于载体通常是存储 `24 位 bit` 颜色的图像，这一事实可以被用来增加载荷的存储区域。位平面上的复杂区域被载荷取代。任何离散数字文件的位平面都是对应于给定位位置的位集合。例如，在\
  \ `24-bit` 文件中有 `24` 个位平面。这可以应用于信号，也可以应用于文件。\n\n## 隐写分析 (Steganalysis)\n\n`隐写分析`\
  \ 是分析一个或多个文件以寻找隐藏内容的过程。这是一项艰巨的任务。在最好的情况下，它可以显示给定文件隐藏了额外信息的可能性。检测 `LSB` 隐写的一种常用方法是检查近色对。近色对由两个二进制值仅在\
  \ `LSB` 处有差异的颜色组成。如果在给定文件中频繁地看到这种情况，则可能表明存在隐写隐藏的信息。\n\n在我们深入研究检测隐写术的技术方法之前，有一些易于使用的隐写指标是非常重要的。第一个是检查给定图像或音频文件的元数据。有两项数据最受关注：创建日期和最后修改日期。创建日期不是文件原始被创建的时间，而是它在该特定设备上被创建的时间。如果你下载了一个\
  \ `mp4` 文件，那么你将其下载到计算机的日期/时间将是创建日期。最后修改日期指示其最后一次更改的时间。大多数人不会修改音乐文件；他们通常只是下载音乐，可能来自\
  \ `Google Play` 或 `Apple Music`。最后修改日期和创建日期相同，或者最后修改日期更早。如果最后修改日期更新，则表明该文件在下载后被修改过。如果此人拥有音乐编辑软件并为人熟悉混音，那么就可以解释日期的差异。但如果并非如此，则应该考虑存在隐写术。\n\
  \n许多隐写工具的隐写效果并不理想，实际上会增大目标文件的大小。这意味着看到大小不常的文件可能表明存在隐写术。如果一个嫌疑者有 100 张度假照片，所有照片的大小大约为\
  \ 2MB，但其中某一张是 4MB，那么分析那张照片可能是值得的。\n\n除了这些指标外，还有几种分析图像以检测隐藏信息的技术方法。原始快速对法（raw quick\
  \ pair method）就是其中。它基于 `24-bit` 图像中唯一颜色和近色对数量的统计。基本上，它通过快速分析来确定是否存在更多的近色对。\n\n另一种选择是使用卡方检验（`chi-square`）。卡方检验计算频率并建立表格。在分析音频时，可以使用\
  \ `LSB`。然后 `chi-square` 测量理论值与计算值的对比。本质上，它对这些值进行卡方检验。它测量载体文件中的噪声。许多现代隐写工具都会检查噪声的存在。取证工具包\
  \ (`FTK`) 和 `EnCase` 也会检查隐写术。\n\n有几种隐写术工具：\n\n- `McAfee`: `https://www.mcafee.com/enterprise/us/downloads/downloads/tools/steganography.html`\n\
  - `Steg Secret`: `http://stegsecret.sourceforge.net/`\n- `StegSpy`: `http://www.spy-hunter.com/stegydown.load`\n\
  \n注意，这些方法没有是完美的。很大程度上取决于载荷的大小相对于载体文件的大小。这决定了需要更改的比特的百分比。例如，如果你在一个 2MB 的图像文件中隐藏了一个\
  \ 10KB 的文本信息，将很难被检测。然而，如果你在一个 4MB 的图像中隐藏了一个 1MB 的图像，就会容易一些。\n\n### 隐藏秘密 (Invisible\
