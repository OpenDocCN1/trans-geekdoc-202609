  \n或者，你也可以使用以下任何方法：\n\n![程序代码。在代码中，变量名中的单词合并在一起。第 1 行：hash、tail、hyphen、f、正斜、v a r、正斜、log、正斜、l\
  \ p r、dot、log。第 2 行：hash、less、正斜、v a r、正斜、log、正斜、l p r、dot、log。第 3 行：hash、more、hyphen、f、正斜、v\
  \ a r、正斜、log、正斜、l p r、dot、log。](img/9781284244496_CH09_04_UNIMG3.png)\n\n如你所见，Linux\
  \ 中有很多方法查看日志。除了简单查看日志之外，你还可以搜索特定内容。例如，包含二进制数据的日志可能意味着日志中隐藏了恶意软件。你可以使用此命令进行此类搜索：\n\
