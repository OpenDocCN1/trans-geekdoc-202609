  \n### Linux 历史\n\n获取 Linux 概述的一个好方法是从 Linux 历史开始。关于 Linux，第一个也是最重要的点是，它实际上是 Unix\
  \ 的克隆。这意味着 Linux 的历史包含了 Unix。\n\n到 20 世纪 60 年代，计算正在普及，但还没有广泛使用的操作系统。贝尔实验室曾参与过一个名为\
  \ Multics（多路用信息服务）的项目。Multics 是麻省理工学院、贝尔实验室和通用电气合作的项目，旨在创建一个具有广泛适用性的操作系统。由于 Multics\
  \ 项目出现严重问题，贝尔实验室决定退出。贝尔实验室的一个由 Ken Thompson、Dennis Ritchie、Brian Kernighan、Douglas\
  \ McElroy 和 Joe Ossanna 组成的团队决定创建一个运行在多种类型上的操作系统。项目的成果是 1972 年发布的 Unix 操作系统。在 1972\
  \ 年，在 C 语言创建后，Unix 完全用 C 语言重写。在此之前，所有的操作系统都是用汇编编写的。\n\n\n\n\n\n1987 年，一位名为 Andrew\
  \ S. Tanenbaum 的大学教授创建了另一个 Unix 变体，称为 `Minix`。Minix 是一个相当稳定、实用且良好的 Unix 克隆系统。Minix\
  \ 完全由 Tanenbaum 用 `C` 语言编写。他创建它主要是作为学生的教学工具。他希望学生能够通过学习操作系统的源代码来学习操作系统。Minix 的源代码包含在他的著作*《操作系统：设计与实现》*中。将源代码包含在一部广泛使用的教科书中，意味着会有大量的计算机科学学生有机会接触到这些代码。\n\
  \n尽管 Minix 没有像其他某些 Unix 变体那样流行，但它是 Linux 创造者的灵感来源。Linux 操作系统的故事实际上就是 Linus Torvalds\
  \ 的故事。Linus 在读计算机科学博士学位期间开始研究 Linux。Linus 决定创建一个自己的 Unix 克隆系统。这个名字源于他的名字（`Linus`）与单词\
  \ `Unix` 的结合。Linus 对 `Unix` 和 `Minix` 都有深入的接触，这使得他创建一个良好的 Unix 克隆变得更加可行。\n\n###\
  \ Linux Shell\n\n现在你已经掌握了 Linux 的基本历史，下一步是查看被认为是 Linux 最重要的部分：shell。许多 Linux 管理员完全在\
  \ shell 中工作，从不使用图形用户界面 (GUI)。Linux 提供了许多不同的 shell。每个 shell 都是为不同的目的设计的。以下列表列出了最常见的\
  \ shell：\n\n*   Bourne shell (`sh`)——这是 Unix 的原始默认 shell。它于 1977 年首次发布。\n*   Bourne-again\
  \ shell (`Bash`)——这是 Linux 中最常用的 shell。它于 1989 年发布。\n*   C shell (`csh`)——这个 shell\
  \ 的名称源于它使用了非常类似于 `C` 的语法。熟悉 `C` 的 Linux 用户会喜欢这个 shell。它最早于 1978 年发布于 Unix。\n*  \
  \ Korn shell (`ksh`)——这是由 David Korn 在 20 世纪 80 年代开发的流行 shell。Korn shell 旨在兼容 Bourne\
  \ shell，但也结合了真正的编程语言能力。\n\n还有其他 shell，但这些是最常见的。在这些 shell 中，`Bash` 是使用最广泛的。大多数 Linux\
  \ 发行版都带有 `Bash`。\n\n为了执行一些基础的 Linux 取证工作，你并不需要成为 Linux 大师。然而，有一些你应该了解的重要 shell 命令，如表\
  \ 9-1 所示。请注意，所有命令都有可以更改其行为的标志（flags）。某些命令的常用标志也在表 9-1 中所示。\n\n#### 表 9-1 基础 Linux\
  \ shell 命令\n\n| LINUX 命令 | 解释与示例 |\n| :--- | :--- |\n| `ls` | `ls` 命令列出当前目录的内容。示例：`ls`\
  \ 常用标志 `ls -l` 显示文件或目录的大小、修改日期时间、文件或文件夹名称、所有者及其权限。 |\n| `cp` | `cp` 命令将一个文件复制到另一个地方。示例：`cp\
  \ filename directoryname` `cp -R` 用于复制目录。 |\n| `mkdir` | `mkdir` 命令创建一个新目录。示例：`mkdir\
  \ directoryname` `mkdir -p` 将创建父目录。 |\n| `cd` | `cd` 命令用于更改目录。示例：`cd ..` 回退一级。`cd\
  \ ~` 移动到主目录。 |\n| `rm` | `rm` 命令用于删除文件。示例：`rm filename` `rm -i` 在任何删除操作前进行提示。`rm\
  \ -r` 目录。 |\n| `rmdir` | `rmdir` 命令用于删除目录。示例：`rmdir directoryname` |\n| `mv` | `mv`\
  \ 命令用于移动文件。示例：`mv filename.txt folder` |\n| `diff` | `diff` 命令对两个文件进行文本比较。示例：`diff\
  \ file1 file2` |\n| `cmp` | `cmp` 命令对两个文件进行逐字节比较。示例：`cmp file1 file2` |\n| `>` |\
  \ 这是一个重定向命令。它不是将命令的输出显示在屏幕上，而是重定向到文件。示例：`ls > file1.txt` |\n| `ps` | `ps` 命令列出用户启动的所有运行进程。示例：`ps`\
  \ `ps -a` 列出所有用户，而不是当前用户。`ps -aux` 提供每个进程的详细信息，例如进程 ID、内存使用百分比等。 |\n| `pstree` |\
  \ `pstree` 命令以树状显示所有进程（无论是否由用户启动），清晰显示哪个进程产生了哪些其他进程。 |\n| `top` | `top` 命令列出所有运行进程，无论是否启动。它还显示进程的详细信息。示例：`top`\
  \ |\n| `fsck` | 这是一个文件系统检查。`fsck` 命令可以检查给定的分区状态良好。示例：`fsck /dev/hda1` |\n| `fdisk`\
  \ | `fdisk` 命令列出各种分区。示例：`fdisk -l` |\n| `mount` | `mount` 命令挂载分区，以便对其操作。示例：`mount\
  \ /dev/fd0 /mnt` |\n| `lsof` | 该命令列出打开的文件。这在取证中很有用，可以看到哪些文件是打开的，以及打开它们的进程。 |\n|\
  \ `lsattr` | 该命令列出 Linux 扩展文件系统的文件属性。 |\n| `env` | `env` 命令打印所有环境变量。 |\n\n### 图形用户界面\n\
  \n尽管 Linux 偏好者喜欢 shell，并且大量的取证工作可以在 shell 中完成，但 Linux 确实有 GUI。事实上，你有多种可以可以选择。使用最广泛的是\
  \ GNOME 和 KDE。\n\n#### GNU Network Object Model Environment (GNOME)\n\n\n\n\n\n\
  # GNOME 与桌面环境\n\nGNOME 的名称是 GNU Network Object Model Environment 的缩写。毫无疑问，GNOME\
  \ ([`www.gnome.org/`](http://www.gnome.org/)) 是 Linux 最流行的两个图形用户界面（GUI）之一。许多 Linux\
  \ 发行版都包含了 GNOME，或者提供了 GNOME 与其他桌面环境之间的选择。事实上，流行的 Ubuntu 发行版仅附带 GNOME。\n\nGNOME 构建在\
  \ `GTK+` 之上是一个用于创建 GUI 的跨平台工具包。你可以在图 9-1 中看到 GNOME 桌面。目前，GNOME 3 是最广泛使用的，尽管它是在 2011\
  \ 年发布的。GNOME 3 被用于 Fedora、Debian、SUSE、CentOS 以及其他 Linux 发行版。\n\n![图 9-1 GNOME。](img/9781284244496_CH09_FIGF01.jpg)\n\
  \n图 9-1 GNOME。\n\n## K 桌面环境 (KDE)\n\nKDE ([`www.kde.org/`](http://www.kde.org/))\
  \ 是另外两个最流行的 Linux GUI 之一。在历史上，它仅被称为 KDE 桌面。但现在有了 KDE Plasma 桌面。截至本文写作，Plasma 的当前版本是\
  \ KDE Plasma 5。5.19 版本于 2020 年 6 月发布，5.20 版本于 2020 年 10 月发布。KDE Plasma 使用 X Windows\
  \ 系统进行窗口函数处理。手机还有 Plasma Mobile。Plasma Mobile 用于 Nexus 5 及相关型号。\n\nKDE Plasma 5\
  \ 的一些功能包括：\n\n* `KRunner`：一个允许附加插件的搜索工具\n* `Dolphin`：一个文件管理器\n* `Spectacle`：一个截图工具\n\
  \n大多数 Linux 发行版都带有 KDE 或 GNOME，或者两者兼有。例如，Kubuntu 发行版本质上是带有 KDE 的 Ubuntu。KDE 由 Matthias\
  \ Ettrich 于 1996 年创立。在 KDE 创建时，Ettrich 像 Linus Torvalds 一样是一名计算机科学学生。KDE 这个名字是为了对\
  \ Unix 系统上提供的通用桌面环境（CDE）进行文字游戏设计。\n\nKDE 构建在 `Qt` 框架之上。`Qt` 是用 `C++` 编写的多平台 GUI\
  \ 框架。在图 9-2 中了 KDE Plasma。\n\n![图 9-2 KDE Plasma。](img/9781284244496_CH09_FIGF02.jpg)\n\
  \n图 9-2 KDE Plasma。\n\n## 其他桌面环境\n\n尽管 KDE 和 GNOME 是 Linux 最广为人知和使用的 GUI，但无疑还有其他的。这里列出了简要描述了几个较常使用的：\n\
  \n* **通用桌面环境 (CDE)**：`CDE` ([`www.opengroup.org/cde/`](http://www.opengroup.org/cde/))\
  \ 最初于 1994 年为 Unix 系统开发。它曾一度是 Sun Solaris 系统的默认桌面。CDE 基于惠尔-惠普的视觉用户环境（VUE）。它最初是专有的，但在\
  \ 2012 年根据 GNU 较小通用公共许可证发布。\n* **Enlightenment**：该桌面首次于 1997 年发布，专门为图形开发者设计。你可以在\
  \ [`www.enlightenment.org/`](http://www.enlightenment.org/) 了解更多信息。\n* **Cinnamon**：该桌面基于\
  \ GNOME。这种桌面在 Linux Mint 中常见。Cinnamon 以易于学习著称。\n* **LXDE (轻量级 X11 桌面环境)**：正如名称所示，这是一个轻量级（即低资源占用）桌面。LXDE\
  \ 是 LXLE Linux、Artix 和 Knoppix 的默认桌面环境。\n\n## Linux 启动过程\n\n理解 Linux 启动过程是重要的，因为某些恶意攻击可能会影响启动过程。\n\
  \nLinux 经常用于嵌入式系统，甚至是智能手机。在这种情况下，系统首次通电时第一步是加载引导环境。引导环境是一个特殊的程序，例如 `U-Boot` 或 `RedBoot`，存储在闪存的特殊区域。在\
  \ PC 上，Linux 启动于 `BIOS`（基本输入输出系统）地址 `0xFFFF0`。注意，现代系统使用统一固件接口 (`UEFI`)，它相比 BIOS\
  \ 有巨大的改进，但实现了相同的目标。\n\n与 Windows 类似，磁盘上的第一个扇区被称为引导区。它包含启动过程中使用的可执行代码。引导区的最后两个字节的进制值为\
  \ `0xaa55`。同样，在 Windows 中，在 `BIOS` 加载且通电自检（POST）完成后，`BIOS/UEFI` 定位主引导记录 (`MBR`)\
  \ 并将控制权交给它。`MBR` 位于可启动磁盘的第一扇区（`/dev/hda` 或 `/dev/sda`）。从 `BIOS/UEFI` 将控制权交给 `MBR`\
  \ 标志着启动过程第一阶段的结束。\n\n随后 `MBR` 加载引导加载程序，例如 LILO (Linux Loader) 或 `GRUB`（通用统一引导加载程序）。\n\
  \n`GRUB` 是更现代且广泛使用的。`GRUB` 兼容 `BIOS` 或 `UEFI`。\n\n\n\n\n\n| 5 || `/etc/rc.d/rc5.d`\
  \ | 带有 GUI 的多用户模式 |\n| 6 || `/etc/rc.d/rc6.d` | 重启 |\n\n根据运行级别（run level），`init`\
  \ 进程将执行相应的启动脚本。这些脚本位于 `/etc/rc.d` 目录的子目录中。用于运行级别 `0` 到 `6` 的脚本分别位于 `/etc/rc.d/rc0.d`\
  \ 到 `/etc/rc.d/rc6.d` 子目录中。默认启动运行级别在 `/etc/inittab` 文件中通过 `initdefault` 变量设置。此时，启动过程结束，Linux\
  \ 已经启动并运行！\n\n## 逻辑卷管理 (Logical Volume Management)\n\n逻辑卷管理器（`LVM`）是一个为 Linux 内核（Kernel）提供卷管理的抽象层。该技术有许多用途，但在单个系统（如单个桌面或服务器）上，它的主要作用是允许调整分区大小，并能够通过对逻辑卷创建快照来完成备份。\n\
  \n使用 `LVM`，物理驱动器或卷的第一个兆字节（称为 `PV`）包含一个名为 `LVM` 头的结构。驱动器的 `PV` 包含该驱动器/卷的布局。数字证据科学工作组（`SWDGE`）对\
  \ `LVM` 的描述如下：\n\n> 某些 Linux 安装使用 `LVM`，这是一种用于 Linux 内核的逻辑卷管理器，用于管理磁盘驱动器和类似的质存储设备，在传统分区和块设备之上提供了一个抽象层。通过虚拟化分区并允许它们在独立的物理磁盘或物理分区之间进行拆分、合并或阵列，从而为块设备上的存储提供了更灵活的配置。为了正确解析磁盘上的结构，取证工具必须感知\
  \ `LVM`。获取 `LVM` 卷时，必须考虑存储的逻辑配置。¹\n\n## Linux 发行版\n\nLinux 是开源的。这意味着源代码对任何想要修改、重新打包和分发它的人都是的。因此，有许多不同的发行版。它们都是\
  \ Linux，并且都具有相同的 Linux Shell，但每个都有一些不同之处。例如，某些默认使用 `KDE`，而另一些使用 `GNOME`。某些附带了许多额外的开源工具，而另一些的工具没那么多，或者具有不同的工具。一些常见的发行版包括以下：\n\
  \n* `Ubuntu`——非常受初学者欢迎\n* `Red Hat Enterprise Linux` (`RHEL`)——通常用于大型级服务器\n* `OpenSuse`——一种流行的通用型\
  \ Linux 发行版\n* `Debian`——另一个流行的通用型 Linux 发行版\n* `Mint`——在 2020 年非常流行\n* `Fedora`——本质上是红帽的客户端版本，非常流行\n\
  * `CentOS`——这个发行版已经存在相当长了，经常位列 [www.distrowatch.com](http://www.distrowatch.com)\
  \ 的前 30 名。\n\n`Kali Linux` 是取证分析师最感兴趣的。`Kali` 充满了用于黑客、安全和取证的工具。至少基础熟悉 `Kali` 是一个非常好的主意。在\
  \ [`www.kali.org/category/tutorials/`](https://www.kali.org/category/tutorials/)\
  \ 上有一些关于 `Kali` 的优秀教程。\n\n`Kali Linux` 是取证分析师最感兴趣的。`Kali` 充满了用于黑客、安全和取证的工具。至少基础熟悉\
  \ `Kali` 是一个非常好的主意。在 [`www.kali.org/category/tutorials/`](https://www.kali.org/category/tutorials/)\
  \ 上有一些关于 `Kali` 的优秀教程。\n\n## Linux 文件系统\n\n`Ext4` 是 Linux 中常用的文件系统。它是一个日志文件系统，意味着它会记录对文件系统所做的更改。`Ext2`、`Ext3`\
  \ 和 `Ext4` 都是扩展（Extended）文件系统家族的版本。`Ext2` 是一个旧的文件系统，不支持日志，通常用于 USB 驱动器等闪媒体。`Ext3`\
  \ 在基于 `Ext2` 的文件系统中增加了日志功能。`Ext4` 是当前版本，支持更大的文件和卷。\n\n`XFS` 是 Linux 中另一种流行的文件系统。它是一种高性能的\
  \ 64 位日志文件系统，专为大文件和大卷设计。`Btrfs` 是一种较新的文件系统，提供了如写时复制、快照和 RAID 等功能。它仍然不如 `Ext4` 或\
  \ `XFS` 成熟。\n\n`ZFS` 是一种最初为 Solaris 开发但现在适用于 Linux 的文件系统。它提供了数据完整性检查、卷管理和高性能等功能。它通常用于对数据可靠性至关重要的服务器上。\n\
  \n`FAT32` 和 `NTFS` 是 Windows 使用的文件系统，但 Linux 也支持它们。`FAT32` 的最大文件限制为 4GB，而 `NTFS`\
  \ 是现代 Windows 文件系统，并支持更大的文件。\n\n\n\n\n此日志记录了应用程序的崩溃情况。有时，这些记录可能会揭示攻击系统的企图或恶意软件的存在。当然，它也可能仅仅揭示了应用程序存在\
  \ Bug。这就是计算机取证面临的真正挑战：确定哪些内容是实际犯罪的证据。\n\n## 其他日志\n\nLinux 计算机上运行的任何其他存储日志的应用程序对你的取证检查都可能有用。例如，如果你正在使用如\
  \ `Snort` 这样的入侵检测系统（IDS），它会记录所有可流量的日志。这对于你的调查非常有帮助。\n\n## 查看日志\n\n在 Linux 中，你可以使用多种\
  \ shell 命令来查看日志。你也可以简单地在你偏好的 GUI 界面中使用你喜欢的文本编辑器。使用 Linux `dmesg` 命令是从 shell 查看日志的首选方法。它的工作原理如下：\n\
