  \n\n在一次完整的端到端互联网通信中，最常见的情况是用户信息（如电子邮件文本）将按照电子邮件协议格式进行格式化。然后将使用 `URL` 来查找接收者的实际 `IP`\
  \ 地址。消息将根据 `TCP` 协议格式化，并带有相应的正确 `TCP` 端口号发送到 `IP` 地址。包含所有这些内容的 `IP` 数据包将被放入一个根据以太网协议规则构建的特殊封包中，它将进入实际线路，或跨越无线或光纤连接，通过云端传输到达目的地。在目的地处，该过程将反向执行，电子邮件（至少是其部分内容）将到达目的地。\n\
  \n### 基础网络实用工具\n\n你可以从命令提示符（Windows）或 shell（UNIX/Linux）中执行一些基础网络实用工具。本文讨论的内容是从 Windows\
  \ 命令提示符的角度执行并讨论这些命令的；但必须强调的是，这些工具在所有操作系统中都是可用的。本节涵盖了 `ipconfig`、`ping` 和 `tracert`\
  \ 工具。\n\n#### 使用 ipconfig\n\n你需要做的第一件事是获取关于你自己系统的信息。为了完成这项信息收集任务，你需要进入命令提示符。在 Windows\
  \ 10 中，你通过进入屏幕左下角的搜索框并输入 `cmd` 来实现。对于其他版本的 Windows，过程是相同的，只是第一个选项被称为“程序”而不是“所有程序”。现在你可以输入\
  \ `ipconfig`。你可以在 UNIX 或 Linux 的 shell 中输入 `ifconfig` 来输入相同的命令。在输入 `ipconfig`——Linux\
  \ 中输入 `ifconfig`——之后，你应该能看到类似于图 1-2 中所示的内容。\n\n![FIGURE 1-2 ipconfig.](img/9781284244496_CH01_FIGF02.jpg)\n\
  \n图 1-2 ipconfig。\n\n此命令提供了有关你与网络或互联网连接的一些信息。最重要的是，你找到了自己的 `IP` 地址。该命令还包含你的默认网关的\
  \ `IP` 地址，它是你与外部世界的连接。运行 `ipconfig` 命令是确定系统网络配置的第一步。\n\n你可以看到此选项为你提供了更多信息。例如，`ipconfig/all`\
  \ 提供了你的计算机名称、计算机何时获取 `IP` 地址以及更多信息。\n\n#### 使用 ping\n\n另一个常用的命令是 `ping`，它用于向机器发送测试数据包（或回显包），以确定该机器是否可访问以及数据包到达机器需要多长时间。这个实用的诊断工具可以用于基础黑客技术。命令如图图\
  \ 1-3 所示。\n\n![FIGURE 1-3 ping.](img/9781284244496_CH01_FIGF03.jpg)\n\n图 1-3 ping。\n\
  \n你可以在图 1-3 中看到向目的地发送并返回了一个 32 字节的回显包。`TTL` 项目意味着存活时间。该时间单位是数据包在放弃之前到达目的地之前应该经过的中间步骤（或跳数）数量。记住，互联网是互连网络的庞大集合。你的数据包可能不会直接到达目的地。它必须经过几跳才能到达。与\
  \ `ipconfig` 一样，你可以输入 `ping -?` 来查找你可以完善 `ping` 的各种方法。\n\n#### 使用 tracert\n\n本节检查的最后一个命令是\
  \ `tracert` 命令。虽然 `tracert` 对某些实时网络故障很有用，但 `tracert` 报告的信息对于取证检查来说并不可用也不可靠。相同的命令可以在\
  \ Linux 或 UNIX 中执行，但在那里被称为“traceroute”而不是“tracert”。你可以在图 1-4 中看到此命令。\n\n![FIGURE\
  \ 1-4 tracert.](img/9781284244496_CH01_FIGF04.jpg)\n\n图 1-4 tracert。\n\n本节只是对你学习取证所应该具备的硬件、软件和网络知识进行了简要概述。如果你发现自己在一个或多个领域存在缺失，请在继续之前对这些领域进行复习。\n\
  \n#### 隐藏信息与反取证\n\n获取数字证据的另外两个挑战是隐藏信息和反取证。\n\n#### 隐藏信息\n\n信息可以通过多种方式隐藏。隐藏信息可能通过加密混乱、使用隐形软件隐藏、压缩或以专有格式存储。有时，网络犯罪分子隐藏信息以威慑取证检查。更多情况下，公司使用某些操纵和存储技术来保护业务敏感信息。无论数据隐藏的原因是什么，收集和分析它们都是困难的。\n\
  \n通过加密、隐形术、压缩或专有格式隐藏的数据有时可以通过严密的侦查工作和正确的工具进行转换。取证专家通常必须进行大量工作来解密加密信息。在许多情况下，除非数据所有者提供加密密钥和算法，否则调查人员无法解密信息。当数字证据被加密并在活动系统上运行时，调查人员可能必须通过现场提取过程收集证据。\n\
  \n#### 反取证\n\n每项调查都是独特的。调查并不一定是友好的活动。取证专家可能需要在信息所有者配合或不配合的情况下进行调查。而信息所有者可能也可能是调查的目标。在信息所有者不配合的情况下，调查是非常困难的。\n\
  \n攻击者可能使用技术刻意隐藏他们的身份。例如，犯罪者可能通过使用图书馆、网吧咖啡或其他公共自助终端的网络连接来隐藏身份。或者他们可能使用加密或匿名服务来保护自己。犯罪者为了隐藏其位置、行为或身份而采取的行为被称为反取证。\n\
  \n随着对数字取证能力的认知，网络犯罪分子越来越擅长掩盖踪迹。以下是反取证技术的示例：\n\n- **数据破坏**：处理数据的方法多种多样。它们可以简单地擦除程序使用的内存缓冲区，也可以复杂地用\
  \ 1 和 0 的模式反复覆盖数据簇。数字证据很容易被破坏。例如，启动计算机会更新时间戳。连接硬盘或 USB 闪存会修改时间戳。关闭电源会破坏易失性内存。嫌疑人可能会删除文件和文件夹并对硬盘碎片以尝试覆盖证据。\n\
  - **数据隐藏**：嫌疑人经常将数据存储在调查人员可能发现的地方。例如，他们可能将数据隐藏在保留扇区或定义的公共分区内的逻辑分区中。或者他们可能简单地更改文件名和扩展名。\n\
  - **数据转换**：嫌疑人可能以掩盖其含义的方式处理信息。例如，他们可能使用加密根据算法打乱消息。或者他们可能使用隐形术将消息隐藏在较大的消息中。\n- **文件系统篡改**：嫌疑人经常损坏组织数据的结构和文件，例如\
  \ Windows NT 文件系统（NTFS）卷。\n\n### Daubert 标准\n\n一个对取证关键且在取证书中经常被忽略的法律原则是 Daubert\
  \ 标准。康奈尔大学法学院对 Daubert 标准 的定义如下：\n\n\n\n\n\n审判法官进行初步评估时使用的标准，用于判断专家的科学证言是否基于在科学上有效的推理或方法论，并能够恰当应用于争议事实。根据这一标准，在确定方法论是否有效时可以考虑的因素有：(1)\
  \ 相关的理论或技术是否可以并已经经过测试；(2) 它是否经过了同行评审和发表；(3) 其已知的或潜在的错误率；(4) 是否存在并维护控制其运行的标准；以及 (5)\
  \ 它是否在相关科学领域内获得了广泛接受。\n\n用通俗易懂的话来说，这意味着审判中提交的任何科学证据都必须经过相关科学社区的审查和测试。对于计算机取证调查员来说，这意味着你在调查中使用的任何工具、技术或流程都应该是计算机取证领域内广泛接受的。你不能简单地编造新的测试方法或程序。\n\
  \n这自然地引出了一个问题：新技术是如何被广泛接受的？假设你开发了一个可以从 `Windows Registry` 中提取取证信息的新工具。第一步可能是向几位取证学教授提供该工具的副本，让他们对其进行实验。你也可以发表一篇描述该工具的文章。在经过取证社区的测试且关于它的文章被阅读（并可能被反驳）之后，你的工具就可以在真实的取证调查中使用了。\n\
  \n记住 `Daubert` 标准是非常重要的，因为它会影响你的取证方法。它还提醒我们一个更基础的概念：你收集的证据只有在法庭上可以被采纳时才有意义。因此，你必须注意你使用的技术和工具，并维护监管链。\n\
  \n如果你未能使用广泛接受的技术、未能充分记录你的方法论，或者仅使用了你你不具备资质使用的工具和技术，对方律师可能会发起所谓的“**Daubert 挑战**（Daubert\
  \ challenge）”。这是一项由于你的证言未能达到 `Daubert` 标准而排除全部或部分证言的申请。`Daubert` 挑战在民事案件中相当常见，但在刑事法庭中并不常见。近年来，法律界出现了一种增加刑事法庭中\
  \ `Daubert` 挑战的趋势。其背后的逻辑是，一些人认为“垃圾科学”正在进入刑事诉讼，而逻辑清晰的 `Daubert` 挑战可以减少这种情况。\n\n##\
  \ 影响数字取证的美国法律\n\n许多法律影响着数字取证调查。例如，某些司法管辖区通过了法律，要求调查员必须是执法人员或持证的私家侦探才能提取证据。当然，这并不阻止取证调查员与他人提取的信息合作，或者在信息所有者给予许可的情况下提取证据。了解你工作所在司法管辖区的法律要求至关重要。\n\
  \n### 1974 年联邦隐私法\n\n《1974 年隐私法》（`Privacy Act of 1974`）建立了一套信息处理实践准则，规范了美国联邦机构在记录系统中维护的关于个人信息的收集、维护、使用和传播。记录系统是指受某机构控制的一组记录，通过个人姓名或分配给该个人的某些标识符从中检索信息。\n\
  \n### 1980 年隐私保护法\n\n1980 年的《隐私保护法》（`Privacy Protection Act`，简称 `PPA`）保护记者免于要求向执法部门交出任何工作成果和文件材料（包括来源），只要在这些材料发布之前。\n\
  \n### 1994 年通信执法法\n\n1994 年的《通信执法法》（`Communications Assistance Act of 1994`）扩展了对电子通信的关注。\n\
  \n### 存储通信的非法访问\n\n《存储通信的非法访问：U.S.C. § 2701》\n\n`Daubert` 标准将影响你的取证方法。它还提醒我们一个更基础的概念：你收集的证据只有在法庭上可以被采纳时才有意义。因此，你必须注意你使用的技术和工具，并维护监管链。\n\
  \n\n\n\n\n1999 年《无线通信与公共安全法》允许收集和使用“空隙”通信，即非语言和非文本通信，例如 GPS 信息。\n\n### 美国《爱国者法案》（USA\
  \ PATRIOT Act）\n《爱国者法案》是目前收集各种互联网和通信信息内容及元数据的主要法律。该法案中包含了保护美国公民身份和隐私的规定。\n\n###\
  \ 2002 年《萨班斯-奥克斯利法案》（Sarbanes-Oxley Act）\n2002 年《萨班斯-奥克斯利法案》包含了许多关于上市公司管理和运营相关的电子记录保存和销毁的规定。\n\
  \n### 18 USC 1030 计算机欺诈及计算机相关活动\n这是黑客案件中使用范围广泛的法律之一。它涵盖了涉及非法访问任何计算机的范围犯罪。\n\n###\
  \ 18 USC 1020 与访问设备相关的欺诈及相关活动\n这与 `1030` 条密切相关，但涵盖了访问设备（如路由器）。\n\n### 《数字千年版权法案》（DMCA）\n\
  这项备受争议的法律于 1998 年颁布。它规定发布规避版权保护的方法或技术属于犯罪。它之所以具有争议，因为它曾被用于针对发表论文的合法研究人员。\n\n###\
  \ 18 USC § 1028A 身份盗窃与加重身份盗窃\n如名所示，该法律针对任何与身份盗窃相关的犯罪。它经常应用于信用卡被盗案件中。\n\n### 18 USC\
  \ § 2251 儿童性剥削\n该法律涵盖了系列儿童剥削犯罪，并常见于儿童色情案件中。与这项宽泛法律相关的还有其他几条法律，例如：\n\n*   `18 U.S.C.\
  \ § 2260`:为进口到美国而制作的未成年人显性描写\n*   `18 U.S.C. § 2252`:与涉及未成年人性剥削材料的某些活动（儿童色情内容的持有、分发和接收）\n\
  *   `18 U.S.C. § 2252A`:与构成或包含儿童色情材料的某些活动\n\n### 搜查令（Warrants）\n根据最高法院的观点，“当个人对该财产的占有利益产生某些实质性干扰时，即发生了财产扣收”（`United\
  \ States v. Jacobsen`, `466 U.S. 109, 113 [1984]`）。法院在 `Berger v. New York` 案（`388\
  \ U.S. 41, 59–60 [1967]`）中，也将对无形通信的拦截定性为一种扣收。这意味着执法部门不需要实际获取财产即可被视为扣收；仅仅干扰个人对其自身财产的访问就成了扣收。`Berger\
  \ v. New York` 将此范围扩大到了通信。如果执法部门的行为没有违反个人的“合理的隐私预期”，那么从形式上说它就不构成对宪法第四修正案的“搜查”，也不需要搜查令。在许多案件中，合理的隐私预期这一问题一直是争议点。举一个非常清楚的例子，如果你在电子日记中保存了一条信息，你显然对隐私有合理的预期；然而，如果你将此类信息发布在公共公告板上，你就不能抱有任何隐私预期。在不那么明确的情况下，一条一般规则是：法院认为，如果在同种情况下禁止打开一个封闭容器并检查其内容，那么也禁止执法人员访问和查看存储在计算机中的信息。\n\
  \n当证据处于显目易见之处时，不需要搜查令。例如，如果一名侦探正在与某人讨论该社区内发生的一系列盗窃案，并能清楚地看到那人电脑屏幕上的儿童色情内容，则不需要搜查令。不需要搜查令的另一个例外是同意。如果授权提供同意的人（例如手机或计算机的所有者）向执法部门提供了搜查同意，那么就不需要搜查令。\n\
  \n在计算机犯罪案件中，经常出现两个同意方面的问题。首先，搜查何时超过了同意的范围？例如，当一个人同意搜查某地（如其公寓）时，这种同意是否授权了检索该地计算机中存储的信息？其次，谁是同意搜查的恰当主体？室友、朋友和父母可以合法地授予同意搜查他人的计算机文件吗？这些都是搜查计算机时必须考虑的关键问题。通常，法院认为只有财产的实际所有者可以授予同意，或者对所有者拥有法律监护权的人可以。例如，未成年儿童的父母可以授予搜查其居住场所和计算机的同意。然而，分摊租金的室友只能授予搜查双方共同居住场所和共同拥有计算机的同意。室友不能授予同意搜查他人的私产。\n\
  \n在其他情况下，调查人员不需要搜查令。其中一种情况是过境。任何通过任何国家海关的人其行李都可能被搜查。这包括对笔记本电脑、手机和其他设备进行完全的法医检查。另一个不需要搜查令的情况是证据面临被毁的紧迫危险。在\
  \ `United States v. David` 案中，法院认为“当证据毁毁在眉睫时，如果有理由相信被扣收的物品构成犯罪活动的证据，那么无搜查令地扣收该证据是合理的。”\n\
  \n不超出搜查令的范围也很重要。在 `United States v. Schlingloff`, `2012 U.S. Dist. LEXIS 157272\
  \ (C.D.Ill. Oct. 24, 2012)` 案中，Shadid 法官认为，使用取证工具包 `FTK` 的已知文件过滤器 `KFF` 来警报儿童色情内容，超出了寻找身份盗窃的搜查令范围。\n\
  \n### 联邦指南\n如果你正在建立法医实验室，或者你是一个法医领域的新手，从联邦指南是一个很好的起点。有两个机构特别重要：联邦调查局（FBI）和秘密局（Secret\
  \ Service）。\n\n#### FBI\n当事件发生时，`FBI` 建议第一响应人员通过制作备份副本来保存当时计算机的状态，包括任何日志、任何受损或更改的文件，以及任何被入侵者修改、查看或遗留的文件。最后一部分至关重要。此外，`FBI`\
  \ 建议，如果事件正在进行，应启动拥有的任何审计或记录软件。收集尽可能关于事件的数据。\n\n`FBI` 计算机法医指南强调了保护证据的重要性。他们进一步强调计算机证据以多种形式存在。以下是一些常见形式：\n\
  \n*   硬盘\n*   系统日志\n*   便携式存储设备，如 USB 盘和外硬盘\n*   路由器日志\n*   电子邮件\n*   聊天室日志\n* \
  \  手机\n*   手机 SIM 卡\n*   安全设备日志（如防火墙和入侵检测系统）\n\n\n\n你所保护的内容取决于网络犯罪的性质。例如，在涉及儿童掠夺者、在线跟踪者或网络诈骗的案件中，电子邮件可能非常重要，但路由器日志可能无关。`FBI`\
  \ 还强调，你应该对硬盘的副本进行工作，而不是原始硬盘。\n\n`FBI` 有一个网络犯罪网页，这对于学习更多网络犯罪趋势和计算机取证来说是一个非常有用的资源。\n\
  \n### 秘密勤局 (The Secret Service)\n\n美国秘密勤局（`U.S. Secret Service`）是打击网络犯罪的首要联邦机构。它有一个专门从事计算机取证的网站，其中包含了取证课程。这些课程通常面向执法执法人员。\n\
  \n秘密勤局还发布了一份针对计算机犯罪第一响应人员的指南。该机构列出了开始调查的“黄金法则”。具体规定如下：\n\n*   警员安全：封锁现场并确保其安全。*own*\
  \   如果你有理由相信计算机参与了你正在调查的犯罪，请立即采取措施保护证据。\n*   确定你是否有法律依据来没收计算机，例如目目可见原则、搜查令或同意。\n\
  *   不要访问任何计算机文件。如果计算机是关闭的，请让它保持关闭状态。\n*   如果计算机是开启的，不要开始搜索计算机。相反，请正常关闭计算机并准备将其作为证据进行运输。\n\
  *   如果你有理由相信计算机正在破坏证据，请通过拔掉计算机背部的电源线立即关闭计算机。\n*   如果可用相机且计算机已开启，请对计算机屏幕拍照。如果计算机是关闭的，请对计算机、计算机位置以及任何连接的电子介质拍照。\n\
  *   确定是否适用特殊的法律或隐私考量，例如针对医生、律师、神职人员、精神医生、报纸或出版者的规定。\n\n这些都是维护监管链以及从一开始开始就确保调查完整性的重要第一步。\n\
  \n### 区域计算机取证实验室计划 (The Regional Computer Forensics Laboratory Program)\n\n区域计算机取证实验室（`RCFL`）计划是一个由取证实验室和培训中心组成的国家网络。`FBI`\
  \ 为该计划提供启动和运营资金、培训、人员和设备。州、地方和其他联邦执法机构指派人员负责 `RCFL` 设施。\n\n16 个 `RCFLs` 中的每一处都负责检查数字证据，以支持刑事和国家安全调查。`RCFL`\
  \ 计划为所有级别的执法部门提供数字取证专业知识。它涉及各种调查，包括恐怖主义、儿童色情、诈骗和谋杀。\n\n`RCFL` 计划开展数字取证培训。例如，2008\
  \ 年，该计划培训了近 5000 名执法人员掌握系统取证工具和技术。更多信息请参阅 `[`www.rcfl.gov`](http://www.rcfl.gov)`\n\
  \n## 章节总结\n\n## 核心概念与术语\n\n# 第 1 章评估\n\n1.  在计算机取证调查中，这描述了证据从你发现它到案件结案或上庭所走的路径。\n\
  \    1.  证据规则\n    2.  概率法\n    3.  监管链 (Chain of custody)\n    4.  分离政策\n2.  当在你到达时计算机是开启的，秘密勤局建议你做什么？\n\
  \    1.  立即开始调查。\n    2.  根据秘密勤局的推荐程序关闭计算机。\n    3.  开启电源并运输计算机。\n    4.  立即拔掉机器插头。\n\
  3.  为什么你应该对想要没收作为证据的计算机记录所有电缆连接？\n    1.  为了知道哪些外部连接\n    2.  以防连接了其他设备\n    3.\
  \  为了知道哪些外围设备\n    4.  为了知道存在哪些硬件\n4.  道伯特标准 (Daubert standard) 的本质是什么？\n    1.\
  \  只有专家才能在审中作证\n    2.  专家必须确认某种工具或技术是有效的\n    3.  只有被科学界接受的工具或技术在审判中才是可采的\n   \
  \ 4.  监管链必须保留\n5.  在记录数字证据时，首要目标是什么？\n    1.  对所有硬盘制作位流镜像 (bitstream images)。\n\
  \    2.  保护证据的完整性。\n    3.  防止证据离开现场。\n    4.  防止计算机被关闭。\n6.  对于调查人员来说，关于记录以下哪些很重要？\n\
  \    1.  记录方法\n    2.  日志保留\n    3.  存储日志的位置\n    4.  以上所有\n7.  你的室友可以同意搜索你的计算机。\n\
  \    1.  正确\n    2.  错误\n8.  如果证据在警察局，则不需要锁定。\n    1.  正确\n    2.  错误\n\n## 参考文献\n\
  \n1 如果有理由相信计算机参与了你正在调查的犯罪，请立即采取措施保护证据。2 根据秘密勤局的推荐程序关闭计算机。专家必须确认某种工具或技术是有效的。3 只有被科学界接受的工具或技术在审判中才是可采的。4\
  \ 监管链必须保留。\n\n5] 记录数字证据时，首要目标是什么？保护证据的完整性。\n\n6] 对于调查人员来说，关于记录以下哪些很重要？以上所有。\n\n\
  7] 你的室友可以同意搜索你的计算机。错误。\n\n8] 如果证据在警察局，则不需要锁定。错误。\n\n\n\n了解计算机在犯罪中是如何被使用的信息，也有助于在系统内搜索证据。如果计算机被用于破解网络密码文件，调查人员应该寻找密码破解软件和密码文件。如果计算机是犯罪的目标（例如入侵），调查人员应该检查审计日志并寻找不熟悉的程序。了解计算机在犯罪中如何被使用，有助于缩小证据收集的范围。如今的硬盘和其他大容量存储设备通常非常大，达到几个太字节（TB）。因此，如果手动搜索，检查和分析计算机及其关联介质所包含的每份数据将耗费无法想象的时间。即使是自动化搜索，更全面的搜索也可能需要令人沮丧的长时间。通常，执法人员需要快速获取信息。对嫌疑计算机上要寻找的内容有一个大致了解，可以加快证据收集过程。\n\
  \n计算机可能涉及多种类型的犯罪，包括白领犯罪、谋杀和恐怖主义等暴力犯罪、反间谍、经济间谍、伪造、儿童色情和毒品交易等。\n\n互联网使得目标变得更容易获取，犯罪分子面临的风险也远低于传统犯罪。在家里或其他远程地的舒适环境中，网络犯罪分子就可以黑入银行并将数百万美元转入虚假账户。从本质上说，犯罪分子可以抢劫银行，而不必担心在逃跑时受到身体伤害。\n\
  \n网络犯罪还涉及通过某种方式利用对传统犯罪进行修改。它可以是简单的非法在线销售处方药，也可以是复杂的网络跟踪。恋童癖者利用互联网交换儿童色情，并伪装成孩子诱骗受害者进行现实生活中的绑架。无论活动是在线还是线下，监管欺诈的法律都具有同等的强制效力。\n\
  \n在计算机取证领域，犯罪的性质对取证过程可能产生重大影响。某些犯罪比其他犯罪更容易产生特定类型的取证证据。例如，身份盗窃可能通过网络钓鱼邮件留下电子邮件证据，但黑入系统并盗取数据可能不会留下任何电子邮件证据。另一方面，黑入系统可能会在防火墙和入侵检测系统日志中留下证据，而网络钓鱼邮件可能不会。\n\
  \n为了选择合适的取证测试，调查人员必须了解计算机犯罪的类型以及犯罪如何影响取证过程。\n\n大多数计算机安全书籍根据攻击的性质对计算机攻击进行分类。例如，此类书籍研究拒绝服务攻击（DoS）、恶意软件、黑入网页等。然而，就我们而言，本章根据所实施的犯罪类型对计算机攻击进行分类，无论其执行方式。当你继续阅读本章时，你会发现这样对于取证检查更有意义。本章研究了以下类别：\n\
  \n* 身份盗窃\n* 为获取数据而黑入系统\n* 网络跟踪/骚扰\n* 互联网欺诈\n* 非访问类计算机犯罪\n* 网络恐怖主义\n\n这些是相当广泛的类别，涵盖了许多活动。但这些类别对于调查犯罪行为非常有效。值得注意的是，数字设备在非计算机犯罪中也可能具有价值。当然，检查毒品贩子的手机可能会获得有关其同事、旅行习惯和其他信息，尽管所涉及的犯罪实际上不是计算机犯罪。\n\
  \n# 身份盗窃\n\n`Identity theft`（身份盗窃）是一个日益增长的问题。它是对他人身份的任何使用。这看起来似乎是一个非常广泛的定义，但它是准确的。通常，犯罪分子实施身份盗窃是为了进行某些财务欺诈。例如，犯罪分子可能利用受害者的信息获取信用卡信息。如果他们使用该卡进行购物，受害者就要承担账单。\n\
  \n美国司法部将身份盗窃和身份欺诈定义为：\n\n> ……术语，指代所有类型的犯罪，其中某人以涉及欺诈或欺骗的方式，错误获取并使用他人的个人数据，通常是为了经济利益。\n\
  \n错误获取他人个人数据的简单行为本身就是犯罪，无论是否偷取了金钱。注意，司法部的定义说明通常是为了经济利益。然而，犯罪分子也可能出于其他原因盗取某人的身份。因此，即使是非财务性的身份盗窃仍然是犯罪。例如，这里有一个真实的案例。为了保密，某些细节已作更改，但故事的核心内容都是真实的。\n\
  \n这起犯罪发生在一个使用社会安全号码作为驾驶执照号码州。现在不再有哪个州这样做了，这有其理由。在这个案例中，某个人在车辆管理局（DMV）的当地办公室工作。当有人来换领执照时，他或她会交旧执照。本案中的犯罪分子拿了一些他认为长像自己的旧执照。然后，他在这些执照上放了自己的照片，并在被交警拦截开具罚单时使用了其中一张。这导致罚单发给了执照的实际所有者，并附带了一张执照过期的罚单。然而，最终调查将罚单与他的汽车和车牌号联系了起来。\n\
  \n这个故事说明了犯罪分子完成身份盗窃的一种方式——通过获取带有他人信息的官方文件。它还显示了身份盗窃的另一种原因，一种不涉及银行账户或信用的原因。这无疑不是身份盗窃最常见的例子，但它是一个可能的例子。犯罪分子还使用以下常用方法来实施身份盗窃：\n\
  \n* 网络钓鱼\n* 间谍软件\n* 丢弃的信息\n\n接下来的章节将简要检查这些每一项。\n\n### 网络钓鱼\n\n网络钓鱼（Phishing）试图欺骗受害者交出个人信息。它通常通过向受害者发送电子邮件，并声称来自受害者信任的组织，例如其银行或信用卡公司。在最简单的形式之一中，犯罪分子向大量人员发送电子邮件。邮件声称来自某银行——为了本示例，请考虑一家名为“信赖银行”（Trustworthy\
  \ Bank）的虚拟银行。电子邮件声称接收者的账户存在问题，并说明接收者需要点击邮件中的链接来解决问题。然而，该链接实际上将接收者引导到一个看起来与真实网站一样的假网站。当受害者输入其用户名和密码时，这个假系统会显示类似“登录暂时不可用”或“错误，请稍后再试”这样的信息。犯罪分子所做的是诱骗受害者将其银行账户的用户名和密码交给犯罪分子。\n\
  \n显然，在任何群发邮件的情况下，许多接收者并不是被伪造金融机构的客户。这些接收者可能只会删除电子邮件。即使是那些是该伪造金融机构客户的人，也有许多人也不会上当。他们也会删除电子邮件。但在情况下，这对犯罪分子来说是一场数字博弈。如果他或她发送了足够的邮件，就一定有人上当。因此，诀窍在于发送尽可能多的邮件，并知道只有一小部分人会有反应。\n\
  \n\n\n\n钓鱼通常是一个接触尽可能多人的过程，希望有足够多的人回应。总来说，落入诈骗邮件陷阱的人与对其他合法、未经请求的大量邮件（即垃圾邮件）做出回应的人大致相仿。根据联邦调查局（`FBI`）的数据，一封良好的伪造邮件的回复率为\
  \ 1–3%。一个身份窃者——如果他或她使用了目标组织的格式、正确拼写了每一个单词，并使用了看起来合法的标志和艺术设计——每发送一百万封邮件，就可以获得 10,000\
  \ 到 30,000 次点击回复。\n\n在美国，每年 4 月 15 日联邦税缴纳截止后不久，通过钓鱼诈骗进行的税务相关欺诈就会开始。这些钓鱼邮件声称来自美国国税局（`IRS`），并声称个人的在线报税申报了错误。随后，接收者被引导点击一个链接来修复问题。如果受害者点击了链接，实际发生的是犯罪者获取了所有的个人信息，从而使身份窃变得非常容易。\n\
  \n近年来，针对性更强的攻击日益增加。第一种针对性攻击被称为鱼叉式钓鱼（spear phishing）。在鱼叉式钓鱼中，犯罪分子针对一个特定的群体。例如，犯罪分子可能想要获取特定银行的网络信息，因此他或她会针对该银行的\
  \ IT 员工发送邮件。这些邮件更加具体，因此在接收者看来更有可能是合法的。\n\n与鱼叉式钓鱼类似的是鲸叉式攻击（whaling）。这是针对特定高价值目标的钓鱼。例如，攻击者可能针对某银行的\
  \ `CIO`。首先，攻击者对该 `CIO` 进行网络搜索，尽可能多地关于他或她的信息。`LinkedIn`、`Facebook` 和其他社交媒体在这方面非常有帮助。然后，攻击者会发送一封针对该特定个人的邮件。这使得邮件看起来更真实，受害者做出回应的可能性更大。\n\
  \n一种方案是研究目标（在本例中为 `CIO`）并发现他或她的爱好。例如，如果该 `CIO` 是一个热心的钓鱼爱好者，攻击者可能会向他或她发送一封邮件，提供填写问卷即可免费订阅钓鱼杂志。问卷是通用的，但要求目标选择一个密码。这很重要，因为大多数人会重复使用密码。无论\
  \ `CIO` 选择什么密码，他或她很可能在其他地方也使用了相同的密码。即使它没有作为网络登录密码，它可能是 `Hotmail`、`Gmail`、`LinkedIn`\
  \ 或 `Facebook` 账户的密码。这为攻击者进入该人的电子生活提供了入口。从那里开始，攻击者获取受害者的网络凭据只是时间问题。在钓鱼中获得的信息也可以用于社会工程或其他高度针对性的攻击，例如高级持续性威胁（APT）攻击，这类攻击是持续进行的攻击，会反复且一致地尝试进行钓鱼。通常会针对一个特定的、高价值目标发送几封相关的钓鱼邮件。\n\
  \n### 间谍软件 (Spyware)\n\n间谍软件是任何可以监控你在计算机上活动的软件。它可能涉及截屏或记录击键。它甚至可以像 cookie 一样简单——一个小型文本文件，仅记录你访问网站的一些简短事实。正常的网络流量是“无状态的”，意味着在没有帮助的情况下，信息不会在页面之间传递。这是通过\
  \ cookie 实现的。例如，当你访问 `Amazon.com` 时，网站会记住你上次搜索的内容。这是通过 cookie 实现的。现在，和大多数信誉良好的网站一样，`Amazon`\
  \ 不将你的个人数据写入 cookie 中。相反，有一个标识符，`Amazon` 可以利用它来将其存储在其后端服务器上的你的数据进行匹配。有些人可能反对将网站\
  \ cookie 标记为间谍软件，应该指出 cookie 有许多合法的用途。然而，这取决于网站的程序人员来决定网站 cookie 中存储哪些信息以及如何使用这些信息。这意味着，至少从技术上来说，cookie\
  \ 可以被视为间谍软件。\n\n有人声称 80% 连接到互联网的计算机都安装了间谍软件。这个数字是否真的那么高很难确定。但事实是，间谍软件非常普遍。原因之一（可能会让你感到惊讶）是如果使用得当，此类软件本身是完全合法的。有两种情况允许一个人合法监控他人计算机的使用。一种是父母监控未成年子女。如果孩子未满\
  \ 18 岁，父母监控孩子的计算机活动是完全合法的。事实上，一些专家甚至认为，不监控网络上的年幼儿童是一种疏忽行为。计算机监控的另一个法律应用是在工作场所。许多法院案例维护了雇主监控在公司所有设备上的计算机和互联网使用的的权利。\n\
  \n由于存在“监视”他人计算机使用的合法应用，许多间谍软件可以容易且廉价地获得。这里列出了几个：\n\n*   `Teen Safe`——该产品可以在 `http://www.teensafe.net`\
  \ 找到。\n*   `Web Watcher`——该产品可以在 `https://www.webwatcher.com` 找到。\n*   `ICU`——该产品可以在\
  \ `http://www.softedia.com/get/Security/Security-Related/ICU-Child-Monitoring-Software.shtml`\
  \ 找到。\n*   `WorkTime`——该产品可以在 `http://www.nestersoft.com/worktime/employee-monitoring.shtml`\
  \ 找到。\n\n\n\n\n\n如果正在调查的犯罪是身份盗用，那么调查人员首先应该寻找的是受害者机器上的间谍软件。虽然获取身份显然有其他方法，但这最容易检查。受害者机器的某处完全可能存在某种间谍软件。如果存在间谍软件，调查人员必须开始寻找间谍软件将其数据发送到哪里。是的，间谍软件会收集用户计算机和互联网活动的数据，但这些数据最终必须传输给犯罪分子。这可能只是简单的带有附件的定期电子邮件，也可能是发送到犯罪分子可以访问的服务器的数据流。由于防火墙对入站通信的阻止比阻止出站消息更严格，因此将数据发送给犯罪分子很容易。无论具体的通信机制是什么，绝对有某种方式将信息从受害者计算机传送到攻击者——这将留下一些取证痕迹。\n\
  \n# 黑客（Hacking）\n\n黑客是一个通用术语，对不同的人有不同的含义。在黑客社区中，它的意思是对系统进行实验，学习其规则或流程，以便更好地理解系统或修复漏洞。在大多数其他语境下，它意味着绕过系统的安全性。本节使用后者的定义。远程入侵系统是完全可能的。攻击者可以使用许多技术来实现这一点。接下来的章节将讨论其中一些技术。\n\
  \n### 结构化查询语言注入\n\n结构化查询语言（SQL）注入可能是最常见的 Web 攻击。它基于将 SQL 命令插入到文本框中，例如登录屏幕上的用户名和密码文本字段。如果登录字段只接受文本且不不对\
  \ SQL 命令进行防护，那么这种网络攻击就是可能的。根据最新的《Verizon Terremark 数据泄露调查报告》，SQL 注入曾一度是最常见的网络攻击类型之一，但得益于更好的网站编码实践，它在近年来已有所下降。尽管如此，仍有这么多网站极易受到攻击，这令人惊叹。\n\
  \n要理解 SQL 注入是如何工作的，你必须首先了解数据输入框应如何防止意外文本的基础知识。登录屏幕要求用户输入用户名和密码，然后对这些内容进行验证。大多数情况下，通过检查存有用户表的数据库来验证它们，查看密码是否与用户匹配。所有现代数据库都“说”SQL，因此，如果创建登录界面和验证过程的程序员不小心，网页就可能受到\
  \ SQL 注入。以下是该攻击的工作原理。SQL 看起来非常像英语。例如，为了检查用户名和密码，你可能想查询数据库，查看用户表中是否存在与输入的用户名和密码匹配的条目。如果有，则匹配成功。网站编程代码中的\
  \ SQL 语句必须使用引号将 SQL 代码与编程代码隔离开。一个典型的 SQL 语句可能如下：\n\n```\n![程序代码。在代码中，变量名中的单词被合并了。第\
  \ 1 行。SELECT, 星号, FROM t b l Users WHERE USER NAME, 等, 左单引号, 左双引号, 加, t x t Username,\
  \ 点, Text。第 2 行。加, 左单引号, AND PASSWORD, 等, 左单引号, 左双引号, 加, t x t Password, 点, Text,\
  \ 加, 右双引号, 右双引号, ...](img/97844464496_CC01.jpg)\n```\n\n如果你输入用户名 `username'this`\
  \ 和密码 `'letmein`，这段代码会产生 SQL：\n\n```\n![程序代码。在代码中，变量名中的单词被合并了。第 1 行。SELECT, 星号,\
  \ FROM t b l Users WHERE USER NAME, 等， 左单引号, 左双引号, 加, t x t Username, 点, Text。第\
  \ 2 行。加, 左单引号, AND PASSWORD, 等, 左单引号, 左双引号, 加, t x t Password, 点, Text, 加, 右双引号,\
  \ 右双引号, .](img/97844464496_CC02.jpg)\n```\n\n即使对于非程序员来说，这也很容易理解。此外，它是有效的。如果数据库中存在匹配项，说明用户名和密码匹配的。如果数据库没有返回任何记录，则意味着没有匹配。现在，如果程序员正确地编写了应用程序——使其不允许任何字符逸出变成普通文本——这种方法就失效了。但在太多的情况下，它是有效的。这时，入侵者已经登录了你的应用程序，并可以执行授权用户能做的任何事情。\n\
  \n刚才描述的示例是 SQL 注入的最简单版本。还有更高级的 SQL 注入技术。事实上，SQL 注入仅限于你个人对 SQL 的知识。显然，SQL 注入攻击可以非常复杂，涉及复杂的\
  \ SQL 语句数组，也可以像刚才讨论的示例一样简单。\n\n甚至有些工具可以使执行这种攻击的过程（或者测试你的网站是否容易受到此类攻击）变得更加简单。这里列出了几个：\n\
  \n*   Database Security 在 [`www.databasesecurity.com/sqlinjection-tools.htm`](http://www.databasesecurity.com/sqlinjection-tools.htm)\
  \ 中的几种工具\n*   [`sqlmap.org/`](http://sqlmap.org/) 中的 Sqlmap\n*   [`sqlninja.sourceforge.net/`](http://sqlninja.sourceforge.net/)\
  \ 中的 SQL Ninja\n\n#### 这种犯罪是如何影响取证的？\n\n无论 SQL 注入攻击有多复杂（或缺乏复杂性），此类攻击都会留下特定的取证证据。你应该首先查看的地方是防火墙日志。应该会有关于连接来自何处的迹象。其次，搜索你的数据库日志；某些关系型数据库引擎会记录事务、发生的时间以及内容。这在你的调查中可能是无价之宝。\n\
  \n\n\n\n\n跨站脚本攻击（Cross-site scripting）是另一种非常常见的攻击。在这种攻击中，合法网站允许恶意脚本运行并交付内容，其看起来就像来自该合法网站。攻击者只需要在目标网站上寻找某个地方，让恶意脚本留在那里等待终端用户落入陷阱。一个例子是发布其他用户会看到的文本。产品评论就是此类操作的绝佳场所。\n\
  \n但攻击者并不发布评论或其他文本，而是发布 `JavaScript`。如果网站在显示用户输入之前没有对其进行过滤，那么当其他用户导航到这条评论时，网站将转而执行该脚本。攻击者的唯一限制仅限于其对\
  \ `JavaScript` 的了解。一种流行的做法是将用户重定向到钓鱼网站。钓鱼涉及通过欺骗终端用户（通常通过电子邮件）使其交出账户信息。这种利用技术手段将人们重定向到非常相似但虚假的钓鱼网站的做法被称为“钓网攻击”（pharming）。\n\
  \n为了更好地理解这种攻击，让我们走过一个场景。在开始之前，我想向你们指出，据我所知，没有一家主要的电子商务或拍卖网站会受到这种攻击的威胁。在这个场景中，攻击者建立了一个看起来与目标网站非常相似的网站。他给该网站起了一个与目标网站相似的名字，仅差一个字母。这使得终端用户可能注意到这种细微差别。然后，攻击者在目标网站中注入跨站脚本，该脚本会将用户重定向到钓鱼网站。一旦进入钓鱼网站，恶意网站只需显示一条通知称：“您的会话已过期，请重新登录。”当用户登录时，恶意网站捕获登录信息，然后将用户送回真实网站。现在，攻击者就拥有了该用户的登录信息。对于终端用户来说，他们似乎一直处于同一个网站上。\n\
  \n#### 这种犯罪如何影响取证？\n\n调查跨站脚本攻击可能是一项复杂的犯罪工作。要寻找的第一项是网站中的任何脚本。无疑，网站有很多为了益目的而故意存在的脚本，但这是搜索任何恶意脚本的第一处。在大型网站中，这种搜索可能是一项非常乏味的任务，攻击者可能已经删除了恶意脚本。更有效的方法搜索\
  \ Web 服务器日志中的任何重定向消息（这些是 `300` 范围内的 HTTP 消息），然后判断这些重定向中是否可以通过合法的网页代码来解释。\n\n####\
  \ Ophcrack\n\n物理访问 Windows 机器最基础的工具之一可能是 `Ophcrack`。`Ophcrack` 可以从 http://ophcrack.sourceforge.net/\
  \ 下载。这是一个用于破解 Windows 系统本地密码的工具。它通常非常有效。事实上，如果攻击者能够带着一张 `Ophcrack` 压缩盘（CD）或 `USB`\
  \ 闪盘在你网络中的 Windows 机器上停留 10 分钟或更短，那么攻击者很有可能获得本地密码。对于符合以下标准的企业网络来说，这是一个重大问题：\n\n\
  *   如果物理安全松散，外部人员可以进入建筑，通常是伪装成清洁人员、维护人员或临时员工。\n*   通常可以在建筑内找到空闲办公位。\n*   网络的重点在于域账户。\n\
  \nOphcrack 是如何工作的？\n\n从哈希值中提取密码最基础的方法是彩虹表（rainbow table）。为了理解彩虹表，考虑一个提取 Windows\
  \ 密码的场景。Windows 使用 `NTLMv2` 哈希算法来存储密码。想象你制作了一个表格，第一列是所有常见的 8 位密码，第二列是它们的 `NTLMv2`\
  \ 哈希值。然后你对所有 9 位密码重复此操作，然后是对 10 位密码重复。你可以根据意愿一直进行下去，直到你的计算资源支持为止。这些表增长得非常快，因此大多数长度不超过\
  \ 8–10 位，这对于大多数密码都是足够的。然后，如果你能从目标机器上提取出一个哈希值，你就在表中搜索匹配项。如果你在第二列中找到匹配项，那么第一列中的任何内容都应该是该人的密码。图\
  \ 2-3 显示了包含好坏坏密码的彩虹表示例。\n\n问题是最初如何获取 SAM 文件。当 Windows 启动时，甚至在你看到登录界面之前的很早时候，系统就会锁定\
  \ SAM 文件——阻止你对其进行复制或编辑。好了，这正是 `Ophcrack` 发挥用场的地方。它启动到 Linux Live CD，然后扫描其彩虹表寻找匹配项。它在一个易于使用的图形用户界面中显示它找到的所有密码。\n\
  \n一旦攻击者拥有了有效的登录账户，特别是管理员账户，他或她就可以登录到该计算机，即使是从远程位置登录。这并不能让攻击者加入域，但他或她现在已经在你的网络中建立了立脚点。\n\
  \n\n\n\n对于这类犯罪，日志中可能有很多也可能没有。如果目标系统是 Windows Server 2003、2008 或 2012 机器，那么机器的重启将记录在日志中。如果你看到重启后紧接着是用类似\
  \ `Administrator` 的账户进行成功登录，这表明可能使用了诸如 `Ophcrack` 的工具。另一个需要检查的问题是物理安全。如果怀疑有物理侵入，那么传统的取证方法（如检查监控摄像头甚至指纹）就变得至关重要。当然，当分配该账户的实际用户不在场时，账户却处于登录状态，这也是发生了某种违规的迹象。\n\
  \n### 欺骗技术支持\n\n以下是一个简单的技巧，也是使用 `Ophcrack` 破解本地账户的后续步骤。在攻击者获得本地账户访问权限后，他或她会非常想要获取域管理员权限。`net\
  \ user` 命令可以帮助实现。首先，攻击者编写了以下两行脚本：\n\n![程序代码。在代码中，变量名中的单词已合并。第 1 行：net user，正斜杠，domain，正斜杠，add\
  \ 本地账户名密码。第 2 行：net group，正斜杠，domain，左双引号，Domain Admins，右双引号，正斜杠，add 本地账户。](img/9781284244496_CH02_CC04.jpg)\n\
  \n攻击者将该脚本保存到“所有用户”启动文件夹中。下一步是让一个域管理员登录这台机器。如果这种情况发生，脚本就会在后台运行（不可见），你的本地账户现在就变成了域管理员。但你如何让域管理员登录呢？事实恰是，在许多组织中，技术支持人员就在域管理员组中。因此，攻击者只需要做一些让机器无法完全正常运行的操作。当技术支持人员登录修复该问题时，脚本就会运行。\n\
  \n### 这种犯罪如何影响取证？\n\n如果你怀疑有物理破入，在系统中搜索任何未识别的脚本（特别是在任何启动文件夹中）是一个良好的第一步。当然，被破解账户的使用也会提供线索。如果网络管理员账户显示在网络管理员不在场时被使用过，这表明该账户已被破解。而且与\
  \ `Ophcrack` 一样，物理安全也是这种犯罪中的一个问题；因此，调查场所的物理侵入是非常重要的。\n\n### 通用黑客技术\n\n关于黑客技巧已经有很多专著著作，也有整个认证课程专注于此类技能。这里的目的是向你介绍一些攻击者可能使用的技术。介绍攻击者使用的所有常见黑客技术超出了本文的范围。然而，本节说明了一个重要的点：计算机犯罪调查人员应该对黑客技术有丰富的实践知识。如果你理解攻击者使用的技术，你的取证调查将得到极大改进。\n\
  \n## 网络跟踪与骚扰\n\n网络跟踪、网络欺凌和在线骚扰在媒体中受到越来越多的关注。随着社会日益联网，在线行为变得越来越重要。随着许多人使用社交媒体与他人互动，使用约会网站寻找特别的人，以及使用在线讨论板聊天，在线上的不当行为变得更加明显。有些人会说，坏行为在网络上变得越来越普遍。比起真人，人们觉得对屏幕上一个无脸的名字发泄情绪感到更从容。但无礼行为从何时开始越过跟踪或骚扰的界限呢？互联网上并不是每一个无礼的词都构成犯罪。\n\
  \n`网络跟踪`或骚扰是指使用电子通信手段骚扰或威胁他人。美国司法部是这样说的：\n\n> 尽管网络跟踪没有通用的定义，但本报告中使用的该术语是指使用互联网、电子邮件或其他电子通信设备跟踪他人。跟踪通常涉及个人反复从事的骚扰或威胁行为，例如跟踪某人、出现在某人的家中或办公场所、拨打骚扰电话、留下书面信息或物品，或破坏他人的财产。大多数跟踪法律要求犯罪者对受害者做出可信的暴力威胁；另一些法律包括对受害者直系属的威胁；还有一些法律仅要求被指控的跟踪者的行为轨迹构成暗示性威胁。虽然某些涉及烦人或威胁性行为的行为可能未达到此标准。\n\
  \n现在，即使在读完这段描述后，你可能仍然不知道坏规行为与犯罪行为之间的界限在哪里。这里有法律执法人员需要记住的三项标准。这三项对于建立一起网络跟踪案件并非必不可少，但三项都必须考虑：\n\
  \n-   **是否可能？** 如果一个人做出威胁，该威胁是可靠的？为了说明这个问题，请考虑两个极端情况。在第一种方案中，你正在玩游戏，另一个住在不同国家的玩家告诉他由于对你生气，他要揍打你的鼻子。鉴于你可能没有使用真实姓名，而且此人在几千英里之外，这并不明确。在另一个极端，考虑一种情况：你收到一封威胁要杀你的邮件，但邮件中附带了一张你离开家大门的近期照片。这显然是令人震惊的。\n\
  -   **频率如何？** 注意美国司法部使用了`repeatedly`（反复地）一词。人们会生气并说出事后后悔的话。一次说出无礼甚至暴力的的话并不一定是跟踪。理智的人会冷静下来并对自己说过的刻薄话感到遗憾，然后他们不再重复。但反复的行为是一种模式，而不是失误。\n\
  -   **严重程度如何？** 再次，理智的人会发火说出他们并不想要的话。许多人在某些时候都说过“我杀了……”——但他们并不会付诸行动。理智的人会在愤怒时做出模糊的陈述，事后感到遗憾和尴尬。具体的威胁更令人不安。某人说“我就可以杀了他”，可能会引起关注。某人详细描述他将如何杀死那个人，表明他对此进行过思考，这应该被认真对待。\n\
  \n再次，构成网络跟踪或骚扰并不需要具备所有这些元素。然而，这三项都必须被考虑。显然，有些人确实会向警察报假警。另一些人对无害的评论反应过度。另一方面，网络跟踪会导致现实世界的暴力犯罪。\n\
  \n以下九个案例应该让你对网络跟踪有一个良好的概述。研究这些案例中的的事实可能帮助你了解法律上如何构成网络跟踪。其中一些案件非常新，另一些则较老，被包含是因为它们是有历史意义的案件。\n\
  \n1. 2019 年，北卡罗来纳州州员 Cody Henson 就涉及其前妻的网络跟踪指控认罪。该案件涉及杀死其前妻及其全家的威胁。这一案例说明网络跟踪可能涉及社会任何阶层的人。\n\
  \n\n\n\n## 2. 2010 年，70 岁的约瑟夫·梅迪科（Joseph Medico）在教堂遇到了一位 16 岁的女孩。该女孩在教堂担任志愿者，帮助为无归者收容所准备捐赠。梅迪科先生一直跟着女孩走到车旁，试图说服她陪他一起吃晚餐，然后回他的家里。当女孩拒绝了他的追求后，他开始每天给她打好几次电话并发短信。当女孩意识到他不会停止手时，她报警了警察。梅迪科先生被捕并被指控骚扰。此案说明了一个不稳定的人有多容易痴迷受害者。它也展示了处理此类情况的正确方法。这绝对是一个向警察报案的案件。成年人对未成年人进行这种示好是一个极其严峻的问题。\n\
  \n## 3. 在加利州网络骚扰法下的第一起成功起诉中，洛杉矶县检察官办公室的检察官起诉了一名 50 岁的前安保人员，他利用网络诱骗一名拒绝其追求的女性遭受强奸。被告在各种网络聊天室和在线公告板上冒充其\
  \ 28 岁的受害者，对其进行恐吓；他在那里发布了受害者的电话号码和地址，以及关于她幻想被强奸的信息。在至少六次中（有时是在深夜），有男人敲该女性的门，说他们想强奸她。这名前安保人员于\
  \ 1999 年 4 月认领了一项骚扰罪和三项诱骗性性侵罪。\n\n## 4. 马萨诸塞州的一处地方检察官起诉一男子，该男子通过使用匿名邮件转发器（remailers）对一名同事进行了系统性的骚扰，并最终以威胁向受害者的新丈夫透露其过去的性活动为挟，试图从受害者那里索要性好处。（邮件转发器是一种匿名服务器，它会重新发送电子邮件，使其无法追溯到原始发送者。）\n\
  \n## 5. 2020 年，塞缪尔·特拉劳尼·休斯斯（Samuel Trelawney Hughes）被联邦大陪审团起诉，指控他利用网络骚扰威胁要伤害、强奸或杀死至少\
  \ 10 个不同的人。他还被指控犯有七项干扰证人罪。据指称，休斯向受害者发送信息，在其中表达了希望他们死亡，或对他们发出具体的威胁。在 2019 年 10 月的一个例子中，休斯据称向一个报告过此前威胁的人发送了一封邮件，说：“我保证某人会出来，先把你的头撞碎，奸你，割开你的脖子，然后烧掉你的车和房子。”\n\
  \n## 6. 圣地亚哥大学的优等毕业生在网络上恐吓了五名女大学生一年多。受害者收到了数百封暴力和威胁性的电子邮件，有时每天会收到四五封信息。这名研究生认罪并面临长达六年的监禁，他告诉警方他之所以犯罪是因为他认为那些女性在嘲笑他，并导致其他人嘲笑他。事实上，受害者们从未见过过他。\n\
  \n## 7. 在英国，杰森·史密斯（Jason Smith）持续骚扰大学生亚历山德拉·斯卡莱特（Alexandra Scarlett）。他每天给她发多达 30\
  \ 条短信，威胁要割破她的脸、性侵她的母亲或射杀她的父亲。他被判定有罪，被处以 12 个月缓刑和一项禁令。然而，在判决后的一周内，他利用社交网站找到了斯卡莱特女士并继续了骚扰活动。英国媒体将史密斯先生称为“英国最痴迷的骚扰者”。此案也是由于单方面感情落而产生骚扰的案例。史密斯先生在一家夜店遇到了斯卡莱特女士。她给过他的电话号码。随后他坚信他们相爱，并且必须在一起。这导致了他极端的嫉妒，并最终演变成痴迷的骚扰。\n\
  \n## 8. 罗伯特·詹姆斯·墨菲（Robert James Murphy）是第一个根据美国联邦法被指控网络骚扰罪的人。他被指控违反了美国法典第 47 条，该条款禁止利用电信设备骚扰、虐待或威胁任何人。墨菲被指控发送了露骨信息。这种活动持续了几年。墨菲被起诉并最终承认了网络骚扰罪。\n\
  \n## 9. 2020 年，克里斯蒂·詹姆斯·奥哈拉（Kristian James O'Hara）在福特汉大学期间认领了网络骚扰罪。他被指控利用网络骚扰威胁要伤害、强奸或杀死至少\
  \ 10 个不同的人。他还被指控犯有七项骚扰罪。\n\n### 这种犯罪如何影响取证？\n\n网络骚扰是一种有趣的计算机犯罪，计算机只是附带的。犯罪的意图是针对人类；计算机只是一个工具。幸运的是，骚扰者通常并不精通技术。当然，如果嫌疑人被捕，其拥有的任何电子设备都应该接受检查。骚扰的定义是指出反复的、痴迷的行为。这意味着通常会有证据留存。\n\
  \n## 欺诈\n\n`Fraud`是一个广泛的犯罪类别，可以涵盖许多不同的活动。本质上，任何通过欺骗获取财务利益的行为都是欺诈。欺诈的两个大类如下：\n\n\
  *   投资报价\n*   数据盗窃\n\n下文将简要审查这些欺诈类型。\n\n### 投资报价\n\n投资报价既不是新鲜事也不一定违法。事实上，推销股票时电话营销是法的销售技术。然而，这一过程可以被用于人为地推高目标股票的价值。最常见的形式被称为“拉高抛售”（pump\
  \ and dump）。在这种计划中，犯罪分子购买大量廉价的公司股票（通常是细股）。然后，他们散布虚假谣言，称该公司即将获得某项大型合同或其他业务交易以增加其价值。这人为地推高了股价。一旦谣言将股价推到犯罪分子认为可以的高度，他们就会在高位抛出股票，从而获取巨额利润。\n\
  \n互联网的发展并没有创造出这些骗局——它们在互联网出现很久就已经存在了。但互联网的普及和速度仅仅让这些骗局变得更容易实施。例如，在“拉高抛售”中，互联网允许犯罪者创建虚假的博客、公告板帖子和电子邮件，都声称目标股票可能会上涨。\n\
  \n\n\n\n\n常见的网络诈骗手段之一是发送封电子邮件，暗示你只需极少投资就能赚取巨额财富。这可能是为了获得某项奖金而必须提交的手续费，也许是为了获得某笔遗产而缴纳的法律费用。在这些诈骗中，最著名的可能过于“尼日利亚王子”诈骗。在这种场景下，邮件会被发送给大量的随机邮箱地址。每封邮件都包含一封信息，声称来自某位去世的尼日利亚医生或政府官员的亲属，这些人人员通常具有很高的社会地位。（如果该安排看起来涉及社会地位较高的人，更容易让受害者相信该安排是合法的。）提议是这样的：某人有一笔钱想转出境外，但他无法通过正常渠道操作。他想使用你的银行账户临时“存放”这些资金。如果你允许此人访问你的账户，你将获得一笔丰厚的报酬。如果你同意这一安排，你将通过普通邮件收到各种看起来非常正式的文件——这些文件足以说服大多数普通观察者相信该安排是合法的。随后，你会被要求预付一些资金以支付税费和电汇费等费用。然而，如果你真的发送了任何资金，你就会失去它，并且再也听不到这些人的消息。联邦调查局（FBI）发布了一份详细说明这种特定诈骗方案的公告。更多\
  \ FBI 网络犯罪信息可见 [`www.fbi.gov/scams-and-safety/common-scams-and-crimes`](https://www.fbi.gov/scams-and-safety/common-scams-and-crimes)。\n\
  \n## 这种犯罪如何影响法证调查？\n\n这类犯罪的关键是从追踪通信记录开始。如果是一个背书某种投资的虚假博客，那么有人必须为该博客注册域名。如果涉及到电子邮件，它们必须源自某个地方。当然，攻击者越老，证据就越少。在计算机取证之外寻求证据的另一种方法是追踪资金。有人正从该诈骗计划中获得财务回报。\n\
  \n## 数据盗版\n\n知识产权是一种非常真实的商品。大公司花费数百万美元申请专利以及维护其专利和版权。互联网让非法复制材料的传播（或数据盗版）变得非常容易。你可能对非法下载音乐非常熟悉；然而，这只是知识产权盗窃的一个方面。\n\
  \n互联网上可以找到软件的非法副本。有些网站拥有此类副本或软件的激活码。这些网站在口中被称为 warez（发音类似 wares）网站。作为消费者，最应该遵循的建议是：“如果它听起来好得真实，那么它可能就不真实。”换句话说，如果一个网站吹嘘价值\
  \ 400 美元的软件包仅售 89 美元，那么它可能是非法复制的软件。\n\n## 这种犯罪如何影响法证调查？\n\n此类犯罪的调查涉及追踪分发知识产权的网站的所有。这包括找出是谁注册了域名，并对该域名进行\
  \ WHOIS 检索。如果犯罪者很聪明，他或她会隐藏在多个身份之后。然而，起点是追踪分发知识产权的网站。\n\n## 非访问类计算机犯罪\n\n非访问计算机犯罪是不涉及尝试访问目标的犯罪。\n\
  \n### 拒绝服务\n\n拒绝服务（DoS）攻击是一种试图使计算机或网络资源对预定用户不可用的尝试。最常见的方法是 SYN 洪水，即攻击者向目标系统发送一系列\
  \ SYN 请求，但从不对 SYN-ACK 做出响应。这会耗尽目标的连接资源，阻止合法用户连接。\n\n另一种方法是逻辑炸弹，即在程序中插入代码，当满足特定条件（如特定日期或时间）时，它会触发恶意功能。恶意软件也可以通过流量淹没目标来发起\
  \ DoS 攻击。\n\n### 分布式拒绝服务 (DDoS)\n\n分布式拒绝服务（DDoS）攻击是一种 DoS 攻击，利用多个被入侵的系统来淹没单个目标。这比单源攻击难停止得多，因为流量来自许多不同的位置。攻击者经常使用机器人网络（botnet），这是一个被恶意软件感染并由攻击者控制的计算机网络。\n\
  \n\n\n\n\n`Trin00` 是另一种流行的 DoS（拒绝服务）工具。它最初仅适用于 UNIX 系统，但现在也支持 Windows。它是 `TFN` 的替代品。攻击者使用的一种常用技术是通过特木马将\
  \ `Trin00` 客户端发送到机器上——这种代码在普通用户看来是合法的，但实际上是恶意软件。然后，所有被感染的机器都可被用于对目标系统发起协同攻击。\n\n\
  士肉包攻击（Smurf attack）是一种 DoS 攻击，它结合了 IP 欺骗和 ICMP 用流量饱和目标网络。士肉包攻击包含三个元素：源站、中继站（反射站）和目标站。攻击者（源站）向一个大型网络的广播地址（中继站）发送修改过的\
  \ ping 包。修改后的数据包包含目标站的源地址——中继站的所有所有人都会向目标站点回复。碎片化攻击（Fraggle attack）是士肉包攻击的变体，攻击者向广播地址的端口\
  \ `7`（echo）和 `19`（chargen）发送大量的 UDP 流量，并伪造预定受害者的源 IP 地址。\n\n动态主机配置协议（`DHCP`）饥饿是另一种\
  \ DoS 攻击。`DHCP` 用于为计算机动态分配网络地址。这在大多数组织中被广泛使用。如果有足够的请求涌入网络，攻击者可以无限期地完全耗尽 `DHCP` 服务器分配的地址空间。有诸如\
  \ `Gobbler` 等工具可以为攻击者执行此操作。\n\nHTTP post DoS 攻击针对 Web 服务器。此类攻击发送一个合法的 HTTP post\
  \ 消息。post 消息的一部分是 `content-length`，它指示了随后的消息大小。在 във攻击中，攻击者随后以极慢的速度发送实际的消息体。Web\
  \ 服务器随后会等待该消息完成。对于更健壮的服务器，攻击者需要同时使用多个 HTTP post 攻击。\n\n还有其他针对 Web 服务器和网站的 DoS 攻击。攻击者可以创建一个程序反复提交注册表单，为应用程序添加大量虚假用户。攻击者还可能选择通过不断发送登录请求来使登录过程过载，这些请求需要表示层访问身份验证机制，导致其不可用或响应异常缓慢。\n\
  \n永久性拒绝服务 (pDoS) 是一种严重破坏系统，导致受害者机器需要重新安装操作系统甚至更换硬件的攻击。这有时被称为“闪击”（phlashing）。这通常涉及对设备固件的\
  \ DoS 攻击。\n\n近年来变得更加常见的另一种 DoS 攻击是电话拒绝服务（`TDoS`）攻击。`TDoS` 攻击是可能的，并且确实有文档记录了通过传统电话系统使用自动拨号器占用目标电话线。然而，随着基于\
  \ IP 的语音（`VoIP`）工具的广泛可用，针对传统和基于 IP 的 `VoIP` 实施自动化 `TDoS` 攻击已变得非常容易。`TDoS` 攻击的工作原理是呼叫中心或企业接收到大量的入入电话，导致设备和人员不堪重负无法无法业务。向主管或经理打电话会要求发送特定金额的资金或购买特定的清除服务以停止攻击。\n\
  \n### 这如何影响取证分析？\n\n`Trin00` 是另一种流行的 DoS 工具。它最初仅适用于 UNIX 系统，但现在也支持 Windows。它是 `TFN`\
  \ 的替代品。攻击者使用的一种常用技术是通过特木马将 `Trin00` 客户端发送到机器上——这种代码在普通用户看来是合法的，但实际上是恶意软件。然后，所有被感染的机器都可被用于对目标系统发起协同攻击。\n\
