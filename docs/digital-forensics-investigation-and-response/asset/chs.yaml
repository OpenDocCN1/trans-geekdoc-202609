  \ 11-5 所示。\n\n![FIGURE 11-5 查找 Yahoo! 标头.](img/9781284244496_CH11_FIGF05.jpg)\n\
  FIGURE 11-5 查找 Yahoo! 标头。\n\n点击该链接，你可以看到该邮件的标头，如图图 11-6 所示。\n\n![FIGURE 11-6 查看\
  \ Yahoo! 标头.](img/9781284244496_CH11_FIGF06.jpg)\nFIGURE 11-6 查看 Yahoo! 标头。\n\n\
  ### 从 Gmail 获取标头\n\n在 Gmail 中查看邮件标头非常简单，只需遵循以下步骤即可：\n\n1. 登录 Gmail。\n2. 打开想要查看标头的消息。\n\
  3. 寻找 `...` 并点击它（如图图 11-7 所示）。\n4. 选择`显示原始信息（Show Original）`。\n\n![FIGURE 11-7 查找\
  \ Gmail 标头.](img/9781284244496_CH11_FIGF07.jpg)\nFIGURE 11-7 查找 Gmail 标头。\n\n标头会在独立的窗口中显示，看起来与图\
  \ 11-8 所示。\n\n![FIGURE 11-8 Gmail 邮件标头.](img/9781284244496_CH11_FIGF08.jpg)\nFIGURE\
  \ 11-8 Gmail 邮件标头。\n\n\n\n\n\n![FIGURE 11-12 Select your email database.](img/9781284244496_CH11_FIGF12.jpg)\n\
  \n图 11-12 选择您的电子邮件数据库。\n\n在此处，您选择要处理的数据库，它会被添加到案件中。在 Paraben 内部，您可以对邮件数据进行排序、搜索、扫描以及其他处理。Paraben\
  \ 还可以生成数据报告，显示与您的案件最相关的任何数据——或者根据您的意愿显示所有邮件数据。\n\n### ReadPST\n\n`ReadPST` 是一个作为\
  \ `libPST` 软件包一部分提供的程序。您可以在 [`linux.die.net/man/1/readpst`](https://linux.die.net/man/1/readpst)\
  \ 找到 `ReadPST` 的主页。你需要下载并编译它，因为它不提供预编译格式。一旦完成，您就可以运行它并使用它来检查 `PST` 文件。\n\n`ReadPST`\
  \ 会首先将 `PST` 转换为符合 RFC 标准的 Unix 邮件。您可以使用任何标准的 Unix 邮件客户端访问提取出的邮件和附件。如果您有 Microsoft\
  \ Outlook，则无需使用 `ReadPST`。\n\n## 邮件追踪\n\n邮件追踪涉及检查邮件头头部信息，以寻找关于信息去往何处的线索。这将是你作为法医调查员经常的职责之一。您经常会将邮件流量的审计或纸质追踪作为法庭证据。许多调查员推荐使用\
  \ `tracert` 命令。然而，由于互联网的动态性，`tracert` 为邮件提供可靠、一致或准确的路由信息。为了证明这一点，您只需比较邮件头中的路由信息与\
  \ `tracert` 显示的结果即可。结果可能会不同，且发送者与接收者之间的距离越远，理论 `tracert` 结果与从头中嵌入的实际路由信息确定的结果之间的差异就越大。\n\
  \n确定消息源邮件服务器的所有者可能很有用。如果您需要手动查找给定 IP 地址的注册者是谁，网络上有许多 `WHOIS` 数据库可用。以下是其中几个：\n\n\
  * [`www.whois.net`](http://www.whois.net)\n* [`www.networksolutions.com/whois/index.jsp`](http://www.networksolutions.com/whois/index.jsp)\n\
  * [`www.who.is`](http://www.who.is)\n* [`www.internic.net/whois.html`](http://www.internic.net/whois.html)\n\
  * [`cqcounter.com/whois/`](http://cqcounter.com/whois/)\n\n在嫌疑引起引起注意后，您的组织可能会要求您监控该人的流量。例如，管理员可能会要求对表现出不满情绪或接触敏感信息的员工进行安全检查。例如，该员工的邮件日志和网络使用情况可能会显示他/她向一个\
  \ Hotmail 账户发送了无害的家庭照片，但没有流量从该 Hotmail 账户。这些看似无害的照片可能携带了通过隐写术隐藏的消息，从而为员工参与企业间谍活动提供了证据。\n\
  \n法医邮件追踪与传统的侦探工作相似。它涉及查看邮件通过的每一个点。您一步步地回溯到源计算机，并最终找到犯罪分子。\n\n## 邮件服务器法医学\n\n在某个时刻，你需要检查邮件服务器。发送者和接收者都可能删除了相关邮件，但邮件服务器上很大可能留有一份副本。许多服务器有保留策略，这些策略在某些行业可能受法律约束。在检查邮件服务器时，请注意可能有多种正在使用的邮件服务器程序。Microsoft\
  \ Exchange 是非常常用的服务器。Lotus Notes 和 Novell GroupWise 也是流行的邮件服务器产品。\n\n与最常用的邮件服务器软件相关的文件扩展名列如下：\n\
  \n* Exchange Server (`.edb`)\n* Exchange Public Folders (`pub.edb`)\n* Exchange\
  \ Private Folders (`priv.edb`)\n* Streaming Data (`priv.stm`)\n* Lotus Notes (`.nsf`)\n\
  * GroupWise (`.db`)\n* GroupWise Post Office Database (`wphost.db`)\n* GroupWise\
  \ User Databases (`userxxx.db`)\n* Linux Email Server Logs/`/var/log/mail.*`\n\n\
  显然，像 Forensic Toolkit 和 EnCase 等工具允许您将这些文件添加到案件并对其进行处理。只要您能够访问相关软件（例如 Exchange 或\
  \ Lotus Notes），也可以手动检查这些文件。\n\n## 邮件与法律\n\n美国有适用于邮件调查的特定法律。了解相关法律至关重要。未能遵守法律指南可能会导致证据无法在法庭上采用。\n\
  \n### 美国宪法第四修正案\n\n如果一封邮件存储在发送者或接收者的计算机或其他设备上，则美国宪法第四修正案和州法律规定了该信息的查收和收集。要确定存储证据的计算机所有者对该计算机是否有合理的隐私预期。第四修正案要求持有搜查令，或符合搜查令要求的某些认可例外，例如获得设备所有者的同意。\n\
  \n### 《电子通信隐私法》\n\n如果互联网服务提供商（ISP）或任何其他通信网络存储了邮件，对该证据的提取必须根据《电子通信隐私法》（`ECPA`）进行分析`ECPA`\
  \ 对从 ISP 或其他通信服务提供商获取此类证据设定了法律限制。\n\n`ECPA` 获取特定类型信息需要不同的法律程序：\n\n* 基础订阅者信息——这些信息包括姓名、地址、包括信用卡号在内的账单信息、服务类型和时长。调查员可以通过传票、法院命令或搜查令获取此类信息。\n\
  * 交易信息——这些信息包括访问的网站、与订阅者交换邮件的电子邮箱地址以及好友列表。调查员可以通过法院命令或搜查令获取此类信息。\n* 内容信息——调查员持有搜查令可以获取已提取邮件消息的内容，也可以获取未提取的存储邮件。\n\
  * 实时访问——要拦截发送或接收过程中的流量，调查员需要窃听令。\n\n### 《CAN-SPAM 法案》\n\n2003 年的 CAN-SPAM 法案是首部旨在减少未经许可邮件（通常被称为垃圾邮件）的法律。然而，该法律有很多漏洞。例如，在发送邮件前不需要许可。这意味着未经许可的邮件——大多数人认为的垃圾邮件——并不禁止。第二个问题是它仅适用于商业邮件——试图销售某些产品或服务的邮件。因此，政治、宗教或意识形态目的的大邮件不受\
  \ CAN-SPAM 法案涵盖。\n\nCAN-SPAM 的唯一要求是发送者必须提供某种机制，使接收者能够退出未来的邮件，且该方法不能要求接收者付费才能退出。\n\
  \n\n\n\n\n-   退订列表（Opt-out lists），也称为抑制列表，仅用于合规目的，不能出售给其他供应商/发送者。\n\n对于发送者如何获取收件人的电子邮件地址以及发送者如何实际传输电子邮件也存在限制。这些要求如下：\n\
  \n-   消息不能通过开放中继（open relay）发送。\n-   消息不能发送到采集的电子邮件地址。\n-   消息不能包含虚假标头。\n\n这一点非常重要，因为这些是发送垃圾邮件的人经常使用的方法。垃圾邮件是显然适合进行电子取证的犯罪之一。追踪电子邮件的原始发送者是调查垃圾邮件的第一步。遗憾的是，电子邮件有时是从境外网站发送的，或者通过无辜第三方的服务器中继。这使得起诉垃圾邮件变得非常困难，即使获得了判决，在大多数情况下也是无法执行的。\n\
  \n### 18 U.S.C. 2252B\n\n你可能对本章已经讨论过的法律至少有些许熟悉。然而，这项法律并不为人知。首先，阅读法律条文。`Findlaw.com`\
  \ (2013) 对该法律的细节如下：\n\n1. 任何故意在互联网上使用具有误导性的域名，意图欺骗他人查看构成淫秽内容的材料，应根据本法典处以罚款或监禁不超过\
  \ 2 年，或两者兼之。\n2. 任何故意在互联网上使用具有误导性的域名，意图欺骗未成年人查看互联网上对未成年人有害的材料，应根据本法典处以罚款或监禁不超过 4\
  \ 年，或两者兼之。\n3. 就本节而言，包含网站性内容词汇或多个词汇（例如“sex”或“porn”）的域名，不具有误导性。\n4. 就本节而言，“对未成年人有害的材料”是指任何包含裸体、性交或排泄的通信内容，从整体结合其语境来看——\n\
  \    1. 主要引起未成年人的色情兴趣；\n    2. 对于整个成年人社区关于适合未成年人的材料的普遍标准而言具有公然冒犯性；且\n    3. 对未成年人而言缺乏严肃的文学、艺术、政治或科学价值。\n\
  5. 就第 (d) 小节而言，“性”一词是指自慰行为、性交或与人体生殖器的物理接触，或人类男女生殖器在性刺激或兴奋状态下的状态。\n\n这项法律针对的是试图隐瞒其网站色情性质的犯罪分子，这通常是为了让未成年人更容易访问。这是一个非常严重的问题，有时出现在诱拐儿童的案件中。\n\
  \n### 《执法协助法案》\n\n《执法协助法案》（Communication Assistance to Law Enforcement Act，简称 `CALEA`）不要与同名的执法标准认证混淆，它是美国于\
  \ 1994 年通过的一项窃听法。\n\n`CALEA` 的目的是允许执法部门和情报机构合法地进行电子监视。它要求电信运营商和电信设备制造商修改并设计其设备、设施和服务，以确保它们内置了监视能力，允许联邦机构实时监控所有电话、宽带互联网和\
  \ VoIP 流量。`CALEA` 被广泛使用，对 `CALEA` 的基本了解应该是每位取证人员的基础知识的一部分。\n\n### 《外国情报监视法》\n\n\
  1978 年的《外国情报监视法》（`FISA`）是一项美国法律，规定了在外国势力与外国势力代理人（可能包括涉嫌间谍或恐怖主义的美国公民和永久居民）之间进行物理和电子监视以及收集“外国情报”的程序。该法律不适用于美国境外，但取证人员在研究情报时即使不专门涉及间谍或恐怖主义，也可能会遇到。该法律是许多机构信息收集方法的重要部分。它被频繁修订，因此关注最新的修订和法院案例非常重要。\n\
  \n### 《美国爱国法案》\n\n2001 年的《美国爱国法案》（`USA PATRIOT Act`）其名称包含一个 10 个字母的缩写，代表“通过统一（并）加强美国（以）提供拦截（并）阻碍恐怖主义（反恐怖主义）所需的适当工具”。该法案作为对\
  \ 2001 年 9 月 11 日恐怖袭击的回应而通过并成为法律。它显著减少了执法机构在美国境内收集情报的限制；扩大了财政部部长监管金融交易的权限，特别是涉及外国个人和实体的交易；并扩大了执法和移民当局在扣留和/或驱逐涉嫌恐怖主义及相关行为的移民方面的裁量权。该法律还扩大了恐怖主义的定义，将国内恐怖主义纳入其中，从而扩大了《美国爱国法案》扩展后的执法权力可以应用的活动范围。\n\
  \n2011 年 5 月，巴拉克·奥巴马总统签署了《2011 年爱国法案日落延长法案》，这是对《美国爱国法案》中三项关键条款的为期延长：移动窃听、搜查。\n\n\
  \n\n\n\n与 Windows、Linux 和 Mac 操作系统一样，在对设备进行取证分析之前，充分理解手机和其他设备的原理至关重要。在本节中，你将学习移动设备中使用的核心概念和技术。本节将向你介绍一些为了对蜂窝设备进行取证而需要理解的基本概念。\n\
  \n## 术语\n\n从术语开始是合适的。本节介绍了许多与移动技术相关的术语及其简要定义。熟悉本节中的术语对你来说非常重要。\n\n### 移动切换中心\n\n\
  移动切换中心 (MSC) 是蜂窝网络的切换系统。MSC 用于 1G、2G、3G 以及 全球移动通信系统 (GSM) 网络。你将在本节的后半部分学习 3G 和 GSM\
  \ 网络。MSC 处理所有移动设备之间、以及移动设备与固定电话之间的所有连接。MSC 还负责基站与公共交换电话网 (PSTN) 之间的通话路由。\n\n###\
  \ 基站收发站\n\n基收发站 (BTS) 是蜂窝网络中负责手机与网络切换系统之间通信的部分。基站系统 (BSS)是一组与蜂窝设备通信的无线收发设备。它由一个\
  \ BTS 和基站控制器 (BSC) 组成。BSC 是协调 BSS 其他部分的中央控制器。\n\n### 位置寄存器\n\n用户位置寄存器 (HLR) 是 MSC\
  \ 使用的数据库，包含用户数据和服务信息。它与访客位置寄存器 (VLR) 相关，后者用于漫游手机。\n\n### 用户识别模块\n\n用户识别模块 (SIM)\
  \ 是一个存储国际移动用户识别 (IMSI) 的内存芯片。它旨在为每部手机提供唯一标识，是你用来识别手机的工具。许多现代手机具有可拆卸 SIM，这意味着你可以更换\
  \ SIM，本质上拥有一部具有不同号码的手机。SIM 卡包含其唯一的序列号——ICCID，以及 IMSI、安全认证和加密信息。SIM 通常还包含网络信息、用户可以访问的服务以及两个密码。这两个密码别是个人识别码\
  \ (PIN) 和个人解锁码 (PUK)。\n\n### 电子序列号\n\n电子序列号 (ESNs) 是美国联邦通信委员会 (FCC) 开发的用于识别手机手机的唯一识别号。它们现在仅用于分分多址\
  \ (CDMA) 手机，而 GSM 及随后的手机使用国际移动设备标识 (IMEI) 数字。IMEI 是一个分配用于识别现代移动手机的数字（通常是唯一的）。它通常打印在手机电池仓内部，但也可以在大多数手机上通过在拨号盘输入\
  \ `*#06#` 在屏幕上显示，或者在智能手机操作系统设置菜单中与其他系统信息一起显示。\n\n### 个人解锁码\n\n个人解锁码 (PUK) 是用于重置忘记的\
  \ PIN 代码。使用该代码会将手机恢复到原始状态，导致大多数取证数据丢失。如果连续错误输入代码 10 次，设备将被永久锁定且无法恢复。\n\n### 集成电路卡标识符\n\
  \n每张 SIM 都通过其集成电路卡标识符 (ICCID) 进行标识。这些数字在制造期间期间刻在 SIM 卡上。该数字包含对取证非常重要的子部分。该数字以发行机构识别码\
  \ (IIN) 开头，IIN 是一个识别国家代码和发行机构的七位数字，后面是长度可变的个人账户识别号（用于识别特定手机）以及一个校验位。ICCID 包含一些有趣的信息。根据\
  \ ForensicWiki，¹，示例 `89 91 10 1200 00 320451 0`：\n\n*   前两个数字（示例中的 `89`）指主行业标识符。\n\
  *   接下来两个数字（示例中的 `91`）指国家代码（`91-India`）。\n*   接下来两个数字（示例中的 `10`）指发行机构识别码。\n*   接下来的四个数字（示例中的\
  \ `1200`）指制造的月份和年份。\n*   接下来两个数字（示例中的 `00`）指切换。\n*   接下来的六个数字（示例中的 `320451`）指 SIM。\n\
  *   最后一位数字（`0`）是校验位。\n\n### 3GPP\n\n从术语开始是合适的。本节介绍了许多与移动技术相关的术语及其简要定义。熟悉本节中的术语对你来说非常重要。\n\
  \n### 3GPP\n\n这实际上是一个相关标准的群体。该缩写代表第三代伙伴计划。GSM、UMTS、LTE 和 5G 标准都由 3GPP 管理。\n\n##\
  \ 网络\n\n虽然本节涵盖了术语，但它们针对网络，因此单独列出。了解使用的网络类型可能是理解移动设备的基础部分。网络网络如下：\n\n*   **全球移动通信系统\
  \ (GSM)**：GSM 通是由欧洲标准协会 (ETSI) 开发的标准。基本上 GSM 是 2G 网络。\n*   **GSM 数据速率增强 (EDGE)**：GSM\
  \ 数据速率增强 (EDGE) 并不完美符合 2G-3G-4G 连续体。技术上被认为是 2G+，但它是 GSM 的改进，因此可以认为是 2G 和 3G 之间的桥梁。\n\
  *   **通用移动通信系统 (UMTS)**：通用移动通信系统 (UMTS) 是基于 GSM 的 3G 标准。它本质上是 GSM 的改进。\n*   **长期演进\
  \ (LTE)**：长期演进 (LTE) 是一种用于移动设备高速数据无线通信的标准。这就是通常说的 4G。\n*   **5G**：第五代无线系统（缩写为 5G）符合\
  \ ITU IMT-2020 要求，3GPP Release15 峰值数据速率 20 Gbit/s，预期用户数据速率 100 Mbit/s。由于带宽增加，预计\
  \ 5G 网络不仅像现有蜂窝网络一样服务手机，还将作为通用互联网服务提供商，与现有 ISP 竞争，并为物联网 (IoT) 的无线传感器提供连接。\n*   **无线局域网\
  \ (Wi-Fi)**：现在的大多数手机和其他移动设备都能连接 Wi-Fi 网络。无线网络已成为常态，在餐厅、咖啡馆、酒店、家里等许多地方都可以找到免费的 Wi-Fi\
  \ 热点。\n\n**操作系统\n\n今天的移动设备是复杂的计算机系统。无论你喜欢 Android、Windows 还是苹果手机，手机都有一个操作系统。平板电脑也是如此。因此，对移动设备上使用的主要操作系统有一些基础知识是非常重要的。\n\
  \n#### iOS\n\n\n\n\n\niOS 操作系统用于 iPhone、iPod 和 iPad。它最初于 2007 年为 iPod Touch 和 iPhone\
  \ 发布。其用户界面完全基于直接触摸图标。它支持 Apple 所称为的手势：滑动、拖放、缩放、点击等。iOS 操作系统源自 OS X。\n\niOS 内核是 `Darwin`\
  \ 的 `XNU` 内核。原始 iPhone OS (`1.0`) 到 iPhone OS `3.1.3` 使用 `Darwin 9.0.0d1`。iOS 4\
  \ 基于 `Darwin 10`。iOS 5 基于 `Darwin 11`。iOS 6 基于 `Darwin 13`。iOS 7 和 iOS 8 基于 `Darwin\
  \ 14`。iOS 9 基于 `Darwin 15`。iOS 10 基于 `Darwin 16`。iOS 11 基于 `Darwin 17`。iOS 12 基于\
  \ `Darwin 18`。\n\n`Darwin` 是 Apple 在 2000 年首次发布的开源 Unix 代码。`Darwin` 是 OS X、iOS、watchOS、tvOS\
  \ 等的核心。iOS 操作系统使用 256 位加密，因此设备加密非常安全。\n\n截至本文编写时，iOS 14 是当前版本；它于 2020 年 6 月发布。该版本具有一些有趣的安全增强。一个例子是，在\
  \ iOS 14 中，每当应用程序访问麦克风或摄像头时，显示录制指示。\n\niOS 有四层。第一层是 `Core OS` 层。这是操作系统的核心。接下来是 `Core\
  \ Services` 层。`Core Services` 层是应用程序与 iOS 交互的方式。接下来是 `Media` 层，负责音乐、视频等。最后是 `Cocoa\
  \ Touch` 层，它响应上述手势。\n\niOS 的文件系统结构与 Unix 类似。根目录被称为 `root`，简单表示为 `/`。通常，用户无法访问它。在根目录下，有系统数据和用户数据。幸运的是，犯罪分子也访问系统数据；因此，仅访问用户数据对于\
  \ iOS 取证来说并非不可行。\n\n自 iOS 10.3 起，iOS 使用了 `Apple File System` (`AFS`)。这与 Mac OS 10.13\
  \ 及更高版本，以及 tvOS 10.2 和 watchOS 3.2 使用的文件系统相同。它是旧版 `HFS+` 的替代品。`AFS` 支持全磁盘和文件加密。它还支持对某一的文件系统进行只读快照。`AFS`\
  \ 支持 64 位 inode 编号，允许存储更多的文件。该文件系统还使用校验和来确保元数据的完整性。\n\niOS 数据分区包含以下几个元素：\n\n* 日历条目\n\
  * 联系人条目\n* 笔记条目\n* `iPod_control` 目录（此目录已隐藏）\n* Apple 媒体应用配置\n* Mac OS 和 Windows\
  \ 上的 Apple Music 应用\n\n确切列表会根据型号而异。在图 12-1 中，你可以看到 iPhone 11 上文件系统的用户部分。图 12-1 中的某些信息已被删减，因为这张照片是从真实的手机上拍摄的。\n\
  \n![图 12-1 iPhone 11 用户文件系统。](img/9781284244496_CH12_FIGF01.jpg)\n\n图 12-1 iPhone\
  \ 11 用户文件系统。\n\n取证调查特别感兴趣的是文件夹 `iPod_control\\device\\sysinfo`。该文件夹包含两个非常重要的信息：\n\
  \n* 型号\n* 序列号\n\niOS 运行在 iPhone、iPod 和 iPad 上。这意味着一旦你熟悉了某台 Apple 设备上的操作系统，你就应该熟悉任何\
  \ Apple 设备。这不仅适用于用户交互的功能，也适用于操作系统的基础知识。因此，如果你有 iPhone 取证的经验，那么对 iPad 进行取证分析将没有问题。\n\
  \n如果你无法访问 iPhone，可能从嫌疑者的 iCloud 账户中获取大部分数据。截至 2018 年，有 8.5 亿客户正在将其数据备份到云端。只要知道原始的\
  \ Apple ID 和密码，任何人都可以在没有物理设备的情况下检索存储在 iCloud 中的信息。通常，可以从用户的计算机中提取用户名和密码。\n\n在本章的后后部分，我们将简要描述一些商业工具。然而，也有免费的\
  \ iOS 取证工具可以使用。`3uTools` 工具可以从 [`www.3u.com/`](http://www.3u.com/) 免费下载。\n\n`3uTools`\
  \ 会立即显示如 IMEI、iOS 版本、SPU 等大量重要信息。你还可以获取手机上应用的完整列表以及音乐、照片和其他数据。你必须越狱 iPhone 才能提取通话和短信记录。\n\
  \n### Android\n\nAndroid 操作系统基于 Linux 的操作系统，它是完全开源的。如果你有编程和操作系统的背景，你可能会发现检查 Android\
  \ 很有用。你可以查看 [`source.android.com/`](http://source.android.com/)。\n\nAndroid 于 2003\
  \ 年首次发布，是 Google、Andy Rubin 和 Nick Sears 的创造。Android 版本以甜点命名：\n\n* Cupcake\n* Donut\n\
  * Eclair\n* Froyo\n* Gingerbread\n* Honeycomb\n* Ice Cream Sandwich\n* Jellybean\n\
  * Kitkat\n* Lollipop\n* Marshmallow\n* Nougat\n* Oreo\n* Pie\n* 10\n\n版本之间的差异通常涉及新功能的添加，而不是操作系统的根本性变化。这意味着如果你熟悉\
  \ 7.0 (Nougat)，你就能对 9.0 (Pie) 进行取证分析。虽然 Android 源码是开源，但每个厂商可能会进行修改。这意味着分区布局可能不同。然而，大多数\
  \ Android 设备（手机或平板电脑）都有共同分区。\n\n* `boot loader` 分区用于硬件初始化和加载 Android 内核。这可能不包含重要的数据。\n\
  * `boot` 分区包含启动所需的信息。同样，这可能不包含重要的加密数据。\n* `recovery` 分区用于将手机进入恢复控制台。虽然该分区可能没有取证相关的数据，但有时你需要进入恢复模式。\n\
  * `user data` 分区与取证调查最相关。在这里你会找到大部分用户数据，包括所有应用程序数据。\n* `cache` 分区存储频繁访问的数据和恢复日志。这对于取证调查可能非常重要。\n\
  * `system` 分区对于取证检查通常并不。\n\n记住 Android 是基于 Linux 的；如果你有一个 Android 手机的镜像，你可能可以在上面执行一些\
  \ Linux 命令。例如，使用 `cat proc/partitions` 将向你显示你正在检查的手机上存在的分区。\n\n除了这些分区之外，某些特定目录可能会产生取证证据。\n\
  \n* `acct` 目录是控制组的挂载点并提供用户统计。\n* `cache` 目录存储频繁访问的数据。这在取证上几乎总是很有意义。\n* `data` 目录包含每个应用程序的数据。这对于取证检查显然至关重要。\n\
  \n\n\n\n\n-   `mnt` 目录是所有文件系统的挂载点，可以指示内部和外部存储（如 SD 卡）。如果你有一个 Android 镜像，在该目录上使用的\
  \ Linux `ls` 命令将向你显示各种存储设备。\n\n要从 Android 手机或平板电脑中提取数据，手机必须处于开发者模式。进入该模式的方法随着版本的不同而变化；这里提供了访问开发者模式的方法（请注意某些机型的步骤略有不同）：\n\
  \n> 进入 `Settings > General > About` 并点击 7 次 `Build Number`（编译次数）。\n\n> 在点击 7 次 `Build\
  \ Number` 后，你将看到消息“你现在是开发者了！”\n\n> 返回主 `Settings`（设置）菜单，现在你就能看到 `Developer Options`（开发者选项）。\n\
  \n> 点击 `Developer options` 并勾选 `USB Debugging` 前的框以启用它。\n\n> 如果以后想禁用 `USB Debugging`\
  \ 模式，可以取消该选项前的复选框。\n\n> 要启用 `Developer Options`，前往 `Settings > Developer options`\
  \ 并点击页面顶部的 `ON/OFF` 滑块。\n\n还需要注意的是，你可以从 Android 手机的键盘上获取大量的信息。有许多“秘密”代码可以检索信息。请记住，这些代码在所有机型上并不有效。\n\
  \n> 诊断配置 `*#9090#`\n\n> 电池状态 `*#0228#`\n\n> 系统转储模式 `*#9900#`\n\n> 测试菜单 `*#*#4636#*#**`\n\
  \n> 显示设备信息 `*#*#4636#*#**`\n\n> 出厂重置 `*#*#7780#*#**`\n\n> 摄像头信息 `*#*#34971539#*#**`\n\
  \n> 完全擦除设备，安装官方固件 `*2767*3855#`\n\n> 快速 GPS 测试 `*#*#1472365#*#**`\n\n> Wi-Fi MAC\
  \ 地址 `*#*#232338#*#**`\n\n> RAM 版本 `*#*#3264#*#**`\n\n> 蓝牙测试 `*#*#232331#*#**`\n\
  \n> 显示 IMEI 号 `*#06#`\n\n> 移除 Google 账号设置 `*#*#7780#*#**`\n\n这些只是代码示例。你可以在互联网上搜索如“Motorola\
  \ 手机秘密代码”的内容，以获取特定手机机型的代码信息。\n\n### Android 调试桥接\n\n对于 Android 手机，除了我们在本章稍后讨论的商业工具外，你还有另一种取证选择。该工具就是\
  \ Android 调试桥接（ADB）。你可以从 [`developer.android.com/studio/command-line/adb`](https://developer.android.com/studio/command-line/adb)\
  \ 免费下载此工具。Android 调试桥接的开发是为了为 Android 设备开发应用的程序员提供帮助，使他们能够与测试设备交互以进行调试。然而，它确实允许提取取证数据。这为取证分析师提供了额外的工具。目前对使用\
  \ Android 调试桥接进行取证的研究还有限。通常称为 `ADB` 的 Android 调试桥接包含三个组件：\n\n- 客户端（client），用于发送命令。客户端运行在开发机上。调查人员可以通过命令行终端发布\
  \ `adb` 命令来调用客户端。\n\n- 守护进程（daemon，`adbd`），在设备上运行命令。守护进程作为后台进程运行在每个设备上。\n\n- 服务器（server），管理客户端与守护进程之间的通信。服务器作为后台进程运行在你的开发机上。\n\
  \n与所有移动设备取证工具一样，手机必须处于调试模式才能与其交互。本文未描述这些具体的步骤，因为它们是移动设备取证从业人员的常识，并记录在大多数数字取证教科书中。\n\
  \n当你启动一个 `ADB` 客户端时，客户端首先检查是否已经有一个运行中的 `ADB` 服务器进程。如果没有，它将启动服务器进程。当服务器启动时，它会绑定本地\
  \ TCP 端口 `5037` 并监听来自 `ADB` 客户端的命令——所有 `ADB` 客户端都使用端口 `5037` 与 `ADB` 服务器通信。当设备连接到带有\
  \ `ADB` 的电脑时，第一步是列出所有连接的设备。如图 12-2 所示。\n\n![FIGURE 12-2 ADB devices.](img/9781284244496_CH12_FIGF02.jpg)\n\
  \n图 12-2 ADB 设备。\n\n在使用 `ADB` 时，有几个命令值得关注。`adb shell` 命令进入 Android 的 shell，用户可以在其中利用标准的\
  \ Linux 命令。如图 12-3 所示。\n\n![FIGURE 12-3 ADB shell.](img/9781284244496_CH12_FIGF03.jpg)\n\
  \n图 12-3 ADB shell。\n\nADB shell 内部常用的命令包括 `pstree`，它用于以树形格式列出所有进程。其他 Linux 命令如\
  \ `ls`、`netstat` 和 `lsof` 也很有用。若要查看设备上所有可用的 Linux 命令，可以在 ADB shell 中输入 `ls /system/bin`。这将显示所有系统二进制文件（即可执行文件）。\n\
  \n除了在 ADB shell 内部发布 Linux 命令外，还有一些 ADB 专有的命令在取证检查中也很有用。常用的 ADB 命令总结在表 12-1 中。\n\
  \n表 12-1 ADB 命令。\n\n| 命令 | 目的 |\n| :--- | :--- |\n| `adb pull` | 从设备提取单个文件或整个目录到电脑。\
  \ |\n| `adb restore <archive name>` | 创建备份。 |\n| `adb reboot` | 使手机重启。有几种模式：`adb\
  \ reboot`, `adb reboot recovery`, `adb reboot bootloader`。 |\n| `dumpsys` | 这是一个多功能命令，有多个选项：`adb\
  \ shell dumpsys package com.android.chrome` 将导出特定包的数据。`adb shell dumpsys activity`\
  \ 提供关于 Activity 管理、活动、提供者、服务、广播等的信息。 |\n| `pm list packages` | 列出设备上所有的包。包括 `pm\
  \ list packages -f` 查看关联文件；`pm list packages -d` 仅显示禁用包；`pm list packages -e` 仅显示启用包；`pm\
  \ list packages -i` 查看安装程序；`pm list packages -u` 包含卸载包。 |\n| `dumpstate` | `adb\
  \ shell dumpstate` 将导出大量信息。最好输出到文件，例如：`adb shell dumpstate > state.txt`。 |\n\n###\
  \ Root Android\n\n遗憾的是，有些数据在不 root Android 手机的情况下是无法获取的。root 是 Linux 中管理员的术语。在 Linux\
  \ 中，你只需要输入 `su`（超级用户或切换用户）并输入 root 密码。然而，Android 手机不允许这样做。root 手机会让你获得对手机所有方面的完全\
  \ root 权限。但这将导致任何保修失效。\n\n\n\n\n\n在对手机进行 root 之前，它必须先通过原始设备制造商（OEM）解锁。而恰好在你对手机进行\
  \ OEM 解锁之前，你必须先从运营商处解锁。唯一持续有效的运营商解锁方法是联系运营商（前提是已结清合同）并请求解锁。之后，你有几种进行 OEM 解锁的选项，这再次取决于你正在处理的手机和型号。\n\
  \n如果手机在开发者选项下启用并显示“OEM 解锁（OEM Unlock）”，那么你就可以选择使用 `ADB`（在前节中讨论过）并进入所谓的 fastboot\
  \ 模式。对于大多数手机，这是通过使用 `ADB` 并输入 `adb reboot bootloader` 完成的。在那个节点上，你可以尝试执行 `fastboot\
  \ oem unlock`。如果这不起作用，那么你的型号需要你获取一个解锁代码并将其发送给供应商以获取 OEM 解锁。这在图 12-4 所示。\n\n![图 12-4\
  \ OEM 解锁。](img/9781284244496_CH12_FIGF04.jpg)\n\n图 12-4 OEM 解锁。\n\n你会知道你的手机是否已 OEM\
  \ 解锁。一旦手机 OEM 解锁，你就可以对手机进行 root。但请注意，对于许多手机，实现 OEM 解锁可能非常困难。输入：\n\n![程序代码。在代码中，变量名中的单词已合并。第\
  \ 1 行。a d b reboot boot loader。](img/9781284244496_CH12_01_UNNUN01.jpg)\n\n```\n\
  adb reboot bootloader\n```\n\n接着输入：\n\n![程序代码。在代码中，变量名中的单词已合并。第 1 行。fast boot, o\
  \ e m device, 连字符, info。](img/9781284244496_CH12_01_UNNUN02.jpg)\n\n```\nfastboot\
  \ oem device-info\n```\n\n你将看到设备的 OEM 解锁状态，如图 12-5 所示。\n\n![图 12-5 OEM 解锁状态。](img/9781284244496_CH12_FIGF05.jpg)\n\
  \n图 12-5 OEM 解锁状态。\n\n一旦 OEM 解锁，你就可以使用如 `Magisk` 等免费工具来安装已 root 的新镜像。一旦你安装了 `Magisk`，你就可以更新系统。但你需要将镜像推送到系统中，以便\
  \ `Magisk` 能够找到它。这可以通过 `adb push` 完成。此外，新镜像会占用大量空间；请确保你有足够的空间来存放镜像。\n\n一旦手机完成 OEM\
  \ 解锁，root 并不算困难。你需要一个 `TWRP` 镜像；这些镜像可以在 [`twrp.me/Devices/`](https://twrp.me/Devices/)\
  \ 找到。完成 OEM 解锁后的流程如下：\n\n*   将 `TWRP` 恢复镜像放置在“ADB and Fastboot”文件夹中。\n*   打开 `fastboot`。\n\
  *   检查设备是否已通过 `ADB` 设备连接。\n*   通过输入 `adb reboot bootloader` 重启到 boot loader 模式。\n\
  *   使用手机屏幕选择从 ADB Sideload 应用更新，或类似的条目。\n*   输入 `fastboot flash recovery twrp.img`。\n\
  \n注意，`twrp.img` 是你打算放入手机的任何镜像，它必须位于 fastboot 目录中。请记住，对于较新的手机型号，这些步骤中的任何一步都可能失败。现代手机的\
  \ root 是一项艰巨的任务，并且经常失败。\n\n### Android 免费工具\n\n考虑到 Android 的开源特性，网上有很多免费工具可以自动化你与\
  \ Android 手机的交互，这并不意外。其中许多工具仅仅是自动化了 `ADB` 过程，使其变得简单得多。其中一个工具是免费下载的 `Android Tools`，可以在\
  \ [`sourceforge.net/p/android-tools/wiki/Home/`](https://sourceforge.net/p/android-tools/wiki/Home/)\
  \ 获取。该工具在图 12-6 所示。\n\n![图 12-6 Android Tools。](img/9781284244496_CH12_FIGF06.jpg)\n\
  \n图 12-6 Android Tools。\n\n这个工具是那些基本上自动化 `ADB` 的工具之一。一旦你熟悉了 `ADB`，就可以使用此类工具来自动化\
  \ `ADB` 命令的过程。`Android All in One Tool` 是另一个可以自动化 `ADB` 命令的免费工具。该工具可以在 [`toolaio.tk/`](https://toolaio.tk/)\
  \ 获取。你可以在图 12-7 中看到此工具。\n\n![图 12-7 All in One Android tool。](img/9781284244496_CH12_FIGF07.jpg)\n\
  \n图 12-7 All in One Android tool。\n\n## 从手机中可以获取的证据\n\n手机或平板电脑可以是数字信息的宝库，鉴于此，这并不意外。你应该从移动设备中尝试恢复的物品包括：\n\
  \n*   通话记录\n*   电子邮件、短信或其他格式的消息\n*   照片和视频\n*   手机信息\n*   全球定位系统 (GPS) 信息\n*   网络信息\n\
  \n通话记录可以让你知道与谁通话以及通话多久。是的，这些信息很容易被删除，但许多用户并没有删除它们。或者嫌疑者想要删除这些数据但没得及。无论何种情况，除非网络骚扰案，否则这些无法提供直接犯罪证据。在网络骚扰案中，通话记录可以显示与受害者的接触模式。然而，在其他案件中，它只提供间接证据。例如，如果约翰·史密斯被怀疑在贩毒，而他的通话记录显示与已知的毒贩有定期通话，这本身并不能构成犯罪证据。但是，它有助于调查人员了解整个案件的状况。\n\
  \n许多手机允许发送和接收电子邮件和消息。从移动设备中获取这些信息非常重要。嫌疑者通信的双方以及通信内容都非常重要。照片和视频可以提供犯罪证据。在儿童色情案件中，其相关性显而易见。然而，你可能会惊讶地发现，某些犯罪人对自己实施犯罪的过程拍照或录像并不罕见。对于计划犯罪或在药物酒精影响下犯罪的年轻犯罪分子尤为如此。\n\
  \n关于手机的信息应该是你记录的首要事项之一。这包括型号、SIM 卡序列号、操作系统或其他类似信息。你记录的信息越详细、描述性越越好。全球定位系统信息在各种案件中变得越来越重要。由于这么多个人都开启了设备的\
  \ GPS 功能，法医分析师不检索这些信息似乎是失职的。\n\n\n\n\n\n将 Wi-Fi 与 GPS 使用将提高 GPS 的准确性。这是因为包括 Google\
  \ 在内的各种机构都会跟踪无线路由器使用的基本服务集标识符（`BSSID`），并将其与物理地址关联。`BSSID` 是一个唯一地址，用于识别创建无线网络的接入点/路由器。为了识别接入点及其客户端，会使用接入点的\
  \ MAC 地址。这意味着，如果你的手机连接到无线接入点，即使没有其他数据数据，手机的位置也可以被精确锁定到该接入点周围 100 英尺的范围内。网络信息同样重要。手机识别了哪些\
  \ Wi-Fi 网络？这可能让你了解手机去过哪些地方。例如，如果手机属于某个被怀疑骚扰受害者的人，而该嫌疑人的手机网络记录显示他或她经常在受害者家附近使用 Wi-Fi\
  \ 网络，这可能是一个重要的证据。\n\n### SWGDE 指南\n\n数字取证科学工作组（[`www.swgde.org/`](https://www.swgde.org/））对许多数字取证主题提供指导。在移动设备取证方面，SWGDE\
  \ 提供了手机取证调查类型的概概述：\n\n> 移动取证金字塔——提取和分析所需的取决于请求和调查的具体细节。较高层次需要更全面的检查以及额外的技能，并且可能不适用于每部手机或情况。移动取证金字塔的每一层都有其相应的技能\
  \ set。级别如下：\n\n1.  手动（Manual）——涉及手动操作键盘和手机显示屏，以记录手机内部内存中存在的数据。\n2.  逻辑（Logical）——提取文件系统部分的过程。\n\
  3.  文件系统（File System）——提供文件系统访问的过程。\n4.  物理（非侵入式）——一种在不需要拆卸手机壳的情况下提供手机数据物理获取的过程。\n\
  5.  物理（侵入式）——提供手机数据物理获取的过程，并需要拆卸手机以访问电路板（例如 `JTAG`）。\n6.  拆芯片（Chip-Off）——涉及移除并读取内存芯片以进行分析的过程。\n\
  7.  微读（MicroRead）——涉及使用高功率显微镜提供内存单元物理视图的过程。[9781284244496_CH12]\n\n### 调查类型\n\n\
  必须记住，手机取证已扩展到传统的网络犯罪之外。事实上，今天很少有犯罪不涉及嫌疑人手机的至少某些网络取证方面。上述 GPS 信息在毒品案件、入室盗、谋杀以及各种其他犯罪中都可能非常重要。这里给出几个例子：\n\
  \n*   Adam Howe 在一家教堂入室盗现场为自己拍了张“自拍”。这一证据导致了对嫌疑人财产的搜查，发现了从教堂偷盗的财物。\n*   2013 年，手机照片导致了一起珠宝店入室盗案的逮捕。被指的小偷丢弃了衣服，不小心将手机掉在附近\
  \ 7-Eleven 商店后面。手机照片确证识别了他的身份。\n\n### 信息类型\n\n美国国家标准与技术研究院（NIST）在 [http://csrc.nist.gov/publications/nistpubs/800-72/sp800-72.pdf](http://csrc.nist.gov/publications/nistpubs/800-72/sp800-72.pdf)\
  \ 的指南中列出了提取数据时移动设备可能处于的四种不同状态：\n\n*   初始状态（Nascent State）——设备从制造商处接收时处于初始状态；设备不包含任何用户数据，并具有原始出厂配置设置。\n\
  *   激活状态（Active State）——处于激活状态的设备已电源，正在执行任务，并允许用户自定义，且其文件系统填充了数据。\n*   静止状态（Quiescent\
  \ State）——静止状态是一种节电模式，同时保持用户数据并执行其他后台功能。设备的上下文信息保存在内存中，以便在返回激活状态时快速恢复处理。\n*   半激活状态（Semi-Active\
  \ State）——半激活状态是激活和静止之间的中间状态。该状态通过定时器达到，定时器在一段时间无活动后触发，通过调暗显示和其他适当措施来保护电量。\n\n在进行调查和分析时，你应该记录设备处于什么种状态。如果你更改了状态——例如通过打开设备——也应该予以记录。\n\
  \n## 从移动设备中提取证据\n\n一旦准备好从移动设备中提取证据，请记住以下规则：\n\n*   如果你要将手机连接到计算机，请确保手机不会与计算机同步。这对于经常自动同步的\
  \ iPhone 尤为重要。\n*   遵循你对待 PC 的相同建议。确保尽可能少地接触证据，并记录你对设备进行的操作。\n\n最重要的事情之一是确保你不会意外地向移动设备写入数据。例如，如果你将\
  \ iPhone 连接到你的取证工作站，你想要确保不会意外地将工作站的信息写入 iPhone。\n\n如果取证工作站是 Windows 机器，你可以使用注册表防止工作站向移动设备写入。在连接到\
  \ Windows 机器之前，找到注册表项 `HKEY_LOCAL_MACHINE\\System\\CurrentControlSet\\StorageDevicePolicies`，将值设置为\
  \ `0x0000001`，然后重启计算机。这将防止计算机向连接的设备写入。\n\n尽管 `Forensic Toolkit` 和 `EnCase` 都可以对手机进行镜像，但还有其他专门为手机设计的的产品：\n\
  \n*   `Oxygen Forensics`——这是一种能够镜像和检查 iPhone 和安卓手机的全取证工具。它提供了许多易用的工具来提取联系人、社交媒体数据等。\n\
  *   `Cellebrite`——这可能是最著名的手机取证工具。它被执法部门广泛使用。它是一个非常强大且有效的工具。我所知知的 `Cellebrite` 的唯一缺点是价格高昂。它是市场上最贵的手机取证工具。\n\
  *   `MobileEdit`——该产品有多个版本。`MobileEdit Lite` 是 `MobileEdit` 中取证最先进的版本。这是一个非常易用的工具，可以帮助取证人员从手机中提取数据。\n\
  *   `Data Doctor`——该产品可以恢复所有收件箱和发送箱数据以及所有联系人数据，界面易用。最重要的是它有免费体验版，但完整版需要付费。它可以通过\
  \ [`www.simrestore.com/`](http://www.simrestore.com/) 获取。\n*   `Device Seizure`——可以在\
  \ Paraben Software 的 [`www.paraben.com/`](http://www.paraben.com/) 获取。该产品需要许可证费用。Paraben\
  \ 有许多取证产品。\n*   `Forensic SIM Cloner`——该工具用于克隆 SIM 卡，以便你对 SIM 卡进行取证分析。\n\n\n\n\n\
  \nWindows 10 手机取证的方法与 Windows 10 PC 或笔记本电脑的取证方式大相同。唯一的问题是确保手机不会与取证工作站同步。Android\
  \ 设备也存在类似的问题。因为它基于 Linux，许多相同的取证技术可以适用。请记住，手持便携设备可能没有 PC 或服务器拥有的所有日志，但如果操作系统相同，那么取证结果在很大程度上是相同的。\n\
  \n无论你选择何种工具，都应该确保它能够满足你的取证需求。由 NIST 赞助的计算机取证工具测试计划（`CFTT`；[`www.cftt.nist.gov/`](http://www.cftt.nist.gov/)）提供了一种保证，确保用于计算机犯罪调查的工具能够产生有效结果。测试包括一组核心要求以及一些可选要求。在选择工具时，参考这些标准是一个明智之举。\n\
  \nNIST 还提供了了关于如何编写移动设备取证报告的通用指南。关于包含内容的指南如下：\n\n*   提交检查的项目描述性列表，包括序列号、品牌和型号\n*\
  \   取证人员的身份和签名\n*   检查过程中使用的设备和设置\n*   检查期间采取步骤的简要描述，例如字符串搜索、图像搜索和恢复被删除的文件\n*  \
  \ 支持材料，例如特定证据项目的打印件、证据的数字副本和监管链文档\n*   发现详情：\n    *   与请求相关的特定文件\n    *   支持发现的其他文件，包括已删除的文件\n\
  \    *   字符串搜索、关键词搜索和文本字符串搜索\n    *   与相关的证据，例如网站流量分析、聊天日志、缓存文件、电子邮件和新闻组活动\n   \
  \ *   图像分析\n    *   所有权指示，可能包括程序注册数据\n    *   数据分析\n    *   被检查项目上相关程序的描述\n    *\
  \   用于隐藏或掩盖数据的技术，例如加密、隐写、隐藏属性、隐藏分区和文件名异常\n*   报告结论\n\n### SQLite\n\niPhone 和 Android\
  \ 均使用 `SQLite` 数据库。这些数据库通常以 `.db` 扩展。D. Richard Hipp 在 2000 年春天为通用动力公司为美国海军执行合同工作时设计了\
  \ `SQLite`。`SQLite` 不是一种客户端/服务器数据库引擎，而是被嵌入到终端程序中的。\n\n`SQLite` 是 Web 浏览器等应用程序中本地/客户端存储嵌入式数据库软件的流行选择。\n\
  \n`SQLite` 将整个数据库（定义、表、索引和数据本身）作为主机上的单文件跨平台文件存储。它通过在写入时锁定整个数据库文件来实现这种简单设计。`SQLite`\
  \ 的读取操作可以多任务处理，但写入操作只能顺序执行。\n\n`SQLite` 数据类型为：\n\n*   `NULL`：空值\n*   `INTEGER`：符号整数，根据数值的大小存储在\
  \ 1, 2, 3, 4, 6 或 8 字节中\n*   `REAL`：浮点数；8 字节 IEEE 浮点数\n*   `TEXT`：文本字符串，使用数据库编码（`UTF-8`、`UTF-16BE`\
  \ 或 `UTF-16LE`）存储\n*   `BLOB`：二进制大对象（blob），按输入时的原样存储\n\n如果你能够在手机上找到 `SQLite` 数据库并将其复制到你的取证机器，你将需要一个\
  \ `SQLite` 查看器。你可以从 [`sqlitebrowser.org/`](https://sqlitebrowser.org/) 免费下载 `SQLite`\
  \ 浏览器。这在 图 12-8 中所示。\n\n![图 12-8 SQLite 浏览器](img/9781284244496_CH12_FIGF08.jpg)\n\
  \n图 12-8 SQLite 浏览器。\n\n### iPhone\n\n存在破解 iPhone 密码的自动化过程。`XRY` 就是这样的工具，可以在 [`www.msab.com/products/xry/`](https://www.msab.com/products/xry/)\
  \ 获取。请记住，旧款 iPhone 只有四位数字 码，这意味着有 10,000 种可能的组合。\n\n\n\n\n\n1. 正确\n2. 错误\n\n2. 下列哪项是\
  \ 4G 标准？\n    1. EDGE\n    2. GSM\n    3. LTE\n    4. GSM4\n\n3. 漫游手机的数据存储在哪里？\n\
  \    1. VLR\n    2. HLR\n    3. BTS\n    4. GSM\n\n4. 设备从制造商处接收时均处于以下某种状态：\n   \
  \ 1. 休眠（dormant）\n    2. 萌芽（nascent）\n    3. 静止（quiescent）\n    4. 正常（normal）\n\n\
  5. 你正在对手机进行法证分析。你已尝试输入了 6 次 PUK，但都错了。这对 John 的调查意味着什么？\n    1. 手机现已恢复出厂设置，数据无法恢复。\n\
  \    2. 无影响；你可以根据需要不断尝试输入 PUK。\n    3. 无影响；你可以尝试 9 次 PUK，在第 10 次尝试时手机将恢复到出厂设置。\n\
  \    4. 手机已通过法证擦除。\n\n## 参考文献\n\n- 1. SIM 卡。(2014, 9 月 25 日)。Forensics Wiki。检索自\
