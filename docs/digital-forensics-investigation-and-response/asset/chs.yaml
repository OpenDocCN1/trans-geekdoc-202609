- "# 数字取证、调查与响应\n\n\n\n\n\n\n\n\n\n\n\n\n# 制作人员名单\n\n产品管理副总裁：Christine Emerton\n产品管理总监：Laura\
  \ Pagluica\n产品经理：Ned Hinman\n技术编辑：Jeffrey Parker\n内容策略师：Melissa Duffy\n内容策略师：Paula\
  \ Gregory\n项目经理：Kristen Rogers\n高级项目专员：Dan Stone\n数字项目专家：Rachel DiMaggio\n营销经理：Suzy\
  \ Balk\n产品履行经理：Wendy Kilborn\n排版：Straive\n封面设计：Briana Yates\n文字设计：Kristin E. Parker\n\
  内容服务经理：Colleen Lamy\n媒体开发编辑：Faith Brosnan\n权利与许可经理：John Rusk\n权利专家：Benjamin Roy\n\
  \n\n\n# 前言\n\n\n## 本书的目的\n\n本书是 Jones & Bartlett Learning 信息安全与保障系列的一部分，适用于信息安全、网络和信息安全课程。该系列包含了基础的信息安全原则，并提供了真实世界的应用和案例。由认证信息安全专家编写，这些书籍涵盖了该领域的最新且全面的信息。应急响应需要专业技能。本书从探讨取证的基础开始：什么是取证、计算机犯罪的挑战以及取证方法。第二部分探讨了用于执行取证的工具、技术和方法，包括收集证据、调查隐藏信息、恢复数据以及审查电子邮件。第三部分探讨了应急响应、新兴技术和未来方向以及额外的取证资源。\n\
  \n## 本版更新\n\n书中所有方面都已更新，包含了 Windows、Mac 和移动设备的最新变化。例如，第 8 章“Windows 取证”已扩展，包含了 `SRUM`、`BAM`\
  \ 和 `DAM` 注册表项。所有章节的更新包含了底层技术的变化、法律的变化以及新的案例研究。现在有一个关于内存取证的独立章节，第 14 章。第 15 章“新趋势”引入了智能电视取证的一般方法。\n\
  \n## 云实验室\n\n本文配有网络安全云实验室。这些实践虚拟实验室提供了沉浸式的模拟 IT 架构，学生可以在教科课程的基础上学习并实践基础网络安全技能。有关更多信息或购买实验室，请访问\
  \ `go.jblearning.com/forensics4e`。\n\n\n\n\n本书献给所有辛勤工作的法医学分析师，他们他们在刑事和民事案件中努力提取搜寻真相所需的证据。\n\
  \n# 关于作者\n\n\nChuck Easttom 博士是 32 本书的作者，其中包括多本关于计算机安全、法医学和密码学的著作。他还发表了关于数字法医学、网络战、机器学习、密码学和应用数学的科学论文。他也是一名发明家，拥有\
  \ 22 项计算机科学专利。他拥有网络安全科学博士（D.Sc.）、纳米技术博士、计算机科学博士，以及三个硕士学位（分别为应用计算机科学、教育学和系统工程）。他是\
  \ IEEE 和 ACM 的高级会员。他还是 ACM 的杰出演讲员和 IEEE 的杰出访问。\n\n他还持有 55 个行业认证，包括许多网络安全和数字法医学认证。他兼具学术和实战法医学鉴定经验。自\
  \ 2004 年以来，他一直担任美国法院案件的专家证人。他目前是乔治大学的兼职讲师，教授网络安全、系统工程和密码学；并担任达拉斯大学的兼职教授，教授数字法医学研究生课程。\n\
  \n\n\n\n# 第 1 章：法医学导论\n\n\n> 本章将向你介绍计算机法医学领域。它涵盖了某些法律问题、法医学过程的基本概念，以及对你将需要的的基础计算机和网络知识的回顾。本章为后续章节奠定了基础。在继续之前，熟练掌握本章内容至关重要。\n\
  \n## 什么是计算机法医学？\n\n在回答“什么是计算机法医学？”这个问题之前，你应该先回答“什么是法医学？”《美国遗传词典》将法医学（forensics）定义为“利用科学和技术在刑事或民事法院进行调查并确立事实”。\n\
  \n本质上，法医学是利用科学处理证据，以便你确立案件事实。所检查的单个案件可能是刑事的，也可能是民事的，但处理过程是相同的。证据必须以一致、科学的方式进行检查和处理。这是为了确保证据不被意外更改，并从这些证据中得出恰当的结论。\n\
  \n你可能看过某些犯罪剧，其中法医学技术是调查过程的一部分。在这些剧剧中，发现了一枚子弹，并利用法医学来确定是哪一把枪发射了子弹。或者可能发现了一滴血，并利用法医学将\
  \ DNA 与嫌疑人进行比对。这些都是法医学的有效方面。然而，我们的现代世界充满了具有数据存储能力的电子设备。以一致、科学的方式提取这些数据就是`计算机法医学`的主题。事实上，随着智能手机、智能手表和其他设备的普及，现在有些人将这一领域称为`数字法医学`（digital\
  \ forensics），强调了其中可能包含的广泛不同设备。\n\n美国计算机应急响应小组（US-CERT）对计算机法医学的定义如下：\n\n> 法医学是利用科学知识为法院收集、分析和呈述证据的过程……法医学主要处理潜在证据的恢复和分析。潜在证据可以以多种形式存在，从窗户上留下的指纹到从血迹中恢复的\
  \ DNA 证据，再到硬盘上的文件。\n\n根据“计算机法医学世界”网站：\n\n> 通常情况下，计算机法医学被认为是使用分析和调查技术来识别、收集、检查和保护磁性存储或编码的证据/信息。\n\
  \n计算机法医学（如果你愿意，也可以称为数字法医学）的目标是恢复、分析和呈现基于计算机的材料，使其能够作为法庭上的证据。在计算机法医学中，与任何其他法医学科学分支一样，重点必须放在证据的完整性和安全性上。法医学专家必须遵守严格的指南，并避免走捷径。\n\
  \n任何可以存储数据的设备都可能成为计算机法医学的对象。显然，这包括网络服务器、个人电脑和笔记本电脑等设备。然而，计算机法医学还涵盖了智能手机、路由器、平板电脑、打印机和全球定位系统（GPS）设备。记住，任何可以存储数据的设备都是计算机法医学的潜在对象。\n\
  \n尽管计算机法医学的主题以及使用的工具和技术与传统法医学（如 DNA 分析和弹道鉴定）有显著不同，但目标是相同的：获取可用于法律诉讼的证据。计算机法医学适用于典型\
  \ IT 基础设施的所有领域，从用户域、远程访问域到广域网（WAN）域和互联网域（参见图 1-1）。\n\n\n图 1-1 典型 IT 基础设施的七个域。\n\n\
  ### 利用科学知识\n\n考虑定义中的某些元素。特别是这句话：“法医学是利用科学知识为法院收集、分析和呈述证据的过程。”这每一个部分都至关重要，本章的后续章节将逐一进行探讨。\n\
  \n最重要的是，计算机法医学是一门科学。这并不是一个基于你的“直觉”或个人喜好的过程。理解并应用科学方法和过程至关重要。你具备相关科学的知识也非常重要。这意味着你必须拥有该领域的科学知识。计算机法医学从彻底理解计算机硬件开始。然后你需要理解运行在该设备上的操作系统；即使是手机和路由器也有操作系统。你必须至少了解计算机网络的基础。事实上，有人认为，目前法医学实践的一个问题是，太多人在没有足够的计算机背景的情况下想要进入该领域。考虑\
  \ DNA 法医学；如果你对生物化学、遗传学和相关学科没有坚实的实践知识，你就不会考虑尝试这种工作。数字法医学也是如此。在书中，除了为你提供具体的法医学技术和程序外，我的目标还将让你熟悉足够的计算机工作知识，以便你作为法医学鉴定员高效工作。\n\
  \n\n\n如果你尝试在没有这些基础知识的情况下掌握取证技术，不太可能成功。但如果你发现自己开始学习某门课程，但不确定自己是否具备所需的知识，不要恐慌。首先，你只需要具备计算机和计算机网络的基础知识。如果你在大学上过几门基础计算机课程，或者可能获得了\
  \ `CompTIA A+` 认证，你就拥有了基线知识。此外，在本章中你将对一些基本概念进行回顾。正如之前提到的，在我们阅读这本书的过程中，我们会根据需要为你提供技术细节。材料的呈现是假设你对计算机一无所知。这对于所有读者来说可能并不。如果你已经拥有丰富的计算机知识，那么可以将所呈现的技术材料视为回顾。\n\
  \n然而，你对计算机和网络了解得越多，你在计算机取证方面就会做得越好。没有所谓的“知得太多”了。尽管某些技术细节变化很快，例如硬盘的容量和材料，但其他细节的变化非常缓慢，甚至根本不变，例如各种文件系统、易性内存和非易性内存的作用，以及犯罪分子像商人、学生或房主一样，利用计算机和数字技术的进步来改善生活。计算机中存储着大量信息。继续学习那里存储了什么、存储在哪里，以及计算机用户和计算机犯罪分子如何使用这些信息。\n\
  \n### 收集\n在进行任何取证分析或检查之前，你必须收集证据。妥善收集证据有非常具体的程序。我们将在本章后半部分介绍一些通用指南。现在需要意识到，你收集证据的方式决定了该证据在法庭上是否具有法力。\n\
  \n### 分析\n数据分析是取证调查中最耗时的部分之一，也可能是挑战性最大的。一旦你收集了数据，它们意味着什么？平庸调查员和星级调查员之间的真正区别在于分析。数据在那里，但你知道它们意味着什么吗？这与你的科学知识水平也有。如果你了解得不够，可能看不到你所拥数据的意义。\n\
  \n你还必须能够解决谜题。从本质上说，任何取证调查都是如此。它是解决一个复杂的谜题——整合你拥有的数据并发现揭示了什么样的画面。你可以尝试像夏洛·福尔斯一样对待取证调查。观察每一个细节。它意味着什么？在得出结论之前，你有多少证据来支持该结论？对于这些数据，是否存在其他的、事实上是更好的解释？\n\
  \n### 陈述\n一旦你完成了调查、做了分析，并遵守了所有的规则和指南，你还有最后一步。你必须以某种形式陈述这些证据。两种最基本的形式是专家报告和专家证词。在任何一种情况下，你的工作都是用通俗易懂的语言来解释晦奥且看似不可逾越的技术信息，为法庭描出一幅准确的画面。你不能使用术语和技术黑话。你对语言的清晰使用，以及必要时可能使用的图表和演示，可能是大胜与败诉之间的区别。因此，你应该快速查看这些中的每一项。\n\
  \n## 专家报告\n`expert report` 是一份正式文件，列出了你进行了哪些测试、发现了什么以及你的结论。它还包括你的`curriculum vitae\
  \ (CV)`，它就像简历，但详细得多，并且针对你作为取证调查员的工作经验。具体的规则会因法庭而异，但作为一个一般原则，如果你没有在报告中列出某个特定主题，你就无法在审判中对其进行作词。因此，你需要确保你的报告是详尽的。将你使用的每一项测试、发现的每一件事以及你的结论都写进去。专家报告通常相当长。\n\
  \n支持你的结论也是重要的。根据一般原则，每个结论最好有二到三个参考文献。换句话说，除了你自己的意见外，你还希望有几个信誉良好的参考文献，它们要么同意该结论，要么为你如何得出该结论的过程提供支持。这样，你的结论不仅基于你的专家意见，还得到了其他信誉来源的支持。确保你使用信誉良好的来源。例如，`US-CERT`、`联邦调查局\
  \ (FBI)`、`美国特勤局 (U.S. Secret Service)` 和 `康奈大学法学院` 都是非常有信誉的来源。\n\n其是因为在每个法律案件中都有双方。对方会有一位律师，可能还有他们自己的专家。对方律师想要拆解你的每一个意见和结论。如果有对立专家，他或她将寻找数据的其他解释或你方法中的缺陷。你必须确保你已经充分支持了你的结论。\n\
  \n需要注意的是，报告的长度和详细程度各不相同。在许多情况下，刑事法院不会要求正式的专家报告，而是要求律师提供一份声明，说明你是谁以及你打算就哪些主题作证。你需要提交一份你的取证检查报告。在民事法庭中，特别是在知识产权案件中，专家报告要长得多、详细得多。在我的经验中，100\
  \ 页、200 页或更多的报告很常见。我见过的最大的超过 1500 页。\n\n虽然并非所有案件都会涉及完整、详尽的专家报告，但许多案件将会——特别是知识产权案件。关于专家报告编写的法律指南很少，但根据我的经验，几个问题已经变得清晰。让我们涵盖我多年处理法院案件中学到的知识。\n\
  \n专家报告通常从专家的资质开始。这应该是一个完整的 CV，详细说明教育、工作经历和出版物。应该特别关注专家背景与当前案件直接相关的元素。如果案件涉及 `Windows\
  \ Server 2019`，你相关的经验和培训是什么？如果你使用特定的取证工具或技术，你应该描述与该工具或技术相关的经验和培训。然后报告进入实际要处理的话题。专家报告是一份非常详尽的文件。它必须首先详细说明使用了什么分析：专家是如何进行检查和分析的？在计算机取证中，专家报告应该详细说明专家使用了哪些工具、结果是什么以及所进行测试的条件。你可能会好奇需要多少细节。答案很简单：足够的细节，以便任何胜任的取证分析师都能复制你的测试。此外，专家在报告中提出的任何声明都应该有外部良好来源的支持。专家有时会忽视这一点，因为他们本身就是被使用的来源，或者因为所提出的陈述对他们来说是显而易见的。例如，如果专家报告需要详细说明\
  \ `domain name service (DNS)` 如何工作以描述 `DNS poisoning attack`，那么应该有关于 `domain name\
  \ service` 细节的公认权威著作的引用。这之所以是因为在审判中，创意的律师往往可以从通常理解的术语中提取出非传统的含义。\n\n\n\n\n专家报告的另一个问题是其完整性。报告必须涵盖专家希望发表意见的每一项内容，并且要详尽描述。不能进行任何假设。在某些司法管辖区，如果某项内容未出现在专家报告中，那么专家在作证期间将不允许对其发表意见。无论在你所在的司法管辖区情况是否如此，提交的专家报告必须非常详尽且完整——而且，当然它必须准确无误。即使是最微小的错误，也可能给对方律师机会来质疑整个报告的准确性，以及专家的整个证词。这份文件应该由专家和聘请专家的律师进行仔细校对。\n\
  \n## 专家证词\n\n作为法庭专家，你将以专家证人的身份进行作证——也就是说，是基于你所拥有的与案件相关的科学或技术知识，而不是基于直接的个人经验。你的证词被称为专家证词，你将在两种场景下提供证词。第一种是取证（deposition），第二种是庭审（trial）。取证——指在庭审前从证人或案件当事人处获取的证词——形式不太正式，通常在律师的事务所进行。对方的律师可以向你提问。事实上，律师甚至可以问一些庭审法官可能会不允许的问题。但请记住，这仍然是宣誓证词，在宣誓下撒谎是伪证罪，这是一种重罪。\n\
  \n让我稍作详细说明一下伪证罪。说公然的谎言不仅是重罪，即使不引起刑事起诉，它也会摧毁你的声誉。法庭专家可以在技术性错误甚至是完全错误中生存下来，但你的职业生涯无法在谎言中生存。有些人试图掩饰一下真相——不是公然撒谎，而是闪烁其辞或试图改变答案以引向特定的方向。这对于法庭分析师来说是一个重大的错误。首先，你应该记住，你的目标不是赢得或输掉某场案件。你的目标是以法庭可以接受的方式呈现科学上有效的证据。如果你在调查中发现可能削弱雇佣你的人之案件的证据，那么你的责任是尽早通知他们。试图通过歪曲证词来掩盖这些证据并不是你的责任。许多人发现作证压力很大。我必须承认，我在前几次时也感到压力巨大。然而，我学到了一个秘密并将它传给你们：如果你工作做得非常详尽且完整，那么你只需要说实话即可。这完全没有压力。\n\
  \n美国联邦诉讼规则第 702 条定义了什么是专家以及什么是专家证词：\n\n“通过知识、技能、经验、培训或教育而被鉴定为专家的证人可以以意见或其他形式作证，前提是：\n\
  \n1.  专家的科学、技术或其他专业知识将有助于事实判定者理解证据或确定争议事实；\n2.  证词基于充分的事实或数据；\n3.  证词是可靠原则和方法的产物；且\n\
  4.  专家已将这些原则和方法可靠地应用于案件事实。”¹](#9781284244496_CH01_10.xhtml#c1-bib0001)\n\n这个定义非常有帮助。是的，你成为专家证人确实需要培训和经验。然而，无论你的资历如何，你得出的结论是否基于充分的事实和数据？你在形成结论时是否应用了可靠的科学原理和方法？这些问题应该引导你的法庭工作。\n\
  \n在取证期间，对方律师有几个目标。首要目标是尽可能了解关于你的立场、方法、结论，甚至是你一方的法律策略。事实上，律师可以向你问一些在现实中可能会被庭审法官不允许的问题。但请记住，最重要的是诚实且尽可能简短地回答。不要主动提供未被问及的信息。这只是为了让你为庭审做好更好的准备。律师在取证期间寻找的第二个目标是让你承诺某一个你之后可能无法辩护的立场。因此，请遵循以下规则：\n\
  \n*   如果你不完全理解问题，请说出来。在回答之前，要求对方澄清。\n*   如果你真的不知道，请说出来。永远不要猜测。现在，对方律师可能会试图让你对某些事感到尴尬——引导你给出答案。但事实是，不知道比猜测好。\n\
  *   如果你对某个答案没有 100% 的确定，请说出来。说“根据我目前的记忆”或类似的话。\n*   只要可能，请审阅任何提到的文件。重新读一遍你的报告和笔记。如果你那里有文件，请查阅它；不要凭记忆作证。\n\
  \n你作证的另一种方式是在庭审。你绝对理解的第一点是，第一次作证时你会很紧张。你会怀疑自己是否准备就当。你的结论正确吗？你遗漏了什么？不要担心，每次这样做都会变得容易。接下来，记住对方律师从定义上来说与你意见不合，并想绊你。提醒自己可能有帮助：“对方律师的默认立场我是无能且撒谎的。”这听起来很过，可能有些夸大。但如果你从这个假设出发，你就会对对方的问题做好准备。如果他们试图让你很难看，不要太生气。这不是针对个人的。\n\
  \n取证和庭审证词的秘密很简单：做好准备。你不仅应该确保你的法庭流程正确且记录良好（包括大量使用图表、图和其他图形），你还应该在作证前做好准备。再次过一遍你的报告。通常，你的律师会为你准备，特别是如果你从未作证过。尝试客观地查看你自己的报告，看看是否有对方律师可以利用的内容。\n\
  \n在法庭上最重要的事情是保持冷静并说实话。显然，任何谎言，即使是与你的调查直接无关的微小谎言，都是毁灭性的。但在法庭上变得激动或愤怒也会损害你的信誉。被问到问题时，直接回答。不要试图回避。\n\
  \n除了美国联邦诉讼规则第 702 条外，还有几条与庭审专家证词相关的其他美国联邦规则。在这里列出并进行简要描述。\n\n*   第 703 规则：专家的依据²](#9781284244496_CH01_10.xhtml#c1-bib0002）：专家可以基于其获知或亲自观察的事实或数据发表意见。如果特定领域的专家在就主题形成意见时会合理依赖此类事实或数据，则这些数据不需要具有可采性即可被采纳意见。但如果这些事实或数据在其他情况下不可采纳，那么意见的提出方只有在它们的证明价值——即它们在帮助陪审团评估该意见方面的权重——远大于其偏见影响时，才能向陪审团披露。\n\
  \n\n\n\n- `Rule 704`: 关于最终问题的意见：意见不会仅仅因为涉及最终问题而具有可异议性。换句话说，专家证人在许多情况下可以就案件的最终问题提供证意见。\n\
  - `Rule 705`: 披露专家基础事实或数据：除非法院另有规定，否则专家可以陈述意见并给出理由，而无需先对基础事实或数据进行证言。但专家可能被要求在交叉询问时披露这些事实或数据。本质上讲，专家可以在不先提供基础事实的情况下陈述其意见，但他应该预料会在某个时候就这些事实接受提问。\n\
  - `Rule 706`: 法院指定的专家证人：本规则涵盖了为法院提供建议的中立专家的任命。此类专家既不为原告工作也不为被告工作；他们为法院工作。\n- `Rule\
  \ 401`: 相关证据的判定标准：如果满足以下条件，则证据具有相关性：(a) 它于使某一事实的可能性比没有该证据时更高或更低，且 (b) 该事实在确定诉讼中具有重要意义。\n\
  \n## 理解数字取证领域\n\n数字取证领域的变化非常迅速。首先，标准正在涌现。这意味着已经有了明确定义的方法来正确进行取证。当计算机取证刚开始时，大多数调查是根据调查人员的主观想法进行的，而不是通过标准化的方法论。但随着该领域的成熟，它也变得标准化。今天，已经有了明确的、法典化的取证检查方法。\n\
  \n另一个变化是进行取证的人。曾几何时所有的取证（包括计算机取证）都是执法部门的专属领域。现在已不再如此。今天，以下实体也参与并积极使用计算机取证：\n\n-\
  \ 军使用数字取证从军事行动中缴获的计算机中收集情报。\n- 政府机构使用数字取证调查涉及计算机。这些机构包括联邦调查局（FBI）、美国邮政检查局、联邦贸易委员会（FTC）、美国食品食品药品管理局（FDA）和美国特勤局。他们还包括美国司法部国家司法学院（NIJ）、美国国家标准与技术研究院（NIST）执法标准办公室（OLES）、国土安全部以及外国政府机构等。\n\
  - 律师事务所需要经验丰富的系统取证人员来进行调查并作为专家证人作证。例如，民事案件可以使用计算机系统中发现的记录，这些记录涉及涉及欺诈、离婚、歧视和骚扰的案件。\n\
  - 刑事检察官在处理定罪文件时使用数字证据。他们试图将这些文件与毒品交易、挪用、金融欺诈等犯罪联系起来。\n- 学术界参与了数字取证。例如，大学提供刑事司法学位。\n\
  - 数据恢复公司使用数字取证在硬件或软件故障后恢复数据。\n- 企业使用数字取证协助起诉。他们还需要寻找未经授权将设备用作计算机、传真机、答录机和手机的证据。\n\
  - 保险公司使用关于火灾和工伤赔偿的数字证据。\n- 个人有时会聘请取证专家来支持索赔。这些案件可能包括不当终止和年龄歧视。\n\n### 什么是数字证据？\n\
  \n信息包括原始数字、图片以及大量其他可能与某事件相关或不相关的数据。`Digital evidence` 是的是经过处理和组装的信息，使其与调查相关并支持特定的发现结果。换句话说，所有的原始信息本身并不是证据。数据必须首先与案件相关，才能成为证据。\n\
  \n调查人员必须仔细展示完整的监管链（chain of custody），以证明证据已免受篡改。`chain of custody` 是对证据控制的连续性，使得能够解释证据从原始收集到在法庭上出现之间发生的所有情况，且最好是未被更改过的。如果取证专家不能证明他们维护了监管链，那么法院可能会认为所有结论无效。\n\
  \n法院处理四种证据：\n\n- `Real evidence`: 物证是人们可以触摸、持有或直接观察的实体。物证的例子包括带有嫌疑人指纹的笔记本电脑、硬盘、通用串行总（USB）驱动器和手写笔记。\n\
  - `Documentary evidence`: 书证证据是以书面形式存储在纸上或电子文件中的数据。书证包括内存数据和计算机文件。例如电子邮件、日志、数据库、照片和电话详细记录。调查人员必须对书证进行身份认证——即证明它是真实的且不是在事后创建的。\n\
  - `Testimonial evidence`: 证言是取证专家用于支持或解释物证或书证的信息。例如，他们可能利用证言来证明键盘上的指纹属于特定个人。或者系统访问控制可能显示特定用户将特定照片存储在桌面上。\n\
  \n\n\n\n\n- `Demonstrative` 证据是指有助于解释其他证据（任何其他证据）的信息。这可能是证词证据、书证证据或实物证据。例如，一个向法官和陪审团解释技术概念的图表。法证专家通常必须提供证言以支持其分析结论。例如，事件响应小组的成员可能被要求作证，证明他或她识别出了在特定日期和时间删除了客户记录的计算机程序。在这种情况下，证言必须显示调查人员是如何得出结论的。证言还必须显示专家已防止了做出判定时所用信息免受篡改。也就是说，证言必须显示法证调查人员维护了证据链。它还必须显示证人得出结论是基于对信息的合理（但不一定绝对）的解释。此外，法证专家在陈述证言时必须避免使用技术术语和复杂的技术讨论的方式进行陈述，并且在有帮助时应使用图片、图表和其他图形。法官、陪审团和律师并不都是技术专家。因此，法证专家应该将技术转化为易于理解的描述。图片往往比单纯的数字和文字更好地传递信息，因此法证专家可能想要创建图表和图形。\n\
  \n## 系统取证面临范围挑战\n\n取证工作的范围往往不仅是一个分析挑战，也是一个心理上的挑战。信息系统收集并保留大量数据。它们以眼花缭乱的应用程序、格式和硬件组件存储这些数据。在完成分析时，法证专家面临以下变数：\n\
  \n* 待分析的数据量\n* 计算机系统的复杂性\n* 犯罪现场的大小和特征，可能涉及跨越美国和外国司法管辖区的网络\n* 案件量的大小和资源限制\n\n法证专家必须准备好无论这些因素如何都能快速完成分析。接下来的章节将详细讨论这些因素。\n\
  \n## 大量数据\n\n数字取证在识别和记录证据方面有用。它是一种严谨的方法，通过查看整个物理介质（如硬盘驱动器）来寻找所有的信息表示。系统取证专家可以访问设备上包含的所有信息——而不仅仅是用户看到的内容。法证分析师还会检查元数据，即关于信息的数据，例如磁盘分区结构和文件表。元数据还包括文件的创建和修改时间。谁编写了文件以及文件何时被修订或更新，也是法证分析师需要记录的重要元数据。分析师还会检查介质中通常是关键的未使用区域，信息可能隐藏在那里。检查所有潜在的数据存储区域和检查所有潜在的数据表示会产生海量信息。法证专家必须在整个调查和分析期间对所有这些信息进行分析、存储和控制。\n\
  \n案件可能相关的信息总量给法证分析师带来了挑战。今天，远超 1 TB 的硬盘已经非常常见。事实上，人们可以在任何电子商店以低于 120 美元的价格买到 4 TB\
  \ 或 5 TB 的硬盘。在编写这本书的第四版时，我只花 180 美元买了一个 10 TB 的外硬盘。容量不断增加，价格不断下降。在处理此类大量数据时，法证专家必须做到：\n\
  \n* 确保其设备能够快速处理大量信息。\n* 提供副本存储，以保护原始介质及其驻留信息，免受篡改和其他损坏。\n* 尽早且频繁创建备份，以丢失实际信息及其相关元数据。\n\
  * 记录调查中执行的所有操作并维护证据链。\n\n这些这些任务外，法证专家必须在取证预算内工作。处理和控制大量信息是昂贵的。调查人员应该说明预算成本项目如何对分析以及维护证据链做出贡献。资源限制增加了分析错误的可能性，并可能损害分析。例如，法证分析师可能需要解释增加数据保管员或额外的硬盘如何使成本成倍增加。\n\
  \n## 系统复杂性\n\n现代计算机系统可能极其复杂。这不仅仅是上述存储大小的问题，而是广泛的数据和格式。数字设备使用多种文件格式，包括 Adobe 便携式文档格式\
  \ (`PDF`) 文件、Microsoft Word (`DOC` 和 `DOCX`) 文档、Microsoft Excel 表格（`XLS`）、视频文件（`MP4`、`AVI`、`MOV`\
  \ 等）以及图像文件（`JPEG`、`GIF`、`BMP`、`PNG` 等），这仅是其中的。这甚至还没有考虑到“运动中”的信息格式，如 IP 电话 (`VoIP`)、即时消息协议、实时视频或双向会议。这些系统与位于世界任何地方系统连接并共享数据。此外，法律可能保护某些项目而非其他项目。没有单一软件可以处理所有的复杂性。\n\
  \n法证专家必须使用一套软件和硬件工具以及手动程序。此外，法证专家必须为他们对分析的信息所构建的“故事”的解释建立支持。因此，专家必须理解所有数字信息及其相关技术。专家还应该能够提供符合法律证据测试的佐证。具体的法律测试可能根据地点和司法管辖区而异。有一些基础测试适用于所有地方，但证据链和\
  \ `Daubert` 标准（两者在本章中都有讨论）几乎是通用的。\n\n单个信息可能有多种可能的解释。\n\n## 分布式犯罪现场\n\n\n\n\n由于网络在地理上是分散的，犯罪现场也可能在地理上分散。这不仅带来了实际操作问题，也带来了管辖权问题。例如，考虑到美国调查员想要从中国的计算机中获取证据是多么困难。犯罪分子利用了管辖权的差异。犯罪分子可能从国外通过互联网向美国几个州的美国出售虚假商品。然后，该分子在到达最终目的地之前，将其互联网访问及相关的电子支付路由到其他几个国家。\n\
  \n数字犯罪现场可以跨越全球，而且日益如此。根据系统连接类型和所采取的控制措施，取证专家可能必须处理存储在世界的信息，且这些信息通常不是英语。这可能涉及数千台设备和网络日志。网络和集中式存储也带来了挑战，因为感兴趣的物品可能并未存储在目标计算机上。\n\
  \n从这种地理位置遥远的数字犯罪现场收集证据，需要地方、州和部落政府，有时甚至是多个国家政府以及国际机构的合作，以追踪犯罪分子并将他们归于法治。如果所有政府和机构不相互配合，调查可能会失败。\n\
  \n### 日益增长的案件量和有限的资源\n\n如今取证专家的人数太少，无法分析所有的网络犯罪。无论经济状况如何，数字取证专家可以确定两点：他们的案件量将增长，而相对于案件量，他们的资源将变得更加有限。执法部门中任何从事数字犯罪的人员都有案件积压，这是一个基本事实，而且这种积压正在增加。\n\
  \n随着计算机及相关数字设备在犯罪实施中使用越来越多且方式多样化，数字取证分析的工作量正在增长并将继续增长。驱动这一增长的动力是技术在现代生活各个领域的日益普及，而不仅仅是为了支持业务目标。犯罪分子利用技术不仅实施犯罪，在某些情况下还隐藏证据。取证工具也可以被犯罪分子用于消除证据，就像调查员使用它们来定位、分析和分类证据一样简单。\n\
  \n### 数字系统取证分析的类型\n\n今天，数字系统取证包括许多专业。以下是一些示例：\n\n*   `磁盘取证`是获取和分析存储在物理存储介质（如计算机硬盘、智能手机、GPS\
  \ 系统和可移动介质）上的信息的过程。磁盘取证包括对隐藏和删除信息的恢复，以及识别谁创建了文件或消息的过程。\n\n*   `邮件取证`是对作为证据的邮件来源和内容的研究。邮件取证包括识别邮件信息的发送者、接收者、日期、时间和起始位置的过程。你可以使用邮件取证来识别骚扰、歧视或未经授权的活动。还有针对特定领域（如金融和医疗）的邮件保留和存储的专门法律。\n\
  \n*   `网络取证`是检查网络流量的过程，包括使用嗅探器和追踪技术对交易日志进行实时监控。\n\n*   `互联网取证`是拼凑用户何时何地访问过互联网的过程。例如，你可以使用互联网取证来确定访问和下载不当的网络内容是否是无意发生的。\n\
  \n*   `软件取证`也称为恶意软件取证，是检查恶意计算机代码的过程。\n\n*   `现场系统取证`是实时搜索内存的过程，通常用于处理受攻击的主机或识别系统滥用。这些每种类型的取证分析都需要专业的技能和培训。\n\
  \n*   `手机取证`是搜索手机内容的过程。几年前这还并不是一个大问题，但随着如今手机的无处不在，手机取证是一个非常重要的话题。手机可以是证据的宝库。现代手机本质上带有处理器、内存、甚至硬盘和操作系统的计算机，并且它们在网络上运行。手机取证还包括\
  \ VoIP 和传统电话，并可能与美国的《1978 年外国情报监视法》（`FISA`）、《美国爱国者法案》和《执法协助法》（`CALEA`）交叉。\n\n###\
  \ 通用指南\n\n在本章的后面，你将读到特定的联邦指南，但在进行任何取证工作时，你应该记住几个通用原则，正如后续章节所述。\n\n### 监管链\n\n这是任何取证工作（无论是数字还是非数字）中最重要的原则。必须维持物理监管链。从证据首次被执法人员或民事调查员提取的刻直到在法庭上展示的刻，证据的去向、保管情况、如何处理和存储以及由谁处理，必须能够随时说明。未能维持适当的监管链会导致证据在审判中被排除。\n\
  \n### 不要接触嫌疑硬盘\n\n一个非常重要的原则是尽可能少接触系统。在检查系统的过程中可能会对系统进行更改，这是非常不可理想的。显然，你必须与系统交互以进行调查。答案是制作取证副本并对该副本进行工作。你可以使用主要的取证工具如\
  \ `AccessData’s Forensic Toolkit`、`Guidance Software’s EnCase` 或 `PassMark’s OSForensics`\
  \ 来制作取证副本。也有允许复制信息的开源软件产品。具体来说，制作一个副本并分析该副本。\n\n有时你需要直接与现场证据交互。例如，当发现一台计算机时，你会在制作镜像之前进行初始分析，以确定运行的进程和连接。你可能还需要某些情况下（如某些云计算环境）进行现场取证。我们将在书中遇到这些情况时进行讨论。\n\
  \n### 文档追踪\n\n下一个问题是记录。规则是记录一切。设备被提取时谁在场？在你提取设备时，设备上连接了什么或屏幕上显示了什么？你使用了哪些具体的工具和技术？从提取到审判期间谁有权接触证据？所有这些都必须记录在案。当有疑问时，宁可过度记录。关于调查的信息，记录得太多实际上是不可能的。\n\
  \n### 保护证据\n\n对于你调查的完整性以及维持监管链来说，确保证据的安全是至关重要的。取证实验室是一个上锁的房间是情常的，访问权限只开放给必须进入的人员。然后，证据通常保存在保险箱内，仅根据知情需要开放访问权限。你必须采取一切合理的措施，确保无人能篡改证据。\n\
  \n计算机取证分析所需的知识\n\n\n\n\n进行计算机取证需要一定的背景知识，这与传统法医学是一样的。例如，如果你没有血液和遗传学方面的基础知识，就无法进行\
  \ DNA 检查。计算机取证也是如此。你必须对正在检查的系统有理解，才能成功地对其进行检查。\n\n本章假设你对计算机硬件、软件和操作系统有基本的了解。然而，本节将简要讨论你需要了解的这些领域的亮点。如果你发现自己在一个或多个领域存在欠缺，在继续之前，你应该花些时间复习这些主题。对于许多读者来说，这些内容将是复习；而对其他人来说，某些信息可能是全新的。如果这对你来说是新信息，请记住，这只是最基本的知识。你对底层技术了解得越多，你的效率就越高。\n\
  \n## 硬件\n\n通常，优秀的数字取证员首先对他们想要检查的设备硬件具有性知识。对于 PC 和笔记本电脑，这包括等同于 `CompTIA A+` 认证或基础\
  \ PC 硬件课程的知识。如果你正在进行手机或路由器取证，你需要对这些设备的硬件具备类似水平的知识。\n\n对于 PC，这意味着对硬盘、内存、主板和扩展卡有深入的理解。究竟什么是“深入理解”？想想随机存取内存（`RAM`）。你可能知道\
  \ `RAM` 是易失性内存，它存储你当前打开的程序和数据，但仅限于计算机供电的时间内。然而，这种程度的知识对于取证是不够的。取证员需要深入得得多，理解各种类型的\
  \ `RAM`、它们的工作原理、每种内存包含的信息类型，以及计算机如何使用它们。\n\n### 随机存取内存\n\n`RAM` 可以通过多种方式进行检查。一种方法是观察信息写入和从\
  \ `RAM` 中读取的方法。这些方法按照从旧到新的技术顺序列出：\n\n* 扩展数据动态随机存取存储器 (`EDO DRAM`)——单周期 `EDO` 能够在一个时钟周期内完成一次内存事务。否则，一旦选定页面，同一页内的每次顺序\
  \ `RAM` 访问将需要两个时钟周期，而不是三个。\n\n* 突发性 `EDO` (`BEDO`) `DRAM`——作为 `EDO` 的演进，突发性 `EDO\
  \ DRAM` 可以在一次突发传输中处理四个内存地址。\n\n* 异步动态随机存取存储器 (`ADRAM`)——`ADRAM` 未与 CPU 时钟同步。\n\n\
  * 同步动态随机存取存储器 (`SDRAM`)——`SDRAM` 是 `EDO` 的替代品。\n\n* 双倍数据速率 (`DDR`) `SDRAM`——`DDR\
  \ SDRAM` 是 `SDRAM` 的后期发展版本。现在已有 `DDR2`、`DDR3` 和 `DDR4`。在本书期间，`DDR 5` 仍在开发中，但应该在\
  \ 2021 年秋季上市。\n\n`SDRAM` 特别 `DDR3` 和 `DDR4` 是 PC 和笔记本电脑中最常见的 `RAM` 形式。\n\n另一种查看\
  \ `RAM` 的方法（而且从取证角度来看特别重要）是考虑存储数据的易失性。易失性是指数据多容易被有意或无意地改变：\n\n* 随机存取内存 (`RAM`）——`RAM`\
  \ 是大多数人想到的东西。\n\n* 只读存储器 (`ROM`）——顾其名，它不能被更改。\n\n* 可编程只读存储器 (`PROM`)——`PROM` 可以被编程一次。\n\
  \n* 电学可擦除只读存储器 (`EEPROM`)——`EEPROM` 可以被擦除。\n\n### 硬盘\n\n取证员还必须理解以下内容：\n\n* 小型计算机接口\
  \ (`SCSI`)——这种标准较老。\n\n* 集成式驱动器电子 (`IDE`)——这比较老。\n\n* 增强型集成式驱动器电子 (`EIDE`)——`IDE`\
  \ 的扩展。\n\n* 并行技术 (`PATA`)——`PATA` 是你最可能在 40 针连接器上发现的。\n\n* 串行接口 (`SATA`)——`SATA`\
  \ 正在变得常见。\n\n* 固态硬盘 (`SSD`)——`SSD` 使用微芯片，不包含移动部件。\n\n\n\n\n这是大多数硬盘（固态硬盘除外）的基本描述。法医鉴定人员应该了解以下术语，这些术语适用于所有硬盘，包括固态硬盘（注意尽管固态硬盘和传统硬盘的结构不同，但这些术语是相同的）：\n\
  \n*   空空间 (Slack space) 是文件末尾与簇尾之间的空间，假设文件没有占用整个簇。这种空间可以用来隐藏数据。讨论空空间引出了我们一个关于 SSD\
  \ 的问题。对于 SSD，使用了一种名为 `wear leveling`（磨损均衡）的技术来延长硬盘寿命。问题在于 SSD 使用的闪存（以及相关技术）其具有独立的分段（而非扇区）。每个分段在变得不可靠之前都有有限的擦除次数。因此，`wear\
  \ leveling` 通过分散 SSD 的使用来避免这个问题。这意味着空空间在 SSD 上并不特别有用。\n\n*   低级格式化 (Low-level format)\
  \ 创建扇区、轨道和簇的结构。\n\n*   高级级格式化 (High-level format) 在磁盘上设置空文件系统并安装启动扇的过程。这有时被称为快速格式化。\n\
  \n需要注意的是，SSD 已成为最常见的。最初，它们主要用于外部驱动器和笔记本电脑。然而，SSD 的使用正在不断增长。因此，你应该预期会经常看到它们。\n\n\
  ## 软件\n\n一旦你对硬件有了基本的了解，下一步就是学习软件，这从操作系统开始。你必须对想要检查的设备上运行的操作系统有深厚的实操知识。\n\n### Windows\n\
  \n关于 Windows 有很多需要了解的内容，但目前这里有一个工作原理的基本概述。Windows 的核心是 `Windows Registry`（Windows\
  \ 注册表）。本质是 Windows 所有设置、软件和参数的存储库。如果安装了新软件，`Registry` 就会更新以指示新软件。如果更改了桌面背景颜色，`Registry`\
  \ 就会更新以指示新颜色。通过此 `Registry`，你可以获取各种信息，包括无线网络的密码和连接到该计算机的所有 USB 设备的序列号。从技术支持和法医调查的角度来看，这确实是\
  \ Windows 最重要的部分。\n\nWindows 还有其他寻找法医证据的有趣地方。某些文件夹和文件——例如 `index.dat` 文件——是寻找证据的好地方。即使是浏览器\
  \ Cookie 和历史记录也可能有用。鉴于 Windows 是如此常见的操作系统，建议非常熟悉 Windows。\n\n### Linux\n\n从法医调查的角度来看，Linux\
  \ 特别有趣。尽管它不像 Windows 那么被广泛使用，但它是安全和法医鉴定社区的宠爱。你会发现许多免费的法医工具随 Linux 提供。事实上，一种名为 `Kali\
  \ Linux` 的特定 Linux 发行版（2013 年以前名为 `BackTrack`）拥有丰富的法医、安全和黑客工具集。\n\n从法医调查的角度来看，Linux\
  \ 特别有趣。尽管它不像 Windows 那么被广泛使用，但它是安全和法医鉴定社区的宠爱。你会发现许多免费的法医工具随 Linux 提供。事实上，一种名为 `Kali\
  \ Linux` 的特定 Linux 发行版（2013 年以前名为 `BackTrack`）拥有丰富的法医、安全和黑客工具集。\n\n### Mac OS\n\n\
  多年来，`Macintosh`（目前品牌为 `macOS`）一直是该操作系统。然而，从 `OS X` 开始，系统基于 `FreeBSD`。`OS X` 是由 Linus\
  \ Torvalds 开发的类 Unix 系统。\n\n## 文件和文件系统\n\n计算机上的文件是根据文件系统组织起来。有很多文件系统，但它们可以分为两类。日志记录（Journaling）基本上是文件系统记录发生了哪些哪些文件事务的过程，以便在硬盘崩溃时可以恢复文件。日志记录文件系统具有容错性，因为文件系统会记录所有文件的更改。记录更改的日志被称为文件系统日志。\n\
  \n实际上有两种类型的日志记录：物理日志和逻辑日志。在物理日志记录中，系统会在数据写入存储设备之前，记录其即将写入的每个块的副本。日志还包括这些块的校验和，以确保在写入块时没有错误。在逻辑日志记录中，只有对文件元数据的更改被存储在日志中。\n\
  \n以下是一些特定的文件系统：\n\n-   文件分配表 (FAT) 是一种较旧的系统，多年来在微软操作系统中非常流行。`FAT` 首次在 Microsoft\
  \ Standalone Disk BASIC 中实现。`FAT` 通过一个名为文件分配表的文件按扇区存储文件位置。该表包含关于哪些簇正被哪些特定文件使用以及哪些簇可以空闲使用的信息。`FAT`\
  \ 的各种扩展（如 `FAT16` 和 `FAT32`）的区别在于文件名可用的位数。\n\n新技术文件系统 (`NTFS`) 是由微软于 1993 年引入的，作为新的文件系统来取代\
  \ `FAT`。这是 `Windows NT 4`、`2000`、`XP`、`Vista`、`7`、`Server 2003` 和 `Server 2008`\
  \ 使用的文件系统。`NTFS` 相比 `FAT` 的一个主要改进是支持更大的卷大小。`NTFS` 最大卷值为 `2⁶⁴ – 1` 个簇。我们将在本书后讨论 Windows\
  \ 法医调查时更详细地讨论 `NTFS`。\n\n\n\n\n\n- `ReFS` 或称为弹性文件系统（Resilient File System），是微软的一种新型文件系统。它适用于\
  \ Windows Server 2019，但并不在 Windows 10 中。正如其名所示，它本质上是一个更具韧性的文件系统。这是通过多种技术实现的，包括针对元数据和文件数据的校验和，以及主动错误纠正。你可以在微软的在线文档中了解更多信息（[`docs.microsoft.com/en-us/windows-server/storage/refs/refs-overview`](https://docs.microsoft.com/en-us/windows-server/storage/refs/refs-overview)）。\n\
  - `Apple File System (APFS)` 是使用 Mac OS 10.13 的 Apple 电脑的默认文件系统。`APFS` 支持加密、快照和其他功能。它针对固态硬盘的使用进行了优化，但也可以用于传统的硬盘。\n\
  - `Extended file system`（扩展文件系统）是第一个专门为 Linux 创建的文件系统。`EXT` 有许多版本；当前版本是 `4`。`EXT4`\
  \ 文件系统可以支持大小可达 1 艾字节（`10¹⁸` 字节，或 10 亿 GB）的卷，以及大小可达 16 TB 的的文件。这是一个巨大的文件和卷大小，目前没有任何硬盘的容量能达到这个卷大小。对于管理员来说，`EXT4`\
  \ 最令人兴奋的功能之一是与 `EXT2` 和 `EXT3` 向后兼容，使得挂载使用这些早期 `EXT` 版本的驱动成为可能。\n- `ReiserFS` 是一种流行的日志文件系统，主要用于\
  \ Linux。`ReiserFS` 是第一个包含在标准 Linux 内核的文件系统，首次出现在内核版本 `2.4.1`。与某些文件系统不同，`ReiserFS`\
  \ 从诞生之初就支持日志记录，而 `EXT` 直到版本 `3` 才开始支持日志记录。`ReiserFS` 是开源的，由 Hans Reiser 发明。\n- `Berkeley\
  \ Fast File System`（伯克利快速文件系统）也被称为 `UNIX` 文件系统。正如其名所示，它是在加利福尼亚大学伯克利分校专门为 `UNIX`\
  \ 开发的。与许多文件系统一样，`Berkeley` 使用位图来跟踪空闲簇，指示哪些簇是可用的，哪些是不可用的。像 `EXT` 一样，`Berkeley` 包含了\
  \ `FSCK` 工具。这只是 `Berkeley` 和 `EXT` 许多相似之处之一。事实上，有些来源认为 `EXT` 仅仅是 `Berkeley Fast\
  \ File System` 的变体。\n\n## 网络\n\n数字取证像所有网络安全分支一样，将信息分为两类：静态数据和动态数据。静态数据包括存储在计算机内部的任何内容，包括文件系统或内存中的内容。动态数据是在端点之间传输的信息，包括传输所需的协议和其他信息。跨网络的信息传输和所使用的网络组件构成了一个庞大且快速变化的领域。然而，如果想将动态数据视为调查人员的技能组合，现代取证调查人员必须非常熟悉这些组件及其工作原理，以及协议及其操作。\n\
