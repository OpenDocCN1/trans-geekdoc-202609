  \n\n\n\n人们从电脑中删除文件是常见现象。这并不一定意味着某种恶意意图；它可能仅仅是删除不再需要的文件。这是一项轻而易举的任务——而技术上不太专业的犯罪分子认为，删除文件可以防止执法部门发现它。因此，你应该预料，在你检查的电脑中，经常会有证据被删除的情况。正因如此，法医取证调查员将执行的最基础任务之一就是检索被删除的数据。\n\
  \n本章不会深入探讨三个主流操作系统——`Windows`、`Linux` 和 `Mac OS` 的细节。相反，重点仅放在从这些系统中恢复文件上。书中涵盖了关于每个操作系统的文件系统与文件删除及恢复相关的足够信息。\n\
  \n## 文件系统与硬盘\n\n让我们从讨论传统硬盘开始。这些是使用磁性盘片通过磁性方式存储数据的驱动器。虽然固态硬盘（SSD）正变得越来越常见，但传统硬盘在个人电脑和服务器中依然随可见。它们在笔记本电脑中较少见，在平板电脑上则完全不使用。硬盘以扇区（sector）为单位存储数据。多年来，许多硬盘的扇区大小为\
  \ 512 字节；然而，现代硬盘使用所谓的高级格式（Advanced Format），其扇区为 4096 字节。扇区本质上是磁盘上的一个区域。在磁盘上，扇区是连续的。硬盘以扇区形式存储数据。对于许多年来说，典型的扇区是\
  \ 512 字节，但现代硬盘使用 4096 字节的扇区。扇区在磁盘上被簇（cluster）定义。文件系统在文件删除和恢复方面的关系，如 图 6-1 所示，展示了簇与扇区之间的关系。\n\
  \n![图 6-1 簇与扇区](img/178128244496_06_01.jpg)\n\n### Windows\n\n`Windows` 是一个非常常见的操作系统。事实上，在\
  \ `Windows` 中删除文件是常有的事。而技术上不太专业的犯罪分子认为，删除文件可以防止执法部门发现它。因此，你应该预料，在你检查的电脑中，经常会有证据被删除的情况。正因如此，法医取证调查员将执行的最基础任务之一就是检索被删除的数据。\n\
  \n本章不会深入探讨三个主流操作系统——`Windows`、`Linux` 和 `Mac OS` 的细节。相反，重点仅放在从这些系统中恢复文件上。书中涵盖了关于每个操作系统的文件系统与文件删除及恢复相关的足够信息。\n\
