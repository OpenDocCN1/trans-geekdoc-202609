  \ 4 行：show users。第 5 行：show logging。第 6 行：show ip interface。第 7 行：show interfaces。第\
  \ 8 行：show t c p brief all。第 9 行：show ip sockets。第 10 行：show ip nat translations\
  \ verbose。第 11 行：show ip cache flow。第 12 行：show ip cef。第 13 行：show s n m p user。第\
  \ 14 行：show s n m p group。](img/9781284244496_CH13_06_UNNUN02.jpg)\n\nCisco IOS（操作系统）11.2\
  \ 版本的发布引入了新命令 `show tech-support`。该命令允许通过单个命令收集有关路由器的多个源信息。这一个命令输出的数据与运行所有以下命令的结果相同：\n\
  \n![程序代码。在代码中，变量名中的单词已合并。第 1 行：show version。第 2 行：show running, hyphen, config。第\
  \ 3 行：show stacks。第 4 行：show interface。第 5 行：show controller。第 6 行：show process\
  \ c p u。第 7 行：show process memory。第 8 行：show buffers。](img/9781284244496_CH13_06_UNNUN03.jpg)\n\
  \n对于寻找更深入信息的读者，以下内容可能感兴趣：\n\n## 防火墙取证\n\n检查防火墙应该是任何网络取证的基础部分。由于所有外部流量都必须经过防火墙，因此仔细检查防火墙日志至关重要。它们经常包含宝贵的证据。\n\
  \n### 防火墙基础\n\n在深入研究防火墙取证之前，你应该确保你对防火墙有基本的理解。防火墙有几种分类方法，但有两种比其他的更基础。\n\n### 数据包过滤\n\
  \n这是最基础的防火墙类型。它简单地过滤入站数据包并根据配置的一组规则允许或拒绝进入。包过滤器也称为筛选防火墙。它可以根据数据包大小、使用的协议、源 IP 地址等过滤数据包。许多路由器在正常路由功能之外提供这种防火墙选项。\n\
  \n### 状态检测包检测\n\n状态包检测（SPI）防火墙将检查每一个数据包，不仅根据当前数据包，还根据对话中之前的包来拒绝或允许。这意味着防火墙感知特定包发送时的上下文。这使得防火墙极不容易受到\
  \ SYN 洪水和欺骗的影响。\n\n### 数据收集\n\n所有通过防火墙的流量都是连接的一部分。连接由两个相互通信的 IP 地址以及识别协议或服务的端口号组成。IP\
  \ 地址和端口号的拼接称为套接字，在激活期间是唯一的。端口号的三个范围是：\n\n*   已知端口——已知端口范围为 0 到 1023。\n*   注册端口——注册端口范围为\
  \ 1024 到 49151。\n*   动态端口——动态或私有端口范围为 49152 到 65535。\n\n\n\n\n\n从许多不同的互联网源对同一组端口进行尝试通常是由于“诱骗”扫描（decoy\
  \ scans）。在诱骗扫描策略中，攻击者伪造成来自大量诱骗机器的扫描，并将自己的 IP 地址插入到这些流量中的某个位置。\n\n在本章的早些部分，你看到了一个常用端口列表。你应该仔细检查防火墙日志，查看这些端口上是否存在任何类型的连接或尝试连接。你还学习了可能指示端口扫描的数据包标志（packet\
  \ flags）。如果你的防火墙记录了此类详情，你将需要扫描日志以查找任何可能指示扫描的数据包。\n\n使用协议分析可能帮助你确定攻击者是谁。例如，你可以对每个系统\
  \ `ping`，并将响应中的存活时间（`TTL`）字段与连接尝试进行匹配。`TTL` 本身实际上不是时间，而是源和目的地之间的路由器数量。`TTLs` 应该是匹配的，允许差一或两个，以防路由略有不同。如果捕获的流量的\
  \ `TTL` 与测试/跟踪流量的 `TTL` 不匹配，或者至少不接近，那么这些地址正被攻击者伪造。一个缺点是，要 l 实际跳数次数，你必须知道正在使用的起始\
  \ `TTL`。`TTL` 的概念是：当 IP 数据包的 `TTL` 在通过每个中间路由器递减并在到达目的地之前减零时，该数据包会被丢弃。\n\n深入分析防火墙日志，寻找来自相同子网的诱骗地址。你可能会发现攻击者最近连接过，而诱骗地址则没有。\n\
  \n## 章节总结\n\n## 核心概念与术语\n\n## 第 13 章评估\n\n1. 哪种类型的防火墙最可能防止 SYN 洪水？\n    1. 数据包过滤\n\
  \    2. 静态\n    3. 状态检测包检测 (Stateful Packet Inspection)\n    4. 动态\n\n2. 500 HTTP\
  \ 响应表示什么？\n    1. 客户端错误\n    2. OK\n    3. 重定向\n    4. 服务器错误\n\n3. 为什么在检查其证据之前你不应该关闭路由器？\n\
  \    1. 你可能会破坏证据。\n    2. 你会关闭它。\n    3. 掉电后它将丢失路由表。\n    4. 它违反了 FBI 取证指南。\n\n\
  4. 路由器使用什么来确定发送数据包的路径？\n    1. MAC 地址\n    2. IP 地址\n    3. 使用协议\n    4. 下一个可用端口\n\
  \n5. 哪个头部包含发送者的 MAC 地址？\n    1. TCP\n    2. IP\n    3. Ethernet\n    4. 无\n\n##\
  \ 第 14 章\n\n### 内存取证\n\n> 内存取证并不是每项调查中都必须进行的。在某些情况下，完全理解案件的事实所需的证据可以在不使用内存取证的情况下确定。然而，某些案件将要求你检查计算机内存。这在案件涉及复杂的恶意软件时尤为如此。通常，只有通过内存分析才可能完全理解恶意软件。在我们深入内存取证之前，理解内存是如何运作的。这将在下一节介绍。\n\
  \n> 当我们谈论内存分析时，指的是易失性内存——即可以改变的内存。这通常是人们考虑 `RAM`（随机访问存储器）时想的内容。永久存储中的信息通常通过对驱动器进行成像然后检查镜像来分析。易失性内存中的信息在分析该内存转储之前必须先进行“转储”（dump）。这在之前的章节中已详细介绍。\n\
  \n### 计算机内存的工作原理\n\n易失性内存仅在向内存设备供电时保留其内容。这是使此类内人在取证中至关重要的问题之一。一旦计算机关闭，易失性内存中的数据就会丢失。易失性内存的示例包括静态\
  \ `RAM` (`SRAM`)、同步静态 `RAM` (`SSRAM`)、同步动态 `RAM` (`SDRAM`) 以及现场可编程门阵列 (`FPGA`) 芯片内存。\n\
  \n今天最常见的内存类型是动态随机访问存储器 `DRAM`。`SRAM` 通常用于 CPU 缓存和寄存器，但这些项目不在我们对内存的讨论范围内。虽然簇和扇区是硬盘（传统的磁盘式硬盘）的根本构建单元，但\
  \ `RAM` 不同。在 `RAM` 中，内存单元（memory cell）是基本的构建单元。内存单元是存储一个位二进制信息的电路。高电压表示 1，而低电压表示\
  \ 0。实现这种功能有几种不同的方法，例如电容器、场效应晶体管和其他选项。但对于我们的目的来说，具体的电路并不相关。\n\n`RAM` 芯片内的内存有特定的地址。4\
  \ 位 `RAM` 芯片每个地址有四个内存单元；8 位 `RAM` 芯片每个地址有 8 个内存单元。你可能认为由于所有现代计算机都是 64 位的，所以 `RAM`\
  \ 也是 64 位的。事实并非如此。\n\n除了上述内存单元，内存还有各种组件。有一个存取/存储控制器（fetch/store controller），用于从内存地址获取数据或将数据存储在内存地址中。有一个内存地址寄存器\
  \ (`MAR`)，用于保存内存中的地址。`MAR` 实际上是一个 CPU 寄存器，但它存储内存地址，以便数据可以带入 CPU 或从 CPU 发送到内存。还有内存数据寄存器\
  \ (`MDR`)，它也是 CPU 的一部分。`MDR` 存储从内存传输的数据。考虑一下当你使用计算机时这些情况是如何运作的。例如，如果你打开一个文档，该文档位于你的硬盘或固态硬盘上，然后进入内存。这需要定位内存地址，并将构成文档的数据放入内存。应该存放数值的单元地址被放入\
  \ `MAR`，然后将新数据放入 `MDR`。这只是内存和 CPU 工作的通用概述。\n\n#### 栈与堆\n\n内存的另一个需要理解的问题是内存分配。具有\
  \ `C` 或 `C++` 编程背景的读者可能对堆和栈非常熟悉。对于其他人，本节将提供解释。\n\n栈（stack）是程序内部函数临时变量根据需要自动分配和管理的计算机内存。堆（heap）的管理并不像栈那样严格。堆是程序可以根据需要分配的内存。堆是所谓的“内存泄漏”的根源。当程序员编写了从堆中分配内存的代码，但没有仔细释放这些内存时，程序就会开始消耗越来越多的内存，直到导致系统崩溃。大量的恶意软件编写得很糟糕，在恶意软件调查中确实可以遇到内存泄漏。\n\
  \n#### 分页\n\n页表（page table）是一种数据结构。它将虚拟地址映射到物理地址。进程使用虚拟地址；硬件（更具体说是 `RAM`）使用物理地址。关于页还有其他辅助信息，如存在位、脏位或修改位，以及地址空间或进程\
  \ ID 信息等。基本上，每个进程都在使用虚拟页，给人一种正在处理连续内存区域的印象。然而，物理内存可能是连续的，也可能是不连续的。\n\n\n\n\n\nCPU\
  \ 的内存管理单元（MMU）存储了最近使用的映射。这被称为转换旁备缓冲区（`TLB`）。当虚拟地址需要翻译成物理地址时，第一步是搜索 `TLB`。在 `TLB`\
  \ 中找到内容被称为 TLB 命中；如果没有找到，则为 TLB 缺失。如果发生 TLB 缺失，则会搜索页表（称为页表遍历）。\n\n#### 捕获内存\n\n\
  获取内存并进行分析的能力对于取证检查具有重要意义。通常情况下，通过检查内存中特定恶意软件的迹象可以更好地检测复杂的恶意软件。幸运的是，有许多获取内存的方法。\n\
  \n第一步是从运行中的机器捕获内存。这可以使用几种不同的工具完成，其中许多是免费的。一种常用的免费工具是命令行工具 `DumpIt`，如图 14-1 所示。\n\
  \n![FIGURE 14-1 DumpIt 内存捕获。](img/9781284244496_CH14_FIGF01.jpg)\n\n图 14-1 DumpIt\
  \ 内存捕获。\n\n该工具会将当前内存转储到以 `.raw` 扩展结尾的文件中。注意这可能需要几分钟。`DumpIt` 工具非常流行，但有时在网上很难找到。它可以从\
  \ [`moonsols.com/resources.html`](https://moonsols.com/resources.html) 下载。\n\n另一个流行的内存捕获实用程序是\
  \ Belkasoft 的 `Ram Capturer` ([`belkasoft.com/ram-capturer`](http://belkasoft.com/ram-capturer))。该工具具有图形用户界面，而不是通过命令行工作。你可以在图\
  \ 14-2 中看到。\n\n![FIGURE 14-2 Belkasoft RAM Capturer。](img/9781284244496_CH14_FIGF02.jpg)\n\
  \n图 14-2 Belkasoft RAM Capturer。\n\nOSForensics 也提供了捕获运行内存的选项。这在图 14-3 所示。\n\n![FIGURE\
  \ 14-3 OSForensics 内存捕获。](img/9781284244496_CH14_FIGF03.jpg)\n\n图 14-3 OSForensics\
  \ 内存捕获。\n\n互联网上还有其他可捕获内存的工具，包括你之前在书中看到的 AccessData FTK imager。`FTK imager` 允许你非常轻松地捕获内存。这在图\
  \ 14-4 和 14-5 所示。\n\n![FIGURE 14-4 FTK imager 内存捕获步骤 1。](img/9781284244496_CH14_FIGF04.jpg)\n\
  \n图 14-4 FTK imager 内存捕获步骤 1。\n\n![FIGURE 14-5 FTK imager 内存捕获步骤 2。](img/9781284244496_CH14_FIGF05.jpg)\n\
  \n图 14-5 FTK imager 内存捕获步骤 2。\n\n## 使用 Volatility 分析内存\n\n无论你如何捕获内存，分析内存才是关键。幸运的是，最顶级的内存分析工具也是免费下载的。该工具是\
  \ `Volatility` ([`www.volatilityfoundation.org`](http://www.volatilityfoundation.org))。它是一个命令行工具。从\
  \ 2016 年到 2021 年初，版本 2.6 一直是 `Volatility` 的当前版本。\n\n第一个 `Volatility` 命令仅仅是获取关于 `Volatility`\
  \ 的信息以确保其运行正常。在这个示例中，使用了 Windows 独立版 `Volatility`。获取信息的命令在此显示：\n\n```\n![Program\
  \ code. 在代码中，变量名中的单词已合并。第 1 行。Volatility, 连字符, 2 dot 6 standal one, dot, exe, 连字符,\
  \ -, info.](img/9781284244496_CH14_03_UNNUN01.jpg)\n```\n\n此命令应该向命令窗口填充大量信息。信息中将包含支持的配置（profiles）。配置表示提取内存转储机器的操作系统，而不是你运行\
  \ `Volatility` 的机器。你可以在图 14-6 中看到 `--info` 输出，特别是支持的配置。\n\n![FIGURE 14-6 Volatility\
  \ --info。](img/9781284244496_CH14_FIGF06)\n\n图 14-6 Volatility --info。\n\n命令的基本格式所示：\n\
  \n```\n![Program code. 在代码中，变量名中的单词已合并。第 1 行。volatility, 字符, version, dot, exe command\
  \ name, 连字符, path, 连字符, profile, equals, profile.](img/9781284244496_CH14_03_UNNUN02.jpg)\n\
  ```\n\n以下是示例：\n\n```\n![Program code. 在代码中，变量名中的单词已合并。第 1 行。volatility,连字符, 2 dot\
  \ 6, standal one, dot, exe ps list, 连字符, C, 冒号, path, slash, tovolatility slash.\
  \ 第 2 行。dump, dot, bin, 连字符, 连字符, profile, equals, Win8SP064. 第 3 行。volatility,\
  \ underscore, 2 dot 6, underscore, win 64, underscore, standal one, dot, exe ps\
  \ scan, 连字符, dump, dot, bin. 第 4 行。连字符, 连字符, profile, equals, Win8SP064.](img/9781284244496_CH14_03_UNNUN03.jpg)\n\
  ```\n\n这些命令（也称为插件）使用 `Volatility` 扫描内存转储特定数据。内存转储文件可以是任何名称。常见的扩展名包括 `.mem`、`.bin`\
  \ 和 `.raw`。你需要使用与内存转储匹配的配置。当这些命令花费几分钟时不要惊讶，进程很慢。\n\n### plist 命令\n\n`plist` 是一个基本命令，列出内存转储中的进程。例如：\n\
  \n```\n![Program code. 在代码中，变量名中的单词已合并。第 1 行。volatility, underscore, 2 dot 6, underscore,\
  \ win 64, standal one, dot, exe ps list, 连字符, m m dump, dot, m m. 第 2 行。连字符, 连字符,\
  \ profile, equals, Win8SP064.](img/9781284244496_CH14_03_UNNUN04.jpg)\n```\n\n输出显示在图\
  \ 14-7。\n\n![FIGURE 14-7 Volatility pslist.](img/9781284244496_CH14_FIGF07)\n\n\
  图 14-7 Volatility pslist。\n\n`PID` 是该特定进程的 ID。`PPID` 是父进程 ID，即产生该进程的进程。`thds` 表示该进程有多少个线程。`Hnds`\
  \ 是句柄数；`sess` 是会话数。还显示了开始时间。\n\n### pstree 命令\n\n这非常像 `plist`，但它以层次树的形式显示进程，非常清晰地显示哪个进程启动了特定进程。例如：\n\
  \n```\n![Program code. 在代码中，变量名中的单词已合并。第 1 行。volatility, underscore, 2 dot 6, underscore,\
