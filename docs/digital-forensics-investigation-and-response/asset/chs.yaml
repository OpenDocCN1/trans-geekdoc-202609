  ```\n\n## 使用 OSForensics 分析\n\nOSForensics 包含了 Volatility 工作界面，它是一个独立的程序。这可以在图 14-10\
  \ 中看到。它允许你选择要执行的 Volatility 命令，以及任何需要的标志。\n\n![图 14-11 Volatility Workbench。](img/9781284244496_CH14_FIGF11.jpg)\n\
  \n图 14-11 Volatility Workbench。\n\n## 理解输出\n\n现在你已经通过 Volatility 的命令行版本和 OSForensics\
  \ 的 Volatility 工作界面看到了它。充分理解不同的输出含义很重要。某些输出参数之前针对特定命令讨论过。你可能看到的其他 Volatility 输出项见表\
  \ 14-1。\n\n表 14-1 Volatility 内存对象。\n\n| 项目 | 描述 |\n| --- | --- |\n| `_FILE_OBJECT`\
  \ | 打开的文件 |\n| `_EPROCESS` | 进程 |\n| `_ETHREAD` | 进程中的线程 |\n| `_OBJECT_SYMBOLICLINK`\
  \ | 用于别名使用 |\n| `_TOKEN` | 存储安全上下文 |\n| `_KMUTANT` | 用于同步的互斥锁 |\n| `gDesktop` |\
  \ 桌面 |\n| `_DRIVER_OBJECT` | 驱动程序 |\n\n经 Volatility Foundation 许可使用\n\n考虑到 Windows\
  \ 是如此普遍的操作系统，理解在许多 Volatility 扫描中可能会看到的各种 Windows 服务和执行文件也是重要的。主要的 Windows 系统服务在此列出并描述：\n\
  \n\n\n\n\n- `Session Manager Subsystem (SMSS)` 首先将自身及其主线程标记为关键对象（注意，你会看到多个 `SMSS`）。\n\
  - `SMSS` 启动了 `Wininit` 和 `CSRSS` 客户端/服务器运行时子系统。\n- 然后 `Winnit` 启动了 `services.exe`。\n\
  - `services.exe` 启动所有其他服务。预计看到许多 `svchost.exe` 进程。\n- `svchost.exe` 是计算机上的一个进程，用于托管或包含\
  \ Windows 用于执行各种功能的其他独立服务。例如，Windows Defender 使用一个由 `svchost.exe` 进程托管的服务。\n\n##\
  \ 整合所有知识\n\n你现在已经学习了广泛的 Volatility 命令，以及你可能在输出中看到的各种对象。现在是时候将这些知识整合成一个你在任何调查中都可以遵循的流程了。需要注意的是，随着你内存取证经验的增加，你将形成属于自己的处理流程。然而，这是一个很好的起点，特别是对于那些刚接触内存取证领域的新手来说。\n\
  \n1. `pslist` 是作为你的第一个 Volatility 命令的一个良好起点。仅仅知道内存中列出了哪些进程就非常有益。\n2. 注意任何无法解释的进程；父进程\
  \ ID 不在列表中的进程；以及正在产生多个未解释进程的进程。\n3. 随后，你可以使用 `connections`（Volatility 命令）来查看网络连接和进程\
  \ ID。是否有任何可疑进程正在连接？\n4. 还要检查 `sockets` 以查看任何可疑进程 ID 是否有接字连接。\n5. 尝试 `malfind` 插件。它至少尝试识别恶意软件。\n\
  6. 标记为 `Page_Execute_ReadWrite` 的内存段允许一段代码运行并写入自身，这可能是代码注入的标志。\n7. `handles` 插件识别句柄。\n\
  8. `-t` 选项仅显示互斥体（mutants 或 mutexes）；这些用于控制对共享资源的访问，并可能指示恶意软件。许多恶意软件内存产物已被记录。\n\n\
  这应该能为你提供一个使用 Volatility 或 Volatility Workbench 开始分析内存转储的起点。你可以使用这个流程开始探索内存转储中发现的数据并理解这些信息。\n\
  \n## 恶意软件技术\n\n通常，内存取证最常用于恶意软件调查。因此，了解恶意软件和恶意软件技术是有益的。在第 2 章 中我们简要介绍了恶意软件，但在本节中，我们将更深入地探讨这一主题。恶意软件可以分为几类。需要注意的是，这些类别并不是严格的。许多恶意软件实例符合多个重叠的类别。然而，这些类别对于分析非常有帮助。\n\
  \n### 病毒\n\n病毒是任何自我复制的软件。某些来源称病毒附着在合法文件中，但那不是我们使用的定义。病毒有许多类型。例如，宏病毒是通过文档中的宏创建的病毒。多态病毒是定期更改其某些特征的病毒，从而使其更有可能规避杀病毒软件工具。\n\
  \n为了更好地理解病毒，让我们检查近几年几个相当著名的病毒。2017 年 3 月，Wannacry 在一场活跃的风暴中席卷世界。然而，这种病毒在未来的许多年里都将被研究。这有几个原因。该病毒值得关注的第一个原因是，它所利用的漏洞已经有了补丁，而且该补丁已经可用了几个周。这说明了为什么补丁管理是网络安全如此重要的部分。\n\
  \n任何关于病毒的现代对话必须包含对勒索软件的讨论。最广知的勒索软件示例之一是臭名昭著的 `Crypto Locker`，它首次于 2013 年。`Crypto\
  \ Locker` 利用对称加密锁定用户文件。已检测到多种 `Crypto Locker`。`Crypto Wall` 是 `Crypto Locker` 的变体，首次于\
  \ 2014 年 8 月发现它看起来和行为与 `Crypto Locker` 非常相似。除了加密敏感文件外，它还会与命令控制服务器通信，甚至对受感染的机器进行截图。到\
  \ 2015 年 3 月，发现了一个 `Crypto Wall` 的变体，它与间谍软件 `TSPY_FAREIT.YOI` 包绑。除了扣留文件索要外，它还会从受感染系统中窃取凭据。\n\
  \n### 蠕虫\n\n蠕虫本质上是一种自我传播的计算机病毒。换句话说，蠕虫是毒性更大的病毒。这是类别重叠的一个极佳例子。许多被称为病毒的恶意软件实例实际上是蠕虫。\n\
  \n### 间谍软件\n\n间谍软件是以某种方式监控计算机活动的软件。`Keyloggers` 就是一个例子。`Keyloggers` 仅记录击键。屏幕捕获软件定期截图。对于任何间谍软件，一个问题是数据外泄。数据必须发送到某些外部实体。这是内存取证可以非常有帮助的地方之一。搜索创建到外部\
  \ IP 地址接字的进程，可以揭示正在外泄数据的间谍软件。间谍软件可以是合法的。例如，用于监控未成年儿童在线活动的软件在家长中非常受欢迎。一些雇主也会使用某些类型的间谍软件来监控员工在远程工作时如何使用公司的机器。然而，在未经所有者同意的情况下在你不拥有的机器上放置此类监控软件是犯罪行为。\n\
  \n曾出现过一些著名的间谍软件。`FinFisher` 是由 Lench IT Solutions 公司为执法部门制作的软件。然而，它被泄露给公众并广泛使用。\n\
  \n`Zwangi` 是另一个著名的间谍软件。这种恶意软件会采取两个动作。第一个是重定向浏览器地址栏中输入的 URL，并将用户带到 [www.zwangi.com](http://www.zwangi.com)。然而，第二个活动是对计算机进行定期截图。\n\
  \n### 逻辑炸弹\n\n逻辑炸弹在某些逻辑条件满足时执行其恶意活动。这通常是一个时间，也可以是任何因素。例如，已有多个程序员在公司计算机中放置逻辑炸弹的案例，当他们被解雇时就会删除重要文件。一个著名的案例是\
  \ David Tinley。2019 年，Tinley 承认他在为西门子公司创建的软件中编写并部署了逻辑炸弹。逻辑炸弹的目标是让软件在一段时间后故障，从而导致西门子不得不再次雇用他来解决问题。\n\
  \n### 木马\n\n木马更多是一种交付机制，而不是一种独立的恶意软件类别。可以使用木马来交付病毒、间谍软件、逻辑炸弹等。\n\n### 恶意软件隐藏技术\n\
  \n\n\n\n\n恶意软件利用各种技术在系统中隐蔽地执行代码。其中一种技术是 DLL 注入。DLL 注入涉及导致代码在其他进程的地址空间内执行。这是通过强制目标程序加载\
  \ DLL 实现的。可以使用多种技术来实现这种攻击。特定的注册表键可能会很有用。例如，注册表项 `HKEY_LOCAL_MACHINE\\SOFTWARE\\\
  Microsoft\\Windows NT\\CurrentVersion\\Windows\\AppInit_DLLs` 中列出的每个 DLL 都会加载到加载\
  \ `User32.dll` 的进程中。`User32.dll` 被许多程序使用。因此，如果攻击者能够让他们的 DLL 列入该注册表项，它将随着许多程序一起被加载。\n\
  \n另一个可 DLL 注入的注册表键是 `HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\Session\
  \ Manager\\AppCertDLLs`。此注册表项中的任何 DLL 都将被加载到调用 Win32 API 函数 `CreateProcess`、`CreateProcessAsUser`、`CreateProcessWithLogonW`、`CreateProcessWith-TokenW`\
  \ 和 `WinExec` 的进程中。这同样涵盖了大量的程序。\n\nVolatility 提供了用于检查注册表的命令，包括：\n\n* `hivescan`\n\
  * `hivelist`\n* `printkey`\n\n最后一个命令 `printkey` 可能是检查 DLL 注入最有用的工具。该 Volatility\
  \ 命令允许用户查看任何特定的注册表键。这包含了本节之前讨论的两个注册表项。\n\n另一种技术是进程空洞（process hollowing），称为进程替换。这种技术将恶意软件伪装成合法的系统进程，而没有崩溃进程的风险。进程空洞的关键是创建一个挂起状态的进程。这是通过挂起主线程并将进程加载到内存来实现的。在外部程序恢复主线程之前，程序将保持抑制，导致程序开始运行。\n\
  \n在内存转储可以找到进程空洞或进程注入的迹象。寻找如 `VirtualAllocEx()`、`CreateRemoteThread()` 和 `SetWindowsHookEx()`\
  \ 等调用。这些可能是正常软件的一部分但也可能指示 DLL 注入。检查标记为 `Page_Execute_ReadWrite` 且没有内存映射文件的内存段。这也可以空洞或注入的迹象。\n\
  \n## Density Scout\n\n另一个可以用于寻找恶意软件的工具。这实际上不是内存取证，但通常可以与内存取证结合使用。`Density Scout`\
  \ 具有此处所示选项：\n\n| `-a` | 同时显示错误和空项 |\n| --- | --- |\n| `-d` | 仅输出数据（格式: `density|path`）\
  \ |\n| `-l density` | 仅密度低于给定值的文件 |\n| `-g density` | 仅密度大于给定值的文件 |\n| `-n number`\
  \ | 输出的最大行数 |\n| `-m mode` | 模式 ABS（默认）或 CHI（用于文件大小 > 100 Kb） |\n| `-o file` | 写入输出的文件\
  \ |\n| `-p density` | 如果低于给定密度则立即打印 |\n| `-P density` | 如果大于给定密度则立即打印 |\n| `-r`\
  \ | 递归遍历 |\n| `-s suffix(es)` | 文件类型 (s)（例如 `dll` 或 `dll,exe,...`） |\n| `-S suffix(es)`\
  \ | 要忽略的文件类型 (s)（例如 `dll` 或 `dll,exe`） |\n| `-pe` | 通过魔数包含所有可移植执行文件 |\n| `-PE` |\
  \ 通过魔数忽略所有可移植执行文件 |\n\n这里是一个探索 `Windows\\System32` 中文件的示例命令：\n\n![程序代码。在代码中，变量名中的单词已合并。第\
  \ 1 行。density scout, 连号, d, 连号, o results, 点, t x t c, 冒号, 反斜, Windows, 反斜, System\
  \ 32。](img/9781284244496_CH14_06_UNNUN01.jpg)\n\n你可以在 图 14-13 中看到此命令。\n\n![图 14-13\
