  \ A Primer.\n\n\n\n\n\n这些活动中的每一种都可能破坏组织计算机系统的正常运行，因此构成灾难。正如引言中所提到的，你对这些活动严重性的看法在很大程度上取决于背景。事实上，大多数组织都有两项应对此类灾难的计划：业务连续性计划\
  \ (BCP)和灾难恢复计划 (DRP)。BCP 侧重于在完全恢复之前尽可能保持组织的正常运行。DRP 则侧重于执行完全恢复以回到正常运行。例如，考虑这样一种场景：病毒导致主\
  \ Web 服务器离线。BCP 将关注可以采取哪些措施来维持最小运营，直到组织能够恢复到完整功能——也许只是临时使用一台旧服务器，这台服务器可能没有那么健壮，但可以提供基本功能。DRP\
  \ 则侧重于实际上让组织恢复到完整功能。在刚才描述的场景中，这将意味着一个与故障服务器同等的完整 Web 服务器重新上线并以满负荷运行。\n\n有一些针对 BCP\
  \ 的联邦标准。\n\n### ISO 27001\nISO 27001 概述了信息安全管理体系的要求。该标准首次于 2005 年发布，并在 2014 年进行了修订。2017\
  \ 年仅针对欧洲进行了更新，以满足欧盟《通用数据保护条例》的要求。ISO 27001 是一个非常广泛的标准，涵盖了通用信息安全管理。第 14 节探讨了业务连续性管理。\n\
  \n### NIST 800-34\n该标准名为《信息技术系统应急计划指南》，因此它显然与业务连续性和灾难恢复有关。该计划引入了一些额外的缩写，例如业务连续性计划\
  \ (COOP)、关键基础设施保护 (CIP) 和信息系统应急计划 (ISCP)。COOP 仅侧重于识别任务关键功能 (MEF) 并能够维持这些功能 30 天。NIST\
  \ 800-34 将 `CIP` 定义为“关键基础设施和关键资源 (CIKR) [其] 是那些国家基础设施的组件，被认为如此重要，以至于它们的损失将对美国的安全、防护、经济和/或健康产生破坏性影响。”¹\
  \ ISCP 关注系统发生中断后的评估和恢复。该计划包含适用于 BCP 和 DRP 项目的七步流程。这七个步骤是：\n\n1. 制定应急计划政策声明。正式的政策为制定有效的应急计划提供必要的授权和指导。\n\
  2. 进行业务影响分析 (`BIA`)。`BIA` 用于识别并对对支持组织任务/业务功能至关信息系统和组件进行排序。\n3. 识别预防性控制。减少系统中断影响的措施可以增加系统可用性并降低应急生命周期成本。\n\
  4. 创建应急策略。详尽的策略确保系统在发生中断后可以快速、有效地恢复。\n5. 制定信息系统应急计划。应急计划应根据系统的安全影响级别和恢复要求，包含恢复系统的详尽指导和程序。\n\
  6. 计划测试和培训。确保对 BCP 和 DRP 进行了测试，并对员工进行了这些计划的培训。\n7. 计划维护。计划应频繁更新，以与系统和组织的变化保持同步。\n\
  \n### NFPA 1600\n其正式名称为《灾难/应急管理与业务连续性计划标准》。它由美国国家消防协会创建。其重点显然是响应与火相关的事件。这些事件通常不涉及数字取证。\n\
  \n这些标准为任何 BCP 应该涵盖的内容提供了良好的概述，某些标准（如 NIST 800-34）也适用于 DRP。你应该在职业生涯的某个时候考虑审查这些标准。为了取证检查，你不需要成为灾难恢复专家；只需对该流程有一个基本的概述就足够。关键步骤在此概述。\n\
  \n## 业务影响分析\n业务影响分析 (`BIA`) 是一个过程，灾难恢复团队通过该过程思考可能的灾难以及每种灾难对组织的影响。例如，一家不直接向组织发货的公司可能会受到轻影响。直接面向公众的公司可能会受到严重影响。\n\
  \n关键步骤在此概述：\n最大可容停机时间 (`MTD`](9781284244496_Glossary.xhtml#gloss-85) 简单意味着给定系统可以停机多久而不会对组织造成长期损害。如果一个组织无法离开某台设备超过\
  \ 14 天且仍恢复（即 `MTD` = 14 天），而 `MTTR` 为 7 天，这意味着在灾难发生后你只有 7 天时间进行维修，否则组织将无法恢复。\n\n\
  另外两个术语与最大停机时间有关。一个是平均修复时间 (`MTTR`](9781284244496_Glossary.xhtml#gloss-88)，有时也被称为平均恢复时间。这是修复某物品所需的平均时间。第二个术语是平均故障时间\
  \ (`MTTF`](9781284244496_Glossary.xhtml#gloss-87)。平均而言它可能会发生多久故障？在执行 `BIA` 时，这些是需要回答的问题。还有一些需要计算的相关数值。其中一个是恢复点目标\
  \ (`RPO`](9781284244496_Glossary.xhtml#gloss-111)。它指的是将丢失多少数据。假设我们每小时对关键数据库进行一次备份。在数据库发生故障时，可能丢失的最多数据为\
  \ 59 分钟量。这是你的组织可以接受的风险吗？还是说太多了？另一个数值是恢复时间目标 (`RTO`](9781284244496_Glossary.xhtml#gloss-110)。当系统宕机时，使其恢复并运行的目标时间是多少？显然，那个\
  \ `RTO` 必须小于 `MTD`。\n\n\n\n\n\n在 `BIAs` 中常用的常用的计算方法。第一个是单次损失期望（`SLE`）。这是通过资产价值乘以暴露因子得出的。通过一个例子，这会更容易理解。假设你有一个每周产生\
  \ `$10,000` 的电子商务网站。这就是 `asset value`（资产价值）。现在，假设如果它遭受了拒绝服务（`DoS`）攻击，预计它会停机一整天（我使用简单的数字以便于计算）。那么，暴露因子就是\
  \ `1/7`，约等于 `0.142`。因此，计算公式变为：\n\n![程序代码。在代码中，变量名中的单词已合并。第 1 行 S L E，等于，A V，乘以，E\
  \ F。第 2 行。或。第 3 行 S L E，等于，10,000 美元乘以 0，点，142。第 4 行 S L E，等于，1,428。点，57 美元。](img/9781284244496_CH07_EQN01.png)\n\
  \n接下来，你需要确定年度损失期望（`ALE`）。假设根据过去的事件报告和与你业务类似的业务的统计数据，你预计每年会遭受三次 `DoS` 攻击。那就是年度发生率（`ARO`），所以你的公式现在是：\n\
  \n![程序代码。在代码中，变量名中的单词已合并。第 1 行 A L E，等于，A R O，乘以，S L E。第 2 行。或。第 3 行 A L E，等于，3\
  \ 乘以 1,428。点，57。第 4 行 A L E，等于，4,285。](img/9781284244496_CH07.png)\n\n这些数字用于计算你应该在缓解攻击上花费多少资金。让我们假设某个产品可以保证减少\
  \ `90%` 的 `DoS` 攻击。这应该使你的 `ALE` 只有 `10%`，即 `$428.57`。这听起来是个很棒的交易，但如果每年花费 `$5,000`\
  \ 呢？这比你的 `ALE` 高。你可以看到 `SLE` 和 `ALE` 如何帮助你量化损失并分配资源进行缓解。\n\n## 描述事件\n\n为了分析事件，有必要描述任何事件。描述并不是一个临时或主观的过程。特定的衡量方法有助于描述任何事件并进行取证分析。\n\
  \n### 通用漏洞评分系统\n\n漏洞评分的一种常用方法是通用漏洞评分系统（`CVSS`）。`CVSS` 广泛用于漏洞分类，这是一种根据严重程度对漏洞评分的开放标准。在响应事件时，描述漏洞非常有帮助。使用\
  \ `CVSS` 时，有三组指标：`base`（基础）、`temporal`（临时）和 `environmental`（环境）。`base` 组描述了不随时间或环境变化的漏洞基础特征。该组指标包括\
  \ `Attack Vector`（攻击向量）、`Attack Complexity`（攻击复杂度）、`Privileges Required`（所需权限）、`Scope`（范围）、`Confidentiality\
  \ Impact`（机密性影响）、`Integrity Impact`（完整性影响）和 `Availability Impact`（可用性影响）。\n\n`Attack\
  \ Vector` 指可以是 `Network`（网络）、`Adjacent`（相邻）、`Local`（本地）或 `Physical`（物理）。`Attack\
  \ Complexity` 可以是 `None`（无）、`Low`（低）或 `High`（高）。`User Interaction` 可以是 `None`（无）或\
  \ `Required`（需要）。`Scope` 指标捕捉漏洞是否影响了其范围之外的组件。其值可以是 `Unchanged`（未更改）或 `Changed`（已更改）。`Impact`\
  \ 指标（`Confidentiality`、`Availability` 或 `Integrity`）都被评为 `High`（高）、`Low`（低）或 `None`（无）。应该注意的是，`CVSS\
  \ v3.x` 引入了一个级别，选项有 `Low`（低）、`Medium`（中）、`High`（高）和 `Critical`（严重）。\n\n`Temporal\
  \ Metric` 有三个指标：`Exploit Code Maturity`（利用利用度）、`Remiation Level`（缓解级别）和 `Report\
  \ Confidence`（报告可靠性）。`Environmental Metric` 有四个指标：`Modified Base`（修改基础）、`Confidentiality\
  \ Requirement`（机密性需求）、`Integrity Requirement`（完整性需求）和 `Availability Requirement`（可用性需求）。\n\
  \n`Exploit Code Maturity` 衡量漏洞被攻击的概率，通常基于利用技术、利用代码可用性或活跃的“野外利用”。可能的评级有 `Not Defined`（未定义）、`High`（高）、`Functional`（可用）、`Proof\
  \ of Concept`（概念证明）和 `Unproven`（未证明）。`Remediation Level` 可以 `Not Defined`（未定义）、`Unavailable`（不可用）、`Workaround`（替代方案）、`Temporary\
  \ Fix`（临时修复）或 `Official Fix`（官方修复）。`Report Confidence` 指标表示我们对漏洞细节的确定程度。其值可以是 `Not\
  \ Defined`（未定义）、`Confirmed`（已确认）、`Reasonable`（合理）或 `Unknown`（未知）。\n\n各种指标的值在表 7-1\
  \ 中总结。\n\n表 7-1 CVSS。\n\n![CVSS](img/9781284244496_CH06_TAB01.png)\n\n`CVSS` 评分通常表示为一个字符串，例如：\n\
  \n![程序代码。在代码中，变量名中的单词已合并。第 1 行 C V S S，冒，3 点 1，/，S，冒：3 点 1，/，N，冒：3 点 1，/：A，冒：3 点\
  \ 1，/，L，冒：3 点 1，/，U，冒：1/X。](img/9781284244496_CH07_03_UN1.png)\n\n理解网络面临的漏洞并量化威胁很重要。\n\
  \n### DREAD\n\n`DREAD` 是 Damage Potential（损害潜力）、Reproducibility（重复性）、Exploitability（利用性）、Affected\
  \ Users（受影响用户）和 Discoverability（可发现性）的缩写。它是使用五个类别进行风险评分的记忆法。攻击会造成多少损害？在事件响应的情况下，问题是：攻击造成了多少损害？攻击者重现这种攻击有多容易？有多少用户受到影响？最后，发现威胁有多容易？`DREAD`\
  \ 询问攻击的可能性，以及它会造成什么损害。\n\n### RMON\n\n远程网络监控（`RMON`）由互联网工程任务组（`ETF`）开发，旨在支持网络监控和协议分析。这看起来可能不是事件响应的有用工具，但它可以。它提供了分类网络流量的标准方法。`RMON`\
  \ 是一种标准的监控规范，允许各种网络监控器交换网络数据。\n\n原始 `RMON` 有 10 组：\n\n1. `Statistics`（统计）：实时 LAN\
  \ 统计，例如利用率、冲突、CRC 错误。\n2. `History`（历史）：所选统计的历史。\n3. `Alarm`（报警）：当统计超过定义的阈值时设置的\
  \ RMON SNMP 陷阱定义。\n4. `Hosts`（主机）：特定主机的 LAN 统计，例如发送/接收字节、发送/接收帧。\n5. `Hosts top\
  \ N`：给定时间内最活跃的 N 个连接记录。\n6. `Matrix`（矩阵）：系统发送-接收流量矩阵。\n7. `Filter`（过滤）：定义感兴趣的数据包，例如\
  \ MAC 地址或 TCP 端口。\n8. `Capture`（捕获）：收集并转发匹配 `Filter` 的包。\n9. `Event`（事件）：为 `Alarm`\
  \ 组发送警报（SNMP 陷阱）。\n10. `Token Ring`（令牌环）：针对 Token Ring 的特定扩展。\n\n原始 `RMON` 由 `RFC\
  \ 2819` 定义。`RMON2` 在 `RFC 4502` 中定义。针对特殊网络已有 `RMON` 的修改。例如，高容量网络远程监控管理信息库（`HCRMON`）在\
  \ `RFC 3272` 中定义。交换网络远程网络监控 MIB 扩展（`SIMON`）在 `RFC 2613` 中定义。\n\n\n\n\n均方偏差（MSD）公式相对简单，能够让我们洞察任何系统偏离预期的程度。这有时被称为均方误差。它本质上是取误差或偏离预期/目标结果的平方。该公式见图\
  \ 7-1。\n\n![图 7-1 均方偏差公式。](img/9781284244496_CH07_FIGF01.jpg)\n\n图 7-1 均方偏差公式。\n\
  \n在图 7-1 中，`y[i]` 是实际值，`T` 是目标值。这被用于许多工程领域。该指标是一个正整数。它的解读非常简单：MSD 越接近于零，相关系统就越可靠。有时会对均方误差开平方根，得到均方根偏差（或均方根误差）。该公式也可用于衡量事件对给定系统产生影响的指标。系统偏离正常值有多远？\n\
  \n## 平均百分比误差\n\n与 MSD 密切相关的是平均百分比误差（MPE）公式。MPE 是建模误差的算术平均值。该指标将预期值与实际值进行比较并计算平均误差。误差被定义为任何与计划或预期值的偏差。这在建模中至关重要，因为可以用于评估模型本身的效能。MPE\
  \ 公式见图 7-2。\n\n![图 7-2 平均百分比误差公式。](img/9781284244496_CH07_FIGF02.jpg)\n\n图 7-2 平均百分比误差公式。\n\
  \n在图 7-2 中，`n` 是对变量进行预测的不同次数；`a[t]` 是被预测数量的实际值；`f[t]` 是预测值。\n\n本质上，该指标描述的是预期值与实际值之间的差异。这是衡量事件影响的一种有效方法。\n\
  \n## 石川图\n\n石川图是工程领域中失效模式与影响分析（FMEA）中常用的工程工具。这些图有时被称为“鱼骨图”，因为缺陷是鱼头，而导致缺陷的问题是分支或鱼骨。一个如何创建石川图的通用示例见图\
  \ 7-3。\n\n![图 7-3 石川图。](img/9781284244496_CH07_FIGF03.jpg)\n\n图 7-3 石川图。\n\n这在追踪事件的根原因方面是有效的。根原因分析是事件响应的一个重要方面。\n\
  \n## 恢复计划\n\n恢复计划由两部分组成。最终目标是完全恢复，这在灾难恢复计划（DRP）中概述。但除非该 DRP 能够在 24 小时或内让组织恢复到完全能力，否则还需要业务连续性计划（BCP），即一个在实现完全恢复之前如何获得基本功能的计划。这两份计划都基于在业务影响分析（BIA）阶段确立的优先级。\n\
  \n尽管 DRP 和 BCP 的目标并不完全相同，但它们确实需要回答相同的问题：\n\n*   你是否已经识别了备用设备？\n*   如果需要，你是否已经识别了备用设施？\n\
  *   即使在主要通信手段中断的情况下，是否建立了联系员工、供应商、客户等人的机制？\n*   数据是否有离线备份？\n*   该备份可以被方便地检索和恢复吗？\n\
  \n在考虑备份和恢复备份时，你需要考虑你拥有什么种类型的备份。虽然数据库管理员可能使用多种类型的数据备份，但从安全的角度来看，我们关注的是三种主要的备份类型：\n\
  \n*   全备——所有更改\n*   差异备份——自上次全备以来的所有更改\n*   增量——自上次任何类型的备份以来的所有更改\n\n如果你进行了全备，只需恢复上一次备份即可。然而，如果备份策略包含了差异或增量备份（这很可能），那么会有额外的备份数据需要恢复。\n\
  \n还有一种日益流行的备份类型，被称为分层存储管理（HSM）。HSM 通过光光或磁带“匣库”提供持续在线备份。它在系统中表现为无限磁盘，并可以配置为提供可用实时备份的最接近版本。\n\
  \n## 恢复后跟进\n\n不同的灾难恢复教材对此的标记不同，但内容是相同的：现在灾难已经结束且组织已经恢复，你必须查明发生了什么以及为什么发生。这就是取证发挥作用的地方。这一阶段并不一定是为了指责；而是为了发现灾难是否是由系统中的某些弱点引起的。这可能是个人的疏忽行为，也可能是政策上的漏洞。但如果根原因没有被发现和解决，再次发生的概率将很大。\n\
  \n## 事件响应\n\n当事件发生时，即使它尚未达到灾难的程度，也需要组织响应。例如，如果一台工作站感染了病毒，这可能并不构成灾难。但如果得不到及时响应，病毒扩散可能会演变成灾难，因此适当事件响应至关重要。\n\
  \n每个事件响应计划必须包含的一些关键步骤在本节中进行了概述。你还会发现某些来源将事件响应分为六个阶段，另一些则列出五个或七个阶段。问题不在于你如何划分步骤，而在于是否在适当的时间完成了所有必要的步骤。\n\
  \n### 检测\n\n显然，你必须在响应之前检测到事件。然而，在初始阶段，你没有时间进行详细分析。你只需要检测到事件、其基本性质以及影响了哪些系统，然后进入控制阶段。例如，如果你检测到了恶意软件，你的初始目标只是确定受影响的系统并对其进行控制。然后你可以回头发现更多细节，例如恶意软件的类型、它造成的损害、它是如何进入网络的等。这并不意味着你不会进行分析。你绝对会。但如果你在这个阶段花费时间进行分析，事件仍在持续。如果是恶意软件，恶意软件仍在扩散。\n\
  \n### 控制\n\n\n\n\n一旦事件得到控制，下一步就是根除问题。在恶意软件案例中，问题在于移除恶意软件。在某些情况下，可以使用 `Norton`、`Bit\
  \ Defender`、`McA`、`Kapersky`、`Windows Defender` 或 `AVG` 等反恶意软件工具移除恶意软件。在其他情况下，IT\
  \ 人员需要手动移除恶意软件。\n\n其他攻击则没有那么明确。例如，如果事件是入侵者通过 `SQL injection` 渗透网络，那么根除意味着什么？第一步是修复任何允许入侵者渗透网络的漏洞。在\
  \ `SQL injection` 的情况下，这将涉及修复网页中允许此类攻击发生的缺陷。\n\n无论具体的事件是什么，根除都必须是彻底的。这意味着需要对所发生的情况及其影响范围进行全面检查。确保问题得到完全解决是至关重要的。\n\
  \n这是取证必须开始的阶段。如果只是简单地根除事件，那么证据很可能随之消失。在根除事件之前，你务必开始收集证据。这可能涉及在采取任何根除步骤之前进行取证调查。在某些情况下，无法在保持系统暂停的情况下进行全面的取证调查。在这种情况下，只需对涉及的驱动器进行镜像，以便以后进行取证调查。\n\
  \n### 恢复\n恢复涉及将受影响的系统恢复到正常状态。在恶意软件的情况下，这意味着确保系统恢复完全工作状态，且绝对没有恶意软件存在。在许多情况下，这将涉及从已验证为没有恶意软件感染的备份源恢复软件和数据。\n\
  \n### 跟进\n跟进阶段是取证再次发挥关键作用的另一个阶段。IT 团队必须确定此类事件是如何发生的，以及可以采取哪些步骤来防止此类事件再次发生。显然，在没有取证检查结果投入的情况下，就无法做出这些决策。这时我们回到了在检测阶段仅简要提到的分析。现在，我们有时间仔细分析并从事件中汲取教训。\n\
  \n跟进的某一部分是对事件进行分类。有几种标准要求向某些机构报告事件，而这些报告需要一些描述和分类。例如，支付卡行业要求其商户报告涉及涉及持卡人数据的安全事件。只要检测到违反支付卡行业数据安全标准（`PCI\
  \ DSS`）的漏洞，就应该发布此类报告。以下是 `PCI` 识别出的获取未经授权访问系统和敏感信息的方法示例：\n\n*   `SQL injection`——一种向网站插入修改过的\
  \ `SQL`（结构化查询语言）的技术。这种攻击取决于网站允许未经过滤的输入。\n*   `Malicious code or malware`——在未经用户同意的情况下添加到系统的程序（如\
  \ `viruses`、`worms`、`Trojan horses`、`back doors` 和间谍软件）。\n\n### 保护证据\n事件是系统或网络内部任何可观测现象。这包括网络上的任何活动，例如防火墙拦截流量。不利事件是产生负面结果的事件。对系统的攻击属于不利事件。\n\
  \n计算机安全事件是任何违反安全策略的事件。这包括可用使用策略和标准安全规范。以下是计算机安全事件的示例：\n\n*   `Denial-of-service\
  \ (DoS)` 攻击——`DoS` 攻击可能是攻击者向 Web 服务器发送特殊数据包导致其崩溃。它也可能是攻击者引导数百个受感染的外部工作站向组织发送大量 `ICMP`\
  \ 请求。当攻击来自多个源时，称之为 `distributed DoS (DDoS)` 攻击。\n*   `Malicious code`——恶意软件（`malware`）是任何恶意代码，例如\
  \ `viruses`、`worms` 和 `Trojans`。例如，一个 `worm` 使用开放的文件共享来快速感染组织内的数百个系统。员工可能会无意中通过\
  \ `USB drives` 从其家中的电脑向网络中引入 `viruses`。当他们将 `USB drive` 插入工作电脑时，病毒就会感染它。\n*   `Unauthorized\
  \ access`——这包括任何人访问了他们不应该访问的文件。这种访问可能来自组织内部的人（如员工），也来自外部攻击者。如果你不使用适当的权限锁定共享文件，用户可能会偶然发现不应看到的数据。如果你不对\
  \ Web 服务器使用的数据库进行安全保护，攻击者可能从互联网的任何地方访问敏感客户数据（如信用卡信息）。\n*   `Inappropriate usage`——不当使用可以有多种形式。例如，用户可能会通过\
  \ `peer-to-peer (P2P)` 文件共享服务向他人提供软件的非法副本。同样的 `P2P software` 可能会导致数据泄露，将用户计算机中的隐私数据在互联网上共享给任何其他使用相同\
  \ `P2P software` 的人。\n\n无论事件的具体细节如何，保护证据至关重要。在本书中，已经讨论了证据保护。然而，在事件响应案例中，这一主题具有新的视角。\n\
  \n\n\n\n\n首先，未能保留取证信息将导致 IT 团队无法有效评估事件原因，并无法调整公司政策和流程以减少此类事件再次发生的风险。即使事件不涉及犯罪，或者公司根本不愿起诉，取证数据在防止未来事件发生方面也起着不可缺的作用。\n\
  \n在某些情况下，组织最初可能并没有认为发生了犯罪，但进一步的调查显示确实发生了犯罪行为。例如，硬盘崩溃最初可能被认为是设备的正常故障，但进一步的检查发现了恶意软件，这些恶意软件导致硬盘比预期的更早发生故障。如果没有遵循适当的取证程序，可能无法进行起诉或追究民事诉讼。\n\
  \n# 在事件响应中加入取证\n\n意识到取证在事件响应中的重要性是至关的第一步。但这种认识仍然留下了关于如何实施恰当取证程序的问题。IT 部门可以采取特定的步骤，将取证技术与公司的事件响应策略交织在一起。\n\
  \n## 取证资源\n\n第一步是识别组织在发生事件时可以利用的取证资源。如果公司没有接受过取证培训的人员，任何政策改变都将是无效。组织可以采取的方法之一是为其自己的\
  \ IT 安全人员提供基础取证培训。许多大学的计算机相关学位现在包含了取证课程，大多数与安全相关的学位至少包含一门入门取证课程。如果公司 IT 安全人员中没有人接受过此类培训，派遣员工接受计算机取证培训可能会有所帮助，或许可以获得主要的取证认证之一。\n\
  \n该组织可以寻求的另一个选项是识别一个能够派遣经过取证培训的人员对事件做出响应的第三方。在这种情况下，事件计划的一部分将包括确保与可靠的取证公司或个人顾问达成协议。如果这是组织希望追求的选项，确保所确定的组织既具有适当的胜任水平，又具有响应事件所需的资源是至关重要的。\n\
  \n## 取证与策略\n\n一旦确定了适当的取证资源，必须将取证方法交织到组织的事件响应策略中。这意味着所有关于灾难恢复和事件响应的策略都需要更新。\n\n更新策略的目的是确保证据在恢复事件或灾难的过程中不被破坏。例如，关于处理恶意软件感染的策略将进行修改，以便在感染被控制后，消除恶意软件之前，至少对一台受感染的机器进行镜像以获取取证证据。在外部入侵的情况下，策略将更改为在完全恢复之前保留所有日志。\n\
  \n很有可能，即使 IT 安全人员没有专门接受过取证培训，他们对该领域也有一些基础知识。这是因为许多安全教科书现在至少包含一个关于基础取证的章节。大多数通用计算机安全认证如\
  \ `CompTIA Security+` 和 `CISSP` 也也包含了基础取证部分。即使你的员工缺乏执行取证调查的适当培训，他们也应该经过充分培训，知道如何保护证据并避免对证据的任何更改。\n\
  \n## 章节总结\n\n## 核心概念和术语\n\n## 第 7 章评估\n\n1. 什么评估了灾难可能造成的潜在损失？\n    1. 业务评估 (BA)\n\
  \    2. 业务影响分析 (BIA)\n    3. 风险评估 (RA)\n    4. 业务连续性计划 (BCP)\n2. 下列哪侧重于在中断期间和之后维持组织的业务功能？\n\
  \    1. 业务连续性计划\n    2. 业务恢复计划\n    3. 业务连续计划\n    4. 灾难恢复计划\n3. 一旦检测到对组织信息系统的入侵，应该先执行以下哪些操作？\n\
  \    1. 消除入侵者访问的所有手段。\n    2. 制入侵。\n    3. 确定系统和数据的受损程度。\n    4. 与相关方通信。\n4. 业务连续性计划的制定最依赖于：\n\
  \    1. 高层管理的指示。\n    2. 业务影响分析 (BIA)。\n    3. 范围和计划启动。\n    4. BCP 委员会的技能。\n\n\
  ## 参考文献\n\n1. Swanson, M., Bowen, P., Phillips, A. W., Gallup, D., & Lynes, D. (2010).\
  \ 联邦信息系统应急计划指南. 国家标准与技术协会特别出版物 800-34. Gaithersburg, MD: NIST.\n\n## 第三部分\n\n数字取证的分支\n\
