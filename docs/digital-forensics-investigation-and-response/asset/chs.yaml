  \n找到任何空白日志也同样重要。这可能表明有人删除了日志。你可以使用此命令执行操作：\n\n![程序代码。在代码中，变量名中的单词合并在一起。第 1 行：l s、hyphen、a\
  \ l、正斜、v a r、正斜、log、正斜、星号。](img/9781284244496_CH09_04_UNIMG5.png)\n\n## Linux 目录\n\
  \n在任何操作系统中，都有对该操作系统运行至关重要的关键目录。在 Linux 中，这些目录是寻找证据的重要场所。了解主要目录的一般用途及其潜在的取证重要性，对于对\
  \ Linux 系统进行取证分析非常有帮助。\n\n### /root 目录\n\n`/root` 目录是 root 用户的家目录。Linux 中的 root\
  \ 等于 Windows 中的管理员。该目录是存放管理员数据的地方。\n\n### /bin 目录\n\n`/bin` 目录存放二进制或编译后的文件。这意味着在这里可以找到程序，包括某些恶意软件。你绝对应该检查此目录。你可以在图\
  \ 9-3 中看到此目录的示例。\n\n![图 9-3 /bin 目录。](img/9781284244496_CH09_FIGF03.jpg)\n\n图 9-3\
  \ /bin 目录。\n\n### /sbin 目录\n\n该目录与 `/bin` ，但它包含了不供普通计算机用户的二进制文件。例如，通常由管理员使用的文件系统工具\
  \ `mke2fs` 命令就在此目录下。\n\n### /etc 文件夹\n\n`/etc` 文件夹包含配置文件。大多数应用程序在启动时都需要配置。Web 服务器、引导加载程序（LILO\
  \ 和 GRUB）以及许多其他应用程序都有配置文件。显然，系统的入侵者可能想要更改给定应用程序的行为。Web 服务器、引导加载程序和安全软件的配置文件对任何黑客来说都是非常有吸引的目标。\n\
  \n### /etc/inittab 文件\n\n这是设置启动过程和运行的地方。例如，系统启动时的 init 级别在此文件中设置。同样，高明的攻击者可能想要更改\
  \ `inittab` 以改变系统的行为。甚至某些高级恶意软件可能会修改你的 `inittab`。\n\n`inittab` 有许多目。每个条目由冒号分隔的四个字段定义。这些字段包括：\n\
  \n* `label`——一个多达四个字符的唯一标识标签。\n* `run_level`——执行该条目的 init 级别。\n* `action:a`——指示\
  \ `init` 对进程采取的动作的关键字。\n* `process`——`init` 在进入指定运行级别后执行的进程。\n* `boot`——启动进程并继续下一个条目，而无需等待进程完成。当进程死亡时，\n\
  * `wait`——启动进程并在等待进程完成后再继续下一个条目。\n* `default`——设置系统启动时的默认运行级别。\n* `idle`——在系统空闲时运行的操作。\n\
  * `sysinit`——在系统启动时运行的操作。\n* `halt`——在关机级别时运行的操作。\n\n## Linux 目录\n\n在任何操作系统中，都有对该操作系统运行至关重要的关键目录。在\
  \ Linux 中，这些目录是寻找证据的重要场所。了解主要目录的一般用途及其潜在的取证重要性，对于对 Linux 系统进行取证分析非常有帮助。\n\n### /root\
  \ 目录\n\n`/root` 目录是 root 用户的家目录。Linux 中的 root 等于 Windows 中的管理员。该目录是存放管理员数据的地方。\n\
  \n### /bin 目录\n\n`/bin` 目录存放二进制或编译后的文件。这意味着在这里可以找到程序，包括某些恶意软件。你绝对应该检查此目录。你可以在图 9-3\
  \ 中看到此目录的示例。\n\n![图 9-3 /bin 目录。](img/9781284244496_CH09_FIGF03.jpg)\n\n图 9-3 /bin\
  \ 目录。\n\n### /sbin 目录\n\n该目录与 `/bin` 相似，但它包含了不供普通计算机用户的二进制文件。例如，通常由管理员使用的文件系统工具\
  \ `mke2fs` 命令就在此目录下。\n\n### /etc 文件夹\n\n`/etc` 文件夹包含配置文件。大多数应用程序在启动时都需要配置。Web 服务器、引导加载程序（LILO\
  \ 和 GRUB）以及许多其他应用程序都有配置文件。显然，系统的入侵者可能想要更改给定应用程序的行为。Web 服务器、引导加载程序和安全软件的配置文件对任何黑客来说都是非常有吸引的目标。\n\
  \n### /etc/inittab 文件\n\n这是设置启动过程和运行的地方。例如，系统启动时的 init 级别在此文件中设置。同样，高明的攻击者可能想要更改\
  \ `inittab` 以改变系统的行为。甚至某些高级恶意软件可能会修改你的 `inittab`。\n\n`inittab` 有许多目。每个条目由冒号分隔的四个字段定义。这些字段包括：\n\
  \n* `label`——一个多达四个字符的唯一标识标签。\n* `run_level`——执行该条目的 init 级别。\n* `action:a`——指示\
  \ `init` 对进程采取的动作的关键字。\n* `process`——`init` 在进入指定运行级别后执行的进程。\n* `boot`——启动进程并继续下一个条目，而无需等待进程完成。当进程死亡时，\n\
  * `wait`——启动进程并在等待进程完成后再继续下一个条目。\n* `default`——设置系统启动时的默认运行级别。\n* `idle`——在系统空闲时运行的操作。\n\
  * `sysinit`——在系统启动时运行的操作。\n* `halt`——在关机级别时运行的操作。\n\n### /dev 目录\n\n该目录包含设备文件。设备文件实际上是设备的接口，包括驱动器。所有的设备文件在这个目录下。某些命名约定可以帮助你导航该目录。例如，所有硬盘以\
  \ `hd` 开头，软盘以 `fd` 开头，CD 驱动器以 `cd` 开头。因此，主硬盘可能命名为 `/dev/hd0`。软盘将是 `/dev/fd0`。\n\n\
  ### /mnt 目录\n\n许多设备（如软盘和 CD-ROM 驱动器）挂载在 `/mnt` 目录。任何驱动器在使用之前必须挂载。挂载的过程涉及操作系统访问并将其加载到内存中。现代\
  \ Linux 发行版会自动完成这一点。从取证的角度来看，检查此目录可以让你知道系统上挂载了哪些内容。\n\n### /boot 目录\n\n`/boot` 目录包含了启动所需的关键文件。你的引导加载程序（无论是\
  \ LILO 还是 GRUB）都会查看此目录。将内核镜像放在此处是常见做法。\n\n### /usr 目录\n\n此目录包含个人用户的子目录。在怀疑发生商业间谍活动的情况下，这些目录可能包含有价值的证据。\n\
  \n### /tmp 目录\n\n正如名称所示，该目录主要包含临时文件。然而，你可能会发现有关系统最近发生情况的数据。该目录包含了系统以及机器上运行的其他软件和应用程序所需的临时文件。存储在\
  \ /tmp 目录中的文件在系统重启时会被删除。这意味着必须对 `/tmp` 目录进行实时搜索。\n\n\n\n\n此子目录包含了各种系统文件的备份，例如 `/etc/shadow/`\
  \ 和 `/etc/inetd.conf`。这些文件通常以 `.bak` 扩展名或数字如 `.0`、`.1` 等进行命名。\n\n## /var/spool\n\
  \n此目录包含打印队列，因此查看当前打印队列中是否有内容可能非常重要。此外，尽管“spool”目录显然是为打印机设计的，但该目录在历史上一直是黑客隐藏文件和相互通信的喜选之地。\n\
  \n## /proc 目录\n\n`/proc` 目录在内存中创建，保存了有关当前运行进程的信息。它与硬盘上的任何其他目录不同，因为它并不是真的存储在你的硬盘上。如果你运行着实时\
  \ Linux 系统，并想在关机之前查看系统上运行了哪些程序，那么这个目录的内容非常有用。你可以在图 9-4 中看到 `/proc` 目录内容的示例。\n\n\
  ![图 9-4 /proc 目录。](img/9781284244496_CH09_FIGF04.jpg)\n\n图 9-4 `/proc` 目录。\n\n该目录还包含可以用于恢复文件和证据的子目录。考虑以下场景：假设一个入侵者下载了一个密码破解器，并正尝试破解系统。该工具正在尝试名为\
  \ `pass` 的文本文件中的多个密码。入侵者随后删除了可执行文件和文本文件，但该进程仍在内存中运行。你可以使用 `ps` 或 `pstree` 来找到运行的进程并获取进程\
  \ ID（PID）。假设进程 ID 为 `3201`。现在在 `/proc` 目录中，你可以找到 `/proc/3201`。如果你简单地将可执行文件从 `/proc`\
  \ 复制到其他目录，就能恢复出那个被删除的可执行文件。当然，这只在关机之前的实时系统上有效。\n\n## /run 目录\n\n此目录包含有关运行时数据的信息。它会在启动过程中被清除。在该目录中找到的部分内容以前位于\
  \ `/var/run`。事实上，在某些 发发行版中，`/var/run` 是指向 `/run` 的符号链接。你可以在图 9-5 中看到 `/run` 目录。\n\
  \n![图 9-5 /run 目录。](img/9781284244496_CH09_FIGF05.jpg)\n\n图 9-5 `/run` 目录。\n\n##\
  \ Tmpfs\n\nTmpfs（临时文件系统）是一种 Linux 文件系统，其内容仅存在内存。这意味着 `tmpfs` 挂载内部的文件和目录永远不会被写入本地磁盘，因此一旦卸载\
  \ `tmpfs`，整个文件系统就会被擦除。如果你能在系统关机之前捕获它，它可能包含有趣的数据。\n\n在某些 Linux 发行版中，`/tmp` 直接挂载为\
  \ `tmpfs`，因此只有通过捕获 `tmpfs` 你才能获得 `/tmp` 中的内容。Linux 还使用 `tmpfs` 通过 `/dev/shm` 实现共享内存。更高级的攻击者可以使用\
  \ `tmpfs` 下载恶意文件并将 `tmpfs` 作为暂存区域。\n\n你可以在此处找到更多关于 `tmpfs` 的信息：[`www.kernel.org/doc/html/latest/filesystems/tmpfs.html`](https://www.kernel.org/doc/html/latest/filesystems/tmpfs.html)\n\
  \n`tmpfs` 通常使用内存捕获进行捕获，这在文中另有讨论。具体命令为：\n\n![程序代码。在代码中，变量名中的单词已合并。第 1 行，linefs。第\
  \ 2 行，line。](img/9781284244496_CH09_07)\n\n\n\n\n\n`history` 命令允许你查看之前输入过的命令。默认情况下，此命令返回最后的\
  \ 500 条 shell 命令。该命令在运行中的系统上非常有用。当你首次定位到一个可疑的 Linux 机器时，在关机系统系统之前，这是你可能想要运行并记录结果的命令之一。这可以提供丰富的取证信息。例如，如果运行了\
  \ `touch` 命令，那是值得注意的，因为该命令可以修改文件的日期/时间戳。你可能还想找到特定用户的历史文件。你可以通过以下命令实现这一点：\n\n![程序代码。在代码中，变量名中的单词已合并。第\
  \ 1 行。find.*](img/9781284244496_CH09_07_UNIMG5.png)\n\n## mount 命令\n\n`mount` 命令用于挂载新的文件系统。当你添加驱动器时，必须对它们进行挂载。你会经常使用此命令，特别是当你有一个可疑的驱动器想要将其挂载到你的取证工作站时。大多数商业取证工具（如\
  \ Forensic Toolkit (FTK) 和 EnCase）都可以为你挂载驱动器；然而，许多取证分析师完全使用开源工具工作。在这种情况下，你需要手动挂载驱动器。\n\
  \n## ps 命令\n\n`ps` 命令显示当前用户运行的进程。默认情况下，`ps` 选择所有与当前用户具有相同 ID 且与调用者相同终端关联的进程。它显示进程\
  \ ID (PID)、与进程关联的终端 (TTY)、`dd-hh:mm:ss` 格式的累计 CPU 时间以及可执行文件名称。你可以向此命令添加标志位以获取有关进程的更多详细信息。以下是几个示例：\n\
  \n```\nps -aux\n```\n\n![程序代码。在代码中，变量名中的单词已合并。第 1 行。ps-aux。](img/9781284244496_CH09_07_UNIMG6.png)\n\
  \n显示更多信息：\n\n```\nps -ef\n```\n\n![程序代码。在代码中，变量名中的单词已合并。第 1 行。ps-ef。](img/9781284244496_CH09_07_UNIMG7.png)\n\
  \n这是你在关机可疑可运行系统之前想要运行的另一个命令。\n\n## pstree 命令\n\n`pstree` 命令与 `ps` 命令非常相似，不同在于它以树结构的形式显示所有进程。树格式提供了特定于特定取证调查的信息。你不仅知道哪些进程正在运行，还知道哪个进程启动了这些进程。你可以查看图\
  \ 9-7 的示例。\n\n![图 9-7 pstree 命令。](img/9781284244496_CH09_FIGF07.jpg)\n\n图 9-7 `pstree`\
  \ 命令。\n\n## pgrep 命令\n\n`pgrep` 命令根据你提供的名称并返回该进程的 PID。它甚至可以处理部分名称。这非常有用，因为许多其他命令需要\
  \ PID，所以如果你知道进程名称，`pgrep` 可以帮助你检索它。\n\n## top 命令\n\n`top` 命令与 `ps` 命令类似，不同在于它会列出进程的资源占用情况。`top`\
  \ 命令可以让你实时监控系统状态。\n\n## kill 命令\n\n`kill` 命令用于向进程发送信号，通常用于终止进程。当你发现恶意软件正在运行时，可以使用该命令来停止它。\n\
  \n\n\n\n\n异常位置的异常项目可能表明有人对机器进行了篡改。我们之前讨论过寻找内容空的日志，或者 `/tmp` 目录下的二进制文件。有几个命令可以发现异常情况。以下是一些常用命令：\n\
