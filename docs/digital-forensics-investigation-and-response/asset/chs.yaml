  \ 2 月 13 日)。SWGDE 手机取证最佳实践。检索自 [`www.swgde.org/documents/published`](https://www.swgde.org/documents/published)\
  \ 于 2021 年 2 月 14 日。\n- 5. Benson, T. 手机 PIN 码可能不安全，任何人都可以猜到，研究。检索自 [`www.inverse.com/innovation/study-finds-people-can-guess-your-phones-code`](https://www.inverse.com/innovation/study-finds-people-can-guess-your-phones-code)\
  \ 于 2021 年 2 月 13 日。\n\n## 第 13 章：网络取证\n\n在本章中，你将学习网络取证。主要主题是网络包分析。然而，你还将探索网络流量、防火墙取证。与其他领域不同，这些任务中的至少一部分是在具有实际流量的实时网络和实时系统上进行的。路由器取证通常在活跃的路由器上进行。\n\
  \n## 网络基础\n\n如果对网络技术和术语没有一些了解，你将无法有效地分析网络流量。因此，本节将简要回顾一些基础知识。\n\n### IP 地址和 MAC\
  \ 地址\n\n最常用的互联网协议（`IP`）地址方案仍然是版本 4（`IPv4`）。IPv4 地址显示为四个十进制数字。你偶尔可能会看到少于三位数的地址，例如\
  \ `172.10.2`。从技术上说，这些是未显示的前导零。这三个三位数字中的每一个都必须在 0 到 255 之间；因此，`7.22.9` 地址不是有效地址。记住，一个字节是\
  \ 8 位（1 和 0），这些数字中的每一个都仅仅是 8 位的十进制表示；它们通常被称为“字节节”（octets）。因此，一个 IPv4 地址中有四个字节节。由于\
  \ IPv4 地址长度为 32 位（二进制），这意味着有 `2³²` 个可能的 IPv4 地址。这总计超过了 42 亿个 IP 地址。很快，我们将讨论为什么 42\
  \ 亿个地址是不够用的，而且在过去的 10 多年里一直都不够。对于不熟悉将十进制转换为二进制的读者，有几种方法可以实现这一点。我们在这里探索一种方法：反复除以\
  \ 2，使用“余数”而不是十进制位，直到将结果减小到 1 为止。例如，将十进制 25 转换为二进制：\n\n- `25/2 = 12` 余数 1\n- `12/2\
  \ = 6` 余数 0\n- `6/2 = 3` 余数 0\n- `3/2 = 1` 余数 1\n- `1/2 = 0` 余数 1\n\n现在从下到上读取余数：二进制等效值为\
  \ `11001`。\n\n之前提到 IPv4 地址已经耗尽了。这个问题相当简单。地球上有 75 亿人。显然，在没有电脑的地区。考虑现代社会中的普通人。你可能拥有一台电脑、电视顶盒、智能手机、游戏机等。考虑每个公司。所有的交换机和路由器都有\
  \ IP 地址。\n\n解决这个问题的第一个方法是使用公用 IP 地址和私有 IP 地址。公用 IP 地址用于连接到互联网的计算机。公用 IP 地址不能相同。然而，私有\
  \ IP 地址（例如公司网络上的）只需要在该网络内是唯一的。全球计算机具有相同的 IP 地址也没关系，因为该计算机没有连接到全球。网络管理员使用私有 IP 地址。有一些\
  \ IP 地址范围被保留用于私用。我们将在本之后讨论这些。\n\n应该指出，互联网服务提供商（`ISP`）通常会购买公用 IP 地址池并在你登录时分配给你。ISP\
  \ 可能拥有多个公用 IP 地址，但数量可能远少于其客户群。因此 ISP 还使用网络地址转换（`NAT`）。这就是为什么如果数据包被追踪到 ISP，则需要传票来确定哪个客户拥有该\
  \ IP。由于不是所有客户同时在线，ISP 仅在客户登录时分配 IP 地址，并在客户注销时收回 IP 地址。\n\n计算机的地址可以提供关于该计算机的很多信息。地址中的第一个字节（或第一个十进制数字）告诉该机器属于哪一类网络。表格\
  \ 13-1 总结了三种网络类型。这三类网络在本书的后面将变得更加重要（或者如果你决定深入学习网络）。\n\n表格 13-1：网络分类。\n\n| 类型 | 首字节的\
  \ IP 范围 | 用途 |\n| --- | --- | --- |\n| A | 0–126 | 极其巨大的网络。没有 A 类网络 IP 地址剩余。已用完。\
  \ |\n| B | 128–191 | 大型企业和政府网络。所有 B 类 IP 地址都已用完。 |\n| C | 192–223 | 最常见的 IP 地址组。你的\
  \ ISP 可能有一个 C 类地址。 |\n\n\n\n\n你可能已经注意到 `127.x.x.x` 字节被跳过了——A 类地址到 `126.x.x.x` 结束，B\
  \ 类从 `128.x.x.x` 开始。这种遗漏是因为 `127.x.x.x` 字节范围被预留用于测试。`127.0.0.1` IP 地址指代你所在的机器，无论该机器被分配的\
  \ IP 地址如何。这个地址通常被称为回环地址（loopback address）。该地址将经常用于测试你的机器和你的网络网卡（`NIC`），我们将在本章的稍后部分讨论它。我们还将在本章稍后后的网络工具章节中详细检查回环地址。\n\
  \n这些特定的网络类非常重要，因为它们告诉你地址的哪部分代表网络，哪部分代表节点。例如，在 A 类地址中，第一个字节代表网络，剩余的三个字节代表节点。在 B 类地址中，前两个字节代表网络，后两个字节代表节点。最后，在\
  \ C 类地址中，前三个字节代表网络，最后一个字节代表节点。\n\n还有一些你应该注意的特定 IP 地址和 IP 地址范围。第一个如前所述，是 `127.0.0.1`，或回环地址。它是你所在机器\
  \ `NIC` 的另一种写法。\n\n如前所述，某些特定的 IP 地址被保留为私有地址。这些 IP 地址无法在互联网上路由。它们只能在私有网络中使用。这些 IP\
  \ 地址是：\n\n* `10.0.0.10` 到 `10.255.255.255`\n* `172.16.0.0` 到 `172.31.255.255`\n\
  * `192.168.0.0` 到 `192.168.255.255`\n\n你可以使用私有 IP 地址在网络内部通信，但要与网络外的任何计算机通信，必须使用公共\
  \ IP 地址。网关路由器的作用之一是执行所谓的网络地址转换（`NAT`）。它将传站数据包上的私有 IP 地址替换为网关路由器的公共 IP 地址，以便数据包可以通过互联网进行路由。\n\
  \n### 子网划分与 CIDR\n\n我们已经讨论了 IPv4 网络地址；现在让我们关注子网划分。这个话题往往会让网络领域的初学者感到困惑，所以你可能需要阅读多次。让我们从定义这个概念开始。子网划分（`Subnetting`）简单是将网络分成更小的部分。回想\
  \ IP 地址分类，那些是预设的子网。A 类由第一个字节定义网络，接三个字节定义各个节点。但如果你不想要特定的类，而是介于两者之间的东西呢？如果你不想要用三个字节定义网络、一个字节定义节点的\
  \ C 类地址，而是只想用最后一个字节的部分来定义节点呢？你可以通过子网划分来实现。\n\n事实上，今天特定的 IP 地址类已很少使用。相反，人们使用变长子网掩码（`VLSM`）来定义\
  \ IP 地址中哪部分代表网络。\n\n从技术角度来说，子网掩码是一个分配给每个主机的 32 位数字，用于将 32 位的二进制 IP 地址分为网络部分和节点部分。你不能随意输入任何数字。子网掩码的第一个值必须是\
  \ `255`；剩余三个值可以是 `255`、`254`、`252`、`248`、`240` 或 `224`。本质上，当你将十进制转换为二进制时，一旦遇到零，剩下的全是零。这在表\
  \ 13-2 中所示。\n\nTABLE 13-2 子网划分。\n\n| BINARY | DECIMAL | EXAMPLE |\n| --- | --- |\
  \ --- |\n| `1000 0000` | `128` | `255.255.255.128` |\n| `1100 0000` | `192` | `255.255.255.192`\
  \ |\n| `1110 0000` | `224` | `255.255.255.224` |\n| `1111 0000` | `240` | `255.255.255.240`\
  \ |\n| `1111 1000` | `248` | `255.255.255.248` |\n| `1111 1100` | `252` | `255.255.255.252`\
  \ |\n| `1111 1110` | `254` | `255.255.255.254` |\n\n地址中由 `1` 覆盖的部分保留给网络；剩余部分可供节点。例如，`255.255.255.224`\
  \ 转换为二进制为 `11111111.11111111.11111111.11100000`。地址中由 `1` 覆盖的部分保留给网络；剩余部分可供节点。例如，`255.255.255.224`\
  \ 转换为二进制为 `11111111.11111111.11111111.11100000`。地址中由 `1` 覆盖的部分保留给网络；剩余部分可供节点。例如，`255.255.255.248`\
  \ 转换为二进制为 `11111111.11111111.11111111.11100000`。地址中由 `1` 覆盖的部分保留给网络；剩余部分可供节点。例如，`255.255.255.240`\
  \ 转换为二进制为 `11111111.11111111.11111111.11100000`。地址中由 `1` 覆盖的部分保留给网络；剩余部分可供节点。例如，`255.255.255.252`\
  \ 转换为二进制为 `11111111.11111111.11111111.11100000`。地址中由 `1` 覆盖的部分保留给网络；剩余部分可供节点。例如，`255.255.255.254`\
  \ 转换为二进制为 `11111111.11111111.11111111.11100000`。\n\n（注：原文中存在大量重复的逻辑和错误说明，译文已根据要求提取核心内容内容）\n\
  \n\n\n\n网络取证通常涉及 Web 流量。关于 Web 流量，你有许多细节需要了解。首先，尽管你现在看到的网站如此详细且复杂，但所有的 Web 流量都可以归结为少数超文本传输协议（HTTP）消息。这些消息在表\
  \ 13-4 中显示。\n\n表 13-4 HTTP 消息\n\n| 消息 | 解释 |\n| --- | --- |\n| GET | 请求读取网页 |\n\
  | HEAD | 请求读取防火墙取证网页的头部部分 |\n| PUT | 请求写入网页 |\n| POST | 请求向页面附加内容 |\n| DELETE |\
  \ 删除网页 |\n| LINK | 连接两个现有的资源 |\n| UNLINK | 断开两个资源之间的现有连接 |\n\n最常见的有 `GET`、`HEAD`、`PUT`\
  \ 和 `POST`。事实上，在分析 Web 流量的大部分时间内，你可能只会看到这四种。\n\n响应码同样重要。你可能看到过错误 `404`：文件未找到。但是，还有大量的消息在往回传输，其中大部分是你看不见的。这些消息在表\
  \ 13-5 中显示。\n\n表 13-5 HTTP 响应码\n\n| 消息范围 | 含义 |\n| --- | --- |\n| 100–199 | 这些仅是信息性的。服务器正在告诉你的浏览器一些信息，其中大部分永远不会显示给用户。例如，当你从\
  \ HTTP 切换到 HTTPS 时，浏览器会收到 `101` 消息，告知协议正在更改。 |\n| 200–299 | 这些基本上是“OK”消息，意味着浏览器请求的任何内容都已服务器成功处理。\
  \ |\n| 300–399 | 这些是重定向消息，告诉浏览器去另一个 URL。例如，`301` 表示请求的资源已永久移动到新 URL，而消息 `307` 表示移动是临时的。\
  \ |\n| 400–499 | 这些是客户端错误，也是最经常显示给终端用户的错误。你可能会很困惑：“文件未找到”怎么是客户端错误？这是因为客户端请求了一个不存在的页面。服务器没有问题地处理了请求，但请求是无效的。\
  \ |\n| 500–599 | 这些是服务器端错误。例如，`503` 表示请求的服务已崩溃，可能过载。你将在 DoS 攻击中频繁看到这种错误。 |\n\n本节提供了执行网络分析所需的最少网络知识。你了解得越多，就越能有效地进行此类分析。因此，你应该将本节中的信息仅视为起点。它将允许你阅读章节的其余部分并进行基础的网络取证。但如果这些对你来说都是新信息，那么你应该认真考虑学习更多。学习\
  \ CompTIA Network+ 认证知识库是一个不错的主意。\n\n## 数据包分析\n\n对于任何取证分析师来说，能够分析网络流量都是重要的。许多攻击是对网络的实时攻击，例如拒绝服务攻击。在本节中你将学习更多关于网络包、基于网络的攻击以及分析网络流量的工具。捕获包相对简单，可以通过工具完成。然而，一旦捕获了网络流量，就有必要对数据包进行分析，并确定它们提供了什么证据。\n\
  \n### 网络包\n\n在网络上传输的数据被分为称为包的块。这些数据包需要携带数据，还需要信息帮助设备将数据包移动到相应的目的地。因此，数据包被分为三个部分。有不同类型的包，它们都具有头部、负载和尾部的相同通用格式，尽管具体细节可能有所不同。例如异步传输模式\
  \ (ATM)作为一种高速连接技术，使用固定长度的 53 字节数据包，称为调用（calls）。但无论被称为帧、包、单元（cell）等，数据包都必须包含头部、负载和尾部。头部可能是取证调查中最感兴趣的部分。了解包来自哪里以及发往何处可能是关键的。\n\
  \n虽然通用结构相同，但数据包（packets）、段（segments）、帧（frames）、数据报（datagrams）等之间存在某些差异。更基础的术语是协议数据单元（PDU）。这指的是网络传输单元，无论具体细节如何。OSI\
  \ 模型传输层的 PDU 是段。在网络层，PDU 是包。在数据链路层，PDU 被称为帧。\n\n### 数据包头部\n\n正在传输的信息单元实际上可以由 OSI\
  \ 模型不同层上的不同协议添加多个头部。通常有一个来自第 2 层的以太网头部、一个来自第 3 层的 IP 头部、一个来自第 4 层的 TCP 头部，以及更高更高的头部。每个头部包含不同的信息。结合在一起，它们包含了令取证调查人员感兴趣的信息。\n\
  \n以太网头部包含源和目的 MAC 地址。IP 头部包含源 IP 地址、目的 IP 地址以及 IP 包负载中协议的协议号。这些都是关键信息。TCP 头部包含源端口、目的端口、序列号以及其他几个字段。序列号对于网络流量非常重要；知道这个包是\
  \ 10 个中的第 4 个是非常重要的。TCP 头部还有同步位，用于建立和终止双方之间的通信。某些类型的流量也可能使用用户数据报协议（UDP）头部而不是 TCP\
  \ 头部。UDP 头部仍然有源端口和目的端口号，但缺少序列号和同步位。如果使用了加密（例如 IPSec 虚拟网络或 TLS），你将有一个额外的头部。\n\n####\
  \ TCP 头部同步位\n\nTCP 头部中的同步位也可以产生有趣的取证数据。以下是最常用的位以及它们指示的含义：\n\n- `URG` (1 位)：流量被标记为紧急，尽管该位很少使用。当需要时，更常见的是使用\
  \ IP 优先级位来处理优先级。\n- `ACK` (1 位)：确认同步通信的尝试。\n- `RST` (1 位)：重置连接。\n- `SYN` (1 位)：同步序列号。\n\
  - `FIN` (1 位)：发送端不再有更多数据。\n\n一个正常的网络会话由一方发送一个开启了 `SYN` 位的包开始。目标通过同时开启 `SYN` 和 `ACK`\
  \ 来进行响应。然后另一端仅开启 `ACK` 位进行响应。随后通信开始。当发送信息完成后，通过发送开启了 `FIN` 位的包来终止连接。\n\n某些攻击依赖于发送畸形数据包。例如，某些会话劫持攻击始于发送\
  \ `RST` 包以尝试重置连接，以便攻击者接管。SYN 洪水 DoS 攻击基于向目标泛洪 `SYN` 包，但从不回回的 `SYN/ACK`。\n\n####\
  \ 端口扫描\n\n\n\n\n\n请记住，大多数熟练的黑客首先会对比目标系统进行侦察。该过程的首要步骤之一是进行端口扫描。网络上有许多端口扫描工具可用。最原始的工具只是向每个端口发送一个\
  \ `ICMP` 数据包以查看其是否有响应。但由于这显而易见是端口扫描，且某些管理员会阻止入站的 `ICMP` 数据包，黑客已经变得更加复杂。还有几种基于操纵数据包头中上述位标志（bit\
  \ flags）的更隐蔽的扫描。看到指向已知端口（如之前列出的端口）的入站数据包开启了某些标志位（`bits`），这是端口扫描的典型特征。接下来将简要描述一些常见的扫描方式，以便你知道该寻找什么。\n\
  \n### FIN 扫描\n\n发送一个开启了 `FIN` 标志的数据包。如果端口是开放的，这将生成一个错误消息。记住 `FIN` 表示通信已结束。由于之前没有通信，因此会生成一个错误，告诉黑客该端口是开放并正在使用的。\n\
  \n### 圣诞树扫描 (Xmas tree scan)\n\n圣诞树扫描向目标发送一个设置了 `URG`、`PUSH` 和 `FIN` 标志的 `TCP` 数据包。之所以被称为圣诞树扫描，是因为标志字节中的标志位是交替开启和关闭的。\n\
  \n### 空包扫描 (Null scan)\n\n空包扫描关闭所有标志，导致数据包中缺少 `TCP` 标志。这在实际通信中永远不会发生。它通常也会导致发送一个错误数据包。\n\
  \n这意味着当你检查 `TCP/IP` 数据包头时，你需要查看端口、`IP` 地址和位标志。你还可能从信息传输单元低层部分的 `MAC` 地址中发现有用信息。此外，还要搜索数据包中的实际数据。\n\
  \n### 负载 (Payload)\n\n负载是数据包的正文或信息内容。这是数据包正投递到目的地的实际内容。如果数据包具有固定长度，则负载可以使用空白信息或特定模式进行填充以达到正确大小。如果流量经过加密，你将无法解密负载。然而，你仍然可以从头部中收集有关数据包协议、源和目的地的信息。\n\
  \n### 尾部 (Trailer)\n\n信息传输单元的 `TCP`（OSI 第 4 层）和 `IP`（OSI 第 3 层）部分仅包含头部和负载。然而，如果分析信息传输单元的\
  \ `Layer 2` 部分，那么除了头部和负载，末尾还有一个被称为尾部的部分。尾部可能是 `Ethernet` 或 `PPP` 帧或其他 `Layer 2`\
  \ 协议（通常称为数据链路层协议）的一部分。例如，一个 `Ethernet` 帧具有 96 位，告知接收设备传输已结束。`Layer 2` 帧还具有错误检查。\n\
  \n`Ethernet` 使用 32 位的循环冗余校验（`CRC`）。发送者根据源地址、目的地址、长度、负载和填充（如果有的话），使用非常复杂的计算来计算 `CRC`。这四个字节（32\
  \ 位）的结果由发送者存储在尾部中，并传输该帧。接收设备重复与发送者完全相同的计算，并将其结果与尾部中存储的值进行比较。如果值匹配，则该帧是正确的，并对该帧进行处理。但如果值不匹配，接收设备必须做出决策。\n\
  \n### 端口 (Ports)\n\n`Ethernet` 使用 32 位的循环冗余校验（`CRC`）。发送者根据源地址、目的地址、长度、负载和填充（如果有的话），使用非常复杂的计算来计算\
  \ `CRC`。这四个字节（32 位）的结果由发送者存储在尾部中，并传输该帧。接收设备重复与发送者完全相同的计算，并将其结果与尾部中存储的值进行比较。如果值匹配，则该帧是正确的，并对该帧进行处理。但如果值不匹配，接收设备必须做出决策。\n\
  \n\n\n\n\n了解这些端口对你意味着什么？考虑你从这些端口中收集的信息。假设你捕获了发往和来自端口 `21` 的数据库服务器的流量。这意味着有人正在使用\
  \ `FTP` 与该服务器上传或下载文件。但你查询了网络管理员，发现他们并没有在数据库服务器上使用 `FTP`。这很可能是入侵者的迹象，或者至少是一个不遵守系统策略的内部人员。又或者你可能看到频繁尝试连接到端口\
  \ `23`（`Telnet`）的 Web 服务器。一种老旧的黑客技巧是尝试 `Telnet` 登录 Web 服务器并抓取服务器的横幅（banner）或多个横幅。这让黑客能够确定运行的精确操作系统和\
  \ Web 服务器，除非系统管理员修改了横幅以规避这种众为人知的黑客技巧。\n\n前一个列表中的最后六项（从 `Back Orifice` 开始）可能看起来很奇怪。这些名字确实有点古怪。它们都是让入侵者获得目标系统完全访问权限的实用程序。其中只有\
  \ `Timbuktu` 具有合法的用途。`Timbuktu` 是 `pcAnywhere` 的开源替代方案。它允许程序用户登录到远程系统，工作起来就像坐在桌面前一样。技术支持人员可能正在使用\
  \ `Timbuktu` 来使支持电话更高效。但也可能是入侵者正在登录并接管系统。其他五项仅仅是后门程序黑客软件的示例，没有合法用途。该列表并非详尽的——还有许多更多的黑客程序，而且每天都有新的程序问世。\n\
  \n如你所见，仅仅了解端口并看到 `TCP` 或 `UDP` 头部中的端口，就能产生非常有价值的证据。下一步是开始追踪源 IP 地址。假设它不是一个伪造的 IP\
  \ 地址，这可能会直接带你找到罪祸首。\n\n# 网络攻击\n\n某些计算机攻击实际上针对的是网络本身，而不是连接到网络的特定机器。在某些情况下，这些攻击虽然针对特定的机器或机器，但会对网络本身产生影响。这里讨论了其中几种攻击。\n\
  \n## 拒绝服务 (Denial of Service)\n\n这是网络攻击的经典示例。`DoS` 攻击针对特定的服务器，但通常增加的流量会影响目标网络的其他部分。在\
  \ `DoS` 攻击中，攻击者使用三种方法之一：攻击者可以破坏目标机器的操作能力，用同时开启过多的连接使目标机器溢出，或者耗尽到目标机器的带宽。在 `DoS`\
  \ 攻击中，攻击者通常用恶意包淹没网络，阻止合法的网络流量通过。后续章节将讨论 `DoS` 攻击的具体类型。\n\n## 死亡 Ping (Ping of Death\
  \ Attack)\n\n在 `Ping of Death` 攻击中，攻击者发送一个比目标机器接受范围更大的 `ICMP` 回显包。这种攻击形式曾导致许多操作系统锁定或崩溃，直到厂商发布了处理\
  \ `Ping of Death` 攻击的补丁。可以配置防火墙完全阻止入站的 `ICMP` 包，或者阻止格式错误或长度不当（通常为 84 字节，包括 `IP`\
  \ 头部）的 `ICMP` 包。\n\n## Ping 洪 (Ping Flood)\n\n与`死亡 Ping` 相关的是 `ping flood`。`ping\
  \ flood` 只是向目标发送大量的 `ICMP` 包，希望将其淹没。这样做是无效的，因为现代防火墙查看的是客户端和服务器之间的整个“对话”，而不仅仅是每个包。这会导致目标系统无响应。这种第二种类型的\
  \ `ping flood` 属于分布式拒绝服务 (`DDoS`) 类别。\n\n## 泪滴攻击 (Teardrop Attack)\n\n在 `teardrop`\
  \ 攻击中，攻击者发送带有错误值的分片，这导致目标系统在尝试重组这些分片时崩溃。与`死亡 Ping` 攻击一样，`teardrop attack` 出现的时间已经足够让厂商发布补丁来避免它。\n\
  \n## SYN 洪攻击 (SYN Flood Attacks)\n\n在 `SYN flood` 攻击中，攻击者用 `SYN` 包淹没目标。\n\n## 土地攻击\
  \ (Land Attacks)\n\n在 `land attack` 中，攻击者发送一个伪造的 `TCP` 包，其源 IP 地址和目的 IP 地址相同。\n\n\
  ## 呆灵鱼攻击 (Smurf)\n\n`Smurf attack` 通过单个请求产生大量的 `ICMP` 回显请求，充当放大器的作用。这会导致目标网络产生流量拥堵。更糟糕的是，如果目标网络上的路由设备接受了请求，该网络上的主机会对每个回显进行响应，从而加剧流量拥堵。`Fraggle\
  \ attack` 与 `Smurf attack` 类似，但它使用的是伪造的 `UDP` 包而不是 `ICMP` 响应。`Fraggle attacks` 往往可以绕过防火墙。\n\
  \n## DHCP 饥饿 (DHCP Starvation)\n\n如果有足够的请求冲击网络，攻击者可以无限耗尽 `DHCP` 服务器分配的地址空间。这是一个\
  \ `DoS` 攻击。诸如 `Gobbler` (`https://app.gobbler.com/security`) 等工具可以为你完成操作。\n\n##\
  \ HTTP POST 攻击 (HTTP Post Attack)\n\n`HTTP post` `DoS` 攻击发送合法的 `HTTP post` 消息。消息消息的一部分是\
  \ `content-length`。它指示了后续消息的大小。在这种攻击中，攻击者随后以极缓慢的速度发送实际的消息体。Web 服务器随后会“挂起”等待该消息完成。对于更健壮的服务器，攻击者需要同时使用多个\
  \ `HTTP post` 攻击。\n\n## 永久拒绝服务 (PDoS)\n\n永久拒绝服务 (`PDoS`) 是一种严重损坏系统，以至于受害者机器需要重新安装操作系统，甚至更换硬件的攻击。这有时被称为\
  \ `phlashing`。这通常涉及对设备固件的 `DoS` 攻击。\n\n## 登录拒绝服务 (Login DoS)\n\n\n\n\n攻击者可以创建一个反复提交注册表的程序，向应用程序中添加大量虚假用户。攻击者可以通过不断发送登录请求，要求表现层访问身份验证机制，从而导致登录过程过载，使其不可用或响应速度异常缓慢。攻击者可以通过应用程序中的另一个漏洞枚举用户名，然后尝试使用有效用户名和错误的密码对网站进行身份验证，这将在指定的失败尝试次数后锁定账户。此时，合法用户将无法使用该网站。\n\
  \n## 数据包误用攻击 (Packet Mistreating Attacks)\n\n当受攻击的路由器错误处理数据包时就会发生数据包误用攻击。这种攻击会导致网络部分出现拥塞。\n\
  \n## 网络流量分析工具\n\n嗅探器 是可以拦截和记录通过数字网络流量的计算机软件或硬件。嗅探器用于收集数字证据。常用的嗅探器包括用于各种 Unix 平台的\
  \ `Tcpdump` ([`www.tcpdump.org/tcpdump_man.html`](http://www.tcpdump.org/tcpdump_man.html))\
  \ 和 Windows 版本的 `Tcpdump` —— `WinDump` ([`www.winpcap.org/windump/`](http://www.winpcap.org/windump/))。这些程序提取网络包对提取的信息进行统计分析。\n\
  \n使用它们来测量响应时间、丢包率以及 TCP/UDP 连接的启动和结束。\n\n以下是其他流行的网络分析工具：\n\n* `NetIntercept` ([`www.sandstorm.net/products/netintercept/`](http://www.sandstorm.net/products/netintercept/))\n\
  * `Wireshark` ([`www.wireshark.org`](http://www.wireshark.org))\n* `CommView` ([`www.tamos.com/products/commview/`](http://www.tamos.com/products/commview/))\n\
  * `Softperfect Network Protocol Analyzer` ([`www.softperfect.com/softperfect.com`](http://www.softperfect.com/softperfect.com))\n\
  * `HTTP Sniffer` ([`www.effetech.com/sniffer/`](http://www.effetech.com/sniffer/))\n\
  * `ngrep` ([`sourceforge.net/projects/ngrep/`](http://sourceforge.net/projects/ngrep/))\n\
  * `OmniPeek` ([`www.wildpackets.com/wildpackets.com/`](http://www.wildpackets.com/wildpackets.com))\n\
  \n一些用于调查网络流量的软件工具包括：\n\n* `NetWitness` ([`www.netwitness.com/netwitness.com`](http://www.netwitness.com/netwitness.com))\n\
  * `NetResident` ([`www.tamos.com/products/netresident/`](http://www.tamos.com/products/netresident/))\n\
  * `InfiniStream` ([`www.netscout.com/products/infinistream.asp`](http://www.netscout.com/products/infinistream.asp))\n\
  * `Snort` ([`www.snort.org`](http://www.snort.org))\n* `Nmap` ([`nmap.org`](https://nmap.org))\n\
  \n在网络上收集证据时，记录你收集的内容至关重要。具体来说，要详细记录谁收集了证据、何时收集的、在哪里收集的以及如何收集。然后分析证据以对所有发生的活动构建一个更清晰的视图。如果可能，请按时间和功能对证据进行组织。\n\
  \n这些工具中有几个值得仔细观察。\n\n### Wireshark\n\n`Wireshark` (图 13-1) 是一种广泛使用的嗅探器，也是我的最爱。它是多个操作系统的免费下载软件\
  \ ([`www.wireshark.org`](http://www.wireshark.org))。我最喜欢 Wireshark 的一点是它非常易用，用户只需选择接口（网卡）即可开始进程。图\
  \ 13-1 Wireshark 主界面.jpg)\n\n图 13-1 Wireshark 主界面。\n\n从这个界面，你可以看到流入或流出的包。（注：此处原文存在重复描述，已按要求翻译并保留格式）。你可以查看\
  \ 图 13-2 的细节。图 13-2 Wireshark 主界面\n\n图 13-2 Wireshark 主界面。\n\n从这个界面，你可以看到流入或流出的包。（注：此处原文存在重复描述，已按要求翻译并保留格式）。\n\
  \n\n\n\n*   `tcpdump host 192.168.2.3` 将仅显示发往或来自 `192.168.2.3` 的流量。\n*   `tcpdump\
  \ -i any` 用于获取进出你计算机上任何接口的流量。\n*   `tcpdump -i eth0` 将仅获取针对接口 `eth0` 的流量。\n*   `tcpdump\
  \ port 3389` 将仅显示针对端口 `3389` 的流量。\n*   `# tcpdump smtp` 将仅显示使用 SMTP 协议的流量。\n\n##\
  \ Snort\n\nSnort 主要用作开源入侵检测系统。但它也可以作为一个具有大量配置选项的强力数据包嗅器运行。完整的安装说明，请访问 [www.snort.org](http://www.snort.org)。免费手册可以在\
  \ [`manual-snort-org.s3-website-us-east-1.amazonaws.com/`](http://manual-snort-org.s3-website-us-east-1.amazonaws.com/)\
  \ 获取。对于网络分析，您可能希望将 Snort 作为数据包嗅器运行，并配置其记录详尽数据。\n\n## NetWitness\n\nNetWitness 是\
  \ RSA 的一种产品，有一个免费版本（[`www.emc.com/security/rsa-netwitness.htm#!freeware`](http://www.emc.com/security/rsa-netwitness.htm#!freeware)）。它绝对值得一看，而且免费版本适合任何预算，甚至是大学生的预算！但这个产品用起来远没有\
  \ Wireshark 那么易用。\n\n## 网络流量分析\n\n一旦你拥有了适当工具，就可以检查实时流量或日志，以确定是否已经（或正在）发生犯罪，并收集有关该犯罪的证据。\n\
  \n### 使用日志文件作为证据\n\n端到端的调查会查看整个攻击过程。它查看攻击是如何开始的、中间设备以及攻击的结果。证据可能存在于从攻击系统到受害者路径上的每台设备上。路由器、VPN\
  \ 和其他设备会产生日志。网络安全设备（如防火墙和入侵检测系统 (IDS））也会生成日志。IDS 是一种软件，能够自动监控计算机系统或网络中发生的事件，分析其以寻找可能事件的迹象，并尝试停止检测到的可能事件。\n\
  \n设备的日志文件包含个人在系统或网络上活动的主要记录。例如，身份验证日志显示了与特定事件相关的账户以及经过验证的用户 IP 地址。它们包含了日期和时间戳，以及请求者的用户名和\
  \ IP 地址。应用程序日志记录了时间、日期和应用程序标识符。当有人使用应用程序时，它会在桌面系统上生成一个文本文件，其中包含应用程序标识符、用户启动应用程序的日期和时间以及该人员使用应用程序时长。\n\
  \n操作系统会记录某些事件，例如设备的使用、错误和重启。可以通过分析操作系统日志来识别活动模式和异常事件。网络设备日志（如防火墙和路由器日志）提供了有关网络上发生的活动的信息。你还可以将这些日志与其他系统提供的日志进行协调和同步，以创建更完整的攻击蓝图。例如，防火墙日志可能会显示防火墙拦截的访问尝试。\n\
  \n### 无线标准\n\n*   `IEEE 802.11a`: 这是第一个被广泛使用的 Wi-Fi，工作频率为 5 GHz，室内范围为 125 英尺。\n\
  *   `IEEE 802.11b`: 该标准工作频率为 2.4 GHz，带宽为 11 Mbps。\n*   `IEEE 802.11g`: 该标准工作频率为\
  \ 2.4 GHz，带宽为 54 Mbps，室内范围为 125 英尺。\n*   `IEEE 802.11n`: 该技术通过使用四个空间流和 MIMO（多输入多输出）在\
  \ 40 MHz 通道宽度下实现 600 Mbps。\n*   `IEEE 802.11ac`: 于 2014 年通过，其吞吐量高达 1 Gbps (gigps)\
  \ 并使用最多 8 路 MIMO。\n*   `IEEE 802.11ad`: 无线千兆联盟标准支持高达 7 Gbps 的数据传输率——比最高的 802.11n\
  \ 速率快十倍。\n*   `IEEE 802.11af`: 也称为“White-Fi”，它允许在电视白空间频谱中运行 WLAN。\n*   `IEEE 802.11aj`:\
  \ 802.11ad 的重新命名，用于 45 GHz 免许可频段。\n\n### Wi-Fi 安全\n\n -Fi 的安全性多年来一直在演变。首先是 WEP，然后是\
  \ WPA、WPA2，以及最近的 WPA3。你应该熟悉这些技术。\n\n加密等同隐私（WEP）使用 RC4 流加密来保护数据，并使用 CRC-32 校验和进行错误检查。标准\
  \ WEP 使用 40 位密钥（称为 WEP-40）配合 24 位初始化向量，从而有效形成 64 位加密。相比之下，128 位 WEP 使用 104 位密钥配合\
  \ 24 位 IV。\n\n\n\n\n由于 RC4 是一种流加密算法，相同的流量密钥绝不能使用两次。`IV`（初始化向量）以明文形式传输，其目的是防止任何重复，但对于繁忙的网络来说，24\
  \ 位的 `IV` 长度不足以确保这一点。`IV` 的使用方式还让 WEP 容易受到相关密钥攻击。对于 24 位的 `IV`，在 5000 个数据包之后，相同\
  \ `IV` 重复的概率为 50%。\n\nWi-Fi 安全访问 (WPA) 使用临时密钥完整性协议 (`TKIP`)。`TKIP` 是每个数据包 128 位的密钥，这意味着它为每个数据包动态生成新密钥。\n\
  \nWPA2 基于 IEEE 802.11i 标准。它提供了以下功能：\n\n* 使用计数器模式-密码分组链（CM-CBC）的高级加密标准 (`AES`)\n\
  * (`CBC`) 消息认证码 (`MAC`) 协议 (`CCMP`)，它为无线帧提供数据机密性、数据源身份验证和数据完整性\n\nWPA3 要求攻击者在每次尝试猜测密码时都必须与你的\
  \ Wi-Fi 交互，这使得破解变得更加困难且耗时。不过，通过 WPA3 新的“Wi-Fi Easy Connect”，你只需扫描上的二维码即可连接设备。\n\n\
  ## 其他无线协议\n\n虽然 802.11 标准是最常见的，但近年来，其他几种类型的无线协议也变得非常普遍。其中一些被用于物联网 (`IoT`) 运行。另一些则用于特定应用程序。\n\
  \n还有几种其他无线通信协议。这里简要介绍了最常用的：\n\n* `ANT+` 是一种经常用于传感器数据的无线协议，例如从生物传感器或运动应用程序获取的数据。\n\
  * `ZigBee` 是一个由电子制造商联盟开发的标准，主要用于无线设备在住宅领域的应用，涉及家电器、安全系统等。它基于 802.15.4 标准。令人感到困惑的是，该标准是用名称“ZigBee”而不是数字来表示的。`ZigBee`\
  \ 术的使用方式与 Wi-Fi 类似。\n* `Z-Wave` 是一种主要用于家庭自动化的无线通信协议。它使用低功耗无线电通过网状网络进行设备与设备之间的通信。\n\
  \n蓝牙也是一种非常常用的短距离无线电协议，使用 2.4 到 2.485 GHz 频率。IEEE 将蓝牙标准化为 IEEE 802.15.1，但已不再维护该标准。它允许设备发现范围内的其他蓝牙设备。这个名字源于\
  \ 10 世纪的丹麦国王哈拉尔德·蓝牙（Harald Bluetooth）。他统一了丹麦的部落——因此暗示了蓝牙统一了通信协议。关于他的名字有不同的解释。一种解释是哈拉尔德有一颗是蓝色的坏牙（即腐烂了）。另一种解释是他经常穿蓝色的衣服。蓝牙的速度和范围取决于所使用的版本。各种版本见表\
  \ 13-6。\n\n表 13-6 蓝牙。\n\n| 表 I || 表 II |\n| --- | --- |\n| 3.0 || 25 mbps 10 米 (33\
  \ 英尺) |\n| 4.0 || 25 mbps 60 米 (200 英尺) |\n| 5.0 || 50 mbps 240 米 (800 英尺) |\n|\
  \ 5.2 || 2019 年 12 月发布，此版本增加了新功能。低功耗选项是最明显的新功能。 |\n\n攻击者可能会入侵服务器，以允许公共访问被盗的软件、音乐、电影或色情内容。以下是无线网络中最最重要的取证关注点：\n\
  \n* 犯罪分子是否使用无线网络入口点进行直接网络攻击或数据窃取？\n* 攻击者是否使用第三方无线网络（如酒店热点）来掩盖其身份？\n\n除了跨无线网络设备传输的证据外，你可能可以在无线存储设备中发现证据。这些设备包括无线数字视频摄像机、具有存储能力的无线打印机、无线网络附属存储\
  \ (`NAS`) 设备、个人数字助理 (PDA) 和智能手机、无线数字视频录像机 (`DVR`) 以及无线游戏机。\n\n有几种工具专门用于发现无线网络。一些比较流行的工具包括：\n\
  \n* `NetStumbler` ([www.NetStumbler.com](http://www.NetStumbler.com))\n* `MacStumbler`\
  \ ([www.MacStumbler.com](http://www.MacStumbler.com))\n* `iStumbler` ([www.iStumbler.net](http://www.iStumbler.net))\n\
  \n甚至有适用于 iPhone 和 Android 的应用程序扫描无线网络。因此，Wi-Fi 扫描可以很容易完成。如果黑客发现了一个安全性不高的无线网络，他们可能会尝试的一种是访问无线接入点的管理界面。遗憾的是，太多人开启了这些设备却忘记更改默认设置。有些网站存储了默认密码，任何人都可以查询。一个非常流行的网站是\
  \ [`www.routerpasswords.com/`](http://www.routerpasswords.com/)。\n\n## 路由器取证\n\n\
  使用网络取证，你可以确定网络上的攻击类型。在某些情况下，你还可以追溯路径到攻击者。路由器是一种硬件或软件设备，跨越网络转发数据包到目标网络。目标网络可能是多个网络之外。路由器可能包含带有自检代码的只读存储、包含路由器操作系统的闪存、包含配置信息的非易失性随机访问存储\
  \ (`RAM`)，以及包含路由表和日志信息的易失性 `RAM`。\n\n\n\n\n路由器决定信息如何从一台计算机发送到另一台计算机。路由器是专用计算机，负责将你的消息以及其他所有互联网用户的消息通过成千上万条路径快速发送到它们的目的地。路由器维护着一个路由表来跟踪路由：即哪些连接将用于不同的网络。其中某些路由是手动编程的，但许多路由是路由器自动“学习”的。这是通过检查入站数据包实现的，如果数据包来自路由器以前未见过的\
  \ IP 地址，就会将该地址添加到路由表中。现代路由器还会相互告知新路由和已失效的路由，以使路由尽可能高效。\n\n现代路由器是复杂的设备。它们能够处理数据包，通常具有防火墙和\
  \ DHCP 功能，是编程的，并维护日志。路由器领域的黄金标准是 Cisco，熟悉 Cisco 路由器的基本操作是值得的。\n\n如果想全面了解 Cisco 路由器，这篇文档将提供很大帮助：[`www.ciscorebateprogram.com/en/US/docs/routers/access/800/850/software/configuration/guide/routconf.pdf`](http://www.ciscorebateprogram.com/en/US/docs/routers/access/800/850/software/configuration/guide/routconf.pdf)。\n\
  \n## 路由器攻击类型\n\n路由器可能会受到几种类型的攻击，包括路由表中毒。路由表中毒是最常见且有效的攻击之一。为了执行此类攻击，攻击者会修改路由协议所需的路由数据更新数据包。这会导致路由表中出现错误的条目。反过来，这可能导致人为拥塞、使路由器崩溃，或者通过将数据发送到与预想不同的目标或通过不同的路由，允许攻击者访问受损网络中的数据。\n\
  \n## 从路由器中获取证据\n\n尽管路由器只是一个运行路由程序的特殊计算机，但从路由器中获取证据与从 PC、笔记本电脑或服务器获取证据非常不同。第一个主要区别是，对于路由器，你不需要关闭设备并对其进行镜像复制。其原因是一旦关闭了它，你可能会丢失宝贵的证据。因此，路由器取证需要大量的精力。你务必确保自己小心，不要更改任何内容，并且在记录过程时必须细致入微。\n\
  \n第一步是连接到路由器，以便运行某些命令。Hyperterminal 是一个免费工具，可用于连接并与你的路由器交互。由于路由器是运行状态，记录你所做的一切非常重要。幸运的是，Hyperterminal\
  \ 让这变得简单。\n\n有几个命令对路由器取证非常重要。这里描述了 Cisco 路由器中最重要且最常用的命令。不同品牌路由器、甚至不同 Cisco 路由器的命令可能不同，但存在等效的命令。\n\
  \n`show version` 命令提供了关于路由器的大量硬件和软件信息。它将显示平台、操作系统版本、系统镜像文件、任何接口、路由器拥有多少 RAM 以及有多少个网络和语音接口。\n\
  \n`show running-config` 命令将获取你当前执行的配置。\n\n`show startup-config` 命令将获取获取的启动配置。启动配置与运行配置之间的差异可能表明黑客修改了系统。\n\
  \n`show ip route` 命令将显示路由表。操纵该路由表是黑客渗透路由器的主要方法之一。\n\n这些是你取取证检查中可能会发现有用的命令。然而，还有许多其他命令你可能觉得有用，包括：\n\
  \n![程序代码。在代码中，变量名中的单词已合并。第 1 行：show clock detail。第 2 行：show version。第 3 行：show running,\
  \ hyphen, config。第 4 行：show start up, hyphen, config。](img/9781284244496_CH13_06_UNNUN01.jpg)\n\
