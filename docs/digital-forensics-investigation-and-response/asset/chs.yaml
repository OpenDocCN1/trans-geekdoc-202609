  \n\n\n\n\n数字系统的最早用途之一是计算工资单。最早的数字犯罪之一是窃取“舍入额”——即在计算个人薪水时产生的半分差异。犯罪分子会将这些舍入额转移到自己的账户中。在这类欺诈中，作案者每次偷取的金额非常小。然而，由于计算的工资单数量巨大，总的盗窃金额变得非常大。这表明数字犯罪相对容易实施且难以检测。更糟糕的是，法院经常判处作案者缓刑而非监禁，因此如果数字罪分子被捕，他们面临的后果相对较小。\n\
  \n数字技术在许多方面提供了许多便利并降低了成本。因此，利用数字技术支持业务流程以及现代生活的几乎所有其他方面的应用在不断增加。与此同时，犯罪分子在活动中对数字技术的使用也日益创新化。保护数字系统及其相关资产的方法也在增加。然而，它们的增长速度还跟不上日益增加的数量和复杂性。攻击者现在意识到，有很多方法可以从数字系统中非法获取利益。他们可以窃取资金和身份，甚至可以进行勒索。例如，犯罪分子窃取了客户数据并以此索赎金。\n\
  \n在 1965 年的一篇论文中，英特尔创始人戈登·E·摩尔指出，从 1958 年集成电路发明到 1965 年，集成电路中的组件数量每 18 到 24 个月翻一倍。他预测这一趋势至少还会持续\
  \ 10 年。换句话说，他预测未来 10 年内，集成电路上的晶体管数量每两年翻一倍。这一关于集成电路容量和能力进展的说法被广为人知的摩尔定律](#9781284244496_Glossary.xhtml#gloss-92)或摩尔观察。更重要的是，每次容量翻倍都是以一半的成本完成的。这意味着一个花费\
  \ 100 美元的组件在 18 到 24 个月后将具有两倍的能力，但成本仅为 50 美元。这在从 DVD 播放器、手机手机到电脑和医疗设备的数百种现代数字设备中都能看到。\n\
  \n摩尔定律之所以获得这一名称并声名显赫，因为它证明了一个持续至今趋势的准确体现。具体而言，自从摩尔指出这一趋势以来，集成电路的容量和能力每 18 到 24 个月翻一倍，而成本减少了一半。此外，摩尔定律不仅适用于集成电路。它还适用于计算能力的其他一些主要驱动因素：存储容量；处理器的速度、容量和成本；光纤通信等。\n\
  \n只有人类的智慧限制了技术解决方案的新用途。在 20 世纪 50 年代，第一台商用数字计算机`UNIVAC I`被誉为具有满足组织全部计算需求的能力。今天，一台典型的低端手机的能力和容量都超过了`UNIVAC\
  \ I`。\n\n摩尔定律也适用于数字取证。你可以预见到，调查将需要对来自越来越多的数字设备的日益增长的数据量进行分析。遗憾的是，在取证领域，摩尔定律的运作方式就像打了类固激素一样。\n\
  \n例如，某个设备的数字存储容量可能在一年内翻倍。你可能需要分析的数据可能会轻易经历两倍的增长水平。例如，标准的傻瓜数码相机现在拍摄 500 万像素的照片。高端相机拍摄\
  \ 1600 万或更高像素的照片。典型的`Windows XP`版本大约消耗 4GB 字节（GB）的磁盘空间。典型的`Windows 8`版本消耗 8 GB 到\
  \ 10 GB。虽然一个文件或数据记录的副本可能会被为了活动使用而维护，但你通常必须定位并检查该文件的所有之前的版本。\n\n由于摩尔定律，取证专家必须开发新技术、新软件和新硬件来执行取证评估。新技术应该简化监管链的记录。你将不得不确定哪些技术对于获取所需信息具有最大的潜力。在大多数调查中，分析所有可用数据的成本将高到不可行的地。因此，要有选择性地评估数据。这种选择性并非数字世界所特有。这是调查人员多年来用于跟进线索的相同概念。例如，他们通常从访谈最有嫌的嫌疑人开始，并顺着数据引导的方向以得出结论。然而，在广告和流行电视的帮助下，美国法律体系期望数字取证不受时间、金钱和可用技术等世俗因素的限制。\n\
  \n今天的情况更加难以预测。有无数的新设备，包括物联网（IoT）、智能电视、云存储，甚至地平量子计算也迫在眉睫。所有这些新新技术都将为数字取证带来挑战。\n\n\
  ### 这对取证有什么影响？\n\n计算能力的增加如何影响取证调查？最明显的影响是取证服务器需要更多的存储空间。大多数取证实验室使用服务器存储嫌疑机器的取证镜像。如果即使是最低端的笔记本电脑也有\
  \ 500 GB 到 1TB（TB）的存储，取证服务器必须能够容纳数 TB 的数据。\n\n由于尺寸的增大，磁盘镜像过程也会变慢。例如，使用`DD`取证工具结合`netcat`工具对嫌疑机器进行镜像需要在网络上上传输镜像。显然，被镜像的硬盘越大，需要的带宽就越多。建议取证实验室使用最高容量的布线，甚至可能是光纤缆。否则，将影响未来取证调查的效率。\n\
  \n### 软件服务\n\n另一种情况是，并非所有的取证证据都在单个设备或硬盘上。当计算首次进入市场时，计算机制造商通常作为捆绑产品提供软件。捆绑产品包括一起销售的硬件、软件、维护和支持。没多久，行业意识到可以单独销售软件产品。这导致了`Microsoft`等公司的兴起。\n\
  \n另一种销售软件的方法出现了。这种方法涉及基于共享的方式出售所需的软件。软件的价格实际上嵌入在数学算法中，用户根据其使用配置进行付费。这种定价模式延续到了个人电脑和服务器技术。\n\
  \n然后，定价算法被改变以适应并发用户数量、实例数量或其他模型。此外，购买软件产品使用的想法演变成了软件即服务（SaaS）的概念——即提供者通过订阅模式按需向客户许可的软件。\n\
  \n组织获取软件的模式对取证分析非常重要，因为它影响了调查的四个领域：\n\n- 谁拥有软件？知道与谁交谈以获得有关软件功能和补丁水平的信息。\n- 你如何获取程序代码？当软件作为共享服务获取时，通常是不可能的。在这种情况下，请使用替代技术。\n\
  - 你对软件的安全有何保证？你需要知道特定的软件产品不包含可能改变调查的恶意软件。\n\n\n\n\n\n# 取证调查\n\n在完成取证调查之前，如何保持共享软件的状态静态不变？\n\
  \nSaaS 已经大幅扩展。现在有许多变体，包括基础设施即服务（`IaaS`）。通过 `IaaS`，整个网络基础设施都是虚拟化的。这包括路由器、交换机和服务器。平台即服务（`PaaS`）提供作为服务的单个操作系统。如果一个程序员通常使用\
  \ `Macintosh` 电脑，但由于特定项目需要 `Windows` 机器，他们不需要设置一台 `Windows` 电脑；相反，只需 `PaaS` 提供一个\
  \ `Windows` 环境进行工作即可。除了这些服务之外，现在在桌面电脑上运行虚拟系统也已经非常常见。我们将在随后的章节中讨论此类虚拟系统。\n\n## 云计算\n\
  \n似乎在今天任何关于计算机网络的对话中，人们都会听到提到“云”。它究竟是什么？它又对取证有什么影响？这些都是现在重要的问题，而且在未来几年内将变得更加重要。\n\
  \n什么是云计算？简单来说，它是提升到新水平的网络冗余。为了应对灾难恢复，健壮的网络必须拥有多个冗余服务器。这样，如果其中一台发生故障，组织只需使用另一台服务器。在最简单的配置中，有两台连接的服务器。它们是彼此的完全镜像。如果一台服务器由于任何原因失败，所有流量都将重定向到另一台服务器。\n\
  \n这种情况在只有几台服务器且主要关注点是硬件故障的环境下非常好。但如果你有更大的需求呢——例如，需要存储比任何服务器所能容的多得的数据？嗯，这导致了网络冗余演进的下一步：存储区域网络（`SAN`）。在\
  \ `SAN` 中，有多个服务器和存储设备都连接在一个高速的小网络中。该网络与组织使用的主网络是隔离开的。当主网络上的用户想要访问 `SAN` 中的数据时，在用户看来，它就像一个单一的存储设备。用户甚至无需感知\
  \ `SAN` 的存在；从他们的角度来看，它只是一台服务器。这不仅提供了更大的存储容量，还提供了冗余。`SAN` 拥有多个服务器，如果其中一台发生故障，其他服务器将继续运行——终端用户不会察觉。\n\
  \n## 云计算对取证有何影响？\n\n云计算从几个方面影响数字取证。首先，它让数据采集变得稍微复杂了一些。如果一个网站是犯罪目标，人们如何收集证据呢？\n\n\
  \n\n\n\n## 5. **分析**。取证分析是执行调查和分析技术，以对检索到的证据人工物进行检查、分析和解释。\n\n## 6. **可重复性与可再现性（质量保证）**。取证分析的程序和结论应当能够被同一或其他取证分析师重复执行并再现结果。\n\
  \n## 7. **报告**。取证分析师必须记录其分析程序和结论，供他人使用。\n\n## 8. **陈述**。在大多数情况下，取证分析师将向法庭或其他观众陈述其发现和结论。¹\n\
  \n`NIST` 文档主要侧重于记录云取证面临的挑战。它没有提供具体的解决方案，而是给出了通用建议。在其他问题中，通常无法对云进行“镜像”复制。你最常见的是进行现场取证，或者需要对数据进行逻辑拷贝。这与通常在计算机、笔记本电脑和类似设备上进行取证的方式有所不同。\n\
  \n### 新设备\n\n虽然计算机性能每年都在增强，这是事实，但并不是取证面临的唯一挑战。另一个重要问题是新设备的出现。考虑智能手机和平板电脑：这些都是相对较新的设备。对于任何新的计算设备，可以安全假设它最终将成为取证调查的目标。\n\
  \n#### 汽车\n\n多年来，汽车变得日益复杂。汽车内的 `GPS` 设备现在已随处可见。许多车辆配有用于存储播放音乐的硬盘。这些技术进步也可以成为取证证据的库。例如，`GPS`\
  \ 数据可能证明嫌疑人的汽车在犯罪发生时位于作案现场。仅凭这一点不足以定罪，但它有助于建立案件。\n\n车辆现在通常拥有带有完整操作系统的车载信息娱乐系统。一个例子是\
  \ `Android Automotive OS`，这是一种内置在车辆中的基于 `Android` 的娱乐系统。汽车系统是一个针对车辆优化的独立 `Android`\
  \ 设备。该操作系统最早由 `Google` 于 2017 年 3 月宣布发布（`[`source.android.com/devices/automotive``](https://source.android.com/devices/automotive)`）。这种系统见于多种车型。其通用架构见\
  \ `FIGURE 15-2。\n\n![FIGURE 15-2 Android Automotive.](img/9781284244496_CH15_FIGF02.jpg)\n\
  \n图 15-2 Android Automotive。\n\n#### 医疗设备\n\n越来越多的医疗设备被设计用于通信。例如，有些的胰岛素泵可以通过无线连接向计算机发送有关胰岛素使用的数据。起搏器的工作原理也类似。这导致了一个问题：医疗无线通信是否会受到破坏？不幸的事实是，它可以。多家新闻媒体报道了两个研究人员的故事，他们发现自己可以黑入起搏器并对佩戴者进行电击²；他们还发现可以入侵无线胰岛素泵并改变佩戴者的胰岛素剂量，甚至达到致命水平。³这些泵后来被制造商召回了。⁴\n\
  \n许多医疗设备整合无线通信以便于远程监控。这包括植入式心脏设备。2017 年，美国食品药品监督管理局`（`FDA`）发布了一项与起搏器核心编程功能相关的警告。这些问题包括未经授权的访问和修改的风险。虽然心脏设备是该特定\
  \ `FDA` 警报的重点，但危险不仅限于此类设备，而是影响到广泛的植入式医疗设备。\n\n对胰岛素泵的威胁更早就有记载。2013 年，黑客 `Barnaby\
  \ Jack` 揭露了一种允许攻击者远程控制胰岛素泵的技术。⁵在那种攻击场景中，攻击者能够导致胰岛素泵在单次内完全释放其内容。如果这发生在活体受试者身上，结果很可能是死亡。无论是胰岛素设备还是心脏设备，网络安全问题都是巨大的。不幸的是，虽然文献对这些漏洞有大量的报道，但对广泛解决方案的讨论要少得多。\n\
  \n随着医疗设备复杂性的增加，在怀疑有不当行为的案件中对它们进行取证检查最终可能变得常态——就像现在对任何手机进行取证检查是常态一样。\n\n#### GPS\
  \ 取证\n\n\n\n\n\n智能电视已经无处不在。必须记住，这些设备不仅仅是电视机，而是具有互联网连接、应用程序和内部存储单元的完功能计算机。因此，这些设备可以成为数字取证调查的对象。在智能电视上找到与法证分析相关的数据是完全可能的。同样，忽视对智能电视的检查可能会导致取证分析师错失宝贵的证据。早在\
  \ 2013 年，人们就开始讨论对智能电视进行法证分析。与智能电视取证相关的话题题是，人们对物联网（IoT）和智能家居取证的兴趣日益增长。然而，专门针对智能电视取证的工作还非常有限。不过，已经有一些关于从\
  \ Amazon Fire Stick 等相关设备中提取数据的研究。\n\n截至 2020 年，大多数智能电视使用 Android 操作系统或其变体。东芝（Toshiba）、华硕（Asus）、LG、索尼（Sony）、夏以及许多其他厂商使用了\
  \ `Android TV`。`Google TV`曾被包括 LG 和 Sony 在内的几个厂商使用，但已被 `Android TV` 取代。`Roku TV`\
  \ 使用名为 `Roku OS` 的自定义 Linux 发行版。鉴于 `Android` 是基于 Linux 的，许多用于 `Android TV` 的技术也适用于\
  \ Roku 电视。某些 LG 电视使用 `webOS`，但它也是一个基于 Linux 的操作系统。三星已使用 `Tizen` 和 `Oray` 作为操作系统。然而，这两者都是基于\
  \ Linux 的系统。\n\n关于广泛使用的智能电视操作系统的的数据强烈表明，关注 `Android` 及其变体将提供一种适用于各种电视的通用方法论。该方法论的大部分也适用于其他基于\
  \ Linux 的电视操作系统。利用基于 `Android` 的方法将提供一种适用于大多数不同品牌智能电视的方法论。\n\n有两种方法符合法证严谨性且易于广泛取证分析师使用的要求。第一种是使用\
  \ Android 调试桥接（`ADB`）。`ADB` 在取证领域已获得广泛认可。你在手机取证章节中已经看到过这一点了。因此，利用 `ADB` 进行法证分析在科学上是可靠的。任何\
  \ `Android TV` 都可以通过 `ADB` 访问。鉴于并非所有智能电视都允许 USB 连接，最好的方法是通过网络使用 `ADB`。Android 调试桥接（`adb`）是一种多功能的命令行工具，允许你与设备通信。`adb`\
  \ 命令促进了各种设备操作，如安装和调试应用，并提供了对 Unix shell 的访问权限，你可以用它在设备上运行各种命令。\n\n连接是一个简单的过程。从命令行，使用以下命令（将\
  \ IP 地址替换为目标智能电视的 IP 地址）：\n\n```\nadb connect 192.168.1.85:5555\n```\n\n这在图 15-3\
  \ 中所示。\n\n![FIGURE 15-3 ADB connect.](img/9781284244496_CH15_FIGF03.jpg)\n\n图 15-3\
  \ ADB 连接。\n\n通过输入 `adb devices`，可以验证是否存在连接。然后，执行 `adb shell` 可在目标设备上提供一个 shell，并执行一系列\
  \ Linux 命令的能力。可以通过输入 `exit` 随时退出 shell。在 shell 之外执行的第一步是备份设备：\n\n```\nadb backup\
  \ -apk -shared -all -f C:\\backup.ab\n```\n\n在备份目标设备后，有必要记录有关设备的细节。`adb shell getprop`\
  \ 命令对此目的可能有用。\n\n关于如何使用 `ADB` 从智能电视获取与法证相关信息的这一概述，自然地引出了对分步骤流程的需求。这是一个可以通用应用于任何\
  \ `Android TV` 的过程。步骤如下：\n\n*   步骤 1：在目标设备上开启 USB 调试。\n*   步骤 2：从取证工作站使用 `adb connect\
  \ 192.168.1.85:5555` 连接到智能电视。\n*   步骤 3：使用 `adb backup -apk -shared -all -f C:\\\
  backup.ab` 备份设备。\n*   步骤 4：利用 `adb shell getprop` 收集智能电视详情。这些细节对于详尽记录取证调查是必要的。通过\
  \ `adb shell getprop > properties.txt` 获取所有属性可能会有所帮助。\n*   步骤 5：现在根据需要利用 `adb` 命令定位相关数据，并使用\
  \ `adb pull` 将这些数据回传到取证工作站。\n\n## 法律与程序趋势\n\n进行取证分析的法律环境变化缓慢，但确实在变化。通常，新法律的颁布对证据检查的影响很小；相反，它影响的是证据如何提取。例如，美国最高法院在\
  \ 2013 年 6 月裁定，执法人员可以在未经嫌疑人同意的情况下从其收集 DNA 证据。这极地改变了证据的收集，但没有改变证据的分析。\n\n### 法律的变化\n\
  \n某些法律确实改变了收集证据的过程。法律可以改变搜查证的要求、搜查要求的豁免以及搜索同意的问题。\n\n#### 美国《爱国者法案》(USA PATRIOT\
  \ Act)\n\n近年来美国法律在取证方面最明显的改变是 2001 年的《美国爱国者法案》，通常被称为“爱国者法案”。爱国者法案旨在打击恐怖主义。它并非以计算机犯罪为焦点。然而，它影响了计算机犯罪。例如，在《爱国者法案》通过之前，互联网服务提供商（ISP）在没有搜查或传票的情况下与执法部门共享的内容非常有限。现在，如果他们合理认为发现了可能危及生命的紧迫犯罪证据，可以选择通知执法部门。\n\
  \n《爱国者法案》第 816 节——标题为“网络安全取证能力的开发与支持”—要求美国司法部长建立区域计算机取证实验室。这导致了电子犯罪任务小组的成立，该小组在许多主要城市运营计算机取证实验室。该小组还包括当地执法部门的成员。\n\
  \n### 私立实验室\n\n私立取证实验室变得越来越常见。这些实验室为私人公司、律师，有时为执法机构提供法证鉴定。越来越多的取证调查正在私人实验室进行。这在法证的其他领域（如\
  \ DNA 检测）中已成为常态。\n\n在民事诉讼的情况下，通常需要聘请私立取证实验室处理证据。私人实验室可以收集证据、对其进行分析，并就其发现编制报告。这些数据可能用于民事诉讼，或仅用于确定事件的原因。\n\
  \n\n\n\n\n辩护律师通常希望拥有自己的实验室来检查证据，以便对国家实验室的结论提出质疑。其目标可能是确认或否认控方提交的内容，或者寻找控方所用方法中的某些缺陷。在某些情况下，辩方仅仅是在寻找证明其客户未实施犯罪的“合理怀疑”的根据。例如，如果被告被指控向受害者发送了病毒，并且在其电脑上发现了该病毒以及病毒创建工具，这看起来似乎是一个无定胜回的案件。然而，如果辩方能够证明其他人也访问过这台电脑，甚至证明在发送病毒的时间段有其他用户登录过系统，这就提供了合理怀疑。\n\
  \n小型警察部门将计算机取证外包给私营实验室正变得越来越普遍。这种做法通常更具成本效益。在较小的城镇和城市，为警方部门配备完整的计算机取证实验室和经过充分培训的员工的成本可能远远超出了他们的预算。在这种情况下，外包计算机取证检查更具成本效益。\n\
  \n需要注意的是，许多州要求私人必须持有有效的私家侦探执照才能从事数字取证。您应该检查自己所在州的法律。在那些确实要求私家侦探执照的州，在没有执照的情况下进行数字取证检查属于轻微犯罪。\n\
  \n## 国际问题\n\n显而易见，云为取证检查员带来了国际法律问题，但其他其他问题。当案件具有跨国性质时会发生什么？银行欺诈、身份盗窃和洗钱案件经常跨越国界。考虑一种身份盗窃方案：使用位于马来西亚的服务器来盗取身份，然后犯罪者在西班牙期间使用其笔记本电脑从受害者的账户中取款。如果受害者住在第三个国家（例如美国），那么此犯罪现在就涉及三个不同的国际管辖区。\n\
  \n你可能会认为，在这些情况下，唯一的答案是了解每个国家的法律并确保它们都得到遵守。然而，这通常并非必要的。通常，采取对你的调查限制最大的国家法律并遵循这些法律，就能满足限制较少的司法管辖区的法律要求。\n\
  \n## 技术\n\n技术始终在不断演进。根据道伯特标准（Daubert Standard），该标准要求在法庭上提交的科学证据在相关科学领域被普遍接受，因此新技术在法庭中使用之前需要经过验证。这意味着新工具发布后不太可能立即在法庭上投入使用。然而，随着时间的推移和新工具经过测试（通常在学术环境中），它往往会在领域内获得广泛接受，并进入法庭。\n\
  \n正因如此，取证调查员意识到技术的变化并对新兴技术和手段至少有基本的了解是非常关重要的。即使这些技术尚未在法庭上使用，它们很快也可能被采用。\n\n## 章节总结\n\
