  \    3. 支持 FireWire\n    4. 文件名。\n\n## 第 11 章\n\n### 邮件取证\n\n在民事诉讼中，电子邮件通常是关键证据。请记住，发送者和收件者可能已经删除了电子邮件。但它可能仍然存在于电子邮件服务器或该服务器的备份介质中。\n\
  \n### 电子邮件的工作原理\n\n同样重要的是，即使在非计算机犯罪案件中，电子邮件的内容也可能非常重要。考虑到电子邮件通信非常普遍，发现犯罪分子经常通过电子邮件进行通信不应该让你感到意外。某些犯罪（如网络跟踪）通常包含电子邮件元素。其他犯罪（如毒品贩运和恐怖主义）也可以利用电子邮件。\n\
  \n\n\n今天，人们利用完全基于 Web 的电子邮件服务也很常见。这包括 `Gmail`、`Hotmail` 以及类似的服务。在这种情况下，可能没有本地存储的电子邮件文件。用户需要登录电子邮件服务才能分析邮件。`Gmail`\
  \ 和类似的服务不提供任何在邮件从垃圾箱中删除后将其回的机制。到那时，邮件将无法从收件箱中恢复。在某些情况下，可能会向服务提供者发出传票，他们可能会在备份中搜索丢失的邮件。\n\
  \n## 电子邮件协议\n\n简单邮件传输协议 (SMTP) 是一种用于发送电子邮件的协议。`SMTP` 通常运行在端口 `25` 上。多年来，邮局协议版本 3\
  \ (POP3) 是获取邮件的唯一手段。`POP3` 运行在端口 `110` 上。然而，`POP3` 已大部分被互联网消息访问协议 (IMAP) 取代。`IMAP`\
  \ 运行在端口 `143` 上。`IMAP` 相比 `POP3` 的优势之一是允许客户端仅向机器下载邮件头，这样用户就可以选择完整下载哪些消息。这对于手机以及任何带宽昂贵的无线设备特别有用。另一个优势是邮件保留在服务器上，允许用户从多个设备检查邮件。`IMAP`\
  \ 由标准 `RFC 3501` 定义。`IMAP` 设计旨在允许多个电子邮件客户端管理邮箱。\n\n这些电子邮件协议中的每一个都有一个安全版本，并使用传输层安全\
  \ (TLS) 协议加密。对于 `SMTP`，安全的替代方案是端口 `465` 上的 `SMTPS`。对于 `POP3`，安全版本运行在端口 `995` 上。对于\
  \ `IMAP`，安全版本运行在端口 `993` 上。\n\n## 伪造邮件\n\n犯罪分子可能会发送虚假邮件。其中一些使用电子邮件程序在将消息发送给收件人之前剥离消息头。或者他们可能将消息头埋在邮件程序中。在其他情况下，消息头中的“发件人:”行是假的。\n\
  \n除了操纵邮件头外，犯罪者可能只是设置一个临时的、假的电子邮件账户。例如，`Yahoo!`、`Gmail` 和 `Hotmail` 提供的免费邮件账户很容易设置，你可以使用任何想要且可用的名称。\n\
  \n### 欺骗\n\n欺骗 涉及让邮件消息看起来像是来自真实发送者或位置以外的人或地方。邮件发送者使用互联网上随处可见的软件工具切掉其 IP 地址并替换为他人的\
  \ IP 地址。然而，接收到欺骗邮件的第一台机器会记录该机器真实的 IP 地址。因此，头中同时包含伪造的 IP 和真实的 IP 地址——除非当然，犯罪者足够聪明，也伪造了自己的真实的\
  \ IP 地址。\n\n### 匿名重发\n\n匿名重发 是另一种试图偏离追踪或跟踪路径的尝试。使用匿名重发的嫌疑人将邮件消息发送给匿名器。匿名器是一个电子邮件服务器，在用匿名邮件发送计算机的\
  \ IP 地址转发邮件之前，从邮件中删除身份信息。\n\n要找出是谁发送了重发的邮件，尝试查看重发器或匿名器公司维护的任何日志。然而，这些服务通常不维护日志。此外，你可以仔细分析消息中的嵌入信息，这些信息可能为发送消息的用户或系统提供线索。\n\
  \n有很多网站允许人们发送邮件并选择他们想要的任何“发件人”地址。以下是几个：\n\n* [`sendanonymousemail.net/`](http://sendanonymousemail.net/)\n\
  * [`www.5ymail.com/`](https://www.5ymail.com/)\n* [`send-email.org/`](http://send-email.org/)\n\
  \n### 有效邮件\n\n收到一封邮件也非常常见——通常来自信任的朋友、同事或家庭成员——除了消息内容外，它在每个方面上都是有效的。该邮件通过了所有标准的有效性检查，例如头结构和内容，甚至来自已知的非垃圾邮件服务器，且该服务器未被\
  \ `SPAM Cop` 等任何黑名单服务列入。然而，消息可疑，指向的网站统一资源定位符 (`URL`) 通常是黑客网站或钓鱼网站。消息内容可能像这样：“哇！看看这个棒的网站：[www.hackersite.com](http://www.hackersite.com)”（注意，www.hackersite.com\
  \ 是一个虚假的 URL）。这些消息通常包含隐藏的 URL、图片或附件，并且很短。点击 `URL` 可能会释放恶意软件或其他结果。\n\n## 邮件头\n\n\
  关于电子邮件的要点之一是它们具有邮件头。邮件头提供了关于邮件的大量信息。邮件格式遵循 `RFC 2822` 标准……（注：原文后续大量重复内容已根据翻译要求去重处理）\n\
  \n\n\n\n*   **优先级 (Precedence)**——通常带有“批量（bulk）”、“垃圾（junk）”或“列表（list）”值；用于指示此邮件不应返回自动的“假期”或“外出”回复，例如，防止将假期通知发送给邮件列表的所有其他订阅者。\n\
  *   **接收 (Received)**——由之前处理过消息的邮件服务器生成的跟踪信息，按逆序排列（最后一个处理的在前）。\n*   **引用 (References)**——作为此邮件回复的邮件\
  \ Message-ID。\n*   **回复至 (Reply-To)**——应用于回复该邮件的地址。\n*   **发送者 (Sender)**——代表发件人（From）字段列出的作者操作的实际发送者地址。\n\
  \n这些标头文件中包含了丰富的信息，因此检查它们非常重要。\n\n### 如何在 Outlook 2019 中获取标头\n\n首先，打开电子邮件，然后选择`文件（File）`和`信息（Info）`，如图图\
