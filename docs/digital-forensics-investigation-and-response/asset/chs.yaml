  \ hidden.mp3 -o output.txt`\n\n# 加密\n\n加密（Cryptography）并不像隐写术那样是为了隐藏消息，而是混淆消息使其无法被读取。cryptography\
  \ 一词源于 *krypt*（意为隐藏）和动词 *grafo*（意为写）。因此，加密是编写秘密信息的研究。\n\n### 加密历史\n\n加密通信几乎和文字一样古老。在历史上，人们一直希望保持通信的私密性。尽管在历史的大部分时间内，这是政府、军队和企业的要求，但在现代，个人也有这种需求。\n\
  \n加密的概念其实非常简单。消息必须以某种方式进行更改，使得任何截获它的方都无法读取，但目标接收者可以轻松解码。现代方法通常依赖于数学和信息论的某种结合。首先，通过检查一些历史加密方法是一个好主意。记住，这些历史方法不再安全。现代计算机可以在几秒钟内破解它们。但对于初学者开始学习加密过程来说非常有用。\n\
  \n### 凯撒密码\n\n凯撒密码 据说被古罗马凯撒们（如朱利叶·凯撒）使用过——这也是它名字的由来。这种方法也被称为替换密码（substitution cipher）。现存的几乎每本加密学入门书都提到了凯撒密码。甚至在几项著名的网络安全认证的课程材料中也提到了它。它操作起来其实非常简单。你选择一个数字，对文本的每个字母进行偏移，并用新的字母替换你正在加密的字母。例如，如果文本是\n\
  \n> A CAT\n\n而你选择偏移两个字母，那么 C 替换 A，E 替换 C，C 替换 A，V 替换 T。加密后的消息是\n\n> C ECV\n\n或者，如果你选择偏移三个字母，加密后的消息变为\n\
  \n> D FDW\n\n你可以选择偏移任何数量的字母，无论是向左还是向右。如果你选择向右移动 2 个位置，那就是 +2；如果你选择向左移动 4 个位置，那就是\
  \ –4。如果你到达字母表的末尾，只需继续回到开头即可。所以如果你在向右偏移并需要越过 Z，从 A 开始即可。朱利叶·凯撒据传使用过向右偏移 3 位。\n\n\n\
  \n\n因为这是一个非常容易理解的方法，所以它是你学习加密的一个良好起点。然而，使用两种主要的解密文本攻击形式，它极易被破解。第一种是暴力破解攻击。如果怀疑是凯撒密码，现代计算机可以简单地尝试所有可能的组合，看是否会出现可识别的文本。坦率地说，你用笔纸就能做到。对于任何密码，都有“密钥空间”（key\
  \ space）的概念，即所有可能密钥的总数。对于应用于英语的凯撒密码，只有 26 种可能的密钥。你可以在几分钟内轻松地尝试所有这些密钥。\n\n第二种方法基于攻击者对底层语言的了解。由于字母和单词的频率的存在，凯撒密码很容易通过学术方法被破解。任何语言都有特定的字母和单词频率，这意味着某些字母或单词的使用频率比其他字母更高。在英语中，最常见的单字母单词是\
  \ `a`。最常见的三字母单词是 `the`。仅这两条规则就能帮助你解密凯撒密码。例如，如果你看到一串看似无意义的字母，并注意到信息中频繁重复一个三字母单词，你可能很容易推断出这个单词是\
  \ `the`，而且这种推断极正确的。此外，如果你在文中经常注意到一个单字母单词，它最可能是字母 `a`。你现在已经找到了 `a`、`t`、`h` 和 `e`\
  \ 的替换方案。你现在可以翻译信息中的所有字母并尝试猜测其余部分，或者简单分析用于 `a`、`t`、`h` 和 `e` 的替换字母，并推导出用于此消息的替换密码。\n\
  \n解密此类类型的消息甚至不需要计算机。一个没有密码学背景的人使用笔纸可以在不到 10 分钟内完成。一个广为人知的例子是电影*圣诞故事》（*A Christmas\
  \ Story*），在剧中小男孩 Ralphie 解密了信息“记得喝你的奥瓦麦（Be sure to drink your Ovaltine）”。还有其他规则让破解这种代码变得更加容易。例如，在英语中，两个最常见的双字母组合是\
  \ `ee` 和 `oo`。这为你提供了更多可以操作的内容。\n\n你选择的替换方案（例如 `+2`、`+1`）被称为替换字母表（即 `b` 替换 `a`，`u`\
  \ 替换 `t` 等）。因此，凯撒密码也被称为单字母表或单字母表替换方法，意味着它使用单一的替换进行加密。这这意味着明文中的所有字母都平移了相同的数字。\n\n\
  在任何加密算法中，无论是像凯撒密码这样简单的算法，还是更现代的算法，算法用于加密或解密消息的数字被称为 `key`（密钥），因为它解锁了乱码信息。在凯撒密码的情况下，它是一个数字（如\
  \ `+2`），而在像高级加密标准（`AES`）等现代算法中，它是一个 128 位数字。尽管凯撒密码的算法简单得多（根据 `key` 中的任何数字和方向移动字母）且密钥较小（单个数字，或最多两个数字，如\
  \ `+12` 或 `–11`），但它仍然你在更复杂的现代加密算法中看到的基础概念示例。\n\n凯撒密码还引入了密码学的两个基本概念。你想加密的文本被称为 `plaintext`（明文）。经过算法和\
  \ `key` 处理后，生成的文本被称为 `ciphertext`（密文）。因此，尽管简单，但凯撒密码引入了加密算法、密钥、明文和密文。\n\n这个例子为你提供了关于密码学和加密的初步介绍。必须强调的是，凯撒密码不再是一种安全的消息加密方法，但它是引入加密基本概念的一个有趣练习。\n\
  \n### Atbash 密码\n\n拷贝《耶利米书》的希伯来学者使用了 Atbash 密码。这种密码非常简单——只需反转字母表。按现代标准来说，这也是一种非常原始且易破解的密码。但它能帮助你感受密码学的工作原理。\n\
  \nAtbash 密码是一种希伯来代码，用字母表的第一个字母替换最后一个字母，用第二个字母替换倒第二个字母，以此类推。它简单地反转了字母表。这和凯撒密码一样，是一种单字母表替换密码。`A`\
  \ 变成 `Z`，`B` 变成 `Y`，`C` 变成 `X`。\n\n### ROT13 密码\n\nROT13 密码另一种单字母表替换密码。事实上，它是所有中最简单的。它只是字母表的一种排列。所有字符旋转\
  \ 13 位。\n\n### Scytale 密码\n\nScytale（与 Italy 同韵）是斯巴达人使用的圆柱或棒子。这种物理圆柱产生了密文。虽然不清楚这种密码到底有多久，但它在公元前\
  \ 7 世纪被希腊诗人阿基洛库斯提到过。\n\n### Playfair 密码\n\nPlayfair 密码由查尔斯·惠特斯顿于 1854 年发明；但它是由普莱费尔爵士推广的，因此以他的名字命名。尽管它最初被英国政府由于太复杂而拒绝，但它实际上被英国军队在第一次世界大战期间以及第二次世界大战期间的部分使用过。这种密码通过通过一次加密一对字母（也称为双字母）来工作的。\n\
  \n\n\n并在表格中找到字母对。观察由这些字母组成的矩形。在我们的示例中，第一对字母是 `AT`，因此形成了如下所示的矩形，其中 `A` 位于左上角，`T`\
  \ 位于右下角。\n\n| A | L | C |\n| --- | --- | --- |\n| B | D | E |\n| I/J | K | M |\n\
  | R | S | T |\n\n然后取矩形的相反端来创建密文。`A` 位于左上角，因此你将其替换为右上角的任意字母，在本例中是字母 `C`。`T` 位于右下角，因此你将其替换为左下角的任意字母，在本例中是字母\
  \ `R`。所以 `AT` 被加密为 `CR`。继续下去，下一对字母是 `TA`，将形成相同的矩形。然而，由于 `T` 是明文的第一个字母，`R` 将是密文的第一个字母，产生\
  \ `RC`。接下来我们有 `CK`。这些字母形成了此处所示的矩形。\n\n| A | L | C |\n| --- | --- | --- |\n| B |\
  \ D | E |\n| I/J | K | M |\n\n`C` 变成 `A`，`K` 变成 `M`，所以我们得到了 `AM`。如果你继续这个过程直到明文结束，你将得到“Attack\
  \ at dawn”加密后的：\n\n> CRRCLMCRBLVB\n\n如果你真的想学习普菲尔密码，你应该用纸和笔手动进行练习。但你可以使用在线普菲尔计算器来检查你的工作结果：\n\
  \n> [`planetcalc.com/7751/`](https://planetcalc.com/7751/)\n\n> [`www.geocachingtoolbox.com/index.php?lang=en&page=playfairCipher`](https://www.geocachingtoolbox.com/index.php?lang=en&page=playfairCipher)\n\
  \n### 多字母表替换\n\n最终，人们对凯撒密码进行了略微改进，称为`多字母表替换`。在这种方案中，你选择多个数字来对明文中的字母进行位移；换句话说，创建了多个替换字母表。例如，如果你选择了三个替换字母表（`+2`、`-2`、`+3`），那么\
  \ `A CAT` 变成 `C ADV`。注意第四个字母又从另一个 `+2` 开始，你可以看到第一个 `A` 被转换为了 `C`，而第二个 `A` 被转换为了\
  \ `D`。这使得解密底层的文本变得更加困难。尽管这比凯撒密码更难破解，但并没有特别困难。用简单的纸和笔和一点努力就能完成。计算机可以很快地破解它。事实上，今天没有人会使用这种方法来发送任何真正安全的消息，因为这种类型的加密被认为是非常脆弱的。\n\
  \n### 维吉纳尔密码\n\n最广知的多字母表密码之一是维吉纳尔密码。该密码由乔瓦万·巴蒂斯塔·贝拉索索（Giovan Battista Bellaso）于\
  \ 1553 年发明。这是一种通过根据关键词的字母选择选择的一系列不同的单字母表密码来加密字母文本的方法。该算法后来被错误地归于布莱斯·德·维吉纳尔（Blaise\
  \ de Vigenère）名下，因此现在被称为维吉纳尔密码，尽管维吉纳尔并没有真正发明它。\n\n你使用表格（图 5-10 所示）以及你选择的关键词。将你关键词顶部的字母与左侧的明文字母匹配以找到密文。使用图\
  \ 5-10 所示的表格，如果你正在加密单词 `cat` 且你的关键词是 `horse`，那么密文就是 `jok`。\n\n![FIGURE 5-10 维吉纳尔表。](img/9781284244496_CH05_FIGF10.jpg)\n\
  \n图 5-10 维吉纳尔表。\n\n多字母密码比单字母替换密码更安全。然而，它们对于现代密码学用途仍然是不可接受的。基于计算机的密码分析系统可以很容易地破解历史加密方法（包括单字母和多字母）。本章介绍单字母替换密码和多字母替换密码，是为了向你展示密码学历史，并帮助你理解密码学是如何工作的。\n\
  \n### 恩尼玛机\n\n在第二次世界大战期间，德国人使用基于转子的机电加密系统，被称为恩尼玛机（Enigma machine）。恩尼玛机在密码学历史上至关重要。它是一种使用机器完成加密的多字母替换密码。这种机器有多种变体。\n\
  \n机器的设计使得当操作员按下按键时，该明文的密文每次都会改变。因此，如果操作员按下 `A` 键，他可能在密文中生成一个 `F`，而下一次可能是一个 `D`。本质上，这是一种多字母密码，包含\
  \ 26 种可能的字母表。\n\n盟军二战期间使用的密码机包括英国的 `TypeX` 和美国的 `SIGABA`。这些都与恩尼玛机相似，但通过改进使其更加安全。恩尼玛机及其变体本质上是多字母替换的机械实现。\n\
  \n### 现代密码学\n\n加密历史章节是为了让你对密码学产生感觉。某些形式（如凯撒密码）甚至可以用纸笔完成。现代密码学方法以及计算机使得解密成为一门相当先进的科学。因此，加密必须同样复杂才能成功。重要的是，密码方法自这些密码时代以来已经有了很大进步。\n\
  \n现代密码学分为两个不同的组：对称加密和非对称加密。对称加密使用相同的密钥加密和解密明文，而非对称加密使用不同的密钥来加密和解密明文。在本节中，你将学习这些方法。\n\
  \n### 对称加密\n\n对称加密指的是使用相同密钥加密解密的方法。一种广泛使用的步骤是使用两个不同的密钥，一个从发送者到接收者，另一个从接收者到发送者。这仍然是对称加密，因为加密解密使用的是相同的密钥——双向密钥提供了额外的安全性。直到最近，这是唯一使用的加密类型。\n\
  \n#### 替换与置换\n\n替换是将明文的某些部分替换为密文的相应部分。凯撒密码和巴什密码是简单的替换密码。维吉纳尔密码稍微复杂，但仍然是替换密码。它们之所以是替换密码是因为每个单个明文字符都转换为单个密文字符。\n\
  \n置换是密文块的交换。例如，如果你有文本“I like ice cream”，你可以置换或交换每三个字母序列（或块）与下一个，得到：\n\n> ikeliceam\n\
  \n当然，现代置换是在位位，或者说是位块或连续位组上进行的。然而，这说明了概念。所有现代块加密算法都同时使用替换和置换。替换和置换的结合增加了结果密文的安全性。现代对称密码执行一系列复杂的替换和置换。\n\
  \n\n\n\n对称算法分为两种类型：分组加密和流式加密。`block cipher`（分组加密）字面意思是按块为单位对数据进行加密；64 位块非常常见，尽管某些算法（如\
  \ `AES`）使用更大的块。例如，`AES` 使用 128 位的块。`Stream ciphers`（流式加密）则以流的形式加密数据，一次处理一个位。\n\n\
  有几点通常适用于所有分组加密的基本事实。假设实际算法在数学上是可靠的，那么以下结论成立：\n\n- 块大小越大，安全性越高。\n- 密钥长度越大，针对暴力破解方法的防御安全性越高。\n\
  - 如果轮函数是安全的，那么增加轮数在一定范围内会提高安全性。（等一下，让我重新重读一遍）\n- 如果轮函数是安全的，那么增加轮数在一定范围内会提高安全性。\n\
  \n现在，这里真正的问题在于“假设算法在数学上是可靠的”这一部分。如果算法在数学上是可靠的，这些事实就成立。如果算法是不可靠的，更大的块大小或更大的密钥对安全性的影响可能很小。这让我们回到了之前提到的柯氏霍夫原则（Kerckhoffs’\
  \ principle）。任何加密算法都要经过数学家和密码学家的严格检查以确保其可靠性，是非常重要的。\n\n### Feistel 函数\n\n该函数以其发明者、德国裔物理学家兼密码学家霍斯特·费斯尔（Horst\
  \ Feistel）的名字命名。许多分组加密的核心都是 `Feistel function`（Feistel 函数）。因此，这是学习对称算法的好起点。该函数是许多（甚至是大部分）分组加密的基础。这使其成为对称分组加密领域最有影响力的进展之一。它也被\
  \ Feistel 网络或 Feistel 密码。任何基于 Feistel 的分组加密其工作方式基本上是相同的；区别在于轮函数中所执行的操作。\n\nFeistel\
  \ 函数首先将明文数据块（通常为 64 位）分为两部分（传统上称为 `L[0]` 和 `R[0]`）。通常拆分是平等的——两边大小相同。然而，也存在并非相等的情况。\n\
  \n轮函数 `F` 应用于其中一半。“轮函数”一词是指在 Feistel 密码的每次迭代（或每轮）中执行的函数。轮函数 `F` 的细节会随不同的实现而异。通常，这些是相对简单的函数，以提高算法运行速度。\n\
  \n每个轮函数 `F` 的输出和数据的另一半然后通过异或（XOR）函数。这意味着例如，你取 `L[0]`，将其通过轮函数 `F` 处理，然后将结果与 `R[0]`\
  \ 进行异或运算。\n\n然后，这两部分进行转置，或者交换位置。这意味着 `L[0]` 移动到右侧，`R[0]` 移动到左侧。这个过程重复指定的次数。作为 Feistel\
  \ 密码的不同加密算法之间，主要的区别在于轮函数 `F` 的精确性质以及迭代次数。该过程的简单示意如图 5-11 所示。\n\n![FIGURE 5-11 Feistel\
  \ function.](img/9781284244496_CH05_FIGF11.jpg)\n\n图 5-11 Feistel 函数。\n\n## 数据加密标准\n\
  \n现代对称加密算法中最古老的之一是数据加密标准（`DES`）。`DES` 由 IBM 在 20 世纪 70 年代开发。`DES` 是一种分组加密。直到 90\
  \ 年代，它一直是美国政府的标准。IBM 最初开发了一种名为 `Lucifer` 的加密算法，该算法由霍斯特·费斯尔设计。当美国政府开始寻求一种标准的加密算法时，IBM\
  \ 与美国安全局（NSA）合作修改了 `Lucifer` 以适应需求。这就是 `DES`.\n\n高级加密标准（`AES`），也称为 Rijndael 分组加密，在经过涉及\
  \ 15 种竞争算法的五年流程后，于 2001 年正式指定为 `DES` 的替代方案。`AES` 被指定为联邦处理标准 197（`FIPS 197`）。\n\n\
  \n\n\nAES 可以有三种不同的密钥长度：128、192 或 256 位。这三种不同的 AES 实现分别称为 `AES 128`、`AES 192` 和 `AES\
  \ 256`。这三者均在 128 位的块大小上操作。\n\nAES 算法由两位比利时密码学家 Joan Daemen 和 Vincent Rijmen 开发。与\
  \ `DES` 和 `3DES` 不同，AES 不基于 Feistel 网络。AES 使用的是代换置换矩阵。AES 在一个 4 × 4 的字节列矩阵上操作，称为\
  \ `state`（块大小更大的 AES 版本在 `state` 中具有额外的列）。AES 的通用步骤如下：\n\n1. 密钥扩展——轮密钥使用 `Rijndael’s\
  \ key schedule` 从密码密钥派生。该密钥调度的具体细节对于本书并不重要，但本质上是根据原始密钥在每一轮生成一个不同的密钥。这非常像 `DES`。\n\
  \n2. 初始轮\n    1. `AddRoundKey`——`state` 的每个字节都通过位异或与轮密钥结合。换句话说，明文逐位排列在一个矩阵中，然后该矩阵与密钥进行异或。\n\
  \n3. 轮\n    1. `SubBytes`——一个非线性代换步骤，根据查找表将每个字节替换另一个字节。基本上，矩阵中的每个字节随后被输入到一个替换盒。然而，在\
  \ AES 中，这个盒在替换位的同时也会进行位转置，因此被称为置换盒。\n    2. `ShiftRows`——一种置换步骤，将 `state` 的每行循环移动若干步。\n\
  \    3. `MixColumns`——一种在 `state` 的列上操作的混合操作，将每列的 4 个字节结合。\n    4. `AddRoundKey`——再次将密钥与矩阵进行异或的步骤。\n\
  \n4. 最终轮（无 `MixColumns`）\n    1. `SubBytes`——同上\n    2. `ShiftRows`——同上\n    3.\
  \ `AddRoundKey`——同上\n\n关于这些步骤的某些细节如下：\n\n* 在 `SubBytes` 步骤中，矩阵中的每个字节使用一个 8 位的代换盒替换另一个字节，该盒被称为\
  \ `Rijndael S-box`。\n* 在 `ShiftRows` 步骤中，通过移动每行的字节特定量来实现。第一行保持不变。第二行向左移动一位，第三行向左移动两位，依此类推。\n\
  * 在 `MixColumns` 步骤中，列会被混合，类似于行的移位。然而，它们并不是简单地移动，而是实际上被混合在了一起。\n* 在 `AddRoundKey`\
  \ 步骤中，子密钥与 `state` 进行异或。对于每一轮，子密钥使用 `Rijndael’s key schedule` 从主密钥派生；每个子密钥的大小与 `state`\
  \ 相同。\n\n该算法比 `DES` 或 `3DES` 稍微复杂一点。\n\nAES 可以三种不同的密钥长度：128 位、192 位或 256 位。密钥越长，生成的密文对破解攻击的抵抗力越强。美国安全局已批准将\
  \ 256 位 AES 用于机密数据；因此，它对于商业应用来说足够安全。\n\n### 其他对称算法\n\n还有许多其他对称算法。几个示例包括：\n\n* `Blowfish`\n\
  * `Serpent`\n* `Skipjack`\n\n然而，AES 是目前最常用的算法，而 `DES` 是对称密码中著名的例子之一。\n\n### 密码学哈希\n\
  \n之前讨论过密码学哈希，但并不详细。在本节中，我们将进行探索。哈希是一种具有某些特征的类型。首先，它是单向的，这意味着你无法对其进行反哈希。第二是它是固定长度的。第三是它是抗性的。当两个不同的输入产生相同的输出时，就会发生碰撞。常见的是\
  \ `MD5` 和 `SHA-1`，但后来的版本如 `SHA-256` 已变得更加\n\n### 非对称加密\n\n非对称加密是指使用两个密钥：一个用于加密，另一个用于解密。\n\
  \n### RSA\n\n`RSA` 算法由 MIT 的 Ron Rivest、Adi Shamir 和 Leonard Adleman 在 1977 年公开描述。`RSA`\
  \ 三个字母是他们姓氏的首字母。`RSA` 可能是世界上使用最广泛的公钥算法。`RSA` 的安全性源于分解由两个素数组成的大整数非常困难。为了创建密钥，会生成两个大小相近的大素数\
  \ `p` 和 `q`。接下来，选择两个数字，使其乘积达到所需的大小——例如 1024 位、2048 位等。现在将 `p` 和 `q` 相乘得到 `n`。\n\n\
  下一步是计算这些素数中每个的欧拉函数。即互质数的总数。如果两个数没有公因子，则认为它们是互质的。例如对于素数来说，这始终是该数减 1。\n\n```\nm =\
  \ (p - 1) * (q - 1)\n```\n\n现在选择另一个数字。这个数字被称为 `e`，且 `e` 与 `m` 互质。此时，密钥已几乎生成完毕。现在计算一个数字\
  \ `d`，它与 `e` 相乘并对 `m` 取模会产生 1。\n\n```\nFind d such that [d × e]mod(m) = 1\n```\n\
  \n现在你有了公钥 `e` 和 `n`，以及私钥（或密钥）`d` 和 `n`。要加密，只需将你的消息的 `e` 次方并对 `n` 取模即可。\n\n```\n\
  C = M^e mod n\n```\n\n要解密，将密文的 `d` 次方并对 `n` 取模，或者\n\n```\nP = C^d mod n\n```\n\n\
  你可以通过利用小型整数演练算法来更好地理解 `RSA`。通常情况下，`RSA` 会使用非常大的整数。\n\n\n\n\nRSA 基于大素数。现在你可能会想，难道没有人可以获取公钥并利用因式分解来推导出私钥吗？理论上，是可以的。然而，将巨大的数字分解为它们的质因数是非常困难的。目前没有处理此类任务的有效算法。RSA\
  \ 可以使用 1024 位、2048 位、4096 位及更大的密钥。这些都是巨大的数字。当然，如果有人能发明出一种将大数分解为其质因数的有效算法，RSA 就会过时。\n\
  \n### Diffie-Hellman\n\nDiffie-Hellman 算法是一种加密协议，允许双方在不安全的通道上建立共享密钥。换句话说，Diffie-Hellman\
  \ 通常用于允许通信双方通过互联网等不安全介质交换对称密钥。它由惠特菲德·迪菲（Whitfield Diffie）和马丁·赫尔曼（Martin Hellman）于\
  \ 1976 年开发。一个有趣的转折是，该方法实际上已经由英国情报部门的马尔科·J·威廉森（Malcolm J. Williamson）开发出来，但由于是机密，因此在创建时无法公开。Diffie-Hellman\
  \ 实现了之间没有预设关系的双方（如电子商务）之间的所有安全通信，并促进了即使是有预设关系的双方（如电子银行）之间的通信。\n\n## 其他非对称算法\n\n\
  RSA 是使用最广泛的非对称算法，因此它是本章详细介绍的唯一算法。然而，如果你愿意，也可以学习其他非对称算法：\n\n*   MQV\n*   椭圆曲线\n*\
  \   DSA\n\n这些中的每一个都基于数论的某个方面。\n\n## 破解加密\n\n密码分析是指使用暴力破解以外的技术来尝试破解密钥。这也称为学术破解或基于知识的破译。在某些情况下，加密技术被用于测试加密算法的效能。此类技术经常用于测试哈希算法的碰撞。任何破解非平凡加密算法的尝试仅仅是一种尝试。目前无法保证任何方法都会有效。而且无论它是否有效，都可能是一个漫长而枯燥的过程。如果破解加密是一个轻而易举的过程，那么加密将毫无用处。\n\
  \n### 频率分析\n\n这是破解大多数经典密码的基本工具。在自然语言中，字母表中的某些字母出现频率高于其他字母。通过检查这些频率，你可以推导出关于所用密钥的一些信息。这种方法对于凯撒密码、维吉尼亚密码等经典密码非常有效。但它对现代加密方法无效。记住，在英语中，单词\
  \ `the` 和 `and` 是最常见的三个字母单词。最常见的单字母单词是 `a` 和 `I`。如果你在一个单词中看到两个相同的字母在一起，它们最可能是 `ee`\
  \ 或 `oo`。\n\n### 卡西斯基检验\n\n卡西斯基检验由弗里德里希·卡西斯基（Friedrich Kasiski）于 1863 年开发。它是攻击多字母替换密码的方法，例如维吉尼亚密码。这种方法可以用于推断多字母替换密码中使用的密钥长度。一旦发现了密钥长度，就可以对密文进行对齐。一旦发现了密钥长度，就可以对密文进行对齐。\n\
  \n### 现代方法\n\n破解现代方法是一项非平凡的任务。然而，本节应该让任何法医鉴定人员对密码分析有良好的理解。\n\n### 工具\n\n许多工具可以帮助破解密码和加密数据。记住，如果加密实现得正确且具有足够的强度，你可能可能无法破解它。但密码通常可以被破解。还可能通过许多非技术手段在加密之前获取密钥或信息的副本，这些手段属于社会工程范畴，包括翻找垃圾（也称为“翻垃圾桶捡漏者”）、向他人撒谎以获取密钥、密码、短语或未加密的信息；甚至在目标公司工作并窃取所需的信息。\n\
  \n## 彩虹表\n\n在 1980 年，马丁·赫尔曼（Martin Hellman）描述了一种密码分析的时间内存权衡策略，它通过使用存储在内存中的预计算数据来减少密码分析的时间。本质上，这类密码破解器针对特定字符空间内的所有可用密码进行预计算哈希处理，无论是\
  \ `a–z`、`a–zA–Z` 还是 `a–zA–Z0–9` 等。这些文件被称为彩虹表，因为它们包含了“彩虹之下”每一个字母组合。它们在尝试破解哈希时特别有用。因为哈希是一个单向函数，所以破解它的方法是尝试寻找匹配项。攻击者获取哈希值并在彩虹表中搜索与该哈希匹配的项。如果找到了，就找到了该哈希的原始文本。\n\
  \n像 Ophcrack 这样流行的黑客工具依赖彩虹表。Ophcrack 在破解 Windows 本地密码方面通常非常成功。步骤非常简单：\n\n1.  下载\
  \ Ophcrack 并镜像刻录到 CD。\n2.  将 CD 插入目标计算机并通过 CD 启动。\n3.  等待其启动，Linux 会抓取 Windows 密码文件，然后使用破解工具破解该文件并生成一个包含用户名和密码的文本文件。\n\
  \n\n\n\n你可以在图 5-12 中看到 Ophcrack 的用法。请注意，这是来自一台运行机器，因此某些信息经过了脱敏处理。许多取证工具（如 `OSForensics`）都提供了让你创建自己的更小、更集中的彩虹表的机制。例如，你可以输入你认为可能与嫌疑人相关的单词，并根据这些单词及其变体生成彩虹表。这使得生成了一个更小、因此速度更快的彩虹表。\n\
  \n![FIGURE 5-12 Ophcrack.](img/9781284244496_CH05_FIGF12.jpg)\n\n图 5-12 Ophcrack。\n\
  \n### John the Ripper\n\nJohn the Ripper 是另一种在网络管理员和黑客中都非常流行的密码破解工具。你可以从 [`www.openwall.com/john/`](http://www.openwall.com/john/)\
  \ 免费下载。该产品完全基于命令行，没有 Windows 界面。它允许用户选择文本文件作为单词列表来尝试破解密码。尽管由于命令行界面的存在 John the Ripper\
  \ 使用起来不太方便，但它已经存在很长时间，并且深受安全社区和黑客社区的推崇。有趣的是，[`www.openwall.com/passwdqc/`](http://www.openwall.com/passwdqc/)\
  \ 上提供了一个工具，可以确保你的密码不会被 John the Ripper 轻易破解。\n\n### 量子计算与密码学\n\n深入探讨量子计算超出了本章甚至本书的范围；然而，这个主题对密码学有着重大影响。因此，你必须对该主题至少有一个通性的了解。在本节中，你将介绍量子计算的基本概概述以及它将如何改变密码学。\n\
  \n量子计算机简单来说是将数据存储在量子状态而非传统比特位中的计算机。这些状态可以是光子的偏振、电子的能级或其他量子态。这种存储方式被称为 `qubit`（即“量子位”）。虽然有很多关于量子计算的新闻，但应该记住，我们还没有一台完全运行的量子计算机。问题在于所谓的\
  \ `decoherence`（退相干）。简单来说，目前的量子计算机只能维持很短时间的状态。因此，在量子计算机上处理数据目前限于限于短时间的工作。\n\n一旦退相干问题（以及其他一些工程问题）得到解决会发生什么？当我们拥有一台功能完全、可以保持状态的量子计算机时，这将对目前广泛使用的非对称加密算法产生严重影响。事实证明，量子计算机非常擅长某些任务。两个相关的例子是将大整数分解为质因数，以及求解离散对数问题。恰恰如此，`RSA`\
  \ 的安全性基于将大整数分解为其质因数的难度。`Diffie-Hellman`（以及 `ElGamal` 和 `MQV` 等变体）的安全性基于求解离散对数问题的难度。当我们拥有一台完全运行的量子计算机时，这些算法将不再安全。这是一个问题，因为目前大多数在线加密通信都在使用这些算法。幸运的是，美国国家标准与技术研究所（`NIST`）一直在寻找抗量子密码标准。该过程现在已进入第三轮，并且进展顺利。你可以在\
  \ [`csrc.nist.gov/Projects/post-quantum-cryptography/post-quantum-cryptography-standardization`](https://csrc.nist.gov/Projects/post-quantum-cryptography/post-quantum-cryptography-standardization)\
  \ 找到更多关于 `NIST` 项目的信息。\n\n## 章节总结\n\n## 核心概念与术语\n\n## 第 5 章评估\n\n1. 凯撒密码是已知的最老的加密方法。\n\
