  \ DoS 攻击。\n\n近年来变得更加常见的另一种 DoS 攻击是电话拒绝服务（`TDoS`）攻击。`TDoS` 攻击是可能的，并且确实有文档记录了通过传统电话系统使用自动拨号器占用目标电话线。然而，随着基于\
  \ IP 的语音（`VoIP`）工具的广泛可用，针对传统和基于 IP 的 `VoIP` 实施自动化 `TDoS` 攻击已变得非常容易。`TDoS` 攻击的工作原理是呼叫中心或企业接收到大量的入入电话，导致设备和人员不堪重负无法无法业务。向主管或经理打电话会要求发送特定金额的资金或购买特定的清除服务以停止攻击。\n\
  \n`Trin00` 是另一种流行的 DoS 工具。它最初仅适用于 UNIX 系统，但现在也支持 Windows。它是 `TFN` 的替代品。攻击者使用的一种常用技术是通过特木马将\
  \ `Trin00` 客户端发送到机器上——这种代码在普通用户看来是合法的，但实际上是恶意软件。然后，所有被感染的机器都可被用于对目标系统发起协同攻击。\n\n\
  士肉包攻击（Smurf attack）是一种 DoS 攻击，它结合了 IP 欺骗和 ICMP 用流量饱和目标网络。士肉包攻击包含三个元素：源站、中继站（反射站）和目标站。攻击者（源站）向一个大型网络的广播地址（中继站）发送修改过的\
  \ ping 包。修改后的数据包包含目标站的源地址——中继站的所有所有人都会向目标站点回复。碎片化攻击（Fraggle attack）是士肉包攻击的变体，攻击者向广播地址的端口\
  \ `7`（echo）和 `19`（chargen）发送大量的 UDP 流量，并伪造预定受害者的源 IP 地址。\n\n动态主机配置协议（`DHCP`）饥饿是另一种\
  \ DoS 攻击。`DHCP` 用于为计算机动态分配网络地址。这在大多数组织中被广泛使用。如果有足够的请求涌入网络，攻击者可以无限期地完全耗尽 `DHCP` 服务器分配的地址空间。有诸如\
  \ `Gobbler` 等工具可以为攻击者执行此操作。\n\nHTTP post DoS 攻击针对 Web 服务器。此类攻击发送一个合法的 HTTP post\
  \ 消息。post 消息的一部分是 `content-length`，它指示了随后的消息大小。在 във攻击中，攻击者随后以极慢的速度发送实际的消息体。Web\
  \ 服务器随后会等待该消息完成。对于更健壮的服务器，攻击者需要同时使用多个 HTTP post 攻击。\n\n还有其他针对 Web 服务器和网站的 DoS 攻击。攻击者可以创建一个程序反复提交注册表单，为应用程序添加大量虚假用户。攻击者还可能选择通过不断发送登录请求来使登录过程过载，这些请求需要表示层访问身份验证机制，导致其不可用或响应异常缓慢。\n\
  \n永久性拒绝服务 (pDoS) 是一种严重破坏系统，导致受害者机器需要重新安装操作系统甚至更换硬件的攻击。这有时被称为“闪击”（phlashing）。这通常涉及对设备固件的\
  \ DoS 攻击。\n\n近年来变得更加常见的另一种 DoS 攻击是电话拒绝服务（`TDoS`）攻击。`TDoS` 攻击是可能的，并且确实有文档记录了通过传统电话系统使用自动拨号器占用目标电话线。`TDoS`\
  \ 蓬勃，然而，随着基于 IP 的语音（`VoIP`）工具的广泛可用，针对传统和基于 IP 的 `VoIP` 实施自动化 `TDoS` 攻击已变得非常容易。`TDoS`\
  \ 攻击的工作原理是呼叫中心或企业接收到大量的入入电话，导致设备和人员不堪重负无法无法业务。向主管或经理打电话会要求发送特定金额的资金或购买特定的清除服务以停止攻击。\n\
  \n`Trin00` 是另一种流行的 DoS 工具。它最初仅适用于 UNIX 系统，但现在也支持 Windows。它是 `TFN` 的替代品。攻击者使用的一种常用技术是通过特木马将\
  \ `Trin00` 客户端发送到机器上——这种代码在普通用户看来是合法的，但实际上是恶意软件。然后，所有被感染的机器都可被用于对目标系统发起协同攻击。\n\n\
  士肉包攻击（Smurf attack）是一种 DoS 攻击，它结合了 IP 欺骗和 ICMP 用流量饱和目标网络。士肉包攻击包含三个元素：源站、中继站（反射站）和目标站。攻击者（源站）向一个大型网络的广播地址（中继站）发送修改过的\
  \ ping 包。修改后的数据包包含目标站的源地址——中继站的所有所有人都会向目标站点回复。碎片化攻击（Fraggle attack）是士肉包攻击的变体，攻击者向广播地址的端口\
  \ `7`（echo）和 `19`（chargen）发送大量的 UDP 流量，并伪造预定受害者的源 IP 地址。\n\n动态主机配置协议（`DHCP`）饥饿是另一种\
  \ DoS 攻击。`DHCP` 用于为计算机动态分配网络地址。这在大多数组织中被广泛使用。如果有足够的请求涌入网络，攻击者可以无限期地完全耗尽 `DHCP` 服务器分配的地址空间。有诸如\
  \ `Gobbler` 等工具可以为攻击者执行此操作。\n\nHTTP post DoS 攻击针对 Web 服务器。此类攻击发送一个合法的 HTTP post\
  \ 消息。post 消息的一部分是 `content-length`，它指示了随后的消息大小。在 във攻击中，攻击者随后以极慢的速度发送实际的消息体。Web\
  \ 服务器随后会等待该消息完成。对于更健壮的服务器，攻击者需要同时使用多个 HTTP post 攻击。\n\n\n\n\n\n* `Ryuk` 恶意软件在 2019\
  \ 年期间出现，影响了全球数百万人。该勒索软件针对多个州级、地方和领土政府实体，并要求使用比特币支付赎金以解密文件。\n\n* `Rombertik` 病毒始于\
  \ 2015 年开始出现。这种病毒利用浏览器读取用户访问网站的凭据。它通常以电子邮件附件的形式发送。该病毒还可以覆盖硬盘上的主引导记录（MBR），导致机器无法启动，或者开始加密用户主目录下的文件。\n\
  \n* `Locky` 病毒于 2016 年开始出现。这是一种勒索软件病毒，会加密受害者计算机上的敏感文件，然后要求支付赎金获取加密密钥。与之前的勒索软件病毒不同，它可以加密未映射网络共享上的数据。\n\
  \n病毒可以分为不同的类别。这里提供主要的病毒类别列表：\n\n* **宏病毒 (Macro)**：宏病毒感染办公文档中的宏。许多办公产品（包括 `Microsoft\
  \ Office`）允许用户编写名为 `macros` 的微程序。这些宏也可以被写成病毒。由于编写此类病毒非常简单，这种病毒非常常见。\n\n* **常驻内存病毒\
  \ (Memory-resident)**：常驻内存病毒安装后，从计算机启动到关机期间一直留在 `RAM` 中。\n\n* **多部分感染病毒 (Multi-partite)**：多部分病毒通过多种方式攻击计算机——例如，感染硬盘的引导区和一个或多个文件。\n\
  \n* **加壳病毒 (Armored)**：加壳病毒使用使其难以分析的技术。这是通过压缩代码或使用弱加密方法对其进行加密来实现的。\n\n* **稀疏感染者病毒\
  \ (Sparse infector)**：稀疏感染者病毒试图通过仅零星执行恶意活动来规避检测。对于稀疏感染者病毒，用户会看到短暂的症状，然后是一段时间没有症状。在某些情况下，稀疏感染者针对特定程序，但病毒仅在目标程序运行第\
  \ 10 次或第 20 次时执行一次。\n\n* **多态病毒 (Polymorphic)**：多态病毒字面上会不断改变形式以规避杀毒软件的检测。这种病毒更高级的形式被称为\
  \ `Metamorphic`（变态）病毒；它可以完全重写自己。\n\n### 这种犯罪如何影响取证？\n\n病毒非常容易定位，但很难追溯到创建者。第一步是记录病毒的细节——例如其行为、文件特征等。然后，你必须查看受感染计算机之间是否存在某些共同点。例如，如果所有受感染的计算机访问过同一个网站，那么该网站本身可能已被感染。此外，软件发布商和病毒研究人员在网上提供了关于已知病毒的海量信息，这对于进行取证研究非常有帮助。\n\
  \n这是一个缓慢且枯燥的过程，但追踪病毒创建者是可能的。\n\n### 逻辑炸弹\n\n`logic bomb`（逻辑炸弹）是一种恶意软件，其设计目的是为了在满足某些逻辑条件时对系统造成危害。它通常根据特定的日期和时间触发。通过\
  \ `Trojan horse` 分布逻辑炸弹是可能的，但这种攻击通常是由员工实施的。以下两个案例说明了这一事实：\n\n* 2019 年，西门子（Siemens）的承包商\
  \ `Tinley` 对植入 `logic bomb` 认罪。\n\n* 2006 年 6 月，瑞银（UBS）的系统管理员 `Duronio` 被指控使用 `logic\
  \ bomb` 压低公司股价，被判处 8 年监狱并赔偿 300 万美元。\n\n### 网络恐怖主义\n\n讨论网络犯罪离不开 `cyberterrorism`（网络恐怖主义）。几年前，网络恐怖主义的想法似乎还是假设性的，甚至是耸人听闻的。\n\
  \n* 2010 年 12 月，一个自称 `Pakistan Cyber Army` 的小组入侵了印度顶级机构——中央调查局（`CBI`）的网站。\n\n* 2008\
  \ 年和 2009 年，曾有若干报告称攻击可追溯到 `North Korea`。鉴于两国都是极权主义政权，很难相信政府们至少对此一无知晓。\n\n* 2009\
  \ 年 12 月，黑客入侵系统并窃取了韩国和美国的秘密军事计划。\n\n* 2013 年 3 月，美国高级情报官员告诉国会，网络攻击导致了国家安全威胁。这是自\
  \ 2001 年 9 月 11 日以来，除了极端物理威胁外，首次有其他事物成为情报部门的首要关注点。当时的国家情报主任 `James Clapper` 向小组表示，网络和财务威胁正被加入针对我们的武器清单中。\n\
  \n* 2015 年，19 岁的黑客 `Ardit Ferizi` 被判定为伊斯兰国组织（`ISIS`）提供了 1300 名军事和政府人员的数据，以便他们对其进行攻击。\n\
  \n\n\n\n\n-   [http://archives.cnn.com/2001/WORLD/asiapcf/east/04/27/china.hackers/index.html]\n\
  \n该小组的成员和领导者坚称，中国政府不仅没有参与他们的活动，而且他们违反中国法律，并面临着逮捕和监禁的持续危险。然而，大多数分析师认为，该小组是在中国政府完全知情并支持的情况下工作的。在\
  \ 2013 年第一季度，美国和中国政府都发起了针对网络攻击的指控。\n\n## 这种犯罪如何影响取证？\n\n由于网络恐怖主义和网络间谍活动使用的技术与任何其他网络犯罪相同，因此调查的实际技术部分是相同的。如果是病毒或\
  \ DoS 攻击，你像调查任何病毒或 DoS 攻击一样对其进行调查。然而，区别在于犯罪本身的管辖权。网络恐怖主义和网络间谍问题会提交给 `FBI`。\n\n##\
  \ 章节总结\n\n## 核心概念与术语\n\n## 第 2 章评估\n\n1. 在调查病毒时，第一步是什么？\n    1. 检查防火墙日志。\n    2.\
  \ 检查 `IDS` 日志。\n    3. 记录病毒。\n    4. 追踪病毒的来源。\n2. 下列哪种犯罪最可能留下电子邮件？\n    1. 网络跟踪扰\n\
  \    2. `DoS`\n    3. 逻辑炸\n    4. 欺诈\n3. 你会在哪里寻找证据证明 `Ophcrack` 已在 `Windows Server\
  \ 2008` 上使用过？\n    1. 在服务器日志中；寻找系统重启记录\n    2. 在服务器日志中；寻找 `CD` 加记录\n    3. 在防火墙日志中\n\
  \    4. 在 `IDS` 日志中\n4. 逻辑炸通常是由 \\_\\_\\_\\_\\_\\_\\_\\_\\_\\_ 实施的。\n    1. 身份窃取者\n\
  \    2. 不满员工\n    3. 恐怖分子\n    4. 黑客\n5. 间谍软件是合法的。\n    1. 对\n    2. 错\n6. 雇主监控工作电脑是合法的。\n\
  \    1. 对\n    2. 错\n7. 认真对待网络跟踪扰的首要原因是什么？\n    1. 它可以破坏你的系统。\n    2. 它可以令人烦恼和分散注意力。\n\
  \    3. 它可以是现实世界暴力的前奏。\n    4. 它可以是身份窃的一部分。\n8. 调查拒绝服务攻击的起点是什么？\n    1. 防火墙日志\n\
  \    2. 电子邮件头部\n    3. 系统日志\n    4. 追踪数据包\n\n## 第 3 章### 取证方法与实验室\n\n© phyZick/Shutterstock\n\
  \n> 在本章中，你将学习某些取证调查的特定方法。这些方法论为你的调查提供了一个框架。你还将学习建立计算机取证实验室的要求。最后，你将对主要的计算机取证软件进行简要介绍。\n\
  \n## 取证方法论\n\n你将学习非常具体的计算机取证技术；然而，拥有一个通用的取证方法框架至关重要。本节探讨了你可以应用于自己的取证调查的通用原则和特定方法论。首先，这里是一些需要考虑的基本原则。\n\
  \n### 尽可能少地处理原始数据\n\n取证专家应该尽可能少地接触原始数据。相反，应该在检查之前复制信息。这意味着任何调查的第一步都是对怀疑的存储设备进行复制。在计算机硬盘的情况下，你制作一个完整的副本。这意味着一个位级副本。像\
  \ `EnCase`、`Forensic Toolkit` 和 `OSForensics` 这样的工具可以为你完成此工作；使用基本的 `Linux` 命令也可以做到。此外，对硬盘制作两个副本是常见做法。这使你拥有一份用于工作，另一份在需要时作为备份。\n\
  \n尽可能少地处理原始信息的想法是一个关键的哲学，它应该渗透到你的取证方法中。但真正的问题是，为什么？为什么在非必要的情况下，不触碰实际的原始证据是如此重要？这个问题的第一个答案是，每当你接触数字信息时，都有可能改变它。即使是更改文件上的时间/日期戳这样简单的事情也是在更改它。如果你更改了文件，你就无法确定你发现的证据是有效的。\n\
  \n另一个原因是，可能需要另一位调查人员进行他们的检查。如果你处理了原始信息，你可能已经更改了它，导致其他人现在无法进行新鲜分析。在许多情况下，另一个检查员需要审阅原始信息。最明显的情况是对方律师聘请了他们自己的专家，该专家想要进行自己的检查。\n\
  \n这源于取证学中被称为洛卡德交换原理的原则。埃德蒙·洛卡德是取证学的先驱。虽然他处理的是物理取证（头发、血液等），并在计算机时代出现很久以前就去世了，但他的概念仍然适用。基本上，他声称你无法在一个环境中互动而不留下任何痕迹。这在计算机中也是如此。例如，当你登录\
  \ `Windows` 系统的那一刻，你就改变了几个 `Windows Registry keys`。\n\n有些时候可能需要实时取证。但这始终是次选。首选是使用\
  \ `drive` 的镜像工作，而不是实际的 `drive`。实时取证的一个常见场所是从云存储中提取证据。镜像整个云是不现实的。\n\n### 遵守证据规则\n\
  \n在调查期间，取证专家应该记住相关的证据规则。例如，证据链和 `Daubert` 标准就是必须遵循的两个规则。\n\n证据规则规定了法律案件的证明何时以及为何可以提交法官或陪审团。取证专家应该对特定类型的证据规则有良好的了解。\n\
  \n作为一个例子，《联邦证据规则》(`FRE`) 是一部证据法典。`FRE` 规范了美国联邦法院系统的当事人如何证明他们的案件。`FRE` 为 `901` 和\
  \ `902` 下的证据认证和识别提供了指南。以下是来自康奈尔法学院的 `FRE` 第 901 规则的摘录，显示了与计算机取证相关的部分：\n\n```\n1.\
  \ (a) 通用。为了满足鉴定或识别证据物品的要求，主张者必须提供证据，支持该物品是其主张所声称的物品。\n\n    1. (1) 有知识证人的证言：关于物品是其所声称的物品。\n\
  \n    2. (3) 专家证人或事实判定者的比较：通过认证的标本进行比较。\n\n    3. (9) 关于过程或系统的证据：描述过程或系统的证据并证明其产生了准确的结果。\n\
  ```\n\n第 1 项是指专家证言。你作为取证调查员，可能被要求鉴定证据。第 3 项是指给定标本与另一个物品之间的比较。这可以用于鉴定证据。第 9 项对于计算机取证至关重要。即使你使用来自\
  \ Guidance Software 的 `EnCase` 或来自 AccessData 的 `Forensic Toolkit` 等自动化工具，你也应该详细了解这些工具的工作工作的，以便在必要时鉴定该过程。\n\
  \n\n\n\n\n在第一章中，你学习了`联邦规则第 702 条`，该规则定义了什么是专家证人。你还应该注意其他相关的规则。\n\n`规则 703` 讨论了专家意见的依据。`规则\
  \ 703` 规定，专家可以基于其获悉或亲自观察到的案件事实或数据来得出意见。如果特定领域的专家在形成关于该主题的意见时，会合理地依赖此类事实或数据，那么这些数据在意见采用时并不需要具有可采性。但如果这些事实或数据在其他情况下是不可采的，那么意见的主张方只有在这些数据对于帮助陪审团评估意见的证明价值远大于其偏见性影响时，才能向陪审团披露它们。²\n\
  \n`规则 705` 规定除非法院另有规定，否则专家可以陈述意见并给出理由，而无需先对基础事实或数据进行作证。但专家可能被要求在交叉询问时披露这些事实或数据。³\
  \ 现在，这并不意味着专家不需要对意见给出理由。事实上，你可以放心，对方律师会详尽地对这一推理进行调查。该规则只是说明，你可以给出你的意见，而无需先提供其理由。\n\
  \n各个司法管辖区可能有一些针对该管辖区的特定额外规则。你了解你所在司法管辖区的规则以及通用证据规则是至关重要的。\n\n### 避免超出你的知识范围\n\n\
  取证专家不应承担超出其当前知识和技能水平的检查工作。这似乎是显而易见的，但你不仅在取证领域，而且在整个 IT 行业中都能观察到这个问题。大多数其他职业都非常乐意将客户介绍给专家。例如，如果你看家庭医生，而她发现你的心脏有异常，她会将你转诊给心脏病专家。诚然她在医学院学习过心脏病学，但她仍然会认为你转诊给一位专门研究心脏病的人。然而，IT\
  \ 专业人员往往认为，只要他们有一点知识，就足够继续了。\n\n这在取证中可能非常有问题。假设你是一个技术高超的取证检查员，对 `Microsoft Windows`\
  \ 和 `Linux` 拥有丰富的经验。但现在送来一台运行 `Mac OS` 的计算机。现在，你的技能很可能允许你提取数据。而 `Mac OS` 基于类 Linux\
  \ 的系统（`FreeBSD`）这确实是事实。但足够吗？很可能不足。而且，如果你坚持自己进行调查，你可能会错过关键证据——或者至少对方律师可以在法庭上声称你遗漏了。\n\
  \n这些基本原则应该指导你的取证调查。这些不是具体的程序，而是调查的通用哲学方法。这一点看起来似乎被夸大了，但有许多专家证人远超其实际技能的案例。这里是专家证人协会（Expert\
  \ Witness Institute）的这样一个故事：\n\n> 我与专家证人发生的最糟糕经历涉及对子宫癌前细胞的误诊。在主询问期间一切顺利。但在交叉询问期间，我的专家作言说，他为准备证词所做的事情之一是“谷歌搜索”整个诉讼的主题。这么说吧，对方律师在那之后把他对得团团转，我的专家在陪审团面前失去了所有的信誉。这是专家证人在证人席上能说的最糟糕的话之一，因为法官提醒陪审员不要在谷歌或互联网上查询案件中涉及的医学状况——原因之一是网络上有大量的错误信息。在审判前的几天里，我一直为那位专家证人做准备，但我没有自认为应该他不要讨论“谷歌”或互联网。从那个经历以后，我专门建议我的专家在讨论他们如何准备证词时，永远不要提到\
  \ Google 或互联网。你可能认为这是显而易见的，但我的经历证明事实并非如此。专家无论经验多么丰富，都必须对其证词的每一个方面做好充分准备，即使是最显而易见的方面。⁴\n\
  \n如果该证人在这一领域拥有真正的专业知识，他就不需要“谷歌搜索”相关信息了。那是外行人在对某个话题好奇时会做的。\n\n### 创建分析计划\n\n在开始任何取证检查之前，你应该有一个分析计划。该计划是你工作的指导方向。你将如何收集证据？是否对证据可能被更改或销毁存在担忧？哪些工具最适合这项特定的调查？这是一个联邦案件还是州案件？这会影响可采性规则吗？你应该在数据分析计划中解决所有这些问题。建议有一个标准的数据分析计划，你只需根据特定情况进行定制。\n\
  \n### 技术信息收集考虑因素\n\n系统取证专家必须记住三个主要的技术数据收集考虑因素。这些是理解信息的寿命、快速收集信息以及收集位级（bit-level）信息。\n\
  \n#### 考虑信息的寿命\n\n在计划收集工作时，取证专家必须意识到信息是有寿命的。寿命指的是信息的有效期限。该术语与易失性有关。更易失的信息往往具有更短的寿命。信息的性质以及组织的政策和实践决定了信息的寿命。例如，关于网络流量的数据和消息本身可能只存在于通过路由器的时间。这可能是毫秒。存储在计算机内存中的信息（例如完整数据包）寿命可能为\
  \ 1 毫秒。或者，在缓存 IP 地址的情况下，寿命可能持续 20 分钟。在任何情况下，内存都是易失的，因为它只在设备通电时存在，因此取证专家必须采取行动。\n\
  \n随着信息寿命的增加，寿命的决定因素通常与组织的实践有关。例如，组织可能会建立“电子邮件保留”政策，规定电子邮件邮件在电子邮件系统中仅存储 30 天。30 天后，任何未移动到替代存储的邮件将被删除。日志文件可能会根据组织的审计政策保留数月或几年。财务和会计信息可能具有多年的寿命，对应于州或联邦政府建立的要求。\n\
  \n在计划收集工作时，取证专家必须意识到他们正在处理的信息的寿命。他们必须使用与信息寿命匹配的收集技术。\n\n#### 快速收集信息\n\n一旦收集工作宣布或进行中，尽快收集证据至关重要。通常无法或无法实际确定是谁在何时更改了内容。此外，调查目标可能会试图隐藏信息。网络系统也增加了未经更改的可能性。在网络上更改内容的人不需要存储信息的设备附近。\n\
  \n#### 收集位级信息\n\n\n\n\n为了使 1 和 0 位变得有用，必须通过硬件和软件将其转换为文本、图片、屏幕显示、视频、音频或其他可用格式。调查人员还会寻找是否插入了无关的位，例如埋藏在其他文件中的贸易秘密。因此，取证专家必须拥有允许对位级信息进行操作和评估的工具。位级工具的使用还允许调查人员在文件被删除或覆盖时重建文件碎片。\n\
  \n从根本上，`bit-level information`（位级信息）是指存储在内存或存储设备上的实际 1 和 0 层次级的信息，而不是通过文件系统的解释。无论使用何种操作系统，它显示的只是其对数据的表示。进入位级视图可以最准确地查看信息实际上是如何存储在硬件上的。如果你使用文件系统复制嫌疑驱动器，你可能无法获得碎片空间或隐藏分区。但通过位级复制，你可以获得这些项目。\n\
  \n## 正式取证方法\n\n几个机构已经建立了进行取证调查的正式指南。你应该熟悉这些指南。根据你的工作环境，你可能会实施其中一种，或将其中一种作为基础并调整为你自己的计划。\n\
  \n### 美国国防部取证标准\n\n美国国防部（DoD）协调并监督与国家安全和美国武装力量相关的政府机构和职。国防部使用系统取证来评估和检查与网络攻击相关的数据。国防部估计恶意活动的潜在影响。它还评估犯罪分子的意图和身份。美国国防部网络犯罪中心（DC3）为数字证据的处理、分析和诊断制定标准。DC3\
  \ 参与需要计算机取证支持以检测、增强或恢复数字媒体的国防部调查。DC3 还参与刑事执法取证和反间谍。它协助刑事、反间谍、反恐和欺诈调查。此外，它还支持安全调查、指挥官查询和监长调查。\n\
  \nDC3 提供计算机调查培训。它培训取证检查员、调查人员、系统管理员等人。它确保国防信息系统免受未经授权的使用、犯罪欺诈活动以及外国情报机构的利用。DC3 与政府、学术和私营行业的计算机安全官员合作。有关\
  \ DC3 的更多信息，请参见 `http://www.dc3.mil`。\n\n### DFRWS 框架\n\n数字取证研讨会（DFRWS）是一个非营利志愿者组织。其目标是加强数字取证研究知识和想法的共享。DFRWS\
  \ 赞助年度会议、技术工作组和挑战，以帮助推动研发方向。2001 年，DFRWS 开发了一个数字调查框架，该框架仍然适用并被遵循。DFRWS 框架是一个包含六类别的矩阵：\n\
  \n* 识别 (Identification)\n* 保留 (Preservation)\n* 收集 (Collection)\n* 检查 (Examination)\n\
  * 分析 (Analysis)\n* 呈现 (Presentation)\n\n### SWGDE 框架\n\n数字证据科学工作组（SWGDE）推广包含四个阶段的框架过程。这些阶段是：\n\
  \n* 收集 (Collect)\n* 保留 (Preserve)\n* 检查 (Examine)\n* 传输 (Transfer)\n\n最后一步意味着任何形式的传输——即使是将证据从实验室移动到法庭或在不再需要时归证据。\n\
  \n### 基于事件的数字取证调查框架\n\n2004 年，普渡大学信息保证与安全教育研究中心（CERIAS）的研究人员 Brian Carrier 和 Eugene\
  \ Spafford 提出了一个比 DFRWS 框架更直观、灵活的模型。\n\n该模型有五个主要阶段，每个阶段都可能包含额外的子阶段。主要阶段是就绪阶段、部署阶段、物理犯罪现场调查阶段、数字犯罪现场调查阶段和呈现阶段。就绪阶段包含运行就绪子阶段（涉及人员培训和工具测试）和基础设施就绪子阶段（涉及设备配置）。部署阶段包括检测和通知子阶段（其中有人检测到事件并通知调查人员）以及确认和授权子阶段（调查人员获得进行调查的授权）。\n\
  \n## 方法论和发现的记录\n\n取证处理方法论和发现的记录至关重要。如果没有适当的记录，取证专家将难以展示发现。当安全或审计发现成为诉讼或刑事调查的对象时，法律系统要求适当的记录。如果没有记录，法院不太接受调查结果。因此，系统取证专家必须了解计算机证据处理方法论的精髓。这种方法论包括强有力的证据处理记录和良好的监管链程序。\n\
  \n### 磁盘结构\n\n系统取证专家应该充分了解计算机硬盘、闪存驱动器和光盘（CD）的结构。专家还应该知道如何在光盘和硬盘驱动器的晦蔽之处找到隐藏的数据。事实上，随着技术的发展，数字取证检查员熟悉任何常用的介质将变得重要。这也是一个人们可能需要使用多个工具来获取数据的领域。\n\
  \n### 文件碎片空间搜索\n\n系统取证专家应该理解用于捕获和评估文件碎片（file slack）的技术和自动化工具。硬盘或光盘被分成特定大小的簇。每个簇只能存放一个文件或一个文件的一部分。如果你向簇大小为\
  \ 4 KB 的磁盘写入一个 1 千字节（KB）的文件，该簇的最后 3 KB 就会被浪费。文件逻辑结束和文件物理结束之间的这段未使用空间被称为 `file slack`\
  \ 或 `slack space`（碎片空间）。\n\n大多数计算机用户在使用计算机时并不知道他们正在创建碎片空间。此外，即使你删除文件，文件的碎片可能仍然存在。当你创建新文件时，文件碎片中的这些残留信息并不一定会被覆盖。因此，文件碎片是涉及密码、网络登录、电子邮件、数据库记录、图像和文字处理文档的潜在安全泄漏源。取证专家应该知道如何搜索文件碎片，识别哪些信息有用或无用，并记录任何发现。\n\
  \n## 证据处理任务\n\n系统取证专家有三个与处理证据相关的基本任务：\n\n* 寻找证据——收集计算机证据超出了正常的数据恢复。寻找并隔离证据以证明或反驳指控可能是困难的。调查人员可能需要调查成千上万个活动文件和删除文件的碎片，以找到一个足以破案。因此，系统取证被描述为在海里捞针。检查员通常在安全的实验室中工作，检查嫌疑机器中的病毒并隔离数据以避免污染。\n\
  \n\n\n\n\n-   **保护证据**——保护计算机证据非常重要，因为数据很容易被销毁。构成数据的 1 和 0 只需要按一下按钮就会被隐藏并瞬刻消失。因此，法医鉴定人员应假设每台计算机都可能设置了破坏证据的陷阱。在处理计算机和存储介质时，必须谨慎行事。\n\
  - **准备证据**——证据必须能够经受司法审查。因此，准备证据需要耐心和详尽的文档记录。未能记录证据的来源，或未能确保证据未被篡改，可能会毁掉案件。法官曾因为此类失败而驳回过案件。\n\
  \n### 证据收集措施\n\n以下是在您收集证据时应遵循的原则：\n\n- **避免改变证据**——在移除设备之前，先对处于原位的设备进行拍照。对电线和插座进行标记，以便在将计算机和其他设备带到实验室后，可以将所有物品恢复原状。小心运输物品，避免触碰硬盘或光盘。制作精确的位级（bit-by-bit）副本，并将其存储在如一次写入型\
  \ CD 等介质上。\n- **确定证据创建时间**——你应该创建计算机使用和文件访问的时间线。这可能很难，因为伪造数据有很多方法。但时间线可以决定案件的成败。\n\
  - **仅信任物理证据**——数据的 1 和 0 记录在磁性材料的物理层面。这在系统取证中才是关重要的。其他项目可能会损坏。\n- **搜索整个设备**——你需要在计算机内部的广泛区域对这种层级的\
  \ 1 和 0 进行搜索。\n- **良好展示证据**——法医鉴定人员必须以逻辑性、引人入胜且有说服力的方式展示计算机证据。团团能够理解这些证据。此外，证据应该足够坚实，使辩护律师无法对其反驳。\n\
  \n## 专家报告\n\n专家报告是一份详细阐述专家发现的正式文件。通常，该文件会在审判前提交给案件。如果有证词（depositions），那么专家报告可能会作为你在取证期间被问到的某些问题的依据。在撰写专家报告时，你应该考虑几个问题。民事案件中总是需要专家报告，但在刑事案件中可能需要也可能不需要。当你需要编写专家报告时，正确地完成它至关重要。\n\
  \n第一个问题是报告的格式。你通常列出你考虑的所有项目、文档和证据。你还详细说明了你执行的测试、进行的分析以及你的结论。你应该在附录中列出整个简历（CV）——一份详细说明你担任某职位经验和资历的扩展文档。记住，`CV`\
  \ 比简历详细得多。你应该列出你获得的每一个出版物、奖项或证书。`CV` 还应该包含更多关于工作历史和教育背景的细节。\n\n你报告的另一个问题是详尽性。在大多数司法管辖区，如果内容没有写在你的报告中，就不被允许在审判中对此作证。因此，要非常详尽。你留下的任何内容都可能在审判中变成问题。在写内容时做到详尽并记录所有进行的分析至关重要。例如，如果你执行了三个测试，且三个测试都支持特定的结论，请确保列出所有三个测试。如果你只列出一个，那么这就是你可以在审判中唯一可以作证的测试。\n\
  \n最后，备份你所说的一切切。显然，你是取证专家，否则你不会被要求作证。但请记住，有一位对方律师，其工作就是反对你的意见。对方律师可能会有他们自己的专家，该专家将证明不同的结论。拥有受人尊敬的参考资料来支持你提出的任何重要主张是好的。这样，这不仅仅是你的意见，而是你的意见加上多个可靠来源的支持。我建议你的报告应充斥着来自信誉良好的来源引用——但要确保你确实读过那些来源。对方律师会读的。通过引用它们，你是在发表一个你同意这些观点的声明，因此在选择来源时要小心。\n\
  \n## 如何建立取证实验室\n\n任何特定实验室的详细细节取决于实验室的需求、预算以及该实验室可能处理的案件类型。案件量大的州执法机构其需求与仅处理民事事务的小型取证实验室不同。然而，一些通用原则适用于所有实验室。\n\
  \n### 设备\n\n首先，你必须拥有工作所需的充足设备。除其他外，这意味着对数据有足够的存储空间。记住，你可能会分析一个系统，但在案件进入审判之前可能还有几个月的时间。一台负担得起的存储容量最大的服务器是必要的。此外，该服务器必须具有冗余性。它至少应该有一个独立磁盘冗余阵列或\
  \ `RAID 1`（磁盘镜像），但建议使用 `RAID 5`。并且每天至少备份一次。你可能需要多个服务器来满足你的存储需求。\n\n你还需要各种能够连接各种类型驱动器的计算机——例如，外部通用串行总\
  \ (`USB`)、内部小型计算机接口 (`SCSI`)、增强集成驱动器电子 (`EIDE`) 和串行高级附件 (`SATA`) 驱动器。具体数量取决于实验室预期的负载。你还应该拥有所有类型智能手机、笔记本电脑、路由器和其他设备的电源连接。\n\
  \n### 安全\n\n安全对取证来说至关重要。最重要的是被检查的机器不应连接到互联网。你可以有一个不连接互联网的实验室网络，并且与你检查电子邮件和使用互联网的工作网络隔离开。将实验室设在一个隔绝任何电磁干扰的房间内也是重要的。这意味着手机和无线信号无法渗透房间。\n\
  \n在建立了网络和电子安全之后，物理安全是下一个考虑的问题。限制进入实验室的权限至关重要。只允许有需要的人进入实验室。建议实验室入口采用某种电子方法记录谁进入了以及何时进入。刷卡访问是理想的。此外，房间本身应该难以被强制进入。这意味着窗户和门非常安全，极难被破破。\n\
  \n实验室还需要在证据未使用时保护它的手段。证据箱是实现此点的方法。箱还应该具有高度的防火性，以便在火灾发生时保护证据。\n\n除了已列出的通用指南外，还应该考虑由国际标准组织\
  \ (`ISO`) 发布和更新的各种国际标准。这里简要描述几个：\n\n- `ISO/IEC 27037:2012`——信息技术——安全技术——数字证据识别、收集、获取和保存指南。这是数字取证的一个常用标准。该标准涉及取证实践和流程，特别是获取法证证据。\n\
  - `ISO/IEC 27041:2015`——信息技术——安全技术——事件调查方法适用性和适当性的保证。该标准关于取证方法和工具。\n- `ISO/IEC 27042:2015`——信息技术——安全技术——数字证据分析和解释指南。该标准为处理和分析数字证据提供了指导。\n\
  \n\n\n\n\n美国国家标准与技术研究院（NIST）拥有一项计算机取证工具测试计划，用于测试取证工具。查看你最喜欢的工具是否经过了测试并被认为合格将是一个非常好的主意。\n\
  \n## 美国犯罪实验室主任协会\n\n美国美国犯罪实验室主任协会（ASCLD）为取证实验室的管理提供指南。它还提供了获得犯罪实验室和取证实验室认证的指南。ASCLD\
  \ 为美国及全球的公共和私人犯罪实验室提供自愿认证。它对分析数字证据和其他犯罪证据（如指纹和 DNA 样本）的计算机取证实验室进行认证`ASCLD/LAB`认证规范了犯罪实验室的组织和管理。获得\
  \ ASCLD 认证是一个严谨的过程。实验室必须满足约 400 项标准才能获得认证。通常情况下，未认证的实验室需要二到三年的来准备认证。这段时间被用于制定政策、程序、文档控制、分析验证等。然后，实验室还需要一年的时间完成整个流程。实验室经理提交申请。首席评估员和小组将花费一到两个月审核申请以及政策和程序，以确保实验室已准备就绪。评估大约需要一周时间。评估小组会产生需要纠正措施的发现。实验室通常需要几个月的时间进行修正，以满足首席评估员的要求。一旦设施完成了所有修正，首席评估员会将实验室推荐给董事会认证。最后，`ASCLD/LAB`董事会会对是否认证该实验室进行投票。\n\
  \n`ASCLD/LAB` 计划包括审计，以确保取证专家在所有案件中都能正确且一致地执行实验室程序。该协会在计算机取证实验室中进行这些审计，以维护质量和完整性。对实验室的一个建议是遵循国防部关于电磁辐射（EMR）的指南。国防部在其\
  \ TEMPEST 项目下对电脑进行屏蔽，防止渗透者通过电磁辐射发射探测它们。你可以在 [`www.gao.gov/products/NSIAD-86-132`](http://www.gao.gov/products/NSIAD-86-132)了解更多关于\
  \ TEMPEST 的信息。由于涉及成本高昂，屏蔽所有电脑是不可能的。然而，为了保护高风险调查，实验室可能还会考虑实施 TEMPEST 保护。\n\nTEMPEST\
  \ 认证的是具有防止电磁辐射释放的屏蔽设备。在某些情况下，TEMPEST 可以应用于整个实验室。屏蔽实验室是一项极高成本的方法，包括以下措施：\n\n*   用特殊接地的导电金属板衬墙墙壁、天花板、地板和门\n\
  *   安装过滤器以防止电源电缆传输计算机的辐射\n*   在加热和通风管道中安装特殊的百叶板以捕获辐射\n*   在电话线上安装线路滤波器\n*   在入口和出口处安装特殊装置，防止设施随时对外界开放\n\
  \n创建和维护经过 TEMPEST 认证的实验室是昂贵的。此类实验室必须定期进行检查和测试。只有对窃听有绝对安全需求的大型区域计算机取证实验室才考虑完全的 TEMPEST\
  \ 保护。对于较小的设施，使用 TEMPEST 认证设备通常是一种更有效的方法。你可以在 [`www.gao.gov/products/NSIAD-86-132`](http://www.gao.gov/products/NSIAD-86-132)了解更多关于\
  \ TEMPEST 的信息。\n\n## 常用取证软件程序\n\n在建立实验室和设备后，下一个要解决的是软件。有几种软件工具可供选择，你可能想在取证实验室中使用。本节简要介绍了几种常用工具。然而，本节对\
  \ Guidance Software 的 EnCase 和 AccessData 的 Forensic Toolkit 给了额外关注，因为这两个程序被执法部门频繁使用。\n\
  \n#### EnCase\n\n来自 Guidance Software 的 EnCase 是一款被广泛使用的取证工具包。该工具允许检查人员将以太网线或零调制解调器线连接到嫌疑机器，并对之进行操作。EnCase\
  \ 是一个非常流行的取证工具包，被执法部门广泛使用。EnCase 允许检查人员尽可能地接触嫌疑机器。EnCase 组织数据的方式类似于 Windows 资源管理器，如图\
  \ 3-1 所示。\n\n3-1 EnCase 证据文件。\n\n3-1 EnCase 证据文件。\n\n 是一个非常流行的取证工具包。EnCase 基于证据文件进行\
  \ MD5 哈希计算。\n\n3-2 EnCase 视图。\n\nEnCase 允许你过滤查看的内容，缩小对特定项目的关注。你还可以使用搜索功能搜索数据，该哈希值与原始数据匹配。一旦添加了证据文件，EnCase\
  \ 会计算哈希值，这可以验证自驱动以来没有发生变化。\n\n3-3 EnCase 搜索。\n\n3-3 EnCase 搜索。\n\n过滤器面板是一个非常有用的工具，可以影响你在表格面板中看到的数据。\n\
  \n这是对 EnCase 的非常简要介绍。它是执法部门非常流行的工具，供应商 Guidance Software 为其产品提供培训。你可以访问供应商网站获取更多详情：[`www.guidancesoftware.com/`](http://www.guidancesoftware.com/)。\n\
  \n### Forensic Toolkit\n\n来自 AccessData 的 Forensic Toolkit (FTK) 是另一种广泛使用的取证分析工具，在执法部门也非常受欢迎。你可以在公司网站\
  \ [`accessdata.com/product-download/digital-forensics`](http://www.accessdata.com/products/digital-forensics)\
  \ 获取更多详情，但本节将回顾该工具的一些基础。\n\n\n\n\n\n通过 `FTK`，你可以在拷贝驱动器时选择使用何种哈希值来验证驱动器、在嫌疑硬盘上使用哪些功能，以及如何进行搜索，如图\
  \ FIGURE 3-4 所示。\n\n![FIGURE 3-4 FTK 功能。](img/9781284244496_CH03_FIGF04.jpg)\n\n\
  图 3-4 FTK 功能。\n\n取证工具包（Forensic Toolkit）在破解密码方面特别有用。例如，受密码保护的可移动文档格式（PDF）文件、Excel\
  \ 表格和其他文档通常包含重要信息。`FTK` 还提供了搜索和分析 `Windows Registry`（Windows 表）的工具。`Windows Registry`\
  \ 是 Windows 存储所有已安装程序信息的地方。这包括病毒、蠕虫、木马、根内核、隐藏程序和间谍软件。能够有效高效地扫描 `Registry` 以寻找证据是至关重要的。\n\
  \n`FTK` 为你提供了一套强大的工具来检查电子邮件。电子邮件可以按时间线进行排列，让调查人员能够获得整个邮件对话的完整视图，并能够关注任何特定的感兴趣条目，如图\
  \ FIGURE 3-5 所示。\n\n![FIGURE 3-5 邮件分析。](img/9781284244496_CH03_FIGF05.jpg)\n\n图\
  \ 3-5 邮件分析。\n\n该工具包的另一个特性是它的分布式处理能力。扫描整个硬盘、搜索 `Registry` 以及对计算机进行完整的取证分析可能是一项非常耗时的任务。通过\
  \ `AccessData’s Forensic Toolkit`，处理和分析可以分发到多达三台计算机上。这使得所有三台计算机可以并行执行分析的三个部分，从而显著加快了取证过程。此外，`FTK`\
  \ 还有一个名为 `Explicit Image Detection`（显式图像检测）的插件，可以自动检测色情图像。这在涉及色情指控的案件中非常有用，对于执法部门来说是一个特别有用的工具。`FTK`\
  \ 支持 `Windows` 或 `Mac OS`。\n\n### OSForensics\n\n来自澳大利亚 `PassMark Software` 公司的\
  \ `OSForensics` 工具自 2010 年左右以来已被广泛使用。该工具最早的吸引人的特点之一是它的成本。完整版价格为 899 美元，仅是许多其他成本的一小部分。它还提供功能全\
  \ 30 天试用版。此外，它非常易用。它能完成 `EnCase` 和 `FTK` 大的大部分工作，但缺乏这些产品的一些专业功能。例如，`OSForensics`\
  \ 没有像 `FTK` 那样拥有 `Known File Filter`（已知文件过滤器）。你将在本书书中看到一些实验室使用 `OSForenics`。\n\n\
  ### Helix\n\n`Helix` 是一种用于计算机取证的自定义 `Linux Live CD`。使用 `Helix CDs` 将嫌疑系统引导至 `Linux`，然后使用\
  \ `Helix` 提供的工具进行分析。该产品功能强大且完备，但就是没有像 `AccessData’s FTK` 和 `Guidance Software’s\
  \ EnCase` 那么流行。更多信息请访问其网站：[`www.e-fense.com/products.php`](http://www.e-fense.com/products.php)。\n\
  \n### Kali Linux\n\n`Kali Linux`（以前称为 `BackTrack`）是一种 `Linux Live CD`，你用它引导系统并使用其中的工具。`Kali`\
  \ 是一个免费的 `Linux 发行版`，对于教学取证的学校或预算严格的实验室来说极具吸引力。然而，它不仅仅用于取证，因为它提供了广泛的通用安全和黑客工具。###\
  \ Kali Linux\n\n（注：由于原文后续部分存在大量重复和逻辑乱码，此处已根据“不要重复输出原文”的原则，对具有意义的段落进行了完整翻译。）\n\n\n\
  \n\n\n关于互联网上提供的各种法证工具，完全可以写好几本书了。对于任何调查员来说，花些时间在网上搜索并尝试各种工具都是一个好主意。根据你自己的技能组合、技术背景和偏好，你可能会发现某个工具比其他工具更适用。此外，建议在选择好一个工具后，在互联网上搜索关于该工具的文章。确保它具有广泛的认可度，并且在使用过程中没有已知的问题。使用多个工具来搜索硬盘也可能大有帮助。如果多个工具得出了相同的结果，这可以预先防范对方律师或其专家在审判中可能尝试提出的任何异议。并且记住——一如既往——要记录下你调查过程的每一个步骤。\n\
  \n## 取证认证\n\n你拥有了实验室，拥有了软件，但人员方面该如何考虑呢？在考虑潜在候选人时，寻找参加过法证分析课程的候选人是一个非常好的第一步，但你也应该寻找获得行业认证的候选人。在查看具体的认证之前，让我们泛泛讨论一下计算机认证。\n\
  \n认证一直是一个具有争议的话题。有些人对其深信不疑，甚至不会面试没有几个证书的候选人。另一些人则认为它们一文不值。这个问题源于对认证含义的误解。认证并不是为了证明某人是特定领域的专家或大师。但认证确实意味着某人拥有与该认证水平相当的实践知识。它的目的是展示一种能力的基准。\n\
  \n想一下医学学位。仅仅拥有一个 `MD`（医学博士）并不能保证此人就是一位卓越的医生。它只是表明此人达到了某个最低技能水平。医生之间的技能确实存在巨大的差异。IT\
  \ 认证也是如此。有些人拥有由 `国际信息系统安全认证联合会 (ISC)² (ISC)^(2®)` 颁发的 `注册信息系统安全专业人员 (CISSP®)` 凭证，他们是才华横溢的安全专业人士，对安全有非常深入的理解并拥有广泛的技能。也有其他人持有该凭证仅具备中等水平。\n\
  \n认证的另一个问题是“训练营”（boot camp）。这些计划通常是为期四或五天的强化学习，将通过认证测试所需的材料强行灌给学生。在最后一天，当记忆记忆还留在他们脑海中时，他们参加了相关的认证测试。这确实导致许多训练营的参与者在几个月后就忘了一切；然而，这不应被视为培训的失败，而是学生的失败。如果你参加了训练营，那么在培训结束后，保持技能的更新是你的责任。\n\
  \n无论你对认证持什么种个人态度，事实是：作为法证分析师，这些认证只能对你的简历有帮助。然而，这并不意味着你应该仅仅凭认证就聘用任何 IT 专业人员——它们只是整个简历中的一部分。正确的认证与正规教育及经验相结合，可以构成一个理想的候选人。\n\
  \n那么，什么是正确的认证呢？法证学是一个非常广泛的话题，要求分析师既要有广博又深深的知识。其中部分知识是在正式的学位课程中获得的，而另一部分是在工作中获得的。但在任何你有知识空白的地方，或者仅仅想增强你的简历的地方，都是添加认证的好地方。你需要了解以下领域：\n\
  \n*   PC 硬件——这可以在大学的基础硬件课程中获得，也可以通过 `CompTIA A+` 认证获得。\n*   基础网络——大多数与计算机科学相关的学位都包含基础网络课程。这满足了你作为法证专家的需求。然而，你可能考虑\
  \ `CompTIA Network+` 或 `思科认证网络助理师 (CCNA)` 认证。\n*   安全——你必须具备通用的安全知识。通过 `(ISC)² CISSP`\
  \ 认证或 `CompTIA Security+` 认证是最好的证明。\n*   黑客攻击——是的，你确实需要知道黑客所知道的。这一研究领域有几个认证。其中一个是\
  \ Offensive Security 的测试。该测试需要实战黑客攻击。此外，还有针对该研究领域的几个认证……\n\n（注：原文提供的文本在“Offensive\
  \ Security's test”之后似乎中断，此处已按原文结束翻译）\n\n\n\n\n\n### 3. 使用不同的成像工具为每项证据制作两个副本\n\n\
  ### 4. 仅存储原始证据项\n\n### 2. Bob 被要求对受损系统中的所有证据制作副本。Melanie 对系统上的所有文件执行了 `DOS` 复制。你建议或不建议使用磁盘成像工具的主要原因是什么？\n\
  \n1. 磁盘成像工具会检查内部自检和验证，并具有 `MD5` 校验和值。\n2. 证据文件格式将包含取证人员输入的案件数据，并并在证据文件开头对这些数据进行加密。\n\
  3. 简单的 `DOS` 复制将不包含已删除的文件、文件空隙（file slack）和其他其他信息。\n4. 不需要成像工具，因为它将使用封闭的专有格式，如果与原始文件进行比较，将无法逐扇区地匹配。\n\
  \n### 3. 在作词期间， \\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_ 次（s）言过其实的行为就会毁掉你的名誉。\n\n1. 仅此一次（如果是重大案件）\n\
  2. 几次\n3. 仅此一次\n4. 至少两次\n\n### 4. `MD5` 消息摘要算法用于 \\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\\
  _\\_。\n\n1. 在回收磁介质之前擦除它\n2. 在证据磁盘上创建目录\n3. 查看证据驱动器上的图形文件\n4. 对磁盘进行哈希处理，以验证在检查时磁盘未被篡改\n\
  \n### 5. 你应该对嫌疑驱动器至少制作两个位流副本（bitstream copies）。\n\n1. 正确\n2. 错误\n\n### 6. 对嫌疑驱动器的副本进行哈希处理的目的是？\n\
  \n1. 为了使其安全\n2. 为了删除病毒\n3. 为了检查更改\n4. 为了将其变为只读\n\n### 7. 你在非必要的情况下不再触碰实际原始证据最重要的原因是什么？\n\
  \n1. 每当你接触数字数据，都有篡改它的可能。\n2. 你可能会被指控栽造证据。\n3. 你可能会意外解密文件。\n4. 它会导致数据退化。\n\n## 参考文献\n\
  \n1. 康奈尔法学院法律信息学院。(n.d.)。规则 901。专家证人证。检索自 [`www.law.cornell.edu/rules/fre/rule_901`](https://www.law.cornell.edu/rules/fre/rule_901)，于\
  \ 2021 年 1 月 27 日。\n\n2. 康奈尔法学院法律信息学院。(n.d.)。规则 703。专家依据。检索自 [`www.law.cornell.edu/rules/fre/rule_703`](https://www.law.cornell.edu/rules/fre/rule_703)，于\
  \ 2021 年 1 月 27 日。\n\n3. 康奈尔法学院法律信息学院。(n.d.)。规则 705。披露专家基础事实或数据。检索自 [`www.law.cornell.edu/rules/fre/rule_705`](https://www.law.cornell.edu/rules/fre/rule_705)，于\
  \ 2021 年 1 月 27 日。\n\n4. Rahman, M. (2020). 15 位律师分享他们的专家证人恐怖故事。Expert Institute:\
  \ 与专家合作[博客]。检索自 [`www.expertinstitute.com/resources/insights/15-attorneys-share-their-expert-witness-horror-stories/`](https://www.expertinstitute.com/resources/insights/15-attorneys-share-their-expert-witness-horror-stories/)\n\
  \n\n\n\n图 4-4 使用 `openfiles`。\n\n你应该在关闭机器之前运行这些每一个命令并拍摄结果。同时，请记录你运行了这些命令、开始时间以及结果。然后关闭机器。大多数来源建议你直接拔掉插头。这可能与你通常关机的方式不同，但其目的是中断正常操作。虽然可能性不太大，但机器上可能存在某些恶意软件，它们会在正常关机或随后的开机过程中删除文件、清除交换空间或其他破坏证据。\n\
  \n#### 捕获内存\n\n如果你认为稍后可能需要分析系统内存，那么现在必须捕获内存。现在有很多可以捕获内存的工具。记住洛卡德的转移原则——即与环境的交互会改变环境——你将希望从\
  \ USB 设备运行这些工具，而不是直接在受嫌疑系统上运行。`OSForensics` 可以安装到 USB 中并捕获系统内存。你可以在图 4-5 中看到这一点。\n\
  \n![图 4-5 使用 OSForensics 捕获内存。](img/9781284244496_CH04_FIGF05.jpg)\n\n图 4-5 使用 `OSForensics`\
  \ 捕获内存。\n\n`Magnet RAM Capture` 和 `DumpIt` 是两个可以捕获内存的免费工具。使用你最喜欢的搜索引擎可以在互联网上很容易找到它们。AccessData\
  \ 的 `FTK`（稍后我们将看到它用于捕驱动器镜像）也可以用于捕获内存。\n\n你还需要记录设备周围的环境。是否连接了打印机或其他外部设备？记录任何连接的电缆，因为这些可能表明之前连接过外部设备或驱动器。只需记住，信息和细节越越多越好。\n\
  \n#### 将计算机系统运输到安全地点\n\n被收的计算机通常存储在安全性不高的的地方。执法机构和公司有时未能妥善地运输和存储嫌疑系统。你必须将目标计算机视为证据，并将其存放在好奇计算机用户无法接触的地方。有时，个人在操作被收的计算机时并不知道他们正在破坏潜在的证据和证据链。被无人看管的被收计算机很容易被破坏。有人可能会栽植证据或破坏关键证据。缺乏适当的证据链可能会让精明的辩护律师有机可乘。如果没有适当的证据链，你就无法确保证据在收缴后没有被植入计算机中。\n\
  \n在运输过程中，你必须意识到这台被收的计算机是证据。它应该锁在车辆内，车辆应该直接开往实验室。这不是停下来吃午的时候！任何你无法解释证据去向的时间都是证据链的断裂。当你停在你最喜欢的午餐点时，有人完全可能闯入车辆。\n\
  \n#### 准备系统\n\n如果你收缴的设备是计算机，你你需要从嫌疑机器中拆下驱动器，即使该驱动器目前没有连接到任何电缆。创建一个证据链表单。你可以在图 4-6A\
  \ 中看到证据表单。\n\n![图 4-5 使用 OSForensics 捕获内存。](img/9781284244496_CH04_FIGF05.jpg)\n\
  \n\n\n你必须能够证明在获取嫌疑计算机后，你没有更改过任何证据。这种证明有助于反驳有关调查人员更改或修改了原始证据的指控。在对任何驱动器进行镜像后，你必须始终为原始文件和副本创建一个\
  \ `hash`（有关哈希的更多信息，请参阅 FYI“什么是哈值？”）。比较这些哈值。如果它们不完全匹配，说明内容被更改过。你还必须记录使用了哪种哈希算法（`SHA1`\
  \ 是常见的，但 `SHA2` 的使用频率越来越高）以及结果如何。Linux 内置了哈希工具，但许多取证工具如 `EnCase` 和 `Forensic Toolkit`\
  \ (`FTK`) 在镜像完成后都会对嫌疑硬盘进行哈希处理，以检查复制错误。`OSForensics` 在镜像完成后也会为嫌疑硬盘创建一个 `hash`。\n\n\
  在 Linux 中，以下命令对分区进行哈希处理：\n\n```\nmd5sum /dev/hda1\n```\n\n这假设该分区为 `hda1`。如果你的分区不同，请替换为你的分区名称。如果你想将该哈值发送到目标机器（例如你的取证服务器），请使用此命令：\n\
  \n```\nmd5sum /dev/hda1 | nc 192.168.0.2 8888\n```\n\n此命令表示创建分区的哈值，然后使用 `netcat`\
  \ 将其发送到 IP `192.168.0.2` 端口 `8888`。显然，你的 IP 地址和端口可能不同。\n\n## 证据处理\n\n一旦你妥善运输了设备并为取证检查做好了准备，你就必须处理证据。有特定的步骤需要遵循。\n\
  \n保护计算机证据需要对事件发现程序进行规划和培训。以下章节介绍了与处理证据相关的任务以及在收集证据时采取的措施。回顾一下，系统取证专家在处理证据方面有三个基本任务：\n\
  \n*   寻找证据\n*   保护证据\n*   准备证据\n\n### 收集数据\n\n取证调查人员必须收集的三类主要数据：易失性数据、临时数据持久性数据。作为调查人员，你必须尝试避免数据的永久丢失。因此，你必须首先妥善保护物理证据；然后就可以收集易失数据和临时数据。这类数据每当系统使用时就会丢失，因此你应该先收集它们，以尽可能地减少损坏或丢失。以下是易失数据的示例：\n\
  \n*   `Swap file`——交换文件被用于优化随机访问内存（`RAM`）的使用。在交换文件中经常可以发现数据。从交换文件中提取数据的细节取决于安装的操作系统。虽然我们仍然称其为交换文件，但在现代\
  \ Windows 系统中，它实际上是 `pagefile.sys`。\n*   网络连接状态——这些数据在系统关机之前捕获。\n*   运行进程状态——这些数据在系统关机之前捕获。\n\
  \n在收集易失性数据后，你收集 `temporary data`（临时数据）——操作系统创建并覆盖，而计算机用户没有采取直接操作保存这些数据。损坏临时数据的概率低于易失性数据。但临时数据仅仅是临时的——临时的——你必须在它丢失之前收集它。只有在收集了易失和临时数据之后，你才应该开始收集持久性数据。\n\
  \n### 记录文件名、日期和时间\n\n从证据的角度来看，文件名、创建日期以及最后修改日期和时间可能是相关的。因此，对所有已分配和“已删除”的文件进行分类非常重要。根据文件名、文件大小、文件内容、创建日期以及最后修改日期和时间对文件进行排序。此类排序信息可以提供计算机使用的时间线。输出应采用兼容文字处理器的文件格式，以帮助记录与特定文件相关的计算机证据问题。\n\
  \n### 识别文件、程序和存储异常\n\n加密、压缩和图形文件以二进制格式存储数据。因此，文本搜索程序无法识别存储在这些文件格式中的文本数据。这些文件需要人工评估，这可能涉及大量工作，特别是对于加密文件。根据文件类型，查看并评估内容以作为潜在证据。检查查获硬盘驱动器的分区情况也很重要。评估隐藏分区以寻找证据并记录其存在性。对于\
  \ Windows 操作系统，你还应该评估`回收站` 中包含的文件。`回收站` 是计算机用户选择删除的文件存储库。它们被选择删除的这一事实从证据角度来看可能具有某些相关性。如果你发现了相关文件，请详细记录所涉及的问题。这些问题可能包括：\n\
  \n*   你是如何找到这些文件的文件的？\n*   它们处于什么状态（即，你恢复了整个文件还是只是部分文件）？\n*   文件最初是什么时候保存的？\n\n\
  记住，关于证据记录的信息越多越好。\n\n### 证据收集措施\n\n取证专家在收集证据时应 de 采取以下措施：\n\n*   避免更改证据——在移除任何设备之前，取证专家应对现场的设备进行拍照，并对电线和插座进行标记，以便计算机和外设能够按照原样完全重新组装。在运输计算机、外设和介质时，取证专家必须小心避免热损坏、震动或接触原始硬盘和光盘（`CDs`）。取证专家还应该制作精确的位拷贝，并将副本存储在不可更改的介质上，如\
  \ `DVD-ROM`。\n*   确定证据创建的时间——计算机使用和文件访问的时间线可以是计算机证据的重要来源。文件创建、最后访问或修改的时间日期可能会决定案件的成败。然而，取证专家不应信任计算机的内部时钟或活动日志。内部时钟可能是错误的，可能篡改了日志，或者仅仅启动计算机就会不可恢复地更改日志。在日志消失之前，调查人员应该捕获文档创建、最后打开以及最后更改的时间。然后，调查人员可以根据时间标准对证据进行校准或重新校准，并绕过日志篡改。\n\
  *   搜索整个设备——取证专家必须在位级（1 和 0 的级别）对计算机内部的广泛区域进行搜索。这包括电子邮件、临时文件、交换文件、逻辑文件结构以及硬盘上的空隙和空闲空间。他们必须搜索软件设置、脚本文件、网络浏览器数据缓存、书签和历史以及会话日志。取证专家可以将证据与活动和来源联系起来。\n\
  \n\n\n\n*   **确定有关加密和隐写文件的信息**——调查人员通常不应尝试解码加密文件。相反，调查人员应该在计算机中寻找证据，以告知他们加密文件中包含的内容。通常情况下，这些证据已被删除，但`unencrypted\
  \ traces`（未加密的痕迹）仍然存在，并可用于破案。对于隐写信息——即隐藏在其他文件中的信息，或者埋藏在图片的 1 和 0 中的信息——调查人员可以判断数据确实在那里，尽管它们无法访问。调查人员可以通过对比几乎相同的文件来识别细微差异。我们将在第\
  \ 5 章中对此进行详细探讨。\n\n*   **良好地展示证据**——法医鉴定人员必须以逻辑清晰、引人且具说服的方式展示计算机证据。陪审团必须能够理解这些证据，而且证据必须足够坚实，使辩护律师无法反驳。法医鉴定人员必须能够创建逐步的行动重建，并附有记录日期和时间。此外，法医鉴定人员必须准备图表、图形和证物，解释做了什么、描述是如何做的，并能经得起推敲。法医鉴定人员的证词必须简单清晰地解释嫌疑人做了或没有做什么。法医鉴定人员应该记住，陪审团和法官很少精通计算机技术，法医鉴定人员用通俗易懂的英语清晰解释技术点的能力决定案件案件成败。\n\
  \n### 要检查的内容\n\n本章目前为止讨论了初始扣收、复制和发现数字证据涉及的通用准备工作。还有很多需要学习的内容，特别是通过检查数据来寻找犯罪证据——即显示或倾向于显示某人参与某行为的证据，或者可以确定罪行的证据。取证分析的三种技术之一是`live\
  \ analysis`（现场分析），对任何正在进行的网络过程进行记录。另外两种技术是物理分析和逻辑分析，它们都涉及硬盘结构和文件格式。\n\n物理镜像是对磁盘进行物理拷贝。这是一种位级拷贝。取证工具会为你完成此操作，这也是对计算机驱动器进行镜像的方法。在某些情况下，你无法对手机进行物理镜像。逻辑镜像使用目标系统的文件系统将数据复制到镜像中进行分析。这可能会漏掉已删除的文件、不再文件系统中但在硬盘上的文件以及类似数据。\n\
  \n最易提取和分析的两个内容是所有网站统一资源定位符（`URLs`）的列表以及计算机上所有电子邮件地址的列表。用户可能尝试过删除这些内容，但你可以从硬盘上的各个处重构它们。接下来，你应该对不同类型的文件格式建立索引。\n\
  \n你开始使用的文件格式取决于案件类型。例如，在色情或伪造案件中，你可能想从图形文件格式或文档格式开始。有许多文件格式需要考虑，包括多媒体、存档、二进制、字体和\
  \ `JPEG`。计算机通常以各种格式保存内容。例如，`JPEG` 文件通常包含调查人员可以使用的元数据。\n\n#### 交换文件\n\n以下章节描述了法医分析中最重要的几个区域。`swap\
  \ file`（交换文件）是操作系统在 `RAM` 满时用于存储数据的文件。它可以作为 `RAM` 的扩展，通常包含用户活动的残留信息，包括密码和打开的文档。在\
  \ Windows 系统中，`swap file` 通常位于 `pagefile.sys`。\n\n#### 未分配空间\n\n未分配空间是磁盘上未被任何文件当前使用的区域。当文件被删除时，系统会将该空间标记为未分配，但实际数据在被覆盖之前仍然存在。该区域对于寻找删除证据的法医调查人员来说是一个金矿。取证工具使用`sweepers](#9781284244496_Glossary.xhtml#gloss-114)`和`scrubbers](#9781284244496_Glossary.xhtml#gloss-31)`来覆盖这些数据，但在运行这些进程之前，信息是可以恢复的。\n\
  \n\n\n\n为了重建导致系统损坏的事件，请创建一个时间线。这在涉及计算机时可能变得尤为困难。时钟偏移、报告延迟和不同的时区可能会导致混乱。切不要更改嫌疑系统上的时钟。相反，记录任何时钟偏移和所使用的时区。使用时间线格式或\
  \ TLN 管道分隔符格式（“管道”是一个像这样的垂直线字符：`|`）也是很常见的，该格式包含五个值：时间 | 来源 | 系统 | 用户 | 描述。因此，记录可能看起来如下：\n\
  \n* 10-04-2020 | 15:45:23 | Chrome 浏览器 | Windows 10  | Jsmith | 访问了一个允许下载病毒源代码的网站。\n\
  * 10-6-2020 | 05:03:54 | FileZilla FTP 客户端 | Windows 10  | Jsmith | 向受害者公司服务器上传了病毒。\n\
  * 10-7-2020 | 10:14:20 | 通话应用 | 三星 S9 手机 | Jsmith | 拨了受害者公司的电话。\n\n这只是一个非常短的片段，但你可以看到，将事物排序可以让人对活动有一个非常清晰的视图，并对犯罪产生理解，即使证据来自不同的设备。在这种情况下，犯罪者似乎下载了病毒代码，两天后将其上传到目标设备。然后他在第二天拨打了目标对象的电话。那个电话很可能是为了看起来像是一次关于\
  \ PC 维修服务的随机推销。这实际上是一个并不罕见的骗局：犯罪者制造了问题，然后声称要修复该问题。\n\n## 存储格式\n\n在进行取证工作时，你需要熟悉各种存储格式。具体来说，你应该熟悉各种硬盘类型、文件系统和日志记录。本节回顾了各种存储和文件格式，并探讨了存储格式的其他问题。\n\
  \n### 磁介质\n\n尽管像智能手机和平板电脑等移动设备是取证工作中日益增长的一部分，但计算机仍然是取证调查最大的目标。大多数计算机利用磁介质。硬盘和软磁盘都是磁介质的类型。基本上，数据是通过扇区和簇组织的，而扇区和簇又组织在盘周围的轨道上。一个典型的扇区为\
  \ `512` 字节，尽管较新的驱动器使用 `4096`-字节扇区，而一个簇可以是 `1` 到 `128` 个扇区。\n\n由于数据是磁性存储的，因此驱动器容易受到磁干扰。这包括被去磁。如果驱动器已被去磁，则没有办法恢复数据。你应该使用特殊的传输袋运输驱动器，以减少静电干扰。这可以减少数据意外丢失的概率。\n\
  \n驱动器连接有五，无论驱动器是磁性的还是固态的（在本章稍后讨论）：\n\n* 集成电子设备 (`IDE`)\n* 扩展集成电子设备 (`EIDE`)\n* 并行高级技术附件\
  \ (`PATA`)\n* 串行高级技术附件 (`SATA`)\n* 串行 SCSI\n\n这些驱动类型指的是驱动器与主板之间的连接以及驱动器的总容量。`SATA`驱动器已成为标准，也是你最常见的。`Serial\
  \ SCSI` 可以在某些服务器找到。然而，`IDE`、`EIDE` 或 `PATA` 只会在非常旧系统中找到。\n\n重要的是，由于磁硬盘内部有运动部件，它们也容易受到物理损坏。如果你掉了驱动器，可能会导致数据无法访问。这就是为什么在处理磁硬盘时必须小心的原因之一。\n\
  \n### 固态硬盘\n\n固态硬盘 (`SSDs`) 使用微芯片，这些芯片在非易失性内存芯片中保留数据且不包含运动部件。大多数 `SSDs` 使用基于非与门\
  \ (`NAND`) 的闪存，即使在没有电源的情况下也能保留内存。由于没有运动部件，这些驱动器通常比磁硬盘更不容易受到物理损坏。它们已成为许多内部驱动和所有外部驱动器的标准。\n\
  \n这些驱动器之所以如此受欢迎，原因在于它们通常只需要硬盘二分之一到三分之一的功率。`SSDs` 的启动时间通常比磁性存储驱动器快得多。它们经常被用于平板电脑和一些笔记本电脑。这意味着你在取证职业生涯的某个点很可能会遇到它们。\n\
  \n如果这些驱动器是内部的，它们可以使用磁硬盘使用的相同接口，包括 `SCSI` 和 `SATA`。然而，如果是外部连接的，它们最常见的是通用串行总线 (`USB`)\
  \ 连接。\n\n磁硬盘和固态硬盘都包含几个对取证至重要的特征：\n\n* 主机保护区域 (`HPA`)——这被设计为一个区域，计算机供应商可以在其中存储免受用户活动和操作系统实用程序（如删除和格式化）保护的数据。为了在\
  \ `HPA` 中隐藏数据，人员需要编写一个程序来访问 `HPA` 并写入数据。\n* 主引导记录 (`MBR`)——这只需要一个扇区，留下了 `62` 个空的\
  \ `MBR` 扇区。\n* 卷碎片——如果分区没有使用所有可用空间，则硬盘上存在这种空间。\n* 未分配空间——操作系统无法访问分区中的未分配空间。该空间可能包含数据。\n\
  * 被标记为坏的好块——假设有人操作文件系统，将未使用块标记为坏。操作系统将不再访问这些块。这些块可以用来隐藏数据。\n* 文件碎片——文件碎片是文件结束与分配给文件的最后一个簇结束之间的未使用空间。\n\
  \n### 数字磁带驱动器\n\n\n\n\n像硬盘一样，`CD-ROMs`、`DVD` 和 `Blu-ray disks` 等光介质使用高低极化来设置数据位；然而，CD\
  \ 具有代表低位的反射凹槽（pits）。如果不存在凹槽，则数据为 1；如果存在凹槽，则为 0。激光机制实际上通过检测光束传输的距离来检测凹槽的存在。这就是为什么划痕会对光介质产生问题的原因。\n\
  \n自从原始紧凑光盘问世以来，已经有了许多改进。这些改进仍然利用相同的光学过程，但容量更大。`DVD`（或数字视频光盘）单面 `DVD` 可以存储 4.7 吉字节（GB），双面\
  \ `DVD` 可以存储 9.4 GB。这项技术使用 650 纳米波长的二极管光，而 CD 使用的是 780 纳米。较短的波长允许 `DVD` 使用更小的凹槽，从而增加了存储容量。\n\
  \n`Blu-ray discs` 是 `DVD` 的继任者，每层存储高达 25 GB，双层光盘存储高达 50 GB。还有三层和四层光盘，例如 `Blu-ray\
  \ Disc XL`，允许高达 150 GB 的存储。虽然 `Blu-ray discs` 主要与电影相关，但你完全可以在上面存储数据。对于较小的机构，`Blu-ray\
  \ disc`可以是一种非常有吸引力的备份介质。\n\n与所有其他存储设备一样，`Blu-ray device` 应该被镜像复制到一个干净且经过取证擦写的驱动器上进行分析。无论何种介质，只要有可能，永远不要对原始嫌疑存储设备进行操作。\n\
  \n### 使用 USB 盘\n\n`USB` 或通用串行总线实际上是一种连接技术，而不是存储技术。`USB` 可用于连接磁性或固态外部驱动器。小型 `USB\
  \ flash drives`（也称为 U 盘）非常常见。这些驱动器很容易被擦除或覆盖。将数据从 `USB drive` 复制到目标取证驱动器进行分析至关重要。当然，你必须记录复制过程，并确保没有遗漏或更改任何内容。\n\
  \n`USB thumb drives` 没有移动部件。`USB thumb drives` 或 `external drives` 使用固态硬盘技术。由于没有移动部件，这些驱动器对冲击损坏具有抗性（即掉落可能不会损坏到它们）。从取证的角度来看，你应该记住许多此类驱动器都带有一个小开关，可以将它们设置为只读模式。在提取调查数据时，请随时使用该功能。如果驱动器处于只读模式，你就不可能意外更改数据。\n\
  \n目前最广泛使用的 `USB` 标准是 `USB 3.2`。然而，你仍然会发现大量的 `USB 2.0` 设备。`USB 4.0` 规范于 2019 年 8\
  \ 月发布。`USB` 规范之间的主要影响数据传输速度，对你的调查产生直接影响非常小，甚至没有。\n\n### 文件格式\n\n除了存储数据的物理手段外，还有多种文件格式用于在指定的存储设备上存储取证数据。对于取证分析，掌握这些格式的实用知识是非常重要的。\n\
  \n#### 高级取证格式\n\n高级取证文件格式（缩写 `AFF`）由 `Basis Technology` 发明。它是一个开放文件标准，有变体：`AFF`、`AFM`\
  \ 和 `AFD`。`AFF` 变体将所有数据和元数据存储在一个文件中。`AFM` 变体将数据和元数据存储在单独的文件，而 `AFD` 变体将数据和元数据存储在多个小文件中。`AFF`\
  \ 文件格式是 `AFF Library and Toolkit` 的一部分，这是一组开源计算机取证程序。`Sleuth Kit` 和 `Autopsy` 都支持这种文件格式。\n\
  \n#### EnCase\n\n`EnCase` 格式是 `Guidance Software` 定义的专有格式，用于其 `EnCase` 工具存储硬盘镜像和单个文件。它包含了文件的哈希值（hash），以确保文件从源设备复制时没有发生任何更改。\n\
  \n#### 通用取证压缩包\n\n`Gfzip` 是另一种用于存储取证检查结果的开源文件格式。\n\n## 取证镜像\n\n一旦你获取了物理介质，你就需要对其进行镜像。虽然大多数取证工具会自动为你完成镜像，但这个过程可以通过\
  \ Linux 启动盘以及 `dd` 和 `netcat` 命令完成。例如，即使介质是如 `Blu-ray` 这样的光设备，你也必须使用 `netcat` 设置取证服务器进行监听。此时，嫌疑驱动器和目标取证服务器都已进入\
  \ Linux 系统。\n\n`netcat` 命令通过网络连接读写位数据。在取证服务器上运行的命令为：\n\n```\nnetcat -l -p 8888 >\
  \ evidence.dd\n```\n\n这在从目标计算机发送数据之前，在取证服务器上设置了监听进程。该进程在端口 `8888` 上监听（`-l` 标志）（`-p\
  \ 8888` 命令），并接收所有输入并写入名为 `evidence.dd` 的文件中。如有必要，你始终可以使用另一个端口或文件名。你必须确保目标驱动器至少与嫌疑驱动器一样大。\n\
  \n在嫌疑计算机上，使用 `dd` 命令读取第一个分区：\n\n```\ndd if=/dev/sda1 | netcat 192.168.0.2 8888\n\
  ```\n\n`if` 标志指定输入文件，管道 `|` 将输出发送给 `netcat`。`192.168.0.2` 是取证服务器的 IP 地址，`8888` 是端口。该命令从\
  \ `/dev/sda1` 读取原始数据并通过网络发送到服务器。\n\n\n\n\n随后你将 `dd` 命令的输出通过给 `netcat`，它会将位流通过网络发送到监听取证计算机上指定的网络地址和端口。参数\
  \ `-w 3` 表示 `netcat` 在发现没有更多数据时，应等待 3 秒后关闭连接。这假设嫌疑分区为 `hda1`，但它也可能是不同的分区。\n\n此过程可以使用大多数主要的取证工具完成，包括来自\
  \ Guidance Software 的 `EnCase`、来自 PassMark Software 的 `OSForensics` 以及来自 AccessData\
  \ 的 `Forensic Toolkit`。\n\n### 使用 EnCase 进行镜像\n\n`EnCase` 是一种执法部门广泛使用的取证工具。一旦你将嫌疑者的硬盘从嫌疑机器上断开，就可以将该硬盘连接到取证计算机。在某些情况下，你首先连接到一个可以防止写入嫌疑设备的设备。`FastBlock`\
  \ 和 `Tableau` 是两种在取证中广泛使用的此类设备。\n\n在 `EnCase` 窗口顶部，点击工具栏上的 `New` 来开始你将处理的新案例。打开\
