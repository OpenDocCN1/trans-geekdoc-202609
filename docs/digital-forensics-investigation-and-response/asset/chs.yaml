  \n### NTFS\n\n`NTFS` 是 New Technology System（新技术文件系统）的缩写。在 `Windows` 中，删除文件是常见现象。这并不一定意味着某种恶意意图；它可能仅仅是删除不再需要的文件。这是一项轻而易举的任务——而技术上不太专业的犯罪分子认为，删除文件可以防止执法部门发现它。因此，你应该预料，在你检查的电脑中，经常会有证据被删除的情况。正因如此，法医取证调查员将执行的最基础任务之一就是检索被删除的数据。\n\
  \n从 `Windows 2000` 开始，`NTFS` 使用主文件表（MFT）来跟踪文件。从法医取证的角度来看，MFT 是非常重要的。MFT 包含了文件的元数据，例如创建时间、修改时间、权限等。当一个文件在\
  \ `NTFS` 中被删除时，MFT 中的记录会被标记为“可用”，但文件本身的数据并没有被物理删除。只有当用户清空回收站时，这些数据才会被新文件覆盖。因此，在\
  \ `NTFS` 系统中，恢复删除的文件是可行的。\n\n### FAT\n\n在 `FAT16` 和 `FAT32` 中，文件分配表（FAT）用于跟踪文件。当文件在\
  \ `FAT` 系统中被删除时，FAT 表中的对应项会被标记为可用，但文件数据仍然保留在磁盘上。这种机制允许法医工具恢复被删除的文件。\n\n1. 文件的目录项记录。\n\
  2. 文件的簇链。\n3. 文件分配表中的项。\n4. 文件的簇状态。\n5. 目录项标记。\n\n当文件在 `FAT` 系统被被时，FAT 表中的对应项会被标记为可用，但文件数据仍然保留在磁盘上。这种机制允许法医工具恢复被删除的文件。\n\
  \n\n\n\n从 Windows 7 直到 Windows 10，微软取消了 `INFO2` 文件。从 Vista 开始，回收站位于一个名为 `\\$Recycle.Bin\\\
  %SID%` 的隐藏目录中，其中 `%SID%` 是执行删除操作的用户的 SID。当文件被移动到回收站时，原始文件会被重命名为 `$R` 后面跟一组随机字符，但保留原始文件的扩展名。同时，系统会创建一个以\
  \ `$I` 开头的新文件，后面跟上与 `$R` 文件相同的随机字符组以及相同的扩展名；该文件包含原始文件名/路径、原始文件大小以及文件移动到回收站的日期和时间。请注意，所有的\
  \ `$I` 文件长度均恰为 544 字节。在 Windows 7 及更高版本中，`I$` 结构如下：\n\n-   第 0–7 字节：`$I` 文件头文件——始终设置为\
  \ `01`，后接七组 `00`。\n-   第 8–15 字节：原始文件大小——以十六进制存储，采用小端序格式。\n-   第 16–23 字节：删除日期/时间戳——用自\
  \ 1601 年 1 月 1 日午夜以来的秒数表示。如果你不想自己计算，可以使用 [`www.digital-detective.co.uk/freetools/decode.asp`](http://www.digital-detective.co.uk/freetools/decode.asp)\
  \ 上的 `Decode` 等程序来帮助确定精确的日期/时间。\n-   第 24–543 字节：原始文件路径/名称。\n\n文件系统认为，即使仅有一个位被使用，整个簇也会被视为完全占用。为了说明这一点，假设一个系统的扇区大小为\
  \ 4,096 字节。进一步假设它使用的簇大小为 10 个扇区。这意味着每个簇总共有 40,960 字节的存储空间。如果用户保存了一个大小为 42,000 字节的文件，文件系统将需要两个簇。第一个簇的所有\
  \ 10 个扇区都被使用了，但第二个簇仅使用了一个扇区。从文件系统的角度（即操作系统的角度）来看，两个簇都是完全占用的。这在图 6-2 中有所说明。\n\n![图\
  \ 6-2 Windows 簇。](img/9781284244496_CH06_FIGF02.jpg)\n\n图 6-2 Windows 簇。\n\n## Windows\
  \ 工具\n\n恢复删除的文件有多种机制。许多取证书籍都详细讨论了这一过程。在《The Official EnCE: EnCase Certified Examiner\
  \ Study Guide》中，第 2 章详尽讨论了文件系统，并讨论了如何使用 `EnCase` 恢复被删除的文件。¹在《Computer Forensics:\
  \ Hard Disk and Operating Systems: 2》书中，第 1 章处理了文件系统并讨论了如何恢复被删除的文件。²《The Basics\
  \ of Digital Forensics: The Primer for Getting Started in Digital Forensics》的第 2\
  \ 章讨论了被删除文件的恢复。³\n\n有很多工具可以从 Windows 计算机中恢复被删除的文件。本节介绍了其中一些工具。你应该花时间探索各种工具并选择一个你偏好的。只需使用你喜喜欢的搜索引擎搜索“如何恢复删除的文件”，就会得到许多可以尝试的工具。许多是免费的，不免费的通常提供试用版供你实验。\n\
  \n### DiskDigger\n\n`DiskDigger ([`diskdigger.org/`](http://diskdigger.org/))` 是一个易于使用的工具。它可以免费下载且功能完备。但在免费版中恢复文件时，你必须逐个进行恢复。如果你购买商业版，就可以恢复任意数量的文件。界面非常易用。当你启动程序时，你会看到一个类似于图\
  \ 6-3 所示的屏幕。\n\n![图 6-3 DiskDigger。](img/9781284244496_CH06_FIGF03.jpg)\n\n图 6-3\
  \ DiskDigger。\n\n然后你选择想要检查的驱动器，并选择 `Deep` 或 `Deeper`，如图 6-4 所示。区别在于使用了文件雕刻（file\
  \ carving）。\n\n![图 6-4 DiskDigger 开始数据恢复。](img/9781284244496_CH06_FIGF04.jpg)\n\n\
  图 6-4 DiskDigger 开始数据恢复。\n\n一旦恢复完成，你将看到一个类似于图 6-5 所示的屏幕。你可以选择任何文件并恢复它。在你的屏幕上，文件将以彩色显示。对于绿色文件，你应该获得整个文件。灰色表示部分文件，红色表示文件只剩下很少。\n\
  \n![图 6-5 使用 DiskDigger 恢复单个文件。](img/9781284244496_CH06_FIGF05.jpg)\n\n图 6-5 使用\
  \ DiskDigger 恢复单个文件。\n\n### 对文件或文件夹进行取证擦除\n\n许多网页报告，国防部操作手册 `DOD 5220.22-M` 建议用随机字符覆盖数据。为了确保数据被完全擦除，根据\
  \ 6-1 描述的对不同类型的介质进行擦除的矩阵实际上是不完整的。\n\n#### 表 6-1 介质擦除矩阵\n\n| 介质 | 清除 | 擦除 |\n| :---\
  \ | :--- | :--- |\n| 磁带 | 类型 I | a 或 b |\n| | 类型 II | a 或 b |\n| | 类型 III | a 或\
  \ b |\n| 磁盘 | 软盘 | a, b 或 c |\n| | 可移动式硬盘 | a, b 或 c |\n| | 不移动式硬盘 | a, b, c 或 d\
  \ |\n| 光学盘 | 读取多次 | c, d 或 m |\n| | 写一次，读取多次 (Worm) | c |\n| 存储器 | 动态随机访问存储器 (DRAM)\
  \ | c 或 g |\n| | 电子可改只读存储器 (EAPROM) | I |\n| | 电子可擦只读存储器 (EEPROM) | I |\n| | 闪存\
  \ EPROM (FEPROM) | I 且 i 或 m |\n| | 可编程只读存储器 (PROM) | c |\n| | 磁芯存储器 | a, b, e 或\
  \ m |\n| | 磁性线圈存储器 | c 和 f 或 m |\n| | 磁性电阻存储器 | c |\n| | 非易失性随机访问存储器 (NOVRAM) |\
  \ c 或 g |\n| | 只读存储器 ROM | m |\n| | 静态随机访问存储器 (SRAM) | c 或 g |\n| 设备 | | |\n| 阴极射线管\
  \ (CRT) | | q |\n| 打印机 | | |\n| 击打 | | p then g |\n| 激光 | | o then g |\n\na. 使用类型\
  \ I 消磁机。\nb. 使用类型 II 消磁机。\nc. 在所有可寻地址处覆盖单个字符。\nd. 在所有可寻地址处覆盖一个字符、其补反以及一个随机字符，然后验证。\n\
  e. 在所有可寻地址处覆盖一个字符、其补反以及一个随机字符。\nf. 每次覆盖在内存中停留时间应长于机密数据。\ng. 移除所有电源，包括电池电源。\nh. 向所有位置写入随机模式、全\
  \ 0 和全 1。\ni. 按照制造商的数据表进行全芯片擦除。\nj. 执行 i，然后执行 c，共计三次。\nk. 根据制造商建议进行紫外线擦除。\nl. 执行\
  \ k，但将时间增加三倍。\nm. 销毁——粉碎、焚烧、破碎或熔化。\nn. 仅在包含机密信息时需要销毁。\no. 运行五页非机密文本（字体测试）。\np. 丝带必须销毁。压板必须清洁。\n\
  q. 检查和/测试屏幕表面是否有烧录信息的痕迹。如果有，则必须销毁阴极射线管。\n\n\n\n\n\nWinUndelete (`www.winundelete.com/download.asp))\
  \ 是另一个相对易于使用的工具。启动时，它会运行一个向导，首先要求你选择要恢复的驱动器。这在[图 6-6`所示。\n\n![图 6-6 WinUndelete\
  \ 向导步骤 1：选择驱动器。](img/9781284244496_CH06_FIGF06.jpg)\n\n图 6-6 WinUndelete 向导步骤 1：选择驱动器。\n\
  \n第 2 步允许你选择想要恢复的文件类型。这在图 6-7 所示。\n\n![图 6-7 WinUndelete 步骤 2：选择文件类型。](img/9781284244496_CH06_FIGF07.jpg)\n\
  \n图 6-7 WinUndelete 步骤 2：选择文件类型。\n\n第三步是选择一个存放恢复文件的文件夹。你可以在图 6-8 中看到这一步。\n\n![图\
  \ 6-8 WinUndelete 步骤 3：选择恢复文件位置。](img/9781284244496_CH06_FIGF08.jpg)\n\n图 6-8 WinUndelete\
  \ 步骤 3：选择恢复文件位置。\n\n当 WinUndelete 完成恢复过程后，你可以进入该文件夹查看文件。\n\n### FreeUndelete\n\n\
  FreeUndelete (`www.officerecovery.com/freeundelete/)) 个人使用是免费的。商业用途需要付费。当你启动此程序时，第一个屏幕要求你选择想要从哪个驱动器恢复文件。这在[图\
  \ 6-9`所示。\n\n![图 6-9 FreeUndelete 选择驱动器。](img/9781284244496_CH06_FIGF09.jpg)\n\n\
  图 6-9 FreeUndelete 选择驱动器。\n\n然后你只需点击 `Scan` 按钮，任何可以完全或部分恢复的文件都将列出来。\n\n### OSForensics\n\
  \nOSForensics 是一个强大的取证工具。它也提供删除恢复功能。你可以从挂载的镜像或从活动系统中恢复删除的文件。你可以在 OSForensics 主界面左侧的菜单上找到“Deleted\
  \ Files Search（删除文件搜索）”，如图 6-10 所示。\n\n![图 6-10 OSForensics 删除文件搜索。](img/9781284244496_CH06_FIGF10.jpg)\n\
  \n图 6-10 OSForensics 删除文件搜索。\n\n搜索结果将通过颜色编码显示，表示恢复特定文件的概率大小。显然，某些文件的碎片化非常严重，极可能无法恢复。你可以在图\
  \ 6-11 中看到这一点。\n\n![图 6-11 OSForensics 删除文件结果。](img/9781284244496_CH06_FIGF11.jpg)\n\
  \n图 6-11 OSForensics 删除文件结果。\n\n### Autopsy\n\n另一个非常有趣的工具是 Autopsy，可以在 [https://www.autopsy.com/]\
  \ 获取。这是一个免费的开源数字取证工具。与许多取证工具一样，它包含了删除文件恢复功能。它最有趣的一点是，当加载磁盘镜像时，它会立即开始恢复删除的文件。这很重要，因为证据经常位于删除的文件中。这可以在图\
  \ 6-12 中看到。\n\n![图 6-12 Autopsy 恢复删除的文件。](img/9781284244496_CH06_FIGF12.jpg)\n\n\
  图 6-12 Autopsy 恢复删除的文件。\n\nAutopsy 是一款易用的取证工具。它不具备某些商业产品的所有高级功能。然而，作为对你的发现进行验证的第二个取证工具，它是极佳的选择。考虑到它是开源的，它是学生下载实验的理想选择。\n\
  \n当然还有其他用于恢复删除文件的工具。大多数取证工具，例如 Guidance Software 的 EnCase 和 AccessData 的 Forensic\
  \ ToolKit (FTK)，都可以恢复删除的文件。\n\n### Inodes\n\n（注：提示词中该节提供的文本似乎是损坏/重复的占位符文本。我已根据 Inodes\
  \ 的上下文清理了冗余的术描述。）\n\n大多数取证工具，例如 Guidance Software 的 EnCase 和 AccessData 的 Forensic\
  \ ToolKit (FTK)，都可以恢复删除的文件。\n\n#### 手动恢复\n\n这种方法依赖于使用 Linux 命令手动恢复删除的文件。它不需要外部工具。遗憾的是，不同的\
  \ Linux 发行版之间存在差异，因此无法保证此过程在你的特定 Linux 安装上一定有效。\n\n第一步是将系统移动到单用户模式。如果这是一个网络系统，你可能应该先通知网络用户。这可以通过\
  \ `wall` 命令来实现，它会向所有登录的用户发送消息。\n\n然后，你可以使用 `init` 命令进入单用户模式：\n\n```\ninit\n```\n\
  \n\n\n\n\n# Linux 数据恢复与分析工具\n\n## Grep 命令\n\nLinux/UNIX 命令 `grep` 可用于搜索文件、文件内容以及你可能任何想要搜索的内容。`grep`\
  \ 命令非常灵活，在 Linux 用户中非常受欢迎。例如，`grep -b 'search-text' /dev/partition > file.txt` 将在给定分区中搜索\
  \ `'search-text'`并将结果输出到 `file.txt`。\n\n你也可以使用以下语法：\n\n```bash\ngrep -iaB 10 -A\
  \ 100 forensics /dev/sda2 > file.txt\n```\n\n![在给定的分区中搜索 forensics 文字](img/9781284244496_CH06_01_UNIMG1.png)\n\
  \n## Linux 运行级别 (Run Levels)\n\nLinux 运行级别决定了操作系统运行的层级。`init` 命令允许你更改运行级别（表 6-2）。\n\
  \n### 表 6-2 使用 `init` 在 Linux 中更改运行级别\n\n| 模式 | 目录 | 运行级别描述 |\n| --- | --- | :---\
  \ |\n| 0 | `/etc/rc.d/rc0.d` | 停止 |\n| 1 | `/etc/rc.d/rc1.d` | 单用户模式 |\n| 2 | `/etc/rc.d/rc2.d`\
  \ | 未使用（用户自定义） |\n| 3 | `/etc/rc.d/rc3.d` | 不带 GUI 的完整多用户模式 |\n| 4 | `/etc/rc.d/rc4.d`\
  \ | 未使用（用户自定义） |\n| 5 | `/etc/rc.d/rc5.d` | 带 GUI 的完整多用户模式 |\n| 6 | `/etc/rc.d/rc6.d`\
  \ | 重启 |\n\n要恢复 `/dev/sda2` 上以单词 `forensics` 开头的文本文件，你可以尝试以下命令：\n\n```bash\nextundelete\
  \ /dev/sda4 --restore-all\n```\n\n在这种情况下，`grep` 正在搜索该短语，忽略大小写，遍历二进制文件，并本质上在寻找该文本，即使该文件的引用计数为零（即已被删除）。当然，如果文件块被覆盖了足够多次，那么它将无法恢复。\n\
  \n## extundelete 工具\n\n`extundelete` 工具（[`extundelete.sourceforge.net/`](http://extundelete.sourceforge.net/))\
  \ 同时支持 `Ext3` 和 `Ext4` 分区。该工具通过 shell 命令运行，这些命令相对简单。例如，如果你想从 `sda4` 分区恢复所有删除的文件，只需使用此命令：\n\
  \n```bash\nsudo apt-get install scalpel\n```\n\n该网站记录了你可以使用此工具的所有各种选项。\n\n## Scalpel\n\
  \n该工具同时支持 Linux 和 Mac OS，甚至可以编译源代码在 Windows 上运行。然而，在 Linux 中安装和使用最为简单。例如，如果你正在使用\
  \ Ubuntu Linux，只需以下命令即可安装：\n\n```bash\nsudo scalpel [device/filename] -o [output_directory]\n\
  ```\n\n接下来是文本编辑——配置文件为 `/etc/scalpel/scalpel.conf`。你会发现所有内容都被注释掉了——取消注释你想要恢复的特定文件格式即可。例如，如果你想恢复删除的\
  \ Zip 文件，则需要取消注释 `scalpel.conf` 中的 `.zip` 文件部分。\n\n接下来，在终端中运行以下命令：\n\n```bash\n\
  SLE=AVEF or SLE=10000*0.142\n```\n\n\n\n\n\n1. 将驱动器从其安装的系统中拆下，并将其连接到测试系统——一个功能正常的兼容系统。在不安装驱动器的情况下，仅连接数据线和电源线进行连接。\n\
  \n2. 从测试系统的内部硬盘启动测试系统。听听故障驱动器的声音，判断内部磁盘是否正在旋转。如果磁盘正在旋转，通常意味着磁盘没有发生灾难性故障。因此，你很可能恢复数据。\n\
  \n3. 确定故障驱动器是否被识别，以及是否可以作为测试系统的额外磁盘安装。如果驱动器安装成功，将所有目录和文件复制到测试系统的硬盘上。如果驱动器在一个系统上失败但在另一个系统上可以安装，则该驱动器可能是可用的。驱动器的失败可能是由于电源故障、操作系统损坏、恶意软件或其他原因。如果你可以操作该驱动器，请对恢复的数据运行病毒检查程序，并对目录和文件的完整性进行测试。\n\
  \n4. 如果硬盘未旋转或测试系统无法识别该硬盘，则进行有限修复。你可能会让硬盘启动，并且被测试系统识别。如果你可以修复驱动器，请使用专门软件将故障驱动器中的所有数据位镜像到恢复驱动器中。使用提取的原始镜像重构可用数据。尝试使用开源工具，如\
  \ `DCFLdd`（这是 `dd` 工具的增强版本）来恢复除物理损坏扇区以外的所有数据。\n\n5. 如必要，将设备发送给数据恢复专家，他们可能能够应用非常规的恢复技术。\n\
  \n数据可能被认为已经“丢失”，即使你尝试本地修复但失败了，也不会增加额外的损失。如果是如此，你可以尝试以下方法：\n\n1. 拆下打印电路板（PCB），并用一个来自已知完好驱动器的匹配电路板对其进行替换。\n\
  2. 使用来自已知完好驱动器的匹配部件更换读写头组件。\n3. 从原始驱动器中拆下硬盘盘片，并将其安装到已知完好的驱动器中。\n\n### 恢复逻辑损坏后的数据\n\
  \n文件系统的逻辑损坏比物理损坏更常见。逻辑损坏可能会防止主机操作系统挂载或使用该文件系统。停电可能导致逻辑损坏，使文件系统结构无法将内存中的信息完全写入存储介质。即使在启动或关机时关闭电脑也可能导致逻辑损坏。硬件控制器（尤其是\
  \ RAID（廉价磁盘阵列）控制器）、驱动程序以及系统崩溃也会产生相同。\n\n逻辑损坏会导致各种问题，例如系统崩溃或实际数据丢失。它可能会导致间歇性故障。它还会触发其他异常行为，例如目录无限递归以及驱动器报告剩余空间为负。某些程序可以修正由逻辑损坏引起的不一致。大多数操作系统为其原生文件系统提供了基本的修复工具。例如，Microsoft\
  \ Windows 有 `chkdsk`；Linux 带有 `fsck` 工具；Mac OS 提供“磁盘工具（Disk Utility）”。许多公司已经开发了解决逻辑文件系统错误的产品，例如\
  \ Sleuth Kit ([`www.sleuthkit.org`](http://www.sleuthkit.org))。即使操作系统的修复工具无法识别磁盘，第三方产品也可能恢复数据。`TestDisk`\
  \ ([`www.cgsecurity.org/wiki/TestDisk`](http://www.cgsecurity.org/wiki/TestDisk))\
  \ 就是一个例子。它可以恢复丢失的分区并重构损坏的分区表。\n\n#### 防止逻辑损坏\n\n日志型文件系统（如 `NTFS` 5.0 和 `Ext3`）有助于减少逻辑损坏的发生。在系统故障时，你可以将这些文件系统回滚到一致或稳定的状态。最可能丢失的信息是系统故障时位于驱动器缓存中的数据。\n\
  \n使用一致性检查应作为系统维护的例行部分。一致性检查可以防止文件系统软件漏洞和存储硬件设计上的兼容性问题。例如，磁盘控制器可能会报告文件系统结构已保存到磁盘，但数据实际上仍在写缓存中。如果计算机在这些数据仍在缓存时丢失电源，文件系统可能会处于不一致或不稳定的状态。为了避免这个问题，请使用在数据实际写入之前不报告数据已写入的硬件。另一个解决方案是使用带有电池备份的磁盘控制器。当断电恢复后，待处理的数据将写入磁盘。为了获得更大的保护，请使用系统电池备份以提供足够安全关闭系统的电力。\n\
  \n#### 逻辑损坏恢复技术\n\n恢复逻辑损坏后数据有两种常用技术：一致性检查和零知识分析。使用这些技术可以修复或绕过大多数逻辑损坏。然而，应用数据恢复软件并不能保证不会发生数据丢失。例如，当两个文件声称共享同一个分配单元时，其中一个文件几乎会丢失数据。\n\
  \n##### 一致性检查\n\n一致性检查涉及扫描磁盘逻辑结构并确保其与规范一致。例如，在大多数文件系统中，目录必须至少有两个条目：一个指向自身的点（`.`\
  \ 条目）和一个指向其父目录的点点（`..` 条目）。文件系统修复程序读取每个目录以确保这些条目存在并指向正确的目录。如果不存在，程序将显示错误信息，你可以修正问题。`chkdsk`\
  \ 和 `fsck` 都是以这种方式工作的。然而，一致性检查有两个主要问题：\n\n*   如果文件系统损坏非常严重，一致性检查可能会失败。在这种情况下，修复程序可能会崩溃，或者它可能认为驱动器具有无效的文件系统。\n\
  *   如果文件位置错误或无法解释，`chkdsk` 工具可能会自动删除数据文件。该工具这样做是为了确保操作系统能够正常运行。然而，被删除的文件可能是重要且无法替代的用户文件。\n\
  \n这种相同类型的问题也出现在通过删除之前的安装来恢复操作系统的系统恢复盘上。通过将操作系统安装在与用户数据不同的分区上，可以避免这个问题。\n\n#####\
  \ 零知识分析\n\n零知识分析是修复文件系统的第二种技术。在零知识分析中，对文件系统的状态很少做假设。使用对无损文件系统结构的知识从头开始重建文件系统。在此过程中，扫描受影响计算机的驱动，记录所有文件系统结构和可能的文件边界。然后将结果与正常文件系统的规范进行匹配。\n\
  \n零知识分析通常比一致性检查慢得多。然而，即使逻辑结构几乎完全损坏，你也可以用它恢复数据。这种技术通常不会修复损坏的文件系统，但允许你将数据提取到另一个存储设备上。\n\
  \n文件雕刻（File Carving）\n\n\n\n\n\n当文件仅部分恢复时，无论使用什么文件系统，你都可以使用文件雕刻（file carving）尝试恢复文件。一种流行的文件雕刻工具是\
  \ `Scalpel`，它在本章之前讨论过。文件雕刻有时仅称为“雕刻”，通常用于从损坏或文件本身损坏的磁盘中恢复数据。无论名称为何，其目的都是从更大的数据集（即整个磁盘或分区）从单个文件中提取数据。这是一种常见的数据恢复方法，特别是在文件元数据损坏的情况下。\n\
  \n大多数文件雕刻实用程序通过寻找文件头（headers）和/或文件尾（footers）来工作，然后提取这两个边界之间的数据。\n\n我们之前讨论过 `Scalpel`\
  \ 是可能的文件雕刻工具；另一个是 `carver-recovery`，它是一个免费工具，并且包含了源代码，方便你在需要时进行修改。它包含几个实用程序。`carver-recovery.exe`\
  \ 允许你选择驱动器镜像，并尝试尝试恢复文件。这是一种尝试从整个驱动器或分区恢复数据的通用工具。\n\n显然，要有效使用文件雕刻，人们需要熟悉文件头和文件尾。讨论所有文件头超出了本书的范围，但这里显示了一些常用文件的十六进制值：\n\
  \n| JPEG | `FF D8` |\n| --- | --- |\n| BMP | `42 4D` |\n| EXE | `4D 5A` |\n| GIF\
  \ | `47 49` |\n| MP3 | `49 44` |\n| PDF | `25 50` |\n| ZIP | `50 4B` |\n| PNG |\
  \ `89 50` |\n| WAV | `52 49` |\n| AVI | `52 49` |\n\n## 章节总结\n\n## 核心概念与术语\n\n##\
