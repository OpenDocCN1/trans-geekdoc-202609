  \ group、反斜杠、右括号、连字符、e x e c l s、连字符、l g、左括号、右括号、反斜杠、分号。](img/9781284244496_CH09_07_UNIMG13.png)\n\
  \n### 最后一天修改或创建的文件：\n\n![程序代码。在代码中，变量名中的单词合并在一起。第 1 行。find、正斜杠、连字符、m time、连字符、1。](img/9781284244496_CH09_07_UNIMG14.png)\n\
  \n### 列出所有隐藏目录：\n\n![程序代码。在代码中，变量名中的单词合并在一起。第 1 行。find、正斜杠、连字符、type d、连字符、name、左双引号、点、星号、右双引号。](img/9781284244496_CH09_07_UNIMG15.png)\n\
  \n## 在 Linux 中可以恢复删除吗？\n\n本节扩展了 Linux 文件的细节，并讨论了恢复被删除文件的方法。\n\n当你通过文件名引用文件时，操作系统会使用文件名查找对应的\
  \ inode，从而使系统能够获取执行后续操作所需信息。inode 是文件系统中的一种数据结构，存储了文件除名称和实际数据以外的所有信息。inode 可以指向文件，也可以指向目录。\n\
  \n从操作系统的角度来看，文件名实际上只是包含 inode 号的表格中的一个项。名称与文件没有直接关联。名称只是定位 inode 号的人类可读方法。\n\ninode\
  \ 实际上是指向文件的链接。操作系统维护着该链接的引用计数。当引用计数达到零时，文件就会被删除。这就是为什么被删除的文件有时可以恢复的原因。\n\n### 手动方法\n\
  \n在 Linux 中，当文件的内部 inode 链接计数达到零时，文件就会被删除。按照以下步骤检索被删除的文件：\n\n1. 将系统切换到单用户模式。可以使用\
  \ `init` 命令实现此目的。\n\n2. 一旦进入单用户模式，你可能会使用几种方法。以下是一种相当传统的 Unix/Linux 方法，使用 `grep`\
  \ 命令。使用以下 `grep` 语法：\n\n```\n![程序代码。在代码中，变量名中的单词合并在一起。第 1 行。g r e p、连字符、b、左单引号、search、连字符、text、右单引号、正斜杠、d\
  \ e v、正斜杠、partition、大于、file、点、t x t。](img/9781284244496_CH09_08_UNIMG1.png)\n```\n\
  \n或者\n\n```\n![程序代码。在代码中，变量名中的单词合并在一起。第 1 行。g r e p、连字符、a、连字符、B、左括号、size before、右括号、连字符、A、左括号、size\
  \ after、右括号、左单引号、text、右单引号、正斜杠、d e v、正斜杠、左括号、your、下划线。第 2 行。partition、右括号、大于、file、点、t\
  \ x t。](img/9781781284244496_CH09_08_UNIMG2.png)\n```\n\n使用的标志定义如下：\n- `-i`: 忽略\
  \ `PATTERN` 和输入文件的大小差异；即同时匹配大和小写字母。\n- `-a`: 将二进制文件当作文本处理。\n- `-B`: 打印匹配前的前上下文。\n\
  - `-A`: 打印匹配后的后上下文。\n\n例如，要恢复 `/dev/sda1` 上一个以“evidence”开头的文本文件，你可以尝试以下命令：\n\n```\n\
  ![程序代码。在代码中，变量名中的单词合并在一起。第 1 行。连字符、g r e p、连字符、i、连字符、a、连字符、B1010、左单引号、criminal evidence、右单引号、正斜杠、d\
  \ e v、正斜杠、s a 1、大于、file、点、t x t。](img/9781284244496_CH09_08_UNIMG3.png)\n```\n\n\
  3. 接下来，使用任何命令行文本编辑器（如 vi）查看 file.txt。然后你可以保存该文件。这只是恢复被删除文件的许多方法之一。\n\n### Kali Linux\
  \ 取证\n\n正如本章前面提到的，Kali Linux 发行版拥有许多取证工具。即使你已经有了令满意的商业工具，如 `OSForensics`、`FTK` 或\
  \ `EnCase`，通过使用第二个工具重复某些测试来确保质量控制通常也是非常好的主意。请注意，不同版本的 Kali 可能具有不同的工具。对于本节，我们使用的是\
  \ Kali Linux 2020b。拥有开源工具无疑是实现此点的一种成本效益的方法。\n\n\n\n\n\n你很快就会发现，大多数用于检查 Windows 机器的取证工具虽然可以在\
  \ Linux 磁盘镜像上运行，但提供的信息要少得多。因此，可能需要直接对镜像进行检查。现在，我并不是建议你直接在运行的 Linux 机器上到处乱点。你仍然需要为机器创建一个取证镜像，并使用适当的哈希算法验证该镜像。一旦你拥有了这样的镜像，你可能会发现你使用的取证工具没有提供太多信息。此时，下一步就是像挂载虚拟机一样挂载该镜像。\n\
  \n然而，你不能简单地将镜像文件挂载为虚拟机——那样行不通的。你需要一些工具来为你完成这一操作。互联网上有关于如何将取证镜像转换为虚拟机以供 `VMWare Workstation`、`Oracle\
  \ Virtual Box` 或其他类似产品使用的说明。不过，其中某些方法相当繁琐，而且并非在所有情况下都适用。\n\n取证工具 `ForensicExplorer`\
  \ ([`www.forensicexplorer.com/`](http://www.forensicexplorer.com/)]) 允许你将任何取证镜像挂载为虚拟机。然后，你可以登录该机器并像操作运行机器一样与其交互，但有一个主要的区别：这是一个只读取证镜像。现在，你可以导航到本章之前提到的文件夹和日志。你还可以执行\
  \ shell 命令并收集有关目标系统的信息。这通常是对 Linux 机器进行取证检查的最佳方法。\n\n## 更多 Linux 取证\n\n本章的节章节应该已经让你掌握了关于\
  \ Linux 和 Linux 取证的坚实工作知识。在本节中，我们将探索一些你应该考虑的额外 Linux 取证技术。\n\n### 文档记录\n\n你现在已经知道，对你的取证检查进行彻底记录是非常重要的。这需要收集大量数据。因此，了解能够提供你所需的系统信息的\
  \ Linux 命令至关重要。一个很好的开始点是 `cat` 命令。该命令有很多变体：\n\n* `cat /etc/os-release`\n* `cat /etc/hostname`\n\
  * `cat /etc/timezone`\n\n这些命令中的每一个都会为你提供基础的系统信息。\n\n### 高级命令\n\n在对 Linux 机器进行取证时，你可能会发现一些高级\
  \ Linux 命令非常有用。但你必须记住，并不是所有的 Linux 发行版都支持所有这些命令。以下是几个：\n\n* `dcat`——显示磁盘块的内容。\n\
  * `dls`——列出已删除磁盘块的内容。\n* `dcalc`——在 `dd` 镜像和 `dls` 结果之间建立映射。\n* `dstat`——列出与特定磁盘块相关的统计信息。\n\
  * `mmls`——显示磁盘镜像中的分区列表。\n* `locate`——此命令类似于 `find`。`-i` 参数使其忽略大小写。星号允许你组合单词——例如，`locate\
  \ -i finance\\*data`。\n* `xargs`——Linux 中的 `xargs` 命令是从标准输入构建执行管道的 shell 命令。虽然像\
  \ `grep` 这样的工具可以标准输入作为参数，但许多其他工具不能。使用 `xargs` 可以允许 `echo`、`rm` 和 `mkdir` 等工具接受标准输入作为参数。这里是将所有\
  \ `png` 图像拷贝到外部驱动器的示例：\n\n![Program code. In the code, the words in the code,](img/97812844496_CH09_01)\n\
  \n\n\n\n\n没过多久，团队就推出了 Apple II。这台电脑基于相同的微处理器，但采用了塑料外壳，并内置了键盘。它也是第一台具有彩色图形的个人电脑。随后，Apple\
  \ II 出了一系列增强型号：`Apple II+`、`IIe`、`IIc`、`IIc+`、`IIe Enhanced` 和 `IIe Platinum`。1986\
  \ 年发布了 `Apple IIGS`；这款电脑是 16 位而非 8 位。\n\nApple II 有多个操作系统，包括：\n\n*   `Apple DOS`（磁盘操作系统）——第一版于\
  \ 1978 年作为 `Apple DOS 3.1` 发布。它与 `Microsoft DOS` 没有任何关系。\n*   `Apple Pascal`——这基于\
  \ `p-system`，这是由加州大学圣地亚哥分校开发的操作系统。它本质上是一个运行 `p-code` 的虚拟机，而 `Pascal` 是它最受欢迎的语言。`Apple\
  \ Pascal` 是于 1979 年发布的类似设计。\n*   `Apple SOS`——该操作系统是为 `Apple III` 开发的。缩写代表 Sophisticated\
  \ Operating System（高级操作系统）。每个使用 `SOS` 的程序都会将操作系统加载到内存中。一个 `SOS` 应用程序磁盘由一个内核 (`SOS.kernel`)、一个解释器\
  \ (`SOS.Interp`，它通常就是应用程序本身）以及一组驱动程序 (`SOS.Driver`) 组成。\n*   `ProDOS`——旨在取代 `Apple\
  \ DOS 3.3`，并基于 `SOS`。它对编程有更多支持，包括汇编和 `BASIC`。最终，这导致了名为 `ProDOS 16` 的 16 位版本。\n*\
  \   `Lisa OS`——该操作系统具有完整的图形用户界面，带有可以通过鼠标点击导航的文件浏览器。它还带有一些基础办公软件。\n\n### Apple II\
  \ 之后\n\n在 `Apple II` 之后，公司将品牌名称改为 `Macintosh`，并在电脑领域采取了新方向。该演进的主要点如下：\n\n*   `Macintosh`——尽管今天许多人认为\
  \ Apple 和 `Macintosh` 是同义词，但 `Macintosh` 实际上是 Apple 在 1984 年 1 月发布的。它有一个 `8-MHz\
  \ Motorola` 处理器、一个黑白显示器和一个 3.5 英软驱器。`Macintosh` 的操作系统是 `System 1`。这最终导致了运行 `System\
  \ 7` 的 `Macintosh II`。\n*   `System 7`——该系统允许在应用程序之间拖拽文本、从菜单查看和切换应用程序、控制面板以及协作多任务处理。\n\
  *   `Mac OS for PowerPC`——这台 Mac 引入了 `System 7.1.2` 操作系统。\n*   `AIX for PowerPC`——1996\
  \ 年，Apple 有名为 `Apple Network Server` 的产品，使用了 `IBM AIX` 系统的变体。它还使用了 `Common Desktop\
  \ Environment`，这是在 `Unix` 世界中流行的图形用户界面。该产品在市场上表现不佳，并于 1997 年停产。\n\n### Mac OS X\n\
  \n下一个重大变化是引入了 `Mac OS X`，它今天仍用于 `Mac OS` 电脑，尽管它后来被简单地更名为“OSX”，现在被品牌为“macOS”。该产品的公开测试版命名为\
  \ `Kodiak`。`Mac OS X` 的真正变化在于该操作系统基于 `FreeBSD`，一个 `Unix` 克隆版本。在使用 `Mac OS` 时，你可以导航到\
  \ shell 并运行 `Unix/Linux shell commands`。`OS X` 的初始发布之后是定期的改进，每个版本都以动物命名的：\n\n* \
  \  `Mac OS X v10.0` 名为 `Cheetah`，于 2001 年 3 月发布。\n*   `Mac OS X v10.1` 于同年发布，名为\
  \ `Puma`。\n*   下一次发布是 2002 年的 `Mac OS X v10.2`，名为 `Jaguar`。此版本包含了改进的图形和 `iChat`\
  \ 消息。\n*   2003 年，Apple 发布了 `Mac OS X v10.3`，名为 `Panther`。\n*   `Mac OS X v10.4`\
  \ 名为 `Tiger`，于 2005 年发布。此版本内置支持 `FireWire`，有一个新的仪表板和更新的邮件程序。\n*   `Mac OS X v10.5`\
  \ 名为 `Leopard`，于 2007 年发布。它有超过 300 个新功能、对 `Intel x86` 芯片的支持以及对 `G5` 处理器的支持。\n* \
  \  2009 年，Apple 发布了 `Mac OS X v10.6` `Snow Leopard`。此版本中的大多数更改是性能增强，而非新功能。例如，`Snow\
  \ Leopard` 支持多核处理器。\n*   `Mac OS X 10.7` 于 2011 年发布，代号为 `Lion`。此版本主要的界面变化是让它更像 `iPhone`\
  \ 和 `iPad` 上使用的 `iOS` 界面。\n*   `Mac OS X 10.8`名为 `Mountain Lion`，于 2012 年发布。此版本内置了\
  \ `iCloud` 的支持以支持云计算。这是最后一个以动物命名的操作系统版本；在此之后，Apple 将其操作系统版本简单地称为“OSX”而非“Mac OS X”。\n\
  *   `OSX 10.10`名为 `Yosemite`，由 Apple 于 2014 年 10 月发布。从取证角度来看，此版本最重要的部分是，它允许拥有 `iOS\
  \ 8.1` 或更高版本的 `iphone` 用户将某些任务传递给他们的 `Mac OS` 电脑。例如，他们可以在 `Mac OS` 电脑上完成未完成的 `iPhone`\
  \ 邮件。这种功能被称为 `Handoff`。这对于取证很重要，因为你可以在电脑上找到与移动设备相关的证据。\n*   当 `10.12`名为 `Sierra`\
  \ 于 2016 年 9 月发布时，Apple 将操作系统更名为 `macOS`。它是为了与 `iOS` 和 `watchOS` 等其他 系统保持同步。\n*\
  \   `Mac OS 11.0` `Big Sur` 于 2020 年 6 月宣布并在 11 月公开发。Big Sur 支持文件级加密，而之前的版本仅支持驱动器加密。这有助于\
  \ Apple 向其硅架构过渡。\n\n虽然与操作系统没有直接关系，2020 年 Apple 宣布其电脑将转向自己的 `Apple Silicon` 芯片。这些芯片使用\
  \ `ARM64` 架构。这是一个系统级芯片 (`SoC`)。这些芯片的第一版本采用四核设计并带有大缓存，但功耗仅为之前芯片的四分之一。\n\n\n\n\n\n\
  HFS+ 是 `HFS` 文件系统的增强版本。在相当一段时间内，`HFS+` 是 `Mac OS` 的首选文件系统。最重要的是，它支持日志记录（journaling）。日志记录基本上是文件系统记录所发生的文件事务的过程，以便在硬盘崩溃时可以恢复文件。日志记录文件系统具有容错性，因为文件系统会记录对文件、目录或文件结构的所有更改。记录更改的日志被称为文件系统的日志——因此有了“日志文件系统”这一术语。\n\
  \n`HFS+` 还支持磁盘配额。这允许管理员限制特定用户使用的磁盘空间量，防止该用户占用所有空间。`HFS+` 还有硬链接和软链接。链接基本上有两种类型。第一种是硬链接。硬链接是直接链接到特定文件的\
  \ `inode`。软链接或符号符号链接本质上是一个快捷方式。\n\n`HFS+` 在架构上与 `HFS` 相似，这并不意外，因为它是 `HFS` 的增强。然而，它们之间存在一些关键区别。其中一个区别是\
  \ `HFS+` 使用 `32 bits` 作为分配块，而不是 `16 bits`。`HFS+` 还支持长文件名，多达 `255 characters`。此外，`HFS+`\
  \ 使用 `Unicode`，它是信息编码（文件命名）的国际标准，而不是 `ASCII`（美国信息交换标准），后者是一组定义你可以执行的所有各种按键的代码集，包括字母、数字、字符，甚至是空格键和回车键。\n\
  \n对于取证检查而言，`HFS+` 中需要注意的重要区别之一是别名（aliases）。别名类似于符号链接；它们允许你对单个文件或目录有多个引用。`HFS+` 还有一个非常有趣的优化方案。它本质上是以文件为单位进行碎片整理的。系统会检查以下条件，如果满足，则在打开文件时对其进行碎片整理：\n\
  \n* 文件大小小于 20 兆字节。\n* 文件未被占用。\n* 文件不是只读的。\n* 文件已碎片。\n* 系统运行时间至少持续三分钟。\n\n这意味着 `HFS+`\
  \ 卷会例行地进行自我碎片整理。相比于 `NFTS` 和 `FAT` 等其他文件系统，这是一个显著优势。\n\n对于 `HFS+` 卷，前两个扇区（`sectors\
  \ 0 and 1`）是启动块，与 `HFS` 使用的启动块相同。第三个扇区（`sector 2`）是卷头。它包含了大量的取证信息，例如分配块的大小和描述卷创建时间戳。\n\
  \n分配文件（allocation file）对取证至关重要。它跟踪哪些分配块是空闲的，哪些不是。`0` 表示块空闲，而 `1` 表示块正在使用中。目录文件包含该卷上所有文件/目录的记录。它使用\
  \ `B-tree` 结构来存储数据。目录文件中的每个记录大小为 `8 kilobytes`。\n\n特别值得关注的是命令行提示符。`Mac OS` 中的命令行提示符是\
  \ `BASH` shell，因此你可以执行 Linux 命令。这意味着我们在 `Chapter 9` 中讨论的命令是可以使用的——例如 `lsof`、`pstree`\
  \ 等。\n\n由于 `HFS+` 在很长的一一段时间内都是 `Mac OS` 的首选文件系统，因此你在对苹果电脑进行取证检查时可能会遇到它。然而，它后来已经被取代了。\n\
  \n### Apple 文件系统\n\nApple File System，也称为 `APFS`，为 `MacOS 10.13` (High Sierra) 和\
  \ `tvOS 10.2` 及更高版本创建。它也被 `iOS 10.3` 及更高版本使用。`APFS` 专门设计用于修复 `HFS+` 的某些问题。`APFS`\
  \ 针对闪存驱动和固态硬盘进行了专门优化。`APFS` 在 2016 年的苹果开发者上首次发布。\n\n`APFS` 仍然使用 `iNodes`；它们是 `64\
  \ bit`，允许更多的地址，从而提供更大的存储。`APFS` 支持在特定点创建系统快照。\n\n### ISO660\n\n`ISO660` 是 CD-ROM\
  \ 光盘使用的文件系统。与 `ISO960` 一样，它仅保证 Mac OS 可以读取。\n\n### 分区类型\n\n分区类型在苹果文档中被称为“分区方案（partition\
  \ schemes）”。分区类型决定了分区在硬盘上的组织方式。苹果直接支持三种分区方案：`GUID`（GUID 代表“全局唯一标识符”）、`Partition\
  \ Table`（分区表）、`Apple Partition Map`（苹果分区映射）以及 `master boot record`（主引导记录）。本节描述了这些分区类型。\n\
  \n需要注意的是，如果系统使用 `APFS`，建议你不要对硬盘进行分区，而是创建多个 `APFS` 分区。\n\n#### GUID 分区表\n\n`GUID\
  \ Partition Table` 主要用于带有 Intel 处理器的计算机。它需要 `OS X10.4` 或更高版本。基于 Intel 的 Mac OS 机器只能从使用\
  \ `GUID Partition Table` 的驱动器启动。\n\n#### 苹果分区映射\n\n`Apple Partition Map` 用于任何基于\
  \ PowerPC 的 Mac。基于 Intel 的 Mac 可以挂载并使用格式化为 `Apple Partition Map` 的驱动器，但无法从该设备启动。基于\
  \ PowerPC 的 Mac 既可以挂载并使用格式化为 `Apple Partition Map` 的驱动器，也可以将其作为启动设备。\n\n#### 主引导记录\n\
  \n`master boot record` (`MBR`) 包含在引导区中，用于 DOS 或基于 Windows 的计算机的启动。`MBR` 包含了重要信息，如分区表、引导程序代码和其他信息。\n\
  \n\n\n\n任何取证检查的初步步骤之一都应该是检查日志。请记住，在检查 Windows 或 Linux 计算机时，日志非常重要。在检查 Apple 电脑时，日志也同样重要。本节将检查\
  \ Mac OS 日志以及其中包含的内容。\n\n### `/var/log` 日志\n\n此日志的名称暗示了它是一个存储大量信息的通用仓库。其命名结构也应该看起来很熟悉。记住，Mac\
  \ OS 是基于 FreeBSD 的，因此看到与 Linux 相似的文件结构并不应该感到意外。\n\n该目录包含许多日志。`/var/log/daily.out`\
  \ 包含关于所有已挂载卷的数据，包括它们被挂载的日期。这在涉及数据被盗的案件中非常重要。你可以看到连接了哪些设备并从它们中获取数据。此文件夹包含了有关可移动存储介质的数据，包括序列号。\n\
  \n### `/var/spool/cups` 文件夹\n\n在此文件夹中，你还会找到有关打印文档的信息。如果你需要知道从这台 Apple 设备打印了哪些文档，此文件夹可以为你提供这些信息。这包括打印的文档名称以及打印它的用户。\n\
  \n### `/private/var/audit` 日志\n\n顾如名，这些是系统审计日志。这包括用户登录等内容。显然，这在取证上可能非常有趣味（价值）。然而，Guidance\
  \ 软件为 Mac OS 审计日志制作了一个审计日志解析器，可以在 [`www.guidancesoftware.com/app/Mac-OS-X-OpenBSM-Audit-Log-Parser`](https://www.guidancesoftware.com/app/Mac-OS-X-OpenBSM-Audit-Log-Parser)\
  \ 找到。\n\n### `/private/var/VM` 文件夹\n\n此文件夹包含交换（swap）文件和休眠镜像文件。如果你让 Mac 进入休眠状态，此目录通常会占用超过\
  \ 5 GB 的磁盘空间。这可以是一个重要取证数据的来源。\n\n### `/Library/Receipts` 文件夹\n\n此文件夹包含有关系统和软件更新的信息。对于取证调查来说，它没有某些其他文件夹用；然而，了解是否应用了某个补丁以及何时应用可能是很有用的。在调查恶意软件犯罪时，这可能具有某些价值。\n\
  \n### `/Library/Mobile Documents`\n\n此文件夹是与 iCloud 同步的。你在这里会找到保存到 iCloud 的项目。显而易见，这在取证上非常有价值。\n\
  \n### `/Users/<user>/.bash_history` 日志\n\n如你所知，Mac OS 是基于 FreeBSD（一种 Unix 变体）。当你启动终端窗口时，你实际上获得的是\
  \ BASH shell。因此，这个特定的日志非常有价值。它将向你展示各种命令。你可能会寻找诸如 `rm` 的命令（这将移除或删除某些），或像 `dd` 这样的命令（表明用户可能尝试创建驱动器的映像）。\n\
  \n### `var/vm` 文件夹\n\n在此文件夹中，你会找到一个名为 `app profile` 的子文件夹。它将包含最近打开的应用程序列表以及应用程序使用的临时数据。这两者在取证检查中都可能非常有价值。\n\
  \n### `/Users/` 目录\n\n这是存储各种用户文件的地方。检查此目录始终是一个好主意，以发现用户是否在此处保存了可以作为证据的数据。\n\n###\
  \ `/Users/<user>/Library/Preferences` 文件夹\n\n正如你可能猜到的那样，此文件夹包含用户偏好。对于取证调查来说，这看起来可能没那么，除非有一个小问题：此文件夹甚至维护了已删除程序的偏好设置。这可能是一个获取从系统中删除的程序线索的非常有价值的地方。\n\
  \n## 目录\n\n与 Windows 和 Linux 一样，Mac OS 有许多目录。某些比其他的更重要。你必须了解后续章节中的目录，以便对 Apple 机器进行有效的取证检查。\n\
  \n### `/Volumes` 目录\n\n此目录包含有关已挂载设备的信息。你在这里会找到有关挂载设备的数据。\n\n### `/Users` 目录\n\n\
  这是存储用户账户的地方。\n\n### `/Applications` 目录\n\n此目录是存储所有应用程序的地方。\n\n### `/Network` 目录\n\
  \n此目录包含有关网络的信息。\n\n### `/etc` 目录\n\n正如你所知，在 Mac OS 中像 Linux 一样，此目录是配置文件所在的地方。\n\n\
  ### `/Library/Preferences` 文件夹\n\n此目录包含系统配置信息。此文件包含了网络配置数据，这是极其重要的。\n\n### `/Library/Preferences/SystemConfiguration/com.apple.plist`\
  \ 文件\n\n此文件包含了每个网卡的配置数据。\n\n## Mac OS 取证技术\n\n本节涵盖了在 Mac OS 上使用的通用取证技术。在之前的章节中，我们学习了如何对\
  \ Mac OS 系统进行调查。现在，你将学习各种取证技术。\n\n### 目标模式 (Target Disk Mode)\n\n取证中最基础的步骤之一是创建磁盘的位拷贝。如果目标磁盘是\
  \ Mac OS，你可以使用你从 Linux 学到的命令。你可以利用 `dd` 命令配合 `netcat` 来制作拷贝。然而，Mac OS 提供了另一种使用 EnCase\
  \ 或 Forensic Toolkit 的方法。这是通过将计算机放入目标模式实现的。当你将计算机放入该模式时，它是不可写的，因此只需通过通用总线 (USB)\
  \ 或火线连接计算机并对磁盘。此外，目标模式允许你在现场预览计算机。这允许调查人员在将计算机运到实验室之前进行快速检查。这是重要的，因为就像 Windows 或\
  \ Linux 一样，你会在关机前检查运行中的系统。你只需要将计算机重启到目标模式，如图 10-2 所示。\n\n```\n![图 10-2 目标模式](img/97812844496_CH10_FIG02.jpg)\n\
  ```\n图 10-2 目标模式。\n\n### 搜索虚拟内存\n\n在 Mac OS 上检查虚拟内存与在 Windows 或 Linux 上一样重要。在 Mac\
  \ OS 中，交换文件/虚拟内存位于 `/var/vm/` 文件夹。你可以使用简单的 Linux 命令（如 `ls`）检查它。一个很好的选项是 `ls -al`，它会提供虚拟内存中所有文件的列表，以及是谁启动了程序。最好的消息是，你可以使用\
  \ `grep` 搜索工具搜索虚拟内存文件夹。\n\n\n此命令列出了当前正在使用的设备文件。在关闭系统并将其运往法医实验室之前，您应该记录这些信息。\n\n\
  ### `/hdiutil` 分区 `/dev/disk0` 命令\n\n此命令列出启动驱动器的分区表。显然，了解机器在启动时识别的分区是至关重要的。\n\n\
  ### `system_profiler SPHardwareDataType` 命令\n\n此命令返回宿主系统的硬件信息。这为在开始法医检查之前对系统进行基础记录提供了帮助。还有相关的命令，例如\
  \ `system_profiler SPSerialATADataType`。该命令提供所有连接的串行高级技术接口（SATA）设备的信息。\n\n### `system_profiler\
  \ SPSoftwareDataType` 命令\n\n此命令与 `system_profiler SPHardwareDataType` 相关，返回有关操作系统的信息。这对于在开始法医检查之前对系统进行记录同样重要。\n\
  \n## 如何检查苹果设备\n\n许多取证工具在从 Windows 提取数据方面表现出色，但在 Mac OS 中效果较差。OSForensics 4.0 版本将在其“最近历史”中包含\
  \ Mac OS 遗迹。但要检查本章提到的目录或执行 BASH 命令，您可能需要比这些工具提供的更多的功能。\n\n一种技术是创建法医镜像的副本并将其挂载为只读虚拟机（VM）。以只读方式挂载至关重要。互联网上可以找到多种将法医镜像转换为虚拟机的说明（例如\
  \ VMWare 或 Oracle Virtual box 虚拟机）。然而，取证工具 Forensic Explorer ([`www.forensicexplorer.com/`](http://www.forensicexplorer.com/))\
  \ 使用您选择的虚拟机将法医镜像挂载为只读虚拟机。OSForensics 4 版本 ([`www.osforensics.com/`](http://www.osforensics.com/))\
  \ 也允许您从法医镜像创建虚拟机。\n\n## MacQuisition\n\nBlacklight 生产了一款名为 MacQuisition 的产品。注意，Blacklight\
  \ 已被 Cellebrite 收购，因此现在技术上它是 Cellebrite MacQuisition。它是一款用于 Mac OS 系统镜像的工具。这是一款商业工具，当前的价格应向制造商索取\
  \ [(https://www.blackbagtech.com/macquisition-quick-start-guide)](https://www.blackbagtech.com/macquisition-quick-start-guide)。\n\
  \n您可以在已经启动的苹果设备上运行 MacQuisition，也可以直接启动到 MacQuisition。当系统显示 MacQuisition 时，它会显示几个不同的分区；您正在启动的\
  \ MacQuisition 应用程序位于 Application 分区。您需要第二个外部硬盘来拷贝镜像。\n\n### 读取苹果驱动器\n\n显然，如果您使用苹果机器作为你的取证工作站，那么读取苹果驱动器将没有问题。然而，大多数取证工作站运行的是\
  \ Windows，也有部分运行 Linux。有几种实用程序允许在 Windows 计算机上连接并查看苹果驱动器。其中之一是 MacDrive 10 pro ([`www.macdrive.com/`](https://www.macdrive.com/))。这在图\
  \ 10-3 中所示。\n\n![图 10-3 MacDrive 10 pro.](img/9781284244496_CH10_FIGF03.jpg)\n\n\
  图 10-3 MacDrive 10 pro。\n\n另一个类似的工具是 Paragon 软件提供的 APFS for Windows ([`www.paragon-software.com/us/home/apfs-windows/#`](https://www.paragon-software.com/us/home/apfs-windows/#))。当软件启动时，如果未检测到任何\
  \ APFS 卷，将提示您连接一个。这在图 10-4 中所示。\n\n![图 10-4 APFS for Windows.](img/9781284244496_CH10_FIGF04.jpg)\n\
  \n图 10-4 APFS for Windows。\n\n如您所示，如果需要，在 Windows 工作站上检查苹果驱动器有多种选择。\n\n## 在 Mac\
  \ OS 中可以删除删除吗？\n\n回想在 Windows 系统中，删除实际上只是从主文件表 (MFT) 或文件分配表 (FAT) 中移除文件，并将这些簇标记为可用。文件数据仍然在那里并可以被恢复。在\
  \ HFS 或 HFS+ 卷上删除文件时会发生什么？虽然细节略有不同，但发生了类似的情况。对文件的引用消失了，簇可能会被使用和覆盖。但是，取决于您在删除后多久尝试恢复数据，您可能可以恢复部分或全部数据。即使数据被覆盖，数据可能仍存在于未分配空间和索引节点（inodes）中。当文件在\
  \ Mac OS 中被删除时，它会被移动到垃圾桶（Trash）文件夹——就像 Windows 中的回收站一样。垃圾桶在文件系统中表示为文件系统根目录下的隐藏文件夹\
  \ `.Trash`。您可以使用 shell 命令列出内容，如下所示：\n\n![程序代码。在代码中，变量名中的单词已合并。第 1 行。\n\n\n\n\n选择磁盘实用程序（Disk\
  \ Utility）。如果 MacBook 请求密码，意味着固件已受保护并配置了以防止恢复模式攻击。这意味着该技术将不起。然而，如果没有设置固件密码（该密码必须由用户刻意设置），你就可以继续操作。如果没有设置固件密码，你可以获得一个终端窗口，如图\
  \ 10-8 所示。\n\n![图 10-8 Mac OS 恢复终端窗口。](img/9781284244496_CH10_FIGF08.jpg)\n\n图 10-8\
  \ Mac OS 恢复终端窗口。\n\n根据 Apple 设备的不同，你有几种选择。一种是简单地输入 `resetpassword`（是的，所有字母连）。然后你关闭终端，将显示该\
  \ Apple 设备上的账户列表。为一个或多个账户设置新密码。\n\n对于较新版本的 Mac OS，情况不会那么简单。那里有名为 `plist` 的文件包含密码，且你无法更改它们。因此，你需要一个\
  \ USB 驱动器。它可以是 `FAT32` 或 `APFS` 格式，但不能是 `NTFS`。现在，我们将从终端中使用一些命令。这些命令看起来看起来像 Linux\
  \ 命令，这是因为 Mac OS 是基于 FreeBSD（一个 Unix 的克隆版本）。\n\n首先，检查是否有需要关闭的系统完整性保护（SIP）：\n\n![程序代码。在代码中，变量名中的单词合并在一起。第\
  \ 1 行。ls、连字符、R、斜杠、Volumes、斜杠、小于、硬盘名称、大于、斜杠、v a r、斜杠、db、斜杠、d s local、斜杠、nodes、斜杠、Default、斜杠。](img/9781284244496_CH10_08_UNIMG1.png)\n\
  \n这将列出目录中的所有文件并输出输出文件。如果你收到错误消息“Operation not permitted”（不允许操作），则意味着 SIP 已开启，你需要将其关闭：\n\
  \n![程序代码。在代码中，变量名中的单词合并在一起。第 1 行。csrutil disable。](img/9781284244496_CH10_08_UNIMG2.png)\n\
  \n然后你将重启电脑。再次进入恢复模式，并再次启动终端。现在插入你的 USB 驱动器并拷贝所需的 `plist`：\n\n![程序代码。在代码中，变量名中的单词合并在一起。第\
  \ 1 行。c p、斜杠、Volumes、斜杠、小于、硬盘名称、大于、斜杠、v a r、斜杠、db、斜杠、d s local、斜杠、nodes、斜杠、Default、斜杠。第\
