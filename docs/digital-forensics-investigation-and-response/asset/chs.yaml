  \ EnCase After Acquisition 对话框。\n\n你应该注意的最几件事之一是，你可以向单个案例添加多个设备。这是有意义的，因为许多案例将有多个需要检查的缴获设备。\n\
  \n### 使用 Forensic Toolkit 进行镜像\n\n来自 AccessData 的 `Forensic Toolkit` (`FTK`) 是另一种被执法部门广泛使用的流行取证工具。你可以购买\
