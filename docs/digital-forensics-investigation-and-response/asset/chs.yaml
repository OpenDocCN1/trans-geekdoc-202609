  \ 13 章 || 网络取证 |\n| 第 14 章 || 内存取证 |\n| 第 15 章 || 趋势与未来方向 |\n\n## 第 8 章\n\nWindows\
  \ 取证\n\n© phyZick/Shutterstock\n\n> Microsoft Windows 是一种无处不在的操作系统。很难想象你在从事数字取证工作而不经常遇到\
  \ Windows 机器。因此，熟悉如何在 Windows 机器上进行取证至关重要。在本章中，你将学习如何对 Windows 进行取证检查。这包括检查注册表、`index.dat`、`swap\
  \ file` 等内容。\n\n## Windows 详情\n\n在深入研究 Windows 取证之前，对操作系统本身有一个良好的了解是有益的。在这一部分，你将学习\
  \ Windows 的历史及其结构。这为你学习 Windows 取证提供了一个背景。\n\n### Windows 历史\n\n第一个广泛使用的 Windows\
  \ 版本是 3.1 版本，于 1992 年发布。从那时起 Windows 系统变得非常流行。当时，Windows 是一个图形用户界面 (GUI)，而不是真正的操作系统。操作系统是磁盘操作系统\
  \ (`DOS`)。Windows 提供了一个通过鼠标点击与操作系统交互的视觉化界面，而不是输入 DOS 命令。\n\n在 20 世纪 90 年代初，可以使用其他非微软的用户界面来与\
  \ DOS 交互。你也可以在运行非微软操作系统（如 `Dr. DOS`，DOS 的替代品）的系统中安装 Windows。当时 PC 还有几种竞争性操作系统，包括\
  \ IBM 的 `OS2` 和 `OS2 Warp`。\n\n\n\n\n\n对于服务器和专业人士来说，微软曾推出 Windows NT 版本 3.1、3.51\
  \ 和 4.0，这些版本被广泛使用。每个版本都区分工作版和服务器版。Windows NT 版本被广泛认为比 Windows 3.1 更稳定、更安全。\n\n1995\
  \ 年 Windows 95 的发布标志着 Windows 的变化。此时，底层操作系统和 GUI（一种点点点击式用户界面）被融合为一个单一、连贯的产品。这意味着你无法选择某些非\
  \ Windows 的 GUI。在 Windows 95 发布后不久，Windows NT 4.0 发布了。许多人认为 Windows 98 只是一个中间步骤，是\
  \ Windows 95 的一种改进。它的界面看起来与 Windows 95 非常相似，但性能得到了极大提高。Windows 95 和 98 使用 `FAT32`\
  \ 文件系统。\n\nWindows 2000 被广泛认为是 Windows 系列的一项重大改进。本质上，独立的 NT 和 Windows 系列的时代已经结束了。现在只有\
  \ Windows 2000 的不同版本。它有家庭用户版、专业用户版和服务器版。不同版本之间的差异主要是可用功能和容量的差异，例如可以寻址的随机内存（RAM）容量。Windows\
  \ 2000 是微软开始建议将 `NTFS` 代替 `FAT32` 作为文件系统的版本。\n\nWindows XP 是微软的下一个里程碑，Windows Server\
  \ 2003 也于同年发布。这标志着回到了拥有独立服务器系统和桌面系统的方法（与 Windows 2000 不同）。界面没有太大，但有了结构性的改进。\n\n\
  Windows Vista 和 Windows 7 的用户界面与 XP 并没有显著差异。虽然有功能变化和额外的能力，但本质上每个版本的界面只是了适度的微调。Windows\
  \ Server 2008 和 Windows Server 2003 之间的关系也是如此。熟悉 Windows Server 2003 的人处理 Windows\
  \ Server 2008 将没有问题。\n\nWindows 8 是一次根本性的变化。该操作系统旨在更像平板电脑。你可以进入一个看起来像 Windows 7\
  \ 的桌面，但 Windows 8 的默认行为是平板化的。微软在同一时期还发布了 Windows Server 2012。\n\nWindows 10 是 Windows\
  \ 的另一次巨大变化。诸如 Cortana 和 Edge 浏览器等新功能改变了用户与 Windows 操作系统的交互方式，在某些情况下改变了取证工作。Windows\
  \ Server 持续发展到了 Windows Server 2016，然后是 2019。\n\n并不是所有 Windows 版本的差异都与取证有关。然而，某些问题确实有关，这需要你提出如下问题：\n\
  \n* 所涉及的 Windows 版本支持 64 位处理吗？\n* 它是否有防火墙——XP 是第一个带有防火墙的 Windows 版本——如果是的话，防火墙是自动开启的，如\
  \ Windows XP Service Pack 1 那样？\n* 该 Windows 版本支持加密文件系统（`EFS`）吗？它允许用户加密特定的文件和文件夹。这首次在\
  \ Windows 2000 中引入，但从 Vista 开始，此功能仅在专业/商业或更高版本中可用。\n\n### 64 位处理\n\n64 位处理到底意味着什么？为什么它如此重要？\n\
  \n首先，该术语指的是中央处理器（CPU）和操作系统处理信息的方式。32 位系统最多可以寻址 `4,294,967,295` 字节，每个字节都有自己的地址。这就是为什么\
  \ 32 位系统被限于 4 吉字节（GB）的内存。但 64 位系统可以使用 64 位寻址来寻址 `18,446,744,073,709,551,616` 字节——字面上是数百万亿字节。这是一个巨大的数字。所以你可以清楚地看到，64\
  \ 位处理器和 64 位操作系统相比 32 位系统具有显著优势。\n\n对取证同样重要的是 Windows 如何处理 32 位程序。你可以在 64 位系统上安装\
  \ 32 位程序。然而，它们通常被安装在 `Program Files (x86)` 目录中。Windows 使用 `x86` 来指代 32 位版本的程序、文件等。\n\
  \n### 启动过程\n\n取证人员出于许多原因需要理解 Windows 启动过程。病毒可能会在启动过程的特定点感染嫌疑硬盘。硬盘加密程序也会在系统启动期间运行。以下是基本过程的摘要。取决于所使用的\
  \ Windows 版本，可能会有一些变化：\n\n1. `BIOS` 执行上电自检（POST）。此时系统的基本输入输出系统（`BIOS`）会检查驱动器、键盘和其他关键项目是否存在并运行正常。这发生在任何操作系统组件加载之前。\n\
  2. 计算机读取主引导记录（`MBR`）和分区表。\n3. `MBR` 定位启动分区。这是安装了操作系统的分区。\n4. `MBR` 将控制权交给启动分区。\n\
  5. 启动扇加载 `NTLDR`。\n6. 启动扇加载 `NTLDR`。（*注：原文此处重复，已按要求保留*）\n7. `NTLDR` 从实模式切换到 32 位模式。\n\
  8. `NTLDR` 加载基本文件系统驱动程序（`FAT`、`FAT32`、`NTFS`）。\n9. `NTLDR` 读取 `boot.ini` 并显示启动菜单。\n\
  10. `NTLDR` 加载 `NTOSKNL` 并传递硬件信息。\n11. `NTLDR` 加载 `hal.dll`。\n12. `NTLDR` 加载系统配置单元（即注册表）并从中读取设置。\n\
  13. 内核初始化开始。\n14. 服务加载阶段。\n15. Win32 子系统启动阶段。\n16. 用户登录。\n\n了解启动顺序可以让你诊断可能导致无法启动的问题、理解加密何时实施等。这些都是了解启动顺序（至少从通用角度）的好理由。\n\
  \n### 重要文件\n\nWindows 有许多文件。如果你查看任务管理器，你会看到许多正在运行的进程/程序。聪明的病毒和间谍软件编写者会将恶意软件命名为与这些系统进程相似的名字，让观察者认为它们是操作系统的一部分。这里列了一些重要的\
  \ Windows 文件：\n\n* `ntdetect.com`——一个查询计算机基本设备/配置数据的程序，如来自 CMOS 的日期、系统总线类型、磁盘驱动器、端口等\n\
  * `ntbootdd.sys`——存储控制器设备驱动\n* `ntoskrnl.exe`——操作系统内核\n* `hal.dll`——硬件接口\n* `smss.exe`——处理系统服务的程序\n\
  * `winlogon.exe`——处理登录的程序\n* `lsass.exe`——处理安全和登录策略的程序\n* `explorer.exe`——用户交互的界面，如桌面、Windows\
  \ 资源管理器等\n* `crss.exe`——处理创建线程、控制台窗口等任务的程序\n\n\n\n\n在取证分析中，特别关注的是那些命名与系统进程相似的程序。如果你看到一个运行中的进程名称相似（例如，`Lsassx.exe`），这可能表明存在恶意软件。\n\
  \n实际 NTFS 文件系统组成的文件列表见图 8-1A。\n\n![图 8-1A NTFS 文件系统。](img/9781284244496_CH08_FIGF01_A.jpg)\n\
  \n图 8-1A NTFS 文件系统。\n\n当具有高水平取证技巧的作案者试图删除证据时，这些文件中的某些可能包含数据。例如，`$logfile` 可能指示已的操作。`$mftmirr`\
  \ 可能包含可恢复的数据。\n\nWindows NTFS 多年来发生了变化。新版本的 NTFS 具有新的属性。你可以轻松地发现正在使用的是哪个版本的 NTFS。以管理员身份打开命令提示符，并输入\
  \ `fsutil fsinfo ntfsinfo <volume>`（将 `<volume>` 替换为你的卷盘符）。你将获取有关相关系统的大量信息。如图 8-1B\
  \ 所示。\n\n![图 8-1B fsutil 命令。](img/9781284244496_CH08_FIGF01_B.jpg)\n\n图 8-1B fsutil\
  \ 命令。\n\n`fsutil` 命令执行任务并提供有关文件系统的信息。要运行它，你必须先使用 `PowerShell` 启用 Windows Linux 子系统。该过程见图\
  \ 8-1C。注意，你必须以管理员身份运行 `PowerShell` 才能使其正常工作。\n\n![图 8-1C 启用 Windows Linux 子系统。](img/9781284244496_CH08_FIGF01_C.jpg)\n\
  \n图 8-1C 启用 Windows Linux 子系统。\n\n你可以在 [`docs.microsoft.com/en-us/windows-server/administration/windows-commands/fsutil`](https://docs.microsoft.com/en-us/windows-server/administration/windows-commands/fsutil)\
  \ 了解更多关于 `fsutil` 的信息。我们将在本书稍后部分详细讨论 `PowerShell`。\n\n## 易失数据\n\n易失内存分析是一种现场系统取证技术，通过收集内存转储并在隔离环境中进行分析。易失内存分析与现场响应（live\
  \ response）相似，你必须首先建立一个受信任的命令行壳。接下来，建立数据收集系统和传输数据的方法。然而，你只会获取受感染系统的物理内存转储并将其传输到数据收集系统进行分析。在这种情况下，`VMware`\
  \ 允许你只需挂起虚拟机并使用 `.vmem` 文件作为内存镜像。\n\n与其他取证调查一样，在完成内存捕获后，你还会计算哈希值。与传统的硬盘取证不同，你不需要在数据采集之前计算哈希值。由于运行内存的易失性，成像过程涉及对一个“移动目标”拍摄快照。\n\
  \n这种方法与现场响应的主要区别在于，你不需要从受感染系统中获取任何额外证据。因此，你可以在收集系统上分析证据。\n\n为了将来自现场系统的数字数据作为法庭证据，证明所获取内存数据的有效性至关重要。一种常见方法是将易失内存数据获取到转储文件中进行离线检查。转储\
  \ dump 是记录在永久存储中或打印在纸上的每个内存或缓存位位的完整副本。然后你可以电子或手动以其静态状态对转储进行分析。\n\n程序员开发了许多工具包来收集易失内存数据。这些自动化程序运行在现场系统上并收集瞬态内存数据。这些工具具有一个致命缺点：如果在受感染系统上运行，此类工具将严重依赖底层的操作系统。这可能会影响采集数据的可靠性。某些响应工具甚至可能会大幅改变原始系统的数字环境，并对转储的内存数据产生不利影响。\n\
  \n因此，你可能需要研究这些变化，以确定更改是否影响了所获取的数据。内存中的数据在系统运行期间并非始终一致。这一问题为计算机取证带来了挑战。\n\n维护数据一致性是现场系统取证中的问题，数据不是在统一时刻获取的，因此是不一致的。如果系统正在运行，在数据采集过程中是不可能冻结机器的。即使是最有效的方法，在获取第一位和最后一位之间也会引入时间差。例如，程序可能在内存转储开始时执行\
  \ `Function A`而在结束时执行 `Function B`。\n\n转储中的数据可能对应于 `Function A` 和 `Function B` 之间的某个不同执行步骤。由于你不是在统一时刻获取数据，数据不一致性是不可避免的。\n\
  \n在转储内存时，取证人员意识到实际上有两种类型的内存是有用的：\n\n*   栈 Stack：分配给函数内部局部变量和参数的内存。它根据后进先出（LIFO）原则分配。当程序运行时，程序变量反复使用栈区域。该段是内存中最动态的区域。该段内的数据受函数调用的影响。\n\
  *   堆 Heap：程序的动态内存来自堆段。进程可以使用如 `malloc()` 的内存分配器请求动态内存。当发生这种情况时，进程的地址空间会扩展。堆数据存在函数调用之间。内存分配器可能会重用已释放的内存。因此，堆数据比数据段的数据不稳定。\n\
  \n当程序运行时，代码段、数据段和堆段通常放置在一个连续区域内。栈段与其他段分离。它在分配的空间内扩展。事实上，内存包含了操作系统或其支持的应用程序许多进程。内存可以被视为包含许多进程段的大数组。\n\
  \n在现场系统中，内存根据系统使用和用户活动而增长和缩小。内存的增长和缩小与堆数据的增长或栈数据的扩展和释放有关。代码段的数据是静态的，对于特定的程序或程序段始终保持完整。增长中的堆段和栈段的数据导致整体内存数据的不一致。栈数据的影响大于堆数据。然而，代码段包含一致的数据。一致数据在进程内存中运行时通常处于休眠状态，不受影响。当你获取运行程序的进程转储时，代码段的数据保持不变。\n\
  \n### 工具\n\n许多工具甚至一些 Windows 实用程序可以帮助你分析 Windows 上的现场数据。此外，许多取证工具允许你将 Windows 镜像挂载为虚拟机。然后你就可以像检查现场系统一样检查镜像。本节将介绍一些最常用的工具和实用程序。\n\
  \n#### PsList\n\n\n\n\n使用 `PsList` 可以查看系统的进程和线程统计。运行 `PsList` 会列出系统上所有运行的进程。然而，它无法揭示根内核（rootkit）或根内核隐藏的其他进程。`PsList`\
  \ 是 `PsTools` 工具包的一部分，该工具可以从 [`technet.microsoft.com/en-us/sysinternals/bb896682.aspx`](http://technet.microsoft.com/en-us/sysinternals/bb896682.aspx)\
  \ 免费下载。你可以在图 8-2 中看到该工具的使用。\n\n![Figure 8-2 PsList.](img/9781284244496_CH08_FIGF02.jpg)\n\
  \n图 8-2 PsList。\n\n### PsInfo\n\n该工具同样来自 `PsTools` 工具包。它可以告诉你系统运行时间（自上次启动以来的时间）、操作系统细节以及关于系统的其他通用信息。这些是放入取证报告中的良好的背景信息。该工具见图\
  \ 8-3。\n\n![Figure 8-3 PsInfo.](img/9781284244496_CH08_FIGF03.jpg)\n\n图 8-3 PsInfo。\n\
  \n### ListDLLs\n\n`ListDLLs` 允许你查看进程当前加载的动态链接库（DLLs）。运行 `ListDLLs` 会列出所有运行进程加载的\
  \ DLL。然而，`ListDLLs` 无法显示隐藏进程加载的 DLL。但是，使用木马破坏程序或系统 DLL 是一种常见的攻击向量。因此，该工具对你的取证调查可能非常重要。该工具也可以在网上免费获取。你可以从\
  \ [`technet.microsoft.com/en-us/sysinternals/bb896656.aspx`](http://technet.microsoft.com/en-us/sysinternals/bb896656.aspx)\
  \ 下载。你可以在图 8-4 中看到该实用程序。\n\n![Figure 8-4 ListDLLs.](img/9781284244496_CH08_FIGF04.jpg)\n\
  \n图 8-4 ListDLLs。\n\n### PsLoggedOn\n\n`PsLoggedOn` 帮助你发现本地和远程登录的用户。最重要的是，它告诉你谁登录到了当前机器的共享上。这这也是\
  \ Microsoft TechNet 提供的 `PsTools` 工具包的一部分。该实用程序见 8-5。\n\n![Figure 8-5 PsLoggedOn.](img/9781284244496_CH08_FIGF05.jpg)\n\
  \n图 8-5 PsLoggedOn。\n\n### 使用 netstat\n\n该工具在检查实时系统数据的背景下非常重要。请记住，`netstat` 是一个显示入站和出站网络连接的命令行工具。它还显示路由表和许多网络接口统计数据。它适用于\
  \ Unix、类 Unix 和基于 Windows 的操作系统。\n\n使用 `netstat` 实用程序查看运行机器的网络连接。带有 `-an` 选项运行 `netstat`\
  \ 将显示所有端口，列出它们正在做什么（监听或发送），并按数字顺序列出。这对于你的取证分析可能是有用信息，特别是当怀疑犯罪使用了间谍软件或僵尸网络时。你可以在图\
  \ 8-6 中看到 `netstat`。\n\n![Figure 8-6 The netstat utility.](img/9781284244496_CH08_FIGF06.jpg)\n\
  \n图 8-6 netstat 工具。\n\n## Windows 交换文件\n\nWindows 文件用于扩展 RAM。本质上，它是硬盘上的一个特殊位置，可以将内存中的项临时存储以便以便快速检索。例如，你可能同时打开了五个程序，但一次只使用一个。如果系统内存不足，它可以获取最长时间未运行的程序或文件并移动到交换文件中。\n\
  \nWindows 交换文件以前以 `.swp` 扩展名结尾；但从 Windows XP 开始，它以 `pagefile.sys` 结尾。它通常位于 Windows\
  \ 根目录下。交换文件是一个二进制文件。鉴于交换文件用于扩展 RAM，它通常被称为虚拟内存。\n\n与交换文件相关的是 `hiberfil.sys`。`hiberfil.sys`\
  \ 是一个内存文件，可以转换为镜像文件并使用 volatility 甚至简单的字符串搜索进行处理。在该文件中，可能存在最近运行的应用程序的密码残留。\n\n从\
  \ Windows 8 开始到 Windows 10，`hyberfil.sys`、`swapfile.sys` 和 `pagefile.sys` 发生了一些变化。\n\
  \n从 Windows 8 开始到 Windows 10，`hyberfil.sys`、`swapfile.sys` 和 `pagefile.sys` 发生了一些变化。\n\
  \n## 卷影复制\n\n卷影复制 (VSS) 是一种用于备份状态更改的服务。对于完整备份或克隆，会备份整个文件。`VSS` 每天运行一次，按集群执行。\n\n\
  \n\n\nWindows 中存在某些目录比其他目录更有可能包含证据。显然，精通技术的罪分子可以删除证据。然而，并非所有罪分子都精通技术，即使是那些精通技术的人也可能遗漏某些东西。或者计算机在他们删除犯罪证据之前就已经被没收了。虽然计算机上有很多目录，但以下目录在取证上最有价值：\n\
  \n*   `C:\\Windows` 文档和设置——此文件夹是保存文档的默认位置。罪分子可以将文档保存到计算机的任何地方；但检查此文件夹是一个好主意。\n*\
  \   `C:\\users`——在这里你可以找到所有用户的用户配置文件信息、文档、图片等等，而不仅仅是当前登录的用户。\n*   `C:\\Program Files`——默认情况下，程序安装在此目录的子目录下。\n\
  *   `C:\\Program Files (x86)`——在 64 位系统中，32 位程序安装在这里。\n*   `C:\\Users\\username\\\
  Documents`——当前用户的文档文件夹。这是一个非常重要的查看位置。\n\n当然，你还应该对整个嫌疑磁盘进行常规搜索，而不仅仅是这些特定的文件夹和目录。\n\
  \n### UserAssist\nUserAssist 是 Windows 2000 及更高版本的一个功能。它的目的是帮助程序更快启动。由于这个原因，它维护了已启动程序的记录。通过检查与\
  \ `UserAssist` 相应的注册表项，可以查看在该机器上执行的所有程序。这些信息存储在注册表中（`HKEY_CURRENT_USER\\Software\\\
  Microsoft\\Windows\\CurrentVersion\\Explorer\\UserAssist`）中，但它是加密的，因此你需要像免费的 `UserAssist`\
  \ 工具之类的来获取更多信息。\n\n你可以从 [`www.downloadcrew.com/article/23805-userassist`](http://www.downloadcrew.com/article/23805-userassist)\
  \ 免费获取 `UserAssist` 工具。该工具的示例见图 8-8](#9781284244496_CH08_06.xhtml#c8-fig0010)。\n\
  \n![图 8-8 UserAssist.](img/9781284244496_CH08_FIGF08.jpg)\n\n图 8-8 UserAssist。\n\
  \n如你所见，这提供了关于运行了哪些程序以及何时运行的大量信息。\n\n大多数取证工具，包括 Guidance Software 的 `EnCase`、AccessData\
  \ 的 `FTK` 以及 Passmark 的 `OSForensics`，都会为你检索 `UserAssist` 条目以及其他条目。\n\n### 未分配空间/碎片空间\
  \ (Slack Space)\n在大多数案件中，你都需要搜索整个磁盘以定位所有相关的文档、日志、电子邮件等。然而，有时你可能只想只想在未分配空间中寻找相关数据。要做到这一点，你可以在未分配空间中搜索关键词。诸如\
  \ AccessData 的 Forensic Toolkit (`FTK`) 之类的工具允许调查人员获取整个镜像，并尝试识别文件系统中的所有文档，包括未分配空间。如果你想多次搜索整个磁盘，像\
  \ `FTK` 这样的工具可以帮助你建立全文索引。全文索引允许你构建一个基于二叉树的字典，包含镜像中存在的所有单词，你可以在几秒钟内整个镜像搜索这些单词。\n\n\
  ### 交替数据流 (Alternate Data Streams)\n这是罪分子在目标计算机上隐藏物品的一种巧妙方法。交替数据流本质上是一种使用 `NTFS`\
  \ 文件系统将一个文件附加到另一个文件的方法。根据 Irongeek.com，¹\n\n> 交替数据流支持已添加到 NTFS（Windows NT, Windows\
  \ 2000 和 Windows XP），以帮助支持 Macintosh 分级文件系统 (HFS)，该系统使用资源分叉来存储文件的图标和其他信息。虽然这是其预期的用途（以及一些\
  \ Windows 内部函数），但交替数据流还有其他用途，应该引起系统管理员和安全专业人员的关注。使用交替数据流，用户可以轻松隐藏文件，除非经过仔细检查，否则将无法检测到。\n\
  \n例如，如果罪分子想将脚本附加到文本文件中，以下命令将使用交替数据流附加该脚本：\n\n![程序代码。在代码中，变量名中的单词已合并。第 1 行。type some\
  \ script, dot, v b s, greater than, A D S File, dot, t x t, colon, some script,\
  \ dot, v b s.](img/9781284244496_CH08_06_UNIMG1.png)\n\n有很多工具可以检测文件是否通过交替数据流附加。最广为人知的是\
  \ `Alternate Data Streams View`。你可以从 [`www.nirsoft.net/utils/alternate_data_streams.html`](https://www.nirsoft.net/utils/alternate_data_streams.html)\
  \ 免费下载它。\n\n## Index.dat\n浏览器既可以是直接证据的来源，也可以是间接或辅助证据。显然，在儿童色情案件中，浏览器可能包含特定犯罪的直接证据。在网络骚扰案件中你也可能发现直接证据。然而，如果你怀疑某人创建了感染网络的的病毒，你可能只会找到间接证据，例如嫌疑人搜索过病毒创建或编程相关主题的证据。\n\
  \n即使嫌疑人的浏览历史被删除，如果他们使用的是 Internet Explorer，仍然可能检索它。Index.dat 是 Internet Explorer\
  \ 用于存储网页地址、搜索查询和最近打开的文件。因此，如果一个文件位于通用串行线 (USB) 设备上但在嫌疑机器上打开过，`index.dat` 就会包含该记录。\n\
  \n你可以从网上下载许多工具，允许你检索和查看 `index.dat` 文件。这里有几个：\n\n*   `http://www.eusing.com/Window_Washer/Index.dat`\n\
  *   `http://www.acesoft.net/index.dat%20viewer/index.dat`\n*   `http://download.cnet.com/Index-dat-Analyzer/3000-2144_1056421.html`\n\
  \n你可以在图 8-9](#9781284244496_CH08_07.xhtml#c8-fig0011) 中看到 Window Washer。\n\n![图\
  \ 8-9 Window Washer.](img/9781284244496_CH08_FIGF09.jpg)\n\n图 8-9 Window Washer。\n\
  \n无论你选择什么工具，index.dat 都是不容忽视的重要信息来源。\n\n这在后版本的 Internet Explorer 中已被取代。从版本 10 开始，Internet\
  \ Explorer 将历史存储在 `C:\\user\\username\\AppData\\Local\\Microsoft\\Windows\\WebCache\\\
  WebcacheV01.dat`。\n\n其他浏览器使用自己的位置。例如，Mozilla Firefox 将历史存储在名为 `history.dat` 的文件中，类似于\
  \ `index.dat`。它位于以下两个位置之一：\n\n*   `C:\\Documents and Settings\\user\\Application\
  \ Data\\Mozilla\\Firefox\\Profiles\\<random_text>\\history.dat`\n*   `C:\\Documents\
  \ and Settings\\user\\Application Data\\Mozilla\\Profiles\\<profile_name>\\<random_text>\\\
  history.dat`\n\n此目录下有三种文件：\n\n*   一个缓存映射文件\n*   三个缓存块文件\n*   独立的缓存数据文件\n\n幸运的是，你不需要手动检查这些文件并提取数据。所有主要的取证软件软件包都会为你提取浏览器历史。这包括\
  \ AccessData 的 `FTK`、Guidance 的 `EnCase` 以及 PassMark 的 `OSForensics`。\n\n\n\n\n\
  文件权限在移动文件时可能会发生变化。权限的变化取决于是复制粘贴还是剪切粘贴，以及操作是否在同一分区内进行。在同一分区内复制/粘贴意味着文件/文件夹将继承其所在目标文件夹的权限。剪切/粘贴（移动）意味着如果新位置在同一分区上，则文件/文件夹将保留原始权限。这是因为当文件/文件夹位于同一分区内时，它们并没有实际移动，而是更新了指向其位置的指针。复制或剪切到不同的分区，文件将继承目标文件夹的权限。\n\
  \n### MAC\n\n在 Windows 文件的上下文中，`MAC` 指的是三个关键属性：修改（Modified）、访问（Accessed）、创建（Created）。\n\
  \n*   `File Created`（文件创建）：这是文件在卷上被“创建”的日期。在正常操作文件（如打开、关闭、保存或修改文件）时，该日期不会改变。\n*\
  \   `File Accessed`（文件访问）：这是文件最后一次访问的日期。访问可以是移动、打开或任何简单的访问。它也可能由防病毒扫描程序或 Windows\
  \ 系统进程触发。\n*   `File Modified`（文件修改）：Windows 显示的此日期表示文件本身发生了变化。\n\n显然，这些日期/时间戳在取证方面可能非常重要。例如，如果一张图片的修改日期晚于创建日期，说明该图片被编辑过。\n\
  \n## 注册表 (The Registry)\n\n什么是注册表？它是 Windows 系统上所有信息的存储库。当你安装新程序时，其配置设置存储在注册表中。当你更改桌面背景时时，该设置也存储在注册表中。\n\
  \n根据微软 TechNet 的一篇文章，²\n\n> 《微软计算机字典》第五版将注册表定义为：一种用于 Windows 98、Windows CE、Windows\
  \ NT 和 Windows 2000 的中央分级数据库，用于存储配置一个或多个用户、应用程序和硬件设备所需的系统信息。\n\n> 注册表包含 Windows\
  \ 在运行期间持续引用的信息，例如每个用户的配置文件、计算机上安装的应用程序以及每个程序可以创建的文档类型、文件夹和应用程序图标的属性页设置、系统中存在的硬件以及正在使用的端口。\n\
  \n> 注册表取代了 Windows 3.x 和 MS-DOS 配置文件中使用的部分基于文本的 `.ini` 文件，如 `Autoexec.bat` 和 `Config.sys`。虽然注册表适用于多个\
  \ Windows 操作系统，但它们之间存在一些差异。注册表单元（Hive）是注册表中的一组键、子键和值，它们有一组包含其数据备份的支持文件。除 `HKEY_CURRENT_USER`\
  \ 外，所有单元的支持文件都位于 Windows NT 4.0、Windows 2000、Windows XP、Windows Server 2003 和 Windows\
  \ Vista 的 `%SystemRoot%\\System32\\Config` 文件夹中。`HKEY_CURRENT_USER` 的支持文件位于 `%SystemRoot%\\\
  Profiles\\Username` 文件夹。这些文件夹中的文件扩展名表示它们所包含的数据类型。参见表 8-1](#9781284244496_CH08_16.xhtml#c8-bib002)。\n\
  \n| 注册表单元 (Registry hive) | 描述 |\n| :--- | :--- |\n| `HKEY_LOCAL_MACHINE` | `Sam`\
  \ |\n| `HKEY_LOCAL_MACHINE` | `Security` |\n| `HKEY_LOCAL_MACHINE` | `Software`\
  \ |\n| `HKEY_LOCAL_MACHINE` | `System` |\n| `HKEY_CURRENT_USER` | `Default` |\n\
  | `HKEY_CURRENT_USER` | `Ntuser` |\n\n这些文件夹中的文件表示它们所包含的数据类型。参见表 8-1](#9781284244496_CH08_16.xhtml#c8-bib0002)。\n\
  \n当你在本节继续学习并学习如何找到某些值时，请记住特定的单元名称。注册表被分为五个称为“单元”（hives）的部分。你可以在图 8-10 中看到这五部分。\n\
  \n1.  `HKEY_CLASSES_ROOT` (`HKCR`)：此单元包含有关文件关联的信息。\n2.  `HKEY_CURRENT_USER` (`HKCU`)：此单元包含当前用户的信息。\n\
  3.  `HKEY_LOCAL_MACHINE` (`HKLM`)：此单元包含整个机器通用的设置。\n4.  `HKEY_USERS` (`HKU`)：此单元包含所有用户的配置文件。\n\
  5.  `HKEY_CURRENT_CONFIG` (`HCU`)：此单元包含当前配置。\n\n在理想情况下，所有这些单元将包含相同的信息。任何差异都应该被记录并调查。\n\
  \n所有的注册表键都包含一个与之关联的值，称为 `LastWriteTime`。你可以将其比作文件或文件夹的修改时间。查看 `LastWriteTime` 可以告诉你此注册表值是何时更改的。该值不是标准的日期/时间格式，而是以\
  \ `FILETIME` 结构的形式存储的。`FILETIME` 结构表示自 1601 年 1 月 1 日以来的 100 纳秒间隔的次数。\n\n在学习注册表中的特定证据之前，考虑一些可能实用的通用设置。自动运行位置（Auto-run\
  \ locations）是在启动启动期间启动程序的注册表键。病毒和间谍软件在启动时自动运行是常见现象。另一个需要查看的设置是 `MRU`，即“最最近使用”。这些是特定于程序的。例如，Microsoft\
  \ Word 可能有一个 `MRU` 描述最最近使用的文档。\n\n一个典型的注册表键可能包含多达四个子项，标记为“控制集”（control set）。³ 你可能会遇到的四种是：\n\
  \n*   `ControlSet001`：这是你启动时使用的最后一个控制集。\n*   `ControlSet002`：这是最后一个已良好的控制集，或者最后一次成功启动\
  \ Windows 的控制集。如果启动过程中一切顺利，那么 `ControlSet001` 和 `ControlSet002` 应该是相同的。\n*   `CurrentControlSet`：`CurrentControlSet`\
  \ 子键只是指向 `ControlSet001` 或 `ControlSet002` 键的指针。\n*   `Clone`：`Clone` 是 `CurrentControlSet`\
  \ 的克隆，每次启动计算机时都会创建。\n\n### USB 信息\n\n你可以发现的一个重要信息是连接到机器的任何 USB 设备。\n\n\n\n\n注册表项\
  \ `HKEY_LOCAL_MACHINE\\System\\ControlSet\\Enum\\USBTOR` 列出了连接到该机器的 USB 设备。通常情况下，犯罪分子会将证据移动或将其他信息提取到外部设备并随带离开。这可能向你表明，存在你需要的查找和检查的设备。犯罪分子通常尝试将文件离线移动到外部驱动器。此注册表设置可以告诉你连接到此系统的外部驱动器。\n\
  \n还有其他与 `USBSTOR` 相关的注册表项可以提供相关信息。例如，`SYSTEM\\MountedDevices` 允许调查人员将序列号与 USB 设备插入时挂载的特定驱动器号或卷进行匹配。这些信息应当与来自\
  \ `USBSTOR` 的信息结合，以获得有关 USB 活动的更完整视图。\n\n注册表项 `\\Software\\Microsoft\\Windows\\\
  CurrentVersion\\Explorer\\MountPoints2` 将指示在连接 USB 设备时，哪个用户登录了系统。这使得调查人员能够将特定用户与特定的\
  \ USB 设备关联起来。\n\n## 无线网络\n\n想一想，连接到 Wi-Fi 网络的过程。你可能需要输入某些密码。但当你下次连接到该 Wi-Fi 时，不需要再次输入该密码，对吧？这些信息存储在计算机的某处，但在哪里呢？它们存储在注册表中。\n\
  \n当个人连接到无线网络时，服务集标识符（`SSID`）会被记录为首选网络连接。这些信息可以在注册表的 `HKEY_LOCAL_MACHINE \\SOFTWARE\\\
  Microsoft\\WZCSVC\\Parameters\\Interfaces` 项找到。\n\n注册表项 `HKLM\\SOFTWARE\\Microsoft\\\
  Windows NT\\CurrentVersion\\NetworkList\\Profiles\\` 提供了该接口连接过的所有 Wi-Fi 网络列表。网络的\
  \ SSID 包含在 `Description` 项中。计算机首次连接到网络的时间记录在 `DateCreated` 字段中。\n\n注册表项 `HKLM\\\
  SOFTWARE\\Microsoft\\WindowsNT\\CurrentVersion\\NetworkList\\Signatures\\Unmanaged\\\
  {ProfileGUID}` 存储了其所连接的无线接入点的 MAC 地址。\n\n## 在注册表中跟踪 Word 文档\n\n许多版本的 Word 在注册表中存储一个\
  \ `PID_GUID` 值——例如，类似 `{ 1 2 3 A 8 B 2 2 - 6 2 2 B - 1 4 C 4 - 8 4 A D - 0 0 D 1\
  \ B 6 1 B 0 3 A 4 }` 的内容。字符串 `0 0 D 1 B 6 1 B 0 3 A 4` 是创建此文档的机器的 MAC 地址。在涉及知识产权窃、间谍活动和类似犯罪的情况下，跟踪文档的来源非常重要。这是\
  \ Windows 注册表中一个相当冷僻的方面，即使对于法证分析师来说也不为人知。\n\n## 注册表中的恶意软件\n\n如果你搜索注册表并发现 `HKLM\\\
  SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon`，它包含一个名为 `Shell` 的值，默认数据为\
  \ `Explorer.exe`。基本上，它告诉系统在登录完成后启动 Windows 资源管理器。某些恶意软件会将恶意软件的可执行文件附加到默认数据中，这样恶意软件每次系统启动时都会加载。如果你怀疑存在恶意软件问题，检查此注册表设置是非常关重要的。\n\
  \n项 `HKLM\\SYSTEM\\CurrentControlSet\\Services\\` 列出了系统服务。有几个作为服务安装的恶意软件示例，特别是后门软件。因此，如果你怀疑存在恶意软件问题，请再次检查此项。\n\
  \n## 已卸载的软件\n\n对于任何法证检查，已卸载的软件都是非常重要的注册表项。入侵计算机的者可能会为了各种目的在该计算机上安装软件，例如恢复删除的文件或创建后门。随后他很可能会删除所使用的软件。窃数据的员工也可能安装隐藏软件以便隐藏数据，随后他会卸载该软件。此项让你看到所有已从该机器上卸载的软件：\n\
  \n`HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall`\n\n## 密码\n\n如果用户告诉\
  \ Internet Explorer 记住密码，那么密码就会存储在注册表中，你可以检索它们。以下项持有这些值：\n\n`HKCU\\Software\\Microsoft\\\
  Internet Explorer\\IntelliForms\\SPW`\n\n在某些 Windows 版本中，此项将为 `\\IntelliForms\\\
  Storage1`。\n\n任何密码来源都特别吸引人。人们重复使用密码并不罕见。因此，如果你能够获取在一个语境下使用的密码，它们可能与其他语境下使用的密码相同。\n\
  \n## ShellBag\n\n此项可以在 `HKCU\\Software\\Microsoft\\Shell\\Bags` 找到。ShellBag 项表示访问了某个文件夹，而不是特定文件。此\
  \ Windows 注册表项在儿童色情调查中具有特殊价值。被告经常声称他们并不知道相关计算机上存在这些文件。ShellBag 项可以证实或反驳这一主张。\n\n\
  有关 Windows 注册表的更多信息的良好资源可以在 SANS 学院在线阅读室找到，地址为：`http://www.sans.org/reading_room/whitepapers/auditing/wireless-networks-windows-registry-computer-been_33659`。\n\
  \n法证工具 `OSForensics` 将许多不同的 Windows 注册表值汇总到一个名为“User Activity”（用户活动）的单一屏幕中。如图 8-11\
  \ 所示。注意实际文件名已经过处理，因为这张图片是从我自己的计算机截取的。但是，你可以看到该工具为法证分析师提供了一个易于查看的输出，显示了 ShellBags、网络历史、UserAssist\
  \ 以及来自 Windows 注册表的其他信息。\n\n![图 8-11 用户活动。](img/978128424496_CH08_FIG11.jpg)\n\n\
  图 8-11 用户活动。\n\n## Shimcache\n\n也称为 `AppCompatCache`，位于注册表项 `HKLM\\SYSTEM\\CurrentControlSet\\\
  Control\\SessionManager\\AppCompatCache\\AppCompatCache`。如图 8-12 所示。\n\n![图 8-12\
  \ Shimcache。](img/978128424496_CH08_FIG12.jpg)\n\n图 8-12 Shimcache。\n\nWindows Shimcache\
  \ 从 Windows XP 开始用于跟踪执行程序的兼容性问题。该缓存根据操作系统存储各种文件元数据，例如：\n\n*   文件完整路径\n*   文件大小\n\
  *   $Standard_Information` (SI) 修改时间\n*   Shimcache 更新时间\n*   进程执行标志\n\n类似于日志文件，Shimcache\
  \ 同样使用队列，这意味着旧数据会被新条目替换。保留的数据随操作系统而异。从法证角度来看，此注册表项是另一种发现特定 Windows 计算机上执行过程序的方法。有两种操作可以导致\
  \ Shimcache 记录条目：\n\n*   执行文件。这在从 XP 开始的所有 Windows 版本中都会被记录。\n*   在 Windows 8、10、Server\
  \ 2012 和 Server 2016 上，应用程序体验查找服务可能会为用户交互浏览目录中的文件记录 Shimcache 条目。例如，如果一个目录包含 `file1.txt`\
  \ 和 `file2.exe`，Windows10 系统可能会在 Shimcache 中记录这两个文件的条目。\n\n### Amcache\n\n\n\n\n\
  \n`Amcache` 是另一个存储已执行应用程序信息的注册表项。特别有趣的是，该条目记录了文件的哈希值。这允许人员搜索诸如 Virus Total（[`www.virustotal.com/gui/`](https://www.virustotal.com/gui/））等资源，以查看其是否为已知恶意软件。`Amcache`\
  \ 于 Windows 8，`Amcache.hve` 替代了 `RecentFileCache.bcf`。该文件实际上位于 `C:\\Windows\\appcompat\\\
  Programs`。大多数现代 Windows 取证软件都会为你提取这些数据；但如果你想手动查看，只需导航到该文件夹。你无法在运行的系统上打开这些文件，因为 Windows\
  \ 进程正在使用它们。你可以在图 8-13 (#9781284244496_CH08_09.xhtml#c8-fig0015)中看到该文件夹。\n\n![Figure\
  \ 8-13 Amcache.](img/9781284244496_CH08_FIGF13.jpg)\n\n图 8-13 Amcache。\n\n### Prefetch\n\
  \n它位于注册表项 `HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\Session Manager\\\
  Memory Management\\PrefetchParameter`。`Prefetch` 文件包含可执行文件的名称、该可执行文件使用的 DLL Unicode\
  \ 列表、该可执行文件运行的次数以及指示程序最后运行时间的时间戳。这还能让你知道可执行文件何时会在系统上运行。注意，有多种方法可以确定哪些程序已被执行。这是检查\
  \ Windows 计算机的优势之一：它在多个地方存储相关数据。这使得即使是精通取证的犯罪分子也难以删除所有条目。\n\nWindows Prefetch 文件引入于\
  \ Windows XP，旨在加速应用程序的启动过程。Windows 会在 `%windir%\\Prefetch` 文件夹中维护 128 个 Prefetch\
  \ 文件（`.pf`）。从 Windows Vista 开始，该技术得到了扩展并重命名为 `SuperFetch`。Windows 对本质相同的功能使用了不同的名称，例如\
  \ `SuperFetch` 和 `ReadyBoot`。\n\n### SRUM\n\n系统资源使用监控（`SRUM`）数据库收集可执行文件的数据。数据存储在微软的数据库格式可扩展存储引擎（`ESE`）中。它首次引入于\
  \ Windows 8。它允许人员跟踪资源利用情况，包括网络活动。对于网络活动，`SRUM` 会跟踪网络接口、网络配置文件、连接时间以及连接长度。除了许多商业工具会捕获\
  \ SRUM 信息外，你还可以从 [`github.com/MarkBaggett/srum-dump`](https://github.com/MarkBaggett/srum-dump)\
  \ 下载一个开源工具。`SRUM` 数据库通常位于 `\\Windows\\system32\\sru\\SRUDB.dat`。\n\n### BAM and\
  \ DAM\n\nWindows 后台活动监控（BAM）和桌面活动监控（DAM）可以提供有关应用程序使用的信息。`BAM` 提供在系统上运行的可执行文件的完整路径以及最后执行日期/时间。它位于此注册表路径：`HKLM\\\
  SYSTEM\\CurrentControlSet\\Services\\bam\\UserSettings\\{SID}`。`BAM` 显示于图 8-14 (#9781284244496_CH08_09.xhtml#c8-fig0016)。\n\
  \n![Figure 8-14 BAM.](img/9781284244496_CH08_FIGF14.jpg)\n\n图 8-14 BAM。\n\n正如你所猜测的，`DAM`\
  \ 位于 Windows 注册表中一个非常相似的位置：`HKLM\\SYSTEM\\CurrentControlSet\\Services\\dam`。\n\n\
  ### Recycle Bin\n\n让我们从较旧的版本开始。这是于 Windows 2000 和 XP 的旧回收站。许多取证人员会遇到这种回收站。回收站位于名为\
  \ `\\$Recycler\\%SID%` 的隐藏目录，其中 `%SID%` 是用户的安全标识符。当文件移动到回收站时，原始文件会被重命名为 `$R` 加上一组随机字符，但保留原始文件扩展名。同时会创建一个以\
  \ `$I` 开头并带有相同随机字符的新文件。从 Windows 7 及以后，微软弃用了 `INFO2` 文件。现在，回收站维护一个名为 `INFO2` 的隐藏文件，用于记录删除时间、大小以及回收路径。\n\
  \n你可以通过以下步骤恢复损坏的回收站：\n\n1.  打开具有管理员权限的命令提示符。要打开具有管理员权限的命令提示符，点击开始，点击所有程序，点击辅助工具，右键点击命令提示符并以管理员身份运行。\n\
  2.  输入以下命令并按回车：\n\n```\nrd /s /q C:\\$Recycle.bin\n```\n注意，这将清除 C 盘的回收站。\n\n3. \
  \ 输入 `exit` 关闭命令提示符窗口。\n\n### I30 Attribute\n\nNTFS 文件系统维护一个属于目录的所有文件的索引，称为 `$I30`\
  \ 属性。每个目录都包含 `$I30` 属性，当目录内容发生变化时必须维护该属性。当从目录中删除文件或文件夹时，`I30` 索引会相应重新排列。然而，索引的重新排列可能会将删除的文件/文件夹条目留在空隙中。这对于取证分析识别可能存在过的文件有用。\n\
  \n`$I30` 是用于 NTFS MFT 属性包含目录索引的文件名。NTFS 在多个处存储目录文件名，取决于目录中文件的数量。\n\n### PowerShell\
  \ 取证\n\n在本章早期，你已经接触了一个 PowerShell 命令。在本节中，我们将更深入地探讨。Windows PowerShell 是微软的一种可扩展自动化引擎，由命令行壳和相关的脚本语言组成。Windows\
  \ PowerShell 基于 .Net 框架。在 Windows 10 中，只需使用搜索并输入 PowerShell。对于许多许多有趣的命令，你需要以管理员身份运行\
  \ PowerShell。PowerShell 提供了许多取证检查中非常有用的命令，特别是在实机排查中。\n\n这里列出了一些命令：\n\n\n\n\n\n>\
