  ```\n\n这显示在图 14-9。\n\n![FIGURE 14-9 Volatility psscan.](img/9781284244496_CH14_FIGF09.jpg)\n\
  \n图 14-9 Volatility psscan。\n\n### svcscan 命令\n\n该命令非常常用；它将列出提取内存转储时内存中所有服务的详细信息。例如：\n\
  \n\n\n\n\n![程序代码。在代码中，变量名中的单词被合并了。第 1 行：volatility, underscore, 2 dot 6, underscore,\
