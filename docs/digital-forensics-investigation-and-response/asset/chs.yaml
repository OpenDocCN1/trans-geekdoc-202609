  \ A\n\n**信息交换美国代码 (ASCII)**：一组定义了所有可能的按键的代码，包括字母、数字、字符，甚至是空格键和回车键。\n\n**匿名转发 (Anonymous\
  \ remailing)**：向匿名代理发送电子邮件信息的过程。匿名代理在通过匿名邮件服务器的 IP 地址转发邮件之前，会剥离邮件中的身份信息。\n\n**反取证\
  \ (Anti-forensics)**：犯罪分子为了隐藏其位置、活动或身份而采取的行为。\n\n**非对称加密 (Asymmetric cryptography)**：使用两个密钥的加密技术：一个用于加密消息，另一个用于解密。\n\
  \n**异步传输模式 (ATM)**：一种使用固定长度 53 字节数据包（称为）的高速连接技术。\n\n**验证 (Authenticate)**：验证人的身份，或验证证据。\n\
  \n## B\n\n**基站 (BTS)**：蜂窝网络中负责移动手机与网络交换系统之间通信的部分。\n\n**基础输入输出系统 (BIOS)**：存储在芯片上的、用于启动计算机的基本指令。\n\
  \n**位级信息 (Bit-level information)**：存储在内存或存储设备中的实际 1 和 0 的位级信息。\n\n**块密码 (Block cipher)**：一种以块形式加密数据的加密形式；64\
  \ 位块相当常见，尽管某些算法（如 `AES`）使用更大的块。\n\n**自举环境 (Bootstrap environment)**：存储在闪存器特殊区域的特殊程序，例如\
  \ `U-Boot` 或 `RedBoot`。\n\n**暴力破解攻击 (Brute-force attack)**：攻击者通过简单尝试密钥空间中的每一个密钥来解密消息的攻击。\n\
  \n**业务连续性计划 (BCP)**：在业务能够恢复完全正常运行之前维持最低限运行的计划。\n\n\n\n\n\n# B\n业务影响分析 (BIA) | 分析特定事件可能对业务运营产生的影响。\n\
  \n# C\n凯撒密码 (Caesar cipher) | 一种加密方法，通过选择一个数字来移动文本字母表中的每个字母，并用新字母替换被加密的字母。例如，如果你的文本是“A\
  \ CAT”，而你选择移动两个字母，那么加密后的文本就是“C ECV”。这也被称为单表密码、单字母密码或替换密码。\n\n载体 (Carrier) | 隐藏载荷的信号、流或数据文件。\n\
