  \    4. 你不能这样做。\n\n## 参考文献\n\n1. Bunting, S. (2012). EnCE: EnCAse Computer Forensics:\
  \ The Official EnCase Certified Examiner Study Guide, 3rd ed. Indianapolis, IN:\
