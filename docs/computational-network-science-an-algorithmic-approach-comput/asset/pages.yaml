    (Bonachich, 1987). This coincidence helps us exploit the to-logical position of
    nodes. A node that is well positioned by having a high power index (i.e., high
    Bonachic centrality value) similarly possesses high SC.


    **Observation 3:** Nodes in a network with higher power possess SC.


    **Observation 4:** Nodes in a network with bridge roles possess SC.


    We consider SC to be a scalar value that can be either accumulated and consumed
    verbatim or used as credit. In a network, SC might be used to trade for or exchanges
    with others in the form of delegation of tasks. Bartering with SC can be limited
    to a pair of nodes through an immediate link between them. Alternatively, a node
    might barter anonymously with another node with which there may not be a direct
    link.


    If the network is very large and resources are scattered widely, it may be ineffective
    to engage in direct interactions with resource owners due to large distances to
    resource owner nodes. It would be beneficial to find nodes that interface on their
    behalf. On the other hand, some resource owners may wish to make their resources
    available far beyond their immediate surroundings. It would be useful if the resource
    owner could have an interface agent in order to expose availability of the resource
    to remote parts of the NO. This is discussed in the following section.


    # 10.1.1 Intermediaries


    Some agents may play intermediary roles to facilitate resource access among other
    agents. The simplest intermediary role is when a resource owner agent delegates
    access to its resource to a broker agent, whom we dub the coordinator. To keep
    things simple, we assume that each'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'resource owner is identified with a single coordinator in the network and that
    the coordinator possesses the highest SC in the network with respect to the resource
    owner whose it is coordinating. All access policies of the resource owner are
    handled by the coordinator.


    Another type of intermediary is when a number of agents with low SC themselves
    are identified with a representative broker whose task is to secure access to
    a specific resource on their behalf. Between agents and their representative must
    be high. The representative must strive to build strong SC to targeted resource
    owners in order to have the capacity to deliver resource access to its constituents.
    The representative agent must continually review resource policies of resource
    owners and, when applicable, policies of coordinators. In very large NO, once
    coordinators and representative broker agents are identified, majority of interactions
    are (a) between agents and representatives, and (b) between coordinators and resource
    owners. The next section offers a rudimentary high-level outline for resource
    access using SC. Details are omitted for brevity and many variations are planned
    for future work.


    # 10.1.2 A Basic Protocol for Resource Access Using Social Capital


    In order to illustrate the role of SC in resource access, this section presents
    rudimentary protocols for resource owners, resource seekers, and broker agents.
    Figure 10.2 sketches a simple algorithm for resourceseeking strategy using SC.
    An agent seeking a resource first tries to access its neighbors and then from
    remote owners. For remote owners, representative broker agents are consulted to
    find the resource on their behalf. If seeking neighbors and representatives fail
    to produce access, the agent abandons resource seeking. Activating SC depletes
    the seeker''s SC and increases resource owner''s or representative''s SC by the
    same


    +   1. for all neighboring resource owners of type R,

    2. if SC to that is above R''s willingness to share threshold, activate SC and
    get resource and else,

    3. for all representative broker agents of resource type R, if SC to that intermediary
    agent is above R''s willingness to share threshold, propose SC;

    4. if accepted SC and get resource, else

    5. end for; end fail; abort.


    Figure 10.2. Resource-seeking algorithm using social capital.'
