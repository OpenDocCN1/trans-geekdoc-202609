    # 5.2 TIME GRAPHS


    Time graphs extend the traditional notion of an evolving directed graph that captures
    link creation as a phenomenon in time. We address this question through creation
    and analysis of a series of snapshots of the data. The development of tools and
    methods to analyze these snapshots is therefore a timely endeavor. Blogspace offers
    an additional technical advantage over such approaches—if data is craw with a
    certain frequency, there is no notion of the precise point in time a page was
    created and updated. In contrast, blogspace offers a ready-made view of evolution
    in continuous time. As each blog adds an entry with links, there is a time stamp
    associated with that event. By automatically extracting these time stamps, we
    can pierce together a view of blogspace evolving continuously from the beginning
    of blog archiving to the present. We should stress that time is absolute and not
    merely relative in a sequence of crawls. We focus on connectivity evolution and
    on temporally concentrated bursts (i.e., the Kleinberg’s conception) in the evolution
    of blogspace (Kleinberg, 2002).


    Within a community of interacting bloggers, a given topic may be the subject of
    intense debate for a period of time and then fade away. These bursts of activity
    are typed by heightened hyperlinking among the blogs involved—within a time interval.
    Note that a subgraph indicates a community of interest in the traditional sense
    that may exist among a set of blogs without ever achieving this temporal focus.
    Conversely, heavy linkage within a short period may appear less significant when
    viewed over a long time span—suggesting that the criterion for inferring pattern
    of links is a community is less stringent than for a static graph.'
