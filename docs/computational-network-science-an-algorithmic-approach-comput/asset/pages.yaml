  md: '# 6.2 PERCOLATION MODEL


    In physics and mathematics, percolation theory describes the behavior of clustered
    components in random networks (Grimmett, 1999). The common intuition is movement
    and filtering of fluids through porous materials. In a network (i.e., a grid)
    each node is a cell through which a fluid-like substance may transit to other
    cells. A network and percolation is the determination of whether a substance introduced
    at one cell will reach the other side of the network (grid). There have been many
    applications of percolation such as analysis of forest fire, bank failures, and
    rumor spread. You may explore an online implementation of NetLogo percolation
    model. Commonly, a cell''s transmission rate is modeled as a probability value
    p. As shown in Figure 6.2, at a certain value of p, percolation is achieved.


    # 6.3 DISEASE EPIDEMIC MODELS


    Although the original inspiration is disease epidemics, we treat the topic generically
    applicable to epidemic spread of any phenomenon. The earliest model is the susceptible,
    infected, susceptible (SIS), documented in Kermack and McKendrick (1927). As shown
    in Equation 6.3, consider a fixed population N at time t that is divided into
    three camps: susceptible, infected, and removed. The susceptible camps, denoted
    by S(t), are individuals who are/ not infected at time t. The infected camps,
    denoted by I(t), are individuals who have already been infected and are capable
    of transmitting epidemics to the individuals in the susceptible


