  md: '# CHAPTER 12

    Emerging Trends


    Network science discipline crosses several boundaries. We have provided a snapshot
    of the state of the art in network science. However, the future beckons for extensive,
    active research as expected. In the remainder of this chapter, I highlight the
    research focuses in leading institutions.


    Mining social media is a burgeoning trend (Bhat and Abulaisha, 2013; Tu et al.,
    2013). Online social networking has irrevocably changed human social life. At
    an extreme, friends and family members sitting in the same room prefer to tweet
    or post instead of speak. Prevalence of social media creates living, digital diaries
    that are semipublic. Idententially, sharing of social data produces opportunities
    for ultrarapid reflection and analysis. An evidence for this is that politics
    have changed with instantaneous trend analysis. Arguing for the downside of social
    media proliferation, it might be argued that people are retreating digital walls
    for isolated lives as Putnam put it (Putnam, 2001).


    On the positive side of this transformation, analyses in our age of big data (Mayer-Schönberger
    and Cukier, 2013) empower us to understand global shifts beyond nuance and biases
    at the individual level. “big” data analyses enable discoveries and deployment
    of solutions for social as well as medical maladies.


    Advances in communication networks are herding 5G wireless cellular networks.
    An objective has to create globally resource-optimized and energy-efficient networks.
    There are well-known trade-offs between energy consumption and service delay.
    State-of-the-approach is to enable communication networks that are ever more adaptive
    to traffic variations. Game theory has continued to play a role in this development
    (Menache and Ozdaglar, 2011; Antoniou and Pitsllides, 2013).


    There has been a proliferation of mobile device networks, where the network is
    limited to the device. Starting in the year 2000, automobiles have carried controller
    area networks (CAN) that enable drive-by-wire'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'controlled vehicles (Voss, 2005). A body area network (BAN) is composed of
    sensors and medical devices embedded in clothing, worn on, or implanted in the
    body (Gupta et al., 2013).


    # 12.1 CONCLUSION


    Clearly, we have witnessed only the tip of the emerging network science (Greve
    et al., 2014). With our primer and call to arms, we look forward to many developments
    over the horizon.


    # REFERENCES


    Antoniou, J., Pitsilled, A., 2013. Game Theory in Communication Networks. CRC
    Press.


    Bhat, S., Abulash, M., 2013. Analysis and Mining of Online Social Networks: Emerging
    Trends and Challenges. New Jersey: Wiley.


    Greve, H., Rowley, T., Shiplov, A., 2014. Network Advantage: How to Unlock Value
    From Your Alliances and Partnerships. Jossey-Bass.


    Gupta, S., Mukherjee, T., Venkatasubramanian, K., 2013. Body Area Networks: Safety,
    Security, and Sustainability. Cambridge University Press.


    Mayer-Schönberger, V., Cukier, K., 2013. Big Data: A Revolution That Will Transform
    How Live, Work, and Think. Eamon Dolan/Houghton Mifflin Harcourt.


