    Voss, W., 2005. A Comprehensible Guide to Controller Area Network. Copperhill
    Media Corporation.


    # EXERCISES


    +   1. How can we interface controller area network with body area network?


    +   2. Discuss interfaces between 5G wireless cellular networks and device area
