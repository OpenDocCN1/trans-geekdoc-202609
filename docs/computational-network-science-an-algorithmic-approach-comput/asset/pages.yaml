  md: '# CHAPTER 6

    Diffusion and Contagion


    This chapter explores the phenomena of rampant changes in networks exemplified
    by (a) disseminations of preferences, (b) percolation, (c) epidemic (i.e., contagion)
    of disease, and (d) community compositions. The rest of this chapter reviews these
    four categories in order.


    # 6.1 POPULATION PREFERENCE SPREAD


    Schell’s (1971) residential neighborhood segregation model is the earliest formally
    studied report of rampant changes in networks. Schelling pointed out that a small
    preference for one’s neighbors to be of the same ethnicity leads to a widespread
    segregation emergent in the network. He used coins on a patch of graph paper to
    demonstrate this theory by placing pennies and nickels in different patterns on
    the cells. Coins were moved by one if they were in an unsatisfactory composition.
    For every colored cell, if there were greater than 33% of the adjacent cells that
    were of a different color, the cell would move to another selected cell. You can
    run the model using Chris Cook’s online demonstration program or the NetLogo model.
    Further details and emerging patterns that are available from Hatna and Benenson
    (2012). Let $N$ be the population size and $p$ be the uniform, random probability
    for the existence of a tie for each individual with another person in the network.
    Let ignore the repeated connections. With the small value of $p$ and the large
    value of $N$, $PN$ represents the probability of an individual’s indirect connection
    with others in the network, that is, the second-hand tie through the individual’s
    primary tie. The expected (i.e., average) number of individuals that can be reached
    is shown by Equation 6.1. With the values of $PN \ge 0$, contagion breaks, that
    is, epidemic occurs. Rapid spread of diseases with connections in populations
    (e.g., obesity) is an epidemic and pandemic (i.e., an epidemic across borders)
    ever (Hays, 2005). Topologies of networks may hinder or promote these events.
    Whereas high-distance networks inhibit epidemics, low-distance networks (e.g.,
    a scale-free network) accelerate them.'
