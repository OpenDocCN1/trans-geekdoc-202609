  md: '# CHAPTER 9


    # Economic Networks


    Buyers, sellers, and traders are individuals with interests in goods and services.
    These individuals often form nodes of network called markets, which are a special
    type of an economic network. An economic network is a type of an exchange network
    where the links are used for exchange of commodities and services. These exchanges
    are direct and indirect economic effects for individuals. Interfacing buyers and
    sellers as matching markets are presented in Chapters 10 and 11 of Easley and
    Kleinberg (2010).


    Payoff (i.e., utility) for node $j$ is defined as $v_j - p_j$ where $v_{ij}$ is
    the value derived by agent acquiring $i$''s goods and $p_i$ is the price that
    is paid for the goods. For a set of prices, $P = \{p_1, p_2, ...\}$, each buyer
    wants to maximize his or her payoff. If there is a tie among sellers, a random
    seller is selected. Buyer rationality dictates that buyers purchase only if their
    payoff is a positive value. A buyer places a value on each item and the valuation
    profile of a buyer is the list of the values that the buyer assigns to items that
    are on sale. A buyer''s seller seller is a set of sellers that provides a positive
    value. Market clearing is achieved when buyers and sellers are perfectly matched
    so that every item can be sold. There are a few illustrative examples in Chapter
    10 of Easley and Kleinberg (2010). There are also a couple of positive results.
    First, for every set of buyer valuations (Easley and Kleinberg, 2010). Second,
    for every set of market clearing prices, any resultant perfect matching for buyers
    yields a maximal valuation for items bought from sellers. Sometimes attributed
    to Jenő Egervári, there is a procedure for constructing market clearing prices.
    This procedure is famously known as Gale-Shapley algorithm shown in Figure 9.1.
    A constricted set is a set in which edges from this set to the other side of the
    bipartite graph “constrict” the formation of a perfect matching. Further examples
    and details are available from Easley and Kleinberg (2010) and will not be duplicated
    here.'
