  md: '# CHAPTER 3


    # # Network Games


    Decision making requires reasoning. Whereas decision theory is about the process
    of an individual''s reasoning when pertinent decision attributes can be independently
    ascertained, game theory (GT) is about the process of reasoning when pertinent
    decision attributes include decisions of other individuals (Fudenberg, 1991).
    The latter is the scenario in networks where all the decisions are interdependent.
    GT has been long used as a branch of mathematics (Barron, 2008) to explain economic
    decision making in the theories of microeconomics (Mas-Cole et al., 1995). We
    will briefly introduce GT in Section 3.1 before the discussion of network-relevant
    applications in Sections 3.2–3.6.


    # ## 3.1 GAME THEORY INTRODUCTION


    A is a simple tuple $\langle I, S, U \rangle$. Here $I$ is a set of individuals
    (i.e., players or agents in GT nomenclature). Whereas $S$ is a nonempty set of
    actions (i.e., strategies in GT) for agent $i$, $S_i$ is a set of all agents''
    strategy sets, that is, $S = \Pi S_i$.


    $\mu_i: S \rightarrow R$ is the utility function (i., payoff) for agent $i$. For
    a combination of simultaneous decisions, agent $i$ receives a nonnegative reward.
    For convenience, $S_{-i}$ is used to denote the strategies of agents other than
    agent $i$.


    Matching Pennies is a famous zero-sum game of pure conflict with two actions {head,
    tail}, with a payoff matrix in Figure 3.1. The minimax theorem guarantees that
    all zero-sum matrix games are solvable, which means we can determine strategies
    that maximize player payoffs (Osborne and Rubinstein, 1994).


    Many real-world games have action sets with infinite cardinality such as the economic
    competition deciding on production of product quantities described in Cournot
    games. In the case of two firms and a single product type, $S_i = [0, \infty \]$,
    which is the amount of goods that that firm $i$ will produce. Payoffs are given
    by Equation 3.1, where'
