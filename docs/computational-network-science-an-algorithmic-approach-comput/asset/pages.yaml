  md: '# CHAPTER 7


    # # Influence Diffusion and Contagion


    By analogy with the spread of infectious diseases that we explored in Chapter
    6, novel ideas and word-of-mouth spread in networks lead to viral diffusion of
    social and economic choices. This chapter explores the phenomena of diffusion
    and contagion over social forces, which are created by the society that separates
    the individual and yet affects the individual. Some examples of social forces
    are the media, the economy, life styles, religion, and ideology. Examples of viral
    diffusion are changing social values, norms, behaviors, product adopts, religions,
    and cultural mindsets. When a node''s choices affect choices of others, we say
    that the node has influenced others.


    All epidemic and community detection models, including Granovetter''s threshold
    model (Granovetter, 1978), which we presented in Chapter 6, serve as basic models
    of influence diffusion and contagion. We do repeat them in this chapter. The caveat
    for this is to treat networks as directed graphs since most influence is not reciprocal
    and relationships are not symmetrical.


    Another caveat and assumption is that once a node is influenced (i.e., becomes
    active), it cannot lose that influence (i.e., become inactive). This is the basic
    assumption in progressive models with examples, such as product adoption, where
    influence is permanent. Nonprogressive models are used in epistemic contexts,
    such as opinions and political attitudes, where individuals may change their mind.


    In Section 7.1, we present a progressive model followed by a social learning model
    in Section 7.2 that is a nonprogressive model.


    # ## 7.1 STOCHASTIC MODEL


    Independent cascade models (ICM) assume a uniform influence probability p $\in
    [0, 1]$ between pairs of nodes in the network (Kempe et al., 2003). Let $S_t$
    be the set of nodes that are active at time $t$. If $t=0$, $S_t$ is the seed set
    from which influence spreads. The model moves forward with successive'
