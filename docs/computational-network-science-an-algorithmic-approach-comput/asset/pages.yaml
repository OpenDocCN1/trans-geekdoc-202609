- pgno: 37
  md: 'which belong to individuals or groups. The items collected through surveys
    and interviews, for example, are often regarded simply as the attributes of particular
    individuals, which can be quantified and analyzed through many available statistical
    procedures. The methods appropriate to attribute data are those of variable analysis,
    whereby attributes are measured as values of particular variables (e.g., income,
    occupation, education).


    Relational data include contacts, ties, connections, group attachments, group
    meetings, etc., which relate one agent to another, these data cannot be reduced
    to the properties of individual agents themselves. Relations are not the properties
    of individuals, but of systems of agents. These relations connect pairs of agents
    into larger relational systems. The methods appropriate to relational data are
    those of network analysis, whereby the relations are treated as expressing the
    linkages, which run between agents. While it is possible to undertake quantitative
    and statistical counts of relations, network analysis consists of a body of qualitative
    measures of network structure.


    Although are distinct types of data, each with their own appropriate methods of
    analysis, there is no specification about the methods of data collection that
    can be used to produce them. There is no approach that distinguishes methods for
    the collection of attribute data from those for the collection of relational data.
    The two types of data are often collected together as integral aspects of the
    same investigation. A study of political attitudes, for example, may seek to link
    these attributes to group memberships and community attachments, or an investigation
    of interlocking directorships may seek to link these attributes to the size and
    the profitability of the companies involved.


    Relational data are central to the principal concerns of sociological tradition,
    with their emphasis on the investigation of the structure of social action. Structures
    are built from relations, and the structural concerns of sociology can be pursued
    through the collection and analysis of relational data. Paradoxically, many of
    the existing texts on research methods and methods of data collection give little
    attention to this type of data instead of concentrating on the use of variable
    analysis for the investigation of attribute data. The formal, mathematical techniques
