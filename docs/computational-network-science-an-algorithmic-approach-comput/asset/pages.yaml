    +   1. for each node $v_i \in V$ **do**

    2. initialize $\{v_i\}$ as a single clique in the CQ(v, k)

    3. pop Bk from CQ(v_i, k) where $v_i$ is the last node added to $B_k$

    4. for each $v_j \in N(v_i)$ **do**

    5. validate whether $B_{k+1} = B_k \cup \{v_j\}$ is a clique by checking whether
    $v_j$ is adjacent to all nodes in Bk

    6. if $B_{k+1} \neq B_k$ is a clique, add $B_{k+1}$ to CQ(v_i, k)

    7. **end //** line 4

    8. return CQ(v_i, k)

