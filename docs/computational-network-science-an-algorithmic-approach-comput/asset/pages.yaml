  md: '# CHAPTER 8

    Power in Exchange Networks


    Each link between a pair of nodes that provides an opportunity for a transaction
    between the pair produces a value that can be shared between the pair. This is
    the premise in exchange networks (Easley and Kleinberg, 2010). Dating and mating
    networks can be represented with exchange networks (Blau, 1964). An exchange requires
    at least two individuals and can be tangible or intangible entities (i.e., goods
    and services) with imbalances of utility for participants (Turner, 1998). Blau
    promoted the idea that social choices are social actions that are counterparts
    of physical, speech, and epistemological actions (Blau, 1964). In the social exchange
    theory, exchanges yield value (i.e., worth) that is rewards—costs of the exchange.
    If the value is positive, the exchange is a desirable relationship; otherwise,
    exchange and the corresponding relationship are worthless.


    In search of desirable exchanges, a few individuals may lack partners (e.g., remain
    bachelors) while others may plethora of potential neighbors from whom to choose.
    Economic networks as buyers and sellers of goods and services are well represented
    with exchange networks (Easley and Kleinberg, 2010). Sellers and buyers could
    create network nodes and links would model transactions among. Sellers who have
    exclusive buyers have power over the extent of their exclusivity. Sellers who
    are exclusive providers of scarce commodities have power over the extent of their
    exclusivity and scarcity of their goods (i.e., monopoly in economic terms). When
    buyers are scarce, they have higher power over the extent of their scarcity (i.e.,
    monopsony in economic terms). In more general terms, dependence among agents derived
    from their relative position in the network gives rise to their structural power.
    There is a reciprocal relationship between potential power and dependence among
