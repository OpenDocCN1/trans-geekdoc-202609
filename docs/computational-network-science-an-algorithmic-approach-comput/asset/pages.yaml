  md: "A large class of networks is a complex engineered network (CEN) that is a man-made\
    \ network, where the topology is completely regular nor random. Examples of CENs\
    \ are the Internet, wireless networks, power grids with smart homes and cars,\
    \ remote monitoring networks with satellites, global networks of telescopes, and\
    \ networks of instruments and sensors from battlefields to hospitals. Time requirements\
    \ in CENs range from seconds in cyber-attacks to years in greenhouse gas emissions.\
    \ Data and control flow in CENs must be managed over connections that could span\
    \ thousands of miles.\n\n few synthetic network categories, including CENs, are\
    \ created intentionally. Here, we list six types:\n\n+   1. Social networks through\
    \ networking sites and services\n2. Political networks as in parliamentary cabinets\
    \ and political committees\n3. Computer networks that include computers and how\
    \ they communicate over local, wide area, and wireless links (e.g., sensor networks)\n\
    4. Telecommunication networks as in switches for nodes and respective routing\
    \ paths\n5. Power grids\n6. Cellular networks as in cellular base stations and\
    \ transmission frequencies\n\nThere are many synthetic, however, unintended, network\
    \ categories. For example, collocated brick-and-mortar businesses share clientele\
    \ that is sometimes unintended. As such, these businesses form a affinity network.\
    \ Relationships in affinity networks are only implied and in the context of the\
    \ affinity context (e.g., colocation). Consumers visiting popular e-commerce sites\
    \ (e.g., amazon.com) form their own product preference affinity networks. Although\
    \ pairs of individual consumers may never meet in-person, the e-commerce services\
    \ use affinity networks for data mining and Individuals sharing like votes (or\
    \ retweets) are part of an affinity network (or a hashtag) in the context of what\
    \ they liked (or tweeted).\n\nFigure 1.1 depicts a taxonomy of network types.\
    \ Exchange networks are those in which a quantifiable entity is exchanged among\
    \ the nodes whether or not the nodes are tangible (e.g., natural gas) or intangible"
