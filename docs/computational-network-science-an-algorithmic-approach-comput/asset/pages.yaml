  md: '# CHAPTER 5


    # Network Dynamics


    In many real-world networks, properties of nodes and links change over time. These
    changes yield evolutionary (or natural) network dynamics (END) (Roth and Coinet,
    2010). In many open networks (e.g., the Internet), nodes may enter or exit asynchronously.
    In many computer networks, nodes may crash or recover. Rapid changes result in
    volatile network dynamics (VND). In other networks, nodes or supervisors may take
    deliberate action to change the structure of the network, which we may call driven
    network dynamics (DND). In this chapter, we review some common methods for modeling
    these types of dynamics.


    # 5.1 EVOLUTIONARY AND VOLATILE NETWORK DYNAMICS


    Depending on the behavior of nodes, there are possibilities of forming new relations.
    Time can be used to indicate relations. If a fraction of the nodes in the network
    is engaged in a game, there is a chance of influencing other nodes in the network
    over time (Snijders and Doreian, 2010). Elder’s life course theory was developed
    in the 1960s for analyzing people’s lives in terms of structural, social, and
    cultural contexts. The theory examines all individual histories and observes how
    early events influence future decisions such as marriage, divorce, and bond loyalty.
    A life course is defined as a sequence of socially defined events and roles that
    the individuals enact over. The method encompasses observations, including history,
    sociology, demography, etc. In particular, the theory focuses on the connections
    among individuals as well as historical and socioeconomic contexts, in which these
    individuals live.


    Detecting communities in static networks is an emerging research area (Newman,
    2004, 2010). Current algorithms are limited to static networks. With faster algorithms,
    detecting communities in dynamic social networks (DSN) will rapidly capture changes
    in the network, which can be used for prediction and detection of plots as well
    as for its explanatory power used in social sciences (Hutchison, 2007).'
