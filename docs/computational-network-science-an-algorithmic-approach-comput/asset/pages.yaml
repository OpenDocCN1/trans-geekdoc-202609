    $M$ is the stochastic transition matrix, where $M_{ij}=1/d_i$ and $d_i$ is the
    degree of node $i$. Dynamics of the voter model is summarized in Equation 7.2.
    When $t \to \infty$, the state ceases to change and $\bar{x}_i$ approaches a steady
    state. The voter model is adapted for use on many recent influence diffusion models
    (Li et al., 2013).


