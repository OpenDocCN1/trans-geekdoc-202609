  md: '# CHAPTER 10

    Network Capital


    Networks are storehouses for a variety of capital that have value and worth. In
    economic terms, capital is money (Marx, 1967). Physical capitals are tools and
    resources (Economy and Levi, 2014). These might be common tools or raw materials
    such as oil and gas, which are commonly accessible to a group. Cultural capital
    consists of language, customs, and lifestyle choices (Beemyn, 2014). Whereas diversity
    promotes minority, social conventions promote conformity. Political capital is
    largely a measure of power to persuade others (Burgmann, 2014). Democracy and
    human rights serve as example areas, where social forces promote them from the
    West to the rest of the world. Social capital (SC) is an intangible capital to
    manage and change relationships such as interpersonal trust made famous by the
    works of Pierre Bourdieu, James Coleman, and Robert Putnam (Field, 2014). There
    are two major perspectives on SC in networks. In the macroscopic perspective,
    SC for the entire network is considered. In this view, individuals do not incrementally
    add to the system or withdraw units of SC. Instead, the areas of interest are
    the system principles such as norms and conventions that provide resources for
    the overall social welfare. In contrast, the microscopic perspective adopted here
    explores how individuals gain access to resources by their positions and connections
    in the network.


    Physical goods and services are often scattered unevenly in realworld networks.
    Neighborhoods, communities, and high-status nodes are similarly loosely distributed
    in networks. Nodes of a network often desire capital that may not be locally available
    to the node; thereby, they may take action to do one of the following: gain access
    to capital (e.g., gasoline), exert influence over nodes possessing capital (e.g.,
    conserve energy usage), have power over capital (e.g., limit tuna fishing), and
    have control over flow of capital (e.g., nonproliferation of nuclear materials).\Figure
    10.1 summarizes categories of capital and possible types of actions over them.'
