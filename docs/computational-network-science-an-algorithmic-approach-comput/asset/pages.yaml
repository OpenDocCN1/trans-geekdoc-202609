  img_proc: true
- pgno: 67
  md: 'time steps. At each step $t \ge 1$, $S_t = S_{t-1}$. For every node $v$ that
    is not active at $t-1$, find all nodes $u$ that may influence $v$ (i.e., incoming
    edges to $v$) and execute *activation attempt*, which is performed by a Bernoulli
    trial using probability $p$. If $u$''s activation attempt succeeds, add $v$ to
    $S_t$, that is, node $u$ influences (i.e., activates) $v$ at time $t$. If there
    are multiple nodes that may activate $v$, the result is similar irrespective of
    which one activates $v$. Since activation attempts of nodes are independent, the
    model is an independent, cascade model. When no more activation is possible, the
    network stays the same, and the set of activated nodes becomes the *final* $S$.
    At some point, no new activations are possible. All nodes are either activated
    or not. We call this *saturation*. An interesting property of ICM is that the
    capacity for diffusion is the same for all seed set nodes known as the *submodularularity
    principle*. Another property of ICM is that the set state is invariant to the
    seed size known as the *monotonicity principle*.


    A *fixed threshold model* is one where each node $v$ has an individual threshold
    $\theta \in [0, 1]$. Our example in Chapter 6 showed how iPhone 5S was adopted
    as a fixed threshold model.


    *A voter model* (Clifford and Sudbury, 1973) uses an undirected graph, where each
    node possesses a binary state 0 or 1. Iteratively, at each step, a node $v$ at
    time $t$ selects a random neighbor $u$ to mimic it $t-1$. To state more formally,
