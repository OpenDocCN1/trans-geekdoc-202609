  md: '# Computational Network Science: An Algorithmic Approach


    (b) value (i.e., utility) gained by each node from an exchange (Easley and Kleinberg,
    2010). A desirable objective for exchanges is called *stability*, the production
    of preferred outcomes that augment values of nodes engaged in exchange. If there
    are incentives for changes in exchange partner in order to increase value, there
    is *instability*. An exchange network is stable if and only if there are no instabilities
    (Easley and Kleinberg, 2010). Game theoretic, strategic bargaining has been used
    to optimize network stability (Easley and Kleinberg, 2010).


    Whereas structural power empowers agents with capacities to influence others,
    it is the agent choices, that is, agent *strategic actions*, that manifest social
    power. Agents can capture positive exchanges by dispensing or withholding rewards,
    wielding power strategies in their exchange networks (Russell, 1938; Molm, 1990).


    Individuals often join groups to increase their power. This is captured with the
    concept of *coalitions*, for example, economic blocks that may be regional or
    transnational. For the basics of coalition theory, refer to cooperative game theory
    in Chapter 3. For a few good examples, the reader may consult Bonacic and Liu
    (2012). There is much that remains to be explored and mathematical models that
    are of benefit for network science (Simpson et al., 2014).


    # 8.1 CONCLUSION


    *Power* has been of interest to network scientists and social scientists. We referred
    to structural and strategic notions of power with historical roots (Russell, 1938).
    There is a strong connection between power and influence, even though there are
    scarce formal models for qualitative and quantitative analyses (Easley and Kleinberg,
    2010). An intuitive direction for progress appears to be capture inequalities
    of resource distribution and access to them in the network. Those who are close
    to resources may regulate resource access to others in the network. Those who
    are remote from resources might wish to engage in strategic negotiation or have
    brokers engaged in such buffering.


    # REFERENCES


    +   Blau, P., 1964. Exchange and Power in Social Life. Wiley, New York.

    Bonacic, P., Liu, P., 2012. Introduction to Mathematical Sociology. Princeton:
    Princeton University Press.'
