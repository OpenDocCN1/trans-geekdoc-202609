  md: '# Computational Network Science: An Algorithmic Approach


    Family members A and D first bought an iPhone 5S at time t, so they are active
    and contagious. Node A attempts to influence C to buy the phone with the probability
    0.6. Node C is also influenced by the other active node D with the weight 0.4.
    Node C can be influenced arbitrarily by either family members A or D, and this
    depends on the sequence of the attempts made on node C at that time. Node C is
    influenced by node A at time t+1, and the probability of A''s success influencing
    C is denoted by $P_c(A, S)$, where $S$ is the set of other active family members
    who influence C, so $S = \{D\}$. Nodes A and D are active and noncontagious as
    they attempt to influence their neighbors once. These steps are repeated and influence
    cascades from family member $C \rightarrow F$ and $F \rightarrow I$. Eventually,
    the family members A, D, C, and F have new iPhone 5S and form a community, leaving
    others inactive as shown in Figure 6.18.


