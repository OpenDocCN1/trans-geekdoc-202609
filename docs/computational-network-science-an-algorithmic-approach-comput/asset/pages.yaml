    # 1.2 ONLINE SOCIAL NETWORKING SERVICES


    Facebook is an OSNS that connects people, organizations, friends, and others who
    work or live together. Nodes in a Facebook network can be individuals or organizations.
    Some of these may be synthetic with real-world humans. The main Facebook tool
    for connections is friendship. Facebook is used largely for personal and recreational
    functions. As such, it has filled the social gaps created by physical and psychological
    dispersion among traditional families and friends. It also serves as a medium
    that creates relationships that would not otherwise exist.


    One Facebook''s feature known as sharing allows adjustments on spread of information
    (i.e., selecting an audience). Sharing is used to limit who can view posts and
    photos. It is a three-step process: (1) indicates who you are (i.e., tagging),
    (2) tells you where you are (i.e., adding a location to a post), and (3) manages
    the privacy right for where you post (i.e., the inline audience selector). Sharing
    gives users control over their information diffusion, which in turn can yield
    a measure of social authority. Another Facebook''s like feature provides a directional
    relationship (i.e., tie, connection, and link) that lends credibility to the item
    and is proportional to the credibility (i.e., authority) of the endorser.


    Twitter is an OSNS that facilitates broadcasts of messages (i.e., tweets). The
    main twitter tool for connections is the explicit alignments of ideas among people
    (i.e., following). Twitter can be used by small or large groups to form crowd
    sourcing. For example, in the small network,'
