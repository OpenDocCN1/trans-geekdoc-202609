    Overall, the highest SC who proposes earliest is granted access to the resource,
    and the corresponding SC is collected for later use. Representative brokers collect
    proposals from their clients and seek to deal resource coordinators who may accept
    bids for resource access. If a match is found, SC is exchanged and resource is
    granted through corresponding brokers. Coordinator agents also collect proposals
    from representative agents and others to offer access to the resource under their
    care. We assume broker agents collect a negligibly small portion of SC as for
    their services. For brevity, the fee is ignored in our basic protocol in order
    to focus on interactions for the resource.


    For the resource owner willing to share its resource, it considers its neighbors
    collecting proposals from those who have adequate SC. The neighbor with the highest
    SC is granted the resource. If neighbors are not qualified, the coordinator is
    consulted. If the coordinator has a qualified resource-seeking client, the resource
    is granted in exchange for the SC. Otherwise, no one gets the resource. The owner’s
    protocol is shown in Figure 10.3.


    # 10.2 CONCLUSION


    We outlined a variety of capital available on a network. Nodes may desire to access,
    influence, exert power, and control capital. This is a largely unexplored topic
    and our exposition is a call to arms for building useful models. We sketched a
    model of SC to facilitate access to physical resources for nodes that lack them.
    Repeated social interaction among agents leads to development of SC, which is
    used as a measure of access to resources. We discussed how locations of agents
    relative to loci of agents give them different levels of SC and resource access.
    We then outlined a number of policies that can be used to regulate resource access.
    A resource owner may relinquish access to its resource to be controlled by an
    intermediary, coordinator agent. Agents who'
