- pgno: 106
  md: '# A.1 WHAT IS IT?


    In a network, a “component” is a group of nodes that are all connected to each
    other, directly or indirectly. So if a network has a “giant component,” that means
    almost every node is reachable from almost every other. This model shows how quickly
    a giant component arises if you grow a random network.


    # A.2 HOW IT WORKS


    Initially we have nodes but no connections (edges) between them. At each step,
    we pick two nodes at random that were not directly connected before and add an
    edge between them. All possible connections between them have exactly the same
    probability of occurring.


    As the model runs, small chain-like “components” are formed, where the members
    in each component are either directly or indirectly connected to each other. If
    an edge is created between nodes from different components, those two components
    merge into one. The component with the most members at any given point in time
    is the “giant” component and it is colored red. (If there is a tie for largest,
    we pick a random component to color.)


    # A.3 HOW TO USE IT


    The NUM-NODES slider controls the size of the network. Choose a size and press
    SETUP.


    Pressing the GO Once button adds one new edge to the network. To repeatedly add
    edges, press GO.


    As the model runs, the nodes and edges try to position themselves in a layout
    that makes the structure of the network easy to see. Layout makes the model run
    slower, though. To get results faster, turn off the LAYOUT? switch.


    The REDO LAYOUT button runs the layout-step procedure continuously to improve
    the layout of the network.


    A monitor shows the current size of the giant component, and the plot shows how
    the giant component’s size changes over time.'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# A.4 THINGS TO NOTICE


    The y-axis of the plot shows the fraction of all nodes that are included in the
    giant component. The x-axis shows the average number of connections per node.
    The vertical line on the plot shows where the average number of connections per
    node equals 1. What happens to the rate of growth of the giant component at this
    point?


    The model demonstrates one of the early proofs of random graph theory by the mathematicians
    Paul Erdos and Alfred Renyi (1959). They showed that the largest connected component
    of a network formed by randomly connecting two existing nodes per time step grows
    after the average number of connections per node equals 1. In other words, the
    average number of connections has a “critical point” where the network undergoes
    a “phase transition” from a rather unconnected world of a bunch of small, fragmented
    components to a world where most nodes belong to the same connected component.


    # A.5 THINGS TO TRY


    Let the model run until the end. Does the “giant component” live up to its name?


    Run the model again, this time slowly, a step at a time. Watch how the components
    grow. What is happening when the plot is steepest?


    Run it with a small number of nodes (like 10) and watch the plot. How does it
    differ from the plot you get when you run it with a large number of nodes (like
    300)? If you do multiple runs with the same number of nodes, how much does the
    shape of the plot vary from run to run? You can turn off the LAYOUT? switch to
    get results faster.


    # A.6 EXTENDING THE MODEL


    Right now the probability of any two nodes getting connected to each other is
    the same. Can you think of ways to make some nodes more attractive to connect
    to than others? How would that impact the formation of the giant component?'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# A.7 NETWORK CONCEPTS


    Identification of the connected components is done using a standard search algorithm
    called “depth first search.” “Depth first” means that the algorithm first goes
    deep into a branch of connections, tracing them out the way to the end. For a
    given node, it explores its neighbor’s neighbors (and then their neighbors, etc.)
    before moving on its own next neighbor. The algorithm is recursive, so eventually
    all reachable nodes from a particular starting node will be explored. Since we
    need to find every reachable node, and it does not matter what order we find them
    in, another algorithm such as “breadth first search” would have worked equally
    well. We chose depth first search because it is the simplest to code.


    The position of the nodes is determined by the “spring” method, which is further
    described in the Preferential Attachment model.


    # A.8 NetLogo FEATURES


    Both nodes and edges are turtles. Edge turtles have the “line” shape. The edge
    turtle’s “size” variable is used to make the edge be the right length.


    Lists are used heavily in this model. Each node maintains a list of neighboring
    nodes. Lists are also used in the procedure that identifies the components.


    # A.9 RELATED MODELS


    See other models in the Networks section of the Models Library, as Preferential
    Attachment.


    See also Network Example, in the Code Examples section.


