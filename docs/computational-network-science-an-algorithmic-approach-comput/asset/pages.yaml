    Unlike physical data of natural science, social science data are constructed by
    meanings, motives, definitions, and classifications. This means that the production
    of social science data involves a process of interpretation. During the interpretation
    processes, social scientists construct distinct types of data. Each data type
    requires appropriate distinct methods of analysis. The principal types of data
    include *attribute data* and *relational data.*


    Attribute data correlate attitudes, opinions, and behavior of agents that are,
    respectively, regarded as properties, qualities, or characteristics,'
