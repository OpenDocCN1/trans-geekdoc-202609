  md: "# Computational Network Science: An Algorithmic Approach\n\nMany algorithmic\
    \ improvements and optimizations are possible such as the use of dynamic programming\
    \ techniques. Clique percolation method (CPM) is a strategy for discovering overlapping\
    \ communities (Palla et al., 2005), even CPM is computationally intractable. A\
    \ key concept is reachability among nodes where there is a path between them.\
    \ There are many other community concepts as lambda sets (Cross and Parker, 2004),\
    \ k-Clique is a maximal subgraph in which the largest geodesic distance between\
    \ any two nodes (defined in the network) is not larger than k. k-Club, which is\
    \ a subclass of k-cliques, which restricts the geodesic distance not larger than\
    \ k. A subgraph $G_s(V_s, E_s)$ is a $\\gamma$-dense (i.e., quasi-clique) iff\
    \ $E_s / |(V_s-1)/2| \\ge \\gamma$. When $\\gamma=1$, $\\gamma$-dense is the same\
    \ as clique. Nodes are structurally equivalent if for any node $v_k \neq v_i$\
    \ and $v_k \neq v_j$, $e(v_i, v_k) \\in E$ iff $e(v_j, v_k) \\in E$.\n\nA commonly\
    \ used similarity measure such as Jaccard (Equation 6.7) can be used to find a\
    \ group of similar nodes in a community:\n\nJaccard(v_i, v_j) = \\frac{\\N_i \\\
    cap \\N_j}{\\N_i \\cup \\N_j} = \\frac{\\sum A_{ik} A_{jk}}{\\|N_i| + |N_j| -\
    \ \\sum A_{ik} A_{jk}} (6.7)\n\nThere are techniques available for crawling a\
    \ node to find a set of most similar nodes from an initial node (Clauset et al.,\
    \ 2004; Clauset, 2005). This crawl can be performed based on maximizing local\
    \ modularity shown in Figure 6.21 (Clauset, 2005).\n\n+   1. add v0 to C\n2. add\
    \ all neighbors of v0 to U\n3. set B = v0\n4. while |C| < k do\n5. for each vj\
    \ ∈ U\n6. compute ΔRj\n7. end for\n8. find vj such that ΔRj is maximum\n9. add\
