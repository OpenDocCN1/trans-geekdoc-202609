    $\forall t \in T, l_1, l_2 \in L, P(t, l_1) \geq 0 \cap C(t, l_2) \geq 0 \Rightarrow
    l_1 = l_2 \rightarrow Transit(t, l_1, l_2) = \emptyset$


    The Transit() function specifies the flow rate among nodes of the network. If
    we could specify the maximum flow between all pairs of nodes in the network, we
    could discover network capacity for transit using the standard graph theory network
    algorithm, for example, the Ford-Fulkerson algorithm (Kleinberg and Tardos, 2005).
    Transit/flow rates incur a cost corresponding to the amount of flow that needs
    to be paid by the pair of a sender and a receiver. It may be beneficial to share
    the transmission cost with neighbors, who form game theoretic coalitions that
    will be discussed in Chapter 3.


    In many scenarios, there is a need for intermediaries to facilitate transfer of
    commodities from producers to consumers. For simplicity, we assume intermediaries
    to be uniform handlers, who are neither a producer nor a consumer of commodities
    they handle. In economic networks, handlers are traders (discussed in Chapter
    9). In production lines, intermediaries are dealers. In the mail carrier networks,
    intermediaries are delivery personnel. In electric networks, intermediaries are
    switches. In computer networks, intermediaries are routers.


    Handling capacity of agent i is a function of time and number of items. Let handler(t,
    I) return a delay time in i''s ability to handle I items at time t. Delay time
    of zero is on time handling. Typically, there are more handlers than items in
    transit. A property of interest is to find optimal number of handlers for the
    volume of items to be handled with no delay.'
