  md: '# 1.4.4 Game Theoretic Models


    Game theoretic model of network formation focuses on reasoning over each node''s
    connection with others. A strategy set of an agent $i$ is a set of strategies
    to connect each node in the network, is $S_i = \{s_{i1}, s_{i2}, ..., s_{ij}\}$,
    where $s_{ij}$ is a strategy to connect a node $i$ to a node $j$. Agent incurs
    a cost in a connection that is a combination of a fixed cost plus a sum of distances
    between the node and all other nodes in the network. For example, $cost(s_{ij})
    = c + \sum d(i, j)$, where $c$ is a fixed cost and $d(i, j)$ is the distance between
    nodes $i$ and $j$ and in the number of links. The cost is shared if both parties
    choose the link. Otherwise, it is incurred by one agent. Synergistic strategy
    selection will provide utility for agents who are linked.


    Each strategy will have a payoff that is utility minus the cost. The Nash equilibrium
    (Carmona, 2012) is achieved with a strategy profile (i.e., a set of links) that
    minimizes cost for all agents, and no agent has incentive to deviate from it.


    # 1.5 NETWORK MODEL GENERATORS


    In this section, we review three of the most popular models for generating artificial
    networks.


    # 1.5.1 Kleinberg''s Small-World Model


    A social network is called a *small-world network* if, roughly speaking, any two
    of people in the network can reach each other through a short sequence of acquaintances
    (Kleinberg, 2001). Milgram''s basic smallworld experiment is the most famous experiment
    that analyzed the small-problem (Milgram, 1967). The purpose of the experiment
    was to determine whether most pairs of people in society were linked by short
    chains of acquaintances. So, individuals were asked to forward a letter to a “target”
    through whom they knew on on a first-name basis.


    Watts and Strogatz (1998) proposed a small-world network model that incorporated
    the features of Milgram''s experiment. Kleinberg (2001) proposed a variant of
    Watts and Strogatz''s basic model that can be described as follows. One starts
    with a $p$-dimensional lattice, in which nodes are joined only to their nearest
    neighbors. Then adds $k$-directed long-range links out of each node $v$, for a
    constant $k$; the end point of'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# Computational Network Science: An Algorithmic Approach


    each link is chosen uniformly at random (Kleinberg, 2001). Kleinberg studied the
    model from an algorithmic perspective and showed that, with a high probability,
    there will be short paths connecting all pairs of nodes and the network will have
    the lattice-like structure. Kleinberg model does not yield a heavy-tailed degree
    distribution.


    Kleinberg (2000) showed a greedy algorithm that can find paths between any source
    and destination using O(log, n) expected edges. Kleinberg’s algorithm that will
    be used in this study is based on two parameters: the lattice size and the clustering
    exponent. Each node u has local connections, one to each of its neighbors and
    in addition one long-range connection to some node v, where v is chosen randomly
    according to the probability proportional to d⁻α, where d is the lattice distance
    between u and v and α is the clustering exponent.


    # 1.5.2 Barabási and Albert’s Scale-Free Network Generator


    Barabási and Albert (1999) discussed the features of the scale-free networks in
    detail and compare with the features of other types of networks, for example,
    small-world networks. Scale-free networks expand continuously by the addition
    of new vertices, and new vertices attach preferentially to vertices that are already
    well connected. Most of the real networks are free-scale networks, such as WWW
    and citation patterns of scientific publication, and both of them follow a power-law
    distribution (Barabási and Albert, 1999).


    Albert and Barabási (2002) showed a comparison between their model and previously
    proposed models. They state that other network models start with a fixed number
    of vertices that are then randomly connected or disconnected without modifying
    the number of vertices. However, the WWW as an example will grow exponentially
    in time by addition of any new web page. Also, other network models assume that
    the probability of connecting two vertices placed randomly is independent of the
    vertices’ degree. However, most of the real networks do not behave like that.
    They exhibit preferential attachment, that connecting two vertices is dependent
    on the vertices’ degree (Albert and Barabási, 2002).


    According to Albert and Barabási (2002), a new node is created at each time step
    and connected to existing nodes according to the'
  merge: -1
  img_proc: true
- pgno: 14
  md: '“preferential attachment” principle. At a given time step, the probability
    $p$ of creating an edge between an existing node and the new node is $[(degree(u)+1)/|E|+|V|]$.
    The algorithm starts with some parameters, such as the number of steps that the
    algorithm should iterate, the number of nodes that the graph should start with,
    and the number of edges that the new node should be attached to the preexisting
    nodes at each time step.


    The hierarchical network model (HNM) is part of the scale-free model family and
    shares its main property of yielding proportionally more hubs the nodes than by
    random network generation. HNMs are heavy-tailed, have small diameter, and have
    high clustering.


    # 1.5.3 Epstein and Wang’s Power-Law Network Generator


    Epstein and Wang (2002) have proposed a graph model that follows the steady-state
    model that results in power law by evolving a graph according to Markov process
    while maintaining constant density. The only difference between their model and
    Barabási and Albert’s model is that their model does not require incremental growth,
    whereas Barabási and Albert’s model does. Epstein and Wang’s algorithm can be
    viewed in two steps: (1) initialize a sparse graph and (2) edit Markov process.
    To generate the sparse sparse graph $G$, the algorithm randomly adds an edge between
    vertices with the probability $2m/[n(n-1)]$, where $m$ is the number of edges
    added and $n$ is the number of vertices. If the number of edges in $G$ is less
    than $m$, the algorithm starts adding edges with a probability of 0.5 until the
    graph $G$ has $m$ edges. Then, we reiterate the algorithmic steps, shown in Figure
    1.2, $r$ times on $G$, where $r$ is a model parameter (Epstein and Wang, 2002).


