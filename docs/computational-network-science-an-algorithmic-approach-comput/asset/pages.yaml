  md: '# CHAPTER 4


    # Balance Theory


    Social harmony (i.e., freedom from contention) is an important concept in social
    networks. Contention arises from implicit relationships. Simmel suggested that
    among nodes A, B, and C, if AB and AC are strong ties, BC would eventually form
    a tie, which has been termed triadic closure (Simmel, 1950; Easley and Kleinberg,
    2010). Heider formulated the ideas in his social balance theory (Heider, 1958).
    Let there be two kinds of dyadic links for like, denoted by +, and dislike, denoted
    by -. Even number of enemy links is a theory that summarizes balance theory in
    signed networks (van der Rijt, 2011). For example, with three nodes A, B, and
    C, in the following four balanced structures (S1–S4), there are even number of
    negative links and the links are enduring, that is, no need for change:


    +   - S1—AB: +, AC: -

    - S2—AB: -, AC: -, BC: +

    - S3—AB: -, AC: +, BC: -

    - S4—AB: +, AC: +, BC: +


    In contrast, the structures S5–S8 have an odd number of negative links and are
    unbalanced when some negative links may turn positive and vice versa:


    +   - S5—AB: +, AC: -

    - S6—AB: -, AC: -, BC: +

    - S7—AB: -, AC: +, BC: -

    - S8—AB: +, AC: +, BC: +


    Even number of enemy links is applicable to network cycles of any size where the
    condition of even number of negative links makes those cycles balanced (Cartwright
    and Harary, 1956). Examining the ratio of balanced cycles over the total number
    of cycles in a network might be a useful clue about network balance. It has been
    argued that even a single unbalanced cycle might undermine the entire network
    (Bonacich and Lu, 2012). Determining which relationship to alter is the idea of
    conflict resolution in networks (Bonacich and Lu, 2012).'
