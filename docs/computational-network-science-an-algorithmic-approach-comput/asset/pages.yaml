    # 7.3 SOCIAL MEDIA INFLUENCE


    As people connect via Facebook, Twitter, and Linkedin, they leave a trail of personal
    data. A large amount of the interactions are public with connections, updates,
    and media creations that are measured. It is estimated that 43% of the marketing
    data gathered on people from social media. The growth in public data has led to
    active marketing and employment analytics research. In the remainder of this section,
    we review contemporary measures of a node''s influence.


    # 7.3.1 Social Media: A Case for Facebook and Twitter


    Eigenvalue centrality (see Chapter 2 for details) is possibly the best measure
    of social media influence (Chiang, 2012). Betweenness centrality (see Chapter
    2 for details) is another possible measure of social media influence (Chiang,
    2012). Recall that node densities give rise to cluster densities (see Chapter
    2 for details). This is the basis of the following contagion theorem:


    The whole network flips to a cluster of density $1 - p$ or higher in the set of
    nonfilled nodes (Chiang, 2012).


    # 7.3.2 Klout Score


    The Klout Score measures personal influence based on the person''s ability to
    generate interaction. Every time you create content or engage the online social
    media, you influence others. The Klout Score uses data from social networks in
    order to measure the following:


    +   1. How many people you influence (i.e., reach value)

    2. How much you influence them (i.e., amplification value)

    3. How influential they are (i.e., network score)


