    # 1.3 ONLINE BIBLIOGRAPHIC SERVICES


    **DBLP** is a Computer Science Bibliography database website hosted at Universität
    Trier in Germany. It houses a large collection of published articles and offers
    capabilities for browsing and searching. The resulting database is a network of
    “author” nodes connected via coauthorship. Through citations, papers are nodes
    of a separate network of paper, and nodes and citations are the links.


    **Google Scholar** is another bibliography database website released in 2004 by
    google.com. It creates networks of authors and papers similar to DBLP.


    **Microsoft Academic Research** is an OBS (with a corresponding Windows app) that
    is supported by Microsoft.com that offers a similar service to DBLP.


    **Research Gate** is an independent privately owned online site founded in 2008
