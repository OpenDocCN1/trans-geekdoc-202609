  md: '# CHAPTER 2


    # Network Analysis


    There has been a long tradition of measuring qualities for network locations from
    both egocentric and global perspectives. This is largely addressed with quantification
    attempts in mathematical sociology under the theme of social network analysis
    (SNA) ( [Wasserman and Faust, 1994; Knoke and Yang, 2007; Golbeck, 2013; Borgatti,
    2013). There are also several popular software toolkits that perform analysis
    and visualization of social networks (i.e., sociograms) including UCINET and NodeXL.
    Snijders’ SIENA is a program for the statistical analysis of network data. The
    NSF-sponsored visualization project is Traces ([Suthers, 2011]), which traces
    the movements, confluences, and transformations of people and ideas in social
    networks.


    The aim of this chapter is to review a selective subset of SNA measures that complement
    algorithmic descriptions explained in the remainder of this book. For a glossary
    of SNA terms, readers are recommended to consult Golbeck (2013).


    We will start with egocentric (i.e., node view) measures. A degree-1 network of
    a node is the node''s degree-network and its immediate neighbors. A degree-15
    network of a node is the node''s degree-1 network and its links among immediate
    neighbors ([Golbeck, 2013). A degree-2 network of a node is the node''s degree-1
    network and all its immediate neighbors'' connections ([Golbeck, 2013). A degree-n
    network of a node is the degree-1 network of all nodes and the corresponding links
    that are no more than n links away from the starting node.


    A path is a chain (i.e., succession) of nodes connected by links between pairs
    of nodes. Two nodes are connected if and only if (i.e., iff) there is a path between
    them. A connected component is a set of nodes with connected paths among pairs
    of nodes in the set. A bridge is a link that connects two isolated connected components.
    A hub is a node with many connections. Reachability is whether two nodes are connected
    or not by way of either a direct or an indirect path of length.'
  merge: -1
  img_proc: true
