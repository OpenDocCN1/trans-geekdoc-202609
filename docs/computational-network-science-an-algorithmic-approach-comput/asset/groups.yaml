  mdcn: "\n\n# 计算网络科学：一种算法方法\n\n类别。移除的群体用 $R(t)$ 表示，是指以前被感染过但由于免疫或终止（即死亡）而被移除的个体。被移除的个体无法再次感染，也不会向他人传播疾病。\n\
    \n```\n$N(t) = S(t) + I(t) + R(t) \\quad\\ (6.3)$\n```\n\n所有个体被认为具有相等的接触概率（即感染概率），用\
    \ $\\beta$ 表示。在每个时间点 $t$，每个人都可能以等概率感染 $\\beta \\times N$ 个其他个人。感染者与易感者之间的接触比例为\
    \ $S(t)/N(t)$。因此，新感染率通过 $\\beta \\times N[S(t)/N(t)] \\times I(t) = \\beta \\\
    times S(t) \\times I(t)$ 计算得出。离开易感群体的人数等于进入感染者群体的人数。同时，每单位时间内有与感染者比例相等的个体离开该类并进入移除类（即质量作用定律）。令\
    \ $\\gamma$ 表示感染率，且恢复速度远快于模型中叠加的出生死亡尺度。因此，感染变化速率为 $dR(t)/dt = \\beta \\times S(t)\
    \ \\times I(t) - \\gamma \\times I(t)$，恢复速率为 $dR(t)/dt = \\gamma \\times I(t)$。\n\
    \nSIS 模型有许多变体，包括 SIR 模型以及数学流行病学中考虑出生和死亡的模型（Brauer et al., 2008），以及 Vynlicky 和\
    \ White (2010) 提供的模型。讨论这些模型的另一个良好来源是 Jackson (2008)。\n\n无论流行是否发生，社区都是一组具有相似属性的紧密相关且连接的实体；它也可以是大型网络中由社区组成的一部分。社区中的实体可以与其他社区交互。一个良好的社区与外部社区实体的交互较少，与内部社区实体的交互较多。网络的部分形成了称为簇的组。这些簇可以被视为社区。接下来，我们概述社区检测的过程。\n\
    \n## 6.4 社区检测\n\n为了说明社区，让我们考虑公司中的一个项目团队，该团队是一个社区，团队成员之间有交互。项目之间可能存在接口。例如，工厂的财务和控制项目团队与物料处理、销售和分发交互。\n\
