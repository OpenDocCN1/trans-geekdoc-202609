    \ new edge to the network. To repeatedly add edges, press GO.\n\nAs the model\
    \ runs, the nodes and edges try to position themselves in a layout that makes\
    \ the structure easy to see. Layout makes the model run slower, though. To get\
    \ results faster, turn off the LAYOUT? switch.\n\nThe REDO button runs the layout-step\
    \ continuously to improve the layout.\n\n# A.4 THINGS TO NOTICE\n\nThe y-axis\
    \ of the plot shows the fraction of all nodes that are included in the giant component.\
    \ The x-axis shows the average number of connections per node. The vertical line\
    \ on the plot shows where the average number of connections equals 1. What happens\
    \ to the rate of growth of the giant component at this point?\n\n# A.5 THINGS\
    \ TO TRY\n\nLet the model run until the end. Does the “giant component” live up\
    \ to its name?\n\nRun the model again, this time slowly, a step at a time. Watch\
    \ how components grow. What is happening when the plot is steepest?\n\nRun it\
    \ with a small number of nodes (like 10) and watch the plot. How does it differ\
    \ from the plot you get when you run it with a large number of nodes (like 300)?\
    \ If you do multiple runs with the same number of nodes, how much does the shape\
    \ of the plot vary from run to run?\n"
