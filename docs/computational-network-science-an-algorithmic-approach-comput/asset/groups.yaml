    # 第 11 章

    网络组织


    网络为个体（即代理）之间建立和维持关系提供了平台。最常见的关系形式是代理对之间的关系（即二元关系）。其他关系可以存在于代理与其对群体的忠诚关系之间。群体的一种特定类型是网络组织（NO），它在许多种形式中都很常见。商业组织（例如
    IBM）使用其内部版本的内部社交网络所需的时间，远早于向普通公众提供的网络（例如 Facebook），后者已经常规地支持了非正式的、长期的和短期的利益共同体。公民、志愿者和无数协会是网络组织的其他例子。个人可能与网络组织建有各种关系，包括被动成员身份、积极参与以及运营中的关键参与者。


    电子机构（E-institutions）被提用于指导组织的规范模式（Sierra and Dignum, 2001）。我们在第 9 章中建议使用社会资本对资源进行推理，这与电子机构是补充的，可以认为它们可以指导网络组织中的资源分配。然而，我们在这里的社会资本视角更多侧重于局部决策，而不是由电子机构支持的全局（即整个系统范围）决策。


    网络组织可能提供对某些无形、带有地位的资本的访问（例如社区守卫协会的精英成员），因此，可以说网络组织通过其派遣资本的能力拥有社会资本。这是整个网络组织中唯一的例外，即特定代理拥有社会资本。本章不再考虑这种类型的网络组织社会资本，以及并非直接源于网络组织的其他类型的社会资本，例如源自代理的民族、性别和阶级社会资本（Parks-Yancy
    et al., 2006）。社会资本与制度在管理资源方面存在重叠，但这种比较超出了我们目前关注的范围（Lin, 2001）。


    # 计算网络科学：一种算法方法


    与传统网络的样式化关系相比，网络的一种替代方案是考虑动态和流动的关系。一个群体可能会在松散的连接下聚集，例如没有物理实体的业务标签。由于缺乏实体的场所和资源来识别群体，这种动态网络通常被称为虚拟组织（Dziuzla-Rucinska
    et al., 1994; Potter and Bazard, 2002）。Norman 等人（2003）提供了虚拟组织的形成策略。另一种动态网络类型是，具有互补的专业知识和兴趣的群体可能会形成一个相当临时且即时的网络来为了一个短期目标，我们称之为网络化组织。通常，这些组织在开始之前缺乏协调和控制方案。事后分析揭示了偶然的、隐性的以及突发的协调协议。此类基于情境的网络化组织示例在执法案件中很常见，其中不同背景的法律和犯罪专业人员根据需要协作解决犯罪。Westaby
    (2012) 中描述了关于突发网络理论的最新观点综述。Westaby 从社会心理学角度解释了社交网络中的个体如何被激励追求目标。他开发了定性指标，考虑了推动或阻碍进展目标的社会力量。


    Westaby 将基于角色的组织图与社交网络的社会图进行对比，后者的实际通信并不遵循长长的组织图。这与动态网络图形成对比，后者的元（metas）说明了对目标追求和实现产生正负影响的个体非正式分组。目标追求者、目标阻止者、系统支持者、系统抵抗者、系统反应者、互动者和观察者是
    Westaby 提出的几种元。作为促进目标的社会力量的网络动机是追求者和支持者的函数。网络动机的反面是网络抵抗的社会力量，它是目标阻止者和支持性抵抗者的函数。网络确认和否定是批准或反对网络目标的社会力量，但尽管没有积极参与。该理论考虑了各种目标冲突。Westaby
    引入了激活水平和性能衡量以确定整体网络有效性衡量。Westaby 将叠加在网络组织上的元角色（metaroles）可视化系统非常有启发性，并有助于分析网络组织内部运行的动态过程。Webster
    对网络组织的描述无疑丰富，并阐述了网络组织的许多有趣特征。它可以实现在计算决策辅助中。然而，社会力量的衡量无法自动化，仍然具有主观性，必须主观输入。这限制了他的理论更广泛的适用性和普及。


    # 11.1 结论


    网络组织是利用互联网（包括社交媒体）来促进协作的新兴群体。这为个体之间提供了偶然的和突发的互动，超越了传统的组织框架。这是一个需要关注的新兴领域。我们预见这项技术将信息社会转变为凝聚的整体。


