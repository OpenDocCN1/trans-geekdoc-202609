    个动作。如果目标代理的添加链接得到响应，则建立双向链接（即：实现）。否则，链接是单向的（即：向性的）。如果删除链接得到目标代理的回应，则该双向链接将断开。否则，单向（即：向性的）链接将保留。由于目标代理的动作是未知的，我们可以以概率方式对链接状态的结果进行建模。


    随着每个链接的添加或删除，代理的连接性网络拓扑结构发生变化，这为代理创建一个新状态（即状态）。如果两个代理对删除的链接相互响应，它们之间将创建一个双向链接。每个代理涉及
    $I+1$ 个状态，其中 $I$ 个状态是通过 $I$ 个动作到达的。代理 $i$ 可能的 $I+1$ 个状态表示为 $M_i$，构成了一个马尔可夫状态空间，因为状态变化是动作改变链接的确定性函数。代理将重视那些赋予其更好结构属性（例如，中心性度量）的状态，$\mu_i$
    是为玩家 $i$ 的每个状态分配效用的函数。综合起来，$\langle M_i, A_i, \mu_i \rangle$ 是玩家 $i$ 的马尔可夫决策过程（MDP）（Howard，1960）。玩家
    $i$ 可以求解自己的马尔可夫过程以获得标记为 $\pi^*$ 的最优策略。由于有 $n$ 个代理且每个代理对应一个 MDP，总共有 $I \times (I+1)$
    个状态。


    同时


    ## 5.5 结论


    网络属性随时间而变化。捕捉这些变化的模型就是网络动力学模型。我们概述了建模动力学的各种方法。显然，这只是未来丰富模型的开端。


