    “优先连接”原则。在给定的时间步中，在现有节点与新节点之间创建连接的概率 $p$ 为 $[(degree(u)+1)/|E|+|V|]$。该算法从某些参数开始，例如算法应该迭代的步数、图开始时的节点数，以及每个时间步中新节点应连接到预存节点的边数。


    分层网络模型（HNM）是无标度模型家族的一部分，它与该家族共享的主要属性，即与随机网络生成相比，它产生的中心节点（hubs）比例上多于节点。HNM 具有长尾性、小直径和高聚类性。


    ## 1.5.3 Epstein 和 Wang 的幂律网络生成器


    Epstein 和 Wang (2002) 提出了一种遵循稳态模型的图模型，该模型通过根据马尔可夫过程演化图同时保持恒定的密度，导致幂律分布。他们的模型与
    Barabási 和 Albert 模型的唯一区别在于，他们的模型不需要增量增长，而 Barabási 和 Albert 的模型则需要。Epstein 和
    Wang 的算法可以看作两个步骤：(1) 初始化一个稀疏图；(2) 编辑马尔可夫过程。为了生成稀疏图 $G$，算法以 $2m/[n(n-1)]$ 的概率在顶点之间随机添加一条边，其中
    $m$ 是添加的边数，$n$ 是顶点数。如果 $G$ 中的边数少于 $m$，算法将以 0.5 的概率开始添加边，直到图 $G$ 拥有 $m$ 条边。然后，我们在
    $G$ 上重复图 1.2 所示的算法步骤 $r$ 次，其中 $r$ 是一个模型参数（Epstein and Wang, 2002）。


    ## 1.6 真实世界网络


    在本节中，我们勾勒一个通用常见交换网络的核心组件，该网络适用于包裹交付和耐用产品。为了避免供应链管理和经济网络的复杂性，我们保持该模型的简单性。令 $C$
    为商品（例如，收到的包裹或电器）的消费者集合，$P$ 为相同商品的生产者集合（例如，包裹发送者）。一个节点在不同的时间 $T$ 和位置 $L$ 可以既是生产者也是消费者（即节点）。集合
    $C$ 严格大于 $P$，并且可能完全包含它。生产者的生产速率是时间与位置的函数，表示为 $P(t, l)$。同样，消费者的消费速率是时间与位置的函数，表示为
    $C(t, l)$。在生产 $P – C$ 之后，即商品以 $Transit(t, l_1, l_2) = P(t, l_1) – C(t, l_2)$ 的速率处于运输。生产和消费的位置必须不同，即
    $l_1 \neq l_2$。如果这些位置相同，则为空：


    $\forall t \in T, l_1, l_2 \in L, P(t, l_1) \geq 0 \cap C(t, l_2) \geq 0 \Rightarrow
    l_1 = l_2 \rightarrow Transit(t, l_1, l_2) = \emptyset$


    Transit() 函数指定了网络节点之间的流量。如果我们能指定网络中所有节点对之间的最大流量，就可以使用标准的图论网络算法发现网络的运输能力，例如 Ford-Fulkerson
    算法（Kleinberg and Tardos, 2005）。运输/流量速率产生成本，该成本取决于发送者和接收者对需要支付的流量。与邻居共享传输成本可能是有益的，他们形成了博弈论联盟，将在第3章中讨论。


    在许多场景中，需要中介来促进商品从生产者向消费者的转移。为了简单起见，我们假设中介是统一的处理者，他们既不是所处理商品的生产者，也不是消费者。在经济网络中，处理者是交易者（在第9章讨论）。在生产线上，中间介是代理商。在邮递网络中，中间介是递送人员。在电网中，中间介是开关。在计算机网络中，中间介是路由器。


    代理 $i$ 的处理能力是时间与物品数量的函数。令 handler(t, I) 返回 $i$ 在时间 $t$ 处理 $I$ 个物品的延迟时间。延迟时间为零表示准时处理。通常，处理者多于运输中的物品。一个感兴趣的属性是找到针对待处理物品量的最佳处理者数量，且无延迟。


    ## 1.7 结论


    网络周围无处不在。它们是人造的或自然发生的。它们是隐性的、隐藏的、显性的或清晰的。它们可能是有形的且客观量化的，也可能是主观且难以量化的。它们都往往随时间变化，这是我们未来关于网络动态章节的主题。


