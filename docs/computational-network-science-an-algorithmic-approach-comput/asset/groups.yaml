    ## 7.2 SOCIAL LEARNING


    DeGroot assumes a society of $n$ agents, where individuals possess an initial
    ($t=0$) opinion on a singular subject, represented by a vector of probabilities
    $p(0) = (p_1(0), ..., p_n(0))$, where $p(t)$ denotes the probabilistic belief
    of agent $i$ at time $t$. Let $T$ be a matrix of interactions among agents, where
    $T_{ij}$ is the amount of weight (i.e., trust) agent $i$ places on $j$''s opinion
    at time $t$ in forming $i$''s opinion at $t+1$. We assume that agent $i$''s influence
    (i.e., trust) is limited to the sum of its peers. Therefore, the model renders
    to be stochastic. Probabilities are updated using Equations 7.4–7.6 with the Markov
    chain property:


