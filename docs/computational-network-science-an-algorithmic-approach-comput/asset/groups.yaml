    close to 1 place a low valuation on this service; $p$ denotes the subscription
    fee, and $q^x$ is the expected number of subscribers. The expected utility of
    a potential subscriber indexed by $x \in [0, 1]$ is computed with Equation 9.1.


    $\alpha > 0$ measures the intensity of network effects. Higher values of $\alpha$
    indicate that consumers place a higher value on the ability to communicate with
    the $q^x$ subscribers. In contrast, $\alpha = 0$ implies there are no network
    effects. The parameter $\beta > 0$ captures the degree of consumers'' heterogeneity
    with respect to consumers'' benefit from this service.


