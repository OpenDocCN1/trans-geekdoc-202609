    2014）。而多样性促进少数群体，社会惯俗促进从性。政治资本在很大程度上是说服他人的力量衡量（Burgmann, 2014）。民主和人权是示例领域，社会力量从西方向世界其他地区推广它们。社会资本（SC）是一种用于管理和改变关系的无形资本，例如人际信任，因
