    # 1.4.1 Random Networks


    $G(n, p)$ is a random graph model with $n$ nodes where the probability of a pair
    of nodes in being linked is denoted by $p$ (Erdős and Rényi, 1959). When $p$ is
    small, the network is sparsely connected. When $p$ is close to $1/n$, the network
    appears fully connected. When $p$ is almost 1.0, the connectivity among nodes
    is very high and the network is said to be a giant component. The spread of node
    degrees for a random graph model (i.e., degree distribution) appears binomial
    in shape. A closely related model is the random geometric graph $G(n, r)$, where
    there are $n$ nodes and the distance between a pair of nodes in the graph is less
    or equal to $r$ (Penrose, 2003). Contrary to mathematical models, real-world networks
    exhibit uneven distribution. In the power-distribution, the probability that a
    node has a degree $k$ (i.e., the number of connected neighbors) is determined
    by $P(k)=k^{-\gamma}$, where $\gamma$ is typically constrained between 2 and 3,
    that is, $2\leq\gamma\leq3$. Uneven distribution stems from preferential attachment,
    where the probability that a new node will attach to a node $i$ is $degree_{(i)}/\Sigma$;
    degree refers to the node''s neighbors. Preferential attachment is commonly found
    in nature as well as man-made networks such as an economic network (Gabaix, 2009).
    Random networks are mathematically the best-studied and well-understood models.


    # 1.4.2 Scale-Free Networks


    There is a model based on preferential attachment described by Barabasi and Albert
    (1999). In this model, a new node is created at each time step and connected to
    existing nodes according to the “preferential attachment” principle. At a given
    time step, the probability $p$ of creating an edge between an existing node $u$
    and the new node is $p=[degree(u)+1/V]$, where $V$ is a set of nodes and $E$ is
    the set of edges between nodes. The algorithm starts with some parameters such
    as the number of steps that the algorithm will iterate, the number of nodes that
    the graph should start with, and the number of edges that should be attached to
    the new node to preexisting nodes at each time step. The Barabasi model of network
    formation produces a scale-free network, a network where the node degree distribution
    follows a power-law principle. Scale-free networks produce small number of components,
    small-diameter, heavy-tailed distribution, and low clustering.'
