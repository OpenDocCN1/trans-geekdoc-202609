    SC 是通过通过链接内部的交互动态产生的。因此，网络的 SC 通过累加网络中所有链接的 SC 之和进行线性缩放。正如观察 2 所示，链接的增加与 SC 的增加成正比。拓扑结构在网络视角下被忽略，但在下一个定义的自我中心视角中被考虑。所有桥接社区都对
    SC 的过度工具性积累做出贡献（Lin, 2001）。在一般网络和从自我中心视角来看，桥接被认为对 SC 有贡献（Smith, 2008）。我们在讨论 SC
    的自我中心视图时会回到这一点。


    ## 观察 1：网络中的 SC 与网络纽结度成正比。


    网络绑定会导致网络密度和封闭性的增加，这被认为会增加资源访问（Lin, 2001）。


    ## 观察 2：团类结构的网络拓扑结构产生最高的 SC。


    观察 2 是显而易见的，因为绑定率与链接数量成正比。根据观察 1，网络中的链接数量越多（即网络的互连性越多），它积累 SC 的机会就越多。如果一个网络拥有最多的链接（即团类），它就能支持最高的
    SC。接下来，我们为 SC 定义一个自我中心视角。


    **定义：** 节点（即个体的自我中心）的 SC 是其与直接邻居链接的 SC 之和，加上其所有邻居的 SC 之和。


    这种 SC 的自我中心定义刻意反映了 Bonachich 权力指数（Bonachich, 1987）。这种巧合帮助我们利用节点的拓扑位置。具有高权力指数（即高
    Bonachich 中心性值）的定位良好的节点同样拥有高 SC。


    **观察 3：网络中权力较高的节点拥有 SC。**


    **观察 4：网络中具有桥接角色的节点拥有 SC。**


    我们将 SC 视为一个标量值，既可以被字面地累积和消耗，也可以作为信用。在网络中，SC 可能用于以任务委托的形式与他人进行交易或交换。使用 SC 进行以物交换可以限于通过之间直接链接的一对节点。或者，一个节点也可以与另一个可能没有直接链接的节点进行匿名以物交换。


    如果网络非常大且资源分布广泛，由于距离资源所有者节点较远，与资源所有者进行直接交互可能是无效的。找到代表他们提供接口的节点将是有益的。另一方面，某些资源所有者可能希望其资源能够远超直接周围环境。如果资源所有者拥有一个接口代理，以便向网络的远程部分暴露资源的可用性，将非常有用。这将在下一节中进行讨论。


    ### 10.1.1 中间人


    某些代理可能扮演中间人角色以促进其他代理之间的资源访问。最简单的中间人角色是资源所有者代理将其对资源的访问权委托给经纪人代理，我们将其命名为协调员。为了简单起见，我们假设每个资源所有者在网络中对应一个协调员，且该协调员相对于其协调的资源所有者拥有网络中最高的
    SC。资源所有者的所有访问策略都由协调员处理。


    另一种类型的中间人是，若干具有低 SC 的代理被确定为一个代表性经纪人，其任务是代表他们确保对特定资源的访问权限。代理与其代表人之间必须具有高 SC。代表人必须努力对目标资源所有者建立强大的
    SC，以便有能力向其成员交付资源访问。代表人代理必须不断审查资源所有者的资源策略，在适用时审查协调员的策略。在非常大的网络中，一旦确定了协调员和代表性经纪人代理，大多数交互发生在
    (a) 代理与代表人之间，以及 (b) 协调员与资源所有者之间。下一节提供了使用 SC 进行资源访问的初步高级概述。为了简洁起见，省略了细节，并计划在未来的工作中进行许多变体。


    ### 10.1.2 使用社会资本进行资源访问的基本协议


    为了说明 SC 在资源访问中的作用，本节介绍了针对资源所有者、资源寻求者和经纪人代理的初步协议。图 10.2 描了一个使用 SC 进行资源寻求策略的简单算法。寻求资源的代理首先尝试访问其邻居，然后从远程所有者处访问。对于远程所有者，咨询代表性经纪人代理以代表他们寻找资源。如果寻找邻居和代表人未能获得访问，代理将放弃寻求资源。激活
    SC 会消耗寻求者的 SC，并等量增加资源所有者或代表人的 SC。


    1. 对于所有类型为 R 的相邻资源所有者，

    2. 如果对它们的 SC 高于 R 的意愿共享阈值，激活 SC 并获取资源，否则，

    3. 对于所有代表性经纪人代理，如果对它们的 SC 高于 R 的意愿共享阈值，提出 SC；

    4. 如果接受 SC 并获取资源，否则

    5. 结束循环；结束失败；终止。


    图 10.2. 使用社会资本的资源寻求算法。


    ![](img/b8728314847e4125cdf70bea9fd5ba5_88_0.png)


    总体而言，最早提出的最高 SC 将获得资源访问权限，相应的 SC 将被收集供以后使用。代表经纪人从其客户处收集提案，并寻求与可能接受资源访问投标的协调员交易。协调员代理也从代表代理和其他那里收集提案，以提供其管理的资源的访问。我们假设经纪人代理收取微不足道的
    SC 作为其服务费用。为了简洁起见，我们在基本协议中忽略了费用，以专注于资源的交互。


    ### 10.2 结论


    我们概述了网络上提供的各种资本。节点可能希望访问、影响、行使权力和控制资本。这是一个很大程度上未被探索的话题，我们的阐述是对建立有用模型的号召。我们描绘了一个
    SC 模型，以促进缺乏这些资源的节点对物理资源的访问。代理之间反复的社会互动导致了 SC 的发展，SC 被用作资源访问的衡量。我们讨论了代理相对于代理中心点的位置如何赋予他们不同水平的
