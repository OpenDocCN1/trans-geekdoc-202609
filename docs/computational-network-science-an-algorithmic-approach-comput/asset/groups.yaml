    - 2. 为一个具有历史意义的社会网络（例如总统大选）绘制时间图。

    - 3. 设计一个 $2 \times 2$ 的协调游戏概率矩阵（例如，斗鸡游戏）。将矩阵视为马尔可夫链并预测状态的长期分布。


    ## 第 6 章

    ### 扩散与传染


    本章探讨了网络中泛化变化的现象，例如（a) 偏好的传播、（b) 渗透、（c) 疾病的流行（即传染）以及 (d) 社区组成。本章的其余部分将顺序回顾这四类。


    ## 6.1 人口偏好扩散


    Schelling (1971) 的居住社区隔离模型是关于网络泛化变化的最早正式研究报告。Schelling 指出，对邻居是同种族裔的微小偏好会导致网络中出现广泛的隔离。他通过在网格纸上使用硬币，通过在单元格中以不同的模式放置分币和镍币来证明这一理论。如果硬币的组合不令人满意，则移动硬币。对于每个有色的单元格，如果相邻单元格中颜色不同的比例超过
    33%，该单元格将移动到另一个选定的单元格。你可以使用 Chris Cook 的在线演示程序或 NetLogo 模型运行该模型。更多细节和出现的模式可见 Hatna
    和 Benenson (2012)。令 $N$ 为人口规模，$p$ 为网络中每个个人与另一个人存在联系的均匀随机概率。忽略重复连接。由于 $p$ 的值很小且
    $N$ 的值很大，$PN$ 代表个人与网络中其他人间接连接的概率，即通过个人的主要链接建立的二手联系。预期（即平均）可到达的人数如公式 6.1 所示。（注：原文此处有大量重复，已去重）。

