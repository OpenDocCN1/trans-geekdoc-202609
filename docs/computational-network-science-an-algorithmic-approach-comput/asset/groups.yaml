    Mining. ACM Press, New York, NY.

    - Kumar, R., Novak, J., Raghavan, P., Tomkins, A., 2003. On the evolution of blog
    space. The 12th Annual World Wide Web Conference. Budapest, Hungary, New York:
    ACM Press, New York, NY.

    - Newman, M., 2004. Detecting community structure in networks. Eur. Phys. J B
    38, 321–330.

