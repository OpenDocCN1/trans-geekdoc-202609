    are influenced by their peers in registering for the course. Student A is already
    registered for the course. The rest of the students are not registered. E is influenced
    by A and D. However, D is not active, so E is influenced by A only. E’s threshold
    value is 0, which is less than the influence (edge) value of 0.2 from A. So E
