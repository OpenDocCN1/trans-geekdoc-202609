    ## 6.5 社区相关性与影响


    给定一个网络，我们可以统计连接具有不同值的节点的边比例。然后，我们将其与在属性和社交连接独立的情况下，此类连接的预期概率进行比较。如果这两个值显著不同，我们得出该属性与网络*相关*的结论。如果具有不同属性值的组内节点边比例显著小于该网络中随机连接的预期概率，则存在*相关性*的证据。社交网络中，相邻节点的行为和属性之间存在相关性。对相关性的解释是同质性（McPherson
    et al., 2001）以及在第7章中讨论的*影响*。


    ## 6.6 结论


    本章探讨了网络中泛滥变化的现象，这些现象以 (a) 偏好的传播、(b) 感知、(c) 疾病（即传染）以及 (d) 社区组成为例。灵感来自渗透模型、流行病模型以及数学社会学对社区检测的贡献。网络社区检测仍然是一个演进领域。由于网络呈指数增长并变得复杂，许多研究仍在进行，存在许多问题。


