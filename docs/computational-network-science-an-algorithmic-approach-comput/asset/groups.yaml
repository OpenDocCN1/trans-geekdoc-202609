    # Networks


    ![](img/b8728314847e4125cdf70bea9fd5b5a5_6_0.png)


    Fig. 1. A network taxonomy.


    (e.g., trust). Relational networks are inert and merely reflect juxtosition of
    nodes. All CENs are exchange networks.


    Once a network emerges, we can explore interactions within the network. Strategic
    interactions involve reasoning and deciding over selection of strategies. They
    can be modeled by game theory that will be our main focus in Chapter 3.


