    et al., 2000）。内聚社会资本这一术语仅在个人语境下有意义，个体可能利用其在网络中的内聚衡量身份来获取可获得的资本形式。桥接是网络的另一个常见属性，暴露于桥接特征的个体可以获得可能位于网络远处的资本，这可以被称为桥接社会资本。要说“社会资本存在”，我们必须识别资本和受益者。事实上，我们考虑的是特征社会资本（FSC）的泛化，其中
    F 是网络特征。网络特征的示例包括代理聚集系数、内聚、桥接和领导力。在线组织提供了一个代理能够体验内聚和桥接社会资本的网络（Ellison et al.,
    2007）。一方面，社会资本可能反映了节点在网络中当前位置相对于节点在网络中所重视的资本的优点。如果节点 A 的好邻居 R 拥有宝贵资源，A 将拥有简单的位置社会资本，并有动力与
    R 保持强有力的联系以获取 R 的资源。A 距离 R 越远，A 体验的位置社会资本就越少。另一种位置社会资本的形式是节点作为某些资源与渴望这些资源的节点集之间的中间节点（即瓶颈）。各种位置社会资本可以通过各国相对于世界自然或政治资源的地理位置来体现。关于社会资本的另一个视角是作为动员或限制资源的社会操纵能力，此时位置性并不那么相关。拥有资源或靠近资源源的节点可能会实施向他人发放或囤积（即分享或拒绝）资源的政策。对于资本所有者来说，社会资本是他们对其资源访问的操纵能力。对于资本非所有者，这种语境下的社会资本是他们与资本所有者交易以获取资源的能力。国家贸易政策体现了这种资源操纵。社会资本有几个主要元素，这些元素之间存在比例关系。


    从拓扑上来说，高内聚率为社会资本的互动和增长提供了更多机会。然而，网络结构本身不足以确定社会资本。我们必须检查吸引或排斥个体的社会流的内容和倾向。在单个链路层面上，链路中社会流的性质导致社会资本的积累。社会流可以是友善且积极的，也可以是负面且缺乏善意的。正向社会流是一种体现友谊和在感兴趣的话题上立场一致的互动。正向流导致社会资本的净收益，而负向流则导致社会资本的损失。除了社会流，二元关系蕴含或促进信任（Fukuyama,
    1995）。信任支持社会资本，而不信任则侵蚀社会资本。如果双方互动的话题是共同感兴趣的，那么该链路对社会资本有积极贡献。总之，流、信任和链路是作为社会影响的比例决定因素的链路属性。


    定义（链路影响）：链路中的社会影响通过 (a) 社会流正向值的积累、(b) 信任和 (c) 共同话题的丰富交流来衡量。为了简单起见，我们建议对这三个属性等等对待。


    下文中，考虑 N 个代理和 M 种不同资源。假设有一个节点 i，它与拥有资源的节点 R 有直接链路。当一对代理之间的影响很高时，节点的邻居资源所有者将依靠他们的影响来获取资源。当
    i 到最近的替代资源的距离 $d$ 较小时，它比距离较远时更愿意分享。事实上，分享的意愿可以建模为与地线距离的平方倒比成比例，即 $1/d$。


    当一对节点具有分享资源的先验历史时，他们之间未来分享资源的概率也会相应增加。当资源所有者可以获得替代资源时，他或她更愿意分享自己的资源。资源稀缺在替代资源中起着很大作用。其他资源所有者的预期报答可以用
    $1/(M-1)$ 来建模。我们将这些因素包含在接下来定义的资源分享政策中。


    # **定义（与邻居资源分享政策）：** R 与 i 分享其资源的意愿取决于以下属性：


    - (a) i 和 R 之间链路的影响必须大于预定义的阈值。

    - (b) R 与最近替代资源持有者的距离较小。

    - (c) i 和 R 之间存在资源分享的先验平衡。

    - (d) R 从其他资源所有者处有非的预期资源。


    拥有资源的直接后果是他人对资源的依赖。根据 Emerson (1962)，依赖是权力的对立。因此，资源所有者对他人拥有社会权力。代理对囤积资源的兴趣是代理分享资源意愿的互补。


    接下来，我们考虑一种远程访问资源的策略策略。假设有一个节点 i，它与拥有资源的节点 R 没有直接链路。当 R 与通往 i 的所有最短路径上的所有链路的影响之和很高时，R
    将愿意与 i 分享其资源。当一对节点具有分享资源的先验历史时，他们未来分享资源的概率会很大。当 R 到最近替代资源的地线距离 $d$ 较小时，它比距离远时更愿意分享（这类似于邻居的情况）。当
    R 可以获得替代资源时，代理可能有高报，并更愿意分享自己的资源（这类似于邻居的情况）。


    # **定义（远程节点所有者分享政策）：** R 与远程节点分享其资源的意愿取决于四个属性：


    - (a) i 和 R 之间所有最短路径的影响必须大于预定义的阈值。

    - (b) R 与最近替代资源持有者的距离较小。

    - (c) i 和 R 之间存在资源分享的先验平衡。

    - (d) R 从其他资源所有者处有预期报答。


    分享的反面是拒绝资源（即囤积），我们将其作为分享的互补概念。接下来提供几种常见的资源拒绝政策。


    # **定义（与邻居囤积政策）：** R 的囤积程度是 R 分享资源意愿的互补。


    # **定义（非邻居囤积政策）：** 如果 i 和 R 之间存在弱影响链路，R 拒绝与远程节点 i 分享其资源。


    # **定义（独占囤积政策）：** 如果 R 知道 i 可以访问同行资源所有者，则 R 拒绝分享其资源。


    # **定义（竞争性囤积政策）：** R 拒绝与同行资源所有者分享资源。


    为了节点获取资源，必须与资源所有者互动，这在下一个定义中。


    # **定义（资源获取）：** 节点 i 对于资源所有者 R 的资源 R 获取是指 R 与 i 分享资源的意愿。


    我们现在可以定义节点在网络中获取资源的总水平，这在社会资本的概念中。

