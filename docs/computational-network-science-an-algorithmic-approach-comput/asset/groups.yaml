    # 网络


    ![](img/b8728314847e4125cdf70bea9fd5b5a5_6_0.png)


    图 1. 网络分类法。


    （例如，信任）。关系网络是惯性的的，仅仅反映了节点的并置。所有的核心交换网络（CENs）都是交换网络。


    一旦网络形成，我们就可以探索网络内部的交互。策略交互涉及到对策略选择的推理和决策。它们可以通过博弈论进行建模，这将是我们第 3 章的关注重点。


    网络理论是一组算法，它将网络拓扑结构与结果之间的关系代码化，这些关系对网络居民具有重要意义。目前正有一股运动在用“网络科学”这一术语对网络现象进行编码。这些现象和显著算法将贯穿本书进行讨论。


    在线社交网络服务（OSNS）在人之间创建合成网络。使用 OSNS 的主要激励是获得社会权威（即合法性），这是一种社会权力的形式，通常不是多样性的衡量标准。社交网络中的社会权威是针对群体和特定主题的。因此，社会权威是一个相对衡量标准，而非绝对量。在第
    1.2 节中，我们回顾了快速增长列表中流行的 OSNS（Khare, 2012）。由于它们提供了在虚拟社区中创建、共享和/或交换信息与信息的平台，OSNS
    被视为社交媒体的媒介。社交媒体上存在量化工具，如 Klout，它提供用户评分（即 1 到 100 之间的数字）。Klout 称为“影响力”，衡量用户通过 OSNS
    影响其他人的能力。这一衡量标准对于在线产品营销非常有价值。


    在第 1.3 节中，我们回顾了几个存储已发布文章的流行在线文献服务（OBS）。我们在第 1.4 节回到通用网络模型。随后在第 1.5 节中将对流行的合成网络生成模型进行回顾。附录中提供了完全实现的
    NetLogo 模型（即用于使用的代码和配套描述），用于网络生成模型和分析。


    # 1.2 在线社交网络服务


    Facebook 是一种连接人、组织、朋友以及共同工作或生活的人的 OSNS。Facebook 网络中的节点可以是个人，也可以是组织。其中一些可能是与现实世界人类合成的。Facebook
    连接的主要工具是“友谊”。Facebook 主要用于个人和娱乐性功能。因此，它填补了传统家庭和朋友之间物理和心理分散所造成的社交空隙。它还作为一种创建原本不会存在的关系的媒介。


    Facebook 的一个名为“共享”的功能允许对信息的传播进行调整（即选择观众）。“共享”用于限制谁可以查看帖子和照片。这是一个三步过程：(1) 表明你是谁（即标记），(2)
    告诉你在哪里（即在帖子中添加位置），以及 (3) 管理你发布地点的隐私权限（即行内观众选择器）。共享让用户控制其信息的扩散，这反过来可以产生社会权威的衡量。Facebook
    的另一个类似的功能（如点赞）提供了一种方向性关系（即纽带、连接和链接），它为该项目增加了信誉度，并与背书者的信誉（即权威）成正比。


    Twitter 是一种促进信息广播（即推文）的 OSNS。Twitter 连接的主要工具是人与之间思想的显式对齐（即关注）。小型或大型团体可以使用 Twitter
    来形成众包。例如，在小网络中，当一个家庭对他们的旅行行程保持组织化时，会产生不同的意见。在大型社交项目（如抗议）中，可以进行规划。Twitter 可以与他人进行半匿名协作。Twitter
    的话题标签（即 #）是一个用于标记主题的功能。任何人都可以引入或重用标签来吸引注意力。例如，在推文中添加 #flight1549 标记了关于“1549 号航班”的推文。这种标签标记促进了与特定主题相关的搜索。使用特定标签的人在他们标签的背景下形成了一个隐性网络。这一功能已用于商业营销和社交行动的匿名协调。标签的潜在用途范围是巨大的，它们已被
    Facebook 等其他 SNS 采用。一方面，Twitter 可用于犯罪或异见的潜在组织。另一方面，它可以预测并缓解对法律执法的违反行为。由于 Twitter
    提供了意见共享的民主化和传播的平等机会，它被视为一种社会平衡器，并令压迫性制度（例如政府政权）感到恐惧。Twitter 的社会权威由三个部分组成：(1) 用户最后百条推文的转发率，以及
    (2) 基于用户个人资料数据训练的转发模型。标记某人会让更多人看到 Twitter ID，而私信只是在他们的收件箱里放入垃圾邮件，这通常是不受欢迎的。像 Klout.com
    等网站衡量你的影响力，例如你在 Twitter 上有多活跃，以及你被标记了多少次。Twitter 的列表是将他人组织成组的方法。当你点击列表时，你将检索该组内所有用户的推文流。根据经验，如果你想与
    Twitter 建立关系，你应该阅读其他推文，转发优质内容，并关注关注的关键词和兴趣。如果你希望被转发，建议相同。


    LinkedIn 是一种为职业身份管理提供在线论坛的 SNS。LinkedIn 连接的主要工具是链接想要互相支持的人（连接）。LinkedIn 允许人们对特定技能进行弱形式的背书。这创建了从背书者到被背书者更强的方向链接。被背书者的个人资料通过
    LinkedIn 的背书和推荐获得社会权威。当然，获得的权威与背书和推荐者的权威成正比。


    **Pinterest** 是一种允许用户创建和管理基于主题的图像集的 OSNS。Pinterest 中的“转转钉”（*Repining*）是创建社会权威的功能。


    **Whisper.sh** 起于 2011 年，是一个私有的移动 OSNS，允许发布包括照片在内的匿名帖子。它允许他人点赞帖子，从而创建一个以帖子为节点和方向性链接的网络。由于用户是匿名的，生成的网络是隐性的。


    # 1.3 在线文献服务


    **DBLP** 是一个托管在德国特里尔大学的计算机科学数据库网站。它拥有大量已发表文章，并提供浏览和搜索功能。生成的数据库是一个通过合著关系连接的“作者”节点网络。通过引用，论文是另一个独立的论文网络节点，而节点和引用就是链接。


    **Google Scholar** 是由 google.com 在 2004 年发布的另一个文献数据库网站。它创建了与 DBLP 相似的作者和论文网络。


    **Microsoft Academic Research** 是由 Microsoft.com 支持的 OBS（带有相应的 Windows ），提供与 DBLP
    类似的服务。


    **Research Gate** 是一个建立于 2008 年的独立私有在线网站，供科学家和研究人员共享论文、提问和寻找合作者。一方面，它是一个 OBS，尽管它比竞争对手小得多。另一方面，它是面向专业人士的
    OSNS。


    # 1.4 通用网络模型


    在本节中，我们回顾了四个最流行的通用网络模型。与本节中的描述性模型相比，第 1.5 节将提供人工生成网络的算法。


