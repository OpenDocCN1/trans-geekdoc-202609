    在接下来的章节中，我们将简要概述局部经济变化对更广泛的经济网络的影响。


    ## 9.1 网络效应


    在经济网络中，个人的选择对他人的影响存在直接和间接的影响，反之亦然，这被经济学家称为*外部性*。例如，生产者的利润和消费者的效用与使用相同技术的生产者和消费者的数量成正比。一个著名的外部性模型是电信业务订阅（Rohlich,
    1974）。令潜在订阅者的索引为 $x$，其中 $0 \leq x \leq 1$。索引 $x$ 值小的消费者对订阅的价值很高，而索引 $x$ 接近 1 的消费者对该服务的估值较低；$p$
    表示订阅费，$q^x$ 是预期订阅者数量。索引为 $x \in [0, 1]$ 的潜在订阅者的预期效用通过公式 9.1 计算。


    $\alpha > 0$ 衡量网络效应的强度。$\alpha$ 值越高，表示消费者认为与 $q^x$ 个订阅者通信的能力越高。相比之下，$\alpha =
    0$ 意味着没有网络效应。参数 $\beta > 0$ 捕捉了消费者在从该服务的收益方面的异质性。


    ```

    $U(x) = \begin{cases} (1-\beta x)\alpha q^x - p, & \text{if he or she subscribes}
    \\ 0, & \text{if he or she does not subscribe} \end{cases} \quad (9.1)$

    ```


    外部性存在于有限的环境中。考虑图 9.2 所示的双人游戏，其中有四种采纳和避免变化的策略。


    | | 采纳 (Adopt) | 避免 (Avoid) |

    |---|---|---|

    | I | 采纳 $\alpha,\alpha$ | 避免 $\gamma,\delta$ |

    | | 避免 $\delta,\gamma$ | $\beta,\beta$ |


    图 9.2. 采纳新技术的经济决策游戏收益矩阵。如果 $\alpha > \delta$ 且 $\beta > \gamma$，当玩家采纳时，每个玩家都会获得高收益；因此存在网络外部性。


    该游戏有两个纳什均衡：采纳, 采纳)和(避免, 避免)。如果 $\alpha > \beta$，结果(采纳, 采纳)帕累托优于结果(避免, 避免)。这被称为*过度惯性*（Farrell
    and Saloner, 1985）。如果 $\alpha < \beta$，结果(避免, 避免)帕累托优于结果(采纳, 采纳)，被称为*过度动量*。然而，在存在顺序决策的情况下，两者都不是子博弈均衡。对于价格竞争（即伯兰德游戏）或数量竞争（即柯诺特游戏），也可以进行类似的分析（Jackson,
    2008）。在双边市场中，需求和供给溢出为买家和卖家创造了外部性（Rysman, 2009）。当客户与组件对应时，外部性被*认为是直接的*。然而，在大多数经济网络中，外部性是*间接的*。Nicholas
    Economides 博士维护的 NYU 在线提供了更多信息。


    ## 9.2 结论


    无论是与朋友、同事还是陌生人，经济网络都是日常生活中常见的交换网络。经济网络在广告领域有明确，例如销售 Google 广告位（Chiang, 2012）。它在政策分析中也有潜在的应用。为了理解新政策或变更政策的影响范围和深度，需要探索网络效应。


