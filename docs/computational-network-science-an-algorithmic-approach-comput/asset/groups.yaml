    “preferential attachment” principle. At a given time step, the probability $p$
    of creating an edge between an existing node and the new node is $[(degree(u)+1)/|E|+|V|]$.
    The algorithm starts with some parameters, such as the number of steps that the
    algorithm should iterate, the number of nodes that the graph should start with,
    and the number of edges that the new node should be attached to the preexisting
    nodes at each time step.


    The hierarchical network model (HNM) is part of the scale-free model family and
    shares its main property of yielding proportionally more hubs than the nodes than
    by random network generation. HNMs are heavy-tailed, have small diameter, and
    have high clustering.


    ## 1.5.3 Epstein and Wang’s Power-Law Network Generator


    Epstein and Wang (2002) have proposed a graph model that follows the steady-state
    model that results in power law by evolving a graph according to Markov process
    while maintaining constant density. The only difference between their model and
    Barabási and Albert’s model is that their model does not require incremental growth,
    whereas Barabási and Albert’s model does. Epstein and Wang’s algorithm can be
    viewed in two steps: (1) initialize a sparse graph and (2) edit Markov process.
    To generate the sparse sparse graph $G$, the algorithm randomly adds an edge between
    vertices with the probability $2m/[n(n-1)]$, where $m$ is the number of edges
    added and $n$ is the number of vertices. If the number of edges in $G$ is less
    than $m$, the algorithm starts adding edges with a probability of 0.5 until the
    graph $G$ has $m$ edges. Then, we reiterate the algorithmic steps, shown in Figure
    1.2, $r$ times on $G$, where $r$ is a model parameter (Epstein and Wang, 2002).


    ## 1.6 A REAL-WORLD NETWORK


    In this section, we sketch essential components of a generic, commonplace exchange
    network applicable to package delivery and durable products. We are keeping this
    model simple in order to avoid complexities of supply chain management and economic
    networks. Let $C$ be a set of consumers of a commodity (e.g., received packages
    or appliances) and $P$ be a set of producers of the same commodity (e.g., package
    senders). A node can be both a producer and a consumer at different times T and
    locations L (i.e., nodes). The set C is strictly larger than P, and it may subsum
    it entirely. The production rate of a producer is a function of time and location
    denoted by P(t, l). Similarly, the consumption rate of a consumer is a function
    of time and location denoted by C(t, l). After production P – C, that is, commodities
    are in transit at the rate Transit(t, l₁, l₂) = P(t, l₁) – C(t, l₂). Locations
    of production and consumption must be distinct, that is, l₁ ≠ l₂. If these locations
    are the same, null is:


    $\forall t \in T, l_1, l_2 \in L, P(t, l_1) \geq 0 \cap C(t, l_2) \geq 0 \Rightarrow
    l_1 = l_2 \rightarrow Transit(t, l_1, l_2) = \emptyset$


    The Transit() function specifies the flow rate among nodes of the network. If
    we could specify the maximum flow between all pairs of nodes in the network, we
    could discover network capacity for transit using the standard graph theory network
    algorithm, for example, the Ford-Fulkerson algorithm (Kleinberg and Tardos, 2005).
    Transit/flow rates incur a cost corresponding to the amount of flow that needs
    to be paid by the pair of a sender and a receiver. It may be beneficial to share
    the transmission cost with neighbors, who form game theoretic coalitions that
    will be discussed in Chapter 3.


    In many scenarios, there is a need for intermediaries to facilitate transfer of
    commodities from producers to consumers. For simplicity, we assume intermediaries
    to be uniform handlers, who are neither a producer nor a consumer of commodities
    they handle. In economic networks, handlers are traders (discussed in Chapter
    9). In production lines, intermediaries are dealers. In the mail carrier networks,
    intermediaries are delivery personnel. In electric networks, intermediaries are
    switches. In computer networks, intermediaries are routers.


    Handling capacity of agent i is a function of time and number of items. Let handler(t,
    I) return a delay time in i''s ability to handle I items at time t. Delay time
    of zero is on time handling. Typically, there are more handlers than items in
    transit. A property of interest is to find optimal number of handlers for the
    volume of items to be handled with no delay.


    ## 1.7 CONCLUSIONS


    Networks are abundantly around us. They are man-made or naturally occur. They
    are implicit, hidden, explicit, or articulated. They might be tangible and objectively
    quantified, or they might be subjective and difficult to quantify. They all tend
    to change in time, which is the subject of our future chapters on network dynamics.


