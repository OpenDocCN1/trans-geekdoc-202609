    \ |\n\n![](img/b8728314847e4125cdf70bea9fd5b5a5_1_0.png)\n\n# 前言\n\n我们需要大师和海量图书馆的时代已经过去了。互联网为所有人提供了便捷快捷获取知识的途径。本书对传统课堂中经过测试的显著知识提供了必要且充分的描述。本书将数学社会学、博弈论、政治科学和生物网络等不同学科的基础知识交织在一起。\n\
    \n网络科学是一门新学科，探索跨越自然界和人造世界的连接种群中共同的现象。从动物到商品交易，网络提供了个体和群体之间的关系。分析和利用连接提供了洞察和说服的工具。该领域的研究在很大程度上集中于意见属性。其推动动力是由于需要检查计算过程以实现枯燥分析的自动化，以及将网络信息用于在线迁移。一旦上线，网络意识将有助于提高公共安全，并为所有人提供更优质的服务。\n\
    \nJackson (2008) 提供了关于经济和社会网络的基础概念集合。Easily 和 Kleinberg (2010) 包含了对通用网络的数学化处理。本书填补的互补性空白是“算法方法”。我为网络科学的顶尖水平提供了一个快速的介绍。书中提供了对开创性和当代发展的参考文献。本书使用了数学逻辑严密性和当代计算洞察。它还号召对开放问题进行进一步研究。\n\
    \n读者将发现对网络科学的广泛处理以及对近期现象的回顾。计算学科的高年级本科生和专业人士将发现足够用于实施和实验的方法论和流程。本书可以作为社交媒体和网络分析、计算课程的教学材料。本书在网络科学方面进行了广泛处理，并对近期现象进行了回顾。这本书可作为社交媒体和网络分析课程的教学材料。\n\
    \n（注：Morgan Kaufmann 出版社，此处at the end）提供了用于实施和实验的方法。\n\nHenry Hexmoor\nCarbondale,\
    \ IL\n\n# 参考文献\n\n- Borgatti, S., Everett, M., 2013. *Social Networks*. SAGE Publications.\n\
    - Watts, D., Kleinberg, J., 2010. *Networks*. Cambridge University Press. (注：此处原文可能误为Easily，通常应为Watts)\n\
    - Golbeck, J., 2013. *Social Network Analysis*. Morgan Kaufmann.\n- Jackson, M.,\
    \ 2008. *Linked Social Networks*. Princeton University Press.\n\n# 第一章 网络无处不在\n\
    \n## 1.1 引言\n\n广义地说，网络是节点（例如，人类）的集合，在某些网络中，关系是物理性的，而在某些显性网络中，它们是数字性的。在某些隐性网络中，个体对关系是无知的，而在某些显性网络中，它们是熟悉的。在某些隐性网络（如亲和性）中，关系是物理性的。例如生物神经，Seung\
    \ (2012) 描述了连接组。Moffett et al. (2010) 描述了生物网络。蚁社会是一个网络示例。Reingold (2000) 描述了人类关系。Nielsen\
    \ (2012) 描述了社会和政治关系模型，社会和政治关系至关重要。Jackson (2003) 描述了经济关系模型，例如买家、卖家和中间介。除了自然网络，还有许多合成网络。照片网格是合成网络的一个例子。Jornet\
    \ 和 Pieroben (2011) 尝试为纳米机器进行网络应用。\n\n网络的一大类是复杂的工程网络（CEN），其拓扑结构既不是规则的也不是随机的。CEN\
    \ 的例子包括从网络攻击的秒级到温室气体排放年级。CEN 中的数据和控制流必须通过跨越数千里的连接进行管理。\n\n一些合成网络类别包括 CEN 是故意创建的。在这里，我们列出了六类：\n\
    \n1. 通过社交网站和服务的社交网络\n2. 内议阁和政治委员会的政治网络\n3. 包括计算机以及它们如何通过局域、广域和无线链路进行通信的计算机网络（例如传感器网络）\n\
    4. 节点交换机和相应路径的电信网络\n5. 电网\n6. 细胞基站和传输频率的细胞网络\n\n然而，有很多合成的、无意的网络类别。例如，相邻的实体店共享客户群，这有时是无意的。因此，这些企业形成了一个亲和网络。亲和网络中的关系是隐含的，并且处于亲和语境中（例如地理位置）。访问热门电子商务网站（例如\
    \ amazon.com）的消费者形成了自己的产品偏好亲和网络。虽然成对的个体消费者可能从未见过，但电子商务服务利用亲和网络进行数据挖掘。分享点赞（或转发）的人是他们所喜爱的内容背景下亲和网络（或标签）的一部分。\n\
    \n图 1.1 描述了网络类型的分类法。交换网络是指在节点之间交换可量化实体的网络，无论节点是有形的（例如天然气）还是无形的。\n\n"
