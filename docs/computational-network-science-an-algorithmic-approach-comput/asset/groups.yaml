    # Computational Network Science: An Algorithmic Approach


    of independently operated links: {1, 2, ..., I}, d units of flow are routed through
    the network made up of many users. Latency (i.e., delay to congestion) for link
    $i$ is denoted by $l(x)$, where $x$ is the flow link $i$ and $x = [x_1, ..., x_I]$
    is the vector of all flows. Let $P$ denote the price per unit flow on link $i$;
    $C_i = P_i + l(x)$ denotes the total cost for using link $i$. Users maintain a
    utility threshold $R$. If $C_i > R$, no traffic is routed on link $i$. Otherwise,
    link $i$ is used for routing. Wardrop principle (i.e., Wardrop equilibrium) is
    commonly used for efficient flow distribution (Menache and Ozdaklar, 2011). Application
    of Wardrop equilibrium has led to increased reliability and performance of communication
    networks using multipath routing found in Kelly and Voice (2005).


    # 3.3 COOPERATION IN NETWORK SYNTHESIS GAME


    Cooperation in GT suggests coalition formation. This can be applied to networks.
    Let $I$ be a set of players. $S$ is a set of all possible coalitions (i.e., all
    nonempty subsets of $I$). Whereas $B$ is the least amount of resources needed
    for accommodating service demands, $b$ is the amount of available resources of
    the $i$th member of a coalition, which is common knowledge among players. If the
    sum of available resources in a coalition $S$ exceeds the threshold of resources
    required to meet the service demands $B$, that coalition is worthwhile. Otherwise,
    the coalition $S$ has no value. This is shown in Equation 3.8;


    > $If \sum_{i}^{|S|} b_i > B, \text{ then } \vartheta(S) = 1; \quad \text{otherwise,
    } \vartheta(S) = 0 \quad (3.8)$


    Network synthesis game can be formulated in the form of a weighted voting game
    $(I, w), W/2$, where $w$ is the weight of player $i$’s vote and $W = \sum_{i}^{|I|}
    w_i$. Network synthesis game is isomorphic to a weighted voting game with $b_i
    = w$, and $B = W/2$.


    # 3.4 BAYESIAN GAMES


    In the real world, data is unavailable to players. In fact, possession of more
    information and larger strategic options have adverse effect on player utility
    (Aumann, 1976). This is the fundamental premise for Bayesian games, where each
    player $i$ is of specific type $\tau_i$, which is strictly private knowledge,
    known only to $i$, and not by others. $q$ is a joint probability distribution
    over the profiles of types. $\sigma(\tau)$ is the set of strategies of player
    $i$ with type $\tau_i$. Strategies depend on player types. Utility is a function
    computed by Equation 3.9 that produces a value for a given player-type vector
    and their strategy vector. Each player will evaluate ex ante (i.e., before the
    event) expected utility by marginalizing $q$ given its own type in Equation 3.10.
    If player set and their strategy sets are finite, a mixed Bayesian equilibrium
    exists (Menache and Ozdagar, 2011).


    $$\mu_i : \langle\tau\rangle \times \langle\sigma\rangle \to \mathfrak{R} (3.9)$$


    $$E = \sum q_i \left( \frac{\tau_{-i}}{\tau_i} \right) \times \mu_i(S_i(\tau_i),
    \ S_{-i}(\langle\tau_{-i}\rangle) (3.10)$$


    # 3.5 APPLICATIONS


    This section outlines two key applications in wireless networking that are modeled
    as Bayesian games.


    ### 3.5.1 Packet Forwarding Game


    In a wireless network, packets travel from senders to receivers. Each node is
    tempted to drop the packet the player should forward, as this would save some
    of his or her resources. However, if the other node reasons in the same way, the
    packet that the first player wanted to send will also be dropped. They could,
    however, do by mutually forwarding each other''s packet. Hence, there is a dilemma.


    A sender can choose between strategies to forward the packet in good faith or
    alter it and thereby attack the receiver. The receiver has two available strategies
    to vigilantly monitor possible attacks or to stay idle. Wherever all are alike,
    might be one of the following types: malicious or benign. Since we do not know
    the sender type, packet forwarding is modeled as a Bayesian game. The payoffs
    for packet forwarding game are shown in Figure 3.5. $C_A$ is the sender''s cost
    of attacking. $G_A$ is the sender''s utility for a successful attack. $C_F$ is
    the sender''s cost of forwarding. $C_M$ is the receiver''s cost of monitoring
    for attacks. For the malicious sender, it is always better to attack, whereas


    | Sender | Receiver | | |

    | --- | --- | --- | --- |

    | | Monitor | Idle | |

    | | Attack | $-G_A-C_A, G_A-C_M$ | $-G_A-C_A, -G_A$ |

    | Forward | $-C_F, -C_M$ | $-C_F, 0$ | |


    Fig 3.5. Packet forwarding game.


    the benign sender always forwards. For the receiver, if the utility of monitoring
    is less than that of being idle, the receiver will stay idle (Han et al., 2012).


    Bayesian NE exists when Equation 3.11 holds (Han et al., 2012). $\alpha$ is the
    probability that the sender is malicious. $\beta$ is the channel loss rate and
    $(1-\beta)$ is the probability of receiver monitors for an attack. $\psi$ is the
    probability that an attack is successful.


    $$\alpha < \frac{C_M}{(1-\beta)(1+\psi)G_A} \quad (3.11)$$


    ### 3.5.2 Medium Access: Bandwidth Auction Game


    Measurement of data transfer rate (i.e., communication bit rate) is bandwidth
    and it becomes an item of contention when multiple users (e.g., vehicles) share
    an access point (e.g., roadside access point). Users offer bids $s_i$, price per
    unit of bandwidth allocation in an auction style. If $t_i$ is the duration of
    connection to the access point requested by user $i$, Equation 3.12 is the amount
    of bandwidth allocated to user $i$, denoted by $g_i$. $N$ is the number of users
    and $B$ is the total amount of bandwidth available. Since players do not know
    each other''s type by their request duration $t_i$, they play a Bayesian game
    with equilibrium determined by an iterative algorithm shown in Figure 3.6. $\varepsilon$
    is a small parametric value.


    $$g_i = \frac{s_it_i}{\sum_{j=1}^N s_jt_j} \times B \quad (3.12)$$


