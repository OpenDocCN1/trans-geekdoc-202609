  mdcn: "\n\n## 第12 章\n## 新兴趋势\n\n网络科学学科跨越了多个边界。我们提供了网络科学现状的快照。然而，正如预期的那样，未来仍需要广泛且活跃的研究。在本章的剩余部分，我将重点介绍领先机构的研究焦点。\n\
    \n社交媒体挖掘是一项蓬勃发展的趋势（Bhat and Abulaisha, 2013; Tu et al., 2013）。在线社交网络不可逆地改变了人类的社会生活。在极端情况下，坐在同一个房间里的朋友和家人倾向于发推或发帖而不是面交流。社交媒体的普及创造了半公开的数字日记。同样，社交数据的共享为极速的反思和分析提供了机会。这一证据是，政治已随着瞬时趋势分析发生了变化。对于社交媒体普及的负面影响，可以认为正如普特南所说，人们正在退缩到数字墙之后过着孤立的生活（Putnam,\
    \ 2001）。\n\n在这场转型的积极方面，我们大数据时代的分析（Mayer-Schönberger and Cukier, 2013）使我们能够超越个人层面的细微差别和偏见，理解全球性的转变。“大数据”分析使得社会及医疗疾病解决方案的发现和部署成为可能。\n\
    \n通信网络的进步正推动着5G无线蜂窝网络的发展。其目标是创建全球资源优化且高能的网络。能耗与服务延迟之间存在众为人知的权衡。尖端技术是使通信网络对流量变化具有越来越适应性。游戏理论在这种发展中继续发挥作用（Menache\
    \ and Ozdaglar, 2011; Antoniou and Pitsllides, 2013）。\n\n移动设备网络大量出现，其中网络局限于设备本身。从2000年开始，汽车配备了控制器区域网络（CAN），实现了线控控制车辆（Voss,\
    \ 2005）。人体局域网（BAN）由嵌入衣物中、佩戴在身上或植入体内的传感器和医疗设备组成（Gupta et al., 2013）。\n\n## 12.1\
    \ 结论\n\n显然，我们只见到了新兴网络科学的冰角（Greve et al., 2014）。凭借我们的入门指南和行动号召，我们期待地平线上会有许多发展。\n\
