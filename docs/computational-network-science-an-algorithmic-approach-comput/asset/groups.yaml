    ## 6.4.3 级联模型


    信息级联模型复制了个人放弃自己的信息而根据他人的行为和意见进行推断的影响。


    级联模型假设个人具有有限的动作集。个人纯粹基于关于他人的可观测信息做出理性的、顺序的。常见的例子是


    ![](img/b8728314847e4125cdf70bea9fd5b5a5_56_0.png)


    图 6.13. 展示 Girvan 和 Newman 算法的示例网络。


    邻里竞争和物质滥用（Dodge et al., 2010; Easily and Kleinberg, 2010）。在级联模型中，指定的节点初始为激活状态，并将影响扩散到其他节点。关于影响的深入讨论将推到第
    7 章。让我们考虑一个加权图，其中每条边都有权重（即强度），每个节点都带有一个阈值。有少数节点已经处于激活状态。当输入边的权重之和大于该节点的阈值时，激活激活的邻居就会转变为激活状态。线性阈值模型（LTM）最早由
    Granovetter（Granovetter, 1978）引入。在 LTM 中，每个节点 $v$ 从 0 到 1 之间的均匀分布中随机选择一个阈值 $\theta$。让
    $\theta_v$ 表示激活 $v$ 需要的邻居比例。邻居 $w$ 能以权重 $b_{w,v}$ 影响 $v$。我们假设 $b_{w,v} \le 1$。如果节点满足方程
    6.6，则该节点被激活。激活过程分连续的激活阶段进行，直到无法进一步进行激活为止。


    $$\sum b_{w,v} \ge \theta_v$$ (6.6)


    为了说明，让我们看看图 6.14 所示的学生之间对于选课程的影响。Golbeck (2013) 讨论了该模型的几种变体。


    在图 6.14 的网络中，有九个标记为 A 到 I 的研究生。节点值表示该节点的阈值，在本例中为对修读特定课程的反感。学生之间相互互动，并在选课决策上影响同伴。边值代表一对同伴之间的影响权重。该图说明了学生在注册课程时如何受到同伴的影响。学生
    A 已经注册了课程。其他学生尚未注册。E 受到 A 和 D 的影响。然而，D 没有激活状态，因此 E 仅受到 A 的影响。E 的阈值为 0，小于来自 A 的
    0.2 影响（边）值。因此，E 注册了课程并在网络中变为激活状态。随后，C 受到 A 的影响


