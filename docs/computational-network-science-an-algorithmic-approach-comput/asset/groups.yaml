    # CHAPTER 11

    Network Organizations


    Networks provide platforms for establishing and sustaining relationships among
    individuals (i.e., agents). The most common form of relationships is between pairs
    of agents (i.e., dyadic relationships). Other relationships can be between agents
    and their allegiance to groups. A specific type of a group is a network organization
    (NO), which is common in many forms. Business organizations (e.g., IBM) have been
    using their own internal versions of internal social networks for far longer than
    those available to the general public (e.g., Facebook), which have routinely supported
    informal, long- and short-duration, communities of interest. Civic, volunteer,
    and myriad associations are other examples of NO. An individual may have various
    relationships with an NO including passive membership, active participation, and
    key player in the operation.


    Electronic institutions (E-institutions) have been proposed to guide normative
    patterns of organizations (Sierra and Dignum, 2001). Our suggestion of using social
    capital for reasoning about resources in Chapter 9 is complementary to E-institutions,
    in which they can be argued to guide resource allocation in NO. However, our social
    capital perspective here is more on local decision making than as global (i.e.,
    systemwide) supported by E-institutions.


    An NO may provide access to forms of intangible, status bearing capital (e.g.,
    an elite member of a neighborhood watch association), and, as such, it would be
    said that the NO possesses social capital by its capacity to dispatch capital.
    This is the only exception in the entire NO and specific agents possess social
    capital. This chapter does not further consider this type of NO social capital
    and other varieties of social capital not stemming directly from NO as those derived
    from ethnographic-, gender-, and class-based capitals of agents (Parks-Yancy et
    al., 2006). Social capital and institutions overlap in managing resources but
    this comparison is outside our present scope of interest (Lin, 2001).


    # Computational Network Science: An Algorithmic Approach


    In contrast to the stylized relationships of traditional networks, an alternative
    for the network is to consider dynamic and fluid relationships. A group might
    gather under loose connections such as business label with no physical presence.
    Since there is absence of tangible places and resources to identify the group,
    this type of dynamic network is often called a virtual organization (Dziuzla-Rucinska
    et al., 1994; Potter and Bazard, 2002). Norman et al. (2003) provide strategies
    for formation of virtual organizations. Another type of dynamic network is when
    a group with complementary expertise and interests may form a rather temporary
    and impromptu network to work on a short-duration goal, which we call networked
    organizations. Typically, these organizations lag coordination and control schemes
    before they start. Postmortem analyses reveal serendipitous, implicit, and emergent
    coordination protocols. Examples of such situation-based networked organizations
    are commonly found in the law enforcement cases where disparate law and crime
    professionals collaborate as needed on solving crimes. A recent synthesis of ideas
    for emergent networked theory that is described in Westaby (2012). Westaby puts
    forward social psychological explanations for how individuals in a social network
    are motivated to pursue goals. He develops qualitatively metrics that account
    for social forces that propel or prohibit progress goals.


    Westaby contrasts role-based organizational charts with sociograms of social networks,
    where actual communication does not follow a long organizational chart. This is
    contrasted with dynamic network charts, where metas illustrate informal grouping
    of individuals who positively or negatively influence goal pursuit and achievement.
    Goal striver, goal preventer, system supporter, system resistor, system reactor,
    interactants, and observer are several metas by Westaby. Network motivation as
    social forces that promote goals is a function of strivers and supporters. The
    opposite of network motivation is the social force of network resistance as a
    function of goal preventers and supportive resistors. Network affirmation and
    de-affirmation are social forces that approve or disapprove network goals, however
    without active participation. The theory considers various goal conflicts. Westaby
    introduces activation levels and performance measures in order to determine overall
    network effectiveness measures. Westaby’s system of visualizing metaroles overlaid
    over a NO is very enlightening and aids in analysis of dynamic processes operating
    inside a NO. Webster''s characterization of NOs is certainly rich and articulates
    many interesting features of NOs. It can be implemented in a computational decision
    aid. However, determining measures of social forces cannot be automated and remains
    subjective, which must be subjectively entered. This draw-backs its wider applicability
    and proliferation of his theory.


    # 11.1 CONCLUSION


    NOs are emerging groups that use the Internet including social media to facilitate
    collaboration. This has provided serendipitous and emergent interaction among
    individuals that exceeds traditional organizational framework. This is a nascent
    aura that requires attention. We envision this technology to transform information
    society into cohesive wholes.


