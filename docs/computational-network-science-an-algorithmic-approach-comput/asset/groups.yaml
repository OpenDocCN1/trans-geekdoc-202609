    ```

    $\forall i, p_i(\infty) = \lim_{t\to\infty} p_i(t) \quad (7.6)$

    ```


    A network $N$ and a matrix $T$ reach consensus if $\forall i, j \in N, p_i(\infty)
    = p_j(\infty)$. Such a matrix $T$ is a steady-state Markov chain. A society is
    said to be wise when the most influential influence vanishes in the society (Jackson,
    2008). Further discussions of convergence and examples are found in Jackson (2008).


