    关系的追踪揭示了社区随时间推移的时间性问题和变化。将八卦传给你的朋友需要多久？当窗口达到真实的投送时间，即如果每个窗口为 1 小时，那么节点 A 可以在 3
    小时内到达节点 C。


    为了模拟链接的变化，我们可以对每个时间窗口内的实际友谊强度取平均值。如果时间图中每个窗口为一天，那么节点 A 的朋友（B, D）在三个可能的日期中仅相遇一次。在时空空间中，不连通的节点对数量比静态图中要多。为了处理这个问题，我们使用时间路径长度的倒数。在这种情况下，节点
    A 和 F 之间的无限路径长度为 1/∞=0。节点（即个人）由其人口统计学属性定义，例如姓名、年龄、性别和位置。我们可以为节点添加时间属性。如果两个节点在特定社区中的时间值多次重叠，我们可以说这两个节点具有时间亲和力。例如，考虑一个实时社交网站，如
    Facebook 或 Flickr。假设今天在某个电影社区中有 100 人在线。那么我们可以说人数可能会发生变化。如果我们观察相同时间属性值的人数，并在某些期间内绘制图表，我们就可以分析电影社区中的节点，很可能针对较大的社区并最终扩展到整个网络。接下来我们将检查涉及时间、地点和个体的网络建模风格。


    时空语义模型考虑了人们在特定地点和特定时间（间隔）的访问活动。例如，让四个人 A、B、C 和 D 访问三个地点 P1、P2 和 P3。一个地点意味着一个由人们访问的语义位置。例如，会议就是一个研究人员聚集和交流工作及思想的语义地点示例。地名和邮政编码是另一个语义位置的示例。这些可以是不同的地理位置，也可以是不同时间间隔访问的同一地点。每次访问活动由一个访问者和一个每个人的唯一活动
    ID 表示，例如 A.1。


    在人-地模型中，如果某个人在时间间隔内访问了某个地点，则该个人与该地点就存在关系。二分图常用于建模人与地之间的关系。在二分图中，顶点被分为两个不相交的集合，即一组人和一组地点。边可以由活动事件标记，以连接其对应的人和地。二分网络可以转换为单模态社交网络，这取决于对特定类型交互的强调，即人与人之间或地与地之间。


    在人-人模型中，人们根据他们对地点的共同访问在社交网络中连接起来。共同访问的次数可以作为每条链接的权重。例如，由于 A 和 B 访问了地点 P1 和 P2，他们之间有权重为
    2 的链接。


    在地-地网络中，如果两个地点共享至少一个访问者，它们就是连接的。人类社会网络的特征是在个体层面上具有丰富的变异性。有些人朋友很少，而另一些人朋友很多。有些人嵌入在紧密的群体中，每个人彼此认识，而另一些人属于许多不同的群体，朋友之间的重叠很少。为了解释这种变异性，学者们寻求简单的网络形成模型，这些模型作为自组织过程的内生结果，能够产生经验真实的网络特征分布。众为人知的网络形成模型始于相同的个体，他们受到社会过程的影响，这些过程创造或加剧了网络中的差异。例如，在无标度物理模型中，是增长过程（特别是偏好附着）驱动了度幂律分布的自组织特征。在经济连接中，当行动者获得间接网络收益并受短期经济激励驱动时，预先同质的个体会内生地形成一个星星型网络。在社会学中，行动者对结构平衡和同质性的偏好倾向于刺激社会关系中的传递性和志同道合派别的形成。尽管这些模型中的结构性过程在某些网络属性上产生了经验真实的变异，但个体特征的影响主要被忽视了。经典模型已经进行了扩展，考虑了个体的异质性，但这些模型通常被作为原始模型的稳健版本提出，其重点仍然是内生过程。在本书中，我们关注个体特征本身，并探索人类具备可能影响其网络属性的特质的可能性。我们最本质的特征可以在我们的基因中找到。


    # 5.2 时间图 (TIME GRAPHS)


    时间图扩展了演化有向图的传统概念，将链接的创建作为时间上的现象进行捕获。我们通过创建和分析一系列数据快照来解决这个问题。因此，开发工具和方法来分析这些快照。


