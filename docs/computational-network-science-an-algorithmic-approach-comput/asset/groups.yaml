    # 6.5 COMMUNITY CORRELATION VERSUS INFLUENCE


    Given a network, we can count the fraction of edges connecting nodes with distinctive
    values. Then, we compare it with the expected probability of such connections
    if the attribute and the social connections are independent. If the two quantities
    are significantly different, we conclude the attribute is *correlated* with the
    network. If the fraction of edges linking nodes in a group with different attribute
    values is significantly less than the expected probability of random connection
    in that network, there is evidence of *correlation*. There exist correlations
    between behaviors and attributes of adjacent nodes in a social network. Explanations
    for correlation are homophily (McPherson et al., 2001) and *influence* that is
    discussed in Chapter 7.


    # 6.6 CONCLUSION


    This chapter explored the phenomena of rampant changes in networks exemplified
    by (a) disseminations of preferences, (b) perception, (c) epidemic (i.e., contagion)
    of disease, and (d) community compositions. Inspirations have converged from material
    science in percolation models to epidemiology in epidemic models and mathematical
    sociology’s contribution to community detection. Community detection in networks
    is still an evolving front. With very large networks, it is difficult to detect
    desired communities. We reviewed the most popular methods and algorithms. Much
    research is ongoing and open problems are many, as networks are growing exponentially
    and becoming more complex.


