    # PREFACE


    The days of the need for gurus and extensive libraries are behind us. The Internet
    provides ready and rapid access to knowledge for all. This book offers necessary
    and sufficient descriptions of salient knowledge that have been tested in traditional
    classrooms. The book weaves foundations together from disparate disciplines including
    mathematical sociology, game theory, political science, and biological networks.


    Network science is a new discipline that explores phenomena common to connected
    populations across the natural and man-made world. From animals to commodity trades,
    networks provide relationships among individuals and groups. Analysis and leveraging
    connections provide insights and tools for persuasion. Studies in this area have
    largely focused on opinion attributes. The impetus for this is a need to examine
    computational processes for automating tedious analyses and usage of network information
    for online migration. Once online, network awareness will contribute to improved
    public safety and superior services for all.


    A collection of foundational notions for economic and social networks is available
    in Jackson (2008). A mathematical treatment of generic networks is present in
    Easily and Kleinberg (2010). A complementary gap filled by this book is an algorithmic
    approach. I provide a fast-paced introduction to the state of the art in network
    science. References are offered to seminal and contemporary developments. The
    book uses mathematical cogenency and contemporary computational insights. It also
    calls to arm further research on open problems.


    The reader will find a broad treatment of network science and review of recent
    phenomena. Senior undergraduates and professional people in computational disciplines
    will find sufficient methodologies and processes for implementation and experiment.
    This book can be used as a teaching material for courses on social media and network
    analysis, computational social networks, network theory and applications. Our
    coverage of social network analysis is limited and details are available in Golbeck
    (2013) and Borgatti et al. (2013).


    Whereas a teacher is a tour guide to the subject matter, this book is a reference
    manual. Chapters in each part are related and they progress in maturity. Chapters
    are semi-independent and a course instructor may choose any order that meets the
    course objectives. Exercises at the end of each chapter are students'' hands-on
    projects that are designed for covering learning activities during a semester.
    Some code is provided in appendices for prototyping and learning purposes only.
    We do not provide a how-to guide to mainstream social media or codebook for application
    development that is available elsewhere.


    Henry Hexmoor

    Carbondale, IL

    2014


    # REFERENCES


    - Borgatti, S., Everett, M., Johnson, J., 2013. Analyzing Social Networks. SAGE
    Publications.

    - Easily, D., Kleinberg, J., 2010. Networks, Crowds, and Markets. Cambridge University
    Press.

    - Golbeck, J., 2013. Analyzing the Social Web. Morgan Kaufmann Publications.

    - Jackson, M., 2008. Social and Economic Networks. Princeton University Press.


    # CHAPTER 1


    # Ubiquity of Networks


    ## 1.1 INTRODUCTION


    Broadly speaking, a network is a collection of individuals (i.e., nodes) where
    there are implicit or explicit relationships among individuals in a group. The
    relationships may be strictly physical as in some sort of physical formation (e.g.,
    pixels of a digital image or cars on the road), or they may be conceptual such
    as friendship or some similarity among pairs or within a pair. In an implicit
    network, individuals are unaware of their relationships, whereas in an explicit
    network, individuals are familiar with at least their local neighbors. In certain
    implicit networks like affinity networks, there is a potential for explicit connections
    from relationships that account for projected connection as homophily (i.e., similarity)
    McPherson et al., 2001. Biological networks capture relationships among biological
    organisms. For instance, the human brain neurons form a large network called a
    connectome (Seung, 2012). An ant society is an example of a large biological network
    (Moffett, 2010). There are many examples of small-scale animal networks, including
    predators and their prey, plant diseases, and bird migration. Human crowds and
    network organizations (e.g., government or state agencies, grids in colonies)
    are other examples. Modern anonymous human networks have capacities for crowd
    solving problems (Nielsen, 2012), where a group of independently minded individuals
    possess a collective wisdom that is available to singletons (Reingold, 2000).
    Social and political networks model human relations, where social and political
    relations are paramount. Economic networks are models of parties related to economic
    relationships such as those buyers (and consumers), sellers (and producers), and
    intermediaries (i.e., traders and brokers) (Jackson, 2003). Beyond natural networks,
    there are myriad of synthetic networks. The grid of a photograph is an example
    of synthetic networks. Nanonetworks are attempts to network nanomachines for emerging
    nanoscale applications (Jornet and Pieroben, 2011).


    A large class of networks is a complex engineered network (CEN) that is a man-made
    network, where the topology is neither regular nor random. Examples of CENs are
    the Internet, wireless networks, power grids with smart homes and cars, remote
    monitoring networks with satellites, global networks of telescopes, and networks
    of instruments and sensors from battlefields to hospitals. Time requirements in
    CENs range from seconds in cyber-attacks to years in greenhouse gas emissions.
    Data and control flow in CENs must be managed over connections that could span
    thousands of miles.


    A few synthetic network categories, including CENs, are created intentionally.
    Here, we list six types:


    1. Social networks through networking sites and services

    2. Political networks as in parliamentary cabinets and political committees

    3. Computer networks that include computers and how they communicate over local,
    wide area, and wireless links (e.g., sensor networks)

    4. Telecommunication networks as in switches for nodes and respective routing
    paths

    5. Power grids

    6. Cellular networks as in cellular base stations and transmission frequencies


    There are many synthetic, however, unintended, network categories. For example,
    collocated brick-and-mortar businesses share clientele that is sometimes unintended.
    As such, these businesses form a affinity network. Relationships in affinity networks
    are only implied and in the context of the affinity context (e.g., colocation).
    Consumers visiting popular e-commerce sites (e.g., amazon.com) form their own
    product preference affinity networks. Although pairs of individual consumers may
    never meet in-person, the e-commerce services use affinity networks for data mining
    and Individuals sharing like votes (or retweets) are part of an affinity network
    (or a hashtag) in the context of what they liked (or tweeted).


    Figure 1.1 depicts a taxonomy of network types. Exchange networks are those in
    which a quantifiable entity is exchanged among the nodes whether or not the nodes
    are tangible (e.g., natural gas) or intangible

