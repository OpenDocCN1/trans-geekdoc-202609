    # 6.4.1 Spectral Clustering


    Spectral “graph” clustering technique is used to determine the number of clusters
    in large networks. Spectral partitioning is based on Laplacian matrix ($L$) and
    finding eigenvalues and eigenvectors.


    Adjacency matrix $A = [W_{ij}]$, where $W_{ij}$ is the edge weight between vertices
    $x_i$ and $x_j$. $W_{ij} = 1$ if there is a link between nodes $i$ and $j$, otherwise
    $W_{ij}= 0$. The Laplacian matrix $L = D - A$, where $D$ is the diagonal matrix
    of node degrees. We illustrate a simple example shown in Figure 6.5.


