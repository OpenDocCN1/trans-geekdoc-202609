    # 计算网络科学：一种算法方法


    对于独立运行的链路：{1, 2, ..., I}，$d$ 单位的流量流经由许多用户构成的网络。链路 $i$ 的延迟（即拥塞延迟）用 $l(x)$ 表示，其中
    $x$ 是通过链路 $i$ 的流量，且 $x = [x_1, ..., x_I]$ 是所有流量的向量。令 $P$ 表示链路 $i$ 上每单位流量的代价；$C_i
    = P_i + l(x)$ 表示使用链路 $i$ 的总成本。用户维持一个效用阈值 $R$。如果 $C_i > R$，则没有流量在链路 $i$ 上路由；否则，链路
    $i$ 用于路由。沃德罗普原理（Wardrop principle，即沃德罗普均衡）常用于高效的流量分配（Menache and Ozdaklar, 2011）。沃德罗普均衡的应用提高了使用多路径路由的通信网络的可靠性和性能，详见
    Kelly and Voice (2005)。


    # 3.3 网络合成博弈中的合作


    GT 中的博弈暗示了联盟的形成。这可以应用于网络。令 $I$ 为玩家集合。$S$ 是所有可能联盟的集合（即 $I$ 的所有非空子集）。其中 $B$ 是满足服务需求所需的最少资源，而
    $b$ 是联盟中第 $i$ 个成员的可用资源量，该量是玩家之间的共同共识。如果联盟 $S$ 中可用资源之和超过满足服务需求所需的资源阈值 $B$，则该联盟是有价值的。否则，联盟
    $S$ 没有价值。这如公式 3.8 所示：


    > $If \sum_{i}^{|S|} b_i > B, \text{则 } \vartheta(S) = 1; \quad \text{否则, } \vartheta(S)
    = 0 \quad (3.8)$


    网络合成博弈可以表示为加权投票博弈 $(I, w), W/2$ 的形式，其中 $w$ 是玩家 $i$ 投票的权重，$W = \sum_{i}^{|I|} w_i$。网络合成博弈等同于
    $b_i = w$ 且 $B = W/2$ 的加权投票博弈。


    # 3.4 贝叶斯博弈


    在现实世界中，玩家无法获取数据。事实上，拥有更多信息和更大的策略选择对玩家的效用有负面影响（Aumann, 1976）。这是贝叶斯博弈的基础假设，其中每个玩家
    $i$ 有一个特定的类型 $\tau_i$，该类型是严格私有的知识，仅 $i$ 晓，而其他人不知道。$q$ 是关于类型配置的联合概率分布。$\sigma(\tau)$
    是类型为 $\tau_i$ 的玩家 $i$ 的策略集。策略取决于玩家类型。效用是通过公式 3.9 计算的函数，它为给定的玩家-类型向量及其策略向量产生一个值。每个玩家将通过公式
    3.10，在给定自身类型的情况下对 $q$ 进行边缘化处理，以评估先验（即事件发生前）期望效用。如果玩家集合及其策略集合是有限的，则存在混合贝叶斯均衡（Menache
    and Ozdagar, 2011）。


    $$\mu_i : \langle\tau\rangle \times \langle\sigma\rangle \to \mathfrak{R} (3.9)$$


    $$E = \sum q_i \left( \frac{\tau_{-i}}{\tau_i} \right) \times \mu_i(S_i(\tau_i),
    \ S_{-i}(\langle\tau_{-i}\rangle) (3.10)$$


    # 3.5 应用


    本节概述了无线网络中建模为贝叶斯博弈两个两个应用。


    ### 3.5.1 数据包转发博弈


    在无线网络中，数据包从发送者传输到接收者。每个节点都倾向于丢弃应该转发的数据包，因为这将节省其的一些资源。然而，如果另一个节点也以相同的方式考虑，那么第一个玩家想要发送的数据包也将被丢弃。然而，他们可以通过相互转发对方的数据包来实现。因此，存在一种困境。


    发送者可以在诚实转发数据包或修改数据包以攻击接收者的策略之间进行选择。接收者有两个可用策略：警惕地监控可能的攻击或保持空闲。无论情况如何，双方都可能是以下类型之一：恶意的或良性的。由于我们不知道发送者的类型，因此数据包转发被建模为贝叶斯博弈。数据包转发博弈的收益如图
    3.5 所示于C_A$ 是发送者的攻击成本。$G_A$ 是发送者攻击成功的效用。$C_F$ 是发送者的转发成本。$C_M$ 是接收者监控攻击的成本。对于恶意发送者，攻击总是更好的，而


    | 发送者 | 接收者 | | | |

    | --- | --- | --- | --- |

    | | 监控 | 空闲 | |

    | | 攻击 | $-G_A-C_A, G_A-C_M$ | $-G_A-C_A, -G_A$ |

    | 转发 | $-C_F, -C_M$ | $-C_F, 0$ | |


    图 3.5. 数据包转发博弈。


    良性发送者总是转发。对于接收者来说，如果监控的效用小于空闲的效用，接收者将保持空闲（Han et al., 2011）。当监控的效用小于空闲的效用时，接收者将保持空闲（Han
    et al., 2011）。如果玩家集合及其策略集合是有限的，则存在混合贝叶斯均衡（Menache and Ozdagar, 2011）。


    $$\alpha < \frac{C_M}{(1-\beta)} \quad (3.11)$$


    ### 3.5.2 媒体接入：带宽拍卖


    测量数据传输率（即通信比特率）的带宽接入是由于 $s_i$ 是玩家 $i$ 的投票权重，$t_i$ 是接入时长。网络合成博弈等同于 $b_i = w$ 且
    $B = W/2$ 的加权投票博弈。其中 $N$ 是玩家数量，$B$ 是可用带宽总量。$g_i$ 是根据请求时长 $t_i$ 的玩家 $i$ 的均衡，如图
    3.6 所示。$\varepsilon$ 是一个小值。


    $$g_i = \frac{s_it_i}{\sum_{j=1}^N s_jt_j} \times B \quad (3.12)$$


    ### 3.5.3 安全博弈


    斯塔克尔格博弈是受经济学启发的顺序性（即轮流）竞争博弈（von Stackelberg, 2011）。通常情况下，第二个玩家会观察第一个玩家的选择。


    1. 初始化计数器 $k=1$。

    2. 从所有车辆节点接收 $s_i[k], t_i[k], g_{tri}$。

    3. 根据公式 3.12 计算 $g_i[k-1]$ 并分配带宽给车辆节点。

    4. 重复：

    5. $k \leftarrow k+1$。

    6. $s_i[k] \leftarrow \arg \max E [\mu_i(g_i[k-1], s_i[k-1], t_i[k-1])]$。

    7. 车辆节点向接入点发送 $s_i[k]$。

    8. 根据公式 3.12 计算 $g_i[k]$ 并分配带宽给车辆节点。

    9. 直到 $\max|s_i[k]-s_i[k-1]| \leq e$。


