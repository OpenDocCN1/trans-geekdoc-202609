    # TABLE I: Details of Datasets


    | Dataset | Features | Total Samples | Training Samples | Testing Samples |

    |---|---|---|---|---|

    | IM_Dataset_1 | Amplitude | 4053 | 2837 | 1216 |

    | IM_Dataset_2 | Amplitude and TOA_AO | 4053 | 2837 | 1216 |

    | AC_Dataset_1 | Amplitude | 1625 | 1137 | 488 |

    | AC_Dataset_2 | Amplitude and TOA_AO | 1625 | 1137 | 488 |


    The classifiers are trained on 70% of data, and the remaining 30% of data is used
    for testing. The details of training and testing data of the classifiers are ensured
    using a 5-fold cross-validation method.


    # IV. RESULTS AND DISCUSSION


    The selected classifiers are implemented in the Python Jupyter notebook, using
    Scikit machine learning library. The test results obtained for all datasets are
    used to calculate the values of performance metrics. Like specificity, accuracy,
    precision, recall, F1-score, log-loss, error rate, AUC are calculated. The results
    are reported in Table II. Further, the performance of classifiers is validated
    using 5-fold cross-validation, and the corresponding results are reported in Table
    III. Additionally, the roc curve is calculated for each fold of the classifier
    performance. The roc curve is shown in Fig. 7. Further, the RF, SVM, DT, and GNB
    are shown in Fig. 7 (a), (b), (c), (d), and (e), respectively.


    ![](img/9413aa04f5eec4fdc092811851e335d9_3_1.png)


    Fig. 7: ROC Curves for LR; (a) IM_Dataset_1 (b) IM_Dataset_2 (c) AC_Dataset_1
    (d) AC_Dataset_2.


    The testing results reported in Table II show that RF with the number of estimators
    500 and 5 folds is better than all other classifiers for annotation of IM_Dataset_2
    and AC_Dataset_2. It can also be seen in Fig. 10(a) and (b). Fig. 10(d) that RF
    is better than others with significantly high AUC of 0.977-0.992 and 0.970-0.972.
    Furthermore, the performance of RF performs poorly for annotation of AC, as shown
    in Table II. The 5-fold cross-validation results shown in Table III also confirms
    the superiority of RF. The classifiers reported according to AC_Dataset_1 shown
    in Table II, Table III, Fig. 7(c), 8(c), 9(c), 10(c), and 11(c) make that it is
    challenging to annotate AC only with Amplitude as feature. However IM may be annotated
    with only Amplitude. A zero value of precision, recall, and F1-score represents
    the rarity of LR, SVM, and GNB classifiers for classifying the positive class
    1 of AC_Dataset_1. However, the classifiers'' accuracy on this dataset is better
    because they correctly classify the negative class i is 0. It is also confirmed
    by the cross-validation result shown in Table III.


    # V. CONCLUSION AND FUTURE SCOPE


    This paper analyzes various machine learning for annotation of IM and AC points
    on ECG. The classifiers are trained and tested using datasets obtained from the
    "cebs" database publicly available on the Physio repository. Four different datasets,
    each for IM and AC, were prepared using combinations of two features, and "TO
    AO."


