    分类器基于 70% 的数据进行训练，剩余的 30% 数据用于测试。分类器的训练和测试数据的详细信息通过 5 折交叉验证方法确保。


    # IV. 结果与讨论


    所选分类器在 Python Jupyter notebook 中实现，使用了 Scikit 机器学习库。所有数据集的测试结果被用于计算性能指标的值。计算了特异性、准确率、精确率、召回率、F1
    分、对数损失、错误率和 AUC。结果如表 II所示。此外，使用 5 折交叉验证验证了分类器的性能，相应的结果报告于表 III。此外，为分类性能的每一折计算了
    roc 曲线。roc 曲线如图 7 所示。此外，RF、SVM、DT 和 GNB 分别于图 7 (a)、(b)、(c)、(d) 和 (e)。


    ![](img/9413aa04f5eec4fdc092811851e335d9_3_1.png)


    图 7：LR 的 ROC 曲线；(a) IM_Dataset_1 (b) IM_Dataset_2 (c) AC_Dataset_1 (d) AC_Dataset_2。


    表 II 报告的测试结果显示，估计器数量为 500 且经过 5 折验证的 RF 在 IM_Dataset_2 和 AC_Dataset_2 的标注上优于所有其他分类器。在图
    10(a) 和 (b) 中也可以看到这一点。图 10(d) 显示 RF 以显著高的 AUC（0.977-0.992 和 0.970-0.972）优于其他。此外，表表所示，RF
    在 AC 标注上的表现不佳。表 III 显示的 5 折交叉验证结果也证实了 RF 的优越性。表 II、表 III、图 7(c)、8(c)、9(c)、10(c)
    和 11(c) 中根据 AC_Dataset_1 报告的分类器表明，仅用幅作为特征来标注 AC 是具有挑战性的。然而，可以用幅标注 IM。精确率、召回率和
    F1 分的零值代表 LR、SVM 和 GNB 分类器在分类 AC_Dataset_1 正类 1 时的稀有性。然而，分类器在该数据集上的准确率更好，因为它们正确地分类了负类
    i 为 0。这也通过表 III 显示的交叉验证结果得到了证实。


    # V. 结论与未来范围


    本文分析了用于 ECG 上 IM 和 AC 点标注的各种机器学习方法。分类器使用从 Physio 存储库公开获取的数据集进行训练和测试。使用两种特征以及“TO
    AO”组合准备了四个不同的数据集，每个用于 IM 和 AC。


