    \n图 3：带噪声的原始 ECG。\n\n### D. 使用的机器学习分类器\n\n本文包含了适用于实时监测的机器学习分类器：逻辑回归 (LR)、支持向量机\
    \ (SVM)、决策树 (DT)、随机森林 (RF) 和高斯朴素贝叶斯 (NB)。\n\n- **逻辑回归**：它是基础分类模型之一，使用 sigmoid\
    \ 几率比和迭代法输出 0 或 1。\n- **支持向量机**：被认为是最常见的学习模型之一。其核心思想是通过由 $w$ 和 $b$ 指定的超平面来分离两类。最优超平面是使超平面与两类最近支持点之间距离最大化的平面。\n\
    - **决策树**：这是一种简单的监督分类模型，根据某些规则连续分割数据。通过递归划分方法构建树，该方法迭代地将数据划分为分区。由于训练数据集被拆分成越来越小的子集，同时\
    \ DT 会被增量地开发。\n- **随机森林**：是一种基于集成分类概念的分类模型。使用数据的自助采样构建分类树，并在每个节点上，候选变量集是变量的随机子集。通过使用袋法（bagging）组合树并进行随机变量选择，产生一个同时实现低偏差和低方差的集成模型。\n\
    - **高斯朴素贝叶斯**：朴叶斯是基于贝叶斯定理的监督分类分类器。它不是单一模型，而是一族模型，所有模型共享一个共同原理，即每对特征之间相互独立的。GNB\
    \ 是针对真实属性的朴素贝叶斯名称，假设数据分布是高斯且连续的。在 GNB 中，任何新数据的概率都是通过高斯概率密度函数计算的。\n\n"
