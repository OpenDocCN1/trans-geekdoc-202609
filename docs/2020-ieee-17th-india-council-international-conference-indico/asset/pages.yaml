    *Abstract—Recently, Seismocardiogram (SCG) is used to monitor vital cardiac health
    parameters through relevant SCG peaks annotation. However, accurate annotation
    of SCG is a challenging task. In this paper, we design binary classifiers to annotate
    the Isovolumetric movement and the Aortic Valve Closure (AC) of SCG. Logistic
    Regression, Vector Machine, Decision Tree, Random Forest, and Gaussian Bayes,
    are implemented and evaluated. The experiments are conducted on the “echo” database
    available at PhysioNet repository. In particular, several performance results
    show high accuracy in annotation.

    *Index*—Machine Learning, Seismocardiogram, Isovolumetric Movement, Aortic Valve
    Closure, Annotation.


    # ## I. INTRODUCTION


    In the recent past, cardiovascular diseases (CVD) have become the root cause of
    the increasing number of deaths across the globe. Cardiac anomalies appear intermittent,
    and therefore they may go unnoticed, making the patient care a challenging task.
    Regular monitoring of cardiac health and developing a cost-effective measurement
    tool has become an essential public health requirement. However, there are several
    noninvasive techniques to monitor cardiac health, as shown in Fig. 1.


    However, Seismocardiography (SCG) is gaining popularity as it is non-invasive
    and records cardiac vibrations using low-cost accelerometers. Major factors contributing
    to the increasing recognition of SCG are relative ease of


    low infrastructure demand, in accelerometer technology, and most important is
    applicability to home use. Additionally, SCG is capable of diagnosing cardiac
    muscle defects, such as valvular defects. In the recent past, SCG-based cardiac
    health monitoring [2] and early warning systems [3] are designed with the Electrocardiogram
    (ECG) for mobile health applications.


    It is believed that SCG reveals secrets in cardiac muscle function, which include
    heart muscle movements, aortic valve movements, blood flow, and change in moment.
    SCG plays a vital role in monitoring cardiac health and detecting cardiac anomalies.
    The SCG was the first time identified by Roman Basel [4], and the first time used
    to measure aortic vibrations. It is very sensitive to various factors, such as
    age, sex, and health conditions. It has low sensitivity. The frequency of SCG
    is seen even during the routine analysis of ECG.


    The correct annotation of these peaks can make SCG a powerful technique for cardiac
    anomalies diagnosis. In this paper, we propose a machine learning-based binary
    classification approach to annotate the IM and AC peak of the SCG and compare
    the proposed classifiers'' performance.'
