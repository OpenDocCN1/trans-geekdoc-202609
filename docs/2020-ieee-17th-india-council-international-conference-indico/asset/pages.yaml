    # D. Machine Learning Classifiers Used


    This paper excludes the machine learning classifiers, which are suitable for real-time
    monitoring. Logistic Regression (LR), Support Vector Machine (SVM), Decision Tree
    (DT), Random Forest (RF), and Gaussian Naive Bayes (NB) classifiers.


    +   a) Logistic Regression: It is one of the basic classification models, which
    gives an output of 0 or 1 using the sigmoid odds ratio and an iterative method
    to find the method.


    +   b) Support Vector Machine: It is considered one of the most common learning
    models. The idea is to separate two classes through a hyper-plane specified by
    w and b. A the optimal hyperplane is the one that maximizes the distance between
    the hyperplane and the nearest points of support of both classes.


    +   c) Decision Tree: It is a simple supervised classification model where the
    data is continuously split according to some rule. A tree is built through a recursive
    partitioning method, which iteratively splits the data into partitions. Since
    a set of training data is broken into smaller and smaller subsets, and at the
    same time, the DT is incrementally developed. In the end, a DT covering the complete
    training is returned.


    +   d) Random Forest: It is a classification model based on the notion of ensemble
    classification. The classification trees is built using a bootstrap sample of
    the data, and at each, the candidate set of variables is a random subset of the
    variables. By using bagging approach for combining trees, and random variable
    selection yields an ensemble that can achieve both low bias and variance.


    +   e) Gaussian Naive Bayes: Naive Bayes are classifiers of supervised classification
    models based on the Bayes Theorem. It is not a single model but a family of models
    where all of them share a common principle, i.e every pair of features is independent
    of each other. GNB is the name of Naive Bayes for real attributes by assuming
    the data''s distribution to be Gaussian and continuous. In GNB, the probability
    of any new data is calculated using the Gaussian probability density function.


