    # ## II. RELATED WORK


    # ### A. Data Collection


    In [8], an envelope based method considering the ECG was proposed to detect AO
    and IM points considering their importance in signals. In [9], a sliding-template
    based approach was proposed to detect AO and points considering ECG Q-wave. Anyway,
    the first few beats were counted, and the location of AO and IM points were estimated.
    A sliding window was used to refine the location of AO. In a continuous wavelet
    transform (CWT) method was used to detect AO and IM points without reference to
    the ECG. In [11], an envelope based approach with machine learning technique was
    used for estimation of AO, and IM. The approach was used in two ways: with each
    ECG segment containing AO and IM as a reference signal.


    The data corresponds to ECG and ECG was extracted from the ''cebs'' database available
    on Phys repository [17]. The extracted database contains ECG, SCG, and respiratory
    records of 203 subjects in three states, baseline, exercise and recovery. The
    subjects were awake and in a supine position. In this paper, the baseline ECG
    and SCG records of three subjects were considered. A total of 948 cardiac cycles
    containing 5678, 664 (2005 points) cardiac cycles for IM, and 2864 (1625 points)
    cycles for AC.


    # ### III. METHODOLOGY


    In [12], the linear and the nonlinear component of cardiac vibrations were combined
    to annotate the annotation of IM and AO. The accelerometer and electrocardiogram
    components of cardiac vibrations, were used to learn and relate components. In
    [13], AO annotation without the reference R-wave was proposed. It used a wavelet-based
    domain multi-scale kurtosis (DMK) and multiscale central frequency (DMCF) methodology.
    The most probable sub-band containing AO was selected using DMR and DMCF techniques.
