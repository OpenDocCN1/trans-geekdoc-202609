    ## 7. 我们将使用 dnsmasq 完成此步骤


    Dnsmasq 是一个 **动态主机配置协议** (**DHCP**) 服务器，用于解析来自或发往机器的 DNS 请求，同时也充当 DHCP 服务器为客户端分配
    IP 地址。它速度快且非常适合我们的需求。我们将为 dnsmasq 创建一个配置文件并添加一些指令，就像之前对 `hostapd` 所做的那样。


    创建文件：


    ```

    nano dnsmasq.conf

    ```


    添加以下指令：


    ```

    interface=wlan0

    dhcp-range=192.168.1.2, 192.168.1.30, 255.255.255.0, 12h

    dhcp-option=3, 192.168.1.1

    dhcp-option=6, 192.168.1.1

    server=8.8.8.8

    log-queries

    log-dhcp

    listen-address=127.0.0.1

    ```


    *   `dhcp-range`：连接的网络客户端的 IP 地址范围。`12h` 是租约过期前的小时数。

    *   `dhcp-option=3`：网络的网关 IP。

    *   `dhcp-option=6`：用于 DNS 服务器，后跟 IP 地址。

    *   `server`：DNS 服务器的地址。

    *   `log-queries`：记录 dnsmasq 处理的 DNS 查询结果。

    *   `log-dhcp`：记录发送给 DHCP 客户端的所有选项以及用于确定它们的标签。

    *   `listen-address`：将 DHCP 绑定到本地 IP 地址 `127.0.0.1`。


    按 `Ctrl` + `X`，然后按 `Y`，最后按 `Enter`。现在 `dnsmasq.conf` 已配置完成。请参阅 Figure 7.24：


    ![](img/Figure-7.24.jpg)


    **Figure 7.24:** Nano dnsmasq.conf command


    ## 8. 分配接口网关、子网掩码并添加路由表


    请参阅 Figure 7.25：


    ```

    ifconfig wlan0 up 192.168.1.1 netmask 255.255.255.0

    route add -net 192.168.1.0 netmask 255.255.255.0 gw 192.168.1.1

    ```


    启动 DNS 服务器：


    ```

    dnsmasq -C dnsmasq.conf -d

    ```


    *   `dnsmasq -C`：指定一个不同的配置文件。

    *   `-d`：告诉它保持用户 ID 不变。


    ![](img/Figure-7.25.jpg)


    **Figure 7.25:** dnsmasq command


    ## 9. 转发流量以提供互联网访问


    为了给用户提供互联网访问，我们需要将流量从连接互联网的虚拟无线适配器 `eth0` 转发到 `wlan0mon`。这将帮助你执行各种攻击，从而完全控制用户设备。如果你不希望用户拥有互联网访问权限，请跳过此步骤。


    ```

    iptables --table nat --append POSTROUTING --out-interface eth0 -j MASQUERADE

    iptables --append FORWARD --in-interface wlan0 -j ACCEPT

    ```


    *   **第一条命令**：用于转发流量的接口名称。

    *   **第二条命令**：接收数据包的接口名称，或被转发到的接口。


    现在，执行此命令以启用 IP 转发：


    ```

    echo 1 > /proc/sys/net/ipv4/ip_forward

    ```


    请参阅 Figure 7.26：


    ![](img/Figure-7.26.jpg)


    **Figure 7.26:** iptables command


    ## 10. 测试伪造接入点


    通过扮演受害者来测试你的伪造接入点。连接到你的网络并访问任意网站；你应该能在终端中实时看到所有传输的数据包。一旦设备连接到网络，`hostapd` 将显示其
    MAC 地址。请参阅 Figure 7.27：


    ![](img/Figure-7.27.jpg)


    **Figure 7.27:** Fake Wi-Fi


    在运行 `dnsmasq` 的另一个终端窗口中，你将详细发现设备正在尝试访问的内容。例如，用户正在访问 `google.com`，如 Figure 7.28
    所示：


    ![](img/Figure-7.28.jpg)


    **Figure 7.28:** Victim is accessing google.com


    这展示了伪造接入点的强大威力。一旦目标连接上，你将拥有许多可用的攻击手段，最终可能控制用户的设备。


    # Preventing threats


    即使下一次入住酒店仅仅是每个网页重定向都充满了小猫图片，你也完全清楚这可能是危险的。好消息是我们仍然可以防御蜜罐和流氓接入点。以下是几种方法：


    *   **关闭 Wi-Fi**：确保安全的最简单方法是关闭 Wi-Fi。不使用 Wi-Fi 可以降低遭受这些攻击的安全风险。

    *   **不惜一切代价避免连接到开放 Wi-Fi 网络**：免费互联网很诱人，但如果有人拦截了所有网络流量怎么办？如果非必要，请勿使用开放 Wi-Fi 网络。

    *   **始终确保使用 HTTPS 链接，而非 HTTP**：仅从 HTTPS 页面下载。

    *   **建立安全的 VPN 连接**：如果开放网络是你唯一的选择，请始终使用安全的 VPN 连接。


    # Conclusion


    这是一个精彩的章节！我们涵盖了大量内容。让我们回顾一下你迄今为止学到的知识。在本章中，你学习了如何捕获未加密流量，了解了蜜罐攻击及其方法，以及如何使用 `hostapd`
    和 `dnsmasq` 创建伪造接入点，并学会了如何保护自己免受威胁。


    在接下来的章节中，你将学习如何拦截加密网络流量以及中间人攻击。


    # Questions


    1.  提及客户端攻击。

