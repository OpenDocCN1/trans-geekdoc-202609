- raw: "7.  We will be using dnsmasq for this step. Dnsmasq is a **Dynamic Host Configuration\
    \ Protocol** (**DHCP**) server that is used to resolve DNS requests from or to\
    \ a machine and also acts as a DHCP server to allocate IP addresses to the clients.\
    \ It is fast and serves a great purpose that fits our needs. We will create a\
    \ configuration file for dnsmasq and put some instructions in it, just like what\
    \ we did previously with hostapd. To create the file: \n\n    ` nano dnsmasq.conf`\n\
    \n    Add these instructions inside:\n\n    `interface=wlan0`\n\n    `dhcp-range=192.168.1.2,\
    \ 192.168.1.30, 255.255.255.0, 12h`\n\n    `dhcp-option=3, 192.168.1.1`\n\n  \
    \  `dhcp-option=6, 192.168.1.1`\n\n    `server=8.8.8.8`\n\n    `log-queries`\n\
    \n    `log-dhcp`\n\n    `listen-address=127.0.0.1`\n\n    *   `dhcp-range`: IP\
    \ address range for the connected network clients. 12h is the number of hours\
    \ until the lease expires.\n\n    *   `dhcp-option=3`: Gateway IP for the networks.\n\
    \n    *   `dhcp-option=6`: For DNS Server followed by IP address\n\n    *   `server`**:**\
    \ DNS server’s address\n\n    *   `log-queries`: Log the results of DNS queries\
    \ handled by dnsmasq.\n\n    *   `log-dhcp`: Log all the options sent to DHCP\
    \ clients and the tags used to determine them.\n\n    *   `listen-address`: Links\
    \ the DHCP to the local IP address, which is 127.0.0.1.\n\n    Press *Ctrl* +\
    \ *X*, then *Y*, and then *Enter*. Now, we are all set for `dnsmasq.conf`. Refer\
    \ to *[Figure 7.24](#c07.xhtml#fig7_24)*:\n\n    ![](images/Figure-7.24.jpg)\n\
    \n    **Figure 7.24:** Nano dnsmasq.conf command\n\n8.  Now, we need to assign\
    \ the interface a network gateway and netmask and then add the routing table.\
    \ Refer to *[Figure 7.25](#c07.xhtml#fig7_25):*\n\n    `ifconfig wlan0 up 192.168.1.1\
    \ netmask 255.255.255.0`\n\n    `route add -net 192.168.1.0 netmask 255.255.255.0\
    \ gw 192.168.1.1`\n\n    Start the DNS server by doing:\n\n    ` dnsmasq -C dnsmasq.conf\
    \ -d`\n\n    *   `dnsmasq -C`**:** Specifies a different configuration file.\n\
    \n    *   `-d`**:** Tells it to keep the user id without changing it.\n\n    ![](images/Figure-7.25.jpg)\n\
    \n    **Figure 7.25:** dnsmasq command\n\n9.  To provide the users with internet\
    \ access, we need to forward traffic from `eth0`, the virtual wireless adapter\
    \ that is connected to the internet, to `wlan0mon`. This will help you perform\
    \ various attacks that can give you complete access to the user’s device. If you\
    \ do not want the users to have internet access, skip this step. \n\n    `iptables\
    \ --table nat --append POSTROUTING --out-interface eth0 -j MASQUERADE`\n\n   \
    \ `iptables --append FORWARD --in-interface wlan0 -j ACCEPT`\n\n    **First command**:\
    \ Interface name that is used to forward traffic from.\n\n    **Second command**:\
    \ Interface name to receive the packets or the interface that is being forwarded\
    \ to.\n\n    Now, execute this command to enable IP forwarding:\n\n    ` echo\
    \ 1 > /proc/sys/net/ipv4/ip_forward`\n\n    Refer to *[Figure 7.26](#c07.xhtml#fig7_26)*:\n\
    \n    ![](images/Figure-7.26.jpg)\n\n    **Figure 7.26:** iptables command\n\n\
    10.  Test out your fake access point by playing the victim. Connect to your network\
    \ and access any website you like; you should be able to see all the packets transmitted\
    \ on the fly in the terminal. Hostapd will show the mac address as soon as a device\
    \ has connected to the network. Refer to *[Figure 7.27](#c07.xhtml#fig7_27)*:\
    \ \n\n     ![](images/Figure-7.27.jpg)\n\n     **Figure 7.27:** Fake Wi-Fi\n\n\
    \     On the other terminal window where dnsmasq is running, you will find out\
    \ what the device is trying to access in detail. For this example, the user is\
    \ accessing google.com, as shown in *[Figure 7.28](#c07.xhtml#fig7_28):*\n\n \
    \    ![](images/Figure-7.28.jpg)\n\n     **Figure 7.28:** Victim is accessing\
    \ google.com\n\nThis shows how powerful a fake access point can be. Once you get\
    \ your targets connected, you will have many attacks available that could eventually\
    \ control the user’s device.\n\n# [Preventing threats](#toc.xhtml#s126a)\n\nSo,\
    \ even if the next hotel stay is merely flooded with kittens on each Web page\
    \ redirection, you are completely aware that it could be dangerous. The good news\
    \ is that we can still defend ourselves against honeypots and rogue access points.\
    \ The following are a few of them:\n\n*   **Turn off Wi-Fi**: The simplest solution\
    \ to ensure your security is to turn off Wi-Fi. You are decreasing your security\
    \ risk of these assaults by not using Wi-Fi.\n\n*   **Avoid connecting to open\
    \ Wi-Fi networks at all costs**: Free Internet is appealing, but what if someone\
    \ is intercepting all network traffic? Do not use open Wi-Fi networks if you do\
    \ not have to.\n\n*   **Always make sure to use HTTPs links, not HTTP:** Only\
    \ download from HTTPs pages.\n\n*   **Establish a safe VPN connection**: Always\
    \ use a secure VPN connection if an open network is your only option.\n\n# [Conclusion](#toc.xhtml#s127a)\n\
    \nThis was a fantastic chapter! We went over a lot of stuff. Let us look back\
    \ at what you have learned so far. In this chapter, you learned how to capture\
    \ unencrypted traffic and learned about honeypot attacks and methods, as well\
    \ as how to use hostapd and dnsmasq to create a fake access point and how to protect\
    \ yourself from threats.\n\nYou will learn how to intercept encrypted network\
    \ traffic and about man-in-the-middle attacks in the upcoming chapter.\n\n# [Questions](#toc.xhtml#s128a)\n\
    \n1.  Mention the client-side attacks.\n\n2.  What is the meaning of Honeypot?\n\
    \n3.  How do you create a Fake Access Point in detail?\n\n4.  How safe yourself\
    \ from a fake access point?\n\n# [CHAPTER 8](#toc.xhtml#c08)\n\n# [Advanced Wireless\
    \ Attacks](#toc.xhtml#c08)\n\n# [Introduction](#toc.xhtml#s129a)\n\nAs a penetration\
    \ tester, it is important to know the advanced attacks a hacker can do, even if\
    \ you might not check or demonstrate them during a penetration test. This chapter\
    \ demonstrates how a hacker might launch advanced attacks using wireless access\
    \ as a starting point.\n\nIn this chapter, we will look at how we can use what\
    \ we have learned so far to carry out advanced attacks. We will concentrate on\
    \ the **man-in-the-middle** (**MITM**) attack, which requires a certain level\
    \ of ability and practice to execute well. Once we have done that, we will use\
    \ this MITM attack as a springboard for more advanced attacks like eavesdropping\
    \ and session hijacking. Then, we will use Metasploit to exploit the victim. Finally,\
    \ we will list actions to prevent these threats.\n\n# [Structure](#toc.xhtml#s130a)\n\
    \nThe following topics will be covered in this chapter:\n\n*   Capturing unencrypted\
    \ traffic\n\n*   MITM attack\n\n*   Metasploit\n\n*   Preventions\n\n# [Objectives](#toc.xhtml#s131a)\n\
    \nIn this chapter, you will learn how to conduct advanced attacks using wireless,\
    \ where you will create a setup for a MITM attack over wireless and then use it\
    \ to eavesdrop on the victim’s traffic. Then, you will use the same setup to hijack\
    \ the application layer of the victim (Web traffic, to be specific) using a DNS\
    \ poisoning attack and how to use Metasploit. Finally, you will learn how to prevent\
    \ these threats.\n\n# [Capturing unencrypted traffic](#toc.xhtml#s132a)\n\nWe\
    \ know that anyone connected to the same wireless network can read unencrypted\
    \ wireless traffic in plain text, as shown in *[Figure 8.1](#c08.xhtml#fig8_1)*.\
    \ Your e-mail, instant messages, FTP files, telnet connections, HTTP sessions,\
    \ and other data may be hacked. What is the mechanism behind this? When a user\
    \ browses a website using HTTP, the data they send is not encrypted from beginning\
    \ to end; thus, it can be intercepted and recorded by anyone on the same network:\n\
    \n![](images/Figure-8.1.jpg)\n\n**Figure 8.1:** Unncrypted connection\n\nWireshark\
    \ is a network analyzer that allows you to examine and save live network packets.\
    \ Wireshark is compatible with Windows, Mac OS X, Linux, and Unix. If a person\
    \ runs Wireshark on a network, they can observe what websites people visit, what\
    \ files are being moved, what instant messages are being sent, and much more."
