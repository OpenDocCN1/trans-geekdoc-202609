    \ up WPA and WPA2 Cracking\n\nAs we saw in the last section, if we have the right\
    \ password in our dictionary, breaking WPA2-Personal is a piece of cake. So, why\
    \ do we not simply compile a massive dictionary of millions of commonly used passwords\
    \ and phrases? This would be extremely beneficial to us, and we would almost always\
