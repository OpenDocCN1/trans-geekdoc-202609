- raw: "2.  Next, go to the program and select `Send Using Certificate Pinning` under\
    \ `Network Layer Security`.\n\n3.  Note that data can be intercepted by avoiding\
    \ SSL Pinning. Refer to *[Figure 11.20](#c11.xhtml#fig11_20):*\n\n    ![](images/Figure-11.20.jpg)\n\
    \n    **Figure 11.20:** Proxy settings\n\nThe following list includes a variety\
    \ of tools that can be used to avoid jailbreak detection:\n\n*   **Frida**: **[https://codeshare.frida.re/](https://codeshare.frida.re/)**\n\
    \n*   **SSLKillSwitch2**: **[https://github.com/nabla-c0d3/ssl-kill-switch2](https://github.com/nabla-c0d3/ssl-kill-switch2)**\n\
    \n# [Bypassing biometric (local) authentication](#toc.xhtml#s226a)\n\nLet us now\
    \ see how we can bypass biometric (local) authentication using various methods.\n\
    \n**Using objection**\n\n1.  Run the following commands on your system, as shown\
    \ in *[Figure 11.21](#c11.xhtml#fig11_21)*: \n\n    `objection -g DVIA-v2 explore`\n\
    \n    `ios ui biometrics_bypass exit`\n\n    ![](images/Figure-11.21.jpg)\n\n\
    \    **Figure 11.21:** Bypassing biometric using objection\n\n2.  Next, open the\
    \ app and select `Touch/Face ID Bypass` | `Start Challenge` | `Swift Implementation`,\
    \ as shown in *[Figure 11.22](#c11.xhtml#fig11_22):*\n\n    ![](images/Figure-11.22.jpg)\n\
    \n    **Figure 11.22:** Face not recognized\n\n3.  When the application prompts\
    \ you with `Face Not Recognized`, select `Cancel` to avoid authentication, as\
    \ shown in *[Figure 11.23](#c11.xhtml#fig11_23):*\n\n    ![](images/Figure-11.23.jpg)\n\
    \n    **Figure 11.23:** Authentication successful\n\n# [Checking for sensitive\
    \ data exposure in local](#toc.xhtml#s227a)\n\nThe sensitive data is kept in local\
    \ storage in a number of different locations. The different locations where you\
    \ can locate sensitive data and how to launch an attack are listed as follows.\n\
    \nOpen the DVIA-v2 application, then select `Local Data Storage`. Save some data\
    \ using each of the available choices.\n\n# [Sensitive data in Plist](#toc.xhtml#s228a)\n\
    \n**Case 1: Store sensitive data in Plist.**\n\nFollow the given steps:\n\n1.\
    \  Run the following commands: \n\n    `objection -g DVIA-v2 explore`\n\n    `env`\n\
    \n    `cd /var/mobile/Containers/Data/Application/<app-id>/Documents`\n\n    `ios\
    \ plist cat userInfo.plist`\n\n2.  Keep in mind that the sensitive data is kept\
    \ as plain text, as shown in *[Figure 11.24](#c11.xhtml#fig11_24):* \n\n    ![](images/Figure-11.24.jpg)\n\
    \n    **Figure 11.24:** iOS plist cat userInfo.plist command\n\n# [Sensitive data\
    \ in UserDefaults](#toc.xhtml#s229a)\n\n**Case 2: Store Sensitive Data in UserDefaults**\n\
    \nFollow the given steps:\n\n1.  Run the following commands: \n\n    `objection\
    \ -g DVIA-v2 explore`\n\n    `ios nsuserdefaults get`\n\n2.  You can see that\
    \ the sensitive data is contained in the `DemoValue` parameter as plain text,\
    \ as shown in *[Figure 11.25](#c11.xhtml#fig11_25):*\n\n    ![](images/Figure-11.25.jpg)\n\
    \n    **Figure 11.25:** iOS “nsuserdefaults get” command\n\n# [Sensitive data\
    \ in keychain](#toc.xhtml#s230a)\n\n**Case 3: Store sensitive data in keychain**\n\
    \nFollow the given steps:\n\n1.  Run the following commands: \n\n    `objection\
    \ -g DVIA-v2 explore`\n\n    `ios keychain dump`\n\n2.  Take note that the password\
    \ is saved in plain text as sensitive data (Super Secure Password), as shown in\
    \ *[Figure 11.26](#c11.xhtml#fig11_26):*\n\n    ![](images/Figure-11.26.jpg)\n\
    \n    **Figure 11.26:** iOS keychain dump command\n\nFor the remaining attacks,\
    \ we will employ the Grapefruit tool (**[https://github.com/ChiChou/grapefruit](https://github.com/ChiChou/grapefruit)**).\
    \ Installing, starting, and connecting your iPhone to the application.\n\n# [Sensitive\
    \ data in core data](#toc.xhtml#s231a)\n\n**Case 4: Store sensitive data in core\
    \ data**\n\nFollow the given steps:\n\n1.  Open Grapefruit and load the DVIA-v2\
    \ application. Go to the following: `Data` | `Library` | `Application Support`.\n\
    \n2.  Open `Model.sqlite`.\n\n3.  Be aware that private data is reachable. Refer\
    \ to *[Figure 11.27](#c11.xhtml#fig11_27)*: \n\n    ![](images/Figure-11.27.jpg)\n\
    \n    **Figure 11.27:** Sensitive data in core data\n\n# [Sensitive data in couchbase\
    \ lite](#toc.xhtml#s232a)\n\n**Case 5: Store sensitive data in couchbase lite**\n\
    \nFollow the given steps:\n\n1.  Load the DVIA-v2 application with Grapefruit\
    \ and navigate to the following: `Data` | `Library` | `Application Support` |\
    \ `CouchbaseLite` | `dvcouchbasedb.cblite2`.\n\n2.  Download db.sqlite3, open\
    \ it, and you will be able to see the sensitive information.\n\n# [Sensitive data\
    \ in YapDatabase](#toc.xhtml#s233a)\n\n**Case 6: Store sensitive data in YapDatabase**\n\
    \nFollow the given steps:\n\n1.  Load the DVIA-v2 application with Grapefruit\
    \ and navigate to the following: `Data` | `Library` | `Application Support`.\n\
    \n2.  Download `YapDatabase.sqlite` and open it with SQLite Viewer.\n\n3.  You\
    \ will be able to access sensitive data.\n\n# [OWASP mobile top 10](#toc.xhtml#s234a)\n\
    \nThe OWASP mobile top 10 is a ranking of the security threats that mobile applications\
    \ face, compiled from research and user feedback.\n\n# [M1: Improper platform\
    \ usage](#toc.xhtml#s235a)\n\nThe first OWASP mobile top 10 category focuses on\
    \ the areas where an attacker may abuse the security features offered by the iOS\
    \ platform. Additionally, several security vulnerabilities may occasionally develop\
    \ as a result of improper platform feature implementation.\n\nUnder this area,\
    \ a number of components, including Biometric Authentication, Keychain, Platform\
    \ Permission, and so on, must be examined.\n\n# [M2: Insecure data storage](#toc.xhtml#s236a)\n\
    \nMany times, iOS applications save certain data locally in various parts. If\
    \ an attacker gains access to the user’s physical device, there is a potential\
    \ that sensitive data will be saved locally and could be used against the user.\n\
    \nHere are a few examples of the general dangers that fall into this category:\n\
    \n*   Sensitive data stored in Plist\n\n*   Sensitive data stored in UserDefaults\n\
    \n*   Sensitive data stored in Keychain\n\n*   Sensitive data stored in core data\n\
    \n*   Sensitive data stored in Webkit Caching\n\n*   Sensitive data stored in\
    \ Realm\n\n*   Sensitive data stored in Couchbase Lite\n\n*   Sensitive data stored\
    \ in YapDatabase\n\n*   URL caching (both request and response)\n\n*   Keyboard\
    \ press caching\n\n*   Copy/paste buffer caching\n\n*   Insecure logging\n\n*\
    \   Background screen caching\n\n*   Analytics data sent to third parties\n\n\
    # [M3: Insecure communication](#toc.xhtml#s237a)\n\nClient-server architecture\
    \ is used for communication in the iOS application. An attacker can try to steal\
    \ critical information over unencrypted checks, perform Man-in-the-Middle attacks,\
    \ or try to study the request and answer by capturing them using proxy tools like\
    \ Burp Suite due to faulty or inadequate implementation of communication standards\
    \ like communication over HTTP.\n\nHere are a few examples of the general dangers\
    \ that fall into this category:\n\n*   Lack/bypass-able SSL pinning\n\n*   Communication\
    \ over HTTP \\[unencrypted communication\\]\n\n*   Plain-text submission of sensitive\
    \ information\n\n*   Logging sensitive information in the logs\n\n# [M4: Insecure\
    \ authentication](#toc.xhtml#s238a)\n\nApplications are typically categorized\
    \ as having insecure authentication when they either improperly handle authentication\
    \ checks or permit attackers to modify login/authentication requests in order\
    \ to access the target user’s account.\n\nHere are a few examples of the general\
    \ dangers that fall into this category:\n\n*   Guessable/weak/default credentials\n\
    \n*   Authentication bypass using attacks such as injection attacks\n\n# [M5:\
    \ Insufficient cryptography](#toc.xhtml#s239a)\n\nThe user data is frequently\
    \ stored by iOS applications or used in various client-server queries. An attacker\
    \ may try to access data that is encrypted using a weak cryptographic approach\
    \ due to a lack of strong cryptography and obtain sensitive data in this way.\n\
    \nHere are a few examples of the general dangers that fall into this category:\n\
    \n*   Stealing app and user data\n\n*   Accessing encrypted files\n\n*   Accessing\
    \ encrypted client-server request endpoints\n\n# [M6: Insecure authorization](#toc.xhtml#s240a)"
