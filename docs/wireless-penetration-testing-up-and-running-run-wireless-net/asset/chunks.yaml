    # 漏洞评估


    漏洞评估通常由白帽黑客或受过训练的道德黑客执行；然而，黑帽黑客偶尔也会将其用于恶意目的。他们可以执行漏洞评估，以了解更多关于他们可以通过他人的网络访问什么内容。安全专家可以利用这些方法访问漏洞，从而发现差距并提供建议和对策以防止攻击。


    ## 结构


    在本章中，我们将讨论以下主题：


    *   规划评估

    *   设置漏洞扫描器

    *   运行漏洞扫描器

    *   运行 Nessus

    *   生成报告

    *   解决漏洞


    ## 目标


    在本章中，您将能够规划评估，了解评估的关键组成部分，以及评估的分步流程。您将能够安装 Nessus、注册它、下载插件，然后运行 Nessus。您将能够创建新策略和扫描、识别漏洞、阅读漏洞详情，并针对漏洞采取解决方案。


    ## 规划评估


    在执行评估之前，我们需要先规划评估。我们首先要问自己一系列关于评估的问题。让我们开始吧！


    ### 我们将如何花费时间和资源？


    如果您要为个人或公司进行评估，您将需要估算完成任务需要多长时间。提前了解您将使用什么来完成评估也是个好主意。


    ### 您是否有足够的支持证据来证明您的发现？


    在整个漏洞评估过程中，最好再次确认您是否拥有足够的数据来涵盖您所做的任何发现。当您开始生成报告时，您需要知道每个漏洞是什么以及它是如何运作的。提供概念验证也是个好主意。


    ### 当检测并识别出漏洞时，解决该问题的最佳方式是什么？


    这是一个难以回答的问题，因为它取决于威胁的严重程度。最常见的做法是确保您拥有最新更新、升级软件、关闭任何未使用的后台服务，并添加任何额外的安全功能，如复杂密码和双因素认证。通知供应商该漏洞。


    ### 我们如何提高检测率并将安全威胁降至最低？


    具有 IDS 和 IPS 监控功能的商用硬件防火墙——能够即时检测攻击的主动扫描器。在其硬件防火墙和统一威胁管理系统中，WatchGuard 提供了出色的安全模块，如数据包过滤、入侵防御服务、应用控制、Web
    拦截器、网关防病毒、垃圾邮件拦截器等。为将风险降至最低，请确保您的软件和硬件始终保持最新。


    进行良好的评估需要一个客观且合乎逻辑的计划。


    ## 漏洞评估计划的组成部分


    我们将介绍漏洞评估策略的几个关键要素。例如，请考虑以下内容：


    ### 主要目标


    *   该目标如何处理？

    *   如何访问该目标？

    *   谁参与评估？

    *   供应商端有哪些补丁可用？

    *   识别常见漏洞

    *   总结


    ### 首要目标


    *   识别问题


    ### 次要目标


    *   提供临时或永久的解决方案


    ### 第三、第四目标等


    *   视情况而定，可能需要额外的目标。


    ## 规划漏洞评估流程


    在本节中，我们将通过一个示例来了解如何规划漏洞评估：


    ### 目标


    *   是否有可用的开放网络？如果有，它们用于什么？


    ### 标准


    *   该目标的优先级是什么？


    ### 策略


    *   如果网络上有未经授权的用户，他们会对工作站或服务器造成损害吗？

    *   他们是否在单独的 VLAN 或子网上？


    ### 方法


    *   我们可以做些什么来达到目标？


    ### 时间


    *   有截止日期吗？

    *   何时可以提供解决方案？


    ### 结果


    *   谁需要知道结果？

    *   我们如何防止未来未经授权的用户访问？


    这应该能让您很好地理解如何设计自己的漏洞分析。在为个人或企业提供服务时，请将其作为指南。之后，我们将设置漏洞扫描器。我们将要了解的漏洞扫描器是 Nessus。


    在开始设置漏洞扫描器之前，了解什么是漏洞扫描器以及它为何如此重要至关重要。漏洞扫描器正如其名。它是一种程序或软件安全工具，用于查找计算机、设备和网络中的缺陷。在大多数情况下，它会立即通知您面临的是低、中还是严重的安全危险。从安全专家的角度来看，这对于进一步分析什么可能威胁个人或公司非常有用。


    如果黑帽黑客利用该工具并利用给定的漏洞，他们可能会迅速获得对机密信息或公司数据的未经授权访问。在企业网络上，防范漏洞扫描器的唯一方法是将每个部门划分到不同的
    VLAN 中，实施强组策略以防止不受信任的可执行文件和安装，限制闪存驱动器的使用，并提供任何形式的保护以防止运行未经授权的程序。员工应仅运行有助于完成其任务的产品；通过启用
    URL 拦截器并添加安全功能，网站可以迅速切断这些用户。


    了解什么是漏洞扫描器至关重要。因为如果硬件防火墙有一个本不该开启的服务或端口处于开启状态，该工具在确定什么可能是您系统甚至整个网络的后门方面可能非常有用。防火墙和路由器的默认设置很棒，因为它们开箱即用，对吧？错！关闭任何未使用的服务并阻止任何未使用的端口（如
    `FTP`、`RDP`、`SSH` 和 `Telnet`）至关重要。


    在 Kali Linux 中，我们将使用 Nessus 漏洞扫描器。Nessus 是由 Tenable Network Security 创建的专有综合漏洞扫描器。他们出售个人版和商业版软件许可证。对于演示，我们将使用个人版。


    Nessus 是最广泛使用的漏洞扫描器之一。目前全球有超过 80,000 个组织在使用它。Nessus 是一种自动检测已知安全缺陷的工具。Nessus 最好的功能之一是它既可以作为客户端也可以作为服务器使用。它可以联网，允许从任何位置执行扫描。支持
    Microsoft Windows、Mac OS X、Linux、FreeBSD、Solaris 和 IBM/AIX。对于渗透测试人员来说，报告功能非常有用。


    Nessus 将检测以下内容：


    *   提供远程访问的漏洞

    *   对系统上敏感数据的访问

    *   配置错误的系统（缺失安全补丁、开放端口等）

    *   常用密码、默认密码和空密码

    *   通过畸形数据包实施的拒绝服务攻击

    *   PCI DSS 审计

    '
