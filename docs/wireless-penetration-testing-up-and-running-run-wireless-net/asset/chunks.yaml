    # [Conclusion](#toc.xhtml#s17a)


    This chapter gave you step-by-step directions for setting up your own wireless
    lab. You also learned the fundamentals of installing Kali on your hard drive and
    experimenting with virtual machines (VMWare) and take some knowledge about wireless
    penetration testing tools such as Wireshark and Aircrack-ng. You also learned
    how to use the Web interface to configure your access point. Finally, you learned
    how to configure and use your wireless adaptor, and you must first learn and perform
    numerous commands for verifying the status of the wireless client’s connection
    to the access point.


    Now, you are ready to move on to *[Chapter 2: Wireless Attacking Techniques and
    Methods](#c02.xhtml)*.


