- raw: "4.  **d2j-dex2jar:** It is a tool for working with `.dex` and `.jar` files\
    \ for Android. This facilitates `.dex` file to .class file conversion (zipped\
    \ jar files), as shown in *[Figure 10.55](#c10.xhtml#fig10_55).* D2J-Dex2jar can\
    \ be downloaded from **[https://github.com/pxb1988/dex2jar](https://github.com/pxb1988/dex2jar)**:\
    \ \n\n    ![](images/Figure-10.55.jpg)\n\n    **Figure 10.55:** d2j-dex2jar tool\n\
    \n5.  **JD-GUI:** JD-GUI is a stand-alone graphical tool that shows the class\
    \ files’ Java source code, as shown in *[Figure 10.56](#c10.xhtml#fig10_56).*\
    \ JD-GUI can be downloaded from **[https://github.com/java-decompiler/jd-gui](https://github.com/java-decompiler/jd-gui)**:\
    \ \n\n    ![](images/Figure-10.56.jpg)\n\n    **Figure 10.56:** JD-GUI tool\n\n\
    6.  **Objection:** Frida-powered Objection is a runtime mobile exploration toolkit,\
    \ as shown in *[Figure 10.57](#c10.xhtml#fig10_57)*. Without requiring a jailbroken\
    \ or rooted mobile device, it was designed to assist in evaluating mobile applications\
    \ and their security posture. This tool’s features include the following: \n\n\
    \    *   Bypassing SSL pinning and Root detection\n\n    *   Remove Android Heap\
    \ and Keystore\n\n    *   Tracks the copy/paste buffer cache on Android\n\n  \
    \  *   Hook one or more runtime methods of a class\n\n    *   Run unique Frida\
    \ scripts\n\n    *   Use Android intents where necessary\n\n    You can get it\
    \ from **[https://github.com/sensepost/objection](https://github.com/sensepost/objection)**:\n\
    \n    ![](images/Figure-10.57.jpg)\n\n    **Figure 10.57:** Objection tool\n\n\
    # [Secure android applications](#toc.xhtml#s194a)\n\nFor app developers that want\
    \ to construct safe apps, the OWASP mobile top 10 list is an excellent reference.\
    \ This is due to the fact that many mobile apps are naturally open to security\
    \ vulnerabilities. Let us consider a handful of assaults against mobile apps that\
    \ have happened in recent years. There was Pegasus spyware for WhatsApp, which\
    \ gave attackers access to users’ smartphones. Another was the assault on the\
    \ Pokémon Go app, which was vulnerable to reverse engineering by users who wanted\
    \ to catch more Pokémon.\n\nNumerous additional applications and businesses, such\
    \ as Tinder and MediaTek, have experienced mobile security assaults. But why are\
    \ they so defenseless? As mobile apps can be downloaded from public shops and\
    \ the code can be examined, they have a larger attack surface than Web apps. Together\
    \ with the volume of user data they can gather, this makes us highly alluring\
    \ targets for hackers.\n\nThe most prevalent security weaknesses discovered on\
    \ mobile devices are listed in the OWASP mobile top 10 vulnerabilities. But what\
    \ vulnerabilities are listed on the OWASP mobile security list?\n\n# [OWASP mobile\
    \ top 10 vulnerabilities](#toc.xhtml#s195a)\n\nThe open Web application Security\
    \ Project foundation presented the OWASP mobile security risks for the first time\
    \ in 2011 based on comments and survey data gathered from the global community.\
    \ Following that, additional lists were published in 2014 and 2016; the latter\
    \ is the most recent and up-to-date OWASP mobile top 10 list.\n\nWhile there is\
    \ one precise carryover from the top 10 mobile dangers list from 2014, the categories\
    \ for the 2016 list are primarily different. For instance, two new dangers were\
    \ added to the 2016 list while removing one item from the 2014 list. Additionally,\
    \ they divided several categories into two to be addressed separately. Refer to\
    \ *[Figure 10.58](#c10.xhtml#fig10_58)*:\n\n![](images/Figure-10.58.jpg)\n\n**Figure\
    \ 10.58:** A side-by-side comparison of OWASP 2014 and 2016 mobile risks\n\nIn\
    \ light of this, let us examine the 10 mobile dangers that were ultimately selected\
    \ in 2016 and consider how you might address these risks.\n\n# [Improper platform\
    \ usage](#toc.xhtml#s196a)\n\nImproper platform usage is ranked as the top mobile\
    \ security vulnerability in the most recent OWASP mobile top 10 ranking. Whether\
    \ you use Android or iOS, each of these platforms is expected to follow specific\
    \ development standards for security reasons. Apps may, however, unintentionally\
    \ transgress these best practices and established recommendations or make mistakes\
    \ during their implementation. This initial mobile security risk focuses on that.\n\
    \nThe exploitation of any platform functionality of the Android or iOS operating\
    \ system or the disregard for platform security rules are considered threats.\
    \ This includes concerns with the erroneous usage of platform elements and security\
    \ controls that are a part of the mobile operating system, such as:\n\n*   Unauthorized\
    \ access to the device may come through misuse of the iOS Touch ID function.\n\
    \n*   Using the iOS Keychain incorrectly, such as by keeping session keys in the\
    \ app’s local storage.\n\n*   Requesting too many or the incorrect platform permissions.\n\
    \n*   Android intents that are marked public may leak sensitive information or\
    \ allow unauthorized execution (used to request an action from another app component).\n\
    \n**Remediation measures for this vulnerability:**\n\nYou need to take care of\
    \ this OWASP mobile security issue on the server end of things. Using secure coding\
    \ techniques and implementing the proper configuration settings on the server\
    \ side, in addition to adhering to platform development rules, reduces risks.\
    \ The following are some additional mitigation measures to stop platforms from\
    \ being misused:\n\n*   Restricting access, implementing restrictive file permissions,\
    \ preventing apps from interacting with one another, and so on.\n\n*   Applying\
    \ the most stringent protection class for iOS keychains and following recommended\
    \ practices to prevent shoddy control implementation\n\n# [Insecure data storage](#toc.xhtml#s197a)\n\
    \nInsecure data storage comes in second on the OWASP mobile top 10 lists. It is\
    \ possible for your mobile device to disappear or be stolen and end up in the\
    \ hands of an enemy. Or the attacker might use malware that runs on the device\
    \ and acts on their behalf to exploit flaws that let personal information leak\
    \ and give them access to sensitive data.\n\nAlthough it is not always possible\
    \ to create apps that do not save data, it is essential to do it safely and, in\
    \ a location, where neither another app nor a person would be able to access it.\
    \ Dev teams must never assume that attackers will not have access to filesystems\
    \ if they are readily available. Jailbreaking or rooting a mobile device is sufficient\
    \ to get around encryption security.\n\n**Remediation measures for this vulnerability:**\n\
    \nTo comprehend what information assets are processed by the application and how\
    \ the APIs handle the data, the threat model the app. By doing this, you can:\n\
    \n*   Analyze the effectiveness of the encryption process and the security of\
    \ the encryption keys.\n\n*   Implement technologies, such as buffer overflow\
    \ protection and obfuscation, to harden the code against tampering.\n\n*   Wherever\
    \ possible, avoid caching or storing data.\n\n*   Implement reliable authorization\
    \ and authentication checks.\n\n# [Insecure communication](#toc.xhtml#s198a)\n\
    \nIn the OWASP mobile top 10 list for 2016, insecure communication comes in third.\
    \ Anyone keeping an eye on the network can intercept and read all the information\
    \ being transferred over the wire if the data is sent in cleartext and unencrypted.\n\
    \nClient-server data interchange is ubiquitous in mobile apps, and this data must\
    \ be securely delivered through the device’s carrier network and the internet.\
    \ Cell towers, proxies, spyware installed on your device, or an enemy compromising\
    \ your Wi-Fi can all intercept the traffic. What can you do, then, to lessen the\
    \ risks involved in this kind of data exchange?\n\n**Remediation measures for\
    \ this vulnerability:**\n\n*   Use industry-standard encryption techniques and\
    \ other general best practices to prevent data theft as it moves across the network.\n\
    \n*   To secure all communication channels, use SSL/TLS certificates issued by\
    \ reputable **certificate authorities** (**CA**)."
