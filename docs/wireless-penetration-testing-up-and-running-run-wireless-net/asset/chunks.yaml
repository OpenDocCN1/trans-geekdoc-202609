    \ we now use `Cowpatty` to crack the WPA passphrase:\n\n    ```\n    cowpatty\
    \ -d PMK-Wireless-Lab -s “Wireless Lab” -r wpacracking-05.cap\n    ```\n\n   \
    \ ![](images/Figure-4.20.jpg)\n\n    **Figure 4.20:** Cowpatty command\n\n   \
    \ `Cowpatty` uses the pre-calculated PMKs to crack the key in approximately 6\
    \ seconds.\n\n3.  With the same dictionary file, we now run `aircrack-ng`, and\
