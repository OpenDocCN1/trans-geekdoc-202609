    \ 撰写初稿\n*   审查与定稿\n\n```\n![](img/Figure-12.1.jpg)\n```\n\n**图 12.1：** 报告撰写阶段\n\
    \n# 报告规划\n\n报告规划始于目标，这有助于读者理解渗透测试的关键发现。本节解释测试目的、渗透测试的优势等。其次，测试所需时间包含在报告规划过程中。\n\
