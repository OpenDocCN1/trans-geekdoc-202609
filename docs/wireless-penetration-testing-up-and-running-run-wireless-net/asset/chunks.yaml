    \ can also read a collection of free technical articles, sign up for a range of\
    \ free newsletters, and receive exclusive discounts and offers on BPB books and\
    \ eBooks.\n\n# Piracy\n\nIf you come across any illegal copies of our works in\
    \ any form on the internet, we would be grateful if you would provide us with\
    \ the location address or website name. Please contact us at [**business@bpbonline.com**](mailto:business@bpbonline.com)\
    \ with a link to the material.\n\n# If you are interested in becoming an author\n\
    \nIf there is a topic that you have expertise in, and you are interested in either\
    \ writing or contributing to a book, please visit [**www.bpbonline.com**.](http://www.bpbonline.com/)\
    \ We have worked with thousands of developers and tech professionals, just like\
    \ you, to help them share their insights with the global tech community. You can\
    \ make a general application, apply for a specific hot topic that we are recruiting\
    \ an author for, or submit your own idea.\n\n# Reviews\n\nPlease leave a review.\
    \ Once you have read and used this book, why not leave a review on the site that\
    \ you purchased it from? Potential readers can then see and use your unbiased\
    \ opinion to make purchase decisions. We at BPB can understand what you think\
    \ about our products, and our authors can see your feedback on their book. Thank\
    \ you!\n\nFor more information about BPB, please visit [**www.bpbonline.com**.](http://www.bpbonline.com/)\n\
    \n# [CHAPTER 1](#toc.xhtml#c01)\n\n# [Wireless Penetration Testing Lab Setup](#toc.xhtml#c01)\n\
    \n# [Introduction](#toc.xhtml#s1a)\n\nThis book provides useful information to\
    \ protect you. We cannot guarantee your 100% safety. It provides what administrators\
    \ need to understand about the potential security threats that can occur at any\
    \ time. As you know, there are risks while dealing with data, as anyone can access\
    \ the data that is unauthorized to access it.\n\nThis chapter will focus on the\
    \ benefits of advanced wireless penetration testing and the skills needed to use\
    \ it so that you will understand the upcoming chapters. There are also key factors\
    \ in this chapter that must be understood, such as understanding Kali Linux, knowledge\
    \ of wireless cards, and some important tools that must be used.\n\n**Question**:\
    \ Why do we test for penetration in wireless networks?\n\n**Answer**:\n\n*   To\
    \ avoid network data breaches that cost organizations millions of dollars because\
    \ of viruses, worms, Trojan horses, and illegal activities, wireless penetration\
    \ testing helps us avoid these risks before they occur.\n\n*   To assess security\
    \ vulnerabilities in terms of importance, we can rank or identify the most important\
    \ threats to the organization and prevent attacks before they occur.\n\n*   To\
    \ set regulations and policies to protect employees.\n\nThe best benefit of wireless\
    \ penetration testing is security awareness, as it is very important to understand\
    \ how attackers penetrate these networks and what they can do just to gain access\
    \ to them.\n\n**Question:** What are attackers looking for on your system or network?\
    \ Is the data valuable or not?\n\nAlways ask yourself in the form of *What if*?\
    \ For example, why would an attacker gain access to his online bank account? Could\
    \ he buy anything? What if the attacker obtains security clearance for your workplace?\
    \ Could he cause harm to your business? These are just a few examples.\n\n**Remember\
    \ that** this book is designed to focus on advanced wireless hacking news. It\
    \ will focus on understanding the hidden principles behind various attacks on\
    \ wireless networks. You will learn the following:\n\n*   Detailed understanding\
    \ of wireless network security.\n\n*   How to find weaknesses in wireless networks\
    \ and how to introduce different types of Wi-Fi attacks. It will also explain\
    \ the best security practices to follow when setting up a wireless network.\n\n\
    **Question:** Who should read this book?\n\n**Answer:** Who will be interested\
    \ in this book? Certainly not for everyone, but I hope it will be for most network\
    \ administrators or information security professionals. This book will provide\
    \ hack prevention methods in nearly every chapter. I think prevention coverage\
    \ is very important because you will not only know how to protect yourself but\
    \ also the threats that exist in the real world.\n\n**All large or small wireless\
    \ networks serve the same use, which is access to a network via a wireless frequency\
    \ (without cable), whether the device is a computer or a mobile phone. In our\
    \ society today, we see more users being hacked, especially in Wi-Fi networks.\
    \ There may be some problems in Wi-Fi networks, such as there may be an open wireless\
    \ network, there may be weak encryption, or they are maybe minor authentication\
    \ problems.**\n\n# [Structure](#toc.xhtml#s2a)\n\nIn this chapter, we will discuss\
    \ the following topics:\n\n*   Hardware requirements\n\n*   Software requirements\n\
    \n*   Downloading and installing Kali Linux\n\n*   Wireless penetration testing\
    \ tools\n\n*   Configuring an access point setting\n\n*   Installing Wireless\
    \ Adaptor\n\n*   Connecting to the access point\n\n# [Objectives](#toc.xhtml#s3a)"
