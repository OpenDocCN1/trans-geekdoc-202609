  trans: "\n我们需要知道网络中是否有运行 Windows 7 的客户端。用户明白他们处于危险之中，因为他们运行的是过时版本的 Windows。几分钟内，Windows\
    \ 7 就可能被黑客攻破！Microsoft 于 2020 年 1 月停止支持 Windows 7。由于 Windows 7 不再维护，攻击者将蜂拥而至，试图在这一版本的操作系统中寻找漏洞。原因在于\
    \ Microsoft 将不再提供安全补丁，这意味着一旦攻击者发现系统漏洞，该漏洞将无限期地处于易受攻击状态。\n\n我们将使用各种网络工具来弄清网络上有多少主机、它们运行什么操作系统、网络规模有多大，以及哪些主机存在漏洞。了解网络中哪些部分易受攻击，然后应用安全补丁或升级，将有助于提高安全性。请记住，不仅贵公司的系统和设备脆弱，员工也是！\n\
    \n这无疑是人们可能遇到的最严重的安全威胁之一。您的员工应该接受安全意识培训，了解利弊以及该做什么和不该做什么。您可能还有员工为了经济利益在工作场所外共享消费者信息。请留意任何可能危及公司运营的异常行为。\n\
    \n# 识别主机\n\n本节介绍可用于识别网络上主机的各种工具。这些程序将提供用户的 IP 地址、MAC 地址、开放和关闭的端口、服务、操作系统及其他详细信息。以下各节列出了可用于识别网络主机的\
    \ Kali Linux 工具。\n\n## 网络映射工具\n\n我们将重点关注 `Nmap` 的命令行界面。以下是一些可供考虑的替代网络映射工具：\n\n\
    *   `0trace`\n*   `Angry IP scanner`\n*   `hping2` 和 `hping3`\n*   `lanmap` 和\
    \ `lanmap2`\n*   `TCP traceroute`\n\n在本教程中，您将学习如何使用 `Nmap` 识别网络上的主机。当涉及到网络发现，或确定诸如\
    \ `Telnet`、`SSH` 或 `FTP` 之类的网络服务是否正在运行时，这些工具绝对是我的最爱。让我们开始吧！\n\n1.  打开终端。\n2. \
    \ 输入以下命令后按 `Enter`：\n    ```\n    ifconfig\n    ```\n    在此例中，如**图 5.1**所示，我们的私有\
    \ IP 地址是 `192.168.1.128`。因为我们的网关是 `192.168.1.1`，接下来我们将看到如何扫描整个子网。\n    ![](img/Figure-5.1.jpg)\n\
    \    **图 5.1：** ifconfig 命令\n3.  输入以下命令后按 `Enter`：\n    ```\n    nmap 192.168.X.0/24\n\
    \    ```\n    此命令对 `192.168.1.1` 到 `192.168.1.254` 范围内的所有主机发起一次 ping 扫描。您将在输出中注意到一些有趣的信息，例如开放和关闭的端口、服务以及它们正在使用的操作系统。\n\
    \    如**图 5.2**所示，我们可以检测到本地网络上的多个系统和设备：\n    ![](img/Figure-5.2.jpg)\n    **图\
    \ 5.2：** nmap 命令\n4.  如果您的网络上安装了防火墙，请运行以下命令：\n    ```\n    nmap -PN 192.168.X.0/24\n\
    \    ```\n    所有主机将被视为在线状态，并跳过主机发现。它用于绕过标准防火墙过滤器，以查看防火墙是否正常运行，如**图 5.3**所示：\n\
    \    ![](img/Figure-5.3.jpg)\n    **图 5.3：** nmap 命令 _2\n\n## 确定网络规模\n\n弄清网络有多大并不难。如果您已有一些网络经验，会容易得多。让我们演示几个步骤来确定网络规模以及我们有多少主机。\n\
    \n### 使用 Kali Linux 确定网络规模\n\n在本教程中，我们将在 Kali Linux 中确定网络规模。为此，请遵循以下步骤：\n\n1.\
    \  打开终端。\n2.  输入以下命令后按 `Enter`：\n    ```\n    ifconfig | grep mask\n    ```\n\
    \    **图 5.4** 是输出结果：\n    ![](img/Figure-5.4.jpg)\n    **图 5.4：** ifconfig 命令\
    \ _2\n\n您需要向上和向下滚动以查看您的网络配置。在**图 5.4**中，子网掩码是 `255.255.255.0`。如果我们做一些子网划分计算，可以推断出该网络可能拥有\
    \ 1 到 254 个主机。\n\n您可能会想，确定网络规模与渗透测试有什么关系？通过确定网络规模，渗透测试人员可以估算网络上的主机数量。当数据中心或大学校园中的网络数量已知时，这可以使渗透测试变得更容易。\n\
    \n## 检测易受攻击的主机\n\n本节不言自明。如果您认识某人不每天更新他们的系统，他们肯定容易受到最新安全风险的威胁。截至目前，Windows 7 极其不安全，特别是如果用户未安装任何更新或服务包。让我们在即将到来的示例中看看\
    \ Windows 7 中的一个漏洞。\n\n请看以下步骤：\n\n1.  扫描目标正在使用的服务，如**图 5.5**所示：\n    ![](img/Figure-5.5.jpg)\n\
    \    **图 5.5：** nmap 命令 _3\n    此命令可进行操作系统检测、版本检测、脚本扫描和路由追踪。\n2.  使用 `Nessus`\
