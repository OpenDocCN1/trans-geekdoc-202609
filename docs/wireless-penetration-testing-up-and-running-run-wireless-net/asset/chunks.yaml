    ## 4. `d2j-dex2jar`


    它是用于处理 Android `.dex` 和 `.jar` 文件的工具。这有助于将 `.dex` 文件转换为 `.class` 文件（压缩的 jar 文件），如[图
    10.55](#c10.xhtml#fig10_55)所示。`d2j-dex2jar` 可从 **[https://github.com/pxb1988/dex2jar](https://github.com/pxb1988/dex2jar)**
    下载：


    ![](images/Figure-10.55.jpg)


    **图 10.55：** `d2j-dex2jar` 工具


    ## 5. `JD-GUI`


    `JD-GUI` 是一个独立的图形工具，用于显示类文件的 Java 源代码，如[图 10.56](#c10.xhtml#fig10_56)所示。`JD-GUI`
    可从 **[https://github.com/java-decompiler/jd-gui](https://github.com/java-decompiler/jd-gui)**
    下载：


