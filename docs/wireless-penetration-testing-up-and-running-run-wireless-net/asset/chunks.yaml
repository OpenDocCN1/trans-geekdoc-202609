- raw: "There are several network services and public networks that are vulnerable\
    \ to network sniffing. Anyone with the necessary abilities and Wireshark knowledge\
    \ can quickly breach your accounts.\n\nAlways check the following to keep safe:\n\
    \n*   Use WPA or WPA2 encryption.\n\n*   Always use HTTPS on public networks.\n\
    \n*   Use SSH or encrypted e-mail for file transfers.\n\n*   Use a VPN when on\
    \ public networks.\n\n*   Use a password manager to log in to websites.\n\n# [Man-in-the-middle\
    \ attacks](#toc.xhtml#s133a)\n\nYou have probably heard of the monkey in the middle,\
    \ but what about the man in the center? A **man-in-the-middle** (**MITM**) attack\
    \ occurs when a user’s data is intercepted by a network. On the network, a malicious\
    \ user acts as a router, capturing all network traffic. This covers things such\
    \ as e-mails, logins, chat messages, and more. Refer to *[Figure 8.2](#c08.xhtml#fig8_2)*:\n\
    \n![](images/Figure-8.2.jpg)\n\n**Figure 8.2:** MITM attack\n\nThis demonstration\
    \ is solely meant to be used as a teaching tool. Hacking to improve security is\
    \ a valuable talent to have. In most countries, engaging in malicious activity\
    \ on an unauthorized network without permission is considered a felony. We will\
    \ use our own computer and network in the next demonstration.\n\n1.  To get started,\
    \ open a Terminal and type, as shown in *[Figure 8.3](#c08.xhtml#fig8_3)*: \n\n\
    \    ` mousepad /etc/ettercap/etter.conf`\n\n    **The Ettercap tool is one of\
    \ the MITM tools with basic and reliable features, has a built-in-sniffer, supports\
    \ DNS Spoofing Plugin, among others and Supports custom filters.**\n\n    ![](images/Figure-8.3.jpg)\n\
    \n    **Figure 8.3:** Open etter.conf file\n\n2.  With `etter.conf` opened, look\
    \ for the words highlighted, as shown in *[Figure 8.4](#c08.xhtml#fig8_4)*: \n\
    \n    ![](images/Figure-8.4.jpg)\n\n    **Figure 8.4:** etter.conf file\n\n  \
    \  You will need to replace the highlighted code with *[Figure 8.5](#c08.xhtml#fig8_5)*:\n\
    \n    ![](images/Figure-8.5.jpg)\n\n    **Figure 8.5:** etter.conf file parameters\n\
    \n3.  Click on `Search` and then on `Find`. Type `iptables` and click on the `Find`\
    \ button, as shown in *[Figure 8.6](#c08.xhtml#fig8_6)*: \n\n    ![](images/Figure-8.6.jpg)\n\
    \n    **Figure 8.6:** iptables search\n\n    The result should look like as shown\
    \ in *[Figure 8.7](#c08.xhtml#fig8_7)*:\n\n    ![](images/Figure-8.7.jpg)\n\n\
    \    **Figure 8.7:** iptables search results\n\n    You will need to uncomment\
    \ two of the lines to look like as shown in *[Figure 8.8](#c08.xhtml#fig8_8)*:\n\
    \n    ![](images/Figure-8.8.jpg)\n\n    **Figure 8.8:** iptables uncomment commands\n\
    \n4.  Click on `Search` and then on `Find`. Type `ip6tables` and click on the\
    \ `Find` button, as shown in *[Figure 8.9](#c08.xhtml#fig8_9):*\n\n    ![](images/Figure-8.9.jpg)\n\
    \n    **Figure 8.9:** iptables search\n\n    The result should look like as shown\
    \ in *[Figure 8.10](#c08.xhtml#fig8_10)*:\n\n    ![](images/Figure-8.10.jpg)\n\
    \n    **Figure 8.10:** iptables search results\n\n    You will need to uncomment\
    \ two of the lines to look like as shown in *[Figure 8.11](#c08.xhtml#fig8_11)*:\n\
    \n    ![](images/Figure-8.11.jpg)\n\n    **Figure 8.11:** iptables uncomment commands\n\
    \n5.  Start `Ettercap-gtk` by opening a Terminal and typing `ettercap –G`, as\
    \ shown in *[Figure 8.12](#c08.xhtml#fig8_12)*: \n\n    ![](images/Figure-8.12.jpg)\n\
    \n    **Figure 8.12:** Ettercap GUI\n\n6.  When `Ettercap` opens, select `Sniffing\
    \ at startup` and select `Primary Interface` eth0, then press `Accept` to start\
    \ Ettercap as shown in *[Figure 8.13](#c08.xhtml#fig8_13)*: \n\n    ![](images/Figure-8.13.jpg)\n\
    \n    **Figure 8.13:** Ettercap select the primary interface\n\n7.  Click on `Hosts`\
    \ and then select `Scan for hosts`, as shown in *[Figure 8.14](#c08.xhtml#fig8_14)*:\
    \ \n\n    ![](images/Figure-8.14.jpg)\n\n    **Figure 8.14:** Scan for hosts\n\
    \n8.  In the command box, you should see `hosts added to the host list`. Click\
    \ on `Hosts` and then select `Hosts List`, as shown in *[Figure 8.15](#c08.xhtml#fig8_15)*:\
    \ \n\n    ![](images/Figure-8.15.jpg)\n\n    **Figure 8.15:** Hosts list\n\n9.\
    \  Select the IP address of the router and then click on the `Add to Target 1`\
    \ button, as shown in *[Figure 8.16](#c08.xhtml#fig8_16)*: \n\n    ![](images/Figure-8.16.jpg)\n\
    \n    **Figure 8.16:** Router IP add to Target 1\n\n10.  Select the IP address\
    \ of the victim and then click on the **Add to Target 2** button, as shown in\
    \ *[Figure 8.17](#c08.xhtml#fig8_17)*: \n\n     ![](images/Figure-8.17.jpg)\n\n\
    \     **Figure 8.17:** Victim IP add to Target 2\n\n11.  Click on the `Mitm` menu\
    \ and then select `Arp poisoning`, as shown in *[Figure 8.18](#c08.xhtml#fig8_18)*:\
    \ \n\n     ![](images/Figure-8.18.jpg)\n\n     **Figure 8.18:** Mitm Arp poisoning\n\
    \n12.  When you receive a prompt, check the box next to `Sniff remote connections`\
    \ and click on `OK`, as shown in *[Figure 8.19](#c08.xhtml#fig8_19)*: \n\n   \
    \  ![](images/Figure-8.19.jpg)\n\n     **Figure 8.19:** Sniff remote connections\n\
    \n13.  Now, open `Wireshark` to sniff victim traffic. Then select interface `eth0`,\
    \ as shown in *[Figure 8.20](#c08.xhtml#fig8_20)*: \n\n     ![](images/Figure-8.20.jpg)\n\
    \n     **Figure 8.20:** Wireshark\n\n14.  After selecting the `eth0` interface\
    \ in the Wireshark program using `http` filter, as shown in *[Figure 8.21](#c08.xhtml#fig8_21):*\n\
    \n     ![](images/Figure-8.21.jpg)\n\n     **Figure 8.21:** Wireshark HTTP filer\n\
    \n15.  In the victim machine, open the browser and enter the following URL: **[http://testphp.vulnweb.com/login.php](http://testphp.vulnweb.com/login.php)**,\
    \ as shown in *[Figure 8.22](#c08.xhtml#fig8_22)*: \n\n     ![](images/Figure-8.22.jpg)\n\
    \n     **Figure 8.22:** testphp.vulnweb.com website\n\n     Enter username **test**\
    \ and password **test**.\n\n16.  Check victim traffic in Wireshark, as shown in\
    \ *[Figure 8.23](#c08.xhtml#fig8_23)*: \n\n     ![](images/Figure-8.23.jpg)\n\n\
    \     **Figure 8.23:** Sniffing victim traffic\n\nWe used it in this example HTTP\
    \ protocol, but in the real world, the HTTPs protocol is used to secure communication.\
    \ In this case, as an attacker, what would you do? The attacker will apply **SSLStrip**\
    \ Concept, as shown in *[Figure 8.24](#c08.xhtml#fig8_24),* where **SSLStrip**\
    \ is a type of MITM attack that forces users to communicate using an HTTP protocol\
    \ instead of HTTPS in which an attacker can view all SSL traffic in plain text.\
    \ **HTTP Strict Transport Security (HSTS)** is a security protection mechanism\
    \ that protects you from this kind of threat:\n\n![](images/Figure-8.24.jpg)\n\
    \n**Figure 8.24:** SSLStrip concept\n\nTo use SSLStrip concept, we will activate\
    \ SSLStrip plugin in the Ettercap program. On the menu bar, click `Plugins`, then\
    \ `Manage the plugins`, then double click on `sslstrip` plugin. There is a (`*`)\
    \ sign on the left side once it is active, as shown in *[Figure 8.25](#c08.xhtml#fig8_25)*:\n\
    \n![](images/Figure-8.25.jpg)\n\n**Figure 8.25:** SSLStrip plugin\n\nCongratulations!\
    \ You have successfully conducted a full MITM attack.\n\nTo stop the attack, select\
    \ `Stop sniffing`, as shown in *[Figure 8.26](#c08.xhtml#fig8_26)*:\n\n![](images/Figure-8.26.jpg)\n\
    \n**Figure 8.26:** Stop sniffing\n\nEttercap will transmit an ARP packet after\
    \ terminating the attack, and the network will revert to normal in a few minutes.\
    \ Use ARP detection tools like XArp or Snort to protect yourself from such assaults.\
    \ Assigning static ARP entries can also aid in the prevention of an attack. It\
    \ will inform the attacker that the MAC address of the router is fixed and cannot\
    \ be modified. As a result, all ARP packets supplied by the attacker will be ignored.\n\
    \n# [Metasploit](#toc.xhtml#s134a)\n\nFor penetration testers and IDS developers,\
    \ Metasploit is the most well-known open-source tool. The Metasploit framework\
    \ is a security exploit and script database. It is one of the most widely used\
    \ open-source tools for writing and running exploit code on target systems."
