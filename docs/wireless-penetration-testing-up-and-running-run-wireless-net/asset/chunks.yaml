  fmt: "\nFrames are small bits and pieces of information that are divided into small\
    \ bits and pieces by networks. Data packets are contained within these frames.\
    \ Frames, packets, or both could be targeted by an attacker.\n\nAn attacker could\
    \ use frames to detect concealed wireless networks in the region and get unauthorized\
    \ access if the networks are not following the most up-to-date wireless encryption\
    \ standards. These approaches are used by network administrators to debug network\
    \ faults.\n\n# The Wireshark application\n\nWireshark is a packet analyzer that\
    \ is both free and open source. It is used to troubleshoot and analyze networks.\
    \ It captures and displays network packets in detail. Wireshark is used by network\
    \ and security managers to diagnose network and security issues.\n\nYears ago,\
    \ there were a variety of tools accessible, all of which were somewhat costly\
    \ to use. Wireshark has changed that by making itself available to the public\
    \ for free. Wireshark is one of the most powerful open-source packet analyzers\
    \ currently available.\n\nWireshark has several uses. It will be used by network\
    \ administrators to discover and troubleshoot network issues. Security issues\
    \ can be investigated by network security engineers. Protocol implementations\
    \ can be debugged by developers. Users can gain a good understanding of how network\
    \ protocols work and how an attacker could potentially compromise them.\n\nWireshark\
    \ is particularly useful in the real world for viewing real-time packets to diagnose\
    \ Web application issues, authentication concerns like a three-way TCP handshake,\
    \ and auditing. Wireshark will tell you where the packets came from, where they\
    \ are going, and what they are for.\n\nYou could, for example, see if one user\
    \ is using more network traffic than others. During business hours, this user\
    \ could be downloading or watching YouTube videos in large quantities. You can\
    \ reduce that user’s bandwidth so that the network is not slowed down for everyone\
    \ else.\n\nWireshark is a network protocol analyzer that runs on Windows, Mac\
    \ OS X, and Linux. For more information on features and support, go to [https://www.wireshark.org/](https://www.wireshark.org/).\
    \ Wireshark is preinstalled on Kali Linux, so you will not have to install it.\
    \ However, you may need to install it on whatever operating system you desire.\
    \ There are other network protocol analyzer tools such as SolarWinds deep packet\
    \ inspection and Analysis tool, Net flow analyzer, and PRTG Network Monitor.\n\
    \n# Ettercap\n\nEttercap engages in man-in-the-middle attacks to impersonate a\
    \ router or server.\n\nEttercap could be used by an attacker for the following\
    \ purposes:\n\n*   To manipulate data\n*   To gather passwords for protocols such\
    \ as FTP, HTTP, POP, and SSHv1\n*   To fake SSL certificate in HTTPS sessions\n\
    \nFollowing ARP spoofing, we will position our Kali Linux system as the `man-in-the-middle`\
    \ in this Ettercap demonstration. Let us get started!\n\n1.  Open a bash terminal\
    \ and type `ettercap –G` to launch Ettercap in graphical mode, as shown in [Figure\
    \ 3.16](#c03.xhtml#fig3_16). Select `Primary Interface` `wlan0`, then accept the\
