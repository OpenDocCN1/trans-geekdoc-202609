- raw: "Frames are small bits and pieces of information that are divided into small\
    \ bits and pieces by networks. Data packets are contained within these frames.\
    \ Frames, packets, or both could be targeted by an attacker.\n\nAn attacker could\
    \ use frames to detect concealed wireless networks in the region and get unauthorized\
    \ access if the networks are not following the most up-to-date wireless encryption\
    \ standards. These approaches are used by network administrators to debug network\
    \ faults.\n\n# [The Wireshark application](#toc.xhtml#s62a)\n\nWireshark is a\
    \ packet analyzer that is both free and open source. It is used to troubleshoot\
    \ and analyze networks. It captures and displays network packets in detail. Wireshark\
    \ is used by network and security managers to diagnose network and security issues.\n\
    \nYears ago, there were a variety of tools accessible, all of which were somewhat\
    \ costly to use. Wireshark has changed that by making itself available to the\
    \ public for free. Wireshark is one of the most powerful open-source packet analyzers\
    \ currently available.\n\nWireshark has several uses. It will be used by network\
    \ administrators to discover and troubleshoot network issues. Security issues\
    \ can be investigated by network security engineers. Protocol implementations\
    \ can be debugged by developers. Users can gain a good understanding of how network\
    \ protocols work and how an attacker could potentially compromise them.\n\nWireshark\
    \ is particularly useful in the real world for viewing real-time packets to diagnose\
    \ Web application issues, authentication concerns like a three-way TCP handshake,\
    \ and auditing. Wireshark will tell you where the packets came from, where they\
    \ are going, and what they are for.\n\nYou could, for example, see if one user\
    \ is using more network traffic than others. During business hours, this user\
    \ could be downloading or watching YouTube videos in large quantities. You can\
    \ reduce that user’s bandwidth so that the network is not slowed down for everyone\
    \ else.\n\nWireshark is a network protocol analyzer that runs on Windows, Mac\
    \ OS X, and Linux. For more information on features and support, go to **[https://www.wireshark.org/](https://www.wireshark.org/)**.\
    \ Wireshark is preinstalled on Kali Linux, so you will not have to install it.\
    \ However, you may need to install it on whatever operating system you desire.\
    \ There are other network protocol analyzer tools such as SolarWinds deep packet\
    \ inspection and Analysis tool, Net flow analyzer, and PRTG Network Monitor.\n\
    \n# [Ettercap](#toc.xhtml#s63a)\n\nEttercap engages in man-in-the-middle attacks\
    \ to impersonate a router or server.\n\nEttercap could be used by an attacker\
    \ for the following purposes:\n\n*   To manipulate data\n\n*   To gather passwords\
    \ for protocols such as FTP, HTTP, POP, and SSHv1\n\n*   To fake SSL certificate\
    \ in HTTPS sessions\n\nFollowing ARP spoofing, we will position our Kali Linux\
    \ system as the *man-in-the-middle* in this Ettercap demonstration. Let us get\
    \ started!\n\n1.  Open a bash terminal and type `ettercap –G:` to launch Ettercap\
    \ in graphical mode, as shown in *[Figure 3.16](#c03.xhtml#fig3_16)*. Select `Primary\
    \ Interface` `wlan0`, then accept the setting: \n\n    ![](images/Figure-3.16.jpg)\n\
    \n    **Figure 3.16:** Ettercap\n\n2.  Select `Hosts`, then `Scan` for hosts from\
    \ the drop-down menu, as shown in *[Figure 3.17](#c03.xhtml#fig3_17)*: \n\n  \
    \  ![](images/Figure-3.17.jpg)\n\n    **Figure 3.17:** Scan for hosts\n\n3.  Click\
    \ on `Hosts`, then on the `Hosts` list, as shown in *[Figure 3.18](#c03.xhtml#fig3_18):*\n\
    \n    ![](images/Figure-3.18.jpg)\n\n    **Figure 3.18:** Host list\n\n4.  Add\
    \ to `Target 1` after selecting the router’s IP address. Select another IP address\
    \ from the list and click `Add to Target 2` if you want to target another router\
    \ or server, as shown in *[Figure 3.19](#c03.xhtml#fig3_19):*\n\n    ![](images/Figure-3.19.jpg)\n\
    \n    **Figure 3.19:** Add targets\n\n    If you do not choose anything, the entire\
    \ subnet will be ARP-poisoned. This should not be executed on a production network!\
    \ The router we will be using for this example has the IP address `192.168.1.1`.\n\
    \n5.  After then, go to Mitm and then ARP poisoning, as shown in *[Figure 3.20](#c03.xhtml#fig3_20):*\n\
    \n    ![](images/Figure-3.20.jpg)\n\n    **Figure 3.20:** ARP poisoning\n\n6.\
    \  Check the box Sniff remote connections, as shown in *[Figure 3.21](#c03.xhtml#fig3_21)*:\
    \ \n\n    ![](images/Figure-3.21.jpg)\n\n    **Figure 3.21:** Sniff remote connections\n\
    \n7.  Click on `Start` and then click on `Start Sniffing`, as shown in *[Figure\
    \ 3.22](#c03.xhtml#fig3_22):*\n\n    ![](images/Figure-3.22.jpg)\n\n    **Figure\
    \ 3.22:** Start sniffing\n\nAn attacker only needs to conduct a modified or filtered\
    \ attack on the subnet now that it has been trapped in a man-in-the-middle attack.\
    \ These filters can be used with Ettercap’s plugins or constructed from scratch.\
    \ Common attacks such as DNS spoofing, FTP prompt changes, and SSH downgrade attacks\
    \ occur here. The end-user will be completely unaware of the situation. Wireshark\
    \ can be used by a network administrator to figure out where the packets are coming\
    \ from and track down the attacker’s IP address. Do not use default or automatic\
    \ security settings as a rule. Enforce the greatest level of security possible\
    \ and educate employees on security best practices.\n\n# [dsniff](#toc.xhtml#s64a)\n\
    \ndsniff is a powerful password sniffer that can detect a wide range of network\
    \ protocols, including Telnet, FTP, SMTP, POP3, IMAP, HTTP, CVS, Citrix, SMB,\
    \ Oracle, and many others. Although Wireshark can reveal a great deal about packets,\
    \ dsniff can reveal usernames and passwords. You can choose the interface to listen\
    \ on and save the results to a file format that you can read later. Let us look\
