    \ Static analysis using manual methods and tools like `MobSF` is one of the components.\
    \ Another element involves runtime exploitation, which entails hooking various\
    \ methods and objects to get around obstacles and obtain sensitive data. Testing\
    \ the dynamic API calls, such as login API requests and others, that the application\
    \ generates last.\n\nIn order to extract the IPA from the iOS application, we\
    \ will first run a static analysis on it using `MobSF`. Then, we will examine\
    \ a number of bypassing techniques, such as the Jailbreak Detection Bypass, SSL\
    \ Pinning Bypass, Local Authentication Bypass, and so on.\n\n## Extracting the\
    \ IPA\n\nThere are many ways to extract the IPA file; however, for the purposes\
    \ of this essay, we will use SSH.\n\nThe steps to extract the IPA are as follows:\n\
    \n1.  SSH connection to your iPhone: `ssh root@ip` (Default Password is Alpine)\n\
    2.  Go to the directory listed here: `/var/containers/Bundle/Application`\n3.\
    \  Now look for the application: `find | grep “app_name”`\n4.  Go to the folder\
    \ where your app is located: `cd <app_directory>`\n5.  Make a directory called\
