- raw: "     **Figure 1.13:** Folder sharing settings\n\n11.  Finally, we enable `Synchronize\
    \ guest time with host` in the `VMware Tool` option, as shown in *[Figure 1.14](#c01.xhtml#fig1_14)*:\
    \ \n\n     ![](images/Figure-1.14.jpg)\n\n     **Figure 1.14:** VMware tools features\n\
    \n12.  After that, we save, start the VM, and then continue installing Kali Linux\
    \ using the `Graphical Install` option, as shown in *[Figure 1.15](#c01.xhtml#fig1_15)*:\
    \ \n\n     ![](images/Figure-1.15.jpg)\n\n     **Figure 1.15:** Kali Linux graphical\
    \ install\n\n# [Wireless penetration testing tools](#toc.xhtml#s8a)\n\nThe following\
    \ sections describe various useful and widely used security tools.\n\n# [Wireshark](#toc.xhtml#s9a)\n\
    \nWireshark is a packet analyzer that is both free and open source. It can be\
    \ used for network troubleshooting, analysis, software development, and communications\
    \ protocol development. Wireshark may also be used as a teaching tool to demonstrate\
    \ the importance of using SSL or other encryption methods to safeguard sensitive\
    \ information like usernames and passwords from being captured by an outside attacker.\
    \ Kali Linux comes with Wireshark pre-installed.\n\n**How can Wireshark be of\
    \ assistance to you? Wireshark can sniff wireless packets, follow TCP streams,\
    \ and discover unwanted wireless access points to obtain access to e-mails, passwords,\
    \ and other sensitive information.**\n\n*[Figure 1.16](#c01.xhtml#fig1_16)* shows\
    \ the Wireshark interface:\n\n![](images/Figure-1.16.jpg)\n\n**Figure 1.16:**\
    \ Wireshark\n\n# [Scapy](#toc.xhtml#s10a)\n\nScapy is a packet manipulation application\
    \ with a lot of capabilities. It is capable of forging or decoding packets from\
    \ a wide range of protocols. It transmits packets, captures them, compares requests,\
    \ and responds. Scanning, tracerouting, probing, assaults, and network discovery\
    \ are all easy activities that it can readily do. Hoping, 85% of Nmap, arpspoof,\
