    # Wireless Penetration Testing: Up and Running


    ![image](images/line.jpg)


    *Run Wireless Networks Vulnerability Assessment, Wi-Fi Pen Testing, Android and
    iOS Application Security, and Break WEP, WPA, and WPA2 Protocols*


    ![image](images/line.jpg)


    # Dr. Ahmed Hashem El Fiky


    ![image](images/logo.jpg)


    [www.bpbonline.com](http://www.bpbonline.com)


