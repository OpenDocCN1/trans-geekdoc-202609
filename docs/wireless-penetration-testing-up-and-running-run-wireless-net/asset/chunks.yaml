- raw: "1.  Connect to our access point Wireless Lab and navigate to the section of\
    \ the settings that deal with wireless encryption mechanisms, as shown in *[Figure\
    \ 4.2](#c04.xhtml#fig4_2).* Setting the Security Options to WEP on my access point\
    \ accomplishes this. We will also need to adjust the length of the WEP key. We\
    \ have configured WEP to use 64bit keys, as indicated in *[Figure 4.2](#c04.xhtml#fig4_2)*.\
    \ We have set the default key to WEP Key 1 and the 64-bit WEP key value to 0123456789\
    \ in hex. You can change it to whatever you want. \n\n    ![](images/Figure-4.2.jpg)\n\
    \n    **Figure 4.2:** Netgear router setting\n\n    Once the changes have been\
    \ made, the access point should now be able to use WEP as an encryption method.\
    \ Let us get the attacker machine up and running.\n\n2.  Open a Terminal window\
    \ and type the following command, then hit *Enter*: \n\n    ` airmon-ng start\
    \ wlan0`\n\n    The `wlan0` interface will be started in monitor mode with this\
    \ command. Monitor mode allows your computer to listen in on every wireless packet\
    \ that passes through your wireless card’s range. We will be able to inject packets\
    \ into a wireless network using this technique. The result is shown in *[Figure\
    \ 4.3](#c04.xhtml#fig4_3)*:\n\n    ![](images/Figure-4.3.jpg)\n\n    **Figure\
    \ 4.3:** airmon-ng command\n\n3.  Then press *Enter* after typing the following\
    \ command: \n\n    ` airodump-ng wlan0`\n\n    This command turns on the wireless\
    \ interface’s monitor mode. The result is shown in *[Figure 4.4](#c04.xhtml#fig4_4)*:\n\
    \n    ![](images/Figure-4.4.jpg)\n\n    **Figure 4.4:** airodump-ng command\\\
    _1\n\n4.  Press *Enter* after typing the following command: \n\n    ` airodump-ng\
    \ -c 1 -w capture --bssid DC:EF:09:59:B1:1F wlan0`\n\n    The components of the\
    \ command are as follows:\n\n    *   `-c`: this is the channel\n\n    *   `-w`:\
    \ this gives a write access to a file\n\n    *   `–bssid`: this is the wireless\
    \ access point MAC address\n\n    *[Figure 4.5](#c04.xhtml#fig4_5)* is the output\
    \ of the previous command:\n\n    ![](images/Figure-4.5.jpg)\n\n    **Figure 4.5:**\
    \ airodump-ng command\\_2\n\n    Let us connect our wireless client to the access\
    \ point and use the WEP key 0123456789. When the client connects successfully,\
    \ `airodump-ng` should display a message on the screen.\n\n    To exploit flaws\
    \ in the protocol, we require a large number of data packets encrypted with the\
    \ same key as in the scenario of the busy network as well. As a result, we will\
    \ need to make the network produce more data packets. We will use the `aireplay-ng`\
    \ utility to accomplish this.\n\n5.  Press *Enter* after typing the following\
    \ command, as shown in *[Figure 4.6](#c04.xhtml#fig4_6)*: \n\n    `airplay-ng\
    \ -1 1000 -q 10 -e ‘Wireless Lab’ -a DC:EF:09:59:B1:1F -h 00:11:22:33:44:55 wlan0\
    \ --ignore-negative-one`\n\n    The following are the components of the command:\n\
    \n    *   `-1`: This is the number of packets per burst\n\n    *   `-q`: This\
    \ is the number of seconds between keep-alives\n\n    *   `-e`: This sets the\
    \ target AP SSID\n\n    *   `-a`: This sets the access point MAC address\n\n \
    \   *   `-h`: This sets the source MAC address (`00:11:22:33:44:55` is the spoofed\
    \ MAC address)\n\n    *   `--ignore-negative-one`: This resolves the fixed channel\
    \ on wlan0\n\n    ![](images/Figure-4.6.jpg)\n\n    **Figure 4.6:** aireplay-ng\
    \ command\\_1\n\n6.  We will use aireplay-ng to intercept ARP packets on the wireless\
    \ network and inject them back into it to imitate ARP answers. As indicated in\
    \ *[Figure 4.7](#c04.xhtml#fig4_7)*, we will run aireplay-ng in a separate window.\
    \ We will generate a lot of data traffic on the network if we repeat these packets\
    \ a few thousand times. Even though Aireplay-ng does not have access to the WEP\
    \ key, it can detect ARP packets based on their size. Because ARP is a fixed header\
    \ protocol, the size of ARP packets can be easily estimated and used to identify\
    \ them even when the communication is encrypted. We will use aireplay-ng with\
    \ the choices we will go over next. The `-3` option is for ARP replay, the `-b`\
    \ option is for our network’s BSSID, and the `–h` option is for the spoofing client’s\
    \ MAC address. Replay attacks will only work for authorized and associated client\
    \ MAC addresses, so we need to accomplish this, as shown in *Figure.4.7*: \n\n\
    \    `aireplay-ng -3 -b DC:EF:09:59:B1:1F -h 00:11:22:33:44:55 wlan0`\n\n    ![](images/Figure-4.7.jpg)\n\
    \n    **Figure 4.7:** aireplay-ng command\\_2\n\n7.  Airodump-ng will also begin\
    \ registering many data packets at this moment. The capture files contain all\
    \ these intercepted packets.\n\n8.  Let us start with the actual cracking! In\
    \ a new window, we run aircrack-ng with the `capture-01.cap` option. This will\
    \ launch the aircrack-ng program, which will begin cracking the WEP key using\
    \ the data packets in the file. Airodump-ng should gather WEP packets, aireplay-ng\
    \ should perform the replay attack, and aircrack-ng should attempt to crack the\
    \ WEP key based on the collected packets all at the same time. All of them are\
    \ open in distinct windows in this experiment. Press *Enter* after typing the\
    \ following command, as shown in *[Figure 4.8](#c04.xhtml#fig4_8):*\n\n    ` aircrack-ng\
    \ capture-01.cap`\n\n    ![](images/Figure-4.8.jpg)\n\n    **Figure 4.8:** aircrack-ng\
    \ command\n\nThe number of data packets necessary to crack the key is nondeterministic;\
    \ however, it is typically in the hundreds of thousands or more. This should take\
    \ no more than 5–10 minutes on a fast network (or using aireplay-ng). If the current\
    \ quantity of data packets in the file is insufficient, aircrack-ng will pause\
    \ and wait for more packets to be collected; the cracking procedure will then\
    \ be restarted. Aircrack-ng should be able to break the key once enough data packets\
    \ have been gathered and analyzed.\n\nCongratulations on successfully cracking\
    \ a WEP encrypted network if you were able to crack the network key! Do not be\
    \ concerned if you do not succeed. Each wireless access point and network is unique.\
    \ It also depends on the strength of the signal between you and the access point,\
    \ as well as the level of encryption used.\n\nIt is crucial to understand that\
    \ WEP is completely defective, and Aircrack-ng can crack any WEP key (no matter\
    \ how complex). The only need is that aircrack-ng has access to a big enough number\
    \ of data packets encrypted with this key.\n\n**Note: We can also use the Shared\
    \ Key Authentication bypass approach we learned in the previous chapter to impersonate\
    \ an authentication to the access point. If the legitimate client exits the network,\
    \ this can be useful. This will allow us to spoof authentication and association\
    \ while still sending our replayed packets into the network.**\n\n# [WPA and WPA2\
    \ encryption](#toc.xhtml#s78a)\n\nThe TKIP encryption algorithm is primarily used\
    \ by WPA. TKIP was created with the goal of upgrading WEP without requiring fully\
    \ new hardware. WPA2, on the other hand, uses the AES-CCMP encryption technique,\
    \ which is far more powerful and robust than TKIP.\n\nBoth WPA and WPA2 support\
    \ EAP-based authentication via RADIUS servers (Enterprise) or a **Pre-Shared Key**\
    \ (**PSK**)-based authentication schema (Personal).\n\nA dictionary attack can\
    \ be used against WPA/WPA2 PSK. The four-way WPA handshake between the client\
    \ and access point, as well as a wordlist of common passphrases, are necessary\
    \ for this attack. We may next try to crack the WPA/WPA2 PSK pass using tools\
    \ like Aircrack-ng.\n\nThe four-way handshake is depicted in *[Figure 4.9](#c04.xhtml#fig4_9)*:\n\
    \n![](images/Figure-4.9.jpg)\n\n**Figure 4.9:** WPA/WPA2 authentication diagram\n\
    \nThe **Pairwise Transient Key** (**PTK**) is calculated using the PSK and five\
    \ other parameters: SSID of Network, **Authenticator Nounce** (**ANounce**), **Supplicant\
    \ Nounce** (**SNounce**), **Authenticator MAC address** (**Access PointMAC**),\
    \ and Suppliant MAC address (Wi-Fi Client MAC). The data between the access point\
    \ and the client is then encrypted using this key."
