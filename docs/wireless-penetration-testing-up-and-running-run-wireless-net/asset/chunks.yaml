- raw: "After reading this chapter, the reader will understand Android Architecture,\
    \ and will learn how to set up Android Penetration Testing Environment and know\
    \ the popular Android Penetration Testing Tools. Finally, the reader can learn\
    \ how to protect their Android Applications, based on OWASP TOP 10. In the upcoming\
    \ chapter, we will learn about iOS penetration testing as another popular mobile\
    \ operating system.\n\n# [Questions](#toc.xhtml#s207a)\n\n1.  Mention four native\
    \ libraries that are found in Android architecture.\n\n2.  Mention two native\
    \ applications that are found in Android architecture.\n\n3.  Mention three popular\
    \ Android penetration testing tools.\n\n4.  Mention four of OWASP’s Top 10 vulnerabilities\
    \ for Android.\n\n# [CHAPTER 11](#toc.xhtml#c11)\n\n# [iOS Penetration Testing](#toc.xhtml#c11)\n\
    \n# [Introduction](#toc.xhtml#s208a)\n\nThe mobile application’s penetration testing\
    \ involves Android and iOS, two key market players. Both operating systems are\
    \ widely used and come with unique features.\n\nIn this chapter, we will examine\
    \ the iOS platform and how to begin penetration testing on an iOS application.\
    \ We will begin by going over the fundamentals of the iOS application and some\
    \ key information, then go on to the necessary tools, lab setup, and some simple\
    \ attacks.\n\nWhile evaluating the API requests coming from an iOS application\
    \ is like standard API penetration testing procedures. The primary distinctions\
    \ are between static and dynamic functional analysis, circumventing established\
    \ limitations, manipulating functions, and other amazingly intriguing things.\n\
    \n# [Structure](#toc.xhtml#s209a)\n\nThe following topics will be covered in this\
    \ chapter:\n\n*   Basics of iOS application\n\n*   iOS application Sandbox structure\n\
    \n*   Vulnerable application\n\n*   Testing methodology\n\n*   OWASP mobile top\
    \ 10\n\n# [Objectives](#toc.xhtml#s210a)\n\nIn this chapter, you will be able\
    \ to understand the basics of iOS applications, then learn iOS application sandboxing\
    \ structure and know the popular iOS penetration testing tools. Finally, you will\
    \ learn the testing methodology of the iOS application.\n\n# [Basics of iOS application](#toc.xhtml#s211a)\n\
    \nUnderstanding the iOS platform, its built-in security features, and other key\
    \ terms is crucial before starting with iOS application penetration testing. Now,\
    \ we will go over some key phrases in the simplest, quickest way we can, then\
    \ suggest additional reading to fully examine them.\n\n# [Architecture of iOS](#toc.xhtml#s212a)\n\
    \nThe iOS system’s basic architecture is shown in *[Figure 11.1](#c11.xhtml#fig11_1)*,\
    \ where multiple layers are used to create communication and carry out various\
    \ functions between the application and hardware levels:\n\n![](images/Figure-11.1.jpg)\n\
    \n**Figure 11.1:** iOS architecture\n\nLet us briefly go through a few of these\
    \ layers:\n\n*   **Core OS**: Numerous low-level functionalities are provided\
    \ by the Core OS layer, upon which various services are constructed. These include\
    \ Accelerate Framework, Directory Services, System Configuration, OpenCL, and\
    \ so on.\n\n*   **Core services**: Over the services offered in the Core OS layer,\
    \ the core services layer offers an abstraction. These services generally include\
    \ Address Book, Social, Security, Webkit, and so on.\n\n*   **Media**: The device\
    \ can use a variety of media services provided by the media layer, which essentially\
    \ makes all audio-visual technologies possible. It provides various functions\
    \ such as Core Image, Core Audio, Core Text, and so on.\n\n*   **Cocoa touch (application)**:\
    \ The application layer is another name for the cocoa touch layer. It is the top\
    \ layer in the architecture and exposes several APIs for creating iPhone-compatible\
    \ software.\n\nThe file extension for iOS applications is `.IPA`.\n\n# [File structure\
    \ of an IPA](#toc.xhtml#s213a)\n\nTo begin, we must rename the IPA file to have\
    \ the .zip extension so that we may unzip it and analyze its structure. The contents\
    \ are as follows when we unzip it:\n\n*   `App binary`: The executable file containing\
    \ the compiled (unreadable) application source code.\n\n*   `Info.plist`: The\
    \ `info.plist` file uses a list of different characteristics to describe the application\
    \ to the operating system. When conducting security assessments, we frequently\
    \ scan this file because it might provide valuable information or point out some\
    \ configuration errors.\n\n*   `Frameworks`: List of dynamic libraries.\n\n* \
    \  `Embedded.mobileprovsion`: These are certificates.\n\n*   `Keychain`: An application\
    \ can keep sensitive information in a keychain that is encrypted and can only\
    \ be accessed by other applications with permission. View More: **[https://developer.apple.com/documentation/security/keychainservices](https://developer.apple.com/documentation/security/keychainservices)**.\n\
    \nRefer to *[Figure 11.2](#c11.xhtml#fig11_2):*\n\n![](images/Figure-11.2.jpg)\n\
    \n**Figure 11.2:** IPA file structure\n\n# [iOS application Sandbox structure](#toc.xhtml#s214a)\n\
    \nSo, how do applications work once they are installed on iOS? Because of Apple’s\
    \ sandboxing, applications can create local databases on the aforementioned device.\
    \ They are kept apart from other apps because of this. Because there will be a\
    \ lot of programs storing data on the device’s hard drive, iOS gives each app\
    \ its own sandbox to avoid conflicts. Refer to *[Figure 11.3](#c11.xhtml#fig11_3):*\n\
    \n![](images/Figure-11.3.jpg)\n\n**Figure 11.3:** Sandboxing in iOS\n\nThe iOS\
    \ device has three different types of sandboxes as follows:\n\n*   **Pre-installed\
    \ App directory —** `/var/Application`\n\n    The app files for the applications\
    \ that are pre-installed by default on the iOS device are kept in this directory.\
    \ Refer to *[Figure 11.4](#c11.xhtml#fig11_4):*\n\n    ![](images/Figure-11.4.jpg)\n\
    \n    **Figure 11.4:** Pre-installed applications\n\n*   **Bundle directory —**\
    \ `/var/containers/Bundle/Application`\n\n    The `Bundle` directory houses all\
    \ of the files that are downloaded with apps from the Apple App Store often referred\
    \ to as the `IPA Container`. Additionally downloaded from other places. This directory’s\
    \ contents will not change as an application version changes. Refer to *[Figure\
    \ 11.5](#c11.xhtml#fig11_5):*\n\n    ![](images/Figure-11.5.jpg)\n\n    **Figure\
    \ 11.5:** Bundle directory applications\n\n*   **Data directory -** `/var/mobile/Containers/data/Application`\n\
    \n    The developer stores files they want to maintain in the `Data` directory\
    \ also called the `Local Data Storage Container`. When the application is installed\
    \ on the device, these are things that are related to it. Files that could be\
    \ used as a cache for information to be accessed quickly or as a backup for offline\
    \ data to be used when the application is reopened. Refer to *[Figure 11.6](#c11.xhtml#fig11_6):*\n\
    \n    ![](images/Figure-11.6.jpg)\n\n    **Figure 11.6:** Data directory applications\n\
    \n# [Jailbreak](#toc.xhtml#s215a)\n\nThe process of removing the company-imposed\
    \ user limitations on your device is known as “jailbreaking.” It is crucial to\
    \ be aware that Jailbreak violates your device’s warranty. Different jailbreaking\
    \ techniques exist for iOS, depending on the version. A useful website for suggesting\
    \ jailbreak tools depending on the iOS application is **[https://canijailbreak.com](https://canijailbreak.com)**.\
    \ It is important to note that jailbreaking can be carried out on Windows, Mac,\
    \ or Linux systems. Additionally, there are other categories of jailbreaking,\
    \ which are described as follows:\n\n*   **Untethered Jailbreak**: Permanent Jailbreak,\
    \ the device will be jailbroken even after a reboot\n\n*   **Tethered Jailbreak**:\
    \ Temporary Jailbreak, after a reboot device, will be back to its normal state.\n\
    \n*   **Semi-tethered Jailbreak**: The device can boot up independently after\
    \ a semi-tethered jailbreak, but it will no longer have a patched kernel and will\
    \ not be able to execute modified code."
  fmt: "\n阅读完本章后，读者将了解 Android 架构，学习如何搭建 Android 渗透测试环境并熟悉常用的 Android 渗透测试工具。最后，读者可以根据\
    \ OWASP TOP 10 学习如何保护他们的 Android 应用程序。在接下来的章节中，我们将了解作为另一种流行移动操作系统的 iOS 渗透测试。\n\
    \n# 问题\n\n1.  列举 Android 架构中发现的四个原生库。\n\n2.  列举 Android 架构中发现的两个原生应用程序。\n\n3.\
    \  列举三个流行的 Android 渗透测试工具。\n\n4.  列举 Android 适用的 OWASP Top 10 漏洞中的四个。\n\n# 第 11\
    \ 章\n\n# iOS 渗透测试\n\n# 简介\n\n移动应用程序的渗透测试涉及 Android 和 iOS 这两个关键市场参与者。这两个操作系统都被广泛使用，并具有独特的功能。\n\
    \n在本章中，我们将研究 iOS 平台以及如何开始对 iOS 应用程序进行渗透测试。我们将首先回顾 iOS 应用程序的基础知识和一些关键信息，然后介绍必要的工具、实验室搭建以及一些简单的攻击。\n\
    \n虽然评估来自 iOS 应用程序的 API 请求类似于标准的 API 渗透测试程序。主要区别在于静态和动态功能分析、绕过既定限制、操纵功能以及其他令人惊叹的有趣事项。\n\
    \n# 结构\n\n本章将涵盖以下主题：\n\n*   iOS 应用程序基础\n\n*   iOS 应用程序沙箱结构\n\n*   易受攻击的应用程序\n\n\
    *   测试方法论\n\n*   OWASP 移动端 Top 10\n\n# 目标\n\n在本章中，您将能够了解 iOS 应用程序的基础知识，然后学习 iOS\
    \ 应用程序沙箱结构并熟悉常用的 iOS 渗透测试工具。最后，您将学习 iOS 应用程序的测试方法论。\n\n# iOS 应用程序基础\n\n在开始 iOS\
    \ 应用程序渗透测试之前，了解 iOS 平台、其内置安全功能和其他关键术语至关重要。现在，我们将以最简单、最快捷的方式介绍一些关键短语，然后建议进一步阅读以全面探讨它们。\n\
    \n# iOS 架构\n\niOS 系统的基本架构如*图 11.1*所示，其中使用多层来创建通信并在应用程序层和硬件层之间执行各种功能：\n\n![](images/Figure-11.1.jpg)\n\
    \n**图 11.1：** iOS 架构\n\n让我们简要浏览一下其中的几层：\n\n*   **Core OS（核心操作系统层）**：Core OS 层提供了许多低级功能，各种服务构建于此。这些包括\
    \ `Accelerate Framework`、`Directory Services`、`System Configuration`、`OpenCL`\
    \ 等。\n\n*   **Core Services（核心服务层）**：核心服务层在 Core OS 层提供的服务之上提供了抽象。这些服务通常包括 `Address\
    \ Book`、`Social`、`Security`、`Webkit` 等。\n\n*   **Media（媒体层）**：设备可以使用媒体层提供的各种媒体服务，这基本上使所有视听技术成为可能。它提供各种功能，如\
    \ `Core Image`、`Core Audio`、`Core Text` 等。\n\n*   **Cocoa Touch（应用层）**：应用层也称为\
    \ Cocoa Touch 层。它是架构中的顶层，并暴露了多个 API 用于创建兼容 iPhone 的软件。\n\niOS 应用程序的文件扩展名为 `.IPA`。\n\
    \n# IPA 文件结构\n\n首先，我们必须将 IPA 文件重命名为 `.zip` 扩展名，以便解压并分析其结构。解压后的内容如下：\n\n*   `App\
    \ binary`：包含编译后的（不可读的）应用程序源代码的可执行文件。\n\n*   `Info.plist`：`info.plist` 文件使用一系列不同的特性向操作系统描述应用程序。在进行安全评估时，我们经常扫描此文件，因为它可能提供有价值的信息或指出一些配置错误。\n\
    \n*   `Frameworks`：动态库列表。\n\n*   `Embedded.mobileprovsion`：这些是证书。\n\n*   `Keychain`：应用程序可以将敏感信息保存在加密的钥匙串中，只有获得权限的其他应用程序才能访问。查看更多：[https://developer.apple.com/documentation/security/keychainservices](https://developer.apple.com/documentation/security/keychainservices)。\n\
    \n请参阅*图 11.2*：\n\n![](images/Figure-11.2.jpg)\n\n**图 11.2：** IPA 文件结构\n\n# iOS\
    \ 应用程序沙箱结构\n\n那么，应用程序安装在 iOS 上后是如何工作的？由于 Apple 的沙箱机制，应用程序可以在上述设备上创建本地数据库。它们因此与其他应用程序隔离开来。由于将有大量程序在设备硬盘上存储数据，iOS\
    \ 为每个应用程序提供自己的沙箱以避免冲突。请参阅*图 11.3*：\n\n![](images/Figure-11.3.jpg)\n\n**图 11.3：**\
    \ iOS 中的沙箱机制\n\niOS 设备有三种不同类型的沙箱，如下所示：\n\n*   **预装应用目录** — `/var/Application`\n\
    \n    此目录中保存着 iOS 设备上默认预装应用程序的应用文件。请参阅*图 11.4*：\n\n    ![](images/Figure-11.4.jpg)\n\
    \n    **图 11.4：** 预装应用程序\n\n*   **Bundle 目录** — `/var/containers/Bundle/Application`\n\
    \n    `Bundle` 目录包含从 Apple App Store 下载的应用程序的所有文件，通常称为 `IPA Container`。也包括从其他地方下载的。此目录的内容不会随着应用程序版本的更改而改变。请参阅*图\
    \ 11.5*：\n\n    ![](images/Figure-11.5.jpg)\n\n    **图 11.5：** Bundle 目录应用程序\n\
    \n*   **Data 目录** — `/var/mobile/Containers/data/Application`\n\n    开发者将想要保留的文件存储在\
    \ `Data` 目录中，也称为 `Local Data Storage Container`。这些是应用程序安装在设备上时与之相关的内容。可用作快速访问信息的缓存文件，或作为重新打开应用程序时使用的离线数据备份。请参阅*图\
    \ 11.6*：\n\n    ![](images/Figure-11.6.jpg)\n\n    **图 11.6：** Data 目录应用程序\n\n\
    # 越狱\n\n移除公司强加于设备上的用户限制的过程称为“越狱”。必须了解的是，越狱会使设备保修失效。根据版本不同，存在不同的 iOS 越狱技术。一个根据\
    \ iOS 应用程序推荐越狱工具的有用网站是 [https://canijailbreak.com](https://canijailbreak.com)。值得注意的是，越狱可以在\
    \ Windows、Mac 或 Linux 系统上进行。此外，还有其他类别的越狱，描述如下：\n\n*   **Untethered Jailbreak（完全越狱）**：永久越狱，设备重启后仍保持越狱状态。\n\
    \n*   **Tethered Jailbreak（不完全越狱）**：临时越狱，设备重启后将恢复到正常状态。\n\n*   **Semi-tethered\
    \ Jailbreak（半越狱）**：设备在半越狱后可以独立启动，但将不再拥有修补过的内核，无法执行修改后的代码。\n"
  trans: "\n阅读完本章后，读者将了解 Android 架构，学习如何搭建 Android 渗透测试环境并熟悉常用的 Android 渗透测试工具。最后，读者可以根据\
    \ OWASP TOP 10 学习如何保护他们的 Android 应用程序。在接下来的章节中，我们将了解作为另一种流行移动操作系统的 iOS 渗透测试。\n\
    \n# 问题\n\n1.  列举 Android 架构中发现的四个原生库。\n\n2.  列举 Android 架构中发现的两个原生应用程序。\n\n3.\
    \  列举三个流行的 Android 渗透测试工具。\n\n4.  列举 Android 适用的 OWASP Top 10 漏洞中的四个。\n\n# 第 11\
    \ 章\n\n# iOS 渗透测试\n\n# 简介\n\n移动应用程序的渗透测试涉及 Android 和 iOS 这两个关键市场参与者。这两个操作系统都被广泛使用，并具有独特的功能。\n\
    \n在本章中，我们将研究 iOS 平台以及如何开始对 iOS 应用程序进行渗透测试。我们将首先回顾 iOS 应用程序的基础知识和一些关键信息，然后介绍必要的工具、实验室搭建以及一些简单的攻击。\n\
    \n虽然评估来自 iOS 应用程序的 API 请求类似于标准的 API 渗透测试程序。主要区别在于静态和动态功能分析、绕过既定限制、操纵功能以及其他令人惊叹的有趣事项。\n\
    \n# 结构\n\n本章将涵盖以下主题：\n\n*   iOS 应用程序基础\n\n*   iOS 应用程序沙箱结构\n\n*   易受攻击的应用程序\n\n\
    *   测试方法论\n\n*   OWASP 移动端 Top 10\n\n# 目标\n\n在本章中，您将能够了解 iOS 应用程序的基础知识，然后学习 iOS\
    \ 应用程序沙箱结构并熟悉常用的 iOS 渗透测试工具。最后，您将学习 iOS 应用程序的测试方法论。\n\n# iOS 应用程序基础\n\n在开始 iOS\
    \ 应用程序渗透测试之前，了解 iOS 平台、其内置安全功能和其他关键术语至关重要。现在，我们将以最简单、最快捷的方式介绍一些关键短语，然后建议进一步阅读以全面探讨它们。\n\
    \n# iOS 架构\n\niOS 系统的基本架构如*图 11.1*所示，其中使用多层来创建通信并在应用程序层和硬件层之间执行各种功能：\n\n![](img/Figure-11.1.jpg)\n\
    \n**图 11.1：** iOS 架构\n\n让我们简要浏览一下其中的几层：\n\n*   **Core OS（核心操作系统层）**：Core OS 层提供了许多低级功能，各种服务构建于此。这些包括\
    \ `Accelerate Framework`、`Directory Services`、`System Configuration`、`OpenCL`\
    \ 等。\n\n*   **Core Services（核心服务层）**：核心服务层在 Core OS 层提供的服务之上提供了抽象。这些服务通常包括 `Address\
    \ Book`、`Social`、`Security`、`Webkit` 等。\n\n*   **Media（媒体层）**：设备可以使用媒体层提供的各种媒体服务，这基本上使所有视听技术成为可能。它提供各种功能，如\
    \ `Core Image`、`Core Audio`、`Core Text` 等。\n\n*   **Cocoa Touch（应用层）**：应用层也称为\
    \ Cocoa Touch 层。它是架构中的顶层，并暴露了多个 API 用于创建兼容 iPhone 的软件。\n\niOS 应用程序的文件扩展名为 `.IPA`。\n\
    \n# IPA 文件结构\n\n首先，我们必须将 IPA 文件重命名为 `.zip` 扩展名，以便解压并分析其结构。解压后的内容如下：\n\n*   `App\
    \ binary`：包含编译后的（不可读的）应用程序源代码的可执行文件。\n\n*   `Info.plist`：`info.plist` 文件使用一系列不同的特性向操作系统描述应用程序。在进行安全评估时，我们经常扫描此文件，因为它可能提供有价值的信息或指出一些配置错误。\n\
    \n*   `Frameworks`：动态库列表。\n\n*   `Embedded.mobileprovsion`：这些是证书。\n\n*   `Keychain`：应用程序可以将敏感信息保存在加密的钥匙串中，只有获得权限的其他应用程序才能访问。查看更多：[`developer.apple.com/documentation/security/keychainservices`](https://developer.apple.com/documentation/security/keychainservices)。\n\
    \n请参阅*图 11.2*：\n\n![](img/Figure-11.2.jpg)\n\n**图 11.2：** IPA 文件结构\n\n# iOS 应用程序沙箱结构\n\
    \n那么，应用程序安装在 iOS 上后是如何工作的？由于 Apple 的沙箱机制，应用程序可以在上述设备上创建本地数据库。它们因此与其他应用程序隔离开来。由于将有大量程序在设备硬盘上存储数据，iOS\
    \ 为每个应用程序提供自己的沙箱以避免冲突。请参阅*图 11.3*：\n\n![](img/Figure-11.3.jpg)\n\n**图 11.3：**\
    \ iOS 中的沙箱机制\n\niOS 设备有三种不同类型的沙箱，如下所示：\n\n*   **预装应用目录** — `/var/Application`\n\
    \n    此目录中保存着 iOS 设备上默认预装应用程序的应用文件。请参阅*图 11.4*：\n\n    ![](img/Figure-11.4.jpg)\n\
    \n    **图 11.4：** 预装应用程序\n\n*   **Bundle 目录** — `/var/containers/Bundle/Application`\n\
    \n    `Bundle` 目录包含从 Apple App Store 下载的应用程序的所有文件，通常称为 `IPA Container`。也包括从其他地方下载的。此目录的内容不会随着应用程序版本的更改而改变。请参阅*图\
    \ 11.5*：\n\n    ![](img/Figure-11.5.jpg)\n\n    **图 11.5：** Bundle 目录应用程序\n\n\
    *   **Data 目录** — `/var/mobile/Containers/data/Application`\n\n    开发者将想要保留的文件存储在\
    \ `Data` 目录中，也称为 `Local Data Storage Container`。这些是应用程序安装在设备上时与之相关的内容。可用作快速访问信息的缓存文件，或作为重新打开应用程序时使用的离线数据备份。请参阅*图\
    \ 11.6*：\n\n    ![](img/Figure-11.6.jpg)\n\n    **图 11.6：** Data 目录应用程序\n\n# 越狱\n\
    \n移除公司强加于设备上的用户限制的过程称为“越狱”。必须了解的是，越狱会使设备保修失效。根据版本不同，存在不同的 iOS 越狱技术。一个根据 iOS 应用程序推荐越狱工具的有用网站是\
    \ [`canijailbreak.com`](https://canijailbreak.com)。值得注意的是，越狱可以在 Windows、Mac 或\
    \ Linux 系统上进行。此外，还有其他类别的越狱，描述如下：\n\n*   **Untethered Jailbreak（完全越狱）**：永久越狱，设备重启后仍保持越狱状态。\n\
    \n*   **Tethered Jailbreak（不完全越狱）**：临时越狱，设备重启后将恢复到正常状态。\n\n*   **Semi-tethered\
    \ Jailbreak（半越狱）**：设备在半越狱后可以独立启动，但将不再拥有修补过的内核，无法执行修改后的代码。\n\n"
