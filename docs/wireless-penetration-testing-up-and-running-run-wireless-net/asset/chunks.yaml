    \ package.zip`（相当于 `ADB push` 和 `install`）即可实现此目的。\n\n# Monkeyrunner\n\nMonkeyrunner\
    \ 是一个 Android SDK 实用程序，允许开发人员创建或使用预先存在的应用来控制连接的设备模拟器。\n\n例如，如果你运行 `ADB shell monkey\
    \ 2`，它将注入事件 ID 2 并在没有用户界面的情况下启动应用程序。请参阅*图 10.28*：\n\n![](img/Figure-10.28.jpg)\n\
    \n**图 10.28：** ADB shell monkey 命令\n\n# Genymotion\n\nGenymotion 是随 Android SDK\
    \ 附带的 **Android 虚拟设备** (**AVD**) 管理器的替代品。本书的 Android 评估部分将全程使用它。只有在你创建了他们的云账户并按照\
    \ **[`www.genymotion.com/#!/download`](https://www.genymotion.com/#!/download)**\
    \ 的步骤操作后，才能下载 Genymotion。有两种不同类型的许可证：\n\n1.  **个人用途**：此版本的 Genymotion 运行模拟的可能性受到限制。\n\
    2.  **商业用途：** 此版本的 Genymotion 为开发人员提供了额外功能，包括网络调试、设计模拟和自动化。\n\n由于 Genymotion 相比\
    \ Android SDK 的模拟器具有卓越的性能（即使启用了 Intel 硬件加速执行管理器），测试人员和开发人员更倾向于将其作为模拟器使用。然而，这并不能替代\
    \ Android SDK 的 AVD。\n\n安装 Genymotion 的分步说明如下：\n\n1.  下载完成后双击该程序，将出现一个窗口向导，如*图\
    \ 10.29*所示：\n\n    ![](img/Figure-10.29.jpg)\n\n    **图 10.29：** Genymotion 安装\
    \ _1\n\n2.  选择“下一步”，我们将进入下一个*图 10.30*，在那里我们可以选择要安装此应用程序的文件夹。在我们的场景中，所有应用程序都将安装在\
    \ `C:/` 驱动器中。请参阅*图 10.30*：\n\n    ![](img/Figure-10.30.jpg)\n\n    **图 10.30：**\
    \ Genymotion 安装 _2\n\n3.  确认后开始安装，如*图 10.31*所示：\n\n    ![](img/Figure-10.31.jpg)\n\
    \n    **图 10.31：** Genymotion 安装 _3\n\n4.  Genymotion 使用 Oracle VirtualBox 来执行模拟器，因此即使前端软件（即\
    \ Genymotion）被卸载，系统映像仍保留在虚拟盒中。如果你下载的 Genymotion 不包含 VirtualBox，*图 10.32*将不适用于你：\n\
    \n    ![](img/Figure-10.32.jpg)\n\n    **图 10.32：** Genymotion 安装 _4\n\n5.  如*图\
    \ 10.33*所示，我们下载的 Genymotion 文件包含预编译版 Oracle Virtual Box 的安装包：\n\n    ![](img/Figure-10.33.jpg)\n\
    \n    **图 10.33：** Oracle Virtual Box 安装\n\n6.  点击 `Next` 将强制你安装 VirtualBox，这将占用一些空间。\n\
    \n7.  Oracle VirtualBox 安装完成后，Genymotion 也随之安装完毕，我们已准备好构建第一个 Android 虚拟镜像。请参阅*图\
    \ 10.34*：\n\n    ![](img/Figure-10.34.jpg)\n\n    **图 10.34：** Genymotion 安装 _5\n\
    \n# 创建 Android 虚拟模拟器\n\n现在我们已经设置好 Genymotion 和 Oracle VirtualBox，将继续创建一个新的 Android\
    \ 虚拟模拟器，我们将用它来运行各种测试。在 Genymotion 中设置模拟器的步骤如下：\n\n1.  首次运行 Genymotion 时，你将看到一个使用须知弹窗，随后会弹出一个构建虚拟设备的提示，如*图\
    \ 10.35*所示：\n\n    ![](img/Figure-10.35.jpg)\n\n    **图 10.35：** Genymotion\n\n\
    2.  选择 `Yes`，下一个选项将引导我们进入 Genymotion 云账户，如*图 10.36*所示：\n\n    ![](img/Figure-10.36.jpg)\n\
    \n    **图 10.36：** Genymotion 云账户\n\n3.  登录后，我们可以查看所有可用的 Android 镜像，然后点击 `Next`。\n\
    \n4.  选择 `Following`，我们将进入下一步，输入我们将创建的模拟器的名称。在本例中，我们将其命名为 Google Nexus—Penetration\
    \ Testing Device，如*图 10.37*所示：\n\n    ![](img/Figure-10.37.jpg)\n\n    **图 10.37：**\
    \ Genymotion Google Nexus 设备\n\n5.  由于 Genymotion 使用基于硬件的加速，我们可能需要在安装过程中配置多个处理器。如下面的*图\
    \ 10.38*所示，我们在基本设置中使用一个处理器：\n\n    ![](img/Figure-10.38.jpg)\n\n    **图 10.38：**\
    \ Genymotion 设备设置\n\n6.  现在我们已经通过按下 `Start` 完成了第一个 Android 虚拟模拟器的设置，可以使用该设备了。\n\
    \n7.  最后，我们的虚拟设备应该可见，如*图 10.39*所示：\n\n    ![](img/Figure-10.39.jpg)\n\n    **图\
    \ 10.39：** Genymotion 设备启动\n\n可以使用 `ADB devices` 命令来确认这一点，如*图 10.40*所示：\n\n![](img/Figure-10.40.jpg)\n\
    \n**图 10.40：** ADB devices 命令\n\n在某些情况下，如*图 10.41*所示，我们可能会收到错误消息触发，这可以通过在 BIOS\
    \ 中启用 Intel 虚拟化技术或 Intel VT-x 来解决：\n\n![](img/Figure-10.41.jpg)\n\n**图 10.41：**\
    \ 虚拟化技术消息\n\n# 将应用程序安装到 Genymotion 模拟器\n\n将应用程序安装到模拟器可以通过两种方式之一完成：要么通过下载，要么使用\
    \ ADB 安装开发人员制作的应用：`ADB install appname.apk`。\n\n你也可以直接将 APK 文件拖放到模拟器中，如*图 10.42*所示：\n\
    \n![](img/Figure-10.42.jpg)\n\n**图 10.42：** 拖放 APK 文件\n\n# 将 Genymotion 插件安装到\
    \ Android Studio\n\n如果应用开发人员在 Android Studio 中编写代码，却无法使用 Android 模拟器立即测试他们的应用，这确实很有挑战性。相反，用户最终不得不在每次签名后安装软件。\n\
    \n必须采取以下操作以在 Android Studio 中启用 Genymotion VM：\n\n1.  导航到 `Android Studio`。转到\
    \ `Settings` 并选择 `Plugins`。\n"
