    # Dedicated to


    *My beloved Parents :*


    ***Hashem El Fiky***


    ***&***


    ***Mona El Fiky***


    # About the Author


    **Dr. Ahmed Hashem El Fiky** has done his Masters in Cyber Security. Currently,
    he is enrolled in the Doctor of Business Administration Program. He has a total
    of 8+ years of experience in various domains such as Reverse Engineering, Malware
    Analysis, Web Penetration Testing, Mobile Penetration Testing, Network Penetration
    Testing, Wireless Penetration Testing, System Penetration Testing, and Machine
    Learning. The author has published 8 papers on Cyber Security Fields. Currently,
    he is working as a Senior Cyber Security Engineer. He also has professional certifications
    such as `ECSA v10`, `CCNA`, `NSE4`, `ISO 27001` and so on.


    # About the Reviewer


    **Amar Gupta** is a Senior Engineer with more than 8 years of experience in the
    Cyber Security field. In his career, he has worked with multiple MNCs and gathered
    extensive experience in the field of security. He has vast experience in firewalls,
    proxies, load balancers and other network security components and has worked with
    fortune 500 companies to provide them top notch security solutions.


    # Acknowledgement


    There are a few people I want to thank for the continued and ongoing support they
    have given me during the writing of this book. First and foremost, I would like
    to thank my parents, my wife, and my daughter for continuously encouraging me
    to write the book — I could have never completed this book without their support.


    I am grateful to the course and the companies which gave me support throughout
    the learning process of wireless penetration testing, as well as tools related
    to wireless penetration testing.


    Thank you for all the hidden support provided. I gratefully acknowledge Mr. Amar
    Gupta for his kind technical scrutiny for this book.


    My gratitude also goes to the team at BPB Publications for being supportive enough
    to provide me quite a long time to finish the first part of the book and also
    allow me to publish the book in multiple parts, since image processing, being
    a vast and very active area of research, was impossible to deep-dive into different
    class of problems in a single book.


    # Preface


    Since it is simple to access the Internet without a network cable from a variety
    of locations worldwide, wireless technology has grown in popularity. However,
    a wireless network may not always be secure if you are unaware of its risks and,
    more importantly, if security measures are not performed. For your own safety,
    it is crucial to safeguard your wireless network. Over the past few years, there
    has been an increase in identity theft and the theft of personal information.


    Insecure wireless networks are no longer safe since there is a higher chance that
    your personal information may be stolen, despite the fact that they are simpler
    to set up and connect to. Another person with little to no experience can intercept
    it with ease. Another option for a user to keep tabs on your online activity includes
    an unprotected wireless network. This includes conversations, emails, and even
    your online banking account. Although this book offers ways to safeguard wireless
    networks, it mostly concentrates on how an attacker can access a protected wireless
    network. Additionally, it demonstrates the power an attacker has once they have
    access to a wireless network.


    This book is divided into **12 chapters**. They will cover wireless Network basics,
    basics and advances in wireless penetration testing. The details are listed as
    follows.


    **[Chapter 1](#c01.xhtml)** will cover step-by-step directions for setting up
    your own wireless lab. It will also cover the fundamentals of installing Kali
    on your hard drive and experimenting with virtual machines (`VMWare`). This chapter
    will provide knowledge about wireless penetration testing tools, such as `Wireshark`
    and `Aircrack-ng`. It will discuss how to use the Web interface to configure your
    access point.


    **[Chapter 2](#c02.xhtml)** will cover a complete understanding of numerous different
    wireless attack strategies, such as access control attacks, confidential attacks,
    credential attacks, and authentication attacks.


    **[Chapter 3](#c03.xhtml)** will discuss how to scan wireless networks for information,
    as well as show two different forms of wireless scanning and how they function.
    The chapter will then show how to use `Ettercap` to sniff wireless networks using
    ARP poisoning and how to use `dsniff` to gather login details. Finally, it will
    cover a variety of ways to defend yourself against these attacks.


    **[Chapter 4](#c04.xhtml)** will show how to make a plan for an attack. Next,
    it will cover several methods for an attack. Then, the chapter will discuss detailed
    information on `WEP`, `WPA`, and `WPA2` encryption. Finally, it will cover learn
    several ways to reduce the risk of a wireless attack.


    **[Chapter 5](#c05.xhtml)** will illustrate why it is important to find the number
    of live hosts when conducting a penetration test on a network. Next, it will cover
    identifying hosts on the network with `Kali Linux`. Lastly, the chapter will cover
    determining network size.


    **[Chapter 6](#c06.xhtml)** will cover the ability to plan out an assessment,
    the key components of an assessment, and the step-by-step process of an assessment.
    It will cover the ability to install `Nessus`, register it, download plugins,
    and then run `Nessus`. The chapter will also discuss the ability to create a new
    policy and scan, identify vulnerabilities, read the vulnerability details, and
    follow it up with a solution for the vulnerability.


    **[Chapter 7](#c07.xhtml)** will cover learn how to capture unencrypted traffic
    and gain an understanding of honeypot attacks and methods, `Karmetasploit`, `Jasager`,
    and prevention from threats.


    **[Chapter 8](#c08.xhtml)** will cover the basics of conducting advanced attacks
    using wireless, where it will create a setup for a MITM attack over wireless and
    then use it to eavesdrop on the victim’s traffic. Then, the chapter will discuss
    how the same setup can be used to hijack the application layer of the victim (Web
    traffic, to be specific) using a DNS poisoning attack as well as how to use `Metasploit`.
    Finally, will discuss the prevention of these threats.


    **[Chapter 9](#c09.xhtml)** will cover the ability to learn how to use first and
    double pivoting to investigate hidden networks and the mitigations methods.

