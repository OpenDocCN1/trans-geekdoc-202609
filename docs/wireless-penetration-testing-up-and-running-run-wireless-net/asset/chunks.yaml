    \ and enable `Portswigger CA Certificate`, as shown in **Figure 11.14**:\n\n \
    \   ![](images/Figure-11.14.jpg)\n\n    **Figure 11.14:** Proxy certificate\n\n\
    ## Bypassing Jailbreak detection\n\nFor this demonstration, we will consider a\
