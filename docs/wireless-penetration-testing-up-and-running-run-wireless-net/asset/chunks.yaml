    # Wireless penetration testing tools


    The following sections describe various useful and widely used security tools.


    ## Wireshark


    Wireshark is a packet analyzer that is both free and open source. It can be used
    for network troubleshooting, analysis, software development, and communications
    protocol development. Wireshark may also be used as a teaching tool to demonstrate
    the importance of using SSL or other encryption methods to safeguard sensitive
    information like usernames and passwords from being captured by an outside attacker.
    Kali Linux comes with Wireshark pre-installed.


    **How can Wireshark be of assistance to you? Wireshark can sniff wireless packets,
    follow TCP streams, and discover unwanted wireless access points to obtain access
    to e-mails, passwords, and other sensitive information.**


    *[Figure 1.16](#c01.xhtml#fig1_16)* shows the Wireshark interface:


    ![](images/Figure-1.16.jpg)


    **Figure 1.16:** Wireshark


    ## Scapy


    Scapy is a packet manipulation application with a lot of capabilities. It is capable
    of forging or decoding packets from a wide range of protocols. It transmits packets,
    captures them, compares requests, and responds. Scanning, tracerouting, probing,
    assaults, and network discovery are all easy activities that it can readily do.
    Hoping, 85% of Nmap, arpspoof, tcpdump, tethereal, p0f, and other tools might
    be readily replaced. It can also handle a variety of other jobs that other programs
    cannot, such as sending incorrect frames, injecting your own 802.11 frames, combining
    VLAN hopping, ARP cache poisoning, WEP VOIP decoding, and more. Scapy is shown
    in action with Kali Linux, as shown in *[Figure 1.17](#c01.xhtml#fig1_17)*:


    ![](images/Figure-1.17.jpg)


    **Figure 1.17:** Scapy


    ## Nmap


    Nmap is a network discovery and security auditing tool that is free and open source.
    It is useful for activities such as network inventory, scheduling service upgrade
    schedules, and monitoring host or service uptime for many systems and network
    managers. Nmap is a tool that may be used to detect Linux operating system versions
    and binary packages. It can also detect whether a network port is open or closed.
    Kali Linux comes with Nmap pre-installed.


    Nmap is a network and subnet mapping tool. It can also tell you what operating
    systems and software versions you are running. This can assist in determining
    whether the network has a flaw or a potential security issue. Nmap is shown in
    action with Kali Linux, as shown in *[Figure 1.18](#c01.xhtml#fig1_18):*


    ![](images/Figure-1.18.jpg)


    **Figure 1.18:** Nmap


    ## Aircrack-ng


    Aircrack-ng is a C-based software that interfaces with a security auditing suite.
    Airodump-ng, aircrack-ng, aireplay-ng, Nmap, dnsiff, arpspoof, urlsnarf, and more
    utilities are included in Aircrack-ng. Although Aircrack-ng has the potential
    to be used maliciously, it can also be used to recover forgotten Wi-Fi passwords.
    For security pros, Aircrack-ng is an excellent tool. Not just to mention that
    it is completely free to use and distribute! Kali Linux comes with Aircrack-ng
    pre-installed, as shown in *[Figure 1.19](#c01.xhtml#fig1_19)*:


    ![](images/Figure-1.19.jpg)


    **Figure 1.19:** Aircrack-ng


    ## Metasploit


    Metasploit is a Ruby-based software that helps to reduce the risk of data breaches.
    It can use the same approaches as an outside attacker to find weaknesses in your
    network and systems. Metasploit can find thousands of flaws in a wide range of
    systems and software. Kali Linux comes with Metasploit already installed, as shown
    in *[Figure 1.20](#c01.xhtml#fig1_20).*


    **What role does Metasploit play in wireless penetration testing? Metasploit contains
    a vulnerability database. If a wireless router has a vulnerability that can be
    exploited by bypassing the admin login, Metasploit will almost certainly have
    a Ruby script for it. It also works on operating systems and hardware firewalls,
    so it is not just for wireless routers. Metasploit’s search command can be used
    to find CVEs.**


    ![](images/Figure-1.20.jpg)


    **Figure 1.20:** Metasploit


    ## Configuring an access point setting


    We are going to set up the access point now. As previously stated, all of the
    experiments in this book will be conducted using the NETGEAR D1500 Wireless Router.
    You may, however, use any other access point. The core operating and usage principles
    remain the same.


    With an SSID of Wireless Lab, we will configure the access point to use Open Authentication.
    Follow the given steps:


    1. Connect your laptop to one of the access point’s Ethernet ports with an Ethernet
    cable after turning on the access point.


    2. In your browser, type the IP address of the access point configuration terminal.
    The default IP address for the NETGEAR is `192.168.1.1`. The IP address of your
    access point can be found in the setup guide for your access point. If you do
    not have the access point’s manuals, you can use a Web browser to access the router
    at **[http://routerlogin.net](http://routerlogin.net)**. The access point’s IP
    address is usually used as the gateway IP address. You should see a configuration
    portal that looks like this once you’ve connected. Refer to *[Figure 1.21](#c01.xhtml#fig1_21)*:


    ![](images/Figure-1.21.jpg)


    **Figure 1.21:** Wireless router login


    Both the username and password are admin by default. You must reset the router
    to its default configuration settings if you are unable to access it. To do this,
    push the button on the back of the wireless router for 5 seconds, and the router
    will be reset to its default settings.


    3. To rename the SSID to `Wireless Lab`, navigate to the `Wireless` tab, then
    `Wireless Settings`. *[Figure 1.22](#c01.xhtml#fig1_22)* is an example.


    4. As previously stated, the access point’s security settings must be changed
    to `Open Authentication`. Select `None` from the `Wireless` menu, then `Security`
    options. The access point is in `Open Authentication Mode` if security is disabled
    (see *[Figure 1.22](#c01.xhtml#fig1_22)*).


    5. Save the changes to the access point and, if necessary, reboot it. Your access
    point should now be operational using the SSID Wireless Lab.


    ![](images/Figure-1.22.jpg)


    **Figure 1.22:** Wireless router settings


    We have successfully configured our access point with a Wireless Lab SSID. It
    is announcing its presence, which is picked up by our Windows laptop and others
    within the access point’s **Radio Frequency** (**RF**) range.


    It is worth noting that we set up our access point in `Open` mode, which is the
    least secure option. For the time being, it is not recommended to connect this
    access point to the internet because anyone within the RF range will be able to
    use it to access the internet.


    ## Installing wireless adaptor


    Our wireless adaptor is significantly easier to set up than the access point.
    The benefit is that Kali comes pre-installed with all the necessary device drivers
    to enable packet injection and sniffing right out of the box. The wireless adaptor
    will be used with the penetration tester’s laptop. To set up your card, follow
    these instructions step by step:


    1. Plugin the adaptor into one of the Kali laptop’s USB ports and boot it. Once
    you log in, open a console terminal and type in `iwconfig`. Your screen should
    look as shown in *[Figure 1.23](#c01.xhtml#fig1_23):*

    '
