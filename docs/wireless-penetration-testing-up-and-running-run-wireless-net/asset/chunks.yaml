    基于 Frida 的 `Objection` 是一个运行时移动探索工具包，如图 10.57 所示。它旨在协助评估移动应用程序及其安全状况，且不需要越狱或 Root
    过的移动设备。该工具的功能包括：


    *   绕过 SSL Pinning 和 Root 检测

    *   移除 Android Heap 和 Keystore

    *   追踪 Android 上的复制/粘贴缓冲区缓存

    *   Hook 一个或多个类的运行时方法

    *   运行独特的 Frida 脚本

    *   在必要时使用 Android Intents


    可从 **[`github.com/sensepost/objection`](https://github.com/sensepost/objection)**
    获取：


