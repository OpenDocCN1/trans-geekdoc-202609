    ![](img/Figure-1.14.jpg)


    **图 1.14：** VMware Tools 功能


    12. 之后，我们保存设置，启动虚拟机，然后继续使用 `Graphical Install` 选项安装 Kali Linux，如 *图 1.15* 所示：


