- raw: "2.  In the screen capture as follows, find `genymotion`, right-click on it,\
    \ and then choose `Download and Install`. Refer to *[Figure 10.43](#c10.xhtml#fig10_43):*\n\
    \n    ![](images/Figure-10.43.jpg)\n\n    **Figure 10.43:** Genymotion plugin\n\
    \n3.  Launch Android Studio again. Android Studio has the Genymotion device manager\
    \ installed. To make starting an application easier, set the application path\
    \ to Genymotion by going to `File` | `Settings` | `Other Settings` | `Genymotion`,\
    \ as seen in *[Figure 10.44](#c10.xhtml#fig10_44)*: \n\n    ![](images/Figure-10.44.jpg)\n\
    \n    **Figure 10.44:** Genymotion plugin setting\n\n4.  The Genymotion device\
    \ manager has now been successfully installed. We are prepared to create and launch\
    \ the app on the device. Refer to *[Figure 10.45](#c10.xhtml#fig10_45):*\n\n \
    \   ![](images/Figure-10.45.jpg)\n\n    **Figure 10.45:** Genymotion device manager\n\
    \n# [ARM apps and play store in Genymotion](#toc.xhtml#s189a)\n\nOnly ARM-based\
    \ hardware can execute some applications. We can add a specific package to address\
    \ this issue by obtaining ARM translation from **https://docs.google.com/file/d/0B-p1r5SNN4adcmhtaGdMVml0Qzg/edit**\
    \ in order to prevent app crashes, which notably make use of these ARMs.\n\nAs\
    \ you can see in *[Figure 10.46](#c10.xhtml#fig10_46)*, simply drag and drop the\
    \ ZIP file onto the emulator. Additionally, keep in mind that the bundles will\
    \ vary depending on the Android platform. Refer to *[Figure 10.46](#c10.xhtml#fig10_46)*:\n\
    \n![](images/Figure-10.46.jpg)\n\n**Figure 10.46:** Drag and drop zip file\n\n\
    For that, we must download the gapps-lp-20141109-signed.zip file from **[https://www.androidfilehost.com?fid=95784891001614559](https://www.androidfilehost.com?fid=95784891001614559)**\
    \ and then drag and drop it onto the virtual device to install Google Play Store.\n\
    \nAfter both apps have been installed, restart the device, and you should see\
    \ Play Store installed in our Genymotion emulator, as shown in *[Figure 10.47](#c10.xhtml#fig10_47)*:\n\
    \n![](images/Figure-10.47.jpg)\n\n**Figure 10.47:** Install Google Play Store\n\
    \nWe can browse all the compatible apps in the store thanks to Play Store being\
    \ available on the emulator. This will be incredibly helpful if you are conducting\
    \ a black box analysis.\n\n# [Configuring the emulator for HTTP proxy](#toc.xhtml#s190a)\n\
    \nHere, we are assuming two test cases: first, an Android emulator from Genymotion\
    \ with a Wi-Fi connection, and second, an internet-connected LTE/3G/2G device.\
    \ Even in the actual device, this will be the same.\n\nLet us have a look at the\
    \ various proxy tools that are available before we start configuring the emulator\
    \ for proxies. These include, but are not limited to, the following:\n\n*   **Burp\
    \ Suite:** The majority of penetration testers choose this proxy, which can be\
    \ downloaded from **[https://portswigger.net/burp/download.html](https://portswigger.net/burp/download.html)**.\
    \ There are two editions: one is free, and another is intended for commercial\
    \ usage. The commercial edition offers a variety of options, including scanners,\
    \ among others.\n\n*   **Paros Proxy:** This open-source Java-based proxy was\
    \ created specifically to look for weaknesses in Web applications. From **[https://sourceforge.net/projects/paros/files/](https://sourceforge.net/projects/paros/files/)**,\
    \ you can download it. It was replaced by OWASP ZAP because it was not updated\
    \ enough. You can still use this proxy as a backup, though.\n\n*   **OWASP ZAP:**\
    \ This is a vulnerability discovery tool that is open source and integrated. From\
    \ **[https://github.com/zaproxy/zaproxy/wiki/Downloads](https://github.com/zaproxy/zaproxy/wiki/Downloads)**,\
    \ you can download it.\n\nThere are several additional tools that can be investigated,\
    \ such as Context Application Tool, ProxyFuzz, Odysseus proxy, Fiddler, and others.\n\
    \nThere are two ways to intercept the data flow between the device and the server:\n\
    \n*   Setting up the proxy in Wi-Fi settings.\n\n*   Setting up the proxy in mobile\
    \ carrier settings.\n\n# [Setting up the proxy in Wi-Fi settings](#toc.xhtml#s191a)\n\
    \nAssume that the device can only connect to Wi-Fi and does not have the capacity\
    \ to use a SIM card:\n\n1.  Go to `Settings` **|** `Wi-Fi` and choose the currently\
    \ connected Wi-Fi. After 30 seconds, hang in there to view the choices depicted\
    \ in *[Figure 10.48](#c10.xhtml#fig10_48)*: \n\n    ![](images/Figure-10.48.jpg)\n\
    \n    **Figure 10.48:** WIFI setting\n\n2.  Navigate to `Modify Network` | `Advanced\
    \ Option` | `Proxy` | `Manual`.\n\n3.  Enter the IP address of your proxy; in\
    \ this instance, Burp Suite is running on port `8080` at `192.168.2.1`. Refer\
    \ to *[Figure 10.49](#c10.xhtml#fig10_49):*\n\n    ![](images/Figure-10.49.jpg)\n\
    \n    **Figure 10.49:** Proxy IP address and proxy port setting\n\n4.  The Wi-Fi\
    \ has been set up effectively to intercept the proxy. We can see from the Burp\
    \ Proxy *[Figure 10.50](#c10.xhtml#fig10_50)* that we can eavesdrop on HTTP Web\
    \ traffic: \n\n    ![](images/Figure-10.50.jpg)\n\n    **Figure 10.50:** Burp\
    \ suite\n\nIf you want the device to be accessible over the network, you can change\
    \ the settings to Bridge Mode by opening the Oracle Virtual Box and selecting\
    \ `Name of the` `VM` **|** `Settings` **|** `Network` **|** `Adapter 2` **|**\
    \ `Change the NAT to Bridged`. By default, Genymotion configures the Network Adapter\
    \ settings in the Oracle Virtual Box to NAT.\n\n# [Setting up the proxy on mobile\
    \ carrier settings](#toc.xhtml#s192a)\n\nLet us assume that the Android device\
    \ can connect to Wi-Fi and a SIM card:\n\n1.  Click `Settings` **|** `More` **|**\
    \ `Cellular networks` **|** `APN` **|** As seen in *[Figure 10.51](#c10.xhtml#fig10_51)*,\
    \ choose the APN you want to edit: \n\n    ![](images/Figure-10.51.jpg)\n\n  \
    \  **Figure 10.51:** APN setting\n\n2.  Set the IP address of your proxy and the\
    \ port number.\n\n3.  You have configured the device to connect to your proxy.\n\
    \nMany features, including screen capture, phone options, the virtual device version,\
    \ and others, are not available in Genymotion’s free edition for personal use.\n\
    \n# [Android penetration testing tools](#toc.xhtml#s193a)\n\nThere are many tools\
    \ available for Android penetration testing, but let us look at the top six that\
    \ are frequently used:\n\n1.  **Android Debug Bridge (ADB)**: A command-line tool\
    \ called **Android Debug Bridge** (**ADB**) is used to interact with devices.\
    \ The application can be installed, debugged, backed up, and data can be pushed\
    \ to or pulled from the device, among other device functions. Refer to *[Figure\
    \ 10.52](#c10.xhtml#fig10_52):*\n\n    ![](images/Figure-10.52.jpg)\n\n    **Figure\
    \ 10.52:** ADB tool\n\n2.  **MobSF: Mobile Security Framework** (**MobSF**) is\
    \ an automated, all-in-one mobile application Pentesting framework that can do\
    \ static, dynamic, and malware analysis on mobile applications running on Android,\
    \ iOS, and Windows. It supports binaries (APK, IPA, and APPX) as well as zipped\
    \ source code and can be used for efficient and quick security analysis of Android,\
    \ iOS, and Windows mobile applications. Additionally, MobSF has the ability to\
    \ test an application dynamically, as shown in *[Figure 10.53](#c10.xhtml#fig10_53).*\
    \ MobSF can be downloaded from **[https://github.com/MobSF/Mobile-Security-Framework-MobSF](https://github.com/MobSF/Mobile-Security-Framework-MobSF)**:\
    \ \n\n    ![](images/Figure-10.53.jpg)\n\n    **Figure 10.53:** MobSF tool\n\n\
    3.  **Drozer:** MWR Labs created Drozer, a thorough security and attack framework\
    \ for Android. You can communicate with the underlying OS, the Dalvik VM, and\
    \ other programmers’ IPC endpoints, as shown in *[Figure 10.54](#c10.xhtml#fig10_54).*\
    \ Drozer can be downloaded from **[https://github.com/FSecureLABS/drozer](https://github.com/FSecureLABS/drozer)**:\
    \ \n\n    ![](images/Figure-10.54.jpg)\n\n    **Figure 10.54:** Drozer tool"
