- raw: 'Smartphones have grown ubiquitous, with over 1 billion users globally and
    2.5 million apps (and counting) available on the Google and Apple digital marketplaces.
    Their impact on our lives is immediate and profound, affecting our daily lives
    in various ways, including how we connect, work, and socialize. The rise in consumer
    demand, as well as the processing power and capabilities of smartphones, such
    as storage, GPS, camera, screens, and other features, has shifted the paradigm
    of mobile application development. Online banking, trading, e-mails, airport check-ins,
    and much more are all available with a single tap.


    In this chapter, we will cover all the information we will need to begin hacking
    and penetration testing Android apps. The top 10 OWASP mobile application vulnerabilities
    will be discussed, as well as how to attack Android apps and their weaknesses,
    with examples.


    # [Structure](#toc.xhtml#s156a)


    The following topics will be covered in this chapter:


    *   Android architecture


    *   Android penetration testing environment setup


    *   Android penetration testing tools


    *   Secure android applications


    # [Objectives](#toc.xhtml#s157a)


    In this chapter, you will understand Android architecture in detail, learn how
    to set up an android penetration testing environment and know the popular android
    penetration testing tools. Finally, you will learn how to protect your Android
    applications.


    # [Android architecture](#toc.xhtml#s158a)


    Understanding the architecture of any platform is critical for any developer or
    security researcher. The hardware abstraction layer of Android is based on the
    Linux 2.x and 3.x kernels.


    It consists of the following:


    *   Key application


    *   Operation system


    *   Middleware


    *   Runtime environment


    *   Different services


    *   Native and custom libraries


    As indicated in *[Figure 10.1](#c10.xhtml#fig10_1)*, it can be represented as
    five layers:


    ![](images/Figure-10.1.jpg)


    **Figure 10.1:** Android architecture


    All of the components have been fine-tuned and merged to give the best possible
    environment for developing and executing mobile applications.


    Let us take a bottom-up approach to learn about the various layers of the Android
    stack now.


    # [The Linux kernel](#toc.xhtml#s159a)


    The Linux kernel is at the core of the Android operating system. Linux was picked
    as the best contender to start with because of its flexible portability features,
    which allow for easy compilation of applications on a variety of hardware platforms.


    Process management/scheduling, memory management, and device management are all
    supported by the Linux kernel, which is located at the bottom of the software
    stack. It also serves as a key abstraction layer, allowing the app to communicate
    with physical devices by providing access to multiple device drivers.


    The automated tilt/rotation adjustment of the screen to match the orientation
    of the mobile device is a simple example of this. The following are some of the
    concerns:


    *   How does this happen?


    *   What triggers the device to perform this operation?


    *   How does the OS come to know that the device orientation has changed?


    Let us take a closer look.


    The accelerometer and gyroscope are hardware sensors in the device that detect
    minute motions and changes in orientation and communicate this data to the kernel.
    This information is converted into software instructions by the device drivers,
    which are picked up by the apps; if the app is intended to respond to these instructions,
    it does so. The Linux kernel, as illustrated in the diagram as shown in *[Figure
    10.2](#c10.xhtml#fig10_2),* contains all of the drivers needed for the hardware
    to function properly, as well as power management.


    In a nutshell, the Linux kernel is in charge of memory, resources, power, and
    driver management.


    ![](images/Figure-10.2.jpg)


    **Figure 10.2:** Linux kernel


    # [Confusion between Linux and the Linux kernel](#toc.xhtml#s160a)


    The name Linux is commonly used to refer to the complete operating system, whereas
    kernel refers to the operating system’s core. The fact that Android is based on
    the Linux kernel does not imply that it is another Linux distribution; it just
    means that Linux is the fundamental operating system, and not all Linux programs
    may be loaded on Android.


    # [Android runtime](#toc.xhtml#s161a)


    Although Android is written in Java, the **Dalvik Virtual Machine** (**DVM**),
    core Java libraries, and a new virtual machine dubbed **Android Runtime** (**ART**)
    make up the runtime layer of the Android architecture.


    *[Figure 10.3](#c10.xhtml#fig10_3)* is from Android 4.4 KitKat, which allows developers
    to create ART applications:


    ![](images/Figure-10.3.jpg)


    **Figure 10.3:** Android runtime (ART) option


    Apps written in Java are executed on the DVM. Due to licensing issues, the DVM
    does not claim to be a **Java virtual machine** (**JVM**), although it serves
    the same purpose. The reason for this is that Dalvik is designed to run on low-power
    and low-memory devices. The DVM is only initiated once for performance reasons.
    A system service called Zygote clones each new instance of it. The structure of
    the Android runtime is shown in *[Figure 10.4](#c10.xhtml#fig10_4)*:


    ![](images/Figure-10.4.jpg)


    **Figure 10.4:** Android runtime core libraries


    # [The Java virtual machine](#toc.xhtml#s162a)


    When we build a Java application, we get bytecode. This bytecode can be executed
    by the JVM, which is a virtual machine (a virtual machine is a program that acts
    as an operating system). *[Figure 10.5](#c10.xhtml#fig10_5)* depicts the compilation
    of a Java program:


    ![](images/Figure-10.5.jpg)


    **Figure 10.5:** Java program compilation process


    # [The Dalvik virtual machine](#toc.xhtml#s163a)


    In Android, the bytecode created by the JVM is sent into the DVM, which generates
    a lightweight format known as `.dex`.


    Why is it necessary to convert Java bytecode to `.dex` format?


    The answer is that we do not have the same amount of power, memory, and RAM on
    mobile devices as we do on PCs. This explains why we require increasingly lightweight
    applications. On PCs, Java bytecode is appropriate for heavyweight applications.
    The DVM uses compression techniques to eliminate superfluous information in the
    classes before generating the `.dex` file. For example, if your Java source code
    has 1,000 classes, all these 1,000 classes will be available as a single file
    in the Dalvik executable format `(.dex`).


    The conversion of Java source code (.java) to Dalvik byte code (`.dex`) is depicted
    in the flowchart as shown in *[Figure 10.6](#c10.xhtml#fig10_6)*:


    ![](images/Figure-10.6.jpg)


    **Figure 10.6:** Conversion of .java to .dex


    # [Zygote](#toc.xhtml#s164a)


    The zygote is one of the first programs that start when an Android device boots
    up, and it is responsible for the following:


    *   Starting up a virtual machine


    *   Preloading the core libraries


    *   Initializing various shared structures


    # [Core Java libraries](#toc.xhtml#s165a)


    These are distinct from the core Java libraries’ Java SE and Java ME libraries.
    Dalvik libraries are a common name for them. These are some of them:


    *   **DVM-specific libraries**: These libraries are designed to communicate with
    a DVM instance directly. They are unlikely to be used by the development community.


    *   **Java interoperability libraries**: These are just a collection of classes
    found in the core Java runtime libraries; often, the libraries assist with file
    operations, string manipulation, and other networking tasks.


    # [ART](#toc.xhtml#s166a)


    The DVM was totally replaced by ART when Android Lollipop was released by Google.
    ART has several advantages over the DVM, which include the following:


    *   **Ahead-of-time** (**AOT**) versus old **Just-in-time** (JIT) Compilation


    *   Improved garbage collection


    *   Better application performance


    The process of compiling ART code is depicted in *[Figure 10.7](#c10.xhtml#fig10_7):*


    ![](images/Figure-10.7.jpg)'
