    \ Run the following commands on your system, as shown in **Figure 11.17**:\n\n\
    \    ```\n    objection -g DVIA-v2 explore\n    ios jailbreak disable\n    ```\n\
    \n    ![](images/Figure-11.17.jpg)\n\n    **Figure 11.17:** Objection commands\n\
    \n2.  Go back to the application and select `Jailbreak 1`, then note that the\
    \ jailbreak detection has been disregarded, as shown in **Figure 11.18**:\n\n\
    \    ![](images/Figure-11.18.jpg)\n\n    **Figure 11.18:** Device is not Jailbroken\
    \ using objection\n\nThe following list includes a variety of tools that can be\
    \ used to avoid jailbreak detection:\n\n*   **Liberty Lite**: **[https://yalujailbreak.net/liberty-lite/](https://yalujailbreak.net/liberty-lite/)**\n\
    *   **A-Bypass**: **[https://repo.co.kr/package/com.rpgfarm.a-bypass](https://repo.co.kr/package/com.rpgfarm.a-bypass)**\n\
    \n## Bypassing SSL pinning\n\nLet us now see how we can bypass the SSL Pinning\
    \ using various methods.\n\n### Using Objection\n\n1.  Run the following commands\
    \ on your system, as shown in **Figure 11.19**:\n\n    ```\n    objection -g DVIA-v2\
    \ explore\n    ios sslpinning disable\n    ```\n\n    ![](images/Figure-11.19.jpg)\n\
    \n    **Figure 11.19:** SSLPinning disable using objection\n"
  trans: "\n\n## 半脱狱\n\n由于它允许设备自行启动，半脱狱类似于完全脱狱。每次设备启动时，启动过程保持不变，并进入其默认的非越狱状态。然而，用户可以使用在其设备上运行的应用程序重新越狱其手机，而不像系绊越狱或半系绊越狱那样需要计算机。\n\
    \n越狱过程简单明了，耗时 2 到 5 分钟。以下工具可用于越狱特定的 iOS 版本。请参阅 **图 11.7**：\n\n![](img/Figure-11.7.jpg)\n\
    \n**图 11.7：** 越狱工具\n\n**越狱为 iOS 15 版本提供了工具，更高版本的是 Zeon。您可以从 [`zeon-app.com/`](https://zeon-app.com/)\
    \ 下载它以设置环境。**\n\n本部分将介绍开始学习 iOS 应用程序所需的工具、脚本和应用程序。请注意，有许多工具和脚本可用。本文可能无法涵盖所有工具；因此，建议您独立调查每一个工具。\n\
    \n请注意，建议在物理设备上测试 iOS 应用程序。我使用各种 iPhone 7 和 iPhone 12 mini 设备。此外，请确保关闭自动更新，以防止在等待越狱时获取最新版本。\n\
    \n可通过访问 **[`www.corellium.com/`](https://www.corellium.com/)** 获取虚拟设备。\n\n## 易受攻击的应用程序\n\
    \n使用以下易受攻击的应用程序，并按照提供的说明将它们安装在指定的存储库中：\n\n*   **DVIA-v2**：**[`github.com/prateek147/DVIA-v2i`](https://github.com/prateek147/DVIA-v2i)**\n\
    *   **GOAT**：**[`github.com/OWASP/igoat`](https://github.com/OWASP/igoat)**。我们将使用\
    \ DVIA-v2 应用程序。\n\n## 测试方法论\n\n在对 iOS 应用程序进行渗透测试时，涉及多个要素。使用手动方法和 `MobSF` 等工具进行静态分析是其中之一。另一个要素涉及运行时利用，这意味着挂钩各种方法和对象以绕过障碍并获取敏感数据。最后测试应用程序生成的动态\
    \ API 调用，例如登录 API 请求等。\n\n为了从 iOS 应用程序中提取 IPA，我们将首先使用 `MobSF` 对其运行静态分析。然后，我们将检查许多绕过技术，例如越狱检测绕过、SSL\
    \ Pinning 绕过、本地认证绕过等。\n\n## 提取 IPA\n\n提取 IPA 文件有很多方法；然而，为了本文的目的，我们将使用 SSH。\n\n\
    提取 IPA 的步骤如下：\n\n1.  SSH 连接到您的 iPhone：`ssh root@ip`（默认密码为 Alpine）\n2.  转到此处列出的目录：`/var/containers/Bundle/Application`\n\
    3.  现在查找应用程序：`find | grep “app_name”`\n4.  转到您的应用程序所在的文件夹：`cd <app_directory>`\n\
    5.  创建一个名为 `Payload` 的目录：`mkdir Payload`\n6.  将数据传输到 `Payload` 目录：`cp -r <appname.app>/\
    \ Payload/`\n7.  压缩 `Payload` 目录后将其格式化为 IPA 格式：`zip -r /var/root/<appname>.ipa\
    \ Payload/`\n\n## 使用 MobSF 运行静态分析\n\n在提取 IPA 文件后进行 `MobSF` 静态分析。尽管您可以使用安装程序或任何其他可用的安装技术，但我们将使用\
    \ `MobSF` docker 选项。\n\n*   **MobSF**：**[`github.com/MobSF/Mobile-Security-Framework-MobSF`](https://github.com/MobSF/Mobile-Security-Framework-MobSF)**\n\
    *   **MobSF 文档**：**[`mobsf.github.io/docs/#/`](https://mobsf.github.io/docs/#/)**\n\
    \n要执行静态分析，请遵循给定的步骤：\n\n1.  运行 `MobSF` Web 界面\n2.  拖放 IPA 文件并运行静态分析\n3.  静态分析完成后，搜索配置错误，例如：\n\
    \n    1.  不安全的 URL Scheme，如 **图 11.8** 所示：\n\n        ![](img/Figure-11.8.jpg)\n\
    \n        **图 11.8：** 不安全的 URL Scheme\n\n    2.  不安全的权限和 ATS 配置错误，如 **图 11.9**\
    \ 所示：\n\n        ![](img/Figure-11.9.jpg)\n\n        **图 11.9：** 不安全的权限\n\n  \
    \  3.  不安全的二进制选项，如 **图 11.10** 所示：\n\n        ![](img/Figure-11.10.jpg)\n\n  \
    \      **图 11.10：** 不安全的二进制选项\n\n    4.  Firebase 数据库、硬编码信息和电子邮件，如 **图 11.11**\
    \ 所示：\n\n        ![](img/Figure-11.11.jpg)\n\n        **图 11.11：** Firebase 数据库、电子邮件和硬编码信息\n\
    \n    5.  其他有趣的文件，如 Assets、Resources、Debug Info、Native 和 Non-Native Libs。\n\n\
    ## 设置代理\n\n`Burp Suite` 的代理配置方法相当容易理解和实现。请遵循给定的步骤：\n\n1.  在 `Wi-Fi 设置` 中，启用手动代理并输入代理信息，如\
    \ **图 11.12** 所示：\n\n    ![](img/Figure-11.12.jpg)\n\n    **图 11.12：** Wi-Fi 设置\n\
    \n2.  转到 `Burp Suite` 中的 `代理设置` 并将监听器更改为 `所有接口`，如 **图 11.13** 所示：\n\n    ![](img/Figure-11.13.jpg)\n\
    \n    **图 11.13：** 代理设置\n\n3.  现在，在 iPhone 上打开 `http://burp` 并下载 CA 证书。\n4.  安装\
    \ CA 证书。\n5.  现在，导航到 `设置` | `通用` | `关于本机` | `证书信任设置` 并启用 `Portswigger CA 证书`，如\
    \ **图 11.14** 所示：\n\n    ![](img/Figure-11.14.jpg)\n\n    **图 11.14：** 代理证书\n\n\
    ## 绕过越狱检测\n\n对于此演示，我们将考虑使用 `Frida` 和 `Objection` 工具绕过越狱的多种选择。请记住设备的状态是已越狱，如 **图\
    \ 11.15** 所示：\n\n![](img/Figure-11.15.jpg)\n\n**图 11.15：** 设备已越狱\n\n### 使用 Frida\n\
    \n1.  在您的系统上运行以下命令：`frida — codeshare rodnt/ios-jailbreak-bypass -f DVIA-v2`。\n\
    2.  返回应用程序并选择 `Jailbreak 1`，然后注意越狱检测已被忽略，如 **图 11.16** 所示：\n\n    ![](img/Figure-11.16.jpg)\n\
    \n    **图 11.16：** 使用 Frida 设备显示未越狱\n\n### 使用 Objection\n\n1.  在您的系统上运行以下命令，如\
    \ **图 11.17** 所示：\n\n    ```\n    objection -g DVIA-v2 explore\n    ios jailbreak\
    \ disable\n    ```\n\n    ![](img/Figure-11.17.jpg)\n\n    **图 11.17：** Objection\
    \ 命令\n\n2.  返回应用程序并选择 `Jailbreak 1`，然后注意越狱检测已被忽略，如 **图 11.18** 所示：\n\n    ![](img/Figure-11.18.jpg)\n\
    \n    **图 11.18：** 使用 Objection 设备显示未越狱\n\n以下列表包括可用于避免越狱检测的各种工具：\n\n*   **Liberty\
    \ Lite**：**[`yalujailbreak.net/liberty-lite/`](https://yalujailbreak.net/liberty-lite/)**\n\
    *   **A-Bypass**：**[`repo.co.kr/package/com.rpgfarm.a-bypass`](https://repo.co.kr/package/com.rpgfarm.a-bypass)**\n\
    \n## 绕过 SSL Pinning\n\n现在让我们看看如何使用各种方法绕过 SSL Pinning。\n\n### 使用 Objection\n\n\
    1.  在您的系统上运行以下命令，如 **图 11.19** 所示：\n\n    ```\n    objection -g DVIA-v2 explore\n\
    \    ios sslpinning disable\n    ```\n\n    ![](img/Figure-11.19.jpg)\n\n    **图\
    \ 11.19：** 使用 Objection 禁用 SSL Pinning\n\n"
