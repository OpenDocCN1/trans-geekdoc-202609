- raw: "Insecure authorization and unreliable authentication are frequently two checks\
    \ that lead to confusion. In this attack, it is discussed how to carry out attacks\
    \ that are outside the user’s level of power and access by taking advantage of\
    \ the poorly implemented user authorization checks.\n\nHere are a few examples\
    \ of the general dangers that fall into this category:\n\n*   IDOR\n\n*   Privilege\
    \ escalation\n\n*   Direct request\n\n# [M7: Client code quality](#toc.xhtml#s241a)\n\
    \nBecause of the frequently poor code quality, an attacker may try to send the\
    \ carefully constructed inputs to function calls made within an app in an effort\
    \ to execute them or watch the behavior of the program. It might cause some application\
    \ malfunctions and exploitable situations.\n\nHere are a few examples of the general\
    \ dangers that fall into this category:\n\n*   Format string vulnerabilities\n\
    \n*   Buffer overflows\n\n*   Remote code execution\n\n*   Memory exhaustion\n\
    \n# [M8: Code tampering](#toc.xhtml#s242a)\n\nAn attacker may try to modify the\
    \ application code and inject malicious code, such as a backdoor, and distribute\
    \ it using the App Store and other methods, which could result in the theft of\
    \ sensitive information and compromise of the user’s device as well if the application\
    \ does not implement the code tampering checks.\n\nHere are a few examples of\
    \ the general dangers that fall into this category:\n\n*   Malware injection\n\
    \n*   Stealing sensitive data\n\n*   Persistent backdoor\n\n# [M9: Reverse engineering](#toc.xhtml#s243a)\n\
    \nIn order to comprehend the application’s code patterns, various function implementations,\
    \ and to carry out bypass/attacks using a runtime and dynamic instrumentation\
    \ methodologies, the reverse engineering approach entails studying the binaries\
    \ and their code using tools like Hopper, otool, and IDA Pro.\n\nOne of the typical\
    \ instances is to examine how SSL Pinning logic is implemented, comprehend the\
    \ functions responsible for pinning checks, and then use tools like Frida to go\
    \ around it by creating a custom logic script.\n\n# [M10: Extraneous functionality](#toc.xhtml#s244a)\n\
    \nTypically, the development team stores code before sending an application to\
    \ production to allow for simple access to the backend server, to provide logs\
    \ for error analysis, or to store staging and testing information. This code is\
    \ not necessary for the app to operate. In essence, it is only necessary during\
    \ the development phase and has no use for the intended usage once the app is\
    \ in production.\n\nIn some circumstances, this code may contain data about databases,\
    \ user information, user rights, API endpoints, and so on, or it may disable features\
    \ like two-factor authentication.\n\n# [Conclusion](#toc.xhtml#s245a)\n\nThis\
    \ chapter discussed the principles of iOS penetration testing as well as various\
    \ methods for avoiding jailbreak detection bypass, biometrics bypass, SSL pinning\
    \ bypass, and sensitive data exposure in the local storage.\n\n# [Questions](#toc.xhtml#s246a)\n\
    \n1.  How do you bypass SSL pinning?\n\n2.  How do you bypass jailbreak detection?\n\
    \n3.  How bypass biometrics?\n\n4.  How is the exposure to sensitive data in the\
    \ local storage?\n\n# [CHAPTER 12](#toc.xhtml#c12)\n\n# [Reporting](#toc.xhtml#c12)\n\
    \n# [Introduction](#toc.xhtml#s247a)\n\nWe have finally reached the final chapter.\
    \ Congratulations! You have completed reading the entire book. But before we can\
    \ rejoice, we need to address one of the most crucial aspects of our wireless\
    \ penetration test and how to write a professional report for wireless penetration\
    \ testing.\n\n# [Structure](#toc.xhtml#s248a)\n\nThe following topics will be\
    \ covered in this chapter:\n\n*   Report writing\n\n*   Report writing stages\n\
    \n*   Penetration testing report sample\n\n# [Objectives](#toc.xhtml#s249a)\n\n\
    In this chapter, you will be able to understand how to write a professional penetration\
    \ testing report.\n\n# [Report writing](#toc.xhtml#s250a)\n\nWriting a report\
    \ for a penetration test involves many different tasks, including methodology,\
    \ processes, a correct description of the report’s content and design, a thorough\
    \ example of the report, and the tester’s own experiences. When the report is\
    \ finished, it is distributed to the technical team and senior management of the\
    \ target firms. This report is used as a guide if any future needs of this nature\
    \ arise.\n\n# [Report writing stages](#toc.xhtml#s251a)\n\nWriting a penetration\
    \ report involves extensive writing, which is divided into the following stages,\
    \ as further illustrated in *[Figure 12.1](#c12.xhtml#fig12_1)*:\n\n*   Report\
    \ planning\n\n*   Information collection\n\n*   Writing the first draft\n\n* \
    \  Review and finalization\n\n![](images/Figure-12.1.jpg)\n\n**Figure 12.1:**\
    \ Report writing stages\n\n# [Report planning](#toc.xhtml#s252a)\n\nPlanning a\
    \ report begins with the objectives, which aid readers in comprehending the key\
    \ findings of the penetration testing. This section explains the purpose of the\
    \ testing, the advantages of pen testing, and so on. Second, the time needed for\
    \ testing is included in the report planning process.\n\nMajor elements of report\
    \ writing are as follows:\n\n*   **Objectives**: It explains the general goal\
    \ and advantages of pen testing.\n\n*   **Time:** The inclusion of time is crucial\
    \ because it provides the system’s actual status. Imagine that this report will\
    \ protect the tester if something goes wrong later because it will show the risks\
    \ and vulnerabilities present in the penetration testing scope at the time in\
    \ question.\n\n*   **Target audience:** Target audiences such as information security\
    \ managers, information technology managers, the chief information security officer,\
    \ and the technical team should also be included in pen testing reports.\n\n*\
    \   **Report classification:** It needs to be appropriately classified because\
    \ it contains highly secret information such as server IP addresses, application\
    \ details, vulnerabilities, and threats. However, the target organization’s information\
    \ categorization policy must be taken into consideration while classifying the\
    \ information.\n\n*   **Report distribution:** The number of copies and report\
    \ distribution should be mentioned in the scope of the work. It also needs to\
    \ mention that the hardcopies can be controlled by printing a limited number of\
    \ copies attached with their number and the receiver’s name.\n\n# [Information\
    \ collection](#toc.xhtml#s253a)\n\nPen testers must list each step to ensure that\
    \ they have gathered all the information at all testing stages because the procedures\
    \ are intricate and time-consuming. Along with the methodologies, he must also\
    \ provide the tools and systems, scan results, vulnerability analyses, specifics\
    \ of his discoveries, and so on.\n\n# [Writing the first draft](#toc.xhtml#s254a)\n\
    \nOnce the tester is equipped with the necessary resources, he must now begin\
    \ writing the first draught. He must compose the first draught in great detail,\
    \ including all of the activities, procedures, and experiences.\n\n# [Review and\
    \ finalization](#toc.xhtml#s255a)\n\nThe report must be examined after it has\
    \ been written, first by the drafter and then by any mentors or colleagues who\
    \ may have helped. It is required of the reviewer to go through the report in\
    \ depth and look for any errors that need to be fixed.\n\n# [Content of penetration\
    \ testing report](#toc.xhtml#s256a)\n\nThe typical order format of a penetration\
    \ testing report is as follows:\n\n*   Executive summary  \n\n    *   Scope of\
    \ work\n\n    *   Project objectives\n\n    *   Assumption\n\n    *   Timeline\n\
    \n    *   Summary of findings\n\n    *   Summary of recommendation\n\n*   Methodology\
    \  \n\n    *   Planning\n\n    *   Exploitation\n\n    *   Reporting\n\n*   Detail\
    \ findings  \n\n    *   Detailed systems information\n\n    *   Windows server\
    \ information\n\n*   References  \n\n    *   Appendix\n\n# [Penetration testing\
    \ report sample](#toc.xhtml#s257a)\n\nThis section illustrates the different pages\
    \ within a penetration testing report sample.\n\n1.  Page 1 is illustrated in\
    \ *[Figure 12.2](#c12.xhtml#fig12_2):*\n\n    ![](images/Figure-12.2.jpg)"
  fmt: "\n不安全的授权和不可靠的认证是经常导致混淆的两项检查。本攻击讨论了如何通过利用实施不善的用户授权检查，实施超出用户权限和访问级别的攻击。\n\n\
    以下是属于此类的一般危险示例：\n\n*   IDOR\n*   权限提升\n*   直接请求\n\n# M7: 客户端代码质量\n\n由于代码质量经常较差，攻击者可能会尝试向应用内的函数调用发送精心构造的输入，试图执行它们或观察程序行为。这可能导致应用故障和可利用的情况。\n\
    \n以下是属于此类的一般危险示例：\n\n*   格式化字符串漏洞\n*   缓冲区溢出\n*   远程代码执行\n*   内存耗尽\n\n# M8: 代码篡改\n\
    \n攻击者可能会尝试修改应用代码并注入恶意代码（如后门），并通过 App Store 等方式分发。如果应用未实施代码篡改检查，这可能导致敏感信息窃取和用户设备受损。\n\
    \n以下是属于此类的一般危险示例：\n\n*   恶意软件注入\n*   窃取敏感数据\n*   持久化后门\n\n# M9: 逆向工程\n\n为了理解应用的代码模式、各种函数实现，并使用运行时和动态插桩方法实施绕过/攻击，逆向工程方法涉及使用\
    \ Hopper、otool 和 IDA Pro 等工具研究二进制文件及其代码。\n\n典型实例之一是检查 SSL Pinning 逻辑的实现方式，理解负责\
    \ Pinning 检查的函数，然后使用 Frida 等工具通过创建自定义逻辑脚本来绕过它。\n\n# M10: 多余功能\n\n通常，开发团队在将应用发送到生产环境前会保留代码，以便简单访问后端服务器、为错误分析提供日志，或存储暂存和测试信息。这些代码对于应用运行并非必要。本质上，它们仅在开发阶段必要，应用上线后对预期用途无用。\n\
    \n在某些情况下，这些代码可能包含数据库信息、用户信息、用户权限、API 端点等数据，或可能禁用双因素认证等功能。\n\n# 结论\n\n本章讨论了 iOS\
    \ 渗透测试的原则，以及避免越狱检测绕过、生物识别绕过、SSL Pinning 绕过和本地存储敏感数据泄露的各种方法。\n\n# 问题\n\n1.  如何绕过\
    \ SSL Pinning？\n2.  如何绕过越狱检测？\n3.  如何绕过生物识别？\n4.  本地存储中的敏感数据泄露是如何发生的？\n\n# 第 12\
    \ 章\n\n# 报告\n\n# 简介\n\n我们终于到了最后一章。恭喜！您已阅读完整本书。但在庆祝之前，我们需要解决无线渗透测试最关键的方面之一，以及如何撰写专业的无线渗透测试报告。\n\
    \n# 结构\n\n本章将涵盖以下主题：\n\n*   报告撰写\n*   报告撰写阶段\n*   渗透测试报告样例\n\n# 目标\n\n在本章中，您将了解如何撰写专业的渗透测试报告。\n\
    \n# 报告撰写\n\n撰写渗透测试报告涉及许多不同任务，包括方法论、流程、报告内容和设计的正确描述、详尽的报告示例以及测试人员自身的经验。报告完成后，会分发给目标公司的技术团队和高级管理层。如果未来出现同类需求，该报告可作为指南。\n\
    \n# 报告撰写阶段\n\n撰写渗透报告涉及大量写作，分为以下阶段（如*图 12.1*进一步所示）：\n\n*   报告规划\n*   信息收集\n*  \
    \ 撰写初稿\n*   审查与定稿\n\n```\n![](images/Figure-12.1.jpg)\n```\n\n**图 12.1：** 报告撰写阶段\n\
    \n# 报告规划\n\n报告规划始于目标，这有助于读者理解渗透测试的关键发现。本节解释测试目的、渗透测试的优势等。其次，测试所需时间包含在报告规划过程中。\n\
    \n报告撰写的主要要素如下：\n\n*   **目标**：解释渗透测试的总体目标和优势。\n*   **时间**：时间记录至关重要，因为它提供了系统的实际状态。设想一下，如果日后出现问题，这份报告将保护测试人员，因为它显示了渗透测试范围内当时存在的风险和漏洞。\n\
    *   **目标受众**：信息安全经理、信息技术经理、首席信息安全官和技术团队等目标受众也应包含在渗透测试报告中。\n*   **报告分类**：由于报告包含服务器\
    \ IP 地址、应用详情、漏洞和威胁等高度机密信息，因此需要适当分类。但在分类信息时，必须考虑目标组织的信息分类策略。\n*   **报告分发**：副本数量和报告分发应在工作范围中说明。还需注明纸质副本可通过打印有限数量的副本来控制，并附上编号和接收者姓名。\n\
    \n# 信息收集\n\n渗透测试人员必须列出每一步，以确保在所有测试阶段收集了所有信息，因为程序复杂且耗时。除了方法论，他还必须提供工具和系统、扫描结果、漏洞分析、发现的具体细节等。\n\
    \n# 撰写初稿\n\n测试人员具备必要资源后，现在必须开始撰写初稿。他必须详细撰写初稿，包括所有活动、程序和经验。\n\n# 审查与定稿\n\n报告撰写后必须进行审查，首先由起草人审查，然后由可能提供过帮助的导师或同事审查。审查人员必须深入审查报告，查找需要修复的任何错误。\n\
    \n# 渗透测试报告内容\n\n渗透测试报告的典型顺序格式如下：\n\n*   执行摘要\n    *   工作范围\n    *   项目目标\n   \
    \ *   假设\n    *   时间线\n    *   发现摘要\n    *   建议摘要\n*   方法论\n    *   规划\n    *\
    \   利用\n    *   报告\n*   详细发现\n    *   详细系统信息\n    *   Windows 服务器信息\n*   参考资料\n\
    \    *   附录\n\n# 渗透测试报告样例\n\n本节展示渗透测试报告样例中的不同页面。\n\n1.  第 1 页如*图 12.2*所示：\n\n\
    ```\n![](images/Figure-12.2.jpg)\n```\n"
  trans: "\n不安全的授权和不可靠的认证是经常导致混淆的两项检查。本攻击讨论了如何通过利用实施不善的用户授权检查，实施超出用户权限和访问级别的攻击。\n\n\
    以下是属于此类的一般危险示例：\n\n*   IDOR\n*   权限提升\n*   直接请求\n\n# M7: 客户端代码质量\n\n由于代码质量经常较差，攻击者可能会尝试向应用内的函数调用发送精心构造的输入，试图执行它们或观察程序行为。这可能导致应用故障和可利用的情况。\n\
    \n以下是属于此类的一般危险示例：\n\n*   格式化字符串漏洞\n*   缓冲区溢出\n*   远程代码执行\n*   内存耗尽\n\n# M8: 代码篡改\n\
    \n攻击者可能会尝试修改应用代码并注入恶意代码（如后门），并通过 App Store 等方式分发。如果应用未实施代码篡改检查，这可能导致敏感信息窃取和用户设备受损。\n\
    \n以下是属于此类的一般危险示例：\n\n*   恶意软件注入\n*   窃取敏感数据\n*   持久化后门\n\n# M9: 逆向工程\n\n为了理解应用的代码模式、各种函数实现，并使用运行时和动态插桩方法实施绕过/攻击，逆向工程方法涉及使用\
    \ Hopper、otool 和 IDA Pro 等工具研究二进制文件及其代码。\n\n典型实例之一是检查 SSL Pinning 逻辑的实现方式，理解负责\
    \ Pinning 检查的函数，然后使用 Frida 等工具通过创建自定义逻辑脚本来绕过它。\n\n# M10: 多余功能\n\n通常，开发团队在将应用发送到生产环境前会保留代码，以便简单访问后端服务器、为错误分析提供日志，或存储暂存和测试信息。这些代码对于应用运行并非必要。本质上，它们仅在开发阶段必要，应用上线后对预期用途无用。\n\
    \n在某些情况下，这些代码可能包含数据库信息、用户信息、用户权限、API 端点等数据，或可能禁用双因素认证等功能。\n\n# 结论\n\n本章讨论了 iOS\
    \ 渗透测试的原则，以及避免越狱检测绕过、生物识别绕过、SSL Pinning 绕过和本地存储敏感数据泄露的各种方法。\n\n# 问题\n\n1.  如何绕过\
    \ SSL Pinning？\n2.  如何绕过越狱检测？\n3.  如何绕过生物识别？\n4.  本地存储中的敏感数据泄露是如何发生的？\n\n# 第 12\
    \ 章\n\n# 报告\n\n# 简介\n\n我们终于到了最后一章。恭喜！您已阅读完整本书。但在庆祝之前，我们需要解决无线渗透测试最关键的方面之一，以及如何撰写专业的无线渗透测试报告。\n\
    \n# 结构\n\n本章将涵盖以下主题：\n\n*   报告撰写\n*   报告撰写阶段\n*   渗透测试报告样例\n\n# 目标\n\n在本章中，您将了解如何撰写专业的渗透测试报告。\n\
    \n# 报告撰写\n\n撰写渗透测试报告涉及许多不同任务，包括方法论、流程、报告内容和设计的正确描述、详尽的报告示例以及测试人员自身的经验。报告完成后，会分发给目标公司的技术团队和高级管理层。如果未来出现同类需求，该报告可作为指南。\n\
