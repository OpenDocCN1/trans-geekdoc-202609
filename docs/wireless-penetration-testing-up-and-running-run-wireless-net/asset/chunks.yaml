    # [Insecure authentication](#toc.xhtml#s199a)


    The next vulnerability on the OWASP list for mobile security is insecure authentication.
    Mobile apps must confirm the user’s identity prior to allowing access. A common
    method of executing an authentication bypass is to take advantage of known flaws,
    such as faulty service request validation carried out by the backend server of
    the mobile app. Particularly when transmitting sensitive data, such as banking
    information, mobile apps need to confirm, and maintain user identity.


    **Remediation measures for this vulnerability:**


    An attacker may take advantage of holes in the mobile app authentication system.
    By taking advantage of those flaws, they can get around password restrictions
    or obtain more permissions, which can result in data theft and other harm.


    So, what can you do to stop it?


    *   Do not use local authentication techniques. Place this responsibility on the
    server side instead and only download application data upon successful authentication.


    *   Avoid using weak authentication techniques (such as device identity), avoid
    storing passwords locally, use **multi-factor authentication** (**MFA**), forbid
    using the entire four-digit PIN as a password, and so on.


    # [Insufficient cryptography](#toc.xhtml#s200a)


    A system’s cryptography may be broken in one of two circumstances, exposing sensitive
    information:


    *   It is possible that the fundamental encryption and decryption algorithm is
    insecure, or


    *   There are implementation problems with the cryptography process itself.


    Mobile apps with broken cryptography may be the consequence of a number of different
    things. The following are some of these possible causes:


    *   bypassing the encryption techniques incorporated within the code,


    *   managing your digital keys improperly, and


    *   using non-standard or outdated encryption techniques.


    **Remediation measures for this vulnerability:**


    Inadequate cryptographic safeguards may enable unauthorized access to sensitive
    data (such as the user’s personal information) stored on the device.


    *   Use the **National Institute of Standards and Technology’s** (**NIST**) recommended
    strong cryptographic standards.


    *   When possible, avoid storing any sensitive information on the device.


    # [Insecure authorization](#toc.xhtml#s201a)


    Users are not all created equally! Although some users only need the basic permissions
    and capabilities, others, like admin users, may need more. Poor authorization
    protocols do not check the user’s identity or authority to access the requested
    resources. Hackers are able to log in as authorized users and conduct privilege
    escalation attacks because identification policies and the rights granted to users
    are not effectively enforced.


    **Remediation measures for this vulnerability:**


    Similar to insecure authentication, unsecured authorization has negative effects.
    Both of them carry the risk of data loss, harm to one’s reputation, and potential
    noncompliance fines and penalties.


    *   Make sure that the backend processes for each request check to see if the
    incoming identifiers linked to an identity match and genuinely belong to the identity.


    *   Use data from backend systems to validate a user’s roles and permissions rather
    than relying just on data from the user’s mobile device.


    # [Client code quality](#toc.xhtml#s202a)


    This section of the OWASP mobile security threats list is sort of a catch-all
    for problems with mobile clients caused by bad code implementations.


    An attacker may send specially created inputs to function calls made within an
    app in an effort to run them or track the activity of the program. It might result
    in decreased speed, more memory consumption, and so on. Because they occur on
    the mobile client and are distinct from coding errors that occur on the server,
    the coding errors must be corrected locally. Mobile apps may contain errors at
    the code level that might result in problems like:


    *   Format-string vulnerabilities.


    *   Buffer overflows.


    *   Integration with insecure third-party libraries.


    *   Remote code execution.


    Many apps rely on third-party libraries, which frequently have problems and are
    not thoroughly tested, to create their applications. Since they do not own the
    code, these problems are beyond the developer’s control. Rewriting portions of
    the code now being executed on the device is the most common solution for code-level
    issues. What else can you do, though?


    **Remediation measures for this vulnerability:**


    Remote code execution and other vulnerabilities and problems that we have already
    highlighted can result from poor code quality issues. Fortunately, there are a
    few things you may do to lessen these problems:


    *   Use automated tools to check for memory leaks, buffer overflows, and other
    issues. Rely on source code reviews. Write clear, well-documented code.


    *   Use consistent coding patterns across the organization.


    # [Code tampering](#toc.xhtml#s203a)


    Modified versions of mobile apps can occasionally be found in app stores. A modified
    program is one where a hacker changes the binary to add harmful code, set up a
    backdoor, and so on. Attackers have the ability to re-sign these fake apps and
    upload the updated version to other app stores. In order to mislead a victim into
    downloading the software, they can also deliver to them directly via a phishing
    attack.


    **Remediation measures for this vulnerability:**


    Modifying the code can result in financial losses, identity theft, reputational
    harm, and other problems.


    *   If more code has been added or modified, the app must be able to recognize
    any code integrity violations and respond appropriately to them when they occur.
    Users may be informed about code changes by using a tool like a code signing certificate.


    *   Utilize anti-tamper techniques to disable the execution of unauthorized apps
    by using checksums, digital signatures, code hardening, and other validation approaches.


    # [Reverse engineering](#toc.xhtml#s204a)


    Attackers might decompile and reverse engineer the app to analyze its source code.
    This is especially risky as the attacker may comprehend, examine, and edit the
    code to introduce destructive functionality or transmit unwanted adverts. They
    can edit the software using tools like IDA Pro, Hopper, and other binary inspection
    tools once they have a basic understanding of how it functions. They can recompile
    and launch the software once they have got it to behave as they want.


    **Remediation measures for this vulnerability:**


    The attacker must be unable to de-obfuscate the code using tools like IDA Pro
    and Hopper in order to prevent reverse engineering.


    # [Extraneous functionality](#toc.xhtml#s205a)


    Mobile app developers occasionally mistakenly include features or backdoors that
    are hidden from consumers via the user interface. These items might be put into
    use in a production setting with a feature that was not meant to be there, posing
    a security risk.


    Hackers can often take advantage of these flaws in their systems without the assistance
    of regular users. They may look through configuration files, analyze the binaries,
    and other things to find features of the backend system that hackers can use to
    launch an attack.


    **Remediation measures for this vulnerability:**


    Manual secure code review is one of the best approaches to stop these kinds of
    mobile app vulnerabilities. This makes it possible for you to:


    *   Check the configuration settings of the mobile app to look for any concealed
    switches.


    *   Make sure the logs do not contain assertions about the backend systems that
    are overly informative.


    # [Conclusion](#toc.xhtml#s206a)'
