- raw: "This chapter gives you step-by-step directions for setting up your own wireless\
    \ lab. You will also learn the fundamentals of installing Kali on your hard drive\
    \ and experimenting with virtual machines (VMWare) and take some knowledge about\
    \ wireless penetration testing tools such as Wireshark and Aircrack-ng. You will\
    \ also learn how to use the Web interface to configure your access point. Finally,\
    \ you will learn how to configure and use your wireless adaptor, and you must\
    \ first learn and perform numerous commands for verifying the status of the wireless\
    \ client’s connection to the access point.\n\n# [Hardware requirements](#toc.xhtml#s4a)\n\
    \nTo set up the wireless lab, we will need the following hardware:\n\n*   **Two\
    \ laptops with internal Wi-Fi cards:** In our lab, we will use one laptop as the\
    \ victim and the other as the penetration tester’s laptop. Though practically\
    \ any laptop will do, laptops with at least 4 GB of RAM are preferred because\
    \ our trials may include a lot of memory-intensive software.\n\n*   **One Wireless\
    \ Adapters:** Depending on your laptop’s wireless card, we may require a USB Wi-Fi\
    \ card that supports packet injection and sniffing, which Kali supports. The Alfa\
    \ AWUS036H card from Alfa Networks appears to be the best option. Refer to *[Figure\
    \ 1.1](#c01.xhtml#fig1_1)*:\n\n![](images/Figure-1.1.jpg)\n\n**Figure 1.1:** Alfa\
    \ AWUS036H wireless adaptor\n\nThe TP-Link N150 Wireless High Gain USB Adapter\
    \ (TLWN722N), as shown in *[Figure 1.2](#c01.xhtml#fig1_2)*, Panda 300Mbps Wireless\
    \ N USB Adapter, and Edimax EW7711UAN are all smaller and slightly less expensive\
    \ alternatives.\n\n![](images/Figure-1.2.jpg)\n\n**Figure 1.2:** TLWN722N wireless\
    \ adaptor\n\n*   **One access point**: Any access point that supports the encryption\
    \ technologies WEP/WPA/WPA2 will suffice. For the purposes of example in this\
    \ book, we will be using a NETGEAR D1500 Wireless router.\n\n*   **An active internet\
    \ connection**: This will assist with research, software downloads, and some of\
    \ our experiments.\n\n# [Software requirements](#toc.xhtml#s5a)\n\nTo set up the\
    \ wireless lab, we will need the following software:\n\n*   **Virtual machine\
    \ platforms such as VMware or VirtualBox**: Because of their widespread use, virtualization\
    \ software is a desirable alternative for setting up your testing machine on a\
    \ virtualized platform. The bother of dual booting the computer is eliminated\
    \ by virtualization software, which offers a robust set of functions at a low\
    \ price. Cloning virtual machines, which allows you to make numerous clones of\
    \ the same system, is another practical function that the majority of virtualization\
    \ software products offer. In a practical penetration test, you may need to clone\
    \ and replicate your testing computer in order to install more hacking tools and\
    \ update Kali Linux configuration settings, preserving a copy of the earlier image\
    \ to be used as a base image in a virtualized environment. This is pretty simple\
    \ to accomplish.\n\n*   **Kali Linux**: The official website for Kali is **[https://www.kali.org/](https://www.kali.org/)**,\
    \ where you may download the program. You should be able to get the program directly\
    \ from the website because it is open source.\n\n*   **Windows 7/Windows 8/Windows\
    \ 8.1/Windows 10/Windows 11**: On one of the laptops, you will need to have Windows\
    \ 7, Windows 8, Windows 8.1, Windows 10, or Windows 11 installed. For the remainder\
    \ of the book, this laptop will serve as the victim machine.\n\n**It is worth\
    \ noting that while we are testing on a Windows-based OS, the concepts we have\
    \ learned may be applied to any Wi-Fi-capable device, including smartphones and\
    \ tablets, as we will discuss toward the end of the book (*[Chapter 11: iOS Penetration\
    \ Testing](#c11.xhtml)* and *[Chapter 12: Reporting](#c12.xhtml)*).**\n\n# [Downloading\
    \ and installing Kali Linux](#toc.xhtml#s6a)\n\nKali Linux (formerly known as\
    \ BackTrack Linux) is an open-source, Debian-based Linux distribution aimed at\
    \ advanced penetration testing and security auditing. Kali Linux contains several\
    \ hundred tools targeted toward various information security tasks, such as penetration\
    \ testing, security research, computer forensics, and reverse engineering. Kali\
    \ Linux is a multi-platform solution, accessible and freely available to information\
    \ security professionals and hobbyists.\n\nKali Linux was released on March 13,\
    \ 2013, as a complete, top-to-bottom rebuild of BackTrack Linux, adhering completely\
    \ to Debian development standards. Let us get started with the Kali Linux download\
    \ and installation if your machine is 64-bit, as shown in *[Figure 1.3](#c01.xhtml#fig1_3)*.\
    \ Where we will use a 64-bit Kali Linux Machine; else, if your machine is 32-bit,\
    \ you need to download Kali Linux 32-bit, and you can install the Kali Linux 32-bit\
    \ like 64-bit on a Virtual machine platform.\n\nKali Linux download procedure\
    \ (we recommend the image marked Installer) is as shown in *[Figure 1.3](#c01.xhtml#fig1_3)*:\n\
    \n![](images/Figure-1.3.jpg)\n\n**Figure 1.3:** Kali Linux download\n\n# [Installing\
    \ Kali Linux inside VMware (Guest VM) step-by-step](#toc.xhtml#s7a)\n\nTo install\
    \ Kali Linux inside VMware (Guest VM), follow the given steps:\n\n1.  Upon starting\
    \ up VMware Workstation, select `Create a New Virtual Machine`, as shown in *[Figure\
    \ 1.4](#c01.xhtml#fig1_4)*: \n\n    ![](images/Figure-1.4.jpg)\n\n    **Figure\
    \ 1.4:** Create a new virtual machine\n\n2.  Select `Custom (advanced)` for the\
    \ Virtual Machine Configuration when you have the option, as this will provide\
    \ us with greater control over the VM creation. Refer to *[Figure 1.5](#c01.xhtml#fig1_5)*:\
    \ \n\n    ![](images/Figure-1.5.jpg)\n\n    **Figure 1.5:** Virtual machine configuration\n\
    \n3.  The next screen is `Virtual Machine Hardware Compatibility`, in which we\
    \ use `Workstation 8.x`, as shown in *[Figure 1.6](#c01.xhtml#fig1_6)*: \n\n \
    \   ![](images/Figure-1.6.jpg)\n\n    **Figure 1.6:** Virtual machine hardware\
    \ compatibility\n\n4.  If this is your first time using the wizard, you may be\
    \ presented with the following prompt, which explains how adding `VMware tools`\
    \ can improve your VM experience. Before pressing close, you might want to check\
    \ the `Don’t show this page again` box after reading and comprehending the page,\
    \ as shown in *[Figure 1.7](#c01.xhtml#fig1_7)*: \n\n    ![](images/Figure-1.7.jpg)\n\
    \n    **Figure 1.7:** Install VMware tools\n\n5.  By choosing `Edit virtual machine\
    \ settings`, we may now edit the VM’s settings before it starts up, as shown in\
    \ *[Figure 1.8](#c01.xhtml#fig1_8)*: \n\n    ![](images/Figure-1.8.jpg)\n\n  \
    \  **Figure 1.8:** Edit virtual machine settings\n\n6.  We have no use for a printer;\
    \ therefore, we get rid of it. To remove a printer, go to the `Printer` section\
    \ and hit `Remove`, as shown in *[Figure 1.9](#c01.xhtml#fig1_9)*: \n\n    ![](images/Figure-1.9.jpg)\n\
    \n    **Figure 1.9:** Remove the printer device\n\n7.  If you want to change how\
    \ USB devices behave, you can change the `USB` settings. We have turned off `Automatically\
    \ connect new USB devices` (this option may not be available depending on your\
    \ VMware version) and turned on `Show all USB input devices`, as shown in *[Figure\
    \ 1.10](#c01.xhtml#fig1_10)*: \n\n    ![](images/Figure-1.10.jpg)\n\n    **Figure\
    \ 1.10:** USB settings\n\n8.  There is one more thing to mention in the `Display`\
    \ section. Make sure `Accelerated 3D graphics` is turned off, as it has been documented\
    \ to create problems, as shown in *[Figure 1.11](#c01.xhtml#fig1_11)*: \n\n  \
    \  ![](images/Figure-1.11.jpg)\n\n    **Figure 1.11:** Display settings\n\n9.\
    \  Next, we will go to the `Options` menu and scroll down to `Power`. We chose\
    \ to allow `Report battery information to guests` since it is a useful feature\
    \ for Kali users who use laptops or notebooks, as shown in *[Figure 1.12](#c01.xhtml#fig1_12)*:\
    \ \n\n    ![](images/Figure-1.12.jpg)\n\n    **Figure 1.12:** Power options\n\n\
    10.  We choose `Always enable` under `Shared folders` do not reveal any paths\
    \ at this time, as some users may not want to, as shown in *[Figure 1.13](#c01.xhtml#fig1_13)*:\
    \ \n\n     ![](images/Figure-1.13.jpg)"
  fmt: "\n# Setting Up Your Wireless Lab\n\nThis chapter gives you step-by-step directions\
    \ for setting up your own wireless lab. You will also learn the fundamentals of\
    \ installing Kali on your hard drive and experimenting with virtual machines (VMWare)\
    \ and take some knowledge about wireless penetration testing tools such as `Wireshark`\
    \ and `Aircrack-ng`. You will also learn how to use the Web interface to configure\
    \ your access point. Finally, you will learn how to configure and use your wireless\
    \ adaptor, and you must first learn and perform numerous commands for verifying\
    \ the status of the wireless client's connection to the access point.\n\n## Hardware\
    \ Requirements\n\nTo set up the wireless lab, we will need the following hardware:\n\
    \n*   **Two laptops with internal Wi-Fi cards:** In our lab, we will use one laptop\
    \ as the victim and the other as the penetration tester's laptop. Though practically\
    \ any laptop will do, laptops with at least 4 GB of RAM are preferred because\
    \ our trials may include a lot of memory-intensive software.\n*   **One Wireless\
    \ Adapter:** Depending on your laptop's wireless card, we may require a USB Wi-Fi\
    \ card that supports packet injection and sniffing, which Kali supports. The Alfa\
    \ AWUS036H card from Alfa Networks appears to be the best option. Refer to *Figure\
    \ 1.1*:\n\n    ![](images/Figure-1.1.jpg)\n\n    **Figure 1.1:** Alfa AWUS036H\
    \ wireless adaptor\n\n    The TP-Link N150 Wireless High Gain USB Adapter (TLWN722N),\
    \ as shown in *Figure 1.2*, Panda 300Mbps Wireless N USB Adapter, and Edimax EW7711UAN\
    \ are all smaller and slightly less expensive alternatives.\n\n    ![](images/Figure-1.2.jpg)\n\
    \n    **Figure 1.2:** TLWN722N wireless adaptor\n*   **One access point:** Any\
    \ access point that supports the encryption technologies WEP/WPA/WPA2 will suffice.\
    \ For the purposes of example in this book, we will be using a NETGEAR D1500 Wireless\
    \ router.\n*   **An active internet connection:** This will assist with research,\
    \ software downloads, and some of our experiments.\n\n## Software Requirements\n\
    \nTo set up the wireless lab, we will need the following software:\n\n*   **Virtual\
    \ machine platforms such as VMware or VirtualBox:** Because of their widespread\
    \ use, virtualization software is a desirable alternative for setting up your\
    \ testing machine on a virtualized platform. The bother of dual booting the computer\
    \ is eliminated by virtualization software, which offers a robust set of functions\
    \ at a low price. Cloning virtual machines, which allows you to make numerous\
    \ clones of the same system, is another practical function that the majority of\
    \ virtualization software products offer. In a practical penetration test, you\
    \ may need to clone and replicate your testing computer in order to install more\
    \ hacking tools and update Kali Linux configuration settings, preserving a copy\
    \ of the earlier image to be used as a base image in a virtualized environment.\
    \ This is pretty simple to accomplish.\n*   **Kali Linux:** The official website\
    \ for Kali is <https://www.kali.org/>, where you may download the program. You\
    \ should be able to get the program directly from the website because it is open\
    \ source.\n*   **Windows 7/Windows 8/Windows 8.1/Windows 10/Windows 11:** On one\
    \ of the laptops, you will need to have Windows 7, Windows 8, Windows 8.1, Windows\
    \ 10, or Windows 11 installed. For the remainder of the book, this laptop will\
    \ serve as the victim machine.\n\n> **Note:** It is worth noting that while we\
    \ are testing on a Windows-based OS, the concepts we have learned may be applied\
    \ to any Wi-Fi-capable device, including smartphones and tablets, as we will discuss\
    \ toward the end of the book (*Chapter 11: iOS Penetration Testing* and *Chapter\
    \ 12: Reporting*).\n\n## Downloading and Installing Kali Linux\n\nKali Linux (formerly\
    \ known as BackTrack Linux) is an open-source, Debian-based Linux distribution\
    \ aimed at advanced penetration testing and security auditing. Kali Linux contains\
    \ several hundred tools targeted toward various information security tasks, such\
    \ as penetration testing, security research, computer forensics, and reverse engineering.\
    \ Kali Linux is a multi-platform solution, accessible and freely available to\
    \ information security professionals and hobbyists.\n\nKali Linux was released\
    \ on March 13, 2013, as a complete, top-to-bottom rebuild of BackTrack Linux,\
    \ adhering completely to Debian development standards. Let us get started with\
    \ the Kali Linux download and installation if your machine is 64-bit, as shown\
    \ in *Figure 1.3*. Where we will use a 64-bit Kali Linux Machine; else, if your\
    \ machine is 32-bit, you need to download Kali Linux 32-bit, and you can install\
    \ the Kali Linux 32-bit like 64-bit on a Virtual machine platform.\n\nKali Linux\
    \ download procedure (we recommend the image marked Installer) is as shown in\
    \ *Figure 1.3*:\n\n![](images/Figure-1.3.jpg)\n\n**Figure 1.3:** Kali Linux download\n\
    \n## Installing Kali Linux Inside VMware (Guest VM) Step-by-Step\n\nTo install\
    \ Kali Linux inside VMware (Guest VM), follow the given steps:\n\n1.  Upon starting\
    \ up VMware Workstation, select `Create a New Virtual Machine`, as shown in *Figure\
    \ 1.4*:\n\n    ![](images/Figure-1.4.jpg)\n\n    **Figure 1.4:** Create a new\
    \ virtual machine\n\n2.  Select `Custom (advanced)` for the Virtual Machine Configuration\
    \ when you have the option, as this will provide us with greater control over\
    \ the VM creation. Refer to *Figure 1.5*:\n\n    ![](images/Figure-1.5.jpg)\n\n\
    \    **Figure 1.5:** Virtual machine configuration\n\n3.  The next screen is `Virtual\
    \ Machine Hardware Compatibility`, in which we use `Workstation 8.x`, as shown\
    \ in *Figure 1.6*:\n\n    ![](images/Figure-1.6.jpg)\n\n    **Figure 1.6:** Virtual\
    \ machine hardware compatibility\n\n4.  If this is your first time using the wizard,\
    \ you may be presented with the following prompt, which explains how adding `VMware\
    \ tools` can improve your VM experience. Before pressing close, you might want\
    \ to check the `Don't show this page again` box after reading and comprehending\
    \ the page, as shown in *Figure 1.7*:\n\n    ![](images/Figure-1.7.jpg)\n\n  \
    \  **Figure 1.7:** Install VMware tools\n\n5.  By choosing `Edit virtual machine\
    \ settings`, we may now edit the VM's settings before it starts up, as shown in\
    \ *Figure 1.8*:\n\n    ![](images/Figure-1.8.jpg)\n\n    **Figure 1.8:** Edit\
    \ virtual machine settings\n\n6.  We have no use for a printer; therefore, we\
    \ get rid of it. To remove a printer, go to the `Printer` section and hit `Remove`,\
    \ as shown in *Figure 1.9*:\n\n    ![](images/Figure-1.9.jpg)\n\n    **Figure\
    \ 1.9:** Remove the printer device\n\n7.  If you want to change how USB devices\
    \ behave, you can change the `USB` settings. We have turned off `Automatically\
    \ connect new USB devices` (this option may not be available depending on your\
    \ VMware version) and turned on `Show all USB input devices`, as shown in *Figure\
    \ 1.10*:\n\n    ![](images/Figure-1.10.jpg)\n\n    **Figure 1.10:** USB settings\n\
    \n8.  There is one more thing to mention in the `Display` section. Make sure `Accelerated\
    \ 3D graphics` is turned off, as it has been documented to create problems, as\
    \ shown in *Figure 1.11*:\n\n    ![](images/Figure-1.11.jpg)\n\n    **Figure 1.11:**\
    \ Display settings\n\n9.  Next, we will go to the `Options` menu and scroll down\
    \ to `Power`. We chose to allow `Report battery information to guests` since it\
    \ is a useful feature for Kali users who use laptops or notebooks, as shown in\
    \ *Figure 1.12*:\n\n    ![](images/Figure-1.12.jpg)\n\n    **Figure 1.12:** Power\
    \ options\n\n10. We choose `Always enable` under `Shared folders` do not reveal\
    \ any paths at this time, as some users may not want to, as shown in *Figure 1.13*:\n\
    \n    ![](images/Figure-1.13.jpg)\n\n    **Figure 1.13:** Shared folders settings\n"
  trans: "\n# 设置无线实验室\n\n本章提供了设置您自己的无线实验室的分步指导。您还将学习在硬盘上安装 Kali 的基础知识，以及尝试使用虚拟机（VMWare），并了解一些无线渗透测试工具，例如\
    \ `Wireshark` 和 `Aircrack-ng`。您还将学习如何使用 Web 界面配置您的接入点。最后，您将学习如何配置和使用您的无线网卡，并且必须首先学习并执行许多命令，以验证无线客户端与接入点连接的状态。\n\
    \n## 硬件要求\n\n要设置无线实验室，我们需要以下硬件：\n\n*   **两台带有内置 Wi-Fi 网卡的笔记本电脑：** 在我们的实验室中，我们将使用一台笔记本电脑作为受害者，另一台作为渗透测试员的笔记本电脑。虽然实际上任何笔记本电脑都可以，但建议使用至少拥有\
    \ 4 GB 内存的笔记本电脑，因为我们的实验可能包含大量占用内存的软件。\n*   **一个无线网卡：** 根据您笔记本电脑的无线网卡，我们可能需要一个支持数据包注入和嗅探的\
    \ USB Wi-Fi 网卡，Kali 支持此类网卡。Alfa Networks 的 Alfa AWUS036H 网卡似乎是最佳选择。请参阅 *图 1.1*：\n\
    \n    ![](img/Figure-1.1.jpg)\n\n    **图 1.1：** Alfa AWUS036H 无线网卡\n\n    如 *图\
    \ 1.2* 所示，TP-Link N150 无线高增益 USB 网卡 (TLWN722N)、Panda 300Mbps 无线 N USB 网卡和 Edimax\
    \ EW7711UAN 都是体积更小、价格略低的替代品。\n\n    ![](img/Figure-1.2.jpg)\n\n    **图 1.2：**\
    \ TLWN722N 无线网卡\n*   **一个接入点：** 任何支持 WEP/WPA/WPA2 加密技术的接入点均可。为了本书中的示例方便，我们将使用\
    \ NETGEAR D1500 无线路由器。\n*   **一个有效的互联网连接：** 这将有助于研究、软件下载和我们的一些实验。\n\n## 软件要求\n\
    \n要设置无线实验室，我们需要以下软件：\n\n*   **虚拟机平台，如 VMware 或 VirtualBox：** 由于其广泛使用，虚拟化软件是在虚拟化平台上设置测试机器的理想选择。虚拟化软件以低廉的价格提供了一套强大的功能，消除了双启动计算机的麻烦。克隆虚拟机（允许您制作同一系统的多个副本）是大多数虚拟化软件产品提供的另一个实用功能。在实际渗透测试中，您可能需要克隆并复制您的测试计算机，以便安装更多黑客工具并更新\
    \ Kali Linux 配置设置，同时保留早期镜像的副本，以便在虚拟化环境中用作基础镜像。这很容易实现。\n*   **Kali Linux：** Kali\
    \ 的官方网站是 <https://www.kali.org/>，您可以在该网站下载该程序。由于它是开源的，您应该能够直接从网站获取该程序。\n*   **Windows\
    \ 7/Windows 8/Windows 8.1/Windows 10/Windows 11：** 在其中一台笔记本电脑上，您需要安装 Windows 7、Windows\
    \ 8、Windows 8.1、Windows 10 或 Windows 11。在本书的其余部分中，这台笔记本电脑将作为受害者机器。\n\n> **注意：**\
    \ 值得注意的是，虽然我们是在基于 Windows 的操作系统上进行测试，但我们所学的概念可以应用于任何支持 Wi-Fi 的设备，包括智能手机和平板电脑，正如我们将在本书后面讨论的那样（*第\
    \ 11 章：iOS 渗透测试* 和 *第 12 章：报告*）。\n\n## 下载并安装 Kali Linux\n\nKali Linux（前身为 BackTrack\
    \ Linux）是一个开源的、基于 Debian 的 Linux 发行版，旨在进行高级渗透测试和安全审计。Kali Linux 包含数百种工具，针对各种信息安全任务，如渗透测试、安全研究、计算机取证和逆向工程。Kali\
    \ Linux 是一个多平台解决方案，可供信息安全专业人员和爱好者免费获取。\n\nKali Linux 于 2013 年 3 月 13 日发布，作为 BackTrack\
    \ Linux 的彻底自顶向下重建，完全遵循 Debian 开发标准。如果您的机器是 64 位，如 *图 1.3* 所示，让我们开始下载和安装 Kali Linux；我们将使用\
    \ 64 位 Kali Linux 机器；否则，如果您的机器是 32 位，您需要下载 Kali Linux 32 位版，并且可以像在虚拟机平台上安装 64\
    \ 位版一样安装 Kali Linux 32 位版。\n\nKali Linux 下载步骤（我们推荐标记为 Installer 的镜像）如 *图 1.3*\
    \ 所示：\n\n![](img/Figure-1.3.jpg)\n\n**图 1.3：** Kali Linux 下载\n\n## 在 VMware 中安装\
    \ Kali Linux（客户机 VM）分步指南\n\n要在 VMware 中安装 Kali Linux（客户机 VM），请遵循以下步骤：\n\n1.  启动\
    \ VMware Workstation 后，选择 `Create a New Virtual Machine`，如 *图 1.4* 所示：\n\n   \
    \ ![](img/Figure-1.4.jpg)\n\n    **图 1.4：** 创建新虚拟机\n\n2.  当有选项时，为虚拟机配置选择 `Custom\
    \ (advanced)`，因为这将为我们提供对 VM 创建的更大控制权。请参阅 *图 1.5*：\n\n    ![](img/Figure-1.5.jpg)\n\
    \n    **图 1.5：** 虚拟机配置\n\n3.  下一屏是 `Virtual Machine Hardware Compatibility`，我们使用\
    \ `Workstation 8.x`，如 *图 1.6* 所示：\n\n    ![](img/Figure-1.6.jpg)\n\n    **图 1.6：**\
    \ 虚拟机硬件兼容性\n\n4.  如果这是您第一次使用向导，可能会出现以下提示，解释添加 `VMware tools` 如何改善您的 VM 体验。在阅读并理解该页面后，您可能想在按下关闭之前勾选\
    \ `Don't show this page again` 复选框，如 *图 1.7* 所示：\n\n    ![](img/Figure-1.7.jpg)\n\
    \n    **图 1.7：** 安装 VMware tools\n\n5.  通过选择 `Edit virtual machine settings`，我们现在可以在\
    \ VM 启动前编辑其设置，如 *图 1.8* 所示：\n\n    ![](img/Figure-1.8.jpg)\n\n    **图 1.8：** 编辑虚拟机设置\n\
    \n6.  我们不需要打印机；因此，我们将其移除。要移除打印机，请转到 `Printer` 部分并点击 `Remove`，如 *图 1.9* 所示：\n\n\
    \    ![](img/Figure-1.9.jpg)\n\n    **图 1.9：** 移除打印机设备\n\n7.  如果您想更改 USB 设备的行为，可以更改\
    \ `USB` 设置。我们关闭了 `Automatically connect new USB devices`（此选项可能因您的 VMware 版本而不可用），并开启了\
    \ `Show all USB input devices`，如 *图 1.10* 所示：\n\n    ![](img/Figure-1.10.jpg)\n\
    \n    **图 1.10：** USB 设置\n\n8.  在 `Display` 部分还有一点要提。确保 `Accelerated 3D graphics`\
    \ 处于关闭状态，因为据记录它会导致问题，如 *图 1.11* 所示：\n\n    ![](img/Figure-1.11.jpg)\n\n    **图\
    \ 1.11：** 显示设置\n\n9.  接下来，我们将转到 `Options` 菜单并向下滚动到 `Power`。我们选择允许 `Report battery\
    \ information to guests`，因为这是一个对使用笔记本电脑的 Kali 用户有用的功能，如 *图 1.12* 所示：\n\n    ![](img/Figure-1.12.jpg)\n\
    \n    **图 1.12：** 电源选项\n\n10. 我们在 `Shared folders` 下选择 `Always enable`，目前不透露任何路径，因为某些用户可能不希望这样做，如\
    \ *图 1.13* 所示：\n\n    ![](img/Figure-1.13.jpg)\n\n    **图 1.13：** 共享文件夹设置\n"
