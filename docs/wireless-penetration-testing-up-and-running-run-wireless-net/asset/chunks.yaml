- raw: "*   Built-in support for Google Cloud Platform, enabling integration with\
    \ Firebase Cloud Messaging (Earlier *Google Cloud Messaging*) and Google App Engine.\n\
    \n*   Lint tools to catch performance, usefulness, version compatibility, and\
    \ other problems.\n\n*   Multi-preview API.\n\n*   Wear OS pairing Assistant.\n\
    \nThe following prerequisites must be met before downloading and installing Android\
    \ Studio.\n\n*   Operating System Version—Microsoft Windows 8/10 (64-bit).\n\n\
    *   x86\\_64 CPU Architecture 2^(nd) generation Intel Core or later or AMD CPU\
    \ with support a Windows.\n\n*   Random Access Memory (RAM)—Minimum 8 GB RAM or\
    \ more.\n\n*   Free Disk Space—Minimum 8 GB for IDE + Android SDK + Android Emulator.\n\
    \n*   Minimum Required JDK Version—Java Development Kit (JDK) 8.\n\n*   Minimum\
    \ Screen Resolution—1280 \\* 800 resolution.\n\n# [Downloading and installation\
    \ of Android Studio](#toc.xhtml#s174a)\n\nTo download and install Android Studio,\
    \ follow the given steps:\n\n1.  To download the Android Studio, visit the official\
    \ Android Studio website (**[https://developer.android.com/studio/](https://developer.android.com/studio/)**)\
    \ in your Web browser.\n\n2.  Click on the `Download Android Studio` option, as\
    \ shown in *[Figure 10.11](#c10.xhtml#fig10_11):* \n\n    ![](images/Figure-10.11.jpg)\n\
    \n    **Figure 10.11:** Download Android Studio from website\n\n3.  After downloading,\
    \ double-click on the `Android Studio-ide.exe` file.\n\n4.  `Android Studio Setup`\
    \ will appear on the screen, and click `Next` to proceed, as shown in *[Figure\
    \ 10.12](#c10.xhtml#fig10_12):*\n\n    ![](images/Figure-10.12.jpg)\n\n    **Figure\
    \ 10.12:** Android Studio Setup\\_1\n\n5.  Select the components that you want\
    \ to install and click on the `Next` button, as shown in *[Figure 10.13](#c10.xhtml#fig10_13):*\
    \ \n\n    ![](images/Figure-10.13.jpg)\n\n    **Figure 10.13:** Android Studio\
    \ Setup\\_2\n\n6.  Now, browse the location where you want to install the Android\
    \ Studio and click `Next` to proceed, as shown in *[Figure 10.14](#c10.xhtml#fig10_14):*\n\
    \n    ![](images/Figure-10.14.jpg)\n\n    **Figure 10.14:** Android Studio Setup\\\
    _3\n\n7.  Choose a start menu folder for the `Android Studio` shortcut and click\
    \ the `Install` button to proceed, as shown in *[Figure 10.15](#c10.xhtml#fig10_15):*\
    \ \n\n    ![](images/Figure-10.15.jpg)\n\n    **Figure 10.15:** Android Studio\
    \ Setup\\_4\n\n8.  After the successful completion of the installation, click\
    \ on the `Next` button, as shown in *[Figure 10.16](#c10.xhtml#fig10_16)*: \n\n\
    \    ![](images/Figure-10.16.jpg)\n\n    **Figure 10.16:** Android Studio Setup\\\
    _5\n\n9.  Click on the `Finish` button to proceed, as shown in *[Figure 10.17](#c10.xhtml#fig10_17):*\
    \ \n\n    ![](images/Figure-10.17.jpg)\n\n    **Figure 10.17:** Android Studio\
    \ Setup\\_6\n\n10.  Now, your Android studio welcome screen will appear on the\
    \ screen, as shown in *[Figure 10.18](#c10.xhtml#fig10_18):*\n\n     ![](images/Figure-10.18.jpg)\n\
    \n     **Figure 10.18:** Android Studio Setup\\_7\n\n# [The Android SDK](#toc.xhtml#s175a)\n\
    \nThe Android SDK allows developers to create, test, and debug apps for the Android\
    \ platform. It includes all the necessary software libraries, APIs, emulator system\
    \ images, documentation, and other resources for developing Android apps. We have\
    \ installed Android Studio along with the Android SDK, and it is critical to grasp\
    \ how to make the most of the SDK’s built-in features. This section gives an overview\
    \ of some of the key tools we will use to attack an Android app as part of the\
    \ penetration testing exercise.\n\n# [The Android Debug Bridge](#toc.xhtml#s176a)\n\
    \nThis is what we talked about in this chapter’s *Android Architecture* section.\
    \ It is a straightforward and powerful command-line tool that will be used to\
    \ interface with and operate Android devices. It is necessary to activate USB-Debugging\
    \ to connect with ADB on a physical device. You can access this on the Galaxy\
    \ Note 10 with Android v9 by going to `Settings` | `Developer` settings, as demonstrated\
    \ in *[Figure 10.19](#c10.xhtml#fig10_19)*.\n\nIf the Developer options are not\
    \ visible, it is because they are disabled; you may enable them by touching the\
    \ Build number field, which can be discovered by going to `Settings` | `About\
    \ Phone` | `Software information` | `Build number`. You should tap seven times\
    \ in total.\n\nRefer to *[Figure 10.19](#c10.xhtml#fig10_19):*\n\n![](images/Figure-10.19.jpg)\n\
    \n**Figure 10.19:** Android debug bridge\n\nThe following is a collection of ADB\
    \ commands that will be used during the testing process.\n\n# [Connecting to the\
    \ device](#toc.xhtml#s177a)\n\nOnce the device is connected to the workstation,\
    \ use the ADB devices command to see if the device is correctly set up with the\
    \ correct device drivers. This command displays a list of all connected devices\
    \ to your workstation. Refer to *[Figure 10.20](#c10.xhtml#fig10_20):*\n\n![](images/Figure-10.20.jpg)\n\
    \n**Figure 10.20:** ADB devices command\\_1\n\nWhen you run this command without\
    \ the device drivers for the mobile device loaded, you will get a blank list,\
    \ as shown in *[Figure 10.21](#c10.xhtml#fig10_21)*:\n\n![](images/Figure-10.21.jpg)\n\
    \n**Figure 10.21:** ADB devices command\\_2\n\nIn this instance, you may need\
    \ to download and install device drivers from the device manufacturers’ websites.\n\
    \n# [Getting access to the device](#toc.xhtml#s178a)\n\nAndroid is based on the\
    \ Linux kernel, as detailed in this chapter’s *Android Architecture* section.\
    \ You may use ADB to connect to a shell and perform commands on your mobile device.\
    \ If the `Allow USB Debugging` option is enabled once entered, the ADB shell command\
    \ can be used on a rooted or unrooted device, as demonstrated in the command-line\
    \ output as follows. You will have access to a standard shell with some limitations.\
    \ You may need to enter root mode by typing `su`, which allows you to run most\
    \ Linux commands. Refer to *[Figure 10.22](#c10.xhtml#fig10_22):*\n\n![](images/Figure-10.22.jpg)\n\
    \n**Figure 10.22:** ADB shell command\n\nIf the workstation is connected to more\
    \ than one device, you may need to use different parameters. Refer to *[Figure\
    \ 10.23](#c10.xhtml#fig10_23):*\n\n![](images/Figure-10.23.jpg)\n\n**Figure 10.23:**\
    \ ADB devices and shell commands\n\n*   `–s` to connect to the device\n\n*   `-d`\
    \ to connect only to the USB device\n\n*   `-e` to connect only to an emulator\n\
    \n# [Installing an application to the device](#toc.xhtml#s179a)\n\nInstalling\
    \ an Android app on a hardware device or an emulator would be a basic prerequisite\
    \ during the evaluation process. You can use the ADB install command; this will\
    \ require the APK file to be installed, as shown in *[Figure 10.24](#c10.xhtml#fig10_24)*:\n\
    \n![](images/Figure-10.24.jpg)\n\n**Figure 10.24:** ADB install command\n\n# [Extracting\
    \ files from the device](#toc.xhtml#s180a)\n\nTo examine what data is stored during\
    \ installation and uninstallation, we must ensure that no sensitive information\
    \ is left behind that could be exploited by rogue applications or users. As a\
    \ result, we extract the files for offline examination to access any sensitive\
    \ data. This can be done by using the ADB pull command and specifying the file\
    \ location on the device. We are grabbing all the apps that are installed on the\
    \ rooted device in *[Figure 10.25](#c10.xhtml#fig10_25)*:\n\n![](images/Figure-10.25.jpg)\n\
    \n**Figure 10.25:** ADB pull command\n\n# [Storing files to the device](#toc.xhtml#s181a)\n\
    \nWe may want to copy local files from the desktop to the Android device most\
    \ of the time. The syntax is **ADB push** local file remote location, where remote\
    \ location is the location where the file should be stored. For example, the following\
    \ command line output shows a `pushme.JPG` file being moved from a local workstation\
    \ to the device’s `/sdcard/` folder, as shown in *[Figure 10.26](#c10.xhtml#fig10_26):*\n\
    \n![](images/Figure-10.26.jpg)\n\n**Figure 10.26:** ADB command\n\n# [Stopping\
    \ the service](#toc.xhtml#s182a)"
