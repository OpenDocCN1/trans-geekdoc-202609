    # [CHAPTER 2](#toc.xhtml#c02)


    # [Wireless Attacking Techniques and Methods](#toc.xhtml#c02)


    # [Introduction](#toc.xhtml#s19a)


    In this second chapter of the book, we will presume that you either enjoyed the
    first chapter so much that you opted to keep reading or skipped it because you
    were satisfied with what you already knew. So, here is your first question, in
    any case. The usual person will get a wireless router but will not set up any
    wireless security. What makes you think that?


    Of course, you already know this, but it is because the average user may be unaware
    of the device’s security features or safeguards, or they may be computer knowledgeable
    but unfamiliar with how to implement wireless security. This is where **Wi-Fi
    Protected Setup** (**WPS**) comes in.


    WPS simplifies the setup of a wireless home network. The user simply presses a
    button on the wireless router, and the router configures a secure network for
    the user automatically. Isn’t that fantastic? Wrong! Most typical wireless routers
    are vulnerable to brute-force assaults. A WPS PIN is usually only a series of
    integers. Using brute-force approaches, an attacker can retrieve or crack the
    WPS PIN in just a few hours due to this security weakness.


    Users are not the only ones that do this; businesses and ISPs are as well. They
    will just plug in the wireless router and push the WPS button, after which they
    will write down the key for you. This is terrible security, especially for a company
    network! Please change the username, modify the default password, disable remote
    management, and activate the firewall.


    # [Structure](#toc.xhtml#s20a)


    In this chapter, we will discuss the following topics:


    * Access control attacks

    * Confidential attacks

    * Credential attacks

    * Authentication attacks


    # [Objectives](#toc.xhtml#s21a)


    This chapter gives you a complete understanding of numerous different wireless
    attack strategies, such as access control attacks, confidential attacks, credential
    attacks, and authentication attacks. The important thing to remember here is to
    be aware of the dangers we face when connecting to wireless access points and
    the internet.


    # [Access control attacks](#toc.xhtml#s22a)


    WLAN access control measures such as AP MAC filters and 802.11 port access controls
    are used in access control attacks to enter a network via wireless or to evade
    WLAN access control, as shown in *[Figure 2.1](#c02.xhtml#fig2_1)*:


    ![](images/Figure-2.1.jpg)


    **Figure 2.1:** WLAN access control


    The following sections demonstrate some access control attacks.


    # [War driving](#toc.xhtml#s23a)


    War driving is a hacking method and has its origins in the movie War Games, which
    starred actor Matthew Broderick. In the movie, Broderick’s character dials every
    phone number in his local area to discover all existing computers. That evolved
    into a process of mapping access points, which involves attackers finding vulnerable
    or unsecured Wi-Fi networks. War driving was termed by computer security consultant
    Peter Shipley, who developed software that can interact with portable **Global
    Positioning Systems** (**GPS**). Simply, War driving is the process of locating
    wireless LANs by listening for beacons or issuing probe requests, which serves
    as a launchpad for subsequent attacks. This attack can be carried out with tools
    such as Airmon-ng, DStumbler, KisMAC, and NetStumbler. War driving normally involves
    two people: one driving the car and the other scanning the surroundings for wireless
    networks. They can set up GPS settings to locate these Wi-Fi spots and preserve
    them for future wireless attacks with the right software and applications, as
    shown in *[Figure 2.2](#c02.xhtml#fig2_2)*:


    ![](images/Figure-2.2.jpg)


    **Figure 2.2:** War driving diagram


    # [Rogue access points](#toc.xhtml#s24a)

