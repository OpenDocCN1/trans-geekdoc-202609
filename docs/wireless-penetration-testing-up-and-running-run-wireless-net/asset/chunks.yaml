    Any wireless **access point** (**AP**) that is placed on a network without authorization,
    and hence, is not maintained by the network administrator is known as a rogue
    access point (AP). Rogue access points are not protected in the same way that
    normal access points are. They are particularly dangerous because they are physically
    hidden behind a network firewall, allowing anyone with access to the AP to obtain
    access to the whole network. Rogue APs can be plugged directly into a firewall
    or network switch, a wall connection, or even other network devices and can be
    installed maliciously by an attacker or simply by an employee looking for their
    own Wi-Fi access. Rogue access points, on the other hand, can be used for several
    assaults, including denial of service, data theft, and malware deployment, as
    shown in *[Figure 2.3](#c02.xhtml#fig2_3):*


    ![](images/Figure-2.3.jpg)


    **Figure 2.3:** Rouge access point


    # Ad hoc associations


    Ad hoc connection assaults are a particularly nasty sort of attack in which the
    attacker (malicious user) uses a third-party legitimate user as a man-in-the-middle
    between the attacker''s device and the AP or other type of gateway.


    The Ad hoc wireless network capability, which is essential for *device-in-the-middle*
    operations, may be deployed on both Windows and Linux computers and enables the
    establishment of ad-hoc (peer-to-peer) wireless links between client devices (without
    any additional network infrastructure such as AP). What you do behind the scenes
    is to build a virtual software AP on your PC, and the second device associates
    with the SSID you created (effectively making wireless links).


    An Ad hoc attack would be described in the following scenario, as shown in *Figure*
    *2.4*. Let us pretend the attacker is one of Computers 2, 3, or 4. Computer 1
    would be the victim (man-in-the-middle). This laptop will be the one that is running
    and providing wireless connectivity to the surrounding area and has another interface
    connected to the wired network for internet access.


    Attackers might connect to Computer 1''s WLAN and then use it to route all traffic
    to the internet through this victim''s PC. From the perspective of the internet,
    Computer 1 appears to be the source of the traffic! Wireless linkages from Computer
    1 to all attackers do not have to be Wi-Fi connections; they could be Bluetooth
    or any other sort of wireless technology that is supported by all parties involved
    in the communication attempt.


    Refer to *[Figure 2.4](#c02.xhtml#fig2_4)*:


    ![](images/Figure-2.4.jpg)


    **Figure 2.4:** Ad hoc associations


    # MAC spoofing


    A MAC spoofing attack is where the intruder sniffs the network for valid MAC addresses
    and attempts to act as one of the valid MAC addresses where the attacker has full
    network access through the wireless access point. This type of assault is popular
    at paid hotspots such as hotels, airports, coffee shops, and other paid Internet
    venues. The MAC spoofing attack is depicted in *[Figure 2.5](#c02.xhtml#fig2_5)*:


    ![](images/Figure-2.5.jpg)


    **Figure 2.5:** MAC spoofing


    # 802.11 RADIUS cracking


    Although we do not hear much about this attack, it is an essential topic to discuss.
    In this assault, the attacker uses brute force to obtain a **Remote Authentication
    Dial-In User Service** (**RADIUS**) secret from an 802.11 access request for malevolent
    purposes. On a LAN network between the AP and a RADIUS server, any packet capture
    tool will work. Because many APs, servers, and even software services will ask
    for a RADIUS login, it is quite risky. The attacker can acquire access to anything
    that requires RADIUS to approve access if RADIUS is compromised. This assault
    is depicted in *[Figure 2.6](#c02.xhtml#fig2_6):*


    ![](images/Figure-2.6.jpg)


    **Figure 2.6:** 802.11 RADIUS cracking


    # Confidential attacks


    These attacks try to intercept private data transferred over wireless networks,
    whether it is sent in clear text or encrypted using 802.11 or higher layer protocols.


    The following sections discuss various private attacks.


    # Eavesdropping


    Of course, we all understand what eavesdropping is, but do you understand what
    it implies in terms of security? When it comes to computer security, eavesdropping
    means capturing data, decoding it, and then obtaining potentially sensitive information.
    It is the same as listening to it on a phone call. You listen to the talk, record
    it, and then extract potentially sensitive information from it. Ettercap, Kismet,
    and Wireshark are all capable of this. The attack is depicted in *Figure* *2.7*:


    ![](images/Figure-2.7.jpg)


    **Figure 2.7:** Eavesdropping


    # WEP key cracking


    It is finally time to talk about WEP cracking! It is exactly what it sounds like:
    using passive or active methods to capture data to recover a WEP key. WEP encryption
    can now be hacked in less than 5 minutes with today''s improved hardware and software!
    WEP encryption should only be used if the old gear is still in use; otherwise,
    WPA2 encryption should be utilized. These attacks can be carried out using tools
    such as Aircrack-ng, AirSnort, Airoway, chopchop, and dwepcrack. An example of
    WEP key cracking is seen in *Figure* *2.8*:


    ![](images/Figure-2.8.jpg)


    **Figure 2.8:** WEP Key cracking


    # Evil twin AP


    Have you ever heard of an AP with an evil twin? A rogue access point is like an
    evil twin AP. To trick consumers into thinking it is a trusted wireless network,
    the attacker establishes a fake wireless AP. Because the beacons are faster and
    closer in range, they intensify their signal to the point where the client will
    instantly connect to them. The most common evil twin attack scenario you may come
    across in the wild is one with Captive Portals such as Starbucks, Airport, and
    Hotels where These attacks can be carried out via Honeypot, CqureAP, D-Link G200,
    HermesAP, Rogue Squadron, and WifiBSD. The following image depicts a common tool,
    as shown in *[Figure 2.9](#c02.xhtml#fig2_9):*


    ![](images/Figure-2.9.jpg)


    **Figure 2.9:** Evil twin AP


    # AP phishing


    To phish for logins, bank accounts, and credit card details, the attacker operates
    a phony Web portal or Web server on a false AP. Because ordinary users will not
    see the attack happening to them, this is by far one of the most hazardous and
    frightening attacks to encounter. They will think it is the actual website, but
    the attacker is merely waiting for them to check in so he can steal their data
    on the other side. These attacks can be carried out with tools such as Airpwn,
    Airsnarf, Hotspotter, Karma, and RGlueAP, as shown in *[Figure 2.10](#c02.xhtml#fig2_10):*


    ![](images/Figure-2.10.jpg)


    **Figure 2.10:** AP phishing


    # Man-in-the-middle attack


    You might have heard of this attack tactic before; if you have not, you will now!
    An attacker intercepts network traffic between you and another target in a man-in-the-middle
    attack. On a wired or wireless network, the attacker might get usernames and passwords,
    examine e-mails, view HTTP sessions of websites, and much more. These attacks
    can be carried out with tools such as dsniff, Ettercap-NG, and sshmitm. This attack
    is depicted in *Figure* *2.11*:


    ![](images/Figure-2.11.jpg)


    **Figure 2.11:** MITM attack


