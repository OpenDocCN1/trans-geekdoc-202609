    \n![](img/Figure-10.27.jpg)\n\n**图 10.27：** ADB logcat 命令\n\n所有日志都以几种消息类型开头，可以总结如下：\n\
    \n*   `V`：详细\n*   `D`：调试\n*   `I`：信息\n*   `W`：警告\n*   `E`：错误\n*   `F`：致命\n*  \
    \ `S`：静默\n\n# 旁路加载应用\n\n*旁路加载*通常指将 APK 格式的应用程序包安装到 Android 设备上。此类软件包通常从官方应用商店\
