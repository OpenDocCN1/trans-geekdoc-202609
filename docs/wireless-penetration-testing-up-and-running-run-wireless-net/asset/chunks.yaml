    \ **[https://github.com/prateek147/DVIA-v2i](https://github.com/prateek147/DVIA-v2i)**\n\
    *   **GOAT**: **[https://github.com/OWASP/igoat](https://github.com/OWASP/igoat)**.\
    \ We will be using the DVIA-v2 application.\n\n## Testing methodology\n\nWhen\
