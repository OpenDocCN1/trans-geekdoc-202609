- raw: "It will not only discover flaws but also give you information on the vulnerability\
    \ and the severity of the danger. It will include connections to additional information\
    \ and, if a security patch is available, links to download these security patches\
    \ to help provide an extra layer of security.\n\n# [Setting up a vulnerability\
    \ scanner](#toc.xhtml#s106a)\n\nNessus will be the topic of this section. We will\
    \ download and install Nessus, then register for an activation code, activate\
    \ the program, and execute our first scan.\n\n# [Downloading Nessus](#toc.xhtml#s107a)\n\
    \nBecause Nessus is not preinstalled on Kali Linux, we will need to download and\
    \ install it before we can begin searching for vulnerabilities. To get the most\
    \ recent version of Nessus, go to the following website: **[https://www.tenable.com/downloads/nessus](https://www.tenable.com/downloads/nessus)**\n\
    \nSelect the download according to your operating system, as shown in *[Figure\
    \ 6.1](#c06.xhtml#fig6_1)*:\n\n![](images/Figure-6.1.jpg)\n\n**Figure 6.1:** Nessus\
    \ download\n\n# [Installing Nessus](#toc.xhtml#s108a)\n\nWe will deploy the Nessus\
    \ vulnerability scanner in this demonstration. The steps are as follows:\n\n1.\
    \  Open a Terminal.\n\n2.  Enter the following command and press *Enter*: \n\n\
    \    `sudo dpkg -i Nessus-8.15.2-debian6_amd64.deb (For 64 bit OS)`\n\n    `sudo\
    \ dpkg -i Nessus-8.15.2-debian6_i386.deb (For 32 bit OS)`\n\n    *[Figure 6.2](#c06.xhtml#fig6_2)*\
    \ is the output:\n\n    ![](images/Figure-6.2.jpg)\n\n    **Figure 6.2:** Nessus\
    \ Download\\_2\n\n3.  Press *Enter* after entering the following command: \n\n\
    \    ` sudo systemctl start nessusd.service`\n\n    The Nessus vulnerability scanning\
    \ utility will be launched with this command, as shown in *[Figure 6.3](#c06.xhtml#fig6_3):*\n\
    \n    ![](images/Figure-6.3.jpg)\n\n    **Figure 6.3:** Nessus start\n\n4.  Navigate\
    \ to `https://127.0.0.1:8834` in a Web browser.\n\n5.  Click `Proceed` anyhow\
    \ when presented with the site’s security certificate. We will be present with\
    \ a screen that is shown in *[Figure 6.4](#c06.xhtml#fig6_4)*: \n\n    ![](images/Figure-6.4.jpg)\n\
    \n    **Figure 6.4:** Open Nessus in the Web browser\n\n6.  You will be presented\
    \ with the initialized screen for Nessus, as shown in *[Figure 6.5](#c06.xhtml#fig6_5)*:\
    \ \n\n    ![](images/Figure-6.5.jpg)\n\n    **Figure 6.5:** Initialize Nessus\n\
    \n7.  Obtaining an Activation Code for Nessus Vulnerability Scanner \n\n    Nessus\
    \ Essentials and Nessus Professional are two different versions of enable’s Nessus\
    \ Vulnerability Scanner. Nessus Essentials is free, although it has a limited\
    \ feature set compared to Nessus Professional, which costs money. The following\
    \ are some of the most significant limitations of Nessus Essentials:\n\n    *\
    \   Scanning is limited to 16 IP Addresses per scanner.\n\n    *   Compliance\
    \ checks or live results are not available.\n\n    *   No ability to use the Nessus\
    \ virtual appliance.\n\n    Nessus Essentials will be used. Despite the fact that\
    \ the software is free, it does require a valid activation code, which is detailed\
    \ as follows.\n\n8.  Navigate to the Nessus Essentials Product Portal. \n\n  \
    \  **[https://www.tenable.com/products/nessus/nessus-essentials](https://www.tenable.com/products/nessus/nessus-essentials)**\n\
    \n9.  Fill in your first name, last name, and e-mail address on the registration\
    \ form, as shown in *[Figure 6.6](#c06.xhtml#fig6_6):*\n\n    ![](images/Figure-6.6.jpg)\n\
    \n    **Figure 6.6:** Tenable Nessus essentials product registration page\n\n\
    10.  To finish registration, click the `Register` button, as shown in *[Figure\
    \ 6.7](#c06.xhtml#fig6_7):*\n\n     ![](images/Figure-6.7.jpg)\n\n     **Figure\
    \ 6.7:** Completing registration on the Tenable Nessus essentials product registration\
    \ page\n\n11.  Tenable will send you a confirmation e-mail once your registration\
    \ is complete. Finally, you will be given the following message, as shown in *[Figure\
    \ 6.8](#c06.xhtml#fig6_8)*: \n\n     ![](images/Figure-6.8.jpg)\n\n     **Figure\
    \ 6.8:** The Nessus Essentials product registration page showing the result of\
    \ successful registration\n\n12.  Check your e-mail for an activation code that\
    \ looks something like D234-C7CB-04AF-79A6-1555. **no-reply@tenable.com** will\
    \ be the e-mail sender’s address. If you do not see the registration e-mail in\
    \ your inbox, then check your trash mail!\n\n13.  Activating the Nessus Application:\
    \ It is time to activate your Nessus installation now that you have gotten your\
    \ activation code and started the Nessus service.\n\n14.  Navigate to `https://localhost:8834`\
    \ using a Web browser on your Kali Linux operating system. It is important to\
    \ note that the default port is `8834`, not `443`. (When you try to visit the\
    \ Nessus application’s Web interface, you will probably get a warning because\
    \ the installation comes with a self-signed SSL certificate. Tenable gives you\
    \ the option of customizing the SSL certificate that your Nessus application uses.)\n\
    \n15.  Select Nessus essentials as the product version on the Welcome to Nessus\
    \ screen, as shown in *[Figure 6.9](#c06.xhtml#fig6_9)*: \n\n     ![](images/Figure-6.9.jpg)\n\
    \n     **Figure 6.9:** Selecting Nessus essentials as the Nessus product version\n\
    \n16.  You can skip the `Get an activation code` screen because you already have\
    \ the activation. Refer to *[Figure 6.10](#c06.xhtml#fig6_10)*: \n\n     ![](images/Figure-6.10.jpg)\n\
    \n     **Figure 6.10:** Selecting the skip button on the retrieve activation code\
    \ screen\n\n17.  On the `Register Nessus` screen, enter the `Activation Code`\
    \ you obtained during the registration procedure and click `Continue`. The mock\
    \ activation code for this tutorial is `D234-C7CB-04AF-79A6-1555`, as shown in\
    \ *[Figure 6.11](#c06.xhtml#fig6_11)*: \n\n     ![](images/Figure-6.11.jpg)\n\n\
    \     **Figure 6.11:** Entering the activation code into the Nessus application\n\
    \n18.  When the `Create a user account` screen appears, enter a username and password,\
    \ then click `Submit`. The Nessus program is accessed using the given login and\
    \ password, as shown in *[Figure 6.12](#c06.xhtml#fig6_12)*: \n\n     ![](images/Figure-6.12.jpg)\n\
    \n     **Figure 6.12:** Creating a user account for the Nessus application\n\n\
    19.  After the scanner has finished initializing, which may take some time, click\
    \ `Sign In` and enter the username and password for the user account you created\
    \ earlier in this lesson. Refer to *[Figure 6.13](#c06.xhtml#fig6_13)*: \n\n \
    \    ![](images/Figure-6.13.jpg)\n\n     **Figure 6.13:** Displaying the username\
    \ and password login screen\n\nFantastic work! Your Nessus vulnerability scanner\
    \ program is now installed and activated! In the next part, you will set up Nessus\
    \ to run a vulnerability scan on your local system.\n\n# [Running a Nessus vulnerability\
    \ scan](#toc.xhtml#s109a)\n\nYou have successfully installed Nessus. It is time\
    \ to put the pedal to the metal and discover what this useful tool can do for\
    \ you in terms of finding weaknesses! The rest of this section will walk you through\
    \ configuring and running a scan on your Kali Linux system.\n\nIf you are still\
    \ on the Nessus application screen or are not already logged in, enter the username\
    \ and password for the user account you created earlier in this guide.\n\nA welcome\
    \ message may appear upon the first login, allowing you to rapidly configure a\
    \ discovery scan, which locates networked devices. You may dismiss this notice\
    \ because you are about to configure and run a custom scan, as shown in *[Figure\
    \ 6.14](#c06.xhtml#fig6_14)*:\n\n![](images/Figure-6.14.jpg)\n\n**Figure 6.14:**\
    \ The Nessus application showing the close selection button highlighted\n\nConfiguring\
    \ a scan can be done in a variety of ways. This tutorial focuses on the three-step\
    \ process mentioned in the following sections.\n\n1.  Configure a scan policy\n\
    \n2.  Configure a scan\n\n3.  Launch the scan\n\n# [Configuring a Nessus vulnerability\
    \ scan policy](#toc.xhtml#s110a)"
  fmt: "\n它不仅能发现缺陷，还能提供漏洞信息和危险严重程度。它包含指向更多信息的链接，如果有可用的安全补丁，还提供补丁下载链接，以帮助提供额外的安全层。\n\
    \n# 设置漏洞扫描器\n\n本节主题是 Nessus。我们将下载并安装 Nessus，然后注册获取激活码，激活程序，并执行首次扫描。\n\n# 下载 Nessus\n\
    \n由于 Nessus 未预装在 Kali Linux 上，我们需要先下载并安装它，然后才能开始搜索漏洞。要获取最新版本的 Nessus，请访问以下网站：[https://www.tenable.com/downloads/nessus](https://www.tenable.com/downloads/nessus)\n\
    \n根据您的操作系统选择下载，如图 6.1 所示：\n\n![](images/Figure-6.1.jpg)\n\n**图 6.1：** Nessus 下载\n\
    \n# 安装 Nessus\n\n在本演示中，我们将部署 Nessus 漏洞扫描器。步骤如下：\n\n1. 打开终端。\n\n2. 输入以下命令并按 `Enter`：\n\
    \n   `sudo dpkg -i Nessus-8.15.2-debian6_amd64.deb`（适用于 64 位操作系统）\n\n   `sudo\
    \ dpkg -i Nessus-8.15.2-debian6_i386.deb`（适用于 32 位操作系统）\n\n   输出如图 6.2 所示：\n\n\
    \   ![](images/Figure-6.2.jpg)\n\n   **图 6.2：** Nessus 下载_2\n\n3. 输入以下命令后按 `Enter`：\n\
    \n   `sudo systemctl start nessusd.service`\n\n   此命令将启动 Nessus 漏洞扫描工具，如图 6.3\
    \ 所示：\n\n   ![](images/Figure-6.3.jpg)\n\n   **图 6.3：** Nessus 启动\n\n4. 在 Web\
    \ 浏览器中访问 `https://127.0.0.1:8834`。\n\n5. 遇到站点安全证书时，点击 `Proceed`。我们将看到如图 6.4 所示的屏幕：\n\
    \n   ![](images/Figure-6.4.jpg)\n\n   **图 6.4：** 在 Web 浏览器中打开 Nessus\n\n6. 您将看到\
    \ Nessus 的初始化屏幕，如图 6.5 所示：\n\n   ![](images/Figure-6.5.jpg)\n\n   **图 6.5：** 初始化\
    \ Nessus\n\n7. 获取 Nessus 漏洞扫描器的激活码\n\n   Tenable 的 Nessus 漏洞扫描器有 Nessus Essentials\
    \ 和 Nessus Professional 两个版本。Nessus Essentials 免费，但与收费的 Nessus Professional 相比功能有限。Nessus\
    \ Essentials 的主要限制如下：\n\n   * 扫描限制为每个扫描器 16 个 IP 地址。\n   * 不提供合规性检查或实时结果。\n  \
    \ * 无法使用 Nessus 虚拟设备。\n\n   本教程使用 Nessus Essentials。尽管软件免费，但确实需要有效的激活码，详情如下。\n\
    \n8. 访问 Nessus Essentials 产品门户。\n\n   [https://www.tenable.com/products/nessus/nessus-essentials](https://www.tenable.com/products/nessus/nessus-essentials)\n\
    \n9. 在注册表单中填写名、姓和电子邮件地址，如图 6.6 所示：\n\n   ![](images/Figure-6.6.jpg)\n\n   **图\
    \ 6.6：** Tenable Nessus Essentials 产品注册页面\n\n10. 点击 `Register` 按钮完成注册，如图 6.7 所示：\n\
    \n    ![](images/Figure-6.7.jpg)\n\n    **图 6.7：** 在 Tenable Nessus Essentials\
    \ 产品注册页面上完成注册\n\n11. 注册完成后，Tenable 会发送确认邮件。最后，您将看到如图 6.8 所示的消息：\n\n    ![](images/Figure-6.8.jpg)\n\
    \n    **图 6.8：** 显示成功注册结果的 Nessus Essentials 产品注册页面\n\n12. 检查邮箱获取激活码，格式类似 `D234-C7CB-04AF-79A6-1555`。发件人地址为\
    \ `no-reply@tenable.com`。如果收件箱中没有注册邮件，请检查垃圾箱！\n\n13. 激活 Nessus 应用程序：既然您已获得激活码并启动了\
    \ Nessus 服务，现在可以激活您的 Nessus 安装了。\n\n14. 在 Kali Linux 操作系统上使用 Web 浏览器访问 `https://localhost:8834`。请注意，默认端口是\
    \ `8834`，而不是 `443`。（当您尝试访问 Nessus 应用程序的 Web 界面时，可能会收到警告，因为安装附带自签名 SSL 证书。Tenable\
    \ 允许您自定义 Nessus 应用程序使用的 SSL 证书。）\n\n15. 在“Welcome to Nessus”屏幕上选择 Nessus Essentials\
    \ 作为产品版本，如图 6.9 所示：\n\n    ![](images/Figure-6.9.jpg)\n\n    **图 6.9：** 选择 Nessus\
    \ Essentials 作为 Nessus 产品版本\n\n16. 由于您已有激活码，可以跳过 `Get an activation code` 屏幕。请参考图\
    \ 6.10：\n\n    ![](images/Figure-6.10.jpg)\n\n    **图 6.10：** 在检索激活码屏幕上选择跳过按钮\n\
    \n17. 在 `Register Nessus` 屏幕上，输入注册过程中获得的 `Activation Code` 并点击 `Continue`。本教程的模拟激活码为\
    \ `D234-C7CB-04AF-79A6-1555`，如图 6.11 所示：\n\n    ![](images/Figure-6.11.jpg)\n\n\
    \    **图 6.11：** 在 Nessus 应用程序中输入激活码\n\n18. 出现 `Create a user account` 屏幕时，输入用户名和密码，然后点击\
    \ `Submit`。使用提供的登录名和密码访问 Nessus 程序，如图 6.12 所示：\n\n    ![](images/Figure-6.12.jpg)\n\
    \n    **图 6.12：** 为 Nessus 应用程序创建用户账户\n\n19. 扫描器初始化完成后（可能需要一些时间），点击 `Sign In`\
    \ 并输入本课程前面创建的用户账户的用户名和密码。请参考图 6.13：\n\n    ![](images/Figure-6.13.jpg)\n\n   \
    \ **图 6.13：** 显示用户名和密码登录屏幕\n\n太棒了！您的 Nessus 漏洞扫描器程序现已安装并激活！在下一部分，您将设置 Nessus 对本地系统运行漏洞扫描。\n\
    \n# 运行 Nessus 漏洞扫描\n\n您已成功安装 Nessus。现在是时候大显身手了，看看这个实用工具在发现弱点方面能为您做什么！本节其余部分将指导您在\
    \ Kali Linux 系统上配置并运行扫描。\n\n如果您仍在 Nessus 应用程序屏幕上或尚未登录，请输入本指南前面创建的用户账户的用户名和密码。\n\
    \n首次登录时可能会出现欢迎消息，允许您快速配置发现扫描（用于定位网络设备）。您可以关闭此通知，因为您即将配置并运行自定义扫描，如图 6.14 所示：\n\n\
    ![](images/Figure-6.14.jpg)\n\n**图 6.14：** Nessus 应用程序显示突出显示的关闭选择按钮\n\n配置扫描的方法多种多样。本教程重点介绍以下各节提到的三步流程。\n\
    \n1. 配置扫描策略\n2. 配置扫描\n3. 启动扫描\n\n# 配置 Nessus 漏洞扫描策略\n"
