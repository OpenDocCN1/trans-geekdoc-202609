- raw: "Because hackers rarely target software vulnerabilities, they are less harmful\
    \ than operating system flaws. Even so, some program flaws, such as those in Internet\
    \ Explorer or Microsoft Office, can constitute a significant hazard. As soon as\
    \ a patch is released, these vulnerabilities are routinely fixed through Windows\
    \ updates. Microsoft Update, Windows Update, and Office Update all provide security\
    \ upgrades. You may simply find them by searching for *security update* as a keyword.\
    \ If Nessus has identified MS07 036 as a vulnerability on your Windows system,\
    \ for example, you can search for that security bulletin number and then download\
    \ all available updates to patch your machine. When it comes to program vulnerabilities,\
    \ you should always check for and download the most recent software upgrades as\
    \ soon as they become available.\n\n# [Conclusion](#toc.xhtml#s115a)\n\nThat is\
    \ pretty much it for this chapter! We talked about how to start designing an assessment,\
    \ the important components of an assessment, and the assessment’s step-by-step\
    \ approach. Nessus was installed, registered, and plugins were downloaded before\
    \ Nessus was run. We also built a new policy and scan, detected vulnerabilities,\
    \ read the vulnerability details, and followed up with a fix. We will now move\
    \ on to the next chapter, where you will learn about client-side attacks!\n\n\
    # [Questions](#toc.xhtml#s116a)\n\n1.  Mention the steps of installing the Nessus\
    \ program.\n\n2.  What are the differences between discovery scan and vulnerability\
    \ scan?\n\n3.  How to generate a report in the Nessus program?\n\n# [CHAPTER 7](#toc.xhtml#c07)\n\
    \n# [Client-side Attacks](#toc.xhtml#c07)\n\n# [Introduction](#toc.xhtml#s117a)\n\
    \nWe reviewed how to do a network vulnerability assessment in the previous chapter.\
    \ Client-side assaults will be covered in this chapter, which will help you understand\
    \ how hackers might target and attack systems and other network devices. What\
    \ is a client-side attack, exactly? Let us discuss this.\n\n# [Structure](#toc.xhtml#s118a)\n\
    \nThe following topics will be covered in this chapter:\n\n*   How do client-side\
    \ attacks work?\n\n*   Types of client-side attacks\n\n*   Sniffing unencrypted\
    \ traffic\n\n*   Honeypot attacking\n\n*   Preventing threats\n\n# [Objectives](#toc.xhtml#s119a)\n\
    \nIn this chapter, you will learn how to capture unencrypted traffic and gain\
    \ an understanding of honeypot attacks and methods, Karmetasploit, Jasager, and\
    \ prevention from threats.\n\n# [How do client-side attacks work?](#toc.xhtml#s120a)\n\
    \nTo completely comprehend how a client-side assault operates, we must first examine\
    \ how server-side attacks differ from client-side attacks. Clients connect with\
    \ servers through a variety of apps and services, as shown in *[Figure 7.1](#c07.xhtml#fig7_1)*.\
    \ These server services are available to the client who has made the service available\
    \ to them to try and exploit. A server becomes increasingly vulnerable to attacks\
    \ as more services are launched on it:\n\n![](images/Figure-7.1.jpg)\n\n**Figure\
    \ 7.1:** Client-side attacks\n\nClient-side attacks are distinct from server-side\
    \ attacks. These attacks are designed to exploit flaws in client apps that interface\
    \ with a hostile server. Because it does not process anything sent from a server,\
    \ the client is not at risk if it is not connected to one. Because most clients\
    \ are automatically configured to connect to the server, instant messaging applications\
    \ can possibly expose a client to attacks, as shown in *[Figure 7.2](#c07.xhtml#fig7_2):*\n\
    \n![](images/Figure-7.2.jpg)\n\n**Figure 7.2:** Client-side attacks scenario\\\
    _1\n\nThe most common client-side attacks are carried out when someone visits\
    \ a malicious Web page that targets their Web browser application. If the attack\
    \ is successful, the attacker could easily take control of the client. There are\
    \ more attacks than just Web-based attacks, such as attacks via e-mail, instant\
    \ messaging, and FTP, as shown in *[Figure 7.3](#c07.xhtml#fig7_3):*\n\n![](images/Figure-7.3.jpg)\n\
    \n**Figure 7.3:** Client-side attacks scenario\\_2\n\nClients are only safeguarded\
    \ when a defense is provided. Network traffic is restricted by firewalls and proxies\
    \ to only trusted websites and servers. Packet filtering, intrusion prevention\
    \ services, and application control are all included in hardware firewalls like\
    \ WatchGuard’s XTM 800 Series. All your systems and devices are at risk if you\
    \ do not have a hardware firewall on your network as a business.\n\n# [Types of\
    \ client-side attacks](#toc.xhtml#s121a)\n\nClient-side attacks take advantage\
    \ of the user’s trust in the website or server they are visiting, as shown in\
    \ *[Figure 7.4](#c07.xhtml#fig7_4):*\n\n![](images/Figure-7.4.jpg)\n\n**Figure\
    \ 7.4:** Client-side attacks example\n\nThe following are the most typical types\
    \ of client-side attacks:\n\n*   **Spoofing:** It is the act of convincing a user\
    \ that a website or server is real.\n\n*   **Cross-site scripting (XSS):** This\
    \ allows an attacker to run code in the user’s browser. This attack can be used\
    \ to hijack a user’s session, launch phishing attacks to steal login credentials,\
    \ or even embarrass the user with explicit content. This vulnerability affects\
    \ all online apps. An exploit will often execute on the user’s Web browser application\
    \ using HTML, JavaScript, VBScript, ActiveX, Java, or Flash, as shown in *[Figure\
    \ 7.5](#c07.xhtml#fig7_5):*\n\n![](images/Figure-7.5.jpg)\n\n**Figure 7.5:** XSS\
    \ Scenario\n\n# [Sniffing unencrypted traffic](#toc.xhtml#s122a)\n\nBy now, you\
    \ should be aware that unencrypted Wi-Fi communication can be accessed by anybody,\
    \ putting your data at risk. Have you ever used a public wireless network, such\
    \ as one provided by Starbucks or a hotel? Have you ever considered who else might\
    \ be linked to your network and listening in on your communications? Is that not\
    \ terrifying?\n\nIt requires very little to no prior experience! Anyone may view\
    \ unencrypted traffic with surprising ease. In this demonstration, let us see\
    \ how to sniff your unencrypted communication in detail. This presentation will\
    \ show why it is critical to always connect through a secure connection.\n\n1.\
    \  Navigate to `Applications` | `Sniffing & Spoofing` | `Wireshark`, as shown\
    \ in *[Figure 7.6](#c07.xhtml#fig7_6):*\n\n    ![](images/Figure-7.6.jpg)\n\n\
    \    **Figure 7.6:** Wireshark application\n\n    You can also open Wireshark\
    \ by entering `sudo wireshark` in a terminal window.\n\n2.  *[Figure 7.7](#c07.xhtml#fig7_7)*\
    \ is how the Wireshark graphical interface should look: \n\n    ![](images/Figure-7.7.jpg)\n\
    \n    **Figure 7.7:** Wireshark GUI\n\n3.  Then, navigate to `Capture` | `Options...`,\
    \ as shown in *[Figure 7.8](#c07.xhtml#fig7_8):*\n\n    ![](images/Figure-7.8.jpg)\n\
    \n    **Figure 7.8:** Wireshark capture interfaces\n\n4.  We have chosen eth0\
    \ for this demonstration. For some of you, this may be wlan0 or `wlan1`. Check\
    \ the box and click on `Start`, as shown in *[Figure 7.9](#c07.xhtml#fig7_9):*\n\
    \n    ![](images/Figure-7.9.jpg)\n\n    **Figure 7.9:** Wireshark eth0 interface\n\
    \n5.  You should see Wireshark beginning to capture network traffic, as shown\
    \ in *[Figure 7.10](#c07.xhtml#fig7_10):*\n\n    ![](images/Figure-7.10.jpg)\n\
    \n    **Figure 7.10:** Wireshark eth0 interface packets\n\n6.  In this demonstration,\
    \ we will be filtering HTTP and press *Enter*, as shown in *[Figure 7.11](#c07.xhtml#fig7_11)*:\
    \ \n\n    ![](images/Figure-7.11.jpg)\n\n    **Figure 7.11:** Wireshark HTTP filter\n\
    \n7.  Use the HTTP protocol on the browser to log in to the following website:\
    \ **[http://testphp.vulnweb.com/login.php](http://testphp.vulnweb.com/login.php)**\n\
    \n    Refer to *[Figure 7.12](#c07.xhtml#fig7_12)*:\n\n    ![](images/Figure-7.13.jpg)\n\
    \n    **Figure 7.12:** Website login\n\n    To log in, enter username` test` and\
    \ password `test`.\n\n8.  In Wireshark, you should see a lot of different HTTP\
    \ packets. Right-click on one of them and select Follow, then TCP Stream, as shown\
    \ in *[Figure 7.13](#c07.xhtml#fig7_13)*: \n\n    ![](images/Figure-7.13.jpg)\n\
    \n    **Figure 7.13:** HTTP follow the TCP stream"
  fmt: "\n因为黑客很少以软件漏洞为目标，所以它们的危害性比操作系统缺陷要小。即便如此，某些程序缺陷（如 Internet Explorer 或 Microsoft\
    \ Office 中的缺陷）也可能构成重大危害。补丁一旦发布，这些漏洞就会通过 Windows 更新例行修复。Microsoft Update、Windows\
    \ Update 和 Office Update 都提供安全升级。您可以通过搜索关键字 `security update` 轻松找到它们。例如，如果 Nessus\
    \ 在您的 Windows 系统上将 MS07-036 识别为漏洞，您可以搜索该安全公告编号，然后下载所有可用更新来修补您的计算机。谈到程序漏洞，您应始终检查并尽快下载最新的软件升级。\n\
    \n# 结论\n\n本章内容基本到此结束！我们讨论了如何开始设计评估、评估的重要组成部分以及评估的分步方法。在运行 Nessus 之前，我们已安装、注册 Nessus\
    \ 并下载了插件。我们还创建了新策略和扫描、检测漏洞、阅读漏洞详情，并进行了修复跟进。接下来我们将进入下一章，您将了解客户端攻击！\n\n# 问题\n\n\
    1.  说明安装 Nessus 程序的步骤。\n2.  发现扫描和漏洞扫描有什么区别？\n3.  如何在 Nessus 程序中生成报告？\n\n# 第 7\
    \ 章\n\n# 客户端攻击\n\n# 简介\n\n在上一章中，我们回顾了如何进行网络漏洞评估。本章将介绍客户端攻击，帮助您了解黑客如何以系统和其他网络设备为目标并发起攻击。究竟什么是客户端攻击？让我们来讨论一下。\n\
    \n# 结构\n\n本章将涵盖以下主题：\n\n*   客户端攻击是如何工作的？\n*   客户端攻击的类型\n*   嗅探未加密流量\n*   蜜罐攻击\n\
    *   预防威胁\n\n# 目标\n\n在本章中，您将学习如何捕获未加密流量，并了解蜜罐攻击和方法、Karmetasploit、Jasager 以及威胁预防。\n\
    \n# 客户端攻击是如何工作的？\n\n要完全理解客户端攻击的运作方式，我们必须首先考察服务器端攻击与客户端攻击的区别。如[图 7.1](#c07.xhtml#fig7_1)所示，客户端通过各种应用程序和服务与服务器连接。这些服务器服务可供已向其提供服务的客户端使用，以尝试利用漏洞。随着服务器上启动的服务越多，其面临的攻击风险就越大：\n\
    \n![](images/Figure-7.1.jpg)\n\n**图 7.1：** 客户端攻击\n\n客户端攻击不同于服务器端攻击。这些攻击旨在利用与恶意服务器交互的客户端应用程序中的缺陷。如果客户端未连接到服务器，则不会处理来自服务器的任何内容，因此不面临风险。由于大多数客户端均自动配置为连接到服务器，即时通讯应用程序可能会使客户端面临攻击，如[图\
    \ 7.2](#c07.xhtml#fig7_2)所示：\n\n![](images/Figure-7.2.jpg)\n\n**图 7.2：** 客户端攻击场景\
    \ 1\n\n最常见的客户端攻击发生在用户访问针对其 Web 浏览器应用程序的恶意网页时。如果攻击成功，攻击者可以轻松控制客户端。除了基于 Web 的攻击外，还有通过电子邮件、即时通讯和\
    \ FTP 发起的攻击，如[图 7.3](#c07.xhtml#fig7_3)所示：\n\n![](images/Figure-7.3.jpg)\n\n**图\
    \ 7.3：** 客户端攻击场景 2\n\n只有提供防御措施时，客户端才受到保护。防火墙和代理将网络流量限制为仅受信任的网站和服务器。硬件防火墙（如 WatchGuard\
    \ 的 XTM 800 系列）包含数据包过滤、入侵防御服务和应用程序控制。如果您的企业网络没有硬件防火墙，所有系统和设备都将面临风险。\n\n# 客户端攻击的类型\n\
    \n客户端攻击利用用户对其访问的网站或服务器的信任，如[图 7.4](#c07.xhtml#fig7_4)所示：\n\n![](images/Figure-7.4.jpg)\n\
    \n**图 7.4：** 客户端攻击示例\n\n以下是最典型的客户端攻击类型：\n\n*   **欺骗：** 让用户相信网站或服务器是真实的行为。\n* \
    \  **跨站脚本攻击（XSS）：** 允许攻击者在用户的浏览器中运行代码。这种攻击可用于劫持用户会话、发起网络钓鱼攻击以窃取登录凭据，甚至利用露骨内容让用户难堪。此漏洞影响所有\
    \ Web 应用程序。漏洞利用通常会使用 HTML、JavaScript、VBScript、ActiveX、Java 或 Flash 在用户的 Web 浏览器应用程序上执行，如[图\
    \ 7.5](#c07.xhtml#fig7_5)所示：\n\n![](images/Figure-7.5.jpg)\n\n**图 7.5：** XSS 场景\n\
    \n# 嗅探未加密流量\n\n到目前为止，您应该知道未加密的 Wi-Fi 通信可被任何人访问，从而使您的数据面临风险。您是否曾使用过公共无线网络（如星巴克或酒店提供的网络）？您是否曾考虑过还有谁可能连接到您的网络并窃听您的通信？这难道不令人恐惧吗？\n\
    \n这几乎不需要任何经验！任何人都能轻松查看未加密流量。在本演示中，让我们详细了解如何嗅探您的未加密通信。此演示将说明为何始终通过安全连接进行连接至关重要。\n\
    \n1.  导航至 `Applications` | `Sniffing & Spoofing` | `Wireshark`，如[图 7.6](#c07.xhtml#fig7_6)所示：\n\
    \n    ![](images/Figure-7.6.jpg)\n\n    **图 7.6：** Wireshark 应用程序\n\n    您也可以在终端窗口中输入\
    \ `sudo wireshark` 来打开 Wireshark。\n\n2.  [图 7.7](#c07.xhtml#fig7_7) 展示了 Wireshark\
    \ 图形界面的外观：\n\n    ![](images/Figure-7.7.jpg)\n\n    **图 7.7：** Wireshark GUI\n\
    \n3.  然后导航至 `Capture` | `Options...`，如[图 7.8](#c07.xhtml#fig7_8)所示：\n\n    ![](images/Figure-7.8.jpg)\n\
    \n    **图 7.8：** Wireshark 捕获接口\n\n4.  本演示选择了 `eth0`。对某些用户而言，这可能是 `wlan0` 或 `wlan1`。勾选复选框并点击\
    \ `Start`，如[图 7.9](#c07.xhtml#fig7_9)所示：\n\n    ![](images/Figure-7.9.jpg)\n\n\
    \    **图 7.9：** Wireshark eth0 接口\n\n5.  您应该会看到 Wireshark 开始捕获网络流量，如[图 7.10](#c07.xhtml#fig7_10)所示：\n\
    \n    ![](images/Figure-7.10.jpg)\n\n    **图 7.10：** Wireshark eth0 接口数据包\n\n\
    6.  在本演示中，我们将过滤 HTTP 并按 `Enter` 键，如[图 7.11](#c07.xhtml#fig7_11)所示：\n\n    ![](images/Figure-7.11.jpg)\n\
    \n    **图 7.11：** Wireshark HTTP 过滤器\n\n7.  在浏览器中使用 HTTP 协议登录以下网站：[http://testphp.vulnweb.com/login.php](http://testphp.vulnweb.com/login.php)\n\
    \n    请参阅[图 7.12](#c07.xhtml#fig7_12)：\n\n    ![](images/Figure-7.13.jpg)\n\n\
    \    **图 7.12：** 网站登录\n\n    要登录，请输入用户名 `test` 和密码 `test`。\n\n8.  在 Wireshark\
    \ 中，您应该会看到许多不同的 HTTP 数据包。右键单击其中一个，选择 `Follow`，然后选择 `TCP Stream`，如[图 7.13](#c07.xhtml#fig7_13)所示：\n\
    \n    ![](images/Figure-7.13.jpg)\n\n    **图 7.13：** HTTP 跟踪 TCP 流\n"
  trans: "\n因为黑客很少以软件漏洞为目标，所以它们的危害性比操作系统缺陷要小。即便如此，某些程序缺陷（如 Internet Explorer 或 Microsoft\
    \ Office 中的缺陷）也可能构成重大危害。补丁一旦发布，这些漏洞就会通过 Windows 更新例行修复。Microsoft Update、Windows\
    \ Update 和 Office Update 都提供安全升级。您可以通过搜索关键字 `security update` 轻松找到它们。例如，如果 Nessus\
    \ 在您的 Windows 系统上将 MS07-036 识别为漏洞，您可以搜索该安全公告编号，然后下载所有可用更新来修补您的计算机。谈到程序漏洞，您应始终检查并尽快下载最新的软件升级。\n\
    \n# 结论\n\n本章内容基本到此结束！我们讨论了如何开始设计评估、评估的重要组成部分以及评估的分步方法。在运行 Nessus 之前，我们已安装、注册 Nessus\
    \ 并下载了插件。我们还创建了新策略和扫描、检测漏洞、阅读漏洞详情，并进行了修复跟进。接下来我们将进入下一章，您将了解客户端攻击！\n\n# 问题\n\n\
    1.  说明安装 Nessus 程序的步骤。\n2.  发现扫描和漏洞扫描有什么区别？\n3.  如何在 Nessus 程序中生成报告？\n\n# 第 7\
    \ 章\n\n# 客户端攻击\n\n# 简介\n\n在上一章中，我们回顾了如何进行网络漏洞评估。本章将介绍客户端攻击，帮助您了解黑客如何以系统和其他网络设备为目标并发起攻击。究竟什么是客户端攻击？让我们来讨论一下。\n\
    \n# 结构\n\n本章将涵盖以下主题：\n\n*   客户端攻击是如何工作的？\n*   客户端攻击的类型\n*   嗅探未加密流量\n*   蜜罐攻击\n\
    *   预防威胁\n\n# 目标\n\n在本章中，您将学习如何捕获未加密流量，并了解蜜罐攻击和方法、Karmetasploit、Jasager 以及威胁预防。\n\
    \n# 客户端攻击是如何工作的？\n\n要完全理解客户端攻击的运作方式，我们必须首先考察服务器端攻击与客户端攻击的区别。如图 7.1 所示，客户端通过各种应用程序和服务与服务器连接。这些服务器服务可供已向其提供服务的客户端使用，以尝试利用漏洞。随着服务器上启动的服务越多，其面临的攻击风险就越大：\n\
    \n![](img/Figure-7.1.jpg)\n\n**图 7.1：** 客户端攻击\n\n客户端攻击不同于服务器端攻击。这些攻击旨在利用与恶意服务器交互的客户端应用程序中的缺陷。如果客户端未连接到服务器，则不会处理来自服务器的任何内容，因此不面临风险。由于大多数客户端均自动配置为连接到服务器，即时通讯应用程序可能会使客户端面临攻击，如图\
    \ 7.2 所示：\n\n![](img/Figure-7.2.jpg)\n\n**图 7.2：** 客户端攻击场景 1\n\n最常见的客户端攻击发生在用户访问针对其\
    \ Web 浏览器应用程序的恶意网页时。如果攻击成功，攻击者可以轻松控制客户端。除了基于 Web 的攻击外，还有通过电子邮件、即时通讯和 FTP 发起的攻击，如图\
    \ 7.3 所示：\n\n![](img/Figure-7.3.jpg)\n\n**图 7.3：** 客户端攻击场景 2\n\n只有提供防御措施时，客户端才受到保护。防火墙和代理将网络流量限制为仅受信任的网站和服务器。硬件防火墙（如\
    \ WatchGuard 的 XTM 800 系列）包含数据包过滤、入侵防御服务和应用程序控制。如果您的企业网络没有硬件防火墙，所有系统和设备都将面临风险。\n\
    \n# 客户端攻击的类型\n\n客户端攻击利用用户对其访问的网站或服务器的信任，如图 7.4 所示：\n\n![](img/Figure-7.4.jpg)\n\
    \n**图 7.4：** 客户端攻击示例\n\n以下是最典型的客户端攻击类型：\n\n*   **欺骗：** 让用户相信网站或服务器是真实的行为。\n* \
    \  **跨站脚本攻击（XSS）：** 允许攻击者在用户的浏览器中运行代码。这种攻击可用于劫持用户会话、发起网络钓鱼攻击以窃取登录凭据，甚至利用露骨内容让用户难堪。此漏洞影响所有\
    \ Web 应用程序。漏洞利用通常会使用 HTML、JavaScript、VBScript、ActiveX、Java 或 Flash 在用户的 Web 浏览器应用程序上执行，如图\
    \ 7.5 所示：\n\n![](img/Figure-7.5.jpg)\n\n**图 7.5：** XSS 场景\n\n# 嗅探未加密流量\n\n到目前为止，您应该知道未加密的\
    \ Wi-Fi 通信可被任何人访问，从而使您的数据面临风险。您是否曾使用过公共无线网络（如星巴克或酒店提供的网络）？您是否曾考虑过还有谁可能连接到您的网络并窃听您的通信？这难道不令人恐惧吗？\n\
    \n这几乎不需要任何经验！任何人都能轻松查看未加密流量。在本演示中，让我们详细了解如何嗅探您的未加密通信。此演示将说明为何始终通过安全连接进行连接至关重要。\n\
    \n1.  导航至 `Applications` | `Sniffing & Spoofing` | `Wireshark`，如图 7.6 所示：\n\n\
    \    ![](img/Figure-7.6.jpg)\n\n    **图 7.6：** Wireshark 应用程序\n\n    您也可以在终端窗口中输入\
    \ `sudo wireshark` 来打开 Wireshark。\n\n2.  图 7.7 展示了 Wireshark 图形界面的外观：\n\n    ![](img/Figure-7.7.jpg)\n\
    \n    **图 7.7：** Wireshark GUI\n\n3.  然后导航至 `Capture` | `Options...`，如图 7.8 所示：\n\
    \n    ![](img/Figure-7.8.jpg)\n\n    **图 7.8：** Wireshark 捕获接口\n\n4.  本演示选择了 `eth0`。对某些用户而言，这可能是\
    \ `wlan0` 或 `wlan1`。勾选复选框并点击 `Start`，如图 7.9 所示：\n\n    ![](img/Figure-7.9.jpg)\n\
    \n    **图 7.9：** Wireshark eth0 接口\n\n5.  您应该会看到 Wireshark 开始捕获网络流量，如图 7.10 所示：\n\
    \n    ![](img/Figure-7.10.jpg)\n\n    **图 7.10：** Wireshark eth0 接口数据包\n\n6. \
    \ 在本演示中，我们将过滤 HTTP 并按 `Enter` 键，如图 7.11 所示：\n\n    ![](img/Figure-7.11.jpg)\n\n\
    \    **图 7.11：** Wireshark HTTP 过滤器\n\n7.  在浏览器中使用 HTTP 协议登录以下网站：[`testphp.vulnweb.com/login.php`](http://testphp.vulnweb.com/login.php)\n\
    \n    请参阅图 7.12：\n\n    ![](img/Figure-7.13.jpg)\n\n    **图 7.12：** 网站登录\n\n \
    \   要登录，请输入用户名 `test` 和密码 `test`。\n\n8.  在 Wireshark 中，您应该会看到许多不同的 HTTP 数据包。右键单击其中一个，选择\
    \ `Follow`，然后选择 `TCP Stream`，如图 7.13 所示：\n\n    ![](img/Figure-7.13.jpg)\n\n \
    \   **图 7.13：** HTTP 跟踪 TCP 流\n"
