    **图 10.57：** `Objection` 工具


    # 保护 Android 应用程序


    对于想要构建安全应用的开发者来说，OWASP Mobile Top 10 列表是一个极佳的参考。这是因为许多移动应用天然就面临安全漏洞。让我们考虑一下近几年发生的针对移动应用的几起攻击事件。例如
    WhatsApp 的 Pegasus 间谍软件，它让攻击者能够访问用户的智能手机。另一个是针对 Pokémon Go 应用的攻击，该应用容易被想抓更多宝可梦的用户逆向工程。


    包括 Tinder 和 MediaTek 在内的众多其他应用和企业，都经历过移动安全攻击。但为什么它们如此无防备？因为移动应用可以从公共商店下载且代码可被审查，所以它们比
    Web 应用拥有更大的攻击面。加上它们能收集大量用户数据，这使我们成为黑客极具吸引力的目标。


    OWASP Mobile Top 10 漏洞列出了在移动设备上发现的最普遍的安全弱点。但 OWASP 移动安全列表上具体列出了哪些漏洞？


    # OWASP Mobile Top 10 漏洞


    开放 Web 应用安全项目基金会基于全球社区收集的评论和调查数据，于 2011 年首次发布了 OWASP 移动安全风险。随后，又分别在 2014 年和 2016
    年发布了新列表；后者是最近且最新的 OWASP Mobile Top 10 列表。


    虽然 2016 年列表中有一项与 2014 年 Top 10 移动风险列表完全一致，但 2016 年列表的类别主要是不同的。例如，2016 年列表新增了两个风险，同时移除了
    2014 年列表中的一项。此外，它们还将几个类别拆分为两个以分别处理。请参阅图 10.58：


    ![](img/Figure-10.58.jpg)


    **图 10.58：** OWASP 2014 和 2016 移动风险的并排对比


    鉴于此，让我们来审视 2016 年最终选定的 10 大移动风险，并思考如何应对这些风险。


    # 不当平台使用


    在最新的 OWASP Mobile Top 10 排名中，不当平台使用位列首位。无论你使用 Android 还是 iOS，出于安全原因，每个平台都应遵循特定的开发标准。然而，应用可能会无意中违反这些最佳实践和既定建议，或在实现过程中出错。这一首要移动安全风险正是关注这一点。


    利用 Android 或 iOS 操作系统的任何平台功能，或无视平台安全规则，均被视为威胁。这包括对移动操作系统组成部分的平台元素和安全控制的错误使用，例如：


    *   通过滥用 iOS Touch ID 功能导致未经授权的设备访问。

    *   错误使用 iOS Keychain，例如将会话密钥存储在应用的本地存储中。

    *   请求过多或不正确的平台权限。

    *   被标记为公开的 Android Intents 可能泄露敏感信息或允许未经授权的执行（用于从另一个应用组件请求操作）。


    **针对该漏洞的修复措施：**


    你需要在服务端处理此 OWASP 移动安全问题。除了遵循平台开发规范外，使用安全编码技术并在服务端实施适当的配置设置，可降低风险。以下是一些防止平台被滥用的额外缓解措施：


    *   限制访问、实施限制性文件权限、防止应用之间相互交互等。

    *   为 iOS Keychain 应用最严格的保护类，并遵循推荐实践以防止粗劣的控制实现。


    # 不安全的数据存储


    不安全的数据存储在 OWASP Mobile Top 10 列表中位居第二。你的移动设备可能丢失或被盗，落入敌手。或者攻击者可能利用在设备上运行、代表其行事的恶意软件，来利用漏洞泄露个人信息并访问敏感数据。


    虽然并非总能创建不存储数据的应用，但必须安全地存储，且存放在其他应用或人员无法访问的位置。开发团队绝不能假设攻击者无法访问文件系统（如果文件系统随时可得）。越狱或
    Root 移动设备足以绕过加密安全。


    **针对该漏洞的修复措施：**


    对应用进行威胁建模，以了解应用处理哪些信息资产以及 API 如何处理数据。通过这样做，你可以：


    *   分析加密过程的有效性和加密密钥的安全性。

    *   实施缓冲区溢出保护和混淆等技术，以强化代码防篡改能力。

    *   尽可能避免缓存或存储数据。

    *   实施可靠的授权和认证检查。


    # 不安全的通信


    在 2016 年 OWASP Mobile Top 10 列表中，不安全的通信位列第三。如果数据以明文未加密形式传输，任何监视网络的人都可以拦截并读取通过线路传输的所有信息。


    客户端-服务端数据交换在移动应用中无处不在，这些数据必须通过设备的运营商网络和互联网安全传输。基站、代理、安装在设备上的间谍软件，或攻击者入侵你的 Wi-Fi，都可能拦截流量。那么，你能做些什么来降低此类数据交换涉及的风险？


    **针对该漏洞的修复措施：**


    *   使用行业标准加密技术和其他通用最佳实践，防止数据在网络传输过程中被窃取。

    *   使用由信誉良好的**证书颁发机构**（**CA**）颁发的 SSL/TLS 证书，以保护所有通信通道。


