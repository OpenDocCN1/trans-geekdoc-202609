    # 无线渗透测试工具


    以下章节介绍各种实用且广泛使用的安全工具。


    ## Wireshark


    Wireshark 是一款免费且开源的数据包分析器。它可用于网络故障排除、分析、软件开发和通信协议开发。Wireshark 也可用作教学工具，演示使用 SSL
    或其他加密方法保护敏感信息（如用户名和密码）免遭外部攻击者捕获的重要性。Kali Linux 预装了 Wireshark。


    **Wireshark 如何帮助你？Wireshark 可以嗅探无线数据包、跟踪 TCP 流、发现不需要的无线接入点，以获取电子邮件、密码和其他敏感信息。**


    *图 1.16* 展示了 Wireshark 界面：


    ![](img/Figure-1.16.jpg)


    **图 1.16：** Wireshark


    ## Scapy


    Scapy 是一款功能强大的数据包处理应用程序。它能够伪造或解码来自多种协议的数据包。它可以发送数据包、捕获数据包、比较请求与响应。扫描、路由跟踪、探测、攻击和网络发现都是它能轻松完成的任务。据估计，它可以轻松替代
    Nmap、arpspoof、tcpdump、tethereal、p0f 等工具 85% 的功能。它还能处理其他程序无法完成的各种任务，例如发送错误帧、注入自定义
    802.11 帧、组合 VLAN 跳跃、ARP 缓存投毒、WEP VOIP 解码等。 *图 1.17* 展示了 Scapy 在 Kali Linux 中的运行情况：


    ![](img/Figure-1.17.jpg)


    **图 1.17：** Scapy


    ## Nmap


    Nmap 是一款免费且开源的网络发现和安全审计工具。它对于网络资产清点、制定服务升级计划以及监控主机或服务的运行时间等活动非常有用，深受众多系统和网络管理员的青睐。Nmap
    可用于检测 Linux 操作系统版本和二进制包。它还能检测网络端口是开放还是关闭。Kali Linux 预装了 Nmap。


    Nmap 是一款网络和子网映射工具。它还能告诉你正在运行什么操作系统和软件版本。这有助于判断网络是否存在缺陷或潜在的安全问题。 *图 1.18* 展示了 Nmap
    在 Kali Linux 中的运行情况：


    ![](img/Figure-1.18.jpg)


    **图 1.18：** Nmap


    ## Aircrack-ng


    Aircrack-ng 是一款基于 C 语言的软件，集成了安全审计套件。Aircrack-ng 包含 Airodump-ng、aircrack-ng、aireplay-ng、Nmap、dnsiff、arpspoof、urlsnarf
    等实用程序。尽管 Aircrack-ng 可能被恶意使用，但它也可用于找回遗忘的 Wi-Fi 密码。对于安全专业人员来说，Aircrack-ng 是一款极佳的工具。更不用说它完全免费使用和分发！Kali
    Linux 预装了 Aircrack-ng，如 *图 1.19* 所示：


    ![](img/Figure-1.19.jpg)


    **图 1.19：** Aircrack-ng


    ## Metasploit


    Metasploit 是一款基于 Ruby 的软件，有助于降低数据泄露的风险。它可以使用与外部攻击者相同的方法，发现你的网络和系统中的弱点。Metasploit
    能在各种系统和软件中发现数千个漏洞。Kali Linux 已预装 Metasploit，如 *图 1.20* 所示。


    **Metasploit 在无线渗透测试中扮演什么角色？Metasploit 包含一个漏洞数据库。如果无线路由器存在可通过绕过管理员登录来利用的漏洞，Metasploit
    几乎肯定会有相应的 Ruby 脚本。它也适用于操作系统和硬件防火墙，因此不仅限于无线路由器。可以使用 Metasploit 的 search 命令来查找 CVE。**


    ![](img/Figure-1.20.jpg)


    **图 1.20：** Metasploit


    ## 配置接入点设置


    我们现在要设置接入点。如前所述，本书中的所有实验都将使用 NETGEAR D1500 无线路由器进行。不过，你也可以使用任何其他接入点。核心操作和使用原则保持不变。


    我们将配置接入点使用开放式认证，SSID 为 Wireless Lab。请遵循以下步骤：


    1. 打开接入点电源后，使用网线将笔记本电脑连接到接入点的一个以太网端口。


    2. 在浏览器中输入接入点配置终端的 IP 地址。NETGEAR 的默认 IP 地址为 `192.168.1.1`。你的接入点 IP 地址可以在接入点的设置指南中找到。如果你没有接入点的说明书，可以使用
    Web 浏览器访问 **[`routerlogin.net`](http://routerlogin.net)**。接入点的 IP 地址通常用作网关 IP
    地址。连接成功后，你应该会看到如下所示的配置门户。请参阅 *图 1.21*：


    ![](img/Figure-1.21.jpg)


    **图 1.21：** 无线路由器登录


    默认情况下，用户名和密码均为 admin。如果你无法访问，必须将路由器重置为默认配置设置。为此，按住无线路由器背面的按钮 5 秒钟，路由器将恢复默认设置。


    3. 要将 SSID 重命名为 `Wireless Lab`，请导航到 `Wireless` 选项卡，然后选择 `Wireless Settings`。请参阅
    *图 1.22*。


    4. 如前所述，必须将接入点的安全设置更改为 `Open Authentication`。从 `Wireless` 菜单中选择 `None`，然后选择 `Security`
    选项。如果安全功能被禁用，则接入点处于 `Open Authentication Mode`（开放式认证模式）（请参阅 *图 1.22*）。


    5. 保存对接入点的更改，如有必要则重启它。你的接入点现在应该可以使用 SSID Wireless Lab 正常工作了。


    ![](img/Figure-1.22.jpg)


    **图 1.22：** 无线路由器设置


    我们已成功将接入点配置为 Wireless Lab SSID。它正在广播其存在，这被我们的 Windows 笔记本电脑和其他处于接入点**射频**（**RF**）范围内的设备检测到。


    值得注意的是，我们将接入点设置为 `Open` 模式，这是安全性最低的选项。目前，不建议将此接入点连接到互联网，因为 RF 范围内的任何人都能利用它访问互联网。


    ## 安装无线网卡


    我们的无线网卡设置起来比接入点容易得多。优势在于 Kali 预装了所有必要的设备驱动程序，开箱即用即可启用数据包注入和嗅探功能。无线网卡将与渗透测试人员的笔记本电脑配合使用。请逐步遵循以下说明设置你的网卡：


    1. 将网卡插入 Kali 笔记本电脑的一个 USB 端口并启动。登录后，打开控制台终端并输入 `iwconfig`。你的屏幕应如 *图 1.23* 所示：

    '
