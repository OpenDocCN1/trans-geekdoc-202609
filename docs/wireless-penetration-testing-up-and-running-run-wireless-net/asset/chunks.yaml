    \ user’s physical device, there is a potential that sensitive data will be saved\
    \ locally and could be used against the user.\n\nHere are a few examples of the\
    \ general dangers that fall into this category:\n\n*   Sensitive data stored in\
    \ Plist\n*   Sensitive data stored in UserDefaults\n*   Sensitive data stored\
    \ in Keychain\n*   Sensitive data stored in Core Data\n*   Sensitive data stored\
    \ in Webkit Caching\n*   Sensitive data stored in Realm\n*   Sensitive data stored\
    \ in Couchbase Lite\n*   Sensitive data stored in YapDatabase\n*   URL caching\
    \ (both request and response)\n*   Keyboard press caching\n*   Copy/paste buffer\
    \ caching\n*   Insecure logging\n*   Background screen caching\n*   Analytics\
    \ data sent to third parties\n\n## M3: Insecure Communication\n\nClient-server\
    \ architecture is used for communication in the iOS application. An attacker can\
    \ try to steal critical information over unencrypted checks, perform Man-in-the-Middle\
    \ attacks, or try to study the request and answer by capturing them using proxy\
    \ tools like Burp Suite due to faulty or inadequate implementation of communication\
    \ standards like communication over HTTP.\n\nHere are a few examples of the general\
    \ dangers that fall into this category:\n\n*   Lack/bypass-able SSL pinning\n\
    *   Communication over HTTP [unencrypted communication]\n*   Plain-text submission\
    \ of sensitive information\n*   Logging sensitive information in the logs\n\n\
    ## M4: Insecure Authentication\n\nApplications are typically categorized as having\
    \ insecure authentication when they either improperly handle authentication checks\
    \ or permit attackers to modify login/authentication requests in order to access\
    \ the target user’s account.\n\nHere are a few examples of the general dangers\
    \ that fall into this category:\n\n*   Guessable/weak/default credentials\n* \
    \  Authentication bypass using attacks such as injection attacks\n\n## M5: Insufficient\
    \ Cryptography\n\nThe user data is frequently stored by iOS applications or used\
    \ in various client-server queries. An attacker may try to access data that is\
    \ encrypted using a weak cryptographic approach due to a lack of strong cryptography\
    \ and obtain sensitive data in this way.\n\nHere are a few examples of the general\
    \ dangers that fall into this category:\n\n*   Stealing app and user data\n* \
    \  Accessing encrypted files\n*   Accessing encrypted client-server request endpoints\n\
    \n## M6: Insecure Authorization\n"
  trans: "\n\n## 后续步骤\n\n1.  进入程序，在 `Network Layer Security` 下选择 `Send Using Certificate\
    \ Pinning`。\n\n2.  请注意，通过避免 SSL Pinning 可以拦截数据。请参阅 *图 11.20*：\n\n    ![](img/Figure-11.20.jpg)\n\
    \n    **图 11.20：** 代理设置\n\n以下列表包含可用于避免越狱检测的各种工具：\n\n*   **Frida**: <https://codeshare.frida.re/>\n\
    *   **SSLKillSwitch2**: <https://github.com/nabla-c0d3/ssl-kill-switch2>\n\n#\
    \ 绕过生物识别（本地）认证\n\n现在让我们看看如何使用各种方法绕过生物识别（本地）认证。\n\n## 使用 Objection\n\n1.  在您的系统上运行以下命令，如\
    \ *图 11.21* 所示：\n\n    ```\n    objection -g DVIA-v2 explore\n    ios ui biometrics_bypass\
    \ exit\n    ```\n\n    ![](img/Figure-11.21.jpg)\n\n    **图 11.21：** 使用 Objection\
    \ 绕过生物识别\n\n2.  接下来，打开应用并选择 `Touch/Face ID Bypass` | `Start Challenge` | `Swift\
    \ Implementation`，如 *图 11.22* 所示：\n\n    ![](img/Figure-11.22.jpg)\n\n    **图\
    \ 11.22：** 未识别到面容\n\n3.  当应用提示 `Face Not Recognized` 时，选择 `Cancel` 以避免认证，如 *图\
    \ 11.23* 所示：\n\n    ![](img/Figure-11.23.jpg)\n\n    **图 11.23：** 认证成功\n\n# 检查本地存储中的敏感数据泄露\n\
    \n敏感数据保存在本地存储的许多不同位置。下面列出了可以找到敏感数据的不同位置以及如何发起攻击。\n\n打开 DVIA-v2 应用程序，然后选择 `Local\
    \ Data Storage`。使用每个可用选项保存一些数据。\n\n## Plist 中的敏感数据\n\n**情况 1：在 Plist 中存储敏感数据。**\n\
    \n请遵循以下步骤：\n\n1.  运行以下命令：\n\n    ```\n    objection -g DVIA-v2 explore\n    env\n\
    \    cd /var/mobile/Containers/Data/Application/<app-id>/Documents\n    ios plist\
    \ cat userInfo.plist\n    ```\n\n2.  请记住，敏感数据以明文形式保存，如 *图 11.24* 所示：\n\n    ![](img/Figure-11.24.jpg)\n\
    \n    **图 11.24：** iOS plist cat userInfo.plist 命令\n\n## UserDefaults 中的敏感数据\n\
    \n**情况 2：在 UserDefaults 中存储敏感数据**\n\n请遵循以下步骤：\n\n1.  运行以下命令：\n\n    ```\n    objection\
    \ -g DVIA-v2 explore\n    ios nsuserdefaults get\n    ```\n\n2.  您可以看到敏感数据以明文形式包含在\
    \ `DemoValue` 参数中，如 *图 11.25* 所示：\n\n    ![](img/Figure-11.25.jpg)\n\n    **图\
    \ 11.25：** iOS “nsuserdefaults get” 命令\n\n## Keychain 中的敏感数据\n\n**情况 3：在 Keychain\
    \ 中存储敏感数据**\n\n请遵循以下步骤：\n\n1.  运行以下命令：\n\n    ```\n    objection -g DVIA-v2 explore\n\
    \    ios keychain dump\n    ```\n\n2.  请注意，密码以明文形式作为敏感数据保存（Super Secure Password），如\
    \ *图 11.26* 所示：\n\n    ![](img/Figure-11.26.jpg)\n\n    **图 11.26：** iOS keychain\
    \ dump 命令\n\n对于剩余的攻击，我们将使用 Grapefruit 工具 (<https://github.com/ChiChou/grapefruit>)。安装、启动并将您的\
    \ iPhone 连接到该应用程序。\n\n## Core Data 中的敏感数据\n\n**情况 4：在 Core Data 中存储敏感数据**\n\n\
    请遵循以下步骤：\n\n1.  打开 Grapefruit 并加载 DVIA-v2 应用程序。转到以下位置：`Data` | `Library` | `Application\
    \ Support`。\n\n2.  打开 `Model.sqlite`。\n\n3.  请注意，可以访问私密数据。请参阅 *图 11.27*：\n\n \
    \   ![](img/Figure-11.27.jpg)\n\n    **图 11.27：** Core Data 中的敏感数据\n\n## Couchbase\
    \ Lite 中的敏感数据\n\n**情况 5：在 Couchbase Lite 中存储敏感数据**\n\n请遵循以下步骤：\n\n1.  使用 Grapefruit\
    \ 加载 DVIA-v2 应用程序并导航到以下位置：`Data` | `Library` | `Application Support` | `CouchbaseLite`\
    \ | `dvcouchbasedb.cblite2`。\n\n2.  下载 `db.sqlite3`，打开它，您将能够看到敏感信息。\n\n## YapDatabase\
    \ 中的敏感数据\n\n**情况 6：在 YapDatabase 中存储敏感数据**\n\n请遵循以下步骤：\n\n1.  使用 Grapefruit 加载\
    \ DVIA-v2 应用程序并导航到以下位置：`Data` | `Library` | `Application Support`。\n\n2.  下载 `YapDatabase.sqlite`\
    \ 并使用 SQLite Viewer 打开它。\n\n3.  您将能够访问敏感数据。\n\n# OWASP Mobile Top 10\n\nOWASP\
    \ Mobile Top 10 是根据研究和用户反馈编制的移动应用程序面临的安全威胁排名。\n\n## M1：不当的平台使用\n\nOWASP Mobile\
    \ Top 10 的第一类重点关注攻击者可能滥用 iOS 平台提供的安全功能的领域。此外，由于平台功能实现不当，偶尔也会出现多个安全漏洞。\n\n在此领域下，必须检查许多组件，包括生物识别认证、Keychain、平台权限等。\n\
    \n## M2：不安全的数据存储\n\n很多时候，iOS 应用程序会在各个部分本地保存某些数据。如果攻击者获得用户物理设备的访问权限，敏感数据有可能被保存在本地并被用来对付用户。\n\
    \n以下是属于此类别的一些常见危险示例：\n\n*   存储在 Plist 中的敏感数据\n*   存储在 UserDefaults 中的敏感数据\n* \
    \  存储在 Keychain 中的敏感数据\n*   存储在 Core Data 中的敏感数据\n*   存储在 Webkit 缓存中的敏感数据\n* \
    \  存储在 Realm 中的敏感数据\n*   存储在 Couchbase Lite 中的敏感数据\n*   存储在 YapDatabase 中的敏感数据\n\
    *   URL 缓存（请求和响应均包括）\n*   键盘按键缓存\n*   复制/粘贴缓冲区缓存\n*   不安全的日志记录\n*   后台屏幕缓存\n*\
    \   发送给第三方的分析数据\n\n## M3：不安全的通信\n\niOS 应用程序中的通信采用客户端-服务器架构。由于通信标准（如 HTTP 通信）实现错误或不充分，攻击者可以尝试通过未加密的检查窃取关键信息、执行中间人攻击，或尝试使用\
    \ Burp Suite 等代理工具捕获请求和响应来进行研究。\n\n以下是属于此类别的一些常见危险示例：\n\n*   缺失/可绕过的 SSL Pinning\n\
    *   HTTP 通信 [未加密通信]\n*   敏感信息以明文提交\n*   在日志中记录敏感信息\n\n## M4：不安全的认证\n\n当应用程序不当处理认证检查，或允许攻击者修改登录/认证请求以访问目标用户账户时，通常被归类为不安全的认证。\n\
    \n以下是属于此类别的一些常见危险示例：\n\n*   可猜测/弱/默认凭据\n*   利用注入攻击等手段绕过认证\n\n## M5：加密措施不足\n\n\
    iOS 应用程序经常存储用户数据或在各种客户端-服务器查询中使用它们。由于缺乏强加密，攻击者可能会尝试访问使用弱加密方法加密的数据，从而获取敏感数据。\n\n\
    以下是属于此类别的一些常见危险示例：\n\n*   窃取应用和用户数据\n*   访问加密文件\n*   访问加密的客户端-服务器请求端点\n\n## M6：不安全的授权\n\
    \n"
