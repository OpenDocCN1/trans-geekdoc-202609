    我们对 `7.7.7.0/24` 网段的 nmap 扫描揭示了两个漏洞，正如你可能记得的那样。它们分别是 MS08-067 和 Easy File Share
    程序中的缓冲区溢出漏洞。这两种方法均可用于获取目标系统的访问权限。另一种选择是继续使用 SSH，但目前我们将坚持使用 MS08-067 和 Easy File
    Share。


    # 使用 Bind TCP 的 MS08-067


    Metasploit Framework 模块 `exploit/windows/smb/ms08_067_netapi` 可用于通过利用 MS08-067
    漏洞来攻陷目标机器。选择 Bind TCP 作为载荷类型这一事实至关重要。由于未指定双向路由，目标系统将无法直接联系我们。因此，必须选择 Bind TCP
    载荷类型，以便目标在自己的端口上等待连接。在成功的利用过程之后，将连接到目标系统正在监听的端口。


    *图 9.23* 演示了 Reverse TCP 和 Bind TCP 连接的工作原理：


    ![](img/Figure-9.23.jpg)


    **图 9.23：** Reverse TCP 连接和 Bind TCP 连接


    如 *图 9.24* 所示，使用 MS08-067-Netapi 利用模块和 Bind TCP 载荷攻陷受害者：


    ![](img/Figure-9.24.jpg)


    **图 9.24：** MS08-067-Netapi 利用输出 _1


    另请参阅 *图 9.25*：


    ![](img/Figure-9.25.jpg)


    **图 9.25：** MS08-067-Netapi 利用输出 _2


    请参阅 *图 9.26*：


    ![](img/Figure-9.26.jpg)


    **图 9.26：** MS08-067-Netapi 利用输出 _3


    # Easy File Share 缓冲区溢出


    Easy File Share 应用程序也存在漏洞。可以采取以下步骤设置带有 Bind TCP 载荷的利用模块并攻陷目标，如 *图 9.27* 所示：


    ![](img/Figure-9.27.jpg)


    **图 9.27：** Easy File Share 利用输出 _1


    另请参阅 *图 9.28*：


    ![](img/Figure-9.28.jpg)


    **图 9.28：** Easy File Share 利用输出 _2


    另请参阅 *图 9.29*：


    ![](img/Figure-9.29.jpg)


    **图 9.29：** Easy File Share 利用输出 _3


    在最后一种情况下，攻击者到达的位置如 *图 9.30* 所示：


    ![](img/Figure-9.30.jpg)


    **图 9.30：** 隐藏网络布局


    我们现在可以访问 `7.7.7.20` 机器。我们将不得不进行更多的数据收集。与 RD 机器一样，名为 JC 的机器有两块网卡。我们发现了第二个隐藏网络（`8.8.8.0/24`）。请参阅
    *图 9.31*：


    ![](img/Figure-9.31.jpg)


    **图 9.31：** 使用 ipconfig 进行数据收集


    让我们通过在第二个隐藏网络上执行 ARP 扫描器来继续信息收集。请参阅 *图 9.32*：


    ![](img/Figure-9.32.jpg)


    **图 9.32：** arp_scanner 模块


    ARP 扫描显示在此网络中发现了四台机器。请参阅 *图 9.33*：


    ![](img/Figure-9.33.jpg)


    **图 9.33：** Autoroute 命令


    我们再次添加路由定义。


    # 双重跳板


    在对 JC 系统的信息收集操作期间，发现了 `8.8.8.0/24` 网络。得益于第一台被攻陷的系统，我们已经在 `172.16.0.0/24` 和 `7.7.7.0/24`
    网络之间建立了路由规则。


    从 `172.16.0.20` 发送到 JC 设备（第二台被感染机器）的网络数据包首先被发送到 RD 设备（第一台被攻陷机器），然后 RD 将其转发给 JC
    机器。


    攻击者计算机（`172.16.0.20`）尝试联系 `8.8.8.9` 位置将经历两个阶段：


    *   **RD**：我们不知道如何访问 `8.8.8.9` IP 地址。但我们知道系统，以及谁知道如何访问它。我们可以指引你到达那里。

    *   **JC**：我们知道如何将数据包从 `7.7.7.0/24` 网络转发到 `8.8.8.0/24` 网络。


    *图 9.34* 是被攻陷和发现的系统的最终情况：


    ![](img/Figure-9.34.jpg)


    **图 9.34：** 被攻陷系统的最终状态


    # 神奇的 ProxyChains


    ProxyChains 工具建立并发送从头到尾的代理服务器链接。在本地 1081 端口，为新发现的 `8.8.8.0/24` 网络启动了一个新的 socks4
    代理服务器。请参阅 *图 9.35*：


    ![](img/Figure-9.35.jpg)


    **图 9.35：** Socks4a 模块


    新代理服务器的信息将在 `/etc/proxychains.conf` 配置文件中指定。动态链功能确保定义的代理服务器按顺序依次切换。请参阅 *图 9.36*：


    ![](img/Figure-9.36.jpg)


    **图 9.36：** proxychains.conf 文件


    可以使用 ProxyChains 工具通过第二个跳板系统配合 nmap 实用程序扫描 `8.8.8.9` 目标。请参阅 *图 9.37*：


    ![](img/Figure-9.37.jpg)


    **图 9.37：** Nmap 输出 _1


    另请参阅 *图 9.38*：


    ![](img/Figure-9.38.jpg)


    **图 9.38：** Nmap 输出 _2


    正如你所见，数据包首先通过第一个代理服务器中转，然后继续前往我们设置的第二个代理服务器。最终到达目的地。当分析扫描结果时，将确定 `8.8.8.9` 上的
    vsftpd 服务存在漏洞。


    使用以下方法在 Metasploit 框架中准备 vsftpd 利用模块并攻陷我们的最终目标。请参阅 *图 9.39*：


    ![](img/Figure-9.39.jpg)


    **图 9.39：** vsftpd 利用输出 _1


    另请参阅 *图 9.40*：


    ![](img/Figure-9.40.jpg)


    **图 9.40：** vsftpd 利用输出 _2


    # 缓解措施


    一些缓解措施如下：


    *   应从当前网络拓扑中移除允许 DMZ 访问的多网卡系统。

    *   应仅使用 DMZ 结构来访问 DMZ 中的系统。


    # 结论


    攻击者通过遵循以下步骤发现了两个不同的隐藏网络：


    1.  攻击者获得了与攻击者处于同一网络的 RD 机器的访问权限。

    2.  然后他注意到 RD 机器有两个网络接口。

    3.  使用 autoroute 后渗透模块，他创建了一条路由规则。

    4.  攻击者随后在 `7.7.7.0/24` 网络上运行了 ARP 和 NMAP 扫描，并发现了一台名为 JC 的机器。

    5.  JC 有两个不同的漏洞。Easy File Share 和 MS08-067。

    6.  成功利用 MS08-067 后，攻击者获得了对 `7.7.7.20` 网络的访问权限。

    7.  信息收集显示 JC 也有两个网络接口。

    8.  在 `7.7.7.20` 上定义了另一条路由规则。

    9.  在 `8.8.8.0/24` 上使用了 ARP 和 NMAP。

    10. 易受攻击的 vsftpd 正在 `8.8.8.9` 的 SK 机器上运行。


    请参阅 *图 9.41*：


    ![](img/Figure-9.41.jpg)


    **图 9.41：** 隐藏网络的最终布局


    虽然攻击者的机器最初只能访问其连接的第一个网络，但这些攻击也使他获得了对两个隐蔽网络的访问权限。


    # 问题


    1.  什么是路由？

    2.  什么是跳板？

    3.  什么是端口转发？


