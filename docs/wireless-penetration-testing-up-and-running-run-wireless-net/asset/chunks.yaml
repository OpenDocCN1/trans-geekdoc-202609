    # [Connecting to the access point](#toc.xhtml#s16a)


    Now, we will look at how to use the wireless adapter to connect to the access
    point. Wireless Lab is the SSID of our access point, and it does not use any authentication.
    To connect your wireless adaptor to the access point, follow these steps:


    Let us have a look at the wireless networks that our adaptor can currently identify.
    You can get a list of nearby networks by running the command `iwlist wlan0 scanning`.


    1. Continue scrolling down until you see the Wireless Lab network listed. It is
    detected as `Cell 01` in my configuration; it may be different from yours. The
    network name is stored in the ESSID field, as shown in *[Figure 1.25](#c01.xhtml#fig1_25)*:


    ![](images/Figure-1.25.jpg)


    **Figure 1.25:** iwlist wlan0 scanning command


    2. To check the status, run the commands `iwconfig wlan0 essid "Wireless Lab"`
    and `iwconfig wlan0`. If you successfully connected to the access point, the MAC
    address of the access point should appear in the Access Point: field of the `iwconfig`
    output, as shown in *[Figure 1.26](#c01.xhtml#fig1_26)*:


    ![](images/Figure-1.26.jpg)


    **Figure 1.26:** iwconfig wlan0 essid “Wireless Lab” command


    3. According to the documentation, the access point’s management interface IP
    address is `192.168.1.1`. Alternatively, when we configured the access point,
    this was the default router IP address. Let us use the `ifconfig wlan0 192.168.1.3
    netmask 255.255.255.0` up command to set our IP address in the same subnet. Type
    `ifconfig wlan0` and review the output to see if the command worked, as shown
    in *[Figure 1.27](#c01.xhtml#fig1_27)*:


    ![](images/Figure-1.27.jpg)


    **Figure 1.27:** ifconfig wlan0 192.168.1.3 netmask 255.255.255.0 command


    4. Now, use the `ping 192.168.1.1` command to ping the access point. The answers
    from the access point should be visible if the network connection has been correctly
