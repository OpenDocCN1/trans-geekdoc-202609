  trans: "\n**图 10.7：** Dalvik 与 ART 编译的对比\n\n# 原生库\n\n在使用 Java 进行开发时，某些底层组件无法直接交互。例如，如果你需要在设备屏幕上显示图形，将无法直接用\
    \ Java 编写代码；相反，你需要编写一个函数或方法，来调用其他非 Java 程序的原生程序。\n\nAndroid 中的原生库是非 Java 程序。这些库使用多种语言编写，包括\
    \ C、C++ 等。Android `原生开发工具包` (`NDK`) 包含大量库和头文件，允许开发者创建和构建各种 Activity，用于安装这些原生代码。\n\
    \n*图 10.8* 展示了 Android 平台上当前可用的众多原生库：\n\n![](img/Figure-10.8.jpg)\n\n**图 10.8：**\
    \ 原生库\n\n任何 `原始设备制造商` (`OEM`) 均可对其进行定制。库模块通常包含以下项目：\n\n*   **媒体框架：** 该框架基于 PacketVideo\
    \ OpenCore 平台构建，支持常见的音频、视频和静态帧格式以及编解码器插件。StageFright 漏洞是通过利用媒体框架 (`libStageFright`)\
    \ 的缺陷发现的，该缺陷让攻击者能够通过一项自动播放通过 MMS 或其他方式接收的视频文件的功能，获得对 Android 设备的完全远程访问权限。\n\n\
    *   **Surface Manager (界面管理器)：** 支持显示子系统，并渲染许多应用程序的 2D 和 3D 图形图层。\n\n*   **Freetype：**\
    \ 用于渲染位图和文本。\n\n*   **OpenGL ES：** OpenGL 是一个跨平台图形 API，为 3D 图形处理器定义了软件接口。\n\n\
    *   **安全套接字层** (`SSL`)**：** 基于 OpenSSL (`www.openssl.org`)。\n\n*   **SQLite：**\
    \ 应用程序框架 API 使这个轻量级关系数据库引擎可供任何应用程序使用。\n\n*   **WebKit：** 这是一个基于 WebKit 浏览器 (`www.webkit.org`)\
    \ 的浏览器引擎，支持页面渲染、完整的 CSS、JavaScript、DOM 和 AJAX，以及单栏和自适应视图渲染。\n\n*   **SGL** (即\
    \ **可伸缩图形库** 的缩写)：** 用于 2D 图形库。\n\n*   **libc：** 源自 BSD 的标准 C 系统库，用于基于嵌入式 Linux\
    \ 的设备。\n\n# 应用程序框架\n\n应用程序框架为开发者提供了创建更复杂应用或工具所需的工具。该框架用于管理应用程序的完整开发生命周期。\n\n例如，正在开发需要通知功能应用的开发者，无需编写一行代码；只需调用\
    \ `Notification Manager` (通知管理器) API 即可。操作 Android 智能手机所需的大多数 API 都由该框架提供。\n\n\
    *图 10.9* 展示了 Android 平台当前可用的框架列表：\n\n![](img/Figure-10.9.jpg)\n\n**图 10.9：** 应用程序框架\n\
    \n该框架中的关键服务如下：\n\n*   **Activity Manager (活动管理器)：** 活动管理器管理应用的完整生命周期，还负责处理活动的多种状态，以确保使用不同进程的应用平稳运行，我们将在下一节深入探讨。\n\
    \n*   **Content Providers (内容提供者)：** 该组件使应用程序能够与其他应用共享和发布数据。内容提供者负责封装数据、定义数据安全性和控制数据结构。例如，当用户对应用的所有输入都被结构化并保存在\
    \ SQLite 数据库中时。\n\n*   **Resource Manager (资源管理器)：** 资源管理器管理对所有未在应用中编码的嵌入式资源的访问，例如图形、本地化字符串和其他布局文件。\n\
    \n*   **Notifications Manager (通知管理器)：** 为移动用户提供通知并显示警报。\n\n*   **View System\
    \ (视图系统)：** 视图系统监管多种视图、事件分发以及其他重要的按钮和列表。\n\n*   **Package Manager (包管理器)：** 控制设备上安装的所有应用程序包。\n\
    \n*   **Telephony Manager (电话管理器)：** 为设备提供电话服务，如状态和用户信息。\n\n*   **Location Manager\
    \ (位置管理器)：** 提供关于位置变化的位置服务，允许应用接收更新。\n\n*   **Window Manager (窗口管理器)：** 监管向用户显示的屏幕组织，并在应用程序生成并在显示窗口上适当分层时，为界面提供决策能力。\n\
    \n# 应用层\n\n这是 Android 技术栈的第一层，绝大多数用户通过应用程序与手机进行交互。如 *图 10.10* 所示，设备上通常有两类应用程序：\n\
    \n![](img/Figure-10.10.jpg)\n\n**图 10.10：** 应用层\n\n现在，让我们探讨它们的区别。\n\n# 原生 Android\
    \ 应用或系统应用\n\n系统应用是由制造商预置在手机中并随手机提供的应用程序。电子邮件客户端、短信程序、电话、日历、地图、拨号器、浏览器、联系人及其他应用均默认加载。这些应用通常无法从设备中移除，且位于\
    \ `/system` 文件夹中。\n\n# 用户安装的应用或自定义应用\n\n用户可以通过各种分发网络（包括 Google Play 和 Amazon Store）下载并安装这些应用程序。这些应用位于\
    \ Android 文件系统的 `/data/data/` 子目录中。在接下来的章节中，我们将详细介绍安全功能的具体细节。\n\n# Android 渗透测试环境搭建\n\
    \n对于任何形式的安全评估，建立一个结构良好的测试环境至关重要。建议从零环境开始，假设你的电脑上没有安装任何东西。建立 Android 应用渗透测试基础设施的硬件和软件要求如下。\n\
    \n本书重点介绍在 Windows 上搭建环境，但你也可以自由尝试 Linux 和其他操作系统。\n\n*   **硬件和操作系统要求：**\n    *\
    \   运行 Windows 7 (64 位) 的工作站/笔记本电脑\n\n*   **移动设备和操作系统要求：**\n    *   Google Nexus\
    \ 5 或运行 Android 5.0 或更高版本的其他设备 (已 Root)\n\n*   **软件要求：**\n    *   Python\n   \
    \ *   Java Development Kit (1.8)\n\n*   **其他要求：**\n    *   适用于移动设备的兼容 USB 数据线\n\
    \    *   网络 Wi-Fi 设备（可使用任何具有网络共享功能的智能手机充当 Wi-Fi 路由器）\n\n为什么测试环境需要一台已 Root 的手机？\n\
    \n原因很简单：为了能够在设备上编辑和安装任何工具，并运行来自非典型应用商店的未签名软件。已 Root 的手机将拥有完整的文件系统访问权限。给移动设备 Root\
    \ 不在本书范围内。\n\n# Android Studio 和 SDK\n\n用于开发 Android 应用的官方 `集成开发环境` (`IDE`) 是\
    \ Android Studio，由 Google 支持。2019 年 5 月 7 日，Kotlin 取代 Java 成为开发 Android 应用的首选语言。但\
    \ Java 仍在被用于开发 Android 应用。Android Studio Dolphin|2021.3.1 具有以下功能。\n\n*   基于 Gradle\
    \ 的构建支持。\n*   UI 组件可通过布局编辑器中的拖放功能创建。\n*   通用的 Android 设计和组件可通过基于模板的向导创建。\n"
