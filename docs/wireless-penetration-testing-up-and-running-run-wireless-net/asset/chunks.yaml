    从本质上讲，这是一种利用被攻陷的计算机来访问我们原本无法访问的网络的做法。如果一台具有网络访问权限的计算机被攻陷，网络隔离将变得毫无意义。这种方法允许攻击者通过路由到被攻陷的系统来访问秘密网络。枢纽用于将所有请求传输到新发现的网络。它就像一种隧道。请参阅
    图 9.2：


    ![](img/Figure-9.2.jpg)


    **图 9.2：** 枢纽


    如拓扑所示，具有两块 NIC 的设备可以访问 `192.168.1.0/24` 和 `192.168.10.0/24` 网络。除非定义了路由规则，否则在正常情况下这两个网络之间无法互访。根据此拓扑，授权用户正在使用一台配有两块
    NIC 网卡的计算机，必须访问 DMZ 中的某些服务。


    # 攻陷第一个枢纽和端口转发


    根据我们的攻击场景，在名为 RD 的系统上获得的 meterpreter shell 同样连接到了 DMZ 网络。通过信息收集过程，后来发现目标拥有两块 NIC。


    **环境的路由器不在网络间路由。**


    图 9.3 说明了第一个枢纽：


    ![](img/Figure-9.3.jpg)


    **图 9.3：** 第一个枢纽


    图 9.4 说明了 `Meterpreter_1`：


    ![](img/Figure-9.4.jpg)


    **图 9.4：** Meterpreter\_1


    图 9.5 说明了 `Meterpreter_2`：


    ![](img/Figure-9.5.jpg)


    **图 9.5：** Meterpreter\_2


    根据我们的场景，获得 RD 系统访问权限的攻击者将希望使用第二块 NIC (7.7.7.0/24) 来访问网络。为此，攻击者首先需要在 RD 上定义路由规则。


    使用 Metasploit，这很简单。要使用当前的 meterpreter 会话建立路由规则，请执行以下命令。请参阅 图 9.6：


    ![](img/Figure-9.6.jpg)


    **图 9.6：** Meterpreter\_3


    根据建立的规则，如果 ID 值为 2 的 meterpreter 会话处于运行状态，则可以在 Metasploit 框架中访问 7.7.7.0/24 网络，如
    图 9.7 所示。


    然后使用 ARP 扫描器等后渗透模块发现 JC 系统的 IP 地址。在隐藏网络中发现的另一台计算机——7.7.7.20——是 JC。


    请参阅 图 9.7：


    ![](img/Figure-9.7.jpg)


    **图 9.7：** Meterpreter\_4


    7.7.7.0/24 网络中存活系统的 IP 地址已确定，包括名为 JC 的系统。请参阅 图 9.8：


    ![](img/Figure-9.8.jpg)


    **图 9.8：** 隐藏网络


    自然而然会产生下一个问题：是否会使用 nmap 风格的扫描工具来代替 `arp_scanner` 等后渗透模块进行此类扫描工作？


    # 通过枢纽使用 Nmap


    要实现这一点，Metasploit 的路由配置必须处于激活状态，且能够通过 socks4 代理发送。可以使用另一个 Metasploit 模块来满足此要求。


    作为 Metasploit 模块的 socks4 代理的使用可见于 图 9.9：


    ![](img/Figure-9.9.jpg)


    **图 9.9：** socks4 代理


    使用为 GNU/Linux 操作系统构建的 ProxyChains 实用程序，任何 TCP 连接都可以通过 TOR 或 SOCKS4、SOCKS5 或 HTTP/HTTPS
    路由到目标。在此隧道方法中可以使用许多代理服务器。除了提供匿名性外，像枢纽这样的应用程序可用于将流量转移到新发现的网络。请参阅 图 9.10：


    ![](img/Figure-9.10.jpg)


    **图 9.10：** ProxyChains


    在文本编辑器中打开 `/etc/proxychains.conf` 文件，将新建的 socks4 代理服务器的信息添加到最后一行。请参阅 图 9.11：


    ![](img/Figure-9.11.jpg)


    **图 9.11：** Proxychains.conf 文件


    使用 ProxyChains 执行 nmap 扫描是一种简单的方法。网络数据包将通过定义的代理发送到目标。请参阅 图 9.12：


    ![](img/Figure-9.12.jpg)


    **图 9.12：** Nmap 输出\_1


    另请参阅 图 9.13：


    ![](img/Figure-9.13.jpg)


    **图 9.13：** Nmap 输出\_2


    根据扫描结果，目标机器上将运行 SSH 和 HTTP 服务。在继续进行利用之前，我们将研究一种称为端口转发的不同类型的流量路由。


    # 端口转发


    端口转发是枢纽的第一步之一。隐秘网络上指定系统的某些服务可能无法直接访问（Web 服务器等）。这是由于缺乏双向路由。我们知道如何到达目标系统并发送请求，但因为目标不知道我们的位置，我们的请求将被拒绝。请参阅
    图 9.14：


    ![](img/Figure-9.14.jpg)


    **图 9.14：** 端口转发


    因此，我们使用当前的 meterpreter 会话将本地系统上的一个端口路由到目标。只要此进程存活，路由就会生效。


    此时需要注意一点：`autoroute` 运行命令允许我们得益于所提供的路由，在 Metasploit 框架内自由工作。然而，我们将需要像端口转发和 ProxyChains
    这样的工具，以便使用 Kali 工具访问目标。


    端口转发可以使用 `portfwd` 模块完成，它是 Metasploit 的后渗透模块之一。请参阅 图 9.15：


    ![](img/Figure-9.15.jpg)


    **图 9.15：** 使用 Metasploit 进行端口转发


    当我们使用互联网浏览器向本地 `2323` 端口提交链接请求时，连接请求将被转发到 IP 地址为 7.7.7.20 的计算机的 80 端口。


    ProxyChains 和 Nmap 之前已在 7.7.7.20 的第 80 个 TCP 端口上识别出正在运行的 Web 服务。要使用此服务，请将本地系统上的端口
    `2323` 转发到我们想要使用的 7.7.7.20 端口 `80`。请参阅 图 9.16：


    ![](img/Figure-9.16.jpg)


    **图 9.16：** 端口转发命令


    活动规则可以使用 `portfwd list` 命令查看。请参阅 图 9.17：


    ![](img/Figure-9.17.jpg)


    **图 9.17：** Portfwd list 命令


    当验证 IP 地址为 7.7.7.20 的目标系统上运行在 80 端口的程序时，将检测到 Easy file sharing Web Server。请参阅
    图 9.18：


    ![](img/Figure-9.18.jpg)


    **图 9.18：** Easy file sharing Web server


    # 通过枢纽进行 SSH 暴力破解


    正如您所知，在 7.7.7.20 上识别出了 SSH 服务。对此服务进行暴力破解攻击很简单。`SSH_enumusers` 辅助模块允许用户枚举，如 图 9.19
    所示：


    ![](img/Figure-9.19.jpg)


    **图 9.19：** SSH\_enumusers 模块输出\_1


    另请参阅 图 9.20：


    ![](img/Figure-9.20.jpg)


    **图 9.20：** SSH\_enumusers 模块输出\_2


    除了 Metasploit 框架上的辅助模块外，还可以使用 Hydra 等 Kali 工具进行攻击。如果 Hydra 部署在 ProxyChains 中，所有流量将通过被攻陷的系统重定向到目标系统。请参阅
    图 9.21：


    ![](img/Figure-9.21.jpg)


    **图 9.21：** Kali Linux 中的 Hydra 工具


    通过代理服务器使用在 Hydra 暴力破解攻击期间获得的 admin 用户名和密码 123456 通过 SSH 连接到目标系统。请参阅 图 9.22：


    ![](img/Figure-9.22.jpg)


    **图 9.22：** SSH 连接


