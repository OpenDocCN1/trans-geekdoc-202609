- raw: "We will use a Java vulnerability to hack Windows 7 in the next demonstration.\
    \ This vulnerability will allow the attacker to collect system information or\
    \ hashdump, take a picture from a Webcam, give administrator access, construct\
    \ and launch executables, create backdoors, and so on. Let us get started!\n\n\
    1.  Open a terminal and type `msfconsole`, as shown in *[Figure 8.27](#c08.xhtml#fig8_27)*:\
    \ \n\n    ![](images/Figure-8.27.jpg)\n\n    **Figure 8.27:** msfconsole command\n\
    \n2.  Now, type search `java_jre17_provider_skeleton`, as shown in *[Figure 8.28](#c08.xhtml#fig8_28)*:\
    \ \n\n    ![](images/Figure-8.28.jpg)\n\n    **Figure 8.28:** Search the command\n\
    \n3.  Then type use `exploit/multi/browser/java_jre17_provider_skeleton`, as shown\
    \ in *[Figure 8.29](#c08.xhtml#fig8_29)*: \n\n    ![](images/Figure-8.29.jpg)\n\
    \n    **Figure 8.29:** Use the command\n\n4.  Now, type **show options**, as shown\
    \ in *[Figure 8.30](#c08.xhtml#fig8_30)*: \n\n    ![](images/Figure-8.30.jpg)\n\
    \n    **Figure 8.30:** Show options command\n\n5.  Let us configure three modules\
    \ options: `SRVHOST`, `SRVPPORT`, and `URIPATH`, as shown in *[Figure 8.31](#c08.xhtml#fig8_31)*:\
    \ \n\n    ![](images/Figure-8.31.jpg)\n\n    **Figure 8.31:** Set command\n\n\
    \    Replace `SRVHOST` (`192.168.1.128`) with your Kali Linux IP address.\n\n\
    6.  Now, let us start the exploit, as shown in *[Figure 8.32](#c08.xhtml#fig8_32)*:\
    \ \n\n    ![](images/Figure-8.32.jpg)\n\n    **Figure 8.32:** Exploit command\n\
    \n7.  Now, let us go to the Windows 7 machine (the victim) and from Internet Explorer\
    \ point to our Kali Machine, as shown in *[Figure 8.33](#c08.xhtml#fig8_33)*:\
    \ \n\n    ![](images/Figure-8.33.jpg)\n\n    **Figure 8.33:** Windows 7 machine\n\
    \n    Just leave the browser there. Then in the Metasploit console, you will see\
    \ the following *[Figure 8.34](#c08.xhtml#fig8_34)*:\n\n    ![](images/Figure-8.34.jpg)\n\
    \n    **Figure 8.34:** Metasploit Console 7\n\n8.  At this point, you will see\
    \ a session connected to the Windows 7 Machine, as shown in *[Figure 8.35](#c08.xhtml#fig8_35):*\n\
    \n    ![](images/Figure-8.35.jpg)\n\n    **Figure 8.35:** Interactive shell on\
    \ Windows 7 machine\n\n9.  To connect to the session, we can run the following\
    \ and check the system info, as shown in *[Figure 8.36](#c08.xhtml#fig8_36)*:\
    \ \n\n    ![](images/Figure-8.36.jpg)\n\n    **Figure 8.36:** Session 1 command\n\
    \n10.  Now, let us start up a shell and run some commands remotely, as shown in\
    \ *[Figure 8.37](#c08.xhtml#fig8_37)*: \n\n     ![](images/Figure-8.37.jpg)\n\n\
    \     **Figure 8.37:** Shell command\n\nCongratulations! The Windows 7 operating\
    \ system has been successfully exploited by you.\n\nPlease consider the following\
    \ to defend yourself from such attacks:\n\n*   Disable Java if you are not going\
    \ to use it.\n\n*   Increase Java’s security level.\n\n*   Allow only trusted\
    \ sources from Java.\n\n*   Visit only trusted websites and remote servers.\n\n\
    *   Enable Windows Defender or other security software.\n\n*   Use HTTPs Protocol\
    \ and VPN to protect from all MITM attacks where everything will be encrypted.\n\
    \n# [Preventions](#toc.xhtml#s135a)\n\nA summary of all the preventions addressed\
    \ in this chapter is as follows:\n\n*   Use SSH or encrypted e-mail for file transfers.\n\
    \n*   Use a VPN when on public networks.\n\n*   Use HTTPs Protocol when on public\
    \ networks.\n\n*   Use a password manager to log in to websites.\n\n*   Disable\
    \ Java if you are not going to use it.\n\n*   Increase Java’s security level.\n\
    \n*   Allow only trusted sources from Java.\n\n*   Visit only trusted websites\
    \ and remote servers.\n\n*   Enable Windows Defender or other security software.\n\
    \n*   Download and install software updates.\n\n*   Download and install the operating\
    \ system update.\n\nThis, once again, is dependent on the user’s computer activity.\
    \ If the user connects to a public network, they may become a target of a MITM\
    \ attack. A vulnerability attack could be launched against a person who is pirating\
    \ software or movies.\n\n# [Conclusion](#toc.xhtml#s136a)\n\nThe practical demonstrations\
    \ in this chapter should have opened your eyes and broadened your feeling of security,\
    \ allowing you to better protect yourself and others from threats. We addressed\
    \ the following topics in this chapter:\n\n*   How to capture unencrypted traffic\
    \ with protocols such as HTTP, FTP, and Telnet\n\n*   How to protect yourself\
    \ using encryption\n\n*   What man-in-the-middle attacks are\n\n*   A demonstration\
    \ of a man-in-the-middle attack\n\n*   How to protect yourself from man-in-the-middle\
    \ attacks\n\n*   What Metasploit is\n\n*   A demonstration of Metasploit\n\n*\
    \   How to protect yourself from Metasploit attacks\n\nYou will learn how to pivot\
    \ through a local network to reach other systems and devices in the next chapter.\
    \ We will also be documenting and cleaning up after ourselves. Look forward to\
    \ seeing you in *[Chapter 9: Wireless Post-Exploitation](#c09.xhtml)*.\n\n# [Questions](#toc.xhtml#s137a)\n\
    \n1.  How to protect yourself from man-in-the-middle attacks?\n\n2.  What is Metasploit?\n\
    \n3.  What is SSLStrip?\n\n# [CHAPTER 9](#toc.xhtml#c09)\n\n# [Wireless Post-Exploitation](#toc.xhtml#c09)\n\
    \n# [Introduction](#toc.xhtml#s138a)\n\nWelcome! In the last chapter, we compromised\
    \ a single network target. So, what happens next, you might wonder? The attacker\
    \ will certainly go further into the network to target internal workstations and\
    \ servers.\n\nThe idea of Défense-in-Depth, which has a significant place in the\
    \ field of information technology, necessitates the creation of an n-layered security\
    \ architecture to defend key services. Consider this in terms of corporate networks:\
    \ vital systems cannot be connected to other systems. In this chapter, we will\
    \ look at how attackers can use pivoting tactics to gain access to hidden networks\
    \ that are not accessible in the first place.\n\n# [Structure](#toc.xhtml#s139a)\n\
    \nThe following topics will be covered in this chapter:\n\n*   What is routing?\n\
    \n*   What is pivoting?\n\n*   Compromise first pivot and port forwarding  \n\n\
    \    *   Nmap via pivoting\n\n    *   Port forwarding\n\n*   SSH brute-force over\
    \ pivoting\n\n*   Gaining access to the second pivot\n\n*   Double pivoting\n\n\
    *   Mitigations\n\n# [Objectives](#toc.xhtml#s140a)\n\nIn this chapter, you will\
    \ be able to learn how to use first and double pivoting to investigate hidden\
    \ networks and the mitigations methods.\n\n# [What is routing?](#toc.xhtml#s141a)\n\
    \nRouting is the process of defining how devices in various networks communicate\
    \ with one another. Routing is frequently done with the help of devices known\
    \ as *routers*. The routing table is used by the routers to route network packages\
    \ to their intended destinations. Routing can be done on any computer with the\
    \ operating system loaded on it, not just network devices like routers. Refer\
    \ to *[Figure 9.1](#c09.xhtml#fig9_1)*:\n\n![](images/Figure-9.1.jpg)\n\n**Figure\
    \ 9.1:** Routing\n\nAccording to the example in the previous figure, a routing\
    \ table record is required to communicate successfully between the `192.168.1.0/24`\
    \ and `192.168.10.0/24` networks. Access is made from the `192.168.1.0/24` source\
    \ to the `192.168.10.0/24` destination according to the router’s rule.\n\nThe\
    \ following is the adventure of a network package:\n\n1.  Is the IP address to\
    \ be accessed on the local network?  \n\n    1.  If yes, reach the destination.\n\
    \n    2.  If not, send it to the gateway.\n\n2.  The router examines its own routing\
    \ table after receiving the package.  \n\n    1.  Do you have a routing rule in\
    \ place for the target IP address or network?  \n\n        1.  If yes, send the\
    \ package to the target or the destination.\n\n        2.  If not, send it to\
    \ the gateway.\n\n3.  Other routers go through a similar procedure.\n\n4.  Finally,\
    \ the package reaches the router in charge of the institution’s internet exit.\
    \ The package is then uploaded to the internet.\n\n# [What is pivoting?](#toc.xhtml#s142a)"
  fmt: "\n# Wireless Post-Exploitation\n\n## Introduction\n\nWelcome! In the last\
    \ chapter, we compromised a single network target. So, what happens next, you\
    \ might wonder? The attacker will certainly go further into the network to target\
    \ internal workstations and servers.\n\nThe idea of Défense-in-Depth, which has\
    \ a significant place in the field of information technology, necessitates the\
    \ creation of an n-layered security architecture to defend key services. Consider\
    \ this in terms of corporate networks: vital systems cannot be connected to other\
    \ systems. In this chapter, we will look at how attackers can use pivoting tactics\
    \ to gain access to hidden networks that are not accessible in the first place.\n\
    \n## Structure\n\nThe following topics will be covered in this chapter:\n\n* \
    \  What is routing?\n*   What is pivoting?\n*   Compromise first pivot and port\
    \ forwarding\n    *   Nmap via pivoting\n    *   Port forwarding\n*   SSH brute-force\
    \ over pivoting\n*   Gaining access to the second pivot\n*   Double pivoting\n\
    *   Mitigations\n\n## Objectives\n\nIn this chapter, you will be able to learn\
    \ how to use first and double pivoting to investigate hidden networks and the\
    \ mitigations methods.\n\n## What is routing?\n\nRouting is the process of defining\
    \ how devices in various networks communicate with one another. Routing is frequently\
    \ done with the help of devices known as *routers*. The routing table is used\
    \ by the routers to route network packages to their intended destinations. Routing\
    \ can be done on any computer with the operating system loaded on it, not just\
    \ network devices like routers. Refer to **Figure 9.1**:\n\n![](images/Figure-9.1.jpg)\n\
    \n**Figure 9.1:** Routing\n\nAccording to the example in the previous figure,\
    \ a routing table record is required to communicate successfully between the `192.168.1.0/24`\
    \ and `192.168.10.0/24` networks. Access is made from the `192.168.1.0/24` source\
    \ to the `192.168.10.0/24` destination according to the router's rule.\n\nThe\
    \ following is the adventure of a network package:\n\n1.  Is the IP address to\
    \ be accessed on the local network?\n    1.  If yes, reach the destination.\n\
    \    2.  If not, send it to the gateway.\n2.  The router examines its own routing\
    \ table after receiving the package.\n    1.  Do you have a routing rule in place\
    \ for the target IP address or network?\n        1.  If yes, send the package\
    \ to the target or the destination.\n        2.  If not, send it to the gateway.\n\
    3.  Other routers go through a similar procedure.\n4.  Finally, the package reaches\
    \ the router in charge of the institution's internet exit. The package is then\
    \ uploaded to the internet.\n\n## What is pivoting?\n"
  trans: "\n\n# 无线后渗透\n\n## 简介\n\n欢迎来到本章！在上一章中，我们攻破了单个网络目标。那么，接下来会发生什么呢？攻击者必将深入网络内部，以内部工作站和服务器为目标。\n\
    \n纵深防御的理念在信息技术领域占据重要地位，它要求构建一个 n 层安全架构来保护关键服务。结合企业网络来看：关键系统不能直接连接到其他系统。在本章中，我们将探讨攻击者如何利用跳板技术访问最初无法访问的隐藏网络。\n\
    \n## 结构\n\n本章将涵盖以下主题：\n\n*   什么是路由？\n*   什么是跳板？\n*   攻破第一跳板与端口转发\n    *   通过跳板使用\
    \ Nmap\n    *   端口转发\n*   通过跳板进行 SSH 暴力破解\n*   获取对第二跳板的访问权限\n*   双重跳板\n*   缓解措施\n\
    \n## 目标\n\n在本章中，你将学习如何使用第一级跳板和双重跳板来探测隐藏网络，以及相应的缓解方法。\n\n## 什么是路由？\n\n路由是定义不同网络中的设备如何相互通信的过程。路由通常借助称为*路由器*的设备来完成。路由器使用路由表将网络数据包路由到其预期目的地。路由不仅可以在路由器等网络设备上进行，也可以在安装了操作系统的任何计算机上进行。请参阅**图\
    \ 9.1**：\n\n![](img/Figure-9.1.jpg)\n\n**图 9.1：** 路由\n\n根据上图示例，要在 `192.168.1.0/24`\
    \ 和 `192.168.10.0/24` 网络之间成功通信，需要一条路由表记录。根据路由器的规则，从源 `192.168.1.0/24` 访问目标 `192.168.10.0/24`。\n\
    \n网络数据包的传输历程如下：\n\n1.  要访问的 IP 地址是否在本地网络上？\n    1.  如果是，直接到达目的地。\n    2.  如果不是，发送给网关。\n\
    2.  路由器接收数据包后，检查自己的路由表。\n    1.  是否有针对目标 IP 地址或网络的路由规则？\n        1.  如果有，将数据包发送给目标或目的地。\n\
    \        2.  如果没有，发送给网关。\n3.  其他路由器经历类似的过程。\n4.  最后，数据包到达负责机构互联网出口的路由器。随后数据包被发送到互联网。\n\
    \n## 什么是跳板？\n\n"
