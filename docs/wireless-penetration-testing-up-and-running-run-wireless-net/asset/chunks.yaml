    # 结论


    本章为你提供了搭建自己的无线实验室的分步指导。你还学习了在硬盘上安装 Kali 的基础知识，以及虚拟机（VMWare）的实验，并了解了一些无线渗透测试工具，如
    Wireshark 和 Aircrack-ng。你还学习了如何使用 Web 界面配置接入点。最后，你学习了如何配置和使用无线网卡，并且必须首先学习并执行大量命令，以验证无线客户端到接入点的连接状态。


    现在，你已准备好进入 *第 2 章：无线攻击技术与方法*。


    # 问题


    1. 列举无线渗透测试过程中使用的著名网卡。


    2. 什么是 Kali Linux？


    3. 列举无线渗透测试过程中使用的著名工具。


    # 第 2 章


    # 无线攻击技术与方法


    # 简介


    在本书的第二章中，我们将假设你要么非常喜欢第一章，以至于决定继续阅读，要么因为对已有知识感到满意而跳过了它。无论如何，这是你的第一个问题。普通人会买一个无线路由器，但不会设置任何无线安全。你为什么这么认为？


    当然，你已经知道这一点，这是因为普通用户可能不了解设备的安全功能或防护措施，或者他们懂电脑但不熟悉如何实施无线安全。这就是 **Wi-Fi Protected
    Setup**（**WPS**，Wi-Fi 保护设置）发挥作用的地方。


    WPS 简化了无线家庭网络的设置。用户只需按下无线路由器上的一个按钮，路由器就会自动为用户配置一个安全网络。这不是很棒吗？错！大多数典型的无线路由器容易受到暴力破解攻击。WPS
    PIN 通常只是一串数字。由于这一安全弱点，攻击者可以使用暴力破解方法在短短几小时内检索或破解 WPS PIN。


    不只是用户会这样做；企业和 ISP 也是如此。他们只是插上无线路由器并按下 WPS 按钮，然后把密钥记下来给你。这对于企业网络来说是极差的安全性！请修改用户名，更改默认密码，禁用远程管理，并启用防火墙。


    # 结构


    在本章中，我们将讨论以下主题：


    * 访问控制攻击

    * 机密性攻击

    * 凭证攻击

    * 认证攻击


    # 目标


    本章将让你全面了解多种不同的无线攻击策略，例如访问控制攻击、机密性攻击、凭证攻击和认证攻击。这里要记住的重点是，要意识到我们在连接无线接入点和互联网时所面临的危险。


    # 访问控制攻击


    WLAN 访问控制措施（如 AP MAC 过滤器和 802.11 端口访问控制）被用于访问控制攻击，以通过无线方式进入网络或绕过 WLAN 访问控制，如 *图
    2.1* 所示：


    ![](img/Figure-2.1.jpg)


    **图 2.1：** WLAN 访问控制


    以下部分演示了一些访问控制攻击。


    # 网络侦察/战争驾驶


    网络侦察/战争驾驶是一种黑客方法，其起源于电影《战争游戏》，由演员马修·布罗德里克主演。在电影中，布罗德里克饰演的角色拨打他所在地区的每一个电话号码，以发现所有现有的计算机。这演变成了一个绘制接入点地图的过程，即攻击者寻找易受攻击或未加密的
    Wi-Fi 网络。计算机安全顾问彼得·希普利创造了“战争驾驶”这一术语，他开发的软件可以与便携式 **全球定位系统**（**GPS**）交互。简单来说，战争驾驶是通过监听信标或发送探测请求来定位无线局域网的过程，这为后续攻击提供了跳板。这种攻击可以使用
    Airmon-ng、DStumbler、KisMAC 和 NetStumbler 等工具来实施。战争驾驶通常涉及两个人：一个开车，另一个扫描周围的无线网络。他们可以通过合适的软件和应用程序设置
    GPS 来定位这些 Wi-Fi 热点，并将其保存以备将来进行无线攻击，如 *图 2.2* 所示：


    ![](img/Figure-2.2.jpg)


    **图 2.2：** 战争驾驶示意图


    # 非法接入点


