    你是否听说过或遇到过在线账户被黑客攻击的人？极有可能，该用户已成为凭证攻击的受害者，攻击者窃取了他们的登录凭证。这可以通过 Web 服务器或 **Social
    Engineering Toolkit** (**SET**) 等工具来完成。攻击者可以克隆一个网站，使其看起来真实可信，从而诱骗用户登录。用户根本不知道有人突然完全访问了他们的数据。下文将讨论凭证收集器和网络钓鱼攻击方法。


    # 凭证收集器


    此技术在攻击者的电脑上启动 `Apache` 服务器以克隆网站，使其看起来真实有效。攻击者可能会连接到无线接入点并使用 DNS 欺骗将 HTTP 请求发送到虚假网站。当用户尝试正常登录时，该网站看起来将与真实网站完全相同。在攻击者端，攻击者将获得用户的用户名和密码，以及用户的
    IP 地址。从此，攻击者可以继续收集账户登录信息，随后将其保存在报告中。对公司员工进行社会工程学攻击至关重要，以查看他们是否遵循流程和安全标准。如图 2.12
    所示：


    ![](images/Figure-2.12.jpg)


    **图 2.12：** 凭证收集器


    # 网络钓鱼


    那么，究竟什么是网络钓鱼，我们如何识别网络钓鱼尝试、欺诈或骗局？网络钓鱼是一种获取用户名、密码、社会安全号码、电话号码和信用卡号码等个人信息的欺骗性方法。这些攻击通常通过发送电子邮件给用户，指示他们访问网站以更新信息、更改密码或验证信息来实施。避免成为网络钓鱼诈骗受害者的最简单方法是了解其运作方式。来自未知来源要求提供密码或更改密码的电子邮件极有可能是欺诈性电子邮件。这些电子邮件需要被拦截或标记为垃圾邮件或网络钓鱼邮件。如果你怀疑自己已成为网络钓鱼的受害者，请更新密码，如图
    2.13 所示：


    ![](images/Figure-2.13.jpg)


    **图 2.13：** 网络钓鱼


    # 认证攻击


    攻击者使用认证攻击来窃取有效的用户身份和凭证，以访问专用网络和服务。以下部分描述了一些认证攻击。


    # 共享密钥猜测


    使用供应商默认凭证或共享密钥生成器，攻击者尝试猜测 802.11 共享密钥认证。所有共享密钥都不应保留默认值，并且应在设备设置和配置完成后立即更改。此攻击可使用任何破解工具（如
    `Aircrack-ng`）实施，如图 2.14 所示：


    ![](images/Figure-2.14.jpg)


    **图 2.14：** 共享密钥猜测


    # PSK 破解


    使用字典攻击工具，PSK 破解技术从收集的密钥握手帧中恢复 WPA/WPA2 PSK。WPA/WPA2 密钥的加密强度在此攻击中至关重要。如果密钥极难破解，可能需要数周时间，这可能不值得黑客花费时间。创建自己的密码时，请使用字母、数字和符号的组合。字符越多，成为目标的可能性就越小。这些攻击可使用
    `coWPAtty`、`genpmk`、`KisMAC` 和 `wpa_crack` 等工具实施。PSK 破解攻击如图 2.15 所示：


    ![](images/Figure-2.15.jpg)


    **图 2.15：** PSK 破解


    # 嗅探应用程序凭证


    攻击者在嗅探应用程序凭证时，从明文应用程序协议中收集用户凭证，如电子邮件地址和密码。由于许多主要网站使用 HTTPS，这种情况很少发生；尽管如此，登录无线路由器或接入点时通常使用
    HTTP，这是未加密的明文。如果你使用 HTTP 协议登录，攻击者可以轻松访问你的用户名和密码。这些攻击可使用 `Ace Password Sniffer`、`dsniff`、`PHoss`
    和 `Win Sniffer` 等工具实施，如图 2.16 所示：


    ![](images/Figure-2.16.jpg)


    **图 2.16：** 嗅探


    # 破解域账户


    使用暴力破解或字典攻击工具破解域账户时，攻击者通过破解 NetBIOS 密码哈希来恢复用户的凭证，如其 Windows 登录名和密码。某些程序需要来自 Internet
    Explorer、Firefox 或 Google Chrome 的浏览器保存密码。如果攻击者获得你的凭证，他们可能能够访问网络共享、收发电子邮件，如果该账户具有管理权限，甚至可能危及整个域。这些攻击可使用
    `John the Ripper`、`L0phtCrack` 和 `Cain` 等工具实施，如图 2.17 所示：


    ![](images/Figure-2.17.jpg)


    **图 2.17：** John the Ripper


    # VPN 登录破解


    攻击者对 VPN 认证协议使用暴力攻击以获取用户凭证，如 PPTP 或 IPsec 密码。请确保密码和预共享密钥都是唯一且极其安全的。易于猜测的密码或数字很容易危及整个组织，导致消费者信息泄露。这些攻击可使用
    `IKE-scan`、`IKECrack`、`anger` 和 `THC-pptp-bruter` 等工具实施。VPN 登录破解攻击如图 2.18 所示：


    ![](images/Figure-2.18.jpg)


    **图 2.18：** IKE-scan


    # 802.11 身份盗窃


    在 802.11 身份盗窃攻击中，攻击者从无线 802.11 的明文中收集用户配置文件。加密对于确保数据不被泄露至关重要。连接到 Wi-Fi 网络时，使用
    HTTPS 和 VPN 协议将有助于防范此类攻击。这可以使用 `Wireshark` 或 `Ettercap-NG` 等捕获工具完成，如图 2.19 所示：


    ![](images/Figure-2.19.jpg)


    **图 2.19：** 使用 Wireshark 窃取密码


    # 802.11 密码猜测


    802.11 密码猜测攻击使用捕获的身份反复尝试猜测用户在 802.11 认证中的密码。攻击者可能会不断猜测默认密码、供应商名称、最常用密码、生日、姓名、电话号码和其他个人信息，直到完全控制无线网络。如果攻击者拥有大型密码字典，可以轻松实施字典攻击，并在几小时内获得访问权限。这些攻击可使用
    `John the Ripper` 和 `THC Hydra` 等工具实施，如图 2.20 所示：


    ![](images/Figure-2.20.jpg)


    **图 2.20：** THC Hydra


    # 802.11 LEAP 破解


    在 802.11 LEAP 破解尝试中，攻击者使用字典攻击工具破解 NT 密码哈希，从记录的 802.11 LEAP 数据包中恢复用户凭证。这取决于密码的强度；如果密码强度高，则不太可能被破解，这就是为什么使用字母、数字和符号的组合来避免字典攻击至关重要。这些攻击可使用
    `Anwrap`、`Asleap` 和 `THC-LEAPcracker` 等工具实施。图 2.21 作为示例：


    ![](images/Figure-2.21.jpg)


    **图 2.21：** Asleap


    # 802.11 EAP 降级攻击

