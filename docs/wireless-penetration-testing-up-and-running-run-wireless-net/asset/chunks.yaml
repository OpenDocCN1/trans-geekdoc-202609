- raw: "*   **Semi-untethered Jailbreak**: In that, it enables the device to start\
    \ up on its own, a semi-untethered jailbreak is similar to an untethered jailbreak.\
    \ Each time a device starts, the startup procedure remains the same, and it enters\
    \ its default, non-jailbroken state. However, the user can re-jailbreak their\
    \ cellphone using an app that runs on their device rather than a computer, as\
    \ in a tethered or semi-tethered situation.\n\nThe jailbreak procedure is straightforward\
    \ and takes 2 to 5 minutes. The following tools can be used to jailbreak specific\
    \ iOS versions. Refer to *[Figure 11.7](#c11.xhtml#fig11_7):*\n\n![](images/Figure-11.7.jpg)\n\
    \n**Figure 11.7:** Jailbreak tools\n\n**Jailbreak provides a tool for IOS version\
    \ 15, and the higher is Zeon. You can download it from [https://zeon-app.com/](https://zeon-app.com/)\
    \ to set up the environment.**\n\nThe tools, scripts, and applications needed\
    \ to begin learning iOS applications will be covered in this part. Please be aware\
    \ that there are numerous tools and scripts available. This article may not cover\
    \ all of them; thus, it is advised that you investigate each one independently.\n\
    \nBe aware that testing iOS applications are advised to be done on a physical\
    \ device. I use a variety of iPhone 7 and iPhone 12 mini devices. Additionally,\
    \ make sure the auto-updates are off to prevent acquiring the most recent version\
    \ while you wait for a jailbreak.\n\nA virtual device can be obtained by visiting\
    \ **[https://www.corellium.com/](https://www.corellium.com/)**.\n\n# [Vulnerable\
    \ application](#toc.xhtml#s216a)\n\nUse the following vulnerable applications\
    \ and install them in the designated repositories by following the instructions\
    \ provided:\n\n*   **DVIA-v2**: **[https://github.com/prateek147/DVIA-v2i](https://github.com/prateek147/DVIA-v2i)**\n\
    \n*   **GOAT**: **[https://github.com/OWASP/igoat](https://github.com/OWASP/igoat)**.\
    \ We will be using the DVIA-v2 application.\n\n# [Testing methodology](#toc.xhtml#s217a)\n\
    \nWhen doing a penetration test on an iOS application, several elements are involved.\
    \ Static analysis using manual methods and tools like MobSF is one of the components.\
    \ Another element involves runtime exploitation, which entails hooking various\
    \ methods and objects to get around obstacles and obtain sensitive data. Testing\
    \ the dynamic API calls, such as login API requests and others, that the application\
    \ generates last.\n\nIn order to extract the IPA from the iOS application, we\
    \ will first run a static analysis on it using MobSF. Then, we will examine a\
    \ number of bypassing techniques, such as the Jailbreak Detection Bypass, SSL\
    \ Pinning Bypass, Local Authentication Bypass, and so on.\n\n# [Extracting the\
    \ IPA](#toc.xhtml#s218a)\n\nThere are many ways to extract the IPA file; however,\
    \ for the purposes of this essay, we will use SSH.\n\nThe steps to extract the\
    \ IPA are as follows:\n\n1.  SSH connection to your iPhone: `ssh root@ip` (Default\
    \ Password is Alpine)\n\n2.  Go to the directory listed here: `/var/containers/Bundle/Application`\n\
    \n3.  Now look for the application: `find | grep “app_name`”\n\n4.  Go to the\
    \ folder where your app is located: `cd <app_directory>`\n\n5.  Make a directory\
    \ called `Payload`: `mkdir Payload`\n\n6.  Transfer the data to the `Payload`\
    \ directory: `cp -r <appname.app>/ Payload/`\n\n7.  IPA-format the `Payload` directory\
    \ after zipping it: `zip -r /var/root/<appname>.ipa Payload/`\n\n# [Running static\
    \ analysis with MobSF](#toc.xhtml#s219a)\n\nMobSF static analysis comes after\
    \ the extraction of the IPA file. Despite the fact that you can use an install\
    \ or any other available installation technique, we will be using the MobSF docker\
    \ option.\n\n*   **MobSF**: **[https://github.com/MobSF/Mobile-Security-Framework-MobSF](https://github.com/MobSF/Mobile-Security-Framework-MobSF)**\n\
    \n*   **MobSF Documentation**: **[https://mobsf.github.io/docs/#/](https://mobsf.github.io/docs/#/)**\n\
    \nTo perform the static analysis, follow the given steps:\n\n1.  Run the MobSF\
    \ Web interface\n\n2.  Drop the IPA file and run the static analysis\n\n3.  Once\
    \ the static analysis is complete, search for configuration errors, such as: \
    \ \n\n    1.  Insecure URL schemes, as shown in *[Figure 11.8](#c11.xhtml#fig11_8)*:\
    \ \n\n        ![](images/Figure-11.8.jpg)\n\n        **Figure 11.8:** Insecure\
    \ URL schemes\n\n    2.  Insecure permissions and ATS misconfiguration, as shown\
    \ in *[Figure 11.9](#c11.xhtml#fig11_9)*: \n\n        ![](images/Figure-11.9.jpg)\n\
    \n        **Figure 11.9:** Insecure permissions\n\n    3.  Insecure binary options,\
    \ as shown in *[Figure 11.10](#c11.xhtml#fig11_10)*: \n\n        ![](images/Figure-11.10.jpg)\n\
    \n        **Figure 11.10:** Insecure binary options\n\n    4.  Firebase database,\
    \ hardcoded information, and e-mails, as shown in *[Figure 11.11](#c11.xhtml#fig11_11)*:\
    \ \n\n        ![](images/Figure-11.11.jpg)\n\n        **Figure 11.11:** Firebase\
    \ database, e-mails, and hardcoded information\n\n    5.  Other interesting files\
    \ such as Assets, Resources, Debug Info, and Native and Non-Native Libs.\n\n#\
    \ [Setting up proxy](#toc.xhtml#s220a)\n\nThe Burp Suite’s proxy configuration\
    \ method is rather easy to understand and implement. Follow the given steps:\n\
    \n1.  In the `Wi-Fi setting`, enable manual proxy and enter the proxy information,\
    \ as shown in *[Figure 11.12](#c11.xhtml#fig11_12)*: \n\n    ![](images/Figure-11.12.jpg)\n\
    \n    **Figure 11.12:** Wi-Fi setting\n\n2.  Go to `Proxy Settings` in the Burp\
    \ Suite and change the listener to `All Interfaces`, as shown in *[Figure 11.13](#c11.xhtml#fig11_13)*:\
    \ \n\n    ![](images/Figure-11.13.jpg)\n\n    **Figure 11.13:** Proxy settings\n\
    \n3.  Now, on the iPhone, open `http://burp` and download the CA certificate.\n\
    \n4.  Install the CA certificate.\n\n5.  Now, navigate to `Settings` | `General`\
    \ | `About` | `Certificate Trust Settings` and enable `Portswigger CA Certificate`,\
    \ as shown in *[Figure 11.14](#c11.xhtml#fig11_14)*: \n\n    ![](images/Figure-11.14.jpg)\n\
    \n    **Figure 11.14:** Proxy certificate\n\n# [Bypassing Jailbreak detection](#toc.xhtml#s221a)\n\
    \nFor this demonstration, we will consider a variety of choices for bypassing\
    \ Jailbreak using Frida and Objection Tools. Keep in mind that the status of the\
    \ device is Jailbroken, as shown in *[Figure 11.15](#c11.xhtml#fig11_15)*:\n\n\
    ![](images/Figure-11.15.jpg)\n\n**Figure 11.15:** Device is Jailbroken\n\n# [Using\
    \ Frida](#toc.xhtml#s222a)\n\n1.  Run the following command on your system: `frida\
    \ — codeshare rodnt/ios-jailbreak-bypass -f DVIA-v2`.\n\n2.  Go back to the application\
    \ and select `Jailbreak 1`, then note that the jailbreak detection has been disregarded,\
    \ as shown in *[Figure 11.16](#c11.xhtml#fig11_16)*: \n\n    ![](images/Figure-11.16.jpg)\n\
    \n    **Figure 11.16:** Device is not Jailbroken using Frida\n\n# [Using objection](#toc.xhtml#s223a)\n\
    \n1.  Run the following commands on your system, as shown in *[Figure 11.17](#c11.xhtml#fig11_17)*:\
    \ \n\n    `objection -g DVIA-v2 explore`\n\n    `ios jailbreak disable`\n\n  \
    \  ![](images/Figure-11.17.jpg)\n\n    **Figure 11.17:** Objection commands\n\n\
    2.  Go back to the application and select `Jailbreak 1`, then note that the jailbreak\
    \ detection has been disregarded, as shown in *[Figure 11.18](#c11.xhtml#fig11_18):*\
    \ \n\n    ![](images/Figure-11.18.jpg)\n\n    **Figure 11.18:** Device is not\
    \ Jailbroken using objection\n\nThe following list includes a variety of tools\
    \ that can be used to avoid jailbreak detection:\n\n*   **Liberty Lite**: **[https://yalujailbreak.net/liberty-lite/](https://yalujailbreak.net/liberty-lite/)**\n\
    \n*   **A-Bypass**: **[https://repo.co.kr/package/com.rpgfarm.a-bypass](https://repo.co.kr/package/com.rpgfarm.a-bypass)**\n\
    \n# [Bypassing SSL pinning](#toc.xhtml#s224a)\n\nLet us now see how we can bypass\
    \ the SSL Pinning using various methods.\n\n# [Using Objection](#toc.xhtml#s225a)\n\
    \n1.  Run the following commands on your system, as shown in *[Figure 11.19](#c11.xhtml#fig11_19)*:\
    \ \n\n    `objection -g DVIA-v2 explore`\n\n    `ios sslpinning disable`\n\n \
    \   ![](images/Figure-11.19.jpg)\n\n    **Figure 11.19:** SSLPinning disable using\
    \ objection"
  fmt: "\n## Semi-untethered Jailbreak\n\nIn that, it enables the device to start\
