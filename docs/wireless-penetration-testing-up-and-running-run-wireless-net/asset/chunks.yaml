- raw: "Scan policies are basically a set of scanning instructions. Scan policies\
    \ tell the scanner what duties to complete and how to complete them. You can choose\
    \ from several pre-configured scan policy templates or customize a complex scan.\
    \ The scanning capabilities of Nessus are divided into three categories by Tenable:\n\
    \n*   **Discovery scan**: Targets address space to report on live hosts and open\
    \ ports.\n\n*   **Vulnerability scan**: Targets endpoints to assess for known\
    \ vulnerabilities.\n\n*   **Compliance scan**: Targets endpoints to assess endpoint\
    \ configuration for compliance with a particular standard (for example, **Centre\
    \ for Internet Security (CIS) benchmarks**, **Security Technical Implementation\
    \ Guide (STIG)**, and so on).\n\nFollow the following steps to build and configure\
    \ your scan policy.\n\n1.  `Policies` can be found under the `Resources` category\
    \ in the menu on the left-hand side of the screen, as shown in *[Figure 6.15](#c06.xhtml#fig6_15)*:\
    \ \n\n    ![](images/Figure-6.15.jpg)\n\n    **Figure 6.15:** Selecting policies\
    \ from the Nessus menu\n\n2.  Choose `New Policy` from the menu in the upper right\
    \ corner of the screen, as shown in *[Figure 6.16](#c06.xhtml#fig6_16)*: \n\n\
    \    ![](images/Figure-6.16.jpg)\n\n    **Figure 6.16:** Creating a new policy\
    \ from the Nessus policies page\n\n3.  Select `Basic Network Scan` from the drop-down\
    \ menu. `Pre-configured settings` for assessing your Kali Linux server for vulnerabilities\
    \ are included in the `Basic Network Scan` option, as shown in *[Figure 6.17](#c06.xhtml#fig6_17)*:\
    \ \n\n    ![](images/Figure-6.17.jpg)\n\n    **Figure 6.17:** Selecting the basic\
    \ network scan from the Nessus policy templates page\n\n    Additional adjustable\
    \ components appear after selecting a scan policy template. For the time being,\
    \ leave each pre-configured setting in its default state, but feel free to experiment\
    \ afterwards.\n\n4.  Click the `Save` button after giving your scan policy a `Name`.\
    \ `Basic Network Vulnerability Scan Policy` is the name of the scan policy used\
    \ in this tutorial, as shown in *[Figure 6.18](#c06.xhtml#fig6_18)*: \n\n    ![](images/Figure-6.18.jpg)\n\
    \n    **Figure 6.18:** Entering the policy name and using pre-configured defaults\
    \ on the Nessus Basic Network Vulnerability scan policy page\n\nTenable requires\
    \ administrative access to run vulnerability checks (some of which will be demonstrated\
    \ in this tutorial). Executing a scan without credentials offers insight into\
    \ externally enumerable vulnerabilities, simulating the perspective of an attacker.\n\
    \n# [Configuring a Nessus vulnerability scan](#toc.xhtml#s111a)\n\nConfiguring\
    \ your scan is the next stage in the procedure. Select a scan policy and target\
    \ host as stated as follows during this part of the process.\n\n1.  From the menu\
    \ on the left-hand side of the screen, select `My Scans`, as shown in *[Figure\
    \ 6.19](#c06.xhtml#fig6_19)*: \n\n    ![](images/Figure-6.19.jpg)\n\n    **Figure\
    \ 6.19:** Selecting My Scans on the Nessus menu\n\n2.  In the upper right-hand\
    \ corner of the screen, click the `New Scan` button, as shown in *[Figure 6.20](#c06.xhtml#fig6_20):*\n\
    \n    ![](images/Figure-6.20.jpg)\n\n    **Figure 6.20:** Creating a New Scan\
    \ in Nessus\n\n3.  Select the newly created `Basic Network Vulnerability Scan`\
    \ from the `User Defined` tab, as shown in *[Figure 6.21](#c06.xhtml#fig6_21):*\
    \ \n\n    ![](images/Figure-6.21.jpg)\n\n    **Figure 6.21:** Choosing to create\
    \ a User-Defined Nessus scan\n\n4.  Choose the scan policy you set up in the previous\
    \ section. The `Basic Network Vulnerability Scan Policy` from this lesson is displayed\
    \ for selection, as shown in *[Figure 6.22](#c06.xhtml#fig6_22):*\n\n    ![](images/Figure-6.22.jpg)\n\
    \n    **Figure 6.22:** Selecting the Basic Network Vulnerability Scan Policy\n\
    \n5.  Define your goal(s). In the `Targets` text entry box, type localhost to\
    \ target your local Kali Linux host, as shown in *[Figure 6.23](#c06.xhtml#fig6_23)*:\
    \ \n\n    ![](images/Figure-6.23.jpg)\n\n    **Figure 6.23:** Defining a vulnerability\
    \ scan target\n\n    Multiple targets can be defined in a single scan by separating\
    \ them with a comma. Specifying localhost, `10.10.10.10`, for example, will target\
    \ your localhost and the `10.10.10.10` IP address.\n\n6.  Give your scan a name,\
    \ and then click the `Save` button. The name of this tutorial’s scan is `Basic\
    \ Network Vulnerability Scan`, as shown in *[Figure 6.24](#c06.xhtml#fig6_24)*:\
    \ \n\n    ![](images/Figure-6.24.jpg)\n\n    **Figure 6.24:** Saving the new Nessus\
    \ vulnerability scan\n\n# [Launching a Nessus vulnerability scan](#toc.xhtml#s112a)\n\
    \nCreate an entry in the `My Scans` section of the Nessus application after saving\
    \ your scan.\n\n1.  Click the `Play` button next to the `Basic Network Vulnerability\
    \ Scan` to begin your scan, as shown in *[Figure 6.25](#c06.xhtml#fig6_25):*\n\
    \n    ![](images/Figure-6.25.jpg)\n\n    **Figure 6.25:** Playing a Nessus vulnerability\
    \ scan\n\n2.  The scanning is shown by the rotating green arrow indicator. Be\
    \ patient as the scan takes some time to complete, as shown in *[Figure 6.26](#c06.xhtml#fig6_26):*\n\
    \n    ![](images/Figure-6.26.jpg)\n\n    **Figure 6.26:** Demonstrating that a\
    \ rotating green arrow icon indicates a running scan\n\n3.  The scan is complete\
    \ when the rotating green arrow icon turns to a green checkmark. To see the results,\
    \ simply click on the scan’s name! Refer to *[Figure 6.27](#c06.xhtml#fig6_27):*\n\
    \n    ![](images/Figure-6.27.jpg)\n\n    **Figure 6.27:** Completing a vulnerability\
    \ scan as indicated by the green checkmark\n\n    Fantastic work! You have just\
    \ completed a vulnerability scan on your Kali Linux host! On the scan summary\
    \ page, click the `Vulnerabilities` tab to see the results, as shown in *[Figure\
    \ 6.28](#c06.xhtml#fig6_28):*\n\n    ![](images/Figure-6.28.jpg)\n\n    **Figure\
    \ 6.28:** Displaying the found vulnerabilities on the scan summary page\n\n4.\
    \  Click on one of the vulnerabilities. It will provide additional information,\
    \ as shown in *[Figure 6.29](#c06.xhtml#fig6_29):*\n\n    ![](images/Figure-6.29.jpg)\n\
    \n    **Figure 6.29:** Displaying additional information on the vulnerabilities\n\
    \nThe report explains what vulnerability is and what it accomplishes. It will\
    \ offer a solution along with references to more resources. For the ordinary user,\
    \ this will provide you with all the information you need to figure out what is\
    \ causing the problem, what the risks and threats are, and how to fix them.\n\n\
    # [Generating reports](#toc.xhtml#s113a)\n\nCreating reports will help you organize\
    \ your work and provide you with a central location to analyze all your outputs\
    \ and results during your penetration test. Reports are useful because they provide\
    \ all the information in one place, eliminating the need to resort to another\
    \ document.\n\n1.  It is time to get the reports from our scan now that we have\
    \ installed and executed it. Click `Vulnerabilities`, as shown in *[Figure 6.30](#c06.xhtml#fig6_30)*:\
    \ \n\n    ![](images/Figure-6.30.jpg)\n\n    **Figure 6.30:** The vulnerabilities\n\
    \n2.  Click on `Report`, as shown in *[Figure 6.31](#c06.xhtml#fig6_31):*\n\n\
    \    ![](images/Figure-6.31.jpg)\n\n    **Figure 6.31:** Report\n\n3.  Select\
    \ the file format (PDF/HTML/CSV) and select a `Report Template`, then click on\
    \ the `Generate Report` button (this will download the file format that you have\
    \ chosen).\n\n4.  Open the file to see whether it is in a viewable and working\
    \ format, as shown in *[Figure 6.32](#c06.xhtml#fig6_32)*: \n\n    ![](images/Figure-6.32.jpg)\n\
    \n    **Figure 6.32:** Pdf report\n\nCongratulations, you have successfully generated\
    \ a vulnerability report in Nessus!\n\n# [Resolving vulnerabilities](#toc.xhtml#s114a)"
