- raw: "**Figure 10.7:** Comparison between Dalvik and ART compilation\n\n# [Native\
    \ libraries](#toc.xhtml#s167a)\n\nSome low-level components cannot be interacted\
    \ with when developing in Java. If you need to display graphics on the device\
    \ screen, for example, you will not be able to write code directly in Java; instead,\
    \ you will need to write a function or method that calls other native programs\
    \ that are not Java programs.\n\nThe native libraries in Android are non-Java\
    \ programs. The libraries are written in various languages, including C, C++,\
    \ and others. The Android **Native Development Kit** (**NDK**), which contains\
    \ a wide range of libraries and headers that allow developers to create and build\
    \ various activities, is used to install this native code.\n\n*[Figure 10.8](#c10.xhtml#fig10_8)*\
    \ depicts the many native libraries that are currently available on the Android\
    \ platform:\n\n![](images/Figure-10.8.jpg)\n\n**Figure 10.8:** Native libraries\n\
    \nIt can be customized by any **Original Equipment Manufacturer** (**OEM**). The\
    \ libraries module usually contains the following items:\n\n*   **The media framework:**\
    \ This framework is built on PacketVideo OpenCore platforms and supports common\
    \ audio, video, and still-frame formats as well as codec plugins. The StageFright\
    \ flaw was discovered by exploiting a media framework (libStageFright) flaw that\
    \ gave attackers full remote access via a feature that automatically played video\
    \ files received via MMS or other means on an Android device.\n\n*   **The surface\
    \ manager:** The display subsystem is supported, and many applications’ 2D and\
    \ 3D graphics layers are rendered.\n\n*   **Freetype:** This is used to render\
    \ bitmap and text.\n\n*   **OpenGL ES:** OpenGL is a cross-platform graphics API\
    \ that defines a software interface for 3D graphics processors.\n\n*   **Secure\
    \ Socket Layer** (**SSL**)**:** This is based on OpenSSL (**[www.openssl.org](http://www.openssl.org)**).\n\
    \n*   **SQLite:** The application framework API makes this lightweight relational\
    \ database engine available to any application.\n\n*   **WebKit:** This is a browser\
    \ engine based on the WebKit browser ([www.webkit.org](http://www.webkit.org)),\
    \ which supports page rendering, full CSS, JavaScript, DOM, and AJAX, as well\
    \ as single-column and adaptive view rendering.\n\n*   **SGL (**short for **Scalable\
    \ Graphics Library):** This is used for 2D graphics libraries.\n\n*   **libc:**\
    \ Standard C system libraries derived from BSD for embedded Linux-based devices.\n\
    \n# [The application framework](#toc.xhtml#s168a)\n\nThe application framework\
    \ gives developers the tools they need to create far more complicated apps or\
    \ tools. This framework is used to manage the application’s full development lifecycle.\n\
    \nA developer who is developing an app that requires the notification feature,\
    \ for example, does not need to write a single line of code; instead, he or she\
    \ may just call the Notification Manager API. Most of the APIs required to operate\
    \ an Android smartphone are provided by this framework.\n\nA list of the frameworks\
    \ that are now available for the Android platform is shown in *[Figure 10.9](#c10.xhtml#fig10_9)*:\n\
    \n![](images/Figure-10.9.jpg)\n\n**Figure 10.9:** Application framework\n\nThe\
    \ key services in this framework are as follows:\n\n*   **Activity manager**:\
    \ The Activity Manager manages an app’s full lifetime and is also responsible\
    \ for handling the many states of activity to ensure that apps using different\
    \ processes operate smoothly, which we will go over in depth in the next section.\n\
    \n*   **Content providers**: This component enables applications to share and\
    \ publish data with other apps. The content provider oversees encapsulating data,\
    \ defining data security, and controlling data structure. When all of a user’s\
    \ input to an app is structured and kept in an SQLite database, this is an example.\n\
    \n*   **Resource manager**: The Resource Manager manages access to all embedded\
    \ resources that are not coded in the app, such as graphics, localized strings,\
    \ and other layout files.\n\n*   **Notifications manager**: This provides mobile\
    \ user notifications and displays alerts.\n\n*   **View system**: The View System\
    \ oversees many views, event dispatching, and other important buttons and lists.\n\
    \n*   **Package manager**: This controls all the application packages that are\
    \ installed on the device.\n\n*   **Telephony manager**: This provides telephone\
    \ services, such as status and subscriber information, to the device.\n\n*   **Location\
    \ manager**: This gives location services about changes in location, allowing\
    \ an app to receive updates.\n\n*   **Window manager**: It oversees organizing\
    \ the screen that is shown to the user and providing the surface with decision-making\
    \ capabilities when the application is to be generated and layered appropriately\
    \ on the display window.\n\n# [The applications layer](#toc.xhtml#s169a)\n\nThis\
    \ is the first layer of the Android stack, and it is through applications that\
    \ the bulk of consumers interact with their phones. As shown in *[Figure 10.10](#c10.xhtml#fig10_10)*,\
    \ there are two types of applications that are generally available on the device:\n\
    \n![](images/Figure-10.10.jpg)\n\n**Figure 10.10:** Applications layer\n\nNow,\
    \ let us explore the differences.\n\n# [Native Android or system apps](#toc.xhtml#s170a)\n\
    \nSystem apps are applications that are placed on the phone by the manufacturer\
    \ and provided with it. The e-mail client, SMS program, phone, calendar, maps,\
    \ phone dialer, browser, contacts, and other applications are all loaded by default.\
    \ These apps are usually not able to be removed from the device and reside in\
    \ the `/system` folder.\n\n# [User-installed or custom apps](#toc.xhtml#s171a)\n\
    \nThe user can download and install these applications through a variety of distribution\
    \ networks, including Google Play and Amazon Store. These apps are in the Android\
    \ filesystem’s `/data/data/` subdirectory. In the next sections, we will go over\
    \ the specifics of the security features.\n\n# [Android penetration testing environment\
    \ setup](#toc.xhtml#s172a)\n\nFor any form of a security evaluation, establishing\
    \ a well-structured test environment is critical. It is recommended that you start\
    \ with a zero environment, presuming that nothing is installed on your PC. The\
    \ hardware and software requirements for establishing a basic infrastructure for\
    \ Android Application Penetration Testing are listed as follows.\n\nThis book\
    \ concentrates on setting up the environment on Windows, but you are free to experiment\
    \ with Linux and other operating systems as well.\n\n*   Hardware and OS requirements:\
    \  \n\n    *   A workstation/laptop running Windows 7 (64-bit)\n\n*   Mobile Devices\
    \ and OS requirements:  \n\n    *   Google Nexus 5 or any other device running\
    \ Android 5.0 or higher (rooted)\n\n*   Software requirements:  \n\n    *   Python\n\
    \n    *   Java Development Kit (1.8)\n\n*   Other requirements:  \n\n    *   Compatible\
    \ USB cables for mobile devices\n\n    *   Network Wi-Fi devices (one can use\
    \ any smartphone with a tethering facility to act like a Wi-Fi router)\n\nWhy\
    \ do you need a rooted phone for your test environment?\n\nIt is as basic as being\
    \ able to edit and install any tools on the device and run unsigned software from\
    \ atypical app shops. Rooted phones will have complete filesystem access. The\
    \ scope of this book does not include rooting a mobile device.\n\n# [Android Studio\
    \ and SDK](#toc.xhtml#s173a)\n\nThe official **Integrated Development Environment**\
    \ (**IDE**) for developing Android Apps is Android Studio, which Google supports.\
    \ Java was replaced by Kotlin on May 7, 2019, as a preferred language for developing\
    \ Android Apps. But still, Java is being used for developing Android Apps. Android\
    \ Studio Dolphin|2021.3.1 has the following features.\n\n*   Gradle-based build\
    \ support.\n\n*   UI components can be created by drag and drop features in the\
    \ layout editor.\n\n*   Common Android designs and components can be created by\
    \ template-based wizards."
