- raw: "EAP is required by 802.11 to deliver communications between the connecting\
    \ user and the authentication. If an attacker can place oneself between the client\
    \ and the authentication, the person connecting to the network is connected. Using\
    \ falsified EAP-Response/NAK packets, the attacker compels a wireless 802.11 device\
    \ or server to offer a lower type of authentication. Because the authentication\
    \ is so poor, the attacker can acquire access in a matter of minutes. These attacks\
    \ can be carried out using tools such as File2air and libradiate. *[Figure 2.22](#c02.xhtml#fig2_22)*\
    \ serves as an example:\n\n![](images/Figure-2.22.jpg)\n\n**Figure 2.22:** File2air\n\
    \n# [Conclusion](#toc.xhtml#s47a)\n\nSeveral potential attack methods that can\
    \ be employed over wireless were explored. Access control attacks, confidential\
    \ attacks, credential attacks, and authentication attacks. We created a complete\
    \ understanding of the user’s possible risks.\n\nWe will go through how to scan\
    \ wireless networks for information in the upcoming chapter, as well as different\
    \ wireless scanning methods and how they can be used for both good and bad.\n\n\
    # [Questions](#toc.xhtml#s48a)\n\n1.  Mention the most famous access control attacks.\n\
    \n2.  Mention the most famous of confidential attacks.\n\n3.  Mention the most\
    \ famous of credential attacks.\n\n4.  Mention the most famous of authentication\
    \ attacks.\n\n# [CHAPTER 3](#toc.xhtml#c03)\n\n# [Wireless Information Gathering\
    \ and Footprinting](#toc.xhtml#c03)\n\n# [Introduction](#toc.xhtml#s49a)\n\nWe\
    \ hope you enjoyed reading the previous chapter and found it instructive, as it\
    \ contained a wealth of information. In this chapter, we will discuss how to scan\
    \ wireless networks for information, as well as several wireless scanning technologies\
    \ and how they can be used for both good and negative purposes.\n\nYou can ask\
    \ or start wondering how difficult it is to scan for wireless networks. That is\
    \ something that everybody can do! Yes, but what if the SSID is not visible? Are\
    \ you able to find hidden wireless networks? The average user is unlikely to be\
    \ aware of the existence of concealed wireless networks.\n\nYou might also wonder\
    \ why a hidden wireless network is so necessary. You may believe that keeping\
    \ your identity hidden from others is a useful security precaution. Yes, it certainly\
    \ is! Hidden wireless networks, however, can be used for harmful and other illicit\
    \ purposes.\n\nConsider the following scenario: you are a security consultant\
    \ for a company. Some files are missing or have been modified after business hours\
    \ by a user who does not have physical access after office hours or remote access,\
    \ according to a co-worker. You check the timestamps of the updated files and\
    \ the files that were deleted after 2 a.m. and the name of the user who logged\
    \ in and performed the changes. This user now claims that they did nothing wrong.\
    \ Your co-worker tells you later that day that they witnessed the user put up\
    \ a wireless access point or router in their cubicle. You inquire with your employer\
    \ about the possibility of searching the user’s workspace due to a security concern.\
    \ After exploring the area, you discover a Wi-Fi access point installed beneath\
    \ the desk. This is clearly not a good situation! Anyone can now connect to the\
    \ company’s network and access network shares and servers from anywhere within\
    \ a wireless range.\n\n# [Structure](#toc.xhtml#s50a)\n\nIn this chapter, we will\
    \ discuss the following topics:\n\n*   Footprinting\n\n*   Wireless network discovery\n\
    \n*   Wireless scanning\n\n*   Sniffing wireless networks\n\n*   Identifying your\
    \ targets\n\n*   Protecting yourself from attacks\n\n# [Objectives](#toc.xhtml#s51a)\n\
    \nYou will learn how to scan wireless networks for information in this chapter,\
    \ as well as see two different forms of wireless scanning and how they function.\
    \ You will also learn how to use Ettercap to sniff wireless networks using ARP\
    \ poisoning and how to use dsniff to gather login details. During a wireless penetration\
    \ test, you will also be able to identify your targets. Finally, you will learn\
    \ a variety of ways to defend yourself against these attacks.\n\n# [Footprinting](#toc.xhtml#s52a)\n\
    \nFootprinting is the process of gathering information about a client’s network\
    \ to construct a profile based on the data. It is critical that the attacker obtains\
    \ information from the organization in a secure and professional manner without\
    \ disclosing any confidential information.\n\nFootprinting normally entails two\
    \ stages of reconnaissance. The first stage is to obtain data from the target\
    \ to define the network range’s scope. The following are the most used tools for\
    \ this:\n\n*   Nslookup\n\n*   Whois\n\nIn the next stage, you should collect\
    \ the following information:\n\n*   Contact names, phone numbers, and e-mail addresses\n\
    \n*   Each location and branch office\n\n*   Company security policies\n\nSending\
    \ an e-mail or calling one of the employees and undertaking a social engineering\
    \ method to determine how much information they are prepared to share would yield\
    \ even better results. Then, look at the areas where security awareness training\
    \ may be better.\n\n# [Wireless network discovery](#toc.xhtml#s53a)\n\nThe best\
    \ network applications recommended by network and security administrators will\
    \ be covered in the next section. These tools can detect rogue hardware, software\
    \ license violations, and even outages or performance concerns. The applications\
    \ we selected are diverse and dependable. Even though we will only discuss two\
    \ network discovery tools, we will provide some additional applications that we\
    \ believe will benefit you and your company.\n\n# [Nmap](#toc.xhtml#s54a)\n\n\
    **Network Mapper (Nmap)** is a well-known port scanner and network discovery tool.\
    \ It is compatible with all major operating systems. *[Figure 3.1](#c03.xhtml#fig3_1)*\
    \ serves as an example:\n\n![](images/Figure-3.1.jpg)\n\n**Figure 3.1:** Nmap\n\
    \nPlease visit **[https://nmap.org/](https://nmap.org/)** for more information\
    \ on Nmap.\n\n# [Nmap commands](#toc.xhtml#s55a)\n\nNmap has a lot of command\
    \ choices, and we might not recall all of them off the top of our heads. In the\
    \ end, it is all about knowing your commands and which ones to use in which scenarios.\
    \ As a pentester, you will need to be able to use most of these tools effectively.\
    \ The following are some examples of them:\n\n*   **Operating system and version\
    \ detection:** As illustrated in *[Figure 3.2](#c03.xhtml#fig3_2)*, these commands\
    \ will return results for the operating system and software versions: \n\n   \
    \ ![](images/Figure-3.2.jpg)\n\n    **Figure 3.2:** Nmap -A command\n\n    The\
    \ following are some commands:\n\n    *   `nmap -A 192.168.1.7`: The operating\
    \ system, service versions, and traceroute results will all be displayed with\
    \ this command.\n\n    *   `nmap -v -A 192.168.1.`7: During the scan, this command\
    \ will display more detailed information, including the operating system, service\
    \ versions, and traceroute output.\n\n    *   `nmap -O 192.168.1.7`: Only the\
    \ operating system will be displayed with this command, as shown in *[Figure 3.3](#c03.xhtml#fig3_3):*\n\
    \n        ![](images/Figure-3.3.jpg)\n\n        **Figure 3.3:** Nmap -O command\n\
    \n    *   If you use `–osscan-guess`, the scan will guess more aggressively, as\
    \ shown in *[Figure 3.4](#c03.xhtml#fig3_4):*\n\n        ![](images/Figure-3.4.jpg)\n\
    \n        **Figure 3.4:** Nmap -O -osscan-guess command\n\n    *   `nmap -A -iL\
    \ /tmp/hosts.txt`: This command will look for the operating system and service\
    \ version information, as well as do a traceroute. The text file will then be\
    \ used to input a list of hosts or networks, as shown in *[Figure 3.5](#c03.xhtml#fig3_5):*\n\
    \n        ![](images/Figure-3.5.jpg)\n\n        **Figure 3.5:** hosts.txt\n\n\
    \        Refer to *[Figure 3.6](#c03.xhtml#fig3_6)*:\n\n        ![](images/Figure-3.6.jpg)\n\
    \n        **Figure 3.6:** Nmap -A -iL command"
  fmt: "\nEAP is required by 802.11 to deliver communications between the connecting\
    \ user and the authentication. If an attacker can place oneself between the client\
    \ and the authentication, the person connecting to the network is connected. Using\
    \ falsified EAP-Response/NAK packets, the attacker compels a wireless 802.11 device\
    \ or server to offer a lower type of authentication. Because the authentication\
    \ is so poor, the attacker can acquire access in a matter of minutes. These attacks\
    \ can be carried out using tools such as `File2air` and `libradiate`. *[Figure\
    \ 2.22](#c02.xhtml#fig2_22)* serves as an example:\n\n![](images/Figure-2.22.jpg)\n\
    \n**Figure 2.22:** File2air\n\n# Conclusion\n\nSeveral potential attack methods\
    \ that can be employed over wireless were explored. Access control attacks, confidential\
    \ attacks, credential attacks, and authentication attacks. We created a complete\
    \ understanding of the user's possible risks.\n\nWe will go through how to scan\
    \ wireless networks for information in the upcoming chapter, as well as different\
    \ wireless scanning methods and how they can be used for both good and bad.\n\n\
    # Questions\n\n1.  Mention the most famous access control attacks.\n\n2.  Mention\
    \ the most famous of confidential attacks.\n\n3.  Mention the most famous of credential\
    \ attacks.\n\n4.  Mention the most famous of authentication attacks.\n\n# Chapter\
    \ 3: Wireless Information Gathering and Footprinting\n\n## Introduction\n\nWe\
    \ hope you enjoyed reading the previous chapter and found it instructive, as it\
    \ contained a wealth of information. In this chapter, we will discuss how to scan\
    \ wireless networks for information, as well as several wireless scanning technologies\
    \ and how they can be used for both good and negative purposes.\n\nYou can ask\
    \ or start wondering how difficult it is to scan for wireless networks. That is\
    \ something that everybody can do! Yes, but what if the SSID is not visible? Are\
    \ you able to find hidden wireless networks? The average user is unlikely to be\
    \ aware of the existence of concealed wireless networks.\n\nYou might also wonder\
    \ why a hidden wireless network is so necessary. You may believe that keeping\
    \ your identity hidden from others is a useful security precaution. Yes, it certainly\
    \ is! Hidden wireless networks, however, can be used for harmful and other illicit\
    \ purposes.\n\nConsider the following scenario: you are a security consultant\
    \ for a company. Some files are missing or have been modified after business hours\
    \ by a user who does not have physical access after office hours or remote access,\
    \ according to a co-worker. You check the timestamps of the updated files and\
    \ the files that were deleted after 2 a.m. and the name of the user who logged\
    \ in and performed the changes. This user now claims that they did nothing wrong.\
    \ Your co-worker tells you later that day that they witnessed the user put up\
    \ a wireless access point or router in their cubicle. You inquire with your employer\
    \ about the possibility of searching the user's workspace due to a security concern.\
    \ After exploring the area, you discover a Wi-Fi access point installed beneath\
    \ the desk. This is clearly not a good situation! Anyone can now connect to the\
    \ company's network and access network shares and servers from anywhere within\
    \ a wireless range.\n\n## Structure\n\nIn this chapter, we will discuss the following\
    \ topics:\n\n*   Footprinting\n*   Wireless network discovery\n*   Wireless scanning\n\
    *   Sniffing wireless networks\n*   Identifying your targets\n*   Protecting yourself\
    \ from attacks\n\n## Objectives\n\nYou will learn how to scan wireless networks\
    \ for information in this chapter, as well as see two different forms of wireless\
    \ scanning and how they function. You will also learn how to use `Ettercap` to\
    \ sniff wireless networks using ARP poisoning and how to use `dsniff` to gather\
    \ login details. During a wireless penetration test, you will also be able to\
    \ identify your targets. Finally, you will learn a variety of ways to defend yourself\
    \ against these attacks.\n\n## Footprinting\n\nFootprinting is the process of\
    \ gathering information about a client's network to construct a profile based\
    \ on the data. It is critical that the attacker obtains information from the organization\
    \ in a secure and professional manner without disclosing any confidential information.\n\
    \nFootprinting normally entails two stages of reconnaissance. The first stage\
    \ is to obtain data from the target to define the network range's scope. The following\
    \ are the most used tools for this:\n\n*   `Nslookup`\n*   `Whois`\n\nIn the next\
    \ stage, you should collect the following information:\n\n*   Contact names, phone\
    \ numbers, and e-mail addresses\n*   Each location and branch office\n*   Company\
    \ security policies\n\nSending an e-mail or calling one of the employees and undertaking\
    \ a social engineering method to determine how much information they are prepared\
    \ to share would yield even better results. Then, look at the areas where security\
    \ awareness training may be better.\n\n## Wireless network discovery\n\nThe best\
    \ network applications recommended by network and security administrators will\
    \ be covered in the next section. These tools can detect rogue hardware, software\
    \ license violations, and even outages or performance concerns. The applications\
    \ we selected are diverse and dependable. Even though we will only discuss two\
    \ network discovery tools, we will provide some additional applications that we\
    \ believe will benefit you and your company.\n\n## Nmap\n\n**Network Mapper (Nmap)**\
    \ is a well-known port scanner and network discovery tool. It is compatible with\
    \ all major operating systems. *[Figure 3.1](#c03.xhtml#fig3_1)* serves as an\
    \ example:\n\n![](images/Figure-3.1.jpg)\n\n**Figure 3.1:** Nmap\n\nPlease visit\
    \ **[https://nmap.org/](https://nmap.org/)** for more information on Nmap.\n\n\
    ## Nmap commands\n\nNmap has a lot of command choices, and we might not recall\
    \ all of them off the top of our heads. In the end, it is all about knowing your\
    \ commands and which ones to use in which scenarios. As a pentester, you will\
    \ need to be able to use most of these tools effectively. The following are some\
    \ examples of them:\n\n### Operating system and version detection\n\nAs illustrated\
    \ in *[Figure 3.2](#c03.xhtml#fig3_2)*, these commands will return results for\
    \ the operating system and software versions:\n\n![](images/Figure-3.2.jpg)\n\n\
    **Figure 3.2:** Nmap -A command\n\nThe following are some commands:\n\n*   `nmap\
    \ -A 192.168.1.7`: The operating system, service versions, and traceroute results\
    \ will all be displayed with this command.\n*   `nmap -v -A 192.168.1.7`: During\
    \ the scan, this command will display more detailed information, including the\
    \ operating system, service versions, and traceroute output.\n*   `nmap -O 192.168.1.7`:\
    \ Only the operating system will be displayed with this command, as shown in *[Figure\
    \ 3.3](#c03.xhtml#fig3_3):*\n\n    ![](images/Figure-3.3.jpg)\n\n    **Figure\
    \ 3.3:** Nmap -O command\n\n*   If you use `--osscan-guess`, the scan will guess\
    \ more aggressively, as shown in *[Figure 3.4](#c03.xhtml#fig3_4):*\n\n    ![](images/Figure-3.4.jpg)\n\
    \n    **Figure 3.4:** Nmap -O --osscan-guess command\n\n*   `nmap -A -iL /tmp/hosts.txt`:\
    \ This command will look for the operating system and service version information,\
    \ as well as do a traceroute. The text file will then be used to input a list\
    \ of hosts or networks, as shown in *[Figure 3.5](#c03.xhtml#fig3_5):*\n\n   \
    \ ![](images/Figure-3.5.jpg)\n\n    **Figure 3.5:** hosts.txt\n\n    Refer to\
    \ *[Figure 3.6](#c03.xhtml#fig3_6):*\n\n    ![](images/Figure-3.6.jpg)\n\n   \
    \ **Figure 3.6:** Nmap -A -iL command\n"
  trans: "\nEAP 是 802.11 标准所要求的，用于在连接用户和认证服务器之间传递通信。如果攻击者能将自己置于客户端和认证服务器之间，连接到网络的人就会被连接上（即攻击者成功劫持连接）。利用伪造的\
    \ EAP-Response/NAK 数据包，攻击者强迫无线 802.11 设备或服务器提供一种更低级别的认证方式。由于认证机制非常薄弱，攻击者可以在几分钟内获得访问权限。这些攻击可以使用\
    \ `File2air` 和 `libradiate` 等工具来实施。*图 2.22* 作为示例：\n\n![](img/Figure-2.22.jpg)\n\
    \n**图 2.22：** File2air\n\n# 结论\n\n探讨了几种可在无线网络上采用的潜在攻击方法。包括访问控制攻击、机密性攻击、凭证攻击和认证攻击。我们全面了解了用户可能面临的风险。\n\
    \n在接下来的章节中，我们将介绍如何扫描无线网络以获取信息，以及不同的无线扫描方法，并说明它们如何被用于正面或负面目的。\n\n# 问题\n\n1.  列举最著名的访问控制攻击。\n\
    \n2.  列举最著名的机密性攻击。\n\n3.  列举最著名的凭证攻击。\n\n4.  列举最著名的认证攻击。\n\n# 第 3 章：无线信息收集与足迹分析\n\
    \n## 简介\n\n希望您喜欢上一章的阅读并有所收获，因为其中包含大量信息。在本章中，我们将讨论如何扫描无线网络以获取信息，以及几种无线扫描技术，并说明它们如何被用于正面或负面目的。\n\
    \n您可能会问或开始好奇扫描无线网络有多难。这是每个人都能做到的事！是的，但如果 SSID 不可见呢？您能发现隐藏的无线网络吗？普通用户不太可能知道隐藏无线网络的存在。\n\
    \n您可能还会想知道为什么隐藏无线网络如此必要。您可能认为隐藏身份不被他人发现是一种有用的安全预防措施。是的，确实如此！然而，隐藏无线网络也可能被用于有害和其他非法目的。\n\
    \n考虑以下场景：您是一家公司的安全顾问。据同事称，一些文件在下班后失踪或被一名在非办公时间没有物理访问权限且无远程访问权限的用户修改了。您检查了更新文件的时间戳以及凌晨\
    \ 2 点后被删除的文件，还有登录并执行更改的用户名。该用户现在声称自己没有做错任何事。当天晚些时候，您的同事告诉您，他们目睹该用户在其工位上安装了一个无线接入点或路由器。您因安全顾虑向雇主询问搜查该用户工作区的可能性。在搜查该区域后，您发现在桌子下方安装了一个\
    \ Wi-Fi 接入点。这显然是个糟糕的局面！现在任何人都可以连接到公司网络，并在无线覆盖范围内的任何位置访问网络共享和服务器。\n\n## 结构\n\n\
    在本章中，我们将讨论以下主题：\n\n*   足迹分析\n*   无线网络发现\n*   无线扫描\n*   嗅探无线网络\n*   识别目标\n*   防御攻击\n\
    \n## 目标\n\n在本章中，您将学习如何扫描无线网络以获取信息，了解两种不同形式的无线扫描及其工作原理。您还将学习如何使用 `Ettercap` 通过\
    \ ARP 欺骗嗅探无线网络，以及如何使用 `dsniff` 收集登录凭据。在无线渗透测试期间，您还将能够识别目标。最后，您将学习多种防御这些攻击的方法。\n\
    \n## 足迹分析\n\n足迹分析是收集客户网络信息以基于数据构建档案的过程。至关重要的是，攻击者以安全且专业的方式从组织获取信息，且不泄露任何机密信息。\n\
    \n足迹分析通常包含两个侦察阶段。第一阶段是从目标获取数据以确定网络范围的作用域。以下是最常用的工具：\n\n*   `Nslookup`\n*   `Whois`\n\
    \n在下一阶段，您应收集以下信息：\n\n*   联系人姓名、电话号码和电子邮件地址\n*   每个分支机构的位置\n*   公司安全策略\n\n发送电子邮件或致电员工并实施社会工程学手段，以测定他们愿意共享多少信息，将获得更好的结果。然后，找出安全意识培训可以加强的领域。\n\
    \n## 无线网络发现\n\n下一节将介绍网络和安全管理员推荐的最佳网络应用程序。这些工具可以检测流氓硬件、软件许可违规，甚至中断或性能问题。我们选择的应用程序种类多样且可靠。尽管我们将只讨论两个网络发现工具，但我们还将提供一些我们认为对您和您的公司有益的额外应用程序。\n\
    \n## Nmap\n\n**网络映射器** 是一款知名的端口扫描器和网络发现工具。它兼容所有主流操作系统。 *图 3.1* 作为示例：\n\n![](img/Figure-3.1.jpg)\n\
    \n**图 3.1：** Nmap\n\n请访问 **[`nmap.org/`](https://nmap.org/)** 了解更多关于 Nmap 的信息。\n\
    \n## Nmap 命令\n\nNmap 有许多命令选项，我们可能无法凭记忆回忆起所有选项。归根结底，关键在于了解您的命令以及在何种场景下使用哪些命令。作为渗透测试人员，您需要能够有效地使用大多数这些工具。以下是一些示例：\n\
    \n### 操作系统和版本检测\n\n如 *图 3.2* 所示，这些命令将返回操作系统和软件版本的结果：\n\n![](img/Figure-3.2.jpg)\n\
    \n**图 3.2：** Nmap -A 命令\n\n以下是一些命令：\n\n*   `nmap -A 192.168.1.7`：此命令将显示操作系统、服务版本和路由追踪结果。\n\
    *   `nmap -v -A 192.168.1.7`：此命令将在扫描期间显示更详细的信息，包括操作系统、服务版本和路由追踪输出。\n*   `nmap\
    \ -O 192.168.1.7`：此命令将仅显示操作系统，如 *图 3.3* 所示：\n\n    ![](img/Figure-3.3.jpg)\n\n\
    \    **图 3.3：** Nmap -O 命令\n\n*   如果您使用 `--osscan-guess`，扫描将更积极地进行猜测，如 *图 3.4*\
    \ 所示：\n\n    ![](img/Figure-3.4.jpg)\n\n    **图 3.4：** Nmap -O --osscan-guess\
    \ 命令\n\n*   `nmap -A -iL /tmp/hosts.txt`：此命令将查找操作系统和服务版本信息，并执行路由追踪。然后将使用该文本文件输入主机或网络列表，如\
    \ *图 3.5* 所示：\n\n    ![](img/Figure-3.5.jpg)\n\n    **图 3.5：** hosts.txt\n\n \
    \   请参考 *图 3.6*：\n\n    ![](img/Figure-3.6.jpg)\n\n    **图 3.6：** Nmap -A -iL\
    \ 命令\n"
