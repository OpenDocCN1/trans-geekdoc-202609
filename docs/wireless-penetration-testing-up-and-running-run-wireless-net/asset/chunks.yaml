    \ VPN。\n*   使用密码管理器登录网站。\n\n# 中间人攻击\n\n您可能听说过“中间人”，但什么是“中间人攻击”？**中间人攻击**（**MITM**）发生在用户数据被网络拦截时。在网络上，恶意用户充当路由器，捕获所有网络流量。这涵盖电子邮件、登录凭据、聊天消息等。请参阅*[图\
    \ 8.2](#c08.xhtml#fig8_2)*：\n\n![](images/Figure-8.2.jpg)\n\n**图 8.2：** MITM 攻击\n\
    \n此演示仅旨在作为教学工具。黑客技术用于提高安全性是一项宝贵的技能。在大多数国家，未经授权在未获许可的网络上从事恶意活动属于重罪。在下一个演示中，我们将使用自己的计算机和网络。\n\
    \n1.  要开始，打开终端并输入（如*[图 8.3](#c08.xhtml#fig8_3)*所示）：\n\n    ```\n    mousepad /etc/ettercap/etter.conf\n\
    \    ```\n\n    **Ettercap 工具是具有基本可靠功能的 MITM 工具之一，内置嗅探器，支持 DNS 欺骗插件，以及支持自定义过滤器。**\n\
    \n    ![](images/Figure-8.3.jpg)\n\n    **图 8.3：** 打开 etter.conf 文件\n\n2.  打开\
    \ `etter.conf` 后，查找高亮显示的文字（如*[图 8.4](#c08.xhtml#fig8_4)*所示）：\n\n    ![](images/Figure-8.4.jpg)\n\
    \n    **图 8.4：** etter.conf 文件\n\n    您需要将高亮代码替换为*[图 8.5](#c08.xhtml#fig8_5)*所示内容：\n\
    \n    ![](images/Figure-8.5.jpg)\n\n    **图 8.5：** etter.conf 文件参数\n\n3.  点击 `Search`，然后点击\
    \ `Find`。输入 `iptables` 并点击 `Find` 按钮（如*[图 8.6](#c08.xhtml#fig8_6)*所示）：\n\n   \
    \ ![](images/Figure-8.6.jpg)\n\n    **图 8.6：** iptables 搜索\n\n    结果应如*[图 8.7](#c08.xhtml#fig8_7)*所示：\n\
    \n    ![](images/Figure-8.7.jpg)\n\n    **图 8.7：** iptables 搜索结果\n\n    您需要取消注释两行，使其如*[图\
    \ 8.8](#c08.xhtml#fig8_8)*所示：\n\n    ![](images/Figure-8.8.jpg)\n\n    **图 8.8：**\
    \ iptables 取消注释命令\n\n4.  点击 `Search`，然后点击 `Find`。输入 `ip6tables` 并点击 `Find` 按钮（如*[图\
    \ 8.9](#c08.xhtml#fig8_9)*所示）：\n\n    ![](images/Figure-8.9.jpg)\n\n    **图 8.9：**\
    \ ip6tables 搜索\n\n    结果应如*[图 8.10](#c08.xhtml#fig8_10)*所示：\n\n    ![](images/Figure-8.10.jpg)\n\
    \n    **图 8.10：** ip6tables 搜索结果\n\n    您需要取消注释两行，使其如*[图 8.11](#c08.xhtml#fig8_11)*所示：\n\
    \n    ![](images/Figure-8.11.jpg)\n\n    **图 8.11：** ip6tables 取消注释命令\n\n5.  通过打开终端并输入\
    \ `ettercap –G` 启动 `Ettercap-gtk`（如*[图 8.12](#c08.xhtml#fig8_12)*所示）：\n\n    ![](images/Figure-8.12.jpg)\n\
    \n    **图 8.12：** Ettercap GUI\n\n6.  `Ettercap` 打开后，选择 `Sniffing at startup`\
    \ 并选择 `Primary Interface` `eth0`，然后按 `Accept` 启动 Ettercap（如*[图 8.13](#c08.xhtml#fig8_13)*所示）：\n\
    \n    ![](images/Figure-8.13.jpg)\n\n    **图 8.13：** Ettercap 选择主接口\n\n7.  点击\
    \ `Hosts`，然后选择 `Scan for hosts`（如*[图 8.14](#c08.xhtml#fig8_14)*所示）：\n\n    ![](images/Figure-8.14.jpg)\n\
    \n    **图 8.14：** 扫描主机\n\n8.  在命令框中，您应该会看到 `hosts added to the host list`。点击 `Hosts`，然后选择\
    \ `Hosts List`（如*[图 8.15](#c08.xhtml#fig8_15)*所示）：\n\n    ![](images/Figure-8.15.jpg)\n\
    \n    **图 8.15：** 主机列表\n\n9.  选择路由器的 IP 地址，然后点击 `Add to Target 1` 按钮（如*[图 8.16](#c08.xhtml#fig8_16)*所示）：\n\
    \n    ![](images/Figure-8.16.jpg)\n\n    **图 8.16：** 路由器 IP 添加到 Target 1\n\n10.\
    \ 选择受害者的 IP 地址，然后点击 `Add to Target 2` 按钮（如*[图 8.17](#c08.xhtml#fig8_17)*所示）：\n\
    \n     ![](images/Figure-8.17.jpg)\n\n     **图 8.17：** 受害者 IP 添加到 Target 2\n\n\
    11. 点击 `Mitm` 菜单，然后选择 `Arp poisoning`（如*[图 8.18](#c08.xhtml#fig8_18)*所示）：\n\n\
    \     ![](images/Figure-8.18.jpg)\n\n     **图 8.18：** Mitm ARP 欺骗\n\n12. 收到提示时，勾选\
    \ `Sniff remote connections` 旁边的复选框，然后点击 `OK`（如*[图 8.19](#c08.xhtml#fig8_19)*所示）：\n\
    \n     ![](images/Figure-8.19.jpg)\n\n     **图 8.19：** 嗅探远程连接\n\n13. 现在，打开 `Wireshark`\
    \ 以嗅探受害者流量。然后选择接口 `eth0`（如*[图 8.20](#c08.xhtml#fig8_20)*所示）：\n\n     ![](images/Figure-8.20.jpg)\n\
    \n     **图 8.20：** Wireshark\n\n14. 在 Wireshark 程序中选择 `eth0` 接口并使用 `http` 过滤器（如*[图\
    \ 8.21](#c08.xhtml#fig8_21)*所示）：\n\n     ![](images/Figure-8.21.jpg)\n\n     **图\
    \ 8.21：** Wireshark HTTP 过滤器\n\n15. 在受害者机器上，打开浏览器并输入以下 URL：`http://testphp.vulnweb.com/login.php`（如*[图\
    \ 8.22](#c08.xhtml#fig8_22)*所示）：\n\n     ![](images/Figure-8.22.jpg)\n\n     **图\
    \ 8.22：** testphp.vulnweb.com 网站\n\n     输入用户名 `test` 和密码 `test`。\n\n16. 在 Wireshark\
    \ 中检查受害者流量（如*[图 8.23](#c08.xhtml#fig8_23)*所示）：\n\n     ![](images/Figure-8.23.jpg)\n\
    \n     **图 8.23：** 嗅探受害者流量\n\n在本例中我们使用了 HTTP 协议，但在现实世界中，HTTPS 协议用于保护通信安全。在这种情况下，作为攻击者，您会怎么做？攻击者将应用\
    \ **SSLStrip** 概念（如*[图 8.24](#c08.xhtml#fig8_24)*所示），**SSLStrip** 是一种 MITM 攻击，强制用户使用\
    \ HTTP 协议而非 HTTPS 进行通信，从而使攻击者能以明文形式查看所有 SSL 流量。**HTTP 严格传输安全（HSTS）** 是一种安全防护机制，可保护您免受此类威胁：\n\
    \n![](images/Figure-8.24.jpg)\n\n**图 8.24：** SSLStrip 概念\n\n要使用 SSLStrip 概念，我们将在\
    \ Ettercap 程序中激活 SSLStrip 插件。在菜单栏上，点击 `Plugins`，然后 `Manage the plugins`，再双击 `sslstrip`\
    \ 插件。激活后左侧会出现 `*` 标记（如*[图 8.25](#c08.xhtml#fig8_25)*所示）：\n\n![](images/Figure-8.25.jpg)\n\
    \n**图 8.25：** SSLStrip 插件\n\n恭喜！您已成功实施完整的 MITM 攻击。\n\n要停止攻击，请选择 `Stop sniffing`（如*[图\
    \ 8.26](#c08.xhtml#fig8_26)*所示）：\n\n![](images/Figure-8.26.jpg)\n\n**图 8.26：**\
    \ 停止嗅探\n\n攻击终止后，Ettercap 将发送 ARP 数据包，网络将在几分钟内恢复正常。使用 ARP 检测工具（如 XArp 或 Snort）可防范此类攻击。分配静态\
    \ ARP 条目也有助于防止攻击。这会告知攻击者路由器的 MAC 地址是固定且不可修改的，因此攻击者发送的所有 ARP 数据包都将被忽略。\n\n# Metasploit\n\
    \n对于渗透测试人员和 IDS 开发人员，Metasploit 是最知名的开源工具。Metasploit 框架是一个安全漏洞利用和脚本数据库。它是编写和在目标系统上运行漏洞利用代码的最广泛使用的开源工具之一。\n"
