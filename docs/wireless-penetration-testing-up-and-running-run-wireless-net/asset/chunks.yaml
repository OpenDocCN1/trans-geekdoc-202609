- raw: "In other circumstances, we may want to disconnect the devices, in which case\
    \ the ADB server must be restarted. This can be accomplished with the `ADB kill-server`\
    \ command, which will kill the ADB connection and restart it when you provide\
    \ a new ADB command.\n\n# [Viewing the log information](#toc.xhtml#s183a)\n\n\
    Through logcat, Android provides a good view of system debugging messages; use\
    \ the **A**`DB logcat` command, as seen in *[Figure 10.27](#c10.xhtml#fig10_27)*.\
    \ Examine the many types of logs that programs and systems collect in various\
    \ buffers. This feature has the potential to be a source of data leakage during\
    \ the assessment:\n\n![](images/Figure-10.27.jpg)\n\n**Figure 10.27:** ADB logcat\
    \ command\n\nAll the logs begin with several message kinds, which can be summarized\
    \ as follows:\n\n*   `V`: Verbose\n\n*   `D`: Debug\n\n*   `I`: Information\n\n\
    *   `W`: Warning\n\n*   `E`: Error\n\n*   `F`: Fatal\n\n*   `S`: Silent\n\n# [Sideloading\
    \ apps](#toc.xhtml#s184a)\n\n*Sideloading* typically means installing an application\
    \ package in APK format onto an Android device. Such packages are usually downloaded\
    \ from websites other than the official app store Google Play. Installing a custom\
    \ ROM on an Android smartphone is possible, and ADB allows you to sideload the\
    \ software. Running `ADB sideload package.zip`, which is equivalent to `ADB push`\
    \ and `install`, will accomplish this.\n\n# Monkeyrunner\n\nMonkeyrunner is an\
    \ Android SDK utility that allows developers to create or use pre-existing apps\
    \ to control a connected device emulator.\n\nIf you run `ADB shell monkey 2`,\
    \ for example, it will inject the event ID 2 and launch the application without\
    \ a user interface. Refer to *[Figure 10.28](#c10.xhtml#fig10_28):*\n\n![](images/Figure-10.28.jpg)\n\
    \n**Figure 10.28:** ADB shell monkey command\n\n# [Genymotion](#toc.xhtml#s185a)\n\
    \nGenymotion is a replacement for the **Android Virtual Device** (**AVD**) manager\
    \ included with the Android SDK. This will be used throughout the Android assessment\
    \ section of this book. Genymotion is only available for download after you create\
    \ an account in their cloud and follow the steps at **[https://www.genymotion.com/#!/download](https://www.genymotion.com/#!/download)**.\
    \ There are two different kinds of licenses:\n\n1.  **Personal use**: The possibilities\
    \ for running an emulation in this version of Genymotion are restricted.\n\n2.\
    \  **Commercial use:** This version of Genymotion gives developers added features,\
    \ including network debugging, design simulation, and automation.\n\nGenymotion\
    \ is preferred by testers and developers as an emulator due to its superior performance\
    \ when compared to the Android SDK’s emulators (even with Intel Hardware Accelerated\
    \ Execution Manager enabled). This is not, however, a replacement for the Android\
    \ SDK’s AVD.\n\nStep-by-step instructions for installing Genymotion are provided\
    \ as follows:\n\n1.  Double-click the program when it has been downloaded, and\
    \ a window wizard will appear, as seen in *[Figure 10.29](#c10.xhtml#fig10_29)*:\
    \ \n\n    ![](images/Figure-10.29.jpg)\n\n    **Figure 10.29:** Genymotion installation\\\
    _1\n\n2.  By selecting Next, we will be sent to the next *[Figure 10.30](#c10.xhtml#fig10_30)*,\
    \ where we will be able to choose the folder in which we want to install this\
    \ application. All the apps will be installed in the `C:/` drive in our scenario.\
    \ Refer to *[Figure 10.30](#c10.xhtml#fig10_30):*\n\n    ![](images/Figure-10.30.jpg)\n\
    \n    **Figure 10.30:** Genymotion installation\\_2\n\n3.  The installation begins\
    \ after confirmation, as demonstrated in *[Figure 10.31](#c10.xhtml#fig10_31)*:\
    \ \n\n    ![](images/Figure-10.31.jpg)\n\n    **Figure 10.31:** Genymotion installation\\\
    _3\n\n4.  Genymotion uses Oracle VirtualBox to execute the emulator, so the system\
    \ image stays in the virtual box even if the frontend software, that is, Genymotion,\
    \ is uninstalled. If you did not download Genymotion with VirtualBox, *[Figure\
    \ 10.32](#c10.xhtml#fig10_32)* will not work for you: \n\n    ![](images/Figure-10.32.jpg)\n\
    \n    **Figure 10.32:** Genymotion installation\\_4\n\n5.  As shown in *[Figure\
    \ 10.33](#c10.xhtml#fig10_33)*, our downloaded Genymotion file includes the package\
    \ of a pre-compiled version of Oracle Virtual Box: \n\n    ![](images/Figure-10.33.jpg)\n\
    \n    **Figure 10.33:** Oracle virtual box installation\n\n6.  Clicking `Next`\
    \ will force you to install VirtualBox, which will take up some space.\n\n7. \
    \ Once Oracle VirtualBox is installed, Genymotion is installed as well, and we\
    \ are ready to construct our first Android virtual image. Refer to *[Figure 10.34](#c10.xhtml#fig10_34)*:\
    \ \n\n    ![](images/Figure-10.34.jpg)\n\n    **Figure 10.34:** Genymotion installation\\\
    _5\n\n# [Creating an Android virtual emulator](#toc.xhtml#s186a)\n\nNow that we\
    \ have got Genymotion and Oracle VirtualBox set up, we will go ahead and make\
    \ a new Android Virtual Emulator, which we will use to run a variety of tests.\
    \ The steps to set up an emulator in Genymotion are as follows:\n\n1.  When you\
    \ first run Genymotion, you will see a popup for the usage notice, followed by\
    \ an alert to build a virtual device, as shown in *[Figure 10.35](#c10.xhtml#fig10_35)*:\
    \ \n\n    ![](images/Figure-10.35.jpg)\n\n    **Figure 10.35:** Genymotion\n\n\
    2.  By selecting `Yes`, the next choice will direct us to our Genymotion Cloud\
    \ account, as shown in *[Figure 10.36](#c10.xhtml#fig10_36)*: \n\n    ![](images/Figure-10.36.jpg)\n\
    \n    **Figure 10.36:** Genymotion cloud account\n\n3.  After logging in, we can\
    \ examine all the available Android photos and then click `Next`.\n\n4.  By selecting\
    \ `Following`, we will proceed to the next step, where we will enter the name\
    \ of the emulator we will create. We will call it Google Nexus—Penetration Testing\
    \ Device in this case, as shown in *[Figure 10.37](#c10.xhtml#fig10_37)*: \n\n\
    \    ![](images/Figure-10.37.jpg)\n\n    **Figure 10.37:** Genymotion Google Nexus\
    \ Device\n\n5.  Because Genymotion uses hardware-based acceleration, we may need\
    \ to configure several processors during the installation process. As demonstrated\
    \ in the following *[Figure 10.38](#c10.xhtml#fig10_38)*, we are using one processor\
    \ for the basic setup: \n\n    ![](images/Figure-10.38.jpg)\n\n    **Figure 10.38:**\
    \ Genymotion device settings\n\n6.  We are ready to use the device now that we\
    \ have finished setting up the first Android virtual emulator by pressing `Start`.\n\
    \n7.  Finally, our virtual device should be visible, as shown in *[Figure 10.39](#c10.xhtml#fig10_39)*:\
    \ \n\n    ![](images/Figure-10.39.jpg)\n\n    **Figure 10.39:** Genymotion device\
    \ start\n\nAn ADB devices command can be used to confirm this, as shown in *[Figure\
    \ 10.40](#c10.xhtml#fig10_40)*:\n\n![](images/Figure-10.40.jpg)\n\n**Figure 10.40:**\
    \ ADB devices command\n\nIn some circumstances, as demonstrated in *[Figure 10.41](#c10.xhtml#fig10_41)*,\
    \ we may receive the trigger for an error message, which can be resolved by enabling\
    \ Intel Virtualization Technology, or Intel VT-x, in the BIOS:\n\n![](images/Figure-10.41.jpg)\n\
    \n**Figure 10.41:** Virtualization technology message\n\n# [Installing an application\
    \ to the Genymotion emulator](#toc.xhtml#s187a)\n\nInstalling an application to\
    \ the emulator can be done in one of two ways: either by downloading it or by\
    \ using ADB to install one made by developers: `ADB install appname.apk`.\n\n\
    You can also drag and drop an APK file directly into the emulator, as illustrated\
    \ in *[Figure 10.42](#c10.xhtml#fig10_42)*:\n\n![](images/Figure-10.42.jpg)\n\n\
    **Figure 10.42:** Drag and drop APK file\n\n# [Installing the Genymotion plugin\
    \ to Android Studio](#toc.xhtml#s188a)\n\nIf the app developers are writing the\
    \ code in Android Studio and are unable to immediately test their apps using the\
    \ Android emulator, it is really challenging. Instead, users wind up installing\
    \ the software after signing it in each time.\n\nThe following actions must be\
    \ taken to enable Genymotion VMs in Android Studio:\n\n1.  Navigate to `Android\
    \ Studio`. Go to `Settings` and select `Plugins`."
