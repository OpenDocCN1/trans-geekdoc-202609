- raw: "*   **Service scan:** These commands will display information about the host’s\
    \ services and ports, as well as whether the host or network is protected by a\
    \ firewall. *[Figure 3.7](#c03.xhtml#fig3_7)* shows this: \n\n    ![](images/Figure-3.7.jpg)\n\
    \n    **Figure 3.7:** Nmap -sV command\n\n    The following are some commands:\n\
    \n    *   `nmap -sV 192.168.1.7`: This command will look for open ports to see\
    \ what services and versions are currently available.\n\n    *   `nmap -sA 192.168.1.7`:\
    \ This command is used to do a policy scan on the firewall. It will show whether\
    \ the firewall is simply a packet filter that is blocking SYN packets. It sends\
    \ an ACK packet to the destination; if it receives a response, it is open; if\
    \ it does not receive a response, it is running a packet filter, as shown in *[Figure\
    \ 3.8](#c03.xhtml#fig3_8):*\n\n        ![](images/Figure-3.8.jpg)\n\n        **Figure\
    \ 3.8:** Nmap -sA command\n\n*   **Bypassing firewall filters**: This command\
    \ can be used to scan a firewall-protected host or network. This command is also\
    \ affected by the firewall filters in use. *[Figure 3.9](#c03.xhtml#fig3_9)* demonstrates\
    \ the technique: \n\n    ![](images/Figure-3.9.jpg)\n\n    **Figure 3.9:** Nmap\
    \ -PN command\n\n    The following are some commands:\n\n    *   `nmap -PN 192.168.1.7`:\
    \ The host will be scanned as though it were online with this command. If you\
    \ cannot access a host using ping or scan, this can be useful.\n\n    *   `nmap\
    \ -PS 192.168.1.7`: This command does a TCP SYN discovery scan on the specified\
    \ ports.\n\n    *   `nmap -PA 192.168.1.7`: This command will do an ACK discovery\
    \ scan against the specified ports.\n\n*   **Scanning for firewall vulnerabilities:**\
    \ These commands will look for typical firewall exploits that rely on a flaw in\
    \ the TCP network protocol being discovered, as shown in *[Figure 3.10](#c03.xhtml#fig3_10)*:\
    \ \n\n    ![](images/Figure-3.10.jpg)\n\n    **Figure 3.10:** Nmap -sN command\n\
    \n    The following are some commands:\n\n    *   `nmap -sN 192.168.1.7`: This\
    \ is a null scan command. Because the null scan sets no bits, it can be used to\
    \ get around a non-stateful firewall and packet filter.\n\n    *   `nmap -sF 192.168.1.7`:\
    \ This is a FIN scan command. Only the TCP FIN bit will be set by the FIN scan.\
    \ When a FIN packet is sent to an open port, the open port simply ignores it,\
    \ whereas the closed port is redirected to an RST packet, which, in turn, reveals\
    \ which ports are open and closed in Nmap.\n\n    *   `nmap -sX 192.168.1.7`:\
    \ This is an Xmus scan command. The Xmus scan can be used to see if a target machine’s\
    \ ports are open or closed. This scan transmits TCP segments with all the packet\
    \ header flags.\n\n*   **Packet fragments:** To make it more difficult for packet\
    \ filters, intrusion detection systems, and firewalls to identify your scan, this\
    \ command separates the TCP header into many packets. If you want to execute a\
    \ stealth scan on a network without raising a flag, you will need these commands.\
    \ As an example, consider *[Figure 3.11](#c03.xhtml#fig3_11)*:  \n\n    *   `Nmap\
    \ -sS -p 80 -f 192.168.1.7`: This command does a TCP SYN scan on `192.168.1.7`\
    \ port `80` without triggering any intrusion detection systems or alarms. Please\
    \ keep in mind that the setup and policies of the firewall or IDS also play a\
    \ role. \n\n        ![](images/Figure-3.11.jpg)\n\n        **Figure 3.11:** Packet\
    \ fragment command\n\n*   **Firewall decoys**: You can use this command to spoof\
    \ a host to a remote host. An IDS and network administration will be completely\
    \ ignorant that a network scan is taking place if the spoofing is done correctly.\
    \ A sample command is as follows:  \n\n    *   `Nmap -n 192.168.1.7 -D 192.168.1.110`:\
    \ This command scans a host without issuing a DNS request, and it also includes\
    \ a decoy set for `192.168.1.110`, which makes it appear as if the scan is being\
    \ conducted by `192.168.1.110` rather than the Kali Linux host. Refer to *[Figure\
    \ 3.12](#c03.xhtml#fig3_12):* \n\n        ![](images/Figure-3.12.jpg)\n\n    \
    \    **Figure 3.12:** Firewall decoys command\n\n# [Zenmap](#toc.xhtml#s56a)\n\
    \n**Zenmap** is a graphical frontend for Nmap that runs on multiple platforms.\
    \ It simplifies the use of Nmap and includes prepared instructions for running\
    \ scans on the fly.\n\nRefer to *[Figure 3.13](#c03.xhtml#fig3_13):*\n\n![](images/Figure-3.13.jpg)\n\
    \n**Figure 3.13:** Zenmap  \n\nPlease visit **[https://nmap.org/zenmap/](https://nmap.org/zenmap/)**\
    \ for more information on Zenmap.\n\n# [Wireless scanning](#toc.xhtml#s57a)\n\n\
    Wireless access points are always looking for more wireless access points to connect.\
    \ 802.11 radios operate at frequencies ranging from 2.4 to 5.85 GHz. **Passive**\
    \ and **active** scanning are the only two approaches available. 802.11 radios,\
    \ by default, execute both scans on all channels authorized by the country’s operating\
    \ laws.\n\nThe penalty for operating without an FCC permit or license could result\
    \ in a significant fee even for a single day of operation. You might wonder who\
    \ the FCC is. The **Federal Communications Commission** (**FCC**) oversees overseeing\
    \ and regulating the US telecommunications industry, which includes the internet.\
    \ Why might this be a cause for concern? The purpose of the internet is for everyone\
    \ to have access to it without discrimination, blocking, censorship, or network\
    \ throttling. To recapitulate, the FCC is proposing new internet laws and contracts\
    \ that will allow internet service providers to charge a premium or sell a *paid-to-use*\
    \ service that will slow down your internet if you do not have the extra cash.\
    \ Before doing any local broadcasts or scans, please consult your country’s wireless\
    \ communication team.\n\n# [Passive scanning](#toc.xhtml#s58a)\n\nDuring a **passive\
    \ scan**, beacons and probe responses are monitored. The client’s radio transmits\
    \ a once-per-second scan and then audits the packets on the wireless network.\
    \ Because passive scans are used to connect clients to access points, they are\
    \ always enabled.\n\n# [Active scanning](#toc.xhtml#s59a)\n\nOnly channels that\
    \ are approved by government rules are actively scanned. **Active scanning** is\
    \ enabled by default; however, it can be removed from the profile or settings\
    \ of the wireless adapter. During an active scan, the radio sends probe requests\
    \ to other devices in the area with a null SSID name to encourage probe answers.\
    \ In other words, access points actively seek out and listen to other devices,\
    \ as shown in *[Figure 3.14](#c03.xhtml#fig3_14):*\n\n![](images/Figure-3.14.jpg)\n\
    \n**Figure 3.14:** Active scanning\n\n# [How does scanning work?](#toc.xhtml#s60a)\n\
    \nThe access point must change channels to scan outside the range of operation.\
    \ These wireless RF channel scans from the access point occur once every second\
    \ and at various channel ranges until all the channels have been cycled through,\
    \ as shown in *[Figure 3.15](#c03.xhtml#fig3_15)*:\n\n![](images/Figure-3.15.jpg)\n\
    \n**Figure 3.15:** RF channels\n\nAfter roughly 25–30 milliseconds, the wireless\
    \ access point will quit the RF channel. Scans are timed to avoid interfering\
    \ with the transmissions of other beacons. After the channel shift is complete,\
    \ the probes are dispatched. Keep in mind that if speech, video, or other significant\
    \ data usage is detected, the scan frequency will be lowered.\n\n# [Sniffing wireless\
    \ networks](#toc.xhtml#s61a)\n\nCan we really smell wireless networks? Sounds\
    \ funny, right? No, but with the correct tools and equipment, you can! Wireless\
    \ sniffing is an eavesdropping technique used on a wireless network by programs\
    \ or tools. Wireless, which stumbles around networks, is less intrusive than sniffing.\
    \ Wireless sniffing is used to diagnose network problems and protocols on a wireless\
    \ network.\n\nConnections, both wireless and wired, can be monitored and sniffed.\
    \ Because wireless networks communicate via radio signals, sniffing them is significantly\
    \ easier. An attacker could sit in a car outside a business and sniff a wireless\
    \ network for sensitive information that he or she could use for personal advantage,\
    \ attention, or money."
  fmt: "\n# Service scan\n\nThese commands will display information about the host’s\
    \ services and ports, as well as whether the host or network is protected by a\
    \ firewall. [Figure 3.7](#c03.xhtml#fig3_7) shows this:\n\n![](images/Figure-3.7.jpg)\n\
    \n**Figure 3.7:** Nmap -sV command\n\nThe following are some commands:\n\n*  \
    \ `nmap -sV 192.168.1.7`: This command will look for open ports to see what services\
    \ and versions are currently available.\n*   `nmap -sA 192.168.1.7`: This command\
    \ is used to do a policy scan on the firewall. It will show whether the firewall\
    \ is simply a packet filter that is blocking SYN packets. It sends an ACK packet\
    \ to the destination; if it receives a response, it is open; if it does not receive\
    \ a response, it is running a packet filter, as shown in [Figure 3.8](#c03.xhtml#fig3_8):\n\
    \n    ![](images/Figure-3.8.jpg)\n\n    **Figure 3.8:** Nmap -sA command\n\n#\
    \ Bypassing firewall filters\n\nThis command can be used to scan a firewall-protected\
    \ host or network. This command is also affected by the firewall filters in use.\
    \ [Figure 3.9](#c03.xhtml#fig3_9) demonstrates the technique:\n\n![](images/Figure-3.9.jpg)\n\
    \n**Figure 3.9:** Nmap -PN command\n\nThe following are some commands:\n\n*  \
    \ `nmap -PN 192.168.1.7`: The host will be scanned as though it were online with\
    \ this command. If you cannot access a host using ping or scan, this can be useful.\n\
    *   `nmap -PS 192.168.1.7`: This command does a TCP SYN discovery scan on the\
    \ specified ports.\n*   `nmap -PA 192.168.1.7`: This command will do an ACK discovery\
    \ scan against the specified ports.\n\n# Scanning for firewall vulnerabilities\n\
    \nThese commands will look for typical firewall exploits that rely on a flaw in\
    \ the TCP network protocol being discovered, as shown in [Figure 3.10](#c03.xhtml#fig3_10):\n\
    \n![](images/Figure-3.10.jpg)\n\n**Figure 3.10:** Nmap -sN command\n\nThe following\
    \ are some commands:\n\n*   `nmap -sN 192.168.1.7`: This is a null scan command.\
    \ Because the null scan sets no bits, it can be used to get around a non-stateful\
    \ firewall and packet filter.\n*   `nmap -sF 192.168.1.7`: This is a FIN scan\
    \ command. Only the TCP FIN bit will be set by the FIN scan. When a FIN packet\
    \ is sent to an open port, the open port simply ignores it, whereas the closed\
    \ port is redirected to an RST packet, which, in turn, reveals which ports are\
    \ open and closed in Nmap.\n*   `nmap -sX 192.168.1.7`: This is an Xmus scan command.\
    \ The Xmus scan can be used to see if a target machine’s ports are open or closed.\
    \ This scan transmits TCP segments with all the packet header flags.\n\n# Packet\
    \ fragments\n\nTo make it more difficult for packet filters, intrusion detection\
    \ systems, and firewalls to identify your scan, this command separates the TCP\
    \ header into many packets. If you want to execute a stealth scan on a network\
    \ without raising a flag, you will need these commands. As an example, consider\
    \ [Figure 3.11](#c03.xhtml#fig3_11):\n\n*   `Nmap -sS -p 80 -f 192.168.1.7`: This\
    \ command does a TCP SYN scan on `192.168.1.7` port `80` without triggering any\
    \ intrusion detection systems or alarms. Please keep in mind that the setup and\
    \ policies of the firewall or IDS also play a role.\n\n    ![](images/Figure-3.11.jpg)\n\
    \n    **Figure 3.11:** Packet fragment command\n\n# Firewall decoys\n\nYou can\
    \ use this command to spoof a host to a remote host. An IDS and network administration\
    \ will be completely ignorant that a network scan is taking place if the spoofing\
    \ is done correctly. A sample command is as follows:\n\n*   `Nmap -n 192.168.1.7\
    \ -D 192.168.1.110`: This command scans a host without issuing a DNS request,\
    \ and it also includes a decoy set for `192.168.1.110`, which makes it appear\
    \ as if the scan is being conducted by `192.168.1.110` rather than the Kali Linux\
    \ host. Refer to [Figure 3.12](#c03.xhtml#fig3_12):\n\n    ![](images/Figure-3.12.jpg)\n\
    \n    **Figure 3.12:** Firewall decoys command\n\n# Zenmap\n\n**Zenmap** is a\
    \ graphical frontend for Nmap that runs on multiple platforms. It simplifies the\
    \ use of Nmap and includes prepared instructions for running scans on the fly.\n\
    \nRefer to [Figure 3.13](#c03.xhtml#fig3_13):\n\n![](images/Figure-3.13.jpg)\n\
    \n**Figure 3.13:** Zenmap\n\nPlease visit **[https://nmap.org/zenmap/](https://nmap.org/zenmap/)**\
    \ for more information on Zenmap.\n\n# Wireless scanning\n\nWireless access points\
    \ are always looking for more wireless access points to connect. 802.11 radios\
    \ operate at frequencies ranging from 2.4 to 5.85 GHz. **Passive** and **active**\
    \ scanning are the only two approaches available. 802.11 radios, by default, execute\
    \ both scans on all channels authorized by the country’s operating laws.\n\nThe\
    \ penalty for operating without an FCC permit or license could result in a significant\
    \ fee even for a single day of operation. You might wonder who the FCC is. The\
    \ **Federal Communications Commission** (**FCC**) oversees overseeing and regulating\
    \ the US telecommunications industry, which includes the internet. Why might this\
    \ be a cause for concern? The purpose of the internet is for everyone to have\
    \ access to it without discrimination, blocking, censorship, or network throttling.\
    \ To recapitulate, the FCC is proposing new internet laws and contracts that will\
    \ allow internet service providers to charge a premium or sell a *paid-to-use*\
    \ service that will slow down your internet if you do not have the extra cash.\
    \ Before doing any local broadcasts or scans, please consult your country’s wireless\
    \ communication team.\n\n# Passive scanning\n\nDuring a **passive scan**, beacons\
    \ and probe responses are monitored. The client’s radio transmits a once-per-second\
    \ scan and then audits the packets on the wireless network. Because passive scans\
    \ are used to connect clients to access points, they are always enabled.\n\n#\
    \ Active scanning\n\nOnly channels that are approved by government rules are actively\
    \ scanned. **Active scanning** is enabled by default; however, it can be removed\
    \ from the profile or settings of the wireless adapter. During an active scan,\
    \ the radio sends probe requests to other devices in the area with a null SSID\
    \ name to encourage probe answers. In other words, access points actively seek\
    \ out and listen to other devices, as shown in [Figure 3.14](#c03.xhtml#fig3_14):\n\
    \n![](images/Figure-3.14.jpg)\n\n**Figure 3.14:** Active scanning\n\n# How does\
    \ scanning work?\n\nThe access point must change channels to scan outside the\
    \ range of operation. These wireless RF channel scans from the access point occur\
    \ once every second and at various channel ranges until all the channels have\
    \ been cycled through, as shown in [Figure 3.15](#c03.xhtml#fig3_15):\n\n![](images/Figure-3.15.jpg)\n\
    \n**Figure 3.15:** RF channels\n\nAfter roughly 25–30 milliseconds, the wireless\
    \ access point will quit the RF channel. Scans are timed to avoid interfering\
    \ with the transmissions of other beacons. After the channel shift is complete,\
    \ the probes are dispatched. Keep in mind that if speech, video, or other significant\
    \ data usage is detected, the scan frequency will be lowered.\n\n# Sniffing wireless\
    \ networks\n\nCan we really smell wireless networks? Sounds funny, right? No,\
    \ but with the correct tools and equipment, you can! Wireless sniffing is an eavesdropping\
    \ technique used on a wireless network by programs or tools. Wireless, which stumbles\
    \ around networks, is less intrusive than sniffing. Wireless sniffing is used\
    \ to diagnose network problems and protocols on a wireless network.\n\nConnections,\
    \ both wireless and wired, can be monitored and sniffed. Because wireless networks\
    \ communicate via radio signals, sniffing them is significantly easier. An attacker\
    \ could sit in a car outside a business and sniff a wireless network for sensitive\
    \ information that he or she could use for personal advantage, attention, or money.\n"
  trans: "\n# 服务扫描\n\n这些命令将显示有关主机服务和端口的信息，以及主机或网络是否受防火墙保护。图 3.7 显示了这一点：\n\n![](img/Figure-3.7.jpg)\n\
    \n**图 3.7：** Nmap -sV 命令\n\n以下是一些命令：\n\n*   `nmap -sV 192.168.1.7`：此命令将查找开放端口，以查看当前可用的服务及其版本。\n\
    *   `nmap -sA 192.168.1.7`：此命令用于对防火墙进行策略扫描。它将显示防火墙是否仅仅是一个阻止 SYN 数据包的包过滤器。它向目标发送一个\
    \ ACK 数据包；如果收到响应，则为开放状态；如果未收到响应，则正在运行包过滤器，如 图 3.8 所示：\n\n    ![](img/Figure-3.8.jpg)\n\
    \n    **图 3.8：** Nmap -sA 命令\n\n# 绕过防火墙过滤器\n\n此命令可用于扫描受防火墙保护的主机或网络。此命令也受所用防火墙过滤器的影响。图\
    \ 3.9 演示了该技术：\n\n![](img/Figure-3.9.jpg)\n\n**图 3.9：** Nmap -PN 命令\n\n以下是一些命令：\n\
    \n*   `nmap -PN 192.168.1.7`：使用此命令，主机将被视为在线状态进行扫描。如果您无法使用 ping 或扫描访问主机，这会很有用。\n\
    *   `nmap -PS 192.168.1.7`：此命令对指定端口执行 TCP SYN 发现扫描。\n*   `nmap -PA 192.168.1.7`：此命令将对指定端口执行\
    \ ACK 发现扫描。\n\n# 扫描防火墙漏洞\n\n这些命令将查找典型的防火墙漏洞利用，这些漏洞依赖于发现 TCP 网络协议中的缺陷，如 图 3.10\
    \ 所示：\n\n![](img/Figure-3.10.jpg)\n\n**图 3.10：** Nmap -sN 命令\n\n以下是一些命令：\n\n*\
    \   `nmap -sN 192.168.1.7`：这是一个空扫描命令。因为空扫描不设置任何位，所以可用于绕过非状态防火墙和包过滤器。\n*   `nmap\
    \ -sF 192.168.1.7`：这是一个 FIN 扫描命令。FIN 扫描将仅设置 TCP FIN 位。当 FIN 数据包发送到开放端口时，开放端口会直接忽略它，而关闭端口会被重定向到\
    \ RST 数据包，这反过来又会在 Nmap 中揭示哪些端口是开放和关闭的。\n*   `nmap -sX 192.168.1.7`：这是一个 Xmas 扫描命令。Xmas\
    \ 扫描可用于查看目标机器的端口是开放还是关闭。此扫描发送设置了所有数据包头标志的 TCP 段。\n\n# 数据包分片\n\n为了使包过滤器、入侵检测系统和防火墙更难以识别您的扫描，此命令将\
    \ TCP 头部分离到多个数据包中。如果您想在不触发警报的情况下对网络执行隐秘扫描，将需要这些命令。例如，请参考 图 3.11：\n\n*   `Nmap\
    \ -sS -p 80 -f 192.168.1.7`：此命令在 `192.168.1.7` 的端口 `80` 上执行 TCP SYN 扫描，而不会触发任何入侵检测系统或警报。请记住，防火墙或\
    \ IDS 的设置和策略也起作用。\n\n    ![](img/Figure-3.11.jpg)\n\n    **图 3.11：** 数据包分片命令\n\
    \n# 防火墙诱饵\n\n您可以使用此命令向远程主机欺骗主机。如果欺骗操作得当，IDS 和网络管理将完全不知道正在进行网络扫描。示例命令如下：\n\n* \
    \  `Nmap -n 192.168.1.7 -D 192.168.1.110`：此命令在不发出 DNS 请求的情况下扫描主机，并且还包含一个为 `192.168.1.110`\
    \ 设置的诱饵，这使得扫描看起来像是由 `192.168.1.110` 而不是 Kali Linux 主机进行的。请参阅 图 3.12：\n\n    ![](img/Figure-3.12.jpg)\n\
    \n    **图 3.12：** 防火墙诱饵命令\n\n# Zenmap\n\n**Zenmap** 是 Nmap 的图形化前端，可在多个平台上运行。它简化了\
    \ Nmap 的使用，并包含用于即时运行扫描的预设指令。\n\n请参阅 图 3.13：\n\n![](img/Figure-3.13.jpg)\n\n**图\
    \ 3.13：** Zenmap\n\n请访问 **[`nmap.org/zenmap/`](https://nmap.org/zenmap/)** 了解有关\
    \ Zenmap 的更多信息。\n\n# 无线扫描\n\n无线接入点始终在寻找更多无线接入点进行连接。802.11 无线电在 2.4 到 5.85 GHz\
    \ 的频率范围内运行。**被动** 和 **主动** 扫描是仅有的两种方法。默认情况下，802.11 无线电会在国家运营法律授权的所有信道上执行这两种扫描。\n\
    \n在没有 FCC 许可证或执照的情况下运营，即使仅一天也可能导致巨额罚款。您可能会想知道 FCC 是谁。**联邦通信委员会**（**FCC**）负责监督和监管美国电信行业，其中包括互联网。为什么这可能令人担忧？互联网的目的是让每个人都能在没有歧视、封锁、审查或网络限速的情况下访问它。简而言之，FCC\
    \ 正在提议新的互联网法律和合同，这将允许互联网服务提供商收取溢价或出售*付费使用*服务，如果您没有额外的现金，将会降低您的网速。在进行任何本地广播或扫描之前，请咨询您所在国家的无线通信团队。\n\
    \n# 被动扫描\n\n在 **被动扫描** 期间，会监控信标和探测响应。客户端无线电每秒传输一次扫描，然后审核无线网络上的数据包。因为被动扫描用于将客户端连接到接入点，所以它们始终处于启用状态。\n\
    \n# 主动扫描\n\n仅扫描政府规则批准的信道。**主动扫描** 默认启用；但是，可以从无线适配器的配置文件或设置中将其移除。在主动扫描期间，无线电向该区域的其他设备发送具有空\
    \ SSID 名称的探测请求，以鼓励探测响应。换句话说，接入点主动寻找并监听其他设备，如 图 3.14 所示：\n\n![](img/Figure-3.14.jpg)\n\
    \n**图 3.14：** 主动扫描\n\n# 扫描如何工作？\n\n接入点必须更改信道以扫描操作范围之外的区域。来自接入点的这些无线 RF 信道扫描每秒发生一次，并在各种信道范围内进行，直到循环遍历所有信道，如\
    \ 图 3.15 所示：\n\n![](img/Figure-3.15.jpg)\n\n**图 3.15：** RF 信道\n\n大约 25-30 毫秒后，无线接入点将退出\
    \ RF 信道。扫描的时机旨在避免干扰其他信标的传输。信道切换完成后，将发送探测请求。请记住，如果检测到语音、视频或其他大量数据使用，扫描频率将会降低。\n\
    \n# 嗅探无线网络\n\n我们真的能“嗅”到无线网络吗？听起来很有趣，对吧？不，但有了正确的工具和设备，您就可以做到！无线嗅探是程序或工具在无线网络上使用的一种窃听技术。在网络中游荡的无线设备比嗅探的侵入性小。无线嗅探用于诊断无线网络上的网络问题和协议。\n\
    \n无线和有线连接都可以被监控和嗅探。因为无线网络通过无线电信号通信，所以嗅探它们要容易得多。攻击者可以坐在企业外面的车里，嗅探无线网络以获取敏感信息，用于个人利益、关注或金钱。\n\
    \n"
