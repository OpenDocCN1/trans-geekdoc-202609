    \ **Paros Proxy:** This open-source Java-based proxy was created specifically\
    \ to look for weaknesses in Web applications. From <https://sourceforge.net/projects/paros/files/>,\
    \ you can download it. It was replaced by OWASP ZAP because it was not updated\
