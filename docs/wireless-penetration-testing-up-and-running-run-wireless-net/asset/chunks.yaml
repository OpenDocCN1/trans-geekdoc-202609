    Web 流量），并学习如何使用 Metasploit。最后，你将学习如何防范这些威胁。


    # [Capturing unencrypted traffic](#toc.xhtml#s132a)


    正如 [Figure 8.1](#c08.xhtml#fig8_1) 所示，任何连接到同一无线网络的人都可以以明文形式读取未加密的无线流量。你的电子邮件、即时消息、FTP
    文件、Telnet 连接、HTTP 会话和其他数据都可能被窃取。其原理是什么？当用户使用 HTTP 浏览网站时，他们发送的数据从头到尾都未加密；因此，同一网络上的任何人都可以拦截并记录这些数据：


    ![](images/Figure-8.1.jpg)


    **Figure 8.1:** Unncrypted connection


    `Wireshark` 是一款网络分析器，允许你检查和保存实时网络数据包。`Wireshark` 兼容 Windows、Mac OS X、Linux 和 Unix。如果有人在网络上运行
    `Wireshark`，他们可以观察到人们访问了哪些网站、传输了哪些文件、发送了哪些即时消息等。

