- raw: 'Have you ever heard of or dealt with a person whose online accounts were hacked?
    Most likely, this user has been a victim of a credential attack in which an attacker
    has stolen their login credentials. This can be accomplished with the use of a
    Web server or tools such as the **Social Engineering Toolkit** (**SET**). The
    attacker can clone a website and make it appear genuine and reputable to fool
    the user into signing in. They have no idea that someone suddenly has complete
    access to their data. The credential harvester and phishing attack methods will
    be discussed in the following sections.


    # [Credential harvester](#toc.xhtml#s35a)


    This technique launches an Apache server on the attacker’s PC to clone a website
    and make it appear authentic. The attacker might connect to a wireless access
    point and use DNS spoofing to send HTTP requests to a bogus website. The website
    will appear to be the same as the real website when the user tries to log in normally.
    On the attacker’s end, the attacker will have access to the user’s username and
    password, as well as the user’s IP address. From here, the attacker could continue
    collecting account logins, which he or she could subsequently save in a report.
    It is critical to conduct social engineering assaults on your company’s employees
    to see if they follow processes and security standards. This can be seen in *Figure*
    *2.12*:


    ![](images/Figure-2.12.jpg)


    **Figure 2.12:** Credential harvester


    # [Phishing](#toc.xhtml#s36a)


    So, what exactly is phishing, and how do we spot a phishing attempt, a fraud,
    or a hoax? Phishing is a deceptive method of obtaining personal information such
    as usernames, passwords, social security numbers, phone numbers, and credit card
    numbers. These assaults are frequently detected by sending an e-mail to a user
    instructing them to visit a website for information updates, password changes,
    or information verification. The easiest approach to avoid being a victim of a
    phishing scam is to understand how they work. An e-mail from an unknown source
    requesting your password or changing your password is most likely a fraudulent
    e-mail. These e-mails will need to be blocked or marked as spam or phishing. If
    you suspect you have been a victim of phishing, update your passwords, as shown
    in *[Figure 2.13](#c02.xhtml#fig2_13)*:


    ![](images/Figure-2.13.jpg)


    **Figure 2.13:** Phishing


    # [Authentication attacks](#toc.xhtml#s37a)


    Authentication attacks are used by attackers to steal valid user identities and
    credentials to gain access to private networks and services. The following sections
    describe some authentication attacks.


    # [Shared key guessing](#toc.xhtml#s38a)


    Using vendor default credentials or shared key generators, the attacker tries
    to guess 802.11 shared key authentications. All shared keys should not be left
    as defaults and should be changed as soon as the device is set up and configured.
    This attack can be carried out using any cracking tool, such as Aircrack-ng, as
    shown in *Figure* *2.14*:


    ![](images/Figure-2.14.jpg)


    **Figure 2.14:** Shared key guessing


    # [PSK cracking](#toc.xhtml#s39a)


    Using a dictionary attack tool, the PSK cracking technique recovers a WPA/WPA2
    PSK from collected key handshake frames. The encryption strength of the WPA/WPA2
    key is crucial in this attack. If the key is extremely difficult to crack, it
    could take weeks, which may not be worth a hacker’s time. When making your own
    passwords, use a combination of letters, numbers, and symbols. The more characters
    you have, the less likely you are to become a target. These attacks can be carried
    out with tools such as coWPAtty, genpmk, KisMAC, and wpa\_crack. A PSK cracking
    attack is depicted in *Figure* *2.15*:


    ![](images/Figure-2.15.jpg)


    **Figure 2.15:** PSK cracking


    # [Sniffing application credentials](#toc.xhtml#s40a)


    The attacker collects user credentials such as e-mail addresses and passwords
    from clear text application protocols when sniffing for application credentials.
    This is rare to happen on major websites since many are using HTTPS; nonetheless,
    when login onto wireless routers or access points, HTTP is generally used, which
    is unencrypted clear text. If you use the HTTP protocol to sign in, the attacker
    has easy access to your username and password. These attacks can be carried out
    with tools such as Ace Password Sniffer, dsniff, PHoss, and Win Sniffer, as shown
    in *[Figure 2.16](#c02.xhtml#fig2_16):*


    ![](images/Figure-2.16.jpg)


    **Figure 2.16:** Sniffing


    # [Cracking domain accounts](#toc.xhtml#s41a)


    When using a brute-force or dictionary attack tool to crack domain accounts, the
    attacker recovers the user’s credentials, such as their Windows login and password,
    by cracking the NetBIOS password hashes. Some programs require browser-saved passwords
    from internet Explorer, Firefox, or Google Chrome. If an attacker obtains your
    credentials, they may be able to access network shares, send and receive e-mails,
    and potentially compromise the entire domain if the account has administrative
    privileges. These attacks can be carried out with tools such as John the Ripper,
    L0phtCrack, and Cain, as shown in *[Figure 2.17](#c02.xhtml#fig2_17):*


    ![](images/Figure-2.17.jpg)


    **Figure 2.17:** John the Ripper


    # [VPN login cracking](#toc.xhtml#s42a)


    The attacker uses a brute-force attack on the VPN authentication protocols to
    obtain user credentials such as PPTP or IPsec passwords. Make sure the password
    and the pre-shared secret key are both unique and extremely secure. Passwords
    or numbers that are easy to guess can easily compromise a whole organization,
    resulting in consumer information being disclosed. These attacks can be carried
    out using tools such as IKE-scan, IKECrack, anger, and THC-pptp-bruter. The VPN
    login cracking attack is shown in *[Figure 2.18](#c02.xhtml#fig2_18)*:


    ![](images/Figure-2.18.jpg)


    **Figure 2.18:** IKE-scan


    # [802.11 identify theft](#toc.xhtml#s43a)


    The attacker collects user profiles from the clear text over wireless 802.11 in
    an 802.11 identity theft attack. Encryption is essential for ensuring that no
    data is compromised. While connected to a Wi-Fi network, using HTTPS and VPN protocols
    will help protect you from assaults such as this. This can be done with capture
    tools such as Wireshark or Ettercap-NG, as shown in *Figure* *2.19*:


    ![](images/Figure-2.19.jpg)


    **Figure 2.19:** Stealing password using Wireshark


    # [802.11 password guessing](#toc.xhtml#s44a)


    An 802.11 password-guessing attack uses a captured identity to attempt to guess
    the user’s password on 802.11 authentications repeatedly. The attacker is likely
    to keep guessing default passwords, vendor names, most common passwords, birthdays,
    names, phone numbers, and other personal information until they have complete
    control of the wireless network. If the attacker has a large password dictionary,
    a dictionary attack can be readily carried out, and access gained in a few hours.
    These attacks can be carried out with tools such as John the Ripper and THC Hydra,
    as shown in *Figure* *2.20*:


    ![](images/Figure-2.20.jpg)


    **Figure 2.20:** THC Hydra


    # [802.11 LEAP cracking](#toc.xhtml#s45a)


    The attacker recovers user credentials from recorded 802.11 LEAP packets using
    a dictionary attack tool to crack the NT password hash in an 802.11 LEAP cracking
    attempt. This is dependent on the strength of the password; if it is strong, it
    is unlikely to be cracked, which is why it is critical to use a combination of
    letters, numbers, and symbols to avoid dictionary attacks. These attacks can be
    carried out with tools such as Anwrap, Asleap, and THC-LEAPcracker. *[Figure 2.21](#c02.xhtml#fig2_21)*
    serves as an example:


    ![](images/Figure-2.21.jpg)


    **Figure 2.21:** Asleap


    # [802.11 EAP downgrade attack](#toc.xhtml#s46a)'
