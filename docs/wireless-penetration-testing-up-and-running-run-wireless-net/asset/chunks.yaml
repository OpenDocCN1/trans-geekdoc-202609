    # 智能手机与 Android 架构


    智能手机已普及全球，拥有超过 10 亿用户，Google 和 Apple 的数字应用市场上提供了 250 万款应用（且仍在增加）。它们对我们生活的影响是即时且深远的，以多种方式影响着我们的日常生活，包括我们如何连接、工作和社交。消费者需求的增长，以及智能手机处理能力和功能的提升（如存储、GPS、摄像头、屏幕及其他特性），已改变了移动应用开发的范式。网上银行、交易、电子邮件、机场值机等众多功能，皆可通过一次点击即可实现。


    在本章中，我们将涵盖开始对 Android 应用进行黑客攻击和渗透测试所需的所有信息。我们将讨论 OWASP 移动应用十大漏洞，以及如何攻击 Android
    应用及其弱点，并附带示例。


    ## 结构


    本章将涵盖以下主题：


    *   Android 架构

    *   Android 渗透测试环境搭建

    *   Android 渗透测试工具

    *   安全的 Android 应用


    ## 目标


    在本章中，你将详细了解 Android 架构，学习如何搭建 Android 渗透测试环境，并了解流行的 Android 渗透测试工具。最后，你将学习如何保护你的
    Android 应用。


    ## Android 架构


    对于任何开发者或安全研究人员而言，理解任何平台的架构都至关重要。Android 的硬件抽象层基于 Linux 2.x 和 3.x 内核。


    它由以下部分组成：


    *   关键应用

    *   操作系统

    *   中间件

    *   运行时环境

    *   不同的服务

    *   原生库和自定义库


    如图 10.1 所示，它可以表示为五层：


    ![](img/Figure-10.1.jpg)


    **图 10.1：** Android 架构


    所有组件均经过微调和整合，以提供开发和执行移动应用的最佳环境。


    现在，让我们采用自底向上的方法来了解 Android 技术栈的各个层级。


    ## Linux 内核


    Linux 内核是 Android 操作系统的核心。之所以选择 Linux 作为最佳起点，是因为其灵活的可移植特性，允许在各种硬件平台上轻松编译应用。


    位于软件栈底部的 Linux 内核支持进程管理/调度、内存管理和设备管理。它还充当关键的抽象层，通过提供对多种设备驱动程序的访问，允许应用与物理设备通信。


    屏幕根据移动设备方向自动进行倾斜/旋转调整，就是一个简单的例子。这涉及以下问题：


    *   这是如何发生的？

    *   是什么触发设备执行此操作？

    *   操作系统如何得知设备方向已改变？


    让我们仔细看看。


    加速度计和陀螺仪是设备中的硬件传感器，它们检测微小的运动和方向变化，并将此数据传递给内核。设备驱动程序将这些信息转换为软件指令，应用程序会捕获这些指令；如果应用旨在响应这些指令，它就会做出响应。正如图
    10.2 所示，Linux 内核包含硬件正常运行所需的所有驱动程序，以及电源管理。


    简而言之，Linux 内核负责内存、资源、电源和驱动程序管理。


    ![](img/Figure-10.2.jpg)


    **图 10.2：** Linux 内核


    ## Linux 与 Linux 内核的混淆


    “Linux”这一名称通常用于指代完整的操作系统，而“内核”指的是操作系统的核心。Android 基于 Linux 内核这一事实，并不意味着它是另一个 Linux
    发行版；这仅意味着 Linux 是基础操作系统，并非所有 Linux 程序都能在 Android 上加载运行。


    ## Android 运行时


    虽然 Android 使用 Java 编写，但 `Dalvik 虚拟机` (`DVM`)、核心 Java 库以及一个名为 `Android 运行时` (`ART`)
    的新虚拟机构成了 Android 架构的运行时层。


    图 10.3 来自 Android 4.4 KitKat，它允许开发者创建 ART 应用：


    ![](img/Figure-10.3.jpg)


    **图 10.3：** Android 运行时 (ART) 选项


    用 Java 编写的应用在 `DVM` 上执行。由于许可问题，`DVM` 不声称是 `Java 虚拟机` (`JVM`)，尽管它服务于相同的目的。原因在于
    Dalvik 旨在运行于低功耗和低内存设备上。出于性能原因，`DVM` 仅启动一次。一个名为 `Zygote` 的系统服务会克隆其每个新实例。Android
    运行时的结构如图 10.4 所示：


    ![](img/Figure-10.4.jpg)


    **图 10.4：** Android 运行时核心库


    ## Java 虚拟机


    当我们构建 Java 应用时，会得到字节码。此字节码可由 `JVM` 执行，`JVM` 是一种虚拟机（虚拟机是一种充当操作系统的程序）。图 10.5 描绘了
    Java 程序的编译过程：


    ![](img/Figure-10.5.jpg)


    **图 10.5：** Java 程序编译过程


    ## Dalvik 虚拟机


    在 Android 中，由 `JVM` 创建的字节码被送入 `DVM`，后者生成一种称为 `.dex` 的轻量级格式。


    为什么有必要将 Java 字节码转换为 `.dex` 格式？


    答案是：移动设备不像 PC 那样拥有同等的算力、内存和 RAM。这解释了为何我们需要越来越轻量级的应用。在 PC 上，Java 字节码适用于重量级应用。`DVM`
    在生成 `.dex` 文件前，会使用压缩技术消除类中的冗余信息。例如，如果你的 Java 源代码有 1000 个类，所有这 1000 个类将在 Dalvik
    可执行格式 (`.dex`) 中作为单个文件存在。


    Java 源代码 (`.java`) 转换为 Dalvik 字节码 (`.dex`) 的过程如图 10.6 的流程图所示：


    ![](img/Figure-10.6.jpg)


    **图 10.6：** .java 到 .dex 的转换


    ## Zygote


    `Zygote` 是 Android 设备启动时最先启动的程序之一，负责以下工作：


    *   启动虚拟机

    *   预加载核心库

    *   初始化各种共享结构


    ## 核心 Java 库


    这些库不同于核心 Java 库中的 Java SE 和 Java ME 库。它们通常被称为 Dalvik 库。其中包括：


    *   **DVM 专用库**：这些库旨在直接与 `DVM` 实例通信。开发者社区不太可能使用它们。

    *   **Java 互操作库**：这些只是核心 Java 运行时库中类的集合；通常这些库协助文件操作、字符串处理和其他网络任务。


    ## ART


    当 Google 发布 Android Lollipop 时，`DVM` 被 `ART` 完全取代。`ART` 相较于 `DVM` 具有以下优势：


    *   **预编译** (`AOT`) 与旧时的 **即时编译** (`JIT`) 对比

    *   改进的垃圾回收

    *   更好的应用性能


    ART 代码的编译过程如图 10.7 所示：


    ![](img/Figure-10.7.jpg)

