- raw: "As a penetration tester, it is important to understand and understand who\
    \ your goals are. There exist many more than just computer systems to consider.\
    \ Servers, smartphones, pills, and network hardware may also be a section of the\
    \ penetration check. Knowing whether software programs or program patches have\
    \ already been applied or not really is extremely important once we would not\
    \ like unauthorized access to the unit and systems, specifically in a production\
    \ atmosphere.\n\nTools like Nmap and Zenmap may be used to scan a whole network.\
    \ Even though it is a quick solution to get information like the operating system\
    \ and software edition, it is not always accurate. Based on the scenario, it is\
    \ sometimes better to go to each gadget and system to learn what is used on the\
    \ network. Inquiring the client for system documentation and hardware stock can\
    \ be very useful if they can offer that information.\n\n# [Protecting yourself\
    \ from attacks](#toc.xhtml#s66a)\n\nNo issue what the problem is; we always have\
    \ to know how exactly to protect ourselves from any threats that could occur.\
    \ Whether it is from within or beyond your network, you will have to provide yourself\
    \ with knowing how you might be affected by an individual or company. There are\
    \ several solutions to protect yourself from like attacks:\n\n*   Protection against\
    \ Nmap and Zenmap:  \n\n    *   Create custom firewall rules and access list\n\
    \n    *   Any hardware IDS that are monitoring network traffic 24/7\n\n    * \
    \  Block or filter ICMP pings\n\n*   Protection against wireless scanning:  \n\
    \n    *   Configure the latest wireless encryption algorithm\n\n    *   Configure\
    \ MAC filtering rules\n\n    *   Turn off or hide wireless broadcast\n\n    *\
    \   Turn off UPnP support\n\n*   Protection against sniffing wireless networks:\
    \  \n\n    *   Use SSH and HTTPS instead of Telnet and HTTP\n\n    *   Connect\
    \ using a VPN service\n\n    *   Connect to only trusted wireless networks\n\n\
    # [Conclusion](#toc.xhtml#s67a)\n\nIn this chapter, you discovered how exactly\
    \ to scan wireless systems for info, saw two various kinds of wireless scanning,\
    \ and discovered how they function. You saw how exactly to sniff wireless systems\
    \ by ARP poisoning with Ettercap and how exactly to use dsniff to get login credentials.\
    \ We furthermore discussed how to determine your targets throughout a wireless\
    \ penetration test.\n\nFinally, you learned a number of different solutions to\
    \ protect yourself from these assaults. It is very important to keep your mindset\
    \ of being an attacker since it will open up your eye to even more security threats\
    \ that could potentially threaten you to be an individual or company. Always hook\
    \ up to trusted wireless systems, use encryption when it is available, and make\
    \ use of a VPN when traveling.\n\nNow, you are ready to move on to *[Chapter 4,\
    \ Wireless Vulnerability Research](#c04.xhtml).*\n\n# [Questions](#toc.xhtml#s68a)\n\
    \n1.  What is Footprinting?\n\n2.  Mention the most famous of wireless network\
    \ discovery tools.\n\n3.  What are the types of wireless scanning?\n\n4.  How\
    \ do you protect yourself from wireless scanning?\n\n5.  Mention the common tools\
    \ of Network Protocol Analyzer.\n\n# [CHAPTER 4](#toc.xhtml#c04)\n\n# [Wireless\
    \ Vulnerability Research](#toc.xhtml#c04)\n\n# [Introduction](#toc.xhtml#s69a)\n\
    \nIn this chapter, you become familiar with how to strategy an attack and crack\
    \ WEP/WPA/WPA2 wireless networks and can learn Mac spoofing to get unauthorized\
    \ access to a network. Additionally, you will learn to protect yourself from most\
    \ of these threats. This chapter could have hands-on, step-by-step guidelines\
    \ with Kali Linux. Remember that you will just be able to adhere to the cracking\
    \ portion of this chapter in case you have the cellular cards or adapters pointed\
    \ out towards the finish of *[Chapter 1, Wireless Penetration Testing Lab Setup](#c01.xhtml)*.\n\
    \nBefore we start, there are some things that you need to know before we crack\
    \ any wireless networks:\n\n*   Cracking any wireless system without authorization\
    \ is illegal\n\n*   If you are captured without authorization, you will face the\
    \ consequences in accordance with the law inside your area\n\n*   Please only\
    \ demonstrate methods by your own network\n\n# [Structure](#toc.xhtml#s70a)\n\n\
    In this chapter, we will discuss the following topics:\n\n*   Planning an attack\n\
    \n*   Wireless password cracking\n\n*   Spoofing your MAC address\n\n*   Protecting\
    \ yourself from attacks\n\n# [Objectives](#toc.xhtml#s71a)\n\nIn this chapter,\
    \ you will learn how to put a plan for an attack. Next, you will learn several\
    \ methods for an attack. Then, you will learn detailed information on WEP, WPA,\
    \ and WPA2 encryption. Finally, you will learn several ways to reduce the risk\
    \ of a wireless attack.\n\n# [Planning an attack](#toc.xhtml#s72a)\n\nBefore we\
    \ work on any wireless scans or cracks in any wireless encryption, the very first\
    \ thing we must do is plan an attack. We must make sure we have everything to\
    \ run a wireless penetration and ensure that we ask ourselves as many questions\
    \ as possible so that we do not come across any obstacles along the way. Let us\
    \ start with a listing of requirements and the steps we shall get to crack a wireless\
    \ network.\n\n# [Wireless attack](#toc.xhtml#s73a)\n\nRight here, we have a listing\
    \ of what is necessary to conduct a complete wireless attack:\n\n*   **A compatible\
    \ wireless adapter**: Note that it must support packet injection.\n\n*   **The\
    \ Kali Linux operating system**: All our security tools are preinstalled.\n\n\
    *   **Pen and paper to take notes**: This will help us to keep organized.\n\n\
    # [The plan for attacking wireless networks](#toc.xhtml#s74a)\n\nListed here are\
    \ the actions to plan a wireless attack:\n\n1.  Scan for a list of wireless networks\
    \ in the area.\n\n2.  Take note of the BSSID, Channel number, and encryption.\n\
    \n3.  List several attack methods that you will use to attack: \n\n    1.  Airodump\n\
    \n    2.  Aircrack\n\n    3.  Dictionary attack\n\n    4.  Default logins\n\n\
    \    5.  Password guessing\n\n4.  Proceed with each method.\n\n5.  Record both\
    \ successful and unsuccessful results.\n\n6.  Try again.\n\n# [Wireless password\
    \ cracking](#toc.xhtml#s75a)\n\nThere are various methods to crack wireless encryption.\
    \ Here, we will discuss the most typical solutions to crack wireless networks.\
    \ In the next several sections, we will discuss what each wireless encryption\
    \ is in excellent detail and will demonstrate how exactly to crack those wireless\
    \ encryption varieties. Let us begin!\n\n# [WEP encryption](#toc.xhtml#s76a)\n\
    \nEven though the WEP protocol was acknowledged to be defective as early as 2000,\
    \ it is still in use, and access points are being shipped with WEP-enabled capabilities.\n\
    \nWEP has several cryptographic flaws that have been identified by Walker, Arbaugh,\
    \ Fluhrer, Martin, Shamir, KoreK, and others. The cryptographic evaluation of\
    \ WEP is outside the scope of this book because it necessitates a thorough understanding\
    \ of sophisticated math. In this section, we will look at how to crack WEP encryption\
    \ on the Kali platform using easily available tools. This includes airmon-ng,\
    \ aireplay-ng, airodump-ng, aircrack-ng, and additional tools from the aircrack-ng\
    \ suite.\n\nThe usage of RC4 with a short IV value that is recycled every 224\
    \ frames is WEP’s core flaw. Although this is a huge amount, per 5,000 packets,\
    \ there is a 50% probability of four reuses. To take advantage of this, we generate\
    \ a huge quantity of traffic to enhance the possibility of reused IVs and so compare\
    \ two cypher texts encrypted with the same IV and key, as shown in *[Figure 4.1](#c04.xhtml#fig4_1)*:\n\
    \n![](images/Figure-4.1.jpg)\n\n**Figure 4.1:** WEP encryption\n\n# [Cracking\
    \ WEP encryption](#toc.xhtml#s77a)\n\nWe will go through step-by-step instructions\
    \ on how to crack WEP encryption in this part."
  fmt: "\n# Protecting yourself from attacks\n\nNo issue what the problem is; we always\
    \ have to know how exactly to protect ourselves from any threats that could occur.\
    \ Whether it is from within or beyond your network, you will have to provide yourself\
    \ with knowing how you might be affected by an individual or company. There are\
    \ several solutions to protect yourself from like attacks:\n\n*   **Protection\
    \ against Nmap and Zenmap:**\n    *   Create custom firewall rules and access\
    \ list\n    *   Any hardware `IDS` that are monitoring network traffic 24/7\n\
    \    *   Block or filter `ICMP` pings\n\n*   **Protection against wireless scanning:**\n\
    \    *   Configure the latest wireless encryption algorithm\n    *   Configure\
    \ `MAC` filtering rules\n    *   Turn off or hide wireless broadcast\n    *  \
    \ Turn off `UPnP` support\n\n*   **Protection against sniffing wireless networks:**\n\
    \    *   Use `SSH` and `HTTPS` instead of `Telnet` and `HTTP`\n    *   Connect\
    \ using a `VPN` service\n    *   Connect to only trusted wireless networks\n\n\
    # Conclusion\n\nIn this chapter, you discovered how exactly to scan wireless systems\
    \ for info, saw two various kinds of wireless scanning, and discovered how they\
    \ function. You saw how exactly to sniff wireless systems by `ARP` poisoning with\
    \ `Ettercap` and how exactly to use `dsniff` to get login credentials. We furthermore\
    \ discussed how to determine your targets throughout a wireless penetration test.\n\
    \nFinally, you learned a number of different solutions to protect yourself from\
    \ these assaults. It is very important to keep your mindset of being an attacker\
    \ since it will open up your eye to even more security threats that could potentially\
    \ threaten you to be an individual or company. Always hook up to trusted wireless\
    \ systems, use encryption when it is available, and make use of a `VPN` when traveling.\n\
    \nNow, you are ready to move on to *[Chapter 4, Wireless Vulnerability Research](#c04.xhtml).*\n\
    \n# Questions\n\n1.  What is Footprinting?\n2.  Mention the most famous of wireless\
    \ network discovery tools.\n3.  What are the types of wireless scanning?\n4. \
    \ How do you protect yourself from wireless scanning?\n5.  Mention the common\
    \ tools of Network Protocol Analyzer.\n\n# Chapter 4: Wireless Vulnerability Research\n\
    \n## Introduction\n\nIn this chapter, you become familiar with how to strategy\
    \ an attack and crack `WEP`/`WPA`/`WPA2` wireless networks and can learn Mac spoofing\
    \ to get unauthorized access to a network. Additionally, you will learn to protect\
    \ yourself from most of these threats. This chapter could have hands-on, step-by-step\
    \ guidelines with `Kali Linux`. Remember that you will just be able to adhere\
    \ to the cracking portion of this chapter in case you have the cellular cards\
    \ or adapters pointed out towards the finish of *[Chapter 1, Wireless Penetration\
    \ Testing Lab Setup](#c01.xhtml)*.\n\nBefore we start, there are some things that\
    \ you need to know before we crack any wireless networks:\n\n*   Cracking any\
    \ wireless system without authorization is illegal\n*   If you are captured without\
    \ authorization, you will face the consequences in accordance with the law inside\
    \ your area\n*   Please only demonstrate methods by your own network\n\n## Structure\n\
    \nIn this chapter, we will discuss the following topics:\n\n*   Planning an attack\n\
    *   Wireless password cracking\n*   Spoofing your MAC address\n*   Protecting\
    \ yourself from attacks\n\n## Objectives\n\nIn this chapter, you will learn how\
    \ to put a plan for an attack. Next, you will learn several methods for an attack.\
    \ Then, you will learn detailed information on `WEP`, `WPA`, and `WPA2` encryption.\
    \ Finally, you will learn several ways to reduce the risk of a wireless attack.\n\
    \n## Planning an attack\n\nBefore we work on any wireless scans or cracks in any\
    \ wireless encryption, the very first thing we must do is plan an attack. We must\
    \ make sure we have everything to run a wireless penetration and ensure that we\
    \ ask ourselves as many questions as possible so that we do not come across any\
    \ obstacles along the way. Let us start with a listing of requirements and the\
    \ steps we shall get to crack a wireless network.\n\n## Wireless attack\n\nRight\
    \ here, we have a listing of what is necessary to conduct a complete wireless\
    \ attack:\n\n*   **A compatible wireless adapter**: Note that it must support\
    \ packet injection.\n*   **The Kali Linux operating system**: All our security\
    \ tools are preinstalled.\n*   **Pen and paper to take notes**: This will help\
    \ us to keep organized.\n\n## The plan for attacking wireless networks\n\nListed\
    \ here are the actions to plan a wireless attack:\n\n1.  Scan for a list of wireless\
    \ networks in the area.\n2.  Take note of the `BSSID`, Channel number, and encryption.\n\
    3.  List several attack methods that you will use to attack:\n    1.  `Airodump`\n\
    \    2.  `Aircrack`\n    3.  Dictionary attack\n    4.  Default logins\n    5.\
    \  Password guessing\n4.  Proceed with each method.\n5.  Record both successful\
    \ and unsuccessful results.\n6.  Try again.\n\n## Wireless password cracking\n\
    \nThere are various methods to crack wireless encryption. Here, we will discuss\
    \ the most typical solutions to crack wireless networks. In the next several sections,\
    \ we will discuss what each wireless encryption is in excellent detail and will\
    \ demonstrate how exactly to crack those wireless encryption varieties. Let us\
    \ begin!\n\n## WEP encryption\n\nEven though the `WEP` protocol was acknowledged\
    \ to be defective as early as 2000, it is still in use, and access points are\
    \ being shipped with `WEP`-enabled capabilities.\n\n`WEP` has several cryptographic\
    \ flaws that have been identified by Walker, Arbaugh, Fluhrer, Martin, Shamir,\
    \ KoreK, and others. The cryptographic evaluation of `WEP` is outside the scope\
    \ of this book because it necessitates a thorough understanding of sophisticated\
    \ math. In this section, we will look at how to crack `WEP` encryption on the\
    \ `Kali` platform using easily available tools. This includes `airmon-ng`, `aireplay-ng`,\
    \ `airodump-ng`, `aircrack-ng`, and additional tools from the `aircrack-ng` suite.\n\
    \nThe usage of `RC4` with a short `IV` value that is recycled every 224 frames\
    \ is `WEP`’s core flaw. Although this is a huge amount, per 5,000 packets, there\
    \ is a 50% probability of four reuses. To take advantage of this, we generate\
    \ a huge quantity of traffic to enhance the possibility of reused `IV`s and so\
    \ compare two cypher texts encrypted with the same `IV` and key, as shown in *[Figure\
    \ 4.1](#c04.xhtml#fig4_1)*:\n\n![](images/Figure-4.1.jpg)\n\n**Figure 4.1:** WEP\
    \ encryption\n\n## Cracking WEP encryption\n\nWe will go through step-by-step\
    \ instructions on how to crack `WEP` encryption in this part.\n"
  trans: "\n\n# 保护自己免受攻击\n\n无论问题是什么，我们始终必须确切了解如何保护自己免受可能发生的任何威胁。无论威胁来自网络内部还是外部，你都必须让自己了解个人或公司可能如何影响你。有几种解决方案可以保护自己免受此类攻击：\n\
    \n*   **防范 Nmap 和 Zenmap：**\n    *   创建自定义防火墙规则和访问列表\n    *   任何全天候监控网络流量的硬件 `IDS`\n\
    \    *   阻止或过滤 `ICMP` ping\n\n*   **防范无线扫描：**\n    *   配置最新的无线加密算法\n    *   配置\
    \ `MAC` 地址过滤规则\n    *   关闭或隐藏无线广播\n    *   关闭 `UPnP` 支持\n\n*   **防范嗅探无线网络：**\n\
    \    *   使用 `SSH` 和 `HTTPS` 代替 `Telnet` 和 `HTTP`\n    *   使用 `VPN` 服务连接\n    *\
    \   仅连接到受信任的无线网络\n\n# 结论\n\n在本章中，你了解了如何扫描无线系统以获取信息，看到了两种不同类型的无线扫描，并了解了它们的工作原理。你学会了如何通过\
    \ `Ettercap` 进行 `ARP` 投毒来嗅探无线系统，以及如何使用 `dsniff` 获取登录凭据。此外，我们还讨论了如何在无线渗透测试期间确定目标。\n\
    \n最后，你学习了多种不同的解决方案来保护自己免受这些攻击。保持攻击者的思维模式非常重要，因为这将让你对可能威胁你个人或公司的更多安全威胁睁大眼睛。始终连接到受信任的无线系统，在可用时使用加密，并在旅行时使用\
    \ `VPN`。\n\n现在，你已准备好继续学习 *第 4 章，无线漏洞研究。*\n\n# 问题\n\n1.  什么是足迹搜集？\n2.  提及最著名的无线网络发现工具。\n\
    3.  无线扫描有哪些类型？\n4.  如何保护自己免受无线扫描？\n5.  提及常见的网络协议分析工具。\n\n# 第 4 章：无线漏洞研究\n\n##\
    \ 简介\n\n在本章中，你将熟悉如何策划攻击并破解 `WEP`/`WPA`/`WPA2` 无线网络，并学习 MAC 地址欺骗以获得对网络的未授权访问。此外，你还将学习如何保护自己免受大多数此类威胁。本章将包含使用\
    \ `Kali Linux` 的实践分步指南。请注意，只有拥有 *第 1 章，无线渗透测试实验室搭建* 末尾提到的无线网卡或适配器，你才能跟随本章的破解部分进行操作。\n\
    \n在开始之前，在破解任何无线网络之前，有一些事情你需要知道：\n\n*   未经授权破解任何无线系统均属违法\n*   如果你在未经授权的情况下被抓获，将面临你所在地区法律规定的后果\n\
    *   请仅在你自己的网络上演示这些方法\n\n## 结构\n\n在本章中，我们将讨论以下主题：\n\n*   策划攻击\n*   无线密码破解\n*  \
    \ 欺骗你的 MAC 地址\n*   保护自己免受攻击\n\n## 目标\n\n在本章中，你将学习如何为攻击制定计划。接下来，你将学习多种攻击方法。然后，你将详细了解\
    \ `WEP`、`WPA` 和 `WPA2` 加密。最后，你将学习多种降低无线攻击风险的方法。\n\n## 策划攻击\n\n在我们对任何无线扫描或破解任何无线加密进行操作之前，必须做的第一件事就是策划攻击。我们必须确保拥有运行无线渗透测试所需的一切，并确保向自己提出尽可能多的问题，以便在过程中不遇到任何障碍。让我们从需求清单和破解无线网络所采取的步骤开始。\n\
    \n## 无线攻击\n\n在这里，我们列出了进行完整无线攻击所需的条件：\n\n*   **兼容的无线网卡**：注意它必须支持数据包注入。\n*   **Kali\
    \ Linux 操作系统**：我们所有的安全工具都已预装。\n*   **笔和纸用于记录笔记**：这将帮助我们保持条理清晰。\n\n## 攻击无线网络的计划\n\
    \n以下是策划无线攻击的步骤：\n\n1.  扫描该区域的无线网络列表。\n2.  记下 `BSSID`、信道编号和加密方式。\n3.  列出你将用于攻击的几种攻击方法：\n\
    \    1.  `Airodump`\n    2.  `Aircrack`\n    3.  字典攻击\n    4.  默认登录\n    5.  密码猜测\n\
    4.  依次进行每种方法。\n5.  记录成功和不成功的结果。\n6.  再试一次。\n\n## 无线密码破解\n\n破解无线加密有多种方法。在这里，我们将讨论破解无线网络最典型的解决方案。在接下来的几节中，我们将详细讨论每种无线加密是什么，并演示如何破解这些无线加密类型。让我们开始吧！\n\
    \n## WEP 加密\n\n尽管 `WEP` 协议早在 2000 年就被确认存在缺陷，但它仍在使用中，且接入点仍在出厂时启用 `WEP` 功能。\n\n\
    Walker、Arbaugh、Fluhrer、Martin、Shamir、KoreK 等人发现了 `WEP` 存在多个加密缺陷。`WEP` 的加密分析超出了本书范围，因为它需要对复杂数学有透彻的理解。在本节中，我们将探讨如何使用易于获取的工具在\
    \ `Kali` 平台上破解 `WEP` 加密。这包括 `airmon-ng`、`aireplay-ng`、`airodump-ng`、`aircrack-ng`\
    \ 以及 `aircrack-ng` 套件中的其他工具。\n\n`WEP` 的核心缺陷在于使用带有短 `IV` 值的 `RC4`，该值每 224 帧就会被回收利用。尽管这是一个巨大的数量，但每\
    \ 5,000 个数据包就有 50% 的概率出现四次重用。为了利用这一点，我们生成大量流量以增加 `IV` 重用的可能性，从而比较使用相同 `IV` 和密钥加密的两个密文，如\
    \ *图 4.1* 所示：\n\n![](img/Figure-4.1.jpg)\n\n**图 4.1：** WEP 加密\n\n## 破解 WEP 加密\n\
    \n在本部分中，我们将逐步介绍如何破解 `WEP` 加密的说明。\n\n"
