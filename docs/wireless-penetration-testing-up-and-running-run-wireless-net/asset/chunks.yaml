    \ \n\n    ![](images/Figure-3.26.jpg)\n\n    **Figure 3.26:** dsniff output\n\n\
    If anyone should sign in making use of no encryption, dsniff will grab login credentials.\
    \ For this reason, it is highly recommended to always use encryption when it is\
