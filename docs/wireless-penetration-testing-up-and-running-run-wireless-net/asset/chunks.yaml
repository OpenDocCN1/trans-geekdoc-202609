  trans: "\n我们可以继续执行以下操作：\n\n1.  使用 `genpmk` 工具，我们可以提前为给定的 SSID 和字典计算 PMK：\n\n   \
    \ ```\n    genpmk -f <chosen wordlist> -d PMK-Wireless-Lab -s “Wireless Lab”\n\
    \    ```\n\n    这将生成 `PMK-Wireless-Lab` 文件，其中包含 PMK，如 *图 4.19* 所示：\n\n    ![](img/Figure-4.19.jpg)\n\
    \n    **图 4.19：** genpmk 命令\n\n2.  我们现在将使用密码 `abcdefgh`（存在于字典中）构建一个 WPA-PSK 网络，并捕获其\
    \ WPA 握手包。如随附的 *图 4.20* 所示，我们现在使用 `Cowpatty` 破解 WPA 密码：\n\n    ```\n    cowpatty\
    \ -d PMK-Wireless-Lab -s “Wireless Lab” -r wpacracking-05.cap\n    ```\n\n   \
    \ ![](img/Figure-4.20.jpg)\n\n    **图 4.20：** Cowpatty 命令\n\n    `Cowpatty` 使用预计算的\
    \ PMK 在约 6 秒内破解密钥。\n\n3.  使用相同的字典文件，我们现在运行 `aircrack-ng`，破解操作耗时近 22 分钟。这演示了预计算带来的巨大优势。\n\
    \n4.  我们需要使用一个名为 `airolib-ng` 的工具，以便在 `aircrack-ng` 中使用这些 PMK，具体如下：\n\n    ```\n\
    \    airolib-ng PMK-Aircrack --import cowpatty PMK-Wireless-Lab\n    ```\n\n \
    \   其中 `PMK-Aircrack` 是待构建的兼容 `aircrack-ng` 的数据库，而 `PMK-Wireless-Lab` 是之前创建的符合\
    \ `genpmk` 规范的 PMK 数据库。请参阅 *图 4.21*：\n\n    ![](img/Figure-4.21.jpg)\n\n    **图\
    \ 4.21：** airolib-ng 命令\n\n5.  我们现在将此数据库提供给 `aircrack-ng`，这将显著加快破解过程。使用以下命令，如\
    \ *图 4.22* 所示：\n\n    ```\n    aircrack-ng -r PMK-Aircrack wpacracking-05.cap\n\
    \    ```\n\n    ![](img/Figure-4.22.jpg)\n\n    **图 4.22：** aircrack-ng 命令\n\n\
    6.  其他 Kali 工具（如 `Pyrit`）可以利用多处理器平台来加速破解。例如，Intel® CoreTM i7 CPU 可以执行更快的破解操作。`-r`\
    \ 选项指定 `pcap` 文件名，而我指定符合 `genpmk` 规范的 PMK 文件。在与前面工具相同的系统上，使用相同的通过 `genpmk` 准备的\
    \ PMK 文件，`Pyrit` 大约只需 3 秒即可破解密钥。\n\n**除了上述因素外，WPA/WPA2 PSK 的长度在破解过程中起着主要作用。破解较长的密码需要更长的时间。**\n\
    \n# MAC 地址欺骗\n\n您可能知道 MAC 地址过滤并不完全安全。在我看来，它比 WEP 加密的效果差得多，因为它很容易被伪造。这并不是说 MAC\
    \ 地址过滤没有用。它确实能过滤掉许多只对最薄弱环节网络感兴趣的攻击者。无论您做什么，**不要仅依赖 MAC 过滤！** WEP 加密总比没有加密要好。请参阅\
    \ *图 4.23* 了解 MAC 欺骗的示意图：\n\n![](img/Figure-4.23.jpg)\n\n**图 4.23：** MAC 欺骗\n\n\
    这不需要高水平的技术。您只需监听无线网络流量，并将您的 MAC 地址更改为已连接用户的地址即可。借助自动化脚本或应用程序，更改 MAC 地址就像 1、2、3\
    \ 一样简单。然后，让我们看看如何使用名为 `macchanger` 的应用程序来欺骗我们的 MAC 地址。\n\n1.  打开终端。\n\n2.  输入以下命令并按\
    \ *Enter* 键：\n\n    ```\n    ifconfig wlan0 down\n    ```\n\n    此命令禁用或关闭无线接口，如\
    \ *图 4.24* 所示：\n\n    ![](img/Figure-4.24.jpg)\n\n    **图 4.24：** ifconfig wlan0\
    \ down 命令\n\n3.  使用以下命令重新激活 `wlan0` 并按 *Enter* 键，如 *图 4.25* 所示：\n\n    ```\n \
    \   ifconfig wlan0 up\n    ```\n\n    ![](img/Figure-4.25.jpg)\n\n    **图 4.25：**\
    \ ifconfig wlan0 up 命令\n\n4.  输入以下命令并按 *Enter* 键：\n\n    ```\n    macchanger --random\
    \ wlan0\n    ```\n\n    此命令为无线接口随机生成一个伪造的 MAC 地址，如 *图 4.26* 所示：\n\n    ![](img/Figure-4.26.jpg)\n\
    \n    **图 4.26：** macchanger 命令 _1\n\n5.  输入以下命令并按 *Enter* 键：\n\n    ```\n   \
    \ macchanger --mac=00:11:22:33:44:55 wlan0\n    ```\n\n    如显示的那样，此命令允许您在无线接口上伪造一个\
    \ MAC 地址，如 *图 4.27* 所示：\n\n    ![](img/Figure-4.27.jpg)\n\n    **图 4.27：** macchanger\
    \ 命令 _2\n\n就这么简单！难道不简单吗？了解这一点可以帮助您避开那些需要长期付费的付费热点网络。这些网络常见于咖啡店、餐厅、机场和酒店。当用户付费后，其\
    \ MAC 地址会被添加到允许访问互联网的 MAC 地址列表中。\n\n# 防范无线攻击\n\n我们必须时刻了解如何防御此类威胁和攻击。\n\n接下来，我们将介绍防范这些攻击的方法：\n\
    \n*   更强大的加密可降低遭受攻击的可能性。\n*   MAC 过滤也有助于降低遭受攻击的几率。\n*   如果您的设备不兼容 WPA/WPA2，可以改用\
    \ WEP；但不建议这样做，因为它不安全。\n*   创建单独的 VLAN 以限制对企业网络的访问。\n*   应禁用或关闭 WPS 设置。\n*   设置强且复杂的密码。\n\
    *   每三到四个月更换一次密码。\n*   仅在万不得已时才使用制造商的默认密码。\n*   使用 EAP 代替 PSK。\n*   更改默认的 SSID\
    \ 名称。\n\n# 结论\n\n在本章中，我们制定了一份进攻计划。随后，我们概述了多种攻击方法。然后我们详细讲解了 WEP、WPA 和 WPA2 加密。最后，我们概述了一些降低无线攻击可能性的策略。\n\
    \n在接下来的章节中，我们将探讨如何识别无线网络上的主机，确定其规模，并发现其中易受攻击的设备和系统。让我们开始吧！\n\n# 问题\n\n1.  解释 WEP\
    \ 加密？\n2.  如何破解 WEP 加密？\n3.  解释 WPA/WPA2 加密？\n4.  如何破解 WPA/WPA2 加密？\n5.  如何防范无线攻击？\n\
    \n# 第 5 章\n\n# 获取无线网络访问权限\n\n# 简介\n\n我们来到了第 5 章！在本章中，我们将涵盖作为无线渗透测试员获取网络访问权限相关的各种主题。我们将进行网络评估以识别主机、计算网络规模并识别易受攻击的主机。在进行渗透测试时，了解网络上有多少主机是个好主意，因为您不想遗漏任何内容。让我们先谈谈为什么这如此重要。\n\
    \n# 结构\n\n在本章中，我们将讨论以下主题：\n\n*   识别主机\n*   确定网络规模\n*   检测易受攻击的主机\n*   防范威胁\n\n\
    # 目标\n\n在本章中，您将了解在对网络进行渗透测试时，查找存活主机数量的重要性。接下来，您将使用 Kali Linux 识别网络上的主机。然后，您将确定网络规模，并解释作为渗透测试员理解这一点的重要性。最后，您将能够使用\
    \ `Nessus` 漏洞扫描器检测 Windows 7 中的漏洞，并且还能够使用多种有助于降低风险的预防措施。\n"
