- raw: 'Our nmap scan on the 7.7.7.0/24 network range revealed two vulnerabilities,
    as you may recall. MS08-067 and the BoF vulnerability in the Easy File Share program
    were the flaws. Both methods can be used to get access to the target system. Another
    alternative is to keep using SSH, but we will stick with MS08-067 and easy file
    share for now.


    # [MS08-067 with bind TCP](#toc.xhtml#s148a)


    The Metasploit Framework module `exploit/windows/smb/ms08_067_netapi` can be used
    to compromise the target machine by exploiting the MS08-067 vulnerability. The
    fact that bind TCP is chosen as the payload type is crucial. The target system
    will not be able to contact us directly because the double-sided routing is not
    specified. As a result, the Bind TCP payload type must be selected so that the
    target waits for a connection on its own port. The connection to the port where
    the target system is listening will be done after the successful exploit procedure.


    *[Figure 9.23](#c09.xhtml#fig9_23)* demonstrate how Reverse TCP and Bind TCP connections
    function:


    ![](images/Figure-9.23.jpg)


    **Figure 9.23:** Reverse TCP connection and bind TCP connection


    Compromise the victim using the MS08-067-Netapi exploit module and the Bind TCP
    payload, as shown in *[Figure 9.24](#c09.xhtml#fig9_24)*:


    ![](images/Figure-9.24.jpg)


    **Figure 9.24:** MS08-067-Netapi exploit output\_1


    Also, refer to *[Figure 9.25](#c09.xhtml#fig9_25)*:


    ![](images/Figure-9.25.jpg)


    **Figure 9.25:** MS08-067-Netapi exploit output\_2


    Refer to *[Figure 9.26](#c09.xhtml#fig9_26):*


    ![](images/Figure-9.26.jpg)


    **Figure 9.26:** MS08-067-Netapi exploit output\_3


    # [Easy file share BoF](#toc.xhtml#s149a)


    The easy file share application was also vulnerable. The following steps can be
    taken to set up the exploit module with the Bind TCP payload and compromise the
    target, as shown in *[Figure 9.27](#c09.xhtml#fig9_27)*:


    ![](images/Figure-9.27.jpg)


    **Figure 9.27:** Easy File Share Exploit output\_1


    Also, refer to *[Figure 9.28](#c09.xhtml#fig9_28)*:


    ![](images/Figure-9.28.jpg)


    **Figure 9.28:** Easy file share Exploit output\_2


    Also, refer to *[Figure 9.29](#c09.xhtml#fig9_29)*:


    ![](images/Figure-9.29.jpg)


    **Figure 9.29:** Easy file share Exploit output\_3


    In the last case, the point where the attacker comes is as shown in *[Figure 9.30](#c09.xhtml#fig9_30)*:


    ![](images/Figure-9.30.jpg)


    **Figure 9.30:** Hidden network layout


    We have access to the 7.7.7.20 machine now. We will have to do some more data
    gathering. Like the RD machine, the JC-named machine has two NICs. We have discovered
    our second hidden network (8.8.8.0/24). Refer to *[Figure 9.31](#c09.xhtml#fig9_31)*:


    ![](images/Figure-9.31.jpg)


    **Figure 9.31:** Data Gathering using ipconfig


    Let us continue information gathering by performing ARP scanner on a second hidden
    network. Refer to *[Figure 9.32](#c09.xhtml#fig9_32):*


    ![](images/Figure-9.32.jpg)


    **Figure 9.32:** arp\_scanner module


    ARP scan says four machines are found in this network. Refer to *[Figure 9.33](#c09.xhtml#fig9_33):*


    ![](images/Figure-9.33.jpg)


    **Figure 9.33:** Autoroute command


    And we are adding the routing definition again.


    # [Double pivoting](#toc.xhtml#s150a)


    The 8.8.8.0/24 network was discovered during the information-gathering operation
    for the JC system. We already have a routing rule between the `172.16.0.0/24`
    and 7.7.7.0/24 networks, thanks to the first compromised system.


    Network packets sent from `172.16.0.20` to the JC device (second infected machine)
    are first sent to the RD device (first compromised machine), and then the RD transfers
    them to the JC machine.


    Attempts from the attacker computer (`172.16.0.20`) to contact the 8.8.8.9 location
    will go through two stages:


    *   **RD**: We do not know how to access the 8.8.8.9 IP address. But we know the
    system, and who knows how to access it. We can direct you to it.


    *   **JC**: We know how to forward packets from the 7.7.7.0/24 network to the
    8.8.8.0/24 network.


    *[Figure 9.34](#c09.xhtml#fig9_34)* is the final situation of the compromised
    and found systems:


    ![](images/Figure-9.34.jpg)


    **Figure 9.34:** Final state of the compromised system


    # [Holy ProxyChains](#toc.xhtml#s151a)


    The ProxyChains tool establishes and sends a link between proxy servers from start
    to finish. On the local 1081 port, a new socks4 proxy server for the newly discovered
    8.8.8.0/24 network is started. Refer to *[Figure 9.35](#c09.xhtml#fig9_35):*


    ![](images/Figure-9.35.jpg)


    **Figure 9.35:** Socks4a module


    The information for the new proxy server will be specified in the `/etc/proxychains.conf`
    configuration file. The Dynamic Chain functionality ensures that the defined proxy
    servers are switched in sequential order. Refer to *[Figure 9.36](#c09.xhtml#fig9_36):*


    ![](images/Figure-9.36.jpg)


    **Figure 9.36:** proxychains.conf file


    The 8.8.8.9 target can be scanned using the ProxyChains tool via the second pivot
    system with the nmap utility. Refer to *[Figure 9.37](#c09.xhtml#fig9_37):*


    ![](images/Figure-9.37.jpg)


    **Figure 9.37:** Nmap output\_1


    Also, refer to *[Figure 9.38](#c09.xhtml#fig9_38):*


    ![](images/Figure-9.38.jpg)


    **Figure 9.38:** Nmap output\_2


    As you can see, the packages first transit through the first proxy server before
    proceeding to the second proxy server we set up. It arrives at its final destination.
    When the scan results are analyzed, it will be determined that the vsftpd service
    at 8.8.8.9 is vulnerable.


    The following methods are used to prepare the vsftpd exploit module in the Metasploit
    framework and compromise our final target. Refer to *[Figure 9.39](#c09.xhtml#fig9_39):*


    ![](images/Figure-9.39.jpg)


    **Figure 9.39:** vsftpd exploit output\_1


    Also, refer to *[Figure 9.40](#c09.xhtml#fig9_40)*:


    ![](images/Figure-9.40.jpg)


    **Figure 9.40:** vsftpd exploit output\_2


    # [Mitigations](#toc.xhtml#s152a)


    A few mitigations are as follows:


    *   Multiple NIC systems that allow DMZ access should be eliminated from the current
    network topology.


    *   Only DMZ structures should be used to access systems in the DMZ.


    # [Conclusion](#toc.xhtml#s153a)


    The attacker discovered two different secret networks by following the steps as
    follows:


    1.  The attacker gained access to the RD machine on the same network as the attacker.


    2.  Then he notices that the RD machine has two network interfaces.


    3.  Using the autoroute post module, he created a routing rule.


    4.  The attacker then ran an ARP and NMAP scan on the 7.7.7.0/24 network and discovered
    a machine named JC.


    5.  JC had two different vulnerabilities. Easy File Share and MS08-067.


    6.  After successfully exploiting MS08-067, the attacker gained access to the
    7.7.7.20 network.


    7.  Information gathering showed JC also have two network interfaces.


    8.  Another routing rule is defined on 7.7.7.20.


    9.  ARP and NMAP were used on 8.8.8.0/24.


    10.  Vulnerable vsftpd was operating on the machine SK at 8.8.8.9.


    Refer to *[Figure 9.41](#c09.xhtml#fig9_41)*:


    ![](images/Figure-9.41.jpg)


    **Figure 9.41:** Final layout for hidden network


    While the attacker’s machine could only gain access to the first network he was
    connected to, and the attacks also gave him access to the two covert networks.


    # [Questions](#toc.xhtml#s154a)


    1.  What is routing?


    2.  What is pivoting?


    3.  What is port forwarding?


    # [CHAPTER 10](#toc.xhtml#c10)


    # [Android Penetration Testing](#toc.xhtml#c10)


    # [Introduction](#toc.xhtml#s155a)'
