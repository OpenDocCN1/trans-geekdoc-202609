    # Vulnerability Assessments


    Vulnerability assessments are typically carried out by white hats or trained,
    ethical hackers; however, black hats will occasionally utilize them for malicious
    purposes. They can perform vulnerability assessments to learn more about what
    they can access through someone''s network. Security experts can uncover gaps
    and provide recommendations and countermeasures to prevent an attack using these
    approaches to access vulnerabilities.


    ## Structure


    In this chapter, we will discuss the following topics:


    *   Planning an assessment

    *   Setting up a vulnerability scanner

    *   Running a vulnerability scanner

    *   Running a Nessus

    *   Generating reports

    *   Resolving vulnerabilities


    ## Objectives


    In this chapter, you will be able to plan out an assessment, the key components
    of an assessment, and the step-by-step process of an assessment. You will be able
    to install Nessus, register it, downloaded plugins, and then run Nessus. You will
    be able to create a new policy and scan, identify vulnerabilities, read the vulnerability
    details, and follow it with a solution to the vulnerability.


    ## Planning an Assessment


    We need to start planning an assessment before we can execute one. We begin by
    asking ourselves a series of questions about the evaluation. Let us get started!


    ### How we will be spending our time and resources?


    If you are going to conduct an assessment for an individual or a company, you
    will need an estimate of how long it will take to complete the task. It is also
    a good idea to know ahead of time what you will be using to complete the assessment.


    ### Do you have enough supporting evidence for your discoveries?


    It is a good idea to double-check that you have adequate data to cover any findings
    you make throughout the vulnerability assessment. When you start generating reports,
    you need to know what each vulnerability is and how it operates. It is also a
    good idea to provide proof of concept.


    ### When a vulnerability is detected and identified, what is the best way to address
    the problem?


    This is a difficult question to answer because it is dependent on the severity
    of the threat. The most frequent things to do are to make sure you have the most
    recent updates, upgrade your software, turn off any background services that are
    not in use, and add any additional security features like complex passwords and
    two-factor authentication. Notify the vendor of the vulnerability.


    ### How can we improve the detection rate and minimize security threats?


    Commercial hardware firewalls with IDS and IPS monitoring capabilities—proactive
    scanners that detect attacks on the go. Within their hardware firewalls and unified
    threat management systems, WatchGuard delivers great security modules such as
    packet filtering, intrusion prevention service, application control, Web blocker,
    gateway antivirus, spam blocker, and much more. To minimize risk, make sure your
    software and hardware are always up to date.


    An objective and a logical plan are required to conduct a good assessment.


    ## Components of a Vulnerability Assessment Plan


    We will go through a few critical elements of a vulnerability assessment strategy.
    As an example, consider the following:


    ### Primary Objective


    *   How is this objective handled?

    *   How will this objective be accessed?

    *   Who is involved in the assessment?

    *   Whose patches are available on the vendor side?

    *   Identifying common vulnerabilities

    *   Summarize


    ### First Objective


    *   Identifies the issues


    ### Second Objective


    *   Provide a temporary or permanent solution


    ### Third, Fourth, and So On


    *   Depending on the situation, it may require additional objectives.


    ## Planning the Process of a Vulnerability Assessment


    We will look at an example of how to plan a vulnerability assessment in this section:


    ### Objectives


    *   Are there any open networks available? If so, what are they used for?


    ### Criteria


    *   What is the priority of this objective?


    ### Strategy


    *   If there are unauthorized users on the network, can they cause damage to workstations
    or servers?

    *   Are they on a separate VLAN or subnet?


    ### Methods


    *   What can we do to meet the objective?


    ### Time


    *   Is there a deadline?

    *   When can we provide a solution?


    ### Results


    *   Who will need to know about the results?

    *   How can we prevent future unauthorized user access?


    This should give you a fair understanding of how to go about designing your own
    vulnerability analysis. When providing service to an individual or a business,
    use this as a guide. After that, we will build up a vulnerability scanner. Nessus
    is the vulnerability scanner we will be looking at.


    Before we begin setting up a vulnerability scanner, it is crucial to understand
    what a vulnerability scanner is and why it is so important. Vulnerability scanners
    do exactly what they say on the tin. It is a program or software security tool
    that looks for flaws in computers, devices, and networks. In most circumstances,
    it will immediately notify you whether you are facing low, medium, or severe security
    dangers. From the perspective of a security specialist, this can be highly useful
    in further analyzing what could potentially threaten an individual or company.


    By exploiting the given vulnerability, a black hat hacker might swiftly acquire
    unauthorized access to confidential information or company data if they use this
    tool. On a corporate network, the only way to protect against a vulnerability
    scanner is to divide each department into VLANs, enforce strong group policies
    that prevent untrusted executables and installations, limit the use of flash drives,
    and provide any form of protection against running unauthorized programs. Employees
    should only run products that help them complete their tasks; websites can swiftly
    shut down those users by enabling a URL blocker and adding security features.


    It is crucial to know what a vulnerability scanner is. This is because this tool
    may be extremely useful in determining what might be a backdoor to your system
    or perhaps your entire network if a hardware firewall has a service or port open
    that should not have been switched on in the first place. Firewall and router
    default settings are excellent because they just work, right? Wrong! It is critical
    to turn off any unused services and to block any ports that are not in use, such
    as `FTP`, `RDP`, `SSH`, and `Telnet`.


    Within Kali Linux, we will be using the Nessus vulnerability scanner. Tenable
    Network Security created Nessus, a proprietary comprehensive vulnerability scanner.
    They sell both personal and commercial software licenses. For demos, we will use
    the personal version.


    One of the most widely used vulnerability scanners is Nessus. It is currently
    used by over 80,000 organizations all around the world. Nessus is a tool that
    automatically detects known security flaws. One of the best features of Nessus
    is that it can be used as both a client and a server. It can be networked, allowing
    scans to be performed from any location. Microsoft Windows, Mac OS X, Linux, FreeBSD,
    Solaris, and IBM/AIX are all supported. For penetration testers, the reporting
    feature is quite useful.


    The following will be detected by Nessus:


    *   Vulnerabilities that provide remote access

    *   Access to sensitive data on a system

    *   Misconfigured systems (missing security patches, open ports, and so on)

    *   Commonly used passwords, default passwords, and blank passwords

    *   Denial of service attacks by using mangled packet

    *   PCI DSS audits

