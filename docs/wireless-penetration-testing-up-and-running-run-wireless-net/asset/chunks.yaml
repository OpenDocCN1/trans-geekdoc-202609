    9. It should display the HTTP request with the username and password in plain
    text, as shown in *[Figure 7.14](#c07.xhtml#fig7_14)*:


    ![](images/Figure-7.14.jpg)


    **Figure 7.14:** HTTP request


    You must use the `HTTPS` protocol to make this connection safe and for a different
    connection, such as `telnet`. `SSH-2` is the only option. `SSH-1` has security
    flaws and is vulnerable to man-in-the-middle attacks. `SSH-1` is no longer supported
    and should be avoided at all costs. Make sure your `sshd` config file is up to
    date, that you have changed the default `SSH` port, that you have limited users’
    `SSH` access, that you have configured the `IDL` logout timeout interval, that
    you have disabled root login, and that you have set a warning banner based on
    your legal terms and legal notice details. Passwords and passwords for `SSH` should
    be strong. One cannot emphasize how critical this is.


    # [Honeypot attacking](#toc.xhtml#s123a)


    Wireless networks are becoming significantly larger in terms of bandwidth and
    range as technology advances. A wireless honeypot can be simply set up by a hacker
    to entice victims into what they assume is a secure wireless network. What is
    a wireless honeypot, and how does it work? **A wireless honeypot** is a device
    that is set up as an access point that has the same `SSID` as another access point
    in the area, as well as a proxy set up to point to the attacker’s computer.


    If a user connects to a honeypot, the attacker can filter or monitor all their
    network activity, potentially resulting in a man-in-the-middle attack. Any unencrypted
    traffic within that connection, such as e-mail, instant messaging, `FTP`, and
    `telnet` sessions, would be visible to the attacker. Refer to *[Figure 7.15](#c07.xhtml#fig7_15)*:


    ![](images/Figure-7.15.jpg)


    **Figure 7.15:** Unencrypted connection


    The client is more than likely to view the attacker’s high-power gain antenna
    at the top of the wireless list for available wireless networks if the attacker
    has one. Another thing to keep in mind is that most Microsoft Windows operating
    systems are set up to connect to a wireless network automatically, which might
    be problematic if a honeypot with an identical `SSID` and password is nearby.
    This feature can be turned off.


    # [Protecting yourself from a honeypot or man-in-the-middle attack](#toc.xhtml#s124a)


    Simply not using wireless is one of the simplest methods to defend yourself from
    a honeypot attack, as shown in *[Figure 7.16](#c07.xhtml#fig7_16)*. What if your
    company requires wireless access? Profiles should be created on `BYOD` devices
    to allow only trusted wireless networks to connect to the client’s devices. Use
    a `3G/4G` or wired connection. What if you still require wireless access? **Wireless
    Intrusion Prevention Systems** (**WIPS**) can detect rogue access points using
    both software and hardware:


    ![](images/Figure-7.16.jpg)


    **Figure 7.16:** Man in the middle attack


    The `SSID`, channel, signal strength, and `MAC` address are used by `WIPS` to
    identify these access points. There is a probability that the `AP` is a honeypot
    if the criteria do not match. What happens if the hacker uses the same `SSID`
    and channel as you? The signal strength will then be used by the `WIPS`. The signal
    intensity can help establish whether an `AP` is real.


    **KFSensor** is a honeypot **intrusion detection system** (**IDS**) for Windows.
    It works as a honeypot, attracting and detecting hackers, worms, rogues, and flaws.
    It can deflect attacks by functioning as a decoy, adding an extra layer of defense.
    The `KFSensor` Interface is shown in *[Figure 7.17](#c07.xhtml#fig7_17)*:


    ![](images/Figure-7.17.jpg)


    **Figure 7.17:** KFSensor interface


    You can download a 30-day trial from **[http://www.keyfocus.net/kfsensor/download/](http://www.keyfocus.net/kfsensor/download/)**.


    # [How to start a fake access point (fake Wi-Fi)](#toc.xhtml#s125a)


    Untrusted Wi-Fi networks, as you may know, can be quite harmful if you join them.
    If you are in a strange place and happen to be connected to an open network, your
    data will be visible to the person in charge of the access point, regardless of
    what device you are using. Not only that but also by hooking you up with a malicious
    Web page or a backdoor, the person in charge can have complete control over your
    device.


    There are numerous ways to accomplish this. You can send the connected user to
    a malicious website that you control and use to hook their devices. Using python
    `MITM` scripts on connected devices, you can also run and execute backdoors. Without
    appearing suspicious, you can even replace the download files that the connected
    users request on the fly.


    Let us look at how to start a fake AP:


    1. First, we will need to update Kali Linux to the latest version and install
    the required packages, as shown in *[Figure 7.18](#c07.xhtml#fig7_18)*:


    ```

    apt-get update

    apt-get install hostapd dnsmasq apache2

    ```


    ![](images/Figure-7.18.jpg)


    **Figure 7.18:** Packages installing


    2. We need to put the wireless card in monitor mode to allow us to sniff the packets
    in and around the network. You can use the method shown in *[Figure 7.19](#c07.xhtml#fig7_19)*:


    ```

    ifconfig wlan0 down

    iwconfig wlan0 mode monitor

    ifconfig wlan0 up

    ```


    ![](images/Figure-7.19.jpg)


    **Figure 7.19:** Wireless card settings


    3. Or if that did not work, you can use the method shown in *[Figure 7.20](#c07.xhtml#fig7_20)*:


    ```

    airmon-ng start wlan0

    ```


    ![](images/Figure-7.20.jpg)


    **Figure 7.20:** airmon-ng command


    4. To make things organized and easier to work with, we will make a new directory
    in root and call it `fap` or a fake access point. Refer to *[Figure 7.21](#c07.xhtml#fig7_21)*:


    ```

    mkdir /root/fap

    cd /root/fap

    ```


    ![](images/Figure-7.21.jpg)


    **Figure 7.21:** mkdir command


    5. Once we are in the `/root/fap` that we created, we will now set up a new `hostapd`
    configuration file and write instructions inside, as shown in *[Figure 7.22](#c07.xhtml#fig7_22)*.
    `hostapd` (Host access point daemon) is a software access point that lets the
    user use his/her wireless adapter to broadcast several access points at the same
    time.


    ```

    nano hostapd.conf

    ```


    `nano`: is a command-line text editor included in most Linux installations.


    `hostapd.conf`: is the name of the configuration file that we created.


    Now, inside `hostapd.conf`, we need to set up instruction orders for it:


    ```

    interface=wlan0

    driver=nl80211

    ssid=Free-Wi-Fi

    hw_mode=g

    channel=1

    macaddr_acl=0

    ignore_broadcast_ssid=0

    ```


    After writing these instructions, press `Ctrl` + `X`, then `Y`, and then `Enter`.
    Now, we are all set for `hostapd.conf`.


    * `interface`: The name of the wireless adapter that we are using in monitor mode.

    * `driver`: The supported driver for `hostapd`.

    * `ssid`: The broadcasted Wi-Fi name.

    * `hw_mode=g`: Simply instruct it to use the 2.4 GHz band.

    * `channel`: The channel number to use for the fake access point.

    * `macaddr_acl=0`: Tells `hostapd` not to use MAC filtering. [`macaddr_acl=1`]
    tells it to use MAC filtering.

    * `ignore_broadcast_ssid=0`: To make the fake access point visible and not hidden.


    Refer to *[Figure 7.22](#c07.xhtml#fig7_22)*:


    ![](images/Figure-7.22.jpg)


    **Figure 7.22:** Nano command


    6. Start the fake access point by doing:


    ```

    hostapd hostapd.conf

    ```


    You will notice that our access point will appear as an open Wi-Fi network. Now,
    open a new terminal window without closing the previous one. In the new terminal
    window, navigate back to the fap directory by doing the following:


    ```

    cd /root/fap

    ```


    Refer to *[Figure 7.23](#c07.xhtml#fig7_23)*:


    ![](images/Figure-7.23.jpg)


    **Figure 7.23:** hostapd command

    '
  trans: '


    9. 它应该显示 HTTP 请求，其中用户名和密码以明文形式呈现，如 *图 7.14* 所示：


    ![](img/Figure-7.14.jpg)


    **图 7.14：** HTTP 请求


    你必须使用 `HTTPS` 协议使此连接安全，对于不同的连接（如 `telnet`）也是如此。`SSH-2` 是唯一的选择。`SSH-1` 存在安全缺陷，易受中间人攻击。`SSH-1`
    不再受支持，应不惜一切代价避免使用。确保你的 `sshd` 配置文件是最新的，你已更改默认的 `SSH` 端口，你已限制用户的 `SSH` 访问，你已配置
    `IDL` 注销超时间隔，你已禁用 root 登录，并且你已根据你的法律条款和法律声明详情设置了警告横幅。`SSH` 的密码应当强健。无法过分强调这一点有多么关键。


    # 蜜罐攻击


    随着技术的进步，无线网络在带宽和范围方面变得大得多。黑客可以简单地建立一个无线蜜罐，诱使受害者进入他们假定为安全的无线网络。什么是无线蜜罐，它是如何工作的？**无线蜜罐**
    是一种设备，它被设置为一个接入点，拥有与该区域内另一个接入点相同的 `SSID`，并设置了一个指向攻击者计算机的代理。


    如果用户连接到蜜罐，攻击者可以过滤或监控其所有网络活动，从而可能导致中间人攻击。该连接内的任何未加密流量（如电子邮件、即时消息、`FTP` 和 `telnet`
    会话）都将对攻击者可见。请参阅 *图 7.15*：


    ![](img/Figure-7.15.jpg)


    **图 7.15：** 未加密连接


    如果攻击者拥有高增益天线，客户端极有可能在可用无线网络列表的顶部看到攻击者的天线。另一点需要注意的是，大多数 Microsoft Windows 操作系统都设置为自动连接到无线网络，如果附近有一个具有相同
    `SSID` 和密码的蜜罐，这可能会造成问题。此功能可以关闭。


    # 保护自己免受蜜罐或中间人攻击


    不使用无线网络是防御蜜罐攻击最简单的方法之一，如 *图 7.16* 所示。如果你的公司需要无线访问怎么办？应在 `BYOD` 设备上创建配置文件，以仅允许受信任的无线网络连接到客户端设备。使用
    `3G/4G` 或有线连接。如果你仍然需要无线访问怎么办？**无线入侵防御系统** (**WIPS**) 可以使用软件和硬件检测流氓接入点：


    ![](img/Figure-7.16.jpg)


    **图 7.16：** 中间人攻击


    `WIPS` 使用 `SSID`、信道、信号强度和 `MAC` 地址来识别这些接入点。如果标准不匹配，则该 `AP` 很有可能是蜜罐。如果黑客使用与你相同的
    `SSID` 和信道会怎样？然后 `WIPS` 将使用信号强度。信号强度有助于确定 `AP` 是否真实。


    **KFSensor** 是一款用于 Windows 的蜜罐 **入侵检测系统** (**IDS**)。它作为一个蜜罐运作，吸引并检测黑客、蠕虫、流氓软件和漏洞。它可以通过作为诱饵来转移攻击，增加一层额外的防御。`KFSensor`
    界面如 *图 7.17* 所示：


    ![](img/Figure-7.17.jpg)


    **图 7.17：** KFSensor 界面


    你可以从 **[`www.keyfocus.net/kfsensor/download/`](http://www.keyfocus.net/kfsensor/download/)**
    下载 30 天试用版。


    # 如何启动虚假接入点（虚假 Wi-Fi）


    正如你所知，不受信任的 Wi-Fi 网络如果你连接它们，可能会造成相当大的危害。如果你身处陌生环境并碰巧连接到了一个开放网络，无论你使用什么设备，你的数据都将对掌管该接入点的人可见。不仅如此，负责人还可以通过将你连接到恶意网页或后门，从而完全控制你的设备。


    有许多方法可以实现这一点。你可以将连接的用户发送到你控制的恶意网站，并用它来挂马控制他们的设备。在连接的设备上使用 python `MITM` 脚本，你也可以运行和执行后门。甚至可以在不引起怀疑的情况下，即时替换连接用户请求的下载文件。


    让我们看看如何启动一个虚假 AP：


    1. 首先，我们需要将 Kali Linux 更新到最新版本并安装所需的包，如 *图 7.18* 所示：


    ```

    apt-get update

    apt-get install hostapd dnsmasq apache2

    ```


    ![](img/Figure-7.18.jpg)


    **图 7.18：** 安装包


    2. 我们需要将无线网卡置于监听模式，以允许我们嗅探网络内外的数据包。你可以使用 *图 7.19* 所示的方法：


    ```

    ifconfig wlan0 down

    iwconfig wlan0 mode monitor

    ifconfig wlan0 up

    ```


    ![](img/Figure-7.19.jpg)


    **图 7.19：** 无线网卡设置


    3. 如果那不起作用，你可以使用 *图 7.20* 所示的方法：


    ```

    airmon-ng start wlan0

    ```


    ![](img/Figure-7.20.jpg)


    **图 7.20：** airmon-ng 命令


    4. 为了使事情井井有条且易于操作，我们将在 root 目录下创建一个新目录并将其命名为 `fap`（虚假接入点）。请参阅 *图 7.21*：


    ```

    mkdir /root/fap

    cd /root/fap

    ```


    ![](img/Figure-7.21.jpg)


    **图 7.21：** mkdir 命令


    5. 一旦我们进入刚创建的 `/root/fap` 目录，我们将建立一个新的 `hostapd` 配置文件并在其中编写指令，如 *图 7.22* 所示。`hostapd`（主机接入点守护进程）是一个软件接入点，允许用户使用其无线适配器同时广播多个接入点。


    ```

    nano hostapd.conf

    ```


    `nano`：是大多数 Linux 安装中包含的命令行文本编辑器。


    `hostapd.conf`：是我们创建的配置文件的名称。


    现在，在 `hostapd.conf` 内部，我们需要为其设置指令顺序：


    ```

    interface=wlan0

    driver=nl80211

    ssid=Free-Wi-Fi

    hw_mode=g

    channel=1

    macaddr_acl=0

    ignore_broadcast_ssid=0

    ```


    写完这些指令后，按 `Ctrl` + `X`，然后按 `Y`，再按 `Enter`。现在，`hostapd.conf` 已全部设置完毕。


    * `interface`：我们在监听模式下使用的无线适配器的名称。

    * `driver`：`hostapd` 支持的驱动程序。

    * `ssid`：广播的 Wi-Fi 名称。

    * `hw_mode=g`：仅指示其使用 2.4 GHz 频段。

    * `channel`：用于虚假接入点的信道编号。

    * `macaddr_acl=0`：告诉 `hostapd` 不使用 MAC 过滤。[`macaddr_acl=1`] 告诉它使用 MAC 过滤。

    * `ignore_broadcast_ssid=0`：使虚假接入点可见且不隐藏。


    请参阅 *图 7.22*：


    ![](img/Figure-7.22.jpg)


    **图 7.22：** Nano 命令


    6. 通过执行以下操作启动虚假接入点：


    ```

    hostapd hostapd.conf

    ```


    你会注意到我们的接入点将显示为一个开放的 Wi-Fi 网络。现在，在不关闭前一个窗口的情况下打开一个新的终端窗口。在新终端窗口中，通过执行以下操作导航回 fap
    目录：


    ```

    cd /root/fap

    ```


    请参阅 *图 7.23*：


    ![](img/Figure-7.23.jpg)


    **图 7.23：** hostapd 命令


    '
