    # 4.3 Strict liability


    For all offences there is a presumption that mens rea is required. The courts
    will always start with this presumption, but if they decide that the offence does
    not require mens rea for at least part of the actus reus then the offence is one
    of strict liability. This idea of not requiring mens rea for part of the offence
    is illustrated by two cases: Prince (1875) and Hibbert (1869). In both these cases
    the charge against the defendant was that he had taken an unmarried girl under
    the age of 16 out of the possession of her father, against his will, contrary
    to s 55 of the Offences Against the Person Act 1861.'
