- pgno: 242
  md: 'for this question is given below. Note that it requires you to work your way
    through each situation stating the law and applying it. Also note that you must
    state whether each statement is accurate or not.


    NOTE This type of question does not require you to cite cases.


    # Statement A


    # Points to be made are:


    +   - Reason that an attempt requires an act which is more than merely preparatory
    to a substantive offence.

    +   - Reason that pulling the gun out of her pocket is getting ready to commit
    the crime.

    +   - Reason that the fact that Elsa does this whilst outside and then puts the
    gun back probably means she has not embarked on the crime proper.

    +   - Reason that Elsa does not commit the offence of attempted robbery.

    +   - Conclude that the statement is inaccurate.


    # Statement B


    # Points to be made are:


    +   - Reason that this offence requires Elsa to enter a building or part of a
    building as a trespasser with an intention to steal, commit GBH or commit damage.

    +   - Reason that completion of the offence does not require the substantive offence
    to be committed.

    +   - Reason that the fact that the shop has no vodka is irrelevant.


    +   - Reason that the offence is complete at the moment of Elsa’s entry because
    she is a trespasser and the owner of the shop would not have allowed her to enter
    if her intention had been known.

    +   - Conclude that the statement is inaccurate.


    # Statement C


    # Points to be made are:


    +   - Reason that robbery requires the use or threat of force before or at the
    time of stealing and in order to steal.

    +   - Reason that kicking Reynard would be enough for force.

    +   - Reason that Elsa has not committed theft since the shop had no vodka.

    +   - Reason that the two elements are not complete and therefore there is no
    robbery.

    +   - Conclude that the statement is inaccurate.


    # Statement D


    # Points to be made are:


    +   - Reason that this offence requires Elsa, having entered a building or part
    of a building as a trespasser goes on to steal, commit GBH or attempt to commit
    GBH.

    +   - Reason that Elsa has entered as a trespasser as the owner of the shop is
    unlikely to have allowed her to enter if her intention had been known.

    +   - Reason that the smashing of the door is criminal damage.

    +   - Reason that this is not a substantive offence included in section 9(1)(b).

    +   - Conclude that the statement is inaccurate.'
