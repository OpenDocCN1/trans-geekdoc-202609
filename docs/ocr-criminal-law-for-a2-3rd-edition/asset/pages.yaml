  md: '# Corcoran v Anderton (1980)


    One of the defendants hit a woman in the back and tugged at her bag. She let go
    of the bag and it fell to the ground. The defendants ran off without the bag (because
    the woman was screaming and attracting attention). It was held that the theft
    was complete so the defendants were guilty of robbery.


    However, if the theft is not completed, for instance if the woman in the case
    of Corcoran v Anderton had not let go of the bag, then there is an attempted theft
    and the defendant could be charged with attempted robbery.


    # 11.1.2 Force or threat of force


    As well as theft the prosecution must prove force or the threat of force. The
    amount of force can be small. This is clearly shown by the case of Dawson and
    James (1976).


    # Dawson and James (1976)


    One of the defendants pushed the victim causing him to lose his balance, which
    enabled the other defendant to take his wallet. They were convicted of robbery.
    The Court of Appeal held that ‘force’ was an ordinary word and it was for the
    jury to decide if there had been force.


    This decision was confirmed in Clouden (1987).


    # Clouden (1987)


    The Court of Appeal held that D was guilty of robbery when he had wrenched a shopping
    basket from the victim’s hand. The Court of Appeal held that the trial judge was
    right to leave the question of whether D had used force on a person to the jury.


    It can be argued that using force on the bag was effectively using force on the
    victim as the bag was wrenched from her hand. However, if a thief pulls a shoulder
    bag so that it slides off the victim’s shoulder, would this be considered force?
    Probably not. It would certainly not be force if a thief snatched a bag which
    was resting (not being held) on the lap of someone sitting on a park bench.


    The definition of robbery makes clear that robbery is committed if D puts or seeks
    to put a person in fear of force. It is not necessary that the force be applied.
    Putting V ‘in fear of being there and then subjected to force’ is sufficient for
    robbery. This covers threatening words, such as ‘I have a knife and I’ll use it
    unless you give me your wallet’, and threatening gestures, such as holding a knife
    in front of V.


    Robbery is also committed even if the victim is not actually frightened by D’s
    actions or words. If D seeks to put V in fear of being then and there subjected
    to force, this element of robbery is present. So if V is a plain clothes policeman
    put there to trap D and is not frightened, the fact that D sought to put V in
    fear is enough.


    A case illustrating the fact that the victim does not have to be frightened and
    also that the amount of force does not have to be great is B and R v DPP (2007).


    # B and R v DPP (2007)


    The victim, a schoolboy aged 16, was stopped by five other school boys. They asked
    for his mobile phone and money. As this was happening, another five or six boys
    joined the first five and surrounded the victim. No serious violence was used
    against the victim, but he was pushed and his arms were held while he was searched.
    The defendants took his mobile phone, £5 from his wallet, his watch and a travel
    card. The victim said that he did not feel particularly threatened or scared but
    that he was bit shocked.


    The defendants appealed against their convictions for robbery on the basis that
    no'
