- pgno: 30
  md: 'If the adult is vulnerable, then the argument for imposing a duty is that the
    person assuming the duty is in the best position to ensure that potential harm
    is avoided. He or she will know of the vulnerability of the victim when others
    do not. This is the reason for placing such a person under a duty to act and making
    them liable for failure to do anything.


    There is also the question of what D needs to do to discharge or fulfil his duty.
    Usually, such a duty can be fulfilled by summoning help. It is not necessary for
    the person to do more than that. In Stone and Dobinson the defendants were found
    guilty because they did not summon help.


    # Medical treatment


    One area where the law seems contradictory is in the duty of doctors. If doctors
    decide it is in the patient’s best interests to withdraw feeding from that patient,
    then they are not liable for any offence in respect of the patient’s death. This
    was the effect of the judgment in Airedale NHS Trust v Bland. Even though by withdrawing
    feeding from an unconscious patient, the medical staff are aware that this will
    cause the patient to die, they are not liable for the omission. The key issue
    being that such a failure to feed has to be in the patient’s best interests.


    However, the House of Lords in Bland emphasised that euthanasia by a positive
    act terminating the patient’s life would remain unlawful.


    # Statutory duties


    Statutes impose duties in a wide variety of situations and make it an offence
    to fail to do something. Many of these are connected with vehicles and/or driving.
    Laws in this area often also impose strict liability. This means that not only
    is the defendant liable because he has failed to do something but, in addition,
    the prosecution do not have to prove that he had any mens rea.


    The justification for this is the greater good of society. If a driver fails to
    get insurance to drive, those injured by him will have difficulty getting compensation
    for their injuries. The defendant himself is unlikely to be able to pay.


    Some of the statutory duties have been imposed because of the difficulty of proving
    an offence. This was the reason for the introduction of the offence of causing
    or allowing the death of a child or vulnerable adult under the Domestic Violence,
    Crime and Victims Act 2004.


    Prior to this Act, where a child had died as a result of physical abuse in the
    home the prosecution used to have difficulty in discovering which member of the
    household had actually caused the death. For example, if both the mother and the
    father were charged with murder of the child then each would blame the other so
    that it could not be proved which one had done it.


    Under the 2004 Act all members of the household are liable for failure to protect
    the child. This makes it much easier to succeed in a prosecution. This is important
    as the law should provide children and vulnerable adults with as much protection
    as possible. The law may have the effect of persuading other family members to
    report the abuse.


    # Self-test Questions


    +   1. Give an example of non-voluntary conduct which would not constitute the
    actus reus of an offence.

    +   2. What is meant by a state of affairs offence?

    +   3. What is the normal rule about whether an omission can constitute the actus
    reus of an offence?

    +   4. What is meant by a ‘Good Samaritan’ law? Give three problems that could
    arise from having such a law.

    +   5. Name two offences created by an Act of Parliament (statutory law) where
    failure to act is the actus reus of the offence.

    +   6. Explain, using a case example, when an omission can be sufficient for the
    actus reus where D has voluntarily undertaken a duty of care.

    +   7. Explain, using a case example, when an omission can be sufficient for the
    actus reus where D is under a duty of care because he has set in motion a chain
    of events.'
