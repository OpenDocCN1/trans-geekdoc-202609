- pgno: 197
  md: 'This allows the judge a wider range of sentencing options.


    Diminished responsibility covers a wider range of mental illnesses than insanity.
    It is much more likely to be used as a defence to a murder charge than insanity.
    In the 1990s there were on average about 50 cases per year where the defendant
    relied successfully on the defence of diminished responsibility. In contrast there
    were only on average about five cases a year where the defendant relied on the
    defence of insanity.


    These figures show that for murder, insanity is not particularly important as
    a defence. There is a better alternative which does not carry the stigma of insanity.


    Interestingly, the use of both defences has gone down in the last nine or ten
    years. There have been only about 20 cases each year where the defendant relied
    on diminished responsibility and only one or two cases where the defence relied
    on the defence of insanity.


    # 12.1.7 Proposals for reform


    There have been several proposals for reform of the law on insanity. In 1953,
    the Royal Commission on Capital Punishment suggested that the M''Naghten Rules
    should be extended so that a defendant would be considered insane if he ''was
    incapable of preventing himself'' from committing the offence. If this had been
    acted upon, then those suffering from ''irresistible impulses'' would have come
    within the definition of insanity.


    However, instead of making this reform, the Government introduced the defence
    of diminished responsibility. This gives a special defence to those charged with
    murder (see section 7.1). It does not give a defence to any other offence, but
    judges have discretion on sentencing for all other offences.


    In 1975, the Butler Committee suggested that the verdict of not guilty by reason
    of insanity should be replaced by a verdict of not guilty on evidence of mental
    disorder.


    In 1989, the Law Commission''s Draft Criminal Code proposed that a defendant should
    be not guilty on evidence of severe mental disorder or severe mental handicap.


    None of these proposals have been made law. However, changes to the ways in which
    judges can deal with a defendant after they are found not guilty by reason of
    insanity, has improved matters. As explained in section 12.1.5, a judge can now
    make a supervision and treatment order or even give an absolute discharge where
    that is suitable.


    # Self-test Questions


    +   1. Which Rules set out the law on insanity as a defence to a criminal charge?

    +   2. What must a defendant prove in order to establish a defence of insanity?

    +   3. For what types of offences is insanity NOT available as a defence?

    +   4. The definition of insanity includes the phrase ‘disease of the mind’. Give
    three cases or examples of different diseases which have been held to come within
    the legal definition of insanity.

    +   5. Can an external cause give rise to insanity as a defence to a criminal
    charge?

    +   6. In what ways may a defendant not ‘know the nature and quality’ of his act?

    +   7. What did the cases of Windle (1952) and Johnson (2007) decide?

    +   8. If the defence of insanity is successful what verdict is given and what
    powers has the judge in respect of the defendant?

    +   9. One problem in the law of insanity is the way it can apply to diabetics.
    Explain when the defence may be available to a diabetic and when it may not be
    available.

    +   10. Explain two other problems with the defence of insanity.'
