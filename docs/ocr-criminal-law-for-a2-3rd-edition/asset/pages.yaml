  md: 'dishonest as he was owed the same amount for consultation fees. The trial judge
    directed the jury that they must apply their own standards to decide if what he
    did was dishonest. He was convicted and appealed against the conviction.


    The Court of Appeal decided that the test for dishonesty has both an objective
    and a subjective element to it:


    +   - Was what was done dishonest according to the ordinary standards of reasonable
    and honest people?

    +   - Did the defendant realise that what he was doing was dishonest by those
    standards?


    defendant intends to replace the money later as was shown in Velumyl (1989).


    # Velumyl (1989)


    D, a company manager, took £1,050 from the office safe. He said that he was owed
    money by a friend and he was going to replace the money when that friend repaid
    him. The Court of Appeal upheld his conviction for theft as he had the intention
    of permanently depriving the company of the banknotes which he had taken from
    the safe, even if he intended replacing them with other banknotes to the same
    value later.


    The Ghosh test means that the jury has to start with an objective test. Was what
    was done dishonest by the ordinary standards of reasonable and honest people?
    If it was not dishonest by those standards, that is the end of the matter and
    the prosecution fails. The defendant is not guilty. However, if the jury decides
    that it was dishonest by those standards then they must consider the more subjective
    test of whether the defendant knew it was dishonest by those standards.


    This second test is not totally subjective as the defendant is judged by what
    he realised ordinary standards were. This prevents a defendant from saying that,
    although he knew that ordinary people would regard his actions as dishonest, he
    did not think that those standards applied to him.


    In a trial the judge will use the Ghosh test to direct the jury only where there
    is an issue about dishonesty.


    # 10.5 ‘Intention of permanently depriving’


    The final element which has to be proved for theft is that the defendant had the
    intention permanently to deprive the other of the property. In many situations
    there is no doubt that the defendant had such an intention; for example, where
    an item is taken and sold to another person or where cash is taken and spent by
    the defendant. This last example is true even if the


    Another situation where there is a clear intention to permanently deprive is where
    the defendant destroys property belonging to another. This can be charged as theft,
    although it is also criminal damage.


    There are, however, situations where it is not so clear and, to help in these,
    s 6 of the Theft Act 1968 explains and expands the meaning of the phrase. It provides
    that, even though a person appropriating property belonging to another does not
    mean the other permanently to lose the thing itself, he can be regarded as having
    the intention to permanently deprive the other of it if his intention is to treat
    the thing as his own to dispose of, regardless of the other’s rights.


    The Court of Appeal has stated that the meaning of ‘dispose of’ should be that
    given by the Shorter Oxford Dictionary, which is: To deal with definitely: to
    get rid of; to get done with, finish. To make over by way of sale or bargain or
    sell’.


    However, in DPP v Lavender (1994) the Divisional Court ruled that the dictionary
    definition of ‘dispose of’ was too narrow as a disposal could include ‘dealing
    with’ property.


    # DPP v Lavender (1994)


    D took doors from a council property which was being repaired and used them to
    replace damaged doors in his girlfriend’s council flat.'
