    3.10 Other problems arise out of the Lord Chancellor’s use of the terminology
    of “duty of care” and “negligence”, and his linkage of the civil and criminal
    law in his speech. The meanings of these words are not entirely clear in a criminal
    law context, nor is it clear to what extent they mean the same things in tort
    and in criminal law.


    3.11 As we explained in Consultation Paper No 135, “negligence” in the context
    of the crime of manslaughter probably means nothing more than “carelessness”:
    it does not carry the technical meaning that it has in the law of tort, where
    it depends on the existence of a duty of care owed and a breach of that duty.
    The Lord Chancellor said in Adomako that “the ordinary principles of the law of
    negligence apply to ascertain whether or not the defendant has been in breach
    of a duty of care towards the victim who has died”. This equation of the civil
    and criminal law concepts of negligence causes no problems where, as in Adomako
    itself, a death is caused by a badly performed positive act of the accused, because
    it is virtually certain that both tort and criminal law would hold that a duty
    was owed to the deceased not to injure him by a positive act.


    3.12 It is possible, however, that the courts in future cases of omission might
    feel obliged to apply the decision in Adomako. If so, they would run into difficulties,
    because it is by no means certain that the scope of liability for negligent omissions
    is the same in criminal law as it is in tort. For example, in criminal law it
    would seem that once someone has voluntarily taken some steps to care for another,
    he may be liable if his care is not adequate and the other person dies. In tort,
    however, there is probably no liability if the defendant abandons an effort to
    care for someone and that person dies, unless he causes harm through his own incompetence.


    3.13 It is possible, therefore, that the decision in Adomako may have changed
    the criminal law in relation to liability for omissions, by equating it


