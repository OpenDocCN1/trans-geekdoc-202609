  md: "> (b) a result when he is aware of a risk that it will occur, and it is, in\
    \ the circumstances known to him, unreasonable to take the risk.'\n\nThe reasons\
    \ for the defendant taking the risk are not relevant. It does not matter whether\
    \ it was done because the defendant was in a temper or he chose to disregard the\
    \ risk or simply did not care about the risk.\n\nThe important point is that the\
    \ defendant must be aware of the risk. This is the subjective aspect of recklessness.\n\
    \n# General application of law on recklessness\n\nInitially it was thought that\
    \ this decision in *G and another* only affected the law on recklessness in relation\
    \ to criminal damage. However, the *G and another* version of recklessness has\
    \ been applied by the Court of Appeal to other areas of law. For example, they\
    \ applied the subjective recklessness test in the case of *Attorney-General’s\
    \ Reference (No 3 of 2003)* (2004). This case was about a very different area\
    \ of law as it involved the common law offence of wilful misconduct in a public\
    \ office.\n\nSo now the law is clear. Where recklessness is sufficient for the\
    \ *mens rea* of an offence, it must be subjective. The prosecution must prove\
    \ that the defendant realised the risk and decided to take it.\n\n# 3.2.3 Recklessness\
    \ in manslaughter\n\nAn area in which subjective recklessness has been re-established\
