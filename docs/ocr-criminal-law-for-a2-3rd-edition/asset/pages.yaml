    +   5. What other qualifying trigger could D rely on?

    +   6. What does the Act specifically exclude as a qualifying trigger?

    +   7. What standard of self-control is D judged against?

    +   8. Give two problems in the old law on provocation.

    +   9. Explain two ways in which the law has been improved by the defence of loss
    of control.

    +   10. Give two problems that exist with the law of loss of control.


    # Key facts


    | | Law |

    |---|---|

    | Main points of defence | D must have lost self-control.

    There must be a qualifying trigger.

    A person of the same sex and age would have reacted in the same way as D in the
    same circumstances. |

    | Loss of control | This need not be sudden. |

    | Qualifying triggers | Either or both of the following:

    • fear of serious violence

    • a thing or things done or said which constituted circumstances of an extremely
    grave character and caused D to have a justifiable sense of being seriously wronged.
    |

    | Standard of self-control | That of a person of D''s sex and age, with a normal
    degree of tolerance and self-restraint. |

    | Circumstances of D | Circumstances of D (which do not have a bearing on capacity
    for self-control) can be taken into consideration in deciding whether a normal
    person might have reacted in the same way. |

    | Effect of defence | Reduces charge of murder to manslaughter. |'
