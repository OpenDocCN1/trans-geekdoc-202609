- pgno: 98
  md: '# Key facts


    | Term | Law | Act/Case |

    |---|---|---|

    | Definition | Suffering from an abnormality of mental functioning which: arose
    from a recognised medical condition substantially impaired D’s ability to do one
    or more of the following: understand the nature of the conduct form a rational
    judgement exercise self-control; and provided an explanation for D’s conduct.
    | s 2(1) Homicide Act 1957 (as amended by the Coroners and Justice Act 2009) |

    | Abnormality of mental functioning | A state of mind so different from that of
    ordinary human beings that the reasonable man would term it abnormal | Byrne (1960)
    |

    | Substantially impaired | A question of degree for the jury to decide. ''Substantial''
    does not mean ''total'' nor ''trivial'' or ''minimal'' but something in between.
    | Byrne (1960) Lloyd (1967) |

    | Provides an explanation for D’s conduct | The abnormality of mental functioning
    provides an explanation for D’s conduct if it causes, or is a significant contributory
    factor in causing, D to carry out that conduct. | s 2(1B) Homicide Act 1957 |

    | Effect of intoxication | Transient effect of drink or drugs on brain is not
    an injury. Where the defendant has a pre-existing mental disorder, intoxication
    does not prevent him using the defence; the abnormality of mental functioning
    does not have to be the sole cause of the defendant doing the killing. Alcohol
    Dependency Syndrome can be an abnormality of mental functioning. | Di Duca (1959)
    Dietschmann (2003) Wood (2008) |

