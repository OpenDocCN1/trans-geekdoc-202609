  md: "# ### 9.1.1 Definition of assault and battery\n\n> **Definition**\n> \n> **Assault**\n\
    > \n> An act which causes the victim to apprehend the infliction of immediate,\
    \ unlawful force with either an intention to cause another to fear immediate unlawful\
    \ personal violence or recklessness as to whether such fear is caused.\n\n> **Definition**\n\
    > \n> **Battery**\n> \n> The application of unlawful force to another person intending\
    \ either to apply unlawful physical force to another or recklessness as to whether\
    \ unlawful force is applied.\n\n# ### ‘Apprehend immediate unlawful force’\n\n\
    The important point is that the act or words must cause the victim to apprehend\
    \ that immediate force is going to be used against them. There is no assault if\
    \ the situation is such that it is obvious that the defendant cannot actually\
    \ use force. For example, where the defendant shouts threats from a passing train\
    \ there is no possibility that he can carry out the threats in the immediate future.\n\
    \nIt was decided in *Lamb* (1967) that pointing an unloaded gun at someone who\
    \ knows that it is unloaded cannot be an assault. This is because the other person\
    \ does not fear immediate force. However, if the other person thought the gun\
    \ was loaded then this could be an assault.\n\nFear of immediate force is necessary;\
    \ immediate does not mean instantaneous, but ‘imminent’, so an assault can be\
    \ through a closed window, as in *Smith v Chief Superintendent of Woking Police\
    \ Station* (1983).\n\n# ### 9.1.2 *Actus reus* of assault\n\nAn assault is also\
    \ known as a technical assault or a psychic assault. There must be:\n\n+   - an\
    \ act\n+   - which causes the victim to apprehend the infliction of immediate,\
    \ unlawful force.\n\n# ### An ‘act’\n\nAn assault requires some act or words.\
    \ An omission is not sufficient to constitute an assault. However, words are sufficient\
    \ for an assault. These can be verbal or written. In *Constanza* (1997) the Court\
    \ of Appeal held that letters could be an assault. The defendant had written 800\
    \ letters and made a number of phone calls to the victim. The victim interpreted\
    \ the last two letters as clear threats. The Court of Appeal said there was an\
    \ assault as there was a ‘fear of violence at some time, not excluding the immediate\
    \ future’.\n\nIn *Ireland* (1997) it was held that even silent telephone calls\
    \ can be an assault. It depends on the facts of the case.\n\n> #### *Smith v Chief\
    \ Superintendent of Woking Police Station* (1983)\n> \n> D broke into a garden\
    \ and looked through V’s bedroom window on the ground floor at about 11 pm one\
    \ evening. V was terrified and thought that D was about to enter the room. Although\
    \ D was outside the house and no attack could be made at that immediate moment,\
    \ the court held that V was frightened by his conduct. The basis of the fear was\
    \ that she did not know what he was going to do next, but that it was likely to\
    \ be of a violent nature. Fear of what he might do next was sufficiently immediate\
    \ for the purposes of the offence.\n\nWords indicating that there will be no violence\
    \ may prevent an act from being an assault. This is a principle which comes from\
    \ the old case of *Tuberville v Savage* (1669) where the defendant placed one\
    \ hand on his sword and said, ‘If it were not assize time, I would not take such\
    \ language’"
