  md: 'this case). In this case the Court of Appeal said that the jury had to be satisfied
    that D had made ‘an effective and substantial entry’.


    However, in Brown (1985) this concept of ‘an effective and substantial entry’
    was modified to ‘effective entry’.


    # Brown (1985)


    D was standing on the ground outside but leaning in through a shop window rummaging
    through goods. His feet and lower part of his body were outside the shop, but
    the top part of his body and his arms were inside the shop. The Court of Appeal
    said that the word ‘substantial’ did not materially assist the definition of entry
    and his conviction for burglary was upheld as clearly in this situation his entry
    was effective.


    However, in another case, Ryan (1996), the need for an ‘effective’ entry does
    not appear to have been followed.


    # Ryan (1996)


    In this case the defendant was trapped when trying to get through a window into
    a house at 2.30 am. His head and right arm were inside the house but the rest
    of his body was outside. The fire brigade had to be called to release him. This
    could scarcely be said to be an ‘effective’ entry. However, the Court of Appeal
    upheld his conviction for burglary saying that there was evidence on which the
    jury could find that the defendant had entered.


    # 11.2.2 Building or part of a building


    The Theft Act 1968 gives an extended meaning to the word ‘building’ so that it
    includes inhabited places such as houseboats or caravans, which would otherwise
    not be included in the offence. However, it does not give any basic definition
    for ‘building’. Usually there is no problem. Clearly houses, blocks of flats,
    offices, factories


    and so on are buildings. The word also includes outbuildings and sheds.


    The main problems for the courts have occurred where a structure such as a portacabin
    has been used for storage or office work. There are two cases on whether a large
    storage container is a building. In these cases the court came to different decisions
    after looking at the facts.


    +   - In B and S v Leathley (1979) a 25-foot-long freezer container had been kept
    in a farmyard for over two years. It was used as a storage facility. It rested
    on sleepers, had doors with locks and was connected to the electricity supply.
    This was held to be a building.


    +   - In Norfolk Constabulary v Seekings and Gould (1986) a lorry trailer with
    wheels which had been used for over a year for storage, had steps providing access
    and was connected to the electricity supply, was held not to be a building. The
    fact that it had wheels meant that it remained a vehicle.


    # ''Part of a building''


    The phrase ‘part of building’ is used to cover situations in which the defendant
    may have permission to be in one part of the building (and therefore is not a
    trespasser in that part) but does not have permission to be in another part.


    A case example to demonstrate this is Walkington (1979).


    # Walkington (1979)


    D went into a counter area in a shop and opened a till. This area was clearly
    marked by a three-sided counter. D’s conviction for burglary under s 9(1)(a) was
    upheld as he had entered part of a building (the counter area) as a trespasser
    with the intention of stealing.


    The critical point in Walkington was that the counter area was not an area where
    customers were permitted to go. It was an area for the use of staff, so D was
    a trespasser.'
