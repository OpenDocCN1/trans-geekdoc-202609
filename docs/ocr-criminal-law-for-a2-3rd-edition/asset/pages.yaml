    1.64 In structuring the general homicide offences we have been guided by a key
    principle: the “ladder” principle. Individual offences of homicide should exist
    within a graduated system or hierarchy of offences. This system or hierarchy should
    reflect the offence’s degree of seriousness, without too much overlap between
    individual offences. The main reason for adopting the “ladder” principle is as
    Lord Bingham has recently put it (in a slightly different context): The interests
    of justice are not served if a defendant who has committed a lesser offence is
    either convicted of a greater offence, exposing him to greater punishment than
    his crime deserves, or acquitted altogether, enabling him to escape the measure
    of punishment which his crime deserves. The objective must be that defendants
    are neither over-convicted nor under-convicted …


    1.65 The “ladder” principle also applies to sentencing. The mandatory life sentence
    should be confined to the most serious kinds of killing. A discretionary life
    sentence should be available for less serious (but still highly blameworthy) killings.


    1.66 Partial defences currently only affect the verdict of murder. This is because
    a verdict of murder carries a mandatory sentence. That sentence is not appropriate
    where there are exceptional mitigating circumstances of the kind involved in the
    partial defences. These mitigating circumstances necessitate a greater degree
    of judicial discretion in sentencing. The law creates this discretion by means
    of the partial defences which reduce what would otherwise be a verdict of murder,
    which carries a mandatory sentence, to manslaughter, which does not. Therefore,
    our recommended scheme does not extend the application of the partial defences
    to second degree murder or manslaughter. These offences would permit the trial
    judge discretion


    in sentencing and they therefore lack the primary justification for having partial
    defences.


    # The structure of offences


    1.67 We believe that the following structure would make the law of homicide more
    coherent and comprehensible, whilst respecting the principles just set out above:


    +   1. **First degree murder** (mandatory life penalty)

    +      - (a) Killing intentionally.

    +      - (b) Killing where there was an intention to do serious injury, coupled
    with an awareness of a serious risk of causing death.

    +   2. **Second degree murder** (discretionary life maximum penalty)

    +      - (a) Killing where the offender intended to do serious injury.

    +      - (b) Killing where the offender intended to cause some injury or a fear
    or risk of injury, and was aware of a serious risk of causing death.

    +      - (c) Killing in which there is a partial defence to what would otherwise
    be first degree murder.

    +   3. **Manslaughter** (discretionary life maximum penalty)

    +      - (a) Killing through gross negligence as to a risk of causing death.

    +      - (b) Killing through a criminal act:

    +        - (i) intended to cause injury; or

    +        - (ii) where there was an awareness that the act involved a serious risk
    of causing injury.

    +      - (c) Participating in a joint criminal venture in the course of which
