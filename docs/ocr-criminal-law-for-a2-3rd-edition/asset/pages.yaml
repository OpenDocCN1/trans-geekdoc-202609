  md: "# 9.7 Self-defence/defence of another/prevention of crime\n\nThis covers not\
    \ only actions needed to defend oneself from an attack, but also actions taken\
    \ to defend another. The defences of self-defence and defence of another are common-law\
    \ defences which justify the defendant’s actions. In addition there is a statutory\
    \ defence of prevention of crime under s 3(1) of the Criminal Law Act 1967 which\
    \ states that:\n\n> ‘a person may use such force as is reasonable in the circumstances\
    \ in the prevention of crime.’\n\n# 9.7.1 Degree of force\n\nThe amount of force\
    \ which can be used in self-defence, defence of another or in prevention of crime\
    \ is now explained in the Criminal Justice and Immigration Act 2008. This states\
    \ that, in deciding whether the force used is reasonable in the circumstances:\n\
    \n> (a) that a person acting for a legitimate purpose may not be able to weigh\
    \ to a nicety the exact measure of any necessary action; and\n> \n> (b) that evidence\
    \ of a person’s having only done what the person honestly and instinctively thought\
    \ was necessary for a legitimate purpose constitutes strong evidence that only\
    \ reasonable action was taken by that person for that purpose.\n\nThis allows\
    \ for the fact that a person who is facing an attack by another is under stress\
    \ and cannot be expected to calculate the exact amount of force which needs to\
    \ be used in the circumstances. If there is evidence that the person ‘honestly\
    \ and instinctively’ thought the level of force he used to protect himself or\
    \ another or to\n\nprevent crime was reasonable, then this provides strong evidence\
    \ that the defensive action taken was reasonable in the circumstances.\n\nHowever,\
    \ if the force is used after all danger from the assailant is over (ie as retaliation\
    \ or revenge), the defence is not available.\n\n# 9.7.2 Mistaken use of force\
    \ in self-defence\n\nIn looking at the circumstances, the defendant must be judged\
    \ on the facts as he genuinely believed them to be. In Williams (1987) it was\
    \ ruled that the defendant should be judged according to his genuine mistaken\
    \ view of the facts, regardless of whether this mistake was reasonable or unreasonable.\
    \ This allowed Williams to use the defence of protection of others.\n\n# Williams\
    \ (1987)\n\nD was on a bus when he saw what he thought was a man assaulting a\
    \ youth. In fact it was a man trying to arrest the youth for mugging an old lady.\
    \ D got off the bus and asked what was happening. The man said that he was a police\
    \ officer arresting the youth, but when D asked him to show his police ID card\
    \ he could not do so. There was then a struggle between D and the man in which\
    \ the man was injured. D was convicted of assault after the judge directed them\
    \ that D only had a defence if his mistake was a reasonable one.\n\nThe Court\
    \ of Appeal quashed his conviction because the jury should have been told that\
    \ if they thought the mistake was genuine they should judge the defendant according\
    \ to his genuine mistaken view of the facts, regardless of whether this mistake\
    \ was reasonable or unreasonable.\n\nSection 76 of the Criminal Justice and Immigration\
    \ Act 2008 puts the decision in"
