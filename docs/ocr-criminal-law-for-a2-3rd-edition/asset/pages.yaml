    | Offence | Actus reus | Consequence (injury) required | Mens rea |

    |---|---|---|---|

    | Assault | Causing V to fear immediate unlawful violence. Requires an act but
    can be by silent telephone calls, Ireland (1997) or letters, Constanza (1997).
    | None needed. | Intention of, or subjective reckless as to, causing V to fear
