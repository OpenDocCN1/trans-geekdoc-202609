  md: '# 7.2.5 Reform of the law


    The Coroners and Justice Act 2009 abolished the old defence of provocation and
    replaced it with the defence of loss of control. This reform was made because
    there had been many problems with the law on provocation.


    # Problems with provocation


    The defence of provocation was a common law one, created by judges a long time
    ago. In 1957 the Homicide Act set out some of the tests for provocation, but did
    not give a complete definition. Not giving a full definition created problems
    as the law in previous cases had to be considered as well as the test in the Homicide
    Act.


    A main problem in provocation was the wording of the test in the Homicide Act.
    This stated that the jury had to decide whether D was provoked to lose his self-control
    and, if so, whether provocation was enough to make a reasonable man do as D did.


    The use of the term reasonable man initially created problems as it was held that
    this meant a reasonable adult. However, in *Camplin* (1978), where D was a 15-year-old
    boy, it was held that the age and sex of D could be considered. Age and sex are
    now considered in the loss of control defence.


    It was also held in *Camplin* that other characteristics of D could be considered
    in regard to the gravity of the provocation to him. In the defence of loss of
    control, this has been changed to ‘circumstances’. This is wider than characteristics,
    though the courts had been generous in their interpretation of characteristics.
    This was shown by the fact that the court allowed D’s history of sexual abuse
    to be considered in the case of *Hill* (2008) (see section 7.2.4).


    In fact in *Morhall*, the House of Lords had even allowed the fact that D was
    addicted to glue-sniffing to be considered when deciding the gravity of the provocation
    to


    him. This will probably be ‘circumstances’ that would also be considered in the
    defence of loss of control.


    # Comparison of provocation and loss of control


    In some ways, the defence of loss of control is wider than the defence of provocation.
    In particular, the loss of control does not have to be sudden. Also fear of serious
    violence is an additional matter which can be considered.


    In other ways the defence of loss of control is narrower than the defence of provocation.
    In particular, sexual infidelity is no longer allowed as a qualifying trigger.


    Also where D is relying on things said and/or done, then they must be of an extremely
    grave character. This was not the situation in provocation and some of the cases
    where that defence was allowed would not come within the new defence of loss of
    control. An example is the case of *Doughty* (1986) where it was held that the
    continual crying of 19-day-old baby could be provocation.


    The things said and/or done must also cause D to have a justifiable sense of being
    seriously wronged. *Doughty* would also fail this test.


    # 7.2.6 Problems remaining in the law


    # Loss of self-control


    The Law Commission had proposed removing the loss of self-control criteria completely.
    This was because it is recognised that women in abusive relationships may kill
    from ‘a combination of anger, fear, frustration and a sense of desperation’.


    The Government decided not to follow this proposal. D must prove loss of self-control.
    The only concession is that the loss of control need not be sudden. It is probable
    that some abused women will not be able show loss of control and so will not be
    able to use the defence.'
