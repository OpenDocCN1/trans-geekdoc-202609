- pgno: 69
  md: '# Boyle and Boyle (1987)


    The defendants were found standing by a door of which the lock and one hinge were
    broken. Their conviction for attempted burglary was upheld.


    The Court of Appeal held that the test to use was whether the defendant was embarking
    on the crime proper. In this case, once the defendants had entered they would
    be committing burglary, so trying to gain entry was an attempt.


    # Tosti (1997)


    D intended to burgle premises. He took metal cutting equipment with him and hid
    it behind a hedge near to the premises. He then examined the padlock on the door.
    He did not damage the padlock. He was found guilty of attempted burglary.


    The difference from Campbell for both these cases is that burglary is committed
    at the moment D enters as a trespasser with intent to steal (or do certain other
    offences). Robbery is not committed until D uses force in order to steal. Walking
    into a building still leaves another step before the crime proper is committed.


    In the next case, Jones (1990), the defendant had done almost everything he could
    before committing the full offence.


    # Jones (1990)


    D’s partner told him that she wanted their relationship to end and that she was
    seeing another man, V. D bought a shotgun and shortened the barrel. D then found
    V, who was in his car. D, who was wearing a crash helmet with the visor down,
    got into V’s car and pointed the gun at V. V grabbed the gun and managed to throw
    it out of the car window. D’s conviction for attempted murder was upheld.


    # Key Cases


    | Case | Facts | Offence attempted | Point of law |

    |---|---|---|---|

    | *Cases where there was sufficient for an attempt* | | | |

    | A-G''s reference (No 1 of 1992)(1993) | D tried to rape a girl but could not
    get an erection. | Rape | Need not have performed the last act. |

    | Boyle and Boyle (1987) | Standing by door with broken lock. | Burglary | Had
    done part of a series of acts. |

    | Jones (1990) | Gun safety catch was left on. | Murder | Sufficient evidence
    to leave the question of whether there was an attempt to the jury. |

    | *Cases which were merely preparatory* | | | |

    | Guillefer (1987) | Disrupted race intending to reclaim bet. | Theft | Has D
    ''embarked upon the crime proper''? |

    | Geddes (1996) | In school with knife, rope and tape. | False imprisonment |
    Has D ''actually tried to commit the offence in question''? |

    | Campbell (1990) | Outside post office with imitation gun and threatening note.
    | Robbery | Merely preparatory. |


    Figure 5.2 Key cases chart on ''merely preparatory'' in attempts'
