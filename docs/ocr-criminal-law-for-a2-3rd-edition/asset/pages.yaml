- pgno: 64
  md: 'an offence is meant to be one of strict liability or not. This would mean that
    there would be no need for the courts to use complicated rules of interpretation
    in order to decide if an offence is one of strict liability or not. It would be
    clear to everybody.


    The Draft Criminal Code suggested this could be done by including the presumption
    of *mens rea* in the Code. Clause 20 of the draft Code states:


    > > ‘Every offence requires a fault element of recklessness with respect to each
    of its elements other than fault elements, unless otherwise provided.’


    Another way of reforming strict liability could be by requiring each offence to
    have a defence of due diligence. This would avoid the injustice of those who have
    taken all possible care being guilty of an offence. This would be in line with
    the law in Australia and Canada where judges have developed a general ‘no-negligence’
    defence.


    Yet another way of reforming the law on strict liability could be to have a rule
    that no offence carrying the penalty of imprisonment could be an offence of strict
    liability. This reform is not so wide-ranging as the two ideas above, but it still
    promotes justice as it would ensure that no one could be imprisoned for a breach
    of strict liability.


    Finally, an alternative way of reforming strict liability law might be by removing
    regulatory offences from the criminal system. These could instead be treated as
    administrative issues.


    However, this type of reform could not be applied to mainstream criminal offences
    of strict liability, such as those in the Sexual Offences Act 2003. These would
    have to remain in the criminal law with the risk of injustice to those convicted
    of such offences as in the case of *R v G*.


    # Self-test Questions


    +   1. What three existing common-law offences are ones of strict liability?

    +   2. When considering whether a statutory offence is one of strict liability,
    what is the starting point in regard to *mens rea*?

    +   3. What did the case of *Sweet v Parsley* decide?

    +   4. What are the five points given in *Gammon (Hong Kong) v Attorney-General
    of Hong Kong* which should be considered when deciding whether a statutory offence
    is one of strict liability?

    +   5. Give three examples of ‘quasi-criminal’ offences.

    +   6. Social utility is the main justification for having offences of strict
    liability. Explain why this is so.

    +   7. Give three other justifications for having offences of strict liability.

    +   8. Briefly explain three arguments against having offences of strict liability.

    +   9. In what way did the Draft Criminal Code suggest reforming the law on strict
    liability?

    +   10. Give two other ways in which the law on strict liability could be reformed.'
