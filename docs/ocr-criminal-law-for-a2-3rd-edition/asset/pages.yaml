  md: '# ### 9.3.1 Wound


    ‘Wound’ means a cut or a break in the continuity of the whole skin. A cut of internal
    skin, such as in the cheek, is sufficient, but internal bleeding where there is
    no cut of the skin is not sufficient. In *JJC v Eisenhower* (1983) the victim
    was hit in the eye by a shotgun pellet. This did not penetrate the eye but did
    cause severe bleeding under the surface. As there was no cut, it was held that
    this was not a wound. The cut must be of the whole skin, so that a scratch is
    not considered a wound.


    Even a broken bone is not considered a wound, unless the skin is broken as well.
    In the old case of *Wood* (1830) the victim’s collar bone was broken but, as the
    skin was intact, it was held there was no wound.


    # ### 9.3.2 Grievous bodily harm


    It was held in *DPP v Smith* (1961) that grievous bodily harm means ‘really serious
    harm’. The harm does not have to be life-threatening and in *Saunders* (1985)
    it was held that it was permissible to direct a jury that there need be ‘serious
    harm’ not including the word ‘really’.


    In *Bollom* (2004) it was held that the severity of the injuries should be assessed
    according to the victim’s age and health.


    > > *Bollom (2004)*

    > >

    > > A 17-month-old child had bruising to her abdomen, both arms and left leg.
    D was convicted of causing grievous bodily harm. The Court of Appeal quashed his
    conviction and substituted a conviction for assault occasioning actual bodily
    harm. However, the Court of Appeal stated that bruising could amount to grievous
    bodily harm. Bruising of this severity would be less serious on an adult in full
    health, than on a very young child.


    In *Burstow* (1997) where the victim of a stalker suffered a severe depressive
    illness as a result of his conduct, it was decided that serious psychiatric injury
    can be grievous bodily harm.


    In *Dica* (2004) there was the first ever conviction for causing grievous bodily
    harm through infecting victims with the HIV virus. The defendant had had unprotected
    sex with two women without telling them he was HIV-positive. Both women became
    infected as a result. Although on appeal the defendant’s convictions was quashed
    on the question of consent and the case sent for re-trial, there was no doubt
    that infecting someone with HIV was inflicting grievous bodily harm. At his re-trial
    the defendant was convicted.


    # ### 9.3.3 Inflicting grievous bodily harm


    Section 20 uses the word ‘inflict’. Originally, this was taken as meaning that
    there had to be a technical assault or battery. Even so it allowed the section
    to be interpreted quite widely, as shown in *Lewis* (1974) where D shouted threats
    at his wife through a closed door in a second-floor flat and tried to break his
    way through the door. The wife was so frightened that she jumped from the window
    and broke both her legs. D was convicted of a s 20 offence. The threats could
    be considered as a technical assault.


    In *Burstow* (1997) it was decided that ‘inflict’ does not require a technical
    assault or a battery.


    > > *Burstow (1997)*

    > >

    > > D carried out an eight-month campaign of harassment against a woman with whom
    he had a brief relationship some three years earlier. The harassment consisted
    of both silent and abusive telephone calls, hate mail and stalking. This caused
    V to suffer from severe depression. D’s conviction under s 20 OAPA 1861 was upheld
    by the House of Lords.


    This means that it need only be shown that the defendant’s actions have led to
    the consequence of the victim suffering grievous bodily harm. The decision also
    means that there now appears to be little, if any, difference in the *actus reus*
    of the offences under s 20 and s 18 which uses the word ‘cause’. In fact, in *Burstow*
    (1997) Lord Hope'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'said that for all practical purposes there was no difference between the two
    words.


    # 9.3.4 Mens rea of s 20


    The word used in the section is ‘maliciously’. In Cunningham (1957) (see section
    3.2.1) it was held that ‘maliciously’ did not require any ill will towards the
    person injured. It simply meant either:


    +   - an intention to do the particular kind of harm that was in fact done, or

    +   - recklessness as to whether such harm should occur or not (ie the accused
    has foreseen that the particular kind of harm might be done, and yet gone on to
    take the risk of it).


    | Offence | Mens rea | Injury |

    |---|---|---|

    | S 18 | Specific intent to cause grievous bodily harm or resist arrest etc. |
    Wound or grievous bodily harm. |

    | S 20 | Intention OR recklessness as to some harm. |  |

    | S 47 | Intention OR recklessness as to putting V in fear of unlawful force or
    applying unlawful force assault. | Actual bodily harm. |

    | Common assault |  | No injury. |


    Figure 9.4 Different levels of mens rea and injury for assault cases


    In Parmenter (1991) the House of Lords confirmed that the Cunningham meaning of
    recklessness applies to all offences in which the statutory definition uses the
    word ‘maliciously’.


    So, for the mens rea of s 20 the prosecution can prove either that the defendant
    intended to cause another person some harm or that he was subjectively reckless
    as to whether another person suffered some harm.


    This left another point which the courts had to resolve. What was meant by the
    particular kind of harm? Does the defendant need to realise the risk of a wound
    or grievous bodily harm? It was decided by the House of Lords in Parmenter that,
    although the actus reus of s 20 requires a wound or grievous bodily harm, there
    is no need for the defendant to foresee this level of serious injury.


    # Parmenter (1991)


    D injured his three-month-old baby when he threw the child in the air and caught
    him. D said that he had often done this with slightly older children and did not
    realise that there was risk of any injury. He was convicted of an offence under
    s 20. The House of Lords quashed this conviction as there was no evidence that
    he foresaw any injury, but substituted a conviction for assault occasioning actual
    bodily harm under s 47.


    This decision means that, although there are four offences which appear to be
    on a ladder in terms of seriousness, there is overlap in terms of the mens rea.


    # 9.4 Wounding or causing grievous bodily harm with intent


    This offence under s 18 OAPA 1861 is often referred to as ‘wounding with intent’.
    In fact, it covers a much wider range of offences than this implies.


    It is considered a much more serious offence than s 20, as can be seen from the
    difference in the maximum punishments. Section 20 has a maximum of five years’
    imprisonment whereas the maximum for s 18 is life imprisonment. Also, s 20 is
    triable either way but s 18 must be tried on indictment at the Crown Court. The
    definition in OAPA 1861 states:


    # Definition


    S 18 OAPA


    > ‘Whosoever shall unlawfully and maliciously by any means whatsoever wound or
    cause any grievous bodily harm to any person, with intent to do some grievous
    bodily harm to any person, or with intent to resist or prevent the lawful apprehension
    or detainer of any person, shall be guilty of … an offence.’'
