- pgno: 74
  md: 'not in favour of having two offences. In their report, Conspiracy and Attempts
    (2000) (Rep 218), the Law Commission abandoned the idea of having two offences.


    # 5.5.2 Protection of the public


    In considering this it is also necessary to ask why attempting an offence should
    make someone criminally liable. The main justification is that it can prevent
    the full offence from being committed. It would be ridiculous if the police had
    to wait until D fired the shot and killed V, instead of being able to arrest D
    for attempted murder. So, given that prevention of crime and protection of potential
    victims are important, the decisions in Geddes and Campbell in particular are
    hard to reconcile with this.


    Geddes was actually in the school with all the equipment needed to kidnap (falsely
    imprison) a student. Surely for protection of the public (in this case the students
    in the school) Geddes should have been guilty of an attempt.


    # 5.5.3 Should attempt be committed by an omission?


    The wording of the Criminal Attempts Act 1981 means that an attempt can only be
    committed by an act. In their Consultation Paper No 183 (2007) the Law Commission
    pointed out that if D deliberately starves his or her baby to death, this is murder
    even though the death is achieved through ‘doing nothing’ rather than by a positive
    act of killing. However, under the wording of the Act, D could not be charged
    with attempted murder.


    In order to remedy this gap in the law, the Law Commission in their report in
    2009 recommended that the Criminal Attempts Act 1981 be amended. The amendment
    would mean that D may be convicted of attempted murder if (with the intent to
    kill V) D failed to discharge his or her legal duty to V where that omission,
    unchecked, could have resulted in V’s death.


    If this proposal is adopted, then this will fill the gap in the law.


    # 5.5.4 The mens rea required for attempt


    The definition in s 1 of the Criminal Attempts Act 1981 uses the phrase ‘with
    intent to commit an offence’. It is not made clear whether ‘intent’ in this definition
    should mean only ‘direct’ intent or whether it includes both direct and indirect
    intent. In other words, whether foresight of consequences by D is sufficient for
    the mens rea of attempt.


    The courts have generally taken the view that ‘intent’ does also include foresight
    of consequences. The Law Commission decided not to recommend any alterations to
    the law as the broad approach taken by the courts to ‘intent’ is working. Their
    main reason for not giving a full definition of ‘intent’ is that no other offence
    has a statutory definition of ‘intent’. They would prefer a definition for intent
    to be given in a code of general principles on mens rea, so that it would apply
    to all offences requiring ‘intent’.


    # Level of mens rea


    Another issue in relation to attempt is that a higher level of mens rea is required
    for an attempt of some offences than is required for the full offence.


    For example, in the offence of murder, mens rea can be proved by showing either
    that D intended to kill or that he intended to cause really serious harm. However,
    for attempted murder it is necessary to prove that D intended to kill. Intention
    to cause really serious harm is not sufficient for the mens rea of attempted murder.


    This makes it appear that the law is more favourable to those charged with attempt
    than to those charged with the full offence. However, a defendant who intended
    to cause really serious harm but did not commit the full offence can be charged
    with the offence of attempting to commit grievous bodily harm contrary to s 18
    of the Offences Against the Person Act 1861, so the defendant does not escape
    liability completely.'
