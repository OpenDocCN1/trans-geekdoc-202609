- pgno: 97
  md: 'The changes made by the 2009 Act have done that. By using the phrase ‘recognised
    medical condition’ the definition should now be flexible enough to allow for future
    developments in medical knowledge.


    The definition also now sets out clearly what aspects of the defendant’s mental
    functioning must be substantially impaired in order for the partial defence of
    diminished responsibility to succeed. This incorporates the decision in *Byrne*
    (1960) into the statutory definition of diminished responsibility.


    # 7.1.9 Problems remaining in the law


    Although the Coroners and Justice Act has resolved many of the previous problems
    in the law, there are still some areas where difficulties remain.


    # Burden of proof


    A main point is that the burden of proof should not be on the defendant; in most
    other defences the defendant only has to raise the issue and the prosecution has
    to disprove it. This should also apply to diminished responsibility. At the moment,
    defendants pleading diminished responsibility are at a disadvantage which is not
    faced by those raising loss of control as a defence.


    There is also the possibility that putting the burden of proof on the defendant
    may be a breach of Art 6(2) of the European Convention on Human Rights which states
    that ‘everyone charged with a criminal offence shall be presumed to be innocent
    until proven guilty according to law’. Making the defendant prove diminished responsibility
    could be considered a breach of this right to be presumed innocent.


    # Developmental immaturity


    The Law Commission in their 2006 report had also recommended that developmental
    immaturity in those under 18 should also be included within the definition of
    diminished responsibility. Their reason for this was because there is evidence
    to show that frontal lobes of the brain which play an important role in the development
    of self-control and in controlling impulsive behaviour do not mature until the
    age of 14.


    The Government took the view that there was no need to include ‘developmental
    immaturity’ as a specific cause of diminished responsibility. They thought that
    conditions such as learning disabilities and autism spectrum disorders were recognised
    medical conditions and that these were particularly relevant in the context of
    juvenile offenders. This is true but ‘developmental immaturity’ is not the same
    as learning disability.


    If there is no such defence, children as young as 10 may be convicted of murder
    when they are developmentally immature. They cannot use the defence of diminished
    responsibility under the existing law as they are not suffering from an abnormality
    of mental functioning.


    # Self-test Questions


    +   1. Which section of which Act sets out the defence of diminished responsibility?

    +   2. What is the effect of a successful defence of diminished responsibility
    to a charge of murder?

    +   3. What type of abnormality must D suffer to come within the defence?

    +   4. What must be the cause of the abnormality?

    +   5. There must be substantial impairment of D’s ability to do one or more of
    three things. What are these things?

    +   6. What has ‘substantially impaired’ been held to mean?

    +   7. Can intoxication which has an affect on the brain be considered as diminished
    responsibility?

    +   8. Can intoxication due to addiction or dependency on alcohol be considered
    in diminished responsibility?

    +   9. Give two ways in which the law on diminished responsibility has been improved
    by the amended definition given in the Coroners and Justice Act 2009.

    +   10. Give two problems that still remain in the law on diminished responsibility.'
