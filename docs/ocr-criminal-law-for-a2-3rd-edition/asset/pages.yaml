  img_proc: true
- pgno: 92
  md: "# 7.1 Diminished responsibility\n\nThis defence was introduced by the Homicide\
    \ Act 1957. It did not exist in English law until then. Before 1957 if a person\
    \ with mental problems killed, then their only defence was insanity. The test\
    \ for insanity is a very narrow one and many defendants who clearly suffer from\
    \ a mental illness do not always come within it. (See Chapter 12 for further information\
    \ on the defence of insanity.) This is why the defence of diminished responsibility\
    \ was created.\n\n# 7.1.1 Definition of diminished responsibility\n\nThe defence\
    \ is set out in s 2(1) of the Homicide Act as amended by the Coroners and Justice\
    \ Act 2009. The effect of this section is that:\n\n# Definition\n\nA person who\
    \ kills or is a party to the killing of another is not to be convicted of murder\
    \ if he was suffering from an abnormality of mental functioning which:\n\n(a)\
    \ arose from a recognised medical condition,\n(b) substantially impaired D’s ability\
    \ to:\n  - understand the nature of his conduct; or\n  - form a rational judgment;\
    \ or\n  - exercise self-control and\n(c) provides an explanation for D’s acts\
    \ and omissions in doing or being a party to the killing.\n\nThe burden of proving\
    \ the defence is on the defendant, but the defendant need only prove it on the\
    \ balance of probabilities.\n\n# 7.1.2 Abnormality of mental functioning\n\nWhat\
    \ is meant by ‘abnormality of mental functioning’? Before the Coroners and Justice\
    \ Act 2009 amended the definition of diminished\n\nresponsibility, the phrase\
    \ used was ‘abnormality of mind’. In Byrne (1960) the Court of Appeal described\
    \ this as ‘a state of mind so different from that of ordinary human beings that\
    \ the reasonable man would term it abnormal’.\n\n# Byrne (1960)\n\n> The defendant\
    \ was a sexual psychopath who strangled a young woman and then mutilated her body.\
    \ The medical evidence was that, because of his condition, he was unable to control\
    \ his perverted desires. He was convicted of murder but the Court of Appeal quashed\
    \ the conviction and substituted a conviction for manslaughter.\n\nAlthough this\
    \ case was on the old definition, it is likely that the courts will still use\
    \ the same standard of abnormality. So the test will probably be that D’s mental\
    \ functioning was so different from that of ordinary human beings that the reasonable\
    \ man would term it abnormal.\n\n# 7.1.3 Cause of the abnormality of mental functioning\n\
    \nUnder s 2(1) of the Homicide Act 1957 the cause of the abnormality of mental\
    \ functioning must arise from a ‘recognised medical condition’. This is wide enough\
    \ to cover both psychological and physical conditions. It obviously covers any\
    \ recognised mental disorder. These can be wide ranging such as depressive illness,\
    \ paranoia or Battered Woman’s Syndrome. It also covers any physical condition\
    \ which affects mental functioning such as epilepsy, sleep disorders or diabetes.\
    \ There must be medical evidence given at the trial of an abnormality of mental\
    \ functioning arising from a recognised medical condition.\n\n# 7.1.4 Substantially\
    \ impaired\n\nThe abnormality of mental functioning must substantially impair\
    \ the defendant’s mental responsibility for his acts or omissions in doing or\
    \ being a party to the killing."
