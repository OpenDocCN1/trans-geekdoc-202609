  md: '# Prince (1875)


    Prince knew that the girl he took was in the possession of her father but believed,
    on reasonable grounds, that she was aged 18. He was convicted as he had the intention
    to remove the girl from the possession of her father. Mens rea was required for
    this part of the actus reus and he had the necessary intention. However, the court
    held that knowledge of her age was not required. On this aspect of the offence
    there was strict liability.


    # Hibbert (1869)


    The defendant met a girl aged 14 on the street. He took her to another place where
    they had sexual intercourse. He was acquitted of the offence as it was not proved
    that he knew the girl was in the custody of her father. Even though the age aspect
    of the offence was one of strict liability, mens rea was required for the removal
    aspect and, in this case, the necessary intention was not proved.


    Because it was a strict liability offence the butcher was guilty, even though
    he had taken reasonable care not to commit the offence. The butcher was not at
    fault in any way.


    # 4.3.2 No ‘due diligence’ defence


    For some offences the statute provides a defence of ‘due diligence’. In other
    words, the defendant will not be liable if he can show that he did all that was
    within his power not to commit the offence.


    However, there does not seem to be any sensible pattern for when Parliament decides
    to include a ‘due diligence’ defence and when it does not. It can be argued that
    such a defence should always be available for strict liability offences. If it
    was a defence, then the butcher in Callow v Tillstone would not have been guilty.
    By asking a vet to check the meat, he had clearly done all that he could to make
    sure that he did not commit the offence.


    Another example of where the defendants took all reasonable steps to prevent the
    offence but were still guilty because there was no ‘due diligence’ defence available
    is Harrow London Borough Council v Shah and Shah (1999).


    # 4.3.1 No fault


    As already stated, the actus reus must be proved and the defendant’s conduct in
    doing the actus reus must be voluntary. However, a defendant can be convicted
    if his voluntary act inadvertently caused a prohibited consequence. This is so
    even though the defendant was totally blameless in respect of the consequence.
    An example was the case of Callow v Tillstone (1900).


    # Callow v Tillstone (1900)


    A butcher asked a vet to examine a carcass to see if it was fit for human consumption.
    The vet assured him that it was all right to eat and so the butcher offered it
    for sale. In fact, it was unfit and the butcher was convicted of the offence of
    exposing unsound meat for sale.


    # Harrow LBC v Shah and Shah (1999)


    The defendants owned a newsagents’ business where lottery tickets were sold. They
    had told their staff not to sell tickets to anyone under 16 years old. They frequently
    reminded their staff that if there was any doubt about a customer’s age, the staff
    should ask for proof of age, and if still in doubt should refer the matter to
    the defendants. One of their staff sold a lottery ticket to a 13-year-old boy,
    without asking for proof of age. The salesman mistakenly believed the boy was
    over 16 years old. D1 was in a back room of the premises at the time: D2 was not'
