  md: '# Martin (Anthony) (2002)


    D shot two burglars who had broken into his farmhouse, one of whom died. The evidence
    was that the burglars were leaving when D shot them, and the burglar who died
    had been shot in the back. D was found guilty of murder. He appealed on the basis
    that the defence of self-defence should have been allowed as he was suffering
    from a paranoid personality disorder which meant that he may have genuinely (but
    mistakenly) thought he was in an extremely dangerous situation.


    The Court of Appeal rejected the appeal on this basis as they held that personality
    disorders could not be taken into account when considering the defence of self-defence.
    However, the conviction was reduced to manslaughter on the grounds that D was
    suffering from diminished responsibility (see section 7.1 for an explanation of
    diminished responsibility).


    The Coroners and Justice Act 2009 has now created a partial defence to murder
    of ‘loss of control’. This defence may be used where D kills having lost control
    due to fear of serious violence. (See Chapter 7 for more detail on this defence.)


    It is possible that defendants in the situations of Clegg and Martin may now be
    able to use this defence, though they will have to prove that they lost control.


    So the rules on when use of force can justify the defendant’s actions are as follows:


    +   - The defences of self-defence/defence of another/prevention of crime are
    defences which justify D’s actions so that he is held not to have acted unlawfully.

    +   - The force used must be reasonable in the circumstances.

    +   - The circumstances include what D genuinely believed to be the situation.
    This is so even if that belief was mistaken or unreasonable, provided the jury
    accepts that D genuinely believed it.


