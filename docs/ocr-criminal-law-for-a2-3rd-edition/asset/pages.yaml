    the Court of Appeal ruled that the son of the householder was a trespasser where
    he had entered and stolen two television sets even though the father stated that
    his son would not be a trespasser in the house; he had a general permission to
    enter. This decision could mean that a guest at a dinner party in someone’s house
    may become a trespasser if they go into another room, such as a bedroom, uninvited.
    If they then steal in that room, they could be guilty of burglary.


    The concept of burglary originally was to protect people’s homes and other buildings
    from trespassers who intended to (or did) steal and so on. There is no need to
    extend the law on burglary to include people who have permission to be in the
