- pgno: 196
  md: 'There is also the possibility that jurors may be so revolted by the crimes
    committed by the person that they will refuse to return the verdict of not guilty
    by reason of insanity. Especially in murder cases, jurors may disregard the medical
    evidence and, instead of returning the special verdict, find the defendant guilty
    of murder.


    This actually happened in the case of Peter Sutcliffe, the Yorkshire Ripper, in
    1981 where the defendant was charged with the murder of several women. All the
    doctors giving evidence agreed that the defendant was suffering from


    paranoid schizophrenia, a recognised serious mental illness. Despite this, the
    jury found Sutcliffe guilty of murder.


    # Overlap with diminished responsibility


    Since 1957, for defendants with mental illness charged with murder, there has
    been an alternative defence of diminished responsibility. If successful in this
    defence the charge of murder is reduced to manslaughter.


    # Key cases


    | Case | Facts | Law |

    |---|---|---|

    | *M''Naghten* (1843) | Suffering from paranoia, shot Sir Robert Peel''s secretary.
    Acquitted but House of Lords asked to clarify the law on insanity. | D must be
    labouring under a defect of reason, from disease of the mind; and must either
    not know the nature and quality of the act he was doing, or not know he was doing
    wrong. |

    | *Clarke* (1972) | Absent-mindedly took items from a supermarket. | Mere absent-mindedness
    or confusion is not insanity. |

    | *Kemp* (1956) | Suffering from hardening of the arteries which causes blackouts.
    | Was within the rules of insanity as his condition affected his mental reasoning,
    memory and understanding. |

    | *Sullivan* (1984) | Injured friend during epileptic fit. | Insanity included
    any organic or functional disease. It also applied even where it was temporary.
    |

    | *Hennessy* (1989) | Diabetic who took a car after failing to take his insulin.
    | If the disease affects the mind then it is within the definition of insanity.
    |

    | *Burgess* (1991) | Injured his girlfriend while he was asleep. | If the cause
    of sleep-walking is internal, it is a disease within the definition of insanity.
    |

    | *Quick* (1973) | Diabetic who failed to eat after taking his insulin. | This
    was an external cause (the effect of the drug) and so not insanity. |

    | *Windle* (1952) | Was suffering from a mental disorder and killed his wife,
    who had constantly spoken of committing suicide. | Because he knew what he had
    done was legally wrong, he was not insane by the *M''Naghten* rules. |

    | *Johnson* (2007) | D, who was suffering from paranoid schizophrenia and suffering
    from hallucinations, stabbed his neighbour. | Because he knew what he had done
    was legally wrong, he was not insane by the *M''Naghten* rules. |


    Figure 12.3 Key cases on insanity'
