    Strict liability offences created by an Act of Parliament will not contain any
    words requiring mens rea in their definition. However, the courts will still look
    at a number of factors before deciding that a statutory offence is one of strict
    liability.


    # 4.6 Interpretation by the courts


    Statutory interpretation of Acts of Parliament is an important role of the courts.
    You will have studied the different rules and approaches to interpretation. Strict
    liability is an area of law where the courts will use statutory interpretation.
    The starting point is one of the presumptions of statutory interpretation – the
    presumption of mens rea.


    # 4.6.1 Presumption of mens rea


    In order to decide whether an offence is one of strict liability, the courts start
    by assuming that mens rea is required, but they are prepared to interpret the
    offence as one of strict liability if Parliament has expressly or by implication
    indicated this in the relevant statute.


    The judges often have difficulty in deciding whether an offence is one of strict
    liability or not. The first rule is that where an Act of Parliament includes words
    indicating mens rea (eg ‘knowingly’, ‘intentionally’, ‘maliciously’ or ‘permitting’),
    the offence requires mens rea and is not one of strict liability. However, if
    an Act of Parliament makes it clear that mens rea is not required, the offence
    will be one of strict liability.


    However, in many instances a section in an Act of Parliament is silent about the
    need for mens rea. Parliament is criticised for this. If it made clear in all
    sections which create a criminal offence whether mens rea was required or not,
    then there would be no problem. As it is, where there are no express words indicating
    mens rea or strict liability, the courts have to decide which offences are ones
    of strict liability.


    There used to be two other common law offences of strict liability. One of these
    was blasphemous libel as shown in Lemon and Whitehouse v Gay News (1979).


    # Lemon and Whitehouse v Gay News (1979)


    > A poem was published in Gay News, describing homosexual acts done to the body
    of Christ after his crucifixion and also describing his alleged homosexual practices
    during his lifetime. The editor and publishers were convicted of blasphemy. On
    appeal to the House of Lords, the Law Lords held that it was not necessary to
    prove that the defendants intended to blaspheme.


    The common law offence of blasphemous libel no longer exists as it has been abolished
    by Parliament.


    Criminal contempt of court was also a strict liability offence at common law.
    It has now been made a statutory offence and Parliament has made the statutory
    offence one of strict liability.


    # 4.5 Strict liability in statute law


    The surprising fact is that about half of all statutory offences are ones of strict
    liability. This amounts to over 3,500 offences. Most strict liability offences
    are regulatory in nature. This may involve such matters as regulating the sale
    of'
