  md: 'them, you cannot be guilty of an assault even though you had the mens rea.


    If, two hours later, you are driving your car out of your driveway and knock down
    your neighbour because you did not see them, you have now done what could be the
    actus reus for an assault. However, you are not guilty of any criminal offence
    since at the moment you hit your neighbour you did not have the necessary mens
    rea. The mens rea and the actus reus were not present at the same time.


    In Thabo Meli v R (1954) the court had to decide whether the actus reus and mens
    rea were present together.


    # Thabo Meli v R (1954)


    Ds attacked a man and believed they had killed him. They then pushed his body
    over a low cliff. In fact, the man had survived the attack but died of exposure
    when unconscious at the foot of the cliff. It was held that Ds were guilty of
    murder.


    # Fagan v Metropolitan Police Commissioner (1986)


    Fagan was told by a police officer to park by a kerb. In doing this Fagan drove
    on to the policeman’s foot, without realising he had done so. Initially, Fagan
    refused to move the car. When the policeman pointed out what had happened, he
    asked Fagan several times to move the car off his foot. Eventually, Fagan did
    move the car. Fagan was convicted of assaulting the police officer in the execution
    of his duty.


    The Court of Appeal held that once Fagan knew the car was on the police officer’s
    foot he had the required mens rea. As the actus reus (the car putting force on
    the foot) was still continuing, the two elements were then present together. The
    actus reus in this case was a continuing act as, so long as the defendant developed
    the mens rea at some time while the act was continuing, then he could be guilty.


    The defendants in this case were guilty as the required mens rea and actus reus
    were combined in a series of acts. A similar situation occurred in Church (1965).


    # Church (1965)


    D had a fight with a woman and knocked her out. He tried, unsuccessfully, for
    about half an hour to bring her round. He thought she was dead and he put her
    in the river. She drowned. His conviction for manslaughter was upheld.


    # 3.6.1 Continuing act


    Where there is a continuing act for the actus reus and at some point while that
    act is still going on the defendant has the necessary mens rea, then the two do
    coincide and the defendant will be guilty. This is illustrated by the case of
    Fagan v Metropolitan Police Commissioner (1986).


