  md: 'manslaughter is also the charge (under gross negligence manslaughter) where
    a professional person has made a serious mistake which causes V’s death, as in
    the case of *Adomako* (1993). This is a very different scenario from unlawful
    act manslaughter. It would be better if there were different categories of offences.


    # 8.4.1 Problems with unlawful act manslaughter


    For unlawful act manslaughter the main criticisms are:


    +   - It covers a very wide range of conduct.

    +   - Death may be an unexpected result: if the same act resulted in minor injury,
    the defendant would only be liable for the offence of assault occasioning actual
    bodily harm.

    +   - A defendant who did not realise there was risk of any injury is still guilty
    because of the objective nature of the test.


    # Wide range of conduct


    As already pointed out, unlawful act manslaughter covers a very wide range of
    conduct. The act can be as minor as pushing V or the conduct may be only just
    short of murder. The level of blameworthiness of the defendants can vary enormously.
    If there were different levels of offence, then it would be fairer to defendants.
    It would also aid judges when passing sentence. At the moment the maximum sentence
    for manslaughter is life imprisonment. There is no minimum sentence. So any sentence
    is available: a fine, a community sentence, a short prison sentence all the way
    up to life imprisonment. The judge has to make a decision on the seriousness of
    the level of blameworthiness. If there were separate categories of offence, each
    would have a narrower band of sentences available.


    # Death an unexpected result


    In many cases of unlawful act manslaughter death is an unexpected result of D’s
    conduct. This was the situation in *Mitchell* (1983). Mitchell


    punched another man, who staggered against an 89-year-old woman. She fell and
    was injured and some days later died of those injuries. Her death was an unexpected
    result of Mitchell’s conduct in punching another man.


    Compare this with the case of *Cato* (1976) in which Cato injected another drug
    addict with heroin. The risk of death from injecting heroin is much less unexpected.
    Should both defendants have been found guilty of the same offence? Are their levels
    of blameworthiness sufficiently similar? Or should there be different categories
    of offence?


    # Objective part of test


    In 1996 the Law Commission in their report, *Legislating the Criminal Code: Involuntary
    Manslaughter*, No 237 recommended the abolition of unlawful act manslaughter.
    The Commission criticised the concept of unlawful act manslaughter, pointing out:


    > ‘It … is inappropriate to convict a defendant for an offence of homicide where
    the most that can be said is that he or she ought to have realised that there
    was the risk of some, albeit not serious, harm to another resulting from his or
    her commission of an unlawful act.’


    This highlights the problem with having an objective part to the law on unlawful
    act manslaughter. Why should a defendant be guilty of the serious offence of manslaughter
    when he did not even realise the risk of some harm occurring to the victim?


    Having this rule for manslaughter is in conflict with the law on offences where
    recklessness is required for the *mens rea*. Under the law of recklessness D must
    be shown to have been aware of the risk. This was decided in *R v G and another*
    (2003) (see 3.2 for more detail on recklessness).


    Recklessness applies to offences such as criminal damage, assaults occasioning
    actual bodily harm (s 47 Offences against the Person Act 1861) and malicious wounding
    (s 20'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'offences against the Person Act 1961). These are less serious offences than
    manslaughter and carry much lower maximum terms of imprisonment. For these it
    has to be shown that D was aware of the risk. Yet in manslaughter D can be convicted,
    even though he was unaware of the risk of any harm occurring.


    Note that an extract from the Law Commission’s report, *Legislating the Criminal
    Code: Involuntary Manslaughter*, No 237 (1996) is set out in Appendix 1 at A1.5.


    # 8.4.2 Reform of unlawful act manslaughter


    Although in 1996 the Law Commission had recommended abolishing unlawful act manslaughter,
    they did not recommend abolition in their 2006 report, *Murder, Manslaughter and
    Infanticide*. Instead, they recommended a three-tier structure of homicide offences.
    These were:


    +   - first degree murder;

    +   - second degree murder; and

    +   - manslaughter.


    Under these proposals manslaughter would cover:


    +   1. killing another person through gross negligence (this proposal is discussed
    at 8.4.4); or

    +   2. killing another person:

    +      (a) through the commission of a criminal act intended by the defendant
    to cause injury, or

    +      (b) through the commission of a criminal act that the defendant was aware
    involved a serious risk of causing some injury.


    This second category would be known as ‘criminal act manslaughter’. It would be
    different to the present unlawful act manslaughter as a defendant could only be
    convicted on a subjective test; that is he or she must either intend to cause
    injury or be aware that the act involved a serious risk of causing some injury.
    This would prevent defendants being convicted of the serious offence of manslaughter
    where they did not intend any injury and were unaware of the risk of injury.


    In addition, more serious situations which at the moment are classed as manslaughter
    could become second degree murder under the Law Commission’s proposals. These
    are killings where the defendant intended to cause injury or fear or risk of injury
    and was aware that his or her conduct involved a serious risk of causing death.
    This allows greater differentiation between the blameworthiness of defendants.


    NOTE The Law Commission’s summary of its proposals for murder and manslaughter
    is set out in Appendix 1 at A1.4.


    # 8.4.3 Problems with gross negligence manslaughter


    The main criticisms of gross negligence manslaughter are:


    +   - The test is circular, as the jury is directed to convict of a crime if they
    think that the conduct was criminal.

    +   - The test may lead to inconsistent verdicts, as it depends on what different
    juries think.

    +   - The civil test for negligence should not be used in criminal cases: the
    purpose of the two branches of law is quite different.


    # Circular test


    The fact that the jury have to decide whether to convict the defendant of manslaughter
    (a criminal offence) by deciding whether his conduct was criminal is regarded
    as a circular test.


    In other words, the starting point of ‘is the defendant’s conduct criminal?’ is
    almost the same as saying ‘has he committed a crime?’. There is no sequence of
    reasoning, instead the argument goes round in a circle. It’s a crime because it’s
    criminal!


    # Inconsistency of decisions


    The other problem with this test is that it leaves the jury to decide a question
    of law. Normally, in other offences, the judge decides if the conduct is capable
    of being a crime and the jury then decide on the facts whether the defendant has'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'committed the alleged crime. In gross negligence manslaughter the jury decide
    whether the conduct is capable of being criminal.


    As each case is tried by a different jury, this may lead to different decisions
    in very similar circumstances. It would make the law fairer if the judge made
    the decision as to whether the conduct was capable of being gross negligence manslaughter.


    # Civil or criminal negligence


    In Adomako (1993), Lord Mackay said that the ordinary principles of negligence
    applied in deciding whether D had broken a duty of care owed to V.


    This appears to say that the tests for negligence in the civil law apply to cases
    in the criminal law. Yet criminal law negligence has not developed in the same
    way as civil law negligence. This is clear from the case of Stone and Dobinson
    (1977) in which the defendants were held liable for gross negligence manslaughter
    where they had given very limited care to Stone’s adult sister and failed to send
    for medical help.


    It is probable that such a situation would not give rise to civil liability in
    negligence. So, if the civil tests for negligence apply in criminal cases does
    this mean that, following the decision in Adomako, defendants in the same situation
    would not now be found guilty of gross negligence manslaughter?


    The Law Commission in their report in on manslaughter in 1996 pointed out that
    this area of law is uncertain.


    # Risk of death


    There also used to be a criticism that it was unclear whether the risk had to
    be of death or whether risk of serious injury was sufficient to prove gross negligence
    manslaughter. This point was clarified in Misra (2004) where the Court of Appeal
    held that the test in gross negligence manslaughter involves consideration of
    the risk of death. It is not sufficient to show a risk of bodily injury or injury
    to health.


    # 8.4.4 Reform of gross negligence manslaughter


    In 1996, the Law Commission proposed that instead of gross negligence manslaughter
    there should be two categories of killing involving negligence. These were reckless
    killing and killing by gross carelessness. Reckless killing would be the more
    serious offence as the prosecution would have to prove that:


    +   - the defendant is aware that his conduct will cause death or serious injury
    and

    +   - it is unreasonable in the circumstances for him to take that risk, having
    regard to the circumstances as he believes them to be.


    This would answer the criticism that a defendant can at present be liable for
    the very serious offence of manslaughter, without any awareness of the consequences
    of his act.


    Killing by gross carelessness would be a lower-level offence, covering situations
    where the risk of death or serious injury would be obvious to a reasonable person
    in the position of the defendant, the defendant is capable of appreciating that
    risk and either:


    +   - his conduct falls far below what can reasonably be expected of him in the
    circumstances, or

    +   - he intends by his conduct to cause some injury, or unreasonably takes the
    risk that it may do so, and the conduct causing (or intended to cause) the injury
    constitutes an offence.


    Although the Government issued a paper on reform in 2000, no other action was
    taken on the 1996 proposals. However, the Government did ask the Law Commission
    to review the whole of the homicide law. The Law Commission’s report, Murder,
    Manslaughter and Infanticide, was published in 2006.


    # Law Commission Report of 2006


    In their 2006 report, Murder, Manslaughter and Infanticide, the Law Commission
    did not recommend having two categories of killing in cases where there had been
    negligence. Instead they recommended that there should only be gross negligence
    manslaughter which would be committed where:'
  merge: -1
  img_proc: true
- pgno: 122
  md: '+   - a person by his or her conduct causes the death of another;

    +   - a risk that his or her conduct will cause death ... would be obvious to
    a reasonable person in his or her position;

    +   - he or she is capable of appreciating that risk at the material time; and

    +   - ... his or her conduct falls far below what can reasonably be expected of
    him or her in the circumstances.


    This largely restates the existing law. It makes it absolutely clear that the
    risk must be to cause death. A risk of serious injury is not sufficient.


    However, the Law Commission recommended keeping the rule that gross negligence
    manslaughter can be committed even when D was unaware that his or her conduct
    might cause death. They justified this by pointing out:


    > > ‘This is because negligence, however gross, does not necessarily involve any
    actual realisation that one is posing a risk of harm. It is a question of how
    glaringly obvious the risk would have been to a reasonable person.’


    But, under the proposal, this rule is softened by the fact that the prosecution
    would have to prove that the defendant is capable of appreciating that risk at
    the material time. This would prevent those with mental disabilities or younger
    defendants being convicted if they were not capable of appreciating the risk.


    An extract from the report is given in Appendix 1 at A1.5.


    # 8.4.5 Reform of reckless manslaughter


    If the Law Commission’s recommendations of 2006 were carried out, ‘reckless manslaughter’
    would become a very narrow category. In many cases it would be almost indistinguishable
    from gross negligence manslaughter. The Law Commission, therefore, thought that
    to have a separate category would make the law too complex. Instead they recommended
    the abolition of reckless manslaughter as a separate category.


    However, the Law Commission pointed out that the worst cases of recklessness (those
    in which there was also an intention to cause injury or a fear or risk of injury)
    would be accounted for within second degree murder.


    For the less serious cases, the Law Commission thought that most cases would be
    covered by gross negligence manslaughter. This was because D would be hard-pressed
    to deny that he or she was perfectly well aware of the risk of his or her conduct
    killing someone. For example, the situation in Lidar (2000), where D drove off
    knowing that the victim was hanging from the car window with his body half in
    the car, would be covered under the Law Commission’s proposal for gross negligence
    manslaughter.


    # Self-test Questions


    +   1. Give two criticisms of the current law on unlawful act manslaughter.

    +   2. In 2006 the Law Commission recommended replacing unlawful act manslaughter
    with two offences. What were these?

    +   3. Give two ways in which the Law Commission’s proposals would have improved
    the law.

    +   4. Give two ways in which the law on gross negligence manslaughter is unsatisfactory.

    +   5. In 1996 the Law Commission recommended that gross negligence manslaughter
    should be replaced with two new offences. What were these?

    +   6. In 2006 the Law Commission recommend keeping one category of gross negligence
    manslaughter. What were their tests for their proposed new offence of gross negligence
    manslaughter?

    +   7. In their 2006 report what did the Law Commission recommend should happen
    to the offence of reckless manslaughter? What was their main reason for making
    this recommendation?'
