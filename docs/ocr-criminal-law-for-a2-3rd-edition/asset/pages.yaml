- pgno: 94
  md: 'Section 2(1B) of the Homicide Act 1957 explains this principle further as it
    states:


    > > ‘...an abnormality of mental functioning provides an explanation for D’s conduct
    if it causes or is a significant contributory factor in causing, D to carry out
    that conduct.’


    So the abnormality of mental functioning need not be the only factor which caused
    D to do or be involved in the killing. However, it must be a significant factor.
    This is particularly important where D is intoxicated at the time of the killing.


    # 7.1.7 Diminished responsibility and intoxication


    The defence of diminished responsibility becomes more complicated when the defendant
    was also intoxicated at the time of the killing.


    The first point is that there is a clear rule that intoxication alone cannot support
    a defence of diminished responsibility. In Di Duca (1959) the Court of Appeal
    held that the immediate effects of taking alcohol or drugs was not an injury (medical
    condition), even if it did have an effect on the brain. So a ‘transient’ state
    of intoxication is not an abnormality of mental functioning.


    The definition of diminished responsibility now strengthens this view of the law
    as it states that the abnormality of mental functioning must be due to a recognised
    medical condition.


    So, if the jury decide that the defendant was not suffering from an abnormality
    of mental functioning, the defence of diminished responsibility is not available.
    If the prosecution prove D did the act of killing and had the mens rea for murder,
    then he will be guilty of murder unless he has another defence such as self-defence.


    # Intoxication and a pre-existing abnormality of mental functioning


    There are difficulties in cases where the defendant has some abnormality of mental
    functioning but, in addition, is intoxicated at the time he does the killing.
    This occurred in Dietschmann (2003).


    # Dietschmann (2003)


    The defendant was upset by the fact that, in his view, the victim was behaving
    in a way which was disrespectful to the memory of the defendant’s aunt who had
    just died. He killed the victim by repeatedly kicking him and stamping on him.
    The psychiatrists called by both the prosecution and the defence agreed that the
    defendant was suffering from an adjustment disorder in the form of depressed grief
    reaction to the death of his aunt. However, they disagreed on whether this had
    substantially impaired his mental responsibility for the killing. The defendant
    had also drunk about a third of a bottle of whisky, and two and a half pints of
    cider before the killing. He was convicted and appealed.


    The House of Lords held (under the old definition) that if the defendant satisfied
    the jury that his abnormality of mind substantially impaired his mental responsibility
    for his acts in doing the killing, then even though he was intoxicated, the jury
    should not find him guilty of murder but, instead, guilty of manslaughter.


    The Court of Appeal also considered the point in number of cases after Dietschmann.
    These included:


    +   - Hendy (2006) where D was intoxicated but there was evidence of underlying
    brain damage and a psychopathic disorder; and

    +   - Robson (2006) where D was heavily intoxicated, but also suffering from an
    acute stress disorder when he killed V.


    In these cases the Court of Appeal quashed the convictions for murder and substituted
    convictions for manslaughter.


    These decisions are likely to be followed in cases under the new definition. The
    modern approach is likely to be that the jury must decide:


    +   - if D had an abnormality of mental functioning arising from a recognised
    medical condition;

    +   - whether the abnormality substantially impaired D’s ability to understand
    the nature of his conduct or form a rational judgement and/or exercise self-control;'
  merge: -1
  img_proc: true
- pgno: 95
  md: '+   - whether the abnormality caused, or was a significant factor in causing,
    D to kill V.


    If all these are answered ‘yes’ then D should be found not guilty of murder but
    guilty of manslaughter.


    If the jury decide that D did not have an abnormality of mental functioning, or
    that an abnormality was not caused by a recognised medical condition, or that
    the abnormality was not a significant factor in causing D to do the killing, then
    D does have the defence of diminished responsibility available to him and he will
    be guilty of murder.


    # Intoxication due to addiction/ dependency


    There is a recognised medical condition called Alcohol Dependency Syndrome (ADS).
    This means that the person cannot control their drinking.


    Under the old law, in Tandy (1989), the Court of Appeal held that where the defendant
    is unable to resist drinking, so that it is involuntary, this could amount to
    diminished responsibility.


    # Tandy (1989)


    Mrs Tandy had been an alcoholic for a number of years, usually drinking barley
    wine or Cinzano. One day, she drank nearly a whole bottle of vodka. That evening
    she told her mother that her (Tandy’s) second husband had sexually interfered
    with her 11-year-old daughter. She then strangled her daughter. The trial judge
    told the jury to decide whether Tandy was suffering from an abnormality of mind
    as a direct result of her alcoholism or whether she was just drunk. She was convicted.
    The Court of Appeal dismissed her appeal because Tandy had not shown that her
    brain had been injured (a test under the old law) or that her drinking was involuntary.


    The decision in this case was criticised as it only looked at whether the defendant
    was unable to prevent themselves from drinking. It did not consider whether alcoholism
    is a disease.


    The point was considered again in Wood (2008) when the Court of Appeal pointed
    out that


    the ‘sharp effect of the distinction drawn in Tandy between cases where brain
    damage has occurred as a result of alcohol dependency syndrome and those where
    it has not, is no longer appropriate’.


    # Wood (2008)


    The defendant, after drinking heavily, had gone to the victim’s flat. The defendant
    claimed he had fallen asleep there and been woken by the victim trying to perform
    oral sex on him. The defendant repeatedly hit the victim with a meat cleaver,
    killing him. At the trial medical experts agreed that the defendant was suffering
    from Alcohol Dependency Syndrome, but disagreed as to whether this had damaged
    his brain.


    The judge directed the jury that if they found that the defendant had suffered
    brain damage from his long-term abuse of alcohol then the defence of diminished
    responsibility was available to him. But if they found that he had not suffered
    brain damage, they then had to decide whether the drinking had been voluntary
    or not. If it was voluntary then the defendant could not use the defence of diminished
    responsibility.


    The defendant was convicted. He appealed and the Court of Appeal quashed the conviction,
    holding that the judge was wrong to direct the jury that all of the defendant’s
    drinking had to be involuntary.


    When hearing the appeal in the case of Wood, the Court of Appeal considered the
    effect of the judgment in Dietschmann on the decision in Tandy. They held that
    Alcohol Dependency Syndrome could be considered as a possible source of abnormality
    of mind (now mental functioning). This was for the jury to decide. If the jury
    found that it was an abnormality of mind, then they had to consider the effect
    of any alcohol consumed by the defendant as a result of his dependency.


    This involved questions such as whether the defendant’s craving for alcohol was
    or was not irresistible and whether his consumption of alcohol in the period leading
    up to the killing was voluntary – and if so, to what extent.'
