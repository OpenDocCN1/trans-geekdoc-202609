  md: 'For all these three defences the key point is whether the use of force and
    level of the force was reasonable in the circumstances.


    # Reasonable force


    In deciding whether the force used was reasonable, the fact that the defendant
    had only done what he honestly and instinctively thought was necessary in a moment
    of unexpected anguish is very strong evidence that the defensive action taken
    was reasonable.


    In looking at the circumstances, the defendant must be judged on the facts as
    he genuinely believed them to be. This is so, even if the defendant was mistaken
    about the true facts. This rule is illustrated by Beckford (1988).


    # Beckford (1988)


    D was a police officer in Jamaica. He and other police officers had gone to a
    house to investigate a report that a man armed with a gun was terrorising his
    family. As D approached the house, he saw a man running out of it. D shot and
    killed the man. D claimed that he believed his own life was in danger as he thought
    the man still had a gun. In fact, when the man was shot he did not have a gun.
    D was convicted and appealed to the Privy Council, which quashed his conviction
    as the jury should have been allowed to consider whether D genuinely believed
    his own life was in danger.


    Lord Griffiths when giving judgment in the case pointed out that:


    > ''a genuine belief in a fact which if true would justify self-defence [must]
    be a defence to a crime of personal violence because the belief negates the intent
    to act unlawfully.''


    So what the defendant genuinely believed is the important fact, even if that belief
    was mistaken and even if it was unreasonable.


    The amount of force which can be used in self-defence, defence of another or in
    prevention of crime is now explained in the Criminal Justice and Immigration Act
    2008. This states that, in deciding whether the force used is reasonable in the
    circumstances:


    > ''that a person acting for a legitimate purpose may not be able to weigh to
    a nicety the exact measure of any necessary action; and that evidence of a person’s
    having only done what the person honestly and instinctively thought was necessary
    for a legitimate purpose constitutes strong evidence that only reasonable action
    was taken by that person for that purpose.''


    This allows for the fact that a person who is facing an attack by another is under
    stress and cannot be expected to calculate the exact amount of force which needs
    to be used in the circumstances. If there is evidence that the person ‘honestly
    and instinctively’ thought the level of force he used to protect himself or another
    or to prevent crime was reasonable, then this provides strong evidence that the
    defensive action taken was reasonable in the circumstances.


    The following extract from an article in the Daily Mail illustrates the law on
    reasonable force in self-defence. Read it and answer the questions below.


    # Activity


    # Householder who stabbed burglar to death faces no further action as prosecutor
    says he used ‘reasonable force’


    A householder who was arrested on suspicion of murdering a burglar is to be released
    without charge.


    Peter Flanagan, 59, was held after the death of John Bennell, 27, who died from
    a stab wound'
