- pgno: 192
  md: 'The Court of Appeal held that the correct defence was insanity as the disease
    of diabetes was affecting his mind. Thus diabetes was brought within the definition
    of insanity:


    Another case in which it was held that the correct defence was insanity was Burgess
    (1991). In this case it was decided that, in some instances, sleep-walking was
    within the legal definition of insanity.


    # Burgess (1991)


    D and his girlfriend had been watching videos. They fell asleep and in his sleep
    D attacked the girl. There was no evidence of any external cause for the sleep-walking
    and a doctor at the trial gave evidence that in this instance it was due to an
    internal cause: a sleep disorder. The judge ruled that this was evidence of insanity
    and the defendant was found ‘not guilty by reason of insanity’. The Court of Appeal
    upheld the finding.


    However, if the sleep-walking is due to an external cause, such as a blow to the
    head, then it is not insanity but will allow the defendant the defence of automatism
    (see section 12.2).


    # External factors


    Where the cause of the defendant being in a state where he does not know what
    he is doing is not a disease but an external cause, then this is not insanity.


    # Quick (1973)


    D was a diabetic who had taken his insulin but then not eaten enough. This causes
    low blood sugar levels which can affect the brain. In this state D, who was a
    nurse at a mental hospital, assaulted a patient. The Court of Appeal ruled that
    his condition did not come within the definition of insanity. It was caused by
    an external matter, in this case the drug insulin. This meant that D could rely
    on the defence of automatism (see section 12.2) and was entitled to be acquitted
    of the charge.


    The decisions in Hennessy (1989) and Quick (1973) highlight the problems with
    the law. People with diabetes can go into an automatic state in which they do
    not know what they are doing. This state can be caused by:


    +   - the disease itself, which causes high levels of blood sugar (hyperglycaemia),
    or

    +   - the drug, insulin, which is used to control the levels of blood sugar. If,
    after taking insulin, D fails to eat, the blood sugar level will become too low
    (hypoglycaemia).


    If it is the disease which causes the automatic state then, as shown in Hennessy
    (1989), the defendant is considered to come within the rules of insanity as it
    is an internal cause. If it is the drug which causes the automatic state then,
    as shown in Quick (1973), they are not within the rules on insanity but can rely
    on the defence of automatism.


    It seems ridiculous that a physical disease such as diabetes is classed as insanity,
    but it is even more ridiculous that diabetics have to rely on different defences
    available according to whether it was the drug or the disease itself which caused
    the automatic state.


    # 12.1.4 Not knowing the nature and quality of the act


    Nature and quality refer to the physical character of the act. There are two ways
    in which the defendant may not know the nature and quality of the act. These are:


    +   - because he is in a state of unconsciousness or impaired consciousness, or

    +   - when he is conscious but due to his mental condition he does not understand
    or know what he is doing.


    If the defendant can show that either of these states applied to him at the time
    he did the act, then he satisfies this part of the M''Naghten Rules.


    An example of not knowing the nature and quality of the act is where a nurse threw
    a baby onto a fire believing it to be piece of wood.'
