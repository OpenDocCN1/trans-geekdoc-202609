- pgno: 22
  md: '# 1.4.3 Raising a defence


    If the defendant raises a defence then it is for the prosecution to disprove that
    defence. In Woolmington v DPP (1935) the defendant stated that the gun had gone
    off accidentally, thus raising the defence of accident. The prosecution was obliged
    to disprove this if the defendant was to be found guilty.


    For all common-law defences, except insanity, there must be some evidence of the
    key points of the defence given at the trial. This can be from evidence given
    by the defence or by the prosecution. If evidence of a defence is given at the
    trial then, even where the defendant has not specifically raised the defence,
    the prosecution must disprove at least one element of that defence. The trial
    judge must direct the jury to acquit unless they are satisfied that the defence
    has been disproved by the prosecution.


    # Reverse onus


    For certain defences, the burden of proof is on the defendant. For example, if
    the defendant claims that he was insane at the time of the crime, the burden of
    proving this is on the defendant. This shifting of the burden of proof to the
    defendant is known as the ‘reverse onus’. As well as applying to the common-law
    defence of insanity, it also applies to some defences which have been created
    by statute. One of these is the defence of diminished responsibility in the Homicide
    Act 1957 where s 2(2) states:


    > > ‘On a charge of murder, it shall be for the defence to prove that the person
    charged is, by virtue of this section, not liable to be convicted of murder.’


    Where a statute places the burden of proof on the defendant to prove a defence,
    the standard is the civil one of ‘on the balance of probabilities’.


    # How to use self-test questions


    All chapters in this book contain self-test questions. These can be used in two
    different ways. Firstly, when doing a topic for the first time you can check your
    understanding by working through the questions by referring back to the material
    in the chapter.


    Secondly, the self-test questions can be used as a revision aid. If you want to
    use them for revision, try answering without looking back to the material in the
    chapter. Then check your answers against the text.


    # Self-test Questions


    +   1. Give an accepted general definition of crime.

    +   2. Why is it difficult to give a general definition of crime?

    +   3. Give an example of how law can change over a period of time.

    +   4. Which state agency prosecutes in the majority of criminal cases?

    +   5. Give an example of an offence created by judges.

    +   6. What are the two elements which must be proved in most offences?

    +   7. Name three general defences.

    +   8. Which defences are particularly relevant to non-fatal offences against
    the person?

    +   9. What standard of proof is required in a criminal case?

    +   10. Who normally has to prove the case?'
