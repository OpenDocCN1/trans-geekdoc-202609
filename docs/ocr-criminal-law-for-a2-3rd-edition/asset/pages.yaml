  md: 'The proportion of the assessment objectives available for each question varies.
    Details are given in Appendix 3 for questions on Unit G153 and in Appendix 4 for
    Unit G154.


    These Assessment Objectives are central to the marking of each question. When
    examiners mark, they have to decide a mark for each Assessment Objective for each
    question. They do this by considering the descriptors for each level of assessment.


    The higher the level of assessment achieved the higher the final Grade which will
    be awarded.


    # A2.4 Levels of assessment


    # A2.4.1 Assessment Objective 1


    There are five levels of assessment. Briefly these are:


    +   - Level 1 Very limited knowledge

    +   - Level 2 Limited knowledge

    +   - Level 3 Adequate knowledge

    +   - Level 4 Good, well-developed knowledge

    +   - Level 5 Wide-ranging, accurate, detailed knowledge


    From these brief descriptions you can see that it is important to know the law
    in each area as thoroughly as possible if you want a high mark.


    Let’s consider Levels 4 and 5 in more detail and compare them to see what is needed
    for a top level answer.


    # AO1 Level 4


    The full descriptor for Level 4 of Assessment Objective 1 is:


    > > Good, well-developed knowledge with a clear understanding of the relevant
    concepts and principles. Where appropriate, candidates will be able to elaborate
    by good citation to relevant statutes and case-law.


    # AO1 Level 5


    The full descriptor for Level 5 of Assessment Objective 1 is:


    > > Wide-ranging, accurate, detailed knowledge with a clear and confident understanding
    of the relevant concepts and principles. Where appropriate, candidates will be
    able to elaborate with wide citation of relevant statutes and case-law.


    # Comparison


    The following table compares these two levels.


    | AO1 Level 4 | AO1 Level 5 |

    |---|---|

    | Good knowledge | Wide-ranging knowledge |

    | Well-developed knowledge | Accurate, detailed knowledge |

    | Clear understanding | Clear and confident understanding |

    | Good citation | Wide citation |


    The important points to note are that to get to Level 5 it is essential to show
    knowledge that is wide-ranging (and, of course, relevant to the question). That
    knowledge also has to be accurate and detailed.


    For both Levels 4 and 5 there must be citation of relevant cases and statutes.
    Again Level 5 is more demanding as there must be wide citation.


    # A2.4.2 Assessment Objective 2


    For AO2 there are also five levels of assessment. Briefly these are:


    +   - Level 1 Ability to explain at least one of the simpler points central to
    the question

    +   - Level 2 Ability to explain some of the more obvious points central to the
    question

    +   - Level 3 Ability to analyse most of the more obvious points central to the
    question

    +   - Level 4 Ability to identify and analyse issues central to the question,
    showing some understanding of current debate and proposals for reform

    +   - Level 5 Ability to identify correctly the relevant and important points
    of criticism, showing good understanding of current debate and proposals for reform


    Again let’s look at Levels 4 and 5 in more detail.'
