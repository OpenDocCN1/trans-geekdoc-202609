- pgno: 60
  md: 'down by the case of Gammon (1984): that is the question of whether the crime
    involves an issue of social concern. The Privy Council ruled that the only situation
    in which the presumption of mens rea can be displaced is where the statute is
    concerned with an issue of social concern.


    This allows strict liability to be justified in a wide range of offences, as issues
    of social concern can be seen to cover any activity which is a ‘potential danger
    to public health, safety or morals’.


    Regulations covering health and safety matters in relation to food, drink, pollution,
    building and road use are obviously issues of social concern, but other issues
    such as possession of guns are also regarded as matters of public safety.


    Even transmitting an unlicensed broadcast has been held to be a matter of social
    concern. This was decided in Blake (1997).


    In Lim Chin Aik v The Queen (1963) the appellant had been convicted under s 6(2)
    of the Immigration Ordinance of Singapore of remaining (having entered) in Singapore
    when he had been prohibited from entering by an order made by the Minister under
    s 9 of the same Ordinance.


    The Ordinance was aimed at preventing illegal immigration. However, the appellant
    had no knowledge of the prohibition and there was no evidence that the authorities
    had even tried to bring it to his attention.


    The Privy Council thought that it was not enough to be sure that the statute dealt
    with a grave social evil in order to infer strict liability. It was also important
    to consider whether the imposition of strict liability would assist in the enforcement
    of the regulations.


    If it did not, then the offence should not be one of strict liability.


    # Blake (1997)


    D was a disc jockey who was convicted of using a station for wireless telegraphy
    without a licence, contrary to s 1(1) of the Wireless Telegraphy Act 1949. His
    defence was that he believed he was making a demonstration tape and did not know
    he was transmitting. He was convicted on the basis that the offence was one of
    strict liability. He appealed to the Court of Appeal but his appeal was dismissed.


    # 4.6.8 Promoting enforcement of the law


    In Gammon (1984) the final point in considering whether strict liability should
    be imposed, even where the statute is concerned with an issue of social concern,
    was whether it would be effective to promote the objects of the statute by encouraging
    greater vigilance to prevent the commission of the prohibited act. If the imposition
    of strict liability will not make the law more effective then there is no reason
    to make the offence one of strict liability.


    # 4.7 Justification for strict liability


    # 4.7.1 Policy issues


    Many statutory offences created by Parliament are aimed at preventing danger or
    other problems to the public. The risks of such danger are thought to outweigh
    the defendant’s individual rights. It is more important to protect the public,
    even though this may in some cases mean that defendants who have taken every possible
    care will be convicted of an offence.


    For example, many statutory offences are connected with cars and other transport.
    It is important that all vehicles are in a safe condition and operated safely.
    If they are not, then there are obvious risks of causing death or injury. It is
    thought that by having offences of strict liability, people who operate vehicles
    will take greater care to carry out regular safety checks.


    Roscoe Pound explained it in this way:


    > ‘Such statutes are not meant to punish the vicious but to put pressure upon
    the thoughtless and inefficient to do their whole duty in the interests of public
    health or safety.’'
