    The mother hands over her purse.

    +   2. Brendan threatens staff in a post office with an imitation gun. He demands
    that they hand over the money in the till. One of the staff presses a security
    button and a grille comes down in front of the counter so that the staff are safe
    and Brendan cannot reach the till. He leaves without taking anything.

    +   3. Carla snatches a handbag from Delia. Delia is so surprised that she lets
    go of the bag and Carla runs off with it.

    +   4. Ellie breaks into a car in a car park and takes a briefcase out of it.
    As she is walking away from the car, the owner arrives, realises what has happened
    and starts to chase after Ellie. The owner catches hold of Ellie, but she pushes
    him over and makes her escape.

    +   5. Freya tells Harmid to hand over his Rolex watch and, that if he does not,
    Freya will send her boyfriend, Grant, round to beat Harmid up. Harmid knows that
    Grant is a very violent man. Harmid takes his watch off and gives it to Freya.


    # Key facts


    | Element | Law | Case |

    |---|---|---|

    | Theft | There must be a completed theft; if any element is missing there is
    no theft and therefore no robbery.

    The moment the theft is completed (with the relevant force) there is robbery.
    | Robinson (1977)

    Corcoran v Anderton (1980) |

    | Force or threat of force | The jury decides whether the acts were force, using
    the ordinary meaning of the word.

    It includes wrenching a bag from V’s hand. | Dawson and James (1976)

    Clouden (1987) |

    | On any person | The force can be against any person. It does not have to be
    against the victim of the theft. |  |

    | Immediately before or at the time of the theft | For robbery, theft has been
    held to be a continuing act.

    Using force to escape can still be at the time of the theft. | Hale (1979)

    Lockley (1995) |

    | In order to steal | The force must be in order to steal. Force used for another
    purpose does not become robbery if D later decides to steal. | * |

    | Mens rea | Mens rea for theft plus an intention to use force to steal. |  |


