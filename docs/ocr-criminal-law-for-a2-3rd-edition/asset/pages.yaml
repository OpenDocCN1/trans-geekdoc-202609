  md: '![](img/cc718e8d30bf7e5c8ed3badf83078451_239_0.png)


    **Figure A3.1** Essay plan, part 1


    Don’t forget for Level 5 AO1 marks you must cite a wide range of relevant cases
    in support of the points you are making.


    Now think about what the Act did. This is important for AO2 in this question.


    ![](img/cc718e8d30bf7e5c8ed3badf83078451_239_1.png)


    **Figure A3.2** Essay plan, part 2


    Again remember to cite a wide range of relevant cases for these points.


    # Conclusion


    Make sure you finish with a conclusion. This question asks you to evaluate the
    accuracy of the statement. So think about whether the reforms have improved the
    law or if that is in doubt. For this a quick list will help you focus on what
    has improved and what has not:


    +   - Replacing the various old tests with one of ‘more than merely preparatory’
    has made law simpler and easier to apply BUT some cases


    (e.g. Geddes, Campbell) show this test has problems and is inconsistently applied.


    +   - Do the cases of *Geddes*, *Campbell* show that the law is not effectively
    preventing criminal behaviour before harm is caused?

    +   - Does the test of ‘more than merely preparatory’ strike a balance between
    protection of the public and not punishing people for just thinking about an offence?

    +   - The need to show an intent to commit the full offence still exists – does
    this also strike a balance between protection of the public and not punishing
    people for just thinking about an offence?

    +   - Recklessness is still not enough for *mens rea*. Attempting the impossible
    is now within the definition of attempt – this helps with law enforcement.

    +   - The Law Commission has made recommendations for reform which underline the
    view that the Act has not improved the law adequately in all areas of attempt.


    Now finish with a concluding paragraph on the extent to which the Act has succeeded.


    The mark scheme for this question can be found on the OCR website – www.ocr.org.uk.


    # A3.2 Problem questions


    On Unit G153 these can also be based on any area or areas of the substantive criminal
    law studied for the A2 option. For these, knowledge and understanding of the law
    (AO1) together with identification of the relevant issues and application of the
    law (AO2) are required. Each question is worth 50 marks, and the allocation of
    assessment objectives is the same as for essay questions:


    +   - AO1 – maximum 25 marks

    +   - AO2 – maximum 20 marks

    +   - AO3 – maximum 5 marks


    As with the essay questions, all problem-style examination questions at the end
    of chapters in this book are taken from past OCR papers. They can be used as practice
    for the current specification.'
