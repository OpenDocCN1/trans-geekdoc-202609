    intention may be inferred.


    In Nedrick (1986) the defendant poured paraffin through the letter box of a house
    in order to frighten the woman who lived there. A child died in the fire. The
    Court of Appeal suggested that juries ask themselves two questions:


    +   - How probable was the consequence which resulted from the defendant’s voluntary
    act? and

    +   - Did the defendant foresee that consequence?


    The Court of Appeal also said that the jury should be directed that they are not
    entitled to infer the necessary intention unless they feel sure that death or
    serious injury was a virtual certainty as a result of the defendant’s actions,
    and that the defendant appreciated that such was the case.


    In Woollin (1998) the House of Lords approved this direction but disapproved of
    the use of the two questions. The Law Lords said that ‘substantial risk’ was not
    the correct test. Using this phrase blurred the line between intention and recklessness.
    They approved the direction given in Nedrick, provided that the word ‘find’ was
    used instead of ‘infer’. So, the jury should be directed that they are not entitled
    to find the necessary intention unless they feel sure that


    death or serious injury was a virtual certainty as a result of the defendant’s
    actions, and that the defendant appreciated that such was the case.


    # 6.3.2 Transferred malice


    The general rule on transferred malice applies to murder. So, if D fires a shot
    at V1 but misses and hits and kills V2, D is guilty of murder. It does not matter
    that he did not intend to kill V2. His intention to kill (or seriously injure)
    V1 is transferred. See Chapter 3 section 3.5 for more detail on transferred malice.


