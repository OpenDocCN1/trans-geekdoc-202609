    \ the Range Rover and suffered injuries from which he died. D was convicted of\
    \ manslaughter.\n\nTo prove manslaughter, it must be shown that the defendant\
    \ foresaw there was a highly probable risk of serious injury (or death) to the\
    \ victim. This test of a highly probable risk is different to the test for risk-taking\
    \ in relation to other offences for which recklessness is sufficient for the *mens\
    \ rea*. For other offences the level of risk needed to be foreseen by the defendant\
    \ is only that there is a possible risk of the consequence or circumstance occurring.\n\
    \nThe difference in the level of risk which has to be foreseen can be justified\
