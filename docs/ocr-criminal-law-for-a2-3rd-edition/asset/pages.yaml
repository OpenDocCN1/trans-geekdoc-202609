- pgno: 75
  md: '# Recklessness


    There is also a discrepancy in the law in that recklessness is not usually sufficient
    for the mens rea of an attempt even though it is sufficient for the full offence.


    Was the acquittal in *Millard and Vernon* justified (see section 5.3)? Should
    the fact that they were reckless in repeatedly pushing against the fence have
    made them liable for attempted criminal damage?


    Or it is more justified that the prosecution had to prove that they intended to
    damage the fence? If they had been liable for attempt through recklessness, this
    would have meant that they were being found guilty even though they had not formed
    any *mens rea*. After all, it is a key principle of criminal law that a person
    should not be guilty unless they have a guilty mind.


    For further explanation and discussion of the problems of *mens rea* in the law
    on attempts see Appendix 1 at A.1.3 for an extract from the Law Commission’s Report,
    *Conspiracy and Attempts*, No 304 (2009).


    # 5.5.5 Conditional intent


    Conditional intent is where D intends to commit an offence only if certain conditions
    are satisfied. As seen in *Husseyn* (section 5.3) this means that D may be found
    not guilty of attempt. The only way round this is by making sure the indictment
    is drafted in a certain way. Having to rely on using correct procedure is not
    a satisfactory way of dealing with the problem.


    The Law Commission propose that the definition of attempt in the Criminal Attempts
    Act 1981 should be amended so that an intent to commit an offence includes a conditional
    attempt to commit it. If this proposal is accepted, then this gap in the law will
    be solved.


    # 5.5.6 Should intention alone make a defendant guilty?


    The opposite point of view is that a defendant should not be criminally liable
    for his intentions. He must do something toward the commission of the full offence.
    This raises the question


    of whether Parliament should have made defendants liable where the facts are such
    that the commission of the full offence is impossible. Should Shivpuri have been
    guilty? He did not actually deal in drugs or do any wrong act. Is it enough that
    he intended to?


    Again, it can be argued that it is in the public interest to be able to convict
    someone like Shivpuri. Drug-dealing causes society many problems.


    # Self-test Questions


    +   1. Which section of which Act defines ‘attempt’?

    +   2. Give the definition of ‘attempt’.

    +   3. Give two cases where D was held to have done an act that was ‘more than
    merely preparatory’.

    +   4. Give two cases where D’s conduct was held to have been merely preparatory.

    +   5. Explain what is meant by a conditional intent. Can a conditional intent
    be sufficient for the *mens rea* of attempt?

    +   6. Can recklessness be sufficient for the *mens rea* of attempt?

    +   7. What does the Act state in relation to attempting to do the impossible?

    +   8. What did *Shivpuri* decide regarding attempting the impossible?

    +   9. Explain one way in which the statutory definition of attempt is an improvement
    on the previous law.

    +   10. Explain two areas where the current law on attempt is not satisfactory.


    # Examination question


    Consider whether the current law relating to attempted crimes strikes the right
    balance between protecting society and convicting only those who deserve to be
    punished.


    (OCR G153 Specimen Paper)'
