  md: '# Davidge v Bunnett (1984)


    D was given money by her flatmates to pay the gas bill but instead she used it
    to buy Christmas presents. There was a legal obligation to deal with the money
    in a particular way and, as she had not, she was guilty of theft.


    # Attorney-General’s Reference (No 1 of 1983) (1985)


    D’s salary was paid into her bank account by transfer. On one occasion her employers
    mistakenly overpaid her by £74.74. She was charged with theft but acquitted by
    the jury. The prosecution asked the Court of Appeal to rule on whether a person
    in this situation who dishonestly decided not to repay the £74.74 would be guilty
    of theft. The Court of Appeal held that s 5(4) clearly provided for exactly this
    type of situation. The defendant was under an ‘obligation to make restoration’
    and if there was a dishonest intention not to make restoration then all the elements
    of theft were present.


    In Davidge v Bunnett there was an intention to create legal relations under contract
    law, so the obligation was clear. However, it is not certain whether there would
    be a legal obligation (and so theft) if the situation happened between members
    of the same family. This might be considered as a domestic arrangement without
    the intention to create legal relations, so that there would not be theft.


    There must be a legal obligation to restore the property. In some situations there
    is no legal obligation to restore money. This is shown by Gilks (1972).


    # 10.3.4 Property received by a mistake


    Section 5 also provides for situations where property has been handed over to
    D by another’s mistake and so has become D’s property. If there were no special
    provision in the Act then this could not be ‘property belonging to another’ for
    the purposes of the law of theft. The section states, in s 5(4):


    # Gilks (1972)


    D had placed a bet on a horse race. The bookmaker made a mistake about which horse
    D had backed and overpaid D on the bets he had placed. D realised the error and
    decided not to return the money. The ownership of the money had passed to D, so
    the only way he could be guilty of theft was if s 5(4) applied. It was held that
    as betting transactions are not enforceable at law s 5(4) did not apply and D
    was not guilty.


    > ‘Where a person gets property by another’s mistake, and is under an obligation
    to make restoration (in whole or in part) of the property or its proceeds or of
    the value thereof, then to the extent of that obligation the property or proceeds
    shall be regarded (as against him) as belonging to the person entitled to restoration,
    and an intention not to make restoration shall be regarded accordingly as an intention
    to deprive that person of the property or proceeds.’


    This section was considered in Attorney-General’s Reference (No 1 of 1983) (1985).


    # Self-test Questions


    +   1. Which section of which Act defines theft?

    +   2. What are the points which need to be proved for the actus reus of theft?

    +   3. What are the points which need to be proved for the mens rea of theft?

    +   4. Give two different cases or examples of ‘appropriation’.'
