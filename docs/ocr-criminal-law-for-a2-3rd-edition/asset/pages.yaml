  md: "The court added ‘etc’ to the end of the list to show that there may be other\
    \ situations where consent would be permitted to be a defence. It is a question\
    \ of whether it is in the public interest or not.\n\nIn deciding what was in the\
    \ public interest, the courts have come to decisions which are difficult to reconcile.\
    \ In *Brown* (1993) the House of Lords held that consent was not a defence to\
    \ sado-masochistic acts done by homosexuals, even though all the participants\
    \ were adult and the injuries inflicted were transitory and trifling.\n\n> **Brown\
    \ (1993)**\n> \n> Five men in a group of consenting adult sado-masochists were\
    \ convicted of offences of assault causing actual bodily harm (s 47 OAPA 1861)\
    \ and malicious wounding (s 20 OAPA 1861). They had carried out acts which included\
    \ applying stinging nettles to the genital area and inserting map pins or fish\
    \ hooks into the penises of each other. All the victims had consented and none\
    \ had needed medical attention. Their convictions were upheld by the House of\
    \ Lords.\n\n> The Law Lords clearly made this decision as a matter of public policy.\
    \ Lord Templeman actually said:\n> \n> > ‘The question whether the defence of\
    \ consent should be extended to the consequences of sado-masochistic encounters\
    \ can only be decided by consideration of policy and public interest … Society\
    \ is entitled and bound to protect itself against a cult of violence.’\n\nHowever,\
    \ in *Wilson* (1996), the Court of Appeal held that where a defendant branded\
    \ his initials on his wife’s buttocks with a hot knife at her request, this was\
    \ not an unlawful act, even though she had to seek medical attention for the burns\
    \ caused. It held it was not in the public\n\ninterest that such consensual behaviour\
    \ should be criminalised. This was a situation of ‘personal adornment’ like having\
    \ a tattoo.\n\n# 9.8.3 Mistaken belief in consent\n\nWhere the defendant genuinely,\
    \ but mistakenly, believes that the victim is consenting then there is a defence\
    \ to an assault.\n\nIn this area the decisions of the courts are even more difficult\
    \ to reconcile with the general principle that ‘it is not in the public interest\
    \ that people should try to cause, or should cause, each other bodily harm for\
    \ no good reason’. In the following two cases the courts held that mistaken belief\
    \ in consent was a defence to the offences charged.\n\n> **Jonge (1936)**\n> \n\
    > Two schoolboys aged 14 and 15 were tossed into the air by older youths. One\
    \ victim suffered a broken arm and the other a ruptured spleen. The defendants\
    \ claimed they believed that the two victims consented to the activity. The Court\
    \ of Appeal quashed their convictions for offences under s 20 OAPA 1861 because\
    \ the judge had not allowed the issue of mistaken belief in consent to go to the\
    \ jury. The court held that a genuine mistaken belief in consent to ‘rough and\
    \ undisciplined horseplay’ could be a defence, even if that belief was unreasonable.\n\
    \nA similar decision was reached in *Aitken* (1992), where RAF officers poured\
    \ white spirit over a colleague who was wearing a fire-resistant flying suit,\
    \ but who was asleep and drunk at the time that this was done. He suffered 35\
    \ per cent burns. Their convictions under s 20 were quashed as the mistaken belief\
    \ in the victim’s consent should have been left to the jury.\n\n# 9.8.4 Need for\
    \ a defence of consent\n\nIt is important to allow a defence of consent in some\
    \ situations. For example, if there was no defence of consent, then contact sports\
    \ would"
