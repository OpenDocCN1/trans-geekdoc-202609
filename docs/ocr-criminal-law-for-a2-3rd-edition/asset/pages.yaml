  md: '# ### 9.4.1 *Actus reus* of s 18


    This can be committed in two ways:


    +   - wounding or

    +   - causing grievous bodily harm.


    The meanings of ‘wound’ and ‘grievous bodily harm’ are the same as for s 20. The
    word ‘cause’ is very wide so that it is only necessary to prove that the defendant’s
    act was a substantial cause of the wound or grievous bodily harm.


    # ### 9.4.2 *Mens rea* of s 18


    This is a specific intent offence. The defendant must be proved to have intended
    to:


    +   - do some grievous bodily harm or

    +   - resist or prevent the lawful apprehension or detainer of any person.


    # ### Intent to do some grievous bodily harm


    Although the word ‘maliciously’ appears in s 18, it has been held that this adds
    nothing to the *mens rea* of this section where grievous bodily harm is intended.


    The important point is that s 18 is a specific intent crime. Intention must be
    proved; recklessness is not enough for the *mens rea* of s 18. ‘Intention’ has
    the same meaning as shown in the leading cases on murder.


    So, as decided in *Moloney* (1985), foresight of consequences is not intention;
    it is only evidence from which intention can be inferred or found. Following the
    cases of *Nedrick* (1986) and *Woollin* (1998), intention cannot be found unless
    the harm caused was a virtual certainty as a result of the defendant’s actions
    and the defendant realised that this was so. (See section 3.1.2 for a fuller discussion
    on these cases and the meaning of intention.)


    Where the defendant is trying to resist or prevent arrest or detention then the
    level of intention regarding the injury is lower. The prosecution must prove that
    he had specific intention to resist or prevent arrest, but so far as the injury
    they need only prove that he was reckless as to whether his actions would cause
    a wound or injury. This was decided in *Morrison* (1989).


    #### Key facts


    | Offence | *Actus reus* | Consequence (injury) required | *Mens rea* |

    |---|---|---|---|

    | **Maliciously wounding or inflicting grievous bodily harm**<br><br>s 20 OAPA
    1861 | A direct or indirect act or omission: *Martin* (1881).<br><br>No need to
    prove an assault: *Burstow* (1998). | Either a wound—a cutting of the whole skin:
    *JCC v Eisenhower* (1984)<br><br>or<br><br>Grievous bodily harm (really serious
    harm) which includes psychiatric harm: *Burstow* (1998). | Intention or subjective
    recklessness as to causing some injury (though not serious): *Parmenter* (1991).
    |

    | **Wounding or causing grievous bodily harm with intent**<br><br>s 18 OAPA 1861
    | A direct or indirect act or omission which causes V’s injury. | A wound or grievous
    bodily harm (as above). | Specific intention to cause grievous bodily harm,<br><br>or<br><br>specific
    intention to resist or prevent arrest plus recklessness as to causing injury:
    *Morrison* (1989). |


    Figure 9.5 Key facts chart on s 20 and s 18'
