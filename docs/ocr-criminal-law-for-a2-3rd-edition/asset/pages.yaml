- pgno: 77
  md: 'This applies to murder, as seen by the case of Gibbins and Proctor (1918) where
    the father of a seven-year-old girl and his mistress kept the girl separate from
    the father’s other children and deliberately starved her to death. The father
    had a duty to feed her because he was her parent and the mistress was held to
    have undertaken to look after the children, including the girl, so she was also
    under a duty to feed the child. The omission or failure to feed her was deliberate
    with the intention of killing or causing serious harm to her. In these circumstances
    they were guilty of murder. The failure to feed the girl was enough for the actus
    reus of murder.


    mother’ for it to be considered a ‘creature in being’. This means that it must
    have been expelled from her body and have an independent circulation. However,
    the umbilical cord connecting the child and the mother need not have been cut.
    Also, it is probable that the child need not have taken its first breath for it
    to be considered a ‘reasonable creature in being’.


    In addition, in Attorney-General’s Reference (No 3 of 1994) (1997) it was stated
    by the House of Lords that where the foetus is injured and the child is born alive
    but dies afterwards as a result of the injuries, this can be the actus reus for
    murder or manslaughter.


    # Causation


    Murder is a result crime. The defendant cannot be guilty unless his act or omission
    caused the death. In most cases there is no problem with this. For example, D
    shoots V in the head and V is killed instantly. However, in some cases there may
    be other causes contributing to the death, such as poor medical treatment. This
    type of situation raises questions of causation.


    The law on causation is considered fully in Chapter 2 in section 2.3 and you need
    to know the law stated there.


    # 6.2.2 ‘Reasonable creature in being’


    This phrase means ‘a human being’. So, for murder, a person must be killed. Normally,
    this part of the definition does not cause any difficulties. The only two problem
    areas are:


    +   - Is a foetus in the womb a ‘reasonable creature in being’?

    +   - Is a victim still considered to be alive (and so a ‘reasonable creature
    in being’) if they are ‘brain-dead’ but being kept alive by a life-support machine?


    # Foetus


    A homicide offence cannot be charged in respect of the killing of a foetus. The
    child has to have an ‘existence independent of the


    # Attorney-General’s Reference (No 3 of 1994) (1997)


    The defendant stabbed his girlfriend who was about 23 weeks’ pregnant. She recovered
    from the stab wound but it caused her to give birth prematurely some seven weeks
    after the stabbing. The baby was born alive but died at the age of four months
    as a result of the premature birth. The defendant was charged with the murder
    of the child. At the trial the judge directed that a foetus was not a ‘reasonable
    creature in being’ and so the defendant could not in law be guilty of either the
    murder or manslaughter of the child. The defendant was acquitted.


    The House of Lords agreed that this was correct where the foetus died before being
    born but stated obiter that:


    > > ‘violence towards a foetus which results in harm suffered after the baby has
    been born alive can give rise to criminal responsibility’.


    However, they held that in the circumstances the offence was manslaughter as there
    was no mens rea for murder.'
