  md: 'act and for there to be, on an objective viewpoint, the risk of some harm.


    # Larkin (1943)


    D threatened another man with an open cut-throat razor, in order to frighten him.
    The mistress of the other man tried to intervene and, because she was drunk, accidentally
    fell onto the open blade which cut her throat and killed her. On appeal, D''s
    conviction for manslaughter was upheld. The act of threatening the other man with
    the razor was a technical assault. (See Chapter 9 for explanation of assaults.)
    It was also an act which was dangerous because it was likely to injure someone.


    Humphries J explained this in the judgment when he said:


    > ‘Where the act which a person is engaged in performing is unlawful, then, if
    at the same time it is a dangerous act, that is, an act which is likely to injure
    another person, and quite inadvertently he causes the death of that other person
    by that act, then he is guilty of manslaughter.’


    It is clear that the act need not be aimed at the victim. This was the situation
    in Larkin where the assault was against the man but the woman dies. It is also
    shown by the case of Mitchell (1983).


    # Mitchell (1983)


    D tried to push his way into a queue at the post office. A 72-year-old man told
    him off for this. D then punched the man, causing him to stagger backwards into
    an 89-year-old woman. The woman was knocked over and injured, and a few days later
    died of her injuries. D was convicted of unlawful act manslaughter. He had done
    an unlawful act by punching the man. This act was dangerous as it was an act which
    was likely to injure another person. Finally, the act inadvertently caused the
    death of the woman.


    ![](img/cc718e8d30bf7e5c8ed3badf83078451_109_0.png)


    Figure 8.1


    It can be seen that all the elements set by Humphries J in the statement in Larkin
    (1943) are present. The defendants in both Larkin and Mitchell were guilty of
    unlawful act manslaughter, despite the fact that in each case the person threatened
    (or punched) was not the one who died.


    # Act against property


    The act need not even be aimed at a person; it can be aimed at property, provided
    it is ‘such that all sober and reasonable people would inevitably recognise must
    subject another person to, at least, the risk of some harm’. This was illustrated
    by Goodfellow (1986).


    # Goodfellow (1986)


    D decided to set fire to his council flat so that the council would have to re-house
    him. The fire got out of control and his wife, son and another woman died in the
    fire. He was convicted of manslaughter and appealed. The Court of Appeal upheld
    the conviction because all the elements of unlawful act manslaughter were present.'
