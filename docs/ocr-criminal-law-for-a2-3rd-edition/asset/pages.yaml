  img_proc: true
- pgno: 19
  md: 'motor car over a hundred years ago led to new road traffic laws. These have
    been added to over the years so that we now have such offences as driving without
    a licence, driving while over the legal limit of alcohol, having tyres which do
    not have the right level of tread, and causing death by dangerous driving.


    Computers and the Internet have led to new offences being created, to protect
    people from Internet fraud and to prevent pornographic material from being viewed
    or downloaded.


    # 1.1.1 The role of the State


    The criminal law is mainly set down by the State. This can be by passing an Act
    of Parliament such as the Theft Act 1968 or by the issuing of regulations.


    A breach of criminal law can lead to a penalty, such as imprisonment or a fine,
    being imposed on the defendant in the name of the State. Therefore, bringing a
    prosecution for a criminal offence is usually seen as part of the role of the
    State.


    Indeed, the majority of criminal prosecutions are conducted by the Crown Prosecution
    Service (CPS) which is the State agency for criminal prosecutions.


    However, it is also possible for a private organisation to start a prosecution.
    For example, the RSPCA regularly brings prosecutions against people for offences
    of cruelty towards or neglect of animals. It is also technically possible for
    an individual person to bring a prosecution, but this very rarely happens.


    Even where an organisation or an individual brings a prosecution, the State still
    has control over the case as the Attorney-General can stay (halt) the proceedings
    at any time. This is done by the Attorney-General entering what is called a nolle
    prosequi. This stops the case from taking place, even if the original prosecutor
    wants it to continue.


    # 1.1.2 Conduct criminalised by the judges


    Although, in the vast majority of offences, the State decides what conduct is
    considered to


    be criminal, some conduct is criminalised by judges rather than the State. This
    occurs where judges create new criminal offences through case law. In modern times
    this only happens on rare occasions because nearly all law is made by Parliament.
    An example of conduct criminalised by judges is the offence of conspiracy to corrupt
    public morals. This offence has never been enacted by Parliament. However, the
    judges recognised that it existed in Shaw v DPP (1962).


    # Shaw v DPP (1962)


    The defendant published a Ladies Directory which advertised the names and addresses
    of prostitutes, with their photographs and details of the ‘services’ they were
    prepared to offer. He was charged with conspiracy to corrupt public morals. The
    House of Lords accepted that there was an offence of conspiracy to corrupt public
    morals, as there did not appear to be an offence which covered the situation.


    Another offence which has been created by the judges in modern times is marital
    rape. This was declared a crime in R v R (1991). Before that case, the law held
    that a husband could not be guilty of raping his wife, as she was assumed, by
    the fact of marriage, to consent to sexual intercourse with him. When the House
    of Lords decided the case of R v R they pointed out that society’s views on the
    position of women had changed. The House of Lords said:


    > ‘The status of women and the status of a married woman in our law have changed
    quite dramatically. A husband and wife are now for all practical purposes equal
    partners in marriage.’


    The House of Lords ruled that if a wife did not consent to intercourse, then the
    husband could be guilty of raping her.


    # 1.2 Elements of a crime


    There are many offences aimed at different ‘wrong’ behaviour. The offences you
    will have'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'to study for OCR A2 are murder, manslaughter, non-fatal offences against the
    person, theft, burglary and robbery. However, there are general principles which
    apply to all offences.


    The most important principle is that for all crimes, except crimes of strict liability
    (see Chapter 4), there are two elements which must be proved by the prosecution.
    These are:


    +   - actus reus and

    +   - mens rea.


    These terms come from a Latin maxim (actus non facit reum nisi mens sit rea) which
    means ‘the act itself does not constitute guilt unless done with a guilty mind’.
    Both an act (or omission) and a guilty mind must be proved for most criminal offences.


    # 1.2.1 Actus reus


    ''Actus reus'' has a wider meaning than ''an act'', as it can cover omissions
    or a state of affairs. The term ''actus reus'' has been criticised as misleading.
    Lord Diplock in Miller (1983) preferred the term ''prohibited conduct'', while
    the Law Commission in the Draft Criminal Code (1989) used the term ''external
    element''. We will look at the concept of actus reus in detail in Chapter 2.


    # 1.2.2 Mens rea


    ''Mens rea'' translates as ''guilty mind'' but this is also misleading. The Law
    Commission in the Draft Criminal Code (1989) used the term ''fault element''.
    The levels of ''guilty mind'' required for different offences vary from the highest
    level, which is specific intention for some crimes, to much lower levels, such
    as negligence or knowledge of a certain fact, for less serious offences. The levels
    of mens rea are explained in detail in Chapter 3.


    ![](img/cc718e8d30bf7e5c8ed3badf83078451_20_0.png)


    Figure 1.1 The elements of an offence


    # 1.2.3 Examples


    The actus reus and mens rea will be different for different crimes. For example,
    in murder the actus reus is the killing of a human being, and the mens rea is
    causing the death ‘with malice aforethought’ which means that the killer must
    have intended to kill or to cause grievous bodily harm. For theft, the actus reus
    is the appropriation of property belonging to another, while the mens rea is doing
    this dishonestly and with the intention permanently to deprive the other of the
    property.


    The actus reus and the mens rea must be present together, but if there is an ongoing
    act, then the existence of the necessary mens rea at any point during that act
    is sufficient. This is explained fully in Chapter 3. However, even where the actus
    reus and mens rea are present, the defendant may be not guilty if he has a defence
    (see section 1.3).


    # 1.2.4 Strict liability offences


    There are some crimes which are an exception to the general rule that there must
    be both actus reus and mens rea. These are crimes of strict liability, where the
    prosecution need prove only the actus reus; no mental element is needed for guilt.
    (See Chapter 4 for discussion of strict liability.)


    # 1.3 Defences


    Although the defendant may have done the required act, there are a number of general
    defences that may be available which will lead to a ‘not guilty’ verdict. The
    general defences you have to study are:


    +   - insanity

    +   - automatism

    +   - intoxication

    +   - duress

    +   - necessity.


    Automatism can be a defence to any offence. Insanity is a defence to all crimes
    which require mens rea; it is not a defence to strict liability'
