  md: '# Chapter 10


    # # Theft


    Theft is defined in s 1 of the Theft Act 1968.


    # Definition


    **Theft**


    ‘A person is guilty of theft if he dishonestly appropriates property belonging
    to another with the intention of permanently depriving the other of it.’


    The Act in the next five sections helps with the meaning of the words or phrases
    in the definition. This is done in the order that the words or phrases appear
    in the definition, making it easy to remember the section numbers. They are:


    +   - s 2 – dishonestly (part of the *mens rea*)

    +   - s 3 – appropriates (part of the *actus reus*)

    +   - s 4 – property (part of the *actus reus*)

    +   - s 5 – belonging to another (part of the *actus reus*)

    +   - s 6 – with the intention of permanently depriving the other of it (part
    of the *mens rea*).


    Remember that the offence is in s 1. A person charged with theft is always charged
    with stealing, ‘contrary to s 1 of the Theft Act 1968’. Sections 2–6 are definition
    sections explaining s 1. They do not themselves create any offence.


    The *actus reus* of theft is made up of the three elements in the phrase ‘appropriates
    property belonging to another’. So, to prove the *actus reus* it has to be shown
    that there was appropriation by the defendant of something which is property


    within the definition of the Act and which, at the time of the appropriation,
    belonged to another. There are two elements which must be proved for the *mens
    rea* of theft. These are that the appropriation of the property must be done ‘dishonestly’
    and there must be the intention of permanently depriving the other person of it.


    ![](img/cc718e8d30bf7e5c8ed3badf83078451_153_0.png)


    # ## 10.1 ‘Appropriation’


    The more obvious situations of theft involve a physical taking, for example a
    pickpocket taking a wallet from someone’s pocket. But appropriation is much wider
    than this.


    Section 3(1) states that:


    > “Any assumption by a person of the rights of an owner amounts to an appropriation,
    and this includes, where he has come by the property'
