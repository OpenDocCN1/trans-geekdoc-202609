  md: '# Width of appropriation


    As already seen in section 10.1, a wide variety of acts can be considered as appropriation.
    They include the physical picking up of an item, destroying property, throwing
    items away, selling property, switching price labels on items, giving worthless
    cheques in payment for goods, receiving a gift, and deciding to keep an item.


    All these are considered to be the assumption of the rights of an owner. This
    width of acts is as a result of the decision in Morris that what needed to be
    proved was the assumption of any of the rights of an owner.


    This leads to the question of whether this is the correct test. The Theft Act
    1968 uses the phrase ‘any assumption of the rights of an owner’. It can be argued
    that by interpreting the phrase as ‘the assumption of any of the rights’ the courts
    have gone beyond what was intended by Parliament.


    # Assumption at one point in time


    The decision in Gomez means that appropriation is considered to have occurred
    at one point in the whole process of theft. As seen in section 10.1.3, this led
    to the acquittal of the defendants in Atakpu and Abrahams. Yet the defendants
    in that case were bringing the cars into this country to sell them. Surely this
    was an on-going part of the theft? Why should the appropriation be regarded as
    only occurring when they hired the cars in Germany?


    The defendants were still assuming the right of an owner by continuing to drive
    the cars and by bringing them into this county. It seems more sensible to say
    that the appropriation was continuing. This is a view taken by judges in cases
    of robbery.


    There has to be a theft immediately before or at the time of the stealing for
    the offence of robbery to have been committed. One would assume that the definition
    of appropriation would be the same for robbery as for theft. Yet in two cases,
    Hale (1979) and Lockley (1995) it has been held that theft is an on-going process
    (see section 11.1.3).


    # Consent to appropriation


    A major criticism of the law is that there can be an appropriation, even though
    the owner of the goods has consented to the act the defendant has done in relation
    to the goods.


    This appears to be particularly odd in relation to items in shops. Lord Roskill’s
    view of the matter that the honest shopper is only doing what the shop expects
    and so has not assumed any of the rights of an owner is a very strong argument.


    There is also the argument that where an owner consents to the taking of property
    due to a false statement, then it is more appropriate to charge the defendant
    with an offence of fraud under the Fraud Act 2006. For cases prior to 2006 defendants
    could have been charged with the old offence of obtaining property by deception
    under s 15 of the Theft Act 1968.


    If this had been done then the law on theft would not have needed to be made so
    complicated.


    # Theft of gifts


    The problems caused by the decisions in Lawrence and Gomez that there could be
    an appropriation even though the owner consented to the taking have become even
    greater since the decision of the House of Lords in Hinks (2000) (see section
    10.1.2).


    In Hinks the owner had given the property to the defendant. It is difficult to
    understand how a defendant can have assumed the rights of an owner when the property
    has actually been given to them.


    # Conflict of civil and criminal law


    The decision in Hinks also means that the civil law and criminal law are in conflict.


    Lord Hobhouse, one of the judges in the case, stated that in his opinion there
    was no appropriation. This was because the civil law on gifts involves conduct
    by the owner who transfers the ownership of the gift to the donee (the person
    receiving the gift). Once this is done the gift is'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'the property of the donee. The donee does not have to do anything for the gift
    to become their property. It is not even necessary that the donee should know
    of the gift. For example, money could be transferred to the donee’s bank account
    without the donee’s knowledge. In view of this Lord Hobhousе thought that it was
    impossible to say that there was any appropriation by the defendant.


    # Reliance on dishonesty to prove theft


    Because of the problems arising from making appropriation so wide, proof of dishonesty
    is now the only distinguishing point between theft and an honest appropriation.
    This causes further difficulties as the law on dishonesty also causes problems.
    These are discussed in section 10.6.3.


    # Need for clarity and certainty in the law


    It is important that all law should be as clear and certain as possible. This
    is especially important for the criminal law. A conviction for theft carries a
    social stigma. It may even lose a person their job. Yet, as we can see from the
    above point, the law on theft is not clear.


    Remember that appropriation on its own is not enough for theft. All the other
    elements of theft must be present; in particular there must be dishonesty. There
    are many situations where there is appropriation but there is no dishonesty so
    that there cannot be theft. For example, all honest shoppers who place items in
    a basket or trolley provided by the store are appropriating the items, but because
    they intend to pay for them, they are not dishonest and so there is no offence
    of theft.


    # 10.6.2 Property belonging to another


    The word ‘property’ has not caused any real problems. The definition in the Act
    is so very wide, it includes almost everything. The Act itself sets out detailed
    rules on when land, animals and plants can or cannot be stolen. The decision in
    *Oxford v Moss* (1979), where information on examination questions was obtained,
    that knowledge cannot be stolen, does not normally


    cause any problems as most instances are covered by other offences such as copyright
    laws.


    # ‘Belonging to another’


    The Act states that ‘belonging to another’ includes situations where property
    is in the possession or control of another, or where another person had any proprietary
    right or interest in the property. This wide definition of ‘belonging to another’
    is needed since in many cases it might be difficult for the prosecution to prove
    that the victim was the legal owner. However, this phrase has caused some surprising
    decisions, in particular the decision in *Turner (No 2)* (1971).


    In this case the owner of a car took it from a garage without paying for repairs.
    The garage clearly had a lien (a legal right to retain the car until payment was
    made) and it could have been held that this gave the garage control of the car.
    However, the judge at the trial had directed the jury to ignore any question of
    a lien. On appeal to the Court of Appeal the judges simply based their decision
    to uphold the conviction on the fact that the garage had possession and control.
    In fact, if the question of lien is ignored, then Turner had the right to take
    the car back.


    # 10.6.3 Dishonesty


    There are criticisms of the *Ghosh* test (1982) for dishonesty. The main criticism
    is that it leaves too much to the jury, so that there is a risk of inconsistent
    decisions with different juries coming to different decisions in similar situations.
    It has been argued that it would be better for the judge to rule on whether there
    was dishonesty as a point of law rather than leave it as a matter of fact for
    the jury. However, this overlooks the fact that members of the jury still need
    to decide whether they believe what the defendant says.


    Another criticism of the test is that it places too much emphasis on objective
    views of what is dishonest rather than the defendant’s intentions. The first stage
    of the test requires the jury to consider whether what was done was dishonest
    according to the ordinary standards of reasonable and honest people. This has
    the odd effect that'
