  md: '# Self-test Questions


    +   1. What is meant by ‘recklessness’?

    +   2. Name three offences for which recklessness is sufficient for the mens rea
    of the offence.

    +   3. Before the case of G and another in 2003, what were the main problems in
    the law on recklessness?

    +   4. What did the case of G and another decide?

    +   5. Give a case in which it was decided that manslaughter could be be committed
    by recklessness.

    +   6. What standards is a defendant judged by when deciding if he has been negligent?

    +   7. Explain the principle of transferred malice.

    +   8. Give a case in which D was guilty because he had transferred malice.

    +   9. Explain the concept of ‘coincidence of actus reus and mens rea.

    +   10. Give a case where at the start of the actus reus D did not have the mens
    rea for the offence, but he was found guilty because he acquired the mens rea
    whilst the actus reus was continuing.


    # Activity


    Explain in the following situations whether actus reus and mens rea are present.
    (Do not forget that there may be transferred malice.)


    +   1. Bart has had an argument with Cara. He aims a punch at her head, but Cara
    dodges out of the way and Bart hits Homer who was standing behind Cara.

    +   2. Desmond is sitting in a lecture. He pushes his chair back, but does not
    realise that one of the chair legs is pressing onto Mark’s foot. Mark asks Desmond
    to move the chair, but Desmond thinks what has happened is funny and does not
    move but sits there laughing for several minutes.

    +   3. Sian throws a stone at a cat. Her aim is very poor and the stone hits Ratinder
    who is standing several feet away.


    # Examination question


    ‘Mens rea requires fault on the part of the defendant. The current law on both
    intention and recklessness is uncertain and unjust.’


    Critically evaluate the accuracy of this statement.

    (OCR, G153, January 2010)'
