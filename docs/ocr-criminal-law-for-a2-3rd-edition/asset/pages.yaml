- pgno: 67
  md: "The courts have held that these common-law tests are irrelevant, the important\
    \ point being whether the defendant has done an act which is ‘more than merely\
    \ preparatory’ to the commission of the main offence.\n\n# 5.2.1 ‘More than merely\
    \ preparatory’\n\nThe act that the defendant commits has to be more than merely\
    \ preparation for the main crime. Some acts are obviously mere preparation, but\
    \ other acts are more difficult to categorise.\n\nLet’s take the example where\
    \ D decides to rob a bank. First, he buys himself a shotgun and converts it into\
    \ a sawn-off shotgun. Both the buying and the converting are ‘merely preparatory’.\
    \ Next, he drives around the area, checking escape routes. Again, this is ‘merely\
    \ preparatory’.\n\nOn the day of the robbery, D steals a car (‘merely preparatory’)\
    \ and drives to the bank (still ‘merely preparatory’). He stands on the pavement\
    \ outside the bank, carrying the sawn-off shotgun in a bag. This is getting nearer,\
    \ but, according to the case of Campbell (1990) (see below), is still only ‘merely\
    \ preparatory’. Then he walks into the bank. Now he has gone beyond mere preparation\
    \ and can be charged with attempted robbery.\n\nThere have been many cases on\
    \ the meaning of ‘merely preparatory’. It is difficult to draw any general principle\
    \ from them. In Attorney-General’s Reference (No 1 of 1992) (1993) it was decided\
    \ that D need not have performed the last act before the crime proper, nor need\
    \ he have reached the ‘point of no return’.\n\n> Attorney-General’s Reference\n\
    > (No 1 of 1992) (1993)\n> \n> D dragged a girl up some steps to a shed. He lowered\
    \ his trousers and interfered with her private parts. His penis remained flaccid.\
    \ He argued that he could not therefore attempt to commit rape. His conviction\
    \ for attempted rape was upheld.\n\n> Looking at the whole of D’s acts, this seems\
    \ a sensible decision. However, if he had been stopped immediately after he had\
    \ dragged the girl to the shed, and before he lowered his trousers or interfered\
    \ with her, then it is unlikely that he could have been convicted. His act of\
    \ dragging her was probably ‘merely preparatory’.\n\nIn Gullefer (1987) the Court\
    \ of Appeal held that ‘more than merely preparatory’ means that the defendant\
    \ must have gone beyond purely preparatory acts and be ‘embarked on the crime\
    \ proper’.\n\n> Gullefer (1987)\n> \n> D jumped onto a race track in order to\
    \ have the race declared void and so enable him to reclaim money he had bet on\
    \ the race. His conviction for attempting to steal was quashed because his action\
    \ was merely preparatory to committing the offence.\n\n# 5.2.2 Cases showing mere\
    \ preparation\n\nThe case of Gullefer (above) illustrates a situation in which\
    \ D’s acts were mere preparation. Although D had tried to interfere with the race,\
    \ he had several other acts to do before the theft (the point at which he would\
    \ get his betting money back). He had to go to one of the betting points and ask\
    \ for his money back. Even just going towards the point would not be sufficient.\
    \ However, asking for the money would change his actions into ‘more than merely\
    \ preparatory’. He would be guilty of attempted theft. It is worth noting that\
    \ when the money was handed to him, he would then be guilty of the main offence\
    \ of theft.\n\nThe Court of Appeal stated that an attempt begins when ‘the merely\
    \ preparatory acts have come to an end and the defendant embarks upon the crime\
    \ proper’. It also pointed out that when this moment occurs will depend on the\
    \ facts in any particular case.\n\nThe case of Geddes (1996) also illustrates\
    \ acts which were only preparatory."
