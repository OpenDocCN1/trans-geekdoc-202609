  md: 'the defendant is liable for that injury. This is so even though that blow would
    have only caused bruising in a ‘normal’ person. An example is the case of Blaue
    (1975).


    # Blaue (1975)


    A young woman was stabbed by the defendant. She was told that she needed a blood
    transfusion to save her life but she refused to have one as she was a Jehovah’s
    Witness and her religion forbade blood transfusions. She died and the defendant
    was convicted of her murder.


    The fact that the victim was a Jehovah’s Witness made the wound fatal, but the
    defendant was still guilty because he had to take his victim as he found her.


    # 2.3.3 Intervening acts


    There must be a direct link from the defendant’s conduct to the consequence. This
    is known as the chain of causation. In some situations something else happens
    after the defendant’s act or omission and, if this is sufficiently separate from
    the defendant’s conduct, it may break the chain of causation.


    An example would be where the defendant has stabbed the victim who needs to be
    taken to hospital for treatment. On the way to hospital, the ambulance carrying
    the victim is involved in an accident and crashes, causing fatal head injuries
    to the victim.


    ![](img/cc718e8d30bf7e5c8ed3badf83078451_32_0.png)


    Under the ‘but for’ test it could be argued that the victim would not have been
    in the ambulance but for the defendant’s act in stabbing him. However, the accident
    is such a major intervening


    act that the defendant would not be liable for the death of the victim.


    The chain of causation can be broken by:


    +   - an act of a third party or

    +   - the victim’s own act or

    +   - a natural but unpredictable event.


    In order to break the chain of causation so that the defendant is not responsible
    for the consequence, the intervening act must be sufficiently independent of the
    defendant’s conduct and sufficiently serious.


    Where the defendant’s conduct causes a foreseeable action by a third party, then
    the defendant is likely to be held to have caused the consequence. This principle
    was applied in Pagett (1983) where his girlfriend was shot when he held her as
    a shield against police bullets (see section 2.3.1).


    # 2.3.4 Medical treatment


    Medical treatment is unlikely to break the chain of causation unless it is so
    independent of the defendant’s acts and ‘in itself so potent in causing death’
    that the defendant’s acts are insignificant. The following three cases show this.


    # Smith (1959)


    Two soldiers had a fight and one was stabbed in the lung by the other. The victim
    was carried to a medical centre by other soldiers, but was dropped on the way.
    At the medical centre the staff gave him artificial respiration by pressing on
    his chest. This made the injury worse and he died. The poor treatment probably
    affected his chances of recovery by as much as 75 per cent. However, the original
    attacker was still guilty of his murder.


    In this case it was held that a defendant would be guilty, provided that the injury
    caused by D was still an ‘operating’ and ‘substantial’ cause of death. Smith was
    guilty because the stab wound to the lung was still ‘operating’ (it obviously
    had not healed up) and it was a substantial cause of V’s death.'
