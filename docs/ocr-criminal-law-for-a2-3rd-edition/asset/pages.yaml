  img_proc: true
- pgno: 96
  md: 'The issue was considered again in *Stewart* (2009) when the Court of Appeal
    set out a three-stage test for juries in such cases to consider:


    +   1. Was D suffering from an ‘abnormality of mind’ (now mental functioning)?
    They pointed out that the mere fact that D has ADS would not automatically amount
    to an abnormality. The nature and the extent of the ADS had to be considered.

    +   2. If so, was D’s abnormality caused by the ADS?

    +   3. If so, was D’s mental responsibility substantially impaired? To decide
    this, all the evidence, including the medical evidence, should be considered.
    This would involve such matters as the extent and seriousness of D’s dependency
    and the extent to which he could control his drinking.


    Although these cases were decided before the change in the definition of diminished
    responsibility, it is likely that the same approach will be taken. In addition,
    under the new law, the jury must also decide whether the abnormality caused or
    was a significant factor in causing D to kill V.


    # 7.1.8 Reform of the law


    The law on diminished responsibility was reformed by the Coroners and Justice
    Act 2009. The Law Commission, in their report, *Murder, Manslaughter and Infanticide*
    (2006), had recommended that the definition of diminished responsibility should
    be modernised so as to take into account changing medical knowledge.


    ![](img/cc718e8d30bf7e5c8ed3badf83078451_96_0.png)


    Figure 7.1 Flowchart on diminished responsibility'
