  md: '# 3.2.2 Past problems in the law


    There used to be two levels of recklessness. These were:


    +   - subjective, where the defendant realised the risk, but decided to take it

    +   - objective, where an ordinary prudent person would have realised the risk:
    the defendant was guilty even if he did not realise the risk.


    The first type of recklessness is the only recklessness that the law now recognises
    as being sufficient to prove a defendant guilty where recklessness is sufficient
    to make the defendant guilty. However, during the period from 1982 to 2003, it
    was accepted that a defendant could be guilty of certain offences even though
    he had not realised that there was a risk. This was decided in the case of Metropolitan
    Police Commissioner v Caldwell (1981).


    # Metropolitan Police Commissioner v Caldwell (1981)


    D had a grievance against the owner of a hotel. He got very drunk and decided
    to set fire to the hotel. The fire was put out quickly, without serious damage
    to the hotel. D was charged with arson under s 1(2) of the Criminal Damage Act
    1971. This requires that D intended endangerment to life or was reckless as to
    whether life was endangered. D claimed that he was so drunk he had not realised
    people’s lives might be endangered. His conviction was upheld.


    In Caldwell the House of Lords held that recklessness covered two situations.
    The first is where D had realised the risk, and the second is where D had not
    thought about the possibility of any risk.


    This second meaning of ‘reckless’ caused problems in cases where D was not capable
    of appreciating the risk involved in his conduct, even though a reasonable person
    would have realised there was a risk. This occurred in


    Elliott v C (1983) where D was a 14-year-old girl with learning difficulties.
    She did not appreciate the risk that her act might set a shed on fire. But she
    was found guilty because ordinary adults would have realised the risk.


    This seemed very unfair. The girl was not blameworthy. If she had been judged
    by the standard of a 14-year-old with learning difficulties then she would not
    have been convicted. It was absurd to judge her against the standard of ordinary
    adults. This problem was eventually resolved when the House of Lords overruled
    Caldwell in the case of G and another (2003).


    # G and another (2003)


    The defendants were two boys, aged 11 and 12 years, who set fire to some bundles
    of newspapers in a shop yard. They threw them under a large wheelie bin and left.
    They thought that the fire would go out by itself. In fact, the bin caught fire
    and this spread to the shop and other buildings, causing about £1 million worth
    of damage. The judge directed the jury that they had to decide whether ordinary
    adults would have realised the risk. The boys were convicted under both ss 1 and
    3 of the Criminal Damage Act 1971. On appeal, the House of Lords quashed their
    conviction.


    The House of Lords held that a defendant could not be guilty unless he had realised
    the risk and decided to take it. The House of Lords overruled the decision in
    Caldwell, holding that in that case the Law Lords had adopted an interpretation
    of s 1 of the Criminal Damage Act 1971 which was ‘beyond the range of feasible
    meanings’.


    In G and another the House of Lords approved of the definition of recklessness
    set out in the draft Criminal Code which states that a person acts:


    > ‘recklessly with respect to:

    > (a) a circumstance when he is aware of a risk that it exists or will exist;'
