- pgno: 198
  md: '# 12.2 Automatism


    In Bratty v Attorney-General for Northern Ireland (1963) automatism was clearly
    defined.


    # Definition


    # Automatism


    An act done by the muscles without any control by the mind, such as a spasm, a
    reflex action or a convulsion; or an act done by a person who is not conscious
    of what he is doing such as an act done whilst suffering from concussion or whilst
    sleep-walking.


    In fact this definition covers two types of automatism:


    +   1. **Insane automatism**

    +   This is where the cause of the automatism is a disease of the mind within
    the M’Naghten rules. In such a case the defence is insanity and the verdict not
    guilty by reason of insanity. The law on insanity is set out in section 12.1 of
    this chapter.

    +   2. **Non-insane automatism**

    +   This is where the cause is an external one. Where such a defence succeeds,
    it is a complete defence and the defendant is not guilty.


    # 12.2.1 Non-insane automatism


    This is a defence because the actus reus done by the defendant is not voluntary.
    In addition the defendant does not have the required mens rea for the offence.


    The cause of the automatism must be external. Examples of external causes include:


    +   - a blow to the head

    +   - an attack by a swarm of bees

    +   - sneezing

    +   - hypnotism

    +   - the effect of a drug.


    This concept of no fault when the defendant was in an automatic state through
    an external cause was approved in Hill v Baxter (1958).


    # Hill v Baxter (1958)


    D drove through a halt sign without stopping, and collided with another car. He
    was charged with dangerous driving but acquitted by the magistrates who accepted
    that he remembered nothing from some distance before reaching the halt sign. The
    Divisional Court allowed the prosecution’s appeal and remitted the case back to
    the magistrates with a direction to convict as there was no evidence to support
    a defence of automatism.


    The court approved the judgment in the earlier case of Kay v Butterworth (1945)
    where the judge said:


    > > ‘A person should not be made liable at the criminal law who, through no fault
    of his own, becomes unconscious when driving, as, for example, a person who has
    been struck by a stone or overcome by a sudden illness, or when the car has been
    put temporarily out of his control owing to his being attacked by a swarm of bees.’


    In T (1990) it was accepted that exceptional stress can be an external factor
    which may cause automatism.


    # T (1990)


    D was raped. Three days later she took part in a robbery and an assault. She claimed
    that at the time she was suffering from post-traumatic stress disorder as a result
    of the rape and that she had acted in a dream-like state. The trial judge allowed
    the defence of automatism to go to the jury, but D was convicted.


    Reduced or partial control of one’s actions is not sufficient to constitute non-insane
    automatism. In Attorney-General’s Reference (No 2 of 1992) (1993)'
