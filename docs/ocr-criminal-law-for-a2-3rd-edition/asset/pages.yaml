  md: '# Good Samaritan law


    As already pointed out, other countries have a law that places people under a
    duty to help. Although there are problems in having such a law (see section 2.2)
    it can be argued that the modern view of moral responsibility is in favour of
    such a duty.


    What about the situation where it is clear that a child is going very near the
    edge of a cliff? The child’s parents or guardians would be liable for failure
    to act if they did not warn the child and try to remove them from the danger.
    However, a stranger would not be liable. In today’s society is this acceptable?


    However, there are also objections to making people criminally liable for failure
    to act. Should ordinary people be forced to act as ‘rescuers’? In a developed
    country, the state provides well-trained and well-equipped professionals such
    as the police, fire-brigade and ambulance crews to deal with emergency situations.
    These services are paid for through taxes, so it can be argued that every tax-payer
    is already doing their bit.


    As already discussed in 2.2 there is the risk that an untrained person might do
    more harm than good if they attempted ‘rescue’ someone. Alternatively the rescuer
    might put their own life at risk, thereby causing more work for the emergency
    services and possibly leading to the loss of two lives.


    A practical problem is the possibility that many people could be liable for one
    incident. What is the position if a commuter falls on to a railway line in the
    rush hour when the platform is full of people waiting for trains. Are all the
    people who see the person fall liable if they do not try to rescue them (if it
    is safe to do so) or alert station staff about it (if it is not safe to take more
    direct action)? It would be impractical to prosecute large numbers.


    # Problems of deciding when a duty exists


    It is not completely certain when a duty to act will exist. The normal way of
    deciding this is:


    +   1. By the judge at the trial determining whether there is evidence capable
    of establishing a duty in law

    +   2. The jury then deciding whether the duty does actually exist

    +   3. Finally the jury have to decide if the duty has been broken.


    This means that the law is capable of expanding to cover more situations. This
    was stated in Khan and Khan (1998).


    > The defendants had supplied heroin to a new user who took it in their presence
    and then collapsed. They left her alone and by the time they returned to the flat
    she had died. Their conviction for unlawful act manslaughter was quashed but the
    Court of Appeal thought there could be a duty to summon medical assistance in
    certain circumstances, so that a defendant could be liable for failing to do so.


    In Evans (2009) the Court of Appeal held that V’s half-sister was liable when
    she supplied V with heroin and failed to summon medical assistance when V had
    obviously over-dosed.


    The point that the law is capable of expanding to include new duty situations
    was stressed in Khan and Khan when the Court of Appeal stated obiter that duty
    situations could be extended to other areas. However, this could be argued to
    make the law too uncertain. In what new situations will it be decided that a failure
    to act can be sufficient for the mens rea of an offence?


    # Assuming a duty


    It can seem harsh that someone who accepts an adult into their home can be held
    to have assumed a duty towards that adult. This was the situation in Stone and
    Dobinson, although there was also a blood relationship to victim in that case.
    The victim was also a vulnerable person who had become incapable of looking after
    herself.


    An adult is normally held to be responsible for their own life. In fact a mentally
    capable adult can refuse medical treatment even though this is likely to cause
    their death.'
