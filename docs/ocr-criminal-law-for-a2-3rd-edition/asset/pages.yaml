  md: '# Environment Agency v Brook plc (1998)


    A leakage was caused by a hidden defect in a seal. The leak caused pollution.
    It was pointed out that defects in valves are a rare but ordinary fact of life.
    The company were liable for the leak.


    # Does not improve standards


    Although an important reason for imposition of strict liability is the maintenance
    of high standards so that health and safety are not put in jeopardy, there is,
    as mentioned earlier, no evidence that it improves standards. In fact, if the
    precautions against a very small risk are too expensive, then company managers
    may decide not to pay for the precautions, but to take the risk. This is the idea
    of ‘profit from risk’. The company’s profits are more important than spending
    large sums of money on protecting against a small risk. The cost of the precautions
    may even be far greater than any fine that will be imposed on the company for
    breaking the law.


    # Contrary to human rights


    Another argument against the imposition of strict liability where an offence is
    punishable by imprisonment is that it is contrary to the principles of human rights.
    This point was raised in R v G (2008).


    # R v G (2008)


    G was a 15-year-old boy who had consensual sex with a girl he thought was aged
    15. In fact she was only aged 12, but agreed that she had told him she was 15.
    G was prosecuted under s 5 of the Sexual Offences Act 2003 for the offence of
    rape of a child under 13. He was advised that this was a strict liability offence
    and his belief that she was 15 was irrelevant. He, therefore, pleaded guilty.
    The case was referred


    to the House of Lords on two points. The first was whether the fact that the offence
    was one of strict liability violated article 6(1) (entitlement to a fair hearing)
    and/or 6(2) (presumption of innocence) of the European Convention on Human Rights.


    The Law Lords unanimously decided that there was no breach of either part of article
    6. Article 6(1) only guaranteed fair procedure: it was not concerned with the
    content of the law. Article 6(2) required a defendant to be presumed innocent
    of the offence, but did not say anything about what the mental or other elements
    of the offence should be.


    So, in the case of G, the defendant was guilty of a very serious offence, even
    though he genuinely (and on reasonable grounds) believed that the girl was the
    same age as himself.


    # Social stigma


    The case of R v G also shows that strict liability can be imposed even where it
    creates serious social stigma. As a result of his conviction, G was put on the
    register of sex offenders. This was a particularly serious consequence for G.
    This is a strong argument against the imposition of strict liability in crimes
    which do lead to serious social stigma.


    This is not an issue in regulatory quasi-criminal offences as these carry little
    or no social stigma.


    # 4.8 Proposals for reform of strict liability


    The main problem is that there is no way of knowing whether Parliament has deliberately
    decided to make an offence one of strict liability, or whether they did not realise
    that that was the effect of the wording of the Act.


    It has, therefore, been suggested that Parliament should always state expressly
    whether'
