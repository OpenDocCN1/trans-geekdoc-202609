    3.1 We now turn to consider the problems created by the present law. The two major
    problems relate to the very wide range of conduct falling within the scope of
    involuntary manslaughter. As we explained in Part II, the offence encompasses,
    first, cases involving conduct that falls only just short of murder, where the
    accused was aware of a risk of causing death or serious injury, although


    he did not intend to cause either; second, cases where the accused is a professional
    person who makes a very serious mistake that results in death; and third, cases
    where a relatively minor assault ends in death. This leads to problems in sentencing
    and labelling, including the fundamental problem that many cases currently amounting
    to unlawful act manslaughter involve only minor fault on the part of the perpetrator,
    and therefore ought not, perhaps, to be described as manslaughter at all. There
