  md: '# Non-fatal offences against the person


    The main offences are set out in the Offences Against the Person Act 1861 (OAPA).
    They are based on whether or not the victim was injured; if there were injuries,
    their level of seriousness; and the intention of the defendant. The main offences
    are in ascending order of seriousness:


    +   - assault – common law but charged under s 39 Criminal Justice Act 1988

    +   - battery – common law but charged under s 39 Criminal Justice Act 1988

    +   - assault occasioning actual bodily harm – s 47 OAPA 1861

    +   - malicious wounding or inflicting grievous bodily harm – s 20 OAPA 1861

    +   - wounding or causing grievous bodily harm with intent – s 18 OAPA 1861.


    # 9.1 Common assault


    There are two ways of committing this:


    +   - assault

    +   - battery.


    Assault and battery are common-law offences. There is no statutory definition
    for either assault or for battery. However, statute law recognises their existence
    as both of these offences are charged under s 39 Criminal Justice Act 1988 which
    sets out that the maximum punishment for them is six months’ imprisonment or a
    fine of £5,000, or both.


    The act involved is different for assault and battery. For assault, there is no
    touching, only the fear of immediate, unlawful force. For battery, there must
    be actual force. There are often situations in which both occur. For example,
    where the defendant approaches the victim shouting that he is going to ‘get him’,
    then punches the victim in the face. The approaching, shouting and raising his
    arm prior to the punch constitute an assault, while the punch is the battery.
    As the act is different for each it is easier to consider assault and battery
    separately. The next section gives the definition of each and the following sections
    explain the individual elements.'
  merge: -1
  img_proc: true
