- pgno: 70
  md: 'D tried to argue that, as the safety catch was still on, he had not done the
    last act before the crime proper. The Court of Appeal said that buying the gun,
    shortening it, loading it and disguising himself with the visor were all preparatory
    acts. But once D got into V’s car and pointed the gun at V, then there was sufficient
    evidence to leave to the jury the question of whether there was an attempt.


    # ### 5.3 *Mens rea* of attempt


    For an attempt, the defendant must normally have the same intention as would be
    required for the full offence. If the prosecution cannot prove that D had that
    intention then D is not guilty of the attempt. This was shown by the case of *Easom*
    (1971).


    # *Easom* (1971)


    D picked up a woman’s handbag in a cinema, rummaged through it, then put it back
    on the floor without removing anything from it. His conviction for the theft of
    the bag and its contents was quashed. The Court of Appeal also refused to substitute
    a conviction for attempted theft of the bag and specific contents (including a
    purse and a pen), as there was no evidence that D intended to steal the items.


    In this case there was no evidence that the defendant had intended to permanently
    deprive the owner of the bag or items in it (part of the required *mens rea* for
    theft). As a result, he could not be guilty of attempted theft.


    A similar decision was made in the case of *Hussey* (1977).


    # *Hussey* (1977)


    D and another man were seen loitering near the back of a van. When the police
    approached, they ran off. D was convicted of attempting to steal some sub-aqua
    equipment that was in the van. The Court of Appeal quashed his conviction.


    The decisions by the Court of Appeal in both these cases can be criticised. Surely
    the defendant did intend to steal something? The fact that *Easom* did not do
    so (presumably because there was nothing really worth stealing) should not make
    him not guilty of attempting to steal. Equally, in the case of *Hussey*, the fact
    that he ran off because the police arrived does not mean that he was not trying
    to steal.


    These problems were resolved in *Attorney-General’s Reference* (Nos 1 and 2 of
    1979) (1979) where the Court of Appeal decided that if D had a conditional intent
    (i.e. intended to steal anything if there was anything worth stealing), D could
    be charged with an attempt to steal some or all of the contents. This is a technical
    procedural way around the problem.


    So, *Easom* would now be charged with attempting to steal some or all of the contents
    of the bag, rather than the bag itself and specific items in it. *Hussey* would
    be charged with attempting to steal some or all of the contents of the van. In
    this way they could be found guilty of attempted theft.


    # ### 5.3.1 Is recklessness enough for the *mens rea*?


    What if it can be proved that the defendant was reckless? Is this sufficient for
    him to be guilty of an attempt? In *Millard and Vernon* (1987) it was decided
    that it was not sufficient.


    # *Millard and Vernon* (1987)


    Ds repeatedly pushed against a wooden fence on a stand at a football ground. The
    prosecution alleged that they were trying to break it and they were convicted
    of attempted criminal damage. The Court of Appeal quashed their convictions.'
