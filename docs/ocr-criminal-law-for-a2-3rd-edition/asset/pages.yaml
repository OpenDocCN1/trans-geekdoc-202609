  md: "offences. Duress and necessity are not defences to a charge of murder.\n\n\
    Intoxication is only a defence where, because of his intoxication, the defendant\
    \ did not have the required mens rea for the offence charged. If the defendant,\
    \ even though he was drunk, had the required mens rea, then he cannot use intoxication\
    \ as a defence. Also intoxication is never a defence to any offence where recklessness\
    \ is sufficient for the mens rea. Each of these defences is considered in detail\
    \ in Chapter 12.\n\nYou will also study two more defences in relation to non-fatal\
    \ offences against the person. These are:\n\n+   - self-defence/defence of another/prevention\
    \ of crime\n+   - consent.\n\nIn fact self-defence/defence of another/prevention\
    \ of crime can be a defence to all offences including murder. There are also two\
    \ special defences which apply to murder only. These are diminished responsibility\
    \ and loss of control. Both are explained in Chapter 7.\n\n# 1.4 Standard and\
    \ burden of proof\n\nThe prosecution has to prove the case against the defendant.\
    \ There are rules on the level to which the case has to be proved. This is referred\
    \ to as the ‘standard of proof’.\n\n# 1.4.1 Standard of proof\n\nThe standard\
    \ of proof in criminal cases is ‘beyond reasonable doubt’. This is usually explained\
    \ by the judge telling the jury that they should only convict if they are satisfied\
    \ on the evidence, so that they are sure of the defendant’s guilt.\n\nThis is\
    \ a higher standard than the one used in civil cases. Civil cases have to be proved\
    \ only ‘on the balance of probabilities’. The reason that criminal cases require\
    \ a higher standard of proof is because the defendant is at risk of losing his\
    \ liberty if he is found guilty.\n\n# 1.4.2 Presumption of innocence\n\nAn accused\
    \ person is presumed innocent until proven guilty. The burden is on the prosecution\
    \ to prove the case. This means that it must prove both the required actus reus\
    \ and the required mens rea. An important case on these principles is Woolmington\
    \ (1935).\n\n> Woolmington v DPP (1935)\n> \n> D’s wife had left him and gone\
    \ to live with her mother. D went to the mother’s house and shot his wife dead.\
    \ He claimed that he had decided to ask his wife to come back to him and, if she\
    \ refused, that he would commit suicide. For this reason he was carrying under\
    \ his coat a loaded sawn-off shotgun. When his wife indicated that she would not\
    \ return to him, he threatened to shoot himself and brought the gun out to show\
    \ her he meant it. As he brought it out, it somehow went off, killing his wife.\
    \ He claimed that this was a pure accident.\n> \n> The judge at the trial told\
    \ the jury that the prosecution had to prove beyond reasonable doubt that the\
    \ defendant killed his wife. He then went on to tell them that, if the prosecution\
    \ satisfied them of that, the defendant had to show that there were circumstances\
    \ which made that killing pure accident. This put the burden of proof on the defendant\
    \ to prove the defence. In the House of Lords it was held that this was not correct.\n\
    \nThe decision in this case made several important points which the House of Lords\
    \ regarded as fixed matters on English law. These were:\n\n+   - the prosecution\
    \ must prove the case\n+   - this rule applies to all criminal cases\n+   - the\
    \ rule must be applied in any court where there is a criminal trial (currently\
    \ the Magistrates’ Court and the Crown Court)\n+   - guilt must be proved beyond\
    \ reasonable doubt and\n+   - a reasonable doubt can be raised by evidence from\
    \ either the prosecution or the defence."
