  md: "# Self-test Questions\n\n+   1. What is meant by voluntary intoxication?\n\
    +   2. When can voluntary intoxication be a defence to a criminal charge?\n+ \
    \  3. Give a case where voluntary intoxication was not allowed as a defence and\
    \ explain why it was not.\n+   4. What is meant by involuntary intoxication?\n\
    +   5. Give a case where involuntary intoxication was not allowed as a defence\
    \ and explain why it was not.\n+   6. Explain when a mistake caused by intoxication\
    \ will afford the defendant a defence.\n+   7. Which section of which Act of Parliament\
    \ prevents an intoxicated defendant who made a mistake about the need for self-defence?\n\
    +   8. Why is the law on intoxication largely based on public policy?\n+   9.\
    \ Explain two problems in the law on intoxication.\n+   10. Give two proposals\
    \ for reform made by the Law Commission in 2009.\n\n# Activity\n\nExplain whether\
    \ there would be a defence available in the following situations.\n\n+   1. Alice\
    \ took some illegal drugs. She is told that while she was under the influence\
    \ of the drugs, witnesses saw her hit Peter in the face with a saucepan, breaking\
    \ his jaw. Alice cannot remember doing this. What defence(s) might be available\
    \ to her if she is charged with offences under s 18 and s 20 OAPA 1861?\n+   \n\
    +   2. Courtney is a diabetic. One morning he gets up late and in his rush to\
    \ get to work he forgets to take his insulin. As a result he becomes violent later\
    \ in the day and punches Emma in the face. What defence(s) might be available\
    \ to him if he is charged with an offence under s 47 OAPA 1861?\n+   \n+   3.\
    \ Zahir is hit on the head by a slate which accidentally falls off a building.\
    \ He loses consciousness briefly but is then able to walk home. Later that day\
    \ he attacks his partner, Lynne, causing serious injuries to her. He has no recollection\
    \ of doing this. What defence(s) might be available to him if he is charged with\
    \ offences under s 18 and s 20 OAPA 1861?\n\n# 12.4 Duress\n\nDuress is a defence\
    \ based on the fact that the defendant has been effectively forced to commit the\
    \ crime. The defendant has committed the offence because he has been threatened\
    \ with death or serious injury. The law therefore allows a defence. The defendant\
    \ has to choose between being himself killed or seriously injured, or committing\
    \ a crime. In such a situation there is no real choice. The defendant can be considered\
    \ as so terrified that he ceases ‘to be an independent actor’. However, despite\
    \ this the defendant knowingly does the actus reus for the offence\n\nand has\
    \ the required mens rea. So, if the law did not allow the defence, he would be\
    \ liable for the offence.\n\nDuress can be either through a direct threat by another\
    \ (duress by threats) or through external circumstances (duress of circumstances).\
    \ Duress of circumstances overlaps with the defence of necessity.\n\n# 12.4.1\
    \ For which crimes is duress available?\n\nDuress can be used as defence to all\
    \ crimes, except murder, attempted murder and, possibly, treason."
