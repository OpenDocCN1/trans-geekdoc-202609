    “It didn’t say the location of the banks but different ones had been used including
    Barclays, Alliance and Leicester, NatWest and HSBC.”


    She is not Paddock Wood’s only victim of card ‘skimming’, where a removable scanner
    is placed in the machine to copy the card details.


    As reported last week, a 50-year-old man from the town had money stolen from his
    account between December 19 and December 22 after using the NatWest machine.


    # Question


