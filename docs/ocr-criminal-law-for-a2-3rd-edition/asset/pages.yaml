  md: '# Chapter 2


    # Actus reus


    # 2.1 What is actus reus?


    As already stated in Chapter 1, the actus reus is the physical element of a crime.
    It can be:


    +   - an act or

    +   - a failure to act (an omission) or

    +   - a ‘state of affairs’.


    In most cases the actus reus will be something the defendant does, but there are
    situations in which a failure to act is sufficient for the actus reus. These are
    set out at section 2.2. ‘State of affairs’ cases are very rare. These are considered
    at section 2.1.3.


    # 2.1.1 Voluntary nature of actus reus


    The act or omission must be voluntary on the part of the defendant. If the defendant
    has no control over his actions then he has not committed the actus reus. In Hill
    v Baxter (1958) the court gave examples of where a driver of a vehicle could not
    be said to be doing the act of driving voluntarily. These included where a driver
    lost control of his vehicle because he was stung by a swarm of bees, or if he
    was struck on the head by a stone or had a heart attack while driving.


    Other examples of an involuntary act include where the defendant hits another
    person because of a reflex action or a muscle spasm. Yet another is where one
    person pushes a second person, causing them to bump into a third person. In this
    situation the act of the second person who has been pushed is involuntary. Even
    though he has


    hit the third person, he has not committed the actus reus for any assault offence.
    This happened in the case of Mitchell (1983) (see section 8.1.2). Of course, the
    original ‘pusher’ can be liable.


    These examples show that the criminal law is concerned with fault on the part
    of the defendant. Where there is an absence of fault, then the defendant is usually
    not liable.


    # 2.1.2 ‘State of affairs’ cases


    There are some rare instances in which the defendant has been convicted even though
    he did not act voluntarily. These situations involve what are known as ‘state
    of affairs’ cases. An example of this is the case of Larsonneur (1933).


    # Larsonneur (1933)


    The defendant had been ordered to leave the United Kingdom. She decided to go
    to Eire, but the Irish police deported her and took her back to the UK. She did
    not wish to go back and was certainly not doing this voluntarily. When she landed
    in the UK she was immediately arrested and charged that being ‘an alien to whom
    leave to land in the UK had been refused’, she had been found in the UK. She was
    convicted because she was an alien who had been refused leave to land and she
    had been ‘found in the UK’. It did not matter that she had been brought back by
    the Irish police against her will. (See also section 4.1 on strict liability.)'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# 2.1.3 Consequence of actus reus


    For some crimes the actus reus must also result in a consequence. This can be
    seen in the offence of assault occasioning actual bodily harm (s 47 Offences Against
    the Person Act 1861). There must be an actus reus (the application or threat of
    unlawful force) but there must also be a consequence of ‘actual bodily harm’,
    in other words some injury to the victim. This could be just a bruise or it could
    be a broken nose or broken arm. It could even be psychiatric injury. Without this
    consequence there cannot be a s 47 offence.


    # 2.2 Omissions as actus reus


    The normal rule is that an omission cannot make a person guilty of an offence.
    This was explained by Stephen J, a 19th-century judge, in the following way.


    > ‘A sees B drowning and is able to save him by holding out his hand. A abstains
    from doing so in order that B may be drowned. A has committed no offence.’


    # Activity


    Read the following scenario and discuss whether you think Zoe should be guilty
    of an offence.


    # Scenario


    Zoe is sitting by a swimming pool in the grounds of a hotel. Jason is swimming
    in the pool. He is the only person in the water and there are no other people
    near the pool. Jason gets out of the pool and while walking around it slips and
    falls into the water. He is knocked unconscious. Zoe sees this happen but she
    does nothing. Jason drowns.


    Would it make any difference to your answer if Zoe could not swim?


    # A ‘Good Samaritan’ law?


    Some other countries have a law which is known as a ‘Good Samaritan’ law. It makes
    a person responsible for helping other people in an ‘emergency situation’, even
    though they are complete strangers. French law has this and an example was seen
    when Princess Diana’s car crashed in Paris in 1997. Journalists who had been following
    her car took photographs of her, injured, in the car. They did not try to help
    her, even though she was critically injured. The French authorities threatened
    to charge these journalists under the French ‘Good Samaritan’ law.


    There are problems in enforcing such a law. What if a ‘rogue’ pretends to be seriously
    hurt in order to lure a stranger to his assistance, so that the rogue can then
    rob the stranger? There is also the risk that an untrained person, by intervening,
    could do more harm to an injured person. Also, what is an ‘emergency situation’?
    Who decides that there is an emergency so that the ‘Good Samaritan’ law is operating?


    A problem would also arise if several people witnessed the incident. Do all of
    them have to help? Or is it enough if one of them helps? If one person helps,
    are the others still under a duty to help?


    Finally, there is the question of whether would-be rescuers have to put themselves
    at risk in order to help. It seems unlikely that the law would require this. In
    the case of Miller (1983) (see section 2.2.1) the House of Lords thought that
    a defendant who has created the risk would only be expected to take reasonable
    steps. He would not be expected to put himself at risk. If this is the situation
    for the person who has caused the problem, then surely the same would have to
    apply to innocent passers-by?


    # 2.2.1 Exceptions to the rule


    There are exceptions to the rule that an omission cannot make a person guilty
    of an offence. In some cases it is possible for a failure to act (an omission)
    to be the actus reus.'
