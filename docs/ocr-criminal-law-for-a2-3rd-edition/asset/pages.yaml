- pgno: 73
  md: '+   - Some of the decisions in this area are not effective for protecting the
    public.

    +   - The wording of the Criminal Attempts Act states that the defendant must
    do an act which is more than merely preparatory. This means that an attempt cannot
    be committed by an omission.

    +   - The definition states that D must act ‘with intent to commit an offence’.
    Does this mean that only direct intention is sufficient for the mens rea of attempt?

    +   - The early decisions on mens rea left a loophole where D intended to steal
    if he could find anything worth stealing (see section 5.3).

    +   - Should D be guilty because of his intention where it is impossible for him
    to commit the full offence?


    # 5.5.1 What is ‘more than merely preparatory’?


    The cases Gullefer, Geddes and Campbell that we looked at in section 5.2.1 show
    that the courts are not always prepared to take a broad approach when deciding
    what is ‘more than merely preparatory’. This makes it difficult to know exactly
    what conduct will be considered more than merely preparatory.


    However, it can be argued that the ‘more than merely preparatory’ test is an improvement
    on the law as it stood prior to the passing of the Criminal Attempts Act 1981.
    The old law used a variety of different tests, so that it was not easy to predict
    which test would be used in any given case. (See Appendix 1 Section A.1.2 for
    a summary of the historical background set out in the Law Commission’s Consultation
    Paper, Conspiracy and Attempts, No 183 (2007).)


    The ‘more than merely preparatory’ test has helped to clarify and simplify the
    law. It also makes it easier for juries to apply the law, as they can use their
    common sense in deciding if the things the defendant did were ‘more than merely
    preparatory’. However, it does leave a gap in the law for situations like those
    of Gullefer, Geddes and Campbell.


    The Law Commission suggested in their Consultation Paper, Conspiracy and Attempts,
    No 183 (2007) that the law should be reformed to have two offences instead of
    just attempt. They suggested that these should be:


    +   - criminal attempt

    +   - criminal preparation


    The Commission proposed that ‘criminal attempt’ would be limited to situations
    where D did the last act(s) before the full offence would be committed. ‘Criminal
    preparation’ according to the Law Commission view would have been where D engaged
    in conduct preparatory to committing the full offence. This would mean that cases
    like Gullefer, Geddes and Campbell would come into this category.


    However, following consultation the Law Commission found that judges and lawyers
    were


    # Activity


    Explain whether in each of the following scenarios there is an attempt to commit
    an offence.


    +   1. Amir knows his girlfriend has been going out with Blake. Amir plans to
    disfigure Blake. He buys some acid which he intends to throw in Blake’s face and
    then drives to Blake’s house. As he is about to get out of the car, he sees a
    police car nearby. Amir immediately drives off.

    +   2. Connor puts some poison in Donna’s drink, intending to kill her. The amount
    he puts in the drink is insufficient to kill and Donna survives.

    +   3. Faye sees a handbag in the ladies’ cloakroom. She hopes there will be some
    money in it, so she opens it. In fact, the bag contains only make-up and tissues.
    Faye closes the bag and replaces it.

    +   4. Greg and Hans are found in the garden of a house with masks, a torch and
    screwdrivers in their pockets. They admit they intended to burgle the house.

    +   5. Ian fires a shot at Jani but misses her. He admits he intended to kill
    her.'
