  md: 'As yet no reform to the law has been made, but the Law Commission has made
    very specific proposals for how the law could be reformed.


    # 6.4.3 No defence where excessive force is used


    If a defendant can show that he used reasonable force in self-defence or prevention
    of crime in doing the killing, he is not guilty of murder. However, where force
    is necessary in self-defence or prevention of crime, but the defendant uses excessive
    force in the circumstances, he is guilty of murder. This ‘all or nothing’ effect
    of the defence is very harsh in murder cases, as the defendant is either acquitted
    or given a life sentence. He was justified in using some force and his only ‘fault’
    is that he used more force than was reasonable. This surely does not justify a
    life sentence.


    The case of *Clegg* (1995) and *Martin (Anthony)* (2002) highlighted this problem
    (see 6.2.4).


    Both these decisions have been criticised. Many people believe that a person who
    kills where he has an honest, but unreasonable, belief as to the degree of force
    needed is not as blameworthy as a ‘true’ murderer. It is unjust that such a person
    is found guilty of the same crime of murder and sentenced to the same punishment.


    The Coroners and Justice Act 2009 does now allow a partial defence where D kills
    having lost control due to fear of serious violence. But it is still doubtful
    that either *Clegg* or *Martin* would have been able to prove ‘loss of control’.


    # 6.4.4 No defence of duress


    Duress is where the defendant is threatened with death or serious injury so that
    he takes part in an offence. Duress is allowed as a defence to almost all offences,
    but it is not allowed as a defence to murder (or attempted murder). See section
    12.4 for full discussion of the defence of duress.


    The Law Commission gave the following example:


    > > ‘A taxi driver has his vehicle commandeered by a gunman, who holds a gun to
    the driver’s head and tells him to drive to a place where the gunman says he may
    shoot someone. The taxi driver does as the gunman demands and the gunman goes
    on to shoot and kill someone.’


    The report points out that, under the existing law, the taxi driver is an accomplice
    in the killing and could be convicted of murder. He would then receive a mandatory
    life sentence just as the gunman would. This is clearly not fair.


    The Law Commission proposed that duress should be a complete defence to murder.
    However, a defendant claiming this defence would have to prove that he or she
    was threatened with death or life-threatening harm and had had no realistic opportunity
    to seek police protection. The jury would also have to find that a person of ordinary
    courage might have responded in the same way as D did by taking part in the commission
    of the crime.


    # 6.4.5 Mandatory life sentence


    If a defendant aged 18 or over is convicted of murder, the judge has to pass a
    sentence of life imprisonment. For offenders aged 10–17 who are found guilty of
    murder, the judge has to order that they be detained at Her Majesty’s Pleasure.
    Because the judge has no discretion in what sentence to impose, this is known
    as a *mandatory* sentence. The judge cannot give a different sentence even if
    he feels that the defendant is not as blameworthy as a deliberate killer.


    For other offences, including attempted murder, the judge can decide what the
    most appropriate sentence is for the offence and the offender. This makes it possible
    for a judge to give even a community sentence, where the circumstances justify
    it. This happened in the case of *Gotts* (1992), where the father of a 16-year-old
    boy'
