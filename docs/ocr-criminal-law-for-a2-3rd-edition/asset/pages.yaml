  img_proc: true
- pgno: 194
  md: "This means that the hospital can only release the defendant from the hospital\
    \ if the Home Secretary gives consent.\n\n# 12.1.6 Comment on the law of insanity\n\
    \nThe first major problem is that the definition of insanity was set by the M’Naghten\
    \ Rules in 1843. At that time medical knowledge of mental disorders was very limited.\
    \ Much more is known today about mental disorders and a more modern definition\
    \ should be used.\n\nThe definition needs to be updated in the light of modern\
    \ understanding of mental illness. The only area which Parliament has reformed\
    \ is the options available to judges when dealing with those found not guilty\
    \ by reason of insanity.\n\nAt least this wider range of options has stopped the\
    \ injustice of epileptics and diabetics having to be sent to a mental hospital.\
    \ Prior to the Criminal Procedure (Insanity and Unfitness to Plead) Act 1991 the\
    \ only course available to a judge was to send the defendant to a mental hospital.\
    \ Judges can now instead put the defendant on a supervision order or give an absolute\
    \ discharge.\n\n# Legal definition of insanity\n\nAnother major problem is that\
    \ the definition has become a legal one rather than a medical one. This causes\
    \ two problems.\n\n+   1. People suffering from certain mental disorders do not\
    \ come within the definition, for example those suffering from irresistible impulses\
    \ and who are psychopaths such as Byrne (1960). They do not come within the M’Naghten\
    \ Rules as they know what they are doing and that it is wrong. However, they cannot\
    \ prevent themselves from acting and have a recognised mental disorder.\n+   \n\
    +   2. On the other hand those suffering from physical illnesses such as diabetes\
    \ (Hennessy (1989)), brain tumours or hardening of the arteries (Kemp (1957))\
    \ are considered to be legally insane. Even a sleep-walker has come\n\nwithin\
    \ the definition (Burgess (1991)). The justification for this is that there is\
    \ an internal cause of their actions: the behaviour may recur and it may be possible\
    \ to treat it.\n\n# The overlap with automatism\n\nInsanity overlaps with automatism.\
    \ It is necessary to decide whether the defendant’s automatic state is due to\
    \ a mental illness or due to external factors. The courts have decided that those\
    \ suffering from any illness, mental or physical, which affects their mind or\
    \ puts them into an automatic state amounts to insanity. This means that the defence\
    \ of non-insane automatism has been removed from such people as epileptics and\
    \ diabetics.\n\nThis has serious consequences, as those successfully using the\
    \ defence of automatism are entitled to a complete acquittal. Whereas, on a finding\
    \ of not guilty by reason of insanity, the judge has to impose some order on the\
    \ defendant.\n\nIt may be argued that the reason the courts are reluctant to allow\
    \ defendants to use the full defence of automatism is because it will lead to\
    \ an acquittal and the defendant will be free from any order or supervision. There\
    \ is the argument that, even though the cause of the erratic behaviour may be\
    \ a physical illness, there is still the risk that such a person may commit further\
    \ offences. Extending insanity to cover those who commit an offence because of\
    \ a physical illness means that these people can be supervised.\n\n# Decision\
    \ in Windle (1952)\n\nFollowing the decision in Windle (1952), a defendant who\
    \ is suffering from a serious recognised mental illness and who does not know\
    \ that his act is morally wrong cannot have a defence of insanity when he knows\
    \ that his act is legally wrong. An Australian case refused to follow this decision.\
    \ In Johnson (2007) the Court of Appeal clearly thought that the Australian case\
    \ had some merit, but they were obliged to follow Windle."
