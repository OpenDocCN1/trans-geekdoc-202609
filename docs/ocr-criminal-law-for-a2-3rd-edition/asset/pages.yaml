  md: '# 12.5 Necessity


    This is where circumstances force a person to act in order to prevent a worse
    evil from occurring. The defence has similarities with the defence of duress of
    circumstances, yet the courts have been reluctant to recognise necessity as a
    defence in its own right. The leading case is Dudley and Stephens (1884).


    # Dudley and Stephens (1884)


    The two defendants were shipwrecked with another man and V, a 17-year-old cabin
    boy, in a small boat about 1,600 miles from land. After drifting for 20 days,
    and having been nine days without food and seven days without water, the two defendants
    killed and ate the cabin boy. Four days later they were picked up by a passing
    ship and on their return to England were convicted of murder. Their claim of necessity
    to save themselves from dying was rejected.


    It is interesting to note that although Dudley and Stephens were convicted of
    murder and sentenced to be hung, their sentence was commuted to a mere six months’
    imprisonment.


    In this case the charge was of murder, so it can be argued that the law on necessity
    is in line with the law on duress, as duress is not available on a charge of murder.
    However, in the case of Buckoke v Greater London Council (1971) Lord Denning stated
    obiter that he thought the defence of necessity would not be available to emergency
    service drivers (fire-fighters or ambulance drivers) if they broke traffic laws
    in an attempt to arrive at an emergency quickly. He said that such a driver should
    be congratulated for their action and he hoped that anyone in that situation would
    not be prosecuted. Nevertheless, the law seems to be that such a person could
    be prosecuted and would not have a defence of necessity.


    As there is no general defence of necessity, the traffic laws have now been changed
    to give emergency service drivers a special defence in certain circumstances.


    # 12.5.1 Recognition of the defence


    It is interesting that the defence has been recognised by the courts when making
    an order in some civil cases. An example of this is Re F (Mental Patient: Sterilisation)
    (1990).


    # Re F (Mental Patient: Sterilisation) (1990)


    A health authority applied for a declaration that it was lawful to sterilise a
    girl who had a very severe mental disability. The girl had formed a sexual relationship
    with another patient, putting her at risk of becoming pregnant. Doctors said that
    she would not be able to understand pregnancy and it could be disastrous for her
    precarious mental health. The girl’s mother supported the application, but the
    Official Solicitor, who was acting on behalf of the girl as she was unable to
    give consent to an operation herself, thought that performing such an operation
    would be illegal.


    The House of Lords granted the application and Lord Brandon stated:


    > ‘In many cases … it will not only be lawful for doctors, on the ground of necessity,
    to operate on or give other medical treatment to adult patients disabled from
    giving their consent, it will also be the common duty to do so.’


    Another case in which doctors sought a declaration that it would be lawful for
    them to operate was Re A (Conjoined twins) (2000). In this case the defence of
    necessity was considered and held to be available as a defence even to a potential
    charge of murder.


    # Re A (Conjoined twins) (2000)


    Conjoined twins were born with one of them having no proper heart or lungs. She
    was being kept alive by the other twin, whose heart circulated blood for both
    of them. Their parents'
