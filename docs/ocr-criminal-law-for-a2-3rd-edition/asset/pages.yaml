    # 12.4.6 Threat to make defendant commit a specific offence\n\nThe defendant can\
    \ only use the defence if the threats are in order to make him commit a specific\
    \ offence.\n\n> **Cole (1994)**\n> \n> D claimed that he and his girlfriend and\
    \ child had been threatened (and he had been actually hit with a baseball bat)\
    \ in order to make him repay money he owed. As he did not have the money, D carried\
    \ out two robberies at building societies to get sufficient money to repay the\
    \ debt. D said he only did this because of the threats of violence to him and\
    \ his family.\n> \n> His conviction was upheld because he had not been told to\
    \ commit the robberies. The threats to him were directed at getting repayment\
    \ and not directed at making him commit a robbery. This meant there was not a\
    \ sufficient connection between the threats and the crimes he committed, so the\
    \ defence of duress was not available to him.\n\nThis applies only to duress by\
    \ threats. In duress of circumstances the defence may be used for any offence\
    \ which is an appropriate response to the danger posed by the circumstances. As\
    \ seen in *Abdul-Hussain (1999)* above, the danger was of torture and execution,\
    \ and the offence committed was hijacking which enabled them to get to a safe\
    \ venue.\n\n# 12.4.7 Intoxication and duress\n\nIf the defendant becomes voluntarily\
    \ intoxicated and mistakenly believes he is being threatened, he cannot use duress\
    \ as a defence. A mistake in these circumstances is unreasonable. However, if\
    \ there is no mistake and the intoxication is irrelevant to the duress, the defendant\
    \ can use the defence of duress. This could be, for example, where he is threatened\
    \ by a man with a gun. In this situation there is duress and it is irrelevant\
    \ whether the defendant is intoxicated or not.\n\n# 12.4.8 Self-induced duress\n\
    \nThis is where the defendant has brought the duress on himself through his own\
    \ actions. For example, a defendant voluntarily joins a criminal gang and commits\
    \ some offences, but then is forced under duress to commit other crimes which\
    \ he did not want to do.\n\nThe normal rule is that where the defendant is aware\
    \ that he may be put under duress to commit offences, he cannot use the defence.\
    \ This has been held to apply to the following situations:\n\n+   - The defendant\
    \ joins a criminal gang which he knows are likely to use violence.\n+   - The\
    \ defendant puts himself in a position where he knows that he is likely to be\
    \ subjected to threats of violence or actual violence. This could be by being\
    \ involved in criminal activity although not part of a gang, or by becoming indebted\
    \ to a drug dealer.\n\nThese situations can be illustrated by specific cases."
