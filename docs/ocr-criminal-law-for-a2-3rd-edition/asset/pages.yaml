    # Indirect act


    A battery can also be through an indirect act such as a booby trap. In this situation
    the defendant causes force to be applied, even though he does not personally touch
    the victim. This occurred in Martin (1881) where the defendant placed an iron
    bar across the doorway of a theatre. He then switched off the lights. In the panic
    which followed several of the audience were injured when they were trapped and
    unable to open the door. Martin was convicted of an offence under s 20 OAPA 1861.


