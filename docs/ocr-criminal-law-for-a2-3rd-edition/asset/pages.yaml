- pgno: 207
  md: '(1984)). This appears to be unfair to defendants in Kingston’s situation.


    # 12.3.5 Proposals for reform


    There have been several proposals for reform of the law on intoxication. In 1975
    the Butler Committee proposed the creation of a new offence of ‘dangerous intoxication’.


    The idea was that this proposed offence would be used where the defendant was
    acquitted of a dangerous offence on the basis that he was intoxicated. Following
    the acquittal on the main offence, the defendant could then be convicted of ‘dangerous
    intoxication’. It was proposed that such an offence would carry a maximum sentence
    of one year’s imprisonment for a first offence and a maximum of three years’ imprisonment
    for any further offences.


    This aimed at balancing public protection against the defendant’s rights. The
    defendant would not be liable for the serious main offence and a possible lengthy
    prison sentence, but could still be imprisoned for a relatively short period for
    the proposed offence.


    However, this proposal was rejected. The main arguments against it were that it
    did not distinguish how serious the original offence was. This meant that those
    who had killed would have been treated in the same way as those who had committed
    an assault.


    In 1993 the Law Commission proposed that evidence of voluntary intoxication should
    be available for all offences on the issue of mens rea. This would allow a defendant
    to be acquitted if he did not have the necessary mens rea. Like the Butler Committee,
    they also proposed a separate offence, this time of ‘criminal intoxication’.


    The idea was abandoned and the 1995 report of the Law Commission proposed codifying
    the law as it then stood with just some minor amendments. This included the rule
    in Majewski as discussed above in section 12.3.4. However, no action was taken
    on these proposals.


    # Recent proposals


    In 2009 the Law Commission published a report, Intoxication and Criminal Liability,
    (Law Com 314).


    This recommended that:


    +   - the distinction between voluntary and involuntary intoxication should be
    kept

    +   - the use of the terms ‘specific intent’ and ‘basic intent’ should be abolished;
    instead offences should be categorised as those where mens rea is an integral
    fault element (e.g. where there has to be intention as to a consequence) and those
    where mens rea is NOT an integral fault element (e.g. because the offence merely
    requires proof of recklessness).


    # Voluntary intoxication


    Where D was voluntarily intoxicated, the Law Commission proposed:


    +   - there should be a general rule that where D is charged with an offence for
    which mens rea is not an integral fault element, then D should be treated as being
    aware of anything he would have been aware of if he had been sober

    +   - this rule would not apply to offences where the required mens rea involved
    intention as to a consequence, knowledge, fraud or dishonesty.


    # Involuntary intoxication


    The Law Commission proposed that there should be a list of situations which would
    count as involuntary intoxication. They suggested that these should include spiked
    drinks, D being forced to take an intoxicating substance, D reasonably believing
    that the substance was not and intoxicant, and situations where the substance
    was taken for a ‘proper medical purpose’.


    Where D was involuntarily intoxicated, then this should be taken into account
    in deciding whether D acted with the required mens rea. This effectively confirms
    the law as set out in Kingston (1995).


    At the time of writing in 2011, the Government had not made any response to this
    report. Check the Law Commission website as to whether there have been any further
    developments at www.justice.gov.uk/lawcommission/index.htm


    An extract from the report is set out in Appendix 1 at A1.6.'
