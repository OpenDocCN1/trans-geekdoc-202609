- pgno: 143
  md: 'Williams onto a statutory footing. The section states:


    > > **s 76(3)** The question whether the degree of force used by D was reasonable
    in the circumstances is to be decided by reference to the circumstances as D believed
    them to be . . .

    > >

    > > **76(4)** If D claims to have held a particular belief as regards the existence
    of any circumstances —

    > >

    > > (a) the reasonableness or otherwise of that belief is relevant to the question
    whether D genuinely held it; but

    > >

    > > (b) if it is determined that D did genuinely hold it, D is entitled to rely
    on it for the purposes of subsection (3), whether or not —

    > >

    > > (i) it was mistaken, or

    > >

    > > (ii) (if it was mistaken) the mistake was a reasonable one to have made.


    So in each situation, the important point is to establish the facts as the defendant
    genuinely believed them to be. If the defendant genuinely made a mistake then
    he is to be judged on the facts as he believed them to be. This is so, even if
    the mistake was unreasonable.


    # Drunken mistake


    Section 76(5) of the Criminal Justice and Immigration Act 2008 makes it clear
    that a defendant cannot rely on any mistaken belief, if that mistake is made due
    to the defendant being voluntarily intoxicated.


    If the defendant made the mistake because he had voluntarily got drunk or taken
    drugs, and makes a mistake because of his intoxicated state, then he cannot rely
    on his mistaken belief. An example would be where a defendant had taken drugs
    which caused hallucinations causing him or her to believe that they were being
    attacked by


    snakes. If the defendant then assaults someone believing that that person is a
    snake, then the defendant cannot use the defence of self-defence. He genuinely
    believes he is being attacked by a snake, but this mistake has been caused by
    the defendant’s voluntary intoxication.


    # 9.7.3 Problems in the law on self-defence


    # Is force necessary?


    The first point to be decided if the defence is to succeed is whether force was
    necessary. This is a question for the jury. In many cases it is straightforward.
    For example, if the facts are that the victim had a knife in his hand and came
    towards the defendant saying ‘I’m going to slash you to pieces’, it is quite clear
    that force is necessary in self-defence in this situation.


    In other situations it is more difficult to decide if force was necessary, as
    the jury has to decide the position that the defendant honestly believed existed.
    For example, what if, while walking home in the dark, the defendant sees a large
    man shaking a club above his head in a threatening way coming towards him. D thinks
    it is necessary to defend himself and punches the man hard, knocking him to the
    ground. However in reality, the ‘large man’ was an elderly woman, and the ‘shaking
    a club’ was the woman trying to open an umbrella above her head.


    The jury has to decide if D honestly believed he was being threatened. If they
    decide that he did, then he has the defence of self-defence. He can use force,
    even though there was no actual threat to him. In this situation an innocent person
    (the woman trying to open her umbrella) has been punched but D’s behaviour is
    not a criminal offence.


    Section 76 of the Criminal Justice and Immigration Act 2008 makes it clear that,
    provided the mistake was not made due to intoxication, then D can rely on his
    mistake. Provided the jury decides that D did believe there was a large man shaking
    a club at him, D has the defence of self-defence. This is so even if the mistake
    was not a reasonable one to make.'
