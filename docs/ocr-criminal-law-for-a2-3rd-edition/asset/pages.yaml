  md: '# 3.1.3 Comment on foresight of consequences as intention


    It can be seen from the above that the courts have struggled with the concept
    of intention where foresight of consequences is involved. For example:


    +   - natural and probable consequence

    +   - difficulty for jurors in applying the tests after the cases of Moloney and
    Hancock and Shankland

    +   - the change in Woollin from inferring intention to finding intention

    +   - the fact that there are still two interpretations of the judgment in Woollin.


    # Natural and probable consequences


    It is necessary to include both words in the test for intention. This is because
    something can be a natural consequence without being a probable consequence. For
    example, a natural consequence of sexual intercourse is that the girl becomes
    pregnant. However, it is not a probable consequence. Pregnancy only occurs in
    a small percentage of cases.


    # The difficulty for jurors applying the law


    Following the cases of Moloney and Hancock and Shankland where jurors had to be
    directed on the level of probability, the law was left in a state which made it
    difficult for judges to explain it to jurors and for jurors to apply the law.
    The difficulties it caused were emphasised when the Court of Appeal in Nedrick
    thought it necessary to try to make the law easier for jurors to understand and
    apply.


    # Infer or find


    The use of the two question test from Nedrick operated for some 12 years until
    the case of Woollin. Then the House of Lords said that they thought the two questions
    from Nedrick were not helpful. They also held that the direction to the


    jury should use the word find instead of infer. As already discussed in the previous
    section, the decision in Woollin appears to create more problems than it solved.


    # Two interpretations of Woollin


    There are still problems in the law on intention as shown by the fact that the
    Court of Appeal in two different cases has interpreted the decision of the House
    of Lords in Woollin in different ways.


    In Re A the Court of Appeal thought that Woollin meant that foresight of consequences
    is intention, whereas in Matthews and Alleyne they stated that foresight of consequences
    is only evidence of intention.


    It can be seen from this that the law on intention is still not in a satisfactory
    state.


    # 3.1.4 Reform of the law on intention


    ''Intention'' is not defined in any statute.


    The Law Commission has in the past suggested definitions for ''intention''. The
    first of these was in the Draft Criminal Code in 1989. The definition in clause
    18(b) was that a person acts:


    > > ''intentionally with respect to-

    > > (a) a circumstance when he hopes or knows that it exists or will exist:

    > > (b) a result when he acts either in order to bring it about or being aware
    that it will occur in the ordinary course of events.''


    # Criticisms of this definition


    This definition was criticised by Professor Sir John Smith, a leading academic,
    as having three major shortcomings. He pointed out that using the phrase ''being
    aware'' risked blurring ''intention'' with ''recklessness''. Recklessness requires
    that D knows there is a risk of a result. It is a lower level of mens rea than
    intention. So it is important that there is a clear distinction between them.


    Another problem was that the requirement that D had to be aware that a result
    ''will occur in'
