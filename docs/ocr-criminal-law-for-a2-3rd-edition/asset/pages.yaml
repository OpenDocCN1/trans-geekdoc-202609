- pgno: 203
  md: "# 12.3.2 Involuntary intoxication\n\nInvoluntary intoxication covers situations\
    \ where the defendant did not know he was taking an intoxicating substance. This\
    \ may be where, for example, a soft drink has been ‘laced’ with alcohol or drugs.\
    \ It also covers situations where prescribed drugs have the unexpected effect\
    \ of making the defendant intoxicated.\n\nThe test is, did the defendant have\
    \ the necessary mens rea when he committed the offence? If so, it was decided\
    \ in Kingston (1994) that he will be guilty. The involuntary intoxication will\
    \ not provide a defence. This is so even though the defendant would not have committed\
    \ the offence without the intoxication lowering his resistance to committing the\
    \ offence.\n\n> Lord Birkenhead then stated the rule which still stands today:\n\
    > \n> 'If he was so drunk that he was incapable of forming the intent required,\
    \ he could not be convicted of a crime which was committed only if the intent\
    \ was proved.'\n\nAn example of where it was found that the defendants were so\
    \ drunk that they did not have the mens rea for murder is Sheehan and Moore (1975).\
    \ The defendants were very drunk when they threw petrol over a tramp and set fire\
    \ to him. They were too drunk to have formed any intent to kill or cause grievous\
    \ bodily harm. It was held that because they did not have the mens rea for murder,\
    \ their intoxication was a defence to that offence. However, they were found guilty\
    \ of manslaughter as that is a basic intent offence.\n\nWhere the defendant has\
    \ the necessary mens rea despite his intoxicated state, then he is guilty of the\
    \ offence. The intoxication does not provide a defence. It has been held that\
    \ a drunken intent is still an intent. This was shown by A-G for Northern Ireland\
    \ v Gallagher (1963).\n\n> Kingston (1994)\n> \n> The defendant’s coffee was drugged\
    \ by someone who wanted to blackmail him. He was then shown a 15-year-old boy\
    \ who was asleep and invited to abuse him. The defendant did so and was photographed\
    \ by the blackmailer. The House of Lords upheld his conviction for indecent assault.\
    \ They held that if a defendant had formed the mens rea for an offence then the\
    \ involuntary intoxication was not a defence.\n\n> Gallagher (1963)\n> \n> D decided\
    \ to kill his wife. He bought a knife to do the killing and also a bottle of whisky.\
    \ He drank a large amount of the whisky to give himself ‘Dutch courage’ before\
    \ killing his wife. His conviction for murder was upheld.\n\n# Voluntary intoxication\
    \ and basic intent offences\n\nWhere the offence charged is one of basic intent\
    \ then intoxication is not a defence. This is because voluntarily becoming intoxicated\
    \ is considered a reckless course of conduct, and recklessness is enough to constitute\
    \ the necessary mens rea. The leading case on this is DPP v Majewski (1977) (see\
    \ section 9.1.4).\n\nWhere, however, the defendant did not have the necessary\
    \ intent he will be not guilty. He has no mens rea and so cannot be guilty of\
    \ a specific intent offence. Neither can he be guilty of a basic intent offence.\
    \ This is because the defendant has not been reckless in getting intoxicated.\
    \ An example of this is Hardie (1985) (see Section 12.2.2) where the defendant\
    \ took Valium tablets not knowing they could make his behaviour unpredictable.\n\
    \n# 12.3.3 Intoxicated mistake\n\nIf the defendant is mistaken about a key fact\
    \ because he is intoxicated, then it depends on what the mistake was about as\
    \ to whether he has a defence or not."
