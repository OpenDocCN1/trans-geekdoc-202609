  md: '# Appendix 2

    # The OCR two-module A2


    The A2 modules for the Criminal Law option are:


    +   - Criminal Law Unit G153 – worth 60 per cent of the A2, and

    +   - Criminal Law Special Study Unit G154 – worth 40 per cent of the A2.


    The full specification, specimen papers, past papers and mark schemes can be found
    online at www.ocr.org.uk.


    # ## A2.1 Criminal Law unit G153


    This examines all of the content area of the specification. The question paper
    has three sections:


    +   - Section A: essays in which candidates are required to answer one essay from
    a choice of three.

    +   - Section B: problems in which candidates are required to answer one problem
    from a choice of three.

    +   - Section C: dilemma boards (evaluation of statements) in which candidates
    are required to answer one from a choice of two.


    The examination is two hours long and there are 120 marks in total for the paper.


    # ## A2.2 Criminal Law unit G154


    This examines the special study topics set for the particular year. OCR pre-releases
    the special study material for students to study during the course. A clean copy
    of the source material is also given to each student for use in the examination.
    The topics and the material are changed each year.


    There will be three questions on the exam paper and candidates have to answer
    all three. The questions will always be in the same format. They are:


    +   - Question 1 – A case study based on one of the cases in the special study
    materials.

    +   - Question 2 – An essay on a specific area of law in the special study materials.

    +   - Question 3 – An application question in which candidates have to apply the
    law to different scenarios.


    There are 80 marks in total for the paper. The examination is 1 1/2 hours long.


    # ## A2.3 Assessment objectives


    Answers to questions on both Units are marked on the basis of three assessment
    objectives. These objectives are:


    +   1. **AO1 Demonstrate Knowledge and Understanding**

    +      Demonstrate knowledge and understanding of legal rules and principles by
    selecting and explaining relevant information and illustrating with examples and
    citation.

    +   2. **AO2 Analysis, Evaluation and Application**

    +      Analyse legal material, issues and situations, and evaluate and apply the
    appropriate legal rules and principles.

    +   3. **AO3 Communication and Presentation**

    +      Present a logical and coherent argument, and communicate relevant material
    in a clear and effective manner, using appropriate legal terminology.'
