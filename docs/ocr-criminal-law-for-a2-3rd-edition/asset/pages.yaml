  md: '# Mens rea


    Mens rea is the mental element of an offence. Each offence has its own mens rea
    or mental element. The only exceptions are offences of strict liability. These
    offences do not require proof of a mental element in respect of at least part
    of the actus reus. In criminal cases it is for the prosecution to prove the required
    mens rea.


    There are different levels of mens rea. To be guilty, the accused must have at
    least the minimum level of mens rea required for the offence.


    The highest level of mens rea is intention. This is also referred to as ‘specific
    intention’. The other main types of mens rea are recklessness, negligence and
    knowledge.


    # 3.1 Intention (specific intent)


    In the case of Mohan (1975) the court defined ‘intention’ as:


    > ‘a decision to bring about, in so far as it lies within the accused’s power,
    [the prohibited consequence], no matter whether the accused desired that consequence
    of his act or not.’


    This makes it clear that the defendant’s motive or reason for doing the act is
    not relevant. The important point is that the defendant decided to bring about
    the prohibited consequence.


    This can be illustrated by looking at the offence set out in s 18 of the Offences
    Against the Person Act 1861. For this offence, the defendant must wound or cause
    grievous bodily harm. The mens


    rea is that the defendant must intend to wound or cause grievous bodily harm or
    intend to resist arrest. If the defendant did not intend one of these then he
    cannot be guilty of this offence. For example, if a person opens a door very suddenly
    and hits and seriously injures someone on the other side of the door whom they
    did not know was there, then they do not intend to ‘bring about’ the prohibited
    consequence.


    # Motive


    Mohan (1975) also makes it clear that motive is not the same as intention and
    is not relevant in deciding whether the defendant had intention. For example,
    a person may feel very strongly that the banking system in the Western world is
    causing poverty in poorer nations. That person then steals millions of pounds
    from a bank so'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'that he can give it to people in poorer nations. His motive is to make sure
    that the poor receive money. This is irrelevant in deciding whether the defendant
    has the mens rea required for theft.


    # 3.1.1 Direct and oblique intent


    In the majority of cases the defendant has what is known as direct intent. This
    means that he intends the specific consequence to occur. For example, D decides
    to kill V. He aims a gun directly at V''s head and pulls the trigger. Here D has
    the direct intent to kill V.


    However, there can be situations where the defendant intends one thing but the
    actual consequence which occurs is another thing. This known as oblique intent
    or indirect intent.


    An example of this is if the defendant intends to frighten someone so as to stop
    them going to work, but does not intend to kill or seriously injure them. This
    occurred in the case of Hancock and Shankland (1986). The actual consequence was
    that the driver of the car taking the person to work was killed. This is shown
    in diagram form in Figure 3.1.


    # 3.1.2 Foresight of consequences


    The main problem with proving intention is in cases where the defendant''s main
    aim was not the prohibited consequences. He intended something else. If, in achieving
    the other thing, the defendant foresaw that he would also cause


    ![](img/cc718e8d30bf7e5c8ed3badf83078451_39_0.png)


    Figure 3.1 Direct intent/oblique intent


    those consequences, then he may be found guilty. This idea is referred to as ‘foresight
    of consequences’.


    An example of this type of situation is where the defendant decides to set fire
    to his shop in order to claim insurance. His main aim is damaging the shop and
    getting the insurance. Unfortunately, he starts the fire when members of staff
    are still in the shop and some of them are seriously injured. Has the defendant
    the intention for the s 18 offence of causing grievous bodily harm?


    The starting point for foresight of consequences is s 8 of the Criminal Justice
    Act 1967 which states that:


    > ‘A court or jury, in determining whether a person has committed an offence—

    > (a) shall not be bound in law to infer that he intended or foresaw a result
    of his actions by reason only of its being a natural and probable consequence
    of those actions; but

    > (b) shall decide whether he did intend or foresee that result by reference to
    all the evidence, drawing such inferences from the evidence as appear proper in
    the circumstances.’


    This wording has been the subject of several cases over the last 20 years or so.
    These are mainly cases where defendants have been charged with murder. The important
    point is that the defendant must intend or foresee a result. In a murder case
    this means that the defendant must foresee that death or really serious injury
    will be caused. The leading case on this is now Woollin (1998), but to understand
    the law and the problems it is necessary to look at cases which came before Woollin.
    The first of these was Moloney (1985).


    Moloney (1985)

    D and his step-father had drunk a considerable amount of alcohol at a family party.
    After the party, they were heard talking and laughing. Then there was a shot.
    D phoned the police,'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'saying that he had just murdered his step-father. D said that they had being
    seeing who was the faster at loading and firing a shotgun. He had loaded his gun
    faster than his step-father. His step-father then said that D hadn’t got ‘the
    guts’ to pull the trigger. D said ‘I didn’t aim the gun. I just pulled the trigger
    and he was dead’. D was convicted of murder but this conviction was quashed on
    appeal.


    The problem with Moloney (1985) was explained by Lord Scarman who stated that
    the guidelines in that case were unsafe and misleading. He said:


    > > ''In my judgment, therefore, the Moloney guidelines as they stand are unsafe
    and misleading. They require a reference to probability. They also require an
    explanation that the greater the probability of a consequence the more likely
    it is that the consequence was foreseen and that if that consequence was foreseen
    the greater the probability is that that consequence was also intended.''


    In this case the House of Lords ruled that foresight of consequences is only evidence
    of intention. It is not intention in itself. This part of the House of Lords’
    judgment is still law.


    However, other parts of this judgment have been overruled by later cases. This
    was because Lord Bridge stated that jurors should be told to consider two questions:


    +   1. Was death or really serious injury a natural consequence of the defendant’s
    act?

    +   2. Did the defendant foresee that consequence as being a natural result of
    his act?


    The problem with these questions (which are often referred to as the Moloney guidelines)
    is that the word ‘probable’ is not mentioned.


    If you look back to s 8 of the Criminal Justice Act 1967, you will see that the
    section uses the phrase ‘natural and probable consequence’. Lord Bridge referred
    only to a ‘natural’ result. This omission of the word ‘probable’ was held in Hancock
    and Shankland (1986) (see below) to make the guidelines defective. The guidelines
    are therefore no longer law.


    # Hancock and Shankland (1986)


    Ds were miners who were on strike. They tried to prevent another miner from going
    to work by pushing a concrete block from a bridge onto the road along which he
    was being driven to work in a taxi. The block struck the windscreen of the taxi
    and killed the driver. The trial judge used the Moloney guidelines to direct the
    jury, and Ds were convicted of murder. On appeal, the Court of Appeal quashed
    their convictions. This was upheld by the House of Lords.


    The next case was Nedrick (1986) where the Court of Appeal thought that the judgments
    in the two earlier cases of Moloney (1985) and Hancock and Shankland (1986) needed
    to be made clearer.


    # Nedrick (1986)


    D had a grudge against a woman. He poured paraffin through the letter box of her
    house and set it alight. A child died in the fire. D was convicted of murder but
    the Court of Appeal quashed the conviction and substituted one of manslaughter.


    To make the law decided in Moloney, Hancock and Nedrick easier for jurors to understand
    and apply in murder trials, the Court of Appeal said that it was helpful for a
    jury to ask themselves two questions:


    +   1. How probable was the consequence which resulted from D’s voluntary act?

    +   2. Did D foresee that consequence?


    It was necessary for the consequence to be a virtual certainty and for D to have
    realised that. If this was so then there was evidence from which'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'the jury could infer that D had the necessary intention. Lord Lane CJ put it
    this way:


    > > “The jury should be directed that they are not entitled to infer the necessary
    intention unless they feel sure that death or serious bodily harm was a virtual
    certainty (barring some unforeseen intervention) as a result of the defendant’s
    actions and that the defendant appreciated that such was the case.”


    This remained the law until 1998 and the case of *Woollin* (1998). This went to
    the House of Lords who felt that the Court of Appeal’s views in *Nedrick* (1986)
    were not helpful.


    # ### *Woollin* (1998)


    D threw his three-month-old baby towards his pram which was against a wall some
    three or four feet away. The baby suffered head injuries and died. The court ruled
    that the consequence must have been a virtual certainty and the defendant must
    have realised this. Where the jury was satisfied on both these two points, then
    there was evidence on which the jury could find intention.


    The Law Lords thought that the two questions in *Nedrick* were not helpful. They
    held that the model direction from *Nedrick* should be used, but that the word
    ‘find’ should be used rather than the word ‘infer’. So the model direction to
    be given to a jury considering foresight of consequences should now be:


    > > ‘the jury should be directed that they are not entitled to *find* the necessary
    intention unless they feel sure that death or serious bodily harm was a virtual
    certainty (barring some unforeseen intervention) as a result of the defendant’s
    actions and that the defendant appreciated that such was the case.’


    # ### Problems with the decision in *Woollin*


    The decision in *Woollin* causes some problems. First of all, the word ‘infer’
    is used in s 8 of the Criminal Justice Act 1967 and this is presumably why it
    was used in *Nedrick*. Does the substitution of the word ‘find’ improve the clarity
    of the direction to the jury? Another problem is whether the use of the word ‘find’
    means that foresight of consequence is intention and not merely evidence of it.


    In his judgment Lord Steyn also went on to say that the effect of the direction
    is that ‘a result foreseen as virtually certain is an intended result’. He also
    pointed out that in *Moloney* the House of Lords had said that if a person foresees
    the probability of a consequence as little short of overwhelming, this ‘will suffice
    to establish the necessary intent’. Lord Steyn emphasised the word ‘establish’.
    This seems to suggest that the House of Lords in *Woollin* regarded foresight
    of consequences as the same as intention, when *Moloney* had clearly stated that
    it was not.


    In later cases there have been conflicting decisions on this point. In the civil
    case of *Re A* (2000), doctors asked the courts whether they could operate to
    separate conjoined twins when they foresaw that this would kill the weaker twin.
    The Court of Appeal (Civil Division) clearly thought that *Woollin* laid down
    the rule that foresight of consequences is intention.


    In the criminal case of *Matthews and Alleyne* (2003) the Court of Appeal held
    that the judgment in *Woollin* meant that foresight of consequences is not intention:
    it is a rule of evidence. If a jury decides that the defendant foresaw the virtual
    certainty of death or serious injury, they are entitled to find intention but
    do not have to do so.


    # ### *Matthews and Alleyne* (2003)


    The defendants dropped the victim 25 feet from a bridge, into the middle of a
    deep river. The victim had told them that he could not swim. They watched him
    ‘dog paddle’ towards the'
