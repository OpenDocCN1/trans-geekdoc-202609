- pgno: 71
  md: 'Recklessness is not normally sufficient *mens rea* for an attempt. This is
    so even where recklessness would suffice for the completed offence. However, there
    is an exception in that recklessness as to one part of the offence can be sufficient.
    This is illustrated by *Attorney-General''s Reference (No 3 of 1992)* (1994).


    **_Attorney-General''s Reference (No 3 of 1992) (1994)_**


    D threw a petrol bomb towards a car containing four men. The bomb missed the car
    and smashed harmlessly against a wall. D was charged with attempting to commit
    arson with intent to endanger life. The trial judge ruled that it had to be proved
    that D intended to damage property and to endanger life. D was acquitted.


    The Court of Appeal held that the trial judge was wrong. It was necessary to prove
    that D intended to damage property, but it was only necessary to prove that he
    was reckless as to whether life would be endangered.


    # 5.4 Attempting the impossible


    In some situations a person may intend to commit an offence and may do everything
    they possibly can to commit it, but in fact the offence is impossible to commit.


    An example of this would be where D goes to V’s room and stabs V as he lies in
    bed. In fact, V died of a heart attack two hours before D stabbed him. D has merely
    stabbed a dead body. Murdering V is physically impossible so D cannot be guilty
    of his murder, but can D be guilty of attempting to murder V?


    Another example is where D thinks that the goods he is buying very cheaply are
    stolen goods. He is willing to go ahead, thinking he is ‘handling stolen property’.
    In fact, the goods are not stolen, so the offence of handling stolen property
    is legally impossible in this situation. Should D be guilty of attempting to handle
    stolen property?


    Under the common law, before 1981, the House of Lords had held that where a crime
    was legally or physically impossible to commit, then the defendant could not be
    guilty of attempting to commit it. When the Criminal Attempts Act 1981 was passed
    it contained a subsection (s 1(2)) which was intended to close this loophole and
    make defendants guilty of an attempt even though the full offence was impossible.


    Section 1(2) of the Criminal Attempts Act 1981 states:


    > ‘A person may be guilty of attempting to commit an offence . . . even though
    the facts are such that the commission of the offence is impossible.’


    After the Act was passed, the House of Lords had to consider this section and
    the problem of attempting the impossible in the case of *Anderton v Ryan* (1985).


    **_Anderton v Ryan (1985)_**


    Mrs Ryan bought a video recorder very cheaply. She thought it was stolen. Later
    she admitted this to police who were investigating a burglary at her home. Her
    conviction was quashed because the video recorder was not in fact stolen.


    The House of Lords held that even though Mrs Ryan had gone beyond merely preparatory
    acts, in fact all her acts were innocent. The video recorder was not stolen. On
    this basis, they thought that s 1(2) did not make her guilty.


    However, less than a year later, the House of Lords overruled this decision in
    *Shivpuri* (1986).


    **_Shivpuri (1986)_**


    D agreed to receive a suitcase which he thought contained prohibited drugs. The
    suitcase was delivered to him, but it contained only snuff and'
