    ‘theft’


    and explain the different elements of theft in relation to this situation.


    # Examination questions


    Yuri and Andrew are flat-sharing students. Whilst shopping, Yuri takes some sunglasses
    from a display and slips them into his pocket. He sees a shirt priced £50, swaps
