    and Jones (1976), can still be charged with theft.


    This concept of going beyond the permission has also been applied to shoplifters
    on the basis that the permission to enter a shop is only given for legitimate
    shopping purposes. Where someone enters and then steals, they can be considered
    to have gone beyond the permission given to them when they entered.


    As with the Smith and Jones case, there is no need to charge such a person with
