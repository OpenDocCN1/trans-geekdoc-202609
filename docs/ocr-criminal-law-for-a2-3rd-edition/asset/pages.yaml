  md: 'An omission is only sufficient for the *actus reus* where there is a duty to
    act. There are six ways in which such a duty can exist.


    +   1. A statutory duty.

    +   2. A contractual duty.

    +   3. A duty because of a relationship.

    +   4. A duty which has been taken on voluntarily.

    +   5. A duty through one''s official position.

    +   6. A duty which arises because the defendant has set in motion a chain of
    events.


    # A statutory duty


    An Act of Parliament can create liability for an omission. Examples include the
    offences of failing to stop or report a road traffic accident (s 170 Road Traffic
    Act 1988) and of failing to provide a specimen of breath (s 6 Road Traffic Act
    1988). In fact, these offences can only be committed by failing to do something.


    Another example where an Act of Parliament creates a duty is in s 1 of the Children
    and Young Persons Act 1933. This section puts parents who are legally responsible
    for a child under a duty for providing food, clothing, medical aid and lodging
    for their children. If a parent fails (omits) to do this, they can be guilty of
    the offence of wilful neglect.


    A more recent example is the offence of allowing the death of a child or vulnerable
    adult under s 5 of the Domestic Violence, Crime and Victims Act 2004. This applies
    where a person in the same household fails to take such steps as he or she reasonably
    could have been expected to take to protect the victim.


    # A contractual duty


    In *Pittwood* (1902) a railway-crossing keeper omitted to shut the gates, with
    the result that a person crossing the line was struck and killed by a train. The
    keeper was guilty of manslaughter. A more modern example would be of a lifeguard
    at a pool who leaves his post unattended. His failure to do his duty could make
    him guilty of an offence if a swimmer were injured or drowned.


    # A duty because of a relationship


    This is usually a parent–child relationship as a parent has a duty to care for
    young children. A duty can also exist the opposite way round, where a grown-up
    child is caring for their elderly parent. A case example involving a parent–child
    duty is *Gibbins and Proctor* (1918).


    # *Gibbins and Proctor (1918)*


    The father of a seven-year-old girl lived with a partner. The father had several
    children from an earlier marriage. He and his partner kept the girl separate from
    the father''s other children and deliberately starved her to death. They were
    both convicted of murder.


    The father had a duty to feed her because he was her parent and the mistress was
    held to have undertaken to look after the children, including the girl, so she
    was also under a duty to feed the child. The omission or failure to feed her was
    deliberate with the intention of killing or causing serious harm to her. In these
    circumstances they were guilty of murder. The failure to feed the girl was enough
    for the *actus reus* of murder.


    # A duty which has been undertaken voluntarily


    In the above case of *Gibbins v Proctor* (1918) the partner had voluntarily undertaken
    to look after the girl. She therefore had a duty towards the child. When she failed
    to feed the child she was guilty of murder because of that omission. Another example
    of where a duty had been undertaken voluntarily is *Stone and Dobinson* (1977).


    # *Stone and Dobinson (1977)*


    Stone’s elderly sister, Fanny, came to live with the defendants. Fanny was eccentric
    and often stayed in her room for several days. She also'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'failed to eat. She eventually became bedridden and incapable of caring for
    herself. On at least one occasion Dobinson helped to wash Fanny and also occasionally
    prepared food for her. Fanny died from malnutrition. Both defendants were found
    guilty of her manslaughter.


    As Fanny was Stone’s sister, he owed a duty of care to her. Dobinson had undertaken
    some care of Fanny and so also owed her a duty of care. The duty was either to
    help her themselves or to summon help from other sources. Their failure to do
    either of these meant that they were in breach of their duty.


    # Dytham (1979)


    Dytham (D) was a police officer who was on duty. He saw a man (V) being thrown
    out of a nightclub about 30 yards from where he was standing. Following the throwing
    out, there was a fight in which three men kicked V to death. D took no steps to
    intervene or to summon help. When the fight was over, D told a bystander that
    he was going off-duty and left the scene. He was convicted of misconduct in a
    public office.


    Because Dytham was a police officer, he was guilty of wilfully and without reasonable
    excuse neglecting to perform his duty.


    A more recent case where a mother was guilty of manslaughter through her failure
    to act is Evans (2009).


    # Evans (2009)


    V, aged 16 and who was a heroin addict, lived with her mother and her older half-sister.
    The half-sister bought some heroin and gave it to V who self-injected. Later it
    became obvious that V had overdosed. Neither the mother nor the half-sister tried
    to get medical help. Instead they put V to bed and hoped she would recover. V
    died.


    Both the mother and D were convicted of gross negligence manslaughter. The mother
    clearly owed a duty of care to V as she was her daughter. D appealed, claiming
    that she did not owe a duty of care to a sister. The Court of Appeal upheld the
    conviction on the basis that D had created a state of affairs which she knew or
    ought reasonably to have known was threatening the life of V.


    # A duty through one’s official position


    This is very rare but did happen in Dytham (1979).


    # A duty which arises because the defendant set in motion a chain of events


    This concept of owing a duty and being liable through omission was created in
    the case of Miller (1983) where a squatter had accidentally started a fire.


    # Miller (1983)


    D was living in a squat. He fell asleep while smoking a cigarette. He awoke to
    find his mattress on fire. He did not attempt to put out the fire or to summon
    help but went into another room and went back to sleep. The house caught fire.
    He was convicted of arson.


    In Miller (1983) it was not the setting of the mattress on fire which made him
    guilty. Instead, it was the fact that he had failed to take reasonable steps to
    deal with the fire when he discovered that his mattress was on fire. This failure
    or omission meant that he had committed the actus reus for arson. The House of
    Lords pointed out that Miller was only expected to take reasonable steps. He did
    not have to put himself at risk. So, if, when he woke and found the fire,'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'it was very small and could easily be put out then he was expected to do that.
    However, if it was too dangerous for him to deal with it personally then his duty
    was to summon the fire brigade.


    ![](img/cc718e8d30bf7e5c8ed3badf83078451_27_0.png)


    Figure 2.1


    Another case where the defendant knew that there was a dangerous situation but
    failed to take any steps is Santa-Bermudez (2003).


    # Santa-Bermudez (2003)


    A policewoman, before searching the defendant’s pockets, asked him if he had any
    needles or other sharp objects on him. The defendant said ‘no’, but when the police
    officer put her hand in his pocket she was injured by a needle which caused bleeding.
    The defendant was convicted of assault occasioning actual bodily harm under s
    47 of the Offences Against the Person Act 1861.


    In this case it was the failure to tell the police officer of the needle which
    made the defendant


    liable. He knew that there was danger to the police officer but failed to warn
    her about it. This failure was enough for the actus reus for the purposes of an
    assault causing actual bodily harm.


    The case of Evans (2009) (set out above) also illustrates the principle of a defendant
    being liable for failing to act after creating a state of affairs. In this case
    the half-sister who had supplied V with heroin which V then self-injected was
    found guilty of manslaughter. She had created a state of affairs which she knew
    or ought reasonably to have known was threatening the life of V, but she did nothing
    about it. She could easily have called for medical assistance for V. The failure
    to do so made her liable for V’s death.


    # Key facts


    | Source | Examples |

    |---|---|

    | Statutory duty. | Failing to provide a specimen of breath (s 6 Road Traffic
    Act 1988). Wilful neglect (s 1 Children and Young Persons Act 1933). |

    | Under a contract, especially of employment. | Pittwood (1902) |

    | Because of a relationship such as parent and child. | Gibbins and Proctor (1918)

    Evans (2009) |

    | A duty voluntarily undertaken, eg care of an elderly relative. | Stone and Dobinson
    (1977) |

    | Because of a public office, eg police officer. | Dytham (1979) |

    | As a result of a dangerous situation created by the defendant. | Miller (1983)

    Santa-Bermudez (2003)

    Evans (2009) |


