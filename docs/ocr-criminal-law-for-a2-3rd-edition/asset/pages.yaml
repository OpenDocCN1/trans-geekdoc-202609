  md: "on the premises. The defendants were charged with selling a lottery ticket\
    \ to a person under 16, contrary to s 13(1)(c) of the National Lottery Act 1993.\
    \ The magistrates dismissed the charges, but the prosecution appealed to the Divisional\
    \ Court which held that the offence was one of strict liability. This meant that\
    \ the defendants were guilty.\n\nThe Divisional Court held that the offence did\
    \ not require any *mens rea*. The act of selling the ticket to someone who was\
    \ actually under 16 was enough to make the defendants guilty, even though they\
    \ had done their best to prevent this happening in their shop.\n\n# 4.3.3 No defence\
    \ of mistake\n\nAnother feature of strict liability offences is that the defence\
    \ of mistake is not available. This is important as, if the defence of mistake\
    \ is available, the defendant will be acquitted when he made an honest mistake.\
    \ Two cases which illustrate the difference in liability are *Cundy v Le Cocq*\
    \ (1884) and *Sherras v De Rutzen* (1895). Both of these involved offences under\
    \ the Licensing Act 1872.\n\n# *Sherras v De Rutzen* (1895)\n\n> D was convicted\
    \ of supplying alcohol to a constable on duty. Local police, when on duty, wore\
    \ an armband on their uniform. An on-duty police officer removed his armband before\
    \ entering the defendant’s public house. The officer was served by D’s daughter\
    \ in the presence of D. D thought that the constable was off duty because he was\
    \ not wearing his armband. D was convicted but the Divisional Court quashed the\
    \ conviction. It held that the offence was not one of strict liability and accordingly\
    \ a genuine mistake provided the defendant with a defence.\n> \n> The judge pointed\
    \ out that there was nothing the publican could do to prevent the commission of\
    \ the crime. Even if the publican asked the officer, it would be as easy for the\
    \ constable to deny that he was on duty as for him to remove his armband before\
    \ entering the public house. This explains the different decisions in the two\
    \ cases. The fact of a person being drunk is an observable fact, so the publican\
    \ should be put on alert and could avoid committing the offence.\n\n# *Cundy v\
    \ Le Cocq* (1884)\n\n> D was charged with selling intoxicating liquor to a drunken\
    \ person. The magistrate trying the case found as a fact that the defendant and\
    \ his employees had not noticed that the person was drunk. The magistrate also\
    \ found that while the person was on the licensed premises he had been ‘quiet\
    \ in his demeanour and had done nothing to indicate insobriety; and that there\
    \ were no apparent indications of intoxication’. However, the magistrate held\
    \ that the offence was complete on proof that a sale had taken place and that\
    \ the person served was drunk, and convicted the defendant. The defendant appealed\
    \ against this but the Divisional Court upheld the conviction.\n\n# 4.3.4 Summary\
    \ of strict liability\n\nSo, where an offence is held to be one of strict liability,\
    \ the following points apply:\n\n+   - The defendant must be proved to have done\
    \ the *actus reus*.\n+   - This must be a voluntary act on his part.\n+   - There\
    \ is no need to prove *mens rea* for at least part of the *actus reus*.\n+   -\
    \ No ‘due diligence’ defence will be available.\n+   - The defence of mistake\
    \ is not available.\n\nThese factors are well established. The problem lies in\
    \ deciding which offences are ones of strict liability. For this, the courts will\
    \ start with presuming that *mens rea* should apply. This is so for both common-law\
    \ and statutory offences."
