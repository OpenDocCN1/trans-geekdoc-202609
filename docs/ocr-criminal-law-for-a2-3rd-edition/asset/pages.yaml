  md: '# Geddes (1996)


    D was found in the boys’ toilet block of a school, in possession of a large kitchen
    knife, some rope and masking tape. He had no right to be in the school. He had
    not contacted any of the pupils. His conviction for attempted false imprisonment
    was quashed.


    This case is difficult to justify. D had no right to be on the premises. He had
    entered the school with all the equipment for falsely imprisoning a student. The
    next step would be for him to approach one of the students. If the law of attempt
    is to be effective in protecting people from the main offence, then surely he
    should have been guilty of an attempt at that point. Is it sensible to wait until
    he approaches one of the students?


    However, the Court of Appeal thought that attempts should be considered by asking
    two questions:


    +   1. Had the accused moved from planning or preparation to execution or implementation?

    +   2. Had the accused done an act showing that he was actually trying to commit
    the full offence, or had he got only as far as getting ready, or putting himself
    in a position, or equipping himself, to do so?


    Using these two questions, it can be seen that Geddes had not quite moved from
    planning or preparation to execution. Also, it can be argued that he had got only
    as far as getting ready, or putting himself in a position, to commit the full
    offence.


    Another case which is perhaps even more difficult to justify is Campbell (1990).


    # Campbell (1990)


    D, who had an imitation gun, sunglasses and a threatening note in his pocket,
    was in the


    street outside a post office. His conviction for attempted robbery was quashed.


    The next step in this case would have been for D to enter the post office. Again,
    if the law of attempt is to be effective in protecting people from the main offence,
    surely he should have been guilty of an attempt at that point? Is it sensible
    to wait until he enters the post office? If the gun had been real then customers
    and staff in the post office would have been put at risk.


    ![](img/cc718e8d30bf7e5c8ed3badf83078451_68_0.png)


    Figure 5.1


    # 5.2.3 Cases in which there was an attempt


    The following three cases show situations where the defendant had gone beyond
    mere preparation. In each case the defendants were held to be guilty of an attempt
    to commit the full offence.'
