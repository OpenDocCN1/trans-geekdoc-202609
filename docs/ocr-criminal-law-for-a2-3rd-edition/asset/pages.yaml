  md: '+   5. Can a defendant appropriate property when the owner of it has consented
    to the appropriation?

    +   6. Give the name and facts of two cases where the effect of consent of the
    owner was considered.

    +   7. Can a defendant be guilty of theft when the owner of the property has consented
    to the appropriation and that consent was not obtained by any deception?


    # 10.4 ‘Dishonestly’


    The first point which needs to be proved for the mens rea of theft is that when
    the defendant appropriated the property he did it dishonestly. There is no definition
    of what is meant by this in the Act but s 1(2) states that:


    > ‘... it is immaterial whether the appropriation is made with a view to gain,
    or is made for the thief’s own benefit.’


    In other words, if all the elements of theft are present, the motive of the defendant
    is not relevant. This means that a modern-day Robin Hood stealing to give to the
    poor could be guilty of theft. The defendant does not have to gain anything from
    the theft.


    # 10.4.1 Behaviour which is not dishonest


    The Theft Act 1968 does not define dishonesty, though it does give three situations
    in which D’s behaviour is not considered dishonest. Section 2(1) of the 1968 Act
    provides that a person’s appropriation of property belonging to another is not
    to be regarded as dishonest if he appropriates the property in the belief that:


    +   - **S 2(1)(a)** he has in law the right to deprive the other of it, on behalf
    of himself or of a third person; or

    +   - **S 2(1)(b)** he would have the other’s consent if the other knew of the
    appropriation and the circumstances of it; or

    +   - **S 2(1)(c)** the person to whom the property belongs cannot be discovered
    by taking reasonable steps.


    All these three situations depend on D’s belief. It does not matter whether it
    is a correct belief or even whether it is a reasonable belief. If D has a genuine
    belief in one of these three then he is not guilty of theft.


    # Unreasonable belief


    It has been held in two cases, Small (1988) and Holden (1991), that the fact that
    the belief was an unreasonable one does not prevent the defendant from relying
    on these sections. If the jury decide that the defendant did have a genuine belief,
    even though an unreasonable one, in one of the three situations then the defendant
    must be found not guilty.


    # 10.4.2 Willing to pay


    In some situations D may say that he is willing to pay for the property or may,
    on taking property, leave money to pay for it. This does not prevent D’s conduct
    from being dishonest as s 2(2) states that ‘a person’s appropriation of property
    belonging to another may be dishonest notwithstanding that he is willing to pay
    for the property’.


    At first this may seem severe, but it prevents D taking what he likes, regardless
    of the owner’s wishes. For example, D likes a painting which is hanging in a friend’s
    home. He asks the friend how much it is worth and is told that it is only a copy,
    worth less than £100, but it was painted by the friend’s grandmother and is of
    sentimental value. A few days later D takes the painting without the friend’s
    consent but leaves £200 in cash to pay for it. D’s taking of the painting may
    be considered dishonest even though he left more than the cash value of it.


    # 10.4.3 The Ghosh test


    The case of Ghosh (1982) is the leading case on what is meant by ‘dishonesty’.
    In this case the Court of Appeal set out the tests to be used.


    **Ghosh (1982)**


    Ghosh was a doctor acting as a locum consultant in a hospital. He claimed fees
    for an operation he had not carried out. He said that he was not'
