  md: 'threatened to kill the boy unless he stabbed his mother. The boy did stab her
    and seriously injured her, but the injury did not kill her. He was convicted of
    attempted murder and because of the circumstances the judge put him on probation
    for three years. If the stabbing had caused the death of the mother, the judge
    would have had to order the boy (because of his age) to be detained at Her Majesty’s
    Pleasure.


    It is because of the mandatory life sentence for murder that the special defences
    of diminished responsibility and loss of control exist (see Chapter 7). These
    reduce the charge to manslaughter. This allows the judge flexibility in passing
    sentence which he does not have when the defendant is convicted of murder.


    # Minimum sentences


    In each case the judge will impose a life sentence but will then state the minimum
    number of years the offender must serve before any application can be made for
    release on licence.


    The sentencing problems have been aggravated by the Government’s guidelines on
    these minimum sentences as laid down in the Criminal Justice Act 2003. This gives
    three starting points for adult offenders:


    +   - A whole life term for exceptionally serious cases, such as premeditated
    killings of two or more people, sexual or sadistic child murders or politically
    motivated murders.

    +   - Thirty years’ minimum for serious cases such as murders of police or prison
    officers, murders involving firearms, sexual or sadistic killings or killings
    aggravated by racial or sexual orientation.

    +   - Fifteen years’ minimum for murders not falling within the two higher categories.


    Under these rules the defendant in Martin (Anthony) (2002) who shot and killed
    a burglar would have had to have been given a minimum sentence of 30 years. This
    is the same length of sentence as a contract killer, who is paid to kill a victim
    deliberately, would receive. The guidelines do not allow sufficient differentiation
    between levels of blameworthiness.


    The Law Commission was not asked to consider sentencing. However, in their proposals
    for making murder into a two-tier offence, they state that the mandatory life
    sentence and the guidelines on minimum sentences should only apply to first degree
    murder. This would create a fairer sentence structure.


    # 6.4.6 Law Commission’s proposals for reform


    The Law Commission proposed that murder should be reformed by dividing it into
    two separate offences:


    +   - first degree murder, and

    +   - second degree murder.


    First degree murder would cover cases in which the defendant intended to kill.
    It would also cover situations where the defendant intended to cause serious harm
    and was aware that his or her conduct posed a serious risk of death.


    Cases in which the defendant intended to do serious injury, but was not aware
    that there was a serious risk of death, would be second degree murder. By dividing
    murder into two separate categories the mandatory life sentence would apply only
    to first degree murder. Second degree murder would carry a maximum of a life sentence
    but would allow the judge discretion in sentencing.


    NOTE The Law Commission’s summary of its proposals is set out in full in Appendix
    1 at A.1.4.


    # 6.4.7 Government’s response to the Law Commission’s proposals


    In July 2008 the Government issued a consultation paper, Murder, Manslaughter
    and Infanticide: Proposals for Reform of the Law, CP 19/08. This paper rejected
    the Law Commission’s proposal of completely reforming murder by making it a two-tier
    offence


    The only area where the Government accepted that reform was needed was the lack
    of a defence for those who use excessive force in self-defence. This reform was
    implemented as part of the'
