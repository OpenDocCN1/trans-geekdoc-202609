    # Conclusion


    1.70 The Criminal Justice Act 2003 (“the 2003 Act”), one of the most important
    pieces of legislation in the history of criminal justice reform, brought in a
    new sentencing regime for murder. However, the radical reforms effected by the
    2003 Act stand upon shaky foundations because the offence of murder, and the partial
    defences to it, do not have defensible definitions or a rational structure. Unfortunately,
    although 20th-century legislation on murder brought many valuable reforms, the
    definitions of murder and the partial defences remain misleading, out-of-date,
    unfit for purpose, or all of these. Quite simply, they are not up to the task
    of providing the kind of robust legal support upon which the viability of the
    2003 Act depends.


