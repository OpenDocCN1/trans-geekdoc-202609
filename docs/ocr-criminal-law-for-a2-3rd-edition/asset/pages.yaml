  md: "# Apply\n\nWhen you have explained all the law you must then apply it to the\
    \ situations. This is an important aspect for AO2 marks. So state:\n\n+   - Is\
    \ Jin liable for the death of Fred? – Jin has done an unlawful act with the intention\
    \ of doing it, and it can be argued that a reasonable man would see a risk of\
    \ some harm from the act, the principle of transferred malice applies. The fact\
    \ that Fred has a heart condition it is likely that the principle of ‘take your\
    \ victim as you find them’ applies. So Jin can be seen as the factual and legal\
    \ cause of Fred’s death.\n+   \n+   Alternatively it could be argued that on the\
    \ basis of the decision in Dawson that risk of harm would not be seen, in which\
    \ case Jin would be not guilty.\n+   - Is Jin liable for the death of Wanda?\n\
    +   All the elements of unlawful act manslaughter are present (situation very\
    \ similar to Mitchell) – the principle of transferred malice would apply as in\
    \ Mitchell. However the fact that Doctor Sugar gives an antibiotic injection when\
    \ she has recovered appears to break the chain of causation (Jordan). So Jin is\
    \ probably not liable.\n+   - Is Doctor Sugar liable for Wanda’s death?\n+   A\
    \ doctor owes a duty of care to his patient; he has breached that duty by not\
    \ checking on allergies; there is a risk of death from this and Wanda has died\
    \ as a result. So it is very likely that a jury would find the negligence enough\
    \ for him to be criminally liable.\n\nThe mark scheme for this question can be\
    \ found on the OCR website at www.ocr.org.uk.\n\n# A3.3 Dilemma boards/\nevaluating\
    \ statements\n\nThe final style of question on Unit G153 is known as a dilemma\
    \ board or evaluating statements. This is a style of question in which students\
    \ are faced with a scenario plus four statements about it which they have to evaluate.\
    \ Each dilemma\n\nboard carries 20 marks. This means that you should spend considerably\
    \ less time on this than on the other two questions.\n\nFor assessment, the marks\
    \ are all for AO2. This means you must concentrate on analysis and application\
    \ of the law to the statements.\n\nAn example of such a question is given below.\n\
    \n# Examination question\n\nElsa decides to steal vodka from a shop. She has a\
    \ gun in her pocket. Outside the shop she pulls out the gun but has changed her\
    \ mind and returns it to her pocket. Elsa still wants to steal some vodka so she\
    \ enters the shop but discovers that the shop has no vodka. Angry, Elsa kicks\
    \ a customer, Reynard, bruising his leg. Elsa runs out of the shop, slamming the\
    \ glass door so hard it shatters.\n\nEvaluate the accuracy of each of the four\
    \ statements A, B, C and D individually as they apply to the facts in the above\
    \ scenario.\n\n**Statement A:** Elsa commits attempted robbery when she gets the\
    \ gun out of her pocket.\n\n**Statement B:** Elsa does not commit s 9(1)(a) burglary\
    \ when she enters the shop.\n\n**Statement C:** Elsa commits robbery when she\
    \ kicks Reynard.\n\n**Statement D:** Elsa commits s 9(1)(b) burglary when she\
    \ breaks the shop door.\n\n(OCR G153 January 2010)\n\n# Potential answer\n\nIt\
    \ is necessary to deal with each statement separately. For each one, explain whether\
    \ it is a correct statement or not. Let’s look at Statement A. The important points\
    \ are what the scenario states that Elsa did and the law on attempts, robbery\
    \ and burglary.\n\nFor this type of question you can answer using bullet points.\
    \ The OCR mark scheme"
