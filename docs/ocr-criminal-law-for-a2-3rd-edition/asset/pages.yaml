    # 2.3.6 Comment on the law on causation


    A major problem in the law on causation is: what is meant by more than a ‘slight
    and trifling link’? This is vague and difficult to define. As a result, it could
    lead to juries applying different standards in different cases.


    # Taking your victim as you find him


    Where V has a medical condition which makes the injury more serious, should D
    be liable for the more serious injury? It can be seen as being unjust where D
    does not know about the medical condition. For example, if a victim has an exceptionally
    thin skull, so that a blow kills him, it is justified that D should be liable
    for murder when the blow would not have killed a normal person. D did not intend
    to kill but if he intended to cause really serious injury then D is guilty of
    murder. (This is also a criticism of the mens rea for murder – see Chapter 6 for
    more on this.)


    # V refusing treatment


    Also, should D be liable when V refuses treatment? This was probably justified
    when medical treatment was very primitive, especially when operations had to be
    carried out without anaesthetic. In Holland (1841), D deliberately cut V’s finger.
    The cut become infected and V was advised that he should have the finger amputated.
    He refused to have the amputation until it was too late, and he died from the
    infection. D was liable for his death. In 1841 surgery was very primitive and
    this decision can be justified, but should D be liable on the same scenario today?
    D is in any event guilty of an assault causing actual bodily harm, but should
    he be liable for the death?


