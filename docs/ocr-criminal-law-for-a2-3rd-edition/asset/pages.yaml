- pgno: 48
  md: 'test. It focuses on whether D realised the risk (the subjective test). This
    makes it clear that D is at fault. It makes people take responsibility where they
    are aware there is a risk of the consequence occurring.


    It no longer makes defendants liable when they did not realise the risk. This
    is fair on the defendant. He or she is only guilty if they realise the risk. This
    is an improvement on the law before the case of G and another (2003) where even
    a 14-year-old with learning difficulties, as in Elliott v C (1983), was liable
    because the ‘reasonable’ adult would have seen the risk.


    # Problems


    Although the law is fairer to defendants now, it can be argued that the law is
    not so fair on innocent victims and their families. Someone may have been seriously
    injured or even killed yet the attacker may be not guilty if they were not subjectively
    reckless. It can be argued that the law does not give sufficient protection to
    innocent members of the public.


    There is conflict between public policy and legal principles. Public policy is
    based on public protection and the encouragement of good behaviour. Legal principles
    impose liability where there is fault. It was recognised in G and another (2003)
    that D must be shown to be aware of the risk (the mental fault element). It is
    often not possible to balance public protection with fairness to the defendant.


    It has also been suggested that having a subjective test for recklessness means
    that a defendant can too easily avoid liability. The prosecution have to prove
    that D was aware of the risk. It can be difficult to prove what was in D’s mind.


    Another problem in the law on recklessness is that it allows D’s characteristics
    to be taken into account in deciding whether D realised the risk. Other areas
    of criminal law, such as the defence of loss of control and the defence of duress,
    do not allow all of D’s characteristics to be taken into account. This means that
    there are conflicting legal principles in the different areas of law.


    # 3.3 Negligence


    A person is negligent if they fail to meet the standards of the reasonable man.
    This means it is an objective test. The defendant will be guilty because he did
    not act as a reasonable man would have done in the circumstances. What the defendant
    intended or thought is not relevant. This makes it a much lower level of fault
    to the two levels of fault, intention and recklessness, that we have already looked
    at.


    The concept of negligence making a person liable is well known in the civil law,
    but it is not widely used in the criminal law. It occurs in some statutory offences,
    for example s 3 of the Road Traffic Act 1988 which makes it an offence to drive
    without due care and attention.


    The only mainstream offence for which negligence is relevant is manslaughter.
    One form of manslaughter can be committed by ‘gross negligence’. This means there
    has to be a very high degree of negligence. The leading case is Adomako (1994).
    The level used in civil cases is not enough. Manslaughter is explained in more
    detail in Chapter 8.


    # 3.4 Knowledge


    This type of mens rea is the level required by some statutory offences. In some
    Acts of Parliament, a section will state that the offence is committed where the
    defendant ‘knowingly’ does something.


    Even where the Act does not actually state that the defendant must have knowledge,
    it is sometimes inferred that knowledge is required for the defendant to be guilty.
    This was the position in Sweet v Parsley (1969).


    # Sweet v Parsley (1969)


    > The defendant was charged with ‘being concerned in the management of premises
    used for the smoking of cannabis resin’. She owned a farmhouse which was let out.
    She did not know that the tenants in the farmhouse were smoking cannabis there.
    The House of Lords held that she was not guilty because she did not have knowledge
    that cannabis was being smoked.'
