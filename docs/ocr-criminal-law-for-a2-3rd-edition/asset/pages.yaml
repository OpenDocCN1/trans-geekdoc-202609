- pgno: 9
  md: '# Preface


    This third edition has been updated. All the topics on the specification of the
    OCR Examining Board are included. It covers the general principles of criminal
    law: actus reus, mens rea, strict liability, attempts and general defences. It
    also covers the law on the offences of murder, voluntary manslaughter, involuntary
    manslaughter, assaults, theft, robbery and burglary. As well as explaining the
    present law, the text explores problem areas and proposals for reform in each
    topic.


    The text is broken down with the use of many subheadings, diagrams and activities.
    There are also key facts charts and key cases charts to help students to revise
    topics. In this edition self-test questions have been added. These can be used
    in two ways. First, when doing a topic for the first time students can check their
    understanding working through the questions and referring back to the material.
    Secondly, the self-test questions


    can be used as a revision aid and answered without looking at the text.


    After the chapters on substantive law, there are four appendices. The first contains
    extracts from Law Commission Reports. This material expands on topics in some
    chapters and gives the student experience of reading source material. The second
    explains the style of the examinations in Units G153 and G154. It also explains
    the assessment objectives and the levels of assessment used for marking exam answers.
    The third appendix gives students help with how to answer examination questions
    on Unit G153. The fourth contains tips on how to answer questions for Unit G154.


    The law is stated as I believe it to be on 1 December 2011.


    Jacqueline Martin'
