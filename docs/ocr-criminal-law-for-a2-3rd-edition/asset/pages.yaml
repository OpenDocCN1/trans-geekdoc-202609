- pgno: 78
  md: '# Brain-dead


    It is not certain whether a person who is ‘brain-dead’ would be considered as
    a ‘reasonable creature in being’ or not. Doctors are allowed to switch off life-support
    machines without being liable for homicide. This suggests that ‘brain-death’ is
    the recognised test for death, but there has been no case on this point. It is
    possible that the courts might decide that a defendant who switches off a life-support
    machine, not as a medical decision but intending to kill the victim, could be
    guilty of murder.


    # ''Year and a day'' rule


    There used to be a rule that death must have occurred within a year and a day
    of the attack. This rule was sensible in past centuries when medical knowledge
    was not sufficient to prove that an attack had caused the death after such a long
    time. However, with improvements in medical skill, the rule became out of date.
    In particular, it meant that, where a victim was in a coma and did not die until
    more than a year after the attack, the attacker could not be charged with his
    murder. So the ‘year and a day’ rule was abolished by the Law Reform (Year and
    a Day Rule) Act 1996. There is now no time limit on when the death may occur after
    the unlawful act but, where it is more than three years after the attack, the
    consent of the Attorney-General is needed for the prosecution.


    # 6.2.3 Queen’s Peace


    ‘Under the Queen’s Peace’ means that the killing of an enemy in the course of
    war is not murder. However, the killing of a prisoner of war would be sufficient
    for the actus reus of murder.


    # 6.2.4 ‘Unlawful’


    The killing must be unlawful. If the killing is in self-defence or defence of
    another or in the prevention of crime and the defendant used reasonable force
    in the circumstances, then the killing is not unlawful.


    The defences of self-defence and defence of another are common-law defences which
    justify the defendant’s actions. They can be a defence to any crime, including
    murder, as the defendant is justifying the use of force. In addition there is
    a statutory defence of prevention of crime under s 3(1) of the Criminal Law Act
    1967 which states that:


    > ‘a person may use such force as is reasonable in the circumstances in the prevention
    of crime.’


    This also can be a defence to any offence, including murder.


    An interesting case in which the killing of one person was thought to be justified
    is Re A (Children) (Conjoined Twins) (2000).


    # Re A (Children) (Conjoined Twins) (2000)


    Twin girls were born joined at the lower abdomen. One twin (J) was capable of
    a separate existence, but the other twin (M) was not. M was being kept alive by
    a common artery through which J’s stronger heart circulated enough oxygenated
    blood for both of them. If the twins were not separated, then both girls would
    die within six months as J’s heart would eventually not be strong enough to pump
    the blood around. If the twins were separated, M would inevitably die.


    The twins’ parents refused permission to separate them, so the hospital authorities
    applied for a declaration that it would be lawful to separate them. The Court
    of Appeal held that it would be lawful. The main reason for this finding was that
    the defence of necessity justified the separation (see section 12.5 for necessity).
    However, one of the judges (Ward LJ) thought that M’s dependence on blood from
    J’s heart was the equivalent of a potentially fatal attack on J. This entitled
    doctors to intervene and use force to save J.'
