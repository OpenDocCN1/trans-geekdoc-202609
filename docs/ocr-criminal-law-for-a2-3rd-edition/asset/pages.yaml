    # Definition


    # Gross negligence manslaughter


    From Adomako (1994) it appears that the elements of gross negligence manslaughter
    are:


    +   - the existence of a duty of care towards the victim

    +   - a breach of that duty of care which causes death

    +   - gross negligence which the jury considers to be criminal.


    Each of these elements needs to be considered.


    # 8.2 Gross negligence manslaughter


    Gross negligence manslaughter is another way of committing manslaughter. It is
    completely different from unlawful act manslaughter. It is committed where the
    defendant owes the victim a duty of care but breaches that duty in a very negligent
    way, causing the death of the victim. It can be committed by an act or an omission,
    neither of which has to be unlawful. The leading case on gross negligence manslaughter
    is Adomako (1994).


    # Adomako (1994)


    D was the anaesthetist for a man who was having an operation on a detached retina.
    During the operation, one of the tubes supplying oxygen to the patient became
    disconnected. D failed to notice this until some minutes later when the patient
    suffered a heart attack caused


    # 8.2.1 Duty of care


    A duty of care has been held to exist for the purposes of the criminal law in
    various situations. These include the duty of a doctor to his patient, as in Adomako
    (1994). In that case Lord Mackay said that the ordinary principles of negligence
    in the civil law applied to ascertain whether there was a duty of care and whether
    that duty had been breached.


    The civil principles come from the case of Donoghue v Stevenson (1932) where it
    was stated that:


    > > ‘You must take reasonable care to avoid acts and omissions which you can reasonably
    foresee would be likely to injure your neighbour. Who then is my neighbour? The
    answer seems to be – persons who are so closely'
