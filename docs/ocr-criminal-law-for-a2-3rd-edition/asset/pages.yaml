    We explained that there is authority for the view that this general approach extends
    to the offence of attempt.


    8.88 We supported the application of this broad approach to attempt, in preference
    to the narrower view which would confine the meaning of intention to purpose.


    8.89 If D were to plant a bomb on board an aeroplane with a view to destroying
    it over the sea to claim on an insurance policy, and D was aware that the passengers
    on board were almost certain to die as a result, it would be quite wrong if D
    could not be convicted of attempted murder if the bomb failed to detonate. By
    the same token, if D’s purpose was that an explosion should destroy only property
    but, because someone was passing by at the precise moment when D decided to detonate
    the bomb, D realised that a person was almost certain to be killed, it should
    be possible to convict D of attempted murder if the bomb failed to detonate or
    the passer-by somehow managed to survive the explosion.


    8.90 We recognised that this broad approach to intent involves a departure from
    the idea of attempt as trying to commit an offence, in a strict sense, since that
    idea is intrinsically linked to the narrower understanding of intention as a synonym
    for purpose. However, what might be called a purist view of the nature of intention
    in attempts overlooks the fact, explained above, that, according to one line of
    Court of Appeal jurisprudence, some acts of preparation can amount to an attempt
    even though D may not at that moment have been trying to commit the offence itself.
    For example, D may be convicted of attempted rape where he physically tried to
    subdue his victim but did not go so far as to remove any items of clothing or
    perform any overtly sexual act.


    8.91 In the CP, we therefore proposed that the word “intent” in section 1(1) of
    the 1981 Act should not be limited to purpose but should encompass “Woollin” intent.


    8.92 Our consultees were in broad agreement with this proposal. The only suggested
    qualification was that a more appropriate test for the criminal law generally,
    and therefore for the attempt, should be that taken from the Court of Appeal’s
    judgment in Mohan. On this view, intent should mean “a decision to bring about
    [a consequence], in so far as it lies within [D’s] power ... whether [D] desired
    that consequence or not”.


    8.93 We see the merit in a general definition of this sort, rather than the present
    position which allows the tribunal of fact to infer the necessary intent if D
    foresaw the relevant consequence as a virtual certainty. Nonetheless, we believe
    that it would be inappropriate to incorporate a special test for “intent” in section
    1(1) of the 1981 Act which would differ from the general definition used for other
    criminal offences.


    8.94 We therefore take the view that “intent” in section 1(1) should continue
    to encompass purpose and indirect intent in line with the general legal position.


    8.95 In our view, it is unlikely that the criminal courts will come to a different
