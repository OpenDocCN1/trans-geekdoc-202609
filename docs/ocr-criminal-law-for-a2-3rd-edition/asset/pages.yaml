  md: '# 6.4 The need for reform of the law


    In 2006 the Law Commission published a report, *Murder, Manslaughter and Infanticide*
    (Report Law Com 304). In this report the Law Commission pointed out that there
    were many problems with the law on murder.


    In its general comments on the law of murder, the report said (at paragraph 1.8):


    > > ‘The law governing homicide in England and Wales is a rickety structure set
    upon shaky foundations. Some of its rules have remained unaltered since the seventeenth
    century, even though it has long been acknowledged that they are in dire need
    of reform. Other rules are of uncertain content, often because they have been
    constantly changed to the point that they can no longer be stated with any certainty
    or clarity.’


    In the report the Law Commission set out the existing problems with the law on
    murder. They listed the following:


    +   - The law on murder has developed bit-by-bit in individual cases and is not
    a coherent whole.

    +   - A defendant can be convicted of murder even though he only intended to cause
    serious harm (the serious harm rule).

    +   - There is no defence available if excessive force is used in self-defence.

    +   - The defence of duress is not available as a defence to murder.

    +   - The mandatory life sentence and the Government’s sentencing guidelines do
    not allow sufficient differentiation in sentencing to cover the wide variety of
    levels of blameworthiness in the current law of murder.


    Each of these is discussed in the section below.


    The Law Commission also pointed out that there are problems with the special defences
    to murder of diminished responsibility and provocation. These problems are considered
    in Chapter 7, sections 7.1.5 and 7.2.5.


    # 6.4.1 Bit-by-bit development of the law


    One of the main areas where the bit-by-bit development by the courts has caused
    problems is the meaning of ‘intention’. Intention is a


    ![](img/cc718e8d30bf7e5c8ed3badf83078451_85_0.png)


    Figure 6.3 Flowchart on homicide'
