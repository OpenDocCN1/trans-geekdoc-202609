    In Rogers the defendant had participated in the injection of heroin by holding
    his belt round the victim’s arm as a tourniquet to make it easier for the victim
    to find the vein to inject. The Court of Appeal had held that the act causing
    death was the injection of the heroin and it was ‘artificial and unreal’ to separate
    the tourniquet from the injection. By applying and holding the tourniquet, the
    defendant was playing a part in the mechanics of the injection. This made him
    guilty of an offence under s 23 of the Offences against the Person Act 1861 and,
    if death occurred as a result, he was also guilty of manslaughter.


    # Dias (2002)


    D was a heroin addict used to injecting heroin. The victim was also a drug user
