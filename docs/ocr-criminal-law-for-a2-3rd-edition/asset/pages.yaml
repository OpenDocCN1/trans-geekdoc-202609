  md: '# Chapter 1


    # Introduction to criminal law


    # Murder, manslaughter, robbery, rape and theft


    Virtually everyone can identify these as criminal offences. But how many others
    can you name? There are thousands of different offences. They vary from the most
    serious, such as murder and manslaughter, to minor breaches of regulations, such
    as selling a lottery ticket to someone who is under the age of 16.


    Fortunately, for A level, you only have to learn about a small number of offences,
    but you will have to understand the general principles involved in criminal law.
    This chapter looks at what defines a crime and then gives a brief introduction
    to:


    +   - the elements of offences

    +   - defences

    +   - standard and burden of proof.


    # 1.1 Defining a crime


    With such a wide range, it is difficult to have a general definition covering
    all offences. The only way in which it is possible to define a crime is to say
    that it is:


    +   - conduct forbidden by the State

    +   - for which there is a punishment.


    Lord Atkin supported this definition when, in the case of Proprietary Articles
    Trade Association v Attorney-General for Canada (1931), he said:


    > > ‘The criminal quality of an act cannot be discerned by intuition (made out
    by "gut feeling"); nor can it be discovered by reference to any standard but one:
    is the act prohibited with penal consequences?’


    This is the only definition which covers all crimes. However, there have been
    other definitions. An American legal writer, Herbert Packer, thought that, to
    be a crime:


    +   - the conduct must be wrongful and

    +   - it must be necessary to condemn or prevent such conduct.


    However, what is considered criminal will change over time. This can be caused
    for example by changing views in society, or changes in technology which lead
    to the need for new offences to cover new situations.


    Changing views on what is criminal can be demonstrated by the changes in the law
    on consenting homosexual acts. In 1885 the Criminal Law Amendment Act made consenting
    homosexual acts criminal even if they were in private. This remained as the law
    until 1967 when the Sexual Offences Act 1967 decriminalised such behaviour between
    those aged 21 and over. The age was reduced to 18 in 1994 and finally, in 2000,
    it was further reduced to 16. This age brings the law into line with consenting
    sexual acts between heterosexuals.


    New technology can lead to new areas of criminal law. For example, the invention
    of the'
