    # 11.2 Burglary


    This is an offence under s 9 of the Theft Act 1968. Section 9 provides two different
    ways in which burglary can be committed. Under s 9(1)(a) a person is guilty of
    burglary if he enters any building or part of a building as a trespasser with
    intent to steal, inflict grievous bodily harm, or do unlawful damage to the building
    or anything in it.


    Under s 9(1)(b) a person is guilty of burglary if, having entered a building or
    part of a building as a trespasser, he steals or attempts to steal anything in
    the building or inflicts or attempts to inflict grievous bodily harm on any person
    in the building.


    The following chart shows these different ways of committing burglary.


    Although ss 9(1)(a) and 9(1)(b) create different ways of committing burglary,
    they do have common elements. There must be:


    +   - entry

    +   - of a building or part of a building

    +   - as a trespasser.


    The difference between the subsections is the intention at the time of entry.
    For s 9(1)(a) the defendant must intend to do one of the three listed offences
    (known as ulterior offences) at the time of entering. However, there is no need
    for the ulterior offence to take place or even be attempted. For s 9(1)(b) what
    the defendant intends on entry is irrelevant, but the prosecution must prove that
    he actually committed or attempted to commit theft or grievous bodily harm.


    # 11.2.1 Entry


    Entry is not defined in the Theft Act 1968, but there have been several cases
    on the meaning of the word. The first main case on this point was Collins (1972)
    (see section 11.2.3 for the facts of


    Burglary


