    # Activity


    In each of the following situations, explain whether the defendant has the required
    intention for murder. The mens rea for murder is an intention to kill or an intention
    to cause grievous bodily harm.


    +   1. Geraint dislikes Victor and decides to attack him. Geraint uses an iron
    bar to hit Victor on the head. Victor dies as a result.

    +   2. Inderpal throws a large stone into a river to see how much of a splash
    it will make. Jake is swimming in the river and is hit on the head by the stone
    and killed.

    +   3. Kylie throws a large stone from a bridge, onto the motorway below. It is
    rush hour and there is a lot of traffic on the motorway. The stone smashes through
    the windscreen of Ashley’s car and kills his passenger.


    # Key cases


    | Case | Brief facts | Law |

    |---|---|---|

    | Moloney (1985) | D shot step-father in ‘quick on the draw’ incident. | Foresight
    of consequences is not intention; it is evidence of intention. |

    | Hancock and Shankland (1986) | Miner dropped lumps of concrete onto road, killing
    taxi driver. | The greater the probability of a consequence, the more likely it
    is that the consequence was foreseen and if that consequence was foreseen the
    greater the probability is that that consequence was also intended. |

    | Nedrick (1986) | Poured paraffin through letter box, causing fire in the house
    in which a child died. | Jury not entitled to infer the necessary intention unless
    sure that death or serious bodily harm was a virtual certainty and that the defendant
    appreciated this. |

    | Woollin (1998) | Threw baby at pram, causing its death. | The direction in Nedrick
    should not use the word ‘infer’. Instead, the jury should be told they are entitled
    to find intention. |

    | Re A (2000) | Doctors wanted to operate on conjoined twins but knew this would
    cause one of then to die. | Court thought that Woollin made it law that foresight
    of consequences is intention. |

    | Matthews and Alleyne (2003) | Threw V into river where he drowned. | Woollin
    meant that foresight of consequences is not intention. It is a rule of evidence.
    If a jury decides that the defendant foresaw the virtual certainty of death or
    serious injury then they are entitled to find intention but they do not have to
    do so. |


    Figure 3.2 Case chart on foresight of consequences'
