- pgno: 240
  md: '# Examination question


    Jin is in a supermarket queue. Jin watches Amy squeeze into the queue ahead of
    him. Jin is angry and tries to push Amy out of the queue. Amy loses her balance
    and falls into an elderly couple, Fred and Wanda. Fred has a heart condition and
    the shock causes him to have a heart attack. Wanda falls; she suffers from brittle
    bone disease and breaks her hip.


    In hospital Fred is put on a life-support machine but dies three hours later.
    Wanda recovers but before she goes home Doctor Sugar gives her an antibiotic injection.
    He is busy and does not check whether Wanda has any allergies. Wanda has a massive
    allergic reaction and dies.


    Discuss the criminal liability, if any, of both Jin and Doctor Sugar for the manslaughter
    of Fred and Wanda.


    (OCR G153 January 2010)


    +   - The principle of transferred malice – Jin pushes Amy but it is two other
    people who die.

    +   - The chain of causation from Jin’s act to the deaths – is this broken?

    +   - The injection given by Doctor Sugar causing Wanda’s death – doctors owe
    a duty of care to patients so consider gross negligence manslaughter.


    # Define/explain/expand


    Having identified the issues, now define the law and explain and expand it with
    case law for each of these issues in turn. Remember that to get to Level 5 it
    is necessary to have wide citation of cases. Deal with each part and each person
    separately.


    Define unlawful act manslaughter: there must be an unlawful act that is dangerous
    on an objective test and the act must cause the death. Jin’s push is a battery
    and so an unlawful act. Would sober and reasonable people inevitably recognise
    that it must subject V to the risk of some harm (Church)? D must have the required
    mens rea for the unlawful act.


    Explain/expand definition with cases Mitchell, Larkin, Church. Consider the dangerousness.
    Would the risk of harm to Fred because of his heart condition be obvious to sober
    and reasonable people? Explain with the cases of Watson and Dawson.


    Define the principle of transferred malice.

    Explain/expand with cases such as Latimer and Mitchell.

    Define the concept of the chain of causation. Include causation in fact and causation
    in law.

    Explain/expand with points such as ‘take your victim as you find him’ Blaue; also
    explain when the chain of causation may be broken by medical treatment using cases
    of Smith, Cheshire and Jordan.

    Define gross negligence manslaughter – duty of care, breach of that duty which
    carried a risk of death and death resulting.

    Explain/expand the degree of negligence required – Adomako.


    # Potential answer


    For problem questions it is necessary to:


    +   - Identify the relevant areas of law

    +   - Define the law on those areas

    +   - Explain and expand the law further with cases

    +   - Apply the law.


    So don’t forget the IDEA.


    # Identify


    As there are several issues to look at it is sensible to plan by writing down
    each one separately. In this question it is necessary to identify the following
    issues:


    +   - Jin’s pushing of Amy which leads to her falling against Fred and Wanda and
    their subsequent deaths – clearly not murder (no intention) so consider unlawful
    act manslaughter.'
  merge: -1
  img_proc: true
