    # 6.3 Mens rea of murder


    The mens rea for murder is stated as being ‘malice aforethought, express or implied’.
    This means that there are two different intentions, either of which can be used
    to prove the defendant guilty of murder:


    +   - express malice aforethought, which is the intention to kill, or

    +   - implied malice aforethought, which is the intention to cause grievous bodily
    harm.


    A defendant has the mens rea for murder if he has either of these intentions.
    This means that a person can be guilty of murder even though they did not intend
    to kill. This was decided in Vickers (1957).


    Vickers (1957)


    Vickers broke into the cellar of a local sweet shop. He knew that the old lady
    who ran the shop was deaf. However, the old lady came into the cellar and saw
    Vickers. He then hit her several times with his fists and kicked her once in the
    head. She died as a result of her injuries. The Court of Appeal upheld Vickers’
    conviction for murder. It pointed out that where a defendant intends to inflict
    grievous bodily harm and the victim dies, that has always been sufficient in English
    law to imply malice aforethought.


    The same point was considered by the House of Lords in Cunningham (1981) when
    it confirmed that an intention to cause grievous bodily harm was sufficient for
    the mens rea of murder.


    Cunningham (1981)


    D attacked V in a pub, attacking him repeatedly with a chair. V died from his
    injuries and D was convicted of murder. The House of Lords dismissed his appeal.
    It held that the law was firmly established. An intention to cause grievous bodily
    harm was sufficient for the mens rea of murder.


    The other issue is what is meant by ‘grievous bodily harm’? In DPP v Smith (1961)
    the House of Lords decided that ‘grievous bodily harm’ has the natural meaning
    of ‘really serious harm’. However, even if the judge directed the jury leaving
    out the word ‘really’ and just saying ‘serious harm’, this was not a misdirection.


    # Intention to injure a foetus


    In Attorney-General’s Reference (No 3 of 1994) (1997) it was held that it was
    not possible for a defendant to have the mens rea to kill or seriously injure
    a foetus. This was because a foetus does not have a separate existence from its
    mother.


    # 6.3.1 Intention


    The general rules on intention apply to murder. These were discussed in Chapter
    3 at section 3.1 and should be referred back to. The main problem with proving
    intention is in cases where the defendant’s main aim was not to cause the death
    or serious injury of the victim, but something quite different, but in achieving
    the aim a death is caused. This is referred to as oblique intent. The defendant
    does not have the mens rea for murder unless he foresaw that he would also cause
    death or serious injury. This is known as foresight of consequences and was considered
    in detail at section 3.1.2. However, as the law in this area is complex and important,
    the three main cases are set out here again.


    # Foresight of consequences


    The main rule is that foresight of consequences is not intention. In Moloney (1985),
    where the defendant shot and killed his step-father in a drunken challenge to
    see who was quicker on the'
