    # £2,000 stolen in cash scam


    ‘A commuter became the latest victim of a cashpoint scam when she had nearly £2,000
    stolen from her bank account after using a Paddock Wood cash machine on her way
    to work on December 19.


    When she checked her balance on the Internet on December 27 she found that the
    money, which included her entire December salary, was missing from her account.


    She said: “I was shocked. I thought, ‘I could have sworn I had been paid,’ then
