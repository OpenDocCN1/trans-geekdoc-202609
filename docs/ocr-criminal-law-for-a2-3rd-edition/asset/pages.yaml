- pgno: 33
  md: '# _Cheshire (1991)_


    D shot the victim in the thigh and the stomach. V needed major surgery. He developed
    breathing problems and was given a tracheotomy (ie a tube was inserted in his
    throat to help him breathe). Some two months after the shooting, V died from rare
    complications left by the tracheotomy. These complications were not diagnosed
    by the doctors. By the time V died, the original wounds had virtually healed and
    were no longer life-threatening. The defendant was still held to be liable for
    V’s death.


    In this case the Court of Appeal held that even though treatment for injuries
    was ‘short of the standard expected of a competent medical practitioner’, D could
    still be criminally responsible for V’s death. The prosecution had only to prove
    that D’s acts contributed to the death. D’s acts need not be the sole cause or
    even the main cause of death, provided that his acts contributed significantly
    to the death.


    # _Jordan (1956)_


    The victim had been stabbed in the stomach. He was treated in hospital and the
    wounds were healing well. He was given an antibiotic but suffered an allergic
    reaction to it. One doctor stopped the use of the antibiotic but the next day
    another doctor ordered that a large dose of it be given. The victim died from
    the allergic reaction to the drug. In this case the actions of the doctor were
    held to be an intervening act which caused the death. The defendant was not guilty
    of murder.


    In the first two cases the doctors were carrying out treatment for the injuries
    in an attempt to save the victim’s life. The victims would not have


    needed treatment if they had not been seriously injured by the defendant. In such
    situations the attacker is still liable even though the medical treatment was
    not very good. This was pointed out in _Cheshire_ (1991) by Beldam LJ:


    > ‘Even though negligence in the treatment of the victim was the immediate cause
    of death, the jury should not regard it as excluding the responsibility of the
    accused unless the negligent treatment was so independent of his acts, and in
    itself so potent in causing death, that they regard the contribution made by his
    acts as insignificant.’


    In the third case of _Jordan_ (1956) the fact that the victim was given a large
    amount of a drug when the doctors knew he was allergic to it was a sufficiently
    independent act to break the chain of causation. However, if a normal dose of
    a drug is given as part of emergency treatment and the doctors do not know that
    the victim is allergic to it, then the giving of the drug would not break the
    chain of causation.


    # Life-support machines


    Switching off a life-support machine by a doctor when it has been decided that
    the victim is brain-dead does not break the chain of causation. This was decided
    in _Malcherek_ (1981).


    # _Malcherek (1981)_


    D stabbed his wife in the stomach. In hospital she was put on a life-support machine.
    After a number of tests showed that she was brain dead, the machine was switched
    off. D was charged with her murder. The trial judge refused to allow the issue
    of causation to go to the jury. D was convicted and the Court of Appeal upheld
    his conviction.'
