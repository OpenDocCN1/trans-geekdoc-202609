  md: '![](img/cc718e8d30bf7e5c8ed3badf83078451_202_0.png)


    # 12.3 Intoxication


    This covers intoxication by alcohol, drugs or other substances, such as glue-sniffing.
    Intoxication does not provide a defence as such, but is relevant as to whether
    or not the defendant has the required *mens rea* for the offence. If he does not
    have the required *mens rea* because of his intoxicated state, he may be not guilty.


    Whether the defendant is guilty or not depends on:


    +   1. whether the intoxication was voluntary or involuntary, and

    +   2. whether the offence charged is one of specific or basic intent.


    Specific intent offences are generally those which require specific intention
    for their *mens rea*. The specific intent offences on the OCR A2 specification
    are murder, s 18 OAPA 1861, theft, robbery and burglary.


    Basic intent offences are generally those for which recklessness is sufficient
    for the *mens rea*. The basic intent offences on the OCR A2 specification are
    manslaughter, ss 20 and 47 OAPA 1861, assault and battery.


    # 12.3.1 Voluntary intoxication


    Voluntary intoxication is where the defendant has chosen to take an intoxicating
    substance. This can be by taking alcohol, illegal drugs or other intoxicants such
    as through sniffing glue. It can also occur where the defendant knows that the
    effect of a prescribed drug will be to make him intoxicated.


    # Voluntary intoxication and specific intent offences


    Voluntary intoxication can negate the *mens rea* for a specific intent offence.
    If the defendant is so intoxicated that he has not formed the *mens rea* for the
    offence, he is not guilty. This rule comes from *DPP v Beard* (1920).


    > > **DPP v Beard (1920)**

    > >

    > > Beard had been charged with murder and had put forward as his defence the
    fact that he was too intoxicated to have formed the *mens rea* for murder. He
    was convicted but on appeal, Lord Birkenhead considered previous decisions and
    stated:

    > >

    > > “Where a specific intent is an essential element in the offence, evidence
    of a state of drunkenness rendering the accused incapable of forming such an intent
    should be taken into consideration in order to determine whether he had in fact
    formed the intent necessary to constitute the particular crime”.'
