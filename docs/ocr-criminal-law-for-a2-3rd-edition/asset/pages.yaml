  md: "# Pre-emptive strike\n\nAnother point is whether a person has to wait until\
    \ they are attacked before they can use force. The law appears to be clear that\
    \ they can act to prevent force. It is not necessary for an attack to have started.\
    \ In the example above, no attack had started. D thought he was about to be attacked\
    \ and reacted to save himself from being attacked. This appears to be a sensible\
    \ rule, since it would be ridiculous if a person had to wait until they were stabbed\
    \ or shot before being allowed to defend themselves.\n\nIn *Attorney-General’s\
    \ Reference* (No 2 of 1983) (1984) it was held that someone who fears an attack\
    \ can make preparations to defend himself. This is so even if the preparations\
    \ involve breaches of the law.\n\n> **_Attorney-General’s Reference (No 2 of 1983)\
    \ (1984)_**\n> \n> D’s shop had been attacked and damaged by rioters. Fearing\
    \ further attacks, he made petrol bombs. D was charged with possessing an explosive\
    \ substance in such circumstances as to give rise to a reasonable suspicion that\
    \ he did not have it for a lawful object (contrary to s 4(10) of the Explosive\
    \ Substances Act 1883). D pleaded self-defence and the jury acquitted him. The\
    \ Attorney-General referred the point of law to the Court of Appeal which decided\
    \ that it was correct that D could make preparations in self-defence.\n\n# Excessive\
    \ force\n\nA major problem is where a defendant uses excessive force in self-defence.\
    \ If this is so then he cannot use self-defence as a defence. If he is charged\
    \ with any assault charge, the judge can take any issues of self-defence into\
    \ consideration when passing sentence. However, where such a defendant is charged\
    \ with murder, he must be given a life sentence.\n\nThis was seen in the cases\
    \ of *Clegg* (1995) and *Martin (Anthony)* (2002). The facts of both cases are\
    \ set out in section 6.2.4.\n\n# Relevance of D’s characteristics\n\nAnother point\
    \ is whether D’s characteristics can be taken into account in deciding if D thought\
    \ that he needed to defend himself.\n\nIn *Martin (Anthony)* (2002) the Court\
    \ of Appeal held that psychiatric evidence that D had a condition entailing that\
    \ he perceived much greater danger than the average person was not relevant to\
    \ the question of whether D had used reasonable force. One of the reasons for\
    \ this decision was that self-defence is usually raised in cases of minor assault\
    \ and it would be ‘wholly disproportionate to encourage medical disputes in cases\
    \ of that sort’.\n\nAlso in *Cairns* (2005) the Court of Appeal followed the decision\
    \ in *Martin* (2002) and held that when deciding whether D had used reasonable\
    \ force in self-defence, it was not appropriate to take into account whether D\
    \ was suffering from a psychiatric condition (such as paranoid schizophrenia)\
    \ which may have caused him to have delusions that he was about to be attacked.\n\
    \nIt is difficult to know whether these decisions are still effective following\
    \ the passing of the Criminal Justice and Immigration Act 2008. Section 76 of\
    \ that Act makes it clear that the question of whether the degree of force used\
    \ by D was reasonable in the circumstances, is to be decided by reference to the\
    \ circumstances as D believed them to be. The section continues that if the jury\
    \ (or magistrates) decide that D did genuinely have a belief in the existence\
    \ of particular circumstances, then D is entitled to rely on it.\n\nIf D’s psychiatric\
    \ condition makes him genuinely believe that force is necessary and the courts\
    \ accept that he believed this, then surely, under the wording of the Act, D must\
    \ be able to claim self-defence. However, it is doubtful that this is the interpretation\
    \ the courts will use. It would have been helpful if the Act had made it clear\
    \ whether a psychiatric condition which caused D to believe in the existence of\
    \ circumstances was to be taken into account or not."
