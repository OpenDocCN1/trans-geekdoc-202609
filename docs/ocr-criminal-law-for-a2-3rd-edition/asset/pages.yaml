  md: 'all be illegal. This is why the Court of Appeal in *Attorney-General’s Reference
    (No 6 of 1980)* (1981) stated that, although consent was not a defence to street
    fights, there were exceptions where consent was a defence.


    The list of exceptions that the Court of Appeal gave in that case was ‘properly
    conducted games and sports, lawful chastisement or correction, reasonable surgical
    interference, dangerous exhibitions, etc’. These exceptions are based on public
    policy.


    # Sport


    If there was no defence of consent in ‘properly conducted games and sports’ then
    team games such as football, rugby and hockey could never be played. There would
    also be a large number of individual sports which would be prevented, such as
    judo, karate and boxing.


    The important phrase in the judgment is ‘properly conducted games and sports’.
    There has to be a distinction between playing within the rules and behaviour which
    is outside the rules. A deliberate ‘off-the-ball’ tackle aiming at another player’s
    legs with the intention of causing serious injury must surely be considered as
    criminal behaviour. A player who is injured in this way has not consented to such
    behaviour.


    The case of *Barnes* (2004) set out matters which were to be considered in deciding
    whether an assault in the course of a match was criminal. The court said that
    in deciding whether conduct in the course of a sport is criminal or not, the following
    factors should be considered:


    +   - Intentional infliction of injury will always be criminal.

    +   - For reckless infliction of injury, did the injury occur during actual play,
    or in a moment of temper or over-excitement when play had ceased?

    +   - ‘Off-the-ball’ injuries are more likely to be criminal.

    +   - The fact that the play is within the rules and practice of the game and
    does not go beyond it will be a firm indication that what has happened is not
    criminal.


    By applying these factors a good balance should be achieved between allowing contact
    sports to be played without unnecessary restrictions on their rules and upholding
    the criminal law on assault. Only those who deliberately inflict injury or who
    go beyond the rules of the game should be liable under the criminal law.


    # Medical procedures


    Another exception where consent is allowed as a defence is ‘reasonable surgical
    interference’. Clearly where the surgery is needed to save the patient’s life
    or to improve a patient’s health in some way, then consent to the operation is
    a defence to any charge of assault.


    Mentally capable adults can consent to reasonable medical treatment or they can
    refuse it. If they refuse consent, then if surgery or other treatment was performed
    it would be a criminal act. For example, if a person refuses a blood transfusion
    because of their religious beliefs then such treatment cannot be given.


    If a patient is unconscious so that their consent cannot be asked, medical staff
    will try to obtain consent from relatives. If this is not possible then, where
    treatment is necessary and must be performed quickly, such an operation can be
    performed without actual consent.


    # 9.8.5 Comment on the law on consent


    It is difficult to reconcile the decisions by the courts in cases on consent.
    For example compare the case of *Brown* (1994) with the case of *Wilson* (1997).


    In *Brown* the House of Lords ruled that consent could not be a defence to sado-masochistic
    behaviour between consenting adult homosexuals because of the cruelty and degradation
    involved. In *Wilson* the Court of Appeal ruled that consent could be a defence
    where a husband had branded his wife’s buttocks with his initials. These decisions
    were made despite the fact that none of the ‘victims’ in *Brown* had needed medical
    attention whereas the wife in *Wilson* had had to receive medical attention.'
