  md: '# 2.2.2 Involuntary manslaughter and omissions


    Involuntary manslaughter can be committed in different ways. The two main ways
    are:


    +   - unlawful act manslaughter and

    +   - gross negligence manslaughter.


    Unlawful act manslaughter cannot be committed by an omission. There must be an
    ‘act’. This was decided in Lowe (1973).


    # Lowe (1973)


    D was the father of a nine-week-old baby who became ill and died. D, who was of
    low intelligence, said he had told the baby’s mother to take the child to a doctor,
    but he had not done anything else. The child’s mother was of subnormal intelligence.
    D was convicted of manslaughter of the baby. The Court of Appeal quashed the conviction
    because there was no unlawful ‘act’. A failure to do something could not be an
    ‘act’.


    However, gross negligence manslaughter can be committed by an omission. It could
    be argued that Lowe should have been convicted of this because he owed the child
    a duty of care and he had failed to get help. This idea was seen in Stone and
    Dobinson (1977) (above).


    For gross negligence manslaughter, the defendant must owe the victim a duty of
    care. If a duty of care exists then the defendant can be liable if an omission
    or failure to act by him causes the death of the victim.


    A full discussion of involuntary manslaughter is contained in Chapter 8.


    # 2.2.3 The duty of doctors


    There can be cases where doctors decide to stop treating a patient. If this discontinuance
    of treatment is in the best interests of the patient then it is not an omission
    which can form the actus reus. This was decided in Airedale NHS Trust v Bland
    (1993).


    # Airedale NHS Trust v Bland (1993)


    Bland was a young man who had been crushed by the crowd at the Hillsborough football
    stadium tragedy in 1989. This had stopped oxygen getting to his brain and left
    him with severe brain damage. He was in a persistent vegetative state (PVS), unable
    to do anything for himself and unaware of what was happening around him. He was
    fed artificially through tubes. He had been in this state for three years and
    the doctors caring for him asked the court for a ruling that they could stop feeding
    him.


    The court ruled that the doctors could stop artificially feeding Bland even though
    it was known that he would die as a result. This was held to be in his best interests.


    # 2.2.4 Comment on the law of omissions


    The first point is that the Latin phrase actus reus is not an accurate description
    of conduct which can be sufficient to make a person liable for an offence. Actus
    reus means an act: yet the law clearly recognises that a failure to act can be
    sufficient for liability. The Law Commission in its Draft Criminal Code (1989)
    preferred the phrase ‘external element’ and this is a more accurate description.


    There are several other issues. These include:


    +   - should there be wider liability for omissions such as the Good Samaritan
    law discussed in section 2.2

    +   - the problems of deciding when a duty should be imposed so that an omission
    is sufficient for the actus reus of an offence

    +   - should a person be liable for failure to act when they assume a duty

    +   - omissions in medical treatment

    +   - the justification for statutory imposition of liability for an omission.'
