  md: '# 9.6.4 Past proposals for reform


    In 1993 the Law Commission proposed new law to take its place, but the Government
    did nothing about this until 1998 when the Home Office issued a Consultation Document,
    *Violence: Reforming the Offences Against the Person Act 1861*. This included
    a draft Bill which set out four main offences. These were intended to replace
    ss 18, 20, 47 and assault and battery. In order, starting with the most serious
    (which is in clause 1 of the draft Bill), they are:


    +   1. Intentional serious injury where a person would be guilty if he intentionally
    caused serious injury to another.

    +   2. Reckless serious injury where a person would be guilty if he recklessly
    caused serious injury to another.

    +   3. Intentional or reckless injury where a person would be guilty if he intentionally
    or recklessly caused injury to another.

    +   4. Assault: a person would be guilty if he intentionally or recklessly

    +      (a) applied force to or caused an impact on the body of another, or

    +      (b) caused the other to believe that any such force or impact is imminent.


    In each of these the level of injury and the required *mens rea* are made clear
    by the wording. In addition, the draft Bill also defined the word ‘injury’, making
    it clear that both physical and mental injury were included. The word ‘wounding’
    is not used. So this would mean that a serious cut would be considered to be a
    serious injury, while a small cut would be considered to be merely an injury.
    This would have cleared up most of the problems in the present law. Unfortunately,
    although the Bill was sent out for consultation in 1998, the Government has done
    nothing more, so the law still remains in an unsatisfactory state.


    In the draft Bill, the Law Commission defined injury. It said that it included
    both physical and mental illness, and it gave a definition for both of these:


    +   - *physical* injury was defined as including pain, unconsciousness and any
    other impairment of a person’s physical health;


    +   - *mental* injury was defined as any impairment of a person’s mental health.


    They also included disease as a physical injury for the purposes of the most serious
    offence. However, this would mean that it would be almost impossible to convict
    a defendant of infecting another person with HIV since the proposed most serious
    offence (the first in the list above) can only be committed where the defendant
    has intentionally caused serious injury. This would mean that convictions for
    recklessly transmitting HIV, as in the case of *Dica* (2004) (see section 9.3.2)
    would not be possible.


    # 9.6.5 Current position


    The proposals set out in section 9.6.4 above were never made law. The Law Commission
    announced in its Eleventh Programme in 2011 that it intended to reconsider how
    the law on non-fatal offences against the person should be reformed. Work on this
    was intended to start in 2012. To check on the progress of this go to the Law
    Commission’s website www.justice.gov.uk/lawcommission/index.htm.


    # Self-test Questions


    +   1. Under which section of which Act of Parliament would a person be charged
    with the offence of occasioning actual bodily harm?

    +   2. What is meant by ‘actual bodily harm’?

    +   3. What *mens rea* is required for the offence of occasioning actual bodily
    harm?

    +   4. What is meant by a ‘wound’?

    +   5. What is meant by ‘grievous bodily harm’?

    +   6. What *mens rea* is required to prove a Section 20 offence?

    +   7. What *mens rea* is required to prove a Section 18 offence?

    +   8. Give three criticisms of the law on non-fatal offences against the person.'
