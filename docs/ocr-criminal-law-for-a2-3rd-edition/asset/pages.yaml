  md: "# Chapter 11\n\n# # Robbery\n## and burglary\n\n# ### 11.1 Robbery\n\nRobbery\
    \ is an offence under s 8 of the Theft Act 1968. In effect it is a theft which\
    \ is aggravated by the use or threat of force. Section 8 states:\n\n> **Definition**\n\
    > \n> **Robbery**\n> \n> ‘A person is guilty of robbery if he steals, and immediately\
    \ before or at the time of doing so, and in order to do so, he uses force on any\
    \ person or puts or seeks to put any person in fear of being then and there subjected\
    \ to force.’\n\nSo the elements which must be proved for robbery are for the *actus\
    \ reus*:\n\n+   - theft\n+   - force or putting or seeking to put any person in\
    \ fear of force.\n\nIn addition, there are two conditions on the force and these\
    \ are that it must be immediately before or at the time of the theft, and it must\
    \ be in order to steal.\n\nFor the *mens rea* of robbery it must be proved that\
    \ the defendant:\n\n+   - had the *mens rea* for theft and\n+   - intended to\
    \ use force to steal.\n\n# ### 11.1.1 Completed theft\n\nThere must be a completed\
    \ theft for a robbery to have been committed. This means that all the elements\
    \ of theft have to be present. If any one of them is missing then, just as there\
    \ would be no theft, there is no robbery. For example, there is no theft in the\
    \ situation where D takes a car, drives it a mile and abandons it because D has\
    \ no intention permanently to deprive. Equally there is no robbery where D uses\
    \ force to take that car. There is no offence of theft, so using force cannot\
    \ make it into robbery.\n\nThe case of *Robinson* (1977) demonstrates that if\
    \ the elements of theft are not complete then there cannot be robbery.\n\n> **Robinson\
    \ (1977)**\n> \n> D ran a clothing club and was owed £7 by V’s wife. D approached\
    \ V and threatened him. During a struggle the man dropped a £5 note and D took\
    \ it claiming he was still owed £2. D’s conviction for robbery was quashed because\
    \ the trial judge had wrongly directed the jury that D had honestly to believe\
    \ he was entitled to get the money in that way. In fact if D had a genuine belief\
    \ that he had a right in law to the money, then his actions were not dishonest\
    \ under s 2(1)(a) Theft Act 1968.\n\nWhere force is used to steal, then the moment\
    \ the theft is complete there is a robbery. This is demonstrated by the case of\
    \ *Corcoran v Anderton* (1980)."
