- pgno: 210
  md: '# ## Seriousness of the threat


    The threat must be of death or serious injury; lesser threats do not provide a
    defence. For example, a threat to disclose a previous conviction is not sufficient
    for duress. However, provided there are serious threats, then the cumulative effect
    of the threats can be considered. This was decided in *Valderrama-Vega* (1985).


    > > ### *Valderrama-Vega* (1985)

    > >

    > > The defendant illegally imported cocaine. He claimed he had done this because
    of death threats made by a mafia-type organisation involved in drug-smuggling
    and also because of threats to disclose his homosexuality and because of financial
    pressures. The trial judge said that the defence was only available to him if
    the death threats were the sole reason for his committing the offence. The Court
    of Appeal quashed his conviction as the jury was entitled to look at the cumulative
    effects of all the threats.

    > >

    > > If there had not been a threat of death, then the other threats in this case
    would not be enough on which to base a defence of duress. But as there had been
    a threat of death the jury was entitled to consider the whole of the threats.


    # ## Threat to whom?


    It used to be thought that the threat had to be to the defendant himself. But
    in an Australian case in 1967 it was accepted that threats to kill or seriously
    injure the defendant’s common-law wife were sufficient.


    In recent cases in England it has been accepted that threats to family or even
    to friends can be a basis for the defence of duress. In *Martin* (1989) in a case
    of duress of circumstances the wife of the defendant threatened to commit suicide
    unless he drove while disqualified (see section 12.4.9). This was held to be sufficient.
    In *Conway* (1988) the threats were to a passenger in the defendant’s car. These
    were accepted as forming the basis for the defence of duress (see section 12.4.9).


    There has been no decision on whether a threat to a complete stranger would be
    enough to give a defence of duress, but it seems likely that the courts would
    now allow this. Supposing an armed man seizes hold of someone you do not know,
    and then orders you to firebomb a particular building and cause severe damage
    to it or else he will kill the stranger. If you do damage to the building, can
    you use the defence of duress? You would be able to if the threat was to a member
    of your family or, under *Conway* (1988), to a friend. So, it would be reasonable
    to say that you should have a defence if you choose to commit a crime rather than
    let an innocent stranger die. In fact, the draft Criminal Code proposed that this
    should be the law.


    # ## 12.4.3 Subjective and objective tests


    In deciding if the defence should succeed the jury must consider a two-stage test.
    This involves both subjective and objective tests. These are:


    +   - was the defendant compelled to act as he did because he reasonably believed
    he had good cause to fear serious injury or death? (a mainly subjective test)
    and

    +   - if so, would a sober person of reasonable firmness, sharing the characteristics
    of the accused, have responded in the same way? (an objective test).


    These tests were laid down by the Court of Appeal in *Graham* (1982) and approved
    by the House of Lords in *Howe* (1987).


    > > ### *Graham* (1982)

    > >

    > > D was a homosexual who lived with his wife and another homosexual man, K.
    K was violent and bullied D. After both D and K had been drinking heavily, K put
    a flex around the wife’s neck and told D to pull the other end of the flex. D
    did this for about a minute. The wife died. D claimed he had only held the flex
    because of his fear of K. D’s conviction for murder was upheld.'
