  md: '# DPP v Majewski (1976)


    D had consumed large quantities of alcohol and drugs and then attacked the landlord
    of the public house where he was drinking. The landlord called the police and
    D also attacked the police officers who tried to arrest him. The Law Lords held
    that becoming intoxicated by drink and drugs was a reckless course of conduct,
    and recklessness is enough to constitute the necessary mens rea in assault cases.


    This ruling can be criticised, as the point at which the drink or drugs are taken
    is a quite separate time to the point when the actus reus for the offence is committed.
    It is difficult to see how there is coincidence of the two. It is reasonable to
    say that the defendant is reckless when he takes drink or other intoxicating substances,
    but this does not necessarily mean that when he commits an assault or battery
    three or four hours later he is reckless for the purposes of the offence. The
    decision can be viewed as a public policy decision.


    # 9.2 Assault occasioning actual bodily harm


    We now look at assaults where an injury is caused. The lowest level of injury
    is referred to in the Offences Against the Person Act 1861 as ‘actual bodily harm’
    under s 47. It is a triable either way offence. The section states:


    > > ‘Whosoever shall be convicted of any assault occasioning actual bodily harm
    shall be liable ... to imprisonment for five years.’


    As can be seen from this very brief section, there is no definition of ‘assault’
    or ‘actual bodily harm’. Nor is there any reference to the level of mens rea required.
    For all these points it is necessary to look at case law.


    # 9.2.1 Definition of assault occasioning actual bodily harm


    # Definition


    # Assault occasioning actual bodily harm


    An assault or battery which causes actual bodily harm, with the intention to cause
    the victim to fear unlawful force, or to subject unlawful force, or to be subjectively
    reckless as to whether the victim fears or is subjected to unlawful force.


    # 9.2.2 Actus reus of s 47


    It is necessary to prove that there was an assault or battery and that this caused
    actual bodily harm.


    # Actual bodily harm


    In Miller (1954) it was said that actual bodily harm is ‘any hurt or injury calculated
    to interfere with the health or comfort of the victim’. In T v DPP (2003) loss
    of consciousness, even momentarily, was held to be actual bodily harm.


    # T v DPP (2003)


    D and a group of other youths chased V. V fell to the ground and saw D coming
    towards him. V covered his head with his arms and was kicked. He momentarily lost
    consciousness and remembered nothing until being woken by a police officer. D
    was convicted of assault occasioning actual bodily harm.


    So, s 47 can be charged where there is any injury. Bruising, grazes and scratches
    all come within this offence.


    In T v DPP (2003) it was held that loss of consciousness, even for a very short
    time, could be actual bodily harm. In DPP v Smith (Michael) (2006) it was held
    that cutting the victim’s hair can amount to actual bodily harm.'
