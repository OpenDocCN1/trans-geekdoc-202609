- pgno: 115
  md: '> and directly affected by my act that I ought reasonably to have them in contemplation
    as being so affected when I am directing my mind to the acts or omissions which
    are called into question.


    Note that an act or an omission can form the basis of negligence.


    # Case examples of duty of care


    Since the case of *Adamako* (1994), the criminal courts have decided that a duty
    of care exists in very different situations. Some of these are set out below.


    **Singh (1999)**


    D was the landlord of property in which a faulty gas fire caused the deaths of
    tenants. It was recognised that there was a duty on D to manage and maintain property
    properly.


    **Litchfield (1998)**


    D was the owner and master of a sailing ship. He sailed, knowing that the engines
    might fail because of contamination to the fuel. The ship was blown onto rocks
    and three crew members died. It was held that D owed a duty to the crew.


    In both the above cases there was a contractual duty of care. However, there does
    not need to be a contractual duty. Other situations can lead to a duty of care,
    as shown by the cases of *Khan and Khan* (1998) (see section 2.2.4) and *Dias*
    (2002) (see section 8.1.3).


    In *Khan and Khan* (1998) Court of Appeal stated *obiter* that duty situations
    could be extended to other areas, and a further extension of the type of duty
    recognised by the courts occurred in *Wacker* (2002).


    **Wacker (2002)**


    D agreed to bring 60 illegal immigrants into England. They were put in the back
    of his lorry for a cross-channel ferry crossing. The only air into the lorry was
    through a small vent and it was agreed that this vent should be closed at certain
    times to prevent the immigrants from being discovered. D closed the vent before
    boarding the ferry. The crossing took an hour longer than usual and at Dover the
    Customs officers found that 58 of the immigrants were dead. D’s conviction for
    manslaughter was upheld by the Court of Appeal.


    The defendant argued that it was impossible to determine the extent of his duty,
    but the Court of Appeal held it was a simple matter on the facts. The defendant
    knew that the safety of the immigrants depended on his own actions in relation
    to the vent and he clearly assumed the duty of care.


    An interesting point in *Wacker* was that the victims were parties to an illegal
    act. In the civil law of negligence this would have meant that the victims (or
    their dependants) could not have made a claim against the defendant. However,
    the Court of Appeal held that for the criminal law, it was irrelevant that the
    victims were parties to an illegal act. It pointed out that the purposes of civil
    and criminal law were different and public policy demanded that defendants in
    this type of situation were liable under the criminal law.


    The case of *Wacker* indicates that this area of the law may be extended in the
    future, and it is difficult to predict what duties may be recognised.


    # D has created a state of affairs


    The Court of Appeal has also held that a duty of care can exist where the defendant
    has created a state of affairs which he knows or ought reasonably to know has
    become life-threatening. This was seen in the case of *Evans* (2009) (see section
    2.2.1).'
