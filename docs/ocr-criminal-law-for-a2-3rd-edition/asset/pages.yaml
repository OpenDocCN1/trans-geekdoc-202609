  md: '# Cairns (1999)


    V threw himself across the bonnet and windscreen of D’s car. Several of V’s friends
    were nearby shouting and D felt threatened. D drove off with V on his bonnet and
    some of V’s friends following. These friends were in fact trying to help rather
    then threaten D. When D braked for a speed hump, V fell under the car and was
    seriously injured. At the trial the judge directed the jury that they had to consider
    whether D’s actions were ‘actually necessary’. D’s conviction was quashed as he
    reasonably perceived a threat of serious physical injury or death.


    It is sufficient for the defendant to show that he acted as he did because he
    reasonably perceived a threat of serious physical injury or death. He is not required
    to prove that the threat was an actual or real threat.


    # 12.4.10 Comment on the law of duress


    # Unavailability for murder


    The ruling in Howe (1987) that duress is not available on a charge of murder ignores
    situations such as a woman motorist being hijacked and forced to act as getaway
    driver. Lord Griffiths simply dismissed such examples on the basis that it was
    inconceivable that such a person would be prosecuted. However, it is possible
    that such a person might be prosecuted and would have no defence.


    What if a young mother’s car is hijacked and she is told her two young children
    will be killed unless she helps terrorists to plant a bomb? Lord Hailsham thought
    that the ordinary person should be capable of heroism if he is asked to take an
    innocent life rather than sacrifice his own. But in this situation the mother
    is being asked to sacrifice her two children, yet she would have no defence.


    The age and/or susceptibility of a defendant to duress are also ignored as shown
    by the case


    of Wilson (2007), where a 13-year-old boy was convicted of murder when he helped
    his father in the murder of his mother. The Court of Appeal in that case accepted
    that there might be grounds for criticising a principle of law that did not allow
    a 13-year-old any defence to a charge of murder, even though he was only doing
    what his father told him as he was too frightened to refuse to obey his father.


    The law also creates an anomaly in that duress is not available for murder but
    is available for a charge under s 18 OAPA 1861. The mens rea of intention to cause
    grievous bodily harm can be the same as for murder.


    There is an additional problem where a defendant is charged with murder, as this
    offence carries a mandatory life sentence. The judge has to send the defendant
    to prison for life, and cannot take the duress into account when passing sentence.
    Where the defendant is charged with attempted murder, the judge has some discretion
    in sentencing. For example, in the case of the 16-year-old defendant in Gotts
    (1992), the judge placed him on probation.


    The Law Commission in its report, Legislating the Criminal Code: Offences Against
    the Person and General Principles (1993), proposed that the defence of duress
    should be available for all crimes. In 2006, the Law Commission’s report Murder,
    Manslaughter and Infanticide proposed that duress should be allowed as a defence
    to murder.


    # No allowances for low IQ


    In Bowen (1996) the Court of Appeal refused to allow the fact that the defendant
    had a very low IQ to be taken into account in deciding whether the defendant found
    it more difficult to resist any threats. This decision may be seen as harsh. A
    very low IQ can mean that the person fails to understand the true nature of matters.
    It should be taken into account.


    # Police protection


    In Hudson and Taylor (1971) the Court of Appeal accepted that police protection
    could not be'
