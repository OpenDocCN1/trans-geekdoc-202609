- pgno: 146
  md: 'The decision in this case makes it clear that even though V has consented to
    sexual intercourse, D can be guilty of an offence under s 20 OAPA 1861. This over-ruled
    the decision in Clarence (1888), where unknown to the wife, the husband was suffering
    from a venereal disease and the wife became infected when they had sexual intercourse.
    It was held that a wife’s consent to sexual intercourse with her husband meant
    that there was no assault.


    # 9.8.1 Implied consent


    There are situations in which the courts imply consent to minor touchings, which
    would otherwise be a battery. These are the everyday situations where there is
    a crowd of people and it is impossible not to have some contact. In Wilson v Pringle
    (1987) it was held that the ordinary ‘jostlings’ of everyday life were not battery.
    Nobody can complain of the jostling which is inevitable from his presence in,
    for example, a supermarket, an underground station or a busy street; nor can a
    person who attends a party complain if his hand is seized in friendship, or even
    if his back is (within reason) slapped.


    This also applies to contact sports. When a person takes part in sport such as
    rugby or judo, he is agreeing to the contact which is part of that sport. However,
    if the contact goes beyond what is allowed within the rules then it is possible
    for an offence to be committed. For example, a rugby player consents to a tackle
    within the rules of the game, but he does not consent to an opposition player
    stamping on his head.


    The breach of the rules of the sport must be a serious one. The Court of Appeal
    said in Barnes (2004) that where an injury is caused during a match, then a criminal
    prosecution should be reserved for those situations where the conduct was sufficiently
    grave to be properly categorised as criminal.


    # Barnes (2004)


    D made a late tackle on V during an amateur football match. V suffered a serious
    leg injury. D’s conviction of an offence under s 20 OAPA 1861 was quashed.


    # 9.8.2 Consent to minor injuries


    There have been arguments as to whether consent could be a defence to an offence
    under s 47 OAPA 1861. It used to be thought that consent could be a defence where
    the injuries were not serious. However, in Attorney-General’s Reference (No 6
    of 1980) (1981) where two young men agreed to fight in the street to settle their
    differences following a quarrel, the Court of Appeal held that consent could not
    be a defence to such an action as it was not in the public interest. They said:


    > ‘It is not in the public interest that people should try to cause, or should
    cause, each other bodily harm for no good reason. Minor struggles are another
    matter. So, in our judgment, it is immaterial whether the act occurs in private
    or public; it is an assault if actual bodily harm is intended and/or caused. This
    means that most fights will be unlawful regardless of consent.’


    So it is now accepted that consent is not a defence to a s 47 offence, unless
    the situation is one of the exceptions which have been recognised by the courts.
    In Attorney-General’s Reference (No 6 of 1980) the Court of Appeal gave the following
    list of exceptions:


    > ‘properly conducted games and sports, lawful chastisement or correction, reasonable
    surgical interference, dangerous exhibitions, etc.’'
