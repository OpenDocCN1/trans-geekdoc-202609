  md: '# 12.3.4 Comment on the law on intoxication


    The law on intoxication as a defence is largely policy based. This is because
    of two main reasons:


    +   1. Intoxication is a major factor in the commission of many crimes; many offences
    are committed when D is in an intoxicated state. Statistics suggests that half
    of all violent crimes are committed by a defendant who is intoxicated through
    drink and/or drugs.

    +   2. There is a need to balance the rights of the defendant and the victim;
    if intoxication were always to be a defence, then victims’ rights would not be
    protected.


    There is conflict between public policy and legal principles. Public policy is
    based on public protection and the encouragement of good behaviour. Legal principles
    impose liability where there is fault. The fault must be voluntarily assumed or
    there must be the deliberate taking of a risk.


    The law on intoxication has endeavoured to balance these opposing points of view,
    but over the past 30 or so years it can be argued that public policy has become
    the main theme.


    Public policy can be clearly seen in the law on self-defence, defence of another
    and prevention of crime. Parliament has enacted (in s 76(5) Criminal Justice and
    Immigration Act 2008) that D cannot rely on ‘any mistaken belief attributable
    to intoxication that was voluntarily induced’ when claiming any of these defences.


    # Mens rea


    Some areas of the law on intoxication appear to be contrary to the normal rules
    on mens rea and actus reus. In particular this is seen in the decision in DPP
    v Majewski (1977). The decision in this case, that the defendant is guilty of
    a basic intent offence because getting drunk is a ‘reckless course of conduct’,
    ignores the principle that mens rea and actus reus must coincide. The decision
    to drink may be several hours before the defendant commits the actus reus of any
    offence. For example, in O’Grady (1987), the defendant had fallen asleep and only
    committed the act of hitting his friend some hours afterwards.


    In addition, the recklessness in becoming intoxicated means that the defendant
    takes a general risk of doing something ‘stupid’ when drunk. At the time of becoming
    intoxicated the defendant has no idea that he will actually commit an offence.
    Normally, for offences where recklessness is sufficient for the mens rea of an
    offence, it has to be proved that D knew there was a risk of the specific offence
    being committed.


    This point was considered by the Law Commission in a consultation paper in 1993.
    They said in that paper that the Majewski rule was arbitrary and unfair. However,
    the Law Commission’s proposals for changing the law were severely criticised and
    by the time they published firm proposals for reform of the law in 1995 they had
    changed their opinion. By this time they thought that the present law operated
    ‘fairly, on the whole, and without undue difficulty’.


    # Specific intent/basic intent


    Where a defendant is charged with murder or a s 18 assault he can use intoxication
    as a defence. However, because intoxication is not a defence to a basic intent
    offence, such a defendant can be found guilty of a lower level offence. These
    are manslaughter where murder is charged, or an offence under s 20 OAPA 1861 where
    a s 18 offence has been charged.


    However, for other crimes, there is often no ‘fall-back’ offence. If a defendant
    is charged with theft and successfully claims that he did not form the mens rea
    for theft because he was too intoxicated, he will be not guilty of any offence.


    # Involuntary intoxication


    A final point where the law could be thought to be in need of reform is where
    the defendant’s inhibitions are broken down by being made intoxicated involuntarily.
    The decision in Kingston (1994) makes such a defendant guilty if he formed the
    necessary mens rea. This ignores the fact that the defendant was not to blame
    for the intoxication. Such a defendant would be not guilty of a basic intent offence
    where the prosecution relied on recklessness (as in Hardie'
