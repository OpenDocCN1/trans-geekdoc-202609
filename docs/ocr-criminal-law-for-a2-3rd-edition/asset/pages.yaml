  md: "# ### 4.6.2 Principle in *Sweet v Parsley*\n\nWhere an Act of Parliament does\
    \ not include any words indicating *mens rea*, the judges will start by presuming\
    \ that all criminal offences require *mens rea*. This was made clear in the case\
    \ of *Sweet v Parsley* (1969).\n\n# ### *Sweet v Parsley* (1969)\n\n> D rented\
    \ a farmhouse and let it out to students. The police found cannabis at the farmhouse\
    \ and D was charged with ‘being concerned in the management of premises used for\
    \ the purpose of smoking cannabis resin’. D did not know that cannabis was being\
    \ smoked there. It was decided that she was not guilty as the court presumed that\
    \ the offence required *mens rea*.\n> \n> In giving judgement, Lord Reid said:\n\
    > \n> > “There has for centuries been a presumption that Parliament did not intend\
    \ to make criminals of persons who were in no way blameworthy in a statutory code.\
    \ That means that whenever a section is silent as to *mens rea* there is a presumption\
    \ that ... we must read in words appropriate to require *mens rea*.”\n\nAlthough\
    \ the courts start with the presumption that *mens rea* is required, they look\
    \ at a variety of points to decide whether the presumption should stand or should\
    \ be displaced and the offence made one of strict liability.\n\n# ### 4.6.3 The\
    \ *Gammon* tests\n\nIn *Gammon (Hong Kong) Ltd v Attorney-General of Hong Kong*\
    \ (1984) the appellants had been charged with deviating from building work in\
    \ a material way from the approved plan, contrary to the Hong Kong Building Ordinances.\
    \ It was necessary to decide whether it had to be proved that they knew that their\
    \ deviation was material or whether the offence was one of strict liability on\
    \ this point.\n\nThe Privy Council started with the presumption that *mens rea*\
    \ is required before a person can be held guilty of a criminal offence and that\
    \ this presumption of *mens rea* applies to statutory offences.\n\nThey went on\
    \ to give four other factors to be considered. These were that:\n\n+   - the presumption\
    \ can only be displaced if this is clearly or by necessary implication the effect\
    \ of the words of the statute\n+   - the presumption is particularly strong where\
    \ the offence is ‘truly criminal’ in character\n+   - the presumption can only\
    \ be displaced if the statute is concerned with an issue of social concern such\
    \ as public safety\n+   - strict liability should only apply if it will help enforce\
    \ the law by encouraging greater vigilance to prevent the commission of a prohibited\
    \ act.\n\n# ### 4.6.4 Looking at the wording of an Act\n\nAs already stated, where\
    \ words indicating *mens rea* are used, the offence is not one of strict liability.\
    \ If the particular section is silent on the point then the courts will look at\
    \ other sections in the Act. Where the particular offence has no words of intention,\
    \ but other sections in the Act do, then it is likely that this offence is a strict\
    \ liability offence.\n\nIn *Storkwain* (1986) (see the beginning of this chapter)\
    \ the relevant section, s 58(2) of the Medicines Act 1968, was silent on *mens\
    \ rea*. The court looked at other sections in the Act and decided that, as there\
    \ were express provisions for *mens rea* in other sections, Parliament had intended\
    \ s 58(2) to be one of strict liability.\n\nWhere other sections allow for a defence\
    \ of ‘due diligence’ but another section does not, then this is another possible\
    \ indicator from within the statute that the offence is meant to be one of strict\
    \ liability.\n\nIn *Harrow LBC v Shah and Shah* (1999) the defendants were charged\
    \ under s 13(1)(c) of the National Lottery Act 1993. This subsection does not\
    \ include any words indicating either that *mens rea* is required or that it is\
    \ not, nor does it contain"
