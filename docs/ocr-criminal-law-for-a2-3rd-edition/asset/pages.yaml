  md: '# 9.8 Consent as a defence


    Consent may be a defence to battery and other offences against the person. However,
    it is never a defence to murder or to situations where serious injury is caused.


    Consent is strictly speaking not a defence, as where the other person consents,
    there is no offence. For example, where the other person consents to being touched,
    there is no battery as there is no unlawful force. This is illustrated by Donovan
    (1934).


    # Donovan (1934)


    D caned a 17 year-old-girl for the purpose of sexual gratification. This caused
    bruising and he was convicted of indecent assault and a common assault. D appealed
    on the basis that V had consented to the act. His conviction was quashed.


    A more extreme case illustrating the same point is Slingsby (1995) where the defendant
    was charged with manslaughter.


    # Slingsby (1995)


    D was charged with involuntary manslaughter by an unlawful act. D and the victim
    had taken part in sexual activity which was described as ‘vigorous’ but which
    had taken place with the victim’s consent. During this, a signet ring which D
    was wearing caused small cuts to the victim and this led to blood poisoning from
    which she died. The victim’s consent meant that there was no battery or other
    form of assault and so D was held to be not guilty of manslaughter as there was
    no unlawful act.


    # Real consent


    There must, however, be true consent. In Tabassum (2000) the defendant had persuaded
    women to allow him to measure their breasts for the purpose of preparing a database
    for sale to doctors. The women were fully aware of the nature of the acts he


    proposed to do, but said they consented only because they thought that D had either
    medical qualifications or medical training. The Court of Appeal approved the trial
    judge’s direction when he said:


    > ‘I should prefer myself to say that consent in such cases does not exist at
    all, because the act consented to is not the act done. Consent to a surgical operation
    or examination is not consent to sexual connection or indecent behaviour.’


    The fact that the victim submits to the defendant’s conduct through fear does
    not mean that the consent is real. This was shown by Olugboja (1982).


    # Olugboja (1982)


    The victim had already been raped by D’s companion and seen her friend raped by
    the same man. When D tried to have sexual intercourse with her, she submitted.
    D claimed that this meant she had consented. The Court of Appeal held that there
    was a difference between real consent and mere submission. It was for the jury
    to decide if the consent was real.


    In Dica (2004), where consent was given to sexual intercourse without knowledge
    of the fact that the defendant was HIV positive, the Court of Appeal held that
    there was no consent to the risk of infection.


    # Dica (2004)


    D, who knew he was HIV positive, had relationships with two women. They had unprotected
    sex with him and both became infected. They claimed that they did not know he
    was HIV positive and that if they had they would not have agreed to unprotected
    sex. D was charged with an offence under s 20 of the Offences Against the Person
    Act 1861. At his trial, the judge did not allow the issue of consent to go to
    the jury, so the Court of Appeal quashed the conviction but ordered a re-trial.'
