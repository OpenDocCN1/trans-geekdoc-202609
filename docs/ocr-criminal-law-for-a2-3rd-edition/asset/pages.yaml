  md: '# 7.2.1 Loss of self-control


    The first matter to be proved is that D had lost self-control when doing the acts
    which caused death. The loss of self-control does not have to be sudden. This
    was a rule of the former defence of provocation. It led to some defendants being
    unable to use the defence as their loss of control was not sudden. This was seen
    in the case of Ahluwalia (1992).


    # Ahluwalia (1992)


    The defendant had been physically abused over many years by her husband. One night
    her husband, before he went to bed, threatened her with violence the next day
    unless she paid a bill. Later after the husband was asleep the defendant poured
    petrol over him and set him alight. He died six days later. She was convicted
    of murder and appealed. The Court of Appeal did not allow her appeal on the basis
    of provocation. They pointed out that the defendant’s reaction to the provocation
    had to be ‘sudden’ rather than ‘immediate’ and the longer the delay, the more
    likely that the act had been deliberate, so that the prosecution could negate
    the defence of provocation. However, the Court of Appeal did allow her appeal
    on the basis of diminished responsibility.


    As there does not have to be a sudden loss of self-control for the defence of
    loss of control, it is possible that someone in the same situation as Mrs Ahluwalia
    would now be able to use the defence.


    # 7.2.2 Qualifying trigger


    There has to be qualifying trigger for the loss of control to come within the
    defence. Section 55 of the Act sets out the qualifying triggers which are permitted.
    These are where the loss of control was attributable to:


    +   - D’s fear of serious violence from V against D or another identified person;
    or

    +   - a thing or things done or said (or both) which–

    +     (a) constituted circumstances of an extremely grave character, and

    +     (b) caused D to have a justifiable sense of being seriously wronged.


    Alternatively, the qualifying trigger can be a combination of these two matters.


    # Fear of violence


    The old law on provocation did not allow a defence where D lost control through
    fear of violence. This was shown in the case of Martin (Anthony) (2002). See 6.2.4.


    It is possible that Martin might now be able to use the defence of loss of control.
    There could be said to be fear of violence by the burglars. But the issue of whether
    there was loss of control due to this fear might be more difficult.


    Battered wives, such as Ahluwalia, may also be able to use this qualifying trigger
    as they are in fear of serious violence from their partners.


    D does not have to fear violence by the victim: fear of violence by another person
    can also be a qualifying trigger. However, that other person has to be identified.
    It cannot be a general fear of violence.


    # Things said or done


    There are two points which have to be shown if D is relying on things said or
    done. These are that:


    +   - they were of an ‘extremely grave character’; and

    +   - they caused D to have a justifiable sense of being seriously wronged.


    These tests were not in the old law on provocation. This means that the defence
    of loss of control is narrower than the old defence of provocation. Many cases
    where D was able to use the defence of provocation would not now come within the
    defence of loss of control.


    Doughty (1986) is an example of a case where the defendant was able to use the
    defence of provocation but would now be unlikely to be able to use the defence
    of loss of control.


    # Doughty (1986)


    D killed his baby son aged 19 days because the child would not stop crying. He
    was convicted but the Court of Appeal quashed the conviction because it should
    have been left to the jury to decide if the baby’s crying was provocation by ‘things
    done’.'
