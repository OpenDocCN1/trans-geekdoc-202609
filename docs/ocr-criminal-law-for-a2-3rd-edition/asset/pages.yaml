    \ apply in the case of such a serious offence. This had the effect that a person\
    \ could be guilty of manslaughter when they had not personally foreseen any risk\
    \ at all. In addition, the risk which\n\nneeded to be foreseen by a reasonable\
    \ person was only the risk of some injury.\n\nThe law was re-stated in 1994 in\
    \ the case of *Adomako* (1994). This case re-introduced a test of gross negligence\
    \ for manslaughter (see section 8.2), rather than recklessness in any form. Following\
    \ *Adomako* it was initially thought that recklessness was no longer relevant\
    \ in the law of manslaughter.\n\nHowever, in the case of *Lidar* (2000) the Court\
    \ of Appeal affirmed that involuntary manslaughter could still be based on subjective\
    \ recklessness.\n\n> *Lidar (2000)*\n> \n> D and others had been asked to leave\
