  md: '# Appendix 4


    # Answering questions on Unit G154


    The topics for this paper change each year.

    OCR usually sends out the source material for the topics towards the end of the
    summer term for use in the examinations in January and June of the following year.


    # A4.1 The case study question


    Question 1 is always on a case in the source material. The question in the specimen
    material carries 16 marks, and you should spend about 18 minutes on this question;
    12 marks are given for Assessment Objective 2 (analysis and evaluation) and 4
    marks for AO3.


    The source material on the case will provide a good starting point for your answer,
    but you must use the information in the source to analyse and evaluate.


    Make sure that you focus on exactly what the question is asking. For example,
    a question may ask about the significance of a particular case to the development
    of the law in a specific area. One approach could be to state what the law was
    before the case, explain the problems in that law and from this show how the case
    developed the law.


    # A4.2 The essay question


    Question 2 can be on any area of criminal law in the Special Study Material. The
    question on the specimen paper is worth 34 marks, and you should


    spend about 36 minutes on this question. Both AO1 and AO2 are tested in this question,
    with 16 marks available for AO1 and 14 marks for AO2.


    For AO1, you will need to bring in extra knowledge, not merely rely on the source
    material. Remember that to get to Level 5 you need to show ‘wide-ranging accurate,
    detailed knowledge’.


    For AO2, the level of analysis and evaluation is the important aspect. To get
    to Level 5 you must show the ability to identify correctly the relevant and important
    points of criticism and also show good understanding of current debate and proposals
    for reform.


    There are also 4 marks for AO3.


    # A4.3 The application question


    There will usually be three mini-scenarios, each of which will raise different
    points of law. Overall there are 10 marks available for AO1 and 20 marks for AO2,
    with each mini-scenario being worth 10 marks. You should spend about 36 minutes
    on this question.


    Some of the knowledge required will be in the source material, but there will
    be other knowledge needed, as there are 10 marks for AO1. So be sure you give
    knowledge of relevant extra cases and/or sections of Acts of Parliament.


    The identification of the relevant law and application of this law (AO2) carries
    the main part of the marks on this question. Deal with'
