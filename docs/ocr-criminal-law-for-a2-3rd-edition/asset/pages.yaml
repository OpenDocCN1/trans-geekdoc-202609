  md: 'The police charged him with reckless driving for having driven on the pavement
    and he was convicted.


    He appealed and the Court of Appeal said that the jury should have been allowed
    to consider whether the defendant drove ‘under that form of compulsion, that is,
    under duress’.


    +   - Was the defendant compelled to act as he did because he reasonably believed
    he had good cause to fear serious injury or death? and

    +   - If so, would a sober person of reasonable firmness, sharing the characteristics
    of the accused have responded in the same way?


    This case was followed by Conway (1988).


    # Conway (1988)


    A passenger in D’s car had been shot at by two men a few weeks earlier. The car
    was stationary when the passenger saw two men running towards the car. He thought
    they were the two men who were after him (in fact they were plain clothes policemen)
    and he yelled at D to drive off. D did so very fast and was charged with reckless
    driving. The trial judge refused to leave duress for the jury to consider and
    D was convicted. On appeal the Court of Appeal quashed his conviction and ruled
    that a defence of duress of circumstances was available if, on an objective standpoint,
    the defendant was acting in order to avoid a threat of death or serious injury.


    Although these cases established that there was a defence of duress of circumstances,
    all the cases involved driving offences. It was not until the decision in Pommell
    (1995) that it became clear that duress of circumstances could be a defence to
    all crimes except murder and attempted murder and some forms of treason.


    # Pommell (1995)


    D was found by police at 8 am lying in bed with a loaded sub-machine gun against
    his leg. He told police that at about 1 am he had taken it off another man who
    was going to use it ‘to do some people some damage’. D said he had intended getting
    his brother to hand the gun in to the police that morning. At his trial for possessing
    a prohibited weapon the judge ruled that his failure to go to the police straight
    away prevented him having any defence. D was convicted. He appealed to the Court
    of Appeal who held that the defence of duress of circumstances was available for
    all offences except murder and attempted murder and some forms of treason. They
    quashed D’s conviction and sent the case for retrial.


    There was then a third case involving a driving offence. This was Martin (1989).


    # Martin (1989)


    D’s wife became hysterical and threatened suicide unless he drove her son (who
    was late and at risk of losing his job) to work. The defendant was disqualified
    from driving but he eventually agreed to do this. He was convicted of driving
    while disqualified. On appeal it was ruled that duress of circumstances could
    be available as a defence and the same two-stage test put forward in Graham (1982)
    for duress by threats applied. So the tests were:


    In Cairns (1999) the court had to consider whether there had to be a real threat
    to the defendant or whether the defence was available where the defendant reasonably
    perceived a threat of serious physical injury or death, even though there was
    no actual threat.'
