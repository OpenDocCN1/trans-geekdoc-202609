- pgno: 72
  md: 'harmless vegetable matter. D was convicted of attempting to be knowingly concerned
    in dealing with prohibited drugs.


    This time the House of Lords said that both ss 1(2) and 1(3) were relevant. Subsection
    1(3) states:


    > "In any case where—

    > (a) apart from this subsection a person''s intention would not be regarded as
    having amounted to an intent to commit an offence, but

    > (b) if the facts of the case had been as he believed them to be, his intention
    would be so regarded, then, for the purpose of subsection (1) he shall be regarded
    as having an intent to commit that offence."


    The combined effect of ss 1(2) and 1(3) of the Criminal Attempts Act 1981 meant
    that a person could be guilty of an attempt even if the commission of the full
    offence was impossible. In Shivpuri the facts as he believed them to be were that
    the suitcase contained prohibited drugs. He intended dealing in drugs so his intention,
    under s 1(3), is regarded as being an intention to commit that offence.


    The House of Lords accepted that its decision in Anderton v Ryan (1985) had been
    wrong and they used the Practice Statement to overrule that decision.


    # 5.5 Is the law on attempts satisfactory?


    There are several points which can be argued to be unsatisfactory.


    +   - The courts have not been very clear in deciding the dividing line between
    what is ‘merely preparatory’ and what is an attempt.


    # Key facts


    |  | Attempt | Case or statute |

    |---|---|---|

    | Definition of ‘attempt’ | With intent to commit an offence, a person does an
    act which is more than merely preparatory to the commission of the offence. |
    s 1(1) Criminal Attempts Act 1981 |

    | ‘More than merely preparatory’ | D must have embarked on the crime proper or

    D must be trying to commit the full offence. | Gullefer (1987)

    Geddes (1996) |

    | Mens rea of attempt | D must have intention for the full offence. A conditional
    intention is sufficient.


    Recklessness is not normally sufficient but

    recklessness as to part of the offence may be sufficient. | Easom (1971)

    Attorney-General’s Reference (Nos 1 and 2 of 1979) (1979)

    Millard and Vernon (1987)


    Attorney-General’s Reference (No 3 of 1992) (1994) |

    | Attempting the impossible | Ss 1(2) and 1(3) of the Criminal Attempts Act 1981
    mean that D is guilty even if the full offence is legally or physically impossible.
    | Shivpuri (1986) |


    Figure 5.3 Key facts chart on attempts'
