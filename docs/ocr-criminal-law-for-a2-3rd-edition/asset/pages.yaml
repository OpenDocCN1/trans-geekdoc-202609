    # 11.3.3 Intention in burglary


    There are anomalies between the different ways of committing burglary under s
    9(1)(a) and s 9(1)(b). Under s 9(1)(a) the defendant at the time of entering must
    have the intention to inflict grievous bodily harm, steal something from inside
    the building, or damage the building or anything in it. For s 9(1)(b) there is
    no need to prove the defendant’s intention at the time of entry, but it must be
    shown that once in the building he stole (or attempted to) or inflicted grievous
    bodily harm (or attempted to).


    # Protecting people or property


    The first point is that the defendant need only intend some damage (even slight)
    to be guilty under s 9(1)(a). Yet so far as injuring a person is concerned, the
    prosecution must prove an intention to inflict grievous bodily harm. This difference
    appears to be placing the protection of property above the protection of people.


    # Section 9(1)(a) and (1)(b)


    However, under s 9(1)(b) only theft or inflicting grievous bodily harm will trigger
    the required elements for burglary. This has the effect that under s 9(1)(a) a
    defendant who enters a building as a trespasser with the intention of causing
    damage is guilty of burglary, while under s 9(1)(b) a defendant who enters a building
    as a trespasser with no particular intention and then when in the building damages
    it or other property, has not committed burglary.


    There seems no reason why damage should not be included as one of the ‘trigger’
    offences for s 9(1)(b). The point of s 9(1)(b) is to catch the opportunist burglar:
    that is, the person who only decides to steal or cause GBH after they have entered.
    So it would be logical to include criminal damage as one of the ‘trigger’ offences
    under s 9(1)(b).


    Another comparison between the two subsections is that it is easier to prove a
    s 9(1)(b) burglary than s 9(1)(a). This is because for s 9(1)(a) the defendant’s
    intention has to be proved, while for s 9(1)(b) the commission of one of the ‘trigger’
    offences has to be proved. Proving a fact is easier than proving intention.


    # Conditional intention


    As already pointed out, a defendant can be guilty of burglary based on his intention
    when he enters the building as a trespasser. The courts have interpreted this
    as including where the defendant only intends to steal if there is something worth
    taking, as in Walkington (1979) where the defendant would have stolen from the
    till in the shop if there had been anything in it to steal. This is known as conditional
    intention. It can be argued that convicting of the completed offence of burglary
    on conditional intention is unjust. Conditional intention does not permit a conviction
    for the full offence in other situations. In particular, in robbery there must
    be a completed theft as intention to steal is not sufficient for the offence.


    # Lack of definitions


    The Theft Act 1968 does not define key elements of the offence of burglary. There
    is no definition of ‘entry’, ‘trespasser’ or ‘part of a building’. ‘Building’
    is only defined to extend its meaning to include inhabited places such as houseboats
    and caravans. There is no other definition of ‘building’.


    This lack of definitions means that the courts have had to decide what the Act
    was meant to cover. This has created difficulty in some cases and inconsistent
    decisions, especially on what is meant by ‘entry’.


    # Entry


    The law on entry has changed through the cases of Collins, Brown and Ryan. In
    Collins the Court of Appeal clearly stated that there had to be ‘an effective
    and substantial entry’. However,'
  merge: -1
  img_proc: true
