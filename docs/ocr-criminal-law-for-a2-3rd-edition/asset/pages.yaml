    +   - trust property, where a trustee can steal it

    +   - property received under an obligation

    +   - property received by another’s mistake.


    # 10.3.3 Property received under an obligation


    There are many situations in which property (usually money) is handed over to
    D on the basis that D will keep it for the owner or will deal with it in a particular
    way. Subsection 5(3) of the Theft Act 1968 tries to make sure that such property
    is still considered to ‘belong to the other’ for the purposes of the law of theft.
    It states:


    > ‘Where a person receives property from or on account of another, and is under
    an obligation to the other to retain and deal with that property or its proceeds
    in a particular way, the property shall be regarded (as against him) as belonging
    to the other.’


    Under this subsection there must be an obligation to retain and deal with the
    property in a particular way. So, where money is paid as a deposit to a business,
    the prosecution must prove that there was an obligation to retain and deal with
    those deposits in a particular way. If


    # Hall (1972)


    D was a travel agent who received deposits from clients for air trips to America.
    D paid these deposits into the firm’s general account but never organised any
    tickets and was unable to return the money. He was convicted of theft but on appeal
    his conviction was quashed because when D received the deposits he was not under
    an obligation to deal with them in a particular way. The Court of Appeal stressed
    that each case depended on its facts.


    In Klineberg and Marsden (1999) there was a clear obligation to deal with deposits
    in a particular way.


    # Klineberg and Marsden (1999)


    The two defendants operated a company which sold timeshare apartments in Lanzarote
    to customers in England. Each purchaser paid the purchase price on the understanding
    that the money would be held by an independent trust company until the apartment
    was ready for the purchaser to occupy. Over £500,000 was paid to the defendants’
    company but only £233 was actually paid into the trust company’s account. The
    defendants were guilty of theft as it was clear that they were under an obligation
    to the purchasers ‘to retain and deal with that property or its proceeds in a
    particular way’ and that they had not done this.


    There can be an obligation in less formal situations. This was shown by Davidge
    v Bunnett (1984).'
