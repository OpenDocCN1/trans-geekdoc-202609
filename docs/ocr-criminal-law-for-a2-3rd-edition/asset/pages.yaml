  md: '+   - there is no clear hierarchy of offences so that there is inconsistency
    between the offences

    +   - the language used needs modernising and simplifying.


    # 9.6.1 Out of date


    The 1861 Act is over 150 years old. This has caused a number of problems. For
    example, when it was created people did not have the understanding of mental health
    problems that we have today. So the Act only referred to ‘bodily’ harm in the
    offences and did not mention any mental harm.


    For some time it was not sure that the offences could include those where the
    victim had suffered mental harm. To fill this gap in the law, the courts in Chan
    Fook (1994) and Burstow (1997) held that the meaning of ‘bodily harm’ did include
    injury to mental health. Since then defendants causing such injury can be convicted
    of offences under the 1861 Act.


    Another area which has created problems is whether inflicting bodily harm could
    cover the situation of infecting another person with a disease. In 1861 there
    was only limited understanding of how some diseases were transmitted from person
    to person. The idea that a criminal offence could be committed by infecting someone
    with a disease was certainly not thought of then. Again the courts filled this
    gap by ruling in Dica (2004) that infecting someone with HIV did come within the
    wording of inflicting grievous bodily harm.


    # 9.6.2 Inconsistency between offences


    There are inconsistencies in the Act, especially with regard to the mens rea required
    for each offence. In particular, s 47 has the same mens rea as for an assault
    or battery. It does not require the defendant to intend or even realise that there
    is a risk of any injury. This appears unjust as s 47 carries a maximum sentence
    of five years’ imprisonment while assault and battery only carry a maximum of
    six months’ imprisonment.


    It is also unjust that a person who causes a small cut can be charged with the
    more serious offence of s 20 instead of the offence


    of ‘occasioning actual bodily harm’ under s 47. This is because s 20 refers to
    ‘wound or grievous bodily harm’. Yet clearly there are different levels of wound,
    and many of them do not equate with grievous bodily harm.


    Another inconsistency is that the maximum sentence for both s 47 and s 20 offences
    is the same (five years’ imprisonment). Yet the s 20 offence is clearly more serious
    than s 47 as it requires more serious injury. It also requires that D intends
    or is reckless as to causing V some harm whereas for s 47 it is not necessary
    to prove that D intended or was reckless as to whether he would cause some harm
    to V. It seems unjust that these two offences carry the same maximum penalty when
    the levels of blameworthiness are so different.


    Another inconsistency in the 1861 Act is that a defendant who intends or foresees
    the risk of minor injury can be convicted of the very serious offence of s 18
    if serious injury then occurs when he intends to resist arrest. This is the effect
    of the decision in Morrison (1989) (see section 9.4.2). Is it right that by intending
    to resist arrest, the defendant becomes liable for the same offence as someone
    who has intended to cause very serious injuries?


    # 9.6.3 Need for modern, simplified language


    Section 20 uses the word ‘maliciously’. In modern language today, the word ‘maliciously’
    suggests acting deliberately and with ill-will to the victim. Yet the meaning
    of the word in the 1861 Act has been held to be that D either intended to do the
    type of harm that was done or was reckless as to whether that type of harm occurred
    (see Cunningham (1957)). The Law Commission has recommended that the word ‘reckless’
    should be used.


    The Act is not consistent in that for s 20 the word ‘inflict’ is used, yet for
    s 18 the word ‘cause’ is used. This led to considerable debate as to whether the
    word ‘inflict’ in s 20 meant that a technical assault had to take place. This
    was resolved by the case of Burstow (1997) (see section 9.3.3) in which the House
    of Lords ruled that it did not.'
