    +   1. Which Act sets out the law on the defence of loss of control?

    +   2. What is the effect of a successful defence of ''loss of control'' to a
    charge of murder?

    +   3. Does the loss of control have to be sudden?

    +   4. If D is relying on ''things said or done'' as a qualifying trigger, what
