  md: '# Examination questions


    1. Emma hires Fred, a qualified electrician, to re-wire her house. She is unhappy
    when she notices sparks coming from some of the switches as she turns some lights
    on and off. Emma complains to Fred who returns to do some checks. He assures her
    that everything is in order and perfectly safe. The next morning, Emma goes to
    take a shower in the bathroom. When she turns on the shower control, she receives
    an electric shock that causes her to fall and bang her head, knocking her unconscious.
    Fortunately her friend, Gita, arrives almost immediately and discovers Emma. Gita
    calls an ambulance and Emma is rushed to hospital. While Emma is still critically
    ill she develops an infection.


    Hugh, a junior doctor employed by the hospital, fails to read Emma’s medical notes
    properly. The notes clearly show that Emma is allergic to penicillin. Hugh gives
    penicillin to Emma to treat the infection. As a result of her allergy, Emma dies.


    Discuss the liability of Fred and Hugh for Emma’s death.


    (OCR Specimen paper)


    2. Rashid suffers from diabetes. He has previously had blackouts due to


    hyperglycaemia and has to take insulin twice a day. He fails to take his insulin
    for a whole day and during the evening, while driving, he suffers from a blackout.
    Rashid loses control of the car which mounts a pavement and hits Larissa, a pedestrian.
    Larissa dies immediately.


    Evaluate the accuracy of each of the four statements A, B, C and D individually
    as they apply to the facts in the above scenario.


    Statement A: Rashid will not be convicted of unlawful act manslaughter because
    he has not caused the death of Larissa.


    Statement B: Rashid will gain an acquittal by using the defence of automatism.


    Statement C: Rashid will be found not guilty by reason of insanity.


    Statement D: Rashid must be hospitalised in a secure institution for the mentally
    ill if found ‘not guilty by reason of insanity’.


    NOTE Statements B, C and D relate to the defences of insanity and automatism and
    these are also set out at the end of Chapter 12.


    (OCR, G153, January 2011)'
