  md: '# Chapter 8


    # # Involuntary

    # manslaughter


    Involuntary manslaughter is an unlawful killing where the defendant does not have
    the intention, either direct or oblique, to kill or to cause grievous bodily harm.
    The lack of this intention is what distinguishes involuntary manslaughter from
    murder.


    It is also important not to confuse involuntary manslaughter with voluntary manslaughter.
    For voluntary manslaughter, the defendant has the intention to kill or cause grievous
    bodily harm but the charge is reduced from murder because the defendant can use
    one of the special defences to murder. Those special defences were explained in
    Chapter 7.


    # ## Range of involuntary manslaughter


    Involuntary manslaughter covers a wide range of circumstances. At the top end
    of the range, the behaviour of the defendant which caused the death can be highly
    blameworthy, as there was a high risk of causing death or serious injury. At the
    bottom end of the range, the defendant’s behaviour may verge on carelessness and
    only just enough to be considered blameworthy. There have been criticisms that
    the same offence covers such a wide range of behaviour, and proposals for reform
    are considered at section 8.4.


    The maximum sentence for involuntary manslaughter is life imprisonment, so this
    gives the judge discretion to impose any sentence which is suitable for the particular
    circumstances of the offence. In some cases the judge may even pass a non-custodial
    sentence.


    # ## Ways of committing involuntary

    ## manslaughter


    There are three ways of committing involuntary manslaughter. These are:


    +   1. *unlawful act manslaughter*

    +   2. *gross negligence manslaughter*

    +   3. *reckless manslaughter*.


    Each of these must be considered separately.


    # ### 8.1 Unlawful act manslaughter


    This is also known as *constructive* manslaughter because the liability for the
    death is built up or constructed from the facts that the defendant has done a
    dangerous unlawful act which caused the death. This makes the defendant liable
    even though he did not realise that death or injury might occur.'
