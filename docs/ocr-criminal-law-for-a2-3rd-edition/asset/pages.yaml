  md: '# Key Cases


    Duress can be by threats or circumstances.

    Duress is not available for murder (*Howe* (1987)) or attempted murder (*Gotts*
    (1992)).


    | Case | Facts | Law |

    |---|---|---|

    | *Valderrama-Vega* (1985) | Smuggled cocaine because of death threats and threats
    to disclose homosexuality. | Must be a threat of death or serious injury but can
    consider cumulative effect of threats. |

    | *Graham* (1982) | Helped kill his wife because he was threatened by his homosexual
    lover. | Two-stage test:

    - Was D compelled to act as he did because he reasonably believed he had good
    cause to fear serious injury or death?

    - If so, would a sober person of reasonable firmness, sharing the characteristics
    of the accused have responded in the same way? |

    | *Martin (DP)* (2000) | Suffered from a schizoid-affective state which would
    make him see things as threatening and believe the threats would be carried out.
    | Correct test should have been whether, in view of his condition, he may have
    reasonably feared for his own or his mother''s safety. |

    | *Bowen* (1996) | Had a low IQ (68). Obtained goods by deception for two men
    because of petrol-bomb threat. | Cannot take low IQ into account.

    Can consider:

    - age

    - pregnancy

    - recognised mental illness

    - gender. |

    | *Gill* (1963) | Threatened so he stole a lorry, but had time to escape and raise
    the alarm. | Cannot use duress if has a ‘safe avenue of escape’. |

    | *Hudson and Taylor* (1971) | Two girls lied on oath because of threats to cut
    them up. | The threat need not be capable of being carried out immediately.

    Also recognised that police protection cannot always be effective.

    Take into account age and gender. |

    | *Hasan* (2005) (see Section 12.4.8) | D tried to burgle a safe after he was
    threatened by a drug dealer associate. | Criticised *Hudson and Taylor* (1971)
    saying that D should seek police protection. |

    | *Abdul-Hussain* (1999) | Hijacked plane to escape from persecution in Iraq.
    | Threat must be ‘imminent’ and operating on D’s mind when he commits the offence.
    |'
