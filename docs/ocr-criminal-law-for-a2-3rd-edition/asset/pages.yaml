  md: '# Sexual infidelity


    This is no longer allowed as a qualifying trigger for the defence. Yet the defence
    of provocation was largely created for just such situations. If someone unexpectedly
    finds their partner having sex with another person, they are very likely to lose
    their self-control. But if this leads to them killing their partner, they will
    no longer have a partial defence to a charge of murder.


    # Fear of serious violence


    This qualifying trigger was added largely as a result of the lack of a defence
    in the cases of Clegg (1995) and Martin (2002) (see 6.2.4 for full details). However,
    the requirement that D must have lost self-control may make it difficult for such
    defendants to use the defence.


