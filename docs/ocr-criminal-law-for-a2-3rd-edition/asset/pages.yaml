  md: '# Attempts


    An attempt is where a person tries to commit an offence but, for some reason,
    fails to complete it. For example, D fires a gun at V, intending to kill V. Just
    as D pulls the trigger, V stoops to tie his shoelace. The bullet misses V and
    goes over his head. D intended to kill V but has not succeeded, so D cannot be
    charged with murder as V is still alive. However, it is obvious that D ought to
    be criminally liable for some offence. It would be ridiculous if he were just
    allowed to go free. D is clearly a dangerous person and should be liable under
    the criminal law. In this type of situation D can be charged with attempted murder.


    A case example of an attempt to murder is White (1910).


    # White (1910)


    D put cyanide in his mother’s drink, intending to kill her. She died of a heart
    attack before she could drink it. He tried to commit murder but did not actually
    kill his mother. He was convicted of attempted murder.


    # 5.1 Definition of ‘attempt’


    ‘Attempt’ is now defined by s 1(1) of the Criminal Attempts Act 1981.


    # Definition


    > ‘If, with intent to commit an offence to which this section applies, a person
    does an act which is more than merely preparatory to the commission of the offence,
    he is guilty of attempting to commit the offence.’


    As with all offences the prosecution must prove the actus reus and the mens rea.
    The definition above sets these out. They are:


    +   - Actus reus – a person does an act which is more than merely preparatory
    to the commission of the offence

    +   - Mens rea – with intent to commit that offence.


    # 5.2 Actus reus of attempt


    Before ‘attempt’ was defined in the 1981 Act, the courts used several different
    tests to decide whether the defendant had actually done enough towards the commission
    of the main offence for him to have committed the actus reus. The main tests were:


    +   - the ‘last act’ test: had D done the last act he could do before committing
    the main crime?

    +   - the ‘proximity’ test: were the defendant’s acts so ‘immediately connected’
    to the actus reus of the offence as to justify liability for attempt?'
