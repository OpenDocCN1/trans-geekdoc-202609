    | NB Assault and battery are both charged under s 39 Criminal Justice Act 1988
    and are known as common assault. |  |  |  |

    | Assault occasioning actual bodily harm. s 47 OAPA 1861 | Assault, ie an assault
    or battery. | Actual bodily harm (eg bruising). This includes: momentary loss
    of consciousness, R(T) v DPP (2003). psychiatric harm, Chan Fook (1994). | Intention
    or subjective recklessness as to causing fear of unlawful violence or of applying
    unlawful force, ie the mens rea for an assault or battery. |


    Figure 9.3 Key facts chart on assault, battery and s 47


    # 9.3 Malicious wounding/

    infllicting grievous bodily harm


    This is the next offence in seriousness. It is an offence under s 20 OAPA 1861
    which gives the definition below.


    # Definition


    Section 20 OAPA


    > ‘Whosoever shall unlawfully and maliciously wound or inflict any grievous bodily
    harm upon any other person, either with or without a weapon or instrument, shall
    be guilty of an offence and shall be liable ... to imprisonment for not more than
    five years.’


    The offence is commonly known as ‘malicious wounding’. It is triable either way
    and the maximum sentence is five years. This is the same maximum sentence as for
    a s 47 offence, despite the fact that s 20 is seen as a more serious offence and
    requires both a higher degree of injury and mens rea as to an injury. For the
    offence to be proved it must be shown that the defendant:


    +   - wounded, OR

    +   - inflicted grievous bodily harm

    +   and that he did this:

    +   - intending some injury (but not serious injury) be caused, OR

    +   - being reckless as to whether any injury was inflicted.'
