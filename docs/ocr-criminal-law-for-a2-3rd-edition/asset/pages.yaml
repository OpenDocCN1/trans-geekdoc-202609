  md: 'Act should replace the Homicide Act 1957. The new Act should, for the first
    time, provide clear and comprehensive definitions of the homicide offences and
    the partial defences. In addition, the new Act should extend the full defence
    of duress to the offences of first degree and second degree murder and attempted
