    # Excessive force


    The amount of force used to defend oneself or another must be reasonable in the
    circumstances. If excessive force is used the defence will fail as shown by the
    case of Clegg (1995).


    # Clegg (1995)


    D was a soldier on duty at a checkpoint in Northern Ireland. A car came towards
    the checkpoint at speed and with its headlights full on. One of the soldiers shouted
    for it to stop but it did not. Clegg fired three shots at the windscreen of the
    car and one as it passed him. This final shot hit a passenger in the back and
    killed her. The evidence showed that the car had gone past Clegg by the time this
    last shot was fired. So it was held that he could not use self-defence as a defence
    because there was no danger when he fired that shot. The force was excessive in
    the circumstances and his conviction for murder was upheld.


    Note that in 1999 the case of Clegg was referred back to the Court of Appeal by
    the Criminal Case Review Commission. On this occasion his conviction was quashed
    because new forensic evidence cast doubt on whether the fatal shot had actually
    been fired by Clegg.

    Another case in which it was decided that the level of the force used was not
    reasonable was Martin (Anthony) (2002).'
