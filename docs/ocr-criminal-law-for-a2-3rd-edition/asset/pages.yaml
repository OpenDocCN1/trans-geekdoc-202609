  md: '# DPP v Smith (Michael) (2006)


    The defendant had had an argument with his girlfriend. He cut off her ponytail
    and some hair from the top of her head without her consent. He was charged with
    an offence under s 47 of the Offences Against the Person Act 1861. The magistrates
    found there was no case to answer as they thought that cutting hair could not
    amount to actual bodily harm. The prosecution appealed and the Divisional Court
    held that cutting off a substantial amount of hair could be actual bodily harm.


    In Smith the court held that physical pain was not a necessary ingredient of actual
    bodily harm. Hair is attached to the head and this makes it a part of the body
    so that harm to the hair comes within the meaning of ‘actual bodily harm’.


    However, the court did stress that a substantial amount of hair has to be cut
    off for the harm to be ‘actual’ as opposed to trivial or insignificant harm.


    Psychiatric injury is also classed as ‘actual bodily harm’. This was decided by
    the Court of Appeal in Chan Fook (1994). However, they pointed out that actual
    bodily harm does not include ‘mere emotions such as fear, distress or panic’ nor
    does it include ‘states of mind that are not themselves evidence of some identifiable
    clinical condition’.


    This decision was approved by the House of Lords in Burstow (1997) where it was
    said that ‘bodily harm’ in ss 18, 20 and 47 OAPA 1861 must be interpreted so as
    to include recognisable psychiatric illness.


    # 9.2.3 Mens rea of s 47


    The section in the Act makes no reference to mens rea but, as the essential element
    is a common assault, the courts have held that the mens rea for a common assault
    is sufficient for the mens rea of a s 47 offence.


    This means the defendant must intend or be subjectively reckless as to whether
    the victim fears or is subjected to unlawful force. This is


    the same mens rea as for an assault or a battery. It is important to note that
    there is no need for the defendant to intend or be reckless as to whether actual
    bodily harm is caused. This is demonstrated by the case of Roberts (1971).


    # Roberts (1971)


    D, who was driving a car, made advances to the girl in the passenger seat and
    tried to take her coat off. She feared that he was going to commit a more serious
    assault and jumped from the car while it was travelling at about 30 miles per
    hour. As a result of this she was slightly injured. D was found guilty of assault
    occasioning actual bodily harm even though he had not intended any injury or realised
    there was a risk of injury. He had intended to apply unlawful force when he touched
    her as he tried to take her coat off. This satisfied the mens rea for a common
    assault and so he was guilty of an offence under s 47.


    This decision was confirmed by the House of Lords in the combined appeals of Savage
    (1991) and Parmenter (1991).


    # Savage (1991)


    D threw beer over another woman in a pub. In doing this the glass slipped from
    D’s hand and V’s hand was cut by the glass. D said that she had only intended
    to throw beer over the woman. D had not intended her to be injured, nor had she
    realised that there was a risk of injury. She was convicted of a s 20 offence
    but the Court of Appeal quashed that and substituted a conviction under s 47 (assault
    occasioning actual bodily harm). She appealed against this to the House of Lords.
    The Law Lords dismissed her appeal.


    The fact that she intended to throw the beer over the other woman meant she had
    the intention to apply unlawful force and this was sufficient for the mens rea
    of the s 47 offence.'
