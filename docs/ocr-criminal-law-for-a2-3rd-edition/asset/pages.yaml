- pgno: 76
  md: '# Chapter 6


    # Murder


    Homicide is the unlawful killing of a human being. There are different offences,
    depending on the mens rea of the defendant and whether there is a special defence
    available to the defendant. The most serious homicide offence is murder.


    # 6.1 Definition of ‘murder’


    Murder is a common-law offence. This means that it is not defined by any Act of
    Parliament. It has been defined by the decisions of judges in different cases,
    and the accepted definition is based on one given by a 17th-century judge, Lord
    Coke.


    # Definition


    > ‘Murder is the unlawful killing of a reasonable person in being and under the
    King’s (or Queen’s) Peace with malice aforethought, express or implied’.


    The different elements of this definition are considered in detail under the actus
    reus and mens rea of murder below at sections 6.2 and 6.3.


    # Jurisdiction


    Obviously, a person can be charged with a murder committed anywhere in England
    and Wales. But murder is unusual in that jurisdiction over it also includes any
    murder in any country


    by a British citizen. This means that if the defendant is a British citizen, he
    may be tried in an English court for a murder he is alleged to have committed
    in another country.


    # 6.2 Actus reus of murder


    The actus reus of murder is the unlawful killing of a reasonable creature in being
    and under the Queen’s Peace. Breaking this down, it has to be proved that:


    +   - D killed

    +   - a reasonable creature in being

    +   - under the Queen’s Peace and

    +   - the killing was unlawful.


    # 6.2.1 ‘Killed’


    # Act or omission


    The actus reus of killing can be by an act or omission, but it must cause the
    death of the victim. Usually in murder cases, the actus reus is an act. But remember
    that we saw in Chapter 2 at section 2.2 that an omission (a failure to act) can
    make a person liable for an offence.'
