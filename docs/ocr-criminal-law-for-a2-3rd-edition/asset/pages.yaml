  md: 'was a period of time during which he was left alone and so could have raised
    the alarm. As he had a ‘safe avenue of escape’ he could not rely on the defence
    of duress.


    It has also been held that if police protection is possible then the defendant
    cannot rely on duress. However, in the case of Hudson and Taylor (1971) it was
    accepted that police protection might not always be effective.


    the threats need to be able to be carried out immediately. In Hudson and Taylor
    (1971) the trial judge in their perjury case ruled that the defence of duress
    was not available to the two girls. This was because the threat could not be immediately
    put into effect while the girls were giving evidence, so there was no reason for
    them not to have given truthful evidence.


    On this point the Court of Appeal said that the threat had to be a ‘present’ threat
    but that this was in the sense that it was effective to neutralise the will of
    the defendant at the time of committing the offence. If the threat is hanging
    over the defendant at the time he or she commits the offence, then the defence
    of duress is available.


    This was further considered in Abdul-Hussain (1999), a case on duress of circumstances.


    # Hudson and Taylor (1971)


    The defendants were two girls, aged 17 and 19, who were prosecution witnesses
    in a case against a man called Wright who was charged with wounding another man.
    When giving evidence in court they lied and said they could not identify Wright
    as the attacker. They were then charged with perjury (lying in court under oath).
    In their defence at their trial for perjury they said they lied because a man
    called Farrell, who had a reputation for violence, had told Hudson that if she
    gave evidence against the attacker, he would cut her up. They were convicted and
    appealed. The Court of Appeal quashed their conviction.


    At the appeal the prosecution argued that the girls could have sought police protection.
    On this point the Court of Appeal pointed out that there were cases in which the
    police could not provide effective protection. They said that in deciding whether
    going to the police for protection was a realistic course, the jury should consider
    the age of the defendant, the circumstances of the threats and any risks which
    might be involved in trying to rely on police protection.


    # Abdul-Hussain (1999)


    The defendants, who were Shi’ite Muslims, had fled to Sudan from Iraq because
    of the risk of punishment and execution because of their religion. They feared
    that they would be sent back to Iraq and so they hijacked a plane. The plane eventually
    landed in the UK. The defendants were charged with hijacking and pleaded duress.
    The trial judge decided that the danger they were in was not sufficiently ‘close
    and immediate’ as to give rise to a ‘virtually spontaneous reaction’ and he ruled
    that the defence of duress could not be considered by the jury. The defendants
    were convicted and appealed.


    The Court of Appeal quashed their convictions holding that the threat need not
    be immediate but it had to be imminent in the sense that it was hanging over them.


    However, the decision in Hudson and Taylor was criticised by the House of Lords
    in Hasan (formerly Z) (2005) (see section 12.4.8). It is now doubtful that a defendant
    could use the defence of duress where there was opportunity to go to the police.


    # 12.4.5 Imminence of threat


    The threat must be effective at the moment the crime is committed, but this does
    not mean that


    The Court of Appeal in Abdul-Hussain (1999) ruled that:


