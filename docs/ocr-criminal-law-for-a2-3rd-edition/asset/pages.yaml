- pgno: 200
  md: 'because of the Valium. The trial judge directed the jury to ignore the effect
    of the tablets and he was convicted of arson.


    The Court of Appeal quashed his conviction as the defendant had taken the drug
    because he thought it would calm him down. This is the normal effect of Valium.
    So the defendant had not been reckless and the defence of automatism should have
    been left to the jury.


    # 12.2.3 Comment on the law on automatism


    The main problem is that in each case it has to be decided whether the situation
    is one of insane automatism or non-insane automatism. This is very important as
    the effect of these two types of automatism as a defence is so different.


    Situations which would seem to the non-lawyer to be ones of non-insane automatism,
    such as a diabetic being in a high blood sugar state, or someone sleep-walking,
    may at law be considered to be insane automatism.


    # 12.2.4 Proposals for reform in the law on automatism


    In the Draft Criminal Code (1989) the following definition was suggested:


    > > ‘A person is not guilty of an offence if –

    > > 1. he acts in a state of automatism, that is, his act

    > > 2. is a reflex, spasm or convulsion; or

    > > 3. occurs while he is in a condition (whether of sleep, unconsciousness, impaired
    consciousness or otherwise) depriving him of effective control of his act; and

    > > 4. the act or condition is the result neither of anything done or omitted
    with the fault required for the offence nor of voluntary intoxication.’


    This definition would include those who act during an epileptic convulsion, so
    that cases such as Sullivan (1984) would be able to use the defence of non-insane
    automatism instead of insanity. This would be a welcome improvement to the law.


    Also cases of sleep-walking would come under this defence. This would have given
    Burgess (1991) the defence of non-insane automatism. Under the present law he
    was found not guilty by reason of insanity. In both these cases the defendants
    under the proposals for reform would have had a full defence.


    On the other hand, the present system allows a judge to order medical treatment
    for those who are found not guilty by reason of insanity. Should there be some
    way of making sure that those who commit dangerous offences while in an automatic
    state, and who would benefit from treatment, do in fact receive treatment? It
    can be argued that a complete acquittal leaves a possibly dangerous person (although
    not intentionally) to do the same thing again.


    # Self-test Questions


    +   1. What is the definition of automatism?

    +   2. What is the difference between insane automatism and non-insane automatism?

    +   3. Give three cases or examples of different external causes which could lead
    to a successful defence of non-insane automatism.

    +   4. What limitations are there on the defence of non-insane automatism when
    it is self-induced?

    +   5. Give a case where self-induced automatism was allowed as a defence.

    +   6. If the Draft Criminal Code had been made law, what effect would it have
    had on the defence available to someone who did the actus reus of an offence whilst
    suffering from an epileptic seizure?

    +   7. What arguments are there for restricting the defence of non-insane automatism?'
