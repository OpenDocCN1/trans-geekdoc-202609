  md: '# Key facts


    |  | Law | Cases |

    |---|---|---|

    | **Presumption of mens rea** | Unless the words make it clear that *mens rea*
    is not required, the courts will always start with the presumption that *mens
    rea* is required. | *Sweet v Parsley* (1969) |

    | **Looking at the rest of the Act** | If other subsections state that *mens rea*
    is required but the section being considered does not state this, it is likely
    that the offence will be held to be one of strict liability. | *Storkwain* (1986)
    |

    | **Quasi-criminal offences** | Regulatory crimes (not truly criminal) are *more*
    likely to be held to be strict liability offences. | *Harrow LBC v Shah and Shah*
    (1999) |

    | **Penalty of imprisonment** | Where an offence is punishable by imprisonment,
    it is *less* likely that it will be held to one of strict liability. | *B v DPP*
    (2000) |

    | **Issue of social concern** | Where the offence involves potential danger to
    public health, safety or morals then it is *more* likely to be held to be a strict
    liability offence. | *Blake* (1997) |

    | **Would strict liability promote enforcement of the law?** | If making the offence
    one of strict liability would *not* help law enforcement then there is no reason
    to make the offence a strict liability one. | *Lim Chin Aik v The Queen* (1963)
    |


    Figure 4.3 Key facts chart on how the courts decide whether strict liability applies


    # 4.7.2 Social utility


    The main justification for strict liability offences is their usefulness to the
    public as a whole. Strict liability offences help protect society by regulating
    activities ‘involving potential danger to public health, safety or morals’. Making
    an offence one of strict liability promotes greater care over these matters by
    encouraging higher standards in such matters as hygiene in processing and selling
    food, or in obeying building or transport regulations. It makes sure that businesses
    are run properly.


    As failure to comply with high standards may cause risk to the life and health
    of large numbers of the general public, there is good reason to support this point
    of view. However, some opponents of strict liability argue that there is no


    evidence that strict liability leads to businesses taking a higher standard of
    care. Some even argue that strict liability may be counter-productive. If people
    realise that they could be prosecuted even though they have taken every possible
    care, they may be tempted not to take any precautions.


    # 4.7.3 Other justifications


    Other justifications for the imposition of strict liability include the following:


    +   - It is easier to enforce as there is no need to prove *mens rea*.

    +   - It saves court time as people are more likely to plead guilty.'
