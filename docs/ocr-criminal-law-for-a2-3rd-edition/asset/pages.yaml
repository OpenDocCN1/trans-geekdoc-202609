- pgno: 199
  md: 'the Court of Appeal held that there must be ‘total destruction of voluntary
    control’.


    a difference in the way the defence applies to specific intent offence and basic
    intent offences.


    # Attorney-General’s Reference (No 2 of 1992) (1993)


    D was a lorry driver, who after driving for several hours, drove along the hard
    shoulder of a motorway for about half a mile. He hit a broken-down car which was
    stationary on the hard shoulder, killing two people. He said that he was suffering
    from the condition ‘driving without awareness’ which puts a driver into a trance-like
    state. It may be brought on by driving for long distances on motorways. The jury
    acquitted him. The Attorney-General referred the point of law to the Court of
    Appeal who ruled that because this condition only causes partial loss of control
    it did not amount to automatism.


    # Specific intent offences


    If the offence charged is one of specific intent, then self-induced automatism
    can be a defence. This is because the defendant lacks the required mens rea for
    the offence.


    # 12.2.2 Self-induced automatism


    This is where the defendant knows that his conduct is likely to bring on an automatic
    state. Examples include a diabetic, who knows the risk of failing to eat after
    taking insulin, or a person who drinks after taking medication when he has been
    told by his doctor that he must not take alcohol while on that medication. This
    law comes from the case of Bailey (1983).


    # Basic intent offences


    If the offence charged is one of basic intent then the law is more complicated.
    The main rule is that the defendant cannot use the defence of automatism if he
    has brought about the automatic state by being reckless. The law set out in Bailey
    (1983) states:


    # Bailey (1983)


    D was a diabetic who had failed to eat enough after taking his insulin to control
    the diabetes. He became aggressive and hit someone over the head with an iron
    bar. The trial judge ruled that the defence of automatism was not available. The
    Court of Appeal held that this ruling was wrong but upheld D’s conviction as there
    was insufficient evidence in the case to raise the defence of automatism.


    +   1. If the defendant has been reckless in getting into a state of automatism,
    self-induced automatism cannot be a defence. Subjective recklessness is sufficient
    for the mens rea of crimes of basic intent.

    +   2. Where the self-induced automatic state is caused through drink or illegal
    drugs or other intoxicating substances, the defendant cannot use the defence of
    automatism. This is because DPP v Majewski (1977) decided that becoming voluntarily
    intoxicated is a reckless course of conduct (see section 12.3).

    +   3. Where the defendant does not know that his actions are likely to lead to
    a self-induced automatic state in which he may commit an offence, he has not been
    reckless and can use the defence of automatism.


    This third situation was seen in Hardie (1984).


    Although the appeal was dismissed in Bailey, the Court of Appeal set out the rules
    on self-induced automatism. The first point was that there is


    # Hardie (1984)


    D was depressed because his girlfriend had told him to move out of their flat.
    He took some Valium tablets which had been prescribed for his former girlfriend.
    She encouraged him to take the tablets, stating that it would calm him down. He
    then set fire to a wardrobe in the flat. He said he did not know what he was doing'
