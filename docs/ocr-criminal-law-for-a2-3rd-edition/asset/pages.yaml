  md: "# Chapter 4\n\n# Strict liability\n\n# 4.1 The concept of strict liability\n\
    \nThe previous chapter explained the different types of *mens rea*. This chapter\
    \ considers those offences where *mens rea* is not required in respect of at least\
    \ one aspect of the *actus reus*. Such offences are known as strict liability\
    \ offences.\n\nAn example demonstrating strict liability is *Pharmaceutical Society\
    \ of Great Britain v Storkwain Ltd (1986).*\n\n> **Pharmaceutical Society of Great\
    \ Britain v Storkwain Ltd (1985)**\n> \n> D was charged under s 58(2) of the Medicines\
    \ Act 1968 which states that no one shall supply certain drugs without a doctor's\
    \ prescription. D had supplied drugs on prescriptions, but the prescriptions were\
    \ later found to be forged. There was no finding that D had acted dishonestly,\
    \ improperly or even negligently. The forgery was sufficient to deceive the pharmacists.\
    \ Despite this, the House of Lords held that the Divisional Court was right to\
    \ direct the magistrates to convict D. The pharmacists had supplied the drugs\
    \ without a genuine prescription and this was enough to make them guilty of the\
    \ offence.\n\n# 4.1.1 Requirement of *actus reus*\n\nFor nearly all strict liability\
    \ offences, it must be proved that the defendant did the relevant *actus reus*.\n\
    \nFor *Storkwain*, this meant proving that the chemist had supplied drugs without\
    \ a genuine prescription. It also has to be proved that the doing of the *actus\
    \ reus* was voluntary. If the chemist had been forced at gun-point to provide\
    \ the drug, then the act would not have been voluntary.\n\nHowever, there are\
    \ a few rare cases where the defendant has been found guilty even though they\
    \ did not do the *actus reus* voluntarily. These are known as crimes of absolute\
    \ liability.\n\n# 4.2 Absolute liability\n\nAbsolute liability means that no *mens\
    \ rea* at all is required for the offence. They involve ‘status offences’, offences\
    \ where the *actus reus* is a ‘state of affairs’. The defendant is liable because\
    \ they have ‘been found’ in a certain situation. Such offences are very rare.\
    \ To be an absolute liability offence, the following conditions must apply:\n\n\
    +   - the offence does not require any *mens rea* and\n+   - there is no need\
    \ to prove that the defendant’s *actus reus* was voluntary.\n\nThe following two\
    \ cases demonstrate this.\n\n> **Larsonneur (1933)**\n> \n> The defendant, who\
    \ was from a foreign country (and was therefore termed an ‘alien’, in the language\
    \ of the time), had been ordered to leave the United Kingdom. She decided to go\
    \ to"
