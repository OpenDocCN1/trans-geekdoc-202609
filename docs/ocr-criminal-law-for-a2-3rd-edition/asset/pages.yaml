    Enters a building or part of a building as a trespasser. | Having entered a building
    or part of a building as a trespasser.

    With intent to: | • Steals or attempts to steal, or

    • steal | • inflicts or attempts to inflict grievous bodily harm.

    inflict grievous bodily harm

    • do unlawful damage.


