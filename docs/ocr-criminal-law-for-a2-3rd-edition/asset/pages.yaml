  md: 'A more modern example is DPP v K (1990).


    # DPP v K (1990)


    D was a 15-year-old schoolboy who took sulphuric acid without permission from
    his science lesson, to try its reaction on some toilet paper. While he was in
    the toilet he heard footsteps in the corridor, panicked and put the acid into
    a hot-air hand drier to hide it. He returned to his class intending to remove
    the acid later. Before he could do so another pupil used the drier and was sprayed
    by the acid. D was charged with assault occasioning actual bodily harm (s 47).
    The magistrates acquitted him because he said he had not intended to hurt anyone
    (see section 9.2.3 for the mens rea of s 47). The prosecution appealed, by way
    of case stated, to the Queen’s Bench Divisional Court which held that a common
    assault (which includes both an assault and a battery) could be committed by an
    indirect act.


    # DPP v Santa-Bermudez (2003)


    In this case a policewoman, before searching D’s pockets, asked him if he had
    any needles or other sharp objects on him. D said ‘no’, but when the police officer
    put her hand in his pocket she was injured by a needle which caused bleeding.
    The Divisional Court held that the defendant’s failure to tell her of the needle
    could amount to the actus reus for the purposes of an assault causing actual bodily
    harm.


    Another example of indirect force occurred in Haystead v Chief Constable of Derbyshire
    (2000) where the defendant caused a small child to fall to the floor by punching
    the woman holding the child. The defendant was found guilty because he was reckless
    as to whether or not his acts would injure the child. It is worth noting that,
    in this case, the conviction could also be justified by the principle of transferred
    malice.


    # Omissions


    Criminal liability can arise by way of an omission, but only if the defendant
    is under a duty to act. Such a duty can arise out of a contract, a relationship,
    from the assumption of care for another or from the creation of a dangerous situation.
    As the actus reus of battery is the application of unlawful force it is difficult
    to think how examples could arise under these duty situations, but there has been
    one reported case, DPP v Santa-Bermudez (2003).


    Other scenarios which could make a defendant liable by way of omission are where
    the defendant has created a dangerous situation which may lead to force being
    applied to the victim. This can be seen by analogy with Miller (1983) where D
    accidentally set fire to his mattress but failed to do anything to prevent damage
    to the building in which he was sleeping. He was convicted of arson.


    No other person was involved, but if there had been someone else asleep in the
    room and Miller had failed to wake them and warn them of the danger, then he could
    have been liable for a battery if there had been any problem. For example, if
    the person was hit by plaster falling from the ceiling as a result of the fire,
    then there appears to be no reason why Miller could not have been charged with
    battery of that person.


    # Unlawful force


    For a battery to be committed, the force must be unlawful. If the victim gives
    genuine consent to it then the force may be lawful. (See section 9.8 for further
    information on consent as a defence.) Force may also be lawful where it is used
    in self-defence or prevention of crime. This can only be so if the force used
    is reasonable in the situation as the defendant believed it to be (see section
    9.7 for'
