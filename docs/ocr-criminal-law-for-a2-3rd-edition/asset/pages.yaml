  md: "| Level of *mens rea* | Explanation | Case/example |\n|---|---|---|\n| Intention\
    \ (specific intent) | A decision to bring about, in so far as it lies within the\
    \ accused's power, the prohibited consequence, no matter whether the accused desired\
    \ that consequence of his act or not. | *Mohan* (1975) |\n| Recklessness (basic\
    \ intent) | The defendant must realise that there is a risk of the consequences\
    \ occurring and decide to take that risk. | *Cunningham* (1957) |\n| Negligence\
    \ | A failure to meet the standards of the reasonable man. | *Adomako* (1994)\
    \ |\n| Knowledge | D must have knowledge of a certain fact in order to be guilty.\
    \ | *Sweet v Parsley* (1969) |\n\nFigure 3.3 Key facts chart on levels of *mens\
    \ rea*\n\n# 3.5 Transferred malice\n\nThis is the principle that the defendant\
    \ can be guilty if he intended to commit a similar crime but against a different\
    \ victim. An example is aiming a blow at one person with the necessary *mens rea*\
    \ for an assault causing actual bodily harm, but actually hitting another person.\
    \ This occurred in *Latimer* (1886).\n\n> **Latimer (1866)**\n> \n> D aimed a\
    \ blow with a belt at a man in a pub because that man had attacked him. The belt\
    \ bounced off the man and struck a woman in the face. Latimer was guilty of an\
    \ assault against the woman, although he had not meant to hit her.\n\nHowever,\
    \ where the *mens rea* is for a completely different type of offence, then the\
    \ defendant may not be guilty. This was the situation in *Pembliton* (1874), where\
    \ the defendant threw a stone, intending it to hit people with whom he had been\
    \ fighting. The stone hit and broke a window.\n\nIntention to hit people could\
    \ not be transferred to the window.\n\nThe doctrine of transferred malice was\
    \ confirmed in an *obiter* statement by the House of Lords in the case of *Attorney\
    \ General's Reference (No 3 of 1994)* (1997). (See section 6.2.2 for details of\
    \ the case.)\n\n# 3.5.1 General malice\n\nIn some cases the defendant may not\
    \ have a specific victim in mind: for example, a terrorist who plants a bomb in\
    \ a pub, intending to kill or injure anyone who happens to be there. In this case\
    \ the defendant’s *mens rea* is held to apply to the actual victim.\n\n# 3.6 Coincidence\
    \ of *actus reus* and *mens rea*\n\nIn order for an offence to take place, both\
    \ the *actus reus* and the *mens rea* must be present at the same time. For example,\
    \ if you decide to go round to your next-door neighbour, intending to assault\
    \ them, but when you get to their house you change your mind and do not actually\
    \ assault"
