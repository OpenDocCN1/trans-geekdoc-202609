- pgno: 62
  md: '+   - Parliament can provide a ‘due diligence’ defence where this is thought
    to be appropriate.

    +   - Lack of blameworthiness can be taken into account when sentencing.


    +   - there is no evidence that it improves standards

    +   - the imposition of strict liability is contrary to human rights

    +   - some strict liability offences carry a social stigma.


    As there is no need to prove mens rea, it is clear that enforcement of the law
    is more straightforward. In addition, rather than prosecute for minor regulatory
    breaches, the Health and Safety Executive and local Trading Standards officers
    are more likely to serve improvement notices or prohibition notices in the first
    instance. This can help to ensure that the law is complied with, without the need
    for a court hearing. When a case is taken to court, the fact that only the act
    has to be proved saves time and also leads to many ‘guilty’ pleas.


    # Liable even though not blameworthy


    The main argument against strict liability is that it imposes guilt on people
    who are not blameworthy in any way. Even those who have taken all possible care
    will be found guilty and can be punished.


    The use of a ‘due diligence’ defence (or a ‘no negligence’ defence) can soften
    the law on strict liability. In many instances Parliament provides such a defence
    in the statute creating the offence. If the inclusion of such defences was done
    in a consistent way, then many of the objectors to the imposition of strict liability
    would be satisfied.


    This happened in the case of Harrow LBC v Shah and Shah (1999) where the defendants
    had done their best to prevent sales of lottery tickets to anyone under the age
    of 16. Another case where all possible care had been taken was Callow v Tillstone
    (1900). In this case even the use of an expert (a vet) was insufficient to avoid
    liability.


    However, the use of ‘due diligence’ clauses in Acts often seems haphazard. For
    example, in Harrow LBC v Shah and Shah (1999) the relevant section allowed a ‘due
    diligence’ defence for promoters of the lottery but not for those managing a business
    in which lottery tickets were sold (see section 4.3.2).


    # Guilty even though unaware of risk


    The final justification for strict liability is that allowances for levels of
    blameworthiness can be made in sentencing. A judge can pass a very lenient sentence
    where he feels that the defendant’s level of blameworthiness was low.


    Strict liability may be imposed even though the defendant was unaware of any risks.


    # 4.7.4 Arguments against strict liability


    In Environment Agency v Empress Car Co (Abertillery) Ltd (1998) the House of Lords
    considered the word ‘cause’ in an Act where there was strict liability. They held
    that a defendant could only escape liability if he could show that the occurrence
    arising from the operations of his business was ‘abnormal and extraordinary’ rather
    than a normal fact of life.


    Although there are sound justifications for imposing strict liability, there are
    equally persuasive arguments against its use. The arguments against strict liability
    include:


    At first sight this seems to allow a defence for defendants who had no knowledge
    of the possibility that the event might happen. However, the Law Lords went on
    to say that even though it was not foreseeable that it would happen to the particular
    defendant or take the particular form, a defendant would be liable if the matter
    was one of ordinary occurrence.


    +   - it imposes liability on people who are not blameworthy

    +   - those who are unaware of risks may be guilty


    So defendants can be guilty of a happening caused by a risk of which they were
    unaware. An example of this was seen in Environment Agency v Brook plc (1998).'
