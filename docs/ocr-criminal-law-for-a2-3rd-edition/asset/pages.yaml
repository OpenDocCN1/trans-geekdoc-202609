- pgno: 91
  md: '# Chapter 7


    # Voluntary manslaughter


    There are three special defences to a charge of murder. These are where the killing
    occurs when the defendant is under:


    +   - diminished responsibility;

    +   - loss of control; or

    +   - suicide pact.


    Diminished responsibility and suicide pact are set out in the Homicide Act 1957.
    Loss of control is set out in the Coroners and Justice Act 2009. These defences
    are available only to murder. They are also only partial defences, which means
    that the defendant is not completely acquitted. Instead, when one of these defences
    is successful, the offence of murder is reduced to manslaughter.


    This is important because it means that the judge has discretion in the sentence
    which he imposes. When a person is found guilty of murder, the judge has to pass
    a sentence of life imprisonment. However, for manslaughter the judge can give
    a lesser sentence where suitable. This means that if the defendant is dangerous
    and his mental problems cannot be treated, then the judge may pass a sentence
    of life imprisonment as happened in *Byrne* (1960) (see section 2.1.2). However,
    if the defendant is not dangerous then he or she may be given a relatively short
    term of imprisonment or even a community sentence. If the defendant has mental
    problems which can be treated, then the most suitable sentence is one which orders
    the defendant to have treatment either in hospital or in the community.


    For the OCR specification you only need to study diminished responsibility and
    loss of control as defences to murder. Suicide pact is not on the specification.'
