    However, it will depend on all the circumstances. For example, in Light (1857)
    the defendant raised a sword above the head of his wife and said, ‘Were it not
    for the bloody policeman outside, I would split your head open.’ It was held that
    this was an assault. The wife feared that force was going to be used on her and
    the words in the circumstances were not enough to negate that fear.


    Fear of any unwanted touching is sufficient: the force or unlawful personal violence
    which is feared need not be serious.


    There are many examples of assault:


    +   - raising a fist as though about to hit the victim

    +   - throwing a stone at the victim which just misses

    +   - pointing a loaded gun at someone within range

    +   - making a threat by saying ‘I am going to hit you’.


    # Unlawfulness of the force


    The force which is threatened must be unlawful. If it is lawful, there is no offence
    of common assault. Whether force is lawful or unlawful is discussed in detail
    under the actus reus of battery in the next section.


    # 9.1.3 Actus reus of battery


    The actus reus of battery is the application of unlawful force to another person.
    Force is a slightly misleading word as it can include the slightest touching,
    as shown by the case of Collins v Wilcock (1984).


    # Collins v Wilcock (1984)


    Two police officers saw two women apparently soliciting for the purposes of prostitution.
    They asked the appellant to get into the police car for questioning but she refused
    and walked away.


    As she was not known to the police, one of the officers walked after her to try
    to find out her identity. She refused to speak to the officer and again walked
    away. The officer then took hold of her by the arm to prevent her leaving. She
    became abusive and scratched the officer’s arm. She was convicted of assaulting
    a police officer in the execution of his duty. She appealed against that conviction
    on the basis that the officer was not acting in the execution of his duty, but
    was acting unlawfully by holding her arm as the officer was not arresting her.
    The court held that the officer had committed a battery and the defendant was
    entitled to free herself.


    In this case, the court pointed out that touching a person to get his attention
    was acceptable, provided that no greater degree of physical contact was used than
    was necessary. However, physical restraint was not acceptable.


    A similar point arose in Wood v DPP (2008) where a police officer took hold of
    Wood’s arm to check his identity.


    # Wood (Fraser) v DPP (2008)


    The police had received a report that a man named Fraser had thrown an ashtray
    at another person in a public house. The ashtray had missed the person but had
    been smashed. Three police officers went to the scene. They saw a man (the appellant,
    W) who fitted the description of ‘Fraser’ leave the public house. One of the police
    officers took hold of W by the arm and asked if he was Fraser. W denied this and
    struggled, trying to pull away. At that point another officer took hold of W’s
    other arm. W was charged with assaulting two of the police officers while they
    were acting in the execution of their duty.


    The police officer who had first caught hold of W’s arm said that he had done
    this in order to'
