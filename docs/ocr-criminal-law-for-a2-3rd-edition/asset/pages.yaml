  md: 'The doors were still in the possession of the council but had been transferred
    without permission from one council property to another. The Divisional Court
    held that the question was whether he intended to treat the doors as his own,
    regardless of the rights of the council. The answer to this was yes, so the defendant
    was guilty of theft.


    # 10.5.1 Borrowing or lending


    Another difficulty with s 6 is the point at which ‘borrowing or lending’ comes
    within the definition. Normally borrowing would not be an intention to permanently
    deprive. Take the situation of a student taking a textbook from a fellow student’s
    bag in order to read one small section and then replace the book. This is clearly
    outside the scope of s 6 and cannot be considered as an intention to permanently
    deprive. But what if that student also took a photocopying card, which had a limit
    placed on its use, used it, then returned it. The photocopy card has been returned
    but it is no longer as valuable as it was. So is there an intention to permanently
    deprive so far as the card is concerned? Section 6 states that borrowing is not
    theft unless it is for a period and in circumstances making it equivalent to an
    outright taking or disposal. In Lloyd (1985) it was held that this meant borrowing
    the property and keeping it until ‘the goodness, the virtue, the practical value
    ... has gone out of the article’.


    # Lloyd (1985)


    The projectionist at a local cinema gave D a film that was showing at the cinema
    so that D could make an illegal copy. D returned the film in time for the next
    screening at the cinema. His conviction for theft was quashed because, by returning
    the film in its original state, it was not possible to prove an intention to permanently
    deprive.


    From this it appears that, in the example of the photocopy card, there would an
    intention to permanently deprive if all the value of the card had been used up,
    but if it still had a reasonable value then there is no intention to permanently
    deprive.


    # Proportion of value


    In Lloyd the film was returned undamaged so it is easy to accept that the ‘goodness,
    the virtue, the practical value’ had not gone out of it. In other situations where
    part of the value has gone, it can be difficult to decide whether the ‘goodness’
    and ‘practical value’ have gone out of an item.


    In the photocopy example, if the photocopy card had had £5 remaining when it was
    taken and £4.50 when it was returned, then the ‘goodness’ and ‘practical value’
    would probably not have gone out of it. However, if the card had only 50 pence
    remaining on it when it was returned, the ‘goodness’ and ‘practical value’ would
    probably be held to have gone out of it. It has to be a matter of proportion.


    # Conditional intent


    Another difficulty is where the defendant examines property to see if there is
    anything worth stealing. What is the position if he decides it is not worth stealing
    and returns it? This is what happened in Easom (1971). The defendant picked up
    a handbag in a cinema, rummaged through the contents and then replaced the handbag
    without having taken anything. His conviction for theft of the handbag and its
    contents was quashed. There was no evidence that the defendant had intended to
    permanently deprive the owner of the bag or items in it so he could not be guilty
    of theft. (See Section 5.3 on the point of whether a defendant in this situation
    can be guilty of attempted theft.)


    # Self-test Questions


    +   1. Give three different things which are considered ‘property’ for the purposes
    of the offence of theft.

    +   2. Give two things which are not considered ‘property’ for the purposes of
    theft.

    +   3. Give a case or example where the defendant received property under an obligation
    and so could be guilty of theft.

    +   4. What is the Ghosh test for dishonesty?'
