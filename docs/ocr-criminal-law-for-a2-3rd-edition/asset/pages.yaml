- pgno: 209
  md: '# Murder


    It was originally held in DPP for Northern Ireland v Lynch (1975) that the defence
    of duress was available to a secondary party on a charge of murder. This meant
    it was available for defendants who had participated in a murder, such as a get-away
    driver, but had not actually performed the act of killing. However in Howe (1987)
    the House of Lords ruled that the defence was not available to anyone charged
    with murder, even if they were only a secondary party and had not done the killing
    themselves.


    # Wilson (2007)


    D, who was aged 13, and his father were charged with the murder of D’s mother.
    D stated that he had helped his father with the murder because he was too frightened
    to disobey his father. The Court of Appeal held that D did not have a defence
    as the rule that duress provided no defence to murder applied however susceptible
    D might be to duress.


    # Howe (1987)


    D, with others, took part in torturing and abusing a man who was then strangled
    by one of the others. On a second occasion another man was tortured, abused and
    then strangled by D. D claimed that he took part in the killings because of threats
    to him. The trial judge ruled that duress was available to D for the first killing
    where D was only a secondary party to the killing, but that it was not available
    for the second killing where D was a principal offender, that is had carried out
    the actual killing. The Court of Appeal ruled that this was correct but the House
    of Lords held that duress was not available as a defence for either type of defendant
    on a murder charge.


    # Attempted murder


    In the case of Howe (1987) the House of Lords said they thought the defence should
    not be available on a charge of attempted murder. This was an obiter dicta statement
    and so not binding. However, in Gotts (1992) the Court of Appeal decided to follow
    this obiter statement.


    # Gotts (1992)


    D was a 16-year-old boy whose parents were separated. D was threatened with violence
    by his father unless he agreed to stab his mother. D attacked his mother but did
    not kill her. He was convicted of attempted murder. The Court of Appeal upheld
    his conviction on the basis that the defence of duress was not available to him.


    The reason why duress was held not to be a defence was explained by Lord Hailsham
    when he said in the judgment:


    > ‘I do not at all accept in relation to the defence of murder it is either good
    morals, good policy or good law to suggest … that the ordinary man of reasonable
    fortitude is not to be supposed to be capable of heroism if he is asked to take
    an innocent life rather than sacrifice his own.’


    The rule that duress cannot be a defence to murder applies even where the defendant
    is young and less able to resist pressure. This was confirmed in Wilson (2007).


    # 12.4.2 Duress by threats


    Duress by threats is where a person’s will is overborne by threats of death or
    serious injury, so that he commits an act which he would not otherwise do. So,
    where another person threatens the defendant with serious violence unless the
    defendant commits an offence, and the defendant then commits the offence, he is
    acting under duress. For example, if an armed man pointed a gun at the defendant,
    gave him a fake credit card, and ordered him to use it in a cashpoint machine
    to get money, the defendant is stealing the money but he is only doing it because
    of the threat.


    The threat of violence is directed at the defendant by another person who demands
    that the defendant commit a specific crime or else he will be shot.'
