    The first case on this issue was Dalby (1982).


    # Dalby (1982)


    D supplied a drug called Diconal which the victim then self-injected and subsequently
    died. The defendant’s conviction for manslaughter was quashed because the Court
    of Appeal held that although supplying the drug was an unlawful act, it was not
    the act of supplying which had caused the death. The injection was the cause of
    the death and, as this was a voluntary act by the victim, the chain of causation
    had been broken.


    # 8.1.3 Causing the death


    The unlawful act must cause the death. The rules on causation are the same as
    for murder and are set out in Chapter 2 at section 2.3. An important point is
    that if there is an intervening act which breaks the chain of causation then the
    defendant cannot be liable for manslaughter.


    This point has caused problems in cases where the defendant has supplied V with
    an illegal drug. If the defendant also injects the drug into V, then there is
    no break in the chain of causation. This was shown in the case of Cato (1976).


    # Cato (1976)


    D and V each prepared an injection of a mix of heroin and water. They then injected
    each other. V died. By injecting V with the heroin, D had committed the unlawful
    act of administering a noxious substance to V, contrary to s 23 of the Offences
    against the Person Act 1861. As V died from the effects of the injection, D was
    convicted of unlawful act manslaughter.


    The problem has been with situations where the defendant has prepared the injection,
    handed the syringe to V, and V has then injected himself.


    However, in later cases it was suggested that the defendant could be guilty in
    similar circumstances as he was considered to have administered a noxious substance
    to V, contrary to s 23 of the Offences against the Person Act 1861. This was an
    unlawful act, and if V died the defendant could be guilty of unlawful act manslaughter.
    This idea was criticised and was not followed in all cases, thus causing confusion
    in the law.


    The debate was finally settled in Kennedy (2007) when the House of Lords ruled
    that there was no unlawful act by the defendant under s 23. The defendant did
    not administer the noxious substance by filling a syringe and handing it to V.
    The act of self-injection was a voluntary intervening act by V which broke the
    chain of causation.


