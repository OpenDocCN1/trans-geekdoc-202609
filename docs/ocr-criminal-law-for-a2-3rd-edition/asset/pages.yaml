  img_proc: true
- pgno: 193
  md: 'Where the defendant knows the nature and quality of the act he still can use
    the defence of insanity if he does not know that what he did was wrong. Wrong,
    in this sense, means legally wrong not morally wrong. If the defendant knows the
    nature and quality of the act and that it is legally wrong, he cannot use the
    defence of insanity. This is so even if the defendant is suffering from a mental
    illness.


    # Windle (1952)


    > D’s wife constantly spoke of committing suicide. One day the defendant killed
    her by giving her 100 aspirins. He gave himself up to the police and said ‘I suppose
    they will hang me for this’. He was suffering from mental illness, but these words
    showed that he knew what he had done was legally wrong. As a result he could not
    use the defence of insanity and was found guilty of murder.


    Note that this case was in 1952 and the special defence of diminished responsibility
    to a charge of murder did not exist. That defence was only created in 1957, so
    Windle could not use it. The case of Windle was followed more recently in Johnson
    (2007).


    # Johnson (2007)


    > D forced his way into a neighbour’s flat and stabbed him. D was charged with
    wounding with intent (s 20 OAPA 1861). At his trial two psychiatrists gave evidence
    that he was suffering from paranoid schizophrenia and suffering from hallucinations.
    However, they both agreed that, despite this, D knew the nature and quality of
    his acts and that they were legally wrong. One psychiatrist was of the view that
    D did not consider that what he had done was wrong in the moral sense. The judge
    ruled that the defence of insanity was not available to D and D was convicted
    of wounding with intent.


    > The Court of Appeal upheld the judge’s ruling that insanity was not available
    as D knew the nature and quality of his acts and that they were legally wrong.
    They followed the decision in Windle (1952) where the court had held that the
    word ‘wrong’ meant knowing that the act was contrary to law.


    In their judgment in Johnson, the Court of Appeal pointed out that there had been
    an Australian case in which the Australian courts had refused to follow Windle
    (1952). The view of the Australian court was that if a defendant believed his
    act to be right according to the ordinary standard of reasonable men, then he
    was entitled to be acquitted even if he knew that it was legally wrong.


    The Court of Appeal felt they were obliged to follow Windle (1952), but they did
    express the opinion that the Australian case contained ‘illuminating passages
    indicating the difficulties and internal inconsistencies which can arise from
    the application of the M’Naghten Rules if the decision in Windle is correct’.


    # 12.1.5 The special verdict


    When a defendant successfully proves insanity, then the jury must return a verdict
    of ‘not guilty by reason of insanity’. Up to 1991 the judge then had to send the
    defendant to a mental hospital regardless of the cause of the insanity or the
    offence committed. This was clearly not suitable for cases where the defendant
    suffered from diabetes, epilepsy or hardening of the arteries. So, in 1991 the
    Criminal Procedure (Insanity and Unfitness to Plead) Act was passed to extend
    the options for the judge.


    The judge can now impose:


    +   - a hospital order (with or without restrictions as to when the defendant
    may be released)

    +   - a supervision order

    +   - an absolute discharge.


    If the defendant is charged with murder then the judge must impose an indefinite
    hospital order.'
