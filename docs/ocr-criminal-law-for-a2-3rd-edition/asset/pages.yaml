  md: 'force had been used and the victim had not felt threatened. The Divisional
    Court upheld the convictions for robbery on the grounds that:


    +   - there was no need to show that the victim felt threatened; s 8 of the Theft
    Act 1968 states that robbery can be committed if the defendant ‘seeks to put any
    person in fear of being then and there subjected to force’;

    +   - there could be an implied threat of force; in this case the surrounding
    the victim by so many created an implied threat;

    +   - in any event, there was some limited force used by holding the victim’s
    arms and pushing him.


    # ''On any person''


    This means that the person threatened does not have to be the person from whom
    the theft occurs. An obvious example is an armed robber who enters a bank, seizes
    a customer and threatens to shoot that customer unless a bank official gets money
    out of the safe. This is putting a person in fear of being then and there subjected
    to force. The fact that it is not the customer’s property which is being stolen
    does not matter.


    # 11.1.3 Force immediately before or at the time of the theft


    The force must be immediately before or at the time of stealing. This raises two
    problems. First, how immediate does ‘immediately before’ have to be? Consider
    the situation where a bank official is attacked at his home by a gang in order
    to steal keys and security codes from him. The gang then drives to the bank and
    steals money. The theft has taken place an hour after the use of force. Is this
    ‘immediately before’? It would seem sensible that the gang should be convicted
    of robbery. But what if the time delay were longer, as could happen if the attack
    on the manager was on Saturday evening and the theft of the money not until 24
    hours later. Does this still come


    within ‘immediately before’? There have been no decided cases on this point. The
    second problem has come in deciding the point at which a theft is completed, so
    that the force is not ‘at the time of stealing’. This was considered in Hale (1979).


    # Hale (1979)


    The two defendants knocked on the door of a house. When a woman opened the door
    they forced their way into the house. One defendant put his hand over her mouth
    to stop her screaming while the other defendant went upstairs to see what he could
    find to take. He took a jewellery box. Before they left the house they tied up
    the householder.


    On appeal the defendants argued that the theft was complete as soon as the second
    defendant picked up the jewellery box, so the use of force in tying up the householder
    was not at the time of stealing. However, the Court of Appeal upheld their convictions.
    The Court of Appeal thought that the jury could have come to the decision that
    there was force immediately before the theft when one of the defendants put his
    hand over the householder’s mouth. In addition, the Court of Appeal thought that
    the tying up of the householder could also be force for the purpose of robbery,
    as they held the theft was still on-going.


    The decision in Hale was followed in Lockley (1995).


    # Lockley (1995)


    D was caught shoplifting cans of beer from an off-licence. He used force on the
    shopkeeper who tried to stop him from escaping. D appealed on the basis that the
    theft was complete when he used the force, but the Court of Appeal followed the
    decision in Hale (1979) and upheld his conviction for robbery.'
