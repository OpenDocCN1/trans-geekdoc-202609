  md: '# OCR Criminal Law for A2


    Published in partnership with OCR, *OCR Criminal Law for A2* is the textbook for
    you if you are taking the Criminal Law option on the OCR A2 Law specification.
    The book is a comprehensive, authoritative and accessible guide to the option.


    This new edition is fully updated with important changes to the law including
    the Coroners and Justice Act 2009.


    # Key features:


    +   - Self-test questions in each chapter

    +   - Examination practice and questions from past papers

    +   - Scenarios and case studies to illustrate the law

    +   - Endorsed by OCR for use with the OCR A2 Law specification.


    ![](img/cc718e8d30bf7e5c8ed3badf83078451_259_0.png)


    Jacqueline Martin LLM is the leading author in this field. Her A Level Law books,
    including *OCR Law for AS* and *The English Legal System*, have helped hundreds
    of thousands of students to pass the exams. Jacqueline was chief examiner for
    a major awarding body, has ten years’ experience as a practising barrister and
    has taught law at all levels.


    Sue Teal LLB is chief examiner for a major awarding body.


    ![](img/cc718e8d30bf7e5c8ed3badf83078451_259_1.png)


    OCR and Hodder Education are working together to provide better support for you.


    HODDER EDUCATION

    www.hoddereducation.co.uk'
