  md: '# Actual bodily harm


    The Crown Prosecution charging guidelines state that the following injuries should
    normally be prosecuted under s 47:


    +   - loss or breaking of tooth or teeth

    +   - temporary loss of sensory functions, which may include loss of consciousness

    +   - extensive or multiple bruising

    +   - displaced broken nose

    +   - minor fractures

    +   - minor, but not merely superficial, cuts of a sort probably requiring medical
    treatment (eg stitches)

    +   - psychiatric injury that is more than mere emotions such as fear, distress
    or panic.


    +   - compound fractures, broken cheekbone, jaw, ribs, etc

    +   - injuries which cause substantial loss of blood, usually necessitating a
    transfusion

    +   - injuries resulting in lengthy treatment or incapacity

    +   - psychiatric injury. As with assault occasioning actual bodily harm, appropriate
    expert evidence is essential to prove the injury.


    The full charging standards can be found on the Internet at www.cps.gov.uk/legal.


    # Grievous bodily harm


    The Crown Prosecution charging guidelines stress that grievous bodily harm means
    serious bodily harm and it is for the jury to decide whether the harm is serious.
    However, examples of what would usually amount to serious harm include:


    +   - injury resulting in permanent disability or permanent loss of sensory function

    +   - injury which results in more than minor permanent, visible disfigurement;
    broken or displaced limbs or bones, including fractured skull


    # 9.6 The need for reform of the law on assault


    This area of the law is in need of reform. In past years recommendations for reform
    have been made both by the Criminal Law Revision Committee and the Law Commission.
    In 1998, the Government published their own proposals for reforming the law, but
    these were never made law.


    In 2011 the Law Commission announced in its Eleventh Programme that it was going
    to review this area of law again and make new proposals for reform. In this Eleventh
    Programme the Law Commission briefly pointed out some of the main problems with
    the 1861 Act. These included:


    +   - the Act is widely recognised as being out of date


    # Activity


    Explain in each of the situations below, what type of offence may have been committed.


    +   1. In a football match Billy is kicked by Rio as Rio tries to get control
