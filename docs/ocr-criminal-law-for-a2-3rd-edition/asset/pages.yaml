- pgno: 195
  md: '**Key facts**


    | Definition | Law | Case |

    |---|---|---|

    | **Definition** | D must be labouring under a defect of reason, from disease
    of the mind;<br>and<br>must either not know the nature and quality of the act
    he was doing, or not know he was doing wrong. | *M’Naghten (1843)* |

    | **Defect of reason** | D’s powers of reasoning must be impaired.<br>Absent-mindedness
    is not enough. | *Clarke (1972)* |

    | **Disease of the mind** | This is a legal term NOT a medical one.<br>There must
    be an internal cause.<br>It need not be permanent; it can be ‘transient and intermittent’.<br>An
    external cause is not sufficient. | *Kemp (1956)*<br>*Sullivan (1984)*<br>*Quick
    (1973)* |

    | **Not know nature and quality of act**<br>**OR**<br>**Not know he is doing wrong**
    | This means that D must not know it is legally wrong: if he does he cannot rely
    on the defence of insanity. | *Windle (1952)*<br>*Johnson (2007)* |

    | **Special verdict** | Not guilty by reason of insanity.<br>Judge can impose:<br>-
    a hospital order<br>- a guardianship order<br>- a supervision and treatment order<br>-
    an absolute discharge. | Criminal Procedure (Insanity and Unfitness to Plead)
    Act 1991 |


    Figure 12.2 Key facts chart on insanity


    # Social stigma


    Even the use of the word ‘insanity’ is unfortunate. It carries a social stigma.
    It is bad enough to apply it to people who are suffering from mental disorders,
    but it is entirely inappropriate to apply it to those suffering from such diseases
    as epilepsy or diabetes.


    There is also the point that the jury is required to decide if the defendant is
    insane or not. This is not an appropriate function for a jury. It is a matter
    which should be decided by medical experts. Where there is dispute, the jury has
    to listen to medical evidence and try to understand technical and complex psychiatric
    issues.


    # Proof of insanity


    The defendant has to prove that he is insane. This places the burden of proof
    on him. It is possible that this is in breach of Article 6 of the European Convention
    on Human Rights, which states that the defendant is innocent until proven guilty.


    # The role of the jury


    As jurors have to decide if the verdict should be not guilty by reason of insanity,
    it means that ordinary people with no medical knowledge have to make what is,
    in effect, a medical decision. This means there is potential for jurors to be
    confused over the medical evidence due to the technical terminology of psychiatric
    medicine.'
