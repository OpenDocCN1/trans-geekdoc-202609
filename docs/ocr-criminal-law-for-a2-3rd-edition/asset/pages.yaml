  md: '# Chapter 12


    # Defences


    When a person is charged with an offence, there are various defences that may
    be available to them. Some defences can be used for any offence; other defences
    can only be used for some offences. Normally, if a defence is used successfully
    the defendant is acquitted of the crime and is free. The exception to this is
    the defence of insanity where a special verdict of ‘not guilty by reason of insanity’
    is given.


    There are several defences available. Figure 12.1 (on the next page) shows these,
    and the limitations on when the defences can be used.


    # 12.1 Insanity


    # 12.1.1 The M''Naghten Rules


    The rules on insanity are based on the M''Naghten Rules (1843).


    M''Naghten (1843)


    D suffered from extreme paranoia. He thought he was being persecuted by the ‘Tories’
    (the then Government). He tried to kill a member of the Government, Sir Robert
    Peel, but instead killed his secretary. Because of his mental state D was found
    not guilty of murder. In fact, he was committed to a mental hospital because of
    his mental state, but this was not as a result of the verdict. The fact that he
    could be found not guilty and need not have been sent to a mental hospital caused
    a public outcry, leading the judges in the House of Lords to answer a series of
    questions in order to clarify the law in respect of insanity.


    guilty and need not have been sent to a mental hospital caused a public outcry,
    leading the judges in the House of Lords to answer a series of questions in order
    to clarify the law in respect of insanity. The answers to those questions have
    created the rules on insanity which are used in legal cases today.


    The answer that the House of Lords gave in the case of M''Naghten (1843) created
    the rules on insanity. The main rule is that:


    > ‘in all cases every man is presumed to be sane and to possess a sufficient degree
    of reason to be responsible for his crimes’.


    For the defence of insanity to be established, the House of Lords gave the following
    definition showing what a defendant must prove at the time of committing the act
    if the defence of insanity is to be successful.'
