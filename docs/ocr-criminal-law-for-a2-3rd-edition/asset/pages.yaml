  md: 'in *Brown* the Court of Appeal discarded the ‘substantial’ element of entry
    and ruled that *Brown* was guilty of burglary as his entry was ‘effective’.


    In the case of *Ryan* even the need for the entry to be ‘effective’ was abandoned.
    Ryan’s conviction was upheld on the basis that there was evidence on which the
    jury could find that the defendant had entered the house.


    The decisions in these cases are inconsistent and leave the law uncertain. The
    problems might have been avoided if the Theft Act had given a definition of ‘entry’.


    # Building


    Generally the meaning of building has not caused problems in cases. There are
    only a few instances where it has been difficult to decide if the place the defendant
    has entered is a building or not.


    The main problems have come where the place was not originally intended as a building
    but its use has become that of a building. This was seen in the cases of *B and
    S v Leathley* (1979) and *Norfolk Constabulary v Seeking and Gould* (1986). It
    appears from these two cases that it will depend on the exact facts of the case
    as to whether the court will take the view that the place is a building or not.
    Again, this leaves the law uncertain.


    # Part of a building


    The Act included this phrase as it is clear that there are many situations when
    a defendant can be lawfully in one part of a building, but not in another part.
    There is no problem with most of the situations that can arise: for example, a
    resident in a block of flats entering a neighbouring flat and stealing property
    from there, or someone entering a room clearly marked ‘private’ or ‘staff only’.


    The only case in which the decision can be criticised is *Walkington*. This extended
    ‘part of a building’ to include an area which had a counter around three sides
    but was open on one side. There were no walls or partitions clearly separating
    the place out from the rest of the


    store floor area. The argument was that it was sufficiently clearly defined by
    the counter and that the counter area was intended only for staff use.


    The problem arose because, as the till was empty, the defendant did not actually
    steal anything. This meant he could not be charged with theft. Also, at the time,
    the law was that it was impossible to be guilty of attempted theft if there was
    nothing to steal.


    So Walkington at that time could not have been guilty of attempted theft either.
    This meant that unless he could be charged with burglary he would have not been
    guilty of any offence. However, the law on attempts has been changed by the Criminal
    Attempts Act 1981 and Walkington’s actions would now constitute attempted theft.
    So this decision is really irrelevant today as there is another and, arguably,
    more accurate offence with which someone could now be charged.


    # Trespasser


    The original use of the word ‘trespasser’ in law comes from the civil law. When
    the Theft Act was first passed, it was assumed that the meaning of ‘trespasser’
    would be the same as in the civil law. This is that trespass is entry without
    the consent of the lawful occupier of the building.


    However, in *Collins* the Court of Appeal made it clear that more than this is
    required. The defendant must enter ‘knowing he was a trespasser or was reckless
    as to whether or not he was entering the premises of another without the other
    party’s consent’.


    This element of knowledge of trespassing or being reckless as to whether he is
    a trespasser is important in the criminal law. It is part of the *mens rea* of
    the offence of burglary.


    The main problems on the issue of ‘trespasser’ come where the defendant has gone
    beyond the permission he was given to enter the building.


    # Going beyond permission


    Another area of the law on burglary which can be criticised is where judges have
    decided that a person who is not a trespasser can become'
