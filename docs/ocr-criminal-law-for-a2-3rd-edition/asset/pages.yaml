  md: "if the jury thinks it is not dishonest, then the defendant will be found not\
    \ guilty even though he may have thought he was being (and intended to be) dishonest.\n\
    \nThe points above were emphasised by Professor Griew in an article he wrote in\
    \ 1985. He put forward several problems with the definition of theft following\
    \ the decision in *Ghosh*. As well as the points above he also pointed out that:\n\
    \n+   - the *Ghosh* test leads to longer and more difficult trials\n+   - the\
    \ idea of standards of ordinary reasonable and honest people is a fiction\n+ \
    \  - the *Ghosh* test is unsuitable in specialised cases.\n\n# Longer trials\n\
    \nThe complicated nature of the *Ghosh* test means that trials take longer. The\
    \ jury has first to decide if the defendant’s behaviour is dishonest according\
    \ to the ordinary standards of reasonable and honest people. This is not always\
    \ a straightforward matter.\n\nThen they have to decide if the defendant realised\
    \ that what he was doing was dishonest by those standards. This is another difficult\
    \ point as evidence of a state of mind is not easy to prove.\n\nGriew also thought\
    \ that the nature of the test meant that more defendants might decide to plead\
    \ not guilty in the hope that a jury would decide their behaviour was not dishonest.\n\
    \n# Fiction of community standards\n\nGriew points out that using a test of ordinary\
    \ standards of reasonable and honest people assumes that there is a common standard.\
    \ In fact society is very diverse and different sections of the community may\
    \ well have slightly varying standards.\n\nGriew’s view is supported by the Law\
    \ Commission in their report on the law of fraud in 2002 when they said:\n\n>\
    \ > There is some evidence that people’s moral standards are surprisingly varied.\n\
    \nThis creates problems when the jury have to decide on the ordinary standards.\
    \ The jurors are likely to come from different backgrounds with different experiences\
    \ of life. They can also vary in age from 18 to 70. All these factors may mean\
    \ that the jury disagree on what the ordinary standards are.\n\nThe problems of\
    \ applying the *Ghosh* test of dishonesty were shown in the case of *DPP v Gohill\
    \ and another* (2007).\n\n> ### DPP v Gohill and another (2007)\n> \n> The defendants\
    \ were manager and assistant manager of an outlet hiring plant and equipment to\
    \ customers. Ds had allowed some customers to borrow equipment for periods of\
    \ less than two hours without charge. These hirings were recorded by Ds on the\
    \ computer. However, when the customer returned the item within two hours, Ds\
    \ had either recorded that it had been returned as faulty or incorrectly chosen\
    \ (for which no charge was made under the company’s rules) or, in some cases,\
    \ Ds altered the computer records to show that the item had only been reserved\
    \ and not actually borrowed.\n> \n> Ds stated that they regarded this as good\
    \ customer service which kept customers who frequently hired happy. It was not\
    \ done for personal gain and they did not ask for any money for doing this. Sometimes\
    \ the customer would tip them £5 or £10 but at other times they were not given\
    \ any money by the customer.\n> \n> The magistrates acquitted Ds of theft and\
    \ false accounting on the basis stating that they\n> \n> > ‘were not satisfied\
    \ beyond reasonable doubt that by the ordinary standards of reasonable and honest\
    \ people the Ds had acted dishonestly’.\n> \n> The Divisional Court allowed the\
    \ prosecution’s appeal against the acquittal. The court held that the behaviour\
    \ of the Ds was dishonest by the ordinary standards of reasonable and honest people\
    \ and they sent the case back for retrial by a new bench of magistrates."
