    \ He opens it. It contains a £10 note and some coins. There is no name or other\
    \ identification in it. Roland decides to keep the money as he does not think\
    \ he can find the owner.\n+   \n+   2. Venus comes from a country where property\
    \ placed outside a shop is meant for people to take free of charge. She sees a\
    \ rack of clothes on the pavement outside a shop and takes a pair of jeans from\
    \ it.\n+   \n+   3. Natalie is given a Christmas bonus in a sealed envelope. She\
    \ has been told by her boss that the bonus would be £50. When she gets home and\
    \ opens the envelope she finds there is £60 in it. She thinks her employer decided\
    \ to be more generous and so keeps the money. Would your answer be different if:\n\
    +      - Natalie realised there had been a mistake but did not return the money,\
    \ or\n+      - the amount in the envelope was £200?\n+   \n+   4. Errol is given\
    \ permission by his employer to borrow some decorative lights for use at a party.\
    \ Errol also takes some candles without asking permission. When putting up the\
    \ lights Errol smashes one of them. He lights two of the candles so that by the\
    \ end of the evening they are partly burnt down. One of the guests admires the\
    \ remaining lights and asks if he can have them to use at a disco at the weekend.\
    \ Errol agrees to let him take the lights.\n+   \n+   5. John is late for work\
    \ one day, so he takes his neighbour’s bicycle to get to work on time. His neighbour\
    \ is away, but John has used the bicycle on previous occasions. He intends returning\
    \ it that evening when he comes home from work. John parks the bicycle at the\
    \ back of the shop where he works. When he leaves work in the evening he finds\
    \ that the lamp and the pump have been taken from the bicycle and it has been\
    \ damaged. He is frightened to return the bicycle in this state so he throws it\
    \ into the local canal.\n\n# 10.6 Problems in the law of theft\n\nWhen the Theft\
    \ Act 1968 was passed, the definition of ‘theft’ was meant to be in simple everyday\
    \ language that ordinary people could understand. However, there have been some\
    \ case decisions on the elements of theft which make it more difficult to understand\
    \ the law. The main problems with each element are discussed below.\n\n# 10.6.1\
    \ Appropriation\n\nThere are a number of problems with the concept of appropriation\
    \ in the law of theft. These include:\n\n+   - the width of the acts which can\
    \ be considered as appropriation\n+   - the problem of appropriation being regarded\
    \ as occurring at one point in time\n+   - the implication of the one-point concept\
