- pgno: 93
  md: 'In Byrne (1960) the appeal court said that the question of whether the impairment
    was substantial was one of degree and that it was for the jury to decide.


    In Lloyd (1967) it was held that substantial does not mean total, nor does it
    mean trivial or minimal. It is something in between and it is for the jury to
    decide if the defendant’s mental responsibility is impaired and, if so, whether
    it is substantially impaired. However, as it is a question of fact, the judge
    can withdraw the point from the jury if there is no evidence on which a reasonable
    jury could conclude that the defendant’s mental responsibility was substantially
    impaired.


    As the phrase ‘substantially impaired’ remains in the new definition, then the
    decisions in these cases are likely to be followed for the new definition.


    # 7.1.5 What must be substantially impaired?


    The defendant’s ability to do one of three things must be substantially impaired.
    These things are set out in s 2(1A) of the Homicide Act 1957. They are:


    +   - to understand the nature of his conduct;

    +   - to form a rational judgement;

    +   - to exercise self-control.


    These three points were used in the case of Byrne (1960) (See 7.1.2 for details
    of the case.) In the judgment in that case the court said that ‘abnormality of
    mind’ (the then test for diminished responsibility) was wide enough:


    > ‘to cover the mind’s activities in all its aspects, not only the perception
    of physical acts and matters, and the ability to form a rational judgment as to
    whether an act is right or wrong, but also the ability to exercise will power
    to control physical acts in accordance with that rational judgement.’


    The amendments to the definition made by the Coroners and Justice Act 2009 have
    effectively put the decision in Byrne into statutory form. So what does each of
    these three things mean?


    # Ability to understand the nature of his conduct


    This covers situations such as where D is in an automatic state and does not know
    what he is doing. It also covers where D suffers from delusions and believes,
    for example, that he is killing the devil when in fact he is killing a person.
    In this situation he does not understand the nature of what he is doing.


    It could also cover people with severe learning difficulties whose mental age
    is so low that they do not understand the nature of what they are doing.


    # Ability to form a rational judgement


    Even if D does know the nature of his conduct, he may not be able to form a rational
    judgement about his acts or omissions. Those suffering from paranoia or schizophrenia
    may well not be able to form a rational judgement. Another recognised medical
    condition where D may not be able to form a rational judgement is Battered Women’s
    Syndrome.


    # Ability to exercise self-control


    This was the situation in Byrne (1960). Byrne was a sexual psychopath. The medical
    evidence was that this condition meant he was unable to control his perverted
    desires. The defence of diminished responsibility was therefore available to him.


    # 7.1.6 Provides an explanation for D’s conduct


    In order to come within the defence of diminished responsibility, D has to prove
    that the abnormality of mental functioning provides an explanation for his acts
    and omissions in doing or being a party to the killing (s 2(1B)).


    This is a new principle of diminished responsibility introduced by the amendments
    made by the Coroners and Justice Act 2009. There must now be some causal connection
    between D’s abnormality of mental functioning and the killing.'
