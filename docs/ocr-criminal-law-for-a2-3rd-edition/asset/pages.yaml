  md: '# 8.2.2 Breach of duty causing death


    Once a duty of care has been shown to exist, it must be proved that the defendant
    was in breach of that duty of care and that this breach caused the death of the
    victim.


    Whether there is a breach of duty is a factual matter. Did the defendant negligently
    do or fail to do something? Causation is important, as it must be proved that
    the breach caused the death. The general rules on causation apply; see Chapter
    2 at section 2.3.


    # 8.2.3 Gross negligence


    The fact that a defendant has been negligent is not enough to convict him of gross
    negligence manslaughter. The negligence has to be ‘gross’. This was first explained
    in Bateman (1925) which involved negligent treatment of a patient by a doctor.


    # Bateman (1925)


    D was a doctor who attended a woman for the birth of her child at her home. During
    the childbirth, part of the woman’s uterus came away. D did not send V to hospital
    for five days, and she later died. D’s conviction was quashed on the basis that
    he had carried out the normal procedures that any competent doctor would have
    done. He had not been grossly negligent.


    In his judgment Lord Hewart said:


    > ‘The facts must be such that, in the opinion of the jury, the negligence of
    the accused went beyond a mere matter of compensation between subjects and showed
    such disregard for the life and safety of others as to amount to a crime against
    the State and conduct deserving of punishment.’


    In Adomako (1994) the House of Lords approved this test and stressed that it was
    a matter for the jury. The jury had to decide whether, having regard to the risk
    of death involved, the conduct of the defendant was so bad in all the circumstances
    as to amount, in their judgment, to a criminal act or omission.


    The jury has to consider the seriousness of the breach of duty in all the circumstances
    in which the defendant was placed when it occurred. In Adomako Lord Mackay said:


    > ‘The jury will have to consider whether the extent to which the defendant’s
    conduct departed from the proper standard of care incumbent upon him, involving
    as it must have done a risk of death to the patient, was such that it should be
    judged as criminal.’


    There have been criticisms of these tests because it is left to individual jury
    panels to decide the appropriate standard for ‘gross’ negligence. This may lead
    to inconsistent decisions in similar cases. There is also little guidance on what
    should be considered as ‘gross’ negligence.


    # Risk of death


    In Adomako (1994) it was not totally clear whether there has to be a risk of death
    through the defendant’s conduct or whether the risk need only be to ‘heath and
    welfare’ of the victim. In Stone and Dobinson (1977), where the defendants had
    undertaken the care of Stone’s sister, the test was expressed as the risk being
    to the ‘heath and welfare’ of the sister who died. When Lord Mackay gave judgment
    in Adomako, he approved this way of explaining the matter. However, Lord Mackay
    also approved the test in Bateman (1925) where the test is ‘disregard for the
    life and safety of others’. In addition, Lord Mackay specifically mentioned ‘a
    risk of death’ on two occasions in his judgment.


    The matter has now been resolved in Misra and another (2004).


    # Misra and another (2004)


    V had an operation on his knee. The two defendants were senior house doctors who
    were responsible for the post-operative care of V.'
