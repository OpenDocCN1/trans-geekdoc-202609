    Loss of control is a partial defence to a charge of murder. If it is successful,
    D will be found guilty of manslaughter instead of murder. This allows the judge
    discretion in sentencing.


    Loss of control replaced the former defence of provocation. The law is set out
    in s 54 of the Coroners and Justice Act 2009. This states:


    # Definition


    Loss of control


    ''Where a person ("D") kills or is a party to the killing of another ("V"), D
    is not to be convicted of murder if–'''
