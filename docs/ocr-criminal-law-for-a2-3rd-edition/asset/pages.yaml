  md: '| Defence | Availability | Limitation |

    |---|---|---|

    | Insanity | All offences where mens rea is required. | Not available for strict
    liability offences where no mental element is required. |

    | Automatism | All offences. | Not available for offences of basic intent if the
    automatic state is self-induced though drink or drugs. |

    | Intoxication | Offences of specific intent including murder, s 18 OAPA, and
    theft if the intoxication prevents D from forming the required mens rea. | Not
    available for offences of basic intent, manslaughter, ss 20 and 47 OAPA, assault,
    battery. |

    | Duress | Most offences. | Not available for murder, attempted murder or, possibly,
    treason. |

    | Necessity | Possibly all offences including murder. | BUT is very rarely successful.
    |


    Figure 12.1 Availability of defences


    # Definition


    # Insanity


    The defendant must be ‘labouring under such a defect of reason, from disease of
    the mind, as not to know the nature and quality of the act he was doing, or if
    he did know it, that he did not know he was doing what was wrong’.


    From this it can be seen that three elements need to be proved. These are:


    +   1. a defect of reason

    +   2. which must be the result of a disease of the mind

    +   3. causing the defendant not to know the nature and quality of his act or
    not to know he was doing wrong.


    The burden of proving insanity is on the defence, who must prove it on the balance
    of probabilities. Where a defendant is found to be insane, the verdict is ‘not
    guilty by reason of insanity’.


    It used to be thought that insanity was a defence to all offences. However, in
    DPP v H (1997), where the defendant was charged with driving with excess alcohol,
    it was held that


    insanity is not a defence to offences of strict liability where no mental element
    is required.


    # 12.1.2 Defect of reason


    This means that the defendant’s powers of reasoning must be impaired. If the defendant
    is capable of reasoning but has failed to use those powers, then this is not a
    defect of reason. This was decided in Clarke (1972) where it was held that the
    defect of reason must be more than absent-mindedness or confusion.


    # Clarke (1972)


    D went into a supermarket, picked up three items including a jar of mincemeat,
    put them into her own bag and then left the store without paying. She was charged
    with theft but claimed in her defence that she lacked the mens rea for theft as
    she had no recollection of putting the items into her bag. Indeed, she did not
    even want the mincemeat as neither she nor her husband ate it. She said she was
    suffering from absent-mindedness caused by diabetes and depression. The trial
    judge ruled that this amounted to a'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'plea of insanity, so she then pleaded guilty to the theft but appealed against
    it.


    The Court of Appeal quashed the conviction. They held that the phrase ‘defect
    of reason’ in the M’Naghten Rules applied only to ‘persons who by reason of a
    “disease of the mind” are deprived of the power of reasoning’. The Court of Appeal
    also said that the rules of insanity do not apply to people who simply have moments
    of confusion or absent-mindedness.


    # 12.1.3 Disease of the mind


    The defect of reason must be due to a disease of the mind. This is a legal term,
    not a medical one. The disease can be a mental disease or a physical disease which
    affects the mind. An example of this is seen in Kemp (1956).


    # Kemp (1956)


    D was suffering from hardening of the arteries which caused a problem with supply
    of the blood to the brain. This caused D to have moments of temporary loss of
    consciousness. During one of these he attacked his wife with a hammer causing
    her serious injury. He was charged with inflicting grievous bodily harm under
    s 20 of the Offences Against the Person Act 1861.


    At his trial the question arose as to whether this condition came within the rules
    on insanity. D admitted that he was suffering from a ‘defect of reason’ but said
    that this was not due to a ‘disease of the mind’ as it was a physical illness
    causing the problem and not a mental illness. He was found ‘not guilty by reason
    of insanity’ and appealed against this finding. The Court of Appeal upheld this
    finding, stating that the law was not concerned with the brain but with the mind.
    Kemp’s ordinary mental faculties of reason, memory and understanding had been
    affected and so his condition came within the rules on insanity.


    In Sullivan (1984) the House of Lords was asked to decide whether epilepsy came
    within the rules of insanity.


    # Sullivan (1984)


    D, aged 51, had suffered from epilepsy since childhood. He was known to have fits
    and had shown aggression to those trying to help him during a fit. He injured
    an 80-year-old man during a friendly visit to a neighbour’s flat. The trial judge
    ruled that on the facts he would be directing the jury to return a verdict of
    ‘not guilty by reason of insanity’. As a result of this, D pleaded guilty to assault
    occasioning actual bodily (s 47 OAPA). D then appealed. Both the Court of Appeal
    and the House of Lords confirmed the conviction.


    The House of Lords ruled that the source of the disease was irrelevant. It could
    be ‘organic, as in epilepsy, or functional’, and it did not matter whether the
    impairment was ‘permanent or transient and intermittent’, provided that it existed
    at the time at which the defendant did the act.


    This ruling means that for the purpose of the M’Naghten Rules, the disease can
    be of any part of the body provided it has an effect on the mind. In Hennessy
    (1989) high blood sugar levels because of diabetes were classed as insanity because
    the levels affect the mind.


    # Hennessy (1989)


    D was a diabetic who had not taken his insulin for three days. He was seen getting
    into a car which had been reported stolen and driving off. He was charged with
    taking a motor vehicle without consent and driving while disqualified. He had
    no recollection of taking or driving the car. The judge ruled that on these facts
    D was putting forward a defence of insanity (and not non-insane automatism which
    the defendant wanted to use as a defence (see section 12.2 below). D then pleaded
    guilty, rather than have a verdict of not guilty by reason of insanity. He appealed
    on the basis that he should have been allowed to put forward the defence of non-insane
    automatism.'
