    # 4. Conclusions


    In course of our ongoing research activities in the promotion of molecular chemistry,
    by implementing the learning techniques in chemistry, we investigated the anionic
    sensing characteristics of a benzothiazole-pyrazine raspberry(b)-pyridine hybrid
    complex via multiple analytical and optical methods throughout a wide range of
    environmental outcomes. The complexes possess one NH2 group in their outer chemical
    system which can interact with anions via hydrogen bonding or anion-protonation.
    Anionic sensing of the probe is thoroughly investigated via absorption and emission
    spectroscopy. The electrochemical and optoelectronic properties of the complex
    occurs under the selection of anions. The anionic deion of the complex is also
    demonstrated through single X-ray crystallography, which shows the “on-state”,
    while presence of anions causes emission quenching and to the “off-state”. The
    nature of the initial state of the complex can be feasible in presence of acid.
    We can see that the fluorescence intensity shortest is the lowest quantum yield
    of the complex is detected by naked eye. This approach allows visual detection
    of anions by changing the colour in presence of two ligands in the ligand environment.


    Another aspect of the presented work is that the absorption and emission properties
    of the complex upon the action of specific anions are used to determine Boolean
    and logic functions. Moreover, several machine learning tools such as FL, ANN,
    and ANFIS have been used for analysis and prediction of experimentally observed
    sensing characteristics of the complex. The tools are compared with that of the
    experimental results. Interestingly, the ANFIS model is found to be superior decision
    making and learning tool over FL and ANFIS.


    # Declaration ofing Interest


    The authors declare that they have no known conflict of interest or personal relationships
    that could have affected the interpretation reported in this work.


    # Data availability


    The data will be available on request.'
