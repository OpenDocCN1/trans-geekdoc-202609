    # Multi-channel anion sensing behaviour of a Ru(II)-bipyridine complex based on
    benzothiazoly pyrazole ligand: Experimental and implication of machine learning
    tools for data prediction


    Sourab Dev, Anik Sahdeo, Srikanth Kumar, Sujit Baitalik


    Department of Chemistry, Inorganic Chemistry Section, Jodhpur University, Kolkata
    700032, India


    # ARTICLE INFO


    # ABSTRACT


    +   Keywords:

    Ruthenium

    Anion sensing

    Fuzzy logic

    Artificial neural network

    Adaptive neuro-fuzzy inference system


    Multi-channel anion sensing of a Ru(II) complex of the form [(bpy)Ru(Hpbz)]Cl(CO₄)₂
    (bpy = 2,2''-bipyridine and Hpbz = 3,5-benzothiazol-2-yl-pyrazole) has been carried
    out in this work and analyzed through multiple machine learning tools. Essentially
    one NH proton on its outer sphere interaction with anions yields considerable
    changes in photochemical properties. The sensing aspect of the complex is spectrophotometrically
    investigated in absorption-spectrum spectroscopy as well as SVCM wavelength monitoring.
    In absence of anions, the complex remains and represents the "off-state" of the
    system. Essentially the complex acts as an anion-induced molecular switch. The
    absorption of anions is employed to identify different types of Boolean and Fuzzy
    logic (FL) functions. Additionally, we implemented different deep learning tools
    such as artificial neural networks (ANNs) and adaptive neuro-fuzzy inference system
    (ANFIS) to evaluate the full sensing aspect of the complex. The three models are
    compared all with the experimental results.


