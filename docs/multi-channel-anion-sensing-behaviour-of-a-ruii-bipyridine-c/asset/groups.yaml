    处的吸收作为输出。低于阈值的发射猝灭和高于阈值的吸收增强证明了 F⁻ 的影响，显示了“关闭”状态 (0) 和“开启”状态 (1)。加入输入（F⁻ 和 H⁻）后整个波长范围内发射和吸收的最大值导致了蕴含（IMPLICATION）和抑制（INHIBIT）组合的概念。


