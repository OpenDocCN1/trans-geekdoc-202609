    ## 4. 结论


    在分子化学的持续研究过程中，通过引入学习技术，我们通过多种分析和光学方法研究了苯并唑-聚嗪-吡啶杂配合物的阴离子传感特性。复合合物在其化学体系中有一个 NH2
    基团，可以通过氢键或质子化与阴离子相互作用。通过吸收和发射光谱对阴离子传感进行了深入研究。电化学和光电性质在选择阴离子时发生。阴离去离也通过单晶衍射得到证实，显示了“开启状态”，而阴离子的存在会导致猝灭并进入“关闭状态”。复合合物初始状态的性质在酸存在是可行的。我们可以看到荧光强度最短时复合合物的量子产率最低，肉眼可见。这种方法允许通过配体环境中两种配体的颜色变化来实现阴离子的视觉检测。


    本工作的另一个方面是，特定阴离子作用下复合物的吸收和发射性质被用于确定布尔和逻辑函数。此外，使用了 FL、ANN 和 ANFIS 等多种机器学习工具来分析和预测实验观察到的复合传感特性。将这些工具与实验结果进行了对比。有趣的是，ANFIS
    模型被认为是比 FL 和 ANFIS 更优的决策和学习工具。


