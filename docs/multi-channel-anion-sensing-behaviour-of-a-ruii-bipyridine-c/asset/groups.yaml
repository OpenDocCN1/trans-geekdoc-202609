    # Inorganica Chimica Acta


    期刊主页：www://www.elsevier.com/locate/ica


    研究论文


    # 基于苯并噻唑基吡唑配体的 Ru(II)-联吡啶配合物的多通道阴离子检测行为：实验研究及机器学习工具对数据预测的影响


    Sourab Dev, Anik Sahdeo, Srikanth Kumar, Sujit Baitalik


    化学系，无机化学分，焦特浦大学，加尔加答 700032，印度


    # 文章信息


    # 摘要


    - 关键词：

    - 钌

    - 阴离子检测

    - 模糊逻辑

    - 人工神经网络

    - 自适应神经模糊推理系统


    本工作开展了分子式为 [(bpy)Ru(Hpbz)]Cl(CO₄)₂（其中 bpy = 2,2''-联吡啶，Hpbz = 3,5-苯并噻唑-2-基吡唑）的
    Ru(II) 配合物的多通道阴离子检测，并通过多种机器学习工具进行了分析。本质上，该配合物外层的一个 NH 质子与阴离子的作用会导致光化学性质发生显著变化。通过吸收光谱光谱以及
    SVCM 波长监测对该配合物的检测特性进行了光谱学研究。在没有阴离子的情况下，配合物保持存在并代表系统的“关闭状态”。本质上，该配合物充当阴离子诱导的分子开关。利用阴离子的吸收来识别不同类型的布尔逻辑和模糊逻辑（FL）函数。此外，我们还实现了不同的深度学习工具，如人工神经网络（ANNs）和自适应神经模糊推理系统（ANFIS），以评估配合物的完整检测性能。将三个模型均与实验结果进行了比较。


    # 1. 引言


    能够选择性识别阴离子的受体 [24–31]。近期，研究人员致力于设计三通道阴离子传感器，其中通过观察不同的光化学性质可以观察到相互事件：可见光、颜色（吸收）和发射-电致变信号
    [32–39]。为此，我们对了一种基于吡唑并噻唑的 Ru(II) 配合物 [(bpy)Ru(Hpbz)]Cl(CO₄)₂ 进行了阴离子检测，并研究了其物理化学和电子性质
    [37–40]。然而，文献中关于用于 Ru 基阴离子传感器的 Ru(II) 多环配合物的设计和应用相对较少 [16–18, 41–44]。该设计策略提议探测吡唑
    NH 质子的配位，我们通过多种光学通道以及精细调节技术研究了配合物的检测特性。该配合物的阴离子行为。


    配合物在阴离子作用下的光谱和电化学输出也被用于模拟各种布尔


    # 实验部分


    # 2. 试剂


    溶剂和化学试剂购自默克（Merck）。[Ru(bpy)$_3$Cl$_2$]$H_2O$(75) 通过以下方法获得。吡唑-3,5-双(苯并咪唑) (Hpbzb)
    和配合物 [(bpy)$_2$Ru(Hpbzb)(ClO$_4$)$_2$] (1) 根据我们的报告进行了合成和表征 [40]。


    注意！高氯酸盐配合物具有潜在爆炸性，任何剂量的均应小心处理。


    # 2.2. 物理测量


    实验步骤中使用的仪器说明见在 ESI 中。


    # 3. 结果与讨论


    # 3.1. 合成与表征


    配体 (Hpbzb) 和 Ru(II) 配合物的合成和表征遵循我们之前报道的方法 [40]。在 0.1 M HCl 流的 MeCN-水介中进行重晶，以保持配合物中的吡唑
    NH 质子。


