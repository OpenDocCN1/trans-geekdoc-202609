    in case of basic anions (F⁻, AO⁻ and CN⁻), while the position remains almost unchanged
    after other anions. Essentially, the complex acts as sensor for F⁻ and CN⁻ which
    is due to strong hydrogen bonding. The red-shift in the MLCT bands is due to the
    presence of NH protons in acetonitrile which are deprotonated in presence of excess
    anions. In-line with the absorption spectrum, the emission remains practically
    unchanged except for the red-shift.


