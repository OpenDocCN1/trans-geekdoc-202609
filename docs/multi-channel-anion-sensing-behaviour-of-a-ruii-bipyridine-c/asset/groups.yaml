    可逆 Ru³⁺/Ru²⁺ 配合物在 E₁ = 0.2–0.94 V 处的 CV 和 SWV 轨迹，以及由于两个大基团还原而在 -1.46 V 和 -1.78
    V 处的两个逐步可逆波（图 5 (S2)）。通过逐步加入观察到氧化还原行为，变化如图 6 所示。0.94 V 处的峰电流逐渐减小，并伴随着 0.80 V 处新峰的出现；在加入
    2 当量的 F⁻ 期间，最初 0.94 V 处的新峰被 0.80 V 处的峰取代。Ru³⁺/Ru²⁺ 对的 E₁₂ 发生解耦（TBAH；图 S3）。该配合物的谱图与观察到的
    F⁻ 和 AcO'' 离子时的谱图非常相似。这表明阴离子诱导的吡唑和 NH 质子分解可能发生在配合物骨架上。


    为了证明受体与阴离子之间的相互作用，我们尝试通过将 PhCH3 扩散到过 TBAF 的 Me-MCM (2:1 v/v) 溶液中生长配合物晶。幸运的是，我们在多次尝试后成功了，配合物的结构如图
    7 所示。结构显示 F⁻ 取消 NH 质子形成配合物。带有选定键距畸变配合物角的结晶参数见表 51 和 S2 (ESSI)。


    ## 3.6. 操作


    在上一节中，我们观察到配合物和阴离子在吸收、发射光谱以及电化学行为上的巨大变化。配合物在水处理后也能保留。此外，阴离子观察到的光还原配合物的光致分解后的原始形式重建是完全可逆的，可以重复多次。在这里我们将研究连续加入阴离子后的光谱和电化学性质，用于制造多个逻辑配合物。


