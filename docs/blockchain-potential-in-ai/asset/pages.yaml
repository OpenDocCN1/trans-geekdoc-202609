    # 4.2 Blockchain-enabled machine learning model


    While machine learning systems have become powerful tools to solve real-world
    problems, people started to question its trustworthiness. First of all, machine
    learning systems might be susceptible to data poisoning attacks. The hackers might
    try to manipulate the system performance by altering the collected data or inserting
    constructed poison instances. Secondly, it is difficult for humans to understand
    decisions made by the machine learning systems if there is no traceable logs or
    training histories. Thirdly, centralized servers are still heavily required for
    completing the model training processes. Finally, the model construction stages
    are not automated and the human involvement may bring biases into the final system.
    Blockchains and smart contracts have shown great potential to solve those challenges.'
