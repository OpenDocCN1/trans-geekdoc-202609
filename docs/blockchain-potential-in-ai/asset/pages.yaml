  md: '# 2.2.2 Zero-knowledge proof and zk-SNARK


    People may wonder whether there are mechanisms that can be used by a public blockchain
    network to hide some transactions or protect one''s address from being traced.
    Zero-knowledge proof (ZKP) is a proof that allows a prover to prove the knowledge
    of a secret to a verifier without revealing it. The verifier should receive no
    knowledge before verification and after the verification [24]. This sounds unreal
    because in the real world, we gain trust in third parties through revealing our
    private messages or information such as date of birth, secret key or password.
    There is a famous story on ZKP. It was about two mathematicians who both claimed
    that they found the solution equation of a formula. However, Neither of them wanted
    to reveal it to the public. They later conducted a competition in which both drafted
    a question for their competitor and they would solve the question from each other
    by using their own method and to show their solutions. Verifiers only needed to
    check whether their solutions were correct to determine who actually found the
    solution of that formula. As a result, neither party revealed any information
    to the verifier, but the verifier still had sufficient evidence to determine who
    actually knew the solution.


    Generally speaking, ZKP has two categories, the interactive and non-interactive
    ZKPs. Interactive ZKP is more intuitive. It requires intervention between individuals
    (or computer systems) to prove their knowledge and the individual validating the
    proof. For example, the method used by the mathematician competition is based
    on interactive ZKP. Interactive ZKP already has many applications in the communication
    industry, and such a system requires a stable and continuous communication channel.
    Non-interactive proof requires none of that, it takes less time and only one message
    is enough [25]. It''s more efficient and can be optimized for IoT systems. Zero-Knowledge
    Succinct Non-Interactive Argument of Knowledge (zk-SNARK) is a type of non-interactive
    ZKP and has been used by cryptocurrency Zcash as its core privacy-preserving mechanism.
    In a nutshell, Zcash can hide some transactions to make the blockchain more privacy
    focused, and external parties will not be able to trace many accounts'' transaction
    history. However, researchers from Carnegie Mellon University found that 99.9%
    of Zcash and 30% of Monero (another privacy-preserving token) transactions were
    traceable because users may not use them properly [26, 27].


    # 3. Blockchain-enabled edge intelligence for IoT


    In this section, we introduce the potential and applications of blockchain in
    edge intelligence. To be specific, we aim at describing how AI could be implemented
    on the edge of the Internet and how blockchain could improve the mobile edge intelligence.
    We first introduce offloading strategies and the MEC architecture for readers.
    Then, we list how blockchain can improve mobile edge intelligence in terms of
    data security. Finally, we describe the blockchain-enabled resources allocation
    and market trading in the mobile edge intelligence systems with the constraints
    of energy supply, computational power, and the size of training data.


    # 3.1 Tasks offloading in Blockchain systems


    Although the PoW can secure transaction records in Bitcoin and similar blockchain
    networks, it is still very challenging to implement this kind of consensus mechanism
    for securing AI applications because it is a computational intensive task. To
    be specific, realizing blockchain-enabled AI for edge devices (i.e., edge'
