  md: '# 7.2 Bitcoin can help governments restore transparency and trust today


    Bitcoin SV stands ready to fulfill the promises of an era of blockchain reformation
    by providing complete transparency and efficiency to the public sector. Although
    government entities would only need to begin with a common Request for Information,
    traditionally, the procurement stage has long been considered one of the greatest
    barriers to connecting government technology needs with vendors who are able to
    integrate the latest emerging technologies [90]. The consequence is that many
    small firms and industry outsiders are shut out entirely from participating due
    to how complex, time consuming and costly the process can be. In contrast, a myriad
    of transformative blockchain solutions await to contribute to a more ethical society
    by improving transparency and restoring trust. Some of these are:


    **Financial Transaction Management** – As a distributed ledger, Bitcoin offers
    an accounting of valid transactions that occur within the network instantaneously.
    For a small transaction fee (.00011 per byte), transaction processors will record
    an entry onto the secure ledger. Compared to the cost of modern transaction management
    systems, Bitcoin offers unmatched savings, auditability, security, and interoperability
    with the integration of smart contracts and tokens. Example: **Tokenized** [91]


    **Regulatory Compliance** – As transactions are validated and publicly recorded
    to the Bitcoin blockchain, they are secured by an immutable Proof-of-Work. This
    allows regulators, news media and government watch-groups real-time access to
    compliance-related data that can be shared and trusted. In return, this eases
    the burden of reporting and auditing on government agencies, reducing cost and
    improving transparency. Smart contracts for government procurement opportunities
    would ensure compliance, fairness and improve the overall speed of implementation.
    Example: **nChain** [92]


    **Identity Management** - Unlike centralized government databases, Bitcoin provides
    a much more secure distributed data management platform that could empower citizens
    with the ability to easily sign and authenticate their identity for official government
    documents or benefits. This would also reduce the time and resources needed by
    the government to verify identities and protect sensitive data – especially across
    restrictive inter-agency data silos. Example: **Legally Chained** [93]


    **Registries** – The ability to manage any type of record or registry through
    Bitcoin''s unique data management network removes the overall complexity for governments
    to manage and authenticate data efficiently. This would remove the friction of
    processing land titles, company registrations as well as every other type of record
    including birth, marriage, divorce, criminal or death. The ledger would serve
    an honest, universal source of truth that can drastically reduce fraud and corruption.
    Example: **Elas Digital** [94]


    **Blockchain Voting** – As we saw during the 2020 US Presidential election cycle,
    it is important for citizens to believe in the integrity of the voting process.
    Doubt in returned results, whether due to error, fraud, hacking, corruption, or
    lack of transparency can create an atmosphere of distrust among voters. Bitcoin''s
    tamper-proof public ledger is perfectly suited to eliminate election fraud in
    the future – when combined with an identity-based token, a voter could easily
    cast their vote using any type of device removing barriers and increasing participation.
    Example: **Layer2 Technologies (B-vote)** [95]


    **Supply Chain Traceability** – The Coronavirus pandemic has demonstrated to all
    how fragile our global supply chain can be during a disruption. Government agencies
    competed to locate, purchase, and distribute medical gear, supplies and personal
    protective equipment. This created panic among the populace as medical care was
    either denied, delayed, or compromised through the reuse of protective gear. The
    lack of traceability of the supply chain continues to plague COVID-19'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'relief. As traditional government vendors begin developing vaccine distribution
    and contract tracing technologies, many citizens are concerned about how their
    personal medical data will be stored and used in the future. Bitcoin solves these
    issues by improving trust and privacy among parties that need to share valuable
    data across an entire value chain. Example: UNISOT [96], VXPass [97].


    +   • Health Care – A public health crisis like the Opioid epidemic carry a heavy
    cost on communities, taxpayers, and governments alike. Patient data is usually
    spread across various data silos and databases that do not communicate well with
    one each other. This has led to gaps in the system where licensed pharmaceutical
    prescribers were unable to verify how many concurrent prescriptions a patient
    may have access to. Bitcoin has the potential to remove these data silos and improve
    public health through patient-controlled, auditable records. Example: EHRData
    [98]


    +   • Taxation – Through Bitcoin and the power of microtransactions, government
    and business tax reporting become automated, audit friendly and extremely efficient.
    By integrating tax payment requirements into a programmable smart contract, payroll
    and other taxes become immediately available to the government allowing them secure
    payments faster, budget more accurately and decrease the risk for fraud.


    +   • Public Assistance – Smart contracts on Bitcoin can also be used to create
    programmable tokens that could be utilized for government assistance programs
    such as the Food Stamp Program. These tokens can mitigate fraudulent use and prevent
    abuse through the ability to only approve the purchase specific needs-based items.


    # 8. Blockchain and AI


    The ancient myth of AI had developed through centuries: from the Greek, to the
    Age of Enlightenment [99], to the 20th Century when it made initial progress in
    the areas of game theory and theorem proofs. The modern concept of AI began to
    take shape in the 1950s after the arrival of the new computers made possible the
    design of reasoning processes that resembled those in human behavior. In this
    context, Alan Turing''s 1950’s “Turing Test” in Computing Machinery and Intelligence
    [100] provided a key step forward with a method for determining if a machine is
    “intelligent.” Here, rather than asking whether the machine can think, the question
    changed to whether it can act as a thinker [101]. Seventy years later, AI tasks
    still struggle to reconcile the needs of sufficient representation, an effective
    and efficient decision-making mechanism that can make and execute timely decisions,
    and control.


    Immutability, accessibility, non-repudiation, and decentralization of the data
    are some of the properties that allow blockchain technology to be used in AI developments,
    such as smart-contracts. Furthermore, the integration of the blockchain with AI
    provides solutions that can resolve problems intrinsic to the blockchain: for
    instance, by reducing energy consumption [102]. AI has also proven useful to better
    blockchain and smart contracts'' security [103], for example, by helping in the
    process of code verification.


    AI''s technological capability to install cognitive capacities in machines so
    these can perform functions such as learn, interpret, and adapt, is related to
    consumed data. These data are often gathered from the users of smart telephones,
    and consumers of social media, and web applications [104]. As a result private
    and public organizations'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'collecting these data, deal with issues of information centralization, legitimacy,
    authenticity, security, and privacy. Because data are centrally managed in AI
    projects, it can potentially be hacked and tampered with [105]. However, AI is
    also a tool that provides efficient solutions to major tasks such as in the allocation
    of resources, in managing large sets of data, and in procedural and repetitive
    tasks [106]. So the combined use of blockchain and AI addresses problems related
    to centralization, and offers solutions to issues related to the optimization
    of resources [107].


    Intelligent and autonomous applications are designed to reduce human intervention
    in different types of processes; hence, their impact on individuals and societies
    raise important concerns. Harm to privacy, potential discrimination, limitation
    of citizenry choice and access to information, loss of skills, economic shocks,
    security of critical infrastructure, or long-term impacts on social well-being
    are just some of the key concerns these technological developments pose to society.
    That is the reason the development of these innovations need to be aligned with
    a set of defined values and ethical principles.


    # 9. Ethical design framework


    Given the ethical concerns these new technologies arise, a series of guidelines
    have been published by different institutions working at the crossroads of technology
    and social good. Here we will refer to those reported by the Beeck Center. [108]
    Nonetheless, others such as the IEEE Global Initiative for Ethical Considerations
    in Artificial Intelligence and Autonomous Systems [109], have also made huge efforts
    to encourage ethical considerations are prioritized when devising autonomous and
    intelligent technologies.


    Establishing the ethical approach during the earliest phases of design is key
    when using Blockchain and AI. The reason is that changes will be more difficult
    to implement in later stages, if at all possible. This framework summarizes (p.21.):


    > [] (1) give decision makers an outcome-focused and user-centric tool to assess
    the context-specific consequences and ethical implications of their blockchain
    design choices; and (2) to enable them to use this understanding to make the appropriate
    values-based design choices to achieve better social outcomes.


    > [] Ultimately, these ethical considerations traced broadly to six root issues:
    governance, identity, access, verification and authentication, ownership of data,
    and security.


    These factors are the basis for a three-phases framework. The first phase is a
    five-step process which establishes the intentionality of design with a focus
    on ethics. The second phase (p.40) is an iterative process which examines each
    design decision in light of the impacts it has on each other element of the ecosystem
    (i.e.: users, community...). The third phase (p.48), acknowledges that the context
    evolves in time and the relevance of each element changes. Hence, during this
    last phase there is a reevaluation of the first and second phases to assess significant
    changes in the environment.


    Even though the implementation of such objectives will require additional time
    and resources dedicated at the start of each project, the benefits are self-evident
    even if just considering the impact on the smart contract environment. The reason
    is that smart contracts are deployed to start working when a predefined group
    of conditions are met. That is, the contracts will be triggered by inputs such
    as external events, information system sources, or other and these processes will
    be automatically enforced by algorithms unconstrained by ethical or legal considerations.
    Thus,'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'in designing smart contracts, their impact beyond the realm of contract law
    should be analyzed. For instance, smart contracts could use ethically accepted
    rules when providing technological solutions and create models of governance through
    new social contracts. In this sense, the 2016 work of Reijers et al. [110]. analyzes
    how the modeling of blockchain governance reflects the key ideas of social contract
    theories. Their conclusions (p. 147–84) are that blockchain governance a) is justified
    by Rousseau’s argument that it provides a solution to an existing structure of
    corrupted institutions; b) being non-discriminatory it reflects Rawls’s “veil
    of ignorance,” though power-relations are expressed in the public ledger; and
    c) acts in accordance to Hobbes idea of a “totalitarian sovereign in terms of
    rule-enforcement, coupled with Rousseau’s idea of decentralized governance and
    Rawls’s idea of equal rights and liberties for all (that is, for all the nodes).
    Even though, it fails to incorporate Rousseau’s idea of the common good, and fails
    to implement conditions of distributive justice that Rawls thought to be essential
    for overcoming the initial situation.” (p.147).


    Although the blockchain is perceived as a “neutral” technology, the political
    implications of its transformative power are found as it will reconfigure economic,
    legal, institutional, and political spaces [111]. The information age promises
    great benefits from economies of scale and more efficient use of resources, but
    it also comes with a huge threatening potential to create masses of excluded individuals
    who cannot catch up with the times. Given the disconnect among different layers
    of citizens that it is likely to happen, renewed social contracts are essential
    to protect human dignity and the rights and opportunities of all [112].


    Furthermore, any changes that make our democratic processes more transparent,
    inclusive, and participatory will benefit society. This was noted by Melanie Swan
    who in her 2015 work “Blockchain: Blueprint for a new economy, [113]” assured
    this technology will ease the appearance of new kinds of governance models and
    services. As an example, she mentions an increase of granular offer by which the
    government will design more targeted services. And she also enumerates a number
    of efforts to develop systems that will increase the quality of our democracies.
    For instance, she explains David Chaum’s idea of random-sample elections [114].
    Under this system, people selected randomly are asked to vote through an election
    website that contains candidate debates and activist sentiments. In David Chaum’s
    view, because of cost reduction, many more consultative processes could be generated.
    Also, people would have time to inform themselves on whichever matter rather than
    be overwhelmed by political advertising. Furthermore, no government involvement
    would be necessary. A third idea discussed in Swan’s book, is DAS which stands
    for distributed autonomous society. This model develops the principles for consensus-based
    decentralized governance systems and for decentralized voting systems. In her
    work, Professor Swan discusses this project as a form of delegated democracy,
    where voting power is vested in representatives. An example of such service is
    provided by https://liquidfeedback.org/, a company that offers an open source
    software to help present suggestions and make decisions. This is quite a compelling
    proposal because, under this method, people can align with each other on the bases
    of specific actions rather than “ideological” theories. Furthermore, power is
    not held long. Rather, individuals are responsible for a specific project. Thus,
    if standardized, this “liquid” in Liquid Democracy, would finish with political
    forms of permanent power as they are practiced today. Two immediate effects one
    can imagine would be a redistribution of power back to the people, and an increased
    impediment to the exercise of political corruption. Albeit there are many potential
    problems with this type of proposal, i.e.: power is obtained by groups which are
    already organized or citizens that might not wish to exercise these responsibilities,
    it might in fact provide a platform for a nation-wide discussion over the responsibilities
    of individuals on a modern technologically advanced society.'
