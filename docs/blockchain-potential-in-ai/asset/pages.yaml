    # 2.1 Security feature


    # 2.1.1 Proof-of-Work (PoW Consensus Algorithm)


    PoW is the underlying consensus algorithm of Bitcoin [7]. A consensus algorithm
    in computer science is a process used to achieve agreement on a single data value
    among distributed processes or systems [8]. This term is commonly used by distributed
    systems. It explains that in the modern computing era, how multiple servers could
    work together with high levels of security and fewer errors. In more detail, some
    servers (or nodes) may fail or may be unreliable in other ways (e.g., being hacked,
    losing data, running in idle). Therefore, consensus algorithms must be fault tolerant
    and resilient. Consensus mechanisms function a bit like constitutions in the human
    world - guiding decisions about what’s acceptable among interacting parties. This
    is the core of a blockchain system. PoW is commonly recognized as a secure consensus
    algorithm [7]. It’s a consensus mechanism that heavily relies on computing power
    and cryptographic hash function (also known as CHF, a mathematical algorithm that
    maps data of arbitrary size to a bit array of a fixed size). Before diving into
    this consensus model, one needs to be familiar with the following two concepts,
    the Crash-Fault Tolerance (CFT) and the Byzantine-Fault Tolerance (BFT).


    The Crash-Fault Tolerance (CFT). Just as it states in its name, it can be resilient
    toward crash/halt events. Suppose that your system has been damaged or lost'
