    # 2.1.2 Alternative consensus mechanisms


    Due to the above drawbacks and concerns over PoW mechanisms, designers have developed
    a new consensus mechanism called Proof-of-Stake (PoS) where miners have been incentivizized
    based on how much “work (hash power)” they have contributed. In contrast, the
    PoS mechanism asks miners to bet tokens in order to participate in the new block
    generation. This concept was first discussed in 2012 by Peercoin [14, 15], and
    had later become a popular discussion and experiment among many cryptocurrencies.


    Compared with the PoW mechanism, PoS is simpler. The more you stake, the higher
    the influence you have on determining the next block [14]. The assumption is based
    on the premise that high staking nodes are less likely to lie because of high
    losses for them if they tried to tamper with the chain. Under this scenario, nodes
    are no longer needed to solve cryptographic puzzles. Apparently, compared with
    PoW, PoS is more environmentally friendly. Besides, less computation will further
    enhance the network transaction speed as well as the throughput [16]. There are
    currently two types of PoS consensus models: Chain-based Proof-of-Stake and Consortium
    Consensus model [14]. Chain-based Proof-of-Stake chooses availability over consistency
    [17]. The algorithm pseudo-randomly selects a validator during each time slot.
    Validators will then have the right to create a single block and point it back
    to the previous longest chain. Consortium Consensus Model chooses consistency
    over availability. During each voting procedure, every node counts propor-tionally
    to the stake it bets.


    Apparently, the richer nodes have higher chances of getting the reward. In order
    to avoid the monopoly situation, a random selection model is required for most
    PoS algorithms. Each token has their own token economy and some of them include
    token age design, where tokens being staked for a longer time will be more likely
    to be selected. In general, the network wants holders to stake validation tokens
    as long as possible and act as hosts.


    With rapid adoption of 5G networks by different countries and regions, edge computing
    and edge devices will play an important role in the network. Blockchain is currently
    the state-of-the-art secure network system and has many use cases in edge computing
    [18]. In the upcoming 5G era, more and more devices will have access to the network,
    since one of the main goals of 5G is to support the IoT [19, 20]. As predicted,
    data transmission rate and volume will exponentially grow and thus to have a secure
    communication channel and a consensus algorithm for edge devices have been identified
    in recent research papers. Edge devices for 5G network are often not designed
    for doing heavy computation. Thus, a new consensus model is needed for the 5G
    era. PoS as one of the successful consensus models has potential in the IoT era
    due to its simpler structure, high security feature and completely decentralized
    characteristics. Besides PoS, Delegated Proof-of-Stake'
