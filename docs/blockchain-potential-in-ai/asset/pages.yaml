- pgno: 59
  md: '# 4.2.1 Blockchain for data security


    Blockchain is known for keeping data secure and safe. With reliable and traceable
    data stored on the blockchain, the researchers can ensure that machine learning
    algorithms will produce the most trusted and credible results. Muhammad et al.
    [68] introduced a federated learning system called Biscotti. Biscotti utilizes
    blockchain and cryptographic primitives to coordinate a privacy-preserving federated
    learning process between peering clients. While all the training iterations are
    stored in the blockchain, only the peer-verified updates are committed into the
    final model. The training data are stored with the data providers locally. This
    system is able to protect the privacy of an individual client''s data as well
    as defend data poisoning attacks.


    Mugunthan et al. [69] provided a privacy-preserving federated learning system
    called BlockFlow. The system incorporates differential privacy, introduces a novel
    auditing mechanism for model contribution, and uses smart contracts to incentivize
    positive behaviors. However, the system does not have the capability to detect
    any anomalies during the learning process. To address that issue, Desai et al.
    [70] came up with another blockchain-based federated learning framework called
    BlockFLA. After the learning algorithm is deployed, the BlockFLA framework utilizes
    smart contracts to automatically detect and discourage any backdoor attacks by
    holding the responsible parties accountable. Both frameworks ensure that the machine
    learning algorithms are resilient to malicious adversaries.


    In 2018, Chen et al. [71] proposed a secure supervised machine learning system
    called LearningChain. In LearningChain, they developed a differential privacy
    mechanism for the local gradient computing process to protect the privacy of individual
    data providers, and a l-nearest aggregation scheme to defend against Byzantine
    attacks in the global gradient''s aggregation process. In the next year, Kim et
    al. [72] pointed out that the LearningChain system has several limitations such
    as low computation efficiency, zero support on non-deterministic function computations,
    and weak privacy preservation. To resolve those issues in a systematic way, they
    developed an improved distributed machine learning model for permissioned blockchains.
    With a differentially private stochastic gradient descent method and an error-based
    aggregation rule as core primitives, their model provides better defences on the
    byzantine attacks and has the capability to handle the learning algorithm with
    non-deterministic functions defined. Besides that, Zhou [73] also introduced a
    similar system called PIRATE to provide distributed machine learning algorithms
    with byzantine-resiliency but the system is designed for 5G networks.


    # 4.2.2 Blockchain for system improvement


    Blockchains and smart contracts can also be utilized to improve the machine learning
    processes and eliminate human involvements. Ouyang et al. [74] implemented a novel
    federated learning collaboration framework: Learning Markets. In the Learning
    Markets, blockchain creates a trustless environment for collaboration and transaction.
    The learning task provider simply needs to publish the initial task to the markets
    and deposit the rewards in the network. The data providers and trainers participate
    in the learning process by depositing an entrance fee, uploading/downloading the
    data on IPFS network, and contributing their computation power. Several predefined
    smart contracts serve as network agents to maintain the collaboration relationships
    and market mechanisms.


    Kim et al. [75] proposed an on-device blockchain-based Federated learning architecture
    called BlockFL. Data on user devices are processed locally and the local updates
    are accumulated on the blockchain. The global model updates are'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'calculated based on the user updates recorded on each block. Their architecture
    mainly focuses on the latency minimization and system scalability. They also indicate
    that the system may not be able to retrieve all the local model updates on time
    due to network delay or intermittent availability problems.


    Muhammad et al. [76] gave a complete list of requirements for the blockchain enabled
    federated learning framework, including penalisation, decentralization, fine-grained
    Federated Learning, incentive mechanisms, trust, activity monitoring, heterogeneity
    and context-awareness, model synchronization, and communication and bandwidth-efficiency.
    They also introduce a term called reputation (which is similar to the Proof of
    Stake) and describe how this attribute works in their proposed framework.


    Besides that, some researchers in this subsection work on designing new blockchain
    mechanisms for the distributed machine learning tasks. Felipe et al. [77] invented
    a new protocol called Proof-of-Learning, which achieves distributed consensus
    by ranking machine learning systems for a given machine learning task. The aim
    of this protocol is to mitigate the computational consumption in solving hashing-based
    puzzles and still ensure the data integrity. Toyota et al. [78] improved the common
    incentive mechanism in the current blockchain network and make it more applicable
    to the blockchain network when the machine learning tasks are involved.


    # 4.3 Combined research for real world scenarios


    Instead of proposing innovative and theoretical designs, some researchers intend
    to figure out how this combined research can be applied on some real-world problems.
    Their contribution establishes a bridge between this new research area and the
    traditional industries such as transportation, hospital management, supply chain,
    etc.


    # 4.3.1 Transportation


    Pokhrel and Choi [79] developed a mathematical framework that adapts the blockchain-based
    federated learning design into the autonomous vehicle industry. They utilize the
    consensus mechanism and a renewal reward approach to enable on-vehicle machine
    learning training in the distributed network. The on-vehicle updates and global
    models are maintained in the blockchain, which are visible to and verifiable by
    every vehicle. Rewards are distributed to the vehicle owners based on the size
    of their updates accepted into the global model. They also discussed the limitations
    of this design and the performance of the system based on the simulations and
    numerical analysis.


    Hua et al. [80] tried to apply federated learning algorithm into the heavy haul
    railway management. In their research, the train controls are quantified into
    multiple classes and the individual train data is applicable to the SVM based
    mixed kernel. The global model is administered by the smart contract. This research
    resolves the data island issue in this industry and the asynchronous collaborative
    learning algorithm is designed without involving a central server.


    # 4.3.2 Healthcare


    The healthcare industry has long been an early adopter of and benefited greatly
    from technological advances. Chen et al. in [81] proposed a blockchain based disease-classification
    framework called Health-Chain. In the Health-Chain system, multiple institutes
    can train the model with their patient records, collaborate'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'asynchronously in the blockchain network and contribute to the global model
    with privacy preserved. The researchers implement the system in two disease recognition
    tasks, breast cancer diagnosis and ECG arrhythmia classification, and both simulations
    demonstrate promising results.


    Kumar et al. [82] proposed a similar but more elaborate supervised machine learning
    framework on detecting COVID-19 patients. The proposed framework can utilize up-to-date
    data which improves the recognition of CT images. Both researchers above mainly
    focus on building the machine learning models and the blockchain is used for enforcing
    the consensuses across research institutes and aggregating the training models.


    Rahman et al. [83] gave a complete picture of how the blockchain can be employed
    in the Internet of Health Things (IoHT) area. In their framework, smart contracts
    are used to manage the training plan, trust management, participant authentication
    and the device data encryption. The framework design has high security and scalability
    level in the IoHT health management area.


    # 4.3.3 Supply chain


    Kamble et al. [84] built a prediction model using the machine learning technique
    to calculate an organization’s probability of successful blockchain adoption (BA)
    within the supply chain industry. The researchers focus on explaining the intent
    of BA by using the psychological constructs from the literature on technology
    adoption. The learning model can help managers to predict the readiness of their
    organizations.


    Mao et al. [85] developed a blockchain-based credit evaluation system to strengthen
    the efficiency of supervision and management in the food supply chain. The system
    collects credit evaluation from the traders on the blockchain, analyzes the evaluation
    directly via a deep learning network, and provides the credit results for the
    supervision and management of regulators.


    Yong et al. [86] proposed a detailed “vaccine blockchain” system based on blockchain
    and machine learning technologies. The vaccine system is designed to support tracing
    the vaccine inventory and preventing supply record fraud. The machine learning
    model can also provide suggestions to the immunization practitioners and recipients.


    # 5. Discussions and conclusion


    # 5.1 Current threads in Blockchain research


    Blockchain systems are designed to be distributed. Ironically, most blockchain
    networks are facing problems on centralization. For example, PoW mechanism relies
    on the success of mining mechanism. The higher the hashrate is, the more resilient
    the Bitcoin is against attacks. However, on the market side, mining a Bitcoin
    becomes increasingly harder. In order to gain more reward, miners share their
    hash power under a common mining pool. As shown in Figure 5, the top 4 mining
    pools currently contribute to more than 50% of the entire hash power.


    In other words, if a hacker controls or manipulates the top4 mining pools, they
    might be able to perform 51% of the attacks. This is known as mining pool attacks.
    Besides directly controlling the mining pool, multiple variations of mining pool
    attacks have also been proposed. Selfish mining, for instance, refers to when
    miners who find the next block withhold the information and then release multiple
    valid blocks at once, resulting in other miners losing their block rewards and
    blocks.'
