- pgno: 72
  md: '# Blockchain and AI Meet in the Metaverse


    Hyun-joo Jeon, Ho-chang Youn, Sang-mi Ko and Tae-heon Kim


    # Abstract


    With new technologies related to the development of computers, graphics, and hardware,
    the virtual world has become a reality. As COVID-19 spreads around the world,
    the demand for virtual reality increases, and the industry represented by the
    Metaverse is developing. In the Metaverse, a virtual world that transcends reality,
    artificial intelligence and blockchain technology are being combined. This chapter
    explains how artificial intelligence and blockchain can affect the Metaverse.


    Keywords: AI, Blockchain, Virtual Reality, Metaverse, NFT


    # 1. Introduction


    The term “Metaverse” is a combination of ‘meta’ meaning ‘virtual, transcendence’
    and ‘verse’ a backformation from ‘universe’. The Acceleration Studies Foundation
    (ASF), a non-profit technology research organization, classified the Metaverse
    into the following four categories: a virtual world that experiences a flawless
    virtual story, a mirror world that reflects the current real world, an augmented
    reality that shows a mixture of augmented information in the real world and life
    logging, which captures and stores everyday information about people and things
    [1]. With the development of technology, the number of people who use the Metaverse
    increases, and as activities at the same level as reality are performed, various
    and a lot of data are being generated. Data generated in the metaverse has value
    in itself. In the Metaverse, the amount of data increases, the value increases,
    and the importance of reliability and security is increasing. Blockchain technology
    is required to guarantee the reliability of data in the Metaverse, and artificial
    intelligence is used to secure the diversity and rich content of the Metaverse.
    The contents will be developed in the following order.


    In this chapter, under the theme of the Metaverse, we will look into the issues
    of human instinct for creation in the virtual world, the phenomenon in which the
    real and the virtual are combined in the virtual world, and the reliability of
    data in this virtual world. Blockchain and NFT technologies are described as trust
    technologies. And the Metaverse platform built on the basis of this technology
    will be described. Basically, we will understand the interface between blockchain
    and artificial intelligence, and look at how a better world is created by combining
    blockchain and artificial intelligence in Metaverse.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# ## 2. Virtual world and desire of creation


    # ### 2.1 Human desire for creation


    Humans have an instinct for creation, and this creativity is an important factor
    that distinguishes humans from other animals. The creativity of human beings has
    been creating the culture. The paper published in 2004 described the SeaCircle
    as the new concept of the culture, and it regarded the SeaCircle as human cultural
    activities for creating. In the concept of the SeaCircle, humans are the spiritual
    beings, and only humans constitute a culture. It explains the elements of insight
    of culture [2]. According to the SeaCircle theory, creativity is explained as
    an element of Open Mind and Spirit [3]. On the SeaCircle concept, the Metaverse
    can be interpreted as a space that allows people to be more immersed in creative
    activities by resolving some of the constraints on space and resources.


    # ### 2.2 Connection between the virtual world and the real world


    Recently, the virtual world and the real world have been developed in convergence.
    The First and Second Industrial Revolutions were the process of maximizing efficiency
    through division of labor, so the production of materials and the consumption
    of materials were separated. In the Third Industrial Revolution, as online transactions
    are actively conducted, data has become an important commodity, and offline transactions
    are gradually being replaced by online. In the Firth Industrial Revolution, an
    intelligent revolution is occurring as things and humans become hyper-connected.
    There is a convergence phenomenon in which production and consumption occur at
    the same time, such as social customization or digital DIY (Design It Yourself).
    The offline world composed of materials is dominated by Pareto''s law, which attempts
    to own and concentrate on the core of 20% due to limited resources. On the other
    hand, in the online world of information, the Long Tail theory is applied to share
    and find opportunities from the marginalized 80% of customers. The Forth Industrial
    Revolution is creating a convergence world where offline and online meet. This
    convergence is being created in manufacturing, logistics, finance, automotive,
    sports, healthcare, education, food and everyday life. In addition, as the problems
    of material production and supply were solved in the First, Second, and the Third
    Industrial Revolutions, and interest in human personal desire and spirit increased
    in the Forth Industrial Revolution stage, a new convergence between offline world
    and online world are being created [4].


    ![](img/d818f1a203fe6c57bcd1236391f7287d_73_0.png)


    Figure 1. Relationship between the real world and the Metaverse.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# ## 2.3 Combination of virtual and real in Metaverse


    Political, economic, social, and cultural interactions appear in the Metaverse,
    which seems to mimic the real world. Figure 1 shows the process of interworking
    and convergence between the real world and the Metaverse [4]. The Metaverse expresses
    an alternative world that cannot be achieved well in the real world.


    In Minecraft, a virtual reality game platform representing Metaverse, as it became
    difficult to go to school due to COVID-19, UC Berkeley students created a campus
    inside the Minecraft game and held an event to hold a virtual graduation ceremony
    [5]. The president, guest speakers, and graduates all participated as Minecraft
    characters, and even the tradition of throwing hats after graduation was reenacted
    in Minecraft.


    Roblox allows game developers to create games on the Roblox virtual platform instead
    of commuting to an offline office [6]. In Roblox, tokens are obtained in return
    for labor, and the tokens obtained in the game can be brought to the outside to
    be cashed.


    In Metaverse, numerous users can freely trade goods and services according to
    the currency and transaction method provided by the platform. Both the virtual
    asset SAND of The Sandbox and the virtual asset MANA in Digital Land are listed
    on the exchange and are actively traded [7, 8]. This means that money in the virtual
    world in units of bits can replace money in the real world. Co-creating a game
    in the space of the virtual world means replacing the space in the space of the
    real world. This means that activities in the real world are data in bits in the
    virtual space, and the importance and reliability of these data are emphasized.


    # ## 3. Data trust in the virtual world


    After the 4th industrial revolution, the virtual world has grown rapidly. The
    real thing has been converted into data from the virtual world, and the virtual
    world has even played a role in leading the real world. Here, we have a question
    about the reliability of data about whether the real thing is becoming data accurately
    in the virtual world. In the virtual world, trust technology is emerging as an
    important issue. We can think of blockchain as one of these trust technologies.


    Blockchain was first proposed in 2008 in Satoshi Nakamoto''s paper “Bitcoin: P2P
    Electronic Money System”. Blockchain can be said to be a technology that gives
    trust in transactions between individuals. A blockchain consists of blocks containing
    data and a chain that connects them. It is a blockchain to create and connect
    blocks, and consensus algorithms are used in this process. Any of the nodes participating
    in the network can create blocks, but not all generated blocks are connected,
    and only one block is recognized and connected. Since only one block among many
    blocks is connected to the previous block and the remaining blocks are discarded,
    consensus among participating nodes to select one block is essential. As a method
    of reaching consensus, consensus algorithms such as Proof of Work (PoW) and Proof
    of Stake (PoS) are used. If it is recognized as a unique block by all nodes, the
    node that created the block will receive cryptocurrency as a reward. This action
    is called mining, and a blockchain connected only with blocks created by mining
    is called a Canonical Chain.


    Blockchain is developing and evolving as shown in Table 1 [9]. Blockchain 1.0
    was a period of innovation in the financial system with the advent of Bitcoin.
    Bitcoin is meaningful in that it attempts a single global financial system based
    on decentralization and decentralization, which are the core values of blockchain.'
  merge: -1
  img_proc: true
