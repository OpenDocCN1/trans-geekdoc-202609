  md: 'Companies have implemented AI to create holistic views of customers by piecing
    together transactions from all customer touchpoints. Blockchain participants will
    have incentives to pull together integrated datasets by combining transactions
    for a single customer across all blockchain partners. This creates potential benefits
    for blockchain partners, but can also negatively affect the privacy of customers
    and other stakeholders for which this integration is possible.


    In combination with options for identity protection through decentralization,
    AI can be used to combine personal data from blockchain participants and their
    stakeholders in a way that maintains information security and personal data privacy.
    Through these processes, user and stakeholder security can be enhanced and data
    sets and AI models can be improved.


    We can identify four categories of stakeholders that can be affected by an organization''s
    data transparency and privacy processes: (1) participants, whose data—both direct
    and indirect—are gathered; (2) victims, who are affected by decisions made using
    participant data; (3) users, who use participant data in their work; and (4) custodians,
    who manage and secure data. When AI can be used to manage access to data and to
    develop analytical models using that data, all stakeholders can benefit [15].


    Table 1 summarizes a number of ways AI can be used in a blockchain setting to
    protect or increase privacy of user''s personal data. This AI/Blockchain combination
    can increase system security by helping to detect attacks by bad actors, user
    security by sharing permissions and smart contracts, enable privacy-enhanced use
    of data-sets through improved identity management and better data, and it can
    improve AI models through more varied, valid, and ethically-sourced data and better
    hypotheses. Each item in Table 1 is described briefly below, followed by examples
    of use cases using this combination of technologies.


    Computational intelligence (CI), a subset of AI can improve the Blockchain''s
