    # 5. How can we judge what is ethically right?


    In his Tanner Lecture Science and Revolutions [66] Sagdeev states that “the intellectual
    community rarely has been the direct beneficiary of revolutions”. In his words,
    this group “has played the role as a patient, the victim of change; and as a doctor,
    preparing and implementing the revolutionary processes [67]”. The truth is that,
    even though Sagdeev is referring to other types of uprisings, Bitcoin and the
    Blockchain are providing a comparable revolutionary environment. This revolution
    too comes with a conflict of interest: on the one hand the political slogans,
    the power plays, the status quo, and those taking advantage of the confusing environment
    to loot for their own personal benefit, and on the other the intellectual drive
    to search for truth, rationality, and progress.


    The attempt to use intellectual thinking to social political phenomena is, in
    Sagdeev’s view, one reason why scientists become the “first revolutionaries, and
    often the first prisoners after the success or failure of revolutions [68]”. As
    an example, he cites the time Einstein and a group of physicists became victims
    to the attacks of Soviet philosophers who demanded quantum mechanics be liberated
    from the: ““bourgeois” principle of uncertainty”, and the theory of relativity
    be “liberated” from the dubious role played by imaginary observers [69]”."


    In those times, science was hostage to the “supreme wisdom” of communism as given
    in the form of proclamations by the classic manifestos of Marxism. And many of
    those incapable of undergoing the soul engineering process required to produce
    the “new Soviet man” or hiding successfully, were exterminated. Comparable events
    had been experienced at earlier revolutions, such as the one in France when Jean-Paul
    Marat demanded that chemistry in particular, be a “people-friendly science.” This
    resulted in a general bloodshed including the beheading on the guillotine of the
    founder of chemistry: Antoine Lavoisier, whose ideas about the nature of chemistry
    differed from those Marat had.


    Now, we live in different times. But still we can feel a serfdom, not subservient
    to a recognizable regime, but rather to a plethora of forces, –be some big corporations,
    be a number of governments, be the concept of the welfare state, be other sources
    of status quo power such as communication giants- that also try to mold at their
    convenience a type of “new modern man” and determine who is the worthy intellectual.
    Against these attacks, each person can chose to go the way of “internal emigration”
