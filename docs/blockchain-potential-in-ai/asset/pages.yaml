  md: '# 6.1 Emerging blockchain and AI industry uses cases


    The 2019–2020 Covid 19 pandemic has prompted medical researchers and technologists
    to research ways to quickly gather intelligence around virus exposure and transmission
    as a way to combat the spread of the disease while maintaining personal privacy
    of users. Point-of-care diagnostics, which rely on rapid testing of patients that
    may have been exposed to the virus is proving to be an effective way of tracking
    the spread and reducing the impact of the disease. German based Pharmact AG has
    developed a rapid Covid 19 test that delivers results in roughly 20 minutes. This
    test can be used in point-of-care systems and combined with blockchain and AI
    to increase the speed of diagnosis and provide statistics on positive and negative
    results while maintaining security of personally-identifiable data. Data can be
    collected on blockchain infrastructure while taking advantage of the speed that
    AI affords to create an integrated platform that enables data from disparate sources
    to be analyzed. Information drawn from these systems can provide communities a
    powerful tool for combatting the spread of disease, reducing the burden of health
    care facilities and saving lives [19].


    Many cities are working toward becoming “smart cities” by integrating AI and blockchain
    with other web 3.0 technologies such as internet of things (IoT) sensors and edge
    devices. Intelligent transportation systems are enabled by these technologies.
    Self-driving cars make use of IoT sensors to continuously monitor surrounding
    situations and even anticipate developments by using artificial intelligence.
    These cars can incorporate blockchain wallets that enable passengers to pay for
    rides, rentals, tolls, etc. without revealing personal data. By adding blockchain
    as an underlying architecture, cities and private companies can reduce the friction
    of renting or sharing autonomous vehicles by streamlining the process of procuring
    a ride. The peer to peer nature of blockchain reduces the number of people or
    businesses involved in the process, taking out expensive intermediaries, and reducing
    costs. These systems can also provide audit trails for both owners and renters,
    and enable rating and payment systems that maintain privacy for both parties.
    Data gathered by the vehicles can contribute to learning algorithms on the blockchain
    for increased security, scalability and efficiencies as well as improved transportation
    and sustainability for the city [20].


    Smart home systems that preserve user privacy while contributing usage data for
    analysis can likewise benefit from the integration of blockchain and AI. Smart
    home systems are becoming popular and manufacturers increasingly enable connectivity
    between devices. These systems are valuable sources of consumer usage data. AI-enabled
    blockchain systems can be used to push machine learning and training processes
    to consumer’s mobile devices and edge computing servers. Users can then submit
    locally-trained models for analysis, in some cases with option of adding noise
    that makes it very difficult to trace shared data back to individual consumers.
    Decentralized technologies enable analysis of locally generated data without this
    data being submitted to a centralized server [21].


    These use cases exemplify some of the ways blockchain and AI are being used to
    accomplish objectives while maintaining personal data privacy. New use cases continue
    to be developed as technologists and user communities recognize the possibilities
    for systems that provide both functionality and privacy.


    # 7. Conclusion


    Blockchain and AI technologies are improving at a rapid pace and enabling possibilities
    for sharing and combining data in ways not previously envisioned.'
