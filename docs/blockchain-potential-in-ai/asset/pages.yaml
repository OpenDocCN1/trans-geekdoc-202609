    # 7.1 Building trust with bitcoin: now is the time for a blockchain reformation


    Similar to the transformative nature of the internet, a public blockchain has
    the ability to revolutionize government processes by providing greater transparency
    and auditability as well as a super-efficient “Universal Source of Truth” data
    management platform that can be used to restore trust, authenticate data, and
    significantly reduce costs. This has become true after the publication of the
    2008 Bitcoin Whitepaper by Satoshi Nakamoto which presented solutions to long-standing
    issues such as the scaling obstacles among other [89].


    Bitcoin was designed to be the foundation for an open and honest system, one that
    is public, has a series of checks and balances, as well as an incentive for participation
    based on Proof-of-Work. On the Bitcoin network, every transaction is recorded
    on a public ledger maintained by a small-world network of specialized distributed
    nodes called transaction processors. As transactions are broadcasted, processors
    gather, validate, timestamp, and add each transaction as it is received in a series
    of hash-based, agreed upon chain of events, secured in blocks of immutable information.


    As explained earlier, contrary to much of the popular belief, Bitcoin offers more
    than just a transfer or store of financial value. Bitcoin establishes a Universal
    Source of Truth, where information can be stored, validated, shared, protected,
    and authenticated. This can be used in conjunction with traditional systems or
    new hybrid options utilizing cloud to chain solutions. Not all data has to be
    stored on chain, but rather information can be authenticated simply by hashing
    it in the cloud and storing a copy of that hash on-chain. This would ensure that
    the data stored in the cloud, or elsewhere, could be simply authenticated to confirm
    it has not been changed.


    Restoring the Bitcoin original protocol by removing the real centralization bottleneck,
    has allowed true innovation and unbounded on-chain scaling to occur. On May of
    2020, the Bitcoin SV blockchain processed a world-record size block of 369 Mb
    which contained 1.3 million transactions. In fact, the network has already eclipsed
    almost 4,000 transactions per second (tps) and is expected to reach 50,000 tps
    later this year. Through scaling comes cost efficiency and Satoshi’s vision remains
    unmatched in its ability to transfer micro – even nano-transactions with a median
    transaction fee of 1/100th of a U.S. cent. With safe, instant, low fee transactions
    of Bitcoin SV, government organizations can significantly reduce costs associated
    with financial and data transactions. These savings may be compounded by a reduction
    in the associated costs with auditing, cybersecurity, and networking hardware.'
