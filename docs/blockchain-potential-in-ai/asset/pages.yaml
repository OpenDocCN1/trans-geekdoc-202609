    \ came into the market to become the first digital cash coin capable of withstanding\
    \ the process of its own development.\n\n# 3. Emotions versus facts, and perception\
    \ versus reality\n\nThere are many reasons why people resist change. For one,\
    \ change is a psychological experience that requires time to process. Furthermore,\
    \ if change is big and unexpected a common reaction is denial. In this scenario,\
    \ we can tell ourselves that nothing of relevance is happening and excuse our\
    \ participation in the process. Feeling unprepared for the new environment also\
    \ explains this rejection as people are pushed out of their comfort zones. Change\
    \ implies a departure from the “old ways.” Hence, those who did not catch up to\
    \ the new version might feel superseded and are bound to be defensive about it.\
    \ And, if change involves a new technology, a common concern is personal competence.\
    \ People worry that their skills will be obsolete and, as a defensive mechanism,\
    \ they might express skepticism about the success or adequacy of the innovation.\
    \ In addition, change is likely to imply more work and this may ripple into resentments\
    \ and other negative feelings. At the end, depending upon the position of those\
    \ affected by it, resistance to change may be externalized in one of a variety\
    \ of manners, from foot-dragging behavior and indolence to sabotage and rebellion.\n\
    \nWhen new technologies displace old ones it appears as if whole sectors of society\
    \ will be hurt. This will be particularly true when those affected resist catching\
    \ up with the times. In these instances, the damaged sectors can be quite large,\
    \ as they might include different industries such as providers and users of the\
    \ old technology. The emotional experience of these processes of resistance has\
    \ been compared with “being irrational” (see Fineman, 1993 [19]). From this point\
    \ of view, emotions are understood as the root of the problems, rather than an\
