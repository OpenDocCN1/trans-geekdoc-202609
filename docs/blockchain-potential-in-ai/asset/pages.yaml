  md: 'connection, the CFT based system will still function and give the result that
    you expect [9]. The CFT fault model has been discussed by academics for a number
    of years long time and is mature in industrial use cases. Most cloud based companies
    implemented different CFT methods to prevent the critical problems. We still occasionally
    hear news about collapse/maintenance of servers of Amazon, Alibaba or Microsoft
    and developers make some open source or free projects to show you the real-time
    status of their servers (e.g., the downdetector³).


    Byzantine-Fault Tolerance (BFT) is more complicated than CFT. The name Byzantine-Fault
    Tolerance is derived from a paper published by Leslie Lamport, Robert Shostak
    and Marshall Pease on SRI International called The Byzantine Generals Problems
    [10].


    Converting the story above into a computer system use case, a distributed system
    should be resilient to the case when a small portion of the computers in the network
    are malicious. Every non-malicious entity has the same status (including action).
    Companies’ server systems are mostly CFT because they set up each node/ server
    in the network and they are very confident that the chances of having malicious
    nodes are low. Furthermore, they have backup systems that can recover from the
    previous loss. However for Bitcoin, everyone can hop-on and hop-off the Bitcoin
    chain. So how do we protect the network and the ledger system’s integrity, making
    sure no one is taking extra money that does not belong to them or preventing one’s
    money from being stolen [7]. This is a typical BFT question.


    The PoW solves the problem of determining representation in majority decision
    making. It’s a one-CPU-one-vote proposed by Satoshi Nakamoto [7], the pseudonymous
    founder of Bitcoin. Around every 10 minutes, the network will wrap around all
    transactions that happened within the 10 minutes. As illustrated in Figure 1,
    it uses a cryptographic hash function to hash previous block’s hash, Nounce and
    transactions together to form a new hash block. Each node will try different nonces
