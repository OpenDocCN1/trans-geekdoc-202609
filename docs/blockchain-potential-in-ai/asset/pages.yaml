    for development as an online trading platform. Blockchain 3.0 is the stage in
    which blockchain technology is spread and applied to various industries. In order
    to solve the problems of the previous blockchain, technological improvements such
    as changes in consensus algorithms, improvement of transaction processing speed,
    and in-house decision-making functions are being made [10]. While it is expected
    that artificial intelligence will be applied to more expanded fields in Blockchain
    3.0, more various applications of blockchain and artificial intelligence are expected
    to appear in the Metaverse environment.


    # 4. Blockchain-based Metaverse


    # 4.1 Ethereum code


    Ethereum is a platform network designed to operate various decentralized applications
    (DApps), based on its own blockchain. Just as the basic framework and details
    of Internet standards were documented as RFCs, Ethereum Request for Comment (ERC)
    documents the details of Ethereum. In DApps using the Ethereum network, the basic
    protocol for issuing tokens is expressed as ERC-number as shown in Table 2. ERC-number
    is a protocol to follow when issuing tokens from DApps using the Ethereum network.
    Ethereum standard documents start with ERC-20, ERC-165, ERC-223, ERC-621, ERC-721,
    ERC-777, ERC-827, ERC-884, ERC-998, ERC-1155, ERC-1404 etc. [11].


    Among them, ERC-20 is a protocol related to replaceable tokens, and ERC-20 tokens
    have the same value and function and can be exchanged with each other. The Ethereum
    project is issuing tokens based on ERC-20 and allowing investment and various
    businesses to take place.


    ERC-721 is a protocol for NFT (Non-Fungible Tokens). NFT guarantees uniqueness
    by keeping encrypted transaction history permanently on the blockchain. Each token
    has a unique recognition value, authenticating the ownership of digital assets
    and assigning a value to the transaction. NFT has been mainly used to commemorate
    special moments or to collect digital assets, and recently it is creating a new
    digital content business by combining it with Metaverse.


