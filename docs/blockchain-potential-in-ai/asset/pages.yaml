- pgno: 11
  md: 'perspective emotions are not necessarily destructive as they help individuals
    adapt to difficult situations. But they might motivate an unhealthy resistance
    that can block the ability of those under stress to assess the situations properly.


    The common reactions to change introduced in the prior paragraphs might be able
    to explain, in part, the strong emotions shown by mainstream media outlets and
    many relevant figures in society when reporting about cryptocurrencies. Albeit
    the recentness of the innovation, and that the high volatility experienced in
    these markets alerted many, the way concerns were expressed frequently showed
    a high level display of emotions as well as a limited understanding of the technology.
    These expressions of “hate” most often addressed all products grouped under the
    “cryptocurrency/Alt-currency” headings as if these were equal or equivalent assets.
    That is, in general, many commentators did not differentiate between key aspects
    of the technologies underlying these assets. Be it news, investment or entertainment,
    television or written press, online media including social media outlets, all
    expressions published on these forged the vantage point of millions of people
    when thinking about cryptocurrencies.


    For instance, at a public forum reported by the Financial Times on February 15,
    2018th, Berkshire Hathaway vice chairman Charlie Munger depicted Bitcoin as “totally
    asinine [20]” adding it should receive a government crackdown. On March 5th, 2018th,
    Harvard economist Kenneth Rogoff told CNBC reporters that Bitcoin was “more likely
    to be worth $100 than $100,000” by 2028 implying its value depended upon its use
    in “money laundering and tax evasion [21].” Another loud Bitcoin basher was JPMorgan
    CEO, Jamie Dimon [22, 23] who declared publicly and repeatedly his disdain for
    Bitcoin. For instance, during a public conference in New York, Dimon declared
    that trading the virtual currency “was stupid” and he [24] would “fire in a second”
    anyone found doing it at his firm. Later, while at the Aspen Institute’s 25th
    Annual Summer Celebration Gala on August 5th 2018, Dimon called Bitcoin a “scam”
    and a “fraud [25], “and reiterated comments he had made a year earlier when stating
    that Bitcoin was:


    > “worse than Tulip Mania” and “only for people in countries like Venezuela [26,
    27], Ecuador or North Korea [28, 29] “or a bunch of parts like that, or if you
    were a drug dealer, a murderer, stuff like that, you are better off doing it in
    Bitcoin than US dollars.” So there may be a market for that, but it’d be a limited
    market.” He further argued that “governments should shut them down if they were
    incapable of controlling them” [30–32].


    Three examples of articles whose titles already show laud emotional content are:
    1) Nobel award winner Paul Krugman’s “Bitcoin Is Evil [33]”; 2) Charlie Stross’
    “Why I want Bitcoin to die in a fire, [34]” and 3) Nobel Laureate Robert Shiller’s
    “Cryptocurrencies have a mysteriously allure – but are they just a fad?” [35]
    Some of the statements made in these literally include: Bitcoin comes with an
    implicit political agenda attached, it is designed to be untraceable, and easy
    to hide, libertarians love it because it pushes the same buttons as their gold
    fetish and it does not look like a “Fiat currency”, it will become central to
