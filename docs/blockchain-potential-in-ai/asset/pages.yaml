    # ## 3.2 Blockchain-enabled data security for mobile edge intelligence


    IoT data contains sensitive information related to individuals. Therefore, IoT
    data security is critical in establishing AI applications based on IoTDs. As described
    in the previous part, blockchain-based MEC is a key solution to enable AI for
    IoTDs. To secure IoT data and MEC, blockchain is a promising strategy. To be specific,
    authentication, secure communication, data privacy, and data integrity are four
    main strategies to enable IoT security in the scenario of MEC.


    Although blockchain-enabled edge intelligence is a cutting-edge technology to
    enable AI applications for IoT systems, it is vulnerable when facing malicious
    attacks. Authentication of identities in blockchain-enabled MEC system was discussed
    in [38]. The authors proposed a digital validation strategy based on group signature
    scheme. In this way, the identities of block creators were verified and authenticated
    to prevent edge intelligence from false records. Moreover, to manage privacy and
    data leakage issues, authors in [39] discussed the authentication for federated
    learning (FL) peers in the edge computing context. By exploring blockchain technology
    and smart contract, the FL and differential privacy technique were proposed in
    this article.


    Secure data sharing is another aspect of data security for edge intelligence.
    The basic idea of secure data sharing is that data should be stored and shared
    in a trusted way. Consortium blockchain was discussed in [40] for the secure and
    efficient data sharing. Different from a public blockchain network, the consensus
    process is performed on a group of pre-determined edge nodes in consortium blockchain.
    The proposed model contained two kinds of smart contracts, including data storage
    smart contract and information sharing smart contract, allowing the auditing and
    governance of data sharing. Besides, the data sharing problem was transformed
    into a machine learning problem in [41]. FL was explored in this article to share
    the learning model rather than raw data.


    The integrity of data should be considered in edge intelligence. As illustrated
    in Figure 3, any false information may do harm to the global ML model. For example,
    poisoning attack and input attack are two major types of issues in data integrity
    in AI application. The first one normally occurs in the initial stage of AI model
    training. By manipulating training data, the AI model would be ineffective. The
    latter one tends to use manipulated data to shape and affect the AI model output
    in a way desired by attackers. The design of blockchains naturally protects data
    integrity because any tampering of previous data recorded are not permissioned.
    MEC servers were used to validate and store blockchain data in [42] for data integrity.
    The data acquisition process for IoT system was discussed in this article. To
