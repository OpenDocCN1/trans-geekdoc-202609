- pgno: 24
  md: 'Overall, we can be sure that any elections properly organized using a voting
    protocol designed with blockchain and AI could be expected to exhibit at least
    the following desirable properties: privacy of the vote, perfect ballot secrecy,
    fairness, verifiability, self-tallying feature, dispute-freeness, fault tolerance,
    and resistance to serious failures. The works of Kiayias and Yung [115], Groth
    [116], Park et al. [117], Benaloh et al. [118], and Jonker et al. [119] provide
    a detailed description of these. We can also be sure that much upheaval would
    have been prevented if this would have been the underlying technology to the recent
    2020 US Presidential elections.


    # 10. Conclusion


    The State should ensure the right of each individual to be secure in person and
    property and enhance the citizens’ opportunities to make choices. Transparency
    and accountability are two key requirements to ensure the citizens’ wills are
    not replaced by the needs of supra organizations: be it the state, large corporations,
    or the sole owners of certain resources. This is of particular importance in the
    age of “surveillance capitalism” when individuals might be looked upon and used
    as “raw material supplies [120]”. It is in this environment that Bitcoin came
    to the market after both the 2008 white paper and the code were made available
    by Satoshi Nakamoto.


    The 2009 birth of Bitcoin paved the way for a revolutionary transformation that
    announced the death of outdated technologies and evidenced the effort many across
    sectors and government, will have to make to say at par with the latest technology.
    This is a truly global solution that provides better transparency, fraud protection,
    it is faster, cheaper, and overall more efficient. Given this solution threatens
    to cause a fundamental and permanent change in our societies, and that the economic
    repercussions of the probable developments and trades are highly significant,
    public opinions have often been construed over a mixed of emotions and disinformation
    on the workings of the technology. As the Bitcoin builds untamperable public records
    in an efficient manner, a fear-mongering mentality intertwined with an problem
    posed by underlying conflict of interests has announced the “death” of this new
    sector repeatedly [121]. However, in just over a decade a myriad of transformative
    blockchain solutions have been built. Among the many, we have listed some ready
    solutions that will have immediate cathartic power. Of course these and other
    currently existing applications deserve a longer discussion.


    During the decades following World War II, ethical standards were established
    to help govern how science in the future could move forward while not incurring
    the atrocities committed in the past [122]. Technology is considered as normatively
    neutral, but because transactions are irreversible and they solidify economic
    contracts by turning code into economic law, the use of Bitcoin poses a series
    of ethical questions. For instance, we could wonder about issues of privacy, whether
    miners are acting responsibly, whether this technology enables fraud, and so on.
    However, these questions can be answered by studying the technology itself and
    the trades. Here we turned our attention to whether the use of Bitcoin contributes
    to “ethics” according to the justice that is achieved when a society restores
    transparency and prevents fraud. In this imaginable future, Bitcoin will allow
    citizens have a more voluntary life and, in this way, it will contribute to the
    moral norm of justice by helping create a fairer society.


    John Fitzgerald Kennedy [123] stated that “change is the law of life. And those
    who look only to the past or present are certain to miss the future”. We hope
    this chapter contributes by helping the reader assess the depth of change this
    impending Bitcoin Revolution will unfold.'
