  md: '# 4.2 Ethereum-based Metaverse


    The Metaverse is a three-dimensional virtual space where social and economic activities
    are commonly used just like the real world. NFT plays a role of mediating interaction
    and proving private property within the Metaverse world. An example of NFT application
    is the CryptoKitties. It is a blockchain-based cat reproduction game. CryptoKitties
    is an Ethereum ERC-721 token-based DApp [11]. Game users are given only one cat
    in the world in CryptoKitties. Cat digital assets have a rarity because they contain
    a separate unique recognition value, unlike existing virtual assets. In general
    online games, when the service is terminated, there is a problem that the character
    developed in the game can no longer be owned. However, digital assets with NFT
    technology can be distributed and stored by individual participants connected
    to the network to prove ownership.


    Decentraland implemented the concept of real estate in the Metaverse by combining
    virtual reality and blockchain technology [12]. Decentraland made it possible
    to purchase land, a virtual real estate, using MANA, an ERC-20 token. Users can
    freely place buildings on land purchased from Decentraland, earn income by attaching
    billboards to buildings, or open exhibitions by collecting rare digital content.
    Land ownership and other collectible items are ERC-721 non-fungible tokens. These
    unique assets are made through Ethereum smart contracts and allow owners to prove
    ownership on the blockchain ledger. Cryptocurrency MANA can be purchased on exchanges
    and can also be used to purchase digital goods and services around the world.


    Enjin Coin is a cryptocurrency project created for game item trading, and is an
    integrated platform for creating blockchain-based games. Enjin is a smart contract
    platform based on the Ethereum blockchain, and is a protocol and cryptocurrency
    that supports the crypto needed to create, manage, and implement virtual goods
    for game developers, content creators, and game communities. Ethereum-based ERC-20,
    ERC-721, and ERC-1155 token items can be stored and managed in a mobile cryptocurrency
    wallet. Enjin Coin guarantees the ownership and currency value of game items used
    in all games. When Enjincoin is applied as a currency in Metaverse, it can be
    used not only as a currency in Metaverse, but also in the real world with the
    value of currency.


    # 5. Complementary point of Blockchain and artificial intelligence


    # 5.1 Artificial intelligence and blockchain


    Through the cognitive revolution, the agricultural revolution, and the scientific
    revolution, humans have entered the stage of connected intelligence, which uses
    the combined intelligence of humans and machines. As in the movie The Matrix,
    a symbiotic relationship between humans and machines has begun, and artificial
    intelligence and blockchain technology are accelerating this.


    Artificial intelligence is reaching a stage where prediction and creation are
    possible through pattern recognition and learning using large amounts of data.
    And artificial intelligence is helping people to reduce repetitive tasks and human
    errors. Blockchain technology has deeply entered our society as a digital asset
    and is developing into a safe and reliable transaction through decentralization.
    Artificial intelligence is the core of the Forth industrial revolution, and it
    can be integrated with blockchain technology to make both artificial intelligence
    and blockchain more powerful [13]. Artificial intelligence and blockchain can
    change business models and have a transformative impact on society.'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# 5.2 Blockchain for artificial intelligence


    Artificial intelligence has a centralized nature where data is centrally managed
    and stored, making it a target for hacking and manipulation, which can lead to
    data tampering. In addition, since the source and reliability of the source for
    generating data are not guaranteed, there are many errors and risks. The blockchain
    capabilities of immutability, origin and control mechanisms have the potential
    to address the shortcomings of artificial intelligence and improve the accountability
    of trust, privacy issues and decisions. The combination of blockchain and artificial
    intelligence can help enable trusted digital analysis and decision-making on vast
    amounts of data. And it can be used to create secure data sharing and make artificial
    intelligence explainable, as well as regulating trust between devices that cannot
    trust each other [13].


    # 5.3 Artificial intelligence for blockchain


    Integrity of blockchain data is guaranteed. However, the security of applications
    built on top of the blockchain platform is not secure. Also, when a new block
    is added to the blockchain and consensus of all nodes is required, a problem arises
    that it cannot be used efficiently in fields that require high speed. When an
    error or vulnerability is found in the script of a smart contract and needs to
    be corrected, the irreversibility of the blockchain can hinder it. The case of
    hacking tens of millions of dollars in crypto currencies using vulnerabilities
    in smart contract algorithms reminds us of the need for agents that can immediately
    compensate for imperfect algorithms [14]. In such cases, machine learning systems
    of artificial intelligence can improve the security of blockchain applications,
    adjust dynamic parameters for scalability, and provide effective personalization
    and governance mechanisms.


    Netflix provides a list of related movies related to your favorite movies, but
    this is the result of Netflix''s central server analyzing personal information.
    If you do not provide personal information to Netflix, your personal information
    will be protected, but you will not be provided with personal taste analysis.
    Instead of collecting data on a central server, you might consider making use
    of data stored on a decentralized blockchain. However, in the case of a public
    blockchain, anyone can look into the transaction ledger, so there may be a risk
    of invasion of privacy as well. Although it is possible to allow individuals to
    directly control personal information in the blockchain, there is a risk of incurring
    a lot of cost. Artificial intelligence can provide customized services to individuals
    without violating personal information. Artificial intelligence can perform analysis
    on the user''s local device and not perform analysis that is not permitted in
    advance. Artificial intelligence can realize decentralization so that real individuals
    have control over personal information [15, 16].


    # 6. Blockchain and artificial intelligence encounter in the Metaverse


    Blockchain plays an important role in implementing the economic system in Metaverse.
    The economy of Metaverse without blockchain will eventually be controlled by someone.
    If the blockchain is not supported, it is difficult for resources or goods used
    in the Metaverse world to be recognized for their value or to have economic interactions
    equivalent to the real economy. NFT-based blockchain technology further activated
    the Metaverse. With the advent of WEB 3.0 and Blockchain 3.0, Metaverse becomes
    the world to realize it.


    In the Metaverse, people appear by scanning themselves in 3D or transforming them
    into avatar characters. Characters in the Metaverse are recognized as beings'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'like clones in real life, not just game characters. In the Metaverse, besides
    their own avatars, they create things that can express their uniqueness. And to
    prove this, the NFT technology of the blockchain is used.


    # ## 6.1 High quality learning data


    In the real world, the problem of people’s time, labor, and cost is easily replaced
    by using artificial intelligence in Metaverse. In the real world, when delivering
    news, you have to go through a lot of work, such as recruiting an announcer, shooting
    in a studio, and editing video. However, in the virtual space, by utilizing an
    artificial intelligence announcer, it is possible to deliver urgent and important
    news quickly and continuously for a long time. In order to deliver news in the
    Metaverse, it is necessary to learn the facial expressions, muscle movements,
    voices, nuances, and gestures of real announcers. When learning by receiving a
    long-time news video from a broadcaster to make an artificial intelligence announcer
    video, we extract only the part where the voice of another reporter and noise-free
    data, and the announcer’s face and voice come out clearly toward the camera, and
    only detect a specific person techniques must be applied. If you use blockchain
    meta-information when searching for various data like this, you can select only
    the pure data necessary for learning and induce high-quality learning. Metadata
    stored within the blockchain block makes the necessary high-quality data selectively
    available. It is created as reliable data in the Metaverse, which increases the
    number of users who use the Metaverse.


    # ## 6.2 Reusable data


    Recently, creative activities in Metaverse are often developed using artificial
    intelligence instead of real people. When artificial intelligence artists creates
    works, they learn about the trends and styles of the works, and then express what
    they learned for creation. In the past, a lot of data was used for style analysis.
    Now, artificial intelligence artists store the data in the distributed ledger
    so that it can be easily selected and reused. Acquiring more data and practicing
    iteratively reduces the chance of selecting the wrong data and shortens validation
    time.


    # ## 6.3 Stable decentralized network


    Metaverse is a virtual 3D environment that requires a large amount of data and
    server capacity. However, controlling through a central server can incur a lot
    of cost. By utilizing the distributed environment system of blockchain, it is
    necessary to have a network system that can use the Metaverse environment with
    each individual''s PC computing. When individuals control the Metaverse environment
    they want to use or view, the burden of centrally managing vast amounts of data
    can be reduced. It can also prevent some big tech companies from monopolizing
    the Metaverse environment.


    # ## 6.4 Privacy


    There is a need for a system that can govern so that ethical problems do not arise
    with respect to persons belonging to the Metaverse. Only the publicly available
    information about real and virtual people should be made known. And a personal
    information security system should be applied to prevent any damage to privacy.
    However, digital virtual people have no legal basis, so they are easier to manipulate
    or transform photos than real people, and there is a concern that the wrong algorithm'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'may be applied, which may lead to serious racial and gender discrimination.
    With regard to personal information, it can be safely protected with blockchain
    to prevent external attacks. If personal information is erroneously altered, it
    can be managed responsibly with a clear path that can be traced based on the time
    of occurrence.


    # 6.5 Distinguishing between virtual and real


    In order to create a stable environment in which users are not confused in the
    Metaverse, a device that can distinguish between artificial intelligence and real
    people is needed. The fictional characters used in the Metaverse have now reached
    a level where it is difficult to distinguish the real from the fake from the human
    point of view. A reliable data construction system is needed to inform the comparison
    and judgment between real and fictional people. Data should be transparent and
    descriptive so that fake news and fake photos can be identified. Data content
    should be stored in a blockchain so that people can accurately know and understand
    the data generated by artificial intelligence and know the detailed history if
    desired. Blockchain technology can be used as a data to explain the data generated
    by artificial intelligence.


    # 6.6 Rich content


    We are using artificial intelligence technology as a way to imitate human behavior
    and replace it. Artificial intelligence analyzes the user’s behavioral patterns
    such as words and messages in the Metaverse to predict the user’s personality,
    intellectual level, and economic level. Metaverse uses artificial intelligence
    to create human-like voices and unique content. These data can be automatically
    converted into games, YouTube, news, advertisements, and lecture materials by
    simply inputting simple information. It is possible to create vast pattern content
    that imitates human behavior by using artificial intelligence technology with
    the vast data needed for the Metaverse world. With blockchain, personal information
    can be safely protected and various types of content can be created more abundantly.


    # 6.7 Economic virtuous cycle


    In investment and business, artificial intelligence can be used to make decisions
    about which data to use. It is important to have more reliable data in changing
    forecasts. If blockchain data is used, more reliability can be guaranteed through
    history management, thereby increasing the reliability of business predictions.
    In addition, the Metaverse Marketplace can be further activated through the payment
    of tokens and coins based on blockchain technology.


    # 7. Conclusion


    In the Metaverse, various and large amounts of secondary and tertiary data are
    generated due to the activities of many users. In the blockchain-based Metaverse,
    this data has a unique identification tag and is used as traceable data. Such
    data is becoming a good material for artificial intelligence in the Metaverse.
    Metaverse uses artificial intelligence and blockchain technology to create a digital
    virtual world where you can safely and freely engage in social and economic activities
    that transcend the limits of the real world, and the application of these latest
    technologies will be accelerated. Artificial intelligence and blockchain technology
    are expected to play an essential role in the ever-expanding world of the Metaverse.'
