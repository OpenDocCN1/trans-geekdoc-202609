    # 7. Restoring trust, transparency and efficiency in government with a publicly
    scaled blockchain


    In a letter to W. T. Barry, on August 4th 1822, James Madison [82] stated:


    > “A popular Government, without popular information, or the means of acquiring
    it, is but a prologue to a Farce or a Tragedy; or perhaps both. Knowledge will
    forever govern ignorance: and a people who mean to be their own Governors, must
    arm themselves with the power which knowledge gives.”


    Transparency and accountability are of the two most essential principles in a
    free and democratic society. They are a bridge between an informed citizenry making
    confident electoral decisions or the widespread distrust of ‘a self-serving, arbitrary,
    corrupt institution’. Furthermore, transparency and accountability are ever so
    more important as corruption keeps eroding the legitimacy and credibility of democratic
    governments worldwide. According to Pew Research Center, in the US public distrust
    of the government and elected officials has eroded to reach all-time lows [83].
    This has been highlighted with the rise of civil unrest, violent protests, and
    frequent demonstrations against government policies, politicians, and media organizations
    [84, 85]. The erosion of public trust in government and news media can be attributed
    to numerous factors, many of which relate to the honesty, openness, and confidence,
    or lack thereof, in the information that is disseminated.


    In 2011, the US launched a comprehensive digital government strategy aimed at
    building a 21st century digital government [86]. The Executive Order highlights:


    > “Government managers must learn from what is working in the private sector and
    apply these best practices to deliver services better, faster, and at lower cost.
    Such best practices include increasingly popular lower-cost, self-service options
    accessed by the Internet or mobile phone and improved processes that deliver services
    faster and more responsively, reducing the overall need for customer inquiries
    and complaints. The Federal Government has a responsibility to streamline and
    make more efficient its service delivery to better serve the public.”'
