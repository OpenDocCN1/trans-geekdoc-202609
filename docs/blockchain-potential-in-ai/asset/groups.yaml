    are uniquely positioned to help companies comply with existing and potential future
    regulation as it relates to personal property and data privacy.


    # 5. Blockchain and privacy


    Among the significant benefits of blockchain solutions is that they enable organizations
    to share data in ways not previously available, opening up possibilities for enhanced
    collaboration, improved operational efficiencies and expanded revenue. Questions
    about how to maintain privacy over the data are heightened in these environments
    because the data are stored in shared ledgers which may be accessible by multiple
    blockchain participants.


    ConsenSys, a blockchain technology solutions company, in discussing the security
    of public blockchains, argues that “In reality, privacy is not a property of any
    blockchain. Rather, there are layers of privacy that can be applied to any blockchain...”
    [9]. Designers must carefully consider which parties are allowed to read and write
    transactions and how transactions are broadcast, validated, and stored. Additional
    issues relating to how permissions and security measures are updated and enforced
    are also important considerations. Decisions about who owns the data and how data
    can be used by organizations and computer applications further complicates privacy
    discussions [9].


    # 5.1 Decentralized identity


    Self-sovereign identity, a widely held view among blockchain proponents, holds
    that individuals should have control over their own identities and should have
    autonomy over how facets of identity are shared with others. Decentralized identity
    (DID) is a blockchain-enabled embodiment of self-sovereign identity that can profoundly
    improve the privacy and security of personal data.


    DID refers to individual ownership of personal digital data relating to many elements
    of identity. Microsoft, which participates in defining DID standards, takes the
    perspective of the individual. “Currently, our identity and all our digital interactions
    are owned and controlled by other parties, some of whom we aren’t even aware of
    [10].” Returning ownership of data to the individuals to whom the data pertains
    can provide benefits both to those individuals and to organizations that would
    otherwise be responsible for protecting the data.'
  - '[PAGE 37]


    Blockchain technology enables DID and provides a way for individuals to store
    their own data outside of the databases of the parties with whom they transact.
    Data are owned and controlled by these individuals and pointers to this data or
    metadata can be stored on the blockchain and can be used to verify the validity
    of claims the users make about their personal data. For example, a driver''s license
    bureau might issue a driver''s license to a user, which the user stores privately.
    When an insurance company or other party wishes to verify that the user is licensed,
    the user can present the license to a party such as an insurance company, and
    the party can independently verify the issuer and expiration date.


    Anyone can create a DID. When this identity is first created, there is no information
    attached to it. Over time, the user could attach a driver''s license or other
    identifying data to that DID. The process that a third party might use to verify
    that a particular person owns a DID, is similar to the process of validating that
    a person owns an email address. For example, an online gaming account can be attached
    to an email address. A party seeking to validate that a person was the owner of
    that account could send a private message, such as a security code, to the email
    address and ask the person to provide that code, something that only the person
    possessing the password for that email address could provide.


    Unlike an email account, the DID would be owned and stored by a person rather
    than by an email service provider. The password, or private key, would also be
    secured by the owner. Personal information relating to the identity could be stored
    in an identity hub—an encrypted repository of personal data that is stored outside
    the blockchain, likely in a combination of phone, PC, and cloud data or offline
    storage devices [10]. Through the use of an identity hub, the person could control
    which pieces of information to share with an external party.


    DIDs reduce the probability of unwanted correlation. The use of common identifiers—such
    as email addresses on different web sites—creates what is called a correlation
    problem. Correlation in this context means entities can, without a user''s consent,
    associate information about a single identity across multiple systems. Email addresses
    utilize data on almost every website. When users provide the same email address
    on different sites—along with perhaps additional pieces of personal information
    like a phone number or physical address—they unknowingly enable a potential for
    correlation. In this case, entities can correlate that data across sites.


    ![](img/d818f1a203fe6c57bcd1236391f7287d_37_0.png)


    Figure 2. Decentralized identities and service providers.'
