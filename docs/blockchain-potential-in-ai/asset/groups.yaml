    intelligence) requires two kinds of tasks to be executed. On one hand, mining
    process is necessary for establishing consensus among distributed IoTDs. On the
    other hand, data training will be performed at each IoTD in a decentralized manner.
    However, IoTDs are energy-constrained and unable to process complex computational
    tasks. Fortunately, edge computing is capable of handling this issue. The main
    idea of realizing blockchain-enabled AI on the edge network is to use different
    offloading strategies for IoTDs. As illustrated in Figure 2, one can see that
    computing tasks can be offloaded from IoTDs to MEC servers located in different
    places, including small-cell base stations, cellular base stations, and the cloud
    data center [28]. As the distance between IoTD and MEC server becomes shorter,
    the computing capability decreases.


    However, data leakage and other security issues impose great challenges to MEC,
    especially for MEC-enabled blockchain and AI applications. In [3], authors discussed
    the privacy issues in MEC-enabled blockchain networks. Data processing and mining
    tasks were offloaded to nearby servers. Moreover, the privacy level was modeled
    in this paper. The trade-off and optimization among energy consumption, privacy,
    and latency were jointly considered. Furthermore, [29] investigated the trust
    mechanism for edge network by using blockchain technology. Selfish edge attacks
    were discussed in this paper. The selfish attack means MEC servers provided the
    IoTDs with fake service and less computational resources. To deal with this attack,
    the authors explored the blockchain-based reputation record system, wherein selection
    of the miner relies upon the reputation of the MEC servers.


    As the growth of IoTDs and AI applications becomes explosive, it becomes challenging
    to coordinate tasks offloading in wireless networks, especially for the ultra-dense
    wireless network [30]. To deal with this problem, authors in [30] proposed a decentralized
    platform based on blockchain. Computational tasks were first published and recorded
    in this platform, then user matching was evaluated and conducted based on the
    tradeoff between service latency and energy consumption. Moreover, offloading
    mode selection was discussed in [31], including offload tasks to a nearby server
    or a group of users. The content caching strategy was studied to handle the traffic
    issue in blockchain wireless networks. Furthermore, content caching could be used
    to extend the block capability of a blockchain platform. To be specific, hashed
    blocks were cached in MEC servers [32]. Then, images and even videos could be
    stored into the block for AI applications. Authors in [33] further optimized and
    proposed a block size adaptation scheme for video transcoding.


