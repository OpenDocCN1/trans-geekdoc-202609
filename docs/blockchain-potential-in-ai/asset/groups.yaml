    (Elliptic Curve Digital Signature Algorithm), a secure and efficient tool used
    in Bitcoin systems [7]. Hence, a quantum resilient and high efficiency algorithm
    is needed for future Bitcoin/blockchain development [90].


    Another algorithm that will bring a huge impact on blockchain is called Grover''s
    algorithm. Grover''s algorithm is a quantum computing algorithm that can quadratically
    speed up the unstructured search problem [96]. Furthermore, this algorithm has
    been used as a general trick or subroutine to obtain quadratic run time improvements
    for many other algorithms [97]. Firstly, grover''s algorithm can be used to find
    collisions in hash functions, causing hash function to lose security. Secondly,
    Grover''s algorithm can be used to accelerate mining because of its efficiency
    in searching for nonces, resulting in biasing in computational power and further
    recreating entire blockchains to manipulate the historical transactions [90].


    Last but not least, to successfully implement Shor''s algorithm, it will require
    more than 5,000 qubits to factor cryptographically significant numbers [98]. That
    is only without considering the error correction properties of quantum mechanisms.
    With error correction, the requirement may go up to as high as a million. In addition
    to the large number of qubits, it also requires hundreds of millions of gate operations
    [98]. This requirement is nearly impossible to achieve today, as Google''s best
    quantum computer can only reach 54 qubits in 2019. Note that there are many approaches
    to build quantum computers; the qubits numbers referred to here is based on digitized
    adiabatic quantum computers with a superconducting circuit [99]. Another famous
    approach is using quantum annealing [100], led by D-Wave.


    # 5.3 Conclusion


    In this part, we reviewed and summarized the state-of-the-art research papers
    related to combining blockchain and AI in different scenarios. We provided a survey
    about how blockchain network could be integrated into the MEC technology. With
    security and privacy-preserving features, blockchain could be an effective solution
    to secure the aspects of data sharing and resources allocation in AI applications,
    especially for mobile edge intelligence. Besides, we introduced multiple research
    papers with respect to how machine learning and blockchain collaborate with each
    other. While machine learning can be utilized to improve network security and
    stability of blockchain, blockchain can also automate the model learning process
    and protect sensitive training data. We further discussed some threats that would
    challenge blockchain systems, including malicious attacks and quantum computing.
    Overall, this chapter demonstrates that Blockchain and AI researches are still
    at an early stage. Once all the bottlenecks and challenges in this combined research
    area are addressed, blockchain network could become a necessary and important
    platform to enable and improve AI applications across different industries.


    # Acknowledgements


    This work was supported by Blockchain@UBC and Natural Sciences and Engineering
    Research Council of Canada (CREATE Program grant 528125).'
