    ## 2.3 元宇宙中虚实结合


    政治、经济、社会和文化互动在元宇宙中出现，元宇宙似乎模仿现实世界。图 1 展示了现实世界与元宇宙之间的互操作与融合过程 [4]。元宇宙表达了一个在现实世界中难以很好实现的替代世界。


    在代表元宇宙的虚拟现实游戏平台 Minecraft 中，由于 COVID-19 使得上学变得困难，加州大学伯克利分校的学生在 Minecraft 游戏内创建了一个校园，并举办了一场虚拟毕业典礼活动
    [5]。校长、嘉宾演讲者和毕业生都以 Minecraft 角色的形式参与，甚至毕业后抛帽子的传统也在 Minecraft 中得到了重现。


    Roblox 允许游戏开发者在 Roblox 虚拟平台上创建游戏，而无需通勤到线下办公室 [6]。在 Roblox 中，代币作为劳动的回报获得，游戏中获得的代币可以带到外部进行变现。


    在元宇宙中，众多用户可以根据平台提供的货币和交易方式自由交易商品和服务。The Sandbox 的虚拟资产 SAND 和 Digital Land 中的虚拟资产
    MANA 均在交易所上市并积极交易 [7, 8]。这意味着以比特为单位的虚拟世界中的货币可以取代现实世界中的货币。在虚拟世界的空间中共同创建游戏意味着取代现实世界空间中的空间。这意味着现实世界中的活动是虚拟空间中的比特数据，并且这些数据的重要性和可靠性受到强调。


    ## 3. 虚拟世界中的数据信任


    在第 4 次工业革命之后，虚拟世界迅速发展。现实事物已被转化为虚拟世界中的数据，虚拟世界甚至在引导现实世界方面发挥了作用。在此，我们对数据的可靠性提出了疑问，即现实事物是否在虚拟世界中准确地转化为数据。在虚拟世界中，信任技术正在成为一个重要问题。我们可以将区块链视为这些信任技术之一。


    区块链最早在 2008 年由中本聪在论文“Bitcoin: P2P 电子货币系统”中提出。区块链可以说是一种在个人之间交易中赋予信任的技术。区块链由包含数据的块和连接它们的链组成。创建和连接块的过程称为区块链，在此过程中使用共识算法。网络中参与的任何节点都可以创建块，但并非所有生成的块都会被连接，只有唯一一个块会被认可和连接。由于众多块中只有一个块会连接到前一个块，其余块被丢弃，因此参与节点之间就选择一个块达成共识至关重要。作为达成共识的方法，使用了工作量证明（PoW）和权益证明（PoS）等共识算法。如果某个块被所有节点认可为唯一块，创建该块的节点将获得加密货币作为奖励。这种行为称为挖矿，仅由挖矿创建的块连接而成的区块链称为规范链。


    区块链正在如表 1 所示发展和演进 [9]。区块链 1.0 是比特币出现后金融系统的创新时期。比特币的意义在于，它试图基于去中心化和去中心化（区块链的核心价值）构建单一的全球金融系统。


    | Blockchain 1.0 | Blockchain 2.0 | Blockchain 3.0 |

    |---|---|---|

    | 加密货币、货币转账、汇款。数字支付系统 | 智能合约、去中心化自治组织（DAO）、股票、债券、贷款、抵押品、智能财产 | 政府、公共、科学、健康、文化、艺术、物联网（IoT）、大数据、人工智能（AI）
    |


    表 1. 区块链范式演进方向。


    区块链 2.0 是以以太坊智能合约为中心的合同自动化时期。它使得无需交易中介，仅凭计算机代码即可在线执行具有法律效力的合同。这是一个显示出作为在线交易平台发展潜力的时期。区块链
    3.0 是区块链技术被普及并应用于各个行业的阶段。为了解决之前区块链的问题，正在进行共识算法变更、交易处理速度提升以及内部决策功能等技术改进 [10]。虽然预计人工智能将在区块链
    3.0 中应用于更广泛的领域，但在元宇宙环境中，区块链和人工智能的更多样化应用也预计将出现。


    ## 4. 基于区块链的元宇宙


    ### 4.1 以太坊代码


    以太坊是一个基于自身区块链设计的平台网络，用于运行各种去中心化应用（DApps）。正如互联网标准的基本框架和细节以 RFC 形式记录一样，以太坊请求评论（ERC）记录了以太坊的细节。在使用以太坊网络的
    DApp 中，代币发行的基本协议按表 2 所示表示为 ERC-编号。ERC-编号是使用以太坊网络的 DApp 发行代币时应遵循的协议。以太坊标准文档从 ERC-20、ERC-165、ERC-223、ERC-621、ERC-721、ERC-777、ERC-827、ERC-884、ERC-998、ERC-1155、ERC-1404
    等开始 [11]。


    其中，ERC-20 是与可替换代币相关的协议，ERC-20 代币具有相同的价值和功能，可以相互交换。以太坊项目正在基于 ERC-20 发行代币，并允许投资和各种业务进行。


    ERC-721 是 NFT（非同质化代币）的协议。NFT 通过在区块链上永久保存加密交易历史记录来保证唯一性。每个代币都具有唯一的识别值，对数字资产的所有权进行身份验证，并为交易分配价值。NFT
    主要用于纪念特殊时刻或收藏数字资产，最近它通过与元宇宙结合，正在创造新的数字内容业务。


    | ERC-20 | ERC-165 | ERC-223 |

    |---|---|---|

    | ERC-621 | ERC-721 | ERC-777 |

    | ERC-827 | ERC-884 | ERC-1155 |


    表 2. ERC（以太坊请求评论）-编号。


    ### 4.2 基于以太坊的元宇宙


    元宇宙是一个三维虚拟空间，其中社交和经济活动就像在现实世界中一样普遍使用。NFT 在元宇宙世界中发挥着介导互动和证明私有财产的作用。NFT 应用的一个例子是
    CryptoKitties。它是一款基于区块链的猫繁殖游戏。CryptoKitties 是一款基于以太坊 ERC-721 代币的 DApp [11]。在 CryptoKitties
    中，游戏用户只会获得世界上独一无二的一只猫。猫的数字资产具有稀有性，因为它们包含一个单独的唯一识别值，不同于现有的虚拟资产。在一般在线游戏中，当服务终止时，会出现游戏中开发的角色不再可被拥有的问题。然而，使用
    NFT 技术的数字资产可以由连接到网络的各个参与者分发和存储，以证明所有权。


    Decentraland 通过结合虚拟现实和区块链技术，在元宇宙中实现了房地产概念 [12]。Decentraland 使得可以使用 ERC-20 代币 MANA
    购买土地（一种虚拟房地产）。用户可以在 Decentraland 购买的土地上自由放置建筑物，通过向建筑物挂接广告牌获得收入，或者通过收集稀有数字内容开设展览。土地所有权和其他收藏品是
    ERC-721 非同质化代币。这些独特资产通过以太坊智能合约创建，允许所有者在区块链账本上证明所有权。加密货币 MANA 可以在交易所购买，也可以用于购买世界各地的数字商品和服务。


    Enjin Coin 是一个为游戏物品交易创建的加密货币项目，也是一个用于创建基于区块链游戏的综合平台。Enjin 是一个基于以太坊区块链的智能合约平台，是一种协议和加密货币，为游戏开发者、内容创作者和游戏社区提供创建、管理和实现虚拟商品所需的加密货币。基于以太坊的
    ERC-20、ERC-721 和 ERC-1155 代币物品可以在移动加密货币钱包中存储和管理。Enjin Coin 担保所有游戏中使用的游戏物品的所有权和货币价值。当
    Enjin Coin 作为元宇宙中的货币应用时，它不仅可以作为元宇宙中的货币使用，还可以作为具有货币价值的货币在现实世界中使用。


    ## 5. 区块链与人工智能的互补点


    ### 5.1 人工智能与区块链


    通过认知革命、农业革命和科学革命，人类已进入联合智能阶段，该阶段利用人类和机器的结合智能。如电影《黑客帝国》所示，人类与机器之间的共生关系已经开始，人工智能和区块链技术正在加速这一进程。


    人工智能正在通过使用大量数据进行模式识别和学习，达到可以进行预测和创造的阶段。人工智能还在帮助人们减少重复性任务和人为错误。区块链技术作为一种数字资产已深入我们的社会，并正在通过去中心化发展为安全可靠的交易。人工智能是第四次工业革命的核心，它可以与区块链技术集成，使人工智能和区块链都变得更加强大
    [13]。人工智能和区块链可以改变商业模式，并对社会产生变革性影响。


