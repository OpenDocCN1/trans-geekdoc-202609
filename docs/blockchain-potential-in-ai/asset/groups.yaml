    通过持续监控链上区块和活动来发起攻击。此技术提升了对系统的信任，超出了原生架构所能提供的范围 [17, 18]。


    当区块链参与者对自身数据拥有更大控制权时，他们有潜力决定与哪些方共享数据以及出于何种目的共享。为了收集参与者数据用于 AI 数据集，需要获得参与者许可。这为用户提供了“选择加入”式控制，而非“选择退出”，并有助于确保个人数据的使用方式符合所有者的意图。在某些情况下，如果去中心化身份解决方案被采用，这种情况可能会越来越普遍，用户可以因向寻求在传统和
    AI 决策模型中利用这些数据的组织提供数据而获得补偿。


    智能合约也可以保护隐私。用户授予的许可可以受到智能合约中体现的复杂规则的约束，这些规则可以强制执行关于数据使用的规定，并管理参与者数据的授予和撤销。AI 可用于扫描合同，以识别拥有或可能拥有或提供所需数据的参与者。


    区块链网络中可用数据集的规模和性质也会影响有效的 AI。由于许多不同的组织和利益相关者向共享账本提供数据，可用于分析的数据数量和变化量可能远大于单一公司数据库。更大的数据集可以实现更复杂的身份屏蔽程序，元数据可能更丰富、更具信息量。


    由于区块链账本的验证、安全性、时间戳和仅追加特性，获得的数据可能比许多组织在不可变数据库中捕获和维护的数据要干净且准确得多。


    获得数据的道德质量也将更高，模型开发者和用户可以更有信心地遵循法规。由于多维度的用户权限可以被授予和记录——在某些情况下，还可通过智能合约强制执行——组织使用此数据时隐私泄露的风险更小。此外，由于用户数据可以使用零知识证明收集，因此可以执行需要特定用户数据的复杂分析，并捕获和使用所需信息，而无需访问或持有
    PII。


    使用区块链数据和工件也可以带来更高质量的分析和结果。当数据清洁且与清晰的元数据关联时，数据的有效性会提高。由于数据集中的每个项目更受信任，可以减少错误，并通过更小的数据集获得洞察。当清洁数据用于训练
    AI 模型时，这些模型将更准确，这些模型做出的预测和决策也将得到改善。清洁训练数据也可用于验证非区块链数据以供 AI 模型使用。


    最后，也许最重要的是，AI 模型构建所基于的假设可以因多种原因而得到改善。首先，由于必须获得参与者许可并可能需要支付费用，AI 设计师需要制定清晰的设计，以定义要执行的分析并确定这些分析所需的数据类型和数量。这将要求设计师更加了解可能为这些分析提供信息的数据宇宙，以及分布式账本和个人数据文件中有哪些可用和不可用的数据。这有助于在数据收集之前或期间识别诸如照片分类算法中缺乏黑人面孔等问题。


    PII 可能永远不会被收集，而即使被收集，其使用也可能更加有意，且使用协议可能由智能合约强制执行。这使得数据收集和管理的方法更具道德性。使用道德来源和治理的数据构建的
    AI 模型可以生成在预定义道德和监管限度内可操作的结果。


    ### 6.1 新兴区块链和 AI 行业用例


    2019–2020 年 COVID-19 大流行促使医学研究人员和技术人员研究快速收集病毒暴露和传播情报的方法，以在保持用户个人隐私的同时遏制疾病传播。即时诊断依赖于对可能已接触病毒的患者进行快速检测，已被证明是追踪传播和减少疾病影响的有效方法。德国公司
    Pharmact AG 开发了一种快速 COVID-19 检测，可在大约 20 分钟内得出结果。该检测可用于即时诊断系统，并与区块链和 AI 结合，以提高诊断速度并提供阳性和阴性结果的统计数据，同时保持个人可识别数据的安全性。可以在区块链基础设施上收集数据，同时利用
    AI 提供的速度创建一个集成平台，使来自不同来源的数据可以进行分析。从这些系统中获取的信息可以为社区提供一种强大的工具，用于对抗疾病传播、减轻医疗机构负担并挽救生命
    [19]。


    许多城市正在努力通过将 AI 和区块链与其他 Web 3.0 技术（如物联网 (IoT) 传感器和边缘设备）相结合而成为“智慧城市”。智能交通系统由这些技术支持。自动驾驶汽车利用
    IoT 传感器持续监控周围情况，并使用人工智能预测发展趋势。这些汽车可以集成区块链钱包，使乘客能够在不泄露个人数据的情况下支付乘车费、租赁费、过路费等。通过将区块链作为基础架构，城市和私营公司可以简化叫车流程，从而减少租赁或共享自动驾驶汽车的摩擦。区块链的点对点特性减少了流程中涉及的人员或企业数量，去除了昂贵的中介，并降低了成本。这些系统还可以为车主和租车人提供审计追踪，并实现维护双方隐私的评级和支付系统。车辆收集的数据可以为区块链上的学习算法提供支持，以提高安全性、可扩展性和效率，同时改善城市的交通和可持续性
    [20]。


    既能保护用户隐私又能提供使用数据进行分析的智能家居系统，同样可以从区块链与 AI 的集成中受益。智能家居系统正在变得流行，制造商越来越多地启用设备间的连接。这些系统是消费者使用数据的宝贵来源。启用
    AI 的区块链系统可以用于将机器学习和训练流程推送到消费者的移动设备和边缘计算服务器。然后用户可以提交本地训练的模型进行分析，在某些情况下可以选择添加噪声，使得共享数据很难追溯到单个消费者。去中心化技术允许分析本地生成的数据，而无需将这些数据提交到中心化服务器
    [21]。


    这些用例说明了区块链和 AI 在保持个人数据隐私的同时实现目标的一些方式。随着技术人员和用户社区认识到既能提供功能又能保护隐私的系统的可能性，新的用例仍在不断开发。


    ## 7. 结论


    区块链和 AI 技术正在飞速发展，并实现了以前未曾设想的数据共享和组合可能性。


    与此同时，这些技术的进步为数据的道德使用提供了新的可能性。共享个人数据时，会给企业和个人带来两难困境，虽然可以带来宝贵的益处，但也可能给个人和共享个人数据的组织带来巨大的风险和成本。区块链提供了新的机制，例如去中心化身份和零知识证明，使数据能够以保护个人隐私并允许用户掌控自身数据的方式进行共享。这些进步既能提高网络安全，又能更符合伦理地使用个人数据。区块链参与者可以通过仔细制定治理框架和机制来实现这些结果。


