    虚拟货币只是一种使用区块链技术记录交易的私人货币形式。但这项技术可以轻易在此基础上构建，以解决问题并在多种运营类型中提高效率和效果，因此其跨行业的潜在用途是无限的。此外，交易网络相对安全、透明、快速且无国界。因此，那些试图根据虚拟货币是“骗子和怪人”的捏造物（Skidelsky,
