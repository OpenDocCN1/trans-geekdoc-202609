    Exchange Commission (SEC) filed 2018 Feb. 22 [53] Bank of America (BoA) stated
    to feel behind and “unable” to compete in the growing crypto market. In this report
    BoA recognizes that it will have to afford major costs to remain competitive in
    the cryptocurrency arena [54, 55]:


    > “Our inability to adapt our products and services to evolving industry standards
    and consumer preferences could harm our business,” BoA states in the filing; “the
    widespread adoption of new technologies, including internet services, cryptocurrencies
    and payment systems, could require substantial expenditures to modify or adapt
    our existing products and services [ ].”


    Thus, BoA decided to innovate by requesting a patent for a cryptocurrency exchange
    system. However, this has not prevented the bank from stopping their clientele
    credit card purchases of cryptos [56] as the bank is very aware of how the new
    competition will be detrimental to its prospects as read in their SEC report [57]:


    > “...The competitive landscape may be impacted by the growth of non-depository
    institutions that offer products that were traditionally banking products as well
    as new innovative products,” and “this can reduce our net interest margin and
    revenues from our fee-based products and services. In addition, the widespread
    adoption of new technologies, including internet services, cryptocurrencies and
    payment systems, could require substantial expenditures to modify or adapt our
    existing products and services [ ].”


    BoA’s declarations to the SEC as well as those made by other institutions such
    as JP Morgan Chase [58] recognized that while cryptocurrencies endanger their
    business they are “innovative”and “unlikely to disappear” as they note obvious
    advantages in several traditionally problematic or slow areas, such as cross border
    or international payments.


    With respect to Krugman’s statements [59], his opinions have been challenged [60]
    on the grounds that the Bitcoin technology is an electronic payment system designed
    to work directly between sender and receiver, thus saving the users the 2–3% or
    higher tax taken by the processors. As a payment system, this technology is ethically
    neutral even if some use it for unethical purposes. Equivalently, the banking
    system has also been used by many to make illegal payments, but we do not call
    HSBC or the Deutsche bank “evil”. Hence, one could interpret that Krugman’s opinions,
    these and others, are built on an emotional defense of the status quo: the central
    banks, payment intermediaries such as Visa or MasterCard, and the State in general.


    Virtual currencies are just a form of private money that uses Blockchain technology
    to record the transactions. But this technology can be easily built upon to address
    problems and gain efficiencies and effectiveness in multiple types of operations,
    so its potential uses across industries are boundless. Also, the transaction networks
    are comparatively safe, transparent, fast, and borderless. So economists who try
    to belittle and discredit their relevance on the grounds that these are concoctions
