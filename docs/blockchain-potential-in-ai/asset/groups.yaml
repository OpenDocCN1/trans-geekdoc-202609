    attack by continually monitoring blocks and activity on the chain. This technology
    increases trust in the system beyond what the native architecture provides [17,
    18].


    When blockchain participants have increased control over their own data, they
    have the potential to decide with which parties and for what purposes their data
    are shared. In order to collect participant data for use in an AI dataset, participant
    permissions will need to be obtained. This provides users with ‘opt-in’ control,
    rather than ‘opt-out’ and helps to ensure that personal data is used in ways that
    are consistent with the intentions of the owner. In some cases, which may become
    increasingly common if decentralized identity solutions are adopted, users can
    be compensated for providing their data to organizations seeking to utilize this
    data in traditional and AI decision models.


    Smart contracts can also protect privacy. Permissions granted by users can be
    subject to complex rules embodied in smart contracts, which can enforce rules
    regarding the use of the data and can govern the granting and rescinding of participant
    data. AI can be used to scan contracts to identify participants who have or are
    likely to possess or provide data for desired uses.


    The size and nature of datasets available in blockchain networks can also have
    implications for effective AI. Because many different organizations and stakeholders
    contribute to shared ledgers, the quantity and variability of data available for
    analysis can be much larger than for single-company databases. Larger datasets
    could enable more sophisticated identity-masking procedures, and metadata may
    be richer and more informative.


    Because of the validation, security, timestamping and the append-only nature of
    blockchain ledgers, the data obtained are likely to be much cleaner and more accurate
    than when data are captured and maintained by many organizations in databases
    that are not immutable.


    The ethical quality of data obtained will also be higher, and model developers
    and users can have increased confidence that they are following regulations. Because
    multidimensional user permissions can be granted and documented—and in some cases,
    enforced through smart contracts—organizations can use this data with less risk
    of privacy breaches. In addition, because user data can be collected using zero-knowledge
    proofs, complex analyses requiring specific user data can be performed and the
    necessary information captured and used without the need for accessing or possessing
    PII.


    The use of blockchain data and artifacts can also result in higher quality analyses
    and outcomes. When data are clean and associated with clear metadata, the validity
    of the data is increased. Because each item in a data set is more trusted, error
    can be reduced and insights can be obtained through smaller data sets. When clean
    data are used to train AI models, those models will be more accurate, and the
    predictions and decisions made by those models will also be improved. Clean-training
    data can also be useful in validating non-blockchain data for use in AI models.


    Finally, and perhaps most importantly, the hypotheses upon which AI models are
    built can improve, for several reasons. First, because participant permission
    must be obtained and possibly paid for, AI designers will need to develop clear
    designs that define the analyses to be performed and determine the type and amount
    of data needed for these analyses. This will require designers to be more aware
    of the universe of data that could inform these analyses and what is and is not
    available in distributed ledgers and personal-data files. This could help identify
    problems such as the lack of black faces in photo-categorizing algorithms before
    or during data collection.


    PII may never be collected, and when it is, its use may be more intentional and
    usage agreements may be enforced by smart contracts. This enables more ethical
    approaches to gathering and managing data. AI models built using ethically-sourced
    and governed data can generate results that are actionable within pre-defined
    ethical and regulatory limits.'
