    wallets. The wallets are handled from smartphones and computers so even though
    technically the bitcoins are not associated directly, nonetheless, they are associated
    indirectly with a person through the electronic device. Thus, illegal transactions
    can be spotted, cannot be erased, and can be tracked to a specific individual.
