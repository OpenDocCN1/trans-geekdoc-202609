  mdcn: '

    宽慰。随着传统政府供应商开始开发疫苗分发和接触者追踪技术，许多公民担心其个人医疗数据未来将如何存储和使用。Bitcoin 通过改善需要在整个价值链中共享宝贵数据的各方之间的信任和隐私来解决这些问题。示例：UNISOT
    [96]、VXPass [97]。


    - 医疗保健 – 像阿片类药物流行病这样的公共卫生危机对社区、纳税人和政府都造成沉重成本。患者数据通常分散在各个不太能相互良好通信的数据孤岛和数据库中。这导致系统出现漏洞，持证药品处方者无法验证患者可能可以同时获得多少处方。Bitcoin
    有可能通过患者控制的、可审计的记录来消除这些数据孤岛并改善公共卫生。示例：EHRData [98]


    - 税收 – 通过 Bitcoin 和微交易的力量，政府和企业的税务申报变得自动化、审计友好且效率极高。通过将税务支付要求集成到可编程智能合约中，薪资和其他税款会立即提供给政府，使其能够更快地安全收款、更准确地预算并降低欺诈风险。


    - 公共援助 – Bitcoin 上的智能合约也可用于创建可编程代币，这些代币可用于政府援助计划，例如食品券计划。这些代币可以通过仅批准购买特定基于需求的物品来减轻欺诈使用并防止滥用。


    ## 8. 区块链与人工智能


    AI 的古老神话经过几个世纪的发展：从希腊，到启蒙时代 [99]，再到 20 世纪，当时它在博弈论和定理证明方面取得了初步进展。现代 AI 概念始于 20
    世纪 50 年代，随着新型计算机的出现，设计出类似于人类行为的推理过程成为可能。在此背景下，艾伦·图灵在《计算机器与智能》[100] 中 20 世纪 50
    年代提出的“图灵测试”提供了关键进展，其方法用于判定机器是否“智能”。在这里，问题不再是机器是否能思考，而是是否能充当思考者 [101]。七十年后，AI 任务仍难以协调足够表征的需求、能够及时做出和执行决策的有效高效决策机制以及控制之间的关系。


    数据的不可篡改性、可访问性、不可否认性和去中心化，是使区块链技术可用于 AI 发展（例如智能合约）的一些属性。此外，区块链与 AI 的结合提供了可以解决区块链固有问题的方案：例如，通过降低能耗
    [102]。AI 也被证明对改进区块链和智能合约的安全性很有用 [103]，例如，通过帮助代码验证过程。


    AI 在机器中安装认知能力以使其能够学习、解释和适应等功能的技术能力，与所消耗的数据有关。这些数据通常从智能手机用户、社交媒体消费者和 Web 应用程序中收集
    [104]。因此，收集这些数据的私营和公共组织面临着信息中心化、合法性、真实性、安全性和隐私等问题。由于 AI 项目中的数据是集中管理的，因此可能会被黑客攻击和篡改
    [105]。然而，AI 也是一种工具，可为资源分配、管理大型数据集以及流程和重复性任务等重大任务提供高效解决方案 [106]。因此，区块链和 AI 的联合使用解决了与中心化相关的问题，并为与资源优化相关的问题提供了解决方案
    [107]。


    智能和自主应用旨在减少不同类型流程中的人工干预；因此，它们对个人和社会的影响引发了重要担忧。对隐私的危害、潜在歧视、公民选择和信息获受限、技能丧失、经济冲击、关键基础设施安全性，或对社会福祉的长期影响，只是这些技术进步对社会提出的关键担忧中的一些。这就是为什么这些创新的开发需要与一套明确的价值观和伦理原则保持一致。


    ## 9. 伦理设计框架


    鉴于这些新技术引发的伦理问题，不同致力于技术与社会公益交叉领域的机构已发布了一系列指南。这里将引用 Beeck Center [108] 报告的指南。不过，其他例如
    IEEE 全球人工智能与自主系统伦理考量倡议 [109]，也做出了巨大努力，以鼓励在制定自主和智能技术时优先考虑伦理因素。


    在使用区块链和 AI 时，在设计的最早阶段确立伦理方法至关重要。原因是，在后期阶段实施改变会更加困难，甚至不可能。该框架总结如下（第 21 页）：


    > (1) 为决策者提供一个以结果为导向、以用户为中心的工具，以评估其区块链设计选择的特定语境后果和伦理影响；以及 (2) 使他们能够利用这种理解做出适当的基于价值观的设计选择，以实现更好的社会成果。


    > 归根结底，这些伦理考量大致可追溯到六个根本问题：治理、身份、访问、验证和身份认证、数据所有权以及安全性。


    这些因素是三阶段框架的基础。第一阶段是一个五步流程，旨在以伦理为重点确立设计意图。第二阶段（第 40 页）是一个迭代过程，从每个设计决策对生态系统中其他每个元素（即用户、社区等）产生的影响来审视每个设计决策。第三阶段（第
    48 页）承认，随着时间推移，语境在演变，每个元素的相关性也在变化。因此，在最后阶段，会对第一阶段和第二阶段进行重新评估，以评估环境中的重大变化。


    尽管实现这些目标需要在每个项目开始时投入额外的时间和资源，但即使只考虑对智能合约环境的影响，其好处也是显而易见的。原因是，当预定义的一组条件满足时，智能合约将被部署以开始工作。也就是说，合约将由外部事件、信息系统来源或其他输入触发，这些过程将由不受伦理或法律考量约束的算法自动执行。因此，在设计智能合约时，应分析其超出合同法范畴的影响。例如，智能合约在提供技术解决方案时可以使用伦理上可接受的规则，并通过新的社会契约创建治理模型。就此而言，Reijers
    等人 2016 年的著作 [110] 分析了区块链治理的建模如何反映社会契约理论的关键思想。他们的结论（第 147–184 页）是：区块链治理 a) 由卢梭的论证所证明，即它为现有腐败机构结构提供了解决方案；b)
    由于不带歧视性，它反映了罗尔斯的“无知之幕”，尽管权力关系在公共账本中表达出来；c) 与霍布斯关于“以规则执行为准的极权主义主权者”的观点一致，并结合卢梭的去中心化治理理念以及罗尔斯关于所有人平等权利和自由的理念（即所有节点）。尽管如此，它未能纳入卢梭的公共利益理念，也未能实施罗尔斯认为对于克服初始状况至关重要的分配正义条件。（第
    147 页）。


    虽然区块链被视为一种“中立”技术，但其变革力量的政治影响在于它将重新配置经济、法律、制度和政治空间 [111]。信息时代承诺通过规模经济和更高效的资源利用带来巨大益处，但也伴随着巨大的潜在威胁，即创造大量无法跟上时代的被排斥个人。鉴于不同公民层级之间可能出现的脱节，更新的社会契约对于保护人类尊严以及所有人的权利和机会至关重要
    [112]。


    此外，任何使我们的民主进程更加透明、包容和参与的变化都将造福社会。梅拉妮·斯旺在其 2015 年的著作《区块链：新经济蓝图》[113] 中指出，这项技术将有助于出现新型治理模式和服务。例如，她提到政府将设计更有针对性的服务，以增加细分服务供给。她还列举了许多致力于开发系统以提高民主质量的努力。例如，她解释了大卫·乔姆的随机抽样选举理念
    [114]。在此系统中，随机选中的人被要求通过包含候选人辩论和活动人士情绪的选举网站进行投票。在大卫·乔姆看来，由于成本降低，可以产生更多的咨询流程。此外，人们有时间自行了解任何事务，而不是被政治广告所淹没。此外，不需要政府介入。斯旺书中讨论的第三个理念是
    DAS，即分布式自治社会。该模型制定了基于共识的去中心化治理系统和去中心化投票系统的原则。在著作中，斯旺教授将该项目讨论为一种授权民主形式，其中投票权赋予代表。此类服务的示例由
    https://liquidfeedback.org/ 提供，这是一家提供开源软件的公司，帮助提出建议和做出决策。这是一个相当有说服力的提议，因为在这种方法下，人们可以基于具体行动而非“意识形态”理论相互一致。此外，权力不会长期持有。相反，个人负责特定项目。因此，如果标准化，流动民主中的“流动”将终结当今实践的永久权力政治形式。人们可以想象到的两个直接影响是：权力重新分配给人民，以及增加政治腐败行为的阻力。尽管这种提议存在许多潜在问题，例如：权力掌握在已组织的团体或可能不愿承担这些责任的公民手中，但它实际上可能为关于个人在现代技术先进社会中的责任的全国性讨论提供一个平台。

