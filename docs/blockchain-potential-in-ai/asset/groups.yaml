    et al. [78] 改进了当前区块链网络中的常见激励机制，使其在涉及机器学习任务时更适用于区块链网络。


    ## 4.3 面向现实场景的联合研究


    这些研究人员并非提出创新且理论性的设计，而是试图探究这项联合研究如何应用于某些现实世界问题。他们的贡献在新的研究领域与交通、医院管理、供应链等传统行业之间架起了一座桥梁。


    ### 4.3.1 交通


    Pokhrel 和 Choi [79] 开发了一个数学框架，将基于区块链的联邦学习设计应用于自动驾驶汽车行业。他们利用共识机制和续期奖励方法，在分布式网络中实现车载机器学习训练。车载更新和全局模型在区块链中维护，每辆车都可见且可验证。奖励根据其被接受进入全局模型的更新大小分配给车辆车主。他们还基于仿真和数值分析讨论了该设计的局限性及系统性能。


    Hua et al. [80] 尝试将联邦学习算法应用于重载铁路管理。在其研究中，列车控制被量化为多个类别，单个列车数据适用于基于 SVM 的混合核。全局模型由智能合约管理。这项研究解决了该行业中的数据孤岛问题，异步协作学习算法的设计无需涉及中央服务器。


    ### 4.3.2 医疗健康


    医疗健康行业长期以来一直是技术进步的早期采用者，并从中获益良多。Chen et al. 在 [81] 中提出了一种名为 Health-Chain 的基于区块链的疾病分类框架。在
    Health-Chain 系统中，多个机构可以使用其患者记录训练模型，在区块链网络中异步协作，并在保护隐私的前提下为全局模型做出贡献。研究人员在两个疾病识别任务（乳腺癌诊断和
    ECG 心律失常分类）中实现了该系统，两项仿真均显示出有希望的结果。


    Kumar et al. [82] 提出了一个类似但更详细的用于检测 COVID-19 患者的监督机器学习框架。所提框架可以利用最新数据来提高 CT 图像识别率。上述两位研究人员主要专注于构建机器学习模型，区块链用于在研究机构之间强制执行共识并聚合训练模型。


    Rahman et al. [83] 全面描绘了区块链如何应用于互联健康事物（IoHT）领域。在其框架中，智能合约用于管理训练计划、信任管理、参与者身份验证和设备数据加密。该框架设计在
    IoHT 健康管理领域具有高安全性和可扩展性水平。


    ### 4.3.3 供应链


    Kamble et al. [84] 使用机器学习技术构建了一个预测模型，用于计算组织在供应链行业内成功采用区块链（BA）的概率。研究人员专注于使用技术采用文献中的心理构念来解释
    BA 的意图。该学习模型可以帮助管理人员预测其组织的准备情况。


    Mao et al. [85] 开发了一种基于区块链的信用评估系统，以增强食品供应链中监督和管理的效率。该系统从区块链上的交易者收集信用评估，通过深度学习网络直接分析评估，并为监管者的监督和管理提供信用结果。


    Yong et al. [86] 提出了一种基于区块链和机器学习技术的详细“疫苗区块链”系统。疫苗系统旨在支持追踪疫苗库存并防止供应记录欺诈。机器学习模型还可以为免疫接种执行者和接种者提供建议。


    ## 5. 讨论与结论


    ### 5.1 区块链研究中的当前威胁


    区块链系统设计为分布式。具有讽刺意味的是，大多数区块链网络都面临中心化问题。例如，PoW 机制依赖于挖矿机制的成功。哈希率越高，比特币抵御攻击的能力就越强。然而，从市场角度来看，挖取一个比特币变得越来越难。为了获得更多奖励，矿工们在共同的矿池下共享其哈希算力。如图
    5 所示，目前前 4 个矿池贡献了超过 50% 的整体哈希算力。


    换句话说，如果黑客控制或操纵前 4 个矿池，他们可能能够发动 51% 攻击。这被称为矿池攻击。除了直接控制矿池外，还提出了多种矿池攻击的变体。例如，自私挖矿是指发现下一个区块的矿工扣留信息，然后一次性释放多个有效区块，导致其他矿工失去区块奖励和区块。


    ![](img/d818f1a203fe6c57bcd1236391f7287d_62_0.png)


    图 5.

    比特币主网哈希算力分布 [87]。


    已提出许多升级版的矿池攻击，例如“先持后分叉（Fork-after-Withhold，FAW）[88]”。


    理想情况下，由于区块链的分布式特性，其对拒绝服务攻击（DDoS）具有抵御能力。然而，网络层并非完全去中心化。它包括矿池和云服务的路由器、互联网服务提供商（ISP）。超过
    60% 的比特币节点托管在不到 100 个 IP 前缀中 [89]。针对网络层的此类攻击更容易实施，并可能对整个区块链网络产生更大影响。Apostolaki
    et al. 的《劫持比特币：加密货币的路由攻击》讨论了网络层攻击、分区攻击和延迟攻击 [89]。


    ### 5.2 量子计算


    量子计算机的存在和进步将给当前技术行业带来巨大变化，从密码学 [90]、人工智能 [91] 到计算机体系结构 [92]。如今，小型到中型规模的量子计算机已经存在于大学和工业实验室中（有噪声中量级量子设备，通常称为
    NISQ [93]）。这类拥有约 50 个量子比特的有噪声设备有望在接下来的几年里展示量子优越性 [94]。量子计算机是利用叠加和纠缠等量子现象进行计算的设备。据信，量子计算机解决某些计算问题（如整数分解）的速度远快于传统计算机
    [94]。


    区块链安全高度依赖非对称加密 [90]。此外，大多数区块链网络通常使用哈希函数来压缩所有信息的内容。哈希函数和非对称加密都受到量子计算机发展的威胁，原因是
    Shor 算法 [90]，这是 Peter Shor 于 1994 年发明的解决整数分解问题的多项式时间解法 [95]。非对称加密或公钥加密基于椭圆曲线密码学（ECC）[90]设计。量子计算机主导
