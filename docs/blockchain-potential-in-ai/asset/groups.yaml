    ## 区块链与人工智能在元宇宙中的交汇


    Hyun-joo Jeon, Ho-chang Youn, Sang-mi Ko and Tae-heon Kim


    ## 摘要


    随着与计算机、图形和硬件发展相关的新技术的出现，虚拟世界已成为现实。随着COVID-19在全球传播，虚拟现实的需求增加，以元宇宙为代表的行业正在发展。在元宇宙中，这一超越现实的虚拟世界，人工智能与区块链技术正在融合。本章解释了人工智能和区块链如何影响元宇宙。


    关键词：AI、区块链、虚拟现实、元宇宙、NFT


    ## 1. 引言


    “元宇宙”一词由“meta”（意为“虚拟、超越”）和“verse”（源自“universe”的回构词）组成。非营利技术研究组织加速研究基金会（ASF）将元宇宙分为以下四类：体验无瑕虚拟故事的虚拟世界、反映当前现实世界的镜像世界、在现实世界中展示增强信息混合体的增强现实，以及捕获和存储关于人和事物日常信息的生命日志
    [1]。随着技术的发展，使用元宇宙的人数不断增加，随着与现实同等水平的活动的开展，正在产生各种大量的数据。元宇宙中生成的数据本身具有价值。在元宇宙中，数据量增加，价值增加，可靠性和安全性的重要性也在提升。需要区块链技术来保证元宇宙中数据的可靠性，并利用人工智能来确保元宇宙的多样性和丰富内容。内容将按以下顺序展开。


    在本章中，我们将以元宇宙为主题，探讨虚拟世界中人类创造本能的问题、现实与虚拟在虚拟世界中融合的现象，以及该虚拟世界中数据的可靠性。区块链和NFT技术被描述为信任技术。还将描述基于该技术构建的元宇宙平台。基本上，我们将了解区块链与人工智能之间的接口，并探讨如何通过在元宇宙中结合区块链和人工智能来创造更美好的世界。


    ### 2. 虚拟世界与创造欲望


    #### 2.1 人类的创造欲望


    人类拥有创造本能，这种创造力是区分人类与其他动物的重要因素。人类的创造力一直在创造文化。2004年发表的一篇论文将SeaCircle描述为文化的新概念，并将其视为人类创造性的文化活动。在SeaCircle的概念中，人类是精神存在，只有人类才构成文化。它解释了文化的洞察要素
    [2]。根据SeaCircle理论，创造力被解释为开放心态和精神的要素 [3]。基于SeaCircle概念，元宇宙可以被解释为一个通过解决空间和资源的一些限制，让人们更深入地沉浸于创造性活动的空间。


    #### 2.2 虚拟世界与现实世界的联系


    近来，虚拟世界与现实世界正在融合发展。第一次和第二次工业革命是通过分工最大化效率的过程，因此材料的生产和消费被分离开来。在第三次工业革命中，随着在线交易的活跃进行，数据成为一种重要商品，线下交易逐渐被线上交易取代。在第四次工业革命中，随着事物与人类高度互连，智能革命正在发生。生产和消费同时发生的融合现象正在出现，例如社会定制或数字DIY（自己设计）。由材料组成的线下世界受帕累托法则支配，该法则试图因资源有限而拥有和集中于20%的核心部分。另一方面，在信息的在线世界中，长尾理论被应用于分享并从边缘化的80%客户中发现机会。第四次工业革命正在创造一个线下与线上相遇的融合世界。这种融合正在制造、物流、金融、汽车、体育、医疗保健、教育、食品和日常生活等领域形成。此外，随着第一次、第二次和第三次工业革命中材料生产和供应问题的解决，以及在第四次工业革命阶段对人类个人欲望和精神的兴趣增加，线下世界与线上世界之间正在形成新的融合
    [4]。


    ![](img/d818f1a203fe6c57bcd1236391f7287d_73_0.png)


    图 1. 现实世界与元宇宙的关系。


