    Yao Du, Shuxiao Miao, Zitian Tong, Victoria Lemieux and Zehua Wang


    ### Abstract


    Driven by recent advancements in machine learning, mobile edge computing (MEC)
    and the Internet of things (IoT), artificial intelligence (AI) has become an emerging
    technology. Traditional machine learning approaches require the training data
    to be collected and processed in centralized servers. With the advent of new decentralized
    machine learning approaches and mobile edge computing, the IoT on-device data
    training has now become possible. To realize AI at the edge of the network, IoT
    devices can offload training tasks to MEC servers. However, those distributed
    frameworks of edge intelligence also introduce some new challenges, such as user
    privacy and data security. To handle these problems, blockchain has been considered
    as a promising solution. As a distributed smart ledger, blockchain is renowned
    for high scalability, privacy-preserving, and decentralization. This technology
    is also featured with automated script execution and immutable data records in
    a trusted manner. In recent years, as quantum computers become more and more promising,
    blockchain is also facing potential threats from quantum algorithms. In this chapter,
    we provide an overview of the current state-of-the-art in these cutting-edge technologies
    by summarizing the available literature in the research field of blockchain-based
    MEC, machine learning, secure data sharing, and basic introduction of post-quantum
    blockchain. We also discuss the real-world use cases and outline the challenges
    of blockchain-empowered intelligence.


    **Keywords:** blockchain technology, mobile edge computing (MEC), distributed
    machine learning, internet of things (IoT), data security and privacy


    ### 1. Introduction


    In the past few years, machine learning and blockchain have been known as two
    of the most emerging research areas. Machine learning is the practice of building
    learning models on the computers to parse data, and provide human-like predictions
    or decisions for some real-world problems. Blockchain, on the other hand, has
    the capability to store and process data, preserve data integrity, and govern
    peers accessibility without needing any centralized administration. Those two
    research areas are heavily data driven and each of those technologies has its
    own advantages and bottlenecks. In this chapter, we review some novel research
    on combining blockchain and machine learning, and identify how their short-comings
    can be addressed by merging these different ecosystems. Several machine learning
    techniques such as supervised machine learning, deep reinforcement learning and
    federated learning are considered as good alternative solutions to the Blockchain
    related research. We also discuss how the researchers make these two technologies
    work collaboratively to solve some real-world problems.


    The Internet of things (IoT) is a well-known technology for research and industry.
    Devices in this network can still sense and respond to the environment without
    users’ intervention. Enabling artificial intelligence (AI) in IoT has emerged
    as a hot research topic [1]. However, machine learning is a kind of computational
    task which is a heavy workload for the IoT devices (IoTDs). Usually, these low-cost
    IoT devices are battery-powered devices. On the one hand, computational tasks
    execution (e.g., training machine learning models) consumes considerable energy.
    On the other hand, the required powerful microchips are not suitable for IoTDs
    with compact physical size.


    Mobile edge computing (MEC) is a solution to the above challenges. By offloading
    complex learning tasks to the edge of Internet, IoTDs could perform machine learning
    algorithms to realize AI. The original MEC was proposed by ETSI in 2014. The description
    of MEC was “A new platform provides IT and cloud computing capabilities within
    the Radio Access Network (RAN) in close proximity to mobile subscribers” [2].
    We focus on the edge computing within the RAN in this chapter because it has been
    a standard across different industries. It will help readers to learn blockchain-enabled
    mobile edge intelligence in the most practical scenario. However, security and
    privacy issues must still be considered [3]. The IoT data leakage may lead to
    malicious attacks on individuals. Fortunately, blockchain has potential and is
    suitable for MEC [4]. The integration of MEC and blockchain is a win-win solution.
    For one thing, blockchain provides MEC with data security and privacy. For another,
    MEC can improve blockchain’s scalability and effectiveness.


    The main contributions of this chapter are listed as follows:


    - We first focus on the security and privacy-preserving features of blockchain.
    The consensus mechanisms, permissioned blockchain and zero-knowledge proof are
    jointly introduced to give a general understanding for readers;


    - We describe the blockchain-enabled mobile edge intelligence in the scenario
    of IoT systems. The potential of blockchain in edge intelligence is included;


    - The combination of blockchain and AI is further given in a two-way manner. Real
    world applications of blockchain in AI are summarized;


    - Discussions of blockchain’s threat are illustrated for future research. For
    example, the threat of quantum computing and its related research is surveyed
    in this chapter.


    The rest of this chapter is organized as follows. In Section 2, we introduce the
    security and privacy-preserving features of blockchain. Next, the blockchain-enabled
    edge intelligence is discussed in Section 3. Then, some blockchain and machine
    learning combined research is summarized in Section 4. Finally, we discuss some
    threats for blockchain-enabled systems and conclude this chapter.


