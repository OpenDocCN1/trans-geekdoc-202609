    ## 5. 我们如何判断什么在伦理上是正确的？


    在他题为《科学与革命》的塔纳讲座 [66] 中，萨格德夫表示：“知识分子群体很少直接成为革命的受益者”。用他的话说，这个群体“既扮演了患者、变革受害者的角色，也扮演了医生、准备和实施革命进程的角色
    [67]”。事实是，尽管萨格德夫指的是其他类型的起义，但比特币和区块链正在提供可比的革命环境。这场革命同样伴随着利益冲突：一方面是政治口号、权力手段、现状以及利用混乱环境谋取私利的人；另一方面是追求真理、理性和进步的智力动力。


    在萨格德夫看来，试图用智力思维去分析社会政治现象，是科学家成为“首批革命者，且往往在革命成功或失败后成为首批囚犯 [68]”的原因之一。例如，他引用了爱因斯坦和一批物理学家成为苏联哲学家攻击受害者的时期，这些哲学家要求将量子力学从“资产阶级”的不确定性原理中“解放出来”，并将相对论从虚构观察者所扮演的可疑角色中“解放”出来
    [69]。


    在那个时代，科学成为了共产主义“至高智慧”的人质，这种智慧体现在马克思主义经典宣言的公告中。许多无法经历制造“新苏联人”所需的灵魂工程过程，或无法成功躲藏的人，都被消灭了。早先的革命也经历过类似事件，例如法国大革命期间，让-保罗·马拉要求化学特别是成为一种“人民友好科学”。这导致了大规模流血事件，包括化学奠基人安托万·拉瓦锡被断头台处决，因为他关于化学本质的观点与马拉的观点不同。


    如今，我们生活在不同的时代。但我们仍能感到一种隶属状态，不是对可识别的政权，而是对众多势力——无论是大型公司、多个政府、福利国家概念，还是其他现状权力来源，如通信巨头——的隶属，这些势力也在按其方便塑造一种“新现代人”，并决定谁才是合格的知识分子。面对这些攻击，每个人可以选择“内部移民”的道路保持沉默，就像在旧苏联一样，或者面对旨在终结个人声望和声誉，甚至可能危及人身安全的协调努力
    [70]。


    以目前的情况来看，我们当前的“知识分子阶层”似乎也需要分裂为至少两个群体。例如在西班牙，那些想要进步的人可能被迫事实上“凌驾于本国政府之上”，正如席勒所建议的
    [71]，以寻找不阻碍增长的环境。原因是，在负责确保立法跟上时代现实的公务员和政客的议程中，这并非优先事项。然而，比特币和基于区块链的创新需要一个灵活、清晰、透明、敏捷且称职的监管体系。当然，这要求监管环境的人理解技术。负责机构和商业团体应当澄清什么是真实、什么是不真实，这又是另一个原因。


    显然，当企业家无法获得必要的许可证，或流程被拖延导致其发明过时，或他们怀疑其税务义务不清楚时，他们被迫重新思考自己的情况。在西班牙，希望依法组织这些业务的管理人员面临的一些问题如下
    [72]：


    - 1. 获取电子货币许可证需要很长时间。

    - 2. 鉴于主管部门对技术的理解有限，他们将其视为金融资产而非协议，因此在税务方面如何处理代币也存在不确定性。

    - 3. 进入法律沙盒的可能性和敏捷性也是如此。西班牙的沙盒刚刚获批，但仍是一团官僚和行政上的混乱。

    - 4. 公司无法100%远程设立和管理其企业，必须进行一些面对面活动。这一要求增加了设立成本，且没有任何附加价值。

    - 5. 与美国、英国和瑞士等其他司法管辖区相比，公司的税收和管理成本更高，而这些国家在提供增长方面的障碍更少。


    这些只是数字现金和区块链企业家在西班牙境内设立业务时面临的一些关键问题。这一空白很大程度上源于政府将比特币视为金融资产或金融工具而非通信协议，因此继续认为比特币用于投机和犯罪。当一个环境在法律和技术上尚未准备好接受创新时，该政府下属机构的可信度将受损。就我们的例子而言，西班牙体系中众多相关且重大的不足之处迫使许多本地创新者离开本国，在国外设立公司，主要在瑞士、英国和美国。这是因为这些国家已经成功发展出一个更透明、更用户友好的环境，既便利了公司设立率，也便利了技术向其境内的转移。


