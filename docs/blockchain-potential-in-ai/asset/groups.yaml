  mdcn: "\n\n蒂亚戈·M·费尔南德斯-卡拉梅斯\n\n保拉·弗拉加-拉马斯\n\nAI 中的区块链潜力\n\n## 导论章节：关于区块链与人工智能融合的机遇与挑战\n\
    \n保拉·弗拉加-拉马斯 和 蒂亚戈·M·费尔南德斯-卡拉梅斯\n\n## 1. 引言\n\n根据 2019 年发表的一项 PwC 全球研究，人工智能（AI）有望在\
    \ 2030 年前为全球经济贡献高达 15.7 万亿美元 [1]。在该公司 2020 年的一份报告中，预测区块链（BC）应用将在 2030 年使全球国内生产总值（GDP）增长\
    \ 1.76 万亿美元（占全球 GDP 的 1.4%）[2]。未来十年经济价值的如此提升，显示了这两项技术作为当前数字化转型关键驱动力的潜力。\n\n人工智能，特别是当今最广泛使用的技术——机器学习（ML）、深度学习（DL）或强化学习（RL）——能够创建学习模型，以处理和分析数据、执行任务或针对各种现实世界问题做出预测，而这些问题曾被认为不可能由非人类解决。然而，AI\
    \ 的使用伴随着与数据中心化导致的数据篡改可能性、假新闻和深度伪造的兴起 [3]、隐私侵犯或数据训练偏差等问题相关的社会担忧。\n\n分布式账本技术（DLT），特别是区块链（BC），可以在一组参与者之间建立信任和共识，从而消除对中介的需求。一方面，BC\
    \ 可以帮助为可解释 AI 建立数据溯源，并确保技术中使用的数据源的真实性和可靠性 [4]。此外，面向 AI 的去中心化计算使无需中介即可在去中心化的安全共享数据上进行决策。此外，利用智能合约的自主系统可以随时间学习并做出可信决策\
    \ [5]。另一方面，AI 可以帮助解决 BC 实现中的一些当前局限性，如可扩展性或安全性、保护隐私的个性化、自动仲裁和治理机制 [6]。\n\nAI 和\
    \ BC 正越来越多地用于相同甚至相同的应用。因此，预计 AI 和区块链将在不久的将来融合为 BC-AI 系统，为电动汽车智能电网 [7]、工业 4.0 自动化\
    \ [8]、关键基础设施（例如，智慧城市燃气系统 [9]）、6G 网络 [10]、车联网 [11] 或数据安全 [12] 等领域的重大创新铺平道路。此外，此类进步还可以通过联合使用其他工业\
    \ 4.0/工业 5.0 赋能技术（如物联网（IoT）、边缘计算或增强现实（AR）、混合现实（MR）或虚拟现实（VR））来实现 [13]。\n\n以往的研究概述了\
    \ AI 和 BC 融合的潜在机会 [5, 6]。然而，正如 Pand 等人 [14] 所指出的，大部分当前研究仅提供了一个理论框架来描述 AI 和 BC\
    \ 即将发生的集成。此外，大部分可用研究集中于单向集成（即，BC 如何集成到 AI 中或 AI 如何集成到 BC 中），而没有考虑其双向性，并且一般来说，它没有考虑到不同于\
    \ BC 的 DLT 的存在，这些 DLT 可能更适合 IoT 等特定场景。本书旨在帮助 AI 和 BC 研究人员开发克服当前挑战并允许两种技术融合的系统。\n\
    \n## 2. 机遇与挑战\n\nBC-AI 系统的充分发展为创新提供了众多机遇。尽管这种集成的预期未来前景广阔，但也可以指出一些未来研究人员必须面对的公开挑战。以下段落总结了需要考虑的某些方面：\n\
    \n- 1. 当前 BC 和 AI 的成熟度水平\n\n采用 BC-AI 系统将在短期和中期开辟广泛的潜在应用。然而，这是一个快速发展的领域，完全部署将涉及多个潜在研究课题：BC\
    \ 可扩展性或安全性、智能合约漏洞和确定性执行、可信预言机选举或 AI 专用共识协议。\n\n- 2. 与工业 4.0/工业 5.0 赋能技术联合使用的 BC-AI\
    \ 系统所驱动的创新\n  - IoT. 得益于去中心化 AI 算法和移动边缘计算，设备端 IoT 数据训练是可能的 [15]。然而，BC 在 IoT 应用中的使用仍然需要面对一些公开挑战\
    \ [16]。\n  - Fog and Edge Computing. IoT 设备可以将训练任务卸载到雾计算或边缘计算设备，以实现网络边缘的 AI [17]。此外，此类节点可以配备\
    \ BC 模块，允许雾节点执行本地化数据管理、访问和控制。这些分布式边缘智能框架在延迟和网络资源消耗方面具有优势，但也带来了用户隐私和数据安全等某些额外挑战\
    \ [18]。\n  - Augmented Reality (AR), Mixed Reality (MR), and Virtual Reality (VR)\
    \ (元宇宙). 此类技术提供了与数字内容交互以及创建新世界的新方式，在其中可以参与各种活动，这些活动将通过使用 BC 等可信技术加速，从而将数字内容转变为有价值的资产\
    \ [19]。\n\n- 3. 量子计算\n  - 在即将到来的量子计算时代，将开发出针对经典密码系统的新攻击，因此研究人员将不得不关注量子计算领域及其进展\
    \ [20]。\n\n## 4. 碳足迹减少与能源效率优化\n\n- 研究人员将不得不研究在部署 BC-AI 系统时如何最大限度地减少环境影响并最大限度地提高能源效率\
    \ [18]。具体而言，研究人员将不得不开发新方法来优化密码系统并减少 AI 技术的能源消耗。\n\n## 5. 标准化与法规\n\n- 虽然目前正在制定\
    \ BC 技术的标准 [21]，但在 AI 应用场景中 BC 部署的法规需要在地方和全球层面建立。此外，遵守当前立法指令意味着广泛的全球利益相关者合作以及创建概念验证，以定义确保互操作性的正确技术标准集。\n\
    \n## 6. 企业治理、企业战略与文化\n\n- 组织尝试新业务战略并进行长期投资的能力将在采用 BC-AI 创新系统方面至关重要，因为协作方法是纳入所有利益相关者并建立在降低碳排放的同时创造价值的新方式所必需的。\n\
    \n## 3. 结论\n\n本章总结了 AI 和 BC 在融合过程中将面临的最相关问题。这些问题将在本书的不同章节中得到解决，这表明了 AI 与 BC 集成的潜力。因此，本书包括了\
    \ AI 与 BC 融合的最新技术和未来研究机会。\n\n本书还涉及了需要解决的技术和实际限制，涉及可扩展性、隐私、智能合约安全性、可信预言机、共识协议、与工业\
    \ 4.0/工业 5.0 技术的交互、量子计算复原力、碳足迹减少、标准化、互操作性、法规和治理。所描述分析获得的结果将有助于指导跨学科 AI 和 BC 应用及/或该领域融合的未来开发人员，并为基于\
    \ BC-AI 系统的下一代创新的发展做出贡献。\n\n## 利益冲突\n\n作者声明不存在利益冲突。\n\n"
