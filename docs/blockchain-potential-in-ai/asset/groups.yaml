    [21]。


    ## 2.2 隐私保护特性


    2020 年，一部名为《社交困境》(The Social Dilemma) 的 Netflix 纪录片提高了人们对个人隐私风险的认识。《社交困境》向观众揭示了关于社交媒体应用程序目前如何使用智能算法控制用户行为的震撼事实，结果导致用户对自身内容上瘾，并收集用户数据以无任何监管监督的方式向用户投放广告
    [22]。


    传统银行系统通常需要许多文件才能设置一个账户。但是，注册公共区块链网络通常不需要任何身份验证，并且你可以创建的账户数量没有限制，创建账户也没有相关费用。Bitcoin
    (BTC) 和 Ethereum (ETH) 目前是最受欢迎的公共区块链网络 [5]。当你在以太坊平台上发送 Ether（以太坊中的加密货币）时，发送方和接收方都只是钱包地址，即公钥的哈希值。每笔交易都将在主网上广播。


    ## 2.2.1 许可型区块链网络


    区块链有许多用户场景。就 Bitcoin 而言，即使所有人都处于信任边缘，它也能让人们共同工作。Bitcoin 网络中的用户在一开始不需要相互信任，任何人都可以加入和退出网络。公共区块链网络主要面向货币系统，并拥有自己的代币经济。但是，公共区块链网络通常非常缓慢，且由于使用复杂的共识算法来防止恶意攻击，无法在特定场景中使用。为了使区块链网络更加有用并针对每个用例进行特定化，开发者提出了许可型区块链网络的概念。许可型区块链通常涉及由一组组织组成的联盟，这些组织负责验证交易历史，而不是要求匿名矿工参与挖矿过程
    [23]。许可型区块链在依赖数字数据的行业中很受欢迎，例如供应链管理、金融行业的清算、制造业。这些行业高度重视数据安全、数据隐私和角色定义，并热衷于追求更高效率。这些行业的运作通常类似于连锁反应；一个流程中的一个错误会导致后续流程中出现连锁反应。


    公共区块链网络对任何人开放，而许可型区块链需要身份验证作为额外的安全层。简而言之，许可型区块链上的节点都经过验证，并且它们在网络中的角色是预定义的。


    许可型网络可以用于保护敏感数据。公共区块链网络给所有用户/节点分配相等的权力。相比之下，许可型区块链网络可以拥有更复杂的内部结构以确保数据安全，并设置访问控制，以指定只有拥有权限的节点才能检索数据。


    ## 2.2.2 零知识证明和 zk-SNARK


    人们可能会想知道，公共区块链网络是否存在可以用来隐藏某些交易或保护某人的地址不被追踪的机制。零知识证明 (ZKP) 是一种证明，允许证明者向验证者证明对某个秘密的了解，而无需透露该秘密。验证者在验证前和验证后都不应获得任何知识
    [24]。这听起来不现实，因为在现实世界中，我们通过透露私人消息或信息（例如出生日期、密钥或密码）来获得对第三方的信任。关于 ZKP 有一个著名的故事。它讲的是两位数学家都声称找到了一个公式的解方程。然而，他们都不想向公众透露。后来他们举行了一场比赛，双方都为对方出了一道题，并会使用自己的方法解决对方的问题以展示他们的解决方案。验证者只需要检查他们的解决方案是否正确，以确定谁实际上找到了该公式的解。结果，双方都没有向验证者透露任何信息，但验证者仍然有足够的证据来确定谁实际上知道了解。


    一般来说，ZKP 有两类，即交互式 ZKP 和非交互式 ZKP。交互式 ZKP 更直观。它需要个人（或计算机系统）之间进行干预，以证明他们的知识和验证证明的个人。例如，数学家比赛中使用的方法基于交互式
    ZKP。交互式 ZKP 已在通信行业有许多应用，这样的系统需要稳定且持续的通信通道。非交互式证明不需要这些，它耗时更少，只需一条消息即可 [25]。它更高效，并可针对
    IoT 系统进行优化。零知识简洁非交互式知识论证 (zk-SNARK) 是一种非交互式 ZKP，并已被加密货币 Zcash 用作其核心隐私保护机制。简而言之，Zcash
    可以隐藏某些交易以使区块链更注重隐私，外部方将无法追踪许多账户的交易历史。然而，卡内基梅隆大学的研究人员发现，99.9% 的 Zcash 和 30% 的 Monero（另一种隐私保护代币）交易是可追踪的，因为用户可能没有正确使用它们
    [26, 27]。


    ## 3. 面向 IoT 的区块链赋能边缘智能


    在本节中，我们介绍区块链在边缘智能中的潜力和应用。具体来说，我们旨在描述 AI 如何在互联网边缘实现，以及区块链如何改进移动边缘智能。我们首先为读者介绍卸载策略和
    MEC 架构。然后，我们列出区块链如何在数据安全方面改进移动边缘智能。最后，我们描述了在能源供应、计算能力和训练数据大小等限制条件下，移动边缘智能系统中的区块链赋能资源分配和市场交易。


    ### 3.1 区块链系统中的任务卸载


    虽然 PoW 可以保障 Bitcoin 和类似区块链网络中的交易记录安全，但为保障 AI 应用实施此类共识机制仍然非常具有挑战性，因为这是一项计算密集型任务。具体来说，为边缘设备（即边缘智能）实现区块链赋能
    AI 需要执行两类任务。一方面，挖矿过程对于在分布式 IoTD 之间建立共识是必要的。另一方面，数据训练将在每个 IoTD 上以去中心化的方式执行。但是，IoTD
    受能源限制，无法处理复杂的计算任务。幸运的是，边缘计算能够处理这个问题。在边缘网络上实现区块链赋能 AI 的主要思想是为 IoTD 使用不同的卸载策略。如图
    2 所示，可以看到计算任务可以从 IoTD 卸载到位于不同位置的 MEC 服务器，包括小基站、蜂窝基站和云数据中心 [28]。随着 IoTD 与 MEC 服务器之间距离的缩短，计算能力会下降。


    然而，数据泄露和其他安全问题对 MEC 构成了巨大挑战，尤其是对于 MEC 赋能的区块链和 AI 应用。在 [3] 中，作者讨论了 MEC 赋能区块链网络中的隐私问题。数据处理和挖矿任务被卸载到附近服务器。此外，本文对隐私水平进行了建模。共同考虑了能源消耗、隐私和延迟之间的权衡与优化。此外，[29]
    利用区块链技术研究了边缘网络的信任机制。本文讨论了自私边缘攻击。自私攻击是指 MEC 服务器向 IoTD 提供虚假服务和更少的计算资源。为了应对这种攻击，作者探索了基于区块链的声誉记录系统，其中矿工的选择取决于
    MEC 服务器的声誉。


    随着 IoTD 和 AI 应用的爆炸式增长，在无线网络中协调任务卸载变得具有挑战性，尤其是对于超密集无线网络 [30]。为了解决这个问题，[30] 中的作者提出了一个基于区块链的去中心化平台。计算任务首先在此平台上发布和记录，然后根据服务延迟和能源消耗之间的权衡来评估和执行用户匹配。此外，[31]
    讨论了卸载模式选择，包括将任务卸载到附近服务器或一组用户。内容缓存策略被研究以处理区块链无线网络中的流量问题。此外，内容缓存可用于扩展区块链平台的区块能力。具体来说，哈希块被缓存在
    MEC 服务器 [32]。然后，图像甚至视频可以存储到块中用于 AI 应用。[33] 中的作者进一步优化并提出了一种用于视频转码的区块大小自适应方案。


