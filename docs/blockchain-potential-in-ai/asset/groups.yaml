    对新技术革命持怀疑态度并表示憎恶的公众人物。其中包括：诺贝尔奖得主保罗·克鲁格曼撰写的“比特币是邪恶的 [5, 6]”；查理·斯特罗斯撰写的“我希望比特币在火中死去
    [7]”；以及摩根大通首席执行官杰米·戴蒙的多次声明 [8, 9]。考虑到历史上比特币在被归类为“加密货币”的资产中最具辨识度和相关性，许多批评都将其作为该资产类别的代表。


    ## 2. 深网与赛朋克


    与各种数字资产之间的差异无关，加密货币——作为一种资产类别，以及区块链——作为一种技术，在市场观察者和参与者中唤起了强烈的情绪。问题的核心在于这些技术是否有其存在的必要；如果有，如何将其纳入财产和个人权利的常见范畴。除此之外，深网中个人早期利用这些技术进行非法交易
    [10]，投下了一种难以摆脱的负面阴影。这种负面印象因人们对这些技术运作机制的普遍缺乏学术研究，以及普通读者无法将它们区分开来而进一步加深。例如，人们普遍认为比特币是“不可追踪的数字现金”。因此，这种数字现金工具可能被用来逃税，并资助毒品交易、恐怖主义、绑架和勒索等各种非法活动。因此，许多加密货币的半匿名或匿名特性正是这种不利看法的核心。尽管如此，这种情绪之所以根深蒂固，也源于赛朋克运动的传奇。


    赛朋克是20世纪70年代的一场运动，主张减少政府控制——在他们看来，这抑制了经济增长 [11]。这一信念与自由主义的自由观念相结合，并认为强大的密码学可以防范政府对个人事务的干预
    [12]。该群体所拥抱的目标之一，涉及重组人们在经济上相互作用的方式。而提出的解决方案是使用一种不受政府控制的数字现金货币。魏·戴在其论文“b-money
    [13]”中描述：


    > [ ] 社区由其参与者的合作所定义，而高效合作需要一种交换媒介（货币）和一种强制执行合同的方式。传统上，这些服务由政府或政府赞助机构提供，且仅面向法人实体。在本文中，我描述了一种协议，通过该协议，这些服务可以由不可追踪的实体提供和使用。


    围绕赛朋克邮件列表 [14]，该群体主张将加密作为将权力从政府转移到个人的方式。随着公钥密码学的发展，他们开始构思未来社会如何处理货币。他们开发一种不受政府控制的数字现金货币的尝试经历了多个阶段，随着时间的推移，各种出版物描述了这种未来现金的可能结构。然而，首先将数字现金作为匿名且可交换的数字价值文件提出的，是大卫·乔姆
    [15]。他1981年的论文《不可追踪的电子邮件、回复地址和数字化名 [16]》，成为后来关于“匿名通信”研究的基石。


    赛朋克一代在开发去中心化、强大、在线货币方面取得了重大进展。例如，乔姆创建了一种算法，允许修改硬币而不破坏铸币厂的签名。在他的1982年论文“用于不可追踪支付的盲签名
    [17]”中，乔姆解释说，电子银行服务的增长和自动化支付系统的创建，将需要在个人隐私需求和支付被犯罪使用的潜力之间取得平衡。他随后总结，理想的支付系统应具备以下三个关键属性：


    - 1. 第三方无法确定个人付款的收款人、时间或金额；

    - 2. 个人能够提供付款证明，或在特殊情况下确定收款人的身份；以及

    - 3. 能够冻结已被报告被盗的资金。


    为了说明这项技术的应用，乔姆提出，通过满足上述三项属性，选民在选举活动中可以在不必前往投票站投下秘密选票的情况下进行投票。乔姆的系统将平衡保密投票的需求、验证投票已被计算的能力以及防止选民欺诈的能力。


    除了乔姆，还有几位先驱也在研究其他版本的电子现金。一个例子是哈尔·芬尼，他是一位开发者，推出了可重用工作量证明（RPOW），这是一种短命的解决方案，之所以这样命名是因为它基于工作量证明
    [18]。但是，如前所述，直到2009年，在数十年的技术演进、密码学研究的艰苦努力以及许多失败尝试之后，比特币才进入市场，成为第一款能够经受自身发展过程考验的数字现金硬币。


    ## 3. 情绪与事实，认知与现实


    人们抗拒变革有许多原因。首先，变革是一种需要时间来处理的心理体验。此外，如果变革重大且出乎意料，常见的反应是否认。在这种情况下，我们可以告诉自己没有任何相关的事情正在发生，并为自己参与这一过程开脱。对新环境感到准备不足也解释了这种排斥，因为人们被推离了舒适区。变革意味着脱离“旧方式”。因此，那些没有跟上新版本的人可能会感到被取代，并对此采取防御态度。而且，如果变革涉及新技术，个人胜任力是一个常见的担忧。人们担心自己的技能会过时，并作为一种防御机制，他们可能会对创新的成功或适当性表示怀疑。此外，变革可能意味着更多工作，这可能会演变成怨恨和其他负面情绪。最终，取决于受影响者的立场，对变革的抵制可能以多种方式表现出来，从拖延行为和懒惰到破坏和反叛。


    当新技术取代旧技术时，似乎整个社会部门都将受到损害。当受影响者抵制跟上时代时，这一点尤其真实。在这些情况下，受损部门可能非常庞大，因为它们可能包括旧技术的提供者和用户等不同行业。这些抵制过程的情绪体验被比作“非理性”（参见
    Fineman, 1993 [19]）。从这个角度看，情绪被视为问题的根源，而非实施变革过程中所面临的潜在困难的表现。从心理学角度来看，情绪不一定具有破坏性，因为它们帮助个人适应困难的情况。但它们可能会推动不健康的抵制，从而阻止处于压力下的人适当评估局势。


    前几段介绍的对变革的常见反应，部分可以解释主流媒体和社会许多有影响力的人物在报道加密货币时所展现出的强烈情绪。尽管这项创新尚新，且这些市场经历的高波动性引起了许多人的警觉，但担忧的表达方式往往显示出高度的情绪化，以及对技术的有限理解。这些“仇恨”表达通常针对所有归类于“加密货币/另类货币”标题下的产品，仿佛它们是平等或等同的资产。也就是说，一般来说，许多评论者没有区分这些资产底层技术的关键方面。无论是新闻、投资还是娱乐，电视还是书面媒体，包括社交媒体在内的在线媒体，在这些平台上发表的所有表达都塑造了数百万人思考加密货币时的视角。


    例如，在《金融时报》2018年2月15日报道的一个公开论坛上，伯克希尔·哈撒韦公司副主席查理·芒格将比特币描述为“完全愚蠢 [20]”，并补充说它应该受到政府打击。2018年3月5日，哈佛经济学家肯尼斯·罗格福特向CNBC记者表示，到2028年比特币“更有可能价值100美元而非10万美元”，暗示其价值取决于其在“洗钱和逃税
    [21]”中的作用。另一位直言不讳的比特币批评者是摩根大通首席执行官杰米·戴蒙 [22, 23]，他多次公开表达对比特币的蔑视。例如，在纽约的一次公开会议上，戴蒙声称交易这种虚拟货币“很愚蠢”，并且他
    [24] 会“立即解雇”在其公司被发现这样做的任何人。后来，在2018年8月5日阿斯彭研究所第25届夏季庆典晚宴上，戴蒙将比特币称为“骗局”和“欺诈 [25]”，并重申了他一年前发表的言论，当时他称比特币为：


    > “比郁金香狂热更糟”以及“仅适用于委内瑞拉 [26, 27]、厄瓜多尔或朝鲜 [28, 29] 之类国家的人，或者说一堆类似东西，或者如果你是毒贩、杀人犯之类，用比特币做这些事总比用美元好。”所以可能存在那样的市场，但会是个有限市场。”他进一步认为，“如果政府无法控制它们，就应该关闭它们”
    [30–32]。


    标题本身就带有强烈情绪色彩的文章有三个例子：1）诺贝尔奖得主保罗·克鲁格曼的“比特币是邪恶的 [33]”；2）查理·斯特罗斯的“我希望比特币在火中死去，[34]”以及3）诺贝尔奖得主罗伯特·席勒的“加密货币具有神秘的吸引力——但它们只是昙花一现吗？”
    [35] 这些文章中所做的一些言论字面上包括：比特币带有隐含的政治议程，它被设计为不可追踪且易于隐藏，自由主义者喜欢它因为它触动了他们对黄金的癖好的相同按钮，并且它看起来不像“法定货币”，它将在商品市场中处于中心地位，交易的商品将包括暗杀、毒品、儿童色情等等，比特币是为逃税而设计的，加密货币是由那些自视高于国家政府的人设计的
    [36]。


    鉴于许多出版物的煽情性，2018年加雷斯·詹金森提出了测试关于加密货币的“仇恨蔓延”情绪的想法。他的研究成果发表在一篇CoinTelegraph文章中：《郁金香、泡沫、讣告：透过加密货币的FUD窥探真相
    [37]》。在这篇文章中，作者指出，在比特币九年的存在期间，已有十余篇要求其“死亡”的讣告被发表。这些文章来自各行业的广泛专家和评论家，他们提供了总体


