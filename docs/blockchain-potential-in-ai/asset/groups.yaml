    to its distributed characteristics. However, the network layer is not completely
    decentralized. It includes routers, Internet Service Provider (ISP) for mining
    pools and cloud services. More than 60% of the Bitcoin nodes are hosted in less
    than 100 IP prefixes [89]. Such attacks on network layers are easier to perform
    and could have a larger impact on the entire blockchain network. Hijacking Bitcoin:
    Routing Attacks on Cryptocurrencies by Apostolaki et al. had talked about network
    layer attacks, partitioning attacks, and delay attacks [89].


    ### 5.2 Quantum computing


    The existence and advancement of quantum computers will bring a massive change
    to our current technology industry, from cryptography [90], artificial intelligence
    [91] to computer architecture [92]. Nowadays, small to intermediate-scale quantum
    computers already exist in universities and industry laboratories (Noisy intermediate
    Scale quantum devices, often called NISQ [93]). Such noisy devices with about
    50 qubits are promising to demonstrate quantum supremacy in the following years
    [94]. Quantum computers are devices using quantum phenomena such as superposition
    and entanglement to perform calculation. Quantum computers are believed to solve
    certain computational problems, such as integer factorization, substantially faster
    than traditional computers [94].


    Blockchain security heavily relies on asymmetric encryption [90]. Besides, hash
    functions are commonly used by most blockchain networks in order to compress the
    content of all information. Both hash functions and asymmetric encryption are
    threatened by the evolution of quantum computers due to Shor''s algorithm [90],
    a polynomial-time solution to integer factorization problems invented by Peter
    Shor in 1994 [95]. Asymmetric encryption or public key encryption was designed
    based on elliptic curve cryptography (ECC) [90]. Quantum computers dominate ECDSA

