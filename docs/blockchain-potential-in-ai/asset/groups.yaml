    [5]。哈希算力由比特币矿工提供，他们的计算机加入区块链网络共同计算问题。这种机制通常称为工作量证明（proof-of-work，PoW），它消耗大量电力和电能。2018年发表在《自然·气候变化》上的一项研究估计，仅比特币挖矿就可能使全球变暖升高2摄氏度
    [6]。


    此刻，一枚比特币价值约40,000美元。问题是，人们买它是为了什么？挖矿机制如此耗能是否有什么原因？有没有其他设计系统的替代方法？在接下来的段落中，我们将向您解释比特币如何实现其尖端的安全分布式账本，以及它如何允许信任边缘的人们共同工作。接下来，我们将向您介绍另一个概念，并讨论5G边缘设备如何从区块链安全中受益。


    ## 2.1 安全特性


    ### 2.1.1 工作量证明（PoW共识算法）


    PoW是比特币的底层共识算法 [7]。计算机科学中的共识算法是指在分布式进程或系统中就单个数据值达成一致的过程 [8]。这个术语常被分布式系统使用。它解释了在现代计算时代，多台服务器如何在高安全性和低错误率的情况下协同工作。更具体地说，一些服务器（或节点）可能会失败，或以其他方式不可靠（例如，被黑客攻击、数据丢失、空闲运行）。因此，共识算法必须具备容错性和韧性。共识机制有点像人类世界中的宪法——指导交互各方关于什么是可接受的决策。这是区块链系统的核心。PoW通常被认为是一种安全的共识算法
    [7]。这是一种严重依赖计算能力和加密哈希函数（也称为CHF，一种将任意大小的数据映射到固定大小位数组的数学算法）的共识机制。在深入研究此共识模型之前，需要熟悉以下两个概念：崩溃容错（Crash-Fault
    Tolerance，CFT）和拜占庭容错（Byzantine-Fault Tolerance，BFT）。


    崩溃容错（Crash-Fault Tolerance，CFT）。正如其名称所示，它可以对崩溃/停止事件具有韧性。假设您的系统已损坏或丢失连接，基于CFT的系统仍将运行并给出您预期的结果
    [9]。CFT故障模型已被学术界讨论多年，并在工业用例中成熟。大多数基于云的公司实施了不同的CFT方法以防止关键问题。我们仍然偶尔听到关于Amazon、Alibaba或Microsoft服务器崩溃/维护的新闻，开发者制作了一些开源或免费项目来向您展示他们服务器的实时状态（例如，downdetector³）。


    拜占庭容错（Byzantine-Fault Tolerance，BFT）比CFT更复杂。拜占庭容错这一名称源自Leslie Lamport、Robert Shostak和Marshall
    Pease在SRI International发表的一篇题为《拜占庭将军问题》（The Byzantine Generals Problems）的论文 [10]。


    将上述故事转化为计算机系统用例，分布式系统应当能够抵御网络中少数计算机为恶意的情况。每个非恶性实体具有相同的状态（包括行为）。公司的服务器系统大多是CFT，因为他们在网络中设置每个节点/服务器，并且非常确信出现恶意节点的机会很低。此外，他们拥有可以从先前损失中恢复的备份系统。然而对于比特币，任何人都可以加入和离开比特币链。那么，我们如何保护网络和账本系统的完整性，确保没有人拿走不属于他们的额外资金，或防止某人的资金被盗
    [7]。这是一个典型的BFT问题。


    PoW解决了在多数决策中确定代表权的问题。它是由比特币的化名创始人中本聪（Satoshi Nakamoto）[7] 提出的“一CPU一票”机制。大约每10分钟，网络会打包过去10分钟内发生的所有交易。如图1所示，它使用加密哈希函数将前一个区块的哈希、Nonce和交易哈希在一起，形成新的哈希区块。每个节点将尝试不同的nonce（数字），以找到哈希结果前面一定数量的零（挖矿难度）。这个过程称为挖矿；它耗电耗能，目前尚未找到数学上证明安全的捷径。


    PoW的优美之处在于结果可以即时验证，但除非恶意节点占据网络总计算能力的51%，否则很难篡改 [11]。随着越来越多的矿工加入挖矿以及该领域大量投资，篡改比特币网络的难度变得越来越大。然而，过去几十年关于区块链的批评也层出不穷，尤其是关于其效率、能耗和经济模式。环保主义者反对这种机制，原因是比特币网络的年耗电量接近每秒120吉瓦（GW）。相当于每秒峰值生产时49,440台风力涡轮机（每GW
    412台涡轮机）[12]。比特币PoW机制的另一个关注点是ASIC矿机。由于比特币挖矿机制就像解决数学谜题一样，


    ![](img/d818f1a203fe6c57bcd1236391f7287d_49_0.png)


    **图 1。** _区块链结构 [7]。_


    开发者从使用CPU转向使用专用集成电路（ASIC）机器来挖比特币。这一转变显著提高了比特币挖矿难度，因为ASIC是专门为挖矿目的设计的专用计算电路 [13]。因此，ASIC的性能远优于通用计算单元（CPU）。这为初学者加入挖矿带来了巨大障碍，并将进一步增强比特币挖矿的中心化，更不用说比特币矿工市场处于相对垄断状态，因为66%的矿工市场份额被Bitmain⁴占据。


    ### 2.1.2 替代共识机制


    由于上述缺点以及对PoW机制的担忧，设计师开发了一种名为权益证明（Proof-of-Stake，PoS）的新共识机制，其中矿工根据其贡献的“工作量（哈希算力）”获得激励。相比之下，PoS机制要求矿工质押代币以参与新区块生成。这一概念最早由Peercoin于2012年讨论
    [14, 15]，后来成为许多加密货币中流行的讨论和实验话题。


    与PoW机制相比，PoS更简单。你质押得越多，对确定下一个区块的影响力就越大 [14]。这一假设基于这样的前提：高质押节点不太可能撒谎，因为如果它们试图篡改链条，将面临巨大损失。在这种情况下，节点不再需要解决加密谜题。显然，与PoW相比，PoS更加环保。此外，更少的计算将进一步提升网络交易速度和吞吐量
    [16]。目前有两种PoS共识模型：基于链的权益证明和联盟共识模型 [14]。基于链的权益证明选择可用性而非一致性 [17]。算法在每个时间槽中伪随机选择一个验证者。验证者随后有权创建一个区块，并将其指回之前最长的链。联盟共识模型选择一致性而非可用性。在每次投票过程中，每个节点按其质押的代币比例计数。


    显然，更富有的节点获得奖励的机会更高。为了避免垄断情况，大多数PoS算法需要一种随机选择模型。每个代币都有自己的代币经济学，其中一些包含代币年龄设计，即质押时间越长的代币越有可能被选中。一般来说，网络希望持有者尽可能长时间地质押验证代币并充当主机。


    随着不同国家和地区对5G网络的快速采用，边缘计算和边缘设备将在网络中发挥重要作用。区块链目前是尖端的安全网络系统，并在边缘计算中有许多用例 [18]。在即将到来的5G时代，越来越多的设备将接入网络，因为5G的主要目标之一是支持物联网（IoT）[19,
    20]。如预测所示，数据传输速率和量将呈指数级增长，因此最近的研究论文已经确定了为边缘设备提供安全通信渠道和共识算法的必要性。5G网络的边缘设备通常不是为了进行重型计算而设计的。因此，5G时代需要一种新的共识模型。作为成功共识模型之一，PoS由于其更简单的结构、高安全特性和完全去中心化的特点，在物联网时代具有潜力。除了PoS，委托权益证明


