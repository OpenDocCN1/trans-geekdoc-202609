    ![](img/d818f1a203fe6c57bcd1236391f7287d_35_0.png)


    图 1.

    网络安全违规与记录曝光。


    大部分被收集和存储的数据都受政府和企业的控制，这些实体收集了大量个人信息，并有责任确保其安全。与此同时，这些组织可能会将这些数据货币化，无论是通过使用它们来改进自身的运营和产品，还是将其出售给第三方。生成和收集的数据量呈指数级增长，扩大了用户的数据足迹。数据整合者能够跨数据源关联数据元素，并以数据收集方和提供信息的用户都从未预料到的方式组合数据。


    **图 1** 使用了由 Statista [4] 提供的数据，展示了积累这些大型数据库的成本。Statista 是一家统计研究公司，跟踪网络安全失败和趋势。一份最近发布的
    Statista 报告显示，这些事件正在增加，尤其是在过去五年中，凸显了需要改进数据保护方式。应当指出，2020 年据信由俄罗斯发动的一次大规模网络违规事件可能导致
    2020 年的数字更高，尤其是在暴露记录类别中，因为该事件被认为具有重大意义。在本出版物发布时，该安全事件的范围仍在调查中。


    ## 4. 隐私法规


    在世界上许多地区，隐私权被视为基本人权。这种隐私可能延伸到个人控制其自身个人数据的权利。必须仔细捍卫这一权利，因为个人个人数据的所有权和管理会影响与他人的关系，甚至影响数据所有者的身份
    [5]。


    规范个人数据如何被收集和管理的法规正在快速制定。欧盟通过《一般数据保护条例》(GDPR) 在隐私立法方面走在了前列，该条例于 2016 年通过。该法律要求，为与欧盟成员国进行交易而收集欧盟公民个人数据的组织，必须仔细保护这些数据以确保隐私。


    在美国，加州隐私权法案 (CPRA) 扩展了 2018 年的《加州消费者隐私法案》(CCPA)，并从 GDPR [6] 采纳了许多原则。CPRA 旨在为加州居民提供以下权利：


    - 1. 了解正在收集哪些个人数据

    - 2. 了解数据是否被出售或披露以及披露给谁

    - 3. 拒绝出售其个人数据

    - 4. 访问其个人数据

    - 5. 要求企业删除任何个人数据

    - 6. 行使隐私权时不受歧视 [7]


    在联邦层面，消费者在线隐私权法案 (COPRA) 于 2019 年 12 月由 Maria Cantwell 领导的民主党参议员提出。虽然该法案尚未通过，且之前的联邦隐私法案也均未成功，但政府机构仍在继续推动更严格的数据治理法律
    [8]。


    隐私法律直接影响公司的运营方式，并将要求使用消费者数据的企业实施系统和运营实践，以便遵守这些新法规。区块链和分布式账本技术在帮助公司遵守与个人财产和数据隐私相关的现有及潜在未来法规方面处于独特位置。


    ## 5. 区块链与隐私


    区块链解决方案的显著好处之一在于，它们使组织能够以前所未有的方式共享数据，为增强协作、提高运营效率和扩大收入开辟了可能性。在这些环境中，关于如何保持数据隐私的问题更加突出，因为数据存储在多个区块链参与者可能访问的共享账本中。


    ConsenSys（一家区块链技术解决方案公司）在讨论公有区块链安全性时认为：“实际上，隐私不是任何区块链的属性。相反，可以将隐私层应用于任何区块链……”[9]。设计师必须仔细考虑哪些各方被允许读取和写入交易，以及交易如何广播、验证和存储。关于如何更新和强制执行权限和安全措施的其他问题也是重要的考量因素。关于谁拥有数据以及组织和计算机应用程序如何使用数据的决定，进一步使隐私讨论复杂化
    [9]。


    ### 5.1 去中心化身份


    自主身份是区块链支持者中广泛持有的观点，认为个人应当控制自己的身份，并对身份的哪些方面与他人共享拥有自主权。去中心化身份 (DID) 是自主身份的一种区块链支持实现，能够深刻改善个人数据的隐私与安全性。


    DID 是指个人对与身份多个要素相关的个人数字数据的所有权。参与制定 DID 标准的 Microsoft 站在个人的角度来看：“目前，我们的身份和所有数字交互都由其他各方拥有和控制，其中一些我们甚至都不了解
    [10]。”将数据所有权归还给数据所涉及的个人，既可以惠及这些个人，也可以惠及原本需要负责保护数据的组织。


    区块链技术支持 DID，并为个人提供了一种在其交易对方的数据库之外存储自身数据的方式。数据由这些个人拥有和控制，指向这些数据或元数据的指针可以存储在区块链上，并可用于验证用户关于其个人数据所提出的声明的有效性。例如，驾驶执照办公室可能会向用户签发驾驶执照，用户将其私下存储。当保险公司或其他方希望验证用户是否持证时，用户可以将执照出示给诸如保险公司之类的一方，该方可以独立验证签发机构和到期日。


    任何人都可以创建 DID。当此身份首次创建时，没有任何信息附加到其上。随着时间的推移，用户可以将驾驶执照或其他识别数据附加到该 DID。第三方可能用来验证特定人拥有
    DID 的过程，类似于验证某人拥有电子邮件地址的过程。例如，网络游戏账户可以附加到电子邮件地址。寻求验证某人是该账户所有者的一方可以向该电子邮件地址发送私人消息（例如安全代码），并要求该人提供该代码，只有拥有该电子邮件地址密码的人才能提供。


    与电子邮件账户不同，DID 将由个人拥有和存储，而不是由电子邮件服务提供商拥有和存储。密码或私钥也将由所有者妥善保管。与身份相关的个人信息可以存储在身份中心（identity
    hub）中——身份中心是一个加密的个人数据存储库，存储在区块链之外，可能是手机、PC 和云端数据或离线存储设备的组合 [10]。通过使用身份中心，个人可以控制向外部方共享哪些信息片段。


    DID 降低了不想要的关联概率。使用通用标识符（例如不同网站上的电子邮件地址）会创造所谓的关联问题。在此语境下，关联是指实体可以在未经用户同意的情况下，跨多个系统关联关于单一身份的信息。电子邮件地址几乎用于每个网站。当用户在不同网站上提供相同的电子邮件地址（可能还附加电话号码或实际地址等额外个人信息）时，他们无意中启用了潜在的关联可能性。在这种情况下，实体可以跨网站关联这些数据。


    ![](img/d818f1a203fe6c57bcd1236391f7287d_37_0.png)


    图 2. 去中心化身份与服务提供商。


    '
