    ## 基于区块链的移动边缘智能、机器学习和安全数据共享


    杜遥, 苗淑晓, 童子天, 维多利亚·勒米厄和王泽华


    ### 摘要


    受近期机器学习、移动边缘计算 (MEC) 和物联网 (IoT) 进步的推动，人工智能 (AI) 已成为一项新兴技术。传统机器学习方法要求训练数据被收集并在集中式服务器中处理。随着新型去中心化机器学习方法和移动边缘计算的出现，IoT
    设备端数据训练如今已成为可能。为了实现网络边缘的人工智能，IoT 设备可将训练任务卸载到 MEC 服务器。然而，这些分布式边缘智能框架也引入了一些新挑战，例如用户隐私和数据安全。为解决这些问题，区块链已被视为一种有前景的解决方案。作为分布式智能账本，区块链以高可扩展性、隐私保护和去中心化而闻名。该技术还具有在可信方式下自动执行脚本和不可变数据记录的特点。近年来，随着量子计算机变得越来越有前景，区块链也面临着量子算法带来的潜在威胁。在本章中，我们通过总结基于区块链的
    MEC、机器学习、安全数据共享研究领域以及后量子区块链基本介绍的可用文献，对这些前沿技术的当前最先进水平提供了概述。我们还讨论了现实世界中的用例，并概述了基于区块链的智能所面临的挑战。


    **关键词：** 区块链技术，移动边缘计算 (MEC)，分布式机器学习，物联网 (IoT)，数据安全与隐私


    ### 1. 引言


    在过去几年中，机器学习和区块链已被公认为两个最具前景的研究领域。机器学习是在计算机上构建学习模型以解析数据，并为某些现实世界问题提供类人预测或决策的实践。另一方面，区块链具有存储和处理数据、保护数据完整性以及无需任何集中式管理即可管理对等体访问的能力。这两个研究领域高度依赖数据，每种技术都有其自身的优势和瓶颈。在本章中，我们回顾了一些关于结合区块链和机器学习的新颖研究，并识别了如何通过融合这些不同的生态系统来解决它们的不足之处。受监督机器学习、深度强化学习和联邦学习等多种机器学习技术被认为是区块链相关研究的良好替代方案。我们还讨论了研究人员如何使这两种技术协同工作以解决一些现实世界问题。


    物联网 (IoT) 是研究和工业领域广为人知的技术。该网络中的设备可以在无需用户干预的情况下感知并响应环境。在 IoT 中启用人工智能 (AI) 已成为一个热门研究课题
    [1]。然而，机器学习是一种计算任务，对 IoT 设备 (IoTDs) 来说是沉重的工作负载。通常，这些低成本 IoT 设备是电池供电设备。一方面，计算任务执行（例如，训练机器学习模型）会消耗大量能源。另一方面，所需的强大微芯片不适用于体积小巧的
    IoTDs。


    移动边缘计算 (MEC) 是解决上述挑战的方案。通过将复杂的学习任务卸载到互联网边缘，IoTDs 可以执行机器学习算法以实现 AI。最初的 MEC 由 ETSI
    于 2014 年提出。MEC 的描述是“一个新平台在无线接入网 (RAN) 内靠近移动用户提供 IT 和云计算能力” [2]。我们在本章中关注 RAN 内的边缘计算，因为它已成为跨行业的标准。这将帮助读者在最实际的场景下了解基于区块链的移动边缘智能。然而，安全和隐私问题仍必须考虑
    [3]。IoT 数据泄露可能导致对个人的恶意攻击。幸运的是，区块链具有潜力并且适合 MEC [4]。MEC 与区块链的集成是一种双赢方案。一方面，区块链为
    MEC 提供数据安全和隐私。另一方面，MEC 可以提高区块链的可扩展性和有效性。


    本章的主要贡献如下：


    - 首先，我们关注区块链的安全性和隐私保护特性。共识机制、许可型区块链和零知识证明被共同介绍，以让读者获得整体理解；


    - 我们在 IoT 系统场景中描述了基于区块链的移动边缘智能。包含了区块链在边缘智能中的潜力；


    - 区块链与 AI 的结合以双向方式进一步给出。总结了区块链在 AI 中的现实世界应用；


    - 为未来研究说明了区块链威胁的讨论。例如，本章调查了量子计算威胁及其相关研究。


    本章余部分的组织安排如下。在第 2 节中，我们介绍区块链的安全性和隐私保护特性。接下来，在第 3 节讨论基于区块链的边缘智能。然后，在第 4 节总结了一些区块链与机器学习相结合的研究。最后，我们讨论基于区块链系统的一些威胁并结束本章。


    ### 2. 区块链的安全性和隐私保护特性


    区块链因其安全性而闻名，当今最著名的区块链社会实验是比特币。作为一项革命性发明，比特币


