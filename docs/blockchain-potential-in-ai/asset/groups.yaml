    在其1986年题为《合法性能否以合法性为基础？》[73]的讲座第一部分中，尤尔根·哈贝马斯质疑“合法性”是否可能基于“合法性”。为了突出该说法中隐藏的冲突和不一致，他使用了马克斯·韦伯关于西方政治制度作为“法律统治”
