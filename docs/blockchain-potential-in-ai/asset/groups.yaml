    被认为是自互联网问世以来最具前景的创新，区块链这项发明被预言将带来巨大的财务收益。这些收益将源于其融入流程以简化和保障全球无数领域去中心化交易所带来的经济影响。区块链尤其适用于所有权历史至关重要的场景，例如制药行业、土地登记、房地产、盗版和版权问题，以及公共服务，如医疗援助和福利支付（Tapscott
    et al., 2016 [80, 81]）。在这项创新的终极形式中，存在自动执行合同，它们可以在人工智能辅助和最少人工干预下运行。使用区块链将为当前困境提供更高的效率和更具成本效益的解决方案。随着旧技术的替代，区块链将减少欺诈，增加信任和安全性，并改善多方交易的透明度。


    鉴于所有这些，人们本应期望公共机构会团结起来欢迎和协助推动上述发展。然而，在当前政治和经济恶化的氛围中，政治和现状议程控制着发展速度，科学界和愿意资助这些项目的企业家在一种相当敌对的心理氛围中感到无所适从。


    ## 7. 通过公开可扩展区块链恢复政府的信任、透明度和效率


    1822年8月4日，詹姆斯·麦迪逊 [82] 在致W. T. Barry的信中表示：


    > “没有民众信息或获取信息手段的民众政府，只不过是闹剧或悲剧的序幕；或者两者兼而有之。知识将永远统治无知：一个打算自己做管理者的民族，必须武装起知识所赋予的力量。”


    透明度和问责制是自由民主社会中两个最基本的原则。它们是知情选民做出自信选举决策与广泛不信任“服务于自身利益、专制腐败的机构”之间的桥梁。此外，随着腐败不断削弱全球民主政府的合法性和可信度，透明度和问责制变得更加重要。根据皮尤研究中心的数据，美国公众对政府和当选官员的不信任已削弱至历史最低点
    [83]。公民骚乱、暴力抗议以及反对政府政策、政客和媒体组织的频繁示威活动的兴起凸显了这一问题 [84, 85]。公众对政府和新闻媒体的信任削弱可归因于许多因素，其中许多因素与所传播信息的诚实、开放和信心或其缺乏有关。


    2011年，美国启动了一项全面的数字政府战略，旨在建设21世纪的数字政府 [86]。行政命令强调：


    > “政府管理人员必须从私营部门中有效的做法中学习，并将这些最佳实践应用于以更好、更快、更低成本的方式提供服务。此类最佳实践包括越来越受欢迎的低成本自助选项，可通过互联网或手机访问，以及改进的流程，能够更快、更灵敏地提供服务，从而减少对客户询问和投诉的总体需求。联邦政府有责任简化并提高其服务交付效率，以更好地服务公众。”


    然而，十年后我们仍能发现政府对技术转变反应缓慢的证据。例如，2020年12月，网络安全与基础设施安全局透露，一场持续一年的黑客攻击影响了美国私营公司、政府机构和关键基础设施实体
    [87]。这些包括：美国财政部、国土安全部、国务院、国防部、商务部、国家卫生研究院、疾病控制与预防中心和司法部等无数其他机构。总计，估计有18,000个实体成为俄罗斯黑客攻击的受害者。这场相对不为人知的黑客攻击预计将使美国企业和纳税人损失超过1000亿美元
    [88]。针对普通公民的此类攻击如此频繁，以至于这些行为的伦理方面与所有其他后果模糊不清，而这些后果会随时间呈指数级增长。


    ### 7.1 利用比特币建立信任：现在是区块链改革的时刻


    与互联网的变革性特征类似，公共区块链有能力通过提供更大的透明度和可审计性以及一个超高效的“普遍真理源”数据管理平台来颠覆政府流程，该平台可用于恢复信任、验证数据并显著降低成本。自2008年中本聪发表比特币白皮书以来，这一愿景已成为现实，该白皮书为长期存在的问题（如可扩展性障碍等）提出了解决方案
    [89]。


    比特币被设计为一个开放和诚实系统的基础，该系统是公开的，有一系列制衡机制，并基于工作量证明提供参与激励。在比特币网络上，每笔交易都记录在由被称为交易处理器的专业分布式节点小世界网络维护的公共账本上。当交易广播时，处理器会收集、验证、加时间戳，并将每笔收到的交易添加为一系列基于哈希、事先商定的事件链，安全地保存在不可更改信息的块中。


    如前所述，与普遍看法相反，比特币不仅仅是金融价值的转移或存储。比特币建立了一个普遍真理源，信息可以在那里存储、验证、共享、保护和认证。这可以与传统系统或利用云到链解决方案的新型混合选项结合使用。并非所有数据都必须存储在链上，而是可以通过在云中对信息进行哈希处理并将该哈希的副本存储在链上来简单地对其进行认证。这将确保存储在云中或其他地方的数据可以简单地进行认证，以确认其未被更改。


    通过去除真正的中心化瓶颈来恢复比特币原始协议，已使真正的创新和无限的链上扩展成为可能。2020年5月，比特币SV区块链处理了一个世界纪录大小的369 Mb区块，包含了130万笔交易。事实上，该网络已经突破每秒近4,000笔交易（tps），预计今年晚些时候将达到50,000
    tps。通过扩展带来成本效率，中本聪的愿景在转移微型甚至纳米交易方面依然无与伦比，中位交易费为1/100美元分。借助比特币SV安全、即时、低费的交易，政府组织可以显著降低与金融和数据交易相关的成本。这些节省可能还因审计、网络安全和网络硬件相关成本的降低而叠加。


    ### 7.2 比特币可以帮助政府今日恢复透明度和信任


    比特币SV已准备好通过向公共部门提供完全的透明度和效率，来实现区块链改革时代的承诺。虽然政府机构只需从常见的信息请求开始，但传统上，采购阶段长期被视为将政府技术需求与能够集成最新新兴技术的供应商连接起来的最大障碍之一
    [90]。其后果是，许多小型企业和行业外部人士被完全排除在参与之外，因为该过程可能非常复杂、耗时且昂贵。相比之下，大量变革性的区块链解决方案正等待着通过改善透明度和恢复信任来为更道德的社会做出贡献。其中一些包括：


    - **金融交易管理** – 作为分布式账本，比特币可即时记录网络中发生的有效交易的会计核算。只需支付少量交易费（每字节.00011），交易处理器就会在安全账本上记录一条条目。与现代交易管理系统的成本相比，比特币提供了无与伦比的节省、可审计性、安全性，并通过智能合约和代币的集成提供互操作性。示例：**代币化**
    [91]


    - **监管合规** – 由于交易被验证并公开记录到比特币区块链，它们由不可更改的工作量证明保护。这使监管机构、新闻媒体和政府监督团体能够实时访问可共享和信赖的合规相关数据。作为回报，这减轻了政府机构的报告和审计负担，降低了成本并提高了透明度。政府采购机会的智能合约将确保合规性、公平性并提高总体实施速度。示例：**nChain**
    [92]


    - **身份管理** – 与集中式政府数据库不同，比特币提供了一个更安全的分布式数据管理平台，可以赋予公民轻松签署和验证其身份以用于官方政府文件或福利的能力。这也将减少政府验证身份和保护敏感数据所需的时间和资源——尤其是在限制性的跨机构数据孤岛中。示例：**合法链条**
    [93]


    - **登记** – 通过比特币独特的数据管理网络管理任何类型的记录或登记的能力，消除了政府高效管理和验证数据的整体复杂性。这将消除处理土地产权、公司注册以及包括出生、结婚、离婚、刑事或死亡在内的每一种其他类型记录的摩擦。该账本将作为一个诚实的、普遍的真理来源，可以大幅减少欺诈和腐败。示例：**Elas
    Digital** [94]


    - **区块链投票** – 正如我们在2020年美国总统选举周期中所见，公民相信投票过程的完整性至关重要。对返回结果的怀疑，无论是由于错误、欺诈、黑客攻击、腐败还是缺乏透明度，都可能在选民中制造不信任的氛围。比特币防篡改的公共账本非常适合在未来消除选举欺诈——当与基于身份的代币结合时，选民可以使用任何类型的设备轻松投票，消除障碍并增加参与度。示例：**第二层技术（B-vote）**
    [95]


    - **供应链可追溯性** – 冠状病毒大流行向所有人展示了在中断期间我们的全球供应链可能有多脆弱。政府机构竞相定位、采购和分发医疗装备、物资和个人防护设备。这在民众中引发了恐慌，因为医疗服务要么被拒绝、延误，要么因重复使用防护装备而受到损害。供应链缺乏可追溯性继续困扰着COVID-19


