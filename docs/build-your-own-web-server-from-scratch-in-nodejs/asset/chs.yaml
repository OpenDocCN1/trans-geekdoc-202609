  \n109\n\n2024-02\n\n### WebSocket 握手\n\nWebSocket 握手包含一些额外的头部：\n\n- 客户端发送 `Sec-WebSocket-Key`。\n\
  - 服务器通过 `Sec-WebSocket-Accept` 响应。\n\n握手的一些原因如下：\n\n1. 服务器理解 WebSocket。\n2. `Sec-WebSocket-Key`\
  \ 字段用于防止 WebSocket 缓存。\n3. 代理服务器可能会缓存 101 状态码。\n\n哈希值通过以下代码计算：\n\n```javascript\n\
  function wsAccept(key) {\n  return crypto.createHash('sha1')\n    .update(key)\n\
  \    .digest(\"base64\");\n}\n```\n\n### Connection 字段\n\n`Connection` 头部用于从 HTTP/1.1\
  \ 切换到 WebSocket。这是为了扩展协议。\n\n110\n\n2024-02\n\n### 13.2 WebSocket 协议\n\n### 帧格式\n\
  \n握手之后的连接部分由一系列帧组成。\n\n| 字节 0 | 字节 1 | 字节 2 | 字节 3 |\n| :--- | :--- | :--- | :---\
  \ |\n| 0 1 2 3 4 5 6 7 | 0 1 2 3 4 5 6 7 | 0 1 2 3 4 5 6 7 | 0 1 2 3 4 5 6 7 |\n\
  | 标志 | 掩码 | 长度高 | 长度低 |\n| FIN | | | |\n| RSV1 | | | |\n| Op | | | | |\n| | | |\
  \ | | | | | | | | | |  0 1 2 3 4 5 6 7 | 0 1 2 3 4 5 6 7 | 0 1 2 3 4 5 6 7 | 0 1\
  \ 2 3 4 5 6 7 |\n| 掩码位 | | | | | | | | | | | | | | |\n\n注意：处理帧比处理 HTTP 要简单得多：\n\n\
  1. 第一字节包含 `FIN` 标志和 4 位 `opcode`。\n2. 第二字节中的 `MASK` 位指示可选的 `mask-key`。\n3. 接下来的字段是负载长度，以\
  \ 7 位整数编码：\n   - 0 到 125 的长度存储在该 7 位整数中。\n   - 126 表示后续为 16 位大端整数。\n   - 127 表示后续为\
  \ 64 位大端整数。\n4. 如果 `MASK` 位被设置，则后续有一个 4 字节随机掩码。该 4 字节掩码与负载数据进行异或。掩码必须用于客户端到服务器的帧，但反向则不然。掩码的目的是防止一种类型的[缓存攻击](http://www.adambarth.com/papers/2011/huang-chen-barth-rescorla-jackson.pdf)。\n\
  \n### 帧类型\n\n数据消息的 码：\n\n- `0x01`: 文本数据消息。用于应用程序。\n- `0x02`: 二进制数据消息。用于应用程序。\n-\
  \ `0x00`: 消息分片。稍后讨论。\n\n文本和二进制的区分取决于应用程序。\n\n控制消息的 码：\n\n- `0x08`: 用于优雅终止的控制消息。可选负载包含状态码和字符串消息。\n\
  \n\n\n` 标签中似乎中断了（到 `Event`.` 处结束），我将针对你提供的**已给出文本**进行翻译。\n\n[content]\n\n- `0x09`\
  \ 和 `0x10`：Ping 和 pong，即心跳包。用于保持连接活跃和探测断开连接。对于应用程序可以是透明的。\n\n## 分片消息\n\nWebSocket\
  \ 还支持在不预知消息长度的情况下发送消息，类似于 HTTP 中的分块传输编码（chunked transfer encoding）。一个“逻辑”数据消息可以被分成多个帧（frames），但应用程序看到的是合并后的消息。\n\
  \n- 第一帧的操作码（opcode）为 `0x01` 或 `0x02`，其余帧使用 `0x00`。\n- 最后一帧设置了 `FIN` 标志。\n- 只有数据消息（opcode\
  \ `0x01` 和 `0x02`）可以被分片。\n- 不同消息的帧不能交替出现，控制消息除外。\n\n一个包含 3 个分片的示例：\n\n| opcode=0x01,\
  \ FIN=0 | opcode=0x00, FIN=0 | opcode=0x00, FIN=1 |\n\n未分片的消息被编码为单帧，操作码为 `0x01`\
  \ 或 `0x02`，并设置了 `FIN` 标志。\n\n类似于分块传输编码的设计，你可以将任意大小的数据作为单条消息流传输。但许多实现将消息数据表示为单个缓冲区，因此消息大小存在限制。\n\
  \n## 13. WebSocket 与并发\n\n### 13.3 并发性编程简介\n\n#### 竞态条件\n\n在基于消息的设计中，由单个消费者消费多个消息源的情况很常见，例如多个并发任务通过单个\
  \ WebSocket 发送消息。\n\n由于 WebSocket 消息被序列化为单个 TCP 字节流，对套接字的并发写入会破坏协议。\n\n让我们用一个假设的示例来来说明这个问题。\n\
  \n```javascript\n// 伪代码！\nasync function send(conn, msg) {\n  await write_header(conn,\
  \ msg);\n  await write_body(conn, msg);\n}\n```\n\n在这个示例中，写入 1 条消息涉及 2 次套接字写入，且代码在每个\
  \ `await` 语句处都会让给运行时。问题是，当返回运行时后，运行时可能会调度另一个也在发送消息的任务，导致套接字写入发生*交替*现象。\n\n这在并发编程中被称为\
  \ `race condition`（竞态条件）。注意，这与单线程运行时或 CPU 核心数*完全无关*。\n\n#### 原子操作\n\n你可能认为解决方案是每条消息只使用\
  \ 1 次套接字写入。然而，这种解决方案是……\n\n- 仅在套接字写入是原子的情况下正确，而这可能无法保证。\n- 并不总是可行且不方便。考虑到 WebSocket\
  \ 消息可以被分片并像流一样使用。\n\n#### 使用互斥锁实现互斥\n\n一种解决方案是使用锁（`mutex`）来限制对套接字的并发写入。\n\n在并发访问的情况下，一个任务持有\
  \ `lock`，其他任务在 `await` 语句处阻塞，释放锁将解除其中一个等待者的阻塞。`mutex` 是许多并发环境中 `synchronization\
  \ primitives`（同步原语）之一。\n\n#### 使用队列多路用\n\n防止并发访问的另一种解决方案是使用队列。队列接收来自并发生产者的 WebSocket\
  \ 消息，由一个专用任务从队列中消费并写入套接字。\n\n```javascript\n// 伪代码\nlet queue = createQueue();\n\
  // 用于多个生产者\nasync function produce(msg) {\n  await queue.pushBack(msg);\n}\n\nasync\
  \ function single_consumer() {\n  while (running()) {\n    const msg = await queue.popFront();\n\
  \    // 写入套接字\n  }\n}\n```\n\n`mutex` 也是队列的一种形式，它不传递数据，而是传递控制权。\n\n#### 使用阻塞队列进行流量控制\n\
  \nJS 数组是一个可以 `push` 和 `pop` 的队列。但它对并发编程并不可好用。作为消费者，你如何知道队列何时不为空呢？这需要一种机制，允许消费者等待生产者。\n\
  \n这种机制可以在队列中实现！这就是为什么上面的伪代码使用 `await` 来从队列中消费数据。这被称为 `blocking queue`（阻塞队列），因为当队列为空时，消费者会被阻塞。\n\
  \n此外，反压（backpressure）要求队列的容量是有边界的。这通过让生产者在队列满时发生阻塞来实现。与 Node.JS 中的 `Stream` API\
  \ 相比，这消除了不强制要求反压的“陷阱”。\n\n```typescript\n// 生产者和消费者都可以阻塞。\ntype Queue<T> = {\n \
  \ pushBack(item: T): Promise<void>;\n  popFront(): Promise<T>;\n};\n```\n\n`blocking\
  \ queue` 不仅在生产者和消费者之间传递数据，还传递 `control`，这类似于 `mutex`。事实上，虽然传递数据很方便，但在并发编程中传递控制权是更基础的。\n\
  \n#### 使用可关闭队列进行取消\n\n阻塞队列在阻塞行为上与 Unix 管道（pipe）相似。有一点不同：管道是可以被 `closed` 的！\n\n-\
  \ 如果由生产者关闭，消费者将获得 `EOF`。\n- 如果由消费者关闭，生产者在写入时会收到错误。\n\n在并发编程中，有时你需要任务退出工作。例如，如果 WebSocket\
  \ 在应用程序任务阻塞它（读取或写入）时被关闭，任务应该被唤醒（获取 `EOF` 或错误），而不是永远挂起。\n\n如果任务是队列的消费者，你可以在队列中放入特殊值来通知消费者退出。但对于等待队列的生产者来说，这并不容易。幸运的是，我们可以向\
  \ Unix 管道学习——添加一个 `close()` 方法来解除所有生产者和消费者的阻塞。\n\n```typescript\ntype Queue<T> =\
  \ {\n  pushBack(item: T): Promise<void>;\n  // 如果关闭则抛出异常\n  popFront(): Promise<null|T>;\n\
  \  // 如果关闭则返回 null\n  close(): void;\n};\n```\n\n我们可以向生产者抛出异常并向消费者返回 null，模拟关闭的管道。\n\
  \n#### 阻塞队列作为同步原语\n\n同步原语是用于阻塞和解除阻塞任务（传递控制权）的东西。\n\n一些传统的同步原语包括：\n\n- `Mutex`。\n\
  - `Semaphore`。\n- `Condition variable`。\n- `Event`。\n\n除了传统的同步原语之外，Golang 还采用 `channel`\
  \ 作为其主要的同步原语，它与我们讨论的阻塞队列非常相似。\n\n\n\n\n\nNode.JS 并不包含这些同步原语，并发问题通常被掩盖在大量的回调中。幸运的是，随着\
  \ `async/await` 的加入，这些原语可以复制到 JS 中。但我们必须先使用 promises 和回调创建它们。\n\n### 步骤 1：分析问题\n\
  \n考虑一个仅具有 `push` 和 `pop` 且没有缓冲能力的阻塞队列。该队列应该被多个生产者和多个消费者使用，这比生成器更通用。\n\n```typescript\n\
  type Queue<T> = {\n  pushBack(item: T): Promise<void>;\n  popFront(): Promise<T>;\n\
  };\n```\n\n创建一个 promise 会产生一个 `resolve` 回调，用于稍后完成它的状态。生产者要么等待消费者，要么唤醒一个正在等待的消费者。\n\
  \n- 如果没有消费者在等待，它会将回调存储在某处。未来的消费者将调用该回调来获取数据并完成生产者。\n- 如果有正在等待的消费者，则通过调用其回调来完成其中一个。\n\
  \n消费者的情况也类似：\n\n- 它要么存储一个回调来等待生产者，\n- 或者调用正在等待的生产者的回调。\n\n### 步骤 2：Push 和 Pop\n\n\
  可能会有多个等待中的生产者或消费者，因此我们需要在列表中存储它们的回调。\n\n对于消费者，只需存储它们自己的 `resolve` 回调以接收数据。\n\n对于生产者，回调负责做两件事：\n\
  \n1. 获取消费者的回调并完成它（带上数据）。\n2. 完成它自己的 promise。\n\n```typescript\n// 一个多生产者、多消费者且容量为\
  \ 0 的队列。\nfunction createQueue<T>(): Queue<T> {\n  type Taker = (item: T) => void;\n\
  \  // 完成消费者任务\n  type Giver = (take: Taker) => void;\n  // 唤醒生产者\n  const producers:\
  \ Giver[] = [];\n  const consumers: Taker[] = [];\n\n  return {\n    pushBack: (item:\
  \ T): Promise<void> => {\n      return new Promise<void>((done: () => void) => {\n\
  \        const give: Giver = (take: Taker) => {\n          take(item);\n       \
  \   done();\n        };\n\n        if (consumers.length) { // 消费者正在等待\n        \
  \  give(consumers.shift()!);\n        } else {\n          // 等待生产者\n          producers.push(give);\n\
  \        }\n      });\n    },\n    popFront: Promise<T> => {\n      return new Promise<T>((take:\
  \ Taker) => {\n        if (producers.length) { // 生产者正在等待\n          producers.shift()!(take);\n\
  \        } else {\n          // 等待消费者\n          consumers.push(take);\n       \
  \ }\n      });\n    },\n  };\n}\n```\n\n### 步骤 3：关闭队列\n\n`close()` 方法稍后会非常有用。\n\n\
  ```typescript\ntype Queue<T> = {\n  pushBack(item: T): Promise<void>; // 如果关闭则抛出异常\n\
  \  popFront(): Promise<T>;           // 如果关闭则返回 null\n  close(): void;\n};\n```\n\
  \n由于我们可能在生产者处抛出异常，也存储了 `reject` 回调。\n\n```typescript\ntype Rejector = (err: Error)\
  \ => void;\nconst producers: { give: Giver, reject: Rejector }[] = [];\nlet closed\
  \ = false;\n```\n\n我们还会记住 `closed` 状态。在推入或弹出之前应该检查此状态。关闭队列会解阻塞所有人。\n\n```typescript\n\
  close: () => {\n  // 解阻塞任何正在等待的生产者或消费者\n  closed = true;\n  while (producers.length)\
  \ {\n    producers.shift()!.reject(new Error('queue closed'));\n  }\n  while (consumers.length)\
  \ {\n    consumers.shift()!(null);\n  }\n}\n```\n\n### 步骤 4：添加缓冲区\n\n该队列对于我们的目的已经足够。对于其他某些情况，队列可能需要缓冲固定数量的项而不阻塞生产者。这留给你们作为一个练习。\n\
  \n```typescript\nfunction createQueue<T>(capacity: number): Queue<T>;\n```\n\n##\
  \ WebSocket 服务器\n\n### 步骤 1：设计消息接口\n\nWebSocket 消息在应用中表示为 `WSMsg` 类型。负载数据使用 `read()`\
  \ 函数进行，类似于 `BodyReader` 接口，支持任意大小的消息并实时接收数据。\n\n```typescript\nconst WS_DATA_TEXT\
  \ = 0x01;\nconst WS_DATA_BINARY = 0x02;\n\n// WebSocket 消息类型\ntype WSMsg = {\n \
  \ type: number;   // WS_DATA_TEXT, WS_DATA_BINARY\n  length: number; // 字节\n  read:\
  \ () => Promise<Buffer>; // EOF 后为空\n};\n```\n\n虽然 `read()` 函数不需要将整个消息都存储在内存中，但它确实有一个缺点：应用程序必须确保消息数据被消费，否则下一帧将无法解析。\n\
  \n### 步骤 2：设计应用接口\n\n`WSServer` 是用于发送和接收数据消息的应用接口。\n\n```typescript\ntype WSServer\
  \ = {\n  send(msg: WSMsg): Promise<void>; // 支持多个生产者\n  recv(): Promise<null|WSMsg>;\
  \     // EOF 后返回 null\n  close(): void;\n};\n```\n\n这与我们对 socket 进行的操作类似——从它读取并向它写入。只不过并发读写有合法的用场景且必须被支持：\n\
  \n- 并发写入：多个应用任务独立生成消息。\n- 并发读取：使用任务池进行并发消息处理。\n\n你也可以使用回调来传递消息而不是主动读取它们。但这会让背压（backpressure）变得不明显，因为你还需要\
  \ `pause()` 和 `resume()` 方法。这就是为什么我们早期就放弃了基于回调的 IO。\n\n### 步骤 3：设计服务器任务\n\n与请求-响应模式不同，发送和接收是独立的。因此，我们需要：\n\
  \n- 一个解析入字节字节流的任务：`wsServerRecv()`。\n- 一个向 socket 写入消息的任务：`wsServerSend()`。\n\n\
  这两个任务与应用任务并发运行。使用两个队列连接这两个任务与应用（发送和接收）。另一个队列用于连接 `wsServerSend()` 到 socket。\n\n\
  `App <= qrecv (Queue) <= wsServerRecv <= reqBody (BodyReader)`\n`App => qsend (Queue)\
  \ => wsServerSend => qsock (Queue) => resBody (BodyReader)`\n\n可能会有多个应用任务通过单个 WebSocket\
  \ 产生或消费数据，但读取和写入 socket 的任务必须是顺序的。这是一个通过传递数据解决并发问题的示例。\n\n### 步骤 4：启动服务器任务\n\n让我们为上一步步骤编写代码。\n\
  \n```typescript\nfunction createWSServer(reqBody: BodyReader): [WSServer, BodyReader]\
  \ {\n  const qrecv: Queue<WSMsg> = createQueue<WSMsg>();\n  const qsend: Queue<WSMsg>\
  \ = createQueue<WSMsg>();\n\n  const ws: WSServer = {\n    send: qsend.pushBack,\
  \   // 如果关闭则抛出\n    recv: qrecv.popFront,   // 如果关闭则返回 null\n    close(): void =>\
  \ {\n      qsend.close(); // 生成 WS_CTRL_CLOSE\n      qrecv.close();\n    },\n  };\n\
  \n  // 任务 1：从 socket 读取\n  wsServerRecv(reqBody, qrecv, ws)\n    .finally(ws.close)\
  \ // 关闭 WS API\n    .catch(console.error); // 无等待\n\n  // 任务 2：向 socket 写入\n  const\
  \ qsock: Queue<Buffer> = createQueue<Buffer>();\n  wsServerSend(qsend, qsock)\n\
  \    .finally(ws.close) // 关闭 WS API\n    .finally(qsock.close) // 关闭 socket\n \
  \   .catch(console.error); // 无等待\n\n  const resBody: BodyReader = {\n    length:\
  \ -1,\n    read: async () => await qsock.popFront() || Buffer.from(''),\n  };\n\n\
  \  return [ws, resBody];\n}\n```\n\n注册在 promise 上的 `finally()` 回调行为类似于 `try-finally`\
  \ 块。这用于关闭队列，以便任务不会永远挂在队列中。\n\n\n\n\n注意：如果你没有 `await` 一个异步函数，那么使用 `catch()` 回调来捕获异常是关重要的，否则你的程序将会崩溃。在这种情况下，我们简单地记录了并忽略了异常，但有时你需要传播错误。\n\
  \n[报告错误 | 提问](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)\n\
  \n121\n2024-02-02\n\n# 13. WebSocket 与并发\n\n## 第 5 步：向 Socket 消息\n\n`wsServerSend()`\
  \ 任务从队列中获取 `WSMsg` 输入，并将数据输出到 `qsock` 队列，该队列由 `BodyReader` 提取。帧代码已省略。\n\n```javascript\n\
  // 格式化 WS 消息并将其发送到 socket\nasync function wsServerSend(\n  qsend: Queue<WSMsg>,\
  \ qsock: Queue<Buffer>): Promise<void>\n{\n  while (true) {\n    const msg = await\
  \ qsend.popFront();\n    if (!msg) { // 关闭它\n      // 省略。发送一个“close”帧 ...\n    \
  \  break;\n    }\n    // 省略。将帧数据写入 qsock ...\n  }\n}\n```\n\n注意这与使用 Unix 管道有多么相似：\n\
  • 输入和输出的统一接口。\n• 可组合性。\n\n## 第 6 步：从 Socket 解析帧\n\n`wsServerRecv()` 为每个帧进行循环，并将\
  \ `WSMsgs` 馈送到输出队列。\n\n```javascript\n// 从客户端解析 WS 帧\nasync function wsServerRecv(\n\
  \  reqBody: BodyReader, qrecv: Queue<WSMsg>, ws: WSServer): Promise<void>;\n```\n\
  \n我们将使用另一个队列将帧数据发送到 `WSMsg` 的 `read()` 函数中。\n\n```javascript\n// 创建一个 WSMsg\nconst\
  \ q = data = createQueue<Buffer>();\nconst msg: WSMsg = {\n  // 省略 ...\n  read:\
  \ async () => await q.popFront() || Buffer.from(''),\n};\nawait qrecv.pushBack(msg);\n\
  // 省略。将负载数据馈送到 q ...\n```\n\n[报告错误 | 提问](https://forms.gle/UKo4bncUnuMGBrTM7) @\
  \ [build-your-own.org](https://build-your-own.org)\n\n122\n2024-02-02\n13. WebSocket\
  \ 与并发\n\n一个数据消息可以跨越多个帧，因此我们需要在循环之外存储队列，并在更多帧到达时馈送队列。请记住在设置 `FIN` 标志或退出循环时，确保队列已关闭。\n\
  \n```javascript\n// 为当前消息提供数据\nlet data: null|Queue<Buffer> = null;\ntry {\n  //\
  \ 为每个帧进行循环\n  while (true) {\n    // 省略 ...\n  }\n} finally {\n  // 如果应用阻塞在数据上，则关闭消息数据。\n\
  \  data?.close();\n}\n```\n\n## 第 7 步：与 HTTP 服务器集成\n\n请求要么作为 WebSocket 处理，要么作为 HTTP\
  \ 请求处理。这在 `getWSApp()` 中决决定，它返回一个应用逻辑函数或 null。\n\n```javascript\ntype WSApplication\
  \ = (ws: WSServer) => Promise<void>;\n// 将请求映射到 WS 应用。\nfunction getWSApp(req: HTTPReq):\
  \ null|WSApplication\n```\n\nWebSockets 的处理方式不同：\n• 请求由 `handleWS()` 处理，它调用应用函数。\n\
  • socket 的其余部分数据将传递给协议，而不通过 `readerFromEOF()` 函数进行进一步处理。\n• 响应直接写入 socket。因此，不要用响应压缩、额外的标头字段和分块编码来搞乱它。\n\
  \n```javascript\n// 处理消息并发送响应\nlet reqBody: BodyReader;\nlet res: HTTPRes;\nconst\
  \ wsapp: null|WSApplication = getWSApp(msg);\n```\n\n[报告错误 | 提问](https://forms.gle/UKo4bncUnuMGBrTM7)\
  \ @ [build-your-own.org](https://build-your-own.org)\n\n123\n2024-02-02\n13. WebSocket\
  \ 与并发\n\n```javascript\nif (wsapp) {\n  // 升级到 WebSocket\n  reqBody = readerFromEOF(conn,\
  \ buf);\n  res = handleWS(msg, reqBody, wsapp);\n} else {\n  // 普通 HTTP 连接\n  reqBody\
  \ = readerReq(conn, buf, msg);\n  res = handleReq(msg, reqBody);\n}\ntry {\n  if\
  \ (!wsapp) {\n    enableCompression(msg, res);\n  }\n  if (msg.method !== 'HEAD')\
  \ {\n    // 省略主体\n    await writeHTTPBody(conn, res);\n  }\n} finally {\n  // 清理\n\
  \  await res.body?.close();\n}\nif (msg.version === '1.0' || wsapp) {\n  // 关闭 HTTP/1.0\
  \ 或 WebSocket 的连接\n  return;\n}\n```\n\n`handleWS()` 函数将这一切整合在一起：\n• 启动任务处理协议。\n\
  • 启动应用任务。\n• 返回 Upgrade 标头。\n\n```javascript\nasync function handleWS(\n  req: HTTPReq,\
  \ reqBody: BodyReader, app: WSApplication): Promise<HTTPRes>\n{\n  // 处理 WS 协议\n\
  \  const [ws, res]: [WSServer, BodyReader] = createWSServer(req);\n  // 启动应用\n \
  \ await app(ws).catch(console.error);\n  // 切换协议\n  return {\n    code: 101,\n \
  \   headers: [\n      Buffer.from('Upgrade: websocket'),\n      Buffer.from('Connection:\
  \ Upgrade'),\n      Buffer.from(`Sec-WebSocket-Accept: ${key}`),\n    ],\n    body:\
  \ resBody,\n  };\n}\n```\n\n## 第 8 步：测试与调试\n\n使用浏览器创建 WebSocket。记得使用数据抓包工具。Wireshark\
  \ 可以拆解帧，所以你可以\n• 学习帧的正确格式。\n• 查看你生成的帧存在什么问题。\n\n## 13.6 讨论：浏览器中的 WebSocket\n\nWebSocket\
  \ 在客户端和服务器的功能上是对称的。因此应用接口 适用于双方。让我们探讨浏览器中的 WebSocket。\n\n### 浏览器中没有背压\n\n最重要的区别是浏览器\
  \ API 是基于回调的。浏览器调用事件[6](https://developer.mozilla.org/en-US/docs/Web/API/message_event)\
  \ 当消息到达。这与 Node.JS 的 `net.Socket` 相似，只是它有 `pause()` 和 `resume()` 方法，因此接收端是可以背压的。\n\
  \n对于发送消息，`send()` 方法[7](https://developer.mozilla.org/en-US/docs/Web/API/send) 只是缓存数据且不返回内容。有一个\
  \ `bufferedAmount` 属性告知缓冲区大小，因此应用程序仍然可以控制背压。\n\n存在另一种 API 设计[8](https://developer.chrome.com/docs/capabilities/web-apis/websocketstream)\
  \ 使用 `async/await` 进行读写，这是我们采取的方向。\n\n[6] https://developer.mozilla.org/en-US/docs/Web/API/message_event\n\
  [7] https://developer.mozilla.org/en-US/docs/Web/API/send\n[8] https://developer.chrome.com/docs/capabilities/web-apis/websocketstream\n\
  \n125\n2024-02-02\n13. WebSocket 与并发\n\n### 应用层背压\n\n缺少背压可能是网络编程中的第二大错误。但即使浏览器中无法实现背压，应用程序也可以在更高层实现：\n\
  • 消费者向生产者确认已处理的消息。\n• 生产者根据确认信息来实现流量控制。\n\n运行在 WebSocket 之上的消息协议可以实现背压，例如 [RSocket[9](https://rsocket.io/about/protocol#flow-control)].](#index_split_001.html#p131)\n\
  \n### 消息大小限制\n\n虽然可以通过分帧将 WebSocket 消息视为无限流，但大多数软件（包括浏览器）将消息存储在单个缓冲区。因此消息大小和帧大小都有限制。（我们没有这些限制，因为我们使用\
  \ `read()` 函数即时消费数据）。\n\n在 WebSocket 上发送大块数据的应用程序应该有一个分片机制，以保持较小的消息。\n\n## 13.7\
  \ 结论：我们学到了什么\n\n自基础 HTTP 服务器以来重要的主题：\n• HTTP 语义：\n\n\n\n\n\n- Content-Length 与分块传输编码。\n\
  - 范围请求（Range requests）。\n- 缓存。\n- 压缩。\n- 基于所有权的手动资源管理。\n- Buffer 使用技巧。\n- 生产者-消费者问题和背压的抽象：\n\
  \    - 生成器（Generators）。\n    - 流（Streams）。\n    - 阻塞队列（Blocking queues）。\n\n[`rsocket.io/about/protocol#flow-control`](https://rsocket.io/about/protocol#flow-control)\n\
