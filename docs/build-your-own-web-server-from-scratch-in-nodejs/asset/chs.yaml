  \n### 步骤 6：请求处理\n\n现在我们可以根据 URI 处理请求。这里我们将展示示例响应。\n\n```javascript\n// 一个请求处理器\n\
  async handleReq(req: HTTPReq, body: BodyReader): Promise<HTTPRes> {\n  // 根据请求\n\
  \  let resp: BodyReader;\n  switch (req.uri.toString('latin1')) {\n    case '/echo':\n\
