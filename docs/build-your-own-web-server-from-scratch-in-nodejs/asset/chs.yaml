- "# Node.JS 从零构建 Web 服务器指南\n\n\n\n\n\n## James Smith\nbuild-your-own.org\n\n通过编写你自己的\
  \ `Web Server`，学习网络编程、HTTP 协议及其应用。\n\n**James Smith**\nbuild-your-own.org\n\n\n\n\
  \n\n\n\n\n## 7.4 讨论：缓冲区写入\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n# 引言\n\n## 1.1 为什么需要引言\n\
  \n### 为什么需要引言\n从零开始构建一个 Web 服务器是非常有感的，但这不应该是你的唯一目标。有很多博客文章向你展示一个“玩具级服务器”，但你如何超越玩具阶段呢？\n\
  \n### 网络编程\n该项目在不使用任何依赖的情况下使用 Node.js，但许多概念是`语言无关`的，因此对任何语言的学习者来说都非常有价值。\n\n###\
  \ 协议与通信\n第一步是 `socket` 编程。传输的数据必须符合 `HTTP` 标准。\n\n### HTTP 详情\n你已经了解 `HTTP`，例如 `GET`\
  \ 和 `POST` 方法以及相关状态码。\n\n## 1.2 构建你的底层 (Build Your Scratch)\n\n### 构建你的底层\n大多数人每天使用\
  \ `HTTP`，但很少有人理解其内部原理。这本书 `Build Your Own` 深入探讨了 `socket` 的细节。\n\n### 网络编程\n该项目在不使用任何依赖的情况下使用\
  \ Node.js，但许多概念是`语言无关`的，因此对任何语言的学习者来说都非常有价值。\n\n## 1.3 本书\n\n### 本书\n从零开始构建一个 Web\
  \ 服务器是非常有感的，但这不应该是你的唯一目标。有很多博客文章向你展示一个“玩具级服务器”，但你如何超越玩具阶段呢？\n\n### 以项目为中心\n让你的 Web\
  \ 服务器运行起来是非常有感的，但这不应该是你的唯一目标。有很多博客文章向你展示一个“玩具级服务器”，但你如何超越玩具阶段呢？\n\n## 1.4 服务器\n\n\
  ### 服务器\n该项目在不使用任何依赖的情况下使用 Node.js，但许多概念是`语言无关`的，因此对任何语言的学习者来说都非常有价值。\n\n\n\n\n\
  正如你可能已经知到的，HTTP 协议位于 TCP 协议之上。TCP 本身是如何详细工作的并不是我们关注的；我们关于 TCP 需要了解的是，它是一个用于传输原始字节的双向通道——它是\
  \ HTTP 或 SSH 等其他应用协议的载体。\n\n虽然 TCP 连接的每个方向都可以独立运行，但许多协议遵循“请求-响应”模型。客户端发送请求，然后服务器发送响应，接着客户端可能会使用同一个连接进行后续的请求和响应。\n\
  \n```\nclient\nserver\n\\------\n\\------\n| req1 |\n\\==>\n<==\n| res1 |\n| req2\
  \ |\n\\==>\n<==\n| res2 |\n...\n```\n\n一个 HTTP 请求或响应由一个 `header`（头部）和一个可选的 `payload`（有效负载）组成。头部包含请求的\
  \ URL 或响应状态码，随后跟的是一系列 `header` `fields`（头部字段）列表。\n\n## 2.2 通过示例理解 HTTP\n\n为了掌握网络协议，让我们从从命令行发送一个\
  \ HTTP 请求开始。\n\n运行 `netcat` 命令：\n\n```\nnc example.com 80\n```\n\n`nc` (netcat)\
  \ 命令会与目标主机和端口建立一个 TCP 连接，然后将该连接到 `stdin` 和 `stdout`。我们现在可以在终端中开始输入，数据将会被传输：\n\n\
  ```\nGET / HTTP/1.0\nHost: example.com\n(empty line)\n```\n\n我们将得到以下响应：\n\n```\n\
  HTTP/1.0 200 OK\nAge: 525410\nCache-Control: max-age=604800\nContent-Type: text/html;\
  \ charset=UTF-8\nDate: Thu, 20 Oct 2020 11:11:11 GMT\nEtag: \"1234567890+gzip+ident\"\
  \nLast-Modified: Thu, 20 Oct 2019 11:11:11 GMT\nVary: Accept-Encoding\nContent-Length:\
  \ 1256\nConnection: close\n<!doctype html>\n<!-- omitted -->\n```\n\n从命令行发送 HTTP\
  \ 请求非常简单。让我们来看这些数据并尝试弄清楚它们的含义。\n\n请求的第一行——`GET / HTTP/1.0`——包含了 HTTP 方法 `GET`、URI\
  \ `/` 以及 HTTP 版本 `1.0`。这很容易辨认。\n\n响应的第一行——`HTTP/1.0 200 OK`——包含了 HTTP 版本和响应状态码 `200`。\n\
  \n紧随第一行之后的是 `Key: value` 格式的头部字段列表。请求有一个头部字段——`Host`——它包含了域名。\n\n响应包含许多字段，它们的功能并不像\
  \ `Host` 字段那样明显。许多 HTTP 头部字段是可选的，有些甚至是没用的。我们将在稍后的章节中学习更多相关内容。\n\n响应头部之后是 `payload`，在我们的案例中，它是一个\
  \ HTML 文档。\n\nPayload 和头部之间用一个空行隔开。`GET` 请求没有 payload，所以它以空行结束。\n\n这只是一个简单的示例，你可以从命令行进行尝试。我们稍后将更详细地检查\
  \ HTTP 协议。\n\n## 2.3 HTTP 的演进\n\n### HTTP/1.0：原型\n\n上面的示例使用了 `HTTP/1.0`，这是一个非常老的\
  \ HTTP 版本。`HTTP/1.0` 完全不支持在单个连接上进行多次请求，你必须为每个请求创建一个新连接。这是有问题的，因为典型的网页依赖于许多额外的资源，如图像、脚本或样式表；TCP\
  \ 握手的延迟使得 `HTTP/1.0` 非常不优。\n\n`HTTP/1.1` 解决了这个问题并成为了一个实用的协议。你可以通过简单地将 `HTTP/1.0`\
  \ 更改为 `HTTP/1.1`，尝试使用 `nc` 命令在同一个连接上发送多个请求。\n\n### HTTP/1.1：生产级且易懂\n\n本书将关注 HTTP/1.1，因为它仍然非常流行且易理解。即使是与\
  \ Web 无关的软件系统也采用了 HTTP 作为其网络协议的基础。当后端开发者谈论“API”时，他们可能指的是基于 HTTP 的 API，即使对于内部软件服务也是如此。\n\
  \n为什么 HTTP 如此流行？一个可能的原因它可以作为一种通用的请求-响应协议；开发者可以依赖 HTTP 而不是发明自己的协议。这使得 HTTP 成为学习如何构建网络协议的好目标。\n\
  \n### HTTP/2：新特性\n\n自 HTTP/1.1 之后还有进一步的发展。与 SPDY 相关的 `HTTP/2` 是 HTTP 的下一次迭代。除了压缩头部等增量式改进外，它还具有两个新能力：\n\
  \n- *Server push*（服务器推送），即在客户端请求之前就向其发送资源。\n- 在单个 TCP 连接上进行多个请求的 *Multiplexing*（多路复用），这是解决*头部阻塞\
  \ (head-of-line blocking)* 的尝试。\n\n有了这些新特性，`HTTP/2` 不再是一个简单的请求-响应协议。这就是为什么我们从 HTTP/1.1\
  \ 开始，因为它足够简单且易理解。\n\n### HTTP/3：更大的野心\n\n`HTTP/3` 比 HTTP/2 大得多，它替换了 TCP 并使用 UDP。因此它需要复制\
  \ TCP 的大部分功能，这种替代方案被称为 `QUIC`。`QUIC` 背后的动机是用户态拥塞控制、多路复用。关于这些新技术可能会让你目不暇接，所以让我们从简单的开始：HTTP/1.1\n\
  \n## 2.4 命令行工具\n\n向你介绍命令行工具是因为它可以进行快速测试和调试。你可能想将请求数据存储在文件中：`nc example.com 80 <\
  \ request.txt`。在实践中，你可能会遇到 `nc` 的一些怪癖，例如发送 EOF 或多个版本的 `nc`。你可以使用现代的 `socat` 替代：\n\
  \n```\nsocat tcp:example.com:80\n```\n\n`telnet` 命令在教程中也很流行：\n\n```\ntelnet example.com\
  \ 80\n```\n\n你也可以使用现有的 HTTP 客户端而不是手动构建请求。尝试 `curl` 命令：\n\n```\ncurl -vvv http://example.com/\n\
  ```\n\n大多数网站支持 HTTPS。HTTPS 在 HTTP 和 TCP 之间增加了一个额外的层 TLS。TLS 不是明文，所以你不能使用 `netcat`\
  \ 测试 HTTPS 服务器。但 TLS 仍然像 TCP 一样提供字节流，你只需要将 `netcat` 替换为 TLS 客户端：\n\n```\nopenssl\
  \ s_client -verify_quiet -quiet -connect example.com:443\n```\n\n## 第三章\n\n### 代码\
  \ TCP 服务器\n\n我们的第一步是熟悉 socket API，因此我们在本章中编写一个简单的 TCP 服务器。\n\n## 3.1 TCP 快速回顾\n\n\
  ### 协议层\n\n网络协议分为不同的层，高层依赖于低层，每一层都提供不同的能力。\n\n```\ntop\n/\\\n| App | 消息或其他\n||\n\
  | TCP | 字节流\n||\n| IP | 数据包\n||\n| ... |\nbottom\n```\n\nTCP 之下是 IP 层。每个 IP 数据包由三个部分组成：\n\
  \n- 发送者地址\n- 接收者地址\n- 消息数据\n\n与基于包的方案进行通信并不容易。有很多应用程序需要解决的问题：\n\n- 如果消息数据超过了单个数据包的容量怎么办？\n\
  - 如果数据包丢失了怎么办？\n- 乱序包怎么办？\n\n\n\n\n`UDP` 与 `TCP` 处于同一层，但仍然像底层一样基于数据包。`UDP` 只是在 `IP`\
  \ 数据包上添加了端口号。\n\n8\n\n2024-02-02\n\n03. 代码实现一个 TCP 服务器\n\n**TCP 字节流 vs UDP 数据包**\n\
  \n关键区别：边界。\n\n• `UDP`: 从套接字的每次 `read` 对应于对端的一次 `write`。\n\n• `TCP`: 没有这种对应关系！数据是连续的字节流。\n\
  \n`TCP` 根本没有保留边界的机制。\n\n1. `TCP` 发送缓冲区：这是传输前存储数据的地方。多次写入与单次写入无法区分的。\n2. 数据被封装为一个或多个\
  \ `IP` 数据包，`IP` 边界与原始写入边界之间没有关系。\n3. `TCP` 接收缓冲区：数据在到达时即可供应用程序使用。\n\n套接字编程中的第一个新手陷阱是“合并与拆分\
  \ TCP 数据包”，因为不存在所谓的“TCP 数据包”。需要通过在字节流中强制设定边界来解释 `TCP` 数据。\n\n**字节流 vs. 数据包：以 DNS\
  \ 为例**\n\n为了帮助你理解字节流的影响，让我们以 `DNS` 协议（域名到 IP 地址的查找）为例。\n\n`DNS` 运行在 `UDP` 上，客户端发送单个请求消息，服务器响应单个响应消息。一个\
  \ `DNS` 消息被封装在一个 `UDP` 数据包中。\n\n| IP 头部 | IP 负载 |\n| :--- | :--- |\n| ... | |\n\
  | UDP 头部 | UDP 负载 |\n| DNS 消息 | |\n\n由于基于包协议的缺点（例如无法使用大消息），`DNS` 也设计为运行在 `TCP` 上。但\
  \ `TCP` 对“消息”并不感知，因此在 `TCP` 上发送 `DNS` 消息时，会在每个 `DNS` 消息前添加一个 `2 字节长度字段`，以便服务器或客户端能够判断字节流的哪个部分是哪个消息。这个\
  \ 2 字节长度字段是 `TCP` 之上 `应用协议` 最简单的示例。该协议允许在单个 `TCP` 字节流中存在多个 `应用消息`（`DNS`）。\n\n| len1\
  \ | msg1 | len2 | msg2 | ... |\n\n[报告错误 | 提问](https://forms.gle/UKo4bncUnuMGBrTM5)\
  \ @ [build-your-own.org](https://build-your-own.org)\n\n9\n\n2024-02-02\n\n03. 代码实现一个\
  \ TCP 服务器\n\n**TCP 从握手开始**\n\n要建立 `TCP` 连接，应该有一个和一个服务器（忽略同时发生的情况）。服务器在特定地址（IP +\
  \ 端口）等待客户端，这一步被称为 `bind & listen`。然后客户端可以 `connect` 到该地址。`connect` 操作涉及三次握手（`SYN`、`SYN-ACK`、`ACK`），但这不是我们关注的，因为操作系统透明地完成了它。操作系统完成握手后，连接可以被服务器\
  \ `accepted`。\n\n**TCP 是双向且全双工的**\n\n一旦建立，`TCP` 连接就可以用作双向字节流，每个方向有两个通道。许多协议如 `HTTP/1.1`\
  \ 是这种请求-响应模式的，对端要么在发送请求/响应，要么在接收响应/请求。但 `TCP` 不限于此。\n\n（注：原文中后续大量重复的段落已去重，以符合文档专业性）\n\
  \n\n\n\n'connection' 参数被称为一个 `event`（事件），你可以在其上注册回调函数。监听套接字（socket）上还有其他事件。例如，有一个\
  \ 'error' 事件，当发生错误时，它会被触发。\n\n```javascript\nserver.on('error', (err: Error) =>\
  \ { throw err; });\n```\n\n在这里，我们简单地抛出异常并终止程序。你可以通过在同一个地址和端口上运行 2 个服务器来测试这一点，第二个服务器将会失败。\n\
  \n由于这本书不是一份手册，我们不会在此处列出所有内容。请阅读 [Node.js 文档-](https://nodejs.org/api/net.html#class-netserver)[1](https://nodejs.org/api/net.html#class-netserver)来查找其他可能有用的事件。\n\
  \n## 第 4 步：读取与写入\n\n从连接接收的数据也通过回调函数传递。从套接字读取数据的相关事件是 'data' 事件和 'end' 事件。每当数据从对方到达时，'data'\
  \ 事件就会被触发；当对方结束传输时，'end' 事件就会被触发。\n\n```javascript\nsocket.on('end', () => {\n \
  \ // 收到 FIN。连接将自动关闭。\n  console.log('EOF.');\n});\n\nsocket.on('data', (data: Buffer)\
  \ => {\n  console.log('data:', data);\n  socket.write(data); // 回显数据。\n});\n```\n\
  \n`socket.write()` 方法将数据发回对方。\n\n### 第 5 步：关闭连接\n\n`socket.end()` 方法结束传输并关闭套接字。在这里，当数据包含字母“q”时，我们调用\
  \ `socket.end()`，这样我们可以轻松地测试这种场景。\n\n[[1](https://nodejs.org/api/net.html#class-netserver)](https://nodejs.org/api/net.html#class-netserver)\n\
  \n[报告错误 | 提问](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)\n\
  \n13\n2024-02-02\n03. 代码实现一个 TCP 服务器\n\n```javascript\nsocket.on('data', (data:\
  \ Buffer) => {\n  console.log('data:', data);\n  socket.write(data); // 回显数据。\n\
  \  // 如果数据包含 'q' 则主动关闭连接\n  if (data.includes('q')) {\n    console.log('closing.');\n\
  \    socket.end();\n    // 这将发送 FIN 并关闭连接。\n  }\n});\n```\n\n当传输从任何一方结束时，套接字会被运行时自动关闭。`net.Socket`\
  \ 上还有一个 'error' 事件，用于报告 IO 错误。该事件也会导致运行时关闭套接字。\n\n### 第 6 步：测试\n\n这是我们回声服务器的完整代码。\n\
  \n```javascript\nimport * as net from \"net\";\n\nfunction newConn(socket: net.Socket):\
  \ void {\n  console.log('new connection', socket.remoteAddress, socket.remotePort);\n\
  \  socket.on('end', () => {\n    // 收到 FIN。连接将自动关闭。\n    console.log('EOF.');\n\
  \  });\n  socket.on('data', (data: Buffer) => {\n    console.log('data:', data);\n\
  \    socket.write(data); // 回显数据。\n    // 如果数据包含 'q' 则主动关闭连接\n    if (data.includes('q'))\
  \ {\n      console.log('closing.');\n      socket.end();\n      // 这将发送 FIN 并关闭连接。\n\
  \    }\n  });\n}\n\nlet server = net.createServer();\nserver.on('error', (err: Error)\
  \ => { throw err; });\nserver.on('connection', newConn);\n```\n\n当传输从任何一方结束时，套接字会被运行时自动关闭。`net.Socket`\
  \ 上还有一个 'error' 事件用于报告 IO 错误。该事件也会导致运行时关闭套接字。\n\n[/content]\n\n*(注：由于提供的待翻译文本后半部分存在大量重复和乱码化片段（如\
  \ Step 4-Step 6 的重复内容），根据“千万不要重复输出原文”的原则，上述译文已针对逻辑完整且唯一的部分进行了翻译。以下是针对原始文本后半部分的完整翻译：)*\n\
