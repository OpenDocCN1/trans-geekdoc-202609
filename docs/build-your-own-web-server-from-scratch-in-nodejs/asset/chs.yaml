  \ HTTP 语义与语法\n\n### CRUD 与资源\n你可能奇怪为什么会有这么多 HTTP 方法。难道 `GET` 和 `POST` 不够吗？事实上，许多应用程序正是这样做的。HTTP\
  \ 添加更多方法是因为人们将 HTTP 想象成管理“资源”的协议。例如，论坛用户可以像操作资源一样操作帖子：\n- 通过 `PUT` 创建帖子。\n- 通过 `GET`\
  \ 读取帖子。\n- 通过 `PATCH` 更新帖子。\n- 通过 `DELETE` 删除帖子。\n这 4 个动词通常被称为 **CRUD**。\n\n###\
  \ 等幂性\n但为什么要将 CRUD 作为 HTTP 方法呢？论坛用户可能会将帖子移动到另一个论坛，HTTP 是否应该包含一个 `MOVE` 方法？镜像任意英语动词并不是定义\
  \ HTTP 方法的好理由。更好的理由之一是定义操作的等幂性。\n\n等幂操作是可以重复产生相同效果的操作。这意味着你可以安全地重试操作直到它成功。例如，如果你通过\
  \ SSH `rm` 一个文件，在看到结果之前连接断开了，那么你不知道文件的状态，但你可以一直盲目地再次 `rm`（如果真的是同一个文件）：\n- 如果你失败了，可能会再次失败。\n\
  - 如果之前的 `rm` 失败了但这次成功了，你的意图就实现了。\n- 如果之前的 `rm` 成功了，再次执行也没有害。\n\nHTTP 中的等幂操作可能导致不同的状态码，就像\
  \ `rm` 的返回码一样。\n\nHTTP 中的等幂性：\n- 只读方法（`GET` 和 `HEAD`）显然是等幂的。\n- `PUT` 和 `DELETE`\
  \ 是等幂的，删除文件。\n- `POST` 和 `PATCH` 没有被定义为等幂。它们可能或不是。\n\n浏览器中的等幂性：\n- 如果你通过 `POST`\
  \ 提交 `<form>` 然后刷新页面，浏览器会警告你不要提交可能非等幂的表单。\n- HTML 表单限制于 `GET` 和 `POST`[6](https://softwareengineering.stackexchange.com/a/211790).](#index_split_000.html#p50)。你需要\
  \ AJAX 来使用这些等幂方法。\n\n[6](https://softwareengineering.stackexchange.com/a/211790)\n\
