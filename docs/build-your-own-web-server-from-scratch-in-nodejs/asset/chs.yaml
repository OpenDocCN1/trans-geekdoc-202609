  \ 而非 LF 结尾。如果你删除了上述脚本中的 `sleep 1`，你也将是在测试管道请求。\n\n## 7.3 讨论：纳格算法 (Nagle's Algorithm)\n\
  \n### 优化：合并小写入\n\n在发送响应时，我们使用 `encodeHTTPResp()` 函数在将响应写入 socket 之前创建一个头的字节缓冲区。有些人可能会跳过这一步，逐行写入\
  \ socket。\n\n```javascript\n// 错误示例！\nawait soWrite(conn, Buffer.from(`HTTP/1.1\
  \ ${msg.code} ${status}\\r\\n`)); for (const h of msg.headers) {\n  await soWrite(conn,\
  \ h);\n  await soWrite(conn, Buffer.from('\\r\\n'));\n}\nawait soWrite(conn, Buffer.from('\\\
  r\\n'));\n```\n\n这样做的问题在于它产生了许多小写入，导致 `TCP` 发送许多小包。不仅每个包都有相对较大的空间开销，处理更多数据包还需要更多的计算。人们看到了这个优化机会并在\
  \ TCP 栈中添加了名为“纳格算法”的特性——TCP 栈*延迟*传输以允许发送缓冲区累积数据，从而将多个连续的小写入合并起来。\n\n### 过早优化\n\n\
  然而，这并不是一种好的优化。许多较新的网络协议设计（如 `TLS`）已经投入了大量精力减少 RTT（往返时间），因为许多性能问题都是延迟问题。现在在 `TCP`\
  \ 中添加延迟来合并写入看起来更像是反向优化。\n\n而且预期的优化可以在应用程序级别实现。编写良好的应用程序应该自己管理缓冲区。\n\n### 人们在实践中是如何做的\n\
  \n在开发网络应用时：\n\n1. 通过合并数据来避免小写入。\n2. 禁用纳格算法。这通常是默认开启的。在 `Node.js` 中可以禁用：\n\n```javascript\n\
  const server = net.createServer({\n  noDelay: true\n});\n```\n\n## 7.4 讨论：缓冲写入器\
  \ (Buffered Writer)\n\n### 替代方案：让缓冲半透明\n\n与其像处理响应那样显式地将数据序列化到缓冲区，我们也可以为 `TCPConn`\
  \ 添加缓冲区并改变它的工作方式。\n\n[报告错误 | 提问](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)\n\
  \n60\n2024-02-02\n\n07. 代码实现一个基础的 HTTP 服务器\n\n```typescript\n// 将数据追加到内部缓冲区\nfunction\
  \ soWrite(conn: TCPConn, data: Buffer): Promise<void>;\n\n// 将缓冲区刷新到运行时\nfunction\
  \ soFlush(conn: TCPConn): Promise<void>;\n```\n\n在新方案中，`soWrite()` 变为将数据追加到内部缓冲区，并使用新的\
  \ `soFlush()` 函数来实际写入数据。缓冲区大小是限制的，当缓冲区满时 `soWrite()` 也可以刷新缓冲区。\n\n这种 IO 风格非常流行，你可能在其他编程语言中见过它。例如，`C`\
  \ 语言中的 `stdio` 有一个默认开启的内置缓冲区，你必须在适当的情况下 `fflush()`。\n\n### 替代方案：添加缓冲包装器\n\n或者，你可以保持\
  \ `TCPConn` 不变，并添加一个独立的包装器：\n\n```typescript\ntype BufferedWriter = {\n  write:\
  \ (data: Buffer) => Promise<void>,\n  flush: () => Promise<void>,\n  // ...\n};\n\
  \nfunction createBufferedWriter(conn: TCPConn): BufferedWriter;\n```\n\n这类似于 Go\
  \ 语言中的 `bufio.Writer`。这种方案比在 socket 代码中添加缓冲更灵活，因为缓冲包装器也适用于其他形式的 IO。Go 标准库的设计具有定义良好的接口\
  \ [(io.Writer[1]](https://pkg.go.dev/io#Writer))](#index_split_000.html#p66)，使得缓冲写入器可以无缝替换非缓冲写入器。\n\
  \n\n\n\n从历史上看，万维网（WWW）主要由带有超链接的静态网页组成，`HTTP` 最初也是为此设计的。随后出现了提供动态内容的 Web 应用，这正是本章将考虑的内容。\n\
  \n## 8.1 分块传输编码 (Chunked Transfer Encoding)\n\n为了提供动态内容，我们需要实现上一章中缺失的分块编码。因为当我们即时生成网页时，无法预先知道输出的长度。\n\
  \n### 分块消息格式\n\n让我们从规范 `RFC 9112` 开始看。\n\n```\nchunked-body\n= \\*chunk\nlast-chunk\n\
  trailer-section\nCRLF\nchunk\n= chunk-size \\[ chunk-ext \\] CRLF\nchunk-data CRLF\n\
  chunk-size\n= 1\\*HEXDIG\nlast-chunk\n= 1\\*(\"0\") \\[ chunk-ext \\] CRLF\nchunk-data\n\
  = 1\\*OCTET ; a sequence of chunk-size octets\n```\n\n添加一个示例作为参考：\n\n```\n4\\r\\\
  nHTTP\\r\\n5\\r\\nserver\\r\\n0\\r\\n\\r\\n\n```\n\n通过这个示例可以看出，格式非常直观。\n\n- 每个分块以一个十六进制数字开头并以\
  \ `CRLF` 结束；这是分块数据的长度。\n- 随后的分块数据也以 `CRLF` 结束；这个 `CRLF` 除了让协议具有人类可读性外没有作用。\n- 零长度的分块标记着\
  \ `HTTP` 体的结束。我们经常看到这种约定！\n\n## 0. 动态内容与流式传输\n\n### 冷门的 HTTP 特性\n\n在 BNF 规范中仍有一些未触及的结构——`chunk-size`\
  \ 行上可选的 `chunk-ext` 以及末尾的 `trailer-section`。这些是设计进规范的某些冷门特性，但在实践中并不常用。\n\n`chunk-ext`\
  \ 设计用于通过添加额外的键值对来扩展分块格式，但在实践中并没有这种扩展。\n\n`trailer-section` 设计用于在 `HTTP` 体之后放置一些头部字段。你可能会奇怪为什么有人这样做，这是为了某些罕见的用例。有些人喜欢在\
  \ `HTTP` 头部字段中放置特定于应用程序的内容，例如数据的校验和。问题是，在流式传输数据时，校验和只有在数据传输完成后才能已知，因此设计了一种机制在最后一个分块之后附加一些头部字段。\n\
  \n许多 `HTTP` 服务器或客户端实现简单忽略了这些冷门特性，因为它们几乎没有用途或价值。另一方面，设计你的应用程序去使用任何冷门特性是不明智的，即使它们有\
  \ `RFC` 支持，因为你更有可能在客户端和中间件上遇到问题。我们在实现中也将忽略这些。\n\n## 8.2 生成分块响应\n\n第一步是在 `writeHTTPResp()`\
  \ 函数中添加分块编码，该函数从 `BodyReader` 接口中提取响应体。\n\n```typescript\n// 一个用于从/向 HTTP 体读取/写入数据的接口。\n\
  type BodyReader = {\n  // \"Content-Length\"，如果未知则为 -1。\n  length: number,\n  //\
  \ 读取数据。EOF 后返回一个空缓冲区。\n  read: () => Promise<Buffer>,\n};\n```\n\n上一章的接口设计时已经考虑了分块编码。我们需要实现的是长度为\
  \ `-1`（未知）的情况。\n\n```typescript\n// 通过套接字发送 HTTP 响应\nasync function writeHTTPResp(conn:\
  \ TCPConn, resp: HTTPRes): Promise<void> {\n  // 设置 \"Content-Length\" 或 \"Transfer-Encoding\"\
  \ 字段\n  if (resp.body.length < 0) {\n    resp.headers.push(Buffer.from('Transfer-Encoding:\
  \ chunked'));\n  } else {\n    resp.headers.push(Buffer.from(`Content-Length: ${resp.body.length}`));\n\
  \  }\n  // 写入头部\n  await soWrite(conn, encodeHTTPResp(resp));\n\n  // 写入体\n  const\
  \ crlf = Buffer.from('\\r\\n');\n  for (let last = false; !last; ) {\n    let data\
  \ = await resp.body.read();\n    last = (data.length === 0); // 结束了？\n    if (resp.body.length\
  \ < 0) { // 分块编码\n      data = Buffer.concat([\n        Buffer.from(data.length.toString(16)),\
  \ crlf,\n        data, crlf,\n      ]);\n    }\n    if (data.length) {\n      await\
  \ soWrite(conn, data);\n    }\n  }\n}\n```\n\n注意，分块消息是在我们通过单个写入发送到套接字之前，使用 `Buffer.concat()`\
  \ 创建的。这遵循了上一章关于缓冲 I/O 的建议。\n\n## 8.3 JS 生成器\n\n下一步是将生成响应体的应用程序代码（生产者）连接到 `BodyReader`\
  \ 接口（队列），而 `writeHTTPResp()` 函数（消费者）从中从中提取数据。\n\n```typescript\n// 伪代码！\nasync function\
  \ produce_response() {\n  // ...\n  await output(data1);\n  // 从 BodyReader 读取\n\
  \  // ...\n  await output(data2);\n  // 从 BodyReader 读取\n  // ...\n}\n```\n\n###\
  \ 生产者、消费者与队列\n\n使用队列并非易事，因为我们将会对此进行探讨。\n\n### 作为生产者的 JS 生成器\n\nJavaScript 生成器非常适合生产者-消费者模型。下面是一个生成器示例。\n\
  \n```typescript\ntype BufferGenerator = AsyncGenerator<Buffer, void, void>;\n\n\
  // 函数后的星号是 JS 生成器的语法\nasync function *countSheep(): BufferGenerator {\n  for (let\
  \ i = 0; i < 100; i++) {\n    // 等待 1s，然后输出计数器\n    await new Promise((resolve)\
  \ => setTimeout(resolve, 1000));\n    yield Buffer.from(`${i}\\n`);\n  }\n}\n```\n\
  \n### 从 JS 生成器读取\n\n为响应生成器添加一个新的 URI 处理器。`readerFromGenerator()` 函数将 JS 生成器转换为 `BodyReader`。\n\
  \n```typescript\nfunction readerFromGenerator(gen: BufferGenerator): BodyReader\
  \ {\n  return {\n    length: -1,\n    read: async (): Promise<Buffer> => {\n   \
  \   const r = await gen.next();\n      if (r.done) {\n        return Buffer.from('');\
  \ // EOF\n      } else {\n        console.assert(r.value.length > 0);\n        return\
  \ r.value;\n      }\n    },\n  };\n}\n```\n\n要从生成器提取数据，使用 `next()` 方法。当生成器 yield\
  \ 或 return 时，`next()` 方法返回，通过 `done` 标志进行区分，数据可以从 `value` 成员获取。\n\n```typescript\n\
  case '/sheep':\n  resp = readerFromGenerator(countSheep());\n  break;\n```\n\n`next()`\
  \ 方法可以接受一个可选参数，该参数将作为 `yield` 语句的结果传递给生产者，这意味着 JS 生成器是双向的。虽然我们现在不需要这种功能。\n\n使用 `curl`\
  \ 测试 `/sheep` URI，你应该能看到每 1s 输出一次计数器，这意味着分块编码正在正常工作。使用分块编码时，总体长度没有限制，你甚至可以生成无限字节流。\n\
  \n## 8.4 读取分块请求\n\n分块编码主要用于响应而不是请求。网络浏览器总是知道上传的长度，除非客户端 JS 使用了实验性的 Streams API。\n\
  \n\n\n\n\n使用 `ReadableStream`(https://developer.mozilla.org/en-US/docs/Web/API/ReadableStream)\
  \ 来`发送请求`(https://developer.mozilla.org/en-US/docs/Web/API/fetch#body)。为了支持此类客户端，让我们添加代码来读取分块（chunked）请求。\n\
  \n[\\[1](https://developer.mozilla.org/en-US/docs/Web/API/ReadableStream)\n\n[\\\
  [2](https://developer.mozilla.org/en-US/docs/Web/API/fetch#body)\n\n[报告错误 | 提问](https://forms.gle/UKo4bncUnuMGBrTM7)\
  \ @ [build-your-own.org](https://build-your-own.org)\n\n2024-02-02\n\n## 08. 动态内容与流传输\n\
  \n### 分块解析器作为生产者\n\n解码分块请求的代码必须连接到 `BodyReader` 接口。\n\n与我们之前将响应生成器连接到 `BodyReader`\
  \ 接口的任务是完全相同的。我们将再次使用 JS 生成器（generator）。\n\n```javascript\n// 解码分块编码并即时产生数据\nasync\
  \ function* readChunks(conn: TCPConn, buf: DynBuf): BufferGenerator;\n```\n\n`readChunks()`\
  \ 生成器的行为应该像我们之前编写的示例响应生成器。因此，我们可以直接使用 `readerFromGenerator()` 将其转换为 `BodyReader`。\n\
  \n```javascript\n// 来自 HTTP 请求的 BodyReader\nfunction readerFromReq(\n  conn: TCPConn,\
  \ buf: DynBuf, req: HTTPReq): BodyReader\n{\n  // 省略 ...\n  if (bodyLen >= 0) {\n\
  \    // 存在 \"Content-Length\"\n    return readerFromConnLength(conn, buf, bodyLen);\n\
  \  } else if (chunked) {\n    // 分块编码\n    return readerFromGenerator(readChunks(conn,\
  \ buf));\n  } else {\n    // 读取连接的剩余部分\n    return readerFromConnEOF(conn, buf);\n\
  \  }\n}\n```\n\n`readerFromConnEOF()` 函数用于兼容 HTTP/1.0 客户端。我们将跳过代码列表。\n\n### 解码块格式\n\
  \n`readChunks()` 的实现：\n\n```javascript\n// 解码分块编码并即时产生数据\nasync function* readChunks(conn:\
  \ TCPConn, buf: DynBuf): BufferGenerator {\n  for (let last = false; !last; ) {\n\
  \    // 读取分块大小行\n    const idx = buf.data.subarray(0, buf.length).indexOf('\\r\\\
  n');\n    if (idx < 0) {\n      // 需要更多数据，省略 ...\n      continue;\n    }\n    //\
  \ 解析分块大小并移除该行\n    let remain = /\\* omitted ... */;\n    bufPop(buf, /\\* omitted\
  \ ... */);\n    // 是最后一个吗？\n    last = (remain === 0);\n    // 读取并产生分块数据\n    while\
  \ (remain > 0) {\n      if (buf.length === 0) {\n        await bufExpectMore(conn,\
  \ buf, 'chunk data');\n      }\n      const consume = Math.min(remain, buf.length);\n\
  \      const data = Buffer.from(buf.data.subarray(0, consume));\n      bufPop(buf,\
  \ consume);\n      remain -= consume;\n      yield data;\n    }\n    // 分块数据后跟着\
  \ CRLF\n    bufPop(buf, 2); // 每个分块\n  }\n}\n```\n\n这与 HTTP 本身的头部-体结构相似。你等待分块大小并确定主体的长度。头部是变长度的，因此在解析时我们需要限制其大小，就像我们处理\
  \ HTTP 头部时一样。\n\n### 分块编码产生字节流\n\n解码格式是简单的。你需要注意的是读取块数据的内部循环。代码并没有等待整个分块到达，而是只要数据到达就产生数据。如果我们等待整个分块，就必须将整个块存储在内存中并受到限制。\n\
  \n2024-02-02\n\n08. 动态内容与流传输\n\n分块请求可以使用 `curl http://127.0.0.1:1234` 进行测试。`curl`\
  \ 将在不知道请求长度的情况下读取数据。\n\n## 8.5 讨论：使用数据包获调试\n\n一直在编写复杂的代码。了解如何调试代码是非常重要的。添加 `print`\
  \ 语句是检查情况的一种快速方法，但对于网络应用程序，有更廉价的方法：数据包获工具如 `tcpdump`、`grep` 和 `wireshark`。\n\n###\
  \ 使用 `tcpdump` 捕获并检查数据\n\n示例：`tcpdump -X -i lo port 1234`\n\n- `-X` 标志让 `tcpdump`\
  \ 进行十六转储。\n- `-i lo` 标志限制网络接口。我们只关心到 `127.0.0.1:1234` 的连接。\n- `port 1234` 是过滤无关数据包的布尔表达式。\n\
  \n`tcpdump` 的示例输出：\n\n```\n12:00:00.222444 IP 127.0.0.1.1234 > 127.0.0.1.59872:\n\
  0000: 4500 0079 c492 4000 4006 77ea 7f00 0001 E..y...@w.....\n0010: 7f00 0001 04d2\
  \ e9e0 42d3 38e1 bb89 becb........B.8.....\n0020: 8018 0200 fe6d 0000 0101 080a\
  \ 8f86 a39c.....m..........\n0030: 8f86 a395 4854 5450 2f31 2e31 2032 3030....HTTP/1.1.200\n\
  0040: 204f 4b0d 0a53 6572 7665 723a 206d 795f.OK..Server:.my_\n0050: 6669 7273 745f\
  \ 6874 7470 5f73 6572 7665first_http_serve\n0060: 720d 0a43 6f6e 7465 6e74 2d4c\
  \ 656e 6774r..Content-Lengt\n0070: 683a 2031 330d 0a0d 0a h:.13....\n12:00:00.222666\
  \ IP 127.0.0.1.59872 > 127.0.0.1.1234:\n...\n12:00:00.333444 IP 127.0.0.1.1234 >\
  \ 127.0.0.1.59872:\n0000: 4500 0041 c493 4000 4006 7821 7f00 0001 E..A..@.@.x.\n\
  ```\n\n2024-02-02\n\n08. 动态内容与流传输\n\n### 使用 `ngrep` 搜索数据包数据\n\n对于 HTTP 这样的文本协议，十六进制转储可能大过其实。你可以使用\
  \ `ngrep` 将数据打印为文本。\n\n`ngrep -qt -i lo '' port 1234`\n\n- `-d lo` 用于网络接口。\n- 空字符串\
  \ `''` 是过滤所有数据包的正则表达式。\n- `port 1234` 类似于 `tcpdump` 使用的布尔表达式。\n\n值得注意的是，所有这些工具都可以将数据包写入交换格式（pcap）的文件。你可以先捕获数据包，稍后分析。\n\
