  \n45\n2024-02-02\n\n# 06. HTTP 语义与语法\n\n但这还没有回答为什么会有这么多动词之谜，因为 HTTP 只需要为等幂写入增加 1\
  \ 个方法，而不是 3 个（`PATCH`、`PUT`、`DELETE`）。事实上，可能没有强力理由应用程序使用所有它们。\n\n**HTTP 方法对比**\n\
  \n通用 HTTP 方法总结。\n\n| 动词 | 安全 | 等幂 | 可缓存 | <form> | CRUD | 请求体 | 响应体 |\n| :--- |\
  \ :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| GET | 是 | 是 | 是 | 是 | 读取 |\
  \  | 是 |\n| HEAD | 是 | 是 | 是 | 否 | 读取 |  | 否 |\n| POST | 否 | 否 | * | 是 | - | 是 |\
