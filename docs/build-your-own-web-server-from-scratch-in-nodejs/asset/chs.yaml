  \ |\n| `Date` | C/S | 不怎么有用。 |\n| `Expect: 100-continue` | C | 一个一个冷门的特性。 |\n| `Host:\
  \ example.com` | C/S | URL 的主机名。 |\n| `Last-Modified` | S | 用于缓存验证和 304 Not Modified。\
  \ |\n| `If-Modified-Since` | C | 验证 `Last-Modified`。 |\n| `ETag: abcd` | S | 用于缓存验证和\
  \ 304 Not Modified。 |\n| `If-None-Match: abcd` | C | 验证 `ETag`。 |\n| `Range: 10-`\
  \ | C | 范围请求。获取响应的一部分。 |\n| `Content-Range: bytes 10-/60` | S | 范围响应。 |\n| `Accept-Ranges:\
  \ bytes` | S | 表示允许范围请求。 |\n| `Referer: http://foo.com/` | C | 用户来自哪里？ |\n| `Transfer-Encoding:\
  \ gzip` | S | 实现压缩的另一种方式。 |\n| `TE: gzip` | C | 用于协商 `Transfer-Encoding`。 |\n| `Trailer:\
  \ Foo` | C/S | 冷门特性：负载之后的头部字段。 |\n| `User-Agent: Foo` | C | 客户端软件。 |\n| `Server:\
  \ Foo` | S | 服务器软件。 |\n\n[报告错误 | 提问](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)\n\
  \n43\n2024-02-02\n\n# 06. HTTP 语义与语法\n\n| 头部字段 | 由谁提供 | 描述 |\n| :--- | :--- | :---\
  \ |\n| `Upgrade: websocket` | C/S | 创建 WebSocket。 |\n| `Access-Control-*` | S |\
  \ 跨资源共享 (CORS)。 |\n| `Origin` | C | CORS。 |\n| `Location: http://bar.com/` | S |\
  \ 用于 3xx 重定向。 |\n\n## 6.7 HTTP 方法\n\n### 只读方法\n最重要的 HTTP 方法是 `GET` 和 `POST`。为什么我们需要不同的\
  \ HTTP 方法？除了 `POST` 可以携带负载而 `GET` 不能的事实外，将只读操作与写操作分开也是一个好主意。只读方法被称为“安全”方法：\n- `GET`。\n\
  - `HEAD`，类似于 `GET` 但没有响应。\n- `OPTIONS`，很少使用，用于识别允许的方法和 CORS。\n\n### 可缓存性\n将只读操作与写操作分开的一个原因是只读操作通常是可以缓存的。另一方面，缓存写操作没有意义，因为它们会改变状态。然而，缓存性的规则比不同的\
  \ HTTP 方法更复杂：\n- `GET` 和 `HEAD` 被认为是可缓存的。但 `OPTIONS 不是，因为它有特殊用途。\n- 状态码也会影响缓存性。\n\
  - `Cache-Control` 头部可以影响缓存性。\n- `POST` 通常不可缓存，除非使用了冷门头部（`Content-Location`）且存在某些缓存指令。\n\
  - 不同实现有不同的缓存规则。[5](https://www.rfc-editor.org/rfc9110.html)\n\n[报告错误 | 提问](https://forms.gle/UKo4bncUnuMGBrTM7)\
