  \n```typescript\ntype HTTPReq = {\n  method: string;\n  uri: string;\n  version:\
  \ string;\n  headers: Buffer[];\n};\n\ntype HTTPRes = {\n  code: number;\n  headers:\
  \ Buffer[];\n  body: BodyReader;\n};\n```\n\n我们使用 `HTTPReq` 表示请求，使用 `HTTPRes` 表示响应。`BodyReader`\
  \ 是用于读写数据的接口。\n\n### 步骤 2：循环\n\n我们的服务器遵循 `serveClient(conn)` 模式。\n\n```typescript\n\
  async function serveClient(conn: TCPConn): Promise<void> {\n  const buf: Buffer\
  \ = Buffer.alloc(0);\n  while (true) {\n    // 尝试获取 HTTP 头部\n    const msg: null|HTTPReq\
  \ = cutMessage(buf);\n    if (!msg) {\n      // 需要更多数据\n      const data = await\
  \ soRead(conn);\n      bufPush(buf, data);\n\n      if (data.length === 0 && buf.length\
  \ === 0) {\n        return; // 无请求\n      }\n      if (data.length === 0) {\n  \
  \      throw new HTTPError(400, 'Unexpected EOF.');\n      }\n      // 获得了一些数据，再次尝试。\n\
  \      continue;\n    }\n\n    // 处理消息并发送响应\n    const reqBody: BodyReader = readerFrom(conn,\
  \ msg);\n    const res: HTTPRes = await handleReq(msg, reqBody);\n    await writeHTTPResp(conn,\
  \ res);\n\n    // 对于 HTTP/1.0 关闭连接\n    if (msg.version === '1.0') {\n      return;\n\
  \    }\n    // 确保请求正文被消费\n    while ((await reqBody.read()).length > 0) { /* 空 */\
  \ }\n  }\n}\n```\n\n`HTTPError` 是我们自定义异常类型。它用于生成错误响应并关闭连接。注意，这个东西仅仅是为了通过延迟处理错误情况来使我们的代码更简单。在生产代码中你可能不想这样抛出异常。\n\
  \n```typescript\nasync function newConn(socket: net.Socket): Promise<void> {\n \
  \ const conn: TCPConn = soInit(socket);\n  try {\n    await serveClient(conn);\n\
  \  } catch (exc) {\n    console.error('exception:', exc);\n    if (exc instanceof\
  \ HTTPError) {\n      // 意在发送错误响应\n      const resp: HTTPRes = {\n        code:\
  \ exc.code,\n        headers: [],\n        body: readerFromMemory(Buffer.from(exc.message\
  \ + '\\n')),\n      };\n      try {\n        await writeHTTPResp(conn, resp);\n\
  \      } catch (exc) { /* 忽略 */ }\n      }\n    }\n  } finally {\n    socket.destroy();\n\
  \  }\n}\n```\n\n### 步骤 3：分割头部\n\nHTTP 头部以 `\\r\\n\\r\\n` 结束，这就是我们确定其长度的方式。\n\n\n\
  \n\n在理论上，header 的大小没有限制，但在实践中是有限制的。因为我们需要在内存中解析并存储 header，而内存是有限的。\n\n```javascript\n\
  // 一个 HTTP header 的最大长度\nconst kMaxHeaderLen = 1024 * 8;\n\n// 如果可能，从 buffer 头部解析并移除一个\
  \ header 函数 cutMessage(buf: DynBuf): null|HTTPReq {\n  // header 的结束由 '\\r\\n\\\
