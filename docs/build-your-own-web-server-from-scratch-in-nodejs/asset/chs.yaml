  \ zlib.constants.SYNC_FLUSH`\n\n频繁刷新 `compressor` 会降低压缩效率。因此，让应用程序控制是否刷新是一个好主意。例如，在提供静态文件时，不需要刷新\
  \ `compressor`，因为数据生成得尽可能快。\n\n对于生成非常小数据块的应用程序，可能根本不压缩压缩，因为频繁刷新效果不好。\n\n## 12.5\
  \ 讨论：重构为 Stream\n\n你可以尝试重构代码以使用更多的流和管道。首先，替换 `BodyReader` 接口中的 `read()` 函数。\n\n\
  ```typescript\n// 从/向 HTTP body 读取/写入数据的接口\ntype BodyReader = {\n  // \"Content-Length\"\
  , 如果未知则为 -1。\n  length: number,\n  // 读取数据。\n  reader: stream.Readable,\n};\n```\n\
  \n通过更多的流和管道可以节省大量代码：\n\n1. 不需要 `soRead()` 函数的实现。\n2. 读取磁盘代码可以用 `fp.createReadStream()`\
  \ 替换。\n3. `writeHTTPBody()` 函数只需在响应和套接字之间创建一个管道。\n4. 由于我们不再处理显式的读写，分块编码器可以用实现 `stream.Transform`\
  \ 来替换。\n5. 生成器可以通过 `stream.Readable.from()` 转换为 `stream.Readable`。\n\n[报告错误 | 提问](https://forms.gle/UKo4bncUnuMGBrTM7)\
  \ @ [build-your-own.org](https://build-your-own.org)\n\n106\n2024-02-02\n\n12. 压缩与\
  \ Stream API\n\n响应请求的整个过程变成一系列管道：`produce-response | gzip-compress | chunk-encode\
  \ | write-to-socket`\n\n#### 12.6 讨论：水位（High Water Mark）与背压\n\n##### 单项队列\n\n我们维护背压的方法是等待队列或缓冲区排空。从生产者和消费者的角度，队列有\
  \ 2 个状态：\n\n| 队列 | 可以产生 | 可以消费 |\n|---|---|---|\n| 空闲 | 是 | 否 |\n\n这限制了队列最多只能有 1\
  \ 个项目或 1 次待处理写入。\n\n##### 高水位背压\n\n然而，某些背压实现稍微复杂一些——队列限制字节数而不是仅仅 1 次写入。这个限制通常被称为水位。使用水位进行背压时，队列有\
  \ 3 个状态：\n\n| 队列 | 可以产生 | 可以消费 |\n|---|---|---|\n| 空 | 是 | 否 |\n| 半 | 是 | 是 |\n\
  | 满 | 否 | 是 |\n\n这更像 Unix 管道，Unix 管道是一个边界缓冲区，只要它未满就可以向其中添加更多字节；不需要等待它完全排空。\n\n#####\
  \ 使用队列批处理数据\n\n使用水位而不是单项队列的原因是队列可以合并多次小写入。例如，当数据从队列移动到套接字时，有一些可能的优化：\n\n[报告错误 |\
  \ 提问](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)\n\
  \n107\n2024-02-02\n\n12. 压缩与 Stream API\n\n• 队列可以是单个缓冲区；每当你向它写入时，数据都会追加到缓冲区。这会自动合并多次小写入，并将所有数据一次性发送到套接字。\n\
  \n• 队列存储单个缓冲区对象，在发送到套接字之前，可以将多个缓冲区合并为一个较大的缓冲区。\n\n• 队列存储单个缓冲区对象，可以使用 `writev()[6]](https://linux.die.net/man/2/writev)\
  \ 系统调用一次性发送多个缓冲区，而无需手动合并。\n\n\n\n\n\n所有优化都实现了之前讨论的半透明缓冲。另请参见：[stream.Writable._writev[7](https://nodejs.org/api/stream.html#writable_writevchunks-callback)[](#index_split_001.html#p113)\n\
  \n## Node.JS 中的高水位标记 (High Water Mark)\n\n`stream.Readable` 和 `stream.Writable`\
  \ 都有一个内置的高水位标记，在实现它们时，可以通过 `highWaterMark` 选项进行更改。对于高吞吐量应用，通常使用较大的值是很有意义的。\n\n```javascript\n\
  const r = new stream.Readable({\n  highWaterMark: 4096,\n  // 也适用于 `Writable`\n\
  \  read: async () => { /* 生成数据并将其推送到 r.push() */ },\n});\n```\n\n在使用高水位标记处理背压（backpressure）时，请检查\
  \ `Readable.push()` 和 `Writable.write()` 的返回值：\n\n- 当队列满时，它们返回 `false`，因此你可以等待它排空（drain）。\n\
  - 否则，你可以向其中推入更多数据。\n\n我们没有使用它们的返回值，是因为我们简单地将高水位标记视为 0，并在每次写入后排空队列。\n\n表 5：流 中的高水位标记。\n\
  \n| 接口 | 背压指示器 | 等待队列排空 |\n| :--- | :--- | :--- |\n| `Readable` | `.push(data)`\
  \ | 通过 `read()` 回调 |\n| `Writable` | `.write(data, cb)` | 通过 'drain' 事件。 |\n\n流\
  \ 接口支持但不强制要求背压；即使队列满了，你仍然可以向它们推入数据，这对于初学者来说是一个性能陷阱（footgun）。\n\n[[6](https://linux.die.net/man/2/writev)](https://linux.die.net/man/2/writev)\n\
  \n[[7](https://nodejs.org/api/stream.html#writable_writevchunks-callback)](https://nodejs.org/api/stream.html#writable_writevchunks-callback)\n\
