  \ WebSocket。从用户的角度来看，WebSocket 是：\n\n- 一个双向、全双工通道。\n- 基于消息的，而不是字节流。\n- 对现有 HTTP\
  \ 服务器的扩展。\n\n### 从 HTTP/1.1 升级\n\n WebSocket 以 HTTP 头部开始，这是它与 HTTP 唯一的共同点。客户端使用\
  \ `Upgrade: websocket` 头部字段表示意图创建一个 WebSocket，服务器通过此头部和状态码 101 响应，表示 WebSocket 已建立。连接的其余部分将由\
  \ WebSocket 协议接管。\n\n示例：\n\n```\nGET /chat HTTP/1.1\nUpgrade: websocket\nConnection:\
  \ Upgrade\nSec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==\n\nHTTP/1.1 101 Switching\
  \ Protocols\nUpgrade: websocket\nConnection: Upgrade\nSec-WebSocket-Accept: s3pPLMBiTxa9kYGhZK+Oo=\n\
  ```\n\n如果服务器对 WebSocket 一无所知，它将像普通的 HTTP 请求一样响应。这是扩展的一种方式。\n\n[[6](https://linux.die.net/man/2/writev)](https://linux.die.net/man/2/writev)\n\
