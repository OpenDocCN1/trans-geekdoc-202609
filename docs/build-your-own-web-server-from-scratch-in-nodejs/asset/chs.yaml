  \ HTTP 语义与语法\n\n## 文本更容易且容易出错\n\n另一个缺点是处理文本的工作量大得多。为了正确处理文本字符串，你首先需要知道它们的长度，这通常是由分隔符决定的。寻找分隔符的额外工作是人类可读格式的代价。\n\
  \n它也很出错；在 C 语言编程中，空终止字符串（0 分隔符）已导致许多安全漏洞。\n\nHTTP/2 是二进制的，并且比 HTTP/1.1 更复杂，但解析该协议仍然更容易，因为你不需要处理未知长度的元素。\n\
  \n## 6.9 讨论：分隔符\n\n### 分隔数据中的序列化错误\n\n分隔符在文本协议中无处不在。例如，在 HTTP 中……\n\n- 头部行由 `CRLF`\
  \ 分隔\n- 头部和正文由空行分隔。\n\n分隔符的一个问题是数据不能包含分隔符本身。未能强制执行此规则会导致某些注入攻击。\n\n如果恶意客户端可以欺骗有错误的服务器输出包含\
  \ `CRLF` 的头部字段值，且该头部字段是最后一个字段，那么负载体将从攻击者控制的字段值部分开始。这被称为 [“HTTP 响应响应[7]](https://en.wikipedia.org/wiki/HTTP_response_splitting)。\n\
  \n适当的 HTTP 服务器/客户端必须禁止头部字段中的 `CRLF`，因为没有办法对其进行编码。然而，对于许多通用数据格式，情况并非如此。例如，JSON 使用\
  \ `{}[],: ` 来分隔元素，但 JSON 字符串可以包含任意字符，因此字符串被`quoted` 以避免与分隔符产生歧义。但引号本身也是分隔符，因此需要\
  \ `escape sequences` 来编码引号。\n\n这就是为什么你需要一个 JSON 库来生成 JSON，而不是将字符串拼接在一起。HTTP 的定义没有\
  \ JSON 那么完善且更复杂，所以请注意规范。\n\n[[7]https://en.wikipedia.org/wiki/HTTP_response_splitting](https://en.wikipedia.org/wiki/HTTP_response_splitting)\n\
