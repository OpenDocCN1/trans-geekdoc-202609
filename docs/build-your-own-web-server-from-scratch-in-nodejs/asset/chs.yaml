  \    await writeHTTPBody(conn, res.body);\n  }\n} // ...\n```\n\n`curl` 可以请求压缩后的响应：\n\
  \n`curl -vvv http://127.0.0.1:1234/`\n\n#### 步骤 7：刷新缓冲区\n\n压缩可以工作。但有一个问题：当你测试 `/echo`\
