  \n### 使用 Wireshark 分析数据包\n\n你也可以使用 `-w` 标志将捕获的数据包保存到文件中，而不是打印它们。文件格式可以被所有数据包分析软件（包括\
  \ `tcpdump` 本身）读取。\n\n如果你更喜欢图形界面，可以使用 Wireshark 打开捕获的文件，它除了显示十六进制转储外，还可以解析协议，显示每个元素和结构。\n\
  \n- 使用布尔表达式过滤数据包。这会立即生效，因此你可以通过尝试错误来操作。\n- 高亮单个连接。\n- 使用真实数据学习新协议。\n- 查看你自己的实现中哪些问题。\n\
  \n8.6 讨论：WebSocket\n\n**轮询更新**\n\n某些 Web 应用需要从服务器接收实时更新。实现此功能最原始的方法是通过*轮询*。客户端 JS\
  \ 定期发起 AJAX 请求以检查更新。这浪费了资源，且无法用于低延迟场景。\n\n\n\n\n轮询的实现可以不那么简单：服务器可以保持连接，仅在有新更新时才发送响应。如果我们进一步考虑，分块编码（chunked\
  \ encoding）允许在单个响应中包含无限次更新。这被称为长轮询（long polling）。\n\n例如，服务器可以生成由换行符分隔的 JSON 消息流，并通过分块编码交付。客户端只需发送单个请求，客户端就可以读取这些消息，而不会引入轮询带来的额外延迟。\n\
  \n```\nclient\nserver\n------\n------\n|header| ==>\n<== |header|\n...\n<== |JSON\\\
  n|\n<== |JSON\\n|\n<== |JSON\\n|\n...\n```\n\n然而，这种用例已经被 `WebSocket` 淘汰了——这是一种 HTTP\
  \ 协议的扩展。\n\n### WebSocket 是基于消息的\n\n`WebSocket` 的设计背后有多个动机。其中之一是面向消息（`message-oriented`）的设计，而不是字节流。`每行一个\
  \ JSON` 的例子听起来足够简单，但你仍然需要将字节流拆分成行。编写网络应用代码时的首大错误就是没有理解字节流。`WebSocket` 自带了内置帧格式，输出的是消息而不是字节，这让程序员避免了重复低级错误。\n\
  \n### WebSocket 不是请求-响应\n\n`WebSocket` 的另一个贡献是双向和**全双工**（`full-duplex`）通信，这意味着客户端和服务器可以同时互相发送消息。技术上，你可以通过两个\
  \ HTTP 连接（一个用于推送，一个用于拉取）[模拟双向消息[3]](https://en.wikipedia.org/wiki/BOSH_(protocol\\\
  )) 而不使用 `WebSocket`。但 `WebSocket` 可以让客户端和服务器的操作都变得更简单。\n\n### 08. 动态内容与流\n\n```\n\
  client\nserver\n------\n------\n|header| ==>\n<== |header|\n... ...\n|message| ==>\n\
  |message| ==> <== |message|\n|message| ==>\n<== |message|\n|message| ==>\n... ...\n\
  ```\n\n我们将在稍后的章节中实现 `WebSocket`，在此之前，我们已经先探索 HTTP 的其他重要用途。\n\n# 第 09 章：文件 IO 与资源管理\n\
  \n提供静态文件是 HTTP 设计的用途之一。还有几个主题需要探索：\n\n1. `范围请求`（Ranged requests）。获取文件的部分内容。这允许传输被中断并在稍后恢复。\n\
  2. `缓存`（Caching）。减少不必要的传输。\n3. `压缩`（Compression）。减少传输时间和开销。\n\n我们将从实现一个基础文件服务器开始，这将使我们熟悉\
  \ `File API`。\n\n## 9.1 Node.JS 中的文件 IO\n\n如前所述，`Node.JS` 中的 `file API` 有 3 种类：\n\
  \n- 同步 API，我们无法使用。\n- 基于回调的 API，我们不想使用。\n- 基于 promise 的（`promise-based`）API，我们将使用它。\n\
  \n```typescript\nimport * as fs from \"fs/promises\";\n```\n\n我们将使用 4 种文件操作：\n\n\
  1. 打开文件。\n2. `stat` 文件以获取如大小之类的元数据。\n3. 读取文件数据。\n4. 关闭文件。\n\n像套字一样，磁盘文件由封装在 JS 对象中的不透明句柄（handles）表示。这里是我们使用的简化\
  \ TypeScript API 定义。\n\n```typescript\nfunction open(path: string, flags?: string):\
  \ Promise<FileHandle>;\ninterface FileReadResult {\n  bytesRead: number;\n  buffer:\
  \ Buffer;\n}\n\ninterface FileReadOptions {\n  buffer?: Buffer;\n  offset?: number\
  \ | null;\n  length?: number | null;\n  position?: number | null;\n}\n\ninterface\
  \ Stats {\n  isFile(): boolean;\n  isDirectory(): boolean;\n  // ...\n  size: number;\n\
  \  // ...\n}\n\ninterface FileHandle {\n  read(options?: FileReadOptions): Promise<FileReadResult>;\n\
  \  close(): Promise<void>;\n  stat(): Promise<Stats>;\n}\n```\n\n## 9.2 提供磁盘文件\n\
  \n### 步骤 0：为静态文件添加处理器\n\n我们的第一步是编写提供磁盘文件的代码。我们将添加一个处理器来从当前工作目录提供文件。\n\n```javascript\n\
  const uri = req.uri.toString('utf8');\n\nif (uri.startsWith('/files/')) {\n  //\
  \ 从当前工作目录提供文件\n  // FIXME: 防止通过 `..` 逃逸\n  return await serveStaticFile(uri.substr('/files/'.length));\n\
  }\n```\n\n对于生产级 Web 服务器，还需要额外的工作来确保 URI 路径确实位于目标目录内（URI 规范化），并且文件是可访问的。我们将跳过这些工作。\n\
  \n### 步骤 1：打开并关闭文件\n\n`r` 标志用于以只读模式打开文件。如果文件不存在或无法访问，`fs.open()` 将抛出异常。\n\n```javascript\n\
  async function serveStaticFile(path: string): Promise<HTTPRes> {\n  let fp: null|FileHandle\
  \ = null;\n  try {\n    // 打开文件\n    fp = await fs.open(path, 'r');\n  } catch (exc)\
  \ {\n    // 无法打开文件\n    console.info('error serving file:', exc);\n    return resp404();\n\
  \  } finally {\n    // 确保文件被关闭\n    await fp?.close();\n  }\n}\n```\n\n### 步骤 2：stat()\
  \ 文件\n\n`stat()` 方法用于从文件中检索元数据。它包含了文件类型（普通文件、目录）、大小和其他信息。\n\n```javascript\n// 打开文件\n\
  fp = await fs.open(path, 'r');\n// 获取大小\nconst stat = await fp.stat();\nif (!stat.isFile())\
  \ {\n  return resp404();\n}\nconst size = stat.size;\n```\n\n还有一个 `fs.stat(path)`\
  \ 函数，它接受路径而不是句柄。它可以在不打开文件的情况下进行 stat。然而，在句柄上使用 `stat` 更好。因为路径可能会指向不同的文件，这属于`竞态条件`[1](https://en.wikipedia.org/wiki/Time-of-check_to_time-use)。先打开文件可以确保你操作的是同一个文件。\n\
  \n### 步骤 3：构建 BodyReader\n\n`readerStaticFile()` 函数从文件句柄返回一个 `BodyReader`。在我们之前将\
  \ `fp` 设置为 `null` 是重要的，因为 `BodyReader` 稍后会读取文件，`finally` 块在此之后无法再关闭文件。\n\n```javascript\n\
  async function serveStaticFile(path: string): Promise<HTTPRes> {\n  let fp: null|FileHandle\
  \ = null;\n  try {\n    // 打开文件\n    fp = await fs.open(path, 'r');\n    // ...\n\
  \    // body 读取器\n    const reader: BodyReader = readerStaticFile(fp, size);\n \
  \   fp = null;\n    // 现在由读取器负责关闭它\n    return {code: 200, headers: [], body: reader};\n\
  \  } catch (exc) {\n    // ...\n  } finally {\n    // 确保文件被关闭\n    await fp?.close();\n\
  \  }\n}\n```\n\n\n\n\n# 09. 文件 IO 与 资源管理\n\n```typescript\nfunction readerFromStaticFile(fp:\
  \ fs.FileHandle, size: number): BodyReader {\n  let got = 0;\n  // 目前读取的字节数\n  return\
  \ {\n    length: size,\n    read: async (): Promise<Buffer> => {\n      const r:\
  \ fs.FileReadResult<Buffer> = await fp.read();\n      got += r.bytesRead;\n    \
  \  if (got > size || (got < size && r.bytesRead === 0)) {\n        // 不幸的情况：文件大小发生了变化。\n\
  \        // 无法继续，因为我们已经发送了 Content-Length。\n        throw new Error('file size changed,\
  \ abandon it!');\n      }\n      // 注意：自动分配的缓冲区可能更大\n      return r.buffer.subarray(0,\
  \ r.bytesRead);\n    },\n  };\n}\n```\n\n## 第 4 ：确保文件已关闭\n\n如果处理函数成功返回了 `BodyReader`，文件仍然处于打开状态，后续必须关闭。我们将在\
  \ `BodyReader` 接口中添加一个 `close()` 函数来执行清理工作。\n\n```typescript\n// 用于从向 HTTP body\
  \ 读写数据的接口\ntype BodyReader = {\n  // \"Content-Length\"，未知则为 -1。\n  length: number,\n\
  \  // 读取数据。EOF 后返回一个空缓冲区。\n  read: () => Promise<Buffer>,\n  // 可选清理函数\n  close?:\
  \ () => Promise<void>,\n};\n```\n\n`close()` 成员被设置为可选，因此我们只需要修改 `readerFromStaticFile()`\
  \ 函数。\n\n```typescript\nfunction readerFromStaticFile(fp: fs.FileHandle, size: number):\
  \ BodyReader {\n  return {\n    // ...\n    close: async () => await fp.close(),\n\
  \  };\n}\n```\n\n处理函数调用之后的代码被封装在 `try-finally` 块中，以确保清理函数被调用。\n\n```typescript\n\
  const res: HTTPRes = await handleReq(msg, reqBody);\ntry {\n  await writeHTTPResp(conn,\
  \ res);\n} finally {\n  await res.body.close?.();\n  // 清理\n}\n```\n\n这就是最基础的文件服务器。现在是时候停止并测试了。\n\
  \n## 9.3 讨论：手动资源管理\n\nJS 是一种带垃圾回收（GC）的语言，它让你免于手动分配和释放内存这种低效且易出错的工作。然而，仍然有一些*非内存*资源必须手动管理，例如必须关闭的文件和套接字。如果你没有手动内存管理的经验，可能不知道通用如何管理非内存资源。\n\
  \n### 由某些实体拥有的资源\n\n资源的“所有权”（ownership）是手动资源管理中最重要的概念。也就是说，谁负责终止和清理该资源。资源的所有者可以是：\n\
  \n- 函数：在退出前终止资源。\n- 代码作用域：在退出前终止资源。\n- 对象：在自身被终止时终止资源。\n\n所有权可以是静态的或动态的。动态意味着所有者随时间变化。无论你做什么，资源始终只有一个所有。\n\
  \n### 由函数或作用域拥有的资源\n\n在 `serveStaticFile()` 函数中，打开的文件最初由函数拥有，因此函数必须关闭它。整个函数被封装在\
  \ `try-finally` 块中，清理代码放在函数的末尾。其他语言有类似的函数级清理构造结构：\n\n- 在 Golang 中，你可以使用 `defer`。\n\
  - 在 C 中，通常做法是将清理代码放在函数末尾而不是直接返回。\n- 在 C++ 中，你可以使用析构函数，特别是在使用异常时。\n- 在 Python 中，除了\
  \ `try-finally` 块，你还有 `with` 语句。\n\n除了 Go 之外，所有这些机制都提供了函数级清理。\n\n### 由某些实体拥有的资源\n\
  \n在 `serveStaticFile()` 函数中，打开的文件最初由函数拥有，所以函数必须关闭它。整个函数被封装在 `try-finally` 块中，清理代码放在函数的末尾。\n\
  \n### 所有权可以转移\n\n在 `serveStaticFile()` 函数中，当 `BodyReader` 返回时，文件被置为 `null`。这确保了资源只有一个所有者。\n\
  \n### 所有者是链式的\n\n当一个对象拥有资源时，它必须由另一个对象或代码作用域拥有。\n\n\n\n\n这也会执行 `finally` 块。你甚至可以使用特殊类型的异常来通知生成器你打算在途中途终止它，这样生成器就可以处理这种特殊情况。\n\
  \nPython 生成器有[类似的方法[3]](https://docs.python.org/3/reference/expressions.html#generator.close)[](#index_split_001.html#p86)。令人惊讶的是[4]](https://docs.python.org/2.5/whatsnew/pep-342.html)[](#index_split_001.html#p86)，Python\
  \ 的垃圾回收器会自动为生成器执行 `finally` 块，尽管关于 GC 是否应该处理非内存业务尚存争议。\n\n# 9.4 讨论：复用缓冲区\n\n## 缓冲区分配是有成本的\n\
  \n`readerFromStaticFile()` 函数为每次读取分配并返回一个新缓冲区。这并不高效，因为缓冲区的分配是有成本的：\n\n1. 内存内存分配器的成本。对于许多实现来说，这种成本在大多数情况下是\
  \ `constant` 的。在最好的情况下，分配器要么从空列表中返回对象，要么从大内存块中分配。\n2. 零初始化的成本。随缓冲区大小 `linearly`\
  \ 增长。\n\n## 使用未初始化的缓冲区\n\n由于减少了系统调用的次数，通常希望使用较大的缓冲区以获得更高的吞吐量。然而，分配过大的缓冲区具有线性的初始化成本，这可以通过在\
  \ Node.JS 中使用 `uninitialized` 缓冲区来避免。\n\n[[2\\]https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global\\\
  _Objects/Generator/retu](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Generator/return)\n\
  \n[rn](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Generator/return)\n\
  \n[\\[3\\]https://docs.python.org/3/reference/expressions.html#generator.close](https://docs.python.org/3/reference/expressions.html#generator.close)\n\
  \n[\\[4\\]https://docs.python.org/2.5/whatsnew/pep-342.html](https://docs.python.org/2.5/whatsnew/pep-342.html)\n\
  \n[报告错误 | 提问](https://forms.gle/UKo4bncuMGTM7) @ [build-your-own.org](https://build-your-own.org)\n\
  \n# 09. 文件 IO 与资源管理\n\n```\nconst buf = Buffer.allocUnsafe(65536);\n```\n\n此函数之所以为\
  \ `allocUnsafe` 是因为有错误的程序更有可能向用户泄露内部信息。未初始化数据的 bug 由于其不可预测性，也难以调试。\n\n## 复用缓冲区\n\
  \n在某些语言（如 Go 或 Python）中，很难获取未初始化的缓冲区。你可以对对同一个缓冲区进行多次 IO 操作。\n\n```\nfunction readerFromStaticFile(fp:\
  \ fs.FileHandle, size: number): BodyReader {\n  const buf = Buffer.allocUnsafe(65536);\n\
  \  // 每次读取复用\n  return {\n    length: size,\n    read: async (): Promise<Buffer>\
  \ => {\n      const r = await fp.read({buffer: buf});\n      // ...\n      return\
  \ r.buffer.subarray(0, r.bytesRead);\n    },\n  };\n}\n```\n\n这将分摊缓冲区分配的成本。\n\n\
  ## 缓冲区池\n\n与其在本地分配缓冲区，不如维护一个全局的 `used` 缓冲区池。每当你完成一个缓冲区时，就将其放入池中。当你需要缓冲区时，尝试从池中获取一个，只有当池为空时才创建一个新的。此处的优点是：\n\
  \n- 从池中获取内容的成本可能比内存分配器还要低。\n- 不同的代码路径都能从中受益。真实的分配更少。\n\n对象池的代码非常简单。Node.JS 的 `Buffer`\
  \ 类型使用了内置池[5]](https://nodejs.org/api/buffer.html#static-method-bufferallocunsafesize)，但仅用于\
  \ `small` 缓冲区。Go 标准库也包含了对象池[6]](https://pkg.go.dev/sync#Pool)。\n\n## 复用缓冲区时注意生存\n\
  \n缓冲区可以由生产者或消费者分配。在我们看到的所有情况下，生产者分配缓冲区并将其返回给任何使用数据的人。这可能会产生问题，因为在下次 `read()` 运行时，缓冲区可能仍被引用和使用。\n\
  \n```\nfunction readerFromStaticFile(fp: fs.FileHandle, size: number): BodyReader\
  \ {\n  const buf = Buffer.allocUnsafe(65536);\n  // 每次读取复用\n  return {\n    length:\
  \ size,\n    read: async (): Promise<Buffer> => {\n      const r = await fp.read({buffer:\
  \ buf});\n      // 注意：缓冲区的生命周期不明确！\n      return r.buffer.subarray(0, r.bytesRead);\n\
  \    },\n  };\n}\n```\n\n让我们应用资源管理的教训：谁拥有缓冲区？对于本章的代码，我们知道生产者（`BodyReader`）返回的缓冲区被写入套字，我们在调用下次\
  \ `read()` 之前会等待写入完成，因此生产者是引用缓冲区的唯一地方，我们可以推断消费者不需要拥有缓冲区，因此缓冲区复用是有效的。然而，对于更复杂的消费者，这可能不成立！\n\
  \n另一种是消费者分配缓冲区，只要数据是原地处理的，缓冲区的生命周期就是的，因此消费者是唯一的所有者。\n\n```javascript\n// 伪代码！\n\
  const buf = Buffer.allocUnsafe(65536);\n// 每次读取复用\nwhile (more_data()) {\n  const\
  \ nbytes = await read_data(buf);\n  // 从生产者读取\n  await process(buf.subarray(0, nbytes));\n\
  \  // buf 不再使用，所以复用是安全的。\n}\n```\n\n在 Golang 中，从 `io.Reader` 接口拉取数据时，缓冲区由消费者提供。这在设计上鼓励了缓冲区复用并抑制了不必要的分配。\n\
  \n# 第 10 章：范围请求 (Range Requests)\n\n下一步是为文件服务器添加范围请求，这将允许断点续传传输。\n\n## 10.1 范围请求如何工作\n\
  \n### Range Header 字段语法\n\n范围请求由客户端通过 `Range` 头部字段发起。例如，`Range: 0-9` 获取负载的前 10 个字节。该头部字段在\
  \ [RFC 9110](https://www.rfc-editor.org/rfc/9110) 中完整规范。\n\n### 有效范围及示例\n\n有效范围与实际文件范围的交集。假设我们有一个\
  \ 50 字节的文件，这里是一些示例及其有效范围。\n\n| Range: bytes=x | 有效范围 |\n| :--- | :--- |\n| 0-0 |\
  \ [0, 1) |\n| 0-1 | [0, 2) |\n| 10- | [10, 50) |\n| 10-60 | [10, 50) |\n| -10 |\
  \ [40, 50) |\n| -60 | [0, 50) |\n| 4-3 | invalid |\n| 70-60 | invalid |\n| -0 |\
  \ invalid |\n| --1 | invalid |\n| foobar | invalid |\n| 60- | out of range |\n|\
  \ 60-70 | out of range |\n\n服务器还必须处理异常的情况：\n\n- 如果交集为空，服务器返回状态码 416 (Range Not Satisfiable)。\n\
  \n\n\n\n\n- 如果任何一个范围无效，服务器将忽略该 Header 字段（并提供完整文件）。\n\n## 范围请求（Range Requests）是可选的\n\
  \n一旦你开始为 HTTP 服务器添加功能，你就会发现大多数 HTTP 特性都是可选的，而可选功能可能会让情况变得比看起来更复杂。\n\n服务器可能完全不支持范围请求，即使支持，它们也不适用于所有请求。例如，对于动态生成的内容返回范围响应是没有意义的，因为内容的长度预先是不可知的，服务器无法判断请求是否超出了范围。\n\
  \n## 范围响应（Range Responses）通过 206 状态码指示\n\n客户端如何知道服务器是否支持范围请求？这就是 `206 (Partial Content)`\
  \ 部分内容状态码的作用，它表示返回的是部分响应而不是完整响应（`200 OK`）。\n\n## `Content-Range` 返回有效范围\n\n如上例所示，有效范围可能与请求的范围不同，因此服务器需要告诉客户端返回的确切范围。这就是\
  \ `Content-Range` 头部字段的工作。它包含了响应的有效范围以及内容的总长度。\n\n 10. 范围请求\n\n`Content-Range: bytes\
  \ 12-34/1234`\n\n该头部字段也用于 `416 (Range Not Satisfiable)` 响应，告诉客户端内容的正确长度。\n\n`Content-Range:\
  \ bytes */1234`\n\n## 宣告`范围支持（Range Support）`\n\n有方法可以让客户端知道范围请求是否可用。服务器可以在非范围响应中包含\
  \ `Accept-Ranges: bytes` 头部字段，以指示该 URI 支持范围请求，这样客户端就知道如果下载被中断，可以使用范围请求恢复下载。\n\n\
  ## 使用 `HEAD` 方法进行探测\n\n还有一种方法可以在*不*获取响应的任何部分的情况下判断是否支持范围请求——即使用 `HEAD` HTTP 方法。\n\
  \n如果服务器支持 `HEAD` 方法，它的行为应该类似于 `GET`，但*不包含*响应体，只返回响应头部字段和状态码，就像请求被完整提供了一样。客户端随后可以检查\
  \ `Accept-Ranges` 或 `Content-Range`，而无需实际接收内容。\n\n记住，HTTP 中确定有效负载长度的方法非常混乱。`HEAD`\
  \ 方法为客户端增加了一个特殊情况：服务器可能会返回 `Content-Length`，但这次它不会告知有效负载长度；无论头部字段如何说明，`HEAD` 方法都没有响应体！\n\
  \n## 使用多部分消息（Multipart Message）多范围\n\n虽然很少使用，但 `Range` 头部字段可以包含多个由逗号分隔的范围。\n\n这里是一个示例。\n\
  \n```\nGET / HTTP/1.1\nRange: bytes=0-5,8-13\nHTTP/1.1 206 Partial Content\nAccept-Ranges:\
  \ bytes\nContent-Length: 227\n```\n\n 10. 范围请求\n\n`Content-Type: multipart/byteranges;\
  \ boundary=SEPARATOR1234567`\n`--SEPARATOR1234567`\n`Content-Type: text/html; charset=UTF-8`\n\
  `Content-Range: bytes 0-5/1234`\n<html>\n`--SEPARATOR1234567`\n`Content-Type: text/html;\
  \ charset=UTF-8`\n`Content-Range: bytes 8-13/1234`\n<head>\n`--SEPARATOR1234567--`\n\
  \n该响应与单范围响应完全不同：\n\n- 没有使用 `Content-Range`。\n\n相反，它使用了 `Content-Type: multipart/byteranges;\
  \ boundary=x`。\n\n- 响应采用新的消息格式编码：\n  - 由 `Content-Type` 头部字段指示。\n  - 多个部分由随机字符串分隔符分隔。\n\
  \n\n\n\n[报告错误 | 提问](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)\n\
  \n89\n\n2024-02-02\n\n## 10. Range 请求 (Range Requests)\n\n```\nawait writeHTTPBody(conn,\
  \ res.body);\n\n}\n\n} finally {\n\n  await res.body.close?.();\n\n  // cleanups\n\
  }\n```\n\n无论如何 `BodyReader` 都会被关闭，因为在我们的案例中 `BodyReader` 仍然拥有一个文件资源。你也可以在请求处理器中处理\
  \ `HEAD` 方法并尽早关闭文件（从根本上就不创建 `BodyReader`）。\n\n[报告错误 | 提问](https://forms.gle/UKo4bncUnuMGBrTM7)\
  \ @ [build-your-own.org](https://build-your-own.org)\n\n90\n\n# 11 章\n# HTTP 缓存\n\
  \n2024-02-02\n\n在本章中，我们将探索 HTTP 缓存，它可以减少不必要的传输。\n\n## 11.1 缓存验证器 (Cache Validator)\n\
  \nWeb 浏览器默认会缓存响应，即使服务器没有投入太大精力。\n\n问题是：客户端如何知道缓存项是否有效？有一种机制可以服务器查询这些信息。\n\n### 通过时间戳验证\
  \ (Validate by Timestamp)\n\n实现这种方法的方法是通过 `Last-Modified` 和 `If-Modified-Since`\
  \ 头部字段。其步骤如下：\n\n1. 服务器在 `Last-Modified` 头部字段中返回文件的文件系统修改时间。\n2. 客户端缓存响应以及时间戳。\n\
  3. 客户端在复用缓存响应之前对其进行验证，发送将 `If-Modified-Since` 头部字段设置为缓存时间戳的请求：\n- 如果服务器上的文件已修改（由不同的时间戳指示），服务器将照常返回响应。\n\
  - 如果服务器不支持此验证方法并忽略该字段，也照常返回。\n- 如果服务器上的时间戳相同，服务器返回状态码 `304`（未修改），此状态码没有负载，只需告诉客户端复用缓存。\n\
  4. 如果状态码为 `304`，客户端将复用缓存响应；或者使用正常响应并更新缓存。\n\n### 通过 ETag 验证 (Validate by ETag)\n\
  \n时间戳的分率仅为一秒，对于某些用例是不够的，而且文件时间戳并不是识别内容的可靠方法。另一种识别内容的方法是通过 `ETag` 头部。它的工作方式与 `Last-Modified`\
  \ 相同，但其值是任意的，你可以使用内容的哈希值或版本号。\n\n`ETag` 通过 `If-None-Match` 进行验证，这类似于 `If-Modified-Since`。\n\
  \n91\n\n2024-02-02\n\n### 范围请求验证 (Validate for Range Requests)\n\n上述验证适用于客户端缓存了旧版本并期望服务器返回新版本场景。然而，范围请求的情况不同：如果内容与客户端拥有的相同，服务器只能返回部分响应。在这种情况下，客户端不能使用\
  \ `If-Modified-Since` 或 `If-None-Match`；而是使用 `If-Range` 头部，它包含 `ETag` 或时间戳。如果 `If-Range`\
  \ 值*不匹配*（则导致完整响应）。\n\n### 验证头部总结 (Summary of Validation Headers)\n\n| 服务器到客户端 |\
  \ 客户端到服务器 | 注释 |\n| :--- | :--- | :--- |\n| `Last-Modified` | `If-Modified-Since`\
  \ | 时间戳。 |\n| `ETag` | `If-None-Match` | 哈希、版本号等。 |\n| `ETag/Last-Modified` | `If-Range`\
  \ | 部分还是完整？ |\n\n### 实现时间戳验证器 (Implementing the Timestamp Validator)\n\n作为一个简单的服务器，添加\
  \ `Last-Modified` 和 `If-Modified-Since` 头部字段是轻而易举的。\n\n```javascript\nconst ts =\
  \ Math.floor(stat.mtime.getTime() / 1000); // 修改 ts\n\nconst headers: Buffer[] =\
  \ [\n  // 支持范围请求\n  Buffer.from('Accept-Ranges: bytes'),\n  // 用于缓存验证\n  Buffer.from(`Last-Modified:\
  \ ${stat.mtime.toUTCString()}`)\n];\n\n// 检查条件\nconst ifm = fieldGet(req.headers,\
  \ 'If-Modified-Since');\nif (ifm && parseHTTPDate(ifm.toString('latin1')) === ts)\
  \ {\n  const empty = readerFromMemory(Buffer.from(''));\n  return {code: 304, headers:\
  \ headers, body: empty};\n}\n\nlet hrange = fieldGet(req.headers, 'Range');\nconst\
  \ ifr = fieldGet(req.headers, 'If-Range');\nif (ifr && parseHTTPDate(ifr.toString('latin1'))\
  \ !== ts) {\n  hrange = null;\n  // 忽略 Range 字段\n}\n// 使用 hrange 检查请求范围 ...\n```\n\
  \n[报告错误 | 提问](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)\n\
  \n92\n\n2024-02-02\n\n11 HTTP 缓存\n\n`ETag` 可能需要一个独立的子系统来跟踪内容（无论是哈希值还是版本号），因此我们不会编写代码。\n\
  \n## 11.2 讨论：服务端缓存控制 (Discussion: Server-Side Cache Control)\n\n我们已经讨论了客户端如何验证缓存，下一步是从服务器端控制缓存行为。即客户端应该保留缓存多久。\n\
  \n服务器使用 `Cache-Control` 头部字段建议客户端缓存。其值是逗号分隔的指令列表。例如：\n\n`Cache-Control: no-store,\
  \ no-cache, max-age=0, must-revalidate`\n\n### 何时重新验证缓存 (When to Revalidate Cache)\n\
  \n`max-age=x` 指令指定缓存项存活多少秒（生存时间，或 TTL）。然而，缓存在过期时并简单地删除项。它非常复杂，复杂到有自己的文档：[RFC 9111](https://www.ietf.org/rfc/rfc9111)。\n\
  \n缓存项根据其是否超过了 `max-age` 被描述为*新鲜的 (fresh)* 或*过期的 (stale)*。新鲜或过期的状态决定了何时应该验证项。\n\n\
  | 服务器提供的 Cache-Control | 验证过期项 | TTL |\n| :--- | :--- | :--- |\n| `max-age=x` |\
  \ 可能 (maybe) | x |\n| `max-age=x, must-revalidate` | 必须 (must) | x |\n| `max-age=x,\
  \ immutable` | 应该 (should) | x |\n| `max-age=0, must-revalidate` | (不新鲜) | 0 |\n\
  | `no-cache` | (不新鲜) | 0 |\n| (不存在) | 启发式 (heuristic) | 启发式 (heuristic) |\n\n**控制\
  \ TTL**\n\n单凭 `max-age` 指令对缓存所示的寿命并没有提供足够的控制，因为表格使用了模糊的词汇“maybe”和“should”，它们之间有何区别？\n\
  \n[RFC 9111](https://www.ietf.org/rfc/rfc9111)\n\n93\n\n2024-02-02\n\n11 HTTP 缓存\n\
  \n浏览器通常会复用新鲜项，但即使缓存是新鲜的，它可能会重新验证项，这发生在用户点击刷新按钮时。\n\n但为什么“验证过期项”是“应该”？如果设置 TTL 的效果无法保证，它的意义何在？事实上有两层保证：\n\
  \n1. 没有 `must-revalidate`，过期项可能仍被复用，这发生在服务器不可用时。\n2. 有了 `must-revalidate`，缓存 TTL\
  \ 实际上被遵守了。\n\n不过实现实现并不区分“应该”和“必须”的情况。\n\n**让客户端始终检查服务器 (Make the Client Always Check\
  \ the Server)**\n\n`no-cache` 指令具有误导性，它并不是“不要缓存”，它是 `max-age=0, must-revalidate`\
  \ 的缩写，意味着“缓存但始终验证”。它用于需要最新数据的情况。\n\n**防止缓存 (Prevent Caching)**\n\n要完全防止缓存，使用 `no-store`\
  \ 指令，它指示客户端不要碰缓存。（这也不会导致现有的缓存项被删除。）\n\n**减少新鲜验证 (Reduce Fresh Validations)**\n\n\
  `immutable` 指令是一种优化；它告诉客户端即使在刷新时也不要重新验证新鲜项。这可以在 URL 是不可变的时使用，例如通过其哈希值检索资源时。不过并非所有浏览器都实现了这一点。\n\
  \n**启发式缓存 (Heuristic Caching)**\n\n\n\n\n\n# 11. HTTP 缓存\n\n即使有了这些指令，客户端仍然拥有很大的自由度。如果没有实际用例，仅凭规范无法实现实用的软件。当服务器完全不使用\
  \ `Cache-Control` 时，客户端的自由度达到最高。这在网络浏览器中被称为[启发式](https://developer.mozilla.org/en-US/docs/Web/HTTP/Caching#heuristic_caching)\
  \ [缓存[2]](https://developer.mozilla.org/en-US/docs/Web/HTTP/Caching#heuristic_caching)。\n\
  \n例如，浏览器可能会使用 `Last-Modified` 时间作为一种启发，使用从上次修改到现在的持续时间的一小部分作为缓存的 TTL（生存时间）。\n\n\
  ## 非客户端缓存\n\n到为止，我们假设缓存是由面向用户的客户端（如浏览器）完成的。在实践中，缓存也可以以下方式提供：\n\n- 由服务器应用程序。这对于动态生成的内容特别有用。应用程序存储生成的内容以便自身复用。目标是节省延迟和/或生成内容的成本。由于应用程序控制内容，也可以轻松使用\
  \ `ETag` 方案来辅助客户端缓存。\n- 由透明代理或中间件。代理充当源服务器的客户端，代表真实客户端处理请求。它可以像其他客户端一样缓存响应。这种形式的代理可以由服务开发者、CDN\
  \ 或 ISP（在 HTTPS 流行之前）部署。\n\n## 共享缓存与私有缓存\n\n缓存代理的一个问题是，响应可能是个性化的，那么缓存代理如何知道哪些内容属于哪个用户？\n\
  \n这个问题在浏览器中并不存在，因为它代表单一用户。对于多个用户共享的缓存，有指令可以显式将响应标记为公共（public）或私有（private）。`private`\
  \ 指令用于不应被代理缓存的个性化内容。\n\n`Cache-Control: private`\n\n对于决定是否缓存还有额外的规则。例如，`Authorization`\
  \ 头部字段通常会防止代理缓存响应。但 `public` 指令可以覆盖此规则并使内容可缓存。\n\n## 云端缓存\n\nRFC 仅以非常松散的定义定义了预期的缓存行为。对于开发或理解真实世界的项目，你应该依赖软件/服务手册。\n\
  \n有许多云提供商提供 CDN 或缓存服务，有些甚至提供了额外的缓存控制。阅读它们的文档以了解它们在实践中是如何工作的。示例包括：\n\n- [Cloudflare[3]](https://developers.cloudflare.com/cache/concepts/cache-control/)\n\
  - [AWS CloudFront[4]](https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Expiration.html)\n\
  - [Azure CDN[5]](https://learn.microsoft.com/en-us/azure/cdn/cdn-how-caching-works)\n\
  - [Google Cloud CDN[6]](https://cloud.google.com/cdn/docs/caching)\n\n# 第 12 章：压缩与流\
  \ API\n\n下一个主要功能是压缩。我们还将探索 Node.JS 中的流抽象（我们之前忽略了它）。\n\n## 12.1 HTTP 压缩如何工作原理\n\n\
  ### 与 `Accept-Encoding` 协商\n\nHTTP 压缩与其他功能一样，是可选的，因此客户端必须显式请求服务器压缩响应。这是通过 `Accept-Encoding`\
  \ 头部字段实现的，它包含一个用逗号分隔的压缩方法列表。常用的方法包括：\n\n- `gzip`\n- `deflate`\n- `br`。[Brotli[1]](https://www.rfc-editor.org/rfc/rfc7932.html)\
  \ 更新更新但支持范围较小。\n\n该方法后面可以跟一个可选的权重以指示其优先级。具体语法请参见 RFC。\n\n`Accept-Encoding: deflate,\
  \ gzip;q=1.0`\n\n### 使用 `Content-Encoding` 压缩\n\n如果服务器选择了建议的压缩方法之一，它将通过 `Content-Encoding`\
  \ 进行报告。\n\n`Content-Encoding: gzip`\n\n可以应用多个 `Content-Encoding`。但是，这没有实际用途。\n\n\
  某些内容类型已经是压缩过的，例如 PNG、JPG 或 ZIP。最好将它们排除在压缩之外，因为它们是不可压缩的。\n\n### 压缩与 `Content-Length`\n\
  \n`Content-Length` 的目的不会随压缩而改变，即它是 HTTP 体的长度，而不是未压缩数据的长度。\n\n当实时应用压缩时，压缩后的尺寸是无法预知的（除非缓冲整个输出，但这对于大内容无效），因此我们还需要使用分块传输（chunked\
  \ encoding）。\n\n### 压缩与缓存\n\n压缩是 CPU 密集型的，它并不总是实时应用的；缓存代理可以缓存并提供压缩后的响应（如果 `Accept-Encoding`\
  \ 允许）。\n\n如果缓存代理不在乎压缩，它至少不能混合来自不同压缩方法的响应。这就是 `Vary` 头部字段的目的，告知代理如果使用了某些头部字段，响应将会发生变化。\n\
  \n例如，如果使用了 `Vary: content-encoding`，缓存项将使用 `Content-Encoding` 的值作为键，因此缓存查找将考虑这一点。\n\
  \n### 压缩上传\n\n由于内容协商的性质，目前没有一种标准的方法来压缩请求体。如果客户端使用 `Content-Encoding` 这样做，可能是应用程序而非\
  \ HTTP 服务器来解压缩请求。\n\n### 压缩与范围请求（Range Requests）\n\n`Content-Encoding` 是内容的属性。因此，`Range`\
  \ 头部字段作用于压缩后的数据，这并不是我们预期的行为。\n\n通常做法是在提供范围响应时不进行压缩。\n\n### 使用 `Transfer-Encoding`\
  \ 压缩\n\n还有另一种罕用/受支持的压缩方法。`Transfer-Encoding` 通常用于分块传输，它也可以压缩负载。\n\n`Transfer-Encoding:\
  \ gzip, chunked`\n\n上述头部字段意味着负载先经过 gzip 压缩，然后进行分块传输。\n\n它与 `Content-Encoding` 有什么区别？区别在于\
  \ `Transfer-Encoding` **不是**内容的属性，因此范围请求可以作用于 `Transfer-Encoding`，但不能作用于 `Content-Encoding`。\n\
  \n\n\n\n\n与其他晦涩的 HTTP 特性不同，使用 `Transfer-Encoding` 进行压缩实际上更实用，因此更为优，但遗憾的是实现上却走向了反面。\n\
  \n`TE` 头部字段用于协商 `Transfer-Encoding`，总结下所示。\n\n表 1：HTTP 压缩协商。\n\n| 请求头 | 响应头 | 广泛使用？\
  \ |\n| :--- | :--- | :--- |\n| `Range` | | 否 |\n| `Accept-Encoding` | `Content-Encoding`\
  \ | 是 |\n| `TE` | `Transfer-Encoding` | 支持（否） |\n\n## 12.2 使用管道进行数据处理\n\n### 数据处理与\
  \ IO\n我们将使用内置的 [`zlib[4]`](https://nodejs.org/api/zlib.html) 模块来压缩响应体。压缩数据有 2 类\
  \ API，最简单的是输入作为单个 buffer 提供并将压缩后的数据作为单个 buffer 返回。如果输入很大，这种方法将不起作用，因为它可能无法放入内存。而且即使不考虑内存问题，延迟也会很糟糕。\n\
  \n```javascript\nzlib.gzip(buffer, callback);\n```\n\n第二类是*实时*产生输出，你首先初始化有状态的压缩对象，然后向压缩器提供输入，压缩器会同时产生输出。\n\
  \n```javascript\nconst obj = zlib.createGzip();\n// 从它读取并向它写入\n```\n\n压缩器具有背压（backpressure），因此如果使用得当，它不会撑爆内存。你必须同时排空输出以保持输入流动。\n\
  \n实时处理数据的方法是使用可以同时*读取*和*写入*的有状态处理器，这与我们处理 socket 的方式类似。\n\n[[4]https://nodejs.org/api/zlib.html](https://nodejs.org/api/zlib.html)\n\
  \n[报告错误 | 提问问题](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)\n\
  \n99\n2024-02-02\n\n## 12. 压缩与流 API\n\n### 用于组合数据处理器的 Unix 管道\n拥有多个数据处理步骤是常见的，而\
  \ Unix 管道是编程和组合这些步骤的一种*高层*方式。一个具体的例子是：\n\n```bash\ntar -c -f - ./directory | gzip\
  \ | nc 1.2.3.4 1234\n```\n\n它通过 2 个管道连接 3 个步骤：\n1. `tar`，归档生产者。\n2. `gzip`，消耗归档并产生\
  \ gzip 数据。\n3. `nc`，消耗 gzip 数据并通过网络发送。\n\n管道自动将输出连接到输入，而无需用户编写代码在步骤之间移动数据。\n\n###\
  \ 抽象管道\n我们可以在 HTTP 服务器中使用一种类似管道的抽象：\n\n`produce-response | gzip-compress | chunk-encode\
  \ | write-to-socket`\n\n这种模式有如下：\n- 无需显式读取和写入数据；编写的代码更少！\n- 背压是自动的（如果每个处理器都实现得当）。\n\
  - 正如我们所看到的，它不容易出错。\n\n## 12.3 探索 Node.JS 中的流 API\n\n### 流接口列表\nNode.JS 中确实存在管道，你可以通过\
  \ [Stream API[5]](https://nodejs.org/api/stream.html)[](#index_split_001.html#p105)\
  \ 管道化内容\n\n```javascript\nimport * as stream from \"stream\";\n```\n\n它定义了一组你可以实现的接口。\n\
  \n[[5]https://nodejs.org/api/stream.html](https://nodejs.org/api/stream.html)\n\n\
  [报告错误 | 提问问题](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)\n\
  \n100\n2024-02-02\n\n| 名称 | 说明 | 示例 |\n| :--- | :--- | :--- |\n| `Readable` | 从此消耗输出。\
  \ | `fs.createReadStream()` |\n| `Writable` | 向此处提供输入。 | `fs.createWriteStream()`\
  \ |\n| `Duplex` | Readable + Writable。 | `net.Socket` |\n| `Transform` | 扩展 Duplex。\
  \ | `zlib.createGzip()` |\n\n`Readable` 和 `Writable` 是 2 个基础抽象。`Duplex` 和 `Transform`\
  \ 都是 `Readable` 和 `Writable` 的组合，它们之间的区别对我们目前并不重要。\n\n一些内置的 Node.JS 模块已经实现了它们，如表所示。\n\
  \n### 在流接口上使用管道\n我们探索这些抽象的目标是在它们上使用管道。\n\n```javascript\nimport { pipeline } from\
  \ \"stream/promises\";\n```\n\n`pipeline()` 函数将一个 `stream.Readable` 连接到 `stream.Writable`。在创建管道后，数据会自动从生产者流向消费者，并且存在背压，就像在\
  \ Unix 管道中一样。这个函数以 Unix 管道命名，不要将其与请求管道化（request pipelining）混淆。\n\n```typescript\n\
  function pipeline(src: stream.Readable, dst: stream.Writable): Promise<void>;\n\
  ```\n\n你还可以在源和目的地之间放置一个或多个 `stream.Duplex`。\n\n```typescript\nfunction pipeline(\n\
  \  src: stream.Readable,\n  transform1: stream.Duplex,\n  transform2: stream.Duplex,\n\
  \  // 更多 ...\n  dst: stream.Writable,\n): Promise<void>;\n```\n\n## 12.4 实现 HTTP\
  \ 压缩\n`zlib` 模块为压缩对象实现了 `stream.Duplex`。这是一个学习如何 Node.JS Stream API 的绝佳机会。\n\n[报告错误\
  \ | 提问问题](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)\n\
  \n101\n2024-02-02\n\n### 步骤 1：检查头部字段并启用压缩\n根据头部字段操作。我们将在客户端请求时实现压缩。\n\n```typescript\n\
  function enableCompression(req: HTTPReq, res: HTTPRes): void {\n  const codecs:\
  \ string[] = req.headers['accept-encoding'];\n  if (!codecs.includes('gzip')) {\n\
  \    return;\n  }\n  // 转换响应\n  res.headers['content-encoding'] = 'gzip';\n  res.body\
  \ = gzipFilter(res);\n}\n```\n\n### 步骤 2：理解没有管道时的注意事项\n如果不使用 `pipeline()` 函数，你可能会这样构思方案：\n\
  \n```typescript\nfunction gzipFilter(reader: BodyReader): BodyReader {\n  const\
  \ gz: stream.Duplex = zlib.createGzip();\n  return {\n    length: -1,\n    read:\
  \ async (): Promise<Buffer> => {\n      const data = await reader.read();\n    \
  \  await gz.write(data);\n      // 背压导致死锁！\n      return await gz.read();\n    },\n\
  \  };\n}\n```\n\n遗憾的是，这种伪代码由于两个原因不起工作：\n1. 压缩器实现了背压，这意味着如果你写入大量输入，代码将阻塞直到输入被处理并*排空*。但在上面的伪代码中，数据是在写入完成后才被排空的，这是一种死锁情况！（我们在“管道化请求”部分讨论过类似的死锁。）\n\
  2. 大多数数据压缩方法本质上需要缓存；1 次输入不会产生 1 个压缩输出。在没有足够数据的情况下，压缩器不会产生输出，因为它还没有决定如何压缩数据。从压缩器读取将阻塞在等待更多数据！\n\
  \n在 Unix 管道中，读取和写入发生在不同的进程中，管道是*同时*填充和排空的，因此不会出现上述方案中的死锁。这就是为什么我提到管道抽象的使用不容易出错。\n\
  \n### 步骤 3：实现 `stream.Readable`\n我们回到了正轨。在使用 `pipeline()` 函数之前，我们必须为数据源 `BodyReader`\
  \ 实现 `stream.Readable` 接口。\n\n以下是实现 `stream.Readable` 的方法：\n1. `stream.Readable`\
  \ 有一个内部队列，使用 `push()` 方法将数据添加到队列，然后数据即可消费。\n2. 你应该何时向队列添加数据？你需要实现一个 `read()` 回调，该回调会在队列为空且有人在消费时被调用。这对于维护背压至关重要。\n\
  \n\n\n\n\n### 3. 使用 `destroy()` 方法将错误传递给消费者。\n\n```javascript\nfunction body2stream(reader:\
  \ BodyReader): stream.Readable {\n  let self: null|stream.Readable = null;\n  //\
  \ make TS happy\n  self = new stream.Readable({\n    read: async () => {\n     \
  \ try {\n        const data: Buffer = await reader.read();\n        self!.push(data.length\
  \ > 0 ? data : null);\n      } catch (err) {\n        self!.destroy(err instanceof\
  \ Error ? err : new Error('IO'));\n      }\n    },\n  });\n  return self;\n}\n```\n\
  \n[报告错误 | 提问](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)\n\
  \n103\n2024-02-02\n\n## 12. 压缩与 Stream API\n\n注意：`push()` 方法使用 `null` 来标记流的结束，这与我们正在使用的（0\
  \ 长度缓冲区）不同。\n\n#### 步骤 4：创建管道（Pipe）\n\n让我们尝试在 `BodyReader` 和 `compressor` 之间建立一个管道。\n\
  \n```javascript\nfunction gzipFilter(reader: BodyReader): BodyReader {\n  const\
  \ gz: stream.Duplex = zlib.createGzip();\n  const input: stream.Readable = body2stream(reader);\n\
  \  (async () => {\n    try { await pipeline(input, gz); }\n    catch (err) { gz.destroy(err);\
  \ }\n  })();\n  // not awaiting it\n  // return the wrapped `BodyReader` ...\n}\n\
  ```\n\n`pipeline()` 函数将为我们移动数据，并返回一个 promise 供我们等待。\n\n我们还必须在等待 promise 时捕获任何异常，并且捕获的错误必须传递给下一个流，否则它的消费者将永远挂起。\n\
