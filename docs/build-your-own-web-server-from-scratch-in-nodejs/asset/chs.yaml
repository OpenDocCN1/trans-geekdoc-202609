  \    }\n  });\n}\n\nlet server = net.createServer();\nserver.on('error', (err: Error)\
  \ => { throw err; });\nserver.on('connection', newConn);\n```\n\n当传输从任何一方结束时，套接字会被运行时自动关闭。`net.Socket`\
  \ 上还有一个 'error' 事件用于报告 IO 错误。该事件也会导致运行时关闭套接字。\n\n*(注：由于原文中从 Step 6 之后出现了大量重复的描述和乱码片段，译文已按要求去除了重复部分。)*\n\
  \n\n\nPromise 可以被视为管理回调的另一种方式。它们也被描述为 `asynchronous`（异步），意味着结果是通过回调传递的。这些 API 不会阻塞事件循环，因为\
  \ JS 代码不会等待结果；相反，JS 代码会返回运行时，当结果就绪时，运行时会调用回调来继续你的程序。\n\n与之相反的是 `synchronous`（同步）API，它会阻塞调用的操作系统线程以等待结果的产生。例如，让我们来看\
  \ `fs` 模块的文档，文件 API 在[所有 3 种](https://nodejs.org/api/fs.html)[](#index_split_000.html#p22)\
  \ 中可用。\n\n```\n// promise\nfilehandle.read([options]);\n\n// callback\nfs.read(fd[,\
  \ options], callback);\n\n// synchronous, do not use!\nfs.readSync(fd, buffer[,\
  \ options]);\n```\n\n在网络应用中，你**不会**使用同步 API，因为它会阻塞事件循环。它们存在于某些简单的用例（如脚本），这些场景完全不依赖事件循环。\n\
  \n## 跨越网络的事件编程\n\nIO 不仅仅是磁盘文件和网络。在 GUI 系统中，来自鼠标和键盘的用户输入也是 IO。而且事件循环并不是 Node.js 运行时特有的；Web\
  \ 浏览器所有其他 GUI 应用程序底层也使用事件循环。你可以将 GUI 编程经验转移到网络编程，反之亦然。\n\n[[3]https://nodejs.org/api/fs.html](https://nodejs.org/api/fs.html)\n\
  \n[报告错误 | 提问](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)\n\
  \n17\n2024-02-02\n\n## 03. 代码一个 TCP 服务器\n\n## 3.7 讨论：基于 Promise 的 IO\n\n正如我们之前提到的，还有另一种编写\
  \ IO 代码的风格。另一种风格使用 Promise 代替回调。基于 Promise 的 API 的优势是你可以对它们进行 `await` 并获取结果，从而避免将你的程序拆散成散落在各处的微小回调。\n\
  \n一个假设的基于 Promise 的 `accept` 原语 API 如下：\n\n```javascript\n// 伪代码!\nwhile (running)\
  \ {\n  let socket = await server.accept();\n  newConn(socket);\n  // 此处不要 await\n\
  }\n```\n\n而假设的 `read` 和 `write` 原语的 API 如下：\n\n```javascript\n// 伪代码!\nasync function\
  \ newConn(socket) {\n  while (true) {\n    let data = await socket.read();\n   \
  \ if (!data) {\n      break;\n      // EOF\n    }\n    await socket.write(data);\n\
  \  }\n}\n```\n\n上面的伪代码看起来是同步的，但并没有阻塞事件循环。虽然在这一点上优势可能并不明显，因为我们的程序非常简单。\n\n一些 Node.js\
  \ API（但不是所有）同时可以在基于回调和基于 Promise 的风格中使用。然而，通过努力，基于回调的 API 可以转换为基于 Promise 的 API，正如我们将在下一节中看到的。\n\
  \n[报告错误 | 提问](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)\n\
  \n18\n\n## 第 04 章\n## Promise 与事件\n\n在本章中，我们将再次实现回显服务器，但将使用基于 Promise 的风格，这是本书其余部分的基础。这一决定将在后文解释。\n\
  \n## 4.1 async 和 await 简介\n\n让我们快速浏览 JS 中的 async/await 和 `Promise` 类型，以防你尚不熟悉它们。\n\
  \n### 使用回调\n\n一个基于回调的 API 示例。应用逻辑在回调函数中继续。\n\n```javascript\nfunction my_app() {\n\
  \  do_something_cb((err, result) => {\n    if (err) {\n      // 失败。\n    } else\
  \ {\n      // 成功，使用结果。\n    }\n  });\n}\n```\n\n### 使用 Promises 和 await\n\n在 promise\
  \ 上使用 `await` 的示例。应用逻辑在同一个 async 函数中继续。\n\n```javascript\nfunction do_something_prmoise():\
  \ Promise<T>;\nasync function my_app() {\n  try {\n    const result: T = await do_something_prmoise();\n\
  \  } catch (err) {\n    // 失败。\n  }\n}\n```\n\n优势：应用逻辑没有被拆分成多个函数。\n\n### 创建 Promise\n\
  \n创建一个 promise 的示例：将基于回调的 API 转换为基于 Promise 的 API。\n\n```javascript\nfunction do_something_prmoise()\
  \ {\n  return new Promise<T>((resolve, reject) => {\n    do_something_cb((err, result)\
  \ => {\n      if (err) {\n        reject(err);\n      } else {\n        resolve(result);\n\
  \      }\n    });\n  });\n}\n```\n\n回调在 JS 中是不可避免的。在创建 promise 对象时，会将一个 `executor`\
  \ 回调作为参数传递，以接收两个回调：\n\n- `resolve()`导致 `await` 语句返回一个值。\n- `reject()`导致 `await`\
  \ 语句抛出一个异常。\n\n当结果可用或操作失败时，你必须调用其中一个。这可能发生在执行器函数之外，因此你可能需要存储这些结果。\n\nPromise 的术语：\n\
  \n- **Fulfilled**（已完成）：调用了 `resolve()`\n- **Rejected**（已拒绝）：调用了 `reject()`\n- **Settled**（已就决）：已完成或已拒绝。\n\
  - **Pending**（进行中）：未就决。\n\n19\n2024-02-02\n\n## 04. Promise 与事件\n\n## 4.2 理解 async\
  \ 和 await\n\n### 普通函数通过 return 返回\n\n有两种 JS 函数：普通函数和 async 函数。普通函数从开始到返回（显式或隐式）。由于\
  \ JS 运行时是单线程的，你无法进行阻塞，相反你注册回调，运行时可以轮询事件。\n\n### async 函数通过 await 返回\n\n最初，`Promise`\
  \ 类型只是管理回调的方式。它允许链式多个嵌套函数。然而，由于 async 函数的加入，我们不再需要这种 promise 使用。async 函数可以在执行中间返回运行时；这发生在对\
  \ promise 使用 `await` 语句时。\n\n### 调用 async 函数启动新任务\n\n调用 async 函数会导致一个在返回或抛出异常时决定的\
  \ promise。你可以像普通 promise 一样等待它，但它会被运行时调度。这类似于多线程编程中启动线程。但所有的 JS 代码共享单个线程，所以更好的词是\
  \ *任务*。\n\n在不同环境中启动任务的方法：\n\n- 在 JS 中，通过不等待 promise 启动任务。\n- 在 Go 中，使用 `go` 语句。\n\
  - 在 Python 中，async/await 与 JS 类似，但你需要自己运行事件循环，因为它不是语言内置的。\n- 在没有事件循环的环境中，你可以启动操作系统线程而不是用户级任务。\n\
  \n## 4.3 从事件到 Promise\n\n`net` 模块未提供基于 Promise 的 API，因此我们需要实现上一节中的假设 API。\n\n```javascript\n\
  function soRead(conn: TCPConn): Promise<Buffer>;\nfunction soWrite(conn: TCPConn,\
  \ data: Buffer): Promise<void>;\n```\n\n[报告错误 | 提问](https://forms.gle/UKo4bncUnuMGBrTM7)\
  \ @ [build-your-own.org](https://build-your-own.org)\n\n20\n2024-02-02\n\n### 步骤\
  \ 1：分析解决方案\n\n`soRead` 函数返回一个带有 socket 数据的 promise。它依赖 3 个事件。\n\n1. 'data' 事件完成\
  \ promise。\n2. 在读取 socket 时，我们还需要知道是否发生了 EOF。因此，'end' 事件也会完成 promise。指示 EOF 的常用方法是返回零长度的数据。\n\
  \n\n\n\n**3. 还有一个 'error' 事件，当此事件发生时，我们想要拒绝该 promise，否则 promise 将永远挂起。**\n\n为了通过这些事件解析或拒绝\
  \ promise，必须将 promise 存储在某个地方。\n\n为此，我们将创建一个 `TCPConn` 包装对象。\n\n```typescript\n\
  // 一个基于 promise 的 TCP 套接 API。\n\ntype TCPConn = {\n  // JS socket 对象\n  socket:\
  \ net.Socket;\n  // 当前读取操作 promise 的回调函数\n  reader: null|{\n    resolve: (value:\
  \ Buffer) => void,\n    reject: (reason: Error) => void,\n  };\n};\n```\n\npromise\
  \ 的 `resolve` 和 `reject` 回调存储在 `TCPConn.reader` 字段中。\n\n### 步骤 2：处理 'data' 事件\n\n\
  现在让我们尝试实现 `'data'` 事件。这里我们有一个问题：每当数据到达时都会触发 `'data'` 事件，但 promise 只有在程序从 socket\
  \ 读取数据时才存在。因此，我们必须有一种方法来控制 `'data'` 事件何时准备触发。\n\n```javascript\nsocket.pause();\
  \ // 暂停 'data' 事件\nsocket.resume(); // 恢复 'data' 事件\n```\n\n有了这些知识，我们现在可以实现 `soRead`\
  \ 函数。\n\n```typescript\n// 从 net.Socket 创建包装器\nfunction soInit(socket: net.Socket):\
  \ TCPConn {\n  const conn: TCPConn = {\n    socket: socket, reader: null,\n  };\n\
  \  socket.on('data', (data: Buffer) => {\n    console.assert(conn.reader);\n   \
  \ // 暂停 'data' 事件直到下次读取。\n    conn.socket.pause();\n    // 完成当前读取的 promise。\n  \
  \  conn.reader!.resolve(data);\n    conn.reader = null;\n  });\n  return conn;\n\
  }\n\nfunction soRead(conn: TCPConn): Promise<Buffer> {\n  console.assert(!conn.reader);\n\
  \  // 不并发调用\n  return new Promise((resolve, reject) => {\n    // 保存 promise 回调\n\
  \    conn.reader = {resolve: resolve, reject: reject};\n    // 恢复 'data' 事件以便稍后完成\
  \ promise。\n    conn.socket.resume();\n  });\n}\n```\n\n由于 `'data'` 事件会在我们读取 socket\
  \ 之前被暂停，因此 socket 在创建后默认应该是暂停状态。有一个标记可以实现这一点。\n\n```javascript\nconst server = net.createServer({\n\
  \  pauseOnConnect: true,\n  // TCPConn 需要\n});\n```\n\n### 步骤 3：处理 'end' 和 'error'\
  \ 事件\n\n与 `'data'` 事件不同，`'end'` 和 `'error'` 事件无法暂停，并且会在发生时立即触发。我们可以通过将它们存储在包装对象并在\
  \ `soRead` 中检查它们来处理。\n\n```typescript\n// 一个基于 promise 的 TCP 套接 API。\ntype TCPConn\
  \ = {\n  // JS socket 对象\n  socket: net.Socket;\n  // 来自 'error' 事件\n  err: null|Error;\n\
  \  // 来自 'end' 事件\n  ended: boolean;\n  // 当前读取操作 promise 的回调函数\n  reader: null|{\n\
  \    resolve: (value: Buffer) => void,\n    reject: (reason: Error) => void,\n \
  \ };\n};\n\n// 如果存在当前 reader，解析或拒绝它。\n// 从 net.Socket 创建包装器\nfunction soInit(socket:\
  \ net.Socket): TCPConn {\n  const conn: TCPConn = {\n    socket: socket, err: null,\
  \ ended: false, reader: null,\n  };\n  socket.on('data', (data: Buffer) => {\n \
  \   // 省 ...\n  });\n  socket.on('end', () => {\n    // 这也完成了当前的读取。\n    conn.ended\
  \ = true;\n    if (conn.reader) {\n      conn.reader.resolve(Buffer.from(''));\n\
  \      conn.reader = null;\n    }\n  });\n  socket.on('error', (err: Error) => {\n\
  \    // 错误也会传递给当前读取。\n    conn.err = err;\n    if (conn.reader) {\n      conn.reader.reject(err);\n\
  \      conn.reader = null;\n    }\n  });\n  return conn;\n}\n\n// 在 soRead 之前发生的事件会被存储并检查。\n\
  // 在 EOF 后返回一个空 Buffer。\nfunction soRead(conn: TCPConn): Promise<Buffer> {\n  console.assert(!conn.reader);\n\
  \  return new Promise((resolve, reject) => {\n    // 如果连接不可读，现在完成 promise。\n   \
  \ if (conn.err) {\n      reject(conn.err);\n      return;\n    }\n    if (conn.ended)\
  \ {\n      resolve(Buffer.from(''));\n      return;\n    }\n    // 保存 promise 回调\n\
  \    conn.reader = {resolve: resolve, reject: reject};\n    // 恢复 'data' 事件以便稍后完成\
  \ promise。\n    conn.socket.resume();\n  });\n}\n```\n\n### 步骤 4：写入 Socket\n\n`socket.write`\
  \ 方法接受一个回调函数来通知写入完成，因此转换为 promise 是轻而易举的。\n\n```typescript\nfunction soWrite(conn:\
  \ TCPConn, data: Buffer): Promise<void> {\n  console.assert(data.length > 0);\n\
  \  return new Promise((resolve, reject) => {\n    if (conn.err) {\n      reject(conn.err);\n\
  \      return;\n    }\n    conn.socket.write(data, (err?: Error) => {\n      if\
  \ (err) {\n        reject(err);\n      } else {\n        resolve();\n      }\n \
  \   });\n  });\n}\n```\n\nNode.js 文档中还有一个 `'drain'` 事件可以用于此任务。Node.js 库通常会提供多种方法来实现相同的功能，你只需要选择其中一种并忽略其他的即可。\n\
  \n### 4.3 使用 async 和 await\n\n让我们回到回声服务器的实现。为了在基于 promise 的 API 上使用 `await`，新连接的处理程序（`newConn`）变成了一个\
  \ `async` 函数。\n\n```typescript\nasync function newConn(socket: net.Socket): Promise<void>\
  \ {\n  console.log('new connection', socket.remoteAddress, socket.remotePort);\n\
  \  try {\n    await serveClient(socket);\n  } catch (exc) {\n    console.error('exception:',\
  \ exc);\n  } finally {\n    socket.destroy();\n  }\n}\n```\n\n我们还将代码封装在 `try-catch`\
  \ 块中，因为当 promise 被拒绝时`await` 语句会抛出异常。尽管在生产代码中你可能希望实际处理错误而不是使用通用的异常处理器。\n\n```typescript\n\
  // 回声服务器\nasync function serveClient(socket: net.Socket): Promise<void> {\n  const\
  \ conn: TCPConn = soInit(socket);\n  while (true) {\n    const data = await soRead(conn);\n\
  \    if (data.length === 0) {\n      console.log('end connection');\n      break;\n\
  \    }\n    console.log('data', data);\n    await soWrite(conn, data);\n  }\n}\n\
  ```\n\n现在使用 socket 的代码变得直观了。没有回调来中断业务逻辑。\n\n注意 `newConn` `async` 函数没有在任何地方被 `await`。它只是被作为监听\
  \ socket 回调调用的。这意味着多个连接是并发处理的。\n\n读者的练习：将“接受”原语转换为基于 promise 的。\n\n```typescript\n\
  type TCPListener = {\n  socket: net.Socket;\n  // ...\n};\n\nfunction soListen(...):\
  \ TCPListener;\n\nfunction soAccept(listener: TCPListner): Promise<TCPConn>;\n```\n\
  \n## 4.5 讨论：背压\n\n**等待 Socket 写入完成？**\n\n我们新的回声服务器有一个很大的不同——我们现在等待 `socket.write()`\
  \ 完成。\n\n但“写入完成”意味着什么？为什么我们必须等待它完成？这个问题实际上比网络编程本身更深层。\n\n**生产者受消费者限制**\n\n\n\n\n\
  \n只要有异步通信，就有连接生产者和消费者的队列或缓冲区。在物理世界中，队列和缓冲区的大小是有边界的，无法存储无限的数据。异步通信的一个问题是，**当生产者生产速度大于消费者速度时会发生什么**？必须有一种机制来防止队列或缓冲区溢出。这种机制在网络应用中通常被称为\
  \ `backpressure`（背压）。\n\n## TCP 中的背压：流量控制\n\nTCP 中的背压被称为 `flow control`（流量控制）。\n\
  \n- 消费者 TCP 栈将接收到的数据存储在接收缓冲区中，供应用程序消费。\n- 生产者 TCP 栈可以发送的数据量受生产者 TCP 栈知的 `window`（窗口）限制，当\
  \ `window` 满时，它将`pause`发送数据。\n- 消费者 TCP 栈管理 `window`；当应用程序从接收缓冲区中提取数据时，它会向前`move`\
  \ `window` 并通知生产者 TCP 栈`resume`（恢复）发送。\n\n流量控制的效果：`TCP` 可以暂停和恢复传输，从而使消费者的接收缓冲区保持边界。\n\
  \n```\nflow ctrl\n\nbounded!\n\n|producer| ==> |send buf| ===========> |recv buf|\
  \ ==> |consumer|\n\napp\n\nOS\n\nTCP\n\nOS\n\napp\n```\n\n`TCP` 流量控制不应与 `TCP` 拥塞控制混淆，后者也控制\
  \ `window`。\n\n## 应用与操作系统之间的背压\n\n这种良好的机制不仅需要实现在 `TCP` 中，还需要在应用程序中。\n\n让我们关注生产者。应用程序产生数据并提交给\
  \ `OS`，数据进入 `send buffer`（发送缓冲区），`TCP` 栈从 `send buffer` 消费数据并传输数据。\n\n```\nwrite()\n\
  \nmay block!\n\n|producer| ========> |send buf| =====> ...\n\napp\n\nOS\n\nTCP\n\
  ```\n\n## 04. Promises 和事件\n\n`OS` 如何防止 `send buffer` 溢出？简单，当 `buffer` 满时，应用程序无法写入更多数据。现在由应用程序负责自我节流以防止过度生产，因为数据必须去某个地方，但内存是有限的。\n\
  \n如果应用程序正在执行阻塞 IO，当 `send buffer` 满时调用将会阻塞，因此背压变得轻而易举。然而，在 `JS` 中使用事件循环进行编码时，情况并非如此。\n\
  \n### 无界队列是陷阱（Footguns）\n\n我们现在可以回答这个问题了：为什么要等待写入完成？因为当应用程序等待时，它无法产生数据！即使运行时由于 `send\
  \ buffer` 满而无法向 `OS` 提交更多数据，`socket.write()` 也会总是成功，但数据必须去往某个地方，它进入了运行时中的一个无界内部队列，这是一个导致可能导致无限内存占用的陷阱。\n\
  \n```\nwrite()\n\nunbounded!\n\nevent loop\n\n|producer| ======> |internal queue|\
  \ =========> |send buf| =====> ...\n\napp\n\nNode.js\n\nOS\n\nTCP\n```\n\n以我们旧的\
  \ echo 服务器为例，服务器既是生产者也是消费者，客户端也是如此。如果客户端产生数据的速度比它消费回显数据的速度快（或者客户端完全不消费任何数据），如果服务器不等待写入完成，服务器的内存将无限增长。\n\
  \n在任何连接生产者和消费者的系统中，都应该存在背压。一个经验法则是寻找软件系统中的无界队列，因为它们是缺乏背压的信号。\n\n## 4.6 讨论：事件和有序执行\n\
  \n与旧版本的另一个不同点是使用了 `socket.pause()`。你现在可以理解为什么这至关重要，因为它被用于实现背压。\n\n暂停 `'data'` 事件还有另一个原因。在基于回调的代码中，当事件处理程序返回时，如果没有暂停，运行时可以触发下一个\
  \ `'data'` 事件。问题在于，**事件回调的完成并不意味着事件处理的完成**——处理可以通过随后的回调继续。而且考虑到数据是字节的有序序列，交错处理（interleaved\
  \ handling）可能会导致问题！\n\n这种情况被称为 `race condition`（竞态条件），是一类与并发相关的问题。在这种情况下，引入了意外的并发。\n\
  \n## 4.7 结论：Promise vs 回调\n\n遵循上述讨论，我们现在可以解释为什么我们切换到基于 promise 的 API，因为它们有优势。\n\n\
  - 如果你坚持使用 `promises` 和 `async/await`，很难创建上述的竞态条件，因为事情是按顺序发生的。\n- 使用基于回调的代码，不仅更难理解代码执行的顺序，也更难控制顺序。简之，回调更难读，且编写时更容易出错。\n\
  \ 使用 使用基于 `promise` 的风格时，背压是自然存在的。这类似于使用阻塞 IO 编码（这在 `Node.js` 中无法实现）。\n\n我们已经学习了\
  \ `socket` API 的基础。让我们进入下一个主题：协议。\n\n## CHAPTER 05: 简单的网络协议\n\n## 5.1 消息 Echo 服务器\n\
  \n解析 `HTTP` 是一项大量工作，所以让我们先迈出一小步。我们将实现一个更简单的协议来演示协议最重要的功能：将字节流拆分为消息。\n\n我们的协议由 `'\\\
  n'`（换行符）分隔的消息组成。服务器读取消息并使用相同的协议发送回复。\n\n- 如果客户端发送 `'quit'`，回复 `'Bye.'` 并关闭连接。\n\
  - 否则，带前缀 `'Echo: '` 回显消息。\n\n```\nclient\n\nserver\n\n\\------\n\n\\------\n\nmsg1\\\
  n\n\n==>\n\n<==\n\nEcho: msg1\\n\n\nmsg2\\n\n\n==>\n\n<==\n\nEcho: msg2\\n\n\nquit\\\
  n\n\n==>\n\n<==\n\nBye.\\n\n```\n\n## 5.2 动态缓冲区\n\n### 动态缓冲区的必要\n\n消息并不是直接来自 `socket`\
  \ 本身，我们需要将接收到的数据存储在 `buffer` 中，然后我们可以尝试从中拆分消息。\n\n`Node.JS` 中的 `Buffer` 对象是固定大小的二进制数据块。它不能通过追加数据来增长。我们可以做的是将两个\
  \ `buffers` 合并为一个 `buffer`。\n\n```\nbuf = Buffer.concat([buf, data]);\n```\n\n然而，这是一种反模式，会导致\
  \ `O(n2)` 算法复杂度。\n\n```\n// 伪代码！坏的例子！\n\nwhile (need_more_data()) {\n\n  buf = Buffer.concat([buf,\
  \ get_some_data()]);\n}\n```\n\n每当通过合并追加新数据时，旧数据都会被复制。为了分摊拷贝成本，使用了*动态数组*：\n- C++:\
  \ `std::vector` 和 `std::string`。\n- Python: `bytearray`。\n- Go: `slice`。\n\n###\
  \ 编写动态缓冲区\n\n`buffer` 必须比需要的数据大，以便利用额外容量分摊拷贝。`DynBuf` 类型存储实际的数据长度。\n\n```\n// 一个动态大小的缓冲区\n\
  \ntype DynBuf = {\n  data: Buffer,\n  length: number,\n};\n```\n\n`copy()` 方法的语法是\
  \ `src.copy(dst, dst_offset, src_offset)`。这用于追加数据。\n\n```typescript\n// append data\
  \ to DynBuf\n\nfunction bufPush(buf: DynBuf, data: Buffer): void {\n  const newLen\
  \ = buf.length + data.length;\n  if (buf.data.length < newLen) {\n    // 增长容量 ...\n\
  \  }\n  data.copy(buf.data, buf.length, 0);\n  buf.length = newLen;\n}\n```\n\n\
  `Buffer.alloc(cap)` 创建一个指定大小的新缓冲区。这用于调整缓冲区大小。新缓冲区必须*指数级*增长，以便分摊成本为 `O(1)`。我们将使用\
  \ 2 的幂序列作为缓冲区容量。\n\n```typescript\n// append data to DynBuf\n\nfunction bufPush(buf:\
  \ DynBuf, data: Buffer): void {\n  const newLen = buf.length + data.length;\n  if\
  \ (buf.data.length < newLen) {\n    // 按 2 的幂增长容量\n  }\n}\n```\n\n\n\n\n\n[报告错误\
  \ | 提问](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)\n\
  \n32\n\n2024-02-02\n\n# 05. 简单的网络协议\n\n```javascript\nlet cap = Math.max(buf.data.length,\
  \ 32);\n\nwhile (cap < newLen) {\n  cap *= 2;\n}\n\nconst grown = Buffer.alloc(cap);\n\
  buf.data.copy(grown, 0, 0);\nbuf.data = grown;\n\n} \n\ndata.copy(buf.data, buf.length,\
  \ 0);\nbuf.length = newLen;\n\n}\n```\n\n## 5.3 实现消息协议\n\n### 步骤 1：服务器循环\n\n从高层来说来说，服务器应该是一个循环。\n\
  \n1. 从传入的字节流中解析并移除一个完整的消息。\n   - 向缓冲区中追加一些数据。\n   - 如果消息不完整，则继续循环。\n2. 处理消息。\n3.\
  \ 发送响应。\n\n```javascript\nasync function serveClient(socket: net.Socket): Promise<void>\
  \ {\n  const conn: TCPConn = soInit(socket);\n  const buf: DynBuf = {data: Buffer.alloc(0),\
  \ length: 0};\n  while (true) {\n    // 尝试从缓冲区获取 1 条消息\n    const msg: null|Buffer\
  \ = cutMessage(buf);\n    if (!msg) {\n      // 需要更多数据\n      const data: Buffer\
  \ = await soRead(conn);\n      bufPush(buf, data);\n      // EOF?\n      if (data.length\
  \ === 0) {\n        // 省略 ...\n        return;\n      }\n      // 获取了部分数据，再次尝试。\n\
  \      continue;\n    }\n    // 省略。处理消息并发送响应 ...\n  } // 消息循环\n}\n```\n\nSocket\
  \ 读取与任何消息边界都无关。我们所做是将数据追加到缓冲区，直到它包含一条完整的消息。\n\n`cutMessage()` 函数判断消息是否完整。\n\n- 如果不完整，返回\
  \ `null`。\n- 否则，它移除并返回该消息。\n\n### 步骤 2：拆分消息\n\n`cutMessage()` 函数使用分隔符 `\\n` 测试消息是否完整。\n\
  \n```javascript\nfunction cutMessage(buf: DynBuf): null|Buffer {\n  // 消息通过 '\\\
  n' 分隔\n  const idx = buf.data.subarray(0, buf.length).indexOf('\\n');\n  if (idx\
  \ < 0) {\n    return null;\n    // 未完成\n  }\n  // 制作消息的副本并将剩余数据移动到头部\n  const msg\
  \ = Buffer.from(buf.data.subarray(0, idx + 1));\n  bufPop(buf, idx + 1);\n  return\
  \ msg;\n}\n```\n\n然后它会创建消息数据的副本，因为数据将从缓冲区中移除。\n\n- `buf.subarray()` 返回子数组的引用，而不进行复制。\n\
  - `Buffer.from()` 通过从源复制数据创建一个新的缓冲区。\n\n通过将剩余数据移动到头部来移除消息。\n\n```javascript\n//\
  \ 从头部移除数据\nfunction bufPop(buf: DynBuf, len: number): void {\n  buf.data.copyWithin(0,\
  \ len, buf.length);\n  buf.length -= len;\n}\n```\n\n`buf.copyWithin(dst, src_start,\
  \ src_end)` 在缓冲区内复制数据，源和目的地可以重叠，类似于 C 语言中的 `memmove()`。这种处理缓冲区的方式并不理想，稍后会详细讨论。\n\
  \n### 步骤 3：处理请求\n\n请求在服务器循环中被处理并发送响应。\n\n```javascript\nwhile (true) {\n  // 尝试从缓冲区获取\
  \ 1 条消息\n  const msg = cutMessage(buf);\n  if (!msg) {\n    // 省略 ...\n    continue;\n\
  \  }\n  // 处理消息并发送响应\n  if (msg.equals(Buffer.from('quit\\n'))) {\n    await soWrite(conn,\
  \ Buffer.from('Bye.\\n'));\n    socket.destroy();\n    return;\n  } else {\n   \
  \ const reply = Buffer.concat([Buffer.from('Echo: '), msg]);\n    await soWrite(conn,\
  \ reply);\n  }\n} // 消息循环\n```\n\n我们的消息回显服务器现在完成了。使用 `socat` 命令对其进行测试。\n\n## 5.4\
  \ 讨论：流水线请求\n\n当从缓冲区中移除消息时，我们将剩余数据移动到了头部。\n\n你可能会奇怪，为什么缓冲区中还会剩下数据，因为在请求-响应场景中，客户端会在发送更多请求之前等待响应的。这是为了支持一种优化。\n\
  \n### 通过流水线请求减少延迟\n\n考虑一个典型的现代网页，……（文本根据提供的片段继续进行技术解构）。\n\n\n\n\n\n## 5.6 结论：网络编程基础\n\
  \n到目前为止我们学到的总结：\n\n- `socket` API：`listen`、`accept`、`read`、`write` 等。\n- 事件循环及其影响。\n\
  - 回调（Callback）对比 `Promise`。使用 `async` 和 `await`。\n- 背压（Backpressure）、队列和缓冲区。\n-\
