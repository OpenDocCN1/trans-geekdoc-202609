  \n# 第 06 章\n## HTTP 语义与语法\n\nHTTP 非常具有人类可读性，这意味着你可以通过查看示例而不是规范来构建服务器。然而，这种方法会导致产生\
  \ Bug 的“玩具代码”，而且你并学不到什么东西。因此，你需要查阅规范——一系列 `RFC` 文档。\n\n## 6.1 高级结构\n\n让我们回顾一下你在介绍性章节中已经掌握的内容：\n\
  \n- 一个 HTTP 请求消息包含：\n    - 方法（Method），是一个如 `GET`、`POST` 的动词。\n    - `URI`。\n   \
  \ - 头部字段（Header fields）列表，一组键值对。\n    - 负载体（Payload body），紧跟请求头之后。特殊情况：`GET` 和 `HEAD`\
  \ 没有负载。\n- 一个 HTTP 响应包含：\n    - 状态码（Status code），主要用于指示请求是否成功。\n    - 头部字段列表。\n\
  \    - 可的负载体。\n\n这些内容从 `HTTP/1.0` 到 `HTTP/3` 大多数是相同的。\n\n```\nHTTP/1.0 200 OK\n\
  Age: 525410\nCache-Control: max-age=604800\nContent-Type: text/html; charset=UTF-8\n\
  Date: Thu, 20 Oct 2020 11:11:11 GMT\nEtag: \"1234567890+gzip+ident\"\nLast-Modified:\
  \ Thu, 20 Oct 2019 11:11:11 GMT\nVary: Accept-Encoding\nContent-Length: 1256\nConnection:\
  \ close\n\n<!doctype html>\n<!-- omitted -->\n```\n\n## 6.2 Content-Length\n\nHTTP\
  \ 语义大多关于头部字段的解释，这在 [RFC](https://www.rfc-editor.org/rfc/rfc9110.html) [9110](https://www.rfc-editor.org/rfc/rfc9110.html)\
  \ 中描述。尝试自己读读它。\n\n最重要的头部字段是 `Content-Length` 和 `Transfer-Encoding`，因为它们决定了 HTTP\
  \ 消息的长度，这是协议最重要的功能。\n\n### HTTP 头部长度\n\n请求和响应都包含两个部分：头部（header） + 实体（body）。它们由一个空行分隔。行以\
  \ `\\r\\n` 结束。因此，头部包括空行结束于 `\\r\\n\\r\\n`。这就是我们确定头部长度的方法。\n\n### HTTP 实体长度\n\n体的长度很复杂，因为有\
  \ 3 种方法确定它。第一种方法是使用 `Content-Length`，它包含了体的长度。\n\n一些古旧的 `HTTP/1.0` 软件不使用 `Content-Length`，因此体就是连接剩余的数据，解析器读取\
  \ `socket` 直到 `EOF`，这就是体。这是确定体长度的第二种方法。这种方法有问题，因为你无法判断连接是否提前结束。\n\n## 6.3 分块传输编码\
  \ (Chunked Transfer Encoding)\n\n### 动态生成并发送数据\n\n第三种方法是使用 `Transfer-Encoding: chunked`\
  \ 代替 `Content-Length`。这被称为*分块传输编码*。它允许服务器在生成响应时发送负载，而无需提前知道大小。这种用例被称为 *流式传输（streaming）*。\n\
  \n### 协议的另一层\n\n分块编码是如何工作的？作为接收方，我们不知道总负载长度，但我们知道负载的部分。特殊的块标记了结束。这里有一个具体的例子：\n\n\
  ```\n4\\r\\nHTTP\\r\\n\n5\\r\\n0\\r\\n\n```\n\n它被解析为 3 块：\n- `4\\r\\nHTTP\\r\\n`\n\
  - `5\\r\\n`\n- `0\\r\\n`\n\n## 6.4 歧义\n\n### 理想情况\n\n总结来说，`HTTP` 允许：\n1. 存在 `Transfer-Encoding:\
  \ chunked`。\n2. `Content-Length: number`有效。\n3. 如果两者都不存在，使用连接剩余部分。\n\n### 糟糕情况\n\
  \n读者的练习：如果你正在设计一种新协议，如何避免这种情况？\n\n## 6.5 HTTP 消息格式\n\n[RFC 9112](https://www.rfc-editor.org/rfc/rfc9112.html)\
  \ 描述了比特如何在网络上传输。\n\n### 阅读 BNF 语言\n\nHTTP 消息格式用名为 *BNF* 的语言描述。前往 RFC 9112 的“2. Message”章节，你会看到这样的内容：\n\
  \n```\nHTTP-message\n= start-line CRLF\n*( field-line CRLF )\nCRLF\n[ message-body\
  \ ]\n\nstart-line\n= request-line / status-line\n```\n\n这表示：HTTP 消息可以是请求消息或响应消息。消息以请求行或状态行开始，随后是多个头部字段，然后是空行，最后是可选的负载体。行与\
  \ `CRLF` 分隔，`CRLF` 是 ASCII 字符串 `\\r\\n`。BNF 语言比英语更简洁且歧歧义。\n\n### 头部字段\n\n```\nfield-line\n\
  = field-name \":\" OWS field-value OWS\n```\n\n头部字段名和值由冒号分隔，但字段名和值的规则定义在 RFC 9110\
  \ 中。\n\n```\nfield-name\n= token\n\ntoken\n= 1*tchar\n\ntchar\n= \"!\" / \"#\" /\
  \ \"$\" / \"%\" / \"&\" / \"'\" / \"*\"\n/ \"+\" / \"-\" / \".\" / \"^\" / \"_\"\
  \ / \"`\" / \"|\" / \"~\"\n/ DIGIT / ALPHA\n```\n\n```\nOWS\n= *( SP / HTAB )\n\
  ```\n\n```\nfield-value\n= *field-content\n\nfield-content\n= field-vchar\n[ 1*(\
  \ SP / HTAB / field-vchar ) field-vchar ]\n```\n\n\n\n\n\n`field-vchar`\n\n= `VCHAR`\
  \ / `obs-text`\n\n`obs-text`= `%x80-FF`\n\n这是字段名和值的通用规则。`SP`、`HTAB` 和 `VCHAR` 分别指空格、制表符和打印\
  \ ASCII 字符。某些字符禁止在头部字段中使用，特别是 `CR` 和 `LF`。\n\n[4](https://www.rfc-editor.org/rfc/rfc9112.html)\n\
  \n[报告错误 | 提问](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)\n\
  \n42\n2024-02-02\n\n# 06. HTTP 语义与语法\n\n某些头部字段有额外的解释规则，例如逗号分隔的值或引用字符串。目前，我们只需要让它们保持原样，直到我们需要用到它们为止。\n\
  \nHTTP 规范非常庞，本章只涵盖了实现 HTTP 服务器最重要的部分，我们将在下一章中进行。\n\n## 6.6 常见头部字段\n\n许多头部字段要么被应用程序解释，要么被可选的\
  \ HTTP 特性使用，与我们的实现没有直接关系。你可以通过浏览器开发者工具中检查 HTTP 头部来熟悉它们。\n\n表 1：常见头部字段。（C 代表客户端，S\
  \ 代表服务器。）\n\n| 头部字段 | 由谁提供 |  |\n| :--- | :--- | :--- |\n| `Content-Length: 60`\
  \ | C/S | 已讨论。 |\n| `Transfer-Encoding: chunked` | C/S | 已讨论。 |\n| `Accept: text/html`\
  \ | C | 用于协商内容类型。 |\n| `Content-Type: text/html` | S | 内容类型。 |\n| `Accept-Encoding:\
  \ gzip` | C | 用于协商内容压缩。 |\n| `Content-Encoding: gzip` | S | 压缩后的响应。 |\n| `Vary:\
  \ content-encoding` | S | 通知代理服务器内容协商。 |\n| `Authorization: Basic dTpw` | C | 通过用户名和密码进行认证。\
  \ |\n| `Cache-Control: no-cache` | C/S | 影响缓存行为。 |\n| `Age: 60` | S | 项目被代理缓存了多久？\
