  trans: "\n轮询的实现可以不那么简单：服务器可以保持连接，仅在有新更新时才发送响应。如果我们进一步考虑，分块编码（chunked encoding）允许在单个响应中包含无限次更新。这被称为长轮询（long\
    \ polling）。\n\n例如，服务器可以生成由换行符分隔的 JSON 消息流，并通过分块编码交付。客户端只需发送单个请求，客户端就可以读取这些消息，而不会引入轮询带来的额外延迟。\n\
    \n```\nclient\nserver\n------\n------\n|header| ==>\n<== |header|\n...\n<== |JSON\\\
    n|\n<== |JSON\\n|\n<== |JSON\\n|\n...\n```\n\n然而，这种用例已经被 `WebSocket` 淘汰了——这是一种\
    \ HTTP 协议的扩展。\n\n### WebSocket 是基于消息的\n\n`WebSocket` 的设计背后有多个动机。其中之一是面向消息（`message-oriented`）的设计，而不是字节流。`每行一个\
    \ JSON` 的例子听起来足够简单，但你仍然需要将字节流拆分成行。编写网络应用代码时的首大错误就是没有理解字节流。`WebSocket` 自带了内置帧格式，输出的是消息而不是字节，这让程序员避免了重复低级错误。\n\
    \n### WebSocket 不是请求-响应\n\n`WebSocket` 的另一个贡献是双向和**全双工**（`full-duplex`）通信，这意味着客户端和服务器可以同时互相发送消息。技术上，你可以通过两个\
    \ HTTP 连接（一个用于推送，一个用于拉取）[模拟双向消息[3]](https://en.wikipedia.org/wiki/BOSH_(protocol\\\
    )) 而不使用 `WebSocket`。但 `WebSocket` 可以让客户端和服务器的操作都变得更简单。\n\n### 08. 动态内容与流\n\n```\n\
    client\nserver\n------\n------\n|header| ==>\n<== |header|\n... ...\n|message|\
    \ ==>\n|message| ==> <== |message|\n|message| ==>\n<== |message|\n|message| ==>\n\
    ... ...\n```\n\n我们将在稍后的章节中实现 `WebSocket`，在此之前，我们已经先探索 HTTP 的其他重要用途。\n\n# 第 09\
    \ 章：文件 IO 与资源管理\n\n提供静态文件是 HTTP 设计的用途之一。还有几个主题需要探索：\n\n1. `范围请求`（Ranged requests）。获取文件的部分内容。这允许传输被中断并在稍后恢复。\n\
    2. `缓存`（Caching）。减少不必要的传输。\n3. `压缩`（Compression）。减少传输时间和开销。\n\n我们将从实现一个基础文件服务器开始，这将使我们熟悉\
    \ `File API`。\n\n## 9.1 Node.JS 中的文件 IO\n\n如前所述，`Node.JS` 中的 `file API` 有 3 种类：\n\
    \n- 同步 API，我们无法使用。\n- 基于回调的 API，我们不想使用。\n- 基于 promise 的（`promise-based`）API，我们将使用它。\n\
    \n```typescript\nimport * as fs from \"fs/promises\";\n```\n\n我们将使用 4 种文件操作：\n\
    \n1. 打开文件。\n2. `stat` 文件以获取如大小之类的元数据。\n3. 读取文件数据。\n4. 关闭文件。\n\n像套字一样，磁盘文件由封装在\
    \ JS 对象中的不透明句柄（handles）表示。这里是我们使用的简化 TypeScript API 定义。\n\n```typescript\nfunction\
    \ open(path: string, flags?: string): Promise<FileHandle>;\ninterface FileReadResult\
    \ {\n  bytesRead: number;\n  buffer: Buffer;\n}\n\ninterface FileReadOptions {\n\
    \  buffer?: Buffer;\n  offset?: number | null;\n  length?: number | null;\n  position?:\
    \ number | null;\n}\n\ninterface Stats {\n  isFile(): boolean;\n  isDirectory():\
    \ boolean;\n  // ...\n  size: number;\n  // ...\n}\n\ninterface FileHandle {\n\
    \  read(options?: FileReadOptions): Promise<FileReadResult>;\n  close(): Promise<void>;\n\
    \  stat(): Promise<Stats>;\n}\n```\n\n## 9.2 提供磁盘文件\n\n### 步骤 0：为静态文件添加处理器\n\n\
    我们的第一步是编写提供磁盘文件的代码。我们将添加一个处理器来从当前工作目录提供文件。\n\n```javascript\nconst uri = req.uri.toString('utf8');\n\
    \nif (uri.startsWith('/files/')) {\n  // 从当前工作目录提供文件\n  // FIXME: 防止通过 `..` 逃逸\n\
    \  return await serveStaticFile(uri.substr('/files/'.length));\n}\n```\n\n对于生产级\
    \ Web 服务器，还需要额外的工作来确保 URI 路径确实位于目标目录内（URI 规范化），并且文件是可访问的。我们将跳过这些工作。\n\n### 步骤\
    \ 1：打开并关闭文件\n\n`r` 标志用于以只读模式打开文件。如果文件不存在或无法访问，`fs.open()` 将抛出异常。\n\n```javascript\n\
    async function serveStaticFile(path: string): Promise<HTTPRes> {\n  let fp: null|FileHandle\
    \ = null;\n  try {\n    // 打开文件\n    fp = await fs.open(path, 'r');\n  } catch\
    \ (exc) {\n    // 无法打开文件\n    console.info('error serving file:', exc);\n    return\
    \ resp404();\n  } finally {\n    // 确保文件被关闭\n    await fp?.close();\n  }\n}\n\
    ```\n\n### 步骤 2：stat() 文件\n\n`stat()` 方法用于从文件中检索元数据。它包含了文件类型（普通文件、目录）、大小和其他信息。\n\
    \n```javascript\n// 打开文件\nfp = await fs.open(path, 'r');\n// 获取大小\nconst stat\
    \ = await fp.stat();\nif (!stat.isFile()) {\n  return resp404();\n}\nconst size\
    \ = stat.size;\n```\n\n还有一个 `fs.stat(path)` 函数，它接受路径而不是句柄。它可以在不打开文件的情况下进行 stat。然而，在句柄上使用\
    \ `stat` 更好。因为路径可能会指向不同的文件，这属于`竞态条件`[1](https://en.wikipedia.org/wiki/Time-of-check_to_time-use)。先打开文件可以确保你操作的是同一个文件。\n\
    \n### 步骤 3：构建 BodyReader\n\n`readerStaticFile()` 函数从文件句柄返回一个 `BodyReader`。在我们之前将\
    \ `fp` 设置为 `null` 是重要的，因为 `BodyReader` 稍后会读取文件，`finally` 块在此之后无法再关闭文件。\n\n```javascript\n\
    async function serveStaticFile(path: string): Promise<HTTPRes> {\n  let fp: null|FileHandle\
    \ = null;\n  try {\n    // 打开文件\n    fp = await fs.open(path, 'r');\n    // ...\n\
    \    // body 读取器\n    const reader: BodyReader = readerStaticFile(fp, size);\n\
    \    fp = null;\n    // 现在由读取器负责关闭它\n    return {code: 200, headers: [], body:\
    \ reader};\n  } catch (exc) {\n    // ...\n  } finally {\n    // 确保文件被关闭\n   \
    \ await fp?.close();\n  }\n}\n```\n"
