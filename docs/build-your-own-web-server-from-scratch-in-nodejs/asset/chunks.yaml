    because they are more flexible than necessary. Consider the way HTTP payload length
    is determined:


    • The common cases are Content-Length and Transfer-Encoding.


    • There are special cases for some HTTP methods and status codes.


    • There are cases that cause different interpretations, e.g., request smuggling.


    HTTP is a simple protocol, where simple means it’s easy to look at. Writing code
    for it is not simple because there are too many rules for interpreting it, and
    the rules still leave you with ambiguities.


