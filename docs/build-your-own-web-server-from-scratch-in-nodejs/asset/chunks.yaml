    \ by waiting for the queue or buffer to drain. From the producer and consumer\
    \ point view, a queue has 2 states:\n\nQueue Can produce Can consume\nEmpty Yes\
    \ No\nNot Empty No Yes\n\nThis limits a queue to a maximum of 1 item or 1 pending\
    \ write.\n\n##### Backpressure by High Water Mark\n\nHowever, some backpressure\
    \ implementations are slightly more sophisticated — the queue is limited by the\
    \ number of bytes instead of just 1 write. This limit is often called a high water\
    \ mark. The queue has 3 states when using a high water mark for backpressure:\n\
    \nQueue Can produce Can consume\nEmpty Yes No\nHalf Yes Yes\nFull No Yes\n\nThis\
    \ is more like Unix pipes, a Unix pipe is a bounded buffer, as long as it’s not\
    \ full you can add more bytes to it;; you do not have to wait until it’s completely\
    \ drained.\n\n##### Batching Data with Queues\n\nThe reason for using the high\
    \ water mark instead of the one-item queue is that the queue can combine multiple\
    \ small writes. For example, here are some possible optimizations when moving\
    \ data from a queue to a socket:\n\n[Report an Error | Ask a Question](https://forms.gle/UKo4bncUnuMGBrTM7)\
    \ @ [build-your-own.org](https://build-your-own.org)\n\n107\n2024-02-02\n\n12.\
    \ Compression & the Stream API\n\n• The queue could be a single buffer; whenever\
    \ you write to it, the data is appended to the buffer. This automatically combines\
    \ multiple small writes, and all the data is sent to the socket in one go.\n\n\
    • The queue stores individual buffer objects, multiple buffers can be combined\
    \ into a single larger buffer before being sent to the socket.\n\n• The queue\
    \ stores individual buffer objects, the `writev()[6]](https://linux.die.net/man/2/writev)\
    \ syscall can be used to send multiple buffers in one go without manually combining\
    \ them.\n"
  trans: "\n\n### 3. 使用 `destroy()` 方法将错误传递给消费者。\n\n```javascript\nfunction body2stream(reader:\
    \ BodyReader): stream.Readable {\n  let self: null|stream.Readable = null;\n \
    \ // make TS happy\n  self = new stream.Readable({\n    read: async () => {\n\
    \      try {\n        const data: Buffer = await reader.read();\n        self!.push(data.length\
    \ > 0 ? data : null);\n      } catch (err) {\n        self!.destroy(err instanceof\
    \ Error ? err : new Error('IO'));\n      }\n    },\n  });\n  return self;\n}\n\
    ```\n\n[报告错误 | 提问](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)\n\
    \n103\n2024-02-02\n\n## 12. 压缩与 Stream API\n\n注意：`push()` 方法使用 `null` 来标记流的结束，这与我们正在使用的（0\
    \ 长度缓冲区）不同。\n\n#### 步骤 4：创建管道（Pipe）\n\n让我们尝试在 `BodyReader` 和 `compressor` 之间建立一个管道。\n\
    \n```javascript\nfunction gzipFilter(reader: BodyReader): BodyReader {\n  const\
    \ gz: stream.Duplex = zlib.createGzip();\n  const input: stream.Readable = body2stream(reader);\n\
    \  (async () => {\n    try { await pipeline(input, gz); }\n    catch (err) { gz.destroy(err);\
    \ }\n  })();\n  // not awaiting it\n  // return the wrapped `BodyReader` ...\n\
    }\n```\n\n`pipeline()` 函数将为我们移动数据，并返回一个 promise 供我们等待。\n\n我们还必须在等待 promise 时捕获任何异常，并且捕获的错误必须传递给下一个流，否则它的消费者将永远挂起。\n\
    \n在 `gzipFilter()` 函数中，我们无法等待管道完成，因为我们必须向调用者返回一个封装过的 `BodyReader`，因此 `try-catch`\
    \ 块被封装在一个没有 `await` 的匿名异步函数调用中。这可以通过向 promise 注册一个错误处理回调来简化。\n\n`pipeline(input,\
    \ gz).catch((err: Error) => gz.destroy(err));` // no await\n\n#### 步骤 5：从 `stream.Readable`\
    \ 读取\n\n现在管道已经在运行了，我们可以从 `compressor` 读取输出。记得 `net.Socket` 也是一个 `stream.Readable`；`soRead()`\
    \ 函数可以在不修改的情况下使用（除了类型注解），因为各种套接字事件（如 `'data'` 和 `'end'`）、`pause()` 和 `resume()`\
    \ 方法实际上定义在 `stream.Readable` 上。\n\n但 `stream.Readable` 接口已经有一个基于 promise 的读取方法。它的\
    \ `iterator()` 方法返回一个 `AsyncIterator`，你可以像使用生成器一样在 `for await...of` 循环中使用它。`AsyncIterator`\
    \ 还有一个类似于生成器的 `next()` 方法。\n\n[报告错误 | 提问](https://forms.gle/UKo4bncUnuMGBrTM7)\
    \ @ [build-your-own.org](https://build-your-own.org)\n\n104\n2024-02-02\n\n12.\
    \ 压缩与 Stream API\n\n```javascript\nfunction gzipFilter(reader: BodyReader): BodyReader\
    \ {\n  // ...\n  const iter: AsyncIterator<Buffer> = gz.iterator();\n  return\
    \ {\n    length: -1, // 压缩后的 \"Content-Length\" 未知\n    read: async (): Promise<Buffer>\
    \ => {\n      const r: IteratorResult<Buffer, void> = await iter.next();\n   \
    \   return r.done ? Buffer.from('') : r.value;\n    },\n    close: reader.close,\n\
    \  };\n}\n```\n\n返回的 `BodyReader` 包装器从 `compressor` 读取。如果为了学习，可以跳过 `soRead()`\
    \ 函数。\n\n#### 步骤 6：测试\n\n我们快完成了，让我们为所有响应启用压缩并测试。\n\n```javascript\nconst res:\
    \ HTTPRes = await handleReq(msg, reqBody);\ntry {\n  enableCompression(msg, res);\n\
    \  await writeHTTPHeader(conn, res);\n  if (msg.method !== 'HEAD') {\n    // omit\
    \ the body\n    await writeHTTPBody(conn, res.body);\n  }\n} // ...\n```\n\n`curl`\
    \ 可以请求压缩后的响应：\n\n`curl -vvv http://127.0.0.1:1234/`\n\n#### 步骤 7：刷新缓冲区\n\n压缩可以工作。但有一个问题：当你测试\
    \ `/echo` 或 `/sheep` URI 时，响应没有立即出现。这是由于 `compressor` 的缓冲导致的。从“缓冲区写入”讨论中，我们知道必须有一种方法来\
    \ `flush` 缓冲区强制 `compressor` 输出。\n\n[报告错误 | 提问](https://forms.gle/UKo4bncUnuMGBrTM7)\
    \ @ [build-your-own.org](https://build-your-own.org)\n\n105\n2024-02-02\n\n12.\
    \ 压缩与 Stream API\n\n`gz.flush(callback);`\n\n但由于使用了 `pipeline()` 而不是显式的 `IO`，没有地方插入\
    \ `flush()` 调用。不过有一个选项可以让 `compressor` 自动刷新。\n\n`const gz = zlib.createGzip({flush:\
    \ zlib.constants.SYNC_FLUSH`\n\n频繁刷新 `compressor` 会降低压缩效率。因此，让应用程序控制是否刷新是一个好主意。例如，在提供静态文件时，不需要刷新\
    \ `compressor`，因为数据生成得尽可能快。\n\n对于生成非常小数据块的应用程序，可能根本不压缩压缩，因为频繁刷新效果不好。\n\n#### 12.5\
    \ 讨论：重构为 Stream\n\n你可以尝试重构代码以使用更多的流和管道。首先，替换 `BodyReader` 接口中的 `read()` 函数。\n\n\
    ```typescript\n// 从/向 HTTP body 读取/写入数据的接口\ntype BodyReader = {\n  // \"Content-Length\"\
    , 如果未知则为 -1。\n  length: number,\n  // 读取数据。\n  reader: stream.Readable,\n};\n\
    ```\n\n通过更多的流和管道可以节省大量代码：\n\n1. 不需要 `soRead()` 函数的实现。\n2. 读取磁盘代码可以用 `fp.createReadStream()`\
    \ 替换。\n3. `writeHTTPBody()` 函数只需在响应和套接字之间创建一个管道。\n4. 由于我们不再处理显式的读写，分块编码器可以用实现\
    \ `stream.Transform` 来替换。\n5. 生成器可以通过 `stream.Readable.from()` 转换为 `stream.Readable`。\n\
    \n[报告错误 | 提问](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)\n\
    \n106\n2024-02-02\n\n12. 压缩与 Stream API\n\n响应请求的整个过程变成一系列管道：`produce-response\
    \ | gzip-compress | chunk-encode | write-to-socket`\n\n#### 12.6 讨论：水位（High Water\
    \ Mark）与背压\n\n##### 单项队列\n\n我们维护背压的方法是等待队列或缓冲区排空。从生产者和消费者的角度，队列有 2 个状态：\n\n| 队列\
    \ | 可以产生 | 可以消费 |\n|---|---|---|\n| 空闲 | 是 | 否 |\n\n这限制了队列最多只能有 1 个项目或 1 次待处理写入。\n\
    \n##### 高水位背压\n\n然而，某些背压实现稍微复杂一些——队列限制字节数而不是仅仅 1 次写入。这个限制通常被称为水位。使用水位进行背压时，队列有\
    \ 3 个状态：\n\n| 队列 | 可以产生 | 可以消费 |\n|---|---|---|\n| 空 | 是 | 否 |\n| 半 | 是 | 是 |\n\
    | 满 | 否 | 是 |\n\n这更像 Unix 管道，Unix 管道是一个边界缓冲区，只要它未满就可以向其中添加更多字节；不需要等待它完全排空。\n\n\
    ##### 使用队列批处理数据\n\n使用水位而不是单项队列的原因是队列可以合并多次小写入。例如，当数据从队列移动到套接字时，有一些可能的优化：\n\n[报告错误\
    \ | 提问](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)\n\
    \n107\n2024-02-02\n\n12. 压缩与 Stream API\n\n• 队列可以是单个缓冲区；每当你向它写入时，数据都会追加到缓冲区。这会自动合并多次小写入，并将所有数据一次性发送到套接字。\n\
    \n• 队列存储单个缓冲区对象，在发送到套接字之前，可以将多个缓冲区合并为一个较大的缓冲区。\n\n• 队列存储单个缓冲区对象，可以使用 `writev()[6]](https://linux.die.net/man/2/writev)\
    \ 系统调用一次性发送多个缓冲区，而无需手动合并。\n\n"
