    This will amortize the cost of the buffer allocations.


    **Pooled Buffers**


    Instead of allocating buffers locally, you can have a global pool of *used* buffers.
    Whenever you are done with a buffer, you put it into that pool. And when you need
    a buffer, you try to grab one from the pool first, and only create a new one if
    the pool is empty.


    The advantages of this are:


    • Grabbing stuff from the pool can cost even less than the memory allocator.


    • Different code paths all benefit from the pool. There are fewer real allocations
    overall.


    An object pool is trivial to code. The Node.JS Buffer type uses a [built-in pool\[5\]](https://nodejs.org/api/buffer.html#static-method-bufferallocunsafeslowsize)[,](#index_split_001.html#p87)
    but only for *small* buffers. The Go standard library also includes an [object
