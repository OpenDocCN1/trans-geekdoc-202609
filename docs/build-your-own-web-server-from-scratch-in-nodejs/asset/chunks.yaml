    • The queue could be a single buffer; whenever you write to it, the data is appended
    to the buffer. This automatically combines multiple small writes, and all the
    data is sent to the socket in one go.


    • The queue stores individual buffer objects, multiple buffers can be combined
    into a single larger buffer before being sent to the socket.


    • The queue stores individual buffer objects, the [writev()\[6\]](https://linux.die.net/man/2/writev)
    syscall can be used to send multiple buffers in one go without manually combining
