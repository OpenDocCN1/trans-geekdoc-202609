    \n17\n2024-02-02\n\n## 03. 代码一个 TCP 服务器\n\n### 3.7 讨论：基于 Promise 的 IO\n\n正如我们之前提到的，还有另一种编写\
    \ IO 代码的风格。另一种风格使用 Promise 代替回调。基于 Promise 的 API 的优势是你可以对它们进行 `await` 并获取结果，从而避免将你的程序拆散成散落在各处的微小回调。\n\
    \n一个假设的基于 Promise 的 `accept` 原语 API 如下：\n\n```javascript\n// 伪代码!\nwhile (running)\
    \ {\n  let socket = await server.accept();\n  newConn(socket);\n  // 此处不要 await\n\
    }\n```\n\n而假设的 `read` 和 `write` 原语的 API 如下：\n\n```javascript\n// 伪代码!\nasync function\
    \ newConn(socket) {\n  while (true) {\n    let data = await socket.read();\n \
    \   if (!data) {\n      break;\n      // EOF\n    }\n    await socket.write(data);\n\
    \  }\n}\n```\n\n上面的伪代码看起来是同步的，但并没有阻塞事件循环。虽然在这一点上优势可能并不明显，因为我们的程序非常简单。\n\n一些 Node.js\
    \ API（但不是所有）同时可以在基于回调和基于 Promise 的风格中使用。然而，通过努力，基于回调的 API 可以转换为基于 Promise 的 API，正如我们将在下一节中看到的。\n\
    \n[报告错误 | 提问](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)\n\
    \n18\n\n## 第 04 章\n## Promise 与事件\n\n在本章中，我们将再次实现回显服务器，但将使用基于 Promise 的风格，这是本书其余部分的基础。这一决定将在后文解释。\n\
    \n### 4.1 async 和 await 简介\n\n让我们快速浏览 JS 中的 async/await 和 `Promise` 类型，以防你尚不熟悉它们。\n\
    \n#### 使用回调\n\n一个基于回调的 API 示例。应用逻辑在回调函数中继续。\n\n```javascript\nfunction my_app()\
    \ {\n  do_something_cb((err, result) => {\n    if (err) {\n      // 失败。\n    }\
    \ else {\n      // 成功，使用结果。\n    }\n  });\n}\n```\n\n#### 使用 Promises 和 await\n\
    \n在 promise 上使用 `await` 的示例。应用逻辑在同一个 async 函数中继续。\n\n```javascript\nfunction do_something_prmoise():\
    \ Promise<T>;\nasync function my_app() {\n  try {\n    const result: T = await\
    \ do_something_prmoise();\n  } catch (err) {\n    // 失败。\n  }\n}\n```\n\n优势：应用逻辑没有被拆分成多个函数。\n\
    \n#### 创建 Promise\n\n创建一个 promise 的示例：将基于回调的 API 转换为基于 Promise 的 API。\n\n```javascript\n\
    function do_something_prmoise() {\n  return new Promise<T>((resolve, reject) =>\
    \ {\n    do_something_cb((err, result) => {\n      if (err) {\n        reject(err);\n\
    \      } else {\n        resolve(result);\n      }\n    });\n  });\n}\n```\n\n\
    回调在 JS 中是不可避免的。在创建 promise 对象时，会将一个 `executor` 回调作为参数传递，以接收两个回调：\n\n- `resolve()`导致\
    \ `await` 语句返回一个值。\n- `reject()`导致 `await` 语句抛出一个异常。\n\n当结果可用或操作失败时，你必须调用其中一个。这可能发生在执行器函数之外，因此你可能需要存储这些结果。\n\
    \nPromise 的术语：\n\n- **Fulfilled**（已完成）：调用了 `resolve()`\n- **Rejected**（已拒绝）：调用了\
    \ `reject()`\n- **Settled**（已就决）：已完成或已拒绝。\n- **Pending**（进行中）：未就决。\n\n19\n2024-02-02\n\
    \n## 04. Promise 与事件\n\n### 4.2 理解 async 和 await\n\n#### 普通函数通过 return 返回\n\n\
    有两种 JS 函数：普通函数和 async 函数。普通函数从开始到返回（显式或隐式）。由于 JS 运行时是单线程的，你无法进行阻塞，相反你注册回调，运行时可以轮询事件。\n\
    \n#### async 函数通过 await 返回\n\n最初，`Promise` 类型只是管理回调的方式。它允许链式多个嵌套函数。然而，由于 async\
    \ 函数的加入，我们不再需要这种 promise 使用。async 函数可以在执行中间返回运行时；这发生在对 promise 使用 `await` 语句时。\n\
    \n#### 调用 async 函数启动新任务\n\n调用 async 函数会导致一个在返回或抛出异常时决定的 promise。你可以像普通 promise\
    \ 一样等待它，但它会被运行时调度。这类似于多线程编程中启动线程。但所有的 JS 代码共享单个线程，所以更好的词是 *任务*。\n\n在不同环境中启动任务的方法：\n\
    \n- 在 JS 中，通过不等待 promise 启动任务。\n- 在 Go 中，使用 `go` 语句。\n- 在 Python 中，async/await\
    \ 与 JS 类似，但你需要自己运行事件循环，因为它不是语言内置的。\n- 在没有事件循环的环境中，你可以启动操作系统线程而不是用户级任务。\n\n###\
    \ 4.3 从事件到 Promise\n\n`net` 模块未提供基于 Promise 的 API，因此我们需要实现上一节中的假设 API。\n\n```javascript\n\
    function soRead(conn: TCPConn): Promise<Buffer>;\nfunction soWrite(conn: TCPConn,\
    \ data: Buffer): Promise<void>;\n```\n\n[报告错误 | 提问](https://forms.gle/UKo4bncUnuMGBrTM7)\
    \ @ [build-your-own.org](https://build-your-own.org)\n\n20\n2024-02-02\n\n####\
    \ 步骤 1：分析解决方案\n\n`soRead` 函数返回一个带有 socket 数据的 promise。它依赖 3 个事件。\n\n1. 'data'\
    \ 事件完成 promise。\n2. 在读取 socket 时，我们还需要知道是否发生了 EOF。因此，'end' 事件也会完成 promise。指示 EOF\
    \ 的常用方法是返回零长度的数据。\n"
