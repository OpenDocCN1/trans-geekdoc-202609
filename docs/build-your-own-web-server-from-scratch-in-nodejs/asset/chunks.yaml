    function readerFromStaticFile(


    fp: fs.FileHandle, start: number, end: number): BodyReader;


    You can read from the desired file position using the position argument of the
    fp.read() method. File IO APIs often include a seek() method to set the read/write
    position, this is unnecessary in Node.JS because the position can be specified
    in the read() method, and the underlying OS interface is a single syscall or API
    call in popular operating systems anyway.


