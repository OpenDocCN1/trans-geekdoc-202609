    \ // 暂停 'data' 事件\nsocket.resume(); // 恢复 'data' 事件\n```\n\n有了这些知识，我们现在可以实现 `soRead`\
    \ 函数。\n\n```typescript\n// 从 net.Socket 创建包装器\nfunction soInit(socket: net.Socket):\
    \ TCPConn {\n  const conn: TCPConn = {\n    socket: socket, reader: null,\n  };\n\
    \  socket.on('data', (data: Buffer) => {\n    console.assert(conn.reader);\n \
    \   // 暂停 'data' 事件直到下次读取。\n    conn.socket.pause();\n    // 完成当前读取的 promise。\n\
    \    conn.reader!.resolve(data);\n    conn.reader = null;\n  });\n  return conn;\n\
    }\n\nfunction soRead(conn: TCPConn): Promise<Buffer> {\n  console.assert(!conn.reader);\n\
    \  // 不并发调用\n  return new Promise((resolve, reject) => {\n    // 保存 promise 回调\n\
    \    conn.reader = {resolve: resolve, reject: reject};\n    // 恢复 'data' 事件以便稍后完成\
    \ promise。\n    conn.socket.resume();\n  });\n}\n```\n\n由于 `'data'` 事件会在我们读取 socket\
    \ 之前被暂停，因此 socket 在创建后默认应该是暂停状态。有一个标记可以实现这一点。\n\n```javascript\nconst server =\
    \ net.createServer({\n  pauseOnConnect: true,\n  // TCPConn 需要\n});\n```\n\n###\
    \ 步骤 3：处理 'end' 和 'error' 事件\n\n与 `'data'` 事件不同，`'end'` 和 `'error'` 事件无法暂停，并且会在发生时立即触发。我们可以通过将它们存储在包装对象并在\
    \ `soRead` 中检查它们来处理。\n\n```typescript\n// 一个基于 promise 的 TCP 套接 API。\ntype TCPConn\
    \ = {\n  // JS socket 对象\n  socket: net.Socket;\n  // 来自 'error' 事件\n  err: null|Error;\n\
    \  // 来自 'end' 事件\n  ended: boolean;\n  // 当前读取操作 promise 的回调函数\n  reader: null|{\n\
    \    resolve: (value: Buffer) => void,\n    reject: (reason: Error) => void,\n\
    \  };\n};\n\n// 如果存在当前 reader，解析或拒绝它。\n// 从 net.Socket 创建包装器\nfunction soInit(socket:\
    \ net.Socket): TCPConn {\n  const conn: TCPConn = {\n    socket: socket, err:\
    \ null, ended: false, reader: null,\n  };\n  socket.on('data', (data: Buffer)\
    \ => {\n    // 省 ...\n  });\n  socket.on('end', () => {\n    // 这也完成了当前的读取。\n\
    \    conn.ended = true;\n    if (conn.reader) {\n      conn.reader.resolve(Buffer.from(''));\n\
    \      conn.reader = null;\n    }\n  });\n  socket.on('error', (err: Error) =>\
    \ {\n    // 错误也会传递给当前读取。\n    conn.err = err;\n    if (conn.reader) {\n      conn.reader.reject(err);\n\
    \      conn.reader = null;\n    }\n  });\n  return conn;\n}\n\n// 在 soRead 之前发生的事件会被存储并检查。\n\
    // 在 EOF 后返回一个空 Buffer。\nfunction soRead(conn: TCPConn): Promise<Buffer> {\n \
    \ console.assert(!conn.reader);\n  return new Promise((resolve, reject) => {\n\
    \    // 如果连接不可读，现在完成 promise。\n    if (conn.err) {\n      reject(conn.err);\n\
    \      return;\n    }\n    if (conn.ended) {\n      resolve(Buffer.from(''));\n\
    \      return;\n    }\n    // 保存 promise 回调\n    conn.reader = {resolve: resolve,\
    \ reject: reject};\n    // 恢复 'data' 事件以便稍后完成 promise。\n    conn.socket.resume();\n\
    \  });\n}\n```\n\n### 步骤 4：写入 Socket\n\n`socket.write` 方法接受一个回调函数来通知写入完成，因此转换为\
    \ promise 是轻而易举的。\n\n```typescript\nfunction soWrite(conn: TCPConn, data: Buffer):\
    \ Promise<void> {\n  console.assert(data.length > 0);\n  return new Promise((resolve,\
    \ reject) => {\n    if (conn.err) {\n      reject(conn.err);\n      return;\n\
    \    }\n    conn.socket.write(data, (err?: Error) => {\n      if (err) {\n   \
    \     reject(err);\n      } else {\n        resolve();\n      }\n    });\n  });\n\
    }\n```\n\nNode.js 文档中还有一个 `'drain'` 事件可以用于此任务。Node.js 库通常会提供多种方法来实现相同的功能，你只需要选择其中一种并忽略其他的即可。\n\
    \n### 4.3 使用 async 和 await\n\n让我们回到回声服务器的实现。为了在基于 promise 的 API 上使用 `await`，新连接的处理程序（`newConn`）变成了一个\
    \ `async` 函数。\n\n```typescript\nasync function newConn(socket: net.Socket): Promise<void>\
    \ {\n  console.log('new connection', socket.remoteAddress, socket.remotePort);\n\
    \  try {\n    await serveClient(socket);\n  } catch (exc) {\n    console.error('exception:',\
    \ exc);\n  } finally {\n    socket.destroy();\n  }\n}\n```\n\n我们还将代码封装在 `try-catch`\
    \ 块中，因为当 promise 被拒绝时`await` 语句会抛出异常。尽管在生产代码中你可能希望实际处理错误而不是使用通用的异常处理器。\n\n```typescript\n\
    // 回声服务器\nasync function serveClient(socket: net.Socket): Promise<void> {\n  const\
    \ conn: TCPConn = soInit(socket);\n  while (true) {\n    const data = await soRead(conn);\n\
    \    if (data.length === 0) {\n      console.log('end connection');\n      break;\n\
    \    }\n    console.log('data', data);\n    await soWrite(conn, data);\n  }\n\
    }\n```\n\n现在使用 socket 的代码变得直观了。没有回调来中断业务逻辑。\n\n注意 `newConn` `async` 函数没有在任何地方被\
    \ `await`。它只是被作为监听 socket 回调调用的。这意味着多个连接是并发处理的。\n\n读者的练习：将“接受”原语转换为基于 promise\
    \ 的。\n\n```typescript\ntype TCPListener = {\n  socket: net.Socket;\n  // ...\n\
    };\n\nfunction soListen(...): TCPListener;\n\nfunction soAccept(listener: TCPListner):\
    \ Promise<TCPConn>;\n```\n\n### 4.5 讨论：背压\n\n**等待 Socket 写入完成？**\n\n我们新的回声服务器有一个很大的不同——我们现在等待\
    \ `socket.write()` 完成。\n\n但“写入完成”意味着什么？为什么我们必须等待它完成？这个问题实际上比网络编程本身更深层。\n\n**生产者受消费者限制**\n\
    \n"
