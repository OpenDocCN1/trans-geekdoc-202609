  fmt: "\nThis will also execute the finally block. You can even use a special type\
    \ of exception to communicate to the generator that you intend to abort it midway,\
    \ so that the generator can deal with this particular case.\n\nPython generators\
    \ have [similar methods\\[3\\]](https://docs.python.org/3/reference/expressions.html#generator.close)[.](#index_split_001.html#p86)\
    \ And [surprisingly\\[4\\]](https://docs.python.org/2.5/whatsnew/pep-342.html)[,](#index_split_001.html#p86)\
    \ the Python garbage collector automatically executes the finally block for generators,\
    \ although it is debatable whether the GC should handle non-memory business.\n\
    \n# 9.4 Discussion: Reusing Buffers\n\n## Buffer Allocations Have Costs\n\nThe\
    \ `readerFromStaticFile()` function allocates and returns a new buffer for each\
    \ read. This is not very efficient because buffer allocations have costs:\n\n\
    1. The costs from the memory allocator. For many implementations, this cost is\
    \ `constant` in most cases. In the best case, the allocator either returns an\
    \ object from a free list or allocates from a large chunk.\n2. The cost of initializing\
    \ with zeros. Scales `linearly` with buffer size.\n\n## Using Uninitialized Buffers\n\
    \nLarger buffers are often desirable for potentially higher throughput due to\
    \ the reduced number of syscalls. However, allocating oversized buffers has a\
    \ linear initialization cost, which can be avoided by using `uninitialized` buffers\
    \ in Node.JS.\n\n[\\[2\\]https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global\\\
    _Objects/Generator/retu](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Generator/return)\n\
    \n[rn](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Generator/return)\n\
    \n[\\[3\\]https://docs.python.org/3/reference/expressions.html#generator.close](https://docs.python.org/3/reference/expressions.html#generator.close)\n\
    \n[\\[4\\]https://docs.python.org/2.5/whatsnew/pep-342.html](https://docs.python.org/2.5/whatsnew/pep-342.html)\n\
    \n[Report an Error | Ask a Question](https://forms.gle/UKo4bncuMGTM7) @ [build-your-own.org](https://build-your-own.org)\n\
    \n# 09. File IO & Resource Management\n\n```\nconst buf = Buffer.allocUnsafe(65536);\n\
    ```\n\nThis function is called `allocUnsafe` because a buggy program has a greater\
    \ chance of leaking internal information to users. Uninitialized data bugs are\
    \ also harder to debug due to their unpredictability.\n\n## Reusing Buffers\n\n\
    Uninitialized buffers are not easily obtainable in some languages, such as Go\
    \ or Python. What you can do is reuse the same buffer for multiple IO operations.\n\
    \n```\nfunction readerFromStaticFile(fp: fs.FileHandle, size: number): BodyReader\
    \ {\n  const buf = Buffer.allocUnsafe(65536);\n  // reused for each read\n  return\
    \ {\n    length: size,\n    read: async (): Promise<Buffer> => {\n      const\
    \ r = await fp.read({buffer: buf});\n      // ...\n      return r.buffer.subarray(0,\
    \ r.bytesRead);\n    },\n  };\n}\n```\n\nThis will amortize the cost of the buffer\
    \ allocations.\n\n## Pooled Buffers\n\nInstead of allocating buffers locally,\
    \ you can have a global pool of `used` buffers. Whenever you are done with a buffer,\
    \ you put it into that pool. And when you need a buffer, you try to grab one from\
    \ the pool, and only create a new one if the pool is empty. The advantages of\
    \ this are:\n\n- Grabbing stuff from the pool can cost even less than the memory\
    \ allocator.\n- Different code paths benefit from the pool. There are fewer real\
    \ allocations.\n\nAn object pool is trivial to code. The Node.JS `Buffer` type\
    \ uses a built-in pool\\[5\\]](https://nodejs.org/api/buffer.html#static-method-bufferallocunsafesize)\
    \ but only for `small` buffers. The Go standard library also includes object pool\\\
    [6\\]](https://pkg.go.dev/sync#Pool).\n\n## Mind the Lifetime When Reusing Buffers\n\
    \nBuffers can be allocated by either the producer or the consumer. In all cases\
    \ we have seen, the producer allocates the buffer and returns it to whoever uses\
    \ the data. This can be problematic because the buffer may still be referenced\
    \ and used while the next `read()` is running.\n\n```\nfunction readerFromStaticFile(fp:\
    \ fs.FileHandle, size: number): BodyReader {\n  const buf = Buffer.allocUnsafe(65536);\n\
    \  // reused for each read\n  return {\n    length: size,\n    read: async ():\
    \ Promise<Buffer> => {\n      const r = await fp.read({buffer: buf});\n      //\
    \ CAUTION: the lifetime of the buffer is unclear!\n      return r.buffer.subarray(0,\
    \ r.bytesRead);\n    },\n  };\n}\n```\n\nLet’s apply the lesson from the resource\
    \ management: who owns the buffer? For the code in this chapter, we know that\
    \ the buffer returned by the producer (`BodyReader`) is written to the socket,\
    \ and our code waits for the write to complete before invoking the next `read()`,\
    \ so the producer is the only place the buffer is referenced, so we can reason\
    \ that the consumer doesn’t need to own the buffer, so the buffer reuse is valid.\
    \ However, this may not be true for more complicated consumers!\n\nAnother case\
    \ is when the consumer allocates the buffer, the lifetime of the buffer is clear\
    \ as long as the data is processed in place so the consumer is the sole owner.\n\
    \n```javascript\n// pseudo code!\nconst buf = Buffer.allocUnsafe(65536);\n// reused\
    \ for each read\nwhile (more_data()) {\n  const nbytes = await read_data(buf);\n\
    \  // read from the producer\n  await process(buf.subarray(0, nbytes));\n  //\
    \ buf is not used anymore, so it's safe to reuse.\n}\n```\n\nIn Golang, when pulling\
    \ data from the `io.Reader` interface, the buffer is provided by the consumer.\
    \ This encourages buffer reuse and discourages unnecessary allocations by design.\n\
    \n# CHAPTER 10: Range Requests\n\nThe next step is to add range requests to our\
    \ file server, which will allow resumeable transfers.\n\n## 10.1 How Range Requests\
    \ Work\n\n### The Range Header Field Syntax\n\nA range request is initiated by\
    \ the client with the `Range` header field. For example, `Range: 0-9` retrieves\
    \ the first 10 bytes of the payload. The header field is fully specified in [RFC\
    \ 9110](https://www.rfc-editor.org/rfc/9110).\n\n### The Effective Range with\
    \ Examples\n\nThe effective range is the intersection with the real file range.\
    \ Suppose we have a 50-byte file, here are some examples and their effective ranges.\n\
    \n| Range: bytes=x | Effective Range |\n| :--- | :--- |\n| 0-0 | [0, 1) |\n| 0-1\
    \ | [0, 2) |\n| 10- | [10, 50) |\n| 10-60 | [10, 50) |\n| -10 | [40, 50) |\n|\
    \ -60 | [0, 50) |\n| 4-3 | invalid |\n| 70-60 | invalid |\n| -0 | invalid |\n\
    | --1 | invalid |\n| foobar | invalid |\n| 60- | out of range |\n| 60-70 | out\
    \ of range |\n\nThe server must also handle unhappy cases:\n\n- If the intersection\
    \ is empty, the server responds with status code 416 (Range Not Satisfiable).\n"
  trans: "\n这也会执行 `finally` 块。你甚至可以使用特殊类型的异常来通知生成器你打算在途中途终止它，这样生成器就可以处理这种特殊情况。\n\n\
    Python 生成器有[类似的方法[3]](https://docs.python.org/3/reference/expressions.html#generator.close)[](#index_split_001.html#p86)。令人惊讶的是[4]](https://docs.python.org/2.5/whatsnew/pep-342.html)[](#index_split_001.html#p86)，Python\
    \ 的垃圾回收器会自动为生成器执行 `finally` 块，尽管关于 GC 是否应该处理非内存业务尚存争议。\n\n# 9.4 讨论：复用缓冲区\n\n##\
    \ 缓冲区分配是有成本的\n\n`readerFromStaticFile()` 函数为每次读取分配并返回一个新缓冲区。这并不高效，因为缓冲区的分配是有成本的：\n\
    \n1. 内存内存分配器的成本。对于许多实现来说，这种成本在大多数情况下是 `constant` 的。在最好的情况下，分配器要么从空列表中返回对象，要么从大内存块中分配。\n\
    2. 零初始化的成本。随缓冲区大小 `linearly` 增长。\n\n## 使用未初始化的缓冲区\n\n由于减少了系统调用的次数，通常希望使用较大的缓冲区以获得更高的吞吐量。然而，分配过大的缓冲区具有线性的初始化成本，这可以通过在\
    \ Node.JS 中使用 `uninitialized` 缓冲区来避免。\n\n[[2\\]https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global\\\
    _Objects/Generator/retu](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Generator/return)\n\
    \n[rn](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Generator/return)\n\
    \n[\\[3\\]https://docs.python.org/3/reference/expressions.html#generator.close](https://docs.python.org/3/reference/expressions.html#generator.close)\n\
    \n[\\[4\\]https://docs.python.org/2.5/whatsnew/pep-342.html](https://docs.python.org/2.5/whatsnew/pep-342.html)\n\
    \n[报告错误 | 提问](https://forms.gle/UKo4bncuMGTM7) @ [build-your-own.org](https://build-your-own.org)\n\
    \n# 09. 文件 IO 与资源管理\n\n```\nconst buf = Buffer.allocUnsafe(65536);\n```\n\n此函数之所以为\
    \ `allocUnsafe` 是因为有错误的程序更有可能向用户泄露内部信息。未初始化数据的 bug 由于其不可预测性，也难以调试。\n\n## 复用缓冲区\n\
    \n在某些语言（如 Go 或 Python）中，很难获取未初始化的缓冲区。你可以对对同一个缓冲区进行多次 IO 操作。\n\n```\nfunction readerFromStaticFile(fp:\
    \ fs.FileHandle, size: number): BodyReader {\n  const buf = Buffer.allocUnsafe(65536);\n\
    \  // 每次读取复用\n  return {\n    length: size,\n    read: async (): Promise<Buffer>\
    \ => {\n      const r = await fp.read({buffer: buf});\n      // ...\n      return\
    \ r.buffer.subarray(0, r.bytesRead);\n    },\n  };\n}\n```\n\n这将分摊缓冲区分配的成本。\n\n\
    ## 缓冲区池\n\n与其在本地分配缓冲区，不如维护一个全局的 `used` 缓冲区池。每当你完成一个缓冲区时，就将其放入池中。当你需要缓冲区时，尝试从池中获取一个，只有当池为空时才创建一个新的。此处的优点是：\n\
    \n- 从池中获取内容的成本可能比内存分配器还要低。\n- 不同的代码路径都能从中受益。真实的分配更少。\n\n对象池的代码非常简单。Node.JS 的 `Buffer`\
    \ 类型使用了内置池[5]](https://nodejs.org/api/buffer.html#static-method-bufferallocunsafesize)，但仅用于\
    \ `small` 缓冲区。Go 标准库也包含了对象池[6]](https://pkg.go.dev/sync#Pool)。\n\n## 复用缓冲区时注意生存\n\
    \n缓冲区可以由生产者或消费者分配。在我们看到的所有情况下，生产者分配缓冲区并将其返回给任何使用数据的人。这可能会产生问题，因为在下次 `read()` 运行时，缓冲区可能仍被引用和使用。\n\
    \n```\nfunction readerFromStaticFile(fp: fs.FileHandle, size: number): BodyReader\
    \ {\n  const buf = Buffer.allocUnsafe(65536);\n  // 每次读取复用\n  return {\n    length:\
    \ size,\n    read: async (): Promise<Buffer> => {\n      const r = await fp.read({buffer:\
    \ buf});\n      // 注意：缓冲区的生命周期不明确！\n      return r.buffer.subarray(0, r.bytesRead);\n\
    \    },\n  };\n}\n```\n\n让我们应用资源管理的教训：谁拥有缓冲区？对于本章的代码，我们知道生产者（`BodyReader`）返回的缓冲区被写入套字，我们在调用下次\
    \ `read()` 之前会等待写入完成，因此生产者是引用缓冲区的唯一地方，我们可以推断消费者不需要拥有缓冲区，因此缓冲区复用是有效的。然而，对于更复杂的消费者，这可能不成立！\n\
    \n另一种是消费者分配缓冲区，只要数据是原地处理的，缓冲区的生命周期就是的，因此消费者是唯一的所有者。\n\n```javascript\n// 伪代码！\n\
    const buf = Buffer.allocUnsafe(65536);\n// 每次读取复用\nwhile (more_data()) {\n  const\
    \ nbytes = await read_data(buf);\n  // 从生产者读取\n  await process(buf.subarray(0,\
    \ nbytes));\n  // buf 不再使用，所以复用是安全的。\n}\n```\n\n在 Golang 中，从 `io.Reader` 接口拉取数据时，缓冲区由消费者提供。这在设计上鼓励了缓冲区复用并抑制了不必要的分配。\n\
    \n# 第 10 章：范围请求 (Range Requests)\n\n下一步是为文件服务器添加范围请求，这将允许断点续传传输。\n\n## 10.1 范围请求如何工作\n\
    \n### Range Header 字段语法\n\n范围请求由客户端通过 `Range` 头部字段发起。例如，`Range: 0-9` 获取负载的前 10\
    \ 个字节。该头部字段在 [RFC 9110](https://www.rfc-editor.org/rfc/9110) 中完整规范。\n\n### 有效范围及示例\n\
    \n有效范围与实际文件范围的交集。假设我们有一个 50 字节的文件，这里是一些示例及其有效范围。\n\n| Range: bytes=x | 有效范围 |\n\
    | :--- | :--- |\n| 0-0 | [0, 1) |\n| 0-1 | [0, 2) |\n| 10- | [10, 50) |\n| 10-60\
    \ | [10, 50) |\n| -10 | [40, 50) |\n| -60 | [0, 50) |\n| 4-3 | invalid |\n| 70-60\
    \ | invalid |\n| -0 | invalid |\n| --1 | invalid |\n| foobar | invalid |\n| 60-\
    \ | out of range |\n| 60-70 | out of range |\n\n服务器还必须处理异常的情况：\n\n- 如果交集为空，服务器返回状态码\
    \ 416 (Range Not Satisfiable)。\n\n"
