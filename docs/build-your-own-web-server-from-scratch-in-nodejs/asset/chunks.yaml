    03\. Code A TCP Server


    **3.7 Discussion: Promise-Based IO**


    As we mentioned before, there is another style of writing IO code. The alternative
    style uses Promises instead of callbacks. The advantage of promise-based APIs
    is that you can await on them and get the result, thus avoiding breaking your
    program into tiny callbacks that scattered all over the place.


    A hypothetical promised-based API for the *accept* primitive looks like this:


    // pseudo code!


    while (running) {


    let socket = await server.accept();


    newConn(socket);


    // no àwaitòn this


    }


    And the hypothetical API for the *read* and *write* primitive looks like this:


    // pseudo code!


    async function newConn(socket) {


    while (true) {


    let data = await socket.read();


    if (!data) {


    break;


    // EOF


    }


    await socket.write(data);


    }


    }


    The above pseudo code appears to be synchronous, but without blocking the event
    loop.


    Although the advantage may not be clear at this point, since our program is very
    simple.


    Some Node.js APIs, but not all of them, are available in both callback-based and
    promise-based styles. However, with some effort, callback-based APIs can be converted
    to promised-based ones, as we will see in the next chapter.


