    \ 'Range');\nconst ifr = fieldGet(req.headers, 'If-Range');\nif (ifr && parseHTTPDate(ifr.toString('latin1'))\
    \ !== ts) {\n  hrange = null;\n  // ignore thèRangè field\n}\n// usèhrangè to\
    \ check the requested range ...\n```\n\n[Report an Error | Ask a Question](https://forms.gle/UKo4bncUnuMGBrTM7)\
    \ @ [build-your-own.org](https://build-your-own.org)\n\n92\n\n2024-02-02\n\n11.\
    \ HTTP Caching\n\nThe `ETag` scheme will likely require a separate subsystem to\
    \ keep track of the content, whether it’s a hash value or a version number, so\
    \ we won’t code this.\n\n## 11.2 Discussion: Server-Side Cache Control\n\nWe have\
    \ talked about how clients validate their cache, the next thing is to control\
    \ the caching behavior from the server side. That is, how long the clients should\
    \ keep the cache.\n\nThe server uses the `Cache-Control` header field to advise\
    \ the client about caching. Its value is a comma-separated list of directives.\
    \ For example:\n\n`Cache-Control: no-store, no-cache, max-age=0, must-revalidate`\n\
    \n### When to Revalidate Cache\n\nThe `max-age=x` directive specifies how long\
    \ the cached item will live in seconds (time-to-live, or TTL). However, the cache\
    \ does not simply delete the item when it expires. It’s complicated, so complicated\
    \ that it has its own document: [RFC 9111](https://www.ietf.org/rfc/rfc9111).\n\
    \nCached items are described as *fresh* or *stale* depending on whether they are\
    \ older than their `max-age`. The fresh or stale state determines when the item\
    \ should be validated.\n\n| Cache-Control from server | Validate stale | TTL |\n\
    | :--- | :--- | :--- |\n| `max-age=x` | maybe | x |\n| `max-age=x, must-revalidate`\
    \ | must | x |\n| `max-age=x, immutable` | should | x |\n| `max-age=0, must-revalidate`\
    \ | (not fresh) | 0 |\n| `no-cache` | (not fresh) | 0 |\n| (not present) | heuristic\
    \ | heuristic |\n\n**Control the TTL**\n\nThe `max-age` directive alone doesn’t\
    \ give much control over the lifetime of the cache as seen from the table, because\
    \ the table uses the ambiguous words “maybe” and “should”, what’s the difference\
    \ between them?\n\n[RFC 9111](https://www.ietf.org/rfc/rfc9111)\n\n93\n\n2024-02-02\n\
    \n11. HTTP Caching\n\nA browser will normally reuse a fresh item, but it MAY revalidate\
    \ the item even when the cache is fresh, this can happen when the user hits the\
    \ reload button.\n\nBut why is “Validate stale” a “should”? What’s the point of\
    \ setting the TTL if the effect is not even guaranteed? It turns out there are\
    \ 2 levels of guarantee.\n\n1. Without `must-revalidate`, a stale item may still\
    \ be reused, this can happen when the server is unreachable.\n2. With `must-revalidate`,\
    \ the cache TTL is actually respected.\n\nImplementations do not necessarily distinguish\
    \ between “should” and “must” cases, though.\n\n**Make the Client Always Check\
    \ the Server**\n\nThe `no-cache` directive is confusing, it does not mean “do\
    \ not cache”, it’s a shorthand for `max-age=0, must-revalidate`, which means “cache\
    \ but always validate”. It is used when the latest data is desired.\n\n**Prevent\
    \ Caching**\n\nTo prevent caching altogether, use the `no-store` directive, which\
    \ instructs the client not to touch the cache at all. (This also won’t cause the\
    \ existing cache entry to be deleted.)\n\n**Reduce Fresh Validations**\n\nThe\
    \ `immutable` directive is an optimization; it tells the client not to revalidate\
    \ a fresh item, even when reloading. This can be used when the URL is immutable,\
    \ such as when the resource is retrieved by its hash value. Not all browsers have\
    \ implemented this, though.\n\n**Heuristic Caching**\n"
  trans: "\n[报告错误 | 提问](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)\n\
    \n89\n\n2024-02-02\n\n## 10. Range 请求 (Range Requests)\n\n```\nawait writeHTTPBody(conn,\
    \ res.body);\n\n}\n\n} finally {\n\n  await res.body.close?.();\n\n  // cleanups\n\
    }\n```\n\n无论如何 `BodyReader` 都会被关闭，因为在我们的案例中 `BodyReader` 仍然拥有一个文件资源。你也可以在请求处理器中处理\
    \ `HEAD` 方法并尽早关闭文件（从根本上就不创建 `BodyReader`）。\n\n[报告错误 | 提问](https://forms.gle/UKo4bncUnuMGBrTM7)\
    \ @ [build-your-own.org](https://build-your-own.org)\n\n90\n\n# 11 章\n# HTTP 缓存\n\
    \n2024-02-02\n\n在本章中，我们将探索 HTTP 缓存，它可以减少不必要的传输。\n\n## 11.1 缓存验证器 (Cache Validator)\n\
    \nWeb 浏览器默认会缓存响应，即使服务器没有投入太大精力。\n\n问题是：客户端如何知道缓存项是否有效？有一种机制可以服务器查询这些信息。\n\n###\
    \ 通过时间戳验证 (Validate by Timestamp)\n\n实现这种方法的方法是通过 `Last-Modified` 和 `If-Modified-Since`\
    \ 头部字段。其步骤如下：\n\n1. 服务器在 `Last-Modified` 头部字段中返回文件的文件系统修改时间。\n2. 客户端缓存响应以及时间戳。\n\
    3. 客户端在复用缓存响应之前对其进行验证，发送将 `If-Modified-Since` 头部字段设置为缓存时间戳的请求：\n- 如果服务器上的文件已修改（由不同的时间戳指示），服务器将照常返回响应。\n\
    - 如果服务器不支持此验证方法并忽略该字段，也照常返回。\n- 如果服务器上的时间戳相同，服务器返回状态码 `304`（未修改），此状态码没有负载，只需告诉客户端复用缓存。\n\
    4. 如果状态码为 `304`，客户端将复用缓存响应；或者使用正常响应并更新缓存。\n\n### 通过 ETag 验证 (Validate by ETag)\n\
    \n时间戳的分率仅为一秒，对于某些用例是不够的，而且文件时间戳并不是识别内容的可靠方法。另一种识别内容的方法是通过 `ETag` 头部。它的工作方式与 `Last-Modified`\
    \ 相同，但其值是任意的，你可以使用内容的哈希值或版本号。\n\n`ETag` 通过 `If-None-Match` 进行验证，这类似于 `If-Modified-Since`。\n\
    \n91\n\n2024-02-02\n\n### 范围请求验证 (Validate for Range Requests)\n\n上述验证适用于客户端缓存了旧版本并期望服务器返回新版本场景。然而，范围请求的情况不同：如果内容与客户端拥有的相同，服务器只能返回部分响应。在这种情况下，客户端不能使用\
    \ `If-Modified-Since` 或 `If-None-Match`；而是使用 `If-Range` 头部，它包含 `ETag` 或时间戳。如果\
    \ `If-Range` 值*不匹配*（则导致完整响应）。\n\n### 验证头部总结 (Summary of Validation Headers)\n\n\
    | 服务器到客户端 | 客户端到服务器 | 注释 |\n| :--- | :--- | :--- |\n| `Last-Modified` | `If-Modified-Since`\
    \ | 时间戳。 |\n| `ETag` | `If-None-Match` | 哈希、版本号等。 |\n| `ETag/Last-Modified` |\
    \ `If-Range` | 部分还是完整？ |\n\n### 实现时间戳验证器 (Implementing the Timestamp Validator)\n\
    \n作为一个简单的服务器，添加 `Last-Modified` 和 `If-Modified-Since` 头部字段是轻而易举的。\n\n```javascript\n\
    const ts = Math.floor(stat.mtime.getTime() / 1000); // 修改 ts\n\nconst headers:\
    \ Buffer[] = [\n  // 支持范围请求\n  Buffer.from('Accept-Ranges: bytes'),\n  // 用于缓存验证\n\
    \  Buffer.from(`Last-Modified: ${stat.mtime.toUTCString()}`)\n];\n\n// 检查条件\n\
    const ifm = fieldGet(req.headers, 'If-Modified-Since');\nif (ifm && parseHTTPDate(ifm.toString('latin1'))\
    \ === ts) {\n  const empty = readerFromMemory(Buffer.from(''));\n  return {code:\
    \ 304, headers: headers, body: empty};\n}\n\nlet hrange = fieldGet(req.headers,\
    \ 'Range');\nconst ifr = fieldGet(req.headers, 'If-Range');\nif (ifr && parseHTTPDate(ifr.toString('latin1'))\
    \ !== ts) {\n  hrange = null;\n  // 忽略 Range 字段\n}\n// 使用 hrange 检查请求范围 ...\n\
    ```\n\n[报告错误 | 提问](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)\n\
    \n92\n\n2024-02-02\n\n11 HTTP 缓存\n\n`ETag` 可能需要一个独立的子系统来跟踪内容（无论是哈希值还是版本号），因此我们不会编写代码。\n\
    \n## 11.2 讨论：服务端缓存控制 (Discussion: Server-Side Cache Control)\n\n我们已经讨论了客户端如何验证缓存，下一步是从服务器端控制缓存行为。即客户端应该保留缓存多久。\n\
    \n服务器使用 `Cache-Control` 头部字段建议客户端缓存。其值是逗号分隔的指令列表。例如：\n\n`Cache-Control: no-store,\
    \ no-cache, max-age=0, must-revalidate`\n\n### 何时重新验证缓存 (When to Revalidate Cache)\n\
    \n`max-age=x` 指令指定缓存项存活多少秒（生存时间，或 TTL）。然而，缓存在过期时并简单地删除项。它非常复杂，复杂到有自己的文档：[RFC 9111](https://www.ietf.org/rfc/rfc9111)。\n\
    \n缓存项根据其是否超过了 `max-age` 被描述为*新鲜的 (fresh)* 或*过期的 (stale)*。新鲜或过期的状态决定了何时应该验证项。\n\
    \n| 服务器提供的 Cache-Control | 验证过期项 | TTL |\n| :--- | :--- | :--- |\n| `max-age=x`\
    \ | 可能 (maybe) | x |\n| `max-age=x, must-revalidate` | 必须 (must) | x |\n| `max-age=x,\
    \ immutable` | 应该 (should) | x |\n| `max-age=0, must-revalidate` | (不新鲜) | 0 |\n\
    | `no-cache` | (不新鲜) | 0 |\n| (不存在) | 启发式 (heuristic) | 启发式 (heuristic) |\n\n\
    **控制 TTL**\n\n单凭 `max-age` 指令对缓存所示的寿命并没有提供足够的控制，因为表格使用了模糊的词汇“maybe”和“should”，它们之间有何区别？\n\
    \n[RFC 9111](https://www.ietf.org/rfc/rfc9111)\n\n93\n\n2024-02-02\n\n11 HTTP\
    \ 缓存\n\n浏览器通常会复用新鲜项，但即使缓存是新鲜的，它可能会重新验证项，这发生在用户点击刷新按钮时。\n\n但为什么“验证过期项”是“应该”？如果设置\
    \ TTL 的效果无法保证，它的意义何在？事实上有两层保证：\n\n1. 没有 `must-revalidate`，过期项可能仍被复用，这发生在服务器不可用时。\n\
    2. 有了 `must-revalidate`，缓存 TTL 实际上被遵守了。\n\n不过实现实现并不区分“应该”和“必须”的情况。\n\n**让客户端始终检查服务器\
    \ (Make the Client Always Check the Server)**\n\n`no-cache` 指令具有误导性，它并不是“不要缓存”，它是\
    \ `max-age=0, must-revalidate` 的缩写，意味着“缓存但始终验证”。它用于需要最新数据的情况。\n\n**防止缓存 (Prevent\
    \ Caching)**\n\n要完全防止缓存，使用 `no-store` 指令，它指示客户端不要碰缓存。（这也不会导致现有的缓存项被删除。）\n\n**减少新鲜验证\
    \ (Reduce Fresh Validations)**\n\n`immutable` 指令是一种优化；它告诉客户端即使在刷新时也不要重新验证新鲜项。这可以在\
    \ URL 是不可变的时使用，例如通过其哈希值检索资源时。不过并非所有浏览器都实现了这一点。\n\n**启发式缓存 (Heuristic Caching)**\n\
    \n"
