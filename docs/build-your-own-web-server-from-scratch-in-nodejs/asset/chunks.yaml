    **8.5 Discussion: Debugging with Packet Capture Tools**


    We have been writing non-trivial networking code. It is important to know how
    to debug your code.


    Adding print statements is a quick way to inspect what’s happening. However, there
    is a cheaper way for network applications: Packet capture tools, such as tcpdump,
    ngrep, and Wireshark, can intercept TCP data from the network. This is especially
    useful in production where you cannot just edit the code.


    **Capture & Inspect Data with \`tcpdump\`**


    An example: tcpdump -X -i lo port 1234


    • The -X flag tells tcpdump to do a hex dump.


