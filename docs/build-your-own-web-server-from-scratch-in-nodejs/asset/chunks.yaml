    06\. HTTP Semantics and Syntax


    **Length-Prefixed Data in Binary Protocols**


    Delimiters in text are used to separate elements. In binary protocols and formats,
    a better and simpler alternative is to use *length-prefixed* data, that is, to
    specify the length of the element before the element data. Some examples are:


    • The chunked transfer encoding. Although the length itself is still delimited.


    • The WebSocket frame format. No delimiters at all.


    • HTTP/2. Frame-based.


    • The [MessagePack\[8\]](https://github.com/msgpack/msgpack/blob/master/spec.md)
    serialization format. Some kind of binary JSON.


    [\[8\]https://github.com/msgpack/msgpack/blob/master/spec.md](https://github.com/msgpack/msgpack/blob/master/spec.md)


