    12\. Compression & the Stream API


    Note: The push() method uses null to mark the end of the stream, which is different
    from what we are using (0-length buffer).


    **Step 4: Creating a Pipe**


    Let’s try to create a pipe between a BodyReader and the compressor.


    function gzipFilter(reader: BodyReader): BodyReader {


    const gz: stream.Duplex = zlib.createGzip();


    const input: stream.Readable = body2stream(reader);


    (async () => {


    try { await pipeline(input, gz); }


    catch (err) { gz.destroy(err); }


    })();


    // not awaiting it


    // return the wrapped \`BodyReader\` ...


    }


    The pipeline() function will move data for us, and it returns a promise for us
    to await on it.


    We must also catch any exceptions while awaiting on a promise, and the caught
    error must be propagated to the next stream, otherwise its consumer will hang
    forever.


    In the gzipFilter() function, we cannot wait for the pipe to complete because
    we must return a wrapped BodyReader to the caller, so the try-catch block is wrapped
    in an anonymous async function call without await. This can be simplified by registering
    an error handling callback to the promise.


    pipeline(input, gz).catch((err: Error) => gz.destroy(err)); // no await **Step
    5: Reading from \`stream.Readablè**


    Now that the pipe is running, we can read the output from the compressor. Remember
    that a net.Socket is also a stream.Readable; the soRead() function can be used
    without modification (except for type annotations) because various socket events
    such as ''data'' and ''end'', pause() and resume() methods, are actually defined
    on stream.Readable.


    But the stream.Readable interface already has a promise-based method for reading.
    Its iterator() method returns an AsyncIterator, which you can use in a for await...of
    loop like a generator. The AsyncIterator also has a next() method that is similar
    to a generator.


