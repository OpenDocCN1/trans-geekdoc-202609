  trans: "\n\n只要有异步通信，就有连接生产者和消费者的队列或缓冲区。在物理世界中，队列和缓冲区的大小是有边界的，无法存储无限的数据。异步通信的一个问题是，**当生产者生产速度大于消费者速度时会发生什么**？必须有一种机制来防止队列或缓冲区溢出。这种机制在网络应用中通常被称为\
    \ `backpressure`（背压）。\n\n## TCP 中的背压：流量控制\n\nTCP 中的背压被称为 `flow control`（流量控制）。\n\
    \n- 消费者 TCP 栈将接收到的数据存储在接收缓冲区中，供应用程序消费。\n- 生产者 TCP 栈可以发送的数据量受生产者 TCP 栈知的 `window`（窗口）限制，当\
    \ `window` 满时，它将`pause`发送数据。\n- 消费者 TCP 栈管理 `window`；当应用程序从接收缓冲区中提取数据时，它会向前`move`\
    \ `window` 并通知生产者 TCP 栈`resume`（恢复）发送。\n\n流量控制的效果：`TCP` 可以暂停和恢复传输，从而使消费者的接收缓冲区保持边界。\n\
    \n```\nflow ctrl\n\nbounded!\n\n|producer| ==> |send buf| ===========> |recv buf|\
    \ ==> |consumer|\n\napp\n\nOS\n\nTCP\n\nOS\n\napp\n```\n\n`TCP` 流量控制不应与 `TCP`\
    \ 拥塞控制混淆，后者也控制 `window`。\n\n## 应用与操作系统之间的背压\n\n这种良好的机制不仅需要实现在 `TCP` 中，还需要在应用程序中。\n\
    \n让我们关注生产者。应用程序产生数据并提交给 `OS`，数据进入 `send buffer`（发送缓冲区），`TCP` 栈从 `send buffer`\
    \ 消费数据并传输数据。\n\n```\nwrite()\n\nmay block!\n\n|producer| ========> |send buf|\
    \ =====> ...\n\napp\n\nOS\n\nTCP\n```\n\n## 04. Promises 和事件\n\n`OS` 如何防止 `send\
    \ buffer` 溢出？简单，当 `buffer` 满时，应用程序无法写入更多数据。现在由应用程序负责自我节流以防止过度生产，因为数据必须去某个地方，但内存是有限的。\n\
    \n如果应用程序正在执行阻塞 IO，当 `send buffer` 满时调用将会阻塞，因此背压变得轻而易举。然而，在 `JS` 中使用事件循环进行编码时，情况并非如此。\n\
    \n### 无界队列是陷阱（Footguns）\n\n我们现在可以回答这个问题了：为什么要等待写入完成？因为当应用程序等待时，它无法产生数据！即使运行时由于\
    \ `send buffer` 满而无法向 `OS` 提交更多数据，`socket.write()` 也会总是成功，但数据必须去往某个地方，它进入了运行时中的一个无界内部队列，这是一个导致可能导致无限内存占用的陷阱。\n\
    \n```\nwrite()\n\nunbounded!\n\nevent loop\n\n|producer| ======> |internal queue|\
    \ =========> |send buf| =====> ...\n\napp\n\nNode.js\n\nOS\n\nTCP\n```\n\n以我们旧的\
    \ echo 服务器为例，服务器既是生产者也是消费者，客户端也是如此。如果客户端产生数据的速度比它消费回显数据的速度快（或者客户端完全不消费任何数据），如果服务器不等待写入完成，服务器的内存将无限增长。\n\
    \n在任何连接生产者和消费者的系统中，都应该存在背压。一个经验法则是寻找软件系统中的无界队列，因为它们是缺乏背压的信号。\n\n### 4.6 讨论：事件和有序执行\n\
    \n与旧版本的另一个不同点是使用了 `socket.pause()`。你现在可以理解为什么这至关重要，因为它被用于实现背压。\n\n暂停 `'data'`\
    \ 事件还有另一个原因。在基于回调的代码中，当事件处理程序返回时，如果没有暂停，运行时可以触发下一个 `'data'` 事件。问题在于，**事件回调的完成并不意味着事件处理的完成**——处理可以通过随后的回调继续。而且考虑到数据是字节的有序序列，交错处理（interleaved\
    \ handling）可能会导致问题！\n\n这种情况被称为 `race condition`（竞态条件），是一类与并发相关的问题。在这种情况下，引入了意外的并发。\n\
    \n## 4.7 结论：Promise vs 回调\n\n遵循上述讨论，我们现在可以解释为什么我们切换到基于 promise 的 API，因为它们有优势。\n\
    \n- 如果你坚持使用 `promises` 和 `async/await`，很难创建上述的竞态条件，因为事情是按顺序发生的。\n- 使用基于回调的代码，不仅更难理解代码执行的顺序，也更难控制顺序。简之，回调更难读，且编写时更容易出错。\n\
    \ 使用 使用基于 `promise` 的风格时，背压是自然存在的。这类似于使用阻塞 IO 编码（这在 `Node.js` 中无法实现）。\n\n我们已经学习了\
    \ `socket` API 的基础。让我们进入下一个主题：协议。\n\n## CHAPTER 05: 简单的网络协议\n\n### 5.1 消息 Echo\
    \ 服务器\n\n解析 `HTTP` 是一项大量工作，所以让我们先迈出一小步。我们将实现一个更简单的协议来演示协议最重要的功能：将字节流拆分为消息。\n\n\
    我们的协议由 `'\\n'`（换行符）分隔的消息组成。服务器读取消息并使用相同的协议发送回复。\n\n- 如果客户端发送 `'quit'`，回复 `'Bye.'`\
    \ 并关闭连接。\n- 否则，带前缀 `'Echo: '` 回显消息。\n\n```\nclient\n\nserver\n\n\\------\n\n\\\
    ------\n\nmsg1\\n\n\n==>\n\n<==\n\nEcho: msg1\\n\n\nmsg2\\n\n\n==>\n\n<==\n\n\
    Echo: msg2\\n\n\nquit\\n\n\n==>\n\n<==\n\nBye.\\n\n```\n\n### 5.2 动态缓冲区\n\n####\
    \ 动态缓冲区的必要\n\n消息并不是直接来自 `socket` 本身，我们需要将接收到的数据存储在 `buffer` 中，然后我们可以尝试从中拆分消息。\n\
    \n`Node.JS` 中的 `Buffer` 对象是固定大小的二进制数据块。它不能通过追加数据来增长。我们可以做的是将两个 `buffers` 合并为一个\
    \ `buffer`。\n\n```\nbuf = Buffer.concat([buf, data]);\n```\n\n然而，这是一种反模式，会导致 `O(n2)`\
    \ 算法复杂度。\n\n```\n// 伪代码！坏的例子！\n\nwhile (need_more_data()) {\n\n  buf = Buffer.concat([buf,\
    \ get_some_data()]);\n}\n```\n\n每当通过合并追加新数据时，旧数据都会被复制。为了分摊拷贝成本，使用了*动态数组*：\n- C++:\
    \ `std::vector` 和 `std::string`。\n- Python: `bytearray`。\n- Go: `slice`。\n\n####\
    \ 编写动态缓冲区\n\n`buffer` 必须比需要的数据大，以便利用额外容量分摊拷贝。`DynBuf` 类型存储实际的数据长度。\n\n```\n//\
    \ 一个动态大小的缓冲区\n\ntype DynBuf = {\n  data: Buffer,\n  length: number,\n};\n```\n\
    \n`copy()` 方法的语法是 `src.copy(dst, dst_offset, src_offset)`。这用于追加数据。\n\n```typescript\n\
    // append data to DynBuf\n\nfunction bufPush(buf: DynBuf, data: Buffer): void\
    \ {\n  const newLen = buf.length + data.length;\n  if (buf.data.length < newLen)\
    \ {\n    // 增长容量 ...\n  }\n  data.copy(buf.data, buf.length, 0);\n  buf.length\
    \ = newLen;\n}\n```\n\n`Buffer.alloc(cap)` 创建一个指定大小的新缓冲区。这用于调整缓冲区大小。新缓冲区必须*指数级*增长，以便分摊成本为\
    \ `O(1)`。我们将使用 2 的幂序列作为缓冲区容量。\n\n```typescript\n// append data to DynBuf\n\nfunction\
    \ bufPush(buf: DynBuf, data: Buffer): void {\n  const newLen = buf.length + data.length;\n\
    \  if (buf.data.length < newLen) {\n    // 按 2 的幂增长容量\n  }\n}\n```\n\n"
