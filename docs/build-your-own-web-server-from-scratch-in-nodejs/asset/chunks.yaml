    03\. Code A TCP Server


    **Step 1: Create A Listening Socket**


    All the networking stuff is in the net module.


    import \* as net from "net";


    Different types of sockets are represented as JS objects. The net.createServer()
    function creates a listening socket whose type is net.Server. net.Server has a
    listen() method to bind and listen on an address.


    let server = net.createServer();


    server.listen({host: ''127.0.0.1'', port: 1234});


    **Step 2: Accept New Connections**


    The next thing is the *accept* primitive for getting new connections. Unfortunately,
    there is no accept() function that simply returns a connection.


    Here we need some background knowledge about IO in JS: There are 2 styles of handling
    IO in JS, the first style is using callbacks; you request something to be done
    and register a callback with the runtime, and when the thing is done, the callback
    is invoked.


    function newConn(socket: net.Socket): void {


    console.log(''new connection'', socket.remoteAddress, socket.remotePort);


    // ...


    }


    let server = net.createServer();


    server.on(''connection'', newConn);


    server.listen({host: ''127.0.0.1'', port: 1234});


    In the above code listing, server.on(''connection'', newConn) registers the callback
    function newConn. The runtime will automatically perform the *accept* operation
    and invoke the callback with the new connection as an argument of type net.Socket.
    This callback is registered once, but will be called for each new connection.


