    05\. A Simple Network Protocol


    **Reduce Latency by Pipelining Requests**


    Consider a typical modern web page that involves many scripts and style sheets.
    It takes many HTTP requests to load the page, and each request increases the load
    time by at least one roundtrip time (RTT). If we can send multiple requests at
    once, without waiting for the responses one by one, the load time could be greatly
    reduced. On the server side, the server shouldn’t tell the difference because
    a TCP connection is just a byte stream.


    client


    server


    \------


    \------


    |req1|


    \==>


    |req2|


    \==>


    |req3|


    \==>


    <==


    |res1|


    ...


    <==


    |res2|


    ...


    This is called *pipelined* requests. It’s a common way to reduce RTTs in request-response
    protocols.


    This is why we kept the remaining buffer data around, because there can be more
    than 1


    message in it.


    **Support Pipelined Requests**


    While you can make pipelined requests to many well-implemented network servers,
    such as Redis, NGINX, some less common implementations are problematic! Web browsers
    do not use pipelined HTTP requests due to buggy servers, they may use multiple
    concurrent connections instead.


    But if you treat TCP data *strictly* as a continuous stream of bytes, pipelined
    messages should be indistinguishable, because the parser doesn’t depend on the
    size of the buffered data, it just consumes elements one by one.


    So pipelined messages are a way to check the correctness of a protocol parser.
    If the server treats a socket read as a “TCP packet”, it would easily fail.


    You can test the pipelined scenario with the following command line.


    echo -e ''asdf\\n1234'' | socat tcp:127.0.0.1:1234 -


    The server will probably receive 2 messages in a single ''data'' event, and our
    server handled them correctly.


