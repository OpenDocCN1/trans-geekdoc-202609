    2024-02-02


    12\. Compression & the Stream API


    Name


    Description


    Example


    Readable


    Consume output from this. fs.createReadStream()


    Writable


    Feed input to this.


    fs.createWriteStream()


    Duplex


    Readable + Writable.


    net.Socket


    Transform


    Extends Duplex.


    zlib.createGzip()


    Readable and Writable are the 2 basic abstractions. Both Duplex and Transform
    are a combina-tion of Readable and Writable, how they differ is not relevant to
    us at this point.


    Some built-in Node.JS modules already implement them, as seen in the table.


    **Using Pipes on Stream Interfaces**


    Our goal in exploring these abstractions is to use pipes on them.


    import { pipeline } from "stream/promises";


    The pipeline() function connects a stream.Readable to a stream.Writable. After
    creating a pipe, data automatically flows from a producer to a consumer, and backpressure
    is present, just like in a real Unix pipe. This function is named after Unix pipes,
    do not confuse it with request pipelining.


    function pipeline(src: stream.Readable, dst: stream.Writable): Promise<void>;
    You can also put one or more stream.Duplex between the source and destination.


    function pipeline(


    src: stream.Readable,


    transform1: stream.Duplex,


    transform2: stream.Duplex,


    // more ...


    dst: stream.Writable,


    ): Promise<void>;


    **12.4 Implementing HTTP Compression**


    The zlib module implements stream.Duplex for compression objects. It’s a great
    opportunity to learn how to use the Node.JS Stream API.


