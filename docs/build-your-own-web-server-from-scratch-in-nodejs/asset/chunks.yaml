- raw: '• If any of the ranges are invalid, the server ignores the header field (and
    serves the full file).


    **Range Requests Are Optional**


    Once you start adding features to your HTTP server, you’ll find that most HTTP
    features are optional, and optional features can make things more complicated
    than they seem.


    A server may not support range requests at all, and even if it does, they are
    not applicable to all requests. For example, it makes no sense to return a ranged
    response for dynamically generated content, because the length of the content
    is not even known in advance, and the server cannot tell if the request is out
    of range.


    **Range Responses Are Indicated by 206**


    How does a client know if the server supports range requests? That’s the job of
    the 206


    (Partial Content) status code, which indicates a partial response instead of a
    full one (200


    OK).


    **\`Content-Rangè Returns the Effective Range**


    As seen in the examples above, the effective range may be different from the requested
    range, so the server needs to tell the client the exact range returned. That’s
    the job of the Content-Range header field. It contains the effective range of
    the response, along with the total content length.


    [Report an Error | Ask a Question](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)


    85


    2024-02-02


    10\. Range Requests


    Content-Range: bytes 12-34/1234


    This header field is also used for 416 (Range Not Satisfiable) responses to tell
    the client the correct length of the content.


    Content-Range: bytes \*/1234


    **Announcing \`Rangè Support**


    There are ways to let clients know that range requests are available. The server
    can include the Accept-Ranges: bytes header field in a non-range response to indicate
    that this URI supports range requests, so the client knows that it can resume
    the download with a range request if interrupted.


    **Probing with thèHEAD\` Method**


    And there is a way to tell if range requests are supported *without* retrieving
    any part of the response — the HEAD HTTP method.


    If the server supports the HEAD method, it should behave like a GET but *without*
    the response body, returning the response header field and the status code as
    if the request is being fully served. The client can then check for Accept-Ranges
    or Content-Range without actually receiving the content.


    Remember that the way payload length is determined in HTTP is messy. The HEAD
    method adds a special case for clients: The server may return the Content-Length,
    but it doesn’t tell the payload length this time; the HEAD method has no response
    body, regardless of what the header fields say!


    **Multiple Ranges with the Multipart Message**


    Although rarely used, the Range header field can be multiple ranges separated
    by commas.


    Here is an example.


    GET / HTTP/1.1


    Range: bytes=0-5,8-13


    HTTP/1.1 206 Partial Content


    Accept-Ranges: bytes


    Content-Length: 227


    [Report an Error | Ask a Question](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)


    86


    2024-02-02


    10\. Range Requests


    Content-Type: multipart/byteranges; boundary=SEPARATOR1234567


    \--SEPARATOR1234567


    Content-Type: text/html; charset=UTF-8


    Content-Range: bytes 0-5/1234


    <html>


    \--SEPARATOR1234567


    Content-Type: text/html; charset=UTF-8


    Content-Range: bytes 8-13/1234


    <head>


    \--SEPARATOR1234567--


    The response is completely different from the single-range response:


    • Content-Range is not used.


    Instead, it uses Content-Type: multipart/byteranges;


    boundary=x.


    • The response is encoded in a new message format:


    **–** Indicated by the Content-Type header field.


    **–** Multiple parts are separated by a random string delimiter.


    **–** Each part is a header-payload structure, similar to HTTP itself. The header
    contains the Content-Range header field for each part.


    The Content-Length header field still serves the same purpose, which is the length
    of the payload (the multipart message), not the sum of the ranges.


    Here we learned a new idea to separate data — random string delimiters. The delimiter
    should be long enough so that the payload is unlikely to contain it. The maximum
    length is 70 bytes according to [RFC 2046\[2\]](https://datatracker.ietf.org/doc/html/rfc2046)[.](#index_split_001.html#p92)
    Still, delimiters are generally not a good idea.


    **Discussion: Is Multipart Message Technically Necessary?**


    Why not simply concatenate multiple ranges without this message encapsulation?
    This can work if Content-Range could return the range list.


    While many computer problems are solved by an extra encapsulation, it’s also common
    to see encapsulations that do nothing.


    [\[2\]https://datatracker.ietf.org/doc/html/rfc2046](https://datatracker.ietf.org/doc/html/rfc2046)


    [Report an Error | Ask a Question](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)


    87


