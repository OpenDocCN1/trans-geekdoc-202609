    12\. Compression & the Stream API


    **Step 1: Check Header Fields and Enable Compression**


    Do this according to our understanding of header fields. We’ll unconditionally
    gzip the response if requested by the client. It’s also a good idea to let applications
    control when not to use compression.


    function enableCompression(req: HTTPReq, res: HTTPRes): void {


    // inform proxies that the response is variable


    res.headers.push(Buffer.from(''Vary: content-encoding''));


    // check header fields


    if (fieldGet(req.headers, ''Range'')) {


    return; // incompatible


    }


    const codecs: string\[\] = fieldGetList(req.headers, ''Accept-Encoding''); if
    (!codecs.includes(''gzip'')) { // TODO: parse the weight: \`gzip;q=0\`


    return;


    }


    // transform the response using gzip


    res.headers.push(Buffer.from(''Content-Encoding: gzip''));


    res.body = gzipFilter(res.body);


    }


    The gzipFilter() function is what we’ll implement next, which returns a wrapper
    of a BodyReader to compress the data.


    **Step 2: Understanding the Gotchas without Pipes**


    Without using the pipeline() function, you may simply image the solution like
    this:


    // pseudo code!


    function gzipFilter(reader: BodyReader): BodyReader {


    const gz: stream.Duplex = zlib.createGzip();


    return {


    length: -1,


    read: async (): Promise<Buffer> => {


    const data = await reader.read();


    await write\_input(gz, data);


    // deadlock by backpressure!


    return await read\_output(gz);


    // deadlock by buffering!


    },


    }


    }


    [Report an Error | Ask a Question](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)


    102


    2024-02-02


    12\. Compression & the Stream API


    Unfortunately, this pseudo code does not work for 2 reasons.


    1\. The compressor implements backpressure, which means that if you write a large
    piece of input, the code will block until the input is processed and *drained*.
    But in the above pseudo code, the data is drained *after* the write is completed,
    which is a case of deadlock! (We discussed a similar deadlock in the “Pipelined
    Requests” section.) 2. Most data compression methods inherently require buffering;
    1 data input to the compressor does not result in 1 compressed output. Without
    enough data, the compressor won’t generate output because it hasn’t decided how
    to compress the data. Reading from the compressor will stuck when it is expecting
    more data!


    In a Unix pipe, reading and writing happen in different processes, the pipe is
    fed and drained *simultaneously*, so there are no deadlocks like in the above
    solution. That’s why I mentioned that the pipe abstraction is less error-prone
    to use.


    **Step 3: Implementing \`stream.Readablè**


    We’re back on track. Before we can use the pipeline() function, we must implement
    the stream.Readable interface for the data source BodyReader.


    Here is how to implement a stream.Readable:


    1\. A stream.Readable has an internal queue, use the push() method to add data
    to the queue, then the data is available for consumption.


    2\. When should you add data to the queue? You need to implement a read() callback,
    which is invoked when the queue is empty and someone is consuming. This is essential
    for maintaining backpressure.'
