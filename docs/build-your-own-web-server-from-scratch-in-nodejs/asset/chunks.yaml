    **CHAPTER 06**


    **HTTP Semantics and Syntax**


    HTTP is very human-readable, which means you can build a server by looking at
    examples instead of the specification. However, this approach results in buggy
    toy code, and you won’t learn much. So you need to consult the specification —
    a series of RFC documents.


    **6.1 High-Level Structures**


    Let’s review what you already know from the introductory chapter:


    • An HTTP request message consists of:


    **–** The method, which is a verb such as GET, POST.


    **–** The URI.


    **–** A list of header fields, which is a list of key-value pairs.


    **–** A payload body, which follows the request header. Special case: GET and
    HEAD


    have no payload.


    • An HTTP response consists of:


    **–** A status code, mostly to indicate whether the request was successful.


    **–** A list of header fields.


    **–** An optional payload body.


    These things are mostly the same from HTTP/1.0 to HTTP/3.


    HTTP/1.0 200 OK


    Age: 525410


    Cache-Control: max-age=604800


    Content-Type: text/html; charset=UTF-8


    Date: Thu, 20 Oct 2020 11:11:11 GMT


    Etag: "1234567890+gzip+ident"


    Last-Modified: Thu, 20 Oct 2019 11:11:11 GMT


    Vary: Accept-Encoding


    Content-Length: 1256


    Connection: close


    <!doctype html>


    <!-- omitted -->


    **6.2 Content-Length**


    HTTP semantics are mostly about interpreting header fields, which is described
    in [RFC](https://www.rfc-editor.org/rfc/rfc9110.html)


    [9110\[1\]](https://www.rfc-editor.org/rfc/rfc9110.html)[.](#index_split_000.html#p44)
    Try reading it yourself.


    [\[1\]https://www.rfc-editor.org/rfc/rfc9110.html](https://www.rfc-editor.org/rfc/rfc9110.html)


    39


    2024-02-02


    06\. HTTP Semantics and Syntax


    The most important header fields are Content-Length and Transfer-Encoding, because
    they determine the length of an HTTP message, which is the most important function
    of a protocol.


    **The Length of the HTTP Header**


    Both a request and a response consist of 2 parts: header + body. They are separated
    by an empty line. A line ends with ''\\r\\n''. So the header ends with ''\\r\\n\\r\\n''
    including the empty line. That’s how we determine the length of the header.


    **The Length of the HTTP Body**


    The length of the body is complicated because there are 3 ways to determine it.
    The **first** way is to use Content-Length, which contains the length of the body.


    Some ancient HTTP/1.0 software doesn’t use Content-Length, so the body is just
    the rest of the connection data, the parser reads the socket to EOF and that’s
    the body. This is the **second** way to determine the body length. This way is
    problematic because you cannot tell if the connection is ended prematurely.


    **6.3 Chunked Transfer Encoding**


    **Generate and Send Data on the Fly**


    The **third** way is to use Transfer-Encoding: chunked instead of Content-Length.
    This is called *chunked transfer encoding*. It can mark the end of the payload
    without knowing its size in advance.


    This allows the server to send the response while generating it on the fly. This
    use case is called *streaming*. An example is displaying real-time logs to the
    client without waiting for the process to finish.


    **Another Layer of Protocol**


    How does chunked encoding work? As the sender, we don’t know the total payload
    length, but we do know the portion of the payload we have. So we can send it in
    a mini-message format called a “chunk”. And a special chunk marks the end of end
    stream.


    The receiver parses the byte stream into chunks and consumes the data, until the
    special chunk is received. Here is a concrete example:


    4\\r\\nHTTP\\r\\n5\\r\\nserver\\r\\n0\\r\\n\\r\\n


    It is parsed into 3 chunks:


    • 4\\r\\nHTTP\\r\\n


    [Report an Error | Ask a Question](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)


    40


    2024-02-02


    06\. HTTP Semantics and Syntax


    • 6\\r\\nserver\\r\\n


    • 0\\r\\n\\r\\n


    You can easily guess how this works. Chunks start with the size of the data, and
    a 0-sized chunk marks the end of the stream.


    **Chunks Are Not Messages**


    Note that the chunk data boundaries are just side effects. These chunks are not
    represented to the application as individual messages; the application still sees
    the payload as a byte stream.


    **6.4 Ambiguities in HTTP**


    **The Happy Cases of Body Length**


    In summary, this is how to determine the length of the payload body (if the HTTP
    method allows the payload body, i.e., POST or PUT).


    1\. If Transfer-Encoding: chunked is present. Parse chunks.


    2\. If Content-Length: number is valid. The length is known.


    3\. If neither field is present, use the rest of the connection data as the payload.


    There are also special cases, such as GET and HEAD, 304 (Not Modified) status
    code, which make HTTP not easy to implement.


    **Mind the Nasty Cases**


    You may wonder what happens if *both* header fields are present, as there is no
    clear way to interpret this. This kind of ambiguity is a source of security exploits
    known as [“HTTP](https://en.wikipedia.org/wiki/HTTP_request_smuggling)


    [request smuggling\[2\]](https://en.wikipedia.org/wiki/HTTP_request_smuggling)[”.](#index_split_000.html#p46)


    Another ambiguity is the nonexistent payload body for the GET request, what if
    the the request includes Content-Length? Should the server ignore the field or
    forbid the field? What about Content-Length: 0?


    Also, should the server or client even allow users to mess with the Content-Length
    and Transfer-Encoding fields at all? There are many discussions on the Internet,
    and although the RFC tried to [enumerate the cases\[3\]](https://www.rfc-editor.org/rfc/rfc9112#section-6.3)[,](#index_split_000.html#p46)
    different implementations handle them differently.


    An exercise for the reader: If you are designing a new protocol, how do you avoid
    ambiguities like this?


    [\[2\]https://en.wikipedia.org/wiki/HTTP\_request\_smuggling](https://en.wikipedia.org/wiki/HTTP_request_smuggling)


    [\[3\]https://www.rfc-editor.org/rfc/rfc9112#section-6.3](https://www.rfc-editor.org/rfc/rfc9112#section-6.3)


    [Report an Error | Ask a Question](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)


    41


    2024-02-02


    06\. HTTP Semantics and Syntax


    **6.5 HTTP Message Format**


    [RFC 9112\[4\]](https://www.rfc-editor.org/rfc/rfc9112.html) describes exactly
    how bits are transmitted over the network.


    **Read the BNF Language**


    The HTTP message format is described in a language called *BNF*. Go to the “2.
    Message”


    section in RFC 9112 and you will see things like this:


    HTTP-message


    \= start-line CRLF


    \*( field-line CRLF )


    CRLF


    \[ message-body \]


    start-line


    \= request-line / status-line


    This says: An HTTP message is either a request message or a response message.
    A message starts with either a request line or a status line, followed by multiple
    header fields, then an empty line, then the optional payload body. Lines are separated
    by CRLF, which is the ASCII string ''\\r\\n''. The BNF language is much more concise
    and less ambiguous than English.


    **HTTP Header Fields**


    field-line


    \= field-name ":" OWS field-value OWS


    The header field name and value are separated by a colon, but the rules for field
    name and value are defined in RFC 9110 instead.


    field-name


    \= token


    token


    \= 1\*tchar


    tchar


    \= "!" / "#" / "$" / "%" / "&" / "''" / "\*"


    / "+" / "-" / "." / "^" / "\_" / "\`" / "|" / "~"


    / DIGIT / ALPHA


    ; any VCHAR, except delimiters


    OWS


    \= \*( SP / HTAB )


    ; optional whitespace


    field-value


    \= \*field-content


    field-content


    \= field-vchar


    \[ 1\*( SP / HTAB / field-vchar ) field-vchar \]'
