  trans: "\nPromise 可以被视为管理回调的另一种方式。它们也被描述为 `asynchronous`（异步），意味着结果是通过回调传递的。这些 API\
    \ 不会阻塞事件循环，因为 JS 代码不会等待结果；相反，JS 代码会返回运行时，当结果就绪时，运行时会调用回调来继续你的程序。\n\n与之相反的是 `synchronous`（同步）API，它会阻塞调用的操作系统线程以等待结果的产生。例如，让我们来看\
    \ `fs` 模块的文档，文件 API 在[所有 3 种](https://nodejs.org/api/fs.html)[](#index_split_000.html#p22)\
    \ 中可用。\n\n```\n// promise\nfilehandle.read([options]);\n\n// callback\nfs.read(fd[,\
    \ options], callback);\n\n// synchronous, do not use!\nfs.readSync(fd, buffer[,\
    \ options]);\n```\n\n在网络应用中，你**不会**使用同步 API，因为它会阻塞事件循环。它们存在于某些简单的用例（如脚本），这些场景完全不依赖事件循环。\n\
