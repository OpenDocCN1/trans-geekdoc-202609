    13\. WebSocket & Concurrency


    While the read() function does not require the whole message to be stored in memory,
    it does have a downside: the application must ensure that the message data is
    consumed, otherwise the next frame won’t be parsed.


    **Step 2: Design the Server Application Interface**


    The WSServer is the application interface for sending and receiving data messages.


    // The WebSocket API


    type WSServer = {


    send(msg: WSMsg): Promise<void>,


    // supports multiple producers


    recv(): Promise<null|WSMsg>,


    // null after EOF


    close(): void,


    };


    This is similar to what we do with a socket — read from it and write to it. Except
    that concurrent reads and writes have valid use cases and must be supported.


    • Concurrent writes: Multiple app tasks generate messages independently.


    • Concurrent reads: Concurrent message processing with a task pool.


    You can also use callbacks to deliver messages instead of actively reading them.
    But this makes the backpressure less obvious, because you’ll also need the pause()
    and resume() methods. This is why we ditched callback-based IO early on.


    **Step 3: Design the Server Tasks**


    Unlike request-response, sending and receiving are independent. So we need:


    • A task to parse the incoming byte stream: wsServerRecv().


    • A task to write messages to the socket: wsServerSend().


    These 2 tasks run concurrently with the application tasks. Two queues are used
    to connect the 2 tasks to the application (send and receive). Another queue is
    used to connect wsServerSend() to the socket.


    App <= qrecv (Queue) <= wsServerRecv <= reqBody (BodyReader)


    App => qsend (Queue) => wsServerSend => qsock (Queue) => resBody (BodyReader)
    There can be multiple app tasks concurrently producing or consuming with a single
    WebSocket, but the tasks for reading and writing to the socket must be sequential.
    This is an example of solving concurrency problems by passing data.


