    04\. Promises and Events


    How does the OS prevent the send buffer from overflowing? Simple, the application
    cannot write more data when the buffer is full. Now the application is responsible
    for throttling itself from overproducing, because the data has to go somewhere,
    but memory is finite.


    If the application is doing blocking IO, the call will block when the send buffer
    is full, so backpressure is effortless. However, this is not the case when coding
    in JS with an event loop.


    **Unbounded Queues are Footguns**


    We can now answer the question: why wait for writes to complete? Because while
    the application is waiting, it cannot produce! The socket.write() will always
    succeed even if the runtime cannot submit more data to the OS due to a full send
    buffer, but the data has to go somewhere, it goes to an unbounded internal queue
    in the runtime, which is a footgun that can cause unbounded memory usage.


    write()


    unbounded!


    event loop


    |producer| ======> |internal queue| =========> |send buf| =====> ...


    app


    Node.js


    OS


    TCP


    Taking our old echo server as an example, the server is both a producer and a
    consumer, as is the client. If the client produces data faster than the client
    consumes the echoed data (or the client does not consume any data at all), the
    server’s memory will grow indefinitely if the server does not wait for writes
    to complete.


    Backpressure should exist in any system that connects producers to consumers.
    A rule of thumb is to look for unbounded queues in software systems, as they are
    a sign of the lack of backpressure.


    **4.6 Discussion: Events and Ordered Execution**


    Another difference from the old one is the use of socket.pause(). You can now
    understand why this is essential, because it is used to implement backpressure.


    There is another reason to pause the ''data'' event. In callback-based code, when
    the event handler returns, the runtime can fire the next ''data'' event if it
    is not paused. The problem is that **the completion of the event callback doesn’t
    mean the completion of the event handling**


    — the handling can continue with further callbacks. And the interleaved handling
    can cause problems, considering that the data is an ordered sequence of bytes!


    This situation is called a *race condition*, and is a class of problems related
    to concurrency. In this situation, unwanted concurrency is introduced.


