    \ their length in advance, like the chunked transfer encoding in HTTP. A “logical”\
    \ data message can be broken into multiple frames, but the application sees the\
    \ combined message.\n\n- The first frame has opcode `0x01` or `0x02`, while the\
    \ rest frames use `0x00`.\n- The last frame has the `FIN` flag set.\n- Only data\
    \ messages (opcode `0x01` and `0x02`) can be fragmented.\n- Frames of different\
    \ messages cannot be interleaved, except for control messages.\n\nAn example with\
    \ 3 fragments:\n\n| opcode=0x01, FIN=0 | opcode=0x00, FIN=0 | opcode=0x00, FIN=1\
    \ |\n\nAn unfragmented message is encoded as a single frame with opcode `0x01`\
    \ or `0x02` and the `FIN` flag is set.\n\nLike the design of chunked transfer\
    \ encoding, you can stream arbitrarily large data as a single message. But many\
    \ implementations represent the message data as a single buffer, so there is a\
    \ limit to the message size.\n\n## 13. WebSocket & Concurrency\n\n### 13.3 Introduction\
    \ to Concurrent Programming\n\n#### Race Conditions\n\nIn message-based designs,\
    \ it’s common to have multiple sources of messages consumed by a single consumer,\
    \ such as multiple concurrent tasks sending messages over a single WebSocket.\n\
    \nSince WebSocket messages are serialized into a single TCP byte stream, concurrent\
    \ writes to the socket will mess up the protocol.\n\nLet’s use a hypothetical\
    \ example to illustrate the problem.\n\n```javascript\n// pseudo code!\nasync\
    \ function send(conn, msg) {\n  await write_header(conn, msg);\n  await write_body(conn,\
    \ msg);\n}\n```\n\nIn this example, writing 1 message involves 2 socket writes,\
    \ and the code yields to the runtime at each `await` statement. The problem is\
    \ that while back to the runtime, the runtime may schedule another task that is\
    \ also sending a message, resulting in *interleaved* socket writes.\n\nThis is\
    \ called a `race condition` in concurrent programming. Note that this has *nothing*\
    \ to do with the single-threaded runtime or the number of CPU cores.\n\n#### Atomic\
    \ Operations\n\nYou may think that the solution is to use only 1 socket write\
    \ for each message. However, this solution is …\n\n- Correct only if socket writes\
    \ are atomic, which may not be guaranteed.\n- Not always possible and not convenient.\
    \ Consider that WebSocket messages can be fragmented and used like streams.\n\n\
    Although operating systems try to implement concurrent writes as atomic operations,\
    \ no sane application will depend on this behavior, and a byte stream is not about\
    \ messages.\n\n#### Mutual Exclusion with Mutexes\n\nOne solution is to use a\
    \ lock (`mutex`) to limit concurrent writes to the socket.\n\n```javascript\n\
    // pseudo code\nasync function send(mutex, msg) {\n  await mutex.lock();\n  try\
    \ {\n    // write to the socket\n  } finally {\n    mutex.unlock();\n  }\n}\n\
    ```\n\nA `mutex` is “mutual exclusion” because it disallows more than one task\
    \ from entering the locked state. In the case of concurrent access, one task holds\
    \ the `lock` and the rest block on the `await` statement, and releasing the lock\
    \ will unblock one of the waiters. The `mutex` is one of the `synchronization\
    \ primitives` in many concurrent environments.\n\n#### Multiplexing with Queues\n\
    \nAnother solution to preventing concurrent access is to use a queue. The queue\
    \ accepts WebSocket messages from concurrent producers, and a dedicated task consumes\
    \ from the queue and writes to the socket.\n\n```javascript\n// pseudo code\n\
    let queue = createQueue();\n// for multiple producers\nasync function produce(msg)\
    \ {\n  await queue.pushBack(msg);\n}\n\nasync function single_consumer() {\n \
    \ while (running()) {\n    const msg = await queue.popFront();\n    // write to\
    \ the socket\n  }\n}\n```\n\nA `mutex` is also a form of queue that doesn’t pass\
    \ data, it passes control.\n\n#### Flow Control with Blocking Queues\n\nA JS array\
    \ is a queue that you can `push` and `pop`. But it is not useful for concurrent\
    \ programming. How do you, as a consumer, know when the queue is not empty? There\
    \ needs to be a mechanism that allows consumers to wait for producers.\n\nThis\
    \ mechanism can be implemented in the queue! That’s why the above pseudo code\
    \ uses `await` to consume from the queue. This is called a `blocking queue` because\
    \ consumers are blocked when the queue is empty.\n\nAlso, backpressure requires\
    \ that the queue be bounded in capacity. This is achieved by having the producer\
    \ block when the queue is full. In contrast to the `Stream` API in Node.JS, this\
    \ removes the footgun of not mandating backpressure.\n\n```typescript\n// both\
    \ producers and consumers can block.\ntype Queue<T> = {\n  pushBack(item: T):\
    \ Promise<void>;\n  popFront(): Promise<T>;\n};\n```\n\nA `blocking queue` not\
    \ only passes data between producers and consumers, it also passes `control`,\
    \ which is similar to a `mutex`. In fact, while passing data is convenient, passing\
    \ control is more fundamental in concurrent programming.\n\n#### Cancellation\
    \ with Closeable Queues\n\nA blocking queue is similar to a Unix pipe in terms\
    \ of blocking behavior. Except for one thing: a pipe can be `closed`!\n\n- If\
    \ closed by the producer, the consumer gets `EOF`.\n- If closed by the consumer,\
    \ the producer gets errors when writing to it.\n\nIn concurrent programming, sometimes\
    \ you need to make tasks quit their jobs. For example, if a WebSocket is closed\
    \ while the application task is blocking on it (either reading or writing), the\
    \ task should be woken up (to get an `EOF` or an error) instead of hanging forever.\n\
    \nIf the task is a consumer of a queue, you can put special values into the queue\
    \ to notify consumers to quit. But for producers waiting on a queue, this is not\
    \ so easy. Fortunately, we can learn from Unix pipes — add a `close()` method\
    \ to unblock all producers and consumers.\n\n```typescript\ntype Queue<T> = {\n\
    \  pushBack(item: T): Promise<void>;\n  // throws if closed\n  popFront(): Promise<null|T>;\n\
    \  // returns null if closed\n  close(): void;\n};\n```\n\nWe can throw exceptions\
    \ to producers and return nulls to consumers, mimicking closed pipes.\n\n####\
    \ The Blocking Queue as a Synchronization Primitive\n\nA synchronization primitive\
    \ is something used to block and unblock tasks (pass control).\n\nSome traditional\
    \ synchronization primitives include:\n\n- `Mutex`.\n- `Semaphore`.\n- `Condition\
    \ variable`.\n- `Event`.\n\nIn addition to traditional synchronization primitives,\
    \ Golang also employs the `channel` as its primary synchronization primitive,\
    \ which is mostly similar to the blocking queue we’re discussing.\n"
  trans: "` 标签中似乎中断了（到 `Event`.` 处结束），我将针对你提供的**已给出文本**进行翻译。\n\n[content]\n\n- `0x09`\
    \ 和 `0x10`：Ping 和 pong，即心跳包。用于保持连接活跃和探测断开连接。对于应用程序可以是透明的。\n\n## 分片消息\n\nWebSocket\
    \ 还支持在不预知消息长度的情况下发送消息，类似于 HTTP 中的分块传输编码（chunked transfer encoding）。一个“逻辑”数据消息可以被分成多个帧（frames），但应用程序看到的是合并后的消息。\n\
    \n- 第一帧的操作码（opcode）为 `0x01` 或 `0x02`，其余帧使用 `0x00`。\n- 最后一帧设置了 `FIN` 标志。\n- 只有数据消息（opcode\
    \ `0x01` 和 `0x02`）可以被分片。\n- 不同消息的帧不能交替出现，控制消息除外。\n\n一个包含 3 个分片的示例：\n\n| opcode=0x01,\
    \ FIN=0 | opcode=0x00, FIN=0 | opcode=0x00, FIN=1 |\n\n未分片的消息被编码为单帧，操作码为 `0x01`\
    \ 或 `0x02`，并设置了 `FIN` 标志。\n\n类似于分块传输编码的设计，你可以将任意大小的数据作为单条消息流传输。但许多实现将消息数据表示为单个缓冲区，因此消息大小存在限制。\n\
    \n## 13. WebSocket 与并发\n\n### 13.3 并发性编程简介\n\n#### 竞态条件\n\n在基于消息的设计中，由单个消费者消费多个消息源的情况很常见，例如多个并发任务通过单个\
    \ WebSocket 发送消息。\n\n由于 WebSocket 消息被序列化为单个 TCP 字节流，对套接字的并发写入会破坏协议。\n\n让我们用一个假设的示例来来说明这个问题。\n\
    \n```javascript\n// 伪代码！\nasync function send(conn, msg) {\n  await write_header(conn,\
    \ msg);\n  await write_body(conn, msg);\n}\n```\n\n在这个示例中，写入 1 条消息涉及 2 次套接字写入，且代码在每个\
    \ `await` 语句处都会让给运行时。问题是，当返回运行时后，运行时可能会调度另一个也在发送消息的任务，导致套接字写入发生*交替*现象。\n\n这在并发编程中被称为\
    \ `race condition`（竞态条件）。注意，这与单线程运行时或 CPU 核心数*完全无关*。\n\n#### 原子操作\n\n你可能认为解决方案是每条消息只使用\
    \ 1 次套接字写入。然而，这种解决方案是……\n\n- 仅在套接字写入是原子的情况下正确，而这可能无法保证。\n- 并不总是可行且不方便。考虑到 WebSocket\
    \ 消息可以被分片并像流一样使用。\n\n#### 使用互斥锁实现互斥\n\n一种解决方案是使用锁（`mutex`）来限制对套接字的并发写入。\n\n在并发访问的情况下，一个任务持有\
    \ `lock`，其他任务在 `await` 语句处阻塞，释放锁将解除其中一个等待者的阻塞。`mutex` 是许多并发环境中 `synchronization\
    \ primitives`（同步原语）之一。\n\n#### 使用队列多路用\n\n防止并发访问的另一种解决方案是使用队列。队列接收来自并发生产者的 WebSocket\
    \ 消息，由一个专用任务从队列中消费并写入套接字。\n\n```javascript\n// 伪代码\nlet queue = createQueue();\n\
    // 用于多个生产者\nasync function produce(msg) {\n  await queue.pushBack(msg);\n}\n\n\
    async function single_consumer() {\n  while (running()) {\n    const msg = await\
    \ queue.popFront();\n    // 写入套接字\n  }\n}\n```\n\n`mutex` 也是队列的一种形式，它不传递数据，而是传递控制权。\n\
    \n#### 使用阻塞队列进行流量控制\n\nJS 数组是一个可以 `push` 和 `pop` 的队列。但它对并发编程并不可好用。作为消费者，你如何知道队列何时不为空呢？这需要一种机制，允许消费者等待生产者。\n\
    \n这种机制可以在队列中实现！这就是为什么上面的伪代码使用 `await` 来从队列中消费数据。这被称为 `blocking queue`（阻塞队列），因为当队列为空时，消费者会被阻塞。\n\
    \n此外，反压（backpressure）要求队列的容量是有边界的。这通过让生产者在队列满时发生阻塞来实现。与 Node.JS 中的 `Stream` API\
    \ 相比，这消除了不强制要求反压的“陷阱”。\n\n```typescript\n// 生产者和消费者都可以阻塞。\ntype Queue<T> = {\n\
    \  pushBack(item: T): Promise<void>;\n  popFront(): Promise<T>;\n};\n```\n\n`blocking\
    \ queue` 不仅在生产者和消费者之间传递数据，还传递 `control`，这类似于 `mutex`。事实上，虽然传递数据很方便，但在并发编程中传递控制权是更基础的。\n\
    \n#### 使用可关闭队列进行取消\n\n阻塞队列在阻塞行为上与 Unix 管道（pipe）相似。有一点不同：管道是可以被 `closed` 的！\n\n\
    - 如果由生产者关闭，消费者将获得 `EOF`。\n- 如果由消费者关闭，生产者在写入时会收到错误。\n\n在并发编程中，有时你需要任务退出工作。例如，如果\
    \ WebSocket 在应用程序任务阻塞它（读取或写入）时被关闭，任务应该被唤醒（获取 `EOF` 或错误），而不是永远挂起。\n\n如果任务是队列的消费者，你可以在队列中放入特殊值来通知消费者退出。但对于等待队列的生产者来说，这并不容易。幸运的是，我们可以向\
    \ Unix 管道学习——添加一个 `close()` 方法来解除所有生产者和消费者的阻塞。\n\n```typescript\ntype Queue<T>\
    \ = {\n  pushBack(item: T): Promise<void>;\n  // 如果关闭则抛出异常\n  popFront(): Promise<null|T>;\n\
    \  // 如果关闭则返回 null\n  close(): void;\n};\n```\n\n我们可以向生产者抛出异常并向消费者返回 null，模拟关闭的管道。\n\
    \n#### 阻塞队列作为同步原语\n\n同步原语是用于阻塞和解除阻塞任务（传递控制权）的东西。\n\n一些传统的同步原语包括：\n\n- `Mutex`。\n\
    - `Semaphore`。\n- `Condition variable`。\n- `Event`。\n\n除了传统的同步原语之外，Golang 还采用\
    \ `channel` 作为其主要的同步原语，它与我们讨论的阻塞队列非常相似。\n\n"
