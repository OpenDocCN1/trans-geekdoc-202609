    **High Water Mark in Node.JS**


    Both stream.Readable and stream.Writable have a built-in high water mark that
    can be changed by the highWaterMark option when implementing them. And it’s often
    desirable to use larger values for high throughput applications.


    const r = new stream.Readable({


    highWaterMark: 4096,


    // also for \`Writablè


    read: async () => { /\* produce data and feed it to r.push() \*/ },


    });


    When using the high water mark for backpressure, check the return value of Readable.push()
    and Writable.write():


    • They return false when the queue is full, so you can wait for it to drain.


    • Otherwise, you can push more data into it.


    We didn’t use their return values because we simply treated the high water mark
    as 0 and drained the queue after each write.


    Table 5: High water mark in Streams.


    Interface Backpressure indicator Wait until queue is drained


    Readable


    .push(data)


    Via the read() callback


    Writable


    .write(data, cb)


    Via the ''drain'' event.


    Stream interfaces support, but do not mandate backpressure; you can still push
    data into them even if the queue is full, which is a footgun for beginners.


    [\[6\]https://linux.die.net/man/2/writev](https://linux.die.net/man/2/writev)


    [\[7\]https://nodejs.org/api/stream.html#writable\_writevchunks-callback](https://nodejs.org/api/stream.html#writable_writevchunks-callback)


