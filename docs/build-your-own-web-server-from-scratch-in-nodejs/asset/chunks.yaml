    There are still a few constructs that we haven’t touched in the BNF specification
    — the optional chunk-ext on the chunk-size line and the trailer-section at the
    end. These are some obscure features that were designed into the specification,
    but not used much in practice.


    The chunk-ext is designed to extend the chunk format by adding additional key-value
    pairs, but in practice there is no need for such extensions.


    The trailer-section is designed to put some header fields after the HTTP body.
    You may wonder why would one do that, this is for some rare use cases. Some people
