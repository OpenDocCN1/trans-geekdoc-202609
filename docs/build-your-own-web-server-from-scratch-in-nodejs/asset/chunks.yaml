    TCP


    itself works in detail is not our concern; what we need to know about TCP is that
    it’s a bidirectional channel for transmitting raw bytes — a carrier for other
    application protocols such as HTTP or SSH.


    Although each direction of a TCP connection can operate independently, many protocols
    follow the request-response model. The client sends a request, then the server
    sends a response, then the client might use the same connection for further requests
    and responses.


