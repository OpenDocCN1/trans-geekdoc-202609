    11\. HTTP Caching


    The ETag scheme will likely require a separate subsystem to keep track of the
    content, whether it’s a hash value or a version number, so we won’t code this.


    **11.2 Discussion: Server-Side Cache Control**


    We have talked about how clients validate their cache, the next thing is to control
    the caching behavior from the server side. That is, how long the clients should
    keep the cache.


    The server uses the Cache-Control header field to advise the client about caching.
    Its value is a comma-separated list of directives. For example:


    Cache-Control: no-store, no-cache, max-age=0, must-revalidate


    **When to Revalidate Cache**


    The max-age=x directive specifies how long the cached item will live in seconds
    (time-to-live, or TTL). However, the cache does not simply delete the item when
    it expires. It’s complicated, so complicated that it has its own document: [RFC
    9111 — HTTP Caching\[1\]](https://datatracker.ietf.org/doc/html/rfc9111)[.](#index_split_001.html#p98)


    Cached items are described as *fresh* or *stale* depending on whether they are
    older than their max-age. The fresh or stale state determines when the item should
    be validated. This also depends on other cache directives, as shown in the table.


    Cache-Control from server


    Validate fresh Validate stale TTL


    max-age=x


    maybe


    should


    x


    max-age=x, must-revalidate


    maybe


    must


    x


    max-age=x, immutable


    should not


    should


    x


    max-age=0, must-revalidate


    (not fresh)


    must


    0


    no-cache


    (not fresh)


    must


    0


    (not present)


    heuristic


    heuristic


    heuristic


    **Control the TTL**


    The max-age directive alone doesn’t give much control over the lifetime of the
    cache as seen from the table, because the table uses the ambiguous words “maybe”
    and “should”, what’s the difference between them?


