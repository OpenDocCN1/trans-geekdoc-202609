    \ Before we can use the `pipeline()` function, we must implement the `stream.Readable`\
    \ interface for the data source `BodyReader`.\n\nHere is how to implement a `stream.Readable`:\n\
    1. A `stream.Readable` has an internal queue, use the `push()` method to add data\
    \ to the queue, then the data is available for consumption.\n2. When should you\
    \ add data to the queue? You need to implement a `read()` callback, which is invoked\
    \ when the queue is empty and someone is consuming. This is essential for maintaining\
    \ backpressure.\n"
  trans: "\n\n与其他晦涩的 HTTP 特性不同，使用 `Transfer-Encoding` 进行压缩实际上更实用，因此更为优，但遗憾的是实现上却走向了反面。\n\
    \n`TE` 头部字段用于协商 `Transfer-Encoding`，总结下所示。\n\n表 1：HTTP 压缩协商。\n\n| 请求头 | 响应头 |\
    \ 广泛使用？ |\n| :--- | :--- | :--- |\n| `Range` | | 否 |\n| `Accept-Encoding` | `Content-Encoding`\
    \ | 是 |\n| `TE` | `Transfer-Encoding` | 支持（否） |\n\n## 12.2 使用管道进行数据处理\n\n### 数据处理与\
    \ IO\n我们将使用内置的 [`zlib[4]`](https://nodejs.org/api/zlib.html) 模块来压缩响应体。压缩数据有 2\
    \ 类 API，最简单的是输入作为单个 buffer 提供并将压缩后的数据作为单个 buffer 返回。如果输入很大，这种方法将不起作用，因为它可能无法放入内存。而且即使不考虑内存问题，延迟也会很糟糕。\n\
    \n```javascript\nzlib.gzip(buffer, callback);\n```\n\n第二类是*实时*产生输出，你首先初始化有状态的压缩对象，然后向压缩器提供输入，压缩器会同时产生输出。\n\
    \n```javascript\nconst obj = zlib.createGzip();\n// 从它读取并向它写入\n```\n\n压缩器具有背压（backpressure），因此如果使用得当，它不会撑爆内存。你必须同时排空输出以保持输入流动。\n\
    \n实时处理数据的方法是使用可以同时*读取*和*写入*的有状态处理器，这与我们处理 socket 的方式类似。\n\n[[4]https://nodejs.org/api/zlib.html](https://nodejs.org/api/zlib.html)\n\
    \n[报告错误 | 提问问题](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)\n\
    \n99\n2024-02-02\n\n## 12. 压缩与流 API\n\n### 用于组合数据处理器的 Unix 管道\n拥有多个数据处理步骤是常见的，而\
    \ Unix 管道是编程和组合这些步骤的一种*高层*方式。一个具体的例子是：\n\n```bash\ntar -c -f - ./directory | gzip\
    \ | nc 1.2.3.4 1234\n```\n\n它通过 2 个管道连接 3 个步骤：\n1. `tar`，归档生产者。\n2. `gzip`，消耗归档并产生\
    \ gzip 数据。\n3. `nc`，消耗 gzip 数据并通过网络发送。\n\n管道自动将输出连接到输入，而无需用户编写代码在步骤之间移动数据。\n\n\
    ### 抽象管道\n我们可以在 HTTP 服务器中使用一种类似管道的抽象：\n\n`produce-response | gzip-compress | chunk-encode\
    \ | write-to-socket`\n\n这种模式有如下：\n- 无需显式读取和写入数据；编写的代码更少！\n- 背压是自动的（如果每个处理器都实现得当）。\n\
    - 正如我们所看到的，它不容易出错。\n\n## 12.3 探索 Node.JS 中的流 API\n\n### 流接口列表\nNode.JS 中确实存在管道，你可以通过\
    \ [Stream API[5]](https://nodejs.org/api/stream.html)[](#index_split_001.html#p105)\
    \ 管道化内容\n\n```javascript\nimport * as stream from \"stream\";\n```\n\n它定义了一组你可以实现的接口。\n\
    \n[[5]https://nodejs.org/api/stream.html](https://nodejs.org/api/stream.html)\n\
    \n[报告错误 | 提问问题](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)\n\
    \n100\n2024-02-02\n\n| 名称 | 说明 | 示例 |\n| :--- | :--- | :--- |\n| `Readable` |\
    \ 从此消耗输出。 | `fs.createReadStream()` |\n| `Writable` | 向此处提供输入。 | `fs.createWriteStream()`\
    \ |\n| `Duplex` | Readable + Writable。 | `net.Socket` |\n| `Transform` | 扩展 Duplex。\
    \ | `zlib.createGzip()` |\n\n`Readable` 和 `Writable` 是 2 个基础抽象。`Duplex` 和 `Transform`\
    \ 都是 `Readable` 和 `Writable` 的组合，它们之间的区别对我们目前并不重要。\n\n一些内置的 Node.JS 模块已经实现了它们，如表所示。\n\
    \n### 在流接口上使用管道\n我们探索这些抽象的目标是在它们上使用管道。\n\n```javascript\nimport { pipeline } from\
    \ \"stream/promises\";\n```\n\n`pipeline()` 函数将一个 `stream.Readable` 连接到 `stream.Writable`。在创建管道后，数据会自动从生产者流向消费者，并且存在背压，就像在\
    \ Unix 管道中一样。这个函数以 Unix 管道命名，不要将其与请求管道化（request pipelining）混淆。\n\n```typescript\n\
    function pipeline(src: stream.Readable, dst: stream.Writable): Promise<void>;\n\
    ```\n\n你还可以在源和目的地之间放置一个或多个 `stream.Duplex`。\n\n```typescript\nfunction pipeline(\n\
    \  src: stream.Readable,\n  transform1: stream.Duplex,\n  transform2: stream.Duplex,\n\
    \  // 更多 ...\n  dst: stream.Writable,\n): Promise<void>;\n```\n\n## 12.4 实现 HTTP\
    \ 压缩\n`zlib` 模块为压缩对象实现了 `stream.Duplex`。这是一个学习如何 Node.JS Stream API 的绝佳机会。\n\n\
    [报告错误 | 提问问题](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)\n\
    \n101\n2024-02-02\n\n### 步骤 1：检查头部字段并启用压缩\n根据头部字段操作。我们将在客户端请求时实现压缩。\n\n```typescript\n\
    function enableCompression(req: HTTPReq, res: HTTPRes): void {\n  const codecs:\
    \ string[] = req.headers['accept-encoding'];\n  if (!codecs.includes('gzip'))\
    \ {\n    return;\n  }\n  // 转换响应\n  res.headers['content-encoding'] = 'gzip';\n\
    \  res.body = gzipFilter(res);\n}\n```\n\n### 步骤 2：理解没有管道时的注意事项\n如果不使用 `pipeline()`\
    \ 函数，你可能会这样构思方案：\n\n```typescript\nfunction gzipFilter(reader: BodyReader): BodyReader\
    \ {\n  const gz: stream.Duplex = zlib.createGzip();\n  return {\n    length: -1,\n\
    \    read: async (): Promise<Buffer> => {\n      const data = await reader.read();\n\
    \      await gz.write(data);\n      // 背压导致死锁！\n      return await gz.read();\n\
    \    },\n  };\n}\n```\n\n遗憾的是，这种伪代码由于两个原因不起工作：\n1. 压缩器实现了背压，这意味着如果你写入大量输入，代码将阻塞直到输入被处理并*排空*。但在上面的伪代码中，数据是在写入完成后才被排空的，这是一种死锁情况！（我们在“管道化请求”部分讨论过类似的死锁。）\n\
    2. 大多数数据压缩方法本质上需要缓存；1 次输入不会产生 1 个压缩输出。在没有足够数据的情况下，压缩器不会产生输出，因为它还没有决定如何压缩数据。从压缩器读取将阻塞在等待更多数据！\n\
    \n在 Unix 管道中，读取和写入发生在不同的进程中，管道是*同时*填充和排空的，因此不会出现上述方案中的死锁。这就是为什么我提到管道抽象的使用不容易出错。\n\
    \n### 步骤 3：实现 `stream.Readable`\n我们回到了正轨。在使用 `pipeline()` 函数之前，我们必须为数据源 `BodyReader`\
    \ 实现 `stream.Readable` 接口。\n\n以下是实现 `stream.Readable` 的方法：\n1. `stream.Readable`\
    \ 有一个内部队列，使用 `push()` 方法将数据添加到队列，然后数据即可消费。\n2. 你应该何时向队列添加数据？你需要实现一个 `read()` 回调，该回调会在队列为空且有人在消费时被调用。这对于维护背压至关重要。\n\
    \n"
