- raw: 'The ''connection'' argument is called an *event*, which is something you can
    register callbacks on. There are other events on a listening socket. For example,
    there is the ''error'' event, which is invoked when an error occurs.


    server.on(''error'', (err: Error) => { throw err; });


    Here we simply throw the exception and terminate the program. You can test this
    by running 2 servers on the same address and port, the second server will fail.


    As this book is not a manual, we will not list everything here. Read the [Node.js
    documenta-](https://nodejs.org/api/net.html#class-netserver)


    [tion\[1\]](https://nodejs.org/api/net.html#class-netserver) to find out other
    potentially useful events.


    **Step 4: Read and Write**


    Data received from the connection is also delivered via callbacks. The relevant
    events for reading from a socket are the ''data'' event and the ''end'' event.
    The ''data'' event is invoked whenever data arrives from the peer, and the ''end''
    event is invoked when the peer has ended the transmission.


    socket.on(''end'', () => {


    // FIN received. The connection will be closed automatically.


    console.log(''EOF.'');


    });


    socket.on(''data'', (data: Buffer) => {


    console.log(''data:'', data);


    socket.write(data); // echo back the data.


    });


    The socket.write() method sends data back to the peer.


    **Step 5: Close The Connection**


    The socket.end() method ends the transmission and closes the socket. Here we call
    socket.end() when the data contains the letter “q” so we can easily test this
    scenario.


    [\[1\]https://nodejs.org/api/net.html#class-netserver](https://nodejs.org/api/net.html#class-netserver)


    [Report an Error | Ask a Question](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)


    13


    2024-02-02


    03\. Code A TCP Server


    socket.on(''data'', (data: Buffer) => {


    console.log(''data:'', data);


    socket.write(data); // echo back the data.


    // actively closed the connection if the data contains ''q''


    if (data.includes(''q'')) {


    console.log(''closing.'');


    socket.end();


    // this will send FIN and close the connection.


    }


    });


    When the transmission is ended from either side, the socket is automatically closed
    by the runtime. There is also the ''error'' event on net.Socket that reports IO
    errors. This event also causes the runtime to close the socket.


    **Step 6: Test It**


    Here is the complete code for our echo server.


    import \* as net from "net";


    function newConn(socket: net.Socket): void {


    console.log(''new connection'', socket.remoteAddress, socket.remotePort); socket.on(''end'',
    () => {


    // FIN received. The connection will be closed automatically.


    console.log(''EOF.'');


    });


    socket.on(''data'', (data: Buffer) => {


    console.log(''data:'', data);


    socket.write(data); // echo back the data.


    // actively closed the connection if the data contains ''q''


    if (data.includes(''q'')) {


    console.log(''closing.'');


    socket.end();


    // this will send FIN and close the connection.


    }


    });


    }


    [Report an Error | Ask a Question](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)


    14


    2024-02-02


    03\. Code A TCP Server


    let server = net.createServer();


    server.on(''error'', (err: Error) => { throw err; });


    server.on(''connection'', newConn);


    server.listen({host: ''127.0.0.1'', port: 1234});


    Start the echo server by running node --enable-source-maps echo\_server.js. And
    test it with the nc or socat command.


    **3.4 Discussion: Half-Open Connections**


    Each direction of a TCP connection is ended independently, and it is possible
    to make use of the state where one direction is closed and the other is still
    open; this unidirectional use of TCP is called TCP half-open. For example, if
    peer A half-closes the connection to peer B:


    • A cannot send any more data, but can still receive from B.


    • B gets EOF, but can still send to A.


    Not many applications make use of this. Most applications treat EOF the same way
    as being fully closed by the peer, and will also close the socket immediately.


    The socket primitive for this is called [*shudown*\[2\]](https://man7.org/linux/man-pages/man2/shutdown.2.html)[.](#index_split_000.html#p20)
    Sockets in Node.js do not support half-open by default, and are automatically
    closed when either side sends or receives EOF. To support TCP half-open, an additional
    flag is required.


    let server = net.createServer({allowHalfOpen: true});


    When the allowHalfOpen flag is enabled, you are responsible for closing the connection,
    because socket.end() will no longer close the connection, but will only send EOF.
    Use socket.destroy() to close the socket manually.


    **3.5 Discussion: The Event Loop & Concurrency**


    **JS Code Runs Within the Event Loop**


    As you can see, callbacks are needed to do anything in our echo server. This is
    how an *event* *loop* works. It’s a mechanism of the Node.js runtime that is invisible
    to the programmer.


    The runtime does something like this:


    [\[2\]https://man7.org/linux/man-pages/man2/shutdown.2.html](https://man7.org/linux/man-pages/man2/shutdown.2.html)


    [Report an Error | Ask a Question](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)


    15


    2024-02-02


    03\. Code A TCP Server


    // pseudo code!


    while (running) {


    let events = wait\_for\_events(); // blocking


    for (let e of events) {


    do\_something(e);


    // may invoke callbacks


    }


    }


    The runtime polls for IO events from the OS, such as a new connection arriving,
    a socket becoming ready to read, or a timer expiring. Then the runtime reacts
    to the events and invokes the callbacks that the programmer registered earlier.
    This process repeats after all events have been handled, thus it’s called the
    *event loop*.


    **JS Code and Runtime Share a Single OS Thread**


    The event loop is *single-threaded*; execution is either on the runtime code or
    on the JS code (callbacks or the main program). This works because when a callback
    returns, or awaits, control is back to the runtime, so the runtime can emit events
    and schedule other tasks.


    This implies that **any JS code is expected to finish in a short time** because
    the event loop is halted when executing JS code.


    **Concurrency in Node.JS is Event-Based**


    To help you understand the implication of the event loop, let’s now consider *concurrency*.


    A server can have multiple connections simultaneously, and each connection can
    emit events.


    While an event handler is running, the single-threaded runtime cannot do anything
    for the other connections until the handler returns. The longer you process an
    event, the longer everything else is delayed.


    **3.6 Discussion: Asynchronous vs. Synchronous**


    **Blocking & Non-Blocking IO**


    It’s vital to avoid staying in the event loop for too long. One way to cause such
    trouble is to run CPU-intensive code. This can be solved by …


    • Voluntarily yield to the runtime.


    • Moving the CPU-intensive code out of the event loop via multi-threading or multi-processing.


    [Report an Error | Ask a Question](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)


    16


    2024-02-02


    03\. Code A TCP Server


    These topics are beyond the scope of this book, and our primary concern is IO.


    The OS provides both blocking mode and non-blocking mode for network IO.


    • In blocking mode, the calling OS thread blocks until the result is ready.


    • In non-blocking mode, the OS immediately returns if the result is not ready
    (or is ready), and there is a way to be notified of readiness (for event loops).


    The Node.JS runtime uses non-blocking mode because blocking mode is incompatible
    with event-based concurrency. The only blocking operation in an event loop is
    polling the OS for more events when there is nothing to do.


    **IO in Node.js is Asynchronous**


    Most Node.js library functions related to IO are either callback-based or promise-based.'
