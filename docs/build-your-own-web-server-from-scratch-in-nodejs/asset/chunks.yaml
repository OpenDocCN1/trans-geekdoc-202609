  trans: "\n从历史上看，万维网（WWW）主要由带有超链接的静态网页组成，`HTTP` 最初也是为此设计的。随后出现了提供动态内容的 Web 应用，这正是本章将考虑的内容。\n\
    \n## 8.1 分块传输编码 (Chunked Transfer Encoding)\n\n为了提供动态内容，我们需要实现上一章中缺失的分块编码。因为当我们即时生成网页时，无法预先知道输出的长度。\n\
    \n### 分块消息格式\n\n让我们从规范 `RFC 9112` 开始看。\n\n```\nchunked-body\n= \\*chunk\nlast-chunk\n\
    trailer-section\nCRLF\nchunk\n= chunk-size \\[ chunk-ext \\] CRLF\nchunk-data\
    \ CRLF\nchunk-size\n= 1\\*HEXDIG\nlast-chunk\n= 1\\*(\"0\") \\[ chunk-ext \\]\
    \ CRLF\nchunk-data\n= 1\\*OCTET ; a sequence of chunk-size octets\n```\n\n添加一个示例作为参考：\n\
    \n```\n4\\r\\nHTTP\\r\\n5\\r\\nserver\\r\\n0\\r\\n\\r\\n\n```\n\n通过这个示例可以看出，格式非常直观。\n\
    \n- 每个分块以一个十六进制数字开头并以 `CRLF` 结束；这是分块数据的长度。\n- 随后的分块数据也以 `CRLF` 结束；这个 `CRLF` 除了让协议具有人类可读性外没有作用。\n\
    - 零长度的分块标记着 `HTTP` 体的结束。我们经常看到这种约定！\n\n## 0. 动态内容与流式传输\n\n### 冷门的 HTTP 特性\n\n\
    在 BNF 规范中仍有一些未触及的结构——`chunk-size` 行上可选的 `chunk-ext` 以及末尾的 `trailer-section`。这些是设计进规范的某些冷门特性，但在实践中并不常用。\n\
    \n`chunk-ext` 设计用于通过添加额外的键值对来扩展分块格式，但在实践中并没有这种扩展。\n\n`trailer-section` 设计用于在 `HTTP`\
    \ 体之后放置一些头部字段。你可能会奇怪为什么有人这样做，这是为了某些罕见的用例。有些人喜欢在 `HTTP` 头部字段中放置特定于应用程序的内容，例如数据的校验和。问题是，在流式传输数据时，校验和只有在数据传输完成后才能已知，因此设计了一种机制在最后一个分块之后附加一些头部字段。\n\
    \n许多 `HTTP` 服务器或客户端实现简单忽略了这些冷门特性，因为它们几乎没有用途或价值。另一方面，设计你的应用程序去使用任何冷门特性是不明智的，即使它们有\
    \ `RFC` 支持，因为你更有可能在客户端和中间件上遇到问题。我们在实现中也将忽略这些。\n\n## 8.2 生成分块响应\n\n第一步是在 `writeHTTPResp()`\
    \ 函数中添加分块编码，该函数从 `BodyReader` 接口中提取响应体。\n\n```typescript\n// 一个用于从/向 HTTP 体读取/写入数据的接口。\n\
    type BodyReader = {\n  // \"Content-Length\"，如果未知则为 -1。\n  length: number,\n \
    \ // 读取数据。EOF 后返回一个空缓冲区。\n  read: () => Promise<Buffer>,\n};\n```\n\n上一章的接口设计时已经考虑了分块编码。我们需要实现的是长度为\
    \ `-1`（未知）的情况。\n\n```typescript\n// 通过套接字发送 HTTP 响应\nasync function writeHTTPResp(conn:\
    \ TCPConn, resp: HTTPRes): Promise<void> {\n  // 设置 \"Content-Length\" 或 \"Transfer-Encoding\"\
    \ 字段\n  if (resp.body.length < 0) {\n    resp.headers.push(Buffer.from('Transfer-Encoding:\
    \ chunked'));\n  } else {\n    resp.headers.push(Buffer.from(`Content-Length:\
    \ ${resp.body.length}`));\n  }\n  // 写入头部\n  await soWrite(conn, encodeHTTPResp(resp));\n\
    \n  // 写入体\n  const crlf = Buffer.from('\\r\\n');\n  for (let last = false; !last;\
    \ ) {\n    let data = await resp.body.read();\n    last = (data.length === 0);\
    \ // 结束了？\n    if (resp.body.length < 0) { // 分块编码\n      data = Buffer.concat([\n\
    \        Buffer.from(data.length.toString(16)), crlf,\n        data, crlf,\n \
    \     ]);\n    }\n    if (data.length) {\n      await soWrite(conn, data);\n \
    \   }\n  }\n}\n```\n\n注意，分块消息是在我们通过单个写入发送到套接字之前，使用 `Buffer.concat()` 创建的。这遵循了上一章关于缓冲\
    \ I/O 的建议。\n\n## 8.3 JS 生成器\n\n下一步是将生成响应体的应用程序代码（生产者）连接到 `BodyReader` 接口（队列），而\
    \ `writeHTTPResp()` 函数（消费者）从中从中提取数据。\n\n```typescript\n// 伪代码！\nasync function\
    \ produce_response() {\n  // ...\n  await output(data1);\n  // 从 BodyReader 读取\n\
    \  // ...\n  await output(data2);\n  // 从 BodyReader 读取\n  // ...\n}\n```\n\n\
    ### 生产者、消费者与队列\n\n使用队列并非易事，因为我们将会对此进行探讨。\n\n### 作为生产者的 JS 生成器\n\nJavaScript 生成器非常适合生产者-消费者模型。下面是一个生成器示例。\n\
    \n```typescript\ntype BufferGenerator = AsyncGenerator<Buffer, void, void>;\n\n\
    // 函数后的星号是 JS 生成器的语法\nasync function *countSheep(): BufferGenerator {\n  for (let\
    \ i = 0; i < 100; i++) {\n    // 等待 1s，然后输出计数器\n    await new Promise((resolve)\
    \ => setTimeout(resolve, 1000));\n    yield Buffer.from(`${i}\\n`);\n  }\n}\n\
    ```\n\n### 从 JS 生成器读取\n\n为响应生成器添加一个新的 URI 处理器。`readerFromGenerator()` 函数将 JS 生成器转换为\
    \ `BodyReader`。\n\n```typescript\nfunction readerFromGenerator(gen: BufferGenerator):\
    \ BodyReader {\n  return {\n    length: -1,\n    read: async (): Promise<Buffer>\
    \ => {\n      const r = await gen.next();\n      if (r.done) {\n        return\
    \ Buffer.from(''); // EOF\n      } else {\n        console.assert(r.value.length\
    \ > 0);\n        return r.value;\n      }\n    },\n  };\n}\n```\n\n要从生成器提取数据，使用\
    \ `next()` 方法。当生成器 yield 或 return 时，`next()` 方法返回，通过 `done` 标志进行区分，数据可以从 `value`\
    \ 成员获取。\n\n```typescript\ncase '/sheep':\n  resp = readerFromGenerator(countSheep());\n\
    \  break;\n```\n\n`next()` 方法可以接受一个可选参数，该参数将作为 `yield` 语句的结果传递给生产者，这意味着 JS 生成器是双向的。虽然我们现在不需要这种功能。\n\
    \n使用 `curl` 测试 `/sheep` URI，你应该能看到每 1s 输出一次计数器，这意味着分块编码正在正常工作。使用分块编码时，总体长度没有限制，你甚至可以生成无限字节流。\n\
    \n## 8.4 读取分块请求\n\n分块编码主要用于响应而不是请求。网络浏览器总是知道上传的长度，除非客户端 JS 使用了实验性的 Streams API。\n\
    \n"
