    **Alternative: Add a Buffered Wrapper**


    Alternatively, you can leave the TCPConn as is, and add a separate wrapper type
    like this: type BufferedWriter = {


    write: (data: Buffer) => Promise<void>,


    flush: () => Promise<void>,


