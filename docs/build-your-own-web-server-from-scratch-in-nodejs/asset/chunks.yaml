    04\. Promises and Events


    runtime can poll for events and invoke callbacks, that’s the event loop we talked
    about earlier!


    **àsync\` Functions Yield to the Runtime by àwait\`**


    Initially, the Promise type is just a way to manage callbacks. It allows chaining
    multiple callbacks without too many nested functions. However, we will not bother
    with this use of promises because of the addition of async functions.


    Unlike normal functions, async functions can return to the runtime in the middle
    of execution; this happens when you use the await statement on a promise. And
    when the promise is settled, execution of the async function *resumes* with the
    result of the promise.


    This is a superior coding experience because you can write *sequential* IO code
    in the *same* function without being interrupted by callbacks.


    **Calling àsync\` Functions Start New Tasks**


    Invoking an async function results in a promise that settles itself when the async
    function returns or throws. You can await on it like a normal promise, but if
    you don’t, the async function will still be scheduled by the runtime. This is
    similar to starting a thread in multi-threaded programming. But all JS code shares
    a single OS thread, so a better word to use is *task*.


    A list of ways to start tasks in different environments:


    • In JS, you start background tasks by not waiting for promises.


    • In Go, you use the go statement.


    • In Python, async/await is similar to JS, except that you have to run an event
    loop yourself, as it’s not a language built-in.


    • In environments without an event loop, you can start OS threads instead of user-level
    tasks.


    **4.3 From Events To Promises**


    The net module doesn’t provide a promise-based API, so we have to implement the
    hypothetical API from the last chapter.


    function soRead(conn: TCPConn): Promise<Buffer>;


    function soWrite(conn: TCPConn, data: Buffer): Promise<void>;


