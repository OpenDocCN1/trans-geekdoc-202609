    2024-02-02


    11\. HTTP Caching


    **Non-Client Caching**


    So far, we have assumed that caching is done by a user-facing client, such as
    a browser. In practice, a cache can also be provided by:


    • By the server application. This is especially useful for dynamically generated
    content.


    The app stores the generated content for itself to reuse. The goal is to save
    the latency and/or the cost of content generation. The ETag scheme can also be
    easily used to aid client-side caching, since the app controls the content.


    • By a transparent proxy or middleware. The proxy acts as a client of the origin
    server, serving requests on behalf of the real client. It may cache responses
    just like other clients. This form of proxy can be deployed by the service developer,
    by the CDN, or by the ISP (before HTTPS was common).


    **Shared and Private Caches**


    A problem with the caching proxy is that the response may be personalized, how
    does a caching proxy know which content is for which user?


    This problem does not exist for a browser because it represents a single user.
    For caches shared by multiple users, there are directives to explicitly mark the
    response as either public or private. The private directive is for personalized
    content that should not be cached by proxies.


    Cache-Control: private


    There are additional rules for determining whether to cache or not. For example,
    the Authorization header field normally prevents a proxy from caching the response.
    But the public directive can override this rule and make the content cacheable.


    **Caching in the Cloud**


    The RFC only defines the intended caching behavior in a very loose sense. For
    developing or understanding real-world projects, you should rely on the software/service
    manual instead.


    There are many cloud providers that offer a CDN or caching service, some even
    offer additional caching controls. Read their documentation to understand how
    things work in *practice*. Some examples:


    • [Cloudflare\[3\]](https://developers.cloudflare.com/cache/concepts/cache-control/)


    • [AWS CloudFront\[4\]](https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Expiration.html)


    [\[3\]https://developers.cloudflare.com/cache/concepts/cache-control/](https://developers.cloudflare.com/cache/concepts/cache-control/)


    [\[4\]https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Expiration.html](https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Expiration.html)


    [Report an Error | Ask a Question](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)


