    36


    2024-02-02


    05\. A Simple Network Protocol


    **Deadlock by Pipelining**


    A caveat about pipelining requests: pipelining too many requests can lead to deadlocks;
    because both the server and the client can be sending at the same time, and if
    both their send buffers are full, it’s deadlocked as they are both stuck at sending
    and cannot drain the buffer.


    **5.5 Discussion: Smarter Buffers**


    **Removing Data from the Front**


    There is still O(n2) behavior in our buffer code; whenever we removed a message
    from the buffer, we moved the remaining data to the front. This can be triggered
    by pipelining many small messages.


    To fix this, the data movement has to be amortized. This can be done by deferring
    the data movement. We can keep the remaining data temporarily in place until the
    wasted space in the front reaches a threshold (such as 1/2 capacity).


    This fix requires us to keep track of the beginning of the data, so you’ll need
    a new method for retrieving the real data. The code is left as an exercise to
    you.


    **Using Fixed Sized Buffer without Reallocations**


    Sometimes it’s possible to use a large enough buffer without resizing if the message
    size in the protocol is limited to a reasonably small value.


    For example, many HTTP implementations have a small limit on header size as there
    is no legitimate use case for putting lots of data in the header. For these implementations,
    one buffer allocation per connection is enough, and the buffer is also sufficient
    for reading the payload if it doesn’t need to store the entire payload in memory.


    The advantages of this are:


    • No dynamic memory management (except for the initial buffer).


    • Memory usage is easy to predict.


    This is not very relevant for Node.JS apps, but these advantages are desirable
    in environments with manual memory management or constrained hardware.


