  trans: "\n\n## 5.6 结论：网络编程基础\n\n到目前为止我们学到的总结：\n\n- `socket` API：`listen`、`accept`、`read`、`write`\
    \ 等。\n- 事件循环及其影响。\n- 回调（Callback）对比 `Promise`。使用 `async` 和 `await`。\n- 背压（Backpressure）、队列和缓冲区。\n\
    - TCP 字节流、协议解析器、流水线消息。\n\n[报告错误 | 提问](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)\n\
    \n# 第 06 章\n## HTTP 语义与语法\n\nHTTP 非常具有人类可读性，这意味着你可以通过查看示例而不是规范来构建服务器。然而，这种方法会导致产生\
    \ Bug 的“玩具代码”，而且你并学不到什么东西。因此，你需要查阅规范——一系列 `RFC` 文档。\n\n## 6.1 高级结构\n\n让我们回顾一下你在介绍性章节中已经掌握的内容：\n\
    \n- 一个 HTTP 请求消息包含：\n    - 方法（Method），是一个如 `GET`、`POST` 的动词。\n    - `URI`。\n \
    \   - 头部字段（Header fields）列表，一组键值对。\n    - 负载体（Payload body），紧跟请求头之后。特殊情况：`GET`\
    \ 和 `HEAD` 没有负载。\n- 一个 HTTP 响应包含：\n    - 状态码（Status code），主要用于指示请求是否成功。\n    -\
    \ 头部字段列表。\n    - 可的负载体。\n\n这些内容从 `HTTP/1.0` 到 `HTTP/3` 大多数是相同的。\n\n```\nHTTP/1.0\
    \ 200 OK\nAge: 525410\nCache-Control: max-age=604800\nContent-Type: text/html;\
    \ charset=UTF-8\nDate: Thu, 20 Oct 2020 11:11:11 GMT\nEtag: \"1234567890+gzip+ident\"\
    \nLast-Modified: Thu, 20 Oct 2019 11:11:11 GMT\nVary: Accept-Encoding\nContent-Length:\
    \ 1256\nConnection: close\n\n<!doctype html>\n<!-- omitted -->\n```\n\n## 6.2\
    \ Content-Length\n\nHTTP 语义大多关于头部字段的解释，这在 [RFC](https://www.rfc-editor.org/rfc/rfc9110.html)\
    \ [9110](https://www.rfc-editor.org/rfc/rfc9110.html) 中描述。尝试自己读读它。\n\n最重要的头部字段是\
    \ `Content-Length` 和 `Transfer-Encoding`，因为它们决定了 HTTP 消息的长度，这是协议最重要的功能。\n\n###\
    \ HTTP 头部长度\n\n请求和响应都包含两个部分：头部（header） + 实体（body）。它们由一个空行分隔。行以 `\\r\\n` 结束。因此，头部包括空行结束于\
    \ `\\r\\n\\r\\n`。这就是我们确定头部长度的方法。\n\n### HTTP 实体长度\n\n体的长度很复杂，因为有 3 种方法确定它。第一种方法是使用\
    \ `Content-Length`，它包含了体的长度。\n\n一些古旧的 `HTTP/1.0` 软件不使用 `Content-Length`，因此体就是连接剩余的数据，解析器读取\
    \ `socket` 直到 `EOF`，这就是体。这是确定体长度的第二种方法。这种方法有问题，因为你无法判断连接是否提前结束。\n\n## 6.3 分块传输编码\
    \ (Chunked Transfer Encoding)\n\n### 动态生成并发送数据\n\n第三种方法是使用 `Transfer-Encoding:\
    \ chunked` 代替 `Content-Length`。这被称为*分块传输编码*。它允许服务器在生成响应时发送负载，而无需提前知道大小。这种用例被称为\
    \ *流式传输（streaming）*。\n\n### 协议的另一层\n\n分块编码是如何工作的？作为接收方，我们不知道总负载长度，但我们知道负载的部分。特殊的块标记了结束。这里有一个具体的例子：\n\
    \n```\n4\\r\\nHTTP\\r\\n\n5\\r\\n0\\r\\n\n```\n\n它被解析为 3 块：\n- `4\\r\\nHTTP\\\
    r\\n`\n- `5\\r\\n`\n- `0\\r\\n`\n\n## 6.4 歧义\n\n### 理想情况\n\n总结来说，`HTTP` 允许：\n\
    1. 存在 `Transfer-Encoding: chunked`。\n2. `Content-Length: number`有效。\n3. 如果两者都不存在，使用连接剩余部分。\n\
    \n### 糟糕情况\n\n读者的练习：如果你正在设计一种新协议，如何避免这种情况？\n\n## 6.5 HTTP 消息格式\n\n[RFC 9112](https://www.rfc-editor.org/rfc/rfc9112.html)\
    \ 描述了比特如何在网络上传输。\n\n### 阅读 BNF 语言\n\nHTTP 消息格式用名为 *BNF* 的语言描述。前往 RFC 9112 的“2.\
    \ Message”章节，你会看到这样的内容：\n\n```\nHTTP-message\n= start-line CRLF\n*( field-line\
    \ CRLF )\nCRLF\n[ message-body ]\n\nstart-line\n= request-line / status-line\n\
    ```\n\n这表示：HTTP 消息可以是请求消息或响应消息。消息以请求行或状态行开始，随后是多个头部字段，然后是空行，最后是可选的负载体。行与 `CRLF`\
