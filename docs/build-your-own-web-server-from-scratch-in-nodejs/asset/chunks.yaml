    06\. HTTP Semantics and Syntax


    **Text is More Work & Error-Prone**


    Another downside is that dealing with text is a lot more work. To properly handle
    text strings, you need to know their length first, which is often determined by
    delimiters. The extra work of looking for delimiters is the cost of human-readable
    formats.


    It’s also error-prone; in C programming, null-terminated strings (0-delimited)
    have caused many security exploits.


    HTTP/2 is binary and more complex than HTTP/1.1, but parsing the protocol is still
    easier because you don’t have to deal with elements of unknown length.


    **6.9 Discussion: Delimiters**


    **Serialization Errors in Delimited Data**


    Delimiters are everywhere in textual protocols. For example, in HTTP …


    • Lines in the header are delimited by CRLF


    • The header and body are delimited by an empty line.


    One problem with delimiters is that the data cannot contain the delimiter itself.
    Failure to enforce this rule can lead to some injection exploits.


    If a malicious client can trick a buggy server into emitting an header field value
    with CRLF


    in it, and the header field is the last field, then the payload body starts with
    the part of the field value that the attacker controls. This is called [“HTTP
    response splitting\[7\]](https://en.wikipedia.org/wiki/HTTP_response_splitting)[”.](#index_split_000.html#p52)


    A proper HTTP server/client must forbid CRLF in header fields as there is no way
    to encode them. However, this is not true for many generic data formats. For example,
    JSON uses


    {}\[\],: to delimit elements, but a JSON string can contain arbitrary characters,
    so strings are *quoted* to avoid ambiguity with delimiters. But the quotes themselves
    are also delimiters, so *escape sequences* are needed to encode quotes.


    This is why you need a JSON library to produce JSON instead of concatenating strings
    together. And HTTP is less well defined and more complicated than JSON, so pay
    attention to the specifications.


    [\[7\]https://en.wikipedia.org/wiki/HTTP\_response\_splitting](https://en.wikipedia.org/wiki/HTTP_response_splitting)


