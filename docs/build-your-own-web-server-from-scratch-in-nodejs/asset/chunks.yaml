    06\. HTTP Semantics and Syntax


    **CRUD and Resources**


    You may have wondered why there are so many HTTP methods. Wouldn’t just GET and
    POST suffice? In fact, that’s what many applications do. More methods were added
    to HTTP


    because people imagined HTTP as a protocol for managing “resources”. For example,
    a forum user can manipulate his posts as resources:


    • **Create** a post via PUT.


    • **Read** a post via GET.


    • **Update** a post via PATCH.


    • **Delete** a post via DELETE.


    These 4 verbs are often referred to as **CRUD**.


    **Idempotence**


    But why add CRUD as HTTP methods? A forum user may also move a post to another
    forum, should HTTP also include a MOVE method? Mirroring arbitrary English verbs
    is not a good reason to define HTTP methods. One of the better reasons is to define
    the *idempotence* of operations.


    An idempotent operation is one that can be repeated with the same effect. This
    means that you can safely *retry* the operation until it succeeds. For example,
    if you rm a file over SSH


    and the connection breaks before you see the result, so the state of the file
    is unknown to you, but you can always blindly rm it again (if it’s really the
    same file):


    • If you were to fail, you’ll probably fail again.


    • If the previous rm failed but this one succeeds, your intention is just fulfilled.


    • If the previous rm succeeded, there is no harm in doing it again.


    An idempotent operation over HTTP can still result in a different status code,
    just like the return code of rm.


    Idempotence in HTTP:


    • Read-only methods (GET and HEAD) are obviously idempotent.


    • PUT and DELETE are idempotent, as are overwriting and deleting files.


    • POST and PATCH are NOT defined as idempotent. They may or may not be.


    Idempotence in browsers:


    • If you submit a <form> via POST and then refresh the page, the browser will
    warn you against resubmitting the potentially non-idempotent form.


    • HTML forms are [limited to GET and POST\[6\]](https://softwareengineering.stackexchange.com/a/211790)[.](#index_split_000.html#p50)
    You need AJAX to use these idempotent methods.


