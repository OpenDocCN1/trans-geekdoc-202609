    \ WebSocket.\n2. To prevent non-WebSocket clients from creating WebSockets by\
    \ forbidding `Sec-WebSocket-Key` fields.\n3. To prevent proxies from caching data\
    \ using random values.\n\nYou may find these points confusing when you think about\
    \ it because these points are weak:\n\n1. The server already proved itself with\
    \ 101 status code.\n2. If a non-WebSocket client wants to prevent users from creating\
    \ WebSockets, it will likely forbid the `Upgrade` field instead.\n3. Proxies are\
    \ unlikely to cache the 101 status code.\n\nThe hash is computed by the following\
    \ function:\n\n```javascript\nfunction wsKeyAccept(key: Buffer) {\n  return crypto.createHash('sha1')\n\
    \    .update(key)\n    .update(\"258EAFA5-E914-47DA-95CA\").digest().toString('base64');\n\
    }\n```\n\n### Connection Header Field\n\nThe `Connection: Upgrade` header field\
    \ is used to instruct non-transparent proxies to consume and remove the `Upgrade`\
    \ field so that a non-transparent proxy will not forward handshakes unless it\
    \ understands the protocol. This is one of the [hop-by-hop[2](https://datatracker.ietf.org/doc/html/rfc9110#field.connection)](https://datatracker.ietf.org/doc/html/rfc9110#field.connection)\
    \ header fields. We do not care about this since we’re the server.\n\n[Report\
    \ an Error | Ask a Question](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)\n\
    \n110\n\n2024-02\n\n## 13.2 WebSocket Protocol\n\n### Frame Format\n\nThe rest\
    \ of the connection after the handshake consists of a series of frames.\n\n| byte0\
    \ | byte1 | byte2 | byte3 |\n| :--- | :--- | :--- | :--- |\n| 0 1 2 3 4 5 6 7\
    \ | 0 1 2 3 4 5 6 7 | 0 1 2 3 4 5 6 7 | 0 1 2 3 4 5 6 7 |\n| F | R | R | opcode\
    \ | M | Payload len | Extended payload length |\n| I | S | S | S | (4) | (7) |\
    \ (16/64) |\n| N | V | V | V | S | (if payload len==126/127) | |\n| | | | | |\
    \ 1 2 3 K |\n\nExtended payload length continued, if payload len == 127\nMasking-key,\
    \ if MASK set to 1\nMasking-key (continued)\nPayload Data ...\n\nNote: The 0th\
    \ bit is the most significant bit (MSB) in a byte. The structure is header + payload\
    \ like HTTP. But unlike HTTP:\n\n- The format is binary, no delimiters are used.\n\
    - The payload length is trivially indicated in the header.\n\nHandling WebSocket\
    \ frames is much easier than handling HTTP:\n\n1. The first byte contains the\
    \ `FIN` flag and a 4-bit `opcode`.\n2. The `MASK` bit in the second byte indicates\
    \ the optional `masking-key`.\n3. The next field is the payload length, which\
    \ is encoded as a `variable-length` integer starting with a 7-bit integer in the\
    \ second byte.\n   - The length from 0 to 125 is stored in that 7-bit integer.\n\
    \   - 126 indicates a following 16-bit big-endian integer.\n   - 127 indicates\
    \ a following 64-bit big-endian integer.\n4. If the `MASK` bit is set, a 4-byte\
    \ random data mask follows. The 4-byte random data mask is XORed with the payload\
    \ data. The mask must be used for client-to-server frames, but not for the other\
    \ way around. The purpose of the XOR mask is to prevent a type of [cache poisoning\
    \ attack[3](http://www.adambarth.com/papers/2011/huang-chen-barth-rescorla-jackson.pdf](#index_split_001.html#p116)\n\
    \n[[3](http://www.adambarth.com/papers/2011/huang-chen-barth-rescorla-jackson.pdf)](http://www.adambarth.com/papers/2011/huang-chen-barth-rescorla-jackson.pdf)\n\
    \n[Report an Error | Ask a Question](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)\n\
    \n111\n\n2024-02\n\n### Types of Frames\n\nOpcodes for data message:\n\n- `0x01`:\
    \ A text data message. For applications.\n- `0x02`: A binary data message. For\
    \ applications.\n- `0x00`: Message fragmentation. Discussed later.\n\nThe distinction\
    \ between text and binary is up to the application.\n\nOpcodes for control messages:\n\
    \n- `0x08`: A control message for graceful termination. The optional payload contains\
    \ a status code and a string message.\n"
