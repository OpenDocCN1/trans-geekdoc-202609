- raw: 'Wherever there is asynchronous communication, there are queues or buffers
    that connect producers to consumers. Queues and buffers in our physical world
    are bounded in size and cannot hold an infinite amount of data. One problem with
    asynchronous communication is that **what happens when the producer is producing
    faster than the consumer is consuming**? There must be a mechanism to prevent
    the queue or buffer from overflowing. This mechanism is often called *backpressure*
    in network applications.


    **Backpressure in TCP: Flow Control**


    Backpressure in TCP is known as *flow control*.


    • The consumer’s TCP stack stores incoming data in a receive buffer for the application
    to consume.


    • The amount of data the producer’s TCP stack can send is bounded by a *window*
    known to the producer’s TCP stack, and it will *pause* sending data when the window
    is full.


    • The consumer’s TCP stack manages the window; when the app drains from the receive
    buffer, it *moves* the window forward and notifies the producer’s TCP stack to
    *resume* sending.


    The effect of flow control: TCP can pause and resume transmission so that the
    consumer’s receive buffer is bounded.


    flow ctrl


    bounded!


    |producer| ==> |send buf| ===========> |recv buf| ==> |consumer|


    app


    OS


    TCP


    OS


    app


    TCP flow control should not be confused with TCP congestion control, which also
    controls the window.


    **Backpressure Between Applications & OS**


    This nice mechanism needs to be implemented not only in TCP, but also in applications.


    Let’s focus on the producer side. The application produces data and submits it
    to the OS, the data goes to the send buffer, and the TCP stack consumes from the
    send buffer and transmits the data.


    write()


    may block!


    |producer| ========> |send buf| =====> ...


    app


    OS


    TCP


