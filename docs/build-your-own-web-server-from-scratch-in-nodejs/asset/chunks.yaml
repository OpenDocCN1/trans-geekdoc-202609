    - 如果不完整，返回 `null`。\n- 否则，它移除并返回该消息。\n\n### 步骤 2：拆分消息\n\n`cutMessage()` 函数使用分隔符\
    \ `\\n` 测试消息是否完整。\n\n```javascript\nfunction cutMessage(buf: DynBuf): null|Buffer\
    \ {\n  // 消息通过 '\\n' 分隔\n  const idx = buf.data.subarray(0, buf.length).indexOf('\\\
    n');\n  if (idx < 0) {\n    return null;\n    // 未完成\n  }\n  // 制作消息的副本并将剩余数据移动到头部\n\
    \  const msg = Buffer.from(buf.data.subarray(0, idx + 1));\n  bufPop(buf, idx\
    \ + 1);\n  return msg;\n}\n```\n\n然后它会创建消息数据的副本，因为数据将从缓冲区中移除。\n\n- `buf.subarray()`\
    \ 返回子数组的引用，而不进行复制。\n- `Buffer.from()` 通过从源复制数据创建一个新的缓冲区。\n\n通过将剩余数据移动到头部来移除消息。\n\
    \n```javascript\n// 从头部移除数据\nfunction bufPop(buf: DynBuf, len: number): void {\n\
    \  buf.data.copyWithin(0, len, buf.length);\n  buf.length -= len;\n}\n```\n\n\
    `buf.copyWithin(dst, src_start, src_end)` 在缓冲区内复制数据，源和目的地可以重叠，类似于 C 语言中的 `memmove()`。这种处理缓冲区的方式并不理想，稍后会详细讨论。\n\
    \n### 步骤 3：处理请求\n\n请求在服务器循环中被处理并发送响应。\n\n```javascript\nwhile (true) {\n  // 尝试从缓冲区获取\
    \ 1 条消息\n  const msg = cutMessage(buf);\n  if (!msg) {\n    // 省略 ...\n    continue;\n\
    \  }\n  // 处理消息并发送响应\n  if (msg.equals(Buffer.from('quit\\n'))) {\n    await soWrite(conn,\
    \ Buffer.from('Bye.\\n'));\n    socket.destroy();\n    return;\n  } else {\n \
    \   const reply = Buffer.concat([Buffer.from('Echo: '), msg]);\n    await soWrite(conn,\
    \ reply);\n  }\n} // 消息循环\n```\n\n我们的消息回显服务器现在完成了。使用 `socat` 命令对其进行测试。\n\n## 5.4\
    \ 讨论：流水线请求\n\n当从缓冲区中移除消息时，我们将剩余数据移动到了头部。\n\n你可能会奇怪，为什么缓冲区中还会剩下数据，因为在请求-响应场景中，客户端会在发送更多请求之前等待响应的。这是为了支持一种优化。\n\
    \n### 通过流水线请求减少延迟\n\n考虑一个典型的现代网页，……（文本根据提供的片段继续进行技术解构）。\n\n"
