  trans: "\n'connection' 参数被称为一个 `event`（事件），你可以在其上注册回调函数。监听套接字（socket）上还有其他事件。例如，有一个\
    \ 'error' 事件，当发生错误时，它会被触发。\n\n```javascript\nserver.on('error', (err: Error) =>\
    \ { throw err; });\n```\n\n在这里，我们简单地抛出异常并终止程序。你可以通过在同一个地址和端口上运行 2 个服务器来测试这一点，第二个服务器将会失败。\n\
    \n由于这本书不是一份手册，我们不会在此处列出所有内容。请阅读 [Node.js 文档-](https://nodejs.org/api/net.html#class-netserver)[1](https://nodejs.org/api/net.html#class-netserver)来查找其他可能有用的事件。\n\
    \n### 第 4 步：读取与写入\n\n从连接接收的数据也通过回调函数传递。从套接字读取数据的相关事件是 'data' 事件和 'end' 事件。每当数据从对方到达时，'data'\
    \ 事件就会被触发；当对方结束传输时，'end' 事件就会被触发。\n\n```javascript\nsocket.on('end', () => {\n\
    \  // 收到 FIN。连接将自动关闭。\n  console.log('EOF.');\n});\n\nsocket.on('data', (data:\
    \ Buffer) => {\n  console.log('data:', data);\n  socket.write(data); // 回显数据。\n\
