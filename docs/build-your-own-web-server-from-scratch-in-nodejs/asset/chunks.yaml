    **9.4 Discussion: Reusing Buffers**


    **Buffer Allocations Have Costs**


    The readerFromStaticFile() function allocates and returns a new buffer for each
    read. This is not very efficient because buffer allocations have costs:


    1\. The costs from the memory allocator. For many implementations, this cost is
    *constant* in most cases. In the best case, the allocator either returns an object
    from a free list or allocates from a large chunk.


    2\. The cost of initializing with zeros. Scales *linearly* with buffer size.


    **Using Uninitialized Buffers**


    Larger buffers are often desirable for potentially higher throughput due to the
    reduced number of syscalls. However, allocating oversized buffers has a linear
    initialization cost, which can be avoided by using *uninitialized* buffers in
    Node.JS.


