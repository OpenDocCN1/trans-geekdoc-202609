    ...


    An HTTP request or response consists of a *header* followed by an optional *payload*.
    The header contains the URL of the request, or the response code, followed by
    a list of *header* *fields*.


    **2.2 HTTP by Example**


    To get the hang of network protocols, let’s start by making an HTTP request from
    the command line.


    Run the netcat command:


    nc example.com 80


    The nc (netcat) command creates a TCP connection to the destination host and port,
    and then attaches the connection to stdin and stdout. We can now start typing
    in the terminal and the data will be transmitted:


    GET / HTTP/1.0


    Host: example.com


    (empty line)


