    **Mind the Lifetime When Reusing Buffers**


    Buffers can be allocated by either the producer or the consumer. In all cases
    we have seen, the producer allocates the buffer and returns it to whoever uses
    the data. This can be problematic because the buffer may still be referenced and
    used somewhere while the next read() is running.


    function readerFromStaticFile(fp: fs.FileHandle, size: number): BodyReader {


    const buf = Buffer.allocUnsafe(65536);


    // reused for each read


    return {


    length: size,


    read: async (): Promise<Buffer> => {


    const r = await fp.read({buffer: buf});


    // CAUTION: the lifetime of the buffer is unclear!


    return r.buffer.subarray(0, r.bytesRead);


    },


    };


    }


    Let’s apply the lesson from the resource management discussion: who owns the buffer?
    For the code in this chapter, we know that the buffer returned by the producer
    (BodyReader) is written to the socket, and our code waits for the write to complete
    before invoking the next read(), so the producer is the only place the buffer
    is referenced, so we can reason that the consumer doesn’t need to own the buffer,
    so the buffer reuse is valid. However, this may not be true for more complicated
    consumers!


    Another case is when the consumer allocates the buffer, the lifetime of the buffer
    is clear as long as the data is processed in place so the consumer is the sole
    owner.


    // pseudo code!


    const buf = Buffer.allocUnsafe(65536);


    // reused for each read


    while (more\_data()) {


    const nbytes = await read\_data(buf);


    // read from the producer


    await process(buf.subarray(0, nbytes));


    // \`bufìs not used anymore, so it''s safe to reuse.


    }


    In Golang, when pulling data from the io.Reader interface, the buffer is provided
    by the consumer. This encourages buffer reuse and discourages unnecessary allocations
    by design.


