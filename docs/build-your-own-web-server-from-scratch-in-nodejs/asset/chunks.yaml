    This is similar to the bufio.Writer in Golang. This scheme is more flexible than
    adding buffering to the socket code, because the buffered wrapper is also applicable
    to other forms of IO. And the Go standard library was designed with well-defined
    interfaces [(io.Writer\[1\]](https://pkg.go.dev/io#Writer)[),](#index_split_000.html#p66)


    making the buffered writer a drop-in replacement for the unbuffered writer.


    There are many more good ideas to steal from the Go standard library. One of them
    is that the bufio.Writer is not just an io.Writer, but also [exposes its internal
    buffer\[2\]](https://pkg.go.dev/bufio#example-Writer.AvailableBuffer) so that
    you can write to it directly! This can eliminate temporary buffers and extra data
    copies when serializing data.


