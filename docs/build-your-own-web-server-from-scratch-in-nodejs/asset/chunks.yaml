    # 11. HTTP Caching


    Even with these directives, the client has lots of freedom. Without real use cases,
    it’s impossible to implement useful software just from specifications. The freedom
    of clients is maximized when the server does not use `Cache-Control` at all. This
    is called [heuristic](https://developer.mozilla.org/en-US/docs/Web/HTTP/Caching#heuristic_caching)
    [caching[2]](https://developer.mozilla.org/en-US/docs/Web/HTTP/Caching#heuristic_caching)
    in web browsers.


    For example, a browser may use the `Last-Modified` time as a heuristic, using
    a fraction of the last-modified-to-now duration as the cache TTL.


    ## Non-Client Caching


    So far, we have assumed that caching is done by a user-facing client, such as
    a browser. In practice, a cache can also be provided by:


    - By the server application. This is especially useful for dynamically generated
    content. The app stores the generated content for itself to reuse. The goal is
    to save the latency and/or the cost of content generation. The `ETag` scheme can
    also be easily used to aid client-side caching, since the app controls the content.

    - By a transparent proxy or middleware. The proxy acts as a client of the origin
    server, serving requests on behalf of the real client. It may cache responses
    just like other clients. This form of proxy can be deployed by the service developer,
    by the CDN, or by the ISP (before HTTPS was common).


    ## Shared and Private Caches


    A problem with the caching proxy is that the response may be personalized, how
    does a caching proxy know which content is for which user?


    This problem does not exist for a browser because it represents a single user.
    For caches shared by multiple users, there are directives to explicitly mark the
    response as either public or private. The `private` directive is for personalized
    content that should not be cached by proxies.


    `Cache-Control: private`


    There are additional rules for determining whether to cache or not. For example,
    the `Authorization` header field normally prevents a proxy from caching the response.
    But the `public` directive can override this rule and make the content cacheable.


    ## Caching in the Cloud


    The RFC only defines the intended caching behavior in a very loose sense. For
    developing or understanding real-world projects, you should rely on the software/service
    manual instead.


    There are many cloud providers that offer a CDN or caching service, some even
    offer additional caching controls. Read their documentation to understand how
    things work in practice. Some examples:


    - [Cloudflare[3]](https://developers.cloudflare.com/cache/concepts/cache-control/)

    - [AWS CloudFront[4]](https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Expiration.html)

    - [Azure CDN[5]](https://learn.microsoft.com/en-us/azure/cdn/cdn-how-caching-works)

    - [Google Cloud CDN[6]](https://cloud.google.com/cdn/docs/caching)


    # CHAPTER 12: Compression & the Stream API


    The next major feature is compression. We’ll also explore the stream abstraction
    in Node.JS (which we ignored previously).


    ## 12.1 How HTTP Compression Works


    ### Negotiating with `Accept-Encoding`


    HTTP compression, like other features, is optional, so the client have to explicitly
    request the server to compress the response. This is done via the `Accept-Encoding`
    header field, which contains a comma-separated list of compression methods. Commonly
    used methods include:


    - `gzip`

    - `deflate`

    - `br`. [Brotli[1]](https://www.rfc-editor.org/rfc/rfc7932.html) newer but less
    widely supported.


    The method may be followed by an optional weight to indicate its priority. See
    the RFC for the exact syntax.


    `Accept-Encoding: deflate, gzip;q=1.0`


    ### Compress with `Content-Encoding`


    If the server chooses one of the suggested compression methods, it will report
    back with `Content-Encoding`.


    `Content-Encoding: gzip`


    More than one `Content-Encoding` can be applied. However, there is no practical
    use for this.


    Some content types are already compressed, such as PNG, JPG, or ZIP. It’s best
    to exclude them from compression, as they are not compressible.


    ### Compression and `Content-Length`


    The purpose of `Content-Length` does not change with respect to compression, that
    is the length of the HTTP body, not the length of the uncompressed data.


    When compression is applied on the fly, the compressed size is not known in advance
    (unless the entire output is buffered, which does not work for large content),
    so we need to also use chunked encoding.


    ### Compression and Caching


    Compression is CPU intensive, it is not always applied on the fly; a caching proxy
    can cache and serve compressed responses (if the `Accept-Encoding` allows it).


    If a caching proxy doesn’t care about compression, it must at least not mix responses
    from different compression methods. That’s the purpose of the `Vary` header field,
    to inform proxies that the response will vary if certain header fields are used.


    For example, if `Vary: content-encoding` is used, the cache item will be keyed
    with the value of `Content-Encoding`, so the cache lookup will take that into
    account.


    ### Compressed Uploads


    Due to the nature of content negotiation, there is no standard way to compress
    the request body. If a client does this with `Content-Encoding`, it is probably
    the application, rather than the HTTP server, to decompress the request.


    ### Compression and Range Requests


    `Content-Encoding` is a property of content. Therefore, the `Range` header field
    works on the compressed data, which is NOT the desired behavior.


    Common practice is not to compress when serving range responses.


    ### Compress with `Transfer-Encoding`


    There is another rarely/supported way to do compression. `Transfer-Encoding` is
    usually used for chunked encoding, it can also compress the payload.


    `Transfer-Encoding: gzip, chunked`


    The above header field means that the payload is first gzipped and then chunked.


    What’s the difference from `Content-Encoding`? The difference is that `Transfer-Encoding`
    is NOT a property of the content, so range requests can work with `Transfer-Encoding`
    but not with `Content-Encoding`.

