    03\. Code A TCP Server


    **Listening Socket & Connection Socket**


    A TCP server listens on a particular address (IP + port) and accepts client connections
    from that address. The listening address is also represented by a socket handle.
    And when you accept a new client connection, you get the socket handle of the
    TCP connection.


    Now you know that there are 2 types of socket handles.


    1\. Listening sockets. Obtained by *listening* on an address.


    2\. Connection sockets. Obtained by *accepting* a client connection from a listening
    socket.


    **End of Transmission**


    Send and receive are also called *read* and *write*. For the write side, there
    are ways to tell the peer that no more data will be sent.


    • *Closing* a socket terminates a connection and causes the TCP FIN to be sent.
    Closing a handle of any type also recycles the handle itself. (Once the handle
    is gone, you cannot do anything with it.)


    • You can also *shutdown* your side of the transmission (also send FIN) while
    still being able to receive data from the peer; this is called a *half-open* connection,
    more on this later.


    For the read side, there are ways to know when the peer has ended the transmission
    (received FIN). The end of transmission is often called the *end of file* (EOF).


    **List of Socket Primitives**


    In summary, there are several socket primitives that you need to know about.


    • Listening socket:


    **–** bind & listen


    **–** accept


    **–** close


    • Connection socket:


    **–** read


    **–** write


    **–** close


    **3.3 Socket API in Node.js**


    We will introduce the socket API with a small exercise: a TCP server that reads
    data from clients and writes the same data back. This is called an “echo server”.


