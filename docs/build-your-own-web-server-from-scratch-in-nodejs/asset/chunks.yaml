    12\. Compression & the Stream API


    And the whole process of responding to a request becomes a series of pipes: produce-response
    | gzip-compress | chunk-encode | write-to-socket


    **12.6 Discussion: High Water Mark and Backpressure**


    **One-Item Queue**


    The way we maintain backpressure is by waiting for the queue or buffer to drain.
    From the producer and consumer point of view, a queue has 2 states:


    Queue


    Can produce Can consume


    Empty


    Yes


    No


    Not Empty No


    Yes


    This limits a queue to a maximum of 1 item or 1 pending write.


    **Backpressure by High Water Mark**


    However, some backpressure implementations are slightly more sophisticated — the
    queue is limited by the number of bytes instead of just 1 write. This limit is
    often called a *high* *water mark*. The queue has 3 states when using a high water
    mark for backpressure: Queue Can produce Can consume


    Empty Yes


    No


    Half


    Yes


    Yes


    Full


    No


    Yes


    This is more like Unix pipes, a Unix pipe is a bounded buffer, as long as it’s
    not full you can add more bytes to it; you do not have to wait until it’s completely
    drained.


    **Batching Data with Queues**


    The reason for using the high water mark instead of the one-item queue is that
    the queue can combine multiple small writes. For example, here are some possible
    optimizations when moving data from a queue to a socket:


    [Report an Error | Ask a Question](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)


