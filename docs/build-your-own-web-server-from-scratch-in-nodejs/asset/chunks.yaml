- raw: '• 0x09 and 0x10: Ping and pong, or heartbeats. For keeping the connection
    alive and probing dead connections. Can be transparent to applications.


    **Fragmented Messages**


    WebSocket also supports sending messages without knowing their length in advance,
    like the chunked transfer encoding in HTTP. A “logical” data message can be broken
    into multiple frames, but the application sees the combined message.


    • The first frame has opcode 0x01 or 0x02, while the rest frames use 0x00.


    • The last frame has the FIN flag set.


    • Only data messages (opcode 0x01 and 0x02) can be fragmented.


    • Frames of different messages cannot be interleaved, except for control messages.


    An example with 3 fragments:


    | opcode=0x01, FIN=0 | opcode=0x00, FIN=0 | opcode=0x00, FIN=1 |


    An unfragmented message is encoded as a single frame with opcode 0x01 or 0x02
    and the FIN flag is set.


    Like the design of chunked transfer encoding, you can stream arbitrarily large
    data as a single message. But many implementations represent the message data
    as a single buffer, so there is a limit to the message size.


