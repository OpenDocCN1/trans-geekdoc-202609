    **CHAPTER 07**


    **Code A Basic HTTP Server**


    Our HTTP server is based on the message echo server from the previous chapter,
    with the


    “message” replaced by the HTTP message.


    **7.1 Start Coding**


    The code is broken into small steps and follows a top-down approach.


    **Step 1: Types and Structures**


    Our first step is to define the structure for HTTP messages based on our understanding
    of HTTP semantics.


    // a parsed HTTP request header


    type HTTPReq = {


    method: string,


    uri: Buffer,


    version: string,


    headers: Buffer\[\],


    };


    // an HTTP response


    type HTTPRes = {


    code: number,


    headers: Buffer\[\],


    body: BodyReader,


    };


    We use Buffer instead of string for the URI and header fields. Although HTTP is
    mostly plaintext, there is no guarantee that URI and header fields must be ASCII
    or UTF-8 strings.


    So we just leave them as bytes until we need to parse them.


    The BodyReader type is the interface for reading data from the body payload.


    // an interface for reading/writing data from/to the HTTP body.


    type BodyReader = {


    // the "Content-Length", -1 if unknown.


    length: number,


    49


