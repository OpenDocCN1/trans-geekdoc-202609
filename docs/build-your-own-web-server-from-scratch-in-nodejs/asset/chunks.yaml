    **CHAPTER 04**


    **Promises and Events**


    In this chapter, we will implement the echo server again, but using the promise-based
    style which is the basis for the rest of the book. This decision will be explained
    later.


    **4.1 Introduction to àsyncànd àwait\`**


    Let’s take a quick tour of async/await and the Promise type in JS, in case you
    are not already familiar with them.


    **Using Callbacks**


    An example of a callback-based API. The application logic is continued in a callback
    function.


    function my\_app() {


    do\_something\_cb((err, result) => {


    if (err) {


    // fail.


    } else {


    // succuss, use the result.


    }


    });


    }


    **Using Promises and àwait\`**


    An example of using await on a promise. The application logic continues in the
    same async function.


    function do\_something\_prmoise(): Promise<T>;


    async function my\_app() {


    try {


    const result: T = await do\_something\_prmoise();


    } catch (err) {


    // fail.


    }


    }


    19


    2024-02-02


    04\. Promises and Events


    Advantage: The application logic is not broken into multiple functions.


    **Creating Promises**


    An example of creating promises: converting a callback-based API to promise-based.


    function do\_something\_prmoise() {


    return new Promise<T>((resolve, reject) => {


    do\_something\_cb((err, result) => {


    if (err) {


    reject(err);


    } else {


    resolve(result);


    }


    });


    });


    }


    Callbacks are unavoidable in JS. When creating a promise object, an *executor*
    callback is passed as an argument to receive 2 more callbacks:


    • resolve() causes the await statement to return a value.


    • reject() causes the await statement to throw an exception.


    You must call one of them when the result is available or the operation has failed.
    This may happen outside the executor function, so you may need to store these
    callbacks somewhere.


    Terminology for promises:


    • **Fulfilled**: resolve() called.


    • **Rejected**: reject() called.


    • **Settled**: Either fulfilled or rejected.


    • **Pending**: Not settled.


    **4.2 Understanding àsyncànd àwait\`**


    **Normal Functions Yield to the Runtime by \`return\`**


    There are 2 types of JS functions: normal functions and async functions. Normal
    functions execute from start to return (either explicitly or implicitly). Since
    the JS runtime is single-threaded and event-based, you cannot do blocking IOs
    in JS, instead you register callbacks for the completion of IOs, and then the
    JS code ends. Once back in the runtime, the


