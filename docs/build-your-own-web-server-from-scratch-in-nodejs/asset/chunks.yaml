    03\. Code A TCP Server


    **TCP Byte Stream vs. UDP Packet**


    The key difference: boundaries.


    • UDP: Each *read* from a socket corresponds to a single *write* from the peer.


    • TCP: No such correspondence! Data is a continuous flow of bytes.


    TCP simply has no mechanism for preserving boundaries.


    1\. TCP send buffer: This is where data is stored before transmission. Multiple
    writes are indistinguishable from a single write.


    2\. Data is encapsulated as one or more IP packets, IP boundaries have no relationship
    to the original write boundaries.


    3\. TCP receive buffer: Data is available to applications as it arrives.


    The No. 1 beginner trap in socket programming is “concatenating & splitting TCP
    packets”


    because there is no such thing as “TCP packets”. Protocols are required to interpret
    TCP


    data by imposing boundaries within the byte stream.


    **Byte Stream vs. Packet: DNS as an Example**


    To help you understand the implications of the byte stream, let’s use the DNS
    protocol (domain name to IP address lookup) as an example.


    DNS runs on UDP, the client sends a single request message and the server responds
    with a single response message. A DNS message is encapsulated in a UDP packet.


    | IP header |


    IP payload


    |


    \\............................../


    | UDP header |


    UDP payload


    |


    \\.............../


    | DNS message |


    Due to the drawbacks of packet-based protocols, e.g., the inability to use large
    messages, DNS is also designed to run on TCP. But TCP knows nothing about “message”,
    so when sending DNS messages over TCP, a **2-byte length field** is prepended
    to each DNS message so that the server or client can tell which part of the byte
    stream is which message. This 2-byte length field is the simplest example of an
    *application protocol* on top of TCP. This protocol allows for multiple *application
    messages* (DNS) in a single TCP byte stream.


    | len1 | msg1 | len2 | msg2 | ...


