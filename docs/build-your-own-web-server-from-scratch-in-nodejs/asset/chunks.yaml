    The problem with this is that it generates many small writes, causing TCP to send
    many small packets. Not only does each packet have a relatively large space overhead,
    but more computation is required to process more packets. People saw this optimization
    opportunity and added a feature to the TCP stack known as “Nagle’s algorithm”
    — the TCP stack *delays* transmission to allow the send buffer to accumulate data,
    so that multiple consecutive small writes can be combined.


    **Premature Optimization**


    However, this is not a good optimization. Many newer network protocol designs,
    such as TLS, have put a lot of effort into reducing RTTs because many performance
    problems are latency problems. Adding delays to TCP to combine writes now looks
    like anti-optimization.


    And the intended optimization goal can easily be achieved at the application level
    instead; applications can simply combine small data themselves without delays.


    Well-written applications should manage buffers carefully, either by explicitly
    serializing data into a buffer, or by using some buffered IO interfaces, so that
    Nagle’s algorithm is not needed. And high-performance applications will want to
    minimize the number of syscalls, making Nagle’s algorithm even more useless.


    **What People Actually Do in Practice**


    When developing networked applications:


    1\. Avoid small writes by combining small data before writing.


    2\. Disable Nagle’s algorithm.


    Nagle’s algorithm is often enabled by default. This can be disabled using the
    noDelay flag in Node.js.


    const server = net.createServer({


    noDelay: true,


    // TCP\_NODELAY


    });


