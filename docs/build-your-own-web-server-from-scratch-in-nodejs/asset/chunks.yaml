    const gz = zlib.createGzip({flush: zlib.constants.Z\_SYNC\_FLUSH});


    Flushing the compressor frequently reduces the effectiveness of the compression.
    So it’s a good idea to let applications control whether to flush or not. For example,
    we don’t need to flush the compressor when serving static files because the data
    source is generated as fast as the system can.


    For applications that generate very small chunks of data, it may be better not
    to compress at all, because small data likely won’t compress well with frequent
    flushing.


    **12.5 Discussion: Refactoring to Stream**


    You can try to refactor the code to use more streams and pipes. For starters,
    replace the read() function in the BodyReader interfaces.


    // an interface for reading/writing data from/to the HTTP body.


    type BodyReader = {


    // the "Content-Length", -1 if unknown.


    length: number,


    // read data.


    reader: stream.Readable,


    };


    Lots of code can be saved by using more streams and pipes:


    1\. The implementation of the soRead() function is not needed.


    2\. The code for reading disk files can be replaced by fp.createReadStream().


    3\. The writeHTTPBody() function can simply create a pipe between the response
    and the socket.


    4\. Since we are no longer dealing with explicit reads and writes, the chunked
    encoder can be replaced by implementing a stream.Transform,


    5\. Generators can be converted to stream.Readable via stream.Readable.from().


