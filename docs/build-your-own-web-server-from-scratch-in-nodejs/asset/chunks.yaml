    04\. Promises and Events


    **4.7 Conclusion: Promise vs. Callback**


    Following the discussions above, we can now explain why we switched to the promise-based
    API, because there are advantages.


    • If you stick to promises and async/await, it’s harder to create the kind of
    race conditions described above because things happen in order.


    • With callback-based code, it’s not only harder to figure out the order of code
    execution, it’s also harder to control the order. In short, callbacks are harder
    to read and more error-prone to write.


    • Backpressure is naturally present when using the promse-based style. This is
    similar to coding with blocking IO (which you can’t do in Node.js).


    We have learned the basics of the socket API. Let’s move on to the next topic:
    protocol.


