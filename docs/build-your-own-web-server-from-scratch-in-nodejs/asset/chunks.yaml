    13\. WebSocket & Concurrency


    **13.3 Introduction to Concurrent Programming**


    **Race Conditions**


    In message-based designs, it’s common to have multiple sources of messages consumed
    by a single consumer, such as multiple concurrent tasks sending messages over
    a single WebSocket.


    Since WebSocket messages are serialized into a single TCP byte stream, concurrent
    writes to the socket will mess up the protocol.


    Let’s use a hypothetical example to illustrate the problem.


    // pseudo code!


    async function send(conn, msg) {


    await write\_header(conn, msg);


    await write\_body(conn, msg);


    }


    In this example, writing 1 message involves 2 socket writes, and the code yields
    to the runtime at each await statement. The problem is that while back to the
    runtime, the runtime may schedule another task that is also sending a message,
    resulting in *interleaved* socket writes.


    This is called a *race condition* in concurrent programming. Note that this has
    *nothing* to do with the single-threaded runtime or the number of CPU cores.


    **Atomic Operations**


    You may think that the solution is to use only 1 socket write for each message.
    However, this solution is …


    • Correct only if socket writes are atomic, which may not be guaranteed.


    • Not always possible and not convenient. Consider that WebSocket messages can
    be fragmented and used like streams.


    Although operating systems [try\[4\]](https://man7.org/linux/man-pages/man2/write.2.html#BUGS)
    [to\[5\]](http://web.archive.org/web/20120623124411/http://www.almaden.ibm.com/cs/people/marksmith/sendmsg.html)
    implement concurrent writes as atomic operations, no sane application will depend
    on this behavior, and a byte stream is not about messages anyway.


    [\[4\]https://man7.org/linux/man-pages/man2/write.2.html#BUGS](https://man7.org/linux/man-pages/man2/write.2.html#BUGS)


    [\[5\]http://web.archive.org/web/20120623124411/http://www.almaden.ibm.com/cs/people/marksmith/se](http://web.archive.org/web/20120623124411/http://www.almaden.ibm.com/cs/people/marksmith/sendmsg.html)


    [ndmsg.html](http://web.archive.org/web/20120623124411/http://www.almaden.ibm.com/cs/people/marksmith/sendmsg.html)


