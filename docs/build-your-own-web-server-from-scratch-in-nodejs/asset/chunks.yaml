    93


    2024-02-02


    11\. HTTP Caching


    A browser will normally reuse a fresh item, but it MAY revalidate the item even
    if the cache is fresh, this can happen when the user hits the reload button.


    But why is “Validate stale” a “should”? What’s the point of setting the TTL if
    the effect is not even guaranteed? It turns out that there are 2 levels of guarantee.


    1\. Without must-revalidate, a stale item may still be reused, this can happen
    when the server is unreachable.


    2\. With must-revalidate, the cache TTL is actually respected.


    Implementations do not necessarily distinguish between “should” and “must” cases,
    though.


    **Make the Client Always Check the Server**


    The no-cache directive is confusing, it does not mean “do not cache”, it’s a shorthand
    for max-age=0, must-revalidate, which means “cache but always validate”. It is
    used when the latest data is desired.


    **Prevent Caching**


    To prevent caching altogether, use the no-store directive, which instructs the
    client not to touch the cache at all. (This also won’t cause the existing cache
    entry to be deleted.) **Reduce Fresh Validations**


    The immutable directive is an optimization; it tells the client not to revalidate
    a fresh item, even when reloading. This can be used when the URL is immutable,
    such as when the resource is retrieved by its hash value. Not all browsers have
    implemented this, though.


