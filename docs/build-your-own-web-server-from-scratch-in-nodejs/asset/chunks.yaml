    `UDP` 与 `TCP` 处于同一层，但仍然像底层一样基于数据包。`UDP` 只是在 `IP` 数据包上添加了端口号。


    8


    2024-02-02


    03. 代码实现一个 TCP 服务器


    **TCP 字节流 vs UDP 数据包**


    关键区别：边界。


    • `UDP`: 从套接字的每次 `read` 对应于对端的一次 `write`。


    • `TCP`: 没有这种对应关系！数据是连续的字节流。


    `TCP` 根本没有保留边界的机制。


    1. `TCP` 发送缓冲区：这是传输前存储数据的地方。多次写入与单次写入无法区分的。

    2. 数据被封装为一个或多个 `IP` 数据包，`IP` 边界与原始写入边界之间没有关系。

    3. `TCP` 接收缓冲区：数据在到达时即可供应用程序使用。


    套接字编程中的第一个新手陷阱是“合并与拆分 TCP 数据包”，因为不存在所谓的“TCP 数据包”。需要通过在字节流中强制设定边界来解释 `TCP` 数据。


    **字节流 vs. 数据包：以 DNS 为例**


    为了帮助你理解字节流的影响，让我们以 `DNS` 协议（域名到 IP 地址的查找）为例。


    `DNS` 运行在 `UDP` 上，客户端发送单个请求消息，服务器响应单个响应消息。一个 `DNS` 消息被封装在一个 `UDP` 数据包中。


    | IP 头部 | IP 负载 |

    | :--- | :--- |

    | ... | |

    | UDP 头部 | UDP 负载 |

    | DNS 消息 | |


    由于基于包协议的缺点（例如无法使用大消息），`DNS` 也设计为运行在 `TCP` 上。但 `TCP` 对“消息”并不感知，因此在 `TCP` 上发送 `DNS`
    消息时，会在每个 `DNS` 消息前添加一个 `2 字节长度字段`，以便服务器或客户端能够判断字节流的哪个部分是哪个消息。这个 2 字节长度字段是 `TCP`
    之上 `应用协议` 最简单的示例。该协议允许在单个 `TCP` 字节流中存在多个 `应用消息`（`DNS`）。


    | len1 | msg1 | len2 | msg2 | ... |


    [报告错误 | 提问](https://forms.gle/UKo4bncUnuMGBrTM5) @ [build-your-own.org](https://build-your-own.org)


    9


    2024-02-02


    03. 代码实现一个 TCP 服务器


    **TCP 从握手开始**


    要建立 `TCP` 连接，应该有一个和一个服务器（忽略同时发生的情况）。服务器在特定地址（IP + 端口）等待客户端，这一步被称为 `bind & listen`。然后客户端可以
    `connect` 到该地址。`connect` 操作涉及三次握手（`SYN`、`SYN-ACK`、`ACK`），但这不是我们关注的，因为操作系统透明地完成了它。操作系统完成握手后，连接可以被服务器
    `accepted`。


    **TCP 是双向且全双工的**


    一旦建立，`TCP` 连接就可以用作双向字节流，每个方向有两个通道。许多协议如 `HTTP/1.1` 是这种请求-响应模式的，对端要么在发送请求/响应，要么在接收响应/请求。但
    `TCP` 不限于此。


    （注：原文中后续大量重复的段落已去重，以符合文档专业性）


