    **Step 8: Test and Debug**


    Use a web browser to create WebSockets for testing. Remember to use packet capturing
    tools. Wireshark can disassemble the protocol, so you can use it to …


    • Learn what the correct format looks like if you failed to parse the frames.


    • See what’s wrong with the frames you’ve generated.


    **13.6 Discussion: WebSocket in the Browser**


    WebSocket is symmetric with respect to the functionality of both peers. So the
    application interface should be usable for both clients and servers. Let’s explore
    the WebSocket API in the browser and compare it to ours.


    **No Backpressure for WebSocket in the Browser**


    The most important difference is that the browser API is callback-based. The browser
    invokes the [event handler\[6\]](https://developer.mozilla.org/en-US/docs/Web/API/WebSocket/message_event)
    as messages arrive. This is similar to net.Socket in Node.JS, except that there
    are no pause() and resume() methods, so backpressure is impossible for receiving.


    For sending messages, the [send() method\[7\]](https://developer.mozilla.org/en-US/docs/Web/API/WebSocket/send)
    just buffers the data and returns nothing. There is an attribute bufferedAmount
    to tell the buffer size, so applications can still control backpressure.


    There is an alternative [API design\[8\]](https://developer.chrome.com/docs/capabilities/web-apis/websocketstream)
    that uses async/await for reading and writing, which is the direction we took.


    [\[6\]https://developer.mozilla.org/en-US/docs/Web/API/WebSocket/message\_event](https://developer.mozilla.org/en-US/docs/Web/API/WebSocket/message_event)


    [\[7\]https://developer.mozilla.org/en-US/docs/Web/API/WebSocket/send](https://developer.mozilla.org/en-US/docs/Web/API/WebSocket/send)


    [\[8\]https://developer.chrome.com/docs/capabilities/web-apis/websocketstream](https://developer.chrome.com/docs/capabilities/web-apis/websocketstream)


    [Report an Error | Ask a Question](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)


    125


    2024-02-02


    13\. WebSocket & Concurrency


    **Application Level Backpressure**


    Missing backpressure is probably the No. 2 mistake in network programming. But
    even if backpressure is impossible in the browser, applications can implement
    it at a higher level:


    • The consumer acknowledges processed messages to the producer.


    • The producer uses the acknowledgements to implement flow control.


    There are messaging protocols that run on top of WebSocket that implement backpressure,
    such as [RSocket\[9\]](https://rsocket.io/about/protocol#flow-control)[.](#index_split_001.html#p131)


    **Message Size is Limited**


    While you can treat a WebSocket message as an unlimited stream by using fragmented
    frames, most software, including browsers, stores the message as a single buffer.
    So there is a limit to both message size and frame size. (We don’t have these
    limits because we use the read() function to consume data on the fly).


    Applications that send large chunks of data over WebSockets should have a fragmentation
    mechanism to keep the message size small.


    **13.7 Conclusion: What We Have Learned**


