    curl can request compressed responses:


    curl -vvv --compressed http://127.0.0.1:1234/


    **Step 7: Flush the Compressor Buffer**


    Compression works. Except for one problem: when you test the ''/echo'' or the
    ''/sheep''


    URI, the response doesn’t show up immediately. This is due to the buffering done
