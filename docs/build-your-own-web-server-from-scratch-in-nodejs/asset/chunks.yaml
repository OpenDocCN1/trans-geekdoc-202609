    03\. Code A TCP Server


    **TCP Start with a Handshake**


    To establish a TCP connection, there should be a client and a server (ignoring
    the simultaneous case). The server waits for the client at a specific address
    (IP + port), this step is called *bind & listen*. Then the client can *connect*
    to that address. The “connect” operation involves a 3-step handshake (SYN, SYN-ACK,
    ACK), but this is not our concern because the OS does it transparently. After
    the OS completes the handshake, the connection can be *accepted* by the server.


    **TCP is Bidirectional & Full-Duplex**


    Once established, the TCP connection can be used as a bi-directional byte stream,
    with 2


    channels for each direction. Many protocols are request-response like HTTP/1.1,
    where a peer is either sending a request/response or receiving a response/request.
    But TCP isn’t restricted to this mode of communication. Each peer can send and
    receive at the same time (e.g. WebSocket), this is called *full-duplex* communication.


    **TCP End with 2 Handshakes**


    A peer tells the other side that no more data will be sent with the FIN flag,
    then the other side ACKs the FIN. The remote application is notified of the termination
    when reading from the channel.


    Each direction of channels can be terminated independently, so the other side
    also performs the same handshake to *fully* close the connection.


    **3.2 Socket Primitives**


    The socket API comes in different shapes in different languages and libraries.
    You are likely to get confused if you jump into the API documentation without
    knowing the basics.


    **Applications Refer to Sockets by Opaque OS Handles**


    When you create a TCP connection, the connection is managed by your operating
    system, and you use the socket handle to refer to the connection in the socket
    API. In Linux, a socket handle is simply a file descriptor (fd). In Node.js, socket
    handles are wrapped into JS


    objects with methods on them.


    Any OS handle must be closed by the application to terminate the underlying resource
    and recycle the handle.


