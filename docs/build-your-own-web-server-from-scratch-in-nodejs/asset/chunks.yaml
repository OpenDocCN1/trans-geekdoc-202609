  trans: "\n\n使用 `ReadableStream`(https://developer.mozilla.org/en-US/docs/Web/API/ReadableStream)\
    \ 来`发送请求`(https://developer.mozilla.org/en-US/docs/Web/API/fetch#body)。为了支持此类客户端，让我们添加代码来读取分块（chunked）请求。\n\
    \n[\\[1](https://developer.mozilla.org/en-US/docs/Web/API/ReadableStream)\n\n\
    [\\[2](https://developer.mozilla.org/en-US/docs/Web/API/fetch#body)\n\n[报告错误 |\
    \ 提问](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)\n\
    \n2024-02-02\n\n## 08. 动态内容与流传输\n\n### 分块解析器作为生产者\n\n解码分块请求的代码必须连接到 `BodyReader`\
    \ 接口。\n\n与我们之前将响应生成器连接到 `BodyReader` 接口的任务是完全相同的。我们将再次使用 JS 生成器（generator）。\n\n\
    ```javascript\n// 解码分块编码并即时产生数据\nasync function* readChunks(conn: TCPConn, buf:\
    \ DynBuf): BufferGenerator;\n```\n\n`readChunks()` 生成器的行为应该像我们之前编写的示例响应生成器。因此，我们可以直接使用\
    \ `readerFromGenerator()` 将其转换为 `BodyReader`。\n\n```javascript\n// 来自 HTTP 请求的\
    \ BodyReader\nfunction readerFromReq(\n  conn: TCPConn, buf: DynBuf, req: HTTPReq):\
    \ BodyReader\n{\n  // 省略 ...\n  if (bodyLen >= 0) {\n    // 存在 \"Content-Length\"\
    \n    return readerFromConnLength(conn, buf, bodyLen);\n  } else if (chunked)\
    \ {\n    // 分块编码\n    return readerFromGenerator(readChunks(conn, buf));\n  }\
    \ else {\n    // 读取连接的剩余部分\n    return readerFromConnEOF(conn, buf);\n  }\n}\n\
    ```\n\n`readerFromConnEOF()` 函数用于兼容 HTTP/1.0 客户端。我们将跳过代码列表。\n\n### 解码块格式\n\n`readChunks()`\
    \ 的实现：\n\n```javascript\n// 解码分块编码并即时产生数据\nasync function* readChunks(conn: TCPConn,\
    \ buf: DynBuf): BufferGenerator {\n  for (let last = false; !last; ) {\n    //\
    \ 读取分块大小行\n    const idx = buf.data.subarray(0, buf.length).indexOf('\\r\\n');\n\
    \    if (idx < 0) {\n      // 需要更多数据，省略 ...\n      continue;\n    }\n    // 解析分块大小并移除该行\n\
    \    let remain = /\\* omitted ... */;\n    bufPop(buf, /\\* omitted ... */);\n\
    \    // 是最后一个吗？\n    last = (remain === 0);\n    // 读取并产生分块数据\n    while (remain\
    \ > 0) {\n      if (buf.length === 0) {\n        await bufExpectMore(conn, buf,\
    \ 'chunk data');\n      }\n      const consume = Math.min(remain, buf.length);\n\
    \      const data = Buffer.from(buf.data.subarray(0, consume));\n      bufPop(buf,\
    \ consume);\n      remain -= consume;\n      yield data;\n    }\n    // 分块数据后跟着\
    \ CRLF\n    bufPop(buf, 2); // 每个分块\n  }\n}\n```\n\n这与 HTTP 本身的头部-体结构相似。你等待分块大小并确定主体的长度。头部是变长度的，因此在解析时我们需要限制其大小，就像我们处理\
    \ HTTP 头部时一样。\n\n### 分块编码产生字节流\n\n解码格式是简单的。你需要注意的是读取块数据的内部循环。代码并没有等待整个分块到达，而是只要数据到达就产生数据。如果我们等待整个分块，就必须将整个块存储在内存中并受到限制。\n\
    \n2024-02-02\n\n08. 动态内容与流传输\n\n分块请求可以使用 `curl http://127.0.0.1:1234` 进行测试。`curl`\
    \ 将在不知道请求长度的情况下读取数据。\n\n## 8.5 讨论：使用数据包获调试\n\n一直在编写复杂的代码。了解如何调试代码是非常重要的。添加 `print`\
    \ 语句是检查情况的一种快速方法，但对于网络应用程序，有更廉价的方法：数据包获工具如 `tcpdump`、`grep` 和 `wireshark`。\n\n\
    ### 使用 `tcpdump` 捕获并检查数据\n\n示例：`tcpdump -X -i lo port 1234`\n\n- `-X` 标志让 `tcpdump`\
    \ 进行十六转储。\n- `-i lo` 标志限制网络接口。我们只关心到 `127.0.0.1:1234` 的连接。\n- `port 1234` 是过滤无关数据包的布尔表达式。\n\
    \n`tcpdump` 的示例输出：\n\n```\n12:00:00.222444 IP 127.0.0.1.1234 > 127.0.0.1.59872:\n\
    0000: 4500 0079 c492 4000 4006 77ea 7f00 0001 E..y...@w.....\n0010: 7f00 0001\
    \ 04d2 e9e0 42d3 38e1 bb89 becb........B.8.....\n0020: 8018 0200 fe6d 0000 0101\
    \ 080a 8f86 a39c.....m..........\n0030: 8f86 a395 4854 5450 2f31 2e31 2032 3030....HTTP/1.1.200\n\
    0040: 204f 4b0d 0a53 6572 7665 723a 206d 795f.OK..Server:.my_\n0050: 6669 7273\
    \ 745f 6874 7470 5f73 6572 7665first_http_serve\n0060: 720d 0a43 6f6e 7465 6e74\
    \ 2d4c 656e 6774r..Content-Lengt\n0070: 683a 2031 330d 0a0d 0a h:.13....\n12:00:00.222666\
    \ IP 127.0.0.1.59872 > 127.0.0.1.1234:\n...\n12:00:00.333444 IP 127.0.0.1.1234\
    \ > 127.0.0.1.59872:\n0000: 4500 0041 c493 4000 4006 7821 7f00 0001 E..A..@.@.x.\n\
    ```\n\n2024-02-02\n\n08. 动态内容与流传输\n\n### 使用 `ngrep` 搜索数据包数据\n\n对于 HTTP 这样的文本协议，十六进制转储可能大过其实。你可以使用\
    \ `ngrep` 将数据打印为文本。\n\n`ngrep -qt -i lo '' port 1234`\n\n- `-d lo` 用于网络接口。\n-\
    \ 空字符串 `''` 是过滤所有数据包的正则表达式。\n- `port 1234` 类似于 `tcpdump` 使用的布尔表达式。\n\n值得注意的是，所有这些工具都可以将数据包写入交换格式（pcap）的文件。你可以先捕获数据包，稍后分析。\n\
    \n[报告错误 | 提问](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)\n\
    \n### 使用 Wireshark 分析数据包\n\n你也可以使用 `-w` 标志将捕获的数据包保存到文件中，而不是打印它们。文件格式可以被所有数据包分析软件（包括\
    \ `tcpdump` 本身）读取。\n\n如果你更喜欢图形界面，可以使用 Wireshark 打开捕获的文件，它除了显示十六进制转储外，还可以解析协议，显示每个元素和结构。\n\
    \n- 使用布尔表达式过滤数据包。这会立即生效，因此你可以通过尝试错误来操作。\n- 高亮单个连接。\n- 使用真实数据学习新协议。\n- 查看你自己的实现中哪些问题。\n\
