    13\. WebSocket & Concurrency


    type Queue<T> = {


    pushBack(item: T): Promise<void>;


    // throws if closed


    popFront(): Promise<null|T>;


    // returns null if closed


    close(): void;


    };


    We can throw exceptions to producers and return nulls to consumers, mimicking
    closed pipes.


    **The Blocking Queue as a Synchronization Primitive**


    A synchronization primitive is something used to block and unblock tasks (pass
    control).


    Some traditional synchronization primitives include:


    • Mutex.


    • Semaphore.


    • Condition variable.


    • Event.


    In addition to traditional synchronization primitives, Golang also employs the
    “channel” as its primary synchronization primitive, which is mostly similar to
    the blocking queue we’re discussing.


    Many simple concurrency problems are solved by passing data, which is favored
    in Go. We will demonstrate this with our WebSocket implementation.


