    96


    **CHAPTER 12**


    **Compression & the Stream API**


    The next major feature is compression. We’ll also explore the stream abstraction
    in Node.JS


    (which we ignored previously).


    **12.1 How HTTP Compression Works**


    **Negotiating with Àccept-Encoding\`**


    HTTP compression, like other features, is optional, so the client have to explicitly
    request the server to compress the response. This is done via the Accept-Encoding
    header field, which contains a comma-separated list of compression methods. Commonly
    used methods include:


    • gzip


    • deflate


    • br. [Brotli\[1\]](https://www.rfc-editor.org/rfc/rfc7932.html)[;](#index_split_001.html#p102)
    newer but less widely supported.


    The method may be followed by an optional weight to indicate its priority. See
    the RFC


    for the exact syntax.


    Accept-Encoding: deflate, gzip;q=1.0


    **Compress with \`Content-Encoding\`**


    If the server chooses one of the suggested compression methods, it will report
    back with Content-Encoding.


    Content-Encoding: gzip


    More than one Content-Encoding can be applied. However, there is no practical
    use for this.


    Some content types are already compressed, such as PNG, JPG, or ZIP. It’s best
    to exclude them from compression, as they are not compressible.


    [\[1\]https://www.rfc-editor.org/rfc/rfc7932.html](https://www.rfc-editor.org/rfc/rfc7932.html)


    97


    2024-02-02


    12\. Compression & the Stream API


    **Compression and \`Content-Length\`**


    The purpose of Content-Length does not change with respect to compression, that
    is the length of the HTTP body, not the length of the uncompressed data.


    When compression is applied on the fly, the compressed size is not known in advance
    (unless the entire output is buffered, which does not work for large content),
    so we need to also use chunked encoding.


    **Compression and Caching**


    Compression is CPU intensive, it is not always applied on the fly; a caching proxy
    can cache and serve compressed responses (if the Accept-Encoding allows it).


    If a caching proxy doesn’t care about compression, it must at least not mix responses
    from different compression methods. That’s the purpose of the Vary header field,
    to inform proxies that the response will vary if certain header fields are used.


    For example, if Vary: content-encoding is used, the cache item will be keyed with
    the value of Content-Encoding, so the cache lookup will take that into account.


    **Compressed Uploads**


    Due to the nature of content negotiation, there is no standard way to compress
    the request body. If a client does this with Content-Encoding, it is probably
    the application, rather than the HTTP server, to decompress the request.


    **Compression and Range Requests**


    Content-Encoding is a property of content. Therefore, the Range header field works
    on the compressed data, which is NOT the desired behavior.


    Common practice is not to compress when serving range responses.


    **Compress with \`Transfer-Encoding\`**


    There is another [rarely\[2\]](https://bugs.chromium.org/p/chromium/issues/detail?id=94730)
    [supported\[3\]](https://bugzilla.mozilla.org/show_bug.cgi?id=68517) way to do
    compression. Transfer-Encoding is usually used for chunked encoding, it can also
    compress the payload.


    Transfer-Encoding: gzip, chunked


    [\[2\]https://bugs.chromium.org/p/chromium/issues/detail?id=94730](https://bugs.chromium.org/p/chromium/issues/detail?id=94730)


    [\[3\]https://bugzilla.mozilla.org/show\_bug.cgi?id=68517](https://bugzilla.mozilla.org/show_bug.cgi?id=68517)


    [Report an Error | Ask a Question](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)


    98


    2024-02-02


    12\. Compression & the Stream API


    The above header field means that the payload is first gzipped and then chunked.


    What’s the difference from Content-Encoding? The difference is that Transfer-Encoding
    is NOT a property of the content, so range requests can work with Transfer-Encoding
    but not with Content-Encoding.'
