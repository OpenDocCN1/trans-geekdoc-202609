    actually more practical and thus superior, but unfortunately implementations have
    gone the other way.


    The TE header field is for negotiating Transfer-Encoding, as summarized below.


    Table 1: HTTP compression negotiation.


    Request header Response header


    Range


    Widely used?


    Accept-Encoding


    Content-Encoding


    No


    Yes


