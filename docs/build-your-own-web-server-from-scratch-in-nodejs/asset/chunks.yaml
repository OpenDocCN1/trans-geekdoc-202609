    // read data. returns an empty buffer after EOF.


    read: () => Promise<Buffer>,


    };


    The payload body can be arbitrarily long, it may not even fit in memory, thus
    we have to use the read() function to read from it instead of a simple Buffer.
    The read() function follows the convention of the soRead() function — the end
    of data is signaled by an empty Buffer.


    And when using chunked encoding, the length of the body is not known, which is
    another reason why this interface is needed.


    **Step 2: The Server Loop**


    The server loop follows the pattern from the previous chapter. Except that the
    cutMessage() function only parses the HTTP header; the payload body is expected
    to be read while handling the request, or discarded after handling the request.
    In this way, we don’t store the entire payload body in memory.


    async function serveClient(conn: TCPConn): Promise<void> {


    const buf: DynBuf = {data: Buffer.alloc(0), length: 0};


    while (true) {


    // try to get 1 request header from the buffer


    const msg: null|HTTPReq = cutMessage(buf);


    if (!msg) {


    // need more data


    const data = await soRead(conn);


    bufPush(buf, data);


    // EOF?


    if (data.length === 0 && buf.length === 0) {


    return; // no more requests


    }


    if (data.length === 0) {


    throw new HTTPError(400, ''Unexpected EOF.'');


    }


    // got some data, try it again.


    continue;


    }


    // process the message and send the response


    const reqBody: BodyReader = readerFromReq(conn, buf, msg);


