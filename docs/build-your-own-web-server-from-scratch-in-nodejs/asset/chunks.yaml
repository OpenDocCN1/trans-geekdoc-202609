    \ problems are often masked by mountains of callbacks. Fortunately, with the addition\
    \ of `async/await`, these primitives can be copied to JS. But we have to first\
    \ create them using promises and callbacks.\n\n### Step 1: Analyze the Problem\n\
    \nLet’s consider a blocking queue with just `push` and `pop`, and no buffering\
    \ capacity. The queue should be usable with multiple producers and multiple consumers,\
    \ which is more versatile than generators.\n\n```typescript\ntype Queue<T> = {\n\
    \  pushBack(item: T): Promise<void>;\n  popFront(): Promise<T>;\n};\n```\n\nCreating\
    \ a promise results in the `resolve` callback that is used to fulfill it later.\
    \ A producer should either wait for a consumer or wake up a waiting consumer.\n\
    \n- If no consumer is waiting, it stores a callback somewhere. A future consumer\
    \ will invoke the callback to take the data and fulfill the producer.\n- If there\
    \ are waiting consumers, fulfill one of them by invoking its callback.\n\nThe\
    \ situation for a consumer is similar:\n\n- It should either store a callback\
    \ to wait for a producer,\n- or invoke the callback of a waiting producer.\n\n\
    ### Step 2: Push and Pop\n\nThere can be multiple waiting producers or consumers,\
    \ so we need to store their callbacks in a list.\n\nFor consumers, just store\
    \ their own `resolve` callback to receive the data.\n\nFor producers, the callback\
    \ does 2 things:\n\n1. Take the consumer’s callback to fulfill it (with the data).\n\
    2. Fulfill its own promise.\n\n```typescript\n// a multi-producer, multi-consumer,\
    \ and 0-capacity queue.\nfunction createQueue<T>(): Queue<T> {\n  type Taker =\
    \ (item: T) => void;\n  // fulfill a consumer\n  type Giver = (take: Taker) =>\
    \ void;\n  // wake up a producer\n  const producers: Giver[] = [];\n  const consumers:\
    \ Taker[] = [];\n\n  return {\n    pushBack: (item: T): Promise<void> => {\n \
    \     return new Promise<void>((done: () => void) => {\n        const give: Giver\
    \ = (take: Taker) => {\n          take(item);\n          done();\n        };\n\
    \n        if (consumers.length) { // consumers are waiting\n          give(consumers.shift()!);\n\
    \        } else {\n          // wait for a producer\n          producers.push(give);\n\
    \        }\n      });\n    },\n    popFront: Promise<T> => {\n      return new\
    \ Promise<T>((take: Taker) => {\n        if (producers.length) { // producers\
    \ are waiting\n          producers.shift()!(take);\n        } else {\n       \
    \   // wait for a consumer\n          consumers.push(take);\n        }\n     \
    \ });\n    },\n  };\n}\n```\n\n### Step 3: Close the Queue\n\nThe `close()` method\
    \ will come handy later.\n\n```typescript\ntype Queue<T> = {\n  pushBack(item:\
    \ T): Promise<void>; // throws if closed\n  popFront(): Promise<T>;          \
    \ // returns null if closed\n  close(): void;\n};\n```\n\nSince we may throw exceptions\
    \ at producers, the `reject` callback is also stored.\n\n```typescript\ntype Rejector\
    \ = (err: Error) => void;\nconst producers: { give: Giver, reject: Rejector }[]\
    \ = [];\nlet closed = false;\n```\n\nWe will also remember the `closed` state.\
    \ This state should be checked before pushing or popping. And closing a queue\
    \ unblocks everyone.\n\n```typescript\nclose: () => {\n  // unblock any waiting\
    \ producers or consumers\n  closed = true;\n  while (producers.length) {\n   \
    \ producers.shift()!.reject(new Error('queue closed'));\n  }\n  while (consumers.length)\
    \ {\n    consumers.shift()!(null);\n  }\n}\n```\n\n### Step 4: Add a Buffer\n\n\
    The queue is sufficient for our purposes. For some other cases, the queue may\
    \ need to buffer a bounded amount of items without blocking producers. This is\
    \ left to you as an exercise.\n\n```typescript\nfunction createQueue<T>(capacity:\
    \ number): Queue<T>;\n```\n\n## WebSocket Server\n\n### Step 1: Design the Message\
    \ Interface\n\nWebSocket messages are represented to applications as `WSMsg` type.\
    \ The payload data is consumed using the `read()` function like the `BodyReader`\
    \ interface to support arbitrarily large messages and receiving data on the fly.\n\
    \n```typescript\nconst WS_DATA_TEXT = 0x01;\nconst WS_DATA_BINARY = 0x02;\n\n\
    // WebSocket message type\ntype WSMsg = {\n  type: number;   // WS_DATA_TEXT,\
    \ WS_DATA_BINARY\n  length: number; // in bytes\n  read: () => Promise<Buffer>;\
    \ // empty after EOF\n};\n```\n\nWhile the `read()` function does not require\
    \ the whole message to be stored in memory, it does have a downside: the application\
    \ must ensure that the message data is consumed, otherwise the next frame won’t\
    \ be parsed.\n\n### Step 2: Design the Application Interface\n\n`WSServer` is\
    \ the application interface for sending and receiving data messages.\n\n```typescript\n\
    type WSServer = {\n  send(msg: WSMsg): Promise<void>; // supports multiple producers\n\
    \  recv(): Promise<null|WSMsg>;     // null after EOF\n  close(): void;\n};\n\
    ```\n\nThis is similar to what we do with a socket — read from it and write to\
    \ it. Except that concurrent reads and writes have valid use cases and must be\
    \ supported:\n\n- Concurrent writes: Multiple app tasks generate messages independently.\n\
    - Concurrent reads: Concurrent message processing with a task pool.\n\nYou can\
    \ also use callbacks to deliver messages instead of actively reading them. But\
    \ this makes the backpressure less obvious, because you’ll also need the `pause()`\
    \ and `resume()` methods. This is why we ditched callback-based IO early on.\n\
    \n### Step 3: Design the Server Tasks\n\nUnlike request-response, sending and\
    \ receiving are independent. So we need:\n\n- A task to parse the incoming byte\
    \ stream: `wsServerRecv()`.\n- A task to write messages to the socket: `wsServerSend()`.\n\
    \nThese two tasks run concurrently with the application tasks. Two queues are\
    \ used to connect the two tasks to the application (send and receive). Another\
    \ queue is used to connect `wsServerSend()` to the socket.\n\n`App <= qrecv (Queue)\
    \ <= wsServerRecv <= reqBody (BodyReader)`\n`App => qsend (Queue) => wsServerSend\
    \ => qsock (Queue) => resBody (BodyReader)`\n\nThere can be multiple app tasks\
    \ producing or consuming with a single WebSocket, but the tasks for reading and\
    \ writing to the socket must be sequential. This is an example of solving concurrency\
    \ problems by passing data.\n\n### Step 4: Start Server Tasks\n\nLet’s code up\
    \ the previous step.\n\n```typescript\nfunction createWSServer(reqBody: BodyReader):\
    \ [WSServer, BodyReader] {\n  const qrecv: Queue<WSMsg> = createQueue<WSMsg>();\n\
    \  const qsend: Queue<WSMsg> = createQueue<WSMsg>();\n\n  const ws: WSServer =\
    \ {\n    send: qsend.pushBack,   // throws if closed\n    recv: qrecv.popFront,\
    \   // returns null if closed\n    close: (): void => {\n      qsend.close();\
    \ // generates a WS_CTRL_CLOSE\n      qrecv.close();\n    },\n  };\n\n  // task\
    \ 1: reading from the socket\n  wsServerRecv(reqBody, qrecv, ws)\n    .finally(ws.close)\
    \ // closes the WS API\n    .catch(console.error); // no await\n\n  // task 2:\
    \ writing to the socket\n  const qsock: Queue<Buffer> = createQueue<Buffer>();\n\
    \  wsServerSend(qsend, qsock)\n    .finally(ws.close) // closes the WS API\n \
    \   .finally(qsock.close) // closes the socket\n    .catch(console.error); //\
    \ no await\n\n  const resBody: BodyReader = {\n    length: -1,\n    read: async\
    \ () => await qsock.popFront() || Buffer.from(''),\n  };\n\n  return [ws, resBody];\n\
    }\n```\n\nThe `finally()` callback registered on the promise behaves like a `try-finally`\
    \ block. This is used to close queues so that tasks won’t hang in a queue forever.\n"
  trans: "\n\nNode.JS 并不包含这些同步原语，并发问题通常被掩盖在大量的回调中。幸运的是，随着 `async/await` 的加入，这些原语可以复制到\
    \ JS 中。但我们必须先使用 promises 和回调创建它们。\n\n### 步骤 1：分析问题\n\n考虑一个仅具有 `push` 和 `pop` 且没有缓冲能力的阻塞队列。该队列应该被多个生产者和多个消费者使用，这比生成器更通用。\n\
    \n```typescript\ntype Queue<T> = {\n  pushBack(item: T): Promise<void>;\n  popFront():\
    \ Promise<T>;\n};\n```\n\n创建一个 promise 会产生一个 `resolve` 回调，用于稍后完成它的状态。生产者要么等待消费者，要么唤醒一个正在等待的消费者。\n\
    \n- 如果没有消费者在等待，它会将回调存储在某处。未来的消费者将调用该回调来获取数据并完成生产者。\n- 如果有正在等待的消费者，则通过调用其回调来完成其中一个。\n\
    \n消费者的情况也类似：\n\n- 它要么存储一个回调来等待生产者，\n- 或者调用正在等待的生产者的回调。\n\n### 步骤 2：Push 和 Pop\n\
    \n可能会有多个等待中的生产者或消费者，因此我们需要在列表中存储它们的回调。\n\n对于消费者，只需存储它们自己的 `resolve` 回调以接收数据。\n\
    \n对于生产者，回调负责做两件事：\n\n1. 获取消费者的回调并完成它（带上数据）。\n2. 完成它自己的 promise。\n\n```typescript\n\
    // 一个多生产者、多消费者且容量为 0 的队列。\nfunction createQueue<T>(): Queue<T> {\n  type Taker\
    \ = (item: T) => void;\n  // 完成消费者任务\n  type Giver = (take: Taker) => void;\n\
    \  // 唤醒生产者\n  const producers: Giver[] = [];\n  const consumers: Taker[] = [];\n\
    \n  return {\n    pushBack: (item: T): Promise<void> => {\n      return new Promise<void>((done:\
    \ () => void) => {\n        const give: Giver = (take: Taker) => {\n         \
    \ take(item);\n          done();\n        };\n\n        if (consumers.length)\
    \ { // 消费者正在等待\n          give(consumers.shift()!);\n        } else {\n      \
    \    // 等待生产者\n          producers.push(give);\n        }\n      });\n    },\n\
    \    popFront: Promise<T> => {\n      return new Promise<T>((take: Taker) => {\n\
    \        if (producers.length) { // 生产者正在等待\n          producers.shift()!(take);\n\
    \        } else {\n          // 等待消费者\n          consumers.push(take);\n     \
    \   }\n      });\n    },\n  };\n}\n```\n\n### 步骤 3：关闭队列\n\n`close()` 方法稍后会非常有用。\n\
    \n```typescript\ntype Queue<T> = {\n  pushBack(item: T): Promise<void>; // 如果关闭则抛出异常\n\
    \  popFront(): Promise<T>;           // 如果关闭则返回 null\n  close(): void;\n};\n```\n\
    \n由于我们可能在生产者处抛出异常，也存储了 `reject` 回调。\n\n```typescript\ntype Rejector = (err: Error)\
    \ => void;\nconst producers: { give: Giver, reject: Rejector }[] = [];\nlet closed\
    \ = false;\n```\n\n我们还会记住 `closed` 状态。在推入或弹出之前应该检查此状态。关闭队列会解阻塞所有人。\n\n```typescript\n\
    close: () => {\n  // 解阻塞任何正在等待的生产者或消费者\n  closed = true;\n  while (producers.length)\
    \ {\n    producers.shift()!.reject(new Error('queue closed'));\n  }\n  while (consumers.length)\
    \ {\n    consumers.shift()!(null);\n  }\n}\n```\n\n### 步骤 4：添加缓冲区\n\n该队列对于我们的目的已经足够。对于其他某些情况，队列可能需要缓冲固定数量的项而不阻塞生产者。这留给你们作为一个练习。\n\
    \n```typescript\nfunction createQueue<T>(capacity: number): Queue<T>;\n```\n\n\
    ## WebSocket 服务器\n\n### 步骤 1：设计消息接口\n\nWebSocket 消息在应用中表示为 `WSMsg` 类型。负载数据使用 `read()`\
    \ 函数进行，类似于 `BodyReader` 接口，支持任意大小的消息并实时接收数据。\n\n```typescript\nconst WS_DATA_TEXT\
    \ = 0x01;\nconst WS_DATA_BINARY = 0x02;\n\n// WebSocket 消息类型\ntype WSMsg = {\n\
    \  type: number;   // WS_DATA_TEXT, WS_DATA_BINARY\n  length: number; // 字节\n\
    \  read: () => Promise<Buffer>; // EOF 后为空\n};\n```\n\n虽然 `read()` 函数不需要将整个消息都存储在内存中，但它确实有一个缺点：应用程序必须确保消息数据被消费，否则下一帧将无法解析。\n\
    \n### 步骤 2：设计应用接口\n\n`WSServer` 是用于发送和接收数据消息的应用接口。\n\n```typescript\ntype WSServer\
    \ = {\n  send(msg: WSMsg): Promise<void>; // 支持多个生产者\n  recv(): Promise<null|WSMsg>;\
    \     // EOF 后返回 null\n  close(): void;\n};\n```\n\n这与我们对 socket 进行的操作类似——从它读取并向它写入。只不过并发读写有合法的用场景且必须被支持：\n\
    \n- 并发写入：多个应用任务独立生成消息。\n- 并发读取：使用任务池进行并发消息处理。\n\n你也可以使用回调来传递消息而不是主动读取它们。但这会让背压（backpressure）变得不明显，因为你还需要\
    \ `pause()` 和 `resume()` 方法。这就是为什么我们早期就放弃了基于回调的 IO。\n\n### 步骤 3：设计服务器任务\n\n与请求-响应模式不同，发送和接收是独立的。因此，我们需要：\n\
    \n- 一个解析入字节字节流的任务：`wsServerRecv()`。\n- 一个向 socket 写入消息的任务：`wsServerSend()`。\n\n\
    这两个任务与应用任务并发运行。使用两个队列连接这两个任务与应用（发送和接收）。另一个队列用于连接 `wsServerSend()` 到 socket。\n\n\
    `App <= qrecv (Queue) <= wsServerRecv <= reqBody (BodyReader)`\n`App => qsend\
    \ (Queue) => wsServerSend => qsock (Queue) => resBody (BodyReader)`\n\n可能会有多个应用任务通过单个\
    \ WebSocket 产生或消费数据，但读取和写入 socket 的任务必须是顺序的。这是一个通过传递数据解决并发问题的示例。\n\n### 步骤 4：启动服务器任务\n\
    \n让我们为上一步步骤编写代码。\n\n```typescript\nfunction createWSServer(reqBody: BodyReader):\
    \ [WSServer, BodyReader] {\n  const qrecv: Queue<WSMsg> = createQueue<WSMsg>();\n\
    \  const qsend: Queue<WSMsg> = createQueue<WSMsg>();\n\n  const ws: WSServer =\
    \ {\n    send: qsend.pushBack,   // 如果关闭则抛出\n    recv: qrecv.popFront,   // 如果关闭则返回\
    \ null\n    close(): void => {\n      qsend.close(); // 生成 WS_CTRL_CLOSE\n   \
    \   qrecv.close();\n    },\n  };\n\n  // 任务 1：从 socket 读取\n  wsServerRecv(reqBody,\
    \ qrecv, ws)\n    .finally(ws.close) // 关闭 WS API\n    .catch(console.error);\
    \ // 无等待\n\n  // 任务 2：向 socket 写入\n  const qsock: Queue<Buffer> = createQueue<Buffer>();\n\
    \  wsServerSend(qsend, qsock)\n    .finally(ws.close) // 关闭 WS API\n    .finally(qsock.close)\
    \ // 关闭 socket\n    .catch(console.error); // 无等待\n\n  const resBody: BodyReader\
    \ = {\n    length: -1,\n    read: async () => await qsock.popFront() || Buffer.from(''),\n\
    \  };\n\n  return [ws, resBody];\n}\n```\n\n注册在 promise 上的 `finally()` 回调行为类似于\
    \ `try-finally` 块。这用于关闭队列，以便任务不会永远挂在队列中。\n\n"
