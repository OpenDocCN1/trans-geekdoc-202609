    Transfer-Encoding


    Supported No


    **12.2 Data Processing with Pipes**


    **Data Processing and IO**


    We’ll use the built-in [zlib\[4\]](https://nodejs.org/api/zlib.html) module to
    compress the response body. There are 2 types of API for compressing data, the
    simplest is to supply the input as a single buffer and return the compressed data
    as a single buffer. This won’t work if the input is large because it may not fit
    in memory. And the latency will be bad even if memory is not a concern.


    zlib.gzip(buffer, callback);


    The second type is to produce output *on the fly*, you first initiate the stateful
    compressor object, then you feed the compressor input, the compressor will produce
    output simultaneously.


    const obj = zlib.createGzip();


    // read from it & write to it


    The compressor has backpressure, so it won’t blow up memory if used properly.
    And you must drain the output simultaneously to keep the input flowing.


    The way to process data on the fly is with stateful processors that can *read*
    and *write* simultaneously, which is similar to what we do with a socket.


    [\[4\]https://nodejs.org/api/zlib.html](https://nodejs.org/api/zlib.html)


