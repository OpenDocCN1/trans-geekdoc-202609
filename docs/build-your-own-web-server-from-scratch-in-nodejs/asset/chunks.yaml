- raw: 'Promises can be viewed as another way to manage callbacks. These are also
    described as *asynchronous*, meaning that the result is delivered via a callback.
    These APIs do not block the event loop because the JS code doesn’t wait for the
    result; instead, the JS code returns to the runtime, and when the result is ready,
    the runtime invokes the callback to continue your program.


    The opposite is the *synchronous* API, which blocks the calling OS thread to wait
    for the result. For example, let’s take a look at the documentation of the fs
    module, file APIs are available in [all 3 types\[3\]](https://nodejs.org/api/fs.html)[.](#index_split_000.html#p22)


    // promise


    filehandle.read(\[options\]);


    // callback


    fs.read(fd\[, options\], callback);


    // synchronous, do not use!


    fs.readSync(fd, buffer\[, options\]);


    The synchronous API is what you do NOT use in network applications since it blocks
    the event loop. They exist for some simple use cases (like scripting) that do
    not depend on the event loop at all.


    **Event-Based Programming Beyond Networking**


    IO is more than disk files and networking. In GUI systems, user input from the
    mouse and keyboard is also IO. And event loops are not unique to the Node.js runtime;
    Web browsers and all other GUI applications also use event loops under the hood.
    You can transfer your experience in GUI programming to network programming and
    vice versa.


    [\[3\]https://nodejs.org/api/fs.html](https://nodejs.org/api/fs.html)


