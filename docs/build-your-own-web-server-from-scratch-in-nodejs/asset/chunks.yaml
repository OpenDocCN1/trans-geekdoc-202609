    ## Step 6: Parse Frames From the Socket\n\n`wsServerRecv()` loops for each frame\
    \ and feeds `WSMsgs` into the output queue.\n\n```javascript\n// parse WS frames\
    \ from the client\nasync function wsServerRecv(\n  reqBody: BodyReader, qrecv:\
    \ Queue<WSMsg>, ws: WSServer): Promise<void>;\n```\n\nWe’ll use another queue\
    \ to send frame data to the `read()` function of a `WSMsg`.\n\n```javascript\n\
    // create a WSMsg\nconst q = data = createQueue<Buffer>();\nconst msg: WSMsg =\
    \ {\n  // omitted ...\n  read: async () => await q.popFront() || Buffer.from(''),\n\
    };\nawait qrecv.pushBack(msg);\n// omitted. feed payload data into q ...\n```\n\
    \n[Report an Error | Ask a Question](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)\n\
    \n122\n2024-02-02\n13. WebSocket & Concurrency\n\nA data message can span multiple\
    \ frames, so we need to store the queue outside the loop and feed the queue as\
    \ more frames arrive. Remember to make sure the queue is closed, either when the\
    \ `FIN` flag is set or when exiting the loop.\n\n```javascript\n// provide data\
    \ to the current message\nlet data: null|Queue<Buffer> = null;\ntry {\n  // loop\
    \ for each frame\n  while (true) {\n    // omitted ...\n  }\n} finally {\n  //\
    \ close the message data in case the app is blocking on it.\n  data?.close();\n\
    }\n```\n\n## Step 7: Integrate with the HTTP Server\n\nA request is handled either\
    \ as a WebSocket or as an HTTP request. This is decided in `getWSApp()`, which\
    \ returns an application logic function or null.\n\n```javascript\ntype WSApplication\
    \ = (ws: WSServer) => Promise<void>;\n// map the request to the WS app.\nfunction\
    \ getWSApp(req: HTTPReq): null|WSApplication\n```\n\nWebSockets are handled differently:\n\
    • The request is handled by `handleWS()`, which calls the application function.\n\
    • The rest of the socket data is passed to the protocol without further processing\
    \ by `readerFromEOF()` function.\n• The response is written directly to the socket.\
    \ So don’t mess it up with response compression, extra header fields, and chunked\
    \ encoding.\n\n```javascript\n// process the message and send the response\nlet\
    \ reqBody: BodyReader;\nlet res: HTTPRes;\nconst wsapp: null|WSApplication = getWSApp(msg);\n\
    ```\n\n[Report an Error | Ask a Question](https://forms.gle/UKo4bncUnuMGBrTM7)\
    \ @ [build-your-own.org](https://build-your-own.org)\n\n123\n2024-02-02\n13. WebSocket\
    \ & Concurrency\n\n```javascript\nif (wsapp) {\n  // upgrade to WebSocket\n  reqBody\
    \ = readerFromEOF(conn, buf);\n  res = handleWS(msg, reqBody, wsapp);\n} else\
    \ {\n  // normal HTTP connection\n  reqBody = readerReq(conn, buf, msg);\n  res\
    \ = handleReq(msg, reqBody);\n}\ntry {\n  if (!wsapp) {\n    enableCompression(msg,\
    \ res);\n  }\n  if (msg.method !== 'HEAD') {\n    // omit the body\n    await\
    \ writeHTTPBody(conn, res);\n  }\n} finally {\n  // cleanups\n  await res.body?.close();\n\
    }\nif (msg.version === '1.0' || wsapp) {\n  // close the connection for HTTP/1.0\
    \ or WebSocket\n  return;\n}\n```\n\nThe `handleWS()` function puts it all together:\n\
    • Launch tasks to handle the protocol.\n• Launch the application task.\n• Return\
    \ the Upgrade header.\n\n```javascript\nasync function handleWS(\n  req: HTTPReq,\
    \ reqBody: BodyReader, app: WSApplication): Promise<HTTPRes>\n{\n  // handle the\
    \ WS protocol\n  const [ws, resBody]: [WSServer, BodyReader] = createWSServer(reqBody);\n\
    \  // launch the application\n  app(ws).finally(ws.close()).catch(console.error);\n\
    \  // no await\n  // Switching Protocols\n  const key: Buffer = field.get(req.headers,\
    \ 'Sec-WebSocket-Key')!;\n  return {\n    code: 101,\n    headers: [\n      Buffer.from('Upgrade:\
    \ websocket'),\n      Buffer.from('Connection: Upgrade'),\n      Buffer.from(`Sec-WebSocket-Accept:\
    \ ${wsKeyAccept(key)}`),\n    ],\n    body: resBody,\n  };\n}\n```\n\n## Step\
    \ 8: Test and Debug\n\nUse a web browser to create WebSockets for testing. Remember\
    \ to use packet capturing tools. Wireshark can disassemble the protocol, so you\
    \ can use it to\n• Learn what the correct format looks like if you failed to parse\
    \ the frames.\n• See what’s wrong with the frames you’ve generated.\n\n## 13.6\
    \ Discussion: WebSocket in the Browser\n\nWebSocket is symmetric with respect\
    \ to the functionality of both peers. So the application interface should be usable\
    \ for both clients and servers. Let’s explore the WebSocket API in the browser\
    \ and compare it to ours.\n\n### No Backpressure for WebSocket in the Browser\n\
    \nThe most important difference is that the browser API is callback-based. The\
    \ browser invokes the [event handler[6](https://developer.mozilla.org/en-US/docs/Web/API/WebSocket/message_event)\
    \ as messages arrive. This is similar to `net.Socket` in Node.JS, except that\
    \ there are `pause()` and `resume()` methods, so backpressure is impossible for\
    \ receiving.\n\nFor sending messages, the `send()` method[7](https://developer.mozilla.org/en-US/docs/Web/API/WebSocket/send)\
    \ just buffers the data and returns nothing. There is an attribute `bufferedAmount`\
    \ to tell the buffer size, so applications can still control backpressure.\n\n\
    There is an alternative [API design[8](https://developer.chrome.com/docs/capabilities/web-apis/websocketstream)\
    \ that uses `async/await` for reading and writing, which is the direction we took.\n\
    \n[6] https://developer.mozilla.org/en-US/docs/Web/API/WebSocket/message_event\n\
    [7] https://developer.mozilla.org/en-US/docs/Web/API/WebSocket/send\n[8] https://developer.chrome.com/docs/capabilities/web-apis/websocketstream\n\
    \n125\n2024-02-02\n13. WebSocket & Concurrency\n\n### Application Level Backpressure\n\
    \nMissing backpressure is probably the No. 2 mistake in network programming. But\
    \ even if backpressure is impossible in the browser, applications can implement\
    \ it at a higher level:\n• The consumer acknowledges processed messages to the\
    \ producer.\n• The producer uses the acknowledgements to implement flow control.\n\
    \nThere are messaging protocols that run on top of WebSocket that implement backpressure,\
    \ such as [RSocket[9](https://rsocket.io/about/protocol#flow-control).](#index_split_001.html#p131)\n\
    \n### Message Size is Limited\n\nWhile you can treat a WebSocket message as an\
    \ unlimited stream by using fragmented frames, most software, including browsers,\
    \ stores the message as a single buffer. So there is a limit to both message size\
    \ and frame size. (We don’t have these limits because we use the `read()` function\
    \ to consume data on the fly).\n\nApplications that send large chunks of data\
    \ over WebSockets should have a fragmentation mechanism to keep the message size\
    \ small.\n\n## 13.7 Conclusion: What We Have Learned\n\nImportant topics since\
    \ our basic HTTP server:\n• HTTP semantics:\n"
  trans: "\n注意：如果你没有 `await` 一个异步函数，那么使用 `catch()` 回调来捕获异常是关重要的，否则你的程序将会崩溃。在这种情况下，我们简单地记录了并忽略了异常，但有时你需要传播错误。\n\
    \n[报告错误 | 提问](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)\n\
    \n121\n2024-02-02\n\n# 13. WebSocket 与并发\n\n## 第 5 步：向 Socket 消息\n\n`wsServerSend()`\
    \ 任务从队列中获取 `WSMsg` 输入，并将数据输出到 `qsock` 队列，该队列由 `BodyReader` 提取。帧代码已省略。\n\n```javascript\n\
    // 格式化 WS 消息并将其发送到 socket\nasync function wsServerSend(\n  qsend: Queue<WSMsg>,\
    \ qsock: Queue<Buffer>): Promise<void>\n{\n  while (true) {\n    const msg = await\
    \ qsend.popFront();\n    if (!msg) { // 关闭它\n      // 省略。发送一个“close”帧 ...\n  \
    \    break;\n    }\n    // 省略。将帧数据写入 qsock ...\n  }\n}\n```\n\n注意这与使用 Unix 管道有多么相似：\n\
    • 输入和输出的统一接口。\n• 可组合性。\n\n## 第 6 步：从 Socket 解析帧\n\n`wsServerRecv()` 为每个帧进行循环，并将\
    \ `WSMsgs` 馈送到输出队列。\n\n```javascript\n// 从客户端解析 WS 帧\nasync function wsServerRecv(\n\
    \  reqBody: BodyReader, qrecv: Queue<WSMsg>, ws: WSServer): Promise<void>;\n```\n\
    \n我们将使用另一个队列将帧数据发送到 `WSMsg` 的 `read()` 函数中。\n\n```javascript\n// 创建一个 WSMsg\n\
    const q = data = createQueue<Buffer>();\nconst msg: WSMsg = {\n  // 省略 ...\n \
    \ read: async () => await q.popFront() || Buffer.from(''),\n};\nawait qrecv.pushBack(msg);\n\
    // 省略。将负载数据馈送到 q ...\n```\n\n[报告错误 | 提问](https://forms.gle/UKo4bncUnuMGBrTM7)\
    \ @ [build-your-own.org](https://build-your-own.org)\n\n122\n2024-02-02\n13. WebSocket\
    \ 与并发\n\n一个数据消息可以跨越多个帧，因此我们需要在循环之外存储队列，并在更多帧到达时馈送队列。请记住在设置 `FIN` 标志或退出循环时，确保队列已关闭。\n\
    \n```javascript\n// 为当前消息提供数据\nlet data: null|Queue<Buffer> = null;\ntry {\n \
    \ // 为每个帧进行循环\n  while (true) {\n    // 省略 ...\n  }\n} finally {\n  // 如果应用阻塞在数据上，则关闭消息数据。\n\
    \  data?.close();\n}\n```\n\n## 第 7 步：与 HTTP 服务器集成\n\n请求要么作为 WebSocket 处理，要么作为\
    \ HTTP 请求处理。这在 `getWSApp()` 中决决定，它返回一个应用逻辑函数或 null。\n\n```javascript\ntype WSApplication\
    \ = (ws: WSServer) => Promise<void>;\n// 将请求映射到 WS 应用。\nfunction getWSApp(req:\
    \ HTTPReq): null|WSApplication\n```\n\nWebSockets 的处理方式不同：\n• 请求由 `handleWS()`\
    \ 处理，它调用应用函数。\n• socket 的其余部分数据将传递给协议，而不通过 `readerFromEOF()` 函数进行进一步处理。\n• 响应直接写入\
    \ socket。因此，不要用响应压缩、额外的标头字段和分块编码来搞乱它。\n\n```javascript\n// 处理消息并发送响应\nlet reqBody:\
    \ BodyReader;\nlet res: HTTPRes;\nconst wsapp: null|WSApplication = getWSApp(msg);\n\
    ```\n\n[报告错误 | 提问](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)\n\
    \n123\n2024-02-02\n13. WebSocket 与并发\n\n```javascript\nif (wsapp) {\n  // 升级到\
    \ WebSocket\n  reqBody = readerFromEOF(conn, buf);\n  res = handleWS(msg, reqBody,\
    \ wsapp);\n} else {\n  // 普通 HTTP 连接\n  reqBody = readerReq(conn, buf, msg);\n\
    \  res = handleReq(msg, reqBody);\n}\ntry {\n  if (!wsapp) {\n    enableCompression(msg,\
    \ res);\n  }\n  if (msg.method !== 'HEAD') {\n    // 省略主体\n    await writeHTTPBody(conn,\
    \ res);\n  }\n} finally {\n  // 清理\n  await res.body?.close();\n}\nif (msg.version\
    \ === '1.0' || wsapp) {\n  // 关闭 HTTP/1.0 或 WebSocket 的连接\n  return;\n}\n```\n\
    \n`handleWS()` 函数将这一切整合在一起：\n• 启动任务处理协议。\n• 启动应用任务。\n• 返回 Upgrade 标头。\n\n```javascript\n\
    async function handleWS(\n  req: HTTPReq, reqBody: BodyReader, app: WSApplication):\
    \ Promise<HTTPRes>\n{\n  // 处理 WS 协议\n  const [ws, res]: [WSServer, BodyReader]\
    \ = createWSServer(req);\n  // 启动应用\n  await app(ws).catch(console.error);\n \
    \ // 切换协议\n  return {\n    code: 101,\n    headers: [\n      Buffer.from('Upgrade:\
    \ websocket'),\n      Buffer.from('Connection: Upgrade'),\n      Buffer.from(`Sec-WebSocket-Accept:\
    \ ${key}`),\n    ],\n    body: resBody,\n  };\n}\n```\n\n## 第 8 步：测试与调试\n\n使用浏览器创建\
    \ WebSocket。记得使用数据抓包工具。Wireshark 可以拆解帧，所以你可以\n• 学习帧的正确格式。\n• 查看你生成的帧存在什么问题。\n\n\
    ## 13.6 讨论：浏览器中的 WebSocket\n\nWebSocket 在客户端和服务器的功能上是对称的。因此应用接口 适用于双方。让我们探讨浏览器中的\
    \ WebSocket。\n\n### 浏览器中没有背压\n\n最重要的区别是浏览器 API 是基于回调的。浏览器调用事件[6](https://developer.mozilla.org/en-US/docs/Web/API/message_event)\
    \ 当消息到达。这与 Node.JS 的 `net.Socket` 相似，只是它有 `pause()` 和 `resume()` 方法，因此接收端是可以背压的。\n\
    \n对于发送消息，`send()` 方法[7](https://developer.mozilla.org/en-US/docs/Web/API/send)\
    \ 只是缓存数据且不返回内容。有一个 `bufferedAmount` 属性告知缓冲区大小，因此应用程序仍然可以控制背压。\n\n存在另一种 API 设计[8](https://developer.chrome.com/docs/capabilities/web-apis/websocketstream)\
    \ 使用 `async/await` 进行读写，这是我们采取的方向。\n\n[6] https://developer.mozilla.org/en-US/docs/Web/API/message_event\n\
    [7] https://developer.mozilla.org/en-US/docs/Web/API/send\n[8] https://developer.chrome.com/docs/capabilities/web-apis/websocketstream\n\
    \n125\n2024-02-02\n13. WebSocket 与并发\n\n### 应用层背压\n\n缺少背压可能是网络编程中的第二大错误。但即使浏览器中无法实现背压，应用程序也可以在更高层实现：\n\
    • 消费者向生产者确认已处理的消息。\n• 生产者根据确认信息来实现流量控制。\n\n运行在 WebSocket 之上的消息协议可以实现背压，例如 [RSocket[9](https://rsocket.io/about/protocol#flow-control)].](#index_split_001.html#p131)\n\
    \n### 消息大小限制\n\n虽然可以通过分帧将 WebSocket 消息视为无限流，但大多数软件（包括浏览器）将消息存储在单个缓冲区。因此消息大小和帧大小都有限制。（我们没有这些限制，因为我们使用\
    \ `read()` 函数即时消费数据）。\n\n在 WebSocket 上发送大块数据的应用程序应该有一个分片机制，以保持较小的消息。\n\n## 13.7\
    \ 结论：我们学到了什么\n\n自基础 HTTP 服务器以来重要的主题：\n• HTTP 语义：\n\n"
