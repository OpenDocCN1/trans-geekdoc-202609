    **CHAPTER 11**


    **HTTP Caching**


    We’ll explore HTTP caching in this chapter, which reduces unnecessary transfers.


    **11.1 Cache Validator**


    A web browser will cache responses by default, even without much effort from the
    server.


    The problem is: how do clients know if a cached item is valid? There are mechanisms
    to query the server for this information.


    **Validate by Timestamp**


    One way to do this is through the Last-Modified and If-Modified-Since header fields.
    This works in the following steps:


    1\. The server returns the filesystem modification time of the file in the Last-Modified
    header field.


    2\. The client caches the response along with the timestamp.


    3\. The client needs to validate the cached response before reusing it by sending
    the request with the If-Modified-Since header field set to the cached timestamp.


    • If the file has been modified on the server (indicated by a different timestamp),
    the server returns a response as usual.


    • If the server doesn’t support this validation method and ignores the header
    field, it also returns as usual.


    • If the timestamp is the same on the server, the server returns the status code
    304 (Not Modified), this status code has no payload body, it just tells the client
    to reuse the cache.


    4\. The client will reuse the cached response if the status code is 304, or use
    the normal response and update its cache.


    **Validate by ETag**


    The resolution of the timestamp is only 1 second, which is inadequate for some
    use cases, and filesystem timestamps are not a reliable way to identify the content
    anyway. Another way to identify the content is through the ETag header fields.
    This works the same way as Last-Modified, except that its value is arbitrary,
    you can use the hash of the content, or keep a version number whenever you update
    the content.


    ETag is validated by If-None-Match, which is analogous to If-Modified-Since.


