    13\. WebSocket & Concurrency


    **Mutual Exclusion with Mutexes**


    One solution is to use a lock (mutex) to limit concurrent writes to the socket.


    // pseudo code!


    async function send(mutex, msg) {


    await mutex.lock();


    try {


    // write to the socket


    } finally {


    mutex.unlock();


    }


    }


    A mutex is “mutual exclusion” because it disallows more than one task from entering
    the locked state. In the case of concurrent access, one task holds the lock and
    the rest block on the await statement, and releasing the lock will unblock one
    of the waiters. The mutex is one of the *synchronization primitives* in many concurrent
    programming environments.


    **Multiplexing with Queues**


    Another solution to preventing concurrent access is to use a queue. The queue
    accepts WebSocket messages from concurrent producers, and a dedicated task consumes
    from the queue and writes to the socket. This is what we will do.


    // pseudo code!


    let queue = createQueue();


    // for multiple producers


    async function produce(msg) {


    await queue.pushBack(msg);


    }


    async function single\_consumer() {


    while (running()) {


    const msg = await queue.popFront();


    // write to the socket


    }


    }


    A mutex is also a form of queue that doesn’t pass data, it passes control instead.


    [Report an Error | Ask a Question](https://forms.gle/UKo4bncUnuMGBrTM7) @ [build-your-own.org](https://build-your-own.org)


    114


    2024-02-02


    13\. WebSocket & Concurrency


    **Flow Control with Blocking Queues**


    A JS array is a queue that you can push and pop. But it is not useful for concurrent
    programming. How do you, as a consumer, know when the queue is not empty? There
    needs to be a mechanism that allows consumers to wait for producers.


    This mechanism can be implemented in the queue! That’s why the above pseudo code
    uses await to consume from the queue. This is called a *blocking queue* because
    consumers are blocked when the queue is empty.


    Also, backpressure requires that the queue be bounded in capacity. This is achieved
    by having the producer block when the queue is full. In contrast to the Stream
    API in Node.JS, this removes the footgun of not mandating backpressure.


    // both producers and consumers can block.


    type Queue<T> = {


    pushBack(item: T): Promise<void>;


    popFront(): Promise<T>;


    };


    A blocking queue not only passes data between producers and consumers, it also
    passes *control*, which is similar to a mutex. In fact, while passing data is
    convenient, passing control is more fundamental in concurrent programming.


    **Cancellation with Closeable Queues**


    A blocking queue is similar to a Unix pipe in terms of blocking behavior. Except
    for one thing: a pipe can be *closed*!


    • If closed by the producer, the consumer gets EOF.


    • If closed by the consumer, the producer gets errors when writing to it.


    In concurrent programming, sometimes you need to make tasks quit their jobs. For
    example, if a WebSocket is closed while the application task is blocking on it
    (either reading or writing), the task should be woken up (to get an EOF or an
    error) instead of hanging forever.


    If the task is a consumer of a queue, you can put special values into the queue
    to notify consumers to quit. But for producers waiting on a queue, this is not
    so easy. Fortunately, we can learn from Unix pipes — add a close() method to unblock
    all producers and consumers.


