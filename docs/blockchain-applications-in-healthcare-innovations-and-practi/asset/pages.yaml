  md: '# An Optimistic Approach to Share Private Health Records Using Blockchain Technology


    These days, the amount of digital health data generated is increasing. Legacy
    systems with confidentiality and security problems are used to store and share
    them. Insurance data, banking information and Electronic Health Records (EHRs)
    are all examples of sensitive data or documents that must be exchanged digitally.
    Because EHRs include vital information and are frequently exchanged among several
    parties, including hospitals, patients and government bodies, they are both critical
    and sensitive. Private clinics or pharmacies maintain this information to be accurate,
    up to date, secret and made accessible to authorized users. In many circumstances,
    the transaction takes place between anonymous and unreliable people. As a result,
    implementing the data exchange using a fair non-repudiation protocol is considerably
    critical. Blockchain is no longer exclusively associated with cryptocurrencies
    such as Bitcoin. Blockchain is now widely used in applications that require immutable
    and traceable data, as well as a cryptographic and distributed ledger and is most
    often used in secure transactions. In a distributed ledger, records are maintained
    in a linked sequence of blocks, known as a Blockchain. The proposed system connects
    with the methods such as on-chain and off-chain communication patterns to allow
    patients and healthcare professionals to share personal health records. A scheme
    that emphasizes the importance of maintaining a true fair-exchange policy while
    transferring medical records without the involvement of a trusted third party
    is proposed. This distributed technology has a lot of potential in new applications
    over dissimilar fields such as healthcare and stakeholders.


    # 6.1. Introduction


    Blockchain, according to the current study, has the potential to dislocate trusted
    business models that are mostly used in present day healthcare systems that perform'
