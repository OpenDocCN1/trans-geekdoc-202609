- pgno: 203
  md: '# The Role of Smart Contracts and Blockchain Technology in Healthcare and Other
    Use Cases


    Newly emerging technologies have encouraged every sector to adopt these technologies
    to increase their productivity. The traditional techniques have been replaced
    by digital techniques to overcome the limitations faced by the people. One of
    the emerging technologies is Blockchain technology, which offers multiple benefits
    to business enterprises. The smart contract is a Blockchain-based technology that
    overcomes the limitation experienced in traditional contracts. This chapter explains
    the concept of a smart contract and its role in different sectors in detail. The
    research begins with the introduction of smart contracts, moving forward to its
    challenges, the real-time companies using smart contracts, with some past historic
    attacks. Overall, this chapter''s research consists of deeper knowledge about
    smart contracts, their platform and real-time applications.


    # 10.1. Introduction


    The evolution of technologies has unboxed tremendously easier and simpler applications.
    These applications have turned the traditional approaches into smarter ones. A
    similar example is a Blockchain-based technology known as “smart contracts” (Rouhani
    and Deters 2018). Emerging technologies have reduced the effort needed and saved
    a lot of time. The term smart contract came into existence to overcome the limitations
    faced in traditional contracts. A traditional contract is defined as a bunch of
    agreed-upon terms between two parties that are validated and signed by the two
    parties. Smart contracts replace the issues that occurred in traditional contracts.
    There are a few similarities as well as dissimilarities between smart contracts
    and traditional contracts (Toshev & Boteva 2020). The traditional'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'contract systems are enforced by the law and agreed upon thoroughly by both
    parties. But the major difference is that traditional contract is based on natural
    human language, whereas smart contracts are based on digitally signed laws (IBM
    n.d.; Infosys n.d.; Investopedia 2022). There are multiple differentiating factors.
    These differences are as follows.


    # 10.1.1. Comparison between traditional contracts and smart contracts


    # 10.1.1.1. Automated contract


    It takes more time to prepare, draft and formulate a traditional contract. Usually,
    it takes around one to three days to prepare the contract. Smart contracts need
    more time to code the contract. Smart contracts are time-consuming to develop
    but once deployed the contracts are automated. There are ready-made platforms
    present like Ethereum, Hyperledger Fabric, etc., that automate contracts.


    # 10.1.1.2. Contract remittance and execution


    In traditional contracts, some obligations are applied to the parties to pay the
    overdue within the allocated time as an organizational effort. Whereas in smart
    contracts, the remittance of the contract is executed automatically once the contract
    is fulfilled. These values and statements are recorded in the form of code (Toshev
    & Boteva 2020).


    # 10.1.1.3. Low cost


    In traditional contracts, the procedure fee is slightly higher as lawyers, contract
    makers and other third parties are involved. Smart contracts preferably require
    less cost.


    # 10.1.1.4. Data security and confidentiality


    Traditional methods may not maintain the security and confidentiality of the data.
    Traditional contracts require paperwork that opens the door for entering threats.
    However, smart contracts enable a strict path for data security and confidentiality.
    They use Blockchain-based cryptographic protection to maintain the confidentiality
    and integrity of data.


    # 10.1.1.5. Physical presence


    In traditional contracts, the two parties must be present physically; without
    their presence, the contract cannot be signed and it is impossible to proceed.
    In this ever-changing world, smart contracts are signed digitally anywhere and
    the contracts can be accessed anytime.'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# 10.1.1.6. Archiving


    Traditional contracts require more space, time, administration and supervision,
    which results in a lengthy procedure. Smart contracts follow a secure and automated
    procedure that avoids time consumption and the usage of natural resources (Toshev
    & Boteva 2021).


    The above-mentioned points differentiate traditional contracts and smart contracts
    with definite parameters. In the next section, we provide detailed information
    about Generation Two of Blockchain – Ethereum.


    # 10.2. Ethereum: Generation Two of Blockchain technology


    Blockchain (Khanna et al. 2021; Sah et al. 2021) developers have thought of creating
    a simpler interface for smart contracts compared to existing ones. The newly emerged
    second generation of Blockchain (Khanna et al. 2020a, 2020b), known as Ethereum,
    was evolved to ideate assets that would add more benefits to Blockchain technology.
    Initially, to define Ethereum, it is a decentralized open-source platform that
    enables smart contract functionality. After Bitcoin, the second-largest evolution
    of cryptocurrencies in the market is Ethereum. Its evolution took place in 2013
    by the programmer Vitalik Buterin. This Blockchain technology had a boost in 2014,
    with a supply of 72 million coins in the beginning. This platform permits the
    developers to build and operate tasks that users rely on for interaction (Corporate
    Finance Institute n.d.; NTU 2020).


    Ethereum is defined as the public open-source Blockchain platform that enables
    the functionality of smart contracts and is another leading platform in the cryptocurrency
    market with a secured environment (Corporate Finance Institute n.d.; NTU 2020).
    Ethereum holds specifically two accounts, one is an externally owned account and
    the other is a contract account. The externally owned account can be controlled
    with the help of a private key.


    # 10.2.1. History of Ethereum


    The founder of Ethereum, Vitalik Buterin, was first a Bitcoin programmer in 2011;
    he initially worked for Bitcoin Magazine. Later, he realized some other platforms
    that can bring a distinct view towards Blockchain technologies. In 2013, Ethereum
    was established as a general scripting language (NTU 2020; Corporate Finance Institute
    n.d.). In 2014, the team at Ethereum launched a campaign where they sold Ethers
    to check how it affects the world. At the same time, they raised 80 million dollars
    (Corporate Finance Institute n.d.; NTU 2020).'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# 10.3. Smart contracts


    In 1996, a smart contract was defined as a digital contract structured in the
    form of lines of code and executed in the same way. It is a set of protocols formed
    between parties to fulfill the desired promises. The smart contract executes the
    contract, ensuring no malicious contents as well as unpredictable circumstances.
    It reduces the usage of third parties, which results in low transactional cost,
    and lowers potential collusions and countered risk. Smart contracts came into
    existence due to Blockchain technologies (Wang et al. 2019). They are in the form
    of general-purpose programming. These lines of code and the agreements are stored
    over distributed and decentralized technology termed as Blockchain.


    The speciality of smart contracts is that they are reliable and trustworthy, and
    permit a faster flow of procedure without any involvement or interference from
    third parties, or the legal systems. Smart contracts are stored over Blockchain
    technology that runs on preferred conditions (Wang et al. 2019). Smart contracts
    are solely focused on automating the execution of the agreement without any loss
    of time or certain involvement. Users develop their code and form a Turing complete
    program on the Blockchain network.


    Smart contracts are developed on the Ethereum platform. The execution of text
    on Ethereum consists of the heap, stack and a determined memory over the chain.
    Once the development of the contract is accomplished, the next step is to deploy
    the contract. After the deployment of the contract, the contents of the contract
    cannot be changed or altered, even by the contract creator. The execution of a
    contract requires a set of operations and specified functions to be carried out.
    Once the set of functions is carried out, then the program can be finished by
    the gas depletion. In the next section, we explain the term gas in detail.


    # 10.3.1. How smart contracts work


    Smart contracts follow a stipulated model and are entirely executed on the Blockchain.
    A contract is transformed into lines of code that are then executed under certain
    conditions. A wide range of networks execute the actions over the set of protocols
    that are verified and validated. The actions related to smart contracts are conducted
    and executed. These actions involve vehicle registration, notifying the users,
    raising a ticket and transferring funds to relevant parties. These chunks of actions,
    once executed, are updated on Blockchain, and mark the transaction as completed.
    To dive deeper, a smart contract is more than a general script or piece of code
    that is stored on a decentralized Blockchain network. It maintains transparency
    between the two parties. Importantly, smart contracts contain terms and conditions
    in the form of code that helps participants to clearly understand the contract
    signing'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'digitally, without any enforcement of laws or any legal mechanism (Kemmoe et
    al. 2016).


    Smart contracts are surrounded by a cryptographic protection. The presence of
    cryptographic protection confirms that the contents of contracts cannot be altered
    at any cost. It follows a strict security path ensuring the backup of contracts.
    Smart contracts have multiple benefits, which are as follows.


    # 10.3.2. Benefits of smart contracts


    +   1) Speed: smart contracts are a digital contract which means that the tasks
    are automated once the action is executed. It speeds up the procedure because
    it reduces paperwork (IBM n.d.; Infosys n.d.; Investopedia 2022).


    +   2) Efficiency: smart contracts are effective as well as efficient. This is
    because they are packaged in a secure environment and do not involve hectic legal
    procedures. The best part is that there is no need for physical presence at the
    time of signing the agreement (IBM n.d.; Infosys n.d.; Investopedia 2022).


    +   3) Accuracy: smart contracts maintain the accuracy of the contents, ensuring
    that the same task is performed without any misconception or errors, whatever
    the action (IBM n.d.; Infosys n.d.; Investopedia 2022).


    +   4) Trusted and transparent: people usually avoid digital techniques because
    of insecurity and lack of trust. But this is not the case with smart contracts.
    The strict cryptographic protection locked the contract into a safe network where
    there is no possibility of threat or alteration. The contracts are visible and
    accessible to parties connected with the network (IBM n.d.; Infosys n.d.; Investopedia
    2022).


    +   5) Security: security is the strength of a smart contract based on Blockchain
    technology. Firstly, any contracts contents stored over Blockchain networks are
    encrypted. The hacker cannot attack the network. If the hacker attacks the network,
    it will have to change the entire chain of records as the contents are stored
    over the distributed ledger (Investopedia 2022).


    +   6) Cost-effective: smart contracts are an automated procedure that executes
    actions without the usage of paper. This reduced the cost spent on paperwork as
    well as its fees for overall procedures (IBM n.d.; Infosys n.d.; Investopedia
    2022).


    # 10.3.3. Roles of smart contracts


    Smart contracts may change to deal with various activities like transactions or
    any other legal work. For enterprises, organizations and institutions, it may
    be difficult to deal with so many contracts, store them in files and then act'
  merge: -1
  img_proc: true
- pgno: 208
  md: 'accordingly. Smart contracts play a vital role in various sectors, providing
    them with the flexibility to independently handle contracts without any burden
    of storage, or spending time as well as money on paperwork (Salmerón-Manzano and
    Manzano-Agugliaro 2019).


    Smart contracts have made it feasible for businesses and trade to anonymously
    identify the parties without any intervention of a middleman. Smart contracts
    have reduced the cost usually required for traditional contracts without affecting
    authenticity and integrity (Salmerón-Manzano and Manzano-Agugliaro 2019). Therefore,
    smart contracts are useful in various sectors, such as travel companies, supply
    chain deals, logistics deals and many others. Smart contracts enable features
    that help both parties to easily carry out their work in an isolated secured environment.


    # 10.4. Use of smart contracts in healthcare, patient monitoring, and other use
    cases


    By now, we are well aware of how critical smart contracts can come to be when
    certain functionalities are concerned – and many of these completely deal with
    decentralization as the core concept (or for the matter of absence of centralization)
    for certain processes, procedures and use cases. The concept of smart contracts,
    though first introduced by Ethereum, which also marked the onset of Blockchain
    technology’s second generation, actually helped shape the development of similar
    technologies across other platforms and products. Currently, there are many public
    as well as consortium Blockchain implementations that provide support for writing
    and deploying smart contracts, and many times it is in a different language than
    what Ethereum supports. This has given rise to many developers being able to write
    smart contracts in languages that they knew before they started in the domain
    of Blockchain technology – such as Java, JavaScript, Rust, etc.


    As more and more engineers become equipped to write smart contracts, the total
    number of use cases that can see the usage of smart contracts is increasingly
    growing. When such a turnout happens before and during an ongoing pandemic, it
    brings out several use cases that are concerned with the domain of healthcare.
    This can specifically encompass patient monitoring, vaccination drives, vial information,
    supply chain management of medical equipment, vaccines, medicines and electronic
    health records (EHRs), further securing protected health data/information (PHI)
    and regulated access to patient information, as well as ailment data. As healthcare
    is a massive industry in itself, the use cases that it encompasses usually see
    a lot of complexity. The same can be said about the deployments trailed on the
    back of smart contract technology.'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'However complicated it may sound to build new applications, platforms and functionalities
    on the new-age technology called Blockchain using concepts further next-gen such
    as smart contracts, it is indeed quite straightforward to implement certain use
    cases, at least in the shape of a PoC (proof-of-concept). Below are some of the
    implementations and deployments being carried out by multiple organizations across
    the globe, either as PoCs, SaaS (software-as-a-service)-based offerings or fully-fledged
    deployments connected to legacy systems.


    # 10.4.1. Transparency in supply chain


    A significant challenge in the healthcare sector is to confirm the authenticity
    of medical devices. Blockchain becomes the centerpiece while companies try to
    streamline their supply chains to allow themselves, as well as customers, to track
    items throughout the chain. This results in complete transparency across the value
    chain.


    This has been a big reason to worry about the fact that counterfeit drugs cause
    tens of thousands of serious ailments and even deaths every year.


    Main benefits of Blockchain in such use cases:


    +   – Compliance: it is imperative to be able to record and report elements in
    a supply chain. Combining supply chain data in a single system helps optimize
    compliance.


    +   – Customer trust: it is important for medical device and drug manufacturers
    to be able to build trust with their customers. Doing so is increasingly possible
    by tracking the products using a Blockchain, which includes third-party integrations
    with manufacturers, distributors, etc.


    # 10.4.2. Electronic health records on the Blockchain


    Health systems across the globe face the issue of information being restricted
    to data silos, thus leaving patients, as well as hospitals, with an incomplete
    picture of health records forming their medical history.


    A valid solution would be to put these EHRs (Electronic Health Records) on a Blockchain-based
    system, which will eventually give a complete picture regarding a patient – depending
    on the kind of access privileges. Such access, as well as data additions, can
    be managed using hashes inserted into the Blockchain, and the patient can provide
    approval for sharing such data typically by signing these transactions on the
    Blockchain network.'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'In such a case, every change to the records and instance of patients’ approval
    to share their medical record is committed as a transaction on the Blockchain.


    Blockchain-enabled EHRs have many benefits. Health insurers can receive validated
    confirmation of health services directly and instantly from the patient without
    the expense of an intermediary. As an example, Medicalchain is developing a platform
    on which other digital health solutions can be built, which include virtual counselling
    services and medical data exchange, enabling patients to sell their anonymized
    medical records and data in exchange for MED tokens to help them develop digital
    health applications.


    # 10.4.3. Use of smart contracts for insurance and billing in supply chain management


    Many providers offer Blockchain-based systems that allow various healthcare players,
    such as pharmaceutical companies, wholesalers, insurers and healthcare providers,
    to verify their corporate identity, log contract data and track transactions of
    goods and services, and payment processing data for these goods and services.
    By sharing digital contracts between manufacturers, retailers and healthcare organizations,
    instead of each player having their own version of contracts, they can significantly
    reduce disputes over quality checks, chargebacks, claims and other issues.


    # 10.4.4. Verification of medical personnel’s identity cards


    Verifying background information has been an important cause across domains. When
    it comes to healthcare, institutes need to be certain about the experience of
    a medical professional.


    US-based company ProCredEx has developed such a system for verifying medical certificates
    using the R3 Corda Blockchain protocol.


    The main advantages of the Blockchain system in such a use case are:


    +   - faster approval from health institutes and hospitals during the recruitment
    process;


    +   - transparency and security for partners and vendors, for example, organizations
    outsourcing representatives, or in new virtual care models to inform patients
    about the experiences of medical staff.'
  merge: -1
  img_proc: true
- pgno: 211
  md: '# 10.4.5. IoT security for remote patient monitoring


    What we can also see all around us these days is the use of smart devices to monitor
    our health – fitness bands, weight trackers or even a ring that can monitor your
    health, sleep and activity patterns, such as the Oura ring. Talking about the
    medical devices at large, hospitals and institutes have started employing multiple
    IoT-based devices to track the health of a patient constantly. This may include
    the elderly who need constant supervision, even while discharged from hospitals.


    In such scenarios, the security protocols followed by these devices become a high
    priority, and the use of Blockchain to successfully trace any intrusions is a
    good starting point. Additionally, permissioned Blockchains would ensure that
    only approved nodes (devices) can interact with the system.


    # 10.5. Building smart contracts on the Ethereum Blockchain


    Ethereum Blockchain is the second-largest cryptocurrency available on the market,
    after Bitcoin. The evolution of Ethereum had brought significantly great success
    since its establishment in 2015. The invention of a Russian Programmer conveniently
    lead to new decentralized applications to be developed. For the development of
    decentralized applications, Ethereum is the best Blockchain platform recommended.
    To create your contracts, you can reliably use the Ethereum Blockchain platform.
    Ethereum is a distributed infrastructure that potentially assists in accomplishing
    projects. Smart contracts can be created, developed and deployed using Ethereum
    Blockchain (NTU 2020). You can create smart contracts on the Ethereum platform,
    so let us understand the execution procedure involved in execution in detail.


    # 10.5.1. Ethereum virtual machine (EVM)


    EVM is a virtual machine acting as a runtime environment for building smart contracts
    on the Ethereum platform. EVM is sandboxed from the host operating system. Each
    EVM runs when any single contract is executed. Smart contracts prefer the Ethereum
    platform for deployment because of its higher abstraction layer. It is the global
    supercomputer that gears up the execution of every action. EVM does not make any
    delayed Internet calls or pass on any random number as it is solely a virtual
    machine. EVM prefers programming language coding compared to assembly language
    (NTU 2020; SitePen 2020). Some components take part while implementing the smart
    contracts on the platform. Each component is explained below in detail.'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'Before that, we have mentioned a summary of the working of smart contracts
    on Ethereum. Smart contracts that need to be developed on Ethereum prefer to use
    code in the solidity programming language. Once the program is written, it is
    compiled into bytecode because EVM understands bytecode easily. Then, this bytecode
    is deployed in the Ethereum network transaction. Ethereum depicts the value of
    a token called Ether (Yuan et al. 2018). Ethereum supplies operations including
    computation and data transfer with a fixed price. Also, only the desired amount
    of gas is consumed that is needed for the execution of the operation. The transaction
    contains a term named gas limit that means to define maximum gas consumption.
    After the contract calls the function, it requires the lower limit of gas to be
    specified. There are some conditions applicable during execution (Yuan et al.
    2018). If the function executes normally, then it uses the corresponding gas and
    returns the leftover gas (Yuan et al. 2018). This is the standard procedure while
    deploying the smart contract on Ethereum.


    # 10.5.2. Gas


    Gas is a measuring unit present inside EVM to allocate particular fees for each
    transaction within smart contracts. Every action of computation needs a certain
    amount of gas. The more the computation is, the more gas is used. Now, to program
    on Ethereum, a specific programming language called Solidity is needed.


    # 10.5.3. Solidity


    Solidity is the programming language defined for smart contracts developed on
    Ethereum. On the top layer of Ethereum, smart contracts are developed using Solidity,
    which is a simple object-oriented programming that uses class or language. Solidity
