- pgno: 19
  md: 'information, although Blockchain has always faced the limiting issues of latency
    and throughput, solutions to which have been given by many researchers such as
    ECBC produced by Xu et al. (2017). A Blockchain can track prescriptions, records,
    clinical data, payments, medication, a patient’s accounts much more, where people
    can believe that every single piece data is true, and the user can see all the
    details of the transactions to give greater confidence, end-to-end communication,
    new efficiencies and greater opportunities. But, due to the newly developed technology,
    it still has a very limited number of users (Aru 2017), along with certain challenges
    and limitations towards the development of Blockchain applications, including
    security, scalability, speed, privacy, interoperability and patient management
    (Agbo et al. 2018).


    # How does Blockchain initiate?


    Blockchain rests on three major concepts: **the Blocks, the Miners and the Nodes.**


    # The Blocks


    Every Blockchain consists of various numbers of blocks, along with the three primary
    elements in each block, which are:


    +   - data: acting as an input for the block;

    +   - nonce: a 32-bit entity based number referred to as a **nonce**. When any
    block is created, the nonce is generated randomly which further achieves a “hash”
    as a block header;

    +   - hash: a 256-bit number and linked to the nonce, which appears with a large
    number of 0s.


    A nonce develops the cryptographic hash, whenever the initial (first) block of
    a Blockchain emerges. Then, the acknowledgement is done for unless it is dug,
    the data in the block is signed and connected to the nonce and hash.


    # The Miners'' association


    The newly developed blocks in the chain are generated through a development procedure
    known as mining. Every block in the Blockchain mining of a block is not evident,
    especially for the larger chains, because each block has its unique nonce and
    hash, as well as the hash of the previous block in the chain. Miners are special
    pieces of software that solve the strangely complex math nonce finding problem
    that'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'generates an accepted hash. Because the hash is 256 bits and the nonce is only
    32 bits, there are approximately four billion nonce–hash possible combinations
    that need to be mined after finding the right one. This block is then added to
    the chain, which when it appears is referred to by the miners as the “golden nonce”.


    All of the blocks that come after changing the previously existing block in the
    chain necessitate re-mining; hence, it is always reported as a tough job to manipulate
    Blockchain technology. Thus, as a “safety in math”, finding golden nonces needs
    a long time and much computer power. This modification must be approved by all
    existing devices in the system, and if a block is successfully mined, the miner
    is compensated financially.


    # Nodes


    Nodes are any type of electronic device that helps in keeping the network functioning
    and in maintaining the copies of the Blockchain. Any newly introduced mined block
    for the Blockchain needs to be verified, trusted and also updated for each node
    with its own copy of the Blockchain, and the network must also be algorithmically
    approved. Each action performed in the ledger is easily checked and viewed due
    to the transparent nature of the Blockchains, where each member is identified
    with a different alphanumeric identification number, showing their transactions.


    The Blockchain also maintains its integrity and develops trust among its users,
    thus combining public information with a reliable scalability of trust and a system
    of checks-and-balances through efficient use of technology.


    # Components of basic Blockchain


    Distributed ledger technology (DLT) is used by all network participants which
    are involved in the Blockchain and have an access to the distributed book and
    its maintenance of the record of transactions. The shared ledger allows the transactions
    to be recorded only once, and any duplicate efforts to be discarded, as has always
    been found in typical classical networks. The different attributes of the distributed
    ledger technology are presented in Figure 1.1.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '![](img/9f63232d0022c87774dc3933e40b24aa_21_0.png)


    # Immutable records


    In Blockchain technology, none of the members are allowed to change the input
    after a transaction has been recorded in the common ledger, nor can they modify
    or tamper with it. However, it does give the following opportunity: if a transaction
    record contains an error, then a new transaction will need to be combined in order
    to reverse the error; then both the transactions will be cleared.


    # Contracts that are smart


    Smart contracts are a collection of rules for completing transactions quickly,
    which is gathered on the Blockchain for its automatic execution. A smart contract
    describes conditions and regulations for incorporating, combining terms for the
    data, guaranteed services and much more.


    # Benefits of Blockchain


    Operations generally squander time and money on duplicate records and third-party
    verification. The recorded systems may also be liable to cyber attacks and fraud;
    therefore, the defined data verification can be slowed by transparency. Transaction
    volumes have exploded as a result of the Internet of Things (IoT). As a result,
    every process takes longer towards the end result drains – or necessitates a better
    move, namely, entry into the Blockchain.'
