  md: '# Decentralized Smart Healthcare Systems Using Blockchain and AI


    Patients, developers, vendors and legislators all face substantial challenges
    as a result of increased data availability and rapid innovations of intelligent
    machines in healthcare. Simple face photographs or videos are being transformed
    into effective records for predictive modeling, transforming whatever statistics
    that are more about people into medical sciences, courtesy of a unique, deep mastering
    or transferable learning algorithms. Patients now have little control over who
    has access to their medical records and are ignorant of the overall cost of the
    data they possess. Such revolutionary Blockchain generations will get society
    further to the idea that each patient record will be able to communicate changes
    to an open-source, community-wide relied-on ledger that is available and understood
    across enterprises with guaranteed integrity. This paper describes a Blockchain-enabled
    fragmented personal fitness facts ecosystem that enables unique drug discovery,
    biomarker development and preventative healthcare procedures, as well as secured
    personal records using Blockchain and deep learning technologies to connect users
    and providers of personal records with medical records.


    # 8.1. Introduction to the healthcare system


    Hospitals, dispensaries and primary healthcare departments are all distinct environments
    in which to work. Healthcare is complex, and people must be knowledgeable about
    a wide range of topics, including hospital forms, patient care, benefits, healthcare
    providers and legal difficulties. This guide will help people learn essential
    healthcare ideas so they may improve employee performance and understand the system.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '![](img/9f63232d0022c87774dc3933e40b24aa_155_0.png)


    # Figure 8.1. Healthcare system relationships


    To be effective at work, people are well aware of the healthcare system. Users
    can collaborate in a variety of groupings, as seen in the diagram below. When
    people engage mostly with health professionals, users have to appreciate medical
    centers, possible treatments, as well as the roles of each team. People who work
    with patients must now be familiar with different types of insurance, how to assist
    uninsured people and how to protect patient privacy and rights. People will need
    to know what resources are available in their communities and how to get in touch
    with them.


    # 8.1.1. Introduction to AI


    Expert systems have also lately made headlines in the medical field, creating
    a heated discussion about whether AI doctors will ever be able to replace human
    doctors. Computers will not replace human doctors immediately, but AI will surely
    help physicians create good clinical decisions and may replace human judgment
    in some areas of healthcare (e.g. radiology). Recent successful AI applications
    in healthcare were made possible by the increased availability of healthcare data
    or the massive development in advanced analytics algorithms. Effective AI tools
    can extract clinically significant knowledge contained in vast amounts of data,
    assisting clinical decision-making (Al-Megren et al. 2018; Grishin et al. 2019;
    Han et al. 2019; Alsalamah and Nuzzolese 2020; Efremova and Teichmann 2020). The
    advantages of AI have been extensively studied in the scholarly literature. AI
    can use effective methods that can “learn” features from a big amount of healthcare
    data'
