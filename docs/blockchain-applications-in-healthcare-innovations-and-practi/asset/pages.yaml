    # 7.1. Introduction


    Well-being is the establishment of cheerful life, and the current generation has
    been the luckiest beneficiary of extraordinary advances in clinical innovation.
    With each innovation, more pieces of information become accessible to translate
    the issues that plague our prosperity. This information is highly sensitive as
    it is the Electronic Health Record (EHR). EHR is the sensitive private information
    of the patients which is usually shared between patients, clinics/hospitals, pharmaceuticals,
    health insurance companies, test laboratories, etc. The complex part is to track
    this data down with multiple entities storing and maintaining data. Healthcare
    interoperability is fixated on the trading of information, a wide accessible interoperability
    brings new difficulties and prerequisites with respect to security, anonymity
    and administration (Magyar 2018; Guimarães et al. 2020; Huang and Lee 2020).


    There are four main concerned areas that address the challenges in EHR management
    (Engelhardt 2017; Rejeb et al. 2021):


    +   a) Patient-centric: usually patients interact with a variety of healthcare
    entities and provide their data to multiple EHR management tools. This procedure
    increases the agreement that all data at different entities shall be available
    to the patient all of the time, so that the patient can take control of their
    information and access it at anytime.


    +   b) Data privacy: EHR being sensitive personal data demands privacy and accessible
    only by authorized parties at appropriate times. This is still a rather complex
    area since there are many laws and regulations which mandate different principles
    of data privacy to be in place in the form of privacy controls by the entities
    which collect, process or transmit healthcare data.


    +   c) Data integrity: data integrity is all about data completeness, consistency
    and accuracy. By ensuring that complete health information is available to the
    right people at the right time, patient-centric information exchange should give
    patients more control and better outcomes.


    +   d) Cost: the health expenditure around the globe has increased in the past
    few decades; still, there is a crisis in healthcare costs. There have been many
    cases where lots of money has been put into EHR but has gone to waste due to there
    being less acceptance by people of a certain age group, especially for countries
    with an aging'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'population. There have also been other factors like security issues, user friendliness
    and comfortability in using EHR, etc.


    # 7.2. Threat modeling – digitalization in the healthcare industry


    Digitalization in the healthcare industry is not only about digitalizing the core
    infrastructure, making healthcare instruments IT enabled or increasing automation/robotics
    in medical treatments/surgeries (Sharma et al. 2021), but also how this digitalization
    can be extended to the end-user is the major chunk of automation; however, extending
    digitalization to the end-user comes at its own cost, this cost is not only monetary
    but also balancing the fact that the end-user wants it to be as user-friendly,
    robust and reliable as possible, and at the same time the services/products need
    to be secured by its design (Singh and Talapula 2019). This means that while in
    digitalizing we cannot rely on the end-user for security, because that is the
    most vulnerable end, the services and products shall be developed with security
    by design principle, i.e. foundationally secure.


    Around a decade back, digitalization from an end-user perspective was completely
    dependent on web applications which were accessible via computers, laptops, etc.,
    but with recent advancements in smartphone technology, where smart mobile devices
    are available at lost costs, everything has changed. This now means that for the
    end-user, dependency on hardware requirements like a computer or laptop has vanished
    which has potentially increased the number of end-users who are willing to use
    healthcare applications via their mobile phones.


    These mobile phones are smart because they not only provide end-users an application
    with a user-friendly interface to access their health records, chat over voice
    and video with doctors but they are also able to sense changes in temperature,
    human body measurements, etc. (Papageorgiou et al. 2018). Due to the advance processing
    capabilities of the smart phones, mobile applications not only provide a platform
    to store health records, but also have access to live locations and sensitive
    data like photographs, videos, contacts, etc.


    Hence while using health applications, sensitive data is at stake, due to which
    all health application service providers need to follow many legal regulations
    and requirements to ensure data privacy and security. Therefore, the actual challenge
    is providing digitalized healthcare services and implementing security and privacy
    controls which are also aligned or suffice all legal requirements. To understand
    this better, in this section, we will take a generic example of a healthcare application,
    and will try to understand the flow of data, threat surface and possible attack
    scenarios.'
