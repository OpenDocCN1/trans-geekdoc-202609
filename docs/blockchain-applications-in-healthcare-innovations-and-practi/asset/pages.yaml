    # 10.8. Challenges


    Building smart contracts gives rise to multiple benefits, but simultaneously there
    are some challenges to be addressed while using smart contracts based on Blockchain
    technology:


    +   - Confidentiality: although Ethereum promises to deliver transparency, enterprises
    still hesitate to store their contracts publicly because of competitive strategies.
    Ethereum does not support private smart contract Blockchain platforms that can
    harm confidentiality.


    +   - Inception to human error: the smart contracts are formatted in lines of
    code, but there may be a possibility that the terms and conditions related to
    transactional data may be affected because of missed code. This can decrease accuracy
    and reliability.


    +   - Threats through bugs or errors: in 2016, because of a vulnerability in the
    smart contracts of the DAO, 50 million ETH was siphoned off by hackers. This resulted
    in the fork of ETH into ETC (Ethereum Classic).


    +   - Predictability: smart contracts automate depending on the event that is
    triggered. Depending on the parameters set, the smart contracts perform certain
    actions. For instance, let us consider, the stock price''s multiplication factor
    fluctuates, which is not in the control of the smart contract; this may result
    in certainly unplanned contract code executions.


    +   - Correctness: one of the major challenges faced while using smart contracts
    is that once the smart contract is developed and deployed, it cannot be altered.
    Any error can be exploited.


    +   - Scams: as Blockchain is a newly emerging technology, it may be vulnerable
    to malicious attacks and threats. Therefore, these vulnerable attacks can be initiated
    through scams or honeypots.


    # 10.9. Historical attacks and issues with smart contracts


    Previously, smart contracts were prone to various security issues and attacks.
    The most discussed attacks are the DAO attack and the Parity Wallet hacks. These
    were the two historical attacks that took place, impacting smart contracts negatively.
    DAO is a smart contract that permits people to exchange their tokens and win'
