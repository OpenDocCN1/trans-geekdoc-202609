    useful data for product design, such as information on user demands, behavior
    patterns and use cases.


    We examined the Scopus database for research published until November 1, 2021.
    Studies on Blockchain smart contracts have been published not only in medical
    publications, but also in journals from other fields such as IT, law, engineering,
    economics and business administration. As a result, given its comprehensive coverage
    of journals in both the scientific and social sciences, we chose the Scopus database
    as the source of papers for this study.


    We employed four processes to conduct a comprehensive quantitative review: discovering
    possible research, screening out irrelevant studies, confirming relevant studies
    and assessing chosen papers.


    In the first phase of selecting suitable research, we conducted a preliminary
    search for papers that had a term like “Blockchain smart contract” in their titles,
    abstracts or keywords. This phase yielded a total of 5,873 prospective studies.
    In a separate search, we limited these studies to those that had key phrases like
