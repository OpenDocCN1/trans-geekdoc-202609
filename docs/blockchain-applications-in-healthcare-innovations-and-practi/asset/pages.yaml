  md: '# Blockchain as an Effective Technology in Maintaining Electronic Health Record
    Systems


    Blockchain technology is one of the most important innovations in the professional
    world today. It is a distributed network that is made up of an organized list
    of nodes and connections, with nodes responsible for storing information and chains
    connecting them. It is the chain of blocks that constitutes the data and helps
    in maintaining a trust among the individuals. The Blockchain technology is moving
    on the path of constant change and revolution. The increased use of Blockchain
    technologies in recent years has compelled experts and academicians to find innovative
    approaches to implement Blockchain in various fields. Healthcare is the sector
    that has seen the most growth in terms of data and sales. Security has become
    increasingly important as the number of electronic health records (EHRs) grows.
    There has been a push to use Blockchain technologies to make EHRs safer. The increase
    in the usage of Blockchain technology provides many new application opportunities
    that include the area of healthcare. EHRs are the most promising use of Blockchains.
    It can be defined as the health information of the patients that are stored digitally
    over the network. Blockchain technology has the potential to revolutionize healthcare
    by putting the user at the center of the clinical system and improving health
    information transparency, privacy and confidentiality. This chapter not only covers
    the introduction to Blockchain technology and its background concepts, but it
    also covers the importance of Blockchain in the healthcare sector. The model for
    EHR on the basis Blockchain is also proposed. This chapter concludes with the
    various research challenges in the domain of Blockchain along with a case study.


    # 5.1. Introduction


    One of the most precious resources is data. With cyber criminals becoming more
    skilled at stealing sensitive data, cybersecurity has become one of the most pressing'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'global challenges, necessitating cyber protection. Various methods have been
    suggested in the past to meet the security needs of various organizations, but
    security attacks have no limits, resulting in the techniques being either compromised
    or rendered useless. Blockchain technology is the most recent solution to safeguard
    useful records. It is described as a distributed ledger that holds an ordered
    list of various items connected by connections known as chains (Katal et al. 2021b).
    The content included in these blocks, which relate to financial operations, is
    only accessible to subscribers. An intricate chain of self-managed encryption
    keys maintains user approval: each authorized user gives a time-sensitive secret
    identifier that autoblocks it if the decryption timer runs out (Zhang et al. 2018).
    Blockchain is a modern platform that allows for more autonomous computing. It
    is based on the principle of public ledger, which acts as an archive for previous
    transactions surrounding these agents. It is regularly audited by groups of agents
    (selection is done according to different policies based on the software domain)
    who audit it on a regular basis. The results of each audit are saved in a block
    and presented to the entire network. In a cryptographically linked row, blocks
    are sequentially added to the ledger. Blockchain technology allows data to be
    shared while maintaining confidentiality. The following are a few of the reasons
    why Blockchain technology is so common and is being used in various domains:


    +   – When opposed to conventional banks that work on operating hours and rules,
    Blockchain technology allows for faster transaction settlements. On the contrary,
    it has no such limitations. It allows for quicker contract settlements.


    +   – Since Blockchain stores data and prevents it from being corrupted, it removes
    human error. Accuracy is ensured when records are checked as they move from one
    node to the next.


    +   – Data objectivity is a product of Blockchain technologies. It not only guarantees
    data confidentiality but also warns users against any data change. If an organization’s
    data is hacked, it cannot be exploited, ensuring a balance between confidentiality
    and governance.


    +   – In the event that anomalies are discovered, they can still be traced back
    to their source, which simplifies inquiries and the execution of necessary acts.
    As a result, quality assurance is achieved.


    # 5.2. Background concepts on Blockchain technology


    # 5.2.1. Consensus algorithms


    Consensus algorithms are essential components of Blockchain technology which contribute
    to the creation of a tamper-proof network. It only accepts one source of truth,
    which is agreed upon by all network members. This technology relies on'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'node-to-node consensus processes to validate data, eliminating the need for
    intermediaries. Any of the nodes in this network should reach an agreement on
    the current version of the Blockchain. This increases the system’s reliability
    by making it more complex for the hacker to generate a sudo block and inject it
    into the distributed network.


    Blockchain consensus algorithms are divided into two types: proof-based consensus
    algorithms and voting-based consensus algorithms (Katal et al. 2021a).


    # 5.2.1.1. Proof-based consensus algorithms


    The basic idea of evidence-based consensus algorithms says that the node with
    the greatest proof prevails among numerous nodes joining the network and is given
    approval in the network to add a new node and get the payment. Many varieties
    of proof-based consensus algorithms have been applied, including those based on
    Proof of Work (PoW), Proof of Stake (PoS) or a mixture of the two, as well as
    a variety of different versions.


    # 5.2.1.2. Voting-based consensus algorithms


    In order to execute the voting-based consensus algorithm, the nodes within the
    checking network must be customizable. This allows them to exchange messages more
    easily. This is the most significant distinction from proof-based consensus algorithms,
    in which nodes are often able to enter and leave the verifying network. Furthermore,
    with a voting-based consensus mechanism, all nodes in the network must approve
    the operations or blocks at the same time, in contrast to maintaining the ledger.
    They will consult with others before determining whether or not to add their suggested
    blocks to their chain. Using voting-based consensus algorithms is somewhat close
    to using standard distributed system fault tolerance methods (Andreev et al. 2018).
    As a result, voting-based consensus should be built to withstand the following
    scenarios where any nodes have failed or any nodes have been subverted as well
    as crashed.


    # 5.2.2. Types of Blockchain


    The two basic types of Blockchains are private and public Blockchains. Nevertheless,
    there are various variations, including consortium and hybrid Blockchains. Every
    Blockchain is made up of nodes that are linked together via a peer-to-peer (P2P)
    mechanism. Each system node has an up-to-date version of the shared ledger. Each
    node may confirm operations, transmit and receive data and construct blocks. Firstly,
    the user initiates the transaction in the network. When the transaction is initiated,
    the process for the creation of blocks starts which includes the previous block’s
    hash, ownership and the modification history. A nonce creates'
