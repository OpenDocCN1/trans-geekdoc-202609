    # 7.5. Differential privacy


    The idea of differential privacy (Ul Hassan et al. 2020) was first introduced
    by C. Dwork in 2006 for statistical datasets. To understand it mathematically,
    differential privacy is adding noise in the data to preserve its privacy. Consider
    a function that analyzes a dataset and computes statistical results such as mean,
    median and variance. Now, if the algorithm of this function is enhanced in such
    a way that by looking at the output no one can tell whether an individual’s data
    was used as input in the dataset or not, in this situation, the algorithm will
    be considered as differentially private (Ul Hassan et al. 2020).


    Let us take a simple example: during market research, a team wants to know “how
    many people have watched the series Friends”, “how many have watched Suits” and
    “how many have watched Joker”. Now if the system answering these questions have
    algorithms which are differentially private, it will first add noise to the real
    values and then will provide the approximate data to the market research team.
    This approximate data will draw the same conclusions as what actual data would
    have done so in this way it will not affect the market research team too. This
    is the main benefit of differential privacy, i.e. the data can be used for analysis
    while guaranteeing the protection of individual’s privacy.


    Let us take another example: a curator asks a medical data owner to check a dataset
    of patients who have died in the last five years in a particular city and answer
    for each patient whether they died of cancer. The medical data owner agrees to
    provide an approximate count based on an algorithm, rather giving actual data.
    The'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'algorithm has been visualized in Figure 7.11. For each patient row, firstly
    the medical data owner will flip a coin, if it turns to be heads, then they will
    tell the truth to the curator. Yet if turns to be “tails”, then they will again
    flip a coin, now if it is “heads”, then they will answer “yes” and if it is “tails”,
    then they will answer “no” to the curator. In this way as per probability, the
    curator will know the truth almost half of the time, and for other half, there
    will be a random answer that will also have some “truth”, so the curator will
    have an approximate answer.


    ![](img/9f63232d0022c87774dc3933e40b24aa_148_0.png)


    # Figure 7.11. Differential privacy algorithm example


    # 7.5.1. Local differential privacy versus global differential privacy (UI Hassan
    et al. 2020)


    Consider a scenario where a researcher requests some kind of data for analysis
    to multiple data generators. In the local private system, each data generator
    will generate raw data, add noise to it and send data to the researcher. While
    in global privacy system, each data generator will firstly send data to a trusted
    curator, who will aggregate the data (or group the data), then add noise to it
    and provide it to the researcher. These two systems are shown in Figure 7.12.'
