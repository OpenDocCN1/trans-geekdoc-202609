    the means and methods of creating an interoperable decentralized Blockchain-enabled
    health record system. Moreover, the authors illustrate the problem faced by many
    in terms of the number of devices used in a healthcare system and the manageability
    of the vast variety of data generated.


    Chapter 6 presents the proposed system that connects with methods such as on-chain
    and off-chain communication patterns to allow patients and healthcare professionals
    to share personal health records. This chapter proposes a scheme that emphasizes
    the importance of maintaining a true fair-exchange policy when transferring medical
    records without the involvement of a trusted third party.


    Chapter 7 explores ways in which Blockchain can assist in preventing access and
