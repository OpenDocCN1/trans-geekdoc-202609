    The first example is a straightforward online consultation healthcare application
    which is used by patients to consult with their doctors online via a healthcare
    portal; let''s name it HealthConsult for reference. Considering HealthConsult
    is developed using Blockchain technology, the high-level architecture is visualized
    in Figure 7.7. Figure 7.7 simply shows that Blockchain is used in this application,
    while Figure 7.8 shows a more detailed low-level architecture that clearly explains
    the process flow of how interactions will occur between a patient and a doctor
    via Blockchain. An important aspect of privacy and security is to understand that
    this Blockchain will be a permissioned Blockchain, i.e. only registered nodes
    in the network can access or append records in the Blockchain. Other than the
    permissioned Blockchain, it will have all of the standard features of Blockchain,
    i.e. hashing, digital signature, encryption, decentralization, consensus algorithm
    and smart contracts.


