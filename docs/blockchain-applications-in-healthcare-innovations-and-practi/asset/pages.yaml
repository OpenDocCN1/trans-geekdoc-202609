  md: '# 2.1.2. Characteristics of Blockchain


    – Decentralization: each operation in typical centralized transaction processing
    systems should be verified by a trusted centralized agency (e.g. the central bank).
    A Blockchain transaction can be performed between any two identities (P2P) without
    verification by a central authority. As a result, Blockchain has the potential
    to significantly reduce hosting expenditures (both planning and production costs),
    while also eliminating compatibility issues in the centralized computer.


    – Persistence: since each transaction propagated over the network must be validated
    and stored in blocks dispersed across the entire system, every transmitted transaction
    will also be validated by many other peers and checked. As a result, any fabrication
    may be quickly recognized.


    – Anonymity: a created address may be used by any entity to join the Blockchain
    system. Moreover, to avoid disclosing their identity, a person may create a huge
    number of addresses. There is no longer a centralized entity that safeguards the
    confidential information of the user. This method ensures a certain level of anonymity
    for the Blockchain’s transactions. It should be noted that Blockchain cannot ensure
    complete anonymity.


    – Auditability: since each transaction on the Blockchain is verified and timestamped,
    users can easily track and audit prior records by connecting to the node in the
    decentralized system. Each operation in the Blockchain network may be monitored
    back to prior transactions repeatedly. It optimizes the transparency and traceability
    of Blockchain-stored data.


