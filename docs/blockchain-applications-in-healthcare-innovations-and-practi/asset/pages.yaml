  md: '# # Patient Data Privacy Using Blockchain


    With rapid transformation in the healthcare industry, the enablement of Information
    Technology and digitalization of healthcare services has increased the use of
    electronic health records (EHRs) exponentially. On one side of a coin this has
    many advantages like enhancing patient care, more efficient record management,
    research advancement, etc., but the other side of the coin warns us about the
    complexity in maintaining anonymity of patient data and being compliant to the
    privacy laws and regulations. The interest of hackers is already moving towards
    the healthcare industry, and there have been so many events in past few years
    where patient data in large amounts has been breached and misused. Healthcare
    entities are trying to protect patient data; still, there are so many breaches,
    the actual reason is that most of the controls are towards data security and there
    are many times when we may believe that security controls also safeguard privacy,
    but it is not true, and this generates the gap. Multiple data privacy laws and
    some laws/standards specific to healthcare data like Health Information Technology
    for Economic and Clinical Health (HITECH) Act of 2009, Health Insurance Portability
    and Accountability Act of 1996 (HIPAA), General Data Protection Regulation (GDPR),
    etc. provide various security and data privacy requirements which all healthcare
    entities need to comply with. These laws also provide various rights to the patients
    like consent, right to control, right to dispose, etc. Therefore, now the real
    question is how to implement data privacy controls which will maintain patient
    data anonymization, at the same time as making sure that healthcare entities comply
    with privacy laws and regulations and that all rights of the patients towards
    their data are also preserved: thus, the answer is Blockchain. The major features
    of Blockchain, i.e. decentralization, transparency and security make it a perfect
    fit for privacy protection. With the help of Blockchain, an environment can be
    created in which all patients can review their data before it becomes part of
    the records, permissioned Blockchain can solve the issue of patient data access
    and control, consensus algorithms and smart contracts will prevent patient data
    tampering and unauthorized access. It is known that bitcoins are pseudonymous,
    but with privacy preserving protocols for the Blockchain, it is possible to achieve
    anonymity. Similarly, one of the best things that Blockchain can provide for patient
    data privacy is its role as a data controller. The data controller and data processor
    are two important roles'
