    confidence and currency transfers in a range of electronic asset transactions.


    Distributed ledger technology is based on Blockchain technology across a distributed
    database that serves as a ledger and an encoded database that stores transaction
    records. DLT is a cutting-edge database solution with such a knowledge base in
    which encryption is used in each transactional update and confirmation is feasible
