  md: '# 9.3.1.4. Spiral model


    The spiral model is one of the most famous models of SDLC, as shown in Figure
    9.7. The spiral model looks like a spiral with many loops. Each loop presents
    as a phase of a software process, such as determining objectives, identifying
    and resolving risks, development and testing, and planning the next iteration
    (Kumar et al. 2014). To develop the large and complex software, the spiral model
    is used in a real-time application. This model is helpful for reducing the risk
    factor of the project because it applies a risk reduction mechanism for analyzing
    risk at any stage. That is why it is known as a risk-driven process model. This
    model is used to build a high-quality product.


    ![](img/9f63232d0022c87774dc3933e40b24aa_185_0.png)


    # Figure 9.7. Spiral model for software development (Kumar et al. 2014)


    # 9.3.1.5. Agile model


    The agile model is based on the iterative development approach (Barjtya et al.
    2017). In the agile model, the whole software project is divided into smaller
    iterations and each iteration is considered as a frame, as shown in Figure 9.8.
    This division helps us to minimize the risk factor of the project and reduces
    time and cost.'
  merge: -1
  img_proc: true
