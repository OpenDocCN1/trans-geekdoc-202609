    to be deposited in a specific block with a single source of contention, and when
    end-users are forced to pay large transaction fees may result in a huge impact,
    due to the present popularity of Bitcoin pairing.


    # 6.4.2. Off-chain storage


    On-chain storage is considerably neither economically nor precisely feasible as
    most of the Blockchain benefits can be used for off-chain storage solutions. The
    hash of a small bit of data, for example, can be placed in the chain. Because
    a hash is very modest in size, the cost of storage will be low as well. The task
    then becomes establishing a link between the chain’s hash and the physical storage
    place. Smart contracts and distributed hash tables (DHT) are comprised of dual
    solutions that are examined in this regard. In this instance, the data is also
    lost, and there is no way to restore it. Hash tables and distributed hash tables
    have a few ways to get around the drawbacks of using clever agreements for humble
    peer-to-peer storage and use numerous models of files in a storage network, so
    that even if the unique storage site becomes unreachable, the data is available
    everywhere. This eliminates the place as a unique point of disappointment for
    the data as the major concern of scattered hash tables is a resultant of (DHT).


    # 6.4.3. Trust issues in the context of health information exchange (HIE)


    The aspect of trust is critical in situations when consumers and sellers are separated
    based on Internet-based environments (Carvalho et al. 2016). Most of the HIE networks
    tend to share patient’s health information electronically with most of the care
