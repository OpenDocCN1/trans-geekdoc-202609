    Changing encryption keys is a common practice in healthcare systems and is a common
    method to avoid malicious, statistical attacks. But it incurs enhanced storing
    and managing costs with a large number of historical keys, which should be stored
    properly in sequence to perform decryption of some historical data in near future.
    This process leads to an increase in storage costs, specifically because of partial
