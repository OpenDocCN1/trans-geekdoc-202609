    # 7.4. Regulatory compliance requirements


    With the increase in size of data along with emerging technologies such as IoT,
    cloud, big data, etc., the instances of data breach have also increased. The impact
    of any data breach is very high when it involves sensitive data like health records.
    PHI (protected health information) suffers from a greater risk. In the last decade,
    there have been many cases of PHI breaches either by hospital electronic health
    record management systems or by insurance service providers, or by mobile healthcare
    applications such as online doctor consultations, online medicine buying apps,
    etc. Hence to strengthen medical data privacy and security governance, many countries
    have come up with regulations like HIPAA, HITECH, etc., even GDPR (General Data
    Protection Regulation) is not specifically for medical data, but it covers general'
