- pgno: 23
  md: '# Blockchain networks with permissions


    Businesses that discover a specific chain will often discover a highly secure
    Blockchain network. It is vital to note that public Blockchain networks can also
    be described as being of a restrictive nature where one is allowed to join the
    network and specific transactions. Participants must get either an involved participation
    or hitch permission.


    # Blockchain in a consortium


    Multiple entities can share the burden of maintaining Blockchain architecture.
    This is before the entities decide who has access to the information and who is
    allowed to make transactions. When all players must have permission and share
    responsibility for the Blockchain, a consortium Blockchain is the way to go. In
    this category, significant processing power is necessary, but only a small amount
    of it is available.


    # 1.2. Blockchain as distributed database


