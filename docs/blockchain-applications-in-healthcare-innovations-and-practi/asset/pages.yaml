  md: '# # Blockchain-based Platforms for the Healthcare Industry


    Blockchain technology is an emerging and promising technology, and studies conducted
    on Blockchain technology have shown a spurt. Some characteristic features of Blockchain,
    including transparency in data handling, better security insurance, open-sourcing,
    tracing and decentralization, make it a suitable innovation for undertaking the
    data imbalance issue in close to personal benefits announcing exchanges. A few
    efforts have been made at incorporating Blockchain technology in numerous business
    applications. Blockchain technology promises a decentralized trust giving an alternative
    to centralized data management and storage in the computerized or the digital
    environment. With the better and advanced models storage, tracking and management
    of payment systems and others, a significant change can be brought in the various
    industries and services. However, other than the decentralized storage property,
    Blockchain technology offers much more valuable propositions such as much more
    advanced and innovative investment models and crypto-economic currencies, radically
    new types of advanced models for governance which can generate further development
    in the age where digital platforms and business interactions have multi-stakeholders.
    Blockchain technology is a decentralized distributed digital ledger and is capable
    of transforming the underlying operating system that will administer the way our
    cities will function in the future. Blockchain is presently bringing a revolution
    in numerous industries like finance, healthcare, supply chain, insurance, registry
    and the Internet of Things (IoT). Numerous industries integrate Blockchain with
    their frameworks to benefit from the advantages of the Blockchain.


    # ### 3.1. Introduction


    The healthcare sector has its requirements for security and privacy to protect
    the patient''s personal and medical information. We are living in a world where
    records and data are being stored on the cloud platforms and also the use of mobile
    health services has become common due to its easier access, therefore making the
    risk of'
  merge: -1
  img_proc: true
- pgno: 66
