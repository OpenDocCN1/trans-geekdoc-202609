    layer; for example, adopting smart contracts makes it much easier to keep records
    of contractual partners’ prior behavior. Contract words can include references
    to legal contracts and are self-enforcing. Smart contracts reduce the danger of
    deliberate and unintentional exceptions, as well as the need for trusted intermediates.
    An intelligent agent is a smart contract. In other terms, it is a computer software
    that can'
