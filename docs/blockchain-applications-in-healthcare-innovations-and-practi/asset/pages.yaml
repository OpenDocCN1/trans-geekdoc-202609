- pgno: 182
  md: '# 9.3.1.1. Waterfall model


    The waterfall model is the first model, introduced by Royce in 1970 (Despa 2014).
    Another name for this model is a linear sequence life model, as all of the phases
    are executed one by one, as shown in Figure 9.4. Hence, the next phase starts
    only when the previous phase is fully executed. It does not allow us to go back
    to the previous step. It contains various phases, such as requirement analysis,
    system design, implementation, testing, deployment and maintenance (Kumar et al.
    2014). The first phase in this model is the analysis of the requirements of the
    project. After analyzing, the next phase is the designing phase, in which the
    developer designs the framework of system according to the requirements and specifies
    the overall system architecture. After design, the next phase is the implementation
    phase, in which the design structure is translated into a programming language.
    After the development of the final product, the developers apply testing mechanisms,
    verify whether the product meets all of the user requirements or not, and detect
    faults and failures. The next step is the deployment phase, in which the product
    is deployed into the market for client use. The last phase is the maintenance
    phase. In this phase, the developer checks some issues after deploying the product
    in the client environment. If a problem occurs, they resolve that problem, increase
    productivity and release it. This model is used only for small projects and serves
    as a baseline for other models.


    ![](img/9f63232d0022c87774dc3933e40b24aa_182_0.png)


    **Figure 9.4. Waterfall model for software development**'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# 9.3.1.2. Iterative model


    The iterative model is approximately similar to the traditional waterfall model,
    as shown in Figure 9.5. The traditional model follows the step-by-step process
    for developing a project, but the iterative model follow the cyclic process. The
    iterative model provides a feedback path in the preceding phase. After completing
    the project, developers can easily go back to the particular phase where an error
    has occurred. The feedback paths allow the reworking of the phase where the error
    was detected. This model contains various phases, such as requirement analysis,
    system design, implementation, testing, deployment and maintenance (Despa et al.
    2014). The process of developing a project starts from a requirement phase. After
    collecting the product requirements from the client, the developer starts to design
    the project and finally implements the software product code on the basis of collecting
    requirements. After completing the coding, the developer applies some test methods
    to find an error. Once an error is detected, the developer goes back to that particular
    phase where the error occurred and corrects that error. At the end, it deploys
    the product in the client working environment. After deploying the product, if
    any bugs or errors are presented in the software, the developer updates the product
    with the help of a debugging process. This model is useful for small software
    applications.


    ![](img/9f63232d0022c87774dc3933e40b24aa_183_0.png)


    Figure 9.5. Iterative model for software development'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# 9.3.1.3. Prototyping model


    The prototyping model suggests that before developing the actual product, developers
    propose a working prototype of the software system (Despa et al. 2014). This model
    is used when the client does not know the exact requirement of the product and
    technical solutions are unclear to the developer. In this model, developers firstly
    develop a prototype of the product, then test and refine it on the basis of customer
    feedback. They repeat this process until the final acceptable prototype is achieved.
    After accepting the prototype, the developer designs, implements and tests the
    final product. This model contains various phases, as shown in Figure 9.6, such
    as requirement gathering, quick decision, build prototype, customer evaluation
    of prototype, refine requirements based on customer suggestions, design, implementation,
    test and maintenance. This model is useful in the absence of detailed information
    about the final product.


    ![](img/9f63232d0022c87774dc3933e40b24aa_184_0.png)


    Figure 9.6. Prototyping model for software development'
  merge: -1
  img_proc: true
