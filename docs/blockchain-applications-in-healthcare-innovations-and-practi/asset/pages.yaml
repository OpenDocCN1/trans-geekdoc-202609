  md: '# Analyzing and Modeling the Challenges Faced by the Healthcare Sector in the
    Adoption Process of Blockchain Technologies


    Using Blockchain technology, information can be recorded and shared in a community.
    This study aims to identify the challenges healthcare organizations face in adopting
    Blockchain technology to improve patient care. Three hypotheses are being proposed
    by taking three independent variables and one dependent variable. Target populations
    are mainly the IT staff working in the hospitals. The respondents were selected
    from the employees who had IT information about their individual healthcare firms’
    present and future tasks. A total of 536 questionnaires were sent for a survey,
    out of which only 350 valid responses are being counted as the rest are mostly
    unanswered or partially filled. The findings showed that the proposed hypotheses
    are being accepted. This study will help Blockchain providers and the healthcare
    industry to understand the problems and find a probable solution. Further analysis
    can be extended to find a solution to the challenges pointed out in the research.


    # 4.1. Introduction


    Blockchain (BC) is one of the latest innovative technologies first introduced
    in 2009. BC operates by storing data in decentralized recording ledger devices
    with the BC infrastructure (Beck et al. 2017). The organization’s foundation is
    shared, and it works by having both organization clients (who participate in exchanges)
    and BC'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'excavators (that work with the businesses in a disseminated record). The document
    is put away in a decentralized organization of hubs produced by all diggers in
    the organization using cryptographic cycles (Coita et al. 2019). As it is fabricated
    using agreement systems, computerized marks and hash chains, the BC record has
    exceptionally secure capacity abilities (Kshetri 2017). BC offers different administrations
    like discernibility, trustworthiness, classification and non-disavowal because
    of these high-level highlights, while putting away all data in a public and decentralized
    way, using security safeguarding (Rios et al. 2018). Banking, insurance, real
    estate and government are only a few industries where BC can be used. Various
    researchers have highlighted the applications of BC in the healthcare industries
    and how BC can bring revelation in the healthcare sector (Mukherjee et al. 2021a,
    2022b).


    Additionally, this technology has the potential to benefit health information
    exchanges (HIEs) (Mazlan et al. 2020; Hussien et al. 2021). However, the technology
    is not yet fully mature and cannot be used as a panacea in the healthcare industry
    (McGhin et al. 2019b; Khatri et al. 2021). BC technology allows healthcare stakeholders
    to share their network access without compromising security or integrity (Saranya
    and Murugan 2021). Access to public and private keys, proof-of-work and distributed
    data in cryptography give healthcare information a new level of integrity (Siyal
    et al. 2019). Drugs can be easily tracked as they move from the manufacturer to
    the patient using BC technology. They can also be followed more quickly as they
    move through the supply chain, which helps to prevent drug fraud (Mukherjee et
    al. 2022).


    In terms of revenue and employment, healthcare is now one of India’s largest industries.
    Healthcare encompasses hospitals, doctors, clinical trials, outsourcing, telemedicine,
    tourism, health insurance and medical equipment. The Indian healthcare industry
    is growing as the country’s population, services and public and private spending
    all increase (Rout et al. 2019). The Indian healthcare system is divided into
    two major components: public and private (Mukherjee et al. 2022a). The government
    provides a small number of secondary and tertiary healthcare institutions in major
    cities. It is concerned with providing basic healthcare in rural areas through
    primary healthcare centers (PHCs). The private sector provides most high school,
    tertiary and quaternary care in metro and level I and level II cities.


    IT innovations that link up many islands of healthcare information can improve
    quality and decrease costs significantly, for instance, by keeping the different
    providers informed, thus reducing omission or commission errors (Zhang et al.
    2018). With the help of this study, healthcare companies can identify the challenges
    they face when implementing BC in their systems. The literature review identified
    technical, social and organizational challenges.'
