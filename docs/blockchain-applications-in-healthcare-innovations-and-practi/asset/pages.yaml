    # 9.2. Literature review


    Every new technology has helped to increase human productivity, performance and
    its prosperity. Many industries have been attracted due to this new technology,
    and the healthcare industry is one of them. Technology has brought about massive
    changes in the healthcare industry today. Due to this, users can now choose the
    best medical devices according to their requirement. The increases in demand for
    software related to healthcare applications provide many benefits to patients
    and doctors. With the help of these applications, the hospital can easily create
    a database related to the patient''s medical records and treatment records; the
    doctors can easily study diseases and diagnose them quickly and accurately. Using
    healthcare software and its applications, we can easily perform various activities,
    such as blood testing, brain testing, body scanning, Covid-19 testing, etc. Remote
    consultation and different mobile apps have also led to improving patient care
    and giving better results for the patient. The main aim of implementing healthcare
    applications is to provide a lower cost, minimize error, improve patient experiences,
    easily update their records and also trust these sensitive patient records. However,
    technology innovation and the high expectations of the patient create new challenges
    for the medical organization, such as quality, privacy, security and trust of
    the patient data. Hence, the user searches for better-quality products and services.


    Healthcare applications always demand the best technology, methodology and a software
    development model to resolve the above problem. A proper software development
    cycle model is essential for any software to become successful. An SDLC model
    is a software engineering process used to design, develop, test and deploy any
    software system. In other words, we can say that SDLC is considered as a framework
    that provides a sequence of activities for the system developer, as well as system
    designer. SDLC contains different phases that are essential for developing any
    software system, such as requirement analysis, design, coding and testing. Different
    SDLC models are suitable for specific projects that depend on some conditions
    such as which organization uses it, the stability of the requirement, the risk
    factor, budget and time duration of the project (Rastogi 2015; Gajalaksmi 2016).
    It gives perspective characteristics that provide suggestions of how to develop
    a software system.'
