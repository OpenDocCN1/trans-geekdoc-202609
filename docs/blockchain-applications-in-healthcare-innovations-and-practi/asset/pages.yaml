    see three folds in the US$ 133.44 billion by 2023. The changed lifestyle of the
    people and increment in the mean income of people and government and insurance
    policies has resulted in increased health awareness among the people, leading
    to this massive increase in the healthcare industry (Gul et al. 2020).


    # ## 3.2. Literature review


    In the paper by Tripathi et al. (2019), the problem related to the medical sector
    has been discussed, which mainly includes security concerns and how Blockchain
    technology can significantly help in dealing with such issues. With the flood
    of medical records using EMR (Electronic Medical Records) and ICT, Blockchain
    is being used in many medical organizations. The paper discusses Blockchain technology
    and also the SHS-Smart Healthcare System and the challenges faced by it, further
    proposing a Blockchain-based SHS framework for analyzing and finding a solution
    to security and integrity issues.


    The paper by A. Islam and Shin (2020) proposes a scheme in which an unmanned vehicle
    (UAV) collects healthcare data and stores it in the nearest server. Firstly, a
    relation is established by the UAV with the body sensor hives (BSHs) through a
    token and afterwards a shared key is generated with BSHs that further establishes
    a low-power secure communication. Once all the data is collected by UAV, it decrypts
    all of the encrypted data (shared key encryption is done) and works out a two-phase
    implementation. And thus, after validation, the UAV sends the data to the server
    which stores it in the Blockchain network. An even analysis is presented in the
    paper to show the practicability and the feasibility of the proposed scheme.


    A smart healthcare business model observes the customers at the heart of the business,
    with the evolution of Blockchain technology. The paper by Gul et al. (2020) established
    that the suggested model can analyze the customer’s level and then provide prizes,
