- pgno: 90
  md: '# 4.6. Discussion


    Worldwide, healthcare systems are under tremendous stress due to the pandemic,
    which has resulted in supply chain disruptions, counterfeit medical products,
    health data management and security, among other issues. New and emerging technologies,
    such as Blockchain, the technology behind cryptocurrencies, can address these
    issues (Saranya and Murugan 2021). This study will identify the challenges that
    healthcare sectors will face in implementing a BC system. The three challenges
    identified are mainly the technical challenges, social challenges and organizational
    challenges. TC stands for technical challenges faced by the BC adopters. These
    challenges have been identified in previous studies (Sadhy and Sadhya 2018; Onik
    et al. 2019; Pandey and Litoriya 2020; Saranya and Murugan 2021). SC stands for
    the social challenges faced by the BC adopters. These challenges and results have
    been identified in previous studies (Shah et al. 2018; Shahnaz et al. 2019; Siyal
    et al. 2019; Wamba and Queiroz 2020; Wong et al. 2020). OC stands for organizational
    challenges faced by the BC adopters. These challenges and results have been identified
    in previous studies (Zhang et al. 2018; Zhao et al. 2019; Wong et al. 2020; Yaqoob
    et al. 2021). Blockchain adoption in healthcare faces several challenges, including
    technical issues and ownership concerns (Kant Pal et al. 2021). Technological
    challenges such as processing speed and massive data duplication will be resolved
    as technology develops (Zhang et al. 2018). As a result of its benefits in payment
    integrity, data interoperability and security, Blockchain can transform the healthcare
    ecosystem. A time-consuming and labor-intensive pharmaceutical research process,
    for example, would be transformed into a more efficient, data-driven one (Tanwar
    et al. 2020). Assigning patient control, ownership and access to patient data
    using a Blockchain solution would make this possible.


    # 4.7. Conclusion


    As part of the study, healthcare companies will be asked to describe their challenges
    when implementing BC in their systems. Many industrial sectors use BC to improve
    transparency and tracking. After completing a structured literature review, a
    list of issues facing healthcare organizations was compiled for the research project.
    An Indian hospital is currently working on a survey-based research questionnaire.
    For data analysis and modeling, exploratory factor analysis and structural equation
    modeling are used. As a result, more challenges can be identified by extending
    this study into other fields.'
