  md: 'We examined the Scopus database for research published up until November 1,
    2021. Studies on Blockchain-based electronic health records (EHRs) have been published
    not just in medical publications, but also in journals from other fields such
    as IT, law, engineering, economics and business administration. As a result, given
    its comprehensive coverage of journals in both the scientific and social sciences,
    we chose the Scopus database as the source of papers for this study.


    We employed four processes to conduct a comprehensive quantitative review: discovering
    possible research, removing unnecessary research, verifying important studies
    and evaluating selected articles.


    In the first phase of selecting suitable research, we conducted a preliminary
    search for papers that had a term like “electronic health record” in their titles,
    abstracts or keywords. This phase yielded a total of 70,616 prospective investigations.
    In a separate search, we limited these studies to those that had key phrases like
    “Blockchain electronic health records” in their titles, abstracts or keywords.
    This resulted in a total of 500 prospective research.


    In the second phase, a filter is applied to remove the articles in press which
    yields the 484 documents out of 500 documents. The Scopus database also shows
    the articles in press which means that the articles are not published yet online
    but are in the production stage.


    In the third phase of verifying the significance of the 484 available studies,
    we probed their document types, titles, abstracts and keywords, and filtered out
    464 studies that satisfied the set of criteria of our search with the publication
    in English language alone. This stage approved 464 articles in total.


    In the fourth phase of analyzing the 464 articles, we looked at how they were
    distributed by publication year, language, location of origination, journal and
    yearly average number of citations. The nations of origin of the publications
    were studied by identifying the countries of the organization to which the authors
    belonged. If an article had two writers working for organizations in two distinct
    nations, the country of origin was determined to be two countries. The top 10
    articles were determined using the yearly average number of citations of the 464
    articles. When corrected for the effects of time after publication, the yearly
    average number of citations can more precisely indicate the amount of influence
    of each item on other research than the overall number of citations. A 2016 article,
    for instance, is more likely to be mentioned than one produced in 2019. As a result,
    we ranked the 464 publications using the yearly average number of citations.'
