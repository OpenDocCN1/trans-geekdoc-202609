    # 1.3. Architecture of Blockchain in healthcare


    Blockchain as a ledger technology has a continuous list of transactions and data
    records. It simplifies and expedites healthcare and its related processes. The
    interoperability nature along with the property of supply chain validation allows
    us to dramatically reduce the back office load, data management and maintenance
    cost. There are five key areas in healthcare that are promptly driven by Blockchain
    technology.


    +   1) Online access – the Blockchain allows patients to have online access to
    their longitudinal medical records, providing them with the security key and thus
    allowing the interoperability of data.


    +   2) Maintenance of health records – the Blockchain allows the longitudinal
    way of maintaining healthcare records. It also maintains a secure medical record
    between multiple healthcare organizations and the patient. This gives the futuristic
    approach to the Blockchain.


    +   3) Automation of adjudication of health claims – the smart architecture of
    Blockchain allows the execution of the transactions of the contract, which helps
    the support of compliance audits as well as the completion of a claim through
