  md: '# 5.6. Proposed framework for the EHRs using Blockchain


    This segment introduces the proposed solution for EHR sharing, which is built
    on the Blockchain network. For block transactions in the network, various methods
    and configurations are used. This section describes the Blockchain-based EHR system
    architecture. The proposed scheme has six members. The entities involved are:
    patients, doctors, administrative staff, insurance company, lab technicians and
    pharmacies.


    +   - Administrative staff: the administrative staff is responsible for registering
    the users into the Blockchain. They register the users on the Blockchain and provide
    permissions to the users.

    +   - Doctor: the doctor is responsible for adding the medical details of the
    patient to the Blockchain. The doctor is also authorized to view the details of
    the patient.

    +   - Patient: the patient is responsible to add the previous medical details.
    The patient is also authorized to insert the new medical record.

    +   - Lab technician: the lab technician is responsible to add the test reports
    of the patient. They cannot access the patient’s medical details.

    +   - Pharmacy: the pharmacy owner is responsible for delivering the required
    medicines to the patient. He is able to view the prescription uploaded by the
    doctor. The pharmacy owner cannot access the medical details of the patient.

    +   - Insurance company: the insurance company is responsible for settling the
    hospital bills of the patient. The insurance company can only view the hospital
    bills of the patient uploaded by the administrative staff of the hospital.


    # 5.6.1. System workflow


    Figure 5.6 shows the workings of the proposed model.


    Firstly, the administrative staff registers the patient on the Blockchain by the
    registration smart contract. Once the patient is registered, the administrative
    staff registers the particular doctor and grants permission via the smart contract.
    After the registration process is completed, the doctor provides the treatment
    to the patient and continuously updates the records on the Blockchain network.
    The doctor is not able to delete the particular record on the Blockchain. Once
    the initial medication is done, the doctor recommends lab tests to the patient.
    The patient conveys the lab information to the administrative staff so that only
    an authorized lab technician is able to update the record on the Blockchain. Once
    the test is done, the authorized lab technician is able to upload the reports
    that can be accessed by the authorized doctor. Once the treatment is done, the
    doctor will upload the prescription on the'
