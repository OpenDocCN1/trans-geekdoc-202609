    # 4.3. Challenges of Blockchain in healthcare


    # 4.3.1. Technical challenges (TC)


    “Technical difficulties” refer to hardware and software problems with the information
    technology infrastructure. The scalability problem with BC technology was due
    to the network’s low rate of handling transactions per second. Authorization and
    protection problems, high energy usage and low processing charges are two of the
    more technological challenges found (Dutta et al. 2020; Kumar and Krishnamoorthy
    2020; Alazab et al. 2021; Mikalef et al. 2021).


    H1: TC influences BCH.


    # 4.3.2. Social challenges (SC)


    Firms face various social problems, the most common of which is regulation. The
    BC regulatory framework varies from country to country. Despite legitimate privacy
    concerns, it is difficult for legal authorities to grant access to medical records
    due to decentralized medical data and the absence of an intermediary'
  merge: -1
  img_proc: true
- pgno: 84
  md: '(Francisco and Swanson 2018; Verhoeven et al. 2018; Di Vaio and Varriale 2020;
    Koh et al. 2020; Orji et al. 2020). BC implementation of healthcare may be hampered
    by a lack of government legislation and guidelines.


    H2: SC influences BCH.


    # 4.3.3. Organizational challenges (OC)


    In most organizations, there are setup and exchange costs, interoperability issues
    and technical skills shortages that must be addressed to succeed. The absence
    of certainty among parties and confined open principles has been reprimanded for
    the interoperability issue, making a substantial trade of well-being data between
    medical services associations troublesome (Clohessy et al. 2019; Kamble et al.
    2019; Queiroz and Fosso Wamba 2019; Sheel and Nath 2019; Gölkalp et al. 2020;
    Wamba and Queiroz 2020; Kouhizadeh et al. 2021). Fundamental mechanical abilities
    and IT experts who are specialists in working on the innovation are expected to
    keep an incorporated drug inventory network between BC partners. While BC sets
    aside cash for the long haul, the underlying expense of establishment is high.


    H3: OC influences BCH.


    # 4.4. Research methodology


    Primary and secondary data collection methods are employed. To collect preliminary
    data, the target population is surveyed using questionnaires (Mukherjee et al.
    2021). The secondary data collection method consists of articles published in
    journals, magazines, reports, etc. (Mukherjee et al. 2021b). It is necessary to
    prepare a structured questionnaire to conduct survey-based research. This campaign
    is aimed at hospital employees familiar with BC’s technology and know-how to use
    it. For this study, simple random sampling was used as a sampling technique (Baral
    and Verma 2021). The questionnaire was sent to 536 selected respondents, out of
    which 350 respondents returned the filled questionnaires, which were appropriately
    and correctly filled in. After collection of the common method, the collected
    data was checked for bias (Mukherjee and Chittipaka 2021). For this, the Harman
    test was performed, giving 33.451%, which was below the threshold level of 50%
    (Mukherjee et al. 2022b). Using exploratory factor analysis (EFA), confirmatory
    factor analysis (CFA) and structural equation modeling (SEM), further data analysis
    is performed.'
