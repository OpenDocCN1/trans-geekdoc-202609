    # 2.1.1. Types of Blockchain


    Public Blockchain: Anyone with Internet connectivity may use Blockchain technology
    in the public Blockchain (Idelberger et al. 2016). Everyone has access to the
    transaction details and the verification of the same. Members of the public Blockchain
    may engage throughout the consensus protocol. Bitcoin and Ethereum are two mechanisms
    that make use of public Blockchain technology.


    +   - Hybrid Blockchain: a hybrid Blockchain’s information is either private or
    public. There are hybrid Blockchain systems that are partially decentralized.
    A Hyperledger is one of the major examples of approaches that employ hybrid Blockchain
    systems.


    +   - Private Blockchain: the write privileges of the blocks in a private Blockchain
    are managed by a specific authority, whilst the read permission is either public
    or limited. The range of nodes that can join this Blockchain is restricted (Pilkington
    2016). The Blockchain’s transaction information is not accessible to every node.
