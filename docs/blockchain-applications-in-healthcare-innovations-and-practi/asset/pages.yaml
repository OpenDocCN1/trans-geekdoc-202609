- pgno: 62
  md: '# 2.6.2. Privacy and legal issues


    There are two types of smart contract privacy concerns: 1) contract data privacy;
    2) reliable data feeds privacy. Not only events, but also contract-related metadata
    (especially for content on the public Blockchain), including such bytecode, activation
    arguments and so on, are now publicly accessible. As a result, it is a significant
    task to keep essential functions/methods hidden, use cryptography and prevent
    data that should not have been made public from being revealed. The contracts
    layer is primarily responsible for smart contract legal concerns.


    In addition to the issues described above, there are numerous other issues based
    on the architecture and contract layers. Poor smart contract design mechanisms
    result in an increase in contract running expenses and minimizes running efficiency
    on the operations layer. Malevolent intelligent agents on the intelligence layer
    may profit from their malicious conduct and so on.


    # 2.6.3. Immutability issue


    The immutability property is a key aspect of smart contracts. Indeed, once a smart
    contract is launched, no one can modify the code. However, the disadvantage of
    the immutability notion in smart contracts is that in the event of any flaws in
    the code, the immutability characteristic of a smart contract prohibits them from
    being corrected. Similarly, if circumstances change (e.g. the parties have mutually
    decided to modify the conditions of their commercial transaction, or if the legislation
    changes, etc.), there is no simple solution to modify a smart contract. To overcome
    the immutability issue, lengthy and perhaps expensive evaluations of the smart
    contract by experts prior to its implementation in a Blockchain are necessary.


    # 2.7. Conclusion


    Due to the tremendous advancement of Blockchain technology, creating SCs has been
    a prominent subject for both research and businesses. The immutability and irreversibility
    of smart contracts can encourage users to exchange currency, stocks and proprietary
    information, as well as other commodities in a clear, conflict-free way, without
    the participation of a foreign entity. This chapter provides an introduction to
    Blockchain technology, along with some characteristics and applications. It also
    provides in depth details about Blockchain smart contracts, its operating mechanism
    and applications in different domains. It provides details about the different
    platforms for smart contract and concludes with the research challenges in implementing
    smart contracts.'
