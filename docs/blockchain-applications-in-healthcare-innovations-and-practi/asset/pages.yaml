  md: 'and citizens can have access to the health records and treatments that have
    been performed in Estonia with the help of this technology, indicating a way in
    which Blockchain can be applied similarly as stated above”.


    # 3.5.2. MeDshare


    MeDshare is a platform that is designed for sharing the data and records amongst
    medical professionals who store their data and records in a not so trustworthy
    environment. This system looks after the basic requirements in the medical sector
    such as maintaining the patient’s privacy and risk of malicious activities on
    the medical records. MeDshare system uses the Blockchain technology providing
    data management, auditing and data provenance in the cloud-based environment among
    the companies. The system is designed in such a way that smart contracts and access
    control mechanisms are used to keep a track of data and to retract any malicious
    entity on the discovery of any kind of misbehavior in the system. The main aim
    of MeDshare is to provide the cloud providers (that store the medical records)
    with the capability of data management, auditing and data sharing to the medical
    industry without leaking the private information of the patient. This system is
    divided into four layers.


    The first layer consists of the arrangements that are made for the users who are
    allowed to access the medical records.


    The second layer (data query layer) consists of certain queries for accessing,
    processing, forwarding and responding to the requests. Here, the processes are
    broken down into two components – the first component being the system consisting
    of queries that are in control for generating requests, and the second component
    being the trigger that deciphers the transactions to and from the smart contracts.


    The third layer (data structuring and provenance layer) involves processing of
    requests for accessing the information or data from the existing database amidst
    various existents such as smart contracts, processing, authenticators, smart contracts,
    consensus nodes and Blockchain systems.


    The fourth layer (existing database infrastructure) comprises the database that
    is executed by individuals to complete their tasks.


    # 3.5.3. OmniPHR


    OmniPHR is a model to handle the health records and information of the patients,
    giving them a clear view of the records stored across multiple health'
