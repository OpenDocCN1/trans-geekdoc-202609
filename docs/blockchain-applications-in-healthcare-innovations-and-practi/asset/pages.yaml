    by several threats that created loopholes and removed funds. The hacker attacked
    the smart contracts, which gave way for vulnerability to enter in the form of
    bugs or errors in the code (Sayeed et al. 2019).


    Another historical popular attack took place at Parity Multisig Wallet. This was
    discovered when the hacker had an opportunity to make the wallet vulnerable with
    version 1.5+. This flaw allowed the hacker to remit more than 30 million USD,
    which is around 150 million Ether. Once the Parity Wallet initiated a smart contract,
    two hacks took place consecutively. The attacker executed a script that used bugs.
    Due to this, two hacks were initiated; in the first one, the attacker initiated
    a call to update the status of the wallet. This means the attacker can act as
    an owner and remove all of the funds from the wallet (Sayeed et al. 2019).


