  md: 'providers. It helps in keeping data up to date when it is stored in another
    system or modified by another provider. OmniPHR addresses the difference between
    the EHR and PHR. EHRs are set up according to the government standards that help
    to have uniform records over the country; this makes the records accurate and
    up to date. The EHRs are updated on a regular basis by medical professionals without
    the involvement of patients, unlike PHR in which the patients keep a track of
    their records. Here, OmniPHR creates a framework that helps in addressing this
    problem where the patients can have a comprehensive look at their records alongside
    the medical community that can have the desired accuracy of the records. It makes
    use of Blockchain technology with the focus of unifying data that has been distributed
    over several organizations. PHR would be stored in an organized way hierarchically,
    encrypted and distributed in data blocks present on the network. The user can
    access the OmniPHR records from anywhere – home, work or hospital. Some of the
    cloud computing features that are used, scalability, elasticity, middleware, encryption
    protocols, open standards, etc., are included in the model. The data flow of the
    model is data provided to open standards, and then it is changed by middleware
    technologies and encrypted and authorized by privacy and security modules before
    storing it in the series of repositories.


    # 3.6. Blockchain during the Covid-19 pandemic


    In today’s world, the one which we refer to as the “global village”, there has
    been a massive rise in health diseases and health issues, due to the sedentary
    lifestyle of the people and many factors including ecological and environmental
    factors. Recently, the Covid-19 virus has been wreaking havoc all across the globe
    since December 2019 leading to more than 54 million people affected and over 1300,000
    deaths. This pandemic has overburdened healthcare systems all over the world.
    Because of its significant features which include decentralization, immutability,
    transparency and auditability, Blockchain has turned out to be very useful in
    technology.


    > European Parliament Research Service considers the Blockchain technology to
    be one of the top 10 vital technologies to mitigate Covid-19 challenges.


    The applications of the Blockchain technology used to mitigate Covid-19 challenges
    have been discussed in the paper by Abd-alrazaq et al. (2020). The paper jots
    down 10 cases of the Blockchain technology to tackle the situations that have
    emerged due to the coronavirus, out of which six studies discuss contact tracing,
    i.e. the process that traces down those who were in close contact with the people
    who tested positive with Covid-19, and the remaining four studies discuss the
    application of immunity passports, which will show that a person is free from
    the disease'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'because either they have already been infected with the disease or have been
    vaccinated with the Covid-19 vaccine.


    The tracing of Covid-19-positive cases in the community was the primary requirement
    of the authorities to keep the outbreak of the virus in check. With knowing or
    having the records of people who were tested positive with Covid-19 and their
    close contacts, we could identify the “hotspot” areas and try to prevent the further
    spread of the virus. The technology that was being used was not giving assurance
    in preserving privacy with the centralized design of the technology giving the
    government the ability to do mass surveillance. Now Blockchain having a decentralized
    system is being used to provide better protection for government documents. Similarly,
    immunity passports, also known as immunity certifications or recovery certificates,
    given to the positive patients after they have fully recovered from the infection
    and Covid-19 diagnoses, make use of Blockchain technology in storing and sharing
    patient’s information to only authorized users. For accessing sensitive documents,
    smart contracts are also being used in the form of an extra layer. The general
    properties of the Blockchain, which includes the applications for remote monitoring,
    tracking status and identity verification, are now being used.


    # 3.7. Conclusion


    The growing demand for health has led to the development of hospitals and medical
    institutions further leading to an increase in medical data and the need for managing
    it. Thus, we have discussed Blockchain technology in association with the medical
    sector. Health records including the personal details of the patients are to be
    kept confidential. These records are saved in “medical clouds” but can be misused
    by the other parties, for example by deleting the original data or modifying it.
    The problems related to the healthcare industry and how they can hamper technological
    advancements in the industry preventing it from growing have also been discussed
    in this chapter. Blockchain due to its various properties can be a solution to
    these problems, and Blockchain-based systems seem to exhibit higher robustness,
    scalability and immunity that allows secure data sharing and data privacy. Blockchain
    technology has now gained great attention in many countries and companies all
    over the world.


