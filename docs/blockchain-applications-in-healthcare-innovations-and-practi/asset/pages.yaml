  md: 'form of bad-mouthing as well as the scams happening in the financial industry
    in the form of loan applications, etc. The idea of fraud detection can also be
    applied in the concept of crowdfunding where we have a bunch of people who are
    investing or buying stocks from the company. Blockchain technology can be used
    as a low-cost platform for registering shares and stocks and thus makes transactions
    quite secure, effective, efficient and easier.


    # ## 3.4.3. Identity verification


    The government system uses passports and the fingerprints of an individual to
    identify the person but Blockchain technology can provide an alternative to these
    identification methods (Khanna et al. 2020). Blockchains can identify the user,
    for example, using Blockchain in notarizing marriages, birth certificates and
    business contracts. For a person can prove their existence at a point in time,
    Blockchain would use its “distributed ledger” property and is further verified
    by a group of people by distributed nature of the Blockchain technology. For example,
    we can use Blockchain technology to validate marriages, birth contracts and business
    contracts.


    # ## 3.5. Examples of healthcare platforms using Blockchain


    # ## 3.5.1. Data sharing using Gem Health Network


    As discussed earlier, the healthcare sector contains the records of patients and
    stores them in a centralized database, which can lead to issues such as data security
    and interoperability. If a patient needs the records when going through a specialized
    treatment either in another hospital, interstate or overseas, then the sharing
    of data becomes a problem. Every time a person sees another doctor, there is a
    need to form a new set of records and update several existing records, changing
    the communication protocols between the doctors, and also there is IT interference
    which is very time-consuming. Hence, there has been a solution given out for the
    problem by the Gem as Health Network that uses Ethereum Blockchain Technology
    and creates a shared network infrastructure. This network helps different professionals
    in the healthcare sector to access the same information and records of the patients,
    unlike the centralized database. Access to the latest treatment information (which
    is transparent and relevant) is only given to the authorized users. This helps
    in reducing the risk of neglecting a person’s health issues due to misinformation
    or outdated health records.


    For example, we have “Estonia who has collaborated with Guardtime that uses Blockchain
    technology. Thus, all the medical professionals, insurance companies'
