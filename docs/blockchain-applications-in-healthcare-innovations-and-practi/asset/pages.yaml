    # 1.1. Concept of Blockchain


    A Blockchain is a system for storing data in a manner so that it becomes impossible
    or extremely difficult to hack or change the system. Blockchain is generally a
    book of digital transactions, which are first copied and circulated across the
    complete network of systems present in the Blockchain architecture. All the blocks
    present in the chain are made up of a number of complete transactions, including
    each time any new transaction occurs for the system of Blockchain, a newly entered
    transaction is entered into each participant’s book. And whenever there are multiple
    participants, the multiple participant architecture is managed by the decentralized
    database, which is popularly called distributed ledger technology (DLT). Blockchain
    may be marked as a common and permanent book that organizes the activity of record
    keeping in a network of blocks through input transactions, new insertions and
    asset tracking. According to Ahram et al. (2017), Blockchain presents a safer
    way for exchanging service and information transactions.


    An asset might be physical (e.g. a car) or intangible (e.g. land), physical (patient
    treatment) or intellectual (creative property, patents, copyrights, branding)
    data or medical records (personal information, laboratory results, medical findings,
    history of diseases, doctor’s prescription). Things of value can be followed virtually
    and can also be alternated on a network of Blockchain, via cost cutting, along
    with the reduced risk for all those users involved in it. Blockchain is a DLT
    in which all the transactions are documented through an enduring cryptographic
    signature known as a hash.


    Blockchain has provided a platform that can improve the transparency as well as
    authenticity of healthcare data, maintaining permissions and also streamlining
    the claim process (Angraal et al. 2017).


    Blockchain is a form of dashed information. The quicker it is received, the more
    accuracy it preserves. Blockchain provides each shared piece of data and all of
    the entirely transparent data that is stored on an accounting book immediately,
    but only the network’s members that have permission to have access to it. Hence,
    according to the researchers, Blockchain is considered to be an ideal way for
    delivering'
  merge: -1
