    # ## 7.5.2. Quantification of privacy and mathematical form of differential privacy
    (Sun et al. 2019; UI Hassan et al. 2020)


    Differential privacy quantifies privacy. It does not define privacy as a binary
    value, for example if data has been or has not been leaked, but quantifies privacy
    as “privacy loss” which is at risk of being exposed. The value for “privacy loss”
    will increase with the number of times data is processed. The terms, which are
    used in equation [7.1], are given as follows:


    +   - the parameter ε represents the privacy loss;

    +   - D1 and D2 represent the adjacent dataset;

    +   - F is the randomized function for differential privacy and the range of F
    is D1 x D2;

    +   - P is the probability which satisfies if and only if (O ∈ F), where O is
    the output of F. We obtain the following:


    ```

    P[F (D1) ∈ O] ≤ exp(ε) × P[F (D2) ∈ O]      [7.1]

    ```


    In this case, Range(F) is the maximum value for the function F and ε is the parameter
    for privacy loss which helps in controlling the privacy level.'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# 7.5.3. Advantages of using differential privacy in Blockchain


    Now as we have already explained the concept of differential privacy, it will
    be easier to understand how it is useful in Blockchain. The fundamental features
    of Blockchain, which make it the next generation of secured storage, and using
    differential privacy in Blockchain will enhance the privacy of Blockchain. Some
    examples are given below:


    +   - protection of sender and receiver addresses from punitive and feather forking
    attacks, and linking attacks;

    +   - protecting network-wide privacy from a deanonymization attack;

    +   - preserving data during consensus;

    +   - protection from a trinity attack.


    # 7.6. Privacy by Design


    Privacy by Design and Privacy by Default are frequently used terminologies, especially
    since new privacy regulations started coming into the picture. Privacy by Design
    aims to integrate privacy requirements and controls in all new systems where personal
    information is in scope. This means Privacy by Design recommends that from the
    very start of a product/system development, privacy requirements shall be considered
    and shall be integrated in the design and architecture of the system, so that
    when a system is developed, all privacy controls are embedded in the system. On
    the other hand, Privacy by Default talks about post development, i.e. privacy
    settings shall be enabled by default once a product/system is deployed in production.


    The concept of Privacy by Design was first discussed by the former Canadian Information
    and Privacy Commissioner Ann Cavoukian, as she created several principles as foundation
    of Privacy by Design. The purpose of these principles is to make privacy integral
    to priorities of the organization, project objectives and design process. The
    seven principles of Privacy by Design are discussed (Kurtz et al. 2018; Romanou
    2018; Wahlstrom et al. 2020) in Figure 7.13.


    From the Blockchain point of view, many of these principles can be easily followed
    because of the fundamental features of the Blockchain. However, it is highly recommended
    while creating any system/application using Blockchain to first list all privacy
    requirements and then create a map that will be automatically sufficed by Blockchain
    features, the one that needs to be covered in consensus algorithms and smart contracts,
    and finally the one that needs addon security/privacy features to be integrated
    into Blockchain to enhance its security and privacy capabilities such as differential
    privacy and proxy re-encryption.'
  merge: -1
  img_proc: true
- pgno: 151
  md: '**Principle 1 Proactive not reactive — preventative not remedial**

    • Anticipate privacy issues and risks before they happen

    • Develop a culture of privacy awareness


    **Principle 2 Lead with privacy as the default setting**

    • Personal data shall always be automatically protected in a system

    • No added actions required by user


    **Principle 3 Embed privacy into design**

    • Privacy controls shall not be added on to the system, but be embedded in the
    system

    • Data Protection shall be core function of any system


    **Principle 4 Retain full functionality (positive-sum, not zero-sum)**

    • A win-win situation, no tradeoff

    • No compromise or tradeoff to achieve both privacy and security


    **Principle 5 Ensure end-to-end security**

    • Data Security throughout its lifecycle

    • From data creation/collection till data disposal


    **Principle 6 Maintain visibility and transparency — keep it open**

    • Ensuring data visibility and transparency to the owner

    • Stakeholders shall have the visibility after independent verification


    **Principle 7 Respect user privacy — keep it user-centric**

    • Provide strong privacy defaults to the user

    • Appropriate Privacy Notices


    Figure 7.13. Privacy by Design principles


    # 7.7. Conclusion


    Blockchain technology has been considered a game changer and that is why industries
    like banking are adopting it for faster transactions, cost reduction, improving
    security and record keeping. In the healthcare industry, Blockchain can become
    a valuable generating factor for healthcare entities because it can allow different
    healthcare entities to share their networks without compromising data security
    and integrity yet will still allow for them to track the source and the changes.
    With increased digitalization in the healthcare domain, trust has gained importance
    along with security and Blockchain because of its fundamental principles which
    provide trust, security and privacy. With the involvement of IoT in healthcare,
    the interdependency has increased following the need of security during communication,
    which has also increased. Now, the need of the hour is more research on developing
    prototypes of healthcare applications based on the type of services using Blockchain
    as backbone. This will help in scaling Blockchain in the healthcare domain.


