    # 7.4.1. HIPAA, HITRUST, HITECH and GDPR (Shu and Jahankhani 2017; Magyar 2018;
    Jin et al. 2019)


    HIPAA is a US regulated act which is an abbreviation for the Health Insurance
    Portability and Accountability Act. HIPAA came into force in 1996 and since then
    there have been the following four major amendments:


    +   - the Security Rule Amendment of 2003:

    +     - technical safeguards,

    +     - physical safeguards,

    +     - administrative safeguards;

    +   - the Privacy Rule Amendment of 2003;

    +   - the Breach Notification Rule of 2009;

    +   - the Final Omnibus Rule of 2013.


    In this section, we will cover the first three amendments (except physical and
    administrative, as that is not relevant to this chapter) because we are here trying
    to understand how Blockchain as a technology is helpful in compliance with regulatory
    requirements while the fourth amendment is related to business associates affected
    by HIPAA. So before jumping to the part concerning how Blockchain is helpful in
    compliance with regulatory requirements, let us first start with understanding
    the technical requirements that are part of the first three amendments. To keep
    it simple, Figure 7.10 can be used to visualize the outline of these requirements.


    On the contrary, HITRUST is a privately held company which has developed a global
    security and privacy framework named HITRUST CSF in collaboration with healthcare,
    technology and information security organizations. HITRUST was originally an acronym
    for Health Information Trust Alliance.


    HITECH Act is US based and its purpose is to enforce HIPAA security and privacy
    rules, and to encourage healthcare service providers for the adoption of EHR.


    GDPR is also known as EU-GDPR which is an acronym for European General Data Protection
    Regulation, a regulation in Europe for data protection and privacy. However, GDPR
    has strengthened patient rights against their PHI and at the same'
