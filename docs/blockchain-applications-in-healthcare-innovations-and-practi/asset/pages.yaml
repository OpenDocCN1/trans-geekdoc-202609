  md: '# 3.3.1. Uses of Blockchain in the healthcare sector


    Blockchain technology has been extensively studied and researched thus, the features
    of the Blockchain can be used to provide a solution in the healthcare industry
    for the related matter.


    ![](img/9f63232d0022c87774dc3933e40b24aa_72_0.png)


    # Figure 3.3. Healthcare industry


    # 3.3.1.1. Security


    We need to have a proper technology or network to protect and secure the records,
    and at present, the methods which are being used are not effective. “Data security,
    integrity and immutability” are the main features of Blockchain technology. Blockchain
    by the use of a secure decentralized ledger can offer security as it stores the
    data in multiple computers instead of a single computer. By having the data distributed
    over the entire Blockchain network, we have the same data stored in many computers.
    Now we cannot have any third party or malicious actor changing the information
    or data as the data has to be changed in all the computers over the network. Also,
    data security and integrity becomes the primary concern when applied to smart
    devices and cloud infrastructure. By providing “data provenance, auditing and
    control for cloud-based server”, Blockchain technology can allow safe data sharing
    among the devices and over the Internet that deposits the medical data, which
    is shared by using the smart contracts and access protocol implementations.


    # 3.3.1.2. Interoperability


    Interoperability can be defined as the operation of transferring and sharing data
    between varied sources. Because of the use of centralized data storage in the
    medical sector, it was not possible to use the feature of interoperability that
    is required in the healthcare industry. “Centralized data storage” can be problematic
    to the providers because it means storing the data in a single central database
    thus hampering the'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'quality and quantity of the medical data and researches, having slow access
    to the patient data, and also the disintegration of the healthcare data (Sah et
    al. 2018).


    The decentralized storage feature of the Blockchain can be very useful for better
    security and authentication of the data stored in the systems (Khanna et al. 2020a).
    Decentralized storage is the process in which there is a breakdown of the records
    in the storage from the single server to numerous servers by the means of a Blockchain
    ledger. In this way, we can have an enhanced quality and quantity of the data
    and also faster access to the patient''s information.


    # 3.3.1.3. Authentication


    Blockchain by the means of its decentralized feature makes sure the authentication
    of the patient record that is present in the blocks of the Blockchain. The authentication
    process is achieved by a private key which in turn is connected to a public key
    to initialize the operation of creation, modification and checking of the information
    in the Blockchain. In the software, a Bitcoin wallet is associated with the Bitcoin
    address and stores these keys. By the use of the cryptographic scheme, the software
    applications which are usually used for bitcoin and cryptocurrency can be determined
    for authentication purposes.


    # 3.4. Blockchain applications that can be useful for treating the medical sector
    problems


    # 3.4.1. Smart contracts


    Employing smart contracts, the user can form or create agreements between the
    buyer and the seller, by using Blockchain technology. Smart contracts, stored
    in Blockchain network, encrypt and convert the transaction into legal documents
    for legal services. These smart contracts consist of the scripts that are present
    in the Blockchain network, and they can be traced or identified by their unique
    address. By means of these smart contracts, we can establish a fair exchange among
    the parties while having minimum communication between them, in a decentralized
    manner. Thus, by this, the user can form their document without the need of a
    legal representative thus removing the challenges including both financial and
    time-wise, and making a better transfer of the resources or transaction.


    # 3.4.2. Fraud detection


    It is the process that verifies the document or the data in the system to check
    if there is any kind of tempering with information or malicious conduct, for example,
    the false comments and ratings which are given in the online review system in
    the'
