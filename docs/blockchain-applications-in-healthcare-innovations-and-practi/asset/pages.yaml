  md: 'in which the miners have influence over the sequence wherein the transactions
    are performed.


    +   - Timestamp dependence: the miners calculate the date and time for the transaction
    generated. They may change the timestamp by a few seconds if other miners approve
    the transaction they provided. The problem comes from the fact that certain smart
    contracts use a time as a triggering event, such as a payment system, and thus
    an adversary might be altered.


    +   - Mishandled exceptions: once a contract communicates with another, the present
    operation pauses for the call to complete before proceeding. The caller may or
    may not be notified of this exception. To verify that the call was completed,
    the responder should expressly check the callee''s callback function. Nevertheless,
    if the client refuses to properly examine the callback function, it may lead to
    potential dangers.


    +   - Re-entrancy vulnerability: once a contract communicates with another, the
    present operation pauses for the call to complete before proceeding. Also, because
    the fallback method enables an intruder to re-enter the caller''s method, an intruder
    may take advantage of the sender''s initial point to conduct repeated calls, culminating
    in loops of invocations that get many reimbursements and drain the balance. One
    of the most well-known re-entry vulnerabilities is the Decentralized Autonomous
    Organizations (DAO) attack (CoinDesk n.d.).


    Some security analysis tools are being developed to address contract issues. Since
    many contract problems are caused by a lexical mismatch among developers'' knowledge
    of the underlying executing meanings smart contracts, Luu et al. (2016) developed
    Oyente, a symbolic processing tool, to identify possible security bugs in Ethereum
    smart contracts. Oyente identified 8,833 Ethereum smart contracts as susceptible
    out of 19366, including the DAO bug. Its analysis is divided into two steps: first,
    it symbolically examines the dependency structure of the contract in order to
    elicit precise linguistic metadata from the program. After this, it analyses violation
    and different activities to see if they capture enough criteria to determine if
    a property is valid or not. Many flaws, like transaction reordering, repetitive
    calls, unsafe code patterns and so on, can be analyzed by Securify. Manticore
    (GitHub n.d.) seems to be another regular expression technique for evaluating
    binary and smart contracts. It is capable of capturing a program execution trail
    for each produced input.'
