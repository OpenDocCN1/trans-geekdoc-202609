    # ## 4.2. Literature review


    # ### 4.2.1. Blockchain in healthcare


    BC technology is a community-based decentralized digital ledger that allows people
    to record and exchange information (Hathaliya et al. 2019). Third-party intermediaries
    are replaced as confidence keepers in BC cryptography (Shahnaz et al. 2019). By
    attempting to decentralize EHRs, this technology will provide a new paradigm for
    HIE, enhancing device efficiency and protection (Shahnaz et al. 2019). BC is crucial
    because it instills confidence in peer-to-peer networks. The consensus process,
    distributed ledger and public-key cryptography are critical components of BC technology
    (McGhin et al. 2019a; Tanwar et al. 2020). The BC platform uses a decentralized
    architecture to ensure that all network participants meet the application’s requirements.


    Exceptional privacy and protection requirements apply in the healthcare sector
    due to additional regulatory provisions to protect patient medical records. In
    the Internet period, as distributed storage and the appropriation of versatile
    well-being gadgets increment the trading of reports and information, so does the
    danger of vindictive assaults and the danger of private data being undermined
    as it is traded (Yaqoob et al. 2021). As well-being data turns out to be more
    open than awesome gadgets and patients visit numerous doctors, the sharing and
    security of this information are becoming worrisome. Validation, interoperability,
    information sharing, the exchange of clinical data and contemplations for versatile
    well-being are a portion of the particular guidelines confronting the medical
    services industry (Gökalp et al. 2018; Zhang et al. 2018; Khezr et al. 2019).
    The applications of BC in healthcare are as follows:


    +   - Clinical data sharing: the framework’s sharing of clinical information among
    different elements is essential for BC in medical services. EHRs and EMRs contain
    profoundly confidential and crucial patient clinical data that should be securely
    put away, traded, handled and accessed.


    +   - Global data sharing: there are times when patients fly outside of their
    nation of origin for travel or other reasons. Likewise, there are times that they
    should look for clinical guidelines for treating an illness (Pirtle and Ehrenfeld
    2018; Kassab et al.'
