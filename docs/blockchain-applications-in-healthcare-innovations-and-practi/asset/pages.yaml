    # Blockchain networks


    A Blockchain network might be public, private, federated or developed by consortia,
    among other options.


    # Blockchain networks open to the public


    A public Blockchain, like Bitcoin, is one that anybody may register and contribute
    to. The disadvantages of a public Blockchain include no or little transaction
    privacy, inadequate security and a high processing power requirement.


    # Network of private Blockchains


    A private Blockchain resembles a distributed mentoring or public Blockchain network
    in appearance. However, if one entity manages the network, implements a shared
    ledger, maintains the public database and controls who is allowed to participate
    based on the utilization case, trust and confidence amongst participants will
    skyrocket. A Blockchain frequently runs under a company''s security and might
    be handled on-site.'
