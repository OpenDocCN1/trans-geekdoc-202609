    Hence the requirements that the medical sector needs are in the form of “authentication,
    interoperability, data transfer of medical records and considerations for mobile
    healthcare system”. In terms of revenue and employment, the healthcare sector
    has become one of the largest sectors according to the Indian Brand Equity Foundation
    (IBEF). The healthcare industry has been increasing at a vast pace and is not
    only limited to hospitals but also includes medical equipment, tourism, health
    insurance, clinics and now much more. Thus, there is notable growth in the market
