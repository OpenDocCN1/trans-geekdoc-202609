    ## 回归


    在我们继续深入之前，我们刚刚提到一个新术语——回归。为什么预测未来的预测模型会引用回归呢？回归是一种统计技术，该术语由弗朗西斯·加尔顿（Francis Galton）在1877年提出，描述后代的高度倾向于回归平均值，而不是随着每一代的产生而增加。这个术语随后演变为一种统计概念，用于描述因变量（如房屋售价）与自变量（如房屋建筑面积和车库数量）之间的关系。


    存在许多机器学习和预测算法，我将在下一章中从更高层次概述其中一些。然而，我将更详细地说明为什么线性回归和决策树是适用于该特定问题的算法。


