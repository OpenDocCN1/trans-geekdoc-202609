    ## Drop Missing Values


    Another common but more complicated data scrubbing task is deciding what to do
    with missing data.


    Missing data can be split into three overarching categories: missing completely
    at random (MCAR), missing at random (MAR), and nonignorable. Although less common,
    MCAR occurs when there''s no relationship between a missing data point and other
    values in the dataset.


    Missing at random means the missing value is not related to its own value but
    to the values of other variables in the analysis, i.e. skipping an extended response
    question because relevant information was inputted in a previous question of the.


    Nonignorable means the missingness is related to the specific characteristics
    of the missing data itself. This is often the case when high-income individuals
    are less likely to report their income.


    To handle missing values, we have several strategies, such as deleting or imputing.
    Deletion is the simplest method but can lead to loss of information and bias.
    Imputation involves filling in gaps with estimated values, such as the mean, median,
    or mode.


    From here, we can see that four variables contain missing values, is is in the
    case of last_review (3908) and reviews_per_month (3914). While this won’t be necessary
    for all algorithms, there are several options we can consider to patch up missing
    values. The first approach is to fill the missing values with the average value
    of that variable using the fill.na method.


    ```python

    df[''reviews_per_month''].fillna(df[''reviews_per_month''].mean()), inplace=True)

    ```


    This line of code replaces the missing values for the variable reviews_per_month
    with the mean (average) value, which is 1.135525. We can also use the fill.na
    method to approximate missing values with the mode (the most common value).


    ```python

    df[''reviews_per_month''].fillna(df[''reviews_per_month''].mode()[0]), inplace=True)

    ```


    In the case of our dataset, the mode value for this variable is ‘NAN’ (Not a Number),
    and there isn''t a reliable mode value we can use. This is common when variable
    values are expressed as a floating-point number rather than an integer.


    Also, the mean method does not apply to non-numeric data such as strings. One-hot
    encoded variables and Boolean variables expressed as o or 1 should also not be
    filled using the mean method. For variables expressed as o or 1, it''s not appropriate
    to aggregate these values to say 0.5 or 0.75 as these values change the meaning
    of the variable type.


    To fill missing values with a customized value, such as ‘o’, we can specify target
    value inside the parentheses.


    ```python

    df[''reviews_per_month''].fillna(''o'')

    ```


    A more drastic measure is to drop rows (cases) or columns (variables).

