    # DATA VISUALIZATION

    TECHNIQUES


    Data visualization ensures that our meaningful data analysis is faster and easier
    to do, and, in many cases, it should be one of the first steps in analyzing data.


    The data is accessed, processed, and then visualized to show quick insights, such
    as looking for outliers, patterns, etc.


    Visualization Goals


    The two main aims of data visualization are exploring data and communicating it.
    When data is visualized in histograms, bar charts, or another visualization format,
    you should be able to see any patterns immediately. If you use a line graph, you
    will see straight away if a trend is rising. If you use a pie chart, you can see
    the magnitude of a factor compared to other factors. Data visualization is used
    because it makes data clearer than long lists of numbers and other data.


    For example, look at the graph at the link – it shows the search trend across
    the world on the word "bitcoin":


    https://trends.google.com/trends/explore?q=bitcoin


    Straightaway you should see a massive, albeit temporary, increase in searches
    for "bitcoin," but it decreases steadily after that huge peak. It'
