    level of English fluency). In other words, the reason why the value is missing
    is caused by another factor and not directly to the value itself. MAR is most
    common in data analysis.


    Nonignorable missing data constitutes the absence of data directly to its own
    value or significance. Unlike MAR, the value is missing due to the significance
    of the question or field. Tax evading citizens or respondents with a criminal
    record may decline to supply information to certain questions due to feelings
