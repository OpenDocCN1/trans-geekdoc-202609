    - 3) 我们使用了测试数据进行预测

    - 4) 我们使用两种方法测试了模型的准确性


    均方误差 (MSE) – 计算实际值与预测值之间的差异

    R平方（R-Squared，判定系数） – 计算数据与拟合线的接近程度。在我们的情况下，我们得到了 39%。这意味着 39% 的变化源于自变量。


    ## 决策树回归模型


    现在让我们尝试另一种被称为决策树的算法。为什么我们想使用这种算法来预测价格？决策树回归模型形成一种树结构，它将数据集分解为更小的子集并不断向下遍历节点。在价格的情况下，决策树可以可视化如下：


