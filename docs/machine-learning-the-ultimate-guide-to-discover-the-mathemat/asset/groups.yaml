  - '[PAGE 7]


    # INTRODUCTION


    Derived from Artificial Intelligence, the concept of machine learning is a complete
    area of study. It foccusses on developing automated programs to acquire knowledge
    from data in order to make a diagnosis or a prediction. Machine learning relies
    on the concept that machines can learn, identify trends, and provide decisions
    with minimal human intervention. These machines improve with experience and build
    the principals that govern the learning processes.


    There are a wide variety of machine learning uses, such as marketing, speech and
    image recognition, smart robots, web search, etc. Machine learning requires large
    datasets to train the model and get accurate predictions. Different types of machine
    learning exist and can typically be classified into two separate categories supervised
    or unsupervised learning. Other algorithms can be labeled as semi-supervised learning
    or reinforcement machine learning.


    Supervised learning is mainly used to learn from a categorized or labeled dataset
    than to predict the label for the unknown dataset. In contrast, unsupervised learning
    is used when the training dataset is neither categorized nor labeled and is applied
    to study how a function can describe a hidden pattern from the dataset. Semi-supervised
    learning uses together categorized and non-categorized'
  - '[PAGE 8]


    dataset. Reinforcement is a method that relies on the trial-and-error process
    to identify the most accurate behavior in an environment to improve its performance.


    It is crucial to understand machine learning is not the go-to approach to solve
    any problem in hand. Some problems can be solved with robust approaches without
    relying on machine learning. Problematics with few data with target value that
    can easily be defined by a deterministic approach. In this case, when it is easy
    to determine and program a rule that drives the target value, machine learning
    is not the best approach to follow.


    Machine learning is best used when it is impossible to develop and a rule to define
    the target value. For instance, image and speech recognition is a perfect example
    of when machine learning is best used. Images, for example, have a lot of features
    and pixels that a simple human task is very hard to implement to recognize the
    image. A human being can visually recognize an image and classify it. But how
    to develop an algorithm and a rule-based approach is exhausting and not very effective
    for image recognition. So, in this case building an image dataset and flag each
    image with its specific contents (i.e., animal, flower, object, etc.) and use
    a machine-learning algorithm to detect each category of images is very efficient.
    In short, machine learning is very handy when you have several factors that impact
    the target value with little correlation.


    Machine learning is also the best approach to automate a task for large datasets.
    For example, it is easy to detect manually a spam email or a fraudulent transaction.
    However, it is very time consuming and'
  - '[PAGE 9]


    tedious tasks to the same task for a hundred million emails or transactions. Machine
    learning is very cost-effective and computationally efficient to handle large
    datasets and large-scale problems.


    Machine learning is also best used in cases where human expertise to solve a problem
    is very limited. An example of these problems is when it is impossible to label
    or categorize the data. Machine learning in this situation is used to learn from
    the datasets and provide answers to the problems of the questions we are trying
    to solve.


    # Overall, machine learning is best used to solve a problem when:


    +   1) human have the expertise to solve the problem but it almost impossible
    to develop easily a program to mimic the human task


    +   2) human have no expertise or an idea regarding the target value (i.e., no
    label or classified data)


    +   3) human have the expertise and knows the possible target values but it has
    cost-effective and time consuming to implement such an approach.


    In general machine learning is best used to solve complex data-driven problems
    like learning behaviors for clients targeting or acquisition, fraud analysis,
    anomaly detection in large systems, diseases diagnostic, shape/image, and speech
    recognition among others.'
  - '[PAGE 10]


    # MACHINE LEARNING & ITS BASIC CONCEPT


    The term "machine learning" was first coined in 1959 by Arthur Samuel, an AI and
    computer gaming pioneer who defined it as "a field of study that provides computers
    with the capability of learning without explicit programming."


    That means that machine learning is an AI application that allows software to
    learn by experience, continually improving without explicit programming. For example,
    think about writing a program to identify vegetables based on properties such
    as shape, size, color, etc.


    You could hardcode it all, add a few rules which you use to identify the vegetables.
    To some, this might seem to be the only way that will work, but there isn''t one
    programmer who can write the perfect rules that will work for all cases. That’s
    where machine learning comes in, without any rules — this makes it more practical
    and robust. Throughout this guide, you will see how machine learning can be used
    for this task.


    So, we could say that machine learning is a study in making machines exhibit human
    behavior in terms of decision making and behavior by allowing them to learn with
    little human intervention – which means no explicit programming. This begs the
    question, how does a machine'
