    ## 质心初始化 (Centroid Initialization)


    k-means 聚类是一种简单且易于理解的算法。然而，当我们使用 k-means 时，有两件事需要做。


    首先，我们需要选择初始质心。不好的初始化会导致次优解。


    有两种方法可以选择初始质心。第一种方法是多次运行 k-means 算法，每次运行都使用随机选择的质心。另一种方法是使用 k-means++ 技术来选择初始质心。这种技术已被证明可以带来更快收敛和更好的结果。


    ![](img/d8987d3110291847d867988b0a2d7ecb_52.png)


    ## 确定簇的数量 (Determine the Number of Clusters)


    除了选择初始质心，另一个任务是确定簇的数量。


    一种这种方法是通过绘制数据集来可视化地确定。但这只有在数据集可以很容易绘图时有效。


    更好的方法是使用肘部法。目标是找到一个随着簇的增加，惯性（inertia）减少不再显著的簇数量。


