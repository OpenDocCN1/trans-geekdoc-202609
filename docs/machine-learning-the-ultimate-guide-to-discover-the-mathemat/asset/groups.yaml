    ## Matplotlib


    Matplotlib is a visualization library you can use to generate scatterplots, histograms,
    pie charts, bar charts, error charts, and other visual charts with just a few
    lines of code. While Matplotlib offers detailed manual control over line styles,
    font properties, colors, axes, and properties, the default visual presentation
    is not as striking and professional as other visualization libraries and is generally
    used in conjunction with Seaborn themes.


    ## Seaborn


    Seaborn is a popular Python visualization library based on Matplotlib. This library
    comes with numerous built-in themes for visualization and complex visual techniques
    including color visualization of dependent and independent variables, sophisticated
    heatmaps, cluster maps, and pairplots. The combination of Seaborn’s pre-formatted
    visual design and Matplotlib’s customizability make it easy to generate publication-quality
    visualizations.


    Other popular visualization libraries include Plotly (an interactive visualization
    Python library) and Cufflinks (connects directly with Pandas dataframes to create
    graphs and charts).


    ## TensorFlow


    A round-up of popular machine learning libraries wouldn’t be complete without
    an introduction to Google’s TensorFlow. While Scikit-learn offers a broad set
    of popular shallow algorithms, TensorFlow is the library of choice for deep learning
    and artificial neural networks (ANN).


    TensorFlow was created at Google and supports various advanced numerical computation
    techniques. By distributing computations on a network with up to thousands of
    GPU instances, TensorFlow supports advanced algorithms including neural networks
    that would be impossible to run on a single server.


    Unfortunately for Mac users, TensorFlow is only compatible with the Nvidia GPU
    card, which is no longer available with Mac OS X. Mac users can still run TensorFlow
    on their CPU but will need to run their workload on the cloud to access the GPU.


