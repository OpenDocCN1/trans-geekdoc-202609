    Supervised and Unsupervised Learning


    These are two of the most common terms you will encounter in data science and
    machine learning because they are the two most used machine learning categories
    used by data scientists.


    # Supervised Learning


    Supervised learning is much like learning by looking at examples. For example,
    let''s say we have a large collection of images of dogs and cats. All the images
    are correctly labeled as "cat" or "dog". When we give that collection to our computer,
    it will learn, by looking at them, how to correctly classify a dog or cat picture.
    As it does, the computer will find similarities and patterns in the images.


    When we introduce a new set of images to our computer model, it will correctly
    identify those images with cats or dogs.


    It''s much like you sitting down and learning something while being supervised.
    There are right answers and wrong ones; our computer model needs to put what it
    learned on the first dataset into practice on the second one, so it can correctly
    predict the right answers in the majority of cases – it is virtually impossible
    to reach 100%.


    Linear regression is one of the best-known examples of supervised learning. Linear
    regression is all about predicting an output value (y)'
