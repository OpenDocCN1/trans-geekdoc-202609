    ## One-Hot Encoding


    One of the common roadblocks in data science is a mismatch between the data type
    of your variables and the algorithm. While the contents of the variable might
    be relevant, the algorithm might not be able to read the data in its default form.
    Text-based categorical values, for example, can''t be parsed and mathematically
    modeled using general clustering and regression algorithms.


    One quick remedy involves re-expressing categorical variables as a numeric categorizer.
    This can be performed using a common technique called one-hot encoding that converts
    categorical variables into binary form, represented as “1” or “0”—“True” or “False.”


    ```python

    import pandas as pd

    ```


    ```python

    df = pd.read_csv(''~/Downloads/listings.csv'')

