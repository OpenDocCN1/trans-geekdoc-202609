    # 使用 Python 进行深度学习


    我们在这里首先需要关注的是深度学习的本质。为了简单起见，深度学习将是我们在人工智能中看到的一种函数。这种深度学习能够模仿人类大脑的工作方式，但将其放入我们选择的系统或机器中。它的工作原理是处理数据，然后创建一个基于数据而非直觉的模式，用于决策。这有助于公司为其客户产生更好的结果，击败竞争对手，在市场上发布最好的产品，并确保他们能够降低成本并获得更多成果。


    深度学习实际上是我们涉及人工智能和机器学习领域时可以看的一个子集。它更进了一，因为它拥有一个强大的学习网络，可以从没有标签或某种非结构化的数据中进行无监督学习。根据你如何使用它，这种类型的学习也被称为深度神经网络或深度神经学习。


    # 如何让深度学习工作起来


    深度学习是一个随着数字时代的到来和增长而真正演变了很多的过程，这有助于带来我们能想象的各种形式的、来自世界每个地区的数据发生爆炸式增长。企业总共能够收集到如此大量的数据令人惊叹，一旦他们能够弄清楚这些数据中包含哪些见解以及如何使用它们，他们就能真正为自己提供一种简单高效的方法来击败竞争对手。


    这些被称为大数据的数据，源于多种来源，包括在线、社交媒体、电子商务平台、在线电影院。每家企业都必须根据他们最初想要回答的问题，确定他们想从哪里收集这些信息（即大数据）。


    这些海量信息将非常有帮助，而且它们通常可以很方便地访问，并通过许多应用程序（如云计算）进行共享，以便企业能够与他人共享，并在任何时候找到他们需要的内容。


    然而，数据通常是非结构化的且难以分类，很多时候收集收集的时间之长，以至于数据非常庞大，仅仅是因为有太多东西要处理。这意味着，如果由人类手动尝试分类这些信息，他们可能需要几十的时间才能理解所有内容并从中提取正确的信息。这在过去可能是公司处理信息的唯一方法，但并不总是最高的。


    如果你正在收集所有这些信息，并想从这些信息中获得预测和见解，你不想等几十年时间来收集这些信息并阅读见解。这太久了，你会被甩在脑后。当你完成时，会有几十年的新信息坐在那里，等待你同时深入研究。对于公司来说，手动处理所有数据是不高效的，因为会遗漏某些内容，而且耗时太长了。


    这就是为什么许多公司开始看到通过查看所有丰富信息可能产生的某些巨大潜力。他们意识到拥有一个能够快速、高效处理这些信息的系统的重要性。这意味着这些公司将致力于调整它们的人工系统，使其能够独立处理工作并处理自动化支持。


    需要记住的一点是，深度学习能够从所有海量的非结构化数据中学习。人类人类手动完成整个过程可能需要几年时间，但在深度学习和其他人工智能任务的帮助下，机器可以在短时间内看到内部的信息和见解。


    # 机器学习 VS 深度学习


    现在，我们需要看看机器学习和深度学习是如何协同工作的。我们可以在人工智能中使用、且最常用的技术之一（特别是在处理所有大数据时）是机器学习。记住之前的观点，机器学习是一种自自适应算法，随着它获得更多经验或添加一些新数据，它会教自己如何在分析和寻找模式方面变得更好。


    让我们看看这一切是如何工作的。如果有一家专门从事数字支付的公司想要查看这个过程，以帮助检测系统中欺诈的发生或任何潜在风险，他们可能需要一些机器学习工具来帮助他们实现这一特定目标。计算模型将查看并处理在数字平台上发生的所有交易，然后从数据集中找到一些模式。


    深度学习作为机器学习的一个子集，将发挥作用，因为它能够利用分层的人工神经网络。这些人工神经网络的设置类似于人类大脑，神经元之间相互连接，形成一个类似网的结构。许多程序员倾向于使用线性方式来构建分析，但这种深度学习函数能够让机器以非线性方法处理数据。


    在过去，检测洗钱或欺诈等问题的传统方法之一是客户依赖交易的金额。这意味着只有真正巨大的交易会被捕获，并且只有这些交易会发出巨大的警报。


    当然，这些并不是所有坏的交易。有时，试图进行欺诈的人可能会在短时间内进行大量小额交易，而不是大额交易。当这种情况发生时，此人可以在短时间内完成许多不同的交易并逃脱，但不会被发现，因为单笔交易的金额足够小，系统不会捕捉。这导致金融机构多年来在欺诈费用上损失了大量资金。


    机器学习的奇之处在于，通过深度学习的非线性方法，我们在尝试检测欺诈时可以查看不仅仅是金额。例如，算法可以被设置为查看如零售商类型、IP 地址、地理位置和时间，以判断这是否是客户可能参与的购买或交易。


    当神经网络尝试处理原始数据输入（如交易金额）时，我们看到的第一层，然后将其传递给下一层，这些信息作为输出。神经网络的第二层将能够处理从上层获取的信息，并包含一些额外信息（如用户的
    IP 地址），并将结果传递下去。这种情况一直持续到所有的层。


