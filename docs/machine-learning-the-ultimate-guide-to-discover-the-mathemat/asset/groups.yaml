    # 如何进行数据分析？


    数据分析是获取业务智能的更大过程的一部分。该过程包含以下一个或多个步骤：


    **定义目标：** 每一项调查都应该从一组清晰定义的业务目标开始。在过程其余时间内出的许多决策取决于研究目标设定得有多清晰。


    **提问：** 尝试在问题领域提出一个问题。例如：红色跑车的事故发生率是否比其他车辆更高？


    **数据收集：** 应该从相关来源收集与问题相关的数据。在示例中，可以从多种来源收集数据，包括：车辆管理局（DMV）或警察事故报告、保险理赔和录取信息。当使用调查卷收集数据时，需要向受访者提交问卷。问题必须根据所使用的统计方法进行适当设计。


    **数据清洗：** 原始数据可以多种不同的格式收集。收集的数据必须经过清洗和转换，以便数据分析工具可以导入。对于我们的示例，我们可以接收文本格式的 DMV
    事故报告、来自关系型数据库的保险理赔以及如 API 等录取信息。数据分析师必须汇总这些不同的数据形式并将其转换为适用于分析工具的形式。


    **数据分析：** 这一步骤是将纯化和聚合的数据导入分析工具中。这些工具允许你探索数据，发现其中的模式，并提出和回答“假设”问题。这是通过正确使用统计方法，对研究中收集的数据产生意义的过程。


    **得出结论和预测：** 这一步骤是在充分分析之后，从数据中得出结论并做出适当的预测。这些结论和预测可以总结在提供终端用户的报告中。


    **现在，让我们专门看看数据分析的方法。**


    数据挖掘是一种在大数据集中发现模式的数据分析方法，使用的方法是如何成为数据科学家如何成为数据科学家。数据科学已从 2007 年的新起点发展成为今天最受关注的学科之一。其目标是将原始数据转换为可理解的业务信息。这些可能包括识别数据项组（也称为聚类分析）或识别数据组之间的异常和依赖关系。


    # 数据挖掘的应用：


    - 异常检测可以处理大量数据（“大数据”）并自动识别离群情况，可能将其排除在决策之外或用于欺诈检测（例如银行欺诈）。


    - 学习客户购买习惯。机器学习技术可用于模拟购买习惯并确定频繁购买的物品。


    - 聚类可以识别数据中以前未知的组。分类则用于将数据条目自动分类到预定义的位置。一个常见的例子是将电子邮件消息分类为“垃圾邮件”或“非垃圾邮件”，并让系统通过用户学习。


    # 文本分析


    文本分析是从文本中提取有用信息的过程。通过处理非结构化文本信息，并在 Excel 中使用文本操作提取有意义的数值存储时间来实现。在 Excel 中通过文本操作节省时间可以对数字产生魔法，它可以很好地处理字符。本教程向你展示如何在电子表格中分析、转换、替换和编辑文本。这些基础原因允许你执行复杂的转换。从信息中读取更多索引，并使信息供统计和机器学习算法进行进一步处理。


    文本提取过程包括以下一个或多个步骤：


    - 从各种来源（包括网络、文件系统、数据库等）收集信息。

    - 语言分析，包括自然语言处理。

    - 模式识别（例如电话号码、电子邮件地址等的识别）。

    - 从文本中摘取摘要信息，例如词的相对频率、确定文档之间的相似性等。


    # 文本分析程序的示例：


    - 开放式调查响应的分析。这些研究是探索性的，包含与问题主题相关的开放式问题。受访者可以表达自己的观点，而不受特定回答格式限制。


    - 对电子邮件、文档等进行分析以过滤“垃圾”。这还包括将消息自动分类到各个部门的预定义收箱中。


    - 通过查看竞争对手的网站进行调查。这可以用于获取有关竞争对手活动的信息。


    - 可以处理入侵检测日志的安全应用程序。


    # 商业智能


    商业智能 如何使用 Cortana 使用 Power BI 分析数据 如何使用 Cortana 使用 Power BI 分析数据。你渴望简化数据分析吗？通过此指南使用
    Cortana 获取快速答案。阅读更多将数据转换为用于业务目的的可用智能，并可用于组织的战略和战术决策过程。它允许人们从收集的数据中研究趋势并从中得出洞解。


    # 今日商业智能的一些示例：


    - 组织的运营决策，如产品定位和定价。

    - 识别新市场，评估产品需求以及对不同市场细分的适用性。

    - 预算编制和滚动预测。


    # 数据可视化


    环境中的许多传感器（被称为“物联网”或“IOT”）产生了越来越多的数据。这些数据（称为“大数据”）带来了理解方面的挑战，可以通过使用数据可视化工具来缓解。数据可视化用于以下应用：


    - 从原始 IOT 数据中提取摘要数据。

    - 使用条形图代表多个季度的销售业绩。

    - 直方图通过将区域划箱来显示变量（如收入）的分布。


    # 回顾数据分析


    数据分析使用统计工具对数据进行评估以寻找有用信息。为此使用了多种方法，包括数据挖掘、文本分析、商业智能和数据可视化。


    # 数据清洗技术


    类似于瑞士或日本手表的设计，良好的机器学习模型应该运行顺畅且不包含额外的零件。这意味着避免防止代码执行的语法或其他错误，并移除可能阻塞模型决策路径的冗余变量。


    这种对简单性的追求延伸到了开发第一个模型的初学者。例如，在处理新算法时，创建一个最小可行模型并向代码添加复杂性。如果你发现自己陷入了僵局，查看麻烦的元素并问：“我需要它吗？”如果模型无法处理缺失值或多种变量类型，最快的治疗方法是移除麻烦的元素。这应该帮助受影响的模型恢复活力并正常呼吸。一旦模型运行，你就可以返回并在代码中添加复杂性。


    # 什么是数据清洗？


    数据清洗是为分析准备数据而处理数据的总术。某些算法（例如）不识别某些数据类型，或者在响应缺失值或非数字输入时返回错误消息。变量也需要根据大小缩放或转换为更兼容的数据类型。


