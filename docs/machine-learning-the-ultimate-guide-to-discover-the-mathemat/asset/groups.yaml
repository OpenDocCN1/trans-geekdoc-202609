    # Centroid initialization


    There are two ways to select the initial centroids.


    The first way is to run the entire k-means algorithm multiple times with different
    randomly selected initial centroids. For each run, we compute the sum of the squared
    distances between each instance and the centroid of its final cluster. This sum
    is known as the inertia of the model. We then compare the inertias of all the
    runs and choose the run with the smallest inertia.


    Another way is to select the initial centroids using a technique known as k-means++.
    This technique uses additional computation to determine centroids that are distant
    from one another and has been shown to result in faster convergence and better
    results. sklearn k-means++ by default.


