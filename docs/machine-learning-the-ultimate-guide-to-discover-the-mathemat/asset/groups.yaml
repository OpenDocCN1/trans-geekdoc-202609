    `SalePrice`，将 `X` 定义为用于预测价格的所有自变量。


    ## 我们在这里花一点时间描述 `train_test_split` 函数中额外参数的用途：


    - 1) Test_Size – 定义了多少百分比的数据将被测试数据集。对于这个示例，我们使用了 50%。

    - 2) Random_State – 用于作为划分过程中随机生成的输入。对于我们的示例，我们使用了 80。

    - 3) Shuffle – 用于决定在划分之前是否应该打乱数据。出于我们的目的，我们设置为 true。


    现在我们准备好构建、训练和测试预测模型了！


    ## 线性回归模型


    线性回归模型假设因变量或目标变量（例如房屋售价）与自变量（如建筑面积、车库数量等）之间存在线性关系。


    ## 它可以表示为如下方程：


    Y = cX + I


    其中


    Y = 因变量，又称房屋售价

    X = 自变量，例如建筑面积

    c = 系数 – 将由线性回归模型计算

    I = 截距 – 也由线性回归模型计算


    上述是简单线性回归的一个案例，你只有一个因变量和一个自变量。


    当你有多个自变量时（即多元线性回归），方程如下所示：


    Y = I+cX1+cX2+...


    ## 我们将花时间通过以下方式来初始化、训练和测试线性回归模型：


