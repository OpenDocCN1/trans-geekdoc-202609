  md: '# TOOLS & LIBRARIES


    Data scientists rarely work alone. This means it''s vital to maintain consistent
    code that can be read and reused by other programmers. Similar to using WordPress
    plugins with websites, code libraries make it easy for data scientists to perform
    common tasks using pre-written modules of code.


    With WordPress, for example, you can install a comments management plugin called
    Discuz on a portfolio of websites. Using the same plugin for each website eliminates
    the need for developers to familiarize themselves with each site''s underlying
    code. They simply need to familiarize themselves with the basic interface and
    customization settings of the Discuz plugin.


    The same logic and benefits apply to machine learning libraries, as complex algorithms
    and other functions can be called through the same code interface. Moreover, rather
    than writing the statistical requirements of a regression algorithm over many
    lines of code, you can call the algorithm from a library such as Scikit-learn
    using just one line of code.


    Example:


    My_Model = Linearregression()


    The libraries themselves are imported on a project-by-project basis'
  merge: -1
  img_proc: true
