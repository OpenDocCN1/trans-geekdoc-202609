    to draw conclusions.


    In 1997, Deep Blue, created by IBM, was the first computer-based chess player
    to beat a world champion at his own game. The program searched through potential
    moves, using its computing power to choose the best ones. And just ten years later,
    Geoffrey Hinton coined the term “deep” learning to describe the new algorithms
    that allowed computers to recognize text and objects in images and videos.


    In 2012, Alex Krizhevsky published a paper with Ilya Sutskever and Geoffrey Hinton.
    An influential paper, described a computing model that could reduce the error
    rate significantly in image recognition systems. At the same time, Google’s X
    Lab came up with an algorithm that could browse YouTube videos autonomously, choosing
    those that had cats in them.


    In 2016, Google DeepMind researchers created AlphaGo to play the ancient Chinese
    game, Go, and pitted it against the world champion, Lee Sedol. AlphaGo beat the
    reigning world champion four times out of five.


    Finally, in 2020, GPT-3 was released, arguably the most powerful language model
    in the world. Released by OpenAI, the model could generate fully functioning code,
