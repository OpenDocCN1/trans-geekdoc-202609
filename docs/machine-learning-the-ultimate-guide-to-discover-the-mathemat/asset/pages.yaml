  md: '# DATA SCRUBBING TECHNIQUES


    Similar to Swiss or Japanese watch design, a good machine learning model should
    run smoothly and contain no extra parts. This means avoiding syntax or other errors
    that prevent the code from executing and removing redundant variables that might
    clog up the model''s decision path.


    This push towards simplicity extends to beginners developing their first model.
    When working with a new algorithm, for example to create a minimal viable model
    and add complexity to the code later. If you find yourself at an impasse, look
    at the troublesome element and ask, “Do I need it?” If the model can''t handle
    missing values or multiple variable types, the quickest cure is to remove the
    troublesome elements. This should help the afflicted model spring to life and
    breathe normally. Once the model is working, you can go back and add complexity
    to your code.


    # What is Data Scrubbing?


    Data scrubbing is an umbrella term for manipulating data in preparation for analysis.
    Some algorithms, for example, don''t recognize certain data types or they return
    an error message in response to missing values or non-numeric input. Variables,
    too, need to be scaled to size or converted to a more compatible data type.'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'Linear regression, for example, analyzes continuous variables, whereas gradient
    boosting asks that both discrete (categorical) and continuous variables are expressed
    numerically as an integer or floating-point number.


    Duplicate information, redundant variables, and errors in the data can also conspire
    to derail the model''s capacity to dispense valuable insight.


    Another potential consideration when working with data, and specifically private
    data, is removing personal identifiers that could contravene relevant data privacy
    regulations or damage the trust of customers, users, and other stakeholders. This
    is less of a problem for publicly-available datasets but something to be mindful
    of when working with private data.


    # Removing Variables


    Preparing the data for further processing generally starts with removing variables
    that aren''t compatible with the chosen algorithm or variables that are deemed
    less relevant to your target output. Determining which variables to remove from
    the dataset is normally determined by exploratory data analysis and domain knowledge.


    In regards to exploratory data analysis, checking the data type of your variables
    (i.e. string, Boolean, integer, etc.) and the correlation between variables is
    a useful measure to eliminate variables.[11] Domain knowledge, meanwhile, is useful
    for spotting duplicate variables such as country and county code and eliminating
    less relevant variables like latitude and longitude, for example.'
