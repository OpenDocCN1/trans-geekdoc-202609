  md: '# MACHINE LEARNING & ITS BASIC CONCEPT


    The term "machine learning" was first coined in 1959 by Arthur Samuel, an AI and
    computer gaming pioneer who defined it as "a field of study that provides computers
    with the capability of learning without explicit programming."


    That means that machine learning is an AI application that allows software to
    learn by experience, continually improving without explicit programming. For example,
    think about writing a program to identify vegetables based on properties such
    as shape, size, color, etc.


    You could hardcode it all, add a few rules which you use to identify the vegetables.
    To some, this might seem to be the only way that will work, but there isn''t one
    programmer who can write the perfect rules that will work for all cases. That’s
    where machine learning comes in, without any rules — this makes it more practical
    and robust. Throughout this guide, you will see how machine learning can be used
    for this task.


    So, we could say that machine learning is a study in making machines exhibit human
    behavior in terms of decision making and behavior by allowing them to learn with
    little human intervention – which means no explicit programming. This begs the
    question, how does a machine'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'gain experience, and where does it learn from? The answer to that is simple
    – data, the fuel that powers machine learning. Without it, there is no machine
    learning.


    One more question – if machine learning was first mentioned can k in 1959, why
    has it taken so long to become mainstream? The main reason for this is the significant
    amount of computing power machine learning requires, not to mention the hardware
    capable of storing vast amounts of data. It''s only in recent years that we have
    achieved the requirements needed to practice machine learning.


    # # How Machine Learning and Traditional Programming Differ?


    Traditional programming involves input data being fed into a machine, together
    with a clean, tested program, to generate some output. With machine learning,
    the input and the output data are fed to the machine during the initial phase,
    known as the learning phase. From there, the machine will work the programming
    out for itself.


    Don''t worry if this doesn''t make sense right now. As you work through this in-depth
    guide, it will all come together.


    # ## Why We Need Machine Learning


    These days, machine learning has more attention than you would think possible.
    One of its primary uses is to automate tasks that require human intelligence.
    Machines can only replicate this intelligence via machine learning.


    Businesses use machine learning to automate tasks and automate and'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'create data analysis models. Some industries are heavily reliant on huge amounts
    of data which they use to optimize operations and make the right decisions. Machine
    learning makes it possible to create models to process and analyze complex data
    in vast amounts and provide accurate results. Those models are scalable and precise,
    and they function quickly, allowing businesses to leverage their huge power and
    the opportunities they provide while avoiding risks, both known and unknown.


    Some of the many uses of machine learning in the real world include text generation,
    image recognition, and so on, this increasing the scope, ensuring machine learning
    experts become highly sought-after individuals.


    # ### How Does Machine Learning Work?


    Machine learning models are fed historical data, known as training data. They
    learn from that and then build a prediction algorithm that predicts an output
    for a completely different set of data, known as testing data, that is given as
    an input to the system. How accurate the models are entirely dependent on the
    quality of the data and how much of it is provided – the more quality data there
    is, the better the results and accuracy are.


    Let''s say we have a highly complex issue that requires predictions. Rather than
    writing complex code, we could give the data to machine learning algorithms. These
    develop logic and provide predictions.


    # ### Machine Learning Past to Present'
