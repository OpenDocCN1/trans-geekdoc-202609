    Machines have taken over the monotonous job of monitoring multiple video cameras
    to ensure security of premises. Machines can track unusual behavior like standing
    motionless for an extended period of time, sleeping on benches, and stumbling.
    It can then send an alert to the security personnel who can make the final decision
    to act on the tip and avoid mishaps. With every iteration of reporting, the surveillance
    services are improved as the machine learning algorithms learn and improve upon
