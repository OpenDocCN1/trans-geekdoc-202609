    # # Pandas


    Pandas is a library for managing and presenting your data. The name “Pandas” comes
    from the term “panel data,” which refers to Panda’s ability to create a series
    of panels, similar to sheets in Excel.


    Pandas can be used to organize structured data as a dataframe, which is a two-dimensional
    data structure (tabular dataset) with labeled rows and columns, similar to a spreadsheet
    or SQL table. You can also use Pandas to import and manipulate an external dataset
    including CSV files as a dataframe without affecting the source file as modifications
    take place inside your development environment.


    ![](img/d8987d3110291847d867988b0a2d7ecb_22_0.png)


    Figure 1: Example of a Pandas’ dataframe


