  md: 'These days, we see plenty of evidence of machine learning in action, such as
    Natural Language Processing and self-drive vehicles, to name but two. Machine
    learning has been in existence for more than 70 years, though, all beginning in
    1943. Warren McCulloch, a neuropsychologist, and Water Pitts, a mathematician,
    produced a paper about neurons and the way they worked. They went on to create
    a model with an electrical circuit, producing the first-ever neural network.


    Alan Turing created the Turing test in 1950. This test was used to determine whether
    computers possessed real intelligence, and passing the test required the computer
    to fool a human into believing it was a human.


    Arthur Samuel wrote the very first computer learning program in 1952, a game of
    checkers that the computer improved at the more it played. It did this by studying
    the moves, determining which ones came into the winning strategies and then using
    moves in its own program.


    In 1957, Frank Rosenblatt designed the perceptron, a neural network for computers
    that simulates human brain thought processes. Ten years later, an algorithm was
    created called “Nearest Neighbor.” This algorithm allowed computers to begin pattern
    recognition, albeit very basic at the time. This was ideal for salesmen to map
    routes, ensuring all their visits could be completed within the shortest time.


    It was in the 1990s that the biggest changes became apparent. Work was moving
    from an approach driven almost entirely by knowledge to a more data-driven one.
    Scientists started creating programs that'
  merge: -1
  img_proc: true
