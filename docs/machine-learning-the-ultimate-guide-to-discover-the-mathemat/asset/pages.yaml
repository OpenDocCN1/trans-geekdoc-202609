  md: '# CLUSTERING


    One widely used application of unsupervised learning is clustering. In clustering,
    the goal is to aggregate instances into a few cohesive groups.


    Doing so can help us solve a diverse array of problems. For instance, we can use
    clustering to segment customers into different groups based on their shopping
    preferences. We can also use it to detect outliers (by detecting instances that
    are not similar to any known clusters), reduce the number of features in our training
    set, or compress images.


    # K-Means Clustering


    One of the most commonly used algorithms for clustering is k-means clustering.
    The intuition behind this algorithm is quite simple.


    To perform k-means clustering, we must first decide on the number of clusters
    (k) we want. Next, we choose the centroids of these clusters randomly and perform
    the following steps iteratively:


    First, we assign each training instance to a cluster based on its proximity to
    the cluster’s centroid. Next, we compute the mean of'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'all the data points assigned to a cluster and use that to update the centroid.
    After updating the centroids of all the clusters, we reassign the points and repeat
    the updating and assigning steps until all the centroids stop changing.


    Let’s use a small dataset with five points - (2,2), (3,2), (3,1), (1,1), and (0,0)
    - to illustrate.


    If we want to cluster these points into two clusters, we need to select two centroids
    randomly. Suppose we choose (1.5, 1.5) and (3, 1.5) as the centroids and name
    the clusters C1 and C2, respectively.


    Now, we need to assign each data point to the cluster with the nearest centroid.
    To determine how close a point is to a centroid, we commonly use the Euclidean
    distance formula. The table below shows the distances of each point from the two
    centroids.


    # Centroid of C1 = (1.5, 1.5)Centroid of C2 = (3, 1.5)


    ![](img/d8987d3110291847d867988b0a2d7ecb_50_0.png)


    Based on the distances shown above, we’ll assign (2, 2), (1,1), and (0,0) to C1,
    and (3, 2) and (3, 1) to C2. Now, we need to calculate the mean of the data points
    in each cluster and use that to update the centroids.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '![](img/d8987d3110291847d867988b0a2d7ecb_51_0.png)


    The centroid of C1 changes to (1, 1), while that of C2 stays same. Let''s calculate
    the distances of our data points from the new centroids and reassign them.


    ![](img/d8987d3110291847d867988b0a2d7ecb_51_1.png)


    Most of the points remain in the same cluster except for (2, 2). We need to recalculate
    the mean of the data points in the two clusters and update the centroids.


    We repeat the process of updating the centroids and reassign data points until
    the clusters no longer change. When that happens, we say that the algorithm has
    converged and the algorithm ends.


    # Centroid Initialization Methods


    k-means clustering is a simple and easy-to-understand algorithm. However, when
    we use k-means clustering, there are two things we need to do.


    First, we need to choose the initial centroids. Choosing the initial centroids
    is known as centroid initialization, and poor initialization can lead to suboptimal
    solutions.'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'For instance, the chart below shows two identical sets of data points clustered
    differently due to different initial centroids (A, B, and C vs. X, Y, and Z).
    While both solutions give us three clusters, the solution on the right is better
    as the points within each cluster are closer to their centroids.


    ![](img/d8987d3110291847d867988b0a2d7ecb_52_0.png)


    # Centroid initialization


    There are two ways to select the initial centroids.


    The first way is to run the entire k-means algorithm multiple times with different
    randomly selected initial centroids. For each run, we compute the sum of the squared
    distances between each instance and the centroid of its final cluster. This sum
    is known as the inertia of the model. We then compare the inertias of all the
    runs and choose the run with the smallest inertia.


    Another way is to select the initial centroids using a technique known as k-means++.
    This technique uses additional computation to determine centroids that are distant
    from one another and has been shown to result in faster convergence and better
    results. sklearn k-means++ by default.


    # Determine the Number of Clusters


    Besides choosing the initial centroids, another task that we need to do'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'is decide on the number of clusters.


    One way to do this is to visually determine the number of clusters by plotting
    the dataset on a scatter plot. However, this only works if we have a simple dataset
    that can be easily plotted.


    A better approach is to use the elbow method. This method involves running the
