  md: '# PYTHON FOR MACHINE

    LEARNING


    In order to use machine learning, we need a programming language able to provide
    instructions to the machines. In this section, we are going to learn the basics
    of the Python language, how to install and launch python. We are also going to
    learn some Python syntax and some useful tools to run Python. We also cover basic
    Python libraries that useful for machine learning. First of all, why we would
    use Python and not another programming language?


