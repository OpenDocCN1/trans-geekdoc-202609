    That is the real essence of AI (Artificial Intelligence), where a computer can
    do what it has to without any human intervention. It''s all about using the data
    to learn and trying to work out relationships between the inputs. Unlike classification
    and regression, no output is expected with clustering or unsupervised learning.
    The focus is entirely on the inputs and looking for relationships and patterns.
    There may be clusters. The inputs may show clear relationships or associations.
    Or it could be that the model doesn''t find any kind of relationship at all.


    # Approaching Problems


    The common approach to problems among many data scientists is the binary method
    – is the task covered by supervised learning or unsupervised learning?


    The easiest way to determine this is to work out what output you expect. Do you
    want outputs predicted on new inputs?


    In that case, it would be regression under supervised learning. Or does a new
    input fall under category A or B, based on already labeled data? That would fall
    under classification as a supervised learning task. Do you want to see if or how
    data points aggregate? Are there any natural clusters? That would be clustering
    under unsupervised learning. Also, under unsupervised learning would be if you
    were trying to see any interesting relationships between inputs.


    Most advanced problems in data analysis come under these questions'
