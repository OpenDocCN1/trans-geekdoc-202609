  md: '# APPLICATIONS OF THE MACHINE LEARNING TECHNOLOGY


    # Virtual Personal Assistants


    The most popular case of virtual personal assistants are Siri and Alexa. These
    systems are capable of providing relevant information using simple voice commands.
    Machine learning is at the heart of these devices and systems, as they collect
    and define the information generated with every user interaction and use this
    information as training data to learn user preferences and provide an enhanced
    experience.


    # Predictions While Driving


    Most of the vehicles today utilize GPS navigation services, which collect information
    such as our current location and driving speed on a centralized server that can
    be used to generate a map of current traffic. This helps in managing traffic and
    reducing congestion. With the use of machine learning, the system can estimate
    the regions where and the time of the day traffic jams occur frequently. Machine
    learning algorithms allow sharing services such as Lyft and Uber, to minimize
    detours on their routes and provide users an upfront'
  merge: -1
  img_proc: true
