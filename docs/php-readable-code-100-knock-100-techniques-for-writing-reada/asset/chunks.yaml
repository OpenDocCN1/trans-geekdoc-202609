    # Use match expressions for cleaner switch-like functionality


    * * *


    PHP 8.0 introduced match expressions, offering a more concise and powerful alternative
    to switch statements.


    * * *


    The following code demonstrates how to use match expressions to handle different
    cases based on a value:


    < Good Code >


    // Good example using match expression


    function getStatusMessage($statusCode) {


        // Use match expression to return appropriate message


        return match ($statusCode) {


            200 => ''OK'',


            404 => ''Not Found'',


            500 => ''Internal Server Error'',


            default => ''Unknown Status'',


        };


    }


    // Usage


    $message = getStatusMessage(404);


    echo $message; // Outputs: Not Found


    <Bad Code>


    // Bad example using switch statement


    function getStatusMessage($statusCode) {


        // Use switch statement to return appropriate message


        switch ($statusCode) {


            case 200:


                return ''OK'';


                break;


            case 404:


                return ''Not Found'';


                break;


            case 500:


                return ''Internal Server Error'';


                break;


            default:


                return ''Unknown Status'';


                break;


        }


    }


    // Usage


    $message = getStatusMessage(404);


    echo $message; // Outputs: Not Found'
  fmt: "\nThe good code example uses a ternary operator `(?:)` to concisely assign\
