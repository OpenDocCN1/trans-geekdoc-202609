- raw: 'The spread operator (...) was introduced in PHP 7.4 and can be used not only
    for arrays but also for unpacking arguments in function calls.


    36


    # Use consistent indentation (spaces or tabs)


    * * *


    Maintain consistent indentation throughout your PHP code for improved readability.


    * * *


    The following examples show the importance of consistent indentation in PHP code:


    < Good Code >


    <?php


    // Good practice: Consistent indentation (using 4 spaces)


    function calculateTotal($items) {


        $total = 0;


        foreach ($items as $item) {


            $price = $item\[''price''\];


            $quantity = $item\[''quantity''\];


            $total += $price \* $quantity;


        }


        return $total;


    }


    $cart = \[


        \[''name'' => ''T-shirt'', ''price'' => 15, ''quantity'' => 2\],


        \[''name'' => ''Jeans'', ''price'' => 50, ''quantity'' => 1\]


    \];


    $totalCost = calculateTotal($cart);


    echo "Total cost: $" . $totalCost;


    ?>


    <Bad Code>


    <?php


    // Bad practice: Inconsistent indentation


    function calculateTotal($items) {


    $total = 0;


        foreach ($items as $item) {


      $price = $item\[''price''\];


            $quantity = $item\[''quantity''\];


        $total += $price \* $quantity;


        }


    return $total;


    }


    $cart = \[


    \[''name'' => ''T-shirt'', ''price'' => 15, ''quantity'' => 2\],


        \[''name'' => ''Jeans'', ''price'' => 50, ''quantity'' => 1\]


    \];


    $totalCost = calculateTotal($cart);


    echo "Total cost: $" . $totalCost;


    ?>


    The good code example uses consistent indentation (4 spaces) throughout the script.
    This makes the code structure clear and easy to read. The bad code example has
    inconsistent indentation, mixing different numbers of spaces and even no indentation.
    This makes the code harder to read and understand, especially for other developers
    who might work on the same project. Consistent indentation helps in visualizing
    the code structure, nested blocks, and improves overall code maintainability.


    <Memo>


    The PHP-FIG (Framework Interop Group) recommends using either 4 spaces or 1 tab
    for indentation in their PSR-12 coding style guide, but emphasizes consistency
    within a project.


    37


    # Limit line length to improve readability (e.g., 80-120 characters)


    * * *


    Keeping line lengths within 80-120 characters makes code easier to read and maintain.


    * * *


    Long lines of code can be difficult to read and understand. Limiting line length
    helps in maintaining readability and makes it easier for developers to navigate
    through the code.


    < Good Code >


    <?php


    // Good example with limited line length


    function calculateTotalPrice($price, $taxRate, $discount) {


        $taxAmount = $price \* $taxRate;


        $discountAmount = $price \* $discount;


        $totalPrice = $price + $taxAmount - $discountAmount;


        return $totalPrice;


    }


    ?>


    <Bad Code>


    <?php


    // Bad example with long lines


    function calculateTotalPrice($price, $taxRate, $discount) { $taxAmount = $price
    \* $taxRate; $discountAmount = $price \* $discount; $totalPrice = $price + $taxAmount
    - $discountAmount; return $totalPrice; }


    ?>


    In the good example, the code is broken down into multiple lines, making it easier
    to read and understand. In the bad example, the entire function is written in
    a single line, which makes it difficult to follow and maintain.


    <Memo>


    The 80-character limit originated from the width of punch cards used in early
    computing. Many modern coding standards still recommend this limit for readability.


    38


    # Use blank lines to separate logical sections of code


    * * *


    Blank lines help to visually separate different sections of code, making it easier
    to read and understand.


    * * *


    Using blank lines to separate logical sections of code improves readability by
    providing visual breaks between different parts of the code, making it easier
    to follow the flow of the program.


    < Good Code >


    <?php


    // Good example with blank lines separating logical sections


    function calculateTotalPrice($price, $taxRate, $discount) {


        // Calculate tax amount


        $taxAmount = $price \* $taxRate;


        // Calculate discount amount


        $discountAmount = $price \* $discount;


        // Calculate total price


        $totalPrice = $price + $taxAmount - $discountAmount;


        return $totalPrice;


    }


    ?>


    <Bad Code>


    <?php


    // Bad example without blank lines


    function calculateTotalPrice($price, $taxRate, $discount) {


        $taxAmount = $price \* $taxRate;


        $discountAmount = $price \* $discount;


        $totalPrice = $price + $taxAmount - $discountAmount;


        return $totalPrice;


    }


    ?>


    In the good example, blank lines are used to separate the calculation of tax,
    discount, and total price, making the code easier to read and understand. In the
    bad example, the lack of blank lines makes the code appear cluttered and harder
    to follow.


    <Memo>


    Using blank lines effectively can also help in debugging, as it allows developers
    to quickly identify and isolate different sections of code.


    39


    # Align assignment operators when declaring multiple variables


    * * *


    Aligning assignment operators improves readability and makes it easier to spot
    inconsistencies.


    * * *


    When declaring multiple variables, aligning the assignment operators can make
    the code more readable and maintainable.


    < Good Code >


    <?php


    // Good example with aligned assignment operators


    $firstName  = "John";  // Assigning first name


