    The good example implements \_\_debugInfo() to control what information is displayed
    during debugging. It omits sensitive data like passwords. The bad example exposes
    all properties, including sensitive information, which is a security risk.


    <Memo>


    The \_\_debugInfo() method was introduced in PHP 5.6.0 to provide developers with
    more control over object representation during debugging.


