    # Utilize scalar type declarations for primitive types


    * * *


    Use scalar type declarations to enforce strict typing for primitive data types
    in PHP.


    * * *


    The following example shows how to use scalar type declarations in a function
    that calculates the area of a rectangle:


    < Good Code >


    <?php


    declare(strict\_types=1);


    /\*\*


    \* Calculate the area of a rectangle


    \*


    \* @param float $length Length of the rectangle


    \* @param float $width Width of the rectangle


    \* @return float Area of the rectangle


    \*/


    function calculateRectangleArea(float $length, float $width): float


    {


        return $length \* $width;


    }


    // Usage


    $area = calculateRectangleArea(5.5, 3.2);


    echo "Area: " . $area; // Outputs: Area: 17.6


    <Bad Code>


    <?php


    function calculateRectangleArea($length, $width)


    {


        return $length \* $width;


    }


    // Usage


    $area = calculateRectangleArea("5.5", "3.2");


    echo "Area: " . $area;


    In the good example, we use declare(strict\_types=1) to enable strict type checking
    and float type declarations for parameters and return type. This ensures that
    only float values are accepted and returned. The bad example lacks type declarations,
    allowing any type of input, which can lead to unexpected results or errors.


    Benefits of using scalar type declarations:


    Improved code readability


    Better error detection at runtime


    Enhanced IDE support for autocompletion and type hinting


    <Memo>


    PHP 7.0 introduced scalar type declarations for int, float, string, and bool.
    Prior to this, only class names, self, array, and callable were allowed as type
    hints.


