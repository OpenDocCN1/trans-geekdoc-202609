    interface Coffee {


        public function getCost();


        public function getDescription();


    }


    // Concrete component


    class SimpleCoffee implements Coffee {


        public function getCost() {


            return 10;


        }


        public function getDescription() {


            return "Simple Coffee";


        }


    }


    // Base decorator


    abstract class CoffeeDecorator implements Coffee {


        protected $decoratedCoffee;


        public function \_\_construct(Coffee $coffee) {


            $this->decoratedCoffee = $coffee;


        }


        public function getCost() {


            return $this->decoratedCoffee->getCost();


        }


        public function getDescription() {


            return $this->decoratedCoffee->getDescription();


        }


    }


    // Concrete decorators


    class Milk extends CoffeeDecorator {


        public function getCost() {


            return $this->decoratedCoffee->getCost() + 2;


        }


        public function getDescription() {


            return $this->decoratedCoffee->getDescription() . ", Milk";


        }


    }


    class Sugar extends CoffeeDecorator {


        public function getCost() {


            return $this->decoratedCoffee->getCost() + 1;


        }


        public function getDescription() {


            return $this->decoratedCoffee->getDescription() . ", Sugar";


        }


    }


    // Usage


    $coffee = new SimpleCoffee();


    echo $coffee->getDescription() . " costs $" . $coffee->getCost() . "\\n";


    $coffee = new Milk($coffee);


    echo $coffee->getDescription() . " costs $" . $coffee->getCost() . "\\n";


    $coffee = new Sugar($coffee);


    echo $coffee->getDescription() . " costs $" . $coffee->getCost() . "\\n";


    <Bad Code>


    class Coffee {


        public $cost = 10;


        public $description = "Simple Coffee";


        public function addMilk() {


            $this->cost += 2;


            $this->description .= ", Milk";


        }


        public function addSugar() {


            $this->cost += 1;


            $this->description .= ", Sugar";


        }


        public function getInfo() {


            echo "$this->description costs $$this->cost\\n";


        }


    }


    $coffee = new Coffee();


    $coffee->getInfo();


    $coffee->addMilk();


    $coffee->getInfo();


    $coffee->addSugar();


    $coffee->getInfo();


    The good code example properly implements the decorator pattern. It defines a
    Coffee interface, a base SimpleCoffee class, and decorator classes (Milk and Sugar)
    that wrap and extend the functionality of the coffee object. This approach allows
    for flexible combination of decorators and easy addition of new decorators without
    modifying existing code.


    The bad code example doesn''t use the decorator pattern. Instead, it modifies
    the Coffee class directly with methods to add ingredients. This approach violates
    the Open/Closed Principle as adding new features requires modifying the existing
    Coffee class. It''s less flexible and harder to maintain or extend.


    <Memo>


    The decorator pattern is a structural design pattern that allows behavior to be
    added to individual objects, either statically or dynamically, without affecting
    the behavior of other objects from the same class. It''s often used to comply
    with the Single Responsibility Principle, as it allows functionality to be divided
    between classes with unique areas of concern.


