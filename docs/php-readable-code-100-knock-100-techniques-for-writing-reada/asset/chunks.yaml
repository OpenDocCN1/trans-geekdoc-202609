    The good code example uses an associative array to store user information, making
    it easy to manage and access related data. Keys are meaningful and self-explanatory.
    The bad code example uses separate variables, which can become unwieldy as the
    number of data points increases. The associative array approach also simplifies
    adding new key-value pairs and checking for the existence of specific keys.


