    # Prefer foreach loops over for loops when possible


    * * *


    Using foreach loops instead of for loops can make your code more readable and
    less error-prone when iterating over arrays or collections.


    * * *


    foreach loops are specifically designed for iterating over arrays and collections,
    providing a simpler and more intuitive syntax compared to for loops.


    < Good Code >


    $items = \[''apple'', ''banana'', ''cherry''\];


    // Using foreach loop


    foreach ($items as $item) {


        echo $item . "\\n"; // Output each item


    }


    <Bad Code>


    $items = \[''apple'', ''banana'', ''cherry''\];


    // Using for loop


    for ($i = 0; $i < count($items); $i++) {


        echo $items\[$i\] . "\\n"; // Output each item


    }


    In the good example, the foreach loop directly iterates over each item in the
    array, making the code more concise and easier to read. In the bad example, the
    for loop requires managing the loop counter and calling the count function, which
    can be more error-prone and less readable.


    <Memo>


    foreach loops are not only more readable but also more efficient in some cases,
    as they avoid repeatedly calling the count function within the loop condition.


    43


    # Use switch statements for multiple conditions on the same variable


    * * *


    Switch statements can improve code readability when dealing with multiple conditions
    for a single variable.


    * * *


    The following code demonstrates how to use a switch statement to handle different
    cases for a user''s role:


    < Good Code >


    // Determine user permissions based on role


    function getUserPermissions($role) {


        switch ($role) {


            case ''admin'':


                // Admin has full access


                return \[''read'', ''write'', ''delete'', ''manage''\];


            case ''editor'':


                // Editor can read, write, and delete


                return \[''read'', ''write'', ''delete''\];


            case ''author'':


                // Author can read and write


                return \[''read'', ''write''\];


            case ''subscriber'':


                // Subscriber can only read


                return \[''read''\];


            default:


                // Default case for unknown roles


                return \[''none''\];


        }


    }


    // Usage


    $userRole = ''editor'';


    $permissions = getUserPermissions($userRole);


    print\_r($permissions);


    <Bad Code>


    // Determine user permissions based on role


    function getUserPermissions($role) {


        if ($role == ''admin'') {


            return \[''read'', ''write'', ''delete'', ''manage''\];


        } elseif ($role == ''editor'') {


            return \[''read'', ''write'', ''delete''\];


        } elseif ($role == ''author'') {


            return \[''read'', ''write''\];


        } elseif ($role == ''subscriber'') {


            return \[''read''\];


        } else {


            return \[''none''\];


        }


    }


    // Usage


    $userRole = ''editor'';


    $permissions = getUserPermissions($userRole);


    print\_r($permissions);


    The good code example uses a switch statement, which is more readable and maintainable
    when dealing with multiple conditions for a single variable. Each case is clearly
    defined, making it easier to add or modify roles in the future. The bad code example
    uses a series of if-elseif statements, which can become harder to read and maintain
    as the number of conditions increases.


    <Memo>


    Switch statements in PHP support "fall-through" behavior, where execution continues
    to the next case if a break statement is omitted. This can be useful in certain
    scenarios but should be used cautiously to avoid unintended behavior.


    44


    # Employ guard clauses to handle edge cases early


    * * *


    Guard clauses help improve code readability by handling edge cases early in a
    function, reducing nesting and complexity.


    * * *


    The following code demonstrates how to use guard clauses to validate input parameters
    in a function:


    < Good Code >


    // Calculate discount based on purchase amount


    function calculateDiscount($purchaseAmount) {


        // Guard clause: Check for invalid input


        if (!is\_numeric($purchaseAmount) || $purchaseAmount < 0) {


            throw new InvalidArgumentException("Invalid purchase amount");


        }


        // Guard clause: No discount for small purchases


        if ($purchaseAmount < 100) {


            return 0;


        }


        // Calculate discount


        if ($purchaseAmount >= 500) {


            return $purchaseAmount \* 0.1; // 10% discount


        } else {


            return $purchaseAmount \* 0.05; // 5% discount


        }


    }


    // Usage


    try {


        $discount = calculateDiscount(250);


        echo "Discount: $" . number\_format($discount, 2);


    } catch (InvalidArgumentException $e) {


        echo "Error: " . $e->getMessage();


    }


    <Bad Code>


