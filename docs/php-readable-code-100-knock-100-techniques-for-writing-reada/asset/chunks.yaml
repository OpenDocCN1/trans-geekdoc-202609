- raw: 'The following example shows how to use strict\_types declaration in PHP:


    < Good Code >


    <?php


    declare(strict\_types=1);


    // Function with type hints and return type declaration


    function addNumbers(int $a, int $b): int


    {


        return $a + $b;


    }


    // Correct usage


    $result = addNumbers(5, 10);


    echo $result; // Outputs: 15


    // This will throw a TypeError


    // $result = addNumbers(5, "10");


    <Bad Code>


    <?php


    // Without strict\_types declaration


    // Function without type hints


    function addNumbers($a, $b)


    {


        return $a + $b;


    }


    // This works, but may lead to unexpected results


    $result = addNumbers(5, "10");


    echo $result; // Outputs: 15


    // This also "works", but is likely not intended


    $result = addNumbers("5", "10");


    echo $result; // Outputs: 15


    In the good example, we use declare(strict\_types=1) at the beginning of the file.
    This enables strict type checking. We also use type hints for function parameters
    and return type declaration. This ensures that only integers can be passed to
    the function and returned from it.


    In the bad example, without strict types, PHP will attempt to coerce values to
    the appropriate type. This can lead to unexpected behavior, as seen when passing
    a string "10" instead of an integer 10.


    <Memo>


    Strict types were introduced in PHP 7.0, providing a way to opt-in to stricter
    type checking and improving code reliability.


    17


    # Implement magic methods for cleaner syntax


    * * *


    Use \_\_toString, \_\_get, and \_\_set magic methods to create more intuitive
    and readable code.


    * * *


    The following code demonstrates the use of magic methods in a Person class:


    < Good Code >


    class Person {


        private $data = \[\];


        // Magic method to convert object to string


        public function \_\_toString() {


            return $this->data\[''name''\] ?? ''Unnamed Person'';


        }


        // Magic method to get properties


        public function \_\_get($property) {


            return $this->data\[$property\] ?? null;


        }


        // Magic method to set properties


        public function \_\_set($property, $value) {


            $this->data\[$property\] = $value;


        }


    }


    // Usage


    $person = new Person();


    $person->name = "John Doe";  // Uses \_\_set


    $person->age = 30;           // Uses \_\_set


    echo $person;                // Uses \_\_toString


    echo $person->name;          // Uses \_\_get


    <Bad Code>


    class Person {


        public $name;


        public $age;


        public function getName() {


            return $this->name;


        }


        public function setName($name) {


            $this->name = $name;


        }


        public function getAge() {


            return $this->age;


        }


        public function setAge($age) {


            $this->age = $age;


        }


        public function getPersonInfo() {


            return $this->name ?? ''Unnamed Person'';


        }


    }


    // Usage


    $person = new Person();


    $person->setName("John Doe");


    $person->setAge(30);


    echo $person->getPersonInfo();


    echo $person->getName();


    The good code example uses magic methods (\_\_toString, \_\_get, \_\_set) to create
    a more intuitive and flexible interface. This allows for dynamic property access
    and setting, as well as easy string conversion. The bad code example uses traditional
    getters and setters, which can lead to more verbose and less flexible code.


    <Memo>


    Magic methods in PHP are special methods that override PHP''s default action when
    certain actions are performed on an object.


    18


    # Use generators for memory-efficient iteration


    * * *


    Implement generators to handle large datasets without excessive memory usage.


    * * *


    The following code demonstrates the use of a generator function to process a large
    file:


    < Good Code >


    function readLargeFile($filePath) {


        $handle = fopen($filePath, ''r'');


        while (!feof($handle)) {


            yield trim(fgets($handle));


        }


        fclose($handle);


    }


    // Usage


    $filePath = ''large\_file.txt'';


    foreach (readLargeFile($filePath) as $line) {


        echo "Processing line: $line\\n";


        // Process each line


    }


    <Bad Code>


    function readLargeFile($filePath) {


        $lines = \[\];


        $handle = fopen($filePath, ''r'');


        while (!feof($handle)) {


            $lines\[\] = trim(fgets($handle));


        }


        fclose($handle);


        return $lines;


    }


    // Usage


    $filePath = ''large\_file.txt'';


    $allLines = readLargeFile($filePath);


    foreach ($allLines as $line) {


        echo "Processing line: $line\\n";


        // Process each line


    }


    The good code example uses a generator function, which yields each line of the
    file one at a time. This approach is memory-efficient as it doesn''t load the
    entire file into memory at once. The bad code example reads the entire file into
    an array before processing, which can lead to high memory usage for large files.


    <Memo>


    Generators were introduced in PHP 5.5 and provide an easy way to implement simple
    iterators without the overhead or complexity of implementing a class that implements
    the Iterator interface.


    19


    # Employ late static binding for more flexible inheritance


    * * *


    Use self::class instead of static::class for more flexible and dynamic inheritance
    in PHP.


    * * *


    Late static binding allows for more flexible inheritance by using the ''static''
    keyword instead of ''self''. This is particularly useful when dealing with inherited
    static methods.


    < Good Code >


    class ParentClass {


        public static function getClassName() {


            // Use static::class for late static binding


            return static::class;


        }


    }


    class ChildClass extends ParentClass {


        // No need to override getClassName()


    }


    // Usage


    echo ParentClass::getClassName(); // Outputs: ParentClass


    echo ChildClass::getClassName();  // Outputs: ChildClass


    <Bad Code>


    class ParentClass {


        public static function getClassName() {


            // Using self::class, which always refers to the current class


            return self::class;


        }


    }


    class ChildClass extends ParentClass {


        // Forced to override to get the correct class name


        public static function getClassName() {


            return self::class;


        }


    }


    // Usage


    echo ParentClass::getClassName(); // Outputs: ParentClass


    echo ChildClass::getClassName();  // Outputs: ChildClass, but requires overriding


    In the good example, we use static::class which employs late static binding. This
    allows the method to return the correct class name even when called from a child
    class, without the need to override the method in each child class. The bad example
    uses self::class, which always refers to the class in which it''s used, requiring
    each child class to override the method to return the correct class name.


    <Memo>


    Late static binding was introduced in PHP 5.3.0 and provides a way to reference
    the called class in a static context.


    20


    # Utilize SPL data structures for specialized data handling


    * * *


    Leverage PHP''s Standard PHP Library (SPL) data structures for efficient and specialized
    data handling.


    * * *


    SPL provides a set of standard data structures which can be more efficient and
    appropriate for specific use cases compared to general-purpose arrays.


    < Good Code >


    // Using SplFixedArray for a fixed-size, integer-indexed array


    $fixedArray = new SplFixedArray(5);


    for ($i = 0; $i < 5; $i++) {


        $fixedArray\[$i\] = $i \* 2;


    }


    // Using SplQueue for a queue data structure


    $queue = new SplQueue();


    $queue->enqueue(''first'');


    $queue->enqueue(''second'');


    $firstOut = $queue->dequeue();


    // Using SplObjectStorage for object-based storage


    $storage = new SplObjectStorage();


    $obj1 = new stdClass();


    $obj2 = new stdClass();


    $storage->attach($obj1, ''data for obj1'');


    $storage->attach($obj2, ''data for obj2'');


    // Checking if an object exists in storage


    var\_dump($storage->contains($obj1)); // true


    <Bad Code>


    // Using a regular array as a fixed-size array


    $fixedArray = array();


    for ($i = 0; $i < 5; $i++) {


        $fixedArray\[$i\] = $i \* 2;


    }


    // Using an array as a queue


    $queue = array();


    array\_push($queue, ''first'');


    array\_push($queue, ''second'');


    $firstOut = array\_shift($queue);'
