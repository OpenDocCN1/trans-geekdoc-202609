    # Break long method chains into multiple lines


    * * *


    Improve code readability by splitting long method chains across multiple lines.


    * * *


    The following code demonstrates how to break a long method chain for better readability:


    < Good Code >


    // Good: Breaking long method chain into multiple lines


    $result = $database->table(''users'')


        ->select(''name'', ''email'')


        ->where(''active'', true)


        ->orderBy(''created\_at'', ''desc'')


        ->limit(10)


        ->get();


    <Bad Code>


    // Bad: Long method chain on a single line


    $result = $database->table(''users'')->select(''name'', ''email'')->where(''active'',
    true)->orderBy(''created\_at'', ''desc'')->limit(10)->get();


    The good code example breaks the long method chain into multiple lines, with each
    method call on a new line and indented. This improves readability by making it
    easier to see each step in the chain. The bad code example puts everything on
    one line, making it harder to read and understand the individual method calls.


    <Memo>


    Many modern IDEs and code editors support automatic formatting that can help break
    long method chains into multiple lines.


