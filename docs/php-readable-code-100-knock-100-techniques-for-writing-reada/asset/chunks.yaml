    \     * @return array\n     */\n    public function __serialize(): array\n   \
    \ {\n        return [\n            'username' => $this->username,\n          \
    \  'email' => $this->email,\n            'preferences' => $this->preferences,\n\
    \        ];\n    }\n\n    /**\n     * 反序列化方法\n     * @param array $data\n    \
