    # Extract complex validation logic into dedicated validator classes


    * * *


    Separate complex validation logic into dedicated validator classes for improved
    code organization and reusability.


    * * *


    The following code demonstrates how to extract complex validation logic into a
    dedicated validator class in PHP:


    < Good Code >


    // UserValidator.php


    class UserValidator {


        public function validateUsername($username) {


            if (strlen($username) < 3 || strlen($username) > 20) {


                throw new ValidationException("Username must be between 3 and 20 characters.");


            }


            if (!preg\_match(''/^\[a-zA-Z0-9\_\]+$/'', $username)) {


                throw new ValidationException("Username can only contain letters,
    numbers, and underscores.");


            }


        }


        public function validateEmail($email) {


            if (!filter\_var($email, FILTER\_VALIDATE\_EMAIL)) {


                throw new ValidationException("Invalid email format.");


            }


            // Additional email validation logic (e.g., domain check) can be added
    here


        }


        public function validatePassword($password) {


            if (strlen($password) < 8) {


                throw new ValidationException("Password must be at least 8 characters
    long.");


            }


            if (!preg\_match(''/\[A-Z\]/'', $password) || !preg\_match(''/\[a-z\]/'',
    $password) || !preg\_match(''/\[0-9\]/'', $password)) {


                throw new ValidationException("Password must contain at least one
    uppercase letter, one lowercase letter, and one number.");


            }


        }


    }


    // Usage


    $validator = new UserValidator();


    try {


        $validator->validateUsername($username);


        $validator->validateEmail($email);


        $validator->validatePassword($password);


        // Proceed with user registration


    } catch (ValidationException $e) {


        // Handle validation error


        echo $e->getMessage();


    }


