    \  }\n}\n\n// Usage\n$emailSender = new EmailSender();\n$emailSender->sendWelcomeEmail($user);\n\
    ```\n\n良好的代码示例将不同层级的抽象分离到不同的方法中。`sendWelcomeEmail()` 方法提供了流程的高层概览，而低层细节则由 `prepareWelcomeEmailContent()`、`getWelcomeEmailTemplate()`\
    \ 和 `sendEmail()` 等独立方法负责处理。这种分离使得代码更具模块化、更容易理解，并且更易维护或扩展。\n\n糟糕的代码示例将所有操作合并在单个方法中，将高层逻辑与低层细节混合在一起。这种方法会导致代码更难以阅读、理解和维护，特别是当操作复杂性增加时。\n\
    \n<Memo>\n该原则与 SOLID 原则中的单一职责原则 (SRP) 相关，该原则规定一个类或方法应该只有一个改变的原因。\n\n</Memo>\n\n\
    63\n\n# 使用不修改状态的纯函数\n\n编写对于给定输入始终产生相同输出且不修改外部状态的函数。\n\n以下代码演示了一个纯函数，它可以在不修改原始数据的情况下计算数组之和：\n\
    \n### 良好的代码\n\n```php\n/**\n * 计算数字数组之和\n *\n * @param array $numbers 待求和的数字数组\n\
    \ * @return int 数组中所有数字之和\n */\nfunction calculateSum(array $numbers): int\n{\n\
    \    // 使用 array_reduce 求和所有元素而不修改原始数组\n    return array_reduce($numbers, function($carry,\
    \ $item) {\n        return $carry + $item;\n    }, 0);\n}\n\n// 示例用法\n$myNumbers\
    \ = [1, 2, 3, 4, 5];\n$sum = calculateSum($myNumbers);\necho \"Sum: \" . $sum;\
    \ // Output: Sum: 15\n\n// 原始数组保持不变\nprint_r($myNumbers); // Output: Array ([0]\
    \ => 1 [1] => 2 [2] => 3 [3] => 4 [4] => 5 )\n```\n\n### 糟糕的代码\n\n```php\n/**\n\
    \ * 计算数字数组之和（非纯函数）\n *\n * @param array $numbers 待求和的数字数组\n * @return int 数组中所有数字之和\n\
    \ */\nfunction calculateSum(array &$numbers): int\n{\n    $sum = 0;\n    // 在计算和的同时修改原始数组\n\
    \    foreach ($numbers as &$number) {\n        $sum += $number;\n        $number\
    \ *= 2; // 修改数组中的每个数字\n    }\n    return $sum;\n}\n\n// 示例用法\n$myNumbers = [1,\
    \ 2, 3, 4, 5];\n$sum = calculateSum($myNumbers);\necho \"Sum: \" . $sum; // Output:\
    \ Sum: 15\n\n// 原始数组被修改了\nprint_r($myNumbers); // Output: Array ([0] => 2 [1]\
    \ => 4 [2] => 6 [3] => 8 [4] => 10 )\n```\n\n良好的代码示例演示了一个纯函数，它可以在不修改原始数据的情况下计算数组之和。它使用\
    \ `array_reduce` 遍历数组并对其元素求和。该函数对于相同的输入总是产生相同的输出，并且没有任何副作用。\n\n糟糕的代码示例展示了一个非纯函数，它在计算和的同时修改了原始数组。它使用了引用参数并在计算过程中修改了数组的每个元素。这种方法会导致意外的行为，并使得代码难以推理和测试。\n\
    \n<Memo>\n纯函数是函数式编程中的核心概念，可以写出更可预测且更容易测试的代码。\n\n</Memo>\n\n64\n\n# 为类和方法实现单一职责原则\n\
    \n设计具有单一、明确职责的类和方法，以改进代码组织和可维护性。\n\n以下代码通过分离用户数据管理和电子邮件功能演示了单一职责原则：\n\n### 良好的代码\n\
    \n```php\n/**\n * 负责管理用户数据的类\n */\nclass User\n{\n    private $name;\n    private\
    \ $email;\n\n    /**\n     * 初始化用户数据的构造函数\n     * @param string $name 用户名\n  \
    \   * @param string $email 用户邮箱\n     */\n    public function __construct(string\
    \ $name, string $email)\n    {\n        $this->name = $name;\n        $this->email\
    \ = $email;\n    }\n\n    /**\n     * 获取用户的邮箱\n     * @return string 用户邮箱\n  \
    \   */\n    public function getEmail()\n    {\n        return $this->email;\n\
    \    }\n}\n\n/**\n * 负责发送电子邮件的类\n */\nclass EmailService\n{\n    /**\n     * 向用户发送欢迎邮件\n\
    \     * @param User $user 要发送的用户\n     * @return bool 如果邮件发送成功返回 true，否则返回 false\n\
    \     */\n    public function sendWelcomeEmail(User $user)\n    {\n        $to\
    \ = $user->getEmail();\n        $subject = \"欢迎来到我们的服务!\";\n        $message =\
    \ \"感谢您加入我们的平台。\";\n        // 邮件发送逻辑...\n        return mail($to, $subject, $message);\n\
    \    }\n    // 其他相关方法...\n}\n\n// 用法\n$user = new User(\"John Doe\", \"john@example.com\"\
    );\n$emailService = new EmailService();\n$emailService->sendWelcomeEmail($user);\n\
    ```\n\n### 糟糕的代码\n\n```php\n/**\n * 混合了职责的用户类\n */\nclass User\n{\n    private\
    \ $name;\n    private $email;\n\n    /**\n     * 初始化用户数据的构造函数\n     * @param string\
    \ $name 用户名\n     * @param string $email 用户邮箱\n     */\n    public function __construct(string\
    \ $name, string $email)\n    {\n        $this->name = $name;\n        $this->email\
    \ = $email;\n    }\n\n    /**\n     * 向用户发送欢迎邮件\n     * @return bool 如果邮件发送成功返回\
    \ true，否则返回 false\n     */\n    public function sendWelcomeEmail()\n    {\n  \
    \      $to = $this->email;\n        $subject = \"欢迎来到我们的服务!\";\n        $message\
    \ = \"感谢您加入我们的平台。\";\n        // 邮件发送逻辑...\n        return mail($to, $subject,\
    \ $message);\n    }\n    // 其他用户相关和邮件相关方法混合在一起...\n}\n\n// 用法\n$user = new User(\"\
    John Doe\", \"john@example.com\");\n$user->sendWelcomeEmail();\n```\n\n"
