    \ costs $$this->cost\\n\";\n    }\n}\n$coffee = new Coffee();\n$coffee->getInfo();\n\
    $coffee->addMilk();\n$coffee->getInfo();\n$coffee->addSugar();\n$coffee->getInfo();\n\
    ```\n\n良好的代码示例正确地实现了装饰器模式。它定义了一个 `Coffee` 接口、一个基础 `SimpleCoffee` 类，以及装饰器类（`Milk`\
    \ 和 `Sugar`），这些类用于封装并扩展咖啡对象的功能。这种方法允许对装饰器进行灵活组合，并且可以在不修改现有代码的情况下轻松添加新的装饰器。\n\n\
    坏的代码示例没有使用装饰器模式。相反，它通过添加添加配料的方法直接修改 `Coffee` 类。这种方法违反了“开闭原则”，因为添加新功能需要修改现有的 `Coffee`\
    \ 类。它的灵活性较低，且更难维护或扩展。\n\n### 备忘录\n\n装饰器模式是一种结构性设计模式，它允许静态或动态地为单个对象添加行为，而不会影响同类中其他对象的行为。它通常用于遵循“单一职责原则”，因为它允许将功能划分到具有不同关注点的类之间。\n\
