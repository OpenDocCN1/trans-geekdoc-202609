    # Implement ArrayAccess for array-like object behavior


    * * *


    Implement the ArrayAccess interface to allow objects to be accessed like arrays.


    * * *


    The following code demonstrates how to implement the ArrayAccess interface to
    create an object that behaves like an array:


    < Good Code >


    <?php


    // Good example: Implementing ArrayAccess for a custom object


    class CustomArray implements ArrayAccess {


        private $container = array();


        // Check if an offset exists


        public function offsetExists($offset): bool {


            return isset($this->container\[$offset\]);


        }


        // Get the value at a given offset


        public function offsetGet($offset): mixed {


            return isset($this->container\[$offset\]) ? $this->container\[$offset\]
    : null;


        }


        // Set the value at a given offset


        public function offsetSet($offset, $value): void {


            if (is\_null($offset)) {


                $this->container\[\] = $value;


            } else {


                $this->container\[$offset\] = $value;


            }


        }


        // Unset the value at a given offset


        public function offsetUnset($offset): void {


            unset($this->container\[$offset\]);


        }


    }


    // Usage example


    $obj = new CustomArray();


    $obj\[''key''\] = ''value'';


    echo $obj\[''key''\]; // Outputs: value


    <Bad Code>


    <?php


    // Bad example: Not implementing ArrayAccess, using magic methods instead


    class BadCustomArray {


        private $container = array();


        public function \_\_set($name, $value) {


            $this->container\[$name\] = $value;


        }


        public function \_\_get($name) {


            return $this->container\[$name\];


        }


    }


    // Usage example


    $obj = new BadCustomArray();


    $obj->key = ''value''; // Works, but not array-like syntax


    echo $obj->key; // Outputs: value


    The good example implements the ArrayAccess interface, allowing the object to
    be used with array syntax. This makes the code more intuitive and consistent with
    array operations. The bad example uses magic methods, which work but don''t provide
    true array-like syntax and may be less performant.


    <Memo>


    The ArrayAccess interface was introduced in PHP 5.0 and is part of the Standard
    PHP Library (SPL).


