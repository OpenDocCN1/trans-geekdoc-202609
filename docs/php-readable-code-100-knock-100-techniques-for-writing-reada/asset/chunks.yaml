    # Avoid global variables, use dependency injection


    * * *


    Instead of using global variables, pass dependencies as parameters to functions
    or methods.


    * * *


    The following code demonstrates the difference between using global variables
    and dependency injection in a simple logging system.


    < Good Code >


    // Logger class with dependency injection


    class Logger {


        private $logFile;


        public function \_\_construct($logFile) {


            $this->logFile = $logFile;


        }


        public function log($message) {


            $timestamp = date(''Y-m-d H:i:s'');


            $logEntry = "$timestamp: $message\\n";


            file\_put\_contents($this->logFile, $logEntry, FILE\_APPEND);


        }


    }


    // Usage example


    $logger = new Logger(''/path/to/app.log'');


    function processOrder($orderId, Logger $logger) {


        // Process order logic here


        $logger->log("Order $orderId processed successfully");


    }


    // Using the logger


    $orderId = 12345;


    processOrder($orderId, $logger);


    <Bad Code>


    // Global variable for log file


    $GLOBALS\[''logFile''\] = ''/path/to/app.log'';


    // Logger function using global variable


    function logMessage($message) {


        global $logFile;


        $timestamp = date(''Y-m-d H:i:s'');


        $logEntry = "$timestamp: $message\\n";


        file\_put\_contents($logFile, $logEntry, FILE\_APPEND);


    }


    // Usage example


    function processOrder($orderId) {


        // Process order logic here


        logMessage("Order $orderId processed successfully");


    }


    // Using the logger


    $orderId = 12345;


    processOrder($orderId);


    The good code example uses dependency injection by passing the Logger object as
    a parameter to the processOrder function. This approach makes the code more modular,
    testable, and easier to maintain. The bad code example uses a global variable
    $GLOBALS\[''logFile''\] and a global function logMessage, which can lead to tight
    coupling and make the code harder to test and modify.


    <Memo>


    Dependency injection is a key principle in object-oriented design and is one of
    the SOLID principles (specifically, the D in SOLID stands for Dependency Inversion
    Principle).


    59


    # Use constants for fixed values


    * * *


    Using constants for fixed values improves code readability and maintainability.


    * * *


    Constants are a great way to define values that do not change throughout the execution
    of a script. They make the code easier to understand and modify.


    < Good Code >


    <?php


    // Define a constant for the tax rate


    define(''TAX\_RATE'', 0.08);


    // Function to calculate the total price including tax


    function calculateTotalPrice($price) {


        // Use the constant TAX\_RATE


        return $price + ($price \* TAX\_RATE);


    }


    // Example usage


    $price = 100;


    $totalPrice = calculateTotalPrice($price);


    echo "Total Price: $" . $totalPrice; // Outputs: Total Price: $108


    ?>


    <Bad Code>


    <?php


    // Function to calculate the total price including tax


    function calculateTotalPrice($price) {


        // Hardcoded tax rate


        return $price + ($price \* 0.08);


    }


    // Example usage


    $price = 100;


    $totalPrice = calculateTotalPrice($price);


    echo "Total Price: $" . $totalPrice; // Outputs: Total Price: $108


    ?>


    In the good example, the tax rate is defined as a constant, making it easy to
    update and understand. In the bad example, the tax rate is hardcoded, which makes
    the code less flexible and harder to maintain.


    <Memo>


    PHP constants are defined using the define() function or the const keyword. Constants
    are automatically global and can be accessed from any part of the script.


    60


    # Employ static variables for persistent state within functions


    * * *


    Static variables retain their value between function calls, providing a way to
    maintain state within a function.


    * * *


    Static variables are useful when you need to keep track of information across
    multiple calls to the same function without using global variables.


    < Good Code >


    <?php


    // Function to generate a unique ID


    function generateUniqueId() {


        // Static variable to keep track of the last ID


        static $lastId = 0;


        $lastId++;


        return $lastId;


    }


    // Example usage


    echo generateUniqueId(); // Outputs: 1


    echo generateUniqueId(); // Outputs: 2


    echo generateUniqueId(); // Outputs: 3


    ?>


    <Bad Code>


    <?php


    // Function to generate a unique ID


    function generateUniqueId() {


        // Non-static variable to keep track of the last ID


        $lastId = 0;


        $lastId++;


        return $lastId;


    }


    // Example usage


    echo generateUniqueId(); // Outputs: 1


    echo generateUniqueId(); // Outputs: 1


    echo generateUniqueId(); // Outputs: 1


    ?>


    In the good example, the static variable $lastId retains its value between function
    calls, allowing the function to generate a unique ID each time it is called. In
    the bad example, the variable $lastId is reinitialized to 0 on each call, resulting
    in the same ID being returned every time.


    <Memo>


    Static variables in PHP are declared using the static keyword. They are initialized
    only once and retain their value between function calls, making them ideal for
    counting or accumulating values.


