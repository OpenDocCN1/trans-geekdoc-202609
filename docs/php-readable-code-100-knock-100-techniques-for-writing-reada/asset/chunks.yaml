    \ in the array\n */\nfunction calculateSum(array $numbers): int\n{\n    // Use\
    \ array_reduce to sum all elements without modifying the original array\n    return\
    \ array_reduce($numbers, function($carry, $item) {\n        return $carry + $item;\n\
    \    }, 0);\n}\n\n// Example usage\n$myNumbers = [1, 2, 3, 4, 5];\n$sum = calculateSum($myNumbers);\n\
    echo \"Sum: \" . $sum; // Output: Sum: 15\n\n// Original array remains unchanged\n\
    print_r($myNumbers); // Output: Array ([0] => 1 [1] => 2 [2] => 3 [3] => 4 [4]\
    \ => 5 )\n```\n\n### Bad Code\n\n```php\n/**\n * Calculate the sum of an array\
    \ of numbers (impure function)\n *\n * @param array $numbers Array of numbers\
    \ to sum\n * @return int The sum of all numbers in the array\n */\nfunction calculateSum(array\
    \ &$numbers): int\n{\n    $sum = 0;\n    // Modify the original array while calculating\
    \ the sum\n    foreach ($numbers as &$number) {\n        $sum += $number;\n  \
    \      $number *= 2; // Modify each number in the array\n    }\n    return $sum;\n\
    }\n\n// Example usage\n$myNumbers = [1, 2, 3, 4, 5];\n$sum = calculateSum($myNumbers);\n\
    echo \"Sum: \" . $sum; // Output: Sum: 15\n\n// Original array is modified\nprint_r($myNumbers);\
    \ // Output: Array ([0] => 2 [1] => 4 [2] => 6 [3] => 8 [4] => 10 )\n```\n\nThe\
    \ good code example demonstrates a pure function that calculates the sum of an\
    \ array without modifying the original data. It uses `array_reduce` to iterate\
    \ through the array and sum its elements. The function always produces the same\
    \ output for the same input and doesn't have any side effects.\n\nThe bad code\
    \ example shows an impure function that modifies the original array while calculating\
    \ the sum. It uses a reference parameter and modifies each element of the array\
    \ during the calculation. This approach can lead to unexpected behavior and makes\
    \ the code harder to reason about and test.\n\n<Memo>\nPure functions are a key\
    \ concept in functional programming and can lead to more predictable and easier-to-test\
    \ code.\n\n64\n\n# Implement single responsibility principle for classes and methods\n\
    \nDesign classes and methods that have a single, well-defined responsibility to\
    \ improve code organization and maintainability.\n\nThe following code demonstrates\
    \ the Single Responsibility Principle by separating user data management and email\
    \ functionality:\n\n### Good Code\n\n```php\n/**\n * User class responsible for\
    \ managing user data\n */\nclass User\n{\n    private $name;\n    private $email;\n\
    \n    /**\n     * Constructor to initialize user data\n     * @param string $name\
    \ User's name \n     * @param string $email User's email\n     */\n    public\
    \ function __construct(string $name, string $email)\n    {\n        $this->name\
    \ = $name;\n        $this->email = $email;\n    }\n\n    /**\n     * Get user's\
    \ email\n     * @return string User's email\n     */\n    public function getEmail()\n\
    \    {\n        return $this->email;\n    }\n}\n\n/**\n * EmailService responsible\
    \ for sending emails\n */\nclass EmailService\n{\n    /**\n     * Send a welcome\
    \ email to a user\n     * @param User $user User to send\n     * @return bool\
    \ True if email sent, otherwise\n     */\n    public function sendWelcomeEmail(User\
    \ $user)\n    {\n        $to = $user->getEmail();\n        $subject = \"Welcome\
    \ to our service!\";\n        $message = \"Thank you for joining our platform.\"\
    ;\n        // Email sending logic...\n        return mail($to, $subject, $message);\n\
    \    }\n    // Other email-related methods...\n}\n\n// Usage\n$user = new User(\"\
    John Doe\", \"john@example.com\");\n$emailService = new EmailService();\n$emailService->sendWelcomeEmail($user);\n\
    ```\n\n### Bad Code\n\n```php\n/**\n * User class with mixed responsibilities\n\
    \ */\nclass User\n{\n    private $name;\n    private $email;\n\n    /**\n    \
    \ * Constructor to initialize user data\n     * @param string $name User's name\
    \ \n     * @param string $email User's email\n     */\n    public function __construct(string\
    \ $name, string $email)\n    {\n        $this->name = $name;\n        $this->email\
    \ = $email;\n    }\n\n    /**\n     * Send a welcome email to the user\n     *\
    \ @return bool True if email sent, otherwise\n     */\n    public function sendWelcomeEmail()\n\
    \    {\n        $to = $this->email;\n        $subject = \"Welcome to our service!\"\
    ;\n        $message = \"Thank you for joining our platform.\";\n        // Email\
    \ sending logic...\n        return mail($to, $subject, $message);\n    }\n   \
    \ // Other user-related and email-related methods mixed together...\n}\n\n// Usage\n\
    $user = new User(\"John Doe\", \"john@example.com\");\n$user->sendWelcomeEmail();\n\
    ```\n\nThe good code example demonstrates the Single Responsibility Principle\
    \ by separating user data management (User class) from email functionality (EmailService\
    \ class). This separation of concerns makes the code more modular, easier to maintain,\
    \ and allows for better testing and future extensions.\n\nThe bad code example\
    \ violates the Single Responsibility Principle by combining user data management\
    \ and email sending functionality in a single User class. This approach makes\
    \ the class less focused, harder to maintain, and more difficult to test or modify\
    \ independently.\n\n<Memo>\nThe Single Responsibility Principle is one of the\
    \ five SOLID principles of object-oriented programming and design, introduced\
    \ by Robert C. Martin.\n\n65\n"
