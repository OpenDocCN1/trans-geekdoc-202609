        $upperName = strtoupper($user->name);


    }


    echo "Upper name: " . $upperName . "\\n";


    The good code example uses the null safe operator (?->) to access object properties
    and methods. This operator checks if the object is null before attempting to access
    its properties or methods, preventing null reference errors. It also allows for
    easy chaining of operations.


    The bad code example uses traditional null checks and isset() functions, which
    make the code more verbose and harder to read. It requires multiple conditions
    to safely access properties and methods, increasing the complexity of the code.


    <Memo>


    The null safe operator was introduced in PHP 8.0 and is particularly useful when
    working with APIs or databases where null values are common.


