    # Use the spaceship operator (<=>) for concise comparisons


    * * *


    The spaceship operator simplifies comparison operations in PHP, making code more
    readable and concise.


    * * *


    The following code demonstrates how to use the spaceship operator to compare values
    and sort an array:


    < Good Code >


    // Using the spaceship operator for comparison and sorting


    $fruits = \[''apple'', ''banana'', ''cherry''\];


    // Sort the array using the spaceship operator


    usort($fruits, function($a, $b) {


        // The spaceship operator returns -1, 0, or 1


        return $a <=> $b;


    });


    // Output the sorted array


    foreach ($fruits as $fruit) {


        echo $fruit . "\\n";


    }


    // Compare numbers using the spaceship operator


    $result = 5 <=> 10;


    echo "Comparison result: " . $result . "\\n";


    <Bad Code>


    // Not using the spaceship operator for comparison and sorting


    $fruits = \[''apple'', ''banana'', ''cherry''\];


    // Sort the array using a traditional comparison function


    usort($fruits, function($a, $b) {


        if ($a < $b) {


            return -1;


        } elseif ($a > $b) {


            return 1;


        } else {


            return 0;


        }


    });


    // Output the sorted array


    foreach ($fruits as $fruit) {


        echo $fruit . "\\n";


    }


    // Compare numbers without using the spaceship operator


    $a = 5;


    $b = 10;


    if ($a < $b) {


        $result = -1;


    } elseif ($a > $b) {


        $result = 1;


    } else {


        $result = 0;


    }


    echo "Comparison result: " . $result . "\\n";


    The good code example uses the spaceship operator (<=>) for both sorting and comparison.
    This operator returns -1 if the left operand is less than the right, 0 if they
    are equal, and 1 if the left operand is greater. It simplifies comparison logic,
    making the code more concise and easier to read.


    The bad code example uses traditional comparison methods, which are more verbose
    and prone to errors. The sorting function is longer and less intuitive, and the
    number comparison requires multiple if-else statements.


    <Memo>


    The spaceship operator was introduced in PHP 7.0 and is also known as the combined
    comparison operator.


