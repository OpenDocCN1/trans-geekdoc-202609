    The good code example demonstrates the use of namespaces to organize classes into
    logical groups. The User and Order classes are placed in the App\\Models namespace,
    while the UserController is in the App\\Controllers namespace. This organization
    helps to avoid naming conflicts and makes the code structure more clear.


    In contrast, the bad code example places all classes in the global namespace.
    This approach can lead to naming conflicts as the project grows and makes it harder
    to understand the logical structure of the code.


    Using namespaces allows for better code organization, improves readability, and
    helps prevent naming collisions in larger projects. It also enables the use of
    the same class name in different contexts (e.g., you could have both App\\Models\\User
    and App\\Entities\\User).


    <Memo>


    Namespaces were introduced in PHP 5.3.0 to help solve the problem of name clashes
    between code you create, and internal PHP classes/functions/constants or third-party
    classes/functions/constants.


    5


    # Use anonymous functions (closures) for compact, inline functionality


    * * *


    Anonymous functions in PHP provide a concise way to create inline, single-use
    functions.


    * * *


    The following code demonstrates the use of an anonymous function as a callback
    for array\_map():


    < Good Code >


    <?php


    // Using an anonymous function to square numbers in an array


    $numbers = \[1, 2, 3, 4, 5\];


    // Apply the anonymous function to each element


    $squared = array\_map(function($n) {


        return $n \* $n;


    }, $numbers);


    // Output: Array (  => 1  => 4  => 9  => 16  => 25 )


    print\_r($squared);


    ?>


    <Bad Code>


    <?php


    // Not using an anonymous function


    $numbers = \[1, 2, 3, 4, 5\];


    // Define a separate function


    function square($n) {


        return $n \* $n;


    }


    // Use the named function as a callback


    $squared = array\_map(''square'', $numbers);


    // Output: Array (  => 1  => 4  => 9  => 16  => 25 )


    print\_r($squared);


    ?>


    The good code example uses an anonymous function directly within array\_map(),
    making the code more compact and self-contained. The bad code defines a separate
    named function, which can clutter the global namespace and may be less readable
    for simple operations.


    <Memo>


    Anonymous functions were introduced in PHP 5.3 and are also known as closures.
    They can capture variables from the parent scope using the ''use'' keyword.


    6


    # Prefix interface names with ''I'' (e.g., ILogger)


    * * *


    Prefixing interface names with ''I'' is a naming convention that clearly distinguishes
    interfaces from classes.


    * * *


    The following code demonstrates the use of an ''I'' prefixed interface and its
    implementation:


    < Good Code >


    <?php


    // Interface name prefixed with ''I''


    interface ILogger {


        public function log($message);


    }


    // Class implementing the interface


    class FileLogger implements ILogger {


        public function log($message) {


            // Implementation details


            file\_put\_contents(''log.txt'', $message . PHP\_EOL, FILE\_APPEND);


        }


    }


    // Usage


    $logger = new FileLogger();


    $logger->log(''This is a log message.'');


    ?>


    <Bad Code>


    <?php


    // Interface without ''I'' prefix


    interface Logger {


        public function log($message);


    }


    // Class implementing the interface


    class FileLogger implements Logger {


        public function log($message) {


            // Implementation details


            file\_put\_contents(''log.txt'', $message . PHP\_EOL, FILE\_APPEND);


        }


    }


    // Usage


    $logger = new FileLogger();


    $logger->log(''This is a log message.'');


    ?>


    The good code example uses ''ILogger'' as the interface name, clearly indicating
    it''s an interface. This helps developers quickly distinguish between interfaces
    and concrete classes. The bad code example doesn''t use the ''I'' prefix, which
    might lead to confusion, especially in larger codebases.


    <Memo>


    While prefixing interfaces with ''I'' is common in some programming communities
    (especially those with a background in languages like C#), it''s not a universal
    standard in PHP. Some developers prefer not to use this convention, arguing that
    it adds unnecessary noise to the code.


    7


    # Use ''is'' prefix for boolean methods


    * * *


    Prefix boolean methods with ''is'' to improve code readability


    * * *


    The following code demonstrates the use of ''is'' prefix for boolean methods in
    PHP:


    < Good Code >


    class User {


        private $active;


        // Good: Method name clearly indicates it returns a boolean


        public function isActive(): bool {


            return $this->active;


        }


        // Usage


        public function performAction() {


            if ($this->isActive()) {


                // Perform action for active user


            }


        }


    }


    <Bad Code>


    class User {


        private $active;


        // Bad: Method name doesn''t clearly indicate it returns a boolean


        public function active(): bool {


            return $this->active;


        }


        // Usage


        public function performAction() {


            if ($this->active()) {


                // Is this checking if the user is active or doing something else?


            }


        }


    }


    In the good example, the method name ''isActive()'' clearly indicates that it
    returns a boolean value. This makes the code more readable and self-explanatory.
    In contrast, the bad example uses ''active()'', which could be mistaken for a
    method that performs an action rather than returning a state.


    <Memo>


    This naming convention is part of the broader concept of "Clean Code" and is commonly
    used in many object-oriented programming languages, not just PHP.


