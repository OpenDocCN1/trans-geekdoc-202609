- raw: '# Use intention-revealing names (e.g., getUsersByRole instead of getUsers)


    * * *


    Names should clearly indicate the purpose and behavior of the function or variable.


    * * *


    When naming functions and variables, it''s crucial to choose names that reveal
    the intention behind their use. This helps other developers quickly understand
    what the code is supposed to do without needing to read through the entire implementation.


    < Good Code >


    <?php


    // Good example: Using intention-revealing names


    // Function to get users by their role


    function getUsersByRole($role) {


        // Assume $db is a database connection


        global $db;


        $query = $db->prepare("SELECT \* FROM users WHERE role = :role");


        $query->bindParam('':role'', $role);


        $query->execute();


        return $query->fetchAll();


    }


    // Get all admin users


    $adminUsers = getUsersByRole(''admin'');


    foreach ($adminUsers as $user) {


        echo $user\[''name''\] . "<br>";


    }


    ?>


    <Bad Code>


    <?php


    // Bad example: Using non-descriptive names


    // Function to get users


    function getUsers($r) {


        // Assume $db is a database connection


        global $db;


        $query = $db->prepare("SELECT \* FROM users WHERE role = :role");


        $query->bindParam('':role'', $r);


        $query->execute();


        return $query->fetchAll();


    }


    // Get all admin users


    $admins = getUsers(''admin'');


    foreach ($admins as $u) {


        echo $u\[''name''\] . "<br>";


    }


    ?>


    In the good example, the function name getUsersByRole clearly indicates that the
    function retrieves users based on their role. This makes the code more understandable
    and maintainable. In the bad example, the function name getUsers is vague and
    does not provide enough context about what the function does, making it harder
    for other developers to understand its purpose.


    <Memo>


    Fun fact: Intention-revealing names are a key principle in the SOLID design principles,
    specifically under the Single Responsibility Principle (SRP). This principle states
    that a class or function should have only one reason to change, and clear naming
    helps achieve this by making the purpose of the code explicit.


    13


    # Avoid using similar names with different meanings


    * * *


    Use distinct and meaningful variable names to improve code readability.


    * * *


    The following code demonstrates the importance of using distinct variable names:


    < Good Code >


    // Good example: Using distinct and meaningful variable names


    function calculateTotalPrice($basePrice, $taxRate, $shippingCost) {


        // Calculate the tax amount


        $taxAmount = $basePrice \* ($taxRate / 100);


        // Calculate the total price including tax and shipping


        $totalPrice = $basePrice + $taxAmount + $shippingCost;


        return $totalPrice;


    }


    // Usage


    $finalPrice = calculateTotalPrice(100, 8, 5);


    echo "Total price: $" . $finalPrice;


    <Bad Code>


    // Bad example: Using similar names with different meanings


    function calc($price, $rate, $cost) {


        // Confusing variable names


        $p = $price \* ($rate / 100);


        $price = $price + $p + $cost;


        return $price;


    }


    // Usage


    $price = calc(100, 8, 5);


    echo "Price: $" . $price;


    In the good example, we use distinct and meaningful variable names like $basePrice,
    $taxRate, and $shippingCost. This makes the code more readable and self-explanatory.
    The bad example uses similar and vague names like $price and $p, which can lead
    to confusion and potential errors.


    <Memo>


    Using meaningful variable names is part of the "self-documenting code" principle,
    which aims to make code more understandable without extensive comments.


    14


    # Use opposite pairs consistently (e.g., start/stop, open/close)


    * * *


    Maintain consistency in naming conventions for opposite actions to enhance code
    clarity.


    * * *


    The following code illustrates the importance of using consistent opposite pairs
    in method names:


    < Good Code >


    // Good example: Using consistent opposite pairs


    class FileHandler {


        private $fileHandle;


        public function openFile($filename) {


            $this->fileHandle = fopen($filename, ''r'');


            echo "File opened successfully.\\n";


        }


        public function closeFile() {


            if ($this->fileHandle) {


                fclose($this->fileHandle);


                echo "File closed successfully.\\n";


            }


        }


        public function startProcessing() {


            echo "Starting file processing...\\n";


            // Processing logic here


        }


        public function stopProcessing() {


            echo "Stopping file processing...\\n";


            // Cleanup logic here


        }


    }


    // Usage


    $handler = new FileHandler();


    $handler->openFile(''example.txt'');


    $handler->startProcessing();


    $handler->stopProcessing();


    $handler->closeFile();


    <Bad Code>


    // Bad example: Inconsistent naming for opposite actions


    class FileHandler {


        private $file;


        public function initializeFile($filename) {


            $this->file = fopen($filename, ''r'');


            echo "File initialized.\\n";


        }


        public function endFile() {


            if ($this->file) {


                fclose($this->file);


                echo "File ended.\\n";


            }


        }


        public function beginOperation() {


            echo "Beginning operation...\\n";


            // Processing logic here


        }


        public function finish() {


            echo "Finishing...\\n";


            // Cleanup logic here


        }


    }


    // Usage


    $handler = new FileHandler();


    $handler->initializeFile(''example.txt'');


    $handler->beginOperation();


    $handler->finish();


    $handler->endFile();


    The good example uses consistent opposite pairs like openFile/closeFile and startProcessing/stopProcessing.
    This makes the code more intuitive and easier to understand. The bad example uses
    inconsistent terms like initializeFile/endFile and beginOperation/finish, which
    can lead to confusion about the intended actions.


    <Memo>


    Consistent naming conventions are a key aspect of the "principle of least astonishment"
    in software design, which states that a component of a system should behave in
    a way that users expect it to behave.


    15


    # Meaningful and Distinct Naming


    * * *


    Use clear, descriptive names for variables, functions, and classes to enhance
    code readability.


    * * *


    The following example demonstrates the importance of using distinct and meaningful
    names in PHP code:


    < Good Code >


    // Good example: Clear and distinct naming


    class UserAuthenticationController


    {


        public function authenticateUserCredentials($username, $password)


        {


            // Authentication logic here


        }


        public function validateUserInput($input)


        {


            // Input validation logic here


        }


    }


    $authController = new UserAuthenticationController();


    $authController->authenticateUserCredentials(''john\_doe'', ''secure\_password'');


    <Bad Code>


    // Bad example: Names that vary in small ways


    class XYZControllerForEfficientHandlingOfStrings


    {


        public function XYZControllerForEfficientHandlingOfStringsFunction($x, $y)


        {


            // Authentication logic here


        }


        public function XYZControllerForEfficientHandlingOfStringsValidation($z)


        {


            // Input validation logic here


        }


    }


    $c = new XYZControllerForEfficientHandlingOfStrings();


    $c->XYZControllerForEfficientHandlingOfStringsFunction(''a'', ''b'');


    In the good example, we use clear and distinct names for the class (UserAuthenticationController)
    and its methods (authenticateUserCredentials, validateUserInput). This makes the
    code''s purpose immediately apparent.


    In the bad example, we use long, repetitive names that don''t clearly convey the
    purpose of the class or methods. The variable names are also non-descriptive (x,
    y, z), making it hard to understand what data they represent.


    <Memo>


    The concept of using meaningful names is part of the "Clean Code" philosophy,
    popularized by Robert C. Martin in his book of the same name.


    16


    # Strict Types Declaration


    * * *


    Use strict\_types declaration to enable stricter type checking in PHP, reducing
    potential type-related errors.


