    \ = []) {\n        $this->settings = $initialSettings;\n    }\n    // Method to\
    \ get a setting\n    public function getSetting($key) {\n        return $this->settings[$key]\
    \ ?? null;\n    }\n    // Method to set a setting\n    public function setSetting($key,\
    \ $value) {\n        $this->settings[$key] = $value;\n    }\n}\n\n// Usage of\
    \ final class\n$config = new Configuration(['debug' => true]);\necho $config->getSetting('debug');\
    \ // Outputs: 1 (true)\n```\n\n### Bad Code\n\n```php\n// Bad example: Not using\
    \ final class\nclass Configuration {\n    protected $settings = [];\n\n    //\
