    \        return 'Guest';\n    }\n}\n\n// Usage\n$user1 = ['name' => 'John'];\n\
    $user2 = [];\necho getUserName($user1); // Outputs: John\necho getUserName($user2);\
    \ // Outputs: Guest\n```\n\nThe good code uses the null coalescing operator (`??`)\
    \ to concisely check if `$user['name']` is set and not null. The bad code uses\
    \ a verbose `if-else` block to achieve the same result.\n\n<Memo>\nThe null coalescing\
    \ operator (`??`) was introduced in PHP 7.0.\n</Memo>\n\n33\n\n# Implement `invoke()`\
    \ method for callable\n\nThe `invoke()` method allows an object to be called as\
    \ a function.\n\nThe `invoke()` method in PHP enables objects to be used.\n\n\
    < Good Code >\n```php\n<?php\nclass Greeter {\n    private $greeting;\n\n    public\
    \ function __construct($greeting) {\n        $this->greeting = $greeting;\n  \
    \  }\n\n    public function __invoke($name) {\n        return $this->greeting\
    \ . ', ' . $name;\n    }\n}\n\n$greeter = new Greeter('Hello');\necho $greeter('World');\
    \ // Outputs: Hello, World\n```\n<Bad Code>\n```php\n<?php\nclass Greeter {\n\
    \    private $greeting;\n\n    public function __construct($greeting) {\n    \
    \    $this->greeting = $greeting;\n    }\n\n    public function greet($name) {\n\
    \        return $this->greeting . ', ' . $name;\n    }\n}\n\n$greeter = new Greeter('Hello');\n\
    echo $greeter->greet('World'); // Outputs: Hello, World\n```\n\nThe good code\
    \ uses the `__invoke()` method to allow the object to be called like a function.\
    \ The bad code uses a named `greet()` method, which is less flexible.\n\n<Memo>\n\
    The `__invoke()` method was introduced in PHP 5.5.\n</Memo>\n\n34\n\n# Use `yield\
    \ from` for nested generators\n\nThe `yield from` expression simplifies working\
    \ with nested generators.\n\n`yield from` allows you to delegate yielding values\
    \ to another generator, making the code cleaner.\n\n< Good Code >\n```php\n<?php\n\
    function innerGenerator() {\n    yield 1;\n    yield 2;\n    yield 3;\n}\n\nfunction\
    \ outerGenerator() {\n    yield from innerGenerator();\n}\n\nforeach (outerGenerator()\
    \ as $value) {\n    echo $value . ' ';\n} // Outputs: 1 2 3 \n```\n<Bad Code>\n\
    ```php\n<?php\nfunction innerGenerator() {\n    yield 1;\n    yield 2;\n    yield\
    \ 3;\n}\n\nfunction outerGenerator() {\n    foreach (innerGenerator() as $value)\
    \ {\n        yield $value;\n    }\n}\n\nforeach (outerGenerator() as $value) {\n\
    \    echo $value . ' ';\n} // Outputs: 1 2 3 \n```\n\nThe good example uses `yield\
    \ from` to delegate the process to `innerGenerator()`. The bad example uses a\
    \ `foreach` loop to manually yield values, which is more verbose.\n\n<Memo>\n\
    The `yield from` expression was introduced in PHP 7.0 to simplify nested iterables.\n\
    </Memo>\n\n35\n\n# Employ array unpacking for merging arrays\n\nUse the spread\
    \ operator (`...`) to merge arrays efficiently in PHP 7.4+.\n\nThe following code\
