        }


    }


    // Usage


    $order = new Order();


    if ($order->isEligibleForDiscount()) {


        // Apply discount


    }


    The good code example extracts the complex condition into a well-named method
    isEligibleForDiscount(). It further breaks down the condition into two separate
    methods: hasMinimumItems() and exceedsMinimumAmount(). This approach makes the
    code more readable and self-explanatory.


    The bad code example, while shorter, combines multiple conditions in a single
    line, making it harder to understand at a glance and potentially more difficult
    to maintain or modify in the future.


    <Memo>


    This technique is often referred to as "Extract Method" and is one of the refactoring
    patterns described by Martin Fowler in his book "Refactoring: Improving the Design
    of Existing Code".


