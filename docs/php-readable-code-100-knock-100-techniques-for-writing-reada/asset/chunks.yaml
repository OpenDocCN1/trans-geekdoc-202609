    # Implement the strategy pattern for interchangeable algorithms


    * * *


    The strategy pattern is a design pattern that enables selecting an algorithm''s
    behavior at runtime. It defines a family of algorithms, encapsulates each one,
    and makes them interchangeable.


    * * *


    Using the strategy pattern in PHP allows you to define a family of algorithms,
    encapsulate each one, and make them interchangeable. This pattern lets the algorithm
    vary independently from clients that use it, promoting flexibility and code reuse.


    < Good Code >


    <?php


    // Strategy interface


    interface PaymentStrategy {


        public function pay($amount);


    }


    // Concrete strategy for Credit Card payment


    class CreditCardPayment implements PaymentStrategy {


        public function pay($amount) {


            echo "Paying $amount using Credit Card";


        }


    }


    // Concrete strategy for PayPal payment


    class PayPalPayment implements PaymentStrategy {


        public function pay($amount) {


            echo "Paying $amount using PayPal";


        }


    }


    // Context class


    class ShoppingCart {


        private $paymentStrategy;


        public function \_\_construct(PaymentStrategy $paymentStrategy) {


            $this->paymentStrategy = $paymentStrategy;


        }


        public function checkout($amount) {


            $this->paymentStrategy->pay($amount);


        }


    }


    // Client code


    $cart = new ShoppingCart(new CreditCardPayment());


    $cart->checkout(100); // Output: Paying 100 using Credit Card


    $cart = new ShoppingCart(new PayPalPayment());


    $cart->checkout(200); // Output: Paying 200 using PayPal


    ?>


    <Bad Code>


    <?php


    // Direct implementation without strategy pattern


    class ShoppingCart {


        public function checkout($amount, $paymentType) {


            if ($paymentType == ''credit\_card'') {


                echo "Paying $amount using Credit Card";


            } elseif ($paymentType == ''paypal'') {


                echo "Paying $amount using PayPal";


            }


        }


    }


    // Client code


    $cart = new ShoppingCart();


    $cart->checkout(100, ''credit\_card''); // Output: Paying 100 using Credit Card


    $cart->checkout(200, ''paypal''); // Output: Paying 200 using PayPal


    ?>


    In the good example, the strategy pattern is used to encapsulate the payment algorithms,
    making them interchangeable and promoting code reuse. The context class (ShoppingCart)
    is not aware of the specific payment method being used, which makes the code more
    flexible and easier to maintain. In the bad example, the payment logic is hardcoded
    within the checkout method, making it less flexible and harder to maintain as
    any change in the payment logic would require changes in the ShoppingCart class.


    <Memo>


    The strategy pattern is also part of the "Gang of Four" design patterns. It is
    particularly useful in scenarios where multiple algorithms are applicable to a
    problem, and the best algorithm to use might vary depending on the context.


    101


    # Use the observer pattern for loose coupling between objects


    * * *


    Implement the observer pattern to create a flexible system where objects can subscribe
    to and receive updates from a subject without tight coupling.


    * * *


    The following code demonstrates the implementation of the observer pattern in
    PHP, showing a Subject class and an Observer interface.


    < Good Code >


    // Subject class


    class Newsletter {


        private $observers = \[\];


        private $content;


        // Method to attach an observer


        public function attach(Subscriber $observer) {


            $this->observers\[\] = $observer;


        }


        // Method to set content and notify observers


        public function setContent($content) {


            $this->content = $content;


            $this->notify();


        }


        // Method to notify all observers


        private function notify() {


            foreach ($this->observers as $observer) {


                $observer->update($this->content);


            }


        }


    }


    // Observer interface


    interface Subscriber {


        public function update($content);


    }


    // Concrete observer


    class EmailSubscriber implements Subscriber {


        private $email;


        public function \_\_construct($email) {


            $this->email = $email;


        }


        public function update($content) {


            // Send email with new content


            echo "Sending email to {$this->email} with content: {$content}\\n";


        }


    }


    // Usage


    $newsletter = new Newsletter();


    $subscriber1 = new EmailSubscriber("user1@example.com");


    $subscriber2 = new EmailSubscriber("user2@example.com");


    $newsletter->attach($subscriber1);


    $newsletter->attach($subscriber2);


    $newsletter->setContent("New article published!");


    <Bad Code>


    class Newsletter {


        public $subscribers = \[\];


        public $content;


        function addSubscriber($email) {


            $this->subscribers\[\] = $email;


        }


        function setContent($c) {


            $this->content = $c;


            $this->sendEmails();


        }


        function sendEmails() {


            foreach ($this->subscribers as $s) {


                // Directly send email here


                echo "Sending to $s: $this->content\\n";


            }


        }


    }


    $n = new Newsletter();


    $n->addSubscriber("user1@example.com");


    $n->addSubscriber("user2@example.com");


    $n->setContent("New article!");


    The good code example implements the observer pattern correctly. It defines a
    Subject (Newsletter) and an Observer interface (Subscriber). The Newsletter class
    manages a list of observers and notifies them when the content changes. The EmailSubscriber
    class implements the Subscriber interface and handles the update. This approach
    allows for loose coupling and easy extension.


    The bad code example doesn''t use the observer pattern. It directly manages subscribers
    as email addresses and sends emails within the Newsletter class. This approach
    tightly couples the notification logic with the Newsletter class, making it harder
    to extend or modify the system.


    <Memo>


    The observer pattern is one of the behavioral design patterns and is also known
    as the publish-subscribe pattern. It''s widely used in event-driven programming
    and graphical user interface (GUI) frameworks.


    102


