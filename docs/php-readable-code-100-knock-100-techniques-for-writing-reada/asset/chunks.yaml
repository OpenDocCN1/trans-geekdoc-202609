- raw: 'Union types allow specifying multiple possible types for a parameter or return
    value, enhancing code clarity and type safety.


    * * *


    The following code demonstrates the use of union types in PHP 8.0+ to improve
    type hinting:


    < Good Code >


    /\*\*


    \* Calculate the total price of an order


    \*


    \* @param array $items Array of order items


    \* @param float|int $taxRate Tax rate as a decimal or percentage


    \* @return float Total price including tax


    \*/


    function calculateTotalPrice(array $items, float|int $taxRate): float


    {


        $subtotal = array\_sum(array\_column($items, ''price''));


        // Convert percentage to decimal if necessary


        $taxRateDecimal = $taxRate > 1 ? $taxRate / 100 : $taxRate;


        $taxAmount = $subtotal \* $taxRateDecimal;


        $total = $subtotal + $taxAmount;


        return round($total, 2);


    }


    // Usage examples


    $orderItems = \[


        \[''name'' => ''Widget A'', ''price'' => 10.99\],


        \[''name'' => ''Widget B'', ''price'' => 15.50\],


    \];


    echo calculateTotalPrice($orderItems, 0.08);  // Tax rate as decimal


    echo calculateTotalPrice($orderItems, 8);     // Tax rate as percentage


    <Bad Code>


    function calculateTotalPrice($items, $taxRate)


    {


        $t = 0;


        foreach ($items as $i) {


            $t += $i\[''price''\];


        }


        return $t + $t \* ($taxRate > 1 ? $taxRate / 100 : $taxRate);


    }


    $orderItems = \[


        \[''name'' => ''Widget A'', ''price'' => 10.99\],


        \[''name'' => ''Widget B'', ''price'' => 15.50\],


    \];


    echo calculateTotalPrice($orderItems, 0.08);


    echo calculateTotalPrice($orderItems, 8);


    The good code example uses union types (float|int) for the $taxRate parameter,
    allowing it to accept both decimal and percentage values. It also includes a detailed
    docblock, descriptive variable names, and clear logic. The bad code lacks type
    hinting, uses ambiguous variable names, and has less readable logic.


    <Memo>


    Union types were introduced in PHP 8.0, providing a way to specify multiple possible
    types for a single parameter or return value.


