    \n// Usage\n$userRepo = $container->resolve('userRepository');\necho $userRepo->findUser(1);\n\
    ```\n\n### <Bad Code>\n\n```php\n// No dependency injection, hard-coded dependencies\n\
    class Database {\n    private $connection;\n    public function __construct()\
