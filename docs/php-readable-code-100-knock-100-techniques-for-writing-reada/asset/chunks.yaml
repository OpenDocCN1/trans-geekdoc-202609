- raw: 'The match expression provides a more concise syntax compared to the switch
    statement. It automatically returns the result of the matched expression, eliminating
    the need for break statements. The match expression also performs strict comparisons
    by default, reducing potential bugs. The good example demonstrates cleaner, more
    readable code that achieves the same functionality as the switch statement in
    the bad example.


    <Memo>


    Match expressions were introduced in PHP 8.0 and are inspired by similar constructs
    in languages like Rust and Ruby.


