    # Implement \_\_serialize and \_\_unserialize for custom object serialization


    * * *


    Using \_\_serialize and \_\_unserialize magic methods allows for more control
    over object serialization and deserialization processes.


    * * *


    The following code demonstrates how to implement \_\_serialize and \_\_unserialize
    methods for custom object serialization:


    < Good Code >


    /\*\*


    \* Represents a user in the system


    \*/


    class User


    {


        private string $username;


        private string $email;


        private array $preferences;


        public function \_\_construct(string $username, string $email)


        {


            $this->username = $username;


            $this->email = $email;


            $this->preferences = \[\];


        }


        /\*\*


         \* Custom serialization method


         \*


         \* @return array


         \*/


        public function \_\_serialize(): array


        {


            return \[


                ''username'' => $this->username,


                ''email'' => $this->email,


                ''preferences'' => $this->preferences,


            \];


        }


        /\*\*


         \* Custom unserialization method


         \*


         \* @param array $data


         \*/


        public function \_\_unserialize(array $data): void


        {


            $this->username = $data\[''username''\];


            $this->email = $data\[''email''\];


            $this->preferences = $data\[''preferences''\] ?? \[\];


        }


        // Other methods...


    }


    // Usage


    $user = new User(''johndoe'', ''john@example.com'');


    $serialized = serialize($user);


    $unserialized = unserialize($serialized);


    var\_dump($unserialized);


    <Bad Code>


    class User


    {


        public $u;


        public $e;


        private $p;


        function \_\_construct($u, $e)


        {


            $this->u = $u;


            $this->e = $e;


            $this->p = \[\];


        }


    }


    $user = new User(''johndoe'', ''john@example.com'');


    $s = serialize($user);


    $u = unserialize($s);


    var\_dump($u);


    The good code example implements \_\_serialize and \_\_unserialize methods, providing
    control over which properties are serialized and how they are reconstructed. It
    uses clear property names and includes type declarations. The bad code relies
    on PHP''s default serialization, which may expose internal properties and doesn''t
    handle complex objects well.


    <Memo>


    The \_\_serialize and \_\_unserialize magic methods were introduced in PHP 7.4
    as a more efficient alternative to the older Serializable interface.


