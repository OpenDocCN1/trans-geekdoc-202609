    \ PHP 的默认序列化，可能会暴露内部属性且无法很好处理复杂对象。\n\n**备忘**\n`__serialize` 和 `__unserialize`\
    \ 魔法方法在 PHP 7.4 中引入，作为旧 `Serializable` 接口更高效的替代方案。\n\n# 使用 Reflection API 进行动态代码分析\n\
