    $motorcycle = new Motorcycle(\"Honda\", \"CBR\");\necho $motorcycle->getInfo();\n\
    ```\n\n良好的代码示例使用抽象的 `Vehicle` 类来定义共享属性和方法。这减少了代码重复并强制了一致的结构。`getType()` 方法被声明为抽象，确保每个子类都实现了它。相比之下，糟糕的代码在\
    \ `Car` 和 `Motorcycle` 类中重复了代码，导致了维护问题并违反了 DRY（不要重复自己）原则。\n\n<Memo>\n\nPHP 中的抽象类是在\
    \ 2004 年 7 月发布的 PHP 5.0 中引入的。\n\n98\n\n# 使用依赖注入容器创建对象\n\n实现一个依赖注入容器来管理对象的创建和依赖。\n\
    \n以下代码演示了如何使用依赖注入容器来管理对象的创建和依赖。\n\n### < Good Code >\n\n```php\n// 简单的注入容器\nclass\
