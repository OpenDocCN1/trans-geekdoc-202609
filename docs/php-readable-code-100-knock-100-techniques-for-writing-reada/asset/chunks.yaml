    # Implement iterators for custom object traversal


    * * *


    Implementing the Iterator interface allows custom objects to be easily traversed
    in foreach loops.


    * * *


    The following code demonstrates how to implement an iterator for a custom object:


    < Good Code >


    // Good example implementing Iterator interface


    class MyCollection implements Iterator {


        private $items = \[\];


        private $position = 0;


        public function \_\_construct(array $items) {


            $this->items = $items;


        }


        // Required Iterator methods


        public function current() {


            return $this->items\[$this->position\];


        }


        public function key() {


            return $this->position;


        }


        public function next() {


            ++$this->position;


        }


        public function rewind() {


            $this->position = 0;


        }


        public function valid() {


            return isset($this->items\[$this->position\]);


        }


    }


    // Usage


    $collection = new MyCollection(\[''apple'', ''banana'', ''cherry''\]);


    foreach ($collection as $key => $value) {


        echo "$key: $value\\n";


    }


    <Bad Code>


    // Bad example without implementing Iterator


    class MyCollection {


        private $items = \[\];


        public function \_\_construct(array $items) {


            $this->items = $items;


        }


        public function getItems() {


            return $this->items;


        }


    }


    // Usage


    $collection = new MyCollection(\[''apple'', ''banana'', ''cherry''\]);


    $items = $collection->getItems();


    foreach ($items as $key => $value) {


        echo "$key: $value\\n";


    }


    The good example implements the Iterator interface, allowing the object to be
    directly used in a foreach loop. This approach encapsulates the iteration logic
    within the class, promoting better object-oriented design. The bad example exposes
    the internal array, which breaks encapsulation and requires additional steps to
    iterate over the items. Implementing Iterator makes the code more intuitive and
    easier to use, especially when working with complex custom objects.


    <Memo>


    PHP''s Iterator interface is part of the Standard PHP Library (SPL) and provides
    a standardized way to make objects traversable.


    51


    # Use type declarations for class properties


    * * *


    Enhance code readability and maintainability by using type declarations for class
    properties in PHP.


    * * *


    The following code demonstrates the use of type declarations for class properties
    in PHP 7.4 and later versions:


    < Good Code >


    class User {


        // Declare public properties with type hints


        public string $name;


        public int $age;


        public ?string $email; // Nullable string type


        // Constructor with type-hinted parameters


        public function \_\_construct(string $name, int $age, ?string $email = null)
    {


            $this->name = $name;


            $this->age = $age;


            $this->email = $email;


        }


        // Method with type-hinted return value


        public function getInfo(): string {


            return "Name: {$this->name}, Age: {$this->age}";


        }


    }


    // Usage


    $user = new User("John Doe", 30, "john@example.com");


    echo $user->getInfo(); // Outputs: Name: John Doe, Age: 30


    <Bad Code>


    class User {


        // Properties without type declarations


        public $name;


        public $age;


        public $email;


        // Constructor without type hints


        public function \_\_construct($name, $age, $email = null) {


            $this->name = $name;


            $this->age = $age;


            $this->email = $email;


        }


        // Method without return type declaration


        public function getInfo() {


            return "Name: " . $this->name . ", Age: " . $this->age;


        }


    }


    // Usage


    $user = new User("John Doe", "30", "john@example.com");


    echo $user->getInfo(); // Outputs: Name: John Doe, Age: 30


    The good code example uses type declarations for class properties, constructor
    parameters, and method return types. This approach provides several benefits:


    Improved code readability: Developers can quickly understand the expected data
    types.


    Enhanced IDE support: IDEs can offer better code completion and error detection.


    Reduced bugs: PHP will throw a TypeError if an incompatible value is assigned.


    Self-documenting code: Type declarations serve as built-in documentation.


    The bad code example lacks type declarations, making it more prone to errors and
    harder to understand at a glance.


    <Memo>


    Property type declarations were introduced in PHP 7.4, further improving PHP''s
    type system and code quality.


    52


    # Employ arrow functions for short, single-expression closures


    * * *


    Use arrow functions to write more concise and readable code for simple, single-expression
    closures in PHP.


    * * *


    The following code demonstrates the use of arrow functions for short, single-expression
    closures in PHP 7.4 and later:


    < Good Code >


    // Using arrow function for array\_map


    $numbers = \[1, 2, 3, 4, 5\];


    $squared = array\_map(fn($n) => $n \* $n, $numbers);


    print\_r($squared); // Outputs: Array ( \[0\] => 1 \[1\] => 4 \[2\] => 9 \[3\]
    => 16 \[4\] => 25 )


    // Using arrow function with use keyword


    $multiplier = 3;


    $tripled = array\_map(fn($n) => $n \* $multiplier, $numbers);


    print\_r($tripled); // Outputs: Array ( \[0\] => 3 \[1\] => 6 \[2\] => 9 \[3\]
    => 12 \[4\] => 15 )


    // Arrow function in usort


    $fruits = \[''apple'', ''banana'', ''cherry''\];


    usort($fruits, fn($a, $b) => strlen($b) - strlen($a));


    print\_r($fruits); // Outputs: Array ( \[0\] => banana \[1\] => cherry \[2\] =>
    apple )


    <Bad Code>


    // Using traditional anonymous function for array\_map


    $numbers = \[1, 2, 3, 4, 5\];


    $squared = array\_map(function($n) {


        return $n \* $n;


    }, $numbers);


    print\_r($squared);


    // Using anonymous function with use keyword


    $multiplier = 3;


    $tripled = array\_map(function($n) use ($multiplier) {


        return $n \* $multiplier;


    }, $numbers);


    print\_r($tripled);


    // Anonymous function in usort


    $fruits = \[''apple'', ''banana'', ''cherry''\];


    usort($fruits, function($a, $b) {


        return strlen($b) - strlen($a);


    });


    print\_r($fruits);


    The good code example uses arrow functions, which offer several advantages:


    Conciseness: Arrow functions are more compact, reducing boilerplate code.


    Improved readability: The shorter syntax makes the code easier to scan and understand.


    Implicit return: For single expressions, the return keyword is not needed.


    Automatic variable inheritance: Variables from the parent scope are available
