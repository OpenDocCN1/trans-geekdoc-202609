        public $name;


        public function getEmail() {


            return ''user@example.com'';


        }


    }


    $user = null;


    // Unsafe property access


    if ($user !== null && isset($user->name)) {


        $name = $user->name;


    } else {


        $name = ''Unknown'';


    }


    echo "Name: " . $name . "\\n";


    // Unsafe method call


    if ($user !== null && method\_exists($user, ''getEmail'')) {


