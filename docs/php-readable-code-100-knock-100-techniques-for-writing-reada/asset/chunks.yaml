    # Use finally blocks for cleanup operations


    * * *


    Implement finally blocks to ensure resource cleanup, regardless of exceptions.


    * * *


    The following code demonstrates the use of a finally block for proper file handling
    in PHP:


    < Good Code >


    <?php


    // Good example: Using a finally block for cleanup


    try {


        // Open a file


        $file = fopen(''example.txt'', ''r'');


        // Perform operations on the file


        $content = fread($file, filesize(''example.txt''));


        // Process the content


        echo "File content: " . $content;


    } catch (Exception $e) {


        // Handle any exceptions


        echo "An error occurred: " . $e->getMessage();


    } finally {


        // Ensure the file is closed, regardless of exceptions


        if (isset($file) && is\_resource($file)) {


            fclose($file);


            echo "File closed successfully.";


        }


    }


    ?>


    <Bad Code>


    <?php


    // Bad example: Not using a finally block


    $file = fopen(''example.txt'', ''r'');


    try {


        // Perform operations on the file


        $content = fread($file, filesize(''example.txt''));


        // Process the content


        echo "File content: " . $content;


        // Close the file


        fclose($file);


    } catch (Exception $e) {


        // Handle any exceptions


        echo "An error occurred: " . $e->getMessage();


        // Attempt to close the file, but may not always execute


        if (is\_resource($file)) {


            fclose($file);


        }


    }


    ?>


    The good code example uses a finally block to ensure that the file is always closed,
    regardless of whether an exception occurs or not. This prevents resource leaks
    and follows best practices for resource management.


    The bad code example attempts to close the file in both the try and catch blocks,
    which can lead to duplicate code and potential oversight if the developer forgets
    to add the cleanup code in all necessary places.


    <Memo>


    The finally block was introduced in PHP 5.5 and is part of the exception handling
    mechanism, providing a way to execute code regardless of whether an exception
    was thrown or caught.


