    \ = getUserDetails();\n\n// 使用赋值后的变量\necho \"Name: $name, Age: $age, Email: $email\"\
    ;\n```\n\n### < 坏的代码>\n```php\n// 返回用户详情数组的函数\nfunction getUserDetails() {\n \
    \   return ['John Doe', 30, 'john@example.com'];\n}\n\n// 逐个赋值\n$userDetails =\
    \ getUserDetails();\n$name = $userDetails[0];\n$age = $userDetails[1];\n$email\
    \ = $userDetails[2];\n\n// 使用赋值后的变量\necho \"Name: $name, Age: $age, Email: $email\"\
    ;\n```\n\n良好的代码示例使用数组解构在单行内为多个变量赋值，使代码更加简洁且易于读。坏的代码示例逐个赋值每个变量，这过于冗长，并且当数组结构发生变化时容易出错。\n\
    \n### < 备忘 >\n数组解构是在 PHP 7.1 中引入的，提供了一种将数组拆分为独立变量的方便方法。\n\n75\n\n# 使用空合并赋值运算符\
    \ (??=) 实现简洁的默认赋值\n\n在 PHP 7.4+ 中使用 `??=` 高效地分配默认值。\n\n以下代码演示了如何使用空合并赋值运算符 (`??=`)\
    \ 为变量设置默认值：\n\n### < 良好的代码 >\n```php\n// 使用空合并赋值运算符的良好代码\nfunction getUserSettings($userId)\
    \ {\n    $settings = fetchUserSettings($userId);\n    // 使用 ??= 设置默认值\n    $settings['theme']\
    \ ??= 'light';\n    $settings['notifications'] ??= true;\n    $settings['language']\
    \ ??= 'en';\n    return $settings;\n}\n```\n\n### < 坏的代码>\n```php\n// 未使用空合并赋值运算符的坏代码\n\
    function getUserSettings($userId) {\n    $settings = fetchUserSettings($userId);\n\
    \    // 使用传统方法设置默认值\n    if (!isset($settings['theme'])) {\n        $settings['theme']\
    \ = 'light';\n    }\n    if (!isset($settings['notifications'])) {\n        $settings['notifications']\
    \ = true;\n    }\n    if (!isset($settings['language'])) {\n        $settings['language']\
    \ = 'en';\n    }\n    return $settings;\n}\n```\n\n良好的代码示例使用 `??=` 简洁地为键设置默认值。该运算符仅在左侧变量为\
    \ null 或不存在时才分配右侧的值。与使用传统 `if` 语句的坏代码相比，它更具可读性并减少了代码行数。\n\n### < 备忘 >\n空合并赋值运算符\
    \ (`??=`) 在 PHP 7.4 中引入的，作为检查并分配默认值常用模式的简写。\n\n76\n\n# 将配置提取到单独的文件\n\n通过将配置与逻辑分离提高可维护性。\n\
    \n以下示例展示了如何将设置提取到单独的文件：\n\n### < 良好的代码 >\n```php\n// config.php\nreturn [\n  \
    \  'database' => [\n        'host' => 'localhost',\n        'username' => 'user',\n\
    \        'password' => 'password',\n        'dbname' => 'myapp'\n    ],\n    'api_key'\
    \ => 'your_api_key_here',\n    'debug_mode' => true\n];\n\n// main.php\n$config\
    \ = require 'config.php';\n// 使用配置\n$dbHost = $config['database']['host'];\n$apiKey\
    \ = $config['api_key'];\n```\n\n### < 坏的代码>\n```php\n// 坏做法：将配置与应用逻辑混合\n$dbHost\
    \ = 'localhost';\n$dbUsername = 'user';\n$dbPassword = 'password';\n$apiKey =\
    \ 'your_api_key_here';\n$debugMode = true;\n\n// 应用逻辑\nfunction connectToDatabase()\
    \ {\n    global $dbHost, $dbUsername, $dbPassword;\n    // 此处进行数据库连接\n}\n\nfunction\
    \ makeApiCall() {\n    global $apiKey;\n    // 此处调用 API\n}\n```\n\n良好的代码示例将配置分离到专用的\
    \ `config.php` 中，该文件返回一个设置数组。这种方法使得在不修改主应用代码的情况下，更容易管理和更新配置。坏的代码将配置直接与应用逻辑混合，使得在整个应用程序中维护和更新设置变得困难。\n\
    \n### < 备忘 >\n将配置与代码分离是 12 要素应用方法中的核心原则，该方法旨在构建可扩展和可维护的软件服务（SaaS）应用。\n\n77\n\n\
    # 将工具函数移动到单独的类或命名空间\n\n将工具函数组织到专用的类或命名空间中，以提高代码的可读性和维护性。\n\n工具函数通常应用于应用的多个部分。通过将它们移动到单独类或命名空间，你可以保持代码库的整洁和模块化，便于他人理解和维护。\n\
    \n### < 良好的代码 >\n```php\n<?php\nnamespace App\\Utils;\n\n/**\n * 通用函数的工具类\n */\n\
    class StringUtils {\n    /**\n     * 将字符串转换为驼峰式\n     *\n     * @param string\
    \ $string\n     * @return string\n     */\n    public static function toCamelCase(string\
    \ $string): string {\n        $result = strtolower($string);\n        preg_match_all('/[a-zA-Z0-9]+/',\
    \ $result, $matches);\n        $result = $matches[0][0];\n        for ($i = 1;\
    \ $i < count($matches[0]); $i++) {\n            $result .= ucfirst($matches[0][$i]);\n\
    \        }\n        return $result;\n    }\n}\n\n// 使用\necho App\\Utils\\StringUtils::toCamelCase('hello_world');\
    \ // 输出：helloWorld\n?>\n```\n\n### < 坏的代码>\n```php\n<?php\n/**\n * 将字符串转换为驼峰式\n\
    \ *\n * @param string $string\n * @return string\n */\nfunction toCamelCase($string)\
    \ {\n    $result = strtolower($string);\n    preg_match_all('/[a-zA-Z0-9]+/',\
    \ $result, $matches);\n    $result = $matches[0][0];\n    for ($i = 1; $i < count($matches[0]);\
    \ $i++) {\n        $result .= ucfirst($matches[0][$i]);\n    }\n    return $result;\n\
    }\n\n// 使用\necho toCamelCase('hello_world'); // 输出：helloWorld\n?>\n```\n\n在良好的示例中，工具函数\
    \ `toCamelCase` 被封装在 `App\\Utils` 命名空间的 `StringUtils` 类中。这种组织方式使工具函数的位置清晰并避免了命名冲突。在坏示例中，函数定义在全局作用域，这会导致大型代码库变得混乱。\n\
    \n### < 备忘 >\nPHP 命名空间是在 5.3 版本引入的，有助于避免冲突并将代码组织成逻辑组。\n\n78\n\n"
