    # Use ''able'' suffix for classes implementing capabilities


    * * *


    Append ''able'' to class names that implement specific capabilities or behaviors.


    * * *


    The following code demonstrates the use of the ''able'' suffix in class naming
    for better readability and understanding of class capabilities.


    < Good Code >


    // Good example: Using ''able'' suffix for classes implementing capabilities


    // Interface defining sortable behavior


    interface Sortable {


        public function sort(): array;


    }


    // Class implementing the Sortable interface


    class SortableList implements Sortable {


        private $items = \[\];


        public function \_\_construct(array $items) {


            $this->items = $items;


        }


        // Implementation of the sort method


        public function sort(): array {


            sort($this->items);


            return $this->items;


        }


    }


    // Usage


    $list = new SortableList(\[3, 1, 4, 1, 5, 9\]);


    $sortedList = $list->sort();


    print\_r($sortedList);


    <Bad Code>


    // Bad example: Not using ''able'' suffix for classes implementing capabilities


    // Interface without clear naming convention


    interface DoSort {


        public function performSort(): array;


    }


    // Class with unclear naming


    class ListThing implements DoSort {


        private $stuff = \[\];


        public function \_\_construct(array $stuff) {


            $this->stuff = $stuff;


        }


        // Unclear method name


        public function performSort(): array {


            sort($this->stuff);


            return $this->stuff;


        }


    }


    // Usage


    $thing = new ListThing(\[3, 1, 4, 1, 5, 9\]);


    $sortedStuff = $thing->performSort();


    print\_r($sortedStuff);


    The good example uses the ''able'' suffix in both the interface (Sortable) and
    the implementing class (SortableList). This naming convention immediately conveys
    the capability of the class. The method names are also clear and consistent (sort()).


    In contrast, the bad example uses unclear names like ''DoSort'' and ''ListThing'',
    which don''t effectively communicate the purpose or capabilities of the interface
    and class. The method name ''performSort()'' is also less intuitive than simply
    ''sort()''.


    <Memo>


    The ''able'' suffix is commonly used in object-oriented programming across various
    languages, not just PHP. It''s part of a broader naming convention that helps
    developers quickly understand a class''s purpose or capabilities.


    10


    # Prefix private methods with an underscore


    * * *


    Use an underscore prefix for private methods to visually distinguish them from
    public methods.


    * * *


    The following code examples demonstrate the use of underscore prefixes for private
    methods to improve code readability and method visibility understanding.


    < Good Code >


    // Good example: Using underscore prefix for private methods


    class UserManager {


        private $users = \[\];


        public function addUser(string $username, string $email): void {


            if ($this->\_isValidEmail($email)) {


                $this->users\[\] = \[


                    ''username'' => $username,


                    ''email'' => $email


                \];


                $this->\_notifyAdmin($username);


            }


        }


        // Private method with underscore prefix


        private function \_isValidEmail(string $email): bool {


            return filter\_var($email, FILTER\_VALIDATE\_EMAIL) !== false;


        }


        // Another private method with underscore prefix


        private function \_notifyAdmin(string $username): void {


            // Simulating admin notification


            echo "Admin notified about new user: $username\\n";


        }


    }


    // Usage


    $manager = new UserManager();


    $manager->addUser(''john\_doe'', ''john@example.com'');


    <Bad Code>


    // Bad example: Not using underscore prefix for private methods


    class UserManager {


        private $users = \[\];


        public function addUser(string $username, string $email): void {


            if ($this->isValidEmail($email)) {


                $this->users\[\] = \[


                    ''username'' => $username,


                    ''email'' => $email


                \];


                $this->notifyAdmin($username);


            }


        }


        // Private method without underscore prefix


        private function isValidEmail(string $email): bool {


            return filter\_var($email, FILTER\_VALIDATE\_EMAIL) !== false;


        }


        // Another private method without underscore prefix


        private function notifyAdmin(string $username): void {


            // Simulating admin notification


            echo "Admin notified about new user: $username\\n";


        }


    }


    // Usage


    $manager = new UserManager();


    $manager->addUser(''john\_doe'', ''john@example.com'');


    In the good example, private methods (\_isValidEmail and \_notifyAdmin) are prefixed
    with an underscore. This visual cue immediately indicates to other developers
    that these methods are intended for internal use within the class.


    The bad example doesn''t use the underscore prefix, making it less obvious which
    methods are private and which are public without checking the method declarations.


    Both examples function identically, but the good example enhances code readability
    and helps prevent accidental misuse of private methods.


    <Memo>


    While using an underscore prefix for private methods is a common convention in
    PHP, it''s important to note that PHP doesn''t enforce any special meaning to
    methods prefixed with an underscore. The visibility is controlled by the ''private''
    keyword, not the underscore itself.


    11


    # Avoid abbreviations in variable and function names


    * * *


    Using full words in variable and function names makes the code more readable and
    understandable.


    * * *


    When writing PHP code, it''s important to use descriptive names for variables
    and functions. Avoiding abbreviations helps other developers understand the purpose
    of the code without needing additional context.


    < Good Code >


    <?php


    // Good example: Using full words for variable and function names


    // Function to calculate the total price of items in a cart


    function calculateTotalPrice($items) {


        $totalPrice = 0;


        foreach ($items as $item) {


            $totalPrice += $item\[''price''\] \* $item\[''quantity''\];


        }


        return $totalPrice;


    }


    // Array of items in the cart


    $shoppingCartItems = \[


        \[''price'' => 10, ''quantity'' => 2\],


        \[''price'' => 5, ''quantity'' => 3\]


    \];


    // Calculate the total price of items in the cart


    $total = calculateTotalPrice($shoppingCartItems);


    echo "Total Price: $" . $total;


    ?>


    <Bad Code>


    <?php


    // Bad example: Using abbreviations for variable and function names


    // Function to calculate the total price of items in a cart


    function calcTotPr($itms) {


        $totPr = 0;


        foreach ($itms as $itm) {


            $totPr += $itm\[''pr''\] \* $itm\[''qty''\];


        }


        return $totPr;


    }


    // Array of items in the cart


    $shpCrtItms = \[


        \[''pr'' => 10, ''qty'' => 2\],


        \[''pr'' => 5, ''qty'' => 3\]


    \];


    // Calculate the total price of items in the cart


    $tot = calcTotPr($shpCrtItms);


    echo "Total Price: $" . $tot;


    ?>


    In the good example, the function name calculateTotalPrice and variable names
    like $shoppingCartItems are clear and descriptive. This makes the code easier
    to read and understand. In the bad example, abbreviations like calcTotPr and $shpCrtItms
    make the code harder to follow, especially for someone who is not familiar with
    the abbreviations used.


    <Memo>


    Did you know? The practice of using descriptive names in code is often referred
    to as "self-documenting code." This means the code itself provides enough context
    and information that separate documentation is less necessary.


