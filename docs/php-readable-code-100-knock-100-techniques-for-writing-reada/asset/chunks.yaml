    \n# 使用 PHPStan 等静态分析工具提高代码质量\n\n* * *\n\n使用 `PHPStan` 自动检测潜在错误并提高代码质量。\n\n* *\
    \ *\n\n以下示例演示了如何使用 `PHPStan` 分析一个简单的 PHP 函数：\n\n< 良好的代码 >\n\n```php\n<?php\n//\
    \ 文件: example.php\n\n/**\n * 计算两个整数之和\n *\n * @param int $a 第一个数字\n * @param int\
    \ $b 第二个数字\n * @return int $a 和 $b 的和\n */\nfunction add(int $a, int $b): int\n\
    {\n    return $a + $b;\n}\n// 用法\n$result = add(5, 3);\necho $result; // 输出：8\n\
    ```\n\n<糟糕的代码>\n```php\n<?php\n// 文件: example.php\nfunction add($a, $b)\n{\n \
    \   return $a + $b;\n}\n$result = add(\"5\", \"3\");\necho $result;\n```\n\n在良好的示例中，我们对参数和返回值使用了类型声明，`PHPStan`\
    \ 可以对其进行分析。糟糕的示例缺少类型声明，容易出现与类型相关的错误。在良好的代码上运行 `PHPStan` 不产生错误，而糟糕的代码可能会生成关于潜在类型不匹配的警告。\n\
    \n使用 `PHPStan`：\n\n安装 `PHPStan`：`composer require --dev phpstan/phpstan`\n\n运行分析：`vendor/bin/phpstan\
    \ analyse example.php`\n\n<Memo>\n`PHPStan` 具有不同的规则级别（0-9），对应不同严格程度的分析。级别 0 最松，级别\
    \ 9 最严格。\n</Memo>\n\n70\n\n# 对原生类型使用标量类型声明\n\n* * *\n\n使用标量类型声明强制执行 PHP 中原生数据类型的严格类型。\n\
    \n* * *\n\n以下示例展示了如何在计算矩形面积的未使用标量类型声明：\n\n< 良好的代码 >\n\n```php\n<?php\ndeclare(strict_types=1);\n\
    \n/**\n * 计算矩形面积\n *\n * @param float $length 矩形的长度\n * @param float $width 矩形的宽度\n\
    \ * @return float 矩形的面积\n */\nfunction calculateRectangleArea(float $length, float\
    \ $width): float\n{\n    return $length * $width;\n}\n// 用法\n$area = calculateRectangleArea(5.5,\
    \ 3.2);\necho \"Area: \" . $area; // 输出：Area: 17.6\n```\n\n<糟糕的代码>\n```php\n<?php\n\
    function calculateRectangleArea($length, $width)\n{\n    return $length * $width;\n\
    }\n// 用法\n$area = calculateRectangleArea(\"5.5\", \"3.2\");\necho \"Area: \" .\
    \ $area;\n```\n\n在良好的示例中，我们使用 `declare(strict_types=1)` 启用严格类型检查，并对参数和返回值使用 float\
    \ 类型声明。这确保了只接受和返回 `float` 值。糟糕的示例缺少类型声明，允许任何类型的输入，这可能导致意外的结果或错误。\n\n使用标量类型声明的好处：\n\
    - 提高代码可读性\n- 运行时运行时更好的错误检测\n- 增强 IDE 对自动补全和类型提示的支持\n\n<Memo>\nPHP 7.0 引入了针对 `int`、`float`、`string`\
    \ 和 `bool` 的标量类型声明。在此之前，仅允许类名、`self`、`array` 和 `callable` 作为类型提示。\n</Memo>\n\n\
    71\n\n# 将长方法链拆分为多行\n\n* * *\n\n通过将长方法链拆分到多行来提高代码可读性。\n\n* * *\n\n以下代码演示了如何拆分长方法链以提高可读性：\n\
    \n< 良好的代码 >\n```php\n// 良好：将长方法链拆分为多行\n$result = $database->table('users')\n \
    \   ->select('name', 'email')\n    ->where('active', true)\n    ->orderBy('created_at',\
    \ 'desc')\n    ->limit(10)\n    ->get();\n```\n\n<糟糕的代码>\n```php\n// 糟糕：单行上的长方法链\n\
    $result = $database->table('users')->select('name', 'email')->where('active',\
    \ true)->orderBy('created_at', 'desc')->limit(10)->get();\n```\n\n良好的代码示例将长方法链拆分为多行，每个方法调用都占新行并进行缩进。这通过更容易看到链中的每一步改进了可读性。糟糕的代码示例将所有内容放在同一行，使得更难阅读和理解单个方法调用。\n\
    \n<Memo>\n许多现代 IDE 都有助于拆分长方法链。\n</Memo>\n\n72\n\n# 使用中间变量解释复杂计算\n\n* * *\n\n通过为复杂计算使用中间变量来提高代码清晰度。\n\
    \n* * *\n\n以下代码展示了如何使用中间变量使计算清晰：\n\n< 良好的代码 >\n```php\n// 良好：使用中间变量\n$basePrice\
    \ = 100;\n$taxRate = 0.08;\n$discountPercentage = 0.1;\n\n$priceAfterDiscount\
    \ = $basePrice * (1 - $discountPercentage);\n$taxAmount = $priceAfterDiscount\
    \ * $taxRate;\n$finalPrice = $priceAfterDiscount + $taxAmount;\n\necho \"Final\
    \ price: \" . number_format($finalPrice, 2);\n```\n\n<糟糕的代码>\n```php\n// 糟糕：没有中间变量的复杂计算\n\
    echo \"Final price: \" . number_format(100 * (1 - 0.1) * 1.08, 2);\n```\n\n使用意义的变量不仅提高了可读性，还可以作为文档。\n\
    \n# 将复杂的正则表达式提取为命名常量\n\n* * *\n\n通过为正则表达式使用命名常量提高代码可读性。\n\n* * *\n\n以下代码演示了如何将复杂的正则表达式提取为命名常量，以提高可读性和维护性。\n\
    \n< 良好的代码 >\n```php\n<?php\n// 为正则表达式定义命名常量\nconst EMAIL_REGEX = '/^[a-z0-9._%+-]+@[a-z0-9.-]+\\\
    .[a-z]{2,}$/i';\n\n// 在代码中使用命名常量\nfunction validateEmail($email) {\n    // 检查邮箱是否匹配定义的模式\n\
    \    if (preg_match(EMAIL_REGEX, $email)) {\n        return true;\n    }\n   \
    \ return false;\n}\n\n// 示例\n$email = 'user@example.com';\nif (validateEmail($email))\
    \ {\n    echo \"Valid email address\";\n} else {\n    echo \"Invalid email address\"\
    ;\n}\n```\n\n<糟糕的代码>\n```php\n<?php\n// 函数中直接使用复杂的正则表达式\nfunction validateEmail($email)\
    \ {\n    // 直接在 preg_match 函数中使用复杂的正则表达式\n    if (preg_match('/^[a-z0-9._%+-]+@[a-z0-9.-]+\\\
    .[a-z]{2,}$/i', $email)) {\n        return true;\n    }\n    return false;\n}\n\
    \n// 示例\n$email = 'user@example.com';\nif (validateEmail($email)) {\n    echo\
    \ \"Valid email address\";\n} else {\n    echo \"Invalid email address\";\n}\n\
    ```\n\n"
