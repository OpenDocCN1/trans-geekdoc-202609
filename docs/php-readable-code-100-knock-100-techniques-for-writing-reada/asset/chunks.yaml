    \ 前缀的接口用法：\n\n#### Good Code\n\n```php\n<?php\n// 以 'I' 为前缀的接口\ninterface ILogger\
    \ {\n    public function log($message);\n}\n\n// 实现接口的类\nclass FileLogger implements\
    \ ILogger {\n    public function log($message) {\n        // 实现细节\n        file_put_contents('log.txt',\
    \ $message, FILE_APPEND);\n    }\n}\n\n// 使用\n$logger = new FileLogger();\n$logger->log('这是一条日志.');\n\
    ```\n\n#### Bad Code\n\n```php\n<?php\n// 没有 'I' 的接口\ninterface Logger {\n   \
