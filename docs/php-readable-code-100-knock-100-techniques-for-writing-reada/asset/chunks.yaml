- raw: 'In the good code example, the inline comment is used only to explain the purpose
    of the complex regex pattern. The bad code example overuses comments, explaining
    obvious operations like trimming whitespace and returning data. Such comments
    add unnecessary verbosity without improving code comprehension.


    <Memo>


    The concept of "Self-Documenting Code" suggests that well-written code should
    be readable and understandable without extensive comments, relying on clear naming
    conventions and logical structure.


    31


    # Utilize dependency injection for better testability


    * * *


    Dependency injection improves code testability by decoupling components and allowing
    easier mocking of dependencies.


    * * *


    The following code demonstrates dependency injection in a UserService class:


    < Good Code >


    // Good code: Using dependency injection


    class UserService {


        private $database;


        // Constructor injection


        public function \_\_construct(DatabaseInterface $database) {


            $this->database = $database;


        }


        public function getUserById($id) {


            // Use the injected database object


            return $this->database->query("SELECT \* FROM users WHERE id = ?", \[$id\]);


        }


    }


    // Usage


    $database = new MySQLDatabase();


    $userService = new UserService($database);


    $user = $userService->getUserById(1);


    <Bad Code>


    // Bad code: Tightly coupled, hard to test


    class UserService {


        private $database;


        public function \_\_construct() {


            // Direct instantiation, tightly coupled


            $this->database = new MySQLDatabase();


        }


        public function getUserById($id) {


            return $this->database->query("SELECT \* FROM users WHERE id = ?", \[$id\]);


        }


    }


    // Usage


    $userService = new UserService();


    $user = $userService->getUserById(1);


    The good code example uses dependency injection by accepting a DatabaseInterface
    in the constructor. This allows for easier testing as you can inject a mock database
    object. The bad code directly instantiates the database, making it difficult to
    test in isolation or swap implementations.


    <Memo>


    Dependency injection is one of the SOLID principles, specifically the Dependency
    Inversion Principle (DIP).


    32


    # Use null coalescing operator (??) for concise null checks


    * * *


    The null coalescing operator (??) provides a concise way to handle null checks
    and default values.


    * * *


    The following code demonstrates the use of the null coalescing operator:


    < Good Code >


    // Good code: Using null coalescing operator


    function getUserName($user) {


        // Return user''s name if set, otherwise return ''Guest''


        return $user\[''name''\] ?? ''Guest'';


    }


    // Usage


    $user1 = \[''name'' => ''John''\];


    $user2 = \[\];


    echo getUserName($user1); // Outputs: John


    echo getUserName($user2); // Outputs: Guest


    <Bad Code>


    // Bad code: Verbose null check


    function getUserName($user) {


        // Check if ''name'' is set and not null, otherwise return ''Guest''


        if (isset($user\[''name''\]) && $user\[''name''\] !== null) {


            return $user\[''name''\];


        } else {


            return ''Guest'';


        }


    }


    // Usage


    $user1 = \[''name'' => ''John''\];


    $user2 = \[\];


    echo getUserName($user1); // Outputs: John


    echo getUserName($user2); // Outputs: Guest


    The good code uses the null coalescing operator (??) to concisely check if $user\[''name''\]
    is set and not null. If it is, it returns the name; otherwise, it returns ''Guest''.
    The bad code achieves the same result but with a more verbose if-else statement,
    making it less readable and more prone to errors.


    <Memo>


    The null coalescing operator (??) was introduced in PHP 7.0 and is similar to
    the ternary operator but specifically designed for null checks.


    33


    # Implement \_\_invoke() method for callable objects


    * * *


    The \_\_invoke() method allows an object to be called as a function.


    * * *


    The \_\_invoke() method in PHP enables objects to be used as callable functions.
    This can make your code more flexible and readable by allowing objects to be invoked
    directly.


    < Good Code >


    <?php


    class Greeter {


        private $greeting;


        public function \_\_construct($greeting) {


            $this->greeting = $greeting;


        }


        // Implementing the \_\_invoke method


        public function \_\_invoke($name) {


            return $this->greeting . '', '' . $name . ''!'';


        }


    }


    $greeter = new Greeter(''Hello'');


    echo $greeter(''World''); // Outputs: Hello, World!


    <Bad Code>


    <?php


    class Greeter {


        private $greeting;


        public function \_\_construct($greeting) {


            $this->greeting = $greeting;


        }


        // No \_\_invoke method, using a regular method instead


        public function greet($name) {


            return $this->greeting . '', '' . $name . ''!'';


        }


    }


    $greeter = new Greeter(''Hello'');


    echo $greeter->greet(''World''); // Outputs: Hello, World!


    In the good example, the \_\_invoke() method allows the Greeter object to be called
    as if it were a function, making the code more concise and readable. In the bad
    example, a regular method greet() is used, which requires an additional method
    call syntax, making the code slightly more verbose.


    <Memo>


    The \_\_invoke() method was introduced in PHP 5.3.0. It allows any instance of
    a class to be called as a function, providing a way to implement function-like
    behavior in objects.


    34


    # Use yield from for nested generators


    * * *


    The yield from expression simplifies working with nested generators.


    * * *


    The yield from expression in PHP allows you to delegate part of a generator''s
    operations to another generator. This can make your code cleaner and easier to
    understand when dealing with nested generators.


    < Good Code >


    <?php


    function innerGenerator() {


        yield 1;


        yield 2;


        yield 3;


    }


    function outerGenerator() {


        // Using yield from to delegate to innerGenerator


        yield from innerGenerator();


        yield 4;


        yield 5;


    }


    foreach (outerGenerator() as $value) {


        echo $value . '' ''; // Outputs: 1 2 3 4 5


    }


    <Bad Code>


    <?php


    function innerGenerator() {


        yield 1;


        yield 2;


        yield 3;


    }


    function outerGenerator() {


        // Manually yielding values from innerGenerator


        foreach (innerGenerator() as $value) {


            yield $value;


        }


        yield 4;


        yield 5;


    }


    foreach (outerGenerator() as $value) {


        echo $value . '' ''; // Outputs: 1 2 3 4 5


    }


    In the good example, yield from is used to delegate the yielding process to innerGenerator(),
    making the code more concise and easier to read. In the bad example, a foreach
    loop is used to manually yield values from innerGenerator(), which is more verbose
    and less elegant.


    <Memo>


    The yield from expression was introduced in PHP 7.0.0. It provides a way to yield
    all values from an iterable, simplifying the code when working with nested generators.


    35


    # Employ array unpacking for merging arrays


    * * *


    Use the spread operator (...) to merge arrays efficiently in PHP 7.4+.


    * * *


    The following code demonstrates how to merge two arrays using array unpacking:


    < Good Code >


    <?php


    // Good practice: Using array unpacking for merging arrays


    $fruits = \[''apple'', ''banana''\];


    $vegetables = \[''carrot'', ''tomato''\];


    // Merge arrays using the spread operator


    $combined = \[...$fruits, ...$vegetables\];


    // Output the result


    print\_r($combined);


    ?>


    <Bad Code>


    <?php


    // Bad practice: Using array\_merge() for combining arrays


    $fruits = array(''apple'', ''banana'');


    $vegetables = array(''carrot'', ''tomato'');


    // Merge arrays using array\_merge()


    $combined = array\_merge($fruits, $vegetables);


    // Output the result


    print\_r($combined);


    ?>


    The good code example uses the spread operator (...) to unpack the arrays and
    merge them into a new array. This method is more readable and concise. The bad
    code example uses the traditional array\_merge() function, which is less intuitive
    and requires more typing. Both methods produce the same result, but the spread
    operator is generally preferred in modern PHP for its simplicity and readability.


    <Memo>'
