    <?php\n$fruits = ['apple', 'banana'];\n$vegetables = ['carrot', 'tomato'];\n\n\
    // Merge arrays using the spread operator\n$combined = [...$fruits, ...$vegetables];\n\
    \nprint_r($combined);\n?>\n```\n<Bad Code>\n```php\n<?php\n$fruits = ['apple',\
    \ 'banana'];\n$vegetables = ['carrot', 'tomato'];\n\n// Merge arrays using array_merge()\n\
    $combined = array_merge($fruits, $vegetables);\n\nprint_r($combined);\n?>\n```\n\
    \nThe good code example uses the spread operator (`...`) to unpack the arrays\
    \ and merge them into a new array. This method is more readable and concise. The\
    \ bad code example uses the traditional `array_merge()` function, which is less\
    \ intuitive and requires more typing.\n"
  trans: "\n\n在良好的代码示例中，内联注释仅用于解释复杂的正则表达式模式的目的。糟糕的代码示例过度使用注释，解释了如修剪空格和返回数据等显而易见的操作。这些注释增加了不必要的冗余，并没有提高代码的可理解性。\n\
    \n<Memo>\n“自文档代码”的概念认为，良好的代码应该是易读易理解的，不需要大量的注释，依赖清晰的命名规范和逻辑结构。\n</Memo>\n\n31\n\
    \n# 使用依赖注入提高可测试性\n\n依赖注入通过解耦组件和允许更容易地模拟（mock）依赖来提高代码的可测试性。\n\n以下代码演示了 `UserService`\
    \ 类中的依赖注入：\n\n< Good Code >\n```php\n// 良好的代码：使用依赖注入\n\nclass UserService {\n\
    \    private $database;\n\n    // 构造函数注入\n    public function __construct(DatabaseInterface\
    \ $database) {\n        $this->database = $database;\n    }\n    public function\
    \ getUserById($id) {\n        // 使用注入的数据库对象\n        return $this->database->query(\"\
    SELECT * FROM users WHERE id = ?\", [$id]);\n    }\n}\n\n// 使用示例\n$database =\
    \ new MySQLDatabase();\n$userService = new UserService($database);\n$user = $userService->getUserById(1);\n\
    ```\n<Bad Code>\n```php\n// 糟糕的代码：紧耦合，难以测试\n\nclass UserService {\n    private\
    \ $database;\n\n    public function __construct() {\n        // 直接实例化，紧耦合\n  \
    \      $this->database = new MySQLDatabase();\n    }\n    public function getUserById($id)\
    \ {\n        return $this->database->query(\"SELECT * FROM users WHERE id = ?\"\
    , [$id]);\n    }\n}\n\n// 使用示例\n$userService = new UserService();\n$user = $userService->getUserById(1);\n\
    ```\n\n良好的代码示例通过在构造函数中接受 `DatabaseInterface` 来使用依赖注入。这使得测试变得更容易，因为你可以注入一个模拟数据库对象。糟糕的代码直接实例化\
    \ `database`，导致其难以进行隔离测试或更换实现类。\n\n<Memo>\n依赖注入是 SOLID 原则之一，具体来说是依赖倒置原则 (`DIP`)。\n\
    </Memo>\n\n32\n\n# 使用空合并运算符 (??) 进行简洁的空检查\n\n空合并运算符 (`??`) 提供了一种处理空检查和默认值的简洁方式。\n\
    \n以下代码演示了空合并运算符的用法：\n\n< Good Code >\n```php\n// 良好的代码：使用空合并运算符\n\nfunction getUserName($user)\
    \ {\n    // 如果设置了用户名则返回用户名，否则返回 'Guest'\n    return $user['name'] ?? 'Guest';\n\
    }\n\n// 使用示例\n$user1 = ['name' => 'John'];\n$user2 = [];\necho getUserName($user1);\
    \ // 输出: John\necho getUserName($user2); // 输出: Guest\n```\n<Bad Code>\n```php\n\
    // 糟糕的代码：冗长的空检查\n\nfunction getUserName($user) {\n    // 检查 'name'是否已设置且不为空，否则返回\
    \ 'Guest'\n    if (isset($user['name']) && $user['name'] !== null) {\n       \
    \ return $user['name'];\n    } else {\n        return 'Guest';\n    }\n}\n\n//\
    \ 使用示例\n$user1 = ['name' => 'John'];\n$user2 = [];\necho getUserName($user1);\
    \ // 输出: John\necho getUserName($user2); // 输出: Guest\n```\n\n良好的代码使用空合并运算符 (`??`)\
    \ 来简洁地检查 `$user['name']` 是否设置且不为空。糟糕的代码使用了冗长的 `if-else` 块来实现相同的结果。\n\n<Memo>\n\
    空合并运算符 (`??`) 是在 PHP 7.0 中引入的。\n</Memo>\n\n33\n\n# 为调用对象实现 `invoke()` 方法\n\n`invoke()`\
    \ 方法允许对象像函数一样被调用。\n\nPHP 中的 `invoke()` 方法让对象变得可用。\n\n< Good Code >\n```php\n<?php\n\
    class Greeter {\n    private $greeting;\n\n    public function __construct($greeting)\
    \ {\n        $this->greeting = $greeting;\n    }\n\n    public function __invoke($name)\
    \ {\n        return $this->greeting . ', ' . $name;\n    }\n}\n\n$greeter = new\
    \ Greeter('Hello');\necho $greeter('World'); // 输出: Hello, World\n```\n<Bad Code>\n\
    ```php\n<?php\nclass Greeter {\n    private $greeting;\n\n    public function\
    \ __construct($greeting) {\n        $this->greeting = $greeting;\n    }\n\n  \
    \  public function greet($name) {\n        return $this->greeting . ', ' . $name;\n\
    \    }\n}\n\n$greeter = new Greeter('Hello');\necho $greeter->greet('World');\
    \ // 输出: Hello, World\n```\n\n良好的代码使用 `__invoke()` 方法允许对象像函数一样被调用。糟糕的代码使用了具名的\
    \ `greet()` 方法，其灵活性较低。\n\n<Memo>\n`__invoke()` 方法是在 PHP 5.5 中引入的。\n</Memo>\n\n\
    34\n\n# 使用 `yield from` 处理嵌套生成器\n\n`yield from` 表达式简化了对嵌套生成器的操作。\n\n`yield from`\
    \ 允许将产生值的任务委托给另一个生成器，使代码更整洁。\n\n< Good Code >\n```php\n<?php\nfunction innerGenerator()\
    \ {\n    yield 1;\n    yield 2;\n    yield 3;\n}\n\nfunction outerGenerator()\
    \ {\n    yield from innerGenerator();\n}\n\nforeach (outerGenerator() as $value)\
    \ {\n    echo $value . ' ';\n} // 输出: 1 2 3 \n```\n<Bad Code>\n```php\n<?php\n\
    function innerGenerator() {\n    yield 1;\n    yield 2;\n    yield 3;\n}\n\nfunction\
    \ outerGenerator() {\n    foreach (innerGenerator() as $value) {\n        yield\
    \ $value;\n    }\n}\n\nforeach (outerGenerator() as $value) {\n    echo $value\
    \ . ' ';\n} // 输出: 1 2 3 \n```\n\n良好的示例使用 `yield from` 将过程委托给 `innerGenerator()`。糟糕的示例使用\
    \ `foreach` 循环来手动产生值，这显得更加冗长。\n\n<Memo>\n`yield from` 表达式是在 PHP 7.0 中引入的，用于简化嵌套的可迭代对象处理。\n\
    </Memo>\n\n35\n\n# 使用数组解包合并数组\n\n在 PHP 7.4+ 中使用扩展运算符 (`...`) 高效地合并数组。\n\n以下代码演示了如何使用数组解包合并数组：\n\
    \n< Good Code >\n```php\n<?php\n$fruits = ['apple', 'banana'];\n$vegetables =\
    \ ['carrot', 'tomato'];\n\n// 使用扩展运算符合并数组\n$combined = [...$fruits, ...$vegetables];\n\
    \nprint_r($combined);\n?>\n```\n<Bad Code>\n```php\n<?php\n$fruits = ['apple',\
    \ 'banana'];\n$vegetables = ['carrot', 'tomato'];\n\n// 使用 array_merge 合并数组\n\
    $combined = array_merge($fruits, $vegetables);\n\nprint_r($combined);\n?>\n```\n\
    \n良好的代码示例使用扩展运算符 (`...`) 将数组解包并合并到一个新数组。这种方法更具可读性且简洁。糟糕的代码使用了传统的 `array_merge()`\
    \ 函数，它不够直观且需要输入更多的代码。\n\n"
