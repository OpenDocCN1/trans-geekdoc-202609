        ''age'' => 30,


        ''email'' => ''john@example.com'',


        ''roles'' => \[''admin'', ''editor''\]


    \];


    // Accessing and displaying user information


    echo "Name: " . $user\[''name''\] . "\\n";


    echo "Age: " . $user\[''age''\] . "\\n";


    echo "Email: " . $user\[''email''\] . "\\n";


    echo "Roles: " . implode('', '', $user\[''roles''\]) . "\\n";


