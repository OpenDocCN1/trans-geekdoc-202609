    # Extract complex conditions into well-named methods


    * * *


    Improve code readability by extracting complex conditions into separate, well-named
    methods.


    * * *


    The following code demonstrates how to extract a complex condition into a well-named
    method for better readability.


    < Good Code >


    class Order {


        private $items;


        private $totalAmount;


        // Other properties and methods...


        public function isEligibleForDiscount() {


            return $this->hasMinimumItems() && $this->exceedsMinimumAmount();


        }


        private function hasMinimumItems() {


            return count($this->items) >= 5;


        }


        private function exceedsMinimumAmount() {


            return $this->totalAmount > 100;


        }


    }


    // Usage


    $order = new Order();


    if ($order->isEligibleForDiscount()) {


        // Apply discount


    }


