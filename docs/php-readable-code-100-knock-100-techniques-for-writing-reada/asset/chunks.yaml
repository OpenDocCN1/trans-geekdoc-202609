    # Employ static analysis tools like PHPStan for code quality


    * * *


    Use PHPStan to detect potential errors and improve code quality automatically.


    * * *


    The following example demonstrates how to use PHPStan to analyze a simple PHP
    function:


    < Good Code >


    <?php


    // File: example.php


    /\*\*


    \* Calculate the sum of two integers


    \*


    \* @param int $a First number


    \* @param int $b Second number


    \* @return int Sum of $a and $b


    \*/


    function add(int $a, int $b): int


    {


        return $a + $b;


    }


    // Usage


    $result = add(5, 3);


    echo $result; // Outputs: 8


    <Bad Code>


    <?php


    // File: example.php


    function add($a, $b)


    {


        return $a + $b;


    }


    $result = add("5", "3");


    echo $result;


    In the good example, we use type declarations for parameters and return type,
    which PHPStan can analyze. The bad example lacks type declarations, making it
    prone to type-related errors. Running PHPStan on the good code would yield no
    errors, while the bad code might generate warnings about potential type mismatches.


    To use PHPStan:


    Install PHPStan: composer require --dev phpstan/phpstan


    Run analysis: vendor/bin/phpstan analyse example.php


    <Memo>


    PHPStan has different rule levels (0-9) for varying strictness of analysis. Level
    0 is the loosest, while level 9 is the strictest.


