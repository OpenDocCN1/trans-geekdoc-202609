    ```\n\n良好的代码示例实现了一个简单的依赖注入容器来管理对象的创建。这种方法允许更好的可测试性、灵活性关注点分离。依赖项注册在容器中并在需要时解析。相比之下，糟糕的代码硬编码了依赖，使得代码缺乏活性且难以测试或修改。\n\
