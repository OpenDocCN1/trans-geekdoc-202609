    \ getEmail() {\n        return 'user@example.com';\n    }\n}\n\n$user = null;\n\
    // Safely access property\n$name = $user?->name;\necho \"Name: \" . ($name ??\
    \ 'Unknown');\n\n// Safely call\n$email = $user?->getEmail();\necho \"Email: \"\
    \ . ($email ?? 'Not available');\n\n// Chaining\n$user = new User();\n$user->name\
    \ = 'John';\n$upperName = $user?->name;\necho \"Upper name: \" . $upperName;\n\
    ```\n\n<Bad Code>\n```php\n// Not using the null safe operator for property/method\
    \ access\n\nclass User {\n    public $name;\n    public function getEmail() {\n\
    \        return 'user@example.com';\n    }\n}\n\n$user = null;\n// Unsafe access\n\
    $name = $user->name;\necho \"Name: \" . $name;\n\n// Unsafe call\n$email = $user->getEmail();\n\
    echo \"Email: \" . $email;\n```\n\nThe good code example uses the null safe operator\
    \ `(?->)` to access properties and methods. This operator checks if the object\
    \ is `null` before attempting access, preventing errors. The bad code example\
    \ uses traditional checks which can make the code more verbose.\n\n<Memo>\nThe\
    \ null safe operator was introduced in `PHP 8.0` and is particularly useful when\
    \ working with APIs.\n</Memo>\n\n49\n\n# Use match expressions for cleaner switch-like\
    \ functionality\n\n`PHP 8.0 introduced match expressions, offering a more concise\
    \ and powerful alternative to switch statements.\n\nThe following code demonstrates\
    \ how to handle different cases based on a value:\n\n< Good Code >\n```php\n//\
    \ Good example using match\n\nfunction getStatusMessage($statusCode) {\n    //\
    \ Use match to return appropriate message\n    return match ($statusCode) {\n\
    \        200 => 'OK',\n        404 => 'Not Found',\n        500 => 'Internal Server\
    \ Error',\n        default => 'Unknown Status',\n    };\n}\n\n// Usage\n$message\
    \ = getStatusMessage(404);\necho $message; // Outputs: Not Found\n```\n\n<Bad\
    \ Code>\n```php\n// Bad example using switch statement\n\nfunction getStatusMessage($statusCode)\
    \ {\n    // Use switch statement to return appropriate message\n    switch ($statusCode)\
    \ {\n        case 200:\n            return 'OK';\n        case 404:\n        \
    \    return 'Not Found';\n        case 500:\n            return 'Internal Server\
    \ Error';\n        default:\n            return 'Unknown Status';\n    }\n}\n\n\
    // Usage\n$message = getStatusMessage(404);\necho $message; // Outputs: Not Found\n\
    ```\n"
  trans: "\n良好的代码示例使用了三元运算符 `(?:)` 来根据条件简洁地为布尔值赋值。与糟糕代码示例中使用的传统 `if-else` 语句相比，这种方法更具可读性且更加更紧凑。两个代码段实现了相同的结果，但三元运算符的版本更优雅，且更容易一目了然。\n\
    \n<Memo>\n三元运算符也称为条件运算符，它是 `PHP` 中唯一接受三个操作数的运算符。\n</Memo>\n\n46\n\n# 利用空合并运算符\
    \ (`??`) 设置默认值\n\n使用空合并运算符来高效地分配默认值。\n\n以下代码展示了如何使用空合并运算符来分配默认值：\n\n< Good Code\
    \ >\n```php\n// 良好的代码：使用空合并运算符设置默认值\n\n$username = $_GET['username'] ?? 'Guest';\n\
    \n// 解释：\n// 如果 $_GET['username'] 已设置且不为 null，则将它的值赋值给 $username\n// 否则，将 'Guest'\
    \ 作为默认值赋值\n```\n\n<Bad Code>\n```php\n// 糟糕的代码：使用 isset() 和三元运算符设置默认值\n\n$username\
    \ = isset($_GET['username']) ? $_GET['username'] : 'Guest';\n\n// 解释：\n//这段代码的功能与良好示例相同，\n\
    // 但它更冗长且效率较低\n```\n\n良好的代码示例使用了空合并运算符 `(??)` 在指定变量为 `null` 或未设置时分配默认值。与糟糕的代码示例相比，这种方法更简洁且易于阅读，而糟糕的示例使用了\
    \ `isset()` 和三元运算符来实现相同的结果。空合并运算符简化了代码，并使其更具可维护性。\n\n<Memo>\n空合并运算符在 `PHP 7.0`\
    \ 中引入，对于处理未定义的数组键或对象属性特别有用。\n</Memo>\n\n47\n\n# 使用太空运算符 (`<=>`) 进行简洁比较\n\n太空运算符简化了\
    \ `PHP` 中的比较操作，使代码更具可读性且更简洁。\n\n以下代码演示了如何使用太空运算符比较值并排序数组：\n\n< Good Code >\n```php\n\
    // 使用太空运算符进行比较和排序\n\n$fruits = ['apple', 'banana', 'cherry'];\n\n// 使用太空运算符对数组进行排序\n\
    \nusort($fruits, function($a, $b) {\n    // 太空运算符返回 -1, 0 或 1\n    return $a <=>\
    \ $b;\n});\n\n// 输出排序后的数组\n\nforeach ($fruits as $fruit) {\n    echo $fruit .\
    \ \"\\n\";\n}\n\n// 使用太空运算符比较数字\n\n$result = 5 <=> 10;\necho \"Comparison result:\
    \ \" . $result . \"\\n\";\n```\n\n<Bad Code>\n```php\n// 未使用太空运算符进行比较和排序\n\n$fruits\
    \ = ['apple', 'banana', 'cherry'];\n\n// 使用传统的比较函数对数组进行排序\n\nusort($fruits, function($a,\
    \ $b) {\n    if ($a < $b) {\n        return -1;\n    } elseif ($a > $b) {\n  \
    \      return 1;\n    } else {\n        return 0;\n    }\n});\n\n// 输出排序后的数组\n\
    \nforeach ($fruits as $fruit) {\n    echo $fruit . \"\\n\";\n}\n\n// 在不使用太空运算符的情况下比较数字\n\
    \n$a = 5;\n$b = 10;\nif ($a < $b) {\n    $result = -1;\n} elseif ($a > $b) {\n\
    \    $result = 1;\n} else {\n    $result = 0;\n}\n\necho \"Comparison result:\
    \ \" . $result . \"\\n\";\n```\n\n良好的代码示例使用太空运算符 `(<=>)` 同时用于排序和比较。该运算符在左操作数小于右操作数时返回\
    \ `-1`，当两者相等时返回 `0`，当左操作数大于右操作数时返回 `1`。糟糕的示例使用了传统的 `if-else` 逻辑，导致代码更冗长且不直观。太空运算符简化了处理\
    \ `null` 的情况，使代码更简洁且易于读。\n\n<Memo>\n太空运算符在 `PHP 7.0` 中引入，也被称为组合运算符。\n</Memo>\n\
    \n48\n\n# 使用空安全运算符 (`?->`) 进行安全访问\n\n空安全运算符允许在处理 `null` 值时访问属性或方法而不会产生错误。\n\n\
    以下代码演示了如何使用空安全运算符安全地访问属性：\n\n< Good Code >\n```php\n// 良好的代码：使用空安全运算符访问属性/方法\n\
    \nclass User {\n    public $name;\n    public function getEmail() {\n        return\
    \ 'user@example.com';\n    }\n}\n\n$user = null;\n// 安全访问属性\n$name = $user?->name;\n\
    echo \"Name: \" . ($name ?? 'Unknown');\n\n// 安全调用方法\n$email = $user?->getEmail();\n\
    echo \"Email: \" . ($email ?? 'Not available');\n\n// 链式调用\n$user = new User();\n\
    $user->name = 'John';\necho \"Name: \" . $user->name;\n```\n\n<Bad Code>\n```php\n\
    // 糟糕的代码：未使用空安全运算符访问属性/方法\n\nclass User {\n    public $name;\n    public function\
    \ getEmail() {\n        return 'user@example.com';\n    }\n}\n\n$user = null;\n\
    // 不安全的访问\n$name = $user->name;\necho \"Name: \" . $name;\n\n// 不安全的调用\n$email\
    \ = $user->getEmail();\necho \"Email: \" . $email;\n```\n\n良好的代码示例使用了空安全运算符 `(?->)`\
    \ 来访问属性和方法。该运算符在尝试访问前检查对象是否为 `null`，从而防止错误。糟糕的示例使用了传统的检查，这可能导致代码更加冗长。\n\n49\n\n\
    # 使用 match 表达式实现简洁的 switch 功能\n\n`PHP 8.0` 引入了 `match` 表达式，为 `switch` 语句提供了更简洁、强大的替代方案。\n\
    \n以下代码演示了如何根据值处理不同的情况：\n\n< Good Code >\n```php\n// 使用 match 的良好示例\n\nfunction\
    \ getStatusMessage($statusCode) {\n    // 使用 match 返回适当的消息\n    return match ($statusCode)\
    \ {\n        200 => 'OK',\n        404 => 'Not Found',\n        500 => 'Internal\
    \ Server Error',\n        default => 'Unknown Status',\n    };\n}\n\n// 使用\n$message\
    \ = getStatusMessage(404);\necho $message; // 输出: Not Found\n```\n\n<Bad Code>\n\
    ```php\n// 使用 switch 语句的糟糕示例\n\nfunction getStatusMessage($statusCode) {\n   \
    \ // 使用 switch 语句返回适当的消息\n    switch ($statusCode) {\n        case 200:\n    \
    \        return 'OK';\n        case 404:\n            return 'Not Found';\n  \
    \      case 500:\n            return 'Internal Server Error';\n        default:\n\
    \            return 'Unknown Status';\n    }\n}\n\n// 使用\n$message = getStatusMessage(404);\n\
    echo $message; // 输出: Not Found\n```\n\n"
