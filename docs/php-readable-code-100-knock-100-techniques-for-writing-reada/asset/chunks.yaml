    \        return -1;\n    } elseif ($a > $b) {\n        return 1;\n    } else {\n\
    \        return 0;\n    }\n});\n\n// Output the sorted array\n\nforeach ($fruits\
    \ as $fruit) {\n    echo $fruit . \"\\n\";\n}\n\n// Compare numbers without using\
    \ the spaceship operator\n\n$a = 5;\n$b = 10;\nif ($a < $b) {\n    $result = -1;\n\
    } elseif ($a > $b) {\n    $result = 1;\n} else {\n    $result = 0;\n}\n\necho\
    \ \"Comparison result: \" . $result . \"\\n\";\n```\n\nThe good code example uses\
    \ the spaceship operator `(<=>)` for both sorting and comparison. This operator\
    \ returns `-1` if the left operand is less than the right, `0` if they are equal,\
    \ and `1` if the left operand is greater. It simplifies comparison logic, making\
    \ the code more concise and easier to read.\n\nThe bad code example uses traditional\
    \ comparison methods, which are more verbose and prone to errors. The sorting\
    \ function is longer and less intuitive, and the number comparison requires multiple\
    \ `if-else` statements.\n\n<Memo>\nThe spaceship operator was introduced in `PHP\
    \ 7.0` and is also known as the combined comparison operator.\n</Memo>\n\n48\n\
    \n# Employ the null safe operator (`?->`) for safe property/method access\n\n\
    The null safe operator allows for safe access to object properties or methods\
    \ without causing errors when dealing with `null` values. \n\nThe following code\
    \ demonstrates how to use the null safe operator to safely access object properties\
    \ and methods:\n\n< Good Code >\n```php\n// Using the null safe operator for safe\
