- raw: '# Separate query operations from command operations


    * * *


    Improve code readability by separating data retrieval (queries) from data modification
    (commands).


    * * *


    The following code demonstrates how to separate query and command operations in
    a user management system:


    < Good Code >


    // UserRepository.php


    class UserRepository {


        // Query operation


        public function findUserById(int $id): ?User {


            // Database query to find user


            // Returns User object or null


        }


        // Command operation


        public function saveUser(User $user): void {


            // Database operation to save user


            // No return value


        }


    }


    // UserService.php


    class UserService {


        private $userRepository;


        public function \_\_construct(UserRepository $userRepository) {


            $this->userRepository = $userRepository;


        }


        public function updateUserEmail(int $userId, string $newEmail): void {


            // Query


            $user = $this->userRepository->findUserById($userId);


            if ($user === null) {


                throw new UserNotFoundException();


            }


            // Modify


            $user->setEmail($newEmail);


            // Command


            $this->userRepository->saveUser($user);


        }


    }


    <Bad Code>


    // UserManager.php


    class UserManager {


        public function updateUserEmail($userId, $newEmail) {


            $db = new Database();


            $user = $db->query("SELECT \* FROM users WHERE id = $userId")->fetch();


            if ($user) {


                $db->query("UPDATE users SET email = ''$newEmail'' WHERE id = $userId");


                return true;


            }


            return false;


        }


    }


    The good code example separates concerns by using a repository pattern. It clearly
    distinguishes between query operations (findUserById) and command operations (saveUser).
    The UserService then uses these operations to perform a complex task.


    The bad code example mixes querying and updating in a single method, making it
    harder to understand and maintain. It also doesn''t separate database operations
    from business logic.


    <Memo>


    This principle is part of the Command Query Responsibility Segregation (CQRS)
    pattern, which can be scaled to separate read and write models in large, complex
    systems.


    66


    # Use type-safe enums with SplEnum


    * * *


    Enhance code clarity and type safety by using SplEnum for enumeration types.


    * * *


    The following code shows how to use SplEnum for creating a type-safe enumeration:


    < Good Code >


    // UserStatus.php


    class UserStatus extends SplEnum {


        const \_\_default = self::ACTIVE;


        const ACTIVE = 1;


        const INACTIVE = 2;


        const SUSPENDED = 3;


    }


    // Usage


    class User {


        private $status;


        public function setStatus(UserStatus $status) {


            $this->status = $status;


        }


        public function getStatus(): UserStatus {


            return $this->status;


        }


    }


    $user = new User();


    $user->setStatus(new UserStatus(UserStatus::ACTIVE));


    if ($user->getStatus()->equals(UserStatus::ACTIVE)) {


        echo "User is active";


    }


    <Bad Code>


    // Without enum


    class User {


        private $status;


        public function setStatus($status) {


            $this->status = $status;


        }


        public function getStatus() {


            return $this->status;


        }


    }


    $user = new User();


    $user->setStatus(1); // What does 1 mean?


    if ($user->getStatus() == 1) {


        echo "User is active"; // Unclear what 1 represents


    }


    The good code uses SplEnum to create a type-safe enumeration for UserStatus. This
    provides clear, meaningful constants for user statuses and ensures type safety
    when setting or checking the status.


    The bad code uses arbitrary integers to represent user statuses, which can lead
    to confusion and errors. It''s not clear what each number represents without additional
    context or documentation.


    <Memo>


    SplEnum is part of the Standard PHP Library (SPL) and requires the SPL Types extension
    to be installed. In PHP 8.1+, native enums are available as a language feature,
    providing an even more robust solution for enumeration types.


    67


    # Implement fluent interfaces for method chaining


    * * *


    Use method chaining to create more readable and expressive code.


    * * *


    The following code demonstrates how to implement a fluent interface for a simple
    User class:


    < Good Code >


    // Good example: Fluent interface implementation


    class User {


        private $name;


        private $email;


        private $age;


        // Method to set name, returns $this for chaining


        public function setName($name) {


            $this->name = $name;


            return $this;


        }


        // Method to set email, returns $this for chaining


        public function setEmail($email) {


            $this->email = $email;


            return $this;


        }


        // Method to set age, returns $this for chaining


        public function setAge($age) {


            $this->age = $age;


            return $this;


        }


        // Method to get user info


        public function getInfo() {


            return "Name: {$this->name}, Email: {$this->email}, Age: {$this->age}";


        }


    }


    // Usage of fluent interface


    $user = (new User())


        ->setName("John Doe")


        ->setEmail("john@example.com")


        ->setAge(30);


    echo $user->getInfo();


    <Bad Code>


    // Bad example: Without fluent interface


    class User {


        private $name;


        private $email;


        private $age;


        // Method to set name


        public function setName($name) {


            $this->name = $name;


        }


        // Method to set email


        public function setEmail($email) {


            $this->email = $email;


        }


        // Method to set age


        public function setAge($age) {


            $this->age = $age;


        }


        // Method to get user info


        public function getInfo() {


            return "Name: {$this->name}, Email: {$this->email}, Age: {$this->age}";


        }


    }


    // Usage without fluent interface


    $user = new User();


    $user->setName("John Doe");


    $user->setEmail("john@example.com");


    $user->setAge(30);


    echo $user->getInfo();


    The good example implements a fluent interface by returning $this in each setter
    method. This allows method chaining, making the code more readable and concise.
    The bad example doesn''t use method chaining, resulting in multiple separate method
    calls, which can be less readable for complex operations.


    <Memo>


    Fluent interfaces were popularized by Martin Fowler and are commonly used in many
    modern PHP frameworks and libraries.


    68


    # Use final classes when inheritance is not needed


    * * *


    Declare classes as final to prevent inheritance when it''s not necessary or intended.


    * * *


    The following code shows how to use final classes to prevent unintended inheritance:


    < Good Code >


    // Good example: Using final class


    final class Configuration {


        private $settings = \[\];


        // Constructor to initialize settings


        public function \_\_construct(array $initialSettings = \[\]) {


            $this->settings = $initialSettings;


        }


        // Method to get a setting


        public function getSetting($key) {


            return $this->settings\[$key\] ?? null;


        }


        // Method to set a setting


        public function setSetting($key, $value) {


            $this->settings\[$key\] = $value;


        }


    }


    // Usage of final class


    $config = new Configuration(\[''debug'' => true\]);


    echo $config->getSetting(''debug''); // Outputs: 1 (true)


    <Bad Code>


    // Bad example: Not using final class


    class Configuration {


        protected $settings = \[\];


        // Constructor to initialize settings


        public function \_\_construct(array $initialSettings = \[\]) {


            $this->settings = $initialSettings;


        }


        // Method to get a setting


        public function getSetting($key) {


            return $this->settings\[$key\] ?? null;


        }


        // Method to set a setting


        public function setSetting($key, $value) {


            $this->settings\[$key\] = $value;


        }


    }


