    \ $motorcycle->getInfo(); // 输出: This is a Motorcycle - Honda\n```\n\n### <Bad\
    \ Code>\n\n```php\n// 没有抽象类，重复重复\nclass Car {\n    private $brand;\n    private\
    \ $model;\n    public function __construct($brand, $model) {\n        $this->brand\
    \ = $brand;\n        $this->model = $model;\n    }\n    public function getInfo()\
    \ {\n        return \"This is a Car - \" . $this->brand . \" \" . $this->model;\n\
    \    }\n}\n\nclass Motorcycle {\n    private $brand;\n    private $model;\n  \
