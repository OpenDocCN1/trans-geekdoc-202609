    # Comment on why something is done, not what is done


    * * *


    Explain the reasoning behind code, not just describe its actions.


    * * *


    The following code demonstrates how to properly comment on the ''why'' rather
    than the ''what'' in PHP:


    < Good Code >


    // We need to ensure the user is logged in before accessing sensitive data


    if (!$user->isLoggedIn()) {


        // Redirect to login page if not authenticated


        header(''Location: /login.php'');


        exit;


    }


    // Retrieve user''s account balance


    $balance = $user->getAccountBalance();


    // Check if balance is below minimum threshold


    if ($balance < MINIMUM\_BALANCE) {


        // Notify user of low balance to prevent overdraft


        sendLowBalanceNotification($user);


    }


    <Bad Code>


    // Check if user is logged in


    if (!$user->isLoggedIn()) {


        // Redirect to login page


        header(''Location: /login.php'');


        exit;


    }


    // Get balance


    $balance = $user->getAccountBalance();


    // If balance is low


    if ($balance < MINIMUM\_BALANCE) {


        // Send notification


        sendLowBalanceNotification($user);


    }


    The good code example provides clear explanations for why each action is taken,
    such as ensuring authentication before accessing sensitive data and notifying
    users of low balances to prevent overdrafts. The bad code example merely describes
    what the code does without explaining the reasoning behind it, making it harder
    for other developers to understand the purpose and importance of each step.


    <Memo>


    Comments explaining ''why'' are often called "intent comments" and can significantly
    improve code maintainability.


    22


    # Use PHPDoc blocks for classes, methods, and properties


    * * *


    Utilize PHPDoc blocks to provide comprehensive documentation for classes, methods,
    and properties.


    * * *


    The following example demonstrates the proper use of PHPDoc blocks in a PHP class:


    < Good Code >


    /\*\*


    \* Represents a user account in the system.


    \*


    \* This class handles user-related operations such as


    \* authentication, profile management, and account balance.


    \*/


    class User


    {


        /\*\*


         \* The user''s current account balance.


         \*


         \* @var float


         \*/


        private $balance;


        /\*\*


         \* Authenticates the user with given credentials.


         \*


         \* @param string $username The user''s username


         \* @param string $password The user''s password


         \* @return bool True if authentication is successful, false otherwise


         \* @throws AuthenticationException If the authentication service is unavailable


         \*/


        public function authenticate(string $username, string $password): bool


        {


            // Authentication logic here


        }


        /\*\*


         \* Retrieves the user''s current account balance.


         \*


         \* @return float The current balance


         \*/


        public function getAccountBalance(): float


        {


            return $this->balance;


        }


    }


    <Bad Code>


    class User


    {


        private $balance;


        public function authenticate($username, $password)


        {


            // Authentication logic here


        }


        public function getAccountBalance()


        {


            return $this->balance;


        }


    }


    The good code example uses PHPDoc blocks to provide detailed information about
    the class, its properties, and methods. It includes descriptions, parameter types,
    return types, and potential exceptions. This makes the code more self-documenting
    and easier for other developers to understand and use. The bad code example lacks
    any documentation, making it difficult for others to quickly grasp the purpose
    and usage of the class and its members.


    <Memo>


    PHPDoc is based on JavaDoc and is supported by many IDEs for code completion and
    type hinting.


    23


    # Explain workarounds or hacks with comments


    * * *


    Provide clear comments to explain any workarounds or hacks in your code.


    * * *


    When you use a workaround or hack in your PHP code, it''s crucial to add comments
    explaining why it''s necessary and how it works.


    < Good Code >


    <?php


    // Workaround for PHP bug #12345: array\_merge\_recursive() does not preserve
    keys


    // This hack ensures keys are preserved by using a custom function


    function array\_merge\_recursive\_distinct(array &$array1, array &$array2) {


        $merged = $array1;


        foreach ($array2 as $key => &$value) {


            if (is\_array($value) && isset($merged\[$key\]) && is\_array($merged\[$key\]))
    {


                $merged\[$key\] = array\_merge\_recursive\_distinct($merged\[$key\],
    $value);


            } else {


                $merged\[$key\] = $value;


            }


        }


        return $merged;


    }


    ?>


    <Bad Code>


    <?php


    function array\_merge\_recursive\_distinct(array &$array1, array &$array2) {


        $merged = $array1;


        foreach ($array2 as $key => &$value) {


            if (is\_array($value) && isset($merged\[$key\]) && is\_array($merged\[$key\]))
    {


                $merged\[$key\] = array\_merge\_recursive\_distinct($merged\[$key\],
    $value);


            } else {


                $merged\[$key\] = $value;


            }


        }


        return $merged;


    }


    ?>


    In the good example, comments clearly explain the reason for the workaround and
    how it addresses a specific PHP bug. This makes the code more understandable for
    other developers. In the bad example, the lack of comments leaves the purpose
    and functionality of the workaround unclear.


    <Memo>


    PHP has a long history of bugs and quirks, and developers often need to implement
    workarounds. Documenting these workarounds helps maintain code quality and readability.


    24


    # Comment on non-obvious optimizations


    * * *


    Add comments to explain any non-obvious optimizations in your code.


    * * *


    When you implement optimizations that are not immediately clear, it''s important
    to comment on them to help other developers understand the reasoning behind your
    choices.


    < Good Code >


    <?php


    // Optimization: Using isset() instead of strlen() for checking empty strings


    // isset() is faster because it is a language construct and does not incur function
    call overhead


    function isEmptyString($str) {


        return !isset($str\[0\]);


    }


    ?>


    <Bad Code>


    <?php


    function isEmptyString($str) {


        return !isset($str\[0\]);


    }


    ?>


