    \n<Memo>\n\nTraits 在 PHP 5.4 中引入，用于促进 PHP 这种单继承语言中的代码复用。\n\n97\n\n# 在类层次级中为共享行为实现抽象类\n\
    \n使用抽象类为相关类定义通用行为和结构。\n\n以下代码演示了如何使用抽象类为不同类型的车辆定义共享行为。\n\n### < Good Code >\n\n\
    ```php\n// 车辆抽象类\nabstract class Vehicle {\n    protected $brand;\n    protected\
    \ $model;\n    // 构造函数\n    public function __construct($brand, $model) {\n  \
    \      $this->brand = $brand;\n        $this->model = $model;\n    }\n    // 子类需要实现的抽象方法\n\
    \    abstract public function getType();\n    // 所有车辆共享的方法\n    public function\
    \ getInfo() {\n        return \"This is a \" . $this->getType() . \" - \" . $this->brand\
    \ . \" \" . $this->model;\n    }\n}\n\n// 继承 Vehicle 的 Car 类\nclass Car extends\
    \ Vehicle {\n    public function getType() {\n        return \"Car\";\n    }\n\
    }\n\n// 继承 Vehicle 的 Motorcycle 类\nclass Motorcycle extends Vehicle {\n    public\
    \ function getType() {\n        return \"Motorcycle\";\n    }\n}\n\n// 使用\n$car\
    \ = new Car(\"Toyota\", \"Corolla\");\necho $car->getInfo(); // 输出: This is a\
