    The good code example separates different levels of abstraction into distinct
    methods. The sendWelcomeEmail() method provides a high-level overview of the process,
    while lower-level details are handled by separate methods like prepareWelcomeEmailContent(),
    getWelcomeEmailTemplate(), and sendEmail(). This separation makes the code more
    modular, easier to understand, and simpler to maintain or extend.


    The bad code example combines all operations in a single method, mixing high-level
    logic with low-level details. This approach can make the code harder to read,
    understand, and maintain, especially as the complexity of the operations increases.


    <Memo>


    This principle is related to the Single Responsibility Principle (SRP) from SOLID
    principles, which states that a class or method should have only one reason to
    change.


    63


    # Use pure functions that don''t modify state


    * * *


    Write functions that always produce the same output for given inputs and don''t
    modify external state.


    * * *


    The following code demonstrates a pure function that calculates the sum of an
    array without modifying the original data:


    < Good Code >


    /\*\*


    \* Calculate the sum of an array of numbers


    \*


    \* @param array $numbers Array of numbers to sum


    \* @return int The sum of all numbers in the array


    \*/


    function calculateSum(array $numbers): int


    {


        // Use array\_reduce to sum all elements without modifying the original array


        return array\_reduce($numbers, function($carry, $item) {


            return $carry + $item;


        }, 0);


    }


    // Example usage


    $myNumbers = \[1, 2, 3, 4, 5\];


    $sum = calculateSum($myNumbers);


    echo "Sum: " . $sum; // Output: Sum: 15


    // Original array remains unchanged


    print\_r($myNumbers); // Output: Array ( \[0\] => 1 \[1\] => 2 \[2\] => 3 \[3\]
    => 4 \[4\] => 5 )


    <Bad Code>


    /\*\*


    \* Calculate the sum of an array of numbers (impure function)


    \*


    \* @param array $numbers Array of numbers to sum


    \* @return int The sum of all numbers in the array


    \*/


    function calculateSum(array &$numbers): int


    {


        $sum = 0;


        // Modify the original array while calculating the sum


        foreach ($numbers as &$number) {


            $sum += $number;


            $number \*= 2; // Modify each number in the array


        }


        return $sum;


    }


    // Example usage


    $myNumbers = \[1, 2, 3, 4, 5\];


    $sum = calculateSum($myNumbers);


    echo "Sum: " . $sum; // Output: Sum: 15


    // Original array is modified


    print\_r($myNumbers); // Output: Array ( \[0\] => 2 \[1\] => 4 \[2\] => 6 \[3\]
    => 8 \[4\] => 10 )


    The good code example demonstrates a pure function that calculates the sum of
    an array without modifying the original data. It uses array\_reduce to iterate
    through the array and sum its elements. The function always produces the same
    output for the same input and doesn''t have any side effects.


    The bad code example shows an impure function that modifies the original array
    while calculating the sum. It uses a reference parameter and modifies each element
    of the array during the calculation. This approach can lead to unexpected behavior
    and makes the code harder to reason about and test.


    <Memo>


    Pure functions are a key concept in functional programming and can lead to more
    predictable and easier-to-test code.


    64


    # Implement single responsibility principle for classes and methods


    * * *


    Design classes and methods that have a single, well-defined responsibility to
    improve code organization and maintainability.


    * * *


    The following code demonstrates the Single Responsibility Principle by separating
    user data management and email functionality:


    < Good Code >


    /\*\*


    \* User class responsible for managing user data


    \*/


    class User


    {


        private $name;


        private $email;


        /\*\*


         \* Constructor to initialize user data


    \*


         \* @param string $name User''s name


         \* @param string $email User''s email


         \*/


        public function \_\_construct(string $name, string $email)


        {


            $this->name = $name;


            $this->email = $email;


        }


        /\*\*


         \* Get user''s email


    \*


         \* @return string User''s email


         \*/


        public function getEmail(): string


        {


            return $this->email;


        }


        // Other user-related methods...


    }


    /\*\*


    \* EmailService class responsible for sending emails


    \*/


    class EmailService


    {


        /\*\*


         \* Send a welcome email to a user


    \*


         \* @param User $user User to send email to


         \* @return bool True if email sent successfully, false otherwise


         \*/


        public function sendWelcomeEmail(User $user): bool


        {


            $to = $user->getEmail();


            $subject = "Welcome to our service!";


            $message = "Thank you for joining our platform.";


            // Email sending logic here...


            return mail($to, $subject, $message);


        }


        // Other email-related methods...


    }


    // Usage example


    $user = new User("John Doe", "john@example.com");


    $emailService = new EmailService();


    $emailService->sendWelcomeEmail($user);


    <Bad Code>


    /\*\*


    \* User class with mixed responsibilities


    \*/


    class User


    {


        private $name;


        private $email;


        /\*\*


         \* Constructor to initialize user data


    \*


         \* @param string $name User''s name


         \* @param string $email User''s email


         \*/


        public function \_\_construct(string $name, string $email)


        {


            $this->name = $name;


            $this->email = $email;


        }


        /\*\*


         \* Send a welcome email to the user


    \*


         \* @return bool True if email sent successfully, false otherwise


         \*/


        public function sendWelcomeEmail(): bool


        {


            $to = $this->email;


            $subject = "Welcome to our service!";


            $message = "Thank you for joining our platform.";


            // Email sending logic here...


            return mail($to, $subject, $message);


        }


        // Other user-related and email-related methods mixed together...


    }


    // Usage example


    $user = new User("John Doe", "john@example.com");


    $user->sendWelcomeEmail();


    The good code example demonstrates the Single Responsibility Principle by separating
    user data management (User class) from email functionality (EmailService class).
    This separation of concerns makes the code more modular, easier to maintain, and
    allows for better testing and future extensions.


    The bad code example violates the Single Responsibility Principle by combining
    user data management and email sending functionality in a single User class. This
    approach makes the class less focused, harder to maintain, and more difficult
    to test or modify independently.


    <Memo>


    The Single Responsibility Principle is one of the five SOLID principles of object-oriented
    programming and design, introduced by Robert C. Martin.


