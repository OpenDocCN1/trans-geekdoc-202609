    \n// Usage\n$p = [10.99, 24.99, 5.99];\n$t = 8.5;\n$d = 10;\n$f = calc($p, $t,\
    \ $d);\necho \"Result: $\" . number_format($f, 2);\n```\n\nThe good code example\
    \ uses descriptive variable names that clearly indicate their purpose, such as\
    \ `$itemPrices`, `$taxRate`, and `$discountPercentage`. This makes the code more\
    \ readable and self-explanatory. The bad code example uses single-letter variables\
    \ like `$a`, `$b`, and `$c`, which make it difficult to understand the purpose\
    \ of each variable without additional context or comments.\n\n<Memo>\nThe practice\
    \ of using descriptive variable names is part of a broader concept called \"self-documenting\
    \ code,\" which aims to make code more readable and maintainable without relying\
    \ heavily on comments.\n\n58\n\n# Avoid global variables, use dependency injection\n\
    \n***\n\nInstead of using global variables, pass dependencies as parameters to\
    \ functions or methods.\n\n***\n\nThe following code demonstrates the difference\
    \ between using global variables and dependency injection in a simple logging\
    \ system.\n\n## < Good Code >\n\n```php\n// Logger class with dependency injection\n\
    class Logger {\n    private $logFile;\n    public function __construct($logFile)\
    \ {\n        $this->logFile = $logFile;\n    }\n    public function log($message)\
    \ {\n        $timestamp = date('Y-m-d H:i:s');\n        $logEntry = \"$timestamp:\
    \ $message\\n\";\n        file_put_contents($this->logFile, $logEntry, FILE_APPEND);\n\
    \    }\n}\n\n// Usage example\n$logger = new Logger('/path/to/app.log');\nfunction\
    \ processOrder($orderId, Logger $logger) {\n    // Process order logic here\n\
    \    $logger->log(\"Order $orderId processed successfully\");\n}\n\n// Using the\
    \ logger\n$orderId = 12345;\nprocessOrder($orderId, $logger);\n```\n\n## <Bad\
    \ Code>\n\n```php\n// Global variable for log file\n$GLOBALS['logFile'] = '/path/to/app.log';\n\
    \n// Logger function using global variable\nfunction logMessage($message) {\n\
    \    global $logFile;\n    $timestamp = date('Y-m-d H:i:s');\n    $logEntry =\
    \ \"$timestamp: $message\\n\";\n    file_put_contents($logFile, $logEntry, FILE_APPEND);\n\
    }\n\n// Usage example\nfunction processOrder($orderId) {\n    // Process order\
    \ logic here\n    logMessage(\"Order $orderId processed successfully\");\n}\n\n\
    // Using the logger\n$orderId = 12345;\nprocessOrder($orderId);\n```\n\nThe good\
    \ code example uses dependency injection by passing the `Logger` object as a parameter\
    \ to the `processOrder` function. This approach makes the code more modular, testable,\
    \ and easier to maintain. The bad code example uses a global variable `$GLOBALS['logFile']`\
    \ and a global function `logMessage`, which can lead to tight coupling and make\
    \ it difficult to test.\n\n<Memo>\nThe practice of using descriptive variable\
    \ names is part of a broader concept called \"self-documenting code,\" which aims\
    \ to make code more readable and maintainable without relying heavily on comments.\n\
    \n59\n\n# Use constants for fixed values\n\n***\n\nUsing constants for fixed values\
    \ improves readability and maintainability.\n\n***\n\nConstants are for values\
    \ that do not change.\n\n## < Good Code >\n\n```php\n<?php\ndefine('TAX_RATE',\
    \ 0.08);\n\n// Function to calculate tax\nfunction calculate($price) {\n    return\
    \ $price * TAX_RATE;\n}\n\n// Usage\n$price = 100;\necho \"Tax: \" . calculate($price);\
    \ // Outputs: 8\n```\n\n## <Bad Code>\n\n```php\n<?php\n// Function to calculate\
    \ tax\nfunction calculate($price) {\n    return $price * 0.08;\n}\n\n// Usage\n\
    $price = 100;\necho \"Tax: \" . calculate($price); // Outputs: 8\n?>\n```\n\n\
    In the good example, the `TAX_RATE` is defined as a constant. In the bad example,\
    \ the value `0.08` is hardcoded, which makes it harder to maintain if the rate\
    \ changes.\n\n60\n\n# Employ static variables for state\n\n***\n\nStatic variables\
    \ retain state across function calls.\n\n***\n\nStatic variables are useful for\
    \ counting or caching.\n\n## < Good Code >\n\n```php\n<?php\nfunction incrementCounter()\
    \ {\n    static $count = 0;\n    $count++;\n    return $count;\n}\n\n// Usage\n\
    echo incrementCounter(); // Outputs: 1\necho incrementCounter(); // Outputs: 2\n\
    ?>\n```\n\n## <Bad Code>\n\n```php\n<?php\nfunction incrementCounter() {\n   \
    \ $count = 0;\n  $count++;\n    return $count;\n}\n\n// Usage\necho incrementCounter();\
    \ // Outputs: 1\necho incrementCounter(); // Outputs: 1\n?>\n```\n\nIn the good\
    \ example, the `$count` variable persists between calls. In the bad example, the\
    \ variable is reinitialized to 0 every time the function is called.\n\n61\n\n\
    # Extract complex conditions into well-named methods\n\n***\n\nImprove code readability\
    \ by extracting complex conditions into well-named methods.\n\n***\n\nThe following\
    \ code demonstrates how to extract a complex condition into a well-named method.\n\
    \n## < Good Code >\n\n```php\n<?php\nclass Order {\n    public function isEligibleForDiscount()\
    \ {\n        if ($this->isVIPCustomer() && $this->hasValidCoupon()) {\n      \
    \      return true;\n        }\n        return false;\n    }\n\n    private function\
    \ isVIPCustomer() {\n        // logic\n        return true;\n    }\n\n    private\
    \ function hasValidCoupon() {\n        // logic\n        return true;\n    }\n\
    }\n?>\n```\n\n## <Bad Code>\n\n```php\n<?php\nclass Order {\n    public function\
    \ isEligibleForDiscount() {\n        if ($this->customerType === 'VIP' && $this->couponStatus\
    \ === 'ACTIVE') {\n            return true;\n        }\n        return false;\n\
    \    }\n}\n?>\n```\n\nThe good code example extracts the complex condition into\
    \ a well-named method `isEligibleForDiscount()`. It further breaks down the condition\
    \ into two separate methods: `isVIPCustomer()` and `hasValidCoupon()`. This approach\
    \ makes the code more readable and self-explanatory.\n\nThe bad code example,\
    \ while shorter, combines multiple conditions in a single line, making it harder\
    \ to understand at a glance and potentially more difficult to maintain or modify\
    \ in the future.\n"
