- raw: 'Simplify code by using array destructuring to assign multiple variables at
    once.


    * * *


    The following code demonstrates how to use array destructuring for cleaner multiple
    variable assignments in PHP.


    < Good Code >


    // Function that returns an array of user details


    function getUserDetails() {


        return \[''John Doe'', 30, ''john@example.com''\];


    }


    // Use array destructuring to assign multiple variables


    \[$name, $age, $email\] = getUserDetails();


    // Use the assigned variables


    echo "Name: $name, Age: $age, Email: $email";


    <Bad Code>


    // Function that returns an array of user details


    function getUserDetails() {


        return \[''John Doe'', 30, ''john@example.com''\];


    }


    // Assign variables individually


    $userDetails = getUserDetails();


    $name = $userDetails\[0\];


    $age = $userDetails\[1\];


    $email = $userDetails\[2\];


    // Use the assigned variables


    echo "Name: $name, Age: $age, Email: $email";


    The good code example uses array destructuring to assign multiple variables in
    a single line, making the code more concise and readable. The bad code example
    assigns each variable individually, which is more verbose and prone to errors
    if the array structure changes.


    <Memo>


    Array destructuring was introduced in PHP 7.1 and provides a convenient way to
    unpack arrays into distinct variables.


    75


    # Employ the null coalescing assignment operator (??=) for concise default assignments


    * * *


    Use ??= to assign default values efficiently in PHP 7.4+


    * * *


    The following code demonstrates how to use the null coalescing assignment operator
    (??=) to set default values for variables:


    < Good Code >


    // Good code using null coalescing assignment operator


    function getUserSettings($userId) {


        $settings = fetchUserSettings($userId);


        // Set default values using ??=


        $settings\[''theme''\] ??= ''light'';


        $settings\[''notifications''\] ??= true;


        $settings\[''language''\] ??= ''en'';


        return $settings;


    }


    <Bad Code>


    // Bad code without using null coalescing assignment operator


    function getUserSettings($userId) {


        $settings = fetchUserSettings($userId);


        // Set default values using traditional method


        if (!isset($settings\[''theme''\])) {


            $settings\[''theme''\] = ''light'';


        }


        if (!isset($settings\[''notifications''\])) {


            $settings\[''notifications''\] = true;


        }


        if (!isset($settings\[''language''\])) {


            $settings\[''language''\] = ''en'';


        }


        return $settings;


    }


    The good code example uses the ??= operator to concisely set default values for
    array keys. This operator assigns the right-hand value only if the left-hand variable
    is null or doesn''t exist. It''s more readable and reduces the number of lines
    compared to the bad code example, which uses traditional if statements to check
    and set default values.


    <Memo>


    The null coalescing assignment operator (??=) was introduced in PHP 7.4 as a shorthand
    for the common pattern of checking and assigning default values.


    76


    # Extract configuration into separate files


    * * *


    Improve code maintainability by separating configuration from logic


    * * *


    The following example shows how to extract configuration settings into a separate
    file:


    < Good Code >


    // config.php


    return \[


        ''database'' => \[


            ''host'' => ''localhost'',


            ''username'' => ''user'',


            ''password'' => ''password'',


            ''dbname'' => ''myapp''


        \],


        ''api\_key'' => ''your\_api\_key\_here'',


        ''debug\_mode'' => true


    \];


    // main.php


    $config = require ''config.php'';


    // Use configuration


    $dbHost = $config\[''database''\]\[''host''\];


    $apiKey = $config\[''api\_key''\];


    <Bad Code>


    // Bad practice: Mixing configuration with application logic


    $dbHost = ''localhost'';


    $dbUsername = ''user'';


    $dbPassword = ''password'';


    $dbName = ''myapp'';


    $apiKey = ''your\_api\_key\_here'';


    $debugMode = true;


    // Application logic


    function connectToDatabase() {


        global $dbHost, $dbUsername, $dbPassword, $dbName;


        // Database connection code here


    }


    function makeApiCall() {


        global $apiKey;


        // API call code here


    }


    The good code example separates configuration into a dedicated file (config.php),
    which returns an array of settings. This approach makes it easier to manage and
    update configuration without modifying the main application code. The bad code
    example mixes configuration directly with application logic, making it harder
    to maintain and update settings across the application.


    <Memo>


    Separating configuration from code is a key principle in the 12-factor app methodology,
    which aims to build software-as-a-service apps that are scalable and maintainable.


    77


    # Move utility functions to a separate class or namespace


    * * *


    Organize utility functions into a dedicated class or namespace to improve code
    readability and maintainability.


    * * *


    Utility functions are often used across multiple parts of an application. By moving
    them to a separate class or namespace, you can keep your codebase clean and modular,
    making it easier for others to understand and maintain.


    < Good Code >


    <?php


    namespace App\\Utils;


    /\*\*


    \* Utility class for common functions


    \*/


    class StringUtils {


        /\*\*


         \* Convert a string to camel case


         \*


         \* @param string $string


         \* @return string


         \*/


        public static function toCamelCase(string $string): string {


            $result = strtolower($string);


            preg\_match\_all(''/\[a-zA-Z0-9\]+/'', $result, $matches);


            $result = $matches\[0\]\[0\];


            for ($i = 1; $i < count($matches\[0\]); $i++) {


                $result .= ucfirst($matches\[0\]\[$i\]);


            }


            return $result;


        }


    }


    // Usage


    echo \\App\\Utils\\StringUtils::toCamelCase(''hello\_world''); // Outputs: helloWorld


    ?>


    <Bad Code>


    <?php


    /\*\*


    \* Convert a string to camel case


    \*


    \* @param string $string


    \* @return string


    \*/


    function toCamelCase($string) {


        $result = strtolower($string);


        preg\_match\_all(''/\[a-zA-Z0-9\]+/'', $result, $matches);


        $result = $matches\[0\]\[0\];


        for ($i = 1; $i < count($matches\[0\]); $i++) {


            $result .= ucfirst($matches\[0\]\[$i\]);


        }


        return $result;


    }


    // Usage


    echo toCamelCase(''hello\_world''); // Outputs: helloWorld


    ?>


    In the good example, the utility function toCamelCase is encapsulated within a
    StringUtils class under the App\\Utils namespace. This organization makes it clear
    where utility functions are located and avoids potential naming conflicts. In
    the bad example, the function is defined in the global scope, which can lead to
    clutter and conflicts in larger codebases.


    <Memo>


    Namespaces in PHP were introduced in version 5.3 to help avoid name collisions
    and to organize code into logical groups.


    78


    # Use traits for cross-cutting concerns


    * * *


    Utilize traits to encapsulate methods that are shared across multiple classes,
    promoting code reuse and reducing duplication.


    * * *


    Traits allow you to reuse sets of methods in multiple classes. This is particularly
    useful for cross-cutting concerns like logging, validation, or authorization,
    where the same functionality is needed in different parts of your application.


    < Good Code >


    <?php


    namespace App\\Traits;


    /\*\*


    \* Trait for logging functionality


    \*/


    trait Logger {


        /\*\*


         \* Log a message


         \*


         \* @param string $message


         \*/


        public function log(string $message) {


            echo "\[LOG\]: " . $message . "\\n";


        }


    }


    class User {


        use \\App\\Traits\\Logger;


        public function createUser() {


            // User creation logic


            $this->log("User created successfully.");


        }


    }


    class Product {


        use \\App\\Traits\\Logger;


        public function createProduct() {


            // Product creation logic


            $this->log("Product created successfully.");


        }


    }


    // Usage


    $user = new User();


    $user->createUser(); // Outputs: \[LOG\]: User created successfully.


    $product = new Product();'
