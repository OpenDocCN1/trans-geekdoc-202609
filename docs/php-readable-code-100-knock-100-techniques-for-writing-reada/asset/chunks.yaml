    }


    The good code example extracts complex validation logic into a dedicated UserValidator
    class. This approach improves code organization, makes the validation rules more
    reusable across different parts of the application, and separates concerns. It
    also allows for easier testing of validation logic in isolation.


    The bad code example mixes validation logic directly within the user registration
    function. This approach makes the function longer, harder to read, and less maintainable.
    It also makes it difficult to reuse the validation logic in other parts of the
