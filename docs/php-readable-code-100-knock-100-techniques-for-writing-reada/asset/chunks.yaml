    \ = new UserService();\n$user = $userService->getUserById(1);\n```\n\nThe good\
    \ code example uses dependency injection by accepting a `DatabaseInterface` in\
    \ the constructor. This allows for easier testing as you can inject a mock database\
    \ object. The bad code directly instantiates the `database`, making it difficult\
    \ to test in isolation or swap implementations.\n\n<Memo>\nDependency injection\
    \ is one of the SOLID principles, specifically the Dependency Inversion Principle\
    \ (`DIP`).\n</Memo>\n\n32\n\n# Use null coalescing operator (??) for concise null\
    \ checks\n\nThe null coalescing operator (`??`) provides a concise way to handle\
