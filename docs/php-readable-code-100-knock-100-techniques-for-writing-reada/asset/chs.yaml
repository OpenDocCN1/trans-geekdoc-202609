  \n> **备忘**\n> 标准 PHP 库 (SPL) 在 PHP 5.0.0 中引入，提供了一组用于解决常见问题的接口和类。\n> 21\n\n# 注释“为什么这样做”，而不是“做了什么”\n\
  \n解释代码背后的逻辑，而不仅仅是描述它的动作。\n\n以下代码演示了如何在 PHP 中正确地注释“为什么”而不是“什么”：\n\n**良好的代码**\n```php\n\
  // 我们需要确保在访问敏感数据之前用户已登录\nif (!$user->isLoggedIn()) {\n    // 如果未身份验证，则重定向到登录页面\n\
  \    header('Location: /login.php');\n    exit;\n}\n// 获取用户的账户余额\n$balance = $user->getAccountBalance();\n\
  // 检查余额是否低于最低阈值\nif ($balance < MINIMUM_BALANCE) {\n    // 通知用户余额低以防止透支\n    sendLowBalanceNotification($user);\n\
  }\n```\n\n**糟糕的代码**\n```php\n// 检查用户是否已登录\nif (!$user->isLoggedIn()) {\n    // 重定向到登录页面\n\
  \    header('Location: /login.php');\n    exit;\n}\n// 获取余额\n$balance = $user->getAccountBalance();\n\
  // 如果余额低\nif ($balance < MINIMUM_BALANCE) {\n    // 发送通知\n    sendLowBalanceNotification($user);\n\
  }\n```\n\n良好的代码示例为采取每个操作的原因提供了清晰的解释，例如在访问敏感数据之前确保身份验证，以及通知用户余额低以防止透支。糟糕的代码示例仅描述了代码做了什么，而没有解释其背后的逻辑，这使得其他开发者难以理解每一步的目的和重要性。\n\
  \n> **备忘**\n> 解释“为什么”的注释通常被称为“意图注释”，可以显著提高代码的可维护性。\n> 22\n\n# 为类、方法和属性使用 PHPDoc\
  \ 块\n\n利用 PHPDoc 块为类、方法和属性提供全面的文档。\n\n以下示例演示了在 PHP 类中正确使用 PHPDoc 块的方法：\n\n**良好的代码**\n\
  ```php\n/**\n * 代表系统中的用户账户。\n *\n * 此类处理用户相关的操作，如\n * 身份验证、配置管理和账户余额。\n */\nclass\
  \ User\n{\n    /**\n     * 用户当前的账户余额。\n     *\n     * @var float\n     */\n    private\
  \ $balance;\n\n    /**\n     * 使用给定的凭据验证用户。\n     *\n     * @param string $username\
  \ 用户名\n     * @param string $password 用户密码\n     * @return bool 如果身份验证成功为真，否则为假\n\
  \     * @throws AuthenticationException 如果身份验证服务不可\n     */\n    public function\
  \ authenticate(string $username, string $password): bool\n    {\n        // 身份验证逻辑在此\n\
  \    }\n\n    /**\n     * 获取用户的账户余额。\n     *\n     * @return float 当前余额\n     */\n\
  \    public function getAccountBalance(): float\n    {\n        return $this->balance;\n\
  \    }\n}\n```\n\n**糟糕的代码**\n```php\nclass User\n{\n    private $balance;\n    public\
  \ function authenticate($username, $password)\n    {\n        // 身份验证逻辑在此\n    }\n\
  \    public function getAccountBalance()\n    {\n        return $this->balance;\n\
  \    }\n}\n```\n\n良好的代码示例使用 PHPDoc 块提供了关于类、属性和方法的详细信息。包含了描述、参数类型、返回类型和潜在的异常。这使得代码更具自文档性，更容易让其他开发者理解。糟糕的代码示例缺乏任何文档，使得他人难以掌握类的目的和用法。\n\
  \n> **备忘**\n> PHPDoc 基于 JavaDoc，许多 IDE 都支持其代码补全和类型提示。\n> 23\n\n# 解释临时解决方案或黑科技（hacks）\n\
  \n提供清晰的注释来解释你代码中的任何临时解决方案或黑科技。\n\n当你在 PHP 代码中使用临时解决方案或黑科技时，添加注释来解释其必要性以及其工作原理至关重要。\n\
  \n**良好的代码**\n```php\n<?php\n// 针对 PHP bug #23 的临时解决方案：array_merge_recursive() 不保留键\n\
  // 此黑科技通过使用自定义函数确保键被保留\nfunction array_merge_distinct(array &$array1, array &$array2)\
  \ {\n    $merged = $array1;\n    foreach ($array2 as $key => &$value) {\n      \
  \  if (is_array($value) && isset($merged[$key]) && is_array($merged[$key])) {\n\
  \            $merged[$key] = array_merge_distinct($merged[$key], $value);\n    \
  \    } else {\n            $merged[$key] = $value;\n        }\n    }\n}\n```\n\n\
  **糟糕的代码**\n```php\n<?php\nfunction array_merge_distinct(array &$array1, array &$array2)\
  \ {\n    $merged = $array1;\n    foreach ($array2 as $key => &$value) {\n      \
  \  if (is_array($value) && isset($merged[$key]) && is_array($merged[$key])) {\n\
  \            $merged[$key] = array_merge_distinct($merged[$key], $value);\n    \
  \    } else {\n            $merged[$key] = $value;\n        }\n    }\n}\n?>\n```\n\
  *(注：由于原文代码块在示例中似乎存在排版错乱，翻译时保持了逻辑结构并修正了可读性)*\n\n**纠正上述代码逻辑的翻译呈现：**\n\n```php\n<?php\n\
  // 针对 PHP bug #23 的临时解决方案：array_merge_recursive() 不保留键\n// 此黑科技通过使用自定义函数确保键被保留\n\
  function array_merge_distinct(array &$array1, array &$array2) {\n    $merged = $array1;\n\
  \    foreach ($array2 as $key => &$value) {\n        if (is_array($value) && isset($merged[$key])\
  \ && is_array($merged[$key])) {\n            $merged[$key] = array_merge_distinct($merged[$key],\
  \ $value);\n        } else {\n            $merged[$key] = $value;\n        }\n \
  \   }\n    return $merged;\n}\n?>\n```\n\n良好的示例清晰地解释了临时解决方案的原因以及它是如何解决问题的。这使得代码更易于理解。糟糕的示例缺乏注释，导致临时解决方案的目的和功能不明确。\n\
  \n> **备忘**\n> PHP 拥有很长的 bug 历史，开发者经常需要实现临时解决方案。记录这些临时解决方案有助于维护代码质量。\n> 24\n\n# 解释非直观的优化\n\
  \n添加清晰的注释来解释代码中非显而易见的优化。\n\n当你实现并非显而易见的优化时，对它们进行注释是非常重要的，以帮助其他开发者理解你的选择。\n\n**良好的代码**\n\
  ```php\n<?php\n// 优化：使用 isset() 代替 strlen() 检查字符串\n// isset() 更快，因为它是一个语言构造且不会产生函数调用开销\n\
  function isEmptyString($str) {\n    return !isset($str[0]);\n}\n?>\n```\n\n**糟糕的代码**\n\
  ```php\n<?php\nfunction isEmptyString($str) {\n    return !isset($str[0]);\n}\n\
  ?>\n```\n\n良好的示例通过注释解释了为什么使用 `isset()` 代替 `strlen()`，为优化提供了背景。这有助于其他开发者理解性能优势。糟糕的示例缺乏注释，使得优化变得不直观且难以理解。\n\
  \n> **备忘**\n> PHP 的 `isset()` 函数常用于性能优化，因为它是一个语言构造，运行速度比许多内置函数快。\n> 25\n\n# 使用 TODO\
  \ 注释标记未来的改进或已知问题\n\nTODO 注释有助于跟踪代码中的未来改进或已知问题。\n\n在 PHP 代码中使用 TODO 注释是一种简单而有效的方法，可以提醒自己或告知他人需要进一步处理或存在已知区域。\n\
  \n**良好的代码**\n```php\n<?php\n// TODO: 重构此函数以提高性能\nfunction calculateSum($numbers)\
  \ {\n    $sum = 0;\n    foreach ($numbers as $number) {\n        $sum += $number;\n\
  \    }\n    return $sum;\n}\n?>\n```\n\n\n\n\n\n```php\n// TODO: 处理空数组的边界情况\n\n\
  $result = calculateSum([1, 2, 3, 4, 5]);\n\necho $result;\n\n?>\n```\n\n### <Bad\
  \ Code>\n\n```php\n<?php\n\nfunction calculateSum($numbers) {\n    $sum = 0;\n \
  \   foreach ($numbers as $number) {\n        $sum += $number;\n    }\n    return\
  \ $sum;\n}\n\n$result = calculateSum([1, 2, 3, 4, 5]);\n\necho $result;\n\n?>\n\
  ```\n\n在良好的示例中，TO DO 注释清晰地指示了需要改进或额外处理的区域。这使得开发者更容易理解未来需要解决的问题。坏的示例缺少这些注释，使得跟踪必要的更改或改进变得更加困难。\n\
  \n#### <Memo>\n“TODO”术语在许多编程语言和 IDE 中常用，用于标记需要完成的任务。某些 IDE 甚至提供了特殊功能来列出项目中所有的 `TODO`\
  \ 注释。\n\n26\n\n# 保持注释随代码更改更新\n\n确保注释准确反映代码的当前状态。\n\n保持注释随代码更改更新对于维护代码的可读性以及防止开发者之间的混淆至关重要。\n\
  \n### < Good Code >\n\n```php\n<?php\n\n// 此函数计算数字数组之和\n\nfunction calculateSum($numbers)\
  \ {\n    $sum = 0;\n    foreach ($numbers as $number) {\n        $sum += $number;\n\
  \    }\n    return $sum;\n}\n// 计算给定数组之和\n$result = calculateSum([1, 2, 3, 4, 5]);\n\
  \necho $result;\n\n?>\n```\n\n### <Bad Code>\n\n```php\n<?php\n\n// 此函数乘以数组中的所有数字\n\
  \nfunction calculateSum($numbers) {\n    $sum = 0;\n    foreach ($numbers as $number)\
  \ {\n        $sum += $number;\n    }\n    return $sum;\n}\n\n// 计算给定数组之和\n$result\
  \ = calculateSum([1, 2, 3, 4, 5]);\n\necho $result;\n\n?>\n```\n\n在良好的示例中，注释准确地描述了函数及其目的，使得其他开发者更容易理解代码。在坏的示例中，注释错误地陈述函数是乘以数字，这可能会导致混淆和错误。\n\
  \n#### <Memo>\n在软件开发中持续更新注释是一种最佳实践。某些团队甚至将注释更新作为代码审查过程的一部分，以确保准确性和清晰度。\n\n27\n\n\
  # 删除注释掉的代码\n\n删除未使用的代码而不是将其注释掉，以提高代码的可读性和维护性。\n\n以下示例演示了如何处理未使用的代码：\n\n### < Good\
  \ Code >\n\n```php\n<?php\nfunction calculateTotal($price, $quantity) {\n    $total\
  \ = $price * $quantity;\n    $tax = $total * 0.1;\n    return $total + $tax;\n}\n\
  $result = calculateTotal(10, 5);\necho \"Total: $\" . number_format($result, 2);\n\
  \n?>\n```\n\n### <Bad Code>\n\n```php\n<?php\nfunction calculateTotal($price, $quantity)\
  \ {\n    $total = $price * $quantity;\n    $tax = $total * 0.1;\n    return $total\
  \ + $tax;\n    // 旧的计算方法\n    // $oldTotal = $price * $quantity;\n    // return\
  \ $total;\n}\n$result = calculateTotal(10, 5);\necho \"Total: $\" . number_format($result,\
  \ 2);\n// echo \"Old total: $\" . number_format($result, 2);\n\n?>\n```\n\n良好的代码示例展示了清晰的实现，没有任何注释掉的代码。坏的代码示例包含了不必要的注释代码，这会弄乱函数并降低可读性。与其将旧代码作为注释保留，不如将其完全删除并依赖版本控制。\n\
  \n#### <Memo>\n像 Git 这样的版本控制系统允许开发者访问之前的版本，因此没有将旧代码作为注释保留。\n\n28\n\n# 在注释中使用清晰简洁的语言\n\
  \n编写简短、信息量丰富且易于理解的注释以增强理解。\n\n以下示例展示了如何编写有效的注释：\n\n### < Good Code >\n\n```php\n\
  <?php\n// 计算包含税的最终价格\nfunction calculateFinalPrice($basePrice, $taxRate) {\n   \
  \ // 对基础价格应用税率\n    $taxAmount = $basePrice * $taxRate;\n    $finalPrice = $basePrice\
  \ + $taxAmount;\n    return $finalPrice;\n}\n// 使用示例\n$basePrice = 100;\n$taxRate\
  \ = 0.08;\n$result = calculateFinalPrice($basePrice, $taxRate);\necho \"Final price:\
  \ $\" . number_format($result, 2);\n\n?>\n```\n\n### <Bad Code>\n\n```php\n<?php\n\
  // 此函数将基础价格和税率作为输入\n// 它将通过在基础价格上加上税额来计算最终价格\n// 税额是通过基础价格乘以税率计算的\nfunction calculateFinalPrice($basePrice,\
  \ $taxRate) {\n    // 在这里我们计算税额\n    $taxAmount = $basePrice * $taxRate;\n    //\
  \ 现在我们将税额加到基础价格上以获得最终价格\n    $finalPrice = $basePrice + $taxAmount;\n    // 最后，我们返回最终价格\n\
  \    return $finalPrice;\n}\n// 现在我们将使用该函数\n$basePrice = 100; // 基础价格\n$taxRate\
  \ = 0.08; // 税率 (8%)\n$result = calculateFinalPrice($basePrice, $taxRate);\necho\
  \ \"Final price: $\" . number_format($result, 2); // 输出结果\n\n?>\n```\n\n良好的代码示例使用了简洁且有信息的注释，没有冗余。坏的示例包含了过度冗长的注释，使得代码难以阅读。良好的注释应该解释“为什么”这样做，而不是“在做什么”，代码本身应该是自解释的。\n\
  \n#### <Memo>\n“自说明代码”的概念表明，良好的代码应该是清晰的，减少对解释性注释的需求。\n\n29\n\n# 避免重复代码的注释\n\n编写自解释的代码，避免编写仅仅复述代码行为的注释。\n\
  \n以下示例演示了如何在 PHP 代码中避免冗余注释：\n\n### < Good Code >\n\n```php\nfunction calculateTotalPrice($price,\
  \ $quantity) {\n    $subtotal = $price * $quantity;\n    $tax = $subtotal * 0.1;\n\
  \    return $subtotal + $tax;\n}```\n\n### <Bad Code>\n\n```php\n// 计算总价的函数\nfunction\
  \ calculateTotalPrice($price, $quantity) {\n    // 计算小计\n    $subtotal = $price\
  \ * $quantity;\n    // 计算税费\n    $tax = $subtotal * 0.1;\n    // 返回总价\n    return\
  \ $subtotal + $tax;\n}```\n\n良好的代码示例是自解释的，不需要注释。函数名和变量清晰地传达了其目的。坏的代码示例包含了仅仅重复代码行为的冗余注释，没有提供额外的价值。\n\
  \n#### <Memo>\nRobert C. Martin 的著作《清洁之道》强调，良好的代码应该是自说明的，减少对解释性注释的需求。\n\n30\n\n\
  #谨慎使用内联注释，仅在必要时\n\n将内联注释用于解释复杂的逻辑或非显见的决策。\n\n以下示例展示了 PHP 中适当和过度的内联注释：\n\n### < Good\
  \ Code >\n\n```php\nfunction processUserData($userData) {\n    $cleanedData = array_map('trim',\
  \ $userData);\n    // 使用正则验证邮箱格式\n    if (!preg_match('/[\\w-]+@[\\w-]+\\.\\w+$/',\
  \ $cleanedData['email'])) {\n        throw new InvalidArgumentException('Invalid\
  \ email format');\n    }\n    return $cleanedData;\n}\n```\n\n### <Bad Code>\n\n\
  ```php\nfunction processUserData($userData) {\n    // 从所有用户数据中去除空白\n    $cleanedData\
  \ = array_map('trim', $userData);\n    // 检查邮箱是否有效\n    if (!preg_match('/[\\w-]+@[\\\
  w-]+\\.\\w+$/', $cleanedData['email'])) {\n        // 如果邮箱无效，则抛出异常\n        throw\
  \ new InvalidArgumentException('Invalid email format');\n    }\n    // 返回清理后的数据\n\
  \    return $cleanedData;\n}\n```\n\n\n\n\n\n在良好的代码示例中，内联注释仅用于解释复杂的正则表达式模式的目的。糟糕的代码示例过度使用注释，解释了如修剪空格和返回数据等显而易见的操作。这些注释增加了不必要的冗余，并没有提高代码的可理解性。\n\
  \n<Memo>\n“自文档代码”的概念认为，良好的代码应该是易读易理解的，不需要大量的注释，依赖清晰的命名规范和逻辑结构。\n</Memo>\n\n31\n\n\
  # 使用依赖注入提高可测试性\n\n依赖注入通过解耦组件和允许更容易地模拟（mock）依赖来提高代码的可测试性。\n\n以下代码演示了 `UserService`\
  \ 类中的依赖注入：\n\n< Good Code >\n```php\n// 良好的代码：使用依赖注入\n\nclass UserService {\n  \
  \  private $database;\n\n    // 构造函数注入\n    public function __construct(DatabaseInterface\
  \ $database) {\n        $this->database = $database;\n    }\n    public function\
  \ getUserById($id) {\n        // 使用注入的数据库对象\n        return $this->database->query(\"\
  SELECT * FROM users WHERE id = ?\", [$id]);\n    }\n}\n\n// 使用示例\n$database = new\
  \ MySQLDatabase();\n$userService = new UserService($database);\n$user = $userService->getUserById(1);\n\
  ```\n<Bad Code>\n```php\n// 糟糕的代码：紧耦合，难以测试\n\nclass UserService {\n    private $database;\n\
  \n    public function __construct() {\n        // 直接实例化，紧耦合\n        $this->database\
  \ = new MySQLDatabase();\n    }\n    public function getUserById($id) {\n      \
  \  return $this->database->query(\"SELECT * FROM users WHERE id = ?\", [$id]);\n\
  \    }\n}\n\n// 使用示例\n$userService = new UserService();\n$user = $userService->getUserById(1);\n\
  ```\n\n良好的代码示例通过在构造函数中接受 `DatabaseInterface` 来使用依赖注入。这使得测试变得更容易，因为你可以注入一个模拟数据库对象。糟糕的代码直接实例化\
  \ `database`，导致其难以进行隔离测试或更换实现类。\n\n<Memo>\n依赖注入是 SOLID 原则之一，具体来说是依赖倒置原则 (`DIP`)。\n\
  </Memo>\n\n32\n\n# 使用空合并运算符 (??) 进行简洁的空检查\n\n空合并运算符 (`??`) 提供了一种处理空检查和默认值的简洁方式。\n\
  \n以下代码演示了空合并运算符的用法：\n\n< Good Code >\n```php\n// 良好的代码：使用空合并运算符\n\nfunction getUserName($user)\
  \ {\n    // 如果设置了用户名则返回用户名，否则返回 'Guest'\n    return $user['name'] ?? 'Guest';\n\
  }\n\n// 使用示例\n$user1 = ['name' => 'John'];\n$user2 = [];\necho getUserName($user1);\
  \ // 输出: John\necho getUserName($user2); // 输出: Guest\n```\n<Bad Code>\n```php\n\
  // 糟糕的代码：冗长的空检查\n\nfunction getUserName($user) {\n    // 检查 'name'是否已设置且不为空，否则返回\
  \ 'Guest'\n    if (isset($user['name']) && $user['name'] !== null) {\n        return\
  \ $user['name'];\n    } else {\n        return 'Guest';\n    }\n}\n\n// 使用示例\n$user1\
  \ = ['name' => 'John'];\n$user2 = [];\necho getUserName($user1); // 输出: John\necho\
  \ getUserName($user2); // 输出: Guest\n```\n\n良好的代码使用空合并运算符 (`??`) 来简洁地检查 `$user['name']`\
  \ 是否设置且不为空。糟糕的代码使用了冗长的 `if-else` 块来实现相同的结果。\n\n<Memo>\n空合并运算符 (`??`) 是在 PHP 7.0\
  \ 中引入的。\n</Memo>\n\n33\n\n# 为调用对象实现 `invoke()` 方法\n\n`invoke()` 方法允许对象像函数一样被调用。\n\
  \nPHP 中的 `invoke()` 方法让对象变得可用。\n\n< Good Code >\n```php\n<?php\nclass Greeter {\n\
  \    private $greeting;\n\n    public function __construct($greeting) {\n      \
  \  $this->greeting = $greeting;\n    }\n\n    public function __invoke($name) {\n\
  \        return $this->greeting . ', ' . $name;\n    }\n}\n\n$greeter = new Greeter('Hello');\n\
  echo $greeter('World'); // 输出: Hello, World\n```\n<Bad Code>\n```php\n<?php\nclass\
  \ Greeter {\n    private $greeting;\n\n    public function __construct($greeting)\
  \ {\n        $this->greeting = $greeting;\n    }\n\n    public function greet($name)\
  \ {\n        return $this->greeting . ', ' . $name;\n    }\n}\n\n$greeter = new\
  \ Greeter('Hello');\necho $greeter->greet('World'); // 输出: Hello, World\n```\n\n\
  良好的代码使用 `__invoke()` 方法允许对象像函数一样被调用。糟糕的代码使用了具名的 `greet()` 方法，其灵活性较低。\n\n<Memo>\n\
  `__invoke()` 方法是在 PHP 5.5 中引入的。\n</Memo>\n\n34\n\n# 使用 `yield from` 处理嵌套生成器\n\n\
  `yield from` 表达式简化了对嵌套生成器的操作。\n\n`yield from` 允许将产生值的任务委托给另一个生成器，使代码更整洁。\n\n< Good\
  \ Code >\n```php\n<?php\nfunction innerGenerator() {\n    yield 1;\n    yield 2;\n\
  \    yield 3;\n}\n\nfunction outerGenerator() {\n    yield from innerGenerator();\n\
  }\n\nforeach (outerGenerator() as $value) {\n    echo $value . ' ';\n} // 输出: 1\
  \ 2 3 \n```\n<Bad Code>\n```php\n<?php\nfunction innerGenerator() {\n    yield 1;\n\
  \    yield 2;\n    yield 3;\n}\n\nfunction outerGenerator() {\n    foreach (innerGenerator()\
  \ as $value) {\n        yield $value;\n    }\n}\n\nforeach (outerGenerator() as\
  \ $value) {\n    echo $value . ' ';\n} // 输出: 1 2 3 \n```\n\n良好的示例使用 `yield from`\
  \ 将过程委托给 `innerGenerator()`。糟糕的示例使用 `foreach` 循环来手动产生值，这显得更加冗长。\n\n<Memo>\n`yield\
  \ from` 表达式是在 PHP 7.0 中引入的，用于简化嵌套的可迭代对象处理。\n</Memo>\n\n35\n\n# 使用数组解包合并数组\n\n在 PHP\
  \ 7.4+ 中使用扩展运算符 (`...`) 高效地合并数组。\n\n以下代码演示了如何使用数组解包合并数组：\n\n< Good Code >\n```php\n\
  <?php\n$fruits = ['apple', 'banana'];\n$vegetables = ['carrot', 'tomato'];\n\n//\
  \ 使用扩展运算符合并数组\n$combined = [...$fruits, ...$vegetables];\n\nprint_r($combined);\n\
  ?>\n```\n<Bad Code>\n```php\n<?php\n$fruits = ['apple', 'banana'];\n$vegetables\
  \ = ['carrot', 'tomato'];\n\n// 使用 array_merge 合并数组\n$combined = array_merge($fruits,\
  \ $vegetables);\n\nprint_r($combined);\n?>\n```\n\n良好的代码示例使用扩展运算符 (`...`) 将数组解包并合并到一个新数组。这种方法更具可读性且简洁。糟糕的代码使用了传统的\
  \ `array_merge()` 函数，它不够直观且需要输入更多的代码。\n\n\n\n\n\n展开运算符 `(...)` 在 PHP `7.4` 中引入，它不仅可以用于数组，还可以用于函数调用中的参数解包。\n\
  \n36\n\n# 使用一致的缩进（空格或制表符）\n\n* * *\n\n在整个 PHP 代码中保持一致的缩进，以提高可读性。\n\n* * *\n\n以下示例展示了\
  \ PHP 代码中一致缩进的重要性：\n\n< 良好的代码 >\n\n```php\n<?php\n\n// 良好的实践：一致的缩进（使用 4 个空格）\n\n\
  function calculateTotal($items) {\n    $total = 0;\n    foreach ($items as $item)\
  \ {\n        $price = $item['price'];\n        $quantity = $item['quantity'];\n\
  \        $total += $price * $quantity;\n    }\n    return $total;\n}\n\n$cart =\
  \ [\n    ['name' => 'T-shirt', 'price' => 15, 'quantity' => 2],\n    ['name' =>\
  \ 'Jeans', 'price' => 50, 'quantity' => 1]\n];\n\n$totalCost = calculateTotal($cart);\n\
  echo \"Total cost: $\" . $totalCost;\n?>\n```\n\n< 糟糕的代码>\n\n```php\n<?php\n\n//\
  \ 糟糕的实践：不一致的缩进\n\nfunction calculateTotal($items) {\n$total = 0;\n    foreach ($items\
  \ as $item) {\n $price = $item['price'];\n        $quantity = $item['quantity'];\n\
  \    $total += $price * $quantity;\n    }\nreturn $total;\n}\n\n$cart = [\n['name'\
  \ => 'T-shirt', 'price' => 15, 'quantity' => 2],\n    ['name' => 'Jeans', 'price'\
  \ => 50, 'quantity' => 1]\n];\n\n$totalCost = calculateTotal($cart);\necho \"Total\
  \ cost: $\" . $totalCost;\n?>\n```\n\n良好的代码示例在整个脚本中使用一致的缩进（4 个空格）。这使得代码结构清晰且易于阅读。糟糕的代码示例缩进不一致，混合了不同数量的空格，甚至没有缩进。这使得代码更难以阅读和理解，特别是对于可能参与同一项目的其他开发者而言。一致的缩进有助于视觉化代码结构、嵌套块，并提高整体代码的可维护性。\n\
  \n< 备注>\n\nPHP-FIG（框架互操作小组）建议在 `PSR-12` 编码风格指南中使用 4 个空格或 1 个 tab 作为缩进，但强调项目内部的一致性。\n\
  \n37\n\n# 限制行长度以提高可读性（例如 80-120 个字符）\n\n* * *\n\n将行长度保持在 80-120 个字符内使代码更容易阅读和维护。\n\
  \n* * *\n\n过长的代码行很难阅读和理解。限制行长度有助于保持可读性，并让开发者更容易在代码中导航。\n\n< 良好的代码 >\n\n```php\n\
  <?php\n\n// 限制行长的良好示例\n\nfunction calculateTotalPrice($price, $taxRate, $discount)\
  \ {\n    $taxAmount = $price * $taxRate;\n    $discountAmount = $price * $discount;\n\
  \    $totalPrice = $price + $taxAmount - $discountAmount;\n    return $totalPrice;\n\
  }\n?>\n```\n\n< 糟糕的代码>\n\n```php\n<?php\n\n// 长行的糟糕示例\n\nfunction calculateTotalPrice($price,\
  \ $taxRate, $discount) { $taxAmount = $price * $taxRate; $discountAmount = $price\
  \ * $discount; $totalPrice = $price + $taxAmount - $discountAmount; return $totalPrice;\
  \ }\n?>\n```\n\n在良好的示例中，代码被拆分成多行，使其更容易阅读和理解。在糟糕的示例中，整个函数被写在一行中，这使得难以追踪和维护。\n\n<\
  \ 备注>\n\n80 个字符的限制源于早期计算机使用的打孔卡宽度。许多现代编码标准仍然为了可读性建议采用这一限制。\n\n38\n\n# 使用空行分隔代码的逻辑部分\n\
  \n* * *\n\n空行有助于在视觉上区分不同的代码部分，使其更容易阅读和理解。\n\n* * *\n\n使用空行分隔代码的逻辑部分通过在代码的不同部分之间提供视觉间断，提高了可读性，使户更容易跟踪程序的流程。\n\
  \n< 良好的代码 >\n\n```php\n<?php\n\n// 使用空行分隔逻辑部分的良好示例\n\nfunction calculateTotalPrice($price,\
  \ $taxRate, $discount) {\n    // 计算税额\n    $taxAmount = $price * $taxRate;\n\n \
  \   // 计算折扣金额\n    $discountAmount = $price * $discount;\n\n    // 计算总价\n    $totalPrice\
  \ = $price + $taxAmount - $discountAmount;\n}\n?>\n```\n\n< 糟糕的代码>\n\n```php\n<?php\n\
  \n// 没有空行的糟糕示例\n\nfunction calculateTotalPrice($price, $taxRate, $discount) {\n\
  \    $taxAmount = $price * $taxRate;\n    $discountAmount = $price * $discount;\n\
  \    $totalPrice = $price + $taxAmount - $discountAmount;\n    return $totalPrice;\n\
  }\n?>\n```\n\n良好的示例使用空行分隔逻辑部分，使得流程更容易追踪。糟糕的示例缺乏这些间断，使得代码更难以解析。\n\n39\n\n# 在声明变量时对齐赋值运算符\n\
  \n* * *\n\n对齐赋值运算符有助于快速发现不一致之处。\n\n* * *\n\n在声明变量时，对齐运算符可以提高可读性和可维护性。\n\n< 良好的代码\
  \ >\n\n```php\n<?php\n\n// 对齐赋值运算符的良好示例\n$firstName = \"John\";\n$lastName  = \"\
  Doe\";\n$age       = 30;\n$occupation = \"Engineer\";\n?>\n```\n\n< 糟糕的代码>\n\n```php\n\
  <?php\n\n// 运算符未对齐的糟糕示例\n$firstName = \"John\";\n$lastName = \"Doe\";\n$age = 30;\n\
  $occupation = \"Engineer\";\n?>\n```\n\n在良好的示例中，对齐有助于扫描变量和值。在糟糕的示例中，未对齐的运算符使得代码看起来混乱。\n\
  \n40\n\n# 使用括号明确运算符优先级\n\n* * *\n\n使用括号明确运算符优先级可以确保代码按照预期运行，并且更容易理解。\n\n* * *\n\n\
  运算符优先级有时会令人困惑。使用括号可以明确表示操作顺序。\n\n< 良好的代码 >\n\n```php\n<?php\n\n// 使用括号明确优先级的良好示例\n\
  $result = (2 + 3) * 4; // 明确表示 2 + 3 应该先计算\necho $result; // 输出 20\n?>\n```\n\n\
  < 糟糕的代码>\n\n```php\n<?php\n\n// 没有括号，导致潜在困惑的糟糕示例\n$result = 2 + 3 * 4; // 没有括号，先计算乘法\n\
  echo $result; // 输出 14\n?>\n```\n\n在良好的示例中，使用了括号来明确表示在执行乘法之前执行加法。在糟糕的示例中，缺少括号会导致误解。\n\
  \n41\n\n# 使用早期返回减少嵌套\n\n* * *\n\n在函数中使用早期返回（early returns）有助于减少嵌套层，使你的代码更易读且易于维护。\n\
  \n* * *\n\n早期返回允许你在满足条件时立即退出函数，避免深层嵌套并使代码流程更加清晰。\n\n< 良好的代码 >\n\n```php\nfunction\
  \ processOrder($order) {\n    // 检查订单是否有效\n    if (!$order->isValid()) {\n```\n\n\
  \n\n\n\n```php\n    return 'Invalid order';\n\n    }\n\n    // 检查订单是否已经处理\n\n  \
  \  if ($order->isProcessed()) {\n        return 'Order already processed';\n   \
  \ }\n\n    // 处理订单\n    $order->process();\n\n    return 'Order processed successfully';\n\
  }\n```\n\n### <Bad Code>\n\n```php\nfunction processOrder($order) {\n\n    // 检查订单是否有效\n\
  \    if ($order->isValid()) {\n        // 检查订单是否已经处理\n        if (!$order->isProcessed())\
  \ {\n            // 处理订单\n            $order->process();\n            return 'Order\
  \ processed successfully';\n        } else {\n            return 'Order already\
  \ processed';\n        }\n    } else {\n        return 'Invalid order';\n    }\n\
  }\n```\n\n在良好的示例中，使用了**早期返回（early returns）**来立即处理无效或已处理的订单，减少了对嵌套 `if` 语句的需求。这使得\
  \ `processOrder` 更容易阅读和理解。在糟糕的示例中，嵌套的 `if` 语句使得代码更难追踪。\n\n### <Memo>\n早期返回是许多编程语言中的常见做法，而不只是\
  \ PHP。它们有助于提高代码的可读性并降低复杂度。\n\n42\n\n# 尽可能优先使用 foreach 循环而非 for 循环\n\n***\n\n在遍历数组或集合时，使用\
  \ `foreach` 循环代替 `for` 循环可以使你的代码更具可读性且不易出错。\n\n***\n\n`foreach` 循环专门为遍历数组和集合设计，与\
  \ `for` 循环相比，它提供了更简单、更直观的语法。\n\n### < Good Code >\n\n```php\n$items = ['apple',\
  \ 'banana', 'cherry'];\n\n// 使用 foreach 循环\nforeach ($items as $item) {\n    echo\
  \ $item . \"\\n\"; // 输出每个项目\n}\n```\n\n### <Bad Code>\n\n```php\n$items = ['apple',\
  \ 'banana', 'cherry'];\n\n// 使用 for 循环\nfor ($i = 0; $i < count($items); $i++) {\n\
  \    echo $items[$i] . \"\\n\"; // 输出每个项目\n}\n```\n\n在良好的示例中，`foreach` 循环直接遍历数组中的每个项目，使得代码更简洁且易读。在糟糕的示例中，`for`\
  \ 循环需要管理循环计数器并调用 `count` 函数，这更容易出错且可读性较差。\n\n### <Memo>\n`foreach` 循环不仅更具读性，在某些情况下也更高效，因为避免了在循环条件中重复调用\
  \ `count` 函数。\n\n43\n\n# 对同一变量的多个条件使用 switch 语句\n\n***\n\n在处理单个变量的多个条件时，`switch`\
  \ 语句可以提高代码的可读性。\n\n***\n\n以下代码演示了如何使用 `switch` 语句处理用户角色的不同情况：\n\n### < Good Code\
  \ >\n\n```php\n// 根据角色确定用户权限\nfunction getUserPermissions($role) {\n    switch ($role)\
  \ {\n        case 'admin':\n            // 管理员拥有完全访问\n            return ['read',\
  \ 'write', 'delete', 'manage'];\n        case 'editor':\n            // 编辑员可以读、写、删\n\
  \            return ['read', 'write', 'delete'];\n        case 'author':\n     \
  \       // 作者可以读、写\n            return ['read', 'write'];\n        case 'subscriber':\n\
  \            // 订阅者只能读\n            return ['read'];\n        default:\n       \
  \     // 未知角色的默认值\n            return ['none'];\n    }\n}\n// 使用\n$userRole = 'editor';\n\
  $permissions = getUserPermissions($userRole);\nprint_r($permissions);\n```\n\n###\
  \ <Bad Code>\n\n```php\n// 根据角色确定用户权限\nfunction getUserPermissions($role) {\n  \
  \  if ($role == 'admin') {\n        return ['read', 'write', 'delete', 'manage'];\n\
  \    } elseif ($role == 'editor') {\n        return ['read', 'write', 'delete'];\n\
  \    } elseif ($role == 'author') {\n        return ['read', 'write'];\n    } elseif\
  \ ($role == 'subscriber') {\n        return ['read'];\n    } else {\n        return\
  \ ['none'];\n    }\n}\n// 使用\n$userRole = 'editor';\n$permissions = getUserPermissions($userRole);\n\
  print_r($permissions);\n```\n\n良好的示例使用了 `switch` 语句，在处理单个变量的多个条件时，它更具可读性易于维护。每个\
  \ `case` 都有清晰的定义，使得添加或修改角色变得更容易。糟糕的示例使用了一系列 `if-elseif` 语句，这可能会变得难以阅读。\n\n### <Memo>\n\
  PHP 中的 `switch` 语句支持“穿透”行为，如果省略了 `break` 语句，执行将继续到下一个 case。这在某些场景下有用，但应该谨慎使用。\n\n\
  44\n\n# 使用守卫语句（guard clauses）处理边界情况\n\n***\n\n守卫语句通过在函数早期处理边界情况来提高代码的可读性，减少嵌套和复杂度。\n\
  \n***\n\n以下代码演示了如何使用守卫语句在函数中验证输入：\n\n### < Good Code >\n\n```php\n// 计算购买金额的折扣\n\
  function calculateDiscount($purchaseAmount) {\n    // 守护语句：检查无效输入\n    if (!is_numeric($purchaseAmount)\
  \ || $purchaseAmount < 0) {\n        throw new InvalidArgumentException(\"Invalid\
  \ purchase amount\");\n    }\n    // 守护语句：小额购买不予折扣\n    if ($purchaseAmount < 100)\
  \ {\n        return 0;\n    }\n    // 计算折扣\n    if ($purchaseAmount >= 500) {\n\
  \        return $purchaseAmount * 0.1; // 10% 折\n    } else {\n        return $purchaseAmount\
  \ * 0.05; // 5% 折\n    }\n}\n// 使用\ntry {\n    $discount = calculateDiscount(250);\n\
  \    echo \"Discount: $\" . number_format($discount, 2);\n} catch (InvalidArgumentException\
  \ $e) {\n    echo \"Error: \" . $e->getMessage();\n}\n```\n\n### <Bad Code>\n\n\
  ```php\n// 计算购买金额的折扣\nfunction calculateDiscount($purchaseAmount) {\n    if (is_numeric($purchaseAmount)\
  \ && $purchaseAmount >= 0) {\n        if ($purchaseAmount >= 100) {\n          \
  \  if ($purchaseAmount >= 500) {\n                return $purchaseAmount * 0.1;\
  \ // 10% 折\n            } else {\n                return $purchaseAmount * 0.05;\
  \ // 5% 折\n            }\n        } else {\n            return 0;\n        }\n \
  \   } else {\n        throw new InvalidArgumentException(\"Invalid purchase amount\"\
  );\n    }\n}\n// 使用\ntry {\n    $discount = calculateDiscount(250);\n    echo \"\
  Discount: $\" . number_format($discount, 2);\n} catch (InvalidArgumentException\
  \ $e) {\n    echo \"Error: \" . $e->getMessage();\n}\n```\n\n良好的代码示例使用了守卫语句来早期处理边界情况。这种方法减少了嵌套并使代码更易读。糟糕的代码使用了嵌套的\
  \ `if` 语句，随着条件的增加，它会变得更难以追踪和维护。\n\n### <Memo>\n守卫语句是“早期返回”模式的核心原则，可以显著提高代码的可读性并减少阅读代码开发者的认知负担。\n\
  \n45\n\n# 使用三元运算符进行简单的条件赋值\n\n***\n\n使用三元运算符简化条件赋值以提高可读性。\n\n***\n\n以下代码演示了如何使用三元运算符进行简单的条件赋值：\n\
  \n### < Good Code >\n\n```php\n// 良好的代码：使用三元运算符进行简单的条件赋值\n$isAdult = ($age >= 18)\
  \ ? true : false;\n// 解释：\n// 如果 $age 大于或等于 18，则 $isAdult 设置为 true\n// 否则，$isAdult\
  \ 设置为 false\n```\n\n### <Bad Code>\n\n```php\n// 糟糕的代码：使用传统的 if-else 语句进行简单的条件赋值\n\
  if ($age >= 18) {\n    $isAdult = true;\n} else {\n    $isAdult = false;\n}\n//\
  \ 解释：\n// 这段代码与良好的示例功能相同，\n// 但它更冗长且可读性较差\n```\n\n\n\n\n良好的代码示例使用了三元运算符 `(?:)` 来根据条件简洁地为布尔值赋值。与糟糕代码示例中使用的传统\
  \ `if-else` 语句相比，这种方法更具可读性且更加更紧凑。两个代码段实现了相同的结果，但三元运算符的版本更优雅，且更容易一目了然。\n\n<Memo>\n\
  三元运算符也称为条件运算符，它是 `PHP` 中唯一接受三个操作数的运算符。\n</Memo>\n\n46\n\n# 利用空合并运算符 (`??`) 设置默认值\n\
  \n使用空合并运算符来高效地分配默认值。\n\n以下代码展示了如何使用空合并运算符来分配默认值：\n\n< Good Code >\n```php\n// 良好的代码：使用空合并运算符设置默认值\n\
  \n$username = $_GET['username'] ?? 'Guest';\n\n// 解释：\n// 如果 $_GET['username'] 已设置且不为\
  \ null，则将它的值赋值给 $username\n// 否则，将 'Guest' 作为默认值赋值\n```\n\n<Bad Code>\n```php\n\
  // 糟糕的代码：使用 isset() 和三元运算符设置默认值\n\n$username = isset($_GET['username']) ? $_GET['username']\
  \ : 'Guest';\n\n// 解释：\n//这段代码的功能与良好示例相同，\n// 但它更冗长且效率较低\n```\n\n良好的代码示例使用了空合并运算符\
  \ `(??)` 在指定变量为 `null` 或未设置时分配默认值。与糟糕的代码示例相比，这种方法更简洁且易于阅读，而糟糕的示例使用了 `isset()` 和三元运算符来实现相同的结果。空合并运算符简化了代码，并使其更具可维护性。\n\
  \n<Memo>\n空合并运算符在 `PHP 7.0` 中引入，对于处理未定义的数组键或对象属性特别有用。\n</Memo>\n\n47\n\n# 使用太空运算符\
  \ (`<=>`) 进行简洁比较\n\n太空运算符简化了 `PHP` 中的比较操作，使代码更具可读性且更简洁。\n\n以下代码演示了如何使用太空运算符比较值并排序数组：\n\
  \n< Good Code >\n```php\n// 使用太空运算符进行比较和排序\n\n$fruits = ['apple', 'banana', 'cherry'];\n\
  \n// 使用太空运算符对数组进行排序\n\nusort($fruits, function($a, $b) {\n    // 太空运算符返回 -1, 0 或\
  \ 1\n    return $a <=> $b;\n});\n\n// 输出排序后的数组\n\nforeach ($fruits as $fruit) {\n\
  \    echo $fruit . \"\\n\";\n}\n\n// 使用太空运算符比较数字\n\n$result = 5 <=> 10;\necho \"\
  Comparison result: \" . $result . \"\\n\";\n```\n\n<Bad Code>\n```php\n// 未使用太空运算符进行比较和排序\n\
  \n$fruits = ['apple', 'banana', 'cherry'];\n\n// 使用传统的比较函数对数组进行排序\n\nusort($fruits,\
  \ function($a, $b) {\n    if ($a < $b) {\n        return -1;\n    } elseif ($a >\
  \ $b) {\n        return 1;\n    } else {\n        return 0;\n    }\n});\n\n// 输出排序后的数组\n\
  \nforeach ($fruits as $fruit) {\n    echo $fruit . \"\\n\";\n}\n\n// 在不使用太空运算符的情况下比较数字\n\
  \n$a = 5;\n$b = 10;\nif ($a < $b) {\n    $result = -1;\n} elseif ($a > $b) {\n \
  \   $result = 1;\n} else {\n    $result = 0;\n}\n\necho \"Comparison result: \"\
  \ . $result . \"\\n\";\n```\n\n良好的代码示例使用太空运算符 `(<=>)` 同时用于排序和比较。该运算符在左操作数小于右操作数时返回\
  \ `-1`，当两者相等时返回 `0`，当左操作数大于右操作数时返回 `1`。糟糕的示例使用了传统的 `if-else` 逻辑，导致代码更冗长且不直观。太空运算符简化了处理\
  \ `null` 的情况，使代码更简洁且易于读。\n\n<Memo>\n太空运算符在 `PHP 7.0` 中引入，也被称为组合运算符。\n</Memo>\n\n\
  48\n\n# 使用空安全运算符 (`?->`) 进行安全访问\n\n空安全运算符允许在处理 `null` 值时访问属性或方法而不会产生错误。\n\n以下代码演示了如何使用空安全运算符安全地访问属性：\n\
  \n< Good Code >\n```php\n// 良好的代码：使用空安全运算符访问属性/方法\n\nclass User {\n    public $name;\n\
  \    public function getEmail() {\n        return 'user@example.com';\n    }\n}\n\
  \n$user = null;\n// 安全访问属性\n$name = $user?->name;\necho \"Name: \" . ($name ?? 'Unknown');\n\
  \n// 安全调用方法\n$email = $user?->getEmail();\necho \"Email: \" . ($email ?? 'Not available');\n\
  \n// 链式调用\n$user = new User();\n$user->name = 'John';\necho \"Name: \" . $user->name;\n\
  ```\n\n<Bad Code>\n```php\n// 糟糕的代码：未使用空安全运算符访问属性/方法\n\nclass User {\n    public\
  \ $name;\n    public function getEmail() {\n        return 'user@example.com';\n\
  \    }\n}\n\n$user = null;\n// 不安全的访问\n$name = $user->name;\necho \"Name: \" . $name;\n\
  \n// 不安全的调用\n$email = $user->getEmail();\necho \"Email: \" . $email;\n```\n\n良好的代码示例使用了空安全运算符\
  \ `(?->)` 来访问属性和方法。该运算符在尝试访问前检查对象是否为 `null`，从而防止错误。糟糕的示例使用了传统的检查，这可能导致代码更加冗长。\n\n\
  49\n\n# 使用 match 表达式实现简洁的 switch 功能\n\n`PHP 8.0` 引入了 `match` 表达式，为 `switch` 语句提供了更简洁、强大的替代方案。\n\
  \n以下代码演示了如何根据值处理不同的情况：\n\n< Good Code >\n```php\n// 使用 match 的良好示例\n\nfunction getStatusMessage($statusCode)\
  \ {\n    // 使用 match 返回适当的消息\n    return match ($statusCode) {\n        200 => 'OK',\n\
  \        404 => 'Not Found',\n        500 => 'Internal Server Error',\n        default\
  \ => 'Unknown Status',\n    };\n}\n\n// 使用\n$message = getStatusMessage(404);\n\
  echo $message; // 输出: Not Found\n```\n\n<Bad Code>\n```php\n// 使用 switch 语句的糟糕示例\n\
  \nfunction getStatusMessage($statusCode) {\n    // 使用 switch 语句返回适当的消息\n    switch\
  \ ($statusCode) {\n        case 200:\n            return 'OK';\n        case 404:\n\
  \            return 'Not Found';\n        case 500:\n            return 'Internal\
  \ Server Error';\n        default:\n            return 'Unknown Status';\n    }\n\
  }\n\n// 使用\n$message = getStatusMessage(404);\necho $message; // 输出: Not Found\n\
  ```\n\n\n\n\n`match` 表达式与 `switch` 语句相比提供了更简洁的语法。它会自动返回匹配表达式的结果，消除了对 `break` 语句的需求。`match`\
  \ 表达式默认执行严格比较，减少了潜在的错误。良好的示例展示了更整洁、更易读的代码，实现了与坏的示例中 `switch` 语句相同的功能。\n\n<Memo>\n\
  `match` 表达式在 PHP 8.0 中引入，灵感源于 Rust 和 Ruby 等语言中的类似结构。\n</Memo>\n\n50\n\n# 为自定义对象遍历实现迭代器\n\
  \n实现 `Iterator` 接口允许自定义对象在 `foreach` 循环中被轻松遍历。\n\n以下代码演示了如何为自定义对象实现迭代器：\n\n< Good\
  \ Code >\n\n```php\n// 实现 Iterator 接口的良好示例\n\nclass MyCollection implements Iterator\
  \ {\n       private $items = [];\n       private $position = 0;\n       public function\
  \ __construct(array $items) {\n              $this->items = $items;\n       }\n\
  \    // 必须的 Iterator 方法\n       public function current() {\n              return\
  \ $this->items[$this->position];\n       }\n       public function key() {\n   \
  \           return $this->position;\n       }\n       public function next() {\n\
  \              ++$this->position;\n       }\n       public function rewind() {\n\
  \              $this->position = 0;\n       }\n       public function valid() {\n\
  \              return isset($this->items[$this->position]);\n       }\n}\n\n// 使用\n\
  $collection = new MyCollection(['apple', 'banana', 'cherry']);\nforeach ($collection\
  \ as $key => $value) {\n         echo \"$key: $value\\n\";\n}\n```\n\n<Bad Code>\n\
  \n```php\n// 未实现 Iterator 的坏示例\nclass MyCollection {\n       private $items = [];\n\
  \       public function __construct(array $items) {\n            $this->items =\
  \ $items;\n       }\n       public function getItems() {\n            return $this->items;\n\
  \       }\n}\n\n// 使用\n$collection = new MyCollection(['apple', 'banana', 'cherry']);\n\
  $items = $collection->getItems();\nforeach ($items as $key => $value) {\n         echo\
  \ \"$key: $value\\n\";\n}\n```\n\n良好的示例实现了 `Iterator` 接口，允许对象直接用于 `foreach` 循环。这种方法将迭代逻辑封装在类内部，促进了更好的面向对象设计。坏的示例暴露了内部数组，破坏了封装性，并且遍历项目时需要额外的步骤。实现\
  \ `Iterator` 使代码更加直观且易于使用，特别是在处理复杂的自定义对象时。\n\n<Memo>\nPHP 的 `Iterator` 接口是标准 PHP\
  \ 库 (SPL)的一部分，提供了一种让对象可遍历的标准方法。\n</Memo>\n\n51\n\n# 为类属性使用类型声明\n\n通过在 PHP 类属性中使用类型声明，可以增强代码的可读性和维护性。\n\
  \n以下代码演示了在 PHP 7.4 及更高版本中为类属性使用类型声明的方法：\n\n< Good Code >\n\n```php\nclass User {\n\
  \    // 使用类型提示声明公共属性\n    public string $name;\n    public int $age;\n    public\
  \ ?string $email; // 可空字符串类型\n    // 带有类型提示参数的构造函数\n    public function __construct(string\
  \ $name, int $age, ?string $email = null) {\n            $this->name = $name;\n\
  \              $this->age = $age;\n              $this->email = $email;\n       }\n\
  \    // 带有类型提示返回值的方法\n    public function getInfo(): string {\n              return\
  \ \"Name: {$this->name}, Age: {$this->age}\";\n    }\n}\n\n// 使用\n$user = new User(\"\
  John Doe\", 30, \"john@example.com\");\necho $user->getInfo(); // 输出: Name: John\
  \ Doe, Age: 30\n```\n\n<Bad Code>\n\n```php\nclass User {\n    // 缺少类型提示的属性\n  \
  \  public $name;\n    public $age;\n    public $email;\n    // 缺少类型提示的构造函数\n   \
  \ public function __construct($name, $age, $email = null) {\n        $this->name\
  \ = $name;\n        $this->age = $age;\n        $this->email = $email;\n    }\n\
  \    // 缺少返回类型的方法\n    public function getInfo() {\n        return \"Name: \" .\
  \ $this->name . \", Age: \" . $this->age;\n    }\n}\n\n// 使用\n$user = new User(\"\
  John Doe\", 30, \"john@example.com\");\necho $user->getInfo(); // 输出: Name: John\
  \ Doe, Age: 30\n```\n\n良好的示例使用了类型声明，使得代码更加清晰并能在运行时捕捉许多错误。坏的示例缺乏类型声明，这增加了类型错误的风险，并使维护变得更加困难。\n\
  \n\n\n\n`echo \"Sum: \" . $result; // 输出: Sum: 15`\n\n<Bad Code>\n\n```php\n// 没有扩展运算符的糟糕实现\n\
  function calculateSum() {\n    $sum = 0;\n    $args = func_get_args();\n    for\
  \ ($i = 0; $i < func_num_args(); $i++) {\n        $sum += $args[$i];\n    }\n  \
  \  return $sum;\n}\n\n$result = calculateSum(1, 2, 3, 4, 5);\necho \"Sum: \" . $result;\
  \ // 输出: Sum: 15\n```\n\n良好的代码示例使用了扩展运算符 `(...)` 将所有参数收集到一个数组中，使函数更具灵活性且更于读。它还利用了内置的\
  \ `array_sum()` 函数进行高效计算。糟糕的代码示例依赖于 `func_get_args()` 和 `func_num_args()` 等较旧方法，这些方法不那么直观，且需要更多的手动处理。\n\
  \n<Memo>\n扩展运算符在 PHP 5.6 中引入，提供了一种简洁的方式将数组或可遍历对象解包为函数参数或数组元素。\n54\n\n# 使用命名参数提高函数调用的可读性\n\
  \n在函数调用中使用命名参数来增强代码清晰度，并使每个参数的意图显而易见。\n\n以下代码展示了如何在函数调用中使用命名参数，提高了可读性并减少了错误。\n\n\
  < Good Code >\n\n```php\n/**\n* 创建用户配置文件\n* @param string $username 用户名\n* @param\
  \ string $email 电子邮箱地址\n* @param int $age 用户年龄\n* @param string $country 用户所在国家（可选）\n\
  * @return array 创建的用户配置文件\n*/\nfunction createUserProfile(\n    string $username,\n\
  \    string $email,\n    int $age,\n    string $country = 'Unknown'\n) {\n    return\
  \ [\n        'username' => $username,\n        'email' => $email,\n        'age'\
  \ => $age,\n        'country' => $country\n    ];\n}\n\n// 使用命名参数\n$profile = createUserProfile(\n\
  \    username: 'john_doe',\n    email: 'john@example.com',\n    age: 30,\n    country:\
  \ 'USA'\n);\nprint_r($profile);\n```\n\n<Bad Code>\n\n```php\n// 没有命名参数\nfunction\
  \ createUserProfile($username, $email, $age, $country = 'Unknown') {\n    return\
  \ [\n        'username' => $username,\n        'email' => $email,\n        'age'\
  \ => $age,\n        'country' => $country\n    ];\n}\n\n// 可能会引起混淆的参数顺序\n$profile\
  \ = createUserProfile('john_doe', 'john@example.com', 30, 'USA');\nprint_r($profile);\n\
  ```\n\n良好的代码示例使用了命名参数，清楚地显示了哪个值对应哪个参数。这种方法提高了可读性并降低了按错误传递参数的风险。糟糕的代码示例依赖位置参数，这很容易出错，特别是在处理多个参数或可选参数时。\n\
  \n<Memo>\n命名参数在 PHP 8.0 中引入，允许开发者根据参数名称而不是位置向函数传递参数。\n55\n\n# 实现 __debugInfo() 以进行自定义对象的调试输出\n\
  \n使用 `__debugInfo()` 在调试期间控制对象的输出。\n\n`__debugInfo()` 魔法方法允许你自定义在对对象调用 `var_dump()`\
  \ 时显示的信息。\n\n< Good Code >\n\n```php\nclass User {\n    private $id;\n    private\
  \ $name;\n    private $email;\n    private $password; // 敏感信息\n    public function\
  \ __construct($id, $name, $email, $password) {\n        $this->id = $id;\n     \
  \   $this->name = $name;\n        $this->email = $email;\n        $this->password\
  \ = $password;\n    }\n    // 实现 __debugInfo() 以控制输出\n    public function __debugInfo()\
  \ {\n        return [\n            'id' => $this->id,\n            'name' => $this->name,\n\
  \            'email' => $this->email,\n            // 为了安全省略了密码\n        ];\n  \
  \  }\n}\n\n// 使用\n$user = new User(1, 'John Doe', 'john@example.com', 'secret23');\n\
  var_dump($user);\n```\n\n<Bad Code>\n\n```php\nclass User {\n    public $id;\n \
  \   public $name;\n    public $email;\n    public $password; // 敏感信息\n    public\
  \ function __construct($id, $name, $email, $password) {\n        $this->id = $id;\n\
  \        $this->name = $name;\n        $this->email = $email;\n        $this->password\
  \ = $password;\n    }\n}\n\n// 使用\n$user = new User(1, 'John Doe', 'john@example.com',\
  \ 'secret23');\nvar_dump($user); // 转储包括敏感数据在内的所有属性\n```\n\n良好的示例实现了 `__debugInfo()`\
  \ 来控制调试期间显示的内容。它省略了密码等敏感数据。糟糕的示例暴露了所有属性，存在安全风险。\n\n<Memo>\n`__debugInfo()` 方法在 PHP\
  \ 5.6.0 中引入，为开发者提供了调试期间对对象表示的更多控制。\n56\n\n# 在靠近其使用的地方声明变量\n\n在变量第一次使用的地方定义变量以提高代码的可读性。在靠近使用处声明变量有助于理解代码流，并减少读者的认知负担。\n\
  \n< Good Code >\n\n```php\nfunction processOrder($orderId) {\n    // 获取订单详情\n  \
  \  $order = getOrderById($orderId);\n    // 计算总计\n    $total = 0;\n    foreach ($order['items']\
  \ as $item) {\n        $itemPrice = $item['price'] * $item['quantity'];\n      \
  \  $total += $itemPrice;\n    }\n    // 如果适用则应用折扣\n    $discountCode = getDiscountCode($orderId);\n\
  \    if ($discountCode) {\n        $discountPercentage = getDiscountPercentage($discountCode);\n\
  \        $discountAmount = $total * ($discountPercentage / 100);\n        $total\
  \ -= $discountAmount;\n    }\n    // 处理支付\n    $paymentResult = processPayment($orderId,\
  \ $total);\n    return $paymentResult;\n}\n```\n\n<Bad Code>\n\n```php\nfunction\
  \ processOrder($orderId) {\n    $order = null;\n    $total = 0;\n    $itemPrice\
  \ = 0;\n    $discountCode = null;\n    $discountPercentage = 0;\n    $discountAmount\
  \ = 0;\n    $paymentResult = false;\n    $order = getOrderById($orderId);\n    foreach\
  \ ($order['items'] as $item) {\n        $itemPrice = $item['price'] * $item['quantity'];\n\
  \        $total += $itemPrice;\n    }\n    $discountCode = getDiscountCode($orderId);\n\
  \    if ($discountCode) {\n        $discountPercentage = getDiscountPercentage($discountCode);\n\
  \        $discountAmount = $total * ($discountPercentage / 100);\n        $total\
  \ -= $discountAmount;\n    }\n    $paymentResult = processPayment($orderId, $total);\n\
  \    return $paymentResult;\n}\n```\n\n良好的示例在靠近其使用的地方声明变量，使代码更容易追踪。糟糕的示例在开头声明了所有变量，这可能更难以理解每个变量的。\n\
  \n<Memo>\n这种在靠近使用处声明变量的做法是编程中更广泛的“引用局部性”（locality of reference）概念的一部分，该概念认为相关元素应该保持在一起。\n\
  57\n\n# 使用描述性的变量名\n\n选择能够清晰解释其目的和内容的变量名。\n\n以下代码演示了在计算购物车总价的函数中，使用描述性变量名与非描述性变量名的区别。\n\
  \n< Good Code >\n\n```php\n// 计算购物车总价的函数\nfunction calculateTotalPrice($itemPrices,\
  \ $taxRate, $discountPercentage) {\n    // 计算小计\n    $subtotal = array_sum($itemPrices);\n\
  \    // 应用折扣\n    $discountAmount = $subtotal * ($discountPercentage / 100);\n \
  \   $discountedTotal = $subtotal - $discountAmount;\n    // 添加税\n    $taxAmount\
  \ = $discountedTotal * ($taxRate / 100);\n    $totalPrice = $discountedTotal + $taxAmount;\n\
  \    return $totalPrice;\n}\n\n// 使用示例\n$prices = [10.99, 24.99, 5.99];\n$tax =\
  \ 8.5;\n$discount = 10;\n$finalPrice = calculateTotalPrice($prices, $tax, $discount);\n\
  echo \"Total price: $\" . number_format($finalPrice, 2);\n```\n\n<Bad Code>\n\n\
  ```php\n// 计算某些内容的函数\n```\n\n\n\n\n\n```php\nfunction calc($a, $b, $c) {\n    //\
  \ Do some math\n    $x = array_sum($a);\n    // More calculations\n    $y = $x *\
  \ ($c / 100);\n    $z = $x - $y;\n    // Final step\n    $w = $z * ($b / 100);\n\
  \    $v = $z + $w;\n    return $v;\n}\n\n// Usage\n$p = [10.99, 24.99, 5.99];\n\
  $t = 8.5;\n$d = 10;\n$f = calc($p, $t, $d);\necho \"Result: $\" . number_format($f,\
  \ 2);\n```\n\n良好的代码示例使用了具有描述性的变量名，清楚地指示了它们的用途，例如 `$itemPrices`、`$taxRate` 和 `$discountPercentage`。这使得代码更具可读性且自解释性。糟糕的代码示例使用了单字母变量，如\
  \ `$a`、`$b` 和 `$c`，这使得在没有额外上下文或注释的情况下很难理解每个变量的用途。\n\n<Memo>\n使用描述性变量名的做法是一个更广泛的概念——“自文档代码”的一部分，旨在旨在不严重依赖注释的情况下使代码更具可读性和可维护性。\n\
  \n58\n\n# 避免全局变量，使用依赖注入\n\n***\n\n与其使用全局变量，不如将依赖作为参数传递给函数或方法。\n\n***\n\n以下代码演示了在简单的日志系统中使用全局变量和依赖注入的区别。\n\
  \n## < 良好的代码 >\n\n```php\n// 使用依赖注入的日志类\nclass Logger {\n    private $logFile;\n\
  \    public function __construct($logFile) {\n        $this->logFile = $logFile;\n\
  \    }\n    public function log($message) {\n        $timestamp = date('Y-m-d H:i:s');\n\
  \        $logEntry = \"$timestamp: $message\\n\";\n        file_put_contents($this->logFile,\
  \ $logEntry, FILE_APPEND);\n    }\n}\n\n// 使用示例\n$logger = new Logger('/path/to/app.log');\n\
  function processOrder($orderId, Logger $logger) {\n    // 这里处理订单逻辑\n    $logger->log(\"\
  Order $orderId processed successfully\");\n}\n\n// 使用日志\n$orderId = 12345;\nprocessOrder($orderId,\
  \ $logger);\n```\n\n## < 糟糕的代码>\n\n```php\n// 用于日志文件的全局变量\n$GLOBALS['logFile'] =\
  \ '/path/to/app.log';\n\n// 使用全局变量的日志函数\nfunction logMessage($message) {\n    global\
  \ $logFile;\n    $timestamp = date('Y-m-d H:i:s');\n    $logEntry = \"$timestamp:\
  \ $message\\n\";\n    file_put_contents($logFile, $logEntry, FILE_APPEND);\n}\n\n\
  // 使用示例\nfunction processOrder($orderId) {\n    // 这里处理订单逻辑\n    logMessage(\"Order\
  \ $orderId processed successfully\");\n}\n\n// 使用日志\n$orderId = 12345;\nprocessOrder($orderId);\n\
  ```\n\n良好的代码示例通过将 `Logger` 对象作为参数传递给 `processOrder` 函数使用了依赖注入。这种方法使代码更具模块化、可测试性且易于维护。糟糕的代码示例使用了全局变量\
  \ `$GLOBALS['logFile']` 和全局函数 `logMessage`，这会导致紧耦合并使其难以测试。\n\n<Memo>\n使用描述性变量名的做法是一个更广泛的概念——“自文档代码”的一部分，旨在旨在不严重依赖注释的情况下使代码更具可读性和可维护性。\n\
  \n59\n\n# 使用常量处理固定值\n\n***\n\n使用常量处理固定值可以提高可读性和可维护性。\n\n***\n\n常量用于不改变的值。\n\n##\
  \ < 良好的代码 >\n\n```php\n<?php\ndefine('TAX_RATE', 0.08);\n\n// 计算税额的函数\nfunction\
  \ calculate($price) {\n    return $price * TAX_RATE;\n}\n\n// 使用\n$price = 100;\n\
  echo \"Tax: \" . calculate($price); // 输出: 8\n```\n\n## < 糟糕的代码>\n\n```php\n<?php\n\
  // 计算税额的函数\nfunction calculate($price) {\n    return $price * 0.08;\n}\n\n// 使用\n\
  $price = 100;\necho \"Tax: \" . calculate($price); // 输出: 8\n?>\n```\n\n在良好的示例中，`TAX_RATE`\
  \ 被定义为常量。在糟糕的示例中，值 `0.08` 是硬编码的，如果税率发生变化将难以维护。\n\n60\n\n# 使用静态变量处理状态\n\n***\n\n\
  静态变量在函数调用之间保留状态。\n\n***\n\n静态变量常用于计数或缓存。\n\n## < 良好的代码 >\n\n```php\n<?php\nfunction\
  \ incrementCounter() {\n    static $count = 0;\n    $count++;\n    return $count;\n\
  }\n\n// 使用\necho incrementCounter(); // 输出: 1\necho incrementCounter(); // 输出: 2\n\
  ?>\n```\n\n## < 糟糕的代码>\n\n```php\n<?php\nfunction incrementCounter() {\n    $count\
  \ = 0;\n  $count++;\n    return $count;\n}\n\n// 使用\necho incrementCounter(); //\
  \ 输出: 1\necho incrementCounter(); // 输出: 1\n?>\n```\n\n在良好的示例中，`$count` 变量在调用之间持久存在。在糟糕的示例中，变量每次调用函数时都会被重新初始化为\
  \ 0。\n\n61\n\n# 将复杂条件提取为命名良好的方法\n\n***\n\n通过将复杂条件提取为命名良好的方法来提高代码的可读性。\n\n***\n\n\
  以下代码演示了如何将复杂条件提取为命名良好的方法。\n\n## < 良好的代码 >\n\n```php\n<?php\nclass Order {\n    public\
  \ function isEligibleForDiscount() {\n        if ($this->isVIPCustomer() && $this->hasValidCoupon())\
  \ {\n            return true;\n        }\n        return false;\n    }\n\n    private\
  \ function isVIPCustomer() {\n        // 逻辑\n        return true;\n    }\n\n   \
  \ private function hasValidCoupon() {\n        // 逻辑\n        return true;\n   \
  \ }\n}\n?>\n```\n\n## < 糟糕的代码>\n\n```php\n<?php\nclass Order {\n    public function\
  \ isEligibleForDiscount() {\n        if ($this->customerType === 'VIP' && $this->couponStatus\
  \ === 'ACTIVE') {\n            return true;\n        }\n        return false;\n\
  \    }\n}\n?>\n```\n\n良好的代码示例将复杂条件提取为命名良好的方法 `isEligibleForDiscount()`。它进一步将该条件拆分为两个独立的方法：`isVIPCustomer()`\
  \ 和 `hasValidCoupon()`。这种方法使代码更具可读性和自解释性。\n\n糟糕的代码示例虽然较较短，但将多个条件合并在一行中，使得一目难以理解，并且在未来可能更难以维护或修改。\n\
  \n\n\n\n\n以下代码演示了如何将不同级别的抽象分离到不同的方法中，以提高可读性和可维护性。\n\n### 良好的代码\n\n```php\nclass\
  \ EmailSender {\n\n    public function sendWelcomeEmail($user) {\n        $emailContent\
  \ = $this->prepareWelcomeEmailContent($user);\n        $this->sendEmail($user->email,\
  \ 'Welcome!', $emailContent);\n    }\n\n    private function prepareWelcomeEmailContent($user)\
  \ {\n        $template = $this->getWelcomeEmailTemplate();\n        return str_replace('{USERNAME}',\
  \ $user->name, $template);\n    }\n\n    private function getWelcomeEmailTemplate()\
  \ {\n        return \"Hello {USERNAME},\\n\\nWelcome to our platform!\";\n    }\n\
  \n    private function sendEmail($to, $subject, $content) {\n        // Code to\
  \ actually send the email\n    }\n}\n\n// Usage\n$emailSender = new EmailSender();\n\
  $emailSender->sendWelcomeEmail($user);\n```\n\n### 糟糕的代码\n\n```php\nclass EmailSender\
  \ {\n\n    public function sendWelcomeEmail($user) {\n        $template = \"Hello\
  \ {USERNAME},\\n\\nWelcome to our platform!\";\n        $content = str_replace('{USERNAME}',\
  \ $user->name, $template);\n        // Code to send email\n        // ...\n    }\n\
  }\n\n// Usage\n$emailSender = new EmailSender();\n$emailSender->sendWelcomeEmail($user);\n\
  ```\n\n良好的代码示例将不同层级的抽象分离到不同的方法中。`sendWelcomeEmail()` 方法提供了流程的高层概览，而低层细节则由 `prepareWelcomeEmailContent()`、`getWelcomeEmailTemplate()`\
  \ 和 `sendEmail()` 等独立方法负责处理。这种分离使得代码更具模块化、更容易理解，并且更易维护或扩展。\n\n糟糕的代码示例将所有操作合并在单个方法中，将高层逻辑与低层细节混合在一起。这种方法会导致代码更难以阅读、理解和维护，特别是当操作复杂性增加时。\n\
  \n<Memo>\n该原则与 SOLID 原则中的单一职责原则 (SRP) 相关，该原则规定一个类或方法应该只有一个改变的原因。\n\n</Memo>\n\n\
  63\n\n# 使用不修改状态的纯函数\n\n编写对于给定输入始终产生相同输出且不修改外部状态的函数。\n\n以下代码演示了一个纯函数，它可以在不修改原始数据的情况下计算数组之和：\n\
  \n### 良好的代码\n\n```php\n/**\n * 计算数字数组之和\n *\n * @param array $numbers 待求和的数字数组\n\
  \ * @return int 数组中所有数字之和\n */\nfunction calculateSum(array $numbers): int\n{\n\
  \    // 使用 array_reduce 求和所有元素而不修改原始数组\n    return array_reduce($numbers, function($carry,\
  \ $item) {\n        return $carry + $item;\n    }, 0);\n}\n\n// 示例用法\n$myNumbers\
  \ = [1, 2, 3, 4, 5];\n$sum = calculateSum($myNumbers);\necho \"Sum: \" . $sum; //\
  \ Output: Sum: 15\n\n// 原始数组保持不变\nprint_r($myNumbers); // Output: Array ([0] =>\
  \ 1 [1] => 2 [2] => 3 [3] => 4 [4] => 5 )\n```\n\n### 糟糕的代码\n\n```php\n/**\n * 计算数字数组之和（非纯函数）\n\
  \ *\n * @param array $numbers 待求和的数字数组\n * @return int 数组中所有数字之和\n */\nfunction\
  \ calculateSum(array &$numbers): int\n{\n    $sum = 0;\n    // 在计算和的同时修改原始数组\n \
  \   foreach ($numbers as &$number) {\n        $sum += $number;\n        $number\
  \ *= 2; // 修改数组中的每个数字\n    }\n    return $sum;\n}\n\n// 示例用法\n$myNumbers = [1, 2,\
  \ 3, 4, 5];\n$sum = calculateSum($myNumbers);\necho \"Sum: \" . $sum; // Output:\
  \ Sum: 15\n\n// 原始数组被修改了\nprint_r($myNumbers); // Output: Array ([0] => 2 [1] =>\
  \ 4 [2] => 6 [3] => 8 [4] => 10 )\n```\n\n良好的代码示例演示了一个纯函数，它可以在不修改原始数据的情况下计算数组之和。它使用\
  \ `array_reduce` 遍历数组并对其元素求和。该函数对于相同的输入总是产生相同的输出，并且没有任何副作用。\n\n糟糕的代码示例展示了一个非纯函数，它在计算和的同时修改了原始数组。它使用了引用参数并在计算过程中修改了数组的每个元素。这种方法会导致意外的行为，并使得代码难以推理和测试。\n\
  \n<Memo>\n纯函数是函数式编程中的核心概念，可以写出更可预测且更容易测试的代码。\n\n</Memo>\n\n64\n\n# 为类和方法实现单一职责原则\n\
  \n设计具有单一、明确职责的类和方法，以改进代码组织和可维护性。\n\n以下代码通过分离用户数据管理和电子邮件功能演示了单一职责原则：\n\n### 良好的代码\n\
  \n```php\n/**\n * 负责管理用户数据的类\n */\nclass User\n{\n    private $name;\n    private\
  \ $email;\n\n    /**\n     * 初始化用户数据的构造函数\n     * @param string $name 用户名\n    \
  \ * @param string $email 用户邮箱\n     */\n    public function __construct(string $name,\
  \ string $email)\n    {\n        $this->name = $name;\n        $this->email = $email;\n\
  \    }\n\n    /**\n     * 获取用户的邮箱\n     * @return string 用户邮箱\n     */\n    public\
  \ function getEmail()\n    {\n        return $this->email;\n    }\n}\n\n/**\n *\
  \ 负责发送电子邮件的类\n */\nclass EmailService\n{\n    /**\n     * 向用户发送欢迎邮件\n     * @param\
  \ User $user 要发送的用户\n     * @return bool 如果邮件发送成功返回 true，否则返回 false\n     */\n \
  \   public function sendWelcomeEmail(User $user)\n    {\n        $to = $user->getEmail();\n\
  \        $subject = \"欢迎来到我们的服务!\";\n        $message = \"感谢您加入我们的平台。\";\n     \
  \   // 邮件发送逻辑...\n        return mail($to, $subject, $message);\n    }\n    // 其他相关方法...\n\
  }\n\n// 用法\n$user = new User(\"John Doe\", \"john@example.com\");\n$emailService\
  \ = new EmailService();\n$emailService->sendWelcomeEmail($user);\n```\n\n### 糟糕的代码\n\
  \n```php\n/**\n * 混合了职责的用户类\n */\nclass User\n{\n    private $name;\n    private\
  \ $email;\n\n    /**\n     * 初始化用户数据的构造函数\n     * @param string $name 用户名\n    \
  \ * @param string $email 用户邮箱\n     */\n    public function __construct(string $name,\
  \ string $email)\n    {\n        $this->name = $name;\n        $this->email = $email;\n\
  \    }\n\n    /**\n     * 向用户发送欢迎邮件\n     * @return bool 如果邮件发送成功返回 true，否则返回 false\n\
  \     */\n    public function sendWelcomeEmail()\n    {\n        $to = $this->email;\n\
  \        $subject = \"欢迎来到我们的服务!\";\n        $message = \"感谢您加入我们的平台。\";\n     \
  \   // 邮件发送逻辑...\n        return mail($to, $subject, $message);\n    }\n    // 其他用户相关和邮件相关方法混合在一起...\n\
  }\n\n// 用法\n$user = new User(\"John Doe\", \"john@example.com\");\n$user->sendWelcomeEmail();\n\
  ```\n\n\n\n\n\n# 将查询操作与命令操作分离\n\n通过将数据检索（查询）与数据修改（命令）分离，来提高代码的可读性。\n\n以下代码演示了如何在用户管理系统中分离查询操作和命令操作：\n\
  \n#### 好代码\n\n```php\n// UserRepository.php\n\nclass UserRepository {\n    // 查询操作\n\
  \    public function findUserById(int $id): ?User {\n        // 查找用户的数据库查询\n   \
  \     // 返回 User 对象或 null\n    }\n    // 命令操作\n    public function saveUser(User\
  \ $user): void {\n        // 保存用户的数据库操作\n        // 无返回值\n    }\n}\n\n// UserService.php\n\
  \nclass UserService {\n    private $userRepository;\n    public function __construct(UserRepository\
  \ $userRepository) {\n        $this->userRepository = $userRepository;\n    }\n\
  \    public function updateUserEmail(int $userId, string $newEmail): void {\n  \
  \      // 查询\n        $user = $this->userRepository->findUserById($userId);\n  \
  \      if ($user === null) {\n            throw new UserNotFoundException();\n \
  \       }\n        // 修改\n        $user->setEmail($newEmail);\n        // 命令\n \
  \       $this->userRepository->saveUser($user);\n    }\n}\n```\n\n#### Bad 代码\n\n\
  ```php\n// UserManager.php\n\nclass UserManager {\n    public function updateUserEmail($userId,\
  \ $newEmail) {\n        $db = new Database();\n        $user = $db->query(\"SELECT\
  \ * FROM users WHERE id = $userId\")->fetch();\n        if ($user) {\n         \
  \   $db->query(\"UPDATE users SET email = '$newEmail' WHERE id = $userId\");\n \
  \           return true;\n        }\n        return false;\n    }\n}\n```\n\n好代码示例通过使用仓库模式实现了关注点分离。它清晰地区分了查询操作（`findUserById`）和命令操作（`saveUser`）。`UserService`\
  \ 使用这些操作来完成复杂任务。\n\n坏代码示例在单个方法中混合了查询和更新，使其难以理解和维护。它也没有将数据库操作与业务逻辑分离。\n\n**Memo**\n\
  该原则是命令查询职责分离（CQRS）模式的一部分，该模式可以扩展到在大型复杂系统中分离读写模型。\n\n66\n\n# 使用 SplEnum 使用类型安全的枚举\n\
  \n通过对枚举类型使用 `SplEnum`，增强代码的清晰度和类型安全性。\n\n以下代码展示了如何使用 `SplEnum` 创建类型安全的枚举：\n\n####\
  \ 好代码\n\n```php\n// UserStatus.php\n\nclass UserStatus extends SplEnum {\n    const\
  \ __default = self::ACTIVE;\n    const ACTIVE = 1;\n    const INACTIVE = 2;\n  \
  \  const SUSPENDED = 3;\n}\n\n// 使用\nclass User {\n    private $status;\n    public\
  \ function setStatus(UserStatus $status) {\n        $this->status = $status;\n \
  \   }\n    public function getStatus(): UserStatus {\n        return $this->status;\n\
  \    }\n}\n\n$user = new User();\n$user->setStatus(UserStatus::ACTIVE);\nif ($user->getStatus()->equals(UserStatus::ACTIVE))\
  \ {\n    echo \"User is active\";\n}\n```\n\n#### Bad 代码\n\n```php\n// 没有使用枚举\n\
  class User {\n    private $status;\n    public function setStatus($status) {\n \
  \       $this->status = $status;\n    }\n    public function getStatus() {\n   \
  \     return $this->status;\n    }\n}\n\n$user = new User();\n$user->setStatus(1);\
  \ // 1 代表什么？\nif ($user->getStatus() == 1) {\n    echo \"User is active\"; // 不清楚\
  \ 1 代表什么\n}\n```\n\n好代码使用 `SplEnum` 为 `UserStatus` 创建了类型安全的枚举。这为状态提供了清晰、有意义的常量，并确保了在设置或检查状态时的类型安全。坏代码使用任意整数来表示状态，这可能导致困惑和错误。在没有额外文档的情况下，这一点是不清晰的。\n\
  \n**Memo**\n`SplEnum` 是 PHP 标准库（SPL）的一部分，需要安装 SPL 扩展。在 PHP 8.1+ 中，原生枚举已作为语言特性可用，为枚举类型提供了更健壮的解决方案。\n\
  \n67\n\n# 为方法链实现流式接口（Fluent Interfaces）\n\n使用方法链来创建更具表现力的力的代码。\n\n以下代码演示了如何为简单的\
  \ `User` 类实现流式接口：\n\n#### 好代码\n\n```php\n// 好示例：流式接口实现\nclass User {\n    private\
  \ $name;\n    private $email;\n    private $age;\n\n    // 设置名字的方法，返回 $this 以支持链式\n\
  \    public function setName($name) {\n        $this->name = $name;\n        return\
  \ $this;\n    }\n    // 设置邮箱的方法，返回 $this 以支持链式\n    public function setEmail($email)\
  \ {\n        $this->email = $email;\n        return $this;\n    }\n    // 设置年龄的方法，返回\
  \ $this 以支持链式\n    public function setAge($age) {\n        $this->age = $age;\n\
  \        return $this;\n    }\n    // 获取用户信息的方法\n    public function getInfo() {\n\
  \        return \"Name: {$this->name}, Email: {$this->email}, Age: {$this->age}\"\
  ;\n    }\n}\n\n// 流式接口的使用\n$user = (new User())\n    ->setName(\"John Doe\")\n \
  \   ->setEmail(\"john@example.com\")\n    ->setAge(30);\necho $user->getInfo();\n\
  ```\n\n#### Bad 代码\n\n```php\n// 坏示例：没有流式接口\nclass User {\n    private $name;\n\
  \    private $email;\n    private $age;\n\n    // 设置名字的方法\n    public function setName($name)\
  \ {\n        $this->name = $name;\n    }\n    // 设置邮箱的方法\n    public function setEmail($email)\
  \ {\n        $this->email = $email;\n    }\n    // 设置年龄的方法\n    public function\
  \ setAge($age) {\n        $this->age = $age;\n    }\n    // 获取用户信息的方法\n    public\
  \ function getInfo() {\n        return \"Name: {$this->name}, Email: {$this->email},\
  \ Age: {$this->age}\";\n    }\n}\n\n// 无流式接口的使用\n$user = new User();\n$user->setName(\"\
  John Doe\");\n$user->setEmail(\"john@example.com\");\n$user->setAge(30);\n```\n\n\
  好示例通过在每个 setter 方法中返回 `$this` 实现了流式接口。这允许方法链调用，使得代码更具可读性。坏示例没有使用方法链，导致了多次独立的方法调用。\n\
  \n**Memo**\n流式接口由 Martin Fowler 推推广，在许多现代框架和库中广泛使用。\n\n68\n\n# 不需要继承时使用 final 类\n\
  \n在不需要或不打算被继承时，将类声明为 `final`。\n\n以下代码展示了如何使用 `final` 类来防止意外的继承：\n\n#### 好代码\n\n\
  ```php\n// 好示例：使用 final 类\nfinal class Configuration {\n    private $settings =\
  \ [];\n\n    // 构造函数初始化设置\n    public function __construct(array $initialSettings\
  \ = []) {\n        $this->settings = $initialSettings;\n    }\n    // 获取设置的方法\n\
  \    public function getSetting($key) {\n        return $this->settings[$key] ??\
  \ null;\n    }\n    // 设置设置的方法\n    public function setSetting($key, $value) {\n\
  \        $this->settings[$key] = $value;\n    }\n}\n\n// final 类的使用\n$config = new\
  \ Configuration(['debug' => true]);\necho $config->getSetting('debug'); // 输出：1\
  \ (true)\n```\n\n#### Bad 代码\n\n```php\n// 坏示例：没有使用 final 类\nclass Configuration\
  \ {\n    protected $settings = [];\n\n    // 构造函数初始化设置\n    public function __construct(array\
  \ $initialSettings = []) {\n        $this->settings = $initialSettings;\n    }\n\
  \    // 获取设置的方法\n    public function getSetting($key) {\n        return $this->settings[$key]\
  \ ?? null;\n    }\n    // 设置设置的方法\n    public function setSetting($key, $value)\
  \ {\n        $this->settings[$key] = $value;\n    }\n}\n\n// 意之外的继承\nclass ExtendedConfiguration\
  \ extends Configuration {\n    // 这可能会破坏 Configuration 的预期行为\n}\n```\n\n\n\n\n\n\
  ```php\npublic function overrideAllSettings(array $newSettings) {\n    $this->settings\
  \ = $newSettings;\n}\n}\n```\n\n// 非 final 类的用法\n\n```php\n$config = new ExtendedConfiguration(['debug'\
  \ => true]);\n$config->overrideAllSettings(['debug' => false, 'unsafe' => true]);\n\
  echo $config->getSetting('debug'); // 输出：(空)\n```\n\n良好的示例使用了 `final` 类，防止了任何继承。这确保了\
  \ `Configuration` 类的行为符合预期，且不会以可能破坏其功能的方式进行扩展。而糟糕的示例允许继承，如果该类被不恰当地扩展，可能会导致意料之外的行为。\n\
  \n<Memo>\n使用 `final` 类还可以略微提高 PHP 的性能，因为引擎不需要检查子类中是否存在被重写的方法。\n</Memo>\n\n69\n\n\
  # 使用 PHPStan 等静态分析工具提高代码质量\n\n* * *\n\n使用 `PHPStan` 自动检测潜在错误并提高代码质量。\n\n* * *\n\n\
  以下示例演示了如何使用 `PHPStan` 分析一个简单的 PHP 函数：\n\n< 良好的代码 >\n\n```php\n<?php\n// 文件: example.php\n\
  \n/**\n * 计算两个整数之和\n *\n * @param int $a 第一个数字\n * @param int $b 第二个数字\n * @return\
  \ int $a 和 $b 的和\n */\nfunction add(int $a, int $b): int\n{\n    return $a + $b;\n\
  }\n// 用法\n$result = add(5, 3);\necho $result; // 输出：8\n```\n\n<糟糕的代码>\n```php\n\
  <?php\n// 文件: example.php\nfunction add($a, $b)\n{\n    return $a + $b;\n}\n$result\
  \ = add(\"5\", \"3\");\necho $result;\n```\n\n在良好的示例中，我们对参数和返回值使用了类型声明，`PHPStan`\
  \ 可以对其进行分析。糟糕的示例缺少类型声明，容易出现与类型相关的错误。在良好的代码上运行 `PHPStan` 不产生错误，而糟糕的代码可能会生成关于潜在类型不匹配的警告。\n\
  \n使用 `PHPStan`：\n\n安装 `PHPStan`：`composer require --dev phpstan/phpstan`\n\n运行分析：`vendor/bin/phpstan\
  \ analyse example.php`\n\n<Memo>\n`PHPStan` 具有不同的规则级别（0-9），对应不同严格程度的分析。级别 0 最松，级别\
  \ 9 最严格。\n</Memo>\n\n70\n\n# 对原生类型使用标量类型声明\n\n* * *\n\n使用标量类型声明强制执行 PHP 中原生数据类型的严格类型。\n\
  \n* * *\n\n以下示例展示了如何在计算矩形面积的未使用标量类型声明：\n\n< 良好的代码 >\n\n```php\n<?php\ndeclare(strict_types=1);\n\
  \n/**\n * 计算矩形面积\n *\n * @param float $length 矩形的长度\n * @param float $width 矩形的宽度\n\
  \ * @return float 矩形的面积\n */\nfunction calculateRectangleArea(float $length, float\
  \ $width): float\n{\n    return $length * $width;\n}\n// 用法\n$area = calculateRectangleArea(5.5,\
  \ 3.2);\necho \"Area: \" . $area; // 输出：Area: 17.6\n```\n\n<糟糕的代码>\n```php\n<?php\n\
  function calculateRectangleArea($length, $width)\n{\n    return $length * $width;\n\
  }\n// 用法\n$area = calculateRectangleArea(\"5.5\", \"3.2\");\necho \"Area: \" . $area;\n\
  ```\n\n在良好的示例中，我们使用 `declare(strict_types=1)` 启用严格类型检查，并对参数和返回值使用 float 类型声明。这确保了只接受和返回\
  \ `float` 值。糟糕的示例缺少类型声明，允许任何类型的输入，这可能导致意外的结果或错误。\n\n使用标量类型声明的好处：\n- 提高代码可读性\n- 运行时运行时更好的错误检测\n\
  - 增强 IDE 对自动补全和类型提示的支持\n\n<Memo>\nPHP 7.0 引入了针对 `int`、`float`、`string` 和 `bool`\
  \ 的标量类型声明。在此之前，仅允许类名、`self`、`array` 和 `callable` 作为类型提示。\n</Memo>\n\n71\n\n# 将长方法链拆分为多行\n\
  \n* * *\n\n通过将长方法链拆分到多行来提高代码可读性。\n\n* * *\n\n以下代码演示了如何拆分长方法链以提高可读性：\n\n< 良好的代码 >\n\
  ```php\n// 良好：将长方法链拆分为多行\n$result = $database->table('users')\n    ->select('name',\
  \ 'email')\n    ->where('active', true)\n    ->orderBy('created_at', 'desc')\n \
  \   ->limit(10)\n    ->get();\n```\n\n<糟糕的代码>\n```php\n// 糟糕：单行上的长方法链\n$result =\
  \ $database->table('users')->select('name', 'email')->where('active', true)->orderBy('created_at',\
  \ 'desc')->limit(10)->get();\n```\n\n良好的代码示例将长方法链拆分为多行，每个方法调用都占新行并进行缩进。这通过更容易看到链中的每一步改进了可读性。糟糕的代码示例将所有内容放在同一行，使得更难阅读和理解单个方法调用。\n\
  \n<Memo>\n许多现代 IDE 都有助于拆分长方法链。\n</Memo>\n\n72\n\n# 使用中间变量解释复杂计算\n\n* * *\n\n通过为复杂计算使用中间变量来提高代码清晰度。\n\
  \n* * *\n\n以下代码展示了如何使用中间变量使计算清晰：\n\n< 良好的代码 >\n```php\n// 良好：使用中间变量\n$basePrice\
  \ = 100;\n$taxRate = 0.08;\n$discountPercentage = 0.1;\n\n$priceAfterDiscount =\
  \ $basePrice * (1 - $discountPercentage);\n$taxAmount = $priceAfterDiscount * $taxRate;\n\
  $finalPrice = $priceAfterDiscount + $taxAmount;\n\necho \"Final price: \" . number_format($finalPrice,\
  \ 2);\n```\n\n<糟糕的代码>\n```php\n// 糟糕：没有中间变量的复杂计算\necho \"Final price: \" . number_format(100\
  \ * (1 - 0.1) * 1.08, 2);\n```\n\n使用意义的变量不仅提高了可读性，还可以作为文档。\n\n# 将复杂的正则表达式提取为命名常量\n\
  \n* * *\n\n通过为正则表达式使用命名常量提高代码可读性。\n\n* * *\n\n以下代码演示了如何将复杂的正则表达式提取为命名常量，以提高可读性和维护性。\n\
  \n< 良好的代码 >\n```php\n<?php\n// 为正则表达式定义命名常量\nconst EMAIL_REGEX = '/^[a-z0-9._%+-]+@[a-z0-9.-]+\\\
  .[a-z]{2,}$/i';\n\n// 在代码中使用命名常量\nfunction validateEmail($email) {\n    // 检查邮箱是否匹配定义的模式\n\
  \    if (preg_match(EMAIL_REGEX, $email)) {\n        return true;\n    }\n    return\
  \ false;\n}\n\n// 示例\n$email = 'user@example.com';\nif (validateEmail($email)) {\n\
  \    echo \"Valid email address\";\n} else {\n    echo \"Invalid email address\"\
  ;\n}\n```\n\n<糟糕的代码>\n```php\n<?php\n// 函数中直接使用复杂的正则表达式\nfunction validateEmail($email)\
  \ {\n    // 直接在 preg_match 函数中使用复杂的正则表达式\n    if (preg_match('/^[a-z0-9._%+-]+@[a-z0-9.-]+\\\
  .[a-z]{2,}$/i', $email)) {\n        return true;\n    }\n    return false;\n}\n\n\
  // 示例\n$email = 'user@example.com';\nif (validateEmail($email)) {\n    echo \"Valid\
  \ email address\";\n} else {\n    echo \"Invalid email address\";\n}\n```\n\n\n\n\
  \n\n# 使用数组解构一次性为多个变量来简化代码。\n\n以下代码演示了如何在 PHP 中使用数组解构进行更整洁的多变量赋值。\n\n### < 良好的代码\
  \ >\n```php\n// 返回用户详情数组的函数\nfunction getUserDetails() {\n    return ['John Doe',\
  \ 30, 'john@example.com'];\n}\n\n// 使用数组解构赋值多个变量\n[$name, $age, $email] = getUserDetails();\n\
  \n// 使用赋值后的变量\necho \"Name: $name, Age: $age, Email: $email\";\n```\n\n### < 坏的代码>\n\
  ```php\n// 返回用户详情数组的函数\nfunction getUserDetails() {\n    return ['John Doe', 30,\
  \ 'john@example.com'];\n}\n\n// 逐个赋值\n$userDetails = getUserDetails();\n$name =\
  \ $userDetails[0];\n$age = $userDetails[1];\n$email = $userDetails[2];\n\n// 使用赋值后的变量\n\
  echo \"Name: $name, Age: $age, Email: $email\";\n```\n\n良好的代码示例使用数组解构在单行内为多个变量赋值，使代码更加简洁且易于读。坏的代码示例逐个赋值每个变量，这过于冗长，并且当数组结构发生变化时容易出错。\n\
  \n### < 备忘 >\n数组解构是在 PHP 7.1 中引入的，提供了一种将数组拆分为独立变量的方便方法。\n\n75\n\n# 使用空合并赋值运算符 (??=)\
  \ 实现简洁的默认赋值\n\n在 PHP 7.4+ 中使用 `??=` 高效地分配默认值。\n\n以下代码演示了如何使用空合并赋值运算符 (`??=`) 为变量设置默认值：\n\
  \n### < 良好的代码 >\n```php\n// 使用空合并赋值运算符的良好代码\nfunction getUserSettings($userId) {\n\
  \    $settings = fetchUserSettings($userId);\n    // 使用 ??= 设置默认值\n    $settings['theme']\
  \ ??= 'light';\n    $settings['notifications'] ??= true;\n    $settings['language']\
  \ ??= 'en';\n    return $settings;\n}\n```\n\n### < 坏的代码>\n```php\n// 未使用空合并赋值运算符的坏代码\n\
  function getUserSettings($userId) {\n    $settings = fetchUserSettings($userId);\n\
  \    // 使用传统方法设置默认值\n    if (!isset($settings['theme'])) {\n        $settings['theme']\
  \ = 'light';\n    }\n    if (!isset($settings['notifications'])) {\n        $settings['notifications']\
  \ = true;\n    }\n    if (!isset($settings['language'])) {\n        $settings['language']\
  \ = 'en';\n    }\n    return $settings;\n}\n```\n\n良好的代码示例使用 `??=` 简洁地为键设置默认值。该运算符仅在左侧变量为\
  \ null 或不存在时才分配右侧的值。与使用传统 `if` 语句的坏代码相比，它更具可读性并减少了代码行数。\n\n### < 备忘 >\n空合并赋值运算符\
  \ (`??=`) 在 PHP 7.4 中引入的，作为检查并分配默认值常用模式的简写。\n\n76\n\n# 将配置提取到单独的文件\n\n通过将配置与逻辑分离提高可维护性。\n\
  \n以下示例展示了如何将设置提取到单独的文件：\n\n### < 良好的代码 >\n```php\n// config.php\nreturn [\n    'database'\
  \ => [\n        'host' => 'localhost',\n        'username' => 'user',\n        'password'\
  \ => 'password',\n        'dbname' => 'myapp'\n    ],\n    'api_key' => 'your_api_key_here',\n\
  \    'debug_mode' => true\n];\n\n// main.php\n$config = require 'config.php';\n\
  // 使用配置\n$dbHost = $config['database']['host'];\n$apiKey = $config['api_key'];\n\
  ```\n\n### < 坏的代码>\n```php\n// 坏做法：将配置与应用逻辑混合\n$dbHost = 'localhost';\n$dbUsername\
  \ = 'user';\n$dbPassword = 'password';\n$apiKey = 'your_api_key_here';\n$debugMode\
  \ = true;\n\n// 应用逻辑\nfunction connectToDatabase() {\n    global $dbHost, $dbUsername,\
  \ $dbPassword;\n    // 此处进行数据库连接\n}\n\nfunction makeApiCall() {\n    global $apiKey;\n\
  \    // 此处调用 API\n}\n```\n\n良好的代码示例将配置分离到专用的 `config.php` 中，该文件返回一个设置数组。这种方法使得在不修改主应用代码的情况下，更容易管理和更新配置。坏的代码将配置直接与应用逻辑混合，使得在整个应用程序中维护和更新设置变得困难。\n\
  \n### < 备忘 >\n将配置与代码分离是 12 要素应用方法中的核心原则，该方法旨在构建可扩展和可维护的软件服务（SaaS）应用。\n\n77\n\n#\
  \ 将工具函数移动到单独的类或命名空间\n\n将工具函数组织到专用的类或命名空间中，以提高代码的可读性和维护性。\n\n工具函数通常应用于应用的多个部分。通过将它们移动到单独类或命名空间，你可以保持代码库的整洁和模块化，便于他人理解和维护。\n\
  \n### < 良好的代码 >\n```php\n<?php\nnamespace App\\Utils;\n\n/**\n * 通用函数的工具类\n */\n\
  class StringUtils {\n    /**\n     * 将字符串转换为驼峰式\n     *\n     * @param string $string\n\
  \     * @return string\n     */\n    public static function toCamelCase(string $string):\
  \ string {\n        $result = strtolower($string);\n        preg_match_all('/[a-zA-Z0-9]+/',\
  \ $result, $matches);\n        $result = $matches[0][0];\n        for ($i = 1; $i\
  \ < count($matches[0]); $i++) {\n            $result .= ucfirst($matches[0][$i]);\n\
  \        }\n        return $result;\n    }\n}\n\n// 使用\necho App\\Utils\\StringUtils::toCamelCase('hello_world');\
  \ // 输出：helloWorld\n?>\n```\n\n### < 坏的代码>\n```php\n<?php\n/**\n * 将字符串转换为驼峰式\n\
  \ *\n * @param string $string\n * @return string\n */\nfunction toCamelCase($string)\
  \ {\n    $result = strtolower($string);\n    preg_match_all('/[a-zA-Z0-9]+/', $result,\
  \ $matches);\n    $result = $matches[0][0];\n    for ($i = 1; $i < count($matches[0]);\
  \ $i++) {\n        $result .= ucfirst($matches[0][$i]);\n    }\n    return $result;\n\
  }\n\n// 使用\necho toCamelCase('hello_world'); // 输出：helloWorld\n?>\n```\n\n在良好的示例中，工具函数\
  \ `toCamelCase` 被封装在 `App\\Utils` 命名空间的 `StringUtils` 类中。这种组织方式使工具函数的位置清晰并避免了命名冲突。在坏示例中，函数定义在全局作用域，这会导致大型代码库变得混乱。\n\
  \n### < 备忘 >\nPHP 命名空间是在 5.3 版本引入的，有助于避免冲突并将代码组织成逻辑组。\n\n78\n\n\n\n\n\n```php\n\
  $product->createProduct(); // 输出: [LOG]: 产品创建成功。\n?>\n```\n\n<Bad Code>\n\n```php\n\
  <?php\n\nclass User {\n    /**\n     * 记录消息\n     *\n     * @param string $message\n\
