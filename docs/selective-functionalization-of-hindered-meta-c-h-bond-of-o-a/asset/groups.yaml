    # CellProcess


    ## 化学文章


    接下来，我们使用羧基化化合物 (2a) 和硝酰基氟硼酸钾 (PhBF,K, 3a) 作为模型底物制备最终产物 (5a) (图 2B)。在乙酸引导的 C-H
    芳基化中，形成了位阻间-C-H 芳基化化合物 (4a)。证明了单N-保护氨基酸 (MPAAs) 可以加速 Pd(II) 催化的 C(sp³)-H/硼交叉偶联。然后，选择了
    46 种 MPAAs 和 2 种碱进行初始条件筛选。通过高通量实验 (HTE) 总共评估了 92 种条件。随后进一步使用 HTE 优化了 MPAAs、碱、苯醌
    (BQ)、温度和方法（见补充信息）。值得注意的是，在此过程中观察到了一定水平的脱羧产物 (5a)。通过使用 L12、KPO₄ 和 BQ2，产率提高到 92%
    (5a = 4a = 6:86)。最后，在 150 °C 的微波下进行 0.5 h 的脱羧，获得了产率为 77% 的间-C-H 芳基化最终产物 (5a)。


    ## 范围


    利用优化后的条件，我们开始通过 HTE 探索邻烷基芳基酮和硝酰基氟硼酸钾 (ArBF,K) 的范围（图 3）。得于 CH-芳基团的 ¹H-NMR 位移，我们通过高通量方法确定了反应产率。因此，HTE
    实现了切线 C-H 功能化的探索，即光诱导的羧基化/羰基装饰。选择了一个结构多样化的取代酮底物阵列，包含 24 种酮 (1a-14) 和 43 种 ArBF
    (3a-32z)，使用 HTE 进行微量反应（图 3）。


    随后，分析了一个包含 1032 条反应数据的数据集（图 4a）。超过 70% 的反应产生了目标产物，这表明我们的策略广泛适用于多种底物。通常，邻甲基苯酮 (1a-u)
    在许多 ArBF,K 下以显著产率提供相应的产物。芳环上负载了氟 (1c, 1g, 1n)、氯 (1d 和 1h) 以及叔丁基 (1f 和 1p)。根据文献，苄位具有巨大位阻的化合物极具挑战性。²6
    令我们惊讶的是，苄位上带有 Me、Et、Bn 和 Ome 的底物 (1q-1t) 也适用于该过程。在邻甲基苯酮 (1u) 的情况下，此类产物很多。看起来邻苯酮
