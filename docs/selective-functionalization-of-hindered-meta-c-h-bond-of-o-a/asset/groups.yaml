    图 6. CMPRY 使用 CAM-GRAD 进行模型可解释性的结构示例 (A-E)。这些通过 CAM-GRAD 计算性能的所选示例。用绿色标记的原子和化学键表示了它们在反应中的重要/重要性。


    为了进行更严苛的测试，我们尝试构建一个同时包含酮类和 ArBFKusen 的独立测试集。我们选取了 4 个酮类（1l, 1s, 1u 和 1w）和 8 个
    ArBFK（3k, 3n, 3p, 3r, 3s, 3w），并重新训练了训练集中的基础反应数据（SA 和 5F）。使用缩减集和独立测试集所实现的性能显示出合理的
    R²，产率平均绝对误差（MAE）为 8.46，表明了 CMPRY 的通用性和稳健性（图 5G）。考虑到预测趋势的复杂性，该性能被认为是是优越的，而文献 [44–51]
    中报道的大多数模型处理的是单步反应。


    为了解释我们基于深度学习的模型，我们采用了梯度加权激活图映射（CAM-GRAD）来识别用于预测的关键原子。如图 6 所示，CMPRY 突出了新的 (csp³)–(csp⁴)
    键的形成，这表明该模型学习了基础的反应信息。对于未产生产物的反应 6C，CMPRY 突出了邻位取代基、甲磺酰基，其原因是位阻对 C-H 键的活化有害的。有趣的是，CMPRY
