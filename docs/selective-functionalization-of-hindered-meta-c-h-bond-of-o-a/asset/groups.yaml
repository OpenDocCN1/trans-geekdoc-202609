    for selective functionalization of hindered meta-C–H bond was purported (Figure7).
    Following the photo-induced C–H carbonylation, the unpurified intermediate was
    subjected to carboxyl group directed Pd-catalyzed C–H arylation with ArBF,JK,
    and then, it was transferred to a MW reactor for decarboxylation for the desired
    product. Generally, this one-pot procedure furnished the hindered meta-C–H carbonylation
    products in good yield (up to 76% for three substrates, ranging up to 91% yield
    for each step). The synthetic applicability and efficiency transfer were demonstrated
    by these results. More importantly, CO2 was acted as a relay director in the control.


    In summary, this methodology achieved selective functionalization of hindered
    meta-C–H bond of o-alkyl ketones. A tandem transformation, involving photo-induced
    C–H carbonylation, carboxyl group directed Pd-catalyzed C–H functionalization,
    MW-assisted decarboxylation, was developed to streamline the access of multiply
    substituted are that would otherwise require extra steps. Further application
    of this strategy is under investigation in our laboratory. Moreover, several DL
    models, which are capable of predicting reaction yield over a range of substrates
    for this one-reaction, have been developed. Overall, we hope that the use of HTE-DL
    paradigm in the development of hindered meta-C–H arylation will stimulate its
    further application in the development of other synthetic methods.


