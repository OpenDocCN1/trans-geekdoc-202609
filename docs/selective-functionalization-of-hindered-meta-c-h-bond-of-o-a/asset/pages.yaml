    Modification of C-H bonds is great for interest for chemists, but selectivity
    is challenging. Differentiating sterially hindered C-H bond over sterically favorable
    C-H bond is difficult. To develop a reaction for the modification of the hindered
    aromatic meta–C–H bond, automation was used to explore reaction space and artificial
    intelligence was used to predict reaction outcome. The integration of automation
    and artificial intelligence will aid the development and application of new synthetic
    methods.


