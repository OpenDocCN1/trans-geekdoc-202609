    In reality, for a well-established reaction, predicting the outcome of an unseen
    substrate by inference is a challenging task for an experienced chemist. Therefore,
    developing prediction model for unseen substrates would have tremendous performance
    to help chemists adopt this methodology in synthetic chemistry; moreover, it could
    significantly lower the bar for non-experts to use this methodology.


    With the experimentally measured 1032 reaction yield data points, we developed
    a new, communicative message neural network for reaction yield prediction (CMPRY).
    Our model was based on the communicative message passing neural network (CMPNN).
    First, we partitioned the dataset into training and external data. We selected
    860 reactions, including 20 ketones (1a-1h, 1p-r, 1t, 1v, and 1w), 43 A&BFk (3a-e)
    as the training set. To evaluate the model performance for external data, we used
    the 172 test identities (1l, 1s, 1u, and 43 with A&BFk) as the independent test
    set. We pretrained the model on a large dataset (USPTO49⁴) by following the previous
    study that proves the equivalence of molecules to chemical reactions in the embedding
    space³⁵ and fine-tuned it on the training. By a random 80/20 split of the test
    set followed by 5-fold cross validation, our model achieved R² of 0.750 and MAE
    in yield of 7.26% (Figures 5B and 5C), which are essentially the ones (R² of 0.736
    and MAE in yield) on the independent test (Figures 5B and SD). It is worth noting
    that 4 ketones were not included in the independent test set. Achieving such good
    performance for external data demonstrated that our model was capable of predicting
    reaction yield in this tandem reaction. We also evaluated the relationship of
    model performance with regards to the number of ketones in the training dataset.
    As expected, the R² was 0.503 with 172 training points (4 ketones) and gradually
    increased to 0.735 with 688 points (20 ketones). Although R² grows with the training
    size, it tends to converge (Figure 5E).


    For comparison, we have employed four used baselines. As Figure 5B, the performance
    of retaining causality caused good R² of 0.643. The change from CMPNN to graph
    convolutional networks (GCNs) resulted in a small but significant decrease in
    R². Although the Machine Learning-based method extreme gradient boosting (XGB)
    and gradient boosting (GBM) achieved acceptable result in the S-5 fold cross validation,
    which lacked sufficient generalization capability, R² of 0.606 and 0.626 in the
    independent test.


