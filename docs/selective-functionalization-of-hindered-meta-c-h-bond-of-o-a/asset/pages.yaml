    # # Selective functionalization of hindered meta-C-H bond of o-alkylaryl ketones
    promoted by deep learning


    Jia Qiu,$1,2,5$ Jiancong Xie,$4,5$ Shimin Shu,$1$ Yadong Gao,$2$ Hen Meng,$4$
    Yuedong Yang,$3,* and Kuangiao Liao,$1,2,6*$


    # SUMMARY


    **Selective functionalization of the sterically hindered aromatic meta-C-H bond
    is unprecedented and remains to be a major challenge.** By automation-based high-throughput
    experimentation (HTE) and deep learning (DL), a novel strategy to functionalize
    the hindered meta-C-H bond is demonstrated. With carbon dioxide as a traceless
    director, a one-pot free-step protocol achieved highly selective arylation of
    o-alkylaryl ketones at the hindered meta position. This novel strategy involved
    photo-induced-C-H carboxylation, microwave-assisted decarboxylation. With HTE
    and DL, a broad scale of substrates was explored (1,032 reactions) and a DL-model
    (CMPRY) for reaction yield prediction was established. Two independent tests with
    o-alkylaryl ketones and potassium trifluorobates were used to evaluate the method.
    The model gave excellent predictions in predicting reactions; mean absolute errors
    were only 6.6% and 8.4%, showing its potential in synthetic application.


    # THE BIGGER PICTURE


    Selective C-H functionalization is a key goal in organic chemistry. Although various
    protocols were reported, distinct electronic and steric properties are generally
    required for the successful differentiation of C-H bond from others. For C-H bonds
    with sterically hindered C-H bonds are strongly preferred over established protocols;
    therefore, selective functionalization of hindered C-H bond remains a major challenge
    addressed by automation and intelligence, a different strategy to functionalize
    the aromatic meta-C-H bond developed. Automation-based high-throughput experimentation
    was used to explore space and reaction data. Artificial intelligence-based models
    were used to predict reaction yield of substrates. The integration of automation
    and intelligence in organic synthesis is an emerging field in chemical research,
    which can expedite reaction discovery and application.


    # INTRODUCTION


    In natural products, pharmaceuticals, and functional materials, substituted arenes
    are ubiquitous and important structural motifs.$^{1-5}$ Selective C-H functionalization
    has been reported. Despite the extra steps to install and remove directing groups
    (DGs), C-H functionalization has demonstrated achieved excellent selective strategies,
    particularly at ortho and hindered meta position (Figure 1A).$^{17-20}$ Yu and
    co-functionalization template strategies enable meta-C-H functionalization, but
    achieved at hindered meta position due to the steric preference (Figure 1B).$^{16-18}$
    Using carbon dioxide ($CO_2$) as a traceless relay for the hindered meta-C-H arylation
    of phenols was reported by Larrosa and coworkers in 2014, which employs Kolbes-Schmitt
    reaction, group-directed Pd-catalyzed C-H arylation, and tandem decarboxylation
    procedure$^{19-21}$ A similar approach, with norbornene (Nb) as a transient mediator,
    was introduced by Yu to achieve aromatic meta-C-H arylation of methyl phenyl ether
    in 2015. The Pd/NRE-relay cycle (Cation process)$^{22}$ was further explored for
    other kinds of hindered meta-C-H functionalization.$^{23-25}$


    Reported progresses focused on hindered meta-C-H bond; however, selective functionalization
    of the hindered meta-C bond bond was rarely reported. To circumvent this challenge,
    we developed a one-pot three-step reaction using $CO_2$ as a traceless DG (Figure
    1C). A photo-induced C(sp$^3$)-H carboxylation


