    reported in the literature [44–51] were dealing with one-step reaction.


    To interpret our DL-based model, we employed the gradient-weighted activation
    mapping (CAM-GRAD) to identify critical atoms for predictions. As shown in Figure
    6, CMPRY highlighted the new (csp³)–(csp⁴) bond formation, indicating that the
    model learned the basic reaction information. For the reaction 6C that gave no
    product, CMPRY highlighted the ortho-substitution, methylsulfonyl group, with
    the reason that the steric hindrance is harmful for the C-H bond activation. Interestingly,
    CMPRY found that the carboxylic acid group was important at all successful reactions,
    such as information was not input into the predictions. Mechanistically, carboxyl
    group is needed to direct palladium catalysis for C-H activation. But not the
    least, there are peculiar structural fragments highlighted in reactions where
    oxygen atoms in the aldehyde and acetyl groups were considered important atoms,
    but only oxygen in the acetyl group was highlighted as an important atom in products.


