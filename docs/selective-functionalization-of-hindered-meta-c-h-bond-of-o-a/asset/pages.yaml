    For a stricter test, we attempted to make an independent test set with both ketones
    and ArBFKusen. We selected 4 ketones (1l, 1s, 1u, and 1w) and 8 ArBFK (3k, 3n,
    3p, 3r, 3s, 3w) and we re-trained the basic reaction data from the training set
