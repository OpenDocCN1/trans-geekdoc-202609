    Next we used to study C-H arylation/decarboxylation process using the carboxylated
    compound (2a) and potassium nitrilylfluoroborate (PhBF,K, 3a) as model substrates
    to make the final product (5a) (Figure 2B). As of the acetic acid directed C-H
    arylation, the hindered meta-C-H arylation compound (4a) was formed. It was proved
    that the mono-N-protected amino acids (MPAAs) could accelerate the Pd(II)-catalyzed
    C(sp³)-H/boron cross-coupling. Then 46 kinds of MPAAs and 2 bases were selected
    for the initial condition screening. In total, 92 conditions were evaluated by
    HTE. Then, further HTE were used to optimize MPAAs, bases, benzoquinones (BQ),
    temperature and method (see supplementary information). It is worth mentioning
    that certain level of decarboxylation product (5a) was observed in this process.
    With L12, KPO₄, and BQ2, the yield was improved to 92% (5a = 4a = 6:86). Finally,
    meta-C-H arylation final product (5a) was obtained in 77% with decarboxylation
    performed in a microwave at 150 °C for 0.5 h.


    # Reaction scope


    With the optimized conditions in hand, we began to explore the scope of o-alkylaryl
    ketones and potassium nitrilylfluoroborate (ArBF,K) via HTE (Figure 3). Thanks
    to the ¹H-NMR shift of the CH-aryl group, we identified the reaction yield via
    high-throughput method. Therefore, the HTE enabled scope exploration on the tangent
    C-H functionalization, i.e., photo-induced carboxylation/carbonyl group decoration.
    A substituted ketones array of structurally diverse substrates, consisting of
    24 ketones (1a-14) and 43 ArBF (3a-32z), was selected to use micro-scale reactions
    using HTE (Figure 3).


    Subsequently, a dataset with 1032 reaction data were analyzed (Figure 4a). It
    was that over 70% of the reactions gave desired products, which demonstrated that
    our strategy was generally applicable for a wide range of substrates. Generally,
    o-tolyl ketones (1a-u) afforded the corresponding products in notable yield with
    many ArBF,K. Substrates such as fluoro (1c, 1g, 1n), and chloro (1d and 1h), and
    tert-butyl (1f and 1p) on the aromatic ring were loaded. According to the literature,
    compounds with substantialic steric hindrance at the benzyl position were challenging.²⁶
    To our surprise, substrates with Me, Et, Bn, and Ome at the benzyl position (1q-1t)
    were also amenable to this process. In the case of o-tolyl ketone (1u), such products
    were afforded much. It appears that o-phenyl ketones (1y) yielded high yield or
    no product. 41% overall yield of using tandem C(sp³)-H activation/C(sp²)-H arylation
    was obtained when it reacted with p-OMePhBF,K (3j). In the C-H carboxylation step,
    aryl alkyl ketones (1v, 1x) were generally considered to have lower reactivity
    than bromophenyl ketones; however, many reactions gave good overall yield. Prediction
    of C(sp³)-H bonds with two adjacent substituents was extremely challenging due
    to the steric hindrance. Substituted o-phenyl ketones (1e, 1p) and para-substituted
    o-tolyl methyl ketone (1w) gave low yield or no product; however, p-OMePhBF,K
    (3j) still gave 23% overall yield with para-chloro o-tolyl ketone (1p). In terms
    of the substrate scope of ArBF,K, electron-donating or electron-drawing groups
    at ortho-, meta-, or para-positions were possible in this reaction (3a-3ze). However,
    ever substituted several reactive functionalities, such as hydroxy (protected
    or unprotected) (3i, 3f, and 3ze), benzoxazole (3zf), ketones (3zg), and aldehydes
