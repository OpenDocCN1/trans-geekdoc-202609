  md: '# 3. ROUND 2: BASIC DIFFERENCE BETWEEN R V/S PYTHON


    ![](img/47becc4dcd588ed7b6c23dabbec5edf7_8_0.png)


    The only thing that is permanent is change itself. R effectively took place of
    SAS and became the lingua franca for Data Science and this is something that is
    no more debated and contested, however, it is was a matter of time when it was
    pushed from its position by Python. Interestingly, the same set of reasons that
    caused R to take place of SAS has caused Python to dethrone R. Also, the way people
    resisted the fact that R has taken over SAS and this became a matter of much debate
    until some years passed and this thing became a fact, a similar debate is ongoing
    while it is becoming clearer that Python has decisively won the battle or has
    won some in some key areas.


    # History


    R was created by Ross Ihaka and Robert Gentleman and was created in 1995 and released
    in 1997. A low-level open source language, R was created to implement the S programming
    language to ease out the method for creating statistical, graphical and data analysis
    models. R first was mostly used in the academic and research fields though slowly
    it spread across the business market and was being used by companies such as Google,


    Facebook to financial institutions situated at the Wall Street. It is supported
    by the R Foundation of Statistical Computing. Python on the other hand was created
    4 years earlier, in 1991 by Guido Van Rossem. Python was envisaged as a high level,
    simple, clean, easy to debug programming language for multiple general purposes.
    Later libraries began to come up that could perform the functions that were performed
    by R.


    # Community and Support


    Some can argue that the community and support of R is better than Python with
    2 million users, having 125 active online groups with support provided through
    mailing lists, Stack Overflow groups and the good documentation provided by its
    supporters. On top of that R has CRAN which is a huge repository which makes the
    process of user contribution very much centralized. On the other hand it can be
    argued that the support for Python is scattered with few of the 1600+ user groups
    being dedicated to data analysis. However, all of this was true until a few years
    back as now the online support and community for Python is almost at par with
    that of the R and could overrun it.'
  merge: -1
  img_proc: true
