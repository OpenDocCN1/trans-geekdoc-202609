  md: '# Speed


    Speed matters a lot especially when it comes to dealing with data. With the recent
    revolution in hardware and with the spread of IoF (Internet of Things), the amount
    of data that is being generated has sky rocketed. This has caused the competition
    between software regarding the speed stiffer.


    The answer to which one is faster is not as straight forward as it seems. As some
    studies show, when it comes to performing loops, R during very high levels of
    iterations has an edge over python. However, there are other factors at play that
    contribute towards making R slow when compared to Python. Being a non-standardized
    language, codes in R can often be written in a poor and inefficient manner making
    the process slow causing the need of using additional packages such as FastR,
    pqR, Riposte etc in order to speed up the process. Also, as mentioned earlier,
    Python is non-sequential which makes the process speedy from the user end. In
    addition to all this, as R runs solely on RAM, smaller tasks sometimes take a
    lot more time.


    The other aspect is not to compare the core languages but rather the performance
    of their packages in order to deploy them to perform various data related operations.
    As far as the major Machine Learning and Deep Learning operations are concerned,
    Python is decisively faster than R because of the fact that a lot of these packages
    are written in lower level languages making the processing time faster. Still,
    when it comes stats based operations, visualization and day to day operations,
    R sometimes take the lead.


