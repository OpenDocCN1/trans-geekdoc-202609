  md: '# 2.1.

    BACKGROUND


    SAS stands for Statistical Analysis System. This software was designed keeping
    in mind the industry''s requirements so that large datasets can be handled. Its
    aim was always to capture the big, multi-billion, multi-national companies that
    required Data Analysis. Obviously, among the first users were the BFSI (Banking,
    Financial Services and Insurance) companies and later companies engaged in Human
    Capital Management.


    This lead to the introduction of various vertical products such as the SAS Financial
    Management (erstwhile CFO Vision) and SAS Human Capital Management (erstwhile
    HR Vision). Not only such companies but many government institutions also started
    using SAS because of its high level of reliability, accuracy and scientific backing.
    This caused administrative units such as FDA (United States Food and Drug Administration
    (a federal agency for control and supervision of food and other health related
    products) started examining new drug applications by standardizing themselves
    on SAS/PH-Clinical which was a SAS component for pharmaceutical users.

    On the other hand, R and Python are programming languages that are free and open
    source. Any statistical software based on them had no backing of any corporation
    which made many agencies anxious to adopt them. Also, because of these software
    were open sourced, they heavily relied on community or 3rd party created packages
    in order to solve specialized domain related task (in reference to the above examples:
    such as Financial Management, Human Capital Management or Pharmaceuticals). Because
    of this, the workings were not standardized and not vetted by any answerable agency,
    which further caused reluctance among the users working in sensitive domains.


    > This software was designed keeping in mind the industry’s requirements so that
    large datasets can be handled.


    ![](img/47becc4dcd588ed7b6c23dabbec5edf7_3_0.png)'
  merge: -1
  img_proc: true
