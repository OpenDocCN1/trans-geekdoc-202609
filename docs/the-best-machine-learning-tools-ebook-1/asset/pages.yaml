  md: '# 2.3.

    SYNTAX AND LEARNING CURVE


    There is no doubt that SAS is an easy language. Unlike R and Python, there are
    **drag and drop GUI**, Pre-determined standard procedures, integration of SQL
    commands with SQL also providing database access making it useful for professionals
    having no prior knowledge of programming. This was among the reasons for the early
    adoption of SAS as a lot many people working in BFSI domains were familiar with
    SQL as a language and with the SQL queries and adopting SAS was thus easier.


    On the other hand, R and Python are tough when compared to SAS. People sometimes
    are required to have some coding background to properly use them (through it is
    not necessary). This initially acted as a hurdle in the widespread adoption of
    R and python. As the community of these languages grew, there were much more people
    to help with the understanding of these languages. Also, people in this field
    felt the compulsion to go through the learning curve and leave the ease of learning
    provided by SAS because this ease of learning comes at a heavy cost which is underutilization
    of what all can be done on the data and limitations to handle and manage the data.


    > R and Python are tough when compared to SAS. People sometimes are required to
