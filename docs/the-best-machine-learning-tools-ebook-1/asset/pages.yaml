  md: '# ## 2.5. CAPABILITIES


    This is the heart of decision making. The capabilities of any software or language
    is something that ultimately causes one to decide to which software is to be used.
    Let us understand one thing first- all the things that SAS can do, can be done
    in R and Python but the same cannot be said for the other way around. SAS allows
    sophisticated analysis, high quality professional graphs, array of statistical
    functions, ready to use GUI, however, it fails to move beyond this and match with
    the times we live in.


    While SAS can create almost publish worthy graphs, it is difficult to create dynamic,
    complex graphs in SAS.


    The standard statistical, mathematical and modeling capabilities that were once
    provided by SAS are now provided by R and Python too.

    When it comes to Machine Learning which at this day and age is much needed, SAS
    pales in front of R and Python while Deep Learning is out of bounds for SAS and
    as far as to Big Data is concerned, others undoubtedly come out as a winner. Even
    though SAS has provided options to use Hadoop, one thing that stops it from going
    all out is flexibility. SAS is nowhere as flexible as other open source programming
    languages with its output providing more than necessary results and the user having
    little control over what and how somethings are to be done.


    The above factors now make it understandable how and why the need for a new open
    source, flexible and cost effective software was created. Even though SAS is still
    preferred by big financial and marketing companies and is still very much indispensable
    because many times there is less room for experimentation especially when dealing
    in critical scenarios with delicate data, still, at the end of the day there are
    only a limited number of big companies that can afford it. Also, startups and
    medium-sized companies that deal with Big Data, intend to provide end to end service
    and analyze data using sophisticated methods such as Machine, Deep Learning require
    Python and R and is the reason that SAS only holds 3% support from the Data Science
    community. The switch from SAS to R became visible when Telecom, Tech and Research
    companies that had to deal with massive amount of unstructured data started switching
    to R. The final blow came when financial companies that were once considered as
    the stronghold for SAS begin to switch. It is undeniable that the cost of switching
    is massive which includes converting a lot of data which is stored in SAS format
    files (sas7bdat), training new workforce along with setting up new framework’s
    and standard operating procedures but still the fact remains that R took the place
    that SAS once held for a long period of time (albeit to a certain extent).


    > > Machine, Deep Learning require Python and R and is the reason that SAS only
