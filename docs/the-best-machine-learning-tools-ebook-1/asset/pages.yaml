  md: '# 1.

    TOOLS FOR HANDLING DATA


    The saying ''you are as good as your tools'' is true for all the people belonging
    to various professions and it is most certainly holds true for the people who
    are working in the field of Data Science. With the various kinds of data in place
    which can be differentiated through their format, sensitivity or sheer size requires
    specialized tools to deal with them. For many years, the bulk of data during the
    nascent stages of Data Science was made up of pre-dominantly Survey data and later
    Banking and other Financial data. In order to deal with these kind of data which
    was highly sensitive and not much in quantity, tools were created in order to
    respond to the requirement. These data solving data requirements were either made
    by research based institutions or banking and financial organizations. However,
    as the domains and the size of data generation expanded along with the requirement
    to analyze it, new tools were created in order to respond to the new data driven
    landscape.


    > You are as good as your Tools.


    Till now, the most used tools (apart from various spreadsheet based tools such
    as IBM''s Lotus 1-2-3 and Microsoft''s Excel) in the field of Data Analysis or
    Data Science are SQL, SPSS, SAS, MATLAB, R and Python. In today''s day and age,
    3 tools are required to be assessed and scrutinized which are also among the most
    widely used tools, they are SAS, R and Python. With the constant changes happening
    in the realm of data, it become imperative and of utmost importance to find which
    tool is the best or to put it more coherently, which tool should be used where,
    when and for whom it''s worth is. Still, we can try to find out that, by and large
    and of course as of date, has won the great battle of data science tools.


    > Which tool should be used where, when and for whom it''s worth is.


    ![](img/47becc4dcd588ed7b6c23dabbec5edf7_1_0.png)'
