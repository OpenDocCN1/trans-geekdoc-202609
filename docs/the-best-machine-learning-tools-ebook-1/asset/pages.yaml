- pgno: 2
  md: '# 2.

    ROUND 1:

    PROPRIETARY STATISTICAL SOFTWARE V/S OPEN SOURCE FREE PROGRAMS


    ![](img/47becc4dcd588ed7b6c23dabbec5edf7_2_0.png)


    The various tools that can be used to deal with the diverse forms of data are
    nothing but software''s. These software are different from each other in the way
    they deal and process the data and especially the language the user has to know
    in order to operate them. However, from the point of you of adopting any tool
    by an organization, the most important and basic difference between them can be
    if the tool is open source or closed source. Close Source software are Proprietary
    software which has the common characteristics of being not free to use and having
    strict control over the inner working of the software through the retention of
    intellectual property rights which are mainly the source codes and the copyrights.
    Initially, such software which had data handling capabilities were heavily relied
    upon by various institutions and organizations. Among these software were the
    famous Matlab, SPSS, Stata and SAS.


    On the other hand, we have Open Source software which along with other characteristics,
    are free and most importantly can be modified (i.e. the source code is not retained
    by the creator) and can also be shared (as there are are little or no copyright
    restrictions by the user) which in turn leads to collaboration, community formation
    and participation in creating various version of the software often enhancing
    the capabilities of the software. This democratization of the use of a particular
    software leads to its rapid and far reaching adoption across various domains and
    communities.


    ![](img/47becc4dcd588ed7b6c23dabbec5edf7_2_1.png)


    > > R and Python are open source, free to download


    In the battle between SAS, R and Python, the first casualty is of SAS and the
    reason lies in the fact that it is greatly and exclusively controlled by a group.
    For a long period of time SAS was the industry''s standard tool for working on
    Data Science projects especially in the space of enterprise analytics. It all
    started to change with the advent of R. The first switch happened with companies
    deploying R as their standard data science tool kit in place of SAS. To comprehend
    why this happened, we first need to understand the fundamental difference between
    SAS and R which is that while software such as R and Python are open source, free
    to download, available for use for everyone, software such as SAS, MATLAB, SPSS
    etc. are expensive commercial suites. This fundamental difference manifests itself
    in various aspects of these software and we first need to understand them one
    by one.'
  merge: -1
  img_proc: true
