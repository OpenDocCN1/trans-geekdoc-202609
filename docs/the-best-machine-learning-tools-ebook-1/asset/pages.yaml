  md: '# 2.2.

    COST


    Things started to change, especially when the need of analyzing data and create
    products based on data science began to reach domains that were not essentially
    multi-billion dollar companies dealing with large or highly sensitive data. Now,
    with increase in automation and hardware capabilities, the data was being generated
    ''left, right and center'' which caused a huge demand for data analysis in every
    domain, so much so, that the task of analyzing data was actively being outsourced
    to small and medium level companies for whom the cost of acquiring a tool was
    of paramount importance.


    > With increase in automation and hardware capabilities, the data was being generated
    ''left, right and center'' which caused a huge demand for data analysis in every
    domain


    The foremost and biggest jolt that SAS received was because of this very reason,
    cost. SAS was and remains to be an expensive software. Where R is absolutely free,
    SAS charges subscription fees through which the software can be used albeit only
    for a limited period of time. Along with this there is the cost of technical support
    and the fact that there are different versions providing different functionalities
    with the version providing more or specific functionalities costing significantly
    higher.


    This was in stark contrast to R which was free and has now had a lot many packages
    to perform certain very peculiar, industry specific tasks. The working of these
    packages were slowly and gradually were being backed by research papers as R was
    able to penetrate research institutions which gave sanctity to its working and
    various packages that it deployed. This lead to building more confidence among
    the new companies to adopt R as their tools to analyze data and create data driven
    products out of it.


    > SAS was and remains to be an expensive software. Where R is absolutely free'
