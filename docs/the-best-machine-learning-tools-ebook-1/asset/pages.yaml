  md: '# 2.4. SUPPORT AND SECURITY


    The stakes for any company performing data analysis becoming high when sensitive
    data, multiple clients and high dependence on the outcomes for future course of
    action is involved. This is where Support is required in order to understanding
    the inner working of the tool at play and sometimes personal assistance is required
    for troubleshooting. This was something where SAS had and still has the edge over
    other software.


    SAS has a professional full-fledged technical support, something a multi-billion
    dollar company would want. It also has an online community which is active and
    they also have well documented resources on their websites and blogs. Also, SAS
    has the option of providing servers where data could be safely and securely stored.
    This helped in further building confidence among the users performing critical
    data driven operations.


    However, the reason people felt confident to switch R or Python is because still
    all this doesn’t come close to the community experience provided by them. Their
    community is not only huge but is vibrant, diverse and evolving with people from
    various walks of life—from students to programmers and analysts to academicians,
    all providing inputs which allows the inflow of multiple ideas to come in and
    solve a problem. This open source community is the backbone of these programs
    as they lack the ‘proper’ support structure provided by SAS, but again, SAS doesn’t
    have an open source community and solely depends on their already established
    support system. As far as the server services are concerned. R has successfully
    provided servers for their users, again at a cost which is much less than R. As
    far as Python and other languages are concerned, with the advent of cloud based
    computing and the level of assistance and functionalities provided by cloud computing
    services such as Amazon Web Services (AWS), Microsoft Azure, Google Cloud Platform
