    # Licensing


    R was able to displace SAS due to the fact that it was cheap and open source,
    however, ironically enough today when compared to Python, R is not as business-friendly
    when It comes to the distribution of libraries. Python use MIT or BSD licenses
    which make sharing easier comparatively to R which uses CC0 and GPL licenses which
    place more restriction on the distribution of code.


    # Integration


    Even though R is able to integrate with high-level languages such as C, C++ and
    Java, Python''s integration is even better as it is a general purpose scripting
    language and better supports multiple systems. Python is able to adapt itself
