    application had caused others to get ahead of it.


    Traditionally and till now to some extent, R has been attributed as the better
    candidate. Python seems a bit behind with packages such as Seaborn, Pygal, Bokeh
    in front of R that has packages such as ggplot2, googleVis and rCharts. Also,
    some of the visualization packages of python are unstable and hence unreliable.


    R, on the other hand, the has ggplot which can create almost kind of graphs and
    is the backbone of the visualization in R. Also, creating dashboards is also very
    easy in R. One of the major advantage R has over Python is because of the package
    known as Shiny which helps in creating lightweight web application where user
    interactive charts can be created. Also, Shiny is very easy to understand and
    implement and so far Python has no package to counter is successful.


    However, things have started to change with Python having packages such as Altair
