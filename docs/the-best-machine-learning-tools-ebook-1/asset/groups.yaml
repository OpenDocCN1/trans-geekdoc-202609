    ## 2.3. 语法与学习曲线


    毫无疑问，SAS 是一门易学的语言。与 R 和 Python 不同，SAS 提供了**拖放式图形用户界面（GUI）**、预定的标准流程、SQL 命令集成，还能访问数据库，这使得没有编程基础的专业人士也能轻松上手。这也是
    SAS 早期被广泛采用的原因之一，因为许多在 BFSI（银行、金融服务与保险）领域工作的人熟悉 SQL 语言和 SQL 查询，因此采用 SAS 会更加容易。


    另一方面，与 SAS 相比，R 和 Python 较为难学。有时人们需要具备一定的编程背景才能正确使用它们（尽管这不是必须的）。这最初成为 R 和 Python
    广泛普及的障碍。随着这些语言社区的发展，越来越多的人能够帮助他人理解这些语言。同时，该领域的人们也感到有必要经历学习曲线，并放弃 SAS 提供的易学性，因为这种易学性代价高昂——导致数据潜力未被充分利用，并且处理和管理数据的能力受限。


    > 与 SAS 相比，R 和 Python 较为难学。有时人们需要具备一定的编程背景才能正确使用它们（尽管这不是必须的）。


    ![](img/47becc4dcd588ed7b6c23dabbec5edf7_5_0.png)


    ## 2.4. 支持与安全性


    当涉及敏感数据、多个客户以及未来行动计划高度依赖分析结果时，任何公司进行数据分析的风险都会变得很高。这时就需要支持来帮助理解所使用工具的内部机制，有时还需要人工协助排除故障。这正是
    SAS 过去和现在仍比其他软件更具优势的地方。


    SAS 拥有专业、完善的技术支持，这正是大型跨国公司所期望的。它还有一个活跃的在线社区，并且在其网站和博客上有记录良好的资源。此外，SAS 还提供可安全存储数据的服务器选项。这进一步增强了执行关键数据驱动操作的用户信心。


    然而，人们之所以有信心转向 R 或 Python，是因为所有这些仍无法与它们提供的社区体验相提并论。它们的社区不仅规模庞大，而且充满活力、多元且不断发展，成员来自各行各业——从学生到程序员，从分析师到学者，所有人都提供见解，促成多种想法的汇聚来解决问题。这个开源社区是这些程序的支柱，因为它们缺乏
    SAS 提供的“正规”支持结构；但同样，SAS 没有开源社区，只能完全依赖其既有的支持体系。至于服务器服务，R 已成功为其用户提供了服务器，且成本远低于 SAS。至于
    Python 和其他语言，随着云计算的出现，以及亚马逊网络服务（AWS）、微软 Azure、谷歌云平台等云计算服务提供的协助和功能水平，SAS 与其他语言相比的优势已经被削弱。安全性方面有时反而对开源软件有利。由于源代码对所有人开放，新开发者能够发现原始开发者可能疏忽的错误和其他漏洞。这营造了一种环境，使软件得以不断改进，随着时间的推移变得更好、更强大。


    > 随着云计算的出现，以及亚马逊网络服务（AWS）、微软 Azure、谷歌云平台等云计算服务提供的协助和功能水平，SAS 与其他语言相比的优势已经被削弱。


    ![](img/47becc4dcd588ed7b6c23dabbec5edf7_6_0.png)


    ## 2.5. 能力


    这是决策的核心。任何软件或语言的能力最终决定人们选择使用哪款软件。首先让我们明白一点：SAS 能做的所有事情，R 和 Python 都能做到，但反之则不然。SAS
    擅长高级分析、高质量的专业图表、大量统计函数、开箱即用的 GUI，然而，它未能超越这些功能，跟上我们所处的时代。


    虽然 SAS 可以创建几乎达到发表水平的图表，但要在 SAS 中创建动态、复杂的图表却很困难。


    SAS 曾经提供的标准统计、数学和建模能力，如今 R 和 Python 也都能提供。


    当涉及到当今时代非常需要的机器学习时，SAS 在 R 和 Python 面前黯然失色，而深度学习对 SAS 来说更是无法实现；至于大数据，其他语言毫无疑问胜出。尽管
    SAS 已经提供了使用 Hadoop 的选项，但阻碍其全面发展的一个因素是灵活性。SAS 远不如其他开源编程语言灵活，其输出提供了超出必要的结果，用户对做什么以及如何做的控制权很小。


    以上因素让我们理解了为什么需要一种新的开源、灵活且成本效益高的软件。尽管大型金融和营销公司仍然偏爱 SAS，并且 SAS 仍然不可或缺，因为很多时候尤其是在处理敏感数据的关键场景中，试验空间很小；但归根结底，只有有限数量的大公司才能负担得起
    SAS。此外，处理大数据、打算提供端到端服务并使用机器学习和深度学习等复杂方法分析数据的初创公司和中型公司需要 Python 和 R，这也是 SAS 仅获得数据科学社区
    **3%** 支持率的原因。从 SAS 转向 R 的趋势在电信、科技和研究公司开始处理海量非结构化数据并转向 R 时变得明显。最后一击来自曾被视作 SAS
    根据地的金融公司开始转向。不可否认，转换成本巨大，包括转换大量以 SAS 格式文件（sas7bdat）存储的数据、培训新员工以及建立新的框架和标准操作流程。但事实仍然是，R
    取代了 SAS 曾长期占据的地位（尽管在一定程度上）。


    > 机器学习和深度学习需要 Python 和 R，这也是 SAS 仅获得数据科学社区 **3%** 支持率的原因。


    ![](img/47becc4dcd588ed7b6c23dabbec5edf7_7_0.png)


    ## 3. 第二轮：R 与 Python 的基本区别


    ![](img/47becc4dcd588ed7b6c23dabbec5edf7_8_0.png)


    唯一不变的是变化本身。R 有效地取代了 SAS，成为数据科学的通用语言，这一点已经不再有过多争论和争议；然而，被 Python 从其位置上挤下来只是时间问题。有趣的是，导致
    R 取代 SAS 的同样一系列原因，也导致了 Python 将 R 赶下王座。此外，人们曾一度抗拒 R 已取代 SAS 的事实，并为此争论不休，直到几年后这成为事实；类似的争论仍在继续，同时越来越明显的是，Python
    已经决定性地赢得了战斗，或者至少在某些关键领域获胜。


    ### 历史


    R 由 Ross Ihaka 和 Robert Gentleman 创建，于 1995 年创建，1997 年发布。作为一种底层开源语言，R 是为了实现 S
    编程语言而创建，以简化创建统计、图形和数据分析模型的方法。R 最初主要用于学术和研究领域，后来逐渐扩展到商业市场，并被 Google、Facebook 等公司以及华尔街的金融机构使用。R
    由 R 统计计算基金会（R Foundation for Statistical Computing）支持。另一方面，Python 由 Guido van
    Rossum 于 1991 年创建，比 R 早 4 年。Python 被设想为一种高级、简单、干净、易于调试的多用途通用编程语言。后来，能够执行 R 所执行功能的库开始出现。


    ### 社区与支持


    有人可能会争辩说，R 的社区和支持优于 Python：R 拥有 200 万用户，125 个活跃的在线小组，并通过邮件列表、Stack Overflow 小组以及其支持者提供的良好文档提供支持。此外，R
    拥有 CRAN，这是一个庞大的仓库，使得用户贡献的过程高度集中。另一方面，可以争辩说，Python 的支持较为分散，超过 1600 个用户组中只有少数专注于数据分析。然而，这一切在几年前还是如此；如今，Python
    的在线支持和社区几乎与 R 持平，甚至可能超越 R。


