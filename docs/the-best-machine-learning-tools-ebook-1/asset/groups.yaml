    ## 结论


    在决定数据科学的最佳工具时，意见的分歧极其明显。如今，数据科学这一术语已不再局限于探索数据或创建统计模型，而是需要算法的开发以及从各种非常规来源获取数据。它还要求自动化，而这正是
    R 显得僵化和过于专业化，而 Python 显得更具包容性和多样性，使其成为许多技术驱动型公司的理想选择，从而导致人们转向。正如 SAS 当年一样，R 在金融领域也占据着稳固的地位，而这对于任何新工具来说都是最难突破的壁垒，因为该行业不太愿意接受频繁的变革和实验。尽管如此，美国银行选择
    Python 等最新发展表明这堵墙正在出现裂缝，数据科学家的通用语言已不再是毫无争议的 R。学习 Python 的一个未言明的优势是，一旦为数据分析学会它，如果愿意，人们就可以进而进入编程和开发领域，而
    R 则似乎陷入了死胡同，无法超越数据分析。R 似乎仍停留在解决统计学家问题的阶段，而 ''by the statisticians'' 的做法导致其落后，而
    Python 能够承担各种问题。然而，必须记住，越来越多的人在使用这两种语言的组合，并且 Python 提供了 RPy2，这可以让用户同时拥有 R 的主要功能以及
