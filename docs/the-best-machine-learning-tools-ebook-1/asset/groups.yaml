    ## 1. 处理数据的工具


    说法“你就是你的工具一样好”对各行各业的人都适用，对于从事数据科学领域的人来说更是如此。随着各种类型的数据出现，这些数据可通过格式、敏感性或庞大规模来区分，需要专门的工具来处理它们。多年来，数据科学初创阶段的大量数据主要由调查数据构成，后来则是银行和其他金融数据。为了应对这类高度敏感且数量不多的
    数据，工具被创建以满足需求。这些解决数据需求的工具要么由研究型机构创建，要么由银行和金融机构创建。然而，随着数据生成领域的扩大以及对数据分析的需求增加，新的工具被创建以应对新的数据驱动格局。


    > 你就是你的工具一样好。


    迄今为止，除各种基于电子表格的工具（如 IBM 的 Lotus 1-2-3 和 Microsoft 的 Excel）外，数据分析或数据科学领域使用最广泛的工具是
    SQL、SPSS、SAS、MATLAB、R 和 Python。在当今时代，有 3 种工具需要被评估和审视，它们也是使用最广泛的工具之一，即 SAS、R 和
    Python。随着数据领域的不断变化，找到最好的工具变得至关重要，或者更准确地说，找到应该在何处、何时使用何种工具以及对谁来说是值得的变得极其重要。尽管如此，我们仍可以尝试弄清楚，总体而言，当然截至目前，谁赢得了数据科学工具的伟大较量。


    > 应该在何处、何时使用何种工具，以及对谁来说是值得的。


    ![](img/47becc4dcd588ed7b6c23dabbec5edf7_1_0.png)


    ## 2. 第一轮：专有统计软件 VS 开源免费程序


    ![](img/47becc4dcd588ed7b6c23dabbec5edf7_2_0.png)


    可以用来处理各种形式数据的各种工具无非就是软件。这些软件在处理和处理数据的方式上各不相同，尤其是在用户操作它们所需掌握的语言方面。然而，从组织采用任何工具的角度来看，它们之间最重要、最基本的区别在于该工具是开源还是闭源。闭源软件是专有软件，其共同特点是使用不免费，并且通过保留知识产权——主要是源代码和版权——对软件内部运作进行严格控制。最初，具有数据处理能力的此类软件被各机构和组织大量依赖。其中包括著名的
    Matlab、SPSS、Stata 和 SAS。


    另一方面，我们有开源软件，除了其他特点外，它们是免费的，最重要的是可以被修改（即源代码不由创建者保留）并且可以被共享（因为用户几乎没有版权限制），这反过来又促进了协作、社区形成以及参与创建软件的各种版本，通常会增强软件的功能。这种特定软件使用的民主化导致其在各个领域和社区中得到快速而广泛的采用。


    ![](img/47becc4dcd588ed7b6c23dabbec5edf7_2_1.png)


    > R 和 Python 是开源的，可免费下载


    在 SAS、R 和 Python 之间的较量中，第一个牺牲品是 SAS，其原因在于它在很大程度上被一个团体独家控制。长时间以来，SAS 一直是数据科学项目尤其是企业分析领域的行业标准工具。随着
    R 的出现，一切开始发生变化。第一次转变发生在公司将 R 部署为标准数据科学工具包取代 SAS 时。要理解为什么会发生这种情况，我们首先需要了解 SAS 和
    R 之间的根本区别，即 R 和 Python 等软件是开源的、可免费下载、供所有人使用的，而 SAS、MATLAB、SPSS 等软件则是昂贵的商业套件。这种根本差异体现在这些软件的各个方面，我们需要逐一了解它们。


    ### 2.1. 背景


    SAS 代表 Statistical Analysis System（统计分析系统）。该软件的设计充分考虑了行业需求，以便能够处理大型数据集。它的目标始终是吸引需要数据分析的大型、数十亿美元的跨国公司。显然，最初的用户中包括
    BFSI（银行、金融服务和保险）公司，后来还有从事人力资本管理的公司。


    这导致了各种垂直产品的推出，例如 SAS Financial Management（原 CFO Vision）和 SAS Human Capital Management（原
    HR Vision）。不仅是这些公司，许多政府机构也开始使用 SAS，因为它具有高度的可靠性、准确性和科学支持。这导致了 FDA（美国食品药品监督管理局（负责食品和其他健康相关产品控制和监督的联邦机构））等行政部门通过在
    SAS/PH-Clinical 上标准化来开始审查新药申请，而 SAS/PH-Clinical 是面向制药用户的 SAS 组件。

    另一方面，R 和 Python 是免费且开源的编程语言。基于它们的任何统计软件都没有任何公司的支持，这使得许多机构对其采用感到不安。此外，由于这些软件是开源的，它们在很大程度上依赖于社区或第三方创建的包来解决专门的领域相关任务（参考上述示例：例如财务管理、人力资本管理或制药）。因此，其运作方式并未标准化，也未经过任何负责机构的审查，这进一步导致了在敏感领域工作的用户对其产生抵触情绪。


    > 该软件的设计充分考虑了行业需求，以便能够处理大型数据集。


    ![](img/47becc4dcd588ed7b6c23dabbec5edf7_3_0.png)


    ### 2.2. 成本


    事情开始发生变化，尤其是在数据分析需求和基于数据科学创建产品的需求开始延伸到并非本质上是处理大量或高度敏感数据的数十亿美元公司所在的领域时。现在，随着自动化和硬件能力的提升，数据“到处”都在产生，这导致了各个领域对数据分析的巨大需求，以至于数据分析任务被积极外包给中小型公司，对于这些公司而言，获取工具的成本至关重要。


    > 随着自动化和硬件能力的提升，数据“到处”都在产生，这导致了各个领域对数据分析的巨大需求


    SAS 受到的最主要也是最大的冲击正是因为这个原因——成本。SAS 曾是且仍然是昂贵的软件。R 完全免费，而 SAS 则收取订阅费，通过订阅费可以使用软件，但仅限于有限的时间。除此之外，还有技术支持的成本，以及存在提供不同功能的版本，提供更多或特定功能的版本成本显著更高的事实。


    这与 R 形成鲜明对比，R 是免费的，现在已有大量包可执行某些非常特殊、行业特定的任务。这些包的工作方式在缓慢而逐渐地得到研究论文的支持，因为 R 能够渗透到研究机构，这为其工作方式及其部署的各种包赋予了权威性。这导致新公司对其采用
    R 作为分析数据并据此创建数据驱动产品的工具的信心增强。


    > SAS 曾是且仍然是昂贵的软件。而 R 完全免费


    '
