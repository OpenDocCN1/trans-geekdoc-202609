    they are easy to understand and re-implement. These notebooks especially Jupyter
    Notebook can work with multiple languages, however, so far the most common combination
    is of Jupyter Notebook with Python as the engine or kernel.


    This leads to all the advantages of Jupyter Notebook being assigned to Python.
