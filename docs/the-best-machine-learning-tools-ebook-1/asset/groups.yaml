    deploying R as their standard data science tool kit in place of SAS. To comprehend
    why this happened, we first need to understand the fundamental difference between
    SAS and R which is that while software such as R and Python are open source, free
    to download, available for use for everyone, software such as SAS, MATLAB, SPSS
    etc. are expensive commercial suites. This fundamental difference manifests itself
    in various aspects of these software and we first need to understand them one
    by one.'
