    ## 8. 第六回合：入门语言


    ### 语法和学习曲线


    无论学习新语言，尤其是当某人对数据领域是新手且需要理解处理数据的各种概念时，语言必须成为催化剂而非阻碍学习过程的因素。


    R 是一种以统计学家为出发点创建的低级语言，常说 R 让统计学家的生活更轻松，而非计算机。它专门为复杂统计计算和数据分析而创建。另一方面，Python 是一种高级语言，具有易于理解、灵活、结构良好、简洁的语法，可提高代码可读性、简洁性、性能和生产力，并致力于让程序员和计算机的生活都更轻松。两者相较时，R
    的若干缺陷往往会暴露出来。


    首先，与 R 相比，Python 更简单易读。它甚至有一套被称为《Python 之禅》的“行为准则”，这是一组决定代码设计方式的原则，使 Python 拥有标准化的代码，极易阅读，而
    R 则缺乏此类规范，几乎是非标准的，给编程过程带来障碍。


    其次，Python 是面向对象的，而 R 不是，它是一种过程式语言，意味着它以非常逐步的方式执行过程，与 Python 相比，用户为完成一项任务需要编写更多代码行。这里节省的时间可用于探索和实验，从而更好地理解数据。所有这些都对应于
    R 的学习曲线比 Python 更陡峭这一事实。没有编程背景，学习 R 的过程可能令人筋疲力尽，而 Python 则具有非常平缓的学习曲线。


    > 所有这些都对应于 R 的学习曲线比 Python 更陡峭这一事实。


    ![](img/47becc4dcd588ed7b6c23dabbec5edf7_19_0.png)


    ## 数据分析和数据科学


    使用数据执行的各种任务导致了两个主要学科，即数据分析和数据科学。两者之间存在许多细微差异和一些主要差异，定义往往因解释这些学科特征的人而异。尽管如此，其中一种定义可以是：数据分析是传统数据分析任务的主要部分，我们获取数据并执行典型任务，以了解数据的各种静态特征。这包括大量描述性分析、评估以及在一定程度上使用推断统计。另一方面，数据科学是一个更广泛的术语，它也涵盖了数据分析的方面，但还包括使用机器学习和深度学习创建复杂模型以及其他数据驱动产品的概念。


    随着时间的推移，专门用于各自领域的语言变得越来越不同。SAS、SPSS 曾是、现在是、将来也将是可轻松用于常规典型数据分析的工具。由于缺乏对机器学习和深度学习现代概念的支持，我们只剩下
    R 和 Python，这正是事情变得有趣和复杂的地方。从技术上讲，R 和 Python 都可以在数据分析和数据科学两个学科中使用。然而，对于数据分析而言，R
    仍可能是正确选择，因为其稳健的统计内部机制以及执行数据处理和可视化等数据分析支柱方面的便捷性。现在，Python 也可以通过日益增多的模块（如 pandas
    和其他可视化模块）执行相同任务，但人们仍可能倾向于使用 R 来执行此类任务。


    > > 从技术上讲，R 和 Python 都可以在数据分析和数据科学两个学科中使用。


    当进入数据科学领域时，事情变得有趣，因为再次从技术上讲，两者都可以执行各种机器学习任务，但就选项范围和实施便捷性而言，R 与 Python 之间的差异变得明显，Python
    领先。几乎所有能在 R 中创建的机器学习模型都能在 Python 中创建，反之亦然，但 R 的复杂性和缺乏连贯性使得人们选择 Python 而非 R，而这些原因在处理深度学习模型时更为突出，因为
    R 无法与 TensorFlow 等深度学习模块在 Python 中工作的精妙程度相匹敌。


    Python 在数据科学中的使用变得越来越普遍，如果两种语言继续以当前速度发展，那么在不久的将来就会非常清楚 Python 是未来的语言，因为未来的发展将集中在机器学习、深度学习、增强智能和人工智能领域，而
    Python 在这些领域已超越 R。


    ## 课程


    为了开始职业生涯或提升技能，有许多数据科学课程，大体上这些课程要么用 R 教授，要么用 Python 教授，SAS 占比较小。就数据分析课程而言，用 SAS
    教授的课程比例往往会增加。然而，正如前面提到的，就机器学习课程而言，Python 对 R 构成了强有力的竞争，因为机器学习模型可以用 R 和 Python
    创建。Python 在任何主要的人工智能课程中作为首选工具的广泛使用，几乎形成垄断，这使得 Python 的决定性胜利变得明显。人工智能或深度学习，这两个密切相关的概念在很大程度上依赖于
    Python，如果有人计划进入这些领域，Python 可以是学习和入门的工具。


    > > "人工智能或深度学习，这两个密切相关的概念在很大程度上依赖于 Python，如果有人计划进入这些领域，Python 可以是学习和入门的工具。"


