    # Discussion


    In three large medical centers, the electrocardiographic profile of HCM measured
    by AI-ECG displayed no improvement in images of patients who underwent SRT. The
    AI-ECG HCM score significantly improved in a cohort of real-world patients with
    HCM macavamen, reflecting the effect of the drug in the post analysis of a phase
    2 clinical trial.$^{9,10}$ This work highlights the differences between SRT and
    myosin inhibition on the electrocardiographic marker of HCM.


    A strength of our work is that it includes multiple images of AI-ECG to show the
    improvement. It demonstrates the potential value and scalability of an image-based
    AI-ECG for disease monitoring in HCM and other disorders. The ECG image-based
    models for HCM can be used by health systems globally using their underlying data
    and by clinicians who may only have access to ECGs or portable images.


    Using the use of deep learning has been proposed for the detection of HCM,$^{12}$
    the use of AI-tracking for signal-based models has been applied to patients receiving
    macavamen in a phase 2 clinical trial sought evaluating the electrocardiographic
    HCM phenotype on macavamen therapy$^{13,15}$ finding a consistent with our ECG
