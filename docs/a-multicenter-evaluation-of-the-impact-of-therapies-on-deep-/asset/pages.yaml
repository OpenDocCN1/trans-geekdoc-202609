    demographic method. This method used a receiver operating characteristic curve
    of 0.95 (95% confidence interval 0.93 to 0.97), with 92% sensitivity and 88% specificity
    for identifying HCM. The performance of other AI-ECG models that were developed
    for raw data but could detect HCM on images is available for free use here at
    https://www.ynhs.edu/ai-ecg-model/.


    In this study, the AI-ECG model based on images identified 70 patients with HCM
    using voltage calibration of 10 mV/cm, with 12 leads recorded in 4 channels, each
    of 2.5 seconds, representing leads I, II, and III; aVR, aVL, aVF, V1, V2, V3,
    and V4, V5. A full 10-second recording was used and represented as a digital image.
    These images were converted to grayscale and downsampled to 300 pixels, regardless
    of original resolution using Python library.


    For the external study, SCF, CFH, and AES models were applied to digital screenshots
    or smartphone photographs of HCM prints. These images followed a similar format
    as PNG images, each with 6 leads, each of 2 seconds. Each lead was shown, varied
    in the background color (gray, orange, pink, or green), of minimum 12 leads (leads
    I, II, III and V1 to V6). Patient identifiers were either cropped or masked before
    the model performance.


    For each model, the output AI-ECG score or the HCM score of the patient with HCM
    was the AI-ECG HCM score from the electrocardiographic HCM disease phenotype.¹¹
    For each patient, the HCM score recorded before the SRT with the latest available
    ECG was compared with HCM scores in patients with HCM without CABG or SRT at YNHFS.


    In a positive control, we sought to evaluate the longitudinal effect of macromaven
    on the AI-ECG HCM score. On macromaven, the AI-ECG HCM scores of the patients
    before and after initiation of macromaven were compared. We calculated the mean
    score of all ECGs up to 3 years before treatment, representing the baseline, and
    longitudinally tracked the change in the AI-ECG HCM score while the baseline patients
    were variables. Using a linear regression analysis, we analyzed the difference
    between baseline and latest ECG score.


    Continuous variables were reported as number (percentage), continuous variables
    were reported as median (interquartile range [IQR]). The AI-ECG HCM score for
    each patient before and after the interventions were used along with the Wilcoxon
    rank-sum test. To compare the clinical impact of SRT versus other major cardiac
    non-surgical procedures on the AI-ECG score, we ran a linear regression analysis.
    The change in AI-ECG score before and after the intervention for each patient
    was dependent on the type of procedure.


    The statistical significance level was set at p<.05. All statistical analyses
    were executed using Python 3.11.2 and R version 4.2.0.


