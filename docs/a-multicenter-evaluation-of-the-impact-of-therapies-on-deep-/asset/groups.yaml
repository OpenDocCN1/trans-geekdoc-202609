    monitor treatment response. HCM is a genetically determined disease that affects
    1 in 200 people worldwide and is the leading cause of sudden cardiac death. In
    HCM patients, mavacamanten is the first cardiac myosin inhibitor to show efficacy
    in reducing ventricular hypertrophy and improving function. Before the emergence
    of mavacamanten, septal reduction therapy (SRT), which includes alcohol septal
