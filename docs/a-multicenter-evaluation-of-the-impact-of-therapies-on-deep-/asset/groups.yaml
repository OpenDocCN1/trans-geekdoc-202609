    Sangha 先生和 D Khera 是美国临时专利申请第 63/346,610 的作者（使用深度学习从心电图图像检测隐性心血管疾病的方法和格式）。Khera
    博士获得了美国国立健康研究院 (NIH) 和美国血液基金会（资助号为 R01AI202859, R01HL176858, 和 K23H135375）以及杜克慈善基金会（资助号
    20220065）的支持。他受到了 Blavatnik 基金会的支持。Sangha 先生是美国健康研究院的研究员。Khera 先生是美国临时专利申请 63/346,610
    的作者。


