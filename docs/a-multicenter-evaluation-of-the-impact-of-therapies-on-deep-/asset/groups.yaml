    人工智能增强的心电图（AI-ECG）可以识别12 导联心电图上的肥厚心肌病（HCM），并为监测治疗反应提供了一种新方法。无论是手术或经皮隔膜减少术（SRT）还是
    HCM 治疗，马马替定都提供了一种替代方案。我们旨在评估 AI-ECG 作为评估 SRT 和 HCM 生物学反应策略的实用性，涵盖了三个中心：耶鲁港健康系统（YHHS）、克利夫兰医学基金会（CCF）和大西洋健康系统（AHS），针对接受马马替定的患者，在
    SRT 后 70 天、YHHS 后 100 天以及 AHS 后 145 天的 AI 心电图进行分析。AI-ECG 分数之间没有显著差异（均值 0.55 [四分位距
    0.24 至 0.77] 对 SRT [均值 0.59 至 0.70]）。在中位随访期 237 天结束，AI-ECG 分数在 SRT 后未改善（均值从 0.61
    [0.38 至 0.79] 变为 0.69 [0.52 至 0.93]），在使用马马替定后也没有改善（均值 0.41 [0.22 至 0.77]，根据 Wilcoxon
    秩检验，从 0.28 显著下降至 0.11 和 0.08 [0.01 至 0.50]）。结论是，我们观察到 SRT 有提高 AI-ECG 分数的潜力，而马马替定则相反。我们的方法方法表明，使用心电图技术在
    HCM 药物治疗期间对病理生理学进行现场监测具有益处。


    人工智能增强的心电图（AI-ECG）解读可以识别12 导联心电图上的肥厚心肌病（HCM），代表了监测治疗反应的新方法。HCM 是一种遗传性疾病，影响全球每
    200 人中的一人，是心性猝死的主要原因。在 HCM 患者中，马马替定是第一个显示出减轻心室肥大和改善功能的心肌球蛋白抑制剂。在马马替定出现之前，隔膜减少术（SRT，包括酒精隔膜消融和心室肌切术）是……患者的关键治疗方法。


    研究部分获得美国国家健康研究院（马里兰州马里兰州）的支持，资助号为 R01AG09881, R01HL117658 和 K2HL153775（资助 Khera
    博士），R17HL07952-01（资助 Smith 博士）。研究收集了来自 YHHS（康涅狄格州新哈文耶鲁港健康系统）的数据。部分数据曾在2023 年 AHA科学会议上发表。资助者对研究的设计、执行、准备、评审或提交发表没有参与。


    *通讯作者：rokhera@yale.edu

    ¹Dhingra 和 Sangha 对本研究贡献相同。


    尽管接受药物治疗，阻塞性 HCM (HCM) 仍有症状局限性。YHHS 是康涅狄格州南部的转诊中心，由 9 个大型医疗集团组成，服务超过 270 万患者。CCF
    是美国最大的私人医疗集团，拥有 5 个医院地点，每年服务超过 100 万患者。AHS 是一个拥有 7 家医院的网络，每年服务超过 150 万患者。


    通常，HCM 患者的监测涉及先进的心脏成像，包括心脏磁共振成像和超声心动图，这些可能受到获取和成本的限制。最近，AI-HCM 在追踪疾病的长期变化方面显示出潜力。在
    SRT 的二期临床试验中，其在接受马马替定的患者中显示了疗效。目前基于深度学习的评估方法仅在 2013 年至 2023 年间高度筛选的患者中经过测试。我们纳入了每个中心
    100 名成年人和 145 名接受 SRT 的患者，并由各中心医生（MD 和 MM）进行识别。患者 SRT 前后的心电图使用视觉检查进行分析，并利用深度学习策略来评估
    SRT。为此，我们开发了一个从 12 导联心电图中检测 HCM 的模型，并评估了来自三个不同机构接受 SRT 的患者的心电图。


    对于接受 SRT 的患者，我们识别了 SRT 前最后的心电图和 HCM 后最新的心电图。我们还确定了一个相应的对照组，包括接受过冠状动脉旁路（CABG）和手术主动瓣置换术（SAVR）但没有
    HCM 的患者。耶鲁机构审查委员会批准了该研究并等待知情同意。在耶鲁港健康系统（YHHS）选择退出研究的患者未被纳入。


    在此组中，我们纳入了手术前记录的心电图和手术后最新的心电图。此外，YHHS 识别了在 3 个地理不同的研究地点接受 SRT 的患者的所有心电图：(1) 康涅狄格州新哈文
    YHHS；(2) 俄亥俄州克利夫兰克利夫兰医学基金会（CCF）；(3) 新泽西州莫里斯特敦大西洋健康系统（AHS）。该研究代表了此前开发的在心电图上检测 HCM
    的 AI 模型的部署。简而言之，该模型是在 YHHS 使用心脏共振确认 HCM 的未接受马马替定或接受 SRT 的患者的心电图开发的。


