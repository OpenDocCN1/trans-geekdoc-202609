    ![](img/f036dfb5fabdd06b9a8d4c47129c5257_3_0.png)


    图 2 隔膜缩小术后的 AI-ECG HCM 评分。显示隔膜缩小术前后最接近的心声图中人工智能辅助的肥厚性心肌评分（AI-ECG HCM 评分）的箱线和须线。


    表 2

    隔膜缩小术和马伐替米（mavacamen）治疗前后心声图中人工智能辅助的肥厚性心肌评分


    | 干预措施 | 医疗系统 | 干预前 AI-ECG HCM 评分，中位数 (IQR) | 干预后 AI-ECG HCM 评分，中位数 (IQR) | Wilcoxon
    秩检验 p 值 |

    |---|---|---|---|---|

    | 隔膜缩小治疗法 | YNHMS | 0.55 (0.24–0.77) | 0.59 (0.40–0.75) | 0.428 |

    | | CCF | 0.61 (0.32–0.79) | 0.69 (0.52–0.79) | 0.003 |

    | | AHS | 0.52 (0.35–0.69) | 0.41 (0.46–0.72) | -0.001 |

    | 马伐替米 | | | 0.28 (0.11–0.50) | -0.001 |


    *AHS: 大西洋健康系统；CCF: 克利夫兰医学中心基金会；YNHMS: 耶鲁新海港健康系统


    调整线性回归模型：$\beta = 0.01$ [0.04 至 0.06]。开始使用马伐替米前的线 AI-ECG HCM 评分（马伐替米前 3 个月内记录的所有心声的平均值）为
    0.46 [IQR 0.21 至 0.72]。马伐替米前最后一周的 AI-ECG HCM 评分中位数为 0.52 (IQR 0.27–0.77)，在 23
    天的随访期（IQR 140 至 330）内显著下降了 0.28 (IQR 0.01 至 0.05) (p=0.001)；表 2。


    SRT 和心脏特异性肌球抑制的作用可能反映了改变 HCM 应力变的不同机制$^{17,18}$。虽然隔膜缩小提供了梗阻性治疗，但它与马伐替米共同作用，因此在不改变病变心肌细胞病理的情况下消除了阻塞$^{16}$
    对于已知心肌重构和相关能量变化的仅接受马伐替米治疗患者，其 AI-ECG 评分显著下降$^{6}$。马伐替米治疗的 HCM 评分与隔膜缩小的谱也一致。


    在 18 名 AI-ECG HCM 评分低于基线评分的患者中，基线和基线 ECG 评分的差异平均值为 -0.09 (IQR 0.01 至 0.05)，或等于平均值，马伐替米
    AI-ECG HCM 评分的变化平均值为 -0.09 (IQR 0.23 至 0.03)；基于预处理的这两组之间变化之间的差异没有统计学意义（$P_{value}$
    = 0.117）$^{19}$


    # 讨论


    在三个大型医疗中心，通过 AI-ECG 测量的 HCM 心电图谱显示，接受 SRT 的患者图像没有改善。在接受马伐替米治疗的 HCM 真实世界患者中，AI-ECG
    HCM 评分显著改善，反映了该药物在 2 期临床试验后期分析中的效果$^{9,10}$。这项工作强调了 SRT 和肌球蛋白抑制在 HCM 心电图标记物方面的差异。


    我们工作的一个优势是包含了多幅 AI-ECG 图像以显示改善。它证明了基于图像的 AI-ECG 在 HCM 及其他疾病监测中的潜在价值和可扩展性。全球医疗系统可以使用其基础数据，而可能只能访问
    ECG 或便携式图像的临床医生可以使用 HCM 的 ECG 图像模型。


    已提出使用深度学习用于检测 HCM$^{12}$，在旨在评估马伐替米治疗下心电图 HCM 表型的 2 期临床试验中，已应用于接受马伐替米的患者信号追踪 AI
    模型$^{13,15}$，发现与我们在 YNHMS 真实世界患者队列的 ECG 图像评估结果一致。背景是


    ![](img/f036dfb5fabdd06b9a8d4c47129c5257_4_0.png)


    马伐替米治疗中的 HCM 评分，我们没有直接将这些变化与临床和症状进行比较。尽管如此，鉴于我们在 5 项临床试验中观察到的结果一致性，ECG-HCM 评分的变化可能反映了左心室流出道道梯度的变化。HCM
    患者的 AI 表型可能会随着疾病进展或治疗反应而发生纵向变化。然而，我们包含了疾病各个阶段（包括初始） SRT 程序前的 ECG 记录。在 AI 表型后可能会出现急性炎症或水肿。然而，我们使用了每个受试者最新的
    ECG 数据，SRT 到 SRT-ECG 评分之间间隔 50 天，以确保我们使用的 AI-HCM 评分准确。尽管如此，AI-HCM 评分的变化与其他非 SRT
    心脏事件（CABC）和 SAV 后的变化没有区别。首先，我们的研究没有评估酒精隔膜消融术后左心室流出道阻塞当前近期节律的长期影响。其次，可能需要更大规模的酒精隔膜消融后
    AI-HCM 评分研究来调查这些问题。


    我们的研究证明了 HCM 心肌效应和 ECG 图像心脏抑制检测之间可衡量的差异。我们的方法为医疗治疗后 HCM 生理改善的监测提供了即时性。


