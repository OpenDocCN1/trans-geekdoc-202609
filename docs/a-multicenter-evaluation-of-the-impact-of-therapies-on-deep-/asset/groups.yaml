    Received 24 January 2024

    Revised 16 October 2024

    Accepted 17 November 2024


    Artificial intelligence—enhanced electrocardiography (AI-ECG) can identify hypertrophic
    cardiomyopathy (HCM) on 12lead ECGs and offers a novel way to monitor treatment
    response. Whether the surgical or cutaneous reduction of the septum (SRT) or HCM
    therapies, mavacamanten offers an alternative. We aimed to assess the utility
    of AI-ECG as a strategy to evaluate biologic responses to SRT and HCM across three
    sites: Yale Haven Health System (YHHS), Cleveland Clinic Foundation (CCF), and
    Atlantic Health System (AHS) for AI-electrocardiography images from patients with
    mavacamanten at 70 days after SRT, 100 days at YHHS, and 145 days at AHS. There
    was no significant difference in AI-ECG scores (mean 0.55 [interquartile range
    0.24 to 0.77] vs SRT [mean 0.59 to 0.70]). The AI-ECG score did not improve after
    SRT (mean 0.61 [0.38 to 0.79] to 0.69 [0.52 to 0.93]) or with mavacamanten (mean
    0.41 [0.22 to 0.77], which significantly decreased from 0.28 to 0.11 and 0.08
    [0.01 to 0.50] by the Wilcoxon-rank test) at the end of a median follow-up period
    of 237 days. In conclusion, we observed a potential for improved AI-ECG scores
    with SRT, in contrast to decrease with mavacamanten. Our approach suggests the
    benefit of point-of-care monitoring of pathophysiology during medical therapy
    in HCM using ECG technologies.


    Artificial intelligence—enhanced electrocardiography (AI-ECG) interpretation identify
