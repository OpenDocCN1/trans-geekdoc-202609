    振幅是参数化最重要的量，但仅凭其尺度是不够的。在特定水平上的波数和相速对于描述高层大气中的动量沉积是必要的。这些参数可以通过重力波线性理论获得，其中风波动的每个分量都得到了成功估计。此外，风波动容易与真值进行比较。


    分析区域是一个矩形区域（~1,000 km × 1,000 km），如图 1m 所示，包含了日高山脉。将 DSJR-55 数据被裁剪成 128 × 128
    的均匀网格以适应其网格系统，为了更好地促进深度学习过程，使用双三次插值法将 JRA-55 数据转换为相同的网格。


    ## 2.2. 深度卷积神经网络


    使用上述数据，我们的模型设计用于学习对流层（300, 700 和 850 hPa）中物理量到低平流层（100 hPa）中波动的每个分量（$u''$、$v''$
    和 $w''$）的转换。独立地处理每个分量可能会破坏重力波具有的初始化，只需要最小化估计误差，这使得训练更容易。此外，为了转换输入数据，我们训练了一个最初设计图像分割的
    U-Net 卷积网络 (Ronneberger et al., 2015)，利用收缩路径捕捉每幅图像的上下文，并如图 2 所示的对称扩张路径来学习输入数据与输出数据之间的关系。收缩路径由卷积操作组成，使用
    3 x 3 滤波器（''Conv 3 x 3''，图 2 中的蓝色箭头）和 2 x 2 池化（''Pool 2 x 2''，图 2 中的红色箭头）来捕捉局部特征（特征图）。扩张路径由使用卷积滤波器的反卷积操作和借助上采样的采样操作组成，以恢复特征图（''Upconv
    2 x 2''，图 2 中的绿色箭头）。上下文信息通过跳跃连接（skip-connections）与编码器侧的相应特征图合并（''Copy 1''，图 2
    中的黄色箭头）。每个网格的输出值使用最终滤波器（''Conv 1''，图 2 中的青色箭头）计算。参数设置（如层数以及滤波器大小）与 Matsuka 等人
    (2019) 报告的相同。


    通过监督学习，我们学习了一个用于测量模型性能的训练集和验证集。训练和验证使用了 1997-2025 年期间29 年的 JRA-55 数据（时间间隔 6 hr；总时间
    42,364 hr），测试则使用了 2008-2012 年期间的5 年数据（7,308 天）。在训练和验证阶段，测量了 U-Net 输出与真值（前述的正确输出数据）之间的误差，并使用这些训练数据反复优化模型，直到其在验证数据上的预测误差收敛到特定阈值。误差函数使用表示两者相似性的
    Tanaka 系数计算：


    $$y = \frac{\sum x_i y_i}{\sum x_i^2 + \sum y_i^2}$$


    其中第 $i$ 个网格的 $u''$、$v''$ 和 $w''$ 分别是真值和输出数据。Tanaka 系数适用于正值，范围从 0 到 1。然而，它也可以扩展到负值，除了估计值和真值其中一个为负外没有任何限制。在训练和验证阶段之后，将测试数据输入
    U-Net 进行评估阶段。


    深度学习的源代码使用 Python 3.6 和 keras (TensorFlow 2.1) 实现，运行在带有四个 Tesla V100 图形处理器单元 (GPUs)
    的 NVIDIA 工作站上。29 年数据的单轮训练持续了 89 秒，$u''$、$v''$ 和 $w''$ 误差收敛所需的迭代次数分别为 33、46 和 93
    次，对于测试数据的误差分别为 0.764、0.835 和 0.696。对于使用 5 年测试数据进行估计，平均大约需要 16.6 ms。这种计算成本对于开发新的重力波参数化来说是合理的，未来的研究将把所提方法直接应用于大气模型或重力波参数化。


