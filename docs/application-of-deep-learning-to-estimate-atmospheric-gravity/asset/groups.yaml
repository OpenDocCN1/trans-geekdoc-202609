    我们还评估了重力波动量通量的水平波数谱。动量通量谱通过 Re[U*W*(k)] 和 Re[V*W*(k)] 计算，其中 k 是水平波数；U, V 和 W(k)
    是 u'', v'' 和 w'' 的傅里叶分量；星号 (*) 表示它们的复共轭（例如，Sato 等人，2017）。特征水平波数被估计为谱密度最大的波数，这也是重力波的关键参数。在纬向方向上，两个估计的特征波数
    Re[U*(k)] 为 m⁻¹，Re[V*(k)] 为 5.0 × 10⁻⁵ rad m⁻¹，Re[W*(k)] 为 5.0 × 10⁻⁵ rad m⁻¹。不同日期的结果在支持信息中的图
    S1 和 S2 中。然而，也识别了主要的动量通量。


    最后，我们对目标区域的每月动量通量进行了估计。图 4–6 描述了最大动量通量幅 |u''|、|v''| 和 |w''| 以及真值和估计值的最大 |J| 分布。这三个月份显示，估计值在冬季较大，在夏季较小。这归因于急流的季节性运动，这在这些期间更为频繁，这意味着从云底到地面的强度大得多，从而触发了重力波。这种季节性变化在有限的年内被观察到。4月份重力波活动较高。12月份当动量通量最强时，|u''|
    和 |v''| 的估计值分别为 0.23 和 0.14 m/s，而它们的值低于真值。这可能归因于上方中估计的 u'', v'' 和 w'' 相位的不匹配。此外，动量通量幅
    |u''|、|v''|、|w''|、最大 |J| 和最大 |J| 的估计误差 (均方误差 (RMSEs)) 分别在图 4–6 中所示。冬季较大，夏季较小。在12月份观察到最大动量通量的
    RMSE：动量通量幅 |u''|、|v''|、|w''|、最大 |J| 和最大 |J| 的 RMSE 约为 0.32、0.30 和 0.70 m/s。图 4–g
    显示每月动量通量的纬向和子向波数的真值和估计值。真值在全年变化不大。估计值为 -8 × 10⁻¹ 到 -1 × 10⁻¹，与冬季的真值一致良好。图 4–k
    显示每月特征水平波数的误差 (RMSE)。纬向波数的平均误差约为 1.1 × 10⁻⁵，约为真值的 10%；而夏季平均误差约为 0.3 × 10⁻⁵ 到 5.0
    × 10⁻⁵，约为真值的 30%。


    4. 结论


    本研究证明了深度卷积神经网络 (U-Net) 估计重力波参数的性能。大气层 850、700 和 300 hPa 的低分辨率数据以及高分辨率地形数据正确识别
    (u'', v'', w'')。波数等参数可以使用 U-Net 进行适当估计，特别是在冬季重力波活跃时。通常，学习技术的结果取决于神经网络层的选择、训练数据的输入以及物理量的定义，因此需要对方法进行优化。


