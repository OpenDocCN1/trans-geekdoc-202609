    ## 深度学习在再分析数据集大气重力波参数估计中的应用


    ![](img/8f155e08600b638cf6d9e0e3e4394c1e_0_0.png)


    D. Matsuoka¹,²,³, S. Watanabe⁴, K. Sato⁵, S. Kawazoe⁶, W. Yu⁷, and S. Easterbrook⁸³


    ¹海洋研究机构 (JAMSTEC)，日本横浜²日本科学技术厅 (JAST)，³多伦多大学计算机科学系，加拿大安大略省⁴东京大学地球与行星科学科，日本东京⁵北海道大学地球行星科学科，日本札幌


    **要点：**


    - 一种利用29年再分析数据估计大气重力波的深度学习方法。

    - 从空间分辨率为 60 km 的低分辨率数据中检测到了 100 hPa 处的重力波动量通量。

    - 使用所提方法，可以很好地估计目标区域通量的结构分布。


    **支撑信息：**


    - 支撑信息 S


    **联系人：**

    D. Matsuoka,

    dmatsuoka@jamstec.ac.jp


    **摘要** 重力波在驱动和维持全球环流中起着至关的作用。为了理解它们在大气中的贡献，准确复制其分布非常重要。本文提出了一种用于估计重力波动量通量的深度学习方法，并利用日本北海道地区的低分辨率向风、温度和比湿数据对100
    hPa处的处的性能进行了测试。该卷积神经网络在29年的再分析数据（JRA-55和ERA-5）上进行训练，并在最后年的数据上进行了评估。结果表明，能够以合理的计算估计重力波的细尺度分布。特别是在重力波较强的地方，最大通量的均方根误差（RMSE）显著优于低分辨率方法。


    **引用：**

    Matsuoka, D., Watanabe, S., Yu, W., & Easterbrook, S. (2020). 深度学习在估计大气重力波参数中的应用。*Geophysical
    Research Letters*, 47, 10.1029/2020GL089436. https://doi.org/10.1029/2020GL089436


    接收：2020年6月22日

    接受：2020年9月19日

    在线接受：2020年9月21日


    ## 1. 引言


    大气重力波是源自各种来源的小尺度波，包括高山、急锋系统和对流。它们在垂直方向传播动量，并在驱动和维持大气全球环流中起着重要作用（Fris & Alexander,
    2003）。它们具有巨大的潜在动量沉积。自20世纪80年代以来，研究人员已对重力波进行了广泛的研究，并在理解其理论方面方面了进展（Achiers et al.,
    1995; Chun & Baik, 1998; Erb et al., 2014; Guo et al., 2017; Ploughberg & Zhang,
    2014; Sato, 2014; Sato, 2009; Tsuda, 1992; Wright et al., 2017）。


    重力波的尺度在计算网格上被参数化为若干大气模型的关键，例如亚网格尺度通量、波长和频率（Alexander et al., 2010; Palmer et al.,
    1996）。大多数参数化假设重力波仅垂直传播，但它们也会受到水平地形和条件的影响（Dunkerton, 1984; Sato et al., 2009）。Watanabe等人（2008）使用具有分辨率的大气环流模型展示了重力波的垂直和平水平传播。虽然这种高分辨率方法可以成功模拟重力波的产生、传播和消散，但其计算成本很高，不适用于实际问题，具有合理计算成本对重力波参数化的进一步开发将有利。


    最近，利用深度学习进行图像模式识别引起了各个领域的广泛关注（Krizhevsky et al., 2012）。深度学习利用多个神经网络从大量数据中统计性学习特征，在各种任务中表现出高性能，包括将输入图像转换为另一个图像的图像变换。在大气科学领域，深度学习也被引入对流层和大气波探测（Earth
    et al., 2018）、卫星图像检索（Matsuno et al., 2019）以及波重建（Tao et al., 2016）。Rasp（2018）首次将深度神经网络用于锋面检测。随后，深度学习被用于水汽对流的参数化（O''Gorman
    & Dwyer, 2018）、行星边界层臭氧沉积速率的（Yang et al., 2019）。此外，Gaje等人（2020）提出了深度学习随机参数化，其优势在于基于训练数据集的估计模型运行模型所需的计算成本远低于直接求解子问题。


    本研究的目的是应用深度学习估计地表重力波的关键参数，以促进重力波参数化的发展。为了实现合理的计算成本，我们使用平流层的低分辨率数据作为输入值，学习向低平流层细尺度风通量的转换过程。这种方法对于描述来源通常复杂的非动力重力波特别有效。然而，作为第一步，我们在日本北海道地区测试了相对容易处理的动力重力波。


    ## 2. 数据与方法


    ### 2.1. 数据分析与训练数据准备


    我们的模型学习了粗分辨率大气场与高分辨率风通量之间的关系。输入使用了日本55年再分析数据（JRA-55; Harada et al., 2016; Kobayashi
    et al., 2013），这是一项全球再分析数据；输出（真值）使用了日本气象厅（JMA）的分尺度数据（DSRA-55）。JRA-55和DSRA-55的水平分辨率分别为60
    km和5 km。由于DSRA-55是基于与JRA业务模型初始条件相关的运行信息，真值可能并不完美。


    作为输入的低分辨率（60 km）物理量是东风（u）、南风（v）和垂直风（w），气温（T）、比湿（q）以及在100、300、700和850 hPa高度处的压力（p），这些量用于重力波的产生和传播。如图1所示。由于动力重力波是从山脉辐射的，我们使用了靠近地形的风场（例如高山处的850和700
    hPa）。温度是必要的，因为大气的稳定性是影响重力波结构的因素。在重力波的情况下，相对湿度的凝结非常重要：在重力波的情况下，需要包含对流层的高度（例如300和700
    hPa）。因此，对于未来的研究，需要在水平波长覆盖u、v、T和q来覆盖深度学习系统中的多种重力波源，本研究仅关注动力重力波。DSRA-55的高分辨率（5 km）地形也被用作输入；总通道数为15。


    用于重建输入数据的细尺度真值，三维波动（u'', v'', 和 w''）是通过原始数据减去重力波（即20个网格单元/100 km平方的空间简单移动平均）得到的。真值的压力层应高于重力波源的压力层。在这里，我们使用100
    hPa（DSRA-55的顶层）作为方法开发中的临时高度。未来的动量通量可能会根据性能更好的参数化而进行更改。


