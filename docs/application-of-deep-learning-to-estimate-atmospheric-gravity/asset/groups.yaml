    # # Application of Deep Learning to Estimate Atmospheric Gravity Wave Parameters
    in Reanalysis Data Sets


    ![](img/8f155e08600b638cf6d9e0e3e4394c1e_0_0.png)


    D. Matsuoka¹,²,³, S. Watanabe⁴, K. Sato⁵, S. Kawazoe⁶, W. Yu⁷, and S. Easterbrook⁸³


    ¹Japan Agency for Marine-Science and Technology (JAMSTEC), Yokohama, Japan ²Japan
    Science and Technology Agency (JAST), ³Department of Computer Science, University
    of Toronto, Ontario, Canada⁴Department of Earth and Planetary Science, University
    of Tokyo, Tokyo, Japan⁵Department of Earth and Planetary Science, Hokkaido University,
    Sapporo, Japan


    **Key Points:**


    +   - A deep learning approach to estimate atmospheric gravity waves using 29-year
    reanalysis data.

    - Gravity wave momentum fluxes at 100 hPa were detected from low resolution data
    with a spatial resolution of 60 km

    - Using the proposed method, structural distribution of flux in the target area
    can be estimated quite well


    **Supporting Information:**


    +   - Supporting Information S


    **Correspondence to:**

    D. Matsuoka,

    dmatsuoka@jamstec.ac.jp


    **Abstract** Gravity waves play an essential role in driving and maintaining global
    circulation. To understand their contribution in the atmosphere, the accurate
    reproduction of their distribution is important. A deep learning approach for
    the estimation of gravity wave momentum fluxes was proposed, and performance at
    100 hPa was tested using data from low resolution and meridional winds, temperature,
    and specificity in Hokkaido region (Japan). This convolutional neural network
    was trained on 29-year reanalysis data (JRA-55 and ERA-5) and the final 5-year
    data were evaluated. The results showed that the fine-scale distribution of gravity
    waves could be estimated at a reasonable computational cost. In particular, where
    gravity waves are stronger, the mean root square error (RMSE) of the maximum flux
    was significantly better than that of the low resolution method.


    **Citation:**

    Matsuoka, D., Watanabe, S., Yu, W., & Easterbrook, S. (2020). Application of deep
    learning to estimate atmospheric gravity wave parameters. *Geophysical Research
    Letters*, 47, 10.1029/2020GL089436. https://doi.org/10.1029/2020GL089436


    Received 22 JUN 2020

    Accepted 19 SEP 2020

    Accepted article online 21 SEP 2020


    # # 1. Introduction


    Atmospheric gravity waves are small-scale waves that originate from various sources,
    including high mountains, jet-front systems, and convection. They propagate momentum
    vertically and play an important role in driving and maintaining the global circulation
    in the atmosphere (Fris & Alexander, 2003). They possess a potentially significant
    amount of momentum deposit. Since the 1980s, a wide range of studies to gravity
    waves have been detected, and theoretical advancements in their understanding
    have been achieved (Achiers et al., 1995; Chun & Baik, 1998; Erb et al., 2014;
    Guo et al., 2017; Ploughberg & Zhang, 2014; Sato, 2014; Sato, 2009; Tsuda, 1992;
    Wright et al., 2017).


    The scales of gravity waves have been parameterized on the computational grid
    as the key in several atmospheric models, such as sub-grid scale waves as momentum
    flux, wavelength, and frequencies (Alexander et al., 2010; Palmer et al., 1996).
    Most parameterizations assume that gravity waves only propagate vertically, but
    they are also affected by horizontal topography and conditions (Dunkerton, 1984;
    Sato et al., 2009). Watanabe et al. (2008) used an atmospheric circulation model
    with a resolution to show the vertical and horizontal propagation of gravity waves
    with a fine resolution. Although such a high-resolution method can successfully
    simulate the generation, propagation, and dissipation of gravity waves, it is
    computationally expensive and unsuitable for practical problems.


