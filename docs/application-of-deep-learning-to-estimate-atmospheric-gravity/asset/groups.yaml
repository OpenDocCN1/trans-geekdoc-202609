    # Geophysical Research Letters


    with reasonable computational costs would be beneficial for further development
    of gravity wave parameterization.


    Recently, image pattern recognition using deep learning has attracted a lot of
    attention in various fields (Krizhevsky et al., 2012). Deep learning, which uses
    multiple neural networks to statistically learn features from large amounts of
    data, has demonstrated high performance in various tasks, including image transformation,
    where an input image is transformed into another. In the field of atmospheric
    science, deep learning has also been introduced in troposphere and atmospheric
    wave detection (Earth et al., 2018), satellite image retrieval (Matsuno et al.,
    2019), and wave reconstruction (Tao et al., 2016). Rasp (2018) first applied a
    deep neural network to capture front detection. Subsequently, deep learning has
    been used for parameterizing moisture convection (O''Gorman & Dwyer, 2018), ozone
    deposition velocity at the planetary boundary layer (Yang et al., 2019). Furthermore,
    Gaje et al. (2020) proposed deep-learning-stochastic parameterization which has
    the advantage that an estimation model based on the training data set, the computational
    cost associated with running the model is much lower than directly solving the
    sub-problem.


    The aim of this study was to apply the deep learning to estimate the key parameters
    for surface gravity waves that propagate for the further development of gravity
    wave parameterizations. In order to achieve a reasonable computational cost, we
    used lower-resolution data in the stratosphere as the input values to learn the
    conversion process to fine-scale wind fluxes in the lower stratosphere. This method
    is particularly effective for describing non-organic gravity waves whose sources
    are generally complex. However, as the first step, we tested organic gravity waves
    which are relatively easy to handle, over the Hokkaido region of Japan.


    # ## 2. Data and Methods


    # ### 2.1. Data Analysis and Training Data Preparation


    Our model learned the relationship between coarse-resolution atmospheric fields
    and high-resolution wind fluxes. As input, the Japanese 55-year Reanalysis (JRA-55;
    Harada et al., 2016; Kobayashi et al., 2013), which is a global reanalysis data,
    was used, and for output (ground truth), the resolution scaling data (DSRA-55)
    from the Japan Meteorological Agency (JMA) was used. JRA-55 and DSRA-55 have horizontal
    resolutions of 60 and 5 km, respectively. The ground truth may not be perfect
    because DSRA-55 is based on information from forty-six JRA-55 runs which are related
    with initial conditions with the JRA''s operational model.


    The lower-resolution (60 km) physical quantities used as input were the zonal
    (u), meridional (v), and vertical (w) winds, air temperature (T), specific humidity
    (q), and pressure (p) at levels of 100, 300, 700, and 850 hPa which were used
    for the generation and propagation of gravity waves. These are shown in Figures
    1. Since organic gravity waves are radiated from the mountains, we used winds
    near the terrain (i.e., 850 and 700 hPa for high mountains). Temperature is necessary
    because the static stability of the atmosphere is a factor influencing the structure
    of gravity waves. In the case of gravity waves, the condensation of relative humidity
    is important: in the case of gravity waves, the levels in the troposphere (i.e.,
    300 and 700 hPa) needs to be included. Thus, for future studies, u, v, T, and
    q at horizontal wavelengths are required to cover the multiple sources of gravity
    waves in the deep learning system, only organic gravity waves are the focus of
    this study. The fine-resolution (5 km) topography of DSRA-55 was also used as
    input; the total number of channels was 15.


    The fine-scale ground truth used to reconstruct the input data, 3D fluctuations
    (u'', v'', and w'') were obtained as the residuals of the original data from the
    gravity waves which are spatially simple moving averages of 20 grid squares (1,00
    km-squares). The pressure level of the ground truth should be higher than that
    of the source of gravity waves. Here, we used 100 hPa, which is the top level
    of DSRA-55, as a tentative level in method development. The momentum flux at may
    be changed for a parameterization with better performance in the future.


    MATSUOKA ET AL.


