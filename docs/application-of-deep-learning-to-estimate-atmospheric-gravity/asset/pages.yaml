    the momentum flux associated with strong gravity waves, especially in winter.


    # 4. Conclusions


    This study demonstrated the performance of the deep convolutional neural network
    (U-Net) to estimate the parameters of organic gravity waves. Low-resolution data
    (u, v, t and n) at levels of 850, 700 and 300 hPa in the troposphere as well as
    high-resolution topography data were correctly identified by 3D wave functions
    (u'', v'', w'') in the lower atmosphere. Wave parameters such as wavenumber and
    well as amplitude of the momentum flux, could be properly estimated using the
    U-Nets. The estimates are particularly suitable in winter when gravity wave activity
    is high.


    Generally, the learning techniques vary greatly in the quality of the results
    that they produce depending on the neural network layer selection, the choice
    of the training data, and the definition of the error function. As in the supporting
    information (Figure 53), the estimation accuracy varies depending on the difference
    in the input data (physical quantity and level). Therefore, it is necessary to
    optimize the'
