    # B. Adaptive Median Filter


    The adaptive median filter is a non-linear filtering technique, often applied
    on images to remove noise and make noise clearer and easier to distinguish. adaptive
    median filter (AMF) changes the noise amplitude used to detect pixels in the neighborhood.
    If noise is detected, they are replaced by median value and otherwise the original
    pixel value is kept. The average of an AMF is the purpose of preserving details
    when smoothing non-pulse noise which is not with traditional median filters.


    # III. METHODS


    We propose a new deep learning framework for automatically detecting of COVID19
    in 2D X-ray images. Our system is also designed to distinguish between COVID19,
    effusion, and normal cases. The network is based on Convolutional Neural Networks
    which receives processed and filtered images (using Adaptive Median Filter and
    Histogram Equalization). We evaluate the performance of the model and it again
    architecture and hyperparameters, until get the best possible score. Fig. 2 illustrates
    the overall work-flow of the proposed CovidNet.


