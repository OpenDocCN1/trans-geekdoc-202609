    **Abstract**—Coronavirus (COVID-19) is an infectious epidemic declared in March
    2020 as Pandemic. Because of its rapid and easy transmission, Coronavirus has
    caused thousands of deaths around the world. New methods for accurate and fast
    COVID-19 detection are crucial. X-ray images are used for the diagnosis of coronavirus.
    However, this requires considerable time. Artificial intelligence can help in
    reducing pressure using deep learning to automatically detect COVID19 in chest
    X-rays. The suggested architecture is based on a deep convolutional neural network.
    It is trained end-to-end on a publicly available dataset. Our model achieved an
    accuracy of 98.62% for binary classification and 97.75% for multi-class classification.


