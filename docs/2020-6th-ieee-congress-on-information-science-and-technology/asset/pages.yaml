    # INTRODUCTION


    Since 2019, coronavirus (also known as COVID19) has been spreading rapidly, causing
    panic all over world. By June, more than 7.5 million people were infected and
    425 thousand of these cases led to death [1]. This infection is transmitted easily
    from person to person over sneezing, coughing or respiratory droplets. The virus
    comes with cough, fever and shortness of breath, and can lead to pneumonia, multi-organ
    failure and death [2]. Considering the fact of the absence vaccine or therapeutic
    treatment for the novel coronavirus, early diagnosis is important. As they contain
    useful information rapid radiological imaging including Chest X-ray (CXXR) and
    computed tomography (CT), play an important role in early detection and treatment
    of the pandemic [3]. However, the fast increase in the number of patients, makes
    it hard for doctors to diagnose the cases in a limited time. In this context,
    artificial intelligence can provide an accurate, fast and low cost for COVID19
    diagnosis. Recently, deep learning is a subset of machine learning in artificial
    intelligence, which works over-convolutional layers (crafted methods), in different
    imaging tasks. It has been used in many problems such as classification and detection.
