    # C. Network Architecture


    CovidNet is a CNN architecture that includes different layers and stages of two
    automata: feature extraction and classification part. As depicted in Fig. 3, the
    proposed CNN has four convolutional layers, with a filter size of 3x3. After each
    convolutional layer, 64 filters are used. Each convolutional ReLU is an activation
    function. To reduce the computational complexity and the spatial size of the output
    features, max-pooling follows the two convolutional layers with a window size
    of 2 and 2 pixels. The pooled output is then flattened and fed to the first fully
    connected layer which has 128 neurons. Dropout is used as a regularization technique
    to avoid overfitting.


