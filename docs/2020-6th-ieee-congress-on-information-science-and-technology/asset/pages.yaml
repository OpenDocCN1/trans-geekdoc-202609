    # B. Experimental Environment


    Our model has been developed using python and keras with tensorflow on an Intel
    (R) core (TM) i7 Gen core. Experiments were conducted using Graphical Processing
    Unit (GPU) NVIDIA GeForce GTX 1050 Ti with 8GB and 4 GB of memory respectively.
    To train the models, we used set of epochs, batch size, and learning rate to 120,
    400, 0.001. We used cross entropy as loss function (binary, categorical) and Adam
    as an optimizer for the cross-entropy function.


    # C. Evaluation Process


    The performance of our trained model was evaluated by calculating accuracy, specificity,
    precision, and F1score. TP is the number of true-positive patterns, FP represents
    the number of false-positive patterns, TN is the number of true-negative patterns
    and FN is the number of false-negative patterns.


    ```

    $Accuracy = \frac{TP + TN}{TP + FP + FN + TN} (1)$$n$$Sensitivity = \frac{TP}{TP
    + FN} (2)$$n$$Specificity = \frac{TN}{TP + FP} (3)$

    ```


    ```

    $Precision = \frac{TP}{TP + FN} (4)$$n$$F1 - score = 2 \times \frac{Precision
    \times Recall}{Precision + Recall} (5)$

    ```


    Sensitivity and specificity give the position of positives and negatives that
    were classified, respectively. We conducted experiments to classify and detect
    COVID19 using chest-ray radiographs in two scenarios: first train the CNN deep
    learning network to classify CXRs into two classes covid19 and normal. In the
    second scenario, the model was trained to distinguish between three classes covid19,
    normal, and effusion.


    # D. Model Performance


    +   1) Binary classification results: The results are illustrated in Table II.
    From this table, we observe that feeding images to the CNN model applying histogram
    equalization (CNN) gets better results for most of the metrics. We note that the
    model has achieved an average accuracy of 98.62% and specificity, precision, and
    F1-score of 98.52%, 97.72%, and 98.65%. Fig. 4, 5, Fig. 6 refer respectively accuracy
    and curve fusion, and ROC for the CNN model considering binary classification
    tasks.

    2) Multi-class classification: The triple classification performance of the two
    models was evaluated and the accuracy, precision, recall metrics were calculated.
    We can clearly see that the model when we applied histogram equalization on the
    images feeding to the convolutional neural network achieved better results than
    the other two models, with an average accuracy of 95.77% in just 940 seconds.
    To better evaluate the efficiency of this model, we plot the accuracy curve in
    Fig. 7. The confusion matrix is also shown in Fig. 8 to give an idea about how
    the COVID19 cases have predicted to much higher probabilities than the nonCOVID
    cases, which is as good as it is for the negative cases.

    3) Comparison with methods: In this subsection, we compare the performance of
    the proposed approach in this work with the set of the methods approach. Table
    IV presents the results of this comparison, where types of images are used to
    detect COVID: CT and CXR images. As we can see, our method shows better binary
    and binary classification. We can explain the importance of choosing the hyper-parameters
    for the problem and also all preprocessing images before feeding them to the network.


    # V. CONCLUSION


    In this study we have developed a deep-learning model to classify CXRs into COVID19,
    normal, or effusion. Our model is entirely automated with an end-to-end architecture
    that does not use any handcrafted method.'
