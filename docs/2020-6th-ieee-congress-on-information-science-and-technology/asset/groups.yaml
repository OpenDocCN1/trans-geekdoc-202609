    # B. Adaptive Median Filter


    The adaptive median filter is a non-linear filtering technique, often applied
    on images to remove noise and make noise clearer and easier to distinguish. adaptive
    median filter (AMF) changes the noise amplitude used to detect pixels in the neighborhood.
    If noise is detected, they are replaced by median value and otherwise the original
    pixel value is kept. The average of an AMF is the purpose of preserving details
    when smoothing non-pulse noise which is not with traditional median filters.


