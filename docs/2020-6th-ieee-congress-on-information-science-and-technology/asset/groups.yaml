    **摘要**——冠状病毒（COVID-19）是2020年3月宣布为大流行的传染性疾病。由于其传播快速且容易，新冠病毒已导致全球数千人死亡。开发准确快速检测
    COVID-19 的新方法至关重要。X光片用于诊断冠状病毒，但这需要大量时间。人工智能可以通过深度学习自动检测胸部 X 光片中的 COVID19，有助于减轻压力。所提出的架构基于深度卷积神经网络，并在公开数据集上进行了端到端训练。我们的模型在二分类中达到了
    98.62% 的准确率，在多分类中达到了 97.75%。


    深度学习正成为 CXR 诊断的明显选择。本文的主要目标是为 COVID19 的自动诊断提供一个高效框架。为此，我们提出了一种基于端到端卷积神经网络（CNN）[4]
    架构的深度学习模型，不使用任何手动特征提取。在我们的方法中，预处理步骤是将图像输入 CNN。即使我们的目标是检测图像中是否存在 COVID19，我们也进行了多分类研究（COVID19
    vs 正常）。图 1 展示了图像示例。在研究中，我们尝试通过低计算成本和较少的参数来提高准确性。本文其余部分的结构如下：第二节介绍文章章节；第三节描述方法；第四节展示结果；最后，第五节对进行总结。


    *索引术*——冠状病毒，covid19，深度，卷积神经网络，胸部 X 光，自适应中值滤波-


    # 引言


    自2019年以来，冠状病毒（也称为 COVID19）迅速蔓，引发了全球恐慌。到6月，已有超过750 万人感染，其中 42.5 万病例导致死亡 [1]。这种感染通过喷嚏、咳嗽或呼吸道飞沫在人与之间很容易传播。病毒会导致咳嗽、发热和呼吸困难，并导致肺炎、多器官功能衰竭和死亡
    [2]。考虑到新型冠状病毒缺乏疫苗或治疗药物，早期诊断至关重要。由于它们包含有用信息，快速放射学成像（包括胸部 X 光片 CXXR 和计算机断层扫描 CT）在疫情的早期检测和治疗中起着重要作用
    [3]。然而，患者数量的快速增加使得医生很难在有限时间内完成诊断。在这种背景下，人工智能可以为 COVID19 诊断提供准确、快速且低成本的方案。近期，深度学习作为人工智能中机器学习的一个集，在不同的成像任务中通过卷积层（手工方法）工作。它已用于分类和检测等许多问题。在这里，深度


