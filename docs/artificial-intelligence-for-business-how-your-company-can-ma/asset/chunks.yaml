  fmt: '

    ### 3. Sources that are publicly available


    There is a lot of data that is available with some open data sources. This includes
    `CIA World`, `Facebook`, `data.gov`, and more. As a company, it is a good idea
    to take advantage of these sources and look for more of the information that you
    need to make smart decisions along the way.


    After you have been able to go through and figure out all of the potential sources
    for your data, there are going to be a few decisions that a company is going to
    have to make to help them to use the data in the most effective manner. Some of
    the things that you need to consider include:


    1. **How to manage and store the information.** While storage was a big issue
    for a lot of companies just a few years ago, there are now a lot of lower-cost
    options that can store your data, no matter how much data you have, if this ends
    up being the strategy that your business wants to go with.

    2. **How much of that data to analyze.** There are some organizations that are
    going to analyze all of the data they use. This is possible thanks to a lot of
    the technology that is out there. But for those who are in a hurry, who want to
    cut out the noise, or can’t handle all of that data for one reason or another,
    and they will decide how much, and what kinds of data they will analyze.

    3. **How you are going to use those insights.** The more knowledge you get to
    work with, the more confidence you can bring to any kind of decision you make
    for the business. It is always good to get a strategy in place after you are holding
    onto a ton of information to help make the business decisions.


    Every business is going to be able to benefit when it comes to using big data
    for their needs. They will be able to put it all together and see how to make
    some of the best business decisions based on the information at hand. The final
    step that companies need to consider when they are trying to make big data work
    for them is research. They should do a bit of research on the different technologies
    that will help them to really utilize their data, and to help with the analysis.
    Some of the things that you can consider for this step include:


    1. Finding storage that can handle the data you have, and is cost-effective for
    the ob.

    2. Processors that are faster.

    3. An affordable and open-sourced big data platform to use.

    4. Cloud computing, as well as some other resources that are flexible and can
    help with arrangements for the allocation.

    5. High throughputs, high connectivity, large grid environments, virtualization,
    `MPP`, clustering, and parallel processing.


    Big data is something that every business should consider using. There is a wealth
    of information out there from customers and many other sources, and it is definitely
    worth it for a company to take a look at this information, and determine how they
    are going to be able to use it for their benefit.

    '
  trans: '


    ### 3. 公开可用的数据来源


    许多开放数据源都提供了大量数据。这包括 `CIA World`、`Facebook`、`data.gov` 等。作为一家公司，利用这些资源，并在过程中寻找更多所需的信息以做出明智决策，是一个非常好的主意。


    在能够能够梳理并确定了所有潜在的数据来源之后，公司将需要做出一些决策，以帮助他们以最有效的方式使用数据。你需要考虑的一些事项包括：


    1. **如何管理和存储信息。** 虽然几年前存储对许多公司来说还是一个大问题，但现在有了许多低成本选项可以存储你的数据，无论你拥有多少数据，只要这最终成为你的业务希望采取的策略。

    2. **分析多少此类数据。** 有些组织将分析他们使用的所有数据。得益于现有的许多技术，这是可以实现的。但对于那些急于、想要过滤掉噪声或由于某种或其他原因无法处理所有数据的人来说，他们将决定分析多少以及分析什么类型的数据。

    3. **你将如何利用这些洞察。** 你拥有的知识越多，在对业务做出任何决策时就越有信心。在掌握了大量有助于做出业务决策的信息后，制定一个相应的策略总是是好的。


    每家企业在利用大数据满足其需求时都能受益。他们将能够将所有信息整合在一起，并根据手头信息查看如何做出最佳的业务决策。公司在尝试让大数据为其服务时，需要考虑的最后一步是研究。他们应该对各种不同的技术进行一些研究，以帮助他们真正利用数据并辅助分析。对于这一步，你可以考虑的一些事项包括：


    1. 寻找能够处理你现有数据且对业务而言具有成本效益的存储方式。

    2. 速度更快的处理器。

    3. 可负担得起的开源大数据平台。

    4. 云计算，以及其他灵活且可以协助分配安排的资源。

    5. 高吞吐量、高连接性、大型网格环境、虚拟化、`MPP`、集群和并行处理。


    大数据是每家企业都应该考虑使用的东西。从客户和其他许多来源中有很多丰富的信息，对于公司来说，查看这些信息并确定如何利用它们来为自己获益绝对是值得的。


    '
