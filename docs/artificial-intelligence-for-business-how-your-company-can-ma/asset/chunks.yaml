- raw: 'Chapter 6: Can Healthcare Benefit with AI? The next place we are going to
    look when it comes to how AI can improve an industry is in the world of healthcare.
    When it comes to our health, especially in matters that are life and death, AI
    can really come in to save the day and provide us with a lot of different methods
    that will make doctors more efficient. While there is still a lot that needs to
    happen before we get to the point of health care that is dependent on AI and systems
    of AI, most notably with the concerns of data privacy and the fears of care that
    is mismanaged due to machine error and no human oversight in there, there is still
    a lot of potential that healthcare providers, tech companies, and governments
    may be willing to test out these tools and solutions and see how they work for
    this industry. With that in mind, we may need to take a look at some of the ways
    that AI is already able to help out the medical world, and some of the places
    where there is a lot of potential for it to improve over time. Some of the most
    common and well-thought-out examples of advances in AI that can happen in the
    world of health care includes: AI-assisted surgery The first area of the health
    care field that we are going to explore when it comes to how we can use AI technology
    is going to be with robotic surgery that is assisted with AI. With a value that
    is estimated to be at $40 billion in healthcare, robots are able to take some
    of the data out there from pre-op medical records and use this to help guide the
    instrument that the surgeon is using during surgery. This actually can help to
    reduce the amount of time the patient stays in the hospital to 21 percent. There
    are a lot of things to enjoy when it comes to surgery that is assisted by robots.
    To start, this kind of surgery is seen to be minimally invasive, so the patient
    will be able to heal faster with a smaller scar. Via AI, the robots are going
    to be able to gather up the data of past operations and can then inform new surgical
    techniques in the process. The results of this are promising and very positive
    right now. In one study, there were 379 orthopedic patients looked at. It was
    found that when they underwent a procedure that was AI-assisted, they had five
    times fewer complications compared to those who just had the surgeon do the operation
    on their own. In another study, a robot was chosen to do eye surgery for the first
    time, and the most advanced surgical robot, the Da Vinci, allows the doctor to
    go through procedures that are pretty complex with greater control compared to
    some of the approaches that are used on a regular basis. Another example of how
    these AI-assisted surgery robots can help is in the case of Heartlander, a miniature
    robot that is able to help out heart surgeons. This little robot is able to enter
    into a smaller incision that the surgeon puts into the chest to perform both mapping
    and some therapy over the hearts surface. This helps to make heart surgery less
    invasive, more efficient and can help the patient to heal and get better in no
    time. Nursing assistants that are virtual The second thing we are going to look
    at when it comes to introducing more AI into the medical field is the idea that
    we are able to use this to have more virtual nursing assistants. From being able
    to interact with the patients who come in to directing the patients to head to
    the care setting that is the most effective for them, it is possible that these
    nursing assistants who are virtual and able to run thanks to AI, will be able
    to save this particular industry $29 billion a year or more!. Since virtual nurses
    can be available all day every day, this makes it easier for them to answer any
    questions, monitor how the patients are doing, and even provide some of the quick
    answers that are needed. These make them more effective than some of the human
    counterparts and can help to cover a bit when the shifts are short on staff. Most
    applications of these virtual nursing assistants are going to make it easier to
    have open and regular communication occur between the health care provider and
    the patient, even between their regular office visits. This alone could help to
    prevent the readmission of the patient to the hospital and cuts down on the number
    of hospital visits overall that are not really necessary. In some cases, such
    as with the Care Angel virtual nurse assistant, it is possible to use the tools
    of AI and your own voice in order to complete a wellness check. Aid in diagnosis
    and clinical judgment AI is also able to come in and help diagnose some of the
    patients that are in the clinic. Admittedly, this is a part of AI that is pretty
    new, and there hasn’t been a ton that has been done on this, but there are a few
    cases that are pretty exciting and show us just how this is supposed to work.
    To start, a study that was done at Stanford University tested the algorithms of
    AI on how well they were able to detect cancers of the skin compared to dermatologists.
    And in this particular study, they were able to perform at the same level as the
    human provider. Another study was done by an AI software company out of Denmark,
    who tested some of the programs they had with deep learning by having the computer
    listen in when dispatchers took emergency calls. This algorithm took time to analyze
    what the person was saying, the voice tone that was used, the noise in the background,
    and whether something like a cardiac arrest was happening with a success rate
    of 93 percent. The success rate for these same things in the human dispatchers
    was 73 percent. According to Baidu Research, they are in results to do some early
    testing on an algorithm they have for deep learning. This particular algorithm
    is meant to be tested to see if it is able to perform better than humans when
    it comes to identifying the metastasis of breast cancer. And Prime minister Theresa
    May announced a new revolution in AI that is meant to help the UK healthcare system,
    the National Health Service, to help predict cancer in some of the earlier stages
    and could help to prevent thousands of deaths by cancer by 2033. As you can see,
    while these methods may not be used all of the time as of right now, there are
    a lot of algorithms out there that are being tested, and which could help to diagnose
    various diseases that a patient has. Depending on the circumstance, these algorithms
    are as effective, if not more effective, than their human counterparts. If these
    algorithms continue to grow and learn more and become more widely acceptable over
    time, then it is likely that they could help save many lives in the future. Administrative
    and workflow tasks The next thing that you can implement with the help of AI tools
    will be both administrative and workflow tasks. It is expected that if these tools
    were used in the proper manner it could end up saving the industry of healthcare
    at least $18 billion. This is because these AI machines would be able to come
    in and help doctors, nurses, and any other kind of health care provider save time
    on their tasks. And time is definitely money. Technology, including transcriptions
    that go from voice to text, could make it easier to order the tests that a patient
    needs, prescribe the right medications, and even write out the notes for charts
    for the doctor. When the doctor is able to get these things done more efficiently,
    without having to sit down and do them on their own or having to hire someone
    to follow them around to do it, then it saves a lot of time and money and makes
    for happier patients. One example that we can take a look at when it comes to
    using the AI tools to help support administrative tasks is the known partnership
    that has happened between IBM and the Cleveland Clinic. This Clinic is currently
    working with IBM’s Watson in order to mine big data and to ensure that physicians
    are going to be able to provide treatment experiences to their patients that are
    more efficient and personalized in the process. One of the methods that the Watson
    program is able to support physicians is that it is going to be able to take in
    thousands of medical papers with the help of natural language processing and uses
    this information to help make treatment plans that are backed by research and
    are more informed than before. Image analysis Right now, there are a ton of different
    images that are coming in at providers. They have to look at things like X-rays,
    ultrasounds, brain imaging, and more. Each patient could potentially need some
    of these images done, and this has to be done in a timely and efficient manner.
    When the doctor has 50 patients who have all gotten imaging done in the week,
    and they need to look over the information and then discuss it with their patient,
    it is not strange that it takes up a lot of time for the human providers and can
    cause a lot of overload in the process. However, a research team that was led
    by MIT has been able to develop an algorithm with machine learning that is able
    to take a look at 3D scans and then analyze them 1,000 times faster than what
    the human provider is able to do. This assessment is near real-time and can really
    help our surgeons when they are operating, and even speed up the work that a doctor
    is able to do. This is not going to replace the human doctor, but it is going
    to add on another level that helps the doctor to do their job more efficiently.
    In addition to this, it is also the hope that AI can help to improve some of the
    newer radiology tools that will be released, ones that will be able to help with
    diagnoses without needing to rely on samples of tissue all of the time. These
    AI image analyses would be able to be really useful in a more remote area. The
    ones that may not be able to reach as many medical devices or have the same kinds
    of doctors that those in larger areas would as well. The most exciting part is
    that it can make healthcare more available to everyone. Telemedicine, when it
    is used properly with AI systems, will become more effective because patients,
    no matter where they are located, will be able to use the camera on their phone
    to send in pictures of things like cuts, rashes, bruises, and more so they can
    determine if care is really needed, freeing up the resources of the hospital and
    saving time for things that are minor and don’t really need to be seen by a doctor.
    The world of health care is complicated, even without the regulations and more
    that these centers need to focus on. And adding in the tools of AI to this can
    help to not replace the human providers, but support them in their work to analyze
    data to see trends in the genetic information of a patient, help with diagnosing
    faster, and can provide better service overall to the customer. When you are in
    a situation where even a few minutes can make a difference between a life that
    you can save, machine learning and AI can really make a difference for the future
    of the healthcare industry and on all of the patients who will be able to use
    this kind of technology. '
  fmt: "# Chapter 6: Can Healthcare Benefit with AI?\n\nThe next place we are going\
    \ to look when it comes to how AI can improve an industry is in the world of healthcare.\
    \ When it comes to our health, especially in matters that are life and death,\
    \ AI can really come in to save the day and provide us with a lot of different\
    \ methods that will make doctors more efficient. While there is still a lot that\
    \ needs to happen before we get to the point of health care that is dependent\
    \ on AI and systems of AI, most notably with the concerns of data privacy and\
    \ the fears of care that is mismanaged due to machine error and no human oversight\
    \ in there, there is still a lot of potential that healthcare providers, tech\
    \ companies, and governments may be willing to test out these tools and solutions\
    \ and see how they work for this industry. With that in mind, we may need to take\
    \ a look at some of the ways that AI is already able to help out the medical world,\
    \ and some of the places where there is a lot of potential for it to improve over\
    \ time. Some of the most common and well-thought-out examples of advances in AI\
    \ that can happen in the world of health care includes:\n\n## AI-assisted surgery\n\
    \nThe first area of the health care field that we are going to explore when it\
    \ comes to how we can use AI technology is going to be with robotic surgery that\
    \ is assisted with AI. With a value that is estimated to be at $40 billion in\
    \ healthcare, robots are able to take some of the data out there from pre-op medical\
    \ records and use this to help guide the instrument that the surgeon is using\
    \ during surgery. This actually can help to reduce the amount of time the patient\
    \ stays in the hospital to 21 percent. There are a lot of things to enjoy when\
    \ it comes to surgery that is assisted by robots. To start, this kind of surgery\
    \ is seen to be minimally invasive, so the patient will be able to heal faster\
    \ with a smaller scar. Via AI, the robots are going to be able to gather up the\
    \ data of past operations and can then inform new surgical techniques in the process.\
    \ The results of this are promising and very positive right now. \n\nIn one study,\
    \ there were 379 orthopedic patients looked at. It was found that when they underwent\
    \ a procedure that was AI-assisted, they had five times fewer complications compared\
    \ to those who just had the surgeon do the operation on their own. In another\
    \ study, a robot was chosen to do eye surgery for the first time, and the most\
    \ advanced surgical robot, the `Da Vinci`, allows the doctor to go through procedures\
    \ that are pretty complex with greater control compared to some of the approaches\
    \ that are used on a regular basis. Another example of how these AI-assisted surgery\
    \ robots can help is in the case of `Heartlander`, a miniature robot that is able\
    \ to help out heart surgeons. This little robot is able to enter into a smaller\
    \ incision that the surgeon puts into the chest to perform both mapping and some\
    \ therapy over the hearts surface. This helps to make heart surgery less invasive,\
    \ more efficient and can help the patient to heal and get better in no time.\n\
    \n## Nursing assistants that are virtual\n\nThe second thing we are going to look\
    \ at when it comes to introducing more AI into the medical field is the idea that\
    \ we are able to use this to have more virtual nursing assistants. From being\
    \ able to interact with the patients who come in to directing the patients to\
    \ head to the care setting that is the most effective for them, it is possible\
    \ that these nursing assistants who are virtual and able to run thanks to AI,\
    \ will be able to save this particular industry $29 billion a year or more!. Since\
    \ virtual nurses can be available all day every day, this makes it easier for\
    \ them to answer any questions, monitor how the patients are doing, and even provide\
    \ some of the quick answers that are needed. These make them more effective than\
    \ some of the human counterparts and can help to cover a bit when the shifts are\
    \ short on staff. Most applications of these virtual nursing assistants are going\
    \ to make it easier to have open and regular communication occur between the health\
    \ care provider and the patient, even between their regular office visits. This\
    \ alone could help to prevent the readmission of the patient to the hospital and\
    \ cuts down on the number of hospital visits overall that are not really necessary.\
    \ In some cases, such as with the `Care Angel` virtual nurse assistant, it is\
    \ possible to use the tools of AI and your own voice in order to complete a wellness\
    \ check.\n\n## Aid in diagnosis and clinical judgment\n\nAI is also able to come\
    \ in and help diagnose some of the patients that are in the clinic. Admittedly,\
    \ this is a part of AI that is pretty new, and there hasn’t a ton that has been\
    \ done on this, but there are a few cases that are pretty exciting and show us\
    \ just how this is supposed to work. \n\nTo start, a study that was done at Stanford\
    \ University tested the algorithms of AI on how well they were able to detect\
    \ cancers of the skin compared to dermatologists. And in this particular study,\
    \ they were able to perform at the same level as the human provider. Another study\
    \ was done by an AI software company out of Denmark, who tested some of the programs\
    \ they had with deep learning by having the computer listen in when dispatchers\
    \ took emergency calls. This algorithm took time to analyze what the person was\
    \ saying, the voice tone that was used, the noise in the background, and whether\
    \ something like a cardiac arrest was happening with a success rate of 93 percent.\
    \ The success rate for these same things in the human dispatchers was 73 percent.\
    \ \n\nAccording to Baidu Research, they are in results to do some early testing\
    \ on an algorithm they have for deep learning. This particular algorithm is meant\
    \ to be tested to see if it is able to perform better than humans when it comes\
    \ to identifying the metastasis of breast cancer. And Prime minister Theresa May\
    \ announced a new revolution in AI that is meant to help the UK healthcare system,\
    \ the National Health Service, to help predict cancer in some of the earlier stages\
    \ and could help to prevent thousands of deaths by cancer by 2033. \n\nAs you\
    \ can see, while there is still a lot that needs to happen before we get to the\
    \ point of health care that is dependent on AI and systems of AI, most notably\
    \ with the concerns of data privacy and the fears of care that is mismanaged due\
    \ to machine error and no human oversight in there, there is still a lot of potential\
    \ that healthcare providers, tech companies, and governments may be willing to\
    \ test out these tools and solutions and see how they work for this industry.\
    \ [rest of text continues with same logic]\n"
  trans: '

    # 第 6 章：医疗健康能从 AI 中获益吗？


    当我们讨论 AI 如何改进一个行业时，下一个关注的领域是医疗健康。在涉及我们的健康，特别是关乎生死的问题时，AI 真的可以在关键时刻营救，并为我们提供许多不同的方法，让医生的工作更高效。虽然在实现依赖
    AI 和 AI 系统的医疗保健之前，仍有许多工作需要完成，特别是对数据隐私的担忧，以及对由于机器错误和缺乏人工监管导致护理管理不当的恐惧，但医疗提供者、科技公司和政府可能仍很大潜力愿意测试这些工具和解决方案，并观察它们在该行业中的运作情况。考虑到这些，我们可能需要审视
    AI 已经能够帮助医学界的一些方式，以及随着时间的推移具有巨大改进潜力的领域。医疗领域中一些最常见且深思熟虑的 AI 进展示例包括：


    ## AI 辅助手术


    我们在探讨如何使用 AI 技术时，医疗健康领域的第一个探索领域将是 AI 辅助的机器人手术。医疗保健领域的价值估计达 400 亿美元，机器人能够从术前医疗记录中提取一些数据，并利用这些数据指导外科医生在手术期间使用的器械。这实际上可以帮助患者的住院时间缩短
    21%。在机器人辅助手术方面有很多值得期待的地方。首先，这种手术被认为是微创的，因此患者能够更快愈合，且伤口更小。通过 AI，机器人能够收集过去手术的数据，并在此过程中为新的手术技术提供参考。这些结果目前是非常乐观且非常积极的。


    在其中一项研究中，研究人员对 379 名骨科患者进行了观察。发现，当他们接受 AI 辅助的手术时，与由医生独立完成手术的人相比，其并发症减少了五倍。在另一项研究中，机器人被首次用于进行眼科手术，最先进的手术机器人
    `Da Vinci` 让医生与某些日常使用的方法相比，能够以更大的控制力执行相当复杂的程序。AI 辅助手术机器人提供帮助另一个例子是 `Heartlander`，一种能够帮助心脏外科医生的微型机器人。这个小机器人能够进入医生在胸部切开的较小切口，并在心脏表面执行制图和某些治疗。这有助于使心脏手术变得更具微创性、更高效，并帮助患者在短时间内康复并好转。


    ## 虚拟护理助理


    我们在向医疗领域引入更多 AI 时关注的第二点是，利用它拥有更多的虚拟护理助理的想法。从与进诊患者互动到引导患者前往最适合他们的护理环境，这些依靠 AI 运行的虚拟护理助理可能为这一特定行业每年节省
    290 亿美元或更多！由于虚拟护士可以全天候服务，这使得他们更容易回答任何问题、监控患者状况，甚至提供一些所需的快速回答。这使得他们比某些人类同类更有效，并能够在轮班人员短缺时提供支持。虚拟护理助理的大多数应用将使医疗提供者与患者之间的开放、定期的沟通变得更容易，即使在常规门诊之间也是如此。此举就能防止患者再次住院，并减少总体不必要的就次数。在某些情况下，例如使用
    `Care Angel` 虚拟护理助理，可以使用 AI 工具和您自己的声音来完成健康检查。


    ## 诊断与临床判断辅助


    AI 能够介入并帮助诊断诊所的某些患者。承认的是，这是 AI 的一个非常新的领域，尚未针对此进行大量工作，但有一些案例非常令人兴奋，向我们展示了它的运作方式。


    首先，斯坦福大学进行的一项研究测试了 AI 算法检测皮肤癌的效果与皮肤科医生的对比。在这项特定的研究中，它们的表现与人类提供者水平相当。另一项研究是由丹麦的一家
    AI 软件公司进行的，他们测试了其深度学习程序，让计算机在接线员接紧急电话时进行监听。该算法花时间分析人们说话的内容、使用的语调、背景噪音以及是否发生了心脏骤停等情况，成功率达到了
    93%。而人类接线员在这些任务上的成功率为 73%。


    根据百度研究院的研究，他们正准备对某项深度学习算法进行早期测试。这一个特定算法旨在测试其在识别乳腺癌转移方面是否能优于人类。当时的英国首相特丽莎·梅宣布了一项新的
    AI 革命，旨在帮助英国医疗系统（国民医疗服务体系）在早期阶段预测癌症，并可能在 2033 年之前防止数例癌症死亡。


    正如大家看到的，虽然在实现依赖 AI 和 AI 系统的医疗保健之前，仍有许多工作需要完成，特别是对数据隐私的担忧，以及对由于机器错误和缺乏人工监管导致护理管理不当的恐惧，但医疗提供者、科技公司和政府可能仍很大潜力愿意测试这些工具和解决方案，并观察它们在该行业中的运作情况。

    '
