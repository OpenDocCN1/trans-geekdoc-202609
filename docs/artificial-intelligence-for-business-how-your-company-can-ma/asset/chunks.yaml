- raw: "Chapter 2: Making It Big with Big Data The next topic that we need to take\
    \ some time to explore is the idea of big data. This is going to be a term that\
    \ is used in order to describe the large volume of data, which can be either unstructured\
    \ or structured or both, that is going to come to a business on a daily basis.\
    \ While most of the time we are talking about a large amount of data, this isn’t\
    \ the important part when we talk about this. Instead, the part that is the most\
    \ important here is how the company is able to take that data and use it.  Big\
    \ data can be analyzed so that the company can learn valuable insights that will\
    \ lead them to the best business moves and much better decisions than before.\
    \ When it comes to big data, there are a lot of different parts that come together\
    \ to work with this term. While this term, in particular, is still pretty new,\
    \ the act of being able to gather and store a lot of information to be used in\
    \ the analysis has been around for years. Companies have always been in the market\
    \ to take as much information as they can and use it to help them out. this information,\
    \ if they are able to sort through it the proper way, and find the right insights,\
    \ can give them a competitive edge in the world and will make it easier for them\
    \ to get ahead while serving their customers. With this in mind, there are a few\
    \ definitions out there for what big data is all about and how it works. There\
    \ are going to be three main Vs that we can use to help us get a better understanding\
    \ of this big data, and how we are able to use it for our needs. The first V here\
    \ is volume. With this one, a company is going to take some time to collect their\
    \ data, often from a wide variety of sources. Relying on data from just one source\
    \ may seem like it is easier, but it is not the best for building sound business\
    \ decisions. There are many different ways that this information can be gathered\
    \ including from the transactions of the business, social media, surveys, and\
    \ more. In the past though, being able to store this information, and even getting\
    \ through it, would have been a problem. But now there are a lot of different\
    \ technologies and platforms that can handle this information and helps the company\
    \ to gather as much information as they would like, without worrying about where\
    \ they should store it. The second V we need to focus on is the velocity. The\
    \ data that a company is going to get is able to stream in at a very fast speed,\
    \ something that we haven’t seen in the past, and we need to make sure that this\
    \ data is being dealt with, not sometime in the future, in within a timelier manner.\
    \ Things like sensors and RFID tags are going to help us to get through this information\
    \ and make it work with us, going at near real-time in the process. And the third\
    \ V is variety. The best kind of data is the kind that has a lot of variety. This\
    \ is going to ensure that the business is getting the information that it needs,\
    \ without getting stuck on one tangent along the way. The data that the company\
    \ uses can come in many different formats. This could include financial transactions,\
    \ data from the stock tickers, audio, video, emails, text documents that are not\
    \ structured, structured data, and even some numeric data that we are able to\
    \ find in some of the traditional databases. While those three components can\
    \ tell us a lot about big data and the information that we are going to be able\
    \ to get out of it, there are also two other dimensions that we may want to look\
    \ at as well to determine what big data is all about and how it is going to work.\
    \ These two additional dimensions are going to include the complexity and the\
    \ variability of the data that we are working with. The first dimension that we\
    \ are going to look at here is the variability. In addition to being able to increase\
    \ both the varieties and the velocities of data, the flow of data can sometimes\
    \ be very inconsistent, and it is going to come with some periodic peaks that\
    \ can mess with the information. This is something that can show up often when\
    \ we are talking about social media. While these peaks are sometimes seen as a\
    \ good thing because it means that our customers are there and providing us with\
    \ more information for us to get better, these peaks, whether they are triggered\
    \ seasonally, daily, and even by an event, can be hard for a company to learn\
    \ how to manage. And when these peaks are happening with data that is not structured,\
    \ the challenge is going to become even more pronounced. And the final dimension\
    \ that we are going to look at for this part is going to be the complexity. You\
    \ can imagine that the data a company gets from its customers, services, and products\
    \ are going to come from more than one source. This is sometimes going to make\
    \ it hard to cleanse, transform, match, and even link the data across the system.\
    \ However, it is so important for the company to be able to connect and correlate\
    \ the relationships, hierarchies, and multiple data linkages or your data is going\
    \ to end up spiraling out of control in no time. Now that we understand a bit\
    \ more about how this is going to work, it is time to move on and explore some\
    \ of the reasons why big data is so important. Why are we devoting a whole chapter\
    \ in this guidebook to the idea of big data and how to use it. And why would other\
    \ companies want to collect all of this data and use it for their own needs? The\
    \ importance that we are going to find when it comes to big data is that it really\
    \ doesn’t revolve around the amount of data that you have. While it is true that\
    \ most companies are going to have a ton of data, some companies that may have\
    \ a little less can gain a competitive advantage because they are able to better\
    \ use the data that is available for them. What is most important when we are\
    \ talking with this is what you decide to do with the data that is presented to\
    \ you. It is possible for a company to take in data from any kind of source and\
    \ then take some time to analyze it to find the answers that are needed. The answers\
    \ that you are looking for will depend on what kind of business you are running,\
    \ and what your own end goals and plans are. This data, when it is used in the\
    \ proper manner, is able to help us reduce costs, reduce the amount of time it\
    \ takes to get things done, can help us optimize the products and offerings that\
    \ are there for the customers, and ensures that all the decisions that are made\
    \ are smart decisions. When you are able to take all of that data that a company\
    \ has been collecting for some time, and then combine it together with some higher-powered\
    \ analytics, there are going to be a few different tasks related to a business\
    \ that you are able to do. Some of the tasks that are possible when you combine\
    \ the data with the analytics include: \n\n1.  Big data can be used in order to\
    \ detect when there is some kind of behavior that is seen as fraudulent before\
    \ it is able to affect your business and cause a mess. \n\n2.  Big data is able\
    \ to come in and recalculate the entire risk of your portfolio in just a few minutes.\
    \ \n\n3.  You can use big data to make the shopping experience for your customers\
    \ more friendly. It is going to be useful at generating coupons at the point of\
    \ sale based on the buying habits that are seen for your customers. \n\n4.  Big\
    \ data can be used to help determine some of the root causes of failures, defects,\
    \ and issues in near real-time in the process. "
