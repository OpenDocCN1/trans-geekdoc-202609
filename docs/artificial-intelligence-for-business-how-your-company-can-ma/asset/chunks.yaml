    \ going to be a type of machine learning that is going to have many different\
    \ interconnected units, that are similar to what we find in the brain and with\
    \ neurons, that will process the information by responding to inputs that are\
    \ given. This information is then relayed between each of the units. The process\
    \ is going to require us to have many passes at the data to make sure that we\
    \ are able to find the connections and that the system is then going to derive\
    \ some kind of meaning and predictions from the data that is undefined.\n3. **Deep\
    \ learning**: This is going to use a huge level of neural networks, which come\
    \ with many layers of processing units, and this allows it to take advantage of\
    \ advances in computer power and improved training techniques. This is all done\
    \ in order for the machine to learn some of the more complex patterns that are\
    \ found in a big amount of data. Speech and image recognition are two of the applications\
    \ that are going to use with this.\n4. **Cognitive computing**: This is another\
    \ subfield of AI that is going to help us to get a natural interaction to occur\
    \ with the machines. Using AI with this cognitive computing is going to come with\
    \ the goal for the machine to naturally simulate the processes of humans through\
    \ the ability to interpret speech and images.\n5. **Computer vision**: This one\
    \ is going to rely on pattern recognition, along with some deep learning, in order\
    \ to recognize what is showing up in a video or a picture. When the machines are\
    \ able to process, analyze, and then understand the image that it is seeing, they\
    \ have a much better chance at capturing videos and images in real-time, and then\
    \ they can interpret what is going on in its surroundings.\n"
  trans: '


    1. 将分析能力引入一些尚未充分利用其潜力的领域和行业。

    2. 它可以改进我们在现有分析技术中看到的性能，包括计算机视觉和时间序列分析。

    3. 帮助打破存在的经济障碍，包括出现在翻译和语言方面的障碍。

    4. 它将增强现有的某些能力，从根本上让我们在已经在从事的工作中表现得更好。

    5. 在同一个过程中赋予我们更好的愿景、更好的理解力、更好的记忆以及更多功能。


    ## 人工智能的挑战


    尽管利用人工智能能为我们带来许多益处，但随之而来的也将面临一些挑战。只要使用方法得当，人工智能将具有改变每一个行业的能力。许多行业已经开始使用现有的 AI
    技术，很可能会越来越多的行业也使用这些技术来帮助他们更好地工作。


    基于此，对于每一个对人工智能感兴趣的行业和家公司来说，理解该系统可能具有某些局限性是非常关重要的。使用 AI 时出现的一个原则性局限性是，它将从数据中学习。我们没有其他方法可以将我们希望系统拥有的知识和数据整合。这意味着，如果数据存在不完整或不准确的部分，这些问题将反映在你获得的结果中。任何额外的分析和预测层必须以单独的方式添加到其中。


    今天，被认为是 AI 的系统将以特定的方式进行训练，以帮助它们完成定义明确的任务。一个能够自主学会玩扑克的系统，无法将这种知识应用于玩国际象棋或纸牌牌。如果我们愿意，我们可以训练它来做这些事情，但它不像人类，不能将在学习玩扑克时获得的知识转用于玩其他游戏。你必须重新通过学习算法，并以多种方式对其进行训练，同时为系统留出足够的内存空间，以便计算机或机器学习超过一种游戏。


    此外，一个旨在帮助银行和其他金融机构检测任何正在欺诈行为的系统，将无法用于汽车或提供良好的法律建议。即使在同类的工作范围内，AI 系统也只能做一件事。例如，你可能有一个能够检测医疗保健领域发生欺诈的
    AI 系统，但你不能用它来检查税务欺诈或保修索赔欺诈。换句话说，这些系统必须非常专业才能工作。它们将专注于某一项任务，无法以与人类完全相同的方式学习、适应或行为。它可以学习如何执行任务，但通常情况下系统是专门化的，因此它只学习如何与一种系统工作，而这就是它能做的全部。


    ## 人工智能如何工作


    尽管存在这些局限性，你仍然可以使用 AI 完成许多不同的事情，这些可以帮助你真正让 AI 系统满足你的业务需求。但是，人工智能最初是如何工作的呢？AI 之所以工作是因为它将使用快速且能够迭代处理的算法来结合大量数据。这种方式允许软件在从使用数据中出现的特征或模式中学习时，以自动方式进行学习。人工智能是一个非常广泛的研究领域，并在过程中接管许多行业以及更多。这一特定的研究领域将包含许多你可以使用的不同技术、方法和理论。


    除了这些之外，你还可以利用以下一些主要的子领域来真正发挥人工智能的最大价值：


    1. **机器学习**：这是人工智能的一个子集，可以实现分析模型构建过程自动化。它将使用许多不同的方法来创建这些模型，包括物理学、运筹学、统计学和神经网络。这些方法也被用于发现隐藏在数据中的任何洞察，而无需通过编程来告知它去哪里寻找或在过程中做出什么预测。

    2. **神经网络**：这是机器学习的一种类型，具有许多相互连接的单元，类似于我们在大脑中发现的神经元，通过对给定的输入做出响应来处理信息。这些信息然后在每个单元之间传递。这个过程需要我们对数据进行多次处理，以确保我们能够找到连接，然后系统将从未定义的数据中推导出某种意义和预测。

    3. **深度学习**：这将使用大规模的神经网络，其中带有许多层处理单元，这使其能够利用计算机计算能力的进步和改进的训练技术。这一切都是为了让机器学习大量数据中发现的更复杂的模式。语音识别和图像识别是使用该技术的两个应用。

    4. **认知计算**：这是 AI 的另一个子领域，可以帮助我们实现与机器自然交互。将 AI 与这种认知计算结合，目标是让机器通过解释语音和图像的能力，自然地模拟人类的过程。

    5. **计算机视觉**：这一领域将依赖模式识别以及一些深度学习，以识别视频或图片中出现的内容。当机器能够处理、分析并理解它们所看到的图像时，它们有更大的机会实时捕捉视频和图像，然后它们就可以解释周围发生的情况。


    '
