    # 商业人工智能：贵公司如何通过机器学习、数据科学、大数据和深度学习获取更多利润


    Copyright © 2019 版权所有。未经出版商或作者书面许可，本书的任何部分不得以任何方式（电子或机械，包括复印、录制、物理和在线存储）进行复制或使用，但书评中的引用除外。我们已尽力提供完整且有用的信息，但对所包含的信息不提供任何隐含或显性的保证。本书内容不能替代获得执业许可人士的咨询。


    ## 目录

    - 引言

    - 第一章：什么是人工智能？

    - 第二章：利用大数据做大文章

    - 第三章：你已经是一家 AI 企业了，却并不知道！你已经在使用的常用 AI 工具

    - 第四章：AI 及其在零售业中的应用

    - 第五章：将 AI 引入你的营销

    - 第六章：医疗保健能从 AI 中获益吗？

    - 第七章：电信领域的 AI

    - 第八章：在金融领域引入 AI

    - 第九章：AI 的通用应用

    - 第十章：AI 的未来

    - 结论


    ## 引言

    恭喜你购买《商业人工智能》，感谢你的支持。接下来的章节将讨论关于人工智能如何工作，以及你如何将其应用于自己的业务中所需要的所有知识。AI 能做到的事情是惊叹的，这种数据科学方法即使在那些看似不可能的业务领域也能大大显身场。


    在本指南中，我们将更深入地探讨人工智能的工作原理及其定义，更多关于大数据的内容，以及人工智能在各种业务领域中使用的许多实际方法。指南的开头将侧重于人工智能的介绍、其工作原理，以及企业已经在使用它的不同方式的一些示例。


    随后，我们将转向关注大数据及其本质。同时，公司将如何关注正确处理和使用其大数据的方法，从而真正获得竞争优势。我们将在指南的这一部分介绍一些 AI 的使用方式，以及企业在毫无察觉的情况下使用的一些工具。


    本指南的下一部分将探讨一些可以利用 AI 的不同业务，以及该系统如何帮助他们增长、赚更多利润并看到他们想要的结果。我们将研究 AI 如何在零售、制造业、医疗保健、金融、营销等领域被应用。


    最后，在结束本指南时，我们将探讨一些与 AI 合作的通用方法。此外，我们还将介绍该系统在许多不同行业中的具体用法，并对 AI 的现状以及未来可能的发展方向进行展望。


    很多时候，关于 AI 以及如何使用这种技术存在着很多误解。我们要么假设它必须留在科学技术领域，要么对机器人接管世界或其他科幻构式的应用有天马行行的设想。在本指南中，我们将花时间拆解人工智能，看看它能做什么，甚至探索一些它能为你的业务带来益的方式，无论你处于哪个行业！市面上有许多关于这个主题的书，再次感谢你选择本本书！我们已尽全力确保它尽可能地充满有用信息；请享受阅读！


