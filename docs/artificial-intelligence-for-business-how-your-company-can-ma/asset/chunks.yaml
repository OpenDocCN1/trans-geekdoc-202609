- raw: 'In addition to these, there are going to be a few different technologies that
    come into play that help to not only enable AI but to support it. First, we can
    look at GPUs or graphical processing units. These are going to be a big key to
    what we can see with AI because they are going to provide some of the heavier
    computing power that is needed to help with iterative processing. Training neural
    networks are going to require a lot of big data, along with some good computing
    power to get the work done. The next thing that AI needs for support is known
    as the Internet of Things. This is going to be able to generate a massive amount
    of data from connected devices, and most of this is not going to be analyzed.
    We are able to use more of it when we decide to automate some of the models that
    we use with artificial intelligence as well. There are going to be some algorithms
    that are more advanced with this as well. And these are being developed and even
    combined in new ways to help support the AI capabilities that you are looking
    for. This all comes together because it helps us to analyze more data faster,
    and you can do this at multiple levels. This intelligent processing is going to
    be the key to being able to identify and predict rare events that may happen while
    also understanding more of the complex systems that show up and optimizing scenarios
    that are unique all in one shot. And finally, the APIs, or the application processing
    interfaces, are going to be important when it comes to supporting AI. These are
    going to be a type of package of code that is portable and will help us to add
    some functionalities of AI to existing software packages and products. If you
    already have software and products that are out and in use, but you would like
    to add in some artificial intelligence to this without having to start over, then
    this is the thing that you need to focus on. These APIs are going to be able to
    help add on a lot of the different functionalities that come with AI, including
    image recognition capabilities. Such as what may be needed with a security system,
    Q&A capabilities that are going to help describe the data, create headlines and
    captions, or call out some of the interesting insights and patterns that are found
    in the data, but which you may have missed out on in the past. As you can see
    here, there are a lot of different parts that come with AI and a lot of different
    things that you are able to do when it comes to working with this part of computer
    science. Learning how to work with artificial intelligence, and all of the different
    things that come with it can help you to really become better at your job, helps
    to get work done quickly and efficiently, and can bring any business into the
    future by giving them a competitive edge over everyone else. '
  fmt: '

    In addition to these, there are going to be a few different technologies that
    come into play that help to not only enable AI but to support it.


    ### GPUs (Graphical Processing Units)

    First, we can look at GPUs. These are going to be a big key to what we can see
    with AI because they are going to provide some of the heavier computing power
    that is needed to help with iterative processing. Training neural networks are
    going to require a lot of big data, along with some good computing power to get
    the work done.


    ### Internet of Things (IoT)

    The next thing that AI needs for support is known as the Internet of Things. This
    is going to be able to generate a massive amount of data from connected devices,
    and most of this is not going to be analyzed. We are able to use more of it when
    we decide to automate some of the models that we use with artificial intelligence
    well. There are going to be some algorithms that are more advanced with this as
    well. And these are being developed and even combined in new ways to help support
    the AI capabilities that you are looking for.


    This all comes together because it helps us to analyze more data faster, and you
    can do this at multiple levels. This intelligent processing is going to be the
    key to being able to identify and predict rare events that may happen while also
    understanding more of the complex systems that show up and optimizing scenarios
    that are unique all in one shot.


    ### APIs (Application Processing Interfaces)

    Finally, the `APIs`, or the application processing interfaces, are going to be
    important when it comes to supporting AI. These are going to be a type of package
    of code that is portable and will help us to add some functionalities of AI to
    existing software packages and products.


    If you already have software and products that are out and in use, but you would
    like to add in some artificial intelligence to this without having to start over,
    then this is the thing that you need to focus on. These `APIs` are going to be
    able to help add on a lot of the different functionalities that come with AI,
    including:

    * Image recognition capabilities (such as what may be needed with a security system).

    * Q&A capabilities to help describe data, create headlines and captions.

    * Calling out some of the interesting insights and patterns found in the data,
    which you may have missed out on in the past.


    As you can see here, there are a lot of different parts that come with AI and
    a lot of different things that you are able to do when it comes to working with
    this part of computer science. Learning how to work with artificial intelligence
    and all of the different things that come with it can help you to really become
    better at your job, helps to get work done quickly and efficiently, and can bring
    any business into the future by giving them a competitive edge over everyone else.

    '
  trans: '


    除此之外，还会有几种不同的技术将发挥作用，它们不仅能实现 AI，还能为其提供支持。


    ### GPUs（图形处理器）

    首先，我们可以看看 GPU。它们将成为我们在 AI 领域看到的关键，因为它们能够提供辅助迭代处理所需的某些强力计算能力。训练神经网络需要大量的庞数据，以及良好的计算能力来完成工作。


    ### 物联网（IoT）

    AI 所需支持的下一项技术被称为物联网。它能够从连接设备中产生海量数据，而其中大部分并不会被分析。当我们决定对某些用于人工智能的模型进行自动化处理时，我们就能利用其中更多数据。此外，这一领域还会出现一些更先进的算法。这些算法正在以新的方式进行开发甚至结合，以帮助支持你所寻求的
    AI 能力。


    这一切之所以能汇聚在一起，是因为它们帮助我们更快速地分析更多数据，而且你可以在多个层次上进行操作。这种智能处理将是识别和预测可能发生的稀有事件的关键，同时理解更复杂的系统，并一气完成对独特场景的优化。


    ### APIs（应用程序编程接口）

    最后，`APIs`（应用程序编程接口）在支持 AI 方面也至关重要。它们是某种类型的可移植代码包，将帮助我们为现有的软件包和产品添加一些 AI 功能。


    如果你已经有了投入市场并使用的软件和产品，但又想在不从头开始的情况下向其中添加一些人工智能，那么这就是你需要关注的。这些 `APIs` 能够帮助添加许多随
    AI 的的不同功能，包括：

    * 图像识别能力（例如安全系统可能需要的那些）。

    * 问答能力，帮助描述数据、创建标题和说明。

    * 提取数据中发现的有趣见解和模式，而你可能在过去已经错过了这些。


    正如你在这里看到的，AI 包含许多不同的部分，在处理计算机科学的这一领域时，你可以做很多不同的事情。学习如何使用人工智能以及与其相关的相关的所有不同事物，可以帮助你真正变得工作更好，帮助快速高效地完成工作，并通过赋予企业相对于他人的竞争优势，将任何业务带向未来。


    '
