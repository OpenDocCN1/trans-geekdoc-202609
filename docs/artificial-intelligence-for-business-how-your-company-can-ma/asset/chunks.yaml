    # 第 8 章：在金融领域引入 AI


    另一个能够从 AI 中受益的领域将是金融世界。AI 在金融领域创造了许多奇迹，帮助公司能够真正处理业务中许多许多不同的方面。这种技术不仅有助于提供过去可能无法实现的更好的客户服务，还能帮助提高金融机构的效率，保持良好的透明度，并确保始终准时符合各项法规。在利用
    AI 及其随而来的所有神奇工具方面，金融和银行领域有多种方式可以受益。以下是金融银行业以及其他类似公司从人工智能中受益的几个示例：


    ## 风险评估


    由于 AI 的核心组件主要是关于从过去收集的数据中学习，因此 AI 世界及其产生的所有技术在金融服务领域取得成功并表现优异是自然的，因为这种业务几乎需要大量的记录、簿记和大量数据。想一下在与财务任何相关的事务中，经过筛选和使用的所有不同信息。让我们来看看信用卡是如何被使用、管理甚至发放的。今天，你被要求使用信用分数来判断你是否有资格获得这些信用卡之一。然而，对于企业来说，将人们分为“贫者”和“富者”并不总是最有效的方法。相反，可以使用关于个人的数据（包括他们拥有多少张信用卡、当前的活跃贷款、还款习惯等）来是个性化个人的资格，并为卡片定制允许的利率，使其符合机构的利益。虽然这可以帮助消费者和金融机构，但我们必须看看到什么样的系统实际上能够将这些整合在一起并实现这一切。


    ## 简单 AI


    由于这一切都关乎数据，依赖数据并由数据驱动，扫描金融机构从客户那里获得的所有记录，可以使 AI 工具具备对信贷产品提供更智能、更快速建议的能力。在做这件事方面，它们也比专业的贷款人员更高效、更准确。


    ## 机器学习


    机器学习和 AI 将迅速取代人类，因为该领域的不准确性可能会导致数百万美元的损失。基于机器学习（意味着程序将随着时间的推移学习如何更好地完成工作），这降低了错误的可能性。所以，虽然可能需要一些时间让这个程序按照我们想要的方式运行，并完成所有设置和准备就绪，但程序在这类事情上使用得越多，它就会表现得越好。你可以想象，这将从许多方面惠及客户和企业。企业将受益，因为他们能够更快地完成贷款并为人们提供所需的资金，同时在极短的时间内赚利息。AI
    算法的不准确性也会减少，从而节省大量的资金。


    ## 检测


    这些系统缩短了查看贷款或信用卡申请的时间。人类操作员需要几天才能处理的内容，算法只需要几分钟就能处理完毕。客户将更快地知道他们所要求的贷款金额或信用卡是否获得批准。它还可以帮助对金融机构定期处理的所有不同类型的交易、以及人员、贷款等需要处理的内容进行反欺诈。金融机构非常担心欺诈，以及如果无法充分捕获它会给他们带来多少损失，这并不奇怪。每家企业都需要找到降低现有风险的方法，特别是如果你有储蓄或支票账户或其他可以赚取利息的投资时，事实更是如此。这也是另一个原因，即金融机构将非常认真对待
    AI 如何在帮助公司识别任何安全问题方面处于顶尖作用。它能够查看过去所有正常的消费行为，甚至通过不同的工具来找出何时存在某些有些奇怪且需要检查的行为。例如，如果一张信用卡在内布拉斯加州使用，然后就在德国发生了一笔交易，那么很可能发生了某种形式的欺诈，AI
    工具能够发现这一点。或者查看账户的 AI 算法对用户如何取钱、取多少等有一个非常好的了解。这些都是在该人离开那里后，行业中的 AI 系统能够提供帮助的事情。涉及到
    AI 时，你会喜欢的另一个优秀功能是，该系统在学习时不会遇到任何问题。它能够为某些常规交易标记红旗，有时它在这里是错的，但随后人类会介入，看到交易是正常的并进行纠正，而不是像人类那样担心犯错和产生错误。


    ## 金融咨询服务


    我们在这里看到的下一个点是 AI 如何帮助各种金融服务。根据普华道报告，客户在与银行和其他金融机构打交道时应该开始考虑更多的机器人顾问（robot advisors）。由于金融机构面临着减少个人投资收取的佣金金额的压力，机器可能会做一些人类永远不会为首付工作的事情。


    这方面的另一个另一个开始兴起的领域是仿生咨询（bionic advisory）。它能够将人类的洞察与机器计算相结合，以提供比人类洞察更高效的选项，为我们提供比单个组件单独能做的更高效的选项。然而，为了让这种协作发挥作用，协作是关键。我们的意思是，仅仅观察机器并将其视为配件、甚至是每个部分的无知者是不够的。两者之间必须有良好的平衡，我们需要将
    AI 更多地视为决策过程的一个组件，这个部分与人类能提供的东西是平衡的且同等重要的。当我们能做到这一点时，我们才对金融世界决策的未来有了内部视角。


    ## 交易


    我们也可以看看人工智能如何在金融世界的交易中提供帮助的。投资公司已经能够依靠数据科学家和计算机来帮助他们确定市场中出现的一些未来模式。作为一个领域，投资和交易将取决于投资者或机器以准确的方式预测未来，以帮助他们在过程中赚更多的钱。机器在这些所有事情上可以是一个极佳的工具，因为它们能够处理海量数据并在短时间内对其进行计算。我们还可以教机器观察过去数据中发生的模式，并利用这些信息对这些模式可能在未来某点重复做出良好的预测。虽然在这方面会出现一些异常情况，例如
    2008 年金融危机，但仍然可以教机器研究呈现的数据以找到通常在异常之前发生的触发因素，并对此制定计划。


    ## 财务管理


    第五个受益的领域是 AI 如何管理他们的财务。这被称为个人财务管理（PFM），是随 AI 而来的最新发展之一。它能够查看你的开支情况，这将变得更容易，而且这是金融机构在未来将改变的一部分。毫无疑问，AI
    将成为世界变化方式的一个重要部分。


    ## 个人财务


