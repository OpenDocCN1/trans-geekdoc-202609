    # 第 3 章：你已经是一家 AI 企业了，但你甚至还不知道！


    我们将花费一些时间讨论的下一个话题是在业务中使用 AI，以及我们已经在使用的一些 AI 常用工具和方法。AI 的普及程度远比许多企业主意识到的要得多，甚至客户也意识到了这一点。我们经常使用带有机器学习和其他
    AI 部分的产品，而我们对此一无所知。这些产品将极大地帮助我们保持安全，让生活更轻松，并帮助我们经营业务，但我们还没有真正花时间停下来观察这种影响，以及它是如何满足我们的需求的。


    考虑到这一点，让我们来看一些你的企业可能已经在用、但你甚至没有察觉的 AI 工具。以及你如何利用这些工具来让生活变得更轻松，同时每次都能提供良好的客户体验。


    ## 网络安全工具


    许多客户甚至企业必须面对的现实是，网络攻击正变得日益频繁。尽管大多数企业付出了努力，但它们无法对这一切做好准备。除了企业层面某些准备不足外，网络安全领域的人才在跟上使用这些技术的业务需求时，也将面临巨大的困难。


    事实上，估计到 2021 年，全球范围内将至少有 350 万个网络安全职位空缺。这意味着对于该领域的人才来说，即使他们工作更加努力，由于职位的空缺，也需要利用诸如人工智能的技术来帮助保持安全和保障。


    鉴于我们今天所发现的网络安全现状，将 AI 系统引入业务中可以成为一个转折点。这些系统将带来许多益处，帮助该领域的人才应对网络攻击并确保企业和客户的安全。许多网络安全的
    AI 算法使用机器学习，因为这有助于它们随着时间的推移而适应。由于新的攻击方式不断变化，恶意软件变得难以检测，因此动态 AI 方法将是完美的解决方案。


    使用 AI 系统帮助网络安全的另一个益处是，这些算法可以根据感知到的威胁水平对攻击进行分类。虽然新的攻击方式不同，但机器学习能够帮助我们识别并响应，这帮助了人才跟上这些变化。


    另一个上处是，在使用 AI 系统帮助网络安全时，这些算法和系统能够为员工节省大量时间。AI 系统将自动处理某些情况，释放员工的人力资源。现在，我们需要看看网络安全专家如何利用
    AI，通过智能自动化来触发某些风险标记。根据 Grobman 的观点，这些 AI 系统不会让该领域的人才过时，而是将帮助保护业务和他们的客户。我们必须记住，由于该领域存在人才短缺，AI
    系统的工作能力会有一些限制，但与人类协作解决某些问题是非常重要的。


    ## 语音和语音识别


    AI 在业务中应用的一个很好的例子是语音和语音识别。你使用 `Alexa` 或类似的语音识别产品来查找信息、开启音乐并定期回答问题。这就是机器学习工作的一个示例。程序员将花费时间开发一种非常擅长识别现有单词和语音模式的系统。当然，这仍然存在学习曲线。很多时候，同一种语言存在不同的方言、语音模式和单词。这需要一些时间来调整并学习理解用户。但通过实践以及人工智能的进步，这些系统正在变得更好。


    AI 将是处理公司面临的不同挑战的一种极佳方法。它对客户负责维护客户提供的信息安全。我们必须记住，AI 系统在该领域的能力会有局限。它可以做一些很不起的事情并帮助你更安全，但与人类协作解决某些问题是非常重要的。


    ## 垃圾邮件过滤器


    对于邮件，我们希望减少杂质，留下对我们最重要的邮件。垃圾过滤器是人工智能可以帮助解决的挑战。许多常见的邮件提供商已经在使用人工智能和机器学习来帮助这一实现，确保你真正想读的邮件进入收净箱。在刚开始，垃圾过滤器可能没有我们预想的那么准确。有时我们会发现好邮件在垃圾箱里，而垃圾邮件却漏了进来。但随着时间的推移，当我们通过更多实践调整算法，过滤器会变得更好，邮件也会到达它们应该去的地方。


    ## 机器语言翻译


    机器翻译系统将是在线服务或应用程序，它使用机器学习的一些技术将大量文本翻译成所支持的其他语言。该服务将接收源文本（即你想翻译的原始文本），将其转换为第二种语言（即你的目标语言）。虽然这项技术的一些概念以及呈现的界面非常容易理解，但其背后的科学甚至必须进行的工作是非常复杂的。它汇聚了诸如
    `web APIs`、`云计算`、`语言学`、`大数据`和`深度学习`等元素。


    自早期以来，由于深度学习的出现，`神经网络`等技术让 AI 系统能够学习并识别我们面临的威胁。虽然新的攻击方式不同，但机器学习能够帮助我们识别并响应，这帮助了人才跟上这些变化。使用
    AI 系统帮助网络安全的另一个益是是，这些算法可以根据感知到的威胁水平对攻击进行分类。


    '
