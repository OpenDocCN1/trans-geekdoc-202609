    AI 已经可能在旅行和导航等方面发挥作用。现在我们应该知道，AI 在很多方面影响着日常生活，通过 `GPS` 来帮助我们。无论你是使用 `Apple Maps`
    或 `Google Maps` 来帮助你，或者你叫 `Uber` 去某处，或者你预订机票，AI 正在发生作用。你可以看到，在 `Apple` 和 `Google`
    都在使用的的导航设备中，AI 正在正在发生。


    ## 监控与安全


    我们之前已经讨论过这个话题，但重要的是看到我们利用安全的各种方式来帮助我们保持安全、防止盗窃、确保正确的人进入某些地方，以及更多。虽然我们可能会对使用泛泛监控系统的某些伦理问题进行争论，但现在无法否认的事实是它已经在使用，而且
    AI 在其中确实起着非常重要的作用。想象一下，要监控许多不同的显示器是多么困难、几乎不可能，因为所有这些显示器同时处理来自数百甚至数千个摄像头的画面。这对于人类来说几乎是不可能的，但当你加入
    AI 时，它将变得完全合理。通过带有 AI 技术，你可以比任何其他方法更好地进行物体识别和人脸识别，而且监控视频流将越来越多地由 AI 监控，而不是人类。


