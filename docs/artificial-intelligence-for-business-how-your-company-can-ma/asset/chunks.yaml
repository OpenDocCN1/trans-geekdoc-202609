    # 词编码与注意力机制


    每个词（也称为代表该词的 500 维向量）都会通过它的第一层。这一层将把单词编码到一个 1000 维向量中，该向量将代表该单词以及它在同一句话中与其他单词相比的语境含义。


    一旦系统能够独立处理每个单词并将其编码为这些向量，同样的过程将重复进行几次。这一过程确保了每一层都能进行精细调整，以便我们理解每个单词在整个句子中的含义，而不仅仅是其孤立的含义。


    在我们用于最终输出的矩阵中，我们可以获取该输出并将其放入注意力层。它还将利用之前完成的各种计算，以过滤掉目标语言（即第二层）中任何可能未被使用或是不必要的单词。


    解码器（或称为翻译层）随后能够将选定的单词（在大多数情况下是整个句子）翻译成你选择的目标语言。进入这一最终层的输出可以被发送回到我们的注意力层。这样做是为了确保我们可以计算出下一个要翻译的单词。


    # 安防监控与人工智能


    人工智能开始进入个人及各类公司的安全监控领域。这允许我们使用计算机和机器来分析它们所看到的视频，而完全不需要人在现场进行工作。对于公共安全来说，这可能是一个极好的消息，并帮助急救人员和警察发现事故和犯罪。


    此外，还有许多工业和科学应用。许多公司将依赖各种视频监控。他们可能利用此帮助监控商店内的盗窃和其他问题。对于客户的安全来说，周围有这些设备是件好事。你曾多少次走进商店，看到监控摄像头却什么都没想过？我们已经习惯了这些设备的存在，并且已经习惯了它们，并知道它们的目的是为了确保人们保持诚实并确保我们的安全。


    在传统使用这些设备的情况下，必须有人翻看几个小时的视频，才能看到是谁在偷窃，或者是谁在危及他们周围的人。这通常是在事件发生后，即警察或其他人员介入后才进行的。大多数公司不会付钱让人坐在那里一直看视频，因此工作是在事后完成的。如果没有怀疑盗窃或对客户有任何危险，那几个小时的录像很可能会被忽略，因为这花费了太多的时间和精力。业务中发生但被客户和员工遗漏的可能给公司造成损失的事情数量是无法估量的。某些问题本可以被视频记录到，但大多数公司并没有建立起筛选和观看所有视频的机制，因此被遗漏了。


    与其雇佣一个整天坐在那里看视频的人（他们往往会因为移开目光、无聊或不注意而漏掉事情），我们可以引入人工智能来完成这项工作。通过视频监控，你可以教人工智能算法你希望它如何运行，并向它展示需要发生的步骤，以便它能够检测盗窃、暴力和其他未经许可的行为是否正在发生。这通常通过向算法展示视频和图像来实现，直到它开始识别这些行为是否正在发生。该系统的设置方式使得，当算法在视频中注意到某处出现问题时，它可以根据你的输入发送警报或其他标记。这可以帮助公司提高效率，确保盗窃和其他行为的发生频率降低，并让他们更容易在商店里留住资金，而不必总是查看所有的几个小时录像。使用
    AI 的工具每天都在增长。这些是帮助我们真正改进现有系统并确保我们的业务按照我们想要运行的绝妙方式。通常，我们在使用这类工具时甚至没有意识到它们的存在，也没有意识到我们实际上正在使用它们。


    '
