    \ variability. In addition to being able to increase both the varieties and the\
    \ velocities of data, the flow of data can sometimes be very inconsistent, and\
    \ it is going to come with some periodic peaks that can mess with the information.\
    \ This is something that can show up often when we are talking about social media.\
    \ While these peaks are sometimes seen as a good thing because it means that our\
    \ customers are there and providing us with more information for us to get better,\
    \ these peaks, whether they are triggered seasonally, daily, and even by an event,\
    \ can be hard for a company to learn how to manage. And when these peaks are happening\
    \ with data that is not structured, the challenge is going to become even more\
    \ pronounced.\n\n### Complexity\nThe final dimension that we are going to look\
    \ at for this part is going to be the complexity. You can imagine that the data\
    \ a company gets from its customers, services, and products are going to come\
    \ from more than one source. This is sometimes going to make it hard to cleanse,\
    \ transform, match, and even link the data across the system. However, it is so\
    \ important for the company to be able to connect and correlate the relationships,\
    \ hierarchies, and multiple data linkages or your data is going to end up spiraling\
    \ out of control in no time.\n\n## Importance of Big Data\n\nNow that we understand\
    \ a bit more about how this is going to work, it is time to move on and explore\
    \ some of the reasons why big data is so important. Why are we devoting a whole\
    \ chapter in this guidebook to the idea of big data and how to use it. And why\
    \ would other companies want to collect all of this data and use it for their\
    \ own needs? The importance that we are going to find when it comes to big data\
    \ is that it really doesn’t revolve around the amount of data that you have. While\
    \ it is true that most companies are going to have a ton of data, some companies\
    \ that may have a little less can gain a competitive advantage because they are\
    \ able to better use the data that is available for them. What is most important\
    \ when we are talking with this is what you decide to do with the data that is\
    \ presented to you. It is possible for a company to take in data from any kind\
    \ of source and then take some time to analyze it to find the answers that are\
    \ needed. The answers that you are looking for will depend on what kind of business\
    \ you are running, and what your own end goals and plans are. This data, when\
    \ it is used in the proper manner, is able to help us reduce costs, reduce the\
    \ amount of time it takes to get done, can help us optimize the products and offerings\
    \ that are there for the customers, and ensures that all the decisions that are\
    \ made are smart decisions. When you are able to take all of that data that a\
    \ company has been collecting for some time, and then combine it together with\
    \ some higher-powered analytics, there are going to be a few different tasks related\
    \ to a business that you are able to do. Some of the tasks that are possible when\
    \ you combine the data with the analytics include:\n\n1. Big data can be used\
    \ in order to detect when there is some kind of behavior that is seen as fraudulent\
    \ before it is able to affect your business and cause a mess.\n2. Big data is\
    \ able to come in and recalculate the entire risk of your portfolio in just a\
    \ few minutes.\n3. You can use big data to make the shopping experience for your\
    \ customers more friendly. It is going to be useful at generating coupons at the\
    \ point of sale based on the buying habits that are seen for your customers.\n\
    4. Big data can be used to help determine some of the root causes of failures,\
    \ defects, and issues in near real-time in the process.\n"
