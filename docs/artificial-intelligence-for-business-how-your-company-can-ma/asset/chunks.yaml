    # 第 9 章：AI 的通用应用


    在指南中，我们花费了大量时间观察 AI 世界以及它在不同行业中能够完成的各种事情。在营销、零售、金融甚至是医疗保健等多个领域，我们所能做的事情已经令人印象深刻了。但这仅仅是一个开始。利用
    AI 背后的技术，你可以做的事情还有很多，而我们还没有时间讨论全部！关于 AI 以及它将如何塑造我们世界的未来，存在着很多争论。虽然我们可能认为 AI 还没有被普及，而且要过很一段时间它才会对我们的日常生活产生任何影响，但人工智能已经存在，并帮助影响着我们的决策、生活方式、购物方式等。让我们来看看一些你已经在日常生活中甚至没有察觉的情况下使用的其他人工智能的通用应用和示例。


    ## 智能手机


    许多人经常使用智能手机。手机通常被认为是如今大多数人拥有的最不可或缺的科技产品，而且我们大部分时间都会使用它。但如果你在使用智能手机，无论是哪种智能手机，无论我们是否意识到，你都在与
    AI 交互。从 AI 一些而易见的特征（包括你使用的智能助手或语音识别）到一些不那么明显的特征（包括你在相机上使用的人像模式），当你拿出手机并尝试为了个人需求使用它时，很多时候都在使用
    AI。越来越多的制造商确保在他们制造手机中包含 AI，这很常见，包括几家公司，华为（Huawei`）和高通（Qualcomm`）为具有 AI 功能的手机生产芯片。这种与
    AI 的集成将带来许多不同的功能，包括混合现实和虚拟现实类型的元素、场景检测等。随着时间的推移，这种 AI 可能会在我们使用手机、消费媒体等方面开始发挥更大的作用。诸如自适应电池、剪辑和应用操作等功能都可以成为其中的一部分。


    ## 社交媒体信息流


    也许你不是那种使用智能手机的人，而且无人机和智能汽车的想法听起来并不那么有趣，尽管在任何关于人工智能的对话中，它们都非常受欢迎。即使你不使用其中的某些东西，你很可能以某种形式使用某种社交媒体。现在有很多不同类型的社交媒体应用可用，包括
    `Instagram`、`Twitter`、`Facebook`、`Snapchat` 等。每当你为了需求使用社交媒体时，你的决策都可能受到人工智能的影响。从出现在你时间线中的信息流，到这些应用发送给你的各种不同通知，你会发现这一切都是在
    AI 的帮助下进行筛选的。你可能认为这些社交媒体网站没什么大不了，它们只是为了娱乐，但其中大多数内容都将受到 AI 的影响。事实上，AI 的存在是为了观察你的互动、你的网页搜索以及你在该网站上过去的一些行为，然后尝试根据你的喜好来定制体验。这样做是为了让社交媒体网站获益。他们使用
    AI 是为了寻找让应用程序变得非常有成瘾性的方法。他们知道，当你迷于这些应用并感到被吸引回来时，会更容易反复再回来。AI 知道你喜欢看什么，并将不断吸引你回来获取更多，同时还根据你的偏好定制广告等，以帮助他们在此过程中盈利。


    ## 媒体和音乐流服务


    当我们谈到 AI 以及它是如何影响我们的生活时（即使我们没有意识到），我们可以观察的另一个例子是许多人每天使用的媒体和音乐流。无论你是在使用 `YouTube`、`Netflix`
    还是 `Spotify`，你都会发现 AI 正在为你做很多决定。你可能在这个过程中觉得你才是那个控制者，但实际上，你并不是。这样做是为了帮助你只需听音乐而无需思考，并可以使整个体验更加愉快，但现有的
    AI 系统将对你将听什么以及你的播放列表中会出现哪些歌曲做出决定。


    ## 视频游戏


    我们也可以看到许多常见的视频游戏都可以配合 AI 使用。视频游戏行业实际上是 AI 最早的采用者之一。这种整合最初规模很小，因为 AI 仅用于为玩家生成一些随机关卡供其。随着时间的推移，这种对
    AI 的使用增加到了将真正触及该行业每一个方面的程度。让我们来看一个例子。在更大规模上，我们最近看到由埃隆·马斯克（Elon Musk）支持的 `OpenAI`
    公司开发的 `OpenAI 5` 在单挑比赛中击败了职业级 `Dota 2` 玩家。同一个程序也击败了业余 `Dota 2` 队伍。这一成就将是 AI 行业的一个大时刻。这是因为
    `Dota 2` 是一款基于策略的游戏，游戏玩家必须每秒钟都做出决策。能够击败被视为职业的玩家（这意味着他们已经花费了大量时间研究这类游戏并精通了它），对于
    AI 系统来说是一项巨大的成就。


    考虑到这些，我们需要看看 AI 渗透到我们在游戏行业看到的一些其他方式。你决定要玩的任何游戏内部都会有一个 AI 元素。当你玩 `Fortnite`、`CS`
    等游戏时，你将从面对几个由 AI 驱动的机器人开始，随着时间的推移，你将开始与真人对战。AI 在游戏领域的最有趣用法之一是在《中环》（`Middle Earth`）系列中，该游戏中的敌人将由
    AI 控制。


    ## 在线广告


    我们在日常生活中使用人工智能的另一种方式是在线广告。这种行业将使用 AI 来跟踪用户的统计数据，同时根据收集到的数据向用户提供某些广告。这有助于获得更具针对性的广告，并可以增加成交的可能性。如果没有
    AI 的帮助，广告行业将会失败，你将看到完全随机的广告。很难知道用户是否会对该广告产生任何联系。


