  trans: '


    为了充分利用人工智能的强大力量，我们需要能够解决教育层面以及业务领域发生的一些问题。教育系统需要能够利用这些技术，以便专注于培训学生从事与人工智能工作直接相关的角色，包括数据分析师和程序员在内的人员。这意味着需要更多地强调
    STEM（科学、技术、工程和数学）学科，以便在这一过程中也能处理这些内容。此外，我们需要花时间集中在培养需要鼓励的情感、社交和创造力上。虽然人工智能的生产效率将高于人类，能够完成某些重复性任务，但在需要大量想象力和建立关系的工作中，人类将能够胜过机器，这将改善该领域的职业状况。你将在未来发现，人工智能将改变我们的外部和内部世界，而且很多时候这种情况在我们甚至不知道发生了什么的情况下就已经发生了。与其关注对自动化所存在的某些恐惧，不如企业需要能够拥抱一些新技术，以确保他们能够实施一些最有效的
    AI 系统，其目的不是为了取代人类智能，而是对其进行补充和增强。考虑到此，我们需要花一些时间探索人工智能未来将如何改变事物，并让事情的完成变得更容易。这种情况可能发生的方式有很多种，包括以下方面：


    ### 自动交通

    我们已经通过自动驾驶汽车看到了一部分，尽管这些车辆仍需要驾驶员在场以确保安全。尽管有了这项新进展，自动交通的想法仍然很新颖，可能还需要一段时间才能达到足够安全的水平，而要被公众接受则需要更长时间。`Google`
    在 2012 年开始测试自动驾驶汽车，从那时起，美国交通运输部目睹了如此多的变化，并发布了自动化的类型和水平的定义，而 Google 的汽车是首几个等级之一，然后一直延伸到全自动。这里还有其他一些我们可以使用的方法，它们将更接近某些全自动，例如火车和公共汽车。这在未来可能会增长得更多，并成为我们出行方式的一部分。


    ### 机械有机技术（Cyborg technology）

    人类的主要局限性之一是我们的大脑和身体。根据研究人员 `Shimon Whiteson` 的说法，未来，我们能够在计算机的帮助下自我增强，这些计算机不会取代我们，而是会尽可能地增强我们的一些自然能力。虽然在大多数情况下，这些增强只是为了方便，但在其他时候，它们可能会为了更具实用性的目的而出现。人们注意到，AI
    对于许多肢体截断并希望像过去那样拥有能力行走和移动的人来说将变得更有用。在 AI 的帮助下，这种机械有机技术将允许大脑与肢体通信，从而让患者对该肢体所需的所需的。这种技术可以以几种不同的方式工作，但它将减少截肢者每天面临的一些局限性。


    ### 接管某些危险工作

    我们已经看到机器人将接管某些对其他人来说并不一定安全的工作，包括拆弹等。根据来自 `BBC` 的一些信息，这些目前还不完全是机器人。它们在技术上目前是无人机，被用作物理实体来帮助拆弹，但它们确实需要人类来控制它们，而不是目前形式的
    `AI`。无论如何分类，它都可以通过接管这项工作并确保他人安全，来拯救数千人的生命。


    ### 解决气候变化问题

    你通过 AI 可以做的另一件事是应对气候变化。当涉及到机器人能做什么时，这个问题似乎是一项艰任务，但根据 `Stuart` 的说法，机器获取的信息将比任何个人都多得多，同时在大大数据的帮助下，`AI`
    发现天气中的趋势，甚至在高度、有害化学品等方面，都可能是未来我们通过 `AI` 的帮助能够改进的事物。


    ### 友谊

    现实中，谁不想有一个朋友呢？大多数人可能不想尽可能避开这一点，随着 AI 在我们的日常生活中变得越来越普遍，你会发现世界上所有的机器人都能与你产生共鸣并保持友好。这在未来将会发生变化，尽管日本的一家公司已经迈出了第一步。事实上，伴侣机器人
    `Pepper` 在 2015 年上市，并在几分钟内就售出了单元。对于这台机器人，我们看到它被编程为读取人类，甚至发展出一些情感。虽然这还有很长的路要走，但这种机器将无法完全取代人类互动。


    ### 改进对老年人的照顾

    由于许多不同的原因，许多老人和老年人的日常生活将是一场斗争，这些人中许多不得不雇佣外部帮助以确保他们能够管理照顾的所有不同部分并不罕见。在某些情况下，他们可能依靠自己的家庭成员和朋友来完成工作，并在过程中帮助他们安全健康。`AI`
    目前尚未达到让这种对外部帮助的需求成为远可能的阶段。根据华盛顿州大学 `Matthew Taylor` 的说法，被称为 `Home Robots`（家用机器人）的机器人可能会出现并帮助这些老人完成一些日常任务，确保他们安全健康，而无需去养老院或失去他们需要的某些独立性。对于那些不需要一直帮助的老人，以及那些尚未准备好离开家放弃生活但仍需要某些帮助的人——例如有人查看他们，甚至有人确保他们用药和就诊——使用
    AI 的家用机器人完成这些工作将非常有用。这让老人留在家里尽可能长时间拥有自己的自由和生活，同时确保他们获得所需的帮助，改善他们的整体健康状况，并让他们的亲人在知道他们安全时感到放心。


    这些只是我们与 `AI` 工作时能够做的一些事情，我们并展望它未来将能够做什么。这有很多选择，局限性将仅仅在于我们的大脑和创造力。这种 `AI` 未来可能会扩张，并产生新的意义，并随着时间的推移在各个方面涵盖我们家庭和生活的更多领域。


    '
