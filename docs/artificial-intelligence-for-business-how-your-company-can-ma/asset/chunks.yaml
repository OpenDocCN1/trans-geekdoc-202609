    \n1. They can act as the gateway that is needed between the requests of the customer\
    \ and a live chat or the help center.\n2. They can help to route the customers\
    \ and their requests to the right customer service agent and can help the customers\
    \ who call with the intent to purchase to go right to the sales department to\
    \ save time.\n3. They can help analyze some of the customer requests along with\
    \ the data from the network to make sure that any problem of the customer finds\
    \ a solution as efficiently as possible.\n4. They can help to identify some of\
    \ the hot leads simply by going through all of the emails the company receives\
    \ and then routing them over to the right people in sales.\n5. They can allow\
    \ the customers to explore and also purchase different media content, using just\
    \ their voices and spoken word, rather than having to rely on a remote to get\
    \ things done.\n6. Entertainment chatbots come into this and can operate either\
    \ on the native platform that the company has or through a Facebook Messenger\
    \ platform based on what is easier.\n\nOne place where this AI technology is going\
    \ to be used is when we want to add it to the customer service process and as\
    \ a customer service agent. A good example of this is the Ask Spectrum virtual\
    \ assistant, which is powered by AI and is going to help the customer with some\
    \ general questions they have, account information, and even even troubleshooting.\
    \ The customer will have their inquiries managed by the assistant, and the number\
    \ of ways that the chatbot is able to do this simply depends on what the company\
    \ wants to do.\n\nThe assistant can be set up to provide the user with links to\
    \ the Help Center and other helpful tips, or if the situation is too complex,\
    \ it can refer them to a Live Chat representative. These are usually much faster\
    \ to get on, without a person behind them, and can solve a lot of the issues that\
    \ the customer will have. This frees up some of the time and commitments of the\
    \ Live Support staff so they can better keep up with what the customer needs.\
    \ In the long run, this is going to benefit both parties. The customer can get\
    \ their questions answered and their issues handled within a few minutes, rather\
    \ than having to wait on the phone for 20 minutes or more. The customer service\
    \ for that company will not have to hire as many customer service representatives\
    \ to get the work done either. And when the customer does have a more complex\
    \ need that they can’t get assistance from otherwise, they can still gethold of\
    \ a real person to help.\n\n## Sales and personalized experience for the user\n\
    \nThe next way that the AI in telecom companies can work is by increasing sales\
    \ and helping with the personalized user experience. In addition to working with\
    \ chatbots to help out with customer service, and even inquiry routing systems,\
    \ it is possible that AI can come into play and help the telecom company improve\
    \ their retention of customers while still earning more profit with each user\
    \ who sticks on them. There are a lot of ways that AI can come into the mix and\
    \ help out these telecom companies, especially when it comes to helping them provide\
    \ a good user experience for the customers. And some of the methods are ones that\
    \ we have already talked about in this. The ways that your telecom business could\
    \ benefit when using AI systems may include:\n\n1. It can help to make some recommendations\
    \ that are personalized based on the user and the content preferences, and behavioral\
    \ patterns, that they have shown in the past.\n2. It can make the right kinds\
    \ of upsells and cross-sells offers, at the right time and to the right users.\
    \ This can be more efficient than what you would be able to see with your sales\
    \ agents.\n3. This system can help you to look at your calling and data packages\
    \ and see which one is going to work the best for each type of customer you are\
    \ working with. When you are able to hook up the customer with the right package,\
    \ they are more likely to make the purchase.\n4. It can help to detect and then\
    \ fix any of the issues that the customer would potentially have, even before\
    \ the end-user realizes the problem is going on.\n"
  trans: '


    # 第 7 章：电信领域的 AI


    当我们探讨 AI 如何工作时，下一个关注的行业是电信业。如果你认为电信业与 AI 无关，那么你绝对完全错了。事实上，在《哈佛商业评论》2018 年报告的一项调查中，一些大型企业中约
    73% 的高管认为，他们已经从包括数据科学和 AI 在内的举措中获得了可衡量的价值。


    我们现在已经到了数据科学必不可缺的程度。它曾仅仅是公司用来获得竞争优势的方法。而现在，如果你的业务中缺乏这些技术，特别是在电信领域，你会被甩在后面。AI 目前被应用于许多不同的行业，这其中将深度涵盖电信业务。该领域的创新运营商将利用机器学习和
    AI，根据他们希望服务客户的方式以及希望获得的结果，在许多不同的方面提供帮助。


    例如，电信公司可以使用 AI 来优化其业务流程，以获取更多利润，提高客户的留存率和满意度，甚至确保网络可靠性的提升。电信业务在利用 AI 和机器学习的不同部分时，受益最大的领域主要有三个。这三个主要领域包括：


    ## 客户留存与客户服务


    当我们考虑电信公司如何使用 AI 时，首先要看的是客户服务和留存。领先的电信公司正在利用 AI 带来的功能来帮助许多不同类型的流程。列表包括：精简客户服务流程、为客户提供个性化的优惠，以及通过自动化聊天机器人提供支持。


    在极少数例外之外，AI 驱动的客户服务解决方案通常分为两个不同的类别。第一类是与客服的沟通，第二类是客户互动以及为用户提供更个性化的体验。解决并改进这这两个问题中的每一个都将有助于节省大量资金，并提高公司的整体效率。


    我们首先需要关注的是电信公司如何解决客户面临的问题。考虑到这些公司目前的规模，对于他们的人工客服来说，这是一项巨大的工作量。但 AI 算法能够介入并独立处理大量的交互和数据，确保公司在获取更多潜在和现有客户信息的同时，及时、高效地处理客户的问题和疑问。


    由 AI 驱动的客户服务解决方案在电信世界中通常以聊天机器人界面的形式出现。但并非总是如此。在某些情况下，这些 AI 算法存在于后台，帮助确保客户服务部门尽可能具有成本效益。在大型电信公司的客户服务通信方面，这些
    AI 算法的用途有很多示例，包括：


    1. 它们可以作为客户请求与人工聊天或帮助中心之间的网关。

    2. 它们可以帮助将客户及其请求路由到正确的客服人员，并帮助意向购买的拨电客户直接进入销售部门以节省时间。

    3. 它们可以帮助分析某些客户请求以及网络数据，确保客户的任何问题都能以最高效率找到解决方案。

    4. 它们可以通过处理公司收的所有电子邮件来帮助识别高意向客户（hot leads），然后将其转给销售部门的相应人员。

    5. 它们允许客户仅通过语音和语言来探索并购买不同的媒体内容，而无需依赖遥控器来操作。

    6. 娱乐聊天机器人也属于其中，可以根据方便程度在公司的原生平台或通过 Facebook Messenger 平台运行。


    这种 AI 技术的一个应用场景是希望将其加入客户服务流程并作为客服代理。一个很好的例子是 Ask Spectrum 虚拟助手，它由 AI 驱动，将帮助客户解决一些常见问题、账户信息甚至故障排除。客户的查询将由助手管理，而聊天机器人执行此任务的方法取决于公司的需求。


    助手可以被设置为为用户提供帮助中心的链接和其他实用提示，或者如果情况太复杂，它可以将他们转接到人工聊天代表。这些通常接入速度快得多，背后不需要人工，并且可以解决客户面临的许多问题。这释放了人工支持人员的时间和精力，以便他们更好地跟上客户的需求。从长远来看，这对双方都有利。客户可以在几分钟内获得问题的解答和处理，而不必在电话那头等
    20 分钟或更久。该公司的客服部门也不需要雇佣那么多客服代表来完成工作。当客户确实有无法通过其他方式解决的需求的需求时，他们仍然可以联系真人寻求帮助。


    ## 销售与用户个性化体验


    电信公司 AI 的另一种工作方式是增加销售并帮助提供个性化的用户体验。除了通过聊天机器人协助客户服务，甚至是查询路由系统外，AI 还有可能介入并帮助电信公司提高客户留存率，同时从每个留存用户赚取更多利润。AI
    有许多方式加入并帮助这些电信公司，特别是在帮助他们为客户提供良好的用户体验方面。其中一些方法我们已经在之前讨论过。你的电信业务在使用 AI 系统时可能受益的方式包括：


    1. 它可以根据用户过去表现出的偏、内容偏好以及行为模式，提供一些个性化的推荐。

    2. 它可以并在正确的时间向正确的用户提供正确的升级销售（upsells）和交叉销售（cross-sells）优惠。这比你通过销售人员看到的会更高效。

    3. 这个系统可以帮助你查看通话和流量包，并查看哪种最适合你所服务的每类客户。当你能够为客户匹配到合适的套餐时，他们更有可能购买。

    4. 它可以帮助在终端用户意识到问题正在发生之前，检测并修复客户可能遇到的任何问题。


    '
