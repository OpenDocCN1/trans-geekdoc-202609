    # 第 2 章：利用大数据成就大事


    我们需要花时间探索的下一个主题是大数据的概念。这个术语用于描述每天进入企业的海量数据，这些数据可以是非结构化的、结构化的，或者两者兼有。虽然我们大多数时候谈论的是海量数据，但这并不是讨论的重点。相反，这里最重要的部分是公司如何获取并利用这些数据。对大数据进行分析，可以帮助公司获得有价值的洞察，从而引导他们做出最佳的业务决策和比以前更明明的选择。


    在涉及到大数据时，有很多不同的部分共同构成了这个术语。虽然这个术语本身还很新，但收集和存储大量信息以供分析的行为已经存在多年了。公司一直在市场上力求尽可能地获取信息，并利用它们来帮助自己。如果他们能够以正确的方式筛选这些信息并找到正确的洞察，就能为它们在世界上赢得竞争优势，并让它们在服务客户的同时更容易脱颖而出。基于此，关于什么是大数据以及它是如何工作的，目前有几种定义。


    ## 大数据的三个 V 特 (The Three Vs)


    我们可以通过三个主要的“V”来帮助更好地理解大数据，以及我们如何根据需求使用它。


    ### 体量 (Volume)

    第一个 V 是体量。在这一点上，公司将花费时间收集数据，通常来自来自广泛的来源。依赖单一源的数据似乎可能更容易，但对于建立稳健的业务决策来说并非最佳选择。收集信息有许多不同的方式，包括业务交易、社交媒体、调查问等。然而，在过去，能够存储这些信息甚至处理完这些信息将是一个问题。但现在，有了许多不同的技术和平台可以处理这些信息，并帮助公司收集他们想要的尽可能多的信息，而无需担心应该将它们存储在何处。


    ### 速度 (Velocity)

    我们需要关注的第二个 V 是速度。公司将获得的数据能够以非常快的速度流式传输，这是我们在过去未曾看到的，我们需要确保这些数据得到及时的处理，而不是在未来的某个时候。像
    `sensors` 和 `RFID tags` 等工具将帮助我们处理这些信息并让其发挥作用，在此过程中实现近实时。


    ### 多样性 (Variety)

    第三个 V 是多样性。最好的数据是具有多种多样性的数据。这将确保业务获得其所需的信息，而不会在过程中陷入某个特定的分支。公司使用的数据可以以许多不同的格式出现。这可能包括财务交易、股票报价数据、音频、视频、电子邮件、非结构化文本文档、结构化数据，甚至我们在某些传统数据库中可以找到的一些数值数据。


    ## 额外维度：变异性和复杂性 (Variability and Complexity)


    虽然这三个组件可以告诉我们许多关于大数据以及我们从中能获得的信息，但我们可能还想观察两个维度，以确定大数据的本质以及它是如何工作的。这两个额外维度包括我们处理的数据的复杂性和变异性。


    ### 变异性 (Variability)

    我们在这里考虑的第一个维度是变异性。除了增加数据的种类和速度之外，数据流有时可能非常不一致，并伴随着一些周期性的峰值，这会干扰信息。当我们讨论社交媒体时经常会出现这种情况。虽然这些峰值有时被视为好事，因为意味着客户在那里并为我们提供了更多信息以便我们变得更好，但这些峰值（无论是季节性的、每日还是由事件触发）对于公司来说可能难以管理。当这些峰值发生在非结构化数据上时，挑战变得更加显著。


    ### 复杂性 (Complexity)

    我们这一部分考虑的最后一个维度是复杂性。你可以想象，公司从客户、服务和产品获得的数据将来自多个来源。这有时会使跨系统的数据清洗、转换、匹配甚至链接变得困难。然而，对于公司来说，连接并关联关系、层级结构以及多个数据链接是至关重要的，否则你的数据很快就会失去控制。


    ## 大数据的重要性


    现在我们对它的工作原理有了更多的了解，是时候继续探索大数据如此重要的的一些原因了。为什么要在本指南书中用一整章介绍大数据的概念以及如何使用它？为什么其他公司想要收集所有这些数据并用于自己的需求？我们在大数据上发现的重要性在于，它并不取决于你拥有的数据量。虽然大多数公司都会拥有大量数据，但某些数据量较少的公司可能因为他们能够更好地利用现有的数据而获得竞争优势。当我们谈论此点时，最重要的是你决定对呈现给你的数据做什么。公司可以从任何来源获取数据，然后花一些时间进行分析以找到所需的答案。你正在寻找的答案取决于你经营的是什么样的业务，以及你自己的最终目标和计划。这些数据在被正确使用时，能够帮助我们降低成本、缩短完成时间、帮助我们优化为客户提供的产品和服务，并确保所做的所有决策都是明智的决策。当你能够将公司收集一段时间的所有数据，并将其与一些高级分析结合起来时，你能够完成一些与业务相关的任务。将数据与分析结合时，可以实现的一些任务包括：


    1. 大数据可以用于检测是否存在某些欺诈行为，以免在影响你的业务并造成混乱之前发生。

    2. 大数据能够在几分钟内重新计算你的整个投资组合的风险风险。

    3. 你可以使用大数据让客户的购物体验更加友好。它对于根据客户的购买习惯在销售点生成优惠券将非常有用。

    4. 大数据可以帮助在过程中近实时地确定故障、缺陷和问题的某些根源。


    '
