    # Chapter 3: You Are an AI Business, And Do’t Even Know It!


    The next topic that we are going to spend some of our time on is working with
    AI in our business and some of the common tools and methods that we are already
    using with AI. AI is way more prevalent than many business owners, and even customers
    are aware of. We are often using products that have machine learning and other
    parts of AI on them, and we have no idea. These products are going to really help
    to keep us safe, can make life easier, and can help us run our businesses, but
    we haven’t really taken the time to stop and look at this impact and how it is
    working for our needs.


    With this in mind, let’s take a look at some of the AI tools that your business
    is likely already using, without even noticing. As well as how you can use these
    to make life easier, while still providing a good customer experience each time.


    ## Cybersecurity tools


    The truth that many customers and even businesses have to deal with is that cyber
    attacks are becoming increasingly common. Most businesses, though they try, are
    not going to be prepared for all of this. And beyond some of the lack of preparedness
    on the business level, the workforce itself for cybersecurity is going to have
    a hard time when it comes to keeping up with the demand of the businesses that
    are going to use this.


    In fact, it is estimated that by 2021, there are going to be at least 3.5 million
    positions for cybersecurity that are unfilled throughout the world. What this
    means is that professionals in this field, and even businesses who are not able
    to find a professional to work with them, will need to compensate for these empty
    slots. They could work harder, but there are only so many hours in the day, or
    by using things like artificial intelligence to help keep things safe and secure
    for the users.


    Given the state that we are finding cybersecurity in today, the implementation
    of the AI systems into the mix can serve as a real turning point. These systems
    are going to come with quite a few benefits that are going to help professionals
    in this field for taking on the cyber-attacks and making sure to safeguard the
    enterprise all at the same time, even when there is a lack of professionals to
    help keep up with all of this.


    Many of the algorithms for AI that work with cybersecurity will use machine learning
    because this helps them to adapt over time. This can be helpful because a lot
    of the new generations of cyber attacks and malware are going to be hard to detect
    with some of the conventional protocols out there. These risks are going to change
    over time, so some of the dynamic approaches that come with AI can be the perfect
    thing to use here.


    Cybersecurity solutions that are able to use machine learning can use a lot of
    the data that happened in the previous cyber-attack to help them recognize and
    even respond to the newest attack. Even though the newer attack is different,
    it is going to have some similarities to the one before it (this saves a lot of
    time and coding for the hackers), and the machine learning algorithm is able to
    catch on.


    Another benefit that we are going to see when using an AI system to help out in
    this field is that these algorithms and systems are then able to free up a ton
    of time for tech employees. The AI system will come in and help detect some simple
    attacks and threats. Given that most of the attacks that come to your system are
    going to come with a simple solution, the systems are going to be able to remediate
    the situation on its own, freeing up the time and the resources of your staff.


    Now, we need to look at some of the ways that experts in cybersecurity are able
    to leverage the AI. They are going to do this by depending on intelligent automation
    in order to trigger up some risk red flags, some that a regular person may not
    be able to spend the resources and time looking for. According to Steve Grobman,
    the CTO with McAfee, these AI systems are not going to make humans in this field
    obsolete at all. But it will help to reduce how many need to be on staff while
    still protecting the business and their customers. Since there is going to already
    be such a shortage when it comes to this field, and professionals to do the work,
    the reduction in staff needed through the AI system can make a big difference.


    Another way that this kind of system is going to help with cybersecurity is that
    it can take some time to categorize the attacks based on how it perceives the
    threat level. While there is quite a bit of work that needs to be done at this
    point on it (There are about 52 percent of professionals in the field who say
    that this AI system is not accurate with threat levels), deep learning can come
    in and learn more along the way to helping us determine the threat that is coming
    at us.


    ## Voice and speech recognition


    A good example of how AI is being used in your business is voice and speech recognition.
    You use `Alexa` or a similar voice recognition product to help you lookup things,
    turn on music, and answer questions on a regular basis. This is an example of
    how machine learning can work. The programmers are going to spend some time developing
    a system that is pretty good at recognizing words and speech patterns that are
    out there. Of course there can still be a learning curve with this. Many times
    there are different dialects of language, different speech patterns, and different
    words used even in the same language. This can take some time to adjust and learn
    how to understand the user. But with some practice, and with the advances being
    made in artificial intelligence, these systems are getting better.


    AI is going to be a great way to handle some different challenges that come with
    your company. It owes it to their customers to keep things safe and even the information
    that your customers provide. We have to remember that there will be some limits
    to how well the system of AI can work in this field. It can do some wonderful
    things and help you more secure, but it is important to work with humans to solve
    some problems.


    ## Spam filters


    When it comes to our emails, we want to make sure that a lot of clutter is reduced,
    and we are left with the emails that are the most important to us. Spam filters
    are a challenge that artificial intelligence is able to help out with. There are
    many common email providers who are already using artificial intelligence and
    machine learning to help this happen, ensuring that the regular emails you actually
    want to read end up in your inbox. In the beginning, the spam filter may not be
    accurate as we would like. Sometimes we find that good emails are found in our
    spam folder and that spam emails get through. But as time goes on, and we adjust
    to the algorithm with more practice, the filter will get better and the emails
    will end up where they should.


    ## Machine-based language translators


    A machine translation system is going to be either an online service or an application
    that is going to use some of the technologies that come with machine learning
    in order to translate a lot of text from and to other languages that are also
    supported. The service is going to take a source text, or the original text you
    want to translate, and change it over to the second language, or your target language.
    Although some of the concepts that come with this technology, along with some
    of the interfaces that are present with it, are pretty simple to understand, the
    science and even some of the work that has to be done with it is going to be complex.
    It will bring together things like `web APIs`, `cloud computing`, `linguistics`,
    `big data`, and `deep learning` to name a few.


    Since the early 2010s, a new type of technology from artificial intelligence known
    as `deep neural networks` has allowed speech recognition to reach a quality level
    that many customers have come to expect. The speech recognition technology is
    one of the core components that comes with translating text and even spoken languages
    from one to another. So, we need to start out here by looking at how the translation
    of text is going to happen. How is a machine able to read a text in one language
    and then accurately and efficiently translate it over to a completely different
    language? Often, this kind of translation can be done between several different
    languages to give the end-user some choices.


    While each of these programs can be a bit different, we are going to take a look
    at how `Microsoft Translator` works to give us a good idea of this and can help
    us understand how some of the translation services that we use will work when
    we use them in business. With text translation, there are going to be two types
    of technologies that can be used. These include `NMT`, or `Neural Machine Translation`,
    and `SMT`, `Statistical Machine Translation`. `NMT` is the newer generation of
    this, but they can both work together to give us the results that we are looking
    for. The implementation of `Microsoft Translator` using `SMT` has been built on
    more than ten years of research on natural learning that Microsoft has been able
    to do. Rather than having the programmers go through and write out rules that
    they crafted themselves to get the languages translated, these modern systems
    of translation are going to approach this as more of a problem of learning how
    the transformation of text between these languages happens. This is going to happen
    with a few different techniques including some of the existing translations they
    have from humans and using lots of machine learning algorithms and statistics.


    The `parallel corpora` is going to be kind of like the Rosetta Stone when it comes
    to text translation. This means that it helps the algorithm to learn things like
    idiomatic translations, phrases, words, and more in context for a lot of different
    pairs of languages that are often used together. Then we can work with modeling
    techniques of statistics and efficient machine learning algorithms in order to
    help the computer address any problems it has with the deployment of these translations.
    Because of this new approach, which is going to be beneficial because it isn’t
    going to rely on grammatical rules and dictionaries (which would take a lot of
    time and there are just too many rules to consider), these artificial intelligence
    translations are going to help give the best translations possible through a machine
    without any kind of human interaction. This process works through the use of a
    neural network, meaning the system is going to learn in a manner that is similar
    to the human brain. It is going to be able to look for the patterns that show
    up between the different layers of the document and will reinforce its knowledge
    when it gets the answer right. The more times the translation service can do this,
    the more efficient it becomes.

