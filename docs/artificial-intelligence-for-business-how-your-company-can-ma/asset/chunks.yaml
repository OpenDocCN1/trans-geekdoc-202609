    to be limited based on the information and examples that you present to it, and
    the learning that it is able to do during this time. If the wrong answers and
    examples are given to the system, or it is not trained in the proper manner, then
    this can be a big problem. The machine has to have accurate information, and lots
    of it, in order to behave and react in a way that is similar to what we see with
    humans.


    Artificial intelligence, in order to make sure that it works, has to have access
    to things like relations, properties, categories, and objects between all of these
    in order to implement the idea of knowledge. This shows why this kind of process
    is not going to be done all of the time. Being able to teach a computer how it
    is supposed to react to the world around it, and how to work with problem solving,
    reasoning, and common sense is a task that is difficult and very tedious. While
    it is amazing what this kind of technology is able to do, `AI` does not make sense
    in terms of costs and time for every project you want to work with.


    ## Machine Learning and Robotics


    Machine learning is another popular piece of technology that many developers are
    exploring, and it is a core part of what happens with artificial intelligence.
    Learning without supervision present is going to require the machine to learn
    how to identify patterns in the input streams it sees. All while learning with
    the right kind of supervision is going to involve both regressions that are numerical
    and classifications.


    What does all of this mean though? First, the classification problems can be helpful
    because they are there to determine where an object belongs, and what category
    is the most important for it. Then, there are the regression problems that are
    going to deal with obtaining a set of output and input examples that are numerical.
    Which helps us to discover the right functions that enable the generation of suitable
    outputs based on the inputs that we are able to find.


    While there are a lot of things that you are able to do when it comes to machine
    learning and artificial intelligence, this is not the only category that comes
    with `AI`. In fact, you may find that robotics is going to be a major field that
    we need to take some time looking at as well. Robots are going to need some kind
    of intelligence present in order to handle a lot of the different tasks that are
    expected from them, including being able to manipulate objects and do any form
    of navigation.


    To keep this process simple, artificial intelligence is going to make it easier
    for the machines you use and program to learn from their own past experiences
    and helps these machines to be able to adjust to any of the new inputs that it
    receives, resulting in the performance of tasks that are human-like.


    ## Modern Technologies and History


    Most of the examples that we already hear about when it comes to `AI` today are
    going to rely on a combination of natural language processing and deep learning.
    And when we use these technologies in our work, the computer can be trained in
    order to accomplish the right task. Simply by being trained on the right algorithm
    to process a very large amount of data, and even recognizing what patterns are
    present in that data.


    Let’s take a detour here for a moment and explore some history that comes with
    artificial intelligence. This was a term that was first seen around 1956, but
    in the last decades or so, `AI` has become more popular. This rise in popularity
    is due to the improvements that are done with computing and power, some of the
    more advanced algorithms, and an increase in volumes of data. Early on in the
    research that was done on `AI`, the different methods were symbolic, and even
    some problem-solving. Then, in 1960s, the US Department of Defense started to
    take interest in this work and what it was able to do, which resulted in them
    using `AI` in order to train their machines to mimic some reasoning skills that
    we see in humans. Some of earlier work was able to pave the way and make it easier
    for formal reasoning and automation like we see in the machines that we use today.
    While look at science fiction and see that `AI` is depicted in a way that robots
    who are much like humans are taking over the world, you can rest assured that
    the current changes and evolution that are going on with `AI` are not going to
    be scary. `AI` is a smart tool but can be used in a way to make computers take
    over the world. Instead, `AI` has evolved to provide a bunch of benefits to almost
    every industry that is out there.


    ## Benefits of AI Across Industries


    We will explore these in more depth later on, but right now the next thing we
    need to explore is why artificial intelligence is so important. Why do we need
    to spend so much time going through the basics that come with intelligence and
    why is this a topic that matters at all? Artificial intelligence is starting to
    take over the world, and learning how to use it can make a big difference in how
    well companies perform. There are a number of reasons why artificial intelligence
    would be an important thing to learn how to do: AI is able to automate some of
    the repetitive learning that goes on, and can help lead to more discoveries through
    data.


    AI is going to be different than what we see with hardware-driven automation.
    Instead of having to go through and automating some manual tasks, `AI` is going
    to work on frequent and high-volume tasks without getting tired. Human inquiry
    is still going to be essential when it comes to getting that system set up in
    the proper manner and asking the questions that are needed. In addition, `AI`
    is going to make sure that a product you already have has more intelligence added
    to it. In most cases, `AI` is not going to be sold with the help of individual
    application; instead, the products you are already using will be improved with
    the help of `AI`. Many different smart machines can be combined together with
    all of the data the company holds onto to make sure that the technology is improved,
    no matter which field it is. AI is going to be able to adapt through progressive
    learning algorithms so that the algorithm is able to find any of the regularities
    or structure in data so that it is able to gain a new skill. This algorithm is
    going to turn into either a predictor or a classifier. So, just like we see the
    algorithm being able to teach itself the right steps to playing chess, it is also
    able to use this kind of idea in order to recommend which product the customer
    should purchase next. The models are going to be able to adapt when they are given
    new data. Backpropagation is one of the techniques that `AI` uses in order to
    make sure that the chosen model is able to adjust through training and added data.
    If you find that the first answer that is given doesn’t seem right, `AI` is then
    able to analyze deeper data and more of it with the help of neural networks that
    have a lot of hidden layers. Of course, to make sure that this kind of model will
    work, it needs a lot of data to be trained on. In fact, the more data that you
    are able to feed in, the more accurate these models will end up being. Next on
    the list is that `AI` is going to be really accurate at what it does with the
    help of deep neural networks, something that was pretty much impossible before.
    For example, any of the interactions that you do with `Alexa` and other similar
    products are going to be based on the things that we can do with deep learning.
    The more that we use them, the more accuracy is going to show up in them as well.
    Compared to some other methods of sorting through and understanding data, `AI`
    is going to be the method that is able to get the most out of this data. When
    the algorithms are able to learn on their own, the data is going to then turn
    into intellectual property. The answers that the system needs are going to be
    found in the data, so applying `AI` is a method to help get these out. Since the
    role of the data is seen as something way more important than it was in the past,
    this is going to help a company learn how to have a competitive advantage over
    others. If you are able to get ahold of the best data in an industry where everyone
    is applying techniques that are similar, the best data is still going to help
    you be the winner.


    Now that we know some of the benefits of `AI`, from a variety of different needs
    to handle all of, let’s look at the different industries that use it:


    ### Health Care

    The first area is in health care. The different applications of `AI` can provide
    patients with personalized readings and medicine. Health care assistants can even
    work as life coaches in order to remind us to eat healthier, exercise, and take
    medications at the right time.


    ### Retail

    Retail can also benefit from using `AI`. It can step in to provide a shopping
    capability that has been personalized to the customer. This can even be used to
    discuss some purchase options that are available.


    ### Manufacturing

    Next on the list is manufacturing. It is possible for various manufacturing companies
    to go through and use `AI` in order to analyze `IoT` data as it streams from the
    equipment. This is going to be done in order to forecast the expected lead and
    demand with the help of what is known as a recurrent network. These recurrent
    networks are going to be a type of network in deep learning that is going to be
    used with any kind of sequence data and can be really helpful with this processing.


    ### Banking

    Finally, it is possible to work with `AI` in order to help out with the field
    of banking. `AI` is able to help enhance the speed, precision, and even the effectiveness
    of human efforts. In a financial institution, these techniques are going to be
    used to help us figure out which transactions are most likely to be good and which
    ones are fraudulent, how to go through and adopt fast and accurate credit scoring,
    and even how to go through and automate some of the data management tasks that
    are more intense.

