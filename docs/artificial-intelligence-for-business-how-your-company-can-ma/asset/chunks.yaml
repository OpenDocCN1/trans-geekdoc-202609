    # Chapter 10: The Future of AI


    We have already spent a lot of time in this guidebook talking about artificial
    intelligence and a lot of the things that you are able to work with this technology
    along with. We have looked at some of the general things that you are able to
    do with this kind of technology, and even some of the more specific ways that
    you are able to implement this kind of intelligence into a wide variety of fields
    including health care, retail, marketing, finances and more.


    But what could happen when you look at the future of AI. There is already a lot
    of potentials that come with it, and it is amazing to think about what is going
    to happen when we use it more and really put AI to the test. Smart technologies
    are not just there to change our homes. These are going to edge their way into
    a lot of other industries as well, and it is likely that they are going to be
    able to disrupt the workplace and the way that we are going to be able do your
    work on a day to day basis.


    Artificial intelligence has so many different applications that are going to come
    into play, and they are able to potentially improve your accuracy, efficiency,
    and productivity across a whole organization, but is it always going to be beneficial
    to everyone? It is common for some people to worry about how AI is becoming more
    popular and they think that it is going to result in machines and robots coming
    in and replacing the workers that usually have these kinds of jobs. Those who
    have this kind of view are going to be really worried about the increase in AI
    and may want to stop it.


    Before we go through and really look at AI and understand more of what it is about,
    we need to understand that AI is not there to take our jobs and kick us all on
    the street. But it is there to fill in some of the gaps to help us do our jobs
    better and more efficiently, and it is going to be there to help us to fill in
    spaces where maybe there are not enough employees, and not enough time to really
    handle the work that needs to be done.


    With this in mind, many businesses, as well as individuals are going to be optimistic
    that the AI-driven shift is going to the workplace will result in more jobs being
    created rather than being lost, like the big ear is all about. And as more of
    these innovative kinds of technologies are developed, AI is going to have a big
    impact on the economy, simply because it is going to create more jobs, jobs that
    require us to have a skill set to implement some new systems.


    In fact, about 80 percent of the people who responded to an EY survey said that
    the biggest challenge that would show up when trying to employ a new AI program
    would be that there is a lack of skills when it comes to the workforce. The workforce
    would have to take some time to learn how to do these skills and implement the
    AI system in order to see the results that are needed and to make sure that these
    systems are actually going to work. This could take some time, and it could be
    one of the reasons that a lot of the AI system is going to take time to grow and
    be implemented. For this to be improved and for some changes, we need to make
    sure that we have the right kind of workforce in place.


    It is likely that there are a few jobs that are going to be replaced with the
    help of artificial intelligence over time. But these are going to be the jobs
    that do just some basic problem-solving tasks or being repetitive, and some of
    them are going to be able to go beyond current capabilities of humans. The AI
    system is able to come into the group in order to make some decisions instead
    of humans in a lot of customer service roles, inside of the financial institutions,
    and industrial settings.


    For example, you will find that automated decisioning is going to be responsible
    for a lot of things. You will find that the financial industry is going to use
    this kind of automated decisions when it comes to approving loans, and deciding
    whether a customer will be able to be onboard, or identifying corruption and financial
    crime as well. Many organizations are going to benefit from an increase in productivity
    as a result of more automation, meaning that they are able to generate in more
    revenue in the process. This is then going to be able to provide additional money
    in order to spend on more supporting jobs in the service sector.


    With this in place, it is time to learn a few of the different ways that you are
    able to take advantage of AI in the business world. Due to some of the different
    types of jobs that can be impacted with the help of the AI, and it is fundamental
    to address some of the potential pitfalls that come with these technologies. There
    are a few things that we are able to consider when it comes to all of this, including:


    1. Businesses have to be able to overcome some of the bias and trust issues that
    are often going to come with AI by achieving an effective as well as a successful
    implementation that will make it possible for all of the people using the system
    to benefit in the process.

    2. The governments who use this need to ensure that any gains they get from AI
    can be shared widely, or as much as possible, across the whole of society to prevent
    social inequality between those affected and those who unaffected by these developments.
    For example, this could be through increased investments in the training to make
    it happen.

    3. With some of the additional cost savings that happen with implementing the
    AI systems, employers need to also focus on increasing the number of skills that
    their current, and future employees need to have.

    '
