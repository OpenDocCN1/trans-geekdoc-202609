    # Word Encoding and Attention Process


    Each of the words, also known as the 500-dimension vector that will represent
    the word, is going through its first layer. This layer is going to encode the
    word in a 1000-dimension vector that will then represent the word and what it
    means in the context it has compared to the other words in the same sentence.


    Once the system has been able to take each word on its own and encode it into
    these vectors, this same process is going to be done a few times. This process
    ensures that each layer is able to fine tune so that we understand what each word
    means when it is within the full sentence and not just on its own.


    In the matrix that we use for the final output, we are then able to take that
    output and put it into the attention layer. It is also going to use the various
    calculations that were done in order to drop out any of the words that may not
    be used or would be unnecessary, in the target, or second, layer.


    The decoder, or the translation, layer, is then going to be able to translate
    out the word that is selected, or the sentence in most cases, into the target
    language that you choose. The output that comes in this final layer can then be
    sent back over into our attention layer. This is done to make sure that we can
    calculate which word is the next one to translate.


    # Security Surveillance and Artificial Intelligence


    Artificial intelligence is going to start coming to the world of security surveillance,
    for individuals and for various companies. This allows us to use computers and
    machines to analyze the videos that it sees, without needing to have a person
    there to do the work at all. This could be great news when it comes to the safety
    of the public and can help first responders and police to spot accidents and crimes.


    And there are a bunch of industrial and scientific applications. Many companies
    are going to rely on a variety of video surveillance. They may use this to help
    monitor theft and other issues that are going on in the store. And it is a good
    thing to have around for safety of the customers. How many times have you walked
    into a store and saw the security camera without thinking anything about it? We
    have all come to expect that these are there and we are used to them and know
    they are meant to keep people honest and will ensure we are safe.


    With the traditional use of these devices, someone has to actually go through
    the hours of video that is there in order to see when someone is stealing, or
    when someone is endangering those around them. This is often done after the fact
    as well, once the police or others have become involved. Most companies are not
    going to pay someone to just sit there and view the video all of the time, and
    so the work is done after the fact. If there is no suspicion of stealing or any
    danger to the customers, it is likely that hours of taping is just ignored because
