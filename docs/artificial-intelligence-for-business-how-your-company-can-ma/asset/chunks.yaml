    # 第 4 章：AI 及其在零售业中的应用


    既然我们已经花了一些时间探索什么是 AI 以及以及如何使用它，现在是时候看看 AI 在我们可能经营业务的各种行业中将如何运作了。许多不同的行业和企业都能从使用人工智能中获益，本指南已经花了一些时间概述了哪些行业以及它们将如何使用这项技术。但在这一部分，我们将更深入地探讨零售店和企业依赖
    AI 帮助其自身的一些方式。


    我们都必须承认，世界确实发生了变化。自客户必须前往实体店才能购买任何任何产品的时代以来，我们已经走了很远的路。得益于过去 25 年发生的数字革命，如今你可以通过在线商店购买几乎任何你想要的物品。这种影响的程度之深，甚至已经影响了顾客光临实体店的方式。有了所有这些变化，许多零售店在开始在其门店引入一些人工智能以及相关系统时，将获得巨大的收益。


    AI 被认为是整个商业世界现代技术的基石之一，许多公司，无论他们处于哪个行业，都能够从定制化、自动化和推荐引擎的优势中获益，这些功能共同工作以确保业务拥有更多客户。当我们观察零售业务时，这确实如此。在消费者体验方面，AI
    正在开始发挥比以前更重要的角色，因为消费者可以根据自己的兴趣进行购物并找到他们想要使用的正确物品。此外，`VR`（也称为 `virtual reality`）将让想要尝试物品但无需实际穿戴或放置物品的顾客变得更容易。


    许多零售企业现在关注的另一个重点是一种被称为 `RPA` 或机器人流程自动的技术。这对于业务很有帮助，并能客户带来利益，因为它设计旨在将正确的产品推给正确的人。另一个使用的平台被称为
    `WorkFusion`，它帮助公司改进客户的购物体验。正如你所看到的，在 AI 及其相关系统的帮助下，公司有很多机会进行改进并获得更多销售额。


    ## 零售店如何使用 AI 实现更多利润


    ### 浏览在线目录

    我们在零售业中看到的 AI 应用的第一个例子是客户能够浏览在线目录以查看有哪些货源。你曾多少次进入你最喜欢的商店的在线网站查看有哪些货，即使你最初从根就没有打算购买任何东西？通常，所有这些选择让直接在上面购买变得非常方便。


    AI 已经带来了几种更先进的推荐引擎，可以帮助客户找到他们需要的任何物品。这一过程所需的时间仅是旧系统或客户亲自到店转转的时间的一小部分。与其浏览成百上千件物品，消费者可以浏览数字目录，该目录会询问他们关于他们想要的物品的问题，包括尺寸、颜色偏好以及根据所需物品的其他信息。这导致了更高的客户满意度，确保了购买的物品是客户想要的，并在退货和退款时可以为你节省大量的时间和麻烦。


    如果客户正在寻找他们需要的服装，而他们不确定穿在自己身上是否好看，或者是否是他们需要的风格，甚至他们想看看其他类型的服装、配件或鞋子与该物品如何搭配，`virtual
    mirror`（虚拟镜镜）也可以实现这一点。这可以在顾客舒适的家中完成（如果公司提供此类服务且客户拥有镜子），并节省大量时间。对于许多在线服装零售商来说，这是一个很好的选择。很多时候人们想要为大场合购买一件连衣裙、一套西装或其他物品，但他们可能住在大型商店或大镇附近，或者他们只是没有时间从一家店走到另一家店寻找他们想要的东西。


    ### 高级手势识别

    零售领域可用的下一个 AI 特性是高级手势识别的概念。除了能够从上面描述的一些数字目录中获益外，零售商还可以进入并监控新物品或他们针对的特定物品的成功程度。他们可以通过监控顾客在看到和与物品互动时的手势和面部表情，检查购物者对该物品的反应。顾客或购物者对某个物品的反应方式，特别是与另一个物品相比时，将告诉销售助理该物品被认为是冷门产品还是畅销商品。设想一下，当你能够看到购物者实际上对哪些物品感兴趣，并且对于你正在考虑开始推出但不确定是否会火爆的新物品获得客户的真实反馈时，这对你的业务将有多大的帮助。


    除了面部和手势以及随之带来的处外，当零售商能够更多地了解用户如何对特定物品做出反应时，推荐引擎也可以使用这些信息。这些引擎将以更有效的方式运行，根据他们购买的内容、他们似乎搜索的内容以及他们对在
    AI 测试阶段展示的某些不同物品的反应，来寻找正适合每个用户的物品。


    '
