    # 3 METHOD


    This study will utilize a method that is established within creativity research
    [3], and briefly explained in section 1.1. The method is built upon the idea that
    what is ''creative'' is to extract the creativity observed in the design. Amable
    [3] uses this method which employs multiple experts assesses the creativity of
    the work of art. Expert judges, a crowd of studio artists with 5 years of experience
    were used. This study also aims to mimic the study by Amable [3]. The judges used
    in this study were currently employed as music teachers and those who should be
    considered experts within music and the creation of music.


    # 3.1 Participants


    For this study, 51 domain experts were used. As previously mentioned the experts
    were all, or had previously been, employed as music teachers of some form. A majority
    of the participants (71,7%) had been at their current position for at least 10
    years. When asked about total experience working with music, 58.5% stated that
    they had more than 40 years of experience rating music. Every of the 51 participants
    had at least 10 years of experience working with music in some style.


    ![](img/df96f3c5435134787861301a21fed267_2_0.png)


    # 3.2 Implementation


    In order to increase quality, the study was performed to perform quantitative
    analysis using an online questionnaire. The questionnaire contained four different
    types of instrumental samples. Two samples were created by humans and two were
    created by Watson Beat. The judges were asked to rate the creativity of each of
    the four clips individually on a scale of 1-6 (not creative at all, 6=a very high
    level of creativity). No even scaled scale was used in order to avoid some bias
    [7]. In addition to grading the pieces of music, the samples were also provided
    with the ability to explain their rating in free text format. To prevent bias
    in the judges, no background on the creation of the samples were provided. Statistical
    analysis on the gathered data was performed using MATLAB. The entire study were
    carried during spring 2018.


    Figure 2: Distribution of creativity ratings among the different samples.


