    # 4 RESULTS


    The participants were asked to grade each sample individually on a six degree
    scale. During this results sections are referred to as ML1 & ML2 for the two samples
    that were generated by Watson Beats and H1 & H2 for the samples that were compared
    by humans.


    # 2.5 Watson Beat


    Watson Beat [5] is a branch of the IBM [14] project carried out IBM research.
    It is a machine learning algorithm, when trained on music samples, can produce
    unique compositions in response to a suggested engine. Behind the cover, Watson
    Beat consists of a stack of Restricted Boltzmann Machines that reads and outputs
    MIDI files [13].


