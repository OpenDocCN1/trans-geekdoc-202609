    # ABSTRACT


    The concept of creativity is an important part of human society and the continuous
    evolution of artificial society has raised questions about creativity among machines.
    The aim of this study is to explore machine learning algorithms'' ability to be
    creative. This paper presents a survey of music generated by IBM Watson that have
    been evaluated using expert consensus and control samples. The results show that
    one of the machine generated samples showed the same level of creativity as the
    human generated samples. Here, there are indications that machine learning algorithms
    can create music that is hard to distinguish from human created music and can
    be considered creative.


    # CCS CONCEPTS


    +   - Theory of computation — Design and analysis of algorithms; Machine learning;
    Human computing — Interaction techniques.


    # KEYWORDS


    creativity, machine learning, music


