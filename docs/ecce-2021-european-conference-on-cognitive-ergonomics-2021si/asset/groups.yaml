    # 4 RESULTS


    The participants were asked to grade each sample individually on a six degree
    scale. During this results sections are referred to as ML1 & ML2 for the two samples
    that were generated by Watson Beats and H1 & H2 for the samples that were compared
    by humans.


    # 2.5 Watson Beat


    Watson Beat [5] is a branch of the IBM [14] project carried out IBM research.
    It is a machine learning algorithm, when trained on music samples, can produce
    unique compositions in response to a suggested engine. Behind the cover, Watson
    Beat consists of a stack of Restricted Boltzmann Machines that reads and outputs
    MIDI files [13].


    # 4.1 Distribution


    The distribution of creativity ratings has been presented as a box plot (figure
    2). The x-axis of the box plot represents the different samples, labeled as the
    same in the previous section. The y-axis represents the creativity in the interval
    of the central 50% most of the data.


    The plots look very similar for the different samples except for the median on
    a few points. The median of H1 is much lower than the other samples, the creativity
    ranging from 2-5 with a other grade of 6. Further more the 50% box ranges between
    3-4. ML1, ML2 and H2 have ratings from 1-6 while the 50% of H2 differs from ML1
    and ML2 by the ranges between 2.25 and 4.5


    The median of H1 is compared to the other samples that have their median at 3.
    It is worth noting that the y-axis were not possible choices in the questionnaire.
    Those are only for visualization purposes.


    # 3 METHOD


    This study will utilize a method that is established within creativity research
    [3], and briefly explained in section 1.1. The method is built upon the idea that
    what is ''creative'' is to extract the creativity observed in the design. Amable
    [3] uses this method which employs multiple experts assesses the creativity of
    the work of art. Expert judges, a crowd of studio artists with 5 years of experience
    were used. This study also aims to mimic the study by Amable [3]. The judges used
    in this study were currently employed as music teachers and those who should be
    considered experts within music and the creation of music.


    # 3.1 Participants


    For this study, 51 domain experts were used. As previously mentioned the experts
    were all, or had previously been, employed as music teachers of some form. A majority
    of the participants (71,7%) had been at their current position for at least 10
    years. When asked about total experience working with music, 58.5% stated that
    they had more than 40 years of experience rating music. Every of the 51 participants
    had at least 10 years of experience working with music in some style.


    ![](img/df96f3c5435134787861301a21fed267_2_0.png)


    # 3.2 Implementation


    In order to increase quality, the study was performed to perform quantitative
    analysis using an online questionnaire. The questionnaire contained four different
    types of instrumental samples. Two samples were created by humans and two were
    created by Watson Beat. The judges were asked to rate the creativity of each of
