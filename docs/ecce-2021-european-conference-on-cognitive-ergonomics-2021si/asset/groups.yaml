    本研究将利用一种在创造力研究中建立的方法 [3]，并在 1.1 节中简要说明。该方法基于一种观点，即“创造性”在于提取从设计中观察到的创造力。Amable
    [3] 使用了这种方法，通过多位专家评估艺术作品的创造力。评判员是一群具有5年经验的画室艺术家。本研究也旨在模仿 Amable [3] 的研究。本研究使用的评委目前担任音乐教师，且被认为是音乐和音乐创作领域的专家。


    ### 3.1 参与者


    本研究使用了 51 位领域专家。如前所述，这些专家都曾或目前是某种形式的音乐教师。大多数参与者（71.7%）在当前位置工作了至少10年。在被问及音乐工作的总经验时，58.5%
    的人表示他们拥有超过40年的音乐评分经验。51位参与者中的每一个人在某种风格上都至少有10年的音乐工作经验。


