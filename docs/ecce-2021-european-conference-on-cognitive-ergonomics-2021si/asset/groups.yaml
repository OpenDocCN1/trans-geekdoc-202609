    # ABSTRACT


    The concept of creativity is an important part of human society and the continuous
    evolution of artificial society has raised questions about creativity among machines.
    The aim of this study is to explore machine learning algorithms'' ability to be
    creative. This paper presents a survey of music generated by IBM Watson that have
    been evaluated using expert consensus and control samples. The results show that
    one of the machine generated samples showed the same level of creativity as the
    human generated samples. Here, there are indications that machine learning algorithms
    can create music that is hard to distinguish from human created music and can
    be considered creative.


    # CCS CONCEPTS


    +   - Theory of computation — Design and analysis of algorithms; Machine learning;
    Human computing — Interaction techniques.


    # KEYWORDS


    creativity, machine learning, music


    ACM Reference Format:


    Thomas Mejoft, Linus Lagerhjelm, Ulrik Söderström, and Ole Norberg. 2021. Creative
    Capabilities of Machine Learning: Evaluating creativity by algorithms. In European
    Conference on Cognitive Engineering (2021 ECE April 26–29, 2021, Siena, Italy),
    ACM, New York, USA, 4 pages. https://doi.org/10.1145/3452835.3452863


    # INTRODUCTION


    Creativity has been in existence for hundreds of years [15] and throughout history,
    the view on the concept of creativity has both changed and gained a lot. Mostly
    the modern view of creativity, the creation of novel works, were seen as impossible
    by both artists and machines [6]. Over time, this view idea gradually evolved
    into today where there is a consensus that creativity can exist on an individual
    level or, in some words, can be creative. It would seem reasonable to hypothesize
    that it is possible to construct an artificial mind with the same level of creativity
    as it would be desirable.


    Artificial creativity is still highly controversial and some argue that such a
    thing does not exist. For example Boden [4] claims that artificial creativity
    cannot exist at works by machines because lack of ''relevance'' and a capacity
    to refer to mental or cultural aspects that humans have occurred to observe. As
    such critics say creativity is ''human-centric'' and further that creativity is
    a combining of multiple facets of which some are better for critics and vice versa.
    Despite this, the research of the topic is limited. The question of creativity
    will be subject to evaluation in this study.


    # 1.1 Defining creativity


    Creativity may perhaps be the crucial definition in this paper. Unfortunately
    the lately fail to agree on a formal definition in an article in the Annual Review
    of Psychology (2010). However, researchers have listed more than 10 definitions
    of the topic and the lack of consensus is troubling. Hennessy & Abel [10] state,
    that however, most of the experts agree that "creativity involves the development
    of a novel product, idea, or problem solution that is of value to the individual
    and/or the larger social group". Again, various frameworks for defining creativity
    has been proposed to be discarded by others.'
