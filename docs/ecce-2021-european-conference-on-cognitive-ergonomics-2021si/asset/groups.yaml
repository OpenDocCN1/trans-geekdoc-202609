    H1 和 H2。


    ## 2.5 Watson Beat


    Watson Beat [5] 是 IBM 研究实施的 IBM [14] 项目的一个分支。它是一种机器学习算法，在音乐样本上进行训练后，可以根据建议引擎产生独特的曲目。在底层，Watson
    Beat 由一组用于读取和输出 MIDI 文件的受限玻尔兹曼机组成 [13]。


