    # 机器学习的创造能力


    通过算法评估创造力


    Thomas Mejoft

    Umeå University

    数字媒体实验室

    瑞典

    thomas.mejoft@ummu.se


    Linus Lagerhjelm

    Umeå University

    数字媒体实验室

    瑞典

    lila0158@student.ummu.se


    Ulrik Söderström

    Umeå University

    数字媒体实验室

    瑞典

    ulrik.soderstrom@ummu.se


    # 摘要


    创造力概念是人类社会的重要组成部分，而人工智能社会的不断演进引发了关于机器创造力的问题。本研究旨在探索机器学习算法的创造性能力。本文对由 IBM Watson
    生成的音乐进行了调查，这些音乐已通过专家共识和对照样本进行了评估。结果显示，其中一个机器生成的样本表现出的创造力水平与人类生成的样本相同。在此，有迹象表明机器学习算法可以创造出与人类创作的音乐难以区分的，并且可以被认为具有创造力。


    # CCS 概念


    - 计算理论 — 算法的设计与分析；机器学习；人机交互 — 交互技术。


    # 关键词


    创造力，机器学习，音乐


    ACM 格式：


    Thomas Mejoft, Linus Lagerhjelm, Ulrik Söderström, and Ole Norberg. 2021. Creative
    Capabilities of Machine Learning: Evaluating creativity by algorithms. In 欧洲认知工程会议
    (2021 ECE 2021年4月26日–29日, 意大利，西纳), ACM, 纽约, 美国, 4页。https://doi.org/10.1145/3452835.3452863


    # 引言


    创造力已经存在了百年 [15]，在整个历史中，对创造力概念的观点既发生了变化，也增加了许多维度。大多数现代创造力观点——即新作品的创作——被艺术家和机器都认为是不可能的
    [6]。随着时间的推移，这种观点逐渐演变为如今，即人们达成共识，认为创造力可以存在于个体层面，或者换句话说，可以具有创造力。似乎假设构建一个具有人类同等水平创造力的人工智能是合理的。


    人工创造力仍然具有很大争议，一些人认为这种东西并不。例如，Boden [4] 声称人工创造力无法存在于机器的作品中，因为缺乏“相关性”以及对人类偶然观察到的心理或文化方面的参考能力。因此，批评者认为创造力是“以人为中心”的，并且认为创造力是多个维面的结合，其中某些方面对批评者更有利，反之亦然。尽管如此，对该主题的研究仍然非常有限。创造力的问题将在本研究中进行评估。


    ## 1.1 定义创造力


    创造力也许是本文中最关键的定义。遗憾的是，最近在《心理学年评》（2010年）的一篇文章中未能就正式定义达成一致。然而，研究人员已经列出了该主题的10多个定义，共识的缺乏令人困扰。Hennessy
    & Abel [10] 指出，尽管如此，大多数专家都认为“创造力涉及开发一种新颖的产品、想法或问题解决方案，这些对于对个人和/或更大的社会群体具有价值”。同样，各种定义创造力的框架被提出后又其他人抛弃。


    ECCE 2021 - 4月26-29日，意大利，西纳


    T. Mejoft, L. Lagerhjelm, U. Söderström & O. Norway


    尽管如此，仍然存在一种相当确定的方法，用来判断一件作品是否可以被创作。这种方法基于 [10] 的共识评估，让人们根据他们自己对创造力的主观定义来判断一件作品。Amable
    [3] 的综述没有明确定义什么是“爱好者”，但讨论了类似的概念，其被称为“恰当的观察者”。这些观察者被认为是对作品创作的领域熟悉或受人尊重的人 [5]。


    在本研究中，在定义一件作品是否会被创作时，我们将坚定地断言，创造性作品的创造者将被认为是具有创造力的。这样的创造者被称为“创造性主体”。


    ![](img/df96f3c5435134787861301a21fed267_1_0.png)


    图 1：神经网络结构的简单示例。


    ## 1.2 目标


    本研究论文的目标是调查机器学习系统是否根据其创作音乐作品的能力可以被认为是具有创造力的。这旨在作为迈向机器学习和心理学跨学科研究的跳板。


    ## 2 理论


    本节详细介绍了用于支持该立场的理论框架，并对机器学习和神经网络进行了概述。在节中，我们提到了对这种创造性至关重要的特定类型的网络。


    输出层是单个神经元，它产生网络的输出。神经网络由许多不同大小的层组成。神经元的输出连接到输入向量和权重向量。输入 $i$ 和神经元 $j$ 之间的权重对输出有特定影响。神经的输出通常是输出的二值值或实值，代表一个类别或字符。


    ## 2.1 机器学习


    软件开发中存在许多问题，其特征是某些算法是未知的 [2]。我们知道给定数据的期望输出，但缺乏从数据推导出此类答案的能力。这种机器学习通过构建从数据中学习特征并利用它们产生期望输出的程序来实现。这个过程通常被称为深度，输出通常称为学习
    [2]。机器学习有许多方法，适用于广泛的领域。本文将仅关注机器学习的一个方面，即神经网络。


    玻尔兹曼机是一种特殊的神经网络，与前节描述的通用神经网络一样，由原始单元组成 [1]。玻尔兹曼机与双向的区别仅在于连接是位于神经元之间，且只能假定两种状态：开启或关闭（即
    1 和 0）。这些状态是根据连接单元的状态、权重以及部分解释选择的。可以给出一个解释的例子：图像的像素，我们把图像解释为数字吗？


    神经网络的概念非常古老。第一个关于该想法的报告发表于 [1943]。该想法是模拟人类大脑中神经元的工作方式。神经网络是一个由多个阈值单元组成的计算机系统。这些单元对感知输入产生实值
    [16]。这些被称为神经元的单元通常组织成结构，它们被分成更小的组以形成层。层中的所有神经元通过一组连接权重与前层的所有神经元相连。这种示例如图 1 所示，输入层表示网络的输入向量。隐藏层是一组神经元，其输出仅到其他神经元，且能量
    E 最小。这种能量通过不同单元产生了多少解释来表示。


    ## 2.2 受限玻尔兹曼机


    受限玻尔兹曼机具有广义玻尔兹曼机完全相同的属性 [11]，但被限制为使用两层——一个可见层和一个隐藏层。第一步可见层由实际的二值输入向量组成。该输入被用于更新隐藏层中的单元。


