    # I. Introduction


    With the rapid development in China, power system is developing toward marketization.
    To adapt to the quality of life in the modern era, power system has access to
    large-scale renewable energy sources, and it is desirable to be a smart grid which
    is highly integrated with electric power, information flow and flow behavior.
    Research on construction of smart grids are based on existing technologies for
    load management of power system. The load management system is an important supporting
    tool of promoting Demand Side Management (DSM) and achieving optimal load control
    [1]. Accurate load forecasting is not only the basis for safe and economic operation
    and efficient management of power grid, but also an important guarantee to improve
    utilization and economic dispatching of power generation assembly. It is of significant
    importance to optimize the scheduling of power flow and electricity market transactions
    of the unit. Several professors have discussed the most relevant studies on electric
    demand prediction over the last 40 years, and identified the different methods
    as well as features [2]. However, data analysis in various methods, most power
    loads show evident periodic variations. Machine learning is conducive to effective
    analysis and prediction of power loads in time


