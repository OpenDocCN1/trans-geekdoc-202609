    Pre-Series method provides accuracy in a given set. Constructing a histogram based
    on differences of histograms is more creative. The leafwise growth with depth
    replaces the traditional level growth strategy without increasing accuracy, also
    avoids risks of overfitting. It is to increase accuracy by model integration.
