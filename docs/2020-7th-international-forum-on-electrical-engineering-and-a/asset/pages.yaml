    # III. BP neural network


    BP neural network, the learning process of backpropagation algorithm, is composed
    of forward information dissemination and background error. The basic idea of this
    method lies in the gradient descent method to achieve the minimum mean error


    of deviation between practical output value of the network and expected value.


    The neural network is mainly composed of three layers (Fig.2). The first one is
    the input layer, in which neurons receive receive information from input in the
    middle layer, and transmit the information to neurons in the middle layer, the
    second one is the hidden layer, which is the internal processing layer for information
    exchange. The information transmitted from the neurons in the input layer is then
    processed, through one forward propagation of learning. The third is the output
    layer which is responsible for output processing. If the practical output matches
    the expected, it enters the backward propagation stage of error. The error propagates
    through the output layer and input into the hidden layer and input layer by using
    the gradient descent method. Periodic propagation of information and background
    error are the process of adjusting weights of layers during learning and training
    of the neural network. This process continues until the network decreases to the
    acceptable level or until the presetting times of learning.


    BP neural network is relatively mature in network topology and performance. It
    has a prominent advantage of very strong mapping capability and flexible network
    structure. The middle number of layers of the network and the number of neurons
    in different layers can be set randomly according to specific conditions. Performance
    of BP network varies. However, the BP neural network also has some main disadvantages,
    including low learning speed. It generally requires hundreds and thousands of
    iterations to reach convergence for an even result it is easy to get trapped in
    local minimum. Selection of the numbers of layers and neurons lacks sufficient
    theoretical guidance. It has limited ability in network motion.


