    # XGBoost 算法


    XGBoost 是一种优化的分布式梯度提升库，旨在实现高效率和可移植的性能。GBDT（梯度提升树）是一种以回归作为基础学习器、以提升作为框架的算法。通过在每次迭代中贪婪地构造损失函数来构建弱分类器，并将它们的结果加权组合以形成更强的分类器用于预测结果。最后输出最终预测结果。XGBoost
    是 GBDT 的优化，该模型实现了并行计算系统以提高运行速度。通过快速实现泰勒公式的二阶计算来控制目标函数，提高了预测准确性。引入正则项以约束损失函数和整个模型的复杂度。XGBoost
    的目标函数为：


    ```

    $Obj = \sum_{i=1}^{n} (y_i, \hat{y}_i) + \sum_{k=1}^{K} \Omega(f_k)$

    ```


    目标函数由两部分组成：衡量预测分与真实分之间差异的误差函数，$y_i$ 和 $\hat{y}_i$ 是模型的预测值。另一部分是用于定义复杂度的正则项 $\Omega$。$K$
    是回归树的数量，$f_k$ 是第 $k$ 个模型。


    正则项也包含两个部分。$T$ 是叶节点数量，$\gamma$ 表示叶节点计数。$\gamma$ 可以控制叶节点数量，$\lambda$ 可以控制叶节点函数不过度并防止过拟合。目标函数简化为：


    ```

    $T = \sum_{i=1}^{n} l(y_i, f_t(x_i)) + \frac{1}{2}\lambda f_t^2(x_i) + \Omega(f_t)$

    ```


    $g_i$ 指 $l(y_i, f_t(x_i))$ 的一阶导数，$h_i$ 指 $l(y_i, f_t(x_i))$ 的二阶导数。


    XGBoost 模型有很多优点。具体来说，现有的目标函数利用损失函数关于目标函数的二阶导数。当存在大量值样本时，XGBoost 可以实现稀疏性的自动学习。XGBoost
    训练支持并行，并在迭代前实现预排序，在每次迭代中以块结构的形式启动。这种块结构允许目标函数的并行计算。块结构还为并行训练提供了可能。在节点分裂期间，计算每个特征的增益，并通过不同特征的线程选择增益最大的特征进行分裂。块结构还支持设置权重，通过调整权重反映模型的一阶导数和二阶导数。每次迭代后，XGBoost
    提升叶节点的学习率，降低每棵树的权重，并减轻每棵树的影响，为后续学习提供更好的空间。


