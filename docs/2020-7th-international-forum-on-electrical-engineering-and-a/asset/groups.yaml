    # XGBoost algorithm


    XGBoost is an optimized distributed gradient enhancement library and it aims at
    high efficiency, and portable performance. GBDT (gradient boosted tree) is one
    that uses regression as the basic learner and boosting as framework. A weak classifier
    is constructed by making loss function from each iteration greedily, adding results
    of combining them with weights to form a stronger classifier for the forecasting
    results. The final forecasting results are output. XGBoost is the optimization
    of GBDT and this model implements parallel computing system to increase the operation
    speed. Rapidly, quadratic calculation of Taylor''s formula is implemented to control
    the objective, increasing the forecasting accuracy. Regular terms are included
    to constrain the loss function and complexity of the whole model. The objective
    function of XGBoost is:


    ```

    $Obj = \sum_{i=1}^{n} (y_i, \hat{y}_i) + \sum_{k=1}^{K} \Omega(f_k)$

    ```


    The objective function is composed of two parts: the error function which measures
    the difference between the forecasted score and real score. $y_i$ and $\hat{y}_i$
    are the predicted value of the model. The other part is the regular term $\Omega$
    that is used to define complexity. $K$ is the number of regression trees and $f_k$
    is the model of the number $k$.


    regular term also contains two parts. $T$ is the number of leaf nodes and $\gamma$
    denotes count of leaf nodes. $\gamma$ can control the number of leaf nodes and
    $\lambda$ can control the function of leaf nodes not to excessive and prevent
    overfitting. The objective function is simplified as:


    ```

    $T = \sum_{i=1}^{n} l(y_i, f_t(x_i)) + \frac{1}{2}\lambda f_t^2(x_i) + \Omega(f_t)$

    ```


    $g_i$ refers to the first-order derivative of $l(y_i, f_t(x_i))$ and $h_i$ refers
    to the second-order derivative of $l(y_i, f_t(x_i))$.


    XGBoost model has many advantages. Specifically, existing objective function utilizes
    the second-order derivative of the loss function about the desired function. When
    there are many samples of values, XGBoost can make automatic learning of sparsity.
    The XGBoost training supports parallel and pre-ranking is implemented before iteration,
    which is started in each iteration as block structure. This block structure enables
    parallel calculation of the objective. The block structure also provides possibilities
    for parallel of training. During splitting of nodes, gains of each feature are
    calculated and the feature with the largest gain is selected for splitting through
    thread of different features. The block structure also supports to sets of weights,
    which are reflected by the first-order derivative and the second-order derivative
    of the model by adjusting weights. After each iteration, XGBoost boosting the
    learning rates to leaf nodes, decreases weights of each tree, and relieves the
    impacts of each tree, which provides a better space for the follow-up learning.


