    # II. Data


    Intelligent forecasting method mainly includes expert system method, artificial
    neural network method, theoretical and comprehensive prediction model, and so
    on. For example, Zhao et al. developed a multi-level wavelet network method to
    forecast the load of next day. To forecast the load for days as well as the days
    before and after, a correlation coefficient scheme with holiday weighting [11].
    Song et al. proposed an algorithm for short-term traffic flow and electricity
    load forecasting based on echo state network (ESS) [12]. A hybrid neural network
    method for forecasting smart aimed at improving the forecasting accuracy without
    increasing the time cost


    Data used in this study comes from an open source (https://www.kaggle.com). It
    has datasets of. In this study, PJIME hourly which refers to power loads used.
    The daily power data is gained by summing the hourly loads. To ensure the accuracy
    and for the convenience of subsequent data analysis, the data and monthly loads
    were calculated by summing method.


    One issue about Artificial Neural Network (ANN) used in Short-term Load Forecasting
    (STLF) was proposed by Alonsa et al. The adjusted ANN showed temperature and humidity
    were associated with the demand of the electric load [14]. According to comparison,
    we found that machine learning has higher prediction accuracy.


    With observations to although data, data is eliminated and basic monthly trend
    is shown as Observed and Trend in Fig.1). Obviously, monthly power consumption
    fluctuates although. The overall trend in recent years increases firstly and then
    decreases. Power peak was in 2008. After seasonal decomposition of the data, the
    basic trend is shown in Seasonal.1. The annual power consumption fluctuates. Summer
    is always a power consumption peak period and there is a small peak in winter.
    Power consumption in spring and autumn are significantly lower.


