    在本次实验中，选择了 367 个输入和 1 个输出层。隐藏层节点数为 100。XGBoost 算法有三类参数：负责投票的一般参数、用于每个选择器的提升器参数，以及用于任务估计引导的学习任务。超参数控制参数调整的优化；学习率设置为
    0.3（它可以随每一步减小以使模型更深）。如果我们设置为 5，它可以控制复杂度，且这些参数的值限制了过拟合。学习的最大迭代次数（1000）是非常合适的。如果次数太高，则容易避免过拟合。


