    $R(l) = -\sum_{i=1}^{n}(X_{i} - \mu)(X_{i} - \mu)$


    It is used to return polymerization statistical features (variance and mean) of
    different order values of time series. Linear regression after blocking of time
    series data (based on OLS) is used to return attribute value of the linear regression;


    $E_{l} = \Phi^{l}(r) - \Phi^{l+1}(r)$


    It is used to approximate measure unpredictability and fluctuation of time series;


