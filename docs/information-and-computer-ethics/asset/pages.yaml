    the fortune has been described by various researchers, including Deborah Johnson
    (1999) (Figure 3.6).


    # ## 3.9.1. Will Computer Ethics ‘Disappear’ in the Future?


    Johnson recommended that the area of computer ethics may or should disappear in
    the coming future. She assumes that whatever we are considering as issues in computer
    ethics may become well integrated into the “ordinary ethics” issues.


    Johnson has been considered as very cautious while pointing out or indicating
    that the issues or the problems are not going to get mitigated on their own, instead
    they are not even going to get manipulated or posed similar to the of the problems
    or issues related to the ethics belonging to the information along with the communication
    technologies.


    He argued that the computer technology tends to mend or affect the actions performed
    by the human beings in varied ways in which it has never been implemented or executed.
    Nevertheless, in case a novel execution or the application has been established
    within the process of moral thinking, it generally tends to become the potential
    conditions based on the various contexts.


    And, as soon as the various researchers were about to have an assumption regarding
    the computer technology, being one of the major parts of the world that they are
    living in, he presented with the prediction that the ethics or the morality of
    the information and communication technology is most likely to get vanished.


    Then, the major question arouses as if the predictions made by Johnson, worth
    the laud or not. When considered from the vantage point of the cluster of computer
    ethics issues involving privacy, security, property, and free speech, her speculation
    about the future of the field would seem fairly cogent.


    Nevertheless, as computing becomes a part of presumed background condition, privacy
    issues comprising computing would not observe to be significantly distinct in
    nature from the privacy issues in general.'
