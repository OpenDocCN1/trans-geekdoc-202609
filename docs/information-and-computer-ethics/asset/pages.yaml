    Generally, the law of conflict demonstrates as to when the states may legally
    retort to an armed conflict. Another known law of armed conflict is the jus in
    bello which administers the exact use of forces during an armed war. To arrive
    at a decision of whether cyber-attacks should be countered with active defenses,
    jus ad bellum should be referred to by the state, since jus ad bellum defines
    the threshold beyond which cyber-attacks must be'
