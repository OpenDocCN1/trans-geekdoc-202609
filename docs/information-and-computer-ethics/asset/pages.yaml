  md: 'Information Ethics (IE) is defined as a current alternative to the traditional
    ethical theory to account for the moral phenomena. It is the subject of additional
    research to explore how it can be made to tolerate upon the practical issues and
    problems in Information and Communication Technologies (ICTs) and also to validate
    that it has a descriptive and justificatory surplus as related to the traditional
    ethical normative theories. Reconstructed concepts are evolved, for example, contestatory
    democracy, privacy as data protection, justice as fairness, function as high-level
    architectural principles for the design and framework of information systems and
    ICTs applications. The chapter deals with the branches of ethics. Mainly, it describes
    the normative ethical theories. Future projections are also described in the latter
    part of this chapter.


    # 3.1. INTRODUCTION


