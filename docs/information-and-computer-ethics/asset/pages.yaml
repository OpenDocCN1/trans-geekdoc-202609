  md: '# 2.2. THE MORAL CHALLENGES OF INFORMATION TECHNOLOGY


    The transfer from one set of dominant information technologies to the other is
    ethically combative. Socrates survived in the phase of long transition from an
    oral tradition to an advanced IT comprising writing down words as well as information
    and eventually, collecting those writings into scrolls and books.


    Well- acclaimed Socrates was somewhat unsympathetic to writing, and all the scholars
    used to have a claim that they have never written anything which would anyhow
    down them. On a contrast, almost everyone was just aware regarding the argument
    of Socrates in opposition to the writing part, as his student used to neglect
    his teacher and later, wrote them down in the form of a dialogue, which was known
    as “Phaedrus.”


    To the end of this dialogue, Socrates with his friend Phaedrus discusses that
    the “...conditions which make it (writing) proper or improper.” Socrates says
    a tale of an Egyptian God that has been named Theuth who provides the gift of
    writing to a king known as Thamus.


    # 2.2.1. The Fundamental Character of Information Technologies


    In the initial stage of the revolution of IT, Richard Mason had provided with
    the suggestion regarding the upcoming transformations or the changes within the
    information technologies, for instance: their respective parts or the roles in
    the effects of education as well as economy that would be necessitated the process
    of rethinking about the social contract.


    Various researchers got really worried that they would further challenge the privacy,
    accuracy, property, and accessibility (PAPA) and to secure their society, they
    “... should frame a new social contract, one that assures everyone the right to
    complete their own human potential” (Mason, 1986, p. 11).


    The legit theorist Larry Lessig provided them with the warning that the rate at
    which the changes are taking place in IT is so fast that it would be leaving the
    steady as well as the contemplative procedures of policies, related to the law
    and politics, behind, and thus, being an outcome of all these, such technologies
    would certainly become extralegal or lawless.


    This is because of the fact that when a law is written to restrain, few forms
    of the copyright infringement enabled by a specific file-sharing technology, that
    technology has become outdated and users are on to something else'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'that enables even more copyright infringement (Lessig, 1999). Information technologies
    store, communicate, organize, and synthesize the information. For instance, a
    book is a kind of information record, a telephone is utilized to communicate information,
    and the Dewey decimal system categorizes the information.


    Ultimately, the major focus would not be just on how the IT possess an impact
    on the moral institutions but also how it would be leading to certain changes
    or transformations within the respective nature of the moral reasoning.


    Many things have been discussed about the information, being the technology of
    morality as well as how the researchers would be programming those applications
    along with the robots to have an interaction with them, in a manner, which would
    be morally acceptable.


    # 2.2.2. Moral Values in Information Recording


    Power is the control of information, and in the economy of information, it might
    be the eventual form of political power. Today, we are living in a world which
    is full of data and the technology to produce, record, store a huge amount of
    data has rapidly developed.


    Here the primary and moral concern is that when the data is collected, stored,
    and eventually accessed, it is dynamic that this be done in a way that reason
    can be observed as fair and also in the best interests of every party involved.


    Varied social institutions which conventionally used to practice these powers
    are the things viz: the pertaining religious organizations, various institutions,
    officials within the healthcare sector, libraries, several agencies of the government,
    banks as well as the corporations.


    These kinds of entities have easy access to the information that is stored that
    further provides them a fixed amount of power over their constituencies and customers.
    These days every citizen has access to the stored information without the requirement
    of using the conventional mediators of that information and hence a huge individual
    share of the social power.


    The last and the final concern or the cause of worry is that the information technologies,
    which are currently storing their respective data of the user in the ‘cloud,’
    that means the data which has been stored on the device secretively placed from
    the user and thus, are not being possessed or functioned by those users only,
    but then the data is accessible from'
