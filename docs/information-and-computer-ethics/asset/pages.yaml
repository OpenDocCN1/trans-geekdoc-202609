  md: 'Cyberconflict” refers to actions that one state may initiate, purposefully,
    to cause damage to other states. It is important to have a legal structure in
    place within which the states should act so that the principles of humanity are
    upheld. There are various issues in cyberwarfare, and they are addressed in these
    chapters. The ACM code of ethics is a broad framework for IT professional that
    will enable them to discharge the duties with the moral guidelines. There are
    certain tools that can be employed to avoid cyberwarfare. But it is acknowledged
    that active defenses are important since it deters cyber attackers. Principles
    of international law of war should also be applied to cyberwar. The role of the
    UN Charter is also significant to minimize the threat of war, so that wide-spread
    collateral damage can be avoided. Parameters have been laid down on the basis
    of which the impact of the cyberwar can be assessed. With cyberwarfare spreading
    to more and more countries, the role of non-state actors in the cyberwarfare has
    increased, which has its own benefits and drawbacks. There are some legal aspects
    of this as well that needs to be considered. The law of proportionality is crucial
    to cyberwarfare which states that combatants and non-combatants should be clearly
    demarcated. With the internet spreading to more and more countries, hacktivism
    is also gaining ground. The impact of the same deserves consideration.


    # 6.1. INTRODUCTION


    Prima facie, most cyber-attacks can be unambiguously classified as illegal as
    well as immoral. Cyber-attacks also include those attacks that are carried out
    for bragging rights and pleasure. The most common cyber-attacks in the present
    world are the web defacements which are carried out “just for fun” and several
    other computer viruses which are mostly disregarded for their consequences.


    At times it is also for unscrupulous motives like such as system intrusion to
    extract sensitive information, rob bank accounts; denial-of-service attacks intended
    to make network inaccessible to the intended users or extorting money from victims;
    and attacks that compromise and deploy large “botnets” of victim computers to
    send out spam or amplify denial-of-service attacks.


    Ethical issues are vexed in primarily in three areas of cyberconflict. The first
    is cyberwarfare involving actions taken by the state to maintain national security.
    The first is cyberwarfare involving actions taken by the state to maintain national
    security. The first area in which the ethical issues'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'are vexed is the cyber-warfare.


    Cyberwarfare is performed at the state level which is approved by the national
    security. As cyber-warfare security is related to national security, there are
    several queries that are raised with regards to performing these cyber-attacks.
    Those questions include,


    +   - If it is moral for a state to inactive and infiltrate an adversary’s systems
    which have threatened its political and territorial integrity, if yes, to put
    forth the general rules and guideline to be followed to perform those attacks.

    +   - The ways by which both, the electric power and the telecommunications department
    that serve the military functions and the civilian functions of a country be attacked
    by this cyber-warfare.

    +   - Another significant question which was raised are the ways by which a country
    reacts to the cyber-attacks that are performed by another country.

    +   - And if there are any chances that a country will be able to attack a third
    country whose computer networks have been compromised or exploited to facilitate
    the assault?


    The second area where the ethical dilemma is faced involves acts that are carried
    out in the interest of a certain social cause or of a political party. “Hacktivism”
    is the term coined to represent this area of conflict since it signifies the convergence
    of hacking with activism.


    If the attack is planned with the motive of causing significant harm to civilians
    and cause widespread terror, they are termed as “cyberterrorism.” It is a term
    coined to signify the confluence of cyber-attacks with terrorism. Cyberterrorism
    can be unambiguously labeled as heinous and immoral; however, hacktivism raises
    ethical dilemmas. For instance: can a cyber-attack be considered as ethical when
    the hackers take down a website which is mainly used to trade child pornography,
    or a cyber-attack which supports terrorist operations or performing attacks on
    stolen credit card numbers trafficking.


    The ways how a hacktivist who protest against the practices and policies that
    are framed by the government to deface a website or to perform a web “sit-in.”
    The rights of a hacktivist to attack a vulnerable system which aids in disclosing
    the security holes which in turns aims in making the internet more secure.'
