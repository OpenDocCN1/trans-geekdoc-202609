  img_proc: true
- pgno: 173
  md: 'become more prominent. Self-defense analysis is further complicated because
    of competing theories among legal scholars on the interplay between the UN Charter
    and customary international law. Some scholars favor UN Charter. Their argument
    is that Article 51 places a restriction on self-defense since it allows the same
    only to respond against an actual armed act. While others emphasize on customary
    international law.


    Their argument is that the states have every right to be proactive and retaliate
    against impending armed attacks as well. Imminent armed attacks have been deliberated
    later. The important point here is although different philosophies have come up
    with various descriptions of an armed attack, there is a common agreement over
    the fact that once a state is attacked with armed forces by another state, the
    victim states and its allies have the legal authority to use force against the
    perpetrator.


    Methods employed for self-defense must obey the international law. An armed attack
    does not automatically empower the victim state to start unrestricted war against
    the perpetrator. Self-defense should be resorted to only when it is necessary
    and when it cannot be avoided because alternative peaceful methods have been deemed
    ineffective in the prevailing circumstances. Self-defense should be conducted
    in proportion to the armed attack. Self -defense actions should be restricted
    to the amount of force deemed necessary to thwart any advances or to overthrow
    an ongoing attack.


    This principle in no way states that the magnitude and extent of defense should
    be comparable to those of the attack. In self-defense, a state may employ force
    of greater magnitude if it is required to deter the attacker. The chief consideration
    here is to determine the amount of force, to either tackle the present hostile
    situation or to prevent future attacks from happening. The above-mentioned principles
    set out the boundaries within which the responses must confirm.


    The UN Charter lays down the condition that a state may only use force against
    another state when it is compelled to do so to defend itself or under the auspices
    of the Security Council (Article 39). The Charter has been successful in laying
    down a moral principle of a justified reason when a state can attack another state,
    and this has been accepted universally. States are only empowered to safeguard
    themselves from threats of violence or actual aggression.


    They do not have the right to initiate attack without any ground. The use of force
    can be allowed only as a defense mechanism against aggression. The application
    of these moral and legal principles to cyberwarfare is only'
