- pgno: 18
  md: '# PREFACE


    # The aim of the book


    The ethical issues in the ever-expanding world of technology are being noted with
    concern and this book aims at spreading the message of ethical use of the informational
    technology in all its dimensions.


    # Why a “Handbook of Information and Computer Ethics”?


    Digitalization and its sporadic growth in various spheres are perhaps one of the
    biggest boons of the twentieth century. No sphere in life remains untouched by
    this advent. However, as the digital world expands, it brings with it an added
    number of threats which make it incumbent for the users to constantly bear in
    mind the ethical perspectives of the vast amounts of information available. Ethics
    is the cornerstone in the entire workplace and this becomes all the more relevant
    in the digital world. Whereas it is essential to follow the ethical norms whilst
    exploring the digital world, it is becoming the main area of concern when one
    uses or designs information on a digital platform. This book caters for the ethical
    requirements that need to be borne in mind while working on digital technology.


    It is essential for all users of IT to be thoroughly familiar with the concepts
    of information ethics and as to how this knowledge can better arm them while they
    utilize this important source of information in its myriad forms. It is important
    to understand the relationship between ethics and information technology and be
    familiar with the development of computer ethics.


    This book covers the important aspect of moral technology with respect to computer
    ethics along with an understanding of the moral challenges that are paramount
    while developing IT systems and other technologies including a robots and virtual
    games. The normative theories of computer ethics find a detailed discussion in
    the book whereby it deals with the various branches of ethics as also how information
    technology gets affected by globalization.


    The digital world cannot remain immune to the criminal activities of the current
    times. The book takes a look at activities like plagiarism, hacking and cybercrime
    that have become rampant in this field. The international standards lay down to
    deal with the challenges facing the ethical concerns in the development of'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'informational technology form an important part of the book. One man’s morals
    may be another man’s norms. The book brings out the ethical dilemmas faced by
    the designers of information technology.


    Cyber space cannot remain immune from the conflicts of the nations. The book explores
    these and talks about the various existing ACM code of ethics that the IT professionals
    need to follow while designing international codes and software. The requirement
    for a legal framework to ensure that information technology is morally ethically
    correct and binding finds a detailed discussion in the book.


    A large number of autonomous bodies have made a foray into the social media channels
    and have gone on to strengthen their presence. The book delves upon the need for
    these channels to be diligent and follow the ethical codes while dealing with
    the data of their users. The book covers the various challenges faced in implementation
    of the regulations that exist and culminates with providing information on the
    existing malicious software that can pose a challenge to the user. The handbook
    shall be beneficial equally to novices and experts in the field as it guides them
    through the sensitive issue of morals and ethics involved in the optimum and efficient
    use of IT.'
  merge: -1
  img_proc: true
