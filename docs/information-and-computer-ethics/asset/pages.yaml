    In conclusion, it can be said that computer ethics development has multiplied
    exponentially. New researches, new establishments, new newsletters, new research
    centers, study materials, websites, university programs, college degree courses,
    and illustrious professorships have contributed to this growth. As further advancement
    is made in information and computer ethics, additional subjects and topics continue
    to surface.


    Various new topics have emerged in this field of ethics which include robot''s
    ethics, cyborg ethics, “open source movement,” electronic government, global IE,
    IT and genetics, computing for developing countries, computing, and terrorism,
    ethics, and nanotechnology. The above-mentioned sub-fields are only a few among
    the various disciplines that have developed.


    The field of computer ethics is relatively new in comparison to other scholarly
    disciplines. It came into existence in the late 1940s when Norbert Weiner created
    it. The progress made was very slow since Wiener''s perceptions, and intuitions
    were far ahead of his time. Since 1985 information and computer ethics has advanced
    exponentially. America was the torchbearer in this respect followed by Europe
    and then the rest of the world.


    # 1.9. CONCLUSION


    IE has made significant advancement over the years. Other disciplines have also
