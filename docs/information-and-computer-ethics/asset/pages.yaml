  md: '# 6.3.1. Tools to Avoid Cyberwarfare


    The weapons used to tackle cyberwarfare are identical to the ones primarily used
    in criminal attacks everywhere. So, there are DDoS botnets to serve up denial
    of service attacks which can interrupt if not actually take strategic servers
    out of play. DDoS is usually used as a resource in various data crimes in order
    to direct smokescreen for other activities on the network. Social engineering
    and spear phishing attacks are also weaponized to introduce an attacker into the
    system of an adversary. The insider threat is a very important weapon in the cyberwarfare
    armory, and so does having a mole to leak information.


    Cybersecurity issues and challenges can be highlighted better with illustration
    to explain the subject in hand. However, it is not easy in case of state-sponsored
    attacks as the attack cannot be pinpointed to a specific person as explained above.
    There are several other illustrations that could be classified as cyberwarfare
    details and illustrates the kinds of attacks which shall be studied below.


    The most obvious cyberwarfare is the Stuxnet, which was initially discovered in
    2010. The Stuxnet cyberwarfare primarily involved Israel and the United States
    using a sophisticated worm to destroy nuclear centrifuges in Iran, so as to delay
    the progress of its nuclear weapons development program.


    What happened in Russia can be taken as an example. The country has been suspected
    of carrying out numerous state-level cyber-attacks. It is facing the accusation
    of increasing cyber-attacks against Ukraine. Allegedly, it has used BlackEnergy
    attack that caused blackout to 70,000 houses in the country in 2015 and Not Petya
    malware, which was actually designed purely to damage the systems it infected
    but was impersonating a ransomware.


    The most sort after topic which has been on headlines is the North Korea''s nuclear
    posturing and turbulent diplomatic relationship with the US that also includes
    the active participation in cyberspace. According to researches, “the North Korean
    state has been linked to the prolific and dangerous hacking organization codenamed
    HIDDEN COBRA, also known as the Lazarus Group. Both the Sony hack of 2014 and
    the hack of a Bangladeshi bank in 2016 were pinned on these hackers.”


    # 6.3.2. Jus ad Bellum and Cyberconflict


    What is a subject matter of contention is when a state can take steps to'
