    or social causes. Hacktivism may be ethically acceptable in cases like civil disobedience
    where laws and demands of the government are defied but through peaceful means.
    Civil disobedience is a means to raise objection, show dissent and highlight those
    laws policies and practices that are considered immoral or unfair.


    The methods employed for civil disobedience includes demonstrations, barriers,
    trespass, etc. It involves defying law but is not necessarily accompanied by unethical
    actions. All civil disobedience movements cannot be automatically termed as moral
    but, in some cases, it may cross that boundary. For instance, the blocking of
    the entry point of an emergency room in a hospital to raise voice against the
    government’s health care policy.


    We can take the example of the Electronic Disturbance Theater (EDT). EDT promoted
    the application of electronic civil disobedience, mainly through “web sit-ins,”
    which were viewed as virtual forms of physical sit-ins and blockades. Each sit-in
    would choose one or more websites as targets at a particular time and date and
    was updated in the public-forum in advance.


    The activist has to go to a website to join the movement and select a target.
    Flood Net which is a Java applet would get downloaded in their computers so that
    the targeted website will get some traffic. A single participants’ traffic would
    have insignificant impact on the website that is targeted; however, the collective
    traffic of thousands of participants, if they participate, could create havoc
    in the target website.


    EDT had primarily used their web sit-ins to protest against the adverse policies
    of Mexican and U.S. government that had an impact on the Chiapas. Though initially
    EDT was used to express solidarity with the Mexican Zapatistas but later they
    also fought for numerous other causes. This idea also found acceptance among other
    groups like the U.K. based Electro Hippies.


    With web sit-ins gaining popularity, the software tools employed became more sophisticated.
    Some of the software’s used included ones that could be loaded into the target’s
    system in advance and later be operated from participant’s system, software that
    would be activated by active participation of the person involved.


    It is important to determine the legality of hacktivism movements like web sit-ins.
    In this case, Schmitt’s criteria can be used to assess whether a'
