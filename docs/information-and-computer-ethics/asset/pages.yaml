    # ## 1.5. DEVELOPMENT OF COMPUTER ETHICS


    In the 50s and 60s, Norbert Wiener contributed profoundly to the field of IE,
    and this was wider than the more specific field of computer ethics. Wiener’s principles
    and notions about IE id not restricted to computer ethics alone but can also be
    extended to other fields like Agent ethics, Internet ethics, and the ethics of
    nanotechnology, the ethics of bioengineering, even journalism ethics, and library
    ethics.


    In the 1960s and early 1970s, even before Walter Maner came up with the term “computer
    ethics” and offered a definition in the field, progress was made in the exact
    field of computer ethics. For example, Donn Parker, who was a computer scientist
    at SRI International, had started to take notice of the illegal doings of computer
    professionals and began to study them. This was during the mid-1960s. The article
    “Rules of Ethics in Information Processing,” was published by Parker in Communications
    of the ACM. This contained information about cases of computer crimes.


    Parker also supervised the conception of the original Code of Professional Conduct
    for the Association for Computing Machinery (ACM). In 1973,'
