  md: 'ethics, in the United States. The Research Center on Computing & Society was
    founded in 1987 in the Southern Connecticut State University. Soon after this
    the Director collaborated with Walter Maner and organized “the National Conference
    on Computing and Values (NCCV). This was funded by America’s National Science
    Foundation. The aim was to foster cooperation among various professionals like
    computer scientists, philosophers, public leaders, law-makers, entrepreneurs,
    sociologists, psychologists, journalists, and others.


    Another objective was to analyze and make progress in some of the important sub-fields
    of information and computer ethics. These areas included computer privacy, ownership
    of intellectual property, educating about computer ethics and helping persons
    with disabilities. The NCCV which was held in August 1991 witnessed the participation
    of various disciples along with the efforts of Bynum and Maner.


    The NCCV was attended by over four hundred people from all states in America and
    other countries as well. The conference produced monographs, video programs, and
    an extensive bibliography and other computer ethics materials. This was distributed
    amongst several colleges and universities in the following years.


    Various professional ethics advocates came forward which included among others
    Donald Gotterbarn, Keith Miller and Dianne Martin. Professional organizations
    also became involved. These included organizations like Computer Professionals
    for Social Responsibility, the Electronic Frontier Foundation, and the Special
    Interest Group on Computing and Society (SIGCAS) of the ACM. They led projects
    that centered on developing the professional responsibility of computer practitioners.


    Information and computer ethics turned into an integral module of undergraduate
    computer science programs that Computer Sciences Accreditation Board accredited.
    In 1991 I “Computers, Freedom, and Privacy” conferences started to be organized
    annually. In 1992, the ACM also adopted an upgraded version Code of Ethics and
    Professional Conduct.


    In 1995, Europe was also engulfed by the swift advancement made in the field of
    information and computer ethics. Maner joined hands with Simon Rogerson – a lecturer
    in De Montfort University in England. They jointly developed the Centre for Computing
    and Social Responsibility and organized the first computer ethics conference in
    Europe which was called ETHICOMP95. This conference was a huge success and attracted
    attendees from various countries in Europe. This conference was hugely'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'responsible for giving birth to computer ethics scholars in Europe. The ETHCOMP
    traveled to many countries in Europe post-1995. It was held every 18 months and
    even moved to countries beyond Europe. Some of the countries to host this event
    were Poland, Greece, France, Spain, Portugal, China, and Japan. Encouraged by
    this far-reaching response, the Australian scholars John Weckert and Christopher
    Simpson with the backing of Bynum and Rogerson, established the Australian Institute
    of Computer Ethics in 1999. They also organized AICEC99 in Melbourne which was
    the first international computer ethics conference in that part of the globe.
    This has been followed by numerous AICE conferences.


    Simon Rogerson was a prominent person in Europe in the rapid growth of information
    and computer ethics. His achievements include setting up the Centre for Computing
    and Social Responsibility at De Montfort University and co-heading the influential
    ETHICOMP conferences.


    His contribution was also:


    +   - He contributed towards adding computer ethics to De Montfort University’s
    curriculum;

    +   - He also created a graduate program with advanced computer ethics degrees
    which comprised PhDs; and

    +   - Was responsible for co-founding and co-editing two computer ethics journals
    with Ben Fairweather. Those two journals were: The Journal of Information, Communication,
    and Ethics in Society in 2003 and the electronic journal The ETHICOMP Journal
    in 2004.


    Rogerson was also part of the IT Committee of the British Parliament. He went
    on to participate in various computer ethics projects alongside agencies based
    in the European Union.


    During the late 1990s and early 2000s, various computer ethics were developed
    in Europe. Some of the prominent examples of those developments are:


    +   - In the 1990s, Luciano Floridi founded the IE Research Group at Oxford University.

    +   - In 1997, Jeroen van den Hoven created of the Computer Ethics: Philosophical
    Enquiry series of conferences (CEPE). This which was held alternately in America
    and Europe.

    +   - In 1999 Van den Hoven’s developed the journal Ethics and IT.

    +   - In the same year, Rafael Capurro established the ICIE.'
