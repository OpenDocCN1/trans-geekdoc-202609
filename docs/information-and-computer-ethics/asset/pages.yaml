    # 3.8. THE IMPACT OF GLOBALIZATION AND THE INTERNET ON COMPUTER ETHICS


    Due to the influence or the effect of the process of computation in the past recent
    years on the world, as well as due to the process of convergence of the computation
    as well as the technologies related with the communications, which has happened
    in the recent times, the basic facet of the ethics grounded on the information
    as well as the communication technology, might have been apprehended in the form
    of one that is recently being in the condition of the change or the flux.


    Others such as van den Hoven, Johnson, Introna, and Nissenbaum (1999) have utilized
    the expression “Information and Communications Technology Ethics” or ICT Ethics
    to try to abduct the conjunction of communications-related and information-related
    ethical issues in a global context.


    To date, there is no clear agreement on what new label should be used to describe
    the field; nor, for that matter, is there agreement that a new label is needed.


    Recently, few authors have started using the expressions such as ‘Internet Ethics’
    and ‘Cyber Ethics’ in ways that might be construed by some to infer that the Internet
    has created modern ethical issues and that perhaps a distinct field of study devoted
    to ethical issues concerning this relatively new medium is required.


    Clearly, the Internet has perpetuated and, in certain cases, exacerbated many
    of the ethical issues associated with the use of earlier computing technologies.


    Though Nissenbaum properly specified the limitations of normative theories of
    privacy in context of protecting the privacy in public, few might conclude from
    Nissenbaum’s analysis that the internet, being a “public'
