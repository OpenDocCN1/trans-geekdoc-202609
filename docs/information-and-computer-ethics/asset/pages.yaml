  md: 'Computer security is a topic of concern in the field of computer ethics. Everybody
    is living in the era of computer viruses and international spying by hackers.
    The problem is not only with the physical security of the hardware like protecting
    it from theft, fire, flood, etc. but also with the logical security like privacy
    and confidentially. Malicious kinds of software, or “programmed threats,” provide
    a significant challenge to computer security. Computer crimes, such as embezzlement
    or planting of logic bombs, are normally committed by trusted personnel who have
    permission to use the computer system. Computer security, therefore, must also
    be concerned with the actions of trusted computer users. Computer professionals
    are ready for the challenges that are coming in the form of new technology. One
    of the more controversial areas of computer ethics concerns the intellectual property
    rights connected with software ownership.


    # 8.1. INTRODUCTION


