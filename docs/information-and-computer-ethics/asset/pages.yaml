    # 3.3.1. Deontological Theory


    The terminology of deontology has been generated out of the Greek Deon, which
    means the responsibility or the compulsions, essentiality as well as with the
    process of binding. In general, such words, when get translated, turn out be as
    a duty, so the various theories that are grounded on the deontology try to establish
    what one’s moral duties are. Once these moral duties have been enumerated, those
    duties are the foundation of moral ‘rules.’


    Deontological systems emphasize that the primary focus should be on confirming
    to duties and rules because that is where the moral worth of an action lies. Evaluating
    the consequences of the action is secondary.


    Kant would have argued that for an action to be considered as moral, extrinsic
    reasons, such as personal gains, should be neglected and the action should be
    done solely as an obedience to a rule. In his example, Kant explains, a grocer
    cannot be called as kind, if he is good to his customer, just to earn their loyalty.


    If he does consider being kind, his moral duty, any moral goodness of his action
    is negated. The grocer should not have an ulterior motive and should be kind because
    of its intrinsic goodness. It can be deduced that ethics based'
