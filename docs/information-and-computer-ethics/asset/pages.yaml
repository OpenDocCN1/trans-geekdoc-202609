    a decent human life. Wiener supported the view that “variety and possibility belong
    to the very structure of the human organism,” hence he could welcome the existence
    of a broad diversity of cultures in the world to maximize the possibility of choice
    and creative action.


    According to Weiner, a society should support an enabling environment where a
