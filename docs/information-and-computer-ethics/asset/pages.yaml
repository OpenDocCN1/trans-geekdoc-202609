    # ## 3.3.2. Consequential Theory


    According to the Consequentialist theories of ethics, consequence of an action
    should be the basis to judge the moral worth of an action. Thus, in case of an
    action, being good or bad is generally the one, which helps in generating the
    great conclusions in totality, within the specified condition.


    There are, therefore situations where a consequentialist would be prepared to
    lie if that was thought necessary to bring about the best consequence(s).


    The theory that is grounded on the repercussions and that too well-known, is Utilitarianism
    has been acknowledged as the great instance of the act-consequentialism, wherein
    all the correct actions have been considered as those, which helps in maximizing
    the pleasure of the perceptive beings, which means that all the individuals who
    can reason, feel, think as well as possess an experience.


    In comparison to this, the theories which are based on the deontology usually
    tend to possess their major concentration on the essential or important value
    belonging to the rule itself, within the ethics belonging to the consequences,
    the major focus is on the basic importance of such repercussions of the provided
    rule. No act can be categorically termed as right or wrong.


