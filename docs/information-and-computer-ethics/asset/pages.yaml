- pgno: 21
  md: 'Information ethics (IE) is that branch of ethics which outlines the connection
    between the collection, organization, and use of information with the ethical
    standards and moral codes that govern the conduct of an individual in the society.
    The chapter talks about information as a resource ethic with respect to the product
    ethics of information sector. It also highlights the development of computer ethics
    which has now become essential for every individual to understand. Professional
    computer ethics have also been discussed in this chapter, which would help readers
    to understand the importance of being ethical in the professional world.


    # 1.1. INTRODUCTION


    In common parlance and professional context, all written works on ethics present
    an incomprehensible range of insinuations and implications. Ethics and morals
    are two terms that are often used in place of each other. This is because the
    distinction between them is ambiguous. Morality describes customs, ideals, and
    principles, that define and bring about a change in the society and guides an
    individual or community to differentiate right from wrong. The language of ethics
    is how we translate these values and principles in our conversations.


    Aristotle was the forerunner in establishing ethics as an indispensable aspect
    of morality. He founded ethics as an academic discipline. Rafael Capurro, the
    head of International Center for Information Ethics (ICIE), is of the opinion:


    > “As self-referential process ethics is an unending quest on explicit and implicit
    use of the moral code that is to say of respect or disrespect, with regard to
    individual and social communication. In other words, ethics observes the ways
    we communicate with each other as moral persons and the ways this moral identity
    is understood. There is, indeed, no unbiased, ethical observer.”


    Information and communication technologies (ICTs) have overwhelmingly altered
    many facets of life, including the nature of entertainment, work, communication,
    education, health care, manufacturing, business, social relations, and conflict.
    ICTs have had, and continue to have, unfathomable, and profound impact on our
    moral lives and on present-day ethical debates (Floridi, 2006). A fundamental
    change can be seen, over the last decade, in the dissertation of experts in the
    field of information science.'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'The point of focus has shifted from a primary concern with technique (which
    includes topics like acquisitions and moving through cataloging and conservation
    to user education and beyond), towards other diverse issues in which the ethical
    dimension is more dominating (intellectual property, user privacy, and serving
    the socially excluded)


    The last decade has witnessed a rudimentary change, in the desertions of specialists,
    in the field of information science. The focus of this chapter has shifted from
    a predominant concern with technique to an engagement with a range of issues in
    which there is an ethical dilemma involved. By techniques, we mean topics like
    acquisition, cataloging, and conserving to user education and much more than that.
    The range of issues that is the primary concern are intellectual property, user
    privacy, and catering to all strata of the society.


    Only a critical examination of information science literature will reveal if this
    suggestion holds true or not. The evaluation would be a challenging task given
    that the majority of the professional conversations, be it written, spoken or
    electronic, is very technical and is not expected to change in the near future.
    The literature of theory still sets out to discuss information as a scientific
    phenomenon, rather than a product of moral action.


    It is vital to analyses implicit values from different perspectives and standpoints
    before formulating and executing information policies. Capurro reiterates “As
    a self-referential process ethics is an unending quest on explicit and implicit
    use of the moral code that is to say of respect or disrespect, with regard to
    individual and social communication. There is, indeed, no unbiased, ethical observer.”


    Berghtol worked on an ethical warrant and stressed on how crucial it is to understand
    the context. She discussed about “cultural hospitality” which forms the basis
    for the ethical knowledge of organization systems. Cultural hospitality also aids
    in representing new organization systems and update the existing knowledge systems
    and the various ethnicities to which the individuals belong.


    It was during the Second World War that IE got recognition in the academics. This
    academic field was not planned but was born inadvertently. Norbert Wiener, a philosopher,
    and a scientist, were working in collaboration on some cutting-edge technologies
    including the invention of digital computers and radar. They were also working
    on a novel antiaircraft cannon with the following features:


    +   * The aircraft could detect the presence of an airplane;'
  merge: -1
  img_proc: true
- pgno: 23
  md: '+   - It could collect are necessary data about the airplane like its speed

    +   and flight path;

    +   - It could envisage what position the airplane would in a few

    +   seconds;

    +   - It could estimate the target and calculate where to fire;

    +   - It could have decision-making skills.


    The actions were to take place almost immediately and that too without

    human involvement. Wiener had extraordinary insight and foresight. He

    had the foresight to realize that the new inventions in the field of science

    and technology that he and his colleagues were working on would have

    “enormous potential for good and for evil.”


    Wiener prophesied that the post-war period would be characterized by a

    significant presence of information technology (IT) in every aspect of life.

    The change would be as profound as the post-Industrial Revolution era in the

    nineteenth and early twentieth century. Wiener also foretold that new moral

    conflicts and opportunities would arise as a result of the second industrial

    revolution. This could be termed as the “automatic age.”


    In the current age, “IE” has been interpreted by different researchers

    working in fields like business ethics, information science, computer science,

    medical ethics, social epistemology and computer ethics in various ways.

    This Babel was inevitable considering that this is a new field and information

    is diverse in nature. The detailed scope and nature of IE have, unfortunately,

    caused some confusion. This situation could quickly be resolved with the

    help of a unified approach that can help to explain and relate the main senses

    in which IE has been discussed.


    # 1.2. INFORMATION AS A RESOURCE ETHIC


    IE was a broad term, in the 1980s, to discuss issues pertaining to information

    (or data) confidentiality, reliability, quality, and usage.


    Information Society is a social order where economic and cultural

    activities are mostly comprised of creation, distribution, and manipulation

    of information. The emergence of information societies can be attributed

    to the advancement in the field of ICTs. The advent of information society

    has been characterized by fundamental moral challenges. The intricacies of

    these challenges are multiplying exponentially.'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'The most urgent need of the hour is to have an IE structure in place that can
    bring infosphere into existence. Infosphere is an environment which is populated
    by information, knowledge, and data as well as their related lifecycle activities
    like conception, distribution, security, storage, and obliteration after their
    intended use, etc. Mankind is expected to thrive in this new environment.


    The purpose of having IE is to identify and resolve technical complexities that
    may arise in this new environment.


    This field is new, and the problem it poses is also compelling. Also, the concept
    of information and its related phenomena are multifaceted.


    The Earth is a dynamic planet, and it has undergone different stages of expansion,
    diminution, and globalization ever since it came into existence. This present
    era of globalization is apparently here to stay because it has been accompanied
    by phenomenal changes in transportation and communication all over the globe (Brandt
    and Henning, 2002).


    The most notable feature of this era is the rapid movement of bytes and atoms.
    This movement has been inexpensive, dependable, constant, and universal since
    the last decade. This has resulted in short turnaround times for economic transactions,
    financial exchanges, social relations, movement of information and so on. The
    omnipresence of information has shrunk physical environment and human life.


    # 1.2.1. Resource Perspective


    From a “resource” perspective, the moral machine needs abundant information to
    function accurately. TO consider information solely as a resource restricts the
    scope of its analysis. It is essential to exercise caution so that all ethical
    disclosure is not reduced to the nuances of higher quantity, quality, and intelligibility
    of informational resources. It cannot always be claimed more is better. Removal
    of information (sometimes obvious and conscious) can often make a substantial
    difference.


    Whether the (quantitative and qualitative) presence or the (total) absence of
    information-as-a-resource is in question, it is obvious that there is a perfectly
    reasonable sense in which IE may be described as the study of the moral issues
    arising from “the triple-A” of informational resources. The triple-A are:


    +   - Availability: Presence of information;

    +   - Accuracy: Correctness of information; and'
  merge: -1
  img_proc: true
- pgno: 25
  md: '+   • Accessibility: Convenience in obtaining information.


    The study of IE has to be independent of its physical support and format. IE from
    resource perspective has to address other issues as well like the ‘digital divide,’
    the challenge of information glut and evaluating whether a source of information
    is authentic and can be relied on.


    # 1.2.2. The Product Ethics of Information Sector


    IE is based on the premise that information may be considered as a product. Ethics
    encompasses moral issues that surface in the context of legislation misinformation,
    accountability, propaganda, advertising, plagiarism, testimony, and liability
    among others and more generally of pragmatic rules of communication à la Grice.
    Kant''s analysis of the immorality of lying is one of the best-known case studies
    in the philosophical literature concerning this kind of IE.


    A classic example of how improper management of information can have disastrous
    results can be understood by studying the case of Trojan War where Laocoon and
    Cassandra were not successful in ensuring that the Trojans exercised proper caution
    against the Greeks.


    “What is right?” and “What is wrong?” has been a pressing question for human beings
    for centuries. In their everyday life, differentiating right from wrong has been
    challenging for almost every man and woman. The outcome of this has been endless
    debates, conflict of opinions, deliberations, and arguments. These discussions
    have only intensified with the passage of time. The birth of “Information Society”
    and extraordinary progress in Information and Communications Technologies (ICTs),
    has added a new chapter in the on-going debate on what is right and what is wrong.


    Information professionals now have a huge responsibility to differentiate right
    from wrong and also determine what is ethical and what is not. It is extremely
    challenging to determine if an action is ethical or unethical. Informational professionals
    are burdened with this responsibility, and they are now trying to come up with
    solutions in numerous ways.


    Information has now proliferated in all branches of information. The widespread
    use of ICT tools and techniques have raised very pertinent points about security,
    accessibility, right to express, privacy, and other related questions. As a result
    of this, it is of vital importance for information professionals to resolve all
    issues related to the ethical use of information and determine new ways to assist
    their clients in a fair and ethical manner.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# # 1.3. RELATIONSHIP BETWEEN ETHICS AND INFORMATION ETHICS


    Ethics often referred to as moral philosophy, is that division of philosophy that
    is concerned with systematizing, defending, and providing guidance on ethical
    and unethical conduct. Moral behavior merits doing the right things and taking
    the right action, irrespective of the situation. However, it is very difficult
    to decide on what is the right thing to do and what is wrong. Ethics is concerned
    with providing reasonable justification for our decisions. It evaluates if an
    action is moral or immoral.


    The role of information in routine decision-making and the advancement of our
    society is significant. The absence of precise and timely information will make
    it very challenging to make the right choices and decide the course of action.
    Ethics facilitates in the establishment of a code of conduct that can be applied
    in particular situations. Ethical principles also aid in setting up standards
    that can guide information professionals.


