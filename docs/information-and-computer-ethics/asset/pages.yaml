- pgno: 29
  md: 'There is a vast scope to prosper in an enormous number of ways in various fields
    like being a teacher, nurse, engineer, doctor, accountant, scientist singer, trader,
    entrepreneur, politician, leader, and so on. This way, it is possible to lead
    a flourishing human life.


    Weiner was of the opinion that that human life should be based on the values and
    impartiality. This led to the “great principles of justice” which according to
    Weiner should be the basis for forming a society. Weiner strongly believed that
    these principles would enable humans to thrive through various flexible actions.
    Weiner’s great principles can be referred to as “The Principle of Freedom,” “The
    Principle of Equality,” and “The Principle of Benevolence.” Weiner did not coin
    the names for his principles; he only stated them. The following list of principles
    can be derived from his work (Figure 1.1).


    +   - **The Principle of Freedom:** In order to establish justice, “the liberty
    of each human being to develop in his freedom the full measure of the human possibilities
    embodied in him.”

    +   - **The Principle of Equality:** Justice necessitates “the equality by which
    what is just for A and B remains just when the positions of A and B are interchanged.”

    +   - **The principle of Benevolence:** Justice entails “a goodwill between man
    and man that knows no limits short of those of humanity itself.”


    ![](img/a00d6ed3d12a9b9b64caf26273cded0e_29_0.png)


    **Figure 1.1:** Wiener’s three great principles of justice in the field of information
    ethics.'
