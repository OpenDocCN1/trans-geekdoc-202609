  md: '# ## 6.2. CODES OF ETHICS


    The study on the code of ethics provides a broader social consciousness of “Cause
    No Harm” and improves the quality of work which in turn reduces the dangerous
    outcomes. The code of ethics can be studied in detail under two categories, they
    are;


    +   - Association for Computing Machinery (ACM); and

    +   - Institute of Electrical and Electronics Engineers (IEEE).


    > According to Landau in 2008, “An ACM member shall consider the health, privacy,
    and general welfare of the public in the performance of the members work. An ACM
    member, when dealing with data concerning individuals, shall always consider the
    issue of individual privacy and seek the following: to minimize the data collection;
    to limit authorized access to data; To provide proper security for the data; to
    determine the required retention period of the data; to ensure proper disposal
    of the data.”


    The Institute for Certification of IT Professionals (ICCP) has a code of ethics
    IT professional have to adhere to. The code underlines the importance of possessing
    high standards of skill and knowledge, necessitates the maintenance of confidentiality,
    and that the IT professional will recognize the public reliance upon the standards
    of conduct and established practices.


    The code of ethics which the members of the Association of IT Professionals (AITP)
    are required to follow are:


    +   - To promote management''s understanding of information processing;

    +   - To refrain from dishonest practices and act with dignity;

    +   - Contribute to the best of their capacity in sharing IT knowledge;

    +   - To maintain confidentiality;

    +   - Base actions on ethical and moral principles that they have acquired in
    educational institutions;

    +   - Be faithful to their employers and safeguard their interests; and

    +   - To value their countries and the way of life of those countries.


    The above seven values are the key concepts of the code of ethics that consist
    of justice, utility, respect for individuals, consistency, autonomy for all, integrity,
    and competence.'
