    # 7.1. INTRODUCTION, OR HOW TO DO ETHICS OF IT NOW?


    The major aspect is to understand the technologies that are made by using a group
    of choices that are evolved from certain strategies that are constantly improved
    for successful execution which will result in a new technology. The different
    aspects that are considered in terms of technology that need to be considered
    are the different algorithms, codes, different topologies, different monitoring
    systems, and various aspects that are related to the autonomous technologies along
    with the different policies and governing bodies that are used in terms of the
    different autonomous technologies.


    The current world is completely global with networks and relationships being the
    vital aspect, which is based on a set of algorithms that decide the distance that
    messages need to travel to reach into networks. This distance is suggested based
    on the search history and preferences by filtering the different data according
    to several prerequisites. Digital technology decides the type of communication-based
    on rational thought process and visualization.


    Eminent people like Eli Pariser in the year 2011 and other people like Epstein
    and Robertson have provided various descriptions in terms of these technologies
    by explaining several concepts such as Search Engine Manipulation effects (2015)
    with several examples. The technology that is being used is thus not neutral,
    as this technology is widely influenced by the different opinions that are present
    across the world and the different theories that are existing regarding the different
    autonomous technologies that are influenced by the behavior and thinking of different
    users.'
