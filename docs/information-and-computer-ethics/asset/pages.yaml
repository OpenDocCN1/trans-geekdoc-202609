    # 6.5 USE OF FORCE AND CYBERATTACK


    Cyber-attacks around the world are not identical. The impact of cyber-attack that
    cause electricity blackout for one hour is less severe when compared to one that
    causes planes to crash by scrambling air traffic signals Thus there is a necessity
    to have a framework for assessing a particular attack or class of attacks to conclude
    whether the use of armed force is justified.


    In 1999, Michael Schmitt, professor of international law and Director of the Program
    in Advanced Security Studies at the George G. Marshall European Center for Security
    Studies in Germany offered seven principles which differentiated the operations
    which use the forces from diplomatic, economic, and other soft measures.


    The high end resembling the use of force and the low end resembling soft measures
    are the key spectrum of consequences when those seven criteria are segregated
    into one criterion. The description of seven criteria is based on the work of
    both the authors of international law conflict, Thomas Wingfield and Schmitt.


    +   • **Severity:** It refers to the damage to life and property. It denotes that
    wide-spread calamity, loss of life and damage to property is caused due to armed
    attacks, but soft measures do not have such consequences.


    +   • **Immediacy:** It refers to the time that it takes for the effect of the
    attacks to be felt. Generally, it is seen that the effects of use of armed forces
    are immediate, often within seconds or minutes, while in case of softer measures,
    like imposing bans, the consequences are felt much later, often after weeks or
    months.


    +   • **Directness:** The association between an operation and the effects of
    operation is known as directness. Generally, the effects for an armed attack are
    caused by and attributable to the application'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'of force, whereas for softer measures there could be multiple explanations.


    +   • **Invasiveness:** Those armed attacks which comprises of physical cross
    borders into the target country is known as invasiveness. Concurrently, softer
    measures are implemented from within the borders of a sponsoring country.


    +   • **Measurability:** This refers to the ability to quantify the effects of
    an operation. The basis is that the impact of armed attacks can be more readily
    measured like the number of deaths, the value of impairment to wealth, etc. than
    softer measures, for example, trade restrictions.


    +   • **Presumptive Legitimacy:** Presumptive legitimacy is the validation of
    an operation to be genuine in the global community. Whereas the use of armed force
    is generally unlawful absent some justifiable reason such as self-defense, the
    use of soft measures is generally lawful absent some prohibition.


    +   • **Responsibility:** Responsibility refers to the degree to which the consequence
    of an action can be attributed to a state as opposed to other actors. In case
    of use of armed force, the state can be directly held responsible as it is the
    exclusive province of the state hence can be attributed directly to it, whereas
    non-state actors are capable of getting themselves involved in such soft activity
    as propaganda and boycotts.


    Let us consider an example to understand how these criteria would apply to a cyber-attack.
    A cyberintrusion on air traffic control has resulted in two large aircraft to
    enter the same airspace and collide. The effects of crash have been devastating
    leading to the loss of 500 lives on board of these two aircraft.


    Responsibility comes out moderate to high. In theory, the crime could be committed
    by anyone. But most hackers would not have the required skill and information.
    Only a state could possess such resources. In summary, five criteria such as immediacy,
    directness, presumptive, measurability, and legitimacy are ranked high, whereas
    two criteria such as responsibility and invasiveness are ranked at least moderate.
    Thus, apparently, the attack is not a soft measure or a legitimate form of coercion
    but a more severe application of force (Figure 6.3).'
