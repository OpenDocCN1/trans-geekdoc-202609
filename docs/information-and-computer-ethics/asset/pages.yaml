    # ## 4.2.2. The Meta-Ethical Thesis


    There are acts in computer ethics that cannot adequately be characterized by the
    traditional concepts of obligatory, permissible, good, and supererogatory. The
    meta-ethical thesis, then, makes the very strong claim that the very meta- ethical
    foundation for general and applied ethical thinking is inadequate.


    On the other hand, the researchers may contend that the theories regarding ethics
    that are present currently may prove to be enough to find solutions to the problems
    concerning certain areas of applied ethics, but turn inadequate to find solutions
    to the issues engaging the use of computers. Hence, IE is different in certain
    ways.


    # ## 4.2.3. The Normative Thesis


    Computer technologies lay down ethical issues that cannot, as a neutral matter,
    be sufficiently determined by choice of current ethical theories. The normative
    thesis, hence, puts forward a claim regarding the impartial reporting of the current
    set of first-principles – and not regarding the aptitude to apply those principles.


    In particular, it states that not even a flawlessly smart viewer could properly
    gauge certain ethical matters merely by recourse to current first- principles
    since those ideologies do not completely cover those acts. Third, a person might
    contend that certain kinds of perceptions valuable in other parts of applied ethics
    are of partial value in the setting of computer ethics.


    # ## 4.2.4. The Epistemological Thesis


    The digital technologies put forward the kind of ethical issues that keep those
    analogies away that make it easy for the people to see the manner in which the
    theories concerning ethics and its primary principles, have an application in
    the other fields that concern the subject of applied ethics. The epistemological
    thesis, then, asserts no more than that the techniques that frequently help us
    in seeing how existing normative materials apply to specific problems are inadequate
    to help us with problems in computer ethics.'
