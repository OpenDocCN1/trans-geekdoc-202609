    # 1.4. NORBERT WIENER’S FOUNDATION OF INFORMATION ETHICS


    In 1950, Wiener wrote a book on the probable effects of information technologies.
    It was called ‘The Human Use of Human Beings,’ and it covered fundamental human
    values like wealth, health, contentment, liberty, opportunities, and capabilities.
    The book is relevant even today. This decade can be called the “Internet Age”
    and is characterized by the perennial search for “global IE.”


    The notions and measures suggested by Wiener can be used to recognize, evaluate,
    and find a solution to all social and ethical dilemmas that have arisen with the
    emergence of information technologies. These technologies encompass all mediums
    of information like computer, laptops, television, mobiles, books, and libraries,
    media, and journalism.


    “IE is a very appropriate name for this branch of study founded by Wiener since
    his philosophy can be applied in all types of information technologies. Computer
    ethics has emerged from the field of IE that was founded by Wiener. Wiener evaluated
    many issues in his works many years ago that are pertinent even in the present
    era (see Wiener 1948, 1950; 1954, 1964):


    > “Computers and unemployment, computers, and security, computers, and learning,
    computers for persons with disabilities, computers, and religion, information
    networks and globalization, virtual communities, teleworking, the responsibilities
    of computer professionals, the merging of human bodies and machines, ‘agent’ ethics,
    artificial intelligence (AI), and a number of other issues” (see Bynum, 2000,
    2004, 2005, 2006).


    Wiener’s work on IE was based on the branch of science referred to as Cybernetics.
    Cybernetics is concerned with the way human brains and electronic machines work
    and invent machines that can function like the human brain. Wiener identified
    “great principles of justice” that all civilizations should adhere to. He formulated
    a feasible approach to evaluate IE issues and find a solution for the same as
    and when they occur. Weiner did not intend to establish a new branch. Rather IE
    was founded incidentally as a branch of academic research.'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'The field simply emerged from the many ethical remarks and examples that he
    included in his writings on cybernetics. The term “cybernetics” was derived from
    the Greek word for the pilot of a ship. Wiener came up with this term for this
    new branch of science. However, the terms like “IE” and “computer ethics” which
    subsequently arose from his research.


    Although he had published his book, The Human Use of Human Being in 1950, that
    dealt with the moral and social consequences of cybernetics and electronic computers,
    Wiener did not call his work an offshoot of applied ethics Neither did he did
    not describe what he was doing as the creation of a new branch of applied ethics
    nor did he give an explanation on the purpose of his work.


    To understand Wiener’s foundation for IE, therefore, we must observe what he does
    in his works, rather than look for metaphilosophically explanations about his
    intentions. Wiener’s work on human nature focused on the physical anatomy of man
    and the power of human physiology in facilitating creative actions and opportunities
    for learning. He provided clarifications about this potential by comparing the
    physiology of humans and less evolved organisms:


    > "Cybernetics takes the view that the structure of the machine or of the organism
    is an index of the performance that may be expected from it. The fact that the
    mechanical rigidity of the insect is such as to limit its intelligence while the
    mechanical fluidity of the human being provides for his almost indefinite intellectual
    expansion is highly relevant to the point of view of this book. Man’s advantage
    over the rest of nature is that he has the physiological and hence the intellectual
    equipment to adapt himself to radical changes in his environment. The human species
    is strong only insofar as it takes advantage of the innate, adaptive, learning
    faculties that its physiological structure makes possible.” (Wiener, 1954, pp.
    57–58, italics in the original).


    # 1.4.1. Wiener and His Account of a Good Life


    According to Wiener, human beings are very intelligent and should exercise their
    decision-making power to control their own lives and live well. They must have
    the liberty to engage in innovative and malleable actions, and this should result
    in maximizing their full potential. This should be the objective of human lives.
    It is obvious that one person’s accomplishment will vary from any other individual’s
    accomplishments. This is because different human beings will have different levels
    of ability and aptitude.'
