  md: 'The data transmissions that happen on the homepage use a widely known method
    to encrypt the data in order to secure it, which is called Secure Sockets Layer
    (SSL). This kind of encryption is easy to be traced back to its source of the
    web page that begins with “https:” instead of the previously and commonly used
    “http.” There is one more indication that informs about the use of SSL, in which
    there can be seen a gold lock on the status bar of the Web Browser.


    Another indication is the golden outline that forms around the lock of the Security
    toolbar button. The most widely known methods to encrypt the important files and
    messages on the email are DES (Data Encryption Standard), RSA (Rivest Shamir and
    Adleman), and PGP (Pretty Good Privacy).


    Each employee has a key method to encrypt data, which is required the use of two
    keys, a public, and a private key. The sender encrypts the email using the receiver’s
    public key to encrypt an email message, which is widely known and can be obtained
    from an Internet public-key server or company. The email message is then sent
    in a locked, unreadable format.


    In such a case the one who is receiving the message makes use of the key that
    they hold in private and which is a secret one, only used to decode the message.
    Some time ago, new Advanced Encryption Standard (AES) is a kind of security feature
    taken into consideration by the government of the United States. An encryption
    technique known as Rijndael is created by two coders from Belgium and is made
    in such a way that it proves to be a much safer option than the one that was being
    used earlier and can be operated on more than one hardware platform and in association
    with different software.


    This method of coding makes use of very little memory and makes for the defensive
    mechanism against various kinds of attacks in the digital world. This kind of
    technique is quite significant, and it even grows more when the data goes through
    the systems that are shared or the networks that lack basic security features
    so as to provoke people to breach into the data networks illegally. In such cases
    the data which is in the category of being sensitive needs to be encrypted. One
    more kind of technique for encryption is known as “Digital ID.”


    Email is the method of exchanging messages between people using computers or electronic
    devices and people use this source to share some important information which can
    be confidential and important to another user and ensure that messages sent cannot
    be stopped and read by anyone other than the future receiver.'
  merge: -1
  img_proc: true
- pgno: 237
