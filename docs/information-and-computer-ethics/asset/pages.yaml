    our ‘choice architectures’ (Thaler and Sunstein, 2010) and our ‘extended minds’
    (Clark and Chalmers, 1998). The different uncertainties and ethical aspects are
    challenged by a set of operations that control the programs that are executed.


    There are several thought processes and research in different moral values and
    ethical considerations that need to incorporate into different technologies. The
    whole process of research and development is focusing on different ethical and
    moral aspects as there are a lot of novel and beautiful innovations that were
    withdrawn, just because they were not able to meet the ethical and moral constraints.
    Therefore, the computer ethics and moral considerations are an important aspect
    of any novel technology, and these are integral aspects of any research and development.


    The different aspects of research and development are making major studies into
