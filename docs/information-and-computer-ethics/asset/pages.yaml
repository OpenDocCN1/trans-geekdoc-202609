    fundamental openings of personal or corporate privacy, such as attacks on the
    integrity of information held in numerical collections, stores, and the use of
    criminally gained digital information and data to blackmail a firm or individual.


    Midway along the spectrum lie transaction-based crimes such as money laundering,
    fraud, trafficking in child pornography, digital piracy, money laundering, and
    counterfeiting. It is difficult to find the criminals who has done crime over
    the internet. The person who is expert or have knowledge in this field can only
