    of the preciseness of the forecasting.


    # ## 2.3. THE MORAL PARADOX OF INFORMATION TECHNOLOGIES


    Various issues raised are the consequence of the moral paradox of IT. Various
    users’ desires information to be rapidly available and reliant to utilize and
    desire that it must come at very cost.


    These users desire sensitive and important to be stable, secure, and reliable.
    Increasing the value of rapid and low cost decreases the capability of providing
    high-quality and secured information. The reverse of it is also true. Hence, the
    developers of information technologies are continually faced with making rough
    compromises.


    The incptive pioneer of web Stewart Brand have summed up greatly in his well-
    acclaimed quote, which states that on the one hand, the provided information requires
    to be costly, but it is actually so valuable.


    The right information at the right time at the right place just transforms life.
    Whereas, information must be free as the cost of acquiring it is lower all the
    time. As these opposing moral values are really not possible to resolve, they
    are probably to continue to be at the center of the moral debate in the application
    and framing of information technologies in the coming days.'
