  md: 'Article 41 that provides guidance on the use of nonmilitary measures is Charter’s
    favored method to restore international peace and security. Under this article,
    the Security Council has the power to administer a country for the usage of nonmilitary
    measures to coerce an offending country into ceasing its aggression. The members
    of the United Nations are responsible in implementing the nonmilitary measures,
    which includes the “complete or partial interruption of economic relations, and
    other means of communication, and the severance of diplomatic relations.”


    When the measures under Article 41 have not been effective or is not expected
    to be successful, military measures under Article 42 may be sanctioned by the
    Security Council. Although Article 41 authorizes the Security Control to impose
    the use of non-military forces, but a state cannot be forced to take military
    action invoking Article 42, it can only authorize the state to do so.


    As discussed, the use of force is prohibited under normal circumstances. However,
    another exception to this restriction is when force is required to be used for
    self-defense. The Article 51 of the UN Charter confers this right. This article
    asserts that “nothing in the present Charter shall impair the inherent right of
    [states to engage in] individual or collective self-defense” in response to an
    “armed attack.” Self-defense was considered a righteous act even before the UN
    Charter, and this fact has been implied in Article 51 as well.


    The UN Charter also endorsed this right under the customary international law.
    The fundamental principle of self-defense is the right to survive is cardinal
    to all states and states may employ force to safeguard themselves and their citizens.


    This right is independent of the UN Charter. Hence self-defense analysis borrows
    from the principles customary international law and the provisions of Article
    51.


    The essence of the principle of self-defense is that it may be resorted to when
    faced with a threat of armed attack. Although this principle is accepted and acknowledged
    by the international law, the question of what constitutes an armed attack is
    yet to be settled. This lack of clarity has led to the deliberation over when
    a state has the right to retaliate under self-defense.


    It is vital that self-defense is invoked at the right time, hence the dispute
    of what can be termed as armed attack, needs to be settled. In case of cyber-attacks,
    there can be more than one interpretation, unlike traditional warfare weapons.
    Hence the debate on what can be classified as armed attack has'
