    # ## 2.2.4. Moral Values in Organizing and Synthesizing Information


    Additionally, to the storing and communicating the data and information, various
    information technologies systematize the organization of information and mechanically
    authoring or synthesizing or acting on modern information. Norbert Wiener first
    established a theory of automated information synthesis which he then called Cybernetics
    (Wiener, 1954)).


    Wiener comprehended that a machine could be planned to collect the information
    regarding the world, descend logical inferences regarding that information which
    would indicate positive actions, which the machine could ultimately implement,
    all without any direct input from a human agent.


    Wiener rapidly saw that if his cybernetics vision was apprehended, there would
    be incredible moral concerns elevated by such machines and he sketched some of
    them in his book, The Human Use of Human Beings.


    Weiner have argued that, whilst such types or forms of technology might have had
    great impacts on the moral, it was still viable to be enterprising as well as
    providing with the guidance regarding technology in varied manner that would be
    helping in having an increment within the abilities of the moral reasoning, belonging
    to both the machines as well as the human beings.


    Here is a condition where a part of IT was making decisions regarding the prospect
    of immoral activity taking place that gives rise to a small amount of damage to
    the person that it was trying to aid. Gradually, machines make significant life-changing
    financial decisions related to people without many mistakes from human agents.


    Whether or not, a person will be provided with a credit card, the price that he
    has to pay for insurance, mortgage loan, etc., is usually determined by a machine.
    For example, if a person applies for a credit card, the machine will then look
    for few data points such as credit record, salary, the economic condition of the
    area, etc. and then evaluate the probability that a person will default on the
    credit card.


    Such possibility will either pass the plethora of embracement or not and thus,
    helps in determining if one is being provided with the card or not. The machine
    holds the potential of learning to make great judgments, provided with the outcomes
    regarding the prior decisions it has already made.'
