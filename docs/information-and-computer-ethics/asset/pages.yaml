    Wiener’s response was that as per his work on human life, humans can adopt various
    cultures and traditions while still observing “the great principles of justice.”
    These principles lay the foundation for ethics across diverse cultures.


    # ## 1.4.2. Methodology for Information Ethics


    An evaluation of Wiener’s approach to resolving IE issues it can be observed that
    he attempts to assimilate new cases by applying already existing, ethically acceptable
    laws, rules, and practices. This is particularly true in the case of his book
    “The Human Use of Human Beings.” All societies have principles, customs, rules,
    and regulation that collectively mold human conduct in that society.


    According to Moor, these policies constitute a “received policy cluster.” In a
    reasonably unbiased society, they can form the basis for resolving issues related
    to IE. Wiener combined the “received policy cluster” with his account of human
    nature, his “great principles of justice,” and his critical skills in clarifying
    vague or ambiguous language. This way he was able to establish an efficient technique
    for evaluating the following IE issues:


    +   - Address an ethical question or case pertaining to the infusion of IT into
    the society. Generally speaking, this would focus on the opportunities arising
    from technologies that have an impact on life, contentment, happiness, health,
    liberty, knowledge, prospects, and human principles.


    +   - Provide explanations for any ambiguous or unclear notions and'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'philosophies that may be pertinent to a case or any issue.


    +   - Check the possibility for applying laws, rules, customs, and principles
    that already exist in the society and uphold moral values and guide humans to
    tread on the ethical path.

    +   - If customs, practices, and policies are not providing the required guidance
    to deal with an issue or resolve a situation, the great principles of justice
    should be used to find a fitting solution that will conform to the moral traditions
    of the civilization.


    If the traditions, precedents, and policies that one starts with are embedded
    within a reasonably just society, then this method of analyzing and resolving
    IE issues will likely provide just solutions that can be assimilated into that
    society.


    In the late 1940s and early 1950s, Wiener expressed unambiguously that, introducing
    the newly invented computing and IT, would usher in a new era in the society.
    This new “automatic age” will be the second industrial revolution. Continuous,
    relentless, and multidimensional efforts would be required, and this would bring
    about a change in every aspect of life.


    According to Weiner, IT has dramatically altered human life and positioned them
    “in the presence of another social potentiality of unheard- of importance for
    good and for evil.” (Wiener, 1954) Wiener predicted decades ago that an “information
    age” will emerge. He also predicted that the metaphysical and scientific basis
    that he envisaged can act as a guiding force for resolving and interpreting the
    ethical issues that information technologies may stimulate.


