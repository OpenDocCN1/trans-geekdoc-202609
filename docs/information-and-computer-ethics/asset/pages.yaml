    in different ways. It is the codes of morals of a particular profession, or it
    is an agreement among people to covert the wrong things in a right way.


    Computer Ethics can be defined as allowing the individual to find solutions for
    the problems and the individual should work in a right way. The biggest challenge
    for the individuals is to handle the tough situations and make it simple and clean
    to work in a right way.


    The technology has been changing day-to-day which are making the impact on the
    people’s life. The major issues which are faced by the individuals, as well as
    the organizations, is that they are not updated with the new technology and later
    they are facing some kind of ethical problems. For example, the issue of a company
    officially monitoring employees’ e-mail is very controversial issues.


    It is necessary for the individuals to understand the computer ethics. Nowadays,
    computers have become the need for every individual along with the lot of challenges.
    There are many computer users who have less knowledge and find difficult to overcome
    the situations. The individuals are faced by several challenges, and they face
    trouble to express their views in'
