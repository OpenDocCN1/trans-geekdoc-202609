  md: '+   - The commander’s first duty is to “do everything feasible to verify that
    the objectives to be attacked are neither civilians nor civilian objects.”

    +   - The commander also has the duty to “take all feasible precautions in the
    choice of means and methods of attack with a view to avoiding, and in any event
    to minimizing, incidental loss of civilian life, injury to civilians and damage
    to civilian objects.”

    +   - The commander should not instigate any attack “which may be expected to
    cause incidental loss of civilian life, injury to civilians, damage to civilian
    objects, or a combination thereof, which would be excessive in relation to the
    concrete and direct military advantage anticipated.”


    It is important to note that, the concept of proportionality does not in any way
    place a constraint on commanders from causing any civilian death or injuries or
    destruction to civilian property. Proportionality states that loss to life and
    property should not exceed when compared to the “concrete and direct military
    advantage contemplated.”


    The principle of proportionality prohibits an attack if it is anticipated that
    expected damage to civilian lives and destruction of civilian property would outweigh
    the military gain contemplated from such an attack. In order to analyze proportionality,
    the direct military advantage should be evaluated against the destruction of civilian
    life and property.


