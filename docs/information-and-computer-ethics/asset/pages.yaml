- pgno: 163
  md: 'The third area where the ethical dilemma is encountered is the ethics of cyberdefense,
    specifically known as the “strike back,” “active response” or hack back.” The
    third area of cyber defense also demonstrates the ways by which the system administrators
    (victims) react and respond to the attack and to know if the attack is coming
    from systems that may themselves be victims of compromise. As most of the cyber-attacks
    are directed through the chains of compromised machines, can a victim “hack back”
    along the chain in order to determine the source?


    However, rather than exploring for answers to the above questions, this chapter
    details the various ethical issues in each of these areas of cyberconflict and
    create a framework by which all the questions can be addressed effectively.


    With the help of examples, principles have been explained; however, the aim here
    is not to reach a final moral conclusion. That would require a much more detailed
    examination of the specific cyber-attack taking into account the motive and the
    background.


    The framework presented here is based on the international law of armed conflict.
    This law was formulated to acknowledge and redress the threats of armed attacks
    and the usage of primarily armed force. However, some efforts have been channeled
    into making it relevant in the domain of cyberconflict. For a better understanding
    of the framework, the law has been segregated into two parts;


    +   * jus ad bellum, or the law of conflict management; and


    +   * jus in bello, or the law of war.


    Despite being stated as “laws,” the two segments of this law details more about
    the ethical behavior in a cyberconflict as these ethical behaviors act as the
    rules of law.


    Ethics is a field of study that provides a guidance of what is right and what
    is wrong, governs a person’s behavior and helps in taking a moral stand. Ethics
    primarily examines the morality of social structures, policies, laws, and human
    behaviors of a nation. The primary work of ethicists is to justify their moral
    judgments by reference to ethical principles of theories which tries to retain
    and capture the moral intuitions about what is right and wrong. The most common
    theoretical approaches are of two types, namely;


    +   * Consequentialism; and


    +   * Deontology.'
