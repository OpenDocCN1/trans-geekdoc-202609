    require to pay specific attention to evolving technologies and aid influence the
    design of these kinds of technologies so as to motivate advantageous moral results.
    The following sections contain few of the potential technological concerns.


    # 2.6.1. Acceleration of Change


    An IT has a very interesting pattern of growth that has been seen since the establishment
    of industries. Gordon E. Moore, an Intel engineer found that the number of components
    that could be mounted on an IC, i.e., integrated circuit almost doubled every
    year for a slight economic cost, and further he thought it might last that way
    for next ten years or so from the time he found it in the year 1965.


    This process is not restricted to the chips of computer only. Various forms of
    information technologies can be found in it. The latent power of the accelerating
    change has taken the thoughts of Ray Kurzweil, the futurist, and the inventor.


    There has also been supporting for the thesis from the community of technology
    with institutes like the Acceleration Studies Foundation, the Singularity Institute,
    Future of Humanity Institute, and H+. The reaction of philosophers to this hypothesis
    has been really mixed but very crucial.


    Similarly, Sullins (2006) contends that there is generally a quasi-religious facet
    to the transhumanism acceptance that is devoted to few results like uploading
    of consciousness of humans into the computer as a method to attain immortality,
    and that the receiving of transhumanist hypothesis impacts the values implanted
    in the computer technology, which can be hostile or dismissive to the body of
    human being.


    Not every philosopher is critical of transhumanism, as an instance Nick Bostrom
    (2008) of the Future of Humanity Institute at Oxford University'
