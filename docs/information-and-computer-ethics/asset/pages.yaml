  md: '# 6.3. CYBERWARFARE


    Instances of major cyber-attacks around the world have often prompted the various
    governments to shift the blame on other governments. Often there have been speculations
    of cyberwarfare breaking out. As defined by the Oxford English Dictionary “The
    use of computer technology to disrupt the activities of a state or organization,
    especially the deliberate attacking of information systems for strategic or military
    purposes.”


    The significance of the above definition is that the aim of cyberwarfare is not
    in attacking the neighboring countries with the use of computer-technologies,
    but it means that intra-national banks or any other actions which uses the computer
    system as a mode to launch a threat.


    The biggest challenge that cyberwarfare poses is the difficulty to find out who
    could be the perpetrator of the attack. Some latest technologies and intelligence
    can expose the state or group that may have been responsible, but with intelligent
    use of technology, it is easy to cover up the identity, cover up the tracks from
    where hacks have sourced as well as mask the malware infections and other methods
    employed


    Many freelance groups and hackers are recruited by the intelligence agencies and
    military operations to help them in attacking the target on their behalf. It becomes
    more challenging for the victims to identify the perpetrator to give them appropriate
    punishments for their criminal offenses (Figure 6.2).


    ![](img/a00d6ed3d12a9b9b64caf26273cded0e_166_0.png)


    Figure 6.2: Cyberwarfare: The dark side of cyberspace.


