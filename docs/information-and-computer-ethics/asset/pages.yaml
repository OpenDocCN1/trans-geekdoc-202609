    # 8.4.2. Encryption Technology to Minimize Harmful Actions on Internet


    During the time of World War II, it was very normal to use jumbled messages that
    were encrypted in secret patterns so that the enemy would not be able to interpret
    the messages even if they get hold of it in some way. Today on the Internet, these
    scrambled messages are quite popular for protecting and defending the credit card
    numbers and private information from enemy hackers. The mathematical method that
    is commonly found on the internet today that uses jumbling words to encode a message
    is known as ‘encryption.’


    Data can be converted in several forms such as e-mail, transactions, files, web
    information transmissions, etc. The encryption is generally used in internet shopping,
    stock trading, and online banking transactions, in ATMs and in and in electronic
    business-to-business transactions.'
