  md: 'considered acts of war. Article 2(4) forbids states from retaining “the threat
    or use of force against the territorial integrity or political independence of
    [another] state, or in any other manner inconsistent with the Purposes of the
    United Nations.” This article thus, forbids both active defense and also the threat
    of the aggressive use of force by states and considers it as crimes against international
    peace and security.


    The United Nations Charter’s protections started to rapidly spread, and several
    countries around the world started to implement the Article 2(4) as a customary
    international law even though this law was formulated only for the country’s that
    are parties to it, which later resulted in combining all the countries across
    the world.


    Only some exception can be referred to in the UN Charter, and states can threaten
    to use active defense or make use of force against another state. This position
    is further supported by Article 2(3), which requires states to “settle their international
    disputes by peaceful means in such a manner that international peace and security,
    and justice, are not endangered.”


    # 6.4. UN SECURITY COUNCIL ACTIONS AND CYBER-CONFLICTS


    There are certain set of exceptions which every country has to adhere to during
    the cyberconflicts. The actions that are authorized by the United Nations Security
    Council is the foremost exception to the common exclusion on the use of forces.


    In order to restore and maintain global peace and security, the Security Council
    can make use of the article 42 of the United Nations Charter which are primarily
    to be used through the military forces of a country. However, unless the Security
    Council fulfills the conditions of articles 39, 41, and 42, the Security Council
    is not entrusted the power to use the military forces under the United Nations
    Charter.


    Article 39 must be examined first before the Security Council can sanction the
    use of force. Article 39 requires the existence of “threat to the peace, breach
    of the peace, or act of aggression” which is to be determined by the Security
