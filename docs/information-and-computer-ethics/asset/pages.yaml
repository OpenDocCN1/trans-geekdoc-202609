- pgno: 187
  md: 'cyber-attack employs force or does it use soft and legitimate measures. Some
    of the legitimate measures include letter writing, speaking out, lobbying, petitions,
    etc. Schmitt’s criteria rank these measures low on the use of force.


    They cannot be termed as severe as the impairment is negligible. Also, to measure
    the impact is a challenge since their effects are not immediate or direct. They
    do not involve any illegitimate methods. The ease with which it can be performed
    makes them low on responsibility.


    Most web defacements violate computer crime statutes. Schmitt’s criteria can be
    used to assess web defacements. This would yield the result that it is high on
    four criteria- directness, presumptive legitimacy, measurability, and directness.
    It is easy to restore websites from back up; hence it is not that severe. But
    the damage could be high in cases like where a visitor makes use of incorrect
    medical information, or the security of online bank transaction is compromised,
    or the reputation of the enterprise owning the website is lost. Intrusiveness
    and responsibility can be ranked as moderate and low respectively. There are very
    few nations that claim to be responsible when they employ these methods. Web defacement
    cannot be performed by everyone; however, there is no dearth of hackers who can.


    It can be deduced that, apparently, defacements are even less legitimate that
    web sit-ins and are certainly despised by many hacktivists.


    Other types of hacktivism can also be scrutinized through Schmitt’s criteria.
    Generally, actions that breach computer crime statutes are ranked moderate to
    high. Example of such cyber-attacks are actions to deter a child pornography site,
    attacks that aim to pint out and rectify lapses in security systems. Even though
    the end objective may be ethical, the methods employed may be disputed.


    Any act that can be classified as cyberterrorism would have a very serious outcome
    even in the best-case scenario. Cyber-attacks that do not breach crime laws are
    ranked low as per Schmitt’s criteria. For instance, developing new software and
    employing them in letter writing campaigns or innovating software for obtaining
    censored information by breaching its firewalls.


    These activities cannot be considered illegal at least in the US and cannot be
    compared to the use of force. Cyber-attacks that are classified in upper ranges
    of Schmitt’s criteria may require more justification but cannot be termed immoral.
    One factor to be considered is whether a possibility exists to achieve the activist’s
    goals by actions which are within the ambit of law. Evaluating the case of defacement
    for protesting the CDA, it can be inferred'
