  md: 'counter cyber-attacks in self-defense? The laws of war are well defined and
    comprise of widely accepted principles. However, the application of those principles
    is a challenge. Most of the law of war was developed to counter traditional war
    methods; hence their principles cannot apply to cyber-attacks in all scenarios.


    In the paradigm of examining the armed attacks, the scope of an attack and the
    identification of an attacker has been easier when compared to other cyber-attacks.
    Generally, it becomes difficult for a state to assess the nature of cyber-attack
    when they are in process and becomes more challenging to identify the person responsible
    for the attack which has made states unwilling to react to those attacks in self-defense
    for fear of violating the law of war. This negligence of non-reactive nature to
    the attacks have turned cyberwarfare into one of the key topics in international
    law.


    The crux of this chapter is to discover the unique challenges which the cyber-attacks
    pose to the law of war and provide the readers an analytical framework for dealing
    with them. Once the present state of the law of war are fully explored, this chapter
    will demonstrate that states have a right under international law to:


    +   - Treat cyber-attacks as acts of war and not merely as criminal matters.


    +   - Use defensive mechanism against computer networks, both active and passive,
    against states found guilty of initiating cyber-attacks. Also, states have a responsibility
    to counter attacks within their borders and will be held guilty even if there
    was passive involvement.


    The key purpose of this chapter is to provide a deep understanding of the law
    of war. This chapter primarily deals in addressing the technical aspects of cyberwarfare
    also showcases the presence of legal body for every state which acts as a self-defense
    to these cyber-attacks.


    The following are the seven principles of law of war which the U.S. Department
    of Defense summarizes; (DoD OGC)


    +   - **Distinction of Combatants from Noncombatants:** The exclusive right to
    use force lies with the nation’s armed force, and they must not mask their identity
    and hide behind civilians or in civilian properties;


    +   - **Military Necessity:** The targets of the cyber-attacks should make a direct
    contribution to the war effort or produce a military'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'advantage;


    +   * **Proportionality:** During an attack on a lawfully military target, if
    collateral damage to civilians and civilian properties is inevitable, the probable
    military advantage should be proportionate to the damage;

    +   * **Indiscriminate Weapons:** Avoidance of using weapons which cannot be directed
    with any precision. An example for an indiscriminate weapon is the bacteriological
    weapon;

    +   * **Superfluous Injury:** Abstain from using weapons that are likely to cause
    irrevocable losses and fatal injuries;

    +   * **Perfidy:** Neither the symbols that are protected are not meant to be
    utilized to immunize the military targets from attacks, nor they are to be fake
    surrendered or issued false reports of cease-fires; and

    +   * **Neutrality:** Countries are entitled to immunity from attack if they do
    not assist either side; else, they become legitimate targets.


    Out of the above seven principles, the first three principles deal with the wars
    which are to only be performed by the military forces, and the primary focus of
    that attack should of military targets rather than civilian ones irrespective
    of the nature of attacks whether cyber or kinetic.


    The consent to cyber-attack crucial infrastructures such as financial systems,
    civilian energy distribution, transportation, and telecommunication are permitted
    only if the attack do not cause disproportionate and redundant collateral damage
    to civilian property and noncombatants.


    # 6.3.3. Proposals and Defenses


    Active defenses are crucial to make the state cyberdefense measures effective.
    Also, it acts as a warning and a deterrent to cyber-attacks since the assailant
    would not want to deal with counterattack. For the purpose of using active defenses,
    the country should ensure a legal authority prior to performing a defense attack,
    which flows from the longstanding duty which mentions that the state is in a plight
    to prevent nonstate actors from using their territory to commit cross-border attacks.


    Conventionally, the duty of the state is to deter illegal activities that the
    state has prior knowledge of. However, this duty has evolved in the background
    of international terrorism, and now states are also bound to act against groups
    with past records of illegal acts.'
