    (1991), would certainly be responding to the forecasting or the prediction made
    by Johnson, by presenting with an indication regarding the various problems or
    issues being associated with it, having an involvement of the certain responsibilities
    for the provided experts or the professionals, who are operating within the facet
    of the computers would certainly not being distant in accordance with the future,
    ethics belonging to the computers will not be going away, for instance: the facet
    or the field belonging to the ethics being associated with the professionals.


    But then, another question arises related to the ethics belonging to the information
    as well as the communication technology being the branch of the applied ethics.


    Antonio Marturano (2000) has lately provided with the response to Johnson through
    a demand regarding the two pertaining ways with which she could be able to understand
    or interpret the claim made by her regarding the banishment of the computer ethics:


    +   - As an autonomous discipline, computer ethics will disappear; and

    +   - As an aspect of applied ethics, computer ethics will disappear.


    In addition to challenges posed to Johnson’s prediction by Gotterbarn and Marturano,
    others would also likely disagree with Johnson.


    It would surely appear that questions related to AI comprising moral responsibility
    will endure to rise in the coming future and that these AI related questions would
    benefit arguably from the analysis by computer ethicists.


    Rather, it is believed that a better knowledge of how computer technology has
    emerged during the last fifty years can aid to recognize more clearly some of
    the issues and challenges that people will face in the future when they attain
    a state of more comprehensive ‘technological convergence.’


    In considering the impact that computing has had for ethics during the last half
    of the twentieth century, we could view it from the vantage point of four distinct
    stages or phases.'
