  md: 'The field of information technology (IT) and digitization have expanded to
    unrestricted boundaries, and there is no stopping this field from growing even
    further. These are something’s, though, that need to be curtailed as they have
    resulted in the degrading value of the field. Ethics have always been an important
    subject in any field that humanity has taken up, to ensure that humans do not
    indulge themselves in activities that degrade the value of the subject. In the
    field of IT and computer systems; also, there have been various ethical issues
    that concern individuals and their personal lives. In this chapter, the readers
    get an insight various such issues and get to understand the flaw in the computing
    systems.


    # 4.1. INTRODUCTION


    The world that the people live in is ever evolving and ever-changing in terms
