  md: 'But when it got sighted in accordance with the perceptions of the ethics or
    morality associated with the information and communication technology, being a
    track for the ethics belonging to the experts or the professionals or being the
    basic division related to the philosophy, grounded on the applied ethics, the
    positions held by Johnson could get challenged.


    Some of the individuals, who were in support of this specified perception, having
