    It is also crucial that the international law formulate rigid guidelines for the
    appropriate usage of active defenses which in turn would aid in minimizing the
    unpredictable and unacceptable responses to the cyber-attacks. The law of war
    is very powerful and is well capable of giving the required information to the
    states; a careful examination of the same is required for guidance.


    As stated earlier, the law of warfare is divided into two segments which are just
