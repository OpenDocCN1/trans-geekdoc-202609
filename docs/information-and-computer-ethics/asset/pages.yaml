  md: 'It is important to motivate people in such a way that they have transparency
    within the team as this would help them in achieving their respective goals ethically.
    It is not just the leaders’ responsibility to encourage the team to follow the
    ethical line, but everyone must have that sense of responsibility towards the
    work they do and should follow an ethical line to accomplish the goal.


    +   - **Focus:** Instead of working independently, teams are more effective when
    they collaborate on small sets of customer-driven outcomes. Therefore, company
    leaders should empower their teams to tackle the most important tasks first as
    they work toward a final product. Concentrating on a task at a particular point
    of time assures that the teams are pushing the best resources only for the production
    of final product any organization can be honored of.

    +   - **Openness:** A leader must not encourage commitment and courage, but should
    also help the team to be open amongst the team members. This will build trust
    on each other and would help them take the track with complete positivity while
    achieving the required goal. Openness within the team helps in creating transparency
    and would give space and scope to everyone to develop their skills by their own,
    the phrase “fail fast” is often used to describe agile approaches, but actually,
    it is “learn fast.” Openness is a prerequisite to that mantra.

    +   - **Respect:** Above all, leaders of the company must respect the diverse
    backgrounds, variety of skills and experience of their team members. Giving respect
    to the team members and presuming they have ideal intentions can easily lead to
    the conversations which can be utilized to resolve the conflicts present in an
    organization and enhances the performance of the team. When people feel respected
    and know they are being heard, they can fully support company decisions, even
    if the decision was not their preference.


