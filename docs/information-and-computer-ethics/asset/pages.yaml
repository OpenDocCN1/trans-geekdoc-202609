    ELIZA. This was a basic computer program that he called ELIZA. His intention was
    to offer a rough imitation of “a Rogerian psychotherapist engaged in an initial
    interview with a patient.”


    The reaction of people to his modest program, startled and dismayed Weizenbaum.
    For example, some computer scientists at MIT, who even though, were aware of how
    the ELIZA program worked, became emotionally involved with it. They even shared
    their personal views and opinions with them. Some psychiatrists deliberated that,
    ELIZA is proof that computers soon would perform automated psychotherapy.


    The reactions to his invention made, Weizenbaum anxious that an “information-processing
    model” of human beings was reinforcing an already growing tendency among scientists,
    and even the public, to see humans as “mere machines.” Consequently, he wrote
    the book Computer Power and Human Reason in 1976 in which he expressed his anxiety.
    Many scholars were influenced by this book and some speeches he gave in the various
    parts of the country. They began to contemplate about the impact that computing
    would have on society and morals.


    # 1.5.1. Walter Maner and His Views on Computer Ethics


    Walter Maner who was associated with Old Dominion University in Virginia coined
    the term “computer ethics” to refer that field of inquiry dealing with ethical
    problems aggravated, transformed or created that can be attributed to computers.
    Maner even offered a course on this subject at his university.


    In the latter part of the 70s and the mid–80s the courses offered by Maner in
    the university gained a lot of popularity. He also offered a large number of courses
    and workshops aimed at educating people about computer ethics in the philosophy
    and computer science conferences all over America. In the year 1978, he launched
    his Starter Kit in Computer Ethics independently. Through this kit, he intended
    to assist the university teachers to plan courses on computer ethics.


    The Starter Kit also contained suggestions for university prospectus, a rational
    explanation for including this course in the curriculum of the university, a list
    of the purposes of the course, some handy instruction on the teaching approach
    to be adopted, some topics that could be included like cyber-crime, privacy, and
    confidentiality, professional code of ethics.'
