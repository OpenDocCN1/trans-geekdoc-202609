    # 8.3.5. Malicious Codes


    Malicious code is the code causing damage to a computer or system as this code
    attacks several types of computer programs that were created with the purpose
    of causing data loss or damage. The three main types of malicious code attacks
    are viruses, Trojan horses, and worms.


    A virus always attacks the system, and it is a malicious software that is attached
    to another program to execute an unwanted function on a workstation. An example
    is a program that is attached to command.com (the primary interpreter for Windows
    systems) and deletes certain files and infects any other versions of command.com
    that it can find.


    A Trojan horse is a kind of program in the computer system that may change the
    settings of the computer system. Trojan horse virus can even attack the system,
    so there is a need for antivirus to protect from these attacks.'
