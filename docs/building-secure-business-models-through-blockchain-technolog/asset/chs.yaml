  \n\n\n\n\n### 引言\n\n金融领域的大部分正在经历着重大转型。此外，受金融危机的影响，监管机构已实施了调整；然而，特别是数字化，通过改变旧的企业流程并允许新竞争者进入市场（Feyen\
  \ et al., 2021）。大多数银行交易现在是在智能手机上完成的，而不是传统的网点，计算机算法正越来越多地提供投资建议。高频交易者（即在几分之一内做出并执行交易决策的计算机程序）主导着证券交易世界，该领域主要已计算机化并由他们控制（Musciotto\
  \ et al., 2021）。众筹平台与商业世界中既有的企业融资渠道并存。数字化对金融领域可能具有重要意义的组成部分是区块链技术的发展，它始于十多年前。合作与发展组织（OECD）最近的一份报告研究了若干新兴技术（如大数据、物联网、人工智能等），以评估它们如何影响金融部门的各种业务和服务（如支付交易、金融投资、贷款等）（Casino\
  \ et al., 2019）。我们在本研究中讨论的区块链技术，是唯一经确认影响每个人功能和服务的创新技术。\n\n## 文献综述\n\n区块链技术基于加密货币比特币，其概念于\
  \ 2008 年在一篇以笔名发表的文章中提出。核心概念是开发一种去中心化的支付系统，能够在不涉及“可信赖第三方”（如中央银行和商业银行等金融机构）的情况下运行（Baldominos\
  \ Gómez & Mochón, 2020）。尽管加密货币尚未取代传统货币，但它们在近几年的重要性大幅增加。\n\n所有加密货币的总市场价值数千亿美元，并且存在基于加密货币投资的期货合约和交易基金。智能合约等允许“代币”的发行，这些代币被应用于首次代币发行（ICO）等背景下，这是一种日益受欢迎的类型企业融资方式（Diaby\
  \ et al., 2021）。虽然区块链技术最初是为了创建加密货币而开发的，但其应用潜力现在已远超此范畴。例如，人们正在争论它是否有潜力完全改变证券交易的处理。据预测，这些变化将对上市公司的公司治理产生深远影响。此外还提到了许多非金融用途，我们将在本文中不再涵盖。\n\
  \n但许多人认为区块链技术的影响范围将有限。为了消除中央银行或商业银行等金融机构，比特币概念被提出（Chang et al., 2020）。然而事实上，目前绝大多数比特币交易发生在交易所（因此是在金融机构处进行的），而在另一方面，比特币和其他加密货币可以在相互之间进行交换，也可以与普通法币进行交换，这显然与上述观点相冲突。\n\
  \n我们试图对区块链技术的可能金融用途编制一份详尽的清单，并在本文中提供了我们的发现。文章结构如下：首先，我们将概述区块链的技术基础，从比特币区块链作为起点，但在适当的情况下将转向其他替代的设计方案（Andoni\
  \ et al., 2019）。之后，在第三部分中，我们将展示我们认为的这项技术的最重要的金融用途。我们最常涵盖的话题包括加密货币和区块链技术；智能合约；首次代币发行；证券交易；以及上市公司的公司治理。第四部分通过提供预测来结束本文。\n\
  \n## 区块链的分类与解释\n\n比特币等加密货币和其他数字货币是构建在区块链技术之上的，其对全球业务模式的潜在影响被描述为具有“革命性潜力”（见上文）（Vega\
  \ & Clohessy, 2021）。对于不熟悉该术语的人，区块链可以定义为构建在最先进加密技术之上的分布式开源数据库。在区块链技术的帮助下，可疑方之间的交易可以变得更加安全，这完全消除了对中间人的需求。如果是这样，我们就不需要经纪人、评级机构或其他信用机构了，使得没有银行的金融交易变得可行（Dutta\
  \ et al., 2020）。本研究涵盖了该技术的，以便让你判断它是否符合你的希望和预期。组织和存储系统以及建立信息信任的方法是两个主要的结构元素。\n\n\
  ## 数据的组织与存储\n\n关于金融交易的信息（如加密货币应用）或其他资产的信息可以使用区块链进行存储和监控，区块链充当着一种数字账本（Chen et al.,\
  \ 2018）。\n\n为了充分理解区块链技术的可能性，必须首先理解账本的基本元素。正因如此，我们将在下文中更深入地介绍这些元素。我们可以在区块链中不断增长的带有时间戳的列表中添加记录，但这些记录本身不能被修改或删除。难道不能保持系统最新吗？虽然更新没有被覆盖，但它被记录为一个新的时间戳条目，而不是覆盖现有的条目。这意味着数据结构始终拥有完整的历史（Lewis,\
  \ 2015）。虽然初看可能很困难且耗内存，但这种数据存储方式增加了透明度并防止了欺诈。“只追加账本”（append only ledger）一术语指的是只允许添加数据、但不允许更新或删除数据的账本。为了效率，数据被组织成块。例如，向系统添加新区块（如一笔新的金融交易）会向系统添加新数据。每个区块的“识别码”指向前一个区块，导致区块的顺序排列（Yli-Huumo\
  \ et al., 2016）。\n\n同样重要的是，区块链是一个分布式系统。区块链中有许多节点，而不是传统账本中的单一节点，每个节点都负责维护区块链中数据的完整性。将这些节点想象成计算机，你就能理解这个概念（Zhang\
  \ et al., 2019）。它们彼此并不信任。然而，得益于一种智能技术，账本可以在这些节点之间复制，全球大量的计算机现在拥有整个交易历史的相同副本。直觉上，这种去中心化的数据架构有助于防止攻击并对数据建立信心，这是合理的。\n\
  \n\n\n\n\n# 区块链的数据组织与更新过程可以总结为四个步骤\n\n区块链上的每个节点都会接收一份新输入交易的副本。这些交易在网络中传播，但尚未进入区块链。新交易被聚合成一个区块，而所谓的共识过程（下文将进行更详细的说明）决定了哪个节点可以发送其区块。该区块中所有交易的合法性由其他节点进行评估。被接受的区块会在后续区块中引用。正是这一程序的结果使得所有节点对区块顺序达成共识并保留区块链的副本（Shrestha\
  \ et al., 2020）。\n\n| 图 1. 区块链结构（包含三个区块的摘） |\n| --- |\n| ![Figure978-1-6684-7808-0.ch008.f01](img/ch008.f01.png)\
  \ |\n| --- |\n\n## 增强对数据的信任\n\n当然，上述数据结构只有在它们可以被信赖时才有用。在一个去中心化的系统中，如何在已知不可信的各方之间培养信任呢？我们又如何确保链中的每个区块都受到所有方的信任呢？通过非对称加密和所谓的共识过程，区块链技术提供了这种信任\
  \ (Kaur et al., 2021)）。\n\n## 非对称加密\n\n对于要添加到区块链中的新交易（步骤 1），采用非对称加密来构建这些交易，使其真实性可以被验证。在这种情况下，通常会使用私钥和公钥在它们之间建立单向链接。为了实现这一点，发送者使用其私钥和任何其他密钥对交易进行加密。\n\
  \n发送者的公钥可用于解密交易，允许网络上的任何人确认该交易来自发送者。最终，其目的是确保交易的合法性和完整性，允许发送者在任何时候被识别，并防止交易被篡改（Rutland,\
  \ 2018）。诚实的节点只能传输它们可以验证为有效的交易。这类加密方法并非区块链技术所专属。相反，它们早已以电子邮件、网上银行和在线购物的形式存在了。\n\n\
  ## 共识机制\n\n去中心化系统的交易必须达成共识才能运行。也就是说，新的交易区块（见步骤 2）是如何添加到区块链中的呢？所能做的只是添加新区块；无法编辑或删除当前数据。结果是，对创建区块链记录的人员有利的交易添加在实践中是受到激励的（Khan\
  \ et al., 2021）。共识技术作为区块链技术的关键组件，进入了这一场景。这种方法控制着下一个节点将其区块发送到区块链。另一方面，不应该有任何中央机构限制新材料的添加。对于任何节点本质上都可以提供新信息的分布式系统来说，其缺点是不诚实的一方可能会利用这种知识来获取不当利益。共识的建立试图解决正是这种权衡（Sedlmeir\
  \ et al., 2020）。为了做到这一点，你必须首先向尽可能多的节点（如果不是所有节点）提供添加新区块的能力。收集新交易的节点经过审查并打包，以便能够将下一个区块添加到当前链中（即“矿工”），并提供奖励以确保有足够的节点参与这一阶段。让这种竞争产生意义对于矿工来说至关重要，因为他们之间存在直接竞争。因此，节点应该只创建包含不与自身或不与区块链其他部分冲突的真实交易的区块。为了被包含在候选区块中，不应包含多次使用同一种资产的交易（所谓的“双重花费”问题）（Yaga\
  \ et al., 2018）。\n\n比特币网络依赖于工作量证明共识过程，这是应用最广泛的。这种方法的核心是增加创建区块的成本，同时让其他所有人在验证新候选区块的有效性时成本变得相对廉价。这使得“虚假报告”变得昂贵且易于识别（Idrees\
  \ et al., 2021）。\n\n这是通过所谓的哈希函数实现的。比特币区块链（256 位）使用哈希函数将海量数据（例如整个区块）封装成极小固定大小的（哈希值）（Sobti\
  \ & Geetha, 2012）。如果你更改输入数据中的一个字母或数字，哈希函数将提供完全不同的结果。比特币区块链上哈希值中前导零的数量现在定义了一个最大值。为了实现这一目标，会在数据块中附加一个\
  \ `nonce`。哈希值目前通过反复尝试进行微调，直到它符合规范。哈希率衡量了每单位时间内为了发现有效解决方案的尝试次数（Rutland, 2018）。为了将区块添加到区块链，第一个找到解决方案的节点将获得\
  \ 5 的奖励（见步骤 2）。矿工使用高性能计算机，这消耗大量能量，因为计算能力会增加成功的概率。最后，所有其他节点都可以检查工作是否完成。这只需将带有 `nonce`\
  \ 的区块输入哈希函数，并检查哈希值是否符合规范（Zheng et al., 2017）。还可以验证区块内包含交易的历史合法性。任何单一资产出现多次的情况都会被标记为双重花费（见步骤\
  \ 3）。诚实的节点简单忽略无效区块，但当矿工在随后的区块创建中将其引用时，一个新的有效区块会被添加到区块链（见步骤 4）。\n\n每个区块都包含前一个区块的哈希值，从而从单个区块形成链（区块链）。任何篡改尝试都会改变该区块的哈希值，以及随后的所有区块，从而易于追踪是谁在背后进行修改（Marbouh\
  \ et al., 2020](#978-1-6684-7808-0.ch008.xhtml#r43)）。区块的哈希值可以被认为是它的“指纹”。\n\n如果两个新的、正确的区块同时添加到区块链，将会存在两个不同的区块链副本。在这种情况下，有必要确定哪个版本是最新的。共识规定最长链是最新的(Jabbar\
  \ et al., 2021)）。\n\n\n\n\n\n工作量证明确保了网络上的所有人对区块链所在地达成共识，并且其包含的数据是可以信的。在这种情况下，不存在“可信”的中间介（Al-Rakhami\
  \ & Al-Mashari, 2021）。一次成功的数据攻击将花费巨额资金和计算能力，因此风险极高，只有诚实的行为才会被容忍。中间人的信誉被技术的可信度所取代（Xie\
  \ et al., 2020）。\n\n在某些情况下，替代共识算法可能更适合区块链的架构。例如，“权益证明”概念是资源密集型工作量证明过程的替代方案，在该过程中，连接你所开发的候选区块的概率取决于你在区块链上拥有的资产比例或由其注册的价值（Lazuashvili,\
  \ 2019）。为了确保区块链的成功，为对其成功有利益关系的人提供更多权力至关重要。在工业应用中，由于主要目标不是在不可信双方之间建立共识，依赖于特定数量可信节点的节点（权威证明）会受到质疑（Zhu\
  \ et al., 2020）。\n\n## 设计类型\n\n没有访问限制且可能存在不实玩家的去中心化数据结构是到目前区块链理念的基础。创建区块链有许多不同的方法。因此，区块链可以用于控制谁有权访问存储在那的信息（Beck\
  \ et al., 2018）。就像管理读取权限一样，写入权限也可以受到限制。任何人都可以加入公共区块链（例如比特币区块链），并访问存储在那里的数据。因此，公共区块链提供了前所未有的开放性（Beck\
  \ et al., 2018）。比特币区块链是一种“公共无许可的”区块链，因为任何人本质上都可以担任矿工，从而对网络进行修改。Hyperledger 或 R3\
  \ corda 等工业应用中的参与者通常被限制在一个特定群体内。因此，被称为“私有有许可的”区块链（Ernst & Young LLP, 2021）。\n\n\
  考虑匿名程度也是至关重要的，即实施区块链需要多少个人数据。某些加密货币（如门罗币）不需要用户的任何个人数据（匿名），而其他应用程序（如使用电子邮件地址的程序）则必须提供（实名）。然而，伪匿名身份在比特币行业中很常见（Zarrin\
  \ et al., 2021）。\n\n比特币和其他基于工作量证明原理的公共区块链具有有限的可扩展性，且交易资源消耗巨大。由于不同的区块链系统（如比特币和以太坊）最初是不兼容的，因此它们之间的直接交易是不可能的。\n\
  \n互操作性变得越来越重要，正在开发新技术来满足这一需求。诸如“侧链”、“状态通道”或“分片”等概念可以通过多种方式应用于区块链（交易不由所有节点处理）。\n\n\
  ## 应用领域及示例\n\n在互不信任的双方之间可以达成共识，且不需要交易所、经纪人或银行机构等中心化的可信中间者。许多人倾向于通过经销商购买二手车，而不是直接从前任主那里购买，这是一个简单的应用示例。对前任主者的缺乏信任是其中的一个因素。如果所有的“交易”（如事故和维修）都保存在像区块链这样的不可篡改的数据库中，那么就不再需要对前任主者的信任（Uddin\
  \ et al., 2021）。一个难以检查的中间人比汽车经销商更令人理想。因此，在双方之间信任度较低的情况下，新技术的竞争优势可以被更有效地利用（Al-Rakhami\
  \ & Al-Mashari, 2021）。以下是该技术可能用途的示例。\n\n| 图 2 根据 Berentsen and Schar (2018) 的支付系统维度\
  \ |\n| --- |\n| ![Figure978-1-6684-7808-0.ch008.f02](img/ch008.f02.png) |\n| ---\
  \ |\n\n以物易物采用许多潜在贸易伙伴感兴趣的物品，即使它们并不立即需要。只需在未来日期与贸易伙伴交换的想法（流动性价值）就足以驱动此类产品的价值，这些有时被称为“货币”（Khan\
  \ et al., 2021）。Khan et al. (2021)认为货币的主要功能是记录参与者之间的债权。在小组工作（如共享利益）时，不需要正式结构。在大型社区中，这种非正式结构不再有效。作为一种集体记忆，货币履行了这一目的（Esterhuiz,\
  \ 2006）。一方面，所有权结构始终是清晰的。为了让系统正常运行，每个货币单位只能花费一次（双重花费问题）。\n\n三个维度被 Berentsen and Schar\
  \ (2018) 用于表征货币或通用支付系统。这些是治理货币价值创建、表示和传输的规则（Kevin & Suresha, 2018）（见图 2](#978-1-6684-7808-0.ch008.xhtml#f02)）。例如，中央银行可能对货币产生垄断，也可以以竞争的方式进行，例如寻找黄金。符号货币的一种方式是将其存账户或以货币形式持有。人们交换现金有两种方式：通过银行直接交换，或者现金交换（Perkins,\
  \ 2020）。\n\n虚拟表示相比物理表示具有显著的效率优势。同时，对中心实例的依赖由于各种原因变得负面（缺乏信任、防止系统故障）。因此，虚拟表示与去中心化传输的结合将是理想，但在区块链技术开发之前是不可能的。然而，比特币或以太坊等加密货币结合了这些属性，这些属性从经济角度来看是非常的（Reyna\
  \ et al., 2018）。这一问题可以通过考虑“货币三要素”来回答，该要素指的是货币单位的三个主要目的：\n\n*   • 交换或支付的功能\n\n* \
  \  • 数据存储的角色\n\n*   • 计算单元的功能\n\n\n\n\n\n在交换和支付功能方面，经济体应该尽可能减少不同货币的种类，以便货币单位能够发挥最佳作用。每个代理人在正式接受某种货币之前，必须假定未来的交易伙伴有极大的概率接受所提供的货币（Delahaye,\
  \ 2016）。当一种新货币引入时，它通常会被普通大众拒绝。因为个人的接受取决于其他市场参与者的认可，因此新货币很难超越这一初步平衡状态。`euro`（欧元）和`dollar`（美元）等传统货币在其原产国是法定货币，这意味着商户必须接受它们。12\
  \ 个原因中的另一个是，验证一笔交易达到最终（不可逆转）结论所需的时间，也是人们不愿使用加密货币而非现金和信用卡等传统支付方式的因素之一（Grinberg, 2011）。\n\
  \n尽管大多数加密货币价值在过去几个月里波动剧烈，但这并不意味着它们是良好的财富存储手段或计算单位。大多数加密货币的协议设定了货币创造的路径，因此它们不会通过通货膨胀导致货币供应增加，但其作为投机对象的用途、不可预测的未来采用情况以及大巨头的集中都是需要考虑的因素。通过将货币供应分配在少数参与者之间，可以避免过度的价格波动。过去几年里，`Bitcoin-USD`汇率的波动有所减少，但在\
  \ 2019 年其每年波动率仍为 70.7%。相比之下，在同一时期`EUR-USD`汇率（在某些方面与加密货币有相似之处）波动期间，黄金的波动率为每 15 个百分点\
  \ 11.5%。。\n\n稳定币的创建是为了应对加密货币价值的剧烈波动。其核心原理是货币由固定数量的资金支撑。加密货币`Tether`（USDT）就是一个很好的例子，它的每个单位都有`USD\
  \ 1`的担保。Facebook 计划中的加密货币`Libra`也计划由货币篮子覆盖。由于其设计，稳定币依赖于中心权威，即为其提供抵押的公司或财团（Diaby\
  \ et al., 2021）。这与加密货币消除对中心权威需求的初衷直接背道而驰。由于使用加密货币会产生大量数据，这可能会导致相关参与者的系统相关性和垄断风险，而这种设计加剧了这一问题（Diaby\
  \ et al., 2021）。\n\n## 区技术的优势\n\n### 智能合约\n\n使用“智能合约”一词是指根据一组预设条件自动执行的合同。“智能合约”用于描述存储在区块链中的一段代码，当满足某些条件时，它会自动执行，而无需代码初始作者的参与（Chenthara\
  \ et al., 2020）。智能合约的使用扩展了区块链存储数据以执行计算的能力。代码一旦保存，由于区块链的技术特性，它将无法被更改。因此，它让合同双方有信心，只要满足标准，约定的事件就将真实发生。一旦物品完成转移或完成支付，这通常会在区块链上立即完成。极端事件保险就是此类用途之一。如果合同是以传统方式形成的，并由保险公司担任中心中间人，理赔程序可能会花费很长时间（Zheng\
  \ et al., 2020）。由于复杂的赔付标准和难以理解的合同条款，保单人担心实际赔付。。中有明确的要求可能与现实世界的事件挂钩，例如风速或地震强度，如果这些条件通过智能合约的处理机制满足，就可以触发即时赔付。由于区块链的共识机制，处理可以得更快，因为世界的“状态”可以迅速达成共识。通过使用智能合约降低准入门槛，还可以更有效地分配风险。社区成员可以根据需要为他们的亲属安排保险覆盖（Khatoon,\
  \ 2020）。\n\n### 预言机与局限性\n\n在区块链上开发智能合约时，引入外部信息（如天气数据或证券价格）是一个主要困难。预言机（Oracles）是收集和验证此类数据并将其提供给区块链的接口。在许多情况下，它们构成了安全担忧，因为它们依赖于区块链无法保护的外部因素（Mammadzada\
  \ et al., 2020）。\n\n比特币区块链也可能用于映射简单的智能合约，例如将支付与复杂条件连接。因此，比特币编程语言不是图灵完备的，这意味着某些类型的计算无法使用它完成（Mammadzada\
  \ et al., 2020）。利用以太坊的公链可以执行日益复杂的智能合约。可以使用相关的编程语言开发分布式程序，该语言是图灵完备的，并提供了标准化工具，例如创建你自己的加密货币（即令牌）。\n\
  \n我们分析智能合约的优缺点是为了确定哪些合同可以使用这种形式进行映射。智能合约是安全且透明的。与传统类型的合同相比，这种代码没有任何解释空间，因为它是机器读的。它们非常安全，因为合同条款无法修改且通常是加密的（Khan\
  \ et al., 2021）。重要的是，所有的合同信息必须要么存储在区块链上，要么通过预言机引入。这意味着在大多数情况下，硬分叉是消除代码错误的唯一方法。更糟糕的是，测试智能合约可能很困难，因为它们可能与其他智能合约或其他服务交互，这使其变得更加复杂。在大百万个以太坊智能合约中，有\
  \ 3%被发现存在缺陷。\n\n这意味着智能合约的处理效率与合同的完整性直接相关。智能合约要求所有可能行动的未来情况都被记录并包含在程序代码中。即使概率非常低，事实仍然如此。因此，很难刻意为特定实例开放流程，仅在需要时与合同伙伴达成协议（Xu\
  \ et al., 2021）。当可能的未来状态数量巨大，且制定完整合同的成本过高时，部分合同是常见且有利的。在雇佣合同方面，无法使用智能合约指定任务的确切性质以及员工获得补偿的条款。\n\
  \n\n\n\n\n其次，共享区块链的使用意味着未来的某些情况（通常情况下对某些方来说无法验证）可能被直接追踪并作为智能合约的条件进行利用（Gatteschi\
  \ et al., 2018）。此外，还可以将最终产品的成功追溯到供应链中先于它的中间环节。因此，更全面的合同更有可能被签署。由于信息的获取便捷，更多企业能够进入市场（Bottoni\
  \ et al., 2020）。\n\n然而，信息可用性的提高对于实现去中心化共识至关重要，但可能会导致竞争对手之间增加勾结的机会。取决于监管环境，这种权衡可能会对经济产生有利或负面的影响（Abimbola\
  \ et al., 2019）。\n\n## 代币首次发行 (Initial Coin Offerings)\n\n互联网公司在代币首次发行（`ICO`）中提供代币或有价值的货币是常见现象。证券代币可以是确认对企业的付款索赔，这可能与公司的利润或销售有关（证券代币），也可以允许使用公司未来的服务（实用型代币）。通常，购买实用型代币是为了未来将来其转出以获利（Toma\
  \ & Cerchiello, 2020）。实用型代币：`ICOs` 通常是发行证券和产品早期销售的结合，因此（参见图 3）。因此，对它们的评估非常困难。现有的投资者和消费者保护规则法规与这一新理念不符，且角色的模糊性使得难以制定新立法（Momtaz,\
  \ 2020）。\n\n第一次，`ICO` 被用于为基于区块链的公司筹集资金。在 `ICO` 期间，唯一可有的就是一份概述产品基本概念和设计的“白皮书”。新发行的代币直接出售给公众，不需要交易所或任何其他中介。智能合约被用于在区块链上进行\
  \ `ICO`。为了让投资者避免与公司产生直接的法律关系，他们不应直接购买代币。今年，企业发行的新代币总额为 216 亿美元，是 2017 年的三倍以上，比 2016\
  \ 年增长了 80 多倍（Momtaz, 2020）。2019 年交易量大幅下降，仅 33 亿美元。`ICOs` 与传统的风险投资融资和众筹相竞争，或者以混合模式的形式与它们形成互补，正如它们过去所做的那样。围绕\
  \ `ICOs` 的争议往往掩盖了其巨大的交易量，这导致许多投资者在这些投机性投资中损失了所有资金（Momtaz, 2020）。SEC 明确反对受名人声誉推动的\
  \ `ICOs`。由于 `ICOs` 通常在多个轮次中构建，庞骗计划的可能性始终存在，代币价格随时间增加。一些国家已经完全禁止了 `ICOs`。此外，交易所发行（`IEOs`）由于某些丑闻而出现。\n\
  \n| 图 3 代币发行的分类 (ICOs) |\n| --- |\n| ![978-1-6684-7808-0.ch008.f03](img/ch008.f03)\
  \ [978-1-6684-7808-0.ch008.f03] | |\n\n在这种情况下，加密交易所作为中介介入销售代币。代币首次发行（`ICO`）为经济提供价值的方式有两种：通过创建新企业和获取新客户（Li\
  \ & Mann, 2018）。作为第一步，当参与者数量足够时，许多区块链应用应用是有用的。投资者通过购买（实用型）代币展示他们对初创公司的承诺。\n\n参与者的利益可能会受到负面影响，因此\
  \ `ICOs` 解决了它们旨在解决协调问题。代币价格在多个轮次中的增加可以通过项目具有更大的价值来证明（[Salampasis et al., 2020]）。投资银行并不在典型的首次公募（`IPO`）中收集信息（Zhang,\
  \ 2019）。由于网络效应，当代币有大量需求时，其价值可能会增加（Gong, 2009）。\n\n## 证券结算 (Securities Settlement)\n\
  \n在证券交易所或场外平台上，可以买卖证券以获利。一旦交易完成，交易过程并没有结束，而是仍在继续。在确定（清算）交付责任后，双方必须向对方传输各自的证券和付款（结算）。交易的最终结算现在发生在交易日两天后（Adhami\
  \ et al., 2018）。包括经纪商、结算机构和中央结算机构在内的专业机构参与其中（中央结算机构）。当多个系统（孤岛）同时运行时会出现市场碎片，例如在德意志交易所，Eurex\
  \ Clearing 负责清算，Clearstream 负责结算。系统碎片需要系统之间的连接才能正常运行。跨系统交易是复杂且昂贵的结果。\n\n无形资产可以通过使用区块链进行记录，区块链对已执行的交易建立共识。在这方面，理论上区块链可以用于涉及股票的交易。由于证券交易受监管、税法以及隐私限制，此类应用中的区块链需求与加密货币不同。这排除了完全未识别的系统设计。\n\
  \n\n\n\n\n存在许多可能的设置方案。例如，孤岛式（silo）的基础设施可以迁移到区块链。澳大利亚证券交易所（ASX）已经在采用这一策略的道路上。授权参与者和拥有有效权益的人将访问那里的私有区块链（例如监管机构）。如果实施这一解决方案，业务流程和中间环节将几乎保持不变（Caldarelli\
  \ et al., 2020）。如果无法设计并应用通用标准，那么目前的碎片化现状将继续存在。\n\n有了区块链支持的证券交易的可能性，人们可以构想一种极端解决方案，消除大多数中间环节，例如一个完全去中心化的系统，包括结算在内的所有交易都在区块链上进行（Xiong\
  \ et al., 2020）。这类解决方案在下文中进行了详细讨论：\n\n### 全区块链驱动的证券交易的益处\n\n全区块链驱动的证券交易有许多优点。追踪证券的所有权将变得非常简单。此外，可以使用智能合约来自动执行利息和股息支付等程序。与当前系统相比，这种新系统的处理效率将大大提高。不再是目前的交易后两个交易日进行结算，而是可以实现速度快得多甚至是实时的结算。如果证券交付和支付同时进行，结算风险可能会减少或消除。中央对手方的的需求也将消失（Schar,\
  \ 2021）。\n\n中央结算对手方（central counterparty）会累积结算风险，因此可能会在系统中产生“单点故障”，这可能成为一个重大的发展问题。Chiu\
  \ and Koeppl (2019) 开发了一种基于工作量证明法的公共无许可区块链理论模型（Yermack, 2017），它能够同时执行证券交付和支付操作。处理速度是灵活的，因为市场参与者可以支付费用，增加其交易对矿工的吸引力，从而使交易执行得更快。费用产生的现金反过来对于向矿工提供激励是必要的（Huibers,\
  \ 2021）。因此，区块链的容量必须受到限制——只有在发生拥堵时，市场参与者才愿意付费以换取更快的交易处理。Chiu and Koeppl (2019) 估计，在这样的区块链架构上实现市场参与者之间的协调将是具有挑战性的，他们预测可能需要监管的参与。此外，区块链支持的股票交易还伴随着潜在的危险和缺点，除了前面提到的系统设计以及符合监管、税收和数据保护标准方面的困难外（Chiu\
  \ & Koeppl, 2019）。\n\n### 实时结算的挑战\n\n如果只有一个系统，效率的提高将达到最大。结果是这种系统将成为垄断，并带来所有相关问题。转向实时结算还会带来额外的问题和复杂性。首先，需要完成的交易数量将急剧增加。目前，所谓的“轧差”（netting）发生在交易日收盘时，期间会根据当天的交易计算每个清算参与者的净交付义务和交付债权。因此，结算仅限于那些已解决的净额债权。实时处理不允许这种轧差，这意味着每笔交易必须按“总额”（in\
  \ gross）处理，而不是“净额”（net）。由于实时结算的影响，在一天内发起空卖并在一天结束前将其平仓已是不可行的。在金融市场工作的人高度依赖这一选择。他们可能需要维持大量的证券储备，或者在发生实时结算时通过适当的证券贷款交易，证明他们有随时为实时结算进行交付的能力。这可能对股票市场的流动性产生不利影响。\n\
  \n此外，使用衍生金融工具的交易可能会导致额外的复杂性。在这些交易中，市场参与者需要定期提交保证金。这些抵押品为已经发生的损失以及未来的损失提供了保护。价格波动会导致所需抵押品金额发生变化。如果市场参与者无法履行要求，头寸将被强制关闭。在智能合约的情况下，这些操作可以完全自动化并实时完成。这有其优点，因为它减少了交易对手风险，但也有缺点，即市场参与者必须保留手头流动性以备保证金通知（Yaga\
  \ et al., 2018）。上述原因表明，全区块链支持的商业这一“革命性”选择充满了重重困难。预计在未来将采用更具“进化性”的解决方案，即仅机构内部的基础设施迁移到区块链（Li\
  \ et al., 2020）。\n\n## 公司治理\n\n在公司治理方面，Yermack (2017) 探讨了区块链技术的影响。他的逻辑基于证券交易的所有方面都完全由区块链支持的观点。如前所述，这使得追踪证券所有者变得简单。这使得发行人能够以及时且成本效益的方式与股东联系（Yermack,\
  \ 2017）。通过降低股东的投票成本并增强股东大会作为股东论坛的功能，表明区块链技术可能会增强股东大会的功能及其作为股东论坛的作用（Lafarre & Van\
  \ der Elst, 2018）。\n\n由于在前一节所述的法律框架，区块链支持的证券交易在任何情况下都不会是匿名。因此，可以假设监管机构至少了解股东的身份。由于此，内幕交易将变得更容易识别，要以隐秘的方式获取持股并规避监管报告义务将变得困难。这使得市场参与者能够获得公司内部人员（董事交易）可报告证券交易的实时更新，从而在限制内幕交易收益的同时，提高整个市场的信息效率（Sharma\
  \ & Charbathia, 2015）。如果期权也基于区块链，那么管理层期权的重新定价将变得更加困难（Singh et al., 2020）。\n\n\n\n\
  \n\n正如 Yermack (2017) 所预测的那样，欠发达国家可能首批采用基于区块链的证券交易并从随之而来的治理改进中获益（Yermack, 2017）。这是基于这样一个事实：这些国家的现有机构并不特别可信，在他的预测中，与现有的制度结构相比，这使得区块链解决方案的潜在收益更加增加，其他原因如此。\n\
  \n## 结论与未来展望\n\n主要的公共区块链实现（如比特币所使用的）存在资源消耗高和扩展性有限的问题，这是这些系统最严重的两个问题。高资源消耗源于系统内置的激励机制，以及用于达成共识的工作量证明共识技术（Salimitari\
  \ et al., 2020）。通过对每个新挖掘的区块进行支付，达到了一种平衡状态，即矿工有动力投入更多算力，直到他们的边际成本等于边际收益。比特币价格的上涨意味着以电力支出形式存在的边际成本也随之增加。结果，比特币网络的耗电量已经达到了整个国家的用电量水平（de\
  \ Vries, 2018）。\n\n其次，扩展性方面存在困难，因为协议规定了最大区块大小和两个区块之间的间隔是不够的。平均每 10 分钟，一个最大大小为一兆字节的新区块会被添加到比特币区块链中。这被称为挖矿过程。在实践中，这意味着每秒可能只能完成七笔交易。与\
  \ Visa 等传统支付系统的需求相比，其差异大出几个数量级。解决这一挑战可以通过多种方法实现。根据您的偏好，您可以缩短两个区块之间的时间（例如加密货币 Litecoin，其两个区块间隔为\
  \ 2.5 分钟），或者增加每个区块的大小限制（查看加密货币 Bitcoin Cash，目前每个区块为 32 兆字节）。然而，所有替代方案都会增加区块链的大小，从而增加其存储需求，而区块链是在每个单独节点上冗余维护的（Derks\
  \ et al., 2018）。\n\n目前已有资源消耗较低且扩展性更好的 DLT 设计。其中一个例子是加密货币 IOTA，它不依赖于区块链技术使用的链结构。任何想要使用这种币进行交易的人必须确认确认人的交易。使用有向无环图（DAG）来存储这些交易，其基本原理是后续依赖这些交易的比例越高，它们越安全。另一方面，底层的共识过程复杂得多，在没有中央协调员协助的情况下，规模较小的网络中目前无法达成共识（Grabe\
  \ et al., 2020）。\n\n除了理想特性（如去中心化转账和虚拟表示的结合），加密货币还具有任何其他已知支付系统无法实现的特征。尽管如此，我们并不认为在可预见的未来，“真实”加密货币可能被广泛采用（DeVries,\
  \ 2016）。主要原因是，引入一种价值与流通主要货币（法定货币）价值不同的第二种货币，会导致效率的损失。相比之下，稳定币（包括 Facebook 创建的加密货币\
  \ Libra）没有这种缺陷的影响（Saiedi et al., 2021）。\n\n但由于稳定币由传统货币资产组合（如政府债券）支持，稳定币能够使用传统的原始货币作为基准，而不是比特币。智能合约将是区块链技术展示其能力的主要方式（Goodell\
  \ & Aste, 2019）。这些合约允许创建基于广泛共识的精确法律，并依赖于存储在区块链中的状态，因此这些状态现在对所有人可见。结果是，增加了你可选的合同范围。代币发行（ICO）允许较小的投资者在极早期参与公司的成功，使他们能够从专长知识中获益，并鼓励他人效仿。另一个益处是，加密货币在加密货币交易所的交易率远高于在其他早期参与形式中的交易率。平台运营商由于其作为使用权和投资的双重身份可能会从底层的网络效应中受益（Brandao\
  \ et al., 2018）。\n\n## 参考文献\n\n\n\n\n\n## 参考文献\n\n- Baldominos Gómez, A., & Mochón,\
