  \n\n\n\n\n物联网（IoT）一直是长期互联网的基础组成部分，并因其在各种应用中提供令人兴奋服务的巨大潜力，逐渐吸引了研究人员和工业界的关注（Nguyen\
  \ et al., 2020）。物联网无缝地连接异构设备和物体，在任何感知、处理和通信过程通过机械统一执行且无需人工干预的情况下，构建物理生态系统。\n\n区块链将改变数百个物联网设备的可靠且无误的点对点属性，以及高效的自管理网格（Kochhar\
  \ et al., 2018b; Ward, 2017）。在制造工厂中运行的机器（电话公司中的区块链，n.d.）正准备通过区块链进行自我连接和验证，以引导生产流程。物联网传感器通常携带有有关核心资产或对企业常规客户影响的敏感信息，这使得知识和网络安全成为物联网属性至关重要的价值支柱，因此网格的大小定义了网格路由和控制的复杂性，导致了变化的系统格局，而没有标准的平台（`Za_TMT_Blockchain_TelCo.Pdf`,\
  \ n.d.b）。\n\n## 5G 技术实施\n\n相反，5G 必须谨慎使用，以确保通过这些互连设备建立的信息是可靠的且不受恶意行为者的干预。市场参与者渴望这种安全、防篡改、分布式、透明并允许信息传输机械化的技术。区块链使\
  \ 5G 能够通过一个连接所有设备的机密数据源，将其想象力转化为能力。5G 技术的实施是另一个可能从区块链精简流程流程中获益的实例（电信行业中的区块链用例，n.d.）。为了实现\
  \ 5G 在各种网格中无处不在的接入承诺，电信提供商（CSP）需要处理不同的接入节点和各种接入设备，其中为每个用户或机器选择最快接入节点是未来需要关注的挑战（Keil,\
  \ 2018）。区块链使新一代接入技术和机制能够构建可持续的解决方案（电信区块链，n.d.）。给定区域内的 3GPP（`LTE`、`GPRS`）和非 3GPP（`WiMax`、`WLAN`、`WiFi`）接入网络可以通过区块链联网，每个接入点（WiFi\
  \ 路由器、运营商基站等）将作为网络中的一个节点，监控设备（Syal, 2022）。\n\n不同接入网络之间的规则和合约在许多情况下被编码为智能合约（Zahariev\
  \ et al., 2016）。这些协议在功能上是动态的，任何策略都可以进行改进。当一个设备通信其特征时，它通过相关的 CSP 基站识别到组织中；当该设备通信其区域/位置时，会调用为设备提供最佳支持的接入节点来执行操作（LinkedIn,\
  \ n.d.）。这同样考虑了各种接入节点之间所有服务的一致评级和收费，例如，假设来自办公室或家庭组织的 `WLAN` 已为设备提供接入权限（区块链 & CSP\
  \ - 数字智能软技能，n.d.）。然后，CSP 可能会根据受惠组织或家庭的接收相应地减少账单金额。基于区域的管理也通过成为这一区块链设置的一部分而获得授权，该设置通常知道哪些设备在附近（Zahariev\
  \ et al., 2016）。\n\n表 1. 描述区块链对 5G 和服务的潜在用途的特征基础\n\n| ![Figure978-1-6684-7808-0.ch005.g01](img/ch005.g01.png)\
  \ |\n| --- |\n\n## 5G 网络：可靠性与覆盖\n\n*   • 5G 小区密度需求（因为 10-100 米之间的微小波动）可能要求运营商高效地掌握自己的权力并实现这种超密集网络（5G\
  \ 中区块链的案例，n.d.）。区块链网络将在同一网络的基站中提供安全的点对点通信，这可能依赖于用于 AI 算法的网络功能信息，以自组织网络（SON）的形式建立，以协助管理和优化无线接入网络。网络中的任何进展将作为\
  \ SON 规则引擎中由区块链启用的智能合约执行，这通过配置网络或更改网络配置来建立。\n\n*   • 通过共享 5G 组织资源（例如，通过网络切片或范围共享）支持的未来行动计划可能会促使一种依赖需求机制的基础。基于区块链的网络切片经纪人和请求安排，结合现有的\
  \ AI 驱动的 SON 技术，将促进导航前景，以交付闭环自动化愿景的产品。\n\n*   • 其他潜在用途可能包括用户设备在 Wi-Fi 和 5G 连接之间建立持续的的切换，以实现简化的记录关联。在管理此执行过程方面，许多服务供应商将建立自己的区块链模型，以实际的方式讨论此类活动的身份验证和管理。\n\
  \n| 图 6. 5G 实施构建可持续解决方案 |\n| --- |\n| ![Figure978-1-6684-7808-0.ch005.f06](img/ch005.f06.png)\
  \ |\n| --- |\n\n随着区块链上持续、透明、永久事实的可用，电信管理员在组织中建立了单一事实来源。这些分布式账本记录的安排有助于消除单点故障风险。区块链和智能合约可以实现内部循环的大量自动化，例如收费、漫游和存储网络板（良好的供应链管理）（电信行业中的区块链用例，n.d.）。如今这些电信领域的交易需要通过一个结算中心过程进行认证。智能合约自动化了这一周期，并确保成员之间的结算，通过从一个运营商区块链引导到下一个运营商并向终端用户扩大透明度。漫游授权者向任何电信公司发起语音请求。\n\
  \n区块链技术通过赋予自动化、效率和最新的行动计划彻底改变电信行业。这些区块链用例是电信领域知识的根源。随着行业参与者为 5G 做准备，电信领域的区块链用例正在演变，包括通过区块链支持的电信基础设施中心创建灵活、灵活且按需的交易与获取模型，通过移动钱包通过区块链进行的支付，设备身份、安全管理以及在网络中通过边缘设备进行\
  \ 5G 网络租赁管理的最新框架共享模型（`Blockchain-5g.Pdf`, n.d.b）。\n\n| 图 7. 电信中智能合约的流程 |\n| ---\
  \ |\n| ![Figure978-1-6684-7808-0.ch005.f07](img/ch005.f07.png) |\n| --- |\n\n\n\n\
  \n在回顾中，有一种在克服已遗弃的困难的同时利用区块链特性的冲动：\n\n### 优势\n- a. 区块链赋予了信任，进一步发展了不同参与者之间的同步，消除了外部干预，因为它允许对交易和负债进行共享视图，从而降低成本投入。\n\
  - b. 它作为单一数据视图运行，而不是跨不同框架进行固化的限制。它还允许在账本中呈现的所有交易账户形成可靠的审计轨迹。\n- c. 在漫游及其他用例中执行智能合约允许近乎实时的充值，从而提供了更好的收入保障并减少欺诈。\n\
  - d. CSP（云服务提供商）具备在收入增长阶段使用最新行动方案的能力，以在其业务的高层和核心关注领域寻求增长的新途径。\n- e. 根据记录的区块链提供了一个面向多个参与者及客户的通用平台。\n\
  \n### 挑战\n- a. 由于区块链持有通常可验证的数据，每个节点上的区块链范围可能会变得不合理。总而言之，必须研究一种记录可验证信息的系统。目前，区块链领域的领先电信运营商正在研究这方面的许多区域单元选择。\n\
  - b. 在信息划分的构建和传输方面，适应不同的现有数据标准可能会成为区块链创新的一个潜在障碍。\n- c. 在数字等安排的执行中已经描述了一种清晰的行政结构。智能合约（`Za_TMT_Blockchain_TelCo.Pdf`,\
  \ n.d.）是印度执行区块链更重要的测试。\n\n| 图 8. 区块链技术在印度的挑战 |\n| --- |\n| ![Figure978-1-6684-7808-0.ch005.f08](img/ch005.f08.png)\
  \ |\n| --- |\n\n## 结论\n5Gset 是区块链的加速器，它是 5G 架构的护甲。这增加了在边缘云内部区块链架构平台的需求，以便策略获取 5G\
  \ 终端的可识别证明、支付交易和机密传输。区块链可以提供建立信任、加速数据交换、降低成本、提高安全性、确保问责和不可篡改性、高效供应链、通过智能合约实现自动化以及去中心化等优势。然而，基于区块链的物联网将面临高存储容量和可扩展性、高处理能力和时间需求、新的安全和隐私挑战以及法律问题等挑战。\n\
  \n区块链在印度的机会是充足的，对于一种在保护交易的同时在多个范围内节省资金和时间的扩散策略来说，它是必要的。尽管在交易管理中，只有 54% 的人认同对区块链的需求，因为相关意识较低。随着越来越多的国家政府、监管机构和组织通过区块链改变其工作效率，这决定了印度在节省时间和精力方面将更具优势。区块链在印度已开始在不同领域应用，尽管这可能需要投资来获得社会的认可并在日常交易的各种干预中实施它。\n\
  \n最终，这项研究表明，方法和指南将有助于推动印度区块链环境的发展和更多的技术进步。印度在塑造区块链环境方面采取了谨慎策略，即印度仍处于为区块链环境提供坚实行政指导的时间阶段。行政环境需要一种咨询方法来发展印度的区块链创业企业环境和进步。\n\
  \n## 未来研究方向\n未来的研究人员可以发现提高意识以及利用区块链的机会。这项研究关注特定的地理区域以及理解不同群体行为安排方式的其他地区。在印度，三家主要的电信巨头被认为正在快速实施区块链技术。Airtel、Vodafone\
  \ India 和 Reliance JIO 开启了这一周期，而 Vodafone 处于 POC（概念证明）阶段。而 Airtel 处于基础阶段并正在进行研发过程。此外，Reliance\
  \ Jio 已安排了不同的小组协调区块链以促进新的用例和应用（`www.ETTelecom.com`, n.d.）。\n\n1. 现有电信基础设施拓扑与电信运营商的增长路径。\n\
  2. 终端客户对使用区块链的需求。该客户可以是内部的也可以是外部的。\n3. 交易的速度类型。\n4. 合规性，即数据隐私和服务器位置。\n5. 要求的交易规模和速度。\n\
  6. 对智能合约的需求。\n7. 将区块链与人工智能或其他技术整合的机会。\n\n电信行业今天可能尚未准备好公共或混合区块链，但建议从私有链开始，逐渐发展到为内部和外部客户提供全面的区块链产品和服务。这项研究是由我们对关注区块链与\
  \ 5G 网络结合的研究重点的详细概述推动的，这将引出可能的研究方向，它们在随后的研究中应视为：\n\n```\nIntegrating Machine Learning\
  \ With Blockchain for 5G\n```\n\n\n\n\n\n区块链技术中的提示词改进将为人工意识应用开辟新的领域（Nguyen et al.,\
  \ 2020）。机器语言技术的兴起通过赋予其实现事实性数据和提供信息驱动体验的能力，改变了当前的 `5G` 治理，并提供了主要的支持和预期。`MI`（机器智能）的这些优势可能会改变用于服务\
  \ `5G` 时代感知管理的信息分析技术。例如，机器学习可以连接偏远地区以进行资源管理和用户管理。`ML` 在信息热点披露方面也显示出巨大的潜力，可以预测数据使用处理以创建控制机制，例如用于网络拥堵规避的数据流量评估或用于安全保护的用户访问跟踪。近期，它发展了协调人工智能与区块链以用于\
  \ `5G` 用例的趋势。例如，`DRL`（即深度强化学习）已研究并与区块链融合，赋予 `5G` 网络中执行器和小组安全且智能的属性。建议使用高级 `DRL`\
  \ 计算来精确调查当前无线网络中的地理位置、信道任务以及障碍，然后选择合适的远程访问模式（即蜂窝网络、`V2V` 或 `D2D`），以进一步提高通信程度、降低能量消耗或提高用户参与。在此，区块链提供了一个安全的去中心化过程，工作报告和组织设计可以与协作网络决策的同步边缘服务器一起重建，并增强稳健性（Nguyen\
  \ et al., 2019）。其他重大工作还表明，协调区块链的深度强化学习结构可以在网络技术进步的情况下，实现不依赖可靠网络信道选择的适应且安全的计算。\n\n\
  ## 为 5G 大数据设计的区块链\n\n在数据爆炸发展的这一阶段，海量数据已成为 `5G` 领域研究的热点话题（Nguyen et al., 2020）。目前\
  \ `5G IoT` 设备产生的海量传输数据可能已经利用了不断变化的相关应用。例如，通过处理计算解决方案的数据检查和数据提取。分布式计算管理程序提供了高存储能力，这将解决先进\
  \ `IoT` 数据汇总和分类的发展问题。然而，海量数据的发展将面临转型性的挑战，从数据保护运行到访问管理由于极其隐蔽的数据窃取导致的安全漏洞。此外，云/边缘计算上的海量数据分析在尖端功能和业务环境中还面临网络攻击的风险。在这样的框架下，区块链是为信息问题确定最佳解决方案的理想账户。事实上，与区块链验证和信任相关的去中心化管理将为大数据数据资源提供高安全保障。在这些统计中，区块链为网络提供者和数据所有者之间的大数据划分提供了透明度和质量。通过消除安全瓶颈问题，区块链将改变涉及\
  \ `5G` 大数据部署的大规模通用数据交易。近期，某些大数据模型赋予了区块链可预测性，类似于向大合约传输数据、用于大数据安全的执行器访问控制，或用于大数据分析的安全保护。这些初步结果表明，区块链在\
  \ `5G` 时代将在安全和性能改进大型数据应用方面获得竞争性的优势（Lampropoulos et al., 2019）。\n\n## 用于 6G 的区块链\n\
  \n后五代（`B5G`）架构在某些地方被称为 `6G`，其出现是为了提供比 `5G` 更好的性能，同时也满足了 2030 年代未来通用应用的极高要求。`6G`\
  \ 的重要驱动因素可能是过去众多元素的结合，如网络加密、高输出、极高稳定性、低功耗率和巨大的可用性。正如所示，`6G` 无线配置旨在服务海量用户网络和数千比特信息传输，并具有超高质量、软延迟交互（约\
  \ 10 秒），外支持水下和空间通信（Chowdhury et al., 2020）。这些 `6G` 网络还预计通过现代先进技术的扩展，实现由各种创意应用实现的最新自动化值。这些新服务可能包括智能可穿设备、植入物、完全独立的通道、增强现实设备、3D\
  \ 规划、智能生活、太空旅行、纳米物联网（Web of Nano-Things）和远程海洋探测。为了在 2030 年实现此类应用，智能数据社会可能通过 `6G`\
  \ 满足各种严苛的技术需求。高安全和隐私是 `6G` 极其核心的元素，无线研究领域可以确实专注于这些点。凭借其广阔的安全能力，区块链预计将在未来 `6G` 网络的有效发展中发挥关键性作用。因此，区块链可能提供从去中心化、保护、透明化到安全和无外部者可检测的各种安全管理，这不仅将带来\
  \ `6G` 网络安全性的提升，还将确保未来变化的移动服务取得进步。联邦通信委员会（`FCC`）建议区块链将是 `6G` 网络的关键创新。例如，基于区块链的频段共享被认为是\
  \ `6G` 提供进一步安全、智能、低成本且具有极高效去中心化范围共享的有利创新技术。同样，区块链可以授权在安全的去中心化记录上对量子通信和处理、原子交换以及纳米物联网进行安全和保护。\n\
