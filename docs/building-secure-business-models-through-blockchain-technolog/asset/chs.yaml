  \n| ![2327-3275](img/2327-3275.png) || \n\n\n\n### 使命\n\n信息系统和业务分析的成功开发和管理对于组织的成功至关重要。新的技术发展和数据分析方法使组织不仅能够改进流程并提高生产力，还为企业提供了一个在信息时代降低成本、规划未来和保持竞争优势的平台。\n\
  \n《商业信息系统与分析进展》（ABISA）丛书旨在介绍业务系统和分析在开发、部署和管理方面的多样化且及时的研究，以持续发展。\n\n### 范围\n\nIGI\
