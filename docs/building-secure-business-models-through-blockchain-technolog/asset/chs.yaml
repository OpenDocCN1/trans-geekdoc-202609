  \ |\n| --- |\n| *来源：Liyanage (2020)* |\n\n## 身份管理\n\n如今，护照、驾驶执照等身份文件用于“了解您的客户”（`KYC`）等流程受多个第三方代理控制。虽然这对于电信公司以及整个\
  \ CSP（服务提供商）系统来说是一个至关重要的方法，但它带有滥用和泄露风险的负担，导致无法安全和简单。\n\n区块链解决方案将允许这些文档的去中心化存储，并将剩余部分完全由个人管理，让个人灵活地共享文档，并以不可更改的方式在关联中记录此类事件，这不仅有助于减少伪造实例，还能遏制虚假文档的提交。随着电信运营者适应来自数字世界和\
  \ 5G 的产品和服务，区块链解决方案是提供这些功能的唯一关键。\n\n区块链解决方案将允许这些文档的去中心化存储，并将剩余部分完全由个人管理，让个人灵活地共享文档，并以不可更改的方式在关联中记录此类事件。由于这种方式是不可更改的（在链上），它将以一种不可更改的方式记录此类事件，这不仅有助于减少伪造实例，还能遏制虚假文档的提交。随着电信运营者适应来自数字世界和\
