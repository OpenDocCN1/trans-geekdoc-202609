  \n\n\n\n在本文中，提出了一种基于颜色变换与卷积神经网络（`CNN`）相结合的方法。通过对颜色变换预处理后的图像进行处理，具有固定层和可学习层的 `CNN`\
  \ 已经取得了良好的效果。我们所使用的 `CNN` 具有以下优点：首先，固定层可以减少分类器需要处理的区域数量，从而显著提高检测速度。其次，固定滤波器生成的 `ROIs`\
  \ 与交通标志的边界非常接近，因此避免了对齐问题；否则，监督卷积网络的性能将会下降。第三，事实证明，通过监督方式学习的具有适当架构的 `CNN` 适用于提取交通标志分类的特征。我们的实验结果强有力地支持了我们的结论。\n\
