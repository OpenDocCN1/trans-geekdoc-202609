  \ | 促进去中间化 |\n\n# 零售业的关键问题\n\n### 消费者预期变化\n消费者预期是零售业必须应对的许多波动因素之一。事实上，消费者预期似乎变化得非常快，很难跟上。要在一夜之间改变消费者的口味，起的因素太多了。例如，大部分消费者今天可能喜欢某件产品，但第二天他们可能有不同的意见，有些甚至可能不再喜欢该产品了。季节性变化、活动、节日和趋势都是其中的重要因素。因此，零售业必须足够敏锐以理解所有这些信息。然而，今天实现准确预测仍然是不可能的。\n\
  \n### 零售价格通胀\n如今，消费者必须为基本需求花费更多的资金。由于由于，个人可用于任何奢侈品的资金经常减少。然而，不稳定的零售价格和高昂的价格标签进一步阻碍了买家的购买。因此，零售商必须提供特别优惠或折扣来吸引购物者购买商品。\n\
  \n然而，零售业务目前无法承受这些高昂费用。但为什么呢？换句话说，不恰自动化和规划可能导致制造成本增加，从而导致零售价格上涨。\n\n### 失效的现代营销策略\n\
  是的，许多零售机构日益将在线营销整合到其运营中。然而，由于缺乏该领域的必要知识，他们投入了大量资金却几乎没有结果。你可以通过多种方法向客户销售产品；你不应该将自己限制在社交媒体上。\n\
  \n如今，消费者喜欢与其个人品牌进行一对一互动。如果你不能提供这种功能，他们可能会对你的品牌失去兴趣。再次，零售业务可能会过度营销商品，导致更多不快乐的客户。\n\
  \n### 假货与伪制品\n该行业面临的最大问题之一是欺诈和假货的兴起。内部欺诈活动也会影响收入，市场上有太多假货，这损害了零售机构努力建立的声誉。\n\n与大众认知相反，识别假货变得越来越困难，这让客户变得越来越愤怒。如果问题得妥善解决，客户和零售商都将继续亏钱。因此，零售商需要尽快处理这个问题。\n\
  \n### 网络攻击\n网络黑客攻击频率的增加是零售商面临的另一个障碍。大多数零售机构实际上采用了非常不安全的客户端-服务器网络方法。因此，入侵服务器并窃取机密数据是一个相当的过程。此外，由于每个零售商都存储了客户信息，操纵这些信息并获取其信用卡或银行账户详情相对容易。这很容易演变成严重的安全漏洞，并导致巨大的收入损失。此外，这表明客户在数据方面对你并不信任，这对你的业务是有害的。\n\
  \n# 区块链如何解决零售供应链管理中的问题\n\n尽管金融行业已成功使用区块链技术多年，但区块链技术具有颠覆许多其他行业（如零售业）的潜力。在零售供应链管理中应用区块链技术的一些优势如下：\n\
  \n### 客户数据管理、安全与共享\n零售商经常注册、存储和使用大量的客户数据。在他们的工作领域，简化操作的区块链应用代表了一个探索较少但极具潜力的话题。利用分布式账本技术将提高安全性，允许用户对数据有更多控制，并开启新的营销可能，帮助商户更有效地满足客户需求并获得他们可能错过的价值。通过人工智能推荐系统，零售商将能够识别客户需求并向他们投放高度定制的折扣。零售商可以通过向愿意开放数据的用户提供店内可用代币，以换降低广告成本。\n\
  \n通过利用数据共享网络的智能合约形式向零售商发送购物清单，客户也可以就他们的需求与商户交流。当物联网将订单执行和配送分配给计算机时，区块链可以作为未来全自动购物的主平台。\n\
  \n### 支付变革\nOverstock 是 2014 年第一个接受比特币支付的在线商家之一。现在各种规模的在线商家都在接受加密货币支付，但数字钱包和加密货币支付在零售业被广泛接受还需要一段时间。由于比特币价格的波动，大多数在线商店也经常接受传统支付方式，有些人则发现实施具有挑战性。这意味着这一在线支付领域的潜力在很大程度上尚未被实现。\n\
  \n\n\n\n愿意尝试加密货币支付的零售商将开启新的收入来源，并吸引来自全球的客户。区块链技术的另一个益处是，它允许企业更自主地控制客户分发和使用优惠券及折扣。例如，`MasterCard`\
  \ 已经申请了一种使用区块链技术验证折扣的系统专利。得益于该计划，零售商可以更有效地提供极具针对性的折扣，并避免优惠券滥用。为了增强其奖励忠实客户的计划，美国运通（American\
  \ Express）目前正在尝试区块链技术。协助商店加速在线支付并减少欺诈，是区块链技术最令人关注的前景用途之一。\n\n## 改进客户身份管理\n\n如你所知，大多数零售业务仍使用非常不安全的客户端服务器网络方法。由于由于，操纵这些数据并获取客户的信用卡或银行账户详情很容易。这是对隐私的公然侵犯，也是对法律的违反。\n\
  \n零售行业的公司可以使用区块链来保护客户数据以解决这一问题。事实上，他们可以验证系统并将所有数据存储在不可变的存储中。结果是，客户将能够访问自己的信息，而外部人员无法黑入系统并滥用这些信息。\n\
  \n## 规范零售销售税\n\n降低零售销售税的做法是区块链在零售领域的另一个益处。实际上，销售税是所有零售业务的年度要求。然而，许多人试图逃避这笔高达 145\
  \ 亿美元的税款！此外，大多数税收欺诈行为是由互联网企业实施的。如果这种情况持续发生，公司可能会被指控为犯罪。\n\n基于区块链的自动化销售税征收可以通过根据销售额或产生的利润帮助征税，从而解决这一问题。零售商还可以上传他们的文档，由网络随后进行验证。这种方法非常出色。\n\
  \n## 个人与商户之间的交易\n\n许多零售商已经在努力使用这一神奇的区块链功能。区块链可以实现实体店中的点对点交易。实际上，双方都从支付流程中获益。不利用任何第三方应用程序直接从客户处收取资金的益处在于，客户不需要为使用其他第三方金融服务支付更多费用。此外，这可以促进双方之间持续的信任，这对零售业务极其有利。\n\
  \n## 减少伪品\n\n对于高端消费品制造商而言，假货的销售会导致高端商品价格下跌，从而导致生产者和零售商遭受重大损失。对于这类问题，区块链提供了一个简单且经过验证的解决方案。通过允许区块链数字账本记录所有关于每个产品的信息（包括伪品），可以防止伪品的扩散。因此，在这些情况下，当最终用户收到货物包裹时，尝试使用一个完全刻在产品上的代码，这样你就可以访问存储在区块链虚拟账本文档中的所有数据，从而保护易受产品假侵害的零售商。\n\
  \n## 物流\n\n同样的基于区块链的记录工具将使物流追踪变得更容易、更有效。物流专家和客户将能够检查并更新构成订单履行交易的区块，而不是依赖不准确且异步的数据库。\n\
  \n区块链驱动的物流通过仓库员工在准备发送产品时扫描标签得到了证明。在区块链上进行扫描提供了不可篡改的记录，这与当今大多数仓库的初始步骤不同。如果你的生态系统中的每个人都有访问权限，制造商可能扫描了同一个标签，更新同一个区块链，你和你的客户将通过读取它来获取相同的信息。供应链中的任何节点都可以通过扫描产品（例如）来启动智能合约（一种无需人工参与即可运行的程序），从而自动完成电子跨境海关报单。基于区块链的物流的逻辑结果是信任。当人们知道从工厂到仓库再到客户家中，每个人都能访问相同的信息时，他们会感到安全。\n\
  \n## B2B 和 B2C 智能合约\n\n在你零售业务中使用任何软件的地方，你都应该考虑转向智能合约。B2B 交易将完全自动化，而 B2C 交易将受益于根据一套标准调整的定制体验。智能合约是区块链技术的“核心内容”。它们将使用以前所未闻的方法来实现数据流的自动化。\n\
  \n与传统软件不同，智能合约可以在没有用户输入的情况下运行。这类 B2B 和 B2C 交易可以通过智能合约实现自动化，智能合约将接管控制并执行你预定义的命令。区块链最吸引人的潜力被封装在智能合约之中。工程师未来可能会用这些合约取代目前的巨云，以实现所有数据的去中心化。\n\
  \n## 促销与优惠券\n\n没有理由将自己限制在内部使用的文档上。区块链还可以产生优惠券并为你的商品提供折扣。同样，你可以利用区块链的安全性和不可变性更准确地组织你的促销活动。由于你能够不断意识到分发了多少张优惠券以及消费者使用了多少，你将能够计算出每个活动对业务的精确影响。在区块链上运行促销活动具有额外的品牌优势。一旦你的客户意识到你正在设定一个重要的领先趋势，你的优惠券将焕发出新的色彩。\n\
  \n## 无纸化\n\n你可以将商品提供的任何保修服务作为区块链上区块的链接，而不是制作物理纸张来代表。为了防止未来更改文件，外部文件将具有一个可以与区块对比的\
  \ `checksum`。\n\n实现无纸化并用其增加品牌的绿色信誉，考虑到去年纸张需求超过了 3.99 亿吨，这将让你感觉良好。你还将获得额外益处，即你所有的文件都通过相同的防伪程序。你可以编辑一个区块来管理记录，而不是打印一张容易复制的纸张。\n\
  \n\n\n\n互联网“使去中间化成为可能，并从根本上改变了企业分发商品和服务的方式” (Buhalis & Licata, 2002)。通过消除对现有中间商的依赖并创建新类型的电子中间商，新技术已经取代了过时的贸易实践\
  \ (Cort, 1999)。由于互联网的发展，新的在线中间商也运而生，提供各种商品和服务 (McCole, 2004; Pineda & Paraskevas,\
  \ 2004)。提供信任是新型电子商务中间商提供的服务之一。\n\n社交媒体的普及也凸显了企业在 Facebook、Twitter 和 YouTube 等平台与与客户互动有多么重要。这些平台依赖数据和目标广告来盈利，而不是依靠内容和服务的用户费用。此外，根据\
  \ Nieves and Diaz-Meneses (2016) 的观点，“他们开发了一个正反馈循环，其中消费者参与度的增加会导致专业知识的提高和内容整合的改进。”数字中间商获得了将企业和客户锁定在其专属平台上的能力，同时通过对品牌和产品进行个性化为他们提供帮助。\n\
  \n### 客户画像的变化\n\n一个国家的经济、社会、法律和政治变化，以及最关重要的技术变化，可能会导致客户心理特征发生重大变化。客户的购买行为永远不是静态的，因此根据组织\
  \ Project Guru 的一些研究，在他们看来，追踪这些行为似乎是一项简单的工作，但事实并非如此。今天，收集和保存此类复杂且量的数据对于营销人员来说是一项重大挑战。\n\
  \n与多家商店合作的营销人员将实施区块链解决方案。区块链技术可以用于零售商创建复杂的信息存储系统，因为存储在分布式账本上并从中检索的数据都是永久记录。这些信息随后可以用于预测特定社区的特定需求，建议并存储足够的货物，并改进其准时库存设施。在所有零售商都使用当日达或同小时送货的现代电子商务世界中，产生的信息量是巨大的。区块链作为最有效的平台，是因为它可以存储和检索持续信息，并拥有可以预测客户下一次购买行为的算法。分布式账本系统通过其计算网络已经产生了一个重要的影响因素。\n\
  \n### 透明度\n\n客户、零售商和供应商可以看到存储在区块链中的数据，并能够查看产品供应情况、是否使用了童工，以及是否存在任何有害或隐藏的成分。这些细节有助于零售商和客户对产品做出决策。这种由区块链增强的透明度可以更准确地识别客户行为模式。\n\
  \n### 忠诚度\n\n区块链通过安全地存储客户信息（如优惠券和折扣），使忠诚度计划现代化，并让所有或特定的零售商对客户数据进行更深层次的分析。感谢区块链忠诚度保证，客户可以在一个地方阅读来自所有零售商的所有忠诚信息。\n\
  \n### 使用区块链技术的零售公司\n\n如今的零售客户对卖家提供数据的真实性或对商品的陈述更加怀疑。另一方面，如果商店能够以无法引起争议的方式提供信息或声明，将有助于商店获得消费者的信任。在此处使用区块链技术将非常有益。以下企业正在利用区块链技术——\n\
  \n### 沃尔玛\n\n沃尔玛正在创建基于区块链的零售食品可追溯系统。为此，他们正在利用 `Hyperledger Fabric`。他们目前正与 `IBM`\
  \ 合作，为该解决方案获取必要的的技术支持。零售巨头已经完成了两个成功的区块链概念验证计划。他们声称区块链可以帮助他们维持食品质量并防止任何负面影响。\n\n\
  ### 亚马逊\n\n亚马逊正在充分利用区块链技术的潜力。在他们的广告业务中，目前正在使用区块链。实际上，因为这可以极大提高他们的效率，这是对区块链属性的有效利用。此外，在销售如“区块链即服务”之类的区块链解决方案时，他们根据客户需求提供网络创建。\n\
  \n#### 阿里巴巴\n\n基于区块链的零售解决方案是阿里巴巴正在研究的内容领域。该公司利用区块链技术来增强产品的可追溯性。此外，他们已经在区块链上创建了 `Kaola`\
  \ 跨境电子商务平台。所有的海关申报、物流信息和产品注册将通过该平台进行跟踪。他们计划借此通过二维码来打击假货。\n\n### 奥迪\n\n奥齐正在使用区块链来控制其零售供应链。目前，他们正在利用技术验证其企业采购。通过\
  \ `Verifish`，他们正在监控既可持续又有机的爱尔兰海鲜。该项目由 `Verifish` 开发，并得到了 `BIM` 的帮助。该项目将持续一年，但公司希望在\
  \ 2021 年之前完成。\n\n### 挑战\n\n由于区块链技术仍处于婴儿阶段，仍处于开发的概念验证阶段，且很少有基于区块链的系统在工业规模上部署，其真实风险可能在更广泛应用之前的若干年后变得显现。在使用这项技术之前，应该对其进行彻底研究；不应做出草率的决策。系统性风险可能会导致灾难性的后果。作为一种共享账本系统，区块链还将持有敏感数据。\n\
  \n### 法律与标准\n\n区块链目前受到的监管很少 (Kumar & Mallick, 2018)。区块链的应用面临着法律法规的巨大障碍。没有这些法律，供应链将无法依赖该技术\
  \ (Kamilaris et al., 2019)。缺乏监管也是一个问题，因为尚不知道系统应该如何设置，而且新规则可能随时实施，从而对已建立的系统进行修改。2019\
  \ (Saberi et al., n.d.) 缺乏标准导致区块链实现多样化，且互操作性差 (Tribis et al., 2018; Kesharwani,\
  \ 2019)。\n\n### 安全\n\n原始区块链拥有透明的数据。由于其设计初衷是如此，每个人都可以访问数据。然而，必须限制访问，因为某些数据对供应链来说是私密的。区块链默认并不支持这一点，实施起来具有挑战性。这一点已被某些区块链（如\
  \ `Hyperledger`）认可，它实现了访问控制 (Rabah, 2017; Behnke & Janssen, 2019))。\n\n\n\n\n尽管区块链被认为是一种非常安全的技术，但它确实存在一些缺点。虽然\
  \ 51% 攻击通常是不可能的，但它仍然有接管整个区块链的潜力。这发生在某一方通过获取池中 51% 的算力来控制区块链时。算力的类型可能根据验证技术而异。对于工作量证明（PoW），需要\
  \ 51% 的处理能力（Aliyu 等人，2018；Mohsin 等人，2019）。此外，区块链还存在某些设计上的问题。如果你“丢失”了私钥，就无法“找回”它，因为它们既至关重要又过于轻量。由于节点之间通信机制，用户必须等待一段时间，才能确定交易已在区块链上成功完成。\n\
  \n## 采用\n\n要说服各方合作并投入时间和精力开发区块链系统，是一项具有挑战性的任务。尽管这可能会显著提高未来的竞争力和可能性，但其成本和风险都是巨大的（Kesharwani,\
  \ 2019）。大多数区块链技术仍处于实验阶段且未经证实（Rabah, 2017）。如果要使用区块链，就需要创建新的 IT 工具。供应链中的某些人可能会认为这具有挑战性（Saberi\
  \ et al., 2019）。此外，由于区块链具有颠覆性技术的潜力，现有的遗留系统可能需要更改甚至更换（Saberi et al., 2019）。\n\n##\
  \ 管理\n\n供应链实践的成功很大程度上取决于高层的支持。另一方面，管理人员可能缺乏长期奉献精神来鼓励新技术的采用并维持可持续性。\n\n知识和奉献的缺乏将危及如何花费资金和分配资源的决策。在缺乏适当公司政策的情况下，采用区块链将面临挑战性，因为区块链可能会改变组织文化（Saberi\
  \ et al., 2019）。此外，区块链可能会改变企业互动和开展业务的方式（Edwards & Chan, 2019）。由于自动化和中间环节的消除，区块链将大幅减少人工干预，这将导致就业流失。然而，采用区块链需要开发新的职位、职责和知识。一切都必须受到控制（Saberi\
  \ et al., 2019; Kamilaris et al., 2019）。\n\n## 建议\n\n根据德勤的报告，希望从区块链中获益的企业应该谨慎对待。他们建议从“试点项目”开始，突出区块链技术对特定公司模型的益处。在更广泛使用区块链之前，他们认为“实验、等待和观察”是明智的。他们建议所有企业主妥善设计区块链集成，但更关键的是……\n\
  \n如果你是一个零售商，你可能想考虑创建一个使用区块链技术的忠诚度计划，或将现有的忠诚度计划转换为与区块链系统协作。通过这种方式，你可以亲眼看到区块链在你的业务模型中是如何运作的。在规划促销活动时，请记住区块链技术的优势：你清楚送出了什么，没有人能伪造，而且你代表自己为一家技术领先的公司。这对你的业务来说是一个双赢局面，而且成本可能比你预期的要得多，因为大多数区块链技术代码已经在\
  \ Github 等网站上以开源许可提供。作为零售商，你还应该考虑区块链如何影响像《通用数据保护条例》（GDPR）之类的隐私法规。未来，得益于区块链在共享区块链上存储个人数据偏好的能力，客户可能查看哪些企业访问过或可能访问他们的数据。即使这是一个长期因素，零售商也应该意识到这一点。\n\
  \n## 结论\n\n营销是经济的基础组成部分。从营销功能来看，这种具有颠覆性的区块链技术受到的关注较少。尽管区块链在许多不同行业中得到了研究，但尽管具有巨大潜力，它在营销领域的应用却并不关注。考虑到区块链与营销整合之间存在空白，区块链技术的出现彻底改变了社会、财务和技术的发展。尽管最初被称为颠覆性技术，但区块链现在被认为是一种可靠且安全的技术。\n\
  \n当你读到这里时，区块链仍处于早期阶段并不断发展中。然而，毫无疑问，它可以增强供应链的协作和透明度。拥有清晰供应链的零售商有机会提高运营效率、塑造更强大的品牌形象并提供极大改进的客户体验。\n\
  \n本文涵盖了区块链技术以及它的一些主要特征和优势。这项技术仍在发展中，在众多企业和领域有广泛用途，并已准备好变革世界。然而，它也面临着若干困难，其中一些已经被承认。区块链是支撑比特币的技术，但它在金融行业之外也有用途。零售行业将通过提高产品透明度、改进供应链管理、提升忠诚度系统、防伪以及其他因素开始从区块链中受益。\n\
