  \ 3 年行业经验。他通过在知名期刊上发表大量论文为该研究领域做出了贡献。`9886d5e2-ce98-4284-95a9-a1e14be8dba4`\n\n\
  ### Manjushree Nayak\nManjushree Nayak 是印度奥里萨邦 NIST 科学技术学院（NIST Institute of Science\
  \ and Technology）的助理教授。曾在恰蒂斯加尔邦邦赖尔的 MATS 大学工作过六年。她拥有 18 年的学术和行政工作经验。她完成了计算机应用与 IT\
  \ 博士学位，并获得了 MCA 和 PGDCA。她的兴趣领域是`Bigdata, Machine Learning, Soft computing, Wireless\
  \ networking, Deep Learning, Data Analytics`。她在 Lambert 出版社出版了两本书。她在国家和国际期刊上发表了\
  \ 25 多篇论文。她曾在国家和国际会议上发表过论文，是印度科学大会（Indian Science congress）和国际工程师协会（International\
  \ Association of Engineers）的终身会员。`ae14199e-5a3e-4a05-ba56-8a1bad6ca0df`\n\n### Uma\
  \ Pandey\nUma Pandey 完成了旅游管理博士学位。目前担任 Lovely Professional University 旅游与航空领域的助理教授。她的兴趣领域是旅游形式、消费者行为、文化遗产和航空管理。`0817be29-57aa-403e-9eee-6255436e93a6`\n\
  \n### Bhanu Parganiha\n`c5c14822-9ca2-4601-af75-77d091f55661`\n\n### Ravikiran Patnaik\n\
  B. Ravi Kiran Patnaik 是恰蒂斯加尔邦邦赖普 ICFAI 大学科学技术学院的终身制职制助理教授。他拥有超过 22 年的经验。他的科学专长是`Data\
  \ Warehousing and Mining, Cloud Computing`。出生于奥里萨邦。Ravi 博士在计算机科学与工程专业攻读并毕业，随后获得了计算机科学与工程技术硕士学位。Ravi\
  \ 博士在科学期刊和会议论文集中发表了 10 多篇论文，并在各种国际出版物中发表过书籍章节。Ravi 博士积极参加了各种会议和培训计划。他曾作为不同机构/大学的资源专家进行多次演讲。指导过研究生的毕业论文。`68530cb3-6c42-4e5e-9d25-2afc52ee257f`\n\
  \n### Yasin Sheikh\n`db24e9a6-a093-4a4a-9efd-ede2700cdab`\n\n### Piyush Thakur\n\
  Piyush Kumar Thakur 是恰蒂斯加尔邦邦赖普 ICFAI 大学科学系助理教授。他于 2013 年从恰蒂斯加尔邦的 Pt. Ravishankar\
  \ 大学获得医学化学博士学位。2013 年，他加入邦赖普国立理工学院（National Institute of Technology, Raipur）化学系担任教学教员。2016\
  \ 年，Thakur 博士加入邦赖普 MATS 大学，担任生物与化学科学系助理教授，负责监督医学化学和绿色纳米颗粒合成领域的研究活动。Thakur 博士向本科生教授化学，并向硕士生教授光谱学和医学化学。他曾参与与中国亚林大学和日本中部大学的许多合作研究。他最近的活动在水三元体系和用于去除重金属的生物吸剂领域。他在各种知名科学期刊上发表了\
  \ 30 多篇论文。他还担任多个国内和国际期刊的研究论文审稿人。`a549a02d-b9d2-4545-af88-e4d59bf11780`\n\n### Furquan\
  \ Uddin\nFurquan Uddin 担任印度加尔加塔 Aliah 大学（Aliah University）工商管理系助理教授。他在印度贝哈尔大学（BHU）获得博士学位，在印度阿哈迈巴德大学（AMU）获得博士后学位。此外，他拥有八年的教学和研究经验。他在知名期刊上发表了十七篇研究论文。`53912cc1-5626-49a6-8696-f6751c31edc5`\n\
