  \ P. (2020). 旅游业正引领文化遗产管理的数字化转型：基于 Web of Science 数据库的计量学分析。论文集 - 2020 管理科学信息化与经济创新发展会议，MSIEID\
  \ 2020, 273–276. doi:[10.1109/MSIEID52046.2020.00056]\n\n# 第 12 章：全球数字服务与技术供应商 –\
  \ 策略、方法、局限性与性能\n\n*   Snehlata Barde，印度拉贾普尔 MATS 大学\n*   Aaryan Barde，印度拉克希米·纳拉因技术学院\n\
  \n### 摘要\n\n区块链是一项新兴技术，在科技领域迅速赢得了信任。数据是任何组织或机构最重要的资产，因为它包含了所有信息的基础。每隔一段时间，许多公司、企业、行业和市场就会发现数据泄露、盗版和盗窃的案例，这破坏了数据库并阻碍了增长。这就是区块链作为这些商业和工业组织的救星之处，它保护他们的数据和交易。区块链是一种记录和处理数据的方法，使得系统难以被非法来源更改、黑客攻击或操纵。公的“块”或“链”是保存交易记录的组合，它们通过点对点节点连接。这种存储也被称为“数字账本”。它可以被定义为一种分布式账本，在贡献于区块链的计算机网络中复制并分配交易。\n\
  \n### 带图的区块链概念\n\n区块链与旧式数据存储方法相比具有许多优势。区块链网络具有可扩展性，即：它们有能力支持日益增长的交易负载，而且数据存储节点是灵活的，可以根据需要减少或增加。这就是为什么它是商业领域一个非常关键且主要的领导者，因为它将业务增长提升到了无法比拟的水平\
  \ ([Barde,2021])。\n\n任何应用开发都是消除了人们手动执行银行和票务等任务需求的过程。根据中本聪（Satoshi Nakamoto）的说法，区块链是一组连接在一起的记录，并利用密码学来确保安全。这些记录被称为区块，并不断扩展。区块链技术为广泛的交易提供了面向未来的解决方案，并解决了以下群体的记录存储问题。Stuart·哈伯（Stuart\
  \ Haber）和 W·斯科·斯托内塔（W. Scott Stornetta）开发这项技术背后的核心思想是在 20 世纪 80 年代和 90 年代之间。区块链有很多区块。[图\
  \ 1] 展示了包含三个要素的区块链图：数据、预哈希值和哈希值 (Bresnaha, 1995)。\n\n| 图 1. 区块链 |\n| --- |\n| ![Figure978-1-6684-7808-0.ch012.f01](img/ch012.f01.png)\
  \ |\n| --- |\n\n根据 Coin Telegraph 发表的一项全球区块链商业委员会调查，大多数高管（63%）和企业所有者仍然对区块链技术是什么以及它为什么重要感到困惑。结果是对区块链的需求变得至关重要。然而，许多服务提供业、汽车和产品管理行业已成为主要的数据库控制器，使得区块链的需求更加紧迫。\n\
  \n企业每天处理大量数据，但许多企业主仍然没有意识到区块链技术为其公司增长带来的优势，这对比服务产生了重大的负面影响。\n\n区块链是增强企业安全性的有用且必要的工具，原因如下：\n\
  \n#### 使用区块链相比传统技术的优势：\n\n*   **强安全性**：该技术能够保护和维护数据免受威胁。\n*   **财富创造**：通过减少对第三方的依赖，采用区块链可以帮助企业节省大量资金。\n\
  *   **不可变性**：一旦信息保存在节点中，就无法更改或删除。由于所有交易都被准确记录并标记了日期，数据是安全的。\n*   **更高的效率和速度**：通过消除中间人，交易可以更快、更有创造力地执行。消除了对纸笔的需求。\n\
  \n## 区块链的演变\n\n总来说，区块链技术的发展有两个阶段。第一阶段跨越 1991 年到 2013 年。\n\n事实上，雷曼兄弟 2008 年破产对美国造成的成本估计高达数万亿，遗憾的是，它引发了导致许多国家经济衰退或萧条的连锁反应。\n\
  \n作为区块链技术的首次实现，比特币诞生于 2008 年。通过使用比特币这种先进技术，银行可以结算自己的账户。比特币被认为是基于区块链的首全球全球去中心化货币系统。它使用点对点网络、数字签名和加密工作证明来建立分布式账本。区块链的第二个阶段被称为合约，跨越\
  \ 2013 年到 2015 年。2013 年，维塔·布特林（Vitalik Buterin）创立了以太坊，这是一种比比特币具有更多功能的全新公共区块链。\n\n\
  这项发明此后被认为是区块链历史上的转折点。通过引入一种可以与比特币进行比较的功能，他将以太坊与追踪合约等资产的人区分开来。此外，2015 年，Linux 基金发布了\
  \ Hyperledger 开源区块链伞项目。Hyperledger 不支持包括比特币在内的任何加密货币。\n\n### 区块链的现实应用\n\n以下可以使用区块链解决的现实问题列表\
  \ (Franca, 2021)：\n\n*   1. 在安全且无漏洞的投票管理系统中。\n*   2. 用于供应链管理。\n*   3. 在医疗健康管理。\n\
  *   4. 房地产项目。\n*   5. NFT 市场。\n*   6. 避免版权问题和原创内容创作。\n\n\n\n\n\n* 7. 在个人身份识别系统中。\n\
  * 8. 为了制作一个不可变的数据备份。\n* 9. 物联网。\n\n# 区块链的种类\n\n这些块链分为四种：\n\n* 公有链。\n* 私有链。\n* 混合链链。\n\
  * 联盟链。\n\n## 公有链\n\n这种类型的区块链完全能够易于实施去中心化概念。任何拥有计算机和互联网访问权限的人都可以连接到网络；没有任何限制。这种区块链对每个用户都是可用的，因为它的名称是公开的，这意味着它不被任何人衡量。任何接入互联网并配备有足够硬件的计算机的人都可以参与图\
  \ 2 所示的这种区块链。\n\n节点或网络块是它们自身在网络中每台机器上的副本。我们还可以在这个开放的区块链上执行交易或记录验证。\n\n| 图 2. 公有链网络\
  \ |\n| --- |\n| ![Figure978-1-6684-7808-0.ch012.f02](img/ch012.f02.png) |\n| ---\
  \ |\n\n### 优点\n\n* **可信赖**：存在算法来识别任何诈骗。参与者不需要担心网络中的额外节点。\n* **安全**：这种区块链具有重要意义，因为它对所有用户开放。更多种类的记录以巨大的规模进入。\n\
  * **匿名性**：你可以在不披露自己的姓名或身份的情况下加入，使其为你的交易提供了一个安全的平台。\n* **去中心化**：每个用户都有账本的副本；没有单一平台来管理网络。\n\
  \n### 缺点\n* **处理速度**：由于其规模巨大，交易程序的运行速度相当慢。验证每个节点的程序需要很长时间。\n* **能量消耗**：产生工作量证明需要大量的能量。为了加入网络，需要高质量的计算机硬件。\n\
  * **接受度**：由于没有中心机构，政府被迫更快速地应对整合技术的困难性。\n\n## 私有链\n\n这些区块链不像公有链那样分散，它比其他区块链更安全，因为只有少数节点可以参与该过程。它们比公有链透明度低。它们只有特定的授权用户才能访问。这些区块链在私有网络上运行。在这种情况下，只有少数人被允许加入公司或组织内部的网络，如图\
  \ 3 所示。\n\n| 图 3. 私有链网络 |\n| --- |\n| ![Figure978-1-6684-7808-0.ch012.f03](img/ch012.f03.png)\
  \ |\n| --- |\n\n### 优点\n\n* **速度**：速率是因为交易非常小。每个节点的确认需要的时间较少。\n* **扩展性**：扩展性可以更改。网络的大小可以手动选择。\n\
  * **隐私性**：随着商业对机密性要求的提高，隐私水平随之增加。\n* **平衡**：交易更加平衡，因为只有少数用户可以访问，这提高了了网络性能。\n\n###\
  \ 缺点\n* **安全性**：这种类型的节点较稀少，因此存在有人可能会更改它。这些区块链面临更大的安全风险。\n* **建立信任的困难是其主要问题之一。企业可以使用这种技术来惩罚不当行为。**\n\
  * **由于节点数量有限，如果任何节点离线，整个区块链系统都可能面临危险。**\n\n## 3. 混合链\n\n它是私有链和公有链内容的混合体，某些部分处于单一公司的权威下，其他部分则是公开的。由于节点数量有限，只有少数人被允许加入公司或组织内部的网络，如图\
  \ 4 |\n| --- |\n\n### 优点\n\n* **安全性**：由于交易非常小，这种区块链的安全性很高。这种区块链的特征是公开的。\n* **扩展性**：由于商业对机密性要求的提高，隐私水平有所提高，增加了机密性。\n\
  * **隐私**：你可以在不披露自己的姓名或身份的情况下加入，使其为你的交易提供了一个安全的平台。\n* **去中心化**：每个用户都有账本的副本；没有单一平台来管理网络。\n\
  \n（注：此处由于原文文本结构在某些处存在重复或逻辑偏移，已根据翻译原则进行了对齐处理，确保语义通顺）\n\n**混合**：它是私有链和公有链内容的混合体，某些部分处于单一公司的权威下，其他部分则是公开的。由于节点数量有限，如果任何节点离线，整个区块链系统都可能面临危险。\n\
  \n### 优点\n\n* **速度**：由于交易非常小，增加了机密性。如图 4 |\n| --- |\n\n### 优点\n\n* **速度**：因为没有很多用户，所以速度很快。\n\
  * **权威性**：它分散在每个层面并涉及多个实体。\n* **隐私性**：对公众隐藏信息，但每个人都可以访问它。\n* **灵活性**：由于决策的规模较小，可以更快速地做出。\n\
  \n### 缺点\n\n* **审批**：由于所有成员的支持，该程序的灵活性较低。由于一个或多个实体的参与，愿景可能存在差异。\n* **透明性**：如果公司腐败，可能会被破解。组织可能会向用户隐藏信息。\n\
  * **脆弱性**：如果少数节点被破解，这种区块链更容易受到攻击。**\n\n# 区块链对世界经济的影响及其经济效益\n\n账本是一种分布式技术，其中区块链被视为一种允许在安全的互联网上没有中间介的情况下进行资金、资产和信息传输协议。私有文档和记录的完整性和真实性，包括投票、合同、遗嘱、专利、驾驶执照、护照、签证和医疗数据，也可以通过区块链进行保护。\n\
  \n\n\n\n作为注册机构的数字区块链可用于跟踪、确认所有权以及转移资产，包括房屋、汽车、股票、债券、抵押贷款和保险等资产。在基于区块链技术的资产转移的网络经济中，专门为每个人的需求定制的金融和政府服务可能变得更加有效。许多涉及资金、资产和纸质文件的常规交易可以开始使用区块链技术。借益于加密安全算法，许多常规的金融、资产以及通过使用区块链技术，文档处理流程可以开始在数字网络上进行（Melanie,\
  \ 2015）。\n\n“区块链经济”这一术语是对传统国家硬通货和过时遗留账本系统的替代，通过加密货币和数字账本系统，而不是使用传统的软件应用程序来管理现有的国家货币，区块链及类似技术已成为金融管理的常态。此外，在一个被称为区块链经济的场景和可能出现的未来设定中，加密货币将取代世界上现有的货币体系。\n\
  \n保险业、金融部门，特别是其金融市场行业的设计从区块链技术中受益良浅。这种由区块链技术实现的、去中心化交易模型原则（基于 Satoshi 关于点对点通信的白皮书）是这种对技术热忱的核心。人们公认为，分布式账本技术（区块链技术计算）的设计开启了广泛的可能应用范围。例如，使用不可篡改的分布式账本可以使点对点交易变得更加简单；然而，支付、存储记录、追踪实体以及通过智能合约转移费用也摆脱了对中介或人工对账的需求（Reijers,\
  \ 2016）。\n\n# 区块链在商业和工业组织中的作用\n\n商业领域的区块链应用。在许多国际化行业中，区块链正在推动企业的变革。信任建立了关系并减少了重复劳动，提高了效率。许多行业正在经历区块链的转型，包括供应链、食品外卖、金融服务、政府和零售业。\n\
  \n区块链帮助那些需要检查和跟踪此类功能的多步骤交易。它可以加速数据传输程序，保护交易并降低合规成本。区块链技术可以验证产品的源头并简化合同管理（Barde,\
  \ 2021）。\n\n由于其具备数据组织能力，区块链在企业中的应用变得越来越广泛。通过为贵公司创建一个共享的数字记录，区块链允许员工看到业务的运营情况。使用区块链技术，公司可以进行和接收支付。使用“智能合约”，智能合约是编码在代码中并保存在区块链上的基于计算机的规则集。当满足预设条件时，智能合约会自动启动后续的相关活动。\n\
  \n更广泛地说，区块链通过处理其无需供应商和第三方提供商等中介即可执行的流程降低了企业的成本。此外，区块链的特定特性可以通过增强信任、安全和透明度使企业受益。\n\
  \n# 使业务更安全的区块链技术之益处\n\n## 去中心化结构\n\n在 Daniel Field 看来，当没有单一方来建立信任时，区块链实际上证明是有效的。UST\
  \ 区块链的董事作为数字技术和服务的领先供应商，区块链允许在没有单一实体拥有完全控制权的生态系统中，各种企业之间共享数据。\n\n它还有帮助可能由于不熟悉而无法建立信任的参与者之间建立信任。供应链是一个典型的例子：然而，没有人负责组织所有的这些信息共享。但早期的区块链使用用例证明了其有用性，这些用例使得那些没有直接贸易联系但仍需要通信数据或进行支付的，能够更容易操作。区块链如何促进陌生人之间信任的最基本例子是比特币和一般的加密货币。\n\
  \n## 信任\n\n区块链在信任缺失或未经测试的地方创造了信任（许多实体之间的信任）。因此，这些组织愿意以它们原本可能不会或可能需要中介的方式进行业务，例如交易或数据共享。促进信任是区块链最常被提到的益处之一。早期的区块链用例使得那些没有直接贸易联系但仍需要通信数据或进行支付的公司能够更容易操作。区块链促进陌生人之间信任的最基本例子是比特币和一般的加密货币。\n\
  \n## 增强的隐私与安全\n\n采用区块链技术的系统的安全性是这项新技术的另一大优势。由于区块链技术的工作方式产生了更高的安全性，通过创建从头到尾保护的不可篡交易记录，防止了欺诈和不良行为。区块链使用计算机网络来存储数据，使其几乎无法破解（与将数据一起存储在服务器中的传统计算机系统不同）。此外，通过对数据匿名化并要求权限限制访问，区块链可以比传统系统更好地处理隐私问题。\n\
  \n## 降低成本\n\n区块链的特性使企业节省资金。交易处理变得更加高效。此外，它简化了审计和报告程序，并消除了数据收集和更新等人工活动。专家认为，区块链简化清算和结算的能力直接转化为成本的降低。他们还引用了金融机构的节省作为该技术成功的证明。更广泛地说，区块链通过处理其无需供应商和第三方提供商等中介即可执行的流程降低了企业的成本。\n\
  \n### 速度\n\n由于企业中没有中介，也不再涉及人工程序，区块链执行交易比传统技术快得多。在某些情况下，区块链允许交易在几秒钟或更短时间内完成。每个区块的大小和网络活动只是影响区块链系统处理交易速度的许多因素中的两个。\n\
  \n## 可见性与可追溯性\n\n\n\n\n除了速度之外，区块链技术还允许沃尔玛建议其他产品的来源。得益于此，沃尔玛喜欢能够管理其库存、响应确认产品来源的疑问或问题的零售商。如果使用区块链的零售商由于污染需要召回其某些物品，它可以识别并移除来自该农场的食品，同时将该农场的其他产品保留在货架上。根据专家的说法，区块链可以帮助追踪各种商品（如药品）的谱系，以确保它们的真实性而非伪品；以及追踪有机产品以确保它们确实为有机。\n\
  \n## 不可变性\n\n不可变性基本上意味着一旦交易被放入区块链，它就无法被更改或删除。在区块链上，每笔交易都有一个时间戳和一个日期标记，创建一个永久的记录。因此，区块链可以用于跟踪跨越时间的数据，从而实现安全、可靠的数据审计。Omar\
  \ 引用道，瑞典利用区块链跟踪转让时的物业所有权并将房地产交易数字化，这证明了这一价值。\n\n## 数据的个人化控制\n\n专家表示，区块链为个人对其自己的数字数据提供了无与伦比的个人主权。根据\
  \ ABI Research 研究总监 Michela Minting 的说法，在一个数据是价值商品的世界里，技术从本质上保护了属于你的数据，同时让你对其拥有控制权。\n\
  \n个人和小组织团体可以决定他们想共享数字数据的哪些部分、与谁共享以及共享多久，但受限于区块链支持的智能合约的限制。\n\n## 代币化\n\n代币化过程包括将物品的价值（可能是物理的或数字的）转换为令牌，然后将其保存在区块链上并通过其分发。其他虚拟材料（如数字艺术品）通过代币化取得了成功，但根据国际咨询公司\
  \ West Monroe 技术负责人 Joe Davey 的解释，该概念具有更广泛的应用，可能会简化企业交易；他解释说这一过程涉及将物理或数字对象的价值转换为数字令牌。公用事业公司可以通过带有碳额计划的代币化许可采用碳排放交易。所交易的碳排放许可随后存储在区块链上并供共享。\n\
  \n## 创新\n\n基于区块链的系统正被多个行业的领导者测试和实施，以解决棘手问题并改进过时、耗时的流程。Field 提供的区块链用于验证招聘搜索者提供的简历上的数据，这作为这种革命的说明。研究表明，许多招聘经理在手动核实申请材料中的材料上耗费了大量时间。然而，试点项目允许参与的大学将有关毕业生学位和证书的信息存储在区块链上，然后为获得批准的招聘经理提供这些数据的权限，这有助于找到真相。发现真相将为这两种挑战带来解决方案，并且能够快速有效地实现目标。\n\
  \n## 区块链实施包含这些步骤\n\n由于区块链是完全去中心化的，拥有节点的服务器或机器可以管理网络。区块链网络仅由一个利益相关者控制。通过允许利益相关者向区块链添加内容或查看它，如果利益相关者有此要求，区块链可以是完全无许可的。通过限制更改和查看选项，他们也可以授予对区块链的访问。\n\
  \n要实施区块链，你必须采取以下行动：\n\n### 识别用例\n\n由于区块链是一项破坏性技术，企业客户需要意识到它的特殊优势，以及与其实施相关的挑战和要求。实施区块链需要终终的承诺，但它是值得的。以开放的心态考虑用例可能会完全改变游戏规则，因为区块链改变了它的工作方式。\n\
  \n以下是需要考虑的几个关键用例：\n\n*   **安全**：区块链不连接任何上述双方。对于他们来说，加密技术让有权限和无权限的参与者查看数据变得更简单。\n\
  *   **共享和复制**：所有账本数据（包括交易和数据驱动数据）在整个网络中轻松共享。区块链的参与者还会获得其账本的副本。\n*   **不可变**：一旦数据上传到块中，就无法被更改或擦除；它是不可逆的。通过区块链，可以附加一个记录系统。审计也是区块链的一个关键用例。\n\
  *   **可验证**：区块链连接所有关键业务规则以监控交易。当业务规则实施时，交易将在整个网络中通过。一种名为工作量证明的衍生算法不断进行选择。\n\n企业必须选择最符合其需求的用例。\n\
  \n### 开发概念证明 (POC)\n\n区块链革命性的概念证明（POC）方法检查现实世界应用的效果如何。POC 评估项目是否实用以及能够完成任务。创建一个坚固的\
  \ POC 自然会导致自动化和流程的简化。与其他技术相比，区块链概念证明为终端用户和客户提供了更多的价值。今天，许多部门在日常中使用区块链，并依赖 POC 来获得最佳性能。POC\
  \ 彻底改变其工作方式的行业包括电信管理和金融科技保险等。\n\n## 仔细选择区块链\n\n当组织和公司获得使用区块链的选择时，它们形成了一种错误的信念。企业用户经常认为区块链是解决他们问题的全方位解决方案。不可否，区块链技术具有从根本上改变组织运营的力量。在决定区块链不是最佳选择之前，仔细考虑它是重要的。\n\
  \n尽管这不是通用技术，但区块链为公司增加了价值。选择区块链网络时，请考虑以下行动：\n\n*   分析区块链技术是否适合业务挑战。\n*   选择集成区块链的策略。\n\
  *   考虑一些现有解决方案，无论它们听起来有多复杂。\n\n以下是最先进区块链平台的名称：\n\n*   `Stellar`、`Hyperledger Fabric`、`Corda`、`Multichain`、`Quorum`、`Ethereum`、`Unlock\
  \ chain`。\n\n### 初始化区块链\n\n初始化区块链需要手动创建第一个区块。记住，区块应包含链的所有特征。然后通过网络共享这些特征。此外，创建一个\
  \ JSON 格式的文件来定义区块。有许多参数，如 `Nonce` 和 `Timestamp`，它们必须是特定的。\n\n\n\n\n分布式系统利用共识机制来确保系统中的每个节点对某个特定值或状态达成一致。以下是各种共识协议之间的一些关键比较：\n\
  \n*   **工作证明 (PoW) 与 拜尔庭容错机制 (BFT)**：`BFT` 和 `PoW` 是两种最常用的共识技术。`PoW` 通常用于无许可网络，而\
  \ `BFT` 通常用于许可网络。与依赖大量节点的 `PoW` 不同，`BFT` 依赖于少数受信任节点来验证交易。在 `PoW` 中必须使用大量的计算力来挖掘区块，而\
  \ `BFT` 则不需要。\n*   **工作证明 (PoW) 与权益证明 (PoS)**：在无许可网络中，`PoS` 和 `PoW` 均被采用。`PoW` 需要节点执行特定量的计算工作来验证交易，而\
  \ `PoS` 则要求节点质押自己的代币作为押金。与 `PoW` 相比，`PoS` 门准入门槛且更节能。\n*   **Raft 与 实用拜尔庭容错机制 (PBFT)**：用于许可网络的基于\
  \ `BFT` 的共识系统包括 `PBFT` 和 `Raft`。与 `Raft` 相比，`PBFT` 容错性更高，并依赖更多的节点来验证交易。与 `PBFT`\
  \ 相比，`Raft`更容易使用和理解。\n*   **代理权益证明 (DPoS) 与 PoS 的区别**：`DPoS` 使用一组较小的节点（称为`代理`）来验证交易。网络选择这些代理，节点投入的加密货币越多，拥有的投票权越大。虽然\
  \ `DPoS` 的去中心化程度低于 `PoS`，但它的速度更快。\n*   **联邦拜尔庭协议 (FBA) 与权益证明 (PoS) 的比较**：`FBA` 是一种用于许可网络的共识技术，它依赖于一组相互信任的节点来确认交易。尽管\
  \ `FBA` 比 `PoS` 需要更高的节点信任，但它的容错性更好。\n\n通常，共识协议的选择取决于网络的独特需求，包括所需的去中心化程度、网络规模以及所需的容错量。\n\
