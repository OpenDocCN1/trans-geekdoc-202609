  \n## 第 11 章\n\n## 作者\n- Aniket Ghorpade (印度帕格瓦尔普基大学)\n- Uma Pandey (印度帕格瓦尔普基大学)\n\
  \n### 摘要\n区块链是一种允许开放存储网络生成的每笔交易的技术。`blockchain`一词指的是由加密副本组成的序列。过去已经建立了区块链安全数据库。区块链可以在非物质文化遗产（ICH）的保护、认可和发展中得到广泛应用。它可以作为安全数据库，也可以作为\
  \ ICH 从业者的便捷市场平台。本研究将评估区块链在印度的使用。数据来自二次文献。本研究将为非物质文化遗产的研究提供参考。\n\n### 引言\n文化不能还原为物质对象，因为它是动态且不断变化的；相反，它包含了体现人类文化的无法言喻的特质（Goetcheus\
  \ & Mitchell, 2021）。“文化遗产”一词的含义因为各种工具的产生而变化。文化遗产不仅包括纪念碑和文物收藏，还包括代代传的习俗或生活体验，例如口头、表演艺术、社会习俗、仪式、节日庆祝以及与自然和宇宙相关的知识习俗，以及制作传统手品所需的技艺。非物质文化遗产（ICH）在过去的几十年一直是旅游业的焦点。非物质文化遗产的消失是一个持续关注的问题，这主要是全球化的结果。为了解决这个问题，联合国教科文组织于\
  \ 2003 年通过了《保护非物质文化遗产公约》。\n\n\n\n\n截至目前，许多国家已签署了《公约》，并将近 500 项非物质文化遗产（ICH）要素列入非物质文化遗产名录和良好保护实践名录。文化遗产是整合了一个国家历史、传统和文化的隐性存在。它是该国人民自豪的非凡源泉，但也具有能够触及全球人们的普世价值。目前，有无数具有价值的非物质和有形文化遗产正面临威胁。本文探讨了在数字世界中保护并开放印度文化遗产储备的可能性。\n\
  \n目前，收集、识别和管理非物质文化资源面临着挑战。因此，对于研究保护非物质文化遗产的兴趣日益增加。作为保护非物质文化遗产的一种方式，非物质文化遗产数字化的多个方面吸引了各种学者的兴趣。这些方面包括艺术品和档案的三维数字化、文化遗产复兴涉及的伦理和法律考量，以及非物质文化遗产的管理与保护。\n\
  \n非物质文化资源的管理极大受益于计算技术的普及和全球生活水平的提高(Cisneros et al., 2022)。例如，使用纸质档案管理非物质材料具有搜索速度缓慢和管理流程复杂的缺点。通过数据库查询，数字非物质文化遗产管理系统可以加速非物质文化遗产的检索和监控，通过在线审批简化非物质文化遗产的管理，减少劳动支出，并提高工作生产力(Jun\
  \ & Li, 2022)。\n\n然而，数字非物质文化遗产的创作引发了关于非物质文化遗产记录有效性和真实性免受盗窃、篡改和破坏的问题。如今，许多国家正在探索不同的技术来保护非物质文化遗产，区块链就是其中之一。区块链是一种去中心化、无需信任且高度防篡改的分布式账本技术。加密学、概率推测、共识程序和循环网络只是其中利用的计算机技术(Ferdous\
  \ et al., 2021)。加密货币是区块链工具最早的功能，其数千个分布式节点已最高标准运行且没有发生重大中断。在保护敏感数字数据方面，其可靠性和可追溯性优于传统的网络安全。区块链技术的出现彻底改变了我们管理非物质遗产的方式。这项技术具有改变我们存储、保护和共享非物质遗产方式的潜力。它还可以为文化遗产的保护和传输提供安全的平台。在本研究中，我们将讨论区块链技术在非物质遗产管理中的意义以及它如何用于保护和保护我们的文化遗产。\n\
  \n## 区块链技术 (BCT)\n\n在这个技术驱动的世界，许多国家正尝试使用区块链来保护非物质文化遗产。描述区块链最好的方式是将其具有某些特性的虚拟实时数据库(Ouaddah\
  \ et al., 2016)。首先，为每一笔商业交易创建一个独特的账本分目是区块链技术的特征。一旦交易被记录，无法以任何方式进行更改，包括更新、删除或添加。这是一个巨大的优势，因为它减少了欺诈和/或人为错误的概率。此外，由于该生态系统中的每条记录都是永久的、带有日期时间戳，并且记录的交易对区块链系统的所有用户可见，它促进了完全且不加掩饰的交易透明度。第三，这些交易按照精确的时间顺序记录，并实时发布，没有时间间隔(Dai\
  \ & Vasarhelyi, 2017)。由于每笔交易都停留在自己的“区块”中，并自动与上一个和下一个链接，就形成了交易“区块”“区块链”(Williams,\
  \ 2019)。得于区块链技术，旅游业可能会经历巨大的变革。它的关键特性包括不可篡改性、透明性、可编程性和去中心化，使得新的组织结构和流程成为可能，并为新型组织间合作留出空间(Treiblmaier,\
  \ 2020)。根据 Angus Hervey 的说法，区块链“是使主动模型过时的最新模型。”比特币和其他加密货币经常与区块链相关联。区块链是一个去中心化的数据库系统，建立在多项数据保护基础之上，具有稳健的安全性和高容量。它可以被描述为一个巨大的分布式公共账本，用于跟踪跨网络的交易。区块链技术通过使用数字身份消除了旅客出示实体身份的需求，从而加快了旅行并缩短了等待时间。得益于区块链技术\
  \ (BCT) 的潜在应用，受影响的企业可以建立安全的记录并安全地存储敏感数据(Rashideh, 2020)。由于区块链能够降低成本、提高效率、减少数据造假、增强信任并减少对中介的需求，所有行业都将受到影响(Yin\
  \ et al., 2019)。为了更好地预测酒店业的发展趋势，研究区块链的所有方面及其在行业内部和行业之间的关系至关重要。高水平的竞争是该行业的特征，该行业以异质性以及合作伙伴、个人、旅游服务和业务流程之间复杂的业务互动为特征(Maratovna\
  \ et al., 2021)。必须采用最新的技术以不断适应这些状况。这些技术将提供行业所需的信息，以便快速改变、适应、整合并连接利益相关者。\n\n\n\n\
  非物质文化遗产（ICH）指的是广泛的社会行为、概念表达、知识、技能、工具、手工艺和文化场所，这些内容被相关社区、群体或个人视为该社区、群体或个人的文化遗产的一部分（Baixinho\
  \ et al., 2021]）。\n\n非物质文化遗产的保护是一项有组织的文化事业，其基础组成包括数据挖掘、数据管理、数据传输等（Alivizatou-barakou\
  \ et al., 2017; Cominelli & Greffe, 2012]）。\n\n众周知，任何只能被描述为“非物质文化遗产”（ICH）的事物都承载着人类文明核心组成部分的证据。因此，人们认同其安全性至关重要。然而，做到这一点需要巨大的资金投入，而行政部门及更广泛社会所剩余的资金却少得怜（X.\
  \ Su et al., 2020a]）。\n\n近几十年来，“文化遗产”这一短语的含义发生了显著变化，部分原因在于联合国教科文组织（UNESCO）创建的工具。文化遗产不仅限于纪念碑和文物收藏。它还包括从我们家族代传给后代的习俗或生活表达，例如口头传统、表演艺术、社会习俗、仪式、节日庆祝，以及与自然和宇宙相关的知识和习俗，以及制作传统工艺所需的技能（Roszczynska-Kurasinska\
  \ et al., 2021）。\n\n\n\n\n众所周知，“非物质文化遗产”（ICH）是人类文明重要属性的标志。因此，与非物质文化遗产相关的旅游业增长已成为为其保护资金的一种关键新途径（X.\
  \ Su et al., 2020a）。尽管非物质文化遗产非常脆弱，但在全球化加速的今天，它在维护文化多样性方面发挥着基础性作用。更深入地了解不同群体的非物质文化过去，有助于促进跨文化交流，并为各种多样化的生活方式创造价值（联合国教科组织）。这与其说是文化表现本身，倒不如说是作为非物质文化遗产一部分的代代相传的海量信息和技能。这就是为什么它具有如此关键的意义。这种信息传递对于已经成熟的国家和仍处于新兴过程的国家都是至关重要的，其社会学和财务价值延伸到特定国家内的边缘和主流社会经济群体。由于非物质文化资产拥有丰富的文化和审美价值，保护非物质文化资产对于旅游业的扩张变得越来越重要。真实性对于以以非物质文化资产为中心的旅游业扩张至关重要。文化认同强调了个人和群体对共同文化的认同。这种相关性与文化历史以及自然环境有关。近期技术的进步为教学和保护非物质文化遗产（ICH）领域的创新可能性提供了可能。本文的主要目标是提供一项研究，其重点在于确定技术可能以及多大程度上对非物质文化遗产的保护和教育做出贡献（Pozzi\
  \ & Katos, 2017）。价值感和认可是文化认同的核心。随着旅游业的持续增长，旅游背景下的文化认同研究日益关注。从全球化的视角来看，基于文化的旅游让游客能够接触到强调文化认同重要性的场所的多样身份（Tian\
  \ et al., 2020）。自从文化遗产旅游开始，真实性就与文化旅游联系在一起。这种关联持续到了今天。由于非物质文化资产的保护目前是遗产保护中最重要的方面，真实性已成为一个核心概念。它被广泛用于指文化和遗产作为经济增长源的潜力。这在发展经济体以服务其战略利益的过程中尤为明显，这也是文化和遗产旅游变得越来越受欢迎的原因之一。这种潜力还加上它被认为是一种更广泛地推广和传播遗产元素及形式的方法。为了加强国家层面的民族主义感并在海外传播特定的意识形态，一些国家还利用文化创作和遗产旅游。然而，遗产旅游确实是导致遗产形式发生变化的源头，这是需要考虑的因素。旅游业经常对历史形式的可持续性表示担忧（Ranwa,\
  \ 2021）。然而，由于对非遗旅游定义的模糊、非遗数据数据海量且分散的结构，以及学术界对非遗旅游的普遍接受，很难对非物质文化遗产旅游最新的研究立场进行调查并得出结论。为了总结非物质文化遗产旅游的趋势、模式和未来范围，需要更多的提取和总结。回顾目前非物质文化遗产旅游的研究现状揭示了这项工作的理论价值和实践意义（Qiu\
  \ et al., 2022）。自 20 世纪 90 年代以来，国际文化遗产领域一直处于文化存档和保护世界“数字化”趋势的最前沿。在 2003 之后的几年里，许多国家启动了自己的数字化非物质文化遗产计划。非物质文化遗产开展的研究一段时间以来已将注意力从文化形式的调查转向全球范围内的信息形式调查。美国学者进行的大多数关于非物质文化遗产的研究主要集中在非遗技术或数字格式的非遗上。数字成像技术、三维技术、虚拟现实和增强现实技术、三维空间定位技术等技术方面是非遗技术研究领域的主要研究领域。非物质文化遗产的数字形态学研究主要从非遗数据库、数字博物馆和动画游戏的视角进行（Dou\
  \ et al., 2018; Kong & Zhang, 2021）。一种原因是知识经济使非物质元素在新产品的开发和制造中起着决定性作用。在两个方面，这与艺术传统和方法有关。它们作为不断自我更新的遗产源，为经济的所有部门（从手工艺到风格、家具到工业）提供符号、形式、颜色和象征，培养创造力并提供了大量的灵感。艺术和遗产可以为创造建立可以应用于其他行业的创造力准则或标准，因为它们本质上是创造性活动（Cominelli\
  \ & Greffe, 2012）。\n\n## 方法论\n\n为了实现本文的目标，进行了广泛的文献综述。通过开展文献综述，你可以熟悉你学科的知识水平及其局限性。回顾相关文献还可以阐明你学科中的基础理论，这将有助于你更好地构建研究课题。\n\
