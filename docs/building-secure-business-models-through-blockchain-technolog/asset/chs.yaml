  \n## 第三节\n\n## 第 10 章：全球数字技术提供商\n\n- Sushovan Chaudhury，工程与管理大学，加尔加答，印度\n- Dharmesh\
  \ Dhabliya，Vishwakarma 信息学院，浦那，印度\n- Suman Madan，Jagan 管理学院，德里，印度\n- Sudakshina\
  \ Chakrabarti，Chettinad 研究与教育学院，印度\n\n### 摘要\n\n为了鼓励对前沿区块链应用的讨论，本文进行了编写。本文介绍了区块链技术，并说明了如何使用技术保护交易以及安全元素的工作。它探讨了常见的实施问题，并提供了当前的商业或试点项目案例。\n\
  \n## 提供区块链技术服务\n\n第三方供应商提供分布式账本技术 `Bitcoin` 平台，使公司能够创建自己的区块链应用。基于区块链的应用可以进行许多类型的交易和检查。因此，处理金融交易、持有身份和协调供应链的程序程序是最常见的区块链用途之一。\n\
  \n\n\n\n\n大多数公司选择与区块链服务提供商（BaaS）合作，而不是构建自己的区块链基础设施，以便他们运行企业级应用。基于订阅的云平台允许客户在构建应用程序，而无需在服务器、复杂的基础设施或专门的\
  \ IT 员工上投入资金。提供区块链服务的公司负责管理底层硬件 (Haleem et al., 2021)。\n\n根据 Haleem 等., (2021) 的说法，区块链平台与作为服务提供的基于区块链的解决方案之间有很多相似之处。许多企业现在提供了它们自己的专有平台，通常还提供托管的“即服务”选项，以更好地服务其客户。与相反，维护传统平台的工作量比维护云托管软件服务要多得多\
  \ (Haleem et al., 2021)。\n\n### 区块链服务提供商的要求\n\n要被纳入区块链服务提供商组，应用程序必须满足以下要求：\n\n*\
  \   构建在区块链或其他分布式账本系统之上。\n*   提供对支持交易的托管共享数据库的访问权限。\n*   它们应该提供开发环境和/或预制工具，以便他人更容易创建基于区块链的应用程序。\n\
  *   为用户提供自定义应用程序和添加新功能的方法。\n\n关于在商业环境中使用私有链一直存在讨论。《计算机世界》（Computerworld）将在没有良好安全架构的情况下销售此类私有化区块链网络称为“蛇油”\
  \ (Gökalp et al., 2018)。\n\n| 图 1. 比特币块链结构 |\n| --- |\n| ![Figure978-1-6684-7808-0.ch010.f01](img/ch010.f01.png)\
  \ |\n| --- |\n\n图 1 包含了许多区块，说明了比特币区块链的构建。这些区块在图中已标出。\n\n区块链的创新是相当新的。区块链是“不断增加的文档列表，称为方块，通过加密连接并锚定”。它们将区分区块链中对流程主题的代表性评估，并调查以及分析我们想法的潜在影响。尽管区块链可能并不广为人知，但它正在作为一种媒介迅速出现，而且是目前媒体以很大强度讨论的话题\
  \ (Gökalp et al., 2018)。\n\n## 区块链技术的组件\n\n区块链架构具有以下主要组件：\n\n### 分布式账本\n分布式账本是区块链网络中的共享数据库，其中包含了交易记录。这的一个例子是团队中的每一个人都可以修改并与其他人共享的文件。任何在共享文本编辑器中获得编辑权限的用户都有删除整个文件的能力。另一方面，基于分布式账本的系统对“谁可以编辑以及他们如何编辑”有严格的限制。一旦记录了条目，在任何情况下都无法删除它\
  \ (Korpela et al., 2017)。\n\n### 智能合约\n公司不再依赖第三方协助来处理其业务合同，而是转向被称为“智能合约”的东西。它们是保存在区块链上的计算机程序，并在满足某些标准时将自动执行。它们执行“如果-那么”（if-then）测试，以确保业务交易可以充满信心地进行。例如，物流业务可以使用智能合约，在港口收到货物后立即进行支付\
  \ (Cole et al., 2019)。\n\n## 区块链的使用案例与应用\n\n区块链是一个交易数字数据库，复制并分散在多台计算机上。每笔交易都记录在一个新的区块中，添加到分布式账本中并对所有用户立即可见。从整体而言，交易链依赖于每一个单独的连接\
  \ (Zhang et al., 2020)。\n\n| 图 2. 区块链的应用 |\n| --- |\n| ![Figure978-1-6684-7808-0.ch010.f02](img/ch010.f02.png)\
  \ |\n| --- |\n\n从图 2 可以看出，区块链技术可能对在线广告市场产生重大影响。如果区块链技术创建客户信息的去中心化数据库，就可以更精确地通过个性化消息和优惠定位客户。\n\
  \n### 加密货币\n根据 Zhang 等. (2020)，加密货币是数字货币，其单个代币的所有权记录在公共分布式账本中维护。由于其“去中心化控制”，加密货币不受任何单一实体的管辖。自\
  \ 2008 年推出以来，比特币消除了对信任中介的需求，促进了点对点的交易。从那时起出现了 4000 种独特的加密货币。比特币、以太坊、狗狗币、Fantom 等都是这些实例。\n\
  \n### 法律文件\n因此，区块链在很长时间内维护数据完整性非常出色。所以它们不仅用于计时器，还可以作为公证处跟踪知识产权。为了应对这一点，他们可能会采用区块链技术。`Stampd.io`\
  \ 是此类服务之一，方便将这些文件添加到比特币或以太坊 (Pilkington, 2016)。\n\n### 数字投票\n数字投票是该技术的另一个令人兴奋的应用。无论是纸质选票还是带有专用软件的\
  \ EVM（电子投票机）用于投票。纸质选票的生产成本很高，而计算机投票系统则存在安全问题。由于担心黑客可能会篡改或影响选举结果，各国回归纸质选票。我们国家的政客对所谓的“EVM\
  \ 攻击”事件发生了争论 (Pilkington, 2016)。\n\n### 智能合约\n到目前为止，我们研究了区块链如何跟踪信息并验证其完整性。但当它们将智能合约作为应用之一时，区块链变得更加强大。这些合约保存在区块链上，并在满足各种条件时执行操作。保险公司可以使用智能合约验证理赔，并记录所有按时缴纳保费的人，以便继续保单条款。或者它们可以允许我们只在开车时支付车险。\n\
  \n## 区块链的优缺点\n\n与所有形式的技术一样，区块链有几个优点和缺点需要考虑：\n\n### 优点\n区块链提供的这种程度安全性是它们提供的最显著的优点之一。由于此，区块链能够保护和保护涉及在线交易的敏感数据。任何对快速方便交易感兴趣的人都会发现区块链技术也提供了这一点。事实上，总时间只需要几分钟，而其他交易方式的完成可能需要几天\
  \ (Pilkington, 2016)。\n\n### 缺点\n\n\n\n\n据描述，私钥方面存在一些问题，考虑到区块链和密码学都需要使用公钥和私钥，这便成了一个问题。另一个缺点是可扩展性方面的限制，因为每个节点上可以发生的交易数量有一个上限。因此，完成许多交易和其他任务可能需要几个小时。区块链技术的另一个主要缺点是，信息一旦记录下来，要对其进行更改或添加新信息可能具有挑战性（Pilkington,\
  \ 2016）。\n\n# 数字技术与服务\n\n数字技术与服务帮助原始设备制造商（OEM）集成并自动化设计流程，以实现整个产品开发生命周期内的顺畅数据共享。这不仅让工程更加数字化，还使得优化设计成为可能。此外，它还与原始设备制造商（OEM）合作，提供跨越领域的数字解决方案（Attaran,\
  \ 2022）：\n\n- 提高产出和生产力，并实现资源最大化。\n- 通过分析模型和数字孪生可以提高现场服务的可预测性。\n- 信息被传回给工程团队，以便他们改进产品性能、增加设计准确性并减少对物理验证的需求。\n\
  \n能够为客户提供最快速、最沉浸式数字解决方案的公司将成为行业未来的领导者。跨移动端、网页和物联网提供连接的体验，是我们团队帮助客户满足其所面临的特定业务需求和问题的方法之一（Attaran,\
  \ 2022）。\n\n## 数字战略\n\n分析组织的现状、概述特定的路线图并制定一个以实现你的数字目标的计划，都是重要的步骤。\n\n## 数字体验设计\n\
  \n设计跨多个渠道的用户体验的过程，以便在移动设备、网站和应用程序上提供交互式且一致的视角。\n\n## 数字开发与流程工程\n\n涵盖整个生命周期的数字解决方案开发、业务流程管理以及旨在改进和改变运营效率的连接。\n\
  \n## 数字分析\n\n实时的可操作见解，用于评估组织在多个数字渠道的性能表现。\n\n## 区块链即服务\n\n“区块链即服务”或“BaaS”是指由第三方（通常是云提供商）代表区块链应用开发者构建并管理区块链网络的做法。该缩写常被用来描述这种方法。这些外部机构是快速扩张的区块链行业中较新的发展成果。它们是较新的成员。到目前为止，区块链技术最为人知的用法是虚拟货币交易，但该技术现在正用于保护所有类型的金融交易。在金融领域，区块链技术最常用于促进数字货币交换（Mettler,\
  \ 2016）。\n\n| 图 3. 区块链即服务 |\n| --- |\n| ![Figure978-1-6684-7808-0.ch010.f03](img/ch010.f03.png)\
  \ |\n| --- |\n\n- 从图 3 可以看出，区块链即服务（缩写为 `BaaS`）是由第三方为开发和运行区块链应用程序的企业提供的基于云的基础设施和服务。\n\
  - 基于区块链的应用程序或平台的后端操作可以由 `BaaS` 管理，其执行方式类似于网络托管主机。\n\n企业可以付费使用区块链即服务（`BaaS`）模型，在该模型下，聘请外部服务商来建立必要的区块链技术和基础设施。即使在账户建立后，提供商也将处理客户所有复杂的后端操作。在许多情况下，`BaaS`\
  \ 提供商将处理客户支持任务，包括带宽管理、资源分配、托管和数据安全（Mettler, 2016）。\n\n# 区块链技术的挑战\n\n应用区块链技术方面的努力揭示了许多不同的技术问题。其中包括需要更健壮的安全技术以便其以无风险的方式使用，以及更快的处理速度（Pilkington,\
  \ 2016）。\n\n## 更健壮的安全技术\n\n被称为区块链的技术特点是它通过要求网络中的所有参与者验证交易信息来确保安全性。这有助于防止非法活动。这使得并非区块链一部分的人也可以访问区块链正在处理的交易。在某些情况下，对于某些应用程序，除非个人积极参与交易，否则个人无法访问交易信息。为了利用区块链确保交易在完全保密的情况下进行而实施的这一过程面临了一个巨大的障碍（Pilkington,\
  \ 2016）。\n\n## 更快的处理速度\n\n区块链交易的处理时间比传统交易长，因为交易需要网络中每个参与者的验证。因此，对于涉及大量交易的应用程序，提高处理速度可能是一个挑战（Pilkington,\
  \ 2016）。\n\n\n\n\n\n[Laroiya et al. (2020)] 认为，对区块链技术的一种描述是包含数据的“区块链”，这通常被称为“数字账本”。这些区块按时间顺序链接，并存储在数据库系统中，而不是单一的中心化位置。该链条可以以区块的形式进行升级，但永远无法被删除。该链还将跟踪并验证任何更改。存储在区块中的数据使用各种方法进行加密，以确保只有授权用户才能访问这些数据。虽然存在私有区块链，但“去中心化”一词通常与公共区块链相关。区块链技术的四个主要用用例是货币交易、财产注册、法律合同和身份验证。加密货币是一种数字货币，使用公钥加密来确保交易的安全和防伪造。基于区块链的应用通常与加密货币结合使用。技术人员和经济学家可能都欣赏区块链的革命性潜力。区块链技术也被称为分布式账本，可以被用作“共享经济”相关的服务的交易系统，因为它天然地解决了大规模点对点活动中可靠记录的挑战。金融创新区块链解决了在处理去中心化系统时出现的问题，在这些系统中，并非所有参与者都能被可靠地准确记录和报告交易。通过区块链技术的使用，一种建立在瞬时信任和价值基础的新全球经济已经出现。这个经济体系的基础是一套复杂的计算机算法和共同协议。通过利用数字化的资金流和支付通道，货币交易的即时经济可能变得可行。目前供应链融资中使用的\
  \ 30 天、60 天和 90 天期限可以使用这种方法缩短，无法收回债务的问题也可以得到解决。“区块链经济”这一术语是指从国家硬通货和旧过时的账本系统向数字加密货币和账本的转变。区块链经济中的财务管理工具通常是\
  \ `bitcoin` 和区块链等技术，而不是处理现有国家货币的传统软件应用程序。此外，区块链经济是一个潜在的未来设定，在其中加密货币在全球范围内取代传统的货币系统。在一项名为《区块链市场的未来》的研究中，分布式账本技术（DLT，也称为区块链）预计将推动增长。2018\
  \ 年至 2024 年间，全球收入可能达到 1200 亿美元。由于其许多益处，研究发现区块链技术的广泛采用是非常可能的。他们估计，到 2024 年，区块链技术可能会带来\
  \ 870 亿至 1200 亿美元的收入，取决于哪些行业采用它以及扩散的速度有多快 ([Laroiya et al., 2020])。\n\n[Tönnissen\
  \ and Teuteberg (2020)] 认为，区块链技术对保险业以及金融部门具有巨大的前景，特别是在金融市场基础设施领域。区块链技术热潮的核心是它所实现的革命性去中心化交易架构。这种模型的基础直接来自\
  \ Satoshi (2008) 的白皮书，阐述了去中心化、点对点通信的概念。由于区块链所实现的去中心化交易范式，预计将对全球经济和在线贸易产生深远影响。因为它更容易采用此类框架，事实也是如此。此外，尽管自引入以来（特别是在过去的\
  \ 10 年里）在线业务交易比例稳步增长，但主导的交易范式仍然是中心化的 ([Lee, 2018])\n\n## 区块链的新业务应用\n\n根据 [Lindman\
  \ et al. (2017)]，直到最近，金融行业以外的人才对区块链表现出真正的兴趣。区块链验证数字信息和生成智能合约的能力显著增加了该技术在全球范围内的影响。具有去中心化计算能力的新型编程区块链平台正在涌现，增加了这项技术的适用性并为其用途开辟了新途径。其中一个平台是\
  \ `Ethereum`。区块链技术可能会使许多不同的服务更具价格竞争优势 ([Lindman et al., 2017])。包括食品饮料、汽车、电子、航空航天和军事行业在内的多个部门正在考虑将区块链技术用于保护整个供应链中的批数据以及质量、安全和追溯性信息。`IBM`\
  \ 和 `Microsoft` 等公司正在向广泛市场提供基于区块链的解决方案。人们通常将“区块链”与数字货币“bitcoin”通用使用。如果 `bitcoin`\
  \ 在全球被采用作为目前货币系统的替代品，可能会为区块链经济奠定乐观前景。价值交换的未来将受到深远影响 (Rouse, 2018)。区块链的数字民主化可以通过几种方式促进发展中国家的经济\
  \ (Saberthey et al., 2019)：\n\n- 无权威层级的资源共享经济，因为分布式账本的用户可以之间直接进行金融交易，这为去中心化的、协作经济开启了大门。`OpenBazaar`\
  \ 是一个使用区块链技术促进用户之间交易的在线市场，就像 `eBay` 一样。从 `OpenBazaar` 供应商处购买时，客户不会被任何额外费用 ([Mamun,\
  \ 2022])。\n\n- 微电网用于描述居住得很近的个人社区，他们能够在之间产生、消费和交易电力。区块链技术允许通过交易能源市场买卖太阳能电池板产生的剩余能量。总部位于纽约的公司\
  \ `LO3 Energy` 正在开发用于去中心化电网的软件，使用可再生能源满足企业和消费者不断变化的需求。2016 年，该公司使得纽约布鲁克林的当地人能够与邻居进行小规模、环境负责任的能源交易，其中一些邻居没有自己的太阳能系统，而另一些则产生了额外的太阳能电力\
  \ (Mainellthey & Smith, 2015)。\n\n\n\n\n\n-   像 Facebook 等社交媒体网站的使用导致了用户信息的广泛免费交换。从历史上看，产生个人数据的工作人员被排除在买卖此类数据的交易过程之外。区块链底层技术使人们能够拥有并从其在线行为产生的数据中获益。保护用户隐私对于开发个人数据市场至关重要（Madan\
  \ et al., 2021）。区块链网络保证了数据买方和数据卖方之间始终存在智能合同，用于监管消费者个人数据的使用。这种协议可能用于验证和批准财务交易。包括\
  \ Wibson 和 Opiria 在内的一些企业已宣布引入基于区块链的去中心化个人数据市场。Opiria 成立于 2017 年，是一家首部总部位于伦敦的欧洲公司。用于激励的内部资金可以是比特币或代币，也可以是客户直接出售给商户的个人身份信息。只有在交易完成时，客户才会因提供个人信息而获得报酬。Opiria\
  \ 的创始人声称，全球范围内出售的个人数据已达 2500 亿美元（Raja Sanththey & Muthuswamy, 2022）。\n\n-   机器之间的交易通常被称为\
  \ M2M：M2M 是“machine to machine”（机器机器）的缩写，指的是一种允许网络设备在没有人工干预的情况下远程交换信息并执行任务的技术。由于\
  \ M2M 实时通信能力，制造商能够监控仓库运营并远程跟踪和管理其供应链，允许他们从任何地方进行操作。“仓库管理”、“交通控制”、“物流服务”、“供应链管理”、“车队管理”和“远程医疗”等术语经常与“M2M\
  \ 通信”结合使用。区块链技术的另一个增长用途是机器机器交易，或 M2M 交易。预计未来人工智能（AI）的发展将使机器能够租出去、支付自己的维护费用、购买自己的更换组件，并利用区块链技术存储自己的交易记录（Yeoh,\
  \ 2017）。\n\n## 理论考量\n\nAl-Saqaf and Seidler (2017) 认为，在执行涉及许多参与方的在线财务交易方面，一直存在若干技术和法律障碍，但这在过去几年才变成一个大问题。区块链技术的出现催生了对分布式交易系统的新颖查询，包括在线创建和接受数字货币支付的方法，以及区块链上资产分配和管理的复杂性。公共和法律诉讼的记录，例如婚姻证明和出生证明、法院公告、登记登记和出售契据等。智能合同、房地产的买卖以及许多其他物理资产（如黄金、钻石和汽车）的交易都是进一步工具的示例。这些困难的问题正以几年前完全无法想象的方式推动着信息系统（IS）研究的边界（Sharma\
  \ et al., 2020）。\n\nDurach et al. (2021) 认为，数字交易的开放性及其假设的匿名性是区块链信息系统研究中的主要理论课题。解决这种关系的适当框架必须提供一种手段，在不损害任何真实性的情况下保证两者的优势。一个重要的研究领域是使用公有-私有及其通用形式的多签名加密技术解决这一问题的理论可能性。开源软件、系统和计算平台已经是大量信息系统研究的焦点。信息系统领域的理论者非常感兴趣，探索数字货币的透明度以及支撑它们的区块链技术如何应用于该领域的开放性研究。负责实施和改进区块链技术的开源软件开发社区的底层治理结构是一个相关问题，其影响尚不明确。总而言之，这被称为“治理危机（Gohil\
  \ & Thakker, 2021)”。\n\nTrautman (2016) 认为区块链是一个公共账本，他们可以确信其中包含的信息未被篡改。众所周知，这是无处不在的加密货币比特币背后的底层机制。比特币是第一个使用区块链技术的数字货币。比特币是目前区块链技术最为人知的应用。区块链是一个分布式公共数据库，作为比特币去中心化数字货币支付系统的骨干，所有比特币交易在此记录并向公众开放。比特币网络的去中心化特性允许瞬时国际交易。比特币的独特之处在于，它的价格独立于任何银行、政府或其他中心化机构。比特币网络的货币量和用户群一直在增长。外汇市场存在持续交易，因为韩元、欧元和美元等主要货币交易非常频繁。这就是为什么比特币超过了所有预期，成为基于区块链构建的最为人知的加密货币（Trautman,\
  \ 2016）。\n\n根据 Prokofieva and Miah (2019)，公钥基础设施对于比特币的运行至关重要（PKI）。每个用户都有他们自己的私钥和公钥。比特币钱包地址通过公钥生成，而身份验证则通过私钥处理。每次比特币交换涉及发送者的公钥、接收者的公钥以及传输的价值。大约\
  \ 10 分钟后，交易将放入一个区块中。在完成一个新的段落后，它被添加到现有文本中。每个区块及其相关交易数据的副本存储在每个用户或节点的本地磁盘上，因此当发生新交易时，可以与之前的区块进行对比。节点因确保财务交易的完整性而获得补偿。`挖矿`指的是这一过程，而`工作量证明`（Proof-of-Work）被用于验证它。这是实现区块链潜力的基本概念。`挖矿`过程是创建数字货币的方式。在验证所有交易后，网络节点将达成共识。最现代区块是跨越几个世纪序列中的最后一个。比特币网络使用区块链（由区块组成的分布式数据库）来记录和验证交易（Centobellthey\
  \ et al., 2022）。\n\n\n\n\n\n根据 Sun et al. (2016)，“区块链”一词被用于描述比特币的分布式账本技术。其主要功能是让用户更方便地使用比特币进行金融交易，例如买卖。在缺乏监管机构的情况下，这种策略有潜力为所有发生过的比特币交易的公共记录提供合法性。区块链的优点之一是，数据一旦经过所有节点的验证，公共账本就无法被更新或撤销。这些保护措施在很大程度上是由于区块链迅速崛起的原因。区块链技术的未来应用可能会大幅增加。例如，云计算的广泛使用将使数字合同的生成与执行，以及系统节点之间的数据交换和交易成为可能。由于区块链的主要卖点是它为存储数据提供的安全性，因此它在各种环境中都得到了广泛的应用（Mackey\
  \ et al., 2019）。\n\n# 区块链分类\n\n目前有三种不同类型的区块链系统，但它们可以总结为：公有区块链、私有区块链和联盟链。他们并列评估了这三种不同的区块链（Abeyratne\
  \ & Monfared, 2016）。\n\n*   **警告**：需要许可阅读。在公有区块链中，任何人都可以查看交易，但在私有区块链或联盟链中，对账本的访问是限制的。收集的数据在多大程度上向公众开放由联盟或组织决定（Mackey\
  \ et al., 2019）。\n*   **有效性**：由于公有区块链网络上有许多节点，传播交易和区块需要大量的时间。在考虑网络安全时，公有区块链的限制变得更加严格。这导致了处理时间缓慢和交易延迟增加。联盟链和私有区块链可以通过较少的验证者运行得更高效（Berdik\
  \ et al., 2021）。\n\n由于其通用的访问性，公有区块链有潜力服务庞大的用户群。社区也有大量的活动。Hyperledger 正在开发商业联盟链框架。以太坊也为构建联盟链提供了资源。由于其效率和可审计性，许多企业仍在实施私有区块链（Teufel\
  \ et al., 2019）。\n\n拜占庭将军问题（BG）是区块链技术中共识问题的一种变体。在拜占庭将军问题中，拜占庭军队师师的指挥官正在包围这座城市。如果只有部分将军对城市发动进攻，进攻将会失败。发起进攻的决定需要将军们之间达成共识。但即使在将军们之间，叛徒也可能提供相互冲突的决策。没有人可以信任。类似地，区块链的去中心化本质使得在这种环境下找到对任何事情达成共识的方法非常困难。在区块链中，没有中央权威来确保所有节点的账本一致。因此，需要特定的协议来保证一致性（Hileman\
  \ & Rauchs, 2017）。\n\n# 区块链安全属性分类\n\n我们开发了一套安全特征分类法来评估区块链系统的稳健性，并以 CIA 模型作为指导。我们建议的质量属性可以分为两类：与区块链采用的共识协议的可靠性相关的，以及与支撑区块链服务的平台和技术相关的（Khezr\
  \ et al., 2019）。\n\n在没有中央权威的去中心化网络中，所有交易都使用名为区块链的安全分布式技术进行跟踪和记录。这样的系统应该同时具有可靠性（或一致性）和活力。第一个与平台的共识机制有关，而第二个由平台的架构建立。因此，我们描述了应该包含在每个区块链共识过程中的三个安全特性（Zubayd,\
  \ 2019）。\n\n# 区块链的应用\n\n区块链技术可能会对许多行业和职业产生巨大影响。许多人熟悉并使用基于区块链的加密货币应用，但该技术的实用性此已扩展到加密货币领域。许多公司已经认识到它的价值并正在进一步研究。金融部门并不是区块链显示前景的唯一行业。随着开发者专注于创建用户友好的界面和新的用例，预计未来软件的易用性将得到提高。由于需要改进信息访问、数据完整性和操作韧性等等原因，企业和部门有动力去尝试和构建基于区块链的应用（Tönnissen\
  \ & Teuteberg, 2020）。\n\n## 金融应用\n\n在基于区块链的加密货币系统发展之后，各个金融领域有很多可能的应用。在金融部门，个人和机构之间的交易通常通过第三方中介进行处理。区块链内置的特性和功能使其成为这些受信中间人的理想替代品，特别是在防止重复金融交易以及注册和验证金融操作方面。以下是一些跳过银行和金融机构等传统中介的区块链金融应用示例（Rijanto,\
  \ 2021）。\n\n### 支付\n\n\n\n\n因此，区块链已作为一种潜在的金融交易新方法进行测试。每天有数百万亿美元转账，但世界仍使用一种过时的金融系统，这增加了成本并使得交易花费的时间比所需的长。通过消除在金融交易验证和结算中对可信第三方的需求，基于区块链的`Bitcoin`和`Ethereum`等公共加密货币系统使得世界上任何人都能即时发送和接收付款。欧洲支付委员会几乎一致地预测，到\
  \ 2025 年，区块链技术将彻底改变支付业务。加密货币短期内不太完全取代法货币。然而，在货币交换方面，加密货币交易量（尤其是`Bitcoin`和`Ethereum`）在过去几年稳增长。银行等金融机构也开始探索区块链技术。美国跨国投资银行和金融服务控股公司`JPMorgan\
  \ Chase & Co.` 于 2017 年 10 月 16 日宣布，将与两家国际合作伙伴（`Royal Bank of Canada`和澳大利亚新西兰银行集团有限公司）合作推出`银行间信息网络\
  \ (IIN)`。2018 年 9 月 25 日，超过 75 家金融机构加入了`IIN`。在这个网络中，许多银行首次在全球范围内在现实场景中使用区块链技术（Zhang\
  \ & Zhao, 2018）。\n\n## 金融清算与结算\n\n通过区块链，企业和机构可以跟踪、验证并进行金融结算，而无需涉及第三方清算所。调整财务承诺以授权付款是借助区块链技术可以变得更简单的清算操作示例。得益于区块链技术，交易可以比目前的`SWIFT`等系统更即时地结算并更高效地跟踪。最早的用户之一`Royal\
  \ Bank of Canada`已开始使用基于区块链的平台`Hyperledger`进行其与美国和加拿大的银行间结算。`Ripple`和`R3`是两个与传统银行合作、通过区块链技术提高交易质量的初创公司（Tijan\
  \ et al., 2019）。\n\n## 股票交易\n\n通常，由单一实体（如交易所）监督所有的股票交易。所有的交易和付款都由这个中心化管理机构详细记录。在这种安排下，费用增加，结算时间随之增加。在这方面，已经创建了一些基于区块链的解决方案。例如，`Polymath5`正在创建一个通过区块链技术交易数字证券的平台和市场。该平台上证券代币的发行是与`Blocktrade`、`Corl`和`Ethereum\
  \ Capital`合作完成的。另一个是考虑`Overstock 的 tZERO`交易平台。2018 年 10 月，`tZero`成功完成了一次产生 1.34\
  \ 亿美元的私募数字代币发行。这些代币在`tZero`上的交易始于 2019 年初（Swan, 2017）。\n\n## 贸易融资\n\n繁琐的单据、增加的错误以及交易双方之间冗长的交易处理方式只是与传统贸易融资相关的问题之一。区块链为贸易融资行业提供了许多潜在收益，包括消除纸质文件、流程和付款自动化、减少欺诈和降低支出，以及提高所有相关方的货物跟踪和可见性。企业和金融机构建立了许多财团，目标是改善贸易融资。其中一个区块链计划是由`IBM`与银行领导的小组`R3`合作建立的。包括`BBVA`、`Mizuho`和美国银行在内的十二家主要金融机构合作开展了一项将纸质信用证数字化的倡议。世界两大主要银行`Standard\
  \ Chartered`和`HSBC`正合作利用区块链技术更好地改进贸易融资。总部位于以色列的金融科技初创公司`Wave`创建了一种可用于信用证在内的金融交易的区块链解决方案。通过该平台，巴塞罗那的`EuroFinance`能够为`Ornua`和塞义尔尔贸易公司等企业提供区块链解决方案。由于使用了`Wave\
  \ 的平台`，该公司能够优化其供应链，从而降低了交易成本，消除了纸质单据中的错误，并加快了向全球客户交付单据的速度（Kim & Shin, 2019）。\n\n\
  ## 会计应用\n\n会计行业从区块链技术中获益良多。在验证公司财务状况时，自我审计和不可逆的记录可以产生深远的影响，包括显著降低审计的难度和复杂度。由于区块链技术在记录、处理、验证和存储财务交易及数据方面的创新方法，会计行业和商业生态系统都可能发生重大变化。也许会计行业会将区块链视为下一次重大技术进步。企业可以放弃基于交易收据维护自己的记录，而是直接将交易录入共享账本，从而建立一个相互关联且永久的会计记录系统。此外，与不同业务伙伴的交易可以以极小的努力进行比较，且不会损害个人隐私（Haddoutthey\
  \ & Ech-Cherif El Kettani, 2019）。\n\n## 保险相关应用\n\n销售、承保、客户入驻、理赔处理、付款、资产转让和再保险只是保险行业对区块链技术及其应用日益增加兴趣领域领域。客户、保单持人和保险供应商之间的交易可以通过区块链技术获得便利。在保险行业，区块链技术可用于多种用途，包括承保、保单发放、理赔和再保险协助。此外，区块链可以改进保险价值链，因为它可以提供长期的战略利益，包括由于流程简化导致的运营成本降低、更低的交易对手风险、增强的自动化以及去中心化、安全的交易。以数字化管理现有保单将大幅减少行政支出。智能合约轻松管理`if-then`交易连接的能力使得可以使用数字流程自动执行约定的保单条款，从而避免了关于保单条款的争议和误解问题。旅游保险、农作物保险、财产和责任险以及健康险只是从区块链技术中受益的某些领域。保险公司、医疗机构、殡仪所、政府机构和受益人可能都作为基于区块链的多方共享网络的节点。在保险和理赔方面，这种方法可以提供去中间化和速度，以精简流程并消除欺诈。`B3`他们可能会为财产再保险保单创建一个区块链概念验证。在\
  \ 38 家保险公司和经纪人的帮助下，该业务将把整个再保险合同流程移动到去中心化的区块链上（Ahmad et al., 2021）。\n\n\n\n\n# 供应链管理应用\n\
  \n区块链技术的众多优势之一包括提高供应链的透明度和可问责性。基于区块链的供应链管理（SCM）流程与成功率的提高和质量的提升。分布式账本技术使得追踪数据一旦输入就无法被修改。供应商之间信任度的增加是由于区块链能够追踪并验证供应链中每个环节产品和服务的状态的直接结果。区块链允许供应商在任何时间进行独立审计，在提高效率的同时节省时间和金钱。通过使用区块链技术，可以监控并维护发送物品的质量。供应链中的利益相关者可以通过查看运输和存储时间戳，识别某物品是否存放时间过长或是否未出现在其应在的位置。这些担忧在处理易腐商品（如易腐食品）时尤为重要。这仅仅是区块链技术如何被用于确保产品真实性和质量的一个例子。区块链技术可以应用于物流领域。在处理物流事宜时，通常需要同时优先考虑多个不同的目标（Perera\
  \ et al., 2020）。\n\n运营和子活动必须在各种环境中同步进行，包括工厂、存储设施、运输企业和政府机构。为了有效地规划、调度、协调、监控和验证物流流程，需要物流管理程序中的高层嵌入式服务。幸运的是，区块链技术可以有效且安全地处理这些功能。当用于物流交易时，区块链技术具有大幅缩短处理时间、行政成本和人为错误的潜力。此外，智能合约将以更及时、更廉惠的方式增强参与方之间的协议和合同。已经创建并实施了许多基于区块链的供应链和物流管理系统及应用程序，以利用区块链的优势及其对供应链管理和物流领域的重大影响。IBM\
  \ 开发了一个基于区块链的系统来追踪农产品的来源。在 2018 年的试运行中，包括沃尔玛、The Kroger Co.、Driscoll's、Dole、Golden\
  \ State Foods、McCormick and Co.、McLane Co.、雀巢、泰森食品和联合利华在内的零售商和制造商监控了数百万件食品。通过使用区块链技术，丹麦海运巨头马士基可以在任何时刻追踪每一个物品的位置。此外\
  \ Provenance 公司，它在印度尼西亚使用 RFID 标签、区块链和手机试点了一项海鲜追踪程序。截至 2016 年，该公司已能够有效执行鱼类监控（Gürkaynak\
  \ et al., 2018）。\n\n# 广告与媒体应用\n\n如今，没有一家公司可以在没有某种形式在线广告的情况下运作。在线广告具有许多优势，例如可衡量、互动性、盈利性、可信且廉价。然而，它也有某些缺点。例如，用户担心数据隐私和他们看到的广告，而出版商和广告商则为广告欺诈、低效以及衡量和估计投资回报率的困难感到担忧。数字营销领域面临三个主要挑战。首先，广告领域存在许多中间人，这推高了所有参与者的成本。广告商和出版商都发现在线广告过程正变得越来越低效且昂贵。有时，出版商无法出售所有库存，因为大部分库存的售价价格太低。此外，广告必须向中间人支付费用。数据隐私是另一个需要解决的与用户相关的问题。用户进行的搜索经常被记录，随后用于投放专门为搜索用户兴趣量身定制的广告。虽然有些人对此表示接受，但许多其他人将其视为对隐私的侵犯并并不支持（Suman\
  \ et al., 2021）。广告欺诈是第三个被发现的问题（Hashemthey Joo et al., 2019）。使用自动化系统查看或与广告互动是常见的做法之一，这会偏曲活动评估的结果。对于这些问题中的每一个，区块链技术都提供了可行的解决方案。当涉及在线广告时，区块链允许各方之间建立直接联系而无需中间商，并且它可以向所有相关方提供准确的信息，例如来自用户的实际点击次数以及广告显示的频率和时间。几家企业忙于创建由区块链驱动的广告网络（Mushtaq\
  \ & Haq, 2019）。\n\n# 法律相关应用\n\n法律行业被赋予了巨大的权威，因此遵循一套关于行为、信托会计和客户保密的独特规则。这些需求的基础是信任。这种信任无法通过早期的技术建立，因为它们缺乏所需的安全透明度。有了区块链技术，这个问题现在已经过时了。它填补了以前虚拟交互中存在的信任缺口。因此，任何拥有智能手机的人都可以在网上寻求并获得可靠的法律咨询。在线身份验证和具有法律约束力的合同执行将成为可能。它将使资产的碎片化所有权成为可能。如果你正在寻找一个区块链可以实用的领域，看法律部门就对了。参与者人数众多、文件、信息和交易量巨大、缺乏信任以及由于法律费用造成的巨大摩擦，都是推动其增长的主要因素。记录保存和财务交易是法律服务行业的两个关键区块链应用。信息注册、身份管理、智能合约、交易注册和支付都是这两个应用的子集。随着区块链的发展和增强，它将应用于法律部门更多的领域。法律领域的创新者预计，区块链和智能合约将从根本上改变法律执业的方式。知识产权、房地产、公共文件、土地登记和合同只是法律系统中可以使用区块链和智能合约的部分领域。例如：伊利诺伊州在一个试点项目中尝试使用区块链来记录和存储土地记录（Francisco\
  \ & Swanson, 2018）。\n\n## 房地产应用\n\n\n\n\n\n经纪人、政府财产数据库、产权公司、托管公司、检查员、评估师和公证人只是参与房地产交易的众多实体，这增加了交易的复杂性、模糊性和高成本。2017\
  \ 年，记录有 9645 名房地产欺诈受害者。Openledger16 声称，区块链可以通过使房地产操作更具预测性和透明度来改进其流程，从而让所有参与方的投资更安全。此类诈骗只是区块链技术可以改进的一个领域。除了反欺诈，分布式账本智能合约的益处还包括简化交易、减少中间人、降低总成本和更快的交易达成\
  \ (Francisco & Swanson, 2018)。特别是在法律体系缺乏房地产记录信任和开放理念的、或土地登记系统不可靠的发展中国家，区块链可以加速物业所有权的注册和转让。此外，每处物业都可以拥有其独特的数字地址，该地址可以永久传输并跟踪所有过去的交易，并包含有关物业占用、财务状况、法律状态、建筑性能和物理特征的信息。为了解决现有问题并彻底改变交易模式，房地产行业非常适合采用区块链技术。房地产市场已经开始看到这些变化。例如，荷兰鹿特丹市正在与德勤合作，开发首个用于记录租赁的房地产区块链应用\
  \ (Mukherjee & Singh, 2020)。\n\n# 医疗应用\n\n在当今的医疗系统中，患者健康健康信息至关重要。越来越多的医生将患者数据保存在称为电子病历（`EMR`）的计算机化文件中。医疗数据的数字化允许更快速的检索和交换，最终通过提高治疗质量和决策效率来使患者获益，但对患者隐私构成了重大风险。不仅如此，医疗行业还缺乏维护患者健康记录的可靠方法。为了提供尽可能的治疗，医疗团队的多个成员需要访问不同的数据集。目前，`EMRs`\
  \ 分散在几个互不相连的系统中。如果这些文档仍以纸质形式保存，它们可能已经过时。虽然医疗机构对 `EMR` 的采用正在增加，但由于对患者隐私和安全的考虑，跨医疗提供者和医疗机构共享\
  \ `EMRs` 的进度滞后。然而，通过区块链技术，医疗系统可以确保电子病历（`EMRs`）是最新的，并且 `EMRs` 和其他医疗信息可以在多个提供者之间安全共享。除了保护敏感患者信息，区块链技术在医疗领域可能有进一步的应用。由于行政任务时间的减少，医疗人员将有更多时间陪伴患者，人员将能够分享他们的发现并创建更有效的治疗方法。改进药物研究和减少欺诈索赔及账单是两个潜在益处。医疗行业开始感受到区块链技术应用的影响\
  \ (Cocco et al., 2017)。\n\n# 方法\n\n## 公有区块链\n\n任何去中心化原则的实现都可以用于这些区块链。它们不任何方式限制成员身份，只要有电脑并接入互联网即可\
  \ (Erceg et al., 2020)。\n\n### 优点\n\n- • 可信：已存在防欺诈算法。参与者不需要担心干扰网络中的其他节点。\n- • 安全：由于每个人都可以访问此区块链，因此其规模非常大。对于更大数量的节点，数据点的分布更加明显。\n\
  - • 去中心化：因为网络不是中心化的，每个参与者都拥有自己的账本副本。\n\n### 缺点\n\n- • 处理：由于其规模巨大，交易程序以一种极其缓慢的速度运行。这种验证每个节点的耗时过程是一个主要缺点。\n\
  - • 能量消耗：工作量证明需要过剩的电量。为了成为网络的活跃成员，他们需要高质量的计算硬件。\n- • 接受度：由于没有中心化机构，政府无法快速整合该技术。\n\
  \n**用例：** 作为由于公有区块链可以使用工作量证明或权益证明进行加密，因此可以被用于完全取代现有的货币基础设施。使该区块链去中心化的智能合约是其复杂的部分。两个流行的公有区块链是比特币和以太坊\
  \ (Feng et al., 2019)。\n\n## 私有区块链\n\n由于只允许子节点参与过程，这些区块链在本质上比公有区块链更安全 (Feng et al.,\
  \ 2019)。\n\n### 优点\n\n- • 速度：由于交易价值低，其速率很高。确认每个节点所需的时间更短。\n- • 可扩展性：它们可以改变可扩展性。网络的大小可以手动确定。\n\
  \n### 缺点\n\n- • 安全性：由于这种类型的节点较少，存在被操纵的可能性。这些区块链具有更大的安全漏洞。\n- • 中心化：主要缺点之一是信任建立是中心化的。可能会被腐败组织利用。\n\
  \n**用例：** 区块链如果得到适当保护和维护，可以成为保护敏感数据不受窥探的强大工具。因此，它们用于投票、资产管理和内部审计。`Hyperledger Corda`\
  \ 是一个私有区块链平台 (Filimon & Naumova, 2020)。\n\n## 混合区块链\n\n它是一种包含私有和公共数据的区块链，其中某些交易由单一实体锁定，而另一些对所有人可见\
  \ (Azthey et al., 2019)。\n\n### 优点\n\n- • 生态系统：这种区块链是混合的可能是它最大的优势。由于 49% 的用户不在网络中，它是完全安全的。\n\
  - • 成本：由于一小部分节点需要确认交易，用户成本较低。不需要验证所有节点，减轻了网络的计算负担。\n- • 架构：它非常灵活，同时保持您的数据安全、隐私且可见。\n\
  \n### 缺点\n\n- • 效率：遗憾的是，并不是所有人都能从混合系统中受益。此外，公司在维护方面面临困难。\n- • 权限：某可能会向用户保留数据。组织授予混合区块链访问的意愿将决定用户是否获得访问。\n\
  \n**用例：** 对于医院、政府和银行等部门，它是更好的答案。它是人们需要访问受保护信息的情况的解决方案。Ripple 网络和 `XRP` 货币是混合区块链的两个工作示例\
  \ (Yaeger et al., 2019)。\n\n## 联盟区块链\n\n\n\n\n\n这是一种为了满足需求的原始策略。这种区块链不仅能验证交易，还可以启动或接收交易（Scholl\
  \ et al., 2020）。\n\n### 优势\n\n- **速度**：由于用户群较小，验证时间缩短了。凭借如此快的传输率，这在业务中使用中更具实用性。\n\
  - **安全性**：标记区块中包含的数据对外部是隐藏的。然而，任何区块链网络的成员都可以访问这些数据。\n- **灵活性**：区块链的适应性差异很大。由于风险较低，可以做出更快的选择。\n\
  \n### 缺点\n\n- **审批机制**：由于协议已获得所有成员的批准，它对变更的开放度较低。由于涉及多个一个小组，可能会出现相互竞争的优先事项。\n- **透明度**：如果机构本身腐败，则可能被黑客攻击。企业可能会向客户隐瞒数据。\n\
  - **风险暴露**：如果只有一小部分节点被破坏，区块链可能更容易受到攻击。\n\n## 用场景\n\n它对于商家、银行和其他类型的支付处理程序可能非常有用。由于组织内部频繁发生跨部门协作，组织食品追踪最适合使用联邦解决方案。联盟链区块链包括\
  \ `Tendermint` 和 `Multichain`（Xu, 2019）。\n\n## 结论与建议\n\n区块链作为分布式计算和数据保障领域一种可能改变游戏规则的技术正受到关注，在这些领域，它可能被用于构建可靠安全的数据共享和传输系统。区块链在网络安全方面具有巨大潜力，但在安全性、可扩展性和性能等方面存在许多未解决的问题，这限制了它在现实业务模型中的应用程度。区块链底层架构的去中心化和点对点性质使其被广泛认可和采用作为一种有前景的新技术。区块链的架构元素显示出简化交易验证、差异对账和争议解决等繁琐流程的能力。由于其分布、隐私、不可篡改和审计性等基本特性，区块链还具有颠覆传统公司运营方式的潜力。为了实现消除中间人的目标（特别是在金融交易中），区块链依赖去中心化的共识系统来处理和验证交易。`Proof-of-Work\
  \ (PoW)`、`Proof-of-Stake (PoS)`、`Proof-by-Fee-Transaction (PBFT)` 和 `Delegated Proof\
  \ of`` 是活跃区块链系统 (`DPoS`) 使用的最常见共识机制。尽管区块链最初被设想为公共分布式账本，但现在有几种不同的区块链实现。公有链、私有链和联盟链是分布式账本系统的三个主要类别。投资资金、对完全匿名性的需求以及预期后果等考虑对于决定使用哪种区块链技术至关重要。例如，金融机构非常重视匿名性，这就是为什么他们对私有链更感兴趣。同时，参与类似活动并希望实现类似结果的组织准备好共享费用和数据，因此可能选择利用联盟链。\n\
  \n直到最近，区块链的唯一用途是在 `Bitcoin` 领域；然而，新的创新极大地拓宽了这项技术的适用性。这项研究的发现表明，区块链技术在许多领域具有广泛的应用潜力，包括但不限于广告和媒体、能源、房地产、医疗保健等。随着几个行业意识到他们无法再忽视区块链的基本利益（包括透明度、业务连续性、去中介化和信任等），他们开始对区块链产生兴趣并对其能力和用途进行研究。由于智能合约现在可以通过区块链技术的帮助实现，关于其用途已有多种建议。众所周知，区块链技术具有解决几个问题的能力。然而，他们现在才意识到区块链必须克服的一些障碍，例如与可扩展性、安全法律法律的问题。为了让区块链技术变得更加可靠和有效，解决它目前面临的局限性至关重要。\n\
  \n## 未来展望\n\n对于数字化转型的未来，优先考虑许多关键领域将至关重要。目标是促进远程功能的简化使用。在我们看来，公司的首要任务应该是员工的福利。数字孪生的处理能力可能用于数据挖掘和预测。无代码平台的出现可能会让任何人轻松创建自己的付费应用程序。量子计算与边缘计算的可能会开启数字化转型的新时代。所有光子网络必须提供端到端的数据完整性。客户端设备和服务器之间传输的信息对于任何功能性数字系统的增长至关重要。在上述所有应用中，预计区块链在未来几年将发挥关键作用。\n\
  \n## 总结\n\n- 引言介绍了区块链技术的意义、益处、优势和局限性。文中指出区块链技术的一个主要缺点是，在记录后可能很难更改或更新信息。\n- 本文献综述涵盖了区块链对全球经济的影响和经济效益、区块链的理论担忧以及区块链的业务应用。\n\
  - 在区块链分类方面，正如他们所见，联盟链在业务领域具有广泛的应用，并确定了特征分析侧重于责任和职权。\n- 在“区块链应用”章节下，他们涵盖了区块链技术在多个行业中使用的许多不同方式，包括但不限于金融、会计、保险、供应链管理等。\n\
  - 数字营销的道路上有三个主要障碍。首先，广告行业充斥着中间商，推高了所有方的成本。无论是广告商还是出版商，参与互联网广告的所有人都都开始注意到工作变得更加困难和昂贵。\n\
  - 在优缺点章节最后，我们讨论了私有链、公有链和联盟链的区别。\n\n\n\n\n\n## 参考文献\n\n- Attaran, M. (2022). 医疗保健领域的区块链技术：挑战与机遇。《国际医疗管理杂志》，\
