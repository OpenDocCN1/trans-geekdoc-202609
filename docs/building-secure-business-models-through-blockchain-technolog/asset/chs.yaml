  \ in Computers. Elsevier.\n\n# 第 4 章\n\n- **Mushtaq Ahmad Shah**\n  印度贾兰达尔趣味专业大学\n\
  - **Furquan Uddin**\n  印度加尔各答 Aliah 大学\n\n### 摘要\n\n考虑到区块链技术在建筑工程中的重要性和面临的挑战，本研究探讨了区块链技术在建筑行业中的潜力，以及这种颠覆性技术如何重塑建筑项目。利用区块链简化与这些复杂项目相关的合同流程和文书工作，可以节省资金、释放宝贵资源并加速项目完成。区块链记录具有不可篡改性，这将有助于执行工作合规性并遏制潜在的记录造假。因此，开始关注这些领域的区块链融合努力是有意义的，并随着技术的不断完善再对其进行扩展。\n\
  \n### 引言\n\n印度的建筑业正在迅速扩张，预计未来五年将增长 10%。它是该国第二大就业来源，雇用了约 5000 万人。然而，在建筑项目中，一系列额外的不利因素，如设计缺陷、设计文件不全和错过期限、预算超支以及监管限制，了了范围内多个项目的进度\
  \ (Shah & Ghayas, 2022)。这些因素导致印度一半的建筑项目发生延误。基础设施项目需要多个供应商和承包商的合作，所有人都必须获得其付出的报酬。目前的发票和支付方式缓慢、不透明且容易欺诈。为了在\
  \ 2025 年实现 5 万亿美元的经济目标并继续快速发展，政府必须在基础设施建设中使用尖端技术。通过在安全、透明度、支付处理速度和可持续性方面引入新技术，可以大幅减少主要限制。区块链技术通过生成所有交易的透明且不可篡改的记录，并允许从制造到分销或终端用户使用的资产追踪，简化了这一过程。\n\
  \nSeebacher and Schuritz (2017) 定义区块链为“一种分布式数据库，在点对点网络中共享并达成共识。它由一系列链接的区块（交易的存储单元）组成，保存着带有时间戳的交易，这些交易通过公钥加密（即“哈希”）进行保护并由网络社区进行验证。一旦元素被添加到区块链中，就无法被更改，从而使区块链成为过去活动的不可篡改记录。”换句话说，区块链被描述为不断增长的数据集合，被称为区块，它们通过加密连接在一起。每个区块都包含前一个区块的哈希值、时间戳和数据记录的用户\
  \ (Wang et al., 2020)。区块链通常由点对点社区作为公共账本运行，该社区遵循一种用于节点间通信和验证新区块的机制。一旦记录，任何特定区块中的内容在不影响所有后续区块的情况下无法追溯地更改，而这需要网络共识协议。\n\
  \n区块链技术（BCT）已部署在包括医疗、制造和工程在内的广泛领域。由于其潜在收益，区块链引发了建筑研究者的好奇心。例如，智能合约被用于促进安全和隐私、保留交易记录并提供匿名信息的访问性\
  \ (Das et al., 2020)。新型区块链正用于解决建筑供应链中的信息鸿沟。区块链已与建筑信息模型（BIM）整合，以改进 BIM 工作环境 (Liu\
  \ et al., 2019)。通过提供透明的数据，并通过精确描述参与方约定参数的智能合约来清晰地沟通需求和期望，BCT 的采用可以成为更好地管理建筑项目的成功解决方案。\n\
  \n区块链技术的使用具有改进项目管理和财务潜力，包括招标、合同管理、项目规划、风险评估和保险。此外，它将显著缩短跨国项目转账所需的时间和成本，从几周缩短到几分钟\
  \ (Luo et al., 2019)。当建筑业与区块链技术结合时，通过“物联网 (IoT)、建筑信息模型 (BIM) 和人工智能”等最新技术，可能克服许多障碍。一个强调创新、成功和可持续性的框架应运生，因为\
  \ BCT 平台是去中心化的，减少多余的官主义将增加开放交流，而 BCT 的应用将防止基于企业运营模式数字化的分歧。由于技术的升级、改进的通信技术、更短的交付周期、更好的工作环境和更高质量的产品，工业\
  \ 4.0 技术对于制造业及其长期生存至关重要 (Kamble et al., 2018)。\n\n区块链技术广泛应用，特别是在建筑业等保守行业，该行业在接受技术创新以改进运营和工作流方面进展缓慢。然而，许多解决方案以卓越的结果克服了建筑行业的难题。基于区块链的合同、用于透明度和可溯性的智能合约以及增强的信息流正驱动着这种扩张\
  \ (Wang et al., 2020)。建筑业落后于其他行业 (Ye et.al., 2018)。\n\n## 材料与方法\n\n建筑业一直努力提高生产力和效率，同时利用技术进步所带来的优势。本研究调查了区块链在建筑领域的可能性，并探讨了这种数字革命如何通过提高程序和操作效率来颠覆建筑业务。本研究论文识别了驱动建筑组织采用区块链的关键功能和主要因素，以及影响并实现建筑领域区块链技术实施的因果关系。\n\
  \n\n\n\n采用了系统性的文献分析和检索方法，从 Scopus 和 Web of Science 数据库中筛选与区块链相关的研究出版物。研究策略和框架采用了整体方法，其中建筑业的区块链采纳基于三个基本因素：驱动因素、理论依据和优势。研究结论将帮助建筑业利益相关者、企业和决策者理解影响区块链采纳的复杂方面，以及如何解决这些问题。这些见解还将帮助行业的重要利益相关者部署区块链及技术。文章强调，建筑业有必要调查\
  \ `BCT` 的多种功能，以衡量其实优势。\n\n# 区块链特性\n\n技术突破为信息共享定了基础；然而，这些技术进步在满足需求方面面临局限性，例如缺乏安全性、透明度、信任和连接性等。这些困难通过区块链系统得到了解决。例如，`BCT`\
  \ 通过永久存储在块中来保护 `IoT` 中易受黑客攻击的数据（Amanullah at el., 2020）。`BCT` 演变业务及其系统的独特特性如下：\n\
  \n| 图 1. 区块链特性 |\n| --- |\n| ![Figure978-1-6684-7808-0.ch004.f01](img/ch004.f01.png)\
  \ |\n| --- |\n\n## 去中心化\n\n去中心化将主要政府职能的权力和责任从中央政府转移到包括地方政府、公民社会和私营部门。去中心化系统是一个网络，其成员可以是计算节点、制造机器、机器人或人类。每个节点都是网络的一部分，复制所有块。节点在通过地址识别成员的网络中验证数据安全（Arashpour\
  \ et al., 2019）。该平台不由单一机构管理。广泛的点对点连接中的所有操作都存储在公共块列表中。没有个人对系统拥有总权限，每个参与者都有机会查看数据；访问性由网络访问权限决定。由于具有高度的访问性，所有参与节点都会检查记录的数据；因此，没有人可以为了自己的利益而编辑特定文档（(Wang\
  \ et al., 2019) ）。\n\n分布式账本技术（`DLT`）是受关注的最新创新之一。加密货币 `Bitcoin` 的广泛使用增加了对区块链技术以及分布式账本技术（`DLT`）的兴趣。一种被称为加密货币的数字资产被作为交易手段。通过使用加密协议，交易和代表的资产不受篡改和欺诈（(Chohan,\
  \ 2022)）。\n\n## 共识\n\n共识算法在计算环境中的未识别同伴之间建立信任，并为区块链网络提供可靠性。共识过程是区块链网络的基础要素，确保在这样的缺乏信任的环境中，所有参与者对网络状态达成一致。共识方法还控制网络的其他功能，如添加交易和激励玩家采取伦理行为。由于连接延迟或经典故障，区块链内部的节点可能会故障、参与任意或敌对行为，或持有不准确的信息。区块链网络的共识机制确保在这样的缺乏信任的情况下，所有参与者对网络状态达成一致。\n\
  \n## 区块链不可篡改性\n\n不可篡改性（通常称为不可逆性）是区块链的基本属性，这是由于操作在经过适当验证并存储在区块链中后无法被更改或删除。该属性是加密链接的块通过前一个（父级）块的哈希算法连接在一起的结果。具体来说，每个块通过在其标头中添加前一个块中交易信息的哈希函数来携带对先前块的引用。此加密哈希是使用块所有交易的\
  \ `Merkle tree` 计算得。\n\n## 安全性\n\n通过仅允许经过批准的利益相关者传输信息，`BCT` 加密协议确保了数据和参与者的有效性。方面，协议采用“单向”哈希函数将任何长度的输入转换为用户定义的输出，称为\
  \ `hash value`。当产生新交易时，加密技术将其与之前的交易连接起来；这就是区块链技术具有韧性和安全性的原因。由于加密哈希函数加密数据，攻击者无法预测初始数据，因此无法对其进行修改或篡改（Fang\
  \ et al., 2020）。\n\n## 透明性\n\n区块链能够创建专业的证据链。这种能力促进了数据共享过程的可追溯性和开放性（(Kshetri, 2017)）。透明度有助于意识到记录的当前状态。透明度让人们理解账本的功能。此外，由于各种区块链技术允许用户在存储库中搜索条目，成员可以跟踪带有可验证时间戳的数据。一个中心化的存储库无法提供一个一致、安全且透明的网络来管理高质量数据。\n\
  \n## 隐私\n\n区块链网络中的“隐私”指的是两个方面：用户隐私和交易数据隐私。以下是区块链中交易隐私的两种形式：\n\n用户隐私（匿名性）：将区块链用户的真实身份转换为无法识别的身份的能力，同时确保原始身份无法获取。这通常被称为匿名性。它通过用计算机生成的地址伪装用户的真实网络地址来隐藏用户的真实身份。通过隐藏操作细节，保护了区块链数据隐私。机密信息也被称为隐私。在最基础的层，交易的数据内容通常被加密以确保网络机密性。维护数据机密性保护交易内容免受未经授权的访问、篡改和更改。\n\
  \n## BCT 特性在解决建筑问题中的作用\n\n区块链在基础设施项目的早期阶段提供了各种可能的应用。智能合约和加密货币是在设计阶段将区块链引入建筑项目中最显而的结果。当设计过程的阶段（识别、规划、采购、执行状态等）转移到区块链上时，链中的每个成员都验证并更新可信的项目信息以便工作。这种策略可以减少不确定性，提高生产力并减少错误。生成块的人包含身份信息，并且可能识别出谁对特定信息负责。智能合约可用于将内部功能与\
  \ `BIM model` 链接起来以提高供应链交易效率；确认许可和检查等重要流程事件；实现财务交易；确认修改订单；并提供通知。最终结果是项目程序的清晰记录以及建筑的竣工状况。\n\
  \n\n\n印度建筑项目中的严重延迟和分歧与款项索赔解决、文档记录以及利益相关者的参与有关。区块链技术（BCT）可以通过提供去中心化、安全性和透明来处理广泛的系统难题。在全球范围内，资本建设活动的供应链具有高度碎片化、分散和复杂的特点。例如，在哈利法塔发展的鼎盛时期，雇佣了来自\
  \ 100 多个国家的近 12,000 名员工。管理如此巨大的供应链并跟踪工作进度、进度、成本和付款需要巨大的努力和资源。\n\n图 2 展示了 BCT 特性与相关责任，以及建筑中支付、协作和文档追溯性问题之间的关系。\n\
  \n| 图 2. 建筑中的区块链 |\n| --- |\n| ![Figure978-1-6684-7808-0.ch004.f02](img/ch004.f02.png)\
  \ |\n| --- |\n\n在全球范围内，资本建设运营的供应链极不稳定、分散且复杂。在施工高峰期，哈利法塔雇佣了来自 100 多个国家的近 12,000 名工人。处理如此广泛的分布网络并维护工作进度、调度、成本和付款记录需要巨大的努力和资源。除了这些挑战，建筑项目在不同阶段和不同程度上还会遇到各种错误、延迟和事故。在建筑行业，不负责任一直是长期来的问题，由于利润空间如此狭，公司正在寻找最小化成本并避免对随后的悲剧负责的方法。这些是关键的“痛点”，也是区块链技术可能利用以使所有项目参与者的流程变得更加高效、透明和负责任的领域。\n\
  \n### 协作进展\n\n建筑一直是一项团队活动，涉及人数多寡不等。历史上，通信技术对范围内连接的个人之间的关系产生了巨大影响。建筑项目是复杂的，大量利益相关者参与项目会导致专业人士和组织之间出现碎片化问题。另一方面，现有的建筑方法面临着信任、知识传递和操作流程方面的问题\
  \ (Wang at al., 2017)。\n\n| 图 3. 区块链协作项目系统 |\n| --- |\n| ![Figure978-1-6684-7808-0.ch004.f03](img/ch004.f03.png)\
  \ |\n| --- |\n\n然而，分布式账本技术提供了信任、数据完整性、准确性、机密性和透明度，使得管理难题得以解决。例如，建筑设计可能在各个阶段提供，所有方必须获得通知。但是，由于利益相关者在不同的公司运营，可能会出现许多挑战，例如识别最新的图纸、谁发布了最新图纸、图纸是否包含在建筑/结构/服务设计中等。这些担忧都可以通过使用智能合约的区块链系统来克服，因为最新信息可以更新并提供给相关方。\n\
  \n区块链技术使人们能够安全地进行交互、组织和交易。因此，BCT 通过增加数据共享和减少层级来促进用户协作。建筑项目的关键利益相关者是区块链赋能网络的一部分。通过这种方式，网络治理基于所有利益相关者的共识和协议。每个参与者都拥有自己的但相同的区块链副本，其中包含了双方之间的每一次交互和交易。交互和付款是记录过的、防篡改且经过加密签名的，无论这些信息是私有的还是完全供每个利益相关者使用的。这为所有方过去的每一次商业交易产生了易于追溯的记录。通过这种方式，项目控制的复杂性和相关风险可能会大幅减少，可能相当于管理成本。为了提高运营效率和追溯性，可以使用加密协议（可以集成到基于区块链系统中的自动执行条件）。通过这样的系统，所有参与者之间的信任和协作将大大增强。\n\
  \n### 拥有平等的想法共享权利\n\nBCT 培养了一种协作文化，其中职责被明确定义，风险/奖励在参与者之间共享。智能合约管理访问责任，并奖励提供用户数据的用户和应用所有。通过将区块链中存储的数据的安全性和不可篡改性与两种主流区块链——`MultiChain`\
  \ 和 `Ethereum` 的特性相结合，参与者可以结合各自的优势：充足的数据存储和数据共享，以及用于访问控制机制的智能合约。因此，我们的新平台克服了互联网企业采用的传统集中用户模型的局限性，这些模型存在安全缺陷、缺乏问责机制，并剥夺了用户的数据所有权、控制权和激励。BCT\
  \ 定义了每个项目中的流程，培养了利益相关者之间的信任与协作 (Nawar & Ravindran, 2019)。由于建筑项目具有竞争氛围，BCT 通过赋予输入数据的平等权利和在共识决策中的平等地位，避免了参与者之间不健康的竞争。通常，区块链被用于消除物理领域薄弱和不信任的交互，从而改变组织的交互。\n\
  \n### 减少官僚主义和腐败\n\n建筑项目是参与性过程，需要更少的官僚主义和更高的开放。由于知识不对称，传统合同中的参与者正从即时安排转向日益贵的参与模式。BCT\
  \ 通过为项目利益相关者提供分布式区块链和最新信息将层次组织转化为高效的网络。这种网络实现了透明的交互和对现场的。。金融中间可以可以减少信息不对称，因为他们更容易获取且自动执行，这意味着一旦确定并运行，其信息对所有方可见。如果其中一个是公共机构，则合同信息对整个社会开放。此外，合同无法被欺骗性修改，这有助于合同的承诺和索赔，同时也减少了知识不对称。智能合约是自包含的并在没有服务提供者协助或干预的情况下执行所有操作，提供了无与伦比的透明度，提高了效率并减少了建筑中违规的可能性。为分包商、总承包商、检查员和其他利益相关者建立了开放式沟通，允许人员以系统的方法提供和访问信息\
  \ (Lu et al., 2021)。\n\n### 智能合约的自动化\n\n\n\n\n使用智能合约实现自动化是一项巨大的优势，对于企业主和高管而言尤其如此。智能合约缩短了支付时间，实现了快速支付并使支付流程自动化。在开发智能合约时，请务必包含所有的支付条件。当满足所需的凭据时，个人将自动获得补偿。以太坊智能合约允许安全的数据交换和高完整性的信息存储(Gürsoy\
  \ et al., 2020)）。作为最早的区块链应用之一，以太坊平台允许在区块链上执行计算机指令。智能合约是一项被分布式账本技术赋予新生命的重大发明。智能合约像传统合同一样，可以设定规则并通过编程自动执行这些规则。智能合约本质上是不可逆的，且默认情况下无法被删除。智能合约的条款是用人类也可读的计算机语言编写的。当数字合同中设定的先决条件满足时，合同条款将自动执行（Allen,\
  \ 2018）。\n\n## 资金管理\n\n大多数建筑项目需要投资者的大额投资，特别是作为国家重要地标的历史结构。因此，基于区块链的众筹为项目客户提供了一个绝佳的机会，使其能够启动一个安全平台，为其项目寻求资金。区块链众筹平台是点对点融资平台，可能替代启动企业对传统资本融资的需求（Swan,\
  \ 2015）。这可以通过开发自己的数字货币以及向早期支持者出售“加密股份”来实现。区块链众筹平台还为投资者和客户提供了信任，因为在去中心化的区块链上，资金的使用是完全透明的。从区块链账本的随后的资金出可用于追踪项目预算的支出情况。此外，由于区块链技术的去中心化本质，所有融资（流出和流入）财务交易都是不可更改的。\n\
  \n## 支付系统的开发\n\n区块链创新激发了智能合约和支付系统，以改善资金流。加密网络上的每条精确交易数据都可以存储在单个加密的数字网关上。因此，它为用户提供了一个受保护的站点，同时增加了执行速度（Gao\
  \ et al., 2018）。从而，合同冲突和支付问题可以得到解决。\n\n## 改善现金流\n\n以雇主和承包商之间的虚拟合同为例，基于区块链的共识机制可以简化合同义务的履行（Khan\
  \ et al., 2018）。一旦雇主在项目开始向网络存入一定金额，资金在交付之前会被限制。项目完成后，即可进行分配，区块链会存储工作交付时间等细节。当交付的工作质量通过验证后，将发放自动支付。然而，客户或编写算法的程序员都无法通过依赖身份代码来更改合同或推迟支付。传统的审计方案可能因为预付等条件对客户的按需付费服务产生限制。因此，研究人员创建了一个系统，由云服务供应商（`CSP`）和数据所有者管理一个公平的支付智能合约。`CSP`\
  \ 提供证明其拥有该数据的文档，但在验证成功之前不会获得付款。买双方之间缺乏信任是传统支付系统中的一个问题；构建在区块链上的智能合约可以解决这一问题。Luo et\
  \ al. (2019) 使用基于区块链的智能合约处理施工支付问题。这种技术将双方、其关系、交易序列和建筑合同条款正式化为智能合约代码。自动化在共识后触发中期付款。\n\
  \n共识机制验证来自授权参与者的支付申请。然后，区块链账本将原封不动地存储该申请。系统将记录对已记录数据的任何更改。交易确认后，将协议发布给利益相关者。因此，可以在没有银行系统的情况下确保安全（Wang\
  \ et al., 2017）。在一个不可更改的系统中，可以使用审计追踪来确定谁对延迟付款负责，是客户延迟了支付许可（无正当理由），还是承包商延迟提交了进度发票。因此，需要一种依赖区块链技术和可搜索对称加密相结合的可搜索加密范式（Li\
  \ et al., 2019）。这一合理计划实现了几点：首先，它通过发现差异来识别错误结果。作为第二个优点，区块链的支付方法保护了所有参与者的权利。\n\n潜在的区块链应用涉及不同的施工阶段，从设计、施工到维护。各种项目管理领域，包括成本管理、资产管理、合同管理。\n\
  \n## 文档的改进\n\n建筑质量文档的有效性和可靠性对于建立信任至关重要。因此，所有授权人员都可以访问合法数据，关于原材料和产品的质量审批，以及工作进展的质量和数量，都可以保存在区块链中。在不安全的中心化系统中，当参与者不了解项目状态和其他利益相关者的活动时，就会产生不确定性；这为参与者提供了推卸责任的机会。在发生歧期间期间投机机会的参与者可能会故意阻止其他用户使用系统。此外，如果文件不清晰，可能会破坏任何在诉诉讼解决分歧的尝试（Gürsoy\
  \ et al., 2020）。由于区块链记录在创建后无法更改，该技术可用于确保所有工作都按照法规进行，并防止任何记录造假。通过提高文档管理系统的安全透明度，区块链技术为这些问题提供了解决方案。\n\
  \n\n\nBCT 的主要用例是管理具有准确记录呈现的数据库。在这些系统中，方便地访问数据至关重要，但确保数据安全免受篡改同样重要。为了实现这一点，Sheng\
  \ 等人 (2020) 建议了一种基于区块链的系统。他们提出了一种提高项目数据质量的方法，并赋予其一个引人注目的名称——“产品组织流程（POP）”。为了促进承包商、雇主、顾问和分包商之间的在线合作，该框架提供了一套准则。他们通过同意在项目上共同工作并参与\
  \ POP 质量链而结成伙伴关系。一旦资产所有者在框架内生成了高质量信息文档，该程序就会启动。管理团队和承包商共同努力，确保只有在获得许可后，该框架才在所有项目中得到实施。统一、安全且去中心化的架构为所接受的协议提供了高质量的信息管理。得益于该框架，项目涉及的所有方都可以访问大量的可靠数据。\n\
  \n## 增加透明度\n\n开放式沟通带来的公信力和共同理解在冲突解决过程中至关重要。由于中心化数据管理缺乏开放性，需要一种去中心化的系统来提供所有交易的共享、不可篡改且可审计的账本\
  \ (Dubovitskaya 等人，2017)。根据之前的研究，区块链智能合约可能有助于整个生命周期的完全透明。外部实体通过发出网络请求来启动工作流，请求指定了文档编号、文档验证、后续方和截止日期。文件错误是提出请求的原因。建筑师随后评估提交的材料以评估索赔并回复承包商。区块链技术使得跟踪任何给定工作流中“谁在何时做了什么”成为可能。因此，该过程可以随时被查看，在发生分歧时可以查阅记录\
  \ (Pradeep 等人，2021)。\n\n## 成本效益\n\n区块链是一种新的破坏性技术，可以提高透明度、降低交易成本、确保财务交易安全并简化操作流程。使用智能合约的法庭程序费用低得多，节省了大量资金。当今建筑行业的大多数客户通过银行和经纪人等中心化中间人进行财务和房地产交易。这些中间人通过提供服务向其客户收取费用。然而，区块链技术在建筑领域的实施允许客户避免这些中间人并节省交易手续费\
  \ (Current, 2017)。项目经理通过在开工阶段将区块链技术与 BIM 集成，可能会对预算产生更大的影响，并更有效地管理成本。基于建筑信息模型（BIM）的工程量清单（QTO）并链接到区块链和智能合约进行成本控制和支付，增加了关键成本数据的安全性和隐私性，一系列使用区块链和智能合约促进成本管理并触发自动支付的研究也是如此\
  \ (Ye 等人，2022)。\n\n## 区块链在建筑业中的局限性\n\n虽然区块链技术具有彻底改变建筑业的潜力，但它也存在一些局限性：\n\n### 可扩展性\n\
  \n建筑业涉及产生大量数据的大型项目。区块链技术在处理大量数据时可能会缓慢且低效，这会限制其在建筑业中的有效性。区块链技术可能缓慢且低效，特别是在处理海量交易时。随着更多用户加入网络以及更多交易被添加到区块链中，网络可能会变得拥堵并变慢。\n\
  \n### 采用率有限\n\n建筑业以采用新技术缓慢而闻名，区块链也不例外。许多建筑公司对区块链技术仍然陌生，并对投资持犹豫态度。正如前面提到的，不同的区块链平台通常使用不同的标准和协议，这可能使它们之间的互操作变得困难。这使得建筑公司在不同平台之间进行有效协作和共享数据面临挑战。\n\
  \n| 图 4. 区块链在建筑业中的局限性 |\n| --- |\n| ![Figure978-1-6684-7808-0.ch004.f04](img/ch004.f04.png)\
  \ |\n| --- |\n\n### 复杂性\n\n区块链技术非常复杂，需要专门知识来实施和管理。这使得建筑公司有效采用和利用该技术面临挑战。\n\n###\
  \ 成本\n\n实施区块链技术可能非常昂贵，特别是对于可能没有资源投资该技术的较小建筑公司来说。\n\n### 安全风险\n\n虽然区块链技术通常被吹捧为高度安全，但它并非完全免受攻击。特别是\
  \ 51% 攻击（即单一实体控制了网络 50% 以上的计算能力），会对区块链的完整性构成严重威胁。虽然区块链交易是公开透明的，但底层技术并不提供完全的匿名性或隐私。在建筑业中，这对于想要保护机密项目数据的公司可能是一个担忧。\n\
  \n### 能源消耗\n\n区块链技术的运行需要大量的能量。通过挖矿验证交易的过程需要巨大的计算能力并消耗大量电力。\n\n### 缺乏监管\n\n区块链技术很大程度上缺乏监管，这可能会产生法律和安全问题。区块链网络的去中心化本质也使得追究个人或组织欺诈或非法行为责任变得困难。区块链监管很重要，原因之一是保护消费者免受欺诈和其他金融犯罪。加密货币作为一种相对较且且不受监管的资产类别，很容易受到诈骗和其他非法活动的影响。通过建立规则和标准，监管机构可以帮助减少此类活动的风险并保护消费者免受财务伤害。\n\
  \n## 结论\n\n本研究整合了定量和定性数据，以提供深入理解分布式账本技术如何可能颠覆建筑业。区块链在建筑业中的应用可以带来显著收益，例如改进供应链管理、项目管理、智能合约和资产管理。区块链技术可以为建筑项目的所有利益相关方提供透明、安全且高效的平台，减少欺诈风险，增强协作并提高问责制。\n\
  \n\n\n区块链技术在建筑行业仍处于早期阶段，目前正处于探索阶段。另一方面，区块链在建筑公司中的功能和可能性不应被低估。区块链在建筑领域的潜在应用已被发掘，包括合同管理、建筑信息模型（BIM）系统、电子文档管理（EDM）、物业维护、供应链管理和资金管理。区块链去中心化、完全独立、点对点以及不可篡改的记录特性提高了工作效率，节省了时间和金钱，并刺激了全球建筑业的协作。可以使用基于区块链的智能合约实现业务流程和管理操作自动化，以提高效率并确保其始终符合合同条件。这可以显著降低建筑成本，并实现更好的项目成本控制。区块链可以简化采购流程，减少大型项目的碎片化和复杂性。材料来源具有减少浪费并以高度责任感推动产品和服务质量提升的潜力。这些工具不仅可以提高采购环节的可预测性，还能提高整个项目交付的可预测性。\n\
  \n## 挑战与障碍\n\n尽管如此，在宣布区块链成为建筑过程中不可或缺的元素之前，仍有许多步骤必须完成。建筑行业实施区块链的主要障碍之一是各国政府对区块链技术的监管方法，即对首次币发行（ICO）的监管，这些\
  \ ICO 主要用于项目融资。一些国家由于区块链活动带来的负面后果（如犯罪活动和不受限制的货币及资金外流）而在国内禁止使用区块链技术，而另一些国家则应用并开发了区块链技术的更多潜力。然而，区块链在建筑行业部署的另一个障碍是该行业与其他行业相比对技术的接受滞后。\n\
