  \n# 第 2 章\n\n### 摘要\n\n本研究的目标是使用 CNN 和 Keras 库，将图像中的交通标志分类到多个类别中，以检测交通标志。交通标志识别目标是建立一个深度神经网络\
  \ (DNN)，用于分类交通标志。作者建议训练模型，使其能够使用德国交通标志数据集从自然图像中解码交通标志。首先应对对数据进行预处理，以最大化模型性能。在选择模型架构、微调和训练后，将对网络上找到的新交通标志图像进行测试。由于涉及图像分类，因此选择了卷积神经网络作为\
  \ DNN 的类型，这是解决此类问题的常见选择。代码使用 Python 编写，并使用了 tensorflow 库。\n\n### 引言\n\n\n\n\n\n\
  在这个人工智能时代，人类对技术的依赖日益增强。随着技术的进步，谷歌、特斯拉、Uber、福特、奥迪、丰田、奔驰等许多跨国公司正致力于自动驾驶车辆的研究。他们正试图制造出更准确的自动驾驶或无人驾驶车辆（Harley,\
  \ 2015; Saini et al., 2017)）。你们可能都了解过自动驾驶汽车，这种车辆本身表现得像司机员，不需要任何人类引导即可在道路上行驶。考虑安全因素并不是错误的——机器有发生重大事故的风险。但没有任何机器比人类更准确。研究人员正在运行许多算法，以确保\
  \ 100% 的道路安全和准确性，例如交通标志识别（Jensen et al., 2016)）。\n\n自动驾驶车辆被应用于各个领域，无论是陆地、海洋还是天空，都有不同的用途。随着神经科学的发展，许多研究人员主要依赖车辆的自动化来实现不同的目的（He,\
  \ 2019)）。对于道路安全，自动驾驶车辆被用作自动驾驶包络和路径跟踪的重要工具（Brown et al., 2017)）。在水下节点定位中，自主车辆以更低的成本提供准确有效的结果，并提高水下网络的使用寿命（Dass,\
  \ 2022)）。空中农场利用自主车辆进行农业和智能农业的其他应用（Ather et al., 2022; Yinka-Banjo & Ajayi, 2019)）。\n\
  \n对于所有的自主点，研究人员强调了使用机器学习进行智能预测，适用于各种应用，例如在线零售市场分析（Nayak & Narain, 2021)）、动态产品价格预测（Nayak\
  \ & Narain, 2020)等。在现实生活中，在使用交通拥堵的道路时，存在各种标志，如左转或右转的交通信号、限速、重型车辆禁止通行、禁止进入、儿童过路等，你需要遵守这些标志以确保安全（On-Road\
  \ Automated Driving Committee, 2014)）。同样，自动驾驶车辆也必须解释这些标志并做出决策以实现准确性。识别交通标志属于哪类的方法被称为交通标志分类（Diaz\
  \ et al., 2015)）。\n\n在现实世界中，交通标志识别有两个阶段的过程：\n\n1. **定位 (Localization)**：检测并定位交通标志在输入图像/帧中的位置。\n\
  2. **识别 (Recognition)**：获取定位的感兴趣区域（ROI），识别并分类交通标志。\n\n深度学习目标检测器可以在网络的单次前向传播中完成定位和识别（Ellahyani\
  \ et al., 2021)）。各种文章通过神经网络和图像处理技术的描述，提出了多种交通标志检测和分类方法（Garg et al., 2019; Kamal\
  \ et al., 2017)。卷积神经网络模型是描述交通信号检测和数据处理以获得准确结果的有效方法（He et al., 2020; Karthikeyan\
  \ et al., 2020; Peng et al., 2016)。因此，在我们的模型中，采用了卷积神经网络的描述、其各层应用和执行过程。我们的模型获取各种交通信号的数据集并通过我们提出的方案进行执行。然后它使用各种矩阵寻找准确率，并与其他可用模型对比显示结果。\n\
  \n# 模型架构 (MODEL ARCHITECTURE)\n\n模型架构是整个模型的概述。模型架构是整个模型的概述。在该架构中，输入是交通标志，输出是符号。在这种情况下，输入形状为\
  \ `30 × 30`，有三个通道。在架构的前两层中，填充大小为 `32`，激活函数为 `ReLU`。随后是池化层，步长为 `2`。后续是扁平化层，将池化特征转换为单列。最后是两个全连接层。\n\
  \n## 卷积神经网络 (Convolution Neural Network)\n\n深度学习模型中最显著识别和使用的是卷积神经网络。CNN 由卷积层、池化层和连接层组成（Mao\
  \ et al., 2016)）。Dropout 等可以在不同层中实现。CNN 的最大优点之一是在训练时尽可能地利用信息。特征提取在卷积和池化层进行。分类系统位于末尾。定义数据：标准维度输入网络。这里关键的是数据大小。\n\
  \n### 卷积层 (Convolutional Layer)\n\n卷积层是 CNN 的基础层（Qian et al., 2016)。这负责确定设计特征。输入图像通过滤波器通过滤波器。特征图是通过相同滤波器通过卷积操作得到的。\n\
  \n权重集的乘法通过卷积操作执行。滤波器由一组权重乘以输入数组组成。点积是一种滤波器大小的块与过滤器之间的乘法类型，产生单个值。这种乘积应用于滤波器大小的块与过滤器。滤波器比输入小，并且同一个滤波器用于从不同点相乘。滤波器被设计为一种特殊技术，可以系统地覆盖整个图像。\n\
  \n### 池化层 (Pooling Layer)\n\n池化层通过下采样特征来总结特征的存在。它通常应用于卷积层之后，并具有某些空间不变性（Géron, 2019)）。两种流行的池化方法——平均池化和最大池化，分别总结了函数的平均存在和最活跃的存在。\n\
  \n\n\n\n\n事实上，池化层删除了图像中不必要的特征，并使图像更加简洁。在平均池化中，该层每次都会计算当前视图的平均值。当使用最大池化（maxpooling）时，该层每次从滤波器的当前视图选择最大值。通过使用每个特征图中指定的矩阵尺寸，池化技术仅选择最大值，导致输出神经元减少。因此，图像尺寸变得非常小，但场景保持不变。池化层对于减少特征图数量和网络参数至关重要，而丢层（dropout\
  \ layer）用于防止过拟合。\n\n最大池化的激活可以计算如下，其中是第 `jth` 个特征图和第 `mth` 层池化层的性能，`n` 是下采样因子，`r`\
  \ 是池化尺度（即要合并池化的带数），且 `n` 是下采样因子。\n\n### 展平层 (Flattened Layer)\n\n展平层用于将数据从矩阵转换为一维数组，用于全连接层，并创建一个既长又窄的单维特征。展平向量是一种选项。最后，它将单向量连接到最终分类模型，这也被称为全连接层（Géron,\
  \ 2019）。所有像素数据以一种形式给出并与全连接层连接。展平和全连接层是 CNN 的最后几步。它通过将图像转换为一维数组，为图像分类的下一个全连接层做准备。\n\
  \n### 全连接层 (Fully Connected Layer)\n\nCNN 主要依赖于全连接层，这在计算机视觉图像识别和分类中已被证明非常有用。卷积和池化是\
  \ CNN 过程的起始阶段，它将图像分解为属性并进行单独分析(Abadi et al., 2016)）。\n\n在全连接层中，每个输入都连接到所有神经元，且输入被展平。`ReLU`\
  \ 激活函数通常用作全连接层。`softmax` 激活函数用于预测全连接层最后一层的输出图像。卷积神经网络架构使用了全连接层。这些是卷积神经网络的最后几层，也是重要层。\n\
  \n卷积层技术如图 1 所示：首先，输入图像与滤波器进行卷积，从而减小其尺寸。然后，新矩阵将显示卷积操作的结果。这些结果通过池化操作进行分组，该操作从感兴趣的小区域中提取最大值(Ketkar,\
  \ 2017)）。最后，通过使用因子为 2 对分组后的矩阵进行抽稀，产生剩余结果。最终结果通过分类技术完成，该技术负责预测总结图像上检测到的首要内容的标签。然而，并没有什么阻止在这一步使用不同的模型。\n\
  \n| 图 1 卷积层技术 |\n| --- |\n| ![Figure978-1-6684-7808-0.ch002.f01](img/ch002.f01.png)\
  \ |\n| --- |\n\n一些研究观察到了这种方法，即在卷积层的末尾使用 `SVM` 技术，而不是常用的神经网络。所使用的层是一组滤波器，通过卷积生成一组元素图。在所使用的卷积层中，有一个池化层，它在输入集的块上操作并合并激活特征(Jogin\
  \ & Mohana, 2018)。这种合并操作通过分组函数描述，如平均或最大值。这种池化技术步骤用于根据特征图增长的补丁在统计学上对相邻的输出进行总结。由于池化减小了输出，照片预处理的每一个其他步骤都是零填充（zero\
  \ padding），这允许我们控制输出的尺寸。填充是向图像边缘包含像素的方法。在特征提取步骤之后，此输出被发送到全连接层。通常，传统的 CNN 使用稠密多层感知器作为分类方法。\n\
  \n### 丢弃层 (The Dropout Layer)\n\n丢弃层是一种掩码，它会消除某些神经元对下一层的贡献，并保持所有其他神经元不变(Aghdam et\
  \ al., 2016)。我们可以将丢弃层应用于输入向量，在这种情况下它会消除其部分特征；但也可以将其应用于隐藏层，在这种情况下它会消除一些隐藏神经元。\n\n\
  丢弃层在训练 CNN 中非常重要，因为它们防止了在训练数据上的过拟合。如果不存在它们，第一批训练样本对学习的影响将呈现不成比例的高强度。这反过来会阻止只出现在后期样本或批次中的特征的学习：\n\
  \n| 图 2 丢弃层 |\n| --- |\n| ![Figure978-1-6684-7808-0.ch002.f02](img/ch002.f02.png)\
  \ |\n| --- |\n\n### 稠密层 (The Dense Layer)\n\n模型中的稠密层神经元接收来自前层每个神经元的输出，稠密层的神经元执行矩阵-向量乘法(Stallkamp\
  \ et al., 2011)。\n\n矩阵向量乘法是一个过程，前层输出的行向量等于稠密层的列向量。矩阵向量乘法的通用规则是行向量的列数尽可能与列向量相同。\n\
  \n矩阵-向量积的通用公式为：\n\n### 预定义模型\n\n### VGG-19\n\n`VGG-19` 是一种卷积神经网络，在来自 ImageNet 数据库的超过百万张图像上进行训练。该网络深度为\
  \ 19 层，可以将图像分类为 1000 个物体类别，例如键盘、鼠标、铅笔和许多动物。因此，网络已经为各种图像学习了丰富的特征表示(MacKay & Mac Kay,\
  \ 2003)。\n\n所以，简单来说，VGG 是一种用于用于图像分类的深度 CNN。VGG19 模型中的层如下：\n\n| 图 3 VGG 的层 |\n| ---\
  \ |\n| ![Figure978-1-6684-7808-0.ch002.f03](img/ch002.f03.png) |\n| --- |\n\n###\
  \ ResNet50 和 DenseNet121\n\n我们对在 ImageNet 上预训练的流行图像分类架构 ResNet50 执行了迁移学习。使用包含 50\
  \ 层 ResNet50 的实际动机是加强不同层之间的特征传播并鼓励特征复用(Singh et al., 2018)。它使用跳跃连接（skip connections）将之前的输出添加到当前层，这有助于减少前层与当前层之间的残差误差。\n\
  \n其次，我们对在 ImageNet 数据集上预训练的 DenseNet121（总共 121 层）架构用于交通标志检测。DenseNet 是构建 ResNet\
  \ 架构概念的逻辑扩展。所有前层的特征图。\n\n### 卷积循环神经网络 (CONVOLUTIONAL RECURRENT NEURAL NETWORK)\n\
  \n另一种重要的神经网络架构是循环神经网络，它将前层的隐藏状态作为输入，这使其成为序列输入的合适选择。实现该架构是为了探索像素之间是否存在可以利用以提高准确率的序列关系。\n\
  \n### 我们的提议的 CNN 架构\n\n\n\n\n最后，我们实现了一种卷积神经网络架构，该架构包含两个栈，每个栈由三层卷积层组成，随后是一个一个平均池化层和两个全连接层。我们在每个卷积层之后都使用了\
  \ `batch normalization` 以避免在不同层之间反向传播时出现梯度爆炸或消失。在每个栈之后都应用了 `Dropout` 层以防止过拟合。\n\n\
  | 图 5. 所提 CNN 架构的框图 |\n| --- |\n| ![Figure978-1-6684-7808-0.ch002.f05](img/ch002.f05.png)\
  \ |\n| --- |\n\n全连接层缩写为 `fc`。前两个卷积层具有 32 个卷积滤波器，`kernel size = 3`。对卷积层的不同卷积尺寸 `3`、`5`、`7`、`9`、`11`、`19`\
  \ 和 `31` 进行了 `Grid Search`。当 `kernel size = 3` 时达到了最高精度。在每个卷积层后使用 `ReLU` 激活函数作为非线性激活，它将负输入置为零。我们没有在每个卷积层后使用\
  \ `MaxPooling` 层，以避免在早期丢失特征图的空间信息。随后的三个卷积层每个都有 64 个卷积滤波器，以增加感受野。此外，最后一个卷积层具有 128\
  \ 个卷积滤波器。之后是一个平均池化层，用于汇总所有接收到的特征图的精华。其输出给一个由 512 个神经元组成的全连接层。最终输出层有 43 个神经元，使用 `softmax`\
  \ 作为激活函数来计算对应 `GTSDB` 数据集 43 个类别的概率。该架构的大部分使用 `Random Search` 对各种参数进行了设计。\n\n###\
  \ 实验结果\n在本节中，提供了我们所提模型及其组合的结果。\n\n### 数据集描述\n该图像数据集由 50,000 多张各种交通标志（限速、交叉口等）的照片组成。数据集中存在约\
  \ 43 个不同的类别用于图像分类。数据集的类别大小不相同，有些类的图像非常少，而另一些则大量大量。由于文件大小约为 `314.36 MB`，因此下载该数据集不需要花费太多时间和空间。它包含两个独立的文件夹，`train`\
  \ 和 `test`，其中 `train` 文件夹包含类别，每个类别包含各种图像。\n\n| 图 6. 数据集 |\n| --- |\n| ![Figure978-1-6684-7808-0.ch002.f06](img/ch002.f06.png)\
  \ |\n| --- |\n\n### 性能指标\n我们通过下述各种评估指标来评估模型的性能。使用 `Confusion matrix` 来评估研究中所用分类模型的性能。常用的性能衡量标准\
  \ `accuracy`、`precision` 和 `F-1 score` 值是从混淆矩阵中获得的。为了获得这些值，混淆矩阵中有 4 个取值。\n\n![Mat978-1-6684-7808-0.ch002.m01](img/ch002.m01.svg)\n\
  ![Mat978-1-6684-7808-0.ch002.m02](img/ch002.m02.svg)\n![Mat978-1-6684-7808-0.ch002.m03](img/ch002.m03.svg)\n\
  ![Mat978-1-6684-7808-0.ch002.m04](img/ch002.m04.svg)\n![Mat978-1-6684-7808-0.ch002.m05](img/ch002.m05.svg)\n\
  \n矩阵由真正性 (`TP`)、真负性 (`TN`)、假正性 (`FP`) 和假负性 (`FN`) 值组成。`TP` 和 `TN` 表示预测正确的正样本和负样本的数量，`FP`\
  \ 和 `FN` 表示预测错误的正样本和负样本的数量。性能指标是使用这四个值计算的。`ROC (Receiver Operator Characteristics)`\
  \ 曲线也用于衡量分类模型的性能。在 `ROC` 曲线中，y 轴显示敏感性，x 轴显示特异性。这些值以点的形式显示并最终收敛，形成 `ROC` 曲线。曲线下的面积被称为\
  \ `AUC (Area under the ROC curve)`，`AUC` 值在 0 到 1 之间变化。当该值接近 1 时，预测值增加；当它接近 0 时，预测值减少。在\
  \ `Figure 7` 中显示了 `ROC` 曲线和 `AUC` 面积。\n\n| 图 7. ROC 曲线（蓝线）和 AUC 面积（橙色区域） |\n| ---\
