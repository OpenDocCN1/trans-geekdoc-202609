  \n### 医疗保健\n\n医疗保健是全球经济中被低估的部门，尽管它在收入生成方面优于所有其他垂直领域。得益于 `COVID-19` 等历史上困难的时期，现在每个人都意识到拥有强大的医疗设施是多么关重要。区块链为健康领域开启了新的可能性。例如，它确保了患者数据的存储。区块可被用于传输电子健康记录以供存储。数万名患者的信息都可以保存在账本中。该技术还允许完整信息的复制和存储，并带有出加密备份。\n\
  \n通过这种替换，任何潜在的 DDoS 攻击都从源头上被消除。黑客无法使用区块链修改或删除健康记录。\n\n### 医疗保健中的区块链技术可以启动\n\n####\
  \ 药物监控\n区块链技术可以显著减少产品假品问题。在某些网络中，分销商和制造商之间的交易易于追踪。该系统使验证真实性、追踪随时间变化的趋势以及快速了解制造者变得简单。\n\
  \n#### 电子健康记录\n区块链大大创建了单一的患者注册库。`EHR` 提供了更高的安全标准、可靠的操作和远程访问。患者通常担心数据同步，但该基础设施使得这成为可能。一旦患者表示同意，医生可以使用区块链轻松地评估整个医疗史。该策略将大幅降低诊所的硬件支出。一旦数据实时更新，处理将停止。医生将能够快速了解有关血型、过敏反应和慢性疾病的细节。\n\
  \n#### 标准化\n区块链技术实现了 `EHR` 和传统协议的使用。此外，区块链极大地促进了医疗保健和医疗机构以看似极低的成本进行高效运营。\n\n###\
  \ 房地产\n\n全球收入和资产的很大一部分来自房地产。由于该行业的交易性质，房地产是获得收入的重要手段。独立网络现在被广泛应用于房地产行业。区块链链提供了许多优势，如房地产资产的代币化；高效处理行业基础业务；减少与自动化过程相关的成本；授予全球范围内资产的访问权限；由于总所有权的碎片化创建特定投资者的池；获得二级市场机会；增加数据可访问性和透明度。\n\
  \n### 电子市场理论\n\n电子市场理论基于经济学家 `Ronald Coase` 和 `Oliver Williamson` 的研究，他们两人都获得过诺贝尔奖。`Coase`\
  \ 思考，为什么我们在自由市场经济中能看到企业？自由市场经济的一个所谓优势是它可以“自律”，但在实践中，我们经常看到管理引导经济活动的情况，而不是经济自行发挥作用。为了解决这一悖论，`Coase`\
  \ 指出使用价格系统是有成本的，对于特定类型的经济活动，这些成本在市场中高于公司内部（Benson, 1989）。\n\n结果，我们预计看到企业内部发生的经济活动很少，市场内部发生的其他活动也很少。\n\
  \n通过想象“自制或购买”的选择，`Williamson` 将 `Coase` 的概念操作化。公司可以从市场购买组件，也可以在内部制造并将其用于自己的生产流程。`Williamson`\
  \ 对影响制造或购买决策的情况提供了详尽的解释。对于我们的即时目标，私人经济活动发生在企业内部或层级结构中（即公司）至关重要。交易成本是决定该经济活动发生何的主要因素。\n\
  \n`Malone` 认为计算机和信息技术显著降低了处理和传输信息的成本。他概述了对工业组织的三个潜在影响。通信效率的提高对市场和层级结构产生有利影响，这是“电子通信效应”的第一种定义。\n\
  \n### 一种组织要素\n\n\n\n\n\n任何文明都必须处理信息分布的经济问题。正因为如此，社会无法确定可以使用哪些资源、这些资源可能还有哪些用途，以及在市场上必须建立什么样的价格，因为这些资源并非触手可得。这种理解在\
  \ 20 世纪 30 年代爆发的社会主义经济学家（特别是奥斯卡·兰格和路德维希·冯·米斯）与 F.A. 哈耶克之间的之间的争论中至关重要。根据米斯的观点，在缺乏市场定价的情况下，无法确定机会成本，因此资源配置将是无效的。兰格反驳道，市场价格可以通过计量经济学方法进行计算，或者通过会计流程进行模拟。任何中央计划者都不可能获得足够的信息来完成兰格所设想的计算。这是哈耶克对这场讨论的贡献。此外，米斯认为，即使中央计划者拥有所有核心数据，他们也没有像商人那样有动力做出明智判断。社会主义计算争论现在已经解决，但米斯和哈耶克的观点仍然至关重要。2003\
  \ 年，“通信成本随时间的推移与各种决策结构的经济学之间是什么关系？”是马隆对原始假设的重新表述。现在他针对中心化与去中心化决策者进行了论证，而不是主张在层级和市场之间做出选择。他概述了影响决策框架选择的要素，这对于我们的目标至关重要。\n\
  \n这三个组成部分是动力、信任和决策信息。\n\n他认为，信息技术可以通过加强对远程决策者的监控、相似性和社交化来提高可靠性。\n\n根据 Sundararajan\
  \ 的说法，在数字环境中，信任有五个指标，即：先前的互动、同伴经验学习、声誉、数字化的社会资本和外部认证。他还提出了一个关键论点，即后两个指标——数字社会资本和外部认证，能够大规模提供这些线索的网络化服务已经显著且快速地增长。\n\
  \n# 区块链作为经济的基础\n\n正如工业化能源在工业革命期间进行大规模分布的方式一样，工业化的信任将在数字革命期间进行大规模分布。\n\n根据钱德勒（Chandler）的说法，工业革命之后经历了从\
  \ U 型组织向 M 型组织的转变。我们预见到随着信任的工业化将建立一种“V 型”组织（Allen, 2016）。\n\n## V 型组织\n\nV 型组织由许多完全自治的业务组成，它们像一家单一的垂直整合公司一样工作，利用区块链技术来协调和审计以前由公司办公室或市场处理的任务。未来的数字经济将拥有由这些\
  \ V 型公司提供的交易基础设施。目前，经济基础设施不仅包括支持商业和经济活动的法律框架和社会规范，还包括如港口、高速公路、铁路和其他类似设施等物理基础设施。在一个信任已经工业化的世界里，可以很容易想象出一种额外的数字（区块链）经济基础设施层，它既补充又取代了当前的经济基础设施形式（Allen,\
  \ 2011）。\n\n未来的数字经济将拥有由这些 V 型公司提供的交易基础设施。目前，经济基础设施不仅包括支持商业和经济活动的法律框架和社会规范，还包括如港口、高速公路、铁路和其他类似设施等物理基础设施。在一个信任已经工业化的世界里，可以很容易想象出一种额外的数字（区块链）经济基础设施层，它既补充又取代了当前的经济基础设施形式。Aragon\
  \ Network 是 V 型组织的示例；虚拟组织可以作为智能合约的集合构建，网络提供了解决争议的机制。这种组织可以被描述为去中心化的，并与电子市场的概念完全一致。\n\
  \n另一方面，“中心化”的 V 型组织也是可见的。一个例子是 IBM 和马士基（Maersk）创建的 Tradelines 平台。在这里，传统的层级组织已让 V\
  \ 型组织结构。\n\n# 区块链无政府状态与私人治理\n\n通过 DAO，基于区块链的经济系统可以完全自动化并执行智能合约，然而在合同执行方面仍然存在问题，特别是这些自愿合同可能没有获得中央权威的批准，因此并不总是秘密执行的。认识到私有代理可能希望财产不被政府观测，这可能是其效率优势的来源，因为允许人们规避政府在税收、监管或其他限制的掠夺。这与无政府状态或影子经济中自发出现的私人秩序原则具有可比性。\n\
  \n## 结论\n\n根据马隆的观点，工业组织正在发生一场剧烈的重组。\n\n\n\n\n- França, R. P., Monteiro, A. C. B.,\
  \ Arthur, R., & Iano, Y. (2021). 区块链技术及其在现实中的应用：安全性视角。收于 Agrawal, R., & Gupta, N.\
  \ (编.), 使用区块链转型网络安全解决方案。区块链技术。Springer. doi:[10.1007/978-981-33-6858-3_3](https://doi.org/10.1007/978-981-33-6858-3_3)\n\
  \n- Melanie, S. (2015). 区块链：新经济的蓝图。O'Reilly Media, Inc.\n\n- Reijers, W., O’Brolcháin,\
  \ F., & Haynes, P. (2016). 区块链技术中的治理与社会契理论。Ledger, 1, 134–151. doi:[10.5195/ledger.2016.62](https://doi.org/10.5195/ledger.2016.62)\n\
  \n- Wolfson, S. N. (2015). 比特币：早期市场。商业与经济研究杂志, 13(4), 201–214. doi:[10.19030/jber.v13i4.9452](https://doi.org/10.19030/jber.v13i4.9452)\n\
  \n## 第 13 章\n\n*   Ashish Kumbhare, 印度斋普尔 ICFAI 大学\n*   Piyush Kumar Thakur, 印度斋普尔\
  \ ICFAI 大学\n*   B. Ravi Kiran Patnaik, 印度斋普尔 ICFAI 大学\n*   Kiran Midiyam, 印度斋普尔\
  \ ICFAI 大学\n\n### 摘要\n随着云计算技术的快速兴起，在线存储服务迅速扩张。在线存储服务器无法妥善存储和保留数据的这一事实引起了人们对这类远程存储解决方案的关注，这严重损害了消费者对获取和使用云存储解决方案的信任。传统云存储信息完整性审计方法的中心化性质，由于只有少数故障点和服务器缺陷，导致了重大的安全忧虑。客户对个人数据的完整性和保护始终有着高标准。区块链技术凭借其先进的安全能力，提供了数据完整性的这一关键保障。区块链解决方案的加密技术确保了数据的完整性、隐私保护、信息的可用性、安全有效性，保护数据免受入侵者侵害，阻止欺诈活动和利用，并降低信息被盗取或损坏的可能性。\n\
  \n### 引言\n数据完整性是指解决方案中使用的信息准确、可信且对各方都有益的质量。在此背景下，“数据完整性”是指数据在其整个生命周期内的完整性、及时性和正确性，以及对无意数据更改的抵抗力，这是一个供应链业务中广泛使用的广泛概念。今天，数据是宝贵的资源。从金融、保险到健康、教育和公共管理的广泛行业中，战略应该指导所有的企业决策。随着越来越多受计算机帮助的人类活动依赖数据，信任数据已变得至关重要（Boureanu\
  \ et al., 2020）。数据的重要性也使其成为网络攻击的首要目标，这些攻击旨在破坏数据获得信任所必须具备的关键 CIA 特性（机密性、完整性和可用性）。\n\
  \n| 图 1. 网络攻击的首要目标 |\n| --- |\n| ![Figure978-1-6684-7808-0.ch013.f01](img/ch013.f01.png)\
  \ |\n| --- |\n\n在全球范围内，数据安全已成为一个严重的问题。存在许多数据威胁。这些安全风险可能以漏洞、攻击、数据泄露、内部威胁、员工失误等形式确实存在，但必须将其降至最低以防止伤害。虽然停止风险可能困难，但它们实际上是可以减少的。根据在线攻击哪些\
  \ CIA 特性，会导致不同的数据信任损害。特别是，破坏可用性只是暂时阻止获取数据；然而一旦数据再次可用，进程就可以重启。虽然违反机密性会导致隐私数据的披露，但原始数据仍然可以访问和使用，至少在所造成损害允许的范围内（例如，作为数据泄露受害的组织可能不得不面临经济后果）(Hasanat\
  \ et al., 2020)）。相比之下，破坏数据完整性是一种极其有害的攻击，几乎总会为数据信任带来严重问题。事实上，篡改数据可能不被察觉，并通过删除单个条目（例如，擦除麻烦的痕迹）或更改特定数据块（例如更改特定数据）来煽动恶意操作。当完整性被破坏时，与机密性不同，原始数据无法恢复并被永久破坏。因此，完整性攻击难以检测且非常有效\
  \ (Bumauskas et al., 2020)。数据完整性问题在云计算环境中变得更加糟糕，因为数据所有者无法控制何时、何地以及谁访问数据。然而，越来越多的公共和私人组织正在外包数据，因为“这降低了本地存储的费用以及维护成本。”因此，解决云计算系统中确保数据完整性的特性问题已变得必要。\n\
  \n### 当前数据完整性保障方法分析\n通过计算校验和并与参考值进行比较，以及基于加密技术的方法（如密钥和无密钥哈希），有多种已知方法可以确保数据完整性。这些方法的缺点是在无法添加数据恢复机制的情况下无法保证其完整性。在硬件或软件中实现的多种\
  \ `RAID` 技术（独立磁盘冗余阵列）（`RAID` 阵列）、复制技术和冗余编码技术是确保数据完整性的进一步方法。这些技术的高度冗余性是一个缺点 (Cristofaro,\
  \ 2020)。\n\n### 加密方法\n数据完整性通常通过采用适当的数据复制机制和加密技术（摘要和非对称密钥）来确保。事实上，单个数据使用加密方法签名，以便任何伪造尝试都能通过验证加密签名快速识别。事实上，为了使攻击成功，必须破解密钥密钥以更改数据签名并绕过加密完整性测试。虽然这些攻击执行困难，但一旦执行，它们基本上是无法检测的。为了任何情况下保证数据完整性，建议使用适当的数据复制机制。\n\
  \n跨多个节点的数据复制和分布严重阻碍数据完整性破坏，因为攻击者必须在不被察觉的情况下破坏每个复制的数据。这种复制策略在现实环境中非常常见，例如拥有大量分散存储资源的云计算系统。尽管复制无疑增加了在云计算环境中攻击成功的难度，但云服务提供商本身有时也会参与数据完整性破坏\
  \ (Garaus & Treiblmaier, 2021)。\n\n\n\n由于其密码学和加密强度，它降低了数据操纵的可能性并增强了数据机密性。云系统用户通常认为该技术足够安全，可以在数据发送到云端之前对其加密。尽管人们认为加密可以针对内部攻击提供强大的安全性，但它无法防止因配置错误和软件故障导致的数据损坏。为了节省带宽和计算能力，需要一种检查数据完整性的技术。近期，远程数据审计受到了越来越多的关注，以确认数据的准确性或完整性。数据系统用户将数据完整性定义为完整性，即未受损坏、更改或损害的状态。此外，数据完整性指的是信息未被黑客或其他未经授权的入侵者更改。数据完整性是一种完好无损的质量，意味着它没有被黑客或其他未经授权的入侵者更改。此外，它还指未受系统缺陷或其他缺陷损害的原始数据。人为错误、数据操纵、系统故障和环境事件均可能导致数据损坏和系统数据泄露。依赖数据完整性的组织和系统用户应该使用数据保证的方法和程序。数据治理和完整性是任何数据管理服务的关键组成部分（Goldberg\
  \ et al., 2019）。使用可靠数据的消费者可以确信他们的个人信息是安全的、数据是机密的、数据是准确的，并且数据被用于实现适当的规划和决策目标。\n\n\
  如果没有强大的检测基础设施，可能很难发现无意或科学欺诈。随着云存储的广泛使用，云数据的完整性已成为一个关键问题。尽管已经建议了各种方法，但它们都有缺点。用户数据被集中收集并存储在云端，在那里运行各种应用程序。云计算通过多种部署方法（包括私有云、社区云、公共云和混合云）为用户提供共享和存储资源。在云端存储具有许多优势，包括较低的系统投资成本、较少的本地存储需求以及支持远程访问。然而，云存储带来了同等的困难。由于数据的高度集中和复杂的计算设置，用户数据容易受到各种危险。由于系统许多组件的复杂性，攻击云的可能性在增加。随着复杂性的增加，漏洞变得更加糟糕。此外，云服务的多租户共享能力增加了数据丢失的风险。最后，云服务提供商可能会故意隐藏用户数据，或将客户几乎不访问的信息离线保存（Statista,\
  \ 2021a）。鉴于这些困难，验证外包数据的完整性已成为云存储中的关键问题。\n\n## 第三方审计员请求\n\n尽管加密对内部威胁提供了强有保护，但它无法防止数据受到配置错误和软件缺陷带来的损害。第三方审计是一种证明外包给远程服务器的数据完整性的基本方法。第三方可以检查数据的准确性。`Third-Party\
  \ Auditor (TPA)` 程序聘用具有必要培训和经验的人员执行所有数据完整性审计程序。`TPA` 方案实现了数据完整性，并为数据所有者提供了数据安全的保证。该策略维护云端所有资源数据的完整性，并让所有者参与审计过程。对第三方通信通道的需求以及面临中间人攻击的风险是这种数据完整性技术的缺点。引入第三方进行数据处理增加了实施多种黑客威胁的可能性。一个热点主题是如何在数据完整性验证和保证的情况下，安全高效地在云端存储海量数据（Statista,\
  \ 2021b）。利用现代技术取代了传统的依赖信任的 `Third-Party Auditors (TPAs)` 和加密来保护云端数据的完整性验证方法。\n\n\
  ## 业务中的数据完整性\n\n网络和计算的进步加剧了对隐私生活的担忧。嗅探器和 Cookie 被用于捕获传输的数据，当用于监控用户的浏览和购物习惯时，会引发严重的隐私问题。所有这些匿名数据挖掘违反了人们的在线隐私，即使它们可能不会给客户带来任何伤害。关于这个主题，Schonberger\
  \ 市概述了起草隐私权法规的许多阶段，并将网络空间中对隐私的理解方式描述为信息自决权。此时，个人可以选择他们如何参与其个人数据的收集、处理和使用。\n\n由于新技术、更多的数据收集、市场趋势的变化以及新的全球电子商务市场的建立，信息在全球经济中的重要性日益增加。因此，知识尤其已成为一种宝贵的资源，可以创造就业机会、企业和消费者服务（Stix,\
  \ 2021）。结果是这些力量增加了收集、保留、处理和使用个人数据的压力。这些元素也减少了隐私空间，在这样的环境下，客户的信任不足。\n\n## 区块链与在线购物\n\
  \n在线世界需要多年时间才从一个主要用于国防和学术机构内部及之间通信的系统，转变为一个可以存储运行业务应用程序的平台。然而，在万维网发布后仅几年，商业网站就开始繁荣，电子商务成为了一种广泛使用的业务模式（Stoll\
  \ et al., 2019）。\n\n早期电子商务评论将其分为三类：(a) 应用（如营销、支付和组织间系统）；(b) 技术障碍（如安全、连接性和辅助系统）；(c)\
  \ 支持与部署（例如企业战略、政府政策）。后的电子商务评论论文专注于消费者关系信任建立、特定地理地区的电子商务、在线消费者行为研究、推荐系统和参考架构。这些模型对研究人员和从业者都具有吸引力，因为它们为开发潜在应用提供了指南，并有助于识别可以促进电子商务广泛采用的因素。它们有助于识别电子商务成功的关键要素。\n\
  \n| 图 2. 电子商务将领域分为三类 |\n\n| --- |\n| ![Figure978-1-6684-7808-0.ch013.f02](img/ch013.f02.png)\
  \ |\n\n| --- |\n\n\n\n许多学术出版物研究了繁荣电子商务的起源。一些研究提供了信息技术如何通过基于业务网络的价值创造来改变电子商务面貌的示例，并得出该行业经历了数字化转型的结论\
  \ (Gramoli, 2020)。市场和技术中的不确定性实际上对性能结果具有调节作用。监管环境、业务规模、供应链内部权力（也涵盖供应商议价能力）以及电子政府合规机制作为新的前因被包含在扩展模型中\
  \ (Iinuma, 2018; Iman, 2018)。\n\n## 区块链技术的特征\n\n区块链有三种定义方式。它是一个维护公共可审计共享账本的仓库。它是一个用于业务交易的点对点传输网络，允许用户在不需要中间人的情况下传输资产、价值和支付。从法律上说说，它验证交易并取代了以前受信任的实体。`DLT`\
  \ 一词指的是在私有或公共账本的众多节点之间共享数据的技术组。所谓的“无信任”系统实际上减少了对任何参与者所需的信任量，而不是完全消除对信任的需求。这是通过向行为者提供不同形式的合作激励来实现的，鼓励有利于整个系统的行为。然而，观众必须意识到，这种名称并没有精确地界定其他术语，而是反映了该术语的通用用法。通过使用区块链技术，用户可以在不需要可靠的中央权威或共同信任的情况下维护共享数据库，允许任何参与者随时加入或离开系统\
  \ (Jevans et al., 2020)。通过加密方式将多个活动集相互链接的技术建立了时间戳数据的年代顺序。区块序列通过使用哈希引用将每个区块与先前的区块连接起来，从而为区块提供了顺序和完整性。\n\
  \n这些理念的首次应用是被称为 `Bitcoin` 的去中心化在线支付系统，它基于一种被称为 `blockchain` 的特定分布式账本。现在存在的每一个 `Bitcoin`\
  \ 分配给唯一的加密身份，这是 `Bitcoin blockchain` 中包含的整个交易历史的一部分。在随后的几年里，在 `Bitcoin` 的引领下创建了许多替代系统，将潜在应用扩展到虚拟资产交易之外。例如，包括\
  \ `Ethereum` 在内的区块链平台允许用户通过修改数据结构和技术使公共代码更容易运行，从而保存交易代码和公共计算机代码 (Jonker, 2019)。参与者可以使用这种代码预先创建一系列操作，并在特定情况下执行。这些被称为\
  \ `smart contracts` 的程序可能对所有形式的电子商务产生重大影响，使得它们在（实际上）自动化合约交易方面特别具有吸引力。\n\n从设计上说，这些系统缺乏中央权威，成员自己不断更新共同数据结构。该机制通过将尚未添加到区块链的新收条目逐个发送给其他用户来传播。此外，由于用户并不总是以与其他网络节点的相同顺序获取它们，而且单个用户可能会错过某些条目，因此用户不能直接将未测试的条目添加到他们的个人区块链副本中。为了保持所有区块链副本的一致，参与者必须通过去中心化的多数投票过程对链的状态达成一致。这种程序在区块链上极其困难，因为每个用户可能会创建并使用惊数量的加密身份（如\
  \ `Bitcoin` 中所示）。如果这些加密身份在共识机制中具有单一投票，恶意行为者可能很容易控制多数票，从而控制系统状态。与加密身份的数量相反，其他不可任意缩放的参数被用来确定参与者的投票权重，以防止此类操纵。因此，许多区块链系统要求使用新添加内容更新区块链的用户使用越来越多的计算力或质押资金来投票。虽然存在其他机制，尽管在撰写本文时，它们的使用频率较低\
  \ (Joshi, 2020)。共识程序的两个最重要目标是 (a) 领导者选择和 (b) 速率限制。前者确保系统公平地选出一个“同类中的首席”（primus inter\
  \ pares），并赋予其短期引导网络进入新的、被接受的且共享状态的责任。后者确保新领导者的产生速度以及结果，即区块链状态的变化速度受到限制。这减少了攻击，并增强了可能无法投入相同时间的人之间的公平性。\n\
  \n例如，在 `Bitcoin` 系统中，参与者除了验证应包含在区块中的交易外，还反复执行简单的计算任务以计算出有效区块 (Beck et al., 2018)。通过试错，每个新区块都会经过细微调整，直到满足一组数学要求。由于用户只能贡献，结果生成的链通过用户将经过验证的区块添加到自己的区块链版本中，实现了系统的处理能力共识。因此，它对操纵尝试具有很强的抵抗，因为随着每个新区块的产生，重新计算区块链某些部分所需的计算能力迅速增长。为这种形式区块链贡献有效区块的用户通过获得新的虚拟货币单位和从记录在区块链中的交易的客户处收取的费用，来获得其计算力的补偿\
  \ (Biryukov & Tikhomirov, 2019)。\n\n区块链可以分为许可链和无许可链，以及公链和私有链。这些特征可以组合组合创建三种主要的区块链技术类型：\n\
  \n\n\n\n所有节点都可以读取、提交和写入公共无许可链的交易。相反，在私有许可链中，只有经过授权的 `Nodes`（节点）才有能力查看、发送和修改交易。这些差异对区块链的架构、每个参与者需要保证的程度以及防御恶意攻击所需的工作具有巨大影响。在利用区块链实现共享的场景中，如果各方彼此熟悉，那么使用不依赖高耗能共识技术的许可链和私有链，可能是供应链上企业间信息交换的更优选择。在电子商务领域中，可能同时使用不同类型的区块链。例如，公司可能会使用私有的、授权的链来管理其供应网络，同时启用基于公共无许可链的比特币支付（Kaminska,\
  \ 2018）。在后续章节中开发的研究目标通过在相当复杂的抽象层上整合多种区块链技术，考虑了这种差异。如果某项技术受到的影响相对较大或较小，将在正文中提及并在框架中予以强调。\n\
  \n区块链是一个多维构架，对电子商务产生了技术、立法、行政、质量和消费者方面的关注的影响。它提供了此前无法想象的技术能力，创造了新的可能性，但也有必要对现有的企业实践进行严谨的评估，例如它们如何处理敏感的消费者数据，或者它们如何建立整个供应链的通信链路（Kasahara\
  \ & Kawahara, 2019）。数据的妥善管理、安全与机密性挑战、系统设计、部署和配置，加上如 `IoT`、大数据、云技术、`AI` 和机器与交互等尖端技术可能的影响，都被视为技术挑战。数据收集、存储和分析问题涉及法律挑战，潜在的安全违露以及遵守被称为“反洗钱”和“了解你的客户”标准（`AML`）的法律需求也是如此。额外的关注点涉及区块链自动化业务运营和新型企业结构的法律合规性，包括在最极端的例子中完全去中心化的自治组织（`DAOs`）。区块链还创造了进入资本市场的新切入点，其中许多仍在非法运行。尽管这一趋势的融资因素引起了大多数人的关注并导致了不可持续的泡沫，但这仅仅是第一步，因为基础虚拟资产几乎总是随着项目内在的电子商务资本主义模型对实用性和便利性的保证而开始出售。这意味着几个基于虚拟资产的电子商务系统（无论是连接的还是未连接的）都可能会增加（Abramova\
  \ & Bohme, 2016）。\n\n## 技术问题\n\n区块链的技术特性是创新的重要催化剂。然而，由于对于如何构建此类系统的最佳方法仍然存在很大不确定性，目前许多如何如何利用这些特性来产生业务价值。目前对这些领域的电子商务研究从与区块链相关的优势和风险的角度进行了简要的检查和评估。在接下来的章节中，我们考察了电子商务的四个关键领域：可用性与可靠性、安全性和机密性、尖端技术和开发过程，以及区块链为每个案例提供的优势（Abramova\
  \ & Bohme, 2016）。\n\n| 图 3. 在电子商务中实施区块链期间出现的问题 |\n| --- |\n| ![Figure978-1-6684-7808-0.ch013.f03](img/ch013.f03.png)\
  \ |\n| --- |\n\n## 区块链对电子商务访问性和可追溯性的影响\n\n电子商务的主要成功要素此前被强调数据和支付的访问性和可追溯性。他们提出了一种方法，可以对在线商店获取的产品信息进行半自动分类收集，并指出“电子商务是在线数据流量增加损害数据访问性的领域之一”。根据\
  \ `ISO 9001:2000`，可追溯性是指沿着供应链中每个连接追踪个体开发、使用或存在的能力。创建了先进的模型以确保跨整个供应链的信息和支付的可追溯性。\n\
  \n取决于区块链系统的技术实现方式，它在电子商务交易中以组织且持久的方式保留购买数据，这有助于数据完整性和可追溯性。交易可能基于基础虚拟资产以法定货币定价，但很可能会使用市场定价的虚拟资产进行结算（Alabi,\
  \ 2017）。\n\n## 区块链对电子商务安全与隐私的影响\n\n据说电子商务系统需要两个关键组件：隐私和安全。现有的安全措施对人们对网络应用程序的信任程度有重大影响。例如，钓鱼网站和其他窃取用户隐私信息的欺诈操作对整个在线购物的生存能力是有害的。信息技术系统、伦理业务实践、物理架构和互联基础设施是消费者观察到的隐私和安全脆弱性的关键原因（Li\
  \ et al., 2020）。隐私密封曾被推荐作为解决隐私问题的方法；但它们在在这方面仅部分成功。如果不使用增强隐私的措施，所有人都可以看到区块链上的交易。公共区块链上的交易与虚拟身份相关。如果将智能合约集成到电子商务中，将关于\
  \ (a) 安全实现 (b) 公平执行 (c) 与多个网络的安全交换以及 (d) 机密性方面的增强安全问题。利用区块链技术开发的共识机制、链式存储和复杂的签名与验证系统为许多新功能开启了大门。利用传感器信息和包括可靠、防篡改、防御拒绝服务攻击和双花费攻击的安全特性，结合了保护隐私的安全措施。然而，区块链技术也带来了某些新风险，例如基础设施被矿工接管、智能合约的困难、双花费攻击或密钥的被盗或丢失（Meisel\
  \ et al., 2019）。\n\n## 区块链与尖端技术结合的影响\n\n许多研究已经确定了尖端信息收集和分析技术集成到电子商务中的可能性，包括包含机器通信（`M2M`）、物联网（`IoT`）、大数据分析、云计算和人工智能（`AI`）。在此意义下，“物联网”一词描述的是扩展的真实物理实体网络，这些实体集成了互联的传感器和元件，以便与其他设备和系统连接和交互。\n\
  \n\n\n\n\n大数据分析的目标是从不断增长的数据集中提取价值，这与可访问信息量的成比例增长密切相关。广而言之，云计算是指在无需用户持续监督的情况下即时访问计算资源\
  \ (Liu & Li, 2020)。\n\n为了交换关键数据，可能会部署三层物联网（IoT）架构（感知层、网络层和应用层）。采用目标识别模型的基于互联网的机器人提供的客户端服务可以得到增强。区块链与尖端技术的结合产生了许多推测性的用例，包括保险业对物联网和智能合约的使用，以及在无需耗时行政程序的情况下即可进行支付的能力。需要注意，区块链技术可以开发出相关系统，为\
  \ AI 服务提供者在医疗行业开发和应用特殊机器学习技术方面提供补偿，特别是在解释放射学图像和 CT 扫描方面。尽管众话这一主题具有巨大的前景，但关于其如何影响电子商务的深入研究仍然缺失\
  \ (Peng et al., 2020)\n\n## 区块链在系统开发中的应用（电子商务平台）\n\n关于如何创建和实施功能性的电子商务架构和系统设计，已经有了具体的指示。例如，创建一个\
  \ B2C 实现框架，除了传统的规划、选择、分析、设计、实施和管理系统的阶段外，还包含了多个子阶段。\n\n对于系统工程师和开发者来说，识别和建模电子商务解决方案是一项重大问题。B2C\
  \ 应用的需求由一个目标驱动的过程决定的，该过程识别关键功能、构建用例模型、评估目标，并考虑权衡和选项。系统工程师在对四项 EDI 努力进行研究后提出的 B2B\
  \ 电子商务概念，对应该开展的合作类型提出了建议。如果部署了更多通用和专用的区块链，电子商务企业选择合适的平台并确保跨技术兼容性将变得越来越具有性 (Pollock,\
  \ 2019)。新用例的出现使得有必要创建专门为区块链定制的部署基础，以及新的协议和设计模式。智能合约标准化编程接口的引入正迫使企业采用标准化的编程接口和数据交换格式。因此，必须明确说明面向设计的研究的研究目标，以及底层区块链的特征和选择区块链而非传统数据库解决方案的理由。换句话之，系统设计必须有意识地考虑区块链的特性，例如共享访问和不可变数据。生成的应用程序必须与公司的整体战略和操作流程密切对应，包括后续章节涵盖的任何法律考虑\
  \ (Rejeb et al., 2020)\n\n## 法律关注\n\n区块链在早期主要是一项技术发展，而今天提供了丰富的新可能性，当局在决定应该进行哪些法律调整之前必须充分理解这些可能性。许多国家的立法落后于当代趋势，类似于电子商务的初期。这与控制个人数据处理方式、货币如何交换虚拟资产、智能合约如何使用以及自治组织如何开始发展的法规有关。此外，合规相关的困难将如何解决尚不清楚。我们的分析识别了区块链可能影响的五个重要法律领域：资本市场准入、合规性、组织程序和结构、信息困境，以及构建合法的区块链电子商务系统\
  \ (Rejeb et al., 2020)\n\n## 电子商务中的敏感数据处理\n\n自电子商务诞生以来，满足数据需求一直是一个议题。例如，早期的研究调查了人工智能如何影响电子商务和远程销售在信息需求方面的法律要求。敏感数据的保护以及更广泛的客户隐私，是客户和政治家共同关注的问题。大多数国家都有法律监管电子商务的各个方面，例如数据收集、使用、发布、保存期限、安全和信息需求。尽管《通用数据保护条例》（`GDPR`）已为用户信息安全建立了一个共同框架，但各种隐私法规也适用于区块链中个人信息的处理。在通过协议来执行法律合同的情况下，区块链系统保留了涉及虚拟资产的交易以及合约协议的信息。尽管目前使用的公有区块链系统中的大多数用户使用伪匿名的加密身份，但通常仍然可能使用额外信息识别出个人。这引发了使用区块链技术的电子商务公司如何保证遵守欧盟\
  \ `GDPR` 等隐私法规的问题。一旦数据经过验证并添加到公共区块链，它就会向公众开放并可能被任何人访问。将 `GDPR` 的关键条款应用于这些技术进步具有挑战性，包括更正和删除的权利\
  \ (Research and Markets, 2020)。许多电子商务公司担心 `GDPR` 可能适用于包含个人信息的区块链。\n\n## 对客户知识需求的影响\n\
  \n电子商务公司熟悉披露法规。随着电子商务公司可能使用虚拟资产支付进行交易目的，实施 `KYC` 和 `AML` 可能会在许多国家首次成为该过程的一个关键部分。由于对第三方结算服务的依赖，此前不属于任何特定\
  \ `KYC` 或 `AML` 要求的电子商务企业，如果通过完全匿名的区块链系统进行传输，最终可能会发现自己受到繁琐且昂贵的监管方案限制。此外，由于用户可以根据需要创建身份，出于追踪目的的分类和账户匹配随着时间的推移变得更加困难。已经提出的基于区块链的系统建议无论客户与多少机构有业务往来，只需进行一次基本的\
  \ `KYC` (Salah et al., 2019)\n\n## 对组织结构和程序的影响\n\n\n\n\n\n“智能合约”一词描述的是一种算法化的、自动执行且自我强制的计算机程序，可处理许多不同类型的交易。与通过数字通信语言或行为创建的传统电子商务协议相比，个人拥有最终决定权。尽管目前尚不清楚普通合同法规则能多成功地适应智能合约的新型技术框架，以及智能合约在什么条件下能为其双方产生法律上可执行的权利和义务，但毫无疑问，障碍仍然存在。电子商务协议以前并不被视为一种技术边界资产，平台社区可以通过向其他方提供其技术合约接口来扩展网络效应。DAO（去中心化自治组织）以及一般的智能合约为电子商务开辟了新的可能性。基于智能合约的虚拟\
  \ DAO（例如在以太坊区块链上创建的 DAO）可以用于与其他进行交易（Baker, 2020）。\n\n## 访问金融市场\n\n区块链还创造了以前无法想象的进入资本市场的机会。在“首次代币发行”（ICO）中，供应方向客户出售代币以换现金。由于法律安全性的提高，证券代币发行（STOs）和初始交易所发行（IEOs）变得越来越流行。此类活动经常通过专门的虚拟资产论坛和网站在网上公布（Chamola\
  \ et al., 2020）。大多数发行者将提供白书的在线访问，白书解释了项目和重要的发行参数（如财务条款、订阅信息和进度），并提供了有关项目当前状态和团队成员的信息。订阅程序通常涉及用户将数字资产转移给提供者，通常转移到一个或多个预定义的地址。意料之中，骗子和赌博者已被这种新的融资方式所吸引。此类融资方式的显著区别在于，资产通常是在报价或将获得报价的确定性下出售的，这在数字资产是唯一有效支付形式的构建电子商务环境中是不常的（Chamola\
  \ et al., 2020; Chanson et al., 2019）。\n\n## 在区块链环境中维护数据完整性的解决方案：防止无害缺陷\n\n数据完整性问题，尤其是无意的问题，对于供应链领域来说并不新鲜。因此，在更传统的供应链环境中解决数据完整性问题的策略，与在区块链背景下防止良性数据完整性故障的相关策略非常相似。\n\
  \n| 图 4. 区块环境中维护数据完整性的解决方案 |\n| --- |\n| ![Figure978-1-6684-7808-0.ch013.f04](img/ch013.f04.png)\
  \ |\n| --- |\n\n这样做非常容易，因为不需要预测精明且聪明的对手的潜在行为。通过正确的系统设计、维护、管理和业务实践，可以避免大多数良性问题；这遵循相同的传统概念和程序。与防止恶意缺陷相关的策略和解决方案（区块链技术擅长的领域）将在本节中获得进一步关注（Ballestar\
  \ et al., 2018）。\n\n### 防止恶性缺陷\n\n无论是用户、公司、预言机还是数据供应商，区块链中所有的恶意缺陷都是由赋予参与者的特权权力引起的。虽然这些权利在正常情况下是有益的并支持基本的区块链部署功能，但在出现问题时它们也可能被滥用。因此，防止恶意错误需要将权利限制在仅所需的范围内，减少特权滥用造成的潜在伤害，识别恶意行为并在发生时追究责任方的责任。将系统对信任参与者的依赖降至最低也是至关重要的。解决方案的设计旨在确保数据完整性的特定背景下，对某些数据的准确性保持高水平的信任，同时尽可能减少对提供这些数据的方的依赖。这通常表现为有助于对数据输入初步验证的协议和其他程序。信任最小化理念，正如其名所示，试图减少对任何参与交易的各方的信任和依赖，它是所有这些策略的基础（Catalini\
  \ & Gans, 2018）。通过使用这一理念，系统可以抵御恶意行为以及其他良性缺陷，并保持健壮性、弹性和正常运行。\n\n即使区块链系统必须依赖某些各方，信任最小化仍然重要。例如，即使预言机是访问其所有数据输入的唯一实体，所有输入也应清楚地记录在某处，以便在必要时对任何嫌不当的行为进行检查。区块链需要某些数据。由于复杂性和成本的增加，防止良性故障的方法比防止恶意故障的方法便宜。自然，这取决于负责设计区块链部署的人如何决定这些保护有多重要，以及如何将其必要性与成本、技术难度和集成困难等因素进行权衡。通常情况下，最好在实际范围内尽可能使用以下方法（De\
  \ Filippi & Wright, 2018）。\n\n### 确保数据完整性的传统方法\n\n这些确保数据完整性的非常简单的方法在整个供应链领域（包括区块链部署之外）都是广为人知、成功且频繁使用的。\n\
  \n严格审查任何需要信任以执行特定任务的个人或组织。用于选择新员工或外包公司的相同筛选和资质程序，通常也用于选择哪些个人和组织获得区块链网络中特权角色的访问。例如，可以要求人员通过认证程序或根据需要提供“了解你的客户”（`KYC`）信息。一种选择是选择法律要求遵循特定准则的人，例如将公证员转换为执行基于区块链的服务。可以评估一个组织的整体技能、历史表现、公司价值观和管理风格（Gao\
  \ et al., 2018）。\n\n通过习惯法律协议实施惩罚性措施（例如针对特定非法网络行为规定的罚款）是另一种策略。此类解决方案将继承正式合同广为人知的优点和缺点，带来诸如合同是否实际执行、标的金额是否足以支持诉讼等问题。如果仲裁足够高效且负担得起，法律合同可以成为创建保护数据完整性强大承诺的有用工具（Hawlitschek\
  \ et al., 2018）。\n\n## 数据完整性的现代方法\n\n尽管这些方法较新且实施挑战性大，但这些复杂的解决方案与区块链部署的数据完整性要求特别相关且一致。\n\
  \n\n\n\n\n# 声誉系统\n\n随着时间的推移，特权执行者创建的输出和行为提供了数据，可用于估计其未来的预期可靠性和信誉度。可以说，如果一个预言机（oracle）拥有良好的成功表现记录，例如，它从未提供过与其它预言机（针对同一请求）提供的值有显著差异的值，这可以用来证明赋予该预言机未来输入略高的权重，或为其服务支付更高费用。如果怀疑任何不当行为，可以利用作为声誉系统基础的记录来审计早期的行为。通过性能历史和对可靠执行者的人工评分，可以建立一个作为未来特权和奖励增加基础的声誉系统。\n\
  \n尽管如此，在为知名执行者引入货币奖励或授予更多特权时，建议采取极其审慎的态度，因为这会增加潜在竞争对手试图不当利用系统的激励。例如，可以通过声誉耕作、合谋、损害对手声誉、滥用权威地位获取不公平的财务利益以及跑路骗骗来实现这一点。由于激励机制在历史上很难正确对齐，构建可靠的声誉系统是极具挑战性的（Kethineni\
  \ et al., 2018)。\n\n# 自动化\n\n自动化是另一种减少对可能危险的人类代理依赖的策略。为了防止驱动员有机会伪造包裹交付时间，货车可以随时自动披露其位置。与其等待可能刻意或无意延迟付款的人员和官僚程序，可以使用智能合约在满足预设条件时对货物和运输进行支付。为了避免那些从当前流程的低效和不透明中获利的人，通过区块链，国际出口所需的法律文件可以被数字化（Khan\
  \ & Salah, 2018）。自动化过程即使在面对合理的操纵系统尝试也能生成客观结果的能力，是决定自动化是否对数据完整性有益的关键因素。提高自动化水平通常具有额外好处，可以使流程更高效、降低成本，并使其更容易检测和修复人为输入错误，这有助于防止更多良性问题。然而，这种方法也受到限制，因为许多工作仍需要由人们来完成（Kiktenko\
  \ et al., 2018）。\n\n# 问责与欺诈检测\n\n在理想的世界中，可以识别任何错误或欺诈的数据输入。即使数据完整性问题是在数据已被利用后才被发现，这也是有利的，因为违规者仍需负责。违规方可能会受到适当的惩罚，例如声誉受损、失去作为当前和未来良好行为保证的全部或部分财务抵押、提交数据输入的能力被暂停或撤销，甚至提交数据输入的能力被暂停或拒绝。这将取决于错误的严重性、它们是无意的还是出于恶意，以及其他因素。其他选项包括引入机器学习模型，以自动拒绝或标记包含异常数据的提交。虽然可能使用其他版本，但基本目标保持不变：识别不准确的数据输入并让信赖方对其负责（Kim\
  \ & Laskowski, 2018；Lo et al., 2017）。\n\n这种方法的主要缺点是无法进行冗余报告，因为供应链中很大一部分中只有一个组件可以访问相关数据。只有发送箱子的实体可以提供其内容的准确列表，而只有现在控制包裹的实体才知道其当前位置。然而，这种方法在增强任何公开可用数据或可能提供给多方的数据的正确性、稳健性和可靠性方面是有效的（Markham,\
  \ 2019）。\n\n# 冗余与聚合\n\n适用于冗余和聚合的数据示例包括外部的当地情况、商品成本和汇率、SEC 文件中包含的信息，以及几乎可以从互联网上获取的任何内容。如果数据可以通过组织的\
  \ `API` 获取，那么许多预言机可能能够与该 `API` 接口（Lo et al., 2017；Markham, 2019）。\n\n另一个例子是属于大型货运公司的移动货车的全球定位系统（GPS）位置。除了报告自己的位置外，车辆还将显示相邻公司车辆的所在地，使得秘密修改某辆车辆的\
  \ GPS 系统变得更加困难。为了成功伪造位置，需要不仅仅是一个公司车辆的 GPS 系统被攻破（Neroda, 2019）。\n\n预言机的使用通过输入聚合和交叉验证显著增强了数据完整性。由于每个增加的传感器或预言机都带有固定且持续的费用，关键问题是通过这些组件的数量和质量所能实现的安全水平是否符合用例的要求（Norvill\
  \ et al., 2019）。\n\n额外的数据通常可以对数据建议的发生和情况产生更大的信心。例如，一条简单的规则——快递员在将昂贵的箱子放入指定的存款容器时必须拍摄一段短视频，这为产品确实已交付提供了要好多的确定性。虽然快递员可能拍摄交付并在稍后取回箱子，但由于需要更多数据，想要脱身将变得困难，因为数据必须是自洽的，还要与其他事件产生的数据具有可比性。尽管链上可能只保留数据的哈希值（hash），但将这些数据存储在区块链这样的不可篡改且防篡的数据库中，允许在未来发生分歧时对事件进行验证（O’Brien,\
  \ 2019）。\n\n每个用例在维护数据完整性方面都有独特的需求，即哪些信息和证明会有帮助；因此，区块链设计者和供应链决策者必须在该领域发挥创造力。然而，核心概念保持不变：虽然完全防止欺诈具有挑战性且证据可以被伪造，但当与其他数据完整性解决方案相结合时，额外的数据和证明增加了攻击者提交虚假数据的成本和时间（Onder\
  \ & Treiblmaier, 2018）。\n\n\n\n\n\n提供数据输入的预言机（Oracles）可以包含一种匹配的“证明”，得助于“可证明诚实”的协议，证明它们提供的数据与其从数据源接收的数据完全相同。这是使用密码学协议和专用硬件的替代方案。一旦数据和证据发布到区块链并经过交叉检查，如果证明被判定为不真实，则数据将被删除。由于这些协议是以这种方式设置的，从数据源收集数据后被更改的数据很难证明。因此，以这种方式交付数据的预言机是“可证明诚实”的，除了相信它们将继续提供预言机服务外，不需要其他信任。然而，即使预言机失去了用处或停止提供服务，也可以立即找到替代方案（Pesch\
  \ & Sillaber, 2017）。从区块链的角度来看，只要相应的证据是可靠，哪个预言机呈现数据并不重要。\n\n安全超文本传输协议（HTTPS）：`TLSNotary`\
  \ 是 `HTTPS` 协议的一种改进，它允许任何机器证明某个特定网页确实加载在其浏览器中，这是互联网传输请求的较佳解决方案之一。例如，区块链上的智能合约可以通过利用\
  \ `TLSNotary` 来证明数据源自 UPS，显示其从 UPS 获取的跟踪数据和时间戳在上传到区块链之前未被更改（Porru et al., 2017）。\n\
  \n对于主要需要离链执行某些处理的请求，能够产生此类正确性证明的顶级技术之一是 `TEEs`，例如 `Intel Software Guard Extensions`。`可信执行环境（`Trusted\
  \ Execution Environment`）本质上是包含在支持此协议的 `Intel CPUs` 中的、与其他计算机组件完全隔离开的独立组件（Ramesh\
  \ et al., 2017）。`TEEs` 在敌对环境下提供可靠的数据完整性保证方面表现卓越。\n\n## 结论\n\n在区块链上，存储空间是完全去中心化的，这意味着所有节点共同工作维护数据，而许多其他节点仅保留数据备份。另一方面，传统的数据存储仅将数据保留在单个服务器节点上。记录在区块链中的信息不会受到单个节点更改或丢失信息的影响。为了确保数据安全存储，区块链上的内容确实可以被认为是永久性的。区块链系统降低了数据被拦截或损坏的可能性，阻止了可能的欺诈，并保护数据免受入侵者侵害。\n\
  \n最后，采用区块链作为第三方认证的框架可以确保数据的可用性、安全性、有效性和隐私保护。区块链使得交换、检查和保存数字数据变得简单。此外，它使用密码学加密每次交换。通过这样做，企业可以在安全性和可用性方面达到更高的高度。\n\
