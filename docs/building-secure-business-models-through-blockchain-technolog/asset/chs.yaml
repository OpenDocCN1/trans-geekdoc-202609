  \n# 第 9 章\n\n* Guneet Kaur - 英国斯特林郡大学\n* Arun`KrishnaKrishnaKumar` - 英国 Bulleiverse\n\
  \n### 摘要\n\n一种被称为去中心化金融（DeFi）的新型面向消费者的金融应用程序通过智能合约构建，并运行在无许可的区块链技术上。在本章中，作者将 DeFi\
  \ 概念置于区块链及相关技术的理论框架内，并探讨了其潜在的现实世界应用。此外，作者研究了今天 DeFi 的基本概念和应用场景，并指出分布式账本技术、人工智能、机器学习和零知识证明是帮助变革\
  \ DeFi 的三项关键技术。作者得出结论：区块链是 DeFi 的基础，人工智能和机器学习能力帮助机构向用户提供加密货币洞察以应对市场波动，而零知识证明则确保了不受监管的去中心化金融世界中数字交易的安全。\n\
  \n### 引言\n\n公司治理目前处于银行业业的前沿。由于当前的系统可以通过增加竞争和减少某些生态系统的控制来改进，改革和创新迫在眉睫。一些利益相关者针对加密货币社区对经济改革的需求开发了替代金融模型。毫无疑问，区块链技术和加密货币具有潜力。一个在线社区受到这种新业务模式的启发，为金融领域带来了机遇。随着共享经济的出现，这种新的业务模式使得新的加密货币和知名令牌更容易获取。\n\
  \n此外，通过引入使用开源协议而非传统金融中介的 Web 去中心化方法，去中心化金融（DeFi）旨在改变当前的中心化全球经济基础设施。任何多个实体控制专用网络而非单一中央权威的情况都被称为去中心化。在这种背景下，DeFi\
  \ 防止了在金融交易中使用中间环节（银行或其他任何金融机构）。结果，DeFi 为成熟金融机构提供了若干扩展机会，可以改进现有的运营和服务。然而，不应将分布与去中心化混淆。分布关注许多系统之间的团队合作，许多计算机通过共享资源和处理能力共同完成任务。尽管如此，它也挑战了当前的金融服务及其基本业务模式。\n\
  \n因此，由于 DeFi 仍处于创新的早期，机构将在构建 DeFi 生态系统方面发挥重要作用。通过利用当前的 DeFi 生态系统基础设施，可以获得收入机会（包括新的服务产品）以及运营效率。此外，能够适应并拥抱这些发展的机构将在这一新金融生态系统发展过程中拥有许多增长前景。本章将讨论变革\
  \ DeFi 的各种技术，包括区块链、Hedera hashgraph、Holochain、人工智能、机器学习和零知识证明。为了增加实用性，文中还讨论了使用 `Ethereum`\
  \ 区块链、`ASX's the Clearing House Electronic Subregister System`、`RippleNext` 和 `Zoracles`\
  \ 协议作为案例研究的技术应用。讨论、未来工作以及结论部分阐述了作者的潜在贡献以及未来可以开展的研究工作。\n\n## 理解去中心化金融\n\n几乎所有的银行、贷款和交易领域都由权威和看门人运行的中心化系统控制。访问从抵押贷款到股票的任何内容都由`证券交易委员会`（`SEC`）和`联邦储备的决定规定。因此，消费者无法避免从每个环节中获利的银行和交易所等中间环节。DeFi（也称为\
  \ DeFi）通过点对点交易（`Zetzsche et al., 2020`）解放人类，从而反对这种中心化系统。\n\n去中心化金融通过区块链和加密货币等关键技术成为可能。通过区块链，客户的交易历史记录在私有账本中，该账本由大型金融机构拥有并控制（`Meyer\
  \ et al., 2021`）。分布式意味着 DeFi 程序的每个用户都可以访问总账的相同副本，该账本包含交易的加密记录。通过提供用户匿名性、支付验证以及（几乎）无法通过欺诈行为改变资产所有权的描述来确保系统安全。通过解决复杂的数学问题并添加新的交易块，使用相同区块链的双方可以验证并记录交易。DeFi\
  \ 支持者认为，去中心化区块链使得金融交易比中心化金融使用的私有秘密系统更安全、更透明（`Zetzsche et al., 2020`）。\n\n在许多方面，第一个\
  \ DeFi 应用是`比特币`（`Chen & Bellavitis, 2020`）。用户可以通过`比特币`真正地拥有并控制价值，并将其发送到世界上任何地方。这是通过为许多互不信任的人提供一种机制，使他们能够在账本上达成共识，而不需要可靠的中间人。`比特币`的规则（如其稀缺性和开放性）包含在技术之中。任何人都可以使用`比特币`，没有人有权力改变其运行原则。\n\
  \n\n\n\n\n由于多种原因，以太坊是理想的 DeFi 基础。每个人都可以使用 DeFi，因为没有人拥有以太坊或运行在以太坊上的智能合约。这意味着没有人可以对用户施加新规则。在后台，所有\
  \ DeFi 产品都通过以太坊进行通信。这表明大量产品可以完美集成。例如，你可以在一个平台上借出代币，而在另一个平台或应用程序中，你可以将生息代币兑换为其他代币。这就像银行奖励积分兑现。以太坊作为一个共享账本，内置了代币和加密货币；追踪交易和所有权是以太坊的本行。得益于以太坊，大多数事务将完全实现去金融化。区块链是这种有助于实现金融自由的技术之一。许多其他如\
  \ Holochain、人工智能、机器学习等技术在构建 DeFi 产品方面也起着至关重要的作用。接下来的章节将详细介绍这些技术。\n\n## 赋能去中心化金融的技术\n\
  \n数字资产和加密货币市场近年来蓬勃发展。机构开始提供托管服务，便利加密货币的买卖，并正在探索参与 DeFi 的方法。个人、风险投资家和数字原生企业是当前 DeFi\
  \ 成长的推动者。传统机构对 DeFi 的采用将标志行业发展和成熟的关键转折点。它将对当前的金融中介模式以及更广泛的金融体系产生影响。以下是一些有助于赋能去中心化金融的技术——\n\
  \n## 分布式账本技术\n\nDLT 是分布式账本技术（Distributed Ledger Technology）的缩，是一种在不同位置同时注册虚拟交易和其他类似数据的数字机制\
  \ (El Ioini & Pahl, 2018)）。分布式账本的主要特点是由于于卓越的记录技术和方法，它们没有中央管理组件。因此，由于不需要中央机构进行验证，交易更快且成本效益。相反，网络由许多节点组成，参与者可以通过这些节点访问记录的信息，减少了网络受到网络攻击的脆弱性\
  \ (El Ioini & Pahl, 2018)）。\n\nDLT 利用加密技术提供任何信息的安全、准确存储。通过“密钥”和加密签名可以获得相同的结果。一旦数据被保存，它就会变成受网络规则约束的不可变数据库。DLT\
  \ 可以改变机构、政府和企业的运营方式。例如，它可以协助政府发行护照、征收税款、土地登记和许可证记录、社会安全支付的分配以及投票程序。金融、钻石和其他贵资产、音乐与娱乐、艺术、供应链和其他行业都从这项技术中受益。许多大型公司（如\
  \ `IBM` 和 `Microsoft`）以及初创公司都在尝试区块链技术。`Bitcoin`、`Ethereum`、`Hyperledger Fabric`、`Ripple`、`R3\
  \ Corda` 和 `Quorum` 是分布式账本技术著名的用例之一。\n\n### 区块链\n\n区块链（DLT 的一种）是一种公共账本系统，确保交易数据的完整性\
  \ (Swan, 2015)。它最广为人知的是驱动 `Bitcoin` 加密货币的技术，但区块链技术并非自 `Bitcoin` 加密货币引入才出现。1976 年发表了一篇名为《密码学新方向》的研究，它引入了分布式账本的概念\
  \ (Diffie & Hellman, 2019)。区块链的基础和发展历史可以参见表 1。\n\n### 表 1 区块链技术历史\n\n| 年份 | 描述 |\n\
  | --- | --- |\n| 1976 | Diffie 和 Hellman 发表了论文《密码学新方向》 |\n| 1977 | 著名的加密算法 `RSA`\
  \ (Rivest–Shamir–Adleman)，一种广泛使用的公钥加密系统被提出 |\n| 1980 | 默克尔树 `Merkle Tree`（一种用于验证分布式网络数据正确性的数据结构）被提出\
  \ |\n| 1982 | 拜占庭问题、椭圆曲线加密 `ECC` (Elliptic cryptography) |\n| 1985 | 高容错一致性算法 `Paxos`\
  \ 被提出 |\n| 1998 | 加密货币的概念被引入，美国安全局 (`NSA`) 发布了 `SHA-256` |\n| 2005 | Hal Finney\
  \ 提出了一种可重的工作负载机制 |\n| 2008 | Satoshi Nakamoto 发表了关于 `Bitcoin` 的白皮书 |\n| 2009 | `Bitcoin`\
  \ 时代正式开启 |\n| 2013 | 以太坊账本加上智能合约时代开启 |\n| 2015 | 许可链区块链 `Hyperledger` 被引入，第一个非同质化代币\
  \ (`NFT`) 项目 `Etheria` 推出 |\n| 2016 | 去中心化自治组织 `DAOs` 的想法出现 |\n| 2017 | 首次代币发行 (`ICOs`)\
  \ 激增 |\n| 2018 | `EOS`（一种第三代区块链平台）推出 |\n| 2019 | Facebook（现为 `Meta`）提出了 `Libra`\
  \ |\n| 2020 | 区块链的应用场景扩展到加密货币之外，`NFTs` 的兴起 |\n| 2021 | 元宇宙、绿色区块链倡议以及 `Ethereum 2.0`\
  \ |\n\n区块链将交易分组并链接成区块，分发到所有网络节点。例如，当双方想要交换数字货币时，他们必须发起交易。然后，它被加载到包含其他交易的区块中。随后，新区块添加到链创建的网络中。网络组件（矿工）使用数学技术检查并评估初始交易，以判断其是否真实\
  \ (Qin et al., 2018)。这意味着至少有 51% 的参与计算机认为该交易是正确的。\n\n\n\n\n\n区块链的可见性始于 `Bitcoin`\
  \ 的诞生，它仍然是基于区块链技术应用最广泛的应用。`Bitcoin` 是一种基于区块链的去中心化数字货币支付系统，其价值可以在任何机构或政府干预的情况下维持。`Bitcoin`\
  \ 网络的交易量和用户数量不断增长（Kondo et al., 2014）。这种使用区块链技术开发加密货币的阶段被称为区块链 1.0。在区块链 1.0 中，`Bitcoin`\
  \ 被用作一种数字支付系统，并被誉为“货币互联网”的推动者。交易通过一种名为工作量证明（`PoW`）的共识机制进行验证。`工作量证明`最早于 1993 年提出，用于对抗垃圾邮件和网络拒绝服务攻击（Keenan,\
  \ 2017）。中本聪在 2008 年普及了 `PoW` 理念，用于在 `Bitcoin` 网络中验证新区块（Keenan, 2017）。`PoW` 基于网络用户证明其已完成某项计算任务的能力。使用算力节点来求解数学方程，在方程被破解后，链上的新区块就会通过验证。任何物理物品，例如可以在其他工具组成的网络内部接收、发送或转发数据的计算机，都被称为节点。\n\
  \n## 区块链 2.0：智能合约\n\n`Smart Contracts` 是“运行”在区块链上的微型计算机程序，是一个新的重要概念。它们是自包含的计算机程序，在预设条件下自动运行，例如促进、验证或强制执行合同执行（Zheng\
  \ et al., 2020）。区块链使得智能合约无法被篡改或黑客，这是该技术的重大优势。因此，智能合约降低了验证、执行、仲裁和防欺诈的成本，同时允许清晰的合同定义，消除了道德风险问题（Christidis\
  \ & Devetsikiotis, 2016）。`Ethereum` 区块链在该领域最著名，其目标是允许实现智能合约。\n\n## 区块链 3.0：分布式应用\
  \ (dApps)\n\n`DApp` 代表不依赖中心化基础的去中心化应用。因为它们依赖于去中心化的存储和通信，大多数 `DApps` 在区块链（一种去中心化的点对点网络）上运行后端代码（Wu\
  \ et al., 2021）。另一方面，典型的应用其后端代码运行在中心化服务器上。`dApp` 与标准应用一样，可以拥有前端代码，并可以使用任何语言编写的用户界面对其后端进行调用。然而，`dApp`\
  \ 的前端可以托管在 `Ethereum` 的 `Swarm` 等去中心化存储上。\n\n## 区块链 4.0：Web3、NFT 和元宇宙\n\n`Web3.0`\
  \ 将依赖去中心化协议，区块链在未来几年可以提供这些协议。`Metaverse` 描述用技术构建的虚拟场所。`NFTs`（非质化代币）与 `Microsoft`、`Facebook`\
  \ 等技术进步紧密相关的数字文件。`非质化代币`是一种代表价值的特定数字资产（Wu et al., 2021）。\n\n### Hashgraph 和有向无环图\
  \ (DAG)\n\n根据 `Mance`（Hedera 创始人），`Hashgraph` 是一种具有显著速度的第一代技术（Baird, 2016）。`Hashgraph`\
  \ 在 `DAG` 中存储交易并采用投票机制来实现共识（Schueffel, 2017）。与 `blockchain` 相比，它在数学上被证明可以更快地复制数据。一个\
  \ `hashgraph` 在最基础层由列和顶点组成；每一列代表一个网络用户，而顶点代表事件（Baird, 2016）。\n\n在 `hashgraph` 中，用户基本上可以做两件事：\n\
  - 用户通过创建事件来提交交易。\n- 用户随机选择其他用户并告诉他们自己知道的信息。\n\n`Hashgraphs` 同样将交易打包成区块；但与 `blockchain`\
  \ 不同，所有的哈图区块无论顺序如何都会添加到分布式账本，从而生成交易数据的完整图像（Schueffel, 2017）。`有向无环图`是对这种结构的命名。`DAGs`\
  \ 相比 `blockchain` 的主要优势之一是可以减少每笔交易的数据量、降低成本、提高速度并获得更高的可扩展性（Benčić & Žarko, 2018）。\n\
  \n`有向无环图`与`区块链`的差异总结在表 2 中。\n\n表 2. 有向无环图与区块链的差异\n\n| | 有向无环图 | 区块链 |\n| --- | ---\
  \ | --- |\n| 共识达成 | 前一次交易的成功证明了共识的达成。 |get 共识机制让参与者能够创建新货币。 |\n| --- | --- | ---\
  \ |\n| 交易速度 | 得益于 `DAG` 独特的数据结构，可以添加大量交易并具有更好的可扩展性。 | 在可扩展性方面，`blockchain` 的每秒交易数较少。\
  \ |\n\n\n\n\n\n# Hedera Hashgraph\n\nHedera Hashgraph 是一种公共分布式账本技术，其架构使用了 `DAG`\
  \ 而不是区块链（Dolenc et al., 2020）。该项目由一个包括 `Deutsche Telekom`、`Boeing` 和 `Google` 在内的全球业务领袖组成的委员会进行监督。为了在网络数据上达成共识，Hedera\
  \ Hashgraph 采用了泛洪协议（gossip protocol）。泛洪协议为网络节点提供交易数据，然后由节点对这些交易达成一致。节点以随机间隔将所有交易信息发送给其他节点，允许交易信息在整个网络中快速传播。当两个节点同步时——被称为“泛洪同步”（gossip\
  \ sync），每个节点都会创建一个“事件”（event）来信号同步的结束（Krasnoselskii et al., 2020）。`event` 是一种包含时间戳、交易、每个节点上一个事件的两个哈希值以及存储在网络内存中的加密签名的数据结构。事件的历史和相应的哈希值被称为“关于泛洪的泛洪”（gossip\
  \ about gossip），它形成 `hashgraph`，即一种 `DAG`。节点可以在几秒钟通过关于泛洪的泛洪来识别交易应该放置在账本历史中的位置。\n\
  \nHedera Hashgraph 验证其网络上完成的所有交易的能力受到了质疑，这可能归因于其独特的方法（Krasnoselskii et al., 2020）。一些反对者声称，由于缺乏加密区块确认方法，恶意行为者可能会鼓励节点传输虚假数据。此外，Hedera\
  \ Hashgraph 在检测和防止此类行为的能力有限。\n\n# Holochain\n\nHolochain 是一种基于点对点的分布式账本技术（Zaman\
  \ et al., 2022）。它与区块链的不同之处在于其运行方式不同，这使其在当前市场中具有独特的价值。当前代的区块链技术消耗了大量的能量。例如，考虑 `Bitcoin`，它需要使用矿工来验证区块。为了解决加密谜题，`Proof-of-Work`\
  \ 共识方法需要大量的计算能力，产生了巨大的能量需求，这不利于大自然（Panwar & Bhatnagar, 2020）。Holochain 技术使用了 `Go`\
  \ 编程语言，而应用可以使用 `Lisp` 或 `JavaScript` 创建（Zaman et al., 2022）。它是一个以代理为中心、高效率的账本系统。这意味着每个代理都将拥有自己的安全账本副本，并能够独立运行。它还可以与其他网络设备通信并提供全面的服务。Holochain\
  \ 的现实世界用例包括：\n\n* **社交网络**：Holochain 的最佳用例是社交网络。它很有帮助，因为社交网络可以在没有连接的情况下运行，用户可以保存其本地副本。\n\
  * **P2P 系统**：P2P 平台可以有效使用 Holochain。小型社区可以对其进行定制以满足他们的需求。P2P 平台还可以与其他网络对接并利用 Holochain\
  \ 的功能。\n* **协作应用**：Holochain 是构建聊天、辩论、调度甚至 Wiki 等联合联合程序的极佳解决方案。\n* **供应链**：Holochain\
  \ 对供应链大有益处。无论什么组织、公司或地理位置如何，它都能提供一种管理供应链的独特技术。\n* **评分平台**：可以构建、控制和设置评分平台。\n\n对于需要全球共识的系统，区块链是理想的选择。另一方面，Holochain\
  \ 技术适用于不需要全球共识即可运行的系统。然而，缺乏全球共识具有几个优势，包括提高可扩展性、效率、适应能力和可扩展性。\n\n# Tempo (Radix)\n\
  \nRadix 是另一种分布式账本技术（DLT），其交易存储在分布式数据库中。Tempo 是 Radix 开发人员赋予共识算法和账本架构名称（Masood &\
  \ Farid, 2018）。为了相互通信，Tempo 需要一个以点对点方式连接的计算机网络。因为它是一个分片的、去中心化的分布式数据库，它需要一种方法跨网络按时间顺序和发生顺序对事件进行排序。“数据库分片”是指数据库中数据的水平划分。`Universe`\
  \ 是一个 `tempo` 实例，而 `Universe` 包含了参与其中的节点。这些节点保留了账本的完整或部分副本。网络节点共同工作，创建一个具有特定冗余度的分片的、去中心化的、分布式账本副本。希望跨网络发送交易和消息等事件的客户端可以连接到网络中的任何节点并提交它们的事件。Tempo\
  \ 中有两种类型的事件：`ledger event`（账本事件），它与交易类似，因为它会更改账本状态；以及 `protocol event`（协议事件），它是两个执行协议序列的节点之间的通信（Masood\
  \ & Farid, 2018）。异步拜尔庭容错保护账本事件，而异步拜尔庭容错检测保护协议事件。\n\n与区块链网络相比，Radix 网络具有高吞吐量。只有发生冲突的交易会被验证，消除了进一步努力的必要。此外，每个参与验证过程的节点都会获得奖励。没有资源浪费，因此节省了大量的计算力和资源。Radix\
  \ 目前正在开发一种低波动代币。Radix 的经济模型为 DLT 提供了巨大的推动，因为它解决了吞吐量问题，这是区块链技术的一个关键缺陷。\n\n# 人工智能\
  \ (AI) 和机器学习 (ML)\n\n人工智能 (AI) 和去中心化金融 (DeFi) 是现在的两个热门话题。大型和小型企业已经从 AI 在工作场所日益增长的使用中受益。例如，`Chatbots`（可以使用自然语言与人类用户对话的软件应用程序）允许经理自动化客户或员工互动，例如回答常见问题或安排预约。另一个例子是预测市场，它是利用网络智能预测未来事件的极佳工具。21\
  \ 世纪 50 年代对其可能性曾有过一段乐观时期，但在精确性和可靠性较低时，这种热情消灭了。由于人工智能的最新突破，现在除了众包外，还采用了复杂的人工智能方法。但这并没有排除人工智能在不久的将来使大众智慧过时的可能性。这是因为每个交易市场的业务都会进行自己的研究以做出明智推测；因此预测市场通常比普通调查或博彩指数更准确。\n\
  \n\n\n\n\n支持加密货币领域的区块链技术为预测市场领域带来了新的维度，因为加密货币领域正以破坏性的方式进入金融和社会主流市场（Kaal, 2021）。区块链技术为构建不受单一实体或操作者控制的去中心化预测市场铺平了道路。智能合约通常用于调解不同交易者之间的赌注，并通过复杂的投票系统确定最终结论。加密货币预测市场是\
  \ DeFi 系统，允许任何人对事件结果进行交易，而不受身份、位置或国籍等任意标准的限制（Brito et al., 2014）。这是通过使用智能合约实现的，智能合约一旦满足特定标准，就会自主运行，无需中央化机构的参与。例如，`Augur`\
  \ 是一个基于 `Ethereum` 并遵循 `ERC-20` 标准的去中心化预测市场。`Augur` 是加密货币预测领域的先驱系统，承诺要实现银行服务的“民主化”，开发始于\
  \ 2014 年。`Augur` 的初始版本于 2018 年 7 月向公众发布。它是一个用户生成的市场，任何用户支付少量费用即可为任何现实事件创建一个市场。事件设计者决定事件的价格（范围从\
  \ 0% 到 50% 不等），并从交易费中获。\n\n`Endor` 等加密货币交易公司和 `CryptoHawk.ai` 等平台正在利用 AI 的能力为用户提供加密货币洞察。`Endor`\
  \ 自誉为“预测分析领域的 Google”。`Endor` 的协议确保小额交易者在不进行自身深入研究的情况下获取关键市场数据。此外，该公司还使用与用户活动相关的数据并将其循环回到模型中，以优化模型以实现准确预测。同样，`CryptoHawk.ai`\
  \ 是一个针对 `Bitcoin` 和 `Ethereum` 交易者的人智能平台。该平台通过深度学习和 AI 分析大数据，以寻找关键模式、做出更好的决策并进行精确预测。投资者可以通过简化选择、减少不确定性风险以及利用市场波动来做出明智投资。\n\
  \n## 零知识证明\n\n我们数字时代创新和发展的主要领域之一是网络安全。随着区块链技术的发展，建立用户信任和保护隐私的挑战仍然存在。如今，如果某人的信息被泄露，由于黑客技术的现代进步，私钥或密码可能无法识别其身份。为了在加密世界中保持数据的机密性，可以使用一种名为零知识证明（`ZKPs`）的旧有技术来确保数字交易的安全性（Sun\
  \ et al., 2021）。`ZKP` 是一种加密方法，可用于测试证明者在不泄露任何隐私交易数据的情况下，在区块链环境中是否拥有足够的交易金额（Li et\
  \ al., 2020）。\n\n`ZKPs` 通过评估松散且无关紧要的数据片段，从数学上证明整个数据集的存在具有高度合理性，这与检查、加密并发送整段数据的传统密码学方法形成对比（Yang\
  \ & Li, 2020）。`ZKPs` 通过要求传输少量、不重要的信息位，阻止恶意第三方拦截任何有价值的内容。应用 `ZKPs` 必须满足三个条件：\n\n\
  - **完备性 (Completeness)**：验证者必须确认证明者声称拥有的整个数据集合的存在。\n- **可靠壮性 (Soundness)**：在没有必要数据的情况下，验证者用于验证证明者主张的挑战无法完成。\n\
  - **零知识性 (Zero-Knowledge)**：证明者和验证者都不能泄露任何真实的隐私信息。\n\n根据证明者与验证者之间进行 `ZKP` 所需的通信程度，可以使用两种替代协议类型。交互式\
  \ `ZKPs` 和非交互式 `ZKPs` 是 `ZKPs` 的两种类型。在交互式 `ZKPs` 中，证明者必须完成验证者提出的挑战，以赢得验证者对其秘密信息准确性和真实性的信任（Martín-Fernández\
  \ et al., 2016).在证明者满足证明条件之前，双方在验证过程中会交换信息。然而，在非交互式 `ZKPs` 中，根据证明者的承诺，模拟验证者将提出问题供证明者完成（Li\
  \ et al., 2020）。此外，与交互式 `ZKPs` 相比，非交互式 `ZKPs` 采用自动机制而非人工来验证证明者的主张。因此，这些这些 `ZKPs`\
  \ 需要更多的软件和处理能力。此外，加密货币应用程序经常使用非交互式 `ZKPs`，使用户在双方不进行直接通信的情况下进行交易。\n\n## Zcash 与 ZKPs\n\
  \n`Zcash` 使用 `zk-SNARKs`（零知识简洁非交互式知识证明）来证明交易已满足要求，而不泄露有关涉及地址或金额的任何重要细节（Banerjee\
  \ et al., 2020）。`zk-SNARKs` 指一种证明构造方法，人们可以证明拥有了某些信息（如私钥），而不泄露该知识，且不以任何方式涉及证明者或验证者（Pinto,\
  \ 2020）。`zk-SNARKs` 的许多潜在用途之一是在 `Zcash` 中创建保护交易（shielded transactions）。在保护交易中，发送者创建证明以证明：\n\
  \n- 对于每个受保护的转账，输出值之和等于输入值。\n- 发送者证明其拥有输入备注的私钥花费密钥，从而获得花费权。\n- 输入备注的私钥花费密钥在加密上与整个交易的签名相关联，使得不知道这些私钥的人无法更改交易。\n\
  \n然而，理论上 `zk-SNARK` 可用于验证任何关系，而不披露输入或暴露数据。为了使 `Zcash` 具有零知识隐私，根据网络共识规则评估交易是否有效的函数必须返回交易是否有效的结果，而不披露用于计算的任何数据。这是通过将网络部分共识规则编码到\
  \ `zk-SNARKs` 中实现的。从高层面上，`zk-SNARKs` 的运行机制首先是将你需要证明的命题转换为关于拥有一组代数方程答案的等效形式。\n\n\
  ## 以太坊与 ZK-Rollups\n\n\n\n\nZk-Rollups 旨在加速交易并降低成本，允许用户使用零知识证明在第 2 层上验证以太坊交易，然后将有效性证明（PoV）广播到第\
  \ 1 层（Bruschi et al., 2022）。在第 2 层上所有转移的状态由 `ZK-rollup` 智能合约维护，且该状态只能通过有效性证明进行更改。这意味着\
  \ `ZK-rollups` 不需要全量交易数据，而只需要有效性证据。由于提供的数据较少，使用 `ZK-rollup` 验证区块速度更快且成本更低。`ZK-rollup`\
  \ 在资金从第 2 层移动到第 1 层之前对其进行验证，从而消除了延迟，这会被 `ZK-rollup` 合约接受（Garoffolo et al., 2020）。然而，有效性证明的计算成本很高，对于链上活动有限的应用来说并不划算。\n\
  \n# 现代技术在去中心化金融中的应用\n\n区块链作为一种实现框架的出现，产生了一种观点，即大多数业务模型都可以实现去中心化。之前的资本市场、银行业和金融服务是非常中心化的。通过互联网时代，全球金融市场已变得紧密相连。然而，它们仍然保持高度中心化，并依赖中央银行家和监管机构来维持正常运行，特别是在危机时期。相比之下，去中心化的业务模型依赖于用户网络或社区作为系统的治理主体（Kushwaha\
  \ et al., 2022）。作为回报，社区或网络成员可以从业务创造的价值中获得更高的报酬。激励和治理的去中心化与这些业务模型紧密相分，无论是去中心化的支付基础设施、贷款平台甚至是社交媒体平台。\n\
  \n这些业务模型中仍几个仍处于非常初期的阶段，特别侧重于为网络利益相关者创建一个平衡且可扩展的激励机制。在所有这些模型中，去中心化金融似乎在成熟为一个稳健案例方面领先了一步。DeFi\
  \ 应用可以涵盖如经济身份、了解你的客户（KYC）、贸易金融、汇款、贷款、保险、支付等多个用例。在 DeFi 的这些用例中，某些应用的状态比其他更成熟。尽管在\
  \ 2021/22 年宏观触发的熊市中遇到了一些小挫折，但这些去中心化金融系统在加密行业中的表现优于其中心化的对应品。\n\n去中心化金融系统运行在参与者网络决定并由智能合约执行的规则之上。这与传统金融系统形成对比，后者由中央银行设定政策，银行遵循并为零售客户服务。这意味着，任何危机情况将由参与者网络处理，而不是由中心化机构。这些去中心化系统使全球用户参与贷款、投资、支付、保险和其他若干活动。例如，来自北欧的参与者可以无缝地向巴西的农场提供小额贷款。比特没有国界，DeFi\
  \ 正利用这些原则运行。\n\n尽管如此，去中心化系统并不能逃避传统金融的监管。如果监管机构希望保护零售客户免受过度风险的影响，可以限制特定管辖区的参与者参与一个或多个\
  \ DeFi 解决方案。在 2022 年 Luna Terra 危机引发加密生态系统连环崩溃后，监管机构将对他们认为具有风险的去中心化金融方面采取严格措施（Tjahjana,\
  \ 2022）。结果是，我们可能会陷入“中心化-DeFi”的混合世界。由于去中心化的激励和治理与这些业务模型并密相随，无论是去中心化的支付基础设施、贷款平台……尽管这听起来像是一个悖论，这种中心化-DeFi\
  \ 的混合世界可能会出现以改变未来的金融服务。\n\n# 以太坊区块链：世界计算机\n\n以太坊区块链与比特币占据了加密货币市值的 60% 以上。虽然比特币被视为价值存储，以太坊被认为是新时代的\
  \ TCP/IP。与比特币不同，以太坊在过去几年中作为协议层实现了去中心化金融、非同质化代币、游戏、社交媒体甚至是元宇宙等应用（Ferretti & D'Angelo,\
  \ 2020）。在所有这些模型中，DeFi 领域或许是最成熟的。\n\n第一波 DeFi 很大程度上依赖以太坊区块链，如 `Uniswap` 和 `Compound`\
  \ 等应用开始扩展。生态系统的健康状况由锁仓总量（TVL）指标来代表（Stepanova & Eriņš, 2021）。这识别了 DeFi 平台处理的资金总和。基于以太坊的应用\
  \ TVL 在 2021 年飙升。在 2021 年 11 月达到顶点时，TVL 接近 1600 亿美元。尽管以太坊网络收取高昂的 Gas 费，增长依然存在。在此期间，若干层\
  \ 1 协议作为以太坊的竞争者出现。著名的有 `Solana`、`Avalanche` 和 `Near`。\n\n尽管存在竞争，以太坊拥有先发优势和社区能够带来的网络效应。凭借网络多年来建立的开发者基础，出现了新的\
  \ DeFi 应用正在发布并获得了机构风险投资者的资金。以太坊虚拟机（EVM）环境是大多数开发者在链上进行构建的关键催化剂（Ma et al., 2021）。竞争对手必须创建与\
  \ `EVM` 的兼容性，以确保他们不会错过以太坊所掌控的用户群。DeFi 生态系统中的关键名称如下：\n\n* `Uniswap`：去中心化加密货币交易所；\n\
  * `Lido`：流动质押；\n* `Aave`：贷款平台；\n* `Yearn Finance`：收益聚合；\n* `DyDX`：衍生品；\n* `Armor`：保险。\n\
  \n这绝非基于以太坊的 DeFi 应用的详尽列表。这些应用中的每一个在 2021 年第四季度都单独管理了数百万美元到数十亿美元的 TVL。许多应用还得到了聪明资金的支持，像\
  \ `A16Z` 这样的投资者已向其投入数十亿美元。随着这一应用层扩展其用户群，以太坊区块链受益于网络效应。\n\n\n\n以太坊在 2022 年 9 月完成从工作证明（Proof\
  \ of Work）机制向权益证明（Proof of Stake）的迁移应该会让 ESG 投资者感到高兴，因为该链的能量足迹将大幅减少。许多由于 ESG 原则而无法投资比特币和以太坊等蓝筹加密货币的机构投资者，将不再受到这些限制。除了投资角度外，“合并”（Merge）将使以太坊更具通缩性。经济模型也正在升级，以激励执行某些交易的用户。这类似于信用卡用户获得可以在其他地方使用的积分或\
  \ Avios 航空里程。预计这将进一步增加该链的使用率。\n\n因此，以太坊是一个去中心化且符合 ESG 标准的区块链，拥有基于 EVM 的开发者友好型生态系统，以及不断增长的相互交互应用程序套件。尽管所有这些组件汇聚在一起，以太坊并非没有挑战。即将到来的合并并不能解决\
  \ 2021 年尤为严重的高 Gas 费用问题。随着 Solana 和 Avalanche 等其他链作为生态系统日益成熟，开发者和用户将由于极低的交易成本和高交易吞吐量开始拥抱这些平台。以太坊团队正在研究分片技术以解决这些基础设施问题，但它们似乎是中期解决方案。然而，不言说，以太坊已经证明了其作为未来网络层的能力。它展现了潜力，其面临的挑战正被生态系统解决。随着网络的增长，以太坊可能很快成为市值最大的加密货币，并在未来几年内市值上反超比特币。它确实是下一代的技术。\n\
  \n## 数字资产与澳大利亚证券交易所关于 CHESS 替代方案的合作\n\n2016 年，澳大利亚证券交易所（ASX）宣布其交易后平台将构建在区块链之上。该交易后平台被称为结算中心电子子注册登记系统（CHESS）平台，被计划作为金融服务领域区块链的首个工业级应用（Chen,\
  \ 2016）。区块链公司 Digital Asset 与 ASX 合作构建了 CHESS。在同意实施区块链之前，CHESS 系统已作为澳大利亚现金股票市场的核心结算和清算平台存在。然而，CHESS\
  \ 基于遗留技术，正逐渐趋于其生命周期的终点。这与区块链作为一种关键技术范式的兴起相吻合。ASX 的董事会和技术领导层希望确保下一版本的 CHESS 使用根本上优越且具有未来感的技术进行构建。虽然在机构环境中中使用区块链构建\
  \ CHESS 的决定被认为是一个风险，但该技术似乎已经降低了系统的复杂性。\n\n例如，遗留的 CHESS 系统使用了 522 个消息结构（Chen, 2016）。新系统通过映射和整合的过程将其减少到\
  \ 90 条消息。首次部署将是在 ASX 防火墙后的私有许可链区块链上进行。该解决方案的第一个原型于 2017 年 9 月发布，但从那以后正式应用程序的部署经历了多次延迟。该系统目前正在经历多次迭代测试，功能规范和预期已在项目文档中明确定义。CHESS\
  \ 平台正式上线的时间表设定为 2023 年 4 月，但即使是这一时间现在也预计会有进一步延迟。尽管存在这些插曲，随着这项技术以及使用该技术的工业实施不断改进和成熟，我们应该看到更多无缝的执行。\n\
  \n## RippleNet：面向金融机构的全球支付网络\n\n区块链技术的关键用例之一是金融交易和支付。随着金融科技（Fintech）的出现，跨境支付已变得变得基本无障碍且无缝。然而，对于零售和商业交易，国际支付和汇款仍然保持复杂。Ripple\
  \ 是其核心，一个支付网络。Ripple 由 Ryan Fugger 于 2004 年创立，并在 2012 年 Chris Larson、David Schwartz\
  \ 及其团队创建 `XRP` 账本时获得了其 Web3 身份（Reed-Woodard, 2018）。\n\n在此之前，传统金融服务行业使用全球银行间电讯协会（SWIFT）来处理交易，这仅仅是一个消息系统。对于零售和商业交易，国际支付和汇款仍然保持复杂。`SWIFT`\
  \ 在这些年来一直非常有效，但资金通过多次跳转才能到达的往来银行系统使其看起来像一个黑盒。\n\nRipple 针对了这一机构用例，并创建了比比特币更好的吞吐量的产品。得益于\
  \ `XRP` 账本共识协议（既不是工作证明也不是权益证明），该协议通常在五秒内生成区块。使用 Ripple 网络的银行可以作为验证者以确保交易达成共识。除了已实现的吞吐量外，Ripple\
  \ 还提供了按需流动性（ODL），允许交易双方无需预先注资交易。这在跨境和跨货币交易中特别有用。凭借提供有意义吞吐量的架构，并消除了汇款领域的运营开销，Ripple\
  \ 的商业增长前景广阔。\n\n尽管 Ripple 的执行能力看起来是顶尖的，但存在更广泛的生态系统挑战可能成为增长的阻力。Ripple 依赖于与银行基础设施合作来实现跨境汇款功能。但银行基础设施和运营流程效率低下，任何有意义的规模只能通过银行参与\
  \ Ripple 基础设施来实现。除了这些运营阻力外，Ripple 还受到了监管阻力的影响。美国证券证券交易委员会（SEC）于 2021 年起诉 Ripple，声称\
  \ Ripple 募集了 13 亿美元未注册为证券的数字资产（注：此处原文数字可能有误，按原文翻译）。这起诉讼对 `XRP` 代币产生了严重影响。加密生态系统的许多人认为，这是监管机构对大型加密公司攻击的开始。只有时间才能证明\
  \ Ripple 如何摆脱这些挑战并实现全球化。\n\n## Zoracles 协议：零知识证明预言机\n\n尽管经历了几个市场周期，传统银行业在几十年里一直是相当高效的。但全球金融服务是相互关联的，正如我们在\
  \ 2008 年危机期间所看到的。然而，国家内部的关键宏观决策通常是非常中心化的，并影响所有银行系统的公民。随着区块链技术和去中心化金融（DeFi）的出现，国界和监管机构的限制在很大程度上变得无关。因此，这是区块链用子领域一个预计比大多数其他领域更快成熟。在\
  \ 2018 年结束的比特币周期中，我们看到了几个加密交易所的兴起，但它们大多数是中心化的。但在 2021 年达到顶峰的上一个周期中，我们看到了多个 DeFi\
  \ 模型和经济体的出现。\n\n\n\n\n其中之一是 `Zoracles` 协议。Zora labs 领导了该协议后的工作，他们的征程使命是为 DeFi 运行的智能合约提供零知识预言机（zero\
  \ knowledge oracles）。他们关注的两个关键数据元素是价格数据和信用历史信息。在进一步理解这些用例之前，让我们简要回顾一下加密领域什么是“零知识”。零知识证明是一种加密技术，它允许在不泄露特定信息的情况下验证该信息的有效性（参见\
  \ Couteau et al., 2021 [Couteau 等人，2021]）。例如，A 方可能向 B 方证明他们拥有系统密码，而又不让 B 方知道密码是什么。这在我们需要数据隐私，同时又能无缝共享和传输数据时特别有用。\n\
  \n零知识预言机有助于处理整个 DeFi 领域中的机密数据。`Zoracles` 协议正是为了这一目标而开发的。`Zoracles` 的核心用例是消费者信用历史。因此，如果\
  \ DeFi 用户希望在平台上借贷，`Zoracles` 将以高水平的机密性向智能合约提供信用。随着 DeFi 用例扩展到汽车贷款、抵押贷款或其他任何形式的抵押贷款产品，`Zoracles`\
  \ 协议可以成为承保过程中的关键组件。它可以与信贷机构进行信用评分检查，并将信息传递给 DeFi 应用，然后由该应用做出决策。这一过程将以机密且安全的方式进行，以验证消费者的身份。凭借区块链的这些不同用例，特别是在去中心化金融领域，未来看起来充满光明。风险仍然存在，生态系统仍在从关键结构性和系统性问题中学习。但随着时间的推移，在稳健的风险管理实践以及安全高质量数据的指导下，DeFi\
  \ 很快将成为家喻户晓。\n\n# 讨论与未来工作\n\n由区块链、人工智能、机器学习（ML）等技术引领的开源运动被称为 DeFi。欢迎大家对 DeFi 协议和应用进行研究、分叉（fork）和创新。由于这种分层架构（所有协议共享相同的资产和主区块链），结合不同的协议来创建新的组合机会是可能的。在本章中，作者们介绍了\
  \ DeFi 的基础知识、彻底改变 DeFi 的技术，以及与面向用户的 DeFi 协议兴起相关的潜在应用。尽管运行在无许可区块链上的 DeFi 应用具有改变面向用户的金融服务的潜力，但使用这些应用程序仍然存在着重大风险（例如由于代码错误导致的失败）。因此，在向\
  \ DeFi 应用投入或分配资金之前，考虑参与这些应用的未来利益相关者应该分析并评估这些重大风险。\n\n本章发现以太坊区块链是去中心化金融的基础，而 `Bitcoin`\
  \ 是 DeFi 的第一个用例。从汇款到证券结算和交付，DeFi 具有改进金融交易和支付的潜力。对于未来的工作，对 DeFi 应用感兴趣的研究人员可以通过多种方式处理该主题，在之前对\
  \ DeFi 应用市场结构或治理代币问题等研究的基础上。\n\n## 结论\n\n去中心化金融应用，或“DeFi”，是一类构建在所有人可访问的无许可区块链上的新型开放金融应用。尽管信息系统和管理领域的学术界承认区块链技术的新颖性和潜在影响，但对\
  \ DeFi 的理论或实证研究仍然较少。作者在本章中在区块链及相关技术的理论框架内概念性地引入了“DeFi”（注：原文中存在大量文本重复，已在翻译中去重并保留核心含义）。\n\
