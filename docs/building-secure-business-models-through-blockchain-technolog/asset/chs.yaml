  \ |\n\n## 区块链技术的要素\n\n*   分布性：网络中遍布着大量的账本副本。每当添加新的交易或区块时，连接到网络的每个人都会获得一份新副本。尽管没有单一的机构来管理账本，但该系统的设计确保了所有用户都能访问相同的信息。\n\
  *   不可篡改性：源于区块链能够准确且按时间顺序记录交易。由于网络中的每个参与者都有自己的副本，因此要更改或删除已输入的交易，或添加尚未确认的信息是极其困难的，甚至是不可能的。要成功实现这一目标，需要同时对成千上万台甚至数十万台计算机进行协调良好的攻击，这在现实上是非常不可能的。\n\
  *   智能合约：一组预设的指令被称为“智能合约”，它们被上传到区块链上并自动执行。除了许多事物之外，智能合约还可以用于建立债券转移的条款，包括旅游保险的支付等。\n\
  \n\n\n\n\n像比特币 (Nakamoto, 2008) 和 Hyperledger (2015) 等区块链技术对传统的金融和商业服务产生了重大影响。根据\
  \ Peters 等 (2015) 的观点，区块链具有改变金融行业的能力。许多行业（如金融资产的清算与结算）可能会从区块链技术中受益。此外，Morini (2016)](978-1-6684-7808-0.ch007.xhtml#r11)\
  \ 和 Zheng 等 (2018) 显示区块链具有有效的业务应用，例如金融衍生品的抵押化，这可以降低成本和风险。随着 IBM 和 Microsoft Azure\
  \ (Azure, 2016) 等提供区块链即服务服务的推出，主要的软件公司也在特别关注区块链 (IBM, 2015)。\n\n## 资产管理\n\n负债风险管理、动态决策过程以及处理不断变化的法规，都是风险投资、私募股权、房地产基金和特殊市场部门必须改进的领域。共同基金和其他资产管理公司努力增加基金价值，但在后端，它们需要支持来从投资者处获取基金详情以及向其账户分配份额。区块链恰好实现了这一目标，并显著且无缝地减少了他们的工作。\n\
  \n区块链有助于管理资产和利益相关者。它允许：\n\n* 自动注资。\n* 数字资产和无无缝涉及利益相关者。\n* 数字或虚拟投资组合和持仓，以便快速进入市场、碎片化和持仓变现。\n\
  * 为了减少错误可能，将股东投票权和其他责任嵌入数字资产中。\n* 可自定义的交易和隐私设置。\n* 增加参与度和惩罚不良行为的激励机制。\n* 更好的投资者治理和透明度。\n\
  * 股权表效率。\n* 基金自动化。\n\n## 银行业\n\n银行的关键功能和重要方面是交易、贷款和抵押，并以支付为基础提供服务。这些服务大部分依赖于过时的程序才能继续运行。个人应该预见到其抵押贷款申请的处理和资金到位将花费\
  \ 30 到 60 天，而中小型机构应该预见到其申请将花费 60 到 90 天。银行和贷款行业将从区块链技术的实施中受益，因为其能够简化程序、降低交易方风险并加快交易的发行和结算。这使得以下情况成为可能：\n\
  \n* 使用 `KYC/AML` 数据和其他经过认证的文档实时验证金融文件，从而降低运营风险。\n* 网络化的用户行为和受监管的数据可以立即汇总，以向信用预测和信用评分市场提供信息。\n\
  * 通过使用自动化流程进行银团组建、承销和资金拨付（本金和利息支付），减少银团的时间、精力和费用。\n* 因为由于数字化使得实时资产管理、跟踪和监管控制执行成为可能，资产抵押变得更加容易。\n\
  \n## 保险行业\n\n财产和意外险的保险理赔可能需要很长时间的处理并且容易受到欺诈。此外，在线收取的保费需要无误地分配给保单人。区块链加速了数据验证、理赔处理和放付的时间。它有助于管理保单人数据库，将使系统能够：\n\
  \n* 通过整合经过认证的文档和 `KYC/AML` 数据，降低理赔风险并促进理赔评估。\n* 通过智能合约应用实现理赔处理的自动化。\n* 在特定风险发生时进行支付，允许参数化合约自动化。\n\
  * 保险付款的自动拨付。\n* 它平滑了开放市场上保单再保险的进展，超越了传统的经纪人系统和基于关系的系统，转向代币化的再保险市场。\n\n## 贸易融资\n\n\
  保护和增强贸易融资生命周期是区块链技术可以做的事情。它具有减少欺诈、人为错误和交易方风险的潜力，同时加快处理时间并降低资金需求。\n\n* 文件（如信用证和运单）可以数字化并认证，并且可以实时验证\
  \ `KYC/AML` 数据。\n* 为了减少结算时间，使资产数字化。\n* 通过数字化和共享安全网络实现的融资方法更加有效。\n* 开发一种适用于整个贸易生命周期范围的单一金融机制，以消除目前为不同阶段协商独立工具的做法。\n\
  \n## 促进合规\n\n商业和金融部门近期意识到了监管合规性。对于确保金融机构遵守所有相关法律、规则和条例至关重要。当一家公司跨国运营时，它面临着受不同司法管辖区规则约束的额外困难。以下是区块链提供的一些优势：\n\
  \n* 内置治理和合规功能的数字资产可以实现数据验证和报告自动化，便于监管监控，减少运营摩擦，并实时消除手动审计和其他程序中的人为错误。\n* 建立并执行激励机制以实现更好的网络管理。\n\
  \n## 股票市场的区块链\n\n为了获得这项技术的益处，Sebi 现在正采取预防措施，以便学习它在世界各地市场是如何被使用的。`NYSE` 和德意志证券交易所\
  \ (Deutsche Borse) 只是全球众多交易所和市场机构中的两个，它们已经发出了调查区块链技术潜在收益的意图。\n\n区块链可以跟踪证券贷款、回购、保证金融资和系统性风险。\n\
  \n区块链可以解决碎片化市场系统的互操作性、信任和透明度挑战。股票市场参与者如交易员、经纪人、监管机构和股票交易所由于中间机构、业务清算和监管流程，必须执行 3\
  \ 天以上的交易。区块链自动化和去中心化可以改进股票市场。它可以降低客户佣金支出并加速交易结算。\n\n该系统可用于清算，安全地自动化交易后处理，并简化贸易文件和证券所有权转移。智能合约将在每笔交易中实施法律和法规以登记交易，使区块链网络成为所有交易的监管机构。\n\
  \n## 全球支付与汇款\n\n全球支付和汇款由收取费用的中间机构处理。跨境汇款 200 美元需要 2-7 天，全球费用为 6.94%。费用、中间机构和银行限制了\
  \ 480 亿美元的汇款。区块链简化了支付和汇款，降低了结算成本。它允许：\n\n* 快速安全的零售支付。\n* 批发和证券交易的安全结算。\n* 快速国际支付。\n\
  * 中央银行与商业及独立银行之间的实时额结算。\n* 自动认证 `KYC/AML` 数据和交易历史以减少欺诈并促进实时认证。\n* 数字化监管审计。\n\n\n\
  \n\n\n*   它支持多种支付类型：代币法币、稳定币、加密货币。\n\n# 区块链技术的演变\n\n## 起始阶段\n\n| 图 3. 起始阶段 |\n|\
  \ --- |\n| ![Figure978-1-6684-7808-0.ch007.f03](img/ch007.f03.png) |\n| --- |\n\
  | *来源: [`www.naukri.com/learning/articles/evolution-of-blockchain-technology`](https://www.naukri.com/learning/articles/evolution-of-blockchain-technology)*\
  \ |\n\n### 1991\n区块链系统的开发可以追溯到 1991 年。当计算机科学家 `Stuart Haber` 和 `W. Scott Stornetta`\
  \ 需要一种简单的方法来存储数字文件的副本时，他们提出了云存储的想法。在未来，他们希望加强这些文件时间戳的完整性。不久后，他们发表了一篇概述了链链对区块进行加密的文章，旨在保护历史数据。\n\
  \n### 1992\n1992 年，他们将 `Merkle trees` 的概念引入其中。将较大量的文档编译成单个区块是有益的。因此，模型的效率得到了提高。1993\
  \ 年，一种名为 `Proof-of-Work`（`PoW`，工作量证明）的方法被提作为防止垃圾邮件和其他形式的网络滥用的用手段。\n\n### 2004\n\
  `RPoW` 由计算机科学家兼密码学专家 `Hal Finney` 于 2004 年创建（可重复工作量证明）。该系统使用工作量证明（`PoW`）令牌的不可变（或非同质化）的\
  \ `hash cash` 作为输入，生成一个可交易的 `RSA-signed` 令牌。最重要的是，该协议消除了双重花费的发生。因此，必须将 `RSA` 令牌的所有权详情继续存储在可靠的服务器上。在一个其他节点可以检查和维护文档完整性的分布式系统中也是如此。\n\
  \n### 2008\n随后，在 2008 年底，一位无名的 `Satoshi Nakamoto` 发布了一篇名为《比特币：点对点电子现金系统》的白皮书。他设计了一种仅使用软件的哈希货币\
  \ `Proof-of-Work`（`PoW`）技术。这与依赖计算机内置功能的 `RPoW` 不同。此外，比特币提出了“货币挖矿”的概念。它还保证了分布式网络中的节点可以验证彼此的交易。\n\
  \n### 2009\n被称为“矿工”的个人使用 `PoW` 算法获得比特币作为奖励。更令人印象的是，它已经通过了链中其他去中心化节点的验证。\n\n比特币的基础在\
  \ 2009 年 1 月 3 日奠定。`Satoshi Nakamoto` 因挖出第一个区块获得了 50 个比特币。此外，开采的第一个区块现在被称为“比特币的创世区块”。`Satoshi`\
  \ 于 2009 年 1 月 12 日向 `Hal Finny` 发送了 10 个比特币，标志着历史上首次比特币交易的发生。自 2009 年 10 月 31 日比特币交易所首次向公众开放以来，用比特币兑换法币已成为可能。\n\
  \n### 2012\n`Nakamoto` 还创立了 `Bitcoin Talk Forum` 来分享新闻。自 2009 年以来，比特币迅速扩张。比特币在 2012\
  \ 年突破了 250 美元。`Nakamoto` 将系统限制在 2100 万个比特币。已挖出的比特币超过 1800 万个。根据计算资源和挖掘速度，所有比特币将在\
  \ 2140 年之前挖完。\n\n目前尚不清楚是谁发现了这一重大发现。`Satoshi Nakamoto` 已经离开，并将他们的专业知识留给了计算机科学家和开发者。从那时起，全球已有多项基于区块链的应用程序发明被报道（https://www.naukri.com/learning/articles/evolution-of-blockchain-technology）。\n\
  \n## 区块链作为未来未来技术，尽管面临诸多挑战的增长（2013–2018 年）\n\n| 图 4. |\n| --- |\n| ![Figure978-1-6684-7808-0.ch007.f04](img/ch007.f04.png)\
  \ |\n| --- |\n| *来源: [`www.naukri.com/learning/articles/evolution-of-blockchain-technology`](https://www.naukri.com/learning/articles/evolution-of-blockchain-technology)*\
  \ |\n\n### 2013\n比特币在 2013 年率先发起了挑战传统经济思维的先锋。交易了价值超过 1 亿美元的比特币，即 1100 万个比特币。与之相反，比特币在泰国和中国是非法的。\n\
  \n与此同时，对比特币的信心得到了恢复，其价格达到了 1,164 美元。随后，《比特币杂志》的联合创始人 `Vitalik Buterin` 表示需要一种脚本语言来构建去中心化应用。尽管他的提议遭到了反对，但他还是开始构建一个新的由区块链驱动的分布式计算平台，命名为\
  \ `Ethereum`（以太坊）。\n\n### 2014\n`Vitalik Buterin` 于 2014 年推出了 `Ethereum Foundation`。以太坊已经变得不仅仅是货币或去中心化网络。\n\
  \n区块链最广泛用途之一是“智能合约”概念，它首次出现在 2015 年。供参考，智能合约是构建在 `Ethereum` 区块链上的自动执行程序。它们在满足某些标准时生效。许多程序员已经加入了由智能合约开发（或\
  \ `Dapps`）所实现的去中心化应用实验中。\n\n随后，`Linux Foundation` 发布了 `Hyperledger`。这是一项旨在促进去中心化开发的开源倡议。\n\
  \n### 2016\n到 2016 年，区块链已不仅仅是加密货币了。\n\n*   英格兰银行调查了区块链结算。随后，欧洲中央银行（`ECB`）和日本银行建立了区块链研究。\n\
  *   `IBM` 的区块链即服务（`BaaS`）概念具有前瞻性。\n*   `R3` 引入了 `Corda`。Corda 是一个仅限金融服务的许可型分布式平台。在这里，只有交易双方可以决定。`Corda`\
  \ 和 `Hyperledger` 缺乏原生加密货币。\n\n### 2017\n2017 年，区块链被《哈佛商业评论》誉为“基础性技术”。比特币价格几乎翻倍达到\
  \ 20,000 美元。\n\n*   比特币已获得美国官员的批准，可作为主流投资。\n*   比特币在日本被赋予官方货币地位。\n*   七家欧洲银行采取了形成数字商业联盟的第一步，以利用区块链构建交易平台。\n\
  \n### 2018\n2018 年的年初对于区块链技术感兴趣的人来说是一段艰难的时期。\n\n*   比特币价值跌至 3,800 美元。\n*   `Google`、`Facebook`\
  \ 和 `Twitter` 等大型科技公司禁止加密货币广告。\n*   加密货币交易在韩国是非法的。另一方面，他们披露了对区块链初创公司的重大投资。\n\n###\
  \ 2019–现在\n现在\n2019 年，世界各地的人开始像投资股市和基金等传统金融市场一样投资比特币和其他加密货币。\n\n| 图 5. |\n| ---\
  \ |\n| ![Figure978-1-6684-7808-0.ch007.f05](img/ch007.f05.png) |\n| --- |\n| *来源:\
  \ [`www.naukri.com/learning/articles/evolution-of-blockchain-technology`](https://www.naukri.com/learning/articles/evolution-of-blockchain-technology)*\
  \ |\n\n*   自从宣布名为 `Libra` 的自己的区块链加密货币以来，`Facebook` 展示了对该领域的兴趣。\n*   `Amazon Web\
  \ Services` (`AWS`) 随后在其云基础设施上推出了 `Amazon Blockchain` 服务。\n*   中国人民银行利用 `Blockchain`\
  \ 技术发行了债券，中国通过推出国家支持的数字货币走在了前面。\n\n\n\n\n\n*   直布罗陀的一家名为 `Gibraltar United` 的足球俱乐部在当年通过接受加密货币作为支付创造了历史。\n\
  *   到年底，通过区块链完成了近 45 亿笔交易。\n\n此外，几位专家对 `Libra` 的中心化主张表示怀疑。然而，随着 Facebook 现在进军加密货币领域，许多其他科技巨头和顶级风险投资机构已被震动起来。\n\
  \n## 2020 年\n\n2020 年，`Bitcoin` 的价格飙升至 30,000 美元，成为最有值的加密货币。金融科技巨头 `PayPal` 开始处理加密货币。\n\
  \n根据德勤 `Deloitte` 的《2020 全球区块链调查报告》，超过 40% 的受访者已将区块链应用于生产，而剩余的 55% 则计划将其视为未来的战略重点。`Ethereum`\
  \ 揭示了 `Ethereum 2.0` 的开发，以解决 Gas 费用问题和其他严重的限制。\n\n将区块链与人工智能 结合以优化公司流程的兴趣日益增长。\n\n\
  ## 2021 年\n\n`Bitcoin` 的价值在 2021 年达到 64,829.14 美元的顶点，随后跌至 35,000 美元。世界首富 `Elon Musk`\
  \ 在 3 月接受用 `Bitcoins` 购买 `Tesla` 汽车。由于环境担忧，他撤回了这一言论。\n\n萨尔瓦多让 `Bitcoin` 法币。此后，`NFTs`\
  \ 的巨大浪潮为开发者带来了巨大的收益。包括数字艺术、音乐、电影和收藏品在内的独特且可传输的数字资产都是 `NFTs`。著名的 NFT 平台 `Open Sea`\
  \ 为艺术家和交易者提供了一个舞台。区块链、`AR/VR` 和 `web3` 创建了 `Metaverse`。虚拟世界的构建受到了新冠肺炎的启发。\n\n##\
  \ 2022 年\n\n`NFTs` 和 `Metaverse` 在 2022 年流行起来。这增加了交易选择和收益。`Nike`、`Adidas`、`Walmart`、`Puma`、`Gucci`、`Ferrari`\
  \ 和 `Disney` 使用元宇宙来营销他们的虚拟 `NFT` 设计。\n\n印度对数字资产交易征收 30% 的税收。这在该国是非合法的。其他的区块链用例正在测试和发布。用于太空卫星通信的智能合约、供应链、娱乐、医疗、交通、房地产及许多其他行业的区块链。由于俄乌战争局势紧张，`Bitcoin`\
  \ 社区帮助了受伤的乌克兰士兵和平民。\n\n## 区块链的演变\n\n尽管区块链技术的演进始于 1991 年，但它通过各种其他概念和技术的贡献才变成了现今的技术。同样，`Merkle\
  \ Trees`（默克尔树）的概念有助于在单个区块中收集大量文档。`Proof of Work`（工作量证明）机制有助于防止垃圾邮件和其他网络相关的滥用。2004\
  \ 年，计算机科学家 `Hal Finney` 开发了 `RPoW`（可重用工作量证明），对于可传输的 `RSA` 签名令牌非常有用，这是一种解决双重花费问题的非交换性代币。\n\
  \n2008 年，区块链技术演进最重要的一步是以《比特币：点对点电子现金系统》白皮书的形式提出的，由匿名人士 `Satoshi Nakamoto` 发布。该系统引入了货币挖掘的概念，引发了全球范围内对区块链技术使用的讨论。\n\
  \n直到 2013 年，世界各国经济体开始禁止加密货币交易，因为在某种程度上这违反了任何个人矿工可以在不受该经济体中央银行控制的情况下开发货币的规则。这引发了关于平行经济、黑钱和货币估值的讨论，正如许多传统经济概念被任何国家的政府所容忍的一样。\n\
  \n## 新的范式信任\n\n2016 年后，经过了近十年的长期辩论，社会上的一些人理解了区块链技术可以用于先进的技术交易。人们开始对区块链技术及其广泛应用产生信任，以下是此类认可的列表：\n\
  \n1. 英国中央银行 `Bank of England` 正在研究在银行实时全额结算系统中使用区块链技术，这可以缩短交易的结算时间，同时让中央银行能够在不依赖银行提供的报告的情况下监控所有支付系统的交易。这将导致交易的快速结算，而且数据冗余或任何管理不当的情况都无法被隐藏。\n\
  2. 欧洲中央银行 `European central bank` 正在研究数字货币或 `digital euro`，它不会取代现金，但将为用户提供另一种支付选择。七家欧洲银行组成了一个数字贸易链财团，创建一个基于区块链技术的交易平台。\n\
  3. 日本是少数采用区块链技术的国家之一。2017 年，日本政府通过了一项法律，将 `bitcoin` 视为合法货币。日本金融厅 `Japanese Financial\
  \ Services Agency` 接受将数字货币作为实际资产。\n4. 像 `IBM` 等美国公司开始提供其基于云的“区块链即服务” (`Baas`) 解决方案，`R3`\
  \ 宣布了一种名为 `Corda` 的新分布式技术，`Facebook` 宣布了他们名为 `libra` 的加密货币，亚马逊云服务 `Amazon web services`\
  \ 在其云平台上推出了 `amazon blockchain services`，其他跨国公司也开始对区块链技术表现兴趣。\n5. 中国最初宣布对比加密矿进行限制，但随后随着引入区块链工业框架，开始研究分布式网络的使用。中国开发了自身的智能合约程序，如\
  \ `TRON`、`NEO`、`VeChain` 和 `Qtum`。\n6. 名为 `Zug` 的瑞士小镇以著名的 `Ethereum` 网络的所在地而闻名。瑞士的这个小镇拥有\
  \ 450 多家基于区块链的企业。瑞士议会推荐 `bitcoin` 作为新型货币。他们很快将制定金融领域使用区块链技术的友好准则。\n7. 2018 年，南非储备银行\
  \ `SARB` 使用 `Quorum` 启动了名为“Khoka”的区块链项目，得到了该国 7 家不同银行的帮助。这些银行创建了一个可以在完全透明的基础上处理实时结算的行间框架。该项目的成功支持他们启动了第二阶段的“Khoka”，成员银行将使用\
  \ `wToken`（批发数字结算代币）购买债务工具。\n8. 巴哈马银行 `Bahamas` 开发了名为“沙美元”的 `CBDC`，旨在创建一个安全透明的金融框架。2020\
  \ 年 10 月，它成为第一个上行的中央银行数字货币。\n9. 智利政府是最早在能源部门应用区块链技术的机构之一。为了提高透明问责制，政府利用 `Ethereum`\
  \ 区块链记录数据并监控金融交易。该研究的结果将落实在该国的多个领域。\n10. 澳大利亚人口最多的州之一 `Queensland` 允许在旅游业中使用加密货币支付以促进该州的旅游业。旅游业是该州最大的经济动力。\n\
  \n印度与区块链技术\n\n区块链市场增长非常迅速，世界每个国家都在努力寻找区块链技术在自身经济中的有用应用。许多实例证明，世界上每个国家都在寻找控制这种先进技术的方法。\n\
  \n\n\n\n\n近年来，`blockchain` 在印度引起了巨大的关注。许多银行和企业巨头已经在各种用例中对这项技术进行了测试。由于 `blockchain`\
  \ 仍处于起步阶段，因此需要在跨业务和各种用例中对其进行研究。但印度区块链章节的内容比表面看到的要丰富。持续的 `blockchain` 采用需要一个拥有丰富知识、能力并渴望参与这一新范式转移的大型人力资本基础。印度在利用\
  \ `blockchain` 技术方面既有机遇也面临挑战。\n\n| 图 6. 金融服务业中的区块链用例 |\n| --- |\n| ![Figure978-1-6684-7808-0.ch007.f06](img/ch007.f06.png)\
  \ |\n| --- |\n| 图 7. 非金融服务业中的区块链用例 |\n| --- |\n| ![Figure978-1-6684-7808-0.ch007.f07](img/ch007.f07.png)\
  \ |\n| --- |\n\n推动印度 `blockchain` 采用的因素之一是数字化。在过去的十年里，印度成功开发了基础数字基础设施，以支持如 `Aadhaar`、`UPI`、`e-Sign`\
  \ 和 `Digilocker` 等私营部门应用，以及如 `GSTN` 等数字化税务治理网络，或数字化医疗保健计划如 `Pradhan Mantri Jan Arogya\
  \ Yojana` (`PM-JAY`)。这些目前为我们探索在其他部门领域使用这项技术提供了坚实的基础。\n\n`blockchain` 技术有广泛的实际用途。它可以为更高效地解决企业问题引入一种新颖策略。许多企业已经采用了该策略，考虑到印度信息技术行业的未来目标，这种采用程度预计还将增加。印度不仅在技术开发方面获得了国际援助，许多其他国家也是如此。根据工业内部贸易促进局的报告，该国技术行业的快速发展导致\
  \ 2020-21 年计算机软硬件的外国直接投资（`FDI`）增长了三倍。预计该行业在 2019–20 年将引入 76.7 亿美元的 `FDI`，高于 2018–19\
  \ 年的 64.1 亿美元。计算机硬件和软件约占市场的 43%。\n\n表 1. 印度前 10 大区块链初创公司\n\n| 序号 || 初创公司名称 |\n|\
