    learning that make the use of neural network for representation learning. A bottleneck
    in the network is imposed to force a compressed knowledge from the original input.
    An autoencoder model can be achieved by balancing the sensitivity of the input
    for accurate reconstruction build up and to avoid content overfitting. For most
    cases, a loss function well being constructed with the term encouraging for input
    sensitivity and by discouraging memorization of input data, for example adding
