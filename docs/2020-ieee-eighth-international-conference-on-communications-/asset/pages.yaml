    (AC) metrics are used.


    | Precision | TP / (TP + FP) | (6) |

    | Recall | TP / (TP + FN) | (7) |

    | F - measure | 2 * (Precision * Recall) / (Precision + Recall) | (8) |

    | Accuracy | TP / (TP + FP + FN) | (9) |


    training dataset. This is for the purpose of allowing it to capture the nature
    of normal traffic and to minimize the squared error between input and output.
    Preventing the autoencoder from simply copying the input to the output and overfitting
    the data regularization constraints are enforced. Model architecture details are
    as shown in Fig. 4 and the parameter used for the model depicted in TABLE II.


    ![](img/623a4dd23f7cdf61607faab1933bf4d3_3_1.png)


    These metrics are calculated using different formulas, true positive (TP), true
    negative (TN), false positive (FP) and false negative (FN):


    +   * TP: the number of anomaly records correctly classified.

    * TN: the number of normal records correctly classified.

    * FP: the number of normal records incorrectly classified.

    * FN: the number of anomaly records incorrectly classified


