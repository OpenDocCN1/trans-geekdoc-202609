    # V. SDN Controller Performance


    In this section, we evaluate the effect of the AERF on the SDN network performance.
    The evaluation test is described in the first part and then the network performance
    evaluation is presented.


    # A. Experimental Setup


    The AERF is implemented as an application in Python language a Ryu controller.
    Bbench is a standard tool used for evaluating SDN controller performance under
    two running nodes, throughput and latency. The throughput mode computes the maximum
    number of packets handled by the controller and latency mode the time need to
    process a single flow by the controller. We run experiments on a virtual machine
    having an Intel(R) Xeon(R) E3-1235.v3 with 5 cores and 8GB of RAM. The operation
    performance is tested with a different number of OpenFlow switches computed by
    Bbench. The controller stand-alone Ryu controller is considered as a baseline
    for our evaluation.


    ![](img/623a4dd23f7cdf61607faab1933bf4d3_4_1.png)


    The response rate of the controller for both the baseline and AERF evaluation
    is as in Fig. 7. The autoencoder achieved a slight decrease when the number of
    switches increases. Although the decreased, comparison with the baseline-alone
    Ryu controller is not much different and still acceptable.


    An interesting observation about the Ryu controller has a negligible impact on
    its latency performance as shown in Fig. 9. When we increase the number of connected
    switches, the latency achieved are between 3 to 4 ms and not much so


