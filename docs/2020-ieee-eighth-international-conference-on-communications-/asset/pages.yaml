    # II. RELATED WORK


    Author of [4] proposed a deep learning for flow anomaly detection in the SDN environment.
    A Deep Neural Network was introduced with 3 layers to perform binary classification
    with basic feature selection from the NS-KOD dataset. The accuracy was 75.75%.
    In [5] proposed a non-symmetric deep autoencoder (NSDAE) model for intrusion detection
    and 5-class classification of 85.42% with NS-KOD while [7] adopted big data visualization
    and statistical analysis method with the combination of autoencoder for threat
    detection. The accuracy reported from the approach achieved up to 87% accuracy.


    focus on the attack with enrichment of machine learning benefits. The functionality
    of the main components are presented as:


    +   * a) Assembly Module: Collecting traffic information of the SDN network. Data
    will be assembled as input for the controller to take packet actions. Utilizing
    Openflow protocol which periodically sends an Openflow request message to all
    Open connected switches. Managed switches will return back to the message that
    contains traffic statistics.


    +   * b) Adaptive Module: Proposed intrusion detection using AEF will be deployed
    and attack traffic will be detected by the controller using learning functionality
    in the adaptive ML module.


    Increased accuracy of detection in a similar approach of deep learning has shown
    a good achievement and yet is still for improvement. High congestion times, multi-layered
    complex processing, inconsistent performance are examples of deficiencies that
    can be improved. Improving with model optimization which related to the process
    of training, controlling loss and controlling activation of functions are still
    needed and can be improved especially in intrusion detection mechanisms. The work
    presented in this paper is focusing on further analyzing the optimization process
    and which it can contribute to the current knowledge of intrusion detection in
    the SDN environment.


