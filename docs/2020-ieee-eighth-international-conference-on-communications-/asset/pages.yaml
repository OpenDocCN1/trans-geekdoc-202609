    **Abstract**—Security is still a major challenge for communication networks. Recent
    advances in networking, notably the advent of Software Defined Networks (SDN)
    has brought major potential in providing highly secure communication networks.
    SDN decouples the data and control planes, maintaining a centralised and global
    view of the whole network. This has resulted in enabling proactive, robust and
    secure networks. In particular, mapping SDN capabilities to deep learning methods
    has recently attracted much research interest. Most efforts have been just a simple
    mapping of earlier solutions to SDN security based on deep learning in a purely
    native SDN environment, where a Deep Learning intrusion detection module is tailored
    to SDN with the least overhead. We propose a novel deep learning-based approach
    for intrusion detection in SDNs. The experimental results show that the proposed
    model can achieve high accuracy with a minimum number of selected features, low
    latency and a minimum overhead on the SDN controller performance, while yielding
    satisfactory detection.


    can oversee and falsify network management information, implementation attack,
    becoming a perpetrator in in-the-middle attacks and so on. Therefore, it is important
    to adopt a defense mechanism for securing SDN by vulnerability analysis and improving
    trust in traffic handling.


    One of the proposed solutions for detecting such intrusion is the use of intrusion
    detection systems (IDS). There are two types of IDS which are signature-based
    and anomaly detection based. The first type of IDS depends on the pre-identified
    signature of an intrusion that has been detected before the second type of IDS
    observed the traffic that deviates from normal and detects anomalous behavior.
    Abnormal detection providing a high level of security in areas such as control,
    authentication, malicious outbreak detection and has resulted by adapting deep
    learning capabilities for traffic classification either normal or via the use
    of the Naive Bayes classifier, Support Vector Machine, K-nearest Neighbor, Recurrent
    Network, Recurrent Neural Network, Deep Neural Network and others [3] [4]. Reinforcement
    learning particularly also being embedded in the case of unlabeled data. With
    rapid advancement and additional capabilities provided by SDN architecture, research
    of machine learning has become to improve network intrusion detection.


    I. INTRODUCTION


    In recent years, SDN has become widely popular and also to practice in network
    management especially with regards to newly evolved network security challenges.
    SDN decouples the control and data planes, maintaining a generalised and global
    view of the whole network. However, the separation of control and data planes
    makes SDN vulnerable to security attacks. Several main challenges directly based
    on unauthorized access, data leakage, data modification, compromised application,
    denial of services (DoS), configuration and system-level SDN security. One example
    of the concerning issue is related to Distributed-of-service (DDoS) DDoS attacks
    have become a real threat for network, digital and cyber infrastructure. The magnitude
    of disruptions can be driven by the variety of attack methods, and the main objective
    of DDoS attacks is to paralyze network by bombarding illegitimate traffic to targeted
    servers, network links or devices [1]. Another example is that


