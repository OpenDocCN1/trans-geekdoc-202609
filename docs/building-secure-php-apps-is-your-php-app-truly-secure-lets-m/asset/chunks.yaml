    \ 3   function($year, $month) {\n 4 \n 5 \tcheck user access\n 6 \t$userModel\
    \ = new UserModel;\n 7 \t$user = $userModel->current();\n 8 \n 9 \tcheck to make\
    \ sure the user is logged in\n10 \t//and a member of accounting\n11 \tif ($user\
    \ === FALSE || in_array('accounting', $us\\\n12 er->groups) === FALSE) {\n13 \t\
    \  //please add a legit error message\n14 \t  die('Not Authorized');\n15 \t}\n\
    16 \n17 \t//the user has access, let's read the file\n18 \t$directory = __DIR__\
    \ . '../uploads/acct/stmnts/';\n19 \t$filename  = (int) substr($year, 0, 4)  .\n\
    20 \t             (int) substr($month, 0, 2) .\n21 \t             '.pdf';\n22\
    \ \n23 \t//error handling for invalid files\n24 \n25 \t//open the file\n26 \t\
    $fileHandle = fopen($directory . $filename, 'r');\n27 \n28 \t//read the file and\
    \ close it\n29 \t$fileContents = fread($fileHandle);\n30 \tfclose($fileHandle);\n\
    31 \n32 \t//send the appropriate headers\n33 \theader('Content-type: application/pdf');\n\
    34 \theader('Content-Disposition: inline; filename=\"' \\\n35 . $filename . '\"\
    ');\n36 \theader('Content-Length: ' . filesize($directory .\\\n37  $filename));\n\
    38 \theader('Expires: 0');\n39 \theader('Cache-Control: must-revalidate');\n40\
    \ \theader('Pragma: public');\n41 \n42 \t//echo the file contents to the browser\n\
    43 \techo $fileContents;\n44 \n45 });\n```\n\nThis prevents someone that shouldn’t\
    \ see this file from accessing it since it is outside of the web server and is\
    \ being checked against proper controls.\n\n### Recap\n\nWe’ve covered basic authentication,\
    \ proper access control through validation, and safe file handling. I hope you\
    \ find helpful while developing your next idea. Keep reading, cause we’re not\
    \ done yet. Remember, we’re done when I say we’re done!\n\n## Chapter 5 - Safe\
    \ Defaults, Cross Site Scripting, and Other Popular Hacks\n\nThis chapter is a\
    \ catch-all for attacks you need to protect against, so isn’t overarching. Try\
    \ to contain your disappointment.\n\n### Never Trust Yourself - Use Safe Defaults\n\
    \nOne of the core concepts of a secure system is safe defaults. Whenever possible\
    \ (and it’s usually possible), you should define variables, properties, etc.,\
    \ early with a safe default. A safe default means `NULL`, empty, or `FALSE` state.\
    \ When determining logic, the default should always be failure. For example, in\
    \ the earlier authentication I check if the password is correct. If it fails,\
    \ the function executes the default logic for non-positive result.\n\nLet’s look\
    \ at a basic example with form validation.\n\n```\n 1 Route::post('/signup', function()\n\
    \ 2 {\n3   //check for valid form\n4   if (Form::validate('signup') === TRUE)\
    \ {\n5     //process the form\n6   }\n7 \n8   //the default logic is failure\n\
    9   die('Invalid Form Data');\n10 });\n```\n\n### Never Trust Dynamic Typing.\
    \ It’s Not Your Friend.\n\nDynamic typing is a feature loved by newer programmers.\
    \ Dynamic typing means you don’t have to be so picky about types; you just get\
    \ close enough and it’ll work. The problem with this is it doesn’t always work\
    \ the way you’d expect.\n\nLet’s look at a classic example with a native PHP function\
    \ `stripos()`. The scenario is that you’re trying to figure out if the letter\
    \ `i` exists in the phrase `I am the one who knocks`.\n\n```\n 1 $phrase = 'I\
    \ am the one who knocks';\n 2 \n3 $letterExists = stripos($phrase, 'i');\n 4 \n\
    5 if ($letterExists != FALSE) {\n6   echo 'we should be here';\n7   return TRUE;\n\
    8 }\n9 \n10 echo \"we shouldn't be here, yet we are\";\n11 return FALSE;\n```\n\
    \nThe `stripos()` function returns the index of the match in the haystack string.\
    \ Since `i` is the first letter of the string, `strpos()` is returning `0`. Due\
    \ to dynamic typing, `!= FALSE` evaluates the same as `!= 0`. Now let’s fix this\
    \ with an explicit check using `!==` instead.\n\n```\n 1 $phrase = 'I am the one\
    \ who knocks';\n 2 \n3 $letterExists = stripos($phrase, 'i');\n 4 \n5 if ($letterExists\
    \ !== FALSE) {\n6   echo 'we should be here';\n7   return TRUE;\n8 }\n 9\n10 echo\
    \ \"we shouldn't be here, annnnnnd we aren't\";\n11 return FALSE;\n```\n\nAnother\
    \ lesser-known advantage to explicit checks is performance. Most of the time an\
    \ explicit check will be faster, since it doesn’t need typecasting. If you’re\
    \ ever curious about performance differences in PHP, I recommend checking out\
    \ [http://www.phpbench.com/.\n\n## Cross Site Scripting\n\nCross Site Scripting\
    \ (XSS) is the process of injecting malicious code into the target website. This\
    \ can be done in several ways, but the end result is the user’s browser runs unauthorized\
    \ code as themselves, within their current session.\n\n### Non-Persistent XSS\n\
    \nThis is the traditional type of XSS exploit. It involves injecting data into\
    \ a site and then guiding users to the malicious content.\n\nSay a page on your\
    \ site takes `?page_num=2&per_page=50` as query string parameters. If you do not\
    \ escape these parameters, an attacker could change their values to malicious\
    \ code. This code could take the user to a delete page, run JavaScript in their\
    \ browser, or any number of client side attacks.\n\nAfter injecting their malicious\
    \ code, the attacker somehow gets a user to visit the page. When the user arrives,\
    \ the application will verify their valid user session and execute the malicious\
    \ code. A user could even end up deleting their own account!\n\n### Persistent\
    \ XSS\n\nA persistent XSS exploit is an exploit stored permanently on the server.\
    \ For example, a social sharing site like Facebook allows users to save messages\
    \ and display them to other users. An attacker could store malicious code in a\
    \ Facebook post. If Facebook was not properly escaping this data when displaying\
    \ it back to other users, that code would be executed. So anyone that sees the\
    \ attacker’s status would be running this malicious code.\n\n### Attack Entry\
    \ Points\n\nI just mentioned a couple examples of XSS exploit entry points, but\
    \ those are not the only ones. Basically anywhere you take input from a user and\
    \ display it back on a web page is an opportunity for an attacker to exploit your\
    \ site.\n"
  trans: "\n\n我要再次强调这一点，因为它极其重要：在大多数情况下，模糊性并不能保护你免受任何合法的攻击。你不应该依赖它来确保安全。它仅仅让事情变得稍微难找一点手段。\n\
    \n## 安全文件处理\n\n回到我们最初的故事：如果你有提供给用户查看或下载的文档，你不能简单地对 `*.pdf` 文件设置访问控制。为什么呢？我知道你们会问这个问题。我是这里的叙述者，这倒很有帮助。\n\
    \n你需要做是将文件存储在服务器上，使其无法从你的 Web 服务器访问。这里有一个推荐的目录结构示例：\n\n```\napplication/\ncomposer.json\n\
    composer.lock\nhtdocs/\n    .htaccess\n    assets/\n    templates/\n    index.php\n\
    \    robots.txt\nuploads/\nworkers/\n```\n\n`htdocs/` 是 Apache（或你正在使用的任何 Web 服务器）为域名服务的位置。`uploads/`\
    \ 是你存储上传文档的地方。你也可以通过服务器的配置来实现。在 Apache 中，如果 `uploads` 目录位于 `htdocs` 树下，你可以对指向该目录的任何请求返回\
    \ 404 错误。\n\n在你的应用程序中实现这一点，你需要根据文档类型创建一个用于访问文档的端点。例如，你可能需要提供每月财务报表，但仅提供给“会计”组的用户。\n\
    \n在这里我们定义访问这些内容的端点。通过这个端点，我们将验证用户的访问级别、读取文件，最后使用适当的头部将其输出到浏览器。\n\n```\n 1 Route::get(\n\
    \ 2   '/accounting/statements/{year}/{month}',\n 3   function($year, $month) {\n\
    \ 4 \n5 \tcheck user access\n 6 \t$userModel = new UserModel;\n 7 \t$user = $userModel->current();\n\
    \ 8 \n9 \tcheck to make sure the user is logged in\n10 \t//and a member of accounting\n\
    11 \tif ($user === FALSE || in_array('accounting', $us\\\n12 er->groups) === FALSE)\
    \ {\n13 \t  //please add a legit error message\n14 \t  die('Not Authorized');\n\
    15 \t}\n16 \n17 \t//the user has access, let's read the file\n18 \t$directory\
    \ = __DIR__ . '../uploads/acct/stmnts/';\n19 \t$filename  = (int) substr($year,\
    \ 0, 4)  .\n20 \t             (int) substr($month, 0, 2) .\n21 \t            \
    \ '.pdf';\n22 \n23 \t//error handling for invalid files\n24 \n25 \t//open the\
    \ file\n26 \t$fileHandle = fopen($directory . $filename, 'r');\n27 \n28 \t//read\
    \ the file and close it\n29 \t$fileContents = fread($fileHandle);\n30 \tfclose($fileHandle);\n\
    31 \n32 \t//send the appropriate headers\n33 \theader('Content-type: application/pdf');\n\
    34 \theader('Content-Disposition: inline; filename=\"' \\\n35 . $filename . '\"\
    ');\n36 \theader('Content-Length: ' . filesize($directory .\\\n37  $filename));\n\
    38 \theader('Expires: 0');\n39 \theader('Cache-Control: must-revalidate');\n40\
    \ \theader('Pragma: public');\n41 \n42 \t//echo the file contents to the browser\n\
    43 \techo $fileContents;\n44 \n45 });\n```\n\n这防止了不应该看到此文件的人访问它，因为它位于 Web 服务器之外，并且经过了适当控制的检查。\n\
    \n### 总结\n\n我们涵盖了基本的身份验证、通过验证进行的妥当访问控制以及安全文件处理。我希望你在开发下一个想法时能发现这些有所帮助。继续读下去，因为我们还没有结束。记住，我说了结束了才算真的结束！\n\
    \n## 第 5 章 - 安全默认值、跨站脚本和其他常见的攻击手段\n\n本章是你需要防御的攻击的合集，因此并不具有概括性。请试着忍你的失望。\n\n###\
    \ 永远不要信任你自己 - 使用安全默认\n\n安全系统的核心概念之一是安全默认。只要可能（而且通常都是可能的），你就应该尽早定义变量、属性等，并赋予安全的默认值。安全默认意味着\
    \ `NULL`、空或 `FALSE` 状态。在确定逻辑时，默认值始终应该是失败。例如，在之前的身份验证中，我检查密码是否正确。如果失败，函数将执行针对非正结果的默认逻辑。\n\
    \n让我们来看一个表单验证的简单示例。\n\n```\n 1 Route::post('/signup', function()\n 2 {\n3   //check\
    \ for valid form\n4   if (Form::validate('signup') === TRUE) {\n5     //process\
    \ the form\n6   }\n7 \n8   //the default logic is failure\n9   die('Invalid Form\
    \ Data');\n10 });\n```\n\n### 永远不要信任动态类型。它不是你的朋友。\n\n动态类型是新程序员喜爱的特性。动态类型意味着你不需要对类型那么挑剔；只要足够接近它就能工作。此的问题在于，它并不总是按照你预期的方式工作。\n\
    \n让我们来看一个 PHP 原生函数 `stripos()` 的经典示例。场景是你尝试找出短语 `I am the one who knocks` 中是否存在字母\
    \ `i`。\n\n```\n 1 $phrase = 'I am the one who knocks';\n 2 \n3 $letterExists =\
    \ stripos($phrase, 'i');\n 4 \n5 if ($letterExists != FALSE) {\n6   echo 'we should\
    \ be here';\n7   return TRUE;\n8 }\n9 \n10 echo \"we shouldn't be here, yet we\
    \ are\";\n11 return FALSE;\n```\n\n`stripos()` 函数返回匹配项在字符串中的索引。由于 `i` 是字符串的第一个字母，`stripos()`\
    \ 返回 `0`。由于动态类型，`!= FALSE` 等同于 `0`。现在我们使用 `!==` 来修复这个问题。\n\n```\n 1 $phrase =\
    \ 'I am the one who knocks';\n 2 \n3 $letterExists = stripos($phrase, 'i');\n\
    \ 4 \n5 if ($letterExists !== FALSE) {\n6   echo 'we should be here';\n7   return\
    \ TRUE;\n8 }\n9\n10 echo \"we shouldn't be here, and we aren't\";\n```\n```\n\n\
    显式检查的另一个不为人知的优势是性能。大多数情况下，显式检查会更快，因为它不需要类型转换。如果你对 PHP 的性能差异感兴趣，我建议查看 [http://www.phpbench.com/]。\n\
    \n## 跨站脚本\n\n跨站脚本 (XSS) 是向目标网站注入恶意代码的过程。这可以通过多种方式实现，但最终结果是用户的浏览器在当前会话中以用户的身份运行未经代码。\n\
    \n### 非持久性 XSS\n\n这是传统的 XSS 攻击类型。它涉及向站点注入数据并引导用户访问恶意内容。\n\n假设你网站上的页面接收 `?page_num=2&per_page=50`\
    \ 作为查询字符串参数。如果你不对这些参数进行转义，攻击者可以将其值改为恶意代码。这些代码可以将用户带到删除页面、在他们的浏览器中运行 JavaScript\
    \ 或进行任何客户端攻击。\n\n在注入恶意代码后，攻击者通过某种方式让用户访问页面。当用户到达时，应用程序将验证其有效的用户会话并执行恶意代码。用户甚至可能删除自己的账户！\n\
    \n### 持久性 XSS\n\n持久性 XSS 攻击是永久存储在服务器上的攻击。例如，像 Facebook 这样的社交共享网站允许用户保存并向其他用户消息。攻击者可以将恶意代码存储在\
    \ Facebook 帖子中。如果 Facebook 在显示这些数据时没有对其进行适当转义，该代码就会被执行。因此，任何看到攻击者状态的人都会运行这段恶意代码。\n\
    \n### 攻击入口点\n\n我刚刚提到了两个 XSS 攻击入口点的示例，但这些并不是唯一的。基本上，任何从用户那里获取输入并将其显示在 Web 页面上的地方都是攻击者利用你网站的机会。\n\
    \n"
