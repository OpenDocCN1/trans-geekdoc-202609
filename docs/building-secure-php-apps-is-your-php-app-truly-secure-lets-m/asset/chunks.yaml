- raw: "Be sure to think about **all** places data enters your system, not just input\
    \ fields. For example, maybe you allow users to upload images and then re-display\
    \ the image XIFF data. Maybe you parse uploaded CSV files of various data exports\
    \ from external programs. Anywhere that you re-display information, it needs to\
    \ be protected.\n\n#### How To Protect Yourself\n\nThe fix for this is not very\
    \ difficult. First, never take data directly from a URL and echo it back to the\
    \ browser. The same goes for data from other sources, like your database or uploaded\
    \ files. To protect yourself, you simply need to escape data going into your database\
    \ and escape data being displayed back to your users.\n\nWe’ve already discussed\
    \ proper database escaping in [Chapter 1](#chap01.xhtml#chapter-1), so we’ll focus\
    \ on displaying data. PHP makes this very simple with the built-in function `htmlentities()`.\
    \ This function will properly handle the majority of data.\n\nLet’s see what this\
    \ looks like implemented. Your view file used to look like this:\n\n```\n1 <h1>Title</h1>\n\
    2 \n3 Hello <?=$name?>,\n```\n\nNow with the protection applied, it looks like\
    \ this:\n\n```\n1 <h1>Title</h1>\n2 \n3 Hello <?=htmlentities($name)?>\n```\n\n\
    If you want to stay DRY^([22](#chap06.xhtml#fn-dry)), you would probably abstract\
    \ this away into a view helper library. Most frameworks already include this in\
    \ their view or template libraries.\n\n### Cross Site Request Forgery\n\nCross\
    \ Site Request Forgery (CSRF) is basically the opposite of an XSS exploit. Where\
    \ XSS takes advantage of the user by means of a trusted web site, CSRF takes advantage\
    \ of the web site by means of a trusted user.\n\nAn example of this is an attacker\
    \ sending out fake emails with a link to delete a blog post, an email, or whatever.\
    \ The target user then clicks the link and arrives at a delete page. Since the\
    \ user is an administrator with a valid session, your application goes ahead and\
    \ deletes the record as requested. The user had no idea what the link was taking\
    \ them to and now their account has been deleted without their consent. Not cool.\n\
    \nThis doesn’t have to be a text link either; it is often attached to an image\
    \ or a button. This might sound like a small risk since most critical web site\
    \ functions are behind forms that expect POSTed data. But this can just as easily\
    \ be expanded upon to use a button or JavaScript to submit hidden forms.\n\n####\
    \ How To Protect Against It\n\nThe first step is to ensure no data-altering actions\
    \ are performed by GET requests. Anything that performs an action on data should\
    \ require a POST, PUT, or DELETE request. If the user clicks a delete button,\
    \ they should then be taken to a form used to confirm the action. If data-altering\
    \ actions need to be performed over GET (maybe for a RESTful API), you can require\
    \ a unique token in the query string. In the following examples we will be using\
    \ POST data but the exact same concepts apply when dealing with GET requests;\
    \ just set the token in the query string instead of in the POST parameters.\n\n\
    Now that you are submitting forms for your data manipulations, we will need to\
    \ add CSRF tokens to our forms. Our CSRF token will be a standard Nonce (Number\
    \ used Once). We will generate a random token, store it in the user’s session,\
    \ then add it as a hidden field to our form. Once the form is POSTed, we can check\
    \ the CSRF token against the one in the session to validate the request.\n\nFirst,\
    \ we’ll create a function to generate the token. This will usually be placed in\
    \ a universally callable place, maybe as a route filter, voter, or a helper library.\n\
    \n```\n 1 //assuming the rest of the form class here\n 2 \n 3 static function\
    \ generateCsrf()\n 4 {\n 5   $token = mcrypt_create_iv(\n 6     16,\n 7     MCRYPT_DEV_URANDOM\n\
    \ 8   );\n 9 \n10   Session::flash(\n11     'csrfToken',\n12     $token\n13  \
    \ );\n14 \n15   return $token;\n16 }\n```\n\nNote that we are using session flash\
    \ data here. Flash data will be stored to the session, but can only be accessed\
    \ on one request before it is destroyed. This concept is supported in most session\
    \ wrapping classes. This keeps our token from being valid on more than one request.\n\
    \nNext we’ll call this within our route closure and pass the token to the view\
    \ that is generating the form:\n\n```\n1 Route::get('/signup', function()\n2 {\n\
    3   $data['token'] = Form::generateCsrf();\n4 \n5   return View::render('signup.form',\
    \ $data);\n6 });\n```\n\nAnd now for our view, `signup/form.php`\n\n```\n 1 <form\
    \ method=\"POST\" action=\"/signup\">\n 2 \n 3   <label>\n 4 \tFirst Name:\n 5\
    \ \t<input type=\"text\" name=\"first_name\" />\n 6   </label>\n 7 \n 8   <label>\n\
    \ 9 \tLast Name:\n10 \t<input type=\"text\" name=\"last_name\" />\n11   </label>\n\
    12 \n13   <label>\n14 \tEmail:\n15 \t<input type=\"text\" name=\"email\" />\n\
    16   </label>\n17 \n18   <input type=\"hidden\" name=\"token\" value=\"<?=$tok\\\
    \n19 en?>\" />\n20 \n21   <input type=\"submit\" name=\"submit\" value=\"Signup\\\
    \n22 \" />\n23 \n24 </form>\n```\n\nWhen this form is POSTed we can now validate\
    \ the token:\n\n```\n 1 Route::post('/signup', function()\n 2 {\n 3   //this would\
    \ probably be abstracted away into\n 4   //a route filter or your form validation\n\
    \ 5   if ($_POST['token'] === Session::get('csrfToken'\\\n 6 )) {\n 7 \t//process\
    \ the form\n 8   }\n 9 \n10   //like earlier, you should add a\n11   //legit error\
    \ message here\n12   die('Invalid Form Data');\n13 });\n```\n\nNow that this token\
    \ checking is in place, if an attacker tricks a user into submitting a fake form,\
    \ the request will fail. The user will not have a matching CSRF token in their\
    \ session data for your website.\n\n### Multiple Form Submits\n\nAnother prolific\
    \ issue in PHP applications is multiple form submissions. A user submits a form\
    \ to perform some action â€” let’s say transferring 20 Bitcoins from one wallet\
    \ to another. The user clicks submit, but they don’t notice a change immediately,\
    \ so they click again. Now the user has inadvertently transferred 40 Bitcoins\
    \ instead of 20. Luckily for us, the CSRF token logic we just discussed will handle\
    \ this without any extra work. To prevent this in most situations, we just need\
    \ to pass a unique token, validate it, then clear it once processed.\n\n### Race\
    \ Conditions\n\nRace conditions are not super common in PHP, but are very hard\
    \ to debug once they occur. It is best to handle them before they happen. A race\
    \ condition is when multiple things are happening at once, causing unexpected\
    \ logic flow. The issue is when Block B executes before Block A, due to Block\
    \ A taking longer to perform.\n\nA basic example is two processes writing to the\
    \ same file. Without a transactional locking mechanism in place, data is susceptible\
    \ to corruption. If you expect Process A to be finished writing to a file before\
    \ Process B starts, data could be overwritten, written on top of other data, or\
    \ many other types of data corruption. With transactional locking in place, you\
    \ ensure Process A is finished writing to the file before allowing Process B to\
    \ write to the same file.\n\nThis example is very process-specific, but the main\
    \ concept of preventing race conditions is to make logic transactional where it\
    \ should be.\n\nAnother example is with database writes. To prevent race conditions\
    \ in the database, use transactions to apply certain database changes only if\
    \ all statements are successful.\n\nThe general concept is that if only one thing\
    \ is supposed to happen at a time, you should check to ensure that each step has\
    \ finished before proceeding to the next step.\n\n### Outdated Libraries / External\
    \ Programs\n\nAnother quick item to bring to your attention is outdated libraries.\
    \ The best way to ensure that your code stays safe is to keep all of your dependencies\
    \ up to date. No matter how secure the code you personally write is, all it takes\
    \ is a single security vulnerability in any library you use and your site can\
    \ be exploited."
