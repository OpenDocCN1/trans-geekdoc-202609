    \n## Constructor\n\nSeveral years ago I was writing a web application for a client\
    \ in the CodeIgniter PHP framework, *shudder*, but CodeIgniter didn’t include\
    \ any type of authentication system built in. I, of course, did what any good/lazy\
    \ developer would do and went on the hunt for a well made library to supply authentication\
    \ capabilities. To my chagrin I discovered that there weren’t any clean, concise\
    \ libraries that fit my needs for authentication in CodeIgniter. Thus began my\
    \ journey of creating Ion Auth, a simple authentication library for CodeIgniter,\
    \ and a career long crusade for securing web applications as well as helping other\
    \ developers do the same.\n\nHere we are years later, a lot of us have moved on\
    \ to other frameworks or languages, but I still repeatedly see basic security\
    \ being overlooked. So let’s fix that. I want to make sure that you’ll never have\
    \ to live the horror of leaking user passwords, have someone inject malicious\
    \ SQL into your database, or the suite of other “hacks” that could have been easily\
    \ avoided. Let’s make sure we all get home on time and sleep well at night.\n\n\
    This book will be a quick read with handbook style references to specific items\
    \ you can act on. It is meant to be something you can read in a couple hours and\
    \ then reference later as needed. I’ll also try to make sure we have some fun\
    \ in the process.\n\n### Format\n\nAll code samples in the indented blocks can\
    \ be assumed to be in PHP unless otherwise noted.\n\nLines starting with a dollar\
    \ sign\n\n```\n$ ls -al\n```\n\nare examples of using the command line as a normal\
    \ user.\n\nLines starting with a pound sign\n\n```\n# ls -al\n```\n\nare examples\
    \ of using the command line as the root user.\n\nServer command line examples\
    \ will assume some type of \\*nix (centos, redhat, ubuntu, osx, etc) operating\
    \ system.\n\nI’m trying to keep the code examples from wrapping where possible\
    \ so method arguments will be on their own lines. This may seem odd but it is\
    \ much easier to read than wrapped code with this book format.\n\n### Errata\n\
    \nIf you find any errors don’t hesitate to get in touch with me via email^([1](#chap06.xhtml#fn-email)).\n\
    \n### Sample Code\n\nAll of the examples are in PHP unless otherwise noted. I\
    \ will use native PHP code where possible, even if it creates more boilerplate.\
    \ If something requires too much work to succinctly explain in native PHP I will\
    \ use the Laravel framework since it has an elegant syntax and should be easy\
    \ to understand.\n\nSome of the code examples are broken up for explanation. To\
    \ view complete code examples you can reference the [Github repository](https://github.com/benedmunds/Building-Secure-PHP-Apps-Examples).\n\
    \nLet’s do this.\n\n![](images/benedmunds.jpg)\n\n### About the Author\n\n[Ben\
    \ Edmunds](http://benedmunds.com) leads development teams to create cutting-edge\
    \ web and mobile applications. He is an active leader, developer, and speaker\
    \ in various development communities. He has been developing software professionally\
    \ for over 10 years and in that time has worked on everything from robotics to\
    \ government projects.\n\nPHP Town Hall podcast co-host. Portland PHP Usergroup\
    \ co-organizer. Open source advocate.\n\n## Chapter 1 - Never Trust Your Users.\
    \ Sanitize ALL Input!"
