- raw: "```\n 1 class UserModel\n 2 {\n 3   //... other methods\n 4 \n 5   function\
    \ login($user, $password)\n 6   {\n 7     if (password_verify($_POST['password'],\
    \ $user-\\\n 8 >pass) === TRUE) {\n 9       $valid = TRUE;\n10     }\n11 \n12\
    \     //other checks, error handling, etc...\n13 \n14     if ($valid === TRUE)\
    \ {\n15       //successfully logged in\n16 \n17       //just example session class\n\
    18       //your own code or framework will likely\n19       //have it's own session\
    \ wrapper\n20       Session::put('user', $user->id);\n21       return TRUE;\n\
    22     }\n23 \n24     //failed to login\n25     Session::put('user', NULL);\n\
    26     return FALSE;\n27   }\n28 }\n```\n\nWe’ve saved the user’s successful login.\
    \ A key point here is noting their user ID. Just because they’re logged in doesn’t\
    \ mean they have access to do anything they want in your application.\n\n### Access\
    \ Control\n\nIn addition to determining if the user has a valid login, we need\
    \ to determine if they have access to the page/section/feature they are requesting.\n\
    \nLet’s start with a basic use case. You have two types of users: “Muggle” and\
    \ “Admin”. Muggles are your basic users with very restricted access. Admins are\
    \ the site administrators whom have access to do everything. An Admin can edit\
    \ or delete users, manage posts, etc. It is very important that a normal user\
    \ - a Muggle - cannot perform these actions.\n\nDifferent frameworks have differing\
    \ conventions for when and where to check for proper access. In Laravel, filters\
    \ are preferred. Symfony has voters. In most systems you may simply use the constructors\
    \ of your controllers. The following is a hypothetical example; your exact implementation\
    \ will vary, and is up to you.\n\nFirst we’re going to add a method to our `UserModel`\
    \ for querying the current user.\n\n```\n 1 class UserModel\n 2 {\n 3   //...\
    \ other methods\n 4 \n 5   //... login method\n 6 \n 7   function current()\n\
    \ 8   {\n 9     $user = FALSE;\n10 \n11     if (isset($_SESSION['user']) === TRUE)\
    \ {\n12       $user = DB::findById($_SESSION['user']);\n13     }\n14 \n15    \
    \ return $user;\n16   }\n17 \n18   //let's imagine there is a method for retrieving\n\
    19   //the user's groups.\n20 }\n```\n\nNow let’s use these methods to verify\
    \ that this user has appropriate access.\n\n```\n 1 class AdminController\n 2\
    \ {\n 3   function __construct()\n 4   {\n 5     $userModel = new UserModel;\n\
    \ 6     $user = $userModel->current();\n 7 \n 8     //check to make sure the user\
    \ is logged in and\n 9     //is a member of the admin group\n10     if ($user\
    \ === FALSE || in_array('admin', $user\\\n11 ->groups) === FALSE) {\n12 \n13 \
    \      //please add a legit error message\n14       //with headers and all that\
    \ fancy stuff\n15       die('Not Authorized');\n16     }\n17   }\n18 \n19   //other\
    \ admin only methods\n20 }\n```\n\nYou will usually use some type of abstracted\
    \ access control layer on top of your regular controllers/routes/etc. This layer\
    \ should map your routes to the access level required to view that route. For\
    \ example, `/admin/*` might only be accessible to users in the “admin” group.\
    \ `POST` and `PUT` requests might only be accessible to “editors”. `DELETE` requests\
    \ only accessible by “admins”.\n\nThe point is, each page should check the user’s\
    \ access levels and determine if they are authorized for the requested action(s).\
    \ You don’t want to assume that, if a user can see a form and `POST` it to the\
    \ correct endpoint, the user is authorized to perform that action. This will help\
    \ ensure protection against malicious users, as well as unexpected changes to\
    \ your data by users who should not have been able access that data in the first\
    \ place.\n\nYou never want to breeze through authentication security. Take it\
    \ seriously! You will save yourself or other developers from unnecessary development\
    \ time and headaches in the future.\n\n### Validating Redirects\n\nIn the flow\
    \ of your application, often times you will `POST` a form to an endpoint, validate\
    \ that data, perform some action, then redirect the user to the next step in the\
    \ application flow.\n\nIf the page you are redirecting to contains sensitive data,\
    \ someone can bypass your expected flow by simply sending a request straight to\
    \ this final page, bypassing your validation step.\n\nThere are a few ways to\
    \ handle this. The first way is to simply not redirect at all. Most of the time\
    \ when you think you need a redirect, you could simply call the next method directly.\
    \ So instead of:\n\n```\n1 if ($valid === TRUE && $dataSaved === TRUE) {\n2  \
    \ URL::redirect('/blog/1/edit');\n3 }\n```\n\nYou could call the edit method without\
    \ a redirect:\n\n```\n1 if ($valid === TRUE && $dataSaved === TRUE) {\n2   $this->_edit(1);\n\
    3 }\n```\n\nIn this example, the `_edit()` method would be a protected or private\
    \ method that can’t be accessed from a URL without going through the previous\
    \ step.\n\nIf you do in fact need a separate endpoint, which you may if there\
    \ are multiple entry points to this destination, then you need to verify that\
    \ the proper steps have been executed. Passing any appropriate data along each\
    \ request in an expiring session variable (commonly called flash data) is usually\
    \ the safest way.\n\n```\n1 if ($valid === TRUE && $dataSaved === TRUE) {\n2 \
    \  Session::flash('blogEditValid', TRUE);\n3   URL::redirect('/blog/1/edit');\n\
    4 }\n```\n\nIn your edit endpoint, you would verify the passed-along data:\n\n\
    ```\n1 public function edit($id)\n2 {\n3   if (Session::get('blogEditValid') !==\
    \ TRUE) {\n4     //again, this should be a proper error\n5     //in a real world\
    \ app\n6     die('Not Authorized');\n7   }\n8 }\n```\n\n### Obfuscation\n\nHave\
    \ you heard the term “security through obscurity”? It’s rarely true, but in some\
    \ cases it is helpful. Most applications will use an ID field in each table as\
    \ a primary key. This ID is then used throughout the system to access data. It\
    \ is passed through URLs, forms, and APIs to denote what piece of data is needed.\n\
    \nSometimes, though, you don’t want to expose the user to the actual row ID. Maybe\
    \ you are launching a new product and don’t want the user to know that they are\
    \ only the 13th user. Maybe you have public data but don’t want your site to be\
    \ easily crawled by scraping bots.\n\nIn these cases, you can obfuscate the ID\
    \ to something that isn’t incremental (such as 1, 2, 3, …) but can be translated\
    \ to your ID field. Rather than doing this:\n\n```\n1 Route::get('/edit/{id}',\
    \ function($id)\n2 {\n3   //id = 4321234\n4   $post = $db->post()-where([\n5 \
    \    'id' => $id\n6   ])->row();\n7 });\n```\n\nYou could do:\n\n```\n1 Route::get('/edit/{hash}',\
    \ function($hash)\n2 {\n3   //hash = BaPjae\n4   $id = HashId::decrypt($hash);\n\
    5 \n6   $post = $db->post()-where([\n7     'id' => $id\n8   ])->row();\n9 });\n\
    ```\n\nIn this example, the `HashId::decrypt()` call is simply taking some preexisting\
    \ security hash from your server and applying it against the passed hash to determine\
    \ the ID. This can also be called in reverse to generate a hash:\n\n```\n1 $hash\
    \ = HashId::encrypt(4321234);\n2 echo $hash; //outputs BaPjae\n```\n\nIt is rather\
    \ trivial to write these hashing methods yourself, but I recommend using the tried\
    \ and true [HashIDs](http://www.hashids.org/php/) libraries. These libraries are\
    \ not only easy to use, but are well maintained and available across many different\
    \ programming languages to ensure interoperability throughout your entire infrastructure.\n\
    \nThere are cases where obfuscation can be argued as needed or it could even be\
    \ required in your particular use case. For example, I’ve seen people use obscurity\
    \ as an additional safeguard for HIPAA data. One use case was a specification\
    \ that required keeping HIPAA sensitive data in a separate database, in this case\
    \ it was a three tier server architecture. Primary keys used by the web application\
    \ were stored in one database (along with non-sensitive data), sensitive data\
    \ was stored in another, and an intermediary database stored the relations. This\
    \ was designed so that if any one of these databases were compromised the data\
    \ obtained would be anonymous or non-sensitive."
