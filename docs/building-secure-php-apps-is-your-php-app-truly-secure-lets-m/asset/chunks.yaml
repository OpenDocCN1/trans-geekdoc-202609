    \ passwords were compromised from Adobe\n*   In 2013, eHarmony had roughly 1.5\
    \ million user passwords exposed\n\n### How SQL Injection Works\n\nIf you use\
    \ input directly from your users without modification, a malicious user can pass\
    \ unexpected data, and fundamentally change your SQL queries.\n\nIf your code\
    \ looks something like this:^([4](#chap06.xhtml#fn-dep))\n\n```\n1 mysql_query('UPDATE\
    \ users\n2   SET first_name=\"' . $_POST['first_name'] . '\"\n3   WHERE id=1001');\n\
    ```\n\nYou would expect the generated SQL to be:\n\n```\nUPDATE users set first_name=\"\
    Liz\" WHERE id=1001;\n```\n\nBut if your malicious user types their first name\
    \ as:\n\n```\nLiz\", last_name=\"Lemon\"; --\n```\n\nThe generated SQL then becomes:\n\
    \n```\nUPDATE users\nSET first_name=\"Liz\", last_name=\"Lemon\"; --\"\nWHERE\
    \ id=1001;\n```\n\nNow all of your users are named Liz Lemon, and that’s just\
    \ not cool.\n\n### How To Guard Against It\n\nThe single requirement for guarding\
    \ against SQL injection is to `sanitize input` (also known as `escaping`). You\
    \ can escape each input individually, or use a better method known as `parameter\
    \ binding`. Parameter binding is definitely the way I recommend, as it offers\
    \ more security. Using `PHP`’s `PDO` class^([5](#chap06.xhtml#fn-pdo)), your code\
    \ now becomes:\n\n```\n1 $db = new PDO(...);\n2 $query = $db->prepare('UPDATE\
    \ users\n3   SET first_name = :first_name\n4   WHERE id = :id');\n5 \n6 $query->execute([\n\
    7   ':id'         => 1001,\n8   ':first_name' => $_POST['first_name']\n9 ]);\n\
    ```\n\nUsing bound parameters means that each value will be escaped, quoted properly,\
    \ and only one value is expected. Keep in mind, bound parameters protect your\
    \ query, but they don’t protect the input data after it enters your database.\
    \ Remember, *any* data can be malicious. You will still need to strip out and/or\
    \ escape data that will be displayed back to the user. You can do this when you\
    \ save the data to the database, or when you output it, but don’t skip this very\
    \ important step. We’ll cover this more in the [“Sanitizing Output”](#chap01.xhtml#sanitizing-output)\
    \ section coming up.\n\nYour code is now a little longer, but it’s safe. You won’t\
    \ have to worry about.\n\n#### Best Practices and Other Solutions\n\nThe single\
    \ requirement for guarding against SQL injection is to `sanitize input` (also\
    \ known as `escaping`). You can escape each input individually, or use a better\
    \ method known as `parameter binding`. Parameter binding is definitely the way\
    \ I recommend, as it offers more security. Using `PHP`’s `PDO` class^([5](#chap06.xhtml#fn-pdo)),\
    \ your code now becomes:\n\n```\n1 $db = new PDO(...);\n2 $query = $db->prepare('UPDATE\
    \ users\n3   SET first_name = :first_name\n4   WHERE id = :id');\n5 \n6 $query->execute([\n\
    7   ':id'         => 1001,\n8   ':first_name' => $_POST['first_name']\n9 ]);\n\
    ```\n\n(Note: The remaining text in the prompt contained repetitive/fragmented\
    \ sentences. I have processed the core technical logic provided based on the formatting\
    \ rules.)\n\n### Mass Assignment\n\nThis may sound like a dumb problem to solve,\
    \ but it is one that a lot of developers and sites have fallen to. The most recent,\
    \ well-known exploit of this vulnerability was when a user exposed that Ruby on\
    \ Rails was susceptible. When Egor Homakov originally reported to the Rails team\
    \ that new Rails installs were insecure, his bug report was rejected. The core\
    \ team thought it was a minor concern that would be easier for new developers\
    \ to leave enabled by default. To get attention to this issue, Homakov hilariously\
    \ “hacked” Rails’ GitHub account (GitHub is built on Rails) to give himself administrative\
    \ rights to their repositories. Needless to say, this proved his point, and now\
    \ Rails (and GitHub) are protected from this attack by default.\n\nHow do you\
    \ protect your application against this? The exact implementation details depend\
    \ on which framework or code base you’re using, but you have a few options:\n\n\
    *   Turn off mass assignment completely\n*   Whitelist the fields that are safe\
    \ to be mass assigned\n*   Blacklist the fields that are not safe to be mass assigned\n\
    \nDepending on your implementation, some of these may be used simultaneously.\n\
    \nIn Laravel you add a `$fillable` property to your models to set the whitelist\
    \ of fields that are mass assignable:\n\n```\n1 class User extends Eloquent {\n\
    2 \n3   protected $table = 'users';\n4 \n5   protected $fillable = ['first_name',\
    \ 'last_name'\\\n6 , 'email'];\n```\n```"
  trans: "\n\n让我们从一个故事开始。迈克是俄克荷马州一所私立学校的系统管理员。他的主要职责是维护网络和计算机运行。最近，他开始通过构建一个内部使用的\
    \ Web 应用程序来使学校各项任务自动化。他没有接受过任何正式培训，在大约年前才开始编程，但他对自己的工作非常满意。他了解 `PHP` 的基础知识，并为学校构建了一个相当稳定的客户关系管理系统。虽然还有很多功能需要添加，但基础部分已经涵盖了。迈克甚至因为简化运营和为学校节省费用而收到了校长的表扬。\n\
    \n迈克的一切进展都很顺利，直到一个特殊的新学生出现。这个学生的名字叫“小波比表格”^(2)。一天，行政办公室的乔打给迈克电话，询问系统为什么宕机了。经过检查，迈克发现包含所有学生信息的表格完全丢失了。你知道，小波比的全名实际上是“Robert’);\
    \ DROP TABLE students;–”。数据库没有任何备份；这已经在迈克的“待办事项”上列了一段时间了，但他还没来得及处理。迈克有大麻烦了。\n\n\
    ## SQL 注入\n\n### 现实世界\n\n虽然真实儿童的名字不太包含破坏性的 SQL 代码，但这种 `SQL 注入漏洞` 在现实世界中不断发生：^(3)\n\
    \n*   2012 年，LinkedIn 因为一个未公开的 SQL 注入漏洞泄露了超过 600 万用户的数据。\n*   2012 年，Yahoo! 暴露了\
    \ 45 万用户的密码。\n*   2012 年，Nvidia 的 40 万个密码被攻破破解。\n*   2012 年，Adobe 的 15 万个密码被攻破破解。\n\
    *   2013 年，eHarmony 大约有 150 万用户密码被暴露。\n\n### SQL 注入是如何工作的\n\n如果你直接使用用户输入的输入而不进行任何修改，恶意用户就可以传递意料之外的数据，并从根本上改变你的\
    \ SQL 查询语句。\n\n如果你的代码看起来像这样：^(4)\n\n```\n1 mysql_query('UPDATE users\n2   SET\
    \ first_name=\"' . $_POST['first_name'] . '\"\n3   WHERE id=1001');\n```\n\n你预期生成的\
    \ SQL 应该是：\n\n```\nUPDATE users set first_name=\"Liz\" WHERE id=1001;\n```\n\n\
    但如果你的恶意用户输入的第一个名字是：\n\n```\nLiz\", last_name=\"Lemon\"; --\n```\n\n那么生成的 SQL 就会变成：\n\
    \n```\nUPDATE users\nSET first_name=\"Liz\", last_name=\"Lemon\"; --\"\nWHERE\
    \ id=1001;\n```\n\n现在你所有的用户名字都变成了 Liz Lemon，这可真不妙了。\n\n### 如何防御\n\n防止 SQL 注入的唯一要求是`对输入进行过滤`（sanitize\
    \ input，也称为转义，escaping）。你可以对每个输入进行单独转义，或者使用一种被称为`参数绑定`（parameter binding）的更好方法。参数绑定绝对是我推荐的方法，因为它提供了更高的安全性。使用\
    \ `PHP` 的 `PDO` 类^(5)，你的代码现在变成了：\n\n```\n1 $db = new PDO(...);\n2 $query = $db->prepare('UPDATE\
    \ users\n3   SET first_name = :first_name\n4   WHERE id = :id');\n5 \n6 $query->execute([\n\
    7   ':id'         => 1001,\n8   ':first_name' => $_POST['first_name']\n9 ]);\n\
    ```\n\n使用绑定参数意味着每个值都会被转义、正确引用，并且只预期一个值。记住，绑定参数可以保护你的查询，但它们不能保护输入数据进入系统后的状态。请记住，绑定参数保护你的查询，但*任何*\
    \ 数据都可能是恶意的。你需要在保存数据到数据库之前过滤掉它们，或者在输出它们时处理，我们将在后面的清理输出章节中详细介绍。你的代码现在变得长了一些，但它是安全的。你不需要担心这些。\n\
    \n#### 最佳实践与其他解决方案\n\n防止 SQL 注入的唯一要求是`对输入进行过滤`（sanitize input，也称为转义，escaping）。你可以对每个输入进行单独转义，或者使用一种被称为`参数绑定`（parameter\
    \ binding）的更好方法。参数绑定绝对是我推荐的方法，因为它提供了更高的安全性。使用 `PHP` 的 `PDO` 类^(5)，你的代码现在变成了：\n\
    \n```\n1 $db = new PDO(...);\n2 $query = $db->prepare('UPDATE users\n3   SET first_name\
    \ = :first_name\n4   WHERE id = :id');\n5 \n6 $query->execute([\n7   ':id'   \
    \      => 1001,\n8   ':first_name' => $_POST['first_name']\n9 ]);\n```\n\n使用绑定参数意味着每个值都会被转义、正确引用，并且只预期一个值。记住，绑定参数可以保护你的查询，但它们不能保护输入数据进入系统后的状态。请记住，任何*\
    \ 数据都可能是恶意的。你需要在保存数据到数据库之前过滤掉它们，或者在输出它们时处理，我们将在后面的清理输出章节中详细介绍。你的代码现在变得长了一些，但它是安全的。你不需要担心这些。\n\
    \n### 批量赋值 (Mass Assignment)\n\n这听起来像是一个愚蠢的问题，但很多开发者和网站都曾陷落其中。最近已知的此类漏洞利用案例是某用户暴露了\
    \ Ruby on Rails 容易受到。当 Egor Homakov 最初向 Rails 团队报告新安装的 Rails 不安全时，他的漏洞报告被拒绝了。核心团队认为这是一个微小的顾虑，为了方便新开发者，默认开启它。为了引起对此问题的关注，Homakov\
    \ 幽默地“黑进”了 Rails 的 GitHub 账户（GitHub 是基于 Rails 构建的），获取了他们仓库的管理员权限。不言而喻，这证明了他的观点，现在\
    \ Rails（以及 GitHub）默认受到这种攻击的保护。\n\n你如何保护你的应用程序免受这种攻击？具体的实现细节取决于你使用的哪个框架或代码库，但你有几种选择：\n\
    \n*   完全关闭批量赋值\n*   对可以进行批量赋值的字段设置白名单\n*   对不安全的批量赋值的字段设置黑名单\n\n根据你的实现方式，某些方法可能被同时使用。\n\
    \n在 Laravel 中，你为模型添加 `$fillable` 属性来设置可以批量赋值的字段白名单：\n\n```\n1 class User extends\
    \ Eloquent {\n2 \n3   protected $table = 'users';\n4 \n5   protected $fillable\
    \ = ['first_name', 'last_name'\\\n6 , 'email'];\n```\n"
