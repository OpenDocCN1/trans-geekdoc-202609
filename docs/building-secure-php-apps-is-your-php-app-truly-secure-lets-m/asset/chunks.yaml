    class UserModel\n{\n  //... other methods\n\n  //... login method\n\n  function\
    \ current()\n  {\n    $user = FALSE;\n\n    if (isset($_SESSION['user']) === TRUE)\
    \ {\n      $user = DB::findById($_SESSION['user']);\n    }\n\n    return $user;\n\
    \  }\n\n  //let's imagine there is a method for retrieving\n  //the user's groups.\n\
    }\n```\n\nNow let’s use these methods to verify that this user has appropriate\
    \ access.\n\n```php\nclass AdminController\n{\n  function __construct()\n  {\n\
    \    $userModel = new UserModel;\n    $user = $userModel->current();\n\n    //check\
    \ to make sure the user is logged in and\n    //is a member of the admin group\n\
    \    if ($user === FALSE || in_array('admin', $user->groups) === FALSE) {\n  \
    \    //please add a legit message\n      //with headers and all that stuff\n \
    \     die('Not Authorized');\n    }\n  }\n  //other admin methods\n}\n```\n\n\
    You will usually use some type of abstracted access layer on top of your regular\
    \ controllers. This layer should map your routes to the access level required\
    \ to view that. For example, `/admin/*` might only be accessible to users in the\
    \ “admin” group. `POST` and `PUT` requests might only accessible to “editors”.\
    \ `DELETE` requests only by “admins”.\n\nThe point is, each page should check\
    \ the user’s access levels and determine if they are authorized for the requested\
    \ action(s). You don’t want to assume that, if a user can see a form and `POST`\
    \ it to the correct endpoint, the user is authorized to perform that. This will\
    \ help ensure protection against malicious users, as well as unexpected changes\
    \ to your data by users who should not have able to access that in the first place.\
    \ Take it seriously! You will save yourself or other developers from unnecessary\
    \ time and headaches.\n\n### Validating Redirects\n\nIn the flow of your application,\
    \ often times you will `POST` a form to an endpoint, validate that data, perform\
    \ some action, then redirect the user to the next step in the application.\n\n\
    If the page you are redirecting to contains sensitive data, someone can bypass\
    \ your expected flow by simply sending a request straight to this page. There\
    \ are a few ways to handle this. The first way is to simply not redirect at all.\
    \ Most of the time when you think you need a redirect, you could simply call the\
    \ next method directly. So of:\n\n```php\nif ($valid === TRUE && $dataSaved ===\
    \ TRUE) {\n  URL::redirect('/blog/edit');\n}\n```\n\nYou could call the `edit`\
    \ method without a redirect:\n\n```php\nif ($valid === TRUE && $dataSaved ===\
    \ TRUE) {\n  $this->_edit(1);\n}\n```\n\nIn this example, the `_edit()` method\
    \ would be a protected or private method that can’t be accessed from a URL without\
    \ going through the previous step. If you do in fact need a separate endpoint,\
    \ which may if there are multiple entry points to this destination, you need to\
    \ verify that the proper steps have been executed. Passing any appropriate data\
    \ along each request in a session variable (commonly called flash data) is usually\
    \ the safest way.\n\n```php\nif ($valid === TRUE && $dataSaved === TRUE) {\n \
    \ Session::flash('blogValid', TRUE);\n  URL::redirect('/blog/edit');\n}\n```\n\
    \nIn your `edit` endpoint, you would verify the passed-along data:\n\n```php\n\
    public function edit($id)\n{\n  if (Session::get('blogValid') !== TRUE) {\n  \
    \  //again, this should be a proper error\n    //in a real world app\n    die('Not\
    \ Authorized');\n  }\n}\n```\n\n### Obfuscation\n\nHave you heard the term “security\
    \ through obscurity”? It’s rarely true, but in some cases it is helpful. Most\
    \ applications will use an `ID` field in each table as a primary key. This ID\
    \ is then used throughout the system to access data. It is passed through URLs,\
    \ forms, and APIs to denote what piece of data is needed.\n\nSometimes, though,\
    \ you don’t want to expose the user to the actual row ID. Maybe you are launching\
    \ a new product and don’t want the user to know that they are only 13th user.\
    \ Maybe you have public data but don’t want your site to be easily crawled by\
    \ scraping bots.\n\nIn these cases, you can obfuscate the `ID` to something that\
    \ isn’t incremental (such as 1, 2, 3, …) but can be translated to your `ID` field.\
    \ Rather than doing this:\n\n```php\nRoute::get('/edit/{id}', function($id) {\n\
    \  //id = 432134\n  $post = $db->post()->where([\n    'id' => $id\n  ])->row();\n\
    });\n```\n\nYou could do:\n\n```php\nRoute::get('/edit/{hash}', function($hash)\
    \ {\n  //hash = BaPjae\n  $id = HashId::decrypt($hash);\n\n  $post = $db->post()->where([\n\
    \    'id' => $id\n  ])->row();\n});\n```\n\nIn this example, the `HashId::decrypt()`\
    \ call is simply taking some preexisting security hash from your server and applying\
    \ it against the passed hash to determine the `ID`. This can also be called in\
    \ reverse to generate a hash:\n\n```php\n$hash = HashId::encrypt(432134);\necho\
    \ $hash; //outputs BaPjae\n```\n\nIt is rather trivial to write these hashing\
    \ methods yourself, but I recommend using the tried and true [HashIDs](http://www.hashids.org/php/)\
    \ libraries. These libraries are not only easy to use, but are well maintained\
    \ and available across many different programming languages to ensure interoperability\
    \ throughout your entire infrastructure.\n\nThere are cases where obfuscation\
    \ can be argued as needed or it could even be required in your particular use\
    \ case. For example, I’ve seen people use obscurity as an additional safeguard\
    \ for HIPAA data. One use case was a specification that required keeping HIPAA\
    \ sensitive data in a separate database; in this case it was a three tier server\
    \ architecture. Primary keys used by the web application were stored in one database\
    \ (along with non-sensitive data), sensitive data was stored in another, and an\
    \ intermediary database stored the relations. This was designed so that if any\
    \ one of these databases were compromised the data obtained would be anonymous\
    \ or non-sensitive.\n"
  trans: "\n\n```php\nclass UserModel\n{\n  //... other methods\n\n  function login($user,\
    \ $password)\n  {\n    if (password_verify($_POST['password'], $user->pass) ===\
    \ TRUE) {\n      $valid = TRUE;\n    }\n\n    //other checks, error handling,\
    \ etc...\n\n    if ($valid === TRUE) {\n      //successfully logged in\n\n   \
    \   //just example session class\n      //your own code or framework will likely\n\
    \      //have it's own session wrapper\n      Session::put('user', $user->id);\n\
    \      return TRUE;\n    }\n\n    //failed to login\n    Session::put('user',\
    \ NULL);\n    return FALSE;\n  }\n}\n```\n\n我们已经保存了用户的成功登录状态。这里的一个关键点是记录他们的用户\
    \ ID（ID）。仅仅因为他们登录了，并不意味着他们有权在你的应用程序中执行任何想做的操作。\n\n### 访问控制\n\n除了确定用户是否已登录外，我们还需要确定他们是否有权访问其请求的页面/区块/功能。\n\
    \n让我们从一个基础用例开始。假设你有两种类型的用户：“普通用户（Muggle）”和“管理员（Admin）”。普通用户是权限受限的普通用户。管理员是拥有所有操作权限的网站管理员。管理员可以编辑或删除用户、管理帖子等。确保普通用户（即普通用户）——无法执行这些操作是至关重要的。\n\
    \n不同的框架对于何时以及何处检查适当访问权限有不同的约定。在 Laravel 中，首选使用过滤器（filters）。Symfony 使用了投票器（voters）。在大多数系统中，你可能只需要使用控制器的构造函数。以下是一个假设的示例；你的具体实现将会有所不同，并取决于你的决定。\n\
    \n首先，我们要在 `UserModel` 中添加一个方法来查询当前用户。\n\n```php\nclass UserModel\n{\n  //... other\
    \ methods\n\n  //... login method\n\n  function current()\n  {\n    $user = FALSE;\n\
    \n    if (isset($_SESSION['user']) === TRUE) {\n      $user = DB::findById($_SESSION['user']);\n\
    \    }\n\n    return $user;\n  }\n\n  //let's imagine there is a method for retrieving\n\
    \  //the user's groups.\n}\n```\n\n现在，让我们使用这些方法来验证该用户是否拥有适当的访问权限。\n\n```php\n\
    class AdminController\n{\n  function __construct()\n  {\n    $userModel = new\
    \ UserModel;\n    $user = $userModel->current();\n\n    //check to make sure the\
    \ user is logged in and\n    //is a member of the admin group\n    if ($user ===\
    \ FALSE || in_array('admin', $user->groups) === FALSE) {\n      //please add a\
    \ legit message\n      //with headers and all that stuff\n      die('Not Authorized');\n\
    \    }\n  }\n  //other admin methods\n}\n```\n\n你通常会在常规控制器之上使用某种抽象的访问层。该层应该将你的路由映射到查看该内容所需的访问级别。例如，`/admin/*`\
    \ 可能仅允许“管理员”组的用户访问。`POST` 和 `PUT` 请求可能仅允许“编辑者”访问。`DELETE` 请求仅由“管理员”执行。\n\n要点在于，每个页面都应该检查用户的访问级别，并确定他们是否有权执行请求的操作。你不应该假设如果用户能看到一个表单并将其\
    \ `POST` 到正确的端点，那么该用户就有权执行该操作。这将有助于确保防止恶意用户，并防止本不该访问这些数据的用户对你的数据进行意外更改。请认真对待这一点！这将为你或其他开发者节省不必要的时间和烦恼。\n\
    \n### 验证重定向\n\n在应用程序的流程中，你通常会将表单 `POST` 到一个端点，验证该数据，执行某些操作，然后将用户重定向到应用程序的下一步。\n\
    \n如果你重定向到的页面包含敏感数据，某些可以通过直接向该页面发送请求来绕过你预期的流程。处理此问题的几种方法：第一种是根本不进行重定向。大多数时候，当你认为需要重定向时，你可以直接调用下一个方法。例如：\n\
    \n```php\nif ($valid === TRUE && $dataSaved === TRUE) {\n  URL::redirect('/blog/edit');\n\
    }\n```\n\n你可以在不进行重定向的情况下调用 `edit` 方法：\n\n```php\nif ($valid === TRUE && $dataSaved\
    \ === TRUE) {\n  $this->_edit(1);\n}\n```\n\n在这个示例中，`_edit()` 方法将是一个保护或私方法，在不通过上一步的情况下无法从\
    \ URL 访问。如果你确实需要一个独立的端点（如果该目的地有多个入口点，则可能是这样），你需要验证正确的步骤已经执行。在会话变量中沿每个请求传递任何适当的数据（通常称为\
    \ flash 数据）通常是最安全的方法。\n\n```php\nif ($valid === TRUE && $dataSaved === TRUE) {\n\
    \  Session::flash('blogValid', TRUE);\n  URL::redirect('/blog/edit');\n}\n```\n\
    \n在你的 `edit` 端点中，你会验证这些传递的数据：\n\n```php\npublic function edit($id)\n{\n  if (Session::get('blogValid')\
    \ !== TRUE) {\n    //again, this should be a proper error\n    die('Not Authorized');\n\
    \  }\n}\n```### 混淆\n\n你听过“通过模糊性实现安全（security through obscurity）”这个术语吗？它很少真实，但在某些情况下是有帮助的。大多数应用程序使用每个表中的\
    \ `ID` 字段作为主键。该 ID 然后在整个系统中用于访问数据。\n\n但是，有时你不想向用户暴露真实的 ID。可能你正在发布一个新产品，但不希望用户知道他们是第\
    \ 13 个用户。可能你拥有公开数据，但不希望你的网站被爬虫轻易抓取。\n\n在这种情况下，你可以将 `ID` 混淆为非递增的内容（例如 1, 2, 3...），但可以转换为你的\
    \ `ID` 字段。与其这样做：\n\n```php\nRoute::get('/edit/{id}', function($id) {\n  //id =\
    \ 432134\n  $post = $db->post()->where([\n    'id' => $id\n  ])->row();\n});\n\
    ```\n\n你可以这样做：\n\n```php\nRoute::get('/edit/{hash}', function($hash) {\n  //hash\
    \ = BaPjae\n  $id = HashId::decrypt($hash);\n\n  $post = $db->post()->where([\n\
    \    'id' => $id\n  ])->row();\n});\n```\n\n在这个示例中，`HashId::decrypt()` 调用仅仅是从你的服务器获取预存的安全哈希并将其应用于传递的哈希以确定\
    \ `ID`。这也可以反过来调用生成哈希：\n\n```php\n$hash = HashId::encrypt(432134);\necho $hash;\
    \ // 输出 BaPjae\n```\n\n自己编写这些哈希方法其实相当简单，但我建议使用经过测试的的 [HashIDs](http://www.hashids.org/php/)\
    \ 库。这些库不仅易于使用，而且在许多编程语言中都有良好的维护，以确保整个基础设施的互操作性。\n\n在某些情况下，可以认为混淆是必要的，甚至在你的特定用例中可能是强制要求的。例如，我见过人们将模糊性作为\
    \ HIPAA 数据的额外保护。一个用例是要求将 HIPAA 敏感数据存储在单独的数据库中；在这种情况下这是一个三层服务器架构。Web 应用程序使用的主键存储在一个数据库中（带有非敏感数据），敏感数据存储在另一个中，而中间数据库存储关系。这种设计是为了确保即使任何一个数据库被破解，获得的数据也是匿名或非敏感的。\n\
    \n"
