- raw: 'Ah good old SHA-1, trusty and secure for years. Those are IRL years too, in
    internet years that’s decades. In 2005 (2005 was a bad year for security) researchers
    from Shandong University released a research paper^([15](#chap06.xhtml#fn-sha1broken))
    proving that SHA-1 collisions could be reliably generated with less than 2^(69)
    hash operations. Collisions at around 2^(80) hashing operations are considered
    safe cryptographically. FYI 2^(80) is about 1.20892x10^(24)., so “cryptographically
    secure” means pretty darn secure. Since then Moore’s law^([16](#chap06.xhtml#fn-mooreslaw))
    has ensured that SHA-1 is even less secure and should be avoided in any application
    that needs true security.


    As I explained above for MD5, when used with a random salt SHA1 is still algorithmically
    secure.


    #### SHA-256 / SHA-512


    The SHA-2 standard was introduced as a successor for SHA1 in 2001. It’s accepted
    was accelerated a bit when SHA-1 was proven to be insecure in 2005. SHA256 and
    SHA512 are basically the same; SHA-256 uses 32-bit words, SHA-512 uses 64-bit
    words. They also have a different number of rounds. The core algorithm is practically
    identical though.


    SHA-2 is currently considered cryptographically secure with no known vulnerabilities
    when used with a sufficient number of rounds (>64).


    It has not seen the same amount of scrutiny as Blowfish though, the cypher that
    BCrypt uses internally. The Blowfish cypher which has been around since 1991 and
    is still considered secure, yet using it with a weak key is a known weakness.
    Being based on a cypher gives BCrypt a additional layer of cost that makes it
    superior to a standard hashing algorithm, in other words BCrypt is slower by design.
    Slow is a good thing!


    Even though I recommend BCrypt, SHA-256 or SHA-512 are currently valid and secure
    options for secure hashing when used as part of a derivation algorithm, like PBKDF2
    or the algorithm implemented with PHP’s `crypt()` function.


    #### BCrypt


    BCrypt is seen by a lot of people as a newcomer and isn’t as widely known. BCrypt
    was released in 1999 so it’s not exactly new here. BCrypt is a key derivation
    function based on the Blowfish cypher, it is iterative so it protects against
    brute forcing due to the cost associated with generating a hash.


    There are currently no published exploits of BCrypt despite the fact that it has
    seen considerable attention from cryptographic researchers. It has also been around
    for a good length of time so as of this writing (2014), BCrypt is considered cryptographically
    secure.


    BCrypt does have a limitation of 72 characters for the plain-text password being
    encrypted. This is usually taken into consideration by either stripping the excess
    characters or by simply validating 72 as the max length.


    BCrypt will be our choice for passwords in the following examples.


    #### SCrypt


    SCrypt is the new kid on the block. Released in 2012, it is a memory intensive
    key derivation function. Theoretically SCrypt is more secure than BCrypt due to
    the high cost inherent in the algorithm but since it is so new I don’t personally
    recommend it’s use at this time.


    New is a bad thing in the cryptographic world, it means that SCrypt hasn’t received
    the same level of attacks and scrutiny as older algorithms. There have been a
    few exploits reported recently that don’t mean SCrypt isn’t secure, but do take
    away from the security advantage it theoretically has over BCrypt.


    One big thing that SCrypt has going for it is that a few popular crypto-currencies
    are using it for their mining operations, most notably Litecoin and Dogecoin.
    This means that it will likely receive a large amount of attention sooner than
    its predecessors.


    ### Storage


    This section will be short, WAKE UP. In whatever system you store your passwords
    hashes, whether it’s in a relational database, key store, lock box, sock drawer,
    or file system; use either an unlimited length text field or I recommend a using
    a varchar(255). You’re hashing algorithm will produce a maximum length string
    so you don’t have to worry about an attack overloading your database. Different
    hashing algorithms will produce different fixed length strings so you could set
    your field length based on your algorithms. I instead prefer to use a larger than
    needed field length constraint to handle future hashing possibilities rather than
    try to save a few bytes.


    Using BCrypt your hash will always have a maximum character length of 60 characters.
    So in theory you could get away with a varchar(60) field in your database but
    this doesn’t account for future changes. It’s better to future proof your passwords
    now than to try to save a few bytes in your database. So just leave it as a text
    field or a varchar(255), you won’t regret it.


    ### Validation


    The only validation that’s needed on a password field is minimum length. You should
    allow any character, whitespace, phrases, etc so your users can construct as complex
    of a password as they want. Pass-phrases should be endorsed, “correct horse battery
    staple” is a much better password than “myNewPassword”^([17](#chap06.xhtml#fn-xkcd-passphrase)).
    Your only worry is that the password is not complex enough, hence the minimum
    length. For the love of all that is good, like cat gifs, don’t do stupid things
    like using JavaScript to restrict copy-paste. If the user wants to use a password
    management tool do all you can to make they easy for them. If you do stupid things
    you’ll make your users, and the cats very sad. OK, that rant is over now.


    The only caveat to this is that with BCrypt only the first 72 characters of the
    password will be used so technically you could limit to a maximum of 72 characters
    and not loose any data. That does put a limit on your users though and is not
    future proof for your next hashing algorithm. If your user has a 74 character
    pass-phrase memorized it’s best to let them use that and only use the first 72
    characters than to make them think up a new pass-phrase. Some sources recommend
    hashing the passwords using a standard hashing algorithm (SHA-256, SHA-512, etc)
    and then BCrypting the resulting hash to account for this length issue. That is
    a perfectly valid option. I’m not going to recommend it here simply because with
    a valid salt plus 72 characters of the password you will have enough data to keep
    your hashes secure according to current research.


    ### Putting It All Together


    Now that we’ve covered the basics let’s write a little code, finally.


    First I’m going to walk you through the traditional/deprecated way of doing this
    and then I’ll walk you through the newer way that is available with PHP 5.5 and
    up. The reason for this is


    1.  I want you to understand what is going on behind the scene instead of just
    seeing wrapper functions


    2.  There is a decent chance that you’re on an older version of PHP so I don’t
    want you to be left behind


    The scenario here is that we are registering a new user. We will need to generate
    a random salt, generate their password hash, then store both of these to an imaginary
    database for authentication in the future.


    #### < PHP 5.5


    If you are using a PHP version less than 5.3.7 you need to upgrade to at least
    5.3.7 to have a decent level of security. There is really no other sound recommendation
    I feel comfortable giving. If you are on an older version there are many bug fixes
    that are patched with upgrades. Specifically to our case, there was a BCrypt vulnerability
    patched in 5.3.7. We will be using the $2y$ prefix is our examples, this is the
    “always to specification” prefix. Meaning it has been updated with the vulnerability
    fix and is the most up to date logic.


    First off we’re going to generate a unique random salt. There are a few ways to
    do this in PHP depending on what extensions are compiled on your system. You can
