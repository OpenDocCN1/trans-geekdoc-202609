- raw: "I’m going to reiterate this point because it is extremely important: in most\
    \ cases, obscurity doesn’t protect you from any legitimate attacks. You shouldn’t\
    \ rely on it for security. It is simply a means of making things a little harder\
    \ to find.\n\n### Safe File Handing\n\nCircling back to our original story: if\
    \ you have documents that are served to your users for viewing or downloading,\
    \ you can’t simply set access control on the `*.pdf` files. *Why not?* See, I\
    \ knew you were going to ask that. It helps that I’m the narrator here.\n\nWhat\
    \ you need to do is store the file on your server where it can’t be accessed from\
    \ your web server. Here’s one example of a recommended directory structure:\n\n\
    ```\napplication/\ncomposer.json\ncomposer.lock\nhtdocs/\n    .htaccess\n    assets/\n\
    \    templates/\n    index.php\n    robots.txt\nuploads/\nworkers/\n```\n\n`htdocs/`\
    \ is the location that Apache (or whatever web server you’re using) would serve\
    \ for your domain. `uploads/` is where you would store uploaded documents. You\
    \ can also do this using your server’s configuration. In Apache you could return\
    \ a 404 to any request to the uploads directory if it were in the `htdocs` tree.\n\
    \nTo implement this in your application you would have an endpoint for accessing\
    \ the documents depending on their type. So maybe you need to serve up monthly\
    \ financial statements, but only to users in the “accounting” group.\n\nHere we\
    \ are defining the endpoint to access this. With this endpoint we will verify\
    \ the user’s access level, read the file, and finally output it to the browser\
    \ with the appropriate headers.\n\n```\n 1 Route::get(\n 2   '/accounting/statements/{year}/{month}',\n\
    \ 3   function($year, $month) {\n 4 \n 5 \t//check user access\n 6 \t$userModel\
    \ = new UserModel;\n 7 \t$user = $userModel->current();\n 8 \n 9 \t//check to\
    \ make sure the user is logged in\n10 \t//and a member of accounting\n11 \tif\
    \ ($user === FALSE || in_array('accounting', $us\\\n12 er->groups) === FALSE)\
    \ {\n13 \t  //please add a legit error message\n14 \t  die('Not Authorized');\n\
    15 \t}\n16 \n17 \t//the user has access, let's read the file\n18 \t$directory\
    \ = __DIR__ . '../uploads/acct/stmnts/';\n19 \t$filename  = (int) substr($year,\
    \ 0, 4)  .\n20 \t             (int) substr($month, 0, 2) .\n21 \t            \
    \ '.pdf';\n22 \n23 \t//error handling for invalid files\n24 \n25 \t//open the\
    \ file\n26 \t$fileHandle = fopen($directory . $filename, 'r');\n27 \n28 \t//read\
    \ the file and close it\n29 \t$fileContents = fread($fileHandle);\n30 \tfclose($fileHandle);\n\
    31 \n32 \t//send the appropriate headers\n33 \theader('Content-type: application/pdf');\n\
    34 \theader('Content-Disposition: inline; filename=\"' \\\n35 . $filename . '\"\
    ');\n36 \theader('Content-Length: ' . filesize($directory .\\\n37  $filename));\n\
    38 \theader('Expires: 0');\n39 \theader('Cache-Control: must-revalidate');\n40\
    \ \theader('Pragma: public');\n41 \n42 \t//echo the file contents to the browser\n\
    43 \techo $fileContents;\n44 \n45 });\n```\n\nThis prevents someone that shouldn’t\
    \ see this file from accessing it, since it is outside of the web server tree\
    \ and it is being checked against the proper access controls.\n\n#### Recap\n\n\
    We’ve covered basic authentication procedures, proper access control through never\
    \ trusting without validation, and safe file handling procedures. I hope you find\
    \ this helpful while developing your next awesome idea.\n\nKeep reading, ‘cause\
    \ we’re not done yet. Remember, we’re done when I say we’re done!\n\n## Chapter\
    \ 5 - Safe Defaults, Cross Site Scripting, and Other Popular Hacks\n\nNo story\
    \ this time. This chapter is a catch-all for other attacks you need to protect\
    \ against, so there isn’t an overarching narrative. Try to contain your disappointment.\n\
    \n### Never Trust Yourself - Use Safe Defaults\n\nOne of the core concepts of\
    \ a secure system is safe defaults. Whenever possible (and it’s usually possible),\
    \ you should define variables, properties, etc., early with a safe default.\n\n\
    A safe default usually means a NULL, empty, or FALSE state. When determining logic\
    \ flow, the default should always be a failure. For example, in the earlier authentication\
    \ examples I check if the password is correct. If it is, we proceed to the positive\
    \ application logic. If it fails, the function executes the default logic for\
    \ a non-positive result.\n\nLet’s look at a basic example with form validation.\n\
    \n```\n 1 Route::post('/signup', function()\n 2 {\n 3   //check for a valid form\n\
    \ 4   if (Form::validate('signup') === TRUE) {\n 5     //process the form\n 6\
    \   }\n 7 \n 8   //the default logic is failure\n 9   die('Invalid Form Data');\n\
    10 });\n```\n\n### Never Trust Dynamic Typing. It’s Not Your Friend.\n\nDynamic\
    \ typing is a feature loved by newer programmers, since it seems to make development\
    \ “easier”. Dynamic typing means you don’t have to be so picky about types; you\
    \ just get close enough and it’ll work. The problem with this is it doesn’t always\
    \ work the way you’d expect.\n\nLet’s look at a classic example with a native\
    \ PHP function, `stripos()`. The scenario is that you’re trying to figure out\
    \ if the letter “i” exists in the phrase “I am the one who knocks”.\n\n```\n 1\
    \ $phrase = 'I am the one who knocks';\n 2 \n 3 $letterExists = stripos($phrase,\
    \ 'i');\n 4 \n 5 if ($letterExists != FALSE) {\n 6   echo 'we should be here';\n\
    \ 7   return TRUE;\n 8 }\n 9 \n10 echo \"we shouldn't be here, yet we are\";\n\
    11 return FALSE;\n```\n\nThe `stripos()` function returns the index of the match\
    \ in the haystack string. Since “i” is the first letter of the string, `strpos()`\
    \ is returning `0`. Due to dynamic typing, `!= FALSE` evaluates the same as `!=\
    \ 0`. Now let’s fix this with an explicit check using `!==` instead.\n\n```\n\
    \ 1 $phrase = 'I am the one who knocks';\n 2 \n 3 $letterExists = stripos($phrase,\
    \ 'i');\n 4 \n 5 if ($letterExists !== FALSE) {\n 6   echo 'we should be here';\n\
    \ 7   return TRUE;\n 8 }\n 9 \n10 echo \"we shouldn't be here, annnnnnd we aren't\"\
    ;\n11 return FALSE;\n```\n\nAnother lesser-known advantage to explicit checks\
    \ is performance. Most of the time an explicit check will be faster, since it\
    \ doesn’t need typecasting. If you’re ever curious about performance differences\
    \ in PHP, I recommend checking out [PHP Bench](http://www.phpbench.com/).\n\n\
    ### Cross Site Scripting\n\nCross Site Scripting (XSS) is the process of injecting\
    \ malicious code into the target website. This can be done in several ways, but\
    \ the end result is the user’s browser runs unauthorized code as themselves, within\
    \ their current session.\n\n#### Non-Persistent XSS\n\nThis is the traditional\
    \ type of XSS exploit. It involves injecting data into a site and then guiding\
    \ users to the malicious content.\n\nSay a page on your site takes `?page_num=2&per_page=50`\
    \ as query string parameters. If you do not escape these parameters, an attacker\
    \ could change their values to malicious code. This code could take the user to\
    \ a delete page, run JavaScript in their browser, or any number of client side\
    \ attacks.\n\nAfter injecting their malicious code, the attacker somehow gets\
    \ a user to visit the page. When the user arrives, the application will verify\
    \ their valid user session and execute the malicious code. A user could even end\
    \ up deleting their own account!\n\n#### Persistent XSS\n\nA persistent XSS exploit\
    \ is an exploit stored permanently on the server. For example, a social sharing\
    \ site like Facebook allows users to save messages and display them to other users.\
    \ An attacker could store malicious code in a Facebook post. If Facebook was not\
    \ properly escaping this data when displaying it back to other users, that code\
    \ would be executed. So anyone that sees the attacker’s status would be running\
    \ this malicious code.\n\n### Attack Entry Points\n\nI just mentioned a couple\
    \ examples of XSS exploit entry points, but those are not the only ones. Basically\
    \ anywhere you take input from a user and display it back on a web page is an\
    \ opportunity for an attacker to exploit your site."
