- raw: "Let’s start with a story. Mike is the system admin for a small private school\
    \ in Oklahoma. His main responsibility is keeping the network and computers working.\
    \ Recently he started automating various tasks around the school by building a\
    \ web application for internal use. He doesn’t have any formal training and just\
    \ started programming about a year ago, but he feels pretty good about his work.\
    \ He knows the basics of PHP and has built a pretty stable customer relationship\
    \ manager for the school. There are still a ton of features to add, but the basics\
    \ are covered. Mike even received kudos from the superintendent for streamlining\
    \ operations and saving the school money.\n\nEverything was going well for Mike\
    \ until a particular new student started. The student’s name is Little Bobby Tables^([2](#chap06.xhtml#fn-xkcd)).\
    \ One day, Jon from the admin office called Mike to ask why the system was down.\
    \ After inspecting, Mike found that the table containing all the students’ information\
    \ was missing entirely. You see, Little Bobby’s full name is actually “Robert’);\
    \ DROP TABLE students;–”. There aren’t any backups of the database; it has been\
    \ on Mike’s “to do” list for a while, but he hadn’t gotten around to it yet. Mike\
    \ is in big trouble.\n\n### SQL Injection\n\n#### Real World\n\nWhile it’s unlikely\
    \ a real child’s name will contain damaging SQL code, this kind of **SQL injection\
    \ vulnerability** happens in the real world all the time:^([3](#chap06.xhtml#fn-sqlinject1))\n\
    \n*   In 2012, LinkedIn leaked over 6 million users’ data due to an undisclosed\
    \ SQL injection vulnerability\n\n*   In 2012, Yahoo! exposed 450,000 user passwords\n\
    \n*   In 2012, 400,000 passwords were compromised from Nvidia\n\n*   In 2012,\
    \ 150,000 passwords were compromised from Adobe\n\n*   In 2013, eHarmony had roughly\
    \ 1.5 million user passwords exposed\n\n#### How SQL Injection Works\n\nIf you\
    \ use input directly from your users without modification, a malicious user can\
    \ pass unexpected data, and fundamentally change your SQL queries.\n\nIf your\
    \ code looks something like this:^([4](#chap06.xhtml#fn-dep))\n\n```\n1 mysql_query('UPDATE\
    \ users\n2   SET first_name=\"' . $_POST['first_name'] . '\"\n3   WHERE id=1001');\n\
    ```\n\nYou would expect the generated SQL to be:\n\n```\nUPDATE users set first_name=\"\
    Liz\" WHERE id=1001;\n```\n\nBut if your malicious user types their first name\
    \ as:\n\n```\nLiz\", last_name=\"Lemon\"; --\n```\n\nThe generated SQL then becomes:\n\
    \n```\nUPDATE users\nSET first_name=\"Liz\", last_name=\"Lemon\"; --\"\nWHERE\
    \ id=1001;\n```\n\nNow all of your users are named Liz Lemon, and that’s just\
    \ not cool.\n\n#### How To Guard Against It\n\nThe single requirement for guarding\
    \ against SQL injection is to **sanitize input** (also known as **escaping**).\
    \ You can escape each input individually, or use a better method known as **parameter\
    \ binding**. Parameter binding is definitely the way I recommend, as it offers\
    \ more security. Using PHP’s `PDO` class^([5](#chap06.xhtml#fn-pdo)), your code\
    \ now becomes:\n\n```\n1 $db = new PDO(...);\n2 $query = $db->prepare('UPDATE\
    \ users\n3   SET first_name = :first_name\n4   WHERE id = :id');\n5 \n6 $query->execute([\n\
    7   ':id'         => 1001,\n8   ':first_name' => $_POST['first_name']\n9 ]);\n\
    ```\n\nUsing bound parameters means that each value will be escaped, quoted properly,\
    \ and only one value is expected. Keep in mind, bound parameters protect your\
    \ query, but they don’t protect the input data after it enters your database.\
    \ Remember, *any* data can be malicious. You will still need to strip out and/or\
    \ escape data that will be displayed back to the user. You can do this when you\
    \ save the data to the database, or when you output it, but don’t skip this very\
    \ important step. We’ll cover this more in the [“Sanitizing Output”](#chap01.xhtml#sanitizing-output)\
    \ section coming up.\n\nYour code is now a little longer, but it’s safe. You won’t\
    \ have to worry about another Little Bobby Tables screwing up your day. Bound\
    \ parameters are pretty awesome right? You know what else is awesome, Funyuns\
    \ are awesome.\n\n#### Best Practices and Other Solutions\n\n**Stored procedures**\
    \ are another way to protect against SQL injection. A stored procedure is a function\
    \ built in your database. Using a stored procedure means you’re less likely to\
    \ be susceptible to SQL injection, since your data isn’t passed directly as SQL.\
    \ In general, stored procedures are frowned upon. The main reasons for which include:\n\
    \n1.  Stored procedures are difficult to test\n\n2.  They move the logic to another\
    \ system outside of the application\n\n3.  They are difficult to track in your\
    \ version control system, since they live in the database and not in your code\n\
    \n4.  Using them can limit the number of people on your team capable of modifying\
    \ the logic if needed\n\n**Client-side JavaScript** is NOT a solution for validating\
    \ data, ever. It can be easily modified or avoided by a malicious user with even\
    \ a mediocre amount of knowledge. Repeat after me: I will NEVER rely on JavaScript\
    \ validation; I will NEVER EVER rely on JavaScript validation. You can certainly\
    \ use JavaScript validation to provide instant feedback and present a better user\
    \ experience, but for the love of your favorite deity, check the input on the\
    \ back end to make sure everything is legit.\n\n### Mass Assignment\n\nMass assignment\
    \ can be an incredibly useful tool that can speed up development time, or cause\
    \ severe damage if used improperly.\n\nLet’s say you have a `User` model that\
    \ you need to update with several changes. You could update each field individually,\
    \ or you could pass all of the changes from a form and update it in one go.\n\n\
    Your form might look like this:\n\n```\n1 <form action=\"...\">\n2   <input name=\"\
    first_name\" />\n3   <input name=\"last_name\" />\n4   <input name=\"email\" />\n\
    5 </form>\n```\n\nThen you have back end PHP code to process and save the form\
    \ submission. Using the Laravel framework, that might look like this:\n\n```\n\
    1 $user = User::find(1);\n2 $user->update(Input::all());\n```\n\nQuick and easy\
    \ right? But what if a malicious user modifies the form, giving themselves administrator\
    \ permissions?\n\n```\n1 <form action=\"...\">\n2   <input type=\"text\" name=\"\
    first_name\" />\n3   <input type=\"text\" name=\"last_name\" />\n4   <input type=\"\
    text\" name=\"email\" />\n5   <input type=\"hidden\" name=\"permissions\" value=\"\
    {\\\n6 'admin':'true'}\" />\n7 </form>\n```\n\nThat same code would now change\
    \ this user’s permissions erroneously.\n\nThis may sound like a dumb problem to\
    \ solve, but it is one that a lot of developers and sites have fallen victim to.\
    \ The most recent, well-known exploit of this vulnerability was when a user exposed\
    \ that Ruby on Rails was susceptible to this. When Egor Homakov originally reported\
    \ to the Rails team that new Rails installs were insecure, his bug report was\
    \ rejected. The core team thought it was a minor concern that would be easier\
    \ for new developers to leave enabled by default. To get attention to this issue,\
    \ Homakov hilariously “hacked” Rails’ GitHub account (GitHub is built on Rails)\
    \ to give himself administrative rights to their repositories. Needless to say,\
    \ this proved his point, and now Rails (and GitHub) are protected from this attack\
    \ by default.\n\nHow do you protect your application against this? The exact implementation\
    \ details depend on which framework or code base you’re using, but you have a\
    \ few options:\n\n*   Turn off mass assignment completely\n\n*   Whitelist the\
    \ fields that are safe to be mass assigned\n\n*   Blacklist the fields that are\
    \ not safe to be mass assigned\n\nDepending on your implementation, some of these\
    \ may be used simultaneously.\n\nIn Laravel you add a `$fillable` property to\
    \ your models to set the whitelist of fields that are mass assignable:\n\n```\n\
    1 class User extends Eloquent {\n2 \n3   protected $table = 'users';\n4 \n5  \
    \ protected $fillable = ['first_name', 'last_name'\\\n6 , 'email'];\n```\n\nThis\
    \ would stop the “permissions” column from being mass assigned. Another way to\
    \ handle this in Laravel is to set a blacklist with the `$guarded` property:"
  fmt: "\nLet’s start with a story. Mike is the system admin for a small private school\
    \ in Oklahoma. His main responsibility is keeping the network and computers working.\
    \ Recently he started automating various tasks around the school by building a\
    \ web application for internal use. He doesn’t have any formal training and just\
    \ started programming about a year ago, but he feels pretty good about his work.\
    \ He knows the basics of `PHP` and has built a pretty stable customer relationship\
    \ manager for the school. There are still a ton of features to add, but the basics\
    \ are covered. Mike even received kudos from the superintendent for streamlining\
    \ operations and saving the school money.\n\nEverything was going well for Mike\
    \ until a particular new student started. The student’s name is Little Bobby Tables^([2](#chap06.xhtml#fn-xkcd)).\
    \ One day, Jon from the admin office called Mike to ask why the system was down.\
    \ After inspecting, Mike found that the table containing all the students’ information\
    \ was missing entirely. You see, Little Bobby’s full name is actually “Robert’);\
    \ DROP TABLE students;–”. There aren’t any backups of the database; it has been\
    \ on Mike’s “to do” list for a while, but he hadn’t gotten around to it yet. Mike\
    \ is in big trouble.\n\n## SQL Injection\n\n### Real World\n\nWhile it’s unlikely\
    \ a real child’s name will contain damaging SQL code, this kind of `SQL injection\
