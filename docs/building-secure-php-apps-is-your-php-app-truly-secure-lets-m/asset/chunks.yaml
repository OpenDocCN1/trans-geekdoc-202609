- raw: 'Another thing to keep in mind is external programs you use on your server.
    For example, PhpMyAdmin has had several security flaws throughout its lifetime
    that have left servers vulnerable. Outdated Wordpress installations are also well
    known in development circles as a back door for hackers. Any program that exposes
    critical functions on your server is a possible attack entry point.


    Try to keep your external dependencies to a minimum, and always keep them up to
    date with their latest security releases.


    ## Destructor


    I had a lot of fun during the process of writing this. I also drank a lot of rum.
    I truly hope that you learning something and enjoyed reading this, we need to
    meet that knowledge to rum ratio.


    Please get in contact^([23](#chap06.xhtml#fn-emailtwo)) if you want to learn more
    about any of the subjects covered here or just argue over the meaning of life.


    Thanks for reading.


