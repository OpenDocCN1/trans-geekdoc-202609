- raw: 'A real life example to explain how SSL works is a diplomatic bag^([11](#chap06.xhtml#fn-diplomatic_bag)).
    The contents are secured and can only be opened on either end of the transfer
    by the person with the proper credentials. The bag is secured by international
    law, as well as physical means, just as the SSL encrypted message body is protected
    by a strong algorithm and keys.


    A certificate authority will sign your website’s certificate to prove that it
    is valid. The user’s web browser already knows the major certificate authorities
    and will verify the sites certificate against the root certificate that the certificate
    authority provides. The traffic will then be encrypted with this key on both ends,
    so the only traffic going across the network is encrypted traffic. If you’ve ever
    used SSH with public keys for authentication you are already familiar with the
    process. You have a public and private key that is used to verify your identity
    with a remote server.


    This will protect you from man in the middle attacks, including the session hijacking
    we mentioned above if all of your site is encrypted with HTTPS.


    ### Limitations


    There are a few limitations when using HTTPS that may make it infeasible in certain
    circumstances.


    #### Virtual Hosts


    Under normal configurations virtual hosts can not be used with SSL. This is a
    problem if you’re using shared hosting or simply running multiple sites on the
    same server. The reason for this is because the server can’t determine the host
    header until the connection has been completed, which requires the SSL authentication.
    Since certificates can only have one host this means it will simply not work.
    The easiest way around this is to setup multiple IP addresses and use IP based
    hosts instead of the name based host resolution you’re probably used to. I usually
    recommend setting up a separate server for secure sites though, if you need HTTPS
    you are probably at the point of needing a dedicated server as well.


    There are however some hosting providers with shared certificates that can be
    used across the sites hosted with them. This can enable you to quickly and cheaply
    support HTTPS. The main issue with this is that the domain would need to reflect
    the hosting provider’s domain name. For example instead of


    ```

    https://yourApp.com/login

    ```


    the URL would be something like


    ```

    https://yourHost.com/yourApp/login

    ```


    This may or may not be a concern depending on your application and branding needs.


    #### Speed


    HTTPS connections require SSL handshakes to establish the connection, thus making
    the overall transfer slower. Once that initial handshake is performed additional
    connections only require the encryption and decryption of the content, meaning
    that once the initial connection is complete, subsequent connections aren’t much
    slower. The performance impact is ***incredibly*** low though, this is not a valid
    reason to discredit the use of HTTPS.


    #### Caching


    Cheddar. Fat stacks. Dead Presidents. Cash money. Nah, actually we’re talking
    about cache. The secret sauce behind your super quick load times. You have to
    say it with a british accent. Modern browsers will cache HTTPS content the same
    as HTTP content so there is no disconnect there. To cause older browser to support
    caching set the Cache-Control header, for example


    ```

    header(''Cache-Control: max-age=31536000'');

    ```


    would tell the browser to cache for one year.


    The real issue comes with proxy caching. Proxy caching might come from an ISP
    or a service meant to speed up connections. This is mostly used in rural parts
    of the world that have slow internet connection speeds. Using HTTPS, this type
    of caching is impossible since all the traffic the proxy sees is encrypted. This
    is not a major issue for most sites but if you have a large global userbase, or
    an application that targets users in remote locations, this should be considered
    carefully.


    Another thing to think about, there is a good chance that there are parts of your
    site that should NOT be cached. This means that you shouldn’t just let the browser
    cache everything, sit down and plan out which parts of your application should
    be cached and for how long. For example, CSS and JavaScript should probably be
    cached for a significant amount of time; whereas the user’s timeline view should
    update very often.


    #### Certificate Types


    There are two types of SSL certificates.


    Domain Validated Certificates do not verify as much information as their counter
    parts but they are substantially cheaper. Usually starting around fifty dollars,
    they will likely be the best option for small sites. The main down side from a
    user perspective is that there is usually some distinction in the browser between
    the two, for example a Domain Validated Certificate might only show a lock symbol
    in the address bar while an Extended Validation Certificate will show the full
    green address bar.


    Extended Validation Certificates are the gold standard of SSL certificates. They
    not only validate that you are the owner of the domain but also verify the identify
    and legitimacy of the domain owner. Since this usually requires a personal effort
    on the part of the Certificate Authority these certificates are significantly
    more expensive. Usually Extended Validation Certificates start around five hundred
    dollars. This will be the certificate of choice for most large and reputable companies.
    Browsers will display the full green address bar when an Extended Validation Certificate
    is in use, giving users more peace of mind.


    ### When to use HTTPS


    The traditional view has been to use HTTPS anywhere credentials or other sensitive
    data is passed to the server. For many years this has meant that login pages and
    shopping carts were all that was encrypted. These are still valid and necessary
    places to use encryption but will leave the rest of the user’s session open to
    man in the middle attacks. Recently there has been a movement to use HTTPS everywhere.
    Which is just a marketed way of stating that every page of your site would be
    encrypted on HTTPS. This is a good rule in many cases, the limitations of HTTPS
    should be considered though, don’t just blindly implement HTTPS everywhere without
    evaluating the trade-offs. If you determine that the limitations discussed above
    are offset by the enhanced security throughout for your specific application then
    using HTTPS on each page is strongly recommended.


    Are you thinking that at this point it’d be easier to just forget about this whole
    HTTPS thing? Okay. Okay. Let’s just slow down. Slow down. Regardless of you’re
    constraints you have an obligation to your users to implement the best security
    you possibly can. If you run a shopping cart or collect credit cards for instance,
    HTTP is not even an option. More and more even for what isn’t considered sensitive
    data, like a social media account, it is becoming standard to encrypt. Don’t be
    left behind, use HTTPS whenever you can.


    ### Implementing HTTPS


    #### What kind of SSL Certificate do I need?


    The main question to ask yourself is do you need to secure subdomains or not.
    If you need to secure multiple subdomains, eg


    ```

    api.yourApp.com

    docs.yourApp.com

    yourMom.yourApp.com

    cart.yourApp.com

    ```


    then you’ll need a Wildcard SSL Certificate. If you don’t need that capability
    and only need to secure something like


    ```

    yourApp.com

    ```


    then a standard certificate will work just fine. The only deterrent to getting
    the Wildcard just in case you need it later is the cost.


    #### Generating your Server Certificate


    In order for the Certificate Authority to sign and generate your certificate you’ll
    need to generate keys on your server and then upload those to the Certificate
    Authority.'
