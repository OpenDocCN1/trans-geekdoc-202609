  trans: "\n\n![构建安全的 PHP 应用](img/title_page.png)\n\n# 构建安全的 PHP 应用\n\n### 你的 PHP\
    \ 应用真的安全吗？让我们确保你能够准时回家，并在晚上晚上睡个好觉。\n\n#### Ben Edmunds\n\n本书可在 [`leanpub.com/buildingsecurephpapps`](http://leanpub.com/buildingsecurephpapps)\
    \ 购买\n\n此版本发布于 2014-05-05\n\n![出版者标志](img/leanpub-logo.png)\n\n* * * *\n\n这是一这是一本来自\
    \ [Leanpub](http://leanpub.com) 的书。Leanpub 通过精益出版流程（Lean Publishing process）为作者和出版社赋能。[精益出版](http://leanpub.com/manifesto)\
    \ 是使用轻量级工具和多次迭代来发布进行中的电子书，以获取读者反馈，不断调整直到获得正确的书籍，并在一旦获得成功后建立影响力。\n\n* * * * *\n\
    \n© 2013 - 2014 Ben Edmunds\n\n## 目录\n\n* 构造函数\n    * 格式\n    * 错误列表\n    * 示例代码\n\
    \    * 关于作者\n* 第 1 章 - 永远不要信任你的用户。过滤所有输入！\n    * SQL 注入\n    * 批量赋值\n    * 类型转换\n\
    \    * 输出过滤\n* 第 2 章 - HTTPS/SSL/BCA/JWH/SHA 以及其他随机字母；其中某些确实非常重要。\n    * 什么是 HTTPS\n\
    \    * 局限性\n    * 何时使用 HTTPS\n    * 实现 HTTPS\n    * 路径\n* 第 3 章 - 适合 way 密码加密与存储\n\
    \    * 细节说明\n    * 什么是哈希\n    * 常见攻击\n    * 少量的盐\n    * 哈希算法\n    * 存储\n    *\
    \ 验证\n    * 整合在一起\n    * 暴力破解防护\n    * 升级遗留系统\n    * 资源\n* 第 4 章 - 身份验证、访问控制与安全文件处理\n\
    \    * 身份验证\n    * 访问控制\n    * 验证重定向\n    * 混淆\n    * 安全文件处理\n    * 身份验证\n   \
    \ * 访问控制\n    * 验证重定向\n    * 混淆\n    * 安全文件处理\n\n## 构造函数\n\n几年前，我正在为一个客户使用 `CodeIgniter`\
    \ 框架编写一个应用程序，令人遗憾的是，`CodeIgniter` 并没有包含任何身份验证功能。因此，我开始寻找能够满足我需求的简洁库。为了在 `CodeIgniter`\
    \ 中提供身份验证，当然，我做了任何优秀的开发人员都会做的事。这开启了我创建 `Ion Auth` 的旅程，这是一个功能简单的身份验证库。多年以后，我们许多人转向了其他框架或语言，但我仍然经常看到安全被忽视。所以让我们确保我们都能准时回家，并在晚上睡个好觉。\n\
    \n本书是一本快速读物，并附带了可以操作的手册风格引用。我也会尽量确保在这个过程中有一些乐趣。\n\n### 格式\n\n所有缩进块中的代码均假设为 PHP，除非另有说明。\n\
    \n以 `$` 开头的行：\n\n```\n$ ls -al\n```\n\n是普通用户使用命令行的示例。\n\n以 `#` 开头的行：\n\n```\n\
    # ls -al\n```\n\n是 root 用户使用命令行的示例。\n\n服务器命令行示例将假设某种操作系统（`centos`、`redhat`、`ubuntu`、`osx`\
    \ 等）。\n\n我正尽量避免代码示例换行，因此方法参数将单独占一行。这看起来可能很奇怪，但比换行的代码易读得多。\n\n### 错误列表\n\n如果你发现任何错误，请随时通过电子邮件与我联系。\n\
    \n### 示例代码\n\n除非另有说明，所有的示例都是 PHP。尽可能使用原生 PHP 代码，即使会产生更多的模板代码。如果某些内容用原生 PHP 很难简洁解释，我会使用\
    \ `Laravel` 框架，因为它的语法优雅且易于理解。\n\n某些代码示例为了解释而被拆分。要查看完整的代码示例，可以参考 Github 仓库（https://github.com/benedmunds/Building-Secure-PHP-Apps-Examples）。\n\
    \n让我们开始吧。\n\n### 关于作者\n\nBen Edmunds 领导开发团队创建尖端的 Web 和移动应用程序。他是各种开发社区中活跃的领导者、开发者和演讲者。他从事软件开发已超过\
    \ 10 年，在此期间，他处理过从机器人到政府项目的各种任务。\n\nPHP Town Hall 播客共同主持人。波特兰 PHP 用户小组联合组织者。开源倡导者。\n\
    \n"
