    web and mobile applications. He is an active leader, developer, and speaker in
    various development communities. He has been developing software professionally
    for over 10 years and in that time has worked on everything from robotics to government
    projects.


    PHP Town Hall podcast co-host. Portland PHP Usergroup co-organizer. Open source
    advocate.


