    \ = mcrypt_create_iv(\n 4   $saltLength,\n 5   MCRYPT_DEV_URANDOM\n 6 );\n 7 \n\
    \ 8 //convert the binary salt into a safe string\n 9 $salt = substr(\n10   strtr(\n\
    11     base64_encode($binarySalt),\n12     '+',\n13     '.'\n14   ),\n15   0,\n\
    16   $saltLength\n17 );\n```\n\nWe are calling `mcrypt_create_iv()` with the MCRYPT_DEV_URANDOM\
    \ flag to tell it to buffer from /dev/urandom. Wrapping it in `bin2hex()` makes\
    \ use get a hexadecimal string back instead of the straight binary data.\n\nIf\
    \ MCrypt isn’t available on your system you can always fall back to reading directly\
    \ from /dev/urandom. Unless your on Windows, in which case just install Linux\
    \ before it’s too late. Go ahead, I’ll wait. You can thank me later; I’ll take\
    \ check, cash, or card for the thank you gift.\n\n```\n 1 //generate the binary\
    \ random salt\n 2 $saltLength = 22;\n 3 $binarySalt = file_get_contents(\n 4 \
    \  '/dev/urandom',\n 5   false,\n 6   null,\n 7   0,\n 8   $saltLength\n 9 );\n\
    10 \n11 //convert the binary salt into a safe string\n12 $salt = substr(\n13 \
    \  strtr(\n14     base64_encode($binarySalt),\n15     '+', '.'\n16   ),\n17  \
    \ 0,\n18   $saltLength\n19 );\n```\n\nNow that we have the salt let’s hash the\
    \ password as well\n\n```\n 1 //generate the binary random salt\n 2 $saltLength\
    \ = 22;\n 3 $binarySalt = mcrypt_create_iv(\n 4   $saltLength,\n 5   MCRYPT_DEV_URANDOM\n\
    \ 6 );\n 7 \n 8 //convert the binary salt into a safe string\n 9 $salt = substr(\n\
    10   strtr(\n11     base64_encode($binarySalt),\n12     '+',\n13     '.'\n14 \
    \  ),\n15   0,\n16   $saltLength\n17 );\n18 \n19 //set the cost of the bcrypt\
    \ hashing\n20 //remember to experiment on your server to find th\\\n21 e right\
    \ value\n22 $cost = 10;\n23 \n24 //now we'll combine the algorithm code ($2y$)\
    \ with\\\n25  the cost and our salt\n26 $bcryptSalt = '$2y$' . $cost . '$' . $salt;\n\
    27 \n28 //hash it, hash it good\n29 $passwordHash = crypt(\n30   $_POST['password'],\n\
    31   $bcryptSalt\n32 );\n33 \n34 //verify a secure hash was returned\n35 //this\
    \ could be an error code or insecure hash\n36 if (strlen($passwordHash) === 60)\
    \ {\n37 \n38   //this next part is just for demonstration\n39   $db = new ImaginaryDatabase;\n\
    40   $db->user()->create(array(\n41     'password' => $passwordHash\n42   ));\n\
    43 \n44 }\n45 else {\n46 \n47   //error handling\n48 \n49 }\n```\n\nSo we hashed\
    \ our password and saved it to the database. Notice how we didn’t save the salt?\
    \ That’s because `crypt()` will store the selected algorithm, hashed password,\
    \ and salt all within the returned hash.\n\nWell we have the user signed up now,\
    \ let’s say they leave our site (how dare they!) and come back later, they need\
    \ a way to login. Login is nice and simple, we just need to check their plaintext\
    \ password against the hash stored in our database.\n\n```\n 1 //we are going\
    \ to start with a default state\n 2 //of failure, always assume failure first\n\
    \ 3 $valid = FALSE;\n 4 \n 5 //grab the hash from our imaginary database\n 6 $user\
    \ = $db->user()-where(array(\n 7   'email' => $_POST['email']\n 8 ))->row();\n\
    \ 9 \n10 //now check to see if the login password matches\n11 $pass = $_POST['password'];\n\
    12 if (crypt($pass, $user->pass) === TRUE) {\n13   $valid = TRUE;\n14 }\n15 \n\
    16 //other checks, error handling, etc...\n17 \n18 if ($valid === TRUE) {\n19\
