- raw: "Next up you can expand on that a bit. Block based on IP. Only allow X number\
    \ of login attempts from a certain IP across all users instead of just each individual\
    \ user. Just be sure to include good error messages and reasonable access reinstatement\
    \ times, corporate users often share the same public IP address so you don’t want\
    \ to punish thousands of valid users due to one bad user if you can help it.\n\
    \nAlso note, the same logic applies to your API authentication. Don’t leave an\
    \ opening to attackers to simply take a different path to get the same result.\
    \ If you secure something on the frontend of your application and then expose\
    \ that same functionality through an API make sure to secure it just as well there.\n\
    \n### Upgrading Legacy Systems\n\nNow to the elephpant in the room. Get it? ElePHPant.\
    \ Yea, it’s been a long night, sorry. So how to you upgrade your existing system\
    \ that has MD5 passwords with no salt?\n\nI’m going to give you two options.\n\
    \n*   Path 1 - As each user logs in we will silently upgrade their hash to use\
    \ BCrypt. They won’t even know the difference. Soon enough you will have a database\
    \ of well secured passwords.\n\n*   Path 2 - Use BCrypt to hash the existing MD5\
    \ hashes that are in the database. New passwords will be hashed with MD5 first\
    \ and then BCrypt.\n\n#### Upgrade Path 1\n\nPath 1 is the traditional advice\
    \ for migrating to new authentication schemes and is by far the best option in\
    \ the majority of circumstances. To implement this you would do something similar\
    \ to this\n\n```\n 1 $valid = FALSE;\n 2 \n 3 //grab the password hash from our\
    \ imaginary databa\\\n 4 se\n 5 $user = $db->user()-where([\n 6   'email' => $_POST['email']\n\
    \ 7 ])->row();\n 8 \n 9 if ($user->pass_hash_algo === 'bcrypt') {\n10   //they\
    \ have previously logged in and\n11   //upgraded their hash so they're good\n\
    12   //proceed with verifying login as usual\n13 }\n14 else {\n15   //this is\
    \ modified from our old hash check\n16   $oldHash = md5($_POST['password']);\n\
    17 \n18   if ($oldHash === $user->pass) {\n19     //generate the new hash with\
    \ the plaintext\n20     //password they just gave us\n21     $newHash = password_hash($_POST['password']);\n\
    22 \n23     //save the new hash and flag to our database\n24     $user->pass =\
    \ $newHash;\n25     $user->pass_hash_upgraded = 'bcrypt';\n26     $user->save();\n\
    27 \n28     $valid = TRUE;\n29   }\n30 \n31   //other checks, error handling,\
    \ etc...\n32 }\n```\n\nWith this modified login system in place your users will\
    \ upgrade to the new hash automatically as they login. This upgrade path can easily\
    \ be modified throughout the years as the recommended hashing algorithms change.\
    \ In a few years SCrypt could be the accepted standard and it would be trivial\
    \ to upgrade users to that.\n\n#### Upgrade Path 2\n\nPath 2 isn’t as clean of\
    \ a solution but is immediately secure. Where Path 1 retains the insecure hashes\
    \ until each user logs in next this will secure your data right now so you don’t\
    \ have to lose any sleep tonight. With this path you will immediately re-hash\
    \ all current password hashes using BCrypt. Your new hashes are just BCrypt hashes\
    \ of MD5 hashes of the passwords. This complicates the process since you will\
    \ need to use both BCrypt and MD5 basically forever, this could become cumbersome\
    \ years from now when you’re SCrypting BCrypts of SHA1’d MD5 hashes.\n\nThis is\
    \ a two step process, first write a script to do basically the following and run\
    \ it against your current database. Please tell me you’re doing this with a database\
    \ dump and not on the prod server. Right? Cause that would make me sad… Also you\
    \ should add some type of status to each record while you do this. Basically just\
    \ use this as an example, no copy-pasting mmkay.\n\n```\n 1 $users = $db->users()->result();\n\
    \ 2 \n 3 foreach ($users as $user) {\n 4 \n 5   $newHash = password_hash($user->pass);\n\
    \ 6 \n 7   $user->pass = $newHash;\n 8   $user->save();\n 9 \n10 }\n```\n\nNow\
    \ that your database has been updated change your registration method to do this\n\
    \n```\n1 //hash it with MD5 then BCrypt\n2 $passHash = password_hash(md5($_POST['password']));\n\
    3 \n4 //this next part is just for demonstration\n5 $db = new ImaginaryDatabase;\n\
    6 $db->user()->create([\n7   'password' => $passHash\n8 ]);\n```\n\nThe login\
    \ method will need to check against an MD5 hashed password instead of the plaintext\
    \ as well\n\n```\n 1 //grab the hash from our imaginary database\n 2 $user = $db->user()-where([\n\
    \ 3   'email' => $_POST['email']\n 4 ])->row();\n 5 \n 6 //md5 hash the password\
    \ before we bcrypt it\n 7 $md5Pass = md5($_POST['password']);\n 8 \n 9 //now check\
    \ to see if the login password matches\n10 if (password_verify($md5Pass, $user->pass)\
    \ === TRU\\\n11 E) {\n12   $valid = TRUE;\n13 }\n14 \n15 //other checks, error\
    \ handling, etc...\n```\n\n#### It’s Over. We’re Safe.\n\nThat’s all folks. There’s\
    \ a ton more to cover as always but this is the need to know info. I’ll probably\
    \ end up writing additional chapters or a second volume to cover advanced topics\
    \ in more detail. Stay tuned for the next chapter, we’ll cover restricting URLs,\
    \ safely handling files, and ensuring that no one sees data they shouldn’t.\n\n\
    ### Resources\n\nIf all of this talk about cryptography has interested you I strongly\
    \ suggest you check out Bruce Schneider’s work. You should definitely read his\
    \ book, Applied Cryptography^([20](#chap06.xhtml#fn-appliedcrypto)), it is the\
    \ bible of crypto.\n\nI would also like to bring attention to the work that a\
    \ fellow member of the PHP community has been doing, Anthony Ferrara^([21](#chap06.xhtml#fn-ircmaxell))\
    \ championed the password\\_hash functionality integrated into the PHP core starting\
    \ with version 5.5. This was a huge step towards insuring we have secure PHP applications\
    \ by default in the future.\n\n## Chapter 4 - Authentication, Access Control,\
    \ and Safe File Handing\n\nErica works for a small, local manufacturing company\
    \ as their programmer and general IT person. She was recently tasked with developing\
    \ software for the office staff, to upgrade them to the digital age instead of\
    \ using paper records.\n\nThe first step was to have staff members scan documents\
    \ when they were finished with them. Instead of filing the paper forms, they would\
    \ be stored electronically.\n\nDevelopment of the archiving system proceeded well.\
    \ The system consisted of a basic database listing of all the documents, with\
    \ various filters such as department, date, tags, etc. Nothing too complex; Erica\
    \ wanted to keep it simple.\n\nThe documents displayed to users are filtered based\
    \ on the user’s department and their position (e.g., user, manager, director).\
    \ Everything worked well for several months, then it happened. There was a breach\
    \ of a secure document. The subsequent investigation determined a disgruntled\
    \ employee gained access to a file meant only for senior management. The employee\
    \ leaked the document to a competitor to secure a winning bid for a cushy position\
    \ for themselves at said company.\n\nSo how did it happen? Erica has been working\
    \ all weekend trying to figure it out, when boom, she finds it. It’s so obvious,\
    \ but she never thought to secure it.\n\nIn Erica’s system, files are uploaded\
    \ and named after the ID fields of their respective database records. An uploaded\
    \ PDF might be named “13424.pdf”, while the next file, a DOC for example, would\
    \ be named “13425.doc”, and so on. Erica had secured the document listing that\
    \ each user sees, but had not considered securing the files themselves when opened\
    \ or downloaded by the browser. There was no protection to stop a user from gaining\
    \ access to sensitive documents by simply guessing filenames by incrementing the\
    \ ID.\n\nThe stories are getting a little long, but if you’re committed enough\
    \ you can make any story work. I once told a woman I was Kevin Costner, and it\
    \ worked because I believed it.\n\n### Authentication\n\nThe first step to properly\
    \ handling sensitive data is authentication. You need to ensure that a user is\
    \ who they say they are.\n\nHere we will expand on the code samples from the last\
    \ chapter to validate a password, then denote for later use that the user has\
    \ a valid login."
  fmt: "\nNext up you can expand on that a bit. Block based on IP. Only allow X number\
    \ of login attempts from a certain IP across all users instead of just each each\
    \ individual user. Just be sure to include good error messages and reasonable\
    \ access reinstatement times, corporate users often share the same public IP address\
    \ so you don’t want to punish thousands of valid users due to one bad user if\
    \ you can help it.\n\nAlso note, the same logic applies to your API authentication.\
    \ Don’t leave an opening to attackers to simply take a different path to get the\
    \ same result. If you secure something on the frontend of your application and\
    \ then expose that same functionality through an API make sure to secure it just\
    \ as well there.\n\n## Upgrading Legacy Systems\n\nNow to the elephpant in the\
    \ room. Get it? ElePHPant. Yea, it’s been a long night, sorry. So how to you upgrade\
    \ your existing system that has `MD5` passwords with no salt?\n\nI’m going to\
    \ give you two options.\n\n- Path 1 - As each user logs in we will silently upgrade\
    \ their hash to use `BCrypt`. They won’t even know the difference. Soon enough\
    \ you will have a database of well secured passwords.\n- Path 2 - Use `BCrypt`\
    \ to hash the existing `MD5` hashes that are in the database. New passwords will\
    \ be hashed with `MD5` first and then `BCrypt`.\n\n### Upgrade Path 1\n\nPath\
    \ 1 is the traditional advice for migrating to new authentication schemes and\
    \ is by far the best option in the majority of circumstances. To implement this\
    \ you would do something similar to this\n\n```\n 1 $valid = FALSE;\n 2 \n 3 //grab\
    \ the password hash from our imaginary databa\\\n 4 se\n 5 $user = $db->user()-where([\n\
    \ 6   'email' => $_POST['email']\n 7 ])->row();\n 8 \n 9 if ($user->pass_hash_algo\
    \ === 'bcrypt') {\n10//they have previously logged in and\n11   //upgraded their\
    \ hash so they're good\n12   //proceed with verifying login as usual\n13 }\n14\
    \ else {\n15   //this is modified from our old hash check\n16   $oldHash = md5($_POST['password']);\n\
    17 \n18   if ($oldHash === $user->pass) {\n19     //generate the new hash with\
    \ the plaintext\n20     //password they just gave us\n21     $newHash = password_hash($_POST['password']);\n\
    22 \n23     //save the new hash and flag to our database\n24     $user->pass =\
    \ $newHash;\n25     $user->pass_hash_upgraded = 'bcrypt';\n26     $user->save();\n\
    27 \n28     $valid = TRUE;\n29   }\n30 \n31   //other checks, error handling,\
    \ etc...\n32 }\n```\n\nWith this modified login system in place your users will\
    \ upgrade to the new hash automatically as they login. This upgrade path can easily\
    \ be modified throughout the years as the recommended hashing algorithms change.\
    \ In a few years `SCrypt` could be the accepted standard and it would be trivial\
    \ to upgrade users to that.\n\n### Upgrade Path 2\n\nPath 2 isn’t as clean of\
    \ a solution but is immediately secure. Where Path 1 retains the insecure hashes\
    \ until each user logs in next this will secure your data right now so you don’t\
    \ have to lose any sleep tonight. With this path you will immediately re-hash\
    \ all current password hashes using `BCrypt`. Your new hashes are just `BCrypt`\
    \ hashes of `MD5` hashes of the passwords. This complicates the process since\
    \ you will need to use both `BCrypt` and `MD5` basically forever, this could become\
    \ cumbersome years from now when you’re `SCrypting` `BCrypt`s of `SHA1`’d `MD5`\
    \ hashes.\n\nThis is a two step process, first write a script to do basically\
    \ the following and run it against your current database. Please tell me you’re\
    \ doing this with a database dump and not on the prod server. Right? Cause that\
    \ would make me sad… Also you should add some type of status to each record while\
    \ you do this. Basically just use this as an example, no copy-pasting mmkay.\n\
    \n```\n 1 $users = $db->users()->result();\n 2 \n 3 foreach ($users as $user)\
    \ {\n 4 \n 5   $newHash = password_hash($user->pass);\n 6 \n 7   $user->pass =\
    \ $newHash;\n 8   $user->save();\n 9 \n10 }\n```\n\nNow that your database has\
    \ been updated change your registration method to do this\n\n```\n1 //hash it\
    \ with MD5 then BCrypt\n2 $passHash = password_hash(md5($_POST['password']));\n\
    3 \n4 //this next part is just for demonstration\n5 $db = new ImaginaryDatabase;\n\
    6 $db->user()->create([\n7   'password' => $passHash\n8 ]);\n```\n\nThe login\
    \ method will need to check against an `MD5` hashed password instead of the plaintext\
    \ as well\n\n```\n 1 //grab the hash from our imaginary database\n 2 $user = $db->user()-where([\n\
    \ 3   'email' => $_POST['email']\n 4 ])->row();\n 5 \n 6 //md5 hash the password\
    \ before we bcrypt it\n 7 $md5Pass = md5($_POST['password']);\n 8 \n 9 //now check\
    \ to see if the login password matches\n10 if (password_verify($md5Pass, $user->pass)\
    \ === TRUE) {\n12   $valid = TRUE;\n13 }\n14 \n15 //other checks, error handling,\
    \ etc...\n```\n"
  trans: "\n接下来，你可以对此进行扩展。基于 IP 的封禁：针对所有用户，限制特定 IP 仅允许 X 次登录尝试，而不是仅仅针对每个单独的用户。请务必包含友好的错误信息和合理的访问恢复时间；企业用户通常共享同一个公网\
    \ IP 地址，因此如果可能的话，你不希望因为一个坏用户而惩罚成千上万有效的用户。\n\n另外注意，同样的逻辑也适用于 API 身份验证。不要给攻击者留下通过不同路径获取相同结果的机会。如果你在应用程序的前端保护了某些内容，然后通过\
    \ API 暴露了相同的功能，请确保在后端也同样进行了安全保护。\n\n## 升级遗留系统\n\n现在来谈谈那个回避的问题（elephpant in the\
    \ room）。听懂了吗？ElePHPant。是的，这是一个漫长的夜晚，抱歉。那么，该如何升级你现有的带有无盐值 `MD5` 密码的系统呢？\n\n我将为你提供两个选项：\n\
    \n- 路径 1 - 当每个用户登录时，我们将静默地将他们的哈希升级为使用 `BCrypt`。他们甚至察觉不到区别。很快，你就会拥有一个安全性良好的密码数据库。\n\
    - 路径 2 - 使用 `BCrypt` 对数据库中现 `MD5` 哈希进行哈希。新密码将先用 `MD5` 哈希，然后再用 `BCrypt`。\n\n###\
    \ 升级路径 1\n\n路径 1 是迁移到新身份验证方案的传统建议，在大多数情况下是目前的最佳选择。要实现这一点，你需要执行类似下面的操作：\n\n```\n\
    \ 1 $valid = FALSE;\n 2 \n 3 //从我们虚拟的数据库中获取密码哈希\\\n4 se\n5 $user = $db->user()-where([\n\
    \ 6   'email' => $_POST['email']\n7 ])->row();\n 8 \n 9 if ($user->pass_hash_algo\
    \ === 'bcrypt') {\n10//他们之前登录过并且\n11   //升级了哈希，所以没问题\n12   //像往一样继续验证登录\n13 }\n\
    14 else {\n15   //这是基于我们的旧哈希检查修改的\n16   $oldHash = md5($_POST['password']);\n\
    17 \n18   if ($oldHash === $user->pass) {\n19     //使用他们刚刚提供的明文\\\n20     //密码生成新的哈希\n\
    21     $newHash = password_hash($_POST['password']);\n22 \n23     //将新哈希和标记保存到数据库中\n\
    24     $user->pass = $newHash;\n25     $user->pass_hash_upgraded = 'bcrypt';\n\
    26     $user->save();\n27 \n28     $valid = TRUE;\n29   }\n30 \n31   //其他检查、错误处理等...\n\
    32 }\n```\n\n部署了此修改后的登录系统后，你的用户将在登录时自动升级到新哈希。随着推荐的哈希算法不断，这一升级路径可以在多年后轻松修改。几年后，`SCrypt`\
    \ 可能会成为认可的标准，将用户升级到该标准将轻而易举。\n\n### 升级路径 2\n\n路径 2 的解决方案并不完美，但它可以立即实现安全。路径 1 在每个用户下次登录之前保留不安全的哈希，而这种方法会在现在就保护你的数据，让你今晚不必失眠。通过此路径，你将立即使用\
    \ `BCrypt` 对所有当前密码哈希重新哈希。你的新哈希只是密码的 `MD5` 哈希的 `BCrypt` 哈希。这增加了过程的复杂性，因为你基本上将永远都要同时使用\
    \ `BCrypt` 和 `MD5`，多年后当你需要对 `SHA1` 处理过的 `MD5` 哈希进行 `SCrypt` `BCrypt` 处理时，这可能会变得繁琐。\n\
    \n这是一个两步骤的过程，首先编写一个脚本执行以下操作，并在你当前的数据库上运行它。请告诉我你是在数据库备份上操作的，而不是在生产服务器上。对吧？否则我会难过的……另外，在执行此操作时，你应该为每条记录添加某种状态。基本上把这当作示例，不要直接复制粘贴好吗。\n\
    \n```\n 1 $users = $db->users()->result();\n 2 \n 3 foreach ($users as $user)\
    \ {\n 4 \n 5   $newHash = password_hash($user->pass);\n 6 \n 7   $user->pass =\
    \ $newHash;\n 8   $user->save();\n 9 \n10 }\n```\n\n现在你的数据库已经更新，更改你的注册方法执行以下操作：\n\
    \n```\n1 //先用 MD5 哈希再用 BCrypt\n2 $passHash = password_hash(md5($_POST['password']));\n\
    3 \n4 //后续部分仅用于演示\n5 $db = new ImaginaryDatabase;\n6 $db->user()->create([\n7\
    \   'password' => $passHash\n8 ]);\n```\n\n登录方法也需要检查 `MD5` 哈希过的密码，而不是明文：\n\n```\n\
    \ 1 //从我们虚拟的数据库中获取哈希\n 2 $user = $db->user()-where([\n 3   'email' => $_POST['email']\n\
    \ 4 ])->row();\n 5 \n 6 //在 bcrypt 之前对密码进行 md5 哈希\n 7 $md5Pass = md5($_POST['password']);\n\
    \ 8 \n 9 //现在检查登录密码是否匹配\n10 if (password_verify($md5Pass, $user->pass) === TRUE)\
    \ {\n12   $valid = TRUE;\n13 }\n14 \n15 //其他检查、错误处理等...\n```\n"
