    啊，老旧的 `SHA-1`，多年来一直既可靠又安全。这在现实世界中也是很多年了，在互联网领域那可是几十年。在 2005 年（2005 年是安全领域糟糕的一年），来自山东大学的研究人员发表了一篇论文，证明少于`2⁶⁹`
    次哈希操作即可可靠地生成 `SHA-1` 碰撞。大约`2⁸⁰` 次哈希操作的碰撞被认为在加密上是安全的。供参考，`2⁸⁰` 大约是 `1.20892x10²⁴`，所以“加密安全”意味着非常安全。从那时起摩尔定律确保了
    `SHA-1` 变得更加不安全，在任何需要真正安全的应用程序中应避免使用。


    正如我上面解释 `MD5` 时所说，当配合随机盐使用时，`SHA1` 在算法上仍然是安全的。


    ## SHA-256 / SHA-512


    `SHA-2` 标准于 2001 年作为 `SHA1` 的继任者引入。当 `SHA-1` 在 2005 年被证明是不安全的时，它的接受度略有所提高。`SHA256`
    和 `SHA512` 基本上是相同的；`SHA-256` 使用 32 位字，`SHA-512` 使用 64 位字。它们的轮数也不同。尽管如此，核心算法实际上是完全相同的。


    `SHA-2` 在在使用足够轮数（>64）时，目前被认为在加密上是安全的，没有已知的漏洞。


    它没有经历像 `Blowfish`（`BCrypt` 内部使用的加密算法）那样程度的严格审查。`Blowfish` 加密算法自 1991 年以来一直存在并被认为是安全的，但配合弱密钥使用它是一个已知的弱。基于加密算法为
    `BCrypt` 增加了一层额外的成本，使其优于标准的哈希算法，换句话说，`BCrypt` 在设计上更慢。慢是一件好事！


    尽管我推荐 `BCrypt`，但目前 `SHA-256` 或 `SHA-512` 在作为派生算法（如 `PBKDF2` 或用 PHP 的 `crypt()`
    函数实现的算法）的一部分时，是安全哈希的有效且安全的选项。


    ## BCrypt


    `BCrypt` 被许多人视为新手，并不那样广为人知。`BCrypt`于 1999 年发布，所以在这里并不算新。`BCrypt` 是一种基于 `Blowfish`
    加密算法的密钥派生函数，它是迭代的，因此它通过生成哈希相关的成本来防范暴力破解。


    尽管 `BCrypt` 引起了加密研究人员的极大关注，但目前还没有发布针对 `BCrypt` 的利用方法。它已经存在了很长时间，所以截至本文写作（2014
    年），`BCrypt` 被认为在加密上是安全的。


    `BCrypt` 对加密的明文密码确实有 72 字符的限制。这通常通过剔除多余字符或简单验证 72 为最大长度来考虑。


    在接下来的示例中，我们将密码选择 `BCrypt`。


    ## SCrypt


    `SCrypt` 是该领域的新秀。它于 2012 年发布，是一种内存密集型密钥派生函数。理论上，由于算法固有的高成本，`SCrypt` 比 `BCrypt`
    更安全，但由于它非常新，我个人并不推荐目前使用它。


    在加密世界中，新是一件坏事，意味着 `SCrypt` 没有像旧算法那样受到同等的攻击和审查。最近报告了几个利用方法，这并不意味着 `SCrypt` 不安全，但确实削弱了它理论上优于
    `BCrypt` 的安全优势。


    `SCrypt` 的一大优势是它被用于加密货币，目前流行的有 Litecoin 和 Dogecoin。这部分将很短。


    ## 存储


    在存储密码时，无论是使用关系型数据库还是文件系统，我们都会使用 `varchar(255)`。这是为了确保任何情况下都不会遇到 `varchar(72)`
    的限制。`BCrypt` 对加密的明文密码确实有 72 字符的限制。这通常通过剔除多余字符或简单验证 72 为最大长度来考虑。


    ## 验证


    在验证时，当配合随机盐使用时，`SHA1` 在算法上仍然是安全的。


    在验证时，我们需要对用户输入的密码进行哈希，并与存储的哈希进行对比。在安全的哈希安全的时，我们通常使用 `PBKDF2` 或用 PHP 的 `crypt()`
    函数实现的算法。


    在验证时，我们需要对用户插入密码进行哈希，并与存储的哈希进行对比。在安全的哈希安全的时，我们通常使用 `PBKDF2` 或用 PHP 的 `crypt()`
    函数实现的算法。

    '
