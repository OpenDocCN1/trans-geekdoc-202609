- raw: "```\n1 class User extends Eloquent {\n2 \n3   protected $table = 'users';\n\
    4 \n5   protected $guarded = ['permissions'];\n```\n\nThe choice is up to you,\
    \ depending on which is easier in your application.\n\nIf you don’t use Laravel,\
    \ your framework probably has a similar method of whitelisting/blacklisting mass\
    \ assignable fields. If you use a custom framework, get on implementing whitelists\
    \ and blacklists!\n\n### Typecasting\n\nOne additional step I like to take, not\
    \ just for security but also for data integrity, is to typecast known formats.\
    \ Since PHP is a dynamically typed language^([6](#chap06.xhtml#fn-dynatyped)),\
    \ a value can be any type: string, integer, float, etc. By typecasting the value,\
    \ we can verify that the data matches what we expect. In the previous example,\
    \ if the ID was coming from a variable it would make sense to typecast it if we\
    \ knew it should always be an integer, like this:\n\n```\n 1 $id = (int) 1001;\n\
    \ 2 \n 3 $db    = new PDO(...);\n 4 $query = $db->prepare('UPDATE users\n 5  \
    \ SET first_name = :first_name\n 6   WHERE id = :id');\n 7 \n 8 $query->execute([\n\
    \ 9   ':id'         => $id, //we know its an int\n10   ':first_name' => $_POST['first_name']\n\
    11 ]);\n```\n\nIn this case it wouldn’t matter much since we are defining the\
    \ ID ourselves, so we know its an integer. But if the ID came from a posted form\
    \ or another source, this would give us additional peace of mind.\n\nPHP supports\
    \ a number of types that you can cast to, they are\n\n```\n 1 $var = (array) $var;\n\
    \ 2 $var = (binary) $var;\n 3 $var = (bool) $var;\n 4 $var = (boolean) $var;\n\
    \ 5 $var = (double) $var;\n 6 $var = (float) $var;\n 7 $var = (int) $var;\n 8\
    \ $var = (integer) $var;\n 9 $var = (object) $var;\n10 $var = (real) $var;\n11\
    \ $var = (string) $var;\n```\n\nThis is helpful not only when dealing with your\
    \ database, but throughout your application. Just because PHP is dynamically typed\
    \ doesn’t mean that you can’t enforce typing in certain places. Yeah science!\n\
    \n### Sanitizing Output\n\n#### Outputting to the Browser\n\nNot only should you\
    \ take precautions when saving the data you take in, you should sanitize / escape\
    \ any user-generated data that is output back to the browser.\n\nYou can modify\
    \ and escape your data prior to saving to the database, or in between retrieving\
    \ it and outputting to the browser. It usually depends on how your data is edited\
    \ and used. For example, if the user is editing the data later, it usually makes\
    \ more sense to save it as-is, and sanitize upon output.\n\nWhat security benefits\
    \ come from escaping user-generated data that you output? Suppose a user submits\
    \ the following JavaScript snippet to your application, which saves it for outputting\
    \ later:\n\n```\n<script>alert('I am not sanitized!');</script>\n```\n\nIf you\
    \ don’t sanitize this code before you echo it out to the browser, the malicious\
    \ JavaScript will run normally, as if you wrote it yourself. In this case it’s\
    \ a harmless `alert()`, but a hacker won’t be nearly as kind.\n\nAnother popular\
    \ place for this type of exploit is in an image’s XIFF data. If a user uploads\
    \ an image and your application displays the XIFF data, it will need to be sanitized\
    \ as well. Anywhere you are displaying data that came into your app from the outside,\
    \ you need to sanitize it.\n\nIf you’re using a templating library or a framework\
    \ that handles templating, escaping may happen automatically, or there is a built-in\
    \ method for doing so. Make sure to check the documentation for your library /\
    \ framework of choice to determine how this works.\n\nFor those of you handling\
    \ this yourself, PHP provides a couple of functions that will be your best friends\
    \ when displaying data in the browser: `htmlentities()`^([7](#chap06.xhtml#fn-htmlent))\
    \ and `htmlspecialchars()`^([8](#chap06.xhtml#fn-htmlsc)). Both will escape and\
    \ manipulate data to make it safer before rendering.\n\n`htmlspecialchars()` should\
    \ be your go-to function in 90% of cases. It will look for characters with special\
    \ meaning (e.g., `<`, `>`, `&`) and encode these characters to HTML entities.\n\
    \n`htmlentities()` is like `htmlspecialchars()` on steroids. It will encode any\
    \ character into its HTML entity equivalent if one exists. This may or may not\
    \ be what you need in many cases. Make sure to understand what each one of these\
    \ functions does exactly, then evaluate which is best for the type of data you\
    \ are sending to the browser.\n\n#### Echoing to the Command Line\n\nDon’t forget\
    \ to sanitize the output of any command line script you are running. The functions\
    \ for this are `escapeshellcmd()`^([9](#chap06.xhtml#fn-esccmd)) and `escapeshellarg()`^([10](#chap06.xhtml#fn-escarg)).\n\
    \nThey are both pretty self-explanatory. Use `escapeshellcmd()` to escape any\
    \ commands that you are calling. This will prevent arbitrary commands from being\
    \ executed. `escapeshellarg()` is used to wrap arguments to ensure they are escaped\
    \ correctly, and don’t open your application up to manipulating the structure\
    \ of the commands.\n\n## Chapter Two - HTTPS/SSL/BCA/JWH/SHA and Other Random\
    \ Letters; Some of Them Actually Matter.\n\nOnce again, it’s time for a little\
    \ story. In October 2010 Eric Butler released a Firefox extension named Firesheep\
    \ to highlight a huge problem on the web that most people hadn’t been paying enough\
    \ attention to. Firesheep allowed any regular ol’ user to watch the non-encrypted\
    \ traffic on their local network and then hijack other user’s sessions. Firesheep\
    \ exploits a type of man in the middle attack, sidejacking. Sound scary? It should,\
    \ because it is. Maybe you’re thinking, well this is conjecture. Alright fine,\
    \ facts in. Let’s walk through an illustration to make the point.\n\nIt’s December\
    \ 2010, Jane is out of town on a work trip for Achme Inc and is staying at a Hilton\
    \ Garden Inn, it just so happens to be the same hotel that John is staying at.\
    \ John is in the running for a position that Jane is also trying to get. Jane\
    \ recently heard about Firesheep on the news and is in a mischievous mood. She\
    \ logs on to the hotel wifi and runs Firesheep. Luckily for Jane, John is using\
    \ the wifi and she sees that he has an unsecured connection to their company web\
    \ email portal. With one click she is now logged in to John’s email account. Just\
    \ take a second and think of the trouble she could cause him, the private things\
    \ she has access to, the general control/chaos email can exert in someone’s life.\n\
    \nThis type of exploit, session hijacking via unencrypted network traffic (aka\
    \ sidejacking), has always been possible by those that knew what they were doing.\
    \ Now with the release of Firesheep this is possible by anyone that knows how\
    \ to download an extension and click a button.\n\nWhile you go download Firesheep,\
    \ (yea thats right, I know what you’re doing you jerk) you might be thinking that\
    \ this is a horrible thing to happen. Quite the opposite actually, this has spurred\
    \ web companies to finally get off of their respective laurels and take HTTPS\
    \ seriously. Gmail, Facebook, and Twitter now all default to using HTTPS throughout\
    \ their entire site. Previously the standard had been to only encrypt login pages,\
    \ which secured the user’s login credentials but left their current session open\
    \ to hijacking as in our example above.\n\n### What is HTTPS\n\nNormal interweb\
    \ traffic is transferred over HTTP, when you type “http://www.google.com” into\
    \ your browser you’re using HTTP, notice the “http://” at the beginning there.\
    \ Normal HTTP traffic uses port 80, HTTPS on the other hand uses port 443. HTTP\
    \ is not secure in the least, every thing you do is sent free and clear for anyone\
    \ listening to see what you’re doing. HTTPS is “HTTP Secure” or “HTTP on SSL”,\
    \ acronym semantics can be argued but they both mean the same thing. HTTP using\
    \ SSL to secure it.\n\nI’m only going to cover how HTTPS works at a very high\
    \ level since the details won’t matter to most people. If you’re interested in\
    \ learning more please do, google.com is a good place to start ;)"
  fmt: "\n```php\nclass User extends Eloquent {\n  protected $table = 'users';\n \
    \ protected $guarded = ['permissions'];\n}\n```\n\nThe choice is up to you, depending\
    \ on which is easier in your application.\n\nIf you don’t use Laravel, your framework\
    \ probably has a similar method of whitelisting/blacklisting mass assignable fields.\
    \ If you use a custom framework, get on implementing whitelists and blacklists!\n\
    \n### Typecasting\n\nOne additional step I like to take, not just for security\
    \ but also for data integrity, is to typecast known formats. Since `PHP` is a\
    \ dynamically typed language, a value can be any type: string, integer, float,\
    \ etc. By typecasting the value, we can verify that the data matches what we expect.\
    \ In the previous example, if the `ID` was coming from a variable it would make\
    \ sense to typecast it if we knew it should always be an integer, like this:\n\
    \n```php\n$id = (int) 1001;\n\n$db    = new PDO(...);\n$query = $db->prepare('UPDATE\
    \ users\n  SET first_name = :first_name\n  WHERE id = :id');\n\n$query->execute([\n\
    \  ':id'         => $id, //we know its an int\n  ':first_name' => $_POST['first_name']\n\
    ]);\n```\n\nIn this case it wouldn’t matter much since we are defining the `ID`\
    \ ourselves, so we know its integer. But if the `ID` came from a posted form or\
    \ another source, this would give us additional peace of mind.\n\n`PHP` supports\
    \ a number of types that you can cast to, they are\n\n```php\n$var = (array) $var;\n\
    $var = (binary) $var;\n$var = (bool) $var;\n$var = (boolean) $var;\n$var = (double)\
    \ $var;\n$var = (float) $var;\n$var = (int) $var;\n$var = (integer) $var;\n$var\
    \ = (object) $var;\n$var = (real) $var;\n$var = (string) $var;\n```\n\nThis is\
    \ helpful not only when dealing with your database, but throughout your application.\
    \ Just because `PHP` is dynamically typed doesn’t mean that you can enforce typing\
    \ in certain places. Yeah science!\n\n### Sanitizing Output\n\n#### Outputting\
    \ to the Browser\n\nNot only should you take precautions when saving the data\
    \ you take in, you should sanitize / escape any user-generated data that is output\
    \ back to the browser.\n\nYou can modify and escape your data prior to saving\
    \ to the database, or in between retrieving it and outputting to the browser.\
    \ It usually depends on how your data is edited and used. For example, if the\
    \ user is editing the data later, it usually makes more sense to save it as-is,\
    \ and sanitize upon output.\n\nWhat security benefits come from escaping user-generated\
    \ data that you output? Suppose a user submits the following JavaScript snippet\
    \ to your application, which saves it for outputting later:\n\n```html\n<script>alert('I\
    \ am not sanitized!');</script>\n```\n\nIf you don’t sanitize this code before\
    \ you `echo` it out to the browser, the malicious JavaScript will run normally,\
    \ as if you wrote it yourself. In this case it’s a harmless `alert()`, but a hacker\
    \ won’t be nearly as kind.\n\nAnother popular place for this type of exploit is\
    \ in an image’s XIFF data. If a user uploads an image and your application displays\
    \ the XIFF data, it will need to be sanitized as well. Anywhere you are displaying\
    \ data that came into your app from the outside, you need to sanitize it.\n\n\
    If you’re using a templating library or a framework that handles templating, escaping\
    \ may happen automatically, or there is a built-in method for doing so. Make sure\
    \ to check the documentation for your library / framework of choice to determine\
    \ how this works.\n\nFor those of you handling this yourself, `PHP` provides a\
    \ couple of functions that will be your best friends when displaying data in the\
    \ browser: `htmlentities()` and `htmlspecialchars()`. Both will escape and manipulate\
    \ data to make it safer before rendering.\n\n`htmlspecialchars()` should be your\
    \ go-to function in 90% of cases. It will look for characters with special meaning\
    \ (e.g., `<`, `>`, `&`) and encode these characters to HTML entities.\n\n`htmlentities()`\
    \ is like `htmlspecialchars()` on steroids. It will encode any character into\
    \ its HTML entity equivalent if one exists. This may or may not be what you need\
    \ in many cases. Make sure to understand what each one of these functions does\
    \ exactly, then evaluate which is best for the type of data you are sending to\
    \ the browser.\n\n#### Echoing to the Command Line\n\nDon’t forget to sanitize\
    \ the output of any command line script you are running. The functions for this\
    \ are `escapeshellcmd()` and `escapeshellarg()`.\n\nThey are both pretty self-explanatory.\
    \ Use `escapeshellcmd()` to escape any commands that you are calling. This will\
    \ prevent arbitrary commands from being executed. `escapeshellarg()` is used to\
    \ wrap arguments to ensure they are escaped correctly, and don’t open your application\
    \ up to manipulating the structure of the commands.\n\n## Chapter Two - HTTPS/SSL/BCA/JWH/SHA\
    \ and Other Random Letters; Some of Them Actually Matter.\n\nOnce again, it’s\
    \ time for a little story. In October 2010 Eric Butler released a Firefox extension\
    \ named Firesheep to highlight a huge problem on the web that most people hadn’t\
    \ been paying enough attention to. Firesheep allowed any regular ol’ user to watch\
    \ the non-encrypted traffic on their local network and then hijack other user’s\
    \ sessions. Firesheep exploits a type of man in the middle attack, sidejacking.\
    \ Sound scary? It should, because it is. Maybe you’re thinking, well this is conjecture.\
    \ Alright fine, facts in. Let’s walk through an illustration to make the point.\n\
    \nIt’s December 2010, Jane is out of town on a work trip for Achme Inc and is\
    \ staying at a Hilton Garden Inn, it just so happens to be the same hotel that\
    \ John is staying at. John is in the running for a position that Jane is also\
    \ trying to get. Jane recently heard about Firesheep on the news and is in a mischievous\
    \ mood. She logs on to the hotel wifi and runs Firesheep. Luckily for Jane, John\
    \ is using the wifi and she sees that he has an unsecured connection to their\
    \ company web portal. With one click she is now logged in to John’s email account.\
    \ Just take a second and think of the trouble she could cause him, the private\
    \ things she has access to, the general control/chaos email can exert in someone’s\
    \ life.\n\nThis type of exploit, session hijacking via unencrypted network traffic\
    \ (aka sidejacking), has always been possible by those that knew what they were\
    \ doing. Now with the release of Firesheep this is possible by anyone that knows\
    \ how to download an extension and click a button.\n\nWhile you go download Firesheep,\
    \ (yea thats right, I know what you’re doing you jerk) you might be thinking that\
    \ this is a horrible thing to happen. Quite the opposite actually, this has spurred\
    \ web companies to finally get off their respective laurels and take HTTPS seriously.\
    \ Gmail, Facebook, and Twitter now all default to using HTTPS throughout their\
    \ site. Previously the standard had been to only encrypt login pages, which secured\
    \ the user’s login credentials but left their current session open to hijacking\
    \ as in our example above.\n\n### What is HTTPS\n\nNormal interweb traffic is\
    \ transferred over HTTP, when you type `http://www.google.com` into your browser\
    \ you’re using HTTP, notice the `http://` at the beginning there. Normal HTTP\
    \ traffic uses port `80`, HTTPS on the other hand uses port `443`. HTTP is not\
    \ secure in the least, every thing you do is sent free and clear for anyone listening\
    \ to see what you’re doing. HTTPS is “HTTP Secure” or “HTTP on SSL”, acronym semantics\
    \ can be argued but they both mean the same thing. HTTP using SSL to secure it.\n\
    \nI’m only going to cover how HTTPS works at a very high level since the details\
    \ won’t matter to most people. If you’re interested in learning more please do,\
    \ google.com is a good place to start ;)\n"
  trans: "\n\n```php\nclass User extends Eloquent {\n  protected $table = 'users';\n\
    \  protected $guarded = ['permissions'];\n}\n```\n\n选择取决于你，取决于在你的应用程序中哪种更方便。\n\
    \n如果你没有使用 Laravel，你的框架可能有类似的方法来对批量赋值字段进行白名单/黑名单处理。如果你使用的是自定义框架，快开始实现白名单和黑名单机制吧！\n\
    \n### 类型转换 (Typecasting)\n\n我喜欢采取的另一个额外步骤，不仅是为了安全，还为了数据完整性，就是对已知的格式进行类型转换。由于 `PHP`\
    \ 是一门动态类型语言，值可以是任何类型：字符串、整数、浮点数等。通过对该值进行类型转换，我们可以验证数据是否符合我们的预期。在之前的示例中，如果 `ID`\
    \ 来自一个变量，那么如果我们知道它应该始终是一个整数，那么对其进行类型转换是有意义的，如下：\n\n```php\n$id = (int) 1001;\n\
    \n$db    = new PDO(...);\n$query = $db->prepare('UPDATE users\n  SET first_name\
    \ = :first_name\n  WHERE id = :id');\n\n$query->execute([\n  ':id'         =>\
    \ $id, //我们知道它是 int\n  ':first_name' => $_POST['first_name']\n]);\n```\n\n在这种情况下，这并不重要，因为我们是自己定义\
    \ `ID` 的，所以我们知道它是整数。但如果 `ID` 来自提交的表单或其他来源，这将带给我们额外的安全感。\n\n`PHP` 支持许多你可以转换的类型，它们是：\n\
    \n```php\n$var = (array) $var;\n$var = (binary) $var;\n$var = (bool) $var;\n$var\
    \ = (boolean) $var;\n$var = (double) $var;\n$var = (float) $var;\n$var = (int)\
    \ $var;\n$var = (integer) $var;\n$var = (object) $var;\n$var = (real) $var;\n\
    $var = (string) $var;\n```\n\n这不仅在处理数据库时有用，在整个应用程序中都是如此。仅仅因为 `PHP` 是动态类型的，并不意味着你可以在某些地方强制执行类型。没错，科学就是！\n\
    \n### 输出过滤 (Sanitizing Output)\n\n#### 输出到浏览器\n\n不仅在保存输入的数据时你应该采取措施，你还应该对输出回浏览器的任何用户生成的数据进行过滤/转义。\n\
    \n你可以在保存到数据库之前修改并转义你的数据，也可以在检索数据和输出到浏览器之间进行处理。这通常取决于你的数据如何被编辑和使用。例如，如果用户以后要编辑数据，那么通常原样保存它更有意义，并在输出时进行过滤。\n\
    \n转义你输出的用户生成数据可以带来哪些安全益处？假设用户向你的应用程序提交了以下 JavaScript 代码段，你的应用程序将其保存以备后输出：\n\n\
    ```html\n<script>alert('I am not sanitized!');</script>\n```\n\n如果你在将它 `echo`\
    \ 到浏览器之前不对这段代码进行过滤，恶意的 JavaScript 将正常运行，就像是你自己写的一样。在这种情况下，只是一个无害的 `alert()`，但黑客不会那么仁慈。\n\
    \n此类攻击的另一个常见地方是在图片的 XIFF 数据中。如果用户上传了图片，而你的应用程序显示了 XIFF 数据，那么它也需要被过滤。在任何你显示从外部进入你的应用程序数据的地方，你都需要对它进行过滤。\n\
    \n如果你在使用模板库或处理模板的框架，转义可能会自动发生，或者有内置方法来这样做。请确保检查你所选择的库/框架的文档，以确定它是如何工作的。\n\n对于那些自己处理这些工作的人，`PHP`\
    \ 提供了几个函数，在输出数据时对你很有用：`htmlentities()` 和 `htmlspecialchars()`。它们会将数据转换为 HTML 实体，以防止恶意脚本执行。这在处理数据库时有用，在整个应用程序中都是如此。\n\
    \n#### 输出到命令行\n\n在输出到命令行时你也应该考虑安全，这些函数是 `escapeshellcmd()` 和 `escapeshellarg()`。\n\
    \n 第二章 - HTTPS/SSL/BCA/SHA/Some of Them Actually Matter\n\n再次提到，这发生在 2010 年，让我们通过一个小故事来说明这一点。\n\
    \n它是 2010 年 12 月，Jane 为 Ach Inc 公司出差，住在希 Garden 酒店，恰好也是 John 住的同一家酒店。Jane 最近听说了关于\
    \ Firesheep 的新闻，心情很奇怪。她连接了酒店的 Wi-Fi 并运行了 Firesheep。幸运的是 Jane，John 正在使用 Wi-Fi，她看到他连接到了未安全的公司门户网站。只需点击一下，她就登录了\
    \ John 的邮箱账户。只需想一下她可能给他带来的麻烦，她可以访问的隐私信息，邮箱对他生活可能造成的通用控制/混乱。\n\n这种攻击通过未加密的网络流量进行会话劫持（即\
    \ sidejacking），一直以来对于如何操作的人是可能的。现在随着 Firesheep 的发布，任何知道如何下载扩展并点击按钮的人都可以做到。\n\n\
    听起来很可怕吗？确实应该，因为它是。也许你正在想，这真的是件糟糕的事情。事实恰恰相反，这促使网络公司终于从过去的成就中恢复过来，认真对待 HTTPS。Gmail、Facebook\
    \ 和 Twitter 现在都默认在整个站点使用 HTTPS。以前的标准只是加密登录页面，这保护了用户的登录凭据，但让他们的当前会话处于被劫持的风险之中，正如上面的。\n\
    \n### 什么是 HTTPS\n\n普通的网页流量通过 HTTP 传输，当你在浏览器中输入 `http://www.google.com` 时，你使用的是\
    \ HTTP，注意开头的 `http://`。普通的 HTTP 流量使用端口 `80`，HTTPS 反之使用端口 `443`。HTTP 一点也不安全，你所做的一切都是明文发送的，任何监听者都能看到你的。HTTPS\
    \ 是“安全的 HTTP”或“在 SSL 上的 HTTP”，缩写语义可以争论，但它们的意思相同。\n\n我将仅在非常高水平上涵盖 HTTPS 如何工作，因为细节对大多数人来说并不重要。如果你感兴趣了解更多，请这样做，google.com\
    \ 是一个很好的开始 ;)\n\n"
