- raw: "This will require OpenSSL, if you don’t have it on your server you’ll need\
    \ to install it. Installing applications across various server operating systems\
    \ and distributions are out of the scope of this book, hopefully if your at the\
    \ point of needing to setup HTTPS you know your way around your server well. If\
    \ you don’t know your server operating system or distribution well it might be\
    \ a good idea to hire someone to help you setup SSL certificates.\n\nFirst create\
    \ a directory to store your keys, people have differing opinions on the best place\
    \ to store these but for our examples we’ll stick with\n\n```\n/usr/bin/ssl/\n\
    ```\n\nLet’s generate our private RSA key\n\n```\n$ openssl genrsa -out yourApp.key\
    \ 1024\n```\n\nThen generate the CSR using the RSA key\n\n```\n$ openssl req -new\
    \ -key yourApp.key -out yourApp.c\\\nsr\n```\n\nYou’ll now be asked several questions\
    \ with smart defaults, the main one to pay attention to is “Common Name” which\
    \ should match your domain name, eg “yourApp.com”.\n\nNow you have two new files\n\
    \n```\n/usr/bin/ssl/yourApp.key\n/usr/bin/ssl/yourApp.csr\n```\n\nBefore you do\
    \ anything else, make a backup copy of the .key file somewhere. Seriously, make\
    \ two backup copies. If you lose the private key you’ll need to buy a new certificate,\
    \ and servers crash all the time.\n\n#### Obtaining a SSL Certificate\n\nThe first\
    \ step to getting up and running on HTTPS is to obtain a certificate. There are\
    \ cheap/free certificates available from some certificate authorities but they\
    \ won’t come pre-installed on the popular web browsers so that makes them useless\
    \ for external facing sites. If you’re running an internal application then cheap\
    \ alternatives and self signed certificates are valid options, for everyone else\
    \ we’ll need to purchase a certificate.\n\nFirst off I recommending checking with\
    \ your DNS provider to see if they offer any type of discounted or easy to setup\
    \ certificates, for example DNSimple is the DNS provider I use and they offer\
    \ subscription payments for certificates at a large discount.\n\nIf your DNS providers\
    \ does not provide certificates Symantec/VeriSign is a well respected certificate\
    \ authority.\n\nNow go buy one.\n\nYou’ll then need to walk through whatever process\
    \ your chosen Certificate Authority has in place for setting up your certificate,\
    \ usually you’ll just upload your server certificate (yourApp.csr) and they will\
    \ email you the signed certificate.\n\nYour certificate authority will provide\
    \ you with the sign certificate which we’ll name yourAppSigned.crt. Copy this\
    \ to your server, for this example I’ll use the following path\n\n```\n/usr/bin/ssl/yourAppSigned.crt\n\
    ```\n\n#### Apache Setup\n\nIf you’re using Apache follow these steps, if you’re\
    \ using a different web server skip this section and keep reading. Open your httpd.conf\
    \ file in your favorite text editor. Note, some distros may use separate config\
    \ files for https. For example, my laptop running OSX uses a httpd-ssl.conf file.\n\
    \nAdd a VirtualHost similar to the following, it will likely closely match your\
    \ existing VirtualHost for your HTTP site\n\n```\n1 <VirtualHost *:443>\n2   DocumentRoot\
    \ \"/path/to/your/app/htdocs\"\n3   ServerName yourApp.com\n4   SSLEngine on\n\
    5   SSLCertificateFile /usr/bin/ssl/yourAppSigned.crt\n6   SSLCertificateKeyFile\
    \ /usr/bin/ssl/yourApp.key\n7 </VirtualHost>\n```\n\nRestart Apache\n\n```\n$\
    \ apachectrl restart\n```\n\nor\n\n```\n$ service apache restart\n```\n\nwill\
    \ usually do the trick.\n\nTry your site out with “https://yourApp.com”, you should\
    \ be good to go!\n\n#### Nginx Setup\n\nIf you’re using NGINX follow these steps,\
    \ if you’re using a different web server you’ll need to research how to set this\
    \ up with your server, sorry!\n\nOpen your Nginx virtual hosts file in your favorite\
    \ text editor. Add a virtual host similar to the following, it should closely\
    \ match your existing site setup\n\n```\n 1 server {\n 2 \n 3   listen   443;\n\
    \ 4 \n 5   server_name yourApp.com;\n 6   location / {\n 7     root   /path/to/your/app/htdocs;\n\
    \ 8     index  index.php;\n 9   }\n10 \n11   ssl    \t\t\t\t  on;\n12   ssl_certificate\
    \ \t  /usr/bin/ssl/yourAppSigned.crt\n13   ssl_certificate_key   /usr/bin/ssl/yourApp.key\n\
    14 \n15 }\n```\n\nRestart Nginx\n\n```\n$ sudo /etc/init.d/nginx restart\n```\n\
    \nor\n\n```\n$ service nginx restart\n```\n\nwill usually handle it.\n\nTry your\
    \ site out with “https://yourApp.com”, it should be ready!\n\n#### Additional\
    \ Resources\n\nFor Apache the best source is the docs\n\n```\nhttp://httpd.apache.org/docs/current/ssl/ssl_howto\\\
    \n.html\n```\n\nFor NGINX the WIKI is a great starting place\n\n```\nhttp://wiki.nginx.org/HttpSslModule\n\
    ```\n\nFor anything else just replace “yourWebServerName” in the text below with\
    \ the name of the software your using to serve web pages, then paste the full\
    \ URL into your web browser\n\n```\nhttp://lmgtfy.com/?q=yourWebServerName+SSL+certifi\\\
    \ncate+setup\n```\n\n### Paths\n\n#### Base Path\n\nYou should ensure that users\
    \ are on the HTTPS version of your site whenever it is needed. This can be done\
    \ in Apache/Nginx configs using redirects. Another simpler option is to set the\
    \ base path of your application to use your HTTPS URL, eg “https://yourApp.com”\
    \ and force a redirect using the base path if a user comes in on HTTP.\n\nA lot\
    \ of times you will want to allow HTTP on certain pages and require HTTPS on others,\
    \ this is where your web server configs and proper routing in your code come in.\n\
    \n#### Relative Paths\n\nOne more thing to mention that isn’t necessarily security\
    \ related but will make your life a lot easier when using both HTTP and HTTPS\
    \ on one site. URLs for assets, eg CSS or JS, can begin with double forward slashes\
    \ instead of http:// or https:// to reference the current protocol. For example,\
    \ on your home page you might have\n\n```\n<link type=\"text/css\" rel=\"stylesheet\"\
    \ href=\"//ass\\\nets/main.css\" />\n```\n\nnavigating to https://yourApp.com\
    \ would cause this to load\n\n```\nhttps://yourApp.com/assets/main.css\n```\n\n\
    whereas navigating to http://yourApp.com would load\n\n```\nhttp://yourApp.com/assets/main.css\n\
    ```\n\nThat’s just a little trick to make your life a little easier, because I\
    \ care.\n\n#### Done\n\nYou are done, good job. Pat yourself on the back, mix\
    \ your favorite drink, and take a well deserved nap.\n\n## Chapter 3 - Password\
    \ Encryption and Storage for Everyone\n\nYou should know how this works by now.\
    \ Chris is a junior developer working for Marvel Comics^([12](#chap06.xhtml#fn-marvel))\
    \ web team. It’s an abnormally hot summer in Burbank. He has just been tasked\
    \ with building the login functionality for the new web/tablet comic portal his\
    \ team is building. His “team” really means Chris and the other developer. Chris\
    \ might have forgotten to wear deodorant today, why is it so hot.\n\nChris plans\
    \ out how the login system will work. It’ll have the normal things you would expect,\
    \ login/logout/forgot password/etc… In regards to passwords he’ll need to store\
    \ the user’s password, compare it on login, and then email it back to the user\
    \ if they forget it. Minutes pass. As he thinks through each part of the login\
    \ process he starts to worry about the security implications of having users’\
    \ passwords available to read by anyone who has, or gains, access to the database.\
    \ He knows he should encrypt the passwords but what about decrypting for login?\
    \ Or when a user forgets their password?\n\nAfter researching for an excruciatingly\
    \ boring 45 minutes Chris decides that he needs to use PHP’s built in `mcrypt_encrypt()`\
    \ and `mcrypt_decrypt()` methods. Chris is pretty stoked, secure encrypted passwords\
    \ and all the dirty work on encrypting and decrypting is done by PHP. He’s going\
    \ to be done with this project in half the time quoted.\n\nThat my friends (we’re\
    \ friends right?), is why when you reset your password on Marvel.com you get your\
    \ plain-text password sent to you in an email. AN EMAIL. WITH YOUR PASSWORD IN\
    \ IT. This is why you should go change your Marvel.com password to something you\
    \ have never used anywhere else right now. Go ahead, I’ll wait. I’ll just be sobbing\
    \ in the corner thinking about all of the people that will be exploited by this\
    \ soon enough."
