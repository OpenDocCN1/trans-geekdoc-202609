    \ by a strong algorithm and keys.\n\nA certificate authority will sign your website’s\
    \ certificate to prove that it is valid. The user’s web browser already knows\
    \ the major certificate authorities and will verify the sites certificate against\
    \ the root certificate that the certificate authority provides. The traffic will\
    \ then be encrypted with this key on both ends, so the only traffic going across\
    \ the network is encrypted traffic. If you’ve ever used `SSH` with public keys\
    \ for authentication you are already familiar with the process. You have a public\
    \ and private key that is used to verify your identity with a remote server.\n\
    \nThis will protect you from man in the middle attacks, including the session\
    \ hijacking we mentioned above if all of your site is encrypted with `HTTPS`.\n\
    \n## Limitations\n\nThere are a few limitations when using `HTTPS` that may make\
    \ it infeasible in certain circumstances.\n\n### Virtual Hosts\n\nUnder normal\
    \ configurations virtual hosts can not be used with `SSL`. This is a problem if\
    \ you’re using shared hosting or simply running multiple sites on the same server.\
    \ The reason for this is because the server can’t determine the host header until\
    \ the connection has been completed, which requires the `SSL` authentication.\
    \ Since certificates can only have one host this means it will simply not work.\
    \ The easiest way around this is to setup multiple IP addresses and use IP based\
    \ hosts instead of the name based host resolution you’re probably used to. I usually\
    \ recommend setting up a separate server for secure sites though, if you need\
    \ `HTTPS` you are probably at the point of needing a dedicated server as well.\n\
    \nThere are however some hosting providers with shared certificates that can be\
    \ used across the sites hosted with them. This can enable you to quickly and cheaply\
    \ support `HTTPS`. The main issue with this is that the domain would need to reflect\
    \ the hosting provider’s domain name. For example instead of\n\n```\nhttps://yourApp.com/login\n\
    ```\n\nthe URL would be something like\n\n```\nhttps://yourHost.com/yourApp/login\n\
    ```\n\nThis may or or may not be a concern depending on your application and branding\
    \ needs.\n\n### Speed\n\n`HTTPS` connections require `SSL` handshakes to establish\
    \ the connection, thus making the overall transfer slower. Once that initial handshake\
    \ is performed additional connections only require the encryption and decryption\
    \ of the content, meaning that once the initial connection is complete, subsequent\
    \ connections aren’t much slower. The performance impact is `incredibly` low though,\
    \ this is not a valid reason to discredit the use of `HTTPS`.\n\n### Caching\n\
    \nCheddar. Fat stacks. Dead Presidents. Cash money. Nah, actually we’re talking\
    \ about cache. The secret sauce behind your super quick load times. You have to\
    \ say it with a british accent. Modern browsers will cache `HTTPS` content the\
    \ same as `HTTP` content so there is no disconnect there. To cause older browser\
    \ to support caching set the `Cache-Control` header, for example\n\n```\nheader('Cache-Control:\
    \ max-age=31536000');\n```\n\nwould tell the browser to cache for one year.\n\n\
    The real issue comes with proxy caching. Proxy caching might come from an `ISP`\
    \ or a service meant to speed up connections. This is mostly used in rural parts\
    \ of the world that have slow internet connection speeds. Using `HTTPS`, usingHTTPS``\
    \ that is is that that is ` is ` `, `consider``. ` ` is ` `HTTPS, for example,\
    \ sit down and plan out which parts of your site should be encrypted.\n\n### Certificate\
    \ Types\n\nThere are two types of `SSL`.\n\n`Domain Validated Certificates` do\
    \ not verify as much information as they are substantially cheaper. Usually starting\
    \ fifty dollars, they will likely be the best option for small sites. The main\
    \ downside from user perspective is that they might only show lock symbol while\
    \ `Extended Validation Certificate` will show full address bar.\n\n`Extended Validation\
    \ Certificates` are the gold standard of `SSL`. They not only validate that you\
    \ are the owner of the domain but also verify the identify and legitimacy of the\
    \ domain owner. Since this usually requires a personal effort on the part of the\
    \ Certificate Authority these certificates are significantly more expensive. Usually\
    \ starting around five hundred dollars. \n\n## When to use HTTPS\n\nThe traditional\
    \ view has been to use `HTTPS` anywhere credentials or other sensitive data is\
    \ passed to the server. For many years this meant that login pages and shopping\
    \ carts were all that was encrypted. These are still valid and necessary places\
    \ to use encryption but will leave the rest of the user’s session open to man\
    \ in the middle attacks. Recently there has been a movement to use `HTTPS` everywhere.\
    \ Which is just a marketed way of stating that every page of your site would be\
    \ encrypted.\n\nRegardless of you constraints you have an obligation to your users\
    \ to implement the best security you possibly can. If you run a shopping cart\
    \ or collect credit cards for instance, `HTTP` is not even an option. More and\
    \ more even for what isn’t considered sensitive data, like a social media account,\
    \ it is becoming standard to encrypt.\n\n## Implementing HTTPS\n\n#### What kind\
    \ of SSL Certificate do I need?\n\nThe main question to ask yourself is do you\
    \ need to secure subdomains or not. If you need to secure multiple subdomains,\
    \ eg\n\n```\napi.yourApp.com\ndocs.yourApp.com\nyourMom.yourApp.com\ncart.yourApp.com\n\
    ```\n\nthen you’ll need a `Wildcard SSL Certificate`. If you don’t need that capability\
    \ and only need to secure something like the```\nyourApp.com\n```\n\nthen a standard\
    \ certificate will work just fine. The only deterrent to getting the Wildcard\
    \ just in case you need it later is the cost.\n\n#### Generating your Server Certificate\n\
    \nIn order for the Certificate Authority to sign and generate your certificate\
    \ you’ll need to generate keys on your server and then upload those to the Certificate\
    \ Authority.\n"
