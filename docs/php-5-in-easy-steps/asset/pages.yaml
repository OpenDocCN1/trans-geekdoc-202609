- pgno: 29
  md: "# Multiple functions\n\nPHP functions may call other functions during the execution\
    \ of their code in just the same way that the previous examples called the echo()\
    \ function.\n\nThe following example demonstrates the use of multiple functions\
    \ to manipulate and display an integer value.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_29_0.png)\n\
    \n```\n<?php\nfunction show_number($num) {\n    $new_number = make_double($num);\n\
    \    echo(\"The value is $new_number\");\n}\n\nfunction make_double($arg) {\n\
    \    return $arg + $arg;\n}\n```\n\nNote the code format of this example - when\
    \ defining functions, the source code is clearer if all declarations appear before\
    \ any HTML or page content.\n\n```\n<html><head><title>PHP Functions</title></head>\n\
    <body>\n<h3><?php show_number(4); ?></h3>\n</body>\n</html>\n```\n\nThe argument\
    \ value is passed from the calling statement to the make_double() function via\
    \ the show_number() function. The passed argument value is doubled, then the result\
    \ is returned to a variable in the show_number() function. Finally the echo()\
    \ function is called to write the new value out the page.\n\n| PHP Functions |\n\
    \ File | Edit | View | Favorites | Tools | Help |\n| Address | http://localhost/functions.php\
    \ | Go |\n| The value is 8 |\n| Done | Local intranet |"
