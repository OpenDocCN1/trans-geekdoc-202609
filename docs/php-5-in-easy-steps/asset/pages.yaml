- pgno: 115
  md: '# Enabling PHP email


    PHP must be configured correctly in the php.ini file with the details of how your
    system sends email. Open php.ini in a text editor, then find the section headed
    "[mail function]".


    Windows users should ensure that two directives are supplied: the first is called
    SMTP (Simple Mail Transfer Protocol) and defines your email server address; the
    second is called sendmail_from and defines your own email address.


    The configuration for Windows should look something like this:


    ![](img/7faa63a7fa0add8f53300594ebae949f_115_0.png)


    ```

    [mail function]

    ; For win32 only.

    SMTP = smtp.ntworld.com


    ; For win32 only.

    sendmail_from = user@ntworld.com

    ```


    ![](img/7faa63a7fa0add8f53300594ebae949f_115_1.png)


    Linux users simply need to let PHP know the location of their sendmail application.
    The path, and any desired switches, should be specified to the "sendmail_path"
    directive.


    The configuration for Linux should look something like this:


    ![](img/7faa63a7fa0add8f53300594ebae949f_115_2.png)


    ```

    ; For Unix only. You may supply arguments as well

    (default: ''sendmail -t -i'').

    sendmail_path = sendmail -t -i

    ```'
  merge: -1
  img_proc: true
