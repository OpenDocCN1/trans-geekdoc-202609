  md: '# # Introducing databases


    Databases are simply containers that store data in a structured manner. Every
    database is composed of one or more tables, which structure the data into organized
    rows and columns. This makes it easier to reference and manipulate the data.


    Each database table column has a label to identify the data stored within the
    cells in that column. Each row contains an entry called a “record,” which places
    data in each cell along that row.


    A typical database table looks like this:


    | member_id | fname | lname | tel | email |

    |---|---|---|---|---|

    | 1 | John | Smith | 555-1234 | john@mail.com |

    | 2 | Anne | Jones | 555-5678 | anne@mail.com |

    | 3 | Mike | McGrath | 555-3456 | mike@mail.com |


    ![](img/7faa63a7fa0add8f53300594ebae949f_129_0.png)


    The rows of a database table are not automatically arranged in any particular
    order. It is important'
  merge: -1
  img_proc: true
