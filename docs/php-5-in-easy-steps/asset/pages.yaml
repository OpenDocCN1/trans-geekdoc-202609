- pgno: 117
  md: '# Sending plain text email


    The PHP() function makes it easy to send email from scripts. This function requires
    three mandatory arguments to specify the recipient''s email address, the subject
    of the message, and finally the message itself. So the mail() function syntax
    looks like this:


    ```

    mail( to, subject, message );

    ```


    As soon as the mail() function is called, PHP will attempt to send the email,
    and return true if it was successful, or false if it failed.


    Multiple recipients can be specified by using a comma-separated list as the first
    argument to the mail() function.


    The example that follows is a form handler for the feedback form created on the
    previous page. It assigns the recipient''s address and a subject title to two
    variables. The user''s entry into the feedback form''s comment textarea is assigned
    to a third variable. These variables are then specified as the three arguments
    to the mail() function when it is called to send the email message.


    ![](img/7faa63a7fa0add8f53300594ebae949f_117_0.png)


    ```

    <?php

    $username = $_POST[''username'']; // assign value

    $useraddr = $_POST[''useraddr'']; // assign value

    $comments = $_POST[''comments'']; // assign value

    ```


    ```

    $to = "php5ineasystems@hotmail.com"; // recipient

    $re = "Website Feedback"; // subject

    $msg = $comments; // message

    mail($to, $re, $msg); // send mail

    ?>

    ```


    ```

    <html>

    <head><title>Message Received</title></head>

    <body>

    <h3>Thanks for your comments</h3>

    Message received from <?php echo ($username); ?> ?

    <br>

    Reply to <?php echo ($useraddr); ?> ?

    </body>

    </html>

    ```'
  merge: -1
  img_proc: true
