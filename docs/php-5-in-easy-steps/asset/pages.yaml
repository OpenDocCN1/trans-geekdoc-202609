  md: '# Using SimpleXML


    PHP version 5 includes the “SimpleXML” extension. The goal of SimpleXML is to
    provide easy access to XML documents using standard object properties.


    The simplexml_load_file() function takes the name of an XML document, loads it
    into a SimpleXML object, and returns it. As usual, the foreach() function can
    loop through the nodes to access a specific element, but now their nested elements
    are easily referenced using the “->” operator.


    The script below loops each “title” element of the books.xml document listed on
    page 177. It references each element nested within “title” elements using the
    “->” operator, and generates a HTML table of the XML data.


    ![](img/7faa63a7fa0add8f53300594ebae949f_185_0.png)


    ```

    <html><head><title>SimpleXML</title></head><body>

    <?php

    #load an XML document into a SimpleXML object

    $sx = simplexml_load_file("books.xml");


    #create a table of books data

    print "<table width = ''375px'' cellpadding = ''5px'' border = ''1px'' cellspacing
    = ''0px''>";


    foreach ($sx -> title as $title) {

    echo("<tr>");

    echo("<td align = ''right''>");

    echo("<img src = ''" . $title -> pic . ''

    ```'
