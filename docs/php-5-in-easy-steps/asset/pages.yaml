- pgno: 93
  md: '# Enabling file uploads


    A PHP script can be used with a HTML form to allow users to upload files to the
    server. The remainder of this chapter demonstrates how to create the upload form
    and the script to process that form.


    Initially, files are uploaded to a temporary directory, then relocated to their
    target destination by a PHP script.


    Information in the phpinfo.php page gives the temporary directory that is used
    for file uploads as upload_tmp_dir, and the maximum permitted size of files that
    can be uploaded as upload_max_filesize. The default maximum size is 2Mb and the
    temporary Windows directory is usually C:\temp. These can be modified by editing
    the php.ini file. In Linux, the temporary directory need not to be specified.


    The process of uploading a file follows these steps:


    +   * The user opens the page containing an HTML form featuring a text field,
    a browse button and a submit button

    * The user clicks the browse button and selects a file to upload from his or her
    hard drive

    * The full path to the selected file appears in the text field, then the user
    clicks the submit button

    * The selected file is sent to the temporary directory on the server

    * The PHP script that was specified as the form handler in the form''s action
    attribute checks that the file has arrived, and then copies the file to its intended
    destination

    * The PHP script confirms the success to the user


    As usual when writing files, it is necessary for both the temporary and final
    locations to have permissions that enable writing – if either are set to be read-only
    the process will fail.


    The upload file used in the example on the following pages is an image file in
    JPEG format, but could equally have been a text file or any other type of file.'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# Creating an upload form


    The upload form is similar to the forms used in previous examples, but with two
    important differences. First, the form tag must include an “encrypt” attribute
    with “multipart/form-data” assigned as its value. Second, the form must feature
    an input of the “file” type, which puts a text field and a browse button on the
    page.


    The HTML code below creates an upload form with all of the features and a submit
    button.


    ![](img/7faa63a7fa0add8f53300594ebae949f_94_0.png)


    ```

    <html><head><title>File Uploader</title></head>

    <body><h3>File Uploader</h3>

    Select a file to upload:<br>


    <form action="uploader.php" method="post"\ enctype="multipart/form-data">


    <input type="file" name="file" size="45">

    <br>

    <input type="submit" value="Upload File">

    </form>


    </html>

    ```


    Notice that the form handler to process this form is the uploader.php script assigned
    to the form’s action attribute – this is listed on the next page.


