    the table''s four fields and are named "firstname", "lastname", "username" and
    "password".


    When the page is first loaded, an if-else statement in the PHP script tests to
    see if values exist for each of these text inputs. If not, the script dynamically
    writes a form where their values can be entered. The section of the script containing
    the form is listed below:


