  md: "# # Validating email address formats\n\nPHP's `preg_match()` function can assess\
    \ if an email address appears to be in the expected format for each part of the\
    \ address by matching permitted patterns for\n\nThe example on page 124 could\
    \ be modified with the code below that checks for \"@\" and \\.\" symbols, and\
    \ permitted characters.\n\n```\n```php\nif (!$useraddr) {\n    $smsg = \"Enter\
    \ email address:<br>\"; $valid = false;\n} else {\n    $useraddr = trim($useraddr);\n\
    \    #patterns for name,domain and top-level domains\n    $name = \"/[^\\-!#\\\
    $\\%'*\\+\\.\\/0-9=?A-Z^_`{}|~-]+\";\n    $host = \"/([0-9A-Z-])]+\\.+\";\n  \
    \  $tlds = \"([0-9A-Z]){2,4}$/i\";\n    #check validity of email format\n    if\
    \ (!preg_match(\"@\".$host->.\".\"$tlds, $useraddr)) {\n        $smsg = \"Email\
    \ address has incorrect format!<br>\";\n        $valid = false;\n    }\n}\n```\n\
