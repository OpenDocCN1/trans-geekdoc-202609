- pgno: 107
  md: '# Starting a session


    A PHP session is started by making a call to the session_start() function. This
    first checks to see if a session has already been started, then starts one if
    none currently exists. It also alerts the PHP engine to expect session variables
    to be used in this page. It is therefore sensible to put the call to session_start()
    at the beginning of the page.


    A session variable is referenced with the PHP $_SESSION[] array, by inserting
    its name in quotes between the square brackets. For instance, $_SESSION[''count'']=1
    initializes a session variable “count” with a value of 1.


    The following example uses the isset() function to first establish a particular
    session variable already exists. If it does not, the script creates the session
    variable named “count”. Each time the page is visited during the session, count
    values increment by 1.


    ```

    <php session_start();

    # start a session

    # initialize to 1, or increment on subsequent visits

    if (!isset($_SESSION[''count'']))

    $_SESSION[''count''] = 1; else $_SESSION[''count'']++;

    >

    <html><head><title>Count visits</title></head>

    <body>

    <h2>You have visited this page</h2>

    <?php echo ($_SESSION[''count'']); ?>

    times in the session</h2>

    </body></html>

    ```


    ![](img/7faa63a7fa0add8f53300594ebae949f_107_0.png)


    ![](img/7faa63a7fa0add8f53300594ebae949f_107_1.png)


