- pgno: 9
  md: '# PHP in this book


    This book is an introduction to the PHP 5 server-side scripting language using
    examples to demonstrate many different features.


    PHP can be used to create interactive dynamic websites and is rapidly gaining
    in popularity because it is a flexible, cross-platform technology that amazingly
    powerful features.


    You may have visited some impressive websites where the URL address ends with
    a file extension of “.php” or “.shtml”. These are dynamic web pages served up
    to the web browser of the PHP scripting language on the server.


    ![](img/7faa63a7fa0add8f53300594ebae949f_9_0.png)


    The examples given throughout this book detail PHP source code and the resultant
    output that appears in the web browser.


    # What you need to know


    PHP code exists alongside HTML code in the original PHP document on the server,
    so it is expected that you are familiar with the HyperText Markup Language (HTML).


    Examples relating to databases comes using the Structured Query Language (SQL).
    Previous knowledge of SQL is helpful, but not essential, but this book includes
    an introduction to basic SQL commands in a chapter introducing relational databases.


    > MOT TIP Code that is executed on the server, such as PHP, is called "server-side"
    code that is executed by the browser, such as JavaScript, is "client-side" code.


    Those readers with some experience of other scripting languages, such as JavaScript,
    will more quickly understand some of the examples, but no previous knowledge of
    scripting is assumed by the book''s text – you don''t need to be a JavaScript
    guru to learn PHP!


    # Required software


    The book provides instructions on how to create a PHP development environment
    under the Windows operating system combining the free Apache web server, the free
    MySQL database server and the free PHP processor itself. This allows you to test
    PHP scripts on your own personal computer before launching them live on the global
    Internet, or on a local intranet.'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# What is PHP?


    "PHP" is a recursive acronym for "PHP: Hypertext Preprocessor". It has evolved
    from the "Personal Home Page" tools created in 1994 by independent I.T. contractor,
    Rasmus Lerdorf, to track users accessing his website. As these provoked much PHP
    into a scripting engine with a "Form Interpreter", released in 1996 as "PHP-FI".


    Developers around the world began contributing ideas and by 1997 over 50,000 websites
    were using PHP-FI. Two of these developers, Zeev Suraski and Andi Gutmans, were
    primarily responsible for creating an Application Programming Interface (API)
    that became the PHP parser released in 1998 as "PHP 3".


    In 1999 the updated version of "PHP 4" incorporated the "Zend engine (Zeev and
    Andi) so that PHP scripting could be used with any combination of web server,
    operating system and platform.


    PHP is now used in over 16 million domains worldwide and its popularity continues
    to grow. Its stated goal is "to allow developers to write dynamically generated
    pages quickly". PHP you can read and write files, gather and process data, send
    data via email, access and manipulate database records, read and write cookies,
    maintain data in session variables, facilitate user, and much more.


    # Advantages of PHP


    In addition to the cross-platform abilities mentioned above, PHP offers speed
    of execution using only meagre system resources, so it will not slow down the
    host machine. It uses its own resource management system, and has a sophisticated
    method for handling variables, ensuring stability. Its simplicity allows anyone
    with a basic knowledge of HTML to start integrating PHP into their pages straight
    away.


    PHP’s modular system of extensions allows it to interface with different libraries,
    such as encryption, graphics or XML, and adding further extensions is very simple.


    ![](img/7faa63a7fa0add8f53300594ebae949f_10_0.png)


    Discover more about the Zend engine online at www.zend.com.'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# How does PHP work?


    A typical PHP document will contain one or more PHP elements, HTML markup elements,
    and the actual textual page content.


    When a web browser requests a PHP page from a web server that is PHP-enabled,
    the server will call up the PHP parser to process all the PHP elements on that
    page.


    The PHP parser executes the PHP script instructions on the page, generating a
    HTML document that is then sent to the web browser as a response to the original
    request.


    The PHP parser may also be asked to retrieve information from a database, so the
    entire process appears like the illustration below:


    ![](img/7faa63a7fa0add8f53300594ebae949f_11_0.png)'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# Creating a PHP environment


    Typically, in order to develop and run PHP pages, these three vital components
    need to be installed on the computer system:


    +   - Web server - PHP will work with virtually all web server software, including
    Microsoft''s Internet Information Server (IIS), but is most used with the freely
    available Apache server. All examples in this book are run on Apache 1.3.31.


    ![](img/7faa63a7fa0add8f53300594ebae949f_12_0.png)


    +   - Database - PHP will work with virtually all database software, including
    Oracle or Sybase, but is most used with the free MySQL database software for which
    it has specific optimizations. The popularity of MySQL is justified by its speed
    and scalability, which makes it suitable for deployment on high-traffic websites.
    All database examples in this book are shown using MySQL 4.0.18.


    ![](img/7faa63a7fa0add8f53300594ebae949f_12_1.png)


    +   - PHP parser - In order process PHP instructions, a parser must be installed
    to generate HTML output that can be sent to the web browser. The parser engine
    is identical, irrespective of the operating system, so PHP pages need no changes
    to run on different platforms. All examples in this book use the parser in the
    final release of PHP 5.0.0.


    ![](img/7faa63a7fa0add8f53300594ebae949f_12_2.png)


    As the Windows platform is by far the most popular desktop operating system it
    is convenient to establish a PHP environment in Windows to develop and test PHP
    scripts. Completed scripts may then be deployed on a Windows server or be uploaded
    to a web server running a different operating system.


    In fact, most web servers run on the free Linux platform, which provides the reliability
    needed for minimum downtime and has used robust security. The acronym “LAMP” is
    often used to describe their typical configuration of Linux, Apache, MySQL and
    PHP.


    The rest of this chapter demonstrates how to download and install each of the
    three components needed to establish a PHP development environment on a Windows
    platform.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# Installing Apache


    Apache is the world''s most popular web server, which, according to a recent survey,
    accounts for 56% of all web servers worldwide. It can be freely downloaded from
    http://httpd.apache.org or one of the mirrors listed on that site.


    Download the stable version for Windows – this will be named something like "apache_1.3.31-win32-x86-no_src.msi".
    Doubleclick on the downloaded file to begin installation, then complete the input
    fields in the Server Information dialog box like this:


    ![](img/7faa63a7fa0add8f53300594ebae949f_13_0.png)


    ![](img/7faa63a7fa0add8f53300594ebae949f_13_1.png)


    Server Information

    Please enter your server''s information.

    Network Domain (e.g. somenet.com):

    localhost

    Server Name (e.g. www.somenet.com):

    localhost

    Administrator: Email Address (e.g. webmaster@somenet.com):

    yourname@yourmailserver.com

    Install Apache HTTP Server programs and shortcuts to:

    - Run as a service for All Users

    - Run when started manually, only for me (Mike McGrath)


    ![](img/7faa63a7fa0add8f53300594ebae949f_13_2.png)


    ![](img/7faa63a7fa0add8f53300594ebae949f_13_3.png)


    ![](img/7faa63a7fa0add8f53300594ebae949f_13_4.png)


    When the Setup Type dialog box appears, choose the option to have a "complete"
    installation. Finally, in the Destination Folder box, change the suggested installation
    location to C:\, then complete the installation. The Apache web server should
    now be running in the background. To verify this, open a web browser and type
    "http://localhost" (without the quotes) in the address field and then hit Enter
    to display the default Apache page.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# Starting & stopping Apache


    If Apache has been installed with the recommended option to “Run as a service
    for All Users” it will constantly run in the background and so be available via
    “http://localhost” at any time.


    Alternatively, if Apache has been installed with the option to “Run when started
    manually”, it can be started from the command line by typing “NET START apache”
    at a prompt. Similarly it can be stopped by typing “NET STOP apache”. In each
    case a status comment is reported in the command window, as seen below:


    ![](img/7faa63a7fa0add8f53300594ebae949f_14_0.png)


    Either of these techniques can also be used to start and stop the MySQL server.


    An alternative method of controlling background services is available on Windows
    XP. All services can be displayed by navigating through Start > Control Panel
    > Administrative Tools > Services. Click on the “Apache” service in the list then
    select the option to “Stop” or “Restart” the service. When “Start” the service
    lets you Apache running again.


    | Services (Local)

    | Name | Descript... | Status | Startup Type |

    | Alerter | Notifications... | | Manual |

    | Apache | Apache... | Started | Automatic |

    | Application ... | Provide... | Started | Manual |

    | Application ... | Provide... | | Manual |

    | Automatic ... | Enables... | Started | Automatic |

    | Background ... | Uses idl... | | Manual |


    Description:

    Apache/1.3.31 (Win32)'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# # Installing MySQL


    There are various database servers available for purchase, such as Microsoft Access,
    but the MySQL database server is both powerful and free. It is in widespread use
    on web servers running PHP and can be freely downloaded from www.mysql.com.


    ![](img/7faa63a7fa0add8f53300594ebae949f_15_0.png)


    Download the binary release of MySQL for Windows, named for example "mysql-4.0.18-win.zip".
    Unzip this file and double-click on the extracted file "setup.exe" to start the
    installation. During setup accept the suggested installation location of C:\mysql
    and opt for a “Typical” installation. The MySQL user manual can be found later
    in the C:\mysql subdirectory.


    +   - mysql

    - bench

    - bin

    - data

    - docs

    - embedded

    - examples

    - include

    - lib

    - scripts

    - share


    Before starting the MySQL database server, you must place a configuration file
    in your system''s root directory — templates are provided for this purpose. Typically
    you should copy the template file at C:\mysql\my-medium.cnf to C: and rename it
    as "my.cnf". The options set in this file are read when the MySQL service starts.


    The C:\mysql folder contains all the executable files needed to run MySQL. On
    Windows XP, 2000 and NT systems, MySQL can be installed as a service that runs
    in the background, other platforms can run MySQL manually as an application.


    Type "C:\bin\mysql-nt --install" at a command prompt to install MySQL as a background
    service that will automatically start whenever your computer gets started. It
    can be started manually from a prompt with the command "NET START mysql" and can
    be stopped with the command "NET STOP mysql". With MySQL running type "C:\mysql\bin\mysql"
    to launch the MySQL monitor where databases can be created and manipulated:


    ```

    Command Prompt

    C:\C:\mysql\bin\mysql monitor. Commands end with ;

    Your MySQL connection id is 2 to server

    Type ''help''; or ''h'' for help.

    mysql> exit

    Bye

    C:\>_

    ```


    ![](img/7faa63a7fa0add8f53300594ebae949f_15_1.png)'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Installing PHP


    The final component needed to establish a PHP development environment is PHP itself.
    This can be freely downloaded from www.php.net. The version for Windows will be
    named like "php-5.0.0-Win32.zip". Download this archive, then extract its contents
    to a convenient location, such as C:\php.


    The extracted files include one named "php.ini-recommended", which is a template
    PHP configuration file. Copy this to your C:\Windows folder then rename it as
    "php.ini".


    The "php.ini" is simply a text file that can be opened in any text editor, with
    Windows Notepad application. installed at C:\Apache and PHP installed at C:\php
    (as described in this chapter) ensure that the "php.ini" configuration file correctly
    identifies the root Apache directory and the PHP extensions directory by following
    these lines:


    ```

    doc_root = "C:\Apache\htdocs"

    extension_dir = "C:\php\ext"

    ```


    If PHP installation has not automatically created these they can be edited manually
    to read as above – remember to save the file.


    MySQL support is present in PHP 5, but may not be enabled by default. To enable
    it manually, first open "php.ini" once then find the following line:


    ```

    extension = "php_mysql.dll"

    ```


    If necessary, remove the semi-colon at the start of this line so it is no longer
    "commented out", then save the file. Now copy the MySQL library file at C:\php\libmysql.dll
    and paste it into your C:\Windows\System folder.


    This completes the PHP installation, but before it can be tested with a browser,
    modifications need to be made to the Apache configuration so that it can recognize
    PHP examples and know how to handle them. The rest of this chapter describes how
    to modify the Apache configuration and how to test the PHP environment.


    ![](img/7faa63a7fa0add8f53300594ebae949f_16_0.png)


    These instructions refer to the final release of PHP version 5.0.0 – refer to
    the PHP documentation for installation of other versions.


    ![](img/7faa63a7fa0add8f53300594ebae949f_16_1.png)'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Configuring Apache for PHP


    Before the Apache server can run PHP examples it must be told where to find the
    PHP module and how to recognize PHP files. This is achieved by editing the Apache
    configuration file located at C:\Apache\conf\httpd.conf.


    Open the "httpd.conf" configuration file in a text editor, then find the section
    containing the "AddModule" directives. At the end of that section add the following
    three lines:


    ```

    LoadModule php5_module c:/php/php5apache.dll

    AddModule mod_php5.c

    AddType application/x-httpd-php .php .phtml

    ```


    The first two lines identify the PHP module. The final line defines a MIME type
    for files ending with a file extension of ".php" and ".phtml" so they will be
    processed by the PHP parser on request. Save the file to include these newly added
    configuration directives.


    ![](img/7faa63a7fa0add8f53300594ebae949f_17_0.png)


    > MIME is an acronym for "Multipurpose Internet Mail Extensions"—is a standard
    for defining file formats.


    Rebooting your system now will ensure that the MySQL, PHP and Apache services
    get started with all the configuration changes applied and ready to be tested.'
  merge: -1
  img_proc: true
