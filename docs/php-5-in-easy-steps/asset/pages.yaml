  md: '# Exploring database tables


    Open the MySQL monitor in a root shell window, or a Command Prompt window on Windows
    systems, type "show databases"; at the mysql> prompt to see all the available
    databases.


    The MySQL installation creates two databases by default – an empty one called
    "test", and one called "mysql" that is used by MySQL itself. The SQL command "use
    database-name", selects a database to work with.


    Type "use mysql"; to select the mysql database, then type the "show tables"; command
    to see a list of tables inside that database.


    The SQL command "explain table-name" can be used to see the format of a table.
    This displays all the field names in the table together with details of the data
    they may contain. Using the mysql database, type "explain user", to see the format
    of the table.


    For details on running the MySQL monitor refer back to page 14.


    ![](img/7faa63a7fa0add8f53300594ebae949f_130_0.png)


    The explain command does not reveal the actual data in the table, but merely see
    page 34 to discover how to view the table data.


    ![](img/7faa63a7fa0add8f53300594ebae949f_130_1.png)


    ```

    MySQL Monitor

    mysql> use mysql:

    Database changed

    mysql> show tables;

    +--------------------+

    | Tables_in_mysql |

    +----------------+

    | columns_priv |

    | db |

    | Func |

    | host |

    | tables_priv |

    | user |

    +----------------+

    6 rows in set (0.00 sec)


    mysql> explain user;

