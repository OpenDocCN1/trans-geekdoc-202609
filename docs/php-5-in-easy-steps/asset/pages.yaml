- pgno: 91
  md: "# Logging visitor details\n\nThe ability to write files makes it simple for\
    \ PHP to log details about visitors to a web page, and can help website development.\n\
    \nIt is especially interesting to discover how visitors arrived at the page, by\
    \ recording the values of the environment variable HTTP_REFERER. This holds the\
    \ URL of the page containing the hyperlink that the user followed to get to your\
    \ page.\n\nThe frequency with which visitors return can be discovered by recording\
    \ the IP addresses of visitors to a page; this is stored in the environment variable\
    \ REMOTE_ADDR.\n\nThe following commented script demonstrates how to log these\
    \ visitor details, along with their browser type and the time at which they accessed\
    \ the page.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_91_0.png)\n\n```\n<?php\n\
    #assign environment variable values\n$address = $_SERVER['REMOTE_ADDR'];\n$referer\
    \ = $_SERVER['HTTP_REFERER'];\n$browser = $_SERVER['HTTP_USER_AGENT'];\n\n#open\
    \ the log file\n$file = fopen(\"log.html\", \"a\");\n\n#write the time of access\n\
    $time = date(\"H:i ds F\");\nfwrite($file, \"<b>$time</b> $time<br>\");\n\n#write\
    \ the user's IP address if available\nif ($address != null) {\n    fwrite($file,\
    \ \"<b>IP Address:</b> $address<br>\");\n}\n\n#write the URL of the forwarding\
    \ page if available\nif ($referer != null) {\n    fwrite($file, \"<b>Referer:</b>\
    \ $referer<br>\");\n}\n\n#write the user's browser details\nfwrite($file, \"<b>Browser:</b>\
    \ $browser<hr>\");\n\n#close the log file\nfclose($file);\n?>\n```\n\n![](img/7faa63a7fa0add8f53300594ebae949f_91_1.png)"
  merge: -1
  img_proc: true
