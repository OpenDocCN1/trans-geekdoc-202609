- pgno: 41
  md: "# Conditional operator\n\nThe PHP coder's favorite operator is probably the\
    \ conditional operator. This first evaluates an expression for a true or false\
    \ value and then executes one of two given statements depending upon the result\
    \ of the evaluation. The conditional operator has this syntax:\n\n( test-expression\
    \ ) ? if-true-do-this : if-false-do-this ;\n\nThis operator can be used to assign\
    \ an appropriate value to a variable, as seen in some examples earlier in this\
    \ chapter, or to call a function, as demonstrated in the example below.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_41_0.png)\n\
    \n```\n<?php\nfunction is_odd() {\n    global $num; echo(\"$num is an odd number<hr>\"\
    );\n}\nfunction is_even() {\n    global $num; echo(\"$num is an even number<hr>\"\
    );\n}\n?>\n<html><head><title>Conditional Operator</title></head>\n<body>\n<?php\n\
    $num = 57;\n($num % 2 != 0) ? is_odd() : is_even();\n\n$num = 44;\n($num % 2 !=\
    \ 0) ? is_even() : is_even();\n?>\n</body></html>\n```\n\n![](img/7faa63a7fa0add8f53300594ebae949f_41_1.png)\n\
    \n| Conditional Operator |\n| File Edit View Favorites Tools Help |\n| Address\
    \ http://localhost/conditional.php | Go |\n| 57 is an odd number |\n| 44 is an\
    \ even number |\n| Done Local intranet |"
