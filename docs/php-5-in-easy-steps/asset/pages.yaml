- pgno: 19
  md: '# Testing MySQL connection


    As a final test of the development environment a PHP script can executed (via
    the Apache web server) to ensure that a connection can be made to the MySQL server
    running on your system. This will involve all three components of the environment.


    The test script is listed below within the HTML "body" section of a document.
    It is explained in more detail later but, for now, it can be copied verbatim to
    check the MySQL connection. Use the Notepad text editor to write the file, then
    save it as "mysqltest.php" in Apache’s htdocs/ folder.


    ![](img/7faa63a7fa0add8f53300594ebae949f_19_0.png)


    ```

    <html>

    <head><title>MySQL Connection Test</title> </head>

    <body>

    <h2>

    <?php

    $connection = mysql_connect("localhost", "root", "")

    oror die("Sorry - unable to connect to MySQL");

    echo("Congratulations - you connected to MySQL");

    ?>

    </h2>

    </body>\</html>

    ```


    When "http://localhost/mysqltest.php" is requested in a browser address field,
    the PHP parser executes the script code, and a message will appear in the generated
    HTML stating the test result. If the test succeeds the generated output looks
    like this screenshot:


    ![](img/7faa63a7fa0add8f53300594ebae949f_19_1.png)'
  merge: -1
  img_proc: true
