  md: "# Listing table names\n\nSimilar to the mysql_list_dbs() function, the PHP\
    \ mysql_list_tables() function returns a result set of information about all tables\
    \ in a database.\n\nEach table name can be extracted by specifying the result\
    \ set, and its row number in the result set, as the arguments to the mysql_listtablename()\
    \ function. The example below reveals the names of three tables that have been\
    \ added to the test database.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_144_0.png)\n\
    \n```\n<?php $conn = @mysql_connect(\"localhost\", \"mike\", \"bingo\")\nor or\
    \ die(\"Sorry - could not connect to MySQL: \");\");\n\n$rs1 = mysql_list_dbs($conn);\n\
    for($row = 0; $row < mysql_list_num_rows($rs1); $row++) {\n    $thisdb = mysql_listtablename($rs1,\
    \ $row);\n    $list = \"<b>\" . $thisdb . \".<br>\";\n    if ($thisdb != \"mysql\"\
    ) {\n        $rs2 = mysql_list_tables($thisdb);\n        for($num = 0; $num <\
    \ mysql_list_num_rows($rs2); $num++) {\n            $list = \"<li>\" . \".mysql_listtablename($rs2,$num)\"\
    .<br>>\";\n        }\n    }\n}\n?>\n```\n\nMySQL's own database (called \"mysql\"\
    ) must be excluded, as tables cannot be read in this way for security reasons.\n\
    \n```\n<html><head><title>Listing Tables</title></head><body><?php echo ($list);\
    \ ?></body></html>\n```\n\n| Listing Tables |\n| --- |\n| File Edit View Favorites\
    \ Tools Help |\n| Address http://localhost/list-tables.php | Go |\n| mysql |\n\
