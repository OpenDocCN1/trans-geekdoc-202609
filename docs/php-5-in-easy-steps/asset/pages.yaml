  md: "# Inserting table data\n\nAdding record data to a database table employs the\
    \ same technique that was used to create a new table in the previous example.\
    \ The table is selected with the mysql_select() function, then an SQL query containing\
    \ the record data is supplied as the argument to the mysql_query() function. This\
    \ uses the SQL command \"insert into table-name\" followed by each piece of field\
    \ data.\n\nThis example allows data to be entered into the my_table table that\
    \ was created in the previous example:\n\n```\n<html><head><title>Add record to\
    \ my_database/my_table</title></head><body>\n<?php\n$self = $_SERVER['PHP_SELF'];\n\
    $id = $_POST['id'];\n$fname = $_POST['fname'];\n$lname = $_POST['lname'];\n?>\n\
    <form action=\"<?php echo ($self); ?>\" method=\"post\">\nID: <input type=\"text\"\
    \ name=\"id\" size=\"3\">\nFirst Name: <input type=\"text\" name=\"fname\" size=\"\
    8\">\nLast Name: <input type=\"text\" name=\"lname\" size=\"8\"><br>\n<input type=\"\
    submit\" value=\"Submit\" />\n</form>\n\n<?php\nif ($id && $fname && $lname) {\n\
    \  $conn=mysql_connect(\"localhost\", \"mike\", \"bingo\") or die(\"Err:Conn\"\
    );\n\n#select specified database\n$rs = mysql_select_db(\"my_database\", $conn)\
    \ or die(\"Err:Db\");\n\n#create the query\n$sql=\"insert into my_table (id, first_name,\
    \ last_name) VALUES ($id, \\$fname, \\$lname\");\n#execute the query\n$rs = mysql_query($sql,\
    \ $conn);\n#confirm the added record details\nif($rs) { echo(\"Record added:$id\
    \ $fname $lname\"); }\n?>\n</body></html>\n```\n\n![](img/7faa63a7fa0add8f53300594ebae949f_150_0.png)\n\
    \nIn the list of SQL query values string data should be surrounded by escaped\
    \ quotes, as shown here.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_150_1.png)\n\
    \nThe execution of this script is illustrated on the next page.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_150_2.png)"
