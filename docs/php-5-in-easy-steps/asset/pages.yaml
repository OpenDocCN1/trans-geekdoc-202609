    <?php

    #load the XML document into the DOM

    $dom = new DomDocument();

    $dom -> load("food.xml");


    #create an XPath object

    $xp = new DomXPath($dom );


    #print a list of all fruit items

    echo ("Fruit items are:<ul>" );

    n$fruits = $xp -> query("/food/fruit/item");

    foreach($fruits as $node) {

    echo("<li>" . $node -> textContent ."</li>"; }

    echo("</ul>");

    ?>

    </body></html>

    ```


    # XPath DOM Query


    | File Edit View Favorites Tools Help |

    | Address: http://localhost/xpath-query.php | Go |


    Fruit items are:


    +   * Apple

    * Banana

    * Cherry


    This is just a simple example. Further query possibilities might be:


    +   * query("/food/fruit/item[position() = 1]") returns just the first "item"
    element nested within the "fruit" element.

    * query("/food/fruit/item[@id=''2'']") returns just the "item" element having
    an "id" attribute value of "2".

    * query("/food/veg/item") returns all the "item" elements nested within the "veg"
    element.'
