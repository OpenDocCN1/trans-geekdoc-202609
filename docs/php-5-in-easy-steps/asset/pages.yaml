  md: "# Writing a file\n\nA new file can be written, or appended to an existing file,\
    \ using the PHP fwrite() function. This requires two arguments: a file pointer\
    \ and the string of data that is to be written. Optionally a third integer argument\
    \ can be included to specify the length of data to write. If the third argument\
    \ is included, writing will stop after the specified length (in bytes) has been\
    \ reached.\n\nThe file pointer is obtained using the fopen() function with arguments\
    \ stating the file name and one of the writing modes listed on page 85.\n\nAfter\
    \ writing to a file, it should be closed with the fclose() function, which requires\
    \ the file pointer as its sole argument.\n\nThe existence of a file can be tested\
    \ with the PHP file_exists() function. This needs the file name as argument, and\
    \ will return true if the file is located or false if it cannot be found.\n\n\
    The script below creates a new text file, then writes a short text inside it.\
    \ After closing this file its existence is confirmed.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_89_0.png)\n\
    \n```\n<?php\n$filename = \"C:\\Documents and Settings\\\nAll Users\\Desktop\\\
    newfile.txt\";\n\n$file = fopen($filename, \"w\");\fwrite($file, \"Samuel Pepys\
    \ 1633-1703\\n\\n \");\nfclose($file);\n\n<html><head><title>Writing a new file</title></head>\n\
    <body>\n<?php if (file_exists($filename)) {\n$file_length = filesize($filename);\n\
    $msg = \"File created at $filename\";\n$msg .= \"containing $file_length bytes\"\
    ;\necho($msg);\n} else {echo(\"Unable to create file\"); }\n?>\n\n</body></body></html>\n\
    ```"
