  md: '# # Using timestamp data


    The MySQL 14-digit timestamp number records the date and time, where the first
    four numbers are the year, then each successive pairs of numbers are the month,
    day number, hour, minutes and seconds.


    The PHP substr() function can be used to return a part of the timestamp specified
    as its first argument. Its second argument states the required starting character
    position as an integer, and its third argument specifies the character length
