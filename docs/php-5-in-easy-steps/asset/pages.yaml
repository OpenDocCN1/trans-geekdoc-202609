- pgno: 157
  md: '# # Creating a user table


    It is useful to restrict access to parts of a website by requiring visitors to
    enter a user name and password for authentication against a list of authorized
    users. A PHP script could verify the input against a list stored in a text file,
    but it is faster and more efficient to maintain the list in a database.


    In this case the table will need to have four columns to store the user''s first
    name, last name, user name and password. The table can be created using the create_table.php
    script described in the previous chapter on pages 146–148.


    First specify that four fields are needed, then submit the form.


    ![](img/7faa63a7fa0add8f53300594ebae949f_157_0.png)


    ![](img/7faa63a7fa0add8f53300594ebae949f_157_1.png)'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# ...cont''d


    Next, enter the name of the database to use and specify the new table name as
    "users". Type the four field names "first_name", "last_name", "user_name" and
    "password" into the input fields and change data type to "varchar". Set the field
    lengths to 50 for the real names and just 25 for the user name. Allow a length
    of 16 for the password field because MySQL will store password information in
    encrypted form as a 16-digit hexadecimal number.


    Now submit the form to create the "users" table.


    ![](img/7faa63a7fa0add8f53300594ebae949f_158_0.png)


    When the completed form is submitted, the SQL query creates the new table and
    page displays confirmation. The new users table can be viewed in the MySQL monitor
    to confirm its format.


    ![](img/7faa63a7fa0add8f53300594ebae949f_158_1.png)


    To ensure that all user names are unique, alter the table to modify the user_name
    as shown in this illustration.


    ![](img/7faa63a7fa0add8f53300594ebae949f_158_2.png)


