- pgno: 55
  md: "# Listing array elements\n\nRetrieving all element values from an array is\
    \ easy with the PHP foreach() function, which loops through each element of an\
    \ array.\n\nThe value of the element on each iteration of the loop can be assigned\
    \ to a variable using the PHP \"as\" keyword. This must be specified as an argument\
    \ statement to the foreach() function, with the array name and the variable name,\
    \ using this syntax:\n\n```\nforeach( array as variable ) { current-variable-value\
    \ }\n```\n\nThe following example loops through an array and writes each element\
    \ value on the page as an item in an ordered list:\n\n```\n<head><title>List array\
    \ values</title></head>\n<body><ol>\n<?php\n$arr = array(\"Red\", \"Green\", \"\
    Blue\", \"Cyan\",\n\"Magenta\", \"Black\", \"Yellow\" );\n\nforeach($arr as $value)\
    \ {\n\techo \"<li>Do you like $value ?</li>\";\n}\n?>\n</ol></body></html>\n```\n\
    \n![](img/7faa63a7fa0add8f53300594ebae949f_55_0.png)\n\nThe foreach() function\
    \ is especially useful to list the nodes of an XML document – see chapter 14.\n\
    \n![](img/7faa63a7fa0add8f53300594ebae949f_55_1.png)\n\nPHP 5 in easy steps"
  merge: -1
  img_proc: true
- pgno: 56
  md: "# Getting the array size\n\nThe PHP sizeof() function is an alias for the PHP\
    \ count() function, so either can be used to determine the total number of elements\
    \ in an array. These functions require the name of the array to be specified as\
    \ their argument.\n\nThe PHP script below first creates an empty array, then fills\
    \ three elements with data using a \"for\" loop. Each of the element values is\
    \ written out on the page, using the (foreach) function described on the opposite\
    \ page. Finally, the array size is assigned to a variable and then printed on\
    \ the page.\n\n```\n<html><head><title>Getting array size</title></head>\n<body><ul>\n\
    <?php\n$arr = array();\n\n#assign three element values\nfor ($i = 0; $i < 3; $i++)\
    \ {\n  $arr[$i] = \"<li>This is element $i</li>\";\n}\n\nforeach ($arr as $value)\
    \ { echo ($value); }\n\n#assign the number of array elements\n$size = count($arr);\n\
    echo(\"<li>Total number of elements is $size</li>\");\n?>\n?>\n</ul></body></html>\n\
    ```\n\n![](img/7faa63a7fa0add8f53300594ebae949f_56_0.png)\n\nNotice that the array\
    \ size expands dynamically to create more when needed.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_56_1.png)\n\
    \n| Getting array size |\n| File | Edit | Favorites | Tools | Help |\n| Address\
