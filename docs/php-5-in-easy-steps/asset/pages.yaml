- pgno: 164
  md: "# The log-in form handler script\n\nThe form handler script for the log-in\
    \ form first checks that there are entries in both \"username\" and \"password\"\
    \ fields. If so, the script looks in the \"users\" database table, earlier in\
    \ this chapter, and seeks matches to the $username and $password values. The number\
    \ of rows that match is stored in a variable called $num. An if-else statement\
    \ block then tests to see that at least one row matched, will either create a\
    \ confirmation message or return the browser to the log-in page, depending on\
    \ the result. If the log-in succeeds, a welcome message is written out.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_164_0.png)\n\
    \n```\n$username = $_POST['username'];\n$password = $_POST['password'];\n$self\
    \ = $_SERVER['PHP_SELF'];\n$referer = $_SERVER['HTTP_REFERER'];\n\n#if either\
    \ form field is empty return to the log-in page\nif (!$username || !$password)\
    \ {\n    header(\"Location:$referer\"); exit();\n    #connect to MySQL\n$conn\
    \ = @mysql_connect(\"localhost\", \"mike\", \"bingo\")\\    or die(\"Could not\
    \ connect\");\n    #select the specified database\n$rs = @mysql_select_db(\"my_database\"\
    , $conn)\n    or die(\"Could not select database\");\n    #create the SQL query\n\
    $sql=\"select from users where user_name=\\$username\\\"\nand password = password(\\\
    \\$username\\\");\n    #execute the query\n$rs = mysql_query($sql, $conn)\n  \
    \  or die(\"Could not execute query\");\n```\n\nNotice the variable $referer is\
    \ used to specify the address of the log-in page.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_164_1.png)\n\
    \nA successful log-in attempt is illustrated on the next page.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_164_2.png)\n\
    \n```\n#get number of rows that match username and password\n$num = mysql_numrows($rs);\n\
    #if there is a match the log-in is authenticated\nif ($num == 1) {\n    $msg =\
    \ \"Welcome $username - your log-in succeeded!\";\n} else or return to the log-in\
    \ page\n    header(\"Location:$referer\"); exit();\n}\n\n<html><head><title>Log-In\
    \ Authenticated</title></head>\n<body><?php echo ($msg); ?></body></html>\n```"
  merge: -1
  img_proc: true
