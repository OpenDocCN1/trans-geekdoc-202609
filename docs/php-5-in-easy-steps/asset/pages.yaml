- pgno: 39
  md: '# Comparison operators


    The operators that are commonly used in PHP to compare two values are listed in
    the table:


    | Operator | Comparative Test |

    | --- | --- |

    | == | Equality |

    | != | Inequality |

    | > | Greater than |

    | < | Less than |

    | >= | Greater than or equal to |

    | <= | Less than or equal to |


    The equality operator == compares two operands and returns true if both are equal
    in value: If both are the same number then they are equal, or if both are strings
    containing the same characters in the positions then they are equal. Boolean operands
    that are both true, or both false, equal.


    Conversely, the != inequality operator returns true if two operands are not equal,
    using the same rules as the == equality operator.


    Equality and inequality operators are useful in testing the state of two variables
    for conditional branching.


    The > greater operator compares two operands and will return true if the first
    is greater in value than the second.


    The < less operator makes the same comparison, but returns true if the first operand
    is lesser in value than the second.


    Adding the = operator after a > greater than or < less operator makes them also
    return true if the two operands are exactly equal in value.


    The > greater operator is frequently used to test the value of a countdown value
    in a loop.


    ![](img/7faa63a7fa0add8f53300594ebae949f_39_0.png)'
  merge: -1
  img_proc: true
