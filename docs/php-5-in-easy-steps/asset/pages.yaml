- pgno: 175
  md: '# Saving the guestbook


    The mysqldump program, located in MySQL’s bin directory, can be used to save any
    MySQL database or table as a text file.


    To save the guestbook table created in this chapter, first navigate from a command
    prompt to MySQL’s bin directory. Type “mysqldump --help” to see a list of options.
    The command syntax to save a simple table is:


    ```

    mysqldump [ options ] database-name table-name > file-name

    ```


    Use a “-t” option (to suppress the table creation info) followed by the “my_database”
    name and “guestbook” table name. Finally, use the “>” character to direct output
    to a file named “guestbook.txt”.


    ![](img/7faa63a7fa0add8f53300594ebae949f_175_0.png)


    ![](img/7faa63a7fa0add8f53300594ebae949f_175_1.png)


    ![](img/7faa63a7fa0add8f53300594ebae949f_175_2.png)


    The text file gets created in the directory unless a path precedes specifies the
    filename, as > C:\guestbook.txt


    PHP 5 in easy steps'
