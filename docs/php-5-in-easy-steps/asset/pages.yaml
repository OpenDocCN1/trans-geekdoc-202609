- pgno: 60
  md: '# One-based indexing


    By default the index of all array elements starts at zero, so that element number
    one is index zero. This can be confusing, but PHP does provide a way to start
    the index at one, so that element number one is also index number.


    The solution is to explicitly specify an integer key of one for the first element
    value, using the `=>` syntax. All subsequent values will adopt successive index
    numbers that correctly match their positions in the array.


    This technique is demonstrated in the following example, which makes an array
    containing five elements be indexed as 1-5 instead of the default index numbering
    of 0-4. Each element is written out on the page by a loop that can now conveniently
    refer to each element correctly by its index position.


    ![](img/7faa63a7fa0add8f53300594ebae949f_60_0.png)


    ```

    <html><head><title>One-based array index</title></head>

    <body><ol>

    <?php

    $arr = array(1 => "1st", "2nd", "3rd", "4th", "5th" );


    for($si = 1; $si <= sizeof($arr); $si++) {

    echo echo("Position $si - Element value: $arr[$si]<br>");

    }

    ?>

    </ol></body></html>

    ```


    ![](img/7faa63a7fa0add8f53300594ebae949f_60_1.png)'
  merge: -1
  img_proc: true
- pgno: 61
  md: "# Manipulating arrays\n\nPHP arrays can be easily manipulated by the many special\
    \ array functions. The array_merge() function allows two arrays to be merged.\
    \ This requires the two array names as its arguments, and adds the elements of\
    \ the second array after those of the first array. A specified range of an array's\
    \ elements can be selected with the array_slice() function, which takes the array\
    \ name and the start and end positions of the required elements. Array elements\
    \ can be randomly rearranged with the PHP shuffle() function. The example below\
    \ demonstrates each of these functions in action.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_61_0.png)\n\
    \n```\n<html><head><title>Manipulating arrays</title></head>\n<body><ol>\n  <?php\
    \ $arr1 = array(\"Alpha\", \"Bravo\", \"Charlie\");\n  $arr2 = array(\"Delta\"\
    , \"Echo\", \"Foxtrot\");\n\n  $arr = array_merge($arr1, $arr2);\n  foreach ($arr\
    \ as $value) { echo(\"$value \"); }\n  echo(\"<hr>\");\n\n  $arr = array_slice($arr,\
    \ 1, 4 );\n  foreach ($arr as $value) { echo(\"$value \"); }\n  echo(\"<hr>\"\
    );\n\n  $rand( (float)microtime() * 1000000 ); shuffle($arr);\n  foreach ($arr\
    \ as $value) { echo(\"$value \"); }\n?>\n</ol></body></html>\n```\n\nA seed is\
    \ first provided for the shuffle() function by rand(). For more details refer\
    \ to the random number example on page 66.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_61_1.png)\n\
    \n| Manipulating arrays | |\n|---|---n| File Edit View Favorites Tools Help |\n\
    | Address http://localhost/slicearray.php | Go |\n| Alpha Bravo Charlie Delta\
    \ Echo Foxtrot |\n| Bravo Charlie Delta Echo |\n| Bravo Charlie Echo Delta |"
