  md: '# Sending attachments with email


    To send an email with mixed content requires a more advanced understanding of
    email formats. A main Content-Type: header must first declare the content to be
    “multipart/mixed”. Then text and attachment sections can be specified within defined
    boundaries. Each boundary starts with two hyphens followed by a unique number,
    which cannot appear in the message part of the email.


    It is common to use the PHP md5() function to create a 32-bit hexadecimal number
    for use in a boundary. The time() function can be specified as its argument to


    ![](img/7faa63a7fa0add8f53300594ebae949f_123_0.png)


    Attached files should be encoded with the base64_encode() function for safe transmission,
    and are best split into chunks with the chunk_split() function. This adds \rn
    inside the file at regular intervals, normally every 76 characters.


    The following commented code lists the form handler for the attachment form that
    was created on page 120:


    ```

    php

    $to = $_POST[''to'']; $from = $_POST[''from''];

    $re = $_POST[''re'']; $comments = $_POST[''comments''];


    $att = $_FILES[''att''];

    $att_path = $_FILES[''att''][''tmp_name''];

    $att_name = $_FILES[''att''][''name''];

    $att_size = $_FILES[''att''][''size''];

    $att_type = $_FILES[''att''][''type''];

    ```


    ![](img/7faa63a7fa0add8f53300594ebae949f_123_1.png)


    mixedmixed.php


    The boundary number is assigned to the boundary attribute in the Content-Type:
    header.


    ```

    #open, read, then close the file

    $fp = fopen($att_path, "rb");

    $file = fread($fp, $att_size);

    fclose($fp);

    ```


    ![](img/7faa63a7fa0add8f53300594ebae949f_123_2.png)


    ```

    #create a boundary string

