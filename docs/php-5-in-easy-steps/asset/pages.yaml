- pgno: 119
  md: '# Sending HTML email


    The PHP mail() function can be used to specify a string of extra headers to be
    sent with all emails. Each header must be separated by "\r\n" – representing a
    carriage return and a newline.


    The following example illustrates additions to the feedback form handler to allow
    HTML formatting by setting the "Content-type:text/html".


    It assigns the email address entered by the user, in the "useraddr" form field,
    to the "From" header. Also, the "Cc: header is given a second address to which
    a copy should go.


    Note that the Cc header is case-sensitive --Cc or cc are incorrect.


    ![](img/7faa63a7fa0add8f53300594ebae949f_119_0.png)


    All header information is contained in the Headers variables, which is specified
    as the fourth argument to the mail() function.


    When a form is submitted, the header information and the message are sent; then
    a confirmation, which one, is displayed.


    ![](img/7faa63a7fa0add8f53300594ebae949f_119_1.png)


    ```

    php $username = $_POST[''username'']; //assignment value

    $useraddr = $_POST[''useraddr'']; //assignment value

    $comments = $_POST[''comments'']; //assignment value

    $to = "php5inesastysthe@hotmail.com"; //recipient

    $re = "Website Feedback"; //subject

    $msg = \$comments; //message

    $headers = "-MIME-Version: 1.0\r\n"; //html headers

    $headers = "Content-type: text/html";

    $headers = " charset=iso-8859-1\r\n";

    $headers = "From: \$useraddr \r\n"; //from

    $headers = "Cc: another@hotmail.com \r\n"; //cc

    mail($to, $re, $msg, \$headers); //send mail

    ?>

    <html><head><title>Message Received</title></head>

    <body>

    <h3>Thanks for your comments</h3>

    Message received from <?php echo ($username); ?>?<br>

    Reply to <?php echo ($useraddr); ?>?

    </body>

    </html>

    ```


    feedback.php (modified)


    It is essential to set MIME-Version: 1.0 in this example.


    ![](img/7faa63a7fa0add8f53300594ebae949f_119_2.png)


    118 | PHP 5 in easy steps'
