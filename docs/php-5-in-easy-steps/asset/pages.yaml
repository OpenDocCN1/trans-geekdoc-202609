  md: "# Reloading a page\n\nPrevious examples have nominated a different file as\
    \ a form handler to process submitted data, but the same page can be used as the\
    \ form handler by assigning the PHP environment variable called `$_SERVER['PHP_SELF']`\
    \ to the form's action attribute.\n\nThe following example demonstrating this\
    \ is a guessing game that generates a random number when it is first loaded and\
    \ assigns it to a hidden form input. The page contains an initial code block that\
    \ starts with a call to the PHP header()... Its specified argument of \"Cache-Control:no-cache\"\
    \ indicates that the browser should always reload this page, rather than use a\
    \ cached copy.\n\nThe initial code block contains a function called setnum(),\
    \ which generates a random number between 1 and 20 and assigns it to a variable\
    \ called `$num`. Later down the page this value is assigned to the hidden form\
    \ input called `num`. When the page reloads and retains the value of the $num\
    \ variable. If the user guesses the number correctly, the script calls the setnum()\
    \ function to assign a new target number to the $num variable.\n\n```\n<?php header(\"\
    Cache-Control:no-cache\" );\n\nfunction setnum() {\n    global $num;\n    $num\
    \ = rand((double)microtime() * 1000000);\n    $num = rand(1, 20);\n}\n```\n\n\
    ```\n?<html><head><title>Number guess</title></head><body>\n\n<?php $num = $_POST['num'];\
    \ $guess = $_POST['guess'];\n$self = $_SERVER['PHP_SELF']; // assign valuesn\n\
    ```\n\n![](img/7faa63a7fa0add8f53300594ebae949f_75_0.png)\n\nNotice that the syntax\
    \ to check for non-numeric entries uses `is_numeric($guess)`.\n\nif ($num == null\
    \ ) #starting instructions\n{ $msg = \"I have thought of a number between 1 and\
    \ 20\";\n $msg = \"<h3>guess what it is...</h3\";\n }\n\n#error message for invalid\
    \ entries\nif ($num == null && !is_numeric($guess ))\n{ $msg = \"Your guess was\
    \ invalid<h3>Try Again!</h3\";\n }"
