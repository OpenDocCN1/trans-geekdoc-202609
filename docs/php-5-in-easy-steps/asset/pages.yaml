- pgno: 33
  md: '# # Arithmetical operators


    The arithmetical operators commonly used in PHP scripts are listed in the table
    below together with the operations they perform:


    | Operator | Operation |

    |---|---|

    | + | Numeric addition |

    | . | String concatenation |

    | - | Subtraction |

    | * | Multiplication |

    | / | Division |

    | % | Modulus |

    | ++ | Increment |

    | -- | Decrement |


    Notice that the + operator cannot be used to join strings as it can it in other
    languages. It will add together two numeric values and give the result of the
    addition. Concatenation of strings can only be performed with the . dot operator.


    The modulus operator will divide the first given number by the second given number
    and return the remainder of the operation. This is most useful to determine if
    a number is odd or even.


    The increment ++ and decrement -- operators alter the given value by 1 and return
    the resulting value. These are most commonly used to count iterations in a loop.


    All the other operators act as you would expect, but care should be taken to bracket
    expressions where more than one operator is being used, to clarify the operations:


    ![](img/7faa63a7fa0add8f53300594ebae949f_33_0.png)


    ```

    a = b * c - d % e / f; // This is unclear

    a = (b * c) - ((d % e) / f); // This is clearer

    ```'
  merge: -1
  img_proc: true
