- pgno: 69
  md: "# Getting form values\n\nPHP is really good at handling data submitted to the\
    \ server in HTML forms. Each type of HTML form input field sends the data as key-value\
    \ pairs where the input name is the key, and the input field content is the value.\n\
    \nThe simple HTML form shown below contains two text input fields called \"username\"\
    \ and \"dish\", together with a set of radio buttons called \"color\". Only one\
    \ radio button can be selected, and its value will be sent to the server when\
    \ the form is submitted.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_69_0.png)\n\
    \n```\n<html><head><title>Your Favorites</title></head>\n<body>\n<form action=\"\
    fav.php\" method=\"post\">\n<b>Please enter your first name:</br>\n<input type=\"\
    text\" size=\"45\" name=\"username\"> <br>\n<b>Select your favorite color wine:</br>\n\
    <input type=\"radio\" name=\"color\" value=\"white\"> White\n<input type=\"radio\"\
    \ name=\"color\" value=\"rosé\"> Rosé\n<input type=\"radio\" name=\"color\" value=\"\
    red\"> Red <br>\n<b>Please enter your dish:</br>\n<input type=\"text\" size=\"\
    45\" name=\"dish\"> <br>\n<input type=\"submit\" value=\"Submit this form\">\n\
    </form>\n</body></html>\n```\n\nNotice that the form's action attribute specifies\
    \ a form handler named fav.php - this will process the data, and is listed on\
    \ the opposite page.\n\n| Your Favorites |\n| File | Edit | Favorites | Tools\
    \ | Help |\n| Address | http://localhost/fav.html | Go |\n| Please enter your\
    \ first name: |\n Mike |\n| Select your favorite color wine: |\n White Rosé Red\
    \ |\n| Please enter your dish: |\n Beef Stelado with Greek salad |\n| [Submit\
    \ This Form] |\n\n![](img/7faa63a7fa0add8f53300594ebae949f_69_1.png)"
  merge: -1
  img_proc: true
- pgno: 70
  md: "# # Displaying submitted values\n\nWhen HTML form data is submitted with the\
    \ \"post\" method, PHP adds each submitted key-value pair to its special $_POST[]\
    \ array. Any submitted value can be referenced by adding its key (input name)\
    \ within the square brackets. For instance, the color value in this example can\
    \ be referenced by $_POST['color'].\n\nSurround the keys with single quotes to\
    \ differentiate them from text strings, which are double quotes.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_70_0.png)\n\
    \nThe PHP script below begins by assigning each submitted value to a variable,\
    \ named as it key. The script checks for null values, to ensure input, then uses\
    \ the values in generated output.\n\n```\n<<head><title>Your submission</title></head>\n\
    <body><img src=\"foodn.jpg\" width=\"368\" height=\"54\">\n<?php\n$username =\
    \ $_POST['username']; //assign value\n$color = $_POST['color']; //assign value\n\
    $dish = $_POST['dish']; //assign value\n\nif ($username != null) {\n    echo(\"\
    Thanks for your selection $username<hr>\");\n    if ($color != null) && ($dish\
    \ != null) {\n        $msg = \"You really enjoy $dish<br>\";\n        $msg = \"\
    - especially with a nice $color wine\";\n        echo ($msg);\n    }\n}\n</body></html>\n\
    ```\n\n![](img/7faa63a7fa0add8f53300594ebae949f_70_1.png)\n\nThe first statement\
    \ block will be executed only if the user has entered a username value. The second\
    \ statement block will be executed only if the user has entered both a color and\
    \ a dish value.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_70_2.png)\n\nIf for\
    \ some reason the submission method is unknown the values can be referenced from\
    \ the special $_REQUEST[] array in the same way as with $_POST[].\n\n![](img/7faa63a7fa0add8f53300594ebae949f_70_3.png)\n\
    \n| Your submission |\n| Edit | View | Favorites | Tools | Help |\n| Address Mike&color=white&dish=BeefStifado+with+Greek\
    \ | Go |\n| Thanks for your selection Mike |\n| You really enjoy Beef Stifado\
    \ with Greek salad - especially with a nice white wine |\n| Done \n Local intranet\
    \ |\n\n6. Generating dynamic content | 99"
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Manipulating submitted values


    PHP can do much more than simply display values from an HTML form. The submitted
    data is stored in PHP variables, each keyed against the name of its input field,
    and these variables can be manipulated by the script, just like other variables.


    The HTML form in the example below allows the user to enter two numbers and then
    select an arithmetic operation to perform on them. When the form is submitted
    to the server, these values are sent to a PHP form handler called calc.php, listed
    opposite. The data is associated with the key names of "val1", "val2" and "calc"
    that have been used for the form''s input fields.


    ![](img/7faa63a7fa0add8f53300594ebae949f_71_0.png)


    ```

    <html><head><title>Calculation Form</title></head>

    <body>

    <form action="calc.php" method="post">

    Value 1: <input type="text" name="val1" size="10">

    Value 2: <input type="text" name="val2" size="10"><br>

    Calculation:

    <input type="radio" name="calc" value="add">Add

    <input type="radio" name="calc" value="sub">Subtract

    <input type="radio" name="calc" value="mul">Multiply

    <input type="radio" name="calc" value="div">Divide<br>

    <input type="submit" value="Calculate">

    <input type="reset" value="Clear">

    </form>

    </body></html>

    ```


    ![](img/7faa63a7fa0add8f53300594ebae949f_71_1.png)'
  merge: -1
  img_proc: true
- pgno: 72
  md: "# cont'd\n\n![](img/7faa63a7fa0add8f53300594ebae949f_72_0.png)\n\n```\n<html><head><title>Calculation\
    \ Result</title> </head>\n<body>\n<?php\n$val1 = $_POST['val1']; //assign value\n\
    $val2 = $_POST['val2']; //assign value\n$calc = $_POST['calc']; //assign value\n\
    if( is_numeric($val1) && is_numeric($val2) )\n    if ($calc != null) {\n     \
    \   switch ($calc) {\n            case \"add\" :result = $val1 + $val2; break;\n\
    \            case \"sub\" :result = $val1 - $val2; break;\n            case \"\
    mul\" :result = $val1 * $val2; break;\n            case \"div\" :result = $val1\
    \ / $val2; break;\n        }\n        echo(\"Calculation result: $result\");\n\
    \    } else(\n        echo(\"Invalid entry - please retry\");\n    )\n}\n?>\n\
    </body></html>\n```\n\n![](img/7faa63a7fa0add8f53300594ebae949f_72_1.png)\n\n\
    The switch statement is seeking a match against the four possible values of the\
    \ HTML form's radio button set.\n\nThe form handler script above uses the PHP\
    \ is_numeric function to ensure that two numbers have indeed been entered. This\
