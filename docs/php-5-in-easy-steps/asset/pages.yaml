- pgno: 57
  md: "# Adding & removing array elements\n\nAdditional elements can be created at\
    \ the beginning of an array using the array_unshift() function, and elements can\
    \ be added at the end of an array with the array_push() function. Each requires\
    \ the array name followed by the element data as its arguments.\n\nIn the example\
    \ below, an array is created with three elements. Two more elements are added\
    \ at the beginning of the array, then two further elements are added at the end.\n\
    \n![](img/7faa63a7fa0add8f53300594ebae949f_57_0.png)\n\n```\n<html><head><title>Adding\
    \ array elements</title></head>\n<body><ol>\n<?php\n$arr = array(\"Red \", \"\
    Green \", \"Blue \");\n\n# add elements at beginning of the array\narray_unshift($arr,\
    \ \"Cyan\", \"Magenta\");\n\n# add elements at end of the array\narray_push($arr,\
    \ \"Yellow\", \"Black\");\n\n# write out each element\nforeach($arr as $value)\
    \ {\n echo \"<li>Do you like $value</li>\";\n}\n?>\n</ol></body>\\</html>\n```\n\
    \n![](img/7faa63a7fa0add8f53300594ebae949f_57_1.png)"
  merge: -1
  img_proc: true
- pgno: 58
  md: '# ...cont''d


    The first element in an array can be removed with the array_shift() function,
    and the final element can be removed using the array_pop() function. Both these
    functions return the removed element data, which can be assigned to a variable.


    The following example removes the first and last elements from an array, then
    sorts the remaining elements into alphabetical order using the PHP sort() function.


    ```

    <html><head><title>Remove array elements</title></head>

    <body><ol>

    <?php

    #create an array containing 5 strings

    $arr=array("Orange","Cherry","Apple","Banana","Lemon");


    #remove element at beginning of the array

    $first = array_shift($arr);


    #remove element at end of the array

    $last = array_pop($arr);


    #sort elements alphabetically

    sort($arr);


    #write out values

    foreach($arr as $value){ echo("$value, " "); }

    echo("<br>Removed first element: \$first");

    echo("<br>Removed last element: \$last");

    ?>

    </ol></body></html>

    ```


    ![](img/7faa63a7fa0add8f53300594ebae949f_58_0.png)


    Each of the PHP array functions in this example requires the array name to be
    specified as their argument.


    ![](img/7faa63a7fa0add8f53300594ebae949f_58_1.png)'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# Array keys and values


    Instead of a single data value, each PHP array element can contain a key-value
    pair, where the key can be used in a script to refer to its associated value.


    When assigning a key-value pair to an array element, the key name (enclosed in
    quotes) should come first, followed by “=>” characters and then the value content.
    It is advisable to use single quotes to surround the key name to differentiate
    it from a regular string.


    To refer to the value, simply use the key (in quotes) in place of the array index
    number; for example, Arr[''key''].


    The example below creates an array with three elements containing key-value pairs.
    The element content is retrieved, using each key to concatenate its associated
    value when it is written out on the page.


    ![](img/7faa63a7fa0add8f53300594ebae949f_59_0.png)


    ```

    <html>

    <head><title>Key-value array elements</title></head>

    <body><ol>

    <?php

    $arr = array(''version'' => 10,

    ''OS'' => "Linux",''os'' => " Mandrake ");

    echo

    ( "Platform:". $arr[''OS'']. $arr[''os'']. $arr[''version'']);

    ?>

    </ol></body></html>

    ```


    ![](img/7faa63a7fa0add8f53300594ebae949f_59_1.png)


    Key names are case sensitive, so $arr[''OS''] and $arr[''os''] refer to different
    array


    | Key-value array elements |

    | File Edit View Favorites Tools Help |

    | Address http://localhost/keyarray.php Go |

    | Platform: Linux Mandrake 10 |\n| Done Local intranet |


    Data submitted from HTML forms takes the input name as a key and the input content
    as its value. These can be stored in an array so that user-entered data can be
    retrieved using the key name.


    PHP 5 in easy steps'
