- pgno: 179
  md: '# Reading from the DOM


    PHP 5 has built-in support for the Document Object Model (DOM) as specified by
    the W3C standard. This provides a “DomDocument” template class containing predefined
    variables and methods (or functions).


    A DomDocument object can be created in a PHP script using the “new” keyword to
    assign an instance of the class to a variable. For example, $dom = new DomDocument
    creates a DomDocument object in the $dom variable.


    The variable properties and the methods of an object can be referenced using the
    special class pointer operator “->”. For instance, the DomDocument object has
    a load() method to load an XML file, so that $dom -> load(“books.xml”) loads the
    data from the file “books.xml” into the $dom object.


    Each element of the XML document is described as a “node”.


    The root element of the XML document can be accessed using the DomDocument’s “documentElement”
    property, and its tag name can be referenced from its inherent “nodeName” part.
    For example, $dom -> documentElement -> nodeName.


    Specific nested elements of the XML document can be addressed using the DomDocument’s
    “getElementsByTagName()” method, which takes the name of the required element
    as a parameter. This method returns a “NodeList”, which a script can easily loop
    through using the foreach() function. The textual data of each node can be referenced
    by the “textContent” property, which PHP provides.


    The textContent property is not an actual W3C standard – it is a PHP convenience
    property, to access all text nodes of an element quickly.


    The script offset creates a DomDocument object, then loads the “books.xml” document
    (listed on the previous page). It proceeds to generate HTML output stating the
    XML document’s root element name and a list of all the text contained within its
    “topic” elements.


    ![](img/7faa63a7fa0add8f53300594ebae949f_179_0.png)'
  merge: -1
  img_proc: true
- pgno: 180
