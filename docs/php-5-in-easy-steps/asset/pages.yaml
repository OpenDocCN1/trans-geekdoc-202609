- pgno: 63
  md: '# Identifying browser & platform


    PHP creates some useful variables, which can be seen on the phpinfo.php page that
    was used to setup the PHP environment at the beginning of this book; these include
    an environment variable called HTTP_USER_AGENT, which identifies the user''s browser
    and operating system.


    The script below uses the getenv() function to assign a value to this environment
    variable and then writes it out to the page. The illustrations depict the script
    output in Internet Explorer on Windows XP and in the Mozilla browser on Linux:


    ```

    <html><head><title>Get browser &amp; platform</title></head><body><?php $viewer
    = getenv("HTTP_USER_AGENT"); echo("Browser details:<br>\$viewer"); ?></body></html>

    ```


    ![](img/7faa63a7fa0add8f53300594ebae949f_63_0.png)


    The details in Windows identify Internet Explorer 6.0 as a Mozilla-compatible
    web running on Windows XP (shown as NTS.I). In Linux the genuine Mozilla browser
    is correctly identified.


    ![](img/7faa63a7fa0add8f53300594ebae949f_63_1.png)


    ![](img/7faa63a7fa0add8f53300594ebae949f_63_2.png)


    62 | PHP 5 in easy steps'
