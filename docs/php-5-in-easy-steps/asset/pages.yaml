  md: "# Functions\n\nA function is a piece of PHP code that can be executed once\
    \ or many times by the PHP script. Functions and variables form the basis of all\
    \ PHP scripts.\n\nPHP has lots of intrinsic functions, such as echo(), but you\
    \ can create your own using the \"function\" keyword in a declaration. This is\
    \ followed by a space, a chosen name for your function (following the same naming\
    \ conventions used when naming variables). The function name is always followed\
    \ by a pair of plain brackets, then a pair of curly brackets containing the actual\
    \ code that is to be executed whenever that function is called.\n\nIn this example\
    \ the function has been named go() and it will write a short message and horizontal\
    \ ruled line whenever it is called.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_27_0.png)\n\
    \n```\n<html> <head><title>PHP Functions</title> </head><body>\n<?php function\
    \ go()>\n    echo (\"PHP adds dynamic content<hr>\"); } ?>\n\n<?php go(); ?>\n\
    </body> </html>\n```\n\nThis example uses separate PHP elements to declare and\
    \ call a function.\n\n*** HTML is great for static content ***\n\n<?php go();\
    \ ?>\n\n![](img/7faa63a7fa0add8f53300594ebae949f_27_1.png)"
