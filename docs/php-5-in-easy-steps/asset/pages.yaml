- pgno: 28
  md: "# Function arguments\n\nThe plain brackets that follow all function names can\
    \ be used to provide data for use in the code to be executed by that function,\
    \ just as the brackets of the PHP echo() function contain the string that is to\
    \ be written in the generated page.\n\nThe data contained within the brackets\
    \ is known as the function “argument”. In the following example, the function\
    \ call passes string values to the go() function's $arg argument for use in the\
    \ code that is to be executed. In this case the string value passed from the function\
    \ call is written out in bold, underlined italic text.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_28_0.png)\n\
    \n```\n<html>\n<head><title>PHP Arguments</title> </head>\n<body>\n<?php function\
    \ go($arg) {\necho \"<b><u><i>$arg</i></u></b>\"; \n } \n?>\n\n<p>This is the\
    \ regular text style of this page.</p>\n\n<?php go(\"This text has added style\"\
    ); ?>\n\n<p>This is the regular text style of this page.</p>\n\n<?php go(\"PHP\
    \ makes this so easy\"); ?>\n</body>\n</html>\n```\n\n![](img/7faa63a7fa0add8f53300594ebae949f_28_1.png)\n\
    \n| PHP Arguments |\n| File Edit View Tools Help |\n| Address | http://localhost/arg.php\
    \ | Go |\n| This is the regular text style of this page. |\n| This text has added\
    \ style |\n| This is the regular text style of this page. |\n| PHP makes this\
    \ so easy |"
