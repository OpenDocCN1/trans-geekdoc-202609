- pgno: 183
  md: "# Querying with XPath\n\nXPath allows you to query an XML document for specific\
    \ nodes matching particular criteria. This is far more powerful than the getElementsByTagName()\
    \ method, which simply returns a DomNodeList of all elements having the specified\
    \ name. For instance, the XML document food.xml (listed below), a call to getElementsByTagName(\"\
    item\") would return all the \"item\" child elements of \"fruit\" and \"veg\"\
    \ elements.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_183_0.png)\n\n```\n<?xml\
    \ version = \"1.0\" encoding = \"iso-8859-1\" ?>\n<fruit>\n  <item id=\"1\">Apple</item>\n\
    \  <item id=\"2\">Banana</item>\n  <item id=\"3\">Cherry</item>\n</fruit>\n<veg>\n\
    \  <item>Lettuce</item>\n  <item>Onion</item>\n</veg>\n<food>\n```\n\nXPath, however,\
    \ can return specific elements.\n\nTo start using XPath in PHP 5, a DomXPath object\
    \ must first be created using the \"new\" keyword and stating the name of the\
    \ loaded DomDocument as its parameter. The DomXPath object is assigned to a variable\
    \ in the same manner as with a new DomDocument object.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_183_1.png)\n\
    \nSignificantly, the DomXPath object has a query() method that returns a DomNodeList\
    \ of those nodes matching the criteria specified as its parameter. The simplest\
    \ query specifies the path to a particular element, such as \"food/fruit/item\"\
    .\n\nThe PHP script listed opposite assigns a DomXPath object to a variable called\
    \ \"$xp\". Its query() method is used to return a DomNodeList of all \"item\"\
    \ nodes within the \"fruit\" element. Their textContent is then written out in\
    \ a HTML list."
  merge: -1
  img_proc: true
- pgno: 184
  md: '# cont''d


    ![](img/7faa63a7fa0add8f53300594ebae949f_184_0.png)


    ```

