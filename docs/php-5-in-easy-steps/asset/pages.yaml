- pgno: 154
  md: '# cont''d


    ![](img/7faa63a7fa0add8f53300594ebae949f_154_0.png)


    SQL queries that work in the MySQL monitor can be used as the first argument to
    the PHP mysql_query() function.


    ![](img/7faa63a7fa0add8f53300594ebae949f_154_1.png)


    Order data can be specified by adding an "order" clause to the end of the SQL
    query. Adding "order by first_name" to the query arranges the data alphabetically
    by first_name:


    ![](img/7faa63a7fa0add8f53300594ebae949f_154_2.png)


    The method of working with MySQL via PHP follows this pattern —


    +   1) connect to MySQL

    2) select a database to use

    3) build a SQL query

    4) execute the query

    5) make use of the returned result set data.


    ![](img/7faa63a7fa0add8f53300594ebae949f_154_3.png)


    Specific data can be retrieved by adding a where qualifier to the SQL query. For
    instance, adding where id=3 to the query in the code shown opposite retrieves
    data from only that row:


    ![](img/7faa63a7fa0add8f53300594ebae949f_154_4.png)'
