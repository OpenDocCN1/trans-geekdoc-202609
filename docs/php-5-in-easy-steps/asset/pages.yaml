- pgno: 68
  md: '# ...cont''d


    The random number generator is useful to generate different banners on web pages
    so that the content can change on each visit. The example below generates a random
    number, then selects a banner image, and associated hyperlink, according to the
    number.


    ![](img/7faa63a7fa0add8f53300594ebae949f_68_0.png)


    ```

    <html><head><title>Random Images</title></head>

    body bgcolor = "#000000" >

    <?php

    rand( microtime() * 100000 );

    $num = rand( 1, 4);


    switch ($num) {

    case 1 : $car="alfa.jpg"; $url="alfa.php"; break;

    case 2 : $car="ferari.jpg"; $url="ferari.php"; break;

    case 3 : $car="jaguar.jpg"; $url="jaguar.php"; break;

    case 4 : $car="porsche.jpg"; $url="porsche.php"; break;

    }

    $banner = "<a href="$url">\n$banner = "<img src="$car">";

    $banner = "<width="380" height="110" border="0" \";

    echo( $banner );

    ?>

    </body></html>"

    ```


    ![](img/7faa63a7fa0add8f53300594ebae949f_68_1.png)


    The four banner images and link are located in Apache''s htdocs folder, alongside
    the randompix.php file.


    ![](img/7faa63a7fa0add8f53300594ebae949f_68_2.png)


    In this case the random number is chosen as 4 - so the Porsche banner image is
    displayed and clicking on it would take you to the Porsche page.


    ![](img/7faa63a7fa0add8f53300594ebae949f_68_3.png)'
