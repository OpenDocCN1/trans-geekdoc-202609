  md: "# Creating an upload script\n\nWhen a file is selected for upload, PHP automatically\
    \ adds it to the special $_FILES environment variable. This is a three-dimensional\
    \ array that is followed by two of square brackets with the syntax:\n\n$_FILES['file-name']\
    \ ['property']\n\nThe upload file can be referenced by inserting its name within\
    \ quotes in the first set of brackets. Various information about that file can\
    \ be referenced by inserting properties of \"name\", \"size\", \"type\", \"tmp-name\"\
    \ or \"error\" within quotes in the second set of brackets.\n\nTo accommodate\
    \ the possibility that a file transfer may not complete successfully, the PHP\
    \ die() function can be used to terminate the execution of a script and display\
    \ a string specified as its argument.\n\nThe example below attempts to copy a\
    \ file uploaded by the HTML form list on the previous page to Apache's htdocs\
    \ directory, will display the file's details upon completion.\n\n```\n<php\nif\
    \ ($_FILES['file']['name'] != \"\") {\n    copy ($_FILES['file']['tmp_name'],\n\
    \    \"C:/Apache/htdocs/\" . $_FILES['file']['name'])\n    or die(\"Could not\
    \ copy file\");\n} else{die(\"No file specified\"); };\n```\n\n![](img/7faa63a7fa0add8f53300594ebae949f_95_0.png)\n\
    \nThis script also provides a hyperlink that can load the uploaded file into\n\
    \n![](img/7faa63a7fa0add8f53300594ebae949f_95_1.png)\n\n```\n<html><head><title>Upload\
    \ complete</title></head>\n<body><h3>file upload succeeded...</h3>\n<ul>\n  <li>Name:\
    \ <?php echo $_FILES['file']['name']; ?> -> ?</li>\n  <li>Size: <?php echo $_FILES['file']['size'];\
    \ ?> -> bytes</li>\n  <li>Type: <?php echo $_FILES['file']['type']; ?> -> ?</li>\n\
    </ul>\n<p><a href=\"<?php echo $_FILES['file']['name']; ?>\">\n  Click here to\
    \ view file\\</a>\n</p>\n</body></html>\n```"
