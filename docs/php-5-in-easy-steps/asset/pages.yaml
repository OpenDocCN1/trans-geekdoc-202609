- pgno: 155
  md: '# More MySQL


    The common basic database operations demonstrated in this chapter use just some
    of the features of MySQL. To discover ways to make MySQL even more flexible it
    is recommended that you download the MySQL manual.


    The manual is available from the MySQL website at http://mysql.com/documentation,
    or one of its mirror sites.


    ![](img/7faa63a7fa0add8f53300594ebae949f_155_0.png)


    As testimony to the widespread popularity of MySQL, the manual is available in
    many languages, and in a variety of formats including HTML, Windows HLP format,
    PostScript, TextInfo and PDF.


    A tutorial is included in the manual, with examples illustrating common database
    queries – but, of course, these give only SQL code and do not feature any PHP
    scripts.


    The MySQL website at http://mysql.com gives the latest news on the development
    of MySQL and posts details about forthcoming developers'' conferences. It also
    offers a number of interesting User Stories, where you can read how other people
    are using MySQL.


    If you prefer to work with MySQL via a Graphical User Interface (GUI), rather
    than from a command line, try the MySQLGUI program available at http://mysql.com/downloads.
    There are versions for both Windows and Linux.


    Help with MySQL is available from the MySQL forum on the Developer Shed website
    at http://forums.devshed.com. It is worthwhile reading through past questions
    and answers to get a flavor of the forum before posting any questions yourself
    – and you may find the answer to your question already there.


    The main Developer Shed website at www.devshed.com is a great resource for learning
    more about MySQL, as it features lots of articles submitted by developers. Many
    of these are in the form of a tutorial or discussion and often relate the story
    of a problem that was overcome using both MySQL and PHP together.


    ![](img/7faa63a7fa0add8f53300594ebae949f_155_1.png)'
