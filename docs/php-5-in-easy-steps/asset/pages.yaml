- pgno: 177
  md: "# Introducing XML\n\nPHP version 5 introduces enhanced support for object oriented\
    \ programming and completely new support features for the increasingly important\
    \ XML (eXtensible Markup Language). Its XML support is now compliant with the\
    \ W3C (World Wide Web Consortium) specifications – unlike in previous releases.\n\
    \nPHP 5 supports DOM (Document Object Model) according to the W3C standard, and\
    \ the XPath query language. It also incorporates the PHP-specific \"SimpleXML\"\
    \ extension. Examples of DOM, XPath and SimpleXML are given in this chapter.\n\
    \nXML is a popular means of storing data, which adopts a strict syntax. It looks\
    \ very much like HTML, complete with tags, attributes, and values, but XML has\
    \ no predefined tags and is not used to create web pages. Instead, XML lets you\
    \ create your custom markup tags and define how these tags may be.\n\nIn XML each\
    \ opening tag must have a matching closing tag, and tag pairs must be correctly\
    \ nested. XML documents that meet these syntax requirements are said to be \"\
    well-formed\". The great advantage for applications handling well-formed XML data\
    \ is that they do not allow for incorrect syntax – unlike web browsers handling\
    \ HTML documents, which include a lot of tolerance code.\n\nAll XML documents\
    \ begin with a declaration tag, which announces that the document is using XML.\
    \ This typically includes attributes that describe the version and character encoding\
    \ type, like this:\n\n```\n<?xml version = \"1.0\" encoding = \"iso-8859-1\" ?>\n\
    ```\n\nHere the declaration specifies that this document is written with XML version\
    \ 1.0 in the common Latin character set.\n\nAll XML documents must have a main\
    \ tag element that encloses all other tags. This tag is more correctly called\
    \ the \"root\" element.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_177_0.png)\n\
    \n```\n<?xml version = \"1.0\" encoding = \"iso-8859-1\" ?>\n<root>\n  <greeting>Hello\
    \ World</greeting>\n</root>\n```"
  merge: -1
  img_proc: true
- pgno: 178
  md: "# ...cont'd\n\nIn the well-formed XML document hello.xml, listed opposite,\
    \ the root element is actually named “root”. The nested element named “greeting”\
    \ contains text content of “Hello World”.\n\nIn practice most XML documents contain\
    \ many tags, describing a great deal of data. For instance, the books.xml document,\
    \ listed below, contains data describing some other books in this series. Within\
    \ the “books” root element each “title” element contains nested tags for “topic”,\
    \ the “series” name, and the name of an image file of that book’s cover within\
    \ an element called “pic”.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_178_0.png)\n\
    \n```\n<?xml version = \"1.0\" encoding = \"iso-8859-1\" ?>\n<books>\n  <title>\n\
    \    <topic>JavaScript</topic>\n    <series>in easy steps</series>\n    <pic>js.gif</pic>\n\
    \  </title>\n  <title>\n    <topic>C++ Programming</topic>\n    <series>in easy\
    \ steps</series>\n    <pic>c++.gif</pic>\n  </title>\n  <title>\n    <topic>HTML</topic>\n\
    \    <series>in easy steps</series>\n    <pic>html.gif</pic>\n  </title>\n  <title>\n\
    \    <topic>SQL</topic>\n    <series>in easy steps</series>\n    <pic>sql.gif</pic>\n\
    \  </title>\n</books>\n```\n\n![](img/7faa63a7fa0add8f53300594ebae949f_178_1.png)\n\
    \n> HOT TIP Opening a XML document in a web browser, such as Internet Explorer,\
    \ displays the tags in “tree” if the document is well-formed. Otherwise, an error\
    \ message indicates the cause of the error.\n\nThis XML document is used by some\
    \ examples in this chapter to demonstrate XML support features in PHP 5."
