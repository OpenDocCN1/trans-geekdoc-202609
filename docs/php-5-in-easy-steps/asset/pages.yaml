- pgno: 67
  md: '# Random number generator


    The PHP rand() function is used to generate a random number. Optionally, a range
    of numbers from which the random number should be chosen can be specified as arguments
    to the rand() function starting minimum and maximum values of the range. instance,
    rand(1,10) would select a number between 1 and 10. When no range is specified
    the random number will be between zero and the default maximum of 32767.


    The random number generator should be seeded to prevent a regular pattern of numbers
    from being generated. This is achieved using the rand() function, which takes
    the seed number as its argument. Commonly, the seed number is specified as one
    million times the current time expressed to microsecond accuracy with the PHP
    microtime() function.


    This example uses the rand() function in the common manner, then generates random
    numbers in the range of 1 to 100.


    ![](img/7faa63a7fa0add8f53300594ebae949f_67_0.png)


    ```

    <html><head><title>Random Numbers</title></head>

    <body>

    <?php


    rand(microtime() * 1000000);

    $num = rand(1, 100);

    echo("Microtime:" . microtime() . "<br>");

    echo("A random number:" . $num . "<br>");

    $num = rand(1, 100);

    echo("Another random number:" . $num);


    ?>

    </body></html>

    ```


    ![](img/7faa63a7fa0add8f53300594ebae949f_67_1.png)


    | Random Numbers |

    | File Edit View Favorites Tools Help |

    | Address http://localhost/random.php Go |

    | Microtime:0.36768200 1086778854

    A random number:46

    Another random number:17 |'
