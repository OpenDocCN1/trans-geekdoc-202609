- pgno: 139
  md: '# SQL queries


    The basic SQL commands demonstrated in this chapter can be used to create database
    tables and fill them with data. More advanced features of SQL allow the data to
    be queried for specific information. For instance, the “cars” table at the bottom
    of page 136 can be searched, to find the details of any car with a top speed exceeding
    200 mph, with this query:


    ```

    select * from cars top_mph > 200;

    ```


    In this case there is just one record that fits the bill:


    The ability to query data contained within databases is where the power of MySQL
    lies. More information illustrating the advanced features of the SQL language
    is given in the manual contained in the Docs folder of the MySQL installation
    directory.


    Further details about SQL can also be found on the Internet in the MySQL Language
    Reference at www.mysql.com.


    MySQL databases can be queried from PHP, using special functions that replicate
    the SQL commands used in this chapter.


    Connecting to a MySQL database from PHP is easy thanks to the PHP mysql_connect()
    function. Once connected, the PHP mysql_query() function can be used to query
    the database and store the results in a PHP variable.


    The next chapter demonstrates how to implement all the operations shown in this
    chapter from inside PHP scripts.'
  merge: -1
