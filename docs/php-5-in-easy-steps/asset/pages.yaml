- pgno: 79
  md: "# PHP and mobile devices\n\nPHP can be used to supply appropriate content to\
    \ the emerging range of mobile devices that can access the Internet.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_79_0.png)\n\
    \nCommonly these have much smaller display areas than a PC monitor, so large images\
    \ are not suitable. Also they often have reduced capabilities and may not be able\
    \ to read web pages correctly. For instance, the i-mode standard favored by NTT\
    \ DoCoMo uses Compact HTML (cHTML), which has only some of the tags available\
    \ in HTML.\n\nThe example below searches the HTTP_USER_AGENT environment variable\
    \ to identify the browser. If it finds the Pixo micro-browser used on some mobile\
    \ devices it will supply a small image. Otherwise a large image is supplied.:\n\
    \n```\n<html><head><title>Welcome Page</title></head><body>\n<?php $browser =\
    \ $_SERVER['HTTP_USER_AGENT'];\n\nif (preg_match(\"/Pixo/i\", \"$browser\")) {\n\
    \t$img = \"<img src=\"small-tux.gif\" width=\"64\" height=\"75\" alt=\"tux\">\"\
    ;\n} else {\n\t$img = \"<img src=\"large-tux.gif\" width=\"320\" height=\"375\"\
    \ alt=\"tux\">\";\n}\necho ($img);\n?>\n\n</body>\n</html>\n```\n\n![](img/7faa63a7fa0add8f53300594ebae949f_79_1.png)\n\
    \nAlternatively, PHP could redirect the micro-browser to a cHTML page containing\
    \ content appropriate for the device.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_79_2.png)"
  merge: -1
