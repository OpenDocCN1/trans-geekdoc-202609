- pgno: 132
  md: '# Creating a database table


    To create a database table you must first select the database to which it is to
    be added, using the SQL "use database-name;" command. This requires the name of
    one of the existing databases, revealed by the "show databases;" command.


    A new table is created with the SQL "create table table-name;" command, specifying
    a column name for that table, then a comma-separated list of column names enclosed
    within a pair of brackets. Additionally, each column name must be followed by
    a data type specifier to set the type of data permitted in the table cells of
    that column. These specifiers can use SQL keywords of "int" for integer numbers,
    "decimal" for floating-point numbers, or "text" for character strings.


    A semi-colon is required after each complete command.


    ![](img/7faa63a7fa0add8f53300594ebae949f_132_0.png)


    For instance, the syntax to create a table with three columns is: "create table
    table-name (column1-name column1-type, column2-name column2-type, column3-name
    column3-type);";


    Once a database has been selected, the SQL "show tables;" command reveals the
    names of all tables in that database. This is used in the MySQL monitor illustrated
    below to confirm the addition of a table called "cars" to the "garage" database.
    The cars table contains one numeric column called "id", and two text columns called
    "make" and "model". More SQL column types and options are described on the next
    page.


    ![](img/7faa63a7fa0add8f53300594ebae949f_132_1.png)


    To close the MySQL monitor type "exit" or "quit" at the mysql> prompt.


    ```

    MySQL Monitor\mysql> use garage;

    Database changed\mysql> create table cars(id int,make text,model text);

    Query OK, 0 rows affected (0,00 sec)


    mysql> show tables;

    +----------------------+

    | Tables_in_garage    |

    +----------------------+

    | cars                 |

    +----------------------+

    1 row in set (0,00 sec)

    mysql>

    ```'
  merge: -1
  img_proc: true
- pgno: 133
  md: '# SQL data types


    The table below describes the range of data type specifiers that can be used when
    creating table columns in MySQL. It is advisable to specify the permitted data
    type precisely. For instance, if a column is only going to hold short strings
    use varchar() rather than text.


    | Type | Description |

    |---|---|

    | int | An integer from -2147483648 to 2147483647 |

    | decimal | A floating point number that can specify the number of permissible
    digits. For example decimal(3,2) allows -999.99 to 999.99 |

    | double | A long double-precision floating point number |

    | date | A date in the YYYY-MM-DD format |

    | time | A time in the HH:MM:SS format |

    | datetime | A combined date and time in the format YYYY-MM-DD HH:MM:SS |

    | year | A year 1901-2155 in either YY or YYYY format |

    | timestamp | Automatic date and time of last record entry |

    | char() | A string of defined fixed length up to 255 characters long. For example,
    char(100) pads a smaller string to make it 100 characters long |

    | varchar() | A string of defined variable length up to 255 characters that is
    stored without padding |

    | text | A string up to 65535 characters long |

    | blob | A binary type for variable data |

    | enum | A single string value from a defined list. For example, enum("red","green","blue")
    allows any one of these three colors |

    | set | A single or multiple strings from a defined list. For example, set("red","green","blue")
    allows any one or more of these three colors |


    ![](img/7faa63a7fa0add8f53300594ebae949f_133_0.png)


    An enum type can contain up to 65535 permissible elements.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# SQL field modifiers


    In addition to specifying permissible data types when creating database columns,
    the modifiers described in the following table can optionally be stated to further
    control how a column should be used:


    | Modifier | Description |

    | --- | --- |

    | not null | Insists that each record must include data entry in this column |

    | unique | Insists that records may not duplicate any entry in this column |

    | auto_increment | Available only for numeric columns to automatically generate
    a number that is one more than the previous value in that column |

    | primary key() | Specifies as its argument the name of the column to be used
    as the primary key for that table. For example, primary key(id) |


    Modifiers could be included when creating the cars table on page 131 to produce
    a table with better defined columns. The "create table-name;" command shown in
    the MySQL monitor below automatically number the primary key id. Each record must
    now include data in the "make" and "model" columns, although no duplicate entries
    are permitted in the "model" column.


    ![](img/7faa63a7fa0add8f53300594ebae949f_134_0.png)


    ```

    MySQL Monitor

    mysql> use garage;

    Database changed

    mysql> create table cars(id int auto_increment,

    make varchar(20) not null,

    model varchar(20) not null unique,

    primary key(id));

    Query OK. 0 rows affected (0.00 sec)

    mysql> _

    ```'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# # Inserting table data


    Once a table has been created in a MySQL database, data can be entered into it
    with the SQL “insert into” command. The syntax to enter a complete record across
    a row is:

    “insert into table-name values (value1, value2, value3);”


    The data values are entered as comma-separated arguments to the SQL values() function;
    the list must correspond to the number of table columns and each value must be
    of the correct data type.


    ![](img/7faa63a7fa0add8f53300594ebae949f_135_0.png)


    Enclose string data quotes when inserting data.


    ```

    MySQL Monitor

    insert into cars values(1, "Porsche", "Carrera");

    Query OK, 1 row affected (0,07 sec)


    insert into cars(make,model)

    values("Ferrari","Dino\("Lamborghini","Diablo");

    Query OK, 2 rows affected (0,00 sec)

    Records: 2 Duplicates: 0 Warnings: 0


    mysql select * from cars;

    +----+------+----------+

    | id | make      | Model    |

    +----+------+----------+

    | 1 | Porsche   | Carrera |

    | 2 | Ferrari  | Dino     |

    | 3 | Lamborghini| Diablo  |

    +----+------+----------+

    3 rows in set (0,00 sec)

    mysql>

    ```


    ![](img/7faa63a7fa0add8f53300594ebae949f_135_1.png)


    Notice that the id value for the second and third records has been generated automatically
    because column''s auto_increment modifier.


    Another way to insert data into a table is to specify the column names where the
    data is to be added as a comma-separated list, such as “insert into-name(column-name,
    column-name);”. The actual data to be inserted into the specified columns is then
    listed as the values() function arguments as usual.


    SQL instructions in the illustration use three methods to add records to the “cars”
    table created on the previous page.


    An entire table can be viewed with a SQL “select * from” command, followed by
    the name of the table, and the obligatory semi-colon. The example above uses this
    command to view the “cars” table.'
