  md: "# Altering an existing table\n\nThe definition of a column in an existing table\
    \ can be altered using the SQL commands “alter table” and “modify”, with the following\
    \ syntax:\n\nalter table table-name modify field-name modifiers;\n\nNew columns\
    \ can be added to an existing table using the same “alter table” command, but\
    \ now with the SQL “add” keyword. The syntax to add an extra column looks like\
    \ this:\n\nalter table table-name add field-name modifiers;\n\nThe example shown\
    \ in the MySQL monitor below uses the “alter table” command to add a new extra\
    \ column called “top_mph” to the cars table from the previous page. Data can now\
    \ be entered into the new column using the SQL “update” command, which is demonstrated\
    \ on the next page.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_136_0.png)\n\n\
    The new top_mph column does not have “not null” modifier, so it is to enter data\
    \ here.\n\n```\nmysql> use garage;\nDatabase changed\nmysql> select * from cars;\n\
    +------+-----------+----------+\n| id | make      | model    |\n+------+-----------+----------+\n\
    | 1 | Porsche    | Carrera |\n| 2 | Ferrari    | Dino     |\n| 3 | Lamborghini|\
    \ Diablo  |\n+------+-----------+----------+\n3 rows in set (0.00 sec)\nmysql>\
    \ alter table cars add top_mph int;\nQuery OK, 3 rows affected (0,02 sec)\nRecords:\
    \ 3 Duplicates: 0 Warnings: 0\nmysql> select * from cars;\n+------+-----------+----------+----------+\n\
    | id | make      | model    | top_mph |\n+------+-----------+----------+----------+\n\
    | 1 | Porsche    | Carrera | NULL |\n| 2 | Ferrari    | Dino     | NULL |\n| 3\
    \ | Lamborghini| Diablo  | NULL |\n+------+-----------+----------+----------+\n\
    3 rows in set (0.00 sec)\nmysql> \n```"
