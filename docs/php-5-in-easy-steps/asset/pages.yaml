- pgno: 43
  md: '# Conditional if statement


    The “if” keyword is used to perform the basic conditional PHP test to evaluate
    an expression for a boolean value. The statement following the evaluation will
    be executed only when the expression is true. The syntax for the “if” statement
    looks like this:


    ```

    if ( test-expression ) statement-to-execute-when-true ;


    {

    ```


    The code to be executed may contain multiple statements if they are enclosed in
    a pair of curly brackets to form a “statement block”.


    In the example below the expression to be tested uses the modulus operator to
    determine if the value contained in the variable $num is exactly divisible by
    2. The statement block has two statements – one to assign a string value to a
    variable and another to call the PHP echo function.


    ```

    <html>

    <head><title>If Statement</title></head>

    <body>

    <?php

    $num = 7;

    if ( $num % 2 != 0 ) {


    $msg = "$num is an odd number.";

    echo( $msg );

    }

    ?>

    </body>

    </html>

    ```


    ![](img/7faa63a7fa0add8f53300594ebae949f_43_0.png)


    This example could have used ($num%2!=1) to detect an even number.


    ![](img/7faa63a7fa0add8f53300594ebae949f_43_1.png)


    ![](img/7faa63a7fa0add8f53300594ebae949f_43_2.png)'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# If-else statement


    The PHP "else" keyword can be used with an "if" statement to provide alternative
    code to execute in the event that the tested expression is found to be false.


    This is known as "conditional branching" and has this syntax:


    ```

    if ( test-expression ) do-this; else do-this ;

    ```


    Several expressions may be tested until a true value is found, when the code following
    the true expression will be executed. It is important to note that any further
    code contained in the if-else statement is ignored.


    In the following example, any code after the call to the echo() function by the
    successful third test will be ignored:


    ```

    <html><head><title>If-else Statement</title></head>

    <body>

    <?php

    $num = 2;

    if($num==1 and $bool==true) echo("Test 1 success");

    else

    if($num==2 and $bool==true) echo("Test 2 success");

    else

    if($num==2 and $bool==false) echo("Test 3 success");

    else

    if($num==3 and $bool==false) echo("Test 4 success");

    ?>

    </body></html>

    ```


    ![](img/7faa63a7fa0add8f53300594ebae949f_44_0.png)


    The semi-colon is required after the first code statement, before the "else" alternative
    code.


    | If-else Statement |

    | File Edit View Tools Help |

    | Address: http://localhost/ifelse.php Go |

    | Test 3 success |

    | Done Local intranet |'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# Switch statement


    Conditional branching using an “if-else” statement can often be performed more
    efficiently using a “switch” statement, when the test expression evaluates the
    value of just one variable.


    The “switch” statement works in an unusual way. First it evaluates a given expression,
    then seeks a label to match the resulting value. The code associated with the
    matching label will be executed, or if none of the labels match, the statement
    will execute any specified default code.


    The PHP “case” keyword is used to denote a label, and the “default” keyword is
    used to specify the default code. All label code must be terminated by a break
    statement using the PHP “break” keyword.


    The labels may be numbers, strings, or booleans, but all will be of the same type,
    like this example uses numbers:


    ![](img/7faa63a7fa0add8f53300594ebae949f_45_0.png)


    ```

    <html><head><title>Switch Statement</title></head>

    <body>

    <?php

    $num = 2;

    switch($num) {

    case 1 : echo("This is case 1 code\ ); break;

    case 2 : echo("This is case 2 code\ ); break;

    case 3 : echo("This is case 3 code\ ); break;

    default : echo("This is default code\ );

    }

    ?>

    ?></body></html>

    ```


    ![](img/7faa63a7fa0add8f53300594ebae949f_45_1.png)


    ![](img/7faa63a7fa0add8f53300594ebae949f_45_2.png)


    ![](img/7faa63a7fa0add8f53300594ebae949f_45_3.png)'
  merge: -1
  img_proc: true
- pgno: 46
  md: "# For loop\n\nThe “for” loop is probably the most frequently used type of loop\
    \ in PHP scripting, and has this syntax:\n\n```\nfor( initializer , test , increment\
    \ ) { statement/s }\n```\n\nThe initializer is used to set the start value for\
    \ the counter of the number of loop iterations. A variable may be declared here\
    \ for the purpose, and it is traditional to name it $i.\n\nOn each pass of the\
    \ loop the expression is tested for a boolean result and that iteration of the\
    \ loop will run only if the result is true. The loop will end if the result test\
    \ false.\n\nWith every iteration the loop executes the code in the statement,\
    \ then increments the counter within. Multiple statements can be executed if they\
    \ are contained within curly brackets to form a statement block.\n\nThe following\
    \ example makes five iterations and changes the assigned value of two variables\
    \ on each pass of the loop:\n\n![](img/7faa63a7fa0add8f53300594ebae949f_46_0.png)\n\
    \n```\n<html><head><title>For Loop</title></head><body>\n<?php\n$a = 0; $b = 0;\n\
    for ($i = 0; $i < 5; $i++) {\n  $a += 10; $b += 5;\n}\necho \"At the end of the\
    \ loop a=$a and b=$b\";\n?>\n</body></html>\n```\n\n![](img/7faa63a7fa0add8f53300594ebae949f_46_1.png)\n\
    \n![](img/7faa63a7fa0add8f53300594ebae949f_46_2.png)"
  merge: -1
  img_proc: true
- pgno: 47
  md: "# While loop\n\nAnother type of loop uses the PHP “while” keyword followed\
    \ by an expression to be evaluated for a boolean value of true or false.\n\nIf\
    \ the test expression is true then the code in the statement block will be executed.\
    \ After the code has executed, the test expression will again be evaluated and\
    \ the loop will continue until the expression is found to be false.\n\nThe statement\
    \ block must feature code that will affect the test expression in order to change\
    \ the evaluation result to false at some point, otherwise an infinite loop will\
    \ be created.\n\nAn infinite loop will lock the script so that the page will not\
    \ complete.\n\nIt is important to note that if the test expression is not true\
    \ when it is first evaluated, the code in the statement block is never executed.\n\
    \nThis example decrements a variable value on each iteration of the loop, and\
    \ the counter increments until it reaches 10, when the evaluation is false and\
    \ the loop ends.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_47_0.png)\n\n```\n\
    <html><head><title>While Loop</title></head>\n<body>\n<?php\n$i = 0; $num = 50;\n\
    while($i < 10) \n{\n$num--;\n$i++;\n}\necho (\"Loop stopped at $i<br> \\$num is\
    \ now $num\" );\n?>\n</body></html>\n```\n\n![](img/7faa63a7fa0add8f53300594ebae949f_47_1.png)\n\
    \n| While Loop |\n| File Edit View Favorites Tools Help |\n| Address http://localhost/whileloop.php\
    \ | Go |\n| Loop stopped at 10 \\n$num is now 40 |\n| Done | Local intranet |"
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Do-while loop


    The PHP “do” keyword is used to denote the start of a “do-while” loop and is followed
    by a statement block containing the code to be executed on each iteration of the
    loop.


    The statement code is followed by the PHP “while” keyword and the expression to
    be evaluated for a boolean value of true or false.


    If the test expression is true, the loop restarts at the “do” keyword and will
    continue until the test expression becomes false.


    It is important to note that, unlike the simple while loop, the statement code
    will always be executed at least once by the “do-while” loop because the test
    expression is not encountered until the end of the loop.


    The following example will never loop, because the counter value is incremented
    to 1 in the first execution of the statement code so the test expression is false
    the very first time it is tested:


    ![](img/7faa63a7fa0add8f53300594ebae949f_48_0.png)


    ```

    <html>

    <head><title>Do-While Loop</title></head>

    <body>

    <?php

    $i = 0; $num = 50;


    doo {

    $num--; $i++;

    } while ($i < 1);


    echo("Loop stopped at $i<br>$num is now $num");


    ?>

    </body></html>

    ```


    A “while” loop is often more suitable than a “do-while” loop.


    ![](img/7faa63a7fa0add8f53300594ebae949f_48_1.png)'
  merge: -1
  img_proc: true
- pgno: 49
  md: "# Interrupting loops “break\"\n\nThe PHP “break” keyword is used to terminate\
    \ the execution of a loop prematurely.\n\nThe “break” statement is situated inside\
    \ the statement block containing the code that the loop executes, and is preceded\
    \ by a conditional test.\n\nWhen the test condition is true, the “break” statement\
    \ immediately terminates the loop and no further iterations are made.\n\nNotice\
    \ in the output below that the counter value is still three because the increment\
    \ in the final iteration is not applied.\n\nIn the following example the conditional\
    \ test becomes true when the counter value reaches three:\n\n![](img/7faa63a7fa0add8f53300594ebae949f_49_0.png)\n\
    \n```\n<html>\n<head><title>Break Statement</title></head>\n<body>\n<?php\n$i\
    \ = 0;\n\nwhile ($i < 6 )\n{\n    if ($i == 3) break;\n    $i++;\n}\necho(\"Loop\
    \ stopped at $i by break statement\");\n\n</body></html>\n```\n\n> The “break”\
    \ keyword is also used as a terminator when used with a “switch” statement – see\
    \ page 44.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_49_1.png)\n\n![](img/7faa63a7fa0add8f53300594ebae949f_49_2.png)"
  merge: -1
  img_proc: true
- pgno: 50
  md: "# ...cont'd\n\nThe PHP \"continue\" keyword is used to halt the current iteration\
    \ of a loop, but it does not terminate the loop. Just like the \"break\" statement,\
    \ the \"continue\" statement is situated inside the statement block containing\
    \ the code that the loop executes, preceded by a conditional test.\n\nWhen the\
    \ test condition is true, the continue statement immediately stops the current\
    \ iteration of the loop, but further iterations will be made until the loop ends.\n\
    \nIn the example below, the test condition is true when the counter value reaches\
    \ three, so the string concatenation in that iteration is not applied but the\
    \ loop continues on.\n\n```\n<html>\n<head><title>Continue Statement</title></head>\n\
    <body>\n<?php\n  $i = 0; $passes = \"\";\n  while ($i < 5) {\n    $i++;\n    if\
    \ ($i == 3 ) continue;\n    $passes .= \"$i\";\n  }\n  echo (\"Loop stopped at\
    \ $i<br> \");\n  echo (\"Completed iterations:$passes\");\n?>\n</body>\n</html>\n\
    ```\n\nThe loop counter must be incremented before the continue condition is tested,\
    \ to avoid creating an infinite loop.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_50_0.png)\n\
    \n4. Making statements | 49"
  merge: -1
  img_proc: true
- pgno: 51
  md: "# Return statement\n\nThe PHP \"return\" keyword is used in functions to return\
    \ a final value to the caller of function.\n\nThe example below contains a general\
    \ purpose function called multiply() that can multiply by five argument values\
    \ and return the total to the caller.\n\nIt is called from within the echo() function\
    \ to multiply three argument values. The total is returned, using the \"return\"\
    \ keyword, and the echo() function writes the total on the bare.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_51_0.png)\n\
    \n```\n<php\nfunction multiply($a=1, $b=1, $c=1, $d=1, $e=1) {\n    $total = $a\
    \ * ($b * ($c * ($d * $e) ));\n    return $total;\n}\n```\n\nEach argument to\
    \ the multiply() function uses a default value of 1 unless passed from the caller.\
    \ The example illustrated returns the number of minutes in a year, but the function\
    \ can call multiply(365.25,24,60) would return the number of seconds in a year.\n\
    \n```\n?>\n<html><head><title>Return Statement</title></head>\n<body>\nEach year\
    \ has 365¼ days<br>\nEach day has 24 hours<br>\nEach hour has 60 minutes<br>\n\
    Each year has <?php echo (multiply(365.25, 24, 60) ?> minutes\n</body></html>\n\
    ```\n\n![](img/7faa63a7fa0add8f53300594ebae949f_51_1.png)\n\n50 | PHP-5 in easy\
    \ steps"
  merge: -1
  img_proc: true
