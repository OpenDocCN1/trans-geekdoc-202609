  md: '# Creating a database table


    An existing database can be selected for the PHP mysql_select_db() function, which
    takes the database name and connection link as its two arguments. Once selected,
    operations can be performed by specifying SQL commands as arguments to the PHP
    mysql_query() function. So “create table-name” can be used to create a new table
    inside a database.


    An SQL command specified in PHP does not need the semicolon terminator that is
    required when executing SQL commands directly in the MySQL monitor.


    This example creates an interface to dynamically create a new database table.
    Initially $fields is not set, so a form is written asking how many columns are
    required. When the form is submitted, the script generates a form with inputs
    for the names and data types of each field. The values entered into each field
    of the completed form are used to produce a SQL command to create a database table
    with the chosen fields.


    ![](img/7faa63a7fa0add8f53300594ebae949f_147_0.png)


    ![](img/7faa63a7fa0add8f53300594ebae949f_147_1.png)


    ![](img/7faa63a7fa0add8f53300594ebae949f_147_2.png)


    When the first form is submitted with an entry in the input field the $fields
    variable is set the script moves onto the next section.


    ```

    <html><head><title>Creating a table</title></head>

    <?php

    $self = $_SERVER[''PHP_SELF''];

    $fields = $_POST[''fields''];

    $db = $_POST[''db''];

    $name = $_POST[''name''];

    $table = $_POST[''table''];

    $type = $_POST[''type''];

    $size = $_POST[''size''];

    if (!$fields && !$db) {

    $form = "<form action="$self" method="post">\n$form .= "How many fields are needed
    in the new table?";

    $form .= "<br><input type="text" name="$fields">";

    $form .= "<input type="submit" value="Submit">";

    echo ($form );

    ?>

    ```


