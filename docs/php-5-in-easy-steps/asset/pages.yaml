  md: '# More PHP resources


    This book will, hopefully, have provided you with a great introduction to PHP
    server-side scripting, and may have inspired you with some of PHP''s creative
    possibilities.


    The many PHP functions used in the examples book are, in fact, just a small selection
    from the hundreds of functions that are available in the PHP scripting language.
    To see the entire range of functions, and to go further with PHP, it is recommended
    that you now download the PHP manual from www.php.net/download-docs.php.


    ![](img/7faa63a7fa0add8f53300594ebae949f_187_0.png)


    The manual is available in several languages and many formats, including HTML,
    PDF and Windows HLP format. It is very comprehensive and has a section called
    Function Reference, which defines each function on its own page. These are grouped
    under topic headings and may contain examples illustrating how they can be used
    in a PHP script.


    ![](img/7faa63a7fa0add8f53300594ebae949f_187_1.png)


    The PHP Builder Website at www.phpbuilder.com is a terrific resource offering
    articles about PHP. This site also has several forums where help can be sought
    on PHP scripting. Some source code is available for free download and you can
    even access the PHP manual online there.


    Another great online resource is the PHP Resource Index at http://php.resourceindex.com.
    This site has lots of useful code snippets and offers hundreds of complete PHP
    scripts – although not all of these are available free.


    The site''s Documentation section contains examples and tutorials with lots of
    handy tips. The Frequently Asked Questions (FAQ) pages can be scoured for previous
    answers to PHP questions.


    In the Community section there are links to many PHP-related bulletin boards on
    the Internet where you can find other PHP developers. There is information about
    PHP mailing lists, development tools, user groups and lots more.


    The huge popularity of PHP, as a scripting language especially suited to web development,
    ensures its continuing success – happy scripting with PHP!'
