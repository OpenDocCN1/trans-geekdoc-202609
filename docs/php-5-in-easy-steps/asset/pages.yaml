  md: '# Updating records


    All data values in an existing table column can be changed using the SQL `update`
    command with the SQL `set` keyword, like this:


    update table-name set field-name = new-value;

    More usefully, individual column values can be changed by adding a qualifier to
    this syntax with the SQL `where` keyword, like this:


    update table-name set field-name = new-value where id = int;


    This can be used in the "cars" table from the previous page to update the "model"
    and "top_mph" columns:


    ![](img/7faa63a7fa0add8f53300594ebae949f_137_0.png)


    Notice that id is used as the qualifier in these updates — except for the second
    and third instructions, which use the value of the column as their qualifier.


    ```

    MySQL Monitor

    mysql> update cars set model=911 Turbo where id=1;

    Query OK, 1 row affected (0,04 sec)

    Rows matched: 1 Changed: 1 Warnings: 0


    mysql> update cars set model="F355" where makes="Ferrari";nQuery OK, 1 row affected
    (0,00 sec)

    Rows matched: 1 Changed: 1 Warnings: 0


    mysql> update cars set model="Murcielargo"

    where makes="Lamborghini";nQuery OK, 1 row affected (0,00 sec)

    Rows matched: 1 Changed: 1 Warnings: 0


    mysql> update cars set top_mph=189 where id=2;

    Query OK, 1 row affected (0,00 sec)

    Rows matched: 1 Changed: 1 Warnings: 0


    mysql> update cars set top_mph=205 where id=3;

    Query OK, 1 row affected (0,00 sec)

    Rows matched: 1 Changed: 1 Warnings: 0


    mysql> select * from cars;

    +------------------------------------------------------+

    | id | make        | model          | top_mph      |

    +------------------------------------------------------+

    | 1  | Porsche       | 911 Turbo     | 189      |

    | 2  | Ferrari      | F355           | 183      |

    | 3  | Lamborghini  | Murcielargo    | 205      |

    +------------------------------------------------------+

