- pgno: 99
  md: '# Introducing cookies


    Cookies are text files saved by websites on computers accessing them. Each cookie
    can contain around 4000 characters, up to 20 cookies can be stored for each website,
    and the client computer can store a maximum of 300 cookies in total. They are
    useful to retain user preferences, shopping cart selections, and snippets of data.


    Cookie files can be opened with any text editor, so sensitive information should
    be encrypted. For instance, rather than directly store a user''s password in a
    cookie, it is better to store a unique identification string that references a
    database entry containing the password on the server.


    When a user has logged onto a site their first name can be stored in a cookie
    so that each page they visit could greet them by name.


    ![](img/7faa63a7fa0add8f53300594ebae949f_99_0.png)


    When setcookie() returns true (1) it signifies that the function ran OK - it does
    not verify that the cookie was accepted.


    In PHP, cookies are created with the setcookie() function. This should be used
    to create a cookie at the very beginning of the PHP document – before any other
    code, tags or whitespace. The cookie does not become visible until the next page
    is loaded, but its creation can be verified by the value returned from setcookie().
    otherwise it returns false (0).


    ```

    <?php

    echo("Cookie created? : ");

    setcookie("cookie_name", "cookie_data" );

    ?>

    ```


    ```

    <html>

    <head><title>Cookie</title> </head>

    <body></body>

    </html>

    ```


    ![](img/7faa63a7fa0add8f53300594ebae949f_99_1.png)


    98 | PHP 5 in easy steps'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# ...cont''d


    The setcookie() function sets just one cookie at a time and requires up to six
    arguments. These are described in the following list, in the order in which they
    must appear:


    +   **Name** - This sets the name of the cookie and is stored in a PHP environment
    variable array called $_COOKIE[]. The cookie can be referenced by inserting the
    cookie name within quotes inside the square brackets.


    +   **Value** - This sets the value of the named variable and is the content that
    you want to store.


    +   **Expiry** - This specifies a future time, in seconds since 00:00:00 GMT on
    January 1st, 1970, at which the cookie will become inaccessible. If this argument
    is not set, the cookie will automatically expire when the web browser is closed.


    +   **Path** - This specifies the server directories for which the cookie is valid.
    A single forward slash permits the cookie to be valid for all directories. If
    a directory is specified, the cookie is valid only within that directory.


    +   **Domain** - This can be used to specify the domain name, and must contain
    at least two periods to be valid. If this argument is not specified, the default
    value is the host of the server that created the cookie. All cookies are valid
    only for the host and domain that created them.


    ![](img/7faa63a7fa0add8f53300594ebae949f_100_0.png)


    The setcookie() function can be used with an expiry date in the past to delete
    a


    cookie.


    ![](img/7faa63a7fa0add8f53300594ebae949f_100_1.png)


    The expiry and security arguments must be integer values.


    Other arguments can be replaced with an empty string if they are not to be explicitly
    set.


    +   **Security** - This can be set to 1 to specify that the cookie should be sent
    only by secure transmission using HTTPS, otherwise (if set to 0) the cookie can
    be set by regular HTTP.


    All arguments except the name argument are optional. If only the name argument
    is present, the cookie with that name will be deleted from the user''s computer.


    The expiry is easily set by adding a number of seconds onto the current time,
    retrieved using the PHP time() function. Each of these examples set a cookie named
    "ID", with a value of "X12345", to expire 24 hours after it is generated:


    ```

    cookie("ID", "X12345", time()+86400 , "/", " ", 0);

    cookie("ID", "X12345", time()+86400 );

    ```


    8. Data persistence | 99'
  merge: -1
  img_proc: true
- pgno: 101
  md: "# Set a cookie\n\nIt is important to remember that the values stored in a cookie\
    \ cannot be retrieved until the browser makes another HTTP request. This normally\
    \ means that cookie values stored on page one can be retrieved on only subsequent\
    \ pages in the website.\n\nThe following example demonstrates how to store two\
    \ items of data entered by the user into form fields \"user\" and \"color\". When\
    \ the form is submitted, the page reloads. If values have been entered into both\
    \ form fields, the script stores these values in cookies called \"firstname\"\
    \ and \"fontcolor\" respectively. The browser is redirected to another page, which\
    \ retrieves the stored values from within the cookies.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_101_0.png)\n\
    \n```\n<php $user = $_POST['user']; #assign value\n$color = $_POST['color']; #assign\
    \ value\n$self = $_SERVER['PHP_SELF']; #assign value\n\nif ($user != null) and\
    \ ($color != null) {\n    setcookie(\"firstname\", $user, time()+36000);\n   \
    \ setcookie(\"fontcolor\", $color, time()+36000);\n    header(\"Location:getcookie.php\"\
    );\n    exit();\n}\n\n<html><head><title>Set Cookie Data</title></head> <body>\n\
    <form action=\"<?php echo ($self); ?>\" method=\"\">\nPlease enter your first\
    \ name:\n<input type=\"text\" name=\"user\" <br><br>\nPlease choose your favorite\
    \ font color: <br>\n<input type=\"radio\" name=\"color\" value=\"#FF0000\">Red\n\
    <input type=\"radio\" name=\"color\" value=\"#00FF00\">Green\n<input type=\"radio\"\
    \ name=\"color\" value=\"#0000FF\">Blue\n<br><br><input type=\"submit\" value=\"\
    submit\">\n</form>\n</body></html>\n```"
  merge: -1
  img_proc: true
