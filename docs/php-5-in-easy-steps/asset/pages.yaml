  md: "# Access limitation\n\nCookies can be used to prevent direct access to pages\
    \ of a website without logging in to that site. The log-in process creates the\
    \ cookie, then PHP scripts on all other pages confirm the existence of that cookie\
    \ before displaying their content.\n\nIn this example the log-in page creates\
    \ a cookie called \"auth\" with a value of \"ok\" when the user submits the form\
    \ with both \"user\" and \"pass\" input fields completed. The browser is redirected\
    \ to a second page that seeks the cookie. If that page does not find the cookie,\
    \ the browser is redirected to the log-in page. Another page in this example makes\
    \ the same check, and has the same response.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_103_0.png)\n\
    \n```\n<?php\n$user = $_POST['user']; //assign value\n$pass = $_POST['pass'];\
    \ //assign value\n$self = $_SERVER['PHP_SELF']; //assign value\n\nif ($user !=\
    \ null) && ($pass != null)) {\n    setcookie(\"auth\", \"ok\");\n    header(\"\
    Location:login.php\"); exit();\n}\n?>\n\n<html><head><title>Set Cookie Data</title></head>\n\
    <form action=\"<?php echo ($self); ?>?\" method=\"post\">\nName: <input type=\"\
    text\" name=\"user\">\nPassword: <input type=\"text\" name=\"pass\"><br><br>\n\
    <input type=\"submit\" value=\"Log Me In />\n</form>\n</body></html>\n```\n\n\
    ![](img/7faa63a7fa0add8f53300594ebae949f_103_1.png)\n\n![](img/7faa63a7fa0add8f53300594ebae949f_103_2.png)"
