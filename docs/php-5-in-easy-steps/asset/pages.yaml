  md: "# Creating a new database\n\nMySQL databases can be created and their contents\
    \ amended or queried in the MySQL monitor using Structured Query Language (SQL)\
    \ commands.\n\nThe SQL command “create database database-name;” is used to create\
    \ a new database.\n\nOpen the MySQL monitor then type “create database garage;”\
    \ to create a new database called “garage”.\n\nThe MySQL monitor responds by confirming\
    \ that the new database has been created, with the message Query OK followed by\
    \ information about affected rows and time elapsed.\n\nThe names of all databases\
    \ on the MySQL server can be viewed with the SQL “show databases;” command to\
    \ confirm that the new database does indeed exist:\n\n![](img/7faa63a7fa0add8f53300594ebae949f_131_0.png)\n\
    \n```\nMySQL Monitor\nmysql> create database garage:\nQuery OK, 1 row affected\
    \ (0,00 sec)\nmysql> show databases;\n-----------------\n| Database |\n-----------------\n\
    | garage |\n| mysql  |\n| test   |\n-----------------\n3 rows in set (0,00 sec)\n\
    mysql> \n```\n\nIf a database with your chosen name already exists, MySQL will\
    \ not create a new database, but will respond with this error message:\n\nERROR1007:\n\
    Can’t create database ‘garage’. Database exists."
