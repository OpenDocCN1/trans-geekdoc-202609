  md: "# Deleting files\n\nThe PHP unlink() function permanently deletes the file\
    \ specified as its argument (if it is a valid file name).\n\nIn this example it\
    \ appears at the beginning of the code in a custom function that attempts to delete\
    \ a file and writes a message confirming if the attempt succeeded or failed. This\
    \ function is called twice later in the code to delete files.\n\n```\n<?php function\
    \ try_to_delete( $file ) {\n    if ( unlink( $file ) {\n        echo (\"$file<br>has\
    \ been deleted<hr>\"); \n    } else { echo (\"Unable to delete $file<hr>\"); };\n\
    }\n```\n\n```\n?\n<html><head><title>Deleting files</title></head> <body>\n<?php\n\
    $file_A = \"C:\\Documents and Settings\\\nAll Users\\Desktop\\errlog.bak\";\n\
    $file_B = \"C:\\Documents and Settings\\\nAll Users\\Desktop\\errlog.log\";\n\
    try_to_delete($file_A);\ntry_to_delete($file_B);\n?>\n</body></html>\n```\n\n\
    ![](img/7faa63a7fa0add8f53300594ebae949f_85_0.png)\n\nThe attempt to delete the\
    \ second file because the file does not exist. Warning can be suppressed by preceding\
    \ the function name with an @ character in the function call. In this example,\
    \ @try_to_delete($file_B); would suppress the warning.\n\n| Deleting files |\n\
    | File Edit View Favorites Tools Help |\n| Address http://localhost/deletefile.php\
    \ | |\n| C:\\Documents and Settings\\All Users\\Desktop\\errlog.bak\nhas been\
    \ deleted |\n\nUnable to delete C:\\Documents and Settings\\All Users\\Desktop\\\
    errlog.log\n\n![](img/7faa63a7fa0add8f53300594ebae949f_85_1.png)"
