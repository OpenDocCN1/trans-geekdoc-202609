    \ | Go |\n\nGood Evening. The time is 9:40\n\n| Done | Local intranet |\n\n6.\
    \ Generating dynamic content | 65\n\n## Random number generator\n\nThe PHP rand()\
    \ function is used to generate a random number. Optionally, a range of numbers\
    \ from which the random number should be chosen can be specified as arguments\
    \ to the rand() function starting minimum and maximum values of the range. For\
    \ instance, rand(1,10) would select a number between 1 and 10. When no range is\
    \ specified the random number will be between zero and the default maximum of\
    \ 32767.\n\nThe random number generator should be seeded to prevent a regular\
    \ pattern of numbers from being generated. This is achieved using the rand() function,\
    \ which takes the seed number as its argument. Commonly, the seed number is specified\
    \ as one million times the current time expressed to microsecond accuracy with\
    \ the PHP microtime() function.\n\nThis example uses the rand() function in the\
    \ common manner, then generates random numbers in the range of 1 to 100.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_67_0.png)\n\
    \n```html\n<html><head><title>Random Numbers</title></head>\n<body>\n<?php\n\n\
    rand(microtime() * 1000000);\n$num = rand(1, 100);\necho(\"Microtime:\" . microtime()\
    \ . \"<br>\");\necho(\"A random number:\" . $num . \"<br>\");\n$num = rand(1,\
    \ 100);\necho(\"Another random number:\" . $num);\n\n?>\n</body></html>\n```\n\
    \n![](img/7faa63a7fa0add8f53300594ebae949f_67_1.png)\n\n| Random Numbers | |\n\
    |---|\n| File Edit View Favorites Tools Help |\n| Address http://localhost/random.php\
    \ Go |\n| Microtime:0.36768200 1086778854 |\n| A random number:46 |\n| Another\
    \ random number:17 |\n\n## ...cont'd\n\nThe random number generator is useful\
    \ to generate different banners on web pages so that the content can change on\
    \ each visit. The example below generates a random number, then selects a banner\
