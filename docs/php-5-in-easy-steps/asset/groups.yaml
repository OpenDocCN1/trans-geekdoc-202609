    # Creating a MySQL user & password


    The MySQL connection test made at the beginning of this book, right after installation,
    assumed connection to MySQL as the root user without any password. This affords
    poor security, so in reality you should create a user with an associated password.


    Adding a user is best achieved by entering a "grant statement" into the MySQL
    monitor as the root user. Opening the MySQL monitor as normal will commonly identify
    you as the root user. To be sure, from the MySQL monitor type "exit" to close
    the monitor.


    mysql -u root


    Or, if a password has been set up for the root user, the line will be:


    mysql -u root -p password


    Now at the mysql> prompt type this MySQL grant statement:


    grant all privileges on ** to user-name@domain identified by "password" with grant
    option;


    This will create a new user with superuser status – allowing the named user full
    access from the specified domain, providing that they supply the specified password.


    The illustration shows a new user ("mike") being created in the localhost domain,
    with a simple password of "bingo" – these users details will feature in future
    code examples in this book.


    ![](img/7faa63a7fa0add8f53300594ebae949f_141_0.png)


    ```

    MySQL Monitor

    mysql> exit

    Bye

    C:\mysql\bin>mysql -u root ends with ; or \g.

    Welcome to the MySQL monitor. Commands with ; or Your MySQL connection id is 17
    to server version: 4.0.18-nt

    Type ''help''; or ''h'' for help. Type ''c'' to clear the buffer

    mysql> grant all privileges on .* to mike@localhost identified by "bingo" with
    grant option;

    Query OK, 0 rows affected (0.03 sec)

    mysql>

    ```'
  - '[PAGE 142]


    # Connecting a user to MySQL


    To connect to MySQL the PHP mysql_connect function requires three arguments specifying
    valid domain name, user name and password. This function returns true if the connection
    succeeds, or false if the attempt fails. The script below writes a confirmation
    if the connection is successful.


    ```

    <?php $user = "mike";

    $conn = mysql_connect("localhost", $user, "bingo");

    if($conn) {

    $msg="Congratulations $user, You connected to MySQL";

    ?>

    <html><head><title>Connecting user</title></head>

    <body><h3> <?php echo($msg); ?></h3></body></html>

    ```


    ![](img/7faa63a7fa0add8f53300594ebae949f_142_0.png)


    ![](img/7faa63a7fa0add8f53300594ebae949f_142_1.png)


    The user details are case-sensitive, so changing the value of the $user variable
    to “MIKE” means that the connection attempt will fail, with a PHP warning message
    written in the Apache error.log file located in Apache’s logs directory; it provides
    detailed information about the failure, and looks like this:


    ![](img/7faa63a7fa0add8f53300594ebae949f_142_2.png)'
  - "[PAGE 143]\n\n# Listing databases\n\nThe equivalent of the SQL \"show databases\"\
    \ command in PHP requires the use of three special functions.\n\nFirst, the mysql_list_dbs()\
    \ function returns a \"result set\" of information about all databases, which\
    \ can be assigned to a variable.\n\nThe details of each database are held in separate\
    \ rows within the result set, so the total number of databases can be determined\
    \ using the mysql_num_rows() function to discover how many rows are in the result\
    \ set. This function takes the result set as its argument.\n\nThe name of each\
    \ database can be extracted from a result set by the mysql_tablename() function.\
    \ This function is also used to extract the names of each table from a specified\
    \ database. A result set and row number are required arguments to get the database\
    \ names.\n\nThe example below assigns the result to a variable called $rs. This\
    \ is used as the argument to the mysql_num_rows() function to set the length of\
    \ the loop that lists each database name.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_143_0.png)\n\
    \n```\n<?php\n$conn = @mysql_connect(\"localhost\",\"mike\",\"bingo\");\nor die(\"\
