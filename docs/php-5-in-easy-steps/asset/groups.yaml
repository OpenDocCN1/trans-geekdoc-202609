    \ 格式的图像文件，但同样可以是文本文件或任何类型的文件。\n\n## 创建上传表单\n\n上传表单与之前示例使用的表单类似，但有两个重要的区别。首先，表单标签必须包含一个\
    \ `encrypt` 属性，并将其赋值为 `multipart/form-data`。其次，表单必须包含一个类型为 `file` 的输入框，这会在页面上放置一个文本字段和一个浏览按钮。\n\
    \n下面的 HTML 代码创建了一个具有所有功能和提交按钮的上传表单。\n\n![](img/7faa63a7fa0add8f53300594ebae949f_94_0.png)\n\
    \n```html\n<html><head><title>File Uploader</title></head>\n<body><<h3>File Uploader</h3>\n\
