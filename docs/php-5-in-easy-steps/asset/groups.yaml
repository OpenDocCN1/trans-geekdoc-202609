  - '[PAGE 99]


    # Introducing cookies


    Cookies are text files saved by websites on computers accessing them. Each cookie
    can contain around 4000 characters, up to 20 cookies can be stored for each website,
    and the client computer can store a maximum of 300 cookies in total. They are
    useful to retain user preferences, shopping cart selections, and snippets of data.


    Cookie files can be opened with any text editor, so sensitive information should
    be encrypted. For instance, rather than directly store a user''s password in a
    cookie, it is better to store a unique identification string that references a
    database entry containing the password on the server.


    When a user has logged onto a site their first name can be stored in a cookie
    so that each page they visit could greet them by name.


    ![](img/7faa63a7fa0add8f53300594ebae949f_99_0.png)


    When setcookie() returns true (1) it signifies that the function ran OK - it does
    not verify that the cookie was accepted.


    In PHP, cookies are created with the setcookie() function. This should be used
    to create a cookie at the very beginning of the PHP document – before any other
    code, tags or whitespace. The cookie does not become visible until the next page
    is loaded, but its creation can be verified by the value returned from setcookie().
    otherwise it returns false (0).


    ```

    <?php

    echo("Cookie created? : ");

    setcookie("cookie_name", "cookie_data" );

    ?>

    ```


    ```

    <html>

    <head><title>Cookie</title> </head>

    <body></body>

    </html>

    ```


