  - '[PAGE 25]


    # Variables


    A variable is a place in which to store data for manipulation within a PHP script.
    All variables begin with a "$" character, followed by a meaningful name of your
    choice. When naming variables, any letters, digits and the "_" underscore character
    may be used, the variable name may not begin with a digit. These are all valid
    variable names:


    ```

    $abc


    $my_first_variable


    $var123

    ```


    Data is assigned to a variable using the "=" operator. The assignment statement,
    like all PHP statements, should end with a semi-colon terminator.


    The example below recreates the text example from page 22. In this case though,
    the entire text content is assigned to a variable $str. This makes the script
    more efficient because the whole text content is now written into the text area
    with just a single call to the echo() function, rather than the five calls used
    previously.


    ![](img/7faa63a7fa0add8f53300594ebae949f_25_0.png)


    ![](img/7faa63a7fa0add8f53300594ebae949f_25_1.png)


    Note that the $str variable is not surrounded by quotes in the call to the echo()
    function it is not to be treated literally.


    Opening this example in a web browser, via Apache, produces precisely the same
    generated page as that of the previous example shown at the bottom of page 22.'
  - '[PAGE 26]


    # Data types


    PHP is a Losely typed language, so its variables can store different types of
    data, such as numbers, text strings or boolean values. This is unlike programming
    languages, such as C++ and Java, that must declare a variable to be of a specific
    data type and may then store only data of the declared type inside it.


    Data types that can be stored in PHP variables include:


    +   - String – strings of spaces, text and numeric characters specified within
    double quotes ("...") or single quotes (''...'')

    - Integer – numbers without decimal places, such as 1,000

    - Floating-point – numbers with decimal places, like as 3.142

    - Boolean – a truth value expressed with the case-insensitive PHP keywords of
    TRUE or FALSE.


    When assigning numeric values to a variable that should not be enclosed in quotes
    else they will be treated as string values.


    ![](img/7faa63a7fa0add8f53300594ebae949f_26_0.png)


    Additionally a variable can be set to have no value at all by assigning it the
    case-insensitive PHP keyword of NULL.


    ```

    <?php

    $str = "Here is a string";

    $int = 77; $fl = 3.142; $non = NULL;

    echo ("String:$str<br> ");

    echo ("Integer:$int<br> ");

    echo ("Floating-point:$fl<br> ");

    echo ("Null:$non ");

    ?>

    ```


    ![](img/7faa63a7fa0add8f53300594ebae949f_26_1.png)


