    # Creating a guestbook database table


    A guestbook application first requires a database table to store the messages
    that visitors will leave. This can be created directly in the MySQL monitor, or
    with a PHP script.


    The following script uses the existing database "my_database". There creates a
    table called "guestbook" with fields for "id", "name", "email address", "comments"
    and an automatic timestamp entry of the date and time that the message was recorded.


    This script needs to run just once to build the guestbook.


