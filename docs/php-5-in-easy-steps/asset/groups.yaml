    # Cookies 还是 sessions？


    Cookies 是 PHP 维护数据的最佳方法，使用 `set_cookie()` 函数存储数据极其简单。与 sessions 相比，Cookies 也许更易用。


    遗憾的是，Cookies 需要用户的浏览器配合，允许在客户端系统上存储 Cookie。随着人们对计算机病毒的恐惧日益增加，对隐私和安全的关注日益提高，比以往任何时候都多的用户不愿在他们的系统中允许
    Cookie。这阻止了你使用 Cookie 为 PHP 进程存储数据。


    一些新出的可以访问互联网的移动设备可能甚至没有存储 Cookie。


    另一方面，将数据存储在会变量中并不依赖于用户的浏览器设置，因此比使用 Cookie 可靠得多。你只需要记住在超链接的每个 URL 后面追加 SID 会话标识符，并在每个页面的开始调用
    `session_start()` 函数。


    更改 PHP 配置甚至可以消除在每个页面手动调用 `session_start()` 的需要。在 `phpinfo.php` 页面的 session 块中有一个名为
    "session.auto_start" 的指令，默认情况下安装时被设置为关闭。


    用文本编辑器打开 `php.ini` 文件并找到 `session.auto_start` 条目。将它的值从 0 改为 1 以开启此功能。现在，每当页面加载时，PHP
    都会自动执行 `session_start()` 函数的任务。


    当 `session.auto_start` 设置为开启时，上示例中的三次 `session_start()` 函数调用都可以删除——当用户在页面之间导航时，偏好数据仍然会保持。


    总的来说，使用 sessions 而不是 cookies 可能更好，特别是存储关键数据时，例如电子商务网站上选中的购物车物品。


    Sessions 确保存储的数据在整个网站中可用，即使在未启用 Cookie 的浏览器中，但这将消耗更多资源来存储数据。


    ![](img/7faa63a7fa0add8f53300594ebae949f_113_0.png)


