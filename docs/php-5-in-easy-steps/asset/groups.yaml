    # PHP in this book


    This book is an introduction to the PHP 5 server-side language using examples
    to demonstrate many different features.


    PHP can be used to create interactive dynamic websites and is rapidly gaining
    in popularity because it is a flexible, cross-platform technology amazingly powerful.


    You may have visited some impressive websites where the URL address ends with
    a file extension of “.php” or “.shtml”. These are dynamic web pages served up
    to the web browser of the PHP scripting language on the server.


    ![](img/7faa63a7fa0add8f53300594ebae949f_9_0.png)


    The examples given throughout this book detail PHP source code and the resultant
    output that appears in the web browser.


    # What you need to know


