    \ for specific nodes matching particular criteria. This is far more powerful than\
    \ the getElementsByTagName() method, which simply returns a DomNodeList of all\
    \ elements having the specified name. For instance, the XML document food.xml\
    \ (listed below), a call to getElementsByTagName(\"item\") would return all the\
    \ \"item\" child elements of \"fruit\" and \"veg\" elements.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_183_0.png)\n\
    \n```\n<?xml version = \"1.0\" encoding = \"iso-8859-1\" ?>\n<fruit>\n  <item\
    \ id=\"1\">Apple</item>\n  <item id=\"2\">Banana</item>\n  <item id=\"3\">Cherry</item>\n\
    </fruit>\n<veg>\n  <item>Lettuce</item>\n  <item>Onion</item>\n</veg>\n<food>\n\
    ```\n\nXPath, however, can return specific elements.\n\nTo start using XPath in\
    \ PHP 5, a DomXPath object must first be created using the \"new\" keyword and\
