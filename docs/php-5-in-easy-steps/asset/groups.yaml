    \ of the default index numbering of 0-4. Each element is written out on the page\
    \ by a loop that can now conveniently refer to each element correctly by its index\
    \ position.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_60_0.png)\n\n```html\n\
    <html><head><title>One-based array index</title></head>\n<body><ol>\n<?php\n$arr\
    \ = array(1 => \"1st\", \"2nd\", \"3rd\", \"4th\", \"5th\" );\n\nfor($si = 1;\
    \ $si <= sizeof($arr); $si++) {\necho \"Position $si - Element value: $arr[$si]<br>\"\
    );\n}\n?>\n</ol></</body>></html>\n```\n\n![](img/7faa63a7fa0add8f53300594ebae949f_60_1.png)\n\
    \n# Manipulating arrays\n\nPHP arrays can be easily manipulated by the many special\
    \ array functions. The array_merge() function allows two arrays to be merged.\
    \ This requires the two array names as its arguments, and adds the elements of\
    \ the second array after those of the first array. A specified range of an array's\
    \ elements can be selected with the array_slice() function, which takes the array\
    \ name and the start and end positions of the required elements. Array elements\
    \ can be randomly rearranged with the PHP shuffle() function. The example below\
    \ demonstrates each of these functions in action.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_61_0.png)\n\
    \n```html\n<html><head><title>Manipulating arrays</title></head>\n<body><ol>\n\
    \  <?php $arr1 = array(\"Alpha\", \"Bravo\", \"Charlie\");\n  $arr2 = array(\"\
    Delta\", \"Echo\", \"Foxtrot\");\n\n  $arr = array_merge($arr1, $arr2);\n  foreach\
    \ ($arr as $value) { echo(\"$value \"); }\n  echo(\"<hr>\");\n\n  $arr = array_slice($arr,\
    \ 1, 4 );\n  foreach ($arr as $value) { echo(\"$value \"); }\n  echo(\"<hr>\"\
    );\n\n  $rand( (float)microtime() * 1000000 ); shuffle($arr);\n  foreach ($arr\
    \ as $value) { echo(\"$value \"); }\n?>\n</ol></</body>></html>\n```\n\nA seed\
    \ is first provided for the shuffle() function by rand(). For more details refer\
    \ to the random number example on page 66.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_61_1.png)\n\
    \n| Manipulating arrays | |\n|---|---|\n| File Edit View Favorites Tools Help\
    \ | |\n| Address http://localhost/slicearray.php | Go |\n| Alpha Bravo Charlie\
    \ Delta Echo Foxtrot | |\n| Bravo Charlie Echo | |\n| Bravo Charlie Delta | |\n\
    \n# Generating dynamic content\n\nThis chapter demonstrates how PHP can provide\
    \ dynamic content according to browser type, date and time, randomly generated\
    \ numbers or user input. It also illustrates string manipulation and how the client\
    \ browser can be redirected.\n\n# Covers\n- Identifying browser & platform | 62\n\
    - Server date & time | 64\n- Time-specific content | 65\n- Random number generator\
    \ | 66\n- Getting form values | 68\n- Displaying submitted values | 70\n- Manipulating\
    \ submitted values | 72\n- Reloading a page | 74\n- Browser redirection | 76\n\
    - PHP and mobile devices | 78\n\n![](img/7faa63a7fa0add8f53300594ebae949f_62_0.png)\n\
    \n# Identifying browser & platform\n\nPHP creates some useful variables, which\
    \ can be seen on the phpinfo.php page that was used to setup the environment at\
    \ the beginning of this book; these include environment variable called HTTP_AGENT,\
    \ which identifies the user's browser and operating system.\n\nThe script below\
    \ uses the getenv() function to assign a value to this environment and then writes\
    \ it out to the page. The illustrations depict the script output in Internet Explorer\
    \ on Windows and in the Mozilla browser on Linux:\n\n```html\n<html><head><title>Get\
    \ browser & platform</title></head><body><?php $viewer = getenv(\"HTTP_AGENT\"\
    ); echo(\"Browser details:$viewer\");</body></html>\n```\n\n![](img/7faa63a7fa0add8f53300594ebae949f_63_0.png)\n\
    \nThe details in Windows identify Internet Explorer 6.0 as Mozilla-compatible\
    \ web running on Windows XP (shown as NT). In Linux the genuine Mozilla browser\
    \ is correctly identified.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_63_1.png)\n\
    \n![](img/7faa63a7fa0add8f53300594ebae949f_63_2.png)\n\nPHP 5 in easy steps\n\n\
    # ...cont'\n\nThe information contained in the HTTP_AGENT environment variable\
    \ can be used to create dynamic content appropriate to the browser by using the\
    \ preg_match() function. This seeks to match a specified string pattern, and has\
    \ this syntax:\n\n```\npreg_match(\"/string-to-seek\", \"string-to-search\");\n\
    ```\n\nThe following example tries to identify both browser and platform. Default\
    \ strings are provided for no match is found. The appropriate string is then written\
    \ out on the page.\n\n```html\n<html><head><title>Browser content</title></head>\n\
    <body>\n  <?php $viewer = getenv(\"HTTP_AGENT\");\n  $browser = \"an unidentified\
    \ browser\";\n  if (preg_match(\"/MSIE/i\", \"$viewer\")) {\n    $browser = \"\
    Internet Explorer\";\n  } else if (preg_match(\"/Netscape/i\", \"$viewer\")) {\n\
    \    $browser = \"Netscape\";\n  } else if (preg_match(\"/Opera/i\", \"$viewer\"\
    )) {\n    $browser = \"Opera\";\n  }\n  $platform = \"an unidentified operating\
    \ system\";\n  if (preg_match(\"/Windows/i\", \"$viewer\")) {\n    $platform =\
    \ \"Windows\";\n  } else if (preg_match(\"/Linux/i\", \"$viewer\")) {\n    $platform\
    \ = \"Linux\";\n  }\n  echo(\"You're using $browser on $platform\");\n</body></html>\n\
    ```\n\n![](img/7faa63a7fa0add8f53300594ebae949f_64_0.png)\n\nThe i-switch is included\
    \ in the preg_match() first argument to ensure a case-insensitive search.\n\n\
    ![](img/7faa63a7fa0add8f53300594ebae949f_64_1.png)\n\n![](img/7faa63a7fa0add8f53300594ebae949f_64_2.png)\n\
    \n6. Generating dynamic content\n\n# Server date & time\n\nThe PHP date() function\
    \ returns the current date and time on the server, formatted according to parameters\
    \ specified as its arguments. The parameters are indicated by characters listed\
    \ in the table below and examples are shown at the bottom of this page:\n\n| Character\
    \ | Meaning |\n|---|---|\n| a / A | Prints \"am\" or \"pm\" / \"AM\" or \"PM\"\
    \ |\n| g / h | Hour in 12-hour format (1-12) / (01-12) |\n| G / H | Hour in 24-hour\
    \ format (0-23) / (00-23) |\n| i | Minutes (00-59) |\n| s | Seconds (00-59) |\n\
    | Z | Time zone offset in seconds (-43200 to 43200) |\n| U | Seconds since January\
    \ 1, 1970 00:00:00 GMT |\n| j / d | Day of the month (1-31) / (01-31) |\n| D /\
    \ l | Day of the week (Mon-Sun) / (Monday-Sunday) |\n| w | Day of the week (0-6)\
    \ from Sunday to Saturday |\n| M / F | Month (Jan-Dec) / (January-December) |\n\
    | n / m | Month (1-12) / (01-12) |\n| y / Y | Year (05) / (2005) |\n| z | Day\
    \ of the year (0-365) |\n| t | Number of days in a given month (28-31) |\n| S\
    \ | English ordinal suffix (\"th\", \"nd\", \"st\") |\n\n```\n$today = date(\"\
    M j, Y\"); # Dec 10, 2005\n$today = date(\"m.d.y\"); # 12.10.05\n$time = date(\"\
    g:i a\"); # 5.25 pm\n$time = date(\"H:i:s\"); // 05:25:30\n```\n"
  mdcn: "\n\n# 数组的键和值\n\nPHP 数组元素不是包含单个数据值，而是每个元素可以包含一个键值对，其中键可以在脚本中用于引用其关联的值。\n\n\
