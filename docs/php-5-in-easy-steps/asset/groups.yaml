    $first = array_shift($arr);\n\n#remove element at end of the array\n$last = array_pop($arr);\n\
    \n#sort elements alphabetically\nsort($arr);\n\n#write out values\nforeach($arr\
    \ as $value){ echo(\"$value, \" \"); }\necho(\"<br>Removed first element: \\$first\"\
