    # Server date & time


    The PHP date() function returns the current date and time on the server, formatted
    according to parameters specified as its arguments. The parameters are indicated
    by characters listed in the table below and examples are shown at the bottom of
    this page:


    | Character | Meaning |

    |---|---|

    | a / A | Prints "am" or "pm" / "AM" or "PM" |

    | g / h | Hour in 12-hour format (1-12) / (01-12) |

    | G / H | Hour in 24-hour format (0-23) / (00-23) |

    | i | Minutes (00-59) |

    | s | Seconds (00-59) |

    | Z | Time zone offset in seconds (-43200 to 43200) |

    | U | Seconds since January 1, 1970 00:00:00 GMT |

    | j / d | Day of the month (1-31) / (01-31) |

    | D / l | Day of the week (Mon-Sun) / (Monday-Sunday) |

    | w | Day of the week (0-6) from Sunday to Saturday |

    | M / F | Month (Jan-Dec) / (January-December) |

    | n / m | Month (1-12) / (01-12) |

    | y / Y | Year (05) / (2005) |

    | z | Day of the year (0-365) |

    | t | Number of days in a given month (28-31) |

    | S | English ordinal suffix ("th", "nd", "st") |


    ```

    $today = date("M j, Y"); # Dec 10, 2005

    $today = date("m.d.y"); # 12.10.05

    $time = date("g:i a"); # 5.25 pm

    $time = date("H:i:s"); # 05:25:30

    ```


