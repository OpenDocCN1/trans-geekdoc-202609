  - "[PAGE 83]\n\n# Copying & renaming files\n\nFiles on your system can be copied\
    \ to any location using PHP's copy() function. This requires two arguments: the\
    \ full path of the source file to be copied, and the full path of the desired\
    \ location where the copy is to be placed.\n\nWhen the copy() function succeeds\
    \ in copying the file it returns a true value, otherwise it returns a value of\
    \ false.\n\nThe example below attempts to copy the error log from Apache's logs\
    \ directory, then prints a message describing whether it succeeded or failed.\n\
    \n![](img/7faa63a7fa0add8f53300594ebae949f_83_0.png)\n\nIf the named destination\
    \ file already exists it will be overwritten by the copy()\n\nfunction.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_83_1.png)\n\
    \ncopyfile.php\n\n```\n# php for Windows ...\n$source = \"C:\\\\Apache\\logs\\\
    error.log\";\n$dest = \"C:\\\\Documents and Settings\\\\All Users\\\\Desktop\\\
    \\error.bak\"\n\n# for Linux ...\n$source = \"/usr/local/apache/logs/error_log\"\
    ;\n$dest = \"/home/mike/desktop/error_bak\";\n\nif ( copy($source, $dest) )\n\
    \    $msg = \"Copied $source<br>to $dest\";\nelse\n    $msg = \"Unable to copy\
    \ $source\";\n\n<html><head><title>Copying files</title></head>\n<body>\n    <?php\
    \ echo ($msg); ?>\n</body>\n</html>\n```\n\n![](img/7faa63a7fa0add8f53300594ebae949f_83_2.png)\n\
    \nIn Linux ensure that you have permission to write to the target directory.\n\
    \n| Copying files |\n| File Edit View Favorites Tools Help |\n| Address | http://localhost/copyfile.php\
    \ | Go |\n\nCopied C:\\\\Apache\\logs\\error.log\nto C:\\\\Documents and Settings\\\
    \\All Users\\\\Desktop\\\\error.bak\n\n![](img/7faa63a7fa0add8f53300594ebae949f_83_3.png)\n\
    \nPHP 5 in easy steps"
  - "[PAGE 84]\n\nFiles on your system can be renamed using PHP's rename()\nfunction.\
    \ This function requires two arguments: the original name of the file, and the\
    \ new name to which it will be changed. When the rename() function succeeds in\
    \ renaming the file it returns a true value, otherwise it returns a value of false.\n\
    \nThe example below attempts to rename the copy of Apache's error log file that\
    \ was created in the example on the opposite page. Upon completion, the script\
    \ displays an appropriate message describing its success or failure.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_84_0.png)\n\
    \n```\n<?php # for Windows ...\n$oldname = \"C:\\Documents and Settings\\\\nAll\
    \ Users\\\\Desktop\\error.bak\";\n$newname = \"C:\\Documents and Settings\\\\\
    nAll Users\\\\Desktop\\errlog.bak\";\n\n# for Linux ...\n$oldname = \"/home/mike/desktop/error_bak\"\
    ;\n$newname = \"/home/mike/desktop/errlog_bak\";\n\nif (rename($oldname, $newname))\
    \ {\n    $msg = \"Renamed $oldname<br>as $newname\";\n} else {\n    $msg = \"\
    Unable to rename $oldname\";\n}\n\n<html><head><title>Renaming files</title></head>\n\
    <body>\n<?php echo ($msg); ?>\n</body></html>\n```\n\nrenamefile.php\n\nThe rename()\n\
    changes the name of an existing file, whereas the copy() function creates a new\
    \ file with the chosen name.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_84_1.png)\n\
    \n# Renaming files\n\n| File | Edit | View | Favorites | Tools | Help |\n|---|---|---|---|---|---||\n\
    | Address | http://localhost/renamefile.php | | | Go |\n| Renamed C:\\Documents\
    \ and Settings\\All Users\\Desktop\\error.bak as C:\\Documents and Settings\\\
    All Users\\Desktop\\errlog bak | |\n\nLocal intranet\n\n7. File handling with\
    \ PHP 83"
  - "[PAGE 85]\n\n# Deleting files\n\nThe PHP unlink() function permanently deletes\
    \ the file specified as its argument (if it is a valid file name).\n\nIn this\
    \ example it appears at the beginning of the code in a custom function that attempts\
    \ to delete a file and writes a message confirming if the attempt succeeded or\
    \ failed. This function is called twice later in the code to delete files.\n\n\
    ```\n<?php function try_to_delete( $file ) {\n    if ( unlink( $file ) {\n   \
    \     echo (\"$file<br>has been deleted<hr>\"); \n    } else { echo (\"Unable\
    \ to delete $file<hr>\"); };\n}\n```\n\n```\n?\n<html><head><title>Deleting files</title></head>\
    \ <body>\n<?php\n$file_A = \"C:\\Documents and Settings\\\nAll Users\\Desktop\\\
    errlog.bak\";\n$file_B = \"C:\\Documents and Settings\\\nAll Users\\Desktop\\\
    errlog.log\";\ntry_to_delete($file_A);\ntry_to_delete($file_B);\n?>\n</body></html>\n\
    ```\n\n![](img/7faa63a7fa0add8f53300594ebae949f_85_0.png)\n\nThe attempt to delete\
    \ the second file because the file does not exist. Warning can be suppressed by\
    \ preceding the function name with an @ character in the function call. In this\
    \ example, @try_to_delete($file_B); would suppress the warning.\n\n| Deleting\
    \ files |\n| File Edit View Favorites Tools Help |\n| Address http://localhost/deletefile.php\
    \ | |\n| C:\\Documents and Settings\\All Users\\Desktop\\errlog.bak\nhas been\
    \ deleted |\n\nUnable to delete C:\\Documents and Settings\\All Users\\Desktop\\\
    errlog.log\n\n![](img/7faa63a7fa0add8f53300594ebae949f_85_1.png)"
