  mdcn: "\n\n# ...接续\n\n![](img/7faa63a7fa0add8f53300594ebae949f_120_0.png)\n\nHTML\
    \ 格式标签现在可以包含在用户的输入中，并应用于接收到的消息上。当提交此表单时，用户的评论将以如下所示的形式接收：\n\n注意，这封邮件似乎是从用户自己的邮箱地址发送的，并添加了抄送（Cc）。“From:”头部替换了\
    \ `send_from` 指令的值。现在点击回复按钮将打开一个空白的邮件表单，并将用户自己的地址设置为收件人。\n\n![](img/7faa63a7fa0add8f53300594ebae949f_120_1.png)\n\
    \n9. 使用 PHP 发送邮件 | 119\n\n# 创建附件表单\n\n要向邮件消息中发送附件，必须在 HTML `<form>` 元素中添加 `enctype`\
    \ 属性，并将其赋值为 `\"multipart/form-data\"`。\n\n此示例在之前的反馈表单的基础上，增加了主题和文件附件的输入字段。用户可以点击“浏览”按钮打开对话框，允许他们选择要附加到消息的文件。在提交时，名为\
    \ \"to\"、\"from\"、\"re\"、\"comments\" 和 \"att\" 的字段中的值将发送到表单处理器 `sendmixed.php`（该文件位于第\
    \ 122 页）。\n\n![](img/7faa63a7fa0add8f53300594ebae949f_121_0.png)\n\n此示例将输入放在表格单元格内以便更好的显示效果。\n\
    \n```html\n<<html>><head><title>附件表单</title></head>\n<body>\n<form action=\"sendmixed.php\"\
    \ method=\"post\"\nenctype=\"multipart/form-data\">\n<table>\n<tr><td>收件人:</td></tr>\n\
    <tr><td><input type=\"text\" name=\"to\" size=\"40\"></td></tr>\n<tr><td>发件人:</td></tr>\n\
    <tr><td><input type=\"text\" name=\"from\" size=\"40\"></td></tr>\n<tr><td>主题:</td></tr>\n\
    <tr><td><input type=\"text\" name=\"re\" size=\"40\"></td></tr>\n<tr><td>消息:</td></tr>\n\
    <td>\n<textarea cols=\"30\" rows=\"5\" name=\"comments\"></textarea>\n</td></tr>\n\
    <tr><td>附件:</td></tr>\n<tr><td><input type=\"file\" name=\"att\" size=\"26\"></td></tr>\n\
    <tr><td colspan=\"2\">\n<input type=\"submit\" value=\"提交表单\">\n</td>\n</tr>\n\
    </table>\n</form>\n</body></html>\n```\n\n![](img/7faa63a7fa0add8f53300594ebae949f_121_1.png)\n\
    \n# ...接续\n\n![](img/7faa63a7fa0add8f53300594ebae949f_122_0.png)\n\n![](img/7faa63a7fa0add8f53300594ebae949f_122_1.png)\n\
    \n9. 使用 PHP 发送邮件 | 121\n\n# 通过邮件发送附件\n\n要发送包含混合内容的邮件，需要对邮件格式有更深入的理解。首先必须声明一个主\
    \ `Content-Type:` 头部将内容为“multipart/mixed”。然后可以在定义的边界（boundaries）内指定文本和附件部分。每个边界都以两个连字符开头，后跟一个唯一的数字，该数字不能出现在邮件的消息部分中。\n\
    \n通常使用 PHP 的 `md5()` 函数来创建一个 32 位的十六进制数字用于边界。`time()` 函数可以作为其参数指定![](img/7faa63a7fa0add8f53300594ebae949f_123_0.png)\n\
    \n附件文件应使用 `base64_encode()` 函数进行编码以确保传输安全，并使用 `chunk_split()` 函数进行拆分。该函数会在文件中每隔添加\
    \ `\\r\\n`，通常是每 76 个字符。\n\n以下代码列出了第 120 页创建的附件表单的处理器：\n\n```php\n$to = $_POST['to'];\
    \ $from = $_POST['from'];\n$re = $_POST['re']; $comments = $_POST['comments'];\n\
    \n$att = $_FILES['att'];\n$att_path = $_FILES['att']['tmp_name'];\n$att_name =\
    \ $_FILES['att']['name'];\n$att_size = $_FILES['att']['size'];\n$att_type = $_FILES['att']['type'];\n\
    ```\n\n![](img/7faa63a7fa0add8f53300594ebae949f_123_1.png)mixed.php\n\n边界数字被赋值给\
    \ `Content-Type:` 头部中的 `boundary` 属性。\n\n```php\n# 打开、读取、关闭文件\n$fp = fopen($att_path,\
    \ \"rb\");\n$file = fread($fp, $att_size);\nfclose($fp);\n```\n\n![](img/7faa63a7fa0add8f53300594ebae949f_123_2.png)\n\
    \n```php\n# 创建边界字符串\n$num = md5(time());\n$str = \"Multipart_Boundary=$num\";\n\
    \n# 对数据进行安全传输\n$file = chunk_split(base64_encode($file));\n```\n\n```php\n# 定义头部\n\
    $hdr = \"MIME-Version: 1.0\\r\\n\";\n$hdr .= \"Content-Type: multipart/mixed;\
    \ boundary=$str\\r\\n\";\n$hdr .= \"From: $from\\r\\n\";\n```\n\n```php\n# 定义消息\n\
    $msg = \"This is a multi-part message in MIME format\\r\\n\";\n$msg .= \"--$str\\\
    r\\n\";\n$msg .= \"Content-Type: text/plain; charset=iso-8859-1\\r\\n\";\n$msg\
    \ .= \"Content-Transfer-Encoding: 8bit\\r\\n\";\n$msg .= \"$comments\\r\\n\";\n\
    $msg .= \"--$str\\r\\n\";\n\n# 定义非附件\n$msg .= \"Content-Type: $att_type\\r\\n\"\
    ;\n$msg .= \"name=$att_name\\r\\n\";\n$msg .= \"Content-Disposition: attachment;\
    \ filename=$att_name\\r\\n\";\n$msg .= \"Content-Transfer-Encoding: base64\\r\\\
    n\";\n$msg .= \"$file\\r\\n\";\n$msg .= \"--$str\\r\\n\";\n\n# 发送邮件\n$ok = mail($to,\
    \ $re, $msg, $hdr);\nif ($ok) echo \"OK\";\n?>\n```\n\n![](img/7faa63a7fa0add8f53300594ebae949f_124_0.png)\n\
    \n文本的 `Content-Transfer-Encoding` 头部为 \"bit\"，这是其自然状态。附件已使用 `base64_encode()`\
    \ 进行编码，因此描述为 \"base64\"。这里描述的 `Content-Disposition` 头部也可以改为 \"inline\"，将附件包含在邮件正文中。\n\
    \n![](img/7faa63a7fa0add8f53300594ebae949f_124_1.png)\n\n| 发件人 | bob@some-mail-server.com\
