    # Escaping characters


    The "\slash character can be used to apply special significance to the character
    that immediately follows. It is especially useful to include quotation marks within
    a string of text to be written with the echo() function. As the string is itself
    enclosed by quotes, the php parser would be confused by additional quotes and
    deliver an error message. This is avoided by preceding the additional quotes by
    a backslash character to escape.


    Additionally the newline syntax "\n" can be used to move to a new line in text
    areas and "\t" to cross a text area.


    The following example creates a HTML text area content that includes an escaped
    quotation and demonstrates the newline and tab features. The quotes containing
    the HTML attribute values for rows and columns (cols) are also escaped.


    ![](img/7faa63a7fa0add8f53300594ebae949f_23_0.png)


    ```

    ```html

    <?php

    echo("<textarea rows=\"5" cols=\"48\>");

    echo(\"Utinam populus Romanus unam cervicem habet\\");

    echo("\n\n\t\t Caligula A.D. 12-41");

    echo("</textarea>");

    ?>

    ```

    ```


    ![](img/7faa63a7fa0add8f53300594ebae949f_23_1.png)'
