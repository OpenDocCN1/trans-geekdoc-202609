  - "[PAGE 153]\n\n# Retrieving data from a table\n\nData can be retrieved from a\
    \ MySQL database using the SQL command \"select field-names from table-name\"\
    \ to specify the fields required and the name of the table to search.\n\nThe PHP\
    \ mysql_fetch_array() function returns an associative array of all the requested\
    \ data from the table, row by row. This function requires the query result set\
    \ as its argument. Each piece of data in the array is associated to the column\
    \ name. The data is assigned to an array variable using a while loop so that the\
    \ data for each row can be retrieved using its associated column name on iteration.\n\
    \nThe following example retrieves the data from two columns of the my_table_table,\
    \ shown on page 150. Each iteration of the loop assigns a row's data to an array\
    \ called \"Row\", then the value associated with the column first_name for each\
    \ row is written out.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_153_0.png)\n\
    \n```\n<html><head><title>Get data</title></n<body>\n<?php\n#connect to MySQL\n\
    $conn = @mysql_connect(\"localhost\", \"mike\", \"bingo\") \nor die(\"Err:Conn\"\
    );\n\n#select the specified database\n$rs = @mysql_select_db(\"my_database\",\
    \ $conn) \nor die(\"Err:Db\");\n\n#create the query\n$sql=\"select id, first_name\
    \ from my_table\";\n\n#execute the query\n$rs = mysql_query($sql,$conn);\n\n#write\
    \ the data\nwhile ($row = mysql_fetch_array($rs)) {\n\techo(\"ID: \" \" . $row[\"\
    id\"]\");\n\techo(\" FIRST NAME: \" . $row[\"first_name\"] . \"<br>;\");\n}\n\
    ?>\n</body></html>\n```"
