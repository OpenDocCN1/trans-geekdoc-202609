  - '[PAGE 105]


    # Introducing sessions


    An alternative way to make data accessible across the various pages

    of an entire website is to use a PHP "session".


    A session creates a file in a temporary directory on the server where registered
    session variables, and their values, can be stored. This data will be available
    to all pages on the site during that visit.


    The location of the temporary file is determined by a setting in the php.ini file,
    session.save_path. Its current value is shown in the session block of the phpinfo.php
    page and will probably be set to C:\Windows\temp or /tmp on Linux systems. The
    php.ini file can be edited to use a different location if preferred.


    When a session is started, a number of things happen:


    +   - PHP first creates a unique identifier for that particular session, which
    is typically a random string of 32 hexadecimal numbers, such as 8b9c621bc3728ce1165d2fb87ca44f5d

    - A cookie called PHPSESSID is automatically sent to the user''s computer to store
    the unique session identification

    - A file is automatically created on the server, in the designated temporary directory,
    and bears the name of the unique identifier prefixed by "sess_8b9c621bc3728ce1165d2fb87ca44f5d".


    ![](img/7faa63a7fa0add8f53300594ebae949f_105_0.png)


    When the browser closes, or when the session is terminated, the PHPSESSID cookie
    is automatically deleted.


    Now that the session is established, data can be stored in session variables,
    recorded in the sess_file on the server.


    When a script writes to retrieve the value from a session variable, PHP automatically
    generates the unique identifier string from the PHPSESSID cookie, then looks in
    its temporary directory for the file bearing that name. Once this is located,
    the file is opened and the value is recovered.


    As this process relies only upon the cookie on the user''s computer and the file
    in the server''s temporary directory, the session variables are available to each
    page of the entire site. The session ends when the user closes their browser or
    does not load a new page for a predetermined period of time, commonly 30 minutes.'
