    \n```php\n<?php\n// connect to MySQL\n$conn = mysql_connect(\"localhost\", \"\
    mike\", \"bingo\") or die(\"Err:Conn\");\n// select the specified database\n$rs\
    \ = mysql_select_db(\"my_database\", $conn) or die(\"Err:Db\");\n\n// execute\
    \ the 1st query\n// reduce field to 3 number length\n$query = \"alter table my_table\
    \ modify id int(3)\";\n$rs = mysql_query($query, $conn) or die(\"Err:Query 1\"\
    );\n\n// execute the 2nd query\n// extend field to 32 character length\n$query\
    \ = \"alter table my_table modify last_name char(32)\";\n$rs = mysql_query($query,\
    \ $conn) or die(\"Err:Query 2\");\n?>\n```\n\n![](img/7faa63a7fa0add8f53300594ebae949f_152_1.png)\n\
    \nalter 语句必须包含列的数据类型，否则将不会被修改。\n\n![](img/7faa63a7fa0add8f53300594ebae949f_152_2.png)\n\
    \n在 MySQL 监器中检查新的表格式，以确认修改已应用。\n\n| Field | Type | Null | Key | Default | Extra\
    \ |\n|---|---|---|---|---|---|\n| id | int(3) | YES | | NULL | |\n| first_name\
    \ | char(16) | YES | | NULL | |\n| last_name | char(32) | YES | | NULL | |\n\n\
    ```\nmysql> use my_database:\nDatabase changed\nmysql> explain my_table:\n+--------------------------------------+\n\
    | Field | Type | Null | Key | Default | Extra |\n+--------------------------------------+\n\
    | id | int(3) | YES | | NULL | |\n| first_name | char(16) | YES | | NULL | |\n\
    | last_name | char(32) | YES | | NULL | |\n+--------------------------------------+\n\
    3 rows in (0.01 sec)\nmysql>\n```\n\n## 从表中检索数据\n\n可以使用 SQL 命令 \"select field-names\
    \ from table-name\" 从 MySQL 数据库中检索数据，以指定所需的字段和要搜索的表名。\n\nPHP 的 `mysql_fetch_array()`\
    \ 函数逐行返回从表中获取的所有请求数据的关联数组。该函数需要查询结果集作为其参数。数组中的每条数据都与列名关联。使用 `while` 循环将数据分配给数组变量，以便在每次迭代时其关联的列名检索每行的数据。\n\
