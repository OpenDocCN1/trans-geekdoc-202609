  - "[PAGE 70]\n\n# # Displaying submitted values\n\nWhen HTML form data is submitted\
    \ with the \"post\" method, PHP adds each submitted key-value pair to its special\
    \ $_POST[] array. Any submitted value can be referenced by adding its key (input\
    \ name) within the square brackets. For instance, the color value in this example\
    \ can be referenced by $_POST['color'].\n\nSurround the keys with single quotes\
    \ to differentiate them from text strings, which are double quotes.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_70_0.png)\n\
    \nThe PHP script below begins by assigning each submitted value to a variable,\
    \ named as it key. The script checks for null values, to ensure input, then uses\
    \ the values in generated output.\n\n```\n<<head><title>Your submission</title></head>\n\
    <body><img src=\"foodn.jpg\" width=\"368\" height=\"54\">\n<?php\n$username =\
    \ $_POST['username']; //assign value\n$color = $_POST['color']; //assign value\n\
