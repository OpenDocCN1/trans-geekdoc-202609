  - "[PAGE 69]\n\n# Getting form values\n\nPHP is really good at handling data submitted\
    \ to the server in HTML forms. Each type of HTML form input field sends the data\
    \ as key-value pairs where the input name is the key, and the input field content\
    \ is the value.\n\nThe simple HTML form shown below contains two text input fields\
    \ called \"username\" and \"dish\", together with a set of radio buttons called\
