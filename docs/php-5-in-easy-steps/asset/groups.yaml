    # 用于 MySQL 的 PHP 函数


    下表描述了用于操作 MySQL 数据库的特殊 PHP 函数。这些函数将出现在书中的实际演示中。


    | mysql_connect(server-name, user-name, password); | 尝试打开到 MySQL 服务器的连接。成功返回链接标识符，失败返回
    false。 |

    | mysql_create_db(database-name, link-identifier); | 尝试在与指定 link-identifier 关联的服务器上创建一个新数据库。成功返回
    true，失败返回 false。 |

    | mysql_select_db(database-name, link-identifier); | 设置与指定 link-identifier 关联的服务器上的当前活动数据库。成功返回
    true，失败返回 false。 |

    | mysql_drop_db(database-name, link-identifier); | 尝试删除与指定 link-identifier 关联的服务器上的整个数据库。成功返回
    true，失败返回 false。 |

    | mysql_fetch_array(result-resource); | 返回与数据库表行对应的数组，如果没有更多行，则返回 false。 |

    | mysql_list_dbs(link-identifier); | 列出 MySQL 服务器上可用的数据库。 |

    | mysql_num_rows(result-resource); | 返回 result-resource 中的行数。 |

    | mysql_list_tables(database-name, link-identifier); | 列出指定数据库中的表。 |

    | mysql_query(SQL-string, link-identifier); | 向与指定 link-identifier 关联的服务器上的当前活动数据库发送查询。成功返回回答查询的
    result-resource，失败返回 false。 |


    书中的示例和练习是使用 Apache 1.3.31、MySQL 4.0.18 以及 PHP 5.0.00 最终版演示的——其他版本可能需要修改。所有示例的源代码可以从本书的网站
    www.ineasystems.com 下载。


