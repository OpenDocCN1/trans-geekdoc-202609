    ![](img/7faa63a7fa0add8f53300594ebae949f_16_1.png)


    ## Configuring Apache for PHP


    Before the Apache server can run PHP examples it must be told where to find the
    PHP module and how to recognize PHP files. This is achieved by editing the Apache
    configuration file located at C:\Apache\conf\httpd.conf.


    Open the "httpd.conf" configuration file in a text editor, then find the section
    containing the "AddModule" directives. At the end of that section add the following
    three lines:


    ```

    LoadModule php5_module c:/php/php5apache.dll

    AddModule mod_php5.c

    AddType application/x-httpd-php .php .phtml

    ```


