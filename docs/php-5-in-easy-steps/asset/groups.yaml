    # Hello World


    All PHP code must be included inside special markup tags that are frequently recognized
    by the PHP parser. Each PHP code tag begins with `<?php` and ends with `?>`, and
    looks like this:


    ```

    <?php PHP code goes here ?>

    ```


    In older PHP scripts the code was sometimes written inside a tag that just began
    `<?` , rather than `<?php`. This is discouraged in PHP 5 to avoid confusion with
    other server-side languages, so the `<?php` version is used throughout this book.
    When a tag beginning with `<?php` is encountered, its contents are automatically
    referred to the PHP parser for interpretation.


    The most basic PHP instruction is the echo() function, which is used to make the
    PHP parser dynamically write content into a generated HTML page. Literal content
    must be enclosed within quotes inside the function''s parentheses and may include
    HTML markup tags. In the simple example below, echo() function writes a traditional
    welcome message as a heading in a HTML page:


    ![](img/7faa63a7fa0add8f53300594ebae949f_21_0.png)


    ```

    <html>

    <?php echo "<h1>Hello World</h1>"; ?>


    </html>

    ```


    This example is saved in Apache’s hdocs folder so that it can be viewed in a browser
    by typing `http://localhost/hello.php` in the browser URL field, like this:


    ![](img/7faa63a7fa0add8f53300594ebae949f_21_1.png)


    ![](img/7faa63a7fa0add8f53300594ebae949f_21_2.png)'
  - '[PAGE 22]


    # Syntax rules


    PHP is not generally case-sensitive, so the example on the opposite page could
    have been written as follows and still produced the same result when viewed in
    a web browser:


    ![](img/7faa63a7fa0add8f53300594ebae949f_22_0.png)


    ```

    <html>

    <?php ECHO ( "<h1>Hello World</h1>" ); ?>


    </html>

    ```


    It is important to notice the semi-colon at the end of the PHP instruction. This
    terminator must appear at the end of each PHP statement, in the same way that
    a period must terminate each sentence in the English language.


    Comments can usefully be added inside the PHP code block as explanation to third
    parties, or as a reminder when you revisit the code later. The PHP parser sees
    any text between "//" and the end of that line as a single-line comment, which
    it ignores. Alternatively, single-line comments may begin with a "#" character.
    Also, text on one or more lines between "/*" and "*/" is ignored.


    ![](img/7faa63a7fa0add8f53300594ebae949f_22_1.png)


    ```

    <html>

    <?php

    /* Here is an introduction to this script code inside

    a multi-line comment block */

    echo ( "<h1>Hello World</h1>" );

    // Here is single-line comment

    // And here is another single-line comment

    ?>


    </html>

    ```


    When this example is opened in a web browser, via Apache, the browser''s View
    > Source menu option reveals only this code:


    ```

    <html> <h1>Hello World</h1></html>

    ```'
