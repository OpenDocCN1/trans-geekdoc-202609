    # Altering tables


    Existing table column properties can be changed with the SQL command `alter table
    table-name modify column-name property`.


    The script below alters the my_table table on the facing page to restrict the
    "id" column to numbers containing at most three digits. Similarly, it extends
    the permissible character length of the column named "last_name" from 16 characters
    to 32 characters.


    ![](img/7faa63a7fa0add8f53300594ebae949f_152_0.png)


    ```

    <?php

    // connect to MySQL

    $conn = mysql_connect("localhost", "mike", "bingo") or die("Err:Conn");

    // select the specified database

    $rs = mysql_select_db("my_database", $conn) or die("Err:Db");


    // execute the 1st query

    // reduce field to 3 number length

    $query = "alter table my_table modify id int(3)";

    $rs = mysql_query($query, $conn) or die("Err:Query 1");


    // execute the 2nd query

    // extend field to 32 character length

    $query = "alter table my_table modify last_name char(32)";

    $rs = mysql_query($query, $conn) or die("Err:Query 2");

    ?>

    ```


    ![](img/7faa63a7fa0add8f53300594ebae949f_152_1.png)


    The alter statements must include the columns'' data types or they will not be
    modified.


    ![](img/7faa63a7fa0add8f53300594ebae949f_152_2.png)


    Check the new table format in the MySQL monitor to see that the modifications
    have been applied.


    | Field | Type | Null | Key | Default | Extra |

    |---|---|---|---|---|---||

    | id | int(3) | YES | | NULL | |

    | first_name | char(16) | YES | | NULL | |

    | last_name | char(32) | YES | | NULL | |


