  - "[PAGE 81]\n\n# Displaying directory files\n\nSpecial PHP functions can be used\
    \ to display a list of all the files contained within any directory on your system.\
    \ Before the directory can be accessed, it must be opened with the opendir() function.\
    \ This takes the full path address of the directory as its argument and returns\
    \ a \"directory handle\".\n\nOnce opened, a loop can assign all file names to\
    \ a variable list using the readdir() function to step through each turn; this\
    \ takes the directory handle as its argument.\n\nIt is important to remember to\
    \ close the directory when the loop has completed, using the closeddir() function.\
    \ Again, this requires the directory handle to be supplied as its argument.\n\n\
    This example assigns each file name in Apache's bin folder to a variable $file,\
    \ before adding it to the $file_list variable.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_81_0.png)\n\
    \n```\n<?php\n#for Windows...\n$dirname = \"C:\\\\bin\";\n\n#for Linux... $dirname\
    \ = \"/usr/local/apache/bin\";\n\n$dir = opendir($dirname);\n\nwhile ( false !=\
    \ $file = readdir($dir) ) {\n    if ($file != \".\") and ($file != \"..\") {\n\
    \        $file_list .= \"<li>\\$$file</li>\";\n    }\n}\n\nclosedir($dir);\n\n\
    ?>\n\n<html><head><title>Listing directory</title>\n<body>\n<p>Files in <?php\
    \ echo $dirname; ?> ?></p>\n<ul>\n<li><?php echo $file_list); ?>\n</ul>\n</body></html>\n\
    ```\n\n![](img/7faa63a7fa0add8f53300594ebae949f_81_1.png)"
