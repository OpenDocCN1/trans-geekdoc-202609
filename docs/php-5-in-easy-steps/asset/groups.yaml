  mdcn: "\n\n## 修改表\n\n可以使用 SQL 命令 `alter table table-name modify column-name property`\
    \ 修改现有的表列属性。\n\n下面的脚本修改了对应页面中的 `my_table` 表，将 \"id\" 列限制为最多包含三个数字的数字。同样，它将名为 \"\
