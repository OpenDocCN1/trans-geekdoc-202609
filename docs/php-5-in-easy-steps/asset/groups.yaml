    \ Statement</title></head>\n<body>\n<?php\n$i = 0;\n\nwhile ($i < 6 )\n{\n   \
    \ if ($i == 3) break;\n    $i++;\n}\necho(\"Loop stopped at $i by break statement\"\
    );\n\n</body></html>\n```\n\n> The “break” keyword is also used as a terminator\
