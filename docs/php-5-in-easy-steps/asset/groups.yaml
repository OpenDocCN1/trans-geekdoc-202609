    \ return the removed element data, which can be assigned to a variable.\n\nThe\
    \ following example removes the first and last elements from an array, then sorts\
    \ the remaining elements into alphabetical order using the PHP sort() function.\n\
    \n```html\n<html><head><title>Remove array elements</title></head>\n<body><ol>\n\
    <?php\n#create an array containing 5 strings\n$arr=array(\"Orange\",\"Cherry\"\
