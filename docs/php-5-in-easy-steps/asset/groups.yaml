  md: "\n# SQL queries\n\nThe basic SQL commands demonstrated in this chapter can\
    \ be used to create database tables and fill them with data. More advanced features\
    \ of SQL allow the data to be queried for specific information. For instance,\
    \ the “cars” table at the bottom of page 136 can be searched, to find the details\
    \ of any car with a top speed exceeding 200 mph, with this query:\n\n```\nselect\
    \ * from cars where top_mph > 200;\n```\n\nIn this case there is just one record\
    \ that fits the bill:\n\nThe ability to query data contained within databases\
    \ is where the power of MySQL lies. More information illustrating the advanced\
    \ features of the SQL language is given in the manual contained in the Docs folder\
    \ of the MySQL installation directory.\n\nFurther details about SQL can also be\
    \ found on the Internet in the MySQL Language Reference at www.mysql.com.\n\n\
    MySQL databases can be queried from PHP, using special functions that replicate\
    \ the SQL commands used in this chapter.\n\nConnecting to a MySQL database from\
    \ PHP is easy thanks to the PHP mysql_connect() function. Once connected, the\
    \ PHP mysql_query() function can be used to query the database and store the results\
    \ in a PHP variable.\n\nThe next chapter demonstrates how to implement all the\
    \ operations shown in this chapter from inside PHP scripts.\n\n# PHP & MySQL together\n\
    \nThis chapter demonstrates how to create and manipulate MySQL databases from\
    \ PHP scripts. The examples perform similar actions to the operations performed\
    \ directly in the MySQL monitor in the previous chapter.\n\n# Covers\n\n- Creating\
    \ a MySQL user & password | 140\n- Connecting a user to MySQL | 141\n- Listing\
    \ databases | 142\n- Listing table names | 143\n- Creating a database | 144\n\
    - Deleting a database | 145\n- Creating a database table | 146\n- Inserting table\
    \ data | 149\n- Altering tables | 151\n- Retrieving data from a table | 152\n\
    - More MySQL | 154\n\n# Chapter Eleven\n\n# Creating a MySQL user & password\n\
    \nThe MySQL connection test made at the beginning of this book, right after installation,\
    \ assumed connection to MySQL as the root user without any password. This affords\
    \ poor security, so in reality you should create a user with an associated password.\n\
    \nAdding a user is best achieved by entering a \"grant statement\" into the MySQL\
    \ monitor as the root user. Opening the MySQL monitor as normal will commonly\
    \ identify you as the root user. To be sure, from the MySQL monitor type \"exit\"\
    \ to close the monitor.\n\n```\nmysql -u root\n```\n\nOr, if a password has been\
    \ set up for the root user, the line will be:\n\n```\nmysql -u root -p password\n\
    ```\n\nNow at the mysql> prompt type this MySQL grant statement:\n\n```\ngrant\
    \ all privileges on * to user-name@domain identified by \"password\" with grant\
    \ option;\n```\n\nThis will create a new user with superuser status – allowing\
    \ the named user full access from the specified domain, providing that they supply\
    \ the specified password.\n\nThe illustration shows a new user (\"mike\") being\
    \ created in the localhost domain, with a simple password of \"bingo\" – these\
    \ users details will feature in future code examples in this book.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_141_0.png)\n\
    \n```\nMySQL Monitor\nmysql> exit\nBye\nC:\\mysql\\bin>mysql -u root ends with\
    \ ; or \\g.\nWelcome to the MySQL monitor. Commands with ; or Your MySQL connection\
    \ id is 17 to server version: 4.0.18-nt\nType 'help'; or 'h' for help. Type 'c'\
    \ to clear the buffer\nmysql> grant all privileges on .* to mike@localhost identified\
    \ by \"bingo\" with grant option;\nQuery OK, 0 rows affected (0.03 sec)\nmysql>\n\
    ```\n\n# Connecting a user to MySQL\n\nTo connect to MySQL the PHP mysql_connect\
    \ function requires three arguments specifying valid domain name, user name and\
    \ password. This function returns true if the connection succeeds, or false if\
    \ the attempt fails. The script below writes a confirmation if the connection\
    \ is successful.\n\n```php\n<?php $user = \"mike\";\n$conn = mysql_connect(\"\
    localhost\", $user, \"bingo\");\nif($conn) {\n$msg=\"Congratulations $user, You\
    \ connected to MySQL\";\n?>\n<html><head><title>Connecting user</title></head>\n\
    <body><h3><?php echo($msg); ?></h3></body></html>\n```\n![](img/7faa63a7fa0add8f53300594ebae949f_142_0.png)\n\
    ![](img/7faa63a7fa0add8f53300594ebae949f_142_1.png)\n\nThe user details are case-sensitive,\
    \ so changing the value of $user to \"MIKE\" means that the connection will fail,\
    \ with a PHP warning written in the error.log file located in Apache’s directory;\
    \ it provides detailed information about the failure, and looks like this:\n\n\
    ![](img/7faa63a7fa0add8f53300594ebae949f_142_2.png)\n\n# Listing databases\n\n\
    The equivalent of the SQL \"show databases\" in PHP requires the use of three\
    \ functions.\n\nFirst, mysql_list_db() returns a \"result set\" of information\
    \ about all databases, which can be assigned to a variable. The details of each\
    \ database are held in separate rows within the result set, so the total number\
    \ of databases can be determined using mysql_num_rows() function to discover how\
    \ many rows are in the result set. This function takes the result set as its argument.\n\
    \nThe name of each database can be extracted from a result set by mysql_tablename()\
    \ function. This function is also used to extract the names of each table from\
    \ a specified database. A result set and row number are required to get the database\
    \ names. The example below assigns the result to a variable called $rs. This is\
    \ used as the argument to mysql_num_rows() function to list each database name.\n\
    \n```php\n<?php\n$conn = @mysql_connect(\"localhost\",\"mike\",\"bingo\");\nor\
    \ die(\"Sorry - could not connect to MySQL\");\n\n$rs = @mysql_list_db($conn);\n\
    for ($row = 0; $row < mysql_num_rows($rs); $row++) {\n    $db_list .= mysql_tablename($rs,\
    \ $row) . \"<br>\";\n}\n?>\n<html><head><title>Listing databases</title></head>\n\
    <body><h3><?php echo $db_list; ?></h3></body></html>\n```\n![](img/7faa63a7fa0add8f53300594ebae949f_143_0.png)\n\
    \n| Listing databases |\n| :--- |\n| File | Edit | Favorites | Tools | Help |\n\
    | Address | http://localhost/list_db.php | Go |\n| test |\n| Done | Local intranet\
    \ |\n\n# Listing table names\n\nSimilar to the mysql_list_db() function, the PHP\
    \ mysql_list_tables() function returns a result set of information about all tables\
    \ in a database.\n\nEach table name can be extracted by specifying the result\
    \ set, and its row number in the result set, as the arguments to mysql_tablename()\
    \ function. The example below reveals the names of three tables that have been\
    \ added to the test database.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_144_0.png)\n\
    \n```php\n<?php $conn = @mysql_connect(\"localhost\", \"mike\", \"bingo\")\nor\
    \ die(\"Sorry - could not connect to MySQL\");\n\n$rs1 = @mysql_list_db($conn);\n\
    for($row = 0; $row < mysql_num_rows($rs1); $row++) {\n    $thisdb = mysql_tablename($rs1,\
    \ $row);\n    $list = \"<b>\" . $thisdb . \"</b><br>\";\n    if ($thisdb != \"\
    mysql\") {\n        $rs2 = mysql_list_tables($thisdb);\n        for($num = 0;\
    \ $num < mysql_num_rows($rs2); $num++) {\n            $list = \"<li>\" . mysql_tablename($rs2,$num)\
    \ . \"</li>\";\n        }\n    }\n}\n?>\n```\n\nMySQL's own database (called \"\
    mysql\") must be excluded, as tables cannot be read in this way for security reasons.\n\
    \n```html\n<html><head><title>Listing Tables</title></head><body><?php echo ($list);\
    \ ?></body></html>\n```\n\n| Listing Tables |\n| :--- |\n| File | Edit | Favorites\
    \ | Tools | Help |\n| Address | http://localhost/list-tables.php | Go |\n| mysql\
    \ |\n| test |\n| - first_table |\n| - second_table |\n| - third_table |\n| Done\
    \ | Local intranet |\n\n# Creating a database\n\nThe PHP mysql_create_db() attempts\
    \ to create a database with the name supplied as its argument. The example below\
    \ displays all existing databases, provides a form where a new database name can\
    \ be input. When the form is submitted, the script attempts to create a new database\
    \ with the specified name.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_145_0.png)\n\
    \n```php\n$conn = @mysql_connect(\"localhost\",\"mike\",\"bingo\");\nor die(\"\
    Sorry - could not connect to MySQL\");\n```\n![](img/7faa63a7fa0add8f53300594ebae949f_145_1.png)\n\
    \n```php\n$rs1 = @mysql_create_db($_REQUEST['db_name']);\n```\n\nThis function\
    \ returns true if the database is successfully created or if the attempt fails.\n\
    \n```php\n$rs2 = @mysql_list_db($conn);\nfor ($row = 0; $row < @mysql_num_rows($rs2);\
    \ $row++) {\n  $list .= mysql_tablename($rs2, $row) . \"<li>...</li>\";\n}\n?>\n\
    ?>\n<html><head><title>Creating databases</title></head>\n<body>\n<form action=\"\
    <?php echo $_SERVER['PHP_SELF'];?>\" method=\"post\">\nCurrent databases: <?php\
    \ echo $list; ?>\n<hr>Name:<input type=\"text\" name=\"db\">\n<input type=\"submit\"\
    \ value=\"Create database\">\n</form>\n</body>\n</html>\n```\n![](img/7faa63a7fa0add8f53300594ebae949f_145_2.png)\n\
    ![](img/7faa63a7fa0add8f53300594ebae949f_145_3.png)\n"
  mdcn: "\n\n# SQL 查询\n\n本章演示的基础 SQL 命令用于创建数据库表并向其填充数据。SQL 的更高级功能允许对特定信息进行查询。例如，可以使用此查询搜索第\
    \ 136 页底部的“cars”表，查找最高速度超过 200 英英的任何汽车的详情：\n\n```\nselect * from cars where top_mph\
    \ > 200;\n```\n\n在这种情况下，只有一条符合记录的记录：\n\n查询数据库中包含的数据的能力是 MySQL 的威力所在。关于 SQL 语言高级功能的更多信息，请参阅\
    \ MySQL 安装目录目录下 Docs 文件夹中的手册。\n\n有关 SQL 的更多详细信息可以在互联网上 www.mysql.com 的 MySQL 语言参考中找到。\n\
    \n可以使用 PHP 使用特殊函数查询 MySQL 数据库，这些函数复制了本章使用的 SQL 命令。\n\n得益于 PHP `mysql_connect()`\
    \ 函数，从 PHP 连接到 MySQL 数据库非常简单。一旦连接，可以使用 PHP `mysql_query()` 函数查询数据库并将结果存储在 PHP\
    \ 变量中。\n\n下一章将演示如何在 PHP 脚本内部实现本章所示的所有操作。\n\n# PHP 与 MySQL 协同工作\n\n本章演示了如何从 PHP\
    \ 脚本创建和操作 MySQL 数据库。示例执行的操作与上一章中直接在 MySQL 监控器中执行的操作相似。\n\n# 目录内容\n\n- 创建 MySQL\
    \ 用户和密码 | 140\n- 将用户连接到 MySQL | 141\n- 列出数据库 | 142\n- 列出表名 | 143\n- 创建数据库 | 144\n\
    - 删除数据库 | 145\n- 创建数据库表 | 146\n- 插入表数据 | 149\n- 修改表 | 151\n- 从表中检索数据 | 152\n-\
    \ 更多 MySQL | 154\n\n# 第十一章\n\n# 创建 MySQL 用户和密码\n\n在本书开头（安装后立即）完成的 MySQL 连接测试假设是以\
    \ root 用户身份在无密码的情况下连接到 MySQL。这提供的安全性很差，因此在现实中，你应该创建一个关联密码的用户。\n\n添加用户的最佳方法是以 root\
    \ 用户身份在 MySQL 监视器中输入“授权语句（grant statement）”。正常打开 MySQL 监视器通常会将你识别为 root 用户。为了确保无误，请在\
    \ MySQL 监视器中输入“exit”关闭监视器。\n\n```\nmysql -u root\n```\n\n或者，如果为 root 用户设置了密码，该行将变为：\n\
    \n```\nmysql -u root -p password\n```\n\n现在在 mysql> 提示符下输入此 MySQL 授权语句：\n\n```\n\
    grant all privileges on * to user-name@domain identified by \"password\" with\
    \ grant option;\n```\n\n这将创建一个具有超级用户权限的新用户——允许指定的用户从指定域完全访问，前提是他们提供了指定的密码。\n\n\
    插图显示在 localhost 域中创建一个新用户（“mike”），使用简单的密码“bingo”——这些用户的详情将出现在书中随后的代码示例中。\n\n![](img/7faa63a7fa0add8f53300594ebae949f_141_0.png)\n\
    \n```\nMySQL Monitor\nmysql> exit\nBye\nC:\\mysql\\bin>mysql -u root ends with\
    \ ; or \\g.\nWelcome to the MySQL monitor. Commands with ; or Your MySQL connection\
    \ id is 17 to server version: 4.0.18-nt\nType 'help'; or 'h' for help. Type 'c'\
    \ to clear the buffer\nmysql> grant all privileges on .* to mike@localhost identified\
    \ by \"bingo\" with grant option;\nQuery OK, 0 rows affected (0.03 sec)\nmysql>\n\
    ```\n\n# 将用户连接到 MySQL\n\n连接 MySQL 时，PHP `mysql_connect` 函数需要三个参数来指定有效的域名、用户名和密码。如果连接成功，该函数返回\
    \ true；如果失败则返回 false。下面的脚本在连接成功时写入确认信息。\n\n```php\n<?php $user = \"mike\";\n$conn\
    \ = mysql_connect(\"localhost\", $user, \"bingo\");\nif($conn) {\n$msg=\"Congratulations\
    \ $user, connected to MySQL\";\n?>\n<html><head><title>Connecting user</title></head>\n\
    <body><h3><?php echo($msg); ?></h3></body></html>\n```\n![](img/7faa63a7fa0add8f53300594ebae949f_142_0.png)\n\
    ![](img/7faa63a7fa0add8f53300594ebae949f_142_1.png)\n\n用户详情是区分大小写的，因此将 $user 的值更改为\
    \ \"MIKE\" 将导致连接失败并在 Apache 目录下的 error.log 文件中写入 PHP 警告；提供了关于失败的详细信息，如下：\n\n![](img/7faa63a7fa0add8f53300594ebae949f_142_2.png)\n\
    \n# 列出数据库\n\nPHP 中相当于 SQL \"show databases\" 需要三个函数。\n\n首先，`mysql_list_db()` 返回所有数据库信息的“结果集”，可以将其赋值给变量。每个数据库的详情存储在结果集的单独行中，因此可以使用\
    \ `mysql_num_rows()` 函数确定结果中有多少行。每个数据库的名称可以通过 `mysql_tablename()` 函数从结果集中提取。该函数还用于从指定的数据库提取每个表的名称。下面的示例将结果赋值给变量\
    \ $rs，并将其作为 `mysql_num_rows()` 函数的参数列出每个数据库名称。\n\n```php\n<?php\n$conn = @mysql_connect(\"\
    localhost\",\"mike\",\"bingo\");\nor die(\"Sorry - could not connect to MySQL\"\
    );\n\n$rs = @mysql_list_db($conn);\nfor ($row = 0; $row < mysql_num_rows($rs);\
    \ $row++) {\n    $db_list .= mysql_tablename($rs, $row) . \"<br>\";\n}\n?>\n<html><head><title>Listing\
    \ databases</title></head>\n<body><h3><?php echo $db_list; ?></h3></body></html>\n\
    ```\n![](img/7faa63a7fa0add8f53300594ebae949f_143_0.png)\n\n| 列出数据库 |\n| :---\
    \ |\n| File | Edit | Favorites | Help |\n| Address | http://localhost/list_db.php\
    \ | Go |\n| test |\n| Done | Local intranet |\n\n# 列出表名\n\n与 `mysql_list_db()`\
    \ 函数类似，PHP `mysql_list_tables()` 函数返回数据库中所有表的信息的结果集。\n\n通过指定结果集的行号作为 `mysql_tablename()`\
    \ 函数的参数，可以提取每个表名。下面的示例显示了添加到 test 数据库的三个表的名称。\n\n![](img/7faa63a7fa0add8f53300594ebae949f_144_0.png)\n\
    \n```php\n<?php $conn = @mysql_connect(\"localhost\", \"mike\", \"bingo\")\nor\
    \ die(\"Sorry - could not connect to MySQL\");\n\n$rs1 = @mysql_list_db($conn);\n\
    for($row = 0; $row < mysql_num_rows($rs1); $row++) {\n    $thisdb = mysql_tablename($rs1,\
    \ $row);\n    $list = \"<b>\" . $thisdb . \"</b><br>\";\n    if ($thisdb != \"\
    mysql\") {\n        $rs2 = mysql_list_tables($thisdb);\n        for($num = 0;\
    \ $num < mysql_num_rows($rs2); $num++) {\n            $list = \"<li>\" . mysql_tablename($rs2,$num)\
    \ . \"</li>\";\n        }\n    }\n}\n?>\n```\n\n必须排除 MySQL 自身的数据库（名为 \"mysql\"\
    ），因为出于安全考虑，不能这种方式读取表。\n\n```html\n<html><head><title>Listing Tables</title></head><body><?php\
    \ echo ($list); ?></body></html>\n```\n\n| 列出表 |\n| :--- |\n| File | Edit | Favorites\
    \ | Tools | Help |\n| Address | http://localhost/list-tables.php | Go |\n| mysql\
    \ |\n| test |\n| - first_table |\n| - second_table |\n| - third_table |\n| Done\
    \ | Local intranet |\n\n# 创建数据库\n\nPHP `mysql_create_db()` 尝试根据其参数提供的名称创建一个数据库。下面的示例显示了所有现有数据库，提供了一个可以输入新数据库名称的表单。当提交表单时，脚本尝试创建一个指定名称的新数据库。\n\
    \n![](img/7faa63a7fa0add8f53300594ebae949f_145_0.png)\n\n```php\n$conn = @mysql_connect(\"\
    localhost\",\"mike\",\"bingo\");\nor die(\"Sorry - could not connect to MySQL\"\
    );\n```\n![](img/7faa63a7fa0add8f53300594ebae949f_145_1.png)\n\n```php\n$rs1 =\
    \ @mysql_create_db($_REQUEST['db_name']);\n```\n\n如果数据库创建成功，该函数返回 true；如果尝试失败则返回\
    \ false。\n\n```php\n$rs2 = @mysql_list_db($conn);\nfor ($row = 0; $row < @mysql_num_rows($rs2);\
    \ $row++) {\n  $list .= mysql_tablename($rs2, $row) . \"<li>...</li>\";\n}\n?>\n\
    ?>\n<html><head><title>Creating databases</title></head>\n<body>\n<form action=\"\
    <?php echo $_SERVER['PHP_SELF'];?>\" method=\"post\">\nCurrent databases: <?php\
    \ echo $list; ?>\n<hr>Name:<input type=\"text\" name=\"db\">\n<input type=\"submit\"\
    \ value=\"Create database\">\n</form>\n</body>\n</html>\n```\n![](img/7faa63a7fa0add8f53300594ebae949f_145_2.png)\n\
    ![](img/7faa63a7fa0add8f53300594ebae949f_145_3.png)\n\n"
