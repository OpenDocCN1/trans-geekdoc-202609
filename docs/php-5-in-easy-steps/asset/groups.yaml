    # Creating a database table


    To create a database table you must first select the database to which it is to
    be added, using the SQL "use database-name;" command. This requires the name of
    one of the existing databases, revealed by the "show databases;" command.


    A new table is created with the SQL "create table table-name;" command, specifying
    a column name for that table, then a comma-separated list of column names enclosed
    within a pair of brackets. Additionally, each column name must be followed by
    a data type specifier to set the type of data permitted in the table cells of
    that column. These specifiers can use SQL keywords of "int" for integer numbers,
    "decimal" for floating-point numbers, or "text" for character strings.


    A semi-colon is required after each complete command.


    ![](img/7faa63a7fa0add8f53300594ebae949f_132_0.png)


    For instance, the syntax to create a table with three columns is: "create table
    table-name (column1-name column1-type, column2-name column2-type, column3-name
    column3-type);";


    Once a database has been selected, the SQL "show tables;" command reveals the
    names of all tables in that database. This is used in the MySQL monitor illustrated
    below to confirm the addition of a table called "cars" to the "garage" database.
    The cars table contains one numeric column called "id", and two text columns called
    "make" and "model". More SQL column types and options are described on the next
    page.


    ![](img/7faa63a7fa0add8f53300594ebae949f_132_1.png)


    To close the MySQL monitor type "exit" or "quit" at the mysql> prompt.


    ```

    MySQL Monitor\mysql> use garage;

    Database changed\mysql> create table cars(id int,make text,model text);

    Query OK, 0 rows affected (0,00 sec)


    mysql> show tables;

    +----------------------+

    | Tables_in_garage    |

    +----------------------+

    | cars                 |

    +----------------------+

    1 row in set (0,00 sec)

    mysql>

    ```'
