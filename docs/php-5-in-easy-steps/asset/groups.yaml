  - "[PAGE 64]\n\n# ...cont'd\n\nThe information contained in the HTTP_USER_AGENT\
    \ environment variable can be used to create dynamic content appropriate to the\
    \ browser by using the preg_match() function. This seeks to match a specified\
    \ string pattern, and has this syntax:\n\n```\npreg_match(\"/string-to-seek\"\
    , \"string-to-search\");\n```\n\nThe following example tries to identify both\
    \ browser and platform. Default strings are provided for when no match is found.\
    \ The appropriate string is then written out on the page.\n\n```\n<html><head><title>Browser\
    \ content</title></head>\n<body>\n  <?php $viewer = getenv(\"HTTP_USER_AGENT\"\
    );\n  $browser = \"an unidentified browser\";\n  if (preg_match(\"//MSIE/i\",\
    \ \"$viewer\")) {\n    $browser = \"Internet Explorer\";\n  } else if (preg_match(\"\
    //Netscape/i\", \"$viewer\")) {\n    $browser = \"Netscape\";\n  } else if (preg_match(\"\
    //Opera/i\", \"$viewer\")) {\n    $browser = \"Opera\";\n  }\n  $platform = \"\
    an unidentified operating system\";\n  if (preg_match(\"//Windows/i\", \"$viewer\"\
    )) {\n    $platform = \"Windows\";\n  } else if (preg_match(\"//Linux/i\", \"\
    $viewer\")) {\n    $platform = \"Linux\";\n  }\n  echo(\"You're using $browser\
    \ on \\$platform\");\n</body></html>\n```\n\n![](img/7faa63a7fa0add8f53300594ebae949f_64_0.png)\n\
    \nThe i switch is included in the preg_match() first argument to ensure a case-insensitive\
    \ search.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_64_1.png)\n\n![](img/7faa63a7fa0add8f53300594ebae949f_64_2.png)\n\
    \n6. Generating dynamic content | 63"
