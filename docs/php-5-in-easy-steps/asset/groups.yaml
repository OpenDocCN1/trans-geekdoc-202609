    # File handling with PHP


    This chapter demonstrates how PHP can read files and directories and how it can
    write new files on the server. It also illustrates how to copy, rename and delete
    files, and then shows how a script can upload files to the server.


    # Covers


    +   - Displaying directory files | 80

