    fclose($file);\necho(\"File Size: $filesize bytes\");\necho(\"<pre>$text</pre>\"\
    );\n?>\n</body></html>\n```\n\n# ...cont'd\n\n![](img/7faa63a7fa0add8f53300594ebae949f_88_0.png)\n\
