  md: "\n## Variable scope\n\nVariable scope defines which parts of a PHP script have\
    \ access to a variable. The variables used in the example on the opposite page\
    \ are both declared inside functions, so are known as “local” variables. These\
    \ can be used by only the function in which they are declared.\n\nConversely,\
    \ “global” variables are declared outside functions and can be accessed by any\
    \ function in that document. Unlike other languages that make global variables\
    \ accessible automatically, PHP requires a function to declare explicitly that\
    \ it wants to use a global variable, otherwise the variable will be deemed to\
    \ be of local scope by default. A simple declaration inside a function’s code\
    \ block uses the “global” keyword followed by the variable name.\n\nThis example\
    \ creates a global variable $num, accessible to two functions by including a declaration\
    \ in each code block.\n\n```php\n<?php $num;\nfunction make_triple($arg) {\n \
    \   global $num;\n    $num = $arg + $arg + $arg;\n    thrice();\n}\nfunction thrice()\
    \ {\n    global $num;\n    echo (\"The value is $num\");\n}\n?>\n<html><head><title>Variable\
    \ Scope</title></head><body><?php make_triple(4); ?></body></html>\n```\n\n![](img/7faa63a7fa0add8f53300594ebae949f_30_0.png)\n\
    \nRemoval of either global declaration will render the code useless, as PHP then\
    \ assumes the variable reference in the function is made to a local variable.\n\
    \n![](img/7faa63a7fa0add8f53300594ebae949f_30_1.png)\n\n![](img/7faa63a7fa0add8f53300594ebae949f_30_2.png)\n\
    \n2. Getting started with PHP | 29\n\n## Multiple arguments\n\nFunctions may specify\
    \ multiple arguments within their plain brackets to allow several values to be\
    \ passed to the function code. The argument variable names simply need to be separated\
    \ by commas in a list.\n\nWhen a function specifies single or multiple arguments,\
    \ calls to that function must also normally include the correct number of argument\
    \ values to avoid an error. Optionally, a default value can be assigned to the\
    \ argument in the function declaration.\n\nIn this example, three arguments are\
    \ specified, each with a default value to be used if no argument value is passed\
    \ from the caller:\n\n![](img/7faa63a7fa0add8f53300594ebae949f_31_0.png)\n\n```php\n\
    <?php\nfunction addup($a = 32, $b = 32, $c = 32 ) {\n    $total = $a + $b + $c;\n\
    \    echo(\"$$a + $b + $c = $total\");\n}\n?>\n<html><head><title>Function Arguments</title></head>\n\
    <body>\n<h3> <?php addup(8, 16, 24); ?> </h3>\n<h3> <?php addup(8, 16); ?> </h3>\n\
    </body></html>\n```\n\n|| Function Arguments | File | Edit | View | Favorites\
    \ | Tools | Help |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| Address\
    \ | http://localhost/args.php | Go | | | | |\n| 8 + 16 + 24 = 48 | | | | | | |\n\
    | 8 + 16 + 32 = 56 | | | | | | |\n\n## Performing operations\n\nThis chapter introduces\
    \ the different PHP operators and demonstrates how they can be used in script\
    \ statements to perform comparisons and to manipulate values.\n\n## Covers\n\n\
    - Arithmetical operators | 32\n- Logical operators | 34\n- Assignment operators\
    \ | 36\n- Comparison operators | 38\n- Conditional operator | 40\n\nChapter Three\n\
    \n## Arithmetical operators\n\nThe arithmetical operators commonly used in PHP\
    \ scripts are listed in the table below together with the operations they perform:\n\
    \n| Operator | Operation |\n| :--- | :--- |\n| + | Numeric addition |\n| . | String\
    \ concatenation |\n| - | Subtraction |\n| * | Multiplication |\n| / | Division\
    \ |\n| % | Modulus |\n| ++ | Increment |\n| -- | Decrement |\n\nNotice that the\
    \ + operator cannot be used to join strings as it can it in other languages. It\
    \ will add together two numeric values and give the result of the addition. Concatenation\
    \ of strings can only be performed with the . dot operator.\n\nThe modulus operator\
    \ will divide the first given number by the second given number and return the\
    \ remainder of the operation. This is most useful to determine if a number is\
    \ odd or even.\n\nThe increment ++ and decrement -- operators alter the given\
    \ value by 1 and return the resulting value. These are most commonly used to count\
    \ iterations in a loop.\n\nAll the other operators act as you would expect, but\
    \ care should be taken to bracket expressions where more than one operator is\
    \ being used, to clarify the operations:\n\n![](img/7faa63a7fa0add8f53300594ebae949f_33_0.png)\n\
    \n```php\na = b * c - d % e / f; // This is unclear\na = (b * c) - ((d % e) /\
    \ f); // This is clearer\n```\n\n## ...cont'd\n\n![](img/7faa63a7fa0add8f53300594ebae949f_34_0.png)\n\
    \narithmetical.php\n\n```php\n$addstr = \"I love \" \"PHP\";\n$sub = 35.75 - 28.25;\n\
    $mul = 8 * 50;\n$mod = 65 % 2;\n$inc = 5; ++inc;\n$dec = 5; --dec;\n```\n\n```php\n\
    $result = \"addnum:$addnum <br>\";\n$result = \"addstr:$addstr <br>\";\n$result\
    \ = \"sub:$sub <br>\";\n$result = \"mul:$mul <br>\";\n$result = \"mod:$mod <br>\"\
    ;\n$result = \"inc:$inc <br>\";\n$result = \"dec:$dec <br>\";\n```\n\nThe increment\
    \ and decrement operators may also be used following the operand where they perform\
    \ the operation but return the original value.\n\n```html\n<html>\n<head><title>Arithmetical\
    \ Operators</title> </head>\n<body>\n<h3> <?php echo ($result) ; ?> </h3>\n</body>\n\
    </html>\n```\n\n## Arithmetical Operators\n\n| File | Edit | View | Favorites\
    \ | Tools | Help |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| Address | |\
    \ | | | |\n| 8 + 16 + 24 = 48 | | | | | | |\n| 8 + 16 + 32 = 56 | | | | | | |\n\
    \n## Logical operators\n\n| Operator | Operation |\n| :--- | :--- |\n| && | Logical\
