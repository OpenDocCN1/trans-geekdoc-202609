    ## 随机数生成器


    PHP 的 `rand()` 函数用于生成随机数。可以可选地作为 `rand()` 函数的参数指定一个从中选择随机数的范围，该范围包含最小值和最大值。例如，`rand(1,10)`
    将在 1 到 10 之间选择一个数字。如果没有指定范围，随机数将在零和默认最大值 32767 之间。


    随机数生成器应该设置种子，以防止生成规律性的数字。这是通过使用 `rand()` 函数实现的，它接受种子数作为参数。通常，种子数指定为使用 PHP `microtime()`
    函数表示的微秒精度的当前时间乘以一百万。


    此示例以常用方式使用 `rand()` 函数，然后生成 1 到 100 范围内的随机数。


    ![](img/7faa63a7fa0add8f53300594ebae949f_67_0.png)


    ```html

    <html><head><title>Random Numbers</title></head>

    <body>

    <?php


    rand(microtime() * 1000000);

    $num = rand(1, 100);

    echo("Microtime:" . microtime() . "<br>");

    echo("A random number:" . $num . "<br>");

    $num = rand(1, 100);

    echo("Another random number:" . $num);


    ?>

    </body></html>

    ```


    ![](img/7faa63a7fa0add8f53300594ebae949f_67_1.png)


    | 随机数 | |

    |---|---|

    | 文件 编辑 视图 收藏 工具 帮助 |

