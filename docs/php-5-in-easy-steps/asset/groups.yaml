    \ 执行查询\n- 5) 使用返回的结果集数据。\n\n![](img/7faa63a7fa0add8f53300594ebae949f_154_3.png)\n\
    \n可以通过向 SQL 查询添加 where 限定符来检索特定数据。例如，在右侧所示代码的查询中添加 `where id=3` 将仅检索该行的数据：\n\n\
    ![](img/7faa63a7fa0add8f53300594ebae949f_154_4.png)\n\n## 更多 MySQL\n\n本章演示的常用基础数据库操作仅使用了\
