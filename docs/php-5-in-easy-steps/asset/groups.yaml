    \ - 指定一个未来的时间，以自 1970 年 1 月 1 日 GMT 00:00:00 以来计算的秒数，在该时间之后 cookie 将无法访问。如果未设置此参数，cookie\
    \ 将在网络浏览器关闭时自动过期。\n- **路径（Path）** - 指定 cookie 有效的服务器目录。单个正斜杠 `/` 允许 cookie 在所有目录下均有效。如果指定了特定目录，则\
    \ cookie 仅在该目录内有效。\n- **域名（Domain）** - 可指定域名，且必须包含至少两个点才有效。如果未指定此参数，默认值为创建 cookie\
    \ 的服务器的主机。所有 cookie 仅对创建它们的主机和域名有效。\n\n![](img/7faa63a7fa0add8f53300594ebae949f_100_0.png)\n\
    \n可以使用 setcookie() 函数配合过去的过期日期来删除 cookie。\n\n![](img/7faa63a7fa0add8f53300594ebae949f_100_1.png)\n\
    \n过期时间和安全性的参数必须是整数值。\n\n如果不需要显式设置其他参数，则可以使用空字符串替换它们。\n\n- **安全性（Security）** -\
    \ 可以设置为 1，以指定 cookie 应仅通过使用 HTTPS 的安全传输发送，否则（如果设置为 0）可以通过普通的 HTTP 设置 cookie。\n\
    \n除了名称参数外，所有参数都是可选的。如果只存在名称参数，则将从用户的计算机上删除该名称的 cookie。\n\n通过在 PHP time() 函数获取的当前基础上加上秒数，可以轻松地设置过期时间。以下每个示例都设置了一个名为\
    \ \"ID\"、值为 \"X12345\" 的 cookie，并在生成 24 小时后过期：\n\n```php\nsetcookie(\"ID\", \"\
    X12345\", time()+86400 , \"/\", \" \", 0);\nsetcookie(\"ID\", \"X12345\", time()+86400\
    \ );\n```\n\n8. 数据持久化 | 99\n\n# 设置 cookie\n\n必须记住，存储在 cookie 中的值在浏览器再次发出 HTTP\
    \ 请求之前是无法检索的。这通常意味着存储在页面一上的 cookie 值只能在网站的后续页面中检索。\n\n接下来的示例演示了如何将用户在表单字段 \"user\"\
    \ 和 \"color\" 中输入的两项数据存储起来。当表单提交时，页面会重新加载。如果在两个表单字段中都输入了值，脚本将分别这些值存储在名为 \"firstname\"\
    \ 和 \"fontcolor\" 的 cookie 中。浏览器将重定向到另一个页面，该页面将从 cookie 中检索存储的值。\n\n![](img/7faa63a7fa0add8f53300594ebae949f_101_0.png)\n\
    \n```php\n<?php\n$user = $_POST['user']; // 赋值\n$color = $_POST['color']; // 赋值\n\
    $self = $_SERVER['PHP_SELF']; // 赋值\n\nif ($user != null) and ($color != null)\
    \ {\n    setcookie(\"firstname\", $user, time()+36000);\n    setcookie(\"fontcolor\"\
    , $color, time()+36000);\n    header(\"Location:getcookie.php\");\n    exit();\n\
    }\n?>\n\n<html\n<head><title>设置 Cookie 数据</title></head>\n<body>\n<form action=\"\
    <?php echo ($self); ?>\" method=\"POST\">\n请输入你的名字：\n<input type=\"text\" name=\"\
    user\"><br><br>\n请选择你喜欢的字体颜色： <br>\n<input type=\"radio\" name=\"color\" value=\"\
    #FF0000\">红色\n<input type=\"radio\" name=\"color\" value=\"#00FF00\">绿色\n<input\
    \ type=\"radio\" name=\"color\" value=\"#0000FF\">蓝色\n<br><br><input type=\"submit\"\
    \ value=\"submit\">\n</form>\n</body>\n</html>\n```\n\n...续上\n\n![](img/7faa63a7fa0add8f53300594ebae949f_102_0.png)\n\
    \n第二个页面从名为 \"fontcolor\" 的 cookie 中获取用户的偏好字体颜色，并在样式表中页面文本设置为该颜色。此外，从名为 \"firstname\"\
    \ 的 cookie 中检索用户的姓名，然后写在页面上。\n\n![](img/7faa63a7fa0add8f53300594ebae949f_102_1.png)\n\
    \n```php\n<?php \n$user = $_COOKIE['firstname']; // # 赋值\n$color = $_COOKIE['fontcolor'];\
    \ // # 赋值\n?>\n<html><head><title>获取 Cookie 数据</title>\n<style type=\"css\">\n\
    body { color: <?php echo ($color); ?> }\n</style>\n</head>\n<body>\n<h1>Hello\
    \ <?php echo ($user); ?>!</h1>\n</body>\n</html>\n```\n\n![](img/7faa63a7fa0add8f53300594ebae949f_102_2.png)\n\
    \n8. 数据持久化 | 101\n\n# 访问限制\n\nCookies 可用于防止在不登录该网站的情况下直接访问网站的页面。登录过程创建 cookie，然后所有其他页面上的\
    \ PHP 脚本在显示其内容之前确认该 cookie 的存在性。\n\n在此示例中，当用户提交包含 \"user\" 和 \"pass\" 输入字段的表单时，登录页面会创建一个名为\
    \ \"auth\" 值为 \"ok\" 的 cookie。浏览器将重定向到第二个页面，该页面将寻找该 cookie。如果该页面没有找到 cookie，浏览器将重定向到登录页面。示例中的另一个页面也进行相同的检查，并有相同的响应。\n\
    \n![](img/7faa63a7fa0add8f53300594ebae949f_103_0)\n\n```php\n<?php\n$user = $_POST['user'];\
    \ // 赋值\n$pass = $_POST['pass']; // 赋值\n\nif ($user != null) and ($pass != null)\
    \ {\n    setcookie(\"auth\", \"ok\", time()+36000);\n    header(\"Location:page2.php\"\
    );\n}\n?>\n\n?>\n\n<html>\n<head><title>登录</title></head>\n<body>\n<form action=\"\
    login.php\" method=\"POST\">\n用户名：<input type=\"text\" name=\"user\"><br><br>\n\
    密码：<input type=\"text\" name=\"pass\"><br><br>\n<input type=\"submit\" value=\"\
    登录\">\n</form>\n</body>\n</html>\n```\n\n```php\n<?php\nif (isset($_COOKIE['auth']))\
    \ {\n    echo \"欢迎访问页面2！\";\n} else {\n    header(\"Location:login.php\");\n \
    \   exit();\n}\n?>\n\n<html>\n<head><title>页面2</title></head>\n<body>\n<h1>欢迎访问页面2！</h1>\n\
    <a href=\"login.php\">退出</a>\n</body>\n</html>\n```\n\n![](img/7faa63a7fa0add8f53300594ebae949f_103_1.png)\n\
    \n![](img/7faa63a7fa0add8f53300594ebae949f_103_2.png)\n\n```php\n<?php\nif (isset($_COOKIE['auth']))\
    \ {\n    echo \"欢迎访问页面3！\";\n} else {\n    header(\"Location:login.php\");\n \
    \   exit();\n}\n?>\n\n<html>\n<head><title>页面3</title></head>\n<body>\n<h1>欢迎访问页面3！</h1>\n\
    <a href=\"login.php\">退出</a>\n</body>\n</html>\n```\n\n"
