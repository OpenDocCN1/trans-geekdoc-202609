  mdcn: "\n\n## 删除数据库\n\nPHP `mysql_drop_db()` 函数尝试删除一个通过参数提供的名称的数据库。下面的示例与对应页面的内容相似，但它会在提交表单时尝试删除指定的数据库。如果尝试成功，该函数返回\
    \ true；如果失败，也会返回。\n\n```php\n$conn = @mysql_connect(\"localhost\", \"mike\", \"\
    bingo\");\nor die(\"Sorry - could not connect to MySQL\");\n\n$rs1 = @mysql_drop_db($_REQUEST['db']);\n\
    \n$rs2 = @mysql_list_dbs($conn);\nfor ($row = 0; $row < mysql_num_rows($rs2);\
    \ $row++) {\n  $list .= mysql_tablename($rs2, $row) . \" |\";\n}\n```\n\n![](img/7faa63a7fa0add8f53300594ebae949f_146_0.png)\n\
    \n```html\n<html><head><title>删除数据库</title></head>\n<body>\n<form action=\"<?php\
    \ echo (\\$_SERVER['PHP_SELF']); ?>\" method=\"post\">当前数据库: <?php echo($list);\
    \ ?>\n<hr>名称:<input type=\"text\" name=\"db\">\n<input type=\"submit\" value=\"\
    删除数据库\">\n</form></body></html>\n```\n\n![](img/7faa63a7fa0add8f53300594ebae949f_146_1.png)\n\
    \n![](img/7faa63a7fa0add8f53300594ebae949f_146_2.png)\n\n## 创建数据库表\n\n现有的数据库可以通过\
    \ PHP `mysql_select_db()` 函数选择，该函数接受数据库名称和连接作为参数。一旦选择，就可以通过 SQL 命令作为参数通过 PHP `mysql_query()`\
    \ 函数执行操作。“create table” 命令用于在数据库内部创建一个新表。在 MySQL 中直接执行 SQL 命令不需要分号结束符。\n\n此示例创建了一个动态创建数据库表的接口。初始时\
    \ `$fields` 未设置，因此编写了一个询问需要多少列的表单。当表单提交时，脚本会生成一个带有字段名称和类型的表单。输入到完成后的表单每个字段中的值将用于产生带有所选字段的数据库表\
    \ SQL 命令。\n\n![](img/7faa63a7fa0add8f53300594ebae949f_147_0.png)\n\n![](img/7faa63a7fa0add8f53300594ebae949f_147_1.png)\n\
    \n![](img/7faa63a7fa0add8f53300594ebae949f_147_2.png)\n\n当第一个表单带有输入项提交时，`$fields`\
    \ 变量被设置，脚本移动到下一个部分。\n\n```html\n<html><head><title>创建表</title></head>\n<?php\n\
    $self = $_SERVER['PHP_SELF'];\n$fields = $_POST['fields'];\n$db = $_POST['db'];\n\
    $name = $_POST['name'];\n$table = $_POST['table'];\n$type = $_POST['type'];\n\
    $size = $_POST['size'];\nif (!$fields && !$db) {\n$form = \"<form action=\\\"\
    $self\\\" method=\\\"post\\\">\n$form .= \\\"需要多少字段?\\\";\n$form .= \"<br><input\
    \ type=\\\"text\\\" name=\\\"$fields\\\">\";\n$form .= \"<input type=\\\"submit\\\
    \" value=\\\"提交\\\">\";\necho ($form );\n?>\n```\n\n| 创建表 | 文件 | 编辑 | 收藏 | 工具\
