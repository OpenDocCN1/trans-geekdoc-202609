    # Writing to the DOM


    The DOMDocument object includes methods to manipulate write to the DOM. New elements
    can be created with the createElement() method and text content can be inserted
    with the createTextNode() method. Each text node is added to its surrounding element,
    and each element added to its higher-level element, with the appendChild() method.


    This example adds a complete new book to those in books.xml and creates a new,
    enlarged XML document using the save() method.


    ![](img/7faa63a7fa0add8f53300594ebae949f_181_0.png)


    ```

    <?php

    $dom = new DOMDocument();

    $dom -> load("books.xml");


    # create elements

    $title = $dom -> createElement("title");

    $topic = $dom -> createElement("topic");

    $series = $dom -> createElement("series");

    $pic = $dom -> createElement("pic");


    # create text nodes

    $topictext = $dom -> createTextNode("Linux");

    $seriestext = $dom -> createTextNode("in easy steps");

    $pictext = $dom -> createTextNode("linux.gif");


    # append the text nodes to the inner nested elements

    $topic -> appendChild($topictext);

    $series -> appendChild($seriestext);

    $pic -> appendChild($pictext);


    # append the inner nested elements to the <title> element

    $title -> appendChild($topic);

    $title -> appendChild($series);

    $title -> appendChild($pic);


    # now append the <title> element to the root element

    $dom -> documentElement -> appendChild($title);


    # create a new enlarged XML document

    $dom -> save("newbooks.xml");


    ?>

    ```'
