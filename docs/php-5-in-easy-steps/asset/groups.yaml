    \nIf the test expression is true then the code in the statement block will be\
    \ executed. After the code has executed, the test expression will again be evaluated\
    \ and the loop will continue until the expression is found to be false.\n\nThe\
    \ statement block must feature code that will affect the test expression in order\
    \ to change the evaluation result to false at some point, otherwise an infinite\
    \ loop will be created.\n\nAn infinite loop will lock the script so that the page\
    \ will not complete.\n\nIt is important to note that if the test expression is\
    \ not true when it is first evaluated, the code in the statement block is never\
    \ executed.\n\nThis example decrements a variable value on each iteration of the\
    \ loop, and the counter increments until it reaches 10, when the evaluation is\
    \ false and the loop ends.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_47_0.png)\n\
    \n```\n<html><head><title>While Loop</title></head>\n<body>\n<?php\n$i = 0; $num\
