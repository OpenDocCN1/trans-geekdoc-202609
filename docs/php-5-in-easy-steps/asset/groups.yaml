    # Changing array element values


    PHP arrays are very versatile and each element can contain data of a different
    type.


    To demonstrate this feature, the following example creates an array that has three
    elements initially containing string values. These are written on the page using
    the dot operator to concatenate the element values into a single string.


    Next, new numeric values are assigned to each of the same three elements. The
    first element is assigned an integer value and the second gets a float value.
    The total of these is assigned to the third element with the help of the + addition
    operator. Finally, the elements'' new values are written out on the page.


    ![](img/7faa63a7fa0add8f53300594ebae949f_54_0.png)


    ```

    <html><head><title>Changing array values</title></head>

    <body>

    <?php

    # create an array containing 3 strings

    $arr = array("Red \ "Green", "Blue\ );


    echo($arr[0] . $arr[1] . $arr[2] . "<hr>");


    #assign new numeric values

    $arr[0] = 44;

    $arr[1] = 12.5;

    $arr[2] = $arr[0] + $arr[1];


    echo("$arr[0] + $arr[1] = $arr[2]");

    </body></html>

    ```


    ![](img/7faa63a7fa0add8f53300594ebae949f_54_1.png)


    ![](img/7faa63a7fa0add8f53300594ebae949f_54_2.png)


