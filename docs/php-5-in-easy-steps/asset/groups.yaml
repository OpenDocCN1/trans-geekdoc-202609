    # Cookies or sessions?


    Cookies are the optimal method for maintaining data with PHP, and it is extremely
    simple to store the data with the set_cookie() function. Cookies are perhaps easier
    to use sessions.


    Unfortunately, cookies require the co-operation of the user''s browser in allowing
    cookies to be stored on the client system. As concerns about privacy and security
    become heightened with increasing fear of computer viruses, more users than ever
    are becoming reluctant to allow cookies on their systems. This prevents you from
    using cookies to store data for PHP routines.


    Some of the newly emerging mobile devices that can access the Internet may not
    even have the capacity to store cookies.


    On the other hand, storing data in session variables does not rely upon the user''s
    browser settings, so is far more reliable than using cookies. You just have to
    remember to append the SID session identifier onto each URL in hyperlinks, and
    to call the session_start() function at the beginning of each page.


    Changing the PHP configuration can even remove the need to call session_start()
    manually on each page. In the session block of the phpinfo.php page is a directive
    "session.auto_start" that by default is set to off on installation.


    Open the php.ini file in a text editor and find the entry for session.auto_start.
    Change its value from 0 to 1 to turn this feature on. Now PHP will automatically
    perform the tasks of the session_start() function whenever a page gets loaded.


    With session.auto_start set to on, each of the three calls to the session_start()
    function in the last example can be removed – and the preference data is still
    maintained as the user navigates between the pages.


    Overall it may be better to use sessions rather than cookies, especially to store
    critical data, such as the selected shopping cart items on an e-commerce website.


    Sessions ensure that stored data will be available across the entire website,
    even in those browsers where cookies are not enabled, but this will use more resources
    to store the data.


    ![](img/7faa63a7fa0add8f53300594ebae949f_113_0.png)


    # Sending email with PHP


    This chapter features a feedback form on a web page, where visitors can enter
    comments, which will automatically be sent to a specified email address by PHP.
    Examples demonstrate how to send plain text messages, HTML-formatted messages
    and emails with attachments. Error checking is added to prevent the submission
    of incomplete forms.


    # Covers


    - Enabling PHP email | 114

    - Creating a feedback form | 115

    - Sending plain text email | 116

    - Sending HTML email | 118

    - Creating an attachment form | 120

    - Sending attachments with email | 122

    - Adding error-checking | 124

    - Validating email address formats | 126


    # Enabling PHP email


    PHP must be configured correctly in the php.ini file with the details of how your
    system sends email. Open php.ini in a text editor, then find the section headed
    "[mail function]".


    Windows users should ensure that two directives are supplied: the first is called
    SMTP (Simple Mail Transfer Protocol) and defines your email server address; the
    second is called sendmail_from and defines your own email address.


    The configuration for Windows should look something like this:


    ![](img/7faa63a7fa0add8f53300594ebae949f_115_0.png)


    ```

    [mail function]

    ; For win32 only.

    SMTP = smtp.ntworld.com


    ; For win32 only.

    sendmail_from = user@ntworld.com

    ```


    ![](img/7faa63a7fa0add8f53300594ebae949f_115_1.png)


    Linux users simply need to let PHP know the location of their sendmail application.
    The path, and any desired switches, should be specified to the "sendmail_path"
    directive.


    The configuration for Linux should look something like this:


    ![](img/7faa63a7fa0add8f53300594ebae949f_115_2.png)


    ```

    ; For Unix only. You may supply arguments as well

    (default: ''sendmail -t -i'').

    sendmail_path = sendmail -t -i

    ```


    # Creating a feedback form


    The feedback form shown below is used to submit user data by email throughout
    this chapter. It is a HTML page containing a form with three input fields named
    "username", "email" and "comments". The form submits their values to the form
    handler (feedback.php) shown on the next page.


    ![](img/7faa63a7fa0add8f53300594ebae949f_116_0.png)


    ```html

    <html>

    <head><title>Feedback Form</title></head>

    <body>

    <form action="feedback.php" method="post">

    Name:<input type="text" name="username" size="30">

    <br>

    Email:<input type="text" name="email" size="30">

    <br>

    <textarea name="comments" cols="5" rows="5"></textarea><br>

    <input type="submit" value="Send Form">

    </form>

    </body>

    </html>

    ```

    feedback.html


    ![](img/7faa63a7fa0add8f53300594ebae949f_116_1.png)


    # Sending plain text email


    The mail() function makes it easy to send email from scripts. This function requires
    three mandatory arguments to specify the recipient''s email address, the subject
    of the message, and finally the message itself. So the mail() syntax looks like
    this:


    ```php

    mail(to, subject, message);

    ```


    As soon as the mail() function is called, PHP will attempt to send the email,
    and return true if it was successful, or false if it failed.


    Multiple recipients can be specified by using a comma-separated list as the first
    argument to the mail() function.


    The example that follows is a form handler for the feedback form created on the
    previous page. It assigns the recipient''s address and a subject to two variables.
    The user''s entry into the feedback form''s textarea is assigned to a third variable.
    These variables are then specified as the three arguments to the mail() function
    when it is called to send the email.


    ![](img/7faa63a7fa0add8f53300594ebae949f_117_0.png)


    ```php

    <?php

    $username = $_POST[''username'']; // assignment value

    $email = $_POST[''email'']; // assignment value

    $comments = $_POST[''comments'']; // assignment value


    $to = "recipient@example.com"; // recipient

    $re = "Website Feedback"; // subject

    $msg = $comments; // message

    mail($to, $re, $msg); // send mail

    ?>


    ```html

    <html>

    <head><title>Message Received</title></head>

    <body>

    <h3>Thanks for your comments</h3>

    Message received from <?php echo ($username); ?>

    <br>

    Reply to <?php echo ($email); ?>

    </body>

    </html>

    ```


    # ...cont''d


    The user’s entries into "username" and "email" fields of the feedback form are
    used to display a confirmation that the message has been received.


    ![](img/7faa63a7fa0add8f53300594ebae949f_118_0.png)


    The email message is sent to the address specified as the first argument to the
    mail() function. Its subject is specified by the second argument. The actual message
    is specified by the third argument, as illustrated below:


    ![](img/7faa63a7fa0add8f53300594ebae949f_118_1.png)


    Notice that the sender of this message is specified to the sendmail_from directive
    in the php.ini file – not the user’s email address.


    ![](img/7faa63a7fa0add8f53300594ebae949f_118_2.png)


    # Sending HTML email


    The PHP mail() function can be used to specify a string of extra headers to be
    sent with emails. Each header must be separated by "\r\n" – representing a carriage
    return and a newline.


    The following example illustrates additions to the feedback handler to allow HTML
    formatting by setting the "Content-type:text/html".


    It assigns the email address entered by the user, in the "email" form field, to
    the "From" header. Also, the "Cc:" header is given a second address to which a
    copy should go. Note that the Cc header is case-sensitive—Cc or cc are incorrect.


    ![](img/7faa63a7fa0add8f53300594ebae949f_119_0.png)


    All header information is contained in the $headers variable, which is specified
    as the fourth argument to the mail() function.


    When a form is submitted, the header information and the message are sent; then
    a confirmation, which one, is displayed.


    ![](img/7faa63a7fa0add8f53300594ebae949f_119_1.png)


    ```php

    <?php

    $username = $_POST[''username'']; // assignment value

    $email = $_POST[''email'']; // assignment value

    $comments = $_POST[''comments'']; // assignment value

    $to = "recipient@example.com"; // recipient

    $re = "Website Feedback"; // subject

    $msg = $comments; // message

    $headers = "MIME-Version: 1.0\r\n"; // html headers

    $headers .= "Content-type: text/html\r\n";

    $headers .= "charset=iso-8859-1\r\n";

    $headers .= "From: $email\r\n"; // from

    $headers .= "Cc: another@example.com\r\n"; // cc

    mail($to, $re, $msg, $headers); // send mail

    ?>

    <html>

    <head><title>Message Received</title></head>

    <body>

    <h3>Thanks for your comments</h3>

    Message received from <?php echo ($username); ?>

    <br>

    Reply to <?php echo ($email); ?>

    </body>

    </html>

    ```

