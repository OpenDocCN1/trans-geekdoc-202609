    );\n\n#选择指定的数据库\n$rs = mysql_select_db(\"my_database\", $conn) or die(\"Could\
    \ not select database\");\n\n#创建 SQL 查询\n$sql = \"select * from users\";\n\n#执行查询\n\
    $rs = mysql_query( $sql, $conn) or die(\"Could not execute query\");\n\n#开始为用户详细信息构建\
    \ HTML 表格\n$list = \"<table border=\\\"1\\\" cellpadding=\\\"2\\\">\";\n$list\
    \ .= \"<tr><th>First Name</th>\";\n$list .= \"<tr><th>Last Name</th>\";\n$list\
    \ .= \"<tr><th>User Name</th>\";\n$list .= \"<tr><th>Password</th></tr>\";\n```\n\
    \nget_users.php\n\n# 续\n\n```php\n# 遍历 users 数据库表的每一行\nwhile ($row = mysql_fetch_array(\
    \ $rs )) {\n    $list .= \"<tr>\";\n    $list .= \"<td>\".$row['first_name'].\"\
    </td>\";\n    $list .= \"<td>\".$row['last_name'].\"</td>\";\n    $list .= \"\
    <td>\".$row['user_name'].\"</td>\";\n    $list .= \"<td>\".$row['password'].\"\
    </td>\";\n    $list .= \"</tr>\";\n}\n$list = \"</table>\";\n\n# 输出列表\necho $list;\n\
    \n?>\n</body></html>\n```\n\n![](img/7faa63a7fa0add8f53300594ebae949f_162_0.png)\n\
    \n注意 `password()` 函数创建了一个 16 位的十六进制数。\n\n![](img/7faa63a7fa0add8f53300594ebae949f_162_1.png)\n\
