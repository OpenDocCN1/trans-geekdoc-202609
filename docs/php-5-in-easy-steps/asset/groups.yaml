    # String manipulation


    This example demonstrates how strings can be manipulated using some of PHP’s string
    functions. The function name is sent to the server, when the form is submitted,
    as the value associated with the key "fcn".


    ![](img/7faa63a7fa0add8f53300594ebae949f_73_0.png)


    ```

    <html><head><title>String Manipulation</title> </head>

    <body>

    <form action="strings.php" method="post">

    <b>Enter some text here:</b> <br>

    <textarea name="txt" rows="3" cols="45"></textarea>

    <input type="radio" name="fcn" value="strlen">

    Find the text length

    <input type="radio" name="fcn" value="strrev">

    Reverse the text<br>

