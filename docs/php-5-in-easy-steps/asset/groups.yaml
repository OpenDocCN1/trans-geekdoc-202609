    ?>\n```\n\n![](img/7faa63a7fa0add8f53300594ebae949f_91_1.png)"
  md: "\n# Opening & closing files\n\nThe PHP fopen() function is used to read text\
    \ from files, write text to files and append text to files. It requires two arguments:\
    \ the file name and a mode in which to operate.\n\nFile modes can be specified\
    \ as one of the six options in this table:\n\n| Mode | Purpose |\n|---|---|\n\
    | r | Opens the file for reading only. Places the file pointer at the beginning\
    \ of the file |\n| r+ | Opens the file for reading and writing. Places the file\
    \ pointer at the beginning of the file |\n| w | Opens the file for writing only.\
    \ Places the file pointer at the beginning of the file and truncates the file\
    \ to zero length. If the file does not exist this will attempt to create it |\n\
    | w+ | Opens the file for reading and writing. Places the file pointer at the\
    \ beginning of the file and truncates the file to zero length. If the file does\
    \ not exist this will attempt to create it |\n| a | Opens the file for writing\
    \ only. Places the file pointer at the end of the file. If the file does not exist\
    \ this will attempt to create it |\n| a+ | Opens the file for reading and writing.\
    \ Places the file pointer at the end of the file. If the file does not exist this\
    \ will attempt to create it |\n\n![](img/7faa63a7fa0add8f53300594ebae949f_86_0.png)\n\
    \nIf an attempt to open a file fails, fopen() returns a value of false, otherwise\
    \ it returns a file pointer that references the file. After making changes to\
    \ the opened file, it is important to close it with the fclose() function to disconnect\
    \ the file pointer. The fclose() function requires the file pointer as its argument\
    \ and returns true when the closure succeeds or false when it fails.\n\nThe example\
    \ on the next page demonstrates how to open a file, read the file, then close\
    \ the file correctly.\n\n# Reading a file\n\nA file can be opened with the fopen()\
    \ function, which requires two arguments specifying the file name and one of the\
    \ file modes listed on the previous page. The fopen() function returns a file\
    \ pointer that references the file and can be used to read the file's contents.\n\
    \nThe file can then be read with a function called fread(), which also requires\
    \ two arguments: the file pointer, and the length of the file in bytes.\n\nThe\
    \ file's length can be found using the filesize() function, which takes the file\
    \ name as its argument and returns the size of the file expressed in bytes.\n\n\
    So the technique to read a file with PHP follows this pattern:\n\n- open the file\
    \ using fopen()\n- get the file's length with filesize()\n- read the file's contents\
    \ using fread()\n- close the file with fclose()\n\nThe following example assigns\
    \ the contents of a text file to a variable, then displays those contents on the\
    \ page.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_87_0.png)\n\n```html\n<html><head><title>Reading\
    \ a file</title></head>\n<body>\n<?php\n$filename = \"quote.txt\";\n$file = fopen($filename,\
