  - "[PAGE 57]\n\n# Adding & removing array elements\n\nAdditional elements can be\
    \ created at the beginning of an array using the array_unshift() function, and\
    \ elements can be added at the end of an array with the array_push() function.\
    \ Each requires the array name followed by the element data as its arguments.\n\
    \nIn the example below, an array is created with three elements. Two more elements\
    \ are added at the beginning of the array, then two further elements are added\
