    \n![](img/7faa63a7fa0add8f53300594ebae949f_175_0.png)\n\n![](img/7faa63a7fa0add8f53300594ebae949f_175_1.png)\n\
    \n![](img/7faa63a7fa0add8f53300594ebae949f_175_2.png)\n\n除非在文件名之前指定了路径，否则文本文件将在当前目录创建，例如\
    \ > C:\\guestbook.txt\n\nPHP 5 快速入门\n\n# PHP 与 XML\n\n本章演示了如何将 PHP 与 XML 文档配合使用。它展示了如何选择性地提取数据并输出到网页浏览器，以及\
    \ PHP 脚本如何向 XML 文档添加数据。\n\n# 目录\n\n- 介绍 XML | 176\n- 从 DOM 读取 | 178\n- 写入 DOM\
    \ | 180\n- 使用 XPath 查询 | 182\n- 使用 SimpleXML | 184\n- 更多 PHP 资源 | 186\n\n# 介绍\
    \ XML\n\nPHP 5 版本引入了对面向对象编程的增强支持，并对日益重要的 XML（可扩展标记语言）提供了全新的支持功能。现在它的 XML 支持完全符合\
    \ W3C 标准——这与之前的版本不同。\n\nPHP 5 根据 W3C 标准支持 DOM（文档对象模型）和 XPath 查询语言。它还包含了 PHP 特有的“SimpleXML”扩展。本章提供了\
    \ DOM、XPath 和 SimpleXML 的示例。\n\nXML 是一种流行的数据存储方式，采用了严格的语法。它看起来非常像 HTML，包含标签、属性和值，但\
    \ XML 没有预定义的标签，也不用于创建网页。相反，XML 让你创建自己的标记并定义这些标记。在 XML 中，每个起始标签必须有一个匹配的结束标签，且必须正确嵌套。满足这些要求的\
    \ XML 文档被称为“良好的”（well-formed）。应用程序处理良好数据的优势在于，它们不允许错误的语法——这与处理 HTML 文档的浏览器不同。\n\
    \n所有 XML 文档都以声明标签开头，宣布文档使用的是 XML。这通常包含描述版本和字符编码的属性，如下：\n\n```\n<?xml version=\"\
    1.0\" encoding=\"iso-8859-1\"?>\n\n```指定该文档是用 XML 1.0 版本编写的。所有 XML 文档必须有一个包含所有其他标签的主标签。这个标签被称为“root”（根）元素。![](img/7faa63a7fa0add8f53300594ebae949f_177_0.png)\n\
    \n```\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<root>\n  <greeting>Hello World</greeting>\n\
    </root>\n```\n\n# ...续\n\n在对应的良好的 XML 文档 hello.xml 中，根元素实际名为“root”。名为“greeting”的嵌套元素包含“Hello\
    \ World”文本内容。\n\n在实践中，大多数 XML 文档包含许多标签来描述数据。例如，下方列出的 books.xml 文档描述了一些书籍。在“books”根元素内，每个“title”元素包含“topic”的嵌套标签、“series”名称以及名为“pic”的内容。![](img/7faa63a7fa0add8f53300594ebae949f_178_0.png)\n\
    \n```\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<books>\n  <title>\n    <topic>JavaScript</topic>\n\
    \    <series>in easy steps</series>\n    <pic>js.gif</pic>\n  </title>\n  <title>\n\
    \    <topic>C++ Programming</topic>\n    <series>in easy steps</series>\n    <pic>c++.gif</pic>\n\
    \  </title>\n  <title>\n    <topic>HTML</topic>\n    <series>in easy steps</series>\n\
    \    <pic>html.gif</pic>\n  </title>\n  <title>\n    <topic>SQL</topic>\n    <series>in\
    \ easy steps</series>\n    <pic>sql.gif</pic>\n  </title>\n</books>\n```\n\n![](img/7faa63a7fa0add8f53300594ebae949f_178_1.png)\n\
    \n> 提示：在网络浏览器（如 Internet Explorer）中打开 XML 文档，如果文档是良好的，将显示树状结构的标签；否则，错误消息会指示原因。\n\
    \n本章的一些示例使用了此 XML 文档来演示 PHP 5 的特性。\n\n# 从 DOM 读取\n\nPHP 5 内置了对 W3C 标准指定的文档对象模型（DOM）的支持。这提供了一个包含预定义变量和方法（或函数）的“DomDocument”模板类。\n\
    \n在 PHP 脚本可以使用“new”关键字创建 DomDocument 对象，将类的实例赋值给变量。例如，`$dom = new DomDocument;`\
    \ 在 `$dom` 变量中创建一个 DomDocument 对象。\n\n可以使用特殊的类运算符“->”来引用对象的属性和方法。例如，DomDocument\
    \ 对象有一个 `load()` 方法来加载 XML 文件，因此 `$dom -> load(\"books.xml\")` 将数据从文件“books.xml”加载到\
    \ `$dom` 对象中。\n\nXML 文档的每个元素都被描述为“node”（节点）。\n\n可以使用 DomDocument 的“documentElement”属性访问\
    \ XML 文档的根元素，并从其固有的“nodeName”部分引用其标签名。例如，`$dom -> documentElement -> nodeName`。\n\
    \n可以使用 DomDocument 的“getElementsByTagName() 方法访问 XML 文档的特定嵌套元素，该方法将所需的名称作为参数。此方法返回一个“NodeList”，脚本可以使用\
    \ `foreach()` 函数轻松地遍历它。可以使用 PHP 提供的“textContent”属性引用每个节点的文本数据。\n\n`textContent`\
    \ 属性并非真正的 W3C 标准——它是 PHP 的便利属性，用于快速访问元素的所有文本节点。\n\n脚本创建一个 DomDocument 对象，然后加载“books.xml”文档（列在上一页）。它继续生成\
    \ HTML 输出，说明 XML 文档的根元素名称以及所有“topic”元素内包含的文本列表。\n\n![](img/7faa63a7fa0add8f53300594ebae949f_179_0.png)\n\
    \n# ...续\n\n```\n<html><head><title>Read DOM</title></head><body>\n```\n\n```php\n\
    <?php\n\n# 加 XML 文档到 DOM\n$dom = new DomDocument();\n$dom -> load(\"books.xml\"\
    );\n\n# 打印根元素名称\necho(\"Root element name is: \");\necho($dom -> documentElement\
    \ -> nodeName);\necho(\"<hr>\");\n\n## 打印所有主题列表\necho(\"Topics include:<ul>\"\
    );\n$topics = $dom -> getElementsByTagName(\"topic\");\nforeach($topics as $node)\
    \ {\n\techo(\"<li>\" . $node -> textContent . \"</li>\");\n}\necho(\"</ul>\");\n\
    \n?>\n\n</body>\n```\n\n"
