    # Logical operators


    The table below lists the PHP logical operators:


    | Operator | Operation |

    | --- | --- |

    | && | Logical AND |

    | and | Logical AND |

    | || | Logical OR |

    | or | Logical OR |

    | xor | Logical exclusive XOR |

    | ! | Logical NOT |


    The logical operators are used with operands that have the boolean values of true
    or false, or are values that can convert to true or false.


    The logical "&&" and "and" operators will evaluate two operands and return true
    only if both operands themselves are true. Otherwise they will return false. This
    is typically used in conditional branching, where the direction of a script is
    determined by testing two conditions: If both conditions are satisfied the script
    will go in a certain direction, otherwise it will take a different direction.


    The "||" and "or" operators will evaluate two operands and return true if either
    of the operands returns true. If neither operand returns true they will return
    false. This is useful to perform an action if either one of two test conditions
    is met.


    The "xor" operator will evaluate its two operands and return true only if either
    of the operands itself true but not both.


    The "!" logical not is a unary operator that is used before a single operand.
    It returns the inverse value of the given operand – so if a variable "a" has a
    value of true then "!a" would have a value of false. This is useful in PHP scripts
    to toggle the value of a variable in successive loop iterations with a statement
    a=! This will ensure that on each pass the value is changed, like flickering a
    light switch on and off.'
