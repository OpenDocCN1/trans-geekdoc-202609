    # ...cont''d


    The setcookie() function sets just one cookie at a time and requires up to six
    arguments. These are described in the following list, in the order in which they
    must appear:


    +   **Name** - This sets the name of the cookie and is stored in a PHP environment
    variable array called $_COOKIE[]. The cookie can be referenced by inserting the
    cookie name within quotes inside the square brackets.


    +   **Value** - This sets the value of the named variable and is the content that
    you want to store.


    +   **Expiry** - This specifies a future time, in seconds since 00:00:00 GMT on
    January 1st, 1970, at which the cookie will become inaccessible. If this argument
    is not set, the cookie will automatically expire when the web browser is closed.


    +   **Path** - This specifies the server directories for which the cookie is valid.
    A single forward slash permits the cookie to be valid for all directories. If
    a directory is specified, the cookie is valid only within that directory.


    +   **Domain** - This can be used to specify the domain name, and must contain
    at least two periods to be valid. If this argument is not specified, the default
    value is the host of the server that created the cookie. All cookies are valid
    only for the host and domain that created them.


    ![](img/7faa63a7fa0add8f53300594ebae949f_100_0.png)


    The setcookie() function can be used with an expiry date in the past to delete
    a


    cookie.


    ![](img/7faa63a7fa0add8f53300594ebae949f_100_1.png)


    The expiry and security arguments must be integer values.


    Other arguments can be replaced with an empty string if they are not to be explicitly
    set.


    +   **Security** - This can be set to 1 to specify that the cookie should be sent
    only by secure transmission using HTTPS, otherwise (if set to 0) the cookie can
    be set by regular HTTP.


    All arguments except the name argument are optional. If only the name argument
    is present, the cookie with that name will be deleted from the user''s computer.


    The expiry is easily set by adding a number of seconds onto the current time,
    retrieved using the PHP time() function. Each of these examples set a cookie named
    "ID", with a value of "X12345", to expire 24 hours after it is generated:


    ```

    cookie("ID", "X12345", time()+86400 , "/", " ", 0);

    cookie("ID", "X12345", time()+86400 );

    ```


