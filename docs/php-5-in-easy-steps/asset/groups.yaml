  - '[PAGE 86]


    # Opening & closing files


    The PHP fopen() function is used to read text from files, write text to files
    and append text to files. It requires two arguments: the file name and a mode
    in which to operate.


    File modes can be specified as one of the six options in this table:


    | Mode | Purpose |

    |---|---|

    | r | Opens the file for reading only. Places the file pointer at the beginning
    of the file |

    | r+ | Opens the file for reading and writing. Places the file pointer at the
    beginning of the file |

    | w | Opens the file for writing only. Places the file pointer at the beginning
    of the file and truncates the file to zero length. If the file does not exist
    this will attempt to create it |

    | w+ | Opens the file for reading and writing. Places the file pointer at the
    beginning of the file and truncates the file to zero length. If the file does
    not exist this will attempt to create it |

    | a | Opens the file for writing only. Places the file pointer at the end of the
    file. If the file does not exist this will attempt to create it |

    | a+ | Opens the file for reading and writing. Places the file pointer at the
    end of the file. If the file does not exist this will attempt to create it |


    ![](img/7faa63a7fa0add8f53300594ebae949f_86_0.png)


    If an attempt to open a file fails, fopen() returns a value of false, otherwise
    it returns a file pointer that references the file. After making changes to the
    opened file, it is important to close it with the fclose() function to disconnect
    the file pointer. The fclose() function requires the file pointer as its argument
    and returns true when the closure succeeds or false when it fails.


    The example on the next page demonstrates how to open a file, read the file, then
    close the file correctly.'
  - '[PAGE 87]


    # Reading a file


    A file can be opened with the fopen() function, which requires two arguments specifying
    the file name and one of the file modes listed on the previous page. The fopen()
    function returns a file pointer that references the file and can be used to read
    the file''s contents.


    The file can then be read with a function called fread(), which also requires
    two arguments: the file pointer, and the length of the file in bytes.


    The file''s length can be found using the filesize() function, which takes the
    file name as its argument and returns the size of the file expressed in bytes.


    So the technique to read a file with PHP follows this pattern:


    +   - open the file using fopen()

    - get the file''s length with filesize()

    - read the file''s contents using fread()

    - close the file with fclose()


    The following example assigns the contents of a text file to a variable, then
    displays those contents on the page.


    ![](img/7faa63a7fa0add8f53300594ebae949f_87_0.png)


    ```

    <html<head><title>Reading a file</title></head>

