    \n> HOT TIP Opening a XML document in a web browser, such as Internet Explorer,\
    \ displays the tags in “tree” if the document is well-formed. Otherwise, an error\
    \ message indicates the cause of the error.\n\nThis XML document is used by some\
    \ examples in this chapter to demonstrate support features in PHP 5.\n\n# Reading\
    \ from the DOM\n\nPHP 5 has built-in support for the Document Object Model (DOM)\
    \ as specified by the W3C standard. This provides a “DomDocument” template class\
    \ containing predefined variables and methods (or functions).\n\nA DomDocument\
    \ object can be created in a PHP script using the “new” keyword to assign an instance\
    \ of the class to a variable. For example, $dom = new DomDocument creates a DomDocument\
    \ object in the $dom variable.\n\nThe variable properties and the methods of an\
    \ object can be referenced using the special class operator “->”. For instance,\
    \ the DomDocument object has a load() method to load an XML file, so that $dom\
    \ -> load(“books.xml”) loads the data from the file “books.xml” into the $dom\
