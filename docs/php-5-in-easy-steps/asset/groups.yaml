    throughout this chapter. It is a HTML page containing a form with three input
    fields named "username", "useraddr" and "comments". The form submits their values
    to the form handler (feedback.php) shown on the next page.


    ![](img/7faa63a7fa0add8f53300594ebae949f_116_0.png)


    ```

    <html>

    <head><title>Feedback Form</title> </head>

