  - '[PAGE 187]


    # More PHP resources


    This book will, hopefully, have provided you with a great introduction to PHP
    server-side scripting, and may have inspired you with some of PHP''s creative
    possibilities.


    The many PHP functions used in the examples book are, in fact, just a small selection
    from the hundreds of functions that are available in the PHP scripting language.
    To see the entire range of functions, and to go further with PHP, it is recommended
    that you now download the PHP manual from www.php.net/download-docs.php.


    ![](img/7faa63a7fa0add8f53300594ebae949f_187_0.png)


    The manual is available in several languages and many formats, including HTML,
    PDF and Windows HLP format. It is very comprehensive and has a section called
    Function Reference, which defines each function on its own page. These are grouped
    under topic headings and may contain examples illustrating how they can be used
    in a PHP script.


    ![](img/7faa63a7fa0add8f53300594ebae949f_187_1.png)


    The PHP Builder Website at www.phpbuilder.com is a terrific resource offering
    articles about PHP. This site also has several forums where help can be sought
    on PHP scripting. Some source code is available for free download and you can
    even access the PHP manual online there.


    Another great online resource is the PHP Resource Index at http://php.resourceindex.com.
    This site has lots of useful code snippets and offers hundreds of complete PHP
    scripts – although not all of these are available free.


    The site''s Documentation section contains examples and tutorials with lots of
    handy tips. The Frequently Asked Questions (FAQ) pages can be scoured for previous
    answers to PHP questions.


    In the Community section there are links to many PHP-related bulletin boards on
    the Internet where you can find other PHP developers. There is information about
    PHP mailing lists, development tools, user groups and lots more.


    The huge popularity of PHP, as a scripting language especially suited to web development,
    ensures its continuing success – happy scripting with PHP!'
  md: "\n# Writing to the DOM\n\nThe DOMDocument object includes methods to manipulate\
    \ write to the DOM. New elements can be created with the `createElement()` method\
    \ and text content can be inserted with the `createTextNode()` method. Each text\
    \ node is added to its surrounding element, and each element added to its higher-level\
    \ element, with the `appendChild()` method.\n\nThis example adds a complete new\
    \ book to those in books.xml and creates a new, enlarged XML document using the\
    \ `save()` method.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_181_0.png)\n\n\
    ```php\n<?php\n$dom = new DOMDocument();\n$dom -> load(\"books.xml\");\n\n# create\
    \ elements\n$title = $dom -> createElement(\"title\");\n$topic = $dom -> createElement(\"\
    topic\");\n$series = $dom -> createElement(\"series\");\n$pic = $dom -> createElement(\"\
    pic\");\n\n# create text nodes\n$topictext = $dom -> createTextNode(\"Linux\"\
    );\n$seriestext = $dom -> createTextNode(\"in easy steps\");\n$pictext = $dom\
    \ -> createTextNode(\"linux.gif\");\n\n# append the text nodes to the inner nested\
    \ elements\n$topic -> appendChild($topictext);\n$series -> appendChild($seriestext);\n\
    $pic -> appendChild($pictext);\n\n# append the inner nested elements to the <title>\
    \ element\n$title -> appendChild($topic);\n$title -> appendChild($series);\n$title\
    \ -> appendChild($pic);\n\n# now append the <title> element to the root element\n\
    $dom -> documentElement -> appendChild($title);\n\n# create a new enlarged XML\
    \ document\n$dom -> save(\"newbooks.xml\");\n\n?>\n```\n\n# ...cont'd\n\nOpening\
    \ the new XML document in a web browser confirms that each new element has been\
    \ correctly added, nested inside the root element. They appear after the final\
    \ original “title” element, with the appropriate specified text content inserted\
    \ as excerpt.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_182_0.png)\n\nAlthough\
    \ this example saves the changes in a new document, the DOM can be manipulated\
    \ \"on the fly\" and new elements accessed dynamically.\n\n```xml\nhttp://localhost/newbooks.xml\n\
    <?xml version=\"1.0\" encoding=\"iso-8859-1\" ?>\n<books>\n  <title>\n    <topic>JavaScript</topic>\n\
    \    <series>in easy steps</series>\n    <pic>js.gif</pic>\n  </title>\n  <title>\n\
    \    <topic>C++ Programming</topic>\n    <series>in easy steps</series>\n    <pic>c+++.gif</pic>\n\
    \  </title>\n  <title>\n    <topic>HTML</topic>\n    <series>in easy steps</series>\n\
    \    <pic>html.gif</pic>\n  </title>\n  <title>\n    <topic>SQL</topic>\n    <series>in\
    \ easy steps</series>\n    <pic>sql.gif</pic>\n  </title>\n  <title>\n    <topic>Linux</topic>\n\
    \    <series>in easy steps</series>\n    <pic>linux.gif</pic>\n  </title>\n</books>\n\
    ```\n\n![](img/7faa63a7fa0add8f53300594ebae949f_182_1.png)\n\n# Querying with\
    \ XPath\n\nXPath allows you to query an XML document for specific nodes matching\
    \ particular criteria. This is far more powerful than the `getElementsByTagName()`\
    \ method, which simply returns a DomNodeList of all elements having the specified\
    \ name. For instance, the XML document food.xml (listed below), a call to `getElementsByTagName(\"\
    item\")` would return all the \"item\" child elements of \"fruit\" and \"veg\"\
    \ elements.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_183_0.png)\n\n```xml\n\
    <?xml version = \"1.0\" encoding = \"iso-8859-1\" ?>\n<fruit>\n  <item id=\"1\"\
    >Apple</item>\n  <item id=\"2\">Banana</item>\n  <item id=\"3\">Cherry</item>\n\
    </fruit>\n<veg>\n  <item>Lettuce</item>\n  <item>Onion</item>\n</veg>\n<food>\n\
    ```\n\nXPath, however, can return specific elements.\n\nTo start using XPath in\
    \ PHP 5, a DomXPath object must first be created using the \"new\" keyword and\
    \ stating the name of the loaded DomDocument as its parameter. The DomXPath object\
    \ is assigned to a variable in the same manner as with a new DomDocument object.\n\
    \n![](img/7faa63a7fa0add8f53300594ebae949f_183_1.png)\n\nSignificantly, the DomXPath\
    \ object has a `query()` method that returns a DomNodeList of those nodes matching\
    \ the criteria specified as its parameter. The simplest query specifies the path\
    \ to a particular element, such as \"food/fruit/item\".\n\nThe PHP script listed\
    \ opposite assigns a DomXPath object to a variable called \"$xp\". Its `query()`\
    \ method is used to return a DomNodeList of all \"item\" nodes within the \"fruit\"\
    \ element. Their textContent is then written out in a HTML list.\n\n# cont'd\n\
    \n![](img/7faa63a7fa0add8f53300594ebae949f_184_0.png)\n\n```html\n<html><head><title>XPath\
    \ DOM Query</title></head><body>\n<?php\n#load the XML document into the DOM\n\
    $dom = new DomDocument();\n$dom -> load(\"food.xml\");\n\n#create an XPath object\n\
    $xp = new DomXPath($dom );\n\n#print a list of all fruit items\necho (\"Fruit\
    \ items are:<ul>\" );\n$fruits = $xp -> query(\"/food/fruit/item\");\nforeach($fruits\
    \ as $node) {\necho(\"<li>\" . $node -> textContent .\"</li>\"; }\necho(\"</ul>\"\
    );\n?>\n</body></html>\n```\n\n# XPath DOM Query\n\n| File Edit | View | Favorites\
    \ | Tools | Help |\n|---|---|---|---|---|\n| Address: http://localhost/xpath-query.php\
    \ | Go | | | |\n\nFruit items are:\n\n- Apple\n- Banana\n- Cherry\n\nThis is just\
    \ a simple example. Further query possibilities might be:\n\n- /food/fruit/item[position()=1]\
    \ returns the first\n- /food/fruit/item[@id='2'] returns the item with id 2\n\
    - /food/veg/item returns all items in veg\n\n# Using SimpleXML\n\nThe SimpleXML\
    \ extension provides an easy way to work with XML data. It allows you to treat\
    \ XML elements as objects that can be accessed using properties. To load an XML\
    \ file, use the `simplexml_load_file()` function. This returns a SimpleXML object\
    \ that can be used to navigate the document.\n\n```php\n<?php\n$xml = simplexml_load_file(\"\
    books.xml\");\nforeach($xml->title as $title) {\n    echo \"Title: \" . $title\
    \ . \"\\n\";\n    echo \"Topic: \" . $title->topic . \"\\n\";\n    echo \"Series:\
    \ \" . $title->series . \"\\n\";\n    echo \"Pic: \" . $title->pic . \"\\n\";\n\
    \    echo \"-----------------\\n\";\n}\n?>\n```\n"
  mdcn: "\n\n# 写入 DOM\n\nDOMDocument 对象包含了用于操作写入 DOM 的方法。可以使用 `createElement()` 方法创建新元素，并使用\
    \ `createTextNode()` 方法插入文本内容。每个文本节点通过 `appendChild()` 方法添加到其周围的元素中，每个元素通过该方法添加到其更高层级的元素中。\n\
    \n此示例向 `books.xml` 中的书籍添加了一本完整的书，并使用 `save()` 方法创建一个新的、较大的 XML 文档。\n\n![](img/7faa63a7fa0add8f53300594ebae949f_181_0.png)\n\
    \n```php\n<?php\n$dom = new DOMDocument();\n$dom -> load(\"books.xml\");\n\n#\
    \ 创建元素\n$title = $dom -> createElement(\"title\");\n$topic = $dom -> createElement(\"\
    topic\");\n$series = $dom -> createElement(\"series\");\n$pic = $dom -> createElement(\"\
    pic\");\n\n# 创建文本节点\n$topictext = $dom -> createTextNode(\"Linux\");\n$seriestext\
    \ = $dom -> createTextNode(\"in easy steps\");\n$pictext = $dom -> createTextNode(\"\
    linux.gif\");\n\n# 将文本节点添加到内部嵌套元素中\n$topic -> appendChild($topictext);\n$series\
    \ -> appendChild($seriestext);\n$pic -> appendChild($pictext);\n\n# 将内部嵌套元素添加到\
    \ <title> 元素\n$title -> appendChild($topic);\n$title -> appendChild($series);\n\
    $title -> appendChild($pic);\n\n# 现在将 <title> 元素添加到根元素\n$dom -> documentElement\
    \ -> appendChild($title);\n\n# 创建一个新的较大的 XML 文档\n$dom -> save(\"newbooks.xml\"\
    );\n\n?>\n```\n\n# ...接上\n\n在网页浏览器中打开新的 XML 文档，可以确认每个新元素都已正确添加并嵌套在根元素内部。它们出现在最后一个原始“title”元素之后，并按照指定的适当文本内容作为摘要插入。\n\
    \n![](img/7faa63a7fa0add8f53300594ebae949f_182_0.png)\n\n尽管此示例将更改保存在新文档中，但 DOM\
    \ 可以进行“即时”操纵，并动态访问新元素。\n\n```xml\nhttp://localhost/newbooks.xml\n<?xml version=\"\
    1.0\" encoding=\"iso-8859-1\" ?>\n<books>\n  <title>\n    <topic>JavaScript</topic>\n\
    \    <series>in easy steps</series>\n    <pic>js.gif</pic>\n  </title>\n  <title>\n\
    \    <topic>C++ Programming</topic>\n    <series>in easy steps</series>\n    <pic>c+++.gif</pic>\n\
    \  </title>\n  <title>\n    <topic>HTML</topic>\n    <series>in easy steps</series>\n\
    \    <pic>html.gif</pic>\n  </title>\n  <title>\n    <topic>SQL</topic>\n    <series>in\
    \ easy steps</series>\n    <pic>sql.gif</pic>\n  </title>\n  <title>\n    <topic>Linux</topic>\n\
    \    <series>in easy steps</series>\n    <pic>linux.gif</pic>\n  </title>\n</books>\n\
    ```\n\n![](img/7faa63a7fa0add8f53300594ebae949f_182_1.png)\n\n# 使用 XPath 查询\n\n\
    XPath 允许你对 XML 文档查询符合特定标准的特定节点。这比 `getElementsByTagName()` 方法要强大得多，后者简单地返回所有具有指定名称元素的\
    \ DomNodeList。例如，对于 XML 文档 `food.xml`（如下所示），调用 `getElementsByTagName(\"item\"\
    )` 将返回 \"fruit\" 和 \"veg\" 元素中的所有 \"item\" 子元素。\n\n![](img/7faa63a7fa0add8f53300594ebae949f_183_0.png)\n\
    \n```xml\n<?xml version = \"1.0\" encoding = \"iso-8859-1\" ?>\n<fruit>\n  <item\
    \ id=\"1\">Apple</item>\n  <item id=\"2\">Banana</item>\n  <item id=\"3\">Cherry</item>\n\
    </fruit>\n<veg>\n  <item>Lettuce</item>\n  <item>Onion</item>\n</veg>\n<food>\n\
    ```\n\n然而，XPath 可以返回特定的元素。\n\n要在 PHP 5 中开始使用 XPath，必须先使用 \"new\" 关键字创建一个 DomXPath\
    \ 对象，并将加载的 DomDocument 名称作为其参数。DomXPath 对象以与创建新 DomDocument 对象相同的方式被赋值给变量。\n\n\
    ![](img/7faa63a7fa0add8f53300594ebae949f_183_1.png)\n\n显著的是，DomXPath 对象有一个 `query()`\
    \ 方法，可以返回符合其参数所指定标准的 DomNodeList。简单的查询指定了元素的路径，例如 \"fruit/item\"。\n\n`query()`\
    \ 方法用于返回 \"fruit\" 元素中所有 \"item\" 元素的 DomNodeList。下文列出的 PHP 脚本将 DomXPath 对象赋值给变量\
    \ \"$xp\"。它们的 textContent 然后以 HTML 列表的形式输出。\n\n# 接上文\n\n![](img/7faa63a7fa0add8f53300594ebae949f_184_0.png)\n\
    \n```html\n<html><head><title>XPath Query</title></head><body>\n<?php\n# 将 XML\
    \ 文档加载到 DOM\n$dom = new DomDocument();\n$dom -> load(\"food.xml\");\n\n# 创建 XPath\
    \ 对象\n$xp = new DomXPath($dom);\n\n# 输出所有 fruit item 的列表\necho (\"Fruit items\
    \ are:<ul>\" );\n$fruits = $xp -> query(\"/food/fruit/item\");\nforeach($fruits\
    \ as $node) {\necho(\"<li>\" . $node ->textContent .\"</li>\"); }\necho(\"</ul>\"\
    );\n?>\n</body></html>\n```\n\n# XPath DOM 查询\n\n| 文件 编辑 查看 收藏 工具 帮助 |\n|---|---|---|---|---|\n\
    | 地址: http://localhost/xpath-query.php | 转到 | | |\n\n水果项目：\n\n- Apple\n- Banana\n\
    - Cherry\n\n这只是一个简单的示例。进一步的查询可能包括：\n\n- /food/fruit/item[position()=1] 返回第一个\n\
    - /food/fruit/item[@id='2'] 返回 id 为 2 的项目\n- /food/veg/item 返回 veg 中的所有项目\n\n\
    # 使用 SimpleXML\n\nSimpleXML 扩展提供了处理 XML 数据的一种方法。它允许你将 XML 元素视为可以通过属性访问的对象。要加载\
    \ XML 文件，请使用 `simplexml_load_file()` 函数。它返回一个 SimpleXML 对象，可以用于导航文档。\n\n```php\n\
    <?php\n$xml = simplexml_load_file(\"books.xml\");\nforeach($xml->title as $title)\
    \ {\n    echo \"Title: \" . $title . \"\\n\";\n    echo \"Topic: \" . $title->topic\
    \ . \"\\n\";\n    echo \"Series: \" . $title->series . \"\\n\";\n    echo \"Pic:\
    \ \" . $title->pic . \"\\n\";\n    echo \"-----------------\\n\";\n}\n?>\n```\n\
    \n"
