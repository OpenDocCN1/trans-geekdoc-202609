    # SQL field modifiers


    In addition to specifying permissible data types when creating database columns,
    the modifiers described in the following table can optionally be stated to further
    control how a column should be used:


    | Modifier | Description |

    | --- | --- |

    | not null | Insists that each record must include data entry in this column |

    | unique | Insists that records may not duplicate any entry in this column |

    | auto_increment | Available only for numeric columns to automatically generate
    a number that is one more than the previous value in that column |

    | primary key() | Specifies as its argument the name of the column to be used
    as the primary key for that table. For example, primary key(id) |


    Modifiers could be included when creating the cars table on page 131 to produce
    a table with better defined columns. The "create table-name;" command shown in
    the MySQL monitor below automatically number the primary key id. Each record must
    now include data in the "make" and "model" columns, although no duplicate entries
    are permitted in the "model" column.


    ![](img/7faa63a7fa0add8f53300594ebae949f_134_0.png)


    ```

    MySQL Monitor

    mysql> use garage;

    Database changed

    mysql> create table cars(id int auto_increment,

    make varchar(20) not null,

    model varchar(20) not null unique,

    primary key(id));

    Query OK. 0 rows affected (0.00 sec)

    mysql> _

    ```'
  - '[PAGE 135]


    # # Inserting table data


    Once a table has been created in a MySQL database, data can be entered into it
    with the SQL “insert into” command. The syntax to enter a complete record across
    a row is:

    “insert into table-name values (value1, value2, value3);”


    The data values are entered as comma-separated arguments to the SQL values() function;
    the list must correspond to the number of table columns and each value must be
    of the correct data type.


    ![](img/7faa63a7fa0add8f53300594ebae949f_135_0.png)


    Enclose string data quotes when inserting data.


    ```

    MySQL Monitor

    insert into cars values(1, "Porsche", "Carrera");

    Query OK, 1 row affected (0,07 sec)


    insert into cars(make,model)

    values("Ferrari","Dino\("Lamborghini","Diablo");

    Query OK, 2 rows affected (0,00 sec)

    Records: 2 Duplicates: 0 Warnings: 0


    mysql select * from cars;

    +----+------+----------+

    | id | make      | Model    |

    +----+------+----------+

    | 1 | Porsche   | Carrera |

    | 2 | Ferrari  | Dino     |

    | 3 | Lamborghini| Diablo  |

    +----+------+----------+

    3 rows in set (0,00 sec)

    mysql>

    ```


    ![](img/7faa63a7fa0add8f53300594ebae949f_135_1.png)


    Notice that the id value for the second and third records has been generated automatically
    because column''s auto_increment modifier.


    Another way to insert data into a table is to specify the column names where the
    data is to be added as a comma-separated list, such as “insert into-name(column-name,
    column-name);”. The actual data to be inserted into the specified columns is then
    listed as the values() function arguments as usual.


    SQL instructions in the illustration use three methods to add records to the “cars”
    table created on the previous page.


    An entire table can be viewed with a SQL “select * from” command, followed by
    the name of the table, and the obligatory semi-colon. The example above uses this
    command to view the “cars” table.'
  - "[PAGE 136]\n\n# Altering an existing table\n\nThe definition of a column in an\
    \ existing table can be altered using the SQL commands “alter table” and “modify”,\
    \ with the following syntax:\n\nalter table table-name modify field-name modifiers;\n\
    \nNew columns can be added to an existing table using the same “alter table” command,\
    \ but now with the SQL “add” keyword. The syntax to add an extra column looks\
    \ like this:\n\nalter table table-name add field-name modifiers;\n\nThe example\
    \ shown in the MySQL monitor below uses the “alter table” command to add a new\
    \ extra column called “top_mph” to the cars table from the previous page. Data\
    \ can now be entered into the new column using the SQL “update” command, which\
    \ is demonstrated on the next page.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_136_0.png)\n\
    \nThe new top_mph column does not have “not null” modifier, so it is to enter\
    \ data here.\n\n```\nmysql> use garage;\nDatabase changed\nmysql> select * from\
    \ cars;\n+------+-----------+----------+\n| id | make      | model    |\n+------+-----------+----------+\n\
    | 1 | Porsche    | Carrera |\n| 2 | Ferrari    | Dino     |\n| 3 | Lamborghini|\
    \ Diablo  |\n+------+-----------+----------+\n3 rows in set (0.00 sec)\nmysql>\
    \ alter table cars add top_mph int;\nQuery OK, 3 rows affected (0,02 sec)\nRecords:\
    \ 3 Duplicates: 0 Warnings: 0\nmysql> select * from cars;\n+------+-----------+----------+----------+\n\
    | id | make      | model    | top_mph |\n+------+-----------+----------+----------+\n\
    | 1 | Porsche    | Carrera | NULL |\n| 2 | Ferrari    | Dino     | NULL |\n| 3\
    \ | Lamborghini| Diablo  | NULL |\n+------+-----------+----------+----------+\n\
    3 rows in set (0.00 sec)\nmysql> \n```"
  - '[PAGE 137]


    # Updating records


    All data values in an existing table column can be changed using the SQL `update`
    command with the SQL `set` keyword, like this:


    update table-name set field-name = new-value;

    More usefully, individual column values can be changed by adding a qualifier to
    this syntax with the SQL `where` keyword, like this:


    update table-name set field-name = new-value where id = int;


    This can be used in the "cars" table from the previous page to update the "model"
    and "top_mph" columns:


    ![](img/7faa63a7fa0add8f53300594ebae949f_137_0.png)


    Notice that id is used as the qualifier in these updates — except for the second
    and third instructions, which use the value of the column as their qualifier.


    ```

    MySQL Monitor

    mysql> update cars set model=911 Turbo where id=1;

    Query OK, 1 row affected (0,04 sec)

    Rows matched: 1 Changed: 1 Warnings: 0


    mysql> update cars set model="F355" where makes="Ferrari";nQuery OK, 1 row affected
    (0,00 sec)

    Rows matched: 1 Changed: 1 Warnings: 0


    mysql> update cars set model="Murcielargo"

    where makes="Lamborghini";nQuery OK, 1 row affected (0,00 sec)

    Rows matched: 1 Changed: 1 Warnings: 0


    mysql> update cars set top_mph=189 where id=2;

    Query OK, 1 row affected (0,00 sec)

    Rows matched: 1 Changed: 1 Warnings: 0


    mysql> update cars set top_mph=205 where id=3;

    Query OK, 1 row affected (0,00 sec)

    Rows matched: 1 Changed: 1 Warnings: 0


    mysql> select * from cars;

    +------------------------------------------------------+

    | id | make        | model          | top_mph      |

    +------------------------------------------------------+

    | 1  | Porsche       | 911 Turbo     | 189      |

    | 2  | Ferrari      | F355           | 183      |

    | 3  | Lamborghini  | Murcielargo    | 205      |

    +------------------------------------------------------+

    mysql> _

    ```'
  - '[PAGE 138]


    # Deleting data, tables & databases


    Records can be deleted from a table with the SQL “delete” command, followed by
    the table name. This needs to be used with some caution as the command “delete
    from cars; would remove all the records from the “cars” table instantly.


    Specific records can be deleted from a table by adding a “where” qualifier to
    the “delete from” command to identify one or more rows. The command to delete
    the third record in the “cars” table is:


    delete from cars where id=3;


    Specific columns can be deleted from a table using the SQL “alter table” command
    followed by the table name, then the “drop” keyword followed by the column name.
    The command to delete the “top_mph” column from the cars table is:


    alter table cars drop top_mph;


    A complete table can be deleted from a database using the SQL “drop table” command
    followed by the table name. So the command to delete the “cars” table is:


    drop table cars;


    An entire database can be deleted with the SQL “drop database” command followed
    by the database name. The “garage” database, which contained the “cars” table,
    can be deleted with:


    drop database garage;


    This deletes the database and also destroys any tables within it, so most obviously
    be used with care.


    ![](img/7faa63a7fa0add8f53300594ebae949f_138_0.png)


    ```

    MySQL Monitor

    mysql> drop database garage;

    Query OK, 3 rows affected (0.00 sec)

    mysql> use garage;

    ERROR 1049: Unknown database ''garage''

    mys>

    ```'
