    # ...cont''d


    The first element in an array can be removed with the array_shift() function,
    and the final element can be removed using the array_pop() function. Both these
    functions return the removed element data, which can be assigned to a variable.


    The following example removes the first and last elements from an array, then
    sorts the remaining elements into alphabetical order using the PHP sort() function.


    ```

    <html><head><title>Remove array elements</title></head>

    <body><ol>

    <?php

    #create an array containing 5 strings

    $arr=array("Orange","Cherry","Apple","Banana","Lemon");


    #remove element at beginning of the array

    $first = array_shift($arr);


    #remove element at end of the array

    $last = array_pop($arr);


    #sort elements alphabetically

    sort($arr);


    #write out values

    foreach($arr as $value){ echo("$value, " "); }

    echo("<br>Removed first element: \$first");

    echo("<br>Removed last element: \$last");

    ?>

    </ol></body></html>

    ```


    ![](img/7faa63a7fa0add8f53300594ebae949f_58_0.png)


    Each of the PHP array functions in this example requires the array name to be
    specified as their argument.


    ![](img/7faa63a7fa0add8f53300594ebae949f_58_1.png)'
