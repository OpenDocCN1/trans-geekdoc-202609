    \n9. Sending email with PHP | 121\n\n# Sending attachments with email\n\nTo send\
    \ an email with mixed content requires a more advanced understanding of email\
    \ formats. A main Content-Type: header must first declare the content to be “multipart/mixed”.\
    \ Then text and attachment sections can be specified within defined boundaries.\
    \ Each boundary starts with two hyphens followed by a unique number, which cannot\
    \ appear in the message part of the email.\n\nIt is common to use the PHP md5()\
    \ function to create a 32-bit hexadecimal number for use in a boundary. The time()\
    \ function can be specified as its argument to\n\n![](img/7faa63a7fa0add8f53300594ebae949f_123_0.png)\n\
    \nAttached files should be encoded with the base64_encode() function for safe\
    \ transmission, and are best split into chunks with the chunk_split() function.\
    \ This adds \\r\\n inside the file at regular intervals, normally every 76 characters.\n\
    \nThe following commented code lists the form handler for the attachment form\
    \ that was created on page 120:\n\n```php\n$to = $_POST['to']; $from = $_POST['from'];\n\
    $re = $_POST['re']; $comments = $_POST['comments'];\n\n$att = $_FILES['att'];\n\
    $att_path = $_FILES['att']['tmp_name'];\n$att_name = $_FILES['att']['name'];\n\
    $att_size = $_FILES['att']['size'];\n$att_type = $_FILES['att']['type'];\n```\n\
    \n![](img/7faa63a7fa0add8f53300594ebae949f_123_1.png)\n\nmixedmixed.php\n\nThe\
    \ boundary number is assigned to the boundary attribute in the Content-Type: header.\n\
    \n```php\n#open, read, then close the file\n$fp = fopen($att_path, \"rb\");\n\
    $file = fread($fp, $att_size);\nfclose($fp);\n```\n\n![](img/7faa63a7fa0add8f53300594ebae949f_123_2.png)\n\
    \n```php\n#create a boundary string\n$num = md5(time());\n$str = \"Multipart_Boundary=$num\"\
    ;\n\n#encode the data for safe transit\n$file = chunk_split(base64_encode($file));\n\
    ```\n\n```php\n#define header\n$hdr = \"MIME-Version: 1.0\\r\\n\";\n$hdr .= \"\
    Content-Type: multipart/mixed; boundary=$str\\r\\n\";\n$hdr .= \"From: $from\\\
    r\\n\";\n```\n\n```php\n#define message\n$msg = \"This is a multi-part message\
    \ in MIME format\\r\\n\";\n$msg .= \"--$str\\r\\n\";\n$msg .= \"Content-Type:\
    \ text/plain; charset=iso-8859-1\\r\\n\";\n$msg .= \"Content-Transfer-Encoding:\
    \ 8bit\\r\\n\";\n$msg .= \"$comments\\r\\n\";\n$msg .= \"--$str\\r\\n\";\n\n#define\
    \ the non-attachment\n$msg .= \"Content-Type: $att_type\\r\\n\";\n$msg .= \"name=$att_name\\\
    r\\n\";\n$msg .= \"Content-Disposition: attachment; filename=$att_name\\r\\n\"\
    ;\n$msg .= \"Content-Transfer-Encoding: base64\\r\\n\";\n$msg .= \"$file\\r\\\
    n\";\n$msg .= \"--$str\\r\\n\";\n\n#send mail\n$ok = mail($to, $re, $msg, $hdr);\n\
    if ($ok) echo \"OK\";\n?>\n```\n\n![](img/7faa63a7fa0add8f53300594ebae949f_124_0.png)\n\
    \nThe Content-Transfer-Encoding header for the text is \"bit\", which is its natural\
    \ state. The attachment has been encoded with base64_encode() so is described\
    \ as \"base64\". The Content-Disposition header is described here could alternatively\
    \ be \"inline\" to include the attachment in the email body.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_124_1.png)\n\
    \n| From | bob@some-mail-server.com |\n| Sent | Monday, June 14, 2005 12:15 PM\
