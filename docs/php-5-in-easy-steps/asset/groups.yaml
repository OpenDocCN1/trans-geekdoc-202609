    # SQL data types


    The table below describes the range of data type specifiers that can be used when
    creating table columns in MySQL. It is advisable to specify the permitted data
    type precisely. For instance, if a column is only going to hold short strings
    use varchar() rather than text.


    | Type | Description |

    |---|---|

    | int | An integer from -2147483648 to 2147483647 |

    | decimal | A floating point number that can specify the number of permissible
    digits. For example decimal(3,2) allows -999.99 to 999.99 |

    | double | A long double-precision floating point number |

    | date | A date in the YYYY-MM-DD format |

    | time | A time in the HH:MM:SS format |

    | datetime | A combined date and time in the format YYYY-MM-DD HH:MM:SS |

    | year | A year 1901-2155 in either YY or YYYY format |

    | timestamp | Automatic date and time of last record entry |

    | char() | A string of defined fixed length up to 255 characters long. For example,
    char(100) pads a smaller string to make it 100 characters long |

    | varchar() | A string of defined variable length up to 255 characters that is
    stored without padding |

    | text | A string up to 65535 characters long |

    | blob | A binary type for variable data |

    | enum | A single string value from a defined list. For example, enum("red","green","blue")
    allows any one of these three colors |

    | set | A single or multiple strings from a defined list. For example, set("red","green","blue")
    allows any one or more of these three colors |


    ![](img/7faa63a7fa0add8f53300594ebae949f_133_0.png)


    An enum type can contain up to 65535 permissible elements.'
