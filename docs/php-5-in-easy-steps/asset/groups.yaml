    \n这展示了提交不完整的电子邮件地址（缺少顶级域部分）后的页面。\n\n| 组合反馈表单 |\n| :--- |\n| 地址 | http://localhost/combined.php\
    \ |\n| 电子邮件地址格式错误！ |\n| 姓名 | Bob |\n| 电子邮件 | bob@some-mail-server. |\n| 注释 | Bob\
    \ 认为 PHP 非常棒！ |\n| 表单 | |\n\n## 开始使用 MySQL\n\n本章介绍了如何在数据库中存储信息。它演示了结构化查询语言 (SQL)\
    \ 的基础知识，该语言用于在数据库内部添加和操作数据。\n\n## 涵盖内容\n\n- 数据库简介 | 128\n- 探索数据库表 | 129\n- 创建新数据库\
    \ | 130\n- 创建数据库表 | 131\n- SQL 数据类型 | 132\n- SQL 字段修饰符 | 133\n- 插入表数据 | 134\n\
    - 修改现有表 | 135\n- 更新记录 | 136\n- 删除数据、表与数据库 | 137\n- SQL 查询 | 138\n\n## 数据库简介\n\n\
    数据库简单就是以结构化方式存储数据的容器。每个数据库由一个或多个表组成，表将数据结构成组织良好的行和列。这使得引用和操作数据变得更加容易。\n\n每个数据库表列都有标签，用于识别存储在该列单元格中的数据。每行包含一个名为“记录”的条目，将数据放在该行的每个单元格中。\n\
    \n一个典型的数据库表看起来如下：\n\n| member_id | fname | lname | tel | email |\n| :--- | :---\
    \ | :--- | :--- | :--- |\n| 1 | John | Smith | 555-1234 | john@mail.com |\n| 2\
    \ | Anne | Jones | 555-5678 | anne@mail.com |\n| 3 | Mike | McGrath | 555-3456\
    \ | mike@mail.com |\n\n![](img/7faa63a7fa0add8f53300594ebae949f_129_0.png)\n\n\
    数据库表的行并不是自动按照特定顺序排列的。这一点很重要。\n\n## 探索数据库表\n\n在 shell 窗口或 Windows 上的命令提示符窗口打开 MySQL\
    \ 监控器，输入 \"show databases;\" 查看所有可用数据库。\n\nMySQL 安装默认创建两个数据库：一个名为 \"test\"，另一个名为\
    \ \"mysql\"。SQL 命令 \"use database-name\" 选择要操作的数据库。\n\n输入 \"use mysql;\"，然后输入\
    \ \"show tables;\" 命令查看该数据库中的表列表。\n\nSQL 命令 \"explain table-name\" 可查看表的格式以及表中可能包含的字段名。使用\
    \ mysql 数据库，输入 \"explain\"， 查看表的格式。关于运行 MySQL 监控器的详情请参阅第 14 页。\n\n![](img/7faa63a7fa0add8f53300594ebae949f_130_0.png)\n\
    \nexplain 命令并没有显示表中的实际数据，只需查看第 34 页以了解如何查看表数据。\n\n![](img/7faa63a7fa0add8f53300594ebae949f_130_1.png)\n\
    \n```\nMySQL Monitor\nmysql> use mysql:\nDatabase changed\nmysql> show tables;\n\
    +----------------\n| Tables_in_mysql |\n+----------------\n| columns_priv |\n\
    | db |\n| Func |\n| host |\n| tables_priv |\n| user |\n+---------------+\n\nmysql>\
    \ explain;\n+----------------------+\n| Field | Type | Key | Default |\n| User\
    \ | char(32) | PRI | NULL |\n| Password | char(41) | NULL | |\n| Host | char(128)\
    \ | NULL | |\n| Select | enum('Y','N') | | 'N' |\n| Insert | enum('Y','N') | |\
    \ 'N' |\n| Update | enum('Y','N') | | 'N' |\n| Delete | enum('Y','N') | | 'N'\
    \ |\n| Create | enum('Y','N') | | 'N' |\n+----------------------+\n```\n\n## 创建新数据库\n\
    \nSQL 命令 \"create database-name\" 用于创建新数据库。例如，`CREATE DATABASE test;`。\n\nMySQL\
    \ 监控器将响应 \"Query OK, 1 row affected\"。查看新数据库，输入 `SHOW DATABASES;`。\n\n```\nmysql>\
    \ create database test;\nQuery OK, 1 row affected (0 sec)\n\nmysql> show databases;\n\
    +--------------------\n| Databases           |\n+--------------------\n| information_schema\
    \ |\n| mysql               |\n| test                |\n+--------------------\n\
    ```\n\n## 创建数据库表\n\n要创建表，必须使用 `USE database-name` 命令选择数据库。例如，`USE test;。\n\n然后，使用\
    \ `CREATE TABLE` 命令定义表的列。\n\n```\nmysql> create table students (\n    id int,\n\
    \    name varchar(50),\n    major varchar(50)\n);\nQuery OK, 0 row affected (0\
    \ sec)\n```\n\n要查看表的结构，使用 `DESCRIBE table-name` 或 `EXPLAIN table-name` 命令。\n\n\
    ```\nmysql> describe students;\n+------+------+------+------+---------+\n| Field\
    \ | Type | Null | Key | Default | Extra |\n+------+------+------+------+---------+\n\
    | id | int | NO | PRI | NULL | |\n| name | varchar(50)| YES | | NULL | |\n| major|\
    \ varchar(50)| YES | | NULL | |\n+------+------+------+------+---------+\n```\n\
    \n## 插入表数据\n\n向表中添加数据，使用 `INSERT INTO` 命令。例如：\n\n```sql\nmysql> insert into students\
    \ (id, name, major) values (1, 'Alice', 'Computer Science');\nQuery OK, 1 row\
    \ affected (0 sec)\n\nmysql> insert into students (id, name, major) values (2,\
    \ 'Bob', 'Physics');\nQuery OK, 1 row affected (0 sec)\n```\n\n查看表中的数据，使用 `SELECT`\
    \ 命令。\n\n```sql\nmysql> select * from students;\n+------+------+-----------------------------+\n\
    | id | name  | major           |\n+------+------+-----------------------------+\n\
    |  1 | Alice | Computer Science |\n|  2 | Bob   | Physics         |\n+------+------+-----------------------------+\n\
    ```\n\n## 修改现有表\n\n要修改现有表，使用 `ALTER TABLE` 命令。例如，添加一列：\n\n```sql\nmysql> alter\
    \ table students add age int;\nQuery OK, 0 row affected (0 sec)\n```\n\n更改列的数据类型：\n\
    \n```sql\nmysql> alter table students modify name varchar(100);\nQuery OK, 0 row\
    \ affected (0 sec)\n```\n\n## 更新记录\n\n要更新现有数据，使用 `UPDATE` 命令。始终使用 `WHERE` 子句以避免更新所有记录。\n\
    \n```sql\nmysql> update students set major = 'Mathematics' where id = 1;\nQuery\
    \ OK, 1 row affected (0 sec)\n```\n\n## 删除数据\n\n要从表中删除特定行，使用 `DELETE` 命令。\n\n\
    ```sql\nmysql> delete from students where id = 2;\nQuery OK, 1 row affected (0\
    \ sec)\n```\n\n## 删除表与数据库\n\n要删除整张表，使用 `DROP TABLE` 命令。\n\n```sql\nmysql> drop\
    \ table students;\nQuery OK, 0 row affected (0 sec)\n```\n\n要删除整个数据库，使用 `DROP\
    \ DATABASE` 命令。\n\n```sql\nmysql> drop database test;\nQuery OK, 0 row affected\
    \ (0 sec)\n```\n\n"
