    \ 环境变量中。这是一个三维数组，其后跟着两个方括号，语法如下：\n\n`$_FILES['file-name']['property']`\n\n可以通过在第一组括号内插入其文件名来引用上传的文件。可以通过在第二组括号内插入属性\
    \ `\"name\"`、`\"size\"`、`\"type\"`、`\"tmp-name\"` 或 `\"error\"` 来引用关于该文件的各种信息。\n\
    \n为了适应文件传输可能无法成功完成，可以使用 PHP `die()` 函数终止脚本执行并显示指定的字符串。\n\n下面的示例尝试将上一页中 HTML 表单上传的文件复制到\
    \ Apache 的 `htdocs` 目录，并在完成后显示文件的详细信息。\n\n```php\n<?php\nif ($_FILES['file']['name']\
    \ != \"\") {\n    copy ($_FILES['file']['tmp_name'],\n    \"C:/Apache/htdocs/\"\
    \ . $_FILES['file']['name'])\n    or die(\"Could not copy file\");\n} else {\n\
    \    die(\"No file specified\");\n};\n?>\n```\n\n## 文件\n\n当 `setcookie()` 返回真\
    \ (1) 时，表示运行正常——它并不验证 cookie 是否被接受。cookie 在加载下一个页面时才会显示，但其创建可以通过 `setcookie()`\
    \ 返回的值进行验证。否则返回假 (0)。\n\n## 数据持久化\n\n本章演示了如何通过 PHP 存储数据以便在用户导航时保留。示例说明了两种可能的技术：cookie\
    \ 和会话。介绍了每种技术的优点。\n\n## 内容\n\n-  Cookie | 98\n- 设置 Cookie | 100\n- 访问限制 | 102\n\
    - 会话 | 104\n- 会话 | 106\n- 无 Cookie 的会话 | 108\n- 设置会话偏好 | 110\n- Cookie 还是会话？ |\
    \ 112\n\n## 介绍 Cookie\n\nCookie 是网站保存在访问其计算机上的文本文件。每个 Cookie 可以包含 4000 个字符，每个网站最多可以存储\
    \ 20 个 Cookie，客户端计算机最多可以存储 300 个 Cookie。它们适用于用户偏好、购物车选择和数据片段。\n\nCookie 文件可以使用任何文本编辑器打开，因此敏感信息应该进行加密。例如，与其直接在\
    \ Cookie 中存储用户的密码，不如存储一个唯一标识字符串，该字符串引用服务器上的数据库条目。\n\n当用户登录网站时，可以将他们的姓名存储在 Cookie\
    \ 中，以便他们访问的每个页面都能称呼他们。\n\n在 PHP 中，使用 `setcookie()` 函数创建 Cookie。这应该在 PHP 文档的最开始处创建\
    \ Cookie——在任何其他代码、标签或空白之前。cookie 在加载下一个页面时才会显示，但其创建可以通过 `setcookie()` 返回的值进行验证。\n\
    \n```php\n<?php\necho(\"Cookie created? : \");\nsetcookie(\"cookie_name\", \"\
    cookie_data\" );\n?>\n```\n\n```html\n<html>\n<head><title>Cookie</title> </head>\n\
    <body></body>\n</html>\n```\n\n"
