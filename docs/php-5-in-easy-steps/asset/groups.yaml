  - "[PAGE 77]\n\n# Browser redirection\n\nThe PHP header() function supplies raw\
    \ HTTP headers to the browser and can be used to redirect to another location.\
    \ The redirection script should be at the very top of the page to prevent any\
    \ other part of the page from loading.\n\nThe target is specified by using the\
    \ \"Location: header as the argument to the header() function. After calling this\
    \ function, the exit() function can be used to halt parsing of the code on that\
    \ page.\n\nIn this example a drop-down selection box offers the user a variety\
    \ of locations to visit. When the form is submitted, the page is reloaded and\
    \ the $location variable is used to redirect the browser.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_77_0.png)\n\
    \n```\n<?php $location = $_POST['location']; #assign values\n$self = $_SERVER['PHP_SELF'];\
    \ #assign values\n\nif ($location != null) {\n    header(\"Location:$location\"\
    ); exit;\n}\n?>\n\n<html><title>Redirect</title></head>\n<body>\nChoose a site\
    \ to visit:\n<form action=\"?php $self ?>\">\n<select name=\"location\">\n  <option\
    \ value=\"http://www.ineasysteps.com\">In Easy Steps</option>\n  <option value=\"\
    http://www.amazon.com\">Amazon</option>\n  <option value=\"http://www.w3.org\"\
    >World Wide Web Consortium</option>\n  <option value=\"http://www.reuters.com\"\
    >Reuters News</option>\n  <option value=\"http://www.ebay.com\">Ebay</option>\n\
    </select>\n<input type=\"submit\" name=\"submit\" value=\"Go\">\nn</form>\n</body>\n\
    </html>\n```\n\nThe header() function sends a header to the browser. It must appear\
    \ at the start of the page, before any content is sent to the browser."
