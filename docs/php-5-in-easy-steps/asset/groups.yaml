    # PHP functions for MySQL


    The table below describes special PHP functions that are used to work with MySQL
    databases. These functions feature in active demonstrations inside this book.


    | mysql_connect(server-name, user-name, password); Attempts to open a connection
    to a MySQL server. Returns a link-identifier on success or false on failure |

    | mysql_create_db(database-name, link-identifier); Attempts to create a new database
    on the server associated with the specified link-identifier. Returns true on success
    or false on failure |

    | mysql_select_db(database-name, link-identifier); Sets the current active database
    on the server''s associated with the specified link-identifier. Returns true on
    success or false on failure |

    | mysql_drop_db(database-name, link-identifier); Attempts to delete an entire
    database on the server with the specified link-identifier. Returns true on success
    or false on failure |

    | mysql_fetch_array(result-resource); Returns an array that corresponds to a database
    table row or returns false if there are no more rows |

    | mysql_list_dbs(link-identifier); Lists the databases available on a MySQL server
    |

    | mysql_num_rows(result-resource); Returns the number of rows in a result-resource
    |

    | mysql_list_tables(database-name, link-identifier); Lists the tables in the specified
    database |

    | mysql_query(SQL-string, link-identifier); Sends a query to the currently active
    database on the server that''s associated with the specified link-identifier.
    Returns a result-resource answering the query on success or false on failure |


    The examples and examples in this book are demonstrated with Apache 1.3.31, MySQL
    4.0.18, and the final release of PHP 5.0.00 – modifications may be required for
    other versions. The source code of all the examples can be downloaded from this
    book''s web at www.ineasystems.com.'
