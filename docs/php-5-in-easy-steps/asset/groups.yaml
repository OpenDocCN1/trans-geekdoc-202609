  md: "\n## Time-specific content\n\nThe current date or time can be useful to create\
    \ dynamic content appropriate for the day of the week, month of the year or the\
    \ time of the day. The example script below writes a message appropriate to the\
    \ time of the day at which the user accesses the server.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_66_0.png)\n\
    \n```html\n<head><title>Greetings</title></head>\n<body>\n<?php $hour = date(\"\
    G\");\n$now = date(\"g:i a\");\n\n$msg = \"Good Evening.\";\nif ($hour < 18) {\
    \ $msg = \"Good Afternoon.\"; }\nif ($hour < 12) { $msg = \"Good Morning.\"; }\n\
    \necho (\"$msg The time is \\$now\");\n?>\n</body></html>\n```\n\nThis script\
    \ assesses an integer value of the current hour returned. The message displayed\
    \ may not be appropriate for users from other time zones.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_66_1.png)\n\
    \n| Greetings | | | |\n|---|---|---|---||\n| File Edit View Favorites Tools Help\
    \ | | | |\n| Address | http://localhost/greetings.php | Go |\n\nGood Morning.\
