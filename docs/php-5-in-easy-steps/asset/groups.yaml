    # Assignment operators


    The operators that are commonly used in PHP to assign values are all listed in
    the table below. Each of them except the simple = assign operator is a shorthand
    form of a longer expression, so each equivalent is also given for clarity.


    | Operator | Example | Equivalent |

    | --- | --- | --- |

    | = | $a = $b | $a = $b |

    | += (for numbers) | $a += $b | $a = $a + $b |

    | .= (for strings) | $a .= $b | $a = $a . $b |

    | -= | $a -= $b | $a = $a - $b |

    | *= | $a *= $b | $a = $a * $b |

    | /= | $a /= $b | $a = $a / $b |

    | %= | $a %= $b | $a = $a % $b |


    ![](img/7faa63a7fa0add8f53300594ebae949f_37_0.png)


    The equality operator compares values and is explained fully, with examples, on
    page 38.


    It is important to regard the = operator as meaning "assign" rather than "equals"
    to avoid confusion with the == equality operator. In the example in the table,
    the variable named Sa is assigned the value that is contained in the variable
    named $b, assigning this as its new value.


    In the table, the += operator adds the numeric value contained in variable $a
    to the numeric value contained in the variable named $b and then assigns the result
    as the new value contained in variable $a.


    The .= operator is very useful and has been used in earlier examples to add a
    second string to an existing string.


    All the other operators in the table work in the same way as the + = operator,
    making the arithmetical operation between the two values first, then assigning
    the result to the first variable.'
