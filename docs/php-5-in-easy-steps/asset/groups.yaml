    # Using arrays


    This chapter deals exclusively with the topic of arrays, and illustrates by example
    what they are and how to use them. The most useful special PHP array functions
    are demonstrated to show how to store and retrieve values in array structures.


    # Covers


    +   - Creating an array | 52

    - Changing array element values | 53

    - Listing array elements | 54

    - Getting the array size | 55

    - Adding & removing array elements | 56

    - Array keys and values | 58

    - One-based indexing | 59

    - Manipulating arrays | 60


