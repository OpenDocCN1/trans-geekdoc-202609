    # 什么是 PHP？


    "PHP" 是 "PHP: Hypertext Preprocessor"（超文本预处理器）的递归缩写。它演变自 1994 年独立 IT 承包商 Rasmus
    Lerdorf 创建的“个人主页”（Personal Home Page）工具，用于跟踪访问其网站的用户。这些工具促使 PHP 进化为一个带有“表单解释器”的脚本引擎，并于
    1996 年作为 "PHP-FI" 发布。


    全球的开发者开始贡献创意，到 1997 年，已有超过 50,000 个网站在使用 PHP-FI。其中两个开发者 Zeev Suraski 和 Andi Gutmans
    主要负责创建了一个应用程序编程接口（API），该接口随后于 1998 年作为 "PHP 3" 的 PHP 解析器发布。


    1999 年，更新后的 "PHP 4" 版本整合了 "Zend 引擎（Zeev 和 Andi 开发）”，使得 PHP 脚本可以与任何 Web 服务器、操作系统和平台的组合使用。


    PHP 现在已在全球超过 1600 万个领域中使用，其流行性持续增长。它的明确目标是“允许开发者快速编写动态生成的页面”。通过 PHP，你可以读取和写入文件、收集和处理数据、通过电子邮件发送数据、访问和操作数据库记录、读写
    Cookie、在会话变量中维护数据、方便用户操作等等。


    # PHP 的优势


    除了上述的跨平台能力外，PHP 仅需少量的系统资源即可提供快速执行速度，因此不会减慢主机速度。它使用自己的资源管理系统，并拥有一种复杂的处理变量的方法以确保稳定性。它的简单性让任何具有基础
    HTML 知识的人都能立即将 PHP 集成到页面中。


    PHP 的模块化扩展系统允许它与不同的库（如加密、图形或 XML）交互，并且添加更多扩展非常简单。


    ![](img/7faa63a7fa0add8f53300594ebae949f_10_0.png)


    可以在 www.zend.com 在了解更多关于 Zend 引擎的信息。


    # PHP 如何工作？


    一个典型的 PHP 文档包含一个或多个 PHP 元素、HTML 标记元素以及实际的文本页面内容。


    当浏览器向支持 PHP 的 Web 服务器请求 PHP 页面时，服务器将调用 PHP 解析器来处理该页面上的所有 PHP 元素。


    PHP 解析器执行页面上的 PHP 脚本指令，生成 HTML 文档，然后将其作为原始请求的响应发送到浏览器。


    PHP 解析器还可能被要求从数据库中检索信息，因此整个过程如插所示：


    ![](img/7faa63a7fa0add8f53300594ebae949f_11_0.png)


    # 创建 PHP 环境


    通常，为了开发和运行 PHP 页面，需要在计算机系统上安装这三个关键组件：


    - Web 服务器 - PHP 兼容几乎所有的 Web 服务器软件，包括微软的 Internet 信息发布服务 (IIS)，但最常用的是免费提供的 Apache
    服务器。书中的所有示例都运行在 Apache 1.3.31 上。


    ![](img/7faa63a7fa0add8f53300594ebae949f_12_0.png)


    - 数据库 - PHP 兼容几乎所有的数据库软件，包括 Oracle 或 Sybase，但最常用免费的 MySQL 数据库软件，并对其进行了特定的优化。MySQL
    的流行因其速度和可扩展性而名其实，这使其适用于部署在高流量网站上。书中的所有数据库示例均使用 MySQL 4.0.18 显示。


    ![](img/7faa63a7fa0add8f53300594ebae949f_12_1.png)


    - PHP 解析器 - 为了处理 PHP 指令，必须安装解析器来生成可以发送到浏览器的 HTML 输出。无论操作系统如何，解析器引擎都是相同的，因此 PHP
    页面在不同平台上运行时不需要更改。书中的所有示例都使用了 PHP 5.0.0 的版本。


    ![](img/7faa63a7fa0add8f53300594ebae949f_12_2.png)


    由于 Windows 平台是最流行的桌面操作系统，在 Windows 中建立 PHP 环境以开发和测试脚本非常方便。完成的脚本可以部署在 Windows 服务器或上传到运行不同操作系统的
    Web 服务器。事实上，大多数 Web 服务器运行在免费的 Linux 平台，它提供了极短停机所需的可靠性和安全性。“LAMP”缩写通常用于描述 Linux、Apache、MySQL
    和 PHP 的典型配置。本章的剩余部分将演示如何在 Windows 平台上下载并安装建立 PHP 环境所需的三个组件。


    # 安装 Apache


    Apache 是世界上最流行的 Web 服务器，根据最近的调查，它占全球 Web 服务器的 56%。它可以从 http://httpd.apache.org
    或该网站上的镜像站点免费下载。


    下载 Windows 的稳定版本，文件名类似于 "apache_1.3.31-win32-x86-no.msi"。双击下载的文件开始安装，然后在“服务器信息”对话框中输入如下所示字段：


    ![](img/7faa63a7fa0add8f53300594ebae949f_13_0.png)


    ![](img/7faa63a7fa0add8f53300594ebae949f_13_1.png)


    服务器信息：

    网络（例如 somenet.com): localhost

    名称（例如 somenet.com): localhost

    电子邮件（例如 somenet.com): localhost

    位置（例如 somenet.com): localhost

    安装服务：为所有用户运行


    ![](img/7faa63a7fa0add8f53300594ebae949f_13_2.png)


    ![](img/7faa63a7fa0add8f53300594ebae949f_13_3.png)


    当 Setup 对话框出现时，选择建议的位置 C:\mysql 并选择“典型”安装。MySQL 用户手册可以在 C:\mysql 子目录下找到。


    # 启动与停止 Apache


    如果已安装 Apache，可以从提示符使用命令 `NET START apache` 手动启动。可以使用命令 `NET STOP apache` 停止。


    或者 Apache 已安装为服务，你可以如下所示从命令行启动它：


    ![](img/7faa63a7fa0add8f53300594ebae949f_14_0.png)


    | 名字 | 描述 | 状态 | 启动类型 |

    | :--- | :--- | :--- | :--- |

    | Apache | 描述... | 已启动 | 自动 |

    | Application | 提供... | 已启动 | 手动 |

    | Application | 提供... | 已启动 | 手动 |

    | 自动 | 启用... | 已启动 | 自动 |

    | | | | |


    # 安装 MySQL


    有各种数据库服务器出售，例如 Microsoft Access，但 MySQL 数据库服务器既强大又免费。它在 Web 服务器上广泛使用，可以从 www.mysql.com
    免费下载。


    ![](img/7faa63a7fa0add8f53300594ebae949f_15_0.png)


    下载 Windows 的 MySQL 二进制版本，例如 "mysql-4.0.18-win.zip"。解压缩此文件并双击提取的文件 "setup.exe"
    开始安装。在设置期间接受建议安装位置 C:\mysql 并选择“典型”安装。MySQL 用户手册可以在 C:\mysql 子目录下找到。


    - bench

    - bin

    - data

    - docs

    - embedded

    - examples

    - include

    - lib

    - scripts

    - share


    在启动 MySQL 服务器之前，你必须在系统的根目录下放置一个配置文件——为此目的提供了模板。通常情况下，你应该将 C:\mysql\my-medium.cnf
    模板文件复制到 C: 并将其重命名为 "my.cnf"。MySQL 服务启动时会读取此文件中的选项。


    C:\mysql 文件夹包含运行 MySQL 需要的所有可执行文件。在 Windows XP、2000 和 NT 系统上，MySQL 可以安装为后台运行的服务，其他平台可以手动作为应用程序运行
    MySQL。


    在提示符输入 "C:\bin\mysql-nt --install" 将 MySQL 安装为后台服务，它将在每次计算机启动时自动启动。可以从提示符使用命令
    `NET START mysql` 手动启动，并使用命令 `NET STOP mysql` 停止。当 MySQL 运行时，输入 "C:\mysql\bin\mysql"
    启动 MySQL 器，可以在其中创建和操作数据库：


    ```

    Command Prompt

    C:\C:\mysql\bin\mysql monitor. Commands end with ;

    Your MySQL connection id is 2 to server

    Type ''help''; or ''h'' for help.

    mysql> exit

    Bye

    C:\>

    ```


    ![](img/7faa63a7fa0add8f53300594ebae949f_15_1.png)


    '
