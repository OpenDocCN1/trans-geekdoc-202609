    \ 函数将所有文件名分配给一个变量列表以遍历每次迭代；该函数以目录句柄作为参数。\n\n重要的是，在循环完成后要使用 `closedir()` 函数关闭目录。同样，这需要提供目录句柄作为参数。\n\
