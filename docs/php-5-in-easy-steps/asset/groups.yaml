  - "[PAGE 56]\n\n# Getting the array size\n\nThe PHP sizeof() function is an alias\
    \ for the PHP count() function, so either can be used to determine the total number\
    \ of elements in an array. These functions require the name of the array to be\
    \ specified as their argument.\n\nThe PHP script below first creates an empty\
    \ array, then fills three elements with data using a \"for\" loop. Each of the\
    \ element values is written out on the page, using the (foreach) function described\
    \ on the opposite page. Finally, the array size is assigned to a variable and\
