  - "[PAGE 91]\n\n# Logging visitor details\n\nThe ability to write files makes it\
    \ simple for PHP to log details about visitors to a web page, and can help website\
    \ development.\n\nIt is especially interesting to discover how visitors arrived\
    \ at the page, by recording the values of the environment variable HTTP_REFERER.\
    \ This holds the URL of the page containing the hyperlink that the user followed\
    \ to get to your page.\n\nThe frequency with which visitors return can be discovered\
    \ by recording the IP addresses of visitors to a page; this is stored in the environment\
    \ variable REMOTE_ADDR.\n\nThe following commented script demonstrates how to\
    \ log these visitor details, along with their browser type and the time at which\
    \ they accessed the page.\n\n![](img/7faa63a7fa0add8f53300594ebae949f_91_0.png)\n\
