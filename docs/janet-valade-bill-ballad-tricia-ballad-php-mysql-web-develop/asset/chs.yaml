  \ PHP 4 和 PHP 5 之间切换版本。\n\n### 打开 phpMyAdmin\n\n从 XAMPP 欢迎页（见上一节），你可以点击左面板底部工具部分的\
  \ `phpMyAdmin` 链接来测试其已安装。如果安装了 phpMyAdmin，它将在浏览器中打开。第三册第一章说明了如何使用 phpMyAdmin。\n\n\
  如果 phpMyAdmin 页面没有打开，请确保 Apache 已启动。你可以按照上一节的方法管理 Apache。\n\n### 测试 PHP\n\n要测试 PHP\
  \ 是否安装并正常工作，请遵循以下步骤：\n\n1. **找到需要保存 PHP 脚本的目录。**\n\n该目录及其子目录就是你的 *Web 空间*。这是 Apache\
