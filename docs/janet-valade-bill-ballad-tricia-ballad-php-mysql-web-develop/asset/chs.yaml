  \ 编写产品页的代码\n\n目录产品页在表格中显示产品信息，每个产品占一行。产品每次显示一页。页面末尾的小表单显示了前往下一页、上一页和索引页的按钮。\n\n\
  显示产品页的代码位于文件 `page_furniture_products.inc` 中，如列表 4-2 所示。\n\n**列表 4-2：显示产品页的文件**\n\
