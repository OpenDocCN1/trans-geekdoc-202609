  4. **向下滚动列表，找到 MySQL 的设置部分。**\n\n软件部分按字母顺序列出，从 `bcmath` 开始。MySQL 部分位于列表的中靠位置。\n\n\
  你会发现两个区块，一个以 `mysql` 开头，另一个以 `mysqli` 开头。`mysql` 和 `mysqli` 之间的差异在本教程的第 2 章中进行了解释。\n\
  \n当你的 PHP 脚本正常运行且输出包含 MySQL 支持的设置区块时，你的环境就准备好进行开发工作了。\n\n如果 PHP 脚本没有运行，请确保 Apache\
  \ 已经启动。你可以按照本章早些“使用 XAMPP 控制面板”节中的描述来管理 Apache。\n\n## 配置你的开发环境\n\nApache、MySQL 和\
  \ PHP 都可以配置。它们的配置设置存储在文本文件中，你可以对它们进行编辑。当 XAMPP 安装软件时，它会创建带有默认设置的配置文件，以便软件以常用设置运行。然而，你可能出于各种原因需要更改配置。在讨论要配置的特定功能时，书中会处处介绍相应的的配置设置。\n\
  \nXAMPP 将所有软件安装在你在安装期间指定的目录中，例如 `c:\\xampp`（这是默认目录）。XAMPP 配置了软件以便在该目录中查找配置文件。如果你需要更改任何配置设置，你必须编辑该目录下的配置文件，而不是帮助文件或其他各个软件文档中提到的目录下的文件。\n\
  \n### 配置 PHP\n\nPHP 使用名为 `php.ini` 的文件中的设置来控制其部分行为。PHP 在启动时会查找 `php.ini` 并使用找到的设置。如果\
  \ PHP 找不到该文件，它将使用一组默认设置。\n\nXAMPP 将 `php.ini` 文件存储在主 XAMPP 文件夹下的 `apache\\bin`目录中。例如，如果\
  \ XAMPP 位于默认目录，你需要编辑文件 `c:\\xampp\\apache\\bin\\php.ini` 来更改 PHP 配置设置。\n\n要配置 PHP，请遵循以下步骤：\n\
  \n1. **使用文本编辑器打开 `php.ini` 文件进行编辑。**\n2. **编辑你想要更改的设置。** 步骤 3 和 4 提到了某些特定设置，如果你在使用指定的环境，应该始终更改这些设置。\n\
  3. **仅在你使用 PHP 5 或更早版本时，关闭魔术引用（magic quotes）。**\n\n查找以下行：\n```\nmagic_quotes-gpc\
  \ On\n```\n将 `On` 改为 `Off`。\n\n4. **仅在你使用 PHP 5 或更高版本时，设置你的本地时区。**\n\n找到该行：\n```\n\
  ;date.timezone =\n```\n删除行开头的分号。在等号后添加你的本地时区代码。例如，该行可能是 `date.timezone = America/Los_Angeles`。\n\
  \n你可以在 `www.php.net/manual/en/timezones.php` 找到时区代码列表。\n\n5. **保存 `php.ini` 文件**\n\
  6. **重启 Apache 以使新设置生效。**\n\n通常，剩余的默认设置允许 PHP 正常运行，但你可能出于特定原因需要编辑这些设置中的某些。在讨论可能需要你更改设置的话题时，我们在书中会讨论\
  \ `php.ini` 文件中的设置。\n\n### 配置 Apache\n\nApache 配置设置存储在名为 `httpd.conf` 的文件中。该文件需要一些指令才能让\
  \ PHP 工作工作。XAMPP 在安装软件时添加了这些指令，因此你不需要配置 Apache 来让 PHP 运行。\n\n你可以通过 `httpd.conf`\
  \ 文件中的指令来更改 Apache 的某些行为。例如，你可以更改 Apache 查找 Web 页面文件的位置以及 Apache 监听的端口号。你可以更改的某些指令在本教程的第\
  \ 4 章中进行了描述。所有的 Apache 指令在 `httpd.org` 的 Apache 网站上都有描述。\n\n要更改使用 XAMPP 安装的 Apache\
  \ 配置，你需要找到 XAMPP 安装主文件夹下 `apache\\conf` 文件夹中的 `httpd.conf` 文件。例如，如果 XAMPP 安装在默认目录，它是\
  \ `c:\\xampp\\apache\\conf\\httpd.conf`。\n\n### 配置 MySQL\n\nMySQL 在安装时会创建一个配置文件。大多数人不需要更改\
  \ MySQL 配置。然而，你可能想更改它，以便将数据存储在默认位置以外的其他地方。事实上，XAMPP 安装已经为你配置了它的数据目录设置。如果你想将数据存储在不同的位置，可以更改该设置。更改\
  \ MySQL 配置的说明在本教程的第 3 章中提供。\n\n要更改使用 XAMPP 安装的 MySQL 配置，你需要找到 XAMPP 安装主文件夹下 `mysql\\\
  bin` 文件夹中的 `my.cnf` 文件。例如，如果 XAMPP 安装在默认目录，它是 `c:\\xampp\\mysql\\bin\\my.cnf`。\n\
  \n## 卸载并重新安装 XAMPP\n\n如果你觉得你犯了错误并想重新安装 XAMPP，你需要在重新安装之前卸载它。要重新安装 XAMPP，请遵循以下步骤：\n\
  \n1. **在 XAMPP 控制面板中停止 Apache 和 MySQL。** 参考本章早些“使用 XAMPP 控制面板”节。如果你在卸载 XAMPP 之前没有停止\
  \ Apache 和 MySQL，在重新安装时可能会遇到困难。特别是如果你将 Apache 和 MySQL 作为服务启动了。\n2. **通过选择开始 > 所有程序\
  \ > Apache Friends > XAMPP > 卸载启动卸载。** 卸载程序的第一个界面将打开。\n3. **浏览屏幕并回答问题。** 点击“下一步”按钮浏览屏幕；通过选择相应的选项来回答问题。可以通过点击相应的选项保存你创建的任何数据库或\
  \ Web 页面。XAMPP 完全卸载后将显示一条消息。\n4. **从头重新启动安装程序。** 详情请参考早之前的“安装 XAMPP”节。\n\n### 故障排除\n\
  \n有时，当你查看 XAMPP 控制面板时，会发现 Apache 和/或 MySQL 列在列表中但未运行，且 Svc 复选框未勾选。这意味着 XAMPP 在安装期间未能将\
  \ Apache 或 MySQL 作为服务启动。\n\n\n\n将 MySQL 和 Apache 作为服务运行是最好的，但并不是必须的。你可以在不勾选 `Svc`\
  \ 复选框的情况下启动它们，你的开发环境就能正常工作。你只需要在每次启动电脑时在控制面板中重启 MySQL 和 Apache 即可。当 `MySQL` 和 `Apache`\
  \ 都作为服务运行时，它们会在电脑启动时自动启动。在大多数情况下，你可以使用本节描述的方法在控制面板将它们作为服务启动。\n\n首先，尝试勾选 `Svc` 复选框并点击\
  \ `Start` 按钮。XAMPP 会尝试将软件作为服务启动。如果 XAMPP 失败，你会在底部看到一条消息，说明它未启动或已停止。第二次或第三次可能会成功。\n\
  \n### 故障排除\n\n当 XAMPP 多次尝试无法将软件作为服务启动时，请在取消选中 `Svc` 复选框的情况下点击 `Start` 按钮。软件将启动。然后，点击\
  \ `Stop` 按钮停止软件。接着，选中 `Svc` 复选框再次启动软件。通常，现在 XAMPP 能够成功地将两个包作为服务启动。\n\n### 设置你的环境\n\
  \n如果你在未勾选 `Svc` 复选框启动并停止后，仍然无法将 `MySQL` 和/或 `Apache` 作为服务启动，可以在不作为服务的情况下运行它们。它们会正常运行，你的开发环境也能工作——你只需要在启动电脑时记得重新启动它们。\n\
  \n![Image 24](img/index-130_1.jpg)\n![Image 25](img/index-130_2.png)\n\n## 第二卷\n\
  \n### PHP 编程\n\n#### 内容概览\n\n**第 1 章：PHP 基础 ... 103**\n**第 2 章：构建 PHP 脚本 ... 151**\n\
  **第 3 章：PHP 与你的操作系统 ... 197**\n**第 4 章：面向对象编程 ... 229**\n\n## 第 1 章：PHP 基础\n\n###\
  \ 本章内容\n\n- 在 HTML 文件中添加 PHP 部分\n- 编写 PHP 语句\n- 使用 PHP 变量和常量\n- 使用数组\n- 为你的脚本编写文档\n\
  \n`PHP` 是一种专门为 Web 设计脚本语言。它具有帮助你开发动态应用程序的功能。根据 `www.php` 的 Netcraft 调查，它的流行性持续增长。\n\
  \nPHP 语言语法与 C 相似，因此如果你有 C 经验，你会觉得 PHP 非常容易。在本章中，我们将描述编写 PHP 的基础。\n\n### PHP 如何工作\n\
  \n`PHP` 软件与 Web 服务器协作交付动态 Web 页面。`PHP` 是将输出发送到浏览器的软件。当你向浏览器地址栏输入 URL 时，你正在向 Web\
  \ 服务器发送消息。Web 服务器处理文件并将输出发送到浏览器。\n\nWeb 服务器如何处理 PHP 语句\n\n`PHP` 并没有与所有 Web 服务器集成，但与许多流行的\
  \ Web 服务器兼容。`PHP` 是作为 Apache 软件基金的项目开发的——因此它与 `Apache` 配合得最好。`PHP` 也适用于 `Microsoft\
  \ IIS/PWS`、`iPlanet`（原 Netscape Enterprise Server）等。\n\nWeb 服务器配置为期望某些文件扩展名包含 PHP\
  \ 语句。扩展名通常为 `.php` 或 `.phtml`，可以使用任何扩展名。（在书中，我们假设 `.php` 是 PHP 脚本的扩展名）。当 Web 服务器收到指定扩展名的文件请求时，它会原样发送\
  \ HTML 语句，但 PHP 语句在发送给请求者之前会由 PHP 软件处理。\n\nWeb 服务器的工作原理如下：\n\n1. Web 服务器开始在 HTML\
  \ 模式下扫描文件。它假设所有语句都是 HTML。\n2. 当 Web 服务器遇到 PHP 开启标签 (`<?php`) 时，它切换到 PHP 模式。\n3.\
  \ Web 服务器原样处理 PHP 语句。\n4. 当 Web 服务器遇到 PHP 结束标签 (`?>`) 时，它返回 HTML 模式。\n5. Web 服务器继续扫描\
  \ HTML 并将其发送到浏览器。此循环一直持续到文件末尾。\n\n`PHP` 语句不会包含在发送到浏览器的输出中，因此用户永远看不到任何 PHP 语句。例如，在这个简单的\
  \ PHP 语句中：\n\n```php\n<?php echo \"<p>Hello World</p>\"; ?>\n```\n\n`<?php` 是 PHP\
  \ 开启标签，`?>` 是结束标签。`echo` 是一个 PHP 指令，告诉 PHP 输出随后的文本。PHP 软件处理该 PHP 语句并输出以下：\n\n```html\n\
  <p>Hello World</p>\n```\n\n这是一个普通的 HTML 语句。该 HTML 语句被传递给用户的浏览器。浏览器将该语句解释为 HTML 代码，并显示一个包含一个段落——Hello\
  \ World 的 Web 页面。\n\n\n\n\nPHP 在用于网页时是一种 `embedded`（嵌入式）脚本语言。这意味着 PHP 代码被嵌入在 HTML\
  \ 代码中。你使用 HTML 标签来包裹嵌入在 HTML 文件中的 PHP 语言——就像你使用其他 HTML 标签一样。你创建和编辑包含 PHP 的网页的方法与你创建和编辑普通\
  \ HTML 页面的方法相同。\n\nPHP 语言语句封装在如下形式的 PHP 标签中：\n\n```php\n<?php ?>\n```\n\n有时你可以使用更短的\
  \ PHP 标签版本。你可以尝试使用不带 `php` 的 `<?php` 和 `?>`。如果启用了短标签（short tags），你可以减少输入量。然而，如果你使用了短标签，当这些脚本移动到另一个未启用\
  \ PHP 短标签的 Web 主机时，脚本将无法运行。\n\nPHP 处理两个 PHP 标签之间的所有语句。PHP 部分被处理后，它会被丢弃。或者，如果 PHP\
  \ 语句产生了输出，PHP 部分会被输出所替换。浏览器看不到 PHP 部分——浏览器只看到它的输出（如果有的话）。关于此过程的更多信息，请参阅侧边栏“Web 服务器如何处理\
  \ PHP 文件”。\n\n例如，先从列表 1-1 所示的在浏览器窗口中显示 Hello World! 的 HTML 脚本开始（在任何语言中编写的第一个脚本都是\
  \ Hello World 脚本是一种传统。你可能在第一次学习 HTML 时就写过 Hello World 脚本）。\n\n### PHP 脚本的结构\n\n\
  **列表 1-1：Hello World HTML 脚本**\n\n```html\n<html>\n<head><title>Hello World Script</title></head>\n\
  <body>\n<p>Hello World!</p>\n</body>\n</html>\n```\n\n如果你在浏览器中打开此 HTML 脚本，你将看到一个显示\
  \ Hello World! 的网页。列表 1-2 显示了一个执行相同操作的 PHP 脚本——它在浏览器窗口中显示 Hello World!。\n\n**列表\
  \ 1-2：Hello World PHP 脚本**\n\n```html\n<html>\n<head><title>Hello World Script</title></head>\n\
  <body>\n<?php\necho “<p>Hello World!</p>”\n?>\n</body>\n</html>\n```\n\n当你在运行此脚本时，通过浏览器查看它，它会显示出与列表\
  \ 111 中的 HTML 脚本相同的网页。\n\n不要直接用浏览器查看该文件。也就是说，不要从浏览器菜单中选择文件➪打开文件来导航到文件并点击它。你必须在浏览器的地址栏中输入其\
  \ URL 来打开文件。如果你在浏览器窗口中看到的是 PHP 代码而不是预期的输出，说明你可能没有通过 URL 启动文件。\n\n在此此 PHP 脚本中，PHP\
  \ 部分是：\n\n```php\n<?php\necho “<p>Hello World!</p>”\n?>\n```\n\nPHP 标签仅包裹了一个语句——一个\
  \ `echo` 语句。`echo` 语句是你将频繁使用的 PHP 语句。输出仅仅是包含在双引号之间的文本。\n\n## PHP 语法\n\n当 PHP 部分被处理时，它会被输出所替换。在这种情况下，输出是\
  \ `<p>Hello World!</p>`。如果你将列表 1-2 中的 PHP 部分替换为之前的输出，该脚本现在看起来与列表 1-1 中的 HTML 脚本完全相同。如果你在浏览器中打开任一脚本，你都会看到同一个网页。如果你查看浏览器所看到的源代码（在浏览器中，选择查看➪源文件），你会发现两个脚本的源代码列表是相同的。\n\
  \n你可以在脚本中包含任意数量的 PHP 部分和任意数量的 HTML 部分，包括零个 PHP 或 HTML 部分。对于第 1 章，以下脚本包含两个 PHP 部分两个\
  \ HTML 部分：\n\n```html\n<html>\n<head><title>Hello World Script</title></head>\n\
  <body>\n<?php\necho “<p>Hello World!”\n?>\n<p>This is HTML only.</p>\n<?php\necho\
  \ “<p>Hello World again!</p>”\n?>\n<p> This is a second HTML section.</p>\n</body>\n\
  </html>\n```\n\n你添加到 HTML 文件中的 PHP 部分由一系列 PHP 语句组成。每个 PHP 语句都是让 PHP 执行某事的指令。PHP\
  \ 语句可以是简单的或复杂的。\n\n### 使用简单语句\n\n`Simple statements`（简单语句）是 PHP 执行一个简单动作的指令。列表 1-2\
  \ 显示的 `echo` 语句是一个简单的 PHP 语句，指示 PHP 输出双引号之间的文本。PHP 简单语句遵循以下规则：\n\n- **PHP 语句以分号或\
  \ PHP 结束标签结束。** PHP 不忽略空格或行尾。它会继续读取语句直到遇到分号或 PHP 结束标签，无论该语句跨越多少行。\n- **PHP 语句可以使用大写或小写编写。**\
  \ 在 `echo` 语句中，`Echo`、`echo`、`ECHO` 和 `eCHo` 对 PHP 来说都是相同的。\n\n以下示例包含两个产生相同输出的 echo\
  \ 语句：\n\n```php\necho “<p>Hello World</p>”;\necho “<p>World</p>”;\n```\n\nPHP 读取语句直到遇到分号，因此两个语句产生产生输出：\n\
  \n```php\n<?php echo “<p>Hello World!</p>” ?>\n```\n\nPHP 读取语句直到到达结束标签，PHP 将该标签视为语句的结束。下一个示例也产生相同的输出：\n\
  \n```php\n<?php\necho “<p>Hello</p>”;\necho “<p>World</p>”;\n?>\n```\n\n此示例在一行内包含两个\
  \ echo 语句，只要你用分号分隔了语句即可。\n\n### 使用复杂语句\n\n有时，一组简单语句会被组合成一个 `block`（块）。块由大括号 `{`\
  \ 和 `}` 包裹。一个语句块一起执行。块的一个常见用途是 `conditional block`（条件块），在其中语句仅在特定条件为真时才执行。例如，你可能希望脚本执行以下操作：\n\
  \n```php\nif (the sky is blue)\n{\nput leash on dragon;\ntake dragon for a walk\
  \ in the park;\n}\n```\n\n这些语句被包裹在大括号中，以确保它们作为一个块执行。如果天空是蓝的，则 `put leash on dragon`\
  \ 和 `take dragon for a walk in the park` 都会执行。如果天空不是蓝的，两个语句都不会执行（没有牵绳；没有散步），你将面对一头愤怒的龙。\n\
  \n使用块的 PHP 语句（例如 `if` 语句，我们将在本微型教程第 2 章解释）是 `complex statements`（复杂语句）。PHP 知道预期一个或多个块，并在复杂语句中寻找最后一个块的结束大括号。注意在结束括号之前有一个分号。这个分号是必须的，但在结束大括号之后不需要分号。\n\
  \n\n\n\n通常情况下，每个 PHP 简单语句都写在单独中，并以分号结尾。一个例外是输出长文本字符串的 `echo` 语句。你不需要在行尾结束语句并在下一行开始新语句。你可以将语句跨越几行编写，只要确保在最后一行的末尾加上分号结束语句即可。此外，将第一行之后的行进行缩进也是一个好习惯，这样可以清晰地显示额外的行是同一个语句的一部分，如下所示：\n\
  \n```php\necho “This is a really, really, really, really\nlong statement”;\n```\n\
  \n在编写语句块时，编码风格规定你应对块中的语句进行缩进，以清晰地显示块的开始和结束。例如，在下面的条件语句示例中，块中的简单语句被缩进了：\n\n```php\n\
  if(the sky is blue)\n{\n    put leash on dragon;\n    take dragon for a walk in\
  \ the park;\n}\n```\n\nPHP 不需要缩进，但它有助于人类阅读代码。\n\n## 在网页上显示内容\n\n左大括号的放置通常有两种样式，如下所示：\n\
  \n```php\nif(the sky is blue)\n{\n    put leash on dragon;\n    take dragon for\
  \ a walk in the park;\n}\n\nif(the sky is blue) {\n    put leash on dragon;\n  \
  \  take dragon for a walk in the park;\n}\n```\n\n我们在本书中使用第一种样式，因为我们认为它更容易阅读。然而，许多人使用第二种样式，因为它可以节省脚本中的行数。\n\
  \n## 在网页上显示内容\n\n你使用 `echo` 语句在网页上显示内容。`echo` 语句产生输出，输出被发送到用户的浏览器。浏览器将输出处理为 HTML。\n\
  \n`echo` 语句的一般格式为：\n\n`echo outputitem, outputitem, outputitem, ...`\n\n其中适用以下规则：\n\
  \n- `outputitem` 可以是一个数字、字符串或变量（变量的使用将在在本章稍后的“使用 PHP 变量”节中讨论）。字符串必须包含在引号内。\n- 根据需要列出尽可能多的\
  \ `outputitem`，并用逗号隔开。\n\n表 1-1 显示了某些 `echo` 语句及其输出。\n\n### 表 1-1: echo 语句\n\n|\
  \ echo 语句 | 输出 |\n| :--- | :--- |\n| `echo “Hello”;` | Hello |\n| `echo 123;` |\
  \ 123 |\n| `echo “Hello”,”World!”;` | HelloWorld! |\n| `echo Hello World!;` | 无效；会导致错误消息\
  \ |\n| `echo “Hello World!”;` | Hello World! |\n| `echo ‘Hello World!’;` | Hello\
  \ World! |\n\n`echo` 语句输出发送到浏览器的文本。浏览器将该文本视为 HTML 并以这种方式进行处理。因此，你需要确保你的输出是有效的 HTML\
  \ 代码，用于描述你想让用户看到的网页。\n\n当你想要使用 PHP 显示网页（或网页的一部分）时，你需要考虑生成网页的三个阶段：\n\n- **PHP 脚本：**\
  \ 你编写的 PHP `echo` 语句。\n- **HTML 源代码：** 当你在浏览器中选择“查看➪源文件”时看到的网页源代码。`source code`\
  \ 即是 `echo` 语句的输出。\n- **网页：** 你的用户看到的网页。网页由 HTML 源代码产生。\n\n`echo` 语句会将你 echo 的内容原封不动送到浏览器——不多不少。如果你没有\
  \ echo 任何 HTML 标签，就一个都不会发送。\n\nPHP 允许一些格式化输出的特殊字符，但它们不是 HTML 标签。PHP 特殊字符只影响 `echo`\
  \ 语句的输出——而不影响网页上的显示。例如，如果你想在 PHP 输出中换行，你必须包含一个特殊字符（`\\n`），告诉 PHP 开始新行。然而，这个特殊字符只是在输出中开启新行；它*并没有*发送一个\
  \ HTML 标签在网页上开启新行。表 1-2 显示了三个阶段的示例。\n\n### 表 1-2: 网页交付的阶段\n\n| echo 语句 | HTML 源代码\
  \ | 网页显示 |\n| :--- | :--- | :--- |\n| `echo “Hello World!”;` | Hello World! | Hello\
  \ World! |\n| `echo “Hello World!”;` | Hello World! | Hello World! |\n| `echo “Here\
  \ I am!”;` | Here I am! | Here I am! |\n| `echo “Hello World!\\n”;` | Hello World!\
  \ | Hello World! |\n| `echo “Here I am!”;` | Here I am | Here I am! |\n| `echo “Hello\
  \ World!”;` | Hello World!<br /> | Hello World! |\n| `echo “<br />”;` | Here I am!”\
  \ | Here I am! |\n| `echo “Here I am!”;` | Here I am! | Here I am! |\n| `echo “Hello”;`\
  \ | Hello World!<br /> | Hello World! |\n| `echo “ World!\\n”;` | Here I am!” |\
  \ Here I am! |\n| `echo “Here I am!”;` | Here I am! | Here I am! |\n\n表 1-2 总结了三个阶段之间的差异。\n\
  \n## PHP 基础\n\n*变量*是用于存储信息的容器。变量有一个名称，信息存储在变量中。例如，你可能会将变量命名为 `$age` 并在其中存储数字 12。信息存储在变量后，可以在脚本的后续部分中使用。\n\
  \n### 变量命名\n\n当你为变量命名时，请记住以下规则：\n\n- 所有变量名前面都有一个美元符号 `$`。这告诉 PHP 这是一个变量名。\n- 变量名可以可以是任何长度。\n\
  - 变量名只能包含字母、数字和下划线。\n- 变量名必须以字母或下划线开头。不能以数字开头。\n- 大写字母和小写字母是不相同的。例如，`$firstname`\
  \ 和 `$Firstname` 不是同一个变量。如果你将信息存储在 `$firstname` 中，你无法通过变量名 `$firstName` 访问该信息。\n\
  \n\n\n\n# 在命名变量时，请使用能清晰说明变量中包含信息的名称。使用像 `$var1`、 `$var2`、 `$A` 或 `$B` 这样的变量名无法提高脚本的清晰度。虽然\
  \ PHP 不关心你如何命名变量，也不会将其混淆，但尝试理解脚本的人将很难跟踪哪个变量存储了什么信息。像 `$firstName`、 `$age` 和 `$orderTotal`\
  \ 这样的变量名更具描述性且更有帮助。\n\n## 创建并为变量赋值\n\n变量可以存储数字或字符字符串。你使用单个等号（`=`）向变量中存储信息。例如，以下四个\
  \ PHP 语句为变量分配信息：\n\n```php\n$age = 12;\n$price = 2.55;\n$number = -2;\n$name = “Little\
  \ Bo Peep”;\n```\n\n注意字符字符串被引号括起来，而数字没有。我们将在本章节后面的“理解数据类型”部分更多地讨论如何使用数字和字符。\n\n\
  每当你将信息放入一个之前不存在的变量时，你就创建了该变量。例如，假设你使用了以下 PHP 语句：\n\n```php\n$firstname = “George”;\n\
  ```\n\n如果该语句是你第一次提到 `$firstname` 变量，那么该语句将创建该变量并将其设置为“George”。如果你有一条之前的语句将 `$firstname`\
  \ 设置为“Mary”，那么该语句会将 `$firstname` 的值改为“George”。\n\n你也可以从变量中移除信息。例如，以下语句从变量 `$age`\
  \ 中取出信息：\n\n```php\n$age = “”;\n```\n\n变量 `$age` 存在，但不包含任何值。这并不意味着 `$age` 被设置为 `0`（零），因为\
  \ `0` 是一个值。这意味着 `$age` 不存储任何信息。它包含一个长度为 0 的字符串。\n\n你甚至可以进一步通过使用此语句销销该变量：\n```php\n\
  unset($age);\n```\n\n在执行该语句后，变量 `$age` 不再存在了。\n\n## 使用 PHP 变量\n\n### 使用变量变量\n\n\
  PHP 允许你使用动态变量名，称为“变量变量”。你可以使用存储在另一个变量中的值来为变量命名。也就是说，一个变量包含了另一个变量的名字。例如，假设你想创建一个名为\
  \ `$city` 且值为 Los Angeles 的变量。\n\n```php\n$name_of_the_variable = “city”;\n```\n\
  \n该语句创建了一个包含你想要给变量命名的变量。然后，你使用以下语句：\n\n```php\n$$name_of_the_variable = “Los Angeles”;\n\
  ```\n\n注意变量名开头额外的美元符号（`$`）字符。这表示一个变量变量。该语句创建了一个以 `$name_of_the_variable` 中的值为名字的新变量，结果如下：\n\
  \n```php\n$city = “Los Angeles”;\n```\n\n`$name_of_the_variable` 的值没有改变。\n\n下面的示例展示了此功能是如何工作的。在目前的形式下，脚本语句可能看起来并不有用；你可能有更好的方法来编写此任务。当变量变量与数组和循环一起使用时，其真实价值就会变得显而易见，正如本手册第\
  \ 2 章讨论的那样。\n\n假设你想用城市名称命名一系列变量，其值为城市的人口。你可以使用以下代码：\n\n```php\n$Reno = 360000;\n\
  $Pasadena = 138000;\n$cityname = “Reno”;\necho “The size of $cityname is ${$cityname}”;\n\
  $cityname = “Pasadena”;\necho “The size of $cityname is ${$cityname}”;\n```\n\n\
  该代码的输出是：\n\n```\nThe size of Reno is 360000\nThe size of Pasadena is 138000\n```\n\
  \n注意，你需要在 `echo` 语句的变量名周围使用大括号，以便 PHP 知道变量名从哪里开始。如果你在不带大括号的情况下使用该语句，输出如下：The size\
  \ of Reno is $Reno.。\n\n在 `$$cityname` 中如果不使用大括号，PHP 会将 `$cityname` 转换为其值，并将额外的\
  \ `$` 放在它前面，作为前一个字符串的一部分。\n\n### 显示变量值\n\n你可以使用以下任何语句显示变量中的值：\n\n- `echo`\n- `print_r`\n\
  - `var_dump`\n\n#### 在 echo 语句中使用变量\n\n你可以使用 `echo` 语句在 Web 上显示变量的值。例如，如果你在 PHP\
  \ 部分使用以下 PHP 语句：\n\n```php\necho $age;\n```\n\n输出是 12。如果你在 HTML 文件中包含以下行：\n\n```html\n\
  <p>Your age is <?php echo $age ?>.</p>\n```\n\nWeb 页面上的输出是：Your age is 12.。\n\n\
  表 1-3 显示了某些 echo 语句中变量的使用及其输出。为了表格起见，假设 `$string1` 被设置为 Hello，而 `$string2` 被设置为\
  \ World!。\n\n**表 1-3: echo 语句**\n\n| echo 语句 | 输出 |\n| :--- | :--- |\n| `echo $string1;`\
  \ | Hello |\n| `echo $string1,$string2;` | HelloWorld! |\n| `echo “$string1 $string2”;`\
  \ | Hello World! |\n| `echo $string1,$string2;` | Hello World! |\n| `echo “$string1\
  \ $string2”;` | Hello! World! |\n\n\n\n\n当脚本中的多处需要一个值且该值在脚本执行过程中不会改变时，就会使用常量。该值在脚本开始时设置在常量。在整个脚本中使用常量而不是变量，可以确保该值不会被意外修改。通过给它命名，你可以立即知道该信息的含义。而且，通过在脚本开始时设置一次常量（而不是在整个脚本中使用该值），如果需要，你可以在一个地方更改常量的值，而不需要在脚本的许多地方搜索该值并进行修改。\n\
  \n例如，你可能会设置一个代表公司名称的常量以及另一个代表公司地址的常量，并在需要的地方使用它们。那么，如果公司搬迁了，你只需要更改脚本开头公司地址常量的值，而无需找到并修改脚本中所有输出公司名称的地方。\n\
  \n# 理解数据类型\n\n你通过 `define` 语句来设置常量。格式为 `define(\"常量名\", \"常量值\");`。\n\n例如，要设置一个公司名称的常量，请使用以下语句：\n\
  \n```php\ndefine(\"COMPANY\",\"My Fine Company\");\n```\n\n在脚本中需要公司名称的地方使用常量：`echo\
  \ COMPANY;`\n\n## 第二部分\n\n## 第一章\n\n当你输出一个常量时，不能将其包含在引号中。如果你这样做，输出的是常量的名称，而不是它的值。你可以像前一个示例那样直接输出它，或者将其包含在括号中。\n\
  \n## PHP 基础\n\n你可以使用任何可以用于变量的名称来命名常量。\n\n常量名称的前面没有美元符号 (`$`)。按照惯例，常量的名称全部使用大写字母，这样你可以轻松识别出常量，但\
  \ PHP 本身并不关心你给常量起什么名字。你没非要使用大写，这只是为了清晰。你可以在其中存储字符串或数字。以下语句对 PHP 来说是完全没：`define (\"\
  AGE\",29);`。\n\n### 理解数据类型\n\n存储在变量或常量中的值是以特定类型的数据存储的。PHP 提供了八种数据类型：\n\n- **整数 (Integer):**\
  \ \n- **浮点数 (Floating-point number):** 带有小数位的数值\n- **字符串 (String):** 一系列字符\n- **布尔值\
  \ (Boolean):** 可以为真或为假的值\n- **数组 (Array):** 存储在一个变量中的一组值\n- **对象 (Object):** 用类创建的结构\n\
  - **资源 (Resource):** 标识连接的引用\n- **空 (NULL):** 表示无值的值\n\n整数、`float`、`string`、`Boolean`\
  \ 和 `NULL` 数据类型将在后续章节中讨论。数组将在本章稍后的“使用数组”部分讨论。对象将在本微型教程的第 4 章讨论。\n\n在编写 PHP 脚本时，你不需要指定你正在存储哪种数据类型。PHP\
  \ 会自动确定数据类型。以下两个语句存储了不同的数据类型：\n\n```php\n$var1 = 123;\n$var2 = “123\";\n```\n\n\
  `var1` 的值被存储为整数。`var2` 的值被存储为字符串，因为它包含在引号中。\n\nPHP 在需要时会自动转换数据类型。例如，如果你加上两个变量（一个包含整数，另一个包含浮点数），PHP\
  \ 会将整数转换为浮点数以便将两者相加。\n\n有时，你可能希望将值存储为与 PHP 自动存储的不同的类型。你可以通过*类型转换 (cast)* 为变量设置数据类型，如下：\n\
  \n```php\n$var3 = “222”;\n$var4 = (int) $var3;\n```\n\n该语句将 `$var4` 设置为 `$var3`\
  \ 的值，将值从字符串改为整数。你也可以使用 `(float)` 或 `(string)` 进行转换。\n\n你可以通过 `var_dump()` 查看变量中存储的是哪种数据类型。例如，你可以如下所示显示变量：\n\
  \n```php\nvar_dump($var4);\n```\n\n该语句的输出如下：\n\n```\nint(222)\n```\n\n## 处理整数和浮点数\n\
  \n整数是整数，例如 1、10 和 333。浮点数（也称为实数）是包含小数的数字，例如 3.1 或 .667。PHP 会自动将值存储为整数或浮点数。\n\n###\
  \ 对数值类型执行算术运算\n\nPHP 允许对数字执行算术运算。你通过两个数字和一个算术运算符来指示算术运算。例如，一个运算符是加号 (`+`)，你可以这样指示算术运算：\n\
  \n```php\n1 + 2\n```\n\n你也可以对包含数字的变量执行算术运算，如下：\n\n```php\n$n1 = 1;\n$n2 = 2;\n$sum\
  \ = $n1 + $n2;\n```\n\n你可以将两个不同数据类型的数字相加，如下：\n\n```php\n$n1 = 1.5;\n$n2 = 2;\n$sum\
  \ = $n1 + $n2;\n```\n\nPHP 将 `$n2` 转换为浮点数并将两个值相加。\n\n### 算术运算符\n\nPHP 提供了五种算术运算符：\n\
  \n| 运算符 |  |\n| :--- | :--- |\n| `+` | 两个数字相加。 |\n| `-` | 从第一个数字减去第二个数字。 |\n| `\\\
  *` | 两个数字相乘。 |\n| `/` | 将第一个数字除以第二个数字。 |\n| `%` | 求第一个数字除以第二个数字的数。这被称为取模。 |\n\n\
  你可以一次执行多个算术运算。例如，运算的顺序很重要。PHP 先执行乘法和除法，然后执行加法和减法。因此，PHP 从左到右执行：\n\n```php\n$result\
  \ = 1 + 2 \\* 4;\n```\n\n你可以通过括号改变算术运算的顺序。括号内的算术先执行。例如，你可以用括号写之前的语句：\n\n```php\n\
  $result = (1 + 2) \\* 4;\n```\n\n### 将数字格式化为金额\n\n通常你处理的数字是金额，例如产品价格。你希望客户在网页上以正确的格式看到价格。换句话说，金额应该始终保留两位。然而，PHP\
  \ 以最高效率存储和显示数字。如果数字是 10.00，它会被显示为 10。为了将数字格式化，你可以使用 `sprintf`。以下语句将数字格式化为金额格式：\n\
  \n```php\n$newvariablename = sprintf(“%01.2f”, $oldvariablename);\n```\n\n例如，以下语句以正确的格式显示金额：\n\
  \n```php\n$price = 25;\n$f_price = sprintf(“%01.2f”,$price);\necho “$f_price”;\n\
  ```\n\n你在网页上看到：\n\n25.00\n\n如果你用 `var_dump($f_price)` 显示变量，输出为 `string(5) “25.00”`。\n\
  \n\n\n\n\n如果你想在数字中使用逗号来分隔千分位，可以使用 `number_format`。以下语句创建了一个带有逗号的美元格式数字：\n\n```php\n\
  $price = 25000;\n$f_price = number_format($price, 2);\necho “$f_price”;\n```\n\n\
  你会在网页上看到以下内容：\n25,000.00\n\n`number_format` 语句中的 `2` 将格式设置为保留两位小数。你可以使用任何数字来获取任意位数的小数。\n\
  \n## 处理字符串\n\n## 第二部分：第一章\n\n`character string`（字符字符串）一系列字符。字符包括字母、数字和标点符号。当数字被用作字符时，它只是一个存储的字符，与字母相同。它不能用于算术运算。例如，`PHP\
  \ Basics` 中的电话号码被存储为字符字符串，因为它只需要被存储——而不是进行加法或乘法。\n\n### 将字符串赋值给变量\n\n将字符字符串存储在变量中时，通过使用双引号或单引号告诉\
  \ PHP 字符串的开始和结束。例如，以下两个语句产生相同的结果：\n\n```php\n$string = “Hello World!”;\n$string\
  \ = ‘Hello World!’;\n```\n\n假设你想要存储如下所示的字符串：\n\n```php\n$string = ‘It is Sally’s\
  \ house’;\necho $string;\n```\n\n这些语句无法工作，因为当 PHP 看到 Sally 后面的 '（单引号）时，它认为这是字符串的结束，从而显示以下内容：\n\
  It is Sally\n\n你需要告诉 PHP 将单引号（`‘`）解释为撇号，而不是字符串的结束。你可以在单引号前面使用反斜杠（`\\\\`）来实现这一点。反斜杠告诉\
  \ PHP 该单引号没有特殊含义；它只是一个撇号。这被称为字符*转义*（escaping）。使用以下语句显示整个字符串：\n\n```php\n$string\
  \ = ‘It is Sally\\'s house’;\necho $string;\n```\n\n同样，当你用双引号包裹字符串时，也必须在字符串中的任何双引号前面使用反斜杠。\n\
  \n### 在字符串中使用单引号和双引号\n\n单引号字符串和双引号字符串的处理方式不同。单引号字符串是按字面意思存储的，`\\\\’` 除外，后者会被存储为撇号。在双引号字符串中，变量和某些特殊字符在字符串存储之前会被求值。以下是代码中使用双引号或单引号时最重要的区别：\n\
  \n✦ **处理变量：** 如果你将变量包含在双引号中，PHP 将使用变量的值。然而，如果你将变量包含在单引号中，PHP 将使用字面变量名。例如，如果你使用以下语句：\n\
  \n```php\n$month = 12;\n$result1 = “$month”;\n$result2 = ‘$month’;\necho $result1;\n\
  echo “<br />”;\necho $result2;\n```\n\n输出为：\n12\n$month\n\n更多示例请参考本章前面的表 1-3。\n\n\
  ✦ **换行：** 特殊字符 `\\n` 告诉 PHP 开始换行。当你使用双引号时，PHP 在 `\\n` 处换行；使用单引号时，`\\n` 是字面字符串。例如，使用以下语句时：\n\
  \n```php\n$string1 = “String\\ndouble quotes”;\n$string2 = ‘String\\nsingle quotes’;\n\
  ```\n\n`string1` 的输出是：\nString\ndouble quotes\n而 `string2` 的输出是：\nString\\single\
  \ quotes\n\n✦ **插入制表符：** 特殊字符 `\\t` 告诉 PHP 插入一个制表符。当你使用双引号时，PHP 在 `\\t` 处插入制表符，但使用单引号时，`\\\
  t` 是字面字符串。例如，使用以下语句时：\n\n```php\n$string1 = “String\\tdouble quotes”;\n$string2\
  \ = ‘String\\tsingle quotes’;\n```\n\n`string1` 的输出是：\nString double quotes\n而 `string2`\
  \ 的输出是：\nString\\single quotes\n\n包裹整个字符串的引号决定了变量和特殊字符的处理，即使字符串内部还有其他的引号。例如，看以下语句：\n\
  \n```php\n$number = 10;\n$string1 = “There are $number people in line.”;\n$string2\
  \ = ‘There are $number people waiting.’;\necho $string1,”<br />”;\necho $string2;\n\
  ```\n\n输出如下：\nThere are 10 people in line.\nThere are $number waiting.\n\n### 连接字符串\n\
  \n你可以使用点（`.`）来连接字符串，这个过程被称为*拼接*（concatenation）。例如，你可以通过以下语句连接字符串：\n\n```php\n$string1\
  \ = ‘Hello’;\n$string2 = ‘World!’;\n$stringall = $string1.$string2;\necho $stringall;\n\
  ```\n\n`echo` 语句的输出是 HelloWorld!\n\n注意 Hello 和 World 之间没有空格。这是因为在连接的两个字符串中没有包含空格。你可以通过连接语句而不是之前的语句在单词之间添加空格：\n\
  \n```php\n$stringall = “Hello”;\n$stringall .= “ World!”;\necho $stringall;\n```\n\
  \necho 语句的输出是：\nHello World!\n\n你也可以拆分字符串。你可以在指定的字符处分离它们，或者在字符串中查找子字符串。你可以使用函数对字符串进行这些操作。我们将在第二章中介绍函数。\n\
  \n### 存储长字符串\n\nPHP 提供了一种名为 `heredoc` 的功能，用于赋值跨多行的长字符串。`heredoc` 允许你指定从哪里开始和结束字符串。`heredoc`\
  \ 语句的格式如下：\n\n```php\n$varname = <<<ENDSTRING\ntext\nENDSTRING;\n```\n\n`ENDSTRING`\
  \ 是你想要的任何字符串。通过在开头和结尾输入 `ENDSTRING` 来将文本存储在变量 `$varname` 中。当 PHP 处理 `heredoc` 时，它读取第一个\
  \ `ENDSTRING` 并知道开始读取文本。它继续读取文本，直到遇到同一个 `ENDSTRING`。\n\n此时，它结束字符串。由 `heredoc` 语句创建的字符串以类似于双引号的方式评估变量和特殊字符。\n\
  \n以下语句使用 `heredoc` 方法创建字符串：\n\n```php\n$distance = 10;\n$herevariable = <<<ENDOFTEXT\n\
  The distance between\nLos Angeles and Pasadena\nIs $distance miles.\nENDOFTEXT;\n\
  echo $herevariable;\n```\n\necho 语句的输出如下：\nThe distance between Los Angeles and\
  \ Pasadena is 10 miles.\n\n但要注意，PHP 对 `ENDSTRING` 非常挑剔。当它第一次出现时，`ENDSTRING`（在本例中为\
  \ ENDOFTEXT）必须出现在行末尾，后面不能有任何内容，甚至是空格。而最后一行的 `ENDSTRING` 必须出现在行的开头，前面不能有任何内容，甚至是空格，除了分号外不能有任何内容。如果违反了这些规则，PHP\
  \ 将无法识别结束字符串，并在整个脚本中继续寻找。它最终会显示一个解析错误，行号为脚本的最后一行。\n\n## 处理布尔类型\n\n布尔数据类型只有 `true`\
  \ 或 `false` 两个值。你可以如下所示给变量赋值布尔值：\n\n```php\n$var1 = true;\n```\n\nPHP 将变量设置为布尔数据类型。布尔值用于在条件语句（如\
  \ `if` 语句）比较值和表达式。比较值将在本手册第二章中详细讨论。\n\n### PHP Basics\n\n以下值被 PHP 评估为假：\n\n✦ 单词\
  \ `false`\n✦ 整数 `0`\n✦ 浮点数 `0.0`\n\n\n\n\n\n*✦ 一个空字符串\n*✦ 值为 0 的字符串\n*✦ 一个空数组\n\
  *✦ 一个空对象\n*✦ NULL 值\n\n如果变量包含的值不被求值为假（false），则它被赋值为值 `true`。\n\n## 使用 NULL 数据类型\n\
  \n唯一属于 `NULL` 数据类型的值是 `NULL`。你可以按照如下方式将该值赋值给变量：\n\n```php\n$var1 = NULL;\n```\n\n\
  带有 `NULL` 值的变量不包含任何值。\n\n## 使用数组\n\n数组是复杂的变量。一个 `array` 在单个变量名下存储一组值。数组适用于存储相关的值。例如，你可以在一个名为\
  \ `$flowerinfo` 的单个数组中存储有关花卉的信息（如品种、颜色和成本）。数组中的信息可以很方便地处理、访问和修改。例如，PHP 有多种方法可以对数组进行排序。接下来的章节将为你介绍数组的详细信息。\n\
  \n### 创建数组\n\n创建数组简单的方法是在变量名末尾加上方括号 `[]` 并为其赋值一个值。例如，假设你在脚本之前的任何地方都没有引用过 `$cities`，以下语句将创建一个名为\
  \ `$cities` 的数组：\n\n```php\n$cities[1] = “Phoenix”;\n```\n\n此时，名为 `$cities` 的数组已经创建，并且它只有一个值：Phoenix。接下来，你使用以下语句：\n\
  \n```php\n$cities[2] = “Tucson”;\n$cities[3] = “Flagstaff”;\n```\n\n现在，数组 `$cities`\
  \ 包含了三个值：Phoenix、Tucson 和 Flagstaff。\n\n数组可以被视为 `key/value pairs`（键值对）列表。每个键值对被称为\
  \ `element`（元素）。要获取特定的值，你需要在括号中指定 `key`（键）。在前面的数组中，键是数字——1、2 和 3。然而，你也可以使用单词作为键。例如，以下语句创建了一个州首的数组：\n\
  \n```php\n$capitals['CA'] = “Sacramento”;\n$capitals['TX'] = “Austin”;\n$capitals['OR']\
  \ = “Salem”;\n```\n\n你可以使用快捷方法，而不是为每个数字编写单独的赋值语句。其中一种快捷方法使用以下语句：\n\n```php\n$cities[]\
  \ = “Phoenix”;\n$cities[] = “Tucson”;\n$cities[] = “Flagstaff”;\n```\n\n当你使用这种快捷方法创建数组时，值会自动分配从数字\
  \ 0 开始的序列号作为键。例如，以下语句 \n\n```php\necho “$cities[0]”;\n```\n\n会输出 Phoenix。\n\n在带有数字索引的数组中，第一个值的索引是\
  \ 0，除非你刻意将其设置为不同的数字。在处理数组时，一个常见的错误是将第一个数字认为是 1 而不是 0。\n\n一个更 get 快捷方法是使用以下语句：\n\n\
  ```php\n$cities = array( “Phoenix”，“Tucson”，“Flagstaff”);\n```\n\n该语句创建了与前面的快捷方法相同的数组，并且带有数字索引的键。你可以使用类似的语句来创建以单词作为键的数组。例如，以下语句创建了州首的数组：\n\
  \n```php\n$capitals = array( “CA” => “Sacramento”, “TX” => “Austin”, “OR” => “Salem”\
  \ );\n```\n\n### 查看数组\n\n你可以像这样输出数组值：\n\n```php\necho $capitals['TX'];\n```\n\n\
  如果你在一个由双引号括的较长的 echo 语句中包含数组值，你可能需要将数组值的名称括在大括号中：`echo “The capital of Texas is\
  \ {$capitals['TX']}<br />”。`。你可以通过 `print_r` 或 `var_dump` 语句查看任何数组的结构和值。要显示 `$capitals`\
  \ 数组，可以使用以下语句之一：\n\n```php\nprint_r($capitals);\nvar_dump($capitals);\n```\n\n此\
  \ `print_r` 语句提供了如下输出：\n\n```text\nArray\n(\n    [CA] => Sacramento\n    [TX] =>\
  \ Austin\n    [OR] => Salem\n)\n```\n\n`var_dump` 语句提供了如下输出：\n\n```text\narray(3)\
  \ {\n  [\"CA\"]=>string(10) “Sacramento”\n  [\"TX\"]=>string(6) “Austin”\n  [\"\
  OR\"]=>string(5) “Salem”\n}\n```\n\n`print_r` 输出显示数组中每个元素的键和值。`var_dump` 输出显示数据类型以及键和值。\n\
  \n当你在 Web 页面上显示 `print_r` 或 `var_dump` 的输出时，它是以 HTML 格式显示的，这意味着它显示为一长行。为了在 Web 上以我们在这里描述的有用格式查看输出，可以使用以下语句发送\
  \ HTML 标签，告诉浏览器按接收到的内容显示文本而不进行更改：\n\n```php\necho “<pre>”;\nprint_r($capitals);\n\
  echo “</pre>”;\n```\n\n### 从数组中删除值\n\n有时你需要完全从数组中删除一个元素。例如，假设你有如下一个包含五个元素的数组：\n\n\
  ```php\n$cities[0] = Phoenix\n$cities[1] = Tucson\n$cities[2] = Flagstaff\n$cities[3]\
  \ = Tempe\n$cities[4] = Prescott\n```\n\n现在你决定不再想包含 Tempe，因此你使用以下语句尝试从数组中移除 Tempe：`$cities[3]\
  \ = \"\";”。`\n\n尽管此语句将 `$cities[4]` 设置为空空字符串，但它并没有从数组中删除该元素。你仍然拥有一个包含五个元素的数组，但五个值中的一个是空的。要从数组中完全删除该元素，你需要使用以下语句用\
  \ `unset` 取消它：\n\n```php\nunset($cities[3]);\n```\n\n现在你的数组只有四个元素了，如下：\n\n```php\n\
  $cities[0] = Phoenix\n$cities[1] = Tucson\n$cities[2] = Flagstaff\n$cities[4] =\
  \ Prescott\n```\n\n## 排序数组\n\n数组最用的特性之一是 PHP 可以为它们进行排序。\n\nPHP 最初按照你创建元素的顺序存储数组元素。\n\
  \n如果你在不改变顺序的情况下显示整个数组，元素将按照你创建它们的顺序进行显示。通常，你想要更改这种顺序。例如，你可能想按值或按键按字母顺序显示数组。\n\n\
  PHP 可以通过多种方式对数组进行排序。要对数字为键的数组进行排序，使用如下 `sort` 语句：\n\n```php\nsort($cities);\n```\n\
  \n该语句对值进行排序并分配新的数字键。数字在前，大写字母在后，小写字母最后。例如，考虑前面提到的 `$cities` 数组：\n\n```php\n$cities[0]\
  \ = “Phoenix”;\n$cities[1] = “Tucson”;\n$cities[2] = “Flagstaff”;\n```\n\n在执行以下\
  \ `sort` 语句后：\n\n数组变为\n\n```php\n$cities[0] = “Flagstaff”;\n$cities[1] = “Phoenix”;\n\
  $cities[2] = “Tucson”;\n```\n\n如果你使用 `sort()` 对以单词作为键的数组进行排序，键将变为数字，单词键将被丢弃。\n\n\
  要对以单词作为键的数组进行排序，使用 `asort` 语句。该语句按值对数组进行排序并为每个值保留原始键。例如，考虑前面提到的州首数组：\n\n```php\n\
  $capitals['CA'] = “Sacramento 明天\n$capitals['TX'] = “Austin 明天\n$capitals['OR']\
  \ = “Salem 明天\n```\n\n在执行以下 `asort` 语句后：\n\n数组变为：\n\n```php\n$capitals['TX'] = “Austin\
  \ 明天\n$capitals['CA'] = “Sacramento 明天\n$capitals['OR'] = “Salem 明天\n```\n\n注意当元素重新排序时，键与值保持。\n\
  \n现在元素按字母顺序排列，正确的州键仍然对应相应的州首。如果键是数字，这些数字现在将变成不同的顺序。你不太可能对数字为键的数组使用 `asort`。\n\n\n\
  \n\n按值倒序排序；并将新数字分配为键\n\n`arsort($arrayname*)`\n\n按值倒序排序；保留原有键\n\n`ksort($arrayname*)`\n\
  \n按键排序\n\n`krsort($arrayname*)`\n\n按键倒序排序\n\n`usort($arrayname*, functionname)`\n\
  \n通过函数排序（参见本章后面 `functionname` 章节中的“使用函数”）\n\n11_167779 bk02ch01.qxp 12/17/07 8:08\
  \ PM Page 133\n\n## 使用数组\n\n133\n\n### 从数组中获取值\n\n你可以通过直接访问来检索数组中的任何单个值，如下所示：\n\n\
  ```php\n$CAcapital = $capitals['CA'];\necho $CAcapital ;\n```\n\n这些语句的输出是：\nSacramento\n\
  \n如果你使用不存在的数组元素，将显示一个通知（notice）。（请参阅**第二卷**中在本章第 1 章中“理解 PHP 错误消息”部分关于通知的内容。）例如，假设你使用了以下语句：\n\
  \n```php\n$CAcapital = $capitals['CAx'];\n```\n\n如果数组 `$capitals` 存在但没有键为 `CAx`\
  \ 的元素，你会看到以下通知：\n\n**Notice**: Undefined index: CAx in `d:\\testarray.php` on line\
  \ `9`\n\n通知不会导致脚本停止。通知后的语句将继续执行。但由于没有向 `$CAcapital` 放入任何值，任何随后的 `echo` 语句都将输出一个空格。你可以使用\
  \ `@` 符号来防止显示显示：\n\n```php\n@$CAcapital = $capitals['CAx'];\n```\n\n你可以使用 `list`\
  \ 语句一次性从数组中获取多个值，或者通过使用 `extract` 语句获取数组中的所有值。\n\n`list` 语句从数组中获取值并将它们放入变量中。以下语句包含一个\
  \ `list` 语句：\n\n```php\n$flowerInfo = array (“Rose”, “red”, 12.00);\nlist($firstvalue,$secondvalue)\
  \ = $flowerInfo;\necho $firstvalue,”<br />”;\necho $secondvalue,”<br />”;\n```\n\
  \n第一行创建了 `$flowerInfo` 数组。第三行设置了名为 `$firstvalue` 和 `$secondvalue` 的两个变量，并将 `$flowerInfo`\
  \ 中的两个值复制到这两个新变量中，就像你使用了以下两个语句一样：\n\n```php\n$firstvalue=$flowerInfo[0];\n$secondvalue=$flowerInfo[1];\n\
  ```\n\n`flowerInfo` 中的第三个值没有复制到变量中，因为 `list` 语句包含了两个变量。`echo` 语句的输出是：\nRose\nred\n\
  \n你可以使用 `extract` 从以单词作为键的数组检索所有值。每个值都被复制到与键同名的变量中。例如，假设 `$flowerInfo` 数组如下所示创建：\n\
  \n```php\n$flowerInfo = array (“variety”=>”Rose”, “color”=>”red”, “cost”=>12.00);\n\
  ```\n\n以下语句从 `$flowerInfo` 中获取所有信息并将其输出：\n\n```php\nextract($flowerInfo);\necho\
  \ “variety is $variety; color is $color; cost is $cost”;\n```\n\n这些语句的输出为：\nvariety\
  \ is Rose; color is red; cost is 12.00;\n\n### 遍历数组\n\n你通常想对数组中的每个值执行某些操作。你可能想 `echo`\
  \ 每个值、将每个值存储在数据库中，或者给数组中的每个值加 6。在技术术语中，顺序遍历数组中的每一个值被称为*迭代*（iteration）。它有时也被称为*遍历*（traversing）。这里有两种遍历数组的方法：\n\
  \n* **手动（Manually）：** 将指针从一个数组值移动到另一个数组值。\n* **使用 foreach：** 自动从头到尾遍历数组，一次处理一个值。\n\
  \n#### 手动遍历数组\n\n你可以使用指针手动遍历数组。要这样做，请将你的数组视为一个列表。想象一个指针指向列表中的一个值。指针会停在一个值上，直到你移动它。在你移动它之后，它会停在那里，直到你再次移动它。你可以使用以下指令移动指针：\n\
  \n* `current($arrayname)`: 指向当前值\n- `next($arrayname)`: 将指针移动到下一个值\n- `previous($arrayname)`:\
  \ 将指针移动到上一个值\n- `end($arrayname)`: 将指针移动到最后一个值\n- `reset($arrayname)`: 将指针移动到第一个值\n\
