  \ 上通过 RPM 文件安装 MySQL\n\n### 第 3 章\n\n可以使用 RPM 在 Linux 上安装 MySQL。虽然 RPM 代表 *Red Hat\
  \ Package Manager*，但 RPM 在大多数 Linux 发行版中可用，而不是 **Red Hat 环境**。\n\n### 设置 MySQL\n\
  \n要从 MySQL 网站提供的 RPM 文件在 Linux 上安装 MySQL，请按照以下步骤操作：\n\n1. **切换到保存下载文件的目录。**\n\n\
  例如，输入 `cd /usr/src/mysql`。\n\n有一个文件名为 `MySQL-server-`，后面跟着版本号，最后是 `.i386.rpm`。第二个文件名称相同，但中间是\
  \ `client` 而不是 `server`。\n\n2. **通过输入以下命令安装 RPM：**\n\n```\nrpm -i listofpackages\n\
  ```\n\n例如，命令可能是：\n\n```\nrpm -i MySQL-server-5.0.35-0.i386.rpm MySQL-client-5.0.35-0.i386.rpm\n\
  ```\n\n此命令安装 MySQL 软件包。它设置了你需要的 MySQL 账户和组名，并在 `/var/lib/mysql` 创建了数据目录。它还会启动 MySQL\
  \ 服务器，并在 `/etc/rc.d` 中创建相应的条目，以便 MySQL 在每次每次启动时自动启动。\n\n你需要使用具有权限成功运行 `rpm` 命令的账户，例如\
  \ root 账户。\n\n3. **要测试 MySQL 是否运行正常，输入以下内容：**\n\n```\nbin/mysqladmin --version\n\
  ```\n\n你应该能看到 MySQL 服务器的版本号。\n\n### 从 PKG 文件在 Mac 上安装 MySQL\n\n你可以使用 Mac OS X 10.2\
  \ (Jaguar) 或更高版本的 PKG 二进制包，该包是从 MySQL 网站 (www.mysql.com) 下载的。如果你的操作系统早于 OS X 10.2，则无法使用此程序包；你需要下载一个\
  \ *tarball*（一个包含许多文件和子目录的容器文件），并按照下一节所述从源码安装 MySQL。\n\n1. **为 MySQL 创建名为 `mysql`\
  \ 的用户和组供其运行。**\n\n在大多数较新的 Mac OS X 版本中，该用户和组已经存在了。\n\n07_167779 bk01ch03.qxp 12/17/07\
  \ 8:06 PM Page 58\n\n58\n\n安装 MySQL\n\n2. **切换到下载 MySQL 的目录 —— 例如，`/usr/local`。**\n\
  \n你会看到名为 `mysql-` 的包，后面跟着版本号、操作系统版本和 `dmg`，例如 `mysql-5.0.37-osx10.4-powerpc.dmg`。如果下载的文件没有\
  \ `.dmg` 扩展名，请重命名文件名以添加 `.dmg` 扩展名。\n\n3. **在 Finder 中双击其图标挂载磁盘映像。**\n\n4. **双击包图标安装\
  \ MySQL PKG。**\n\n包安装程序运行并安装包。它将 MySQL 安装在目录 `/usr/local/mysql-`，后面跟着版本号。\n\n它还会安装一个符号链接\
  \ `/usr/local/mysql/`，指向 MySQL 安装所在的目录。它通过运行脚本 `mysql_install_db` 初始化数据库，该脚本会创建\n\
  \n5. **如有，更改目录的所有者。**\n\n安装 MySQL 的目录（例如 `/usr/local/mysql-5.0.37`）应该由 root 所有。两个目录都应该属于\
  \ `mysql`。使用以下命令：\n\n```\nsudo chown -R mysql /usr/local/mysql-5.0.37\n```\n\n6.\
  \ **安装 MySQL 启动项。**\n\n为了让服务器在计算机启动时启动，你需要安装启动项，它包含在 MySQL 磁盘映像中。\n\n### 从源码文件安装\
  \ MySQL\n\n你可以通过编译源码来安装 MySQL。这个过程听起来很技术且复杂，但并非如此。然而，在开始安装之前，请完整阅读以下步骤。\n\n要从源码安装\
  \ MySQL，请按照以下步骤操作：\n\n1. **为 MySQL 创建名为 `mysql` 的用户和组供其运行。**\n\n```\ngroupadd mysql\n\
  useradd -g mysql\n```\n\n***注意：*** 不同版本的 Unix 命令语法可能略有不同，或者它们可能被称为 `addgroup` 和\
  \ `adduser`。***注意：*** 最近的 Linux 发行版和 Mac 已经创建了 mysql 账户。\n\n2. **切换到下载源码 tarball\
  \ 的目录 —— 例如，`/usr/local`。**\n\n你会看到名为 `mysql-` 的文件，后面跟着版本号和 `.tar.gz` —— 例如，`mysql-5.0.35.tar.gz`。该文件是一个\
  \ tarball。\n\n3. **通过输入命令解压 tarball：**\n\n```\ngunzip -c *filename* | tar -xvf –\n\
  ```\n\n例如：\n\n```\ngunzip -c mysql-5.0.35.tar.gz | tar -xvf –\n```\n\n你会看到一个新的名为\
  \ `mysql-*version` 的目录 —— 例如 `mysql-5.0.35`，其中包含文件和子目录。你必须使用允许在 `/usr/local` 创建文件的账户。\n\
  \n4. **进入新目录。**\n\n例如，你可能输入 `cd mysql-5.0.35`。\n\n5. **输入：**\n\n```\n./configure\
  \ --prefix=/usr/local/mysql\n```\n\n你会看到几行输出。输出将告诉你 `configure` 完成。这可能需要一些时间。\n\n\
  6. **输入 `make`：**\n\n```\nmake\n```\n\n你会看到很多行输出。输出将告诉你 `make` 完成。`make` 可能会运行一段时间。\n\
  \n7. **输入 `make install`：**\n\n```\nmake install\n```\n\n在 Mac 上，输入 `sudo make install`。\n\
  \n`make install` 完成很快。\n\n***注意：*** 你可能需要以 root 身份运行此命令。\n\n8. **输入 `scripts/mysql_install_db`：**\n\
  \n\n\n\n此命令运行一个初始化你的 MySQL 数据库的脚本。\n\n### 配置 MySQL\n\n9. **确保你的 MySQL 目录的所有权和组关系正确。使用这些命令设置所有权：**\n\
  \n```\nchown -R root /usr/local/mysql\nchown -R mysql /usr/local/mysql/data\nchgrp\
  \ -R mysql /usr/local/mysql\n```\n这些命令将 `root` 设置为数据目录外的所有 MySQL 目录的所有者，并将 `mysql`\
  \ 设置为数据目录的所有者。所有 MySQL 目录都属于 `mysql` 组。\n\n10. **使用以下命令启动 MySQL 服务器：** *在 Mac 上：*\n\
  \n```bash\ncd /usr/local/mysql\nsudo ./bin/mysqld_safe\n```\n如有，输入你的密码。按 Ctrl+Z，然后输入：`bg`\n\
  \n最后，按 Ctrl+D 或输入 `exit`。\n\n*在 Linux/Unix 上：*\n\n```bash\ncd /usr/local/mysql\n\
  bin/mysqld_safe --user=mysql &\n```\n\n11. **通过从 `/usr/local/mysql/support-files`\
  \ 复制 `mysql.server` 文件到系统启动文件所在的位置，设置你的计算机以便 MySQL 在机器启动时自动启动。**\n\n### 配置 MySQL\n\
  \nMySQL 在启动时会读取配置文件。如果你使用默认设置或安装程序，你可能不需要向配置文件中添加任何内容。然而，如果你将 MySQL 安装在非标准位置，或者希望将数据库存储在默认位置之外，你可能需要编辑配置文件。配置文件名为\
  \ `my.ini` 或 `my.cnf`。如果你使用 Windows，它位于你的系统目录（如 Windows 或 Winnt）；在 Linux、Unix 和\
  \ Mac 上，它位于 `/etc`。该文件包含几个部分和命令。在`mysqld` 部分中的以下命令有时需要更改：\n\n```ini\n[mysqld]\n\
  # MySQL 服务器将监听的 TCP/IP 端口\nport=3306\n\n# 安装目录路径。所有路径\n# 通常相对于此路径进行解析。\nbasedir=\"\
  C:/Program Files/MySQL/MySQL Server 5.0/\"\n## 数据库根路径\ndatadir=\"C:/Program Files/MySQL/MySQL\
  \ Server 5.0/Data/\"\n```\n\n行开头的 `#` 使该行变为注释。`basedir` 行告诉 MySQL 服务器 安装 安装什么位置。`datadir`\
  \ 行告诉服务器数据库所在地。你可以更改端口号，让服务器在不同的端口上监听数据库查询。\n\n## 启动和停止 MySQL 服务器\n\n如果你在 Windows\
  \ 上使用向导安装了 MySQL，在 Linux 上使用 RPM 安装，或在 Mac 上使用 PKG 文件安装，那么 MySQL 服务器在安装期间就已启动，并被设置为在计算机每次启动时自动启动。然而，你有时可能需要停止或启动服务器。例如，如果你升级了\
  \ MySQL，必须在开始升级之前关闭服务器。本节提供了启动和停止 MySQL 服务器的说明。\n\n如果你从源代码安装了 MySQL，你需要手动启动 MySQL\
  \ 服务器，并设置其在计算机启动时自动启动。启动服务器并设置在开机时启动的说明包含在本章前面的“从源文件安装 MySQL”部分中。\n\n### 在 Windows\
  \ 上控制服务器\n\n如果你正在使用 Windows NT/2000/XP/Vista，MySQL 将作为服务运行。（在配置 MySQL 时，如本章前面的“运行\
  \ MySQL 配置向导”节所述，MySQL 会被安装为服务）。你可以按照本章前面的“检查 MySQL 安装”节的描述，检查 MySQL 是否已安装为服务。接下来的章节将描述服务的启动和停止。你也可以使用\
  \ MySQL 安装时设置的命令手动启动和停止服务器。\n\n如果你正在使用 Windows 98/Me，你可以在命令提示符窗口的命令行中启动和停止服务器。接下来的章节将描述在\
  \ Windows 98/Me 上启动和停止服务器。\n\n#### Windows NT/2000/XP/Vista\n\n要停止或启动 MySQL 服务器，请执行以下操作：\n\
  \n1. **选择开始** ➔ **控制面板** ➔ **管理工具** ➔ **服务。**\n将出现所有当前服务的列表。\n2. **在字母顺序列表中滚动，并点击你想停止或启动的\
  \ MySQL 服务。**\n服务名称左侧会出现“停止”或“启动”链接。\n3. **点击停止或启动。**\n\n如果你在列表中没有找到 MySQL 服务器，可以使用配置向导（如本章前面的“运行\
  \ MySQL 配置向导”节所述）将其设置为服务。\n\n#### 手动关闭\n\n有时你可能在关闭服务器时遇到困难。你可以按照以下方法手动关闭服务器：\n\n\
  1. **通过选择开始** ➔ **程序** ➔ **附件** ➔ **命令提示符** 打开一个命令提示符（可能称为 DOS）窗口。\n2. **切换到 MySQL\
  \ 安装目录下的 `bin` 目录。**\n例如，你可能输入 `cd c:\\Program Files\\MySQL\\MySQL Server 5.0\\\
  bin`。\n3. **输入 `mysqladmin -u root -p shutdown`****\n在此命令中，账户是 `root`。`-p` 表示密码，因此系统会提示你输入密码。如果你指定的账户不需要密码，请省略\
  \ `-p`。\n\n#### Windows 98/Me\n\n如果你正在使用 Windows 98/Me，则无法将 MySQL 设置为服务。然而，你可以按照以下方法手动启动服务器：\n\
  \n1. **通过选择开始** ➔ **程序** ➔ **附件** ➔ **命令提示符** 打开命令提示符（可能称为 DOS）窗口。\n2. **切换到 MySQL\
  \ 安装目录下的 `bin` 目录。**\n例如，你可能输入 `cd c:\\Program Files\\MySQL\\MySQL Server 5.0\\\
  bin`。\n3. **输入 `mysqld`****如果此命令失败，请输入 `mysqld-nt`。你输入的程序名称取决于 MySQL 版本。\n\n如果服务器启动，则不会显示任何消息。服务器运行时，必须保持此窗口打开。如果你关闭窗口，服务器将关闭，尽管它有时不会立即关闭。如果服务器无法启动，将显示错误消息。\n\
  \n### 在 Linux/Mac 上控制服务器\n\n在 Linux、Unix 或 Mac 上安装 MySQL 时，会安装一个供你启动和停止服务器的脚本，可以使用以下命令：\n\
  \n```bash\nmysql.server start\nmysql.server stop\nmysql_server restart\n```\n\n\
  你也可以使用 MySQL 时自带的 `mysqladmin` 工具停止 MySQL 服务器。切换到 MySQL 安装目录下的 `bin` 子目录并输入\n\n\
  ```bash\nmysqladmin –u root –p shutdown\n```\n`-p` 会导致 `mysqladmin` 提示密码。如果账户不需要密码，请包含\
  \ `-p`。\n\n## 测试 MySQL\n\n你可以通过在命令行输入以下命令来测试 MySQL 是否正在运行：\n\n1. **切换到 MySQL 安装目录。**\n\
  例如，输入 `cd c:\\program files\\mysql\\mysql server 5.0`。\n注意：在 Windows 中，请打开命令提示符窗口以提供输入命令的地方。\n\
  2. **切换到 `bin` 子目录** (`cd bin`)。\n3. **输入 `mysqladmin version`****\n\n提供 MySQL 版本信息的输出显示在屏幕上。\n\
  \n你可以通过连接到 MySQL 来进一步测试其是否准备就绪。\n\n\n\n\n来自 MySQL 客户端的服务器。在安装 MySQL 时，还会安装一个名为 `mysql`\
  \ 的简单基于文本的程序。由于该程序与服务器连接，因此它被称为客户端。该程序连接到 MySQL 服务器并与服务器交换消息。该程序位于 MySQL 安装目录下的\
  \ `bin` 子目录中。\n\n要测试 MySQL 服务器正在运行并接受通信，请执行以下步骤：\n\n1. **启动客户端。**\n\n   在 Unix 和\
  \ Linux 中，输入路径/文件名（例如 `/usr/local/mysql/bin/mysql`）。\n\n   在 Windows 中，打开命令提示符窗口，然后输入路径\\\
  文件名（例如 `c:\\Program Files\\MySQL\\MySQL Server 5.0\\bin\\mysql`）。\n\n   如果您不需要使用用户名或密码，执行此命令将启动客户端。如果您需要输入用户名、密码或两者都输入，请使用以下参数：\n\
  \   - `-u user`：`user` 是您的 MySQL 账户名。\n   - `-p`：此参数会提示您输入 MySQL 账户的密码。\n\n   例如，如果您位于\
  \ `mysql` 客户端所在的目录，命令可能看起来像：`mysql -u root -p`。\n\n   输入命令后按回车键。\n\n2. **在提示时输入您的密码。**\n\
  \n   `mysql` 客户端启动，您会看到类似的内容：Welcome to the MySQL monitor. Commands end with `;`\
  \ or `\\g`。\n\n   Your MySQL connection id is 459 to server version: 5.0.15\n\n\
  \   输入 `help;` 或 `\\h` 获取帮助。输入 `\\c` 清除缓冲区。\n\n   ```\nmysql>\n   ```\n\n   如果 MySQL\
  \ 服务器没有正常运行，则会显示错误消息而不是欢迎消息。\n\n3. **通过输入 quit 退出客户端程序。**\n\n# 故障排除 (Troubleshooting)\n\
  \n本节描述了一些较为常见的 MySQL 安装问题。\n\n## 显示错误消息：Access denied（访问被拒绝）\n\n当您尝试访问 MySQL 服务器时，会显示类似下所示的错误消息：\n\
  \n`Access denied for user ‘root’@’localhost’ (using password: YES)`\n\n错误消息意味着 MySQL\
  \ 未识别出用户名和密码。该消息提供了尽可能详细的信息。在这种情况下，消息显示尝试从 `localhost` 使用账户名 `root` 和密码进行访问。如果您使用空密码访问，消息将显示\
  \ `using password: NO`。可能是 MySQL 未识别该用户名、该用户名不允许从此主机进行访问，或者密码不正确。\n\n有时错误消息显示的账户名为\
  \ `ODBC`。这是 MySQL 使用的默认账户名。通常，这意味着 MySQL 服务器根本没有接收到任何账户名/密码信息……或者没有收到它能理解的信息。\n\n\
  MySQL 访问详见于第三卷；有关更多关于账户名和密码的信息，请参阅第三卷第 2 章。\n\n## 显示错误消息：Client does not support\
  \ authentication protocol（客户端不支持身份验证协议）\n\nMySQL 密码存储在 `mysql` 数据库的表中。当 MySQL 更新到\
  \ 4.1 版本时，密码加密发生了更改，使密码更加安全。然而，旧版本的 MySQL 客户端不理解新的密码加密，并会显示类似所示的错误：\n\n`Client does\
  \ not support authentication protocol requested by server; consider upgrading MySQL\
  \ client`\n\n特别是，对 MySQL 4.1 或更高版本使用 `mysql` 客户端有时会导致此问题。最佳解决方案是升级到 PHP 5 并使用 `mysqli`\
  \ 函数。如果由于某些原因无法升级，您需要使用名为 `OLD_PASSWORD` 函数配合 `SET PASSWORD` 命令来为任何引起问题的账户设置密码。您可能使用类似下方的命令：\n\
  \n```\nSET PASSWORD FOR ‘some_user’@’some_host’ = OLD_PASSWORD('newpwd');\n```\n\
  \n设置密码的详细说明见第三卷第 2 章。\n\n## 显示错误消息：Can’t connect to . . .（无法连接到……）\n\n此处所示错误消息 2003\
  \ 通常意味着 MySQL 服务器未运行：\n\n`(2003): Can’t connect to MySQL server on ‘localhost’`\n\
  \n要纠正此问题，请按如下方式启动服务器：\n\n- **Windows：** 选择 开始 ➔ 控制面板 ➔ 管理工具 ➔ 服务。找到 MySQL 服务并点击启动。\n\
  - **Linux/Mac：** 输入 `mysql.server start`。您可能需要处于 `mysql.server` 脚本所在的目录。\n\n# MySQL\
  \ 错误日志\n\nMySQL 在启动或停止时会将消息写入日志文件。当发生错误时，它也会写入消息。如果 MySQL 意外停止，您应该始终在错误日志中寻找线索。\n\
  \n以下是您可能在错误日志中找到的一些消息：\n```\n070415 17:17:01 InnoDB: Started; log sequence number\
  \ 0 189675\n070415 18:01:05 InnoDB: Starting shutdown\n```\n\n错误日志存储在 MySQL 安装目录下名为\
  \ `data` 的子目录。错误日志具有 `.err` 扩展。\n\n# 安装 MySQL GUI 管理程序\n\nMySQL 提供了两个实用程序来管理 MySQL\
  \ 数据库：MySQL Administrator 和 MySQL Query Browser。这些程序并非您的 MySQL 工作所必需的，但它们提供了帮助您管理数据库的功能。这些程序运行在\
  \ Windows、Linux 和 Mac OS 上。\n\n- **MySQL Administrator** 提供了您管理数据库所需的功能。您可以添加和删除\
  \ MySQL 账户、添加和管理密码、添加和删除权限、启动和停止 MySQL 服务器、查看日志、制作和恢复备份以及执行其他管理任务。\n- **MySQL Query\
  \ Browser** 提供了一个图形界面，类似于浏览器界面，您可以在其中对数据库执行 SQL 查询。您可以使用按钮和拖放功能构建 SQL 查询。\n\n这两个程序都包含在一个文件中（并带有其他程序），您可以从\
  \ MySQL 网站下载并安装。\n\n从 MySQL 网站 www.mysql.com 下载适用于您操作系统的相应文件。Windows 版本的程序提供安装文件\
  \ (`mysql-gui-tools-5.0-r11a-win32.msi`)。Linux 提供了 RPM 文件，Mac OS 提供了 PKG 文件 (`mysql-gui-tools-5.0-r11-osx10.4-universal.dmg`)。\n\
  \n安装 GUI 工具与安装 MySQL 本身类似。在 Windows 上，双击下载的文件启动安装向导并按照说明操作。在 Mac 上，双击 `.dmg` 文件启动安装。在\
  \ Linux 上，输入 `RPM` 命令安装 RPM。更多说明请参阅本章较早介绍的在操作系统上安装 MySQL 的部分。\n\n## 安装 phpMyAdmin\n\
  \n在书中，当我们演示如何执行 MySQL 数据库管理所需的任务时，使用的是流行的 MySQL 管理程序 phpMyAdmin。phpMyAdmin 是一个用\
  \ PHP 编写的免费开源 Web ，它为管理 MySQL 数据库提供了完整的 Web 接口。\n\n您可以在本地机器下载并安装 phpMyAdmin，以访问本地或网络上其他机器的\
  \ MySQL 数据库。\n\n许多网络托管公司都提供 phpMyAdmin 供您在访问其计算机上的数据库时使用。\n\n\n\n\n在安装 `phpMyAdmin`\
  \ 之前，你必须安装 `MySQL` 和 `PHP`。如果你安装了 `XAMPP`，可能在安装过程中已经安装了 `phpMyAdmin`。如果没有，你可以卸载\
  \ `XAMPP` 并重新安装包含 `phpMyAdmin` 的版本。安装 `XAMPP` 的说明请参考第 5 章。\n\n后续章节提供了在你安装了 Web 服务器、`MySQL`\
  \ 和 `PHP` 之后，下载、安装和测试 `phpMyAdmin` 本身的说明。\n\n## 获取 phpMyAdmin\n\n你可以通过从 phpMyAdmin\
  \ 网站下载获取 `phpMyAdmin`。按照以下步骤操作：\n\n1. 访问 `www.phpmy.net`。\n2. 找到左上角标题为 `Downloads`（下载）的框。\n\
  3. 点击 `Latest Stable`（最新稳定版）下的 Zip 链接。\n\n下载 `phpmyadmin-version-all-languages-utf8only.zip`\
  \ 文件。（例如，版本 2.10.3 的文件名为 `phpmyadmin-2.10.3-all-languages-utf8only.zip`）。\n\n##\
  \ 安装 phpMyAdmin\n\n要安装 `phpMyAdmin`，你需要解压下载的文件，并将文件存储在 Web 服务器查找 Web 页面文件的目录（文档根）中。然后配置\
  \ `phpMyAdmin` 与你的 `MySQL` 安装进行通信。按照以下步骤安装 `phpMyAdmin`：\n\n1. 切换到存储已下载的 `phpMyAdmin`\
  \ 文件的目录。\n2. 将 `.zip` 文件中的文件解压到 Web 服务器查找 Web 页面文件的目录中。\n\nWindows 上 `Apache` 的默认文档根是\
  \ `Apache` 安装目录下的 `htdocs`；如果你更改了默认的 `Apache` 文档根，请将 `phpMyAdmin` 文件解压到新的文档根。`IIS`\
  \ 的默认目录是 `inetpub\\wwwroot`。在 Linux 中，可能是 `/var/www/html`。\n\n解压文件后，你将得到一个与 Zip\
  \ 文件同名的目录，例如 `phpmyadmin-2.10.3-all-languages-utf8only`。该目录包含多个子目录和文件。\n\n3. 将目录重命名为\
  \ `phpMyAdmin`。\n4. 进入该新目录。\n5. 创建一个新文件夹并命名为 `config`。\n6. 启动浏览器并访问 `http://localhost/phpMyAdmin/scripts/setup.php`。\n\
  \n出现 `phpMyAdmin` 设置 Web 页面，如图 3-5 所示。\n\n**图 3-5：** phpMyAdmin 设置 Web 页面。\n\n##\
  \ 设置\n\n名为 `config.inc.php` 的配置文件现在已保存存在步骤 5 中创建的 `config` 目录中。Web 页面顶部显示消息 `File\
  \ Saved`（文件已保存）。然而，此配置文件仍然为空。\n\n7. 点击 `Server` 部分的 `Add`（添加）按钮。\n\n页面出现 `Add Server`\
  \ 部分，如图 3-6 所示。\n\n8. 在 `ServerHostname` 字段中输入名称。大多数情况下，你可以输入 `localhost`。\n9. 在\
  \ `Account Name` 字段中输入 `root`。\n10. 在 `Password` 字段中输入 `root` 账户的密码。这是你在安装 `MySQL`\
  \ 时为 `root` 创建的密码。\n11. 点击 `Add Server` 部分底部的绿色 `Add` 按钮。\n12. 滚动到 `Configuration`\
  \ 部分并再次点击 `Save`（保存）按钮。\n\n你刚刚添加的服务器已保存到配置文件中。再次显示 `File Saved` 。\n\n13. 将 `config`\
  \ 目录中的 `config.inc.php` 文件复制到 `phpMyAdmin` 目录中。\n\n## 测试 phpMyAdmin\n\n安装 `phpMyAdmin`\
  \ 之后，你想测试它以确保其安装正确且运行正常。要测试 `phpMyAdmin`，打开浏览器。访问 `phpMyAdmin` 目录下的 `index.php`\
  \ 文件。例如，你可能会输入：\n\n`localhost/phpMyAdmin/index.php`\n\n出现 `phpMyAdmin` 主 Web 页面。它显示了有关你\
  \ `MySQL` 安装的信息，例如版本。图 3-7 显示了 `phpMyAdmin` 主 Web 页面。\n\n注意左侧面板显示了一个名为 `Databases`\
  \ 的字段。下拉列表包含当前存在的所有数据库。主区域左列的顶部显示了运行的 `MySQL` 服务器版本。在下方，页面显示了谁正在运行 `phpMyAdmin`（在本例中为\
  \ `root`）。\n\n### 故障排除\n\n`phpMyAdmin` 允许你管理 `MySQL` 数据库。有关使用 `phpMyAdmin` 的信息请见第三部分。\n\
  \n**图 3-7：** phpMyAdmin 主 Web 页面。\n**图 3-6：** phpMyAdmin Add Server 部分。\n**图 3-5：**\
  \ phpMyAdmin 错误页面。\n\n此错误消息表示，图 3-8 所示的用户被拒绝访问 `phpMyAdmin`。注意图 3-8 中的错误消息在标题后带有一个小小的问号（?）。如果你点击该问号，将打开相应的文档。\n\
  \n检查 `config.inc.php` 文件以查看当前的账户和密码。\n\n\n\n\n\n你可以通过在浏览器中查看 Web 页面来测试计算机上是否安装了\
  \ Web 服务器。打开浏览器，在地址栏中输入 `localhost` 或你的计算机域名（例如，`mycompany.com`）。如果已安装 Web 服务器，将会显示一个\
  \ Web 页面。例如，Apache 欢迎界面会显示以下文本：\n\n如果你能看到这些内容，说明在该系统上成功安装了 Apache Web 服务器软件。你现在可以向此目录添加内容并替换此页面。\n\
  \n## 安装和配置 Apache\n\n你无法通过选择浏览器中的`文件➪打开`或`➪打开文件`来测试你的 Web 服务器。这种查看 Web 页面文件的方法不会通过\
  \ Web 服务器。你必须在浏览器的地址栏中输入 URL 来测试服务器。\n\n如果你的机器上没有运行的 Web 服务器，将显示错误信息，例如以下内容之一：\n\
  \n- 无法连接\n- 无法显示此\n\n即使你没有正在运行的 Web 服务器，你的计算机上可能安装了 Web 服务器但尚未启动。如果是这样，你只需要启动 Web\
  \ 服务器。例如，所有最近的 Mac 都安装了 Apache，但它可能需要启动。请参考本章稍后关于获取和安装 Apache 的说明。\n\n## 安装和配置 Apache\n\
  \n所有最近版本的 Mac OS X 都预装了 Apache。大多数 Linux 发行版也包含 Apache。然而，你可能想自己安装 Apache 以获取更新的版本，或使用不同的选项进行安装。\n\
  \nWindows 不带 Apache。你必须自己进行安装。\n\n要检查 Apache 是否已安装，请按照本章前面“测试你的 Web 服务器”节中的描述，在浏览器地址栏中输入\
  \ URL（例如 `localhost`）。如果尚未尚未安装 Apache，则会显示错误信息。\n\n## 获取 Apache\n\nApache 是一个开源\
  \ Web 服务器，你可以免费下载它。\n\n### 选择 Apache 版本\n\nApache 目前有三个版本可用：`Apache 1.3`、`Apache\
  \ 2.0` 和 `Apache 2.2`。这三个版本都得到了支持和升级。PHP 软件可以在所有三个版本上运行，但某些其他与 PHP 相关的软件在 `Apache\
  \ 2.0` 或 `Apache 2.2` 上可能会出现问题。在 Windows 上，`Apache 2.0` 和 `Apache 2.2` 不支持 Windows\
  \ 9x 安装程序；它们需要 `Windows NT`、`2000`、`XP` 或 `Vista`。\n\n`Apache 2.0` 相比 `Apache 1.3`\
  \ 发生了巨大变化；`Apache 2.2` 相比 `Apache 2.0` 有变化。某些第三方模块可能在三个版本上都无法正常工作。在 `1.3` 上运行的第三方模块无法在\
  \ `Apache 2.0` 上正常工作，而在 `Apache 2.0` 上工作的模块可能在 `Apache 2.2` 上无法正常。因此，只有针对 `Apache\
  \ 2.0` 或 `Apache 2.2` 修改过的模块才能在 `Apache 2.0` 或 `Apache 2.2` 上运行。\n\n在 PHP 网站上，目前推荐的配置是使用\
  \ `PHP 4.3.0` 或更高版本配合最新版本的 `Apache 2.0`。访问 `www.php.net/manual/en/install.windows.apache2.php`\
  \ 查看 PHP 与 Apache 版本的当前状态。\n\n在编写时，当前的发布版本为 `Apache 2.2.4`、`2.0.59` 和 `1.3.37`。尝试安装你所选\
  \ Apache 版本的最新发布版，以便你的 Apache 服务器包含所有最新的安全修复和漏洞修复。`Apache 1.3` 不再添加新功能，但仍在修复漏洞，并正在解决安全问题。新版本的\
  \ `Apache 1.3` 仍在持续发布，但频率低于 `Apache 2.0` 或 `Apache 2.2`。\n\n### 从 Apache 网站下载\n\n\
  适用于所有操作系统的 Apache 均可在 Apache 官方网站上获取。你可以下载源代码并在你的操作系统上进行编译。在 Linux 和 Mac 上编译和安装源代码并不困难，但在\
  \ Windows 上需要专家知识和软件。\n\nWindows 提供了`二进制文件`——即编译好的、开箱即用的文件，只需复制到正确的位置。\n\n要从 Apache\
  \ 网站获取 Apache，请访问 `http://httpd.apache.org`。滚动到你想要下载的 Apache 版本部分并点击 `Download`。随后将显示一个包含当前版本下载链接的下载页面。\n\
  \n### 获取 Windows 版 Apache\n\nWindows 二进制文件带有一个安装程序，该程序将安装、配置并启动 Apache。在 Apache\
  \ 网站下载页上，找到你需要的 Apache 版本部分。点击 `Win32 Binary (MSI Installer)` 链接下载安装程序文件。\n\n虽然也可以以\
  \ `Zip` 格式下载 `Win32` 源代码，但从源代码编译和安装 Apache 非常困难，应仅供高级用户尝试。\n\n### 获取 Linux 版 Apache\n\
  \n大多数 Linux 发行版都包含 Apache。如果你需要安装 Apache 或升级到新版本，大多数发行版都提供了下载和安装的软件。此外，大多数 Linux\
  \ 系统提供了相应的工具。例如，Fedora 提供了 `yum` 工具。请参考你 Linux 发行版的文档了解如何下载和安装。在某些情况下，你可能需要手动安装。网站提供的软件可能不是最新的，或者不符合你的需求。要手动安装，你需要从\
  \ Apache 网站 `http://httpd.apache.org` 下载源代码。你可以从源码编译并安装 Apache。具体操作方法请参见本章稍后“在 Linux\
  \ 和 Mac 上从源码安装 Apache”节。\n\n### 获取 Mac 版 Apache\n\n所有最近版本的 Mac OS X 都预装了 Apache。如果你通过在浏览器地址栏输入\
  \ `localhost` 来测试 Apache 但没有显示页面，说明它可能已安装但未启动。要了解如何启动 Apache，请参见本章稍后“在 Mac 上安装 Apache”节。\n\
  \n如果你因为未安装或版本过旧而安装 Apache，请从 Apache 网站下载源码文件并在 Mac 上进行编译安装。从源码安装 Apache 的说明请参见本章稍后“在\
  \ Linux 和 Mac 上从源码安装 Apache”节。\n\n## 获取集成安装包\n\n你可以获取某些一次性安装 PHP、MySQL 和 Apache\
  \ 的工具包。这些包可以极大地简化安装过程。然而，提供的软件可能并不包含你所需的特性和扩展。\n\nXAMPP 是一个流行的集成安装包，它包含了 Apache、PHP\
  \ 和 MySQL。XAMPP 为 Windows 和多个 Linux 版本提供了稳定版本。此外，Mac 和 Solaris 也有 XAMPP 版本可用，但这些版本目前较新且尚不完善。XAMPP\
  \ 位于 `www.apachefriends.org/en/xampp`。使用 XAMPP 安装软件的说明请参见本文书的第 4 章或第 5 章。\n\n\n\n\
  \n包含了 Apache 2.2、PHP 5 和 MySQL 5 版本。它还安装了 `phpMyAdmin`，这是一个用于管理您的 `MySQL` 数据库的工具。WAMP5\
  \ 网站表示它兼容 Vista。WAMP5 不支持 Windows 98/Me。您可以在 `www.en.wampserver.com` 访问 WAMP5。\n\
  \nMAMP 是一个适用于 Mac 的安装包，可为 Mac OS X 安装 Apache、PHP 和 MySQL。这个免费软件包会在您的 Mac PowerBook\
  \ 或 iMac 上安装本地服务器环境。MAMP 的主要创建目的是作为您本地计算机的 PHP 开发环境，不应作为互联网的生产服务器。您可以在 `www.mamp.info`\
  \ 获取 MAMP。\n\n## 验证下载的文件\n\nApache 网站提供了在下载软件后验证软件的方法，这是一种安全预防措施，用以确保文件没有被坏人篡改。您可以使用\
  \ MD5 方法或 PGP 方法来验证文件。本书提供了 MD5 方法的说明。\n\n基本上，验证 PHP、MySQL 和 Apache 文件所使用的是相同的过程。您可以在本迷你书籍的第\
  \ 2 章中找到验证下载文件的说明。在 Apache 网站上，点击 MD5 链接查看说明中提到的 MD5 签名。\n\n## 安装 Apache\n\n以下子章节描述了如何在\
  \ Windows、Mac 和 Linux 上安装 Apache。\n\n### 在 Windows 上安装 Apache\n\n您可以在几乎任何版本的 Windows\
  \ 上安装 Apache，尽管更倾向于 Windows NT、2000、XP 和 Vista。\n\n如果 `IIS`（互联网信息服务）已在端口 80 上运行，则您无法按照以下说明安装\
  \ Apache。如果 `IIS` 正在运行，您可以在“开始➪控制面板➪管理工具➪Internet 服务管理器”中找到 IIS 控制台。如果您没有找到此菜单项，说明未安装\
  \ `IIS`。如果 `IIS` 已经在运行，您必须在安装 Apache 之前将其关闭，或者在不同的端口上安装 Apache。\n\n要安装 Apache，请按照以下步骤操作：\n\
  \n1. **双击您下载的文件。**\n   文件名为 `apache_`，后跟版本号和 `win32-x86-no_ssl.msi`。例如，`apache_2.0.59-win32-x86-no_ssl.msi`。\n\
  \   *注意：* 在 Vista 中，您可能需要右键点击文件并选择“以管理员身份运行”。\n   Apache 安装向导启动，并出现欢迎界面。\n\n2. **点击“下一步”。**\n\
  \   显示许可协议。\n\n3. **选择“我接受许可协议中的条款”并点击“下一步”。**\n   如果您不接受这些条款，则无法安装软件。将显示关于 Apache\
  \ 的信息屏幕。\n\n4. **点击“下一步”。**\n   将显示一个请求信息的屏幕。\n\n5. **输入所需信息并点击“下一步”。**\n   请求的信息有：\n\
  \   - *域名名称：* 输入您的域名，例如 `MyFineCompany.com`。如果您是为了测试而安装 Apache，并且计划仅从安装该程序的机器访问它，可以输入\
  \ `localhost`。\n   - *服务器名称：* 输入您安装 Apache 的服务器名称，例如 `www.MyFineCompany.com` 或 `s1.mycompany.com`。如果您是为了测试而安装\
  \ Apache，并且计划仅从安装该程序的机器访问它，可以输入 `localhost`。\n   - *电子邮件：* 输入您希望接收有关 Web 服务器电子邮件的地址，例如\
  \ `WebServer@MyFineCompany.com`。\n   - *运行模式：* 选择您希望 Apache 作为服务运行（在计算机启动时自动启动），还是希望在需要它时手动启动\
  \ Apache。在大多数情况下，您希望 Apache 作为服务运行。\n   将显示“安装类型”屏幕。\n\n6. **选择一种安装类型并点击“下一步”。**\n\
  \   在大多数情况下，您应该选择“完全”。只有深谙 Apache 的高级用户才应该选择“自定义”。如果您选择“自定义”，屏幕将与下方描述的屏幕略有不同。将显示一个显示\
  \ Apache 安装位置的屏幕。\n\n7. **选择您想要安装 Apache 的目录并点击“下一步”。**\n   您将看到 Apache 的默认安装目录，通常为\
  \ `C:\\Program Files\\Apache Group`。如果没问题，点击“下一步”。如果您想将 Apache 安装在不同的目录，点击“更改”并选择一个不同的目录，点击“确定”，然后点击“下一步”。出现的屏幕显示向导已准备好安装\
  \ Apache。\n\n8. **点击“安装”。**\n   如果需要，您可以在继续安装之前返回并更改之前输入的任何信息。屏幕将显示进度。安装完成后，将出现一个屏幕，说明向导已成功完成安装。\n\
  \n9. **点击“完成”退出安装向导。**\n   Apache 根据您的操作系统安装在计算机上。如果您在 Windows NT/2000/XP/Vista\
  \ 上安装，它将默认作为服务安装，并在计算机启动时自动启动。如果您在 Windows 95/98/Me 上安装，则需要手动启动或对其进行设置。请参本章后面的“启动和停止\
  \ Apache”部分。\n\n### 在 Mac 上安装 Apache\n\n所有最近版本的 Mac OS X 都安装了 Apache，但它可能没有启动。要启动\
  \ Apache，选择 Apple 菜单➪系统偏好➪共享。在“文件和网页”面板上，找到“网页”部分。点击“启动”按钮将其“开启”。\n\n如果由于某些原因您需要自己安装\
  \ Apache，可以从源码安装 Apache，见下一节。\n\n### 在 Linux 和 Mac 上从源码安装 Apache\n\n您可以在 Linux、\
  \ Mac 上从源码安装 Apache。您需要下载源代码并进行编译。从源码安装 Apache，请按照以下步骤操作：\n\n1. **进入下载文件的目录。**\n\
  \   下载的文件名为 `apache-`，后跟版本号和 `tar.gz`。\n\n2. **使用类似下面的命令解压压缩包：**\n   Mac:\n   ```bash\n\
  \   untar -xzf httpd-2.0.59.tar.gz\n   ```\n   Linux:\n   ```bash\n   gunzip -c\
  \ httpd-2.0.59.tar.gz | tar -xf\n   ```\n\n3. **使用 `cd` 命令进入解压创建的新目录（例如 `cd httpd_2.0.59`）。**\n\
  \n4. **输入配置命令。**\n   `configure` 命令由 `./configure` 以及所有必要的选项组成。要将 PHP 作为模块，，使用相应的配置命令：\n\
  \   对于 Linux 或 Unix：\n   ```bash\n   ./configure --enable-so\n   ```\n   对于 Mac：\n\
  \   ```bash\n   ./configure --enable-module=most --enable-shared=max\n   ```\n \
  \  可以使用其他选项。您可能需要使用的重要安装选项之一是 `prefix`，它设置您希望安装 Apache 的位置。默认情况下，Apache 安装在 `/usr/local/apache`\
  \ 或 `/usr/local/apache2`。您可以使用以下行更改安装位置：\n   ```bash\n   ./configure --prefix=/software/apache\n\
  \   ```\n   您可以通过以下行查看所有可用选项：\n   ```bash\n   ./configure --help\n   ```\n   此脚本可能需要一段时间才能运行完毕。运行时，它会显示输出。脚本结束后，将显示系统提示符。\n\
  \   如果 `configure` 遇到问题，它会显示描述性错误信息。\n\n5. **输入 `make` 构建 Apache 服务器。**\n\n\n\n\n\
  `make` 命令可能需要运行几分钟。它在运行时会显示消息，期间偶尔会停顿以等待进程完成运行。\n\n### 6. **输入以下命令安装 Apache：**\n\
  \n对于 Linux 或 Unix，输入：\n\n```bash\nmake install\n```\n\n对于 Mac，输入：\n\n```bash\nsudo\
  \ make install\n```\n\n### 7. **启动 Apache Web 服务器。**\n\n详情请见下一节。\n\n### 8. **在浏览器中输入你的网站的\
  \ URL（例如 www.mysite.com 或 `localhost`）来测试 Apache。**\n\n如果一切顺利，你将看到一个告诉 Apache 正在运行的\
  \ Web 页面。\n\n---\n\n# 第一卷：第 4 章\n\n## 启动和停止 Apache\n\n在安装 Apache 时，你可能需要启动它。或者也可能不需要。它可能已经在运行了。但是，每当你更改\
  \ Apache 或 PHP 的配置设置时，你都需要在新设置生效之前重启 Apache。\n\n### 在 Windows 上启动和停止 Apache\n\n\
  在 Windows NT、2000、XP 或 Vista 上安装 Apache 时，它会自动作为服务安装并启动。它是准备好可用的。在 Windows 95、98\
  \ 和 Me 上，你必须使用菜单手动启动 Apache。\n\n当你安装 Apache 时，它会创建停止和启动它的菜单项。\n\n要找到此菜单，请选择“开始➪程序➪Apache\
  \ HTTP 服务器➪控制 Apache 服务器”。该菜单包含以下项目：\n\n*   **Start（启动）：** 用于在 Apache 未运行时启动它。如果你在\
  \ Apache 运行时点击此项，你将看到一条错误消息，显示 Apache 已经启动。\n*   **Stop（停止）：** 用于在 Apache 运行时停止它。如果你在\
  \ Apache 未运行运行时点击此项，你将看到一条错误消息，显示 Apache 尚未运行。\n*   **Restart（重启）：** 用于在 Apache\
  \ 运行时重启它。如果你对 Apache 的配置更改了更改，你需要在更改生效之前重启 Apache。\n\n### 在 Linux、Unix 和 Mac 上启动\
  \ Apache\n\n可以使用一个名为 `apachectl` 的脚本来控制服务器。默认情况下，该脚本存储在 Apache 安装目录下的 `bin` 的子目录中。某些\
  \ Linux 发行版可能会将其放在另一个目录。\n\n该脚本需要一个关键字。最常见的关键字是 `start`、`stop` 和 `restart`。通用语法如下：\n\
  \n```bash\n*path*/apachectl *keyword*\n```\n\n`apachectl` 脚本启动 Apache 服务器，然后它会在后台运行并监听\
  \ HTTP 请求。默认情况下，编译后的 Apache 服务器名为 `httpd`，并存储在与 `apachectl` 脚本相同的目录下，除非你在安装期间更改了名称或位置。`apachectl`\
  \ 脚本作为编译后的服务器 `httpd` 的接口。\n\n你可以直接运行 `httpd` 服务器，但使用 `apachectl` 作为接口更好。`apachectl`\
  \ 脚本管理并检查 `httpd` 命令需要的数据。使用以下命令通过脚本启动 Apache：\n\n```bash\n/usr/local/apache/bin/apachectl\
  \ start (Linux/Unix)\nsudo /usr/local/apache/bin/apachectl start (Mac)\n```\n\n\
  `apachectl` 脚本包含一行运行 `httpd` 的代码。默认情况下，`apachectl` 在默认位置 `/usr/local/apache/bin`\
  \ 或 `/usr/local/apache2/bin` 查找 `httpd`。如果你在非标准位置安装了 Apache，你可能需要编辑 `apachectl`\
  \ 以使用正确的路径。打开 `apachectl`，然后搜索以下行：\n\n```bash\nHTTPD='//usr/local/apache2/bin/httpd'\n\
  ```\n\n将路径更改为你安装 `httpd` 的位置。例如，新行可能是：\n\n```bash\nHTTPD='//usr/mystuff/bin/httpd'\n\
  ```\n\n在启动 Apache 后，你可以通过查看计算机上的进程来检查 Apache 是否正在运行。输入以下命令显示运行中的进程列表：\n\n```bash\n\
  ps –A\n```\n\n如果 Apache 正在运行，进程列表将包含一些 `httpd` 进程。\n\n### 在 Linux、Unix 和 Mac 上重启\
  \ Apache\n\n每当你更改配置文件时，新指令将在下次启动 Apache 时生效。如果你在进行更改时 Apache 处于关闭状态，可以按照之前“在 Linux、Unix\
  \ 和 Mac 上启动 Apache”节中描述的方法启动 Apache。但是，如果 Apache 正在运行，你不能使用 `start` 来重启它。使用 `start`\
  \ 会导致错误消息，显示 Apache 正在运行。你可以使用以下命令在 Apache 当前运行时重启它：\n\n```bash\n/usr/local/apache2/bin/apachectl\
  \ restart (Linux)\nsudo /usr/local/apache2/bin/apachectl restart (Mac)\n```\n\n\
  虽然 `restart` 命令通常有效，但有时并不起作用。如果你重启了 Apache 后新设置似乎没有生效，请停止 Apache 并再次启动。有时这样可以解决问题。\n\
  \n### 在 Linux、Unix 和 Mac 上停止 Apache\n\n要停止 Apache，请使用以下命令：\n\n```bash\n/usr/local/apache/bin/apachectl\
  \ stop\nsudo /usr/local/apache/bin/apachectl stop\n```\n\n\n\n要更改任何设置，请编辑 `httpd.conf`\
  \ 文件。在 Windows 上，你可以通过“开始➪程序➪Apache HTTPD Server➪配置 Apache Server➪编辑 Apache httpd.conf\
  \ 文件”菜单访问此文件。点击此菜单项时，`httpd.conf` 文件将在 `记事本`中打开。\n\n`httpd.conf` 文件包含注释（以 `#` 开头的行），用于描述各个指令，但在更改任何指令之前，请务必确保理解它们的功能。所有指令在\
  \ Apache 网站上均有文档。\n\n## 安装和配置 Apache\n\n在添加或更改文件名和路径时，请使用正斜杠，即使是在 Windows 上也是如此。Apache\
  \ 可以自动识别。此外，除非路径包含特殊字符，否则路径不需要引号。冒号（:`）是一个特殊字符；下划线（`_`）和连字符（`-`）不是。\n\n例如，要指定 Windows\
  \ 目录，你可以使用如下内容：`c:/temp/mydir`。\n\n设置在 Apache 重启之前不会生效。有时使用 `restart` 命令无法更改设置。如果新设置似乎未生效，请尝试使用\
  \ `stop` 停止服务器然后用 `start` 启动。\n\n### 更改你的 Web 空间位置\n\n默认情况下，Apache 在 Apache 安装目录下的子目录\
  \ `htdocs` 中查找你的 Web 页面文件。你可以通过 `DocumentRoot` 指令更改此项。寻找以 `DocumentRoot` 开头的行，例如：\n\
  \n```\nDocumentRoot “C:/Program Files/Apache Group/Apache/htdocs”\n```\n\n将文件名和路径更改你想存储\
  \ Web 页面文件的位置。不要在目录路径末尾包含正斜杠（`/`）。例如，以下项可能是你的新指令：`DocumentRoot /usr/mysrver/Apache2/webpages`\n\
  \n### 更改端口号\n\n默认情况下，Apache 监听 80 端口。你可能需要更改它，例如如果你正在为测试设置第二个 Apache 服务器。通过使用 `Listen`\
  \ 指令来设置端口，格式如下：\n\n```\nListen 80\n```\n\n在 Apache 2.0 和 2.2 中，`Listen` 指令是强制性的。如果没有包含\
  \ `Listen` 指令，Apache 2 将无法启动。你可以按照以下方式更改端口号：\n\n```\nListen 8080\n```\n\n在更改任何指令后，请始终重启\
  \ Apache。\n\n## 安装 IIS\n\nInternet 信息服务（IIS）是微软发布的一个服务器。IIS 作为 Windows 2000 专业版、Windows\
  \ XP 专业版、Windows Vista 和 Windows Server 操作系统的一部分包含。Windows 2000/XP 包含的 IIS 版本没有\
  \ Windows Server 版本强大。它仅允许有限数量的人同时连接到你的 网站。因此，它作为大型公共网站的生产服务器并不好用，但作为开发服务器或内部组织使用时非常有用。\n\
  \nIIS 包含在操作系统中，但不会自动安装。你需要按照以下步骤进行安装：\n\n1. 点击`开始`。\n2. 点击`控制面板`。\n3. 双击`添加或删除程序`。\n\
  4. 点击左侧的`启用或关闭 Windows 功能`。\n5. 点击`Internet 信息服务 (IIS)`。\n6. 点击`下一步`。\n7. 完成安装向程序请求的信息。\n\
  \n对于 Windows Vista，第 3–6 步略有不同：\n\n1. 点击`开始`。\n2. 点击`控制面板`。\n3. 点击`程序和功能`。\n4. 点击右侧窗中的`启用或关闭\
  \ Windows 功能`。\n5. 勾选`Internet 服务`复选框。\n6. 点击`确定`。\n7. 完成安装向导请求的信息。\n\n## 第 5 章：使用\
  \ XAMPP 包搭建你的 Web 开发环境\n\n### 下载和安装 XAMPP\n\nXAMPP 是一个流行的合一组件，可以在一个过程中安装 Apache、`MySQL`\
  \ 和 `PHP`。XAMPP 还安装了 `phpMyAdmin`，这是一个你可以用于管理 `MySQL` 数据库的 Web 应用程序。XAMPP 可以极大简化安装过程。然而，提供的软件可能不包含你需要的特性、版本和扩展。例如，当前版本的\
  \ XAMPP 安装的是 Apache 2.2。如果你计划使用一个无法在 Apache 2.2 上运行的 `PHP` 扩展，那么 XAMPP 将无法满足你的需求。XAMPP\
  \ 安装安装了书中讨论的应用程序所需的所有软件。根据 XAMPP 网站显示，XAMPP 旨在作为本地计算机上的开发环境。作为开发环境，XAMPP 的配置尽可能开放。XAMPP\
  \ 并不用于生产环境——作为生产环境，它并不安全。在使用 XAMPP 将网站发布给公众之前，你需要加固安全性。\n\nXAMPP 有适用于 Windows 的稳定版本（包括\
  \ Windows Vista）以及多个版本的 Linux。此外，还有适用于 Mac 和 Solaris 的 XAMPP 版本，但这些版本目前较新，测试和开发程度没有\
  \ Windows 和 Linux 版本那样完善。由于 XAMPP 安装了 Apache、`MySQL` 和 `PHP`，因此仅适用于未安装这三个包中任何一个包的计算机。由于\
  \ Mac 计算机通常也有 `MySQL`/或 `PHP`，你最可能在 Windows 环境中使用 XAMPP 进行安装。出于原因，本章仅为 Windows 安装提供说明。\n\
  \n#### 获取 XAMPP\n\n你可以从 `www.apachefriends.org/en/xampp-windows.html` 下载适用于 Windows\
  \ 的 XAMPP。截至本书，XAMPP 的当前版本为 1.6.2。该版本安装了内容：\n* `MySQL` 5.0.41\n* `PHP` 5.2.2\n*\
  \ `PHP` 4.4.7\n* Apache 2.2.4\n* `phpMyAdmin` 2.10.1\n\n注意，XAMPP 安装了两个版本的 `PHP`——`PHP\
  \ 4` 和 `PHP 5`。你一次只能运行一个，不能同时运行。默认情况下，XAMPP 以 `PHP 5` 开始。安装后，你可以在 `PHP 5` 和 `PHP\
  \ 4` 之间切换。XAMPP 主页提供了切换 `PHP` 版本的链接（参见本章后面的“打开 XAMPP 网页”）。\n\n滚动页面直到下载部分。在 XAMPP\
  \ Windows [Basic Package]列表下，点击`Installer`链接下载程序版本。下载的文件命名为 `xampp-win32-`，后跟版本号，最后是\
  \ `-installer.exe`，例如 `xampp-win32-1.6.2-installer.exe`。将下载的文件保存在硬盘上容易查找的地方，如桌面。\n\
  \n#### 安装 XAMPP\n\n下载 XAMPP 后，按照以下步骤进行安装：\n1. 导航到保存下载的 XAMPP 文件的位置。该名为类似 `xampp-win32-1.6.2-installer.exe`。\n\
  2. 双击该文件。安装向导启动。\n3. 阅读并点击接几个屏幕，直到出现“选择安装位置”屏幕，如图 5-1 所示。\n\n### 测试和配置你的开发环境\n\n\
  ### 排除你的 XAMPP 安装问题\n\n\n\n\n# 选择\n\n# 安装\n\n## 位置\n\n安装向导的屏幕。\n\n除非你有非常充分的理由选择其他位置，否则最好接受默认位置（`c:\\\
  xampp`）。你可以点击 `Browse`（浏览）来选择另一个安装文件夹。\n\n如果你在 Vista 上上安装，由于保护问题，你无法将其安装在 `Program\
  \ Files` 文件夹中。此外，如果 PHP 安装在路径或文件名包含空格的文件夹中（例如 `Program Files`），PHP 有时会出现运行问题。\n\n\
