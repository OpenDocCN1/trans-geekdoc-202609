  \ center; font-size: 1.5em;\nfont-weight: bold; margin-top: 1em'>\n用户 ID, \".$SESSION['logname'].\"\
  , 已\n成功登录\";\n?>\n</body>\n```\n\n*(注：由于您提供的待翻译文本后半部分存在重复，根据“注意不要重复输出原文”的原则，此处译文仅翻译了第一遍出现的内容。如果需要翻译后续的重复部分，请告知。)*\n\
  \n\n\n\n\n即使有了分类，某些商店的单个类别下也可能包含许多产品。例如，西尔（Sears）的“连衣裙”甚至“晚礼服”类别下可能有很多种产品。在显示大量产品时，通常的做法是每页只显示固定数量的产品（通常是十个）。客户点击按钮查看下一组或上一组产品。\n\
  \n为了实现其基本功能，该在线目录应用程序应该：\n\n✦ 显示用户可以选择的产品分类。\n✦ 显示用户所选类别中的产品。它应该显示客户在购买时所需的所有产品信息。\n\
  \n它应该一次显示一个页面，如果产品列表很长，则提供“下一页”和“上一页”链接。\n\n# 创建目录数据库\n\n在线目录的核心是一个存储产品信息的数据库。\n\
  \n本质上，数据库*就是*目录。数据库存储了产品名称、订单号、描述、价格以及任何其他相关信息，例如尺寸、颜色等。\n\n## 设计目录数据库\n\n你的第一个设计任务是选择你想要存储的信息。你存储的内容取决于产品的类型。你需要存储客户在决定购买何种产品时可能用到的任何信息。商店主了解产品以及客户需要了解的内容，可以提供这些信息以及产品的图片。可能需要存储的信息包括：\n\
  \n✦ **产品名称：** 一个描述性名称，让客户知道产品是什么。\n✦ **产品 ID：** 在大多数情况下，产品名称不是唯一的，因此你通常需要存储一个 `product\
  \ number`，即用于标识产品的唯一数字。\n✦ **产品描述：** 对产品的文本描述。\n✦ **尺寸：** 产品可能有不同的尺寸。即使只有一种尺寸，客户出于某些目的也需要关于尺寸信息。例如，你可能只卖一种尺寸的咖啡桌，但客户仍然需要知道尺寸，以便判断它是否能放在他们的客厅里。\n\
  ✦ **颜色：** 产品可能有几种颜色。\n✦ **价格：** 客户肯定想知道产品多少钱！\n✦ **产品可用性：** 客户可能还想知道产品是何时添加到目录的、是否有货，或者何时到货。\n\
  \n你可以向数据库中的产品条目中添加仅供你内部使用的信息。例如，你可能会添加关于向你供产品的公司信息。这些信息存储在数据库中，但永远不会显示给客户。\n\n本示例中的商店名为“家具店”（The\
  \ Furniture Shop）。它销售家具用品。数据库只包含一张表。产品信息每个产品存储一行。表所需的字段如表 4-1 所示。\n\n### 表 4-1：数据库表：家具\n\
  \n| 变量名 | 类型 | 描述 |\n| :--- | :--- | :--- |\n| `prod_number` | `SERIAL` | 产品标识码，由\
  \ `MySQL` 顺序分配。（主键） |\n| `name` | `VARCHAR(40)` | 单个产品的名称。 |\n| `date_added` | `DATE`\
  \ | 产品添加到目录的日期。 |\n| `category` | `VARCHAR(20)` | 一级分类名称。 |\n| `type` | `VARCHAR(20)`\
  \ | 二级分类名称。 |\n| `description` | `VARCHAR(255)` | 产品描述。 |\n| `price` | `DECIMAL(7,2)`\
  \ | 产品价格。所有价格按每磅的价格输入。 |\n| `pix` | `VARCHAR(20)` | 包含产品图片的图形文件名。默认值：Missing.jpg\
  \ |\n\n该表有八个字段。除了 `description` 和 `price` 之外，所有字段均为必填（`NOT NULL`）且不能为空。`description`\
  \ 和 `price` 字段在输入产品时允许留空。稍后添加 `description` 和 `price`。\n\n`prod_number` 字段是唯一标识产品的产品编号。该字段定义为\
  \ `SERIAL`，这是 `MySQL` 的术语，意味着 `BIGINT`、`UNSIGNED`、`NOT NULL` 和 `AUTO_INCREMENT`。`SERIAL`\
  \ 是随 `MySQL` 4.1 加入的，早期版本的 `MySQL` 将无法识别。如果你使用的是较早版本的 `MySQL`，你需要使用单独的数据类型，如 `AUTO_INCREMENT`\
  \ 和 `NOT NULL`。\n\n这个数字在客户订产品时使用。这是一个 `AUTO_INCREMENT` 字段，因此当产品被添加到数据库时，`MySQL`\
  \ 会为其顺序分配数字。在某些商店中，会分配并输入有意义的产品 ID 数字，而不仅仅是顺序数字。\n\n`pix` 字段定义了一个默认文件名（`Missing.jpg`）。如果某行的该字段没有输入文件名，`MySQL`\
  \ 将将默认文件名存储在该字段中。\n\n## 构建目录数据库\n\n以下 SQL 语句创建此数据库：\n\n```sql\nCREATE DATABASE FurnitureCatalog\n\
  ```\n\n以下 SQL 语句创建表：\n\n```sql\nCREATE TABLE Furniture (\n  prod_number SERIAL,\n\
  \  name VARCHAR(20) NOT NULL,\n  date_added DATE NOT NULL,\n  category VARCHAR(20)\
  \ NOT NULL,\n  type VARCHAR(20) NOT NULL,\n  description VARCHAR(255),\n  price\
  \ DECIMAL(7,2),\n  pix VARCHAR(20) NOT NULL DEFAULT \"Missing.jpg\", PRIMARY KEY(prod_number)\
  \ \n);\n```\n\n## 访问家具数据库\n\n`PHP` 提供了 `MySQL` 函数用于从你的 `PHP` 脚本访问数据库。这些函数将在第三本书第\
  \ 5 章详细讨论。这些函数接收访问数据库所需的信息，例如用户名和密码。\n\n在该应用程序中，我们将 PHP 函数所需的信息存储在一个名为 `dbstuff.inc`\
  \ 的独立文件中。出于安全考虑，该文件存储在 Web 空间之外。文件包含如下信息：\n\n```php\n<?php\n$host = \"localhost\"\
  ;\n$user = \"admin\";\n$passwd = \"xy.34W\";\n$database = \"FurnitureCatalog\";\n\
  ?>\n```\n\n注意文件开头（`<?php`）和结尾（`?>））的 `PHP` 标签。如果你没有包含标签，信息可能会显示在 Web 页面上供全世界看到，这完全不是你想要的。此数据库旨在存储所有产品的信息。你可以以任何常用的数据库方式输入产品信息。\n\
  \n# 构建目录 Web 页面\n\n在线目录需要两种类型的 Web 页面。一个页面显示产品分类索引，客户可以在此选择感兴趣的分类。如果你的目录有子分类，你可能会多次显示索引页——每个分类级别一次。第二种类型是产品页，它显示所选类别的产品信息。\n\
  \n## 设计目录 Web 页面\n\n你无疑见过很多 Web 目录。你可能已经确切知道想要的设计，但请记住，最适合你的设计在很大程度上取决于你目录产品的类型和数量。\n\
  \n本章的目录提供家具。每个产品显示的信息是名称、描述、价格和图片。这些信息可以轻松地跨屏幕显示一行或两。其他产品可能需要更多或更少的屏幕空间。\n\n\n\n\
  \n你需要设计两种不同类型的页面：一个显示分类的索引页以及一个显示特定分类下产品的产品页。\n\n## 设计索引页\n\n索引页需要以某种形式显示分类，以便用户可以选择分类。在\
  \ particular 设计中，分类以单选按钮的形式显示。图 4-1 显示了在线目录在浏览器中显示时的索引页样式。\n\n索引 Web 页面提供了一个表单，允许用户选择分类。用户点击分类的单选按钮，然后点击\
  \ `Select Category`（选择分类）提交表单。当用户点击按钮时，将显示所选分类的产品 Web 页。\n\n索引页的代码存储在一个单独的文件，当应用程序需要显示目录索引页时包含该文件。因此，定义\
  \ Web 页的代码与提供应用程序逻辑的 PHP 代码是的。\n\n**图 4-1：**\n在线目录应用程序显示的索引页。\n\n![Image 86](img/index-590_1.jpg)\n\
  \n37_167779 bk06ch04.qxp 12/17/07 8:24 PM Page 561\n\n## 构建目录 Web 页面\n\n### 设计产品页\n\
  \n目录的产品页需要显示产品，以便客户可以看到有关产品的所有信息。如果所有产品无法挤在一个页面上，则产品页需要尽可能显示多次以向客户展示所有产品。如果显示产品需要多个页面，产品页可以提供\
  \ `Next`（下一页）和/或 `Previous`（上一页）按钮查看更多产品。某些目录仅显示产品列表以及指向包含更多信息的页面链接，该链接有时可以是关于某个产品的完整页面。\n\
  \n在这个家具商店（Furniture Shop）的设计中，产品信息占据一或两行，因此一个页面可以显示多个产品。每次显示一页产品。在页面底部显示一个带有提交按钮的表单，用户可以点击这些按钮查看下一页、上一页或返回分类页。图\
  \ 4-2 显示了在浏览器中显示的在线目录产品页。\n\n**图 4-2：**\n在线目录显示的产品页。\n\n产品页显示了两个产品的信息。页面右上角显示了该分类找到了多少产品。用户可以通过点击页面底部的\
  \ `Next 2` 按钮查看接两个产品，通过点击 `Previous` 查看之前的项目。还提供了一个按钮，允许客户返回分类页并选择不同的分类。\n\n产品页的代码存储在一个单独的文件中，索引页代码相同。当应用程序脚本需要显示产品页时，会显示该文件。\n\
  \n### 编写索引页的代码\n\n目录索引页提供了一个包含分类列表的简单表单。家具商店目录包含两个级别的分类。然而，由于目前目录分类不多，两个级别的分类都可以显示在一个索引页上。某些目录的分类非常多，一个索引页上可能只显示顶级分类。客户需要点击顶级分类来查看二级分类。但在家具商店目录中，没有必要单独显示分类层级。\n\
  \n目录索引页的代码存储在文件 `page_furniture_index.inc` 中，如列表 4-1 所示。\n\n**列表 4-1：显示索引页的文件**\n\
  \n```php\n<?php\n/* File: page_furniture_index.inc\n* Desc: Displays 目录的分类.\n*/\n\
  ?>\n<html>\n<head><title>The Furniture Shop</title>\n<style type='text/css'>\n<!--\n\
  ul li {\nlist-style: none;\nfont-weight: bold;\npadding-top: .5em;\nfont-size: 1.2em;\n\
  }\nul li.level2 {\nmargin-left: -1em;\nfont-weight: normal;\nfont-size: .9em;\n\
  }\n-->\n</style>\n</head>\n<body style=\"margin: .2in\">\n<?php\necho \"<h1 style='text-align:\
  \ center'>The Furniture Shop</h1>\n<hr />\";\n/* 创建包含选择列表的表单 */\necho \"<form action='$_SERVER[PHP_SELF]''\
  \ method='POST'>\\n\";\necho \"<ul>\\n\";\nforeach($furn_categories as $key => $subarray)\n\
  {\necho \"<li>$key</li>\\n\";\necho \"<ul>\\n\";\nforeach($subarray as $type)\n\
  {\necho \"<li class='level2'>\n<input type='radio' name='interest' value='$type'\
