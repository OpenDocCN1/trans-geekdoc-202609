  \ 35 行，它在右边栏有一个行号标注：\n\n\n本小书描述了如何编写执行你网站所需任务的 `PHP` 脚本。你将了解到如何显示和处理表单，这是动态 Web\
  \ 网站上经常执行的任务。我们提供了并解释了常用应用程序示例脚本，例如登录页面、在线目录和购物车。\n\n## 伴随网站\n\n我们将书中展示的大多数代码示例放在\
  \ Dummies.com 网站上，这样你就不需要输入长代码块。将你的浏览器指向 `www.dummies.com/go/php&mysqlaio` 来下载代码样本。\n\
  \n\n\n\n# 设置你的开发环境\n\n## 测试 PHP 和 MySQL\n\nPHP 和 MySQL 是构建动态 Web 应用程序的流行组合。PHP 是一种专为\
  \ Web 设计的脚本语言，其特性使得 Web 设计和编程变得更容易。MySQL 是一种快速、易用的 RDBMS（关系型数据库管理系统），用于许多网站。MySQL\
  \ 和 PHP 组合在一起具有多个优势：\n\n- ✦**它们是免费的。** 在性价比方面，免费是无可比拟的。\n- ✦**它们面向 Web。** 两者都是专为网站使用而设计的。两者都有一系列专注于构建动态网站的功能。\n\
  - ✦**它们易于使用。** 两者的设计目标都是为了快速建立网站。\n- ✦**它们速度很快。** 两者的设计都以速度为主要目标。它们共同提供了向用户交付动态\
  \ Web 页面的最快方法之一。\n- ✦**它们之间通信良好。** `PHP` 内置了与 `MySQL` 通信的特性。你不需要了解技术细节；将其交给 `PHP`\
  \ 即可。\n- ✦**两者都有广泛的支持。** 两者拥有庞大的用户群。由于它们经常成对使用，因此通常拥有相同的用户群。许多人可以提供帮助，包括电子邮件讨论列表上具有共同使用\
  \ `MySQL` 和 `PHP` 经验的人。\n- ✦**它们是可以自定义的。** 两者都是开源的，因此程序员可以修改 `PHP` 和 `MySQL` 软件以适应自己的特定环境。\n\
  \n在构建 Web 应用程序之前，你需要设置好开发环境。在本章中，我们将介绍你需要的工具以及如何获取这些工具。\n\n## 所需工具\n\n为了搭建你的动态网站，你需要访问以下三个软件工具：\n\
  \n- ✦**Web 服务器**：向世界传送你的 Web 页的软件。\n- ✦`PHP`：你将用它编写程序为你的网站提供动态功能的脚本语言。\n- ✦`MySQL`：用于存储你的\
  \ Web 数据库应用程序信息的 RDBMS。\n\n## 为你的网站选择托管主机\n\n要创建动态 Web 页，你需要访问一个提供这三个软件工具的网站（见前一节）。所有网站都包含\
  \ Web 服务器，但并非所有网站都提供 `MySQL` 和 `PHP`。\n\n网站位于一台计算机上。为了让你的网站对公众开放，它必须位于连接到互联网的计算机上。为你的网站提供家园计算机被称为\
  \ `Web host`（Web 主机）。\n\n你可以在办公室或地下室设置一台计算机作为你网站的主机。这需要你对技术非常精通。你访问万维网的互联网连接可能无法提供足够的资源来允许用户访问你的计算机。你可能需要一种提供域名系统（`DNS`）服务的更快连接。你需要一种不同的互联网连接，并且可能会增加成本。\n\
  \n本书没有提供运行你自己的 `Web host` 所需的信息。如果你已经拥有设置主机机器的技术知识，你可能可以根据书中的信息安装 Web 软件。\n\n然而，如果你对互联网连接不是足够了解，你需要在其他地方进行研究。大多数人不会在自己的地方托管网站。Web\
  \ 托管通常由以下者之一提供：\n\n- ✦**公司：** 也许你正在为一家公司创建一个网站，无论是作为员工还是承包商。公司的 IT 部门通常提供此类服务。\n\
  - ✦**教育机构：** 学校或大学允许学生、教职员工和其他机构在其计算机上放置网站。\n- ✦**Web 托管公司：** 你可以付费将网站存放在 Web 托管公司的计算机上。\n\
  \n`PHP` 和 `MySQL` 有许多选项，但 IT 部门设置的方式可能不适合你。如果你需要更改 `PHP` 或 `MySQL` 选项，你需要请求 IT 进行更改；你无法自己更改。例如，安装\
  \ `PHP` 时必须启用 `MySQL` 支持，因此如果 `PHP` 与 `MySQL` 的通信不正常，IT 可能需要重新安装启用了 `MySQL` 支持的\
  \ `PHP`。\n\n随着需求的产生，你会经常与 IT 人员打交道。例如，你可能需要更改选项，可能需要信息帮助解释错误消息，或者你可能需要报告 Web 软件的问题。因此，与\
  \ IT 人员建立良好的关系会让你的生活更轻松。经常给他们带些美味的饼干和甜甜圈。\n\n\n\n\n\n# 为你的网站选择主机\n\n随后，该名称就归你使用，其他人无法再使用。域名的注册标准费用为每年\
  \ 35 美元。你不应该支付超过这个费用，但通常会有优惠价格。\n\n由于 IP 地址由数字和点组成，因此并不容易记忆。幸运的是，大多数 IP 地址都有一个关联名称，这容易记忆得多。许多网站提供注册域名的功能，包括许多\
  \ Web 托管公司的网站，例如 `amazon.com`、`www.irs.gov` 或 `mycompany.com`。\n\n作为网站地址的名称被称为域名。域名就是一个域名。注册的域名（如\
  \ `www.google.com`）可以代表一台计算机或多台连接的计算机。当一个域名指代多台计算机时，域名内的每台计算机都可以有自己的名称。包含单台计算机名称的名称（如\
  \ `thor.mycompany.com`）被称为子域名。\n\n## Web 托管公司\n\n## Web 托管\n此外，许多网站允许你输入域名并查看其注册所有者。这些网站使用一个名为\
  \ `whois` 的工具进行域名数据库搜索。在 Google 上搜索域名 `whois` 的结果超过了 1700 万次。你可以进行 `whois` 搜索的地方有\
  \ `Allwhois.com` (`www.allwhois.com`) 和 `BetterWhois.com` (`www.betterwhois.com`)。\n\
  \n每个域名必须是唯一的才能作为地址。因此，域名注册系统确保了没有两个位置使用相同的域名。只要符合标准，任何人都可以注册任何域名。在 Google 上搜索域名的结果超过了\
  \ 8500 万次。\n\n当你创建一个由教育机构托管的个人网站时，计算机空间和所有网站软件都供你使用。你只需要为你的网页创建文件，并将它们移动到指定的位置即可。\n\
  \n教育机构通常会提供有关创建网站的书面文档，包括将你的文件放在哪里。他们通常还提供帮助台来协助解决问题，或提供将提供帮助的技术支持人员。\n\n当你的网站由教育机构托管时，你的域名通常是该机构的域名。你很少能注册属于自己的域名。更多信息请参阅侧边栏“域名”。\n\
  \n`Web 托管公司`提供你建立网站所需的一切，包括计算机空间和所有网站软件。你只需要为你的网页创建文件，并将它们移动到 Web 托管公司指定的位置即可。\n\
  \n大约无数公司提供 Web 托管服务。大多数公司收取月费（通常很小），有些甚至是免费的。（大多数——但不是所有——的免费服务要求你展示广告。）通常，月费取决于为你的网站提供的资源。例如，一个拥有\
  \ 100MB 磁盘空间存储网页文件的网站，费用比一个拥有 200MB 磁盘空间的网站便宜。\n\n在为你的网站寻找 Web 托管公司时，请确保它提供以下内容：\n\
  \n- **PHP 和 MySQL：** 并非所有公司都提供这些工具。你可能需要为可以使用 `PHP` 和 `MySQL` 的网站支付更多费用；有时你必须为 `MySQL`\
  \ 数据库支付额外费用。\n- **较新版本的 PHP：** 有时提供的 `PHP` 版本不是最新版本。在本文写作时，`PHP 6` 即将发布。然而，即使在发布后，你可能也难以找到提供\
  \ `PHP 6` 的 Web 托管公司。事实上，你可能会发现大多数 Web 托管公司仍然提供 `PHP 4`，尽管我们希望这种情况很快 way。请花时间寻找一家至少提供\
  \ `PHP 5` 的 Web 托管公司，如果可用的话，最好是 `PHP 6`。一些 Web 托管公司提供 `PHP 4`，但会为要求的客户提供 `PHP 5`（或\
  \ `6`）。\n\n选择 Web 托管公司时的其他考虑因素还有：\n\n- **可靠性：** 你需要一个可以依赖的 Web 托管公司——一个不会明天破产消失，且运行在用口香胶和铁丝固定在一起的旧计算机上的公司。如果公司的停机时间超过运行时间，为了省去麻烦，去找其他地方。\n\
  - **速度：** 下载缓慢的网页是一个问题，因为用户会失去不性并去他处。页面缓慢可能是因为 Web 托管公司创业时资金紧张，缺乏良好的设备，或者由于公司太成功，导致设备被新客户压力。无论如何，交付网页太慢的\
  \ Web 托管公司都是不可接受的。\n- **技术支持：** 一些 Web 托管公司没有人可以回答问题或排除故障。技术支持通常只通过电子邮件提供，如果响应时间短，这是可以接受的。有时你可以测试公司支持的质量。\n\
  - **备份：** `备份` 是你的网页文件和数据库的副本，存储以防文件或数据库丢失。你想要确保公司对你的应用程序进行定期、频繁的备份。你还想知道在出现问题后，需要多久通过备份将你的网站恢复正常运行。\n\
  - **功能：** 根据你网站的用途选择功能。通常，托管公司会将功能组合成方案——功能越多，成本越高。需要考虑的一些功能包括：\n    - **磁盘空间：**\
  \ 你的网站需要多少 MB 或 GB 的磁盘空间？媒体文件（如图形或音乐文件）可能很大。\n    - **数据传输：** 一些托管公司会向用户收取发送网页的费用。如果你预计网站会有大量流量，这项成本应该是一个考虑因素。\n\
  \    - **电子邮件地址：** 许多托管公司为你的网站提供若干电子邮件地址。例如，如果你的网站是 `LolaDesigner.com`，你可以允许用户向\
  \ `me@LolaDesigner.com` 发送电子邮件。\n    - **软件：** 托管公司提供各种 Web 开发软件。`PHP` 和 `MySQL`\
  \ 是我们讨论的软件。一些托管公司可能提供其他数据库，某些可能提供其他开发工具，如 FrontPage 扩展、购物车软件和信用卡验证。\n    - **统计数据：**\
  \ 通常你可以获得有关你网站流量的统计数据，例如用户数量、访问时间、按页面访问等。\n- **域名：** 每个网站都有一个浏览器用于查找该站的域名。每个域名都通过小额费用注册，以便只有一个站点可以使用它。一些\
  \ Web 托管公司允许你使用独立注册的域名，一些则要求你使用他们的域名。例如，假设你的名字是 `Lola Designer`，你希望你的网站是 `LolaDesigner.com`。一些\
  \ Web 托管公司允许你的域名为 `LolaDesigner.com`。通常情况下，使用你自己的域名会让你的网站看起来更专业。\n\n\n\n\n对于大多数\
  \ Web 托管公司，你对自己的 Web 环境没有控制权。Web 托管公司提供的是对其最有利的环境——可能是为了便于维护、低成本以及最大限地减少客户流失。你的环境大部分都由公司设定，你无法进行更改。你只能请求公司进行更改。公司通常不愿更改一个已经正常运行的设置，因为担心更改可能会给公司系统或其他客户带来问题。\n\
  \n对 MySQL 数据库的访问是通过一套账户和密码系统控制的，这些系统必须手动维护，从而给托管公司带来了额外的工作。由于由于原因，许多托管公司要么不提供 MySQL，要么对其收取额外费用。此外，PHP\
  \ 有许多选项可以设置、取消或赋予各种值。托管公司根据其需求决定选项设置，而这些设置对你的目的可能是理想的，也可能不理想。\n\n从零开始研究 Web 托管公司是非常困难的——\n\
  \n在 `Google.com` 上搜索“Web hosting”（Web 托管）会有近 4 亿条搜索结果。\n\n研究 Web 托管公司的最好方法是向具有这些公司经验的人寻求推荐。使用过托管公司的人可以在服务速度缓慢或计算机经常宕机时警告你。当你从几个满意的客户那里收集了几个\
  \ Web 托管公司的名称后，你可以缩小范围，找到最适合你的目的且最具效益的一个。\n\n## 使用托管的 Web 网站\n\n当你使用带有托管 Web 网站的环境（如上述讨论的三个环境）让世界看到\
  \ Web 页面时，Web 页面文件必须位于计算机上的特定位置。向世界提供 Web 页面的 Web 服务器期望在特定的目录中找到这些页面文件。托管主机工作人员或\
  \ IT 部门应该为你提供安装 页面文件所需目录的权限。\n\n## 选择你的开发环境\n\n为了使用 Web 软件工具并构建动态 Web 网站，你需要从 Web\
  \ 托管主机获取以下信息：\n\n- **Web 页面的位置：** 你需要知道将 页面文件放在哪里。托管主机人员需要提供安装文件所需的目录的名称和位置。此外，你还需要知道如何安装文件——复制、通过\
  \ FTP（文件传输协议）传输或使用其他方法。你可能需要用户 ID 和密码来安装文件。\n- **默认文件名：** 当用户将浏览器指向 URL 时，系统会向他们发送文件。Web\
  \ 服务器设置为当 URL 指向目录时发送一个具有特定名称的文件。自动发送的文件是 `default file`（默认文件）。通常默认文件被命名为 `index.htm`\
  \ 或 `index.html`，但有时也会使用其他名称，如 `default.htm`。你需要知道你的默认文件应该命名为什么。\n- **MySQL 账户：**\
  \ 对 MySQL 数据库的访问通过账户名和密码系统控制。提供 Web 主机的组织会为你创建一个具有适当权限的 MySQL 账户，并给你 MySQL 账户名和密码。（MySQL\
  \ 账户在第三书中有详细介绍。）\n- **MySQL 数据库的位置：** MySQL 数据库不需要与 Web 网站位于同一台计算机上。如果 MySQL 数据库位于\
  \ Web 网站之外的计算机上，你需要知道查找数据库的 `hostname`（主机名，例如 `thor.companyname.com`）。\n- **PHP\
  \ 文件扩展名：** 安装 PHP 时，Web 服务器会被指令为在具有特定扩展名的文件中寻找 PHP 语句。通常使用的扩展名是 `.php` 或 `.phtml`，但也可以使用其他扩展名。没有正确扩展名的文件中的\
  \ PHP 语句将无法处理。找出你的 PHP 程序应该使用哪种扩展名。\n\n当你知道你的 Web 网站将位于何处时，你需要设置你的开发环境。你不想在访问者查看它的位置开发你的\
  \ Web 网站，因为你不希望他们在页面完成并达到完美之前看到它们。以下是开发 Web 页面的两个常用地方：\n\n- **在托管 Web 网站的计算机上：**\
  \ 你可以在向世界提供 Web 网站的同一台计算机上创建 Web 页面文件。为此，请为开发创建一个子目录。当文件完成并准备好公开时，将文件传输到公众查看 Web\
  \ 页面的主 Web 网站目录。\n- **在本地计算机上：** 你可以设置一台本地计算机进行开发。你可以在本地计算机上安装 Web 网站软件。然后你在你的计算机上创建\
  \ Web 页面文件，并通过你的本地 Web 服务器查看它们。当文件让你满意后，你可以将它们传输到托管你 Web 网站的计算机上的公共 Web 网站。\n\n\
  在本地计算机上开发很常见。你可以使用你熟悉的编辑器和软件。有些人使用文本编辑器，另一些人使用集成开发环境（IDE），例如 `Dreamweaver`。然而，要在本地机器上开发，你需要在上面安装\
  \ Web 服务器、PHP 和 MySQL。本书剩余章节将提供安装 Web 服务器、PHP 和 MySQL 的详细说明。\n\n## 设置你的本地计算机进行开发\n\
  \n为了使用你的本地计算机开发 Web 网站，你必须安装 Web 服务器、PHP 和 MySQL。PHP 和 MySQL 免费下载和使用。\n\n### 安装\
  \ Web 服务器\n\n在你设置好计算机后，你需要安装 Web 服务器。你的第一步是决定安装哪个 Web 服务器。答案几乎总是 Apache。Apache 具有以下优势：\n\
  \n- **它是免费的：** 我们还需要说什么呢？\n- **它在多种操作系统上运行：** Apache 运行在 Windows、Linux、Mac OS、FreeBSD\
  \ 和大多数 Unix 变上。\n- **它是受欢迎的：** 根据 `http://news.netcraft.com/archives/web_server_survey.html`\
  \ 和 `www.securityspace.com/s_survey/data/` 的调查，大约有 60% 的 Web 网站使用 Apache。如果它运行不好，这就不可能是真的。这意味着大量的用户群体可以提供帮助。\n\
  - **它是可靠的：** 只要你的计算机运行，Apache 就会运行。Apache 的紧急问题非常罕见。\n- **它是可的：** 开源许可允许程序员修改 Apache\
  \ 软件，根据需要添加或修改模块以适应他们自己的环境。\n- **它是安全的：** 你可以找到与 Apache 配合运行的免费软件将其转换为 SSL（安全套接层）服务器。如果你将该网站用于电子商务，安全是一个至关的问题。\n\
  \n在安装大多数 Linux 发行版时，会自动安装 Apache。所有最新的 Mac 都预装了 Apache。然而，你可能需要安装更新版本的 Apache。Apache\
  \ 提供了一个适用于 Windows 安装程序，可以为你安装并配置 Apache。截至本文编写，Apache 提供三个版本：1.3、2.0 和 2.2。\n\n\
  \n\norg）提供了信息、软件下载、不断更新的详尽文档以及各种操作系统的安装说明。\n\n还有其他 Web 服务器可供选择微软提供了 `IIS`（互联网信息服务），它是互联网上第二流行的\
  \ Web 服务器，约占 27% 的网站。太阳微系统公司（Sun Microsystems）提供了一个 Web 服务器，但其服务的互联网份额不到 3%。虽然还有其他\
  \ Web 服务器，但它们的用户群更小。\n\n## 安装 MySQL\n\n你可能需要也可能不需要安装 `MySQL`。Linux 或 Mac 上通常已经安装了\
  \ `MySQL`。有时它已经安装，但尚未激活。\n\n然而，已安装的版本可能是旧版本，在这种情况下，你应该安装较新版本。本微型书籍的第 3 章提供了检查 `MySQL`\
  \ 是否已安装以及确定安装了哪个版本的说明。\n\n在 Windows 上，你通过使用安装程序和配置向导安装并配置 `MySQL`。Linux 上可以使用 `RPMs`\
  \ 来安装 `MySQL`。Mac OS X 可以使用 `PKG` 文件来安装 `MySQL`。本微型书籍的第 3 章提供了在 Windows、Linux、Unix\
  \ 和 Mac OS 上安装 `MySQL` 的详细说明。\n\n在 `MySQL` 安装后，提供了用于管理 `MySQL` 数据库的软件。一个流行的管理 `MySQL`\
  \ 的程序是 `phpMyAdmin`，它是一个用 `PHP` 编写的实用程序。本微型书籍的第 3 章讨论了安装和使用 `phpMyAdmin`。\n\n# 安装\
  \ PHP\n\n你可能需要也可能不需要安装 `PHP`。与 `MySQL` 一样，Linux 或 Mac OS 上通常已经安装了 `PHP`。有时它已安装但尚未激活。然而，已安装的版本可能是旧版本，在这种情况下，你应该安装较新版本。本微型书籍的第\
  \ 2 章提供了检查 `PHP` 是否已安装以及确定安装了哪个版本的说明。\n\n### 第 1 章\n\n### 跟进 PHP 和 MySQL 的变化\n\n\
  `PHP` 以 Zip 包格式提供给 Windows，只需解压到正确位置即可。Linux 通过 `RPMs` 提供 `PHP`。你可以通过 `PKG` 文件为\
  \ Mac OS 获取 `PHP`。安装 `PHP` 后，你需要配置你的 Web 服务器来处理 `PHP` 代码。本微型书籍的第 2 章提供了安装 `PHP`\
  \ 和配置你的 Web 服务器环境的说明。\n\n### 获取软件帮助\n\n`Apache`、`PHP` 和 `MySQL` 是开源软件。当你遇到问题时，你没有可以拨打的电话号码，但这并不意味着你无法获得帮助。开源软件的人们互相帮助。\n\
  \n`Apache`、`PHP` 和 `MySQL` 是拥有数亿用户的流行软件。这些用户中许多人愿意提供帮助。官方网站支持拥有数百名知识丰富用户的邮件列表，其中通常包括开发软件的人员，他们会自愿地回答问题。你通常可以比在技术支持热线排队更快地获得答案。\n\
  \n你可以在以下位置加入邮件列表：\n\n✦ `www.php.net/mailing-lists.php`\n\n✦ `http://lists.mysql.com`\n\
  ✦ `http://httpd.apache.org/lists.html`\n\n邮件列表还有可搜索的问答存档。你极不可能是第一个遇到这个问题的人，所以你很可能会在存档中找到已经被解答的问题。\n\
  \n加入邮件列表，这些列表通常流量很大。当你刚接触 `PHP` 和 `MySQL` 时，讨论列表上的大量邮件会将非常有价值的信息带入你的电子邮箱箱；通过阅读这些信息，你可以学到很多。很快，你可能就能根据自己的经验来帮助他人了。\n\
  \n### 跟进 PHP 和 MySQL 的变化\n\n`PHP` 和 `MySQL` 是开源软件。如果你只使用过大型软件发行商（如 `Microsoft`、`Corel`\
  \ 或 `Adobe`）的软件，你会发现开源软件是一个完全不同的物种。它由一组程序员开发，他们在业余时间编写代码，为了乐趣且免费。没有公司办公室。\n\n开源软件变化频繁，而不是像商业软件那样每一两年更新一次。它在开发者认为已经就绪时就会变化。它还会快速响应问题做出变化。当发现严重问题（例如安全漏洞）时，几天内就可以发布修复该问题的新版本。在新版本发布的一年之前，你不会收到精美的小册或看到醒目的杂志广告。因此，如果你不努力保持信息更新，你可能会错过新版本的发布，或者没有意识到你当前版本存在严重问题。\n\
  \n经常访问 `PHP` 和 `MySQL` 网站。你需要了解那里发布的信息。即使你不订阅任何其他邮件列表，也要订阅公告邮件列表，它偶尔发送包含你需要了解的信息的电子邮件。所以，现在在你忘记之前，快去\
  \ `PHP` 和 `MySQL` 网站，并在 `www.php.net/mailing-lists.php` 和 `http://lists.mysql.com`\
  \ 订阅一两个列表。\n\n此外，如果你在本地计算机上开发并上传到你的 Web 网站，你本地需要安装与 Web 主机相同的 `PHP` 和 `MySQL` 版本。你需要确保你在本地开发的脚本在上传后运行相同的方式并产生相同的输出。\n\
  \n## 第 2 章：安装 PHP\n\n### 本章内容\n* 检查是否需要安装 PHP\n* 在 Windows、Mac OS 或 Linux 上安装 PHP\n\
  * 配置 PHP\n* 测试 PHP\n* 激活 MySQL\n* 排除 PHP 和 MySQL 安装故障\n\n# 安装 PHP\n你可能需要也可能不需要安装\
  \ `PHP`。与 `MySQL` 一样，`PHP` 通常已经安装了。例如，大多数最新的 Linux 和 Mac 发行版会自动安装 `PHP`。Windows\
  \ 操作系统不提供 `PHP`。\n\n你可以检查是否需要安装 `PHP`。如果目前没有安装，或者你有一个需要更新的旧版本，你就需要安装 `PHP`。\n\n\
  安装 PHP 包括以下步骤，在本章中进行了详细解释：\n1. 检查并确定是否需要安装 PHP。\n2. 获取 PHP 软件，通常是通过从网站下载。\n3. 安装\
  \ PHP。\n4. 为你的 Web 服务器配置 PHP。\n5. 配置 PHP。\n6. 测试 PHP。\n7. 激活 MySQL 支持。\n\n### 检查\
  \ PHP 安装\n要查看是否已安装 PHP，请在硬盘上搜索任何 PHP 文件：\n\n✦ **Linux/Unix/Mac:** 输入以下命令：\n\n```\n\
  find / -name \"php*\"\n```\n\n✦ **Windows:** 使用查找功能（选择开始 -> 查找）搜索 `php\\*`。\n\n\
  通常情况下，Windows 电脑上没有安装 PHP。\n\n如果你没有找到任何 PHP 文件，说明没有安装 PHP。在本章的稍后部分，我们将描述如何获取（参见“获取\
  \ PHP”）和安装（参见“安装 PHP”）PHP。\n\n如果你在电脑上发现了 PHP 文件，PHP 可能已经就绪，也可能还没有。文件可能存在于你的硬盘上，但\
  \ PHP 可能还没有被安装。或者，PHP 可能已经安装，但它可能不是最新版本。你可能想要安装最新版本。\n\n你可以在本章稍后“测试 PHP”节中描述的测试程序来测试\
  \ PHP 是否就绪。该节中的测试将确定 PHP 是否已安装并告诉你你安装了哪个版本。\n\n\n\n\n自 10.3 版本以来大多数 Mac OS X 版本都预装了\
  \ PHP，但 Apache 可能没有配置好以处理 PHP 代码。如果 PHP 已经安装在你的 Mac 上但似乎无法运行，请尝试按照本章后面部分“为 PHP 配置\
  \ Web 服务器”章节中的说明进行。\n\n编辑 `httpd.conf` 文件可能是你让 PHP 运行起来唯一需要的操作。\n\n# 获取 PHP\n\n\
  在编写本文时，有两个版本的 PHP 可用：`PHP 4` 和 `PHP 5`。当 `PHP 6` 发布后，可能一段时间内会有三个版本的 `PHP`可用。如果你是第一次安装\
  \ `PHP` 并创建你的第一个网站，你应该下载 `PHP 5`，或者在你阅读此本书时已有 `PHP 6` 的话下载 `PHP 6`。只有在你需要维护或修改带有现有代码的现有网站时，才应该安装旧版本的\
  \ `PHP`。为一个版本的 `PHP` 编写可能可能修改才能运行在另一个版本的 `PHP` 上。如果你有大量代码，可能希望在一段时间内更新代码。\n\n##\
  \ 从 PHP 官网下载\n\n适用于所有操作系统的 PHP 可以在 PHP 官网 `www.php.net` 获得。你可以下载源代码并在你的操作系统上进行编译。\n\
  \n在 Linux 和 Mac OS 上编译并安装源代码并不困难，但在 Windows 上需要专家知识和软件。\n\n二进制文件——即编译好的、准备就绪的文件，只需复制到正确的位置——仅适用于\
  \ Windows。你可以从其他网络位置获取 Linux 和 Mac OS 的二进制文件，但不能从 PHP 官网获取。\n\n### 获取 Windows 版\
  \ PHP\n\n你可以轻松地从 PHP 官网 `www.php.net` 下载的二进制文件中安装 PHP。你可以下载一个包含所有必要文件的 `Zip` 压缩，或者一个可以运行以安装所有\
  \ PHP 文件的安装程序。\n\nPHP 文档建议从 `Zip` 文件安装 PHP，以便更好地理解安装过程，并在以后更方便地添加扩展。本章中的指南提供了从 `Zip`\
  \ 文件安装 PHP 的说明。\n\n尽管 Windows 用户可以从 PHP 官网提供的源代码编译并安装 PHP，但这非常困难，且应该仅由高级用户尝试。它需要高级知识和特殊软件。\n\
  \n要下载 Windows 版的 `Zip` 文件，请遵循以下步骤：\n\n1. 访问 `www.php.net/downloads.php`。\n2. 下载最新版本\
  \ `PHP` 的 `Zip` 包。\n\n### 获取 Linux 版 PHP\n\n大多数最新的 Linux 版本都包含 PHP。如果你需要安装 PHP 或升级到较新版本，大多数\
  \ Linux 发行版在它们的网站上提供了软件，你可以下载并安装到特定的 Linux 系统中。此外，大多数 Linux 系统提供了专门用于下载和安装软件的实用。例如，Fedora\
  \ 提供了 `yum` 工具，可以从 Fedora 官网下载并安装软件。请参考你的 Linux 发行版的文档了解如何在你的 Linux 发行版上下载和安装软件。\n\
  \n在某些情况下，你可能需要手动安装 PHP。网站提供的软件可能不是最新的，或者不符合你的需求。要手动安装，你需要从 PHP 官网 `www.php.net`\
  \ 下载源代码。\n\n你可以轻松地从源代码编译并安装 PHP。这个过程听起来并没有那么技术和复杂。本章提供了在 Linux 上从源代码安装 PHP 的说明。\n\
  \n### 获取 Mac OS 版 PHP\n\n大多数最新版本的 Mac OS X 已经预装了 PHP。如果你因为未安装或安装了旧版本而需要安装 PHP，最简单的方法是从二进制文件安装。PHP\
  \ 官网不提供二进制文件，但在 `www.entropy.ch/software/macosx/php` 提供了某些 OS X 版本的二进制文件。下载和安装二进制文件所需的信息在该网站提供。请检查二进制文件中提供的支持和扩展，以确保你拥有所需的功能。\n\
  \n如果二进制文件没有提供你需要的功能或扩展，你可以从 PHP 官网下载源文件并在你的 Mac 上进行编译安装。本章提供了从源代码安装 PHP 的说明。\n\n\
  ### 获取合一安装工具包\n\n你可以获得一些工具包，它们可以在一个程序中包含并安装 PHP、`MySQL` 和 Apache。这些工具包可以极地简化安装过程。\n\
  \n然而，提供的软件可能不包含你需要的功能和扩展。\n\n`XAMPP` 是流行的合一安装工具包，包含了 Apache、`PHP` 和 `MySQL`。它还安装了\
  \ `phpMyAdmin`，一个用于管理 `MySQL` 数据库的工具。`XAMPP` 为 Windows（包括 Vista）提供了稳定版本，并适用于多个版本的\
  \ Linux。此外，Mac 和 Solaris 也有 `XAMPP` 版本，但这些版本目前较新，测试和开发程度较少。你可以在 `www.apachefriends.org/en/xampp.html`\
  \ 获取 `XAMPP`。本微型书籍第 5 章提供了使用 `XAMPP` 安装软件的说明。\n\n`WAMP5` 是一个流行的 Windows 安装包，提供了最新版本的\
  \ Apache 2.2、`PHP 5` 和 MySQL 5。像 `XAMPP` 一样，`WAMP5` 也安装了 `phpMyAdmin` 工具。`WAMP5`\
  \ 网站说明它兼容 Windows Vista。`WAMP5` 不支持 Windows98/Me。你可以在 `www.en.wampserver.com` 获取\
  \ `WAMP5`。\n\n`MAMP` 是一个适用于 Mac 安装包，为 Mac OS X 安装 Apache、`PHP` 和 `MySQL`。这个免费包在你的\
  \ Mac PowerBook 或 iMac 上安装本地服务器环境。`MAMP` 主要作为你本地计算机的 `PHP` 开发环境创建，不应作为互联网的生产服务器。你可以在\
  \ `www.mamp.info` 获取 `MAMP`。\n\n## 验证下载的文件\n\nPHP 官网提供了下载后验证软件的方法，作为一种安全措施，确保文件没有被坏人篡改。你可以使用\
  \ `MD5` 方法或 `PGP` 方法进行验证。\n\n`MD5` 方法更简单，在本节中描述。\n\n在下载页面上，你下载的文件下方显示有一个名为 `signature`（签名）的长字符串。例如：\n\
  \n`MD5: 6112f6a730c680a4048dbab40e4107b3`\n\n下载的 PHP 文件需要提供与下载页面显示的相同 MD5 签名。你使用电脑上的软件来检查下载文件的\
  \ MD5 签名。你的 Linux 或 Mac 系统包含了检查 MD5 签名的软件。在 Windows 上，你可能需要下载并安装 MD5 软件。你可以在 `www.fourmilab.ch/md5`\
  \ 找到检查 MD5 签软件。\n\n你可以在命令行提示符（如 Windows 中的命令行窗口）检查下载文件的 MD5 签名。你可能位于文件所在的目录。要检查\
  \ MD5 签名，输入：\n\n```\nmd5 filename\n```\n\n使用你下载的文件名，例如 `md5 php-5.2.1-Win32.zip`。在\
  \ Windows 中，你可能需要将下载的文件复制到 MD5 软件（如 `md5.exe`）所在的目录，切换到该目录，然后输入上述命令。\n\n显示出一个签名。此处的签名应与\
  \ PHP 官网下载页面文件名下方显示的签名相同。\n\n\n\n\n\nwinMd5Sum 是一个简单的开源（免费）Windows 程序，带有图形界面，允许你通过点击按钮和拖放文件名来检查\
  \ MD5 签名，而无需在命令提示符窗口中输入命令。你可以在 www.nullriver.com/index/products/winmd5sum 获取它。\n\
  \n你可以通过类似的步骤验证 Apache 和 MySQL 的下载包。\n\n# 安装 PHP\n\n尽管 PHP 运行在许多平台上，但我们描述了在 Unix、Linux、Mac\
  \ 和 Windows 上安装 PHP，这些平台代表了互联网上大多数的网站。PHP 可以与多个 Web 服务器配合运行，但这些说明主要关注 Apache 和 Internet\
  \ 信息服务器 (IIS)，因为由于它们共同支持了互联网上几乎 90% 的网站。如果你需要其他操作系统或 Web 服务器的安装说明，请参阅 PHP 网站 www.php.net。\n\
  \n本章提供了 PHP 5 和 6 的安装说明。如果你正在安装更早版本，会有一些细微差异，请阅读 PHP 分发包附带的 `install.txt` 文件。\n\n\
  \ 在 Unix 和 Linux 上安装\n\n你可以将 PHP 安装为 Apache 模块或作为独立的解释器。如果你在 Web 页面中使用 PHP 作为脚本语言来与数据库交互，请将\
  \ PHP 安装为 Apache 模块。作为模块，PHP 运行更快且更安全。我们在书中书中讨论作为独立解释器的 PHP。\n\n我们在接下来的几节中提供了在 Linux\
  \ 和 Unix 上编译和安装 PHP 的逐步说明。在开始安装程序之前，请完整阅读所有步骤。\n\n### 安装之前\n\n在开始安装 PHP 之前，请检查以下内容：\n\
  \n- **✦ Apache 模块 mod_so 已安装。** 它通常是安装的。要显示所有模块的列表，请在命令行输入以下内容：\n\n```bash\nhttpd\
  \ -l\n```\n\n你可能需要进入 `httpd` 所在的目录才能运行命令。输出通常会显示一长串模块。对于 PHP，你只需要关注 `mod_so`。如果\
  \ `mod_so` 未加载，则必须使用 `enable-module=so` 选项重新安装 Apache。\n\n- **✦ apxs 工具已安装。** 安装\
  \ Apache 时会安装 `apxs` 工具。你应该能够找到一个名为 `apxs` 的文件。如果 Apache 已经在 Linux 上安装，或者是从某个 Linux\
  \ 发行版网站安装的，`apxs` 可能没有被安装。某些 Apache 安装包含两个安装包：一个用于基础 Apache 服务器，另一个用于 Apache 开发工具。包含\
  \ `apxs` 的开发工具可能需要安装。\n\n- **✦ Apache 版本是较新的。** 请参阅本迷你书籍的第 1 章关于 Apache 版本的讨论。要检查版本，输入以下内容：\n\
  \n```bash\nhttpd -v\n```\n\n你可能需要进入 `httpd` 所在的目录才能运行命令。在写作时，PHP 网站不建议在 Linux 或\
  \ Unix 上将 Apache 2 与 PHP 使用。对于生产环境网站，使用 Apache 1.3 可能比使用 Apache 2 更好。通过检查 www.php.net/manual/en/install.unix.apache2.php\
  \ 关注 PHP 与 Apache 2 的状态。\n\n# 安装\n\n要在 Unix 或 Linux 上配合 Apache Web 服务器安装 PHP，请按照以下步骤操作：\n\
  \n1. **切换到下载源码的目录（例如 `cd /usr/src`）。** 你会看到一个名为 `php-` 的文件，后面跟着版本号和 `.tar.gz`。该文件包含许多文件的\
  \ tar 包。\n\n2. **解压 tar 包。** PHP 6.0.0 版本的命令是：\n\n```bash\ngunzip -c php-6.0.0.tar.gz\
  \ | tar -xf –\n```\n\n将创建一个名为 `php-6.0.0` 的新目录，其中包含几个子目录。\n\n3. **进入解压 tar 包后创建的新目录。**\
  \ 例如，输入 `cd php-6.0.0`。\n\n4. **输入 configure 命令。** `configure` 命令由 `./configure`\
  \ 加上你想使用的配置选项组成。最短的 configure 命令是：\n\n```bash\n./configure --with-apxs\n```\n\n\
  如果你使用 Apache 2，请使用选项 `--with-apxs`。你可能想在 `configure` 命令中使用其他配置选项。可用的配置选项将在本文的“Unix/Linux/Mac\
  \ 安装选项”中讨论。对于本书，你需要启用支持，这通过配置选项来实现。\n\n当你输入 `configure` 命令时，会看到许多行输出。等待 `configure`\
  \ 命令完成。这可能需要几分钟。如果 `configure` 命令失败，它会提供信息性提示。通常问题是缺少软件。错误消息显示找不到某些软件，或者需要的版本是 5.6\
  \ 但找到的是 4.2。你需要安装 PHP 需要的软件。\n\n如果 `apxs` 工具未安装在预期位置，对应的错误消息显示找不到 `apxs`。如果你收到此消息，请检查\
  \ `apxs` 的安装位置（`find / -name apxs`并将将其包含在 `configure` 命令的 `with-apxs` 选项中：`--with-apxs=/usr/sbin/apxs`\
  \ 或 `/usr/local/apache/bin/apxs`。如果你使用的是 Apache 2，选项为 `--with-apxs2=/usr/sbin/apxs`。\n\
  \n5. **输入 `make`。** 你看到许多行输出。等待其完成。这可能需要几分钟。\n\n6. **输入 `make install`。**\n\n\n\n\
  \n\n✦ 开发者工具光盘中的文件已安装完毕。此光盘是 Mac OS X 主程序发行版的补充。如果你找不到该光盘，可以从 Apple Developer Connection\
  \ 网站 `developer.apple.com/tools/macosxtools.html` 下载这些工具。\n\n# 安装\n\n要在 Mac OS 上安装\
  \ PHP，请按照以下步骤操作：\n\n1. **切换到你下载 PHP 的目录（例如，`cd-/usr/src`）。**\n\n   你将看到一个名为 `php-`\
  \ 的文件，后面紧跟版本名和 `tar.gz`。\n\n   该文件包含多个压缩成一个的文件。该文件可能已经由 StuffIt Expander 自动解压了，因此你会看到\
  \ `php-6.0.0` 目录。如果是这样，请直接跳到第 3 步。\n\n2. **解压 tar 包。**\n\n解压 PHP 6.0.0 版本 tar 包的命令是\
  \ `tar xvfz php-6.0.0.tar.gz`。\n\n系统会创建一个名为 `php-6.0.0` 的新目录，其中包含几个子目录。\n\n3. **切换到解压\
  \ tar 包后创建的新目录。**\n\n例如，你可以使用如下的命令：\n\n```\ncd php-6.0.0\n```\n\n# 安装 PHP\n\n4.\
  \ **输入 `configure` 命令。**\n\n`configure` 命令由 `./configure` 加上所有必要的选项组成。最少选项集如下：\n\
  \n* *位置选项（Location options）：* 因为 Mac 存储文件的位置与 PHP 默认位置不同，你需要告诉 PHP 文件的所在位置。使用以下选项：\n\
  \n  `--prefix=/usr`\n  `--sysconfdir=/etc`\n  `--localstatedir=/var`\n  `--mandir=/usr/share/man`\n\
  \n* *zlib 选项：* `--with-zlib`。\n\n* *Apache 选项：* 如果你安装 PHP 是为了配合 Apache 使用，请使用以下选项：`--with-apxs`\
  \ 或 `--with-apxs2`。\n\n最可能的配置命令是：\n\n```\n./configure --prefix=/usr --sysconfdir=/etc\
  \ --localstatedir=/var --mandir=/usr/share/man --with-apxs --with-zlib\n```\n\n\
  你还需要使用一个选项来包含 MySQL 支持。请参见本章节后面的“在 Linux 和 Mac 上激活 MySQL 支持”部分。\n\n你可以在一行中输入 `configure`\
  \ 命令。如果你使用多行，请在每行的末尾输入 `\\`。\n\n你会看到很多行输出。请等待 `configure` 命令执行完毕。这可能需要几分钟。\n\n如果\
  \ `apxs` 实用没有安装在预期的位置，你将看到一条错误消息，指示找不到 `apxs`。如果你收到此错误消息，请检查 `apxs` 的安装位置（使用 `find\
  \ / -name apxs`），并并在 `configure` 命令的 `with-apxs` 选项中包含该路径：`--with-apxs=/usr/sbin/apxs`。\n\
  \n你可能需要使用许多其他选项，例如更改 PHP 安装目录的选项。这些配置选项将在本章节后面的“Unix/Linux/Mac 的安装选项”部分中进行讨论。\n\n\
  5. **输入 `make`。**\n\n你将看到很多行输出。请等待其完成。这可能需要几分钟。\n\n6. **输入 `sudo make install`。**\n\
  \n## Unix/Linux/Mac 的安装选项\n\n前面的部分提供了在 Unix、Linux 或 Mac 上快速安装 PHP 的步骤，并包含了适用于书中应用程序的选项。然而，在**安装\
  \ PHP** 时，你可能想以不同的方式安装 PHP。例如，所有的 PHP 程序和文件都安装在它们的默认位置，但你可能需要将 PHP 安装在不同的位置。或者你可能计划使用额外的软件开发应用程序。如果你需要根据特定需求配置\
  \ PHP，可以使用额外的命令行选项。只需将选项添加到命令中。要查看所有可能的选项，请输入 `./configure --help`。\n\n**表 2-1：PHP\
  \ 配置选项**\n\n| 选项 | 含义 |\n| :--- | :--- |\n| `prefix=**` | 设置 PHP 主目录，默认是 `/usr/local`。\
  \ |\n| `exec-prefix=**` | 安装架构相关文件，默认是 `PREFIX/`。 |\n| `bindir=**` | 安装可执行文件，默认是\
  \ `PREFIX/`。 |\n| `infodir=**` | 安装帮助文档，默认是 `PREFIX/`。 |\n| `mandir=**` | 安装手册文件，默认是\
  \ `PREFIX/`。 |\n| `with-config-file-path=**` | 设置查找配置文件 (`php.ini`) 的路径。如果没有此选项，PHP\
  \ 在默认位置查找。 |\n| `disable-libxml` | 禁用默认的 XML 支持。 |\n| `enable-ftp` | 启用 FTP。 |\n\
  | `enable-magic-quotes` | 启用引号的反斜杠转义。 |\n| `with-apxs=**` | 使用位于 `FILE` 的 apx 工具构建\
  \ Apache 模块。 |\n| `with-apxs2=**` | 使用位于 `FILE` 的 apx2 工具构建 Apache 模块。 |\n| `with-mysql=**`\
  \ | 对 MySQL 4.0 或早期版本的支持。 |\n| `with-mysqli=**` | 对 MySQL 4.1 或更高版本的支持。 |\n| `with-openssl=**`\
  \ | 为安全服务器启用 OpenSSL 支持。需要 OpenSSL 0.9.5 版本。 |\n| `with-oci8=**` | 对 Oracle 7 或更高版本的支持。\
  \ |\n| `with-oracle=**` | 对更早版本 Oracle 的。 |\n| `with-pgsql=**` | 对 PostgreSQL 数据库的支持。\
  \ |\n| `with-servlet=**` | 包含 servlet。Java 扩展必须编译为共享 .dll。 |\n\n# 在 Windows 上安装\n\
  \nPHP 运行在 Windows 98/Me 以及 Windows NT/2000/XP/Vista 上。你可以使用 98/Me 进行本地开发，但无法用它们支持公共网站。从\
  \ PHP 4.3.0 开始，不再支持 Windows 95。PHP 不支持 Windows 3.1。\n\n要在 Windows 上安装 PHP 5 或 6，你需要解压包含所有\
  \ PHP 文件的文件并存储在适当的位置。以下步骤显示了如何在 Windows 上安装 PHP：\n\n1. **将 .zip 文件中的文件提取到你想安装 PHP\
  \ 的目录，例如 `c:\\php`。**\n\n该 Zip 文件名为 `php`，后面紧跟版本号和 `win32.zip`，例如 `php6.0.0-Win32.zip`。如果你双击该文件，它会在你电脑上处理\
  \ Zip 文件的软件中打开（如 WinZip 或 PKZIP）。选择提取菜单项并选择要提取文件的目录。\n\nC:\\php 是一个很好的安装选择，因为许多配置文件假设\
  \ PHP 安装在那里，所以默认设置更有可能是正确的。\n\n\n\n\n相关说明在本章稍后部分的“在 Windows 上启用 MySQL 支持”节中提供。\n\
  \n### 3. **配置你的 Web 服务器。**\n\n下一节提供了配置你的 Web 服务器的说明。\n\n### 4. **配置 PHP。**\n\n按照本章稍后部分“配置\
  \ PHP”节中的指示操作。\n\n## 为 PHP 配置你的 Web 服务器\n\n你的 Web 服务器需要配置为能够识别并运行 PHP 脚本。\n\n###\
  \ 在 Linux 和 Mac 上配置 Apache\n\n你必须配置 Apache 以识别并运行 PHP 文件。你的系统上有一个 Apache 配置文件 `httpd.conf`，它可能位于\
  \ `/etc` 目录或 `/usr/local/apache/conf` 目录下。在 PHP 能够正常运行之前，你必须编辑此文件。\n\n按照以下步骤为你的系统配置\
  \ PHP：\n\n1. **打开 `httpd.conf` 文件以便进行修改。**\n2. **配置 Apache 加载 PHP 模块。**\n\n找到 `LoadModule`\
  \ 语句列表。寻找以下行：`LoadModule php6_module libexec/libphp6.so`\n\n如果没有该行，请添加它。如果行开头有井号（`#`），请删除井号。\n\
  \n对于 PHP 5，该行应为\n`LoadModule php5_module libexec/libphp5.so`\n\n3. **配置 Apache 识别\
  \ PHP 扩展。**\n\n你需要告诉 Apache 哪些文件可能包含 PHP 代码。寻找描述 `AddType` 的部分。你可能会看到针对其他软件的一行或多个\
  \ `AddType` 行。寻找 PHP 的 `AddType` 行，如下：`AddType application/x-httpd-php .php`\n\n\
  如果你发现行开头有井号（`#`），请删除井号。如果没有找到该行，请将其添加到 `AddType` 语句列表中。\n\n此行告诉 Apache 在所有带有 `.php`\
  \ 扩展的文件中查找 PHP 代码。你可以指定任何扩展或系列扩展名。\n\n4. **启动 Apache httpd 服务器（如果它尚未运行）或重启 Apache\
  \ httpd 服务器（如果它正在运行）。**\n\n你可以使用安装期间安装在系统上的脚本来启动或重启服务器。该脚本可能是 `apachectl` 或 `httpd.apache`，可能位于\
  \ `/bin` 或 `/usr/local/apache/bin`。例如，你可能可以通过输入 `apachectl start` 启动服务器，使用 `apachectl\
  \ restart` 重启它，或使用 `apachectl stop` 停止它。有时重启是不够的；你必须先停止服务器然后启动它。\n\n### 在 Windows\
  \ 上配置你的 Web 服务器\n\n你不能使用相同的端口同时运行 Apache 和 IIS（互联网信息服务）。要么关闭其中一个 Web 服务器，要么告诉它们监听不同的端口。\n\
  \n### 在 Windows 上配置 Apache\n\n在 PHP 能够正常运行之前，你必须编辑名为 `httpd.conf` 的 Apache 配置文件。要为\
  \ PHP 配置 Apache，请按照以下步骤操作：\n\n1. **打开 `httpd.conf` 进行编辑。**\n\n要打开文件，请选择开始➪程序➪Apache\
  \ HTTPD Server➪配置 Apache 服务器➪编辑配置。\n\n如果“开始”菜单中没有“编辑配置”，请在你的硬盘上找到 `httpd.conf` 文件，通常位于\
  \ Apache 安装目录下的 `conf` 子目录中（例如，`c:\\program files\\Apache group\\Apache\\conf`）。使用文本编辑器（如\
  \ `记事本` 或 `WordPad`）打开此文件。\n\n2. **激活 PHP 模块。**\n\n在文件中查找模块语句部分并定位到以下行：\n`#LoadModule\
  \ php6_module “c:/php/php6apache2.dll\"`\n\n删除行开头的 `#` 以激活模块。如果你正在安装 PHP 5，则需要以下行：\n\
  `LoadModule php5_module “c:/php/php5apache2.dll\"`\n\n如果你使用的是 Apache 1.3 而不是 Apache\
  \ 2，模块名称为 `php6apache.dll` 或 `php5apache.dll`。\n\n3. **告诉 Apache 哪些文件是 PHP 程序。**\n\
  \n寻找描述 `AddType` 的部分。该部分可能包含针对其他软件的一行或多个 `AddType` 行。PHP 的 `AddType` 行为 `AddType\
  \ application/x-httpd-php .php`\n\n寻找此行。如果你发现行开头有井号（`#`），请删除井号。如果没有找到该行，请将其添加到 `AddType`\
  \ 语句列表中。你可以指定任何扩展或系列扩展名。\n\n此行告诉 Apache 带有 `.php` 扩展的文件是 `application/x-httpd-php`\
  \ 类型的文件。然后 Apache 知道将带有 `.php` 扩展的文件发送给 PHP 模块。\n\n4. **启动 Apache（如果它尚未运行）或重启 Apache（如果它正在运行）。**\n\
  \n你可以在 Windows NT/2000/XP/Vista 中，通过选择开始➪程序➪Apache HTTPD Server➪控制 Apache 服务器然后选择“启动”或“重启”来启动它。你可以在\
  \ Windows 98/Me 中，通过选择开始➪程序➪Apache Web Server➪管理来启动它。\n\n有时重启 Apache 是不够的；你必须先停止它然后启动它。\n\
  \n### 配置 IIS\n\n要配置 IIS 与 PHP 工作，请按照以下步骤操作：\n\n1. **进入管理控制台。**\n\n你可以通过选择开始➪程序➪管理工具➪互联网信息管理器或开始➪控制面板➪管理工具➪互联网信息管理器来进入。\n\
  2. **右键点击你的网站（例如默认网站）。**\n3. **选择属性。**\n4. **点击主目录选项卡。**\n5. **点击配置按钮。**\n6. **点击映射选项卡。**\n\
  7. **点击添加。**\n8. **在可执行框中，输入 PHP 解释器的路径。** 例如，输入 `c:\\php\\php-cgi.exe`。\n9. **在扩展框中，输入\
  \ .php。**\n10. **勾选脚本引擎框。**\n11. **点击确定。**\n\n如果你希望处理 .php 之外的任何扩展，请重复步骤 6 到 10。\n\
  \n 配置 PHP\n\nPHP 使用名为 `php.ini` 的文件设置来控制某些行为。PHP 在启动时查找 `php.ini` 并使用找到设置。\n\n如果\
  \ PHP 找不到该文件，它将使用一组默认设置。`php.ini` 的默认位置位于此处（除非你在安装期间更改了它）：\n\n- **Windows**: 系统目录，取决于\
  \ Windows 版本：Windows 98/Me/XP 为 `windows`；Windows NT/2000 有为 `winnt`\n- **Unix,\
  \ Linux 和 Mac**: `/usr/local/lib`\n\n如果在安装期间没有安装 `php.ini` 文件，你需要安装它。PHP 分发包包含一个带有默认设置的配置文件，名为\
  \ `php.ini-dist`。将此文件复制到相应的位置（例如上述的默认位置），并重命名为 `php.ini`。\n\n如果你有之前的 PHP 版本（例如 PHP\
  \ 4.3），在用 PHP 5 或 6 的 `php.ini` 文件覆盖它之前，请对 `php.ini` 文件进行备份。然后你可以查看当前使用的设置，并在新的\
  \ `php.ini` 中更改这些设置。\n\n1. **打开 `php.ini` 文件进行编辑。**\n2. **更改你想更改的设置。** 步骤 3、4 和\
  \ 5 提到某些在特定环境下*应该*更改的特定设置。\n\n3. **如果你在使用 PHP 5 或更早版本，关闭魔法引号。**\n\n查找以下行：\n`magic_quotes-gpc\
  \ On`\n\n将 `On` 改为 `Off`。\n\n4. **仅在 Windows 上使用 PHP 5 或 6 时，激活 `mysqli` 或 `mysql`\
  \ 支持。**\n\n参见本章稍后部分“在 Windows 上启用 MySQL 支持”节中的说明。\n\n5. **仅当在 Windows 上配合 IIS Web\
  \ 服务器使用 PHP 时，关闭强制重定向。**\n\n查找此行：\n\n\n\n\n\n```ini\n;cgi.force_redirect = 1\n```\n\
  \n你需要删除分号以使该设置生效，并将 `1` 改为 `0`。修改后，该行看起来如下：`cgi.force_redirect = 0`\n\n6. **仅当你使用\
  \ PHP 5 或更高版本时，才需要设置你的本地时区。**\n\n找到此行：\n\n`;date.timezone =`\n\n删除该行开头的分号。在等号后添加你本地时区的代码。例如，该行可能是\
  \ `date.timezone = America/Los_Angeles`\n\n你可以在 `www.php.net/manual/en/timezones.php`\
  \ 找到时区代码列表。\n\n7. **保存 php.ini 文件。**\n\n8. **重启你的 Web 服务器以使新设置生效。**\n\n通常情况下，剩余的默认设置允许\
  \ PHP 正常运行，但你可能由于特定原因需要编辑其中某些设置。在本书中，当我们讨论可能需要你更改设置的话题时，我们会讨论 `php.ini` 文件中的设置。\n\
  \n### 测试 PHP\n\n要测试 PHP 是否已安装并正常工作，请遵循以下步骤：\n\n1. **找到需要保存 PHP 程序的目录。**\n\n此目录及其子目录就是你的*Web\
  \ 空间（Web space）*。\n\nApache 将此目录称为*文档根（document root）*。Apache 的默认 Web 空间是 Apache\
  \ 安装目录下的 `htdocs`。对于 IIS，它是 `Inetpub\\wwwroot`。在 Linux 中，它可能是 `/var/www/html`。通过配置\
  \ Web 服务器，可以将 Web 空间设置为不同的目录。如果你使用 Web 托管公司，工作人员将提供目录名称。\n\n2. **在你的 Web 空间某处创建一个名为\
  \ test.php 的文件。**\n\n```html\n<html>\n<head>\n<title>PHP Test</title>\n</head>\n\
  <body>\n<p>This is an HTML line</p>\n<?php\necho “<p>This is a PHP line</p>”;\n\
  phpinfo();\n?>\n</body>\n</html>\n```\n\n该文件必须保存在你的 Web 空间中，Web 服务器才能找到它。\n\n3.\
  \ **运行在第 2 步中创建的 test.php 文件。即在浏览器地址栏中输入你的 Web 服务器的主机，后跟文件名（例如 www.myfinecompany.com/test.php）。**\n\
  \n如果你的 Web 服务器、PHP 和 `test.php` 文件都在你正在测试的本地电脑上，你可以输入 `localhost/test.php`。\n\n\
  为了让 PHP 处理该文件，你需要通过 Web 服务器访问文件——而不是通过 Web 浏览器菜单选择“文件 ➔ 打开”。\n\n`test.php` 程序的输出如图\
  \ 2-1 所示。输出显示了两行，紧接着是一个表格。该表格很长，显示了与系统中 PHP 相关的所有信息。它显示了 PHP 信息、路径名和文件名、变量值以及各种选项的状态。该表格是由测试脚本中的\
  \ `phpinfo()` 行生成的。每当你对 PHP 的设置有任何疑问时，都可以使用 `phpinfo()` 语句显示此表格并检查某个设置。\n\n![Image\
  \ 4](img/index-68_1.jpg)\n\n# 激活 MySQL 支持\n\n基础 PHP 软件由一组核心功能和提供额外功能的可选扩展组成。MySQL\
  \ 支持由扩展提供。在 PHP 4 中，MySQL 支持是默认提供的，但从 PHP 5.0 开始，你必须在激活 MySQL 支持后，PHP 才能与 MySQL\
  \ 数据库交互。（有关 PHP 扩展的更多信息，请参见书籍 V。）PHP 提供了两个支持 MySQL 的扩展：`mysql` 扩展和 `mysqli`（MySQL\
  \ Improved）扩展。你需要激活哪种扩展取决于你使用的 PHP 和 MySQL 版本。适用于 PHP 4、5 和 6 的 `mysql` 扩展提供了与 MySQL\
  \ 4.0 及更早版本进行交互的函数。在 PHP 5 中添加的 `mysqli` 扩展提供了与 MySQL 4.1 及更高版本进行交互的函数。你也可以在较版本的\
  \ MySQL 中使用 `mysql` 函数，但它们无法访问 MySQL 后期版本中添加的一些新功能。\n\n## 在 Linux 和 Mac OS 上激活 MySQL\
  \ 支持\n\n在 Linux 和 Mac 上安装 PHP 时，可以通过安装选项激活 MySQL 支持。必须在安装的第 4 步中使用激活 MySQL 的安装选项来启用。在\
  \ PHP 编译并安装之后，无法再添加 MySQL 支持。\n\n使用以下安装选项之一：\n\n```bash\n--with-mysqli=DIR\n--with-mysql=DIR\n\
  ```\n\n`DIR` 是指向相应 MySQL 目录的路径。使用 `with-mysqli` 时，使用相应 MySQL 的路径。使用 `with-mysql`\
  \ 时，使用 MySQL 安装目录的路径，例如：\n\n```bash\n--with-mysql=/local/mysql\n```\n\n## 在 Windows\
  \ 上激活 MySQL 支持\n\n在安装 PHP 后，通过配置 `php.ini` 文件中的扩展行来激活 MySQL。此外，你必须将文件放置在 PHP 能够找到的位置。\n\
  \n### 为 MySQL 支持配置 PHP\n\n要为 MySQL 支持配置 PHP，请执行以下步骤：*\n\n1. **打开 php.ini 文件。**\n\
  2. **找到扩展列表。**\n3. **找到你想要使用的 MySQL 扩展所在的行，例如** `extension=php_mysqli.dll`\n4. **删除该行开头的分号。**\n\
  \n### 设置 MySQL 文件\n\n为了提供 MySQL 支持，PHP 需要两个文件——`php_mysqli.dll` 和 `libmysql.dll`。让这些文件可用的方法是将主\
  \ PHP 目录添加到系统路径，然后将文件复制到主目录中。\n\n![Image 5](img/index-70_1.jpg)\n![Image 6](img/index-70_2.jpg)\n\
  \n你可以按照以下方式将主 PHP 目录（例如 `C:\\php`）添加到路径中：\n\n1. **进入控制面板。**\n2. **点击系统。**\n3. **点击高级。**\n\
  4. **点击环境变量。** 打开如图 2-2 所示的环境变量对话框。\n\n**图 2-2：** 检查你的环境变量。\n\n5. **在系统变量窗中点击 Path。**\
  \ 你可能需要向下滚动找到 `Path` 变量所在的行。\n6. **点击编辑按钮。** 打开如图 2-3 所示的编辑系统变量对话框。\n\n**图 2-3：**\
  \ 编辑系统变量。\n\n7. **在现有系统路径的末尾添加分号，然后加上主 PHP 目录的路径，例如 `;C:\\php`。**\n8. **点击确定。**\n\
  9. **重启电脑。**\n\n当主 PHP 目录包含在系统路径中，将所需文件复制到主目录中。扩展文件位于 `ext` 子目录。根据你使用的 MySQL 版本，复制以下文件之一：\n\
  \n- `ext\\php_mysqli.dll`（适用于 MySQL 4.1 或更高版本）\n- `ext\\php_mysql.dll`（适用于 MySQL\
  \ 4.0 或更早版本）\n\n[/content]\n将文件复制到主目录，例如 `C:\\php`。第二个所需文件名为 `libmysql.dll`，应该已经在主\
  \ PHP 目录中。如果不在，你需要找到它并将其复制那里。如果它不在你的 PHP 目录，它通常随 MySQL 安装，因此可以在安装 MySQL 的目录中查找它，可能在\
  \ bin 子目录中，例如 `C:\\Program Files\\MySQL\\MySQL Server 5.0\\bin`。\n\n\n\n\n\n你可以将文件复制到已在系统路径中的目录，例如\
  \ `c:\\windows` 或 `c:\\windows\\system32`，而不是像本节描述的那样修改系统路径以包含 PHP 主目录，并将文件复制到主目录。然而，尽管这种方法更简单、步骤更少，但在将来升级\
  \ PHP 时可能会导致问题。所有版本的 `.dll` 文件文件名相同。如果你将当前版本的文件保留在 PHP 主目录中，而不是将其复制到公共目录，你只需用新版本替换整个主目录即可。这样就不会混淆不同版本的\
  \ `.dll` 文件。\n\n## MySQL 支持\n\n要检查 MySQL 是否已激活，请按照本章前面“测试 PHP”部分的说明运行 `test.php`get。输出应包含一个显示\
  \ MySQL 设置的部分，如图 2-4 所示。如果输出中没有出现 MySQL 部分，请查看下一节“故障排除”。\n\n### 故障排除\n\n本节介绍了安装\
  \ PHP 时遇到的一些常见问题。\n\n![Image 7](img/index-72_1.jpg)\n\n### 图 2-4：MySQL 设置。\n\n###\
  \ 无法更改 PHP 设置\n\n如果你在 `php.ini` 文件中更改了设置，但更改似乎对 PHP 操作没有产生预期效果，可能是由于以下两个原因之一：\n\n\
  ✦ **你没有重启 Web 服务器。** 如果是这样，只需重启 Web 服务器即可使更改生效。\n\n✦ **你可能没有在 PHP 读取它的位置编辑 `php.ini`\
  \ 文件。** 你可以检查 PHP 正在读取哪个 `php.ini` 文件。你可能有多个 `php.ini` 文件，或者可能将其存储在了错误的位置。当使用 `phpinfo()`\
  \ 语句测试 PHP 时（如“测试 PHP”节所示），PHP 会输出许多变量值和设置。顶部设置之一是 `Configuration File Path`，它显示了\
  \ PHP 查找配置文件的路径。如果路径以文件名结尾，则该文件就是 PHP 使用的配置文件。如果路径以目录名结尾，PHP 正在该目录中查找配置文件但未找到，因此\
  \ PHP 正在使用默认配置。\n\n### 显示错误消息：未定义函数 (Undefined function)\n\n你可能会看到错误消息，说明你调用了未定义的函数。此消息意味着你正在调用\
  \ PHP 识别的函数。你可能拼错了函数名，或者可能调用了某个未激活的扩展中的函数。\n\n你可能会看到关于 mysql 函数的错误消息，类似于以下：\n\n\
  ```\nFatal error: Call to undefined function mysqli_connect()\n```\n\n这意味着 `mysqli`\
  \ 函数未激活 MySQL 支持。要么是你没有激活任何 MySQL 支持，要么是你激活了 `mysql` 扩展，而不是 `mysqli` 函数。\n\n####\
  \ Windows\n\n如果 MySQL 支持未激活，要么是 `php.ini` 中的扩展行未激活，要么 PHP 无法找到必要的文件。检查 `php.ini`\
  \ 中的扩展行，确保 `mysqli` 扩展行开头的分号已删除。如果 `php.ini` 看起来正确，你可能在做出更改后忘记重启 Web 服务器了。你也可以尝试完全停止\
  \ Web 服务器然后重新启动，而不是仅仅重启。最后，你可能编辑了错误的 `php.ini` 文件。确保你正在编辑的 `php.ini` 文件位于 PHP 查找它的位置，如\
  \ `phpinfo()` 输出所示。\n\n检查 `php_mysql.dll` 和 `libmysql.dll` 所在的目录是否在你的系统路径中。你可以通过\
  \ `phpinfo()` 的输出检查你的路径。输出末尾的 `Environment` 部分显示了路径。然而，除非你在更改路径后重启了系统，否则显示的路径并不是当前生效的路径。当你更改路径时，会显示新路径，但在重启系统之前它实际上不会变为活动。\n\
  \n#### Linux 或 Mac\n\n在安装 PHP 时没有激活 `mysql` 扩展。在安装 PHP 5 或 6 时，你必须在安装过程的第 4 步（配置步骤）中使用\
  \ MySQL 选项之一。\n\n#### MySQL 函数未激活 (Windows)\n\n当你查看 `phpinfo()` 的输出时，没有看到 `mysql`\
  \ 或 `mysqli` 扩展部分。然而，在你的 `php.ini` 文件中，一个或两个扩展都已激活。某些可能的原因是：\n\n✦ **在更改 `php.ini`\
  \ 中的设置后没有重启服务器。**\n\n✦ **你正在编辑错误的 `php.ini` 文件。** 检查 `phpinfo()` 输出以获取 PHP 读取设置的文件位置。\n\
  \n✦ **必要的 `.dll` 文件不在系统路径中指定的目录中。**\n\n✦ **PHP 正在读取的 MySQL `.dll` 文件适用于不同版本的 PHP。**\
  \ 有时候当你更新 PHP 时，并没有替换 `.dll` 文件。例如，假设你正在运行 PHP 5.0，且 `php_mysqli.dll` 位于 `c:\\windows\\\
  system32`。你升级到 PHP 6.0。你将 `.dll` 文件从 `ext` 复制到 PHP 主目录，并将 `c:\\php` 添加到系统路径末尾。然而，你忘记从当前位置删除旧的\
  \ `.dll` 文件。当 PHP 启动时，它首先遇到旧的 `.dll` 文件，因为 `system32` 目录在路径的第一位，PHP 尝试使用旧文件。由于无法使用旧文件，PHP\
  \ 未激活 mysqli 扩展。\n\n### 显示空白页面或仅显示 HTML 输出\n\n当你在浏览器中查看 Web 页面时，显示空白页面或仅显示 HTML\
  \ 输出，说明 Web 服务器没有将 PHP 代码发送给 PHP 处理。\n\n你可能没有通过 Web 服务器查看 Web 页面。你不能通过浏览器菜单中的“打开”来打开页面。你必须在浏览器地址栏输入页面的\
  \ URL，例如 `localhost/test.php`。\n\n你可能没有为 PHP 正确配置 Web 服务器。检查本章前面的“为 PHP 配置 Web 服务器”部分。\n\
  \n双检查 Apache 指令是否输入正确以及位置是否正确。在做出任何更改后务必重启 Web 服务器。\n\n\n\n\n\n要使用 MySQL 数据库，你需要一个可以与\
  \ MySQL 服务器通信的软件。在安装 MySQL 时，系统会自动安装 `mysql` 客户端程序。该程序允许你管理 MySQL 数据库。然而，`mysql`\
  \ 客户端是一个命令行、基于文本的程序。你可能更喜欢带有图形化用户界面（GUI）的程序，允许你拖动物体并点击按钮。如果是这样，你可以安装一些额外的 GUI 软件，它们提供了方便的\
  \ MySQL 数据库管理。\n\n在本章中，我们将讨论 `phpMyAdmin`，这是一种流行的用于管理 MySQL 数据库的 Web 程序。我们还将讨论由\
  \ MySQL 开发人员并提供的两个管理程序，它们可以作为 `phpMyAdmin` 的替代方案。使用哪种管理程序（如果有的话）取决于个人选择。你可能想尝试所有的程序，看看最喜欢哪一个。\n\
  \n# 检查 MySQL 安装情况\n\n你可能需要或不需要安装 MySQL。在很多情况下，MySQL 已经安装好了。例如，大多数最新的 Linux 和 Mac\
  \ 发行版会自动安装 MySQL。Windows 操作系统并不提供 MySQL。\n\n在安装 MySQL 之前，请确保你确实需要安装它。它可能已经在你的电脑上运行，或者可能已经安装但但没有运行。例如，许多\
  \ Linux 发行版会自动安装 MySQL。\n\n以下是检查 MySQL 当前是否运行的方法：\n\n* **Linux/Unix/Mac:** 在命令行中输入以下内容：`ps\
  \ –ax`\n\n输出应该是一个程序列表。某些操作系统（通常是 Unix 的变体）对 `ps` 命令有不同的选项。如果前面的命令没有产生运行中的程序列表，请输入\
  \ `man ps` 查看你需要使用哪些选项。\n\n在出现的程序列表中，寻找名为 `mysqld` 的程序。如果你找到了它，说明 MySQL 正在运行。\n\n\
  * **Windows:** 如果 MySQL 正在运行，它将作为服务运行。若要检查这一点，选择开始➪控制面板➪管理工具➪服务，并向下滚动按字母排序的服务列表。如果\
  \ MySQL 已作为服务安装，它将出现在列表中。如果它当前正在运行，其状态显示为 `Started`（已启动）。\n\n如果你如所述在服务列表中找到了 MySQL，但它没有启动，你可以通过突出服务列表中的\
  \ MySQL 并点击左侧面板中的“启动服务”来启动它。\n\n即使 MySQL 当前没有运行，它也可能已经安装但尚未启动。以下是检查你的电脑上是否安装了 MySQL\
  \ 的方法：\n\n* **Linux/Unix/Mac:** 输入以下内容：\n```bash\nfind / -name “mysql*\"\n```\n\
  如果找到了名为 `mysql` 的目录，说明 MySQL 已安装。\n\n* **Windows:** 如果你没有在当前服务列表中找到 MySQL，请寻找 MySQL\
  \ 目录或文件。你可以通过选择开始➪搜索来查找。\n\n默认安装目录对于新版本为 `C:\\Program Files\\MySQL\\MySQL Server\
  \ versionnumber`，旧版本为 `C:\\mysql`。\n\n如果你在电脑上找到了 MySQL，但在运行中的程序列表（Linux/Unix/Mac）或当前服务列表（Windows）中没有找到它，下面的步骤将向你如何启动它。\n\
  \n# 获取 MySQL\n\n在 Linux/Unix/Mac 上启动 MySQL，请遵循以下步骤：\n\n1. **切换到目录 `mysql/bin`。**\n\
  \   这是你你在检查 MySQL 是否已安装时应该找到的目录。\n2. **输入 `mysqld_safe &`。**\n   当此命令完成后，将显示提示符。\n\
  3. **通过输入 `ps -ax` 检查 MySQL 服务器是否已启动。**\n   在出现的程序列表中，寻找名为 `mysqld` 的程序。如果你找到了它，说明\
  \ MySQL 正在运行。\n\n在 Windows 上启动 MySQL，请遵循以下步骤：\n\n1. **打开命令提示符窗口。**\n   在 Windows\
  \ XP 中，选择开始➪所有程序➪工具➪命令提示符。\n2. **切换到 MySQL 安装的文件夹。**\n   例如，输入 `cd C:\\Program Files\\\
  MySQL\\MySQL Server 5.0`。\n   你的光标现在位于 MySQL 文件夹中。\n3. **通过输入 `cd bin` 切换到子文件夹。**\n\
  \   你的光标现在位于 bin 子文件夹中。\n4. **通过输入 `mysqld --install` 启动 MySQL 服务器。**\n   MySQL\
  \ 服务器作为 Windows 服务启动。你可以按照之前的描述进入服务列表来检查安装情况，并确保 MySQL 现在出现在服务列表中且其状态为 `Started`（已启动）。\n\
  \n如果你的电脑上没有安装 MySQL，你需要从 www.mysql.com 下载并安装它。本章的剩余部分将提供相关说明。\n\nMySQL 开源软件有两个版本：\n\
  \n* **社区版 (Community Server):** 这是一个免费下载的 MySQL 开源版本。任何符合 GPL（GNU 通用许可证）要求的人都可以免费使用该软件。如果你在网站上使用\
  \ MySQL 作为数据库（这是本书的主题），即使你通过你的网站获利，你也可以免费使用 MySQL。\n* **企业版 (Enterprise Server):**\
  \ 这是一个通过按月订阅费用提供的企业级软件和服务集合。\n\n## 从 MySQL 官方网站下载\n\n你可以从 MySQL 官方网站 www.mysql.com\
  \ 获取 MySQL。\n\nMySQL 以二进制文件的形式提供——这些是已经针对特定操作系统编译好的机器文件。如果你的操作系统有二进制文件，你应该下载该二进制文件。如果你的操作系统没有二进制文件，你可以下载源代码并编译安装\
  \ MySQL。\n\n要获取 MySQL，请访问 www.mysql.com 并点击 Download（下载）链接。找到你需要的版本（例如 5.0 版本）以及你需要的版本（例如社区版）。每个版本都有许多文件可用，并按操作系统组织。\n\
  \n## 获取 Windows 版 MySQL\n\nWindows 二进制文件带有带有程序程序提供，该安装程序将安装、配置并启动 MySQL。在你所需版本的\
  \ MySQL 网站下载页面上，找到 Windows 部分。\n\n在 Windows 部分，点击你想要下载的文件旁边的下载链接。你可以下载 Windows Essentials（精简版），这是一个满足大多数需求的小文件；也可以\
  \ Windows Complete（完整版），这是一个包含更多可选软件（如嵌入式服务器和基准测试套件）较大的包。\n\n## 获取 Linux 和 Unix\
  \ 版 MySQL\n\n许多 Linux 计算机已经安装了 MySQL。许多 Linux 系统在安装 Linux 时也会安装（或提供安装选项）MySQL。\n\
  \n许多 Linux 系统（如 Fedora、SuSE 和 Ubuntu）包含内置工具，可以为你下载并安装 MySQL，通常是最新版本。\n\n在很多情况下，安装由\
  \ Linux 发行版提供的 MySQL 比从 MySQL 网站下载并安装是一个更简单、更高效的选择。如果你需要安装 MySQL（例如系统上的 MySQL 版本较旧），请检查你\
  \ Linux 发行版的网站。\n\n\n\n\n以查看其是否提供了一种简单安装当前版本 MySQL 的方法。\n\n#### 环境：MySQL 软件包\n\n\
  此外，`RPM` 文件可能已经存在于你的 Linux 操作系统附带的光盘中。从光盘安装 `RPM` 文件可以节省你下载的麻烦，但如果你光盘上的 MySQL 版本不是最新版本，你可能仍然想要下载\
  \ `RPM` 文件。\n\n如果你无法从你的 Linux 发行版网站获取所需的 MySQL，可以从 MySQL 官网获取 MySQL 二进制文件。下载页面提供了用于下载和使用\
  \ `RPM` 命令进行安装的 `RPM` 文件。官方特别提供了专门适用于 Red Hat Linux 和 SuSE 的 `RPMs`，以及适用于其他 Linux\
  \ 变体版本的通用 `RPM`。每个 Linux 发行版都提供了几个文件。你至少需要下载服务器和客户端文件。请参见后文章节“从 RPM 文件在 Linux 上安装\
  \ MySQL”获取从 `RPM` 文件安装 MySQL 的说明。\n\n此外，还提供了适用于 Ubuntu Linux 的二进制文件。同时也提供了适用于 Solaris、FreeBSD、IBM\
  \ AIX 以及其他 Linux/Unix 操作系统的二进制文件。\n\n如果 `RPM` 文件和二进制文件都不适用于你的需求，你始终可以按照后文章节“从源文件安装\
  \ MySQL”中的描述从源码安装 MySQL。\n\n## 获取 Mac 版 MySQL\n\nMac OS X 10.2 及更高版本包含 MySQL。如果你需要在你的机器上安装更新版本的\
  \ MySQL，MySQL 官网提供了一个用于在 Mac OS X 10.3 或更高版本安装的 `PKG` 文件。请参见后文章节“从 PKG 文件在 Mac 上安装\
  \ MySQL”获取说明。\n\n在少数特殊情况下，你可能无法通过 `PKG` 文件安装 MySQL，例如你需要的功能比 `PKG` 提供的更多或更少。\n\n\
  如有必要，你可以下载源代码并在 Mac 上编译并安装 MySQL。MySQL 官网提供了相关说明。\n\n## 获取合一安装工具件\n\n你可以获取一些可以在一次程序中安装\
  \ PHP、MySQL 和 Apache 的工具件。这些工具件可以极地简化安装过程。然而，提供的软件可能不包含你需要的特性和扩展。\n\n## 安装 MySQL\n\
  \n`XAMPP` 是一个流行的合一安装工具件，包含 Apache、PHP 和 MySQL。它还安装了 `phpMyAdmin`，一个用于管理 MySQL 数据库的工具。使用\
  \ `phpMyAdmin` 的优势在第三本书第 1 章中讨论。\n\n`XAMPP` 提供了 Windows（包括 Windows Vista）以及多个 Linux\
  \ 版本的稳定版本。此外，还有 Mac 和 Solaris 的 `XAMPP` 版本，但这些版本目前较新，测试和开发尚不够完善。`XAMPP` 可以在 `www.apachefriends.org/en/xampp.html`\
  \ 获取。本微型教程第 5 章提供了安装 `XAMPP` 的说明。\n\n`WAMP5` 是一个流行的 Windows 安装工具件，提供了最新版本的 Apache\
  \ 2.2、PHP 5 和 MySQL 5。它还安装了 `phpMyAdmin`，一个用于管理 MySQL 数据库的工具。`WAMP5` 网站表示兼容 Vista。`WAMP5`\
  \ 不在 Windows 98/Me 上运行`WAMP5` 可以在 `www.en.wampserver.com` 获取。\n\n`MAMP` 是一个适用于 Mac\
  \ 的工具件，为 Mac OS X 安装 Apache、PHP 和 MySQL。这个免费包在你的 Mac PowerBook 或 iMac 上安装本地服务器环境。`MAMP`\
  \ 主要作为你本地计算机的 PHP 开发环境而创建，不应作为互联网的生产服务器使用。你可以在 `www.mamp.info` 获取 `MAMP`。\n\n##\
  \ 验证下载的文件\n\nMySQL 官网提供了在你下载后验证软件的方法，这作为一种安全预防措施，以确保文件没有被坏人篡改。基本上，验证 PHP、MySQL 和\
  \ Apache 文件使用的是的是相同的过程。你可以在本微型教程第 2 章中关于“验证下载的文件”的章节中找到验证文件的说明。\n\n## 安装 MySQL\n\
  \n尽管 MySQL 运行在许多平台上，但我们重点描述了如何在 Linux、Unix、Windows 和 Mac 上安装它，这些平台共同构成了互联网上大多数的网站。在开始安装之前，请务必完整阅读说明。\n\
  \n### 在 Windows 上安装 MySQL\n\nWindows 版 MySQL 包含两个向导：\n\n- **安装向导 (Setup Wizard)：**\
  \ `安装向导` 安装 MySQL。创建目录并将文件复制到适当的位置。\n- **配置向导 (Configuration Wizard)：** `配置向导` 将\
  \ MySQL 安装为服务，创建访问数据库所需的 MySQL 账户和密码，并配置其他 MySQL 设置。\n\n#### 环境：MySQL 软件包\n\n当你第一次安装\
  \ MySQL 时，需要在运行 `安装向导` 之后运行 `配置向导`。在运行 `配置向导` 之前，你无法访问 MySQL 数据库。\n\n##### 运行 MySQL\
  \ 安装向导\n\n要在 Windows 上设置 MySQL，请遵循以下步骤：\n\n1. **双击你下载的安装程序 (.msi) 文件。**\n   文件名为\
  \ `mysql-essential-`，后跟版本号，最后是 `-win32.msi`，例如 `mysql-essential-5.0.37-win32.msi`。\n\
  \   显示如图 3-1 所示的界面。***注意：*** 如果你从 Windows NT/2000/XP/Vista 系统安装，请确保你登录了具有管理员权限的账户。在\
  \ Vista 中，你可能需要右键点击文件名并选择“以管理员身份运行”。\n\n2. **点击下一步 (Next)。**\n   你会看到一个选择安装类型的屏幕。\n\
  \n3. **选择“典型 (Typical)”然后点击下一步 (Next)。**\n   打开“准备安装程序”界面。将显示当前设置。\n\n4. **点击安装\
  \ (Install)。**\n   开始安装 MySQL。当安装完成后，会打开“注册 (Sign-Up)”屏幕。\n\n5. **点击跳过注册 (Skip Signup)然后点击下一步\
  \ (Next)。**\n   出现“向导完成 (Wizard Completed)”屏幕，如图 3-2 所示。\n\n6. **如果你是第一次安装此版本的服务器，请勾选“现在配置\
  \ MySQL (Configure the MySQL Now)”选框。**\n   如果你正在升级 MySQL 服务器，例如从 MySQL 5.0.18 升级到\
  \ 5.0.22，你可能不需要配置服务器。向导将赋予它与现有版本相同的配置。然而，如果你升级到一个新的主版本，例如从 MySQL 5.0 升级到 MySQL 5.1，你需要运行\
  \ `配置向导`。\n\n7. **点击完成 (Finish)。**\n   如果你勾选了现在配置 MySQL，`配置向导`将立即启动。将在下一节中解释。如果你没有选择，`安装向导`\
  \ 将停止运行。\n\n##### 运行 MySQL 配置向导\n\n安装 MySQL 后，必须对其进行配置。你需要为名为 `root` 的 MySQL 账户分配密码，该账户是自动安装的。\n\
  \n你需要启动服务器并设置使其在计算机启动时自动启动。\n\nMySQL 提供了一个 `配置向导`。如果你在最后的设置界面上勾选了“现在配置 MySQL”选框，则\
  \ `配置向导`将在安装后立即启动。你也可以随时通过 MySQL 开始菜单中的菜单项启动 `配置向导`。\n\n1. **选择“开始 -> 所有程序 -> MySQL\
  \ -> MySQL Server 5.0 -> MySQL Server Instance Config Wizard”。**\n\n`配置向导` 启动，如图\
  \ 3-3 所示。\n\n\n\n\n配置向导。\n\n2. **如果你安装了多个版本的 MySQL，将会出现屏幕，你可以点击想要配置的版本。然后点击 Next（下一步）。**\n\
  \n打开 MySQL Server Configuration 窗口。\n\n3. **点击 Standard Configuration（标准配置），然后点击\
  \ Next。**\n\n打开 Windows Options 窗口。\n\n4. **选择 Install as a Windows Service（作为 Windows\
  \ 服务安装）选项。**\n\n如果你使用的是 Windows 98/Me，无法安装为 Windows 服务。相反，请选择 Add Bin Directory\
  \ to Windows PATH 选项，并跳到第 7 步。\n\n![Image 11](img/index-85_1.jpg)\n\n07_167779 bk01ch03.qxp\
  \ 12/17/07 8:06 PM Page 56\n\n56\n\n安装 MySQL\n\n5. **在 Service Name（服务名称）文本框中，输入\
  \ `mysql50`。**\n\n6. **选择 Launch the MySQL Server Automatically（自动启动 MySQL 服务器）选项。**\n\
  \n7. **点击 Next。**\n\n打开 Security Options（安全选项）窗口，如图 3-4 所示。\n\n**图 3-4：**\n\nMySQL\
  \ 配置向导中的 Security Options 窗口。\n\n8. **选择 Modify Security Settings（修改安全设置）复选框。**\n\
  \n9. **在 New Root Password（新根密码）文本框中输入密码。在 Confirm（确认）文本框中重新输入相同的密码。**\n\n如果之前配置过\
  \ MySQL，此屏幕会要求输入当前密码。\n\n你现在正在为 MySQL 服务器的 root 账户设置密码。你必须使用 root 账户访问 MySQL 数据库。你需要记住你在这里输入的密码。\n\
  \n10. **如果你正在设置一个只有你可以访问的开发环境，可以选择 Create an Anonymous Account（创建匿名账户）复选框。**\n\n\
  匿名账户非常方便。但是，如果互联网可以访问你的 MySQL 服务器，请不要创建匿名账户。这是一个安全风险。\n\n11. **点击 Next。**\n\n打开\
  \ Ready to Execute（准备执行）窗口。\n\n12. **点击 Execute（执行）。**\n\n配置完成后将出现一条消息。\n\n07_167779\
