  \ 582\n\n582 构建购物车网页\n\n## 购物车网页\n\n该应用程序显示当前存储在购物车中的商品，如图 5-3 所示。\n\n**图 5-3：**\
  \ 购物车网页。\n\n购物车提供了三个客户可以点击的按钮：\n\n*   **继续购物（Continue Shopping）：** 将客户返回目录分类页面。\n\
  *   **提交订单（Submit Order）：** 提交购物车中商品的订单。\n*   **更新购物车（Update Cart）：** 允许客户更改购物车中的商品。客户可以更改“数量”列中的商品数量并点击此按钮。购物车将根据更改后的数量重新显示。如果将数字改为\
  \ 0（零），该商品将从购物车中移除。\n\n注意购物车中当前有三个商品。在图 5-2 所示的商品页面中仅选择了两个商品。购物车中显示的第一个商品之前已存储在购物车中；后两个商品是添加进去的。\n\
  \n## 订单网页\n\n应用程序通过图 5-4 所示的表单收集处理和运输订单所需的信息。\n\n![Image 90](img/index-612_1.jpg)\n\
