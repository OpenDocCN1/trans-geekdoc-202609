  \ `GD`，让它动态创建饼图。\n\n### 颜色处理\n\n颜色是当你处理图像时非常实用的概念。在 Web 开发中，颜色通常通过红色、、、蓝、RGB。。。。\n\
  \n颜色颜色是是是，，，。。。。。。。。。。。。。。。。。。。。。。。。。。。，，。，，。。。。。。。。。。。。。。章章，，，为了避免创建一个创建的图像，而不是红色。你更好的做法是告诉\
  \ `GD` “我想要这张图像，而不是红色。”\n\n### 通道\n\n在数字图形世界中，颜色被描述*通道*或*索引*。\n\n任何给定的图像至少有三个通道：每个用于红、绿、蓝。你通过在三个通道中放置十进制值来指定颜色的色调，如下所示。最后一列十六进制值是将十进制值转换为十六进制的简单转换。为什么？写六个十六进制字符比写九个十进制要容易。当数值到达计算机时，它们都会转换为二进制，所以我们人类选择并不重要。\n\
  \n| 颜色 | 红色通道 | 绿色通道 | 蓝色通道 | 十进制值 |\n| :--- | :--- | :--- | :--- | :--- |\n| 白色\
  \ | 255 | 255 | 255 | FFFFF |\n| 红色 | 255 | 0 | 0 | FF0000 |\n| 紫色 | 147 | 112 |\
  \ 219 | 9370DB |\n| 黑色 | 0 | 0 | 0 | 000000 |\n\n使用颜色通道的一种常用方法是更改按钮的颜色。这样做，请遵循以下步骤：\n\
  \n1.  使用 `ImageCreateTrueColor()` 方法创建一个图像句柄：\n    ```php\n    $image = imagecreatetruecolor(300,\
  \ 150);\n    ```\n2.  创建你想使用的颜色：\n    ```php\n    $red = imagecolorallocate($image,\
  \ 255,0,0);\n    $green = imagecolorallocate($image, 0,255,0);\n    $blue = imagecolorallocate($image,\
  \ 0,0,255);\n    ```\n3.  使用 `imagefill()` 方法用选定的颜色填充图像：\n    ```php\n    if($color\
  \ == ‘blue’) {\n        $image = imagefill($image, 0, 0, $blue);\n    } elseif ($color\
  \ == ‘green’) {\n    ```\n\n\n\n\n\n```php\n$image = imagefill($image, 0, 0, $green);\n\
  } else {\n    $image = imagefill($image, 0, 0, $red);\n}\n```\n\n此时，`$image` 已经根据\
  \ `$color` 中存储的值填充了我们所需的任何颜色。\n\n使用 alpha 通道\n\n上一节描述了最后三个通道——红、绿、蓝。但那个难以捉摸的 alpha\
  \ 通道呢？alpha 通道是预留用于过滤或掩码信息的 8 位通道。通常，它用于描述图形的透明度。值为 `10000000`（对于人类读者来说是 `128`）的\
  \ alpha 通道大约有 50% 的透明度。\n\n每幅数字图像都是矩形——即使是那些看起来像圆形、三角形或其他非矩形形状的。圆是如何变成矩形的呢？\n\n\
  当矩形的边缘和角（圆形之外的所有部分）是透明的。你可以将其想象成擦掉形状的矩形边缘和角，直到得到一个圆。\n\n你还可以使用 alpha 通道来描述重叠形状应该如何渲染。是一个形状应该融入另一个形状，使重叠区域比两个初始形状更暗？还是一个形状应该遮挡另一个形状？\n\
  \n指定这种形状混合最常见的方法是使用 `ImageColorAllocateAlpha()` 方法。该方法的作用与上一个示例中 `ImageColorAllocate()`\
  \ 方法一样，不同之处在于它允许你指定一个 0 到 127 之间的数字来描述颜色的透明度。`0`（零）表示完全不透明，而 `127` 表示完全透明。介之间的任何数字都会导致颜色与背后显示的任何颜色之间的混合效果增强或减弱。要在图像中创建一个中等透明度的颜色，请使用以下代码：\n\
  \n```php\n$red = imagecolorallocatealpha($image, 255,0,0,64);\n```\n\n### 颜色索引\n\
  \n之前的两个章节展示了如何向真正只理解黑白（或 0 和 1）的机器描述颜色。你如何利用这些辛苦得来的知识呢？\n\n首先，你可以使用 `ImageColorAt()`\
  \ 函数检查图像中特定像素的颜色值：\n\n## 第 4 章\n\n```php\n$color_index = ImageColorAt(image, x,\
  \ y)\n```\n\n`ImageColorAt()` 需要三个参数：图像句柄、要检查的像素的 `x` 坐标和 `y` 坐标。它返回一个索引，你可以将该索引传递另一个函数\
  \ `ImageColorsForIndex()`，该函数会给你一个 RGB 值：\n\n```php\n$color_values = ImageColorsForIndex($image,\
  \ $color_index)\n```\n\n其中 `$image` 是图像句柄，$color_index` 是 `ImageColorAt()` 函数的结果。`ImageColorsForIndex`\
  \ 返回一个带有三个或四个键的数组（取决于你是否有 alpha 索引）：\n\n* Alpha：仅适用于 32 位图像\n* 红\n* 绿\n* 蓝\n\n你很有可能不会以单个像素为单位来操作颜色，但如果你想将图像中的绿色圆改为红色，这些函数将会非常有用。你只需要循环遍历像素，并在每次发现绿色像素时进行修改，如下例所示：\n\
  \n```php\n$red = ImageColorAllocate($image, 255,0,0);\nwhile($x <= $image_width)\
  \ {\n    while($y <= $image_height) {\n        $colors = ImageColorsForIndex($image,\
  \ ImageColorAt($image, $x, $y));\n        if ($colors['red'] == 0 && $colors['green']\
  \ == 255 && $colors['blue'] == 0) {\n            Imagesetpixel($image, $x, $y, $red);\n\
  \        }\n    }\n}\n```\n\n### 向图像中添加文本\n\n在使用 GD 时会遇到的最常见任务之一是向图像添加文本，例如按钮图形。根据你想要使用的字体库，你需要这些函数之一：\n\
  \n* `ImageString()` 使用五种内置的 GD 字体。\n* `ImageStringUp()` 垂直打印。\n* `ImageTTFText()`\
  \ 使用 TrueType 字体。\n* `ImagePSText()` 使用 PostScript 字体。\n\n每个函数都需要一组略有不同的参数。（当然了，没有什么是简单的，对吧？）接下来的子节描述了每个\
  \ `Image` 函数的参数。\n\n#### 使用 `ImageString()` 参数\n\n`ImageString()` 函数使用以下参数：\n\n\
  `ImageString($image, $font_number, $x, $y, $text, $text_color)`` 大部分参数应该是自显易懂的——`ImageString()`\
  \ 需要一个图像句柄、使用的字体编号、在图像上放置文本的 `x` 和 `y` 坐标以及字体颜色。对于接下来的示例，假设你有一个（使用 `ImageCreateTrueColor()`\
  \ 创建，如“通道”部分之前描述的）名为 `$image` 的图像。你想在图像的左上角用红色添加文本“hello world”。使用 `ImageString()`\
  \ 的代码如下：\n\n```php\nif (!ImageString($image, 1, 0,0,'hello world',$red)) {\n   \
  \ die('could not add text to image');\n}\n```我们将方法调用封装在 `if()` 语句中，因为 `ImageString`\
  \ 返回一个布尔值——成功为真，失败为假。\n\n#### 使用 `ImageTTFText()` 参数\n\n`ImageTTFText()` 有自己的一组参数：\n\
  \n`ImageTTFText($image, $size, $angle, $x, $y, $text_color, $path_to_TT_Font, $text)``\
  \ 使用此示例，向图像添加“hello world”的代码为：\n\n```php\n$text_coordinates = ImageTTFText($image,\
  \ 1,45,0,0,$red,'/fonts/myfont.ttf','hello world')\n```\n\n#### 使用 `ImagePSText()`\
  \ 参数\n\n`ImagePSText()` 需要两个步骤的过程。首先，加载你想使用的字体：\n\n```php\n$font = ImagePSLoadFont('/path/to/font.pfb');\n\
  ```\n\n然后使用字体在图像中显示文本：\n\n```php\nImagePSText($image, $text, $font, $size, $text_color,\
  \ $background_color, $x, $y);\n```\n\n使用 `ImagePSText()` 向图像添加文本“hello world”的代码如下：\n\
  \n```php\n$font = ImagePSLoadFont('/fonts/myfont.pfb');\nImagePSText($image, 'hello\
  \ world', $font, 50, $red, $white, 0,0);\n```\n\n我们在短短的一个章节中包含了大量信息，但它足够让你开始了。当你准备好深入研究\
  \ GD 时，很好的起点是位于 www.php.net/manual/en/ref.image.php 的可用文档。\n\n\n\n\nPHP 邮件扩展简单地为底层邮件服务器提供了一个良好的接口。需要澄清的是，PHP\
  \ 邮件扩展实际上并不会处理发送电子邮件的任务。它们不需要这样做，因为几乎每个 Web 服务器都安装了邮件服务器。为什么要重复发明一个特别棘手的轮子（轮子）呢？然而，通过\
  \ PHP 直接向邮件服务器发送命令将非常复杂，而且是一个安全噩梦。这正是邮件扩展大显身手的地方。它们将通过邮件服务器发送消息的复杂性封装在了几个简单的函数调用中。\n\
  \n## 电子邮件\n\n发送邮件遵循 80/20 法则：80% 的时间里，你会使用最基础的 20% 邮件功能。（在本章的后后部分，我们将介绍更高级的机制，以防你恰好遇到那少数\
  \ 20% 的特殊情况。）我们首先开始介绍那些你将使用 80% 时间的 20% 基础邮件功能。\n\n## 配置 PHP 发送电子邮件\n\n为了通过 PHP\
  \ 发送电子邮件，你要做的第一件事是检查本节列出的配置指令，以确保其配置正确。如果你运行的是标准的 Sendmail 安装，那么很有可能一切都准备就绪。但以防万一，这里是\
  \ PHP 邮件的配置指令：\n\n- `SMTP`: 默认值为“localhost”。你可以在 `php.ini` 文件中更改此设置。要了解如何修改 `php.ini`\
  \ 中的设置，请参阅第四本书第 3 章。修改 `SMTP` 设置仅在 Windows 环境下是必要的。\n- `SMTP_port`: 默认值为 25。你可以在\
  \ `php.ini` 中更改此设置。再次，这种修改仅在 Windows 服务器上是必要的。运行 Mac、Linux 或 Unix 的服务器会自动检测正确的端口号。\n\
  - `sendmail_from`: 默认值为 NULL。当从 Windows 发送邮件时，这是插入到 Header 中“From:” 和“Return-Path:”\
  \ 字符串中的字符串。\n- `sendmail_path`: 默认值为 NULL。PHP 会尽力为你寻找 Sendmail，但如果你在非标准位置安装了 Sendmail，或者你正在使用其他邮件服务器，你应该修改\
  \ `sendmail_path` 设置。将默认值替换为 Sendmail 或另一个邮件服务器的路径。\n\n就是这样——你已经完成了，PHP 已经准备好发送电子邮件了。\n\
  \n## 使用 mail()\n\nPHP 中的 `mail()` 函数非常直接。给它一个收件者、主题行和消息，它就发了。当然，`mail()` 也提供了指定许多更多\
  \ Header 的选项。以下是 `mail()` 接受的参数列表：\n\n- `To`: 电子邮件的接收者。你可以在这里放置多个接收者，用逗号分隔。\n- `Subject`:\
  \ 主题行。确保这不包含换行符，否则邮件无法正常发送。\n- `Message`: 电子邮件的内容。\n- `Additional_headers`: 这是可选的，直接传递给邮件服务器。`Additional_headers`\
  \ 数组允许你指定额外的 Header，例如 `cc`（抄送）、`bcc`（密抄）等。你设置的额外 Header 取决于你的邮件服务器。请参考你的邮件服务器文档查看它接受哪些额外\
  \ Header。\n- `Additional_parameters`: 另一个直接发送到邮件服务器的可选参数。它允许你将信封者等额外参数直接发送给 Sendmail。\n\
  \n`mail()` 函数最基础（最常用）的用法如下：\n\n```\n$to = \"sysadmin@example.com\";\n$subj = \"\
  Intuder Alert!\";\n$message = \"Unauthorized access detected. You might want to\
  \ look at the log.\";\nmail($to, $subj, $message);\n```\n\n当然，你也可以将所有信息放在一行中：\n\
  ```php\nmail(\"sysadmin@example.com\", \"Intuder Alert!\", \"Unauthorized access\
  \ detected. You might want to look at the log.\");\n```\n\n但当你想要发送给多个接收者或你的消息超过了好几个单词时，将\
  \ `mail()` 函数放在同一行就会变得繁琐。前面的示例假设你正在向一个已知的接收者（在这种情况下是系统管理员）发送自动生成的消息。但如果你想向未知的接收者发送电子邮件呢，例如刚刚在你的网站上注册账户的新用户呢？在发送该电子邮件之前，你可能需要做几件事，例如验证用户的电子邮件地址并对发送的消息进行个性化。在这种情况下，先定义变量比将所有信息都放入函数调用要有意义得多。下面的代码示例演示了你如何向新用户发送欢迎邮件。为了简洁起见，我们假设你已经验证了\
  \ `POST` 数组中的所有数据。\n\n```php\n$to = $_POST['email'];\n$subject = \"Welcome to our\
  \ site!\";\n$body = \"Thanks for registering on our Web site. We’re glad you’re\
  \ here!\";\nmail($to, $subject, $body);\n```\n\n## 安全考量\n\n当你向应用程序添加电子邮件功能时，你就让自己暴露在了一个全新的安全问题世界中。这并不意味着你不应该永远使用\
  \ `mail()`！事实上，保护你的应用程序免受恶意用户的影响其实很容易。\n\n## MIME 类型\n\n曾经几何，人们只期待简单的文本电子邮件。如今，用户期望电子邮件——尤其是企业发送的邮件——能与相关的网站一样美观且具有交互性。这意味着\
  \ PHP 优秀且简单易用的 `mail()` 函数是过时新闻了吗？完全不是！这意味着你必须出大杀器了：PEAR 的 `Mail_Mime` 包。你可以在 http://pear.php.net/package/Mail_Mime\
  \ 获取 `Mail_Mime`。关于从 PEAR 安装包的更多信息，请参考本迷你书的第 2 章。`Mail_Mime` 需要比 `mail()`更多的参数：\n\
  \n- `Text`: 消息的纯文本版本。\n- `HTML`: 消息的 HTML 版本。\n- `File`: 如果你想发送附件，请设置此项。\n- `Headers`:\
  \ 自定义 Header 数组。\n\n发送 MIME 编码的电子邮件还需要多个步骤，但结果是值得的。列表 5-1 提供了一个 MIME 编码电子邮件的示例。\n\
  \n### 列表 5-1：MIME 编码电子邮件的示例代码\n\n```php\n<?php\ninclude('Mail.php');\ninclude('Mail/mime.php');\n\
  \n$text = 'Text version';\n$html = '<html><body>HTML version</body></html>';\n$file\
  \ = '/home/tballad/attachment.txt';\n$headers = array(\n    'From' => 'user@example.com',\n\
  \    'Subject' => 'Test mime message'\n);\n\n$mime = new Mail_mime();\n$mime->setTXTBody($text);\n\
  $mime->setHTMLBody($html);\n$mime->addAttachment($file, 'text/plain');\n$body =\
  \ $mime->get();\n\n$headers = $mime->headers($headers);\n\n$mail =& Mail::factory('mail');\n\
  $mail->send('postmaster@localhost', $headers, $body);\n?>\n```\n\n不要乱序调用第 19 行和第\
  \ 20 行，否则整个过程都会崩溃且邮件将无法发送。如果你在 `php.ini` 中关闭了警告，你甚至收不到错误消息。\n\n## 队列消息以后发送\n\n发送电子邮件——尤其是发送给大量接收者——可能是一项非常消耗资源的任务。如果你发送的消息对时间不敏感，最好的做法是使用\
  \ `Mail_Queue` 包将它们排队，并通过 cron 或另一个调度服务在空闲期间发送。\n\n使用 `Mail_Queue` 包需要你做一些准备工作。\n\
  \n\n\n首先，你需要在数据库中建立一个表来存储队列中的消息，直到需要发送它们。接下来，如果你将所有配置信息放在一个单独的配置文件中，你的工作将会变得简单得多，你可以在需要队列或发送消息时随时包含该文件。\n\
  \n最后，你将需要设置 cron job（定时任务）或其他方法来按计划发送队列中的消息。\n\n这并没像听起来那么复杂——就像所有棘手的问题一样，你所做的只是将其拆分解为易于处理的小块：\n\
  \n1. **建立一个数据库表来存储电子邮件消息和时间戳信息。**\n   你需要在表中存储基础的邮件信息，如收件人、主题和消息内容。你可能还想跟踪消息创建的时间、发送时间、额外的标头（headers）等。\n\
  \n2. **使用你喜欢的文本编辑器，创建一个像列表 5-2 所示的配置文件，以存储 `Mail_Queue` 所需的信息，包括数据库访问信息和邮件服务器选项。**\n\
  \   请参阅本节稍后的列表 5-2。\n\n3. **编写一个发送电子邮件的脚本（列表 5-3 提供了一个脚本示例）。**\n   你将通过 cron job\
  \ 定期运行此脚本。\n\n4. **使用 `Mail_Queue` 类中的 `put()` 函数从应用程序内部向队列添加消息，如下代码所示：**\n\n```php\n\
  $queue = new Mail_Queue;\n\n$queue->put($from, $to, $headers, $body);\n```\n\n列表\
  \ 5-2 是 `Mail_Queue` 的示例配置文件。我们将此文件命名为 `Mail_Queue_Config.php`。\n\n#### 列表 5-2：`Mail_Queue_Config.php`\
  \ 文件\n```php\n<?php\n\nrequire_once \"Mail_Queue.php\";\n\n// 消息存储选项\n// type 是使用的容器，目前有\
  \ db 和 mdb 可用\n$db_options['type'] = 'db';\n$db_options['dsn'] = 'mysql://user:password@host/database';\n\
  $db_options['mail_table'] = 'mail_queue';\n\n// 这里是发送消息本身的选项\n// 这些是 Mail-Class\
  \ 需要的选项，\n// 特别用于 Mail::factory()\n$mail_options['driver'] = 'smtp';\n$mail_options['host']\
  \ = 'smtp.example.com';\n$mail_options['port'] = 25;\n$mail_options['localhost']\
  \ = 'localhost'; // 可选\nMail_smtp 参数\n$mail_options['auth'] = false;\n$mail_options['username']\
  \ = '';\n$mail_options['password'] = '';\n\n?>\n```\n\n列表 5-3 显示了发送队列消息的脚本。\n\n\
  #### 列表 5-3：发送队列消息的脚本\n```php\n<?php\n\ninclude 'Mail_Queue_Config.php';\n\n/* 每次调用脚本可以发送多少封邮件\
  \ */\n$max = 50;\n\n/* 来自 Mail_Queue_Config.php:\n$mail_queue = new Mail_Queue($db_options,\
  \ $mail_options);\n\n/* 实际发送消息 */\n$mail_queue->sendMailsInQueue($max);\n\n?>\n\
  ```\n真的非常简单！\n\n### 访问 IMAP 和 mBox 邮箱\n发送邮件很有用，但你还可以进一步，为你的用户提供像 Hotmail 或 Gmail\
  \ 那样的完整的 Web 体验。有三种协议允许用户访问其邮箱：\n\n- **POP3：** 邮局协议第 3 版（Post Office Protocol, version\
  \ 3）。主要用于发送和下载电子邮件到如 Microsoft Outlook 之类的本地客户端。POP3 是之前章节中 `mail()` 函数使用的协议。\n\
  - **IMAP：** 互联网消息访问协议（Internet Message Access Protocol）。旨在供那些在线访问邮箱并将消息存储在服务器的用户使用。\n\
  - **mBox：** Unix 风格的邮箱。最初设计为用户直接访问的本地邮箱，现在仍在使用。\n\n#### 使用 Mail_IMAP 扩展\n`Mail_IMAP`\
  \ 扩展包含许多函数，但日常使用只需要其中几个。我们为每个函数提供了代码示例。假设你有一个名为 `$imap` 的 `Mail_IMAP` 对象：\n\n- `connect()`：打开用户的邮箱，代码如下：\n\
  \  `$imap->connect(imap://user:password@mail.example.com:143/INBOX);`\n- `close()`：断邮箱断连接：\n\
  \  `$imap->close();`\n- `getHeaders()`：获取邮箱中消息的标头：\n  `$imap->getHeaders($message_id);`\n\
  - `getBody()`：获取消息正文：\n  `$imap->getBody($message_id);`\n- `messageCount()`：显示邮箱中的消息数量：\n\
  \  `$x = $imap->messageCount();`\n- `delete()`：标记删除消息：\n  `$imap->delete($message_id);`\n\
  - `expunge()`：永久删除由 `delete()` 函数标记的消息：\n  `$imap->expunge();`\n\n这七个函数允许你建立一个不错的\
  \ Web 邮件系统。如果你对使用 `Mail_IMAP` 扩展的其他功能感兴趣，可以深入此处：http://pear.php.net/manual/en/package.mail-imap.php。\n\
  \n#### 使用 Mail_MBox 扩展\n`Mail_MBox` 与 `Mail_IMAP` ，提供一组与用户邮箱交互的函数。访问邮箱的基本流程如下：\n\
  \n1. 实例化 `Mail_Mbox` 对象并填充用户 mBox 的路径，如下所示：\n   `$mbox = new Mail_Mbox('/home/user1/mbox');`\n\
  2. 调用 `open()` 函数打开 mBox：\n   `$mbox->open();`\n3. 通过 `get()` 函数检索消息。`size()` 函数可以告诉你每条消息的大小，在这里也很有用：\n\
  \   `$number_of_messages = $mbox->size();`\n   `for($x=0; $x <= $number_of_messages;\
  \ $x++) {`\n   `$mbox->get($x);`\n   `}`\n4. 调用 `close()` 函数关闭 mBox：\n   `$mbox->close();`\n\
  \n`Mail_Mbox` 还提供了通过 `insert()` 函数向 mBox 添加消息以及通过 `remove()` 函数移除消息的功能。\n\n\n\n\
  HTML 表单对于交互式 Web 网站非常重要。在你之前的经验中，你可能已经在网页上显示过静态的 HTML 表单。\n\n也就是说，内容是预定义的且无法改变的单。在本节中，你将看到如何通过\
  \ PHP 脚本显示静态 HTML 表单。\n\n![Image 67](img/index-499_1.jpg)\n\n34_167779 bk06ch01.qxp\
  \ 12/17/07 8:55 PM Page 470\n\n# 使用静态 HTML 表单\n\n## 显示 HTML 表单\n\n要使用 PHP 显示表单，你可以采取以下方法之一：\n\
  \n✦ **使用 `echo` 语句输出表单的 HTML 代码。** 例如：\n\n```php\n<?php\n\necho “<form action=’process_form.php’\n\
  method=’POST’>\\\\n\n<input type=’text’ name=’fullname’ />\\\\n\n<input type=’submit’\
  \ value=’Submit Name’ />\\\\n\n</form>\\\\n”;\n\n?>\n```\n\n✦ **在 PHP 区域之外使用原生 HTML。**\
  \ 对于纯静态表单，没有理由将其包含在 PHP 区域中。例如：\n\n```php\n<?php\n\nstatements in PHP section\n\n\
  ?>\n\n<form action=”process_form.php” method=”POST”>\n\n<input type=”text” name=”fullname”\
  \ />\n<input type=”submit” value=”Submit Name” />\n</form>\n\n<?php\n\nstatements\
  \ in PHP section\n\n?>\n```\n\n这两种方法都能产生图 1-1 所示的表单。\n\n**图 1-1：**\n\n由 HTML 语句生成的表单。\n\
  \n## 从表单获取信息\n\nJoe Customer 填写了 HTML 表单。他点击了“Submit Name”按钮。现在得到了想要的信息——他的名字。那么，信息在哪里？你如何获取它？\n\
  \n34_167779 bk06ch01.qxp 12/17/07 8:55 PM Page 471\n\n你通过运行一个接收表单信息的脚本来获取表单信息。当用户点击提交按钮时，PHP\
  \ 会自动运行脚本。表单标签中的 `action` 参数告诉 PHP 运行哪个脚本。\n\n例如，在前面的脚本中，参数 `action=process_form.php`\
  \ 告诉 PHP 在用户点击提交按钮运行时名为 `process_form.php` 的脚本。`action` 属性中提供的脚本名称可以是你编写的任何脚本，用于显示、存储或其他使用表单提交时接收到的表单数据。你可以使用任何有效的\
  \ PHP 脚本名称对其命名。\n\n当用户点击提交按钮时，`action` 属性指定的脚本就会运行，该脚本中的语句可以从 PHP 内置数组获取表单信息，并在\
  \ PHP 语句中使用这些信息。包含表单信息的内置数组是 `$_POST`、`$_GET` 和 `$_REQUEST`，它们是全局数组（superglobal\
  \ arrays），即可以在脚本任何地方使用的特殊用途数组。\n\n当表单使用 POST 方法时，表单字段的信息存储在 `$_POST` 数组中。`$_GET`\
  \ 数组包含作为 URL 部分传递的变量，包括通过 GET 方法从表单传递的字段。`$_REQUEST` 数组包含通过 `$_POST` 和 `$_GET` 同时传递的变量。\n\
  \n\n\n使用单独的文件来维护和修改脚本会更容易。当你想要更改表单的外观时，只需要编辑包含定义表单代码的文件。你不会意外改变脚本的逻辑。同样地，你可以在不影响表单外观的情况下更改脚本的逻辑。此外，如果你需要在脚本的不同位置显示表单，只需要在需要显示的地方包含定义该表单的文件即可。你不需要将显示表单的全部代码都添加到你的\
  \ PHP 脚本中。\n\n## 包含 PHP 逻辑的脚本\n\n列表 1-2 显示了一个用于显示表单的简单逻辑脚本。\n\n### 列表 1-2：一个显示表单的脚本\n\
  \n```php\n<?php\n/* Program name: display_form.php\n* Description: 脚本显示一个表单。\n*/\n\
  include(\"form_phone.inc\");\n?>\n```\n\n该脚本由一个包含显示表单的文件的语句组成。所有实际显示表单的代码都在 `form_phone.inc`\
  \ 脚本中，如列表 1-3 所示。此脚本是一个简单的案例，包含一个 `include` 语句。稍微复杂的一点脚本可能会包含一个 `if` 语句来显示备选表单，例如所示：\n\
  \n```php\nif(country == \"Russia\")\ninclude(\"form_Russian.inc\");\nelseif(country\
  \ == \"USA\")\ninclude(\"form_English.inc\");\n```\n\n逻辑脚本通常包含在表单提交后检查表单信息是否有错误的语句，以及处理信息的语句。验证和处理表单信息将在本章稍后在“处理来自表单的信息”节中进行讨论。\n\
  \n## 包含显示代码的脚本\n\n表单脚本包含了 HTML 和 CSS 代码，这些代码用于显示包含表单的 Web 页面。网页的外观和感觉在该文件中定义。列表\
  \ 1-3 显示了列表 1-2 中的逻辑脚本所包含的文件，其目的是显示一个收集 Web 访客电话号码的表单。\n\n### 列表 1-3：一个定义表单的脚本\n\
  \n```php\n<?php\n/* Program name: form_phone.inc\n* Description: 定义一个收集用户\n* 名称和电话号码的表单。\n\
  */\n$labels = array(\n    \"first_name\" => \"First Name\",\n    \"middle_name\"\
  \ => \"Middle Name\",\n    \"last_name\" => \"Last Name\",\n    \"phone\" => \"\
  Phone\"\n);\n$submit = \"Submit Phone Number\";\n?>\n<html>\n<head>\n<title>Customer\
  \ Phone Number</title>\n<style type='text/css'>\n/*\n#form {\n    margin: 1.5em\
  \ 0 0 0;\n    padding: 0;\n}\n#field {padding-bottom: 1em;}\nlabel {\n    font-weight:\
  \ bold;\n    float: left;\n    width: 20%;\n    margin-right: 1em;\n    text-align:\
  \ right;\n}\n*/\n</style>\n</head>\n<body>\n<h3>请在下方输入您的号码。</h3>\n<form action='process_form.php'\
  \ method='POST'>\n<div id='form'>\n<?php\n/* 循环显示表单项 */\nforeach($labels as $field\
  \ => $label) {\n    echo \"<div id='field'><label for='$field'>$label</label>\n\
  <input name='$field' type='text' size='50' /></div>\";\n}\necho \"</div>\";\necho\
  \ \"<input type='submit' value='$submit' />\";\n?>\n</form>\n</body>\n</html>\n\
  ```\n\n\n\n\n# 478 显示动态 HTML 表单\n\n如果你在数据库中存储了用户信息，你可能希望将数据库中的信息显示在表单字段中。例如，你可能会向用户显示这些信息，以便他们进行任何更改。或者，你可能会显示客户上次在线订单的收货地址，这样他们就不需要重新输入地址。列表\
  \ 1-4 显示了 `form_phone_values_db.inc` 文件，该文件包含了显示带有数据库信息的表单的代码。此表单与图 1-2 显示的表单相似，不同在于此表单包含了信息（从数据库检索），而表单字段是空的。\n\
  \n要显示此表单，你需要运行列表 1-2 显示的 `displayForm.php` 脚本，并将脚本中的包含语句改为：`include(\"form_phone_values_db.inc\"\
  );`。\n\n这包含了由列表 1-4 代码生成的表单的文件。\n\n**列表 1-4：显示带有信息的 HTML 表单**\n\n```php\n<?php\n\
  \n/* Program name: form_phone_values_db.inc\n* Description: 定义一个表单，从数据库获取用户的\n*\
  \ 姓名和电话号码，并将它们显示在表单中。\n*/\n\n$labels = array ( “first_name” => “First Name”,\n“middle_name”\
  \ => “Middle Name”,\n“last_name” => “Last Name”,\n“phone” => “Phone”);\n$submit\
  \ = “Submit Phone Number”;\n$last_name = “Contrary”; // 用户名\n\ninclude(“dbstuff.inc”);\n\
  \n$cxn = mysqli_connect($host,$user,$passwd,$databname)\nor die (“couldn’t connect\
  \ to server”);\n$query = “SELECT * FROM phone\nWHERE last_name='$last_name’”;\n\
  $result = mysqli_query($cxn,$query)\nor die (“Couldn’t execute query.”);\n$customer\
  \ = mysqli_fetch_assoc($result);\n\n?>\n\n<html>\n<head><title>Customer Phone Number</title>\n\
  <style type=’text/css’>\n<!--\n#form {\nmargin: 1.5em 0 0 0;\npadding: 0;\n}\n#field\
  \ {padding-bottom: 1em;}\nlabel {\nfont-weight: bold;\nfloat: left;\nwidth: 20%;\n\
  margin-right: 1em;\ntext-align: right;\n}\n-->\n</style>\n</head>\n<body>\n<h3>Please\
  \ enter your phone number below.</h3>\n<form action=’process_form.php’ method=’POST’>\n\
  <div id=’form’>\n<?php\n/* 显示表单字段的循环 */\nforeach($labels as $field => $label)\n\
  {\necho “<div id=’field’><label for=’$field’>$label</label>\n<input id=’$field’\
  \ name=’$field’ type=’text’\nsize=’50%’ maxlength=’65’\nvalue={$customer[$field]}\
  \ /> </div>\\\\n”;\n}\necho “</div>\\\\n”;\necho “<input style=’margin-left: 33%’\
  \ type=’submit’\nvalue=’$submit’ />\\\\n”;\n?>\n</form></</body>\n</html>\n```\n\
  \n列表 1-4 显示的 `form_phone_values_db.inc` 文件与列表 1-3 显示的 `form_phone.inc` 文件相似。区别在于该文件连接到数据库以获取姓名和地址并在表单中显示它们。\n\
  \n差异显示如下几所示：\n\n- 第 12–20 行创建了一个数组，存储从数据库检索的姓名和电话号码。第 12 行存储了一个用户姓氏，用于从数据库检索信息。第\
  \ 13 行包含了一个包含连接数据库时所需的用户名、密码和数据库名的文件。第 14–20 行检索姓名和地址并存储在 `$customer` 数组中。\n- 这一行为\
  \ `<input>` 标签添加 `value` 属性，以便在表单字段中显示值。\n\n图 1-3 显示了列表 1-4 脚本生成的网页。表单中的信息是存储在数据库中的信息。\n\
  \n![Image 69](img/index-509_1.jpg)\n\n**图 1-3:** 显示用户名和电话号码的表单。\n\n当用户点击图 1-3 显示的表单中的提交按钮时，`process_form.php`\
  \ 脚本将运行并显示以下内容：\n1. `first_name = Mary`\n2. `middle_name = Quite`\n3. `last_name\
  \ = Contrary`\n4. `phone = 555-5555`\n\n### 构建选择列表\n\nHTML 中可以使用的一种字段类型是选择列表。用户不再在字段中输入内容，而是从列表中进行选择。例如，在目录中，你可能会选择州、月份、日期或年份。使用选择列表有助于确保输入的准确性，避免拼写错误或异常字符。\n\
  \n一个 HTML 选择列表可能如下所示：\n\n```html\n<form action=\"process_form.php\" method=\"POST\"\
  >\n<select name=\"category\">\n<option value=\"clothes\">clothes</option>\n<option\
  \ value=\"furniture\">furniture</option>\n<option value=\"toys\">toys</option>\n\
  </select>\n<input type=\"submit\" value=\"Select category\" />\n</form>\n```\n\n\
  ![Image 70](img/index-510_1.jpg)\n![Image 71](img/index-510_2.jpg)\n\n### 动态 HTML\
  \ 表单\n\n使用 PHP 时，你可以从数据库动态地构建列表。当你向数据库中添加新类别时，新类别将自动添加到你的选择列表中，而无需更改 PHP 脚本。列表 1-5\
  \ 显示了名为 `form_select.inc` 的文件代码，该文件构建了类别选择列表。\n\n**列表 1-5：构建选择列表**\n\n```php\n<?php\n\
  /* Program name: form_select.inc\n* Description: 文件从数据库\n* 构建选择列表。\n*/\n?>\n\n<html>\n\
  <head><title>Categories</title></head>\n<<body>\n<?php\ninclude(“dbstuff.inc”);\n\
  $cxn = mysqli_connect($host,$user,$password,$database)\nor die (“couldn’t connect\
  \ to server”);\n$query = “SELECT DISTINCT cat FROM Product ORDER BY cat”;\n$result\
  \ = mysqli_query($cxn,$query)\nor die (“Couldn’t execute query.”);\n/* 创建包含选择列表的表单\
  \ */\necho “<form action=’process_form.php’ method=’POST’\nstyle=’margin-left: 2em’>\n\
  <label for=’cat’\nstyle=’font-weight: bold’>Category:</label>\n<select id=’cat’\
  \ name=’cat’\nstyle=’margin-top: 3em’>\\\\n”;\nwhile($row = mysqli_fetch_assoc($result))\n\
  {\nextract($row);\necho “<option value=’$cat’>$cat</option>”;\n}\necho “</select>\\\
  \\n”;\necho “<input type=’submit’ style=’margin-left: 3em’\nvalue=’Select category’\
  \ />\n</form>\\\\n”;\n?>\n</body>\n</html>\n```\n\n\n\n\n\n## 在查询中使用 DISTINCT\n\
  `DISTINCT` 导致查询每个类别只出现一次。如果没有 `DISTINCT`，如果某个类别在数据库中出现多次，查询将返回多次该类别。\n\n![Image\
  \ 72](img/index-512_1.jpg)\n\n## 显示动态 HTML 表单\n\n### 在查询中使用 ORDER BY\n类别按字母顺序排序。\n\
  \n### 循环之前的 echo 语句\n`<form>` 和 `<select>` 标签在 `while` 循环开始之前被 `echo` 输出了，因为它们只需要\
  \ `echo` 一次。\n\n### 循环中的 echo 语句\n`<option>` 标签在循环中被 `echo` 输出 —— 数据库中的每个类别对应一个。没有项目被标记为选中，因此列表中的第一个项目会被自动选中。\n\
  \n### 循环后的 echo 语句\n结束标签 `</form>` 和 `</select>` 标签在循环结束后被 `echo` 输出，因为它们只需要 `echo`\
  \ 一次。\n\n此脚本生成的选择列表比图 1-5 中之前显示的 **第六卷** 选择列表长，因为数据-**第 1 章**数据库中有更多的类别。在此脚本中选中了“衣服”选项，是因为它是列表中的第一个**动态表单**项目\
  \ —— 而而不是因为它像在生成图 1-5 的 HTML 标签 **构建与** **处理** 中那样被特意选中的。此脚本生成的下拉列表按字母顺序排列，如图 1-6\
  \ 所示。\n\n**图 1-6：**\n目录的动态选择列表。\n\n你还可以使用 PHP 变量来设置当选择框显示时选中哪个选项。例如，假设你想让用户从月、日、年选择列表中选择日期。你认为大多数人会选择今天的日期，因此你希望在选择框显示时默认选中今天的日期。列表\
  \ 1-6 显示了文件 `form_date.inc`，它显示了一个选择日期的表单并自动选中今天的日期。\n\n要显示此表单，你需要运行列表 1-2 显示的 `displayForm.php`\
  \ 脚本，并将脚本中的 `include` 语句改为：`include(“form_date.inc”)`。\n\n这包含了由列表 1-6 代码生成的显示表单的文件。\n\
  \n### 列表 1-6：构建日期选择列表\n```php\n<?php\n/* Program name: form_date.inc\n* Description:\
  \ Code displays a selection list that\n* customers can use to select a date.\n*/\n\
  echo “<html>\n<head><title>Select a date</title></head>\n<body>”;\n\n$monthName\
  \ = array(1 => “January”, “February”, “March”,\n“April”, “May”, “June”, “July”,\n\
  “August”, “September”, “October”,\n“November”, “December”);\n$today = time(); //stores\
  \ today’s date\n$f_today = date(“M-d-Y”,$today); //formats today’s date echo “<div\
  \ style = ‘text-align: center’\\n”;\n\necho “<h3>Today is $f_today</h3><hr />\\\
  n”; echo “<form action=’process_form.php’ method=’POST’\\n”;\n\n/* build selection\
  \ list for the month */\n$todayMO = date(“n”,$today); //get the month from $today\
  \ echo “<select name=’dateMonth’>\\n”;\n\nfor ($n=1;$n<=12;$n++)\n{\necho “ <option\
  \ value=$n”;\nif ($todayMO == $n)\n{\necho “ selected”;\n}\necho “ > $monthName[$n]\\\
  n</option>”;\n}\necho “</select>\\\\n”;\n\n/* build selection list for the day */\n\
  $todayDay= date(“d”,$today); //get the day from $today echo “<select name=’dateDay’>\\\
  n”;\n\nfor ($n=1;$n<=31;$n++)\n{\necho “ <option value=$n”;\nif ($todayDay == $n\
  \ )\n{\necho “ selected”;\n}\necho “ > $n</option>\\n”;\n}\n\necho “</select>\\\\\
  n”;\n\n/* build selection list for the year */\n$startYr = date(“Y”, $today); //get\
  \ the year from $today echo “<select name=’dateYear’>\\n”;\n\nfor ($n=$startYr;$n<=$startYr+3;$n++)\n\
  {\necho “ <option value=$n”;\nif ($startYr == $n )\n{\necho “ selected”;\n}\necho\
  \ “ > $n</option>\\n”;\n}\necho “</select>\\\\n”;\necho “</form></div>\\n”;\n?>\n\
  </body></html>\n```\n\n列表 1-6 代码生成的网页如图 1-7 所示。月份选择列表显示数字。日期的选择列表显示日期。年份选择列表显示年份。\n\
  \n## 构建单选按钮列表\n你可能想使用单选按钮而不是选择列表。例如，你可以为你的目录类别显示单选按钮列表，并让用户选择他们感兴趣的类别的按钮。\n\n单选按钮的格式为\
  \ `<input=”radio” name=”**” value=”***`。你可以按照之前构建动态选择相同的方式，构建一个代表数据库中所有类别的动态单选按钮列表。列表\
  \ 1- 显示了 `formform_radio.`，这是一个基于数据库中类别的单选按钮列表。\n\n### 列表 1-7：构建单选按钮列表\n```php\n\
  <?php\n/* Program name: form_radio.inc\n* Description: Program displays a list of\
  \ radio\n* buttons from database info.\n*/\necho “<html>\n<head><title>Radio Buttons</title></head>\n\
  <body>”;\n```\n\n\n\n\n\n```php\ninclude(“dbstuff.inc”);\n\n$cxn = mysqli_connect($host,$user,$password,$database)\
  \ or die (“Couldn’t connect to server”);\n\n$query = “SELECT DISTINCT cat FROM Product\
  \ ORDER BY cat”;\n\n$result = mysqli_query($cxn,$query) or die (“Couldn’t execute\
  \ query.”);\n\necho “<div style=’margin-left: .5in; margin-top: .5in’>\n<p style=’font-weight:\
  \ bold’>您对哪种产品感兴趣?</p>\n<p>请从以下列表中选择一个类别：</p>\\\\n”;\n\n/* 创建包含单选按钮的表单 */\necho\
  \ “<form action=’process_form.php’ method=’POST’\\\\n”; *(续)*\n```显示动态 HTML 表单\n\
  \n**列表 1-7（续）**\n\n```php\nwhile($row = mysqli_fetch_assoc($result))\n{\n    extract($row);\n\
  \    echo “<input type=’radio’ name=’category’ value=’$cat’ />$cat\\\\n”;\n    echo\
  \ “<br />\\\\n”;\n}\necho “<p><input type=’submit’ value=’Select category’ /></form></div>\\\
  \\n”;\n?>\n</body></html>\n```\n\n此文件生成的 Web 页面如图 1-8 所示。\n\n**图 1-8：** 由 `form_radio.inc`\
  \ 中的代码生成的单选按钮列表。\n\n## 构建复选框列表\n\n你可能想在表单中使用复选框。复选框与选择列表和单选按钮不同，它们允许用户选择多个选项。例如，如果你用复选框显示产品类别列表，用户可以选择两个、三个或更多类别。\n\
  \n列表 1-8 中的文件 `form_checkbox.inc` 创建了一了一个复选框列表。要显示此表单，你需要运行列表 1-2 所示的脚本 `displayForm.php`，并将脚本中的\
  \ `include` 语句改为 `include(“form_checkbox.inc”);`。这包含了显示列表 1-8 代码生成的表单的文件。\n\n**列表\
  \ 1-8：构建复选框列表**\n\n```php\n<?php\n/* 程序名: form_checkbox.inc\n* 描述: 程序从数据库信息中显示\n\
  * 复选框列表。 */\necho “<html>\n<head><title>复选框</title></head>\n<body style=’margin:\
  \ .5in’>”;\ninclude(“dbstuff.inc”);\n$cxn = mysqli_connect($host,$user,$passwd,$databname)\
  \ or die (“couldn’t connect to server”);\n$query = “SELECT DISTINCT cat FROM Product\
  \ ORDER BY cat”;\n$result = mysqli_query($cxn,$query) or die (“Couldn’t execute\
  \ query.”);\necho “<h3>您对哪些产品感兴趣？ <span style=’font-size: 80%; font-weight: normal’>(可根据需要勾选)</span></h3>\\\
  \\n”;\n/* 创建包含复选框的表单 */\necho “<fieldset>\n<legend style=’font-weight: bold’>产品</legend>\n\
  <form action=’process_form.php’ method=’POST’>\n<ul style=’list-style: none’>\\\\\
  n”;\nwhile($row = mysqli_fetch_assoc($result))\n{\n    extract($row);\n    echo\
  \ “<li><input type=’checkbox’ name=’interest[$cat]’ id=’$cat’ value=’$cat’ /><label\
  \ for=’$cat’ style=’font-weight: bold’>$cat</label></li>\\\\n”;\n}\necho “</ul></fieldset>\n\
  echo “<p><input type=’submit’ value=’Select Categories’ ?></p></form></body></html>\"\
  ;\n?>\n```\n\n注意，输入字段使用 `$interest` 数组作为名称，因为可以选择多个复选框。此脚本会在数组中创建一个元素，为每个选中的复选框对应一个键/值对。例如，如果用户同时选了\
  \ `furniture` 和 `toys`，将创建如下数组：\n`$interest[Furniture]=Furniture`\n`$interest[Toys]=Toys`\n\
  \n处理表单的脚本在 POST 数组中获取这些选择，如下：\n`$_POST['interest']['Furniture']`\n`$_POST['interest']['Toys']`\n\
  \n**图 1-9：** 由 `form_checkbox.inc` 生成的 Web 页面。\n\n假设 Joe Customer 填写了一个 HTML 表单，从列表中选择并在文本字段中输入信息。当他点击提交按钮时，`<form>`\
  \ 标签的 `action` 属性中的脚本（如 `action=process_form.php`）就会运行并接收来自表单的信息。处理表单信息是 PHP 优秀特性之一。你不需要担心表单数据——只需从内置数组中获取它并使用即可。表单数据在处理脚本中以诸如\
  \ `$_POST` 或 `$_GET` 数组的形式可用。数组元素的键是表单中输入字段的名称。例如，如果你在表单中输出以下字段 `echo “<input type=’text’\
  \ name=’firstName’ />”;`，处理脚本可以使用变量 `$_POST['firstName']`，它包含了用户在字段中输入的文本。\n\n用户从下拉列表或单选按钮选择的信息同样可以用于处理。例如，如果你的表单包含以下单选按钮列表，`echo\
  \ “<input type=’radio’ name=’pet’ value=’dog’ />\\\\n”; echo “<input type=’radio’\
  \ name=’pet’ value=’cat’ />\\\\n”;，你可以访问 `$_POST['pet']`，它取决于用户选择了 `dog` 还是 `cat`。\n\
  \n处理复选框的方式略有不同，因为用户可以选择多个。正如列表 1-8 所示，复选框的数据可以存储在数组中，以便所有复选框都可用。例如，如果你的表单包含以下复选框列表，`echo\
  \ “<input type=’checkbox’ name=’interest[$dog]’ value=’dog’ />\\\\n”; echo “<input\
  \ type=’checkbox’ name=’interest[$cat]’ value=’cat’ />\\\\n”;，你可以通过多维变量 `$_POST['interest']`\
  \ 访问数据，其包含：\n`$_POST['interest']['dog']=dog`\n`$_POST['interest']['cat']=cat`\n\n\
  现在你在 `$_POST` 或 `$_GET` 数组中获得了所需的所有信息。好吧，也许并不是。Joe Customer 可能输入了错误的信息、乱码，甚至输入了会对你或使用你网站的人造成问题的恶意信息。在使用这些信息存入数据库之前，你想对其进行检查以确保它是你想要的信息。\n\
  \n检查数据被称为*验证*（validating）数据。验证包括：\n\n- **检查空字段**：你可以要求用户在字段中输入信息。如果字段为空，会通知用户该字段是必填的，然后重新显示表单以便用户输入缺失的信息。\n\
  - **检查信息的格式**：你可以检查信息以确保其格式正确。例如，`ab3&*xx` 显然不是有效的邮政编码。检查格式对于识别安全问题也很重要。安全问题将在第四部分进行详细讨论。\n\
  \n## 检查空字段\n\n当你创建表单时，可以决定哪些字段是必填的，哪些是可选的。你的决定在 PHP 脚本中实现。你检查需要信息的字段。如果必填字段为空，向用户发送消息指示该字段是必填的，然后重新显示表单。\n\
  \n检查空字段的通用过程如下：\n\n```php\nif(empty($_POST['last_name']))\n{\n    echo “您没有输入姓氏。\n\
  \n姓氏是必填的。<br />\\\\n”;\n    redisplay the form;\n    exit();\n}\n```\n\n\n\n\n\n\
  注意 `if` 语句末尾的退出语句，它会停止脚本的执行。如果没有 `exit` 语句，脚本将继续执行 `if` 语句之后的语句。换句话说，如果没有 `exit`\
  \ 语句，脚本将显示表单，然后继续 `echo` 欢迎语句和菜单。\n\n在许多情况下，你想检查表单中的所有字段。你可以通过遍历数组 `$_POST` 来实现这一点。以下语句检查数组中是否存在任何空字段：\n\
  \n```php\nforeach($_POST as $value)\n{\n    if($value == \"\")\n    {\n        echo\
  \ “You have not filled in all the fields.\\n”;\n        redisplay the form;\n  \
  \      exit();\n    }\n}\necho “Welcome”;\n```\n\n当你重新显示 Web 表单时，请确保它包含了用户已经输入的信息。如果用户必须重新输入正确的信息，他们可能会感到很沮败并离开你的网站。\n\
  \n在某些情况下，你可能要求用户填写大部分但不是所有的字段。例如，你可能在表单中要求传真号码，或者提供一个中间名字段，但你并不是真的想将你网站的注册限制在有中间名和传真号的用户。在这种情况下，你可以如下所示对非必需字段进行特殊处理：\n\
  \n## 处理来自表单的信息\n\n```php\nforeach($_POST as $field => $value)\n{\n    if($field\
  \ == \"\")\n    {\n        if($field != “fax” and $field != “middle_name”)\n   \
  \     {\n            echo “You have not filled in $field\\n”;\n            display\
  \ the form;\n            exit();\n        }\n    }\n}\necho “Welcome”;\n```\n\n\
  # 第六卷\n## 第一章\n\n注意，内部的 `if` 条件语句仅在字段既不是传真字段又不是中间名字段时才为真。对于这两个字段，脚本 **Dynamic Forms**\
