  \n### 检查信息的格式\n每当用户必须在表单中输入信息时，你都可以预见到会有数量的拼写错误。你可以在提交表单时检测出其中的一些错误，向用户指出错误，然后要求他们重新输入信息。例如，如果用户在邮政编码（ZIP）字段中输入\
  \ `8899776`，你就知道这是错误的。这个信息太长不能作为邮政编码，也太短不能作为 ZIP+4 代码。\n\n![Image 76](img/index-527_1.jpg)\n\
  \n**图 1-10:** 处理缺失信息的表单的结果。\n\n你还需要保护自己不受恶意用户的影响——用户可能会破坏你的网站或数据库，或从你或你的用户那里窃取信息。你不希望用户在表单字段中输入\
  \ HTML 标签——这些标签发送到浏览器时可能会产生意外结果。特别危险的标签是脚本标签，它允许用户在表单字段中输入脚本。本节描述的检查数据可以防止意外问题和恶意用户。\n\
  \n如果你检查每个字段是否符合预期的格式，你就可以捕获拼写错误并防止大多数恶意内容。检查信息是一项平衡工作。你希望尽可能捕获错误数据，但不想阻止合法信息。例如，当你检查电话号码时，你可能会将其限制为数字。这种检查的问题是，它会过滤掉表单中\
  \ `555-5555` 或 `(888) 555-5555` 的合法数字，因此你还需要允许连字符 (`-`)、括号 (`()`) 和空格。你可能会将字段限制为\
  \ 14 个字符长度，包括括号、空格和连字符，但这会过滤掉包含分机的海外号码。底线是：你需要仔细考虑对于任何字段你想要接受或过滤掉哪些信息。你可以使用正则表达式（即模式）来检查字段信息。你将字段中的信息与模式进行比较，看其是否匹配。如果不匹配，则字段中的信息是错误的，用户必须重新输入（有关正则表达式的更多信息请参阅第二卷第\
  \ 2 章）。\n\n通常，使用这些语句来检查字段：\n```php\nif(!preg_match(\"pattern\",$variable)) {\n \
  \   echo error message;\n    display form;\n    exit();\n}\necho \"Welcome\";\n\
  ```\n`preg_match` 函数将模式与 `$variable` 中的输入值进行匹配，其中模式是一个正则表达式。注意 `if` 语句中的条件是负的。也就是说，`!`（感叹号）表示“不”。因此\
  \ `if` 语句实际上说是：如果变量中的值不匹配模式，则执行 `if` 块。\n\n### 动态表单的构建与处理\n例如，假设你想检查一个包含用户姓氏的输入字段。你可以预期姓名会包含字母而不是数字，并可能包含撇号和连字符（如\
  \ `O’Hara` 和 `Smith-Jones`）以及空格（如 `Van Dyke`）。此外，很难想象一个名字会超过 50 个字符。因此，你可以使用以下语句来检查姓名：\n\
  ```php\nif(!preg_match(\"/[A-Za-z’ -]{1,50}/\",$last_name)) {\n    echo error message;\n\
  \    display form;\n    exit();\n}\n```\n如果你想将连字符 (`-`) 作为允许字符的一部分放在方括号 `[]` 中，你必须将将其放在列表的开头或结尾。否则，如果你把它放在两个字符之间，脚本将其解释为两个字符之间的范围，例如\
  \ `A–Z`。\n\n你还需要检查多选字段。虽然多选可以防止诚实用户犯错，但不能防止有恶意的聪明用户向字段中输入意外数据。你可以使用以下类型的正则检查多选字段的可接受输出：\n\
  ```php\nif(!preg_match(\"/male|female)/\",$gender))\n```\n如果字段包含 `male` 或 `female`\
  \ 以外的任何内容，则执行 `if` 块。第 11 行所示 `checkFormat.php` 脚本检查字段信息的格式。第 9 行的 `form_values.inc`\
  \ 文件显示并处理表单。该脚本只检查格式，不检查必填字段。在大多数情况下，你希望像第 10 行的 `checkBlanks.php` 脚本那样既检查空字段，又检查格式。\n\
