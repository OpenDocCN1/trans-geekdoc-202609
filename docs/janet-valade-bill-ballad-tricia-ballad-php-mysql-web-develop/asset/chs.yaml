  \ 583\n\n583 构建购物车网页\n\n**图 5-4：** 运信息表\n\n## 第六卷\n### 由购物车显示\n\n## 第 5 章\n### 购物车\n\
  \n### 构建一个 t\n\n我们为此示例应用程序简化了运输信息表单。\n\n对于你的应用程序，你可能需要在表单中收集额外信息，如所示的账单名称和地址，以及收货名称和地址。你可能还需要收集运输方式和其他信息。\n\
  \n## 摘要网页\n\n应用程序显示订单摘要，以便客户发现并纠正任何错误，如图 5-5 所示。\n\n**图 5-5：** 购物车显示的摘要网页。\n\n38_167779\
  \ bk06ch05.qxp 12/17/07 8:24 PM Page 584\n\n584 构建购物车网页\n\n摘要页面提供了四个客户可以点击的按钮：\n\
  \n*   **继续购物（Continue Shopping）：** 将客户返回第一个目录页面，显示产品分类，同时保留订单中的信息。\n*   **编辑运输信息（Edit\
  \ Shipping Information）：** 将客户返回运输信息表单并显示显示信息，以便客户可以根据需要更改运输信息。\n*   **取消订单（Cancel\
  \ Order）：** 取消订单。\n*   **提交订单（Submit Order）：** 提交摘要页上的订单。在最终提交之后，客户无法进行更改。\n\n家具商店必须为住在德克萨斯州的客户收取销售税。因此，摘要页显示销售税。如果地址在另一个州，则不收取销售税。\n\
  \n家具商店每件商品收取 25 美分的运费。因此，这个三件商品的订单被收取 75 美分。选择这个简单的金额是为了简化示例。\n\n## 确认页面\n\n确认页面针对你的商店。它可能只是摘要页的重复。确认页面告诉客户订单已批准。它可能会告诉客户订单何时发货，并通常提供一个客户可以用来跟踪订单的订单号。我们在本章中没有开发特定的确认或取消页面——我们只是向你展示如何显示它。\n\
