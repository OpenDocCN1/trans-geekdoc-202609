  \n# 构建购物车脚本\n\n购物车为以下三个职责领域提供功能：\n\n- **产品信息：** 购物车显示在线目录中的产品信息。它显示两种类型的 Web 页面：一个显示产品类别的页面，以及另一个显示所选产品信息的页面。脚本将产品信息\
  \ Web 页面上的项目添加到购物车中。\n- **购物车：** 购物车存储客户选择的项目信息。客户放入购物车的项目信息存储在数据库中，并为订单分配一个订单号并保存到会话变量中，以便从数据库中检索订单信息。客户可以随时查看购物车中的当前项目。在提交订单之前，客户可以随时添加、删除项目或更改项目数量。\n\
  - **订单：** 购物车收集有关订单的信息。它收集完成客户购买所需的信息。所有订单项目的价格被相加。提供了一个表单来收集和验证收货信息。所有成本和费用（包括运费和销售税在内）都经过计算并应用于订单总额。收集并处理信用卡信息。\n\
  \n购物车的功能的功能由三个 PHP 脚本提供，每个脚本负责一个领域，如下：\n\n## 提供产品信息\n\n脚本 `Shop_products.php` 显示在线目录中的产品信息。该脚本显示一个\
  \ Web 页面，列出从数据库获取的所有产品类别。当客户选择一个类别并点击提交按钮时，脚本将显示所选类别的所有产品信息。你可以选择单页显示的产品数量。提供了“下一个”和“上一个”按钮，以便客户根据需要显示更多产品。\n\
  \n当客户点击“添加到购物车”或“查看购物车”时，脚本会将产品信息 Web 页面上的所选项目存储在购物车中。\n\n## 管理购物车\n\n脚本 `Shop_cart.php`\
  \ 管理购物车。它存储客户已选择的项目。客户放入购物车的项目信息存储在数据库中，并为订单分配一个订单号并保存到会话变量中。脚本显示购物车中的项目。在提交订单之前，客户可以随时添加、删除或更改项目数量。\n\
  \n## 处理订单\n\n脚本 `Shop_order.php` 处理订单。该脚本显示一个收集完成订单所需的表单，如姓名、地址和信用卡信息。脚本验证表单信息并将其存入数据库。显示一个允许客户确认订单的摘要\
  \ Web 页面。当客户点击按钮时，脚本执行相应的操作。如果客户提交订单，脚本处理信用卡信息并在批准后启动履行订单程序。如果客户取消订单，脚本移除订单信息\n\n\
  提供产品信息的脚本显示目录并将客户的选择存储在购物车中。`Shop_products.php` 使用嵌套 if 语句组织，取决于客户点击了哪个提交按钮。以下是其结构概览：\n\
  \n```\nif (button named Products) {\n    if (button is Add Items to Shopping Cart)\
  \ {\n        1. 确定订单号\n        如果当前订单存在，则获取。如果不存在，\n        在数据库中创建新订单并将新订单号设置为当前订单。\n\
  \        2. 将项目存入数据库。\n        3. 将控制权交给 ShoppingCart.php，它显示购物车。\n    } else {\n\
  \        显示目录产品页\n    }\n} else {\n    显示目录类别页\n}\n```\n\n### 执行场景\n\n当发生以下任何情况时都会运行：\n\
  \n- **客户在浏览器中输入 `Shop_products.php` 的 URL：** 由于这是购物车的第一个脚本，它在浏览器启动时运行正常。在这种情况下，没有点击按钮，因此脚本跳转到最后的\
  \ else 语句并显示目录首页。\n- **客户点击“添加到购物车”按钮：** 该按钮名为 Products，因此脚本进入第一个 if 块。if 块中的第一个\
  \ if 检查按钮的值。按钮匹配测试值，因此脚本进入第一个内部 if 块，将项目添加到现有订单中，或在没有当前订单时创建新订单。然后它启动第二个脚本 `Shop_cart.php`，它显示购物车。\n\
  - **客户点击“下一个”或“上一个”：** 这些按钮名为 Products，因此脚本进入第一个 if 块。然而，按钮值不匹配内部 if 语句，因此脚本进入内部\
  \ else 块，显示目录产品页中的下一个或上一个项目。\n\n\n\n\n\n✦ 客户点击 `Select Another Category`（选择另一个类别）按钮。此按钮没有名称，因此脚本将跳转到最后的\
  \ `else` 语句并显示目录索引页。\n\n列表 5-6 显示了 `Shop_products.php` 的代码 —— 这是购物车中的第一个脚本。列表之后对代码\
