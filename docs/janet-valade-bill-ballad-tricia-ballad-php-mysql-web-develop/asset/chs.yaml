  \n### 构建目录应用程序脚本\n\n目录应用程序脚本包含显示产品页面的逻辑。[此处对应原文中重复描述部分，已翻译核心逻辑。]\n\n### 列表 4-3:\
  \ 目录应用程序\n\n列表 4-3 显示了目录应用程序的 own：\n\n```php\n<?php\n/* Program: Catalog.php\n*\
  \ Desc: Displays a catalog of products when the user selects a category.\n*/\ninclude(“dbstuff.inc”);\n\
  \n$n_per_page = 2;\nif(isset($_POST['Products'])) {\n    if(!isset($_POST['n_end']))\
  \ {\n        header(“location:furniture.php”);\n        exit();\n    } else {\n\
  \        $n_start = $_POST['n_end'] - $n_per_page;\n    }\n} else {\n    $n_start\
  \ = 1;\n}\n$n_end = $n_start + $n_per_page - 1;\n\n$cxn = mysqli_connect($host,$user,$database);\n\
  $query = “SELECT DISTINCT category,type FROM Furniture WHERE type=$_POST[interest]’\
  \ ORDER BY category,type”;\n$result = mysqli_query($cxn,$query) or die (“query died:\
  \ category”);\n\n$products = [];\n$n=1;\nwhile($row = mysqli_fetch_array($result))\
  \ {\n    $products[$row['category']][] = $row['type'];\n    $n++;\n}\n$n_products\
  \ = sizeof($products);\n\nif($n_end > $n_products) {\n    $n_end = $n_products;\n\
  }\ninclude(“page_furniture_products.inc”);\n?>\n```\n\n\n\n\n\n开始一个 if 语句，如果这并不是第一个显示的产品页面，则执行。变量\
  \ `n_end` 是产品页面表单中的一个隐藏字段，因此如果 `$_POST[n_end]` 存在，说明用户在产品页面显示时点击了页面上的按钮。if 块会检查按了哪个按钮。\n\
  \n➝**21**\n开始一个 if 语句，如果点击了“Previous”（上一个）按钮则执行。`$n_start` 被设置为点击按钮页面的前一个页面的开头。`$n_start`\
  \ 是网页显示时要首先显示的产品编号。\n\n➝**25**\n开始一个 else 语句，如果*没有*点击“Previous”（上一个）按钮，则执行，这意味着“Next”（下一个）按钮*被*点击了。`$n_start`\
  \ 被设置为点击按钮的页面上显示的最后一个产品之后的下一个产品。\n\n➝**30**\n开始一个 else 块，如果这是第一次显示产品页面，则执行。它将 `n_start`\
  \ 设置为 1。\n\n➝**34**\n使用第 19–33 行 if 语句中设置的 `$n_start` 值来计算 `$n_end` 的值，该值为产品网页显示时显示的最后一个产品。将\
  \ `$n_end` 设置为 `$n_start` 加上页面上要显示的产品数，减一。\n\n➝**35**\n第 35–39 行构建并执行一个查询，检索所选类别中所有产品的信息。\n\
  \n➝**40**\n将计数器设置为 1。\n\n➝**41**\n开始一个 while 循环，获取从数据库中检索的所有产品信息行。\n\n➝**43**\n\
  开始一个 foreach 循环，构建名为 `$products` 的数组，该数组包含从数据库中检索的所有产品信息。\n\n➝**49**\n第 49–53 行确保\
  \ `$n_end` 不大于产品总数。如果 `$n_end` 超过产品总数，则将 `$n_end` 设置最后一个产品。\n\n➝**54**\n显示产品页面。\n\
  \n➝**57**\n启动一个 else 块，如果没有点击“Product”（产品）按钮，则执行。可能是既没有点击任何按钮，就是点击了“Select Another\
  \ Category”（选择另一个类别）按钮。此块显示带有产品类别的索引页。\n\n➝**59**\n第 60–63 行构建并执行一个查询，检索数据库中的所有类别。\n\
  \n➝**64**\n开始一个 while 循环，构建包含所有家具类别的数组 `$furn_categories`。\n\n➝**68**\n显示展示家具类别的索引\
  \ Web Page。\n\n此脚本会自动显示目录数据库中的所有信息。索引部分从数据库中检索所有类别；产品部分检索所有属于所选类别的产品。当你向目录数据库中添加任何产品时，脚本会自动检索并显示新产品。当向数据库中添加新产品时，不需要对脚本进行任何更改。\n\
  \n# 第 5 章：构建\n\n### 购物车\n\n### 本章内容\n- **设计购物车**\n- **构建购物车数据库**\n- **为 Web 页面编写代码**\n\
  - **为应用程序脚本编写代码**\n\n互联网提供了无尽的购物机会。你浏览或搜索一个网页；选择你想要的物品；提供你的姓名、地址、信用卡号和其他信息；这些物品就会在不久的将来出现在你的门前。互联网不是很神奇吗？\n\
  \n本章将向你展示如何开发一个提供产品信息和用于购买物品的购物车的系统。我们将在线目录作为购物车的一部分。此应用程序使用了本微型书籍第 4 章开发的在线目录，并扩展了允许用户购买目录中产品的功能。\n\
  \n本章描述的在线订购系统需要你构建一个包含若干表的 MySQL 数据库。你可以使用 SQL 语句或使用 phpMyAdmin 创建数据库。创建数据库和向其中添加数据的方法将在第三本书中讨论。\n\
  \n### 设计购物车\n\n允许你在线购买物品的 Web 应用程序被称为“*购物车*”（shopping cart），其命名自你在杂货店里推着并装满待购物品的推车。在线购买应用程序以类似的方式运行，允许你将物品放入购物车。然而，该应用程序不仅仅是提供一个跟踪你所添加物品的购物车。它还会收集完成购买所需的信息（例如你的地址），并处理订单和你的信用卡订单。它还必须协调或包含一个待售的产品目录。虽然在技术上将该程序称为“在线订购系统”更准确，但它更常地被称为购物车。\n\
  \n购物车可以通过许多方式实现。你的首要任务是决定如何实现你的购物车。\n\n#### 做出设计决策\n\n在设计用户界面之前，你必须做出一些基本的编程设计决策。务必考虑以下因素：\n\
  \n- **客户登录**：许多商店要求客户在购买前进行注册并登录。客户注册为商店提供了有关客户的信息，例如电话号码和电子邮箱。要求登录还允许提供在不登录的情况下无法实现的功能。例如，在不要求客户登录的情况下，无法提供允许客户跟踪其订单的功能。另一方面，许多客户会避免注册。某些客户怀疑他们的信息可能被用于不当目的，例如不请的推销电话或电子邮件。其他客户对这个过程不耐烦，会转到更简单的网站。因此，要求登录可能会导致商店损失一些订单。本章中的应用程序不需要客户登录。任何人都可以购买产品。本微型书籍第\
  \ 3 章提供了一个登录应用程序，如果你需要，可以将其添加到此应用程序。\n\n- **支付方式**：客户如何购买产品？最简单的方法是将订单信息通过电子邮件发送销售部门并向客户结算。或者，你可以在发货前要求用户提供支票。然而，大多数网站都会在网站上接受支付。网站可以快速接受并处理信用卡支付。有些网站接受\
  \ PayPal 支付，作为信用卡支付的补充或替代。PayPal 是一个互联网网站网站它提供了人们可以在互联网上发送或接收资金的账户。（例如，你可以使用 PayPal\
  \ 账户购买 eBay 物品。）除了提供账户设置外，PayPal 还提供了你可以通过 PayPal 轻松接受支付的商家工具。参见 `www.paypal.com`。本章中的应用程序仅接受信用卡。\n\
  \n- **信用卡处理**：接受信用卡支付会引发安全问题。如果客户向你发送信用卡号，你需要实施 SSL（安全套接层）来确保安全。如果你存储信用卡号，你需要实施强大的安全措施。存储信用卡号可以让客户购买更快、更方便（因为他们的信用卡信息已存档），但增加了坏分子获取重要信息的机会。此外，某些客户不希望将信用卡信息存储在你的网站上。一种可能的解决方案（用于一些在线商店）是允许客户决定是否让你存储他们的信用卡信息。\n\
  \n\n\n\n\n本章中的应用程序不会保存信用卡信息。这些信息会被接收、使用，然后被丢弃，不会存储在数据库中。\n\n## 第六卷\n\n✦ **运费：**\
  \ 向客户发送购买商品需要花费费用。`Chapter 5` 中最容易实现的解决方案是使用单一的标准的运费和手续费。在总额上增加一个金额是一个简单的程序步骤。更复杂的\
  \ `Shopping Car`（购物车）解决方案是尝试计算实际运费，让客户选择所使用的运输类型，并根据你的 `ZIP code` 到客户邮政编码的距离来计算运费。客户会喜欢更准确的费用，但编程需要花费更多的时间和精力。\n\
  \n本章中的应用程序收取的运费是每件物品的固定费用。\n\n✦ **购物车：** 在客户继续购物但在提交订单之前，你可以使用几种机制来存储购物车。客户在最后凑齐最终订单时，需要能够从购物车中添加和删除商品。以下是存储购物车内容最常用的技术：\n\
  \n*   `Database table`：更安全，但开销更大。\n*   `Cookies`：客户可能禁用了 Cookie。\n*   `Session variables`：在共享服务器上安全性较低。\n\
  *   `Text file`：简单，但安全性较低。\n\n有时也会使用其他不常用的方法。\n\n本章中的应用程序将购物车商品存储在 `MySQL` 数据库中。\n\
  \n## 思考功能性\n\n购物车的基本功能是收集完成客户购买所需的信息。应用程序应该执行以下任务：\n\n*   **显示商品，以便客户可以选择要购买的商品。**\
  \ 这一步由在线目录提供，我们在本微型书籍的 `Chapter 4` 中详细描述了该目录。然而，你需要为目录添加一些更多功能以允许在线购买。我们在本章中涵盖了这些额外功能。\n\
  *   **跟踪客户选择的商品。** 客户应该能够随时查看他们已经选择了什么。客户还应该能够移除任何选择的商品。\n*   **收集将产品运送到客户所需的信息。**\
  \ 你需要客户的姓名和地址。此外，你还需要电话号码以防配送出现问题。电子邮件地址对于通信很有用。应用程序还可以收集计算运费所需的任何信息。\n*   **收集向客户收费的信息。**\
  \ 应用程序收集信用卡信息、账单地址和准确姓名。在本章中，假设运送和账单信息是相同的。然而，对于真实世界的网站，你不能这样假设。\n*   **向客户提供反馈。**\
  \ 客户需要看到她在过程中输入的信息，并能够纠正信息。并不是每个人都有完美的打字技巧。\n\n## 创建购物车数据库\n\n购物车数据库存储了关于商品和订单的信息。它存储了订单的一般信息，如客户的姓名和地址、每个订单所选的商品以及订单提交的时间。本章中的应用程序销售家具目录中的产品，我们在本微型书籍的\
  \ `Chapter 4` 中描述了该目录。\n\n### 设计购物车数据库\n\n本章中的示例应用程序使用了一个名为 `OnlineShop` 的数据库。该数据库包含三个表，在后续章节中描述：\n\
  \n1.  `Furniture` 表：商品目录。\n2.  `CustomerOrder` 表：存储订单的一般信息，如姓名和地址、订单号等。\n3.  `OrderItem`\
  \ 表：为每个订购商品存储一行，通过订单号与第一个表关联。\n\n目录可以放在单独的数据库中。该数据库可能包含与产品相关的其他表，例如库存表。在本例中，目录与订单信息在同一个数据库中，以简化示例。\n\
  \n名为 `CustomerOrder` 的表包含与订单整体相关的信息。你不能用 `MySQL` 的保留字命名表。这个表似乎应该命名为 `Order`，但如果你将表命名为\
  \ `Order`，它会产生 `MySQL` 语法错误，你可能会花费几个小时盯着查询语句。你可以访问 `http://dev.mysql.com/doc/mysql/en/reserved-words.html`\
  \ 查看保留字列表。\n\n#### 数据库表：CustomerOrder\n\n| 变量名 | 类型 | 描述 |\n| :--- | :--- | :---\
  \ |\n| `order_number` | `SERIAL` | 由 `AUTO_INCREMENT` 分配的整数（主键） |\n| `order_date`\
  \ | `DATE` | 添加到表的日期 |\n| `submitted` | `ENUM('yes', 'no')` | 订单状态 |\n| `ship_name`\
  \ | `VARCHAR(50)` | 收件人 |\n| `ship_street` | `VARCHAR(50)` | 街道地址 |\n| `ship_city`\
  \ | `VARCHAR(50)` | 订单运到的城市 |\n| `ship_state` | `CHAR(2)` | 两个字母的州代码 |\n| `ship_zip`\
  \ | `CHAR(10)` | 邮编（五位数字或邮编+4） |\n| `email` | `CHAR(50)` | 客户的电子邮件地址 |\n| `phone`\
  \ | `CHAR(20)` | 客户的电话号码 |\n\n在这种设计中，订单号是由 `MySQL` 顺序分配的整数。某些设计可能会使用具有意义的数字或字母作为订单号，例如日期或部门代码。\n\
  \n#### 数据库表：OrderItem\n\n名为 `OrderItem` 的表包含订单中每个商品的信息，如 `Table 5-2` 所示。\n\n| 变量名\
  \ | 类型 | 描述 |\n| :--- | :--- | :--- |\n| `order_number` | `INT(6)` | 链接 `CustomerOrder`\
  \ 表（主键 1） |\n| `item_number` | `INT(4)` | 为每个商品分配的编号（主键 2） |\n| `catalog_number`\
  \ | `INT(8)` | 目录中的商品编号 |\n| `quantity` | `INT(5)` | 订单数量 |\n| `price` | `DECIMAL(9,2)`\
  \ | 商品价格 |\n\n`OrderItem` 表有五个字段。前两个字段共同组成主键。存储价格是为了即使将来价格发生变化，也能追溯该商品当时支付的实际价格。\n\
  \n#### Furniture 表\n\n应用程序使用了我们在微型书籍 `Chapter 4` 中设计并解释的在线目录中的 `Furniture` 表。应用程序可以从该数据库访问表。然而，为了简化设计，我们将\
  \ `Food` 表添加到了 `OnlineOrders` 数据库（我们在本章中设计并解释）。参见 `Table 5-3`。\n\n#### 数据库表：Furniture\n\
  \n| 变量名 | 类型 | 描述 |\n| :--- | :--- | :--- |\n| `catalog_number` | `SERIAL` | 由 `MySQL`\
  \ 顺序分配的商品识别码。（主键） |\n| `name` | `VARCHAR(40)` | 单个商品的名称 |\n| `date_added` | `DATE`\
  \ | 商品加入目录的日期 |\n| `category` | `VARCHAR(20)` | 第一级分类名称 |\n| `type` | `VARCHAR(20)`\
  \ | 第二级分类名称 |\n| `description` | `VARCHAR(255)` | 商品描述 |\n| `price` | `DECIMAL(7,2)`\
  \ | 商品价格。所有价格均按每磅输入。 |\n| `pix` | `VARCHAR(20)` | 包含图片的图形文件文件名。默认值为 `Missing.jpg`。\
  \ |\n\n\n\n\n该表共有八个字段。除了 `description` 和 `price` 之外，所有字段均为必填（`NOT NULL`）且不能为空为空。在输入产品时，`description`\
  \ 和 `price` 字段允许为空。`description` 和 `price` 可以在之后添加。\n\n`catalog_number` 字段是唯一标识产品的编号。该字段定义为\
  \ `SERIAL`，这是一个 MySQL 术语，意味着 `BIGINT`、`UNSIGNED`、`NOT NULL` 和 `AUTO_INCREMENT`。\n\
  \n`SERIAL` 是随 MySQL 4.1 加入的。如果你使用的是早期版本的 MySQL，则需要使用单独的数据类型，例如 `AUTO_INCREMENT`\
  \ 和 `NOT NULL`。\n\n# 第六卷\n\n## 第 5 章\n\n目录号用于客户订购产品。这是一个 `AUTO_INCREMENT` 字段，因此当产品被添加到数据库时，MySQL\
  \ 会为其顺序分配数字。在某些商店中，会分配并输入有意义的产品 ID 数字，而不仅仅是顺序号。\n\n`pix` 字段有一个默认文件名。如果没有输入文件名，则会输入一个显示“图片不可”的默认图像文件（`Missing.jpg`）。\n\
  \n### 构建购物车数据库\n\n你可以使用我们在第三卷第 3 章中讨论的任何方法创建 MySQL 数据库。以下 SQL 语句创建此数据库：`CREATE DATABASE\
  \ OnlineShop;`\n\n以下 SQL 语句创建了三个表：\n\n```sql\nCREATE TABLE CustomerOrder (\n   \
  \ order_number INT(6) NOT NULL AUTO_INCREMENT,\n    order_date DATE NOT NULL,\n\
  \    submitted ENUM(“yes”,”no”),\n    ship_name VARCHAR(50),\n    ship_street VARCHAR(50),\n\
  \    ship_city VARCHAR(50),\n    ship_state VARCHAR(2),\n    ship_zip VARCHAR(10),\n\
  \    email VARCHAR(50),\n    phone VARCHAR(20),\n    PRIMARY KEY(order_number) );\n\
  ```\n\n上述代码中的所有字段对于完成订单处理都是必须的。但只有前两个字段被声明为 `NOT NULL`。当应用程序首次将订单插入数据库时，值仅插入到前两个字段中。剩余字段此时为空；这些字段的值将在稍后添加。因此，剩余字段必须允许为空。PHP\
  \ 脚本必须确保字段包含适当的信息。\n\n```sql\nCREATE TABLE OrderItem (\n    order_number INT(6)\
  \ NOT NULL,\n    item_number INT(5) NOT NULL,\n    catalog_number INT(6) NOT NULL,\n\
  \    quantity INT(5) NOT NULL,\n    price DECIMAL(9,2) NOT NULL,\n    PRIMARY KEY(order_number,item_number)\
  \ );\n```\n\n```sql\nCREATE TABLE Furniture (\n    catalog_number INT(6) NOT NULL\
  \ AUTO_INCREMENT,\n    name VARCHAR(20) NOT NULL,\n    date_added DATE NOT NULL,\n\
  \    category VARCHAR(20) NOT NULL,\n    type VARCHAR(20) NOT NULL,\n    description\
  \ VARCHAR(255) NOT NULL,\n    price DECIMAL(7,2) NOT NULL,\n    pix VARCHAR(20)\
  \ NOT NULL DEFAULT “Missing.jpg”, PRIMARY KEY(catalog_number) );\n```\n\n### 访问购物车数据库\n\
  \nPHP 提供了 MySQL 函数，用于你从 PHP 脚本访问数据库。（注：原文此处为大量重复句子，译文略）\n\n\n\n\n此网页与本微型书籍第 4 章中在线目录的网页相同，不同之处提供了一个按钮，客户可以点击该按钮查看当前购物车的内容。\n\
  \n## 产品信息网页\n\n另一种类型的目录网页显示所选类别下产品的信息。购物车的商品页面与上一节描述的产品页面相似（见图 4-2），但它增加了一些组件，如图\
  \ 5-2 所示。\n\n## 第六卷\n\n## 第 5 章\n### 购物车\n\n### 构建一个 t\n\n**图 5-2：** 购物车显示的商品页面。\n\
  \n注意此页面上的以下新增：\n\n*   **查看购物车按钮（View Cart button）：** 页面右上角添加了一个新的提交按钮——查看购物车。此按钮允许客户查看其购物车当前的内容。该按钮也添加到了分类页面。\n\
  *   **数量列（Quantity column）：** 此列允许客户输入每件商品所需的数量。家具目录允许用户指定所需的商品数量。商品在数量字段显示为 0（零）。客户可以更改数量。\n\
  *   **添加商品按钮（Add Items button）：** 添加了一个新按钮——添加商品到购物车。\n\n页面上新增的元素是为了让客户可以选择要购买的商品。\n\
