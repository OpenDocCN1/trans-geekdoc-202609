  \n1. 比较 `and`。脚本检查 `$resState` 查看是否等于 `NV`，并检查 `$name` 查看其是否等于 `Sally`。如果两者都匹配，则条件为真，脚本不需要检查\
  \ `or`。如果变量中只有一个或两个都不等于指定值，则继续测试。\n2. 比较 `or`。脚本检查 `$resCity` 查看其是否等于 `Reno`。如果是，则条件为真。如果不是，则条件为假。\n\
  \n你可以通过括号来改变比较的顺序。括号内的连接词首先求值。例如，你可以用括号重写之前的语句：\n\n```\n($resCity == “Reno or $resState\
  \ == “NV”) and $name == “Sally”\n```\n\n# 使用条件语句\n\n括号改变了检查条件的顺序。现在 `or` 首先被检查，因为它在括号内。如果客户的名字是\
  \ Sally 且她住在 Reno 或 NV 之一，则该条件语句为真。你得到这些结果是因为脚本按如下方式检查条件：\n\n1. 比较 `or`。脚本检查 `$resCity`\
  \ 是否等于 `Reno` 或 `$resState` 是否等于 `NV`。如果不是，整个条件为假，测试停止。如果是，则条件的这一部分为真。然而，`and` 另一侧的比较也必须为真，因此测试继续。\n\
  2. 比较 `and`。\n\n（注：原文后续部分存在重复，此处已根据逻辑完成翻译并整合。）\n\n\n\n✦ else: 此部分也是可选的。只允许一个 `else`。此部分不测试条件，而是执行语句块。\n\
  \n只有当 `if` 部分和所有 `elseif` 部分都不为真时，脚本才会进入 `else` 部分。\n\n这里有一个示例。假设你是一个老师。以下 `if`\
  \ 语句在接收测试分数时，会给学生发送一个等级和一个简洁的短消息。它使用了 `if` 语句的所有三个部分（`if`、`elseif` 和 `else`），如下所示：\n\
  \n```php\nif ($score > 92 )\n{\n    $grade = “A”;\n    $message = “Excellent!\"\
  ;\n}\nelseif ($score <= 92 and $score > 83 )\n{\n    $grade = “B”;\n    $message\
  \ = “Good!\";\n}\nelseif ($score <= 83 and $score > 74 )\n{\n    $grade = “C”;\n\
  \    $message = “Okay”;\n}\nelseif ($score <= 74 and $score > 62 )\n{\n    $grade\
  \ = “D”;\n    $message = “Uh oh!\";\n}\nelse\n{\n    $grade = “F”;\n    $message\
  \ = “Doom is upon you!\";\n}\necho $message.\\\\n”;\necho “Your grade is $grade\\\
  \\n”;\n```\n\n`if` 条件语句的执行过程如下：\n\n1. 将 `$score` 中的值与 `92` 进行比较。\n   如果 `$score`\
  \ 大于 92，则 `$grade` 被设置为 `A`， `$message` 被设置为 `Excellent!`，并且脚本跳到 `echo` 语句。如果 `$score`\
  \ 为 92 或更小，则 `$grade` 和 `$message` 不被赋值，脚本跳到 `elseif` 部分。\n\n2. 将 `$score` 中的值与\
  \ `92` 和 `83` 进行比较。\n   如果 `$score` 小于 92 且大于 83，则 `$grade` 和 `$message` 被赋值，脚本跳到\
  \ `echo` 语句。如果 `$score` 小于 83，则 `$grade` 和 `$message` 不被赋值，脚本跳到第二个 `elseif` 部分。\n\
  \n3. 将 `$score` 中的值与 `83` 和 `74` 进行比较。\n   如果 `$score` 小于 83 且大于 74，则 `$grade` 和\
  \ `$message` 被赋值，脚本跳到 `echo` 语句。如果 `$score` 为 74 或更小，则 `$grade` 和 `$message` 不被赋值，脚本跳到下一个\
  \ `elseif` 部分。\n\n4. 将 `$score` 中的值与 `74` 和 `62` 进行比较。\n   如果 `$score` 小于 74 且大于\
  \ 62，则 `$grade` 和 `$message` 被赋值，脚本跳到 `echo` 语句。如果 `$score` 为 62 或更小，则 `$grade`\
  \ 和 `$message` 不被赋值，脚本跳到 `else` 部分。\n\n5. `$grade` 被设置为 `F`， `$message` 被设置为 `Doom\
  \ is upon you!`。\n   脚本继续执行 `echo` 语句。\n\n当 `if` 条件语句的任何部分要执行的语句块只包含一条语句时，就不需要大括号。例如，假设前面的示例在块中只有一条语句，如下所示：\n\
  \n```php\nif ($grade > 92 )\n{\n    $grade = “A”;\n}\n```\n\n你可以写成：\n\n```php\n\
  if ($grade > 92 )\n$grade = “A”;\n```\n\n这种快捷方法可以节省一些输入时间。然而，当你使用多个 `if` 语句时，你应该包含大括号，因为省略它们可能会导致混淆。\n\
  \n### 否定 if 语句\n\n你可以通过在条件的开头放置一个感叹号（`!`）来编写一个 `if` 语句，使得语句块在条件为假时被执行。例如，你可以使用以下\
  \ `if` 语句：\n\n```php\nif (preg_match(\"/^S\\[a-z\\]*/\",$string))\n{\n    $list[]=$string.\\\
  \\n”;\n}\n```\n\n这个 `if` 语句创建了一个以 S 开头的字符串数组。更具体地说，如果 `$string` 匹配一个指定开头为大写 S 且后跟若干个小写字母的模式，则该条件为真并执行语句块。但是，如果你在条件的开头放置一个感叹号，情况就会发生巨大变化。\n\
  \n例如，假设你使用以下语句代替：\n\n```php\nif (!preg_match(\"/^S\\[a-z\\]*/\",$string))\n{\n \
  \   $list[]=$string.\\\\n”;\n}\n```\n\n在这种情况下，数组 `$list` 包含了所有不以 S 开头的字符串。在这种情况下，因为条件开头出现了\
  \ `!`，所以条件变为“`$string` 不匹配以 S 开头的模式”。因此，当 `$string` 不以 S 开头时，条件为真。\n\n### 嵌套 if\
  \ 语句\n\n你可以在一个 `if` 条件语句内部放置另一个 `if` 条件语句。将一个语句放在另一个语句内部被称为嵌套。例如，假设你需要识别客户群。你可以使用以下嵌套\
  \ `if` 语句检查客户是否住在爱达荷州（Idaho）：\n\n```php\nif ($custState == “ID” )\n{\n    if (Email\
  \ )\n    {\n        $contactMethod = “letter”;\n    }\n    else\n    {\n       \
  \ $contactMethod = “email”;\n    }\n}\nelse\n{\n    $contactMethod = “none”;\n}\n\
  ```\n\n这些语句首先检查客户是否住在爱达荷州。如果住在爱达荷州，它会检查是否有电子邮箱。如果有电子邮箱，`$contactMethod` 设置为 `letter`；否则，`$contactMethod`\
  \ 设置为 `email`。如果不住在爱达荷州，`else` 部分将 `$contactMethod` 设置为 `none`。\n\n### Switch 语句\n\
  \n对于大多数情况，`if` 条件语句最好。然而，有时你有一组条件并想要执行不同的语句。`switch` 语句是为了这种情况设计的。通用格式如下：\n\n```php\n\
  switch ($varilename)\n{\n    case *value* :\n        *block of statements*;\n  \
  \      break;\n    case *value* :\n        *block of statements*;\n        break;\n\
  \    default:\n        *block of statements*;\n        break;\n}\n```\n\n`switch`\
  \ 语句测试一个变量。然后脚本跳转到该值的 case 部分，直到遇到 `break` 语句或 `switch` 语句结束。如果没有对应值的 `case`，脚本将执行\
  \ `default` 部分。你可以根据需要使用多个 `case` 部分。`default` 部分是可选的。如果你使用了 `default` true，习惯上将其放在末尾，但对\
  \ PHP 而言，它可以放在任何地方。\n\n以下语句设置了不同州的销售税率：\n\n```php\nswitch ($custState)\n{\n    case\
  \ “OR” :\n        $$salestaxrate = 0;\n        break;\n    case “CA” :\n       \
  \ $$salestaxrate = 1.0;\n        break;\n    default:\n        $salestaxrate = .5;\n\
  \        break;\n}\n$salestax = $orderTotalCost * $salestaxrate;\n```\n\n在这种情况下，俄勒冈州的税率为\
  \ 0，加利福尼亚州的税率为 100%，所有其他州的税率为 50%。`switch` 语句查看 `$custState` 的值并到匹配该值的部分。例如，如果 `$custState`\
  \ 为 TX，脚本执行 `default` 部分并将 `$salestaxrate` 设置为 `.5`。在 `switch` 语句之后，脚本计算 `$salestax`\
  \ 为订单总成本的一半。\n\n`break` 语句对于结束 `case` 部分至关重要。如果一个 `case` 部分没有包含 `break` 语句，脚本在 `case`\
  \ 部分结束时不会停止执行。脚本将越过 `case` 部分的边界继续执行，进入下一个 `case` 部分，直到遇到 `break` 语句或 `switch` 语句结束。对于除了最后一个\
  \ `case` 之外每一个 `case` 部分来说都是一个问题，因为它会执行匹配部分之后的语句。\n\n\n\n\n在某些少数情况下，你可能希望当 `Scripts`\
  \ 切换变量匹配第一个 case 部分的值时执行两个 case 部分，这样你可以在第一个 case 部分中省略 `break` 语句。这并不是常见的情况，但偶尔可以解决问题。\n\
  \n`switch` 语句中的最后一个 case 部分实际上不需要 `break` 语句。你可以省略它。不过，为了代码的清晰和一致性，包含它是一个好主意。\n\n\
  # 使用循环重复操作\n\n脚本中经常使用循环来设置一组重复执行的语句块。循环可以重复指定的次数。例如，输出美国所有州首的循环需要重复 50 次。或者，循环也可以一直重复直到满足特定条件。例如，输出目录中所有文件名的循环需要一直运行直到没有文件为止，无论有多少个文件。这里有三种类型的循环：\n\
  \n*   **for 循环：** 设置一个计数器；重复执行语句块直到计数器达到指定的数字。\n*   **while 循环：** 设置一个条件；检查该条件，如果条件为真，则重复执行语句块，直到条件变为假。\n\
  *   **do..while 循环：** 设置一个条件；执行一次语句块；检查该条件，如果条件为真，则重复语句块，直到条件变为假。\n\n我们将在接下来的几节中详细描述每种循环。\n\
  \n## 使用 for 循环\n\n最基础的 `for` 循环基于计数器。你设置计数器的起始值、结束值，以及设置在每次执行语句块时计数器的增量。\n\n####\
  \ 构建 for 循环\n\n一个基础 `for` 循环的通用格式如下：\n\n```php\nfor (*startingvalue*; *endingcondition*;\
  \ *increment*)\n{\n    *block of statements*;\n}\n```\n\n在 `for` 语句中，你需要填充以下值：\n\
  \n*   **startingvalue：** `startingvalue` 是一个设置变量作为计数器并将其设置为起始值的语句。例如，语句 `$i=1;`\
  \ 将 `$i` 设置为计数器变量并将其赋值为 1。通常，计数器变量从 0 或 1 开始。起始值可以是一个数字、数字组合（如 `2 + 2`）或一个变量。\n\
  *   **endingcondition：** `endingcondition` 是一个设置结束值的语句。只要该语句为真，语句块就会持续重复。当该语句不再为真时，循环结束。例如，语句\
  \ `$i<10;` 将循环的结束值设置为 10。当 `$i` 等于 10 时，该语句不再为真（因为 `$i` 不再小于 10），循环停止重复。语句可以包含变量，例如\
  \ `$i<$size;`。\n*   **increment：** 一个增加计数器值的语句。例如，语句 `$i++;` 在每个语句块结束时给你的计数器加 1。你可以使用其他增量语句，例如\
  \ `$i=+1;` 或 `$i--;`。\n\n一个基础的 `for` 循环设置了一个如 `$i` 的变量作为计数器。该变量的值在每次循环中都会发生变化。变量\
  \ `$i` 可以在重复的语句块中使用。例如，下面的简单循环会显示三次 Hello World!：\n\n```php\nfor ($i=1;$i<=3;$i++)\n\
  {\n    echo “$i. Hello World!<br />”;\n}\n```\n\n这些语句的输出如下：\n1. Hello World!\n2.\
  \ Hello World!\n3. Hello World!\n\n#### 嵌套 for 循环\n\n你可以在 `for` 循环内部嵌套 `for` 循环。假设你想打印从\
  \ 1 到 9 的乘法表。你可以使用以下语句：\n\n```php\nfor($i=1;$i<=9;$i++)\n{\n    echo \"\\nMultiply\
  \ by $i \\n\";\n    for($j=1;$j<=9;$j++)\n    {\n        $result = $i * $j;\n  \
  \      echo “$i x $j = $result\\n”;\n    }\n}\n```\n\n输出如下：\nMultiply by 1\n1 x\
  \ 1 = 1\n1 x 2 = 2\n...\n1 x 8 = 8\n1 x 9 = 9\nMultiply by 2\n2 x 1 = 2\n2 x 2 =\
  \ 4\n...\n2 x 8 = 16\n2 x 9 = 18\nMultiply by 3\n3 x 1 = 3\n以此此类推。\n\n#### 设计高级\
  \ for 循环\n\n`for` 循环的结构非常灵活。`for` 循环可以用于任何目的。\n\n## 使用 while 循环\n\n只要某些条件为真，`while`\
  \ 循环就会持续重复。循环的工作原理如下：\n\n1.  你设置一个条件。\n\n\n\n\n\n2. 条件在每个循环的顶部进行测试。\n\n3. 如果条件为真，循环将重复。如果条件为假，循环将停止。\n\
  \n以下是 while 循环的通用格式：\n\n```\nwhile ( *condition*)\n{\n    *block of statements*\n\
  }\n```\n\n以下语句建立了一个在数组中寻找苹果的 while 循环：\n\n```php\n$fruit = array ( “orange”, “apple”,\
  \ “grape” );\n$testvar = “no”;\n$k = 0;\nwhile ( $testvar != “yes” )\n{\n    if\
  \ ($fruit[$k] == “apple” )\n    {\n        $testvar = “yes”;\n        echo “apple\\\
  n”;\n    }\n    else\n    {\n        echo “$fruit[$k] is not an apple\\n”;\n   \
  \ }\n    $k++;\n}\n```\n\n这些语句生成了以下输出：\n\n```\norange is not an apple\napple\n```\n\
  \n脚本执行这些语句的过程如下：\n\n1. 在开始循环之前设置变量。`$fruit` 是一个包含三个值的数组，`$testvar` 是一个设置为“no”的测试变量，`$k`\
  \ 是一个设置为 0 的计数变量。\n2. 循环开始测试 `$testvar != “yes”` 是否为真。因为 `$testvar` 被设置为“no”，所以该语句为真，循环继续。\n\
  3. 测试 `if` 语句中的条件。`$fruit[$k] == “apple”` 是否为真？此时，`$k` 为 0，因此脚本检查 `$fruit[0]`。由于\
  \ `$fruit[0]` 是“orange”，所以该语句为假。`if` 块中的语句不执行，因此脚本跳到 `else` 语句。\n4. 执行 `else` 块中的语句。`else`\
  \ 块输出行“orange is not an apple”。这是输出的第一行。\n5. `$k` 增加 1。现在 `$k` 等于 1。\n6. 到达循环底部。流程回到\
  \ while 循环的顶部。\n7. 再次测试条件 `$testvar != “yes”`。`$testvar != “yes”` 是否为真？因为 `$testvar`\
  \ 还没有改变且仍设置为“no”，它是真的，所以循环继续。\n8. 再次测试 `if` 语句中的条件。`$fruit[$k] == “apple”` 是否为真？此时，`$k`\
  \ 为 1，因此脚本检查 `$fruit[1]`。由于 `$fruit[1]` 是“apple”，所以该语句为真。循环进入 `if` 块。\n9. 执行 `if`\
  \ 块中的语句。这些语句将 `$testvar` 设置为“yes”并输出“apple”。这是输出的第二行。\n10. `$k` 再次增加。现在 `$k` 等于\
  \ 2。\n11. 再次到达循环底部。流程再次回到 while 循环的顶部。\n12. 最后一次测试条件 `$testvar != “yes”`。`$testvar\
  \ != “yes”` 是否为真？因为 `$testvar` 已经改变且现在设置为“yes”，它是假的。循环停止。\n\n可以编写一个无限的 while 循环——即一个永远循环的循环。你可以很容易地在无意中写出一个条件始终为真的循环。如果条件永远不会变为假，循环永远不会结束。关于无限循环的讨论，请参阅本章稍后的“避免无限循环”部分。\n\
  \n## 使用 do..while 循环\n\n`do..while` 循环与 `while` 循环非常相似。与 `while` 循环一样，`do..while`\
  \ 循环只要某些条件为真就会持续重复。\n\n但与 `while` 循环不同，这些条件是在每个循环的底部测试的。如果条件为真，循环重复。当条件为假时，循环停止。\n\
  \n`do..while` 循环的通用格式为：\n\n```\ndo\n{\n    *block of statements*\n} while (*condition*);\n\
  ```\n\n以下语句建立了一个寻找苹果的循环。这与之前的脚本相同，但使用了 `do..while`：\n\n```php\n$fruit = array (\
  \ “orange”, “apple”, “grape” );\n$testvar = “no”;\n$k = 0;\ndo\n{\n    if ($fruit[$k]\
  \ == “apple” )\n    {\n        $testvar = “yes”;\n        echo “apple\\n”;\n   \
  \ }\n    else\n    {\n        echo “$fruit[$k] is not an apple\\n”;\n    }\n   \
  \ $k++;\n} while ($testvar != “yes” );\n```\n\n该脚本的输出是：\n\n```\norange is not an\
  \ apple\napple\n```\n\n`while` 循环和 `do..while` 循环的区别在于测试条件的位置。在 `while` 循环中，条件在开始测试。在\
  \ `do..while` 循环中，条件在结束时测试。这意味着 `do..while` 循环至少执行一次，即使条件从开始就是假的。\n\n### 避免无限循环\n\
  \n无限循环是一个永远不结束的循环。这在条件始终为真时会发生。你可以很容易地错误地创建一个无限循环。例如：\n\n```php\n$fruit = array\
  \ ( “orange”, “apple”, “grape” );\n$testvar = “no”;\n$k = 0;\nwhile ( $testvar !=\
  \ “yes” )\n{\n    if ($fruit[$k] == “apple” )\n    {\n        $testvar = “yes”;\n\
  \        echo “apple\\n”;\n    }\n    else\n    {\n        echo “$fruit[$k] is not\
  \ an apple\\n”;\n    }\n    $k = 0;\n}\n```\n\n在上面的示例中，`$k` 在循环内部被重置为 0。这意味着 `$k`\
  \ 始终为 0，且 `$fruit[$k]` 始终是“orange”，而不是“apple”。因此 `$testvar` 永远不会设置为“yes”，条件 `$testvar\
  \ != “yes”` 始终为真。循环将永远运行。\n\n导致无限循环的另一个常见错误是在本该使用双等号 (==) 时误用了单等号 (=)。单等号将值存储在变量中；双等号用于测试两个值是否相等。以下使用单等号的条件始终为真：\n\
  \n```php\nwhile ($testvar = “yes”)\n{\n    // 这个循环将永远运行\n}\n```\n\n\n\n\n该条件简单地将\
  \ `$testvar` 设置为“yes”。这并不是一个可以为假的问题。你可能想写的是：`while ($testvar == “yes”)`\n\n这是一个询问\
  \ `$testvar` 是否等于“yes”的问题，其答案可以是真（true）或假（false）。\n\n另一个常见的错误是漏掉了递增计数器的语句。例如，在本节之前的脚本中，如果你漏掉了\
  \ `$k++;` 语句，`$k` 将始终为 0，导致结果是无限循环。\n\n# 使用循环重复操作\n\n## 跳出循环\n\n有时，你可能希望脚本跳出循环。PHP\
  \ 提供了两个语句来实现此目的：\n\n- `break`：完全跳出循环，并继续执行循环之后的脚本语句。\n- `continue`：跳到循环的末尾，在那里会测试条件。如果条件测试为真，脚本将从循环顶部继续执行。\n\
  \n`break` 和 `continue` 语句通常用于条件语句。特别是 `break`，最常用于本章稍后讨论过的 `switch` 语句。\n\n### 构建\
  \ PHP\n\n以下语句显示了 `continue` 和 `break` 之间的区别。第一段代码展示了 `break` 语句的示例：\n\n```php\n\
  $counter = 0;\nwhile ( $counter < 5 )\n{\n    $counter++;\n    if ( $counter ==\
  \ 3 )\n    {\n        echo “break\\n”;\n        break;\n    }\n    echo “Last line\
  \ in loop: counter=$counter\\n”;\n}\necho “First line after loop\\n\\n”;\n```\n\n\
  该语句的输出如下：\n```\nLast line in loop: counter=1\nLast line in loop: counter=2\nbreak\n\
  First line after loop\n```\n\n注意，第一个循环在 `break` 语句处结束。它停止循环并立即跳转到循环之后的语句。但 `continue`\
  \ 语句并非如此。\n\n以下代码给出了 `continue` 语句的示例：\n\n```php\n$counter = 0;\nwhile ( $counter\
  \ < 5 )\n{\n    $counter++;\n    if ( $counter == 3 )\n    {\n        echo “continue\\\
  n”;\n        continue;\n    }\n    echo “Last line in loop: counter=$counter\\n”;\n\
  }\necho “First line after loop\\n”;\n```\n\n该语句的输出如下：\n```\nLast line in loop: counter=1\n\
  Last line in loop: counter=2\ncontinue\nLast line in loop: counter=4\nLast line\
  \ in loop: counter=5\nFirst line after loop\n```\n\n与 `break` 语句循环不同，这个循环并没有在 `continue`\
  \ 语句处结束。它只是停止了循环的第三次重复，并跳回循环顶部。随后在完成第四次第五次重复后完成循环，然后执行循环之后的语句。\n\n`break` 语句的一个用途是防止无限循环。循环内部的以下语句可以在合理的点停止循环：\n\
  \n```php\n$test4infinity++;\nif ($test4infinity > 100 )\n{\n    break;\n}\n```\n\
  \n如果你确定循环永远不会重复超过 100 次，请使用这些语句在循环变得无止时停止它。根据你正在构建的循环使用任何认为合理的数字。\n\n## 使用函数\n\n\
  应用程序通常在脚本的不同点或不同的脚本中执行相同的任务。函数的设计允许你在不同的位置重用相同的代码。*函数*是一组执行特定任务的 PHP 语句。你可以在任何需要执行该任务的地方使用函数。\n\
  \n例如，假设你在整个网站中频繁通过以下语句显示你的公司 Logo：\n\n```php\necho “<p><img src=’Images/logo.jpg’\
  \ width=’50’ height=’50’ hspace=’10’ align=’left’ /></p>”;\necho “<p style=’font-size:\
  \ x-large’>My Fine Company</p>”;\necho “<p style=’font-style: italic’>quality products</p>”;\n\
  ```\n\n与其在脚本中每个需要显示 Logo 的地方都输入这些代码，你可以创建一个包含这些语句的函数并将其命名为 `display_logo`。然后，你只需要在需要显示\
  \ Logo 的时候使用该函数即可。使用函数的形式如下：`display_logo();`。\n\n你可以看到，使用这一行代码节省大量的大量的工作，并且比在每个需要\
  \ Logo 的地方输入 `echo` 语句更容易易读和理解。\n\n### 脚本\n\n### 创建函数\n\n你可以通过将代码放入函数块中来创建一个函数。其通用格式如下：\n\
  \n```php\nfunction functionname()\n{\n    // 语句块；\n    return;\n}\n```\n\n例如，你可以使用以下语句创建在前节中讨论的\
  \ `display_logo()` 函数：\n\n```php\nfunction display_logo()\n{\n    echo “<p><img\
  \ src=’Images/logo.jpg’ width=’50’ height=’50’ hspace=’10’ align=’left’ /></p>”;\n\
  \    echo “<p style=’font-size: x-large’>My Fine Company</p>”;\n    echo “<p style=’font-style:\
  \ italic’>quality products</p>”;\n}\n```\n\n然后你可以在任何想要显示 Logo 的地方调用函数，如下：`display_logo();`。\n\
  \n函数末尾的 `return` 语句会停止函数并将控制交回调用脚本。然而，函数末尾不需要 `return` 语句，因为函数本身就会停止。`return` 语句使函数更易理解。`return`\
  \ 语句将在“从函数返回值”节中进行详细讨论。\n\n你可以在脚本的任何地方使用函数定义语句创建函数，但通常的做法是将所有函数放在脚本的开头或结尾。你计划在多个脚本使用的函数可以定义在单独的文件，并在任何需要这些函数的脚本中包含它。\n\
  \n### 在函数中使用变量\n\n你可以在函数内部创建并使用变量。这种变量对于函数来说是*局部*的。然而，该变量在函数外部是不可用的；主脚本无法访问。如果你想在函数外部使用该变量，必须将其设为全局变量（global）。例如，变量\
  \ `$name` 在以下函数中创建：\n\n```php\nfunction format_name()\n{\n    $first_name = “John”;\n\
  \    $last_name = “Smith”;\n    $name = $last_name, “.$first_name;\n}\nformat_name();\n\
  echo “$name”;\n```\n\n这些语句没有产生输出。在 `echo` 语句中，`$name` 不包含任何值。变量是在函数内部创建的，因此在函数外部不存在。\n\
  \n通过使用 `global` 语句，你可以在函数内部创建一个在外部存在的变量。以下语句在相同函数的基础上增加了 `global` 语句：\n\n```php\n\
  function format_name()\n{\n    global $name;\n    $first_name = “John”;\n    $last_name\
  \ = “Smith”;\n    $name = $last_name, “.$first_name;\n}\nformat_name();\necho “$name”;\n\
  ```\n\n脚本现在输出：Smith, John\n\n你必须在使用该变量之前将其设为全局变量。如果 `global` 语句在 `$name` 赋值语句之后，脚本将不会产生输出。也就是说，在前面的函数中，如果\
  \ `global` 语句在 `$name =` 语句之后，函数将无法正常工作。\n\n同样，如果变量是在函数外部创建的，除非它是全局的，否则你无法在函数内部使用它。在以下语句中，\
  \ `global` 语句在函数内部：\n\n```php\n$first_name = “John”;\n$last_name = “Smith”;\nfunction\
  \ format_name()\n{\n    global $first_name, $last_name;\n    $name = $last_name,\
  \ “.$first_name;\n    echo “$name”;\n}\nformat_name();\n```\n\n\n\n由于代码没有在函数外部包含全局声明（`global`），函数内部的\
  \ `$last_name` 和 `$first_name` 与函数外创建的 `$last_name` 和 `$first_name` 是不同的变量。函数内部的变量\
  \ `$last_name` 和 `$first_name` 在你命名它们时创建，且没有值。因此，`$name` 只输出一个逗号，如下：\n\n,\n\n为了让函数正常工作，你需要\
  \ `global` 语句。\n\n## 向函数传递值\n\n你可以在调用函数时通过将值放在括号之间来向函数传递值，如下所示：\n\n```php\nfunctionname(value,\
  \ value,...);\n```\n\n当然，变量不能凭空出现。函数必须接收这些变量。函数语句包含了它所期望的值的变量名，如下：\n\n```php\nfunction\
  \ functionname($varname1, $varname2,...)\n{\n    $statements\n    return;\n}\n```\n\
  \n例如，以下函数计算销售税：\n\n```php\nfunction compute_salestax($amount, $custState)\n{\n \
  \   switch ($custState)\n    {\n        case \"OR\":\n            $salestaxrate\
  \ = 0;\n            break;\n        case \"CA\":\n            $salestaxrate = 1.0;\n\
  \            break;\n        default:\n            $salestaxrate = .5;\n       \
  \     break;\n    }\n    $salestax = $amount * $salestaxrate;\n    echo \"$salestax<br\
  \ />\";\n}\n```\n\n第一行显示该函数期望两个值—— `$amount` 和 `$custState`。当你调用函数时，你向它传递两个值，如下：\n\
  \n```php\n$amount = 2000.00;\n$custState = \"CA\";\ncompute_salestax($amount, $custState);\n\
  ```\n\n在这种情况下，传递的金额是 2000.00，州是 CA。输出是 2000，因为 CA 的 `$salestaxrate` 为 1.0。\n\n##\
  \ 传递正确类型的值\n\n你可以直接传递值（包括计算后的值），也可以传递包含值的变量。以下调用是有效的：\n\n```php\ncompute_salestax(2000,\"\
  CA\");\ncompute_salestax(2*1000,\"\");\ncompute_salestax(2000,\"C\". \"A\");\n```\n\
  \n你可以传递任何数据类型的值。请参见本微型书籍第 1 章关于数据类型的讨论。通常，你想要测试传递的值以检查它们是否为预期的数据类型。例如，以下函数期望一个数组：\n\
  \n```php\nfunction add_numbers($numbers)\n{\n    if(is_array($numbers))\n    {\n\
  \        for($i=0; $i < sizeof($numbers); $i++)\n        {\n            $sum = $sum\
  \ + $numbers[$i];\n        }\n        echo $sum;\n    }\n    else\n    {\n     \
  \   echo \"value passed is not an array\";\n        return;\n    }\n}\n```\n\n你可以使用以下语句调用\
  \ `add_numbers` 函数：\n\n```php\n$arrayofnumbers = array(100,200);\nadd_numbers($arrayofnumbers);\n\
  ```\n\n该函数显示 300，即 100 加 200 的和。如果传递的值不是数组，如下所示：\n\n```php\nadd_numbers(100);\n\
  ```\n\n该函数显示消息：`value passed is not an array`。\n\n## 按正确顺序传递值\n\n函数按照传递的顺序接收值。也就是说，假设你有如下函数：\n\
  \n```php\nfunctionx($x,$y,$z)\n{\n    do stuff\n}\n```\n\n你按照如下方式调用函数：\n\n```php\n\
  functionx($var1,$var2,$var3);\n```\n\n`functionx` 设置 `$x=$var1`、`$y=$var2` 和 `$z=$var3`。如果你传递的值不符合预期顺序，函数在执行任务时将使用错误的值。例如，也许你计算销售税的函数定义如下：\n\
  \n```php\nfunction compute_salestax($orderCost,$custState)\n{\n    // compute tax\n\
  }\n```\n\n`$orderCost` 是订单成本，而 `$custState` 是客户居住的州。但假设你使用了以下调用：\n\n```php\ncompute_salestax($custState,$orderCost);\n\
  ```\n\n函数将 `$custState` 变量的值作为订单成本，由于它是字符串，函数将其设为 0。它将 `$orderCost` 变量设置为数字，但这与它的任何分类都不匹配。输出将是\
  \ 0。\n\n## 传递正确数量的值\n\n函数被设计为接收特定数量的值。如果你发送的值不够，函数会将缺漏的值设为 `NULL`。如果你开启了警告消息，则会显示警告消息（描述请参阅本微型书籍第\
  \ 1 章中错误信息的章节）。例如，假设你有如下格式化名称的函数：\n\n```php\nfunction format_name($first_name,$last_name)\n\
  {\n    $name = \"$last_name, $first_name\";\n    echo $name;\n}\n```\n\n该函数期望接收两个值。假设你向它传递了两个值。...（此处原文后续似乎存在逻辑混乱或重复的乱码，已按预期逻辑翻译翻译）\n\
  \n\n\n\n如果你想让函数将值返回给主脚本，请使用 `return` 语句。主脚本可以将该值放入变量中，或以处理任何值的方式使用它。\n\n## 使用函数\n\
  \n要从函数返回一个值，请在函数内部编写 `return` 语句。通用格式如下：\n\n`return value;`\n\n例如，两个数字相和的函数可能如下：\n\
  \n```php\nfunction add_2_numbers($num1,$num2)\n{\n$total = $num1 + $num2;\nreturn\
  \ $total;\n}\n```\n\n返回两个数字之和。你如下所示调用该函数：\n\n```php\n$sum = add_2_numbers(5,6);\n\
  ```\n\n此时`$sum` 等于函数返回的 `$total` 中的值 —— 11。事实上，我们可以使用快捷方式，通过一条语句将总和返回给主脚本：\n\n```php\n\
  return $num1 + $num2;\n```\n\n主脚本可以使用任何常规方式使用该值。以下语句以有效的方式使用了函数调用：\n\n```php\n$total_height\
  \ = add_2_numbers($height1,$height2);\n$totalSize = $current_size + add_2_numbers($size1,$size2);\n\
  if (add_2_numbers($costSocks,$costShoes) > 200.00 )\n$echo “No sale”;\n```\n\n`return`\
  \ 语句只能返回一个值。然而，返回的值可以是一个数组，因此你实际上可以从函数中返回多个值。\n\n你可以在条件语句中使用 `return` 语句来结束函数，如下：\n\
  \n```php\nfunction find_value($array,$value)\n{\nfor($i=1;$i<sizeof($array);$i++)\n\
  {\nif($array[$i] = $value)\n{\necho “$i. $array[$i]<br />”;\nreturn;\n}\n}\n}\n\
  }\n```\n\n该函数检查数组中是否包含某个值。例如，你可以使用以下语句调用函数：\n\n```php\n$names = array(“Joe”,”Sam”，“Juan”);\n\
  find_value($names，“Sam”);\n```\n\n该函数遍历数组中的值以寻找 `Sam`。如果找到了 `Sam`，它就会停止搜索。输出显示找到\
  \ `Sam` 的数组项，如下：\n\n1. Sam\n\n通常函数设计为返回布尔值（`true` 或 `false`），如下函数所示：\n\n```php\n\
  function is_over_100($number)\n{\nif($number > 100)\n{\nreturn true;\n}\nelse\n\
  {\nreturn false;\n}\n}\n```\n\n等于或小于 100 的数字返回 `false`；大于 100 的数字返回 `true`。另一种常见的函数设计是在函数成功时返回一个值，而在未成功时返回\
  \ `false`。例如，你可以这样设计 `find_value` 函数：\n\n```php\nfunction find_value($array,$value)\n\
  {\nfor($i=1;$i<sizeof($array);$i++)\n{\nif($array[$i] == $value)\n{\nreturn $i$;\n\
  }\n}\nreturn false;\n}\n```\n\n如果函数在数组中找到了该值，它会返回找到 `$value` 的元素索引。但是，如果在数组任何地方都没有找到该值，它将返回\
  \ `false`。\n\n## 组织脚本\n\n## 使用内置函数\n\nPHP 的许多内置函数是 PHP 如此强大且实用的原因之一。PHP 包含的函数都是普通函数。它们与你自己创建的函数没有区别。只是\
  \ PHP 已经为你完成了所有工作。\n\n你可以像调用自己创建的函数一样使用 PHP 的内置函数。你只需要使用函数名并传递函数所需的任何值。\n\n我们在整本书中都会讨论特定的\
  \ PHP 函数。例如，在本章的前面部分，我们讨论了几个可以用来检查变量是否存在或其是否为空的函数。这里是其中几个函数：\n\n```php\nisset($varname)\n\
  empty($varname)\n```\n\nPHP 在线文档在 `www.php.net/manual/en/funcref.php` 描述了所有内置函数。此外，PHP\
  \ 文档提供了一个搜索功能，当你只记得函数名但记不住确切语法时它非常有用。在 Web 页面顶部的“Search For”文本框中输入函数名，并在下拉列表中选择\
  \ `Function List`。\n\n## 组织脚本\n\n脚本是一系列 PHP 语句，每条语句执行一个操作。PHP 从脚本开始并按顺序执行每条语句。某些语句是复杂语句，会条件性或重复地执行简单语句。\n\
  \n一个应用程序通常由多个 PHP 脚本组成。通常，一个脚本执行一个主要任务。例如，一个应用程序可能包含一个用于显示表单的脚本和一个将数据存储在数据库中的脚本。\n\
  \n然而，这只是准则而非规则。某些脚本既显示表单又处理数据。\n\n每个脚本都应该组织成不同的部分。每个部分都以描述该部分作用的注释开头（我们在第二本书中会介绍注释）。用空行将各个部分隔开。例如，一个登录脚本可能如下：\n\
  \n```php\n#显示登录表单\n*显示登录表单的语句*\n\n#检查用户名和密码\n*检查用户名和密码的语句*\n```\n\n\n\n\n无论你何时需要执行该任务。创建和使用函数在本章稍后的“使用函数”部分中已经讨论过。\n\
  \n另一种重用代码的方法是将代码存储在单独的文件中并在需要的地方将该文件引入脚本。你可以通过 `include` 语句将外部文件引入脚本，这将在本书章节稍后的“使用\
  \ include 文件进行组织”部分进行讨论。\n\n# 使用函数组织\n\n频繁使用函数来组织你的脚本。当你的脚本需要在脚本中的重复位置、应用程序中的不同脚本、甚至不同的应用程序中执行相同任务时，函数非常有用。当你写好执行该任务的函数并确认它可以正常工作后，你可以在任何需要的地方使用它。\n\
  \n寻找使用函数的机会。有了这样一行代码，你的脚本比使用 20 行实际获取客户名称的语句更容易阅读和理解：\n\n```\ngetCustomerName();\n\
  ```\n\n事实上，在你编写了一段时间 PHP 脚本后，你将拥有一堆你为各种脚本编写的函数（函数库）。很多时候，你正在编写的脚本可以使用你两个项目前为另一个应用程序编写的函数。例如，我们经常需要一个州列表。我们不需要每次需要时都包含美国所有\
  \ 50 个州的列表，而是有一个名为 `getStateNames()` 的函数，它返回一个按字母顺序排列的 50 个州名的数组；以及一个名为 `getStateCodes()`\
  \ 的函数，它返回一个包含相同顺序的所有 50 个字母州缩写代码的数组。\n\n始终使用描述性的函数名称。脚本中的函数调用应该准确地告诉你是函数的作用。长名称是可以接受的。你不希望在脚本中看到这样一行代码：\n\
  \n```\nfunction1();\n```\n\n即使是下面这一行也比它可以提供的信息要少：\n```\ngetData();\n```\n\n你希望看到这样一行代码：\n\
  \n```\ngetAllCustomerNames();\n```\n\n# 使用 include 文件组织\n\n`include` 语句将文件的内容引入你的脚本。因此，你可以将语句放入外部文件——一个与你的脚本文件分离的文件——并使用\
  \ `include` 语句在脚本的任何位置插入该文件。`include` 语句对于存储重复的语句非常有用。以下是使用 include 文件组织脚本的几种方法：\n\
  \n- **将所有或大部分 HTML 放入 include 文件中。** 例如，如果你的脚本向浏览器发送表单，将表单的 HTML 放入外部文件中。当你需要发送表单时，使用\
  \ `include` 语句。如果表单显示多次，将 HTML 放入 include 文件是一个好主意。即使表单只显示一次这也是个好主意，因为它让你的脚本更容易阅读。\n\
  - **将你的函数放入 include 文件中。** 你不需要在脚本中函数语句；可以将它们放在 include 文件中。如果你有很多函数，可以将相关的函数组织到几个\
  \ include 文件中，例如 `data_functions.inc` 和 `form_functions.inc`。在脚本顶部使用 `include` 语句，只读取脚本中使用的函数。\n\
  - **存储 Web 网站所有文件共有的语句。** 大多数 Web 网站都有许多具有共同元素的网页。例如，所有网页都以 `<html>`、`<head>` 和\
  \ `<body>` 标签开头。如果你将公共语句存储在 include 文件，你可以在每个网页中包含它们，确保你的所有页面看起来都一样。\n\n例如，你可能在\
  \ include 文件中有以下语句：\n\n```html\n<html>\n<head><title><?php echo $title ?></title></head>\n\
  <body topmargin=\"0\">\n<p style=\"text-align: center\">\n<img src=\"logo.gif\"\
  \ width=\"100\" height=\"200\">\n<hr color=\"red\" />\n</body>\n```\n\n如果你在 Web\
  \ 网站的每个脚本顶部包含此文件，你可以节省大量的打字工作，并且知道你的所有页面都是匹配的。此外，如果你想更改所有页面的任何外观，你只需要在一个地方进行更改——在\
  \ include 文件中。include 文件的安全性将在本书稍后的“存储 include 文件”部分讨论。\n\n## 包含文件\n\n你使用 `include`\
  \ 语句将外部文本文件的内容引入脚本。`include` 语句的格式为：`include(\"*filename*\");`\n\n文件可以有任何名称。我们喜欢使用\
  \ `.inc` 扩展名，这样我们一看到名称就知道它是 include 文件。这有助于 Web 网站的组织和清晰度。\n\nPHP 提供了四种类型的 include\
  \ 语句：\n\n- `include`：包含并评估指定的文件。如果找不到指定的文件，会显示警告。\n- `require`：执行与 `include` 语句相同的操作，区别是当找不到指定文件时，除了产生警告外还会产生致命错误（fatal\
  \ error），并在该停止脚本。\n- `include_once`：执行与 `include` 语句相同的操作，区别是文件只包含一次。如果文件已经包含，则不会再次包含。在某些脚本中，文件可能会被包含多次，导致函数重复定义、变量重新赋值和其他可能的问题。\n\
  - `require_once`：执行与 `require` 语句相同的操作，区别是文件只包含一次。如果文件已经包含，则不会再次包含。此语句防止了文件被多次包含时可能发生的问题。\n\
  \n外部文件在 `include` 语句所在的位置引入脚本。文件内容作为 HTML 代码而非 PHP 读取。因此，如果你想在 include 文件中使用 PHP\
  \ 语句，你必须在 include 文件中包含 PHP 标签。\n\n在 include 文件中忘记 PHP 标签是一个常见的错误。这也是一个安全问题，因为没有\
  \ PHP 标签，include 文件中的代码将作为 HTML 显示给用户。你不希望你的数据库密码显示在网页上。include 文件的安全性将在本书稍后的“存储\
  \ include 文件”部分讨论。\n\n# 在 include 语句中使用变量\n\n你可以如下所示使用变量名作为文件名：\n\n`include(\"$filename*\"\
  );`\n\n例如，你可能想在不同的日期显示不同的消息。你可能将这些消息存储在以显示信息的日期命名的文件中。例如，你可以有一个名为 `Sun.inc` 的文件，内容如下：\n\
  \n```html\n<p>尽管去吧。睡个懒。今天不工作。</p>\n```\n\n以及其他所有类似的文件。可以使用以下语句显示当天的正确消息：\n\n```php\n\
  $today = date(\"D\");\ninclude(\"$today\".\".inc\");\n```\n\n在第一条语句之后，`$today` 包含缩写形式的星期。`date`\
  \ 语句在本书中的第一章讨论。第二条语句使用存储在 `$today` 中的日期包含正确的文件。如果 `$today` 包含 `Sun`，则语句包含名为 `Sun.inc`\
  \ 的文件。\n\n\n\n\n\n## 组织脚本\n\n✦ 使用 `.php` 扩展名命名包含文件。这需要谨慎处理，因为这允许某些 PHP 代码在没有任何上下文的情况下独立运行。例如，假设你的包含文件中有的代码删除了数据库中的某条记录（尽管这极不可能）。在脚本之外运行代码可能会产生负面后果。此外，我们发现使用\
  \ `.inc` 扩展名命名文件非常方便，这样我们一眼就能看出它是一个片段，而不是一个打算独立运行的脚本。\n\n✦ 配置 Web 服务器，以扫描 `.inc`\
  \ 扩展名以及 `.php` 扩展名文件中的 PHP 部分。这允许你通过文件名识别包含文件，但正如上面讨论的，它仍然存在独立运行文件时可能导致意外后果的问题。\n\
  \n✦ 将文件存储在外部用户无法访问的位置。这是首选的解决方案，但在某些环境中可能无法实现，例如使用 Web 托管公司时。\n\n存储包含文件的位置是外部用户无法访问的目录。例如，对于你的网站，可以在\
  \ Web 空间之外设置一个包含目录。也就是说，一个外部用户无法通过浏览器访问的目录。例如，除非在配置文件（通常为 `httpd.conf`）中进行了更改，否则\
  \ Apache 的默认 Web 空间是 Apache 安装目录下的 `htdocs`。如果你将包含文件存储在 Web 空间之外的目录（例如 `d:\\include\\\
  `），你就可以保护文件免受外部用户的访问。\n\n要包含来自隐藏目录（例如 Web 空间之外的目录）的文件，可以使用文件的完整路径，如下：`include(\"\
  d:/hidden/secretpasswords.inc\");`\n\n然而，PHP 允许你设置一个包含目录。你可以仅使用文件名从包含目录中包含文件。\n\n\
  ## 设置包含目录\n\nPHP 在当前目录（即你的 Web 页面文件所在的目录）以及 `php.ini` 文件设置指定的指定的或多个目录中查找包含文件。你可以无需指定文件路径即可从包含目录包含文件。\n\
  \n你可以通过使用 `phpinfo()` 语句查看当前包含目录的位置。在输出的 PHP 核心部分，你可以找到 `include_path` 设置，它显示了你当前包含目录所在的位置。例如，在\
  \ PHP 5 中，默认位置可能是 `c:\\php5\\pear`。\n\n你可以在 `php.ini` 文件中更改包含目录的设置。\n\n找到 `include_path`\
  \ 设置并将其更改为偏好目录的路径，如下：\n\n```ini\ninclude_path=\".;c:\\php\\include\"; # 用于 Windows\n\
  include_path=\".:/user/local/include\"; # 用于 Unix/Linux\n```\n\n这两个语句都指定了 PHP 查找包含文件的两个目录。第一个目录是点（表示当前目录），随后是第二个目录路径。你可以指定任意数量的包含目录，PHP\
  \ 将按照它们列出的顺序进行搜索，以找到包含文件。目录路径在 Windows 下用分号分隔，在 Unix/Linux 下用冒号分隔。\n\n如果你无法在 `php.ini`\
  \ 中自行设置路径，可以通过以下语句在每个单独的脚本中设置路径：\n\n```php\nini_set(\"include_path\",\"d:\\hidden\"\
  );\n```\n\n该语句仅在脚本运行时将 `include_path` 设置为指定的目录。它不会为整个 Web 网站设置该目录。\n\n要访问包含目录中的文件，只需使用文件名，如下。你不需要使用完整路径。\n\
  \n```php\ninclude(\"secretpasswords.inc\");\n```\n\n如果你的包含文件不在包含目录中，你可能需要在 `include`\
  \ 语句中使用整个路径。如果文件与脚本位于同一目录，仅需文件名即可。然而，如果文件位于另一个目录，例如脚本所在目录的子目录，或者 Web 空间之外的隐藏目录，你需要使用文件的完整路径：\n\
  \n```php\ninclude(\"d:\\hidden\\secretpasswords.inc\");\n```\n\n\n\n\n\n通常你想要获取有关某个文件的信息。PHP\
  \ 提供了了一些函数，允许你在脚本内部查找文件信息。\n\n你可以使用 `file_exists` 语句来判断文件是否存在，如下所示：\n\n```php\n\
  $result = file_exists(“stuff.txt”);\n```\n\n在执行该语句后，$result 包含 `true` 或 `false`。该函数通常用于条件语句中，例如下：\n\
  \n```php\nif(!file_exists(“stuff.txt”)) {\necho “File not found!\\\\n”;\n}\n```\n\
  \n## 管理文件\n\n当你确定文件存在时，可以获取关于它的信息。\n\n表 3-1 显示了 PHP 提供的许多用于检查文件的函数。（表 3-1 中的某些信息仅与\
  \ Linux/Unix/Mac 相关，另一些信息在 Windows 上也会返回。）\n\n### 表 3-1：获取文件信息的函数\n\n| 函数 | 作用 |\
  \ 输出 |\n| :--- | :--- | :--- |\n| `is_file(“stuff.txt”)` | 测试该文件是否为普通文件，而不是目录或其他特殊类型\
  \ | `true` 或 `false` |\n| `is_dir(“stuff.txt”)` | 测试该文件是否为目录 | `true` 或 `false`\
  \ |\n| `is_executable(“do.txt”)` | 测试该文件是否可执行 | `true` 或 `false` |\n| `is_writable(“stuff.txt”)`\
  \ | 测试你是否可以写入该文件 | `true` 或 `false` |\n| `is_readable(“stuff.txt”)` | 测试你是否可以读取该文件\
  \ | `true` 或 `false` |\n| `fileatime(“stuff.txt”)` | 返回文件最后访问的时间 | `Unix timestamp`\
  \ (如 `1057196122`) 或 `false` |\n| `filectime(“stuff.txt”)` | 返回文件创建的时间 | `Unix timestamp`\
  \ 或 `false` |\n| `filemtime(“stuff.txt”)` | 返回文件最后修改的时间 | `Unix timestamp` 或 `false`\
  \ |\n| `filegroup(“stuff.txt”)` | 返回文件的组 ID | 组 ID 的 `Integer` 或 `false` |\n| `fileowner(“stuff.txt”)`\
  \ | 返回文件所有者的用户 ID | 用户 ID 的 `Integer` 或 `false` |\n| `filesize(“stuff.txt”)` | 返回以字节计算的大小\
  \ | `Integer` 或 `false` |\n| `filetype(“stuff.txt”)` | 返回文件类型 | `File type`（如 `file,\
  \ dir, link, char`），若错误或无法识别类型则返回 `false` |\n| `basename(“/t1/do.txt”)` | 从路径中返回文件名\
  \ | `do.txt` |\n| `dirname(“/t1/do.txt”)` | 从路径中返回目录名 | `/t1` |\n\n返回关于路径/文件名有用信息的函数是\
  \ `pathinfo()`。你可以使用以下语句：\n\n```php\n$pinfo = pathinfo(“/topdir/nextdir/stuff.txt”);\n\
  ```\n\n在执行该语句后，$pinfo` 是一个包含以下内容的数组：\n- `$pinfo[dirname]` = `/topdir/nextdir`\n\
  - `$pinfo[basename]` = `stuff.txt`\n- `$pinfo[extension]` = `txt`\n\n当你使用表 3-1 中的任意一个函数测试文件时，任何输入错误（例如文件名拼写错误）都会导致\
  \ `false` 结果。例如，如果 “tyme” 是一个文件而不是目录，`is_dir(“tyme”)` 将返回 `false`。但是，如果 “tyme” 不存在（因为你本想输入\
  \ “type”），它也会返回 `false`。\n\n表 3-1 中的某些函数会返回 Unix 时间戳。你可以按照第 1 章所述，使用 `date` 函数将这些时间戳转换为日期。\n\
  \n## 复制、重命名和删除文件\n\n你可以将现有文件复制到新文件中。复制后，你将拥有具有不同名称的文件副本。复制文件对于备份重要文件很有用。要复制文件，使用\
  \ `copy` 语句，如下：\n\n```php\ncopy(“fileold.txt”,”filenew.txt”);\n```\n\n该语句将现有文件 `fileold.txt`\
  \ 复制到 `filenew.txt`。如果已经存在名为 `filenew.txt` 的文件，它会被被覆盖。如果你不想覆盖现有文件，可以使用以下语句来防止：\n\
  \n```php\nif(!file_exists(“filenew.txt”)) {\ncopy(“fileold.txt”,”filenew.txt”);\n\
  } else {\necho “File already exists!\\n”;\n}\n```\n\n你可以使用路径名作为目标将文件复制到不同的目录，如下：\n\
  \n```php\ncopy(“fileold.txt”,”newdir/filenew.txt”);\n```\n\n你可以使用 `rename` 语句重命名文件，如下：\n\
  \n```php\nrename(“oldname.txt”,”newname.txt”);\n```\n\n如果你尝试将文件重命名为已存在的文件名，会显示警告且文件不会被重命名：`Warning:\
  \ rename(fileold.txt,filenew.txt): File exists`\n\n要删除不需要的文件，使用 `unlink` 语句，如下：\n\
  \n```php\nunlink(“badfile”);\n```\n\n在执行该语句后，文件将被删除。如果文件不存在，`unlink` 不会报错。注意拼写。\n\
  \n## 组织文件\n\n文件被组织在目录中。本节将介绍如何创建和目录。\n\n### 创建目录\n\n要创建一个目录，使用 `mkdir` 函数，如下：\n\n\
  ```php\nmkdir(“testdir”);\n```\n\n该语句在脚本所在的目录下创建一个名为 `testdir` 的目录。如果已存在同名目录，会显示警告且不会创建：`Warning:\
  \ mkdir(testdir): File exists` in test.php on line 5\n\n你可以通过以下语句先检查目录是否存在：\n\n\
  ```php\nif(!is_dir(“mynewdir”)) {\nmkdir(“mynewdir”);\n} else {\necho “Directory\
  \ already exists!”\n}\n```\n\n在创建目录后，你可以通过复制复制文件来组织其内容。复制文件在本章的“复制、重命名和删除文件”部分已有介绍。\n\
  \n要在另一个目录中创建目录，使用完整路径，如下：\n\n```php\nmkdir(“/topdir/nextdir/mynewdir”);\n```\n\n\
  你可以使用相对路径创建一个目录，如下：\n\n```php\nmkdir(\"../mynewdir”);\n```\n\n### 构建目录下所有文件的列表\n\
  \n获取目录中的文件列表通常很有。例如，你可能想为用户提供下载的文件列表，或者想显示特定目录下的图像。\n\nPHP 提供了打开和读取目录的函数。要打开目录，使用\
  \ `opendir` 语句，如下：\n\n```php\n$dh = opendir(“/topdir/testdir”);\n```\n\n如果你尝试打开一个不存在的目录，会显示警告：`Warning:\
  \ opendir(testdir): failed to open dir: Invalid argument` in test13.php on line\
  \ 5\n\n在前语句中，变量 `$dh` 是一个目录句柄，指向已打开的目录，你之后可以使用它来读取目录。要从目录读取文件名，使用 `readdir` 函数，如下：\n\
  \n```php\n$filename = readdir($dh);\n```\n\n在执行该语句后，$filename` 包含一个文件名。存储在 `$filename`\
  \ 中的只有文件名，而不是文件的完整路径。要读取目录中的所有文件名，你可以使用 `while` 循环，如下：\n\n```php\nwhile($filename\
  \ = readdir($dh)) {\necho $filename.”\\\\n”;\n}\n```\n\n\n\n\n假设你想创建一个图像库，在网页中显示指定目录下的所有图像。你可以使用\
  \ `opendir` 和 `readdir` 函数来实现这一目标。列表 3-1 显示了一个创建图像库的脚本。\n\n### 列表 3-1：创建图像库的脚本\n\
  \n```php\n<?php\n\n/* 脚本名称：displayGallery\n* ：显示存储在指定目录\n* 中的所有图像文件。\n*/\n\necho\
  \ “<html><head><title>Image Gallery</title></head>\n<body>”;\n$dir = “../test1/testdir/”;\
  \ // 8\n$dh = opendir($dir); // 9\nwhile($filename = readdir($dh)) // 10\n{\n$filepath\
  \ = $dir.$filename; // 12\nif(is_file($filepath) and ereg(\"\\\\.jpg$”,$filename))\
  \ // 13\n{\n$gallery[] = $filepath;\n}\n}\nsort($gallery); // 16\nforeach($gallery\
  \ as $image) // 17\n{\necho “<hr />”;\necho “<img src=’$image’ /><br />”;\n}\n?>\n\
  </body></html>\n```\n\n注意列表 3-1 中某些行末尾的行号。后续对脚本及其工作原理的讨论将引用脚本中的行号：\n\n- **8**：此行将目录名称存储在\
  \ `$dir` 中，供程序后续使用。注意目录名称末尾包含了 `/`。即使在 Windows 下也不要使用 `\\`\\`。\n- **9**：此行打开目录。\n\
  - **10**：此行启动了一个 `while` 循环，读取目录中的每个文件名。\n- **12**：此行创建了变量 `$filepath`，它是文件的完整路径。如果第\
  \ 8 行目录名末尾没有包含 `/`，则 `$filepath` 将是一个无效路径。\n- **13**：此行通过查找 `.jpg` 扩展名来检查文件是否为图形文件。如果文件具有\
  \ `.jpg` 扩展名，则将完整文件路径添加到名为 `$gallery` 的数组中。\n- **16**：此行对数组进行排序，以便按字母顺序显示图像。\n-\
  \ **17**：此行启动 `foreach` 循环，在网页中显示图像。\n\n### 使用操作系统命令\n\n当你需要与操作系统交互时，最好的方法始终是使用专门为此目的提供的\
  \ PHP 函数。使用 PHP 函数比直接执行操作系统命令更安全。\n\n然而，PHP 有时不会提供执行你所需任务的函数。在这种情况下，你可以使用允许执行操作系统命令的\
  \ PHP 特性。\n\n在本节中，我们假设你已经熟悉对应操作系统命令的格式和用法。描述操作系统命令超出了本书的范围。如果你需要在 PHP 脚本中运行操作系统命令，本节将向你展示如何操作。\n\
  \nPHP 允许你通过任何一种方法使用系统命令或运行其他语言的程序：\n\n- **反引号（backticks）**：PHP 执行两个反引号（`` `` ``）之间的系统命令并显示结果。\n\
  - **system 函数**：此函数执行系统命令，显示输出，并返回输出的最后一行。\n- **exec 函数**：此函数执行系统命令，将输出存储在数组中，并返回输出的最后一行。\n\
  - **passthru 函数**：此函数执行系统命令并显示输出。\n\n你可以执行任何可以在系统提示符中输入的命令。该命令将按原样执行。你可以执行简单命令：`ls`\
  \ 或 `dir`，`rename` 或 `mv`，`rm` 或 `del`。如果你的操作系统允许管道或重定向输出，你可以在 PHP 中执行的系统命令中进行管道或重定向。如果你的操作系统允许在一行中输入两个命令，你可以将两个命令放入你从\
  \ PHP 执行的单条命令中。以下示例命令在 PHP 中执行是有效的，取决于操作系统：\n\n```bash\ndir\nrm badfile.txt\ndir\
  \ | sort\ncd c:\\\\php ; dir (在 Windows 中无效)\n“cd c:\\\\php && dir” (Windows)\n\
  dir > dirfile\nsort < unsortedfile.txt\n```\n\n在某些情况下，你想运行一个需要很长时间才能完成的系统命令。你可以在后台运行该系统命令（如果你的操作系统支持），同时让\
  \ PHP 继续执行脚本。如果你这样做，你需要将输出重定向到文件，而不是返回给脚本，这样 PHP 可以在系统命令完成之前继续运行。后续章节将详细详细描述上述方法。\n\
  \n### 使用反引号\n\n执行系统命令的一种简单方法是将命令放在两个反引号（`` `` ``）之间，如下：\n\n```php\n$result = `dir\
  \ c:\\\\php`;;\n```\n\n变量 `$result` 包含语句的输出——在这种情况下，是 `c:\\php` 目录下的文件列表。如果你 `echo\
  \ $result`，将显示以下输出：\n\n```\nVolume in drive C has no label.\nVolume Serial Number\
  \ is 58B2-DBD6\nDirectory of c:\\php\n10/10/2007 05:43 PM <DIR> .\n10/10/2007 05:43\
  \ PM <DIR> ..\n10/10/2007 04:53 PM <DIR> dev\n10/10/2007 04:53 PM <DIR> ext\n10/10/2007\
  \ 04:53 PM <DIR> extras\n08/30/2007 07:11 AM 417,792 fd.jpg\n08/30/2007 07:11 AM\
  \ 417,792 id.jpg\n08/30/2007 07:11 AM 36,,32 ds32.dll\n08/30/2007 07:11 AM 90 go\n\
  08/30/2007 07:11 AM 97 install.txt\n08/30/2007 07:11 AM 1,097 e32.dll\n08/30/2007\
  \ 07:11 AM 166,912 librypt.dll\n08/30/2007 07:11 AM 203,712 libhash.dll\n08/30/2007\
  \ 07:11 AM 385,022 libmysql.dll\n... (已截断)\n35,,11 news.txt\n08/30/2007 07:11 AM\
  \ 830,764 php-cgi.exe\n08/30/2007 07:11 AM 1,156,880 php.exe\n08/30/2007 07:11 AM\
  \ 2,522,823 php.gif\n08/30/2007 07:11 AM 3,161,811 php.ini-dist\n08/30/2007 07:11\
  \ AM 49,953 php.ini-recommended\n08/30/2007 07:11 AM 36,924 php.exe\n08/30/2007\
  \ 07:11 AM 36,925 php2.dll\n08/30/2007 07:11 AM 36,932 php2_filter.dll\n08/30/2007\
  \ 07:11 AM 57,410 php2_hooks.dll\n08/30/2007 07:11 AM 669,318 php5embed.lib\n```\n\
  \n当安全模式（safe\\_mode）启用时，反引号操作符会被禁用。在安装 PHP 时，安全模式默认设置为 Off。除非 PHP 管理员故意开启，否则安全模式不会设置为\
  \ On。\n\n### 使用 system 函数\n\n`system` 函数执行系统命令，显示输出，并返回系统命令输出的最后一行。要执行系统命令，请使用以下语句：\n\
  \n```php\n$result = system(“dir c:\\\\php”);\n```\n\n当此语句执行时，目录列表将被显示，并且 `$result`\
  \ 包含命令输出的最后一行。如果你 `echo $result`，你会看到类似下面的的内容：\n\n```\n11 Dir(s) 566,263,808 bytes\
  \ free\n```\n\n\n\n\n`exec` 函数执行系统命令但不会显示输出。相反，输出可以存储在数组中，输出的每一行将成为数组中的一个元素。函数返回输出的最后一行。\n\
  \n也许你只是想知道一个目录中有多少文件和空闲字节。通过以下语句，你可以执行命令而无需将输出保存到数组中：\n\n```php\n$result = exec(“dir\
  \ c:\\\\php”);\n```\n\n命令执行了，但输出没有显示。变量 `$result` 包含了输出的最后一行。如果你执行 `echo $result`，显示内容类似于：\n\
  \n`11 Dir(s) 566,263,808 bytes free`\n\n该输出是 `dir` 命令输出的最后一行。如果你想将 `dir` 命令的所有输出存储在数组中，请使用以下命令：\n\
  \n```php\n$result = exec(“dir c:\\\\php”,$dirout);\n```\n\n执行此语句后，数组 `$dirout` 目录列表，每个项目占一行。你可以按照如下方式显示目录列表：\n\
  \n```php\nforeach($dirout as $line)\n{\n    echo “$line\\\\n”;\n}\n```\n\n循环显示了以下：\n\
  \nVolume in drive C has no label.\n\n## Volume Serial Number is 394E-15E5\n\nDirectory\
  \ of c:\\\\php\n\n10/10/2007 05:43 PM <DIR> .\n10/10/2007 05:43 PM <DIR> ..\n10/10/2007\
  \ 04:53 PM <DIR> dev\n10/10/2007 04:53 PM <DIR> ext\n10/10/2007 04:53 PM <DIR> extras\n\
  08/30/2007 07:11 AM 417,792 fdftk.dll\n\n你也可以使用以下语句从输出数组中获取特定元素：\n\n```php\necho\
  \ $dirout[3];\necho $dirout[7];\n```\n\n输出如下：\n\nDirectory of C:\\\\PHP\n10/10/2007\
  \ 04:53 PM <DIR> dev\n\n## 使用 passthru 函数\n\n`passthru` 函数执行系统命令并按照其返回的原样显示输出。要执行系统命令，请使用以下语句：\n\
  \n```php\npassthru(“dir c:\\\\php”);\n```\n\n该语句显示了目录列表，但不返回任何内容。因此，你不需要变量来存储返回的数据。\n\
  \n输出是以原始形式呈现的，未经过处理。因此，当预期输出二进制数据时，可以使用此函数。\n\n## 系统命令的错误消息\n\n执行系统命令的方法在系统命令失败时，不会显示或返回信息性的错误消息。你之所以知道系统命令没有运行，是因为你没有得到预期的结果。但由于这些函数不返回错误消息，你不知道出了什么问题。\n\
  \n你可以通过在正在执行的系统命令后添加几个额外的字符来返回或显示操作系统的错误消息。在大多数操作系统上，如果你在系统命令后添加字符 `2>&1`，错误消息将发送到输出所在。例如，你可以使用以下语句：\n\
  \n```php\n$result = system(“di c:\\\\php”);\n```\n\n当系统命令执行时，`system` 函数显示目录。然而，注意\
  \ `dir` 被写错了，它是 `di` 而不是 `dir`。不存在名为 `di` 的系统命令，因此系统命令无法执行，什么也没有显示。假设你改用了以下语句：\n\
  \n```php\n$result = system(“di c:\\\\php 2>&1”);\n```\n\n在这种情况下，显示了错误消息。在 Windows\
  \ XP 上，显示的错误消息如下：\n\n`‘di’ is not recognized as an internal or external command,\
  \ our operable program or batch file.`\n\n请确保 `2>&1` 中不包含任何空格。该格式要求字符连在一起，不能有任何空格。\n\
  \n## 理解安全问题\n\n当你执行系统命令时，你允许用户在你的计算机上执行某项操作。如果系统命令是 `dir c:\\\\php`，那是没问题的。但如果系统命令是\
  \ `rm /bin/*` 或 `del c:\\\\\\*.*`，你将对结果感到不悦。在使用脚本之外执行系统命令的函数时，你需要非常小心。\n\n只要你只执行自己编写的命令（例如\
  \ `dir` 或 `ls`），你就是安全的。但当你开始执行包含用户发送数据的命令时，你需要极其小心。例如，假设你有一个应用程序，用户在表单中输入名称，然后你的应用程序会根据用户发送的名称创建一个目录。用户在名为\
  \ `directoryName` 的表单字段中输入 `Smith`。你处理表单的脚本有如下命令：\n\n```php\n$directoryName = $_POST['directoryName`];\n\
  exec(“mkdir $directoryName”);\n```\n\n由于 `$directoryName = Smith`，执行的系统命令是 `mkdir\
  \ Smith`。该目录被创建了。\n\n\n\n\n\n**Warning**: `ftp_login()` 期望参数 1 为资源，但在 `d:\\test1\\\
  test13.php` 第 `9` 行给了布尔值\n\n该警告不会停止程序。登录会失败，但脚本会继续执行，这可能不是你想要的结果。因为你脚本的其他部分可能依赖于成功的\
  \ FTP 连接，你可能想在函数失败时停止脚本。以下语句会在函数失败时停止脚本：\n\n```php\n$connect = ftp_connect(“janet.valade.com”)\n\
  or die(“Can’t connect to server”);\n\n$login_result = ftp_login($connect,$userid,$passwd)\n\
  or die(“Can’t login to server”);\n```\n\n登录 FTP 服务器后，你可以向其发送请求以完成各种任务，例如获取目录列表或上传和下载文件，如接下来的章节所描述。\n\
  \n## 使用 FTP\n\n## 获取目录列表\n\n一个常见的任务是获取目录列表。`ftp_nlist` 语句从远程计算机获取目录列表并将其存储在数组中，如下所示：\n\
  \n```php\n$filesArr = ftp_nlist($connect,”data”);\n```\n\n括号中的第二个参数是目录名称。如果你不知道目录的名称，可以请求\
  \ FTP 服务器向你发送当前目录的名称，如下：\n\n```php\n$directory_name = ftp_pwd($connect);\n$filesArr\
  \ = ftp_nlist($connect,$directory_name);\n```\n\n`ftp_nlist` 语句运行后，FTP 发送的目录列表存储在数组中，数组的每个元素包含一个文件名。你可以如下所示从数组中显示目录列表：\n\
  \n```php\nforeach($filesArr as $value)\n{\n    echo “$value\\n”;\n}\n```\n\n## 使用\
  \ FTP 下载和上传文件\n\n你可以使用 `ftp_get` 函数从远程计算机下载文件。在登录 FTP 服务器后，以下语句将从远程计算机下载文件：\n\n\
  ```php\nftp_get($connect,”newfile.txt”,”data.txt”,FTP_ASCII);\n```\n\n第一个文件名 `newfile.txt`\
  \ 是文件下载到你的计算机后将拥名称。第二个文件名 `data.txt` 是你想要下载的文件的现有名称。\n\n语句中的 `FTP_ASCII` 项告诉 FTP\
  \ 正在下载的是什么类型的文件。文件模式的选择有 `FTP_ASCII` 或 `FTP_BINARY`。\n\n二进制文件是机器语言文件。你可以通过检查文件内容确定需要哪种文件模式。如果内容是你可以读取和理解的字符，则该文件是\
  \ ASCII。如果内容看起来像乱码，则该文件是二进制的。例如，图形文件就是二进制的。\n\n你可以使用名为 `ftp_put` 的类似函数上传文件。以下语句上传文件：\n\
  \n```php\nftp_put($connect,”newfile.txt”,”data.txt”,FTP_ASCII);\n```\n\n第一个文件名 `newfile.txt`\
  \ 是文件上传到远程计算机后将拥有的名称。第二个文件名 `data.txt` 是你想要上传的文件的现有名称。\n\n当你完成连接上的文件传输后，可以使用以下语句关闭连接：\n\
  \n```php\nftp_close($connect);\n```\n\n列表 3-2 中的脚本下载目录中所有具有 `.txt` 扩展名的文件。这些文件通过\
  \ FTP 连接从远程计算机下载。\n\n## 列表 3-2：一个通过 FTP 下载文件的脚本\n\n```php\n<?php\n/*\n脚本名称: downloadFiles\n\
  * : 通过 FTP 下载目录中所有 .txt\n* 扩展名的文件\n*/\ninclude(“ftpstuff.inc”);\n$dir_name = “data/”;\n\
  $connect = ftp_connect($servername)\nor die(“Can’t connect to FTP server”);\n$login_result\
  \ = ftp_login($connect,$userID,$passwd)\nor die(“Can’t log in”);\n$filesArr = ftp_nlist($connect,$dir_name);\n\
  foreach($filesArr as $value)\n{\n    if(preg_match(\"#\\.txt$/\",$value))\n    {\n\
  \        if(!file_exists($value))\n        {\n            ftp_get($connect,$value,$dir_name.$value,FTP_ASCII);\n\
  \        }\n        else\n        {\n            echo “File $value already exists!\\\
  n”;\n        }\n    }\n}\nftp_close($connect);\n?>\n```\n\n该脚本从远程计算机获取目录列表并存储在 `$filesArr`\
  \ 中。`foreach` 语句遍历 `$filesArr` 中的文件名，并检查每个文件是否具有 `.txt` 扩展名。当文件具有 `.txt` 扩展名时，脚本会测试本地计算机上是否已存在该命名的文件。如果不存在该命名的文件，则下载该文件；如果存在该文件，则打印消息且不下载文件。\n\
  \n列表 3-2 中的脚本包含一个名为 `ftpstuff.inc` 的文件。该文件包含了 FTP 到服务器所需的信息。`ftpstuff.inc` 文件包含类似下面的代码：\n\
  \n```php\n<?php\n$servername = “yourserver”;\n$userID = “youruserid”;\n$passwd =\
  \ “yourpassword”;\n?>\n```\n\n## 其他 FTP 函数\n\n附加 FTP 函数执行其他操作，例如切换到远程计算机上的另一个目录或在远程计算机上创建新目录。表\
  \ 3-2 包含了大多数 FTP 函数。\n\n### 表 3-2 函数\n\n| 函数 | 功能 |\n| :--- | :--- |\n| `ftp_cdup($connect)`\
  \ | 返回上级目录。 |\n| `ftp_chdir($connect, “directoryname”)` | 切换远程计算机目录。 |\n| `ftp_close($connect)`\
  \ | 关闭 FTP 连接。 |\n| `ftp_connect(“servername”)` | 打开与计算机的连接。`servername` 可以是域名或\
  \ IP 地址。 |\n| `ftp_delete($connect, “path/filename”)` | 删除远程计算机上的文件。 |\n| `ftp_exec($connect,\
  \ “command”)` | 在远程计算机上执行系统命令。 |\n| `ftp_fget($connect,$fh, “data.txt”,FTP_ASCII)`\
  \ | 将远程计算机的内容下载到打开的文件。`$fh` 是打开文件的句柄。 |\n| `ftp_fput($connect,”new.txt”,$fh,FTP_ASCII)`\
  \ | 将打开的文件上传到远程计算机。`$fh` 是打开文件的句柄。 |\n| `ftp_get($connect,”d.txt”,“sr.txt”,FTP_ASCII)`\
  \ | 从远程计算机下载文件。`sr.txt` 是下载的文件名，`d.txt` 是文件名。 |\n| `ftp_login($connect, $userID,$password)`\
  \ | 登录 FTP 服务器。 |\n| `ftp_mdtm($connect, “filename.txt”)` | 获取文件最后修改的时间。 |\n| `ftp_mkdir($connect,\
  \ “directoryname”)` | 在远程计算机上创建新目录。 |\n| `ftp_nlist($connect, “directoryname”)`\
  \ | 获取远程目录中的文件列表。返回数组。 |\n| `ftp_put($connect,”d.txt”,”sr.txt”,FTP_ASCII)` | 上传文件到远程计算机。`sr.txt`\
  \ 是要上传的文件名，`d.txt` 是远程计算机上的文件名。 |\n| `ftp_pwd($connect)` | 获取远程计算机当前目录的名称。 |\n|\
  \ `ftp_rename($connect, “oldname”,“newname”)` | 重命名远程计算机上的文件。 |\n| `ftp_rmdir($connect,\
  \ “directoryname”)` | 删除远程计算机上的目录。 |\n| `ftp_size($connect, “filename.txt”)` | 返回远程计算机上文件的大小。\
  \ |\n| `ftp_systype($connect)` | 返回远程文件服务器的系统类型（例如 Unix）。 |\n\n\n\n\n2. 将数据写入文件或从文件中检索数据。\n\
  3. 关闭文件。\n\n这些步骤将在后续章节中进行详细讨论。\n\n## 文件的读取与写入\n\n## 访问文件\n\n在向文件中写入或从文件中读取信息之前，第一步是打开文件。以下是打开文件的语句的通用格式：\n\
  \n```php\n$fh = fopen(“filename”,”mode”);\n```\n\n变量 `$fh` 被称为文件句柄（file handle），用于向已打开的文件写入数据或从其读取数据的语句，以便\
  \ PHP 知道要向哪个文件写入或从哪个文件读取。`$fh` 包含了标识打开文件位置的信息。\n\n你在打开文件时使用 `mode` 来让 PHP 知道你打算对文件进行什么操作。表\
  \ 3-3 显示了你可以使用的模式。\n\n### 表 3-3：打开文件的模式\n\n| 模式 | 功能 | 文件不存在时会发生什么 |\n| :--- | :---\
  \ | :--- |\n| r | 只读。 | 显示警告消息。 |\n| r+ | 读写。 | 显示警告消息。 |\n| w | 仅写。 | PHP 尝试创建它。（如果文件已存在，PHP\
  \ 将覆盖它。） |\n| w+ | 读写。 | PHP 尝试创建它。（如果文件已存在，PHP 将覆盖它。） |\n| a | 在文件末尾追加数据。 | PHP\
  \ 尝试创建它。 |\n| a+ | 读取和追加。 | PHP 尝试创建它。 |\n\n文件名可以是文件名（`filename.txt`）、文件路径（`c:/data/filename.txt`）或\
  \ URL（`http://yoursite.com/filename.txt`）。\n\n### 以只读模式打开文件\n\n你可以使用以下语句打开 `file1.txt`\
  \ 来读取文件中的信息：\n\n```php\n$fh = fopen(“file1.txt”,”r”);\n```\n\n根据此语句，PHP 在当前目录中查找\
  \ `file1.txt`，该目录就是你的 PHP 脚本所在的目录。如果找不到文件，可能会显示或不显示类似的警告消息，这取决于设置的错误级别，如本微型教程第 1\
  \ 章所述：\n\n**Warning: fopen(file1.txt): failed to open stream: No such file or directory\
  \ in d:\\test2.php on line 15**\n\n请记住，警告条件不会停止脚本。脚本将继续运行，但文件不会打开，因此任何后续读取或写入文件的语句都不会执行。\n\
  \n你可能希望在文件无法打开时停止脚本。你需要使用 `die` 语句手动完成操作，如下：\n\n```php\n$fh = fopen(“file1.txt”,”r”)\
  \ or die(“Can’t open file”);\n```\n\n### 以写入模式打开文件\n\n你可以使用以下类型的语句在指定的目录中打开文件以存储信息：\n\
  \n```php\n$fh = fopen(“c:/testdir/file1.txt”,”w”);\n```\n\n如果文件不存在，它将在指定的目录中创建。然而，如果目录不存在，则不会创建该目录并会显示警告。（你必须在尝试向该目录写入文件之前先创建该目录。）\n\
  \n在尝试向目录写入文件之前，你可以使用以下语句检查该目录是否存在：\n\n```php\nif(is_dir(“c:/tester”)) {\n    $fh\
  \ = fopen(“c:/testdir/file1.txt”,”w”);\n}\n```\n\n通过这些语句，只有当路径/文件名存在且是一个目录时，`fopen`\
  \ 语句才会执行。\n\n### 在另一个网站上打开文件\n\n你也可以通过以下语句打开另一个网站上的文件：\n\n```php\n$fh = fopen(“http://example.com/file.txt”,”r”);\n\
  ```\n\n你只能在读取模式下 URL，而不是写入模式。\n\n### 关闭文件\n\n在完成读取或写入后，使用以下语句关闭文件：\n\n```php\nfclose($fh);\n\
  ```\n\n在此语句中，`$fh` 是你打开文件时使用的句柄。\n\n### 写入文件\n\n打开文件后，你可以使用 `fwrite` 语句写入文件，其通用格式如下：\n\
  \n```php\nfwrite($fh, datatosave);\n```\n\n在此语句中，`$fh` 是你打开文件时创建的句柄，`datatosave`\
  \ 是要存储的信息。字符串或变量。\n\n例如，你可以使用以下语句：\n\n```php\n$today = date(“Y-m-d”);\n$fh = fopen(“file.txt”,”a”);\n\
  fwrite($fh,”today\\n”);\nfclose($fh);\n```\n\n### 从文件中读取\n\n你可以通过 `fgets` 语句从文件中读取，其格式如下：\n\
  \n```php\n$line = fgets($fh);\n```\n\n在此语句中，`$fh` 是指向打开文件的指针。`fgets` 读取直到遇到行尾或文件结束，并将结果存储在\
  \ `$line` 中。\n\n```php\nwhile(!feof($fh)) {\n    $line = fgets($fh);\n    echo “$line”;\n\
  }\n```\n\n`feof($fh)` 函数在文件结束时返回 true。感叹号反转了该条件，只要文件未结束，循环就会继续执行。\n\n在某些情况下，你不希望包含换行符。如果是这样，你需要使用以下语句将其删除：\n\
  \n```php\nwhile(!feof($fh)) {\n    $line = rtrim(fgets($fh));\n    echo “$line”;\n\
  }\n```\n\n### 分段读取\n\n有时你想从文件中读取特定大小的字符串。你可以通过以下格式告诉 `fgets` 读取指定数量的字符：\n\n```php\n\
  $line = fgets($fh, n);\n```\n\n此语句告诉 PHP 读取长度为 `n-1` 的字符串，直到遇到行尾或文件结束。例如，读取四个字符串：\n\
  \n```php\nwhile(!feof($fh)) {\n    $char4 = fgets($fh,5);\n    echo “$char4\\n”;\n\
