  n\";\n} // end category\necho \"</ul>\\n\";\necho \"<input type='submit' name='Products'\
  \ value='Select Category' />\\n\";\n?>\n</</body>\n</html>\n```\n\n以下数字对应上方的行号：\n\
  - 第 1 行：提供程序。\n- 第 6 行：包含显示 Web 页面所需的样式。\n- 第 25 行：开始 PHP 部分。\n- 第 29 行：开始一个显示分类的表单。\n\
  - 第 30 行：开始 `<ul>` 以列出分类。\n- 第 31 行：开始分类的 foreach 循环。\n- 第 33 行：输出带有变量 `$key` 的\
