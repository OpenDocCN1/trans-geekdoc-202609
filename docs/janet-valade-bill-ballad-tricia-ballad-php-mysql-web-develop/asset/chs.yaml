  \n## 多维数组\n\n在这一章早前的章节中，我们描述的是单个键值列表的数组。然而，在某些情况下，你可能想存储具有多个键的值。例如，假设你想按州和县存储城市，如下所示：\n\
  \n```php\n$cities['AZ']['Maricopa'] = Phoenix;\n$cities['AZ']['Cochise'] = Tombstone;\n\
  $cities['AZ']['Yuma'] = Yuma;\n$cities['OR']['Multnomah'] = Portland;\n$cities['OR']['Tillamook']\
  \ = Tillamook;\n$cities['OR']['Wallowa'] = Joseph;\n```\n\n**第二卷**\n\n这种数组是*多维*数组，因为它就像是数组的数组，具有以下结构：\n\
  \n\n\n\n\n## PHP 基础\n\n`$cities` 键值\n\n键值\n\nAZ Maricopa Phoenix\n\nCochise Tombstone\n\
  \nYuma Yuma\n\nOR Multnomah Portland\n\nTillamook Tillamook\n\nWallowa Joseph\n\n\
  `$cities` 是一个二维数组。\n\nPHP 还可以理解深度四、五、六或更多层级的多维数组。然而，当人们尝试理解深度超过三层的数组时，往往会感到头疼。随着维数的增加，混淆的可能性也会之增加。请尽量保持你的多维数组在于管理的范围内。\n\
  \n你可以使用处理一维数组相同的步骤从多维数组中获取值。例如，你可以通过此语句直接访问值：\n\n```php\n$city = $cities['AZ']['Yuma']];\n\
  ```\n\n你也可以输出该值：\n\n```php\necho $cities['OR']['Wallowa']];\n```\n\n然而，如果你在双引号内组合该值，则需要使用大括号来包裹变量名。变量名开头的\
  \ `$` 必须紧跟在 `{` 后面，不能有空格，如下：`echo “A city in Multnomah County, Oregon, is {$cities['OR']['Multnomah']}”;`\n\
  \n## 使用日期和时间\n\n输出是\n\n俄勒冈州 Multnomah 县有一个城市 Portland\n\n你可以使用 `foreach` 语句（在前节中描述）遍历多维数组。每个数组都需要一个\
  \ `foreach` 语句。一个 `foreach` 语句位于另一个 `foreach` 语句内部。将语句放在其他语句内部被称为嵌套。\n\n因为二维数组（如\
  \ `$cities`）包含两个数组，因此需要两个 `foreach` 语句来遍历它。以下语句从多维数组获取值并在 HTML 表格中输出它们：\n\n```php\n\
  foreach( $cities as $state )\n{\n    foreach( $state as $county => $city )\n   \
  \ {\n        echo “$city, $county county <br />”;\n    }\n}\n```\n\n第一个 `foreach`\
  \ 语句遍历 `$cities` 多维数组，并将一个包含县/城市键值对的数组存储在变量 `$state` 中。第二个 `foreach` 语句遍历存储在 `$state`\
  \ 中的数组。这些语句将给你以下输出：\n\nPhoenix, Maricopa county\n\nTombstone, Cochise county\n\n\
  Yuma, Yuma county\n\nPortland, Multnomah county\n\nTillamook, Tillamook county\n\
  \nJoseph, Wallowa county\n\n日期和时间可以是 Web 数据库应用中的重要元素。PHP 能够识别日期和时间并以不同于普通字符串的方式处理它们。计算机以一种名为\
  \ `timestamp`（时间戳）的格式存储日期时间。然而，这不是你希望看到的日期格式。PHP 将你表示的日期转换为计算机理解的时间戳，并将时间戳转换为人们熟悉的格式。PHP\
  \ 使用内置函数处理日期时间。\n\n时间戳格式是 Unix 时间戳，这是一个整数，从 1970 年 1 月 1 日 00:00:00 GMT（格林尼治标准时间）到时间戳所代表的时间秒数。这种格式使得计算两个日期之间的时间变得简单——只需用一个时间戳减去另一个。\n\
  \n### 设置本地时间\n\n随着 PHP 5.1 的发布，PHP 在 `php.ini` 中增加了默认本地时区的设置。如果你不设置默认时区，PHP 将进行猜测，有时结果是\
  \ GMT。此外，PHP 会显示一条消息建议你设置本地时区。\n\n## 第一章\n\n要设置默认时区，请遵循以下步骤：\n\n1. **用文本编辑器打开 `php.ini`。**\n\
  2. **向下滚动到标题为 `[Date]` 的部分。**\n3. **找到设置 `date.timezone =`。**\n4. **如果该行以分号（`;`）开头，删除分号。**\n\
  5. **在等号后添加时区代码。**\n\n你可以在 PHP 在线手册的附录 H（网址 www.php.net/manual/en/timezones.php）查看时区代码列表。例如，你可以通过以下设置将默认时区设置为太平洋时间：\n\
  \n```ini\ndate.timezone = America/Los_Angeles\n```\n\n如果你没有访问 `php.ini` 文件的权限，可以在每个脚本中设置默认时区，且仅适用于该脚本，如下所示：`date_default_timezone_set(\"\
  timezonecode\");`\n\n你可以使用此语句查看当前哪个是你的默认时区：\n\n```php\n$def = date_default_timezone_get()\n\
  echo $def;\n```\n\n### 格式化日期\n\n你最常用的函数是 `date`，它将日期或时间从时间戳格式转换为你指定的格式。通用格式为：\n\n\
  ```php\n$mydate = date(\"*format*\",$timestamp);\n```\n\n`$timestamp` 是一个存储了时间戳的变量。你之前已经按照在本节稍后描述的方法，使用\
  \ PHP 函数将时间戳存储在变量中。如果没有包含 `$timestamp`，则从操作系统获取并使用当前时间。因此，你可以通过以下代码获取今天的日期：\n\n\
  ```php\n$today = date(\"Y/m/d\");\n```\n\n如果今天是 2006 年 8 月 10 日，此语句返回 2006/08/10\n\
  \n`format` 是一个字符串，指定了你想存储在变量中的日期格式。例如，格式 “y-m-d”返回 06-08-10，而 “M.d.Y”返回 Aug.10.2006。表\
  \ 1-6 列出了可以在格式字符串中使用的一些符号。（符号符号列表请参见 www.php.net/manual/en/function.date.php 的文档）。日期部分可以用连字符（-）、点（.）、斜杠（/）或空格分隔。\n\
  \n#### 表 1-6：日期格式符号\n\n| 符号 | 含义 | 示例 |\n| :--- | :--- | :--- |\n| F | 月份文本，不缩写\
  \ | January |\n| M | 月份文本，缩写 | Jan |\n| m | 月份数字，带导零 | 02 |\n| n | 月份数字，不带导零 | 2\
  \ |\n| d | 日期，带导零 | 01 |\n| j | 日期不带导零 | 1 |\n| l | 星期文本，不缩写 | Friday |\n| D | 星期，缩写\
  \ | Fri |\n| w | 星期数字 (0-6) | 6 |\n| Y | 四位数年份 | 2002 |\n| y | 两位年份 | 02 |\n| G\
  \ | 小时 (0-23)，不带导零 | 23 |\n| H | 小时 (00-23)，带导零 | 10 |\n| g | 小时 (1-12)，不带导零 | 10\
  \ |\n| i | 分钟，带导零 | 59 |\n| s | 秒，带导零 | 59 |\n| a | am 或 pm 小写 | am |\n| A | AM\
  \ 或 pm 大写 | AM |\n\n\n\n\n\n```php\n$importantDate = strtotime(\"2 weeks ago\");\
  \ # current time\n$importantDate = strtotime(\"next year gmt\");\n\n$importantDate\
  \ = strtotime(\"this 4am\"); # 4 AM today\n```\n\n如果你想知道 `$importantDate` 是多久以前，你可以将其从\
  \ `$today` 中减去。例如：\n\n```php\n$timeSpan = $today - $importantDate;\n```\n\n或者使用以下语句\n\
  \n```php\n$timeSpan =($($today - $importantDate)/60)/60\n```\n\n来找出从重要日期到现在的的小数。\n\
  \n## 理解 PHP 错误消息\n\n当出现问题时，PHP 会尽力提供帮助。它会尽可能多地提供不同类型的错误消息和警告。\n\n### PHP 错误消息类型\n\
  \nPHP 可以显示五种类型的消息。每种类型的消息都会显示遇到错误的文件以及 PHP 遇到问题的行号。不同类型的错误会在错误消息中提供额外信息。消息类型有：\n\
  \n- **解析错误 (Parse error)：** 解析错误是 PHP 在执行前扫描脚本时发现的语法错误。\n- **致命错误 (Fatal error)：**\
  \ PHP 遇到了会导致脚本停止执行的严重错误。\n- **警告 (Warning)：** PHP 发现了一个问题，但该问题的严重程度不足阻止脚本运行。\n-\
  \ **通知 (Notice)：** PHP 看到一个可能可能是错误也可能完全没问题的情况。\n- **严格 (Strict)：** 严格消息是在 PHP 5\
  \ 中引入的，用于警告编码标准问题。\n\n当你使用编码实践不佳或已被更好的代码取代的语言时，就会收到严格消息。\n\n我们建议使用带有行号的编辑器来编写 PHP\
  \ 脚本。如果你的编辑器不允许你指定要跳转的行，那么你每次收到错误消息时都必须手动从文件顶部开始数。你可以在 `www.php-editors.com` 找到关于许多编辑器的信息，包括描述和评论。\n\
  \n### 理解解析错误\n\n在开始运行脚本之前，PHP 会扫描脚本以检查语法错误。当它遇到错误时，会显示解析错误消息。解析错误是致命错误，会导致脚本无法开始运行。解析错误看起来如下：\n\
  \n`Parse error:** parse error, error, in c:\\test.php on line 6`\n\n通常情况下，你收到此错误消息是因为忘记了分号、括号或大括号。显示的错误提供了尽可能多的信息。例如，可能会显示以下内容：`Parse\
  \ error:** parse error, unexpected T_ECHO, expecting ‘,’ or ‘;’, in c:\\test.php\
  \ on line 6`\n\n此错误意味着 PHP 在预期逗号或分号的地方发现了一个 `echo` 语句，这可能意味着你忘记了上一行末的分号。\n\n`T_ECHO`\
  \ 是一个标记（token）。标记代表 PHP 语言的不同部分。\n\n有些标记如 `T_ECHO` 或 `T_IF` 比较清晰。其他的则更晦晦。请参考 PHP\
  \ 在线手册（`www.php.net/manual/en/tokens.php`）第 1 章附录中的解析标记列表及其含义。\n\n### 理解致命错误\n\n\
  当 PHP 在脚本执行期间遇到阻止脚本继续执行的严重错误时，会显示致命错误消息。脚本停止运行并显示包含尽可能信息的消息以帮助你识别问题。\n\n产生致命错误消息的一个问题是调用了不存在的函数（函数在本本书的第\
  \ 2 章中解释）。如果你在 PHP 脚本中拼写错了函数名，你会看到类似下面的致命错误消息：\n\n`Fatal error:** Call to undefined\
  \ function xxx() in C:\\Program Files\\Apache Group\\Apache2\\htdocs\\PHPandMySQL\\\
  info.php on line 10`\n\n在这种情况下，PHP 找不到你在第 10 行调用的 `xxx()` 函数。\n\n我们使用*致命错误 (fatal\
  \ errors)* 术语将此类错误与其他错误区分开来。然而，PHP 只是（混乱地）将它们称为错误。你不会在手册中找到致命错误这个术语。此外，显示此类错误所需的关键字是\
  \ `E_ERROR`。（我们将在本章后面的“显示选定的消息”部分中介绍这一点。）\n\n### 理解警告\n\n当脚本遇到问题但该问题严重程度不足以阻止脚本运行时，会显示警告消息。警告消息并不意味着脚本不能运行；脚本会继续运行。相反，警告消息告诉你\
  \ PHP 认为可能出了问题。你应该识别警告的来源，然后决定是否需要修复。通常是需要的。\n\n如果你尝试使用无效的用户名或密码连接 MySQL 数据库，你会看到以下警告消息：\n\
  \n`Warning:** mysql_connect() [function.mysql-connect]: Access denied for user ‘root’@’localhost’\
  \ (using password: YES) in C:\\Program Files\\Apache Group\\Apache2\\htdocs\\test.php\
  \ on line 9`\n\n连接数据库的尝试失败了，但脚本并没有停止。它继续执行其他的 PHP 语句。这条语句需要修正。\n\n### 理解通知\n\n通知是指\
  \ PHP 看到一个可能是错误也可能完全没问题的情况。通知和警告一样不会导致脚本停止运行。与警告相比，通知指示严重问题的概率小得多。通知只是告诉你正在做不寻常的事情，并让你再次检查你所做的事，以确保你真的想这样做。\n\
  \n你可能收到通知的一个常见原因是是你正在输出不存在的变量。以下是你可能看到的看到的示例：\n\n`Notice:**Undefined variable: age\
  \ in testing.php on line 9`\n\n### 理解严格消息\n\n严格消息警告编码标准。它们指出编码实践不佳或已被更好的代码取代的语言。严格错误类型是在\
  \ PHP 5 中添加的。严格消息不会停止脚本的执行。然而，修改你的代码使其不再显示任何严格消息，会让脚本在未来更加可靠。某些被严格消息强调的语言在未来可能会被完全移除。\n\
  \n某些严格消息引用了已弃用（deprecated）的 PHP 语言特性。弃用函数是已被新函数取代的旧函数。弃用函数仍然受支持，但在未来会被移除。PHP 可能会添加单独的错误类型\
  \ `E_DEPRECATED` 来识别此类错误，以便 `E_STRICT` 和 `E_DEPRECATED` 消息能够识别不同类型的问题。\n\n### 显示错误消息\n\
  \n你可以通过以下任何方式处理错误消息：\n\n- 在你的 Web 页面上显示部分或全部错误消息。\n- 不显示任何错误消息。\n- 抑制单个错误消息。\n\n\
  你可以通过 `php.ini` 文件中的设置或脚本中的 PHP 语句来告诉 PHP 是否显示错误消息或显示哪些错误消息。`php.ini` 中的设置会你所有脚本设置错误处理。脚本中的语句仅为该脚本设置错误处理。\n\
  \n\n\n\n错误消息默认显示在你的 Web 页面上。在 Web 页面显示错误消息存在安全风险。在开发网站时，你可以开启错误消息以便修复错误，但当 Web 页面完成并准备好公众查看时，你可以关闭错误消息。\n\
  \n你可以在 `php.ini` 文件中关闭网站所有脚本的所有错误消息。找到以下设置：\n\n`display_errors = On`\n\n将 `On` 改为\
  \ `Off`。\n\n你可以使用以下语句在单个脚本中关闭错误：`ini_set(\"display_errors\",\"off\")`。\n\n更改设置不会以任何方式改变错误本身；它只会改变错误消息是否显示。致命错误（fatal\
  \ error）仍然会停止脚本，只是不会在 Web 页面上显示消息。\n\n处理错误消息的一种方法是在 `php.ini` 中关闭它们，并在开发期间在每个单独的脚本中开启。然后，当网站准备好公开时，你可以移除开启错误消息的\
  \ `ini_set` 语句。\n\n### 显示特定的消息\n\n你可以通过 `php.ini` 中的以下设置来指定想要显示的错误消息类型：\n\n`error_reporting\
  \ =`\n\n你使用几个代码中的一个来告诉 PHP 显示哪些消息。可能的设置有：\n\n`error_reporting = E_ALL | E_STRICT`\n\
  \n`error_reporting = 0`\n\n`error_reporting = E_ALL & ~ E_NOTICE`\n\n第一种设置显示 `E_ALL`，即除严格模式以外的所有错误、警告和通知；以及\
  \ `E_STRICT`，它会显示严格模式消息。第二种设置不显示任何错误消息。第三种设置显示除严格模式和通知以外的所有错误消息，因为 `& ~` 意味着“并且不是”。\n\
  \n你还可以使用的其他代码是 `E_WARNING`（意味着所有警告）和 `E_ERROR`（意味着所有致命运行时错误）。\n\n你也可以为单个脚本设置要显示的消息类型。你可以在脚本中添加一条语句，仅为该脚本设置错误报告级别。在脚本开头添加以下语句：`error_reporting(*errorSetting)`。\n\
  \n例如，要查看除严格模式以外的所有错误，请使用：`error_reporting(E_ALL)`。\n\n### 抑制单个错误消息\n\n你可以在 PHP 语句中停止对单个错误消息的显示。通常情况下，这不是一个好主意。你想看到错误消息并修复问题。然而，偶尔抑制单个通知（notice）是防止难看的消息显示在\
  \ Web 页面上的简单方法。\n\n你可以在预期生成错误消息的地方放置一个 符号（`@`）来停止错误消息的显示。例如，以下语句中的 `@` 会抑制错误消息：\n\
  \n```\necho @$news1;\n```\n\n如果变量 `$news1` 之前未被设置，此此语句将产生以下通知：\n\n`Notice: Undefined\
  \ variable: news1 in C:\\Program Files\\Apache Group\\Apache2\\htdocs\\PHPandMySQL\\\
  info.php on line 10`\n\n然而，变量名前的 `@` 阻止了通知的显示。此功能应该极少使用，但在某些情况下它是很有用的。\n\n### 记录错误消息\n\
  \n你可以将错误消息存储在日志文件中。这会产生错误的永久记录，无论它们是否显示在 Web 页面上。记录消息需要两个设置：\n\n- `log_errors`：将其设置为\
  \ `on` 或 `off` 以将错误发送到日志文件。\n- `error_log`：指定要记录错误的文件名。\n\n你可以通过 `php.ini` 中的设置告诉\
  \ PHP 记录错误。找到以下设置：\n\n`log_errors = Off`\n\n将设置改为 `On`。在保存修改后的 `php.ini` 文件并重启你的\
  \ Web 服务器后，PHP 将错误记录到文本文件中。你可以通过下一节描述的 `error_log` 设置告诉 PHP 将错误发送到何处。如果你不在 `error_log`\
  \ 设置中指定文件，错误消息将写入 Apache 错误日志，该日志位于 Apache 安装目录下的 `logs` 子目录。错误日志具有 `.err` 文件扩展名。\n\
  \n你可以通过在脚本开头包含以下语句来为单个脚本记录错误：\n\n`ini_set(\"log_errors\",\"On\")`\n\n此语句仅为此脚本设置错误日志。\n\
  \n### 指定日志文件\n\n你通过 `php.ini` 中的设置来指定 PHP 记录错误消息的文件。找到该设置：\n\n`;error_log = filename`\n\
  \n删除行开头的分号。将 `filename` 替换为你想要让 PHP 记录错误消息的文件路径/文件名，例如：\n\n`error_log = \"c:\\php\\\
  logs\\errs.log\"`\n\n你指定的文件不需要存在。如果不存在，PHP 将创建它。\n\n在保存编辑后的 `php.ini` 文件并重启你的 Web\
  \ 服务器后，错误消息将记录在指定文件中。每条错误消息单独占一行，行开头是日期和时间。\n\n你可以通过在脚本开头包含以下语句为单个脚本指定日志文件：\n\n\
  `ini_set(\"error_log\",\" \"c:\\php\\logs\\errs.log \")`\n\n此语句仅为该脚本设置日志文件。\n\n\
  ### 在你的 PHP 脚本中添加注释\n\n`Comments`（注释）是嵌入在脚本本身的注记。在脚本中添加描述其用途和功能的说明性注释是关重要的。这对于“彩票因素”（lottery\
  \ factor）来说很重要——也就是说，如果你中了大奖并逃往法国蔚埃尔海岸过奢华的生活，将有其他人来完成这项工作。新人员需要知道你的脚本应该做什么以及它是如何工作的。实际上，注释对你也有好处。明年你可能需要修改脚本，因为那些细节早已深埋在脑中，被更近的项目所覆盖。\n\
  \n尽情使用注释。PHP 会忽略注释；注释是给人类看的。\n\n只要你告诉 PHP 它们是注释，你可以在脚本的任何地方嵌入注释。注释的格式为：\n\n```\n\
  /* 注释文本\n更多注释文本 */\n```\n\n你的注释可以根据需要变得很长，也可以很短。当 PHP 看到指示注释开始的代码（`/*`）时，它会忽略之后的所有内容，直到看到指示注释结束的代码（`*/`）。\n\
  \n每个脚本开始处的一种可能的注释格式如下：\n\n```\n/* name: catalog.php\n* description: 一个显示产品\n* 描述的脚本。描述存储在\n\
  * 数据库中。产品描述\n* 根据用户在表单中输入的类别\n* 从数据库中选择出来。\n* 作者: Lola Designer\n* 创建: 2/1/06\n\
  * 修改: 3/15/06\n*/\n```\n\n你应该在整个脚本中使用注释来描述脚本的功能。当脚本语句复杂时，注释尤为重要。经常使用如下注释：\n\n```\n\
  /* 从数据库获取信息 */\n/* 检查客户是否年满 18 岁 */\n/* 将运费添加到订单总额 */\n```\n\nPHP 还有短注释格式。你可以通过井号（`#`）或双正斜杠（`//`）来指定单行作为注释，方式如下：\n\
  \n```\n# 这是注释行 1\n// 这是注释行 2\n```\n\n\n\n将忽略从 `#` 或 `//` 到行尾的所有内容。这对于注释特定的语句非常有用，如下例所示：`$average\
  \ = $orderTotal/$nItems; // 计算平均价格` 有时你想强调某条注释。下面的格式可以让注释非常醒目：\n\n######################################\n\
  \n## 检查此章节 ##\n\n######################################\n\nPHP 注释不会包含在发送到用户浏览器的\
  \ HTML 代码中。用户看不到这些注释。\n\n在脚本中尽可能根据需要使用注释，以使其逻辑清晰。然而，使用过多的注释是一个错误。不要对脚本中的每一行或你所做的每件事都进行注释。如果你的脚本中满了注释，重要的注释可能会在迷宫中丢失。使用注释来标记章节并解释异常或复杂的代码——而不是显而易见的代码。\n\
  \n## 第 2 章：构建 PHP 脚本\n\n### 本章内容\n\n- 在代码中设置条件\n- 使用条件语句\n- 构建并使用循环处理重复语句\n- 使用函数\n\
  - 保持代码的整洁和有序\n\nPHP 脚本是文件中的一系列指令，该文件具有特定的扩展名，告诉 Web 服务器在文件中查找 PHP 部分。（扩展名通常是 `.php`\
  \ 或 `.phtml`，但可以是 Web 服务器配置的任何类型。）PHP 从文件顶部开始，并按照出现的顺序执行每条指令。\n\n指令被称为 `statements`，可以是简单的也可以是复杂的。本教程第\
  \ 1 章讨论了简单语句，例如 `echo` 语句。例如，本书第 1 章中的 Hello World 脚本是一个包含简单语句的简单脚本。然而，组成 Web 数据库应用程序的脚本并没有那么简单。它们是动态的，并与用户和数据库交互。因此，脚本需要更复杂的语句。\n\
  \n复杂语句执行一个或多个语句块。语句块（`block`）由用大括号 `{` 和 `}` 包围的一组简单语句组成。PHP 会读取整个复杂语句，不会在遇到第一个分号时停止。PHP\
  \ 知道要期待一个或多个块，并在复杂语句中寻找最后一个块的结束大括号。\n\n本章描述了以下复杂语句：\n\n- **条件语句（Conditional statements）：**\
  \ 只有在满足特定条件时才执行的语句。PHP 条件语句是 `if` 和 `switch` 语句。\n- **循环（Loops）：** 重复执行语句块的语句。三种类型的循环是\
  \ `for`、`while` 和 `do..while` 循环。\n- **函数（Functions）：** 可以多次重用的语句。应用程序的多个部分执行许多任务。PHP\
  \ 允许你通过创建 `function` 来重用语句块。\n\n## 设置条件\n\n条件语句和循环根据条件执行语句块。也就是说，如果条件为真，则执行语句块。\n\
  \n因此，要使用条件语句和循环，你需要设置条件。\n\n在本章中你将了解到如何使用复杂语句以及如何将它们组织成 PHP 脚本。\n\n### 条件\n\n`Conditions`（条件）是\
  \ PHP 测试或评估的表达式，以判断它们为真为假。条件用于复杂语句，以确定是否应该执行简单语句块。要设置条件，你需要比较值。以下是一些你可以用来比较值（以确定条件）的问题：\n\
  \n- **两个值相等吗？** Sally 的姓和 Bobby 的姓相同吗？或者，Nick 是 15 岁吗？（Nick 的年龄等于 15 吗？）\n- **一个值比另一个值大还是小？**\
  \ Nick 比 Bobby 幼吗？或者，Sally 的房子价格超过了一百万美元吗？\n- **字符串是否匹配模式？** Bobby 的名字是以 `S` 开头的吗？邮政编码是否有五个数字字符？\n\
  \n你也可以设置包含两个或更多问题的条件。例如，你可能会问：Nick 比 Bobby 大吗且 Nick 比 Sally 小吗？或者你可能会问：今天是星期日且晴天吗？或者你可能会问：今天是星期日还是星期一？\n\
  \n### 比较值\n\n你可以比较数字或字符串以查看它们是否相等、一个是否大于另一个，或者是否不等。你使用比较运算符比较值。PHP 评估比较并返回真或假。例如，以下是一个简单的比较：`$result\
  \ = $a == $b;`\n\n比较运算符 `==` 检查两个值是否相等。如果 `$a` 和 `$b` 相等，则给 `$result` 赋值布尔值 `true`。如果\
  \ `$a` 和 `$b` 不相等，则给 `$result` 赋值 `false`。因此，`$a == $b` 是一个简单的真条件。\n\nPHP 提供了几种你可以用于比较值的比较运算符。表\
  \ 2-1 显示了这些比较运算符。\n\n**表 2-1：比较运算符**\n\n| 运算符 | 含义 |\n| :--- | :--- |\n| `==` |\
  \ 两个值的值相等吗？ |\n| `===` | 两个值的值和数据类型都相等吗？ |\n| `>` | 第一个值大于第二个值吗？ |\n| `>=` | 第一个值大于或等于第二个值吗？\
  \ |\n| `<` | 第一个值小于第二个值吗？ |\n| `<=` | 第一个值小于或等于第二个值吗？ |\n| `!=` , `<>` | 两个值的值互不相等吗？\
  \ |\n| `!==` | 两个值的值或数据类型均不相等吗？ |\n\n你可以同时比较数字和字符串。字符串按字母顺序进行比较，所有大写字母都在小写字母之前。\n\
  \n你也可以设置包含两个或更多问题的条件。例如，你可能会问：Nick 比 Bobby 大吗且 Nick 比 Sally 小吗？\n\n字符串按字母顺序比较，大写字母在小写字母之前。\n\
  \n例如，`SS` 在 `Sa` 之前。标点符号也有顺序，可以发现一个字符比另一个字符大。\n\n然而，比较逗号和句号并没有太大意义。\n\n字符串根据其 `ASCII`\
  \ 码进行比较。在 `ASCII` 字符集中，每个字符都被分配了一个 0 到 127 之间的数字。比较字符串时，根据此代码进行。例如，代表逗号的数字是 44。句号对应\
  \ 46。因此，如果比较句号和逗号，句号被评估更大。\n\n以下是 PHP 可以测试判断为真的有效比较：\n\n- `$a == $b`\n- `$age !=\
  \ 21`\n- `$ageNick < $ageBobby`\n- `$house_price >= 1000000`\n\n检查两个值是否相同的比较运算符由两个等号组成\
  \ (`==`)。最常见的错误之一是使用等号。单个等号是将值放入变量。因此，像 `if ($weather = “raining”)` 语句会将 `$weather`\
  \ 设置为 raining 而不是检查它是否等于 raining，并且始终为真。\n\n如果你写一个否定（使用 `!`），则否定条件为真。查看以下比较：\n\n\
  `$age != 21`\n\n测试的条件是 `$age` 不等于 21。因此，如果 `$age` 等于 20，则比较为真。\n\n### 检查变量内容\n\n\
  有时你只需要知道变量是否存在或变量中包含的是什么类型的数据。这里是一些测试变量的常用方法：\n\n- `isset($varName)`：如果变量已设置（即使其中没有存储内容），也为真。\n\
  - `empty($varName)`：如果值为 0 或是不含字符的字符串或未设置，则为真。\n\n你还可以测试变量中包含的是什么类型的数据。例如，要查看该值是否为整数，可以使用以下：\n\
  \n```\nis_int($number)\n```\n\n\n\n\n如果 `$number` 中的值是一个整数，则该比较为真。PHP 提供的其他测试如下：\n\
  \n✦ `is_array($var2)`: 检查 `$var2` 是否为数组\n\n✦ `is_float($number)`: 检查 `$number` 是否为浮点数\n\
  \n✦ `is_null($var1)`: 检查 `$var1` 是否等于 0\n\n✦ `is_numeric($string)`: 检查 `$string`\
  \ 是否为数字字符串\n\n✦ `is_string($string)`: 检查 `$string` 是否为字符串。你也可以通过在表达式前面使用感叹号（`!`）来测试否定情况。例如，如果变量完全不存在，则述语句将返回真：\n\
  \n```php\n!isset($*varname*)\n```\n\n## 设置条件\n\n## 使用正则表达式进行模式匹配\n\n有时，你需要比较字符字符串以查看它们是否符合某些特征，而不是为了查看它们是否匹配精确的值。\n\
  \n例如，你可能想要识别以 `S` 开头的字符串或包含数字的字符串。对于这类比较，你将字符串与一个模式进行比较。这些模式被称为`正则表达式`。\n\n你可能在过去用过某种形式的模式匹配。当你在搜索文件时使用星号（`*`）作为通配符（例如\
  \ `dir ex\\*.doc`），你就是在模式匹配。例如，`ex\\*.txt` 就是一个模式。\n\n任何以 `ex` 开头并 `.txt` 结尾且 `ex`\
  \ 和 `.txt` 之间包含任何字符的字符串都匹配该模式。字符串 `exam.txt`、`ex33.txt` 和 `ex3x4.txt` 都匹配该模式。使用正则表达式只是使用通配符的一种更强大的变体。\n\
  \n### 构建 PHP\n\n模式匹配的一种常见用途是检查来自 Web 表单的输入。如果不符合特定模式，可能不是你想存储在数据库中的内容。例如，如果用户在表单中输入了\
  \ ZIP 编码，你就知道格式需要是五个数字或 ZIP + 4。因此，你可以检查输入以查看其是否符合模式。如果不符合，你就知道它不是有效的 ZIP 编码，可以要求用户输入正确的信息。\n\
  \n正则表达式用于许多情况下的模式匹配。许多 Linux 命令（如 `grep`、`vi` 或 `sed`）使用正则表达式。许多应用程序（如文本编辑器和文字处理器）允许使用正则表达式进行搜索。\n\
  \nPHP 支持兼容 Perl 的正则表达式（PCRE）。以下章节描述了一些基础的兼容 Perl 的正则表达式，但也可以实现更复杂、更强大的模式匹配。请参 `www.php.net/manual/en/reference.pcre.pattern.syntax.php`\
  \ 获取更多关于兼容 Perl 的正则表达式的说明。\n\n### 在模式中使用特殊字符\n\n模式由字面字符和特殊字符组成。字面字符是普通字符，没有特殊含义。例如，`e`\
  \ 就是 `e`，除了它是字母表中 26 个字母之一外没有其他含义。\n\n另一方面，特殊字符在模式中具有特殊含义，例如用作通配符的星号（`*`）。表 2-2\
  \ 显示了你可以在模式中使用的特殊字符。\n\n### 表 2-2：模式中使用的特殊字符\n\n| 字符 | 含义 | 示例 | 匹配 | 不匹配 |\n|---\
  \ |--- |--- |--- |--- |\n| `^` | 行首。 | `^c` | cat | my cat |\n| `$` | 行尾。 | `c$`\
  \ | tic | stick |\n| `.` | 任意单个字符。 | `..` | 任何包含至少两个字符的字符串 |\n| `?` | 前一个字符是可选的。\
  \ | `mea?n` | mean, men | moan |\n| `( )` | 将字面字符分组必须精确匹配的字符串。 | `m(ea)n` | mean\
  \ | men, mn |\n| `\\[ \\]` | 包围一组可选的字面字符。 | `m\\[ea\\]n` | men, man | mean, mn |\n\
  | `\\-` | 代表两个字符之间的所有字符。 | `m\\[a-c\\]n` | man, mbn, mcn | mdn, mun, maan |\n| `+`\
  \ | 前一个项目的一个次或多次。 | `[1-3]+` | door111, door131 | door, door55 |\n| `*` | 前一个项目的零次或多次。\
  \ | `[1-3]*` | door, door311 | door4, door445 |\n| `{ , }` | 重复范围的起始和结束数字。 | `a{2,5}`\
  \ | aa, aaaaa | a, xx3 |\n| `\\\\` | 后的字符是字面量。 | `m\\\\*n` | m\\*n | men, mean |\n\
  | `( \\| \\| )` | 一组备字符串。 | `(Tom|Tommy)` | Tom, Tommy | Thomas, To Tommy |\n\n\
  ## 考虑一些示例模式\n\n字面字符和特殊字符组合成模式，有时是长而复杂的模式。将字符串与模式进行比较，如果匹配，则比较为真。以下是一些示例模式，并对模式进行了拆解，以及一些示例匹配和不匹配的字符串。\n\
  \n### 示例 1\n```text\n^\\[A-Za-z\\].*\n```\n此模式定义了以字母开头的字符串。\n- `^\\[A-Za-z\\]`:\
  \ 模式的第一部分规定字符串以字母开头。\n- `\\.`: 模式的第二部分告诉 PHP 寻找字面上的点。\n- `*`: 匹配任何包含一个或多个字符的字符串。\n\
  \n### 示例 2\n```text\nDear(Tom|Tommy)\n```\n此模式定义了具有两个部分的字符串：\n- `Dear`: 模式的第一部分只是字面量。\n\
  - `(Tom|Tommy)`: 第二部分定义了 Tom 或 Tommy。\n表达式 `Dear(Tom|Tommy)` 匹配以下字符串：`Dear Tom`\
  \ 和 `Dear Tommy`。\n表达式 `Dear(Tom|Tommy)` 不匹配以下字符串：`Dear Tommys`（等等，原文有错误/断开，但遵循逻辑）。\n\
  \n### 示例 3\n```text\n^\\[0-9\\]{5}(\\-[0-9\\]{4})?\n```\n此模式定义了任何 ZIP 编码并包含几个部分：\n\
  - `^\\[0-9\\]{5}`: 模式的第一部分描述了任何五个数字的字符串。\n- `\\-`: 斜杠表示连字符是字面量。\n- `\\[0-9\\]{4}`:\
  \ 模式的部分告诉 PHP 接下来的字符应该是四个数字。\n- `( )`: 这些字符将最后部分分组并使其变为可选。\n表达式 `^\\[0-9\\]{5}(\\\
  -[0-9\\]{4})?` 匹配以下字符串：`90001` 和 `90002-4323`。\n表达式 `^\\[0-9\\]{5}(\\-[0-9\\]{4})?`\
  \ 不匹配以下字符串：`9001` 和 `12-4321`。\n\n### 示例 4\n```text\n^.+@\\.com$\n```\n此模式定义了任何嵌入\
  \ @ 并以 .com 结尾的字符串。换句话说，它定义了电子邮件的格式。此表达式包含几个部分：\n- `^.+`: 模式的第一部分描述了 `@` 之前的任何一个或多个字符。\n\
  - `@`: 这是字面上的 `@` 符号。@` 不是特殊字符，前面不需要加 `\\`。\n- `.+`: 这是任何一个或多个字符的字符串。\n- `\\.`:\
  \ 斜杠表示 PHP 应寻找字面上的点。\n- `com$`: 定义了结尾的字面字符串 `com`，`$` 表示字符串的结束。\n表达式 `^.+@\\.com$`\
  \ 匹配以下字符串：`you@yourcompany.com` 和 `johndoe@somedomain.com`。\n表达式 `^.+@\\.com$` 不匹配以下字符串：`you@yourcompany.net`、`you@.com`\
  \ 和 `@you.com`。\n\n## 使用 PHP 函数进行模式匹配\n\n你可以使用 `preg_match` 函数来比较模式是否匹配字符串。通用格式如下：\n\
  \n```php\npreg_match(\"pattern\", value);\n```\n\n模式必须封装在一对*分隔符*（delimiters）中——封装模式的字符。通常使用正斜杠（`/`）作为分隔符。\n\
  \n\n\n\n然而，你可以使用任何非字母数字字符，反斜杠（`\\`）除外。例如，为了检查用户在表单中输入的名称，可以将模式与名称（存储在变量 `$name`\
  \ 中）进行匹配，如下：\n\n```\npreg_match(\"/^[A-Za-z’ -]++$/\",$name)\n```\n\n## 设置条件\n\n\
  该语句中的模式执行以下操作：\n\n- ✦ 用正斜杠（`/`）括围模式。\n- ✦ 使用 `^` 和 `$` 分别表示字符串的开始和结束。这意味着字符串中的所有字符都必须匹配该模式。\n\
  - ✦ 用 `[]` 括围字符串中允许的所有字面字符。不允许出现其他字符。允许的字符包括大写和小写字母、单引号（`’`）、空格和连字符（`-`）。\n\n你可以通过在\
  \ `[]` 内部使用连字符来指定字符范围。\n\n当你这样做时（例如 `A-Z`），连字符并不代表字面字符。由于你也想将连字符作为允许的字符串字面字符包含在内内，你需要添加一个不位于任何两个字符之间的连字符。在这种情况下，连字符包含在字面字符列表的末尾。\n\
  \n## 构建 PHP 脚本\n\n- ✦ 在 `[]` 中的字面字符列表后跟一个 `+`。加号表示字符串可以包含 `[]` 内任意数量的字符，但必须包含一个字符。\n\
  \n如果模式本身包含正斜杠，则分隔符不能是正斜杠。你必须使用另一个字符作为分隔符，例如：\n\n```\npreg_match(\"#^[A-Za-z’ -/]++$#\"\
  ,$name)\n```\n\n## 连接多个比较\n\n通常你需要询问一个一个问题来确定你的条件。例如，假设你的公司为不同的产品提供不同语言的目录。你需要知道客户想看哪种类型的目录*以及*他或她需要用什么语言查看。这需要你连接比较，其通用格式如下：\n\
  \n`comparison1` and|or|xor `comparison2` and|or|xor `comparison3` and|or|xor ...`\n\
  \n比较通过以下三个单词之一进行连接：\n\n- ✦ `and`: 两个比较都为真。\n- ✦ `or`: 比较中的一个或两个都为真。\n- ✦ `xor`:\
  \ 比较中的一个为真，但不同两个为真。\n\n### 表 2-3: 多重比较\n\n| 条件 | 如果 . . . 则为真 |\n| :--- | :--- |\n\
  | `$ageBobby == 21 or $ageBobby == 22` | Bobby 年龄为 21 或 22 岁。 |\n| `$ageSally >\
  \ 29 and $state ==“OR”` | Sally 大于 29 岁且住在俄勒冈州。 |\n| `$ageSally > 29 or $state ==\
  \ “OR”` | Sally 大于 29 岁或住在俄勒冈州或两者都是。 |\n| `$city == “Reno” xor $state == “OR”` |\
  \ 城市是里诺或州是俄勒冈州，但不同时满足。 |\n| `$name != “Sam” and $age < 13` | 名称不是 Sam 且年龄小于 13 岁。\
  \ |\n\n你可以根据需要串联任意数量的比较。使用 `and` 的比较首先测试，使用 `xor` 的比较接着测试，最后测试 `or` 的比较。例如，以下条件包含了三个比较：\n\
  \n```\n$resCity == “Reno” or $resState == “NV” and $name == “Sally”\n```\n\n如果客户的名字是\
  \ Sally 且她住在 NV，则该语句为真。如果她住在 Reno，无论她的名字是什么，该语句也为真。\n\n如果她住在 NV 但名字不是 Sally，则该条件不成立。你得到这些结果是因为脚本按照以下顺序检查条件：\n\
  \n1. 比较 `and`。脚本检查 `$resState` 查看是否等于 `NV`，并检查 `$name` 查看其是否等于 `Sally`。如果两者都匹配，则条件为真，脚本不需要检查\
  \ `or`。如果变量中只有一个或两个都不等于指定值，则继续测试。\n2. 比较 `or`。脚本检查 `$resCity` 查看其是否等于 `Reno`。如果是，则条件为真。如果不是，则条件为假。\n\
  \n你可以通过括号来改变比较的顺序。括号内的连接词首先求值。例如，你可以用括号重重写之前的语句：\n\n```\n($resCity == “Reno or $resState\
  \ == “NV”) and $name == “Sally”\n```\n\n# 使用条件语句\n\n括号改变了检查条件的顺序。现在 `or` 首先被检查，因为它在括号内。如果客户的名字是\
  \ Sally 且她住在 Reno 或 NV 之一，则该条件语句为真。你得到这些结果是因为脚本按如下方式检查条件：\n\n1. 比较 `or`。脚本检查 `$resCity`\
  \ 是否等于 `Reno` 或 `$resState` 是否等于 `NV`。如果不是，整个条件为假，测试停止。如果是，则条件的这一部分为真。然而，`and` 另一侧的比较也必须为真，因此测试继续。\n\
  2. 比较 `and`。\n\n[content]\n如果客户的名字是 Sally 且她住在 Reno 或 NV 之一，则该条件语句为真。（*注：原文示例代码中括号内似乎漏了一个引号，翻译时遵循原文逻辑或根据上下文修正，此处保持结构逻辑*）\n\
  \n```\n($resCity == “Reno or $resState == “NV”) and $name == “Sally”\n```\n（注：此处原文代码\
  \ `Reno or` 似乎存在引号错误，翻译保留原意并结构）\n\n# 使用条件语句\n\n括号改变了检查条件的顺序。现在 `or` 首先被检查，因为它在括号内。如果客户的名字是\
  \ Sally 且她住在 Reno 或 NV 之一，则该条件语句为真。你得到这些结果是因为脚本按如下方式检查条件：\n\n1. 比较 `or`。脚本检查 `$resCity`\
  \ 是否等于 `Reno` 或 `$resState` 是否等于 `NV`。如果不是，整个条件为假，测试停止。如果是，则条件的这一部分为真。然而，`and` 另一侧的比较也必须为真，因此测试继续。\n\
  2. 比较 `and`。\n\n（注：由于原文文本在结尾处出现了重复，我已根据高级工程师逻辑进行了去重和整合，确保不重复且逻辑完整。）\n\n---\n**由于你提供的原始文本在最后一段“Using\
