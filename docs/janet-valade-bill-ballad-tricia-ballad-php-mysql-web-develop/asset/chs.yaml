  \n创建一个允许客户上传文件的表单\n\n有时你想从用户那里接收整个信息文件，例如求职网站的个人简历或相册网站的图片。或者，假设你正在根据销售部门提供信息构建目录。除了产品的描述文字外，你还希望销售部门提供产品图片。你可以提供一个供销售部门用于上传图像文件的表单。\n\
  \n\n\n\n\n# 使用表单上传文件\n\n你可以使用为该目的设计的 HTML 表单来显示一个允许用户上传文件的表单。表单的通用格式如下：\n\n```html\n\
  <form enctype=\"multipart/form-data\" action=\"processfile.php\" method=\"POST\"\
  >\n<input type=\"hidden\" name=\"MAX_FILE_SIZE\" value=\"30000\" />\n<input type=\"\
  file\" name=\"user_file\" />\n<input type=\"submit\" value=\"Upload File\" />\n\
  </form>\n```\n\n注意关于表单的以下几点：\n\n- `<form>` 标签中使用了 `enctype` 属性。在上传文件时，必须将此属性设置为\
  \ `multipart/form-data` 以确保文件正确到达。\n- 表单中包含一个隐藏字段，用于发送 `MAX_FILE_SIZE` 的值（字节为单位）。如果用户尝试上传大于此值的文件，则将无法上传。你可以将此值设置得高达\
  \ 2MB。如果你需要上传大于 2MB 的文件，必须在向隐藏字段发送大于 2MB 的 `MAX_FILE_SIZE` 之前，先在 `php.ini` 中将 `upload_max_filesize`\
  \ 的默认设置改为较大的数字。\n- 用于上传文件的输入字段类型为 `file`。注意该字段有一个名称 —— `user_file` —— 正表单中其他类型的字段一样。\n\
  \n用户在表单中输入的文件名会被发送到处理脚本，并可以在内置数组 `FILES` 中可用。我们将在接下来的章节中解释 `FILES` 的结构和信息。\n\n##\
  \ 创建一个允许客户上传文件的表单\n\n当用户提交表单时，文件会被上传到临时位置。脚本需要将文件复制到另一个位置，因为临时文件在脚本完成后就会被删除。\n\n\
  ### 处理上传的文件\n\n关于上传文件的信息存储在 PHP 内置数组 `$_FILES` 中。对于每个上传的文件，都有一个信息数组，导致 `$_FILES`\
  \ 成为多维数组。与任何其他表单一样，你可以通过字段名称从数组中获取信息。以下是每个上传文件从 `$_FILES` 中获取的数组：\n\n```text\n$_FILES['fieldname']['name']\n\
  $_FILES['fieldname']['type']\n$_FILES['fieldname']['tmp_name']\n$_FILES['fieldname']['size']\n\
  ```\n\n例如，假设你使用上一节所示的以下字段来上传文件：\n\n```html\n<input type=\"file\" name=\"user_file\"\
  \ />\n```\n\n如果用户在表单中上传了一个名为 `test.txt` 的文件，处理脚本使用的生成的数组看起来如下：\n\n```text\n$_FILES['user_file']['name']\
  \ = test.txt\n$_FILES['user_file']['type'] = text/plain\n$_FILES['user_file']['tmp_name']\
  \ = D:\\WINNT\\php92C.tmp\n$_FILES['user_file']['size'] = 435\n```\n\n在此数组中，`name`\
  \ 是被上传的文件名，`type` 是文件类型，`tmp_name` 是临时文件的路径/文件名，而 `435` 是文件的大小。注意 `name` 仅包含文件名，但\
  \ `tmp_name` 包含了文件的路径以及文件名。如果文件太大无法上传，数组中的 `tmp_name` 将被设置为 `none`，且 `size` 被设置为\
  \ `0`。\n\n处理脚本必须将上传的文件从临时位置移动到永久位置。移动文件的语句的通用格式如下：\n\n```php\nmove_uploaded_file(path/tempfilename,\
  \ path/permfilename);\n```\n\n`path/tempfilename` 可于内置数组 `$_FILES['fieldname']['tmp_file']`。`path/permfilename`\
  \ 是你想要存储文件的路径。以下语句移动了本节之前所示的名为 `user_file` 的输入字段中上传的文件：\n\n```php\nmove_uploaded_file($_FILES['user_file']['tmp_name'],\
  \ 'c:\\data\\new_file.txt');\n```\n\n目标目录（例如 `c:\\data`）必须在文件移动到其之前已经存在。此语句不会创建目标目录。上传文件时可能会出现安全问题。允许陌生人将文件加载到你的计算机上是有风险的；可能存在恶意文件。你希望在文件上传后尽可能从多个因素检查文件，使用条件语句检查文件特征，例如预期的\
  \ `type` 和 `size`。在某些情况下，为了更高的安全性，将文件名更改为其他内容可能是一个好主意，这样用户就不知道他们的文件在哪里或它们被称什么。\n\
  \n## 整合\n\n本节提供了一个允许用户上传文件的脚本。该脚本为用户显示一个用于上传文件的表单，保存上传的文件，并在文件成功上传后显示消息。用户用于上传文件的表单存储在文件\
  \ `form_upload.inc` 中，如列表 1-14 所示。\n\n### 列表 1-14：显示上传表单的文件\n\n```html\n<!-- Program\
  \ Name: form_upload.inc\n Description: 显示一个用于上传文件的表单 -->\n<html>\n<head><title>File\
  \ Upload</title></head>\n<body>\n<ol>\n<li>输入要上传的文件名，或使用浏览按钮导航到文件。</li>\n<li>当文件路径显示在文本框中时点击。</li>\n\
  </ol>\n<div style='text-align: center'><hr />\n<form enctype=\"multipart/form-data\"\
  \ action=\"<?php echo $_SERVER['PHP_SELF']; ?>\" method=\"POST\">\n<p><input type=\"\
  hidden\" name=\"MAX_FILE_SIZE\" value=\"500000\" />\n<input type=\"file\" name=\"\
  pix\" size=\"60\" /></p>\n<p><input type=\"submit\" name=\"Upload\" value=\"Upload\
  \ File\" /></p>\n</form>\n</div>\n</body>\n</html>\n```\n\n该文件在 `<form>` 标签中包含了\
  \ `enctype` 属性，并将 `MAX_FILE_SIZE` 设置为 `500000`。显示表单的网页如图 1-13 所示。\n\n**图 1-13：**\
  \ 由列表 1-14 代码产生的上传表单。\n\n列表 1-14 代码产生的表单允许用户选择文件。处理上传文件的 PHP 脚本如列表 1-15 所示。该脚本。\n\
  \n### 列表 1-15：通过 POST 表单上传文件\n\n```php\n<?php\n/* 脚本名: fileUpload.php\n * 说明：通过\
  \ HTTP POST 表单上传文件。\n */\nif(!isset($_POST['Upload'])) {\n    include(\"form_upload.inc\"\
  );\n}\nelse {\n    if($_FILES['pix']['tmp_name'] == \"none\") {\n        echo \"\
  <p style='font-weight: bold'>文件上传失败。请检查文件大小。文件必须小于 500K。</p>\";\n        include(\"\
  form_upload.inc\");\n        exit();\n    }\n    if(!preg_match(\"/image/\",$_FILES['pix']['type']))\
  \ {\n        echo \"<p style='font-weight: bold;'>文件不是图片。请尝试其他文件。</p>\";\n     \
  \   include(\"form_upload.inc\");\n        exit();\n    }\n    \n    else {\n  \
  \      $destination='c:\\data'.\"\\\\\\\\\".$_FILES['pix']['name'];\n        $temp_file\
  \ = $_FILES['pix']['tmp_name'];\n        move_uploaded_file($temp_file,$destination);\n\
  \        echo \"<p style='font-weight: bold'>文件已成功上传：{$_FILES['pix']['name']} ({$_FILES['pix']['size']})</p>\"\
  ;\n    }\n}\n?>\n```\n\n\n\n\n\n# 第 2 章：创建信息\n\n## 在网页上获取信息\n\n最简单的 Web 应用程序通过 HTML\
  \ 表单从用户收集信息，然后通过显示、存储或在条件语句中使用这些信息。然而，动态 Web 应用程序比这要复杂得多。例如，购物车必须收集不同类型的信息；显示这些信息；跟踪用户订购的内容；计算价格和运费；扣除信用卡；以及执行其他任务。此类复杂的应用程序由多个共享信息的脚本组成。然而，Web\
  \ 页面上的信息共享并不是自动的。HTML 页面是无状态的。也就是说，HTML 页面之间是相互独立的。当用户点击链接时，Web 服务器会向浏览器发送一个新页面，但浏览器对上一个页面一无所知。在浏览器看来，这可能是世界历史上第一个页面。对于用户仅查看文档的静态页面，无状态机制运行良好。但是，许多动态应用程序需要将信息从一个\
  \ Web 页面传递到另一个页面。例如，你可能想要保存用户的姓名，然后在另一个页面上显示它。\n\n本章将讨论在网页之间跳转以及在网页之间传递信息的基础知识。\n\
  \n## 导航多页网站\n\n大多数网站都包含多个页面。静态多页网站提供了一个由链接（有时看起来像按钮）组成的导航系统，用户点击这些链接可以在网站中移动并找到所需的页面。动态\
  \ Web 页面可以使用链接从一个页面移动到另一个页面，但也会使用额外的方法。PHP 脚本中使用以下方法将用户从网站的某一个页面移动到另一个页面：\n\n- **输出链接**：当用户点击链接时，链接会将用户引导到新页面。\n\
  - **使用表单**：当用户点击提交按钮时，表单将用户从一个页面移动到另一个页面。当用户点击提交按钮时，会执行显示新页面的 PHP 脚本。\n- **重定向用户**：PHP\
  \ 提供了 `header()` 函数，不需要用户操作即可将其进入新页面。\n\n### 输出链接\n\n使用 PHP，你可以 `echo` HTML 链接，用户随后可以点击这些链接查看网站中的各种页面。这与输出任何其他\
  \ HTML 代码没有区别。只需发送链接的 HTML 代码即可，例如：\n\n```php\necho \"<<a href='newpage.php'>New\
  \ Page</a>\";\n```\n\n### 使用表单\n\n你还可以使用 HTML 表单来显示另一个页面。`form` 标签指定了用户点击提交按钮时运行的脚本。该脚本可以显示新页面。（显示和处理表单将在本教程的第\
  \ 1 章中详细描述。）\n\n你还可以使用表单将用户移动到新页面，而不收集任何信息。你可以定义一个没有字段、只有一个提交按钮的表单。当用户点击按钮时，就会显示新页面。例如，你可能想为用户提供一个标记为“取消”或“下一步”的按钮来点击，即使你不想从用户那里收集任何信息。列表\
  \ 2-1 所示脚本显示了一个仅包含提交按钮的表单。\n\n**列表 2-1：显示无字段表单的脚本**\n\n```php\n<?php\n/*\n程序名称:\
  \ emptyForm.php\n描述: 显示一个没有字段的表单。\n*/\n?>\n<html>\n<head><title>Empty Form</title></head>\n\
  <body>\n<p>当您准备好查看下一个页面时，请点击下一步</p>\n<img src=\"index-542_1.jpg\">\n<form action=\"\
  newpage.php\" method=\"POST\">\n    <input type=\"submit\" value=\"Next\" style=\"\
  margin: .5in\" />\n</form>\n</body>\n</html>\n```\n\n图 2-1 显示了列表 2-1 中代码所显示的表单，没有任何字段，只有一个提交按钮。\n\
  \n### 使用 HTTP 头部重定向用户\n\nWeb 服务器和浏览器通过 HTTP 头部进行通信。*头部*是在浏览器和 Web 服务器之间发送的消息，包含了信息或请求。例如，当你在浏览器中输入\
  \ URL 时，浏览器会发送 HTTP 头部请求 Web 服务器发送指定的页面文件。PHP 提供了一个名为 `header()` 的函数，可以用它向 Web 服务器发送头部。你可以使用此函数向\
  \ Web 服务器发送 Location 头部。当 Web 服务器接收到 Location 头部时，它会将指定的页面文件发送给用户的浏览器。向用户发送新页面的函数格式如下：\n\
  \n```php\nheader(\"Location: URL\");\n```\n\nheader 语句向 Web 服务器发送消息 Location: URL。作为响应，位于\
  \ URL 的文件将被发送给用户。以下两个语句都是有效的 header 语句：\n\n```php\nheader(\"Location: newpage.php\"\
  );\nheader(\"Location: http://company.com/catalog/catalog.php\");\n```\n\n### 必须在输出之前的语句\n\
  \n某些 PHP 语句只能在向浏览器发送任何输出之前使用。本章中描述的所有 header 语句、`setcookie()` 语句和会话函数必须在发送任何输出之前。如果在发送输出后使用这些语句之一，可能会看到以下消息：\n\
  \n**Warning**: Cannot modify header information - headers already sent by (output\
  \ started at /test.php:2) in **/test.php** on line **3**\n\n该消息提供了文件名并指示了哪一行发送了之前的输出。或者你可能根本看不到任何消息；新页面可能根本不会出现。以下语句执行失败，因为头部消息不是第一个输出——在\
  \ header 语句之前有一个 HTML 部分：\n\n```php\n<body>\n<?php\nheader(\"Location: http://janetscompany.com\"\
  );\n?>\n</body>\n```\n\n\n\n\n如你所见，HTML `<body>` 标签是在头部 header 语句之前发送的。以下语句可以运行，尽管它们并没有太大意义，因为\
  \ HTML 行位于 header 语句之后——也就是说，在用户被带到另一个页面之后：\n\n```php\n<?php\nheader(“Location:\
  \ http://janetscompany.com”);\n?>\n\n<body>\n\n</body>\n```\n\n以下语句将执行失败：\n\n```php\n\
  <?php\nheader“Location: http://company.com”);\n?>\n\n<html>\n```\n\n这些语句失败的原因并不显而易见，但如果你仔细观察，你会发现在打开\
  \ PHP 标签之前有一个空格。这个空格会被输出到浏览器中，尽管生成的 Web 页面看起来是空的。因此，`header` 语句失败了，是因为在它之前已经有了输出。这种错误很常见且难以察觉。\n\
  \n`header` 函数有一个很大的局限性。`header` 语句只能在发送任何输出之前使用。你不能向 Web 页面 `echo` 输出（例如某些 HTML\
  \ 代码），然后在输出发送后，在脚本中间发送一条请求新页面的消息。`header` 语句并不是具有此限制的唯一 PHP 语句。请参侧边栏“必须在输出之前的语句”，以讨论\
  \ `header` 语句以及类似的必须在输出之前的其他语句。\n\n尽管有这些局限性，`header` 语句对于在不需要用户操作的情况下将用户移动到新页面非常有用。下面的示例了如何根据用户账户类型显示不同的页面：\n\
  \n```php\n<?php\nif($typeAcct == “admin”)\n{\n    header：“Location: AdminPage.php”);\n\
  }\nelse\n{\n    header：“Location: SiteHomePage.php”);\n}\n?>\n```\n\n这些语句运行一个脚本，为管理员账户的用户显示管理员页面，为其他用户显示普通页面。只要不发送输出，你可以在\
  \ `header` 函数之前放置任意数量的 PHP 语句。你不能在 `header` 之前放置任何 HTML 部分，因为 HTML 总是会被发送到浏览器。\n\
  \n# 从一个页面向下一个页面传递信息\n\n无论用户如何从一个页面跳转到另一个页面，你可能需要第一个页面的信息在下一个页面可用。通过 PHP，你可以通过以下方法之一在页面之间移动信息：\n\
  \n- **使用 HTML 表单传递信息：** 你可以在表单中传递信息。当你需要从用户那里收集信息时，这种方法最为合适。\n- **在 URL 中添加信息：**\
  \ 你可以在新页面 URL 的末尾添加特定信息。当你只需要传递少量信息时，这种方法最为合适。\n\n使用这些方法传递的信息会被传递到下一个页面。然而，如果用户去第三个页面，除非你再次使用这些方法从第二个页面传递到第三个页面，否则信息将不可用。如果你想让信息在多个\
  \ Web 页面上可用，可以将其存储在 cookie 或 session 中，这样它在任何 Web 页面都可用。这将在本章节后面讨论。\n\n## 从一个页面向下一个页面传递信息\n\
  \n### 在表单中传递信息\n\n当用户点击 HTML 表单中的提交按钮时，信息会被发送到 `<form>` 标签 `action` 属性指定的脚本。脚本可以将信息存储在\
  \ `$_POST` 或 `$_GET` 数组中。你可以使用表单中的隐藏字段从一个页面向下一个页面发送信息。\n\n### 在 URL 中添加信息\n\n将信息从一个页面移动到下一个页面的简单方法是将其添加到\
  \ URL 末。要在 URL 中添加变量，首先要在前面加一个问号（`?`）。以下示例都是使用 URL 的有效方式：\n\n```html\n<a href=\"\
  nextpage.php?age=14\">转到下一页</a>\n```\n\n### 在 URL 中添加变量\n\n你可以在 URL 中添加多个变量，用 ampersand（`&`）分隔每对变量。在前面的示例中，脚本\
  \ `nextpage.php` 可以使用以下代码显示传递给它的信息：\n\n```php\necho $_GET['city'] . \", \" . $_GET['state'];\n\
  ```\n\n输出是：Mall, CA\n\n## 在 URL 中添加信息的缺点\n\n在 URL 中传递信息很容易的，特别是对于少量信息而言。然而，这种方法存在一些缺点，包括一些安全问题（安全问题将在第四书中进行更详细讨论）。以下是你可能不想在\
  \ URL 中传递信息的原因：\n\n- **全世界都能看到它。** URL 显示在浏览器的地址栏中，这意味着你添加到 URL 中的信息也会被显示出来。如果信息需要安全性，你不希望它被这样公开显示。例如，如果你正在将密码从一个页面移动到下一个页面，你可能不想在\
  \ URL 中传递它。\n- **用户在 URL 中发送信息和你发送一样容易。** 例如，假设用户在登录你的限制性网站后，你在 URL 中添加了 `auth=yes`。在每个\
  \ Web 页面上，你检查 `$_GET['auth']` 是否等于 yes。如果是，你就允许用户查看 Web 页面。然而，任何用户都可以浏览器中输入 `http://www.yoursite.com/page.php?auth=yes`\
  \ 而无需登录即可进入。\n- **用户可以收藏 URL。** 你可能不希望用户保存添加到 URL 中的信息。\n- **URL 的长度是有限的。** 限制取决于不同的浏览器和浏览器版本，但限制总是存在的。因此，如果你正在传递大量信息，URL\
  \ 可能没有空间存放它们。\n\n### 一个向 URL 添加信息的登录应用程序\n\n一个常见的应用是登录页面，用户在移动到网站更深处之前必须输入用户 ID\
  \ 和密码。列表 2-3 中的脚本是一个登录脚本，它在数据库中检查用户密码。登录成功后，脚本会将用户名传递给下一个 Web 页面，该页面将通过名称欢迎用户。\n\
  \n登录脚本显示一个请求用户 ID 和密码的小表单。\n\n\n\n\n显示表单的文件如列表 2-2 所示。包含显示和处理登录表单逻辑的脚本如列表 2-3 所示。\n\
  \n![Image 81](img/index-547_1.jpg)\n\n### 从一个页面向另一个页面传递信息\n\n**列表 2-2：显示登录表单的文件**\n\
  \n```php\n<?php\n\n/* Program name: form_log.inc\n* Description: Displays a login\
  \ form.\n*/\n\nif(isset($message))\n{\n\necho $message;\n}\n\necho “<form action=’$_SERVER[PHP_SELF]’\n\
  method=’POST’ style=’margin: .5in’\\n\n<p><label for=’user_name’ style=’font-weight:\
  \ bold; padding-bottom: 1em’>User ID: </label>\n<input type=’text’ name=’user_name’\
  \ id=’user_name’\nvalue='$user_name’ />\\n</p>\n<p><label for=’password’ style=’\n\
  font-weight: bold’>Password: </label>\n<input type=’password’ name=’password’ id=’password’\n\
  value='$password’ />\\n</p>\n<p><input type=’submit’ value=’Log in’>\\n</p>\n<input\
  \ type=’hidden’ name=’sent’ value=’yes’ />\n</form>\\n”;\n?>\n```\n\n该表单显示了用户 ID\
  \ 和密码的两个字段。它还传递了一个名为 `sent` 的隐藏字段，以便处理脚本检查表单是否已提交。由表单文件显示的 Web 页面如图 2-2 所示。\n\n\
  **图 2-2：**\n简单的登录表单。\n\n列表 2-3 中的脚本显示并处理图 2-2 所示的表单。\n\n**列表 2-3：显示并处理登录表单的脚本**\n\
  \n```php\n<?php\n\n/* Program name: login_url.php\n* Description: Logs in user.\n\
  */\nif(isset($_POST['sent']) && $_POST['sent'] == “yes”)\n{\n/* check each field\
  \ for blank fields */\nforeach($_POST as $field => $value)\n{\nif($value == \"\"\
  )\n{\n$blank_array[$field] = $value;\n}\nelse\n{\n$good_data[$field]=strip_tags(trim($value));\n\
  }\n} // end of foreach loop for $_POST\nif(@sizeof($blank_array) > 0) // blank fields\
  \ found\n{\n$message = “<p style=’color: red; margin-bottom: 0;\nfont-weight: bold’>\n\
  You must enter both a user id and a password.</p>”;\n/* redisplay form */\nextract($blank_array);\n\
  extract($good_data);\ninclude(“form_log.inc\");\nexit();\n} // end if blanks found\n\
  \ninclude(“dbstuff.inc\");\n$cxn = mysqli_connect($host,$user,$password,$database)\n\
  or die (“couldn’t connect to server”);\n$query = “SELECT first_name FROM Customer\n\
  WHERE user_name=’$_POST[user_name]’\nAND password=md5('$_POST[password]’”)\n$result\
  \ = mysqli_query($cxn,$query)\nor die (“Couldn’t execute query.”);\n$n_row = mysqli_num_rows($result);\n\
  if($n_row < 1) // if login unsuccessful\n{\n$message = “<p style=’color: red; margin-bottom:\
  \ 0;\nfont-weight: bold’>\nUser ID and Password not found.</p>”;\nextract($_POST);\n\
  include(“form_log.inc\");\nexit();\n}\nelse //if login successful\n{\n$row=mysqli_fetch_assoc($result);\n\
  header(“Location: secret_page_url.php?first_name=\n$row[first_name]”);\n}\n} //\
  \ end if submitted\nelse // first time script is run\n{\n$user_name = \"\";\n$password\
  \ = \"\";\ninclude(“form_log.inc\");\n}\n?>\n```\n\n列表 2-3 脚本说明中的以下数字指的是列表中的行号：\n\
  \n5. 开始一个 `if` 语句，用于检查隐藏字段。如果隐藏字段存在，说明表单是由用户提交的。执行 `if` 语句。如果隐藏字段不存在，说明脚本是第一次运行，不是由用户提交的表单启动，脚本跳转到第\
  \ 55 行的 `else` 语句。\n\n8. 开始一个 `foreach` 语句，遍历 `$_POST` 数组。表单中的 `user_name` 和 `password`\
  \ 字段都在数组中。`foreach` 语句检查字段是否为空。如果为空，则其值被添加到 `$blank_array` 中；如果不为空，则将其值经过清洗并添加到\
  \ `$good_data` 中。\n\n19. 开始一个 `if` 语句，如果发现任何空字段则执行该语句。创建一个错误消息，使用用户输入的信息重新显示表单（第\
  \ 25–27 行），并退出脚本（第 28 行）。如果没有发现空字段，`if` 语句不执行，脚本从第 30 行继续运行。\n\n30. 开始一个区域（第 30–38\
  \ 行），在数据库中搜索用户输入的 `user_name` 和 `password`。第 38 行将匹配的数量存储在 `$n_row` 中。\n\n39. 开始一个\
  \ `if` 语句，如果登录失败则执行该语句。创建一个错误消息，重新显示表单并退出脚本。\n\n48. 开始一个 `else` 语句，如果登录成功则执行该语句。使用\
  \ `mysqli_fetch_assoc($result)` 获取 `$row`，并使用 `header()` 函数重定向到带有用户名字的 `secret_page_url.php`。\n\
  \n54. 开始一个 `else` 语句，当脚本首次运行时运行时执行该语句。将 `$user_name` 和 `$password` 设置为空字符串，并包含 `form_log.inc`。\n\
  \n**列表 2-4：从 URL 获取信息的脚本**\n\n```php\n<?php\n?>\n<html>\n<head><title>Secret Page\
  \ with GET</title></head>\n<body>\n<?php\necho “<p style=’text-align: center; margin:\
  \ .5in’>\nHello, {$_GET['first_name']}<br />\nWelcome to the secret page</p>”;\n\
  ?>\n</body>\n</html>\n```\n\n该脚本为登录的用户显示一个欢迎页面。通过显示在 URL 中传递的用户姓名，实现了消息的个性化。图 2-3\
  \ 显示了列表 2-4 脚本显示的 Web 页面。\n\n\n\n\n用于设置用户会话并在服务器上存储会话信息的函数；这些信息可以从任何 Web 页面访问。这种方法对于预计用户将查看许多页面的会话非常有用。\n\
  \n### 在 cookies 中存储信息\n\n你可以将信息存储为 `cookies`，它们是包含 `variable`= `value`（键值对）的小量信息，类似于你可以添加到\
  \ URL 中的键值对。用户的浏览器会将 cookies 存储在用户的计算机上。然后，你的脚本就可以从网站的任何 Web 页面使用 cookie 中存储的信息。\n\
  \nCookies 最初设计用于在短时间内存储少量信息。除非你专门设置 cookie 的有效期较长，否则 cookie 在用户关闭浏览器时就会消失。\n\nCookies\
  \ 在某些情况下非常有用，但 cookies 并不受你的控制。用户可能会将他们的浏览器设置为拒绝 cookie。除非你确切知道所有用户都开启了 cookie，或者你可以要求他们开启\
  \ cookie 并期望他们遵循你的请求，否则 cookie 将成为一个问题。如果你的应用程序依赖 cookie，那么如果用户浏览器中禁用了 cookie，程序将无法运行。\n\
  \n### 在 cookies 中保存和检索信息\n\n你通过使用 `setcookie` 函数来存储 cookies。通用格式如下：\n\n```php\n\
  setcookie(\"variable\", \"value\");\n```\n\n`variable` 是变量名，但你不需要包含美元符号 (`$`)。此语句仅存储信息直到用户关闭浏览器。例如，以下语句将\
  \ `state=CA` 键值对存储在用户计算机上的 cookie 文件中：\n\n```php\nsetcookie(\"state\", \"CA\");\n\
  ```\n\n当用户移动到下一个页面时，cookie 信息将可以在名为 `$_COOKIE` 的内置数组可用。下一个 Web 页面可以使用以下语句显示来自 cookie\
  \ 的信息：\n\n```php\necho \"Your home state is \".$COOKIE['state'];\n```\n\n该语句的输出如下：\n\
  `Your home state is CA`\n\n在设置 cookie 的脚本中无法使用该 cookie。用户必须转到另一个页面或重新显示当前页面，cookie\
  \ 信息才能可用。\n\n### 设置 cookies 的过期时间\n\n如果你希望存储在 cookie 中的信息在用户离开你的 Web 网站后仍保留在用户计算机的某个文件中，请按如下方式设置带有过期时间的\
  \ cookie：\n\n```php\nsetcookie(\"variable\", \"value\", expiretime);\n```\n\n`expiretime`\
  \ 值设置 cookie 过期的时间。`expiretime` 的值通常通过使用 `time` 或 `mktime` 函数来设置，如下：\n\n*   `time`：此函数返回计算机可以理解的格式的当前时间。你使用\
  \ `time` 函数加上秒数来设置 cookie 的过期时间，如下语句所示：\n\n```php\nsetcookie(\"state\", \"CA\",\
  \ time()+3600); // 一小时后过期\nsetcookie(\"Name\", $Name, time()+(3*86400)) // 3 天后过期\n\
  ```\n\n*   `mktime`：此函数返回计算机可以理解的格式的日期和时间。你必须按照以下顺序提供所需的日期和时间：时、分、秒、月、日和年。如果未包含任何值，则使用当前时间。你使用\
  \ `mktime` 函数设置 cookie 的过期时间，如下语句所示：\n\n```php\nsetcookie(\"state\", \"CA\", mktime(3,0,0,4,1,2003));\
  \ // 2003 年 4 月 1 日凌晨 3:00 过期\nsetcookie(\"state\", \"CA\", mktime(13,0,0,,,));\
  \ // 今天下午 1:00 过期\n```\n\n你可以通过将 cookie 的值设置为空来删除 cookie。以下语句任一都可以删除 cookie：\n\n\
  ```php\nsetcookie(\"name\");\nsetcookie(\"name\", \"\");\n```\n\n然而，`setcookie`\
  \ 函数有一个主要的局限性。`setcookie` 函数只能在发送任何其他输出*之前*使用。你*不能*在脚本中间、在你向 Web 页面 echo 某些输出之后设置\
  \ cookie。更多信息，请参阅侧边栏“必须在输出之前的语句”。\n\n### 一个在 cookies 中存储信息的登录应用程序\n\n在本章较早时候的“向\
  \ URL 添加信息”部分中，我们提供了一个通过向 URL 添加信息来传递信息的登录应用程序。在本节中，我们修改了该应用程序，使用 cookie 在你网站的各个\
  \ Web 页面之间共享信息。本节中的示例使用了列表 2-2 显示的表单代码。逻辑代码与脚本 `login_url.php` 代码非常相似。本示例中 `login_url.php`\
  \ 的更改如列表 2-5 所示。\n\n**列表 2-5：在 cookies 中存储信息的登录脚本**\n\n```php\n<?php\n/*\n程序名称:\
  \ login_cookie.php\n* 描述: 登录用户。\n*/\n// ... (逻辑细节)\nif (submitted) {\n    $row =\
  \ mysqli_fetch_assoc($result);\n    setcookie(\"first_name\", $row['first_name']);\n\
  \    setcookie(\"auth\", \"yes\");\n    header(\"Location: secret_page.php\");\n\
  } else {\n    $user_name = \"\";\n    $password = \"\";\n    include(\"form.inc\"\
  );\n}\n?>\n```\n\n\n\n\n该数字是一个非常长的无意义数字，对用户是唯一的，没有人可能猜到。会话 ID（session ID）存储在名为 `PHPSESSID`\
  \ 的 PHP 系统变量中。\n\n### 1. PHP 将你想要为会话保存的变量存储在服务器上的文件中。\n\n该文件以会话 ID 数字命名。它存储在 `php.ini`\
  \ 文件中 `session.save_path` 指定的目录中。在可以保存会话文件之前，该会话目录必须存在。\n\n### 2. PHP 将会话 ID 数字传递给每个页面。\n\
  \n如果用户开启了 cookie，PHP 将通过 cookie 传递会话 ID。\n\n如果用户禁用了 cookie，PHP 的行为取决于 `php.ini`\
  \ 中是否开启了 `trans-sid`。你可以在本章稍后的“在不使用 cookie 的情况下使用会话”部分了解更多关于 `trans-sid` 的信息。\n\n\
  ### 3. PHP 为每个新的会话页面从会话文件中获取变量。\n\n每当用户打开属于会话的一部分的新页面时，PHP 都会使用从上一个页面传递的会话 ID 数字从文件中获取变量。这些变量可以在\
  \ `$_SESSION` 数组可用。\n\n对于 PHP 4.1.2 或更早版本，除非在编译 PHP 时使用 `--enable-trans-sid` 选项启用，否则不支持\
  \ `trans-sid`。\n\n#### 打开和关闭会话\n\n你应该在每个 Web 页面的开始处打开会话。使用 `session_start` 函数打开会话，如下：\n\
  \n```\nsession_start();\n```\n\n该函数首先检查是否存在已会话 ID 数字。如果找到，它将设置会话变量。如果没有找到，它将通过创建一个新的会话\
  \ ID 数字来启动新会话。\n\n由于会话使用了 cookie，如果用户开启了 cookie，`session_start` 将受到与 cookie 相同的限制。也就是说，为了避免错误，必须在发送任何输出之前调用\
  \ `session_start` 函数。有关完整的详细信息，请参阅本章稍早之前的侧边栏“必须在输出之前的语句”。\n\n你可以告诉 PHP 你网站上的每个页面都应该自动以\
  \ `session_start` 语句开始。你可以通过配置文件 `php.ini` 中的设置来实现这一点。如果你是 PHP 管理员，可以编辑此文件；否则，请要求管理员编辑。寻找变量\
  \ `session.auto_start` 并将其值设置为 `1`。你可能必须在该设置生效之前重新启动 Web 服务器。在开启 `auto_start` 后，你不需要在每个页面的开头添加\
  \ `session_start`。\n\n在任何你想关闭会话的地方使用以下语句：`session_destroy();`。\n\n此语句会删除存储在会话文件中所有的会话变量信息。PHP\
  \ 不再将会话 ID 数字传递给下一个页面。然而，该语句*不会*影响在当前页面上设置的变量；它们仍然保持相同的值。如果你想从当前页面移除变量，并防止它们被传递到下一个页面，请使用此语句取消设置它们：\n\
  \n```php\nunset($variablename1, $variablename2, ...);\n```\n\n要将变量保存到会话中以便在稍后的 Web\
  \ 页面可用，请将该值存储在 `$_SESSION` 数组中，如下：\n\n```php\n$_SESSION['varname'] = \"John Smith\"\
  ;\n```\n\n当你在任何后续 Web 页面上打开会话时，存储在 `$_SESSION` 数组中的值是可用的。如下面的 `echo` 语句所示，该值可以在\
  \ `$_SESSION` 数组中可用：\n\n```php\necho $_SESSION['varname'];\n```\n\n如果你想在任何时候停止存储任何变量，可以使用以下语句取消变量：\n\
  \n```php\nunset($_SESSION['varname']);\n```\n\n#### 在不使用 cookie 的情况下使用会话\n\n许多用户在浏览器中禁用了\
  \ cookie。PHP 会检查用户的浏览器查看是否允许 cookie 并采取相应的行为。如果用户浏览器允许 cookie，PHP 将执行以下操作：\n\n*\
  \ 它将变量 `$PHPSESSID` 设置为会话 ID 数字。\n* 它使用 cookie 将 `$PHPSESSID` 从一个页面移动到下一个页面。\n\n\
  如果用户的浏览器设置为拒绝 cookie，PHP 的行为会有不同：\n\n* 它会设置一个名为 `SID` 的常量。该常量包含一个 `variable=value`\
  \ 对，看起来像 `PHPSESSID=longstringofnumbers`。这串长数字就是会话 ID。\n* 它可能会或可能将会话 ID 数字从一个页面移动到下一个页面，取决于\
  \ `trans-sid` 是否开启。如果开启了 `trans-sid`，PHP 将传递会话 ID 数字；如果没有开启，PHP 则不会传递会话 ID 数字。\n\
  \n`trans-sid` 默认关闭的。你可以通过编辑 `php.ini` 文件来开启它。搜索以 `session.use_trans_sid =` 开头的行。\n\
  \n如果设置为 `0`，则 `trans_sid` 关闭；如果设置为 `1`，则 `trans_sid` 开启。要开启该设置，请将 `0` 改为 `1`。你可能必须在该设置生效之前重新启动\
  \ Web 服务器。\n\n开启 `trans-sid` 有优缺点：\n\n* **优点：**当用户禁用 cookie 时，会话可以无缝工作。你可以更容易地编写会话脚本，而无需担心用户的浏览器。\n\
  * **缺点：**会话 ID 数字经常通过 URL 传递。在某些情况下出于安全考虑，会话 ID 数字不应显示在浏览器地址中。此外，当会话 ID 数字在 URL\
  \ 中时，用户可以将其收藏。这时，如果用户使用该书签返回你的网站，当前的会话 ID 数字可能会与之前的访问发生混淆并产生问题。\n\n#### 开启 trans-sid\
  \ 的会话\n\n当 `trans-sid` 开启且用户禁用了 cookie 时，PHP 自动在 URL 或隐藏字段中发送会 ID 数字。如果用户通过链接、`header`\
  \ 函数或使用 `GET` 方法的表单进入下一个页面，会话 ID 数字将添加到 URL 中。如果用户通过使用 `POST` 方法的表单进入下一个页面，会话 ID\
  \ 数字将通过隐藏字段传递。PHP 识别 `PHPSESSID` 为会话 ID 数字，并在无需特殊编程的情况下处理会话。\n\n会话 ID 数字仅添加到你网站页面的\
  \ URL 中。如果下一个页面的 URL 包含服务器名称，PHP 假设它是另一个网站，不会添加会话 ID 数字。例如，假设你的链接语句如下：\n\n```html\n\
  <a href=\"newpage.php\"></a>\n<a href=\"HTTP://www.janetscompany.com/newpage.php\"\
  ></a>\n```\n\nPHP 为第一个链接添加会话 ID 数字，但不会为第二个链接添加。\n\n 未开启 trans-sid 的会话\n\n当 `trans-sid`\
  \ *未*开启且用户禁用了 cookie 时，PHP *不会*向下一个页面发送会话 ID 数字。相反，你必须自己发送会话 ID。\n\n幸运的是，PHP 提供了一个你可以用来自己发送会话\
  \ ID 的常量。该常量名为 `SID`，包含一个 `variable=value` 对，你可以将其添加到 URL 中，如下：\n\n```html\n<a href=\"\
  nextpage.php?<?php echo SID?>\">next page</a>\n```\n\n此链接语句在文件名末尾包含问号（`?`并将常量 `SID`\
  \ 添加到 URL 中。`SID` 包含会话 ID 数字。\n\n`echo SID` 的输出类似于：\n\n```\nPHPSESSID=877c22163d8df9deb342c7333cfe38a7\n\
  ```\n\n\n\n因此，下一页的 URL 如下：\n\n`nextpage.php?PHPSESSID=877c22163d8df9deb342c7333cfe38a7`\n\
  \n会话 ID 被添加到 URL 的末尾。由于在前文章节“向 URL 添加信息”中讨论的几个原因之一，你可能不希望会话 ID 现在浏览器显示的 URL 中。为了防止这种情况，你可以在使用\
  \ POST 方法的表单中通过隐藏字段发送会话 ID。首先，获取会话 ID；然后将其在隐藏字段中发送。以下语句实现了这些操作：\n\n```php\n<?php\n\
  \n$PHPSESSID = session_id();\n\necho “<form action=’nextpage.php’ method=’POST’>\n\
  \n<input type=’hidden’ name=’PHPSESSID’\n\nvalue='$PHPSESSID’ />\n\n<input type=’submit’\
  \ value=’Next Page’ />\n\n</form>”;\n\n?>\n```\n\n这些语句的作用如下：\n\n1. 函数 `session_id()`\
  \ 返回当前的会话 ID，并将会话 ID 存储在变量 `$PHPSESSID` 中。\n2. `$PHPSESSID` 通过隐藏表单字段发送。\n\n在新的页面上，PHP\
  \ 会自动找到 `PHPSESSID`，无需你进行任何特殊编程。\n\n# 一个在会话中存储信息的登录应用程序\n\n在本章的早些部分，我们提供了一个通过向 URL\
  \ 添加信息来传递信息的登录脚本（参见“向 URL 添加信息”章节），以及通过将信息存储在 cookie 中来共享信息的登录脚本（在“在 cookie 中存储信息”章节讨论）。在本节中，我们修改了登录应用程序，使用会话在你的网站页面之间共享信息。本节中的示例使用了列表\
  \ 2-2 中相同的表单代码。逻辑代码与列表 2-5 显示的 `login_url.php` 脚本非常相似。本示例中 `login_url.php` 的更改见列表\
  \ 2-7。\n\n## 列表 2-7：一个在会话中存储信息的登录脚本\n\n```php\n<?php\n\n/* 程序名: login_session.php\n\
  * 说明: 登录用户。\n*/\n\nsession_start();\n\n// 第 6-47 行与列表 2-3 中的第 5-46 行相同。\n\nelse\
  \ //如果登录成功\n{\n    $row = mysqli_fetch_assoc($result);\n    $_SESSION['first_name']\
  \ = $row['first_name'];\n    $_SESSION['auth'] = “yes”;\n    header(“Location: secret_page_session.php”);\n\
  } // 提交结束\nelse // 首次运行脚本\n{\n    $user_name = \"\";\n    $password = \"\";\n  \
  \  include(“form_log.inc”);\n}\n\n?>\n```\n\n注意列表 2-7 中的以下几点：\n\n- 脚本开头添加了一条语句。该语句开启了一个会话。\n\
  - 有两条语句将信息存储在会话变量中。\n- `header` 语句没有向 URL 末尾添加任何信息。\n\n当用户登录时显示 Web 页面的脚本从会话中获取信息。PHP\
  \ 代码见列表 2-8。\n\n## 列表 2-8：一个从会话中获取信息的脚本\n\n```php\n<?php\n\n/* 程序名: secret_page_cookie.php\n\
  * 说明: 显示欢迎页面。\n*/\n\nsession_start();\nif($_SESSION['auth'] != “yes”)\n{\n    header(“Location:\
  \ login_session.php”);\n    exit();\n}\necho “<html>\n<head><title>Secret Page with\
  \ Session</title></head>\n<body>”;\necho “<p style=’text-align: center; margin:\
  \ .5in’>\n\nHello, {$_SESSION['first_name']}<br />\n\nWelcome to the secret page</p>”;\n\
  ?></body></html>\n```\n\n该脚本显示与图 2-2 相同的页面。注意脚本中的以下项目：\n\n- 脚本以开启会话的语句开头。没有这条语句，会话变量将不可用。\n\
  - `session_start()` 函数之后是一个 `if` 语句，该语句通过检查会话中的变量 `$auth` 来测试用户是否已登录。如果用户未登录，则将其返回到登录脚本。\n\
  - `session_start()` 函数和带有 `header` 函数的 `if` 语句位于脚本开头。`session_start` 和 `header`\
  \ 语句不能位于任何产生输出的语句之后。\n- 欢迎消息从会话中获取用户的姓名并显示在欢迎页面上。\n\n# 第 3 章：构建登录应用程序\n\n## 设计登录应用程序\n\
  \n用户登录是 Web 上最常见的应用之一，有许多用途。我们相信你见过并登录过许多登录应用程序。\n\n如果你只需要一个简单的登录界面，本微书第 1 章和第 2\
  \ 章提供的示例脚本可能足够你使用。在本章中，我们将向你展示如何构建更复杂的登录应用程序。本章中的登录应用程序允许用户注册，或者在已经注册的情况下进行登录。它会在用户注册时收集并存储来自用户的信息。如果你需要提供这些额外功能并控制应用程序的外观和感受，那么这一章正适合你。\n\
  \n登录应用程序可以非常简单，例如管理员设置有效用户列表的应用程序。任何尝试访问受保护文件的用户都会被提示输入用户名和密码，这些信息将与有效用户列表进行检查。另一方面，登录应用程序也可以复杂得多。它可以允许网站访问者注册以获得访问并设置他或她的账户。应用程序可以在客户注册时收集信息。应用程序可能为用户提供管理自己账户的能力。登录应用程序可以提供的功能是多样的。\n\
  \n本章中登录应用程序的基本功能是允许已注册的用户进入网站，并阻止未注册的用户。它的第二个主要功能是允许用户注册并将其信息存储在数据库中。为了实现基本功能，用户登录应用程序应该执行以下操作：\n\
  \n- 为客户提供选择注册网站访问权限或在已注册的情况下登录网站的选择。\n- 显示注册表单，允许新客户输入其注册信息。表单中要收集的信息将在接下来的章节“创建用户数据库”中讨论。\n\
  - 验证表单中提交的信息。确保必填字段不为空且提交的信息格式正确。\n- 将验证后的信息存储在数据库中。\n- 显示登录表单，要求输入已注册客户的用户名和密码。\n\
  \n许多网站是机密的或具有机密部分。此类网站要求用户在登录后才能查看信息。以下是网站可能限制访问的一些情况示例：\n\n- 许多在线商家要求客户登录，以便存储其信息供将来交易。\n\
  - 许多网站需要限制信息的访问范围。例如，公司信息可能仅限于公司员工或部门成员。\n- 信息是出售的，因此信息需要限制给支付过费用的人员。\n\n\n\n将输入的用户名和密码与数据库中的用户名和密码进行比较。如果匹配成功，则从网站向客户发送\
  \ Web 页面。如果没有找到匹配项，则给客户尝试其他登录的机会。\n\n# 创建用户数据库\n\n应用程序设计要求一个存储用户信息的数据库。数据库是该应用程序的核心。该数据库用于存储所有允许访问网站的用户的用户名和密码。通常，数据库还用于存储更多关于客户的信息。\n\
  \n这些信息可以用于营销目的。\n\n本章中的登录应用程序假设用户是愿意提供其姓名、地址和其他信息的客户。\n\n此类应用程序最适用于向客户销售产品的网站。用户数据库被命名为\
  \ `Customer`。\n\n## 设计 Customer 数据库\n\n你的第一个设计任务是选择你想要存储在 `Customer` 数据库中的信息。至少，你需要存储一个用户可以用于登录的用户名和密码。了解用户账户是何时创建的也很有用。在决定用户注册期间收集哪些信息时，你需要在收集所有你所能想到的潜在有用信息的冲动，与用户避免看起来太耗时的表单的意愿以及他们提供个人信息的抵触之间取得平衡。一种折中方案是询问一些可选信息。不介意的用户会填写，而反对的用户只需留空即可。\n\
  \n## 构建登录应用程序\n\n你的网站执行其功能需要某些信息。例如，用户可以很容易看到，一个网站要向他们发送某些东西就需要名称和地址。然而，他们可能看不到你为什么需要电话号码。即使你要求提供，有时也可以输入虚假号码。所以，除非你有像员工这样的受限制的听众（他们必须提供你要求的一切内容），否则请仔细考虑要收集哪些信息。用户在不耐烦时很容易离开你的网站。这不像他们开车几英路来到你的商店并寻找停车位。他们只需点击一下即可离开。对于本章的示例应用程序，我们假设网站是一个销售产品的在线商店。因此，我们需要收集客户的联系信息。大多数客户愿意向信誉良好的零售商提供电话号码，因为他们意识到订单可能会需要的问题。本节其余部分将讨论信息的细节及其在\
  \ MySQL 数据库中的存储。数据库只包含一张表。客户信息存储在表中，每个客户有一条记录（行）。表所需的字段如 3-1 所示。\n\n### 表 3-1 数据库表：Customer\n\
  \n| 变量名 | 类型 | 说明 |\n| :--- | :--- | :--- |\n| `user_name` | `CHAR(10)` | 账户的用户名（主键）\
  \ |\n| `create_date` | `DATE` | 账户添加到表的日期 |\n| `password` | `CHAR(255)` | 账户密码 |\n\
  | `last_name` | `VARCHAR(50)` | 客户姓 |\n| `first_name` | `VARCHAR(40)` | 客户名 |\n\
  | `street` | `VARCHAR(50)` | 客户街道地址 |\n| `city` | `VARCHAR(50)` | 客户居住的城市 |\n| `state`\
  \ | `CHAR(2)` | 字母州代码 |\n| `zip` | `CHAR(10)` | 邮编；5 位数字或 ZIP+4 |\n| `email` | `VARCHAR(50)`\
  \ | 电子邮件地址 |\n| `phone` | `CHAR(15)` | 客户可以联系的电话号码 |\n| `fax` | `CHAR(15)` | 客户传真号\
  \ |\n\n该表有 12 个字段。前三个字段 `user_name`、`password` 和 `create_date` 是必须的，且不能为空。其余字段包含客户的姓名、地址、电话和传真，允许留空。第一个字段\
  \ `user_name` 是主键。\n\n## 构建 Customer 数据库\n\n你可以使用第三卷第一章中讨论的任何方法创建 MySQL 数据库。以下 SQL\
  \ 语句创建此数据库：\n\n```sql\nCREATE DATABASE CustomerDirectory;\n```\n\n以下 SQL 语句创建该表：\n\
  \n```sql\nCREATE TABLE Customer (\n    user_name VARCHAR(20) NOT NULL,\n    create_date\
  \ DATE NOT NULL,\n    password VARCHAR(255) NOT NULL,\n    last_name VARCHAR(50),\n\
  \    first_name VARCHAR(40),\n    street VARCHAR(50),\n    city VARCHAR(50),\n \
  \   state CHAR(2),\n    zip CHAR(10),\n    email VARCHAR(50),\n    phone CHAR(15),\n\
  \    fax CHAR(15),\n    PRIMARY KEY(user_name)\n);\n```\n\n## 访问 Customer 数据库\n\n\
  PHP 提供了 MySQL 函数，用于从你的 PHP 脚本访问数据库。MySQL 函数接收访问数据库所需的信息，例如 MySQL 账户名和密码。MySQL 账户名和密码与你拥有的任何其他账户名或密码无关，例如登录系统的密码。\n\
  \n在许多应用程序中，我们将 PHP `mysqli` 函数所需的信息存储在一个名为 `dbstuff.inc` 的单独文件中。出于安全考虑，该文件存储在 Web\
  \ 空间之外的目录中。该文件包含类似以下的信息：\n\n```php\n<?php\n$host = \"localhost\";\n$user = \"admin\"\
  ;\n$password = \"\";\n$database = \"CustomerDirectory\";\n?>\n```\n\n\n\n登录页的代码由两个文件组成：定义页面外观和感觉的代码，以及为页面提供特定信息的代码。\n\
