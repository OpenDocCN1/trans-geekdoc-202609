  \n14_167779 bk02ch04.qxp 12/17/07 8:09 PM Page 248\n248 在抽象类和接口中使用抽象方法\n\n## 抽象类和接口中的抽象方法\n\
  \n你可以使用抽象方法来指定传递的信息，但不包含任何代码。抽象方法是在 PHP 5 中引入的。你可以在抽象类或接口中使用抽象方法。抽象类同时包含抽象方法和非抽象方法。接口只包含抽象方法。\n\
  \n### 使用抽象类\n\n任何包含抽象方法的类都必须声明为抽象类。\n\n抽象类的功能是作为子类的基类。你不能从抽象类创建对象。\n\n抽象方法指定了类必须实现的方法。\n\
  \n子类可以用不同的方式实现抽象方法。抽象方法在子类中必须被实现。\n\n如果子类没有实现抽象方法，将会发生错误。\n\n抽象方法指定了传递的值。抽象方法必须是公开的（public）。以下代码显示了抽象方法的使用。抽象类名为\
  \ `Message`。该类定义了两个子类。\n\n```php\nabstract class Message\n{\n    protected $message_content;\n\
  \    function __construct($text)\n    {\n        $this->message_content = $text;\n\
  \    }\n    abstract public function displayMessage($color);\n}\n\nclass GiantMessage\
  \ extends Message\n{\n    public function displayMessage($color)\n    {\n      \
  \  echo “<h1 style='color:$color'>$this->message_content</h1>”;\n    }\n}\n\nclass\
  \ BigMessage extends Message\n{\n    public function displayMessage($color)\n  \
  \  {\n        echo “<h2 style='color:$color'>$this->message_content</h2>”;\n   \
  \ }\n}\n```\n\n`Book II`\n第 4 章\n`面向对象编程`\n抽象类 `Message` 包含了抽象方法 `displayMessage`。两个子类：`GiantMessage`\
  \ 和 `BigMessage`。在 `GiantMessage` 中，显示为 `<h1>` 标签。在 `BigMessage` 中，显示为 `<h2>` 标签。因此，两个子类都实现了抽象方法，但实现方式不同。如果子类没有实现抽象方法，将会发生错误。\n\
  \n### 使用接口\n\n接口只包含抽象方法。接口的功能通过指定类必须实现的方法来强制执行模式。\n\n接口不能与脚本中的类同名。接口中的所有方法必须是公开的（public）。当类实现接口时，接口中的所有方法都必须在类中实现。如果某个方法没有被实现，将会发生致命错误。\n\
  \n在类中实现接口的格式如下：`classname` implements `interfacename`。\n\n你可以在类中实现多个接口，如下：`classname`\
  \ implements `interfacename1, interfacename2`。\n\n```php\ninterface Moveable\n{\n\
  \    function moveForward($distance);\n}\n\nclass Car\n{\n    protected $gas = 0;\n\
  \    function __construct($amt)\n    {\n        $this->gas = $amt;\n        echo\
  \ “<p>At creation, Car contains $this->gas gallons of gas</p>”;\n    }\n}\n\nclass\
  \ Sedan extends Car implements Moveable\n{\n    private $mileage = 18;\n    public\
  \ function moveForward($distance)\n    {\n        $this->gas = $this->gas - round(($distance/$this->mileage),2);\n\
  \        echo “<p>After moving forward $distance miles, Sedan contains $this->gas\
  \ gallons of gas.</p>”;\n    }\n}\n```\n\n\n\n\n当对象 `$my_car` 创建时，显示第一条语句。由于 `Sedan`\
  \ 类没有构造函数，因此 `Car` 类中的构造函数会运行并产生第一行输出。第二条语句在使用 `moveForward` 方法时显示。\n\n## 防止对类或方法进行更改\n\
  \n你可能希望某个类完全按照你编写的方式使用。你可以使用 `final` 关键字来防止创建更改方法实现的子类，如下：\n\n```\nfinal class classname\n\
  ```\n\n## 第二卷\n\n### 第四章\n\n当类被定义为 `final` 时，无法创建子类。你也可以将一个方法定义为 `final`，如下：\n\n\
  ```php\nfinal public moveForward()\n```\n\n如果子类包含一个与父类中 `final` 方法同名的方法，将显示错误信息，类似于以下：`Fatal\
  \ error: Cannot override final method Car::moveForward()`。在这种情况下，父类 `Car` 包含一个定义为\
  \ `final` 的方法 `moveForward`。子类 `Sedan` 继承了 `Car`。然而，`Sedan` 类定义了一个方法 `moveForward`，该方法名与父类\
  \ `Car` 类中的 `final` 方法相同。这是不允许允许的。\n\n## 使用异常处理错误\n\nPHP 提供了一个名为 `Exception` 的错误处理类。你可以使用这个类来处理脚本中发生的非预期情况。当你定义的非预期情况发生时，方法中的代码会创建一个异常对象。在面向对象的编程术语中，这被称为*抛出异常*。\n\
  \n然后，当你使用该类时，会检查是否抛出了异常并执行指定的动作。\n\n你可以使用以下语句在方法中抛出异常：\n\n```php\nthrow new Exception(\"\
  message\");\n```\n\n该语句会创建一个 `Exception` 对象并在对象中存储一条消息。`Exception` 对象有一个 `getMessage`\
  \ 方法，你可以用它来获取你存储的消息。\n\n在你的类定义中，你在方法中包含代码，以便在某些条件发生时创建 `Exception`。例如，以下 `Car` 类中的\
  \ `addGas` 方法会按如下所示检查燃油量是否超过了汽车油箱能容纳的量：\n\n```php\nclass Car\n{\n    private $gas\
  \ = 0;\n\n    function addGas($amount)\n    {\n        $this->gas = $this->gas +\
  \ $amount;\n        echo \"<p>$amount gallons of gas were added</p>\";\n       \
  \ if($this->gas > 50)\n        {\n            throw new Exception(\"Gas is overflowing\"\
  );\n        }\n    }\n}\n```\n\n如果油箱中的燃油量超过 50 加仑，该方法将抛出一个异常。油箱无法容纳这么多油。\n\n当你使用该类时，按如下方式测试异常：`$my_car\
  \ = new Car();`\n\n```php\ntry\n{\n    $my_car->addGas(10);\n    $my_car->addGas(45);\n\
  }\ncatch(Exception $e)\n{\n    echo $e->getMessage();\n    exit();\n}\n```\n\n上述脚本包含一个\
  \ `try` 块和一个 `catch` 块：\n\n- `try`: 在 `try` 块中，你包含了任何认为可能触发异常的语句。在这个脚本中，添加过多的燃油可能会触发异常。\n\
  - `catch`: 当你使用该类时，检查是否抛出了异常并执行指定的动作。\n\n\n\n\n`get_class_` 函数返回一个数组。`properties`\
  \ 数组包含属性名作为键以及默认值作为值。`methods` 数组包含数字键，并以方法名为值。如果属性或方法是私有的，除非是在类内部执行的，否则该函数将不会返回其名称。\n\
  \n✦ 你可以使用 PHP 5 中引入的 `instanceof` 符来测试一个对象、其父类或它们实现的接口是否由指定的类创建，如下所示：\n\n```php\n\
  if($objectname instanceof \"classname\")\n```\n\n✦ 你可以使用以下函数获取对象属性的当前值：\n\n```php\n\
  get_object_vars($objectname);\n```\n\n该函数返回一个包含属性当前值的数组，并以属性名为键。\n\n# 销毁对象\n\n你可以使用以下语句销毁对象：\n\
  \n```php\nunset($objName);\n```\n\n例如，你可以使用以下语句创建并销毁 `Car` 类的对象：\n\n```php\n$myCar\
  \ = new Car;\nunset($myCar);\n```\n\n在 `$myCar` 被 unset 之后，该对象将不再存在。\n\nPHP 提供了一个在对象被销毁时自动运行的方法。你将此方法添加到类中并将其命名为\
  \ `__destruct`。例如，下面的类包含一个 `__destruct` 方法：\n\n```php\nclass Bridge\n{\n    function\
  \ __destruct()\n    {\n        echo \"The bridge is destroyed\";\n    }\n}\n```\n\
  \n如果你使用以下语句，对象将被创建并销毁：\n\n```php\n$bigBridge = new Bridge;\nunset($bigBridge);\n\
  ```\n\n这些语句的输出是：\n`The bridge is destroyed`\n\n当对象被 unset 时，`__destruct` 方法会输出该内容。\n\
  \n`__destruct` 方法并不是必须的。它只是在你想在对象销毁时执行某些语句时供你使用。例如，你可能关闭某些文件或将某些信息复制到数据库中。\n\n#\
  \ 第三册\n\n## 使用 MySQL\n\n### 目录\n\n- **第 1 章：MySQL 简介** .................................259\n\
  - **第 2 章：MySQL 管理** .................................269\n- **第 3 章：设计和构建数据库**\
  \ .................................295\n- **第 4 章：使用数据库** .................................................319\n\
  - **第 5 章：通过 PHP 脚本与数据库通信** ..........................343\n\n## 第 1 章：MySQL 简介\n\
  \n### 本章内容\n\n- **探索 MySQL 的工作原理**\n- **与 MySQL 通信**\n- **保护存储在 MySQL 中的数据**\n\n\
  许多动态网站需要一个后端数据库。数据库可以包含 Web 页面显示给用户的信息。或者，数据库的可能是存储用户提供的信息。在某些应用程序中，数据库既提供可用信息又存储新信息。\n\
  \nMySQL 是网站中最常用的数据库，它的开发目标是快速和轻量，特别是专为网站设计。MySQL 在使用 PHP 编写的网站中特别受欢迎，且 PHP 和 MySQL\
  \ 配合得非常好。\n\n本章提供了 MySQL 的简介。它解释了它的工作原理以及你如何与它通信。\n\n### MySQL 如何工作\n\nMySQL 软件由\
  \ MySQL 服务器、若干个辅助管理 MySQL 数据库的实用程序，以及 MySQL 服务器需要的一些辅助软件（你不需要了解这些）。\n\n系统的核心是 MySQL\
  \ 服务器。\n\nMySQL 服务器是数据库系统的管理器。它处理你所有的数据库指令。例如，如果你想创建一个新数据库，你会向 MySQL 服务器发送一条消息，说“创建一个新数据库并命名为\
  \ newdata *.*`”。然后 MySQL 服务器会在其数据目录中创建一个子目录，将新子目录命名为 `newdata`，并将所需格式的必要文件放入 `newdata`\
  \ 子目录中。同样，要向该数据库添加数据，你会向 MySQL 服务器发送一条消息，给它数据并告诉它你想将数据添加到哪里。\n\n在向 MySQL 服务器传递指令之前，它必须处于运行状态并等待请求。MySQL\
  \ 服务器通常被设置为在计算机启动时启动并一直运行。这是网站的常用设置。但是，没有必要将其设置为在计算机启动时启动。如果你需要，你可以在任何需要访问数据库时手动启动它。当它运行时，MySQL\
  \ 服务器会持续监听发送给它的消息。安装和启动 MySQL 服务器将在第一册的第 3 章中讨论。\n\n### 理解数据库结构\n\nMySQL 是一个关系型数据库管理系统（RDBMS）。你的\
  \ MySQL 服务器可以同时管理多个数据库。事实上，许多人可能由一个 MySQL 服务器管理不同的数据库。每个数据库由一个存储数据的结构和数据本身组成。数据库可以没有数据，只有一个结构，可以是完全空的，闲置着等待数据存储其中。\n\
  \n数据库中的数据存储在一个或多个表中。在向数据库添加任何数据之前，你必须创建数据库和表。首先你创建一个空数据库。然后向数据库中添加空表。\n\n数据库表的组织方式与你熟悉的其他表类似——分为行和列。每一行代表数据库中的一个实体，例如客户、书籍或项目。每一列包含关于该实体的一项信息，例如客户名、书名或项目开始日期。特定行和列的交叉点，即表格的单个单元格，被称为\
  \ `field`（字段）。\n\n数据库中的表可以是关联的。通常，一个表中的某行与另一个表中的几行相关。例如，你可能有一个包含你所拥有的书籍数据的数据库。你有一个书籍表和一个作者表。作者表中的某一行可能包含关于书籍表中几本书作者的信息。当表相关联时，你会在其中一个表中包含一列，用于存储与另一个表列中的数据匹配的数据。\n\
  \n只有在你创建了数据库结构后，才能添加数据。关于数据库结构的更多信息以及创建结构的指令在本小型读物的的第 3 章中提供。\n\n### 与 MySQL 通信\n\
  \n你与数据库的所有交互都是通过向 MySQL 服务器传递消息来实现的。MySQL 服务器必须理解你发送给它的指令。你使用结构化查询语言（SQL）进行通信，这是一种大多数数据库管理系统都能理解的标准计算机语言。\n\
  \n为了提出 MySQL 能理解的请求，你构建一个 SQL 查询并将其发送到 MySQL 服务器。\n\n#### 构建 SQL 查询\n\nSQL 几乎就是英语；它主要由英语单词组成，组合成听起来类似于英语句子的单词字符串。通常（幸运的是），你不需要理解任何奥秘的技术语言就能编写可以运行的\
  \ SQL 查询。\n\n\n\n\n每个查询的第一个单词是它的名称，它是一个动词（动作词），告诉 MySQL 你想做什么。我们在本迷你书中讨论的查询有 `CREATE`、`DROP`、`ALTER`、`SHOW`、`INSERT`、`LOAD`、`SELECT`、`UPDATE`\
  \ 和 `DELETE`。这些基础词汇足以在网站上创建并操作数据库。\n\n查询名称后面是一些单词和短语——有些是必须的，有些是可选的——告诉 MySQL 如何执行该操作。例如，你总是需要告诉\
  \ MySQL 要创建什么，并且总是需要告诉它向哪个插入插入或从哪个表中查询数据。\n\n以下是一个典型的 SQL 查询。你可以看到，它使用了英语单词：\n\n\
  ```sql\nSELECT lastName FROM Member\n```\n\n## 第三部分\n\n## 第一章\n\n此查询检索名为 `Member`\
  \ 表中存储的所有姓氏。\n\n## 介绍 MySQL\n\n更复杂的查询（如下所示）看起来没那么像英语：\n\n```sql\nSELECT lastName,firstName\
  \ FROM Member WHERE state=”CA” AND city=”Fresno” ORDER BY lastName\n```\n\n此查询检索所有住在\
  \ Fresno 的成员的姓和名，然后按照姓的字母顺序对它们进行排序。尽管这个查询看起来不太像英语，但它仍然非常清晰。\n\n在构建 SQL 查询时，有几点通用点需要注意，如前面的示例查询所示：\n\
  \n*   **大小写：** 在本书中，我们将 SQL 语言单词全部大写；可变信息项（如列名）通常赋予全小写或大部分小写字母的标签。我们这样做是为了方便你阅读——而不是因为\
  \ MySQL 需要这种格式。SQL 单词的大小写并不重要；例如，对于 MySQL 而言，`select` 等同于 `SELECT`，`from` 等同于 `FROM`。\n\
  \n另一方面，如果你的操作系统是 Unix 或 Linux，那么表名、列名和其他可变信息的大小写就是重要的。当你使用 Unix 或 Linux 时，MySQL\
  \ 需要精确匹配列名，因此列名的大小写必须正确——例如，`lastname` 不同于 `lastName`。\n\n然而，Windows 不像 Unix 和 Linux\
  \ 那么挑剔；从它的角度来看，`lastname` 和 `lastName` 是相同的。\n\n*   **间距：** SQL 单词之间必须用一个或多个空格隔开。使用多少个空格并不重要；你可以使用\
  \ 20 个空格，也可以只用 1 个空格。SQL 也不在乎行尾。\n\n你可以在 SQL 语句的任何地方换行，也可以将整个语句写在一行上。\n\n*   **引号：**\
  \ 注意在前面的查询中，`CA` 和 `Fresno` 被包含在双引号（\"\"）中。`CA` 和 `Fresno` 是一系列被称为*文本字符串*或*字符字符串*的字符。（我们将在本章稍后详细解释字符串）。你正在要求\
  \ MySQL 将 SQL 查询中的文本字符串与数据库已存储的文本字符串进行比较。当你比较存储在数值列中的数字（如整数）时，不需要将数字括在引号内。（在本迷你书第\
  \ 3 章，我们将解释你可以存储在 MySQL 中的数据类型。）\n\n## 发送 SQL 查询\n\n向 MySQL 发送 SQL 查询，我们涵盖了三种方法：\n\
  \n*   **mysql 客户端：** 默认情况下，mysql 客户端位于 MySQL 安装的目录。在 Unix/Linux 中，默认是 `/usr/local/bin`。在\
  \ Windows 中，默认是 `C:\\Program Files\\MySQL\\MySQL Server 5.0\\bin`。\n*   **管理软件：**\
  \ 此外，还有 `phpMyAdmin`，一种用于管理数据库的用户界面。\n*   **PHP 内置函数：** 你可以从 PHP 脚本发送查询。\n\n要使用\
  \ `mysql` 客户端，请遵循以下步骤：\n\n1.  **找到 mysql 客户端。** 默认情况下，mysql 客户端位于 MySQL 安装的目录。在\
  \ Unix/Linux 中，默认是 `/usr/local/bin`。在 Windows 中，默认是 `C:\\Program Files\\MySQL\\\
  MySQL Server 5.0\\bin`。\n2.  **启动客户端。** 在 Unix 和 Linux 中，输入路径/文件名（例如 `/usr/local/bin/mysql`）。在\
  \ Windows 中，打开命令行窗口并输入路径文件名（例如 `C:\\Program Files\\MySQL\\MySQL Server 5.0\\bin\\\
  mysql`）。如果你不需要用户名或密码，此命令将启动客户端。如果你需要输入账户或密码或两者，请使用以下参数：\n    *   `-u user`：`user`\
  \ 是你的 MySQL 用户名。\n    *   `-p`：此参数提示你输入 MySQL 账户密码。\n    例如，如果你在客户端所在的目录下，命令可能如下：\n\
  \    ```\n    mysql -u root -p\n    ```\n3.  **如果你跨网络启动 mysql 客户端访问数据库，请在 mysql\
  \ 命令后使用以下参数：**\n    *   `-h host`：`host` 是 MySQL 所在机器的名称。\n    例如，如果你在客户端所在的目录下，命令可能如下：\n\
  \    ```bash\n    mysql -h mysqlhost.mycompany.com -u root -p\n    ```\n4.  **在提示时输入密码。**\
  \  启动，你会看到：\n    ```\n    Welcome to the MySQL monitor. Commands end with ; or \\\
  g.\n    Your MySQL connection id is 459 to server version: 5.0.15\n    Type 'help;'\
  \ or '\\h' for help. Type '\\c' to clear the buffer.\n    mysql>\n    ```\n5.  **选择你想使用的数据库。**\
  \ 在 mysql 提示符下，输入以下内容：\n    ```sql\n    use databasename\n    ```\n\n\n\n某些 SQL\
  \ 查询（例如 `SHOW DATABASES`）并不要求你选择数据库。对于这些查询，你可以跳过第 5 步。\n\n6. **在 mysql 提示符处，输入你的\
  \ SQL 查询并在最后加上分号（`;`），然后按回车键（Enter）。**\n\n如果你忘记在查询末尾输入分号（`;`），`mysql` 客户端将不会执行查询。相反，它会继续显示提示符（`mysq>`），直到你输入分号为止。\n\
  \n查询的响应将显示在屏幕上。\n\n7. **要退出 mysql 客户端，在提示符处输入 `quit` 然后按回车键（Enter`）。**\n\n你可以使用\
  \ `mysql` 客户端发送你自己编写的 SQL 查询，它会返回查询的响应。管理软件也可以发送你编写的查询，我们将在下一节中介绍。然而，管理软件具有许多 `mysql`\
  \ 客户端不具备的额外功能。\n\n### 使用管理软件\n\n你可以决定使用其中一个管理软件软件包与 MySQL 通信。如上一节所述，这些软件包提供了图形用户界面，其功能比\
  \ `mysql` 客户端提供的多得多。MySQL 在其网站上提供了两个软件软件包：`MySQL Administrator` 和 `MySQL Query Browser`\
  \ 供你下载和使用。另一个流行的软件包是 `phpMyAdmin`，它是用 PHP 编写并通过浏览器访问的管理软件。在书中，我们主要讨论使用 `phpMyAdmin`\
  \ 进行 MySQL 管理。\n\n`phpMyAdmin` 软件包提供了大量功能。你可以使用以下方法之一与 MySQL 通信：\n\n* **发送 SQL 查询：**你可以构建自己的\
  \ SQL 查询，并使用 `phpMyAdmin` 将查询发送到 MySQL 服务器。\n* **使用 phpMyAdmin 功能：**你可以使用各种 `phpMyAdmin`\
  \ 功能来执行任务，例如创建数据库或向数据库表添加数据。当你点击 `phpMyAdmin` 按钮执行任务时，`phpMyAdmin` 会为你构建 SQL 查询并将其发送\
  \ MySQL。在使用 `phpMyAdmin` 功能时，你不需要了解 SQL 语法。在本节中，我们将描述如何使用 `phpMyAdmin` 向 MySQL 服务器发送\
  \ SQL 查询。在本书的后续章节中，当我们描述如何执行任务时，我们会告诉你是如何使用 `phpMyAdmin` 功能完成任务的。例如，当我们讨论创建数据库时，我们会同时描述要使用的\
  \ SQL 查询以及如何使用 `phpMyAdmin` 功能来创建数据库。\n\n要使用 `phpMyAdmin` 发送 SQL 查询，请遵循以下步骤：\n\n\
  ### 第 1 章\n\n1. **打开浏览器并访问 phpMyAdmin 主页。** 例如，取决于你安装 `phpMyAdmin` 的方式，你可能需要在浏览器中输入以下\
  \ URL：\n\n```\nlocalhost/phpmyadmin\n```\n\n图 1-1 显示了 `phpMyAdmin` 主页。主页显示了你连接的是哪个版本的\
  \ MySQL 以及你正在使用哪个 MySQL 账户。\n\n2. **点击 phpMyAdmin 页面左侧栏数据库（databases）字段中的向下箭头。**\n\
  \n会出现一个可用数据库列表。\n\n3. **点击你想打开的数据库名称。**\n\n安装 `phpMyAdmin` 时，通常会安装一个名为 `cdcol` 的示例数据库。如果列表中没有\
  \ `cdcol`，说明未安装 `cdcol`。\n\n4. **点击顶部的 SQL 链接。**\n\n5. **在文本区域中输入你的 SQL 查询。**\n\n\
  6. **点击文本区域下方的 Go（执行）。**\n\n`phpMyAdmin` 会显示消息，告知你刚刚输入的查询状态。例如，它可能会告诉你该查询创建了一个数据库。或者消息可能会提示由于你的语法错误导致查询无法运行。\n\
  \n### MySQL MySQL\n\n你需要控制对数据的访问。你需要决定谁可以查看数据，谁可以更改数据。如果坏人获取了你的私人信息（如信用卡号），你就会面临问题。你需要保护你的数据。MySQL\
  \ 提供了一套保护数据的安全系统，包括：\n\n* **账户（Accounts）：** 没有账户无法访问数据。账户有一个用户必须使用的名称。此外，每个账户指定了访问来源，例如仅限本地计算机。\n\
  * **权限（Permissions）：** MySQL 使用权限来指定谁可以做什么。例如，账户可以配置为允许选择数据但不插入或更新数据。或者，账户可以配置为更改特定表的数据。\n\
  \n你可以使用 SQL 查询创建和删除账户、添加和更改密码、添加和移除权限。你可以使用上一节描述的方法发送 查询。你还可以使用 `phpMyAdmin` 提供的功能管理账户。\n\
  \n## 第 2 章：管理 MySQL\n\n### 本章内容\n\n* **管理 MySQL**\n* **建立并控制数据访问**\n* **创建和管理账户**\n\
  * **备份和恢复数据库**\n* **获取最新版本的 MySQL**\n\nMySQL 是一个数据库管理软件。它管理着你构建动态网站所需的所需的数据库。你的目标是在数据库中存储数据或从数据库中检索数据。你可以直接存储和检索（见本书第\
  \ 3 和第 4 章），也可以从 PHP 脚本中存储和检索（见本书第 5 章）。此外，需要 MySQL 管理员来确保 MySQL 正确高效地工作。我们在本章中介绍\
  \ MySQL 管理。\n\n### 理解管理员职责\n\n管理 MySQL 涵盖了确保 MySQL 能够高效、安全地执行数据管理任务的任务。取决于你如何访问\
  \ MySQL，你可能负责部分或全部管理任务。如果你在 托管公司的计算机上使用 MySQL，则由托管公司执行大部分或全部管理任务。\n\n然而，如果你在本地计算机上使用\
  \ MySQL，你就是管理员，完全负责 MySQL 的管理工作。\n\n\n\n如果 `MySQL` 运行在 Web 托管计算机上，你不需要启动或停止服务器。\n\
  \n## 对你数据的默认访问\n\n✦ **创建和维护 MySQL 用户账户。** 没有账户，任何人无法访问你数据库中的数据。需要安装和删除账户，添加或删除密码，并为账户分配或移除权限。我们将在本章稍后的“设置\
  \ MySQL 账户”节中描述用户账户的管理。\n\n如果你在 Web 托管公司使用 `MySQL`，你可能被允许或不被创建或更改 `MySQL` 账户。你可能被限制只能拥有一个定义了权限的账户。\n\
  \n✦ **备份数据。** 你需要保留数据的备份副本，以防数据丢失或损坏。如果你在 Web 托管公司使用 `MySQL`，你需要向该公司咨询他们的备份程序。\n\
  \n你可能仍然想保留一份自己的备份，以防他们的备份程序失效。你可以在本章稍后的“备份你的数据库”节中阅读有关备份数据库的知识。\n\n✦ **更新 MySQL。**\
  \ 在需要时安装新的 `MySQL` 版本。如果 `MySQL` 运行在 Web 托管计算机上，则你不需要负责更新。\n\n我们将在本章稍后的“升级 MySQL”节中讨论升级\
  \ `MySQL`。\n\n## 对你数据的默认访问\n\n安装 `MySQL` 时，会安装一个名为 `root` 的默认 `MySQL` 账户。\n\n有时，该账户在安装时没有密码。如果你在\
  \ `Windows` 上使用配置向导配置 `MySQL`（如第一卷第 3 章所述），你在配置过程中设置了密码。此外，你可能设置了一个没有账户名和密码的匿名账户。如果你通过\
  \ Web 托管公司访问 `MySQL`，公司会为你提供供使用的账户名和密码。\n\n通常情况下，你不应该使用没有密码的 `root` 账户。如果你的安装设置了一个没有密码的\
  \ `root` 账户，请立即添加密码。\n\n`root` 账户拥有所有权限。你使用该账户来管理你的 `MySQL` 数据库。你不需要拥有所有权限的账户来访问你的\
  \ `MySQL` 数据库或添加和检索数据。\n\n因此，在大多数情况下，你希望创建一个权限较少的账户，用于通过 `PHP` 脚本访问数据。\n\n## 控制对你数据的访问\n\
  \n你需要控制对数据库中信息的访问。你需要决定谁可以查看数据，谁可以更改数据。想象一下，如果你的竞争对手能够更改你在线产品目录中的信息或复制你的客户列表——你很快就会破产。显然，你需要保护你的数据。\n\
  \n幸运的是，`MySQL` 提供了一个安全系统来保护你的数据。没有账户，任何人无法访问你数据库中的数据。每个 `MySQL` 账户具有以下属性：\n\n✦ 节点\n\
  ✦ `hostname` —— 账户可以访问 `MySQL` 服务器的机器\n✦ 密码\n✦ 一组权限\n\n要访问你的数据，某人必须使用有效的账户名并知道与该账户关联的密码。此外，他们必须从允许的计算机进行连接。`root`\
  \ 账户是一个拥有所有权限的特殊账户。\n\n名称和 `hostname` 共同定义了账户的标识。例如，`root@localhost` 是一个名为 `root`\
  \ 的账户，只能从 `localhost` 机器连接。`root@192.168.1.1` 是一个名为 `root` 的账户，只能从 IP 地址为 `192.168.1.1`\
  \ 的机器连接。`root@%` 是一个名为 `root` 的账户，可以从任何机器连接。\n\n当用户尝试连接到 `MySQL` 时，服务器分两个阶段检查访问：\n\
  \n1. **连接验证：** `MySQL` 检查账户名和主机名是否有效。\n2. **请求验证：** `MySQL` 检查用户是否提供了正确的密码。\n\n\
  如果两项检查都通过，用户将被授予访问权限。\n\n`root` 账户拥有所有权限。你使用该账户来管理你的 `MySQL` 数据库。你不需要拥有所有权限的账户来访问你的\
  \ `MySQL` 数据库或添加和检索数据。因此，在大多数情况下，你希望创建一个权限较少的账户，用于通过 `PHP` 脚本访问数据。\n\n\n\n安装 MySQL\
  \ 时，它会自动安装一个具有所有权限的账户：`root@localhost`。根据你的操作系统，该账户在安装时可能没有设置密码。任何登录到安装了 MySQL 的计算机的人都可以使用名为\
  \ `root` 的账户访问 MySQL 并对其进行任何操作。（当然，`root` 是一个广为人知的账户名称，因此该账户是不安全的。如果你是 MySQL 管理员，请立即为此账户添加密码。）\n\
  \n在某些操作系统上，除了 `root@localhost` 之外还会自动安装额外的账户。例如，在 Windows 上，可能会安装一个名为 `root@%` 的账户，且没有任何密码保护。这个具有所有权限的\
  \ root 账户可以被任何机器上的任何人使用。你应该立即删除这个 `Administering` 账户，或者至少给它设置密码。\n\n## MySQL\n\n\
  \ 密码\n\n每个账户都设置了密码。如果没有为账户提供密码，则密码为空，这意味着不需要密码。\n\nMySQL 对密码的长度没有限制，但有时系统上的其他软件会将长度限制为八个字符。如果是这样，八位字符之后的任何字符都会被丢弃。\n\
  \n为了额外的安全，MySQL 在存储密码之前对其进行加密。这意味着密码并不是以你输入的可识别字符存储的。这种安全措施确保了没有人能通过查看存储的密码来理解它们是什么。\n\
  \n遗憾的是，某些坏人可能会尝试通过猜测密码来访问你的数据。他们使用软件尝试连续使用不同的密码快速连接——这种做法被称为 `cracking`（破解）。\n\n\
  以下列表提供了一些关于选择尽可能难以破解密码的建议：\n\n- 使用六到八个字符。\n- 包含以下各项中的至少一个或多个——大写字母、小写字母、数字和标点符号。\n\
  - 不要使用你的账户名或其账户名的任何变体。\n- 不要包含字典中的任何单词，包括外语言字典。\n- 不要包含姓名。\n- 不要使用电话号码或日期。\n\n好的密码是难以猜测且容易记忆的。如果太难记忆，你可能需要将其写下来，这违背了设置密码的初衷。创建好密码的一种方法是使用喜欢的短语的首字母。例如，你可以使用短语“All\
  \ for one! One for all!”组成密码 `Afo!Ofa!`。\n\n这个密码不包含任何数字，但你可以通过使用数字 `4` 代替字母 `f`\
  \ 来修复这一点。这样你的密码就是 `A4o!O4a!`。\n\n你也可以用数字 `1` 代替字母 `o` 来表示 one。\n\n那么密码就是 `A41!14a!`。\n\
  \n这个密码绝对很难猜测。将数字加入密码的其他方法包括用 `1`（one）代替字母 `l`，或用 `0`（zero）代替字母 `o`。\n\n## 账户权限\n\
  \nMySQL 使用账户权限来指定谁可以做什么。任何使用有效账户的人都可以连接到 MySQL 服务器，但他或她只能执行该账户权限允许的操作。例如，可以设置一个账户，让用户可以选择数据但不能插入或更新数据。\n\
  \n可以为特定的数据库、表或列授予权限。例如，一个账户可以允许用户从数据库中的所有表中选择数据，但只能向数据插入一个表，并且仅更新特定表中的单列。\n\n表 2-1\
  \ 列出了你可能想要分配或移除的一些权限。\n\n还有其他可用权限，但它们不那么常用。你可以在 MySQL 在线手册的 `http://dev.mysql.com/doc/refman/5.0/en/privileges-provided.html`\
  \ 中找到完整的权限列表。\n\n### 表 2-1: MySQL 账户权限\n\n| 权限 | 描述 |\n| :--- | :--- |\n| ALL |\
  \ 所有权限 |\n| ALTER | 可以修改表结构 |\n| CREATE | 可以创建新数据库或表 |\n| DELETE | 可以删除表中的 |\n|\
  \ DROP | 可以删除数据库或表 |\n| FILE | 可以在服务器上读写文件 |\n| GRANT | 可以更改 MySQL 账户的权限 |\n| INSERT\
  \ | 可以向表中插入新行 |\n| SELECT | 可以从表中读取数据 |\n| SHUTDOWN | 可以关闭 MySQL 服务器 |\n| UPDATE\
  \ | 可以更改表数据 |\n| USAGE | 无权限 |\n\n你可能不想授予 `ALL`，因为它包含了管理操作的权限，例如关闭 MySQL 服务器——这些你不希望自己以外的任何人拥有的权限。\n\
  \n### 设置 MySQL 账户\n\n### Administering\n\n账户通过账户名和允许从该账户访问 MySQL 的计算机名称来标识。当你创建一个新账户时，你将其指定为\
  \ `accountname@hostname.`。你可以在创建账户时指定密码，也可以在稍后添加密码。你可以在创建账户时设置权限，也可以在稍后添加权限。\n\n\
  所有账户信息存储在名为 `mysql` 的数据库中，该数据库在安装 MySQL 时自动创建。要添加新账户或更改任何账户信息，你必须使用对 `mysql` 数据库具有相应权限的账户。\n\
  \n在本章的其余部分，我们将描述如何添加和删除账户以及更改密码和权限。如果你从公司 IT 部门或 Web 托管公司获得了一个账户，当你尝试执行任何必要的查询时可能会遇到错误，你需要请求具有更多权限的账户，或者要求\
  \ MySQL 管理员为你添加新账户或进行你需要的更改。\n\n### MySQL 安全数据库\n\n安装 MySQL 时，它会自动创建一个名为 `mysql`\
  \ 的数据库。用于保护数据的信息都存储在这个数据库中，包括账户名、主机名、密码和权限。\n\n权限存储在列中。**host 表**：该表根据主机控制对数据库的访问。每个列名的命名格式为\
  \ `privilege_priv`，其中 `privilege` 是特定的权限。例如，包含 ALTER 权限的列命名为 `alter_priv`。\n\n每个权限列的值为\
  \ `Y` 或 `N`，表示是或否。因此，例如，在用户表中，MySQL 检查 host 表以查看该数据库是否存在该用户的记录。通过这种方式，你可以允许某些主机访问数据库，而不允许其他主机访问。\n\
  \n例如，假设你有两个数据库：`db1` 和 `db2`。如果 `alter_priv` 账户字段包含 `Y`，则该账户可以执行 ALTER 查询。如果 `db1`\
  \ 数据库包含敏感信息，你只想让某些人看到它。`db2` 数据库包含你想让所有人看到的信息。如果在 db 表中为 `db1` 有了一行主机字段为空的记录，你可以在\
  \ host 表中有针对 `db1` 的两行。一个...\n\n\n\n\n\n## user 表\n`user table`: 此表存储权限。其中一行可以为所有从特定主机连接的用户授予适用于所有数据库和表的权限，同时它也为每个有效账户包含了一行，其中包含\
  \ `user`、`hostname` 和 `password` 列。另一行可以拒绝从任何其他主机连接的用户的访问权限。\n\n## tables_priv 表\n\
  `tables_priv` table: 此表存储适用于特定表的权限。MySQL 服务器会拒绝在该表中不存在的账户的连接。\n\n## columns_priv\
  \ 表\n`columns_priv` table: 此表存储适用于特定列的权限。\n\n## db 表\n`db` table: 此表存储适用于特定数据库的权限。它包含一个对应数据库的行，为账户名和主机名授予权限。该账户必须在\
  \ user 表中存在才能授予权限。\n\n### 设置 MySQL 账户\n\n### 识别当前存在的账户\n要查看账户信息，你可以执行 SQL 查询，使用\
  \ `mysql` 客户端或 `phpMyAdmin`（如本微型教程第 1 章关于发送 SQL 查询的节所述），或者你可以使用 `phpMyAdmin` 的功能。要查看你的数据库当前存在哪些账户，你需要一个拥有必要权限的账户。\n\
  \n### 使用 SQL 查询显示账户信息\n所有账户名都存储在名为 `mysql` 的数据库名为 `user` 的表中。要查看账户信息，你可以在名为 `mysql`\
  \ 的数据库上执行以下查询：\n\n```sql\nSELECT * FROM user\n```\n\n你应该会获得所有账户的列表。然而，如果你通过公司或 Web\
  \ 托管公司访问 MySQL，你可能没有必要的权限。在这种情况下，你可能会收到如下错误消息：`No Database Selected`（未选择数据库）。\n\n\
  此消息意味着你的账户被允许选择 `mysql` 数据库。或者你可能会收到提示你没有 `SELECT` 权限的错误消息。尽管这个消息很烦人，但它表明公司有着良好的安全措施。不过，这也意味着你无法查看你的账户拥有哪些权限。你必须询问你的\
  \ MySQL 管理员，或者通过尝试查询并查看是否被允许执行这些查询来自行找出。\n\n### 通过 phpMyAdmin 显示账户信息\n你可以通过 `phpMyAdmin`\
  \ 显示账户列表。在 `phpMyAdmin` 主页上，点击 `Privileges`（权限）链接。会出现账户概述页面（如图 2-1 所示），显示一个显示账户信息的表格。图\
  \ 2-1 中的页面显示了三个用户账户及其账户信息和权限。\n\n![Image 2-1]\n\n## 管理\n\n## 添加账户\n通过 `phpMyAdmin`\
  \ 访问 MySQL 的优方法是设置一个具有权限的账户。如果你使用 IT 部门或 Web 托管公司，它拥有的权限可能比需要的少。如果你需要创建一个账户，可以使用\
  \ `CREATE USER` 查询（在 5.0 版本中）或 `GRANT` 查询。\n\n### 使用 SQL 查询创建账户\n要创建一个或多个用户，你可以使用\
  \ `CREATE USER` 查询：\n\n```sql\nCREATE USER 'accountname'@'hostname' IDENTIFIED BY\
  \ 'password';\n```\n\n此查询会使用密码创建指定的账户。如果你使用的是 5.0 之前的 MySQL 版本，你必须使用 `GRANT` 查询来创建账户：\n\
  \n```sql\nGRANT ALL PRIVILEGES ON *.* TO 'accountname'@'hostname' IDENTIFIED BY\
  \ 'password';\n```\n\n账户被设置为 `password`。如果你以后需要更改密码，请使用 `SET PASSWORD` 查询。\n\n###\
  \ 通过 phpMyAdmin 创建账户\n你可以按照以下步骤通过 `phpMyAdmin` 创建新账户：\n\n1. 在 `phpMyAdmin` 页面上，点击\
  \ `Privileges`（权限）链接。\n2. 点击位于账户列表下 `Add New User`（添加新用户）。\n3. 从 `Host` 列表中选择主机。默认选择是\
  \ `Any`，即 `%`。\n4. 从 `Password` 列表中选择选项。你有两个选择：`Text Field`（文本字段）和 `No Password`（无密码）。\n\
  5. 如果你选择 `Text Field`，点击空白文本字段并输入密码，然后点击 Re-type 字段并输入相同的密码。\n6. 如果你想在此时指定权限，可以通过勾选页面中\
  \ `Privileges` 部分的复选框。\n7. 填写所有所需信息后，点击页面右下角的 `Go` 按钮。\n\n会出现带有如下消息的页面：You have\
  \ added a new user（你已添加新用户）。\n8. 点击页面顶部的 `Privileges` 链接。\n\n## 添加和更改密码\n密码并不是一成不变的。你可以为现有账户添加或更改密码。与本节中的任何其他操作一样，你可以使用\
  \ SQL 查询或 `phpMyAdmin` 功能添加或更改密码。\n\n### 使用 SQL 查询更改密码\n你可以使用 `SET PASSWORD` 查询添加或更改密码：\n\
  \n```sql\nSET PASSWORD FOR 'username'@'hostname' = PASSWORD('password');\n```\n\n\
  \n\n\n\n`SET PASSWORD FOR *username*@ *hostname* = PASSWORD('')` 使用 phpMyAdmin 更改密码\n\
  \n你可以使用 phpMyAdmin 的功能为现有账户添加或更改密码。要更改密码，请按照以下步骤操作：\n\n1. **在 phpMyAdmin 主页上，点击\
  \ Privileges（权限）链接。**\n将打开 User Overview（用户概览）页面，列出所有当前账户（参见图 2-1）。\n\n2. **点击想要更改密码的账户所在表格行末尾的铅笔图标。**\n\
  将出现该账户的 User 页面。账户名称显示在页面顶部。页面上会出现不同的部分，用于设置你可以更改的账户设置。\n\n![Image 33](img/index-310_1.jpg)\n\
  \n3. **滚动到 Change Password（更改密码）部分。**\n你可以使用此区域的字段来更改密码，如图 2-2 所示。\n\n4. **选择首选选项。**\n\
  选择“No Password”（无密码）或“Password”（密码）对应的单选按钮。如果你选择了 No Password，请直接跳转到第 6 步。\n\n5.\
  \ **如果你在第 4 步选择了 Password，点击 Password 文本框并输入密码，然后点击 Re-type（再次输入）文本框输入相同的密码。**\n\
  \n6. **点击 Change Password 部分底部橙色条右侧的 Go 按钮。**\n相同的网页将重新出现，页面顶部显示以下消息：用户 `*username*`@`*host*`\
  \ 的密码已成功更改。\n\n## 第 2 章：管理 MySQL\n\n**图 2-2：** phpMyAdmin User 页面的 Change Password\
  \ 部分。\n\n### 设置 MySQL 账户\n\n### 更改权限\n每个账户都有一组权限，规定了账户用户可以做什么不能做什么。你可以在创建账户时设置权限，也可以随时更改账户的权限。\n\
  \n表 2-1 显示了你可以为账户设置的最有用的价值的权限。\n\n### 使用 SQL 查询更改权限\n你可以通过发送以下查询来查看账户的当前权限：\n\n\
  `SHOW GRANTS ON *accountname*@ *hostname*`\n\n输出是一个用于创建当前账户的 `GRANT` 查询。输出显示了所有当前权限。如果你不包含\
  \ `ON` 子句，你看到的是执行 `SHOW GRANTS` 查询的账户的当前权限。\n\n你可以使用 `GRANT` 查询更改账户的权限，其通用格式如下：\n\
  \n`GRANT *privilege* (*columns*) ON *tablename* TO *accountname*@ *hostname* IDENTIFIED\
  \ BY ‘*password*’\n\n你还可以使用 `GRANT` 查询创建新账户或更改密码。你需要填写以下信息：\n\n- `*privilege* (*columns*)`：你必须列出至少一个权限。你可以通过在权限后的括号中列出列名，将每个权限限制为一个列或多个列。如果你不列出列名，则权限将授予表（或表）中的所有列。你可以根据需要列出任意权限和列，并用逗号隔开。你可以在表\
  \ 2-1 中查看出的出的权限。例如，一个 `GRANT` 查询可能开头如下：\n`GRANT select (firstName,lastName), update,\
  \ insert (birthdate) ...`\n\n- `*tablename*`：授予权限的表（或表）名称（名称）。你需要包含至少一个表。你可以列出多个表并用逗号隔开。`*tablename*`\
  \ 的可能值为：\n    - `tablename`：当前数据库中名为 `*tablename` 的整个表。你可以使用星号 (`*`) 表示当前数据库中的所有表。如果你使用星号且未选择当前数据库，则权限将授予所有数据库中的所有表。\n\
  \    - `databasename.tablename`：`*databasename.*` 中名为 `*tablename` 的整个表。你可以在数据库名或表名处使用星号\
  \ (`*`) 来表示所有数据库或表。使用 `*.*` 将授予所有数据库中所有表的权限。\n\n- `*accountname*@ *hostname`：如果账户已存在，则将授予其所指的权限。如果账户不存在，则将其添加。账户通过\
  \ `*accountname` 和 `*hostname` 配对来标识。如果存在一个具有指定账户名但主机名不同的账户，则不会更改现有账户，而是创建一个新账户。\n\
  \n- `*password*`：你正在添加或更改的密码。密码不是必填的。如果你不想为此账户添加或更改密码，请省略 `IDENTIFIED BY ‘*password*’`\
  \ 短语。\n\n例如，为名为 `ProductCatalog` 的在线目录数据库的 PHP 脚本添加一个新账户的 `GRANT` 查询可能是：`GRANT select\
  \ ON ProductCatalog.* TO phpuser@localhost IDENTIFIED BY ‘A41!14a!’`\n\n要移除权限，使用\
  \ `REVOKE` 查询。其通用格式为：\n`REVOKE *privilege* (*columns*) ON *tablename* FROM *accountname*@\
  \ *hostname`\n\n你需要填写适当的信息。你可以使用以下 `REVOKE` 查询移除账户的所有权限：\n\n`REVOKE all ON *.* FROM\
  \ *accountname*@ *hostname*`\n\n### 使用 phpMyAdmin 更改权限\n要查看账户的当前权限，点击 phpMyAdmin\
  \ 主页上的 `Privileges` 链接。将出现 Account Overview 页面，列出所有账户及其权限。\n\n要更改账户的权限，请按照以下步骤操作：\n\
  \n1. **点击想要更改权限的账户所在表格行末尾的铅笔图标。**\n将出现该账户的 User 页面。账户名称显示在页面顶部，下方 Global Setting（全局设置）部分。当前权限已勾选。\n\
  \n2. **更改设置。**勾选想要添加的权限复选框，取消勾选想要移除的权限复选框。\n\n3. **点击部分底部橙色条右侧的 Go 按钮。**\n相同的网页将重新出现，页面顶部显示以下消息：你已更新\
  \ `*username*`@`*host*` 的权限。\n\n## 移除账户\n你可能想要移除账户。在大多数情况下，拥有无人使用的账户不会产生负面影响。但是，如果你认为某个账户已被破解，出于安全考虑可能可能移除它。\n\
  \n### 使用 SQL 查询移除账户\n要移除账户，可以使用 `DROP USER` 查询（在 MySQL 4.1.1 中引入），如下：\n\n`DROP USER\
  \ *accountname*@ *hostname*, *accountname*@ *hostname*, ...`\n\n你必须使用对 `mysql` 数据库具有\
  \ `DELETE` 权限的账户来执行 `DROP USER` 查询。\n\n`DROP USER` 的行为随 MySQL 版本而变化。从 MySQL 5.0.2\
  \ 开始，它删除账户以及所有相关的记录，包括授予账户特定数据库或表的记录。然而，在 MySQL 5.0.2 之前的版本中，`DROP USER` 只删除没有权限的账户。因此，在旧版本中，你必须移除账户的所有权限（包括数据库或表权限），才能删除该账户。\n\
  \n### 使用 phpMyAdmin 移除账户\n要移除一个或多个 MySQL 账户，请按照以下步骤操作：\n\n1. **在 phpMyAdmin 主页上，点击\
  \ Privileges 链接。**\n打开 User Overview 页面，列出所有账户。\n\n2. **勾选想要移除的账户前面的复选框。**\n\n3.\
  \ **滚动到 Remove Selected Users（移除所选用户）部分。**\n\n## 备份你的数据库\n\n\n\n\n4. 点击移除删除用户（Remove\
  \ Selected Users）部分底部橙色条右侧的 Go（Go）按钮。\n\n同一个网页将重新出现，页面顶部显示以下消息：所选用户已成功删除。\n\n##\
  \ 备份你的数据库\n\n你至少需要为你宝贵的数据库准备一份备份副本。灾难虽然极少发生，但确实会发生。存储数据库的计算机可能会故障导致数据丢失，计算机文件可能会损坏，建筑可能会火灾等。数据库的备份副本可以防止因此类灾难导致的数据丢失。\n\
  \n你至少应该拥有一份备份副本，并将其存储在与当前使用的副本不同的位置。你可能需要多份副本——也许多达三份。以下是存储这些副本的方法：\n\n* 将一个副本存储在方便的位置，甚至可以存储在存储数据库的同一台计算机上，以便快速替换损坏的运行数据库。\n\
  * 将第二份副本存储在另一台计算机上，以防你在 `Chapter 2` 中存储数据库的计算机故障，导致第一份备份无法使用。\n* 将第三份副本存储在不同的物理位置，以应对\
  \ `MySQL` 远程可能发生的建筑火灾。如果你已经将第二份备份存储在另一个物理位置的计算机上，则就不需要第三份副本。\n\n如果你无法访问离线计算机来备份数据库，可以将备份拷贝到便携式介质（如\
  \ CD 或 DVD）并离线存储。某些公司会收取费用将你的计算机介质存储在他们那里，或者你也可以将介质装进口兜带回家。\n\n如果你在别人的计算机（例如 Web\
  \ 托管公司的计算机）上使用 `MySQL`，则提供访问服务的人负责备份。他们应该建立自动化程序对你的数据库进行备份。在评估 Web 托管公司时，请询问他们的备份程序。你想知道备份副本生成的频率以及它们存储在何处。如果你对数据安全没有信心，可以讨论更改或增加备份程序。\n\
  \n17_167779 bk03ch02.qxp 12/17/07 8:32 PM Page 286\n\n286 备份你的数据库\n\n如果你是 `MySQL`\
  \ 管理员，你你负责进行备份。\n\n即使你在别人的计算机上使用 `MySQL`，你可能也想制作自己的备份副本，以防万全。\n\n在特定的时间进行备份——至少每天一次。如果你的数据库频繁变化，你可能想更频繁地备份。例如，你可能想每小时备份到备份目录，但每天备份到另一台计算机一次。\n\
  \n你可以使用 `MySQL` 提供的名为 `mysqldump` 的实用程序，或使用 `phpMyAdmin` 提供的功能来备份 `MySQL` 数据库。\n\
  \n## 使用 mysqldump 备份数据库\n\n`MySQL` 提供了一个名为 `mysqldump` 的程序供你制作备份副本。`mysqldump` 程序创建一个文本文件，其中包含了重建整个数据库所需的所有\
  \ SQL 语句。该文件包含每个表的 `CREATE` 语句以及表中每行数据的 `INSERT` 语句。\n\n要使用 `mysqldump` 备份你的数据库，请遵循以下步骤：\n\
  \n1. 使用 `mysqldump` 备份你的数据库，请遵循以下步骤：\n2. 进入 `MySQL` 安装目录。例如，`cd /usr/local/mysql`。\n\
  3. 输入以下命令：\n```\nmysqldump -u root -p database_name > backup_file.sql\n```\n在 `mysqldump\
  \ -u root -p database_name > backup_file.sql` 中，进行以下替换：\n* `-u root`：指定用户 `root`。\n\
  * `-p`：告诉程序提示密码。\n* `database_name`：你想要备份的数据库名称。\n* `> backup_file.sql`：将输出重定向到文件。\n\
  \n要使用来自 `mysqldump` 的备份恢复数据库，请使用以下命令：\n\n```\nmysql -u root -p database_name < backup_file.sql\n\
  ```\n\n\n\n6. **如果“结构”（Structure）复选框以及结构部分顶部的四个复选框未被勾选，请选中它们。**\n\n7. **如果“数据”（Data）复选框和“二进制字段使用十六进制”（Use\
  \ Hexadecimal for Binary Fields）复选框未勾选，请选中它们。**\n\n图 2-5 显示了勾选的框。\n\n8. **滚动到“保存为文件”（Save\
  \ as File）部分并勾选“保存为文件”复选框。**\n\n9. **根据需要更改文件名模板。**\n\n默认模板为 `__DB__`。当你保存文件时，此名称将被替换为数据库名称。你可以使用文本或特殊字符在此模板名称后添加。例如，你可以使用模板\
  \ `__DB__-%Y%m%d`。特殊字符代表日期。\n\n此模板创建名为 `databasename-20071015` 的文件名。你可以使用 PHP `strtotime`\
  \ 函数识别的任何特殊字符，如第二卷第 1 章所述。\n\n### 恢复你的数据\n\n勾选“记住模板”（Remember Template）复选框，phpMyAdmin\
  \ 在每次保存数据文件时都会显示新的文件名模板。\n\n10. **将压缩选项设置为“无”（None）。**\n\n11. **点击“执行”（Go）按钮。**\n\
  \n浏览器的保存文件窗口将打开。窗口中将正在保存的文件名。\n\n12. **选择将文件保存到磁盘的选项并点击“确定”。**\n\n文件将保存在你浏览器保存文件的地方。如果你将浏览器设置为询问保存文件的位置，则会打开一个窗口，你可以导航到想要保存文件的目录。\n\
  \n你可以使用“导出”功能保存其他类型的文件，例如 XML 文件。\n\n如果你想保存另一种类型的文件，请阅读 phpMyAdmin 文档，该文档可以通过 phpMyAdmin\
  \ 主页上的链接获取。\n\n### 恢复你的数据\n\n在某个时刻，你的某个数据库表可能会损坏并无法使用。这虽然不常见，但确实会发生。例如，硬件问题或意外关机可能会导致表损坏。有时，让\
  \ MySQL 困惑的数据异常会导致表损坏。在某些情况下，表损坏会导致你的 MySQL 服务器关闭。\n\n以下是一个指示表损坏的典型错误信息：`Incorrect\
  \ key file for table:‘*tablename*’`。\n\n你可以用存储在备份副本中的数据替换损坏的表。\n\n然而，在某些情况下，数据库可能会完全丢失。例如，如果存放数据库的计算机故障且无法修复，你当前的数据库就丢失了——但你的数据并没有永远消失。你可以用新计算机替换故障计算机，并从备份副本恢复数据库。\n\
  \n你可以用存储在备份副本中的数据库替换当前的数据库表。备份副本包含了制作副本时数据的快照。当然，你不会获得备份副本创建之后对数据库所做的任何更改；你必须手动重新创建这些更改。\n\
  \n再次，如果你通过 IT（信息技术）部门或 Web 托管公司访问 MySQL，你需要要求 MySQL 管理员从备份恢复你的数据库。如果你是 MySQL 管理员，你可以自己进行恢复。\n\
  \n正如我们在本微型书籍第 1 章介绍的，你通过创建数据库然后向数据库中添加表来构建数据库。通过 `mysqldump` 工具或 phpMyAdmin（如本章较后的“备份你的数据库”部分所述）创建的备份，是一个包含重建表所需的所有\
  \ SQL 语句的文件，但它不包含创建数据库本身所需的语句。\n\n### 使用 mysql 客户端恢复数据库\n\n要从备份文件恢复数据库，你必须先编辑备份文件（这是一个文本文件）。然后，你使用\
  \ `mysql` 客户端根据备份文件中的 SQL 语句创建数据库。\n\n首先，按照以下步骤编辑备份文件：\n\n1. **在文本编辑器中打开备份文件。**\n\
  2. **找到显示“服务器版本”（Server Versions）的行。**\n3. **如果你想重建整个数据库，请在步骤 2 找到的行下方添加以下语句：**\n\
  ```sql\nCREATE DATABASE IF NOT EXISTS *databasename*\n```\n4. **在步骤 3 的行下方，添加一行以指定要将表添加到哪个数据库中：**\n\
  ```sql\nUSE *databasename*\n```\n5. **检查重建表的语句块。**\n\n如果你不想重建某个表，请在每条重建该表的行开头添加\
  \ `--`（两个连字符）。这些连字符将这些行标记为注释。\n\n6. **检查每个表的 INSERT 语句行。**\n\n如果你不想向任何表添加数据，请注释掉执行\
  \ `INSERT` 数据的行。\n7. **保存编辑后的备份文件。**\n\n在备份文件包含你想要用于重建数据库或表（s）的语句后，你可以使用 `mysql`\
  \ 客户端执行备份文件中的 SQL 语句。只需遵循以下步骤：\n\n1. **从命令行提示符，切换到 MySQL 安装目录下的 bin 子目录。**\n\n例如，你可能输入\
  \ `cd /usr/local/mysql` 或 `cd C:\\Files\\MySQL Server 5.0\\bin`。\n\n2. **输入此命令（这将发送备份文件中的\
  \ SQL 查询）：**\n```bash\nmysql -u *accountname* -p < *backupfilename*\n```\n将 *accountname*\
  \ 替换为具有 CREATE 权限的帐户。如果账户不需要密码，请省略 `-p`。如果你使用 `-p`，系统会提示输入密码。使用备份文件的完整路径和文件名。例如：\n\
  ```bash\nmysql -u root -p < C:\\Files\\MySQL Server 5.0\\bin\\bak\\ProductCatalog.bak\n\
  ```\n恢复表可能需要一些时间。等待命令完成。如果发生问题，会显示错误信息。如果没有问题，没有任何输出。命令完成后，会出现提示符。\n\n你的数据库现在恢复到制作副本时的所有数据。如果数据在制作后发生了变化，你将丢失这些更改。例如，如果在备份后增加了更多数据，这些新数据不会被恢复。如果你知道创建备份后做了更改，可以手动进行操作。\n\
  \n### 使用 phpMyAdmin 恢复数据库\n\n你可以使用 phpMyAdmin 功能从包含 SQL 语句的备份文件恢复数据库，遵循以下步骤：\n\n\
  1. **如果尚未选择数据库，请从数据库下拉列表中选择一个。**\n\n如果你要恢复的数据库不存在，请按照本微型书籍第 3 章所述创建一个空数据库。\n2. **点击主面板顶部的“导入”（Import）标签。**\n\
  \n这些标签出现在 phpMyAdmin 主页或任何页面的顶部。打开导入页面。\n3. **在“导入”部分，点击“浏览”并导航到包含 SQL 语句的文件。**\n\
  \n你选择的文件将通过浏览按钮插入字段。\n4. **滚动到“导入文件格式”（Format of Imported File）部分并选择 SQL。**\n5.\
  \ **在“SQL 兼容模式”（SQL Compatibility Mode）下拉列表中选择正确的设置。**\n\n默认值是 None。如果你是从 MySQL\
  \ 5.0 或更高版本创建的文件导入，None 是正确的设置。你可以从旧版本 MySQL 创建的文件或其他少数其他来源导入文件。如果你是从这些来源之一导入文件，请从下拉列表中选择正确的来源。\n\
  6. **点击“执行”（Go）按钮。**\n\n\n\n\n文件已导入。导入可能需要一些时间，取决于正在还原的数据库的大小。完成后，导入页面将重新出现，并在顶部显示此类消息：导入已完成，已执行\
  \ 9 次查询。\n\n`phpMyAdmin` 会执行你正在还原的文件中的 SQL 语句。在大多数情况下，该文件是你使用与你还原时所相同版本的 `MySQL`\
  \ 通过 `phpMyAdmin` 或 `mysqldump` 创建的备份文件。你可以按照软件写入的方式从文件进行还原。\n\n在某些情况下，你可能不想完全按照要还原的文件中所定义方式来还原数据库。你可能不想还原所有的表或所有数据。你可以编辑你正在还原的文件，以便\
  \ `Book III` 能够按照你想要的方式还原数据。例如，你可以注释掉 `Chapter 2` 中某个你不需要还原的表的结构和数据 SQL 语句。若要注释掉任何\
  \ SQL 语句，请在行的开头添加 `--`（两个连字符）。\n\n## MySQL\n\n## 升级 MySQL\n\n`MySQL` 的新版本会定期发布，你可以从一个\
  \ `MySQL` 版本升级到较新版本。你可以在 `MySQL` 手册中找到升级信息，地址为 `http://dev.mysql.com/doc/refman/5.0/en/upgrade.html`。\n\
  \n然而，升级时有一些特殊的考虑因素。作为预防措施，在升级之前，请备份当前的数据库，包括 `mysql` 数据库中的 `GRANT` 表。\n\n`MySQL`\
  \ 建议不要跳版本升级。如果你想从一个版本升级到高出一个版本以上的版本（例如从 `MySQL 4.0` 升级到 `MySQL 5.0`），你应该先升级到下一个版本。在该版本运行正常后，你可以升级到下一个版本，以此此类推。换句话说，先从\
  \ `4.0` 升级到 `4.1`，然后从 `4.1` 升级到 `5.0`。\n\n偶尔，`MySQL` 的新版本会引入不兼容的更改。某些版本引入了对 `GRANT`\
  \ 表结构的更改。例如，`MySQL 4.1` 了密码加密方法，要求在 `GRANT` 表中使用更长的密码字段。\n\n升级到新版本后，你应该运行 `mysql_upgrade`\
  \ 脚本。它会修复你的文件并在必要时升级系统表。在 `MySQL` `5.0.19` 之前的版本中，`mysql_upgrade` 脚本不在 Windows 上运行；它仅在\
  \ Unix 上运行。在 Windows 上，对于 `5.0.19` 之前的 `MySQL` 版本，你可以运行名为 `mysql_fix_privileges_tables`\
  \ 的脚本。该脚本会升级系统表，但不会执行 `mysql_upgrade` 执行的完整表检查和修复。\n\n## 第三章：设计与构建\n\n### 数据库\n\n\
  ### 本章\n* 规划你的数据库\n* 设计示例数据库\n* 构建你的数据库\n* 重构你的数据库\n\n创建数据库的第一步是设计它。在动手敲键盘创建数据库之前，你要先对其进行设计。规划可能是最重要的一步。如果在构建数据库并投入使用后才发现它没有包含所有所需的数据，或者没有提供你所需的数据关系，将是非常痛苦的。\n\
  \n完成数据库设计后，你就可以准备构建该数据库了。你根据开发的方案来创建数据库及其表。\n\n构建完成后，你就拥有了一个实用的空数据库，等待你填充数据。你可以在本微型书籍的第\
  \ 4 章中阅读有关添加和检索数据的知识。\n\n## 设计数据库\n设计数据库包括识别你需要的数据，并按照数据库软件要求的方式组织数据。\n\n### 选择数据\n\
  要设计数据库，你首先必须识别哪些信息属于其中。数据库必须包含网站实现其功能所需的数据。\n\n以下是几个例子：\n* 一个在线线目录需要一个包含产品信息的数据库。\n\
  * 一个在线线订单应用程序需要一个可以存放客户信息和订单信息的数据库。\n* 旅游网站需要一个包含目的地、预订、票价、时间表等信息的数据库。\n\n在许多情况下，你的应用程序可能包含一项从用户那里收集信息的任务。在网站上购物的客户必须提供他们的地址、电话号码、信用卡信息和其他数据以完成订单。这些信息必须至少保存到订单填写完毕。通常，网站会保留客户信息以方便未来的订单，这样客户在下一次下订单时就无需重新输入这些信息。这些信息还为运营网站的企业提供了营销机会，例如向客户发送营销优惠信息或时事通讯。\n\
  \n客户数据库可能会收集以下客户信息：\n* 姓名\n* 地址\n* 电话号码\n* 传真号\n* 电子邮件地址\n\n你必须平衡“收集所有你能想到的潜在有用信息的冲动”与“用户不愿提供个人信息”——以及他们对避免看起来过于耗时的表单的抵触之间的关系。\n\
  \n一种折中方案是要求一些可选信息。不介意的用户可以输入这些信息，但反对的用户可以留空表单的相应。你也可以提供激励措施：表单越长，你激励用户填写它所需的激励措施就越强。一个短表单可能会提供一次赢得好莱坞之旅的抽奖活动。\n\
  \n花时间列出一份你需要存储在数据库中的信息的完整清单。虽然你可以在开发数据库后对数据库进行更改和添加信息，但从一开始就包含这些信息更容易，避免更改数据库的额外工作。此外，如果你在数据库在使用后再添加信息，早期用户的信息是不完整的。例如，如果你修改表单现在询问用户的年龄，那么已经填写表单的用户就没有年龄。\n\
  \n### 组织数据\n`MySQL` 是一个 `RDBMS`（关系型数据库管理系统），这意味着数据被组织成表。（有关 `MySQL` 的更多信息请参见本微型书籍的第一章。）\n\
  \nRDBMS 表的组织方式与你熟悉的表相似——即行和列，如下表所示\n\n| 列 1 | 列 2 | 列 3 | 列 4 |\n| :--- | :--- |\
  \ :--- | :--- |\n| 行 1 | | | |\n| 行 2 | | | |\n| 行 3 | | | |\n| 行 4 | | | |\n\n\
  特定行和列交叉的单个单元格被称为字段。每个表的核心是一个对象（事物），你想存储关于它的信息。以下是一些对象的例子：\n* 客户\n* 书籍\n* 产品\n* 计算机\n\
  * 公司\n* 形状\n* 动物\n* 文档\n* 城市\n* 项目\n* 房间\n* 周\n\n### 构建\n你为每个对象创建一个表。表名应使用描述性单词或术语清楚地标识其包含的对象，并遵循以下指南：\n\
  * 名称必须是字符字符串，包含字母、数字、下划线或美元符号，但不包含空格。\n* 习惯上使用单数形式命名表。因此，客户表的名称可以是 `Customer`，而包含客户订单的表可以命名为\
  \ `CustomerOrder`。\n\n\n\n\n\n✦ 大小写在 Linux 和 Unix 上是有区别的，但在 Windows 上没有。`CustomerOrder`\
  \ 和 `Customerorder` 对 Windows 来说是相同的——但对 Linux 或 Unix 却不是。\n\n在数据库术语中，一个对象是一个 `entity`（实体），而实体拥有\
  \ `attributes`（属性）。在表中，每行代表一个 `entity`，而列则包含每个实体的 `attributes`。例如，在客户表中，每行包含单个客户的信息。列中包含的某些属性可能包括名、姓、电话号码和年龄。\n\
  \n按照以下步骤将数据组织成表格：\n\n1. **为数据库命名。**\n为你的应用程序分配一个数据库名称。例如，你可能会将包含某个社区住户信息的数据库命名为\
  \ `HouseholdDirectory`。\n\n2. **识别对象。**\n查看你想要存储在数据库中的信息列表（如前面的节所述）。分析你的列表并识别出对象。例如，`HouseholdDirectory`\
  \ 数据库可能需要存储以下内容：\n• 每个家庭成员的名字\n• 房屋地址\n• 电话号码\n• 每个家庭成员的年龄\n• 每个家庭成员最喜欢的早餐麦片\n\n\
  当你仔细分析此列表时，你会意识到你正在存储关于两个对象的信息：家庭和家庭成员。地址和电话号码通常针对家庭，但名字、年龄和最喜欢的麦片是针对每个特定家庭成员的。\n\
  \n3. **为每个对象定义并命名表。**\n例如，`HouseholdDirectory` 数据库需要一个名为 `Household` 的表和一个名为 `HouseholdMember`\
  \ 表。\n\n4. **识别每个对象的属性。**\n分析你的信息列表，并识别你为每个对象需要存储的属性。将要存储的信息拆分为最小的合理单元。例如，在表中存储人的姓名时，你可以将姓名拆分为名和姓。这样做可以让你能够按姓进行排序，如果将名和姓放在一起，这样做将变得困难。你甚至可以将名字拆分为名、中间名和姓，尽管没有多少应用程序需要单独使用中间名。\n\
  \n5. **为第 4 步中识别出的每个独立属性定义并命名列。**\n为每列给一个能清晰辨别该列中信息的名称。列名应该是一个单词，且没有空格。例如，你可能会有名为\
  \ `firstName` 和 `lastName` 的列，或者 `first_name` 和 `last_name`。\n\nMySQL 和 SQL 保留了一些单词供自身使用，你不能将这些单词用列名。这些单词目前用于\
  \ SQL 语句或预留供以后使用。你不能使用 `ADD`、`ALL`、`AND`、`CREATE`、`DROP`、`GROUP`、`ORDER`、`RETURN`、`SELECT`、`SET`、`TABLE`、`USE`、`WHERE`\
  \ 以及更多单词作为列名。完整的保留列表请参阅 `www.mysql.com` 上的在线 MySQL 手册。\n\n6. **识别主键。**\n表中的每行都需要一个唯一标识符。在设计表时，决定哪列存储唯一标识符，称为\
  \ `primary key`（主键）。在许多情况下，你会包含一个与另一个表的主键匹配的列。例如，在表 3-1 中，主键是 `cust_id`。\n\n7. **定义定义。**\n\
  在输入数据时可以为列定义默认值。例如，如果不提供值，MySQL 将分配默认值。\n\n8. **识别需要数据的列。**\n你可以指定某些列允许为 `NULL`（空）。\n\
  \n### 设计数据库\n设计良好的数据库将每条信息只存储在一个地方。存储在多个地方是低效的，而且如果你需要更改一处的信息但忘记更改另一处，就会产生问题。如果你发现自己在自己在几行中存储了相同的数据，你可能需要重新组织表格。例如，假设你正在存储关于书籍的数据，包括出版者的地址。当你输入数据时，你发现自己在许多行中输入相同的地址。更有效的方法是将书籍信息存储在一个表中，将出版社信息存储在另一个表中。你可以定义两个表：`Book`\
  \ 和 `BookPublisher`。在 `Book` 表中，你会有 `title`、`author`、`pub_date` 和 `price` 列。在 `BookPublisher`\
  \ 表中，你会有 `name`、`streetAddress` 和 `city` 等列。\n\n### 创建表之间的关系\n数据库中的某些表是相关的。通常情况下，一个表中的某行与另一个表中的几行相关。你需要在一个表中有一列来存储与另一个表主键匹配的数据。需要具有两个相关表的数据库常见应用程序是客户订单应用程序。例如，一个表包含客户信息，如\
  \ `name`、`address` 和 `phone`。每个客户可以有从零到多个订单。你可以将订单信息存储在带有客户信息的表中，但每当客户下单时，就会创建一个新行，且每个新行都包含客户的所有信息。你可以更高效地将订单存储在一个单独表中，可能命名为\
  \ `CustomerOrder`。（你不能仅将表命名为 `Order`，因为那是保留字）。在 `CustomerOrder` 表中，你包含一个包含来自 `Customer`\
  \ 表某行主键的列，这样订单就与 `Customer` 表中的正确行相关。这种关系如表 3-1 和表 3-2 所示。\n\n示例中的 `Customer` 表如表\
  \ 3-1 所示。每个客户都有唯一的 `cust_id`。相关的 `CustomerOrder` 表如表 3-2。它具有与 `Customer` 表中相同的 `cust_id`\
  \ 列。通过该列，`CustomerOrder` 表中的订单信息连接到 `Customer` 表中相关的客户姓名和电话号码。\n\n```\n表 3-2: CustomerOrder\
  \ 表示例数据\norder_no | cust_id | item_name | cost\n---|---|---|---\n87-222 | 27895\
  \ | T-Shirt | 20.00\n```\n\n\n\n\n\n| 87-223 | 27895 | Shoes | 40.00 |\n| 87-224\
  \ | 12345 | Jeans | 35.50 |\n| 87-225 | 34521 | Jeans | 35.50 |\n| 87-226 | 27895\
  \ | Hat | 15.00 |\n\n在此示例中，与 `Customer` 表和 `CustomerOrder` 表相关的列具有相同的名称。它们可以有不同的名称，只要这些列包含相同的数据即可。\n\
  \n# 存储不同类型的数据\n\nMySQL 根据你告诉 MySQL 预期的信息类型以不同的格式存储信息。MySQL 允许在不同的方式中使用不同类型的数据。主要数据类型是字符数据、数值数据以及日期和时间数据。\n\
  \n## 字符数据\n\n第三卷\n### 第 3 章\n\n最常见的数据类型是 `character` 数据（以字符字符串形式存储的数据），它只能在字符串中进行操作。你存储的大部分信息都是字符数据——例如，客户名称、地址、电话号码和宠物描述。你可以移动和打印字符数据。两个字符字符串可以组合在一起（拼接），可以从较长的字符串中选择子字符串，并且可以用一个字符串替换另一个。\n\
  \n字符数据可以以固定长度或变长长度格式存储：\n\n*   **固定长度格式**：在这种格式下，MySQL 为数据预留了固定空间。如果数据比固定长度长，则只存储符合条件的字符——末尾剩余的字符不会被存储。如果字符串比固定长度短，则多出的空间将留空并浪费。\n\
  *   **变长长度格式**：在这种格式下，MySQL 将字符串存储在与字符串长度相同的字段中。你指定一个字符串长度，但如果字符串本身比指定的长度短，MySQL\
  \ 只使用所需的空间，而不是将额外的空间留空。如果字符串比指定的空间长，则多出的字符不会被存储。\n\n如果字符字符串的长度变化很小，请使用固定长度格式。\n\n\
  例如，长度为十适用于所有的邮政编码，包括带有 ZIP+4 号的邮编。如果邮政编码不包含 ZIP+4 号，则只留五个空空格。然而，如果你的字符字符串变化超过几个字符，请使用变长长度格式来节省空间。例如，你的宠物描述可能是“小蝙”，也可能长达几行描述。通过以变长长度格式存储此描述，你只使用必要的空间。\n\
  \n## 数值数据\n\n另一种常见的数据类型是 `numerical` 数据——以数字形式存储的数据。你可以存储小数（例如 10.5, 2.34567, 23456.7）以及整数（例如\
  \ 1, 2, 248）。当你将数据存储为数字时，你可以在数值运算中使用该数据，例如加法、减法和平方。然而，如果你不计划将数据用于数值运算，你应该将其字符字符串存储，因为程序员将将其作为字符字符串使用。不需要转换。例如，你可能不需要相加用户电话号码中的数字，因此将电话号码存储为字符字符串。\n\
  \nMySQL 存储正数和负数，但你可以告诉 MySQL 只存储正数。如果你的数据永远为负数，请将数据存储为 `unsigned`（数字前不带 + 或 – 号）。例如，城市人口或文档的页数永远不会为负。\n\
  \nMySQL 提供了一种特定的数值列类型，称为 `auto-increment column`（自增列）。如果没有提供特定数字，该类型的列会自动填充顺序数字。例如，当添加一个表行并在自增列中输入\
  \ 5 时，下一行的该列将自动分配为 6，除非指定了不同的数字。当你需要唯一数字时（例如产品号或订单号），你可能会发现自增列非常实用。\n\n## 日期和时间数据\n\
  \n第三种常见的数据类型是日期和时间数据。存储为日期的数据可以用多种日期格式显示。你可以使用该数据来确定两个日期或两个时间之间的时间长度——或者特定日期或时间与任意日期或时间之间的时间。\n\
  \n## 枚举数据\n\n有时，数据只能有有限的值。例如，一个列的可能值可能是 yes 或 no。MySQL 提供了一种名为 `enumeration` 的数据类型用于此类类型的数据。你告诉\
  \ MySQL 列中可以存储哪些值（例如 yes 和 no），MySQL 不会在该列中存储任何其他值。\n\n# MySQL 数据类型名称\n\n当你创建一个数据库时，通过使用\
  \ MySQL 数据类型的名称告诉 MySQL 在特定列中期望什么类型的数据。表 3-3 显示了 Web 数据库应用程序中最常用的 MySQL 数据类型。\n\n\
  ### 表 3-3：MySQL 数据类型\n\n| MySQL 数据类型 | 说明 |\n| :--- | :--- |\n| `CHAR(length)` |\
  \ 固定长度字符字符串。 |\n| `VARCHAR(length)` | 变长字符字符串。 |\n| `TEXT` | 最大长度为 64K 的变长字符串。 |\n\
  | `INT(length)` | 整数，范围为 –2147483648 到 2147483647。 |\n| `INT UNSIGNED` | 整数，范围为\
  \ 0 到 4294967295。 |\n| `BIGINT` | 大整数。符号范围为 –9223372036854775808 到 9223372036854775807。\
  \ |\n| `DECIMAL(length, dec)` | 十进制，其中 `length` 是用于显示数字的字符数，`dec` 是允许的小位数。例如，12.34\
  \ 的 `length` 为 5，`dec` 为 2。 |\n| `DATE` | 带有年、月、日的日期值。显示格式为 YYYY-MM-DD（例如 2008-04-03）。\
  \ |\n| `TIME` | 带有时、分、秒的时间值。显示格式为 HH:MM:SS。 |\n| `DATETIME` | 日期和时间存储在一起。显示格式为 YYYY-MM-DD\
  \ HH:MM:SS。 |\n| `ENUM(\"val1\", \"val2\"...)` | 只可以存储列出的值。最多可以列出 65535 个值。 |\n\
  | `SERIAL` | `BIGINT UNSIGNED NOT NULL AUTO_INCREMENT` 的快捷名称。 |\n\nMySQL 允许许多不在表\
  \ 3-3 中的数据类型，但你可能并不不需要。有关可用数据类型的描述，请参阅 MySQL 在线手册：http://dev.mysql.com/doc/refman/5.0/en/data-types.html。\n\
  \n# 设计示例数据库\n\n在本节中，我们设计一个包含订单信息的示例数据库。我们将在本章以及本本书第 4 章中使用该数据库来展示如何构建和使用数据库。\n\n\
  创建你想为每个客户存储的以下信息列表：\n* 姓名\n* 地址\n* 电话号码\n* 传真号码\n* 电子邮件地址\n\n此外，你需要在客户下单时收集产品信息。对于每个订单，你需要收集以下信息：\n\
  * 下单日期\n* 订单中每个项目的的产品信息\n\n在此示例中，产品是 T 恤。因此，对于每个项目你需要以下信息：\n* 识别特定产品的编号（例如目录号）\n\
  * 尺码\n* 价格\n* 颜色\n\n\n\n\n你通过遵循本章早期“组织数据”部分介绍的步骤来设计数据库：\n\n1. **命名你的数据库。**\n订单信息数据库命名为\
  \ `CustomerOrderInformation`。*\n\n2. **识别对象。**\n信息列表如下：\n* 客户名称\n* 客户地址\n* 电话号码\n\
  * 传真号码\n* 电子邮件地址\n* 订单日期\n* 指定产品的编号（例如目录号）\n* 尺寸\n* 颜色\n* 价格\n\n前六项信息属于客户，因此对象是\
  \ `Customer`。订单日期属于订单，因此另一个对象是 `CustomerOrder`。剩余的信息属于订单中的每个项目，因此对象是 `OrderItem`。\n\
  \n3. **为每个对象定义并命名表。**\n`CustomerOrderInformation`数据库需要一个名为 `Customer` 的表。\n`CustomerOrderInformation`数据库需要一个名为\
  \ `CustomerOrder` 的表。\n`CustomerOrderInformation`数据库需要一个名为 `OrderItem` 的表。\n\n4.\
  \ **识别每个对象的属性。**\n详细查看信息列表：\n* **ID：** 一个属性（每个客户的 ID）。\n* **名称：** 两个属性（名字和姓）。\n\
  * **地址：** 四个属性（街道地址、城市、州和邮编）。\n* **电话号码：** 一个属性。\n* **传真号码：** 一个属性。\n* **电子邮件地址：**\
  \ 一个属性。\n* **订单号：** 一个属性（每个订单的 ID）。\n* **指定产品的编号（如目录号）：** 一个属性。\n* **尺寸：** 一个属性。\n\
  * **颜色：** 一个属性。\n* **价格：** 一个属性。\n\n5. **定义并命名列。**\n`Customer` 表每个客户有一行，列如下：\n*\
  \ `customerID`\n* `firstName`\n* `lastName`\n* `street`\n* `city`\n* `state`\n*\
  \ `zip`\n* `email`\n* `phone`\n\n`CustomerOrder` 表每个订单有一行，列如下：\n* `CustomerID`：此列链接到\
  \ `Customer` 表。该值在 `Customer` 表中是唯一的，但在表中不是唯一的。\n* `orderID`\n* `orderDate`\n\n\
  `OrderItem` 表订单中的每个项目有一行，列包括：\n* `catalogID`\n* `orderID`：此列链接到 `CustomerOrder`\
  \ 表。该值在 `CustomerOrder` 表中是唯一的，但在表中不是唯一的。\n* `size`\n* `color`\n* `price`\n\n6.\
  \ **识别主键。**\n`Customer` 表的主键是 `customerID`。因此，`customerID` 必须是唯一的。`CustomerOrder`\
  \ 表的主键是 `orderID`。`OrderItem` 表的主键是 `orderID` 和 `catalogID`。\n\n7. **定义默认值。**\n\
  任何表都没有定义默认值。\n\n8. **识别强制列。**\n以下列永远不允许为空：\n* `customerID`\n* `orderID`\n* `catalogID`\n\
  这些是主键列。在表中不允许缺少这些值的行。\n\n9. **决定存储每个属性的数据类型。**\n* **数值：** `CustomerID` 和 `orderID`\
  \ 是数值类型。\n* **日期：** `OrderDate` 是日期类型。\n* **字符：** 所有剩余字段都是字符类型。\n\n### 记录你的设计\n\
  你可能花费了大量时间为你的数据库做设计决策。在此时，这些决策已经牢牢固定在你的脑海中。你可能认为不会忘记。但假设发生了危机；你有两个月没有回到这个项目。如果你没有记录最初做出的决策，你就必须重新分析数据并做出所有的设计决策。*现在就写下来。*\n\
  \n记录表的结构、列名以及所有设计决策。你的文档应该以表格格式描述每个表，每个列一行，每个设计决策一列。例如，你的列应该是列名、数据类型和描述。名为 `CustomerOrder\
  \ Information` 的数据库示例设计中的三个表记录在表 3-4、表 3-5 和表 3-6 中。\n\n### 表 3-4：Customer 表\n|\
  \ 列名 | 类型 | 描述 |\n| :--- | :--- | :--- |\n| `customerID` | `SERIAL` | 客户唯一 ID（主键）\
  \ |\n| `lastName` | `VARCHAR(50)` | 客户姓 |\n| `firstName` | `VARCHAR(40)` | 客户名 |\n\
  | `street` | `VARCHAR(50)` | 客户街道地址 |\n| `city` | `VARCHAR(50)` | 客户城市 |\n| `state`\
  \ | `CHAR(2)` | 客户州 |\n| `zip` | `CHAR(10)` | 客户邮编 |\n| `email` | `VARCHAR(50)`\
  \ | 客户电子邮件 |\n| `fax` | `CHAR(15)` | 客户传真号码 |\n| `phone` | `CHAR(15)` | 客户电话号码 |\n\
  \n#### 表 3-5：CustomerOrder 表\n| 列名 | 类型 | 描述 |\n| :--- | :--- | :--- |\n| `orderID`\
  \ | `SERIAL` | 用户的唯一 ID（主键） |\n| `customer` | `BIGINT` | 订单的客户 ID |\n| `orderDate`\
  \ | `DATETIME` | 订单下单日期时间 |\n\n### 表 3-6：OrderItem 表\n| 列名 | 类型 | 描述 |\n| :--- |\
  \ :--- | :--- |\n| `catalogID` | `VARCHAR(15)` | 产品编号（主键） |\n| `orderID` | `BIGINT`\
  \ | 包含此项目的订单 ID |\n| `color` | `VARCHAR(10)` | 项目颜色 |\n| `size` | `VARCHAR(10)`\
  \ | 项目尺寸 |\n| `price` | `DECIMAL(9,2)` | 项目价格 |\n\n\n\n在此查询中，将 `databasename` 替换为你为数据库命名的名称。例如，要创建本章设计的示例数据库，请以下\
  \ SQL 语句：\n\n```sql\nCREATE DATABASE CustomerOrderInformation\n```\n\n某些 Web 托管公司不允许你创建新数据库。`Book\
  \ III` 主机为你提供了指定数量的数据库（例如一个或五个）供 `Chapter 3` 配合 MySQL 使用，且你只能在指定的数据库中创建表。你可以尝试请求额外的数据库，但你需要一个充分的理由。MySQL\
  \ 和 PHP 并不在乎所有的表是否都在一个数据库中，而不是将它们组织到具有意义名称的多个数据库中。当项目得到良好组织时，人类可以更容易跟踪项目。\n\n如果已经存在与你指定的相同的数据库，系统将返回错误信息。你可以通过在查询中使用\
  \ `IF` 子句来避免此错误信息，如下所示：\n\n```sql\nCREATE DATABASE IF NOT EXISTS CustomerOrderInformation\n\
  ```\n\n使用此语句，如果数据库不存在则会创建它，但如果数据库已经存在，语句也不会失败。它只是不会创建新数据库。\n\n要亲眼确认数据库是否确实已创建，请使用\
  \ `SHOW DATABASES` SQL 查询。在你创建一个空数据库后，可以向其中添加表。（查看本章稍后的“向数据库添加表”章节。）\n\n### 构建数据库\n\
  \n## 使用 phpMyAdmin 创建空数据库\n\n要创建一个新的空数据库，请遵循以下步骤：\n\n只要你具有 `DROP` 权限，就可以删除任何数据库。当你删除数据库时，该数据库中的所有表和数据也会被删除。\n\
  \n### 使用 SQL 查询删除数据库\n\n你可以使用以下 SQL 查询删除数据库：\n\n```sql\nDROP DATABASE databasename\n\
  ```\n\n请谨慎使用 `DROP`，因为它是不可逆的。删除数据库后，该数据库将永久消失。其中的任何数据也会之消失。\n\n如果数据库不存在，将返回错误信息。你可以通过以下查询防止错误信息：\n\
  \n```sql\nDROP DATABASE IF EXISTS databasename\n```\n\n如果该数据库存在，此查询将删除该数据库。如果不存在，则不会发生错误。查询将静默结束。\n\
  \n### 使用 phpMyAdmin 删除数据库\n\n你可以使用 `phpMyAdmin` 删除数据库。只需遵循以下步骤：\n\n1. 在 `phpMyAdmin`\
  \ 主页面上，向下滚动到 `Create New Database`（创建新数据库）标题。该标题位于主面板的左侧列。\n2. 在空白字段中输入数据库名称。\n\
  3. 点击 `Create`（创建）。\n\n会出现一个页面，顶部有以下语句：Database `databasename` has been created。页面的一个部分显示了所使用的\
  \ SQL 查询。SQL 查询部分下方，页面显示消息：`No tables found in database.`（数据库中未找到表）。该消息下方有字段，你可以使用它们立即创建表。创建表的细节将在本章稍后的“向数据库添加表”章节中讨论。\n\
  \n（注：此处由于原文逻辑略有跳调，已按原文逻辑完整翻译）\n\n## 向数据库添加表\n\n你可以向任何数据库添加表，无论它是你刚刚创建的空数据库，还是已有表和数据的现有数据库。允许的表名的规则在本章较早的“组织数据”部分进行了解释。当你在数据库中创建表时，数据库目录会添加一个名为\
  \ `tablename.frm` 的文件。\n\n当你创建表时，会包含表定义。你定义每一列——为它命名、分配一个数据类型，并指定任何其他所需的定义。以下是经常为列指定的某些定义：\n\
  \n* `NOT NULL`：此列必须有值；不能为空。\n* `DEFAULT value`：如果在创建行时没有为列提供其他值，则将此 `value` 存储在列中。\n\
  * `AUTO_INCREMENT`：此定义创建一个序列号。随着每一行的添加，此列的值将比上一个输入行增加一个整数。你可以通过为列分配特定值来覆盖自动计数数字。\n\
  * `UNSIGNED`：此定义表示此数值字段的值永远不会是负数。\n\n你还需要指定每行的唯一标识符——`primary key`（主键）。表必须有一个字段或字段组合，它对于每行都是不同的。没有两个行可以具有相同的主键。如果你尝试添加一个与表中已有行具有相同主键的行，将收到错误信息，且该行不会被添加。\n\
  \n偶尔，你可能想要创建一个与现有表结构相同的表。\n\n### 使用 SQL 查询向数据库添加表\n\n你可以使用 `CREATE` 查询向数据库添加表。查询以\
  \ `CREATE TABLE` 语句开始，如下：\n\n```sql\nCREATE TABLE tablename\n```\n\n然后，你添加一个带有定义的列名列表。用逗号将每列的信息与下一列的信息隔开。将整个列表括在括号中。在每个列名后跟随其数据类型和任何其他定义。\n\
  \n`CREATE TABLE` 查询的最后项指示哪个列或列组合是主键。你通过以下格式指定主键：\n\n```sql\nPRIMARY KEY(columnname)\n\
  ```\n\n将 `columnname` 括在括号中。如果你使用列组合作为主键，请将所有列包含在括号内并用逗号分隔。例如，你可以将主键指定为 `PRIMARY\
  \ KEY (columnname1, columnname2)`。\n\n完整的 `CREATE TABLE` 查询具有以下格式：\n\n```sql\nCREATE\
  \ TABLE tablename (\ncolumnname datatype1 definition2 ...,\ncolumnname datatype1\
  \ definition2 ...,\n...,\nPRIMARY KEY(columnname)\n)\n```\n\n列表 3-1 显示了用于创建 `CustomerOrderInformation`\
  \ 数据库中的 `Customer` 表的 `CREATE TABLE` 查询。如果你愿意，可以单行输入此查询。MySQL 不在乎你使用多少行。列表 3-1 这种易读的格式也有助于你发现拼写错误。\n\
  \n列表 3-1：创建表的 SQL 查询\n```sql\nCREATE TABLE Customer (\nCustomerID SERIAL,\nlastName\
  \ VARCHAR(50),\nfirstName VARCHAR(40),\nstreet VARCHAR(50),\ncity VARCHAR(50),\n\
  state CHAR(2),\nzip CHAR(10),\nemail VARCHAR(50),\nphone CHAR(15),\nfax CHAR(15),\n\
  PRIMARY KEY(customer)\n)\n```\n\n记住不要在列名中使用任何 MySQL 保留字，正如我们在本章较早的“组织数据”部分讨论的那样。如果你在列名中使用保留字，MySQL\
  \ 会给你一个类似下所示错误信息：\n\n```\nYou have an error in your SQL syntax near ‘order var(20))’\
  \ at line 1\n```\n\n\n\n\n此错误消息显示了它不接受的列定义以及发现该错误定义的行。然而，该消息并没有告诉你问题究竟是什么。你的 SQL\
  \ 语法中被它引用的错误是将 MySQL 保留字 `order` 用作了列名。\n\n如果你尝试创建一个已经存在的表，就会收到错误消息。你可以通过使用以下 `CREATE`\
  \ 查询来防止此错误消息出现：\n\n```sql\nCREATE TABLE IF NOT EXISTS tablename\n```\n\n## 第三卷\n\
  \n如果表不存在，该查询将创建它。如果表已经存在，`Chapter 3` 查询不会创建它，但也不会返回错误消息。\n\n### 构建数据库\n\n### 设计\n\
  \n你可以按照如下方式创建一个新表，使其与现有表完全相同（具有相同的结构）：\n\n```sql\nCREATE TABLE tablename LIKE oldtablename\n\
  ```\n\n创建的新表 `tablename` 具有与 `oldtablename` 相同的字段和定义。即使旧表包含数据，新表也不包含这些数据，仅包含结构。\n\
  \n创建表后，你可以查询以查看它、检查其结构或将其删除。\n\n*   要查看已添加到数据库的表，请使用此查询：`SHOW TABLES`\n*   要查看表的结构，请使用此查询：\n\
  \n```sql\nEXPLAIN tablename\n```\n\n![Image 36](img/index-343_1.jpg)\n\n### 使用 phpMyAdmin\
  \ 向数据库添加表\n\n要使用 phpMyAdmin 创建表，请按照以下步骤操作：\n\n1. **从数据库下拉列表中选择一个数据库。** 打开数据库页面。\n\
  2. **定位到数据库 `databasename` 上的 Create New Table（创建新表）部分。**\n3. **在 Name（名称）字段中输入新表的名称。**\n\
  4. **在 Number of Fields（字段数量）字段中输入新表所需的字段数量。**\n5. **点击 Go 按钮.** 打开一个页面，你可以在其中定义所有字段，如图\
  \ 3-1 所示。\n6. **逐个定义所有字段。** 每个字段都在表的一行中。对每个字段执行以下操作：\n    *   在 Field（字段）列中输入字段名称。\n\
  \    *   在 Type（类型）列的下拉列表中选择日期类型。\n    *   如果数据类型（如 `VARCHAR`）需要长度，在 Length（长度）列中输入数字。\n\
  \    *   在 Null（空）列的下拉列表中选择 `NULL` 或 `NOT NULL`。\n    *   如果你想设置默认值，在 Default（默认）列中输入你想使用的默认值。\n\
  \    *   如果该字段是主键，选择列标题带有密钥图标的第一个单选按钮。\n7. **点击位于最后一个表定义行下方的 Save（保存）按钮。** 打开表页面，顶部显示如下消息：Table\
  \ `databasename`.`tablename` 已创建。该页面还显示了用于创建该表的 SQL 查询。在此查询下方，有一个部分提供了一个包含所有字段及其定义的表格。如果需要，你可以在此时间点添加或删除字段，或更改任何定义。\n\
  8. **要添加更多表，点击左侧面板中的数据库名称。然后对每个表重复步骤 2 到 7。**\n\n你也可以创建一个现有表副本的副本表。只需遵循以下步骤即可：\n\
  \n1. **打开你想要复制的表的页面。** 点击左侧面板中的表名。如果未选择数据库，请从数据库下拉列表中选择正确的数据库 `Book III`。\n\n###\
  \ 第 3 章\n\n你选择的表的表页面将打开。\n\n2. **点击页面顶部的 Operations（操作）。** 打开 Operations 页面。\n3.\
  \ **向下滚动到 Copy Table to (`database.table`)（复制表到）部分。**\n4. **在 Copy 部分顶部的下拉列表中选择你想要创建表的数据库。**\n\
  5. **在下拉列表右侧的字段中，输入你想给新表命名的名称。**\n6. **选择 Structure Only（仅结构）单选按钮。**\n7. **点击 Go\
  \ 按钮。** 显示一个页面，顶部显示如下消息：Table `tablename` 已复制到 `tablename`。\n\n当创建新表的数据库页面打开状态时，新表将列在左侧面板中。当你点击新表名时，将打开表页面，显示与你复制的表中相同的字段。\n\
  \n## 删除表\n\n你可以删除一个表，无论它是空的还是包含数据的。在执行之前，请确保你确实想要删除该表。\n\n删除表是不可逆的。删除一个表后，该表就消失了。其中的任何数据也会消失。\n\
  \n### 使用 SQL 查询删除表\n\n要删除任何表，请使用此查询：\n\n```sql\nDROP TABLE tablename\n```\n\n###\
  \ 使用 phpMyAdmin 删除表\n\n显示包含你想删除的表的数据库页面。你可以通过从下拉列表中选择数据库或点击左侧面板中的数据库名称来显示该页面。数据库中包含的表显示在一个表格中。表格的第二列标记为\
  \ Action（操作），显示了你可以对表执行的操作的图标。最后一个图标是一个红色的 X。点击此图标即可删除表。\n\n## 更改数据库结构你的你的数据库并不是一成不变的。你可以更改任何表的名称；在任何表中添加、删除或重命名列；或者更改任何列的数据类型或其他属性。\n\
  \n更改数据库并不是罕见发生。你可能因为许多原因想要更改你的数据库。例如，假设你在一个包含公司所有员工姓名的数据库中将列 `lastName` 定义为 `VARCHAR(20)`。此时，20\
  \ 个字符对于姓来说似乎足够了。但你刚刚收到了一份宣布新首席执行官 John Schwartzheimer-Losertman 的备忘录。哎，MySQL 将他的名字截断为前\
  \ 20 个字母，Schwartzheimer-er —— 老板。\n\n所以你需要立即加宽该列——刻刻。\n\n### 使用 SQL 查询更改数据库结构\n\n\
  你可以使用 `ALTER` 查询来更改数据库结构。该查询的基本格式为 `ALTER TABLE tablename,`，后跟指定的更改。表 3-7 显示了你可以做的更改。\n\
  \n**表 3-7：使用 ALTER 查询可以做的更改**\n\n| 更改 |  |\n| :--- | :--- |\n| `ADD columnname`\
  \ | 添加一个列；`definition` 包含数据类型和可选定义。 |\n| `ALTER columnname SET DEFAULT value` |\
  \ 更改列的默认值。 |\n| `ALTER columnname DROP DEFAULT` | 移除列的默认值。 |\n| `CHANGE columnname\
  \ newcolumnname definition` | 更改列的定义并重命名列；`definition` 包含数据类型和可选定义。 |\n| `DROP columnname`\
  \ | 删除列，包括该列的所有数据。 |\n| `MODIFY columnname definition` | 更改列的定义；`definition` 包含数据类型和可选定义。\
  \ |\n| `RENAME newtablename` | 重命名表。 |\n\n\n\n\n你可以使用 phpMyAdmin 的功能更改数据库结构。首先，打开显示所有表字段及其定义的页面。你可以通过点击左侧面板中的表名来打开此页面。如果没有选择包含该表的数据库，你必须先从左侧面板的\
  \ `Database` 下拉列表中选择它进行选择。\n\n`Table` 页面显示所选表中的所有字段。每个字段显示在单独的一行中。每行的最后一列标记为 `Action`，包含多个可以对该字段执行的操作的图标。要更改该字段，请点击铅笔图标。\n\
  \n### 更改数据库结构\n\n你可以一次更改多个字段。勾选想要更改的所有字段名称前的复选框。然后，点击表下方的铅笔图标。\n\n点击铅笔图标后，会打开一个页面，显示你选择的字段，其中名称和属性位于你可以更改的字段中。\n\
  \n这些是你设置表时定义列所使用的相同字段，如图 3-1 所示。进行你需要的任何更改。\n\n当所有字段都按照你的要求设置完成后，点击表下方的 `Save` 按钮。`Table`\
  \ 页面重新出现，并显示新的字段定义。\n\n## 第 4 章：使用数据库\n\n### 本章内容\n\n- 在数据库中存储数据\n- 从数据库中查看和检索数据\n\
  - 更新数据\n- 删除数据\n\n空的数据库就像一个空的饼干罐——你从从中得不到任何东西。搜索空数据库并不比搜索空的饼干罐更有趣，也更有收获。数据库的有用性仅取决于它所包含的信息。\n\
  \n数据库需要能够接收信息进行存储，并根据请求交付信息。例如，`CustomerOrderInformation` 数据库需要能够接收客户和订单信息，并在你请求时交付其存储的信息。例如，如果你想知道特定客户的地址或特定订单的日期，数据库需要在你请求时交付该条信息。\n\
  \n你的 `MySQL` 数据库响应四种类型的请求：\n\n- ✦ **添加信息：** 向表中添加新行。\n- ✦ **更新信息：** 修改现有行中的信息。这包括向现有行的空白字段中添加数据。\n\
  - ✦ **检索信息：** 查看数据。此请求不会从数据库中删除数据。\n- ✦ **移除信息：** 从数据库中删除数据。\n\n有时，你的问题需要来自多个表的信息。\n\
  \n例如，问题“客户 Joe Smith 在 4 月和 12 月期间下了多少个订单？”需要来自多个表的信息。你可以通过组合多个表，在单个 `SELECT` 查询中轻松地提出这个问题。\n\
  \n你可以通过 `SQL` 查询或 `phpMyAdmin` 功能与数据库交互，正如本微型书籍第 1 章讨论的那样。本章解释了如何使用 `SQL` 查询或 `phpMyAdmin`\
  \ 功能向你的数据库中添加、查看、检索、更新和删除信息。\n\n### 向数据库中添加信息\n\n每个数据库都需要数据。例如，你可能想向数据库中添加数据，以便用户查看。或者，你可能想创建一个空数据库供用户输入数据。在哪种情况下，数据都会被添加到数据库中。\n\
  \n如果你的数据仍在纸上，你可以通过 `SQL` 查询逐行地将其直接输入到 `MySQL` 数据库中。然而，如果你有大量数据，这个过程可能会很枯燥并涉及大量打字。假设你有关于\
  \ 1,000 个产品的信息必须添加到数据库中。假设你打字速度快如闪电，每分钟可以输入一行，那么就是 16 小时的快速打字——准确地说，是快速编辑。虽然可行，但不无趣。另一方面，假设你需要将一个组织的\
  \ 5,000 名成员输入数据库，输入每个成员需要五分钟。现在你面对的是超过 400 小时的打字工作——谁有时间做那个？\n\n如果你有大量数据要输入，请考虑一些替代方案。\n\
  \n有时扫描数据是一个选项。或者你可能需要请求、借用或雇佣帮助。在许多情况下，将数据输入到一个大文本文件中比在每个单独的 `SQL` 查询中输入每一行要快。\n\
  \n`SQL` 查询 `LOAD` 可以从大文本文件（甚至是小文本文件）中读取数据。因此，如果你的数据已经在计算机文件中，你就可以处理该文件；你不需要重新输入所有数据。即使数据不是文本文件格式（例如在\
  \ Excel、Access 或 Oracle 文件中），你通常也可以将文件转换为大文本文件，然后将其读取到你的 `MySQL` 数据库中。如果数据还没有计算机文件中且数据很多，先将数据以大文本文件的形式输入计算机，然后在第二步将其传输到\
  \ `MySQL` 可能更快。\n\n大多数文本文件都可以读取到 `MySQL`，但某些格式比其他格式更容易读取。如果你计划将数据输入大文本文件，请找到最佳格式。\n\
  \n### 一次添加一行\n\n如果你只有少量数据，可以一次向表添加一行。PHP 脚本通常需要一次添加一行。例如，当 PHP 脚本接收来自客户的数据时，它通常需要将信息以新行的形式存入数据库。\n\
  \n#### 在 SQL 查询中添加行数据\n\n你使用 `INSERT` 查询向数据库添加新行。该查询告诉 MySQL 要向哪个表添加该行，以及字段的取值是什么。该查询的通用格式为：\n\
  \n```\nINSERT INTO tablename (columnname, columnname,...,columnname) VALUES (value,\
  \ value,...,value)\n```\n\n以下规则适用于 `INSERT` 查询：\n\n- ✦ **值的列出顺序必须与列名的列出顺序相同。** 值列表中的第一个值被插入到列列表中的第一个列中；值列表中的第二个值被插入到第二个列中；以此此类推。\n\
  - ✦ **允许列出部分列名列表。** 你不需要列出所有列。未列出的列将赋予其默认值，或者如果没有定义默认值，则留空。记住，任何定义为 `NOT NULL` 的列必须包含值，否则查询将失败。\n\
  - ✦ **不要求列出列名。** 如果你正在为所有列输入值，则完全不需要列出列。如果没有列出列，MySQL 将按照它们在表中出现的顺序查找所有列的值。\n- ✦\
  \ **列列表和值列表的长度必须相同。** 如果列列表比值列表长或短，你会得到这样的错误消息：列数与值数不匹配（Column count）。\n\n以下 `INSERT`\
  \ 查询向 `Customer` 表添加了一行：\n\n```\nINSERT INTO Customer (lastName, street,city,state,zip,email,phone,fax)\n\
  VALUES (“Contrary”,”1234 Garden St”,”Garden”,”NV”,”88888”,“maryc@hergarden.com”，“(555)\
  \ 555-5555”,””)\n```\n\n注意 `firstName` 没有在列名列表中。`firstName` 字段没有输入值。如果 `firstName`\
  \ 被定义为 `NOT NULL`，MySQL\n\n\n\n\n不会允许这样做。此外，如果 `firstName` 的定义包含默认值，则会输入默认值，但由于它没有包含，该字段将留空。请注意\
  \ `fax` 存储的值是一个空字符串。\n\n要查看你输入的数据并确保输入正确，请使用 SQL 查询从数据库中检索数据。我们将在本章后尾的“从数据库中检索信息”部分详细阐述这些\
  \ SQL 查询。简而言之，以下查询将检索 `Customer` 表中的所有数据：\n\n```sql\nSELECT * FROM Customer\n```\n\
  \n![Image 37](img/index-351_1.jpg)\n\n# 向数据库添加信息\n\n## 使用 phpMyAdmin 添加数据行\n\n你可以通过使用\
  \ phpMyAdmin 的功能并向字段中输入内容来添加行数据，具体如下：\n\n1. **打开你想要输入数据的数据库页面。**\n   如果数据库名称显示在左侧面板中，请点击数据库名称，或者从数据库下拉列表中选择它。数据库页面会显示数据库中所有表的列表，每行一个表，如图\
  \ 4-1 所示。\n\n2. **点击你想要插入数据的表的“插入”图标。**\n   该行的第二列标记为 `Action`。第四个图标显示箭头指向某些数据，这就是\
  \ `Insert` 图标。\n   点击 `Insert` 图标时，会打开一个页面，你可以在字段中输入值，如图 4-2 所示。\n\n**图 4-1:** phpMyAdmin\
  \ 数据库页面。\n![Image 38](img/index-352_1.jpg)\n\n**图 4-2:** phpMyAdmin 数据输入页面。\n\n\
  3. **在 Value 列的字段中输入值。**\n   如果你需要，可以同时输入行。第二行的字段显示在第一行字段之后（图 4-2 未显示）。你可以选择第二行字段上方的\
  \ `Ignore`（忽略）复选框仅输入一行。\n\n4. **在数据输入行下方的左侧下拉列表中，选择 Insert as New Row（插入新行）。****\n\
  \n5. **在右侧下拉列表中，选择 Go Back to Previous Page（返回上一页）选项或 Insert Another New Row（插入另一行新行）选项。**\n\
  \n6. **点击 Go（执行）按钮。**\n   如果你的数据输入存在错误，可以点击 `Reset`（重置）按钮将值置为空并重新输入数据。\n\n数据库页面再次显示，顶部有以下消息：`Inserted\
  \ rows: 1`（插入行：1）。消息下方显示了执行插入行的 SQL 查询。查询下方再次列出了表。\n\n7. **如果你想查看表中的数据，点击表行 Action\
  \ 列中的 Browse（浏览）图标。**\n   `Browse` 图标是第一个图标，显示项目列表（参考图 4-1）。当你点击 `Browse` 图标时，会打开一个页面显示表中所有数据的列表。\n\
  \n## 添加大量数据\n\n如果你有大量数据需要输入且这些数据已在计算机文件中，你可以将数据从现有的计算机文件传输到数据库。由于数据库中的数据是按行和列组织的，因此读取的文本文件必须指明每列数据的开始和结束位置，以及一行的结束位置。\n\
  \n为了指示列，使用特定字符分隔每列的数据。默认情况下，MySQL 寻找制表符（tab）来分隔字段。然而，如果制表符对你的数据文件不起作用，你可以选择不同的字符来分隔字段，并告诉\
  \ MySQL 使用不同制表符的字符来分隔字段。同样默认情况下，行尾是行的结束——尽管如果你需要，你可以选择一个字符来指示行尾。`Inventory` 表的数据文件可能如下：\n\
  \n```\nClassic\tSteely Dan\t10.99\nPop\tAll Chemistry\t11.99\nClassic\tAbbey Road\t\
  9.99\n```\n\n字段之间带有制表符的数据文件是制表符分隔文件。另一种常见格式是逗号分隔文件，用逗号分隔字段。如果你的数据是其他格式，你需要将它转换为分隔文件。要将另一个软件文件中的数据转换为分隔文件，请查看该软件的手册，或咨询了解数据当前格式的本地专家。许多程序（如\
  \ Excel、Access 和 Oracle）都允许你将数据输出为分隔文件。对于文本文件，你可能可以使用编辑器或文字处理器的“查找替换”功能将其转换为分隔格式。对于真正棘手的文件，你可能需要程序员的帮助。\n\
  \n你可以通过在包含字段分隔符但之间不留数据的情况下，在数据文件中留空某个字段。如果该字段未定义为 `NOT NULL`，则该字段为空。如果该字段被定义为 `NOT\
  \ NULL`，则加载数据文件将失败并返回错误消息。\n\n## 使用 SQL 查询从文件添加数据\n\n假设你有大量数据需要输入且这些数据已在计算机文件中，你可以将数据从现有的计算机文件传输到数据库。由于数据库中的数据是按行和列组织的，因此读取的文本文件必须指明每列数据的开始和结束位置，以及一行的结束位置。\n\
  \n为了指示列，使用特定字符分隔每列的数据。默认情况下，MySQL 寻找制表符（tab）来分隔字段。然而，如果制表符对你的数据文件不起作用，你可以选择不同的字符来分隔字段，并告诉\
  \ MySQL 使用不同制表符的字符来分隔字段。同样默认情况下，行尾是行的结束——尽管如果你需要，你可以选择一个字符来指示行尾。`Inventory` 表的数据文件可能如下：\n\
  \n```\nClassic\tSteely Dan\t10.99\nPop\tAll Chemistry\t11.99\nClassic\tAbbey Road\t\
  9.99\n```\n\n字段之间带有制表符的数据文件是制表符分隔文件。另一种常见格式是逗号分隔文件，用逗号分隔字段。如果你的数据是其他格式，你需要将它转换为分隔文件。要将另一个软件文件中的数据转换为分隔文件，请查看该软件的手册，或咨询了解数据当前格式的本地专家。许多程序（如\
  \ Excel、Access 和 Oracle）都允许你将数据输出为分隔文件。对于文本文件，你可能可以使用编辑器或文字处理器的“查找替换”功能将其转换为分隔格式。对于真正棘手的文件，你可能需要程序员的帮助。\n\
  \n你可以通过在包含字段分隔符但之间不留数据的情况下，在数据文件中留空某个字段。如果该字段未定义为 `NOT NULL`，则该字段为空。如果该字段被定义为 `NOT\
  \ NULL`，则加载数据文件将失败并返回错误消息。\n\n\n\n\n要查看你加载的数据——以确保其正确性——请使用从数据库中检索数据的 SQL 查询。我们将在稍后的章节“查看数据库中的数据”中详细描述这些类型的\
  \ SQL 查询。\n\n简而言之，使用以下查询查看表中的所有数据以便你进行检查：\n\n```sql\nSELECT * FROM Customer\n```\n\
  \n### 使用 phpMyAdmin 从数据文件添加数据\n\n你可以使用 phpMyAdmin 的导入功能将数据从文件加载到表中，步骤如下：\n\n1. **点击左侧面板中的表名打开表（Table）页面。**\n\
  如果没有选择数据库，你需要从 `Database` 下拉列表中选择数据库。\n\n2. **点击 Import（导入）选项卡。**\n将打开 `Import`\
  \ 页面。\n\n3. **在 File to import（要导入的文件）部分，点击 Browse（浏览）按钮并导航到数据文件。**\n\n4. **向下滚动到\
  \ Format of Imported File（导入文件格式）部分并点击 `CSV` 单选按钮。**\n你必须在 `Table` 页面点击 `Import`\
  \ 选项卡才能看到此选项。如果你在 `Database` 页面点击 `Import` 选项卡，将无法看到 `CSV` 选项。\n当你点击 `CSV` 单选按钮时，会出现\
  \ `CSV` 相关选项。\n\n5. **如有必要，设置 CSV 选项值。**\n分隔字段的字符默认为 `;`（分号）。如果你的数据文件包含不同的分隔符（例如逗号），你可以对其进行更改。如果你的数据文件字段是用制表符（tab）分隔的，请输入\
  \ `\\t`。\n\n6. **如有必要，输入列名列表。**\n如果数据文件中的字段顺序与数据库表相同，你可以留空列名。如果你只输入部分列，或者需要更改列的顺序，可以在\
  \ `columns` 字段中填写用逗号分隔的列名列表。\n\n7. **点击 Go（执行）按钮。**\n`Import` 页面将重新显示，并在顶部显示以下消息：`Import\
  \ has been successfully finished, 3 queries executed.`。在消息下方，页面将显示用于插入数据的执行语句。\n\
  \n### 查看数据库中的数据\n\n在数据输入数据库后，你可能想要浏览数据，以查看输入的数据是否正确，或者了解数据库中数据类型类型。你也可以通过浏览数据来确定有关数据库的简单信息，例如它包含多少条记录。\n\
  \n#### 使用 SQL 查询浏览数据\n\n你可以使用以下查询查看表中的所有数据：\n\n```sql\nSELECT * FROM tablename\n\
  ```\n此查询获取表中的所有数据。你可以通过浏览输出结果发现表中有多少条记录，并对数据有一个大致的了解。\n\n**第三卷**\n\n## 第 4 章\n\n\
  你可以通过以下查询精确查看表中到底有多少条记录：**使用数据库（Using the Database）**\n\n```sql\nSELECT COUNT(*)\
  \ FROM tablename\n```\n此查询输出表中包含的记录数。\n\n#### 使用 phpMyAdmin 浏览数据\n\n你可以按照以下步骤使用\
  \ phpMyAdmin 查看表中的所有数据：\n\n1. **点击左侧面板中的表名打开表（Table）页面。**\n如果没有选择数据库，请点击数据库名称或从\
  \ `Database` 下拉列表中选择数据库。\n`Table` 页面会显示表中的字段列表及其定义。\n\n2. **勾选你想要浏览的所有字段名称前的复选框。**\n\
  你可以点击字段列表下方的 `Check All（全选）链接一次性选择所有字段。\n\n3. **点击 Browse（浏览）图标。**\n该图标是字段列表下方 `Check\
  \ All/Uncheck All` 链接后显示的图标行中的第一个。该图标看起来像项目列表。\n结果页面显示并在顶部带有类似以下的消息：`Showing rows\
  \ 0 - 12 (13 total, Query took 0.0019 sec).`。\n接下来，页面将显示用于获取结果的查询。\n\n4. **向下滚动到\
  \ Query Results（查询结果）部分。**\n数据库表中的数据将表格形式显示在网页上。\n\n5. **（可选）如果你愿意，可以更改数据列表的一些后续选项：**\n\
  - 你可以更改每页显示的行数、从第几行开始列表以及/或字段的列表顺序（水平或垂直），然后点击 `Show（显示）按钮。页面将根据新参数重新显示。\n- 你可以更改表的排序顺序——升序或降序——并点击\
  \ `Go（执行）按钮。页面将按新的排序顺序重新显示。\n\n6. **要打印数据列表，请点击该部分顶部的 Print（打印）链接。**\n\n7. **要将数据以若干种格式之一存储在单独文件中，请点击\
  \ Export（导出）链接。**\n本微型教程的第 2 章介绍了 `Export` 功能。\n\n### 从数据库中检索信息\n\n存储信息的唯一目的是为了在需要时可以使用它。数据库的存在是为了回答问题。有哪些产品在售？客户是谁？印第安纳州住着多少客户？客户购买了什么？\n\
  \n许多问题可以通过从数据库中检索数据来回答。例如，要查找有多少个客户住在印第安纳州，你可以检索所有名为 `state` 的字段包含该内容的记录。通常你会在 PHP\
  \ 脚本中提出这些问题并在网页上显示答案。即使你使用 phpMyAdmin 查看某些特定信息，也需要构建 SQL 查询。要回答特定问题，你需要使用 SELECT\
  \ 查询。phpMyAdmin 提供了一些功能，允许你浏览数据或提一些简单的问题（如上一节所述），但对于大多数问题你需要使用 SELECT 查询。\n\n####\
  \ 检索特定信息\n\n要检索特定信息，请列出包含你所需信息的列。例如：\n\n\n\n\n`SELECT columnname,columnname,columnname,...\
  \ FROM tablename` 此查询用于从指定列的所有行中检索值。例如，以下查询将从存储在 `Customer` 表的 `lastName` 和 `firstName`\
  \ 列中检索所有的姓氏和名字：\n\n```\nSELECT lastName,firstName FROM Customer\n```\n\n### 从数据库中检索信息\n\
  \n在选择列时，你可以对这些列执行数学操作。例如，你可以使用以下 `SELECT` 查询来将两个列相加：\n\n```\nSELECT col1+col2 FROM\
  \ tablename\n```\n\n或者，你可以使用以下查询：\n\n```\nSELECT price,price*1.08 FROM Inventory\n\
  ```\n\n结果是原始价格以及加了 8% 销售税后的价格。\n\n你可以在选择列时更改该列的名称，如下所示：\n```\nSELECT price,price*1.08\
  \ AS priceWithTax FROM Inventory\n```\n\n`AS` 子句告诉 `MySQL` 为检索到的第二列命名为 `priceWithTax`。因此，查询检索了两个列的数据：`price`\
  \ 和 `priceWithTax`。\n\n在某些情况下，你不想看到列中的值，但你想了解有关该列的信息。例如，你可能想知道列中的最低值或最高值。表 4-1 列出了关于列的某些可用信息。\n\
  \n**表 4-1：可以选择的信息**\n\n| SQL 格式 | 信息描述 |\n| :--- | :--- |\n| `AVG(*columnname*)`\
  \ | 返回 `columnname` 中所有值的平均值 |\n| `COUNT(*columnname*)` | 返回 `columnname` 不为空的行数\
  \ |\n| `MAX(*columnname*)` | 返回 `columnname` 中的最大值 |\n| `MIN(*columnname*)` | 返回\
  \ `columnname` 中的最小值 |\n| `SUM(*columnname*)` | 返回 `columnname` 中所有值的和 |\n\n例如，查找\
  \ `Inventory` 表中最高价格的查询是：\n```\nSELECT MAX(price) FROM Inventory\n```\n\n看起来像 `MAX()`\
  \ 和 `SUM()` 且名称后带有括号的 SQL 单词是函数。除了表 4-1 中的函数外，`SQL` 还提供了许多函数。某些函数（如表 4-1 中的函数）提供有关列的信息。其他函数则更改每个所选值。例如，`SQRT()`\
  \ 返回列中每个值的平方根，而 `DAYNAME()` 返回日期列中每个值的星期几名称，而不是存储在列中的实际日期。`SELECT` 查询中有 100 多个函数可供使用。有关所有函数的描述，请参阅\
  \ MySQL 在线手册：http://dev.mysql.com/doc/refman/5.0/en/functions.html。\n\n### 按特定顺序检索数据\n\
  \n你可能希望按照特定的顺序检索数据。例如，在 `Customer` 表中，你可能希望按姓氏的字母顺序排列客户。或者，在 `Inventory` 表中，你可能希望按类别对各种产品分组。\n\
  \n在 `SELECT` 查询中，`ORDER BY` 和 `GROUP BY` 影响数据交付你的顺序：\n\n- `ORDER BY`：要进行排序，请在 `SELECT`\
  \ 查询中添加此短语：`ORDER BY columnname`。数据按 `columnname` 升序排序。例如，如果 `columnname` 是 `lastName`，数据将按姓氏的字母顺序交付给你。你可以在列名之前添加单词\
  \ `DESC` 来进行降序排序。例如：\n```\nSELECT * FROM Customers ORDER BY DESC\n```\n- `GROUP\
  \ BY`：要进行分组，请使用以下短语：`GROUP BY columnname`。具有相同 `columnname` 值的行将被分在一起。例如，使用此查询对具有相同\
  \ `Category` 值的行分组：\n```\nSELECT * FROM Inventory GROUP BY Category\n```\n你可以在同一个查询中使用\
  \ `GROUP BY` 和 `ORDER BY`。\n\n### 从特定行检索数据\n\n通常情况下，你不需要表中的所有信息。你只需要来自所选行的信息。有三个\
  \ SQL 单词经常用于指定以下内容的来源：\n\n- `WHERE`：允许你从具有特定特征的对象请求信息。例如，你可以请求住在加利福尼亚州的客户名称，或者你可以只列出属于特定类别的产品。\n\
  - `LIMIT`：允许你限制检索信息的行数。例如，你可以只请求表中的前三行信息。\n- `DISTINCT`：允许你仅从相同行中的某一行请求信息，从而将响应限制为每个成员一条记录。这将回答“客户是否登录过？”，而不是“客户登录了多少次？”。\n\
  \n### 使用 WHERE 子句\n\n`SELECT` 查询的 `WHERE` 子句允许你进行复杂的选择。例如，假设你的老板想知道所有姓氏以 B 开头、住在印第安波利斯且电话或传真号码中包含数字\
  \ 8 的客户（我们确定这种列表会有很多用途）。你可以通过带有 `WHERE` 子句的 `SELECT` 查询为你的老板获取此列表。\n\n`WHERE` 子句的基本格式是\
  \ `WHERE expression AND OR expression`。`expression` 指定了要与数据库中存储的值进行比较的值。你可以根据需要使用任意数量的表达式，每个表达式由\
  \ `AND` 或 `OR` 分隔。当你使用 `AND` 时，由 `AND` 连接的表达式（即 `AND` 之前的表达式和 `AND` 之后的表达式）必须为真，该行才会被选中。当你使用\
  \ `OR`，由 `OR` 连接的表达式只要有一个为真即可。常用表达式见表 4-2。\n\n**表 4-2：WHERE 子句的表达式**\n\n| 表达式 |\
  \ 示例 | 结果 |\n| :--- | :--- | :--- |\n| `column = value` | `zip=\"12345\"` | 仅选择\
  \ `zip` 列中存储 12345 的行 |\n| `column > value` | `zip > \"50000\"` | 仅选择邮政码大于 50000\
  \ 的行 |\n| `column >= value` | `zip >= \"50000\"` | 仅选择邮政码为 50000 或更大的行 |\n| `column\
  \ < value` | `zip < \"50000\"` | 仅选择邮政码为 49999 或更小的行 |\n| `column <= value` | `zip\
  \ <= \"50000\"` | 仅选择邮政码为 50000 或更小的行 |\n| `column BETWEEN value1 AND value2` |\
  \ `zip BETWEEN \"20000\" AND \"30000\"` | 仅选择邮政码大于 19999 但小于 30001 的行 |\n| `column\
  \ IN (value1,value2...)` | `zip IN (\"90001\", \"30044\")` | 仅选择邮政码为 90001 或 30044\
  \ 的行 |\n| `column NOT IN (value1,value2...)` | `zip NOT IN (\"90001\", \"30044\"\
  )` | 仅选择邮政码不是 90001 或 30044 的所有行 |\n| `column LIKE value` | `zip LIKE \"9%\"` |\
  \ 选择所有邮政码以 9 开头的行（注意：`value` 可以包含通配符 `%` 匹配任意字符串和 `_` 匹配任意字符） |\n| `column NOT LIKE\
  \ value` | `zip NOT LIKE \"9%\"` | 选择所有邮政码不以 9 开头的行 |\n\n\n\n\n\n# 从数据库检索信息\n\n\
  ```sql\nSELECT lastName,firstName FROM Customer\nWHERE lastName LIKE “B%”\nAND city\
  \ = “Indianapolis”\nAND (phone LIKE “%8%” OR fax LIKE “%8%”)\n```\n\n注意最后一行中的括号。如果没有括号，你将无法获得想要的结果。如果没有括号，每个连接符将按照从第一个到最后一个顺序进行处理，导致结果包含：所有姓以\
  \ `B` 开头、居住在印第安纳利斯（Indianapolis）且电话号码包含 8 的客户；*以及*所有传真号码中包含 8 的客户（无论他们是否居住在印第安纳利斯，无论他们的姓是否以\
  \ `B` 开头）。当处理最后一个 `OR` 时，系统会选取特征符合 `OR` 之前的表达式*或* `OR` 之后的表达式的客户。`OR` 之前的表达式通过之前的\
  \ `AND` 与前面的表达式连接，因此它不是独立的；但 `OR` 之后的表达式是独立的，这会导致选取所有传真号中包含 8 的客户。\n\n## 使用 `LIMIT`\
  \ 关键字\n\n`LIMIT` 指定了可以返回的行数。`LIMIT` 的格式为 `LIMIT startnumber,numberofrows`。\n\n`LIMIT\
  \ startnumber,numberofrows`：你想要检索的第一行索引是 `startnumber`，要检索的行数是 `numberofrows`。如果未指定\
  \ `startnumber`，则认为 1。要仅选择前三个居住在德克萨斯州（Texas）的客户，使用此查询：\n\n```sql\nSELECT * FROM\
  \ Customer WHERE state=”TX” LIMIT 3\n```\n\n## 使用 `DISTINCT` 关键字\n\n表中的行在一个或多个列上可能具有相同的值。然而，在某些情况下，当你\
  \ `SELECT` 一列时，你不希望检索到多个具有相同值的行。你希望只检索该值一次。例如，假设你有一个名为 `Category`（类别）字段的产品表。\n\n\
  数据中无疑包含每个类别的许多产品。现在，假设你想显示数据库中所有可用类别的列表。你希望这个列表每个类别只出现一次。`DISTINCT` 关键字正是为此设计的。\n\
  \n为了防止 `SELECT` 查询返回所有相同的记录，请在 `SELECT` 之后立即添加 `DISTINCT` 关键字，如下所示：\n\n```sql\n\
  SELECT DISTINCT Category FROM Product\n```\n\n## 合并来自多个表的信息\n\n在本章之前的章节节中，我们假设你想要的所有信息都在同一个表中。然而，你可能想要合并来自不同表的信息。你可以在一个查询中轻松地实现这一点。\n\
  \n`SELECT` 查询中可以使用两个单词来合并来自两个或多个表的信息：\n\n- `UNION`：从一个或多个表中检索行，并将它们一个接一个存储在单个结果集中。例如，如果你的查询从一个表选取了\
  \ 6 行，从另一张表选取了 5 行，结果将包含 11 行。\n- `JOIN`：将表并排组合，并从两个表中都检索信息。\n\n### `UNION`\n\n\
  `UNION` 用于合并两个或多个 `SELECT` 查询的结果。每个查询的结果将接在上一个查询结果之后添加到结果集中。`UNION` 查询的格式如下：`SELECT\
  \ query UNION ALL SELECT query ...`。\n\n你可以根据需要组合任意数量的 `SELECT` 查询。`SELECT` 查询可以包含任何有效的\
  \ `SELECT` 格式，包括 `WHERE` 子句、`LIMIT` 子句等。查询的规则是：\n\n- 所有 `SELECT` 查询必须选择相同数量的列。\n\
  - 查询中选择的列必须包含相同类型的数据。\n\n结果集包含第一个查询的所有行，然后是第二个查询的所有行，依此类推。结果集中使用的列名是第一个 `SELECT`\
  \ 查询中的列名。\n\n一系列 `SELECT` 查询可以从同一张表选取不同的列，但如果你想要新表中先是该表的一列，后面是该表的另一列，这种情况并不常见。更有可能是你想要组合来自不同表的列。\n\
  \n例如，你可能有一张已经从 `Book III` 俱乐部退会的成员表（`OldMember`）和另一张当前成员表（`Member`）。你可以通过以下查询获取所有成员（包括当前成员和退会的）的列表：\n\
  \n```sql\nSELECT lastName,firstName FROM Member UNION ALL\nSELECT lastName,firstName\
  \ FROM OldMember\n```\n\n该查询的结果是所有当前成员的姓和，然后是所有退会成员的姓和名。\n\n取决于你组织数据的方式，可能会出现重复的名字。例如，可能某个成员退会了，他的名字在\
  \ `OldMember` 表中——但他再次加入了，所以他的名字被添加到 `Member` 表中。如果你不想要重复，请不要包含 `ALL` 单词。如果不包含 `ALL`，结果中就不会添加重复的行。\n\
  \n你可以对每个 `SELECT` 查询使用 `ORDER BY`（正如我们在本章前面的“按特定顺序检索数据”节中所述），或者你可以在 `UNION` 查询中使用\
  \ `ORDER BY` 对结果集进行排序。如果你想让 `ORDER BY` 应用于整个结果集，而不是仅仅适用于它后面的查询，请使用括号：\n\n```sql\n\
  (SELECT lastName,firstName FROM Member UNION ALL\nSELECT lastName,firstName FROM\
  \ OldMember) ORDER BY lastName\n```\n\n## `Join`\n\n并排组合表是 `join`。表通过共同的列进行组合。连接产生的组合包含了来自两个表的所有列。\n\
  \n例如，如果 `table1` 有两列（`memberID` 和 `height`），而 `table2` 有两列（`memberID` 和 `weight`），`join`\
  \ 会产生一个四列的表：`memberID`（来自 `table1`）、`height`、`memberID`（来自 `table2`）和 `weight`。\n\
  \n连接的两种类型是 `inner join`（内连接）和 `outer join`（外连接）。`inner join` 和 `outer join` 之间的区别在于结果集中包含的行数。`inner\
  \ join` 产生的结果只包含两个表中都存在的行。`outer join` 产生的组合表包含一个表中所有的行，对于在第二个表中不存在的行，对应的列为空。例如，如果\
  \ `table1` 包含 `Joe` 和 `Sally` 的行，而 `table2` 只包含 `Sally` 的行，`inner join` 将只包含一行：`Sally`\
  \ 的行。然而，`outer join` 将包含两行——`Joe` 和 `Sally` 的行——即使 `Joe` 的 `weight` 字段为空。\n\n`outer\
  \ join` 的结果表包含一个表的所有行。如果该表的任何行不在第二个表中，则第二个表的列将是空的。显然，结果表的内容取决于哪张表贡献了所有行，并要求第二个表与之匹配。两种外连接控制着哪张表设置行，哪张表进行匹配：`LEFT\
  \ JOIN`（左连接）和 `RIGHT JOIN`（右连接）。\n\n你使用不同的 `SELECT` 查询来执行 `inner join` 和两种类型的外连接。以下查询是\
  \ `inner join`：\n\n```sql\nSELECT columnnamelist FROM table1,table2\nWHERE table1.col2\
  \ = table2.col2\n```\n\n这些查询是外连接：\n\n```sql\nSELECT columnnamelist FROM table1 LEFT\
  \ JOIN table2\nON table1.col1=table2.col2\n\nSELECT columnnamelist FROM table1 RIGHT\
  \ JOIN table2\nON table1.col1=table2.col2\n```\n\n\n\n\n在这三个查询中，`table1` 和 `table2`\
  \ 是要连接的表。你可以连接两个以上的表。在这两个查询中，`col1` 和 `col2` 是用于匹配以连接表的列名。表是根据这些列中的数据进行匹配的。这两列的可以相同，也可以不同，但它们必须包含相同类型的数据。\n\
  \n作为内连接和外连接的示例，请考虑一个包含两个表的服装目录。一张表是 `Product`，包含 `Name` 和 `Type` 两个列，存储以下数据：\n\n\
  Name | Type\nT-shirt | Shirt\nDress shirt | Shirt\nJeans | Pants\n\n第二张表是 `Color`，包含\
  \ `Name` 和 `Color` 两个列，存储以下数据：\n\nName | Color\nT-shirt | white\nT-shirt | red\n\
  Loafer | black\n\n## 第三卷\n\n## 第 4 章\n\n你需要提一个需要从两个表中获取信息的问题。如果你正在 `Using the Database`，请使用以下查询进行内连接：\n\
  \n```sql\nSELECT * FROM Product,Color WHERE Product.Name = Color.Name\n```\n\n你将得到包含四个列的结果表：`Name`（来自\
  \ `Product`）、`Type`、`Name`（来自 `Color`）和 `Color`。\n\nName | Type | Name | Color\n\
  T-shirt | Shirt | T-shirt | white\nT-shirt | Shirt | T-shirt | red\n\n注意，结果表中只出现了\
  \ `T-shirt` —— 因为在连接操作之前，只有 `T-shirt` 同时存在于两个原始表中。另一方面，假设你使用以下查询进行左外连接：\n\n```sql\n\
  SELECT * FROM Product LEFT JOIN Color ON Product.Name=Color.Name\n```\n\n你将得到以下结果表，具有相同的四个列——`Name`（来自\
  \ `Product`）、`Type`、`Name`（来自 `Color`）和 `Color`——但行不同：\n\nName | Type | Name | Color\n\
  T-shirt | Shirt | T-shirt | white\nT-shirt | Shirt | T-shirt | red\nDress | Shirt\
  \ | <NULL> | <NULL>\nJeans | Pants | <NULL> | <NULL>\n\n此表有四行。它的前两行与内连接相同，但额外增加了两行——这些行于左侧的\
  \ `Product` 表中，但在 `Color` 表中不存在。注意，来自 `Color` 表的列在最后两行是空的。\n\n另外，假设你使用以下查询进行右外连接：\n\
  \n```sql\nSELECT * FROM Product RIGHT JOIN Color ON Product.petName=Color.Name\n\
  ```\n\n你将得到以下结果表，具有相同的四个列，但行仍然不同：\n\npetName | petType | petName | petColor\nT-Shirt\
  \ | Shirt | T-shirt | white\nT-shirt | Shirt | T-shirt | red\n<NULL> | <NULL> |\
  \ Loafers | Black\n\n注意，这些结果包含了右侧 `Color` 表的所有行，但不包含 `Product` 表的。注意 `Product` 表列中的空白，因为它没有\
  \ `Loafers` 这一行。\n\n我们到为止讨论的连接是查找表中的匹配项。有时，找出表中哪些行在另一张表中没有匹配项很有用。例如，假设你想知道谁从未登录过你的“会员专区”（Members\
  \ Only section）。假设你有一张存储成员登录名（`Member`）的表和另一张存储登录日期（`Login`）的表。你可以通过从这两个表中进行查询来提出这个问题。你可以通过以下查询找出哪些登录名在\
  \ `Login` 表没有条目：\n\n```sql\nSELECT loginName FROM Member LEFT JOIN Login ON Member.loginName=Login.loginName\n\
  WHERE Login.loginName IS NULL\n```\n\n该查询为你列出了 `Member` 表中不在 `Login` 表中的所有登录名。\n\
  \n## 更新数据库中的信息\n\n更改现有行中的信息就是对信息进行*更新*。例如，你可能需要更改客户地址因为她搬家了，或者你可能需要添加客户在最初输入信息时留空的传真号码。\n\
  \n### 使用 SQL 查询更新信息\n\n`UPDATE` 查询非常直观：\n\n```sql\nUPDATE tablename SET column=value,column=value,...\n\
  WHERE clause\n```\n\n#### WHERE 子句\n\n在 `SET` 子句中，列出要更新的列和要插入的新值。在一个查询中列出所有你想更改的列。\n\
  \n如果没有 `WHERE` 子句，所有行中的列值都将被更改。但有了 `WHERE` 子句，你可以指定更新哪些行。例如，要更新 `Customer` 表中的地址，请使用此查询：\n\
  \n```sql\nUPDATE Customer SET street=\"3423 RoseLawn\", phone=\"555-555-5555\"\n\
  WHERE lastName=\"Contrary\"\n```\n\n### 使用 phpMyAdmin 更新信息\n\n### 使用数据库\n\n在 phpMyAdmin\
  \ 中，你可以通过显示信息并直接修改来更新信息，如下：\n\n1. **点击左侧面板中的表名打开表页面。**\n   如果未选择包含表的数据库，请点击数据库名称或从数据库下拉列表中选择它。表页面将打开，显示表中的字段列表。\n\
  \n2. **点击页面顶部的浏览（Browse）图标。**\n   表中的所有数据都列在一个行列结构的表格中。\n\n3. **点击你想更新的行的更改（Change）图标。**\n\
  \   更改图标看起来像一支铅笔，出现在行中复选框之后。\n\n\n\n\n✦ **表数据：** 点击页面顶部的“清空（Empty)”选项卡删除表中的所有数据。\n\
  \n## 第三卷\n\n## 第 4 章\n\n✦ **字段：** 点击字段行中的“删除（Drop）”图标删除字段。“删除使用数据库（Using the Database）”图标是位于字段行末尾“操作（Action）”列图标行末端的大红色\
  \ X。此操作将从表中删除该列，以及该列中的所有数据。\n\n`phpMyAdmin` 中的“浏览（Browse）”页面列出了表中的所有数据。你可以通过点击表页面中的“浏览（Browse)”链接来显示浏览页面。从该页面，你可以按照以下方式删除表或表中的任何行数据：\n\
  \n✦ **表：** 点击页面顶部的“删除（Drop)”选项卡删除整个表。\n\n✦ **表数据：** 点击页面顶部的“清空（Empty)”选项卡删除表中的所有数据。\n\
  \n✦ **行：** 点击数据行中的“删除（Drop）”图标删除该行。删除图标是位于数据行开头附近的大红色 X。\n\n当你在 `phpMyAdmin` 的大多数地方点击“删除（Drop)”链接或图标时，会弹出一个警告窗口，确认你确实想要删除这些数据。\n\
  \n你必须在操作之前点击“是（Yes）”或“确定（OK）”。\n\n## 第 5 章：通过 PHP 脚本与数据库通信\n\n### 本章内容\n\n- 使用 PHP\
  \ 内置函数访问 MySQL\n- 向 MySQL 服务器发送 SQL 查询\n- 理解如何处理 MySQL 错误\n- 使用其他有用函数\n- 将函数从 `mysqli`\
  \ 更改为 `mysql`\n\nPHP 和 MySQL 配合得非常好，这种动态的伙伴关系使得 PHP 和 MySQL 在 Web 数据库应用程序开发中极具吸引力。无论你是拥有一个充满信息并希望提供给用户的数据库（例如产品目录），还是一个等待用户填充的数据库（例如客户数据库），PHP\
  \ 和 MySQL 都能协作来实现你的应用程序。\n\n本章描述了如何从 PHP 脚本访问 MySQL。\n\n### MySQL 和 PHP 如何协同工作\n\
  \n你通过向 MySQL 服务器发送消息来与数据库交互。正如本微型教程第 1 章所解释，消息是用 SQL 语言编写的，这是一种大多数数据库管理系统都能理解的标准计算机语言。\n\
  \nPHP 不懂 SQL，但它不需要懂：PHP 只需要与 MySQL 服务器建立连接，并通过该连接发送 SQL 消息。MySQL 服务器解释 SQL 消息，遵循指令，并发送返回消息，说明其状态和执行的操作（或者如果无法理解或遵循指令，则报告错误）。\n\
  \nPHP 语言提供的函数使得与 MySQL 通信变得极其简单。你使用 PHP 函数向数据库发送 SQL 查询。\n\n你不需要了解与 MySQL 通信的细节；PHP\
  \ 会处理这些细节。你只需要知道 SQL 查询以及如何使用 PHP 函数。\n\n字体 与 MySQL 通信的 PHP 函数\n\n我们通过向 MySQL 服务器发送消息来与数据库交互。正如本微型教程第\
  \ 1 章所解释，消息是用 SQL 语言编写的，这是一种大多数数据库管理系统都能理解的标准计算机语言。\n\n\n\n\n# 与 MySQL 通信\n\n在开发过程中，你可能希望使用描述性的消息，例如\
  \ `Couldn’t connect to server`，但在应用程序投入使用后，可以使用更适合客户的通用消息，例如 `The Catalog is not\
  \ available at the moment. Please try again later.`。\n\n主机包含连接所需的端口号。几乎在所有情况下，端口号都是\
  \ `3306`。在少数情况下，MySQL 管理员需要设置 MySQL 使其通过不同的端口进行连接。在这些情况下，连接需要端口号。端口号指定为 `hostname:portnumber`。例如，你可能使用\
  \ `localhost:8808`。\n\n通过这些语句，`mysqli_connect` 尝试使用提供的账户名和密码打开与指定计算机的连接。如果连接失败，脚本将停止运行并向浏览器发送\
  \ `message`。\n\n以下语句连接到本地计算机上的 MySQL 服务器，使用一个名为 `phpuser` 的 MySQL 账户，该账户不需要密码：\n\
  \n```php\n$cxn = mysqli_connect(“localhost”,”phpuser”,””,”Customer”) or die (“Couldn’t\
  \ connect to server.”);\n```\n\n出于安全考虑，你应该将连接信息存储在变量中，并在连接语句中使用这些变量，如下：\n\n```php\n\
  $host=”localhost”;\n$user=”phpuser”;\n$password=””;\n$dbname = “Customer”;\n$cxn\
  \ = mysqli_connect($host,$user,$password,$dbname) or die (“Couldn’t connect to server.”);\n\
  ```\n\n为了更高的安全性，你可以将连接信息的赋值语句放在隐藏位置的单独文件中，这样账户名和密码甚至不会出现在脚本中。你通过使用 `include` 语句从文件中插入账户信息，该方法如第二卷第\
  \ 2 章所述。\n\n变量 `$cxn` 包含标识连接的信息。你可以通过使用多个变量名来同时打开多个连接。\n\n连接会一直保持打开状态，直到你关闭它或脚本结束。你通过以下方式关闭连接：\n\
  \n```php\nmysqli_close($connectionname);\n```\n\n\n\n例如，要关闭前面示例中的连接，请使用此语句：\n\n\
  ```php\nmysqli_close($cxn);\n```\n\n## 发送 SQL 查询\n\n在与 MySQL 服务器建立连接后，你就可以发送你的 SQL\
  \ 查询。`query` 是向 MySQL 服务器发送的请求，用于更改数据库结构、存储某些数据、更新某些数据或检索某些数据。你可以在本微型书籍的其他章节中找到用于特定目的的\
  \ SQL 查询的详细信息。\n\n要与数据库交互，请将你的 SQL 查询放入变量中，并使用函数 `mysqli_query` 将其发送到 MySQL 服务器如下例所示：\n\
  \n```php\n$query = “SELECT \\* FROM Customer”;\n$result = mysqli_query($cxn,$query)\
  \ or die (“Couldn’t execute query.”);\n```\n\n查询将在当前连接的所选数据库上执行。\n\n## 第三卷\n\n变量\
  \ `$result` 留有执行查询结果的信息。\n\n## 第 5 章\n\n信息取决于 PHP 脚本查询是否从数据库获取信息：\n\n## 通信\n\n-\
  \ **对于不获取任何数据的查询：** 变量 `$result` 包含有关查询是否执行成功的信息。如果成功，`$result` 被设置为 `true`；如果未成功，`$result`\
  \ 被设置为 `false`。某些不返回数据的查询是 `INSERT` 和 `UPDATE`。\n- **对于返回数据的查询：** 变量 `$result` 包含一个结果标识符，用于指定返回数据的位置，而不是返回的数据本身。某些返回数据的查询是\
  \ `SELECT` 和 `SHOW`。\n\n在将查询字符串赋值给 `$query` 时，单引号和双引号的使用可能会有点困惑。你实际上在两个层级使用了引号：用于\
  \ `$query` 的引号以及查询语句本身的引号。以下指南可以帮助你避免问题：\n\n- 在字符串开始和结束使用双引号。\n- 在变量名前后使用单引号。\n\
  - 在字面值前后使用单引号。\n\n以下示例显示了查询语句：\n\n```php\n$query = “SELECT FROM Customer”;\n$query\
  \ = “SELECT FROM Customer WHERE lastName=’Smith”;\n$query = “UPDATE Customer SET\
  \ lastName=’”;\n```\n\n查询字符串本身不包含分号；分号出现在语句的末尾，这是可以接受的。\n\n## 发送多个查询\n\n有时，你想同时发送两个或多个查询。MySQL\
  \ 允许这样做，但你需要使用不同的函数来发送。你可以通过 `mysqli_query` 函数发送由分号隔开的查询：\n\n```php\n$query = “SELECT\
  \ \\* FROM Cust;SELECT \\* FROM OldCust”;\nmysqli_query($cxn,$query);\n```\n\n发送多个查询可能比发送单个查询不安全。如果你使用带有外部数据的创建来使用\
  \ `multi_query` 函数，请务必彻底验证外部数据。例如，假设你显示一个请求用户输入表的表单，你创建查询如下：\n\n```php\n$query =\
  \ “SELECT \\* FROM Friend”;\n```\n\n用户输入了表名：\n\n```text\nFriend;DELETE TABLE Friend\n\
  ```\n\n那么你的查询变为：\n\n```php\n$query = “SELECT \\* FROM Friend;DELETE TABLE Friend”;\n\
  ```\n\n如果你使用 `multi_query` 函数发送此查询，该查询是不正确的。你可能不想删除该表。你通常编写一个可以实现目标且更安全的查询。\n\n\
  ## 选择数据库\n\n如果你没有在连接函数中选择数据库，可以通过 `mysqli_select_db` 函数选择数据库。你可以在脚本的任何时候使用此函数选择不同的数据库。格式为\
  \ `mysqli_select_db($cxn,”databasename”) or die (“message”)`。\n\n如果你使用的是 mysql 函数而不是\
  \ mysqli 函数，你必须在一个单独的函数中使用 `mysql_select_db` 选择。本章后面的“将 mysqli 函数转换为 mysql 函数”部分将进行详细说明。\n\
  \n填写以下信息：\n\n- `cxn`：包含连接信息的变量。\n- `databasename`：数据库的名称。\n- `message`：如果无法选择数据库，发送给消息。选择失败可能是因为找不到数据库，这通常是数据库名称拼写错误。\n\
  \n例如，你可以通过以下语句选择 Customer 数据库：\n\n```php\nmysqli_select_db($cxn,”Customer”) or die\
  \ (“Couldn’t select database.”);\n```\n\n如果 `mysqli_select_db` 无法选择数据库，脚本将停止运行并向浏览器发送\
  \ `Couldn’t select database.`。\n\n\n\n\n你使用 PHP 语言的 `mysqli` 函数（如 `mysqli_connect`\
  \ 和 `mysqli_query`）与 MySQL 数据库交互。在使用这些语句时，有时会发生错误。你可能在输入时出现错误，例如写错了数据库名称。有时，会出现你无法避免的问题，例如数据库或网络宕机。你需要在脚本中包含处理错误情况的代码。\n\
  \n# 处理 MySQL 错误\n\n你可以在第二卷第 1 章中读到关于 PHP 错误处理的内容。该章节描述了 PHP 显示的错误类型以及如何开启或关闭它们。正如第二卷中所讨论的，你通常希望让错误处理更具描述性，以协助开发过程中的故障排除，但你不希望向公众显示这些额外信息。\n\
  \n例如，假设你正在使用一个名为 `root` 的账户访问数据库，由于你在语句中写了拼写错误，如下：\n\n```php\n$host = “localhost”;\n\
  $user = “rot”;\n$password = “”;\n$cxn = mysqli_connect($host,$user,$password)\n\
  ```\n\n由于你输入的是“rot”而不是“root”，你会看到一条类似下面的警告信息：\n\n`Warning: Access denied for user:\
  \ ‘rot@localhost’ (Using password: NO) ...`\n\n前面的错误消息包含了你解决问题所需的信息——它显示了包含拼写错误的账户名。然而，在脚本运行且客户正在使用它时，你不希望用户看到显示你用户\
  \ ID 的技术错误消息。你希望关闭 PHP 错误或将其发送到错误日志文件中。然后你可以使用 `die` 语句停止脚本并向用户显示一条礼貌的消息，如下：\n\n\
  ```php\n$cxn = mysqli_connect($host,$user,$password)\nor die(“The Catalog is not\
  \ available at the moment. Please try again later.”);\n```\n\n当 `mysqli_query()`\
  \ 函数失败时，MySQL 会返回一个包含失败原因信息的错误消息。然而，除非你显式显示它，否则该消息不会显示。同样，你可能想在开发脚本时查看这些消息，但可能不想向公众显示它们。你可以使用以下函数显示返回的\
  \ MySQL 错误：\n\n```php\nmysqli_error($cxn)\n```\n\n例如，你可能会将该函数包含在代码中，如下：\n\n```php\n\
  $query = “SELECT \\* FROM Cust”;\n$result = mysqli_query($cxn,$query)\nor die (“Error:\
  \ “.mysqli_error($cxn));\n```\n\n# 使用其他有用的 mysqli 函数\n\n在这个示例中，如果函数调用失败，`die` 语句将显示\
  \ MySQL 错误，可能如下所示：\n\n`Error: Table ‘catalog.cust’ doesn’t exist`\n\n偶尔，你可能想在函数失败时执行额外的操作，例如删除变量或关闭数据库连接。你可以通过条件语句执行此类操作：\n\
  \n```php\nif(!$result = mysqli_query($cxn,$query))\n{\n    echo mysqli_error($cxn);\n\
  \    unset($auth);\n    exit();\n}\n```\n\n如果函数调用失败，将执行 `if` 块中的语句。`echo` 语句显示函数返回的\
  \ MySQL 错误。一个变量被移除，脚本退出。\n\n注意 `if` 语句中的 `!`（感叹号）。`!` 表示“非”。换句话说，如果赋值语句不为真，则 `if`\
  \ 语句为真。\n\n## 第 5 章\n### 在 PHP 脚本中使用其他有用的 mysqli 函数\n\n其他有用的 `mysqli` 函数供你在 PHP\
  \ 脚本中使用。以下小节描述了如何使用 `mysqli` 函数来计算查询返回的行数、确定最后自动生成的记录、计算受查询影响的行数以及转义字符。\n\n####\
  \ 计算查询返回的行数\n\n通常，你想知道 SQL 查询返回了多少行。你的查询指定了信息返回时必须满足的标准，例如 `state` 必须等于 TX 或 `lastName`\
  \ 必须等于 Smith。`mysqli_num_rows` 函数告诉你找到了多少行符合标准的记录。\n\n登录页面经常使用此函数。当用户尝试登录时，他她在 HTML\
  \ 表单中输入账户和密码。你的 PHP 脚本随后会在数据库中检查账户和密码。如果找到，说明用户名和密码是有效的。你可能会使用类似下面的代码：\n\n```php\n\
  $query = “SELECT \\* FROM ValidUser WHERE acct = ‘$_POST[userID] AND password =\
  \ ‘$password’”;\n$result = mysqli_query($cxn,$query);\n$n = $mysqli_num_rows($result);\n\
  if($n < 1)\n{\n    echo “User name and password are not valid”;\n    exit();\n}\n\
  ```\n\n在这段代码中，SQL 查询查找用户在表单中提供的用户 ID 和密码的行。代码随后测试查询结果以查看有多少行。SQL 查询查找表单中用户提供的用户\
  \ ID 和密码的行。如果查询结果少于一行，说明数据库中不存在该账户，因此用户不被允许。\n\n#### 确定最后一次自动生成的条目\n\n许多数据库表包含 `AUTO_INCREMENT`\
  \ 字段。这是 MySQL 自动添加值的字段。当添加新行时，此类字段通常被定义为唯一标识符或主键。\n\n由于 MySQL 自动添加值，你并不一定知道字段中存储了哪个值。在某些情况下，你需要知道这个数字，以便在脚本后续使用它。`mysqli_insert_id`\
  \ 函数返回最后添加到 `AUTO_INCREMENT` 字段的数字。\n\n一种你需要知道该数字的情况是当你将订单和订单项存储在单独表中时。如果你将 `orderID`\
  \ 字段定义为 `AUTO_INCREMENT` 字段，MySQL 会向该字段添加数字。然而，你需要将此数字存储在 `OrderItem` 表中，以便将项目与订单连接。你可能会使用类似下面的代码：\n\
  \n```php\n$query = “INSERT INTO CustomerOrder (customerID,orderDate) VALUES ($customerID,$date)”;\n\
  $result = mysqli_query($cxn,$query);\n$orderID = mysqli_insert_id($cxn);\n$query\
  \ = “INSERT INTO OrderItem (orderID,color,size,price) VALUES ($orderID,$color,$size,$price))”;\
  \ // 注意：此处原文括号似乎有误\n```\n\n在第一个查询中，未指定 `orderID`，因此 MySQL 在字段中存储下一个序列号。在第二个查询中，上一个查询插入的\
  \ `orderID` 被插入第二个表中。\n\n#### 计算影响的行数\n\n某些 SQL 查询更改数据库但不返回任何数据。例如，`UPDATE` 查询可以更改表中的数据，但不会返回任何数据。在这种情况下，`UPDATE`\
  \ 查询可能会影响一行、多行或零行。例如，以下是一个 `UPDATE` 查询：\n\n```php\n$query = “UPDATE Customer SET\
  \ lastName = “Smyth” WHERE lastName = “Smith””;\n```\n\n该查询将把表中所有姓 Smith 的姓氏改为 Smyth。\n\
  \n在某些情况下，你可能需要知道查询更改了多少行。在这个示例中，数据库中可能没有姓 Smith 的人，也可能有数百个。你可以使用 `mysqli_affected_rows`\
  \ 函数来获取更新了多少行。该函数返回受最后一个 `UPDATE`、`INSERT`、`REPLACE` 或 `DELETE` 查询影响的行数。\n\n假设你想设置表中的一个字段，以标识通过测试的学生。你可能还想知道有多少学生通过了测试。你可能会使用类似下面的代码：\n\
  \n\n\n\n```php\n$query = \"UPDATE Student SET status='pass' WHERE score > 50\";\n\
  ```\n## 第 5 章\n\n```php\n$result = mysqli_query($cxn,$query);\n\n$passed = mysqli_affected_rows($cxn);\n\
  ```\n\n## 与数据库交互\n\n### 通过 PHP 脚本\n\n## 通信\n\n```php\necho \"$passed students passed\"\
  ;\n```\n\n在这段代码中，表中任何分数高于 50 分的学生都通过了测试。变量 `$passed` 包含了分数足以使其 `status` 字段被更新为 \"\
  pass\" 的学生人数。\n\n## 转义字符\n\n当你向数据库中存储任何字符串信息时，需要对特殊字符进行转义。正如第四卷中所解释的样，这是一项至关重要的安全措施。\n\
  \nPHP 6 之前的版本提供了一项名为“魔幻引用”（magic quotes）的功能，它可以自动转义 `$_POST` 和 `$_GET` 数组中的所有字符串。单引号、双引号、反斜杠和空字符都会被转义。该功能旨在帮助初学者，通过\
  \ `php.ini` 中的 `magic_quotes-gpc` 设置进行控制，并在 PHP 4 和 PHP 5 中默认开启。在 PHP 6 中，魔幻引用功能不再可用。\n\
  \n魔幻引用功能会导致大量低效且不必要的转义。它有时还会导致不符合预期的转义。通常情况下，我们建议你在 `php.ini` 文件中关闭魔幻引用。这将在第二卷第一章中进行更详细的讨论。\n\
  \n由于在存储数据之前对其进行转义是至关重要的，如果关闭了魔幻引用，你必须手动转义数据。`mysqli_real_escape_string` 函数即为此目的提供的。在向数据库中存储任何数据之前，请对其应用该函数。以下几行展示了某些可能的转义代码，使其能够安全地存储在数据库中：\n\
  \n```php\n$lastName = mysqli_real_escape_string($lastName);\n\n$lastName = mysqli_real_escape_string($_POST['lastName']);\n\
  ```\n\n## 将 mysqli 函数转换为 mysql 函数\n\n本书假设你正在使用 PHP 5 或 6，并配合 `mysqli` 函数与 MySQL\
  \ 5.0 或 5.1 交互。如果你使用的是 PHP 4，则无法使用 `mysqli` 函数。相反，即使在使用较新版本的 MySQL，你也需要使用 `mysql`\
  \ 函数。`mysql` 函数可以与后版本的 MySQL 通信，但它们无法访问 MySQL 后版本中添加的一些新功能。`mysql` 函数在 PHP 4 中自动激活。\n\
  \n在本书中，示例和脚本均使用 MySQL 5.0 和 `mysqli` 函数与 MySQL 通信。用于 MySQL 5.0 的 PHP 函数通常具有以下通用格式：\n\
  \n```php\nmysqli_function(value,value,...);\n```\n\n函数名中的 `i` 代表 *improved*（MySQL\
  \ 增强版）。函数名的后半部分是特定于函数的，通常是一个描述该函数功能的单词。此外，函数通常需要传递一个或多个值，以指定数据库连接或数据位置等细节。以下是本章稍早讨论过的两个\
  \ `mysqli` 函数：\n\n```php\nmysqli_connect(connection information);\n\nmysqli_query($cxn,\"\
  SQL statement\");\n```\n\n对应的 `mysql` 函数是：\n\n```php\nmysql_connect(connection information);\n\
  \nmysql_query(\"SQL statement\",cxn);\n```\n\n对于所有函数，`mysqli` 的功能和语法相似但并不完全相同。特别是，`mysqli`\
  \ 函数连接 MySQL 服务器的过程与 `mysql` 函数不同。\n\n表 5-1：mysqli 和 mysql 函数的语法\n\n```php\nmysqli_connect($host,$user,$password,$dbname);\n\
  mysqli_query($cxn,\"SQL statement\");\n\nmysql_connect($host,$user,$password);\n\
  mysql_select_db($dbname);\n```\n\n\n\n\n访问。此外，客户希望感到在输入信息（他们的订单）后，管理和处理该订单交易的过程也是安全且具有容错性的。\n\
  \n### 服务器管理员\n`server administrator`（即负责维护网站运行的 Web 服务器的人员）对安全也有自己独特的视角。虽然服务器管理员可能对驱动网站的实际代码表示担忧，但他们可能更担心服务器本身的安全，包括确保机器安装了所有安全补丁，并防止外部未经授权的物理访问以及诸如环境问题等安全威胁。（温度控制系统发生故障，其带来的安全威胁可能与任何病毒一样大！）\n\
  \n很有可能，你将使用第三方服务来托管你支持 PHP 和 MySQL 的 Web 网站，因此你可以将服务器管理问题留给……嗯，留给服务器管理员吧！尽管如此，你仍然应该意识到这些人人员必须解决的特殊安全问题。此外，你还应该了解如何在自己的编程中利用\
  \ Web 服务器的安全性（正如你通过本微型书籍的章节将发现的那样）。\n\n### 网站开发者\n很有可能，你扮演的是网站开发者的角色。而且在许多方面，你在宏大的安全方程式中所扮演的角色是最复杂的。为什么会这样呢？作为开发者，你经常会发现自己处于安全问题的最底层。\n\
  \n然而，不应将其视为负面影响，而应该享受作为开发者所拥有的机会：编写利用服务器安全性的安全代码，并编写足够智能、在系统发生错误时仍保持安全（且关键的是，能传达出安全感）的代码。诚然，这是一项巨大的责任，但你应该并且能够通过对大安全图景的良好认知以及有效的规划来有效地应对这一责任。\n\
  \n这些不同类型的安全角色将会相互重叠（客户可能除外，他们可能不在乎他们正在使用的网站的底层代码）。尽管如此，让我们从直接经验也告诉大家，安全是一个极其复杂的问题，绝不是一个人的工作。正如我们在之前区分服务器管理员和网站开发者的项目列表中所强调的那样，在涉及安全时，不同的人员将承担不同的责任。\n\
  \n所以，虽然你可能不是“大安全图景”所有方面的专家，但你可以——也应该——至少意识到这个大局。本章的其余部分将关注这一大图，将其分解为易于管理的区块，并强调你作为开发者是如何融入每一个部分的。\n\
  \n22_167779 bk04ch01.qxp 12/17/07 8:13 PM Page 361\n\n理解安全威胁\n\n#### 电子商务高速公路上的荒凉路段\n\
  \n为什么网站的容错性与安全有什么关系？实际上关系很大，特别是从终端用户或客户的角度来看。可以从汽车的安全功能来考虑。你拥有明显的实际信息，让客户知道他们输入的敏感信息已安全地接收并处理。没有什么比通过\
  \ Web 表单输入敏感信息、点击“提交”按钮，结果却返回一个没有任何指示接下来会发生什么的空白页面更令人心恼（且更令人不安）的了；在电子商务网站中，这来自于一套完善的屏幕消息进度。你拥有汽车显而易见的安全功能。你有自动门锁和远程进入恐慌报警等明显的问题。但当不可想象的事情发生时，你希望得到另一种安全感。在汽车中，这一点做得很到位。\n\
  \n理解安全威胁\n\n361\n\n\n\n\n### 数据被意外修改或更改\n在应用程序开发中，你需要注意的另一个安全威胁是数据的意外修改。虽然关键数据被错误修改并不等同于数据丢失或泄露，但它可能比单纯丢失数据更糟糕。想象一下，你开发了一个\
  \ `MySQL` 数据库，用于跟踪某种即将上市的新药的关键药物试验结果。在这个数据库中，你存储了试验参与者的各种属性，包括他们的性别、年龄、在试验不同阶段对药物的反应等。现在，想象某一天——因为你编写的\
  \ `PHP` 代码出现了一个问题——执行了一条数据库查询，将数据库中所有男性患者的年龄更新为同一个值。如果数据库只包含几条记录，这可能不是什么大问题。但如果数据库包含几千条记录记录呢？正如你可以想象的，纠正如此大规模的数据修改将花费大量时间，从而可能危及药物试验的顺利进行。\n\
  \n### 恶意外部攻击\n恶意外部攻击是指未经授权的入侵者使用蠕虫、病毒或其他恶意代码，试图访问你的系统，并（通常情况下）窥探/窃取/修改/删除你的机密信息。涉及此类安全威胁的许多问题将由服务器管理员负责，因为他们必须确保\
  \ Web 服务器已安装最新的软件补丁并采取了物理保护。然而，解决这一安全威胁的很大一部分也取决于你，即开发者：编写糟糕的代码会为入侵者提供易于操作的路径。（在这里，代码定义为可以在网站内执行的\
  \ `PHP` 和 `MySQL` 查询。）\n\n### 前述任何一个项目中均未包含的一百种情况\n不，我们并不是试图在这一项表现得自以为（好吧，也许有一；这是一本非常厚的书，我们必须保持内容的趣味性！）。严肃地说，基于独特的政治、社会和环境因素以及“你说他说”的情况，将会出现海量的安全威胁排列。这些排列将产生于这里列出的所有点的组合。如果这听起来像是在暗示传言可以被视为一种安全威胁，那么恭喜你读出了言外之意并捕捉到了我们的安全威胁偏移。流言确实可能是非常强大的东西，如果流传关于你的网站或应用程序不安全的传言，你必须在源头上扼杀这种流言。遗憾的是，这本书不是关于媒体舆论控制的。\n\
  \n然而，为了重申我们之前关于在出现问题时制定行动计划重要性的警告：你应该准备好应对针对你的网站或应用程序感知安全性的攻击，即使你知道并不存在真正的安全威胁。\n\
  \n# 开发安全策略\n\n作者之一有一位同事，尽管他是一位非常有才华的开发者，但他绝对讨厌编写任何类型的文档。实际上，“讨厌”这个词太轻微了。这个人厌恶文档，因为这剥夺了他编程的挑战和乐趣。\n\
  \n## 第一章：通用安全考量\n\n当你感觉到麻烦正在酝酿时，一份编写良好的安全策略可以是一个非常有效的反击武器。为什么呢？最好的策略不仅概述了事情应该如何做，还有助于在问题发生时澄清并定义最佳解决方案。面对现实吧：无论你多么幸运，你都会发现自己直接处于安全相关问题的聚光灯下，或者被确定为安全相关调查的核心成员。如果你花时间制定了一份强大的安全策略，你就可以让这些情况变得不那么愉快，因为你能够具体地处理你是如何做的，以及处理你将如何做来让自己（以及他人）离开聚光灯，而不会失去信任或（在坏的情况下！）失去工作。\n\
  \n如果你在问自己：“嘿，安全策略不是由‘高层’或管理员编写的文件类型吗？”你问了一个很好的问题。然而，如果你作为电子商务网站或应用程序开发者独立经营，那么你很可能处于链条中比任何人都都要高的位置，你需要花时间编写安全策略，以涵盖你的……呃，资产，并保护客户对你付出的信任。编写安全策略（或任何策略）是枯燥的，但当你需要它时，由于拥有一份强大的安全策略，你以后会感谢我们的。\n\
  \n### 强大的安全策略的组成\n\n好消息是，一份有效的安全策略不需要长达数百页。事实上，如果一份非常有效的安全策略能够有效地处理以下每个组成部分，它可能只有几页长：\n\
  \n- **你的安全策略使命宣言：** 安全对你的公司或组织有多重要？你认为安全的价值有多大？在你的公司或组织每天处理的使命关键问题的优先级层级中，安全排在第几位？在时间和人力资源有限的情况下，修复安全漏洞是在优化你的生产线效率之前，还是在修好客户服务呼叫中心损坏的电话线之后？只有你才能决定安全在你的优先级中的位置。\n\
  - **你日常处理安全的行动计划：** 从确保物理安全和维护数据的安全远程访问，到描述具体的数据保护措施（包括病毒保护和数据备份与恢复），你的安全策略应该包含多个章节，简要描述你的日常安全协议和流程。\n\
  - **负责执行你安全策略的人员：** 谁是负责执行前一个项目中的行动计划的人？\n- **你处理安全相关问题的计划：** 这是一个良好的安全策略真正发挥作用的地方：当你的公司或组织发生安全相关事件时，哪项行动计划会立即生效？确保该行动计划不仅能纠正安全漏洞，还能传达该纠正措施的有效性。它还应该确保使用你网站或应用程序的客户的信任。\n\
  \n### 安全策略示例\n\n突出有效的安全策略不需要是像头书一样的文档的最佳方法是为你提供一个示例。以下子章节合在一起可以被视为一份完整的、有效的安全策略。当你阅读它们时，请想象每个子章节实际上是更大策略的某个特定组成部分。此外，请注意每个章节中解决的具体问题。\n\
  \n我们为显然是虚构的“ABC Web 开发”公司编写了以下示例策略。尽管它是虚构的，但与任何真实公司的相似之处完全是巧合，不应对任何真实公司做出任何直接推断。\n\
  \n第一节：ABC Web 开发：安全使命宣言。这是一个安全使命宣言的示例：\n\n\n\n\n\nABC Web Development 的每一个人都非常重视安全，我们为自己能够确保完全符合您对保护敏感应用程序代码和数据的预期而感到自豪。\n\
  \n即使是像这里这样简单的安全使命声明，也能清晰地传达你对安全的重视，以及你如何向客户和委托人承认其重要性。\n\n## 第 2 节：负责安全的人员识别\n\n\
  在制定安全使命声明的同时，明确识别组织中负责安全的人员通常也是一个好主意。\n\n对于 ABC Web Development 公司而言，安全责任由以下个人和小组承担：\n\
  \n*   `Network administrators`：这些人员负责维护网络 Web 服务器，并确保这些服务器保持最新的安全补丁和防病毒定义更新。\n*\
  \   `Application developers`：与网络管理员一起，应用程序开发人员负责在安全编程方面遵循所有最佳实践，并在其生成的代码中充分利用 Web\
  \ 服务器的安全功能。\n*   `Application architect`：这些人员负责监督整个应用程序开发过程，并完成和管理涉及应用程序开发的安全策略、相关文档以及变更控制策略策略。\n\
  \n## 第 3 节：确保物理安全\n\n本节详细说明了此类物理安全问题，例如进入建筑基础设施的权限；纸质记录的销；对敏感计算机硬件的访问（即服务器机房或主数据中心）；等。\n\
  \n关于防止未经授权访问的章节表述可以通过简短的编号列表简要描述，如下：\n\n1.  关于 ABC Web Development 主楼内特定安全区域访问权限的具体人员说明已在醒目位置张。\n\
  2.  所有 ABC Web Development 员工都应主动监控限制区域的访问情况。\n3.  为了维修或交付对限制区域的访问应降至最低，且进入人员应理解\
  \ ABC Web Development 的保密要求。\n4.  任何涉及非 ABC 人员的现场支持合同都应包含关于隐私、保密和标准的条款。\n5.  将实施\
  \ ABC Web Development 员工的身份证。\n6.  所有 ABC Web Development 员工应明确理解锁门窗程序。尽管这一程序应该普遍执行，但\
  \ `Security Officer` 有责任监控这些物理安全行动。在 `Security Officer` 缺席的情况下，由 `Security Officer`\
  \ 的指定人员负责执行此程序。\n7.  在 ABC Web Development 员工离职时，将从离职员工处收回所有办公室钥匙。\n8.  ABC Web\
  \ development 大楼经理将维护钥匙登记和日志。\n9.  一旦员工因任何原因离职，将立即强制取消其电子系统的访问权限。\n\n此列表中的许多项目基于常识。尽管如此，在问题出现时，花时间在您的安全策略中快速明确这些内容可以产生决定性的影响。\n\
  \n## 第 4 节：防病毒和补丁管理策略\n\n作为一名负责的开发者和服务器管理员，你采取措施确保你的服务器和工作站及时更新到最新的防病毒定义文件和安全补丁。尽管如此，你应该在安全策略中包含一个章节，概述你如何处理这一关键问题的具体细节。该章节不需要详尽的逐步步骤列表，而是：\n\
  \n*   `Definition of patch management`：ABC Development 网络由运行来自许多供应商各种软件的计算机（包括客户端和服务器）组成。人们频繁尝试识别并利用这些产品中的安全漏洞。ABC\
  \ Web Development `Security Manager Network Administrator` 将负责监控这些每月列表，以及来自其他机构的通信，以确定其对网络可能的影响。\n\
  *   `Procedures for addressing infected/compromised machines`：当一台计算机被确定为受感染时，将检查该机器的防病毒和安全日志以确定严重性。例如，如果防病毒软件已隔离了文件，这可能意味着威胁已遏制；然而，如果防病毒软件没有隔离文件，则意味着存在更大污染的可能，受影响的机器将被完全移除。在最坏的情况下（即多台\
  \ ABC 服务器被感染），将立即实施此处指示的指令。\n\n## 第 5 节：备份与灾难恢复\n\n没有人喜欢思考在灾难后必须恢复网络（以及其中包含的敏感数据）；不幸的是，这种行动计划是常有的事。在我们一位作者居住的地方，一家小型互联网服务提供商（ISP）其主数据中心遭遇了灾难性的火灾。令人惊讶的是，该提供商仅离线了几天，而且非常奇的是，客户没有经历任何数据丢失。（我们可以证明这一点，因为其中一位作者就是其客户！）\n\
  \n在服务离线期间，该 ISP 仍然设法通过外部来源和在其外呼语音信箱系统中保留定期更新消息来传达情况。当提供商恢复在线并恢复正常的电子邮件服务时，它在向客户清晰传达损害范围方面做得非常好，并对该\
  \ ISP 实施的非常有效的灾难恢复计划提供了见解。（该 ISP 有一个离线备份数据中心，可以从中恢复所有敏感数据。）\n\n\n\n\n\n## 数据备份方法\n\
  一种有效的数据备份方法是同时使用差异备份和全量备份。例如，从周一到周四，每天晚上执行一次差异备份。在这种情况下，`Differential` 被定义为自上一个晚上上次全量备份以来任何被更改或更新的文件。差异备份涵盖所有网络服务器。这些差异备份将至少存储两周，然后被覆盖。在周五晚上，执行一次每周全量备份（在此情况下\
  \ `weekly` 被定义为从周五到周五），捕所有网络服务器上的所有数据。这些每周备份至少存储两周，然后被覆盖。在每个月的最后一个周五，执行一次每月全量备份以代替每周备份。每月备份存储六个月，然后进行回收。\n\
  \n任何负责过备份管理工作的人都会告诉你，数据备份的过程可能是枯燥的，因为备份硬件和软件往往会出现不可理性的故障。（译者注：它们往往会以无法解释的原因无法正常工作。）但正如我们之前关于\
  \ ISP 灾难性火灾的案例所所示，在任何有效的安全策略中，拥有一个可靠的敏感数据备份流程是绝对必须的。\n\n## 所有网络硬件（服务器）清单\n在典型的安全策略中，你应该为你\
  \ Web 基础设施中的每台服务器提供特定的供应商和型号信息。\n\n例如，你可以提供一个表格，详细列出所有网络硬件，列包括硬件型号、序列号、保修类型、保修过期日期、供应商网站和客户服务电话号码。\n\
  \n## 优先级服务器列表及其在意外事件后的恢复上线顺序\n鉴于本章充满了我们要求你想象的各种不愉快场景，这里又是一个例子：想象你的房子着火了。在家里所有的物品中（当然，不包括你的家人成员，因为他们是你的首要任务），你会优先抓住哪一或两样东西作为重点物品拿走？这是一个很难的问题，但你必须快速回答。在你的安全策略中设立一个“恢复优先级”子章节是至关重要的，这与“房子着火”的问题类似。在发生意外事件后，哪些服务器（以及相应的应用程序/系统）应该是首要恢复上线的？\n\
  \n## 第 6 节：变更控制流程\n如果你是一个典型的 Web 开发人员，你永远不会对自己编写的任何代码感到完全满意。很多时候（我们是指很多时候），我们从深睡中醒来时，脑子里会有一个关于如何编写特定解决方案的更好主意。这暗示了某种内在心理状态，还是仅仅证明了我们睡眠很浅，我们宁愿不回答。\n\
  \n但是，我们知道的是，在整个技术领域特别是 Web 开发中，变化是不可避免且快速万变的的。如果你想在 Web 开发领域中保持领先地位（特别是在快速变化的 `PHP`\
  \ 和 `MySQL` 开源社区中），你必须准备好接受并实施变更。\n\n尽管如此，你始终应该通过严谨且文档完备的流程对已建立的系统实施变更。在本章稍早之前，我们讨论了敏感数据被意外修改或更改的安全威胁。可能没有哪个地方的风险比在没有经过适当审查和测试的情况下实施代码更改更大。（当代码更改没有经过清晰的审查和测试时，数据丢失、机密数据泄露以及其他安全风险也会大大增加。）为了应对实施变更带来的危险，你的安全策略应该包含一个关于变更控制流程的章节。你的变更控制流程应包含以下信息：\n\
  \n### 实施后变更控制的定义\n在系统引入生产环境后，必须建立一套特定的程序和协议，以确保以最高效、最有组织的方式对该系统进行更改或更新。必须考虑到系统所支持的所有流程并进行周密的规划，以便更改或更新能使系统符合所有既定的机构政策和程序。此外，这种规划对于确保更改或更新经过充分测试也关重要，以避免出现无计划的系统停机。\n\
  \n### 特定应用背景下“变更”与“更新”的定义\n在特定应用程序的背景下，`change` 和 `update` 的典型定义包括：原始应用程序代码的修改；可能影响生产系统性能、可用性和数据完整性的任何硬件修改；与\
  \ Web 应用程序交互或对接的其他系统（如底层 `MySQL` 数据库）的任何修改；以及管理系统内部信息的流程修改。\n\n### 实施前必须批准变更的人员\n\
  在确定需要更改或更新后，应使用应用程序设计文档对更改进行完整描述，并由指定人员完成并批准。此类人员可能包括开发人员、网络/服务器管理员、安全官和其他技术管理人员。\n\
  \n我们在这里提到的应用程序设计文档（我们在稍后会描述）包含了系统测试、培训、项目开发时间以及在考虑更改生产系统时应解决的关键问题的特定章节。特别是对于服务大量用户、处理和存储敏感数据的应用程序，这些变更控制和设计文档应在实施到现网环境之前完成并通过。\n\
  \n记录应用程序设计可能被某些开发人员认为是枯燥的，但为了维护准确的变更控制日志，考虑到在需要回滚或返回应用程序代码之前的版本时跟踪所有更改，这是绝对必要的。\n\
  \n此类变更控制和设计文档不需要冗长，但至少应包含以下九个章节：\n\n1. **待执行工作识别**：此开头章节应详细说明要执行的工作或变更类型，包括请求工作人员简要列表及其理由、项目的简要总体背景等。该章节还应指定负责开发应用程序的人员。\n\
  2. **当前状况陈述**：此章节应回答“为什么要实施系统更改？”，并包含更改或更新需求的合理性理由。\n3. **需求定义**：此章节解决如下问题：\n  \
  \ - 新应用程序代码的功能需求是什么？\n   - 新代码的性能需求是什么？\n\n\n\n\n\n# 开发安全策略\n\n- 新代码的信息化需求是什么？\n\
  - 新代码的可维护性需求是什么？\n\n## 4. 实施前的变更管理\n如果在开发新代码之前，由现有系统代码支持的流程需要进行任何形式的更改，则本节应描述这些所需的变更以及促进这些变更的方法。可以将本节想象成道路施工队处理大型公路改修项目的方式。在大多数情况下，当道路维修时，主路线并不会完全关闭；而是通过重新规划车道来确保交通继续。同样的原理也适用于这里：在实施代码更改时，可能会导致其他底层系统变化，这些变化（例如）可能临时禁用应用程序的特定部分，以避免潜在的故障。\n\
  \n## 5. 供应商需求\n假设现有使用了特定的第三方软件或硬件，代码的更改是否会导致这些软件或硬件出现操作性问题？如果你是 Windows 用户，对这个问题可能有些经验：例如，在从\
  \ Windows XP 升级到 Windows Vista 之前，你需要知道你的底层硬件（即你的个人电脑）是否支持新操作系统的要求。显然，这是一个你希望在实施变更*之前*回答的问题！\n\
  \n## 6. 系统安全\n本节应概括性地描述新代码的安全模型。变更是否会影响单个用户的访问访问角色？代码更改将如何影响应用程序的其他部分，或链接到正在更改的程序的应用程序？简而言之，本节应该概述你的双重检查计划，以确保你的代码更改没有留下安全漏洞。\n\
  \n## 7. 系统代码文档\n显然，新代码的工作方式与现有代码不同（甚至可以说更好！），否则你不会进行更改的。尽管如此，新代码应该有完整的文档记录，以便自 `Book\
  \ IV` 成立以来未参与该应用程序的未来开发者能够清晰地理解所有代码功能。\n\n## 第一章\n\n## 8. 运营支持计划\n变更的发生往往伴随着对新的\
  \ `General Security` 培训的需求，更说对所有系统代码进行测试了。你的 `Considerations` 文档的部分应该概述谁负责开发或领导此类培训以及对新系统代码进行质量保证（QA）测试。\n\
  \n## 9. 业务连续性/回滚计划\n简而言之，如果你实施了新代码，结果……事情并没有完全按照你预想的那样运行，你的计划是什么？如何恢复（或 `rollback`）到应用程序代码的最新且稳定的版本？在回滚过程中，系统支持的流程将如何继续进行？如果发生系统停机，将如何通知？所有这些问题都需要在本节中解决。\n\
  \n# 变更管理：发布通知！\n\n在任何更改之前，沟通是绝对至关重要的。我们所说的沟通不是指变更的每一个细节，但你应该沟通足够的信息，让他们知道以下重要事项：不仅是开发者之间，而且——更重要的是——与使用系统的人进行沟通。\n\
  \n### 为什么要实施此变更？\n没有什么比经常使用一个系统，却在某天登录时发现一切完全改变了，且没有任何关于变更到来的通知更令人沮丧的。根据受众的不同，这些信息不需要过于技术化，但应该传达对变更的总体描述，特别是当应用程序代码的更改将导致系统外观或功能的显著差异时。\n\
  \n从安全的角度来看，适当的沟通也至关重要。想象特定系统代码的更改会导致数据存储方式的改变。对于这个例子，如果系统的更改导致只存储账户的最后四位数字而不是整个号码会怎样？从表面上看，这似乎不是一个大问题，因为关于（在这种情况下是）客户账户的其他身份识别信息可以通过搜索客户的姓氏、地址等轻松获取。但如果存储提交给应用程序信息的底层\
  \ `MySQL` 数据库也被另一个应用程序使用，而该应用程序需要完整的账户号码呢？\n\n### 变更何时实施？\n你不想在要实施变更的前一天晚上才发送首次重大变更通知。用户需要充足的提前时间为系统停机做准备，并调整他们自己的工作计划。这在电子商务网站上尤其如此。你最不希望的是变更在客户交易过程中实施。另一个应用程序的用户也会发现自己经历了严重的系统问题，因为在不考虑整个应用程序的情况下进行此类变更，结果可能是错误或数据丢失。\n\
  \n### 变更需要新的培训吗？\n如果代码更改如此重大，以至于系统外观和功能的发生变化可能会困扰用户，你应该考虑开发培训材料（用户指南）。更新现有的系统文档（如\
  \ `FAQ` 类型的知识列表和其他在线文档）是必须的。在涉及变更控制时，沟通没有多少限制。你不想用每一个细节来淹没用户。\n\n\n\n\n本质上，`password`\
  \ 仅仅是一个只有你才知道的字符字符串。如果你是唯一知道这串字符的人，那么任何在提示时输入该字符串的人都必然是你本人。对吧？\n\n并非总是如此。\n\n使用密码认证的一个大问题是，密码可能会丢失、被盗或被猜中。\n\
  \n## 丢失的密码\n\n密码丢失给开发者带来了一点不便，但它们并不是真正的安全问题。当用户丢失或忘记密码时，他们只会来找你。在那时，用户并不关心安全性，他们只想让你帮你解决问题，以便他们重新回到你的在线商店下单。针对密码丢失问题，你可以使用两种常见解决方案中的一种。\n\
  \n* 通过电子邮件向用户发送密码，或在浏览器中显示密码。\n* 将密码重置为随机字符串，并要求用户在下次登录时更改密码。\n\n最简单、侵入性最小的方法是在用户忘记密码时直接把密码给他们。遗憾的是，这也是最不安全的方法。\n\
  \n任何人都可以用户名并点击“忘记密码”链接。大多数使用这种方法的开发者都会要求用户在找回密码之前回答一个次要秘密问题。有些开发者更进了一步，只将密码发送到与用户账户关联的电子邮件地址。这种方法可以防止他人拦截合法用户的密码。\n\
  \n将丢失的密码重置为随机字符串比简单找回现有密码更安全，但这种方法对开发者和用户来说都涉及更多工作。用户需要登录并更改密码——希望是一个他们能记住的东西！——在此之前他们才能对你的应用程序进行任何其他操作。这种方法还需要更多的编程，因为你需要一个随机密码生成程序，以及一段在用户登录后立即引导用户更改密码的代码。\n\
  \n## 被盗或被猜中的密码\n\n密码的安全性取决于其所有者。用户必须在记忆一串字符的能力与保持账户安全的需求之间取得平衡。\n\n易记忆的密码（如名字、生日或其他有意义的单词）也很被他人猜中。\n\
  \n例如，假设 Bob Jones 正在为他的电子邮件账户创建密码。他的用户名是 `BJones`，所以他选择 `BJones` 作为密码。这很有道理——使用这个密码，他只需要记住一个信息，而不是两个。Joe\
  \ Smith 是 Bob 的同事之一，他想向整个公司通讯录发送一封不当的邮件，但他不想被抓到。当 Bob 在开会时，Joe 尝试登录 Bob 的电子邮件账户。他知道\
  \ Bob 的用户名，因为公司里的每个用户名都是以相同的方式构建的——名字的首字母，后面跟着姓氏。Joe 尝试的第一个密码之一就是 `BJones`。*Voilà*——Joe\
  \ 进去了，而 Bob 却因为 Joe 的不当邮件遭了埋备。\n\n显然，像示例中这样简单的密码太不安全了，不值得。什么构成了安全的密码？最安全的密码包含以下元素的部分或全部：\n\
  \n* **小写字母**：`a–z`\n* **大写字母**：`A–Z`\n* **数字**：`0–9`\n* **特殊符号**：`!@#$%^&\\*( )-/<>`（以及其他符号）\n\
  * **长度**：密码越长，越难被猜中。理想情况下，密码长度至少为六到八个字符。\n* **随机性**：随机字符集合比字典单词要难猜得多，即使该字典单词包含了大小写字母的混合，并用数字或符号代替了字母。\n\
  \n在邮件事件之后，Bob 能够证明在发送邮件时他不在电脑前，因此他没有被埋备。然而，他确实收到了系统管理员和经理关于密码和加密的彻底讲解和备忘录。决心不让他的电子邮件账户再次被破解，Bob\
  \ 立即将密码更改为 `jfEi\\*2m@fKls`。\n\n他知道自己无法记住这样一个随机字符串，所以考虑将其写下来，直到他能背下来为止。他检查了备忘录中的建议，发现写下密码是绝对不允许的，因此他需要依靠记忆。\n\
  \n在致电技术支持要求每天重置密码一周后，系统管理员建议 Bob 选择一个既安全又好记的密码。创建这种密码的一种方法是想出一个短语，然后将每个单词的首字母组合成一个字符串。例如，**B**ob\
  \ **N**eeds **A M**uch **B**etter **P**assword 变成 `BNAMBP`。\n\n接下来，Bob 对该字符串进行了以下更改以确保其安全：\n\
  1. 用 `2` 代替第一个 `B`（因为 `B` 是字母表中的第二个字母）\n2. 将 `A` 更改为 `@`\n3. 将 `M` 改为小写\n\n结果是 `2N@mBP`。\n\
  \n## 存储密码\n\n让用户创建安全且易记的密码只是战斗的一半。你的应用程序需要通过将用户输入的密码与已知密码副本对比，来决定是否授予用户访问权限。密码通常以两种方式之一存储在应用程序中：\n\
  \n* **在应用程序内部**：密码硬编码在应用程序中。这种方法仅适用于极少数用户，你可能会发现它很难维护。\n* **在数据库中**：这种最常用的存储方法将用户凭据与应用程序分离，不会受到文件系统泄露的影响，而且在创建新用户时不需要手动更新。\n\
  \n你的应用程序可能已经在使用数据库来存储用户信息、会话数据和其他信息，因此在那里也存储身份验证信息也是合理的。事实上，如果你已经在存储用户信息，你可能只需要在用户表中添加一个密码列即可。在决定了在哪里存储身份验证信息后，你需要决定是明文存储还是进行加密。我们将在本章节随后的单向加密部分介绍加密密码。\n\
  \n## 图像识别\n\n破解者用来破解账户的工具之一是简单的暴力破解。他们不会坐在键盘前一个晚上尝试猜密码，而是将过程自动化，让他们的计算机（更可能是他们通过网络劫持的他人的计算机）系统地撞击，直到命中正确的字符组合。\n\
  \n暴力破解对于破解弱密码很有用，但它对于创建黑客可以用来发送垃圾邮件的账户更为有效。这是一个它是如何工作的示例。Jane Andersen 运营着 People\
  \ Named Jane 博客。她设置应用程序要求访问者在发布评论之前创建账户。这一要求消除了她博客中的一些垃圾邮件。但她注意到系统中出现了许多显然虚假的账户，这些账户全被用来在她文章的评论中发布垃圾信息。\n\
  \n破解者可以自动化创建账户的过程，创建账户的速度比人类管理员删除的速度快。尽管 Jane 最终删除了大多数虚假账户，但某些账户留存了足够的时间，让破解者利用它们在\
  \ Jane 的博客上到处发布廉价处方药广告。\n\n\n\n除了每天花 24 小时删除虚假用户账户之外，还能如何防止这种情况的发生呢？要求新用户执行一项对人类来说简单但对计算机来说极其困难的任务。最常见的任务是要求访问者识别图像中编码的字母和数字组合。这些字符通常是模糊、倾斜或被划掉的。\n\
  \n通过这种方式模糊它们并不会真的让人类感到困惑，但会让计算机识别这些字符变得极其困难。这种方案被称为 `CAPTCHA`（用于区分计算机与人类的全自动图灵测试）。\n\
  \n## 访问性问题\n\n视觉识别方案的主要问题是视障用户无法完成所需的任务。一些网站通过发布被模糊字符串的音频片段来解决这个问题。音频片段的安全性较低，因为黑客可以使用语音识别软件来解释音频片段。而且，语音识别软件比黑客用来解释视觉图像的光学字符识别（`OCR`）软件更准确、更先进。\n\
  \n### 第四卷第 2 章 加密身份认证 概述\n\n如果你选择实现 `CAPTCHA`，请记住某些用户无法访问你的应用程序。\n\n## 实现图像识别\n\n\
  几十种 `CAPTCHA` 方案已被证明容易受到旨在绕过或击败 `CAPTCHAs` 的计算机算法攻击。这些击败 `CAPTCHA` 的算法平均准确率达到 80–100%。然而，这些准确率是在具有近乎无限时间和实验环境下生成的。在实践中，即使是弱的\
  \ `CAPTCHA` 也能防止大量的垃圾邮件。\n\n在应用程序中实现 `CAPTCHA` 的第一步是选择一个难以破解的。弱的 `CAPTCHA` 具有以下部分或全部特征：\n\
  \n* 固定字体\n*✦ 对齐的字符\n*✦ 字符位置固定\n*✦ 旋转固定\n* 无变形\n* 无纹理背景\n* 固定颜色\n* 极少或没有（视觉失真）\n\n\
  此外，人类在解决某些非常强大的 `CAPTCHA` 时也会遇到问题。你需要在增加用户负担和保护应用程序免受自动化攻击之间找到平衡点。\n\n你可以找到几个适用于\
  \ `PHP` 的现成 `CAPTCHA` 软件包，包括来自 `PHP` 扩展与应用库 (`PEAR`) 的 http://pear.php.net 的 `Text_CAPTCHA`\
  \ 和 `Text_CAPTCHA_Numeral`。\n\n`第五卷第 2 章` 有更多关于 `PEAR` 的信息。\n\n## 数字身份\n\n密码和 `CAPTCHA`\
  \ 可以帮助判断是否应该授予用户访问特权资源的权限。结合用户名，你可以使用这些方法来验证用户的身份。然而，当你脱离用户必须登录应用程序的情景时，这个系统就会开始失效。\n\
  \n发送电子邮件是一个很好的例子，在那种情况下，使用用户名、密码和 `CAPTCHA` 的系统无法提供足够的数据安全。用户必须向邮件服务器提供用户名和密码，但实际上，大多数人将这些信息保存在自己的电子邮件客户端中并一直运行。许多人发现，让电子邮件客户端在后台运行并在其在新邮件到达时自动下载，比不断登录和注销更方便。遗憾的是，这种便利是有代价的。即使是疏松的破解者也能轻易拦截电子邮件、修改它们并发送出去。大多数电子邮件都是未加密发送的，因为发送未加密的消息更快且消耗的资源更少，而且绝大多数邮件并不值得花精力去加密。\n\
  \n## 数字签名\n\n那么包含敏感信息的电子邮件呢？对于这些消息，接收者必须能够验证两点：\n\n* 电子邮件源自所声明的发送者\n* 没有人以任何方式篡改或修改该电子邮件\n\
  \n`数字签名` 技术通过改进公密钥加密概念提供了这两种保证。（参见本章后面的“公密钥加密”章节。）发送者通过使用私钥对消息进行加密并数字签名。公钥和私钥是由特定算法生成的极长字符串。公钥通常发布在密钥服务器上或随数字签名的电子邮件一起发送。私钥从不共享。接收者通过使用发送者的公钥进行解密。如果接收者可以解密消息，她就知道只有拥有相应私钥的人签名了消息。当然，这整个理论假设发送者是该私钥的唯一持有者。密钥就像密码一样：安全性取决于使用它们的人。如果用户将私钥发布在电子邮件或公告板上（确实有人这样做！），密钥就泄露了。\n\
  \n使用数字签名签署消息有一个问题：根据消息的长度，加密并解密整个内容会消耗大量的资源。为了解决这个问题，加密算法实际上加密的是消息的精简版本，称为 `摘要`。\n\
  \n### 第四卷第 2 章 加密身份认证 概述\n\n与我们稍后将讨论的普通公密钥加密不同，数字签名不能防止破解者拦截和读取消息。数字签名并不是为了模糊消息内容；它只是验证发送者的身份以及消息是否完整送达。数字签名通过通过产生摘要的相同算法来验证消息的完整性。如果该算法的结果与摘要匹配，则消息可能没有修改过。\n\
  \n## 数字证书\n\n数字证书与数字签名（我们在上一节中讨论过的）类似，但数字证书验证的是服务器身份，而不是个人。它们通常用于电子商务交易，向用户确保他们确实正在与他们认为的公司或网站进行交易。\n\
  \n破解者可以创建一个与图像一模一样的商店网站，并利用钓鱼技术说服你访问破解者的网站，让你以为你正在访问商店的合法网站。然而，破解者*无法*做到伪造合法网站的数字证书。\n\
  \n数字证书包含公钥以及公司或个人的联系信息，并采用数字签名的格式。有了这些信息，你可以发送加密数据（如支付信息），并确定你正在与合法的个人或业务交易。\n\n\
  第三方证书颁发机构提供这种保证。颁发机构在发布数字证书之前验证个人或组织的身份。如果你信任该颁发机构，就可以信任带有该证书的网站。\n\n## 探索加密\n\n\
  加密是所有数字签名和数字证书的基础。以下章节将介绍加密的基本知识。\n\n### 基础概念和术语\n\n\n\n\n\n首先，你需要掌握这些词汇。加密是那些似乎仅仅为了困扰所有人而故意使用缩写和晦涩术语的话题之一。在我们讨论加密技术之前，你需要理解两个基本概念，我们将在接小节节涵盖这两个概念。\n\
  \n### 盐 (Salt)\n\n在加密领域，`salt` 是一个添加到加密密钥或密码中的随机数，用于保护其不泄露。就像一撮食盐（氯化钠）可以让一堆薯条从平淡变得美味一样，添加到你的加密算法中的随机数可以让你的信息从轻易被窃取变得相当安全。\n\
  \n## 探索加密\n\n### 加密强度\n\n`强加密`是一个相对术语——今天无法破解的加密，可能在一个月、一年或五年后就能被轻易破解。加密方法的强度取决于用于加密数据的密钥的位数（bits）。通常情况下，你使用的位数越多，破解你的加密方法就越困难。\n\
  \n加密通常通过暴力破解来破解。破解者编写或获取一个脚本，向加密引擎投掷随机值，希望为已知明文值猜测正确的加密值。这种方法的关键在于处理器周期和时间。只要有足够的其中一种（或两者），破解者不可避免地破解任何加密方案。根据目前的硬件（截至\
  \ 2007 年底），破解 128 位加密大约需要 40 年；256 位加密所需的时间呈指数级增长——远超普通破解者的寿命，更不用说注意力时长了。而且，等某人*真的*破解了加密时，这些数据可能已经没有意义了。\n\
  \n### 单向加密\n\n单向加密方法是不可逆的。在你加密一段数据后，你永远无法恢复明文。从表面上看，这种方法似乎相当没用，尽管它非常安全。这就像写一封秘密信，把它锁在箱子里并销毁钥匙。但这并不是全貌。\n\
  \n事实上，许多开发者和数据安全专业人员倾向于使用单向加密存储密码。当用户输入密码时，输入将使用用户首次创建密码时相同的相同进行加密。比较这两个加密字符串——如果它们匹配，说明密码是正确的。\n\
  \n### 公钥加密\n\n公钥加密是 Web 应用安全中最常用的技术之一，它是数字签名和数字证书的基础技术。公钥加密依赖于两个密钥：私钥（只有通信中的一方知道）和公钥（你可以广泛分发并在不安全的网络上传输）。\n\
  \n任何用公钥加密的消息只能用相应的私钥进行解密。同样，用特定私钥加密的消息只能用相应的公钥进行解密。\n\n用户的私钥通常存储在其本地计算机的文件中，据测没有存储在其他地方。遗憾的是，某些用户（通常是因为无知而非主观恶意）会将他们的私钥提供给其他用户，从而损害该私钥在确保完整性方面的有效性。\n\
  \n### 哈希函数\n\n数字签名和证书使用哈希函数（通常是 MD5 或 SHA）。哈希函数是*确定性的*——相同的消息总是产生相同的摘要。遗憾的是，尽管公钥加密相当安全，但它非常消耗资源且缓慢。为了加快这一过程，可以使用哈希函数创建一个摘要。如果消息通过哈希函数的结果相匹配，你就知道消息已经送达。\n\
  \n加密方法是任何关注安全的人头疼的主要原因之一，这并不是秘密，但只要你记住以下几点，你就能占据先机：\n\n- 为了确保消息完整无误，请使用哈希函数创建一个摘要，然后用你的私钥加密该摘要。\n\
  - 为了保证消息确实来自你，使用你的私钥对其进行数字签名。\n- 为了确保你的消息只能被预期接收者读取，使用接收者的公钥对其进行加密。\n\n## 第 3 章：创建安全环境\n\
  \n### 本章内容\n\n即使是最安全的 Web 应用程序，如果运行在不安全的环境中，也可能被破解——就像如果你留着窗户锁车门是没用的一样。\n\n你可以通过确保你的\
  \ PHP 应用运行在相当安全的服务器上来最容易地保护它。Web 服务器从本质上是不安全的，因为为了提供服务，它们必须允许对某些文件和应用程序的匿名访问。但是，你可以采取几个简单的步骤防止恶意用户滥用\
  \ Web 服务器。\n\n根据 NetCraft 2007 年 9 月的调查，两大 Web 服务器 Apache 和 Internet Information\
  \ Server (IIS) 共同服务了互联网上 85% 的网站。在本章中，我们将引导你保护每种服务器。\n\n### 安全 Apache\n\n保护 Apache\
  \ Web 服务器是一个很广泛的话题，因此，我们与其尝试将所有内容挤进一个章节，不如专注于在它运行 PHP 应用时让 Apache 更安全的两种方法：使用 SuExec\
  \ 和 ModSecurity。\n\n#### 使用 SuExec  PHP 应用\n\n如果你的应用程序运行在 Apache 上（互联网上超过一半的网站都是如此），你可能想考虑在\
  \ Apache 配置中启用 SuExec。`SuExec` 是 Apache 自带的一个机制，它使脚本作为脚本所有者的用户身份运行，而不是作为 Web 服务器用户的身份运行。\n\
  \n\n\n\n\n在非 SuExec 环境下，所有脚本都以 Web 服务器本身相同的用户 ID 运行。遗憾的是，一个有漏洞的脚本就可以让恶意用户获得整个 Web\
  \ 服务器的后门访问，包括运行在同一服务器上托管的其他网站的脚本。\n\n`SuExec` 试图通过将 Web 应用限制在各自的区域，并以所有者的用户 ID 而非\
  \ Web 服务器的用户 ID 运行它们来解决此问题。例如，此脚本将在 `jsmith` 的用户 ID 下运行：\n\n`/home/~jsmith/public_html/scripts/please_hack_me.php`\n\
  \n恶意用户可以利用此脚本，但他或她将只能访问 `jsmith` 用户允许使用的文件和程序。服务器上的其他所有用户将免受 `jsmith` 不安全脚本的侵害。\n\
  \n遗憾的是，要让 `SuExec` 与虚拟主机（即物理位于同一台 Web 服务器上的多个独立 Web 网站）正常工作可能是非常复杂的。`SuExec` 设计用于运行位于\
  \ Web 服务器文档根目录下的脚本。大多数虚拟主机的设置方式是每个独立的 Web 网站都有自己的文档根，且每个网站的文档根并不位于 Web 服务器的文档根目录下。要绕过此限制，系统管理员必须在\
  \ Apache 文件中每个虚拟主机的文档根添加到 Web 服务器的文档根变量中。\n\n`SuExec` 还要求 PHP 脚本以 `CGI`（通用网关接口）运行，这比在\
  \ `Apache` 下作为预编译模块运行 `PHP` 要慢得多。`CGI` 是 Web 应用的第一种可行模型，目前仍用于简单脚本。然而，一旦你离开 `PHP`\
  \ 脚本领域并开始编写全功能应用程序，你将需要预编译 `PHP` 带来的性能提升。\n\n对于相当简单的 Web 服务器，`SuExec` 可以防止一个不安全的应用程序破坏所有其他内容。然而，在具有虚拟服务器、预编译模块以及几十个或数百个用户的更复杂环境中，你需要一个更健壮的安全模型。\n\
  \n`ModSecurity`（我们将在下一节中介绍）是 Web 服务器安全的一次巨大飞跃，特别是对于运行虚拟服务器和预编译 `PHP` 的服务器。\n\n#\
  \ ModSecurity\n\n`ModSecurity` 是一个任何 `Apache` 服务器都不应缺失的开源模块。它是一个健壮的过滤引擎，监控传入的请求（包括\
  \ `GET` 和 `POST`），并剔除可能给服务器及其应用程序带来问题的请求。如果你的服务器正在运行 `SuExec`，`ModSecurity` 是一条极佳的第一道防线——在\
  \ Web 服务器安全方面，防线越多越好！\n\n`ModSecurity` 通过拦截所有指向你 Web 服务器的流量来工作。它将流量与一组规则进行比较，以决定停止每个数据包还是允许其进入\
  \ Web 服务器。将其想象成有一个站在你服务器门口的私人保镖。\n\n`ModSecurity` 默认带有一组核心规则，旨在保护服务器免受大多数通用攻击。你可以根据需要添加自己的规则，以响应针对应用程序的特定攻击。\n\
  \n遗憾的是，`Apache` 不自带 `ModSecurity`，所以你必须自己获取。幸运的是，它是开源的，并可以在 `www.modsecurity.org`\
  \ 下载。\n\n# 安全 IIS\n\n接下来的章节涵盖了保护 `IIS` 服务器的两种主要方法。第一步是减少服务器入口点的数量。第二步是非系统驱动器上设置你的\
  \ Web 根目录。\n\n## 减少服务器的足迹\n\n保护 `IIS` 服务器的第一大步是减少服务器在 Web 上的“足迹”，即访问你服务器的入口数量。服务器与外部世界的入口点应尽可能少；每个开放的端口都是黑客的机会。一个好的规则是，如果你绝对不需要某个端口开放，就应该显式地关闭它。\n\
  \n如果你正在运行由你本地管理的专用服务器，应该从禁用 `SMP` 和 `Netbios` 开始。禁用这些网络协议可以阻止服务器作为文件/打印服务器运行。它还能防止服务器通过网络进行管理。如果你需要远程管理服务器，就不能完全禁用这些服务，请禁用任何你需要的子组件，例如\
  \ `NNTP`、`SMTP`、`FTP`、`BITS`、`Internet printing` 等。默认情况下，这些服务中的大多数是禁用的。\n\n### 环境\n\
  \n按照以下步骤禁用不需要的服务：\n\n1. **选择“开始” ➪“管理工具” ➪“服务 MMC”。**\n\n在弹出的“服务”窗口中，找到你想要禁用的服务，如图\
  \ 3-1 所示。\n\n![Image 41](img/index-415_1.jpg)\n![Image 42](img/index-415_2.jpg)\n\
  \n**图 3-1：** 在服务窗口中突出显示你想禁用的服务。\n\n2. **双击你要禁用的服务的名称。**\n\n出现“计算机浏览器属性”对话框。\n\n\
  3. **在“启动类型”下拉列表中，选择“禁用”（如图 3-2 所示），然后点击“确定”。**\n\n关闭“计算机浏览器属性”对话框。\n\n**图 3-2：**\
  \ 将启动类型设置为禁用。\n\n## 保护 Web 根目录\n\n在禁用了你可以不需要的服务后，你接下来需要在非系统驱动器上设置你的 Web 根目录。这样做可以防止黑客访问你的系统文件。他们只能访问该驱动器上的文件，这意味着你阻止了目录遍历攻击（这种攻击涉及黑客导航目录结构访问他们不应访问的服务器部分）。要在非系统驱动器上设置\
  \ Web 根目录，请按照以下步骤操作：\n\n1. **选择“开始” ➪“我的电脑”，然后在弹出的“我的电脑”窗口中双击一个辅助硬盘。**\n\n你选择的硬盘可以是虚拟驱动器，但将\
  \ Web 根托管在独立的物理硬盘上更好。这样，如果主硬盘故障，你至少没有丢失存储在 Web 根中的数据。\n\n2. **在 Windows 资源管理器中，导航到将托管\
  \ Web 根的驱动器。右键点击该驱动器并选择“新建”➪“文件夹”，创建一个 Web 根文件夹。**\n\n你可以为此文件夹命名任何名称，只要在创建 Web 站点属性时将该文件夹设置为\
  \ Web 根即可。\n\n3. **右键点击新文件夹并选择“共享和安全”，为该文件夹设置访问控制列表 (ACL)。**\n\n你可能想创建一个“Web 作者”组，并赋予读取、写入、修改和列出文件夹内容的权限，这可以通过打开控制面板并点击“管理工具”来实现。点击“用户和组”并创建一个新组。然后，同样的方法创建一个仅限读取和执行权限的“Web\
  \ 用户”组。\n\n4. **在 Web 根文件夹下为你计划托管的每个 Web 站点设置子文件夹。**\n\n5. **为每个 Web 站点创建一个用户，并授予该用户访问其相应子文件夹的权限——而不是任何其他\
  \ Web 站点的子文件夹。**\n\n\n\n\n\n3. 按照网站创建向导中的提示进行操作。\n\n4. 在向导的网站主目录屏幕上，勾选 `Allow Anonymous\
  \ Access to This Web site`（允许访问此网站）复框（除非你希望每个访问网站的用户都登录），并为每个网站输入你创建的子文件夹路径，如图 3-4\
  \ 所示。\n\n5. 点击 `OK` 向导。\n\n**图 3-4:**\n输入为网站创建的子文件夹路径。\n\n现在，你需要为每个网站设置单独的应用程序池（或沙箱）。设置这些程序池可以将不安全的应用程序限制在它自己的池中，从而限制其对系统可能造成的破坏。这与\
  \ Apache 的 `SuExec` 非常相似，因为它导致应用程序以拥有应用程序池的用户 ID 运行，而不是以 IIS 运行的系统用户运行。\n\n要设置应用程序池，请按照以下步骤操作：\n\
  \n1. 选择 `开始` ➪ `管理工具` ➪ `Internet 信息服务管理器`。\n出现 `Internet 信息服务管理器` 窗口。\n\n2. 右键点击\
  \ `Application Pools`（应用程序池），然后选择 `New` ➪ `Application Pool`（应用程序池），如图 3-5 所示。\n\
  打开 `Application Pool Wizard` 向导。\n\n**图 3-5:**\n打开新的应用程序池向导。\n\n3. 按照提示创建新的应用程序池。在向导的最后一个屏幕上点击\
  \ `OK`。\n\n### 第 3 章\n\n新的应用程序池出现在 `Application Pools` 文件夹中。\n\n### 创建安全环境\n\n4.\
  \ 右键点击新创建的应用程序池并选择 `Properties`（属性）。\n出现 `Application pool name`（应用程序池名称）属性。\n\n\
  5. 点击 `Identity`（标识）选项卡打开 `Identity` 对话框，如图 3-6 所示。\n默认选中 `Predefined`（预定义）单按钮。\n\
  \n**图 3-6:**\n属性对话框。\n\n6. 选择 `Configurable`（可配置）单按钮，并在 `User Name`（用户名）和 `Password`（密码）文本框中输入拥有应用程序池权限的用户及其密码，如图\
  \ 3-7 所示。点击 `OK`。\n\n**图 3-7:**\n已输入用户和密码的属性对话框。\n\n7. 右键点击 `Web Sites` 文件夹中的网站并选择\
