  \ 8:08 PM Page 226 Using SQLite\n\n`SQLite` 是在平面文件中存储数据的一种快速、简单的方法。然而，它比数据库不安全，且无法处理非常复杂的数据。在大多数情况下，你应该将数据存储在\
  \ `MySQL` 中，但你有时可能想将数据存储在平面文件中。例如，你可能想以一种其他程序（如 `Excel`）可以读取的格式写入数据。\n\n使用 `SQLite`\
  \ 存储和检索数据与使用 `PHP` 在平面文件中处理数据非常相似。使用 SQLite 的步骤如下：\n\n1. 连接数据文件。\n2. 发送 `SQL` 查询。\n\
  3. 如果数据存在，使用 `PHP` 处理检索的数据。\n4. 关闭数据文件。\n\n\n\n\n\n面向对象编程开发了新的概念和新术语来表示这些概念。理解这些术语是通往面向对象程序的道路。\n\
  \n# 对象与类\n\n面向对象程序的基本元素是 `objects`（对象）。将对象理解为物理对象是最容易的。例如，汽车就是一个对象。汽车拥有 `properties`（属性，也称为\
  \ `attributes`），如颜色、型号、引擎和轮胎。\n\n汽车也有可以做的事情，比如前进、后退、停车、翻滚和装死（好吧，至少我们的车会）。\n\n总的来说，对象是名词。人是一个对象。动物、房子、办公室、垃圾桶、外套、云、行星和按钮也是如此。然而，对象不仅仅是物理对象。很多时候对象像名词一样，更具概念性。\n\
  \n例如，银行账户并不是你可以握在手中的东西，但它可以被视为一个对象。计算机账户或贷款也是如此。文件通常是一个对象。数据库也是如此。电子邮件、地址、歌曲、电视节目、会议和日期都可以是对象。Web\
  \ 应用程序中的对象可能是目录、目录项、购物车、客户、订单或客户列表。\n\n`class`（类）是作为模板或模式的 PHP 代码，用于创建对象。类定义了对象的属性（attributes）。它还定义了对象可以做的事情——它的职责。\n\
  \n例如，你写了一个类，定义汽车为四个轮子和一个引擎，该类列出了汽车可以做的事情，比如前进和停车。然后，根据该类，你可以编写类似下面的语句来创建一个汽车对象：\n\
  \n```\n$myCar = new Car();\n```\n\n`$myCar` 是根据 `Car` 类中的定义创建的对象。你的新车拥有四个轮子和一个引擎，并且像\
  \ `Car` 类中定义的那样前进和停车。当你使用汽车对象 `$myCar` 时，你可能会发现它缺少了一些重要的东西，比如门、方向盘或倒车挡。这是因为当你在编写\
  \ `Car` 类时漏掉了一个重要的项目。\n\n从更具技术角度来看，对象是一个复杂的、用户定义的数据类型。从类创建对象的过程被称为 `instantiation`（实例化）。对象是类的\
  \ `instance`（实例）。例如，`$myCar` 就是 `Car` 类的一个实例。\n\n作为编写类的人，你知道类内部是如何运作的。\n\n然而，使用从类创建的对象的人不需要知道对象是如何完成其职责的。我们不知道电话对象是如何工作的，但我们可以用它来打电话。制造电话的人知道内部发生了什么。当有新技术出现时，电话制造商可以拆开电话并进行改进。\n\
  \n只要他不改变界面——键键和按钮——就完全不会影响电话的使用。\n\n### 属性\n\n对象拥有 `properties`（属性），有时也称为 `attributes`。汽车可以是红色的、绿色的或蓝色的。汽车可能具有颜色、型号和大小等属性。这些存储在对象中。例如，汽车可能具有\
  \ `color = red`。\n\n### 方法\n\n对象可以做的事情有时被称为 `methods`（方法）。例如，汽车可以前进、后退和停车。这些在类中定义并由对象使用。\n\
  \n### 继承\n\n对象应该只包含它们需要的属性和方法。不多，也不少。实现这一点的一种方法是使用 `inheritance`（继承）在类之间共享属性和方法。例如，假设你有两个对象：一个有白玫瑰，另一个有红玫瑰。你可以写两个类：一个\
  \ `redRose` 类和一个 `whiteRose` 类。然而，这两个对象的大部分信息是相同的。它们都是灌木，都有刺，而且都在六月开花。继承允许你消除重复。\n\
  \n你可以写一个 `Rose` 类。你可以在这个类中存储共同信息，例如 `$plant = bush`、`stem = thorns` 和 `$blooms =\
  \ June`。然后你可以为两种玫瑰类型编写子类。`Rose` 类被称为 `master class`（主类）或 `parent class`（父类）。`redRose`\
  \ 和 `whiteRose` 是 `subclasses`（子类），也被称为 `child classes`（子类，或者教授亲切地称为 `kids`）。\n\n\
  子类继承父类所有的属性和方法。但它们也可以拥有自己的独立属性，例如 `whiteRose` 类的 `$color = white` 和 `redRose` 类的\
  \ `$color = red`。\n\n子类可以包含与父类同相同的方法。在这种情况下，子类的方法对子对象具有优先级。如果你愿意，可以为子对象指定父类的方法，但如果不指定，则使用子类的方法。\n\
  \n\n\n\n涵盖它们所有的职责，而不侵入其他对象的职责。对于复杂的项目，你可能需要先进行一些模型构建和测试，才能有足够的信心认为你的项目计划包含了所需的所有对象。\n\
  \n开发面向对象的脚本包括以下步骤，接下来的章节将详细介绍这些步骤：\n\n1. 选择对象。\n2. 为每个对象选择属性和方法。\n3. 创建对象并使其投入使用。\n\
  \n## 第二卷\n\n## 第 4 章\n\n### 选择对象\n\n#### 面向对象编程\n\n你的第一个任务是为你的编程项目开发一份所需的对象列表。如果你是独立工作且项目较小，那么这些对象可能是显而易见的。然而，如果你正在处理一个大型、复杂的项目，选择对象列表可能会更加困难。例如，如果你的项目是开发一个管理银行所有任务的软件，那么你可能的对象列表将非常大：账户、柜员、钱币、支票本、垃圾桶、保镖、金库、报警系统、客户、贷款、利息等等。但你需要所有这些对象吗？你的脚本要对大堂前面的垃圾桶要做什么？或者对保镖做什么？嗯，也许你的脚本需要为保镖安排班次。\n\
  \n在规划面向对象的程序时，识别对象的最佳策略是列出你所想到的所有对象——即所有与你的项目有任何关系的名词。有时，程序员可以从项目建议书文档中提取所有名词，开发出一份相当详尽可能对象列表。\n\
  \n在你创建了一个长长的可能对象列表后，下一个任务是尽可能地删掉其中的大部分。你应该消除任何重复项、职责重叠的对象以及与你的项目无关的对象。\n\n例如，如果你的项目涉及造汽车，你的汽车项目可能需要为汽车的每个部分都创建一个对象。另一方面，如果你的项目涉及停车库的交通控制，你可能只需要一个可以移动的汽车对象；汽车的零件对于这个项目来说并不重要。\n\
  \n### 为每个对象选择属性和方法\n\n当你有了一份完整的对象列表后，就可以开始为每个对象开发属性列表了。问问自己你需要了解每个对象的什么信息。例如，对于一个汽车维修项目，你可能需要知道诸如汽车最后一次维修的时间、维修历史、任何事故、零件详情等信息。对于一个涉及停车库交通的项目，你可能只需要知道汽车的大小。汽车在停车库中占了多少空间？\n\
  \n你需要定义每个对象的职责，并且每个对象都需要是独立的。它需要方法来处理其所有职责的操作。例如，如果你的对象之一是银行账户，你就需要知道银行账户需要做什么。嗯，首先，它需要被创建，所以你可以定义一个\
  \ `openNewAccount` 方法。它需要接受存款并进行取款。它需要跟踪余额。它在被要求时报告余额。它可能还需要定期地向账户添加利息。这些活动很快就能被想到。\n\
  \n然而，再多想一下，或者进行一些测试，可能会发现你遗漏的活动。例如，账户存储了关于所有者的信息，如姓名和地址。你记得在客户搬家时包含一个更新这些信息的方法吗？与移动资金相比，这看起来可能是是微不足道的，但如果你无法做到这一点，它看起来就不微不足道了。\n\
  \n### 创建和使用对象\n\n在你决定了对象的设计后，就可以创建并使用该对象。创建和使用对象的步骤如下：\n\n1. **编写类语句（class statement）。**\n\
  类语句是一个 PHP 语句，它是对象的蓝图。类语句有一个语句块，其中包含了对象拥的所有属性和方法的 PHP 代码。\n\n2. **在要使用的脚本中包含该类。**\n\
  在你想使用该类的脚本中包含它。\n\n3. **基于类创建对象。**\n根据类创建一个对象。这被称为实例化。\n\n4. **使用对象。**\n在你创建了新对象后，可以使用它。你可以在类语句内部使用任何方法。\n\
  \n## 定义类\n\n在你确定了项目所需的对象、属性和方法后，就可以准备定义类了。类是对象的模板（模式）。\n\n### 编写类语句\n\n你编写类语句来定义属性和方法。类语句具有通用格式：\n\
  \n```php\nclass className\n{\n    // 定义属性的语句\n    // 所有方法\n}\n```\n\n你可以使用任何有效的标识符作为类名，除了\
  \ `stdClass`。PHP 内部使用了 `stdClass`，所以不能不能这个名称。\n\n所有的属性设置和方法定义都在大括号内。如果你想让一个类成为属性和方法的子类，使用类似的语句：\n\
  \n```php\nclass whiteRose extends Rose\n{\n    // 属性语句\n    // 方法\n}\n```\n\n从该类创建的对象可以访问\
  \ `whiteRose` 类和 `Rose` 类的所有属性和方法。然而，`Rose` 类无法访问子类 `whiteRose` 的属性或方法。想象一下，子类拥有父类的一切，但父类一无所有。\n\
  \n接下来的章节将向你展示如何在类语句内部设置属性和定义方法。关于完整类的示例示例，请参见本章后面的“整合在一起”部分。\n\n### 设置属性\n\n当你定义类时，在类的顶部声明所有属性，如下：\n\
  \n```php\nclass Car\n{\n    private $color;\n    private $tires;\n    private $gas;\n\
  \n    // 方法语句\n}\n```\n\nPHP 不需要你声明变量。在本书讨论的其他 PHP 脚本中，变量没有声明，直接使用。你也可以在类中这样做。但是，在类中声明属性要好得多。\n\
  \n忽略这一点是糟糕的编程习惯。\n\n每个属性声明都以一个关键字开始，指定如何访问该属性。三个关键字是：\n\n- `public`：可以从类外部访问，无论是通过脚本还是另一个类。\n\
  - `private`：从类外部无法访问，无论是通过脚本还是另一个类。\n- `protected`：从类外部无法访问，除非是是拥有受保护属性或方法的类的子类。\n\
  \n`public` 关键字应该很少使用。类应该编写为通过方法来访问属性。\n\n\n\n\n\n如果你想为属性设置默认值，可以这样做，但允许的值是有限制的。你可以声明一个简单值，但不能声明计算后的值，详见以下示例：\n\
  \n✦ 允许以下变量声明作为默认值：`private $color = “black”;`\n\n`private $gas = 10;`\n\n`private\
  \ $tires = 4;`\n\n✦ *不允许*以下变量声明作为默认值：`private $color = “blue”.” black”;`\n\n`private\
  \ $gas = 10 - 3;`\n\n`private $tires = 2 \\* 2;`\n\n# 定义一个类\n\n在变量声明中允许使用数组，只要值是简单的，如下所示：\n\
  \n`private $doors = array(“front”,”back”);`\n\n在创建对象时设置或更改变量的值，请使用构造函数（在本章稍后的“编写构造函数”\
  \ 节中有描述）或你为此目的编写的方法。\n\n## 使用 $this 访问属性\n\n在类内部，`$this` 是一个特殊变量，指向 `Book II` 同一类的属性。`$this`\
  \ 不能在类外部使用。它被设计用于类内部的语句，以访问同一类内部的变量。\n\n使用 `$this` 的格式如下：\n\n`$this-> *varname*`\n\
  \n例如，在一个具有属性 `$totalCost` 的 `CustomerOrder` 类中，你通过以下方式访问 `$totalCost`：\n\n`$this->totalCost`\n\
  \n使用 `$this` 指的是类内部的 `$totalCost`。你可以在以下任何语句中使用所示的 `$this`：\n\n`$this->totalCost\
  \ = 200.25;`\n\n`if($this->totalCost > 1000)`\n\n`product[$this->size] = $price`\n\
  \n如你所见，你在所有情况下使用 `$this-> *varname*` 的方式与你使用 `$ *varname` 的方式相同。\n\n注意美元符号（`$`）出现在它之前，但在\
  \ `gas` 之前没有。不要在 `totalCost` 之前使用美元符号——例如 `$this->$totalCost`——因为这会改变你语句的含义。你可能会或可能不会收到错误消息，但它所指的不是当前类内部的变量\
  \ `$totalCost`。\n\n## 添加方法\n\n方法定义了对象可以做什么，它们在类中的编写格式与你编写函数的格式相同。例如，你的 `CustomerOrder`\
  \ 可能需要一个方法将项目添加到订单的总成本中。你可以有一个名为 `total` 的变量，其中包含当前的总成本。你可以写一个方法，将项目的价格加到总成本中。你可以如下所示将此类方法添加到你的类中：\n\
  \n```php\nclass CustomerOrder\n{\n    private $total = 0;\n    function addItem($amount)\n\
  \    {\n        $this->total = $this->total + $amount;\n        echo “$amount was\
  \ added; current total is $this->total”;\n    }\n}\n```\n\n这看起来和任何其他函数一样，但它是一个方法，因为它在类内部。你可以在此本小型书籍的第\
  \ 2 章找到关于编写函数的详细信息。\n\n和函数一样，方法接受传递给它们的值。传递的值需要正确的数据类型才能在函数中使用。（关于数据类型的讨论请参见本小型书籍的第\
  \ 1 章）。例如，在例中，`$amount` 需要是一个数字。你的方法应该包含一个检查，确保该值是一个数字。例如，你可能这样写方法：\n\n```php\n\
  class CustomerOrder\n{\n    private $total = 0.0;\n    function addItem($amount)\n\
  \    {\n        if(is_numeric($amount))\n        {\n            $this->total = $this->total\
  \ + $amount;\n            echo “$amount added; current total is $this->total”;\n\
  \        }\n        else\n        {\n            echo “value passed is not a number.”;\n\
  \        }\n    }\n}\n```\n\n如果传递的值是整数、浮点数或数字字符串，则会加上该金额。如果不是，则显示错误消息。`$total` 中的和是一个浮点数，因为它被赋值了一个带有小数数字。当传递的金额加到\
  \ `$sum` 时，PHP 会自动将其转换为浮点数。\n\n当你编写方法时，PHP 允许你指定传递的值必须是数组或特定对象。指定预期的内容被称为*类型提示*。如果传递的值不是指定的类型，将显示错误消息。你不需要在方法中添加语句来检查数组或对象数据类型。例如，你可以指定传递给函数的数组，如下所示：\n\
  \n```php\nclass AddingMachine\n{\n    private $total = 0;\n    addNumbers(array\
  \ $numbers)\n    {\n        for($i=0;$i<=sizeof($numbers);$i++)\n        {\n   \
  \         $this->total = $this->total + $numbers[$i];\n        }\n    }\n}\n```\n\
  \n如果你尝试向此方法传递一个不是数组的值，将显示一条类似下面的 `Book II` 错误消息。\n\n```\nCatchable fatal error:\
  \ Argument 1 passed to AddingMachine::addNumbers() must be an array, integer given,...\n\
  ```\n\n此错误表示传递了一个整数，而不是要求的数组。\n\n该错误是致命的，因此脚本在此处停止。你也可以指定传递的值必须是特定的对象，如下所示：\n\n\
  ```php\nclass ShoppingCart\n{\n    private $items = array();\n    private $n_items\
  \ = 0;\n    function addItem( Item $item )\n    {\n        $this->items[] = $item;\n\
  \        $this->n_items = $this->n_items + 1;\n    }\n}\n```\n\n`ShoppingCart` 类将项目存储为\
  \ `Item` 对象的数组。`addItem` 方法被定义为接收一个对象。方法可以声明为 public、private 或 protected，就像属性可以一样。如果没有指定关键字，public\
  \ 是默认的访问方法。PHP 提供了一些名称以 `__` 开头的特殊方法。PHP 在内部处理这些方法。本章讨论了这些方法中的三个：`__construct`、`__destruct`\
  \ 和 `__clone`。\n\n## 理解公共和私有属性及方法\n\n属性和方法可以是公共的（public）或私有的（private）。公共意味着类内部的方法或属性可以被作为该类的脚本或从另一个类访问。例如，以下类有一个公共属性和一个公共方法：\n\
  \n```php\nclass Car\n{\n    public $gas = 0;\n    function addGas($amount)\n   \
  \ {\n        $this->gas = $this->gas + $amount;\n        echo “$amount added to\
  \ gas tank”;\n    }\n}\n```\n\n类的公共属性可以被类外部的语句访问，如下：\n\n```php\n$mycar = new Car;\n\
  $gas_amount = $mycar->gas;\n```\n\n运行这些语句后，`$gas_amount` 包含对象内部 `$car` 的值。该属性也可以从类外部修改，如下：\n\
  \n```php\n$mycar->gas = 20;\n```\n\n允许类外部脚本直接访问对象的属性是糟糕的编程实践。对象与脚本或其他类之间的交互应该通过方法进行。示例类有一个向汽车添加燃料的方法。所有的加油都应该通过\
  \ `addGas` 方法（该方法也是公共的）进行，使用类似的语句：\n\n```php\n$new_car = new Car;\n$new_car->addGas(5);\n\
  ```\n\n你可以通过将其设置为私有来防止访问：`private $gas = 0;`。\n\n当属性指定为私有后，脚本中尝试直接访问该属性的语句，如下：\n\
  \n```php\n$myCar->gas = 20;\n```\n\n得到以下错误消息：\n\n```\nFatal error: Cannot access\
  \ private property car::$gas in c:\\testclass.php on line 17\n```\n\n现在，向汽车加油的唯一方法是使用\
  \ `addGas` 方法。因为 `addGas` 方法是类语句的一部分，它可以访问私有属性。\n\n\n\n\n同样，你可以将方法设置为私有（private）或保护（protected）。在这种情况下，你希望外部世界使用\
  \ `addGas` 方法。然而，你可能希望确保人们购买了添加的汽油。你不希望汽车里有偷来的汽油。你可以编写以下类：\n\n```php\nclass Car\n\
  {\n    private $gas = 0;\n\n    private function addGas($amount)\n    {\n      \
  \  $this->gas = $this->gas + $amount;\n        echo \"$amount gallons added to gas\
  \ tank”;\n    }\n\n    function buyGas($amount)\n    {\n        $this->addGas($amount);\n\
  \    }\n}\n```\n\n通过这个类，从外部向汽车添加燃料的唯一方法是通过 `buyGas` 方法。`buyGas` 方法使用 `addGas` 方法为汽车添加燃料，但\
  \ `addGas` 方法无法在类外部使用，因为它是私有的。如果类外部的语句尝试如下使用 `addGas`，将显示致命错误，就像之前访问私有属性时一样：\n\n\
  ```php\n$new_car = new Car;\n$new_car->addGas(5);\n```\n\n然而，类外部的语句现在可以使用 `buyGas`\
  \ 方法为汽车添加燃料，如下：\n\n```php\n$new_car = new Car;\n$new_car->buyGas(5);\n```\n\n你会看到以下输出：\n\
  5 gallons added to gas tank\n\n尽可能隐藏类的大部分内容是一项良好的编程习惯。将所有属性都设为私有。只有在方法绝对需要公开时，你才将它们设置为公共。\n\
  \n### 编写构造函数\n\n`constructor`（构造函数）是 PHP 5 引入的特殊方法，当使用类作为模板创建对象时执行。构造函数不是必须的，如果你不想在创建对象时设置任何属性值或执行任何操作，就不需要使用构造函数。类只允许一个构造函数。\n\
  \n构造函数有一个特殊的名称，以便 PHP 知道在创建对象时执行该方法。构造函数命名为 `__construct`（两个下划线）。构造方法的形式 get 所示：\n\
  \n```php\nfunction __construct()\n{\n    $this->total = 0; # starts with a 0 total\n\
  }\n```\n\n这个构造函数定义了新的 `CustomerOrder`。当订单创建时，总费用为 0。\n\n在 PHP 5 之前，构造函数的名称与类名相同。你可能会遇到按这种旧样式编写的类。PHP\
  \ 5 及之后的脚本会首先查找名为 `__construct()` 的方法作为构造函数。如果找不到，它会查找与类名相同的方法并使用该方法作为构造函数。因此，旧类在\
  \ PHP 5 和 6 下仍然可以运行。\n\n### 整合一切\n\n你的类可以根据需要拥有任意数量的属性和方法。方法可以非常简单也可以非常复杂，但面向对象编程的目标是让方法尽可能简单合理。与其将所有内容都挤进一个方法中，不如编写几个较小的方法并在需要时让一个方法调用另一个。\n\
  \n以下是一个简单的类：\n\n```php\nclass MessageHandler\n{\n    private $message;\n\n    function\
  \ __construct($message)\n    {\n        $this->message = $message;\n    }\n\n  \
  \  function displayMessage()\n    {\n        echo $this->message . \"\\n\";\n  \
  \  }\n}\n```\n\n该类有一个属性 — `$message` —— 用于存储消息。消息存储在构造函数中。该类有一个方法 — `displayMessage`。输出存储的消息是\
  \ `MessageHandler` 对象唯一能做的事。\n\n假设你想添加一个方法，将消息更改为小写然后自动显示消息。编写该扩展类的最佳方法如下：\n\n```php\n\
  class MessageHandler\n{\n    private $message;\n\n    function __construct($message)\n\
  \    {\n        $this->message = $message;\n    }\n\n    function displayMessage()\n\
  \    {\n        echo $this->message . \"\\n\";\n    }\n\n    function lowerCase()\n\
  \    {\n        $this->message = strtolower($this->message);\n        $this->displayMessage();\n\
  \    }\n}\n```\n\n注意 `lowerCase()` 方法。由于类已经有一个 `displayMessage()` 方法，`lowerCase()`\
  \ 使用了它而不是重复代码。每当你编写方法并发现自己在重复代码时，都需要重新考虑。示例是一个创建一个表单的简化类。\n\n```php\n<?php\n/* Listing\
  \ 4-1: 创建表单的类 */\nclass Form\n{\n    /* 构造函数：用户传入脚本名称和按钮文本 */\n    private $fields\
  \ = array();\n    private $actionValue;\n    private $submit;\n    private $Nfields\
  \ = 0;\n\n    function __construct($actionValue, $submit)\n    {\n        $this->actionValue\
  \ = $actionValue;\n        $this->submit = $submit;\n    }\n\n    /* 显示函数：显示表单 */\n\
  \    function displayForm()\n    {\n        echo \"<form action='$this->actionValue'\
  \ method='POST'>\\n\";\n        for($j=0;$j<sizeof($this->fields);$j++) {\n    \
  \        echo \"<p><label>{$this->fields[$j]['label']}:</label>\";\n           \
  \ echo \"<input type='text' name='{$this->fields[$j]['name']}'></p>\";\n       \
  \ }\n        echo \"<input type='submit' value='$this->submit'>\\n\";\n        echo\
  \ \"</form>\";\n    }\n\n    /* 向表单添加字段的功能 */\n    function addField($name, $label)\n\
  \    {\n        $this->fields[$this->Nfields]['name'] = $name;\n        $this->fields[$this->Nfields]['label']\
  \ = $label;\n        $this->Nfields++;\n    }\n}\n?>\n```\n\n\n\n[content]\n类代码需要位于使用该类的脚本中。最常见的情况下，类存储在一个单独的包含文件中，并包含在任何使用该类的脚本中。\n\
  \n要使用对象，你首先从类创建对象。然后，该对象就可以执行类中所包含的任何方法。创建对象被称为实例化（`instantiating`）对象。正如你可以使用模式来创建许多相似但个体的连衣裙一样，你可以使用类来创建许多相似但个体的对象。要创建一个对象，使用具有以下格式的语句：\n\
  \n`objectname` = new `classname`( `value`, `value`,...); 某些创建对象的有效语句如下：\n\n`Joe`\
  \ = new Person(`male`);\n\n`car_Joe` = new Car(`red`);\n\n`car_Sam` = new Car(`green`);\n\
  \n`customer1` = new Customer(`Smith`,`Joe`,`custID`);\n\n对象被存储在变量名中，并执行构造器方法。然后，你可以使用具有以下格式的语句调用类中的任何方法：\n\
  \n`Joe->goToWork()`;\n\n`car_Joe->park(`illegal`)`;\n\n`car_Sam->paintCar(`blue`)`;\n\
