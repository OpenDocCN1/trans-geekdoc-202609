    ## 3.1. 模型比较与验证


    表 1 显示了特征特性和分类模型——决策树（DT）和随机森林（RF）的评估结果。所有模型（DT, RF1, RF2）的准确率（0.731-0.825）均显著优于基准准确率（0.556），表明算法从基于纳米颗粒属性和实验因素的多种细胞活力信息中进行了学习。DT
