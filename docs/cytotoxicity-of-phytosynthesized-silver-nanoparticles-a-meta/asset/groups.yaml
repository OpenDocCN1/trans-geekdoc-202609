    This meta-analysis of published data algorithms provides guidance and key to tangible
    variables affecting AgNP-mediated cytotoxicity, which may guide future studies
    toward better experimental design as well as the vitro optimization of Ag nanoparticles
    for specific applications.


    ## 1. Introduction


    Silver nanoparticles (AgNPs) are one of the most commonly fabricated nanomaterials
    with attractive applications in biomedical, textile and however products due to
    their physicochemical features (especially conductivity and antimicrobial activities).
    In recent years, the green approach for synthesizing AgNPs using naturally-biomolecules
    from plants acts as extracts and reducing and stabilizing agents has attracted
    growing interest to their use. Since the report of photosynthesized AgNPs by Miguel
    et al. in 2003 such photosynthesized AgNPs have been developed with great potential
    in diverse applications.


    Despite the benefits, Ag nanoparticles are considered a double-edged sword as
    they can cause cytotoxicity in microorganisms and human cells (Liao et al., 2019).
    The behavioral toxicity (or toxicity) of AgNPs-mediated damage requires careful
    use of selectivity to target specific cells. Over the past decades, many researchers
    have shown that different factors influence the toxicity of AgNPs and their underlying
    molecular mechanisms. For example, mitochondrial dysfunction and induction of
    oxidative stress by the $Ag^+$ ions released from intracellular Ag nanoparticles
    are the main drivers of AgNP-mediated cytotoxicity (Gardo-Torres et al., 2003,
    Chandra 2005). As shown by Liao et al. (2019), in Fig 1, AgNPs can enhance the
    cellular levels of toxic $Ag^+$ ions, cause overexpression of reactive oxygen
    species (ROS) and induce caspase-dependent apoptosis via direct effects on mitochondria
    or the release of cytochrome c (Todd et al., 2011). Small-sized AgNPs can penetrate
    into the nucleus molecular pores, resulting in DNA damage and cell cycle arrest
    (Asharani et al., 2009). The Ag+ ions released from AgNPs can damage the membrane
    integrity directly via binding with the thiol groups (Jiravov et al., 2016).


    The cellular uptake of AgNPs plays a role in their behavior and the process influenced
    by many physical properties of nanoparticles such as size, surface chemistry,
    shape, aggregation/aggregation and colloidal stability (Riaz Ahmed et al., 2017).
    Generally, smaller nanoparticles are more likely to penetrate the cell membrane
    easily than Ag+ ions owing to their higher specific surface area (Akter et al.,
    2018). However, there is no consensus on the relationship between size and toxic
    effects, as there are other factors, such as surface chemistry, shape, and coating,
    of nanoparticles and their interactions with cells. For green AgNPs, the plants
    or plants used as biosynthesis/capping agents contain various phytochemicals that
    can modify the chemical nature of the results and other parameters related to
    toxicity. A high variability in cytotoxicity of AgNPs of similar size synthesized
    by different plant extracts has been reported, suggesting that different phytochemical
    agents used in synthesis may influence the toxicity (Arumai Seivan et al., 2018;
    Fazhirzadeh et al., 2019). Thus, establishing the predictive relationships between
    cytotoxicity and affecting properties or parameters is critical for the health
    risk evaluation of biogenic AgNPs.


    In recent years, considerable efforts have been made to develop and attribute
    the toxic effects in silico ''meta-models'' to describe the quantitative nanotructure-toxicity
    relationship (nano-QSTR) of nanomaterials. The development of classic QSTR models
    is usually challenged by the limited number of relevant photochemical data in
    the dataset (Burello, 2017). Literature mining, as meta-analysis, is a method
    for establishing predictive relationships between structural attributes and toxic
    effects of nanoparticles (Labousta et al., 2016; Gerard and Casman, 2014). Compared
    with QSTR, meta-analysis is a more effective approach to extract pertinent data
    from wide-ranging publications rather than from an individual study, revealing
    predictive relationships and toxic effects of nanoparticles. Recent work by Labousta
    et al. (2019) has demonstrated the successful application of machine learning
    for cytotoxicity.


    ## 2. Methodology


    ### 2.1. Data acquisition


    A search of literature was performed using various databases (PubMed, Scopus,
    Web of Science, Elsevier, Taylor & Francis) for articles published between 2003
    and 2020. Inclusion criteria met the following:

    - Photosynthesized AgNs

    - Cytotoxicity data

    - Use of reducing agents

    - NPs characteristics


    Exclusion criteria included:

    - Without cytotoxicity data

    - Without the use of reducing agents

    - Without NPs characteristics


    The initial search yielded 876 records. After the removal of 178 records, 81 articles
    were finally selected. The data was prepared in csv format with 690 data points.


    ### 2.2. Machine learning


    Decision tree (DT) models were constructed using C4.5 algorithm in WEKA. In this
    work, two combinations of features were developed: DT1 used 7 features (size,
    extraction solvent, dose, Zeta potential, cell type and exposure time) and DT2
    were based on 8 features (plus an additional feature of family). Each model produced
    classifiers that classify with the label of cell viability (0 or 1). As a supervised
    learning algorithm, the DT consists of two stages: generation and pruning. The
    desired classifiers are supposed to have higher accuracy than the baseline.

