    1 (DT1)。


    纳米颗粒 (Lin 等人，2020)。这些研究强调了根据尺寸和其他影响毒性的因素对银纳米颗粒进行受控合成的必要性。


    # 4. 结论


    这项荟萃分析表明，尽管具有内在属性，银纳米颗粒的细胞毒性也与暴露剂量和时间密切相关。


