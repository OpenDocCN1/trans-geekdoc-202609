    Graphviz (https://graphviz.org/) 对决策树（DT）进行了可视化处理。


    ## 2.2. 随机森林


    使用 10 折交叉验证从同一数据集中构建了随机森林（RF）模型（Chen 等人，2020）。作为一种基于决策树的集成学习方法，RF 可以处理多个分类和回归任务。RF
    的每棵 DT 或树都是通过以下方法生成的：(i) 对原始数据进行多次采样；(ii) 在每一步中使用自自助采样法（bootstrap），并通过第一个最佳分割算法选择树的每个节点；(iii)
    每棵树都通过聚合一组随机特征生成；(iv) 并根据最佳分类性能保留左子树。与分类器模型相比，RF 通常比其他分类器更准确。


    RF 模型提供了两个变量重要性指标，即平均准确率下降和平均基尼指数（Gin），用于变量排序。平均准确率下降（MDI）通过计算移除该变量时模型准确率的变化来衡量变量重要性，而平均基尼指数（MDI）也具有类似作用。


    ## 2.3. 模型性能评估


    使用 10 折交叉验证来评估 DT 和 RF 模型的准确性。数据被划分为 k 个独立的子集 D1/D2/D3/.../DK (k=10)，在每一步中，使用
    (k-1) 个子集进行训练，剩余子集用于验证，最终确定 k 个测试结果的平均值。使用精确率（PR）、召回率（RE）、准确率（AC）和 F 值对每个模型的性能进行评估，其中
    TP、FN、TN 和 FP 分别代表真阳性、假阴性、真阴性和假阳性的取值（Deshmukh 等人，2016）。


    PR = TP / (TP + FP) 式.(1)


    RE = TN / (TN + FN) 式.(2)


    F值 = 2 * TP * TN / (TP + FP + FN) 式.(3)


    这些指标的值表明了模型的预测能力，值越高表示模型越好，值为 1 表示性能优秀（Chen 等人，2018）。在生物学数据的情况下，分类模型显示 >70% 的分类是准确的。此外，还使用受者工作特征曲线（ROC）分析来评估预测能力的性能。ROC
    曲线通过绘制所有 FP 和 TP 率的组合绘制得出，通过计算曲线下积（AUC）获得。AUC > 0.9 为“优秀”，“0.9 ≥ AUC ≥ 0.8) 为“良好”，“(0.8
    > AUC ≥ 0.7) 为“中等”(0.8 > 0.7)。


