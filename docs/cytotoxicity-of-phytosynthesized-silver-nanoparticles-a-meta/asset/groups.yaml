    ## 光合合成银纳米颗粒的细胞毒性：基于机器学习算法的元分析


    Liu Lei $^{a,b}$, 张 Zhaolan $^{a,b,c}$, Chao Liha $^{a}$, Xiang Ziyi $^{a,b}$,
    Tang Ying $^{a,b,c,*}$, Pan Yao $^{a,b,c}$


    - $a$ 中国北京商务大学化学与材料工程学院化妆品系，100008

    - $b$ 中国北京科技商务大学化学与材料工程学院植物研究与开发重点实验室，100008

    - $c$ 中国北京科技商务大学化学与材料工程学院国家轻工行业化妆品重点实验室，100008


    ### 摘要


    关键词：

    银纳米颗粒

    - 细胞毒性

    - 元分析

    - 机器学习

    - 随机森林

    - 决策树


    由于植物、纺织和医疗保健应用对“绿色”方法合成的银纳米颗粒（AgNPs）需求迅速且使用日益增加，引发了对其人类健康潜在影响的关注。本研究利用两种基于分类的机器学习方法——决策树（DT）和随机森林（RF），对具有异质特征的光合合成
    AgNPs 的细胞毒性进行了元分析。植物生物合成相关特征的加入显著提高了模型的准确性和泛化性能，并揭示了光合合成 AgNPs 细胞毒性影响的关键参数。模型识别出的
    Gini 均值差异衡量表明，暴露（包括时间和剂量）、植物类型和细胞类型是 AgNP 介导细胞毒性变量（包括内在毒性性质和生物合成中使用的反应）的最重要预测因子，并对数据进行了关注以模型性能。这种对发表数据的算法元分析为影响
    AgNP 介导细胞毒性的具体变量提供了指导和关键，可能指导未来研究实现更好的实验设计，以及针对特定应用的银纳米颗粒体外优化。


    ## 1. 引言


    银纳米颗粒（AgNPs）由于其物理化学特性（特别是导电性和抗菌活性），是生物医学、纺织和家居产品中具有吸引应用前景的最常见纳米材料之一。近年来，利用植物天然生物分子作为提取物、还原剂和稳定剂来合成
    AgNPs 的绿色方法引起了日益增长的关注。自 Miguel 等人于 2003 年报道光合合成 AgNPs 以来，此类光合合成 AgNPs 在不同应用中展现出巨大的潜力。


    尽管具有益处，但银纳米颗粒被认为是双刃剑，因为它们会引起微生物和人类细胞的细胞毒性（Liao et al., 2019）。AgNP 介导损伤的行为毒性（或毒性）需要仔细利用选择性来针对特定细胞。在过去的几十年里，许多研究人员表明不同因素影响
    AgNPs 的毒性及其潜在分子机制。例如，细胞内银纳米颗粒释放的 $Ag^+$ 离子引起的线粒体功能障碍和氧化应激是 AgNP 介导细胞毒性的主要驱动因素（Gardo-Torres
    et al., 2003, Chandra 2005）。如 Liao 等人（2019）如图1所示，AgNPs 可以增强细胞内毒性 $Ag^+$离子的水平，导致活性氧（ROS）过表达，并通过对线粒体的直接作用或释放色素
    c 诱导 caspase 依赖性凋亡（Todd et al., 2011）。小尺寸 AgNPs 可以穿入细胞核分子孔，导致 DNA 损伤和细胞周期阻滞（Asharani
    et al., 2009）。从 AgNPs 释放的 Ag+ 离子可以通过与硫醇基结合直接破坏膜完整性（Jiravov et al., 2016）。


    AgNPs 的细胞摄取在其行为中起着作用，该过程受到许多纳米颗粒物理性质的影响，如尺寸、表面化学、形状、聚集/团聚和胶体稳定性（Riaz Ahmed et
    al., 2017）。通常，由于比表面积较大，较小的纳米颗粒比 Ag+ 离子更容易穿透细胞膜（Akter et al., 2018）。然而，尺寸与毒性效应之间的关系尚未共共，因为还有其他因素，如纳米颗粒的表面化学、形状、涂层及其与细胞的相互作用。对于绿色
    AgNPs，用作生物合成/封端剂的植物含有各种植物化学物质，这些物质可以改变结果的化学性质以及与其他毒性相关的参数。据报道，不同植物提取物合成的相似尺寸 AgNPs
    的细胞毒性具有高度变异性，这表明合成中使用的不同植物化学剂可能会影响毒性（Arumai Seivan et al., 2018; Fazhirzadeh et
    al., 2019）。因此，建立细胞毒性与影响属性或参数之间的预测关系，对于生物源 AgNPs 的健康风险评估至关重要。


    近年来，研究人员付出了大量努力开发并归因计算机模拟毒性“元模型”，以描述纳米材料的定量纳米结构-毒性关系（nano-QSTR）。经典 QSTR 模型的开发通常面临数据相关光化学数据有限的挑战（Burello,
    2017）。文献挖掘作为一种元分析，是建立纳米颗粒结构属性与毒性效应之间预测关系的方法（Labousta et al., 2016; Gerard and
    Casman, 2014）。与 QSTR 相比，元分析是一种更有效的方法，可以从广泛的出版物而非单个研究中提取相关数据，揭示纳米颗粒的预测关系和毒性效应。Labousta
    等人（2019）最近的工作证明了机器学习在细胞毒性方面的成功应用。


    ## 2. 方法


    ### 2.1. 数据获取


    通过数据库（PubMed, Scopus, Web of Science, Elsevier, Taylor & Francis）对 2003 年至 2020
    年发表的文献进行了检索。纳入标准符合：

    - 光合合成 Ag

    - 细胞毒性数据

    - 使用还原剂

    - NPs 特性


    排除标准包括：

    - 无细胞毒性数据

    - 无还原剂

    - 无 NPs 特性


    初始检索获得 876 条记录。排除 178 条记录后，最终选择了 81 篇文章。数据以 csv 格式准备，包含 690 个数据点。


    ### 2.2. 机器学习


    使用 WEKA 中的 C4.5 算法构建决策树（DT）模型。在这项工作中，开发了两种特征组合：DT1 使用 7 个特征（尺寸、提取溶剂、剂量、Zeta 电位、细胞类型和暴露时间），DT2
    基于 8 个特征（增加了一个家族特征）。每个模型产生的分类器用于对细胞活力（0 或 1）进行分类。作为监督学习算法，决策树包括两个阶段：生成和剪枝。预期的分类器准确率应高于基准。


