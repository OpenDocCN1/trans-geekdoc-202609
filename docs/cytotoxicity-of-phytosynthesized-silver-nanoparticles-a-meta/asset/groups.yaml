    细胞毒性的各种因素。


    ## 3.3. 细胞类型的影响


    细胞毒性是纳米颗粒在环境条件下给定细胞系中的内在属性。暴露程度、暴露时间被确定为细胞活力结果的主要因素，如属性重要性排名（图 4）和 DT 图（图 3）所示。需要注意的是，许多以前的研究使用了
