    # 3.2.3. Effects of parameters used in biogenesis


    Particle size, shape, cluster/aggregation factors and own stability are inherited
    properties of nanoparticles. Particle size has been identified as a factor controlling
    the toxicity of biogenic AgNPs. The effects include cell uptake, ROS production
    and damage to DNA, mitochondria and cell membrane (Vasek et al., 2014; Albanese
    et al., 2012). However, there are no standard techniques for size measurements
    of AgNPs in biological media. The hydrodynamic size measured by light scattering
    (DLS) may be affected by aggregation of nanoparticles and interaction with the
    test media, particularly.


    As well as size, charge is a closely related to the colloidal stability and fate
    of nanoparticles in cells. However, the measurement of Zeta potential used for
    the characterization of surface charge is not equivalent to the surface charge
    density. Density, as well


