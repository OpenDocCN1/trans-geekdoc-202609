  md: 'molecular pores, resulting in DNA damage and cell cycle arrest (Asharani et
    al., 2009). The Ag+ ions released from AgNPs can damage the membrane integrity
    directly via binding with the thiol groups (Jiravov et al., 2016).


    The cellular uptake of AgNPs plays a role in their behavior and the process influenced
    by many physical properties of nanoparticles such as size, surface chemistry,
    shape, aggregation/aggregation and colloidal stability (Riaz Ahmed et al., 2017).
    Generally, smaller nanoparticles are more likely to penetrate the cell membrane
    easily than Ag+ ions owing to their higher specific surface area (Akter et al.,
    2018). However, there is no consensus on the relationship between size and toxic
    effects, as there are other factors, such as surface chemistry, shape, and coating,
    of nanoparticles and their interactions with cells. For green AgNPs, the plants
    or plants used as biosynthesis/capping agents contain various phytochemicals that
    can modify the chemical nature of the results and other parameters related to
    toxicity. A high variability in cytotoxicity of AgNPs of similar size synthesized
    by different plant extracts has been reported, suggesting that different phytochemical
    agents used in synthesis may influence the toxicity (Arumai Seivan et al., 2018;
    Fazhirzadeh et al., 2019). Thus, establishing the predictive relationships between
    cytotoxicity and affecting properties or parameters is critical for the health
    risk evaluation of biogenic AgNPs.


    In recent years, considerable efforts have been made to develop and attribute
    the toxic effects in silico ''meta-models'' to describe the quantitative nanotructure-toxicity
    relationship (nano-QSTR) of


    nanomaterials. The development of classic QSTR models is usually challenged by
    the limited number of relevant photochemical data in the dataset (Burello, 2017).
    Literature mining, as meta-analysis, is a method for establishing predictive relationships
    between structural attributes and toxic effects of nanoparticles (Labousta et
    al., 2016; Gerard and Casman, 2014). Compared with QSTR, meta-analysis is a more
    effective approach to extract pertinent data from wide-ranging publications rather
    than from an individual study, revealing predictive relationships and toxic effects
    of nanoparticles that are not evident in the literature (Labousta et al., 2019;
    Oh et al., 2016; Gerard and Casman, 2014). Recent work by Labousta has demonstrated
    the successful application of machine learning for the assembly and generalization
    of heterogeneous cytotoxicity to provide simple, accurate and predictive classifiers
    for a spectrum of nanoparticles (Labousta et al., 2019). However, the intrinsic
    physical properties of nanoparticles are often insufficient to represent the complex
    interactions between AgNPs, biosynthesis agents and cytotoxicity.


    Here, we report a more rigorous and comprehensive meta-analysis of cytotoxicity
    of green AgNPs. We hypothesize that the cell viability outcomes can be determined
    by a set of features including physical properties of nanoparticles (size, Zeta
    potential), cell types (human/animal/normal), exposure regime (dose and time),
    and the biosynthesis-related variables (plant factors, extraction method). Two
    machine learning algorithms, decision tree and random forest, were used to identify
    key. The results are expected to identify


