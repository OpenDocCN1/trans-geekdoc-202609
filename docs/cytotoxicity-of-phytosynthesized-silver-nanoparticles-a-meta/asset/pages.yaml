    # # Cytotoxicity of photosynthesized silver nanoparticles: A meta-analysis by
    machine learning algorithms


    Lei Liu $^{a,b}$, Zhaolan Zhang $^{a,b,c}$, Liha Chao $^{a}$, Ziyi Xiang $^{a,b}$,
    Ying Tang $^{a,b,c,*}$, Yao Pan $^{a,b,c}$


    +   $a$ Department of Cosmetics, College of Chemistry and Materials Engineering,
