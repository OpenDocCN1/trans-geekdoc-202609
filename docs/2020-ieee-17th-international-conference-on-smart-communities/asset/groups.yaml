    科学与工程学院

    休斯顿大学清水湖

    美国德克萨斯州休斯顿

    unwala@gmail.com


    **摘要—**地下设施尤其是下水道管道由于老化、土壤位移、交通增加、拥堵和安装不当而容易产生裂缝。运行中的主要挑战是对下水道网络进行有效的监测和检查。基于移动机器人闭路电视（CCTV）摄像头的视频信号标准状态监测系统在管道中运行。CCTV
    画面由人工操作员记录并解释，并确定其是否对应裂缝和其他结构缺陷的位置。这一过程既耗时又昂贵。在项研究中，我们提出深度学习来实现基于视觉的目标检测的成功。在该项目中，我们从广泛的现场检查中收集了裂缝数据。使用卷积网络对噪声数据进行处理。我们用验证数据测试所提模型，以确定其准确性和有效性。地下管道中的裂缝可以被有效检测。


    **关键词—**监测、下水道检查、CCTV、深度学习、卷积神经网络。


    # I 引言


    美国老化的下水道基础设施由于老化、安装不当、设计缺陷、内部运行、外部连接和制造工艺等各种影响，容易产生裂缝和其他结构缺陷 [1]。导致裂缝形成的因素包括土壤移动、酸性土壤、树根入侵以及与有毒废水和浸出物的化学反应。破裂的下水道管道容易渗透，并导致地下水渗入（I&I）和污水溢出（SSOs）。由于地下下水道不可见，很难防止溢出和有毒沉积物的积累。


    为了防止溢出，公用事业专注于能够以高效且具有成本效益的方法维护地下管道状况的技术。该策略的一个主要要素是对其地下资产进行定期检查，这将导致管道清洗和对缺陷管段进行反应性维护。


    历史上，釉陶管（V）被用作下水道管道是因为它们具有高抗压强度和对污水化学反应的抗性。尽管强度很高，但它们会随着时间的推移产生裂缝并由于根系入侵而失效。聚氯烯（PVC）管道现在广泛应用于下水道系统。改为
    PVC 管道的主要原因是它们寿命长、重量轻、对废水化学反应抗性且易于安装。在美国，PVC 管道已根据 ASTM D1784 [2] 成为行业标准。操作人员根据管道状况及其未来情况进行定期检查和维护。对于定期检查，下水道服务公司协会（NASCO）采用了一种基于安装在管道上的移动闭路电视（CCTV）摄像系统。机器人观察并记录视频。该系统需要一个带有发电机、光纤电缆和控制系统的
    4x4 轨道，以便正确导航和识别缺陷。现有系统是人力密集型的。其目标是减少对操作人员检测管道中裂缝和其他结构缺陷的依赖。近年来，已使用图像处理和分割算法进行研究，例如使用神经网络的多层感知器（MLP）[3]。用于流程自动化的图像处理和分析的传统计算机视觉技术也是研究的重点
    [4]。使用残差卷积网络（R-CNN）的深度学习也已被用于。


    在本文中，我们展示了利用深度学习 CNN 检测从带有 CCTV 的线缆机器人下水道管道现场检查收集的实际数据视频图像中裂缝的发现。我们测试了各种滤波器来预处理数据，并使用批激活、双卷积、归一化和最大池化等技术参数分析了
    CNN 的配置。这项工作的新颖贡献是，作者发现只有深度学习能够学习来自活体下水道视频图像中裂缝的复杂特征。


    论文的其余部分组织如下：第二部分总结了相关工作；第三部分涵盖了项目的方法和发现；第四部分介绍了数据分析和方法；第五部分总结全文并指出未来工作方向。


    # II. 相关工作


    最近的研究探讨了使用神经网络通过压力和（或）流量分析来检测水管的变化。使用神经网络分析了中国广州的实际情况 [5]。该工作促进了快速技术的发展。基于视觉的技术也被用于通过光照等传统图像处理技术在管道中进行自动检测。


    # III. 提议的方法


