    both classes were relatively represented in data.


    In our group has looked using deep learning model to detect cracks in PVC pipes
    with data collected in laboratory setting. The experiment was conducted by autonomous
    robot to validate our proposed model on two phase feature learning and a classification
    phase. The feature learning method composed of two-dimensional convolutional layers,
    max-pooling layer, and a flattened layer. The classification phase included two
    fully connected layers and a classifier. With this model, the data analysis showed
    an accuracy of 89.4% in training and 83.3% in validation.


