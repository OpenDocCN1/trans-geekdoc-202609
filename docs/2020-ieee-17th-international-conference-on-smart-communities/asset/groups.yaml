    **Abstract—**Underground utilities especially sewer pipes are prone to cracks
    due to aging, shifting soil, increased traffic, congestion, and improper installation.
    A major challenge in operation is the effective monitoring and inspection of sewer
    networks. The video signal standard condition monitoring system based on a passing
    robot closed circuit television (CCTV) camera carries through the pipe. The CCTV
    feed is recorded and interpreted by human operators who determine it corresponds
    to the location of cracks and other structural defects. This process is time and
    cost intensive. In this research, we propose deep learning for success in vision
    based object detection. In this project, we collect crack data from extensive
    field inspections. The noisy data is processed using the convolutional networks.
    We test the proposed model with validation data to determine its accuracy and
    effectiveness. Cracks can be effectively detected in underground pipes.


    long lifespan, weightless, resistance to chemical reaction with wastewater, and
    ease of installation. In United States, PVC pipes have been adopted as industry
    standards in accordance with ASTM D1784 [2].nThe operators conduct periodic inspection
    and maintenance based on condition of the pipe and its future. For periodic inspection,
    the Association of Sewer Service Companies (NASCO) has adopted a system based
    on passing-closed circuit television (CCTV) camera mounted on the pipe. The robot
    observes, and records the video. This system needs a 4 x 4 track with generator,
    fiber optic cable, and a control system to properly navigate and identify defects.
