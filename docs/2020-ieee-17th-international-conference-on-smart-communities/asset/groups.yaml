    # 用于地下管道裂缝的深度学习分类器


    Saffeer M. Khan

    电气工程系

    阿肯色科技大学

    美国阿肯色州罗塞尔维

    mkhan33@gmail.com


    Syed A. Haider

    计算机与信息科学系

    纽约州立大学弗雷多尼亚

    纽约

    haider@fredonia.edu


