    如前所述，图像中包含了额外的伪影、根部和接头管道。这些是特别棘手的，因为在许多情况下它们看起来像裂缝。某些图像即使通过人工观察也无法辨。


    ![](img/edd12b82b4d119595aaf9394ca5c21b4_2_2.png)


    在测试期间，测试了超过 100 张图像，模型能够以超过 99% 的准确率预测图像中的裂缝。考虑到图像的低分辨率和额外的分辨率，这一结果具有显著意义。


    ## V. 结论


    由于公共健康和环境保护措施，地下下水道的裂缝检测对于运营商来说是一项重要的现代实用事业。现有的基于专家经验和人工检测管道裂缝的预检方法效率低下且成本高昂。更好的替代方案是使用自动化系统对管道内部图像进行分类，以用于监控。由于
    CNN 深度学习模型在图像处理和分类方面具有稳健性能，开发这种扩展方法具有前景。


    图 3. 过滤后的图像：高斯模糊和 Sobel 边缘检测...


    为了消除图像中的环境噪声，我们必须找到能够暴露裂缝的解决方案。这是通过对图像应用内核大小为 3 的高斯模糊然后应用 Sobel 算子突出边缘实现的。


    将增强后的图像作为输入到神经网络。图 4 显示了 50 个 epoch 的准确率。我们观察到验证准确率在 0.96 以上。原因是由于冗余图像和数据量导致的数据不平衡。我们存在固有的数据不平衡，通过采样进行了减少。虽然这样做是有效的，但数据在很大程度上仍然不平衡。


