    **Keywords—**monitoring, sewer inspection, CCTV, deep learning, convolutional
    neural networks.


    # I. INTRODUCTION


    The aging sewer infrastructure in United States is prone to develop cracks and
    other structural defects due to various effects such as age, improper installation
    and effective design, internal operation, external connection, and manufacturing
    processes [1]. Factors that contribute to crack formation include soil movement,
    acidic soil, root tree intrusion, and chemical reactions with the toxic effluents
    and leachants. Cracked sewer pipes are prone to infiltration and can cause inflow
    (I&I) of groundwater and sanitary overflows (SSOs). As the underground sewer pipes
    are out of view, it is difficult to prevent SSOs and accumulation of toxic sediments.


    To prevent SSOs, utility companies focus on technology that can maintain the conditions
    of their underground piping in an efficient, and cost-effective manner. A major
    element of this strategy is periodic inspection of their underground assets which
    lead to pipe cleaning and reactive maintenance of defective section pipes.


    Historically, vitrified clay pipes (V) used as sewer pipes due to their high compressive
    strength and resistance to chemical reactions with sewage. Despite their high
    strength, they crack over time and fail due to root ingress. The Polyvinyl Chloride
    (PVC) pipes are now widely used in sewer systems.

    The main reasons for the change to PVC pipes is their


    There is to reduce the reliance on an operator to detect cracks and other structural
    defects in pipes. In recent years, research has been done using image processing
    and segmentation algorithms such as multilayer perceptron (MLP) using neural networks
    [3]. Conventional computer vision techniques to automate process and analyze images
    have also been focus of research [4]. Deep learning using residual convolutional
    network (R-CNN) has also been used


    In this paper, we present our findings on using deep learning CNNs to detect cracks
    in video images from actual data collected from field inspection of sewer pipes
    with a CCTV mounted wire-robot. We tested various filters to preprocess the data
    and analyze the configurations of CNN using technical parameters such as batch
    activation, double convolution, normalization, and max-pooling. The novel contribution
    of this work is that authors have found that only deep learning can learn the
    complex features of cracks in video images from live sewer pipes.


    The remainder of the paper is organized as follows. Section II summarizes the
    related work; Section III covers the approach and findings from the project. Section
    IV presents the data analysis and approach Section V concludes the paper and directions
    of future work.'
