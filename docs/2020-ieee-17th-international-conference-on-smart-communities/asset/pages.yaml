    # IV. DATA ANALYSIS AND RESULTS


    As explained, the images contained additional artifacts, roots and joint pipes.
    These are particularly problematic because they resemble cracks in many instances.
    Some of the images were not discernable even with human observation.


    ![](img/edd12b82b4d119595aaf9394ca5c21b4_2_2.png)


    During testing, more than 100 images were tested, the model was able to predict
    cracks in images with more than 99% accuracy. The results are signification considering
    low-resolution and addition resolution in the images.


    # V. CONCLUSION


    Crack detection in underground sewers is an important modern-day utility for operators
    due to public health and environmental protection measures. The existing methods
    for pre-inspection of sewers based on expertise and human effort of operators
    to detect cracks of the pipe are inefficient and costly. A better alternative
    would be to use an automated system for classifying the images inside the pipes
    for monitoring applications. Deep learning models using CNNs due to their robust
    performance in image processing and classification offer promise to develop an
    extent method.


