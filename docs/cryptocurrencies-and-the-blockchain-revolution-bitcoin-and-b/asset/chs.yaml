- '# 加密货币与区块链革命：比特币及其未来




  ![cover.jpg](img/cover.jpg)


  ![TitlePage.jpg](img/TitlePage.jpg)


  ## 简介


  2009 年 1 月，一位名为中本聪的神秘软件开发者与另一位开发者交换了一个特别设计的文件。这三万行代码是一种数字货币，中本聪曾在几个月前发表的论文《比特币：一种点对点的电子现金系统》中提出过。


  这是首笔比特币交易，但当时鲜有人注意。2009 年大半时间里，没人愿意将单枚比特币的估值定在几美分以上。2010 年，一位程序员完成了首笔已知的商业比特币交易：用
  10,000 枚比特币换取两个披萨。七年后，购买那两个披萨所用的比特币价值超过 1 亿美元。交易发生的那一天——5 月 22 日——被加密货币爱好者庆祝为一个节日：比特币披萨日。


  比特币从一个默默无闻的程序发展到全球金融的巅峰，这是一个非凡且充满争议的故事。比特币是最著名的加密货币。简单来说，加密货币是一种依赖互联网和计算机来验证其价值和所有权的数字资产。它被设计为像货币一样使用。支持者认为，加密货币代表了一种存储价值和开展业务的新方式，这种方式利用了技术的便捷性和覆盖面。在这个愿景中，加密货币将取代纸币和硬币。昂贵、缓慢的中介将从交易过程中移除。暴政政府和腐败机构将被边缘化。个人将在一个建立并维护信任的框架内，自由地直接相互交易。


  ![](img/GettyImages-1161142064.jpg)


  虽然比特币是一种数字货币，但也生产了一些实体硬币作为收藏品。实体硬币可以预装数字比特币的代码，也可以是空白的，以便买家上传自己的比特币。


  这些主张的核心在于比特币底层的基础设施：区块链。区块链是一种去中心化的计算机系统，能够保证数据的真实性。实际上，区块链确立了真相。区块链可以验证组织或个人之间的交易——从音乐会门票、供应链，到法律文件，如房产契据、股票凭证或身份证。


  这些非凡的主张引来了经济学家、技术专家和金融监管机构的怀疑。他们嘲讽加密货币充其量是一时的狂热，最坏则是一场欺诈。在他们看来，比特币及其庞大的模仿者群体是由投机者驱动的，他们希望在抛售前哄抬价格，留给投资者的是损失。区块链忽视了中介为社会带来的价值和稳定，且要求深入理解计算机代码。它假设技术可以解决人性问题。


  谁是对的？我们将拭目以待，因为如果关于比特币、加密货币和区块链有什么确定的事，那就是它们不会在短期内消失。相反，它们处于关于技术在人类社会中角色的辩论中心。加密货币和区块链可以在未来发挥关键作用——无论是好是坏。


  ## 第 1 章


  ## 比特币与区块链


  货币是文明的基本组成部分。它作为个人交换的媒介，使他们能够买卖商品和服务。当其正常运作时，货币还允许个人在一段时间内存储价值。


  几千年来，人们使用过许多不同种类的货币——从珠子到金属硬币，从贝壳到咖啡豆。有些货币形式比其他形式更有效。“要成为一种真正优秀的货币，”经济学家兼《金融时报》专栏家马丁·沃尔夫写道，“它需要耐用、便携、可分割、统一、供应有限且被广泛接受。”


  如今，大多数人使用法定货币，即我们熟知的硬币和纸币。法定货币通过政府法规成为法定支付手段，即货币。这种货币本身没有内在价值。人们给予和接受货币以换取真实的商品和服务，因为它是一种被社会接受的价值象征。公民也必须用它来纳税。


  然而，意识到法定货币主要建立在信任之上，这可能令人不安。公民必须相信政府在需要时不会随意增发货币。当政府印钞过多时，通货膨胀就会上升。货币价值下跌，因为它购买力不如从前。恶性通货膨胀发生在货币失去价值时。当社会失去对其货币的信心时，后果可能是灾难性的。公民买不起食物，积蓄化为乌有，法治秩序崩溃。


  ![](img/GettyImages-1126878582.jpg)


  无法追踪纸币的来源和历史，这使得伪造纸币比伪造加密货币硬币容易得多，因为后者每一枚都可以在区块链上被完全追踪。


  “传统货币的根本问题在于使其运作所需的所有信任，”研究人员斯坦顿·海斯特和克里斯蒂·尤萨斯说道。“中央银行必须受到信任，不会贬低货币，但法定货币的历史充满了背信弃义的事例。”





  一些批评家认为，政府不可避免地会印钞来解决短期问题或满足即时需求。这些人通常对政府持怀疑态度，他们认为政府权力过大——拥有印钞、收税和监控资金的权力。一些人认为政府无法妥善监管金融体系，而该体系肩负着保管储蓄、发放贷款和进行投资的职责。如果政府在这一角色上失职，公民的储蓄将面临风险。


  所有这些担忧在 2007–2008 年全球金融危机期间似乎都成为了现实。2009 年 1 月，全球金融体系濒临崩溃。在美国，数百万房屋抵押贷款被发放给了无力偿还的人。这些抵押贷款被重新打包成证券，出售给全球各地的银行和其他金融机构。当房屋抵押贷款恶化时，金融公司开始倒闭。


  政府被迫花费数千亿美元来支撑金融机构，以避免灾难性的经济萧条。这些救助计划颇具争议。家庭失去了住房，投资者损失了巨额财富。但经营这些公司的 CEO 似乎基本逃脱了惩罚。2007–2008
  年全球金融危机动摇了整个社会的信任——对政府、机构和个人的信任。


  在第一笔比特币交易中，中本聪引用了 2009 年 1 月 3 日《伦敦泰晤士报》一则新闻的标题：“财政大臣濒临第二次银行救助边缘”。通过这一引用，中本聪概括了促使他们推出比特币的问题。他们无需陈述论据，只需指向
  2007–2008 年全球金融危机，这使许多人得出了一个极端的结论：政府不配掌管货币。


  比特币是中本聪针对法币挑战给出的答案。它可以轻松存储、即时传输，并通过简单的流程进行验证。


  正如科技记者布赖恩·帕特里克·埃哈所言：“比特币看起来像是货币对自身的梦想。”


  # 中本聪是谁？


  中本聪可能是一个个体，也可能是一群人（本书将中本聪称为“他们”）。他们从未公开透露真实身份。有人认为中本聪挖掘了约 100 万枚比特币，并于 2010 年移交了网络的控制权。除了一些晦涩的信息外，此后便再无他们的音讯。许多人声称自己是中本聪，但无人能够证明。


  ![](img/GettyImages-469951107.jpg)


  没人知道中本聪究竟是谁——甚至不确定他们是否为真实存在的人。


  ## 数字货币：一个问题与一个解决方案


  为了创造比特币，中本聪必须克服一个巨大的挑战：互联网上的任何东西都可以轻易复制。货币之所以有价值，部分原因在于其供应量有限。如果将世界上所有的黄金聚在一起，只能组成一个每边不足
  75 英尺（23 米）的立方体。但如果有人能在实验室里廉价制造黄金，它将迅速贬值。


  产品创造者故意限制供应的方式有很多。在 20 世纪 90 年代末，音乐主要只能通过光盘（CD）获取。如果你想要一首歌，必须购买单独的一份拷贝，通常只有购买整张专辑才能得到。拥有
  CD 后，你无法制作副本。如果想与朋友分享歌曲，他们必须借你的 CD（此时你就无法收听）。大多数其他媒体形式——报纸、书籍和 DVD——也是如此。这些行业在 20
  世纪 90 年代末享有丰厚利润也就不足为奇了。


  然而，互联网摧毁了这一模式。新网站允许用户下载整部电影并分享音乐文件。一个人只需买一首歌，就能以零额外成本制作大量副本与朋友分享。一旦报纸将新闻以数字形式发布到网上，它们就能被轻易复制并在别处重制。


  # 确保稀缺性


  某物的价值通常由其数量（供给）与人们对它的渴望程度（需求）决定。如果某物稀有且极具吸引力（如海边别墅），价格就会高昂。如果某物常见（如沙子）且供过于求，价格就会低廉。当政府过度印钞导致法币贬值时，法币通常会失去信任。


  中本聪设计比特币时规定其总量有限。流通中的币数将在 2140 年达到 2100 万枚的上限。在将发行的 2100 万枚比特币中，已有 1800 万枚在流通中。


  在随后的十五年里，音乐销量腰斩。许多报纸被迫合并或关闭。作家和音乐家难以从作品中获得新的收入。任何可数字化的东西都能以零成本无限复制，实际上变得一文不值。事实证明，互联网极擅长传输信息，并在这样做的过程中摧毁价值。


  鉴于这一现实，数字货币如何能够存在？你口袋里的十美元钞票无法被复制。如果丢了，就没了。如果你用它购买商品，收款人可以信任它是真钱。数字货币只是一个计算机文件。持有者可以简单地复制它并反复使用。然而，比特币在数字世界实现了一项非凡的壮举：几乎无法伪造货币。中本聪通过区块链实现了这一点。


  ## 区块链基础


  区块链是一个在线账本，或一份记录列表。它标识在任何特定时间谁拥有某项资产。一组中国区块链专家称其为“最新且最可信的记账形式”。每条记录都有时间戳，并通过密码学与其他记录结合形成一个区块。区块由由全球独立计算机组成的点对点网络独立检查和验证。它们将区块串成一条链（因此得名“区块链”），其中包含最近的交易。


  如果你想把一个文件传给朋友，区块链会确认你是当前所有者，然后确认新所有者。点对点网络会验证交易并更新区块链。该文件无法被复制并分发给其他人。只存在唯一的一个文件。因此，区块链有效地解决了数字化带来的问题，使数字货币成为可能。


  ### 区块链交易如何工作


  ![](img/Crypto_p14.jpg)


  《纽约客》记者内森·海勒写道：“区块链就像你祖母织的围巾的数字版本。她用一团毛线，织出的成品是连续的。每一针都依赖于前一针。如果不留下痕迹——几个明显的结，或针法的改变——就不可能抽走部分织物，或替换一块补丁。在区块链系统中也是如此，每一行都取决于之前的内容。任何破坏都会留下痕迹，试图掩盖踪迹也会留下痕迹。”


  ## 比特币区块链


  比特币是区块链最知名、最成功的应用。研究比特币有助于更好地理解区块链在现实世界中的运作方式。


  比特币账户称为地址。它们是由字母和数字组成的随机字符串。除此以外，没有任何其他信息与之关联——没有姓名、没有社会安全号码、没有能识别所有者身份的商业或住宅地址。每个比特币地址都有一个秘密代码，即私钥，允许某人访问它。秘密代码的持有者拥有该比特币。如果秘密代码被盗、遗忘或以其他方式丢失，比特币将无法使用。





  ## 第一章


  持有者通过使用其私钥将比特币转移给另一个人。该交易实际上成为比特币代码的一部分，并且是透明的，这意味着任何拥有电脑或智能手机的人都可以看到哪些地址曾拥有过该比特币，以及哪个地址当前拥有它。


  中本聪为第三方验证比特币交易创造了激励机制。验证过程涉及解决一个复杂的数学问题——即工作量证明——这需要大量的算力和能源。这些第三方被称为矿工，他们通过获得交易中一小部分比特币作为报酬来获得补偿。他们还会获得区块奖励，即一定数量的新生成比特币。矿工们竞相验证交易，奖励归完成工作量证明速度最快、最彻底的矿工所有。


  每笔交易都通过一种算法进行记录，该算法获取交易详情——时间、金额、发送方和接收方地址——并将交易转换为一串称为哈希值的字母和数字。任何人将该信息运行通过该算法，都会得到相同的哈希值。每个哈希值都可以与另一个哈希值结合，生成一个同时包含两者信息的新哈希值。因此，当矿工向区块链添加一个区块时，它会链接到一串哈希值链上，这条链可以一直追溯到中本聪于
  2009 年 1 月 3 日启动的第一个“创世”区块。


  ![](img/GettyImages-1020194246.jpg)


  许多矿工使用冷却设备和风扇来防止电脑过热。除了消耗大量电力、产生高昂电费外，挖矿还需要普通个人电脑不具备的高性能处理器。


  对链条的任何更改，无论多么微不足道，都会导致完全不同的哈希值。因此，交易记录无法被篡改，因为许多独立方已经确认了该信息。矿工验证交易后，点对点网络上的其他计算机（称为节点）会结合原始区块链验证矿工的工作。如果节点检测到异常，它们不会将新区块连接到其上。相反，它们会回溯到链上较早的、可信任的部分，并在那里连接新区块。被拒绝的区块成为“孤儿区块”。当两个矿工同时解决工作量证明问题时，也会产生孤儿区块——网络必须在两个区块中选择一个，被拒绝的那个就成为孤儿区块。由于这一过程，任何区块链用户都可以信任账本的信息，因为点对点网络已经对其进行了确认。


  中本聪设计比特币时，使得挖掘每个区块大约需要十分钟。不过，有时可能只需几分钟，有时则长达一小时。如果正在挖掘的比特币很多且需要更多算力，中本聪的算法会自动调整，使其更容易挖掘。然而，如果挖掘的区块变少，难度就会增加。目标是维持每区块十分钟的挖掘时间。


  比特币的价值取决于它在所有使用者——投资者、用户和整个社会——中建立的信任。因此，比特币矿工有动力保持诚实并验证交易。如果有人利用该系统进行欺诈并破坏信任，所有比特币将变得毫无价值。


  区块链专家奥米德·马莱坎写道：“于是，一个中央权威被一群追求自身利益的志愿者网络所取代。”


  通过比特币，中本聪证明了区块链的可行性。随后几年里，计算机科学家、投资者、监管机构、政府、专家、经济学家和普通公民都在努力应对这一新系统及其影响。


  科技记者吉迪恩·刘易斯-克劳斯写道：“关于区块链究竟是什么，存在巨大的困惑和争论，但标准定义将其描述为一种共享的、去中心化的、加密安全的、不可篡改的数字账本。从最广泛的意义上讲，区块链允许一群陌生人就某一事态达成一致，并基于契约共同推进。”


  ![](img/Crypto_p17.jpg)


  该图展示了三种组织类型：中心化、分布式和去中心化。去中心化结构将决策权和权威分散到大量人群中。在中心化系统中，大部分权力属于单一的中心实体，如政府或公司。最后，分布式系统由协调计算以达成共识的节点组成；它们可以是中心化的，也可以是去中心化的。


  这种语言让区块链听起来平淡无奇，但区块链的支持者认为，这揭示了区块链可能具有多么革命性的意义。对他们来说，“一群陌生人”“就某一事态达成一致，并基于契约共同推进”听起来像是文明的开端。


  风险投资家马克·安德森在 1990 年代初推出了第一款流行的互联网浏览器，并共同创立了网景公司。他在《纽约时报》撰文称比特币是下一个大事件：


  > 一种神秘的新技术涌现，似乎凭空出现，实则是近乎匿名的研究人员经过二十年紧张的研究与开发成果。

  >

  > 政治理想家将解放和革命的愿景投射到它身上；建制派精英则倾注鄙视与嘲讽。

  >

  > 另一方面，技术专家——极客们——为之着迷。他们看到了其中巨大的潜力，并日夜钻研。

  >

  > 我在说什么技术？1975 年的个人电脑，1993 年的互联网，以及——我相信——2014 年的比特币。


  ## 第二章：确立潜力


  贸易建立在信任之上，而信任难以建立、易于破坏。我与谁交易？我怎么知道我能得到我交易所得的东西？对方会遵守协议吗？在当代社会，这些问题通常由中介机构解决。


  在现代金融体系中，银行、律师事务所和经纪行等大型机构为交易提供担保。消费者在网上订购一件衬衫，银行向供应商确认消费者有支付能力。中介机构确保包裹送达且款项收到。


  人们很容易忘记这些交易可以有多复杂。除非确定卖家真正拥有该物品，否则买家无法购买。在每个阶段，都必须确立所有权——即卖家拥有待售商品，买家拥有支付手段。协议必须由双方达成，并由中介确认。


  值得注意的是，对于更大、更复杂的交易，中介机构可能会失职。职员可能出错，文件可能丢失，权属证明可能被伪造，官员可能被贿赂而篡改记录。在 2007-2008 年全球金融危机中，银行未能核实新房主是否有能力支付所购房屋的款项。


  然而，区块链消除了这种不确定性。资产的所有权通过区块链账本独立确认。由于账本以副本形式分布在世界各地，若不被发现，几乎不可能——甚至完全不可能——对其进行篡改。此外，如果网络的某一部分失效，证明所有权的账本仍将存在于网络的其他部分。因此，这种去中心化网络免受任何个人或政权试图关闭它的威胁。


  ## 消除中介




  通过确立所有权证明，区块链消除了中介机构，这能带来诸多益处。科技记者吉迪恩·刘易斯-克劳斯写道：“我们向这些中心化实体支付丰厚的托管服务费，不仅体现在它们收取的租金形式上，更体现在它们对我们生活施加的控制力上。理论上，区块链赋予了我们解决复杂协调问题的新机遇，且无需让现任协调者在过程中榨取如此多的价值。”


  试想一件简单的事：购买体育赛事门票。许多人使用热门网站购票。该网站确认门票真实存在，核实双方之间的门票交换，并提供交付机制。作为中介提供这些服务，网站会收取高额费用，大幅推高票价。


  而在区块链上，门票会被分配一个公共地址。持有者掌握赋予其访问该地址权限的私钥。当持有者出售门票时，系统会为门票创建一个新地址并将其添加到区块链。新持有者获得一个新私钥，确立其对门票的所有权。无需中介，也无需在票价上叠加费用。作为额外福利，交易几乎是即时完成的。


  银行是终极中介。区块链支持者相信，基于区块链的应用程序能取代当前金融体系的大部分功能。需要融资的新公司可发行代币而非股票。房屋买卖无需当今繁琐的尽职调查。


  ![](img/Crypto_p22.jpg)


  此图展示了两人如何利用彼此的密钥验证所有权并进行交易。首先，鲍勃使用密钥生成函数将一个巨大的随机数转换为两把密钥：一把私钥和一把公钥。他用私钥加密某些信息，然后发送给爱丽丝。交易另一端的爱丽丝使用鲍勃的公钥解密消息。因为这两把密钥由同一数学函数生成，它们彼此关联，所以公钥能在不向爱丽丝透露私钥的情况下验证鲍勃的私钥。


  过去二十年，随着自动取款机和网上银行的出现，银行业务变得便利得多。但底层系统几乎未变。电汇仍需二十四小时。纸质支票底部的路由号码是一个世纪前开发的。即使是信用卡交易，结算也需数分钟。相比之下，许多区块链交易仅需几秒钟。


  全球经济中另一个挤满中介的领域是贸易。该体系可能引入不一致性、导致错误，并为欺诈提供可乘之机。2015 年 10 月，多名 Chipotle（墨西哥烤肉卷餐厅）顾客因大肠杆菌生病。随着顾客流失和股价暴跌，管理层疯狂寻找疫情源头。然而调查陷入停滞。五个月后，公司报告称受污染的澳大利亚肉类极有可能是源头。他们无法更精确地定位。


  问题在于公司与众多供应商合作，而这些供应商往往缺乏合作动力。事实上，它们常为争夺大公司的订单而竞争。结果，信息可能对供应链其他成员甚至下单公司本身都不可见。多家连锁餐厅的管理者无法确认收到的食材是否符合约定标准。


  正如保护生物学家吉约姆·查普龙所言：“我们面临环境危机（如自然资源过度开采、污染）的一个原因，是全球经济充斥着缺乏问责制的商业行为体。购物时，你完全不知商品源自何处、如何制造。中介层层叠叠，作弊易如反掌。”


  然而，区块链提供了每笔交易的时间戳日志。该日志透明公开，若不提醒网络上所有其他参与者，便无法篡改。例如，在食品运输中，日志信息可包含储存温度、位置、移动原因，甚至运输卡车是否剧烈震动（这会导致某些产品保质期大幅缩短——想想碰伤的苹果）。因此，区块链能让目标各异的陌生人建立信任并协作。终极目标是实现透明度，同时不损害各公司的竞争性信息。此外，区块链在各方间建立了标准账本，涵盖从源头到交付的交易细节。虽然这种结构本身无法根除欺诈（毕竟有人可能故意录入虚假记录），但它确立了记账的一致性。全球最大的几家公司，如
  IBM、沃尔玛、家乐福和泰森食品，均已探索如何利用区块链技术。


  即使是一些相对较小的公司也已在使用区块链。例如，在怀俄明州北部的一座牧场，几百头小牛被记录在区块链上。区块链让这位在开阔草原放养牲畜的牧场主能向顾客证明其肉质更优、饲养更人道。通常，追踪是一个文书工作密集的过程，随着牛只买卖和转移，多个环节都可能出错或造假。区块链解决了牛肉追踪中的这些难题。


  区块链技术或许能让食客在用餐前详细了解那只鸡的“履历”。鸡脚上可佩戴设备，追踪其从农场到餐桌的供应链全程。每只鸡的信息上传至区块链。食客通过手机 App 下载这些信息可能成为新常态。区块链甚至可能走进超市——有购物者回忆，曾扫描一盒浆果的二维码，看到种植它们的家庭。


  2018 年在纽约市举行的一次会议上，与会者享用了金枪鱼寿司。每张餐巾纸上都有一个二维码，与会者可用智能手机扫描。通过区块链，二维码展示了该鱼如何在南太平洋斐济群岛近海被捕获，如何被标记
  ID，以及每块鱼肉如何跨越数千英里被追踪运送到他们盘中。


  区块链的用途不仅限于商业。环保事业常因支持者不确定捐款用途、或产品是否真正环保而失败。一个名为“塑料银行”的组织致力于减少进入世界海洋的塑料量，后者已成为严重污染源。塑料银行向回收塑料瓶及其他塑料废弃物的个人支付代币，再将塑料以溢价转售给制造公司，吸引环保意识强的消费者。区块链对这一过程的每个环节都至关重要。它保证塑料碎片的支付兑现，这在无银行服务或高犯罪率的社会尤为关键。它确保再生产品使用的塑料确已回收，让终端用户确信其购买行为支持了环保事业。


  ## 智能合约




  # Bitcoin、以太坊与加密货币的崛起


  随着比特币日益流行，一位名为 Vitalik Buterin 的俄裔加拿大青年对将区块链技术应用于更广泛的交易领域产生了浓厚兴趣。Buterin 是车臣共和国格罗兹尼的一位计算机科学家之子，该共和国位于俄罗斯西南部，在
  1990 年代俄罗斯军队与分离主义者进行残酷巷战时几乎被夷为平地。Buterin 六岁时随父移民加拿大，继承了父亲对政府及其可能造成的破坏的深恶痛绝。


  Buterin 对《纽约客》记者表示：“我把与政府监管或企业控制相关的一切都视为纯粹的邪恶，并假设这些机构里的人有点像伯恩斯先生[《辛普森一家》中荷马·辛普森贪婪的老板]，坐在办公桌后面说：‘太棒了。这次我怎么能坑一千个人？’”


  Buterin 还被创建新型去中心化系统的那些人所吸引。他说：“他们的早期履历（如果有履历的话）都在开源领域——Linux、Mozilla 和密码朋克邮件列表。我发现，像我这样仅仅几千个人就能从无到有地重建这一基本社会制度，这让我感到无比振奋。”


  Buterin 赞赏比特币，但他希望做的不仅仅是基于数字货币处理交易。他想创建一个能够完成任务的点对点网络。这些任务在被称为“智能合约”的协议中规定。


  智能合约可以连接多个区块链，无需人工干预即可执行协议。智能合约可用于基于时序的担保交易，例如租房。租客以比特币支付，从而释放提供公寓访问权限的代码。如果房东未在特定时间前发送代码，比特币将退还给租客。智能合约通过去中心化的点对点网络自动验证交易的所有环节，包括房东对公寓的所有权和租客用于支付的比特币持有情况。这一过程消除了银行等中介机构，为租客和房东节省了金钱和时间。


  2015 年，Buterin 推出了以太坊平台，该平台使用一种名为 Ether（以太币）的加密货币，向点对点网络上的计算机支付费用以执行智能合约。Buterin
  将其创作描述为“去中心化应用的 Android”，因此将智能合约称为“Dapps”。他将以太坊比作一款可编程执行平台上应用（即“Dapps”）的智能手机。实际上，以太坊上的程序员获得了一台去中心化超级计算机的访问权限。


  ![](img/GettyImages-500445678.jpg)


  Buterin 于 2015 年在科技会议 TechCrunch Disrupt 上发表演讲。Buterin 于 2014 年获得 10 万美元的奖学金，用于资助以太坊的发展。


  数字货币专家 Michael Casey 和 Paul Vigna 写道：“如果它能兑现 Buterin 和其他人设想的所有功能，该系统将相当于一个全球去中心化虚拟机，它始终执行用户的编码指令，且不受任何单一计算机的控制。”


  Buterin 和许多区块链支持者希望以太坊和其他区块链平台能帮助解决一个主要问题。大多数人的互联网体验被 Google、Facebook 和 Amazon 等大型平台所垄断。这些平台最初是人们执行“搜索”或“购买商品”等任务，或与他人/群体建立联系的场所。但随着时间的推移，这些平台似乎越来越多地在主导这些体验。通过追踪和收集数据，它们利用算法向用户投放信息和广告。更糟糕的是，它们要求用户交出个人信息才能使用平台。许多人希望区块链能消除这些中介，恢复互联网最初的承诺。


  ## Chapter 3：加密货币起飞


  最初，许多人因匿名性而被比特币吸引。2011 年 2 月，Silk Road 暗网开张。它提供各种非法商品和服务，包括毒品、被盗身份和密码、武器及人口贩卖，仅接受比特币支付。当时一枚比特币价值约
  30 美分。批评家将比特币斥为罪犯和恐怖分子的首选货币，但一些投资者注意到比特币的前提成立了——它让陌生人（甚至罪犯）能够建立信任并进行交易。简而言之，比特币按其创建者的意图运行。


  这引起了关注，尤其是当比特币价格开始剧烈波动时。对投机者而言，比特币似乎是快速致富的机会。执法部门也开始调查。2013 年春，美国政府查封了 Silk Road
  暗网市场，没收了 15 万多枚比特币。


  比特币及加密货币总体上占据了政府监管机构的精力。监管机构负责执行政府规则，尤其是金融领域。当时，Airbnb 和 Uber 等基于技术的服务正在对出租车和酒店行业造成巨大冲击。出租车公司和酒店企业被迫与通过互联网直接与客户联系的司机和公寓业主竞争。


  监管机构担心金融业也会遭遇类似冲击。在会议上，他们焦虑地提问：加密货币是骗局吗？它们会对金融机构产生什么影响？加密货币会打破政府对货币的垄断吗？美国当局查封了未按联邦机构要求注册即进行交易的加密货币账户。中国也进行了打击，宣布任何金融机构不得使用加密货币（尽管公民仍可使用）。比特币价格随这些公告涨跌，但总体趋势向上。2014
  年初，比特币价值从约 13 美元飙升至每枚 770 美元。


  比特币新闻开始定期出现在新闻节目和头条中。曾以几分钱交换比特币、恳求他人关注的持有者们发了大财。比特币正式登上历史舞台。


  全球各地，加密货币吸引了看中暴富机会的人。韩国成为仅次于美国和日本的第三大加密货币市场。贫穷的韩国青年自称“脏勺子”。这个称呼源于他们与精英阶层的对比——后者因工作、财富和机会被说成含着“银勺子”和“金勺子”出生。对“脏勺子”而言，加密货币似乎是赚大钱、甚至颠覆令人窒息的社会秩序的机会。即使无法购买股票或获得创业贷款，他们也能买加密货币。


  一位名为 Remy Kim 的 29 岁“脏勺子”在社交媒体上开设加密货币频道。他初识加密货币是因黑客劫持其硬盘并勒索比特币赎金。Kim 凑齐 1.2 枚比特币（当时约合
  800 美元）支付赎金，却对加密货币产生浓厚兴趣并自行购买。随着市场上涨，他买了一辆价值 50 万美元的海军蓝劳斯莱斯。网上他化名“Les Mis”，取自音乐剧和小说《悲惨世界》，其中穷人起义推翻腐败残暴的政府。


  比特币涨势呈抛物线状。2017 年初仅略低于 1000 美元，夏季突破 4000 美元，至 12 月中旬飙升至 19000 美元以上。




  在纽约市，一个露天比特币市场在联合广场开业。人们聚集在亚伯拉罕·林肯的雕像下，背着装满现金的背包，竞拍这种数字货币。这个市场被重命名为“中本聪广场”，其参与者让人想起几个世纪前在华尔街附近露天区域聚集的首批纽约交易员。


  比特币自动取款机（BTM）开始出现。到 2018 年底，全球约有 4000 台在使用，仅美国就有 2000 多台。在纽约市，110 家商店提供比特币自动取款机。据估计，每天都有
  5 台新的比特币自动取款机被安装。资金可以轻松存入，然后转换为比特币，存放在数字钱包中，随时随地都能访问。


  ![](img/GettyImages-942027294.jpg)


  这台 BTM 位于波兰的一个火车站内。


  那些在比特币萌芽时期幸运地——或明智地——押注比特币的人变得富有。一名 12 岁的男孩埃里克·芬曼从祖母那里借了 1000 美元，在比特币每枚 10 美元时买入。后来，他因开发的一项视频技术收到了
  10 万美元或 300 枚比特币的报价。他选择了比特币，财富随之滚雪球般增长。芬曼讨厌上学，说服父母达成一项协议：如果他在 18 岁前赚到 100 万美元，就不必上大学。他赢了。


  加密货币持有者现在身价远超他们曾经敢梦想的数字，变得极度保护自己的身份。持枪歹徒只需索要密码即可轻易得逞。记者内莉·鲍尔斯指出，考虑到区块链本意是提供互联网安全，持有加密货币的人似乎反而非常缺乏安全感。“加密货币富豪中普遍存在一种偏执狂，担心自己会成为抢劫目标，因为没有银行保管资金，所以许多人极度隐秘，”她写道。加密货币持有者不鼓励炫耀性消费，尽管也有少数例外。购买兰博基尼——或称“Lambos”——受到推崇。


  随着比特币价格上涨，一些欣喜若狂的持有者计划兑现，却发现丢失了私钥。一名 IT 工作者在 2009 年挖掘了 7500 多枚比特币。“当时只有我们六个人在做这事，”他回忆道，“就像淘金热的早期。”他将私钥存储在放在抽屉里的硬盘上。“四年后，抽屉里有两块硬盘。一块是空的，另一块装着我的比特币私钥，”他回忆道。“我本想扔掉那块空盘——结果不小心扔掉了装比特币信息的那块。”到那时，他的比特币价值
  6000 万美元。他恳求城镇允许他挖掘硬盘可能被倾倒的垃圾填埋场。但被拒绝了。


  另一位比特币持有者马克·弗劳恩费尔德花费 3000 美元购买了 7.4 枚比特币，存储在一个名为 Trezor 的硬件钱包（一种安全硬件设备）上。作为安全程序的一部分，钱包生成了
  24 个随机单词，他将其记在一张纸上，存放在抽屉里。如果丢失 Trezor，他只需买一个新的，用这 24 个单词即可恢复账户。就在去东京旅行前，弗劳恩费尔德决定把这张纸塞在女儿枕头下，以防他在意外中身亡。比特币价格飞涨，他想让女儿能动用这笔钱。然而女儿当时在伦敦，还要过一周才回来。在此期间，清洁服务人员进屋打扫，发现这张写满晦涩单词的纸，当垃圾扔掉了。


  发现错误时，弗劳恩费尔德以为这只是个小麻烦。他还记得 PIN 码，本可生成新账户并转移比特币。但当他输入 PIN 码时，Trezor 一直拒绝。他尝试了几十种变体，均无济于事。


  “我感到一阵恶心，”他回忆道。“输错六次 PIN 码后，隐隐的恐惧升级为心跳加速的恐慌——我可能永远失去了这 7.4 枚比特币。”


  弗劳恩费尔德继续尝试 PIN 码，屡试屡败。“比特币网络这种去中心化的性质并非没有后果——主要后果就是：如果你搞砸了，那是你自己的事，”他懊恼地指出。


  # 比特币湮灭


  没人喜欢密码，而比特币密码几乎无法记忆。一位加密货币开发者估计，在现存的 2100 万枚比特币中，多达 400 万枚可能已丢失。


  然而，这些故事丝毫未能抑制这场已成狂潮的投资热潮。长岛冰茶公司更名为长区块链公司，其股价单日飙升 500%。


  一款区块链游戏允许用户生成或“繁殖”加密猫——一种猫的计算机图形图像。因每张图像独一无二，稀缺性随之产生，推高了价格。用户只能用以太币支付，据报道一只名为“Dragon”的加密猫以
  17 万美元成交。


  ![](img/Crypto_p33.jpg)


  这些是一些加密猫的例子。每只猫都是特征的独特组合，使其具有假设价值。


  34 岁的瑞典艺术家乔纳斯·伦德利用区块链创建了 10 万个乔纳斯·伦德代币（JLT）。他将这些代币分给一个受托人委员会，由他们投票决定伦德应采取的艺术和职业步骤。在一次实例中，伦德有四个想法来艺术化改造一块胶合板：雕刻、涂金属灰漆、贴鸟类图片并附带要点解释过程，或涂漆后用火“以受控方式燃烧，创造出某种极其脆弱的东西”。伦德请受托人委员会决定。他们用代币选中了第三个方案：鸟类图片。这个选择将关联到未来的
  1041 个代币。当有人购买这件作品时，将获得这些代币，进而可用于投票决定伦德艺术的方向。


  通过基于区块链的代币，伦德只是将他视为影响艺术的个人、市场和社区力量形式化了。伦德将代币分给认识的人，一些购买他作品的人也获赠代币。他还向邀请他演讲、发推文谈论他或使用话题标签
  #jonaslundtoken 的人提供代币。


  似乎人人都在谈论加密货币。但监管机构持怀疑态度。加密货币支持者（即“币圈兄弟”）敦促 SEC 批准比特币交易所交易基金（ETF）。“适应或死亡，”一位支持者写道。“批准比特币
  ETF，迈出引领人类通过这项赋予我们的革命性技术前进的关键一步。”


  2017 年 7 月，以太坊诞生两周年。2017 年上半年，以太币价格从 8 美元涨至 400 美元，给了许多人庆祝的理由。一场为该币种举办的周年派对吸引了 300
  人来到曼哈顿的一家屋顶酒吧。迈克尔·凯西和保罗·维尼亚出席了派对，他们指出曾在该城市见证过许多繁荣与萧条，从 1990 年代末的互联网泡沫到比特币。他们说，场景几乎一模一样。


  “现场人群的能量触手可及，”两位记者写道。“对瞬间致富的期望显而易见。像大多数其他技术突破一样，这其中混合了乌托邦主义和资本主义。一些人想改变世界。一些人想暴富。许多人想象两者兼得。”


  # 数字货币是证券吗？






  # 加密货币和区块链面临的一个重要问题


  加密货币和区块链面临的一个重要问题是：数字货币或代币究竟是否属于证券，即一种可交易的金融资产。如果数字货币被认定为证券，则将归入由美国政府监管的法律分类之中。美国证券交易委员会（SEC）成立于
  1929 年华尔街股灾之后，那场历史性事件使股东血本无归，并拉开了大萧条（1929–1942）的序幕。从实际角度来看，SEC 的职责是确保投资者对证券市场拥有一定程度的透明度，并能更好地避免滥用和欺诈。如果加密货币被视为证券，它们将受到严格监管，这可能会消除许多最初使其极具吸引力的特性——例如匿名性。


  # ICO 与市场发展


  2017 年，首次代币发行（ICO）引发了狂热关注。数字公司纷纷发行自己的代币，渴望复制首批比特币持有者所获得收益的投资者蜂拥而入。这些公司在 2017 年共筹集了
  66 亿美元。数十种币或代币应运而生，其中许多是比特币的变体，被称为山寨币。EOS 号称“去中心化应用最强大的基础设施”，筹集了 42 亿美元。TaTaTu 打着“区块链上的社交娱乐”旗号，吸引了
  5.75 亿美元。Dragon 以“娱乐代币”自居，筹集了 4.2 亿美元。


  2018 年，一个乌克兰社交媒体网络为了给其 ICO 造势，决定派遣四名加密货币爱好者登顶珠穆朗玛峰，在山顶埋藏一块装有加密货币的硬盘。两名登山者未能登顶。另外两人登顶后被恶劣天气困住，随后被撤离并接受冻伤治疗。一名陪同的夏尔巴向导不幸遇难。该公司
  ASKfm 声称该硬盘据称存有价值 50,000 的加密货币，并鼓励其他人去寻找。


  此类噱头招致了负面舆论，许多批评者继续视加密货币为犯罪分子的工具，仅此而已。根据经济学家马丁·沃尔夫的说法，“守法的个人和企业不愿拥有那些因其匿名性而成为罪犯、恐怖分子和洗钱者理想工具的资产”，因此人们犹豫是否将其作为交换媒介使用。


  其他批评者则关注加密货币的波动性，以及打击较成熟数字货币的争议，尤其是与安全相关的争议。专栏作家利奥内尔·劳伦特指出：“对于任何需要一种货币来可靠地支付食品杂货和房租的人来说，这些都毫无鼓舞作用。”


  # 比特币与谷歌搜索


  谷歌报告称，“如何购买比特币”是 2017 年第三大“操作指南”类搜索（榜首是“如何制作粘液”）。在一些国家，“比特币”的谷歌搜索量超过了“黄金”。这在民众对中央政府信心较低的国家尤为明显，如阿尔及利亚、哥伦比亚和委内瑞拉。2019
  年，尼日利亚和南非对比特币的兴趣尤为浓厚，这两国都经历了货币贬值。这些国家的公民也对其政府极度不信任，尤其是对经济改革的前景持怀疑态度。


  ## 区块链的分叉


  随着比特币交易变得更加频繁，成本也随之上升。比特币交易被硬性限制在 1 兆字节以内。由于体积较小，区块链网络每秒仅能处理七笔交易。相比之下，信用卡公司每秒可处理超过五万笔交易。随着越来越多的比特币交易被处理，网络变得拥堵。


  一些用户向矿工提供更高费用，以将其交易打包进区块。到 2017 年，用户平均每笔交易需向矿工支付五美元。这使得小额交易变得成本高得令人望而却步——购买电影票或一杯咖啡的买家需额外支付五美元。更糟糕的是，在区块链支持者眼中，这种优先级制度开始类似于区块链试图取代的中介体系——银行、机构等。想支付较低费用的用户发现，他们不得不等待数小时甚至数天才能完成交易处理。


  一个显而易见的解决方案是增大交易区块容量，但矿工们抗议称这会增加处理成本。如果成本上升，参与的矿工会减少，可能使系统更容易受到操纵。一方主张更大的便利性和易用性，另一方则强调安全性。


  争论变得尖锐起来。一群人提议对比特币进行“分叉”。当两个矿工几乎同时在区块链上解出工作量证明，导致账本出现差异时，就会发生分叉。实际上，这两笔交易在账本中形成了一个分叉，为账本的后续走向提供了两种潜在结果。此时，社区中的共识机制会选出最准确的交易，而忽略另一笔。分叉随即得到解决。


  然而，分叉允许矿工和节点社区有效地更改区块链规则。挑战在于让区块链社区就该变更达成一致。毕竟，不存在一个中心化的决策机构可以直接命令所有人服从其指令。相反，社区必须达成共识。


  分叉可以是软分叉，也可以是硬分叉。简单来说，软分叉限制区块链未来的规则，而硬分叉则扩展规则。软分叉很像软件升级。正如升级后的电脑仍能运行旧版软件，区块链仍能与未升级的矿工和节点协同工作。软分叉只需区块链大多数用户批准即可。然而，硬分叉更为困难，因为它会将区块链分裂成两条不兼容的链：一条遵循旧规则，另一条遵循新规则。因此，硬分叉需要区块链所有用户的一致同意。否则，将出现两条不同的区块链时间线。实际上，一群人将遵守一套规则，而另一群人将遵守另一套规则。


  ![该图展示了区块链分叉的每个分支如何共享共同历史，但其中一个分支将遵循新规则，而另一个遵循原始规则。在硬分叉中，规则差异巨大，导致两条链不兼容。](img/Crypto_p38.jpg)


  一位软件开发者向比特币区块链提议了一种软分叉，这将使处理更多内容变得更高效，实际上将其容量翻倍。该分叉还将允许比特币在一个名为“闪电网络”的新网络上使用。闪电网络允许用户签署合同，根据预设余额使用双向支付通道。更重要的是，该系统允许用户在无需矿工参与的情况下向第三方转账。因此，闪电网络可实现任意数量的交易，且无需支付矿工费。


  比特币社区考虑了这一解决方案。一些矿工强烈反对，其中一群中国矿工领头抵制。他们不想失去手续费。其他人认为，闪电网络交易比区块链上的交易更难追踪，会招致中国政府的打压。中国政府反对任何其无法监控的交易。


  2017 年 5 月，全球五十多家比特币公司，包括加密货币企业、交易所、供应商和服务提供商，齐聚一堂，试图打破僵局。他们起草了一份名为《纽约协议》的文件，同意共同努力改进技术、沟通和协调，以提升区块链容量，支持更大体量的比特币交易。





  通过这项协议，比特币交易量翻了一番。然而，另一派人士寻求更高的区块容量上限。8 月 1 日，一种新的加密货币诞生了：比特币现金。这种货币代表了比特币的一次硬分叉，因此这两种货币互不兼容。更糟的是，增加比特币容量的协议最终于
  2017 年 11 月破裂，因为未能达成必要的共识。


  对一些观察家而言，愤怒的辩论、无法达成一致以及混乱的提议解决方案证明了加密货币过于不稳定且难以管理。但其他人得出了截然相反的结论。比特币和区块链账本已被证明经久不衰。它无法被篡改，即使是拥有大量资源的强大参与者也无法做到。


  ## 第 4 章：加密寒冬


  随着加密货币价格上涨，更多金融专家和经济学家抨击加密货币的概念本身。经济学家、诺贝尔奖得主保罗·克鲁格曼表示，与许多人似乎相信的相反，比特币代表的不是货币的未来，而是倒退了三百年。“加密货币没有后盾，没有与现实的系绳，”他写道。“如果投机者集体产生一刻怀疑，突然担心比特币一文不值，那么比特币就会变得一文不值。”


  ![](img/GettyImages-461807168.jpg)


  保罗·克鲁格曼关于比特币易受信任问题困扰的预测——这与法定货币的顽疾如出一辙——似乎在所谓的“加密寒冬”期间应验了。


  其他人指出，投资者赋予加密货币两项不可能同时完成的任务。一方面，投机者希望加密货币随着关注度的增加而增值。另一方面，加密货币本应是一种交换媒介，可用于购买披萨、毛衣和汽车。但人们不会用他们极其宝贵的加密货币余额进行此类小额购买。正如金融记者丹·麦克拉姆所观察到的：“没人会用保险箱里的金条当零花钱。”


  传奇投资者、亿万富翁沃伦·巴菲特将加密货币斥为“老鼠药的平方”，他的合伙人查理·芒格补充说，加密货币交易“纯粹是痴呆症”。


  加密货币投资者马克·安德森给予了犀利的回应：“我认为富有的、年老的白人男性对他们不理解的技术大加贬低，这种行为大概有 100%的概率是错的。”


  仿佛要证明批评者是正确的，比特币价格于 2018 年初开始下跌，随后陷入崩盘。到了春天，价格从接近 20,000 美元的高点暴跌至 7,500 美元以下。到年底，已跌破
  4,000 美元。虽然比特币仍为早早入场者带来了非凡回报，但许多 2017 年入场的投资者遭受了剧烈震荡。抢购 ICO（首次代币发行）的大多数投资者最终遭遇了灾难性损失。


  专栏利昂内尔·劳伦特将加密货币的下跌视为一种针对精英主义项目的反叛。“这标志着公众对比特币布道者所承诺的意识形态式技术乌托邦的抵制。他们承诺的去中心化仍是一个小众的、甚至是精英的追求，”他写道。


  “区块链成了万物的解决方案——给新闻业用区块链，给[大麻]用区块链，给牙医用区块链，”《纽约时报》记者内莉·鲍尔斯观察道。“这一切的核心是真正的技术进步，以及对这种去中心化技术能够变革金融系统的日益增长的认识。但狂热失控了。”


  随着加密货币崩盘、批评者群起攻之，投资者中流传起一个新词汇：“加密寒冬”。到 2019 年 3 月，比特币较 2017 年 12 月 19,800 美元的峰值下跌了约
  80%。以太币从 2018 年 1 月 1,400 美元的高点跌至一年后的仅 130 美元。加密货币总市值下跌了约 85%。2018 年 ICO 融资额达 120
  亿美元，但 2019 年前三个月，这一数字微薄至 1.77 亿美元。


  ![](img/shutterstock_1561526074.jpg)


  在加密寒冬期间，比特币价值较先前峰值下跌了多达 80%。


  唱衰者等待已久，毫不留情。“如果加密货币信徒将同样多的精力投入到真正的创新中，”一位报纸专栏作家讽刺道，“谁知道我们的文明现在会发展到什么地步了。”


  还记得加密猫吗？那些独一无二、身价不菲的可爱猫咪图片？单张独特图片的中位价格在 2018 年 3 月达到 41 美元，但到了夏天已跌近 5 美元。交易量从 12
  月的 130 万笔下降至 5 月的 11.5 万笔。一年后，该网站每天仅吸引几百名用户。名为“巨龙”的加密猫仍挂牌出售——约合 16 万英镑的以太币——却寻不到买家。


  一名《纽约时报》记者前往韩国，报道那些梦想通过加密货币摆脱困境的“脏勺子”阶层。Les Mis 依然拥有他的劳斯莱斯，但许多其他人损失了巨额财富，羞于向最亲近的人启齿。一位加密货币用户金基元曾赚得足以辞职，并每月花费
  1000 美元购买“想要的任何东西”。谈到损失数万美元时，金基元弓着腰，但他也很倔强：“我没什么可失去的。我一直想当富人。”


  ## 与巴菲特共进午餐


  每年，沃伦·巴菲特都会拍卖与他共进午餐的机会。商界人士、投资者和投资组合经理争相竞价，只为有机会与这位传奇投资者兼天才共坐，向他推销自己的想法。中标款项将捐赠给慈善机构。


  2019 年的中标价令人震惊。加密货币 TRON 的创始人孙宇晨以 460 万美元中标。之所以令人惊讶，是因为巴菲特曾严厉批评加密货币交易。然而，年仅 28 岁的孙宇晨却欣喜若狂，称这是区块链的“大胜利”。“我非常期待与沃伦·巴菲特探讨区块链的前景，并从他在创业和对未来大胆押注方面获得宝贵建议，”孙宇晨表示。他们于
  2020 年 1 月共进了午餐。


  ![](img/GettyImages-849890606.jpg)


  沃伦·巴菲特以 889 亿美元的净资产位列世界第四大富豪。


  即使是最铁杆的加密货币支持者也承认环境严峻。关于颠覆全球金融系统的自信言论被对生存的务实关注所取代。“市场保持非理性的时间比你保持偿付能力的时间更长，”这是一句古老的投资格言。对加密货币投资者而言，目标是在下一次上涨周期到来前避免倒闭。


  而那次上涨向来都会到来。毕竟，加密货币一直波动剧烈。一些加密货币支持者坚持认为，最近的下跌是自然演变的一部分。“亏钱很痛苦，但这是必要的一步，”投资者罗伯特·奈维特说。“2018
  年是从炒作走向产品的一年。”


  也有人指出，至少律师们还在发财。随着资产崩盘，愤怒的投资者转向法院。“现在市场跌了，”一名法学院学生说，“人人都在被起诉。”


  《金融时报》在 eBay 上发现了与一个失败的 ICO 相关的文件。记者联系上了那个失败代币发行的创始人，一个刚过二十出头的年轻人，询问发生了什么。“我们聘请了一名律师，这对我们来说是个大错，”创始人说。“因为我们的律师基本上告诉我们，在我们构建出一个可能拥有一些用户的真实产品之前，不应该发行任何
  ICO。我问他为什么，因为我看到那么多 ICO 根本没有任何产品构想，却设法筹集了数千万美元。”


  记者称这总结了“2017-2018 年大加密泡沫的一切弊端”。




  比特币面临的问题不仅仅是价格下跌。一家名为 Bitwise Asset Management 的公司研究了 2019 年 3 月四天内发生的所有比特币交易。它利用计算机分析来判断哪些交易是由真实的人类交易员完成的，而非计算机驱动的程序。Bitwise
  发现，在近 60 亿美元的报告交易额中，只有 2.73 亿美元是真实的。这项研究加剧了投资者对比特币实际交易情况的怀疑——即每天是否真的有大量比特币易手。一些交易所似乎试图虚报交易量，以在数据服务上获得更高的排名，从而吸引其他加密货币上市。交易所提供的加密货币越多，获得的上市费就越多，最终交易量也就越大。


  多年来，加密货币社区发展出了自己的短语和行话。随着比特币价格下跌，加密货币支持者相互安慰、鼓励要“坚持”。据称该词源于论坛上一位加密货币支持者，因手误或醉酒，发帖称“我在坚持持有”。这一短语演变成了持有者坚定长期持有加密货币、无视短期波动和惨重亏损的简写。他们拒绝“FUD”——恐惧、不确定和怀疑。


  “如果你真心相信 #bitcoin 和 #crypto 货币，今天的价格只不过是干扰而已，”一条 2018 年 11 月底的推文写道。


  # ……与税收


  在关于法定货币与加密货币的永无止境的争论中，法币的捍卫者指出，法币永远有价值，因为公民通常用本国货币纳税。此外，政府利用这些资金支付公共服务费用。然而，2018
  年 11 月，俄亥俄州成为第一个接受比特币缴税的州（尽管税单仍以美元计价），为其他州树立了先例。


  随着比特币价值下跌，挖矿变得利润更低。矿工开始退出。到 2018 年底，十万矿工退出，140 万台挖掘加密货币的计算机服务器关闭。衡量用于挖矿的计算能力的指标在
  2018 年中达到顶峰，随后下降了近一半。


  尽管经历一切，加密货币支持者并未失去他们正在开创一个新世界的感觉。有人想知道如果炸弹在加密货币会议上爆炸、炸死所有人会发生什么。


  “炸弹会让文明倒退数年，”另一人庄严地说道。


  如果对加密货币支持者有什么安慰，那就是风险投资家——那些在新产品和技术早期投资的人——并未抛弃区块链。事实上，风险投资家 2018 年在区块链公司的投资额是 2017
  年的四倍。但加密货币也吸引了不受欢迎的关注。随着对加密货币的兴趣增长，看到机会想发财的小偷和黑客数量也随之增加。


  ## 第 5 章


  黑客、小偷和批评家


  自比特币创建以来的十年间，至少价值 150 亿美元的加密货币被盗。由于部分盗窃未被报告，实际数字可能更大。仅自 2017 年以来，加密货币窃贼就窃取了近 20
  亿美元。这些攻击变得日益复杂和有组织。它们利用了大众对区块链安全性及其所谓“不可被黑”特性的误解。像所有发明的安全系统一样，区块链既有优势也有弱点。


  ## Mt. Gox 黑客攻击


  许多安全漏洞发生的不是加密货币本身，而是存储它们的交易所。交易所类似于银行和市场的结合体：它们连接买卖双方，并以账户形式持有资产——在本例中为加密货币。这些账户不同于与区块链关联的私钥，因为它们与个人身份关联。因此，加密货币交易所包含账户持有者的敏感信息，最重要的是持有者的加密货币密钥。


  在 2013 年的巅峰时期，Mt. Gox 是全球最大的比特币交易所。该交易所由法国出生、定居东京的计算机程序员 Mark Karpelès 创建。随着比特币价格飙升，Karpelès
  似乎沉浸在财富之中。他向致力于开发比特币软件的比特币基金会捐赠了 5000 枚比特币，并加入其董事会。员工报告称，他会突然批准 400 美元的员工午餐，或打断业务为交易所的东京总部订购平板电视。


  Mt. Gox 表面的成功被证明是假象。事实上，Mt. Gox 早在 2011 年就被黑客攻破，窃贼获得了整个交易所私钥的访问权限。四年间，他们从在线钱包窃取了约
  85 万枚比特币。2014 年 2 月，交易所宣告破产。超过 4 亿美元消失。全球投资者损失惨重，投资者对加密货币的信心再次遭受重创。


  ![](img/GettyImages-812373034.jpg)


  Mt. Gox 前首席执行官 Mark Karpelès 于 2019 年 3 月被日本法院判定伪造 Mt. Gox 财务数据罪名成立。


  据《Wired》记者 Robert McMillan 称，如果 Mt. Gox 事件有什么教训，那就是加密货币需要在现实世界中运作。“加密货币是一项技术，由一群不准备或不愿处理日常业务基本事务的人推向前台，”他写道。


  其他投资者得出了不同的教训。一些人发誓要找到小偷并将其绳之以法。居住在台湾的美国律师 Daniel Kelman 损失了 44.5 枚比特币，按峰值价值约 40
  万美元。他与居住在东京的瑞典软件工程师 Kim Nilsson 取得联系。Nilsson 对加密货币的潜力和前景充满热情。他 2012 年开始购买加密货币，一年后在
  Mt. Gox 交易所开设账户。


  Nilsson 坐在拥挤的东京公寓电脑前开始工作。窃贼在数年间从交易所提取了比特币。Nilsson 能够搜索交易并检测模式。虽然区块链地址是匿名的，但 Nilsson
  运气不错：部分 Mt. Gox 数据库（包括交易、提款、存款和用户余额的私人记录）已泄露到互联网上。利用这些数据，Nilsson 追踪到近 200 万个与 Mt.
  Gox 交易所相关的地址。尽管如此，Nilsson 仍无法掌握谁在使用这些地址及原因。


  # 加密货币与执法


  FBI 积极追查加密货币犯罪。伦敦市警察也开始培训警员识别通过数字货币资助的犯罪。


  ![](img/GettyImages-1184820947.jpg)


  FBI 网络部门成立于 2002 年，处理各类网络犯罪，包括黑客攻击和盗窃。


  随后，Nilsson 得到了一个意想不到的帮助来源：Karpelès 本人。Karpelès 想要反驳他参与掠夺 Mt. Gox 交易所阴谋的指控。他同意会见
  Nilsson 并帮助他完成 Mt. Gox 地址列表。有了这些信息，Nilsson 追踪了一些被盗比特币，它们从 Mt. Gox 交易所的一个钱包转移到另一个钱包。其中一笔交易附带三个字母的备注：“WME”。WME
  是谁或什么？




  尼尔松在互联网上搜寻，发现了一位在俄罗斯莫斯科经营货币兑换业务的 WME。结果发现，WME 曾发布与其声称遭交易平台欺诈有关的公开文件。WME 显然希望通过曝光迫使交易平台就范。但他犯了个错。他的一份投诉材料中包含了一封律师函以及他与平台往来的电子邮件。在其中一次往来中，尼尔松发现了
  WME 持有的一个账户上的名字：Alexander Vinnik（亚历山大·维尼克）。尼尔松找到了 Mt. Gox 的窃贼。


  尼尔松并不知情，美国调查人员早已因维尼克利用数字货币交易所洗钱而对其进行跟踪。2017 年 7 月，维尼克离开俄罗斯前往希腊度假。当地警方和美国官员在海滩上将其包围并逮捕。他被指控通过其数字货币交易所
  BTC-e 洗钱 40 亿美元以上，涉及与多项犯罪有关的个人，包括贩毒、身份盗窃、退税欺诈和计算机黑客攻击。美国调查人员称，维尼克还“获取”了来自 Mt. Gox
  的资金并将其洗白。据希腊警方称，维尼克是“国际通缉的犯罪组织‘主谋’”。


  尼尔松对窃贼落网感到欣慰。但他没拿回自己的钱。Mt. Gox 至今仍处于破产程序中。


  ![](img/GettyImages-855537746.jpg)


  亚历山大·维尼克于 2017 年在希腊因洗钱被捕。2020 年 1 月，希腊法院同意将其引渡至法国受审。他还将面临美国的审判，随后是其祖国俄罗斯的审判，因为这些地方都对其提起了指控。维尼克坚称自己无罪。


  # 51% 法则


  Mt. Gox 是交易所被黑客攻击时可能出现严重后果的惊人案例。但加密货币还可能存在哪些其他漏洞？


  2019 年初，一名黑客夺取了支持加密货币以太坊经典（Ethereum Classic）网络中超过一半的算力控制权。随后，黑客利用这一控制权重写了构成区块链的交易历史。通过这种手段，黑客向自己转移了
  100 多万美元。为了实施这起盗窃，窃贼利用了区块链本身的结构——更具体地说，是 51% 法则。


  51% 法则是指区块链交易由节点验证。节点是去中心化的，因此理论上彼此独立。然而，如果任何个人或团体能够控制用于验证交易的算力半数以上，他们就可以向自己发送一笔付款，然后重写区块链历史，使同一笔付款再次生效。


  此类攻击此前未针对主流加密货币，因为要获得大多数算力需要耗费巨资。然而，数百种较小型的加密货币可能更容易遭受“51% 攻击”。


  2018 年年中，多种持有量和交易量较小的加密货币遭遇了 51% 攻击。包括 Verge、Monacoin 和 Bitcoin Gold 在内的币种持有者遭受了估计总计
  2000 万美元的损失。然而，对更常见的以太坊经典的攻击取得成功，这更令人不安。


  # 加密货币义警


  一些人组建了自己的团体追捕加密货币窃贼。目标是识别窃贼并将其绳之以法。


  ## The DAO


  当加密货币持有者还在应对交易所问题和 51% 攻击时，另一个令人不安的安全漏洞浮出水面——智能合约漏洞。


  2016 年，一个承诺为投资者提供安全、透明的集体投资决策方式的风险投资基金启动。这个去中心化自治组织被称为 The DAO。它出售代币，参与者可用这些代币在以太坊区块链上指导项目。


  The DAO 是德国软件开发者 Christoph Jentzsch（克里斯托夫·延施）的构想。延施思考如何为公司融资。当时大多数公司只是单纯发行数字货币，但延施想得更深。为什么不创建一个拥有自己货币的平台，为多个初创项目提供资金呢？


  延施计划通过发行代币换取以太币（Ether），为以太坊区块链上的开发提供资金。投资者随后将使用代币为他们认为最有价值的项目投票。如果应用产生回报，则会分配回代币持有者。该结构开放透明。所有者可以看着资金流入，看到投票内容，以及代币如何分配。


  2016 年 4 月 30 日，The DAO 启动，设有 28 天的融资窗口期。延施希望为 The DAO 筹集 500 万美元，但通过众筹，投资者投入了 1.5
  亿美元。产生的宣传效应激发了对以太币的兴趣，推高了对该币种的需求。The DAO 基金很快达到 2.5 亿美元，在如此短的时间内这是一个惊人的数字。


  延施后来说：“我们希望它能成为去中心化共享经济的中心。对于这样一个大实验来说，时机还远未成熟。”


  一名黑客在智能合约第 666 行的一个字母中发现了漏洞——一个大写的 T 本应是小写。通过这个漏洞，黑客编写了一个与 The DAO 交互的合约。它开始每隔几分钟就吸走价值
  4000 美元的以太币，并发送到一个地址：`0xF35e2cC8E6523d683eD44870f5B7cC785051a77D`。


  投资者眼睁睁看着 The DAO 被抽干了 1200 万以太币，相当于 5000 多万美元。六小时后，黑客停手了。


  延施为挽救 The DAO 中剩余的资金而焦急万分，他召集了罗宾汉小组（Robin Hood Group），这是一个由来自世界各地的以太币专家和计算机程序员组成的团队，旨在黑客之前窃取剩余的以太币并归还给原主人。但当他们启动合约以挽救以太币时，原始漏洞依然存在，黑客继续利用它。


  这次黑客攻击表明，区块链和智能合约的优势——不可篡改——也可能成为劣势。“因为区块链上的交易无法撤销，部署智能合约有点像发射火箭，”苏黎世联邦理工学院（ETH
  Zürich）研究科学家、智能合约安全初创公司 ChainSecurity 联合创始人 Petar Tsankov 说。“软件不能犯错。”


  有人认为，罪魁祸首不是窃贼，而是 The DAO 程序员的粗心大意。程序员犯了错，就得由他们买单。然而，程序员们决心为 The DAO 的股东追回资金。他们认为，这起盗窃案可能会对区块链的整个概念造成致命打击，因为区块链才刚刚起步。于是他们提议进行硬分叉。硬分叉会做出追溯应用于整个区块链的更改。实际上，过去可以被字面意义上地重写。在区块
  1,920,000 中，程序员编写了代码，将新的智能合约应用于以太币。The DAO 投资者将能够拿回他们的钱。


  大多数以太坊社区成员（89%）同意进行硬分叉，但一小部分人（剩余的 11%）拒绝了这一解决方案。他们认为，区块链不能仅仅为了挽救个别用户而被重写。在他们的观点中，这可能会造成比解决的更多的问题，因为当事情出错时，任何人都可能期待得到救助。在现实世界中，真实的人一直在损失真金白银。加密货币和区块链不应有所不同。


  以太坊联合创始人 Vitalik Buterin（维塔利克·布特林）介入辩论，支持硬分叉。“一些比特币用户认为硬分叉在某种程度上违背了他们最基本的价值观，”他说。“我个人认为，将这些基本价值观推向这种极端是愚蠢的。”





  ## DAO 攻击及其后果


  对于加密货币拥护者而言，硬分叉表明区块链本身并不代表其创始人所宣称的那种自由：一个去中心化、万无一失、超越任何个人或政府权威的系统。“以太坊可以回滚这一事实意味着，所有比比特币规模更小的区块链本质上都是由其运营者控制的中心化数据库，”《比特币标准》作者
  Saifedean Ammous 写道。


  这场争议导致了两条并行区块链的出现：以太坊和以太坊经典。在以太坊上，资金被退还给了投资者。在以太坊经典上，窃贼保留了被盗的 DAO 代币。


  DAO 攻击动摇了区块链支持者的信心。但也有人认为这在意料之中。这甚至是正常的。区块链支持者指出了 2008 年金融体系的混乱。那难道不更糟吗？他们指出了一系列无休止的交易丑闻，在这些丑闻中，个人操纵市场并导致金融公司倒闭。金钱和财富的集中总是会吸引窃贼。


  因此，在这些不可避免的跌跌撞撞中，他们看到了希望。每当新的、创新的系统推出时，错误都会发生。互联网的推出伴随着无休止的批评，声称它永远不会普及，安全性或其他问题将是不可逾越的障碍。但这些挑战吸引了资源和智慧来解决它们。在支持者眼中，区块链也是如此。


  市场给出了自己的判决。攻击发生后的九个月里，以太坊交易价格徘徊在 10 美元左右。随后，它与其他加密货币一起飙升，于 2018 年初达到 1250 美元以上的峰值。随后加密货币崩盘，以太币跌至约
  100 美元。截至 2019 年 5 月，其交易价格约为 230 美元。以太坊经典交易价格约为 7 美元。


  ## QuadrigaCX 倒闭事件


  2018 年 12 月，随着关于加密货币易受黑客攻击和盗窃的消息传播，另一件令人不安的事件发生了。加密货币交易所 QuadrigaCX 的联合创始人兼首席执行官
  Gerald Cotten 据称因克罗恩病相关并发症在印度去世。Cotten 年仅三十岁。Cotten 的遗孀 Jennifer Robertson 称，交易所上的加密货币（价值约
  1.37 亿美元）存放在离岸账户中，无法访问，这一消息让 Quadriga 的 11.5 万用户震惊。这些账户只能通过 Cotten 的笔记本电脑访问，且只有
  Cotten 知道密码。


  2019 年 2 月 5 日，该公司宣布破产。审计师访问了据称持有加密货币的数字钱包，却一无所获。所有数字现金已于 2018 年从钱包中转出。部分账户被发现是虚假的。


  当十万多名 Quadriga 用户担心能否追回资金时，关于 Cotten 的数十种阴谋论在互联网上交织流传。一种猜测他伪造了死亡并躲藏起来。另一种称他确实死了，但
  Quadriga 始终是一个巨大的庞氏骗局。


  ![](img/shutterstock_1018094104.jpg)


  在这幅图中，一个欺诈性的加密货币交易所（红色）从新投资者（蓝色）那里收到资金，并用这些钱支付给自己和早期投资者（黑色）。早期投资者并未怀疑自己受骗，但新投资者要等到更新的投资者到来才能看到投资回报。这种欺诈被称为庞氏骗局。


  对于寻找理由不信任加密货币的投资者来说，此案提供了充足的素材。然而，最令人不安的是该公司历史中的一个细节。据《华尔街日报》报道，2017 年 6 月，该公司升级软件时，在一个“无法访问的钱包”中丢失了
  67,000 枚以太币。当时损失价值 1400 万美元，交易所承诺将赔偿受影响的客户。然而，由于以太币在此期间增值，损失已膨胀至 9000 万美元。如果软件更新中的一个故障就能让钱凭空消失，那么加密货币可能比其支持者声称的要不安全得多。


  ## 区块链面临的挑战


  区块链常常被那些对其运作原理知之甚少的人所轻视。但随着惨败事件不断增加，更有见地的批评也随之出现。


  网络安全专家 Bruce Schneier 指出，如果区块链支持者希望其与政府和银行竞争，那么许多人就必须信任技术而非机构。正如 2008-2009 年全球金融危机所证明的——历史提供了更多例子——机构会失效。但技术，以及使用技术的人，也会失效。事实上，Schneier
  列举了用户丢失基于区块链的加密货币的多种方式。


  > “如果你的比特币交易所被黑客攻击，你会损失所有资金，”Schneier 说道。“如果你的比特币钱包被黑客攻击，你会损失所有资金。如果你忘记了登录凭证，你会损失所有资金。如果你的智能合约代码中存在漏洞，你会损失所有资金。如果有人成功攻破了区块链安全，你会损失所有资金。”


  作为回应，几家公司成立以应对区块链的安全威胁。最常见的方法也是最直观的：在智能合约上线前对其进行严格审计。这些审计应能发现大多数可能导致安全漏洞的编码错误和 Bug。其他公司则开发了被称为“漏洞赏金”的智能合约。如果个人发现并报告漏洞，将获得奖励。


  但迄今为止，这些解决方案似乎都很复杂、昂贵、耗时且有限。毕竟，智能合约还处于起步阶段。它们面对的也是一个演化了数百万年的系统：人性。正如彭博专栏作家 Noah
  Smith 所总结的：“区块链所有的技术巫术都无法战胜好老式的人类不诚实。”


  然而，其他批评者则关注区块链技术本身固有的缺陷，因此认为它没有用处——尤其是与加密货币支持者所宣称的潜力相比。


  在一篇博客文章中，资深技术人员 Kai Stinchcombe 指出，区块链吸引了大型、信誉良好公司的兴趣和所谓的投资。但他表示，这些“企业吹捧者”“在宣传上投入巨大，在实际部署上却极少”。他指出，区块链公司
  Ripple——其负责人身价一度超过 Facebook 创始人 Mark Zuckerberg——自身并不使用区块链。“你没看错，”他在博文中写道。“Ripple
  公司决定跨境转账的最佳方式是不使用 Ripple 币。”


  Stinchcombe 的批评相当直白。结果表明，区块链无法成功应用于现实世界的问题。他指出，2006 年，沃尔玛曾尝试追踪单根香蕉和芒果从农场树木到商店货架的流转。该尝试因难以让供应链上的每个人录入数据而失败。十年后，沃尔玛再次尝试，这次使用了区块链。在
  Stinchcombe 看来，问题和解决方案的构想本身就荒谬。如果芒果采摘工不喜欢将农产品信息录入数据追踪系统，解决方案不是“让我们创建一长串小文件，每个文件都包含前一个文件的哈希值”。


  “人们把区块链当成‘未来的完整性魔杖’，”Stinchcombe 写道。“对着问题挥一挥区块链，你的数据突然就有效了。对于人们想要验证的几乎所有事物，区块链都被提议作为解决方案。”


  Stinchcombe 总结道，现实是没有人真正将区块链作为解决方案使用过。“不存在这样的人：他有一个想要解决的问题，发现可用的区块链解决方案是最佳解决途径，因此成为了一名区块链爱好者。”






  # 斯廷奇科姆论区块链信任


  斯廷奇科姆指出了房间里的大象：普通人如何知道智能合约——用计算机代码编写——是否可信？你必须通读代码。这可能需要几个小时。斯廷奇科姆举了购买电子书的例子。假设你直接从小说家那里买了一本书，智能合约到达了你的电脑。合约应说明为交付该书将从你的账户中扣除多少钱。通读合约以确保没有任何漏洞或错误，所花费的时间和精力将远超这本电子书的价值。


  “审计软件很难！”斯廷奇科姆写道。“历史上受审查最严格的智能合约有一个小漏洞，没人注意到——直到有人注意到了，并利用它窃取了五千万美元。如果凑钱组建[1.5 亿美元]投资基金的加密货币爱好者无法妥善审计软件，你对自己的电子书审计有多大把握？也许你宁愿编写自己的反提议软件合约，以防这位电子书作者在他们的版本中隐藏了递归漏洞，以掏空你以太坊钱包里毕生的积蓄？”


  斯廷奇科姆表示，关键在于区块链并非“无需信任”——它只是要求人们信任技术而非他人。这说得通——毕竟，我们一直信任技术执行关键任务。但现实中，我们实际上是信任第三方来验证技术值得信任。因此，区块链将验证信任的任务重新放回到个人身上。这需要非凡的知识、资源和时间。据斯廷奇科姆称，这使得区块链远不如其支持者声称的那样有效。


  《金融时报》记者丹·麦克拉姆利用斯廷奇科姆的论点得出了一个惊人的结论：“区块链甚至无法解决大多数信任问题。公共区块链上的数据完整性可信赖其不会被篡改，但这无法说明数据最初是否正确。对于选票、金枪鱼、集装箱或芒果供应链，区块链注册表只能像参与贡献的人那样好、那样值得信任。”


  最后，关于区块链还有另一个痛苦的现实。即使到 2019 年中期，极少有普通互联网用户在实际使用它。区块链爱好者设想 Dapp 能像 iPhone 上的 App
  一样运行。因为 Dapp 不受巨头科技公司控制，它们为用户提供了一种绕过守门人、避免互联网上无休止追踪的方式。然而，在有足够数据进行统计测量的两千七百个 Dapp
  中，只有三个吸引了超过一万名日活用户。事实上，排名前五十的 Dapp 中有三十个专门用于赌博。


  ![](img/Crypto_p61.jpg)


  你可能习惯的智能手机应用依赖中心化数据中心，通过互联网服务提供商（ISP）向你的手机传递内容。Dapp 依赖去中心化方法，用户彼此连接而非连接到单一实体，以传递内容。


  Dapp 的一个问题是用户必须习惯一套全新的基于区块链的操作系统。相比之下，将应用下载到智能手机相对简单容易。区块链的操作系统仍处于相对早期阶段。程序员正在构建和排查系统故障。用户体验尚非重点。


  “它能跑吗？能跑，就像我造了一辆车，”一位计算机科学教授说。“它能跑，但这不是你想让孩子坐进去的东西。”


  ## 第六章：区块链：互联网的郁金香球茎？


  区块链现在处于什么位置，未来将走向何方？在批评者眼中，区块链不过是一个投机泡沫——技术学家的又一次权力攫取、一个寻找问题的解决方案、一个充满错误的系统。它易受窃贼和黑客攻击，或者毫无希望地妥协了。但对支持者而言，区块链无异于一场革命。它确立了使人类事务运作的基础：真相，进而带来信任。它将互联网的控制权从科技公司、守门人和极权政府手中夺回。在支持者眼中，考虑到区块链潜力的巨大性，过去十年的挑战和失误在所难免。


  全面支持加密货币的基础设施正在就位。几家交易所——如币安香港、Upbit 和火币——已设立数字货币业务。矿工遍布全球。包括沃尔玛在内的供应链正在采用区块链技术。2019
  年 5 月，亚马逊、全食超市、诺德斯特龙、AT&T 和巴诺书店等公司开始接受加密货币支付。


  然而，也出现了跌跌撞撞的情况。2018 年比特币和其他加密货币的暴跌削弱了投资者的需求和兴趣。其价值的波动性使加密货币难以作为交换媒介使用。高盛和芝加哥期权交易所等华尔街主要机构推迟或放弃了提供比特币交易支持的计划。


  “当你与科技行业内部人士谈论[区块链]的去向时，两种截然不同的比较不可避免：郁金香球茎和互联网，”一位《纽约时报》记者观察到。郁金香球茎狂热发生在 17 世纪的荷兰，投机者在新开放的市场上竞相抬高郁金香花球茎的价格。价格达到天文数字，然后突然崩盘，郁金香狂热已成为投机泡沫的代名词。另一方面，互联网也是一个在
  2000 年破裂的投机泡沫。但它最终回报了投资者。“那么它到底是什么？”文章问道。“我们距离对这项技术将在世界上占据何种位置有任何清晰认识，还有几年时间。”


  ## 恢复对数据的信任


  据支持者称，区块链最大的潜在应用之一是数据。我们周围，联网家电、车辆、笔记本和台式电脑，当然还有智能手机，都在与网络对话。它们共享信息——数十亿比特的数据。分析师和程序筛选这庞大的宝藏以获取洞见。想象一下，如果医生能以非凡的精度实时追踪疾病传播。或者机器零件能在需要更换时通知用户。或者定制教育项目的进度能得到实时确认。


  数据能为消费者行为、选民偏好和组织效能提供关键线索。我们常认为亚马逊是一个可以买到几乎所有东西并直接发货给我们的网站。实际上，亚马逊既是一家数据收集公司，掌握着客户宝贵的购物习惯信息。谷歌、脸书和苹果等其他公司也拥有类似的用户数据池。这些公司严守其数据。它们的高股价证明了它们在经济中的统治地位。


  然而，公众对这些公司的信任近年来已下降。有消息披露，消费者数据被用来操纵、监视、定向投放“虚假新闻”给用户。许多用户现在想知道他们的数据是如何被使用——或滥用的。信任是所有交易的关键组成部分，而在数据收集时代，信任已接近历史最低点。


  许多公司不滥用收集的数据，但已显示出无法被信任来保护数据。因为用户数据极其宝贵，这些公司成为黑客攻击目标。似乎每隔几个月，就有另一家公司报告重大数据泄露。例如，推特数据被黑，导致电子邮件收件箱被垃圾邮件塞满、复杂的诈骗活动和骚扰。






  # 数据隐私与区块链的承诺


  ## 隐私担忧与信任危机


  许多人对隐私深感忧虑。他们不希望自己的数据被记录、分析、共享，甚至被窃取。他们不希望第三方利用这些数据推送广告告诉他们买什么，也不希望被有针对性的媒体故事操纵，被告知怎么想、投给谁。即使在一个人搜索或购买商品很久之后，该商品的广告仍可能出现在其浏览器中。这时刻提醒着我们：我们始终处于被**监视**的状态，这令人恼火且不安。


  在面临这些严重限制的情况下，数据的承诺如何兑现？信任如何重建？有人认为，答案在于**区块链**。


  每天在互联网上发生数十亿笔交易。这些交易通过第三方记录，而第三方可能利用、滥用或丢失数据。第三方可能为自己的目的分析数据，或在用户不知情的情况下将其出售给其他方。此外，掌握数据的一方可以将其与关于用户的其他数据结合，形成一个更完整（或扭曲）的用户画像。


  区块链移除了中介，将数据交换限制在双方之间。交换可以在私密环境下进行，且严格限定在特定交易范围内。这意味着用户可以购买商品，而不允许第三方在互联网上全程追踪他们。区块链还允许用户掌控自己的数据。没有区块链时，用户通常使用特定的
  ID 名称并通过密码验证登录网站。用户可能以为他们拥有这种体验。毕竟，那是他们的名字、密码和数据。然而，一切——用户的身份和内容——实际上都托管在网站上。


  > “应用程序并不那么响应客户需求，而是被设计用来锁定客户，”科技公司创始人 Ryan Shea 说道。“你进入网络，Facebook、Google、Dropbox、Pinterest
  或 Amazon 都希望你搬进去，把你所有的文档、音乐交给它们，为你的生活提供存储。医疗网站想存储你所有的健康数据。当你想要取回数据时，不得不向它们请愿。”


  在数据和隐私担忧日益加剧、以及超高效互联网巨头可能以有利于自身的方式塑造社会和经济的时代，区块链可能成为一种强有力的替代方案。去中心化、私密的区块链地址，为当前每个网站都需要单独
  ID 和密码的繁琐系统提供了替代方案。个人保留对自己身份和数据的控制权，而不是将它们交给应用程序或平台。


  ## 未来场景示例


  为了理解未来可能如何运作，请考虑以下示例：你正驾驶电动汽车长途行驶，需要充电。然而，附近没有充电站。你驶向一户人家，该房主已将其宣传为电动汽车充电站。你插上电源，通过区块链授权支付，使用数字钱包中的数字货币。交易完成，你继续上路。


  这笔交易看似简单，实则需要大量信任。区块链必须验证汽车归驾驶员所有、驾驶员有足够资金支付、且未使用可能感染房主电脑病毒的软件。没有区块链技术，许多不同的把关人可能会拖慢甚至阻止交易。电力公司可能只向特定管辖区内的个人出售电力。汽车公司可能协商让其汽车仅在特定充电站维修。电信公司可能不允许交易，除非收取特殊费用。而当前的金融系统——现金和证券交换昂贵且结算可能需要数天——无法实现数字货币的快速交换。


  有了区块链，所有这些都被绕过。个人拥有自己的身份、资金和物品（本例中为汽车）。他们在没有第三方或中介的情况下与另一个人进行交易。他们不需要政府或金融机构。甚至不需要先前的关系或信誉来建立信任。不难理解为何极权政权和警察国家对加密货币持怀疑态度，甚至在某些情况下直接予以禁止。在上述示例中，区块链是自由的赋能者。


  # 确立个人身份


  ## 自主权与身份困境


  自由的一部分是拥有自主决定权，掌控自己的身份。在许多社会中，人们无法获取自己的过去或证明自己的身份。他们可能在一个家或一块土地上生活了几十年，却无法证明拥有所有权。他们可能拥有技能或特长，却无法向政府或银行证明。全世界有数百万人生活在这种不稳定的境况中。


  在其他地方，人们拥有记录——出生证明、护照、驾照、产权契据、信用记录等——可用于向政府和其他机构证明他们就是他们所说的那个人，并拥有他们声称拥有的东西。因为个人能够确立身份，他们才能贷款、利用金融和教育机会、投资自己。他们可以获得用于应急的短期信用卡和用于购房或教育的长期贷款。处于该体系之外的个人——通常较贫穷——实际上为银行等服务支付更多费用，并被锁定在无法从资产中获利的状态中。


  在菲律宾马尼拉，超过五十万非法占屋者居住在无土地所有权证的建筑物中。这使他们容易受到政府和私人土地所有者的挑战。在巴西，数百万人生活在广阔的贫民窟——由人们在不属于自己的土地上建造的棚屋和房屋组成的社区。在南亚国家（如印度），农村农民在公共土地上耕种。由于没有他们耕种财产的所有权证（契据），这些人被剥夺了投资、对财产所做的任何改良以及任何积蓄。他们失去了过去，也被剥夺了未来。


  一个严重的问题是，许多社会的记录保管者无能且腐败。个人可能试图获取一块土地的契据——其确切位置、买卖日期——却发现记录混乱或录入错误。或者有人可能贿赂官员在契据上写上不同的名字，从而有效地窃取所有权。在美国和加拿大，美洲原住民在暴力威胁下被迫放弃土地，联邦政府未能履行关于原住民土地权利和所有权的条约和法律。这种腐败偏袒富人和权势者。


  > “政府曾凭空编造全新的土地登记册，并宣称：‘嘿，这地是我们的，这儿没人住，’” 保护生物学家 Guillaume Chapron 指出。如果该地区存在自然资源，这种情况尤为常见。


  ## 区块链的解决方案


  区块链可能是这些挑战的解决方案。由于去中心化账本记账系统，区块链合约无法被篡改。它们透明且对任何拥有互联网接入的人普遍可访问。这不仅影响在线购物。区块链可能让数十亿人接入现代全球经济——这些人此前被忽视、剥削或单纯地排除在外。


  > “时间戳使一切成为可能，”作者 Michael Casey 和 Paul Vigna 指出，“因为它将一个里程碑事件的声明——出生、毕业、财产转让、婚姻——插入一个普遍接受的历史记录中，所有人都可以引用它。”





  个人拥有自己的住房，通常能成为更好的管理者。他们往往更积极地参与地方政府事务，并寻求解决共同问题的方案。在比以往任何时候都更需要积极公民身份的世界里，他们成为了活跃的公民。


  但同样，去中心化账本并不能保证原始编码是有效的。代码可能编写错误，或被蓄意篡改。用户必须始终阅读细则——无论是计算机代码还是合同末尾的条款。盲目迷信区块链并非解决之道。区块链本身无法克服暴政、建立社会凝聚力、消除腐败，或以其他方式抵御人们面临的诸多挑战。


  ## 区块链与银行业


  银行天然会对区块链爱好者声称将取代他们的系统持怀疑态度。一位富有的投资者曾表示，他购买比特币是为了“支持一种拆解金融体系的方式”。然而最近，银行开始拥抱这项新技术。许多银行发行了由美元或其他资产担保的代币，从而帮助规避加密货币过去经历的剧烈波动。一种名为“公用结算币”的加密货币，允许银行之间更高效地划转资金。


  摩根大通 CEO 杰米·戴蒙曾威胁要解雇交易比特币的员工，却宣布摩根大通将推出自己的数字代币，这属美国主要银行之首创。尽管曾称比特币是“欺诈”，戴蒙最终认识到了区块链的潜力。毕竟，摩根大通早已开发了
  `Quorum`，这是一个企业用于追踪金融数据的区块链平台。


  ![](img/1184027215.jpg)


  摩根大通总部位于纽约市，是美国最大的银行。它直到最近才开始投资加密货币。


  据该行称，客户曾要求一种将资金转移到区块链上的方式。证券通常通过`存管信托清算公司`（`DTCC`）进行买卖和交付（或结算），该机构由银行共同拥有。确保证券安全合法转让的步骤繁多、繁琐、耗时且成本高昂。美国国债市场每天约有
  500 亿美元的交易失败，给市场带来了重大损失和摩擦。


  这些失败对银行来说也是昂贵的。摩根大通区块链负责人表示，吸引力在于大型机构希望安全地转移资金，最重要的是快速转移。通过 `Quorum`，机构的资金被转换为 `JPM
  Coin`，后者由美元支持。交易完成后，`JPM Coin` 再转换回美元。这使机构能够绕过电汇资金相对繁琐的流程。


  在中国这个世界第二大经济体中，金融监管机构对区块链表现出了浓厚兴趣。统治该国的中国共产党已采取行动，防止加密货币在政府控制之外运行。中国禁止了加密货币交易所和
  `ICO`。取而代之的是，中国人民银行（`PBOC`）据报已开始开发数字货币以取代现金。尽管细节未经证实，但中国公民可能会用现金兑换数字钱包。这将使 `PBOC`
  能够追踪几乎所有公民的交易，因为所有购买都将以数字形式进行。该系统与首批加密货币开发者的愿景背道而驰。


  银行和加密货币面临其他挑战。金融公司属于受监管最严格的行业之一。这是有充分理由的。不负责任的银行业务、放贷和投机导致了资产泡沫、金融恐慌和经济灾难，所有这些都让民众陷入苦难、推翻政府，甚至引发战争。虽然区块链号称透明，但监管机构需要时间来理解该技术及其影响。


  “去当地的 Chase 分行这一标准答案在加密货币领域行不通，”加密货币交易员山姆·班克曼-弗里德对彭博社记者表示。“大银行为加密货币行业提供银行服务并不违法，但这是一个巨大的合规难题，它们不愿投入资源去解决。”


  加密货币最终将如何影响银行业仍在探索中。虽然银行已开始利用区块链提高效率，但其初衷——取代中介机构——目前仍更多是潜力而非现实。


  ## 区块链：就业毁灭者？


  鉴于美国当前的政治和社会动荡，区块链可能为劳动力市场内部的问题提供解决方案。


  所有有效的创新都会给特定行业及其从业者带来压力。区块链可能会使记录保管员，以及监督并确保其正确性的个人变得多余。记录保管并非小行业。仅在美国，会计师就有超过一百万人。但这种变革影响的可能不止这一职业。华尔街雇佣并高薪聘请分析师和投资组合经理团队，等待财报发布和季度数据。区块链可使这些内容实时可用并验证其准确性——无需等待信息。银行也是金融流程各环节的大量雇主，从发放贷款到验证交易，再到为客户提供尽职调查。


  许多高薪、中上层职业的消失可能造成动荡。与之相比，目前关于移民、外国竞争和全球化的愤怒辩论可能显得温和。随着更多自动化机器接管体力劳动，以及基于算法的软件取代传统白领工作，我们不得不问：这将为人类留下一个什么样的世界？工作在我们生活中的角色、尊严的重要性、凭一己之力建设事物的自豪感——所有这些都必须被讨论、辩论和解决，否则创造技术的人将替我们决定。


  有人认为，一旦人类摆脱了无意义的工作，就会专注于自己的创造潜力。讽刺的是，音乐、视觉艺术和写作等创意产业，却是最早被技术吞噬的职业之一。区块链能成为解决方案的一部分吗？


  技术使复制、再生产和分发文字、音乐或电影的成本几乎为零。然而，区块链通过建立不可复制的独特事物解决了这一问题。因此，艺术家可以创作作品，使其作为唯一副本（或限量副本之一）存在，以便出售和分发。这是第一步。要建立一个服务于个体艺术家的数字经济，确立作品的唯一性及其创作者身份至关重要。


  ## 区块链与民主


  区块链还能改善民主政府与选民之间的关系。任何民主制度面临的最大挑战包括选民欺诈和选民压制。自公民首次举行选举以来，个人就一直在篡改流程。传统上，个人会多次投票或塞入选票箱。美国臭名昭著的做法包括通过人头税、测试、选区划分操纵，或因档案上的违规记录剥夺个人投票权。影响投票的更隐蔽手段包括将投票站设在偏远或难以到达的地区。





  # 技术爱好者与在线投票


  技术爱好者长期以来一直主张利用互联网进行投票。选举可在线举行，个人只需轻触智能手机即可登记选票。这无疑会提高选民参与度——无需前往投票站、排队等候，或应对繁琐的登记程序。在线投票还可能解决美国投票设备有时老旧、损坏、被黑客攻击或失效的问题。


  ## 区块链在投票中的应用


  区块链确立单一副本，理论上可确立单一选票。2018 年 6 月底，瑞士城市楚格举行了一次利用区块链技术的试投票。楚格属于一个致力于确立自身作为区块链创新中心地位的团体。楚格建立了一套电子身份证系统，允许其公民通过智能手机就特定议题投票。市政府宣称实验成功，因为选民能够轻松且匿名地登记选票。


  ![](img/GettyImages-1168341695.jpg)


  苏黎世郊外，瑞士小镇楚格有时被称为“加密谷”，这是仿照加利福尼亚更著名的“硅谷”而起的名字。


  爱沙尼亚，这个位于波罗的海、人口 130 万的欧洲国家，正在引领另一项在投票中使用区块链的努力。多年来，该国已从传统政府过渡到完全数字化的政府。每位公民均获发一张安全身份证。他们可在家中的电脑上为候选人投票。他们可报税、申请贷款或看病，无需其他系统所需的文书工作，因为信息可在线获取。


  该系统的安全性基于**无密钥签名基础设施（KSI）**，这是一种区块链技术。**KSI**由爱沙尼亚公司**Guardtime**开发。美军是**Guardtime**最大的客户之一。


  要理解为何区块链对安全至关重要，关键在于理解为何安全漏洞会造成毁灭性后果。按常规理解，人们通常将数据泄露视为他人窃取机密信息。但这只是问题的一部分。另一个或许更重要的安全威胁是，有人可在不被察觉的情况下篡改数据。你的病历细节对数据窃贼可能不重要。但若有人篡改这些细节——例如你对哪些药物过敏——下次你去医院时可能会酿成致命后果。


  # 区块链与能源


  比特币挖矿需要巨大的计算能力，这些计算机消耗大量能源。据估计，到 2015 年，全球矿工消耗的能源超过了整个奥地利国家的用量。其中大部分挖矿在中国进行，那里大多数发电站靠燃煤供电。


  此例可应用于许多其他场景。设想一下，如果投票记录、税务记录和支付记录或土地所有权在无人能追踪变更的情况下被篡改，会怎样？数据泄露被发现的平均时间为 197 天。这足以给记录制造大量混乱。然而，区块链能让每一次篡改立即显现，确保记录可靠。更重要的是，**KSI**等技术能在无法访问数据本身的情况下监控信息的完整性。因此，信息可得到保护并保持私密。


  ## 区块链与环境


  区块链支持者认为，除了支持民主，区块链还可能成为解决我们面临的最严峻挑战——自然世界的破坏——的关键一环。


  区块链已被用于追踪食品。这让消费者能知晓其食品是否经过负责任的饲养、捕捞和配送。其他公司已启动区块链试点项目，允许个人交易多余能源。在日本，区块链通过确立能源归属及数量，实现了客户间的直接交易。最终目标是让农村电力用户创建自己的可再生能源，然后通过电网向其他用户出售能源。最终结果是减少碳排放。


  区块链本身无法拯救地球。然而支持者辩称，通过在大规模上建立信任，它可成为一项巨大工具。它能让关心此事的个人建立连接、验证和交易。它让人们能协同合作。随着环境危机加剧，区块链支持者辩称它很可能成为解决方案的核心——这也是对那些质疑区块链何时能找到应用场景的批评者的回应。


  ## 区块链是未来吗？


  区块链激发的创新及其蕴含的潜力仍处于起步阶段。区块链会改善技术获取吗？会为用户创造更公平的竞争环境吗？会让个人协作更有效吗？还是会导致更集中的控制、更多的疏离，以及掌权者更多的滥用？


  对区块链最乐观的愿景是，它能帮助颠覆我们当前的技术局面，后者似乎注定走向某种反乌托邦的死胡同。目前几家巨头公司占据主导，提供“免费”服务，实则以极具价值的用户数据作为代价。这些数据被公司用于自身利益，方式大多为普通用户所不知。公司还利用其地位扼杀创新和竞争，并最终主导用户的在线体验。


  > “我不说互联网彻底失败了，但它未能兑现我们许多人期望的那种积极、建设性的社会，”万维网发明者蒂姆·伯纳斯-李爵士指出。


  数字代币支持者相信，代币将激发新一波创新和创造力，尤其是在为互联网构建公共工具——或开放协议——时。过去，互联网主要由无需服务利益相关者需求的机构构建——即政府、大学和非营利组织。创建这些工具的个人大多无法直接从劳动中获利。因此，顶尖软件工程人才倾向于去薪酬最高的公司。而可能无法立即产生收入的公益项目则陷入停滞。然而有了代币，个人现在可创建造福大众的开放协议——并为此获得报酬。


  > “这个代币与开放平台的生态系统，开始看起来像一张新的去中心化经济未来地图，”财经记者迈克尔·凯西和保罗·维尼亚写道。“事实上，这些数字资产甚至可能成为人类创造和交换价值的主要手段。”


  ## 天秤币


  2019 年 6 月，Facebook 宣布计划创建一种新加密货币**Libra**，该货币将基于开源的**Libra Blockchain**。Facebook
  的目标是让**Libra**惠及其 20 亿多用户，他们可使用 Facebook 应用进行收付款。该货币将由**Libra Association**管理，这是一个总部位于瑞士的非营利组织，成员包括**Visa**、**PayPal**和**Uber**等公司。**Libra**将由银行存款和短期政府证券作为储备。


  支持者谈到了**Libra**可能带来的益处。它将几乎不收取交易费——这对全球许多无银行账户或无法接触金融系统的人而言是潜在福音。它将把加密货币和区块链技术带入主流，同时保持在华尔街和央行控制之外。Facebook
  高管将其描绘为一种有利于用户而非机构的新系统。





  "感觉是时候建立一个更好的系统了," Facebook 区块链技术研究负责人大卫·马库斯说。"这可能会给整个世界带来深远的变革。"


  然而,仅仅几个月内,Facebook 的天秤币就陷入了麻烦。政府官员对该项目态度冷淡,而监管机构则以 Facebook 臭名昭著的隐私问题为由对其进行批评。其他人质疑科技公司能否承担如此巨大的责任。在他们看来,天秤币的诞生似乎是一种傲慢的表现。


  "我认为 Facebook 对金融系统如何以及为何运作一无所知,这实在是太不同寻常了," 科技界资深人士哈尔西·迈纳在一次会议上表示。"没有人想持有非本国的货币。外面没有哪怕一个会说''给我一种新货币''的人。"


  迈纳将 Facebook 比作中国、俄罗斯和伊朗等国家,这些国家正在寻求美元体系之外的金融系统。纽约州众议员尼迪娅·贝拉斯奎兹指出,一家以"快速行动,打破陈规"为座右铭的公司,可能不是新货币的最佳来源。"扎克伯格先生,我们不想打破国际货币体系,"
  她说。


  扎克伯格本人似乎也因天秤币遭遇的激烈反响而感到谦卑。他告诉美国国会,货币的管理将掌握在一个协会手中。最耐人寻味的是,他承认:"我确信人们希望提出这个想法的不是
  Facebook,而是任何其他人。"


  ![](img/GettyImages-1150486341.jpg)


  Facebook 创始人马克·扎克伯格于 2018 年 5 月 1 日在一次峰会上发言。他认为天秤币能将加密货币带入主流视野。


  随着反弹声浪高涨,万事达卡等合作伙伴开始退出。Facebook 公开表示可能不得不推迟天秤币的发布。开发者声称该系统将在陌生人之间建立信任,但因科技公司失去了公众信任,该系统正面临严格审查。


  然而,世界上的其他权力掮客注意到了 Facebook 的努力。他们决心不甘落后。在中国,加密货币曾被禁止,因为中央政府不希望金融系统在其控制之外运行。然而,中国国家主席习近平表示,区块链对未来至关重要,中国在区块链发展中发挥作用至关重要。


  他的言论公开后不久,中国甚至与区块链松散相关的股票也急剧上涨。事实上,七十多家公司的股票因触及每日涨跌幅限制而不得不停牌。政府迅速发布声明,称投资者不应盲目推高每一家区块链相关公司的股价。


  "区块链的未来已来,但我们需要保持理性," 政府机关报《人民日报》报道称。


  ## 中本聪怎么样了?


  当世界跟上他们关于加密货币和区块链的想法时,中本聪依然大多保持沉默和隐身。事实上,自 2011 年 12 月以来,中本聪基本上已经消失了。2014 年 3 月
  6 日,他们发送了一条简单的五词信息——"我不是道里安·中本聪。" 这是指一位名为道里安·中本聪的前 CIA 计算机程序员,他住在洛杉矶,因名字相同而被媒体追逐,被视为比特币的创始人。那是真正的中本聪最后一次公开发声。


  许多人推测中本聪为何退出公众视野。最明显的原因是中本聪可能身价数十亿美元,因此成为罪犯的目标。另一个原因是中本聪希望将尽可能多的关注集中在他们的创造物——比特币上,以使系统变得更安全、更受信任。最后,中本聪可能担心坐拥法币体系的政府、国家和金融家的集体力量。考虑到比特币可能对该体系构成的威胁——以及它对罪犯、贩毒者和恐怖分子等非国家行为体的用处——中本聪保持匿名或许是明智之举。


  此后,有几个人站出来声称自己是中本聪。其中最著名的是澳大利亚计算机程序员克雷格·赖特。


  2015 年,《连线》杂志宣布克雷格·赖特极有可能是神秘的中本聪本人。《连线》报道称,其秘密收到的泄露信息——包括电子邮件和信托协议——表明赖特就是中本聪。《连线》发表了调查结果,但也警告道:"要么赖特发明了比特币,要么他是一个极其高明的骗子,非常希望我们相信是他发明的。"


  他是怎么想出这个名字的? 赖特告诉《经济学人》,富永仲基是一位十七世纪的日本哲学家、商人和自由思想家,他对自己的社会持强烈批评态度。


  然而,发表报道几周后,《连线》指出出现了一些令人不安的不一致之处。据《连线》称,赖特虚假陈述了他的教育资历,并回溯博客文章的日期,使其看起来像是他一直参与创建比特币。


  怀疑者想知道,如果赖特真的是中本聪,为什么不直接拿出中本聪的私钥? 只有中本聪拥有它。此外,如果中本聪不是赖特,他们一直保持沉默。自从澄清道里安·中本聪事件以来,再没人听到过他们的消息。


  ![](img/GettyImages-633701262.jpg)


  2019 年,自称中本聪的克雷格·赖特起诉了几个称他为骗子的人,包括以太坊创始人维塔利克·布特林。


  ## 乏味


  也许中本聪想像他的加密货币一样:正常——甚至乏味。在 2018 年价值暴跌近 75% 后,比特币违背了大多数预期,再次开始上涨。催化剂似乎是世界上最重要的央行——美联储——货币政策的突然转变。2019
  年 1 月,美联储宣布将开始放宽货币政策,因为经济走弱,投资者变得紧张。


  新政策通常鼓励投资者购买风险较高的资产。到 5 月底,比特币价格翻了一番多。其他加密货币也受益。那年莱特币到 5 月上涨了 290%。以太坊上涨了 110%。


  "加密寒冬已去," 一位区块链和加密货币投资者说。


  ![](img/GettyImages-699097867.jpg)


  尽管加密货币具有去中心化的特性,但它们与经济其他部分的涨跌以及银行和传统证券交易所等金融机构息息相关。2018 年,纽约证券交易所的运营商宣布将创建自己的加密货币交易所。


  专注于区块链和加密货币的《麻省理工科技评论》副编辑迈克·奥库特持更乐观的态度。"2019 年,区块链将开始变得乏味," 他写道。"在 2017 年的加密货币大牛市和
  2018 年的惨烈崩盘之后,区块链技术在 2019 年不会制造太大声响。但它将变得更有用。"


  据网站 99Bitcoins 统计,2018 年出现了九十三篇宣称比特币死亡的"讣告"。现在很明显,作者们夸大了这些"死亡"。数字货币已成为金融和社会版图的一部分。事实上,正如奥库特文章所言,比特币和区块链已变得近乎正常,或者说"乏味"。


  2019 年 10 月,彼得森国际经济研究所举办了一场研讨会,探讨一个关键问题:"数字时代货币的未来是什么?"


  经济学家马丁·沃尔夫指出,这些讨论中有一个想法让他印象特别深刻。也许数字货币是央行——换句话说,就是政府——重申其在全球经济中角色的机会。




  “正如互联网最终演变成了加强政府控制的源泉，而非更大自由的源泉……数字货币革命可能允许央行用自己的负债取代私人银行的负债，”沃尔夫写道。“通过这种方式，目前由私人银行享有的铸币税收益将转回给纳税人。”


  加密货币曾被视为一种脱离中心化控制的新型独立货币形式，实际上却可能被新一代厌倦了私人市场滥用权力的公民纳入政府管辖。很难想象比这更具讽刺意味的加密货币革命结果了。



