    Through this agreement, the volume of Bitcoin transactions doubled. However, another
    group sought an even higher threshold. On August 1 a new cryptocurrency was introduced:
    Bitcoin Cash. This currency represented a hard fork from Bitcoin, and thus the
    two currencies were mutually incompatible. Worse, the agreement to increase Bitcoin’s
    capacity ultimately collapsed in November 2017 when a necessary consensus could
    not be met.


    To some observers, the angry debate, the inability to agree, and the chaotic proposed
    solutions proved that cryptocurrencies were too unstable and unmanageable. But
    others concluded just the opposite. Bitcoin and the blockchain ledger had proven
    to be enduring. It couldn’t be changed, even by powerful participants with significant
    resources.


    # Chapter 4: Crypto Winter


    As cryptocurrency prices rose, more financial experts and economists attacked
    the very notion of a cryptocurrency. Economist and Nobel laureate Paul Krugman
    said that, contrary to what many seemed to believe, Bitcoin represented not the
    future of money but a three-hundred-year step backward. “Cryptocurrencies have
    no backstop, no tether to reality,” he wrote. “If speculators were to have a collective
    moment of doubt, suddenly fearing that Bitcoins were worthless, well, Bitcoins
    would become worthless.”


    ![](image/GettyImages-461807168.jpg)


    Paul Krugman’s prediction that Bitcoins are susceptible to the same trust issues
    as those that afflict fiat currencies seemed to come to pass during the so-called
    crypto winter.


    Others noted that investors had given cryptocurrencies two tasks that were impossible
    to accomplish at the same time. On one hand, speculators were hoping cryptocurrencies
    would gain value as they attracted attention. On the other, cryptocurrencies were
    supposed to be a medium of exchange that could buy pizza, a sweater, and a car.
    But people wouldn’t make small purchases such as these using their very valuable
    cryptocurrency balances. As financial journalist Dan McCrum observed, “No one
    uses gold bars from the safe for petty cash.”


    Legendary investor and billionaire Warren Buffett dismissed cryptocurrencies as
    “rat poison squared,” and his partner Charlie Munger added that cryptocurrency
    trading was “just dementia.”


    Crypto investor Marc Andreessen gave a sharp response: “I think rich, old white
    men crapping on technology that they don’t understand can be counted on to be
    wrong roughly 100 percent of the time.”


    As if to prove the critics right, Bitcoin prices began to fall in early 2018 and
    then entered a rout. By spring the price had plunged from a high near $20,000
    to below $7,500. By the end of the year, it had sunk below $4,000. While Bitcoin
    had still delivered extraordinary returns for those who had gotten in early, many
    investors who joined in 2017 were left whiplashed. Most investors who snapped
    up ICOs ended up with catastrophic losses.


    Columnist Lionel Laurent saw the drop in cryptocurrencies as a revolt of sorts
    against an elitist project. “It marks the general public’s resistance to the ideological
    techno-utopia promised by Bitcoin evangelists. The decentralization they promise
    remains a niche, even elite, pursuit,” he wrote.


    “Blockchain became a solution for everything—blockchain for journalism, for [marijuana],
    for dentists,” New York Times journalist Nellie Bowles observed. “At the kernel
    of it all was real technological progress and a growing understanding that this
    decentralized technology could transform financial systems. But the excitement
    spun out of control.”


    As cryptocurrencies crashed and critics pounced, a new phrase circulated among
    investors: “crypto winter.” By March 2019, Bitcoin had dropped about 80 percent
    from its $19,800 peak in December 2017. Ether had fallen from a high of $1,400
    in January 2018 to just $130 a year later. The market value of cryptocurrencies
    together was down about 85 percent. Initial coin offerings in 2018 raised $12
    billion, but in the first three months of 2019, that number was a meager $177
    million.


    ![](image/shutterstock_1561526074.jpg)


    During the crypto winter, Bitcoin values fell as much as 80 percent from their
    previous peak.


    The naysayers had waited for this moment and did not pull punches. “If the crypto
    faithful devoted as much energy to real innovation,” one newspaper columnist quipped,
    “who knows where we might be as a civilization by now.”


    Remember cryptokitties, the lovable cat images that were unique and commanded
    hefty prices? The median price of a unique image reached $41 in March 2018 but
    had dropped closer to $5 by summer. The transaction volume declined from 1.3 million
    in December to 115,000 in May. A year later, the site attracted just a few hundred
    users a day. The cryptokitty named Dragon remained for sale—for about $160,000
    in Ether—but couldn’t find a buyer.


    A New York Times reporter went to South Korea to report on the dirty spoons who
    had dreamed of escaping their situation through cryptocurrencies. Les Mis still
    owned his Rolls Royce, but many others had lost vast fortunes and were ashamed
    to tell those closest to them. One cryptocurrency user, Kim Ki-Won, had made enough
    to quit his job and spend $1,000 each month on “whatever he wanted.” Kim hunched
    over when he discussed losing tens of thousands of dollars, but he was also defiant:
    “I have nothing to lose. I have always wanted to be rich.”


    ## Lunch with Buffett


    Every year, Warren Buffett auctions off the opportunity to have lunch with him.
    Businesspeople, investors, and portfolio managers eagerly bid for the opportunity
    to sit with the legendary investor and genius to pitch him their ideas. The winning
    bid is donated to charity.


    In 2019 the winning bid was a shock. Justin Sun, the founder of cryptocurrency
    TRON, won the lunch for $4.6 million. The surprise came because Buffett had sharply
    criticized cryptocurrency trading. The twenty-eight-year old Sun, however, was
    thrilled, calling it a “big win” for blockchain. “I’m excited to talk to Warren
    Buffett about the promise of blockchain and to get valuable tips from him on entrepreneurship
    and making bold bets on the future,” Sun stated. They had their lunch in January
    2020.


    ![](image/GettyImages-849890606.jpg)


    Warren Buffett is the fourth-wealthiest person in the world with a net worth of
    $88.9 billion.


    Even the most die-hard supporters of cryptocurrencies admitted the environment
    was grim. Confident talk about disrupting the global financial system was replaced
    by a more pragmatic focus on survival. “The markets can stay irrational longer
    than you can stay solvent,” says an old investing adage. For cryptocurrency investors,
    the goal was to avoid going out of business before the next upswing came.


    And that upswing had always come. Cryptocurrencies, after all, had been volatile.
    Some cryptocurrency supporters insisted the latest declines were part of a natural
    evolution. “It’s painful to lose money, but it’s a necessary step,” said investor
    Robert Neivert. “2018 was about moving hype to product.”


    Some noted that at least lawyers were still getting rich. As assets crashed, angry
    investors turned to the courts. “Now that the market dropped,” said a law student,
    “everyone is getting sued.”


    The Financial Times spotted documents related to a failed ICO on eBay. The reporter
    called up the founder of the failed coin offering, a young man barely into his
    twenties, and asked him what happened. “We hired a lawyer and that was a big mistake
    for us,” the founder said. “Because our lawyer basically told us that we should
    not launch any ICO before we built a real product that might have some users.
    And I asked him why, because I saw so many ICOs out there who did not have any
    idea for any product, yet they managed to raise tens of millions of dollars.”


    The reporter called this a summary of “all that was wrong with the Great Crypto
    Bubble of 2017–2018.”

    '
  trans: '

    通过这项协议，比特币交易量翻了一番。然而，另一派人士寻求更高的区块容量上限。8 月 1 日，一种新的加密货币诞生了：比特币现金。这种货币代表了比特币的一次硬分叉，因此这两种货币互不兼容。更糟的是，增加比特币容量的协议最终于
    2017 年 11 月破裂，因为未能达成必要的共识。


    对一些观察家而言，愤怒的辩论、无法达成一致以及混乱的提议解决方案证明了加密货币过于不稳定且难以管理。但其他人得出了截然相反的结论。比特币和区块链账本已被证明经久不衰。它无法被篡改，即使是拥有大量资源的强大参与者也无法做到。


    # 第 4 章：加密寒冬


    随着加密货币价格上涨，更多金融专家和经济学家抨击加密货币的概念本身。经济学家、诺贝尔奖得主保罗·克鲁格曼表示，与许多人似乎相信的相反，比特币代表的不是货币的未来，而是倒退了三百年。“加密货币没有后盾，没有与现实的系绳，”他写道。“如果投机者集体产生一刻怀疑，突然担心比特币一文不值，那么比特币就会变得一文不值。”


    ![](img/GettyImages-461807168.jpg)


    保罗·克鲁格曼关于比特币易受信任问题困扰的预测——这与法定货币的顽疾如出一辙——似乎在所谓的“加密寒冬”期间应验了。


    其他人指出，投资者赋予加密货币两项不可能同时完成的任务。一方面，投机者希望加密货币随着关注度的增加而增值。另一方面，加密货币本应是一种交换媒介，可用于购买披萨、毛衣和汽车。但人们不会用他们极其宝贵的加密货币余额进行此类小额购买。正如金融记者丹·麦克拉姆所观察到的：“没人会用保险箱里的金条当零花钱。”


    传奇投资者、亿万富翁沃伦·巴菲特将加密货币斥为“老鼠药的平方”，他的合伙人查理·芒格补充说，加密货币交易“纯粹是痴呆症”。


    加密货币投资者马克·安德森给予了犀利的回应：“我认为富有的、年老的白人男性对他们不理解的技术大加贬低，这种行为大概有 100%的概率是错的。”


    仿佛要证明批评者是正确的，比特币价格于 2018 年初开始下跌，随后陷入崩盘。到了春天，价格从接近 20,000 美元的高点暴跌至 7,500 美元以下。到年底，已跌破
    4,000 美元。虽然比特币仍为早早入场者带来了非凡回报，但许多 2017 年入场的投资者遭受了剧烈震荡。抢购 ICO（首次代币发行）的大多数投资者最终遭遇了灾难性损失。


    专栏利昂内尔·劳伦特将加密货币的下跌视为一种针对精英主义项目的反叛。“这标志着公众对比特币布道者所承诺的意识形态式技术乌托邦的抵制。他们承诺的去中心化仍是一个小众的、甚至是精英的追求，”他写道。


    “区块链成了万物的解决方案——给新闻业用区块链，给[大麻]用区块链，给牙医用区块链，”《纽约时报》记者内莉·鲍尔斯观察道。“这一切的核心是真正的技术进步，以及对这种去中心化技术能够变革金融系统的日益增长的认识。但狂热失控了。”


    随着加密货币崩盘、批评者群起攻之，投资者中流传起一个新词汇：“加密寒冬”。到 2019 年 3 月，比特币较 2017 年 12 月 19,800 美元的峰值下跌了约
    80%。以太币从 2018 年 1 月 1,400 美元的高点跌至一年后的仅 130 美元。加密货币总市值下跌了约 85%。2018 年 ICO 融资额达
    120 亿美元，但 2019 年前三个月，这一数字微薄至 1.77 亿美元。


    ![](img/shutterstock_1561526074.jpg)


    在加密寒冬期间，比特币价值较先前峰值下跌了多达 80%。


    唱衰者等待已久，毫不留情。“如果加密货币信徒将同样多的精力投入到真正的创新中，”一位报纸专栏作家讽刺道，“谁知道我们的文明现在会发展到什么地步了。”


    还记得加密猫吗？那些独一无二、身价不菲的可爱猫咪图片？单张独特图片的中位价格在 2018 年 3 月达到 41 美元，但到了夏天已跌近 5 美元。交易量从
    12 月的 130 万笔下降至 5 月的 11.5 万笔。一年后，该网站每天仅吸引几百名用户。名为“巨龙”的加密猫仍挂牌出售——约合 16 万英镑的以太币——却寻不到买家。


    一名《纽约时报》记者前往韩国，报道那些梦想通过加密货币摆脱困境的“脏勺子”阶层。Les Mis 依然拥有他的劳斯莱斯，但许多其他人损失了巨额财富，羞于向最亲近的人启齿。一位加密货币用户金基元曾赚得足以辞职，并每月花费
    1000 美元购买“想要的任何东西”。谈到损失数万美元时，金基元弓着腰，但他也很倔强：“我没什么可失去的。我一直想当富人。”


    ## 与巴菲特共进午餐


    每年，沃伦·巴菲特都会拍卖与他共进午餐的机会。商界人士、投资者和投资组合经理争相竞价，只为有机会与这位传奇投资者兼天才共坐，向他推销自己的想法。中标款项将捐赠给慈善机构。


    2019 年的中标价令人震惊。加密货币 TRON 的创始人孙宇晨以 460 万美元中标。之所以令人惊讶，是因为巴菲特曾严厉批评加密货币交易。然而，年仅 28
    岁的孙宇晨却欣喜若狂，称这是区块链的“大胜利”。“我非常期待与沃伦·巴菲特探讨区块链的前景，并从他在创业和对未来大胆押注方面获得宝贵建议，”孙宇晨表示。他们于
    2020 年 1 月共进了午餐。


    ![](img/GettyImages-849890606.jpg)


    沃伦·巴菲特以 889 亿美元的净资产位列世界第四大富豪。


    即使是最铁杆的加密货币支持者也承认环境严峻。关于颠覆全球金融系统的自信言论被对生存的务实关注所取代。“市场保持非理性的时间比你保持偿付能力的时间更长，”这是一句古老的投资格言。对加密货币投资者而言，目标是在下一次上涨周期到来前避免倒闭。


    而那次上涨向来都会到来。毕竟，加密货币一直波动剧烈。一些加密货币支持者坚持认为，最近的下跌是自然演变的一部分。“亏钱很痛苦，但这是必要的一步，”投资者罗伯特·奈维特说。“2018
    年是从炒作走向产品的一年。”


    也有人指出，至少律师们还在发财。随着资产崩盘，愤怒的投资者转向法院。“现在市场跌了，”一名法学院学生说，“人人都在被起诉。”


    《金融时报》在 eBay 上发现了与一个失败的 ICO 相关的文件。记者联系上了那个失败代币发行的创始人，一个刚过二十出头的年轻人，询问发生了什么。“我们聘请了一名律师，这对我们来说是个大错，”创始人说。“因为我们的律师基本上告诉我们，在我们构建出一个可能拥有一些用户的真实产品之前，不应该发行任何
    ICO。我问他为什么，因为我看到那么多 ICO 根本没有任何产品构想，却设法筹集了数千万美元。”


    记者称这总结了“2017-2018 年大加密泡沫的一切弊端”。

    '
