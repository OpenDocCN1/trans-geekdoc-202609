  trans: '


    ## DAO 攻击及其后果


    对于加密货币拥护者而言，硬分叉表明区块链本身并不代表其创始人所宣称的那种自由：一个去中心化、万无一失、超越任何个人或政府权威的系统。“以太坊可以回滚这一事实意味着，所有比比特币规模更小的区块链本质上都是由其运营者控制的中心化数据库，”《比特币标准》作者
    Saifedean Ammous 写道。


    这场争议导致了两条并行区块链的出现：以太坊和以太坊经典。在以太坊上，资金被退还给了投资者。在以太坊经典上，窃贼保留了被盗的 DAO 代币。


    DAO 攻击动摇了区块链支持者的信心。但也有人认为这在意料之中。这甚至是正常的。区块链支持者指出了 2008 年金融体系的混乱。那难道不更糟吗？他们指出了一系列无休止的交易丑闻，在这些丑闻中，个人操纵市场并导致金融公司倒闭。金钱和财富的集中总是会吸引窃贼。


    因此，在这些不可避免的跌跌撞撞中，他们看到了希望。每当新的、创新的系统推出时，错误都会发生。互联网的推出伴随着无休止的批评，声称它永远不会普及，安全性或其他问题将是不可逾越的障碍。但这些挑战吸引了资源和智慧来解决它们。在支持者眼中，区块链也是如此。


    市场给出了自己的判决。攻击发生后的九个月里，以太坊交易价格徘徊在 10 美元左右。随后，它与其他加密货币一起飙升，于 2018 年初达到 1250 美元以上的峰值。随后加密货币崩盘，以太币跌至约
    100 美元。截至 2019 年 5 月，其交易价格约为 230 美元。以太坊经典交易价格约为 7 美元。


    ## QuadrigaCX 倒闭事件


    2018 年 12 月，随着关于加密货币易受黑客攻击和盗窃的消息传播，另一件令人不安的事件发生了。加密货币交易所 QuadrigaCX 的联合创始人兼首席执行官
    Gerald Cotten 据称因克罗恩病相关并发症在印度去世。Cotten 年仅三十岁。Cotten 的遗孀 Jennifer Robertson 称，交易所上的加密货币（价值约
    1.37 亿美元）存放在离岸账户中，无法访问，这一消息让 Quadriga 的 11.5 万用户震惊。这些账户只能通过 Cotten 的笔记本电脑访问，且只有
    Cotten 知道密码。


    2019 年 2 月 5 日，该公司宣布破产。审计师访问了据称持有加密货币的数字钱包，却一无所获。所有数字现金已于 2018 年从钱包中转出。部分账户被发现是虚假的。


    当十万多名 Quadriga 用户担心能否追回资金时，关于 Cotten 的数十种阴谋论在互联网上交织流传。一种猜测他伪造了死亡并躲藏起来。另一种称他确实死了，但
    Quadriga 始终是一个巨大的庞氏骗局。


    ![](img/shutterstock_1018094104.jpg)


    在这幅图中，一个欺诈性的加密货币交易所（红色）从新投资者（蓝色）那里收到资金，并用这些钱支付给自己和早期投资者（黑色）。早期投资者并未怀疑自己受骗，但新投资者要等到更新的投资者到来才能看到投资回报。这种欺诈被称为庞氏骗局。


    对于寻找理由不信任加密货币的投资者来说，此案提供了充足的素材。然而，最令人不安的是该公司历史中的一个细节。据《华尔街日报》报道，2017 年 6 月，该公司升级软件时，在一个“无法访问的钱包”中丢失了
    67,000 枚以太币。当时损失价值 1400 万美元，交易所承诺将赔偿受影响的客户。然而，由于以太币在此期间增值，损失已膨胀至 9000 万美元。如果软件更新中的一个故障就能让钱凭空消失，那么加密货币可能比其支持者声称的要不安全得多。


    ## 区块链面临的挑战


    区块链常常被那些对其运作原理知之甚少的人所轻视。但随着惨败事件不断增加，更有见地的批评也随之出现。


    网络安全专家 Bruce Schneier 指出，如果区块链支持者希望其与政府和银行竞争，那么许多人就必须信任技术而非机构。正如 2008-2009 年全球金融危机所证明的——历史提供了更多例子——机构会失效。但技术，以及使用技术的人，也会失效。事实上，Schneier
    列举了用户丢失基于区块链的加密货币的多种方式。


    > “如果你的比特币交易所被黑客攻击，你会损失所有资金，”Schneier 说道。“如果你的比特币钱包被黑客攻击，你会损失所有资金。如果你忘记了登录凭证，你会损失所有资金。如果你的智能合约代码中存在漏洞，你会损失所有资金。如果有人成功攻破了区块链安全，你会损失所有资金。”


    作为回应，几家公司成立以应对区块链的安全威胁。最常见的方法也是最直观的：在智能合约上线前对其进行严格审计。这些审计应能发现大多数可能导致安全漏洞的编码错误和
    Bug。其他公司则开发了被称为“漏洞赏金”的智能合约。如果个人发现并报告漏洞，将获得奖励。


    但迄今为止，这些解决方案似乎都很复杂、昂贵、耗时且有限。毕竟，智能合约还处于起步阶段。它们面对的也是一个演化了数百万年的系统：人性。正如彭博专栏作家 Noah
    Smith 所总结的：“区块链所有的技术巫术都无法战胜好老式的人类不诚实。”


    然而，其他批评者则关注区块链技术本身固有的缺陷，因此认为它没有用处——尤其是与加密货币支持者所宣称的潜力相比。


    在一篇博客文章中，资深技术人员 Kai Stinchcombe 指出，区块链吸引了大型、信誉良好公司的兴趣和所谓的投资。但他表示，这些“企业吹捧者”“在宣传上投入巨大，在实际部署上却极少”。他指出，区块链公司
    Ripple——其负责人身价一度超过 Facebook 创始人 Mark Zuckerberg——自身并不使用区块链。“你没看错，”他在博文中写道。“Ripple
    公司决定跨境转账的最佳方式是不使用 Ripple 币。”


    Stinchcombe 的批评相当直白。结果表明，区块链无法成功应用于现实世界的问题。他指出，2006 年，沃尔玛曾尝试追踪单根香蕉和芒果从农场树木到商店货架的流转。该尝试因难以让供应链上的每个人录入数据而失败。十年后，沃尔玛再次尝试，这次使用了区块链。在
    Stinchcombe 看来，问题和解决方案的构想本身就荒谬。如果芒果采摘工不喜欢将农产品信息录入数据追踪系统，解决方案不是“让我们创建一长串小文件，每个文件都包含前一个文件的哈希值”。


    “人们把区块链当成‘未来的完整性魔杖’，”Stinchcombe 写道。“对着问题挥一挥区块链，你的数据突然就有效了。对于人们想要验证的几乎所有事物，区块链都被提议作为解决方案。”


    Stinchcombe 总结道，现实是没有人真正将区块链作为解决方案使用过。“不存在这样的人：他有一个想要解决的问题，发现可用的区块链解决方案是最佳解决途径，因此成为了一名区块链爱好者。”


