    # Further Information


    Day, Mark Stuart. Bits to Bitcoin: How Our Digital Stuff Works. Cambridge, MA:
    MIT Press, 2018. This book describes the digital infrastructure (software) beneath
    our operating systems and explains how blockchain allows different parties to
    trust one another.


    Gilder, George. Life after Google: The Fall of Big Data and the Rise of the Blockchain
    Economy. Washington, DC: Regnery Gateway, 2018. A far-reaching description of
    the tech world today as dominated by Google, and why blockchain will replace it.


    Lewis, Antony. The Basics of Bitcoins and Blockchains: An Introduction to Cryptocurrencies
    and the Technology That Powers Them. Coral Gables, FL: Mango, 2018. As the title
    implies, this is a no-nonsense introduction to cryptocurrencies and the blockchain
    technology that allows them to function.


    Malekan, Omid. The Story of the Blockchain: A Beginner’s Guide to the Technology
    Nobody Understands. Syosset, NY: Triple Smoke Stack, 2018. This book explains
    in very simple terms how cryptocurrencies were created, how they have evolved,
    and the crises they have faced throughout their short history.


    Tapscott, Don, and Alex Tapscott. Blockchain Revolution: How the Technology behind
    Bitcoin Is Changing Money, Business, and the World. New York: Penguin, 2016. Read
    about the implications of Bitcoin and blockchain technology in all aspects of
    the economy and society.


    Vigna, Paul, and Michael J. Casey. The Truth Machine: The Blockchain and the Future
    of Everything. New York: St. Martin’s, 2018. This is an in-depth exploration of
    blockchain and how it enables strangers to enter into agreements without an intermediary.


