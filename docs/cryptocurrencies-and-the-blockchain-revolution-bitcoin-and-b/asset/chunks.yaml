    # 更多信息


    Day, Mark Stuart. *Bits to Bitcoin: How Our Digital Stuff Works*. Cambridge, MA:
    MIT Press, 2018. 本书描述了我们操作系统之下的数字基础设施（软件），并解释了区块链如何让不同参与方相互信任。


    Gilder, George. *Life after Google: The Fall of Big Data and the Rise of the Blockchain
    Economy*. Washington, DC: Regnery Gateway, 2018. 深远描述了当今由 Google 主导的科技世界，以及为何区块链将取而代之。


    Lewis, Antony. *The Basics of Bitcoins and Blockchains: An Introduction to Cryptocurrencies
    and the Technology That Powers Them*. Coral Gables, FL: Mango, 2018. 顾名思义，这是一本关于加密货币及使其运行的区块链技术的不废话入门指南。


    Malekan, Omid. *The Story of the Blockchain: A Beginner’s Guide to the Technology
    Nobody Understands*. Syosset, NY: Triple Smoke Stack, 2018. 本书用非常简单的术语解释了加密货币是如何创建、如何演变，以及在其短暂历史中面临的危机。


    Tapscott, Don, and Alex Tapscott. *Blockchain Revolution: How the Technology behind
    Bitcoin Is Changing Money, Business, and the World*. New York: Penguin, 2016.
    阅读关于比特币和区块链技术在经济和社会各方面的影响。


    Vigna, Paul, and Michael J. Casey. *The Truth Machine: The Blockchain and the
    Future of Everything*. New York: St. Martin’s, 2018. 这是对区块链及其如何使陌生人能够在没有中介的情况下达成协议的深入探索。


