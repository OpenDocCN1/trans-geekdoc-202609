    to Understanding Blockchain, trans. Jie Liu, (New York: Skyhorse, 2018), 9.


    13, 15 Nathan Heller, “Estonia, the Digital Republic,” New Yorker, December 11,
    2017, <https://www.newyorker.com/magazine/2017/12/18/estonia-the-digital-republic>.


