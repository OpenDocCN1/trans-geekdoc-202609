    # 作者简介


    Brendan January 在华尔街担任财经作家已逾十年，也是一位屡获殊荣的作家，为青少年读者撰写了二十多部非虚构类书籍。他最近的一些作品包括 *Information
    Insecurity: Privacy under Siege*（信息不安全：隐私遭围攻）和 *ISIS: The Global Face of Terrorism*（ISIS：恐怖主义的全球面孔）。January
    曾就读于宾夕法尼亚州的哈弗福德学院和纽约的哥伦比亚大学新闻研究生院。他还是一位在德国的富布赖特学者。他与妻子和两个孩子居住在新泽西州的梅普尔伍德。


