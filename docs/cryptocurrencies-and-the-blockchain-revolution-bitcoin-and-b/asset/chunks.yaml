  trans: '

    “正如互联网最终演变成了加强政府控制的源泉，而非更大自由的源泉……数字货币革命可能允许央行用自己的负债取代私人银行的负债，”沃尔夫写道。“通过这种方式，目前由私人银行享有的铸币税收益将转回给纳税人。”


    加密货币曾被视为一种脱离中心化控制的新型独立货币形式，实际上却可能被新一代厌倦了私人市场滥用权力的公民纳入政府管辖。很难想象比这更具讽刺意味的加密货币革命结果了。


    # 时间线


    | 年份 | 月份 | 事件 |

    | :--- | :--- | :--- |

    | 2008 | 八月 | 注册 `Bitcoin.org`。 |

    | | 十月 | 发布《比特币：一种点对点的电子现金系统》。 |

    | 2009 | 一月 | 开采出第一个比特币区块（“创世区块”）。 |

    | | | 中本聪进行首笔比特币交易，向计算机程序员哈尔·芬尼发送十枚比特币。 |

    | 2010 | 五月 | 拉斯洛·汉耶茨用 10,000 枚比特币兑换两个价值 25 美元的披萨。 |

    | | 七月 | 比特币价值升至一美分以上。 |

    | | | Mt. Gox 开业。 |

    | 2011 | 一月 | 丝绸之路暗网市场上线。 |

    | | 二月 | 比特币价值达到与一美元平价。 |

    | 2012 | 四月 | 比特币价值升至 100 美元以上。 |

    | 2013 | 五月 | 首台比特币 ATM 在加利福尼亚州圣地亚哥开始运营。 |

    | | 十月 | FBI 关闭丝绸之路暗网。 |

    | | 十一月 | 比特币价值升至 1,000 美元以上。 |

    | | | 维塔利克·布特林撰写以太坊白皮书。 |

    | 2014 | 二月 | 经过多年盗窃事件，Mt. Gox 交易所倒闭。 |

    | 2015 | 七月 | 以太坊网络上线。 |

    | 2016 | 二月 | 推出 Bitcoin Classic。 |

    | | 四月 | The DAO 上线，随后遭黑客攻击。 |

    | 2017 | 八月 | 推出比特币现金。 |

    | | 十二月 | 比特币升至 10,000 美元以上。 |

    | | | 比特币价值触及 19,783 美元峰值。 |

    | 2018 | 一月 | 比特币价格跌至低至 9,199.59 美元，较峰值腰斩，随后几个月进一步跌破 4,000 美元。 |

    | | 六月 | 瑞士楚格测试区块链技术用于投票。 |

    | | 十一月 | 俄亥俄州成为美国首个接受比特币缴税的州。 |

    | | 十二月 | 加密货币交易所 QuadrigaCX 的杰拉德·科滕据报在印度去世。 |

    | 2019 | 一月 | 以太坊经典遭受 51% 攻击。 |

    | | 二月 | 加密货币交易所 QuadrigaCX 破产。 |

    | | 五月 | 亚马逊和巴诺书店等在线零售商开始接受加密货币。 |

    | | 六月 | Facebook 宣布其加密货币 Libra。 |

    | | | 加密货币 TRON 创始人孙宇晨出价 460 万美元竞得与沃伦·巴菲特共进午餐。 |

    | 2020 | 一月 | 孙宇晨与沃伦·巴菲特共进午餐。 |

    | 2140 | | 最后一枚比特币将被开采完毕。 |


    # 词汇表


    **替代币**："Bitcoin alternative"（比特币替代品）的缩写，适用于流通中的各种数字货币，其中许多是比特币的分叉，仅对工作量证明进行了微小更改。


    **区块**：记录在区块链网络上的数据文件，包含部分或全部新区块链交易的记录。新区块通过密码学与链的其余部分相连，若不改变链的其余部分，任何区块均无法被篡改。


    **区块链**：一种去中心化的数字账本，记录不可在未经大多数参与者共识的情况下更改。交易被记录并加盖时间戳存入“区块”，这些区块通过密码学链接在一起。


    **加密货币**：基于区块链的货币，利用密码学和去中心化系统来佐证和验证交易。


    **Dapp（去中心化应用）**：一种去中心化、开源、自主的应用程序，所有记录均存储在区块链上。它可以分发代币。


    **以太坊**：一个开源软件平台，利用区块链技术使开发者能够编写智能合约，并构建和部署 Dapp。


    **法定货币**：实物货币，如纸币或硬币。


    **分叉**：区块链分裂为两个共享区块的同时存在版本。社区决定使用哪个版本，被弃用的版本成为孤儿链。


    **硬分叉**：区块链规则的更改，要求所有用户适应该变更。


    **首次代币发行 (ICO)**：通过区块链进行众筹，创意、个人和项目通过分发币或代币寻求支持。


    **中介**：参与交易流程但非卖方或买方的个人或组织。


    **挖矿**：去中心化网络上的矿工向区块链添加区块的过程。


    **节点**：区块链网络上存储账本副本的计算机。


    **私钥**：加密货币钱包用户进行区块链交易所需的随机生成数字。


    **证券**：一种金融资产，通常以股票或债券的形式存在，可进行交易。


    **智能合约**：一种无需第三方即可验证和强制执行合同条款的协议。


    **软分叉**：区块链规则的更改，仅使旧区块失效。


    **代币**：通常基于区块链的可交换数字资产。可用于支付协助区块链运行的参与者。


    # 来源注释


    9 Martin Wolf, “The Libertarian Fantasies of Cryptocurrencies,” Financial Times,
    February 3, 2019, <https://medium.com/financial-times/the-libertarian-fantasies-of-cryptocurrencies-f514cc16bcd1/>.


