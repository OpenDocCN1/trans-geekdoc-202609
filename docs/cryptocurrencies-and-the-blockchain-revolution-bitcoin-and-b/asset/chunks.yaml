    # Bitcoin、以太坊与加密货币的崛起


    随着比特币日益流行，一位名为 Vitalik Buterin 的俄裔加拿大青年对将区块链技术应用于更广泛的交易领域产生了浓厚兴趣。Buterin 是车臣共和国格罗兹尼的一位计算机科学家之子，该共和国位于俄罗斯西南部，在
    1990 年代俄罗斯军队与分离主义者进行残酷巷战时几乎被夷为平地。Buterin 六岁时随父移民加拿大，继承了父亲对政府及其可能造成的破坏的深恶痛绝。


    Buterin 对《纽约客》记者表示：“我把与政府监管或企业控制相关的一切都视为纯粹的邪恶，并假设这些机构里的人有点像伯恩斯先生[《辛普森一家》中荷马·辛普森贪婪的老板]，坐在办公桌后面说：‘太棒了。这次我怎么能坑一千个人？’”


    Buterin 还被创建新型去中心化系统的那些人所吸引。他说：“他们的早期履历（如果有履历的话）都在开源领域——Linux、Mozilla 和密码朋克邮件列表。我发现，像我这样仅仅几千个人就能从无到有地重建这一基本社会制度，这让我感到无比振奋。”


    Buterin 赞赏比特币，但他希望做的不仅仅是基于数字货币处理交易。他想创建一个能够完成任务的点对点网络。这些任务在被称为“智能合约”的协议中规定。


    智能合约可以连接多个区块链，无需人工干预即可执行协议。智能合约可用于基于时序的担保交易，例如租房。租客以比特币支付，从而释放提供公寓访问权限的代码。如果房东未在特定时间前发送代码，比特币将退还给租客。智能合约通过去中心化的点对点网络自动验证交易的所有环节，包括房东对公寓的所有权和租客用于支付的比特币持有情况。这一过程消除了银行等中介机构，为租客和房东节省了金钱和时间。


    2015 年，Buterin 推出了以太坊平台，该平台使用一种名为 Ether（以太币）的加密货币，向点对点网络上的计算机支付费用以执行智能合约。Buterin
    将其创作描述为“去中心化应用的 Android”，因此将智能合约称为“Dapps”。他将以太坊比作一款可编程执行平台上应用（即“Dapps”）的智能手机。实际上，以太坊上的程序员获得了一台去中心化超级计算机的访问权限。


    ![](image/GettyImages-500445678.jpg)


    Buterin 于 2015 年在科技会议 TechCrunch Disrupt 上发表演讲。Buterin 于 2014 年获得 10 万美元的奖学金，用于资助以太坊的发展。


    数字货币专家 Michael Casey 和 Paul Vigna 写道：“如果它能兑现 Buterin 和其他人设想的所有功能，该系统将相当于一个全球去中心化虚拟机，它始终执行用户的编码指令，且不受任何单一计算机的控制。”


    Buterin 和许多区块链支持者希望以太坊和其他区块链平台能帮助解决一个主要问题。大多数人的互联网体验被 Google、Facebook 和 Amazon
    等大型平台所垄断。这些平台最初是人们执行“搜索”或“购买商品”等任务，或与他人/群体建立联系的场所。但随着时间的推移，这些平台似乎越来越多地在主导这些体验。通过追踪和收集数据，它们利用算法向用户投放信息和广告。更糟糕的是，它们要求用户交出个人信息才能使用平台。许多人希望区块链能消除这些中介，恢复互联网最初的承诺。


    # Chapter 3：加密货币起飞


    最初，许多人因匿名性而被比特币吸引。2011 年 2 月，Silk Road 暗网开张。它提供各种非法商品和服务，包括毒品、被盗身份和密码、武器及人口贩卖，仅接受比特币支付。当时一枚比特币价值约
    30 美分。批评家将比特币斥为罪犯和恐怖分子的首选货币，但一些投资者注意到比特币的前提成立了——它让陌生人（甚至罪犯）能够建立信任并进行交易。简而言之，比特币按其创建者的意图运行。


    这引起了关注，尤其是当比特币价格开始剧烈波动时。对投机者而言，比特币似乎是快速致富的机会。执法部门也开始调查。2013 年春，美国政府查封了 Silk Road
    暗网市场，没收了 15 万多枚比特币。


    比特币及加密货币总体上占据了政府监管机构的精力。监管机构负责执行政府规则，尤其是金融领域。当时，Airbnb 和 Uber 等基于技术的服务正在对出租车和酒店行业造成巨大冲击。出租车公司和酒店企业被迫与通过互联网直接与客户联系的司机和公寓业主竞争。


    监管机构担心金融业也会遭遇类似冲击。在会议上，他们焦虑地提问：加密货币是骗局吗？它们会对金融机构产生什么影响？加密货币会打破政府对货币的垄断吗？美国当局查封了未按联邦机构要求注册即进行交易的加密货币账户。中国也进行了打击，宣布任何金融机构不得使用加密货币（尽管公民仍可使用）。比特币价格随这些公告涨跌，但总体趋势向上。2014
    年初，比特币价值从约 13 美元飙升至每枚 770 美元。


    比特币新闻开始定期出现在新闻节目和头条中。曾以几分钱交换比特币、恳求他人关注的持有者们发了大财。比特币正式登上历史舞台。


    全球各地，加密货币吸引了看中暴富机会的人。韩国成为仅次于美国和日本的第三大加密货币市场。贫穷的韩国青年自称“脏勺子”。这个称呼源于他们与精英阶层的对比——后者因工作、财富和机会被说成含着“银勺子”和“金勺子”出生。对“脏勺子”而言，加密货币似乎是赚大钱、甚至颠覆令人窒息的社会秩序的机会。即使无法购买股票或获得创业贷款，他们也能买加密货币。


    一位名为 Remy Kim 的 29 岁“脏勺子”在社交媒体上开设加密货币频道。他初识加密货币是因黑客劫持其硬盘并勒索比特币赎金。Kim 凑齐 1.2 枚比特币（当时约合
    800 美元）支付赎金，却对加密货币产生浓厚兴趣并自行购买。随着市场上涨，他买了一辆价值 50 万美元的海军蓝劳斯莱斯。网上他化名“Les Mis”，取自音乐剧和小说《悲惨世界》，其中穷人起义推翻腐败残暴的政府。


    比特币涨势呈抛物线状。2017 年初仅略低于 1000 美元，夏季突破 4000 美元，至 12 月中旬飙升至 19000 美元以上。

