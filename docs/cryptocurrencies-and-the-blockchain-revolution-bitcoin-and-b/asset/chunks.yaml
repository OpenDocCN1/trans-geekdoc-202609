- raw: "The holder transfers the Bitcoin to another person by using their private\
    \ key. The transaction actually becomes part of the Bitcoin code and is transparent,\
    \ meaning anyone with access to a computer or smartphone can see which addresses\
    \ have owned the Bitcoin and which address owns it currently.\n\nNakamoto created\
    \ incentives for third parties to verify Bitcoin transactions. The verification\
    \ involves solving a complicated math problem—or proof of work—that requires significant\
    \ computing power and energy. The third parties, called miners, are compensated\
    \ for their work by being paid a fraction of the transaction in Bitcoin. They\
    \ also receive a block reward, or a certain quantity of newly generated Bitcoin.\
    \ The miners race to validate the transactions, and the reward goes to the miner\
    \ who completes the proof of work the fastest and most thoroughly.\n\nEach transaction\
    \ is recorded through an algorithm that takes its details—time, amounts, and sender\
    \ and recipient addresses—and converts the transaction into a string of letters\
    \ and numbers called a hash. Anyone running the information through the algorithm\
    \ will come back with the same hash. Each hash can be combined with another, resulting\
    \ in a new hash that embodies both. Thus, when a miner adds a block to the blockchain,\
    \ it is linked to a chain of hashes that go back all the way to the first, or\
    \ “Genesis,” block launched by Nakamoto on January 3, 2009.\n\n![](image/GettyImages-1020194246.jpg)\n\
    \nMany miners use cooling devices and fans to keep their computers from overheating.\
    \ In addition to using a lot of power and racking up the energy bill, mining requires\
    \ powerful processors that ordinary personal computers don’t come with.\n\nAny\
    \ alteration to the chain, no matter how insignificant, results in a completely\
    \ different hash. Consequently, the record of a transaction cannot be changed\
    \ because many independent parties have already confirmed the information. After\
    \ a miner verifies the transaction, other computers on the peer-to-peer network,\
    \ called nodes, will validate the miner’s work with the original blockchain. If\
    \ a node detects an irregularity, they will not attach a new block to it. Rather,\
    \ they will go back to an earlier part of the chain that can be trusted and attach\
    \ it there. The rejected block becomes an “orphan.” Orphans also result from situations\
    \ where two miners solve the proof-of-work problem at the same time—the network\
    \ has to choose one of the two blocks, and the rejected one becomes an orphan.\
    \ Because of this process, any blockchain user can trust the ledger’s information\
    \ because the peer-to-peer network has already confirmed it.\n\nNakamoto designed\
    \ Bitcoin so it would take about ten minutes to mine each block. Sometimes, though,\
    \ it can take just a few minutes or as long as an hour. If many Bitcoins are being\
    \ mined and require more computing power, Nakamoto’s algorithms automatically\
    \ adjust, making them easier to mine. However, if fewer blocks are being mined,\
    \ the difficulty is increased. The goal is to maintain a mining time of ten minutes\
    \ per block.\n\nThe value of a Bitcoin depends on the trust it generates among\
    \ everyone who uses it—in investors, in users, and in society at large. As a result,\
    \ Bitcoin miners have an incentive to be honest and to validate the transactions.\
    \ If anyone commits fraud with the system and destroys trust, all Bitcoins become worthless.\n\
    \n“And so, a central authority is replaced by a network of volunteers pursuing\
    \ their own self-interest,” wrote blockchain expert Omid Malekan.\n\nThrough Bitcoin,\
    \ Nakamoto demonstrated the viability of blockchain. Over the years that followed,\
    \ computer scientists, investors, regulators, governments, experts, economists,\
    \ and ordinary citizens grappled with this new system and its implications.\n\n\
    “There is great confusion and debate about what a blockchain even is,” wrote tech\
    \ journalist Gideon Lewis-Kraus, “but the standard definition describes a shared,\
    \ decentralized, cryptographically secure, immutable digital ledger. In the broadest\
    \ terms, a blockchain allows a group of strangers to agree on a state of affairs,\
    \ and to proceed together on the basis of the covenant.”\n\n![](image/Crypto_p17.jpg)\n\
    \nThis diagram illustrates three types of organization: centralized, distributed,\
    \ and decentralized. A decentralized structure distributes decision-making power\
    \ and authority across a large group of people. In a centralized system, most\
    \ of the authority belongs to a single, central entity, such as a government or\
    \ a corporation. Finally, distributed systems consist of nodes that coordinate\
    \ their computing to reach a consensus; they can be either centralized or decentralized.\n\
    \nThis language makes blockchain sound bland, but blockchain’s supporters believe\
    \ it reveals how revolutionary blockchain could be. To them, “a group of strangers”\
    \ who “agree on a state of affairs, and proceed together on the basis of the covenant”\
    \ sounds like the beginning of a civilization.\n\nMarc Andreessen, a venture capitalist\
    \ who launched the first popular internet browser in the early 1990s and was a\
