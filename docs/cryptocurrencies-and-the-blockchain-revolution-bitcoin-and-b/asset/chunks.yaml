- raw: "Falling prices weren’t the only problem Bitcoin faced. One company, Bitwise\
    \ Asset Management, studied all the Bitcoin trades that occurred over a four-day\
    \ period in March 2019. It used computer analysis to determine which had been\
    \ completed by real human traders rather than computer-driven programs. Bitwise\
    \ discovered that of nearly $6 billion in reported trades, only $273 million was\
    \ legitimate. This study added to skepticism that investors were actually trading\
    \ Bitcoin—that is, that large amounts of Bitcoin were changing hands each day.\
    \ Some exchanges, it appeared, were trying to inflate their numbers to get a higher\
    \ ranking on data services that would then attract other cryptocurrencies to list\
    \ there. The more cryptocurrencies an exchange offered, the more it received in\
    \ listing fees and, ultimately, in trading.\n\nOver the years, crypto communities\
    \ had developed phrases and slang among themselves. As Bitcoin prices fell, crypto\
    \ supporters comforted and urged one another to “HODL.” The term supposedly originated\
    \ from a crypto supporter in a forum who, in a bout of bad typing or out of drunkenness,\
    \ posted “I AM HODLING.” The phrase evolved into a shorthand for holders determined\
    \ to keep their cryptocurrencies for the long term despite short-term volatility\
    \ and crushing losses. They rejected “FUD”—fear, uncertainty, and doubt.\n\n“If\
    \ you TRULY believe in #bitcoin and #crypto currency, today’s price is nothing\
    \ but a distraction,” said a tweet in late November 2018.\n\n# . . . and Taxes\n\
    \nIn the never-ending argument about fiat currency versus cryptocurrencies, defenders\
    \ of fiat currency point out it will always have worth because citizens normally\
    \ pay taxes in their government’s money. In addition, the government then uses\
    \ those funds to pay for public services. However, in November 2018, the State\
    \ of Ohio became the first to accept Bitcoin for tax payments (though the tax\
    \ bill was still in US dollars), setting a precedent for other states to follow.\n\
    \nAs Bitcoin dropped in value, it became less profitable to mine. Miners began\
    \ to drop out. By the end of 2018, one hundred thousand miners had quit, and 1.4\
    \ million computer servers that mined for cryptocurrencies shut down. A measure\
    \ of the computer power devoted to mining peaked in mid-2018 and then fell by\
    \ almost half.\n\nThrough it all, crypto supporters did not lose the sense they\
    \ are founding a new world. One wondered what would happen if a bomb went off\
    \ and killed everyone at a crypto meeting.\n\n“A bomb would set back civilization\
    \ for years,” another said solemnly.\n\nIf there was any consolation for crypto\
    \ supporters, it was that venture capitalists, who invest money early in new products\
    \ and technologies, had not abandoned blockchain. In fact, venture capitalists\
    \ invested four times more money in 2018 in blockchain companies than they did\
    \ in 2017. But cryptocurrencies attracted less desirable attention as well. As\
    \ interest in cryptocurrencies grew, so did the number of thieves and hackers\
    \ who saw opportunities to enrich themselves.\n\n# Chapter 5   \n\nHacks, Thieves,\
    \ and Critics\n\nIn the decade since Bitcoin was created, at least $15 billion\
    \ worth of cryptocurrency has been stolen. This number could be even larger, as\
    \ some thefts go unreported. Since 2017 alone, crypto thieves have made off with\
    \ nearly $2 billion. These attacks have become increasingly sophisticated and\
    \ organized. They take advantage of popular misperceptions of what makes a blockchain\
    \ secure and supposedly unhackable. Like every security system invented, blockchain\
    \ has both strengths and weaknesses.\n\n## Mt. Gox Hack\n\nMany security breaches\
    \ occur not in the cryptocurrencies themselves but in the exchanges on which they\
    \ are stored. Exchanges are like a combination of banks and marketplaces: they\
    \ connect buyers and sellers and hold assets—in this case, cryptocurrencies—in\
    \ accounts. These accounts differ from the private keys associated with blockchain\
    \ because they are connected to individuals. As a result, cryptocurrency exchanges\
    \ contain sensitive information about account holders and, most importantly, the\
    \ holders’ cryptocurrency keys.\n\nAt its peak in 2013, Mt. Gox was the largest\
    \ Bitcoin exchange in the world. The exchange had been built by Mark Karpelès,\
    \ a French-born computer programmer who had settled in Tokyo. As the price of\
    \ Bitcoin soared, Karpelès appeared to revel in his wealth. He donated 5,000 Bitcoins\
    \ to the Bitcoin Foundation, an organization dedicated to developing Bitcoin software,\
    \ and joined its board. Employees reported that he would suddenly approve $400\
    \ lunches for the staff or interrupt business to order flat screen TVs for the\
    \ exchange’s Tokyo headquarters.\n\nMt. Gox’s apparent success proved to be a\
    \ facade. In truth, Mt. Gox had been hacked in 2011, and thieves had gained access\
    \ to private keys throughout the exchange. Over four years, they stole some 850,000\
    \ coins from online wallets. In February 2014, the exchange collapsed into bankruptcy.\
    \ More than $400 million vanished. Investors around the world lost money, and\
    \ investor confidence in cryptocurrencies suffered another severe blow.\n\n![](image/GettyImages-812373034.jpg)\n\
    \nMark Karpelès, former CEO of Mt. Gox, was convicted by Japanese courts in March\
    \ 2019 of falsifying Mt. Gox’s financial data.\n\nIf there was a moral to the\
    \ Mt. Gox debacle, according to Wired reporter Robert McMillan, it was the need\
    \ for cryptocurrencies to operate in the real world. “\\[Cryptocurrency is\\]\
    \ a technology that was pushed forward by a community of people who were unprepared\
    \ or unwilling to deal with even the basics of everyday business,” he wrote.\n\
    \nOther investors drew a different moral. Some swore to find the thieves and to\
    \ bring them to justice. Daniel Kelman, an American lawyer who lived in Taiwan,\
    \ lost 44.5 Bitcoins, which, at their peak, were worth about $400,000. He connected\
    \ with Kim Nilsson, a Swedish software engineer who lived in Tokyo. Nilsson was\
    \ enthusiastic about the potential and promise of cryptocurrencies. He started\
    \ buying cryptocurrencies in 2012 and opened an account on the Mt. Gox exchange\
    \ a year later.\n\nSitting in front of his computer in a cramped Tokyo apartment,\
    \ Nilsson went to work. The thieves had withdrawn the coins from the exchange\
    \ over several years. Nilsson was able to search through transactions and detect\
    \ patterns. Though blockchain addresses are anonymous, Nilsson was fortunate in\
    \ that parts of the Mt. Gox database, including private records of trades, withdrawals,\
    \ deposits, and user balances, had been leaked onto the internet. Using this data,\
    \ Nilsson tracked down nearly two million addresses related to the Mt. Gox exchange.\
    \ Still, Nilsson had no information on who used the addresses or why.\n\n# Cryptocurrencies\
    \ and Law Enforcement\n\nThe FBI actively pursues cryptocurrency criminals. And\
    \ the City of London Police have begun training their officers to recognize crime\
    \ financed through digital currencies.\n\n![](image/GettyImages-1184820947.jpg)\n\
    \nThe FBI’s Cyber Division, established in 2002, deals with various cyber crimes,\
    \ including hacking and theft.\n\nNilsson then received help from an unexpected\
    \ source: Karpelès himself. Karpelès wanted to refute charges that he was part\
    \ of a conspiracy to loot the Mt. Gox exchange. He agreed to meet Nilsson and\
    \ helped him complete the list of Mt. Gox addresses. With this information, Nilsson\
    \ tracked some of the stolen Bitcoins as they moved from one wallet on the Mt.\
    \ Gox exchange to another. One of these transactions had a note with three letters:\
    \ “WME.” Who or what was WME?"
  fmt: '

    比特币面临的问题不仅仅是价格下跌。一家名为 Bitwise Asset Management 的公司研究了 2019 年 3 月四天内发生的所有比特币交易。它利用计算机分析来判断哪些交易是由真实的人类交易员完成的，而非计算机驱动的程序。Bitwise
    发现，在近 60 亿美元的报告交易额中，只有 2.73 亿美元是真实的。这项研究加剧了投资者对比特币实际交易情况的怀疑——即每天是否真的有大量比特币易手。一些交易所似乎试图虚报交易量，以在数据服务上获得更高的排名，从而吸引其他加密货币上市。交易所提供的加密货币越多，获得的上市费就越多，最终交易量也就越大。


    多年来，加密货币社区发展出了自己的短语和行话。随着比特币价格下跌，加密货币支持者相互安慰、鼓励要“坚持”。据称该词源于论坛上一位加密货币支持者，因手误或醉酒，发帖称“我在坚持持有”。这一短语演变成了持有者坚定长期持有加密货币、无视短期波动和惨重亏损的简写。他们拒绝“FUD”——恐惧、不确定和怀疑。


    “如果你真心相信 #bitcoin 和 #crypto 货币，今天的价格只不过是干扰而已，”一条 2018 年 11 月底的推文写道。


    # ……与税收


    在关于法定货币与加密货币的永无止境的争论中，法定货币的捍卫者指出，法币永远有价值，因为公民通常用本国货币纳税。此外，政府利用这些资金支付公共服务费用。然而，2018
    年 11 月，俄亥俄州成为第一个接受比特币缴税的州（尽管税单仍以美元计价），为其他州树立了先例。


    随着比特币价值下跌，挖矿变得利润更低。矿工开始退出。到 2018 年底，十万矿工退出，140 万台挖掘加密货币的计算机服务器关闭。衡量用于挖矿的计算能力的指标在
    2018 年中达到顶峰，随后下降了近一半。


    尽管经历一切，加密货币支持者并未失去他们正在开创一个新世界的感觉。有人想知道如果炸弹在加密货币会议上爆炸、炸死所有人会发生什么。


    “炸弹会让文明倒退数年，”另一人庄严地说道。


    如果对加密货币支持者有什么安慰，那就是风险投资家——那些在新产品和技术早期投资的人——并未抛弃区块链。事实上，风险投资家 2018 年在区块链公司的投资额是
    2017 年的四倍。但加密货币也吸引了不受欢迎的关注。随着对加密货币的兴趣增长，看到机会想发财的小偷和黑客数量也随之增加。


    # 第 5 章


    黑客、小偷和批评家


    自比特币创建以来的十年间，至少价值 150 亿美元的加密货币被盗。由于部分盗窃未被报告，实际数字可能更大。仅自 2017 年以来，加密货币窃贼就窃取了近 20
    亿美元。这些攻击变得日益复杂和有组织。它们利用了大众对区块链安全性及其所谓“不可被黑”特性的误解。像所有发明的安全系统一样，区块链既有优势也有弱点。


    ## Mt. Gox 黑客攻击


    许多安全漏洞发生的不是加密货币本身，而是存储它们的交易所。交易所类似于银行和市场的结合体：它们连接买卖双方，并以账户形式持有资产——在本例中为加密货币。这些账户不同于与区块链关联的私钥，因为它们与个人身份关联。因此，加密货币交易所包含账户持有者的敏感信息，最重要的是持有者的加密货币密钥。


    在 2013 年的巅峰时期，Mt. Gox 是全球最大的比特币交易所。该交易所由法国出生、定居东京的计算机程序员 Mark Karpelès 创建。随着比特币价格飙升，Karpelès
    似乎沉浸在财富之中。他向致力于开发比特币软件的比特币基金会捐赠了 5000 枚比特币，并加入其董事会。员工报告称，他会突然批准 400 美元的员工午餐，或打断业务为交易所的东京总部订购平板电视。


    Mt. Gox 表面的成功被证明是假象。事实上，Mt. Gox 早在 2011 年就被黑客攻破，窃贼获得了整个交易所私钥的访问权限。四年间，他们从在线钱包窃取了约
    85 万枚比特币。2014 年 2 月，交易所宣告破产。超过 4 亿美元消失。全球投资者损失惨重，投资者对加密货币的信心再次遭受重创。


    ![](image/GettyImages-812373034.jpg)


    Mt. Gox 前首席执行官 Mark Karpelès 于 2019 年 3 月被日本法院判定伪造 Mt. Gox 财务数据罪名成立。


    据《Wired》记者 Robert McMillan 称，如果 Mt. Gox 事件有什么教训，那就是加密货币需要在现实世界中运作。“加密货币是一项技术，由一群不准备或不愿处理日常业务基本事务的人推向前台，”他写道。


    其他投资者得出了不同的教训。一些人发誓要找到小偷并将其绳之以法。居住在台湾的美国律师 Daniel Kelman 损失了 44.5 枚比特币，按峰值价值约
    40 万美元。他与居住在东京的瑞典软件工程师 Kim Nilsson 取得联系。Nilsson 对加密货币的潜力和前景充满热情。他 2012 年开始购买加密货币，一年后在
    Mt. Gox 交易所开设账户。


    Nilsson 坐在拥挤的东京公寓电脑前开始工作。窃贼在数年间从交易所提取了比特币。Nilsson 能够搜索交易并检测模式。虽然区块链地址是匿名的，但 Nilsson
    运气不错：部分 Mt. Gox 数据库（包括交易、提款、存款和用户余额的私人记录）已泄露到互联网上。利用这些数据，Nilsson 追踪到近 200 万个与
    Mt. Gox 交易所相关的地址。尽管如此，Nilsson 仍无法掌握谁在使用这些地址及原因。


    # 加密货币与执法


    FBI 积极追查加密货币犯罪。伦敦市警察也开始培训警员识别通过数字货币资助的犯罪。


    ![](image/GettyImages-1184820947.jpg)


    FBI 网络部门成立于 2002 年，处理各类网络犯罪，包括黑客攻击和盗窃。


    随后，Nilsson 得到了一个意想不到的帮助来源：Karpelès 本人。Karpelès 想要反驳他参与掠夺 Mt. Gox 交易所阴谋的指控。他同意会见
    Nilsson 并帮助他完成 Mt. Gox 地址列表。有了这些信息，Nilsson 追踪了一些被盗比特币，它们从 Mt. Gox 交易所的一个钱包转移到另一个钱包。其中一笔交易附带三个字母的备注：“WME”。WME
    是谁或什么？

