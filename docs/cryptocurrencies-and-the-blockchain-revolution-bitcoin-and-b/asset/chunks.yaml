- raw: 'In New York City, an open-air Bitcoin market opened up in Union Square. People
    gathered under a statue of Abraham Lincoln, and they had backpacks full of cash
    and bid for the digital coins. The market, renamed Satoshi Square, and its participants
    were reminiscent of the first New York traders centuries ago, who gathered in
    open areas near Wall Street.


    Bitcoin machines, called BTMs, began to appear. About four thousand were in use
    around the world by the end of 2018, with more than two thousand in the United
    States alone. In New York City, 110 stores offered a Bitcoin machine. One estimate
    claimed that five new Bitcoin machines were installed each day. Money could easily
    be deposited and then converted into Bitcoin in a digital wallet that was instantly
    accessible from anywhere in the world.


    ![](image/GettyImages-942027294.jpg)


    This BTM sits in a train station in Poland.


    Those who were lucky—or smart—enough to take a chance on Bitcoin in its infancy
    grew rich. One twelve-year-old, Erik Finman, borrowed $1,000 from his grandmother
    to buy Bitcoin when it was $10 per coin. He was later offered $100,000, or 300
    Bitcoin, for video technology he had developed. He accepted Bitcoin, and his wealth
    compounded. Finman, who hated school, convinced his parents to agree to a deal:
    if he made $1 million before he turned eighteen, he wouldn’t have to attend college.
    He won the deal.


    Cryptocurrency holders, now worth more money than they had once dared to dream,
    became very protective of their identities. It wouldn’t take much for a person
    with a gun to simply demand their passwords. Journalist Nellie Bowles noted that,
    considering blockchain is supposed to provide security on the internet, people
    who hold cryptocurrencies appeared to be very insecure. “There’s a common paranoia
    among the crypto wealthy that they’ll be targeted and robbed since there’s no
    bank securing the money, so many are obsessively secretive,” she wrote. Conspicuous
    consumption of wealth was discouraged among cryptocurrency holders, though a few
    exceptions applied. Purchases of Lamborghinis—or Lambos—were celebrated.


    As Bitcoin prices rose, some jubilant holders planned to cash in, only to find
    that they had lost their private keys. One IT worker mined over 7,500 coins in
    2009. “There were just six of us doing it at the time,” he noted, “and it was
    like the early days of a gold rush.” He stored his private keys to the coins on
    a hard drive that sat in his desk drawer. “Four years later, I had two hard drives
    in a desk drawer. One was empty and the other contained my Bitcoin private keys,”
    he recalled. “I meant to throw away the empty drive—and I accidentally threw away
    the one with the Bitcoin information.” By that time, his Bitcoin were worth $60
    million. He begged his town to let him excavate the landfill where his hard drive
    was likely dumped. They refused.


    Another Bitcoin holder, Mark Frauenfelder, spent $3,000 on 7.4 Bitcoins that he
    stored on a hardware wallet, a secure hardware device. As part of the security
    procedure, the wallet, called Trezor, generated twenty-four random words that
    he wrote down on a piece of paper and stored in his desk drawer. If he lost the
    Trezor, he could simply get a new one and use the twenty-four words to access
    his account. Just before a trip to Tokyo, Frauenfelder decided to put the paper
    beneath his daughter’s pillow in case he died in an accident. Bitcoin was rising
    fast, and he wanted his daughter to have access to the money. His daughter, however,
    was in London at the time and didn’t return for another week. In the meantime,
    his cleaning service went through the apartment, found the piece of paper with
    obscure names all over it and threw it away.


    When Frauenfelder discovered the error, he thought it would be a minor inconvenience.
    He still knew his PIN, which would allow him to generate a new account and transfer
    the Bitcoins over. But when Frauenfelder tried the PIN, Trezor kept rejecting
    it. Frauenfelder tried dozens of variations. Nothing worked.


    “I felt queasy,” he recalled. “After my sixth incorrect PIN attempt, creeping
    dread had escalated to heart-pounding panic—I might have kissed my 7.4 Bitcoins
    goodbye.”


    Frauenfelder continued to try PINs; he kept failing. “This decentralized nature
    of the Bitcoin network is not without consequences—the main one being that if
    you screw up, it’s your own damn problem,” he noted ruefully.


    # Bitcoin Oblivion


    No one likes passwords, and Bitcoin passwords are virtually impossible to memorize.
    One cryptocurrency developer estimates that of the 21 million Bitcoins in existence,
    as many as 4 million may be lost.


    These stories, however, did little to suppress what had become an investing craze.
    The Long Island Iced Tea Company changed its name to Long Blockchain Company.
    Its stock rose 500 percent in a single day.


    A blockchain game allowed users to produce, or breed, a cryptokitty—a computer
    graphic image of a cat. Because each image was unique, scarcity occurred, which
    drove up prices. Users could only pay via Ether, and one kitty, Dragon, reportedly
    sold for $170,000.


    ![](image/Crypto_p33.jpg)


    These are some examples of cryptokitties. Each kitty is a unique combination of
    features, making it hypothetically valuable.


    Jonas Lund, a thirty-four-year-old Swedish artist, used blockchain to create 100,000
    Jonas Lund Tokens (JLTs). He gave these tokens to a board of trustees, who used
    them to vote on what artistic and professional steps Lund should take. In one
    instance, Lund had four ideas for artistically transforming a piece of plywood:
    with an engraving, with metallic gray paint, with pictures of birds and bullet
    points explaining his process, or with paint and then fire “in a controlled way
    to create something very fragile.” Lund asked his board of trustees what he should
    do. They used their tokens to select the third option: pictures of birds. This
    selection will correlate to 1,041 tokens in the future. When someone buys the
    piece, they will be awarded the tokens, which they can then use to vote on the
    direction of Lund’s art.


    With the blockchain-based tokens, Lund is simply formalizing what he sees as the
    personal, market, and community forces that influence art. Lund has given the
    tokens to people he knows, and some people were awarded tokens for buying his
    work. He also offers tokens to individuals who invite him to a talk, tweet about
    him, or use the hashtag #jonaslundtoken.


    Everyone, it seemed, was talking about cryptocurrencies. But regulators remained
    skeptical. Crypto supporters, or cryptobros, urged the SEC to approve a Bitcoin
    exchange traded fund (ETF). “Adapt or die,” wrote one supporter. “Approve Bitcoin
    ETF and take the leading step for advancing the human race through the revolutionary
    technology we have been gifted.”


    In July 2017, Ethereum was two years old. The price of Ether had risen from $8
    to $400 in the first half of 2017, giving many people plenty of reasons to celebrate.
    An anniversary party for the coin drew three hundred people to a rooftop bar in
    Manhattan. Michael Casey and Paul Vigna attended, noting that they had witnessed
    many of the booms and busts in the city, from the dot.com craze in the late 1990s
    to Bitcoin. The scene, they said, was virtually the same.


    “The energy of the crowd was palpable,” the journalists wrote. “The expectations
    of instant wealth unmistakable. Like most other tech breakthroughs, this one contained
    a mixture of utopianism and capitalism. Some people wanted to change the world.
    Some wanted to get rich. Many imagined they could do both.”


    # Are Digital Coins Securities?'
  fmt: '

    在纽约市，一个露天比特币市场在联合广场开业。人们聚集在亚伯拉罕·林肯的雕像下，背着装满现金的背包，竞拍这种数字货币。这个市场被重命名为“中本聪广场”，其参与者让人想起几个世纪前在华尔街附近露天区域聚集的首批纽约交易员。


    比特币自动取款机（BTM）开始出现。到 2018 年底，全球约有 4000 台在使用，仅美国就有 2000 多台。在纽约市，110 家商店提供比特币自动取款机。据估计，每天都有
    5 台新的比特币自动取款机被安装。资金可以轻松存入，然后转换为比特币，存放在数字钱包中，随时随地都能访问。


    ![](image/GettyImages-942027294.jpg)


    这台 BTM 位于波兰的一个火车站内。


    那些在比特币萌芽时期幸运地——或明智地——押注比特币的人变得富有。一名 12 岁的男孩埃里克·芬曼从祖母那里借了 1000 美元，在比特币每枚 10 美元时买入。后来，他因开发的一项视频技术收到了
    10 万美元或 300 枚比特币的报价。他选择了比特币，财富随之滚雪球般增长。芬曼讨厌上学，说服父母达成一项协议：如果他在 18 岁前赚到 100 万美元，就不必上大学。他赢了。


    加密货币持有者现在身价远超他们曾经敢梦想的数字，变得极度保护自己的身份。持枪歹徒只需索要密码即可轻易得逞。记者内莉·鲍尔斯指出，考虑到区块链本意是提供互联网安全，持有加密货币的人似乎反而非常缺乏安全感。“加密货币富豪中普遍存在一种偏执狂，担心自己会成为抢劫目标，因为没有银行保管资金，所以许多人极度隐秘，”她写道。加密货币持有者不鼓励炫耀性消费，尽管也有少数例外。购买兰博基尼——或称“Lambos”——受到推崇。


    随着比特币价格上涨，一些欣喜若狂的持有者计划兑现，却发现丢失了私钥。一名 IT 工作者在 2009 年挖掘了 7500 多枚比特币。“当时只有我们六个人在做这事，”他回忆道，“就像淘金热的早期。”他将私钥存储在放在抽屉里的硬盘上。“四年后，抽屉里有两块硬盘。一块是空的，另一块装着我的比特币私钥，”他回忆道。“我本想扔掉那块空盘——结果不小心扔掉了装比特币信息的那块。”到那时，他的比特币价值
    6000 万美元。他恳求城镇允许他挖掘硬盘可能被倾倒的垃圾填埋场。但被拒绝了。


    另一位比特币持有者马克·弗劳恩费尔德花费 3000 美元购买了 7.4 枚比特币，存储在一个名为 Trezor 的硬件钱包（一种安全硬件设备）上。作为安全程序的一部分，钱包生成了
    24 个随机单词，他将其记在一张纸上，存放在抽屉里。如果丢失 Trezor，他只需买一个新的，用这 24 个单词即可恢复账户。就在去东京旅行前，弗劳恩费尔德决定把这张纸塞在女儿枕头下，以防他在意外中身亡。比特币价格飞涨，他想让女儿能动用这笔钱。然而女儿当时在伦敦，还要过一周才回来。在此期间，清洁服务人员进屋打扫，发现这张写满晦涩单词的纸，当垃圾扔掉了。


    发现错误时，弗劳恩费尔德以为这只是个小麻烦。他还记得 PIN 码，本可生成新账户并转移比特币。但当他输入 PIN 码时，Trezor 一直拒绝。他尝试了几十种变体，均无济于事。


    “我感到一阵恶心，”他回忆道。“输错六次 PIN 码后，隐隐的恐惧升级为心跳加速的恐慌——我可能永远失去了这 7.4 枚比特币。”


