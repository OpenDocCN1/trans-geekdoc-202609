- raw: "As Bitcoin became more popular, a young Russian Canadian named Vitalik Buterin\
    \ became excited by the potential to apply blockchain technology to a much larger\
    \ range of transactions. Buterin was the son of a computer scientist from Grozny\
    \ in Chechnya, a republic in southwestern Russia that was mostly destroyed in\
    \ the 1990s when Russian troops fought bitter urban battles with separatists.\
    \ His father immigrated to Canada when Buterin was six, and he inherited much\
    \ of his father’s disgust for governments and the havoc they could wreak.\n\n\
    “I saw everything to do with either government regulation or corporate control\
    \ as just being plain evil,” Buterin told a New Yorker reporter, “and I assumed\
    \ that people in those institutions were kind of like Mr. Burns \\[Homer Simpson’s\
    \ greedy boss in The Simpsons\\], sitting behind their desks saying, ‘Excellent.\
    \ How can I screw a thousand people over this time?’ ”\n\nButerin was also attracted\
    \ to the individuals who were creating a new decentralized system. “Their earlier\
    \ pedigrees, if they had any pedigrees at all, were in open source—Linux, Mozilla,\
    \ and cypherpunk mailing lists,” he said. “I found it immensely empowering that\
    \ just a few thousand people like myself could re-create this fundamental social\
    \ institution from nothing.”\n\nButerin admired Bitcoin, but he wanted to do more\
    \ than simply process transactions based on a digital currency. He wanted to create\
    \ a peer-to-peer network that accomplished tasks. These tasks were set out in\
    \ agreements called smart contracts.\n\nSmart contracts can connect to several\
    \ blockchains and execute agreements without the need for human interaction. Smart\
    \ contracts could be used for a guaranteed transaction that is based on timing,\
    \ such as renting an apartment. The renter pays in Bitcoin, which releases a code\
    \ providing access to the apartment. If the landlord doesn’t send the code by\
    \ a certain time, then the Bitcoin is refunded to the renter. The smart contract\
    \ automatically verifies all pieces of the transaction through the decentralized\
    \ peer-to-peer network. This includes the landlord’s ownership of the apartment\
    \ and the tenant’s possession of the Bitcoin to pay for it. This process eliminates\
    \ the intermediaries, such as banks, and saves both the renter and the landlord\
    \ money and time.\n\nIn 2015, Buterin launched the Ethereum platform, which uses\
    \ a cryptocurrency called Ether to pay the computers on the peer-to-peer network\
    \ to execute smart contracts. Buterin described his creation as “Android for decentralized\
    \ apps”—leading him to call the smart contracts “Dapps.” Buterin compared Ethereum\
    \ to a smartphone that is programmed to perform the apps (or “Dapps”) on its platform.\
    \ In effect, programmers on Ethereum had access to a decentralized supercomputer.\n\
    \n![](image/GettyImages-500445678.jpg)\n\nButerin speaks at TechCrunch Disrupt,\
    \ a technology conference, in 2015. Buterin received a fellowship award of $100,000\
    \ in 2014 that he used to help fund Ethereum.\n\n“If it lived up to all that Buterin\
    \ and others imagined,” wrote digital currency experts Michael Casey and Paul\
    \ Vigna, “the system would amount to a global decentralized virtual machine, one\
    \ that always implemented users’ coding instructions without any control by any\
    \ one computer.”\n\nButerin and many blockchain supporters hoped Ethereum and\
    \ other blockchain platforms would help address a major problem. Most people’s\
    \ experiences on the internet were absorbed onto massive platforms such as Google,\
    \ Facebook, and Amazon. The platforms had started out as places where people could\
    \ simply carry out tasks, such as “search” or “buy an item,” or connect with another\
    \ person or group. But over time, the platforms appeared more and more to be dictating\
    \ these experiences. Through tracking and gathering of data, they used algorithms\
    \ to deliver information and advertisements to users. Worse, they demanded the\
    \ user surrender their personal information to have access to the platform. Many\
    \ hoped that blockchain could eliminate these intermediaries and restore the original\
    \ promise of the internet.\n\n# Chapter 3   \n\nCryptocurrencies Take Off\n\n\
    At first, many people were attracted to Bitcoin for one reason: anonymity. In\
    \ February 2011, the Silk Road Dark Web opened. It offered various illegal goods\
    \ and services, including drugs, stolen identities and passwords, weapons, and\
    \ sex trafficking. It accepted payment in Bitcoin only. At that time, one Bitcoin\
    \ was worth about thirty cents. Critics dismissed Bitcoin as the currency of choice\
    \ for criminals and terrorists, but some investors noticed that Bitcoin’s premise\
    \ was holding true. It allowed strangers—even criminals—to establish trust and\
    \ conduct transactions. In short, Bitcoin was working the way its creators intended.\n\
    \nThis attracted attention, especially as Bitcoin’s price began a series of dramatic\
    \ rises and falls. For speculators, Bitcoin appeared to be an opportunity to make\
    \ a lot of money fast. Law enforcement also began investigations. In the spring\
    \ of 2013, the US government took down the Silk Road Dark Web bazaar and confiscated\
    \ more than 150,000 Bitcoins.\n\nBitcoin, and cryptocurrencies in general, preoccupied\
    \ government regulators. Regulators are charged with enforcing government rules,\
    \ especially in finance. At the time, other tech-based services such as Airbnb\
    \ and Uber were causing a huge disruption in the taxi and hotel industries. Taxi\
    \ services and hotel companies were forced to compete with drivers and apartment\
    \ owners who, through the internet, could connect directly with customers.\n\n\
    Regulators wondered if this could also happen to finance. At conferences, they\
    \ asked nervous questions. Are cryptocurrencies a fraud? What impact could they\
    \ have on financial institutions? Could cryptocurrencies break the government\
    \ monopoly on money? US authorities seized cryptocurrency accounts that had traded\
    \ without being properly registered with federal agencies. China also cracked\
    \ down, declaring that no financial institution could use cryptocurrencies (although\
    \ citizens still could). The price of Bitcoin rose and fell with these announcements,\
    \ but the general trend was higher. At the start of 2014, the value of Bitcoin\
    \ shot up from about $13 to $770 per coin.\n\nBitcoin stories now appeared regularly\
    \ on news shows and in headlines. Bitcoin holders, who had once swapped them for\
    \ pennies and begged anyone to notice them, were making fortunes. Bitcoin had\
    \ arrived.\n\nAll around the world, cryptocurrencies attracted those who saw a\
    \ chance to make a fast fortune. South Korea became the third-largest market in\
    \ cryptocurrency, after the United States and Japan. Poor, young Koreans called\
    \ themselves dirty spoons. The name was based on the contrast between them and\
    \ the elite who were said to have silver and gold spoons because of their jobs,\
    \ wealth, and opportunity. To the dirty spoons, cryptocurrencies seemed a chance\
    \ to make good money and potentially upend a social order that seemed stifling.\
    \ They could buy cryptocurrencies even when they had no chance to buy stocks or\
    \ get a loan to fund a business.\n\nOne dirty spoon, twenty-nine-year-old Remy\
    \ Kim, hosted social media channels on cryptocurrencies. He first learned about\
    \ them when a hacker took over his hard drive and demanded ransom in Bitcoin.\
    \ Kim came up with the 1.2 Bitcoins (then worth about $800), but he grew fascinated\
    \ by the cryptocurrency and bought some Bitcoin for himself. As the market rose,\
    \ he bought a navy-blue Rolls Royce worth $500,000. Online, he took the name Les\
    \ Mis, after the musical and novel Les Misérables, in which the poor rise up to\
    \ overthrow a corrupt and brutal government.\n\nBitcoin’s rise became parabolic.\
    \ It started 2017 worth just below $1,000. Over the summer, its value broke $4,000.\
    \ By mid-December, the value had soared above $19,000."
