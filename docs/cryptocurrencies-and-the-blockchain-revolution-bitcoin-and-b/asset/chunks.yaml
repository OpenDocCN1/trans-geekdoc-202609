- raw: '“Just as the internet has ended up as more of a source of enhanced government
    control than one of greater freedom . . . so the revolution in digital money might
    allow the central bank to replace the liabilities of private banks with its own,”
    Wolf wrote. “In this way, the seigniorage from money creation, now enjoyed by
    private banking, would be transferred back to taxpayers.”


    Cryptocurrencies, once seen as a new, independent form of money outside of centralized
    control, may in fact be brought under government by a new generation of citizens
    tired of the abuses of the private market. It is difficult to conceive of a more
    ironic result from the cryptocurrency revolution.


    # Timeline


    | 2008 || August: || Bitcoin.org is registered. |


    | --- | --- | --- |


    |   || October: || “Bitcoin: A Peer-to-Peer Electronic Cash System” is published.
    |


    | 2009  || January: || The first block of Bitcoins (the “Genesis Block”) is mined.
    |


    |   ||  || Satoshi Nakamoto conducts the first Bitcoin transaction when they send
    ten Bitcoins to computer programmer Hal Finley. |


    | 2010  || May: || Laszlo Hanyecz exchanges 10,000 Bitcoin for two pizzas worth
    twenty-five dollars. |


    |   || July: || Bitcoin’s value rises above a penny. |


    |   ||  || Mt. Gox opens. |


    | 2011  || January: || The Silk Road Dark Web marketplace launches. |


    |   || February: || Bitcoin’s value reaches parity with one dollar. |


    | 2012  || April: || Bitcoin’s value rises above $100. |


    | 2013  || May: || The first Bitcoin ATM starts operating in San Diego, California.
    |


    |   || October: || The Silk Road Dark Web is shut down by the FBI. |


    |   || November: || Bitcoin’s value rises above $1,000. |


    |   ||  || Vitalik Buterin writes the Ethereum white paper. |


    | 2014  || February: || After years of theft, the Mt. Gox exchange collapses.
    |


    | 2015  || July: || The Ethereum network launches. |


    | 2016  || February: || Bitcoin Classic is launched. |


    |   || April: || The DAO launches and is later hacked. |


    | 2017  || August: || Bitcoin Cash is launched. |


    |   || December: || Bitcoin rises above $10,000. |


    |   ||  || Bitcoin’s value peaks at $19,783. |


    | 2018  || January: || Bitcoin’s price falls to as low as $9,199.59, half its
    peak price, and then declines to less than $4,000 over the next several months.
    |


    |   || June: || Zug, Switzerland, tests blockchain technology for voting. |


    |   || November: || Ohio becomes the first US state to accept Bitcoin for tax
    payments. |


    |   || December: || Gerald Cotten of cryptocurrency exchange QuadrigaCX reportedly
    dies in India. |


    | 2019  || January: || Ethereum Classic suffers a 51 percent attack. |


    |   || February: || Cryptocurrency exchange QuadrigaCX goes bankrupt. |


    |   || May: || Online retailers, including Amazon and Barnes and Noble, begin
    accepting cryptocurrencies. |


    |   || June: || Facebook announces its cryptocurrency, Libra. |


    |   ||  || Justin Sun, founder of the cryptocurrency TRON, bids $4.6 million to
    win lunch with Warren Buffett. |


    | 2020  || January: || Justin Sun and Warren Buffett have lunch. |


    | 2140  ||  || The last Bitcoin will be mined. |


    # Glossary


    altcoin: a shortened version of “Bitcoin alternative” that applies to the number
    of digital coins in circulation, many of them forks of Bitcoin with minor changes
    to the proof of work


    block: a file of data recorded on the blockchain network that includes the record
    of some or all new blockchain transactions. New blocks are secured to the rest
    of the chain via cryptography, and none can be altered without changing the rest
    of the chain.


    blockchain: a decentralized, digital ledger of records that cannot be changed
    without the consensus of the majority of participants. Transactions are recorded
    and time-stamped in “blocks” that are linked together with cryptography.


    cryptocurrencies: currencies based on blockchain that use cryptography and a decentralized
    system to corroborate and verify transactions


    Dapp (decentralized application): a decentralized, open-source, autonomous application,
    with all records stored on a blockchain. It can distribute tokens.


    Ethereum: an open-source software platform that uses blockchain technology to
    enable developers to write smart contracts and build and deploy Dapps


    fiat currency: physical money, such as paper bills or coins


    fork: the splitting of a blockchain into two simultaneous versions that share
    blocks. The community decides which version to use, and the discarded version
    becomes an orphan.


    hard fork: a change to the rules of a blockchain that requires all users to adapt
    to the change


    initial coin offering (ICO): crowdfunding through blockchain, with ideas, individuals,
    and projects looking for support by distributing coins or tokens


    intermediary: a person or organization that takes part in the transaction process
    but is not the seller or buyer


    mining: the process through which miners on a decentralized network add blocks
    to a blockchain


    node: a computer on a blockchain network that stores a copy of the ledger


    private key: a randomly generated number that a user of a cryptocurrency wallet
    needs to make transactions over the blockchain


    security: a financial asset, usually in the form of a stock or bond that can be
    traded


    smart contract: a protocol that can verify and enforce the terms of a contract
    without third parties


    soft fork: a change to the rules of a blockchain that only invalidates old blocks


    token: exchangeable digital assets that are typically based on blockchain. They
    can be used to pay participants for helping a blockchain function.


    # Source Notes


    9 Martin Wolf, “The Libertarian Fantasies of Cryptocurrencies,” Financial Times,
    February 3, 2019, [https://medium.com/financial-times/the-libertarian-fantasies-of-cryptocurrencies-f514cc16bcd1/](https://medium.com/financial-times/the-libertarian-fantasies-of-cryptocurrencies-f514cc16bcd1/).


    9–10 Stanton Heister and Kristi Yuthas, “The Blockchain and How It Can Influence
    Conceptions of the Self,” Technology in Society 60 (February 2020), [https://doi.org/10.1016/j.techsoc.2019.101218](https://doi.org/10.1016/j.techsoc.2019.101218).


    10 “Chancellor on Brink of Second Bailout for Banks—Satoshi’s Message for Infinity,”
    The Bitcoin News, May 24, 2018, [https://thebitcoinnews.com/chancellor-on-brink-of-second-bailout-for-banks-satoshis-message-for-infinity/](https://thebitcoinnews.com/chancellor-on-brink-of-second-bailout-for-banks-satoshis-message-for-infinity/).


    11 Nick Paumgarten, “The Prophets of Cryptocurrency Survey the Boom and Bust,”
    New Yorker, October 22, 2018, [https://www.newyorker.com/magazine/2018/10/22/the-prophets-of-cryptocurrency-survey-the-boom-and-bust](https://www.newyorker.com/magazine/2018/10/22/the-prophets-of-cryptocurrency-survey-the-boom-and-bust/)/.


    13 Xu Mingxing, Ying Tian, and Jiyue Li, Blockchain: An Illustrated Guidebook
    to Understanding Blockchain, trans. Jie Liu, (New York: Skyhorse, 2018), 9.


    13, 15 Nathan Heller, “Estonia, the Digital Republic,” New Yorker, December 11,
    2017, [https://www.newyorker.com/magazine/2017/12/18/estonia-the-digital-republic](https://www.newyorker.com/magazine/2017/12/18/estonia-the-digital-republic).


    18 Omid Malekan, The Story of Blockchain: A Beginner’s Guide to the Technology
    That No One Understands (Syosset, NY: Triple Smoke Stack, 2018), 16.


    18 Gideon Lewis-Kraus, “Inside the Crypto World’s Biggest Scandal,” Wired, June
    19, 2018, [https://www.wired.com/story/tezos-blockchain-love-story-horror-story/.](https://www.wired.com/story/tezos-blockchain-love-story-horror-story/.)


    18 Lewis-Kraus.


    19 Marc Andreessen, “Why Bitcoin Matters,” New York Times, January 21, 2014, [https://dealbook.nytimes.com/2014/01/21/why-bitcoin-matters/](https://dealbook.nytimes.com/2014/01/21/why-bitcoin-matters/).


