    \ more than just a few pennies. In 2010 a programmer completed the first known\
    \ commercial Bitcoin transaction: the delivery of two pizzas for 10,000 Bitcoins.\
    \ Seven years later, the Bitcoin used to buy those two pizzas was worth more than\
    \ $100 million. The day that the transaction occurred—May 22—would be celebrated\
    \ by cryptocurrency enthusiasts as a holiday: Bitcoin Pizza Day.\n\nThe journey\
    \ of Bitcoin, from an obscure program to the height of global finance, is an extraordinary\
    \ and controversial story. Bitcoin is the most well-known cryptocurrency. A cryptocurrency,\
    \ in simple terms, is a digital asset that relies on the internet and computers\
    \ to verify its value and ownership. It is designed to be used like money. According\
    \ to supporters, cryptocurrencies represent a new way of storing value and conducting\
    \ business, one that exploits the ease and reach of technology. In this vision,\
    \ cryptocurrencies will replace paper and coin currencies. Costly, slow intermediaries\
    \ will be removed from the transaction process. Tyrannical governments and corrupt\
    \ institutions will be sidelined. Individuals will freely conduct transactions\
    \ directly with one another in a framework that establishes and maintains trust.\n\
