    WME 持有的一个账户上的名字：Alexander Vinnik（亚历山大·维尼克）。尼尔松找到了 Mt. Gox 的窃贼。


    尼尔松并不知情，美国调查人员早已因维尼克利用数字货币交易所洗钱而对其进行跟踪。2017 年 7 月，维尼克离开俄罗斯前往希腊度假。当地警方和美国官员在海滩上将其包围并逮捕。他被指控通过其数字货币交易所
    BTC-e 洗钱 40 亿美元以上，涉及与多项犯罪有关的个人，包括贩毒、身份盗窃、退税欺诈和计算机黑客攻击。美国调查人员称，维尼克还“获取”了来自 Mt.
    Gox 的资金并将其洗白。据希腊警方称，维尼克是“国际通缉的犯罪组织‘主谋’”。


    尼尔松对窃贼落网感到欣慰。但他没拿回自己的钱。Mt. Gox 至今仍处于破产程序中。


    ![](img/GettyImages-855537746.jpg)


    亚历山大·维尼克于 2017 年在希腊因洗钱被捕。2020 年 1 月，希腊法院同意将其引渡至法国受审。他还将面临美国的审判，随后是其祖国俄罗斯的审判，因为这些地方都对其提起了指控。维尼克坚称自己无罪。


    # 51% 法则


    Mt. Gox 是交易所被黑客攻击时可能出现严重后果的惊人案例。但加密货币还可能存在哪些其他漏洞？


    2019 年初，一名黑客夺取了支持加密货币以太坊经典（Ethereum Classic）网络中超过一半的算力控制权。随后，黑客利用这一控制权重写了构成区块链的交易历史。通过这种手段，黑客向自己转移了
    100 多万美元。为了实施这起盗窃，窃贼利用了区块链本身的结构——更具体地说，是 51% 法则。


    51% 法则是指区块链交易由节点验证。节点是去中心化的，因此理论上彼此独立。然而，如果任何个人或团体能够控制用于验证交易的算力半数以上，他们就可以向自己发送一笔付款，然后重写区块链历史，使同一笔付款再次生效。


    此类攻击此前未针对主流加密货币，因为要获得大多数算力需要耗费巨资。然而，数百种较小型的加密货币可能更容易遭受“51% 攻击”。


    2018 年年中，多种持有量和交易量较小的加密货币遭遇了 51% 攻击。包括 Verge、Monacoin 和 Bitcoin Gold 在内的币种持有者遭受了估计总计
    2000 万美元的损失。然而，对更常见的以太坊经典的攻击取得成功，这更令人不安。


    # 加密货币义警


    一些人组建了自己的团体追捕加密货币窃贼。目标是识别窃贼并将其绳之以法。


    ## The DAO


    当加密货币持有者还在应对交易所问题和 51% 攻击时，另一个令人不安的安全漏洞浮出水面——智能合约漏洞。


    2016 年，一个承诺为投资者提供安全、透明的集体投资决策方式的风险投资基金启动。这个去中心化自治组织被称为 The DAO。它出售代币，参与者可用这些代币在以太坊区块链上指导项目。


    The DAO 是德国软件开发者 Christoph Jentzsch（克里斯托夫·延施）的构想。延施思考如何为公司融资。当时大多数公司只是单纯发行数字货币，但延施想得更深。为什么不创建一个拥有自己货币的平台，为多个初创项目提供资金呢？


    延施计划通过发行代币换取以太币（Ether），为以太坊区块链上的开发提供资金。投资者随后将使用代币为他们认为最有价值的项目投票。如果应用产生回报，则会分配回代币持有者。该结构开放透明。所有者可以看着资金流入，看到投票内容，以及代币如何分配。


    2016 年 4 月 30 日，The DAO 启动，设有 28 天的融资窗口期。延施希望为 The DAO 筹集 500 万美元，但通过众筹，投资者投入了
    1.5 亿美元。产生的宣传效应激发了对以太币的兴趣，推高了对该币种的需求。The DAO 基金很快达到 2.5 亿美元，在如此短的时间内这是一个惊人的数字。


    延施后来说：“我们希望它能成为去中心化共享经济的中心。对于这样一个大实验来说，时机还远未成熟。”


    一名黑客在智能合约第 666 行的一个字母中发现了漏洞——一个大写的 T 本应是小写。通过这个漏洞，黑客编写了一个与 The DAO 交互的合约。它开始每隔几分钟就吸走价值
    4000 美元的以太币，并发送到一个地址：`0xF35e2cC8E6523d683eD44870f5B7cC785051a77D`。


    投资者眼睁睁看着 The DAO 被抽干了 1200 万以太币，相当于 5000 多万美元。六小时后，黑客停手了。


    延施为挽救 The DAO 中剩余的资金而焦急万分，他召集了罗宾汉小组（Robin Hood Group），这是一个由来自世界各地的以太币专家和计算机程序员组成的团队，旨在黑客之前窃取剩余的以太币并归还给原主人。但当他们启动合约以挽救以太币时，原始漏洞依然存在，黑客继续利用它。


    这次黑客攻击表明，区块链和智能合约的优势——不可篡改——也可能成为劣势。“因为区块链上的交易无法撤销，部署智能合约有点像发射火箭，”苏黎世联邦理工学院（ETH
    Zürich）研究科学家、智能合约安全初创公司 ChainSecurity 联合创始人 Petar Tsankov 说。“软件不能犯错。”


    有人认为，罪魁祸首不是窃贼，而是 The DAO 程序员的粗心大意。程序员犯了错，就得由他们买单。然而，程序员们决心为 The DAO 的股东追回资金。他们认为，这起盗窃案可能会对区块链的整个概念造成致命打击，因为区块链才刚刚起步。于是他们提议进行硬分叉。硬分叉会做出追溯应用于整个区块链的更改。实际上，过去可以被字面意义上地重写。在区块
    1,920,000 中，程序员编写了代码，将新的智能合约应用于以太币。The DAO 投资者将能够拿回他们的钱。


    大多数以太坊社区成员（89%）同意进行硬分叉，但一小部分人（剩余的 11%）拒绝了这一解决方案。他们认为，区块链不能仅仅为了挽救个别用户而被重写。在他们的观点中，这可能会造成比解决的更多的问题，因为当事情出错时，任何人都可能期待得到救助。在现实世界中，真实的人一直在损失真金白银。加密货币和区块链不应有所不同。


    以太坊联合创始人 Vitalik Buterin（维塔利克·布特林）介入辩论，支持硬分叉。“一些比特币用户认为硬分叉在某种程度上违背了他们最基本的价值观，”他说。“我个人认为，将这些基本价值观推向这种极端是愚蠢的。”

