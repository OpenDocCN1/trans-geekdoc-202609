    # Stinchcombe on Blockchain Trust


    Stinchcombe pointed out the elephant in the room: How was the average person to
    know if a smart contract—written in computer code—could be trusted? You must read
    through it. This could take a couple of hours. Stinchcombe gave the example of
    buying an e-book. Say you bought a book directly from a novelist, and the smart
    contract arrived on your computer. The contract should state how much money will
    be withdrawn from your account for the delivery of the book. Reading through the
    contract to make sure there aren’t any bugs or errors would take far more time
    and effort than the e-book is worth.


    “Auditing software is hard!” wrote Stinchcombe. “The most-heavily scrutinized
    smart contract in history had a small bug that nobody noticed — that is, until
    someone did notice it, and used it to steal fifty million dollars. If cryptocurrency
    enthusiasts putting together a [$150 million] investment fund can’t properly audit
    the software, how confident are you in your e-book audit? Perhaps you would rather
    write your own counteroffer software contract, in case this e-book author has
    hidden a recursion bug in their version to drain your Ethereum wallet of all your
    life savings?”


    The point, said Stinchcombe, is that blockchain was not trustless—it simply asks
    people to trust technology rather than other people. This makes some sense—after
    all, we trust technology to conduct vital tasks all the time. But in reality,
    we’re actually trusting a third party to verify that the technology can be trusted.
    Blockchain, therefore, puts the task of verifying trust back on to the individual.
    This requires extraordinary knowledge, resources, and time. And this, according
    to Stinchcombe, makes blockchain far less effective than its supporters claim.


    Financial Times journalist Dan McCrum used Stinchcombe’s argument to make a startling
    conclusion: “Blockchain doesn’t even solve most problems of trust. The integrity
    of data on a public blockchain can be trusted not to change, but that says nothing
    about whether the data is right in the first place. For votes, tuna, shipping
    containers, or mango supply chains, a blockchain registry would only be as good
    or as trustworthy as the people contributing to it.”


    Finally, there was another painful reality about blockchain. Even by mid-2019,
    few average internet users were actually using it. Blockchain enthusiasts envisioned
    Dapps functioning as apps on an iPhone. Because Dapps were outside the control
    of giant tech companies, they offered users a way to bypass gatekeepers and avoid
    the incessant tracking that occurs on the internet. Of the twenty-seven hundred
    Dapps with enough data for statistical measurement, however, only three attracted
    more than ten thousand daily users. In fact, thirty of the top fifty Dapps were
    dedicated to gambling.


    ![](image/Crypto_p61.jpg)


    The smartphone apps you might be used to rely on a centralized data center to
    deliver content to your phone through an internet service provider (ISP). A Dapp
    relies on a decentralized method, where users are connected to one another rather
    than to a single entity, to deliver content.


    One problem with Dapps is that users have to get used to a whole new blockchain-based
    operating system. In comparison, downloading an app onto a smartphone is relatively
    simple and easy. Blockchain’s operating system remains in a relatively early phase.
    Programmers are building and troubleshooting the system. User experience is not
    yet a focus.


    “Does it run? Yeah, it runs, like if I built a car,” said one computer science
    professor. “It’ll run, but it’s not something you’d want to put your kids in.”


    # Chapter 6: Blockchain: The Tulip Bulb of the Internet?


    Where is blockchain today, and where is it going? To its critics, blockchain is
    little more than a speculative bubble—another power grab by technologists, a solution
    in search of a problem, and a system rife with errors. It’s vulnerable to thieves
    and hacks, or otherwise hopelessly compromised. But to its supporters, blockchain
    represents nothing less than a revolution. It establishes what makes human affairs
    work: truth, which leads to trust. It takes control of the internet back from
    the tech companies, gatekeepers, and totalitarian governments. In their eyes,
    the challenges and missteps of the past decade are to be expected given the enormity
    of blockchain’s potential.


    The infrastructure to fully support cryptocurrencies is coming into place. Several
    exchanges—such as Binance HK, Upbit, and Huobi—have set up digital currency ventures.
    Miners operate all over the world. Supply chains, including those of Walmart,
    are adopting blockchain technology. In May 2019, companies such as Amazon, Whole
    Foods, Nordstrom, AT&T, and Barnes and Noble began accepting cryptocurrency for
    payments.


    However, there have also been stumbles. The 2018 crash in Bitcoin and other cryptocurrencies
    weakened investor demand and interest. The volatility of their value made cryptocurrencies
    difficult to use as a medium of exchange. Major Wall Street institutions such
    as Goldman Sachs and the Chicago Board Options Exchange delayed, or dropped, plans
    to offer trading support for Bitcoin.


    “When you talk to tech industry insiders about where [blockchain] is heading,
    two vastly different comparisons are inevitable: the tulip bulb and the internet,”
    observed a New York Times reporter. The tulip bulb craze occurred in the seventeenth
    century in the Netherlands, when speculators bid up the price of tulip flower
    bulbs on newly opened markets. The prices reached astronomical levels and then
    abruptly collapsed, and the tulip craze has become shorthand for speculative bubbles.
    The internet, on the other hand, was also a speculative bubble that popped in
    2000. But it ultimately rewarded investors. “So what is it?” asks the article.
    “We are still a few years from any sort of clarity about where this technology
    will fit in the world.”


    ## Restoring Trust in Data


    According to its supporters, one of the biggest potential applications of blockchain
    is data. All around us, networked appliances, vehicles, laptop and desktop computers
    and, of course, smartphones, are talking to the network. They share information—billions
    of bits of data. Analysts and programs sift through this vast trove to glean insights.
    Imagine if doctors could track the spread of disease with extraordinary accuracy
    in real time. Or if machine parts informed users when they need to be replaced.
    Or if the progress of a customized educational program could be confirmed in real
    time.


    Data can provide vital clues to consumer behavior, voter preferences, and organizational
    effectiveness. We often think of Amazon as a website where we can buy virtually
    anything and have it shipped directly to us. In reality, Amazon is as much a data-gathering
    company that holds valuable information on its customers’ shopping habits. Other
    companies such as Google, Facebook, and Apple have similar pools of user data.
    These companies protectively guard their data. Their high stock prices are evidence
    of their commanding position in the economy.


    However, public trust in these companies has fallen in recent years. It was revealed
    that consumer data has been used to manipulate, spy on, and target and deliver
    “fake news” to users. Many users now wonder how their data is being used—or abused.
    Trust is a critical component for all transactions, and trust in the era of data
    collection is near all-time lows.


    Many companies do not abuse the data they collect but have shown they can’t be
    trusted to protect it. Because user data is so valuable, these companies have
    been targeted by hackers. Every few months, it seems, another company reports
    a significant data breach. A hack of Twitter data, for example, led to email in-boxes
    jammed with spam, sophisticated scam campaigns, and harassment.

