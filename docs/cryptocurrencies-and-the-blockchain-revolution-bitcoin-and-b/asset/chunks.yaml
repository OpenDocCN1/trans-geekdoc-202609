    # About the Author


    ## Brendan January has been a financial writer on Wall Street for more than a
    decade and is an award-winning author of more than twenty nonfiction books for
    young readers. Some of his most recent titles include Information Insecurity:
    Privacy under Siege and ISIS: The Global Face of Terrorism. January attended Haverford
    College in Pennsylvania and the Columbia Graduate School of Journalism in New
    York. He was also a Fulbright scholar in Germany. He lives with his wife and two
    children in Maplewood, New Jersey.


