    300 人来到曼哈顿的一家屋顶酒吧。迈克尔·凯西和保罗·维尼亚出席了派对，他们指出曾在该城市见证过许多繁荣与萧条，从 1990 年代末的互联网泡沫到比特币。他们说，场景几乎一模一样。


