    使用运筹学技术强制-王 Benders 规则（MWR） [23] 加速 Benders 分解。MWR 通过求解具有替代目标（随机顺序）的子问题生成，减少了关于子问题原始目标（可能在某个因子内）的优性硬性约束。


    我们的贡献是使用带有 MWR 的 Benders 分解来处理 CC 中的优化。这允许大规模并行，与像 CC 在在... 中这样的方法形成对比。


    # II. 相关工作


    相关性聚类已成功应用于计算机视觉中的多个问题，包括图像分割、多目标跟踪、分割和姿态估计。CC 的经典工作，节点对应于超像素 [20]；使用整数线性规划（ILP）表述-分支定界策略的
    CC 排除了并行性 [21]；CC 包含节点集上的高阶代价项，使用类似于 [2] 的方法进行求解。[26] 提出了一种用于无权图聚类的划分方案。该方法依赖于随机采样并提供最优下界。


