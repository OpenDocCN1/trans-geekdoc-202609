    # 一种相关性聚类的 Benders 分解方法


    Jovita Lukasik 和 Margaret Keuper

    数据与网络科学小组

    德国曼海姆大学

    jovita@informatik.uni-mannheim.de

    keuper@uni-mannheim.de


    Maneesh Singh 和 Julian Yarkony

    Verisk 公司

    美国新泽西州泽西湖市

    maneesh.singh@verisk.com

    julian.yarkony@verisk.com


    摘要—我们处理了利用相关性聚类（Correlation Clustering, CC）解决图像分割的图划分问题，并将其视为一个整数线性规划（ILP）。我们重新表述了
    CC 中的优化问题，以便通过 Benders 分解（运筹学中的一种经典技术）进行高效优化。我们的分解方法处理了权重，并强制执行与图中边对应的不等式，每个不等式对应
    CC 实例中的一个节点。我们生成了强制-王（Mandatory-Wong）Benders 规则来加速优化。分解允许我们加速 CC 中的优化，并包含之前的平面约束，在理论上允许大规模并行。相关性聚类，最小代价划分。


    方法难以扩展到大型 CC 问题实例，且不易于并行化。本文的目标是为 CC 实现一种高效的优化机制，在该机制可以使用大规模并行计算。


    在本文中，我们将运筹学中的相关性聚类（10）应用于计算机视觉中的 CC。Benders 分解通常用于运筹，以解决具有公共块结构的混合整数规划（MILP）。Benders
    分解分别处理变量，如果 MILP 的约束矩阵包含来自多个一个子问题的变量，则不需要任何更改。CC 中的优化通过在在其变量上求解一个主问题来分解。子问题的解可以并行求解，并根据它们对主问题解的条件提供原始/对偶割平面。子问题的对偶解将持续存在，直到主问题不再添加更多约束。


    # I. 引言


    许多计算机视觉任务涉及将一组观测值划分（聚类）为唯一的实体。对于此类任务，的一种强效表述是（相关性聚类）CC，它定义在具有实值边的图上，其中节点与观测值相关，边表示节点对之间的亲和力。


    例如，在图像分割（基于超像素）中，节点对应于超像素，边表示它们之间的相邻关系。超像素之间边的权重指的是由分类器定义的、两个超像素属于同一地面真实体的概率。如果边的幅度小于
    1，我们定义其为一个割切（cut）。边的幅度是分类器决策的函数。


    CC 代价函数是划分问题中连通分量（称为实体）边的权重之和。CC 中的优化将图划分为边，以最小化 CC 代价。它非常有吸引力，因为实体的数量作为边权重的函数自然产生，而不需要对描述聚类数量的模型进行额外搜索
    ([37])。


    对于一般图，CC 的优化是 NP 难的 [5]。之前对 CC 问题优化的方法如 [2], [3] 和 [2] 中描述的基于线性规划 Benders 分解的方法，是一种精确的
    MILP 求解技术，但可以直观地作为坐标程序使用，学习主问题和子问题。子问题不共享变量，而且以主问题变量上超平面的形式学习一个下界。该下界是主问题的当前解。


    使用运筹学技术强制-王 Benders 规则（MWR）[23] 加速 Benders 分解。MWR 通过求解具有替代目标（随机顺序）的子问题生成，减少了关于子问题原始目标（可能在某个因子内）的优性硬性约束。


    我们的贡献是使用带有 MWR 的 Benders 分解来处理 CC 中的优化。这允许大规模并行，与像 CC 在在... 中 这样的方法形成对比。


    # II. 相关工作


    相关性聚类已成功应用于计算机视觉中的多个问题，包括图像分割、多目标跟踪、分割和姿态估计。CC 的经典工作，节点对应于超像素 [20]；使用整数线性规划（ILP）表述-分支定界策略的
    CC 排除了并行性 [21]；CC 包含节点集上的高阶代价项，使用类似于 [2] 的方法进行求解。[26] 提出了一种用于无权图聚类的划分方案。该方法依赖于随机采样并提供最优下界。


    [37] 研究了聚类中常见的平面图结构中的 cc。他们引入了聚类生成方法 [16]，其中定价问题对应于寻找图的最低代价 2-色划分，通过 [13], [22],
    [29] 实现。这种方法已扩展到图像分割和分割 [30]，以及非平面图的特定情况 [34], [39]。


    大型 CC 问题定义为 [19], [20]，且通常通过可行启发式算法处理 [8], [18], [20], [30]。当最优解无法达到时，这些方法非常相关，但它们没有提供对解质量的保证。


    [31] 使用一个与 CC 为相似的框架进行多目标跟踪，其中对象和边的聚类与 CC 关联。我们的工作源于 [17] 使用类似于 CC 的框架进行多目标跟踪的计算。Benders
    分解通常用于运筹，以解决具有公共块结构的混合整数规划（MILP）。Benders 分解分别处理变量，如果 MILP 的约束矩阵包含来自多个一个子问题的变量，则不需要任何更改。CC
