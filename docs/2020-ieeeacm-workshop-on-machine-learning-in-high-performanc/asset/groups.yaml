    # I. 引言


    许多计算机视觉任务涉及将一组观测值划分（聚类）为唯一的实体。对于此类任务，的一种强效表述是（相关性聚类）CC，它定义在具有实值边的图上，其中节点与观测值相关，边表示节点对之间的亲和力。


