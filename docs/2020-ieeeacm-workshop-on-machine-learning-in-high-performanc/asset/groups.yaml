    $(v_i, v_j) \in \mathcal{E}$ 要么与 $v_i$ 的子问题相关，要么与 $v_j$ 的子问题相关。这里 $\mathcal{E}^s$
    是 $\mathcal{E}$ 中与子问题 $s$ 相关的子集。Benders 分解强制执行 $\mathcal{E}^s$ 中的循环约束，$\mathcal{E}^s$
    是 $\mathcal{E}$ 中相邻于 $s$ 的子集。


    在 A 节中，我们补充了 $[x^*_{vij}]_{\mathcal{S}}$ 的代价相对于等式 (CC2) 的目标大于 $Q(\hat{o}, s, x)$，且存在等式
    (CC2) 的最优解 $x^*$，使得对于所有 $s \in \mathcal{S}$，$Q(\hat{o}, s, x) = 0$。


    在本节中，我们假设已提供 $S$，它可以通过贪心算法产生或使用 LP 求解器产生。


    在我们用辅助函数 $Q(\hat{o}, s, x)$ 重写等式 (CC1) 之前，该函数通过增加/减少 $x_{vij}$ 提供使 $x$ 满足所有 CC
    不等式的代价，其中对于 $(v_i, v_j) \in \mathcal{E}_s$。我们描述主问题边标记 $x$ 的变化，其中 $x^* = \{x_{vij}
    \in [0,1]\}$，且 $|s|$ 是每个 Benders 子问题的成员数量。


    由此得出，等式 (2) 中图中节点的任何最优解 $x^*$ 都是 2-可色的。这是因为任何划分都可以修改，而不会合并相邻的连通分量（不包括根节点 $v_i$）。因此，任何此类分量的对都不会增加代价，因为这些分量不是通过负权重边连接的，除非结果是一个划分。


    (CC1) $\to$ (CC2):


    基于这一观察，我们使用 $Q(\hat{o}, s, x)$（也称为线性最小切）重写优化等式 (CC2)，公式如下：


    $$\min_{x \in \{0,1\}} \sum_{(v_i,v_j) \in \mathcal{E}_s} -x_{vij} + \sum_{(v_i,v_j)
    \in \mathcal{E}_s} x_{vij} + Q(\hat{o}, s, x) \quad (2)$$


    $Q(\hat{o}, s, x)$ 定义为：


    我们用 1 表示节点 $v \in \mathcal{V}$ 不是根子问题 $s$ 的关联分量且 $m=s$；否则为 0。因此，没有额外的 $m_i$ 被替换为
    0。


    $$\min_{x \in \{0,1\}^s} \sum_{(v_i,v_j) \in \mathcal{E}_s} Q_{vij}(1-x_{vij})
    + \sum_{(v_i,v_j) \in \mathcal{E}_s} x_{vij}Q_{vij} \text{s.t. } x_{vij} \ge 1-x^*_{vij}
    \forall (v_i,v_j) \in \mathcal{E}^* \quad \forall c \in C$$


    我们构造一个解 $x^* = \{x^*_{vij}\}_{_{(v_i,v_j) \in \mathcal{S}}$，使得等式 (CC2) 最小且所有约束均满足。给定解
    $x = \{x_{vij}\}_{_{(v_i,v_j) \in \mathcal{S}\}}$，我们按照如下方式进行：


    $$x^*_{vij} = \min_{x \in \{0,1\}} Q_{vij}(x) \quad \forall (v_i,v_j) \in \mathcal{E}_s,
    s \in \mathcal{S} \quad (3)$$

    $$x^*_{vij} = \max_{x \in \{0,1\}} Q_{vij}(x) \quad \forall (v_i,v_j) \in \mathcal{E}^*
    \quad (4)$$


    由于等式 (2) 中的流约束，等式 (4) 的右侧无法达到 1。因此我们将 $Q(\hat{o}, s, x)$ 写为原始对偶 LP，其原始部分由对偶变量
    $\lambda$ 满足，$\lambda$ 在原始问题中。由于 $m$ 是非负的，为了确保原始问题存在，我们将 $Q(\hat{o}, s, x)$ 给出：


    $$Q(\hat{o}, s, x) = \begin{cases} \sum_{(v_i,v_j) \in \mathcal{E}_s} \phi_{i,j}
    & (v_i,v_j) \in \mathcal{E}^+ \\ \sum_{(v_i,v_j) \in \mathcal{E}_s} \phi_{i,j}
    & (v_i,v_j) \in \mathcal{E}^- \end{cases} \quad (7)$$


    这得到了对偶问题：


    $$\max_{\lambda \ge 0} \sum_{(v_i,v_j) \in \mathcal{E}_s} \lambda_{ij} \quad (8)$$

