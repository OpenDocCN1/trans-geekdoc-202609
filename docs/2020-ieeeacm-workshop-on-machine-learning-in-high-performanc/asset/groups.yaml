    finding the lowest cost 2-color partition of the graph, by [13], [22], [29]. This
    approach has been extended to image segmentation and segmentation, [30] and to
    specific cases of non-planar graphs, [34], [39].


    Large CC problems are defined as [19], [20] and [7] are usually addressed by feasible
    heuristics, [8], [18], [20], [30]. Such approaches are highly relevant when the
    optimal solution is out of reach, but they do not provide guarantees on the quality
    of the solution.


    [31] calculi multi-object tracking using a framework closely resembling CC, where
    the clustering of objects and edges are associated with probabilities of association.
    The work of [17] and [27] built on [31] to formulate multi-pose estimation using
    CC with node labeling.


    Our work is derived from the classical work in operations research Benders decomposition,
    [10], [11], [15]. We are constrained by fixed chart deformations of [12], which
    solve a mixed integer linear program over a set of binary variables (options)
    and a larger set of fractional variables (flows of commodities to customers in
    a network) associated with constraints. Benders decomposition reformulates the
    optimization to use only the integer variables and the added constraints are referred
    as Benders Rows. Our implementation is then tackled using a cutting plane approach.
    This approach is accelerated by the use of MWR, [23], which are more than


    Benders decomposition has been recently applied in computer (though not for CC),
    for the purpose of multi-pose estimation [32], [38]. In this work, multi-person
    pose estimation is modeled as so to admit efficient optimization, using column
    generation and Benders decomposition jointly. Our paper is regret discussing the
    problem domain, the underlying integer program and the structure of the Benders
    structures.


    # III. STANDARD CORRELATION CLUSTERING FORMULATION


    In this section, we review the standard optimization formulation for CC [22],
    which corresponds to a graph partitioning problem w.r.t. the graph $\mathcal{G}
    = (V, \mathcal{E})$. This problem is defined by finding the lowest labeling problem.


    Definition 1. Given a graph $\mathcal{G} = (V, \mathcal{E})$ with nodes $v \in
    V$ and undirected edges $(u, v) \in \mathcal{E}$ labeled with $x_{uv} \in \{0,
    1\}$, nodes are in separate components and is zero otherwise. The edge weight
    $\omega_{uv} \in \mathbb{R}$, the lowest labeling problem is to find a cut minimizing


    ```

    $$\min_{x \in \{0,1\}^V} \sum_{(u,v) \in \mathcal{E}} \omega_{uv}(1 - x_{uv})
    + \sum_{(u,v) \in \mathcal{E}} \omega_{uv}x_{uv} \quad (CC_1)$$

    ```


    ```

    $$\s.t. \sum_{(u,v) \in \mathcal{E}} x_{uv} \geq x_u + x_v \quad \forall u,v \in
    V \quad (CC_2)$

    ```


    where $\mathcal{E}^-$ denotes the subset of $\mathcal{E}$, for which weight $\omega_{uv}$
    is negative and non-negative, $\mathcal{C}$ is the set of undirected edges in
    exactly one member of $\mathcal{E}$. $\mathcal{E}^+$ is the set of edges in $\mathcal{E}$
    associated with cut $c$ associated with $c$.


    The graph defined by $\mathcal{E}$ is very sparse for problems [17]. We also refer
    to the edge in [22] with $x_{uv} = 1$ as a cut.


    The objective of (CC1) is to minimize the total weight of the cut. The constraints
    in Eq. (2) ensure that, for every copy of $G$, the number of edges cannot be cut
    either. This enforces the labeling to decompose $G$ such that $G$ edges are cut
    only those that are properly separated.


    Solving (CC2) is intractable due to the large number of inequalities by solving
    the ILP over a set of constraints (implicit) and adding new constraints from the
    set of violated cycle inequalities. Benders decomposition iterates over $(u, v)
    \in \mathcal{E}$ and identifies the shortest path between the nodes $u, v$ in
    the graph with weights $\omega_{uv}$, and weights for each edge. If the corresponding
    path has total weight less than $\omega_{uv}$, the constraint is added by solving
    the LP relaxation of the ILP until no violated cycle inequalities are solved in
    each iteration.


    We also state other work in CC for the problem that might not require cycle inequalities
    in that the edge of $\mathcal{E}^-$ which is on the right side of Eq. (1). It
    is established with Lemma[1] that the addition of cycle inequalities in $\mathcal{E}^+$,
    on the left side, right side of Eq. (1), do not toughen the ILP in (CC2)-1 or
    its LP relaxation.


