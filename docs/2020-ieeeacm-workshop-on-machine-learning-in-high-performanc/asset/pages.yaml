    # A. Cutting Plane


    Optimization in Eq. (CC3) is intractable since $|Z|$ equals the number of feasible
    dual solutions, which is infinite. Since we cannot consider the entire set $\tilde{Z}
    \subset \mathcal{Z}$, we use a cutting plane approach to solve $(CC_3)$ exactly.
    We initialize $\tilde{Z}$ with the LP problem. We iterate over the LP relaxation
    of $(CC_3)$ over $\tilde{Z}$ (to referred as the master problem) and generating
    Benders rounds until no violations exist.


    This ensures that no violated inequalities exist except when x is not integral.
    To ensure integrality, we iterate between solving the ILP in $(CC_3)$ over $\tilde{Z}$
    and Benders Rounds to $s$. By solving the LP relaxation, we obtain $x$, we iterate
    over $s$ and generate one Benders round eq. (8), which is associated with a violated
    cycle inequality.


    Given $s$, we iterate over $(v_{i,j}) \in \mathcal{E}$. We find the shortest path
    from $u$ to $v$ using the vector $x$ as edges. With the length of this path, denoted
    by a violated cycle, being strictly less than zero, we have identified a violated
    cycle inequality.


    We describe our cutting plane plan in Alg. 1. With line description in the supplementary
    material. To provide acceleration, we use ADMM in standard Benders decomposition,
    described in the following section.


    Prior to iteration of Alg. 1, one can produce a feasible solution $x^*$ from the
    master problem, from which for each $(v_s) \in \mathcal{Z}$, we set $z_s^*=1$
    if $x_s^* \geq 0.5$ and $z_s^*=0$ otherwise. These are separate constraints for
    feasible solutions, which we solve by and setting $x_s^*=0$. The cost of the feasible
    solution $x^*$ provides an upper bound on the cost of the optimal solution.


