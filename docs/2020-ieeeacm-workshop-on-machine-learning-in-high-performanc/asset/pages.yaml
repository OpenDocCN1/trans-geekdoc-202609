    Abstract—We tackle the problem of graph partitioning for image segmentation using
    correlation clustering (CC), which we treat as integer linear program (ILP). We
    reformulate optimization in CC so to admit efficient optimization via Benders
    decomposition, a classic technique from operations research. Our decomposition
    handles weights and enforces inequalities corresponding to edges in the graph,
    each with a node in the CC instance. We generate Mandatory-Wong Benders rules
    to accelerate our optimization. The decomposition allows us to accelerate optimization
    in CC, and to include previous plane constraints, theoretically allows for massive
    parallelism. Correlation clustering, minimum cost cuts.


    do not easily scale to large CC problem instances and are not easily parall. The
    goal of this paper is to implement an efficient mechanism for optimization in
    CC, where massively parallel computing could be employed.


    In this paper we apply the correlation clustering from operations research (10)
    to CC for computer vision. Benders decomposition is commonly applied in operations
    to solve mixed integer programs (MILP) that have a common block structure. Benders
    decomposition handles variables separately and requires no of the constraint matrix
    of the MILP contains variables from more than one subproblem. Optimization in


    Optimization in CC is decomposed by solving a master problem over its variables.
    The subproblem solutions can be solved in parallel and provide primal/dual cuts
    over their conditions on the solution to the master problem. The dual solutions
    of the subproblems persist until no further constraints are added to the master
    problem.


    # I. INTRODUCTION


    Many computer vision tasks involve partitioning (clustering) a set of observations
    into unique entities. A powerful formulation for such tasks is (correlation clustering)
    CC is defined on a graph with real value edges, where nodes are correlated to
    observations and edges represent the affinity between pairs of nodes.


    For example, in image segmentation (on superpixels), nodes correspond to superpixels
    and edges indicate adjacency between them. The weight of an edge between superpixels
    refers to the probability, defined by a classifier, that the two superpixels belong
    to the same ground truth entity. We define a cut if the magnitude of the edge
    is less than 1. The magnitude of the edge is a function of the classifier de


    The CC cost function sums the weights of the edges connected components (referred
    to as entities) in a partition problem. Optimization in CC partitions the graph
    into edges so to minimize the CC cost. It is appealing, since the number of entities
    emerges naturally as a function of the edge weights, without requiring an additional
    search over some model describing the number of clusters ([37]).


    Optimization in CC is NP-hard for general graphs [5]. Previous methods for the
    optimization of CC problems such described in [2], [3] and [2] based on linear
    programming


    Benders decomposition is an exact MILP solving technique but can be intuitively
    used as a coordinate procedure, learning the master problem and the subproblems.
    The subproblems do not share variables, but also learn a bound in the form of
    a hyper-plane over the master problem''s variables. This lower bound is the current
    solution to the master problem.


    Benders decomposition is accelerated using the operations research technique of
    Mandatory-Wong Benders rules (MWR) [23]. MWR are generated by solving the subproblems
    with an alternative objective (random order) reduces the hard constraint of optimality
    (possibly within a factor) regarding the original objective of the subproblem.


    Our contribution is the use of Benders decomposition with MWR to tackle optimization
    in CC. This allows for massive parallelism, in contrast to approach like CC as
