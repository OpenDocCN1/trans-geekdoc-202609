    From the above, it can be seen that the amount of analyses involved in this cloud
    service is very large. In this view of situation, cloud computing is an effective
    method to solve this problem. However, in the application of cloud computing,
    how to evaluate cloud security becomes particularly important.


    The selection of cloud security index determines the reliability and practicality
    of the cloud service. The selection of cloud security indicators should follow
    the principles of objectivity, independence and scientific, in order to select
    the comprehensive, reasonable and objective factors that affect cloud security.
