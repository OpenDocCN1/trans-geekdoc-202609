    # 2 Cloud Computing of Negative Sequence Electromagnetic Loss and Heating


    It is well known that large generator is a vital part of power system. The three-phase
    asymmetry of stator winding usually causes negative sequence current in the generation,
    and the interaction between the negative sequence current and the magnetic field
    will produce the electromagnetic torque[5,6]. Negative sequence current will also
    produce additional heating loss when the sub-generator rotor is forced as whole,
    due to the limitation of heat dissipation conditions, which in the design and
    analysis process, the negative sequence ability of the generator must be taken
    into account. Diagram of large generator''s structure and subdivision are given
    in Fig 1 to 7.


