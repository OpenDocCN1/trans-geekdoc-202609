    # ABSTRACT


    Large-turbo is the high technical equipment for electric power which is considered
    the heart of power system. And it becomes the development goals of domestic and
    foreign power generation equipment. Besides, its security evaluation index has
    been paid close attention by international academia and engineering. Therefore,
    this paper applies the cloud security evaluation model based on fuzzy sets to
    evaluate the electromagnetic loss and heat of turbo-generators under negative
    sequence. This model establishes two security evaluation index systems according
    to cloud security alliance and cloud platform service model, and uses multi-level
    fuzzy evaluation for security evaluation. It is found to provide an important
    reference for the construction of cloud security service providers, for the quantitative
    assessment of third-party organizations engaged in cloud security assessment,
    and cloud security platforms for cloud users.


    conditions, Turbo-generators


    # Introduction


    At present, cloud computing has been widely used, by lots of security issues have
    been demonstrated by the development of cloud computing industry[1]. However,
    there is no international security standard widely recognized and generally followed
    by the industry so far. CSA, an international cloud security organization, was
    established at the RSA conference in 2009 to promote best security practices in
    the cloud computing environment and to provide security framework through cloud
    computing security. CSA has been widely recognized by the industry. In 2013, the
    cloud security alliance Top Threats Working Group and group of domain experts
    conducted a survey, which identified threats to security. There are data loss,
    data account access or service flow to hazard, unsafe interface and API, and definition
    of service independence, issues of the cloud services, domestic and foreign researchers
    are mostly focused on the analysis and prevention of factors affecting cloud security,
    while there is lack of quality evaluation standard for cloud security. Thus, to
    establish cloud security and its corresponding evaluation system has a challenge
    for cloud security.


    With the development of power generators, electromagnetic and thermal load as
    increases. This could cause local overheating, abnormal downturn, or threat to
    power system security[3,4]. It is worth researching on the current load and heat,
    which could increase the negative sequence sequence capacity and decrease voltage
    leading to the rotor of power and the asymmetrical operation characteristics of
    turbo-generator. The problem of rotor negative sequence heating has always been
    a major problem in the design and analysis of large turbo-generators. Hence, cloud
    computing is undoubtedly one of the most effective


