    # 负序条件下大型发电机电磁损耗与发热云安全综合评价


    Jian Guo †

    建筑与木学院

    齐哈尔大学

    中国齐哈尔

    33293561@sq.com


    Wu Guo

    通信与电子工程学院

    齐哈尔大学

    中国齐哈尔

    342973566@sq.com


    Jing Du

    通信与电子工程学院

    齐哈尔大学

    中国齐哈尔

    284653987@sq.com


    # 摘要


    大型发电机是电力高技术设备，被视为电力系统的核心，也是国内外发电设备的发展目标。此外，其安全评价引起国际学术界和工程界的广泛关注。因此，本文采用基于模糊集的云安全评价模型，对负序条件下发电机的电磁损耗和发热进行评价。该模型根据云安全联盟和云平台服务模型建立了两个安全评价体系，并采用多级模糊评价进行安全评估。研究发现，该模型为云安全服务商的构建、从事云安全评估的第三方机构的定量评估以及云用户的云安全平台提供了重要的参考。


    条件，发电机


    # 引言


    目前，云计算已得到广泛应用，云计算行业的发展也暴露了许多安全问题[1]。然而，目前为止还没有被业界广泛认可和遵循的国际安全标准。云安全联盟（CSA）作为一个国际云安全组织，于2009年在RSA会议上成立，旨在促进云计算环境下的最佳安全实践，并通过云计算安全提供安全框架。CSA已获得业广泛认可。2013年，云安全联盟顶级威胁工作组和领域专家小组进行了一项调查，识别了针对安全的威胁。这些威胁包括数据丢失、数据账户访问或服务流的风险、不安全的接口和API以及服务独立性的定义等云服务问题。国内外研究人员大多侧重于影响云安全的因素的分析与预防，但缺乏云安全的质量评价标准。因此，建立云安全及其相应的评价体系对于云安全而言是一项挑战。


    随着发电机的发展，电磁和热负荷随之增加。这可能导致局部过热、异常下降或对电力系统安全造成威胁[3,4]。对当前的负载和热量进行研究非常有价值，这可能会增加负序容量并降低电压，导致发电机转子功率以及大型发电机的非对称运行特性。转子负序加热问题一直是大型发电机设计和分析中的一个主要问题。因此，云计算无疑是负序条件下大规模计算最有效的技术方法之一。


    # CCS 概念


    - 应用计算

    - 物理科学与工程——计算机辅助设计


    # 关键词


    云安全，电磁损耗，负序


    # 2 负序电磁损耗与发热的云计算


    众周知，大型发电机是电力系统的重要组成。定子绕组的三相不对称通常会导致发电产生负序电流，负序电流与磁场之间的作用将产生电磁矩[5,6]。由于散热条件的限制，当子发电机转子被强制视为整体时，负序电流还会产生额外的热损耗，因此在设计和分析过程中，必须考虑发电机的负序能力。图1至7给出了大型发电机的结构和细分图。


    ![](img/93842e0a123bb464125cadc2a8fc6a99_1_0)

    图1：细分图


    ![](img/93842e0a123bb464125cadc2a8fc6a99_1_1)

    图2：转子结构


    ![](img/93842e0a123bb464125cadc2a8fc6a99_1_2)

    图3：大型发电机结构图


    ![](img/93842e0a123bb464125cadc2a8fc6a99_1_3)

    图4：空载气气隙密度


    ![](img/93842e0a123bb464125cadc2a8fc6a99_1_4)

    图5：稳态条件下的磁通密度


    ![](img/93842e0a123bb464125cadc2a8fc6a99_2_0)

    图6：三相故障下的气隙磁通密度


    ![](img/93842e0a123bb464125cadc2a8fc6a99_2_1)

    图7：三相故障下的磁通分布


    # 3 云安全综合评价


    vi 是模糊评价集，vi=(优、好、差、极差)。单因素矩阵通过专家选择获得。邀请了10位专家对计算序序条件下发电机的电磁损耗和发热进行评价。调查如表1所示。


    表1：基于云安全的评价等级频率分布


    | | V1 | V2 | V3 | V4 | V5 |

    |---|---|---|---|---|---|

    | U1 | 1 | 2 | 4 | 2 | 1 |

    | U2 | 0 | 1 | 5 | 3 | 1 |

    | U3 | 0 | 2 | 4 | 2 | 2 |

    | U4 | 0 | 2 | 6 | 1 | 1 |

    | U5 | 0 | 2 | 5 | 2 | 1 |

    | U6 | 1 | 3 | 3 | 2 | 1 |

    | U7 | 1 | 3 | 5 | 1 | 0 |

    | U8 | 1 | 4 | 2 | 1 | 0 |

    | U9 | 0 | 2 | 2 | 4 | 1 |

    | U10 | 0 | 3 | 4 | 2 | 0 |

    | U11 | 0 | 1 | 4 | 3 | 2 |


    从上述可以看出，该云服务涉及的分析量巨大。在这种情况下，云计算是解决这一问题的有效方法。然而，在云计算的应用中，如何评价云安全变得尤为重要。


    云安全索引的选择决定了云服务的可靠性和实用性。云安全指标的选择遵循客观、独立和科学原则，以选择影响云安全的全面、合理客观客观因素。目前有两种云安全联盟指标体系和云平台服务模型指标体系。根据上述对云安全因素的分析，基于云安全的云安全联盟云安全层次模型包含三个要素，即框架、治理和运行


    其中：U1是框架的；U21治理和企业风险管理；U22法律问题；U23合规与审计；U24信息管理与数据安全；U25互操作性与安全；U26传统安全、业务连续性和灾难恢复；U32数据中心运营；U33事件响应、通知与修复；U34应用安全；U35加密与密钥管理


