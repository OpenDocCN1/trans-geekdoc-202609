    ## 4.1 基于 CSA 的云安全层次模型综合评价


    通过对基于 CSA 的安全层次模型的评价频率分布表调查数据进行归一化，可以获得云架构、云治理和云运营指标单因素评价矩阵。


    ```

    $R_1 = [0.10, 0.70, 0.20, 0.10]

    0, 0.50, 0.30, 0.20

    0, 0.20, 0.50, 0.10

    0, 0.10, 0.60, 0.20

    ```


    ```

    $R_2 = [0.20, 0.40, 0.20, 0.20]

    0.10, 0.30, 0.40, 0.20

    0.10, 0.20, 0.50, 0.10

    ```


    ```

    $R_3 = [0.20, 0.50, 0.10, 0.20]

    0, 0.20, 0.30, 0.10

    0.10, 0.30, 0.50, 0.20

    ```


    分别使用模型 $M(\wedge, \vee)$ 进行一级评价，得到模糊综合评价集：

    B1=$A31 \wedge R_1=(0.10, 0.60, 0.20, 0.20)，

    B2=$A32 \wedge R_2=(0.12, 0.24, 0.43, 0.21)$以及其归一化结果 (0.11, 0.23, 0.41, 0.24)；

    B3=$A33 \wedge R_3=(0.16, 0.25, 0.41, 0.22)$以及其归一化结果 (0.15, 0.24, 0.39, 0.21)。


    从上述一级综合评价 B1、B2 和 B3 中，得到二级综合评价为：


    | | | | |

    |---|---|---|---|

    | $B_1$ | 0 | 0.60 | 0.20 |

    | $B_2$ | 0.11 | 0.23 | 0.41 |

    | $B_3$ | 0.15 | 0.24 | 0.39 |


    然后，通过三级评价得到 $B = B_1 \vee B_2 \vee B_3=(0.13, 0.27, 0.53, 0.29)$，归一化后为 (0.11,
    0.21, 0.50, 0.13)。根据原理，电磁负序状态。


    ## 4.2 基于云服务模式的云安全层次模型综合评价


    对云服务层次模型的评价频率分布调查数据进行归一化，可以获得 SaaS 模式、PaaS 模式、IaaS 模式的评价分别为 (0.10, 0.25, 0.41,
    0.19)。根据最大原理，电磁负序状态。


    ## 5 结论


    计算和分析显示，基于云服务平台模式的指标体系评价结果与现实一致，表明该评价方法是有效的。


