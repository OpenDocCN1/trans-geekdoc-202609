- pgno: 337
  md: '# BatchNorm Step 1: Normalize Net Inputs


    $$$\mu_j = \frac{1}{n} \sum_{i} z_j^{[i]}$$

    $$\sigma_j^2 = \frac{1}{n} \sum_{i} (z_j^{[i]} - \mu_j)^2$$

    $$z''_j^{[i]} = \frac{z_j^{[i]} - \mu_j}{\sigma_j}$$


    For numerical stability: $$z''_j^{[i]} = \frac{z_j^{[i]} - \mu_j}{\sqrt{\sigma_j^2
    + \epsilon}}$$


    Zero-centered, unit variance...'
  merge: -1
  img_proc: true
- pgno: 338
  md: "# # BatchNorm Step 2: Pre-Activation Scaling\n\n$$z'_j^{[i]} = \\frac{z_j^{[i]}\
    \ - \\mu_j}{\\sigma_j}$$\n\n$$a'_j^{[i]} = \\gamma_j \\cdot z'_j^{[i]} + \beta_j$$\n\
    \nControls the spread or scale\n\nControls the mean"
  merge: -1
  img_proc: true
