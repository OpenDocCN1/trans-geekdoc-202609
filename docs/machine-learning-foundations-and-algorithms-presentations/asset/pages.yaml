    \ \rightarrow \\max_{\\lambda}$\n\n$\\sum_{i=1}^N \\mathbb{E}_{p(m)} \\log p(y^i|x^i),\
    \ w = \\mu \\cdot \text{diag}(m)) - ||\\mu||_2^2 \rightarrow \\max_{\\mu}$\n\n\
