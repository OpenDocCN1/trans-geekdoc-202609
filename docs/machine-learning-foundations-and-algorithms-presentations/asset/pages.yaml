- pgno: 491
  md: '# # Requirements on attention weights


    * The weights $w_i(t)$ must be positive and sum to 1


    +   - I.e. be a distribution

    - Ideally, must be high for the most relevant inputs for the ith output and low
    elsewhere


    ![](img/f01928df50903c99ce023dd3c527a33d_491_0.png)


    * Solution: A two step weight computation


    +   - First compute raw weights: $e_i(t) = g(h_i, s_{t-1})$

    - Then softmax them: $w_i(t) = \frac{\exp(e_i(t))}{\sum_j \exp(e_j(t))}$


    # ### Typical options for g()

    (variables in red must be learned)


    ```

    $g(h_i, s_{t-1}) = h_i^T s_{t-1}$

    $g(h_i, s_{t-1}) = h_i^T W s_{t-1}$

    $g(h_i, s_{t-1}) = MLP([h_i, s_{t-1}])$

    ```'
  merge: -1
  img_proc: true
- pgno: 492
  md: '# # Converting an input: inference


    +   This may be

    * a learned parameter, or

    * Or just set to some fixed value, e.g. a vector of 1s or 0s, or

    * Or the average of all the encoder embeddings: $mean(h_0, ..., h_4)$

    * Or $W_{init} mean(h_0, ..., h_4)$ where $W_{init}$ is a learned parameter


    ![](img/f01928df50903c99ce023dd3c527a33d_492_0.png)


    +   * Pass the input through the encoder to produce hidden representations $h_i$'
  merge: -1
