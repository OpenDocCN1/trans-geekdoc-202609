- pgno: 856
  md: "# # Gaussian Processes\n\nA Gaussian Process (GP) $f(\\mathbf{x}) \\sim \\\
    mathcal{GP}(\\; m(\\mathbf{x}) \\, k(\\mathbf{x}, \\mathbf{x}')\\)$ mean function\
    \ covariance function\n\nis a probability distribution over functions $f(\\mathbf{x})$,\
    \ such that any finite set of function values $t_i = f(\\mathbf{x}_i)$ evaluated\
    \ at inputs $\\mathbf{x}_1, \\dots, \\mathbf{x}_n$ is jointly Gaussian distributed\n\
    \n+   - Mean function evaluates our prior belief about the function\n  $\\mathbb{E}[f(\\\
    mathbf{x})] = m(\\mathbf{x})$$\n  - For simplicity, we will use $m(\\mathbf{x})\
    \ = 0$\n\n+   - Covariance function evaluates how similar/correlated two function\
    \ evaluations at inputs $\\mathbf{x}, \\mathbf{x}'$\n  $\\mathbb{E}[f(\\mathbf{x})f(\\\
    mathbf{x}')] = k(\\mathbf{x},)$- Covariance function evaluates how similar/correlated\
    \ two function evaluations at inputs $\\mathbf{x}, \\mathbf{x}'$\n  $\\mathbb{E}[f(\\\
    mathbf{x})f(\\mathbf{x}')] = k(\\mathbf{x}, \\mathbf{x}')]$$\n  - Covariance function\
    \ needs to be a positive definite function (similar to a kernel function)"
  merge: -1
  img_proc: true
