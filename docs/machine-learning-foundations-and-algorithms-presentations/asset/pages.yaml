- pgno: 970
  md: "# # Gaussian-Process Upper Confidence Bounds\n\n**Designed to optimize exploration/exploitation\
    \ tradeoff (see RL lecture)**\n\n+   - Optimism in the face of uncertainty\n-\
    \ $UCB_t(\theta) = \\mu_{t-1}(\theta) + \\sqrt{\beta_t}\\sigma_{t-1}(\theta)$n\
    \  - Want to achieve high mean and high uncertainty\n  - $\beta_t$ time dependent\
    \ scaling of standard deviation\n  - Theory exists for selecting $\beta_t$ optimally\n\
    \n![](img/f01928df50903c99ce023dd3c527a33d_970_0.png)\n\n+   - See RL lecture"
  merge: -1
