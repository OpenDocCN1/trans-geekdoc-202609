- pgno: 827
  md: "# 2-step: Compute predictive distribution\n\nPredicting of a new data-point\
    \ $x^*$:\n\n$p(y^*|x^*, \\mathcal{D}) = \\int p(y^*|x^*, \\theta) p(\\\theta|\\\
    mathcal{D}) \\ d\\theta \\approx \\frac{1}{N} \\sum_{\\theta_i \\sim p(\\\theta|\\\
    mathcal{D})} p(y^*|x^*, \\theta_i)$\n\\text{marginal likelihood} \\quad \\text{likelihood}\
    \ \\quad \\text{posterior}$\n\n+   - Parameter vector $\\theta$ is integrated\
    \ out\n- Likelihood $p(y^*|x^*, \\mathcal{D})$ is now purely determined by the\
    \ data $\\mathcal{D}$\n- $p(y^*|x^*, \\mathcal{D})$ is often called marginal likelihood\
    \ as $\\theta$ is marginalized out\n\n**Intuition:** If you assign each parameter\
    \ estimator a “probability of being right”, the average of these parameter estimators\
    \ will be better than the single one\n\n+   - Weighted ensemble method (with potentially\
    \ infinite amount of models if integral can be solved exactly)\n- ... often, samples\
    \ from $p(\\\theta|\\mathcal{D})$ are used to approximate the integral (finite\
    \ number of models in this case)"
  merge: -1
