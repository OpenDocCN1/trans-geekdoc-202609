  md: "# # Take-away messages\n\n+   * Bayesian learning consists of 2 steps:\n  -\
    \ Compute posterior over parameters / models\n  - Average over all parameters\
    \ / models weighted by posterior\n* Both steps are **in general intractable**\n\
    \  - Can only be done for linear feature / kernelized regression models in closed\
    \ form\n  - For all other cases, we need to **rely on approximations**\n* However,\
    \ theoretically one of the most powerful learning methods\n  - Robust against\
    \ overfitting (averages over unspecified behaviour between between datapoints)\n\
    \  - Does not require test set\n  - Quantifies model uncertainty\n  - **Hot research\
    \ topic**: Bayesian Neural Network\n\n![](img/f01928df50903c99ce023dd3c527a33d_852_0.png)"
