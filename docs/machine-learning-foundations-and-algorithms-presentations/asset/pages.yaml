  md: "# # Hyperband\n\n![](img/f01928df50903c99ce023dd3c527a33d_992_0.png)\n\n![](img/f01928df50903c99ce023dd3c527a33d_992_1.png)\n\
    \n![](img/f01928df50903c99ce023dd3c527a33d_992_2.png)\n\n**Problem:** For a given\
    \ Budget B, how many configurations should we use?\n\n+   - **Envelope:**\n  -\
    \ Shows distance to final evaluation error (shaded areas)\n  - Can only differentiate\
    \ between 2 configurations if shaded areas do not overlap any more\n  - In general,\
    \ the size of shaded area is unknown\n\n+   - **Hyperband:**\n  - Run Successive\
    \ Halving multiple times with different initial budget"
