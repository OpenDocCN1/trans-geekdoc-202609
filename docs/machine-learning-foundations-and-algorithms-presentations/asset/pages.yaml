    partial W_{1d}} \\ \\vdots & \\ddots & \\vdots \\ \\frac{\\partial f(\\mathbf{W})}{\\\
    partial W_{k1}} & \\dots & \\frac{\\partial f(\\mathbf{W})}{\\partial W_{kd}}\
    \ \\end{bmatrix}$\n\nDerivatives of a vector-valued function w.r.t. a matrix...\n\
    \n+   - ... is a 3D tensor!\n- So that gets a bit tricky... luckily we (almost)\
