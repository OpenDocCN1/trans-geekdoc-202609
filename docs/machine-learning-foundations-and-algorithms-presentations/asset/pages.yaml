- pgno: 948
  md: '# Hyper-Parameter Optimization


    Definition: Hyperparameter Optimization (HPO)


    Let


    +   - $\lambda$ be the hyperparameters of a ML algorithm $A$ with domain $\Lambda$

    - $\mathcal{L}(A_\lambda, D_{train}, D_{valid})$ denote the loss of $A$, using
    hyperparameters $\lambda$ trained on $D_{train}$ and evaluated on $D_{valid}$.


    The hyperparameter optimization (HPO) problem is to find a hyperparameter configuration
    $\lambda^*$ that minimizes this loss:


    > $\lambda^* \in \arg \min_{\lambda \in \Lambda} \mathcal{L}(A_\lambda, D_{train},
    D_{valid})$'
  merge: -1
  img_proc: true
- pgno: 949
  md: "# Types of Hyperparameters\n\n+   - Continuous\n  - Example: learning rate\n\
    - Integer\n  - Example: #units\n- Categorical\n  - Finite domain, unordered\n\
    \    - Example 1: algo ∈ {SVM, RF, NN}\n    - Example 2: activation function ∈\
    \ {ReLU, Leaky ReLU, tanh}\n    - Example 3: operator ∈ {conv3x3, separable conv3x3,\
    \ max pool, ...}\n      - Special case: binary"
  merge: -1
  img_proc: true
- pgno: 950
  md: "# # Conditional Hyperparameters\n\n+   - Conditional hyperparameters B are\
    \ only active if other hyperparameters A are set a certain way\n- **Example 1:**\n\
    \  - A = choice of optimizer (Adam or SGD)\n  - B = Adam’s second momentum hyperparameter\
    \ (only active if A=Adam)\n- **Example 2:**\n  - A = type of layer k (convolution,\
    \ max pooling, fully connected, ...)\n  - B = conv. kernel size of that layer\
    \ (only active if A = convolution)\n- **Example 3:**\n  - A = choice of classifier\
    \ (RF or SVM)\n  - B = SVM’s kernel parameter (only active if A = SVM)"
  merge: -1
  img_proc: true
- pgno: 951
  md: '# Auto-ML as as Hyperparameter Optimization


    > Definition: Combined Algorithm Selection and Hyperparameter Optimization (CASH)


    Let


    +   - $\mathcal{A} = \{A^{(1)}, \dots, A^{(n)}\}$ be a set of algorithms

    - $\mathcal{A}^{(i)}$ denote the hyperparameter space of $A^{(i)}$, for $i = 1,
    \dots, n$

    - $\mathcal{L}(A^{(i)}, D_{train}, D_{valid})$ denote the loss of $A^{(i)}$, using
    $\lambda \in \Lambda^{(i)}$ trained on $D_{train}$ and evaluated on $D_{valid}$.


    The Combined Algorithm Selection and Hyperparameter Optimization (CASH) problem
    is to find a combination of algorithm $A^* = A^{(i)}$ and hyperparameter configuration
    $\lambda^* \in \Lambda^{(i)}$ that minimizes this loss:


    ```

    $A^*_{\lambda^*} \in \arg \min_{A^{(i)} \in \mathcal{A}, \lambda \in \Lambda^{(i)}}
    \mathcal{L}(A^{(i)}, D_{train}, D_{valid})$

    ```


    +   - Simply a HPO problem with a top-level hyperparameter (choice of algorithm)
    that all other hyperparameters are conditional on

    - E.g., Auto-WEKA: 768 hyperparameters, 4 levels of conditionality'
  merge: -1
  img_proc: true
