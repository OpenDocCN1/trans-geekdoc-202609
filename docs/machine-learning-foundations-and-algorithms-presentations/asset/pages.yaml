    boldsymbol{x})=[\\phi_{\\mu_1}}(\\boldsymbol{x}), \\dots, \\phi_{\\mu_M}}(\\boldsymbol{x})]^T,\
    \ \\quad \\phi_{\\mu_i}(\\boldsymbol{x})=\\exp\\left(-\\frac{\\|\\boldsymbol{x}-\\\
    mu_i\\|^2}{2\\sigma^2}\\right)$$\n$\\mu_i \\dots i^{th}$ center location (fixed)\
    \ $\\$\\quad \\sigma^2 \\dots$ bandwidth$$\n\n![](img/f01928df50903c99ce023dd3c527a33d_218_0.png)"
