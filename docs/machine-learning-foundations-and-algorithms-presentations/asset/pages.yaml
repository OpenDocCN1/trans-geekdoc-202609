- pgno: 518
  md: "# # The self-attention block\n\nWe can have multiple such “heads”\n\n+   -\
    \ Each will have an independent set of queries, keys and values\n- Each will obtain\
    \ an independent set of attention weights\n  - Potentially focusing on a different\
    \ aspect of the input than other heads\n- Each component computes an independent\
    \ output\n\nThe final output is the concatenation of the outputs of these attention\
    \ heads\n\n“MULTI-HEAD ATTENTION” (actually Multi-head self attention)\n\n```\n\
    $q_i^a = W_q^a h_i$\nk_i^a = W_k^a h_i$\nv_i^a = W_v^a h_i$\nw_{ij}^a = attn(q_i^a,\
    \ k_{0:N}^a)$n$o_i^a = \\sum_j w_{ij}^a v_j^a$\n```\n\n![](img/f01928df50903c99ce023dd3c527a33d_518_0.png)"
