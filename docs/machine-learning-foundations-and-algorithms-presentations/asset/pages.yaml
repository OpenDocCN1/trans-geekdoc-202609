    \ & x_2u_d & \\dots & x_nu_d \\end{bmatrix} = \\mathbf{u}\\mathbf{x}^T$\n\n+ \
    \  - Which is the outer product!\n\nHence: $\nabla_{\\mathbf{W}}f = \\frac{\\\
