- pgno: 710
  md: "# # Diffusion Kernel\n\n```\n$q(\\boldsymbol{x}_t|boldsymbol{x}_0) = \\mathcal{N}(\b\
    oldsymbol{x}_t|\\sqrt{\\bar{\\alpha}_t}\\boldsymbol{x}_0, (1-\\bar{\\alpha}_t)\\\
    boldsymbol{I}), \\quad \\text{with } \\bar{\\alpha}_t = \\prod_{k=1}^t \\alpha_k$\n\
    ```\n\nForward diffusion process (fixed)\n\nData\n\n![](img/f01928df50903c99ce023dd3c527a33d_710_0.png)\n\
    \nNoise\n\n$\\boldsymbol{x}_0 \\quad \\boldsymbol{x}_1 \\quad \\boldsymbol{x}_2\
    \ \\quad \\boldsymbol{x}_3 \\quad \\boldsymbol{x}_4 \\quad \\dots \\quad \\boldsymbol{x}_T$\n\
    \n+   - $\\alpha_t$ values schedule (i.e. the noise schedule) is designed such\
    \ that $\bar{\\alpha}_T \\rightarrow 0$ and $q(\\boldsymbol{x}_T|\\boldsymbol{x}_0)\
    \ \\approx \\mathcal{N}(\\boldsymbol{x}_T|\\mathbf{I})$"
