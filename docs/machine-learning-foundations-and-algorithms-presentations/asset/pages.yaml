- pgno: 284
  md: "# Basics: Chain rule gradients of composite functions\n\n**Objective functions\
    \ for training neural nets:**\n\n+   - per sample loss + regularization penalty\
    \ (see lecture 2)\n  $$\\mathcal{L}(\\theta, \\mathcal{D}) = \\sum_{i=1}^{N} l(\\\
    boldsymbol{x}_i, \\theta) + \\lambda \\text{penalty}(\\theta)$)$$\n\n+   - We\
    \ need to compute the following partial derivatives:\n  - Layer weight matrices:\
    \ $\\frac{\\partial\\mathcal{L}}{\\partial\\boldsymbol{W}^{(l)}}$\n  - Layer bias\
    \ vectors: $\\frac{\\partial\\mathcal{L}}{\\partial\\boldsymbol{b}^{(l)}}$\n\n\
    +   - Can be done by a recursive use of the chain rule!"
