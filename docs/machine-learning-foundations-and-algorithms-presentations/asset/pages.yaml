  md: '# # Recap: Recurrent Models as Attention Models


    ![](img/f01928df50903c99ce023dd3c527a33d_508_0.png)


    +   - Encoder recurrently produces hidden representations of input word sequence

    - Decoder recurrently generates output word sequence


    +     - For each output word the decoder uses a weighted average of the hidden
    input representations as input “context”, along with the recurrent hidden state
    and the previous output word'
