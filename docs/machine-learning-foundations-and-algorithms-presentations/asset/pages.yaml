- pgno: 560
  md: '# # Graph Convolutional Networks (GCNs)


    Consider this undirected graph:


    Calculate update for node in red:


    Aggregate all information from neighboured nodes to update representation


    ![](img/f01928df50903c99ce023dd3c527a33d_560_0.png)


    Desirable properties:


    +   * Weight sharing over all locations

    * Invariance to permutations

    * Linear complexity O(E)


    ```

    Update rule: $h_i^{(l+1)} = \sigma \left( h_i^{(l)} W_0^{(l)} + \sum_{j \in \mathcal{N}_i}
    \frac{1}{c_{ij}} h_j^{(l)} W_1^{(l)} \right)$

    ```


    Scalability: subsample messages [Hamilton et al., NIPS 2017]


    $\mathcal{N}_i$ : neighbor indices $c_{ij}$ : norm. constant (fixed/trainable)


    Kipf & Welling (ICLR 2017), related previous works by Duvenaud et al. (NIPS 2015)
    and Li et al. (ICLR 2016)


    Gerhard Neumann | Machine Learning | KIT | SS 2024'
  merge: -1
  img_proc: true
