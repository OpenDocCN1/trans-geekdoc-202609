- pgno: 915
  md: "# Recap: Bayesian Learning\n\n+   1. Compute posterior: $p(\theta|D) = \\frac{p(D|\t\
    heta)p(\theta)}{p(D)}$\n\n+   2. Integrate out posterior: $p(x^*|D) = \\int p(x^*|\t\
    heta)p(\theta|D) d\theta$\n\n# Properties:\n\n+   - For very large datasets, the\
    \ posterior will be a point estimate $\\lim_{n\\to\\infty} p(\theta|\\mathcal{D}_n)\
    \ = \\delta(\\theta - \theta^*)$\n  - i.e., Bayesian Learning will be equivalent\
    \ to maximum likelihood\n\n+   - However, large advantage for smaller datasets!\n\
    \  1. We know where our model is uncertain\n  2. More robust estimate due to averaging,\
    \ less overfitting\n  3. For DNNs all datasets are small due to the large number\
    \ of parameters"
  merge: -1
  img_proc: true
