- pgno: 988
  md: "# Multi-Fidelity Optimization\n\n+   * Use **cheap approximations** of the\
    \ blackbox, performance on which correlates with the blackbox, e.g.\n  - Subsets\
    \ of the data\n  - Fewer epochs of iterative training algorithms (e.g., SGD)\n\
    \  - Fewer trials in deep reinforcement learning\n  - Downsampled images in object\
    \ recognition\n\n+   * Also applicable in different domains, e.g., fluid simulations:\n\
    \  - Less particles\n  - Shorter simulations"
  merge: -1
  img_proc: true
