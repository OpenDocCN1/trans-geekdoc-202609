- pgno: 594
  md: "# The f-divergence\n\n| Divergence | Corresponding $f(t)$ | Discrete Form |\n\
    | --- | --- | --- |\n| $\\chi^\\alpha$-divergence, $\\alpha \\ge 1$ | $\\frac{1}{2}|t-1|^\\\
    alpha$ | $\\frac{1}{2}\\sum_i |\\frac{p_i-q_i}{q_i}|^\\alpha$ |\n| Total variation\
    \ distance $(\\alpha = 1)$ | $\\frac{1}{2}|t-1|$ | $\\frac{1}{2}\\sum_i |p_i-q_i|$\
    \ |\n| $\\alpha$-divergence | $\begin{cases} \\frac{t^\\alpha-at-(1-\\alpha)}{\\\
    alpha(\\alpha-1)} & \text{if } \\alpha \neq 0, \\alpha \neq 1 \\ t \\ln t + t-1,\
    \ & \text{if } \\alpha = 1 \\ -\\ln t + t-1, & \text{if } \\alpha = 0 \\end{cases}$\
    \ | $\\sum_i p_i \\ln \\frac{p_i}{q_i}$ |\n| KL-divergence $(\\alpha = 1)$ | $t\
    \ \\ln t$ | |\n| reverse KL-divergence $(\\alpha = 0)$ | $-\\ln t$ | $\\sum_i\
    \ q_i \\ln \\frac{q_i}{p_i}$ |\n| Jensen-Shannon divergence | $\\frac{1}{2}(t\
    \ \\ln t + (t+1)\\ln(\\frac{t+1}{2}))$ | $\\frac{1}{2}\\sum_i (p_i \\ln \\frac{p_i}{(p_i+q_i)/2}\
    \ + q_i \\ln \\frac{q_i}{(p_i+q_i)/2})$ |\n| Jeffrey's divergence (KL + reverse\
    \ KL) | $(t-1)\\ln(t)$ | $\\sum_i (p_i-q_i) \\ln \\frac{p_i}{q_i}$ |\n\n+   *\
    \ **Note:** The exact equations here do not really matter for us, but its good\
    \ to know that the f-divergence exists\n* General approaches exists to minimize\
    \ the f-divergence for, they are typically less effective than approaches tailored\
    \ for a specific divergence [1]\n\n> [1]f-GAN: Training Generative Neural Samplers\
    \ using Variational Divergence Minimization, Sebastian Nowozinin, Bobot Cesque,\
    \ Ryota Tomioka, NeurIPS 2016"
  merge: -1
