- pgno: 687
  md: "# # Wrap-Up Variational Bayes\n\n+   VB is a method for optimizing the data\
    \ likelihood of latent variable models\n* It introduces a variational distribution\
    \ $q_i(z)$ over the latent variable\n  - Variational distribution should approximate\
    \ posterior $q_i(z) \\approx p(z|x_i)$\n* ... decomposes the marginal likelihood\
    \ in a lower bound and a KL-term\n* The lower bound is in general easier to optimize\
    \ than the marginal log-likelihood:\n  - The integral has moved outside the log\n\
    \  - More direct sampling in latent space by sampling from approximate posterior\
    \ $q_i(z)$ instead of prior $p(z)$\n  - No guarantee that we also improve marginal\
    \ loglikelihood (except in the special case of EM)\n* Expectation Maximization\
    \ is a special case where posterior can be computed analytically\n* Most prominent\
    \ application of VB is the Variational Auto-Encoder"
  merge: -1
  img_proc: true
