    $$= h_{c_{i,k}} \phi(\mathbf{x}_i) - \frac{1}{\sum_{j=1}^{K} \exp \left( w_j^T
    \phi(\mathbf{x}_i) \right)}} \phi(\mathbf{x}_i)$$

    $$= \phi(\mathbf{x}_i) \quad \left( h_{c_{i,k}} - p(k|\mathbf{x}_k) \right)$$

    feature vector $\quad$ "soft-max error""

    ```'
