  md: "# Graph Attention\n\n# Multi-Head Attention:\n\nLast layer\n\n$$\\vec{h}_i'\
    \ = \\sigma \\left(\\frac{1}{K} \\sum_{k=1}^K \\sum_{j \\in \\mathcal{N}_i} \\\
    alpha_{ij}^k \\mathbf{W}^k \\vec{h}_j\\right)$\n\nPrevious layers\n\n$$\\vec{h}_i'\
    \ = ||| \\sigma \\left(\\sum_{j \\in \\mathcal{N}_i} \\alpha_{ij}^k \\mathbf{W}^k\
    \ \\vec{h}_j\\right)$\n\n+   - K different heads\n  - Averaged in last layer,\
    \ concatenated for previous layers\n- ||| denotes the concatenation\n\n$$\\exp\
    \ \\left(\\text{LeakyReLU} \\left(\\vec{a}^T [\\vec{h}_i ||| \\vec{h}_j]\\right)\\\
    \right) / \\sum_{k \\in \\mathcal{N}_i} \\exp \\left(\\text{LeakyReLU} \\left(\\\
    vec{a}^T [\\vec{h}_i ||| \\vec{h}_k]\\right)\\rightright)$\n\n# Attention Weights:\
    \ $\\alpha_{ij} = $\n\n+   - Softmax activation\n- Parametrized by $\\mathbf{W}\
    \ \\in \\mathbb{R}^{F' \\times F}$ and $\\vec{a} \\in \\mathbb{R}^{2F'}$"
  merge: -1
