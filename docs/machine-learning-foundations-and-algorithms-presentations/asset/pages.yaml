    \ for all words using their keys\n  - Compute updated representation for the word\
    \ as attention-weighted sum of values of all words\n\n+   - The updated representation\
    \ for the word is the attention-weighted sum of the values for all words\n  -\
    \ Including itself"
  merge: -1
