- pgno: 412
  md: '# # Regularization penalty


    Can be used for most optimization-based algorithms


    +   - Linear Regression + Classification, Neural Networks, GPs, ...


    We, typically optimize a (sample-based) **loss plus a regularization penalty**


    $$\arg_{\text{parameters } \theta} \sum_{i=1}^{N} l(\boldsymbol{x}_i, \theta)
    + \lambda \text{penalty}(\theta)$


    +   - Penalty keeps parameters small

    - Small parameters -> **smoother function** estimate

    - Implicitly **limits the complexity** of the learned model (larger lambda ->
    smaller complexity)'
  merge: -1
  img_proc: true
- pgno: 413
  md: "# # Regularization penalty\n\nWhich penalty functions can we use?\n\n+   -\
    \ $L_2$ penalty: $\text{penalty}(\theta) = ||\theta||_2 = \\sum_{d} \theta_d^2$\n\
    - Easy to optimize (strongly convex)\n- Redundant parameters will be close to\
    \ 0, but never 0\n- Also called **weight decay** for gradient based methods...\n\
    - Heavily used with DNNs\n\n![](img/f01928df50903c99ce023dd3c527a33d_413_0.png)\n\
    \n+   - $L_1$ penalty: $\text{penalty}(\theta) = ||\theta||_1 = \\sum_{d} |\t\
    heta_d|$\n- Induces **sparse** solutions\n- Called “Lasso” regularization\n- Much\
    \ harder to optimize (not in this lecture), rarely used\n\n![](img/f01928df50903c99ce023dd3c527a33d_413_1.png)\n\
    \nGerhard Neumann | Machine Learning | KIT | SS 2023"
  merge: -1
  img_proc: true
