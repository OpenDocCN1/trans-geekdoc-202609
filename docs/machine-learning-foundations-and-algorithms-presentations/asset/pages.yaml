    \ output using $s_0$\n  - Compute raw weights, followed by softmax\n- Compute\
    \ \"context\" $c_1$\n  - Weighted sum of input hidden representations\n- Input\
    \ $c_1$ and first output word to the decoder\n  - In practice we enter the *embedding*\
    \ of the word\n\n```\n$g(h_i, s_0) = h_i^T W s_0$\n$e_i(1) = g(h_i, s_0)$\nw_i(1)\
    \ = \\frac{\\exp(e_i(1))}{\\sum_j \\exp(e_j(1))}, c_1 = \\frac{1}{N} \\sum_i^N\
    \ w_i(1)h_i$\n```"
  merge: -1
