- pgno: 889
  md: '# GPs: Summary


    +   - GPs are a non-parametric Bayesian approach to regression with possibly infinite
    feature spaces


    +   - Can estimate predictive uncertainty by integrating out model uncertainty


    +   - Resulting prediction equations are “straightforward” and obtained in closed-form
    because of the Gaussian properties


    +   - Hyperparameter optimization more complex, non-convex and expensive


    +   - While GP for Regression is computationally very expensive, it is one of
    the most principled approaches to statistical learning for regression


    +   - For small data-sets, they typically also outperform Neural Nets by a large
    margin'
