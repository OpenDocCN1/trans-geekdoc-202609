- pgno: 669
  md: '# # Optimization over the variational distribution


    $$\mathcal{L}(q, p) = \frac{1}{N} \sum_{i} \int q_{\varphi}(\mathbf{z}|\mathbf{x}_i)
    \log p_{\varphi}(\mathbf{x}_i|\mathbf{z}) d\mathbf{z} - KL(q_{\varphi}(\mathbf{z}|\mathbf{x}_i)
    || p_{\varphi}(\mathbf{z}))$$


    **But: How can we optimize over the sampling distribution $q_{\varphi}(\mathbf{z}|\mathbf{x})$
    ?**


    +   - Different to standard max-likelihood: Here, samples are not fixed but generated!


    +   - Reparameterization trick!!'
  merge: -1
  img_proc: true
- pgno: 670
  md: "# # Reparameterization Trick\n\nWe want to optimize distribution $p_{\theta}(x)$\
    \ using the following expected objective\n\n$$$\theta^* = \\text{argmin}_{\\theta}\
    \ \\mathbb{E}_{p_{\theta}}[f(x)] = \\int p_{\theta}(x)f(x)dx$$\n\n... and we are\
    \ given $\\frac{df}{dx}(x)$. How can we exploit this information?\n\nWe can reparameterize\
    \ the expectation:\n\n+   - Introduce random variable $\\xi \\sim q(\\xi)$ where\
    \ q is a simple, parameter-free distribution (e.g., $\\xi \\sim \\mathcal{N}(\\\
    mathbf{0}, I)$)\n- If we can find a mapping $x = h_{\theta}(\\xi)$ such that $x$\
    \ is distributed as $x \\sim p_{\theta}(x)$ then:\n\n$$\\int p_{\theta}(x)f(x)dx\
    \ = \\int q(\\xi)f(h_{\theta}(\\xi))d\\xi$$\n\n> We moved the parameters from\
    \ distribution $p_{\theta}(x)$ into a function $h_{\theta}(\\xi)$"
  merge: -1
  img_proc: true
- pgno: 671
  md: "# # Reparameterization Trick\n\nExample: Lets $p_\theta(x) = \\mathcal{N}(\b\
    oldsymbol{\\mu}, \boldsymbol{\\Sigma})$ and $q(\\xi) = \\mathcal{N}(\\mathbf{0},\
    \ \\mathbf{I})$. If we set\n$h_\theta(\\xi) = \boldsymbol{\\mu} + \\mathbf{A}^T\\\
    xi$, with $\theta = \\{\boldsymbol{\\mu}, \boldsymbol{\\Sigma}\\}$ and $\\mathbf{A}^T\\\
    mathbf{A} = \boldsymbol{\\Sigma}$\nThen $x' = h_\theta(\\xi)$ is distributed with\
    \ $p(x') = \\mathcal{N}(\boldsymbol{\\mu}, \\mathbf{A}^T\\mathbf{IA}) = \\mathcal{N}(\b\
    oldsymbol{\\mu}, \boldsymbol{\\Sigma})$\n\n**Reparameterization Trick:**\n\n$\\\
    int p_\theta(x)f(x)d\\mathbf{x} = \\int q(\\xi)f(h_\theta(\\xi))d\boldsymbol{\\\
    xi}$\n\n**Reparameterized Gradient:**\n\n$\nabla_\theta\\mathbb{E}_{p_\theta}[f(x)]\
    \ = \nabla_\theta \\int q(\\xi)f(h_\theta(\\xi))d\boldsymbol{\\xi} = \\int q(\\\
    xi)\\frac{\\partial h_\theta}{\\partial\theta}(\boldsymbol{\\xi})\\frac{\\partial\
    \ f}{\\partial\\mathbf{x}}(h_\theta(\\xi))d\boldsymbol{\\xi}$\n\n+   - We can\
    \ now use the gradient $\\frac{\\partial f}{\\partial\\mathbf{x}}$ to compute\
    \ $\nabla_\theta\\mathbb{E}_{p_\theta}[f(x)]!$"
  merge: -1
  img_proc: true
