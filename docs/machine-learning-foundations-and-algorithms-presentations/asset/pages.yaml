- pgno: 270
  md: '# # Feedforward Neural Networks


    Formalisation:


    +   - Each layer computes a function, so the network computes a composition of
    functions:


    $\mathbf{h}^{(1)} = f^{(1)}(\mathbf{x})$

    $\mathbf{h}^{(2)} = f^{(2)}(\mathbf{h}^{(1)})$

    $\vdots$

    $\mathbf{y} = f^{(L)}(\mathbf{h}^{(L-1)})$

    - Or more simply: $\mathbf{y} = f^L \circ f^{L-1} \circ \dots f^{(1)}(\mathbf{x})$

    - Neural nets provide modularity: we can implement each layer''s computations
    as a black box.


    ![](img/f01928df50903c99ce023dd3c527a33d_270_0.png)'
  merge: -1
  img_proc: true
