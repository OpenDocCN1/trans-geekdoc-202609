    \ P |\n|---|---|---|n| hot | sun | 0.4 |\n| hot | rain | 0.1 |\n| cold | sun |\
    \ 0.2 |\n| cold | rain | 0.3 |\n\n$P(w) = \\sum_{t} P(t, w)$\n\n$P(W)\n| W | P\
    \ |\n|---|---|n| sun | 0.6 |\n| rain | 0.4 |"
