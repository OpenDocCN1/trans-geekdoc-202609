- pgno: 892
  md: '# Motivation


    In Bayesian Learning, we need to sample from complex (posterior) distributions...


    ```

    $p(\theta|\mathcal{D}) = \frac{p(\mathcal{D}|\theta)p(\theta)}{p(\mathcal{D})}$$

    ```


    Yet, these sampling from these distributions is quite inefficient...


    +   - Can theoretically be done via Monte-Carlo Markov Chain Sampling

    - Computationally very expensive


    Can we approximate $p(\theta|\mathcal{D})$ by a simpler distribution we can sample
    from?


    +   - Yes: Optimization!


    Optimization on functions and distributions is called Variational Inference'
  merge: -1
  img_proc: true
