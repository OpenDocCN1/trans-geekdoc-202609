    \ \bar{\\mu}_t, \bar{\\Sigma}_t)$\n\n$$\bar{\\mu}_t = \\frac{\\sqrt{\\alpha_t}(1-\t\
    ilde{\\alpha}_t)}\\mathbf{x}_t + \\sqrt{\tilde{\\alpha}_{t-1}}(1-\\alpha_t)}\\\
    mathbf{x}_0}{1-\bar{\\alpha}_t}, \\quad \bar{\\Sigma}_t = \\frac{(1-\\alpha_t)(1-\b\
