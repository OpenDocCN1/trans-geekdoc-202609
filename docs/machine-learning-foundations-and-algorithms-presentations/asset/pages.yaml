- pgno: 260
  md: '# # Feedforward Neural Networks


    Building a network:


    +   - We can connect lots of units together into a directed acyclic graph.

    - This gives a feed-forward neural network. That''s in contrast to recurrent neural
    networks, which can have cycles.

    - Typically, units are grouped together into layers.


    ![](img/f01928df50903c99ce023dd3c527a33d_260_0.png)'
  merge: -1
  img_proc: true
- pgno: 261
  md: "# Feedforward Neural Networks\n\n+   * Each layer connects $N$ input units\
    \ to $M$ output units.\n* In the simplest case, all input units are connected\
    \ to all output units. We call this a **fully connected layer**.\n* **Note**:\
    \ the inputs and outputs for a layer are distinct from the inputs and outputs\
    \ to the network.\n\n+   * I.e., each layer has a M x N weight matrix **W**\n\
    * Equation in matrix form:\n\n$$\\mathbf{y} = \\phi(\\mathbf{Wx} + \\mathbf{b})$$\\\
