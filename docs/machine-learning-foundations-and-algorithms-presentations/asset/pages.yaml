  md: "# Motivation\n\nGenerative Models:\n\n+   - We want to learn a model that can\
    \ sample from the unknown data distribution $p(x)$ or a conditional distribution\
    \ $p(x|y)\n  - i.e. the model can generate different answers given the same input\n\
    \n+   - For some of these models, we will directly learn the densities $p(x)$\
    \ or $p(x|y)$\n  - E.g. Language models (transformers), Gaussian mixtures\n\n\
    +   - For some of these models we just learn how to sample:\n  - Diffusion, VAEs,\
    \ GANs...\n  - (density is hard to evaluate in this case)\n\nIn this lecture,\
    \ we will learn the basics, but more specialized lectures cover this topic deeper"
