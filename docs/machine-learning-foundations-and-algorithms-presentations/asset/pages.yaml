- pgno: 425
  md: '# Dropout


    # Why is this a good idea?


    +   - Forces the network to have a redundant representation;

    - Prevents co-adaptation of features


    ![](img/f01928df50903c99ce023dd3c527a33d_425_0.png)


    # Interpretation as ensembles:


    +   - Dropout is training a large ensemble of models (that share parameters).

    - Each binary mask is one model

    - An FC layer with 4096 units has $2^{4096} \sim 10^{1233}$ possible masks!'
  merge: -1
  img_proc: true
- pgno: 426
  md: '# # Dropout: Testing


    ![](img/f01928df50903c99ce023dd3c527a33d_426_0.png)


    # ## The output of the network is now random:


    +   - For testing, we want to **evaluate the expectation**!


    # ## Ensemble view:


    +   - Average over multiple dropout masks (computationally expensive but quite
    robust)

    - Also allows to get uncertainty estimates (not covered)


    # ## Expectation view:


