- pgno: 615
  md: "# # Estimating Gaussian Mixture Models\n\nSo why is optimizing $\\mathcal{L}\
    \ = \\sum_{i=1}^{N} \\log p_{\theta}(\boldsymbol{x}_i)$ so hard?\n\n+   - Because\
    \ we do not know which mixture component k created which data-point\n- If we would\
    \ have data from the joint distribution $p(\boldsymbol{x}_i, k_i|\theta)$, then\
    \ it would be easy ...\n\nIn this case, we can simply perform a maximum likelihood\
    \ estimate:\n\n+   - Coefficients: $\\pi_k = \\frac{\\sum_i q_{ik}}{N}$\n- Means:\
    \ $\\mu_k = \\frac{\\sum_i q_{ik}\boldsymbol{x}_i}{\\sum_i q_{ik}}$\n- Covariances:\
    \ $\boldsymbol{\\Sigma}_k = \\frac{\\sum_i q_{ik}(\boldsymbol{x}_i - \\mu_k)(\b\
    oldsymbol{x}_i - \\mu_k)^T}{\\sum_i q_{ik}}$\n\nwhere $q_{ik} = \\mathbb{I}(k,\
    \ k_i)$ is 1 if the ith sample belongs to the kth component and 0 otherwise"
  merge: -1
  img_proc: true
- pgno: 616
  md: '# # Expectation-Maximization: Chicken and Egg...


    Yet, we do not know which component belongs to which sample


    +   - Can we estimate that? Given a current mixture model, yes!


    +   - Compute cluster probabilities aka responsibilities for each sample (Bayes
    rule)


    $$q_{ik} = p(k_i = k|x_i) = \frac{p(x_i|k)p(k)}{\sum_{j=1}^K \pi_j \mathcal{N}(x_i|\mu_j,
    \mathbf{\Sigma}_j)}$$


    - Responsibilities $q_{ik}$ are now continues between 0 and 1

    - But we need to know the Gaussian components'
  merge: -1
  img_proc: true
- pgno: 617
  md: "# Expectation-Maximization: Chicken and Egg...\n\nYet, we do not know which\
    \ component belongs to which sample\n\n+   - Can we estimate that? Given a current\
    \ mixture model, yes!\n\n+   - Maximization Step:\n  - Compute (weighted) maximum\
    \ likelihood estimate\n  \n  $$\\pi_k = \\frac{\\sum_i q_{ik}}{N} \\quad \\mu_k\
    \ = \\frac{\\sum_i q_{ik}\\mathbf{x}_i}{\\sum_i q_{ik}} \\quad \\mathbf{\\Sigma}_k\
    \ = \\frac{\\sum_i q_{ik}(\\mathbf{x}_i - \\mu_k)(\\mathbf{x}_i - \\mu_k)^T}{\\\
    sum_i q_{ik}}$$\n  - But we need to know the responsibilities"
  merge: -1
  img_proc: true
- pgno: 618
  md: "# Algorithm: EM for GMMs\n\n+   * **Initialize**: Mixture Components + Mixture\
    \ coefficients\n  - E.g. Use k-means for the component means and some initial\
    \ covariance\n\n+   * **Repeat** until convergence:\n  - **Expectation-step**:\
    \ Compute responsibilities\n  $$q_{ik} = \\frac{\\pi_k \\mathcal{N}(\boldsymbol{x}_i|\b\
    oldsymbol{\\mu}_k, \boldsymbol{\\Sigma}_k)}{\\sum_{j=1}^K \\pi_j \\mathcal{N}(\b\
    oldsymbol{x}_i|\boldsymbol{\\mu}_j, \boldsymbol{\\Sigma}_j)}$$\n  - **Maximization-step**:\
    \ Update coefficients, components means and component variance\n  $$\\pi_k = \\\
    frac{\\sum_i q_{ik} \boldsymbol{x}_i}{\\sum_i q_{ik}} \\quad \boldsymbol{\\Sigma}_k\
    \ = \\frac{\\sum_i q_{ik}(\boldsymbol{x}_i - \boldsymbol{\\mu}_k)(\boldsymbol{x}_i\
    \ - \boldsymbol{\\mu}_k)^T}{\\sum_i q_{ik}}$$"
  merge: -1
