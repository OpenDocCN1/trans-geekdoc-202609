- pgno: 166
  md: '# # Classification loss


    # ## Data log-likelihood:


    ```

    $\loglik(\mathcal{D}, \mathbf{w}) = \sum_{i=1}^{N} p(c_i|\phi(\mathbf{x}_i), \mathbf{w})
    = \sum_{i=1}^{N} c_i \log \sigma(\mathbf{w}^T \phi(\mathbf{x}_i)) + (1 - c_i)
    \log (1 - \sigma(\mathbf{w}^T \phi(\mathbf{x}_i)))$$\n$logi_{\dots} \dots$ loss
    of the ith sample

    ```


    # ## The logistic regression loss function is convex


    +   - i.e. there is only one minimum!

    - But no closed form solution exists... We need gradient descent!


    ```

    $\frac{\partial \loss_i}{\partial \mathbf{w}} = \frac{\partial}{\partial \mathbf{w}}
    (c_i \log \sigma(\mathbf{w}^T \phi(\mathbf{x}_i)) + (1 - c_i) \log (1 - \sigma(\mathbf{w}^T
    \phi(\mathbf{x}_i))) = ?$

    ```


    ```

    Hints: $\frac{d\sigma(\mathbf{x})}{d\mathbf{x}} = \sigma(\mathbf{x})(1 - \sigma(\mathbf{x}))$\n$\frac{d\log(f(\mathbf{x}))}{d\mathbf{x}}
    = \frac{1}{f(\mathbf{x})} \frac{df(\mathbf{x})}{d\mathbf{x}}$

    ```'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# # Gradient for Logistic Regression


    $\frac{\partial \text{loss}_i}{\partial \mathbf{w}} = \frac{\partial}{\partial
    \mathbf{w}}(c_i \log \sigma(\mathbf{w}^T \phi(\mathbf{x}_i)) + (1 - c_i) \log
    (1 - \sigma(\mathbf{w}^T \phi(\mathbf{x}_i))))$$

    = c_i \frac{1}{\sigma(\mathbf{w}^T \phi(\mathbf{x}_i))}\sigma(\mathbf{w}^T \phi(\mathbf{x}_i))(1
    - \sigma(\mathbf{w}^T \phi(\mathbf{x}_i)))\phi(\mathbf{x}_i)$$

    $+ (1 - c_i) \frac{1}{1 - \sigma(\mathbf{w}^T \phi(\mathbf{x}_i))}(--)\sigma(\mathbf{w}^T
    \phi(\mathbf{x}_i))(1 - \sigma(\mathbf{w}^T \phi(\mathbf{x}_i)))\phi(\mathbf{x}_i)$$\n=
    c_i(1 - \sigma(\mathbf{w}^T \phi(\mathbf{x}_i)))\phi(\mathbf{x}_i) - (1 - c_i)\sigma(\mathbf{w}^T
    \phi(\mathbf{x}_i))\phi(\mathbf{x}_i)$$\n= (c_i - \sigma(\mathbf{w}^T \phi(\mathbf{x}_i)))\phi(\mathbf{x}_i)$'
  merge: -1
  img_proc: true
