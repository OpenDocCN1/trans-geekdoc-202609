  md: '# # Binary Classification: New Definition


    **For SVMs, it simplifies notation to use +1 and -1 as class labels**


    **New definition:** Given the training data $(x_i, y_i)$, $i = 1..N$, with $x_i
    \in \mathbb{R}^d$ and $y_i \in \{-1, 1\}$ learn a classifier $f(x)$ such that:


    $f(x_i) = \begin{cases} > 0, & \text{if } y_i = 1 \ < 0, & \text{if } y_i = -1
