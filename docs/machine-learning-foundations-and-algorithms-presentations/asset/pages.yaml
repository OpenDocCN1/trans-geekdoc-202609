- pgno: 306
  md: "# # Stochastic Gradient Descent\n\n+   - Usually we are minimizing the empirical\
    \ loss (**batch gradient descent**)\n  $$\\frac{1}{n} \\sum_{i} l(x_i; \\theta)\
    \ \\quad \\theta_{t+1} = \\theta_t - \\frac{\\eta}{n} \\sum_{i} \\nabla_{\\theta}l(x_i;\
    \ \\theta_t)$$\n- We do this to to approximate the expected loss\n\n$$\\mathbb{E}_x\
    \ [l(\\boldsymbol{x}; \\theta)] \\quad \\theta_{t+1} = \\theta_t - \\eta \\mathbb{E}_x\
    \ [\\nabla_{\\theta}l(\\boldsymbol{x}; \\theta_t)]$$\n\n+   - Use a rougher, cheaper\
    \ approximation: **stochastic gradient descent**\n  $$l(\\boldsymbol{x}_i; \\\
    theta) \\quad \\theta_{t+1} = \\theta_t - \\eta \\nabla_{\\theta}l(\\boldsymbol{x}_i;\
    \ \\theta_t)$$\n- for random sample i"
  merge: -1
  img_proc: true
- pgno: 307
