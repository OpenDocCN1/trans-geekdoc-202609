- pgno: 968
  md: "# # Expected Improvement\n\n+   - Also considers magnitude of improvement\n\
    - Improvement at location x using function $g$:n  $I_t(g, \theta) = \\max(g(\t\
    heta) - g_{t-1}^*, 0)$\n\nAs g is unknown, we can estimate the **expected improvement**:\n\
    \n$EI_t(\theta) = \\mathbb{E}_{g \\sim GP(\\mathcal{D})}[I_t(\theta)|\\mathcal{D}]$,\
    \ where $\\mathcal{D} = [\theta_1, g_1, \\dots, \theta_{t-1}, g_{t-1}]$\n\n+ \
    \  - Can again be estimated for GPs, works better then probability of improvement\
    \ (PI)\n- Has a hyper-parameter $\\xi$ that can scale exploration\n- $\\xi$ is\
    \ always added to $g_{t-1}^*$ to pretend we have found a higher maximum\n  - Enforces\
    \ exploration"
  merge: -1
  img_proc: true
