- pgno: 388
  md: '# # Bias-Variance Decomposition


    Regression example: $y = f(x) + \epsilon, \quad \epsilon \sim N(0, \sigma^2)$


    **Expected Loss = Variance + Bias$^2$ + Noise**


    **Bias:**


    +   - Due to restriction of your model class

    - Also called “structure error”


    **Variance:**


    +   - Due to randomness of the data set


    **Noise:**


    +   - Nothing we can do about it...


    ![](img/f01928df50903c99ce023dd3c527a33d_388_0.png)'
  merge: -1
  img_proc: true
- pgno: 389
  md: "# Understanding the true risk\n\nRegression example: $y = f(\boldsymbol{x})\
    \ + \\epsilon, \\quad \\epsilon \\sim \\mathcal{N}(0, \\sigma^2)$\n\nExpected\
    \ Loss:\n\n```\n$R(\\hat{f}_{D_n}) = \\mathbb{E}_{x,y} \\left[(\\hat{f}_{D_n}(\b\
    oldsymbol{x}) - y)^2\\right]$\n```\n\n+   - $\\hat{f}_{D_n}$ is the estimate of\
    \ $f$ we obtain using data $D_n$\n\n+   - The expectation is done w.r.t all training-sets\
    \ $D_n$ of size $n$. What does that mean?\n\n+   - Assume there is a process that\
    \ can generate data sets with n data-points, e.g.:\n\n+   - E.g., dample $\boldsymbol{x}$\
    \ uniformly in range $[-1,1]$\n\n+   - Sample $y_i$ as $y_i = f(\boldsymbol{x}_i)\
    \ + \\epsilon, \\quad \\epsilon \\sim \\mathcal{N}(0, \\sigma^2)$\n\n+   - Repeat\
    \ n times\n\n+   - The expectation averages the error over all training-sets $D_n$\n\
    \nExpected error for training with a specific dataset Expectation is done w.r.t\
    \ to all possible inputs and corresponding outputs"
  merge: -1
  img_proc: true
- pgno: 390
  md: '# Understanding the true risk


    **Regression example:** $y = f(\boldsymbol{x}) + \epsilon, \quad \epsilon \sim
    \mathcal{N}(0, \sigma^2)$


    **Expected Loss:**


    $R(\hat{f}_{D_n}) = \mathbb{E}_{D_n} [\mathbb{E}_{x,y} [(\hat{f}_{D_n}(\boldsymbol{x})
    - y)^2]]$

    = \mathbb{E}_{D_n} [\mathbb{E}_{x} [(\hat{f}_{D_n}(\boldsymbol{x}) - \hat{f}_*(\boldsymbol{x}))^2]]
    + \mathbb{E}_{x} [(\hat{f}_*(\boldsymbol{x}) - f(\boldsymbol{x}))^2] + \sigma^2$

    \quad \text{Variance} \quad \text{Bias}^2$


    +   - $\hat{f}_*(\boldsymbol{x}) = \mathbb{E}_{D_n}[\hat{f}_{D_n}(\boldsymbol{x})]$
    is the average estimate, averaged over all data de sets of size n

    - ... which can approximately be seen as training with infinite data

    - ... can be seen as “best achievable fit” with the given function class


    ![](img/f01928df50903c99ce023dd3c527a33d_390_0.png)'
  merge: -1
  img_proc: true
- pgno: 391
  md: "# # Bias-Variance Decomposition\n\nObservations:\n\n+   - We can not get better\
    \ than the noise\n\nBias: $\\mathbb{E}_x \\left[\\left(\\hat{f}_*(\boldsymbol{x})\
    \ - f(\boldsymbol{x})\right)^2\right]$\n\n+   - Difference of true function to\
    \ the “best” estimate\n- The best you can do with your model class\n- Also called\
    \ “structure error”\n\nVariance: $\\mathbb{E}_{D_n} \\left[\\mathbb{E}_x \\left(\\\
    hat{f}_{D_n}(\boldsymbol{x}) - \\hat{f}_*(\boldsymbol{x})\right)^2\right\right]$\n\
    \n+   - Difference of the estimates to the “best” estimate\n- Due to limited size\
    \ of the data set\n- Depends on number of data-points\n- Also called “estimation\
    \ error”\n\n![](img/f01928df50903c99ce023dd3c527a33d_391_0.png)"
  merge: -1
  img_proc: true
