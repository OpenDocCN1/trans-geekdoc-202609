  md: '# Example: Gene Expression


    +   - Given gene expression levels in the form of a time series

    - Want to detect if a gene is expressed or not, fit a GP to each gene [Kalaitzis
    and Lawrence, 2011]


    RESEARCH ARTICLE Open Access


    # A Simple Approach to Ranking Differentially Expressed Gene Expression Time Courses
    through Gaussian Process Regression


    Alfredo A Kalaitzis and Neil D Lawrence*


    Abstract

    **Background:** The analysis of gene expression from time series underpins many
    biological studies. Two basic forms of analysis recur for data of this type: removing
    inactive (quiet) genes from the study and determining which genes are differently
    expressed. Often these analysis stages are applied disregarding the fact that
    the data is drawn from a time series. In this paper we propose a simple model
    for accounting for the temporal nature of the data based on a Gaussian process.

    **Results:** We review Gaussian process (GP) regression for estimating the continuous
    trajectories underlying in gene expression time-series. We present a simple approach
    to machine learning which genes, or cases of the time series in the form of expression
    ratios, quantitative difference. We assess via ROC curves the curves'
