  md: '# Bayes Rule


    **Bayes rule** is one of the most important equations in probability theory and
    in machine learning


    ```

    $p(x|y) = \frac{p(y|x)p(x)}{p(y)} = \frac{p(y|x)p(x)}{\sum_{x''} p(y|x'')p(x'')}$

    ```


    ![](img/f01928df50903c99ce023dd3c527a33d_110_0.png)


    +   - Way of “reversing” the conditional probabilities

    - Often one conditional is tricky but the other one is simple

    - One of the most important equations for ML!'
