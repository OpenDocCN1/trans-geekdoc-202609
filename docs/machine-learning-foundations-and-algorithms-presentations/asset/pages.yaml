- pgno: 73
  md: "# Matrix Calculus - Denominator-layout notation\n\nDerivatives of a scalar\
    \ function w.r.t a vector...\n\n+   - Yields the gradient vector: $\\nabla_{\\\
    mathbf{x}}f = \begin{bmatrix} \\frac{\\partial f(x)}{\\partial x_1} \\ \\vdots\
    \ \\ \\frac{\\partial f(x)}{\\partial x_d} \\end{bmatrix}$\n- Example: Quadratic\
    \ form $\\nabla_{\\mathbf{x}}\\mathbf{x}^T \\mathbf{x} = 2\\mathbf{x}$\n\nDerivatives\
    \ of a vector-valued function w.r.t a scalar...\n\n+   - Yields a matrix (the\
    \ Jacobian) $\\nabla_{\\mathbf{x}}\\mathbf{f} = \begin{bmatrix} \\frac{\\partial\
    \ f_1(\\mathbf{x})}{\\partial x} & \\dots & \\frac{\\partial f_k(\\mathbf{x})}{\\\
    partial x} \\end{bmatrix}$\n- Example: Linear form $\\nabla_{\\mathbf{x}}\\mathbf{xa}\
    \ = \\mathbf{a}^T$"
  merge: -1
