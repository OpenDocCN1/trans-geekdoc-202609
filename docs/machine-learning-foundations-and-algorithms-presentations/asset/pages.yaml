  md: '# # Chain rule with tensors


    For weight matrices:


    ```

    $$\frac{\partial W\mathbf{x} + b}{\partial W} = \mathcal{T}_{ijd} \text{ with
    } \mathcal{T}_{[.,\cdot]d} = \frac{\partial z_d}{\partial W} = \begin{bmatrix}
