- pgno: 965
  md: '# Acquisition functions


    Pure exploration: Only final results counts


    +   - Probability of improvement (PI)

    - Expected improvement (EI)


    Exploration/Exploitation trade-off: Also intermediate results should be good


    +   - Gaussian Process Upper Confidence Bounds (GP-UCB)


    There is no clear winner, but many more exist in the literature...


    +   - Current SOTA: Predictive Entropy Search'
  merge: -1
  img_proc: true
- pgno: 966
  md: "# Probability of Improvement (PI)\n\n**Pure exploration:** only interested\
    \ in final result\n\n+   - Let $g^*_{t-1} = \\max(g(\theta_1), \\dots, g(\theta_{t-1}))$\
    \ be the so far seen maximum\n- Probability of improvement at location x: $PI_t(\t\
    heta) = \text{Pr}[g(\theta) \\geq g_{t+1}^*]$\n\n**Properties:**\n\n+   - Can\
    \ be computed quite easily for GPs\n- Does not consider the magnitude of improvement\n\
    - Assumes noise-free setting"
  merge: -1
  img_proc: true
