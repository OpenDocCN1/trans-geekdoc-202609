- pgno: 674
  md: "# # Back to optimization over the variational distribution\n\n+   - Lower bound:\
    \ $\\mathcal{L}(q, p) = \\frac{1}{N} \\sum_{i} \\int q_\\phi(\boldsymbol{z}|\b\
    oldsymbol{x}_i) \\log p_\\varphi(\boldsymbol{x}_i|\boldsymbol{z}) d\boldsymbol{z}\
    \ - \text{KL}(q_\\phi(\boldsymbol{z}|\boldsymbol{x}_i) || p_\\varphi(\boldsymbol{z}))$\n\
    \n+   - Distribution: $q_\\phi(\boldsymbol{z}|\boldsymbol{x}) = \\mathcal{N}(\b\
    oldsymbol{z}|\\mu_\\phi(\boldsymbol{x}), \\sigma_\\phi^2(\boldsymbol{x})\boldsymbol{I})$\n\
    \n+   - Reparameterization function: $\boldsymbol{h}_\\phi(\boldsymbol{\\xi},\
    \ \boldsymbol{x}) = \\mu_\\phi(\boldsymbol{x}) + \\sigma_\\phi(\boldsymbol{x})\
    \ \\circ \boldsymbol{\\xi}$\n\n+   - Reparametrized lower bound:\n$\\mathcal{L}(q,\
    \ p) = \\frac{1}{N} \\sum_{i} \\int p(\boldsymbol{\\xi}) \\left( \\underbrace{\\\
    log p_\\varphi(\boldsymbol{x}_i|\boldsymbol{h}(\boldsymbol{\\xi}, \boldsymbol{x}_i))}_{\t\
    ext{reconstruction}} - \\underbrace{\\log q_\\phi(\boldsymbol{h}(\boldsymbol{\\\
    xi}, \boldsymbol{x}_i)|\boldsymbol{x}_i)}_{\text{KL-term}} \right)$"
  merge: -1
  img_proc: true
- pgno: 675
  md: "# Stochastic gradient descent...\n\n+   - Reparameterized lower bound from\
    \ before:\n\n$$\\mathcal{L}(q, p) = \\frac{1}{N} \\sum_{i} \\int p(\\xi) \\left(\
    \ \\underbrace{\\log p_{\\varphi}(\boldsymbol{x}_i|\boldsymbol{h}(\\xi, \boldsymbol{x}_i))}_{\t\
    ext{reconstruction}} + \\underbrace{\\log p_{\\varphi}(\boldsymbol{h}(\\xi, \b\
    oldsymbol{x}_i)) - \\log q_{\\phi}(\boldsymbol{h}(\\xi, \boldsymbol{x}_i)|\boldsymbol{x}_i)}_{\t\
    ext{KL-term}} \right) $$\n\n+   - Approximate integral by K samples\n\n$$\\mathcal{L}(q,\
    \ p) \\approx \\frac{1}{N} \\sum_{i} \\sum_{\\xi_{ik} \\sim p(\\xi)} \\left( \\\
    underbrace{\\log p_{\\varphi}(\boldsymbol{x}_i|\boldsymbol{h}(\\xi_{ik}, \boldsymbol{x}_i))}_{\t\
    ext{reconstruction}} + \\log p_{\\varphi}(\boldsymbol{h}(\\xi_{ik}, \boldsymbol{x}_i))\
    \ - \\log q_{\\phi}(\boldsymbol{h}(\\xi_{ik}, \boldsymbol{x}_i)|\boldsymbol{x}_i)\
    \ \right) \\ \\text{KL-term}$$\n\n+   - Standard case is to use only 1 sample\
    \ (K =1) of $\\xi_i$ for each data sample x\n\n$$\\mathcal{L}(q, p) \\approx \\\
    frac{1}{N} \\sum_{i} \\left( \\underbrace{\\log p_{\\varphi}(\boldsymbol{x}_i|\b\
    oldsymbol{h}(\\xi_i, \boldsymbol{x}_i))}_{\text{reconstruction}} + \\log p_{\\\
    varphi}(\boldsymbol{h}(\\xi_i, \boldsymbol{x}_i)) - \\log q_{\\phi}(\boldsymbol{h}(\\\
    xi_i, \boldsymbol{x}_i)|\boldsymbol{x}_i) \right) \\ \\\\text{KL-term}$$ $$"
  merge: -1
  img_proc: true
- pgno: 676
  md: '# Full training procedure


    ![](img/f01928df50903c99ce023dd3c527a33d_676_0.png)


    # ELBO (from previous slide):


    $\mathcal{L}(q, p) \approx \frac{1}{N} \sum_{i} \left( \log p_{\varphi}(\boldsymbol{x}_i|\boldsymbol{h}(\boldsymbol{\xi}_i,
    \boldsymbol{x}_i)) + \log p_{\varphi}(\boldsymbol{h}(\boldsymbol{\xi}_i, \boldsymbol{x}_i))
    \right) - \log q_{\phi}(\boldsymbol{h}(\boldsymbol{\xi}_i, \boldsymbol{x}_i)|\boldsymbol{x}_i)$


    +   - For t=1: T

    - Estimate $\frac{d\mathcal{L}(q,p)}{d\phi}$ and $\frac{d\mathcal{L}(q,p)}{d\varphi}$

    - Update $\phi, \varphi$


    +   - Update all of the parameters at the same time instead of using separate
    E, M steps

    - This is standard back propagation. Just use ELBO as loss, and run your favorite
    SGD variant'
  merge: -1
  img_proc: true
