- pgno: 509
  md: "# # Recap: Recurrent Models as Attention Models\n\n![](img/f01928df50903c99ce023dd3c527a33d_509_0.png)\n\
    \n+   - Problems:\n  - Because of the recurrence, the hidden representation for\
    \ any word is also influenced by all preceding words\n    - The decoder is actually\
    \ paying attention to the sequence, and not just the word\n  - **Recurrence is\
    \ sequential**, can not computed in parallel (slow)\n\nIf the decoder is automatically\
    \ figuring out which words of the input to attend to at each time, is recurrence\
    \ in the input even necessary?"
  merge: -1
