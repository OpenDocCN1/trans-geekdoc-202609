- pgno: 982
  md: "# # Covariance hyperparameters\n\n+   - The GP has its own hyper-parameters\
    \ $\\gamma$ to tune (Kernel parameters $\rho$, noise variance $\\sigma$)\n- Influence\
    \ the posterior and hence also the acquisition function\n\n![](img/f01928df50903c99ce023dd3c527a33d_982_0.png)\n\
    \n![](img/f01928df50903c99ce023dd3c527a33d_982_1.png)"
  merge: -1
  img_proc: true
- pgno: 983
  md: "# Selecting covariance hyperparameters\n\n**a) Optimize the marginal likelihood\
    \ under the Gaussian process:**\n\n$\\gamma^* = \\text{argmax}_\\gamma \\log p(\\\
    mathbf{r}_{1:t}|\\boldsymbol{\theta}_{1:t}, \\gamma, \\sigma)$,$\\log p(\\mathbf{r}_{1:t}|\\\
    boldsymbol{\theta}_{1:t}, \\gamma, \\sigma) = -\\frac{1}{2}\\mathbf{r}_{1:t}^T(\\\
    mathbf{K}_{\\gamma} + \\sigma\\mathbf{I})^{-1}\\mathbf{r}_{1:t} - \\frac{1}{2}\\\
    log|\\mathbf{K}_{\\gamma} + \\sigma\\mathbf{I}| - \\frac{t}{2}\\log 2\\pi$\n\n\
    +   - Can be done via gradient descent\n- Uses a single point estimate for hyper-parameters\n\
    \n**b) Bayesian treatment in acquisition function**\n\n+   - Integrate hyperparameters\
    \ out\n- $acq_t(\\boldsymbol{\theta}) = \\int acq_t(\\boldsymbol{\theta}, \\gamma,\
    \ \\sigma)p(\\gamma, \\sigma|\\mathbf{r}_{1:t}, \\boldsymbol{\theta}_{1:t})d\\\
    gamma,\\sigma$\n- Can be approximated using Monte-Carlo Markov Chain (MCMC) Sampling\n\
    - Tends to work better, but computationally much more expensive"
  merge: -1
  img_proc: true
