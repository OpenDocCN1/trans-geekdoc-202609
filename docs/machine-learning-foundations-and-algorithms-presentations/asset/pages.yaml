- pgno: 656
  md: "# Back to Latent Variable Models...\n\nRecap: latent variable models\n\n+ \
    \  - Examples: mixture models, missing data, latent factors, variational auto-encoders\n\
    - Observed variables: x, Latent variables: z\n\n+   - Parametric model: $p_{\t\
    heta}(\boldsymbol{x}, \boldsymbol{z}) = p(\boldsymbol{z})p_{\theta}(\boldsymbol{x}|\b\
    oldsymbol{z})$\n\n+   - Marginal distribution: $p_{\theta}(\boldsymbol{x}) = \\\
    int p(\boldsymbol{z})p_{\theta}(\boldsymbol{x}|\boldsymbol{z})d\boldsymbol{z}$\n\
    \n![](img/f01928df50903c99ce023dd3c527a33d_656_0.png)\n\nAt least the integral\
    \ $p_{\theta}(\boldsymbol{x}) = \\int p(\boldsymbol{z})p_{\theta}(\boldsymbol{x}|\b\
    oldsymbol{z})d\boldsymbol{z}$ is well-defined, but how can we compute it?\n\n\
    +   - The decoder $p_{\theta}(\boldsymbol{x}|\boldsymbol{z})$ is very complicated,\
    \ so there's no hope of finding a closed form."
  merge: -1
  img_proc: true
- pgno: 657
  md: '# Marginal Likelihood for Latent Variable Models


    (Marginal) Log-Likelihood:


    ```

    LogLik($\mathcal{D}$) = \sum_{i=1}^{N} \log p(\boldsymbol{x}_i) = \sum_{i=1}^{N}
    \log \left( \int p(\boldsymbol{x}_i|\boldsymbol{z})p(\boldsymbol{z})dz \right)
    \approx \sum_{i=1}^{N} \log \left( \frac{1}{M} \sum_{z_j \sim p(\boldsymbol{z})}
    p(\boldsymbol{x}_i|\boldsymbol{z}_j) \right)

    ```


    ... which is computationally infeasible for most continuous spaces


    +   Requires a lot of samples $\boldsymbol{z}_j$ for each $\boldsymbol{x}_i$ due
    to uninformed sampling of $\boldsymbol{z}_j$ (high variance in $p(\boldsymbol{x}|\boldsymbol{z})$)'
  merge: -1
  img_proc: true
- pgno: 658
  md: '# Variational Bayes


    Variational Bayes (VB) uses a lower bound of the marginal log-likelihood for the
    optimization


    +   - For simplicity, lets consider only a single data-point first


    $\log p(\boldsymbol{x}) = \int q(z) \log \frac{p(\boldsymbol{x}|z)p(z)}{q(z)}
    dz + \int q(z) \log \frac{q(z)}{p(\boldsymbol{x}|z)} dz$

    marginal log-like Lower Bound $\mathcal{L}(q)$ KL Divergence: $KL(q(z)||p(\boldsymbol{x}|z))$


    +   - Where $q(z)$ is called the variational / auxiliary distribution

    - This decomposition holds for any $q(z)$

    - By introducing $q(z)$, the optimization will become much simpler


    Why is that the same?


    +   - We can use Bayes rule for $p(z|\boldsymbol{x}) = \frac{p(\boldsymbol{x},
    z)}{p(\boldsymbol{x})}$ and all terms except $p(\boldsymbol{x})$ cancel


    > Note

    Expectation maximization is a special case of this decomposition

    Simplification in EM:

    - Posterior $p(z|\boldsymbol{x})$ can be computed in closed form

    - Examples: Gaussian Mixture Models, Probabilistic PCA'
  merge: -1
  img_proc: true
- pgno: 659
  md: "# Optimization in Variational Bayes\n\n**VB optimizes the lower bound** instead\
    \ of the log-likelihood\n\n```\n$$\\mathcal{L}(q, p) = \\int q(z) \\log \\left(p(\\\
    boldsymbol{x}|z)\\frac{p(z)}{q(z)}\right) dz = \\int q(z) \\log p(\\boldsymbol{x}|z)dz\
    \ - KL(q(z)||p(z))$$\n```\n\n+   - Why is it a lower bound? Since $KL(q||p) \\\
    geq 0$ it follows that $\\mathcal{L}(q, p) \\leq \\log p(\\boldsymbol{x})$\n-\
    \ Its also called **Evidence lower bound (ELBO)**, as the marginal likelihood\
    \ is often called evidence\n\n**Joint optimization of the lower bound** $\\mathcal{L}(q,\
    \ p)$ w.r.t $p$ and $q$ using stochastic gradient descent\n\n```\n$q^*, p^* =\
    \ \\arg \\max_{q,p} \\mathcal{L}(q, p)$\n```\n\n+   - In practice, $q_{\\phi}(z),\
    \ p_{\\varphi}(\\boldsymbol{x}|z)$ and $p_{\\varphi}(z)$ will be parametrized\
    \ distributions and we optimize over $\\phi$ and $\\varphi$\n- We always improve\
    \ the lower-bound, but there is no guarantee to improve the marginal likelihood\n\
    - Standard for most **continuous latent variable** models\n- Lower bound is only\
    \ tight if $KL(q(z)||p(z|x))$ can be set to 0. Thats only true for EM."
  merge: -1
  img_proc: true
- pgno: 660
  md: "# # EM Convergence Properties\n\n![](img/f01928df50903c99ce023dd3c527a33d_660_0.png)\n\
    \n+   - **EM improves the lower bound**\n  $\\mathcal{L}(q_{new}, \\theta_{new})\
    \ \\geq \\mathcal{L}(q_{old}, \\theta_{old})$\n  M-step: Lower bound is maximized\n\
    \  E-step: KL is set to 0, lower bound has to go up\n\n+   - **EM improves the\
    \ marginal likelihood**\n  $\\log p(x|\\theta_{new}) \\geq \\log p(x|\\theta_{old})$\n\
    \  M-step: Lower bound increases and KL increases (can't get smaller than 0)\n\
    \  Lower bound is always tight after E-step!\n  E-step: Marginal likelihood is\
    \ unaffected\n\n![](img/f01928df50903c99ce023dd3c527a33d_660_1.png)"
  merge: -1
  img_proc: true
- pgno: 661
  md: "# # Variational Bayes Convergence Properties\n\n+   - VB improves the lower\
    \ bound\n  $\\mathcal{L}(q_{new}, \theta_{new}) \\geq \\mathcal{L}(q_{old}, \t\
    heta_{old})$\n\n+   - M-step: Lower bound is maximized\n- E-step: KL is decreased\
    \ (but not set to 0), lower bound has to go up\n\n![](img/f01928df50903c99ce023dd3c527a33d_661_0.png)\n\
    \n+   - VB does not always improve the marginal likelihood (difference to EM)\
    \ !!\n\n+   - M-step: Lower bound increases but KL can also decrease (its not\
    \ 0)\n- Lower bound is not tight!\n- E-step: Marginal likelihood is unaffected\n\
    \n![](img/f01928df50903c99ce023dd3c527a33d_661_1.png)"
  merge: -1
  img_proc: true
- pgno: 662
  md: "# Objective for the variational distribution\n\nWhat does q learn?\n\n```\n\
    $KL(q(z)||p(z|\\underline{x})) = \\int q(z) \\log \\frac{q(z)}{p(z|\\underline{x})}\
    \ dz = \\int q(z) \\log \\frac{p(\\underline{x})q(z)}{p(z|\\underline{x})p(\\\
    underline{x})} dz = \\int q(z) \\log \\frac{q(z)}{p(z|\\underline{x})} dz + \\\
    text{const}$\\n$= -\\mathcal{L}(q,p) + \\text{const}$\n```\n\n$\\Rightarrow \\\
    argmin_q KL(q(z)||p(z|\\underline{x})) = \\argmax_q \\mathcal{L}(q,p)$\n\n+  \
    \ - By maximizing the variational lower bound $\\mathcal{L}(q,p)$ w.r.t $q(z)$,\
    \ the variational distribution will approximate the posterior, i.e., $q(z) \\\
    approx p(z|\\underline{x})$\n\n-  \n  - This minimization is also called Variational\
    \ Inference\n  - Target is moving as our posterior changes with the decoder $p(\\\
    underline{x}|z)$"
  merge: -1
  img_proc: true
- pgno: 663
  md: "# # Full-Dataset Lower Bound\n\n$$\\mathcal{L}(\\{q_i\\}, p) = \\frac{1}{N}\
    \ \\sum_{i} \\int q_i(z) \\log p(x_i|z)dz - KL(q_i(z)||p(z))$$\n\n+   - Introduced\
    \ individual variational distribution $q_i(z)$ for each data point\n- **More directed\
    \ sampling:**\n  - Instead of sampling from the uninformed prior $p(z)$ ...\n\
    \  - ... we can now sample from the variational distributions $q_i(z) \\approx\
    \ p(z|x_i)$\n  - Each $q_i(z)$ will produce **samples with high** $p(x|z)$ **once\
    \ optimized**!\n\n+   - **Integral is outside the log:**\n  - only one sample\
    \ from $q_i(z)$ needed to obtain unbiased estimate of the lower bound\n  - i.e.\
    \ suitable for **stochastic gradient descent** while the marginal loglikelihood\
    \ is not"
  merge: -1
  img_proc: true
- pgno: 664
  md: "# # Case 1: Expectation Maximization\n\n$$\\log p(\\boldsymbol{x}) = \\int\
    \ q(z) \\log \\frac{p(\boldsymbol{x}|z)p(z)}{q(z)} dz + \\int q(z) \\log \\frac{q(z)}{p(\b\
    oldsymbol{x}|z)} dz$$\n$$\\$\\text{marginal log-like} \\quad \\text{Lower Bound\
    \ } \\mathcal{L}(q) \\quad \\text{KL Divergence: } KL(q(z)||p(\\boldsymbol{x}|z))$$\n\
    \n**Expectation-Maximization** uses the same decomposition, but two separate optimization\
    \ steps\n\n+   - Maximization Step:\n  - Keep $q(z)$ fixed, maximize Lower bound\
    \ $\\mathcal{L}(q, p)$ w.r.t. model distribution $p_{\\varphi}(\boldsymbol{x}|z)$\
    \ and $p_{\\varphi}(z)$\n\n+   - Expectation Step:\n  - Keep model $p_{\\varphi}(\b\
    oldsymbol{x}|z)$ and $p_{\\varphi}(z)$ fixed, minimize KL w.r.t $q$\n  $$\\q^*\
    \ = \\arg \\min KL(q(z)||p(\\boldsymbol{x}|z))$$\n  $$\\rightarrow q^*(\boldsymbol{z})\
    \ = p(z|\\boldsymbol{x})$$$\n\n> > **Sidenote**\n- In EM the KL can be set to\
    \ zero (i.e. we can compute posterior $p_{\\varphi}(\boldsymbol{x}|z)$)\n- Only\
    \ works in special cases\n  - e.g. discrete $z$, GMMs\n- In this case the lower\
    \ bound is tight\n- increasing lower bound always increases marginal log-like"
  merge: -1
  img_proc: true
- pgno: 665
  md: "# # Case 2: Variational Bayes\n\nInstead of using an individual auxiliary distribution\
    \ $q_i(\\mathbf{z})$per data-point $\boldsymbol{x}_i $, we can use an “amortized”\
    \ distribution $q_{\\varphi}(\\mathbf{z}|boldsymbol{x}_i)$ that is given by a\
    \ DNN\n\n```\n$$\\mathcal{L}(q,p) = \\frac{1}{N} \\sum_{i} q_{\\varphi}(\\mathbf{z}|\\\
    boldsymbol{x}_i) \\log p_{\\varphi}(\\boldsymbol{x}_i|\\mathbf{z})dz - KL(q_{\\\
    varphi}(\\mathbf{z}|\\boldsymbol{x}_i)||p_{\\varphi}(\\mathbf{z}))$$\n```\n\n\
    This is the standard objective used for variational auto-encoders (VAE)\n\n+ \
    \  - Encoder $q_{\\varphi}(\\mathbf{z}|\\boldsymbol{x})$, Decoder $p_{\\varphi}(\\\
    boldsymbol{x}|\\mathbf{z})$, Latent Prior $p_{\\varphi}(\\mathbf{z})$\n- The lower\
    \ bound is directly optimized with respect to $\\boldsymbol{\\phi}$ and $\\boldsymbol{\\\
    varphi}$\n\nLower bound $\\mathcal{L}(q,p)$ is often called the Evidence Lower\
    \ Bound (ELBO) as it is the lower bound to $\\log p(\\boldsymbol{x})$ which is\
    \ often called the (log) evidence"
  merge: -1
  img_proc: true
