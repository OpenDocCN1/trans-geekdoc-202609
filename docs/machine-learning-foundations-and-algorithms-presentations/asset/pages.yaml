- pgno: 315
  md: '# Gradient Normalisation (RMSProp)


    +   - In plateaus, take large steps as they do not have much risk. In steep areas
    take smaller steps

    - Normalize gradient by running average of gradient norm


    ```

    $g_k = \nabla_\theta \mathcal{L}(\theta_k)$n$$v_{k+1,i} = \gamma v_{k,i} + (1
    - \gamma)g_{k,i}^2$$

    $$\theta_{k+1,i} = \theta_{k,i} - \frac{\eta}{\sqrt{v_{k+1,i} + \epsilon}}g_{k,i}$$

    ```


    +   - $v_{k,i}$ computes running average of the squared gradients (root mean square,
    RMS)

    - with a small $\epsilon$ to prevent division by zero

    - This algorithm is called ADADELTA or RMSProp


    > [Zeiler, 2012, ADADELTA - An Adaptive Learning Rate Method]'
  merge: -1
  img_proc: true
