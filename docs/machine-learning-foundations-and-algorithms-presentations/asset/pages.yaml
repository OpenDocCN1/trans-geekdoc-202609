- pgno: 169
  md: '# # Multiclass Classification


    We now have K class labels


    Softmax Likelihood function:


    ```

    p(c = i|\mathbf{x}) = \frac{\exp ((\mathbf{w}_i^T \phi(\mathbf{x})))}{\sum_{k=1}^K
    \exp ((\mathbf{w}_k^T \phi(\mathbf{x})))}

    ```


    +   - Each class gets a weight vector


    +   - Higher probability for class i if \mathbf{w}_i^T \phi(\mathbf{x}) is high


    +   - For K = 2, \mathbf{w}_2$ is redundant -> better to use sigmoid


    ![](img/f01928df50903c99ce023dd3c527a33d_169_0.png)'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# Recap: Multinomial distribution


    **Multinomial / Categorical Distribution:**


    +   - K different events: $C \in \{1, \dots, K\}$


    +   - Directly specifies probabilities: $p(C = k) = \mu_k, \quad \mu_k \geq 0,
    \quad \sum_{k=1}^K \mu_k = 1$


    +   - Or written with 1-hot-encoding (without an "if" clause)\n$p(c) = \prod_{k=1}^K
    \mu_k^{h_{c,k}}$ Depending on the class label of $x$, selects the correct $\mu_k$


    +   - where $h_c$ is the $K$-dimensional 1-hot-encoding vector, which is one for
    the dimension $c = k$ and 0 elsewhere. $h_{c,k}$ is the $k$-th element of this
    vector.


    +   - Think of it as tossing a die


    ![](img/f01928df50903c99ce023dd3c527a33d_170_0.png)'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# # Multiclass Classification


    The multi-class classification problem can be expressed as a conditional multinomial
    distribution:


    +   - I.e. the probability of the event $c$ depends on the input $\mathbf{x}$


    +   - We can again use the “exponential trick” to select the correct probability
    depending on $c$


    ```

    $p(c|\mathbf{x}) = \prod_{k=1}^{K} p(c=k|\mathbf{x})^{h_{c,k}}$$\n= \prod_{k=1}^{K}
    \left( \frac{\exp(\mathbf{w}_k^T \phi(\mathbf{x}_i))}{\sum_{k''=1}^{K} \exp(\mathbf{w}_{k''}^T
    \phi(\mathbf{x}_i))} \right)$

    ```'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# Data log-likelihood: $\text{loglik}(\mathcal{D}, \boldsymbol{w}_{1:K}) =
    \sum_{i=1}^N \log p(c_i|\boldsymbol{x}_i) = \sum_{i=1}^N \sum_{k=1}^K \boldsymbol{h}_{c_{i,k}}
    \log p(k|\boldsymbol{x}_i)$

    $loss_i...$ loss of the ith sample


    $= \sum_{i=1}^N \sum_{k=1}^K \boldsymbol{h}_{c_{i,k}} \left[ \boldsymbol{w}_k^T
    \phi(\boldsymbol{x}_i) - \log \left( \sum_{j=1}^K \exp(\boldsymbol{w}_j^T \phi(\boldsymbol{x}_i))
    \right) \right]$


    $= \sum_{i=1}^N \sum_{k=1}^K \boldsymbol{h}_{c_{i,k}} \boldsymbol{w}_k^T \phi(\boldsymbol{x}_i)
    - \log \left( \sum_{j=1}^K \exp(\boldsymbol{w}_j^T \phi(\boldsymbol{x}_i)) \right)
    \sum_{k=1}^K \boldsymbol{h}_{c_{i,k}}

    $independent from k$


    +   - Can again be optimized by gradient ascent'
  merge: -1
  img_proc: true
