    \ \\Phi^T \\mathbf{y} = \\sum_{i=1}^d w_i \\phi_i(\\mathbf{x})$\n$d \times d$\
    \ matrix inversion\n\n+   - Use if d < N\n\n+   - Kernel Ridge Regression\n\n\
    $f(\\mathbf{x}) = \\phi(\\mathbf{x})^T \\mathbf{w}^* = \\phi(\\mathbf{x})^T \\\
    Phi (\\Phi \\Phi^T + \\lambda \\mathbf{I})^{-1} \\ \\mathbf{y} = \\sum_{i=1}^N\
