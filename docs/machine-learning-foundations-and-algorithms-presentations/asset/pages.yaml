- pgno: 220
  md: '# # What is a kernel?


    # ## Representation by point-wise comparisons


    ![](img/f01928df50903c99ce023dd3c527a33d_220_0.png)


    +   - Define a "comparison function" $k: \mathcal{X} \times \mathcal{X} \to \mathbb{R}$

    - Represent a set of points $\mathcal{S} = {\mathbf{x}_1, \dots, \mathbf{x}_n\}$
    by the $n \times n$ matrix $[\mathbf{K}]_{ij} = k(\mathbf{x}_i, \mathbf{x}_j)$'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# Kernel Matrix (aka Gram Matrix)


    Properties:


    +   * **K** is always an $n \times n$ matrix, whatever the nature of data: the
    same algorithm will work for any type of data (vectors, strings, ...)

    * Total modularity between the choice of function k and the choice of the algorithm.

    * Poor scalability with respect to the dataset size ($n^2$) to compute and store
    **K**...

    * We will restrict ourselves to a particular class of pairwise comparison functions.'
  merge: -1
  img_proc: true
- pgno: 222
  md: "# Positive definite kernels\n\nA positive definite kernel function $k$ is a\
    \ function $k : \\mathcal{X} \times \\mathcal{X} \rightarrow \\mathbb{R}$ that\
    \ is:\n\n(i) Symmetric: $\\forall \\boldsymbol{x}, \\boldsymbol{x}' : k(\\boldsymbol{x},\
    \ \\boldsymbol{x}') = k(\\boldsymbol{x}', \\boldsymbol{x})$\n\n(ii) Similarity\
    \ matrix is always positive semi-definite (psd)\n\n$$\\boldsymbol{a}^T K \\boldsymbol{a}\
    \ = \\sum_{i=1}^{n} \\sum_{j=1}^{n} a_i a_j k(\\boldsymbol{x}_i, \\boldsymbol{x}_j)\
    \ \\geq 0, \\quad \\forall \\boldsymbol{a}, \\forall S = {\\boldsymbol{x}_1, \\\
    dots, \\boldsymbol{x}_n\\}$\n\n+   - Condition for psd matrices: all eigenvalues\
    \ >==\n\nKernel methods are algorithms that take such matrices as input."
  merge: -1
  img_proc: true
- pgno: 223
  md: "# Example: Linear kernel\n\nThe linear kernel is the simplest kernel for vectors\n\
    \n+   - Its defined by the scalar product:\n$k(\\mathbf{x}, \\mathbf{x}') = \\\
    langle\\mathbf{x}, \\mathbf{x}'\rangle$, where $\\langle\\cdot, \\cdot\rangle$\
    \ denotes the inner product\n- It is always positive definite:\n$\\sum_{i=1}^n\
    \ \\sum_{j=1}^n a_i a_j \\langle\\mathbf{x}_i, \\mathbf{x}_j\rangle = |\\sum a_i\
    \ \\mathbf{x}_i\\|^2 \\geq 0$"
  merge: -1
  img_proc: true
- pgno: 224
  md: "# Kernels in Feature Spaces\n\n![](img/f01928df50903c99ce023dd3c527a33d_224_0.png)\n\
    \nLet $\\phi : \\mathcal{X} \rightarrow \\mathbb{R}^d$ be an arbitrary feature\
    \ function, then $k(\boldsymbol{x}, \boldsymbol{x}') = \\langle\\phi(\boldsymbol{x}),\
    \ \\phi(\boldsymbol{x}')\rangle$ defines a positive definite kernel.\n\nProof:\
    \ $\\sum_{i=1}^n \\sum_{j=1}^n a_i a_j \\langle\\phi(\boldsymbol{x}_i), \\phi(\b\
    oldsymbol{x}_j)\rangle = \\left\\| \\sum_{i=1}^n a_i \\phi(\boldsymbol{x}_i) \r\
    ight\\|^2 \\geq 0$"
  merge: -1
  img_proc: true
- pgno: 225
  md: '# Kernels as inner products


    **Theorem (Aransjan 1950):**

    k$ is a positive semi-definite kernel on the set $\mathcal{X}$ if and only if
    there exists a feature space $\mathcal{H}$ and a feature mapping


    $\phi : \mathcal{X} \to \mathcal{H}$


    such that for any $x, x'' \in \mathcal{X}$ :


    $k(x, x'') = \langle \phi(x), \phi(x'') \rangle$


    +   - **Every psd kernel** comes with an associated **feature space**!'
  merge: -1
  img_proc: true
