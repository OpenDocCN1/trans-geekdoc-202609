- pgno: 940
  md: "# Overconfidence in Deep Learning\n\nLets apply different noise levels during\
    \ testing (i.e. out of distribution)\n\n![](img/f01928df50903c99ce023dd3c527a33d_940_0.png)\n\
    \n**Confidence:** How confident the neural network is (on average) \n**Accuracy:**\
    \ What is the actual prediction error?\n\n**Observations:**\n\n+   - There is\
    \ always a gap between confidence and accuracy (this gap is called calibration)\n\
    - This gap typically becomes bigger for a bigger distribution shift"
  merge: -1
