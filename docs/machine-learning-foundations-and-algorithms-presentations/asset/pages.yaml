- pgno: 227
  md: "# Example: polynomial kernel\n\nFor $\boldsymbol{x} = [x_1, x_2]^T$, let $\\\
    phi(\boldsymbol{x}) = [x_1^2, \\sqrt{2}x_1x_2, x_2^2]$\n\nThe kernel is defined\
    \ by:\n\n```\n$k(\\boldsymbol{x}, \\boldsymbol{x}') = x_1^2x_1'^2 + 2x_1x_2x_1'x_2'\
    \ + x_2^2x_2'^2$\n$= (x_1x_1' + x_2x_2')^2$\n$= \\langle \\boldsymbol{x}, \\boldsymbol{x}'\
    \ \\rangle^2$\n```\n\nKernel for polynomials of degree d:\n\n```\n$k(\\boldsymbol{x},\
    \ \\boldsymbol{x}') = \\langle \\boldsymbol{x}, \\boldsymbol{x}' \\rangle^d$\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 228
  md: "# # Example: Gaussian Kernel\n\nThe Gaussian kernel is defined by:\n\n```\n\
    $k(\\boldsymbol{x}, \\boldsymbol{y}) = \\exp\\left( -\frac{||\\boldsymbol{x} -\
    \ \\boldsymbol{y}||^2}{2\\sigma^2} \\right)$\n```\n\n+   - where $\\sigma$ is\
    \ the bandwidth parameter\n\n![](img/f01928df50903c99ce023dd3c527a33d_228_0.png)\n\
    \nOften also called:\n\n+   - Radial basis function kernel (RBF)\n- Squared exponential\
    \ kernel\n\nIt is the **most used kernel** for kernel methods"
  merge: -1
  img_proc: true
- pgno: 229
  md: '# # Is the Gaussian kernel a valid p.d. kernel?


    Yes! It can be shown that the kernel is a valid product of two infinite dimensional
    feature vectors


    +   - Consider the following feature function:

    \phi_{\mu}(x) = 1/Z \exp \left(\frac{\|x-\mu\|^2}{\sigma^2}\right), \\mu \in \mathbb{R}^d$

    - I.e. we have an infinite amount of features (for every possible center $\mu)$

    - Z is a normalization constant (which we will ignore)


    ![](img/f01928df50903c99ce023dd3c527a33d_229_0.png)


    The Gaussian kernel can be computed as (not shown):

    $k(x, y) = \exp \left(\frac{\|x-\y\|^2}{2\sigma^2}\right) = \langle \phi_{\mu}(x),
    \phi_{\mu}(y) \rangle = \int \phi_{\mu}(x)\phi_{\mu}(y)d\mu$


    +   - Inner product becomes an integral due to infinite amount of dimensions

    - We never have to represent these vectors if we can directly compute their inner
    products'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# Kernel Regression


