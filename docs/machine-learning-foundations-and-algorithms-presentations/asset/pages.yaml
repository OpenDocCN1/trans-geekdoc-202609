- pgno: 357
  md: '# Multivariable chain rule


    Suppose we have a function $f(x,y)$ and functions $x(t)$ and $y(t)$ (All the variables
    here are scalar-valued.) Then


    $\frac{d}{dt}f(x(t), y(t)) = \frac{\partial f}{\ x}\frac{dx}{dt} + \frac{\partial
    f}{\ y}\frac{dy}{dt}$


    ![](img/f01928df50903c99ce023dd3c527a33d_357_0.png)


    # Example:


    # Plug in Chain Rule:


    $f(x,y) = y + \exp(xy)\nx(t) = \cos t\ny(t) = t^2$


    $\frac{d}{dt}f(x(t),y(t)) = \frac{\partial f}{\ x}\frac{dx}{dt} + \frac{\partial
    f}{\ y}\frac{dy}{dt} = (y \exp(xy))(- \sin t) + (1 + x \exp(xy))(2t)$'
  merge: -1
  img_proc: true
