- pgno: 274
  md: "# Universal Function Approximation\n\n# So, is a single layer enough?\n\n+\
    \   - **NO!** Even though the Universal Approximation Theorem says a single layer\
    \ is enough, we would need an exponential number (in input dimensionality) of\
    \ units to achieve this\n  - If you can learn any function, you’ll just overfit.\n\
    - Instead, multiple layers allow for a similar effect with less units\n  - Compact\
    \ representation >> “Universal representation”"
