- pgno: 231
  md: "# Kernel Trick\n\n# So why do we do this?\n\n+   * Kernels can be used for\
    \ most feature based algorithms that can be rewritten such that they contain inner\
    \ products of feature vectors\n  - This is true for almost all feature based algorithms\
    \ (Linear regression, Support Vector Machines, ...)\n  - This is called the Kernel\
    \ Trick\n\n+   * Kernels can be used to map the data x in an infinite dimensional\
    \ feature space (i.e., a function space)\n  - The feature vector never has to\
    \ be represented explicitly\n  - As long as we can evaluate the inner product\
    \ of two feature vectors\n\n+   * Hence, we obtain a more powerful representation\
    \ than standard linear feature models"
  merge: -1
  img_proc: true
- pgno: 232
  md: '# A few kernel identities


    Let $\Phi_X = \begin{bmatrix} \phi(x_1)^T \ \vdots \ \phi(x_N)^T \end{bmatrix}
    \in \mathbb{R}^{N \times d}$ then the following identities hold:


    +   **Kernel matrix:** $K = \Phi_X \Phi_X^T$


    +   - Check: $[K]_{ij} = \phi(x_i)^T \phi(x_j) = k(x_i, x_j)$


    +   **Kernel vector:** $k(x^*) = \begin{bmatrix} k(x_1, x^*) \ \vdots \ k(x_N,
    x^*) \end{bmatrix} = \begin{bmatrix} \phi(x_1)^T \phi(x^*) \ \vdots \ \phi(x_N)^T
    \phi(x^*) \end{bmatrix} = \Phi_X \phi(x^*)$'
  merge: -1
  img_proc: true
- pgno: 233
  md: "# Kernel trick\n\n**Recap:** Ridge Regression\n\n+   - Squared error function\
    \ + L2 regularization\n- Linear feature space\n- Not directly applicable in infinite\
    \ dimensional feature spaces\n\nObjective:\n\n$L_{ridge} = (\\mathbf{y} - \\Phi\
    \ \\mathbf{w})^T(\\mathbf{y} - \\Phi \\mathbf{w}) + \\lambda \\mathbf{w}^T \\\
    mathbf{w}$\n\\text{sum of squared errors} \\quad L_2 \\text{ regularization}$\n\
    \nSolution:\n\n$\\mathbf{w}^*_{ridge} = (\\mathbf{\\Phi}^T \\mathbf{\\Phi} + \\\
    lambda \\mathbf{I})^{-1} \\mathbf{\\Phi}^T \\mathbf{y}$\nd \\times d \\text{ matrix\
    \ inversion} \\quad \text{Matrix inversion infeasible in infinite dimensions}$"
  merge: -1
  img_proc: true
- pgno: 234
  md: "# Kernel trick\n\nWe can apply the “kernel trick”:\n\n+   - Rewrite solution\
    \ as inner products of the feature space!\n- We can do this by using the following\
    \ matrix identity\n\n$(\\lambda \\mathbf{I} + \boldsymbol{AB})^{-1} \\mathbf{A}\
    \ = \\mathbf{A}(\\lambda \\mathbf{I} + \\boldsymbol{BA})^{-1}$\n\n> “Searle set\
    \ of identities”, The Matrix Cookbook\n\n$$\\mathbf{w}^* = \\underbrace{(\\boldsymbol{\\\
    Phi}^T \\boldsymbol{\\Phi} + \\lambda \\mathbf{I})^{-1}}_{d\\times d \\text{ matrix\
    \ inversion}} \\boldsymbol{\\Phi}^T \\mathbf{y} = \\underbrace{(\\boldsymbol{\\\
    Phi} \\boldsymbol{\\Phi}^T + \\lambda \\mathbf{I})^{-1}}_{N\\times N \\text{ matrix\
    \ inversion}} \\mathbf{y}$\n\n+   - With $\boldsymbol{A} = \\boldsymbol{\\Phi}^T$\
    \ and $\\boldsymbol{B} = \\boldsymbol{\\Phi}$"
  merge: -1
  img_proc: true
- pgno: 235
  md: "# The „tale of the two Pseudo Inverse“\n\n+   - Two side inverse: $A^{-1}A\
    \ = I, AA^{-1} = I$\n  - Standard matrix inversion... does often not exist\n\n\
    +   - Left-Pseudo Inverse (see linear regression):\n  $A_{left}^{\\dagger} = (A^T\
    \ A)^{-1}A^T, \\quad A_{left}^{\\dagger}A = (A^T A)^{-1}A^T A = I$\n\n+   - Right-Pseudo\
    \ Inverse:\n  $A_{right}^{\\dagger} = A^T(AA^T)^{-1}, \\quad AA_{right}^{\\dagger}\
    \ = AA^T(AA^T)^{-1} = I$\n\n**Difference:** Size of the matrix that needs to be\
    \ inverted\n\n+   - For regularized version, both are mathematically (but not\
    \ numerically) equivalent\n  $(A^T A + \\lambda I)^{-1}A^T = A^T(AA^T + \\lambda\
    \ I)^{-1}$"
  merge: -1
  img_proc: true
