- pgno: 931
  md: "# Stochastic Weight Averaging - Gaussian (SWAG)\n\nUse these moments to construct\
    \ a low-rank Gaussian approximation.\n\n```\n$$\\mu_{\theta} = \\frac{1}{T} \\\
    sum \\theta_t \\quad \\Sigma_{\\theta} = 0.5 \\left( \\frac{1}{T-1} \\sum (\\\
    theta_t - \\mu_{\theta})(\\theta_t - \\mu_{\theta})^T + \\frac{1}{T-1} \\sum \\\
    text{diag}(\\theta_t - \\mu_{\\theta})^2 \\right)$\n```\n\n+   - Low rank as less\
    \ samples T than dimensions\n- Form predictive distribution using $q(\\theta)\
    \ = \\mathcal{N}(\\mu_{\\theta}, \\Sigma_{\\theta})$ as posterior approximation\n\
    - Needs to be done “online” for the homework as we typically can not store so\
    \ many parameter vectors"
  merge: -1
  img_proc: true
