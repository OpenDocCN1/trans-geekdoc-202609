- pgno: 473
  md: "# # Long-term short-term memory (LSTM)\n\nContribution of old memory state\
    \ and current input is gated\n\n+   - **f**: Forget gate,\n  - whether to erase\
    \ cell\n- **i**: Input gate,\n  - whether to write to cell\n- **g**: Gate gate\
    \ (?)\n  - How much to write to cell\n- **o**: Output gate\n  - How much to reveal\
    \ cell\n\n![](img/f01928df50903c99ce023dd3c527a33d_473_0.png)\n\n**Next memory\
    \ state:**\n$c_t = f_t \\circ c_{t-1} + i_t \\circ g_t, \\quad h_t = o_t \\circ\
    \ \tanh(c_t)$"
  merge: -1
  img_proc: true
