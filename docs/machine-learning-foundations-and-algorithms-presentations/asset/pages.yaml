- pgno: 313
  md: "# Momentum term\n\n**Insight:** Compute running average for gradient (or other\
    \ quantities)\n\n+   - $m_0 = \\mathbf{0}$, $m_{k+1} = \\gamma m_k + (1 - \\gamma)g_k$,\
    \ where $g_k$ is the gradient.\n- Geometric Average (constant $\\gamma$ )\n\n\
    **Applied to the gradient update:**\n\n$\theta_{k+1} = \theta_k - \\eta m_{k+1}$\n\
    \n**Intuitively:** You can think of it as a “velocity term” for the update. The\
    \ gradient is in this view the acceleration."
  merge: -1
