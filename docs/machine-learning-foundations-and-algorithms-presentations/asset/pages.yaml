- pgno: 700
  md: '# Denoising Diffusion Models as VAEs


    Diffusion models are essentially Hierarchical VAEs with 3 restrictions:


    +   1. Latent dimension is the same as the data dimension

    2. The encoder q has no parameters to be learnt. It is defined to be a linear
    gaussian such that the $t th$ gaussian is centered around the previous latent
    $Z_{t-1}$

    3. The parameters for the gaussians are scheduled such that the final latent is
    a standard gaussian. $z_T \sim \mathcal{N}(z_T; 0, \mathbf{I})$


    ![](img/f01928df50903c99ce023dd3c527a33d_700_0.png)'
  merge: -1
  img_proc: true
