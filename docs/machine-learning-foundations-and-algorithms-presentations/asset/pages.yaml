- pgno: 308
  md: "# # Stochastic vs. Batch Gradients\n\n+   * **Blue**: Batch Gradients\n* **Red**:\
    \ Stochastic Gradients\n\n# ## Rule of thumb:\n\n+   * Stochastic methods work\
    \ well far away from optimum\n* But struggle to find the exact optimum\n\n# ##\
    \ Yet, it is more efficient then batch gradient descent!\n\n+   * For large datasets,\
    \ data points will be redundant\n* Hence, in batch GD, there is a lot of redundant\
    \ computation\n  * Does not scale to big neural networks with large datasets\n\
    * In SGD, we never compute the gradient for the same parameter vector twice\n\n\
