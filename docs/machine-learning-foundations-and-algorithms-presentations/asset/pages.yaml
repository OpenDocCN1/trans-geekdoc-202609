  md: "# 1-step: Compute posterior\n\nCompute the probability of “being right” for\
    \ a parameter $\theta$ using Bayes theorem:\n\n![](img/f01928df50903c99ce023dd3c527a33d_826_0.png)\n\
    \n![](img/f01928df50903c99ce023dd3c527a33d_826_1.png)\n\n+   - Prior: Can encode\
    \ our subjective belief\n- Posterior: Probability of parameter vector given the\
