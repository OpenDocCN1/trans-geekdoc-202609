  md: "# # What are GANs?\n\n![](img/f01928df50903c99ce023dd3c527a33d_754_0.png)\n\
    \n**Generative Models** which generate data similar to the training data . \n\
    e.g. Variational Autoencoders (VAE)\n\nNeural Networks\n\n**Adversarial Training**\n\
    GANS are made up of two competing networks (adversaries) that are trying beat\
    \ each other.\nA “game” is being played between the two."
  merge: -1
