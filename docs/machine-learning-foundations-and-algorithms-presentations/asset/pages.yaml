  md: "# Better: Probabilistic view, MLE\n\n+   - Given the training data $D = \\\
    {(x_i, y_i)\\}_{i=1...N}$ iid. from the data distribution $p_{data}$\n- Let $p_{\t\
    heta}(y|x)$ be a family of distributions parametrized by $\\theta \\in \\Theta$\\\
    n- We only care about distribution of $y$, not of $x$\n- Typical case in supervised\
    \ learning\n\n**Log-likelihood:\n\n```\n$loglik(\\theta; D) = \\sum_{i} \\log\
    \ p_{\\theta}(y_i|x_i)$\n```"
  merge: -1
  img_proc: true
- pgno: 148
  md: "# Distribution for binary classification\n\nBernoulli Distribution:\n\n+  \
    \ - Binary random variable $X \\in \\{0, 1\\}$\n\n+   - One parameter $p(X = 1)\
    \ = \\mu$\n\n+   - Probability distribution $p(x) = \\mu^x(1-\\mu)^{1-x}$\n  Depending\
    \ on x, selects either mu or 1-mu as probability\n\n+   - Think of it as tossing\
    \ a coin\n\n![](img/f01928df50903c99ce023dd3c527a33d_148_0.png)"
  merge: -1
  img_proc: true
- pgno: 149
  md: "# # Conditional Bernoulli as sigmoid\n\nDefine conditional probability distribution\
    \ of the class label\n\n$p(c = 1|\boldsymbol{x}) = \\sigma(\boldsymbol{w}^T \b\
    oldsymbol{x} + b), \\quad p(c = 0|\boldsymbol{x}) = 1 - \\sigma(\boldsymbol{w}^T\
    \ \boldsymbol{x} + b)$\n\n+   - This is now a **conditional Bernoulli** distribution.\
    \ i.e. the **outcome of the event c depends on \\boldsymbol{x}**\n- We can use\
    \ the same “exponential trick” to select the correct probability depending on\
    \ the value of c, i.e.\n\n$p(c|\boldsymbol{x}) = p(c = 1|\boldsymbol{x})^c p(c\
    \ = 0|\boldsymbol{x})^{1-c} = \\sigma(\boldsymbol{w}^T \boldsymbol{x} + b)^c (1\
    \ - \\sigma(\boldsymbol{w}^T \boldsymbol{x} + b))^{1-c}$"
  merge: -1
  img_proc: true
- pgno: 150
  md: "# # Log-Likelihood\n\nWe can now directly optimize the conditional Bernoulli\
    \ log-likelihood\n\n$$\text{loglik}(\tilde{\boldsymbol{w}}, D) = \\sum_{i} \\\
    log p(c_i|\boldsymbol{x}_i) = \\sum_{i} \\log p(c=1|\boldsymbol{x}_i)^{c_i} p(c=0|\b\
    oldsymbol{x}_i)^{1-c_i}$$\n$= \\sum_{i} c_i \\log p(c=1|\boldsymbol{x}_i) + (1-c_i)\
    \ \\log p(c=0|\boldsymbol{x}_i)$$\n$= \\sum_{i} c_i \\log \\sigma(\tilde{\boldsymbol{w}}^T\t\
    ilde{\boldsymbol{x}}_i) + (1-c_i) \\log (1-\\sigma(\tilde{\boldsymbol{w}}^T\t\
    ilde{\boldsymbol{x}}_i))$$\n\n+   - Negative likelihood is also often referred\
    \ to as cross-entropy loss"
  merge: -1
  img_proc: true
