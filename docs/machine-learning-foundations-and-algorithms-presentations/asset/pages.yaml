- pgno: 242
  md: "# # Summary: Kernel ridge regression\n\nThe solution for kernel ridge regression\
    \ is given by\n$f^*(x) = k(x)^T(K + \\lambda I)^{-1}y$\n\n+   - No evaluations\
    \ of the feature vectors needed\n- Only pair-wise scalar products (evaluated by\
    \ the kernel)\n- Need to invert a N x N matrix (can be costly)\n\nNote:\n\n+ \
    \  - We have to store all samples in kernel-based methods (they also belong to\
    \ the instance-based non-parametric methods)\n- Computationally expensive (matrix\
    \ inverse is $O(n^{2.376})$) !\n- Hyper-parameters of the method are given by\
    \ the kernel-parameters\n  - Can be optimized on validation-set\n- Very flexible\
    \ function representation, only few hyper-parameters"
  merge: -1
  img_proc: true
