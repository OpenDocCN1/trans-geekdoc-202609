- pgno: 830
  md: "# Priors\n\nPrior $p(\\theta)$ should capture our belief and domain knowledge\
    \ as well as possible\n\n# What is our domain knowledge for a general ML algorithm?\n\
    \n+   - For most ML algorithms, we know that the weights $\theta$ should be small\n\
    - This knowledge can be expressed with a Gaussian prior, e.g.\n\n$p(\\theta) =\
    \ \\mathcal{N}(\\theta|0, \\lambda^{-1}\\mathbf{I})$\n\n+   - Most common for\
    \ weight vectors (linear regression, neural nets...)\n- $\\lambda$ is the precision\
    \ of the prior\n\n+   However, many other priors are possible"
  merge: -1
  img_proc: true
- pgno: 831
  md: "# Example: Gaussian Distribution\n\nLikelihood (sample): $p(x|\boldsymbol{\t\
    heta} = \\{\\mu, \\sigma\\}) = \\mathcal{N}(x|\\mu, \\sigma) = \\frac{1}{\\sqrt{2\\\
    pi\\sigma^2}} \\exp \\left\\{ -\\frac{(x-\\mu)^2}{2\\sigma^2} \right\\}$\n\nLikelihood\
    \ (dataset): $p(\boldsymbol{X}|\\mu, \\sigma) = \\prod_{i} p(x_i|\\mu, \\sigma)\
    \ = \\frac{1}{(2\\pi\\sigma^2)^{N/2}} \\exp \\left\\{ -\\frac{\\sum_{i}(x_i-\\\
    mu)^2}{2\\sigma^2} \right\\}$\n\nPrior: $p(\\mu) = \\mathcal{N}(\\mu|\\mu_0, \\\
    sigma_0) = \\frac{1}{\\sqrt{2\\pi\\sigma_0^2}} \\exp \\left\\{ -\\frac{(\\mu-\\\
    mu_0)^2}{2\\sigma_0^2} \right\\}$\n\n![](img/f01928df50903c99ce023dd3c527a33d_831_0.png)\n\
    \n**Compute posterior $p(\\mu|\boldsymbol{X})$ for $\\mu$ assuming $\\sigma$ is\
    \ known:\n\n$p(\\mu|\boldsymbol{X}) = \\frac{p(\boldsymbol{X}|\\mu)p(\\mu)}{p(\b\
    oldsymbol{X})} \\propto p(\boldsymbol{X}|\\mu)p(\\mu)$\n\n+   - Can be performed\
    \ by „completing the square\", see appendix"
  merge: -1
  img_proc: true
- pgno: 832
  md: "# Basics: Completing the square\n\n**Posterior:** $p(\\mu|\boldsymbol{X}) \\\
    propto p(\boldsymbol{X}|\\mu)p(\\mu) \\propto \\exp \\left\\{ -\\frac{\\sum_i(x_i-\\\
    mu)^2}{2\\sigma^2} - \\frac{(\\mu-\\mu_0)^2}{2\\sigma_0^2} \right\\}$\n\nBring\
    \ exponent in canonical squared form, i.e.\n\n# Completing the square\n\n+   -\
    \ $-\\frac{1}{2}a\\mu^2_{\text{squared term}} + \\frac{b\\mu}{\text{linear term}}\
    \ + c \\Rightarrow -\\frac{1}{2\\sigma_N^2}(\\mu-\\mu_N)^2 + d$\n\nThen we know\
    \ that $p(\\mu|\boldsymbol{X}) = \\mathcal{N}(\\mu|\\mu_N, \\sigma_N^2)$ with:\n\
    \n+   - Mean: $\\mu_N = a^{-1}b$\n\n+   - Variance: $\\sigma_N^2 = a^{-1}$"
  merge: -1
  img_proc: true
- pgno: 833
  md: "# Basics: Completing the square for Gaussian posterior\n\n**Posterior:** $p(\\\
    mu|\\mathbf{X}) \\propto p(\\mathbf{X}|\\mu)p(\\mu) \\propto \\exp \\left\\{ -\\\
    frac{\\sum_i(x_i-\\mu)^2}{2\\sigma^2} - \\frac{(\\mu-\\mu_0)^2}{2\\sigma_0^2}\
    \ \right\\}$$\n$= \\exp \\left\\{ -\\frac{1}{2} \\left( \\frac{N}{\\sigma^2} +\
    \ \\frac{1}{\\sigma_0^2} \right)_a \\mu^2 + \\left( \\frac{\\sum_i x_i}{\\sigma^2}\
    \ + \\frac{\\mu_0}{\\sigma_0^2} \right)_b \\mu + \text{const} \right\\}$\n\n**Completing\
    \ the square:** $p(\\mu|\\mathbf{X}) = \\mathcal{N}(\\mu|\\mu_N, \\sigma_N^2)$\n\
    \n+   - Mean: $\\mu_N = a^{-1}b = \\frac{\\sigma_0^2}{N\\sigma_0^2+\\sigma^2}\
    \ \\sum_i x_i + \\frac{\\sigma^2}{N\\sigma_0^2+\\sigma^2}\\mu_0$\n$= \\frac{N\\\
    sigma_0^2}{N\\sigma_0^2+\\sigma^2}\\mu_{ML} + \\frac{\\sigma^2}{N\\sigma_0^2+\\\
    sigma^2}\\mu_0$\n\n+   - Variance: $\\sigma_N^2 = a^{-1} = \\frac{\\sigma^2\\\
    sigma_0^2}{N\\sigma_0^2+\\sigma^2}$"
  merge: -1
  img_proc: true
- pgno: 834
  md: '# Example: Posterior Distribution


    The posterior is Gaussian with:


    +   - Mean: $\mu_N = \frac{N\sigma_0^2}{N\sigma_0^2 + \sigma^2}\mu_{ML} + \frac{\sigma^2}{N\sigma_0^2
    + \sigma^2}\mu_0$

    - Variance: $\sigma_N^2 = \frac{\sigma^2\sigma_0^2}{N\sigma_0^2 + \sigma^2}$


    ![](img/f01928df50903c99ce023dd3c527a33d_834_0.png)


    Observations:


    +   - Variance decreases with more training samples

    - Will eventually reach 0

    - Posterior mean interpolates between prior mean and sample average'
