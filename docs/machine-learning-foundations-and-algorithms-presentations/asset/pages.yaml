- pgno: 297
  md: "# # Recap: Matrix Calculus\n\n# ## Derivatives of a scalar function w.r.t a\
    \ vector...\n\n+   - Yields the gradient vector: $\nabla_{\\mathbf{x}}f = \\frac{\\\
    partial f(x)}{\\partial \\mathbf{x}} = \\left[ \\frac{\\partial f(x)}{\\partial\
    \ x_1}, \\dots, \\frac{\\partial f(x)}{\\partial x_d} \right]^T$\n\n+   - Example:\
    \ Quadratic form $\nabla_{\\mathbf{x}}x^T\\mathbf{x} = 2\\mathbf{x}$ $\nabla_{\\\
    mathbf{x}}x^T\\mathbf{A}x = 2\\mathbf{Ax}$\n\n# ## Derivatives of a vector-valued\
    \ function w.r.t a vector...\n\n+   - Yields a matrix (the Jacobian) $\nabla_{\\\
    mathbf{x}}f = \\frac{\\partial f(\\mathbf{x})}{\\partial \\mathbf{x}} = \\left[\
    \ \begin{array}{ccc} \\frac{\\partial f_1(x)}{\\partial x_1} & \\dots & \\frac{\\\
    partial f_k(x)}{\\partial x_1} \\ \\vdots & \\ddots & \\vdots \\ \\frac{\\partial\
    \ f_1(x)}{\\partial x_d} & \\dots & \\frac{\\partial f_k(x)}{\\partial x_d} \\\
    end{array} \right]$\n\n+   - Example: Linear form $\nabla_{\\mathbf{x}}\\mathbf{Ax}\
    \ = \\mathbf{A}^T$"
  merge: -1
  img_proc: true
- pgno: 298
  md: "# Recap: Matrix Calculus\n\nDerivatives of a scalar function w.r.t. a matrix...\n\
    \n+   - is again a matrix\n$$\nabla_W f = \\frac{\\partial f(W)}{\\partial W}\
    \ = \begin{bmatrix} \\frac{\\partial f(W)}{\\partial W_{11}} & \\dots & \\frac{\\\
    partial f(W)}{\\partial W_{1d}} \\ \\vdots & \\ddots & \\vdots \\ \\frac{\\partial\
    \ f(W)}{\\partial W_{k1}} & \\dots & \\frac{\\partial f(W)}{\\partial W_{kd}}\
    \ \\end{bmatrix}$$\n\nDerivatives of a vector-valued function w.r.t. a matrix...\n\
    \n+   - is a 3D tensor !\n$$\nabla_W f = \\frac{\\partial f(W)}{\\partial W} \\\
    in \\mathcal{R}^{m \times n \times d} \\ \\text{with } f: \\mathcal{R}^{m \times\
    \ n} \to \\mathcal{R}^d$$\n\n+   - Why do we need this?\n  - Compute derivative\
    \ w.r.t weight matrix\n  - Likely there will be a simplification of this...\n\
    $$\\frac{\\partial (W x+b)}{\\partial W}$$"
  merge: -1
  img_proc: true
- pgno: 299
  md: '# Chain rule


    With vectors:


    $u = u(x), \frac{\partial g(u)}{\partial x} = \frac{\partial u(x)}{\partial x}
    \frac{\partial g(u)}{\partial u}$


    +   - Note: Swapped order

    - Special case (scalar-> vector -> scalar):


    $u = u(t), \frac{\partial g(u)}{\partial t} = \frac{\tilde{\partial u(t)}}{\partial
    t}_{1 \times d}} \frac{\partial g(u)}{\partial u}_{d \times 1}} = \sum_{i=1}^{d}
    \frac{\partial u_i(t)}{\partial t} \frac{\partial g(u)}{\partial u_i}$'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# Chain rule with tensors


    For weight matrices: $\frac{\partial Wx+b}{\partial W} = \mathcal{T}_{ijd}\text{
    with } \mathcal{T}_{[\cdot]d} = \frac{\partial z_d}{\partial W} = \begin{pmatrix}
    0^T \ \vdots \ x^T \ \vdots \ 0^T \end{pmatrix}$ Matrix with zeros, d-th row contains
    $x^T$


    Tensor vector product:


    $\mathcal{T}_{ijd}u = \sum_d \mathcal{T}_{[\cdot]d}u_d = \sum_d \mathbf{X}_du_d
    = \begin{bmatrix} x_1u_1 & x_2u_1 & \dots & x_nu_1 \ \vdots & & & \vdots \ x_1u_d
    & x_2u_d & \dots & x_nu_d \end{bmatrix} = \mathbf{u}\mathbf{x}^T$


    +   - Which is the outer product!


    Hence: $\nabla_W f = \frac{\partial f(z)}{\partial W} = \frac{\partial}{\partial
    W}(\mathbf{Wx}+b)\frac{\partial f(z)}{\partial \mathbf{z}} = \frac{\partial f(z)}{\partial
    \mathbf{z}}\mathbf{x}^T$'
  merge: -1
  img_proc: true
- pgno: 301
  md: '# # Example in matrix form


    # Example: Multi-layer Perceptron (vector form)


    # Backward pass:


    $\overline{\mathcal{L}} = 1$


    $\overline{\mathbf{y}} = \overline{\mathcal{L}}(\mathbf{y} - \mathbf{t})$


    # Forward pass:


    $\overline{\mathbf{W}^{(2)}} = \overline{\mathbf{h}}^T$


    $\mathbf{z} = \mathbf{W}^{(1)}}\mathbf{x} + \mathbf{b}^{(1)}$


    $\mathbf{h} = \sigma(\mathbf{z})$


    outer product


    $\mathbf{y} = \mathbf{W}^{(2)}}\mathbf{h} + \mathbf{b}^{(2)}$


    $\overline{\mathbf{b}^{(2)}} = \overline{\mathbf{y}}$


    $\mathcal{L} = \frac{1}{2}(\mathbf{y} - \mathbf{t})^T(\mathbf{y} - \mathbf{t})$


    $\overline{\mathbf{h}} = \overline{\mathbf{W}^{(2)}}\overline{\mathbf{y}}^T$


    element-wise product


    $\overline{\mathbf{z}} = \overline{\mathbf{h}} \circ \sigma''(\overline{\mathbf{y}})$


    $\overline{\mathbf{W^{(1}}}} = \overline{\mathbf{zx}}^T$


    outer product


    $\overline{\mathbf{b^{(1)}}} = \overline{\mathbf{z}}$


    ![](img/f01928df50903c99ce023dd3c527a33d_301_0.png)


    Gerhard Neumann | Machine Learning – Foundations and Algorithms | KIT | SS 2024
    48'
  merge: -1
  img_proc: true
- pgno: 302
  md: "# Computational costs\n\n+   - **Computational cost of forward pass:**\n  -\
    \ $z = Wx + b$\n  - Matrix-vector product\n  - Roughly one add-multiply operation\
    \ per weight\n\n+   - **Computational cost of backward pass:**\n  - $\\overline{W}\
    \ = \bar{h}z^T, \\quad \bar{h} = W^T\bar{y}$\n  - Matrix-vector product + outer\
    \ product\n  - Roughly two add-multiply operation per weight (twice the forward\
    \ pass)\n\nFor a multilayer perceptron, this means the **cost is linear** in the\
    \ number of **layers**, **quadratic** in the number of **units per layer**."
  merge: -1
  img_proc: true
- pgno: 303
  md: "# # Wrap-up for backpropagation\n\n+   - **Backprop is used to train the overwhelming\
    \ majority** of neural nets today.\n  - Even optimization algorithms much fancier\
    \ than gradient descent (e.g. second-order methods) use backprop to compute the\
    \ gradients.\n\n+   - **Despite its practical success, backprop is believed to\
    \ be neurally implausible.**\n  - No evidence for biological signals analogous\
    \ to error derivatives.\n  - Forward & backward weights are tied in backprop.\n\
    \  - Backprop requires synchronous update (1 forward followed by 1 backward).\n\
    \n+   All the biologically plausible alternatives we know about learn much more\
    \ slowly (on computers)."
  merge: -1
  img_proc: true
