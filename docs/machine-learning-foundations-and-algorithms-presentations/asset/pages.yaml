- pgno: 613
  md: '# Maximum Likelihood of a mixture


    +   - (Marginal-)Log-Likelihood with N iid. Points


    $$\mathcal{L} = \log L(\theta) = \sum_{i=1}^{N} \log p_{\theta}(\boldsymbol{x}_i)_{\text{marginal}}
    = \sum_{i=1}^{N} \log \left( \sum_{k=1}^{K} \pi_k \mathcal{N}(\boldsymbol{x}_i|\boldsymbol{\mu}_k,
    \boldsymbol{\Sigma}_k) \right)_{\text{non-exponential family}}$


    +   - Q: Can we do gradient descent?


    $$\frac{\partial \mathcal{L}}{\partial \boldsymbol{\mu}_j} = \sum_{i=1}^{N} \frac{\pi_j
    \mathcal{N}(\boldsymbol{x}_i, \boldsymbol{\mu}_j, \boldsymbol{\Sigma}_j)}{\sum_{k=1}^{K}
    \pi_k \mathcal{N}(\boldsymbol{x}_i|\boldsymbol{\mu}_k, \boldsymbol{\Sigma}_k)}
    \boldsymbol{\Sigma}_j^{-1}(\boldsymbol{x}_i - \boldsymbol{\mu}_j) = \sum_{i=1}^{N}
    \frac{p(j)p(\boldsymbol{x}_i|j)}{p(\boldsymbol{x}_i)} \boldsymbol{\Sigma}_j^{-1}(\boldsymbol{x}_i
    - \boldsymbol{\mu}_j)$


    +   - Gradient depends on all other components (cyclic dependency)


    +   - No closed form solution


    +   - Typically very slow convergence


    +   - A: Yes, but the sum (marginalization) does not go well with the log'
  merge: -1
  img_proc: true
