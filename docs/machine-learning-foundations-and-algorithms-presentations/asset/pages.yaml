- pgno: 186
  md: '# Recap: Geometrical inspection


    **Observations:**


    +   **b shifts the decision boundary** along (negative) direction of **w**


    +   The shift corresponds to adding $\frac{b}{\|\mathbf{w}\|}$ to the projection


    $\mathbf{w}^T\mathbf{x} + b = 0 \Rightarrow \frac{\mathbf{w}^T\mathbf{x}}{\|\mathbf{w}\|}
    + \frac{b}{\|\mathbf{w}\|} = x_w$


    +   i.e. in order for $\mathbf{x}$ to be on the decision boundary, the projection
    has to be


    $x_w = -\frac{b}{\|\mathbf{w}\|}$


