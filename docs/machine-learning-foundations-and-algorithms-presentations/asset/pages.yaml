- pgno: 585
  md: "# Divergence Measures\n\nWe can minimize a divergence measure between both\
    \ distributions\n\n```\n$q^* = \\text{argmin}_q \\ D(q, p^*)$\n```\n\n+   - Between\
    \ data distribution $p^*(x)$ and model $q^*(x)$\n- A divergence can be seen as\
    \ similarity measure between distributions\n\nMany divergences exists:\n\n| Kullback–Leibler\
    \ divergence: | $D_{KL}(p, q) = \\int \\frac{p(x)}{q(x)} dx$ |\n| squared Hellinger\
    \ distance: | $H^2(p, q) = 2 \\int (\\sqrt{p(x)} - \\sqrt{q(x)})^2 dx$ |\n| Jensen-Shannon\
    \ divergence: | $D_{JS}(p, q) = \\frac{1}{2} \\int p(x) \\ln(p(x)) + \\ln(q(x)))\
    \ - (p(x) + q(x)) \\ln(\\frac{p(x) + q(x)}{2}) dx$ |\n| $\\alpha$-divergence:\
    \ | $D^{(\\alpha)}(p, q) = \\frac{4}{1-\\alpha^2} \\int (1 - p(x)/q(x))^{\\frac{1+\\\
    alpha}{2}} dx$ |\n| chi-squared divergence: | $D_{\\chi2}(p, q) = \\int \\frac{(p(x)\
    \ - q(x))^2}{p(x)} dx$ |\n| $(\\alpha,\\beta)$-product divergence: | $D_{\\alpha,\\\
    beta}(p, q) = \\frac{2}{(1-\\alpha)(1-\\beta)} \\int (1 - (\\frac{q(x)}{p(x)})^{\\\
    frac{1-\\alpha}{2}}) (1 - (\\frac{p(x)}{q(x)})^{\\frac{1-\beta}{2}}) p(x) dx$\
    \ |"
  merge: -1
  img_proc: true
- pgno: 586
  md: '# # Most common divergences


    +   - **Reverse KL-divergence**: Variational Inference


    KL(q(x)\|p^*(x)) = \int_{x} q(x) \log \frac{q(x)}{p^*(x)}dx


    +   - **Zero forcing**: If $p^*(x)$ is small, $q(x)$ needs to be small


    +   - **Forward KL-divergence**: Maximum Likelihood (implicitly)


    KL(p^*(x)\|q(x)) = \int_{x} p^*(x) \log \frac{p^*(x)}{q(x)}dx


    +   - **Probability forcing**: If $p^*(x)$ is high, $q(x)$ needs to be high


    +   - **Jensen-Shannon Divergence**: Generative Adversarial Networks (GANs)


    JS(p^*(x)\|q(x)) = \frac{1}{2}(KL(p^*(x)\|m(x)) + KL(q(x)\|m(x))), with $m(x)
    = \frac{p^*(x) + q(x)}{2}'
  merge: -1
  img_proc: true
- pgno: 587
  md: '# Properties of the KL-divergence


    Kullback-Leibler divergence:


    $KL(p(\mathbf{x})||q(\\mathbf{x})) = \int p(\mathbf{x}) \log \frac{p(\mathbf{x})}{q(\mathbf{x})}
    d\mathbf{x}$$


    +   - Always positive: $KL(p||q) \ge 0$


    +   - 0 iff both distributions are equal: $KL(p||q) = 0 \Leftrightarrow p = q$


    +   - Non-symmetric: $KL(p||q) \neq KL(q||p)$


    **Other names:** Relative Entropy, Information Gain...


    **Also used a lot in:** Reinforcement Learning, Information theory'
  merge: -1
  img_proc: true
- pgno: 588
  md: "# KL for Gaussian Distributions\n\nWe can also compute the KL for Gaussian\
    \ densities in closed form:\n\n```\n$KL(\\\\mathcal{N}_0|\\mathcal{N}_1) = \\\
    frac{1}{2} \\left\\{ \\text{tr}(\\mathbf{\\Sigma}_1^{-1} \\mathbf{\\Sigma}_0)\
    \ + \\log \\frac{|\\mathbf{\\Sigma}_1|}{\\mathbf{\\Sigma}_0|} + (\\mathbf{\\mu}_1\
    \ - \\mathbf{\\mu}_0)^T \\mathbf{\\Sigma}_1^{-1} (\\mathbf{\\mu}_1 - \\mathbf{\\\
    mu}_0) - k \\right\\}$\n```\n\n![](img/f01928df50903c99ce023dd3c527a33d_588_0.png)\n\
    \n+   - **1st term**: compares \"shape/rotation\" of distributions\n- **2nd term**:\
    \ compares entropies of distribution\n- **3rd term**: compares means of distributions\n\
    \  - Measured in metric space defined by $\\mathbf{\\Sigma}_1^{-1}$\n  - Higher\
    \ dissimilarity if there is less variance of $\\mathcal{N}_1$ in the update direction\
    \ of the means"
  merge: -1
  img_proc: true
- pgno: 589
  md: "# Minimization of Reverse KL\n\nThis minimization is often called (I)nformation-projection\
    \ of distribution $p(x^*)$\n\n```\nKL(q(x)||p^*(x)) = \\int_{x} q(x) \\log \\\
    frac{q(x)}{p^*(x)}dx = \\int_{x} q(x) \\log \\frac{q(x)}{p^*(x)} + \\log Z\n```\n\
    \n![](img/f01928df50903c99ce023dd3c527a33d_589_0.png)\n\n+   - No need to evaluate\
    \ normalizer Z\n- **Zero forcing**: If $p^*(x)$ is small, $q(x)$ needs to be small\n\
    \  - This results in a **mode-seeking behaviour**\n\n+   - **Non-convex optimization**\
    \ even for simple distributions q(x)\n  - Hard to optimize\n  - Often has multiple\
    \ local optima\n\n+   - **Intuitively:**\n  - Good generative model (for sampling)\n\
    \  - But some areas of high probability might be ignored\n\nKL(q||p)\n\n![](img/f01928df50903c99ce023dd3c527a33d_589_1.png)"
  merge: -1
  img_proc: true
- pgno: 590
  md: '# Minimization of the Forward KL


    This minimization is often called (M)oment-projection of distribution $p^*(x)$


    ```

    $KL(p^*(x)||q(x)) = \int_x p^*(x) \log \frac{p^*(x)}{q(x)} dx = -\int_x p^*(x)
    \log q(x) dx + const \quad p^*(x)\n\approx -\frac{1}{N} \sum_{x_i\sim p^*(x)}
    \log q(x_i) + const$

    ```


    +   - Probability forcing: If $p^*(x)$ is high, $q(x)$ needs to be high

    - As a result, it averages over the modes that cannot be represented!

    - Requires samples from $p^*(x)$ (unsuitable for VI)

    - It is the same as the maximum likelihood solution!


    ![](img/f01928df50903c99ce023dd3c527a33d_590_0.png)


    ```

    $argmax_q \LogLike(\mathcal{D}, q) = argmax_q \sum_{x_i\sim p^*(x)} \log q(x_i)\n\approx
    argmin_q KL(p^*(x)||q(x))$

    ```


    KL(p||q)


    ![](img/f01928df50903c99ce023dd3c527a33d_590_1.png)'
  merge: -1
  img_proc: true
- pgno: 591
  md: "# Interesting fact: So why is it called Moment Projection?\n\nWhen using exponential\
    \ family distributions as model,\n\n$q\\theta(x) = \\frac{\\exp(\\phi(x)^T\\theta)}{Z},\
    \ \\quad \\text{with } Z = \\int \\exp(\\phi(x)^T\\theta)dx$\n\nit is easy to\
    \ show that a maximum likelihood fit matching the average feature vector $\\bar{\\\
    phi}$ of the data\n\n$$\\frac{d}{d\\theta}LogLik(\\mathcal{D}, \\theta) = \\sum_{i}\
    \ \\frac{d}{d\\theta}log q_{\\theta}(x_i) = \\sum_{i} \\frac{d}{d\\theta}(\\phi(x_i)^T\\\
    theta) - N\\frac{d}{d\\theta}\\log\\left(\\int \\exp(\\phi(x)^T\\theta)dx\\right)$\n\
    \n$= \\sum_{i} \\phi(x_i) - N \\frac{\\exp(\\phi(x)^T\\theta)}{Z} \\phi(x)dx =\
    \ N\\bar{\\phi} - N E_{q_{\theta}(x)}[\\phi(x)]$\n\n**From the optimality condition\
    \ on $\\theta$ (derivative = 0) it follows:** $E_{q_{\theta}(x)}[\\phi(x)] = \\\
    bar{\\phi}$\n\n+   - I.e the model q's expected features have to match the average\
    \ observed features\n- E.g., for Gaussians $\\phi(x) = [x, x^2]^T$ and we match\
    \ first and second order moments"
  merge: -1
  img_proc: true
- pgno: 592
  md: "# # Comparison of the projections for VI\n\n# ## Information Projection\n\n\
    # ## Moment Projection\n\n![](img/f01928df50903c99ce023dd3c527a33d_592_0.png)\n\
    \n![](img/f01928df50903c99ce023dd3c527a33d_592_1.png)\n\n$KL(q(\boldsymbol{x})||p^*(\b\
