- pgno: 132
  md: "# # Generative vs. discriminative modelling\n\n# # Generative\n\n# ## Generative\
    \ Models:\n\n+   - Assume some functional form for class prior $p(c)$ and class\
    \ densities $p(x|c)$\n\n+   - Learn prior and densities from data\n\n+   - This\
    \ is a \"generative\" model, as we can create new datapoints $x$ using $p(x|c)$\n\
    \n+   - Predict class label by computing posterior $p(c|x) = \frac{p(x|c)p(c)}{p(x)}$\n\
    \n+   - Often called Naive Bayes classifier ( as it uses Bayes rule\n\n![](img/f01928df50903c99ce023dd3c527a33d_132_0.png)\n\
    \n# ## Learn full joint distribution of the data (typically very hard)\n\n+  \
    \ - Our modelling assumptions, e.g. that $p(x|c)$ is Gaussian, might introduce\
    \ big errors"
  merge: -1
  img_proc: true
- pgno: 133
  md: '# # Generative vs. discriminative modelling


    # Discriminative Models:


    ![](img/f01928df50903c99ce023dd3c527a33d_133_0.png)


