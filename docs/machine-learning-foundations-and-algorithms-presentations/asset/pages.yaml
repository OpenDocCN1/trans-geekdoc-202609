- pgno: 643
  md: '# EM for Dimensionality Reduction


    We can also formulate dimensionality reduction using latent variables


    Idea: Introduce a latent variable model to relate a D-dimensional observation
    vector to a corresponding M-dimensional gaussian latent variable (with M < D)


    ```

    $x = Wz + \mu + \epsilon$$

    ```


    +   - **z** is a d'' latent variable (our low dimensional representation)

    - **W** is a $D \times M$ matrix relating the latent space **z** with the original
    space **x**

    - **\mu$** is a constant offset vector

    - **\epsilon$** is a d-dimensional Gaussian noise vector $\epsilon \sim \mathcal{N}(0,
    \sigma^2 I)$


    ![](img/f01928df50903c99ce023dd3c527a33d_643_0.png)'
  merge: -1
  img_proc: true
- pgno: 644
  md: "# EM for Dimensionality Reduction\n\nProbabilistic Dimensionality Reduction\
    \ Model:\n\n$z \\in \\mathbb{R}^M, \\quad x \\in \\mathbb{R}^D, \\quad M < D$\n\
    \n+   - Continuous Latent Variable:\n  - $p(z) = \\mathcal{N}(\\mathbf{0}, \\\
    mathbf{I})$\n  - 0 mean, unit variance distribution in latent space\n\n![](img/f01928df50903c99ce023dd3c527a33d_644_0.png)\n\
    \n+   - Observation Model\n  - $p(x|z, \\theta) = \\mathcal{N}(\\mathbf{W}z +\
    \ \\mathbf{\\mu}, \\sigma^2 \\mathbf{I})$\n  - with parameters $\\theta = \\{\\\
    mathbf{W}, \\mathbf{\\mu}, \\sigma^2\\}$"
  merge: -1
  img_proc: true
- pgno: 645
  md: '# Generative Process


    Our model can be interpreted in terms of a generative process


    +   1. Sample latent variable

    $z \sim \mathcal{N}(0, I)$


    +   2. Linearly project to high-D space

    $y = Wz + \mu$


    +   3. Sample noise

    $\epsilon \sim \mathcal{N}(0, \sigma^2 I)$


    +   4. Add noise to obtain x

    $x = y + \epsilon$


    ![](img/f01928df50903c99ce023dd3c527a33d_645_0.png)'
  merge: -1
  img_proc: true
- pgno: 646
  md: '# # Marginal likelihood


    Marginal likelihood is given by:


    $$$p(\boldsymbol{x}|\theta) = \int_z p(\boldsymbol{x}|\boldsymbol{z}, \theta)p(\boldsymbol{z})dz
    = \int_z \mathcal{N}(\boldsymbol{x}|\boldsymbol{W}\boldsymbol{z} + \boldsymbol{\mu},
    \sigma^2\boldsymbol{I})\mathcal{N}(\boldsymbol{z}|\mathbf{0}, \boldsymbol{I})dz$$


    Maximize the marginal log-likelihood:


    $$$loglike(\theta) = \sum_{i=1}^N \log p(\boldsymbol{x}_i|\theta) = \sum_{i=1}^N
    \log \left( \int_z \mathcal{N}(\boldsymbol{x}_i|\boldsymbol{W}\boldsymbol{z} +
    \boldsymbol{\mu}, \sigma^2\boldsymbol{I})\mathcal{N}(\boldsymbol{z}|\mathbf{0},
    \boldsymbol{I})dz \right)$$$


    This is a typical case for using EM


    +   - It can however also be solved in closed form as everything is Gaussian and
    linear

    - But it is somehow complex and using EM is a much more general solution

    - Its a good example to understand EM'
  merge: -1
  img_proc: true
- pgno: 647
  md: "# Expectation-step\n\nWe need to compute the posterior distribution\n\n$q_i(\\\
    mathbf{z}) = p(\\mathbf{z}|\\mathbf{x}_i, \\boldsymbol{\theta}) = \\frac{p(\\\
    mathbf{x}_i|\\mathbf{z}, \\boldsymbol{\theta}) p(\\mathbf{z})}{p(\\mathbf{x}_i)}$$\n\
    \n\\quad\\quad\\text{posterior} \\quad \\text{likelihood} \\quad \\text{prior}$$\n\
    \\quad\\quad\\quad\\quad\\quad\\quad \\text{evidence}$\n\n+   * Application of\
    \ Bayes’’ Rule with Gaussian distributions\n\n$p(\\mathbf{x}|\\mathbf{z}, \\boldsymbol{\t\
    heta}) = \\mathcal{N}(\\mathbf{W}\\mathbf{x} + \\mu, \\sigma^2\\mathbf{I}), \\\
    quad p(\\mathbf{z}) = \\mathcal{N}(\\mathbf{0}, \\mathbf{I})$\n\n+   * Posterior\
    \ is Gaussian with mean and variance\n\n$$\\mu_{\\mathbf{z}|\\mathbf{x}_i} = (\\\
    mathbf{W}^T\\mathbf{W} + \\sigma^2\\mathbf{I})^{-1}\\mathbf{W}^T(\\mathbf{x}_i\
    \ - \\mu), \\quad \\quad \\Sigma_{\\mathbf{z}|\\mathbf{x}_i} = \\sigma^2(\\mathbf{W}^T\\\
    mathbf{W} + \\sigma^2\\mathbf{I})^{-1}$\n\n+   * Not covered now, see Lecture\
    \ 14, Bayesian Learning\n* Only the case because $\\mathbf{x}$ is linear in $\\\
    mathbf{z}$!"
  merge: -1
  img_proc: true
- pgno: 648
  md: "# # Maximization Step\n\nMaximize the lower bound with respect to ...$\theta$\n\
    \n```\n$$\\mathcal{L}(q, \\theta) = \\sum_{i} \\left( \\int_{z} q_i(z) \\log p(x_i,\
    \ z|\\theta)dz - \\int_{z} q_i(z) \\log q_i(z)dz \\right)$$\n= \\sum_{i} \\left(\
    \ \\int_{z} q_i(z) (\\log p(x_i|z, \\theta) + \\log p(z))dz - \\int_{z} q_i(z)\
    \ \\log q_i(z)dz \\right)$$\n= \\sum_{i} \\int_{z} q_i(z) \\log p(x_i|z, \\theta)dz\
    \ + \\frac{\\text{const}}{independent \\ of \\\\theta} = \\sum_{i} \\mathbb{E}_{q_i(z)}\
    \ [\\log p(x_i|z, \\theta)] + \\frac{\\text{const}}{independent \\ of \\\\theta}$\n\
    ```\n\n+   - **Continuous latent variable: How can we solve the integral?**\n\
    \  a) $q_i(z)$ is Gaussian, can be solved in principle in closed form (not covered)\n\
    \  b) **Simpler:** Sampling! l.e, we can use Monte Carlo Estimates"
  merge: -1
  img_proc: true
- pgno: 649
  md: "# Recap: Monte-carlo estimation\n\nExpectations can always be **approximated\
    \ by samples**:\n\n$$\\mathbb{E}_p[f(x)] = \\int p(x)f(x)dx \\approx \frac{1}{N}\
    \ \\sum_{x_i \\sim p(x)} f(x_i)$\n\n+   - Necessary if no analytical solution\
    \ exists to compute the integral (typical case)"
  merge: -1
  img_proc: true
- pgno: 650
  md: '# # Maximization Step


    # ## Monte-Carlo estimate for the lower bound


    $\mathcal{L}(q, \theta) = \sum_{i} \mathbb{E}_{q_i(z)} [log p(\boldsymbol{x}_i|\boldsymbol{z},
    \theta)] \approx \sum_{i} \frac{1}{N} \sum_{z_{ik} \sim q_i(z)} \log p(\boldsymbol{x}_i|z_{ik},
    \theta)$


    +   - If we use only a single sample $\boldsymbol{z}_i$ per (i.e. $N=1$), we get


    $\mathcal{L}(q, \theta) \approx \sum_{i} \log p(\boldsymbol{x}_i|\boldsymbol{z}_i,
    \theta)$, where $\boldsymbol{z}_i \sim q_i(z)$


    +   - Maximizing $\mathcal{L}(q, \theta)$ is a standard maximum likelihood problem
    with Gaussian linear models.


    +   - We know the solution already (standard least squares):


    $\begin{bmatrix} \mu \ \boldsymbol{W} \end{bmatrix} = (\boldsymbol{Z}^T \boldsymbol{Z})^{-1}\boldsymbol{Z}^T
    \boldsymbol{X}, \quad \text{with } \boldsymbol{Z} = \dots \quad \boldsymbol{X}
    = \begin{bmatrix} \boldsymbol{x}_1^T \ \vdots \ \boldsymbol{x}_n^T \end{bmatrix}$


    ```

    k-th element of $y_i$

    ```'
  merge: -1
  img_proc: true
- pgno: 651
  md: "# Algorithm: EM for Dimensionality reduction\n\n+   - **Initialize**: Use average\
    \ of **x** for $\\mu$, random matrix **W**\n\n+   - **Repeat** until convergence:\n\
    \  - **Expectation-step**:\n    - Compute posterior mean and covariance\n    $\\\
    mu_{z|x_i} = (W^T W + \\sigma^2 I)^{-1} W^T(x_i - \\mu), \\quad \\Sigma_{z|x_i}\
    \ = \\sigma^2(W^T W + \\sigma^2 I)^{-1}$\n    - Generate latent samples:\n   \
    \   $z_i \\sim \\mathcal{N}(\\mu_{z|x_i}, \\Sigma_{z|x_i})$\n  - **Maximization-step**:\
    \ Update $W$, $\\mu$ and $\\sigma^2$\n    $\\left[\begin{matrix}\\mu \\ W\\end{matrix}\r\
    ight] = (Z^T Z)^{-1} Z^T X, \\quad \\sigma^2 = \\frac{1}{nd} \\sum_{i=1}^n \\\
    sum_{k=1}^d (y_{ik} - x_{ik})^2$"
  merge: -1
  img_proc: true
