  md: "# Occam’s Razor\n\n+   - Named after William of Occam – AD 1300s\n- Prefer\
    \ simpler explanations over more complex ones\n  - Numquam ponenda est pluralitas\
    \ sine necessitate\n  - (Never posit plurality without necessity.)\n- Historically,\
    \ a widely prevalent idea across different schools of philosophy\n- Directly applicable\
    \ for model selection in ML\n  - However... not fully inline with double descent\n\
    \n![](img/f01928df50903c99ce023dd3c527a33d_409_0.png)\n\n> \"When faced with two\
    \ equally good hypotheses, always choose the simpler.\""
