  md: "# # Wrap-Up\n\n**Bayesian Optimization:**\n\n+   - Bayesian treatment for learning\
    \ the fitness function\n- Includes model uncertainty (e.g. GPs)\n- Acquisition\
    \ function used to guide exploration\n  - Generate samples with high model uncertainty\n\
    \  - ... and potentially high reward\n- Bayesian treatment of hyper-parameters\
    \ help\n\n**Beyond Blackbox:**\n\n+   - Use multiple fidelities / budgets\n- Combination\
    \ of hyperband and BO can speed up HPO up to a factor of 50"
