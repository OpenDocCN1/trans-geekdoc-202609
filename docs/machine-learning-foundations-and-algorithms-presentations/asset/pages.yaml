- pgno: 395
  md: '# The double descent effect for DNNs


    The “magic” of DNNs:


    +   - Initial U-shaped curve aligns with classical understanding

    - But: beyond a certain point (interpolation threshold) the test risk again starts
    to decrease again.


    This effect is called “double descent”


    ![](img/f01928df50903c99ce023dd3c527a33d_395_0.png)'
  merge: -1
  img_proc: true
- pgno: 396
  md: "# # The double descent effect for DNNs\n\n![](img/f01928df50903c99ce023dd3c527a33d_396_0.png)\n\
    \n+   - Classical regime:\n  - Follows what we know (bias-variance trade-off)\n\
    - **Interpolation threshold:**\n  - network size is about right to achieve 0 training\
    \ loss.\n  - Only very narrow parameter-space to achieve that\n  - Rule of thumb:\
    \ Num params ≈ num samples\n  - Depends on: Number of samples, regularization,\
    \ used optimizer, etc...\n- **“Modern” interpolating regime:**\n  - Many models\
    \ can achieve 0 training loss. We “somehow” end up with a good generalization\
    \ model\n  - Might be the bias induced by stochastic gradient descent (we do not\
    \ find the exact local optimum and its noisy)"
  merge: -1
