- pgno: 840
  md: '# Bayesian Linear Regression


    For Bayesian Linear Regression, the posterior and the prediction can be computed
    in closed form:


    +   - For all other cases, we need approximations

    - While linear models are limited, it is still insightful to look at the properties
    of this case


    # Model:


    +   - Likelihood (single sample): $p(y|x, w) = \mathcal{N}(y|w^T \phi(x), \sigma^2)$


    +   - Likelihood (full dataset): $p(y|X, w) = \prod_{i} \mathcal{N}(y_i|w^T \phi(x_i),
    \sigma^2)$


    +     Write product of independent Gaussians as multivariate Gaussian


    +   - Gaussian prior: $p(w) = \mathcal{N}(w|0, \lambda^{-1}I)$


    ![](img/f01928df50903c99ce023dd3c527a33d_840_0.png)'
  merge: -1
  img_proc: true
- pgno: 841
  md: '# # Bayesian Linear Regression


    **2 Steps:**


    +   1. Compute posterior


    ```

    ```

    np(w|X,y) = \frac{p(y|X,w)p(w)}{p(y|X)} = \frac{p(y|X,w)p(w)}{\int p(y|X,w)p(w)dw}

    ```

    ```


    +   2. Compute predictive distribution: Integrate posterior out


    ```

    ```

    np(y*|x*,X,y) = \int p(y*|w,x*)p(w|X,y)dw

    ```

    ```


    We have to look at some basics...'
  merge: -1
  img_proc: true
- pgno: 842
  md: "# Basics: Gaussian Identities\n\n+   - Eq (1): Joint from Marginal Conditional:\
    \ $p(x),p(y|x) \rightarrow p(x,y)$\n$\\mathcal{N}(x|\\mu_{\boldsymbol{x}}, \\\
    Sigma_{\boldsymbol{x}})\\mathcal{N}(y|F\boldsymbol{x}, \\Sigma_{\boldsymbol{y}})\
    \ = \\mathcal{N}\\left(\\left[\begin{array}{c} x \\ y \\end{array}\right] \\middle|\
    \ \\left[\begin{array}{c} \\mu_{\boldsymbol{x}} \\ F\\mu_{\boldsymbol{x}} \\end{array}\r\
    ight], \\left[\begin{array}{cc} \\Sigma_{\boldsymbol{x}} & \\Sigma_{\boldsymbol{x}}F^T\
    \ \\ F\\Sigma_{\boldsymbol{x}} & \\Sigma_{\boldsymbol{y}} + F\\Sigma_{\boldsymbol{x}}F^T\
    \ \\end{array}\right]\right)$\n\n+   - Eq (2): Marginal and Conditional Gaussian\
    \ from Joint: $p(x,y) \rightarrow p(y|x), p(x|y)$\n$\\mathcal{N}\\left(\\left[\b\
    egin{array}{c} x \\ y \\end{array}\right] \\middle| \\left[\begin{array}{c} \\\
    mu_{\boldsymbol{x}} \\ \\mu_{\boldsymbol{y}} \\end{array}\right], \\left[\begin{array}{cc}\
    \ \\Sigma_{\boldsymbol{x}} & C^T \\ C & C^T\\Sigma_{\boldsymbol{x}}C \\end{array}\r\
    ight]\right) = \\mathcal{N}(x|\\mu_{\boldsymbol{x}}, \\Sigma_{\boldsymbol{x}})\\\
    mathcal{N}(y|\\mu_{\boldsymbol{y}} + C^T\\Sigma_{\boldsymbol{x}}^{-1}(x-\\mu_{\b\
    oldsymbol{x}}), \\Sigma_{\boldsymbol{y}}-C^T\\Sigma_{\boldsymbol{x}}^{-1}C)$\n\
    \nCan also be derived by “completing the square”..."
  merge: -1
  img_proc: true
- pgno: 843
  md: "# Basics: Gaussian Bayes rules\n\nBayes rule for Gaussian distribution:\n\n\
    +   - Marginal: $p(x) = \\mathcal{N}(x|\\mu_x, \\Sigma_x)$\n- Conditional: $p(y|x)\
    \ = \\mathcal{N}(y|Fx, \\sigma_y^2I)$\n\nGaussian Bayes Rule 1: The posterior\
    \ $p(x|y)$ is Gaussian with\n\n+   - Mean: $\\mu_{x|y} = \\mu_x + \\Sigma_x F^T(\\\
    sigma_y^2I + F\\Sigma_x F^T)^{-1}(y - F\\mu_x)$\n  Correction Term\n- Covariance:\
    \ $\\Sigma_{x|y} = \\Sigma_x - \\Sigma_x F^T(\\sigma_y^2I + F\\Sigma_x F^T)^{-1}F\\\
    Sigma_x\n  Variance/Uncertainty is reduced by new information\n\nSame Equations\
    \ as in Kalman Filtering\n\n+   - Derivation: Use Eq (1) to form joint $p(x,y)$\
    \ from marginal $p(x)$ and conditional $p(y|x)$ . Use Eq (2) to form posterior\
    \ $p(x|y)$ from joint $p(x,y)$"
  merge: -1
  img_proc: true
- pgno: 844
  md: "# Basics: Gaussian Bayes rules\n\nBayes rule for Gaussian distribution:\n\n\
    +   - Marginal: $p(\boldsymbol{x}) = \\mathcal{N}(\boldsymbol{x}|\boldsymbol{\\\
    mu}_{\boldsymbol{x}}, \boldsymbol{\\Sigma}_{\boldsymbol{x}})$\n- Conditional:\
    \ $p(\\mathbf{y}|\boldsymbol{x}) = \\mathcal{N}(\\mathbf{y}|F\boldsymbol{x}, \\\
    sigma_y^2 I)$\n\n+   - Gaussian Bayes Rule 2: The posterior $p(\boldsymbol{x}|\\\
    mathbf{y})$ is Gaussian with\n  - Mean: $\\mu_{\boldsymbol{x}|\\mathbf{y}} = \b\
    oldsymbol{\\mu}_{\boldsymbol{x}} + (\\sigma_y^2 \\mathbf{I} + \boldsymbol{\\Sigma}_{\b\
    oldsymbol{x}}F^T F)^{-1} \boldsymbol{\\Sigma}_{\boldsymbol{x}}F^T(\\mathbf{y}-F\b\
    oldsymbol{\\mu}_{\boldsymbol{x}})$\n  - Covariance: $\boldsymbol{\\Sigma}_{\b\
    oldsymbol{x}|\\mathbf{y}} = (\boldsymbol{\\Sigma}_{\boldsymbol{x}}^{-1} + \\sigma_y^{-2}\
    \ F^T F)^{-1} \\sigma_y^2(\\sigma_y^2 \\mathbf{I} + \boldsymbol{\\Sigma}_{\boldsymbol{x}}F^T\
    \ F)^{-1} \boldsymbol{\\Sigma}_{\boldsymbol{x}}$\n\n+   - Derivation: Use following\
    \ identities for Bayes rule 1 from the matrix cookbook...\n  - Use identity $\\\
    mathbf{A}(\\mathbf{I} + \\mathbf{BA})^{-1} = (\\mathbf{I} + \\mathbf{AB})^{-1}\\\
    mathbf{A}$ for the mean (Searl identity)\n  - Use identity $(\\mathbf{A} + \\\
    mathbf{BC}^T)^{-1} = \\mathbf{A}^{-1} - \\mathbf{A}^{-1}\\mathbf{C}(\\mathbf{B}^{-1}\
    \ + \\mathbf{C}^T\\mathbf{A}^{-1}\\mathbf{C})^{-1}\\mathbf{C}^T\\mathbf{A}^{-1}$\
    \ for the covariance (Woodbury identity)"
  merge: -1
  img_proc: true
- pgno: 845
  md: "# Basics: Gaussian Bayes rule\n\n+   * Gaussian Bayes Rule 1: used for derivation\
    \ with kernels\n  - Mean: $\\mu_{\boldsymbol{x}|y} = \\mu_{\boldsymbol{x}} + \\\
    Sigma_{\boldsymbol{x}}F^T(\\sigma_y^2 I + F\\Sigma_{\boldsymbol{x}}F^T)^{-1}(\b\
    oldsymbol{y} - F\\mu_{\boldsymbol{x}})$\n  - Covariance: $\\Sigma_{\boldsymbol{x}|y}\
    \ = \\Sigma_{\boldsymbol{x}} - \\Sigma_{\boldsymbol{x}}F^T(\\sigma_y^2 I + F\\\
    Sigma_{\boldsymbol{x}}F^T)^{-1}F\\Sigma_{\boldsymbol{x}}$\n\n+   * Gaussian Bayes\
    \ Rule 2: used for derivation with features\n  - Mean: $\\mu_{\boldsymbol{x}|y}\
    \ = \\mu_{\boldsymbol{x}} + (\\sigma_y^2\\Sigma_{\boldsymbol{x}}^{-1} + F^T F)^{-1}F^T(\b\
    oldsymbol{y} - F\\mu_{\boldsymbol{x}})$\n  - Covariance: $\\Sigma_{\boldsymbol{x}|y}\
    \ = \\sigma_y^2(\\sigma_y^2\\Sigma_{\boldsymbol{x}}^{-1} + F^T F)$\n\nDo not remember\
    \ exact equations... but remember their properties\n\n+   * Both rules are mathematically\
    \ equivalent...\n* However, numerically it can be a huge difference\n* Bayes rule\
    \ 1: Invert a matrix with dimension $dim(y) \\times dim(y)$\n* Bayes rule 2: Invert\
    \ a matrix with dimension $dim(x) \\times dim(y)$\n\n> Use Rule 1 if $dim(y) <\
    \ dim(x)$, otherwise Rule 2"
  merge: -1
  img_proc: true
- pgno: 846
  md: "# Basics: Gaussian propagation\n\nGiven marginal $p(x) = \\mathcal{N}(x|\b\
    oldsymbol{\\mu}_x, \boldsymbol{\\Sigma}_x)$ and conditional $p(y|x) = \\mathcal{N}(y|Fx,\
    \ \\sigma_y^2 I)$ we want to obtain the marginal for y\n\n+   - The marginal distribution\
    \ $p(y) = \\int p(x)p(y|x)dx$ is Gaussian with\n  - Mean: $\boldsymbol{\\mu}_y\
    \ = F\boldsymbol{\\mu}_x$\n  - Variance: $\boldsymbol{\\Sigma}_y = \\sigma_y^2\
    \ I + F\boldsymbol{\\Sigma}_x F^T$\n- Derivation:\n  - Use Eq (1) to obtain joint\
    \ distribution\n  - Marginal $p(y)$ can be directly read from the joint\n- Variance\
    \ in $\\mathbf{y}$ increases due to uncertainty in $\\mathbf{x}$\n\nOk... now\
    \ we are ready to derive Bayesian Linear Regression!"
