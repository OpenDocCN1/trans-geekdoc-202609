- pgno: 113
  md: '# Maximum Likelihood Estimation (MLE)


    +   - Given: the training data $D = \{(x_i, y_i)\}_{i=1...N}$ identically independently
    distributed (iid) from the data distribution $p_{data}$


    +   - Let $p_theta(x, y)$ be a family of distributions parametrized by $\theta
    \in \Theta$


    +   - We want to find $\theta$ such that $p$ fits the data well


    Fitness of $\theta$ for one single data point:


    $\lik(\theta; x_i, y_i) = p_\theta(x_i, y_i)$


    Fitness of $\theta$ for whole dataset (iid. assumption):


    $\lik(\theta; D) = \prod_{i} p_\theta(x_i, y_i)$'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# Maximum Likelihood Estimation (MLE)


    Log-likelihood is easier to optimize:


    ```

    loglik(\theta; D) = \sum_{i} \log p_{\theta}(x_i, y_i)

    ```


    +   - Log is monotonous -> same optimum

    - Sums are “nicer” to optimize than products

    - Log cancels exponential form (most distributions are in the exponential family)


    The MLE solution is given by:


    ```

    \theta_{ML} = \text{argmax}_{\theta} \text{loglik}(\theta; D)

    ```'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# # Example: Gaussian


    Gaussian density function:


    $$\loglik(\theta; D) = -N \log \sqrt{2\pi\sigma^2} - \sum_{i} \frac{(x_i - \mu)^2}{2\sigma^2}$


    MLE solution for $\mu$:'
  merge: -1
  img_proc: true
- pgno: 116
  md: "# MLE: conditional log-likelihood\n\n+   - Given the training data $D = \\\
    {(x_i, y_i)\\}_{i=1...N}$ iid. from the data distribution $p_{data}$\n- Let $p_{\t\
    heta}(y|x)$ be a family of distributions parametrized by $\\theta \\in \\Theta$\\\
    n- We only care about distribution of $y$, not of $x$\\n- **Typical case in supervised\
    \ learning**\n\n**Log-likelihood:**\n\n```\n$\\loglik(\\thetatheta; D) = \\sum_{i}\
    \ p_{\\theta}(y_i|x_i)$\n```"
  merge: -1
  img_proc: true
- pgno: 117
  md: "# Example: Linear Gaussian model\n\n$p(y|x) = \\mathcal{N}(y|w^T\\tilde{x},\
    \ \\sigma^2) = \\frac{1}{\\sqrt{2\\pi\\sigma^2}}exp\\left{\\frac{(y-w^T\\tilde{x})^2}{2\\\
    sigma^2}\\right\\}$\n\n$$\\log p(y|x) = -\\log(\\sqrt{2\\pi\\sigma^2}) - \\frac{(y-w^T\\\
    tilde{x})^2}{2\\sigma^2}$\n\nWe consider the following conditional Gaussian model:\n\
    \n$p_{\\theta}(y|x) = \\mathcal{N}(y|w^T\\tilde{x}, \\sigma^2), \\quad \\theta\
    \ = \\{\\mathbf{w}\\}$\n\n# **Log-likelihood:**\n\n$$\\log liklik(\\theta; D)\
    \ = -N\\log\\sqrt{2\\pi\\sigma^2} - \\sum_{i} \\frac{(y_i - w^T\\tilde{x}_i)^2}{2\\\
    sigma^2}$\n\n+   - For obtaining $\\mathbf{w}$, only the squared errors matter,\
    \ i.e.\n  $\\log liklik(\\theta; D) = const_1 - const_2\\sum_{i}(y_i - w^T\\tilde{x}_i)^2$\n\
    \n+   - Hence, the **MLE solution is equivalent to the least squares solution**!\n\
    \n+   - **But:** we can also obtain the variance $\\sigma^2$ by MLE!"
  merge: -1
  img_proc: true
