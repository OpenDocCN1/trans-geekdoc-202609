- pgno: 322
  md: '# # First vs. second order optimization


    ## First order optimization:


    +   1. Use gradient to form linear approximation

    2. Step in the direction of the minimum of the approximation


    ## Second order optimization:


    +   1. Use gradient and Hessian to form quadratic approximation

    2. Step to the minimum of the approximation


    ![](img/f01928df50903c99ce023dd3c527a33d_322_0.png)'
  merge: -1
  img_proc: true
- pgno: 323
  md: '# 2nd order methods


    2nd order Taylor approximation:


    ```

    $$\mathcal{L}(\theta) \approx \mathcal{L}(\theta_0) + (\theta - \theta_0)^T \mathbf{g}
    + (\theta - \theta_0)^T \mathbf{H}(\theta - \theta_0)$

    ```


    +   - With $g = \nabla_{\theta}\mathcal{L}(\theta)$ is the gradient and $H = \nabla_{\theta}^2\mathcal{L}(\theta)$
    is the Hessian matrix


    Solving for $\theta$ yields a Newton update:


    ```

    $$\theta^* = \theta_0 - H^{-1}\mathbf{g}$

    ```


    Properties:


    +   - No hyperparameters

    - No learning rate

    - Less iterations required


    +   - Hessian has O($N^2$) parameters

    - Inverse is O($N^3$)

    - N is huge (several millions!)'
  merge: -1
  img_proc: true
- pgno: 324
  md: "# 2nd order methods\n\n+   * **Quasi-Newton methods (BFGS most popular):**\
    \ instead of inverting the Hessian (O(N³)), approximate inverse Hessian with rank\
    \ 1 updates over time (O(N²) each).\n* **L-BFGS (Limited memory BFGS):** Does\
    \ not form/store the full inverse Hessian.\n  - Usually works very well in full\
    \ batch, deterministic mode i.e. if you have a single, deterministic f(x) then\
    \ L-BFGS will probably work very nicely\n  - Does not transfer very well to mini-batch\
    \ setting. Gives bad results. Adapting L-BFGS to large-scale, stochastic setting\
    \ is an active area of research.\n\nIn practiseise:\n* **Adam** is a good default\
    \ choice in most cases, but also try SGD (mini-batches) with learning rate schedule\
    \ if you think overfit with **Adam**\n* If you can afford to do full batch updates\
    \ then try out L-BFGS (and don’t forget to disable all sources of noise)"
  merge: -1
  img_proc: true
