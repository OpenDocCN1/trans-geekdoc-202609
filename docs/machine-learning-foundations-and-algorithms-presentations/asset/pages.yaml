  md: '# # Multiclass Classification gradient result (do not show)


    Gradient:


    ```

    $$\frac{\partial loss_i}{\partial w_k} = \frac{\partial}{\partial w_k} \left(
    \sum_{k=1}^{K} h_{c_{i,k}} w_k^T \phi(\mathbf{x}_i) - \log \left( \sum_{j=1}^{K}
    \exp \left( w_j^T \phi(\mathbf{x}_i) \right) \right) \right)$$

    n$$= h_{c_{i,k}} \phi(\mathbf{x}_i) - \frac{\partial}{\partial w_k} \log \left(
