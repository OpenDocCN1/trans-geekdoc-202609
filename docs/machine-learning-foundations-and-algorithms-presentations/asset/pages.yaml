- pgno: 100
  md: '# Regularization


    +   Regularization:

    - We have seen huge errors on the test set for too complex models

    - **Problem**: Weights can get very large to fit the data exactly

    - **Solution**: Limit the model (i.e. weights) such that it can not fit the training
    data perfectly any more


    # Simple form of regularization: forcing the weights **w** to be small


    +   - Small weights will lead to a smoother function

    - Introduce “regularization term” in cost-function


    ```

    $L = E_D(\mathbf{w}) + \lambda E_W(\mathbf{w})$

    $Loss = Data term + Regularization term$

    ```


    +   - where $\lambda$ is the regularization factor

    - Needs to be tuned manually in most cases'
  merge: -1
  img_proc: true
- pgno: 101
  md: "# # Regularized Least Squares\n\nWith the sum-of-squares error function and\
    \ a quadratic regularizer, we get\n\n```\n$$L_{\\text{ridge}} = (y - \\Phi w)^T(y\
    \ - \\Phi w) + \\lambda w^T w$\n$E_D(w) \\quad E_W(w)$\n```\n\n+   - This particular\
    \ choice of regularizer is known as **weight decay** because in sequential learning\
    \ algorithms, it encourages weight values to decay towards zero, unless supported\
    \ by the data.\n- In statistics, it is called **ridge regression**.\n\nDerivations\
    \ can be done similarly as before. The solution is given by\n\n```\n$$w^*_{\t\
    ext{ridge}} =(\\Phi^T \\Phi + \\lambda I)^{-1}\\Phi^T y$$\n```\n\n+   - $I$ is\
    \ the Identity matrix\n- The matrix $(\\Phi^T \\Phi + \\lambda I)$ is now full\
    \ rank and can be more easily inverted"
  merge: -1
  img_proc: true
