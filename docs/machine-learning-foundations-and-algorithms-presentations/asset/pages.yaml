- pgno: 294
  md: '# # Backpropagation


    Full backpropagation algorithm:


    +   - Let $v_1, \dots, v_N$ be a topological ordering of the computation graph
    (i.e. parents come before children.)

    - $v_N$ denotes the variable we’re trying to compute derivatives of (e.g. loss).


    ![](img/f01928df50903c99ce023dd3c527a33d_294_0.png)


    ```

    $$\begin{aligned} \text{forward pass} & \quad i = 1, \dots, N \ & \text{Compute
    } v_i \text{ as a function of } Pa(v_i) \ \ \text{backward pass} & \quad \overline{v_N}
    = 1 \ & \ i = N-1, \dots, 1 \ & \overline{v_i} = \sum_{j \in Ch(v_i)} \overline{v_j}
    \frac{\partial v_j}{\partial v_i}} \end{aligned}$

    ```'
  merge: -1
  img_proc: true
- pgno: 295
  md: "# # Backpropagation\n\n**Example:** univariate logistic least squares regression\n\
    \n![](img/f01928df50903c99ce023dd3c527a33d_295_0.png)\n\n# **Backward pass:**\n\
    \n$\\overline{\\mathcal{L}_{\text{reg}}} = 1$\n\n$\\overline{\\mathcal{R}} = \\\
    overline{\\mathcal{L}_{\text{reg}}} \\frac{d\\mathcal{L}_{\text{reg}}}{d\\mathcal{R}}\n\
    $\\overline{\\mathcal{R}} = \\overline{\\mathcal{L}_{\text{reg}}} \\lambda$\n\n\
    $\bar{z} = \bar{y} \\frac{dy}{dz}$\n$\bar{z} = \bar{y}\\sigma'(z)$\n\n$\bar{w}\
    \ = \bar{z} \\frac{\\partial z}{\\partial w} + \\overline{\\mathcal{R}} \\frac{d\\\
    mathcal{R}}{dw}$\n$\bar{w} = \bar{z}x + \\overline{\\mathcal{R}}w$\n\n# **Forward\
    \ pass:**\n\n$z = wx + b$\n$y = \\sigma(z)$\n$\\mathcal{L} = \\frac{1}{2}(y -\
    \ t)^2$\n$\\mathcal{R} = \\frac{1}{2}w^2$\n$\\mathcal{L}_{\text{reg}} = \\mathcal{L}\
    \ + \\lambda\\mathcal{R}$\n\n$\\overline{\\mathcal{L}} = \\overline{\\mathcal{L}_{\t\
    ext{reg}}} \\frac{d\\mathcal{L}_{\text{reg}}}{d\\mathcal{L}}\n$\bar{y} = \\overline{\\\
    mathcal{L}} \\frac{d\\mathcal{L}}{dy}\n$\\overline{\\mathcal{L}}(y - t)$n$\bar{b}\
    \ = \bar{z} \\frac{\\partial z}{\\partial b}\n$\bar{b} = \bar{z}$"
  merge: -1
  img_proc: true
- pgno: 296
  md: '# # Backpropagation


    Example: Multi-layer Perceptron (multiple outputs)


    # Backward pass:


    ![](img/f01928df50903c99ce023dd3c527a33d_296_0.png)


    # Forward pass:


    ```

    $\overline{\mathcal{L}} = 1$$

    $\overline{y_k} = \overline{\mathcal{L}}(y_k - t_k)$$

    $\overline{w_{ki}} = \overline{y_k}\overline{h_i}$

    $\overline{b_k} = \overline{y_k}$

    $\overline{h_i} = \sum_k \overline{y_k}\overline{w_{ki}}

    $\overline{z_i} = \overline{h_i}\sigma''(z_i)$$

    $\overline{w_{ij}} = \overline{z_i}x_j$

    $\overline{b_i} = \overline{z_i}$

    ```


    ```

    $z_i = \sum w_{ij}^{(1)}x_j + b_i^{(1)}$$

    $h_i = \sigma(z_i)$$

    $y_k = \sum w_{ki}^{(2)}h_i + b_k^{(2)}$$

    $\mathcal{L} = \frac{1}{2}\sum(y_k - t_k)^2$

    ```


    Can we also do this in **matrix form**?'
