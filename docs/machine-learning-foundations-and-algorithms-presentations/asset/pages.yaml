- pgno: 359
  md: '# # Backpropagation


    Full backpropagation algorithm:


    +   - Let $v_1, \dots, v_N$ be a topological ordering of the computation graph
    (i.e. parents come before children).


    +   - $v_N$ denotes the variable we’re trying to compute derivatives of (e.g.
    loss).


    ![](img/f01928df50903c99ce023dd3c527a33d_359_0.png)


    > forward pass

    For $i = 1, \dots, N$

    Compute $v_i$ as a function of $Pa(v_i)$


    > backward pass

    $\overline{v_N} = 1$

    For $i = N - 1, \dots, 1$

    $\overline{v_i} = \sum_{j \in Ch(v_i)} \overline{v_j} \frac{\partial v_j}{\partial
    v_i}$'
  merge: -1
  img_proc: true
- pgno: 360
  md: "# # Backpropagation\n\nExample: univariate logistic least squares regression\n\
    \n![](img/f01928df50903c99ce023dd3c527a33d_360_0.png)\n\n# **Backward pass:**\n\
    \n$\\mathcal{L}_{\text{reg}} = 1$\n$\bar{\\mathcal{R}} = \\mathcal{L}_{\text{reg}}\
    \ \\frac{d\\mathcal{L}_{\text{reg}}}{d\\mathcal{R}}$n$\bar{z} = \bar{y} \\frac{dy}{dz}$\n\
    $\\overline{\\mathcal{L}_{\text{reg}}} = \bar{y}\\sigma'(z)$\n$\bar{w} = \bar{z}\
    \ \\frac{\\partial z}{\\partial w} + \bar{\\mathcal{R}} \\frac{d\\mathcal{R}}{dw}$\n\
    $\bar{\\mathcal{L}} = \\mathcal{L}_{\text{reg}} \\frac{d\\mathcal{L}_{\text{reg}}}{d\\\
    mathcal{L}}$n$= \bar{z}x + \bar{\\mathcal{R}}w$\n$\\overline{\\mathcal{L}_{\t\
    ext{reg}}}$\n$\bar{y} = \\overline{\\mathcal{L}} \\frac{d\\mathcal{L}}{dy}$\n\
    $\bar{b} = \bar{z} \\frac{\\partial z}{\\partial b}$\n$= \bar{z}$\n$\\overline{\\\
    mathcal{L}}(y-t)$\n\n# **Forward pass:**\n\n$z = wx + b$\n$y = \\sigma(z)$\n$\\\
    mathcal{L} = \\frac{1}{2}(y-t)^2$\n$\\mathcal{R} = \\frac{1}{2}w^2$\n$\\mathcal{L}_{\t\
    ext{reg}} = \\mathcal{L} + \\lambda\\mathcal{R}$"
