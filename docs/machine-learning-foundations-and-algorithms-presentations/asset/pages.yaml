- pgno: 42
  md: "# # Large Language Models\n\n## Can you please come here ?\n\nHistory\n\nWord\
    \ being predicted\n\n![](img/f01928df50903c99ce023dd3c527a33d_42_0.png)\n\nGe\
    \ I want a short poem praising the moon in German\n\n+   - Sanfter Mond am Himmelsz,\n\
    Still und schön den Strahlen fällt,\nDein sanftes Licht die Nacht erhält,\nDie\
    \ Seele ruht, der Geist entfaltet.\n\nRegenerate response\n\nSend a message...\n\
    \n```\n// write a binary search algorithm\nconst binarySearch = (arr, target)\
    \ => {\n  let left = 0;\n  let right = arr.length - 1;\n  let middle = Math.floor((left\
    \ + right) / 2);\n  while (arr[middle] != target && left <= right) {\n    if (target\
    \ < arr[middle]) {\n      right = middle - 1;\n    } else {\n      left = middle\
    \ + 1;\n    }\n    middle = Math.floor((left + right) / 2);\n  }\n  return arr[middle]\
    \ == target ? middle : -1;\n};\n```"
  merge: -1
  img_proc: true
