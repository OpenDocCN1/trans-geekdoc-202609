- pgno: 237
  md: '# Kernel ridge regression


    The “kernelized” solution is given by:


    $w^* = \Phi^T \underbrace{(\Phi\Phi^T + \lambda\mathbf{I})^{-1}}_{N\times N \text{
    matrix inversion}} y = \Phi^T \underbrace{(\mathbf{K} + \lambda\mathbf{I})^{-1}y}{\alpha}
    = \Phi^T \alpha$


    +   - Instead of inverting a d x d matrix, we can now invert an N x N matrix

    - Is beneficial for d >> N (e.g., d is infinite)

    - Still, $w^* \in \mathbb{R}^d$ is potentially infinite dimensional and can not
    be represented


    Yet, we can evaluate the function f that is specified by $w^*$:


    $f(x) = \phi(x)^T w^* = \phi(x)^T\Phi^T \alpha = k(x)^T\alpha = \sum_{i} \alpha_i
    k(x_i, x)$


    +   - The function is evaluated by a weighted sum of kernel activations evaluated
    at the training data'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# Examples and comparison to RBF regression


    For a Gaussian kernel, the prediction corresponds to


    ```

    $f(\boldsymbol{x}) = \sum_{i} \alpha_i k(\boldsymbol{x}_i, \boldsymbol{x}) = \sum_{i}
    \alpha_i \exp \left(-\frac{\|\boldsymbol{x} - \boldsymbol{x}_i\\|^2}{2\sigma^2}\right)$

    ```


    +   - The kernel allows setting the centres adaptively to the available data!

    - One centre per data-point


    ![](img/f01928df50903c99ce023dd3c527a33d_238_0.png)


    **Comparison:** Linear regression with radial basis function (RBF) features


    ```

    $f(\boldsymbol{x}) = \sum_{i} w_i \phi_i(\boldsymbol{x}) = \sum_{i} w_i \exp \left(-\frac{\\|\boldsymbol{x}
    - \boldsymbol{\mu}_i\\|^2}{2\sigma^2}\right)$

    ```


    ```

    $\boldsymbol{\mu}_i \dots i^{th}$ center location (fixed)

    ```


    ![](img/f01928df50903c99ce023dd3c527a33d_238_1.png)'
  merge: -1
