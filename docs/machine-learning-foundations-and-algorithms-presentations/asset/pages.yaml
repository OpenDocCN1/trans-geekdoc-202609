- pgno: 979
  md: "# Choosing the covariance\n\n+   - Space of functions covered by the GP depend\
    \ on $k(\\theta, \\theta')$\n- Squared exponential (Gaussian) kernel\n\n```\n\
    $k_{SE}(\\theta, \\theta') = \\exp \\left( -\frac{\\sum_{i=1}^{n}(\\theta_i -\
    \ \\theta'_i)^2}{2\\rho_i^2} \\right)$\n```\n\n+   - Isotropic if $\\rho_i = \\\
    rho$ for every dimension i, otherwise anisotropic\n- Functions defined by Gaussian\
    \ kernel are often too smooth**"
  merge: -1
  img_proc: true
- pgno: 980
  md: "# # Matern covariance\n\n+   - Explicit parameter $\\nu$ to control smoothness\n\
    - Matérn kernel:\n$$k_{\nu}(\\mathbf{x}, \\mathbf{x}') = \\frac{2^{1-\nu}}{\\\
    Gamma(\nu)} \\left(\\sqrt{2\nu}r^2(\\mathbf{x}, \\mathbf{x}')\right)^{\nu} K_{\n\
    u} \\left(\\sqrt{2\nu}r^2(\\mathbf{x}, \\mathbf{x}')\right)$$n$$k_{5/2}(\\mathbf{x},\
    \ \\mathbf{x}') = \\left(1 + \\sqrt{5}r^2(\\mathbf{x}, \\mathbf{x}') + \\frac{5}{3}r^2(\\\
    mathbf{x}, \\mathbf{x}')\right) \\exp \\left(-\\sqrt{5}r^2(\\mathbf{x}, \\mathbf{x}')\r\
    ight)$$\n$$\text{with} \\ r^2(\\mathbf{x}, \\mathbf{x}') = \\sum_{i=1}^{n}(x_i\
    \ - x'_i)^2/\rho_i^2$$\n- $\\Gamma$: Gamma function\n- $K_{\nu}$: Bessel function\
    \ of the second kind\n\nWhen $\\nu \\to \\infty$, Matérn kernel converges to Gaussian\
    \ kernel"
  merge: -1
  img_proc: true
