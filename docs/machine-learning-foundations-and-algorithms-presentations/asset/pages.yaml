    \ + \\mathbf{b}^{(L)}$\n\nProbabilistic\n\nlinear Gaussian\n\n$p(\\mathbf{y}|\\\
    mathbf{x}) = \\mathcal{N}(\\mathbf{y}|\\mathbf{W}^{(L)}\\mathbf{h}^{(L-1)} + \\\
    mathbf{b}^{(L)}, \\boldsymbol{\\Sigma})$\n\n+   - Loss:\n\nsquared error\n\n$l_i(\\\
    mathbf{x}_i, \\boldsymbol{\theta}) = \\frac{1}{2}(\\mathbf{f}(\\mathbf{x}_i) -\
    \ \\mathbf{y}_i)^2$\n\nnegative log-likelihood\n\n$l_i(\\mathbf{x}_i, \\boldsymbol{\t\
    heta}) = -log \\mathcal{N}(\\mathbf{y}_i | \\boldsymbol{\\mu}(\\mathbf{x}_i),\
    \ \\boldsymbol{\\Sigma})$"
