- pgno: 374
  md: "# # PyTorch: Autograd Example\n\nModern deep learning toolbox defined all the\
    \ forward and backward passes for common operators (e.g. add, multiply, copy,\
    \ transpose etc. ) and functions (e.g. exp, log, cross-entropy) in the backend.\n\
    \nHere is an example of a linear layer:\n\n$z = W^{(1)}x + b^{(1)}, \\text{gradient\
    \ w.r.t. } z: \\bar{z}$\n\n```\nimport torch\nfrom torch.autograd import Function\n\
    \nclass MyCustomFCLayer(Function):\n    @staticmethod\n    def forward(ctx, x,\
    \ W, b=None):\n        ctx.save_for_backward(x, W, b)\n        z = x.mm(W.t())\
    \ # Matrix multiplication\n        if b is not None:\n            z += b # Direct\
    \ addition of the bias vector\n        return z\n```\n\n```\n@staticmethod\ndef\
    \ backward(ctx, grad_z):\n    x, W, b = ctx.saved_tensors\n    grad_W = grad_b\
    \ = None\n\n    if ctx.needs_input_grad[0]:\n        grad_x = grad_z.mm(W)\n \
    \   if ctx.needs_input_grad[1]:\n        grad_W = grad_z.t().mm(x)\n    if b is\
    \ not None and ctx.needs_input_grad[2]:\n        grad_b = grad_z.sum() # Direct\
    \ gradient without summing\n\n    return grad_x, grad_W, grad_b\n```"
  merge: -1
