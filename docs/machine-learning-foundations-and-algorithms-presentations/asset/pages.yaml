- pgno: 522
  md: "# # Self-attention as set encoder\n\n+   - Self-attention treats input as sets\
    \ not as sequences\n  - Order of words does not matter\n  - Permutation invariant\n\
    \n+   - This ignores relative position!\n  - A context word one word away is different\
    \ from one 10 words away\n  - The attention framework does not take distance into\
    \ consideration\n\n![](img/f01928df50903c99ce023dd3c527a33d_522_0.png)"
  merge: -1
  img_proc: true
- pgno: 523
  md: '# # Positional Encodings


    ![](img/f01928df50903c99ce023dd3c527a33d_523_0.png)


    +   - Note that the inputs are actually word embeddings


    +   - We add a “positional” encoding to them to capture the relative distance
    from one another'
  merge: -1
  img_proc: true
- pgno: 524
  md: "![](img/f01928df50903c99ce023dd3c527a33d_524_0.png)\n\n**Positional Encoding:**\
    \ A sequence of vectors $P_0, \\dots, P_N$ to encode position\n\n+   - **Every\
    \ vector is unique** (and uniquely represents time)\n- Relationship between $P_t$\
    \ and $P_{t+\tau}$ only depends on the distance between them\n\n$P_{t+\tau} =\
    \ M_\tau P_t$\n\nThe linear relationship between $P_t$ and $P_{t+\tau}$ enables\
    \ the net to learn shift-invariant \"gap\" dependent relationships"
  merge: -1
  img_proc: true
- pgno: 525
  md: "# # Positional Encoding\n\n![](img/f01928df50903c99ce023dd3c527a33d_525_0.png)\n\
    \n![](img/f01928df50903c99ce023dd3c527a33d_525_1.png)\n\n+   - A vector of sines\
    \ and cosines of a harmonic series of frequencies\n  - Every $2l$-th component\
    \ of $P_t$ is $\\sin \\omega_l t$\n  - Every $2l+1$-th component of $P_t$ is $\\\
    cos \\omega_l t$\n- Never repeats\n- Has the linearity property required\n- Newer\
    \ variants also use use learned positional encodings"
  merge: -1
  img_proc: true
