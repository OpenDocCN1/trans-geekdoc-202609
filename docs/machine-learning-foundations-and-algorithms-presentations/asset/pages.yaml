- pgno: 994
  md: "# BOHB: Bayesian Optimization & Hyperband\n\nAdvantages of Hyperband\n\n+ \
    \  - Strong anytime performance\n- General-purpose\n  - Low-dimensional continuous\
    \ spaces\n  - High-dimensional spaces with conditionality, categorical dimensions,\
    \ etc\n- Easy to implement\n- Scalable\n- Easily parallelizable\n\n# Advantage\
    \ of Bayesian optimization: strong final performance\n\nCombining the best of\
    \ both worlds in BOHB\n\n+   - Bayesian optimization\n  - for choosing the configuration\
    \ to evaluate (using a TPE variant)\n- Hyperband\n  - for deciding how to allocate\
    \ budgets\n\n> [Falkner, Klein & Hutter, ICML 2018]"
  merge: -1
