- pgno: 402
  md: "# Hold-out method\n\n+   - We would like to pick the model M with the smallest\
    \ generalization error\n- Can judge the generalization error by independent data\
    \ set (not used for training)\n\n**Hold-out procedure:** n datapoints available\
    \ $D = \\{(\boldsymbol{x}_i, y_i)\\}_{i=1}^n$\n\n+   1. Split into 2 datasets:\n\
    \   **Training Data**\n$D_T = \\{(\boldsymbol{x}_i, y_i)\\}_{i=1}^m\n   **Validation\
    \ Data**\n$D_V = \\{(\boldsymbol{x}_i, y_i)\\}_{i=m+1}^n$\n2. Train on training\
    \ data to obtain $\\hat{f}_{D_T}(\boldsymbol{x})$ for each model class M\n3. Evaluate\
    \ resulting estimators on validation data, e.g: $MSE(D_V, \\hat{f}_{D_T}) = \\\
    frac{1}{n-m} \\sum_{i=m+1}^n (\\hat{f}_{D_T}(\boldsymbol{x}_i) - y_i)^2$\n4. Pick\
    \ model with best validation loss"
  merge: -1
  img_proc: true
- pgno: 403
