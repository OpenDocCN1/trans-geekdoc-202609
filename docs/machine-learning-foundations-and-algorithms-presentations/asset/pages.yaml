- pgno: 837
  md: "# Maximum a-posteriori solution\n\n“Poor men’s” Bayesian Learning:\n\n+   1.\
    \ Find the parameter vector $\\theta_{MAP}$ that maximizes the posterior\n$$\\\
    theta_{MAP} = \\arg \\max_{\theta} p(\theta|\\mathcal{D}) = \\arg \\max_{\theta}\
    \ p(\\mathcal{D}|\theta)p(\theta)$$\n- Uncertainty in $\\theta$ is ignored\n-\
    \ Optimization is done in log-domain\n$$\\theta_{MAP} = \\arg \\max_{\theta} \\\
    log p(\\mathcal{D}|\\theta) + \\log p(\\theta)$$$\n2. Use $\\theta_{MAP}$ for\
    \ prediction $p(x^*|\\mathcal{D}) \\approx p(x^*|\\theta_{MAP})$\n- We still use\
    \ point estimate - no model uncertainty\n\n**Recap (Lecture 1):** The MAP solution\
    \ is the same as the standard ML solution with L2 regularization (e.g. Ridge regression)"
  merge: -1
  img_proc: true
- pgno: 838
  md: "# # Intermediate Wrap-up Bayesian Learning\n\n+   - Treat parameter vector\
