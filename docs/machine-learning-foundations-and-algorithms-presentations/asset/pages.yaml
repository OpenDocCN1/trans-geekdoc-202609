- pgno: 711
  md: "# # Generative Learning by Denoising\n\nRecall, that the diffusion parameters\
    \ are designed such that $q(\\mathbf{x}_T) \\approx \\mathcal{N}(\\mathbf{x}_T;\
    \ \\mathbf{0}, \\mathbf{I})$\n\n# Generation:\n\nSample $\\mathbf{x}_T \\sim \\\
    mathcal{N}(\\mathbf{x}_T; \\mathbf{0}, \\mathbf{I})$\n\nIteratively sample $\\\
    mathbf{x}_{t-1} \\sim q(\\mathbf{x}_{t-1}|\\mathbf{x}_t)$\n\nTrue Denoising Dist.\n\
    \n![](img/f01928df50903c99ce023dd3c527a33d_711_0.png)\n\nIn general $q(\\mathbf{x}_{t-1}|\\\
    mathbf{x}_t) \\propto q(\\mathbf{x}_{t-1})q(\\mathbf{x}_t|\\mathbf{x}_{t-1})$\
    \ is intractable.\n\nCan we approximate $q(\\mathbf{x}_{t-1}|\\mathbf{x}_t)$?\
    \ Yes, we can use a Gaussian distribution if $\beta_t$ is small in each forward\
    \ diffusion step."
  merge: -1
  img_proc: true
- pgno: 712
  md: "# # Reverse Denoising Process\n\nFormal definition of forward and reverse processes\
    \ in T steps:\n\n![](img/f01928df50903c99ce023dd3c527a33d_712_0.png)\n\n$$p(\\\
    mathbf{x}_T) = \\mathcal{N}(\\mathbf{x}_T; \\mathbf{0}, \\mathbf{I})$$\n\n$$p\\\
    theta(\\mathbf{x}_{t-1}|\\mathbf{x}_t) = \\mathcal{N}(\\mathbf{x}_{t-1}; \\mu_{\t\
    heta}(\\mathbf{x}_t, t), \\sigma_{\theta}^2\\mathbf{I})$$\n\n$$p\\theta(\\mathbf{x}_{0:T})\
    \ = p(\\mathbf{x}_T) \\prod_{t=1}^T p\\theta(\\\\mathbf{x}_{t-1}|\\mathbf{x}_t)$$$\n\
    \nTrainable network\n\nSimilar to the generative model in hierarchical VAEs."
  merge: -1
  img_proc: true
- pgno: 713
  md: "# Diffusion ELBO\n\nWe can again find a variational lower bound (ELBO)\n\n\
    ```\n$\\log p_{\theta}(x_0) = \\log \\int p_{\theta}(x_{0:T})dx_{1:T}$\n$\\geq\
    \ \\log \\int q(x_{1:T}|x_0) \\log \\frac{p_{\theta}(x_{0:T})}{q(x_{1:T}|x_0)}\
    \ dx_{1:T}$\n$\\= \\log \\int q(x_{1:T}|x_0) \\log \\frac{p(x_T) \\prod_{t=1}^{T-1}\
    \ p_{\theta}(x_t|x_{t+1})}{\\prod_{t=1}^{T} q(x_t|x_{t-1})} dx_{1:T}$\n```\n\n\
    ```\n$\\mathbb{E}_{q(x_1|x_0)}[\\log p_{\theta}(x_0|x_1)] - D_{KL}(q(x_T|x_0)|p(x_T))\
    \ - \\sum_{t=2}^{T} \\mathbb{E}_{q(x_t|x_0)}[D_{KL}(q(x_{t-1}|x_t, x_0)|p_{\t\
    heta}(x_{t-1}|x_t))]$\n```\n\nReconstruction\n\nPrior matching\n\nDenoising"
  merge: -1
  img_proc: true
- pgno: 714
  md: "# Diffusion ELBO\n\n```\n$= \\mathbb{E}_{q(x_1|x_0)}[\\log p_{\theta}(x_0|x_1)]\
    \ - D_{KL}(q(x_T|x_0) |p(x_T)) - \\sum_{t=2} q(x_t|x_0)[D_{KL}(q(x_{t-1}|x_t,\
    \ x_0) ||p_{\theta}(x_{t-1}|x_t)])$\n```\n\nReconstruction\n\nPrior matching\n\
    \nDenoising\n\n+   - **Reconstruction**: Reconstruction from least noisy version\
    \ (**hyperparameter choice can make this arbitrarily small)**\n\n+   - **Prior\
    \ matching**: Moving the posterior closer to the true prior on the final noisy\
    \ step (**0 for diffusion models**)\n\n+   - **Denoising**: Divergence between\
    \ approximate denoising ($p_{\theta}$) and true denoising ($q$) steps\n\nLoss\
    \ can focus on the denoising term. Decomposing for each timestep, we can have\
    \ the $t^{th}$ loss term:\n\n```\n$L_t = D_{KL}(q(x_{t-1}|x_t, x_0) ||p_{\theta}(x_{t-1}|x_t))\
    \ + C$\n```"
  merge: -1
  img_proc: true
- pgno: 715
  md: "# # True denoising distribution\n\n+   - \"True denoising distribution\" $q(x_{t-1}|x_t,\
    \ x_0)$ already knows the target\n- Generative distribution $p(x_{t-1}|x_t)$ needs\
    \ to learn to denoise without target\n\n![](img/f01928df50903c99ce023dd3c527a33d_715_0.png)\n\
    \n$q(x_{t-1}|x_t, x_0)$ is **tractable** and can be calculated **exactly** without\
    \ any approximation:\n\n$q(x_{t-1}|x_t, x_0) = \\mathcal{N}(x_{t-1}; \bar{\\mu}_t,\
    \ \bar{\\Sigma}_t)$\n\n$\\bar{\\mu}_t = \\frac{\\sqrt{\\alpha_t}(1-\bar{\\alpha}_{t-1})}x_t\
    \ + \\sqrt{\bar{\\alpha}_{t-1}(1-\\alpha_t)}x_0}{1-\bar{\\alpha}_t}, \\quad \\\
    Sigma_t = \\frac{(1-\\alpha_t)(1-\bar{\\alpha}_{t-1})}{1-\bar{\\alpha}_t}$\n\n\
    > $q(x_{t-1}|x_t, x_0) = q(x_t|x_{t-1}, x_0)q(x_{t-1}|x_0)$"
  merge: -1
  img_proc: true
- pgno: 716
  md: "# Basics: Gaussian Bayes rules\n\nBayes rule for Gaussian distribution:\n\n\
    +   - Marginal: $p(\\mathbf{x}) = \\mathcal{N}(\\mathbf{x}|\boldsymbol{\\mu}_{\\\
    mathbf{x}}, \\Sigma_{\\mathbf{x}})$ \n- Conditional: $p(\\mathbf{y}|\\mathbf{x})\
    \ = \\mathcal{N}(\\mathbf{y}|\\mathbf{F}\\mathbf{x}, \\sigma_y^2I)$\n\n+   - Gaussian\
    \ Bayes Rule 1: $p(\\mathbf{x}|\\mathbf{y})$ is Gaussian with \n- Mean: $\\mu_{\\\
    mathbf{x}|\\mathbf{y}} = \boldsymbol{\\mu}_{\\mathbf{x}} + \\Sigma_{\\mathbf{x}}\\\
    mathbf{F}^T(\\sigma_y^2I + \\mathbf{F}\\Sigma_{\\mathbf{x}}\\mathbf{F}^T)^{-1}(\\\
    mathbf{y}-\boldsymbol{\\mu}_{\\mathbf{y}})$ Correction Term \n- Covariance: $\\\
    Sigma_{\\mathbf{x}|\\mathbf{y}} = \\Sigma_{\\mathbf{x}} - \\Sigma_{\\mathbf{x}}\\\
    mathbf{F}^T(\\sigma_y^2I + \\mathbf{F}\\Sigma_{\\mathbf{x}}\\mathbf{F}^T)^{-1}\\\
    mathbf{F}\\Sigma_{\\mathbf{x}}$ \n- Variance/Uncertainty is reduced by new information\n\
    \nSame Equations as in Kalman Filtering\n\nDerivation: Use Eq (1) from Gaussian\
    \ Identities to form joint $p(\\mathbf{x}, \\mathbf{y})$ from marginal $p(\\mathbf{x})$\
    \ and conditional $p(\\mathbf{y}|\\mathbf{x})$ . Use Eq (2) to form posterior\
    \ $p(\\mathbf{x}|\\mathbf{y})$ from joint $p(\\mathbf{x}, \\mathbf{y})$"
  merge: -1
  img_proc: true
- pgno: 717
