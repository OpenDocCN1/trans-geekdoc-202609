- pgno: 137
  md: '# Linear Classifiers


    A linear classifier is given in the form:


    $f(\mathbf{x}) = \mathbf{w}^T\mathbf{x} + b$


    In 2D, the classifier is a line


    +   - $w$ is the normal to the line

    - $b$ is the bias shifting the boundary


    Lets try to understand why this is the case...


    ![](img/f01928df50903c99ce023dd3c527a33d_137_0.png)'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# Basics: Projections of vectors


    The scalar product of 2 vectors can be used to compute the projection of vector
    a on vector b:


    +   - Geometric definition of scalar product

    $a^T b = \|a\|\|b\|\cos \theta$


    +   - Angle between 2 vectors

    $\cos \theta = \frac{a^T b}{\|a\|\|b\|}$


    +   - Scalar projection of a on b

    $a_b = \|a\|\cos \theta = \frac{a^T b}{\|b\|}$


    ![](img/f01928df50903c99ce023dd3c527a33d_138_0.png)


    **Observation:** If 2 vectors are normal to each other, the projection is 0'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# # Recap: Geometrical inspection


    Observations:


    +   - The decision boundary is normal to **w**

    - Without b, it goes through the origin


    ![](img/f01928df50903c99ce023dd3c527a33d_139_0.png)


    Gerhard Neumann | Machine Learning | KIT | SS 2024 15'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# Recap: Geometrical inspection


    **Observations:**


    +   - b shifts the decision boundary along (negative) direction of **w**

    - The shift corresponds to adding $\frac{b}{\|\mathbf{w}\|}$ to the projection

    - $\mathbf{w}^T\mathbf{x} + b = 0 \Rightarrow \frac{\mathbf{w}^T\mathbf{x}}{\|\mathbf{w}\|}
    + \frac{b}{\|\mathbf{w}\|} = 0$ (projection $x_w$)

    - I.e. in order for **x** to be on the decision boundary, the projection has to
    be $x_w = -\frac{b}{\|\mathbf{w}\|}$


    ![](img/f01928df50903c99ce023dd3c527a33d_140_0.png)'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# Linear Discriminators


    A linear discriminator is given in the form:


    $f(\mathbf{x}) = \mathbf{w}^T\mathbf{x} + b$


    In 2D, the discriminator is a line


    +   - $\mathbf{w}$ is the normal to the line

    - $\b$ is the bias


    In 3D, it''s a **plane**


    In N-D, it''s a **hyper-plane**


    ![](img/f01928df50903c99ce023dd3c527a33d_141_0.png)'
  merge: -1
  img_proc: true
- pgno: 142
  md: "# Linear Classification: 0-1 loss (1st attempt)\n\n**Prediction:** $y = \t\
    ext{step}(f(x)) = \text{step}(w^T x + b)$\n\n+   - Predict class 1 for $f(x) >\
    \ 0\n- else predict class 0\n\n**Optimization:** Find $w$ such that\n\n```\n$L_0(w)\
    \ = \\sum_{i} \\mathbb{I}(\text{step}(w^T x + b) \neq c_i)$\n```\n\n+   - where\
    \ $\\mathbb{I}$ returns 1 if the argument is true\n- ... counts the number of\
    \ misclassifications\n\n× Very **difficult to optimize**!!! (NP-hard)"
  merge: -1
  img_proc: true
- pgno: 143
  md: '# Linear Classification: regression loss (2nd attempt)


    We can use same loss as in regression

    $L_{reg}(\mathbf{w}) = \sum_{i} (f(\mathbf{x}_i) - c_i)^2$


    +   - Minimize the squared error: Easy!

    - However: we ignored the fact that $c_i$ is restricted to $\{0,1\}$


    Not robust to outliers


    ![](img/f01928df50903c99ce023dd3c527a33d_143_0.png)'
