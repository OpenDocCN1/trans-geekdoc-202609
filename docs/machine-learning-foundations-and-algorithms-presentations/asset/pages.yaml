- pgno: 292
  md: '# Multivariable chain rule


    Suppose we have a function $f(x,y)$ and functions $x(t)$ and $y(t)$ (All the variables
    here are scalar-valued.) Then


    $\frac{d}{dt}f(x(t), y(t)) = \frac{\partial f}{\partial x}\frac{dx}{dt} + \frac{\partial
    f}{\partial y}\frac{dy}{dt}$


    ![](img/f01928df50903c99ce023dd3c527a33d_292_0.png)


    # Example:


    $f(x,y) = y + \exp(xy)\nx(t) = cost\nty(t) = t^2$


    # Plug in Chain Rule:


    $\frac{d}{dt}f(x(t),y(t)) = \frac{\partial f}{\partial x}\frac{dx}{dt} + \frac{\partial
    f}{\partial y}\frac{dy}{dt} = (y \exp(xy))(-\sin t) + (1 + x \exp(xy))(2t)$'
  merge: -1
  img_proc: true
