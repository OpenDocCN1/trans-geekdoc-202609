  md: '# Predictive Distribution


    The predictive distribution is given by:


    ```

    $$$p(y^*|x^*,X,y) = \int p(y^*|w,x^*)p(w|X,y)dw\n= \int \mathcal{N}(y^*|\phi^*^T
    w, \sigma_y^2)\mathcal{N}(w|\mu_w|x,y, \Sigma_{w|x,y})dw$$

    ```


    +   * Using Gaussian propagation, we can evaluate the predictive distribution.
    It is Gaussian with


    +   - Mean: $\mu(x^*) = \phi(x^*)^T(\mathbf{\Phi}^T\mathbf{\Phi} + \lambda\sigma_y^2\mathbf{I})^{-1}\Phi^T
    y$


    +   - Variance: $\sigma_y^2(x^*) = \sigma_y^2(1 + \phi(x^*)^T(\mathbf{\Phi}^T\mathbf{\Phi}
    + \lambda\sigma_y^2\mathbf{I})^{-1}\phi(x^*))$


    Nothing new for the mean (same as Ridge Regression / MAP solution)


    However:


    +   - The variance is now input dependent!


    +   - Also captures epistemic uncertainty!'
