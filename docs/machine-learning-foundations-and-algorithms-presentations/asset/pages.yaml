- pgno: 363
  md: '# Recap: Matrix Calculus


    Derivatives of a scalar function w.r.t a vector...


    By default, we use column vector representation


    +   - Yields the gradient vector: $

    abla_{\mathbf{x}}f = \frac{\partial f(x)}{\partial \mathbf{x}} = \left[ \frac{\partial
    f(x)}{\partial \mathbf{x}_1}, \dots, \frac{\partial f(x)}{\partial \mathbf{x}_d}
    \right]^T$

    - Example: Quadratic form $

    abla_{\mathbf{x}}x^T\mathbf{x} = 2\mathbf{x}$


    Derivatives of a vector-valued function w.r.t a vector...


    +   - Yields a matrix (the Jacobian) $

    abla_{\mathbf{x}}f = \frac{\partial f(x)}{\partial \mathbf{x}} = \begin{bmatrix}
    \frac{\partial f_1(x)}{\partial \mathbf{x}_1} & \dots & \frac{\partial f_k(x)}{\partial
    \mathbf{x}_1} \ & \vdots & \vdots \ \frac{\partial f_1(x)}{\partial \mathbf{x}_d}
    & \dots & \frac{\partial f_k(x)}{\partial \mathbf{x}_d} \end{bmatrix}$

    - Example: Linear form $

    abla_{\mathbf{x}}\mathbf{A}\mathbf{x} = \mathbf{A}^T$'
  merge: -1
  img_proc: true
- pgno: 364
  md: "# # Recap: Matrix Calculus\n\nDerivatives of a scalar function w.r.t. a matrix...\n\
    \n+   - ... is again a matrix $\nabla_W f = \begin{bmatrix} \\frac{\\partial f(W)}{\\\
    partial W_{11}} & \\dots & \\frac{\\partial f(W)}{\\partial W_{1d}} \\ \\vdots\
    \ & \\vdots & \\vdots \\ \\frac{\\partial f(W)}{\\partial W_{k1}} & \\dots & \\\
    frac{\\partial f(W)}{\\partial W_{kd}} \\end{bmatrix}$\n\nDerivatives of a vector-valued\
    \ function w.r.t. a matrix...\n\n+   - ... is a 3D tensor! $\nabla_W f = \\frac{\\\
    partial f(W)}{\\partial W} \\in \\mathcal{R}^{m \times n \times d} \text{ with\
    \ } f: \\mathcal{R}^{m \times n} \rightarrow \\mathcal{R}^d$\n\n+   - Why do we\
    \ need this?\n  - Compute derivative w.r.t weight matrix $\\frac{\\partial Wx+b}{\\\
    partial W}$\n  - Luckily there will be a simplification of this..."
