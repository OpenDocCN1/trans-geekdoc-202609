- pgno: 196
  md: '# Soft Max-Margin


    Introduce slack-variables:

    $\xi_i \ge 0$


    Allows violating the margin conditions

    $y_i(w^T x_i + b) \ge 1-\xi_i$


    +   - $0 \le \xi_i \le 1$ sample is between margin and decision boundary:

    margin violation


    +   - $\xi_i > 1$ sample is on the wrong side of the decision boundary:

    misclassified


    ![](img/f01928df50903c99ce023dd3c527a33d_196_0.png)'
  merge: -1
  img_proc: true
- pgno: 197
  md: "# Soft Max-Margin\n\nOptimization problem:\n\n$$\\text{argmin}_{\\mathbf{w},\\\
    xi} \\quad ||\\mathbf{w}||^2 + C\\sum_{i}^N \\xi_i,$$\n$\\text{s.t.} \\quad y_i(\\\
    mathbf{w}^T\\mathbf{x}_i + b) \\ge 1-\\xi_i, \\quad \\xi_i \\ge 0$$\n\nPunish\
    \ large slack variables\n\nCondition for soft-margin\n\n+   - C is a (inverse)\
    \ regularization parameter\n    - Small C: Constraints have little influence ->\
    \ large margin -> large regularization\n    - Large C: Constraints have large\
    \ influence -> small margin -> small regularization\n    - C infinite: Constraints\
    \ are enforced-> hard margin -> no regularization"
  merge: -1
  img_proc: true
