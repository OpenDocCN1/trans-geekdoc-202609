- pgno: 211
  md: "# Comparison to logistic loss function\n\n+   - SVM-hinge loss\n\n$$\n\\text{argmin}_w\
    \ \\lambda \\frac{\\|w\\|^2}{\\text{regularization}} + \\sum_{i=1}^N \\max(0,\
    \ 1 - y_i f(\\boldsymbol{x}_i)), \\text{ with } \\lambda = \\frac{1}{C}\nn$$\n\
    \n+   - (Regularized) logistic regression loss (see lecture 2)\n\n$$\n\\text{argmax}_w\
    \ \\ -\\lambda\\|w\\|^2 + \\sum_{i=1}^N c_i \\log(\\sigma(\\boldsymbol{x}_i))\
    \ + (1-c_i) \\log(1-\\sigma(\\boldsymbol{x}_i)), \\text{ with } c_i \\in \\{0,1\\\
    }\nn$$\n=\\dots\n$$\n\text{argmin}_w \\lambda \\frac{\\|w\\|^2}{\\text{regularization}}\
    \ + \\sum_{i=1}^N \\log(1+\\exp(-y_i f(\\boldsymbol{x}_i))), \\text{ with } y_i\
    \ \\in \\{-1, 1\\}\nn$$\n\nBoth loss functions have similar interpretations\n\n\
    +   - Keep weights small + $y_i f(\\boldsymbol{x}_i)$ should be large\n- Saturates\
    \ if $y_i f(\\boldsymbol{x}_i)$ gets too large"
  merge: -1
  img_proc: true
- pgno: 212
  md: "# Comparison to logistic loss function\n\n# SVM (hinge) loss:\n\nmax (0, 1\
    \ - y_i f(x_i))\n\n+   * Outputs -1 or 1 (classlabels)\n* Estimates maximum margin\
    \ solution\n* Loss contribution is 0 for correct classification\n\n![](img/f01928df50903c99ce023dd3c527a33d_212_0.png)\n\
    \n# Logistic loss:\n\nlog (1 + exp(-y_i f(x_i)))\n\n+   * Outputs probabilities\n\
    * Contribution never 0\n    * Often results in slightly less accurate classification\n\
    * Diverges faster than hinge loss\n    * More sensitive to outliers"
  merge: -1
  img_proc: true
