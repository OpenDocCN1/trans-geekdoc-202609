- pgno: 471
  md: "# Gradient Flow in Vanilla RNNs\n\nVanilla RNN unit:\n\n```\n$h_t = \\tanh(W_{hh}h_{t-1}\
    \ + W_{xh}x_t)$$\n$= \\tanh\\left(W \\left[\begin{smallmatrix} h_{t-1} \\ x_t\
    \ \\end{smallmatrix}\right]\\right)$\n```\n\n![](img/f01928df50903c99ce023dd3c527a33d_471_0.png)\n\
    \nBackpropagation from $h_t$ to $h_{t-1}$ multiplies by $W$ (actually $W_{hh}^T$)\n\
    \n+   - Gradient flow backwards in time\n\n```\n$\\frac{\\partial h_t}{\\partial\
    \ h_{t-1}} = \\text{diag}\\left(\\tanh'\\left(W \\left[\begin{smallmatrix} h_{t-1}\
    \ \\ x_t \\end{smallmatrix}\right]\\right)\\right)W_{hh}^T$\n```\n\n![](img/f01928df50903c99ce023dd3c527a33d_471_1.png)"
