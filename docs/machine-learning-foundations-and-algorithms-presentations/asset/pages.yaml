- pgno: 873
  md: "# Weight space view – GPs as Bayesian Learning Models\n\nSo why are GPs an\
    \ instance of Bayesian Learning?\n\n+   - We can also derive GPs from the Bayesian\
    \ Linear Regression view\n- Kernelized version of Bayesian Linear Regression (with\
    \ infinite dimensional feature spaces)\n\nSo back to Bayesian linear regression....\n\
    \n+   - Likelihood (conditional): $p(y|X,w)=\\mathcal{N}(y|\\Phi w,\\sigma_{y}^{2}I)$n-\
    \ Prior (marginal): $p(w)=\\mathcal{N}(w|\\mathbf{0},\\lambda^{-1}I)$n- Dimensions:\
    \ $w\\in\\mathbb{R}^{d}$ and $Y\\in\\mathbb{R}^{N\times1}$, high/infinite dimensional\
    \ features $d \\gg N$\n\nAs the dimensionality of the marginal variable (parameter\
    \ vector) is now larger than dimensionality of cond. Variable (number of samples),\
    \ we have to use Gaussian Bayes rule 1"
  merge: -1
  img_proc: true
- pgno: 874
  md: "# # Recap: Gaussian Bayes rule\n\n+   - Gaussian Bayes Rule 1\n  - Mean: $\\\
    mu_{w|x,y} = \\lambda^{-1}\boldsymbol{\\Phi}^T(\\sigma_y^2\\mathbf{I} + \\lambda^{-1}\b\
    oldsymbol{\\Phi}\boldsymbol{\\Phi}^T)^{-1}y$\n  - Covariance: $\boldsymbol{\\\
    Sigma}_{w|x,y} = \\lambda^{-1}\\mathbf{I} - \\lambda^{-2}\boldsymbol{\\Phi}^T(\\\
    sigma_y^2\\mathbf{I} + \\lambda^{-1}\boldsymbol{\\Phi}\boldsymbol{\\Phi}^T)^{-1}\b\
    oldsymbol{\\Phi}$\n- Gaussian Bayes Rule 2\n  - Mean: $\\mu_{w|x,y} = (\boldsymbol{\\\
    Phi}^T\boldsymbol{\\Phi} + \\sigma_y^2\\lambda\\mathbf{I})^{-1}\boldsymbol{\\\
    Phi}^Ty$\n  - Covariance: $\boldsymbol{\\Sigma}_{w|x,y} = \\sigma_y^2(\boldsymbol{\\\
    Phi}^T\boldsymbol{\\Phi} + \\sigma_y^2\\lambda\\mathbf{I})^{-1}$\n\n**Observations:\
    \ Both rules are mathematically equivalent**\n\n+   - However, numerically it\
    \ can be a huge difference\n- Bayes rule 1: Invert a matrix with dimension $dim(\\\
    mathbf{y}) \times dim(\\mathbf{y})$\n- Bayes rule 2: Invert a matrix with dimension\
    \ $dim(\\mathbf{w}) \times dim(\\mathbf{w})$\n\n> Use Rule 1 if $dim(\\mathbf{y})\
    \ < dim(\\mathbf{x})$, otherwise Rule 2"
  merge: -1
  img_proc: true
- pgno: 875
  md: "# Recap: A few kernel identities\n\n**A kernel is an inner product of a feature\
    \ space:** $k(\boldsymbol{x}, \boldsymbol{x}') = \\langle\\phi(\boldsymbol{x}),\
    \ \\phi(\boldsymbol{x}')\rangle = \\phi(\boldsymbol{x})^T \\phi(\boldsymbol{x}')$\n\
    \nLet $\\Phi = \begin{bmatrix} \\phi(\boldsymbol{x}_1)^T \\ \\vdots \\ \\phi(\b\
    oldsymbol{x}_N)^T \\end{bmatrix} \\in \\mathbb{R}^{N \times d}$ then the following\
    \ identities hold:\n\n+   * Kernel matrix: $\boldsymbol{K} = \\Phi\\Phi^T$\n\n\
    +    - Check: $[\boldsymbol{K}]_{ij} = \\phi(\boldsymbol{x}_i)^T \\phi(\boldsymbol{x}_j)\
    \ = k(\boldsymbol{x}_i, \boldsymbol{x}_j)$\n\n+   * Kernel vector: $\boldsymbol{k}_{\b\
    oldsymbol{x}^*} = \begin{bmatrix} k(\boldsymbol{x}_1, \boldsymbol{x}^*) \\ \\\
    vdots \\ k(\boldsymbol{x}_N, \boldsymbol{x}^*) \\end{bmatrix} = \begin{bmatrix}\
    \ \\phi(\boldsymbol{x}_1)^T \\phi(\boldsymbol{x}^*) \\ \\vdots \\ \\phi(\boldsymbol{x}_N)^T\
    \ \\phi(\boldsymbol{x}^*) \\end{bmatrix} = \\Phi_X \\phi(\boldsymbol{x}^*)$"
  merge: -1
  img_proc: true
- pgno: 876
  md: "# “Bayesian” kernel identities\n\nA kernel is an inner product of a feature\
    \ space: $k(x, x') = \\lambda^{-1}\\langle\\phi(x), \\phi(x')\rangle = \\lambda^{-1}\\\
    phi(x)^T\\phi(x')$\n\nLet $\\Phi_X = \begin{bmatrix} \\phi(x_1)^T \\ \\vdots \\\
    \ \\phi(x_N)^T \\end{bmatrix} \\in \\mathbb{R}^{N \times d}$ then the following\
    \ identities hold:\n\nIn the Bayesian case, we will subsume the prior precision\
    \ $\\lambda$ into the kernel\n\n+   - **Kernel matrix:** $K = \\lambda^{-1}\\\
    Phi_X\\Phi_X^T$\n\n+   - Check: $[K]_{ij} = \\lambda^{-1}\\phi(x_i)^T\\phi(x_j)\
    \ = k(x_i, x_j)$\n\n+   - **Kernel vector:** $k_{x^*} = \begin{bmatrix} \\phi(x_1,\
    \ x^*) \\ \\vdots \\ \\phi(x_N, x^*) \\end{bmatrix} = \\lambda^{-1}\begin{bmatrix}\
    \ \\phi(x_1)^T\\phi(x^*) \\ \\vdots \\ \\phi(x_N)^T\\phi(x^*) \\end{bmatrix} =\
    \ \\lambda^{-1}\\Phi_X\\phi(x^*)$"
  merge: -1
  img_proc: true
- pgno: 877
  md: "# Computing the Posterior\n\nUsing the Gaussian Bayes Rule 1 results in the\
    \ following posterior:\n\n$$\\mu_{w|x,y} = \\lambda^{-1}\\boldsymbol{\\Phi}^T(\\\
    sigma_y^2\\boldsymbol{I} + \\lambda^{-1}\\boldsymbol{\\Phi}\\boldsymbol{\\Phi}^T)^{-1}_{\\\
    mathbf{K}}\\mathbf{y}$\n\n$$\\boldsymbol{\\Sigma}_{w|x,y} = \\lambda^{-1}\\boldsymbol{I}-\\\
    lambda^{-2}\\boldsymbol{\\Phi}^T(\\sigma_y^2\\boldsymbol{I} + \\mathbf{K})^{-1}_{N\\\
    times N \\text{ matrix}}\\boldsymbol{\\Phi}$\n\n+   - We used the Kernel trick\
    \ to evaluate the inverse matrix\n  - The prior precision $\\lambda$ has been\
    \ subsumed in the kernel\n- Both quantities are still potentially infinite dimensional\
    \ and can not be evaluated!"
  merge: -1
  img_proc: true
- pgno: 878
  md: '# Predictive distribution


    Still, we can use the posterior to evaluate the predictive distribution (using
    the Kernel trick)


    ```

    $p(y^*|\mathbf{x}^*,\mathbf{X},\mathbf{y}) = \int p(y^*|\mathbf{w},\mathbf{x}^*)p(\mathbf{w}|\mathbf{X},\mathbf{y})dw\n=
    \int \mathcal{N}(y^*|\boldsymbol{\phi}_*^T\mathbf{w}, \sigma_y^2)\mathcal{N}(\mathbf{w}|\boldsymbol{\mu}_{w|\mathbf{x},\mathbf{y}},
    \boldsymbol{\Sigma}_{w|x,y})dw$

    ```


    The predictive distribution is again Gaussian with


    +   - Mean: $\mu(\mathbf{x}^*) = \lambda^{-1}\boldsymbol{\phi}(\mathbf{x}^*)^T\boldsymbol{\phi}^T(\sigma_y^2\mathbf{I}+\mathbf{K})^{-1}\mathbf{y}\n=
    \mathbf{k}_{x^*}^T(\sigma_y^2\mathbf{I}+\mathbf{K})^{-1}\mathbf{y}$


    +   - Variance: $\sigma(\mathbf{x}^*) = \sigma_y^2+\lambda^{-1}\boldsymbol{\phi}(\mathbf{x}^*)^T\boldsymbol{\phi}(\mathbf{x}^*)-\lambda^{-2}\boldsymbol{\phi}(\mathbf{x}^*)^T\boldsymbol{\phi}^T(\sigma_y^2\mathbf{I}+\mathbf{K})^{-1}\boldsymbol{\phi}\boldsymbol{\phi}(\mathbf{x}^*)\n=
    \sigma_y^2+k_{x^*}-\mathbf{k}_{x^*}^T(\sigma_y^2\mathbf{I}+\mathbf{K})^{-1}\mathbf{k}_{kx}\n...
    which is the same result as obtained with Gaussian conditioning (Slide 7)'
  merge: -1
  img_proc: true
- pgno: 879
  md: '# Wrap-up: GP derivations


    Function View:


    +   * A Gaussian process is a distribution over functions, where every set of
    N function evaluations is jointly Gaussian distributed

    * Predictions can hence be performed by conditioning


    Weight Space View:


    +   * A Gaussian process is a Bayesian Kernel Regression approach

    * Underlying feature space is potentially infinite dimensional

    * Weight vector (which is not representable) is integrated out using the Kernel
    trick


    Kernel matrix corresponds to covariance matrix of the GP


    While GP for Regression is computationally very expensive ( O(N³) ), it is one
    of the most principled approaches to statistical learning for regression'
  merge: -1
  img_proc: true
- pgno: 880
  md: "# # Kernels and Hyperparameters\n\n+   - The parameters of the kernel (e.g.\
    \ length-scale of Gaussian kernel) are called “hyper-parameters” $\beta$.\n\n\
    +   - The prior precision of the weights as well as the observation noise are\
    \ for simplicity also subsumed in the kernel hyper-parameters\n\n![](img/f01928df50903c99ce023dd3c527a33d_880_0.png)\n\
    \n**The most common kernel is the Gaussian / RBF / squared-exponential Kernel**\n\
    \n$k(\\mathbf{x}_i, \\mathbf{x}_j) = \\lambda^{-1} \\exp \\left(-\\frac{\\|\\\
    mathbf{x}_i - \\mathbf{x}_j\\|}{2l^2}\\right) + \\delta_{ij}\\sigma_y^2$\n\n![](img/f01928df50903c99ce023dd3c527a33d_880_1.png)\n\
    \n+   - $\\lambda...$ prior precision of the weight vector\n\n+   - $\\sigma_y^2...$\
    \ noise variance\n\n+   - (only applied if $i = j$, in this notation $K + \\sigma_y^2\
    \ I$ is replaced by $\\mathbf{C}$)\n\n+   - $l...$ length scale"
  merge: -1
  img_proc: true
