- pgno: 704
  md: '# Properties of Gaussian Distribution


    +   - Sum of 2 Gaussians is Gaussian

    - Product of 2 Gaussian is Gaussian

    - Conditional Distribution of a joint Gaussian is Gaussian

    - Marginal Distribution of a joint Gaussian is Gaussian


    ![](img/f01928df50903c99ce023dd3c527a33d_704_0.png)'
  merge: -1
  img_proc: true
- pgno: 705
  md: "# Basics: Gaussian Identities\n\nEq (1): joint from Marginal and Conditional:\
    \ $p(x) \\leftarrow p(y|x) \\leftarrow p(x, y)$\n\n$\\mathcal{N}(x|\\mu_x,\\Sigma_x)\\\
    mathcal{N}(y|Fx, \\Sigma_y) = \\mathcal{N} \\left( \\left[ \\begin{array}{c} x\
    \ \\ y \\end{array} \right] \\middle| \\left[ \\begin{array}{cc} \\mu_x & \\ F\\\
    mu_x & \\end{array} \\right] , \\left[ \\begin{array}{cc} \\Sigma_x & \\Sigma_x^T\
    \ \\ F\\Sigma_x & \\Sigma_y + F\\Sigma_xF^T \\end{array} \\right] \\right] \\\
    right)$\n\nEq (2): Marginal and Conditional Gaussian from Joint: $p(x,y) \\rightarrow\
    \ p(y|x),p(x)$\n\n$\\mathcal{N} \\left( \\left[ \\begin{array}{c} x \\ y \\end{array}\
    \ \\right] \\middle| \\left[ \\begin{array}{c} \\mu_x \\ \\mu_y \\ \\end{array}\
    \ \\right] , \\left[ \\begin{array}{cc} \\Sigma_x & C \\ C^T & \\Sigma_y \\ \\\
    end{array} \\right] \\rightright) = \\mathcal{N}(x|\\mu_x,\\Sigma_x)\\mathcal{N}(y|\\\
    mu_y + C^T\\Sigma_x^{-1}(x-\\mu_x), \\Sigma_y - C^T\\Sigma_x^{-1}C)$\n\nCan also\
    \ be derived by \"completing the square\"..."
  merge: -1
  img_proc: true
- pgno: 706
  md: '# Basics: Gaussian Bayes rule


    +   - Gaussian Bayes Rule 1: used for derivation with kernels


    +   - Mean: $\mu_{x|y} = \mu_{x} + \Sigma_{x}F^T(\sigma_{y}^2 I + F\Sigma_{x}F^T)^{-1}(y
    - F\mu_{x})$


    +   - Covariance: $\Sigma_{x|y} = \Sigma_{x} - \Sigma_{x}F^T''(\sigma_{y}^2 I
    + F\Sigma_{x}F^T)^{-1}F\Sigma_{x}$


    +   - Gaussian Bayes Rule 2: used for derivation with features


    +   - Mean: $\mu_{x|y} = \mu_{x} + (\sigma_{y}^2\Sigma_{x}^{-1} + F^T F)^{-1}F^T(y
    - F\mu_{x})$


    +   - Covariance: $\Sigma_{x|y} = \sigma_{y}^2(\sigma_{y}^2\Sigma_{x}^{-1} + F^T
    F)^{-1}$


    Do not remember exact equations... but remember their properties


    +   - Both rules are mathematically equivalent...


    +   - However, numerically it can be a huge difference


    +   - Bayes rule 1: Invert a matrix with dimension $dim(y) \times dim(y)$


    +   - Bayes rule 2: Invert a matrix with dimension $dim(x) \times dim(x)$


    Use Rule 1 if $dim(y) < dim(x)$, otherwise Rule 2'
  merge: -1
  img_proc: true
- pgno: 707
  md: "# Gaussian propagation\n\nGiven marginal $p(x) = \\mathcal{N}(x|\boldsymbol{\\\
    mu}_x, \boldsymbol{\\Sigma}_x)$ and conditional $p(y|x) = \\mathcal{N}(y|\boldsymbol{F}x,\
    \ \\sigma_y^2\boldsymbol{I})$ we want to obtain the marginal for y\n\n+   - The\
    \ marginal distribution $p(y) = \\int p(x)p(y|x)dx$ is Gaussian with\n  - Mean:\
    \ $\boldsymbol{\\mu}_y = \boldsymbol{F}\boldsymbol{\\mu}_x$\n  - Variance: $\b\
    oldsymbol{\\Sigma}_y = \\sigma_y^2\boldsymbol{I} + \boldsymbol{F}\boldsymbol{\\\
    Sigma}_x\boldsymbol{F}^T$\n  - Derivation:\n    - Use Eq (1) to obtain joint distribution\n\
    \    - Marginal $p(y)$ can be directly read from the joint\n  - Variance in $y$\
    \ increases due to uncertainty in $x$\n\n+   **In a Gaussian linear model, all\
    \ the marginals stay Gaussian!**\n- And we can compute the marginals in closed\
    \ form!"
  merge: -1
  img_proc: true
- pgno: 708
  md: '# Gaussian propagation for diffusion


    For diffusion, lets first consider skipping one step:


    ```

    $q(x_t|x_{t-2}) = \int_{dx_{t-1}} q(x_t|x_{t-1})q(x_{t-1}|x_{t-2})dx_{t-1} = \mathcal{N}(x_t|mu_{t|t-2},
    \Sigma_{t|t-2})$

    ```


    with $q(x_t|x_{t-1}) = \mathcal{N}(x_t|\sqrt{\alpha_t}x_{t-1}, (1-\alpha_t)\mathbf{I})$,
    with $\alpha_t = 1-\beta_t$


    Apply propagation:


    ```

    $F = \sqrt{\alpha_t}, \sigma_y^2 = 1-\alpha_t, \mu_x = \sqrt{\alpha_{t-1}}x_{t-2},
    \Sigma_x = (1-\alpha_{t-1})\mathbf{I}\n\mu_{t|t-2} = \sqrt{\alpha_t\alpha_{t-1}}x_{t-2},\n\Sigma_{t|t-2}
    = ((1-\alpha_t) + \alpha_t(1-\alpha_{t-1}))\mathbf{I} = (1-\alpha_t\alpha_{t-1})\mathbf{I}$

    ```


    +   - Single step propagation $q(x_t|x_{t-2}) = \mathcal{N}(x_t|\sqrt{\alpha_t\alpha_{t-1}}x_{t-2},
    (1-\alpha_t\alpha_{t-1})\mathbf{I})$


    ![](img/f01928df50903c99ce023dd3c527a33d_708_0.png)'
  merge: -1
  img_proc: true
- pgno: 709
  md: "# Diffusion Kernel\n\nSingle step propagation: $q(x_t|x_{t-2}) = \\mathcal{N}(x_t|\\\
    sqrt{\\alpha_t\\alpha_{t-1}}x_{t-2}, (1-\\alpha_t\\alpha_{t-1})I)$\n\nFull-sequence\
    \ propagation: $q(x_t|x_0) = \\mathcal{N}(x_t|\\sqrt{\bar{\\alpha}_t}x_0, (1-\b\
    ar{\\alpha}_t)\\mathbf{I}), \\\\text{with } \\bar{\\alpha}_t = \\prod_{k=1}^t\
    \ \\alpha_k$\n\n+   - This takes us from time-step 0 (the data) to time-step t\
    \ in one step!\n- We could do this because inference model $q(x_t|x_{t-1})$ is\
    \ very simple!\n\n![](img/f01928df50903c99ce023dd3c527a33d_709_0.png)"
  merge: -1
