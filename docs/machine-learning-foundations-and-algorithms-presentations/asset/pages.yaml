    \n$q(\\mathbf{x}_{t-1}|mathbf{x}_t, \\mathbf{x}_0) = \\frac{q(\\mathbf{x}_t|\\\
    mathbf{x}_{t-1})q(\\mathbf{x}_{t-1}|mathbf{x}_0)}{q(\\mathbf{x}_t|\\mathbf{x}_0)}$\n\
    \n# Gaussian Bayes Rule:\n\n$p(\\mathbf{x}) = \\mathcal{N}(\\mathbf{x}|\boldsymbol{\\\
    mu}_x, \boldsymbol{\\Sigma}_x)$\n\n$p(\\mathbf{y}|\\mathbf{x}) = \\mathcal{N}(\\\
    mathbf{y}|\\mathbf{F}\\mathbf{x}, \\sigma_y^2\\mathbf{I})$\n\n$$\boldsymbol{\\\
    mu}_x = \boldsymbol{\\mu}_{t-1|0} = \\sqrt{\\alpha_t}\\mathbf{x}_0, \\quad \b\
    oldsymbol{\\Sigma}_x = \boldsymbol{\\Sigma}_{t-1|0} = (1-\tilde{\\alpha}_t)\\\
    mathbf{I}$\n\n$$\boldsymbol{\\mu}_{x|y} = \boldsymbol{\\mu}_x + \boldsymbol{\\\
    Sigma}_x\\mathbf{F}^T\\frac{\\sigma_y^2\\mathbf{I} + \\mathbf{F}\boldsymbol{\\\
    Sigma}_x\\mathbf{F}^T}{\text{Gain}}(\\mathbf{y}-\boldsymbol{\\mu}_y)_{\text{Correction\
