- pgno: 204
  md: "# Basics: Sub-gradients\n\n**Remember:** For any convex function $f : \\mathbb{R}^d\
    \ \to \\mathbb{R}$\n\n```\n$f(z) \\geq f(x) + \nabla f(x)^T(z - x)$\n```\n\n+\
    \   - I.e. linear approximation underestimates function\n\n![](img/f01928df50903c99ce023dd3c527a33d_204_0.png)\n\
    \n**A subgradient** of a convex function $f$ at point $\\mathbf{x}$ is any $\\\
    mathbf{g}$ such that\n\n```\n$f(z) \\geq f(x) + g^T(z - x)$\n```\n\n+   - Always\
    \ exists (also if $f$ is not differentiable)\n- If $f$ is differentiable at $\\\
    mathbf{x}$, then $\\mathbf{g} = \nabla f(\\mathbf{x})$"
  merge: -1
  img_proc: true
- pgno: 205
  md: '# # Examples


    Consider $f(x) = |x|$


    +   - For $x \neq 0$, unique sub-gradient of $g = \text{sign}(x)

    - For $x = 0$, sub-gradient is any element of $[-1, 1]$


    ![](img/f01928df50903c99ce023dd3c527a33d_205_0.png)'
  merge: -1
  img_proc: true
- pgno: 206
  md: "# # Examples\n\nLet $f_1, f_2 : \\mathbb{R}^n \to \\mathbb{R}$ be convex, differentiable,\
    \ and consider $f(x) = \\max\\{f_1(x), f_2(x)\\}$\n\n+   - For $f_1(x) > f_2(x)$,\
    \ unique subgradient $g = \nabla f_1(x)$n- For $f_2(x) > f_1(x)$, unique subgradient\
    \ $g = \nabla f_2(x)$n- For $f_1(x) = f_2(x)$, subgradient $g$ is any point on\
    \ the segment between $\nabla f_1(x)$ and $\nabla f_2(x)$\n\n![](img/f01928df50903c99ce023dd3c527a33d_206_0.png)"
  merge: -1
  img_proc: true
- pgno: 207
  md: '# Sub-Gradient Method


    Like gradient descent, but replacing gradients with sub-gradients


    **Sub-gradient Descent:**


    +   - Given convex $f$, not necessarily differentiable

    - Initialize $x_0$

    - Repeat: $x_{t+1} = x_t + \eta g$, where $g$ is any sub-gradient of $f$ at point
    $x_t$'
  merge: -1
  img_proc: true
- pgno: 208
  md: "# # Sub-gradients for hinge loss\n\n$\\mathcal{L}(\\mathbf{x}_i, y_i, \\mathbf{w})\
    \ = \\max(0, 1 - y_{i}f(\\mathbf{x}_i)) \\quad f(\\mathbf{x}_i) = \\mathbf{w}^\t\
    op \\mathbf{x}_i + b$\n\n![](img/f01928df50903c99ce023dd3c527a33d_208_0.png)"
  merge: -1
  img_proc: true
- pgno: 209
  md: '# # Sub-gradient descent for SVMs


    $$\arg\min_{\mathbf{w}} C \sum_{i=1}^{N} \max(0, 1 - y_i f(\mathbf{x}_i)) + ||\mathbf{w}||^2$\n\text{loss
    function} \text{regularization}$


    At each iteration, pick random training sample $(\mathbf{x}_i, y_i)$


    +   - If $y_i f(\mathbf{x}_i) < 1$: $\mathbf{w}_{t+1} = \mathbf{w}_t - \eta(2\mathbf{w}_t
    - C_i\mathbf{x}_i)$

    - Otherwise: $\mathbf{w}_{t+1} = \mathbf{w}_t - \eta 2\mathbf{w}_t$'
  merge: -1
  img_proc: true
