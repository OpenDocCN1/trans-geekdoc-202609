- pgno: 756
  md: '# The Generator


    ![](img/f01928df50903c99ce023dd3c527a33d_756_0.png)


    +   - The generator produces realistic looking $X = G(z)$ from a latent vector
    $Z$

    - Generator input $Z$ can be sampled from a known prior, e.g. standard Gaussian

    - Goal: generated distribution, $P_G(X)$ matches the true data distribution $P_X(X)$'
  merge: -1
  img_proc: true
- pgno: 757
  md: '# The Discriminator


    ![](img/f01928df50903c99ce023dd3c527a33d_757_0.png)


    +   - Discriminator D(X) is trained to tell the difference between real and generated
    (fake) data


    +   - Specifically, data produced by the generator

    - If a perfect discriminator is fooled, the generated data cannot be distinguished
    from real data'
  merge: -1
  img_proc: true
- pgno: 758
  md: '# # Training a GAN


    ![](img/f01928df50903c99ce023dd3c527a33d_758_0.png)


    +   - Both, the generator and discriminator must be trained'
  merge: -1
  img_proc: true
- pgno: 759
  md: "# # Training the discriminator\n\n![](img/f01928df50903c99ce023dd3c527a33d_759_0.png)\n\
    \n+   - the discriminator:\n- The discriminator is provided training examples\
    \ of real and synthetic faces\n- The discriminator is trained to minimize its\
    \ classification loss\n  - Minimize error between actual and predicted labels\n\
    - Discriminator parameters are trained such that\n  - $D(X) = 1$ for real faces\n\
    \  - $D(X) = 0$ for synthetic faces (i.e $1 - D(X) = 1$)\n\n**Bernoulli Log-Likelihood:**\
    \ $LL = \\sum_{x_i \\in D_{real}} \\log D(X_i) + \\sum_{\\hat{x}_i \\in D_{fake}}\
    \ \\log(1 - D(\\hat{X}_i))$"
  merge: -1
  img_proc: true
- pgno: 760
  md: "# Training the generator\n\n![](img/f01928df50903c99ce023dd3c527a33d_760_0.png)\n\
    \n+   * Training the generator:\n- The discriminator’s loss is backpropagated\
    \ to the generator\n- The generator is trained to maximize the discriminator loss\n\
    \  - It is trained to “fool” the discriminator\n- Generator parameters are trained\
    \ such that\n  - $D(G(Z)) = 1$ (i.e. $1 - D(G(Z)) = 0$)"
  merge: -1
  img_proc: true
- pgno: 761
  md: "# # Training the generator\n\n![](img/f01928df50903c99ce023dd3c527a33d_761_0.png)\n\
    \n+   * Training the generator:\n  - The discriminator’s loss is backpropagated\
    \ to the generator\n  - The generator is trained to *maximize* the discriminator\
    \ loss\n    - It is trained to “fool” the discriminator\n  - Generator parameters\
    \ are trained such that\n    - Minimize log $(1 - D(G(Z)))$"
  merge: -1
  img_proc: true
- pgno: 762
  md: '# # The GAN formulation


    ![](img/f01928df50903c99ce023dd3c527a33d_762_0.png)


    +   - Discriminator:

    - For real data $X$, Maximize log $(D(X))$

    - For synthetic data Maximize log $(1 - D(\hat{X}))$


    +   - Generator

    - Minimize log $(1 - D(\hat{X}))$'
  merge: -1
  img_proc: true
- pgno: 763
  md: '# The GAN formulation


    ![](img/f01928df50903c99ce023dd3c527a33d_763_0.png)


    +   * The original GAN formulation is the following min-max optimization


    $$\min_G \max_D E_X \log D(X) + E_Z \log(1 - D(G(Z)))$$


    +   * Objective of $D$: $D(X) = 1$ and $D(G(Z)) = 0$


    +   * Objective of $G$: $D(G(Z)) = 1$'
  merge: -1
  img_proc: true
- pgno: 764
  md: '# # How to Train a GAN?


    ![](img/f01928df50903c99ce023dd3c527a33d_764_0.png)


    Step 1:

    Train the Discriminator using the current Generator


    Step 2:

    Train the Generator to beat the Discriminator


    > **Optimize:** min max $E_X \log D(X) + E_Z \log(1 - D(G(Z)))$


    The discriminator is not needed after convergence'
  merge: -1
  img_proc: true
