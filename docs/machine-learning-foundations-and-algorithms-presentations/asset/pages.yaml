- pgno: 191
  md: '# # Mathematical Formulation


    Observation:


    +   - $w^T x + b = 0$ and $c(w^T x + b) = 0$ define the same hyper-plane


    +   - Scaling $c$ can be chosen freely


    Choose scaling such that


    +   - For positive support vectors $w^T x_+ + b = +1$


    +   - For negative support vectors $w^T x_- + b = -1$


    Margin is then given by


    $$\frac{w^T x_+ + b - w^T x_- + b}{\||w||} = \frac{2}{\|w||}$}$


    ![](img/f01928df50903c99ce023dd3c527a33d_191_0.png)'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# SVM Optimization


    Optimization problem:


    ```

    $\arg\max_w \frac{2}{\|\mathbf{w}\|}$$

    $\text{s.t.} \quad \mathbf{w}^T\mathbf{x}_i + b \beginbegin{cases} \geq +1, &
    \text{if } y_i = +1 \ \leq -1, & \text{if } y_i = -1 \end{cases}$

    ```


    Maximize margin


    Condition for margin


    # Observations:


    +   - If the constraints are not satisfied, our definition of the margin would
    be wrong, i.e,

    $\min_{\mathbf{x}_+\in\mathbf{x}_+} (\mathbf{w}^T\mathbf{x}_+ + b) = +1 \quad
    \max_{\mathbf{x}_-\in\mathbf{x}_-} (\mathbf{w}^T\mathbf{x}_- + b) = -1 \quad \mathbf{x}_-:
    \text{negative examples}$

    $\text{Positive support vectors} \quad \mathbf{x}_+: \text{positive examples}$$

    - Support vectors have the smallest distance to the decision boundary

    - There is at least one positive and one negative data point that satisfy the
    support vector condition exactly (i.e. equality instead of inequality) from above

    - Why? Because of the argmax! Norm of weight vector could be reduced otherwise'
  merge: -1
  img_proc: true
