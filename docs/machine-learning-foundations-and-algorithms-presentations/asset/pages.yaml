- pgno: 903
  md: "# Bayes by Backprop - Reparameterization Trick\n\nWe want to optimize distribution\
    \ $p_{\theta}(x)$ using the following expected objective\n\n$$\\theta^* = \\text{argmin}_\\\
    theta \\mathbb{E}_{p_{\theta}}[f(x)] = \\int p_{\theta}(x)f(x)dx$\n\n... and we\
    \ are given $\\frac{df}{dx}(x)$. How can we exploit this information?\n\nWe can\
    \ reparametrize the expectation:\n\n+   - Introduce random variable $\\xi \\sim\
    \ v(\\xi)$ where q is a simple, parameter-free distribution (e.g.,, $v(\\xi) \\\
    sim \\mathcal{N}(\\mathbf{0}, \\mathbf{I})$\n\n+   - If we can find a mapping\
    \ $x = h_{\theta}(\\xi)$ such that $x$ is distributed as $x \\sim p_{\theta}(x)$\
    \ then:\n\n$$\\int p_{\theta}(x)f(x)dx = \\int v(\\xi)f(h_{\theta}(\\xi))d\\xi$\n\
    \n> We moved the parameters from distribution $p_{\theta}(x)$ into a function\
    \ $h_{\theta}(\\xi)$"
  merge: -1
  img_proc: true
- pgno: 904
  md: "# Basics: Reparameterization Trick\n\n**Example:** Lets assume $p_{\theta}(x)\
    \ = \\mathcal{N}(\boldsymbol{\\mu}, \boldsymbol{\\Sigma})$ and $v(\\xi) = \\mathcal{N}(\\\
    mathbf{0}, I)$. If we set\nnh_{\theta}(\\xi) = \\mu + \\mathbf{A}^T\\xi$, with\
    \ $\theta = \\{\boldsymbol{\\mu}, \boldsymbol{\\Sigma}\\}$ and $\\mathbf{A}^T\\\
    mathbf{A} = \boldsymbol{\\Sigma}\nThen $x' = h_{\theta}(\\xi)$ is distributed\
    \ with $p(x') = \\mathcal{N}(\boldsymbol{\\mu}, \\mathbf{A}^T\\mathbf{A}) = \\\
    mathcal{N}(\boldsymbol{\\mu}, \boldsymbol{\\Sigma})$\n\n**Reparameterization Trick:**\n\
    \n$$\\int p_{\theta}(x)f(x)dx = \\int v(\\xi)f(h_{\theta}(\\xi))d\\xi$$\n\n**Reparameterized\
    \ Gradient:**\n\n$$\nabla_{\theta}\\mathbb{E}_{p_{\theta}}[f(x)] = \\nabla_{\t\
    heta} \\int v(\\xi)f(h_{\theta}(\\xi))d\\xi = \\int v(\\xi)\\frac{\\partial h_{\t\
    heta}}{\\partial \\theta}(\\xi)\\frac{\\partial f}{\\partial x}(x)_{x=h_{\theta}(\\\
    xi)}d\\xi$$\n\n+   - We can now use the gradient $\\frac{\\partial f}{\\partial\
    \ x}$ to compute $\nabla_{\theta}\\mathbb{E}_{p_{\theta}}[f(x)]! $"
  merge: -1
  img_proc: true
- pgno: 905
  md: "# Back to the Variational Inference\n\n**Objective:** $L(\theta) = \text{KL}(q_{\t\
    heta}(x)||p^*(x)) = \\int_{x} q_{\theta}(x) \\left(\\log q_{\theta}(x) - \\log\
    \ \tilde{p}^*(x)\right) d\\mathbf{x}$\n\n**Reparameterization:** Mean-field gaussian\
    \ distribution $q_{\\mu,\\sigma}(x) = \\mathcal{N}(\\mu, \text{diag}(\\sigma^2))$\n\
    \n+   - Mapping is defined as $h_{\theta}(\\xi) = \\mu + \\sigma \\circ \\xi,\
    \ \\quad \\dots$ element-wise product\n\n$\nabla_{\theta} L(\theta) = \nabla_{\t\
    heta} v(\\xi) \\left(\\log q_{\theta}(h_{\theta}(\\xi)) - \\log \tilde{p}^*(h_{\t\
    heta}(\\xi))\right) d\\xi$\n\n+   - Gradient w.r.t $\theta$ can now be easily\
    \ obtained via the chainrule (backpropagation)\n- In combination with VI, reparametization\
    \ algorithm is called Bayes by Backprop"
  merge: -1
  img_proc: true
