- pgno: 189
  md: "# Maximum Margin\n\n+   * **Maximize distance** between hyper-plane and \"\
    difficult examples\"\n  - Examples next to decision boundary\n  - Also called\
    \ **Support Vectors**\n\n+   * **Intuition:**\n  - Less examples close to decision\
    \ boundary -> more robust\n\n+   * **Statistical Learning Theory:**\n  - Maximum\
    \ Margin Classifier has smaller complexity (VC-dimension)\n  - And therefore generalizes\
    \ better\n\n![](img/f01928df50903c99ce023dd3c527a33d_189_0.png)"
  merge: -1
