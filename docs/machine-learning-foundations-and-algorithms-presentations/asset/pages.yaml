- pgno: 870
  md: "# Predictive distribution\n\nWe know that the function values $y$ for the training\
    \ set $X$ and for a new data point $x^*$ are jointly Gaussian distributed. Hence,\
    \ also the conditional $p(y^*|X,y,x^*)$ is also Gaussian distributed.\n\n+   -\
    \ For a new data-point $y^*$ we can obtain the joint distribution over function\
    \ values\n\n$$p\\left(\begin{array}y\\y^*\\end{array}\right)\\||\\left(\begin{array}X\\\
    x^*\\end{array}\right)\\right)=\\mathcal{N}\\left(\\begin{array}y\\y^*\\end{array}\\\
    right)\\||\\left(\\begin{array}K+\\sigma_y^2I&k_{x^*}\\nk_{x^*}^T&k^*+\\sigma_{x^*}^2\\\
    end{array}\\right)\\right)$$$\n\nk\\dots$ kernel matrix, $k_{x^*}=[k(x_1,x^*),\\\
    dots,k(x_N,x^*)]^T\\dots$ kernel vector, $k^*=k(x^*,x^*)$\n\nWe can condition\
    \ on $y$ to obtain $p(y^*|X,y,x^*)$ using the Gaussian identities (see previous\
    \ Lecture). The predictive distribution is Gaussian with\n\n+   - Mean: $\\mu(x^*)=k_{x^*}^T(K+\\\
    sigma_y^2I)^{-1}y$\n- Variance: $\\sigma(x^*)=k^*+\\sigma_y-k_{x^*}^T(K+\\sigma_y^2I)^{-1}k_{x^*}$"
  merge: -1
  img_proc: true
- pgno: 871
  md: "# Predictive distribution\n\nPredictive GP distribution:\n\n+   - Mean:\n \
    \ $\\mu(x^*) = k_{x^*}^T(K+\\sigma_y^2 I)^{-1}y$\n- Variance:\n  $\\sigma^2(x^*)\
    \ = k^* + \\sigma_y^2 - k_{x^*}^T(K+\\sigma_y^2 I)^{-1}k_{x^*}$\n\nObservations:\n\
    \n+   - mean corresponds to the Kernel Ridge Regression solution\n- Yet, we also\
    \ get an input dependent variance estimate\n- Epistemic uncertainty: Variance\
    \ is reduced if kernel activations are high\n\n![](img/f01928df50903c99ce023dd3c527a33d_871_0.png)"
  merge: -1
  img_proc: true
