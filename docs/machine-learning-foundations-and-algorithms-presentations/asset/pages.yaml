- pgno: 336
  md: "# # Batch Normalization\n\n![](img/f01928df50903c99ce023dd3c527a33d_336_0.png)\n\
    \n+   - Suppose, we have net input $z_1^{(2)}$ associated with an activation in\
    \ the 2nd hidden layer\n\n+   - Now, consider all examples in a minibatch such\
    \ that the net input of a given training example at layer 2 is written as\n\n\
    $z_1^{(2)}[i], \\quad i \\in \\{1, \\dots, n\\}$\n\n+   - In the next slides,\
    \ let's omit the layer index, as it may be distracting...\n\n$y_1 y_2 y_3 \rightarrow\
    \ \\mathcal{L}(y, o)$"
