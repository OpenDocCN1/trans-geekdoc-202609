- pgno: 718
  md: "# # Denoising Loss Function\n\n$L_t = D_{KL}(q(x_{t-1} | x_t, x_0) || p_{\t\
    heta}(x_{t-1} | x_t)) + C$\n\nSince both inputs of the divergence are gaussians,\
    \ this further simplifies to:\n\n$L_t = \\mathbb{E}_q \\left[ \\frac{1}{2\\Sigma_t}\
    \ ||\\hat{\\mu}_t - \\mu_{\theta}(x_t, t)||^^2 \right] + C$"
  merge: -1
  img_proc: true
- pgno: 719
  md: "# # Denoising cost function\n\nThis lets us rewrite the true mean of the denoising\
    \ process as:\n\n$$\\mu_t = \\frac{\\sqrt{\bar{\\alpha}_t(1-\bar{\\alpha}_{t-1})}x_t\
    \ + \\sqrt{\bar{\\alpha}_{t-1}}(1-\\alpha_t)x_0}{1-\bar{\\alpha}_t} \\Rightarrow\
    \ \\mu_t = \\frac{1}{\\sqrt{\bar{\\alpha}_t}} \\left( x_t - \\frac{(1-\\alpha_t)}{\\\
    sqrt{1-\bar{\\alpha}_t}} \\epsilon \\right)$\n\n> Rewrite in terms of noise\n\
    $$x_t = \\sqrt{\bar{\\alpha}_t}x_0 + \\sqrt{1-\\bar{\\alpha}_t}\\epsilon \\n\\\
    rightarrow x_0 = \\frac{x_t - \\sqrt{1-\\bar{\\alpha}_t}\\epsilon}{\\sqrt{\bar{\\\
    alpha}_t}}$$\n\nWe can also write the predicted mean as:\n\n$$\\mu\\theta(x_t,\
    \ t) = \\frac{1}{\\sqrt{\bar{\\alpha}_t}} \\left( x_t - \\frac{(1-\\alpha_t)}{\\\
    sqrt{1-\\bar{\\alpha}_t}} \\epsilon\\theta(x_t, t) \\right)$\n\nThis lets us reformulate\
    \ the loss to present a noise prediction problem:\n\n$L_{t-1} = \\mathbb{E}_{x_0,\
    \ \\epsilon} \\left[ \\frac{(1-\\alpha_t)^2}{2\\Sigma\\alpha_t(1-\\bar{\\alpha}_t)}\
    \ \\right] ||\\epsilon - \\epsilon\\theta(x_t, t)||^2 + \\mathcal{C}$"
  merge: -1
  img_proc: true
- pgno: 720
  md: "# Diffusion Models – Training and Inference\n\nAlgorithm 1 Training\n1: repeat\n\
    2: $x_0 \\sim q(x_0)$\n3: $t \\sim \\text{Uniform}(\\{1, \\dots, T\\)$)\n4: $\\\
    epsilon \\sim \\mathcal{N}(0, I)\\n5: Take gradient descent step on\n6: until\
    \ converged\n\nAlgorithm 2 Sampling\n1: $x_T \\sim \\mathcal{N}(0, I)\\n2: for\
    \ $t = T, \\dots, 1$ do\n3: $z \\sim \\mathcal{N}(0, I)$ if $t > 1$, else $z =\
    \ 0$\\n4: $x_{t-1} = \\frac{1}{\\sqrt{\\alpha_t}}(x_t - \\frac{1-\\alpha_t}{\\\
    sqrt{1-\\\bar{\\alpha}_t}}\\epsilon_\\theta(x_t, t)) + \\sigma_t z$\\n5: end for\n\
    6: return $x_0$\n\nHow do we tell the model what timestep we are on?\nTemporal\
    \ encodings in the form or sinusoids (or anything, really)\n\nGerhard Neumann\
    \ | Machine Learning | KIT | SS 2024"
