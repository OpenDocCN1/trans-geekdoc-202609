- pgno: 927
  md: '# MCD as variational inference


    Variational Inference for Bayesian Learning


    Prior: $p(W) = \prod_{i,j} p(w_{ij}), \ p(w_{ij}) = \mathcal{N}(0, 1)$


    Approximate posterior: $q(W|\mu) = \prod_{i} q(w_i|\mu_i)$ $p$ is a fixed hyper-parameter!


    $q(w_i|\mu_i) = p \delta(0) + (1 - p) \delta(\mu_i)$


    Approximate KL-divergence: $KL(q(W|\mu)||p(W)) \approx \alpha|\mu||_2^2$ (see
    paper for the proof)'
  merge: -1
  img_proc: true
- pgno: 928
  md: "# # Evidence lower bound\n\n#  Reparameterization\n\n$q(W|\\mu) = \\prod_{i}\
    \ q(w_i|\\mu_i)$\n\n$q(w_i|\\mu_i) = p \\ \\delta(0) + (1 - p) \\ \\delta(\\mu_i)$\n\
    \n$w_i = f(\\mu_i, m_i) = \\mu_i \\cdot m_i$\n\n$p(m_i) = \text{Bernoulli}(p)$\n\
