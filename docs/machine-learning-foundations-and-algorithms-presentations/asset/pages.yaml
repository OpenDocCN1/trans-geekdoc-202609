- pgno: 273
  md: '# Universal Function Approximation


    FF-NNs with nonlinear activation functions are universal function approximators:


    +   - Given a potentially infinite amount of units, they can approximate any function
    arbitrarily well

    - Universal Function Approximation Theorem: Already a single layer is enough to
    achieve “universality”


    ![](img/f01928df50903c99ce023dd3c527a33d_273_0.png)


    Example: Approximating a function arbitrary close using rectangles'
  merge: -1
