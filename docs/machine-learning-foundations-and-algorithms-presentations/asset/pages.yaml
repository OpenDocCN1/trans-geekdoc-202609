- pgno: 152
  md: "# # Logistic “Regression”\n\nOptimizing the log-likelihood of a sigmoid is\
    \ called logistic regression\n\n$argmax_{\\tilde{w}} \\text{loglik}(\tilde{w},\
    \ D) = \\text{argmax_{\\tilde{w}} \\sum_{i} c_i \\log \\sigma(\\tilde{w}^T \\\
    tilde{x}_i) + (1 - c_i) \\log (1 - \\sigma(\\tilde{w}^T \\tilde{x}_i))$\n\n+ \
    \  - ... even though we solve a classification problem\n\n+   - One can show that\
    \ the function is still convex (only one maximum exists)\n\n+   - However, there\
    \ is no closed form solution as in linear regression\n\n+   - It is also often\
    \ called the cross-entropy loss (coming from information theory)\n\nHow can we\
    \ find the maximum? **-> Gradient Descent!**"
  merge: -1
  img_proc: true
- pgno: 153
  md: "# # Generalized logistic models\n\nAs in regression, we can fit a **linear\
    \ discriminator** in a **non-linear feature** space\n\n+   - Similar to generalized\
    \ linear regression models\n\n$\\text{argmax}_w \\text{loglik}(\\boldsymbol{w},\
    \ D) = \\text{argmax}_w \\sum_{i} c_i \\log \\sigma(\\\boldsymbol{w}^T \\boldsymbol{\\\
    phi}(\\boldsymbol{x}_i)) + (1 - c_i) \\log (1 - \\sigma(\\boldsymbol{w}^T \\boldsymbol{\\\
    phi}(\\boldsymbol{x}_i)))$\n\n+   - Problems that are not linear separable in\
    \ input space can be linear separable in feature space\n\n![](img/f01928df50903c99ce023dd3c527a33d_153_0.png)"
  merge: -1
