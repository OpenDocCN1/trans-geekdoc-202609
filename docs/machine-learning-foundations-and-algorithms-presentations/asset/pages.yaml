- pgno: 119
  md: '# # A probabilistic formulation of regularization


    **We can formalize regularization as a prior on the parameters:**


    +   - Prior can specify that we want to have small parameter vectors, i.e.,n$p(\theta)
    = \mathcal{N}(0, \lambda^{-1}\mathcal{I})$


    +   - Find the parameter vector $\theta_{MAP}$ that maximizes the likelihood times
    prior

    $$\theta_{MAP} = \arg\max_{\theta} p(\mathcal{D}|\theta)p(\theta) \ \dots$ or
    in log domain

    $$\theta_{MAP} = \arg\max_{\theta} \log p(\mathcal{D}|\theta) + \log p(\theta)$


    +   - This is called maximum posteriori estimate (MAP) as it maximizes the posterior
    $p(\theta|\mathcal{D})$ (more on in the probabilistic ML chapter)


    $p(\theta|\mathcal{D}) = \frac{p(\mathcal{D}|\theta)p(\theta)}{p(\mathcal{D})}
    \propto p(\mathcal{D}|\theta)p(\theta)$'
  merge: -1
  img_proc: true
- pgno: 120
  md: "# Maximum a-posteriori solution\n\nMAP solution: $\theta_{\text{MAP}} = \\\
    arg \\max_{\theta} (\\log p(\\mathcal{D}|\\theta) + \\log p(\theta))$\n\n+   -\
    \ Prior has similar role than a regularization loss\n\n# Example: Regression\n\
    \n+   - Gaussian likelihood $p(\\mathcal{D}|\\theta) = p(\\mathbf{Y}|\\mathbf{X},\\\
    theta) = \\prod_{i} \\mathcal{N}(y_i|f_{\\theta}(\\mathbf{x}_i), \\sigma^2)$\n\
    \n+   - Gaussian prior $p(\\theta) = \\mathcal{N}(\\theta|\\mathbf{0}, \\lambda^{-1}I)$\n\
    \n+   - Corresponding objective: $\\arg \\max_{\theta} \\sum_{i} \\frac{1}{2\\\
    sigma^2}(y_i - f_{\\theta}(\\mathbf{x}_i))^2 - \\frac{\\lambda}{2}\\theta^T\\\
    theta + c(\\sigma^2,\\lambda) \\underline{\\text{Sum of squared errors}} \\text{\
    \ only interested in } \\theta$\n\n+   - Gaussian prior corresponds to a L2 regularization\
    \ loss!\n\n+   - Gaussian likelihood corresponds to squared loss!"
  merge: -1
  img_proc: true
- pgno: 121
  md: "# # MAP for Linear Regression\n\n**Remember:** In linear regression $f_w(\\\
    mathbf{x}) = w^T \\phi(\\mathbf{x})$\n\n**Objective:** $w_{\text{MAP}} = \\arg\
    \ \\max_{\\mathbf{w}} \\sum_{i} -\\frac{1}{2\\sigma^2}(y_i - \\mathbf{w}^T \\\
    phi(\\mathbf{x}_i))^2 - \\frac{\\lambda}{2}\\mathbf{w}^T \\mathbf{w} + c(\\sigma^2,\
    \ \\lambda) \text{ only interested in } w$\n\nSum of squared errors\n\n$=\\arg\
    \ \\min_{\\mathbf{w}} \\sum_{i} (y_i - \\mathbf{w}^T \\phi(\\mathbf{x}_i))^2 +\
    \ \\lambda\\sigma^2\\mathbf{w}^T \\mathbf{w} + c(\\sigma^2, \\lambda)$\n\n+  \
    \ - The **MAP objective** for Linear Regression is equivalent to **Ridge Regression**!\n\
    \n+   - with $\\lambda_{\text{ridge}} = \\lambda\\sigma^2$"
  merge: -1
  img_proc: true
- pgno: 122
  md: "# # MAP for Linear Regression\n\nObjective: $w_{MAP} = \\arg \\min_{w} \\sum_{i}\
    \ (y_i - w^T \\phi(x_i))^2 + \\lambda\\sigma^2 w^T w$\n\nResult: $w_{MAP} = (\\\
    mathbf{\\Phi}^T \\mathbf{\\Phi} + \\lambda\\sigma^2 I)^{-1}\\mathbf{\\Phi}^T y$\n\
    \n+   - We have now 2 parameters:\n  - $\\lambda$ ... sets the importance of the\
    \ prior\n  - $\\sigma^2$ ... uncertainty of the training data\n- Can be set by\
    \ optimizing log likelihood + log prior on test set\n\n+   - Comparison:\n- Ridge\
    \ Regression $w_{Ridge} = $(\\mathbf{\\Phi}^T \\mathbf{\\Phi} + \\lambda I)^{-1}\\\
    mathbf{\\Phi}^T y$"
  merge: -1
  img_proc: true
