- pgno: 161
  md: "# Convex functions\n\nA convex function $f : \\mathbb{R}^d \to \\mathbb{R}$\
    \ satisfies for any $\boldsymbol{x}_0, \boldsymbol{x}_1 \\in \\mathbb{R}^d$\n\n\
    $f((1-\\alpha)\boldsymbol{x}_0 + \\alpha\boldsymbol{x}_1) \\le (1-\\alpha)f(\b\
    oldsymbol{x}_0) + \\alpha f(\boldsymbol{x}_1), \\quad \\alpha \\in [0, 1]$\n\n\
    +   - Line joining $(\boldsymbol{x}_0, f(\boldsymbol{x}_0))$ and $(\boldsymbol{x}_1,\
    \ f(\boldsymbol{x}_1))$ is always \\above the function value\\n- There is only\
    \ one minimum!\n\n![](img/f01928df50903c99ce023dd3c527a33d_161_0.png)"
  merge: -1
  img_proc: true
- pgno: 162
  md: "# Gradient Descent\n\n+   - Is good for finding **global minima** if function\
