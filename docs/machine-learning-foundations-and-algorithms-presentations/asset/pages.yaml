  md: '# Example: Bayesian Optimization in AlphaGo


    +   * During the development of AlphaGo, its many hyperparameters were tuned with
    Bayesian optimization multiple times.


    +   * This automatic tuning process resulted in substantial improvements in playing
    strength. For example, prior to the match with Lee Sedol, they tuned the latest
    AlphaGo agent and this improved its win-rate from 50% to 66.5% in self-play games.
    This tuned version was deployed in the final match.'
