- pgno: 794
  md: "# # Change of variables\n\n![](img/f01928df50903c99ce023dd3c527a33d_794_0.png)\n\
    \n# ## univariate\n\n**Z** : source random variable and density $p(z)$\n\n**X**\
    \ : target random variable and density $q(x)$\n\n$T : Z \rightarrow X$\n\n$q(x)\
    \ = p(z) \\left| \\frac{\\partial T(z)}{\\partial z} \right|^{-1}$\n\n$p(z)dz\
    \ = q(x)dx$\n\n# ## multivariate\n\n**T** : $\\mathbb{R}^d \rightarrow \\mathbb{R}^d$\n\
    \n$q(x) = p(z) \\left| \\frac{dz}{dx} \right|$\n\n$q(x) = p(z) \\left| \\det\\\
    left(\nabla_z T(z)\right) \right|^{-1}$"
  merge: -1
  img_proc: true
- pgno: 795
  md: '# Recipe for learning


    Given: dataset $\mathcal{D} := \{x_1, x_2, x_3, \dots, x_n\} \sim q(\mathbf{x})$


    learn the density $q(\mathbf{x})$


    choose a simple source density $p(\mathbf{z})$


    use maximum likelihood


    ```

    $$\prod_{i=1}^n q(\mathbf{x}_i) = \prod_{i=1}^n p(\mathbf{z}_i) |det(\nabla_{\mathbf{z}}
    \mathbf{T}(\mathbf{z}_i))^{-1}|$

    $\hat{\mathbf{T}} := \arg \max_{\mathbf{T}} \prod_{i=1}^n p(\mathbf{z}_i) |det(\nabla_{\mathbf{z}}
    \mathbf{T}(\mathbf{z}_i))^{-1}|$

    $\hat{\mathbf{T}} := \arg \max_{\mathbf{T}} \sum_{i=1}^n \log p(\mathbf{z}_i)
    - \log |det(\nabla_{\mathbf{z}} \mathbf{T}(\mathbf{z}_i))|$$

    ```


    But....


    what are $\mathbf{z}_i$ ?


    $$\mathbf{z}_i = \mathbf{T}^{-1}(\mathbf{x}_i)$


    so we need the inverse $\mathbf{T}^{-1}$


    computing determinant computationally expensive


    triangular maps


    computation of **inverse** and **Jacobian** must be **cheap**'
  merge: -1
  img_proc: true
- pgno: 796
  md: '# # Normalizing Flows - Compositions


    +   - Biijections allow for composing several functions together!

    - This follows that we can now define:


    $z \sim p(z)\nx = f_T \circ f_{T-1} \circ \dots \circ f_1 \ (z)$


    ![](img/f01928df50903c99ce023dd3c527a33d_796_0.png)


    $$\log p_x(x) = \log p_z(z_0) + \sum_{t=1}^{T} \log|det.f_{z_t}(g(z_{t-1}))|.\;quad
    z_T = x, z_0 = z$


    **Inverse: $z = g_1 \circ g_2 \circ \dots \circ g_T(x)$**'
  merge: -1
  img_proc: true
- pgno: 797
  md: '# # Normalizing Flows - Characteristics


    For a good (efficient) flow, we must have functions (steps) that are:


    +   1. Expressive

    2. Invertible

    3. Offer cheap to compute Jacobian determinants


    Computing a determinant is a cubic operation, but some special cases of matrices
    can make it very cheap. Which cases?


    +   - For a **diagonal matrix**, the determinant is simply the product of its
    diagonal elements. Same applies for any **triangular matrix**!'
  merge: -1
