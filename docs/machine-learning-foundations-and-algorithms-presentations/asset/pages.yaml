- pgno: 963
  md: '# Predictive distribution of a GP


    Given: inputs $x_i$, noisy outputs $y_i$


    +   - Kernel matrix: $[K]_{x_i x_j} = k(x_i, x_j)

    - Kernel vector: $k(x^*) = [k(x_1, x^*), \dots, k(x_N, x^*)]^T$


    # GP posterior distribution:


    +   - We can evaluate mean and variance for unseen data-point $x''$


    $\mu(x'') = k_{x''}^T(K + \sigma_y^2 I)^{-1}y$

    $\sigma^2(x'') = k(x'', x'') + \sigma_y^2 - k_{x''}^T(K + \sigma_y^2 I)^{-1}k_{x''}$


    # Observations:


    +   - The mean corresponds to the Kernel Ridge Regression solution

    - Can represent aleatoric and epistemic uncertainty


    ![](img/f01928df50903c99ce023dd3c527a33d_963_0.png)


    Example of Sinusoidal Data Set (green: true function; blue: noisy data; red: GPR
    predictive mean; shaded: $\pm2\sigma$)'
  merge: -1
  img_proc: true
- pgno: 964
  md: "# Template for BO using Acquisition Functions\n\nFor each round $t$ :\n\n+\
    \   1. Select an action $\theta_t \\in \\mathcal{X}$ that maximizes an acquisition\
    \ function $\text{acq}_t(\\theta)$\n\n+   2. Observe reward\n\n$r_t = g(\\theta_t)\
    \ + \\epsilon_t, \\quad \\epsilon_t \\dots \\text{observation noise}$\n\n**After\
    \ T rounds:** recommend solution $\\theta_T^*$"
  merge: -1
