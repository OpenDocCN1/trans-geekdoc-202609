- pgno: 190
  md: '# Geometric Inspection


    Distance between point $\mathbf{x}_i$ and line: $r = \frac{\mathbf{w}^T\mathbf{x}_i+b}{\|\mathbf{w}\|}$


    ![](img/f01928df50903c99ce023dd3c527a33d_190_0.png)'
  merge: -1
