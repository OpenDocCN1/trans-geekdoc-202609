- pgno: 78
  md: '# Regression


    # Regression:


    +   - Learn continuous function


    $y = f(x) + \epsilon$


    # Linear Regression:


    +   - “just” fit a line


    $y = f(x) + \epsilon = w_0 + w_1x + \epsilon$


    We assume that the outputs are affected by (typically) Gaussian noise:


    $\epsilon \sim \mathcal{N}(0, 1)$


    ![](img/f01928df50903c99ce023dd3c527a33d_78_0.png)


    ![](img/f01928df50903c99ce023dd3c527a33d_78_1.png)'
  merge: -1
  img_proc: true
- pgno: 79
  md: "# # Objective of Regression\n\nWe want to minimize the summed (or mean) squared\
    \ error\n$$SSE = \\sum_{i=1}^{N} (y_i - f(\\boldsymbol{x}_i))^2$$\n\n+   - ...\
    \ where the input **x** is a d-dimensional vector\n\n# ## Why do we use the squared\
    \ error?\n\n+   - It is fully differentiable\n- Easy to optimize\n- It also makes\
    \ sense as it can be shown that:\n\n$$f^*(\boldsymbol{x}) = \\text{argmin}_{f(\\\
    boldsymbol{x})}SSE \\Rightarrow f^*(\boldsymbol{x}) = \\mathbb{E}[y|\\boldsymbol{x}]$$\n\
    \n+   - Hence, we always estimate the mean of the target function!"
  merge: -1
  img_proc: true
- pgno: 80
  md: '# # Linear regression models


    +   - In linear regression, the output y is modelled as linear function of the
    input x_i


    $$y = f(x) + \epsilon = w_0 + w_1x + \epsilon$$


    # ## Effect of $w_0$


    # ## Effect of $w_1$


    ![](img/f01928df50903c99ce023dd3c527a33d_80_0.png)


    ![](img/f01928df50903c99ce023dd3c527a33d_80_1.png)'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# Objective for Linear Regression


    We want to consider linear functions with multiple inputs


    $f(x_i) = w_0 + \sum_{j} w_j x_{i,j}$


    Our SSE objective now looks the following


    $SSE = \sum_{i=1}^{N} (y_i - (w_0 + \sum_{j} w_j x_{i,j}))^2$


    Can we simplify it using matrices??"'
  merge: -1
  img_proc: true
- pgno: 82
  md: "# Linear regression models in matrix form\n\n+   - Equation for the i-th sample\n\
    \n$$\\hat{y}_i = w_0 + \\sum_{j=1}^{D} w_j x_{i,j} = \tilde{\boldsymbol{x}}_i^T\
    \ \boldsymbol{w}, \\quad \text{with } \tilde{\boldsymbol{x}}_i = \begin{bmatrix}\
    \ 1 \\ x_i \\end{bmatrix} \text{and } \boldsymbol{w} = \begin{bmatrix} w_0 \\\
    \ \\vdots \\ w_D \\end{bmatrix}$$\n\n+   - Equation for full data set\n\n$$\\\
    hat{\boldsymbol{y}} = \begin{bmatrix} \\hat{y}_1 \\ \\vdots \\ \\hat{y}_n \\end{bmatrix}\
    \ = \begin{bmatrix} \tilde{\boldsymbol{x}}_1^T \\ \\vdots \\ \tilde{\boldsymbol{x}}_n^T\
    \ \\end{bmatrix} = \boldsymbol{X}\boldsymbol{w}$$\n\n+   - $\\hat{\boldsymbol{y}}$\
    \ is a vector containing the output for each sample\n\n+   $$\\boldsymbol{X} =\
    \ \begin{bmatrix} 1 & \tilde{\boldsymbol{x}}_1^T \\ \\vdots & \\vdots \\ 1 & \t\
    ilde{\boldsymbol{x}}_n^T \\end{bmatrix} \\quad \\text{is the data-matrix containing\
    \ a vector of ones as the first column as bias}$$"
  merge: -1
  img_proc: true
- pgno: 83
  md: "# Linear regression models in matrix form\n\n+   Error vector: $e = \begin{bmatrix}\
    \ y_1 \\ \\vdots \\ y_n \\end{bmatrix} - \begin{bmatrix} \\hat{y}_1 \\ \\vdots\
    \ \\ \\hat{y}_n \\end{bmatrix} = y - \\hat{y} = y - Xw$\n\n+   Sum of squared\
    \ errors (SSE)\n$SSE = \\sum_{i} (y_i - \\hat{y}_i)^2 = \\sum_{i} e_i^2 = e^T\
    \ e = (y - Xw)^T(y - Xw)$\n\n+   We have now written the **SSE completely in matrix\
    \ form!**"
  merge: -1
  img_proc: true
- pgno: 84
  md: "# Deriving Linear Regression\n\n+   - How do we obtain the optimal $w$ ? (which\
    \ minimizes the SSE)\n\n$w^* = \text{argmin}_w SSE = \text{argmin}_w (y - Xw)^T(y\
    \ - Xw)$\n\n![](img/f01928df50903c99ce023dd3c527a33d_84_0.png)\n\n> At a minimal\
    \ value of a function, its derivative is zero\n\ni.e., find a $w$ where $\\frac{\\\
    partial SSE}{\\partial w} = \\mathbf{0}^T$"
  merge: -1
  img_proc: true
- pgno: 85
  md: '# Estimation of w


    ```

    $SSE(\mathbf{w}) = (\mathbf{y} - \mathbf{X}\mathbf{w})^T(\mathbf{y} - \mathbf{X}\mathbf{w})$

    $= \mathbf{w}^T\mathbf{X}^T\mathbf{X}\mathbf{w} - \mathbf{y}^T\mathbf{X}\mathbf{w}
    - \mathbf{w}^T\mathbf{X}^T\mathbf{y} + \mathbf{y}^T\mathbf{y}$

    $= \mathbf{w}^T\mathbf{X}^T\mathbf{X}\mathbf{w} - 2\mathbf{y}^T\mathbf{X}\mathbf{w}
    + \mathbf{y}^T\mathbf{y}$

    ```


    Take the derivative w.r.t $\mathbf{w}$ :


    ```

    $\nabla_{\mathbf{w}}SSE(\mathbf{w}) = \frac{\partial}{\partial\mathbf{w}} \ \mathbf{w}^T\mathbf{X}^T\mathbf{X}\mathbf{w}
    - 2\mathbf{y}^T\mathbf{X}\mathbf{w} + \mathbf{y}^T\mathbf{y} \}$

    ```


    Setting the gradient to **0** $\mathbf{w}^* =(\mathbf{X}^T\mathbf{X})^{-1}\mathbf{X}^T\mathbf{y}$'
  merge: -1
  img_proc: true
- pgno: 86
  md: "# Evaluating regression models\n\n# How can we estimate the quality of the\
    \ model?\n\n+   - The SSE can take arbitrary values depending on the range of\
    \ the output\n- Make the evaluation invariant to the variance of y\n\nR-Square\
    \ (or $R^2$) determines how much of the total variation in $y$ is explained by\
    \ the variation in $x$. Mathematically, it can be written as\n\n$R^2 = 1 - \\\
    frac{\text{Regression sum of squares}}{\text{Total sum of squares}} = 1 - \\frac{\\\
    sum_{n=1}^N(\\hat{y}_n - y_n)^2}{\\sum_{n=1}^N(y_n - \bar{y})^2}$\n\nwhere $\b\
    ar{y}$ is the mean of the outputs. $R^2$ tells how well the regression line approximates\
    \ the real data points. An $R^2$ of 1 indicates that the regression line perfectly\
    \ fits the data."
  merge: -1
  img_proc: true
