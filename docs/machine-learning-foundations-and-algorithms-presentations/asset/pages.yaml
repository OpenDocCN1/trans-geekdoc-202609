  md: '# # Recap: Matrix Calculus


    ![](img/f01928df50903c99ce023dd3c527a33d_362_0.png)


    The computational graph works for matrix and vector too!


    As a result:

    The gradient of the loss (a scalar) w.r.t. a scalar is a scalar w.r.t. a vector
    is a vector w.r.t. a matrix is a matrix.


    But, to achieve the final results, the back-propagation algorithm needs intermediate
    calculation of derivatives of:

    vector w.r.t vector → a matrix

    vector w.r.t matrix → a 3rd-order Tensor


    ![](img/f01928df50903c99ce023dd3c527a33d_362_1.png)'
  merge: -1
