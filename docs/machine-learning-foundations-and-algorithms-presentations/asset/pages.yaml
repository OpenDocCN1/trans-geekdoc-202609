- pgno: 446
  md: "# Stride and padding\n\n+   - We can also set the \"stride\" (step-size) for\
    \ our convolution\n  - Stride > 1 often used to down-sample the image\n\n+   -\
    \ What do we we do with border pixels?\n  - Padding: Fill up the image borders\
    \ (zero-padding is most common)\n\nIn general, common to see CONV layers with\
    \ stride 1, filters of size FxF, and zero-padding with (F-1)/2. (will preserve\
    \ size spatially)\n\n+   - e.g. F = 3 => zero pad with 1\n- F = 5 => zero pad\
    \ with 2\n- F = 7 => zero pad with 3\n\n![](img/f01928df50903c99ce023dd3c527a33d_446_0.png)"
