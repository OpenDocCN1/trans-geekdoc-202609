- pgno: 244
  md: "# Support Vector Machines (continued...)\n\nSVMs with features:\n\n+   - Maximum\
    \ margin principle\n- Slack variables allow for margin violation\n  $$\\argmin_{\\\
    mathbf{w}, \\xi} ||\\mathbf{w}\\|^2 + C \\sum_{i=1}^{N} \\xi_i,$$$\n  $$\\text{s.t.}\
    \ \\quad y_i(\\mathbf{w}^T \\phi(\\mathbf{x}_i) + b) \\ge 1-\\xi_i, \\quad \\\
    xi_i \\ge 0$$\n- Simpler formulation without slack variables\n  $$\\argmin_{\\\
    mathbf{w}} ||\\mathbf{w}\\|^2,$$$\n  $$\\text{s.t.} \\quad y_i(\\mathbf{w}^T \\\
    phi(\\mathbf{x}_i) + b) \\ge 1$$\n\n![](img/f01928df50903c99ce023dd3c527a33d_244_0.png)\n\
    \nIn order to apply the kernel trick, we need to apply Constrained Optimization!\n\
    \n+   - ... however, we do not have time for going into that\n- See RL lecture"
  merge: -1
  img_proc: true
- pgno: 245
  md: "# # Constraint Optimization in SVMs\n\n![](img/f01928df50903c99ce023dd3c527a33d_245_0.png)\n\
    \nIn constraint optimization, we have to optimize the **dual function:**\n\n$\\\
    lambda^* = \\text{argmax}_{\\lambda} g(\\lambda) = \\text{argmax}_{\\lambda} \\\
    sum_{i} \\lambda_i - \\frac{1}{2} \\sum_{i,j} \\lambda_i \\lambda_j y_i y_j \\\
    phi(x_i)^T \\phi(x_j), \\text{s.t. } \\lambda_i > 0$\n\n+   - Where $\\lambda_i$\
    \ are Lagrangian multipliers\n- The weight vector can then be obtained by\n  $\\\
    boldsymbol{w}^* = \\sum_{i} \\lambda_i y_i \\phi(\\boldsymbol{x}_i)$\n\n**We can\
    \ directly use the kernel trick here**\n\n$g(\\lambda) = \\sum_{i} \\lambda_i\
    \ - \\frac{1}{2} \\sum_{i,j} \\lambda_i \\lambda_j y_i y_j k(x_i, x_j)$\n\n+ \
    \  - Scalar products of the feature vectors can be written as kernels, $i.k(x_i,\
    \ x_j) = \\phi(x_i)^T \\phi(x_j)$"
  merge: -1
  img_proc: true
- pgno: 246
  md: '# Relaxed constraints with slack


    # Primal optimization problem:


    $\arg\min_{\mathbf{w}} \quad ||\mathbf{w}\|^2 + C \sum_{i=1}^N \xi_i$,$

    $\text{s.t.} \quad y_i(\mathbf{w}^T\mathbf{x}_i + b) \geq 1 - \xi_i, \quad \xi_i
    \geq 0$


    # Dual optimization problem:


    $\max_{\lambda} \sum_{i} \lambda_i - \frac{1}{2} \sum_{i} \sum_{j} \lambda_i y_i
    y_j k(\mathbf{x}_i, \mathbf{x}_j)$$

    $\text{s.t.} \quad C \geq \lambda_i \geq 0, \forall i \in [1 \dots N], \quad \sum_{i}
    \lambda_i y_i = 0$


    # This is a quadratic program


    +   - Quadratic objective, linear constraints

    - Efficient solution solvers exists'
  merge: -1
  img_proc: true
