- pgno: 514
  md: '# # Self-attention


    ![](img/f01928df50903c99ce023dd3c527a33d_514_0.png)


    For each word, we compute an attention weight between that word and all other
    words


    +   - The raw attention of the i-th word to the j-th word is a function of query
    $q_i$ and key $k_j$

    - The raw attention values are put through a softmax to get the final attention
    weights'
  merge: -1
