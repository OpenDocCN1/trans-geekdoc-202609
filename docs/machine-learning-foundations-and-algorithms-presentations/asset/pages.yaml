- pgno: 340
  md: '# # Backpropagation for BatchNorm Parameters


    $$z_j''^{(2)} = \frac{z_j^{(2)}[i]} - \mu_j}{\sigma_j} \quad a_j''^{(2)} = \gamma_j
    \cdot z_j''^{(2)} + \beta_j$$


    ![](img/f01928df50903c99ce023dd3c527a33d_340_0.png)


    $$\frac{\partial l}{\partial \beta_j} = \sum_{i=1}^n \frac{\partial l}{\partial
    a_j''^{(2)}[i]}} \cdot \frac{\partial a_j''^{(2)}[i]}{\partial \beta_j} = \sum_{i=1}^n
    \frac{\partial l}{\partial a_j''^{(2)}[i]}$$


    $$\frac{\partial l}{\partial \gamma_j} = \sum_{i=1}^n \frac{\partial l}{\partial
    a_j''^{(2)}[i]}} \cdot \frac{\partial a_j''^{(2)}[i]}{\partial \gamma_j} = \sum_{i=1}^n
    \frac{\partial l}{\partial a_j''^{(2)}[i]}} \cdot z_j''^{(2)}[i]$$'
  merge: -1
  img_proc: true
- pgno: 341
  md: '# # Backprop Beyond the BatchNorm Layer


    ![](img/f01928df50903c99ce023dd3c527a33d_341_0.png)


    Since the minibatch mean and variance act as parameters, we can/have to apply
    the multivariable chain rule


    ```

    $$\frac{\partial l}{\partial z_j^{(2)}[i]}} = \frac{\partial l}{\partial z''_j^{(2)}[i]}}
    \frac{\partial z''_j^{(2)}[i]}{\partial z_j} + \frac{\partial l}{\partial \mu_j}
    \frac{\partial \mu_j}{\partial z_j^{(2)}[i]} + \frac{\partial l}{\partial \sigma_j}
    \frac{\partial \sigma_j^2}{\partial z_j^{(2)}[i]} = \frac{\partial l}{\partial
    z''_j^{(2)}[i]}} \cdot \frac{1}{\sigma_j} + \frac{\partial l}{\partial \mu_j}
    \cdot \frac{1}{n} + \frac{\partial l}{\partial \sigma_j^2} \cdot \frac{1(z_j^{(2)}-\mu_j)}{n}$

    ```


    ```

    $$\mu_j = \frac{1}{n} \sum z_j^{[i]}$

    ```


    ```

    $$\sigma_j^2 = \frac{1}{n} \sum (z_j^{[i]}-\mu_j)^2$

    ```


    ```

    $z_j''^{[i]} = \frac{z_j^{[i]}-\mu_j}{\sigma_j}$

    ```'
