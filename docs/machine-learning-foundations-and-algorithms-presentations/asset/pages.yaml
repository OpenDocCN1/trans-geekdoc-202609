- pgno: 421
  md: '# Model ensembles


    +   1. Train multiple independent models

    2. At test time average their results (Take average of predicted probability distributions,
    then choose argmax)


    Enjoy 2% extra accuracy!


    # Why does this work?


    +   - We average over “unspecified behaviour” between the training data points

    - Related to Bayesian Deep Learning (will be covered...)

    - See recent NeurIPS tutorial on deep ensembles – they are currently the most
    accurate known models in many tasks!'
  merge: -1
  img_proc: true
- pgno: 422
  md: "# Variance reduction for Ensembles\n\nIn general: Var $\\left[\frac{1}{M} \\\
    sum_{i=1}^{M} X_i\\right] = \\frac{1}{M^2}Var\\left[\\sum_{i=1}^{M} X_i\\right]\
    \ = \\frac{1}{M}Var\\left[X\\right],, \\quad$ if $X$ i.i.d.$\n\n+   - i.e. the\
    \ variance of a mean estimator linearly decreases with the number of samples\n\
    - ... if i.i.d assumption holds...\n\nIn practice: Var $\\left[\frac{1}{M} \\\
    sum_{i=1}^{M} \\text{Model}_i\\right] > \\frac{1}{M}Var[\\Model\\],, \\quad$ as\
    \ models are still correlated\n\n+   - But variance reduction is still significant\n\
    - Ensembles reduce the **variance** of the base learner but has almost no effect\
    \ on the **bias**\n  - i.e. less overfitting: The more models the better (but\
    \ also costly)\n- It's most effective if we use **strong** base learners that\
    \ have very little bias but high variance, e.g., neural nets"
  merge: -1
  img_proc: true
