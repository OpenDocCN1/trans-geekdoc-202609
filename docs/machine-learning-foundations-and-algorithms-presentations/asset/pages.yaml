- pgno: 200
  md: '# # Reformulation into an unconstrained problem


    Constrained optimization: Slack variables


    ```

    $\text{argmin}_{\mathbf{w}, \xi} ||\mathbf{w}||^2 + C \sum_{i=1}^{N} \xi_i, \quad
    \text{s.t.} \quad y_i(\mathbf{w}^T \mathbf{x}_i + b) \geq 1-\xi_i, \quad \xi_i
    \geq 0$

    Regularization parameter

    ```


    SVMs can be reformulated into an unconstrained optimization problem


    +   - Rewrite constraints: $\xi_i \geq 1-y_i(\mathbf{w}^T \mathbf{x}_i + b) =
    1-y_i f(\mathbf{x}_i)$


    +   - Together with $\xi_i \geq 0$ this results in $\xi_i = \max(0, 1-y_i f(\mathbf{x}_i))$
    (Why?)


    Unconstrained optimization (over w):


    ```

    $\text{argmin}_{\mathbf{w}} ||\mathbf{w}||^2 + C \sum_{i=1}^{N} \max(0, 1-y_i
    f(\mathbf{x}_i))$

    regularization loss function

    ```'
  merge: -1
  img_proc: true
- pgno: 201
  md: "# # Hinge Loss\n\n$$\\text{argmin}_{w} ||w||^2_{\text{regularization}} + C\
    \ \\sum_{i=1}^{N} \\max(0, 1 - y_i f(\boldsymbol{x}_i))_{\text{loss function}}$\n\
    \n**Points are in 3 categories:**\n\n+   * $y_i f(\boldsymbol{x}_i) > 1$ : Point\
    \ outside margin, no contribution to loss\n* $y_i f(\boldsymbol{x}_i) = 1$ : Point\
    \ is on the margin, no contribution to loss as in hard margin\n* $y_i f(\boldsymbol{x}_i)\
    \ \\le 1$ : Point violates the margin, contributes to loss\n\n![](img/f01928df50903c99ce023dd3c527a33d_201_0.png)"
  merge: -1
  img_proc: true
