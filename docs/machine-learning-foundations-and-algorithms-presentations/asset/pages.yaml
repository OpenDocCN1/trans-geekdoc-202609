- pgno: 623
  md: "# Mixture Models are Latent Variable Models\n\nMixture models are an instance\
    \ of latent variable models\n\n+   - Examples: mixture models, missing data, latent\
    \ factors,\n- Observed variables: **x**, Latent variables: **z** (e.g., index\
    \ k of mixture component)\n\nParametric model: $p_{\theta}(\boldsymbol{x}, z)\
    \ = p(\boldsymbol{x}|z)p(z)$, for GMM: $p_{\theta}(\boldsymbol{x}, k) = p(\boldsymbol{x}|k)p(k)$\n\
    \nMarginal distribution: $p_{\theta}(\boldsymbol{x}) = \\sum_{z} p(\boldsymbol{x},\
    \ z), \\quad p_{\theta}(\boldsymbol{x}) = \\int_{z} p_{\theta}(\boldsymbol{x},\
    \ z)dz$\nddiscrete latent variable\ncontinuous latent variable\n\n(Marginal) Log-Likelihood:\n\
    $L(\boldsymbol{\theta}) = \\sum_{i=1}^{N} \\log \\left(\\sum_{z} p_{\theta}(\b\
    oldsymbol{x}_i, z)\right)$\n\n... which is **hard to optimize** for all latent\
    \ variable models (due to log of a sum)"
  merge: -1
  img_proc: true
- pgno: 624
  md: '# Expectation-Maximization (EM)


    Expectation-Maximization (EM) is a general algorithm for estimating latent variable
    models


    +   - Most common application: Gaussian Mixture models

    - ... many other (deep) models as well

    - Its extension is called Variational Bayes, which is underlying variational auto-encoder
    and other variational inference techniques

    - Very hot research topic... pays off to look into the math of it


    EM can be derived in 2 ways:


    +   - Jensen''s inequality (not covered, see GKI)

    - Decomposition in lower-bound and KL-term (harder to understand, but more insightful)'
  merge: -1
  img_proc: true
- pgno: 625
  md: "# # Expectation-Maximization (EM)\n\nEM uses a lower bound of the marginal\
    \ log-likelihood for the optimization\n\n+   - For simplicity, lets consider only\
    \ a single data-point first\n\n$$\\log p(\\boldsymbol{x}|\\boldsymbol{\theta})\
    \ = \\sum_{z} q(z) \\log \\frac{p(\\boldsymbol{x}, z|\\boldsymbol{\theta})}{q(z)}\
    \ + \\sum_{z} q(z) \\log \\frac{q(z)}{p(z|\\boldsymbol{x})}$$\\n$$\\text{marginal\
    \ log-like} \\text{ Lower Bound } \\mathcal{L}(q,\\boldsymbol{\theta}) \\text{\
    \ KL Divergence: KL}(q(z)||p(z|\\boldsymbol{x}))$$\n\nWhere $q(z)$ is called the\
    \ variational / auxiliary distribution\n\n+   - This decomposition holds for any\
    \ $q(z)$\n- By introducing q(z), the optimization will become much simpler\n\n\
    Why is that the same?\n\n+   - We can use Bayes rule for $p(z|\\boldsymbol{x})\
    \ = \\frac{p(\\boldsymbol{x}, z|\\boldsymbol{\theta})}{p(\\boldsymbol{x}|\\boldsymbol{\t\
    heta})}$ and all terms except $p(\\boldsymbol{x}|\\boldsymbol{\theta})$ cancel"
  merge: -1
  img_proc: true
- pgno: 626
  md: '# Recap: Kullback-Leibler Divergences


    The KL-divergence is an important similarity measure for distributions


    ```

    $KL(q(x)||p(x)) = \sum_{x} q(x) \log \frac{q(x)}{p(x)}$

    ```


    +   - Its always non-negative

    - If its zero, both distributions are the same:

    - It is non-symmetric (hence, its not a distance metric):


    $KL(q||p) \geq 0$

    $KL(q||p) = 0 \iff q = p$

    $KL(q||p) \neq KL(p||q)$


    +   - Can be used to find different approximations of distributions

    - Used a lot in Variational Inference, Reinforcement Learning, Information theory...'
  merge: -1
  img_proc: true
- pgno: 627
  md: '# EM-Decomposition


    Derivation:


    $\log p(\boldsymbol{x}) = \sum_{z} q(z) \log p(\boldsymbol{x})$


    +   1. Introduce variational distribution $q(z)$


    = \sum_{z} q(z)(\log p(\boldsymbol{x}, z) - \log p(z|\boldsymbol{x}))$


    +   2. Use Bayesian theorem $p(\boldsymbol{x}) = \frac{p(\boldsymbol{x}, z)}{p(z|\boldsymbol{x})}$


    = \sum_{z} q(z)(\log p(\boldsymbol{x}, z) - \log q(z))$


    +   3. Add and subtract $\log q(z)$


    + \log q(z) - \log p(z|\boldsymbol{x})$


    = \sum_{z} q(z) \log \frac{p(\boldsymbol{x}, z)}{q(z)} + \sum_{z} q(z) \log \frac{q(z)}{p(z|\boldsymbol{x})}$


    +   4. Write as 2 sums


    Lower Bound $\mathcal{L}(q)$

    KL Divergence: $KL(q(z)||p(z|\boldsymbol{x}))$'
  merge: -1
  img_proc: true
- pgno: 628
  md: "# EM Decomposition\n\nMarginal Likelihood decomposes in 2 terms: $\\log p(x|\t\
    heta) = \\mathcal{L}(q, \theta) + KL(q(z)|p(z|x))$\n\n+   - Lower bound $\\mathcal{L}(q,\
    \ \theta) = \\sum_{z} q(z) \\log p(x, z|\theta) - \\sum_{z} q(z) \\log q(z)\n\
    \  - Contains $\\log p(x, z|\theta)$ instead of $\\log p(x|\theta) = \\log \\\
    sum_{z} p(x, z|\theta)$\n  - ... which is much easier to optimize (convex for\
    \ most distributions)\n  - Each $\\log p(x, z|\theta)$ is weighted by $q(z)$\n\
    \n+   - Why is it a lower bound?\n  - Since $KL(q||p) \\geq 0$ it follows that\
    \ $\\mathcal{L}(q, \theta) \\leq \\log p(x|\theta)$"
  merge: -1
  img_proc: true
- pgno: 629
  md: '# Expectation-Maximization Steps


    EM iteratively applies 2 steps:


    +   - (E)xpection-step: $q(z) = \arg\min_q KL(q(z)|p(z|x))$

    - Find $q(z)$ that minimizes KL

    - Can be done in closed form for discrete $z$ (e.g. mixtures):

    q(z) = p(z|x,\theta_{old}) = \frac{p(x,z|\theta_{old})}{\sum_z p(x,z|\theta_{old})}$


    +   - Observations:

    - The marginal log-likelihood $log p(x|theta)$ is unaffected by the E-step

    - As KL is minimized, lower bound has to go up

    - After the E-step $KL(q(z)|p(z|x)) = 0$ and therefore, the lower bound is tight,
    i.e.:

    $log p(x|\theta) = \mathcal{L}(q,\theta)$


    ![](img/f01928df50903c99ce023dd3c527a33d_629_0.png)'
  merge: -1
  img_proc: true
- pgno: 630
  md: "# Expectation-Maximization Steps\n\nEM iteratively applies 2 steps:\n\n$\\\
    mathcal{L}(q, \\boldsymbol{\theta}) = \\sum_{z} q(z) \\log p(\\boldsymbol{x},\
    \ z|\\boldsymbol{\theta}) - \\sum_{z} q(z) \\log q(z)$\n\n+   * (M)maximization-step:\n\
    \  * $\\boldsymbol{\theta} = \\arg \\max \\mathcal{L}(q, \\boldsymbol{\theta})\
    \ = \\arg \\max \\sum_{z} q(z) \\log p(\\boldsymbol{x}, z|\\boldsymbol{\theta})\
    \ + \\text{const}$\n  * Maximize lower bound with respect to $\\boldsymbol{\t\
    heta}$\n  * This is the **weighted maximum likelihood** objective\n    * Each\
    \ possible value of the missing data is weighted by $q(z) = p(z|\\boldsymbol{x},\
    \ \\boldsymbol{\theta}_{\\text{old}})$\n\n![](img/f01928df50903c99ce023dd3c527a33d_630_0.png)"
  merge: -1
  img_proc: true
- pgno: 631
  md: '# # EM Convergence Properties


    # E-Step


    +   - EM improves the lower bound


    $\mathcal{L}(q_{new}, \theta_{new}) \geq \mathcal{L}(q_{old}, \theta_{old})$


    +   - M-step: Lower bound increases

    - E-step: KL is set to 0, lower bound has to go up


    ![](img/f01928df50903c99ce023dd3c527a33d_631_0.png)


    +   - EM improves the marginal likelihood


    $\log p(x|\theta_{new}) \geq \log p(x|\theta_{old})$


    +   - M-step: Lower bound increases and KL increases (can''t get smaller than
    0)

    - E-step: Marginal likelihood is unaffected (does not depend on q)


    # M-Step


    ![](img/f01928df50903c99ce023dd3c527a33d_631_1.png)'
  merge: -1
  img_proc: true
- pgno: 632
  md: "# Illustration of EM\n\n+   - Lower bound (blue curve) is a convex approximation\
    \ of the marginal likelihood (red curve)\n\n+   - Maximum of lower bound can be\
    \ easily obtained ($\theta^{\text{new}}$)\n\n+   - Closed form solutions available,\
    \ no gradient descent required\n\n+   - Compute new lower bound for $\theta^{\t\
    ext{new}}$ (green curve)\n\n+   - Due to the local approximation of the lowerbound,\
    \ EM can only find local optima\n\n![](img/f01928df50903c99ce023dd3c527a33d_632_0.png)"
  merge: -1
  img_proc: true
- pgno: 633
  md: '# EM for full dataset


    **For all data-points**, the lower bound is given by:


    $\mathcal{L}(q,\theta) = \sum_{i} \left(\int_{z} q_i(z) \log p(\boldsymbol{x}_i,z|\theta)dz
    - \int_{z} q_i(z) \log q_i(z)dz\right)$


    +   - One latent variable $z_i$ per data-point

    - If $z$ is discrete with $K$ different values, than


    $q_i(z=k) = p(z=k|\boldsymbol{x}_i, \theta_{old})$


    +   can be represented as a N x K matrix

    - We will write $q_{ik} = q_i(z=k)$'
  merge: -1
  img_proc: true
- pgno: 634
  md: "# EM for GMMs revisited\n\n+   - Mixture coefficient: $p(k) = \\pi_k$, with\
    \ $0 \\le \\pi_k \\le 1$, $\\sum_k \\pi_k = 1$\n\n+   - Mixture component: $p(\\\
    boldsymbol{x}|k) = \\mathcal{N}(\\boldsymbol{x}|\\boldsymbol{\\mu}_k, \\boldsymbol{\\\
    Sigma}_k)$\n\n+   - Mixture distribution: $p(\\boldsymbol{x}) = \\sum_{k=1}^K\
    \ \\pi_k \\mathcal{N}(\\boldsymbol{x}|\\boldsymbol{\\mu}_k, \\boldsymbol{\\Sigma}_k)$\n\
    \n+   - Always integrates to 1\n\n+   - Parameters of the mixture $\\boldsymbol{\t\
    heta} = \\{\\pi_1, \\boldsymbol{\\mu}_1, \\boldsymbol{\\Sigma}_1, \\dots, \\pi_K,\
    \ \\boldsymbol{\\mu}_K, \\boldsymbol{\\Sigma}_K\\}$\n\n# E-Step\n\n+   - Compute\
    \ \"responsibilities\"\n\n$q_{ik} = q_i(z=k) = \\frac{\\pi_k \\mathcal{N}(\\boldsymbol{x}_i|\\\
    boldsymbol{\\mu}_k, \\boldsymbol{\\Sigma}_k)}{\\sum_{j=1}^K \\pi_j \\mathcal{N}(\\\
    boldsymbol{x}_i|\\boldsymbol{\\mu}_j, \\boldsymbol{\\Sigma}_j)}$\n\n+   - How\
    \ much component k contributes to generation of $\\boldsymbol{x}_i$ according\
    \ to current mixture model"
  merge: -1
  img_proc: true
- pgno: 635
  md: "# EM for GMMs revisited\n\n**M-Step:** $\\theta = \\arg \\max_{\theta} \\sum_{i}\
    \ \\sum_{k} q_{ik} \\log p(k)p(x_i|k) = \\arg \\max_{\theta} \\sum_{k} \\sum_{i}\
    \ q_{ik} \\log p(k) + \\sum_{k} \\sum_{i} q_{ik}p(x_i|k)$\n\n+   - We can separate\
    \ updates of single components and coefficients\n  - just additive objectives\
    \ in lower bound\n\n+   **Update coefficients:**\n$\\\\pi = \\arg \\max_{\\pi}\
    \ \\sum_{i} \\sum_{k} q_{ik} \\log \\pi_k$\n\n+   **Update components:**\n$\\\
    mu_k, \\Sigma_k = \\arg \\max_{\\mu_k, \\Sigma_k} \\sum_{i} q_{ik} \\log \\mathcal{N}(x_i|\\\
    mu_k, \\Sigma_k)$$\n  - Each data-point is weighted by $q_{ik}$\n  - Weighted\
    \ maximum likelihood estimate"
  merge: -1
  img_proc: true
- pgno: 636
  md: "# EM for Gaussian Mixture Models\n\n**Weighted Maximum Likelihood** updates:\n\
    \n+   - Update coefficients: $\\pi = \\arg \\max_{\\pi} \\sum_{i} \\sum_{k} q_{ik}\
    \ \\log \\pi_k$\n- Result: $\\pi_k = \\frac{\\sum_{i} q_{ik}}{\\sum_{k} \\sum_{i}\
    \ q_{ik}} = \\frac{\\sum_{i} q_{ik}}{N}$\n\n+   - Update components: $\boldsymbol{\\\
    mu}_k, \boldsymbol{\\Sigma}_k = \\arg \\max_{\boldsymbol{\\mu}_k, \boldsymbol{\\\
    Sigma}_k} \\sum_{i} q_{ik} \\log \\mathcal{N}(\boldsymbol{x}_i | \boldsymbol{\\\
    mu}_k, \boldsymbol{\\Sigma}_k)$\n- Mean: $\boldsymbol{\\mu}_k = \\frac{\\sum_{i}\
    \ q_{ik} \boldsymbol{x}_i}{\\sum_{i} q_{ik}}$\n- Covariance: $\boldsymbol{\\Sigma}_k\
    \ = \\frac{\\sum_{i} q_{ik}(\boldsymbol{x}_i - \boldsymbol{\\mu}_k)(\boldsymbol{x}_i\
    \ - \boldsymbol{\\mu}_k)^T}{\\sum_{i} q_{ik}}$\n\n**Same equations as before,\
    \ but now we derived them!**"
  merge: -1
  img_proc: true
- pgno: 637
  md: '# Additional Notes for EM


    EM assumes that E-step can set the KL to zero:


    +   - I.e. we can evaluate the posterior analytically

    - Lower bound is tight

    - Marginal likelihood always improves (good to check for debugging!)

    - Only possible if z is discrete or we have linear Gaussian models!


    For more complex latent variable models (e.g. Deep Neural Networks), this is typically
    not possible:


    +   - Extension of EM called Variational Bayes / Variational Inference can still
    do that

    - Approximates the posterior, i.e. KL will be > 0 after E-step

    - Very active research, underlying algorithm of many deep learning architectures
    (e.g. variational autoencoder)

    - Will be covered in the end of the lecture'
  merge: -1
  img_proc: true
