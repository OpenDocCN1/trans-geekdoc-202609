    \n![](img/f01928df50903c99ce023dd3c527a33d_766_0.png)\n\n+   - The a posteriori\
    \ probability of the classes for any instance $x = X$ is\n$$P(y_i|X) = \frac{P(X,y_i)}{P(X,y_1)\
    \ + P(X,y_2)}$$"
