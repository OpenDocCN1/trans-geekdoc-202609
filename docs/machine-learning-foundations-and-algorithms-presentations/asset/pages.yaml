- pgno: 957
  md: "# Recall: Gaussian Processes\n\n+   - Distribution over functions\n- Tractable\
    \ Bayesian modeling of functions even with infinite feature spaces\n- Input space\
    \ (the search space) $\\mathcal{X}$\n- Kernel function $k: \\mathcal{X} \times\
    \ \\mathcal{X} \to \\mathbb{R}$\n\nEvery finite set of N points $\\{x_1, \\dots,\
    \ x_N\\}$ induces a N -dimensional Gaussian distribution, which is the posterior\
    \ distribution on $\\{f(x_1), \\dots, f(x_N)\\}$\n\n![](img/f01928df50903c99ce023dd3c527a33d_957_0.png)"
  merge: -1
  img_proc: true
- pgno: 958
  md: "# # Gaussian Processes\n\nA Gaussian Process (GP) $f(\\boldsymbol{x}) \\sim\
    \ \\mathcal{GP}(m(\\boldsymbol{x}), k(\\boldsymbol{x}, \\boldsymbol{x}'))$ is\
    \ a mean function covariance function\n\nis a probability distribution over functions\
    \ $f(\\boldsymbol{x})$, such that any finite set of function values $t_i = f(\\\
    boldsymbol{x}_i)$ evaluated at inputs $\boldsymbol{x}_1, \\dots, \\boldsymbol{x}_n$\
    \ is jointly Gaussian distributed\n\n+   - Mean function evaluates our prior belief\
    \ about the function\n  $\\mathbb{E}[f(\\boldsymbol{x})] = m(\\boldsymbol{x})$$\n\
    \  - For simplicity, we will use $m(\\boldsymbol{x}) = 0$\n\n+   - Covariance\
    \ function evaluates how similar/correlated two function evaluations at inputs\
    \ $\boldsymbol{x}, \\boldsymbol{x}'$ are\n  $\\mathbb{E}[f(\\boldsymbol{x})f(\\\
    boldsymbol{x}')] = k(\\boldsymbol{x}, \\boldsymbol{x}')$$\n  - Covariance function\
    \ needs to be a positive definite function (similar to a kernel function)"
  merge: -1
  img_proc: true
- pgno: 959
  md: "# Example: Gaussian Kernel\n\nThe Gaussian kernel is defined by:\n\n```\n$k(\\\
    boldsymbol{x}, \\boldsymbol{y}) = \\exp\\left(-\\frac{\\|\boldsymbol{x} - \\boldsymbol{y}\\\
    |^2}{2\\sigma^2}\\right)$\n```\n\n+   - where $\\sigma$ is the bandwidth parameter\n\
    \n![](img/f01928df50903c99ce023dd3c527a33d_959_0.png)\n\nOften also called:\n\n\
    +   - Radial basis function kernel (RBF)\n- Squared exponential kernel\n\nIt is\
    \ the **most used kernel** for kernel methods"
  merge: -1
  img_proc: true
