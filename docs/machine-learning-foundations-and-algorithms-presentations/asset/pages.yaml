- pgno: 895
  md: "# Variational Inference\n\nWe want to approximate an intractable target distribution\n\
    \n$p^*(\boldsymbol{x}) = \\frac{\tilde{p}^*(\\boldsymbol{x})}{Z}, \\quad \\text{with\
    \ } Z = \\int \\tilde{p}^*(\\boldsymbol{x})d\\boldsymbol{x}\n\nwith a tractable\
    \ distribution $q(\\boldsymbol{x})$ (e.g. a Gaussian)\n\n# What does intractable\
    \ mean?\n\n+   - We can not evaluate the normalization constant Z\n- Its hard\
    \ to sample from $p^*(\boldsymbol{x})$\n  - Can be done using Monte-Carlo Markov\
    \ Chain (MCMC) sampling, but very inefficient\n- As well as do inference (evaluate\
    \ expectations, find $\\boldsymbol{x}$ with maximum density, ...)\n\n![](img/f01928df50903c99ce023dd3c527a33d_895_0.png)\n\
    \n# When is this useful?\n\n+   - Approximating posterior distributions, latent\
    \ variable models (Variational Bayes...), Reinforcement Learning, ..."
  merge: -1
  img_proc: true
- pgno: 896
  md: "# # How can we do that?\n\nWe can minimize a divergence measure between both\
    \ distributions\n\n$q^* = \\text{argmin}_q \\ D(q, p^*)$\n\nCommonly used divergence:\n\
    \n+   * **Reverse KL-divergence:** $KL(q(x)|\\p^*(x)) = \\int_{\\boldsymbol{x}}\
    \ q(x) \\log \\frac{q(\\boldsymbol{x})}{p^*(\boldsymbol{x})} dx$\n  * **Zero forcing:**\
    \ If $p^*\boldsymbol{x})$ is small, $q(\\boldsymbol{x})$ needs to be small\n\n\
    +   * **Comparison: Forward KL** $KL(p^*(\boldsymbol{x})|\\q(x)) = \\int_{\\boldsymbol{x}}\
    \ p^*(\boldsymbol{x}) \\log \\frac{p^*(\boldsymbol{x})}{q(x)} dx$\n  * **Probability\
    \ forcing:** If $p^*(\boldsymbol{x})$ is high, $q(\\boldsymbol{x})$ needs to be\
    \ high"
  merge: -1
  img_proc: true
- pgno: 897
  md: "# # Comparison of the projections for VI\n\n# Information Projection\n\n# Moment\
    \ Projection\n\n![](img/f01928df50903c99ce023dd3c527a33d_897_0.png)\n\n![](img/f01928df50903c99ce023dd3c527a33d_897_1.png)\n\
    \n$KL(q(\boldsymbol{x})||p^*(\boldsymbol{x})) = \\int_{\boldsymbol{x}} q(\boldsymbol{x})\
    \ \\log \\frac{q(\boldsymbol{x})}{p^*(\boldsymbol{x})} d\boldsymbol{x}$\n\n$KL(p^*(\b\
    oldsymbol{x})||q(\boldsymbol{x})) = \\int_{\boldsymbol{x}} p^*(\boldsymbol{x})\
    \ \\log \\frac{p^*(\boldsymbol{x})}{q(\boldsymbol{x})} d\boldsymbol{x}$\n\n+ \
    \  - No need to know normalizer of $p^*$\n\n+   - Mode-seeking\n\n+   - Good generative\
    \ model (all samples are representative)\n\n+   - Hard to optimize even for simple\
    \ $q$\n\n+   - Might miss areas with high probability mass\n\n+   - Easy to optimize\n\
    \n+   - Covers all areas with high probability\n\n+   - Needs samples from $p^*$\n\
    \n+   - Generative model might be arbitrary poor\n\n+   - $q$ might have high\
    \ density where $p^*(\boldsymbol{x})$ is low"
  merge: -1
  img_proc: true
- pgno: 898
  md: "# # Optimization of the I-Projection\n\narg \\min_{q} KL(q(x)||p^*(x)) = \\\
    int_{x} q(x) \\log \\frac{q(x)}{p^*(x)} d\boldsymbol{x}$\n\n# ## Gaussian variational\
    \ approximations:\n\n+   - Most common approximation\n\n### Mean-field approximation\n\
    $q_{\\mu,\\sigma}(\boldsymbol{x}) = \\mathcal{N}(\boldsymbol{\\mu}, \text{diag}(\b\
    oldsymbol{\\sigma}^2))$\n\n### Full covariance approximation\n$q_{\\mu,\boldsymbol{\\\
    Sigma}}(\boldsymbol{x}) = \\mathcal{N}(\boldsymbol{\\mu}, \boldsymbol{\\Sigma})$\n\
    \n### GMM approximation\n$q_{\theta}(\boldsymbol{x}) = \\sum_{o} p(o)\\mathcal{N}(\b\
    oldsymbol{\\mu}_{o}, \boldsymbol{\\Sigma}_{o})$\n\n# ## Algorithms :\n\n+   -\
    \ Bayes-By-Backprop Reparameterization trick\n  - Only works for mean-field approximation,\n\
    \  - very slow for full covariance case\n\n+   - Natural Gradients with trust\
    \ regions (RL Lecture)\n  - Works well for full covariance case\n  - Has been\
    \ extended to GMM case [Arenz 2020]"
  merge: -1
  img_proc: true
- pgno: 899
  md: "# # Variational Inference for Bayesian Learning\n\nMinimize KL to posterior\
    \ distribution:\n\n$KL(q(\\theta)||p(\\theta|\\mathcal{D})) = \\int_{\theta} q(\\\
    theta) \\log \\frac{q(\\theta)}{p(\\theta|\\mathcal{D})} d\\theta$\\n= \\int_{\t\
    heta} q(\\theta) \\log \\frac{q(\\theta)}{p(\\mathcal{D}|\\theta)p(\\theta)} d\\\
    mathbf{x} + Z$\\n= - \\int_{\theta} q(\\theta) \\log p(\\mathcal{D}|\\theta) d\\\
    theta + KL(q(\\theta)||p(\\theta)))$\n\nRewrite into a maximization problem:\n\
    \n$\\argmin_q KL(q(\\theta)||p(\\theta|\\mathcal{D})) = \\argmax_q q(\\theta)\
    \ \\log p(\\mathcal{D}|\\theta) d\\theta - KL(q(\\theta)||p(\\theta))$\n\n+  \
    \ - We need to find distribution q with samples that have high likelihood...\n\
    - ... and q should be close to prior\n- The evidence $p(\\mathcal{D})$ is not\
    \ needed!"
  merge: -1
  img_proc: true
- pgno: 900
  md: "# # Recap: Variational Inference for VAEs\n\nVAEs **optimize the lower bound**\
    \ instead of the log-likelihood\n\n$\\mathcal{L}(q, p) = \\int q(z) \\log \\left(p(\\\
    boldsymbol{x}|z) \\frac{p(z)}{q(z)}\right) dz = \\int q(z) \\log p(\\boldsymbol{x}|z)dz\
    \ - KL(q(z)||p(z))$\n\n+   - Why is it a lower bound? Since $KL(q||p) \\geq 0$\
    \ it follows that $\\mathcal{L}(q, p) \\leq \\log p(\\boldsymbol{x})$\n- Its also\
    \ called **Evidence lower bound (ELBO)**, as the marginal likelihood is often\
    \ called evidence\n\n**Joint optimization of the lower bound** $\\mathcal{L}(q,\
    \ p)$ w.r.t $p$ and $q$ using stochastic gradient descent\n\n$q^*, p^* = \\arg\
    \ \\max_{q,p} \\mathcal{L}(q, p)$\n\nIn practice, $q_\\varphi(z), p_\\varphi(\\\
    boldsymbol{x}|z)$ and $p_\\varphi(z)$ will be parametrized distributions and we\
    \ optimize over $\\phi$ and $\\varphi$"
  merge: -1
  img_proc: true
- pgno: 901
  md: "# # Recap: Variational Inference for VAEs\n\n**What does q learn?**\n\n```\n\
    $$$KL(q(z)||p(z|\\underline{x})) = \\int q(z) \\log \\frac{q(z)}{p(z|\\underline{x})}dz\
    \ = \\int q(z) \\log \\frac{p(\\underline{x})q(z)}{p(\\underline{x}|z)p(z)}dz\
    \ = \\int q(z) \\log \\frac{q(z)}{p(\\underline{x}|z)p(z)}dz + const$\n= -\\mathcal{L}(q,p)\
    \ + const$$$$\n```\n\n```\n$$\\Rightarrow \\argmin_q KL(q(z)||p(z|\\underline{x}))\
    \ = \\argmax_q \\mathcal{L}(q,p)$$\n```\n\n+   - By maximizing the variational\
    \ lower bound $\\mathcal{L}(q,p)$ w.r.t $q(z)$, the variational distribution will\
    \ approximate the posterior, i.e., $q(z) \\approx p(z|\\underline{x})$\n\n+  \
    \ - I.e. for obtaining q, we minimize the l-projection (see lecture 10) to the\
    \ posterior\n  - This minimization is also called Variational Inference\n  - Target\
    \ is moving as our posterior changes with the decoder $p(\\underline{x}|z)$"
  merge: -1
  img_proc: true
