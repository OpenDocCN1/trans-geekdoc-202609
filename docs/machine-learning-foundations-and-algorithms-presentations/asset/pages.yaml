- pgno: 847
  md: "# Bayesian Linear Regression: Computing the Posterior\n\n+   - Likelihood (conditional):\
    \ $p(y|\\mathbf{X}, \\mathbf{w}) = \\mathcal{N}(\\mathbf{y}|\boldsymbol{\\Phi}\\\
    mathbf{w}, \\sigma^2\\mathbf{I})$\n\n+   - Prior (marginal): $p(\\mathbf{w}) =\
    \ \\mathcal{N}(\\mathbf{w}|\\mathbf{0}, \\lambda^{-1}\\mathbf{I})$\n\n+   - Dimensions:\
    \ $\\mathbf{w} \\in \\mathbb{R}^d$ and $y \\in \\mathbb{R}^{N\times 1}$, typically\
    \ $d \\ll N$\n\nAs the dimensionality of the marginal variable (parameter vector)\
    \ is smaller than dimensionality of cond. variable (number of datapoints), we\
    \ have to use Gaussian Bayes rule 2!\n\n```\n$$\\mu_{\\mathbf{w}|\\mathbf{X},\\\
    mathbf{y}} = \\mu_{\\mathbf{w}} + (\\sigma_{\\mathbf{w}}^2\\boldsymbol{\\Sigma}_{\\\
    mathbf{w}}^{-1} + \\mathbf{F}^T\\mathbf{F})^{-1}\\mathbf{F}^T (\\mathbf{y} - \\\
    boldsymbol{\\mu}_{\\mathbf{w}})$\nn$\\boldsymbol{\\Sigma}_{\\mathbf{w}|\\mathbf{X},\\\
    mathbf{y}} = \\sigma_{\\mathbf{w}}^2(\\sigma_{\\mathbf{w}}^2\\boldsymbol{\\Sigma}_{\\\
    mathbf{w}}^{-1} + \\mathbf{F}^T\\mathbf{F})^{-1}$\n```\n\nwith $\boldsymbol{\\\
    mu}_{\\mathbf{w}} = \\mathbf{0}, \boldsymbol{\\Sigma}_{\\mathbf{w}} = \\lambda^{-1}\\\
    mathbf{I}, \\mathbf{F} = \boldsymbol{\\Phi}$ and $\\sigma_{\\mathbf{y}}^2 = \\\
    sigma_{\\mathbf{y}}^2$"
