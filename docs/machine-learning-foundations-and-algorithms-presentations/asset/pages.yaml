    partial x_1} & \\dots & \\frac{\\partial f_k(x)}{\\partial x_1} \\ & \\vdots &\
    \ \\ \\frac{\\partial f_1(x)}{\\partial x_d} & \\dots & \\frac{\\partial f_k(x)}{\\\
    partial x_d} \\end{bmatrix}$\n\n+   - Example: Linear form $\\nabla_x Ax = A^T$"
