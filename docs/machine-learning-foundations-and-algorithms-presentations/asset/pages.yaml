    \n![](img/f01928df50903c99ce023dd3c527a33d_860_1.png)\n\n```\n$k(\\mathbf{x}_i,\
    \ \\mathbf{x}_j) = \\exp\\left(-\frac{1}{2\\sigma^2} ||\\mathbf{x}_i - \\mathbf{x}_j||^2\\\
    right)$\n```\n\n# ## Gaussian Kernel\n\n# ## Ornstein-Uhlenbeck Process (Brownian\
    \ Motion)\n\n```\n$k(\\mathbf{x}_i, \\mathbf{x}_j) = \\exp(-\theta ||\\mathbf{x}_i\
    \ - \\mathbf{x}_j||)$\n```"
