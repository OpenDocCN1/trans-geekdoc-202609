- pgno: 158
  md: '# Optimization


    For most ML algorithms, we want to find the best model to fit the data.

    Two examples we already know:


    +   Least squares solution:

    $\argmin_w SSE(w, D) + \lambda \text{penalty}(w)$


    +   Maximum likelihood solution:

    $\argmax_w loglik(w, D) - \lambda \text{penalty}(w)$


    > Note that:

    $\argmin_x f(x) = \argmax_x f(x)$

    Hence, the role of the penalty is the same


    ... plus regularization penalty'
  merge: -1
  img_proc: true
- pgno: 159
  md: "# Optimization\n\nGeneral form of optimization for ML: loss + penalty\n\n$$\\\
    arg min_{\text{parameters } \\theta} \\sum_{i=1}^{N} l(\\boldsymbol{x}_i, \\theta)\
    \ + \\lambda \\text{penalty}(\\theta)$\n\n+   - Summed sample-loss plus regularization\
    \ penalty\n\nHow to do that? **Optimization**"
  merge: -1
  img_proc: true
