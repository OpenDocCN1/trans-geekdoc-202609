  md: "# # Example: Computing the predictive distribution\n\nThe predictive distribution\
    \ is given by:\n\n```\n$$p(x^*|\\mathbf{X}) = \\int p(x^*|\\mu) p(\\mu|\\mathbf{X})\
    \ d\\mu$\n$\\\text{marginal likelihood} \\quad \\text{likelihood} \\quad \\text{posterior}$\n\
    ```\n\n```\n$= \\mathcal{N}(x^*|\\mu, \\sigma)\\mathcal{N}(\\mu|\\mu_N, \\sigma_N)d\\\
    mu \\quad ... \\text{ Gaussian propagation (proof not shown)}$\n```\n\n```\n$=\
    \ \\mathcal{N}(x^*|\\mu_{x^*}, \\sigma_{x^*}^2)$\n```\n\nThe predictive distribution\
    \ is Gaussian with:\n\n+   - Mean: $\\mu_{x^*} = \\mu_N$\n- Variance: $\\sigma_{x^*}^2\
    \ = \\sigma_N^2 + \\sigma^2$\n\n**Observations:**\n\n+   - The predictive mean\
    \ is the same as the posterior mean\n- However, the predictive variance also considers\
    \ the uncertainty of the mean"
  merge: -1
