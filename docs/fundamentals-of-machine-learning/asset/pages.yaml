  md: 'Another way of looking into this is to consider the neurons themselves as stochastic
    so that the neural network forms a Bayesian network itself. For example, we could
    change the gain function of the artificial neuron to a stochastic rule, like


    ```

    $p(y=1|x,w) = \frac{1}{1+e^{-xw}} \quad (7.81)

    ```


    While this looks equivalent to Eq 7.66, the difference now is that the output
    of the neuron is $y=1$ only with a certain probability and $y=0$ with the complementary
    probability. Hence, this neuron is a binary neuron with only binary states, on
    and off.

    This seems better to remember the spiking nature of real neurons.


    Networks of probabilistic neurons have been studied earlier, in particular within
    bi-directional recurrent neural networks that we will review in Chapter 9. If
    the neurons are stochastic nodes in a network, then we can view this network as
    an undirected Bayesian network where the weights represent some form of conditional
    probability to influence the firing of the receiving neuron. We will get back
    to this point in Chapter 9.


    There is strong evidence that real neurons are stochastic in nature, and there
    is also a lot of evidence of the stochastic nature of synapses. While it is sometimes
    argued that noise in synaptic processes should be expected as this is a biological
    system, Enoki and Fine showed that the probabilities of neurotransmitter releases
    can be modulated with classical synaptic plasticity experiments. This area is
    largely unexplored.'
