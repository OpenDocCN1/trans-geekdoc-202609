  md: "# 212 | Reinforcement learning\n\n$\rho(s,a) + \\gamma \\left[ \rho(\tau(s,a),\
    \ \\pi(\tau(s,a))) + \\gamma \\sum_{t=2}^{\\infty} \\gamma^{t-2}\rho(s_t, \\pi(s_t))\
    \ \right]$\n\nThe term in the square bracket is equal to the value of the state\
    \ that is reached after the transition $\tau(s, a)$\n\n$Q^*(\tau(s,a), \\pi(\t\
    au(s,a))) = V^\\pi(\tau(s,a))$. (10.8)\n\nThe Q-function and the V-function are\
    \ here equivalent since we are following the policy in these steps. Using this\
    \ fact in the equation above, we get\n\n**Bellman equation**: $Q^*(s,a) = \rho(s,a)\
    \ + \\gamma Q^*(\tau(s,a), \\pi(s,a)))$. (10.9)\n\nIf we combine this with known\
    \ dynamics in the continuous domain, then this becomes the Hamilton-Jacobi-Bellman\
    \ equation, which often encountered in engineering problems.\n\nAs stated, we\
    \ realize that the reward function $\rho(s,a)$ and the transition $\tau(s,a)$\
    \ are known. At this point the agent follows a specific policy $\\pi(s)$. Let\
    \ us assume that we have $n_s$ states and $n_a$ actions in each state. We have\
    \ $n_s \times n_a$ unknown quantities $Q^*(s,a)$ which are governed by the Bellman\
    \ equation. More precisely, the Bellman Eq 10.9 is $n_s \times n_a$ coupled linear\
    \ equations with the unknown $Q^*(s,a)$. It is convenient to convert this to matrix\
    \ system with vectors\n\n$Q^* = R + \\gamma \\mathbf{T}^\\pi Q^*$. (10.10)\n\n\
    Where $\\mathbf{T}^\\pi$ is an appropriate transition matrix which depends on\
    \ the policy. Which can also be written as\n\n$R = (\\mathbf{I} - \\gamma \\mathbf{T}^\\\
    pi)^{-1}R^*$; (10.11)\n\nwhere $\\mathbf{I}$ is the identity matrix. This equation\
    \ has the solution\n\n$Q^* = (\\mathbf{I} - \\gamma \\mathbf{T}^\\pi)^{-1}R$.\
    \ (10.12)\n\nif the inverse exists. In other words, as the agent knows the reward\
    \ function and the transition function, it can calculate the value function for\
    \ a specific policy without taking a single step. This is an example of a deliberative\
    \ system where the agent can use the models of reward and the environment to calculate\
    \ optimal decisions, hence the designation as model-based RL.\n\nTo demonstrate\
    \ how to solve the Bellman equation with linear algebra tools, we need to define\
    \ the corresponding vectors and matrices used in Eq 10.12. We then order quantities\
    \ as $\rho$ and $Q$ with 10 indices. The first corresponds to $(s=0, u=-1)$, the\
    \ second to $(s=0, u=1)$, the third to $(s=1, u=-1)$, etc. The reward vector can\
