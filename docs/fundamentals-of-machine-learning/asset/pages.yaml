    As stressed at the beginning of this chapter, our main aim here was to show that
    applying machine learning methods is made fairly easy with application packages
    like sklearn, one still needs to know how to use techniques like hyperparameter
    tuning and balancing data to make effective use of them. In the next two sections
    we want to explain some of the ideas behind the specific models implemented by
    the random forest classifier (RPF) and the support vector machine (SVM). This
    is followed in the next chapter by descriptions of neural networks. The next two
    section are optional in the sense that following the theory behind really require
    knowledge of additional mathematical concepts that are beyond our introductory
    treatment in this book. Instead, the main focus here is to give a glimpse of the
    deep thoughts behind algorithms and to encourage the interested reader to engage
    with further studies. The asterisk in section headings indicates that those sections
    are not necessary reading to follow the rest of this book.


    We have already used a random forest classifier (RFC), and this method is a popular
    choice where deep learning has not yet made an impact. It is worthy to outline
    the concepts behind it itself since it is an example of a non-parametric machine
    learning method. The reason is that the structure of the model is defined by the
    training data and not conjured at the beginning by the investigator. This fact
    alone helps the use of this method and explain some of its popularity, although
    there are additional factors that make it competitive such as the ability to build
    in feature selection. We will briefly outline what is behind this method. A random
    forest is actually an ensemble method of decision trees, so we will start by explaining
    what a decision tree is.


    ![](img/2087e3fd78fc2bbc9ee0bfaab66e3bde_58_0.png)


