- pgno: 16
  md: '# 8 | Introduction


    This general approach of using probabilistic models and data to estimate model
    parameters, and in turn make predictions, is the essence of Bayesian modeling.
    We will introduce this more general learning paradigm. However, many of the current
    machine learning algorithms use a learning principle where only uses the most
    likely parameters given the data,


    ```

    $w^* = \arg\max_w p(w|y, \mathbf{x}). \quad (1.8)$

    ```


    Such a maximum *a posteriori* choice, or some points derived from related principles
    such as the maximum likelihood estimate, are currently the dominant forms of machine
    learning. While limited in a Bayesian sense, these approximations have been very
    useful to build practical applications of machine learning. Of course, we still
    need to find the specific form of the probability function $p(w|y, \mathbf{x})$,
    which in itself is a subject of a hypothesis in the Bayesian framework. The point
    here is to suggest how a probabilistic formalism is in machine learning. We will
    discuss these matters later in this book.


    Formulating probabilistic models for problems with multivariate stochastic factors
    is demanding. An important and useful way to formulate probabilistic models is
    the area of **causal models**. Such models provide specific probabilistic models
    of the components that provide the necessary foundations of the inference engine.
    Inference here means that the system can to "argue" a solution in a probabilistic
    sense or to derive predictions. Such systems are the domain of Bayesian networks,
    and we will include an introduction to this important domain in this book as it
    provides an important aspect of machine learning. To some extent we will argue
    that probabilistic models and deep neural networks represent somewhat a diverse
    spectrum of machine learning models, but we will also argue that they can be viewed
    in a unified way. Fig. 1.3 shows a famous example Judea Pearl, one of the inventors
    of this important modeling framework.


    ![](img/2087e3fd78fc2bbc9ee0bfaab66e3bde_16_0.png)


    **Fig. 1.3** An example of a graphical representation of a causal model.


    In Bayesian networks we model entities that build the causal structure of the
    problem. It has a much stronger theoretical predictive strength and explanatory
    ability than other machine learning models. However, in practice we rarely know
    about the generative elements, and machine learning models that are more general
    as such neural networks represent an often more practical method. Nature might
    have combined such strategies in the brain, where sensory input is transformed
    into a semantic space in which some approximation of Bayesian reasoning can be'
