  md: "# Actors and actor-critics 227\n\nback propagation to train such networks in\
    \ such an RL task, which basically represents the NFQ approach. Mnih et al. have\
    \ made several important additions to achieve these results. In particular, an\
    \ important factor in the original DQN network was the use of experience replay.\
    \ Experience replay is now a common technique for the following reason. It is\
    \ common that the learning rate be fairly small during learning to prevent instances\
    \ from dominating. This means that specific episodes only have a very small contribution\
    \ and one would need a large amount of episodes. In replay, we memorize a certain\
    \ action and use min-batches of random samples for training.\n\nAnother common\
    \ problem regarding why we need small learning rates is that Q-values can fluctuate\
    \ a lot. A second important factor in the practical use of such networks is the\
    \ use of a target Q-network. In this technique, we freeze the parameters of the\
    \ Q-network for the estimation of the future reward. Let us consider these weights\
    \ $w'$. We calculate the temporal difference as\n\n```\n$E = (r + \\gamma max\
    \ Q(s', a', w'))^2$\n$\\frac{\\partial E}{\\partial w} = (r + \\gamma max Q(s',\
    \ a', w') - Q(s, a, w)) \\frac{\\partial Q}{\\partial w}$\n```\n\nThe weights\
    \ of this target network are updated only periodically.\n are a variety of other\
    \ techniques that can be used in conjunction with the basic models. For example,\
    \ clipping rewards or some of normalizing the network can help to prevent an extreme\
    \ buildup of Q-values. There are other techniques to keep the network stable while\
    \ small changes in rewards cause large fluctuations in policy. Another important\
    \ aspect of larger applications is to find a good starting position to generate\
    \ valuable results. That is, if one starts playing the games with random weights\
    \ it is unlikely to get a sensible learning can take place. Indeed, AlphaGo used\
    \ supervised learning on expert data to train the system initially, the RL procedures\
    \ could continue and advance the system to the point where it could outperform\
    \ human players. A combination of RL with supervised learning in form of imitation\
    \ learning is therefore a common techniques, in particular in robotics applications.\
    \ However, instead of looking further into these techniques, there are two major\
    \ techniques that are important and discussed\n\n# 10.5 Actors and actor-critics\n\
    \n# 10.5.1 Policy search\n\nSo far we have focused on finding a value function\
    \ and we derived from the greedy policy as the action that leads to the largest\
    \ return. The value function can be seen as a critic to adapt the policy. Another\
    \ approach, especially when using function approximators, is to consider a parameterized\
    \ policy directly and to search for good parameters of the policy. Such approach\
    \ is called an actor. We need to find parameters that maximize the payoff. We\
    \ illustrated this with a setting in 10.1.1C. It is now time to think about the\
