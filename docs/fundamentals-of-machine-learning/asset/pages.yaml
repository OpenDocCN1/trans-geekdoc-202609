    We have briefly outlined the basic convolutional network types, such as AlexNet
    and VGG16, and it is useful to mention at least two more well-known example architectures.
    The first one is ResNet. The important feature introduced by ResNet is to use
    skip connections where the output of some layers is fed into later stages of layers
    in additions to the output of the intermediate layers. An example is shown in
    Fig. 4.11A. The idea behind the improvement in this network is that deep networks
    are difficult to train. Part of this is the problem of vanishing gradients when
    the training signal gets smaller and propagating back the error through the layers
    to earlier layers. We will later discuss training in detail. At this point it
    is suffice to mention that shallow networks are easier to train but such networks
    usually do not have the representational capacity to describe more detailed features.
    Skip connections can help in the shallow network learn a basic recognition system
    while the deeper components can learn to represent the residuals, hence the name
    ResNet. There is a pre-trained ResNet with fifty layers available in Keras, and
