  md: '# 134 | Basic probability theory


    been termed the "curse of dimensionality" by Richard Bellman. We will later discuss
    that building appropriate models can address this curse.


    # 6.5.2 The chain rule


    If we know the joint distribution of some random variables we can make the most
    predictions of these variables. However, in practice, we often have to estimate
    these functions, and we can often only estimate conditional density functions.
    A very useful rule to know how a joint distribution can be decomposed into the
    product of a conditional and a marginal distribution,


    ```

    $p(x, y) = p(x|y)p(y) = p(y|x)p(x),

    ```


    which is an example of a chain rule. Note the different ways in which we can decompose
    the joint distribution. This is easily generalized to $n$ random variables by


    ```

    $p(x_1, x_2, ..., x_n) = p(x_n|x_1, ..., x_{n-1})p(x_1, ..., x_{n-1})$

    $= p(x_n|x_1, ..., x_{n-1}) * ... * p(x_2|x_1) * p(x_1)$

    $= \prod_{i=1}^n p(x_i|x_{i-1}, ..., x_1)$

    ```


    but note that there are different decompositions possible. We will learn more
    about this and useful graphical representations in the next chapter.

    Estimations of processes are greatly simplified when random variables are independent.
    A random variable $X$ is independent of $Y$ if


    ```

    $p(x|y) = p(x).

    ```


    Using the chain rule Eqn 6.34, we can write this as


    ```

    $p(x, y) = p(x)p(y);

    ```


    that is, the joint distribution of two independent random variables is the product
    of their marginal distributions. Similarly, we can also define conditional independence.
    For example, two random variables, $X$ and $Y$, are conditionally independent
    of random variable $Z$ if


    ```

    $p(x, y|z) = p(x|z)p(y|z).

    ```


    Note that total independence does not generally imply conditionally independence,
    and visa versa, although this might hold true for some examples.


    # 6.6 How to combine prior knowledge with new evidence


    # 6.6. Bayes rule


    One of the most common tasks we will encounter in the following is the integration
    of prior knowledge with new evidence. For example, we might have a robot that
    estimates its current position at certain values and then get new (noisy) sensory
    data that adds some suggestions for different positions. This is also a common
    task in fusion of data'
