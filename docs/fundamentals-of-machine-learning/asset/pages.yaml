- pgno: 7
  md: '# Preface


    Machine learning is exploding, both in research and industrial applications. Although
    much of the machine learning ideas have been around for many years, the latest
    breakthroughs are based on several advances. One is the availability of large
    datasets with labeled data. Another is the availability of fast specialized processors
    such as graphics processing units (GPUs). In addition, progress is fueled by a
    deeper understanding of building models and learning from data, as well as some
    new techniques that brought everything together.


    There are now a variety of wonderful books and online resources available on machine
    learning. So why another book? There are several reasons why I felt compelled
    to offer my contribution here. Many recent books focus on specific aspects of
    machine learning, in particular deep learning on the one and Bayesian methods
    on the other. In this book I try to develop a bridge or mutual understanding of
    what often seems to be viewed as two opposite ends of machine learning. I would
    like to argue that both approaches are important, have specific strengths in application
    areas, and that a combined view of machine learning and scientific modeling is
    useful. While this book places focus on general machine learning methods, I believe
    that the insight and rigor of probabilistic modeling aids to the general understanding,
    which in turns helps in applying machine learning techniques more efficiently.


    Another reason is I hope this book is appreciated that I like to keep explanations
    brief while still providing some ideas about the deep reasoning about the methods.
    It is important to keep this style of the book in mind as treatments and examples
    are deliberately minded by design. Also, most explanations are brief in contrast
    to more traditional teaching books. My hope is to motivate and guide the reader
    sufficiently to encounter further resources for advanced studies. I find this
    particularly important in an age where are wonderful resources available on the
    Internet. I do not claim to cover all details of machine learning, but my hope
    is to provide the fundamentals for a good understanding that can help to guide
    further studies.


    This book tries to strive a balance between the rigor of mathematical arguments
    and general outlining ideas. In this book, I use mathematical notation mainly
    as descriptors to keep presentations brief and to show the general form of some
    equations. For the most part, this book does not include rigorous mathematical
    proofs or derivations, but I hope to give enough details to see how results can
    be derived. I know some readers might tend to avoid mathematical notations, but
    I would like to encourage these individuals to see them as providing a short form
    of a story, by contrast, other readers might find my simplifications debatable
    in a mathematical context. However, I think mathematical tools are useful at the
    level intended here to communicate ideas.


    This book includes a brief overview of some older machine learning techniques
    such as support vector machines and decision trees. While these approaches might'
  merge: -1
