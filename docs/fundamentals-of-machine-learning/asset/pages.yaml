  md: '# Artificial intelligence, the brain, and our society


    Machine learning is now basically equated with artificial intelligence (AI), and
    AI is aving an increasing impact on our society. This brief final chapter outlines
    the relation between machine learning and AI, the brain, and our society. We want
    to clarify some possible misconceptions, and to highlight some legitimate concerns
    as well as opportunities and unavoidable shifts in our society.


    I hope that this book has given a sense of the amazing achievements in the machine
    learning community that will facilitate a new chapter in automation. Machine learning
    has already gained a considerable foothold in several industries, and it seems
    we have only scratched the surface. Current applications are based primarily on
    the ability to learn complex patterns in high-dimensional data. While this can
    help with many applications, such as computer vision and speech recognition, it
    runs the risk of compromising privacy or misinterpreting data in mining. In addition,
    automation on a large scale will have considerable influence on our economy and
    how wealth is created. It is therefore important to evaluate the impact of new
    technologies for our society.


    The popular notion of equating machine learning with AI is clearly based on the
    progress with applications that have been difficult to tackle with traditional
    computer systems in past and which seems to mimic more human abilities. A typical
    example is a computer vision system based on deep learning that can outperform
    humans, or machine assistants based on recurrent networks that respond to natural
    language. While it is good that these technologies have to a wider attention in
    our society, the labeling itself might include the risk of misinterpretation of
    what this technology can do or not.


    In this context, it is interesting and appropriate to study the relations of machine
    learning with human abilities. We can even start to compare machine learning methods
    directly with brain processing. We will start this brief exploration by outlining
    the relation of machine learning and the brain before discussing the relations
    of machine learning and AI in more general terms. We will then close with some
    thoughts on the impact of machine learning onto our society.


    # 11.1 Different levels of modeling and the brain


    What stands out from the studies of machine learning is a new way of approaching
    modeling. In the introductory chapter, we outlined that the meaning of modeling
    is to describe a system in a simplified way which allows us to make predictions
    and thus encapsulate in some sense the essence of our knowledge. In this sense,'
