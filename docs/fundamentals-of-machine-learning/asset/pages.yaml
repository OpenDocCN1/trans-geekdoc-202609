    # 6.4.1 Cumulative probability (density) function and the Gaussian error function


    We have mainly discussed probabilities of single values as specified by the probability
    (density) functions. However, in many cases we need to know the probabilities
    of having values within a certain range. The probability of a specific value of
    a continuous variable is actually infinitesimally small (nearly zero), and only
    the probability of a range is finite and has a useful meaning of probability.
    This integrated version of a probability density is the probability of having
    a value $x$ for the random variable $X$ in the case of $x_1 \leq x \leq x_2$ and
    is given


    ```

    $P(x_1 \leq X \leq x_2) = \int_{x_1}^{x_2} p(x)dx. \quad (6.19)$

