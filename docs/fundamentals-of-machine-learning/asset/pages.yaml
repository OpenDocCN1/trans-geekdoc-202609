    Summer of Code project by David Courneau and developed into an open source library
    which now provides a variety of well-established machine learning algorithms.
    These algorithms together with excellent documentation are available at http://scikit-learn.org.


    The goal of this chapter is to show how to apply machine learning algorithms in
    a general setting using some classic methods. In particular, we will show how
    to apply three important learning algorithms, a support vector classifier (SVC),
    a random forest classifier (RFC), and a multilayer perceptron (MLP). While many
    of the methods studied in this book go beyond these now classic methods, this
    does not mean that these methods are obsolete. The contrary; many applications
