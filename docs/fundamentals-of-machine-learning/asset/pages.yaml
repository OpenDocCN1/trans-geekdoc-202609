    The example of the maze in the previous section has shown that the expectation\
    \ of rewards backwards in each episode which requires multiple repetitions of\
    \ the episodes to evaluate the value function. The reason for this is that we\
    \ only give credit for making a step to a valuable state to the previous step\
    \ and hence only update the corresponding value function. A different approach\
    \ is to keep track of states which have been rewarded and assign the credit to\
