    # 8.4 Self-supervised generative models


    # 8.4.1 k-means clustering


    In the previous learning methods we had training examples with feature vectors
    x and labels y. We now discuss an example of unsupervised learning where no labels
    are given. Such data are widespread. For example, it is easy to take pictures
    with a digital camera and get huge numbers of pictures. What usually takes time
    is label the pictures, as in the ImageNet dataset, or even to segment particular
    objects in the picture. We can not use the unsupervised learning methods we have
    discussed so far.


    However, samples of unlabeled collections still have information embedded in them,
    and self-supervised learning has important applications. In particular, we can
    glean structure from the data which can help in representational learning and
    speed up supervised learning. Self-supervised or unsupervised does not mean that
    the learning is not guided; the learning follows specific principles that are
    used to guide the organization of the data itself.


    We start here by discussing a widespread use of methods for data clustering. In
    this problem domain, we are given unlabeled data described by a set of features
    and to put them into k clusters. In the first example of clustering, we categorize
    the data proximity to a mean value. Then we assume a model that specifies a mean
    value of the data and classifies the data based on the proximity to the mean value.
    Of course, we do not know this mean value for each class. The idea is to start
    with a guess for this mean value and label the data accurately. Then we use the
    label from this hypothesis to improve the model by calculating a new mean, and
    repeat these steps until convergence is reached.


    More formally, we consider a training set of data points $\{x^{(1)}, x^{(2)},
    ..., x^{(m)}\}$ and a hypothesis of clusters, k, for the k-means clustering algorithm.
    The algorithm starts by choosing random initial means for each of the k classes.
    The next two steps are iterated. Given the means, we can choose the label of each
    data points according to the class label of the closest mean, giving these calculated
    labels we now update the mean among these data. These steps are iterated until
    convergence. This algorithm is summarized in Table 8.4. An example of the initial
    state and two iterations of this algorithm is shown in Fig. 8.4. The figure was
    produced with the following program.'
