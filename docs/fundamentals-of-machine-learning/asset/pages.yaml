    # 7.2 Learning in probabilistic models: Maximum likelihood estimate


    We will now turn to the important principle that will guide our learning process.
    Learning means, of course, determining the parameters of the model from example
    data. Here we introduce the important maximum likelihood principle. This principle
    states that we choose the parameters in a probabilistic model in the following
    way:


    +   Given a hypothesis function $p(x|w)$, we will choose as parameters the values
    which make the training data $\{x\}$ most likely under the assumption of the model.


    The MLE principle is stated here again in its most general form for all random
    data. In our case, we start with a model of the form $p(y|x;w)$ which specifies
    a probabilistic regression model for given input data. This is why the input data
    appears on the right side of the horizontal bar. However, we will see shortly
    in MLE we replace all the data at some point with the training data so we end
    up with a function (the likelihood function) that is a function of the parameters.
    Hence, in this case it does not matter if we treat the input as given or as random
    variables.


    Let us illustrate this with the Gaussian example with the parameterized model
    (Eqn7.5). We are considering the 1-dimensional case with one feature value, $x$.
