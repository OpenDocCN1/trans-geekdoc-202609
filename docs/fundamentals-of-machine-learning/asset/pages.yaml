  md: '# How to combine prior knowledge with new evidence


    from different sensors. In general, we assume that we already have a model that
    built from previous data, and now we want to refine this model with new data.
    The general question we have to solve is how to weight the different evidence
    in light of the reliability of this information. Solving this problem is easy
    in a probabilistic framework and is one of the main reasons so that much progress
    has been made with the application of probabilistic machine learning.


    Prior knowledge should be combined with prior knowledge is an important question.
    Luckily, we already know how to do it in a probabilistic sense. Namely, if we
    divide the chain rule (Eq. 6.34) by $p(y)$, which is possible as long as $p(y)
    > 0$, we get the


    ```

    $$p(x|y) = \frac{p(y)p(x)}{p(y)}, \quad (6.41)$

    ```


    which is called Bayes rule after the inventor Thomas Bayes. This theorem is important
    because it tells us how to combine prior knowledge on a random variable $x$ to
    estimate, $p(x)$, with the likelihood $p(x|y)$ of data given $y$. The likelihood
    can often be measured in some way, for example by measuring sensors reading $y$
    when controlling the state $x$. The posterior distribution, $p(x|y)$, which is
    the new knowledge of the distribution with new data, can be calculated by multiplying
    the likelihood for the prior $x$ and normalizing this properly by the marginal
    distribution of having such data, $p(y)$, also called evidence. We will see that,
    in practice, knowing the marginal of the data is difficult, but we will also see
    that the non-normalized version is useful in some applications as classification,
    as discussed later.


    Bayes rule in the chain rule and the rule of total probability is basically all
    the rules we need to do probabilistic inference. Probabilistic inference is basically
    how we use these rules with the known or estimated density functions to derive
    probabilistic statements. For example, let us calculate how likely it is to rain
    if a meteorologist is predicting rain.


    ```

    $$p(X = r|Y = r) = ?. \quad (6.42)$

    ```


    The random variable $X$ stands for the ''actual condition,'' and $r$ mean rain,
    the random variable $Y$ stands for ''predicted condition.'' Let us know the following
    factors that we can measure easily. Let us assume that it rains in 30 cent of
    the days,


    ```

    $$p(X = r) = 0.3, \quad (6.43)$

    ```


    which we just calculated from past data by taking the ratio of days out it rained.
    Since there are only two choices, it follows that the probability of no rain,
    which we write as $\hat{f}$,


    ```

    $$p(X = \hat{f}) = 1 - p(X = r) = 0.7. \quad (6.44)$

    ```


    Furthermore, from past predictions we know the meteorologist predicts correctly
    that it is raining 90 per cent.


    ```

    $$p(Y = r|X = r) = 0.9. \quad (6.45)$

    ```


    This number is again derived from previous data. From this we might conclude that
    it should be raining with a 90 per cent probability, but we also need to take
    the prior'
