    # 3.3.3 Balancing data


    We have already mentioned balancing data, but it is worthwhile pausing again to
    look at this briefly. A common problem for many machine learning algorithms is
    a situation in which we have much data for one class than another. For example,
    say we have data from 100 people with a disease and data from 100,000 healthy
    controls. Ratios of positive and negative class are not uncommon in many applications.
    A trivial classifier that always predicts the majority class would then get 99.9
    percent correct. In mathematical terms, this is just the prior probability of
    finding the class, which sets the balance somewhat for better classifications.
    The problem is that many learning methods that are used by simple measures such
    as this accuracy will mostly find this solution. There have many methods proposed
    to prevent such trivial solutions of which we will only mention a few here.


    One of the simplest methods to counter imbalance is to use only the negative class
    in the training set. This systematic under-sampling of the majority class is a
    valid procedure as the sub-sampled data still represent sufficiently the important
    features of this class. However, it also means that we lose some information that
    is available to us and the machine. In the example above we would only utilize
    100 of the healthy controls in the training data. Another way is to then emphas
    the minority class by repeating some examples. It seems to be a bad idea that
    repeating examples does not seem to add any information. It has been shown that
    this technique does not usually improve the performance of the classifier or prevent
    that it overfitting problem. The only reason that this something works is that
    it can at least make sure the learning algorithms is incremented the number of
    times for the majority and the minority class.


    Another method is to apply different weights or learning rates to learn examples
    with different sizes to the training set. One problem with this is to find the
    right scale of increase or decrease in the training weight, but this technique
    has been applied successfully in many case, including deep learning.


    In practice it has shown that combination of both strategies under-sampling the
    majority class and over-sampling the minority class can be most beneficial, in
    particular augmenting the over-sampling with some form of augmentation of the
    data. This is formalized in a method called SMOTE: synthetic minority over-sampling
    technique. The idea is therefore to change some characteristics of the over-sampled
    data such as adding noise. In this way there is at least a benefit of showing
    the learner variations that can guide the learning process. This is very similar
    to the bagging and data augmentation idea discussed earlier.'
