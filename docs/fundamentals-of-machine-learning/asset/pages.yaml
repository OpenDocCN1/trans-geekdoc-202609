    lots of training example, the rediscovery of convolutional networks, and better
    regularization techniques. The combination of deep learning with reinforcement
    learning has recently made major breakthroughs in AI. These breakthroughs have
    been demonstrated by playing Atari games and winning the chessboard game Go against
