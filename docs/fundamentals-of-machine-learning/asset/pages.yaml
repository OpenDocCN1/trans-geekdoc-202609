- pgno: 8
  md: '# viii | Preface


    be considered shallow or old-fashioned with respect to deep learning, they have
    still important practical applications as they provide solutions to applications
    that do not require the increased complexity of deep models. We will not dwell
    for very long into the theory of these traditional methods even though some of
    the stated formulas seem complex. I hope that mentioning some of these ideas,
    as kernel methods or Lagrange methods for optimizations with constraints, will
    add to the foundation of studying more theoretical aspects that are often assumed
    in modern research papers. This is particularly the case for support vector machines
    for which there is a rich theory.


    Since I have a personal interest in how the brain works, I did include some comments
    on the relation of machine learning and the brain. The brain is often quoted as
    inspiration for machine learning methods like neural networks. On the other hand,
    machine learning is also inspirational for neuroscience by giving some ideas of
    possible information processing principles that could be at work in the brain,
    or at highlighting differences.


    In the first chapter we will tour the main ideas of machine learning in order
    to see where this journey will take us. The next three chapters are designed to
    apply some machine learning methods. I decided to begin with applications before
    going through the rigorous background since since machine learning methods is
    not difficult with high-level programming to implement and use a variety of models.
    These chapters are intended to get you started to run some experiments on your
    own, and to gain some experience of what we want to achieve with machine learning.
    Chapter 2 is a brief outline of programming with Python of the kind we need in
    this book, and Chapters 3 and 4 show how to use sklearn and Keras to implement
    some of the methods.


    The second part of the book comprising the following four chapters is intended
    to take a deeper look into the foundations of machine learning and scientific
    modeling in general. This includes a formalization of regression and gradient
    descent optimization, and discussions of the probabilistic aspects in modeling.
    The final section of the book comprises the last three chapters which are dedicated
    to three important and hopefully advanced aspects of machine learning. The first
    is recurrent neural networks, which capture temporal aspects in modeling; the
    second is reinforcement learning, which captures learning of agents and is hence
    a much more general setting of learning machines; and the last chapter consists
    of some brief thoughts on the impact of machine learning on our society.'
