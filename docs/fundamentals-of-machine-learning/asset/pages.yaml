    from this function like gradient descent.


    Let us apply this to the Gaussian model of the robot example. The log-likelihood
    function of our hypothesis function for this example


    ```

    $l(w) = \log \prod_{i=1}^m \frac{1}{2\pi} \exp\left(-\frac{(y^{(i)} - w^T x^{(i)})^2}{2}\right)
    \quad (7.14)\n= \sum_{i=1}^m \log \frac{1}{\sqrt{2\pi}} - \frac{(y^{(i)} - w^T
    x^{(i)})^2}{2} \quad (7.15)$

    ```


    or


    ```

    $l(w) = -\frac{m}{2} \log 2\pi - \sum_{i=1}^m \frac{(y^{(i)} - w^T x^{(i)})^2}{2}
    \quad (7.16)$

    ```


    Here you can see why using a small number is as good as a sum instead having a
    large product of potentially small numbers. Since the first term in the expression
    Eq 7.16, $-\frac{m}{2} \log 2\pi$, is independent of $w$, maximizing the log-likelihood
    is equivalent to minimizing (because of the minus sign) a quadratic error term


    ```

    $E = \frac{1}{2}(y - h(x;w))^2 \iff p(y|x;w) = \frac{1}{\sqrt{2\pi}}\exp\left(-\frac{(y-h(x;w))^2}{2}\right).
    \quad (7.17)$

    ```


    This is the square-error loss function, or mean square (MSE) error if we consider
    a batch algorithm and divide the value by the number of examples in the batch.
    This loss function has given the choice for linear regression. It has also become
    in machine learning approaches such as multilayer perceptrons for a long time.
    In terms of probabilistic learning, the MSE is equivalent to MLE for Gaussian
    data with linear dependence of the mean and a constant variance.


    However, these assumptions may or not hold in different applications. The data
    might not be Gaussian, and even if they are, the variance might be different for
    different features. In this case we would need to minimize 7.16 with a sigma in
    the denominator. Also, the mean might vary in a non-linear way with the parameters.
    But, the point here is the following: a Gaussian model of noise is clearly a good
    choice due to the central limit theorem. However, it is possible that there are
    better choices for specific applications that can lead to superior predictions.


