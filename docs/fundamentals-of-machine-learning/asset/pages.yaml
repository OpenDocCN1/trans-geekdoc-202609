    \ have connections to the external world such as input and output nodes. The network\
    \ is a graphical representation of a non-linear function of the form\n\n```\n\
    $$y = g(w^o(w^h x))$$\n```\n\nIt is easy to include hidden layers in this formula.\
    \ For example, the activation rule for the output of a four-layer network with\
    \ three hidden layers and one output layer can be written\n\n```\n$$y = g(w^{h3}g(w^{h2}g(w^{h1}x)))$$$\n\
    ```\n\nwhere each layer uses the same activation function. Let us discuss a special\
    \ case of a multilayer network where all the nodes in hidden layers have linear\
    \ activation functions $g(x) = x$. Eq 5.58 simplifies to\n\n```\n$$y = w^o w^{h3}\
    \ w^{h2} w^{h1} x = \\mathbf{\\tilde{w}}x$$\n```\n\nIn the last step we have used\
    \ the fact that the multiplication of a series of matrices yields another, which\
