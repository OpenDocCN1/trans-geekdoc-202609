    # 3.3.2 Bagging and data augmentation


    Having enough training data is often struggle for machine learning practitioners.
    The problems of not having enough training data are endless. For one, one might
    reinforce the problem with overfitting or even using a model of sufficient complexity
    at the start. Support vector machines are fairly (shallow) models that have the
    advantage of needing less data than deep learning methods. Nevertheless, even
    for these methods we might only have a limited amount of data to train the model.


    A popular workaround is a method called bagging, which stands for "bootstrap aggregating.\
    The idea is to use the original dataset to create several more datasets by sampling
    from the original dataset with replacement. Sampling with replacement, which is
    also called bootstrapping, means that we could have several copies of the same
    training data in the dataset. The question then is what good they can do. The
    answer is if we are training several models on these different datasets we get
    averaged averages. This regularized model can help with overfitting or challenges
    of shallow minima in the learning algorithm. We will discuss this point further
    when discussing the learning algorithms in detail later.


    While being an interesting method with some practical benefits, the field of data
    augmentation now uses more general ideas. For example, we could just'
