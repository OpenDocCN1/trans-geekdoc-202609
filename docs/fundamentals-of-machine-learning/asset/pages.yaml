  md: '# 78 Neural networks and Keras


    # ### Listing 4.7 MNIST_CNN.ipynb (part 1)


    ```

    import keras

    import numpy as np

    import matplotlib.pyplot as plt

    from keras import models, layers, optimizers, datasets, utils


    (x_train, y_train), (x_test, y_test) = datasets.mnist.load_data()

    x_train = x_train.reshape(60000, 28, 28, 1)/255

    x_test = x_test.reshape(10000, 28, 28, 1)/255

    y_train = utils.to_categorical(y_train, 10)

    y_test = utils.to_categorical(y_test, 10)

    ```


    The model is defined by the following code.


    # ### Listing 4.8 MNIST_CNN.ipynb (part 2)


    ```

    inputs = layers.Input(size=(28, 28, 1))

    x = layers.Conv2D(64, (3, 3), activation=''relu'')(inputs)

    x = layers.MaxPooling2D(pool_size=(2, 2))(x)

    x = layers.Dropout(0.25)(x)

    x = layers.Flatten()(x)

    x = layers.Dense(128, activation=''relu'')(x)

    x = layers.Dropout(0.5)(x)

    outputs = layers.Dense(10, activation=''softmax'')(x)

    ```


    ```

    model = models.Model(inputs=inputs, outputs=outputs)

    ```


    The model starts with a convolutional layer that produces filters with thirty
    channels where each channel is the result of filtering with a specific filter.
    The size of the filter is specified with the kernel_size parameter. We used a
    rectified Linear (RELU) activation functions that for deep networks. We then add
    another convolution layer. Since the output size is defined by the previous we
    don''t have to include the input size. In this layer we expand the representation
    to sixty-four channels.


    The next layer is a new type of layer that is produced by a fixed kernel type
    defining an operation that is max pooling. Max pooling takes a collection of pixels,
    in this patch with a pooling size of (2, 2), and replaces this with one pixel
    of the maximum of this patch. This will shrink the image size, as in this case
    goes by half in each direction. Shrinking the image is important as we eventually
    want to get away from details of a higher-level (semantic) description of the
    input. Replacing each patch with only the max value of its pixels seems to be
    a drastic way of doing this, and some other proposals have been offered. For example,
    we could take the average of the pixels. Such an averaging pooling in practice
    is not much different from the max operation. To reduce the signal size we also
    shift the filter by more than one pixel time it is applied. The number of pixels
    for the filter is moved every time during a convolution operation is called a
    stride. More advanced techniques have been proposed, such as capsule networks,
    but these are beyond our discussion at this point.


    The next layer is a dropout layer. This is actually not really a layer but a post-processing
    of the kernel which turns off some of the nodes randomly. The probability of a
    neuron to be turned off is set to 25 per cent in our example. Dropout is a common
    technique to prevent overfitting. Overfitting in neural networks can happen'
