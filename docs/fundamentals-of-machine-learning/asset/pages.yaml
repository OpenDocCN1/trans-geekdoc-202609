  md: "# 2.3 Code efficiency and large collections of data\n\nMachine learning is\
    \ about working data. Such data are kept in data bases, spreadsheets, or simply\
    \ in text files, but to work with them we load them into arrays. Since we define\
    \ operations on such arrays, it is better to treat these arrays as vectors, matrices,\
    \ or generally as tensors. Traditional programming languages as C and Fortran\
    \ allow us to write code that loops over all the indices in order to specify operations\
    \ that are defined on all the data. For example, as provided in the program MatrixMultiplication.ipynb,\
    \ we define two n n matrices with the NumPy random number generator for uniformly\
    \ distributed numbers,\n\n```\nListing 2.26 MatrixMultiplication.ipynb (fragment)\n\
    anp=np.random.rand(n)\nbnp=np.random.rand(n)\n```\n\nand a matrix of zeros with\
    \ the same size,\n\n```\nListing 2.27 MatrixMultiplication.ipynb (fragment)\n\
    c=np.zeros((n,n))\n```\n\nWe can then write the code of adding two numbers with\
    \ an explicit loop over all indices as\n\n```\nListing 2.28 MatrixMultiplication.ipynb\
    \ (fragment)\nfor i in range(n):\n  for j in range(n):\n    c[i][j]=a[i][j]+b[i][j]\n\
    ```\n\nIn high-level programming languages like Python, Matlab, and R, it is common\
    \ to write such operations in a compact form\n\n```\nListing 2.29 MatrixMultiplication.ipynb\
    \ (fragment)\nc=a+b\n```\n\nIt is now common to call this style of programming\
    \ a vectorized code. Such a vectorized code is not much easier to read, but it\
    \ is also essential to write efficient code. The reason for this is that the system\
    \ programmers can implement routines very efficiently, and this is difficult to\
    \ match with the more general but inefficient index operation.\n\nTo demonstrate\
    \ the efficiency issue, let us measure the time of operations for a matrix multiplication.\
    \ We start by importing the standard NumPy and Mat1 libraries, and we import a\
    \ timer routine with\n\n```\nListing 2.30 MatrixMultiplication.ipynb (fragment)\n\
    import time\n```\n\nWe then define a method called matslow that implements a matrix\
    \ multiplication with an explicit iteration over the indices,"
