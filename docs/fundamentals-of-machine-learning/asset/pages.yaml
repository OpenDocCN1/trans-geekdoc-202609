  md: '# 7 Probabilistic regression and Bayes nets


    We discussed a linear model and linear regression in Chapter 5, and we will now
    revise this method to include a description of uncertainty in the data. This will
    show us how modern probabilistic machine learning can be formulated. We follow
    first a simple stochastic generalization of the linear regression example to introduce
    the formalism. This leads to that important maximum likelihood principle on which
    we base learning. We later generalize this to non-linear problems in higher dimensions
    and relate this to Bayes nets. After this, we will discuss how such a probabilistic
    approach is related to deep learning.


    # 7.1 Probabilistic models


    We again consider supervised learning where examples of input–output relations
    are given and our goal is to make a model that can make predictions of unseen
    data. The main difference is that we do not only want to make a prediction of
    a value, but we would also like to know how probable values are. Let us consider
    an example from robotics where we want to model how far a terrestrial robot is
    moving when the wheels are turning for a number of seconds after activating the
    corresponding motors with a certain power. Figure 7.1A shows a Lego Mindstorm
    robot that has two motors and an ultrasonic distance meter attached to it. We
    want to model (or predict) how far robot moves when motors are driven for a certain
    amount of time.


    The i-th data are denoted by the pairs $(x^{(i)}, y^{(i)})$, where the features
    $x^{(i)}$ is the time in seconds we let both motors run, and the outputs or labels
    $y$ is the distance that the robot traveled. The true distance has been provided
    by the teacher, most likely in the form of measurements such as using a ruler
    or a sensor that measures distance such as a laserfinder or an ultrasonic sensor.
    To automate the collection of data we use an ultrasonic sensor to measure the
    distance to a wall while driving the robot for different times forward and backward.
    The ultrasonic data are now the teacher feedback, and the teacher’s data are considered
