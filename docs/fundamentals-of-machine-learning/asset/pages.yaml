    Before leaving this area, it is useful to point out some general observations.
    Artificial neural networks have certainly been one of the first successful methods
    for nonlinear regression, implementing non-linear hypotheses of the form $h(x;
    w) = g(w^T x)$. The corresponding mean square loss function,


    > $$L \propto (y - g(w^T x))^2$$


    is then also a general function of the parameters. Minimizing such function is
    generally difficult. However, we could consider instead hypotheses that linear
    in the parameters, $h(x; w) = w^T \phi(x)$, but that the MSE loss is quadratic
    in the parameters,


    > $$L \propto (y - w^T \phi(x))^2$$


    The corresponding quadratic optimization problem can be solved much efficiently.
    This type of thinking has been further developed in support vector machines that
    we reviewed earlier. I point out here to stress that basic neural networks are
    not always optimal in the way they are commonly implemented and that variations
    are possible. Also, an interesting and further issue is how to choose the nonlinear
    function $\phi$. This brings us back to non-linear support vector machines and
    deep learning.


