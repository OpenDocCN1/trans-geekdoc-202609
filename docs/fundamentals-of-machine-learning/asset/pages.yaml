    is called backpropagation-through-time.


    So, by the end, what have we gained? We simplified the graph of a feed-forward
    network and replaced it with a recursive version, only to unfold in time again
    to train it. However, note we have to do the unrolling only during training (which
    is not optimal). We also have a form of weight sharing that makes sense similar
    to convolutional layers when we look for similar operations at different times
    in a sequence. Models with shared weights are somewhat easier to train than the
    ones with more independent weights and do not tend to overfit as easily. The exponential
    form of the memory limits the usefulness of such networks. The next section addresses
    this issue.


