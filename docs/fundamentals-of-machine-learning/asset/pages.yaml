    the probability function uniquely; this is only possible if we know all moments
    of a distribution, where the nth moment about the mean is defined as


    ```

    $m^n = \int_{-\infty}^{\infty} (x-\mu)^n f(x)dx. \quad (6.13)

    ```


    Higher moments specify further characteristics of distributions such as terms
    with third-order elements (related to the called skewness) and fourth-order (such
    as a quantity kurtosis). Knowing all moments of a distribution is equivalent to
    knowing the distribution precisely, and knowing a pdf is equivalent to knowing
    everything we could know about a random variable.

    in case the distribution function is not given, moments have to be estimated from
    data. For example, the mean can be estimated by sample of measurements by the
    sample mean,


    ```

    $\bar{x} = \frac{1}{n} \sum_{i=1}^{n} x_i, \quad (6.14)

    ```


    and the variance from the sample variance,


    ```

    $s_1^2 = \frac{1}{n} \sum_{i=1}^{n}(\bar{x}-x_i)^2. \quad (6.15)

    ```


    We discuss later how these estimates are the appropriate maximum likelihood estimates
    of these parameters. Note that the sample mean is unbiased while the sample variance
    of the naive estimate $E(X^2)$ is biased. A statistic is to be biased if the mean
    of the sampling distribution is not equal to the parameter that is intended to
    be estimated. Also, the estimation of the variance is not optimal for small samples.
    It is better to adjust the estimate with the so-called Bessel''s correction for
    the unbiased sample variance,


    ```

    $s_2^2 = \frac{1}{n-1} \sum_{i=1}^{n}(\bar{x}-x_i)^2. \quad (6.16)

    ```


    The difference is for large sample sizes.


    As mentioned earlier, knowing all moments does not specify a pdf. This also implies
    that an incomplete list of moments does not uniquely define a pdf. Just extracting
    a list of estimated moments is of limited use for generalization without an explicit
    hypothesis of the underlying density function. While this is specifically useful
    in case of an assumed Gaussian distributions, as all higher moments are 0 for
    this specific distribution, Then in practice it is assumed, often without explicit
    mention, that the data are Gaussian distributed when reporting mean and variance.
