    Our aim for the later part of this book is therefore to look much deeper into
    the principles behind machine learning including probabilistic and deep learning
    methods.


    # 3.1 Classification with support vector machines, random forests, and multilayer
    perceptrons


    We will show how to apply three different types of machine learning classifiers
    using sklearn implementations, of a support vector classifier (SVC), a random
    forest classifier (RFC), and a multilayer perceptron (MLP). We therefore concentrate
    on the mechanisms and what is discussed about these classifiers using the classical
    example of the iris flowers that we discussed in the previous chapter to how to
    read data into NumPy arrays. We will start with the SVC, which is support vector
    machine (SVM). The sklearn implementation is actually a wrapper for the SVMLIB
    library from Chih-Chung Chang and Chih-Jen Lin that has been very popular for
    classification applications. In this chapter we describe more of the math and
    tricks behind this method, but for now we use it to demonstrate the mechanics
    of applying this method.


    To apply this machine learning technique of a classifier to the data-set in the
    program IrisClassificationsklearn.ipynb. The program starts as usual importing
    the necessary libraries. We import the data similar to the program discussed in
    the previous chapter. We choose to split the data into a training set and a test
    set by using every second data point as training point and every other as a test
    point. This is accomplished with the index specifications 0:-1 which is a list
    that starts at "0", iterates until the end specified by "1" and uses a step of
    "2". Since the data are ordered and well balanced in the original data file, this
    will leave us also on a balanced dataset. Balance here means that we have the
    same, or nearly the same, number data in the training set for each class. It turns
    out that this is often important for the good performance of the models. Also,
    instead of using the names features and target, we decided to shorten the notation
    by denoting the input features as x and the targets as y.


