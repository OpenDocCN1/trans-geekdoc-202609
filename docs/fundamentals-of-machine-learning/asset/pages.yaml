  md: '# 10 Reinforcement learning


    In supervised learning we assumed that a teacher supplies detailed information
    on the desired response of a learner. This was particularly suited to object recognition
    where we had a large number of labeled examples. A more common learning condition
    is when an agent, such as a human or a robot, has to learn to make decisions in
    the environment. The agent in what follows is a machine learner that we implement
    in software, but it is useful to think about the agent as a system that can act
    in the world, like a robot or a human.


    A good example of such a learning tasks for an agent is that of learning to play
    tennis. In this case the agent might try out moves and get rewarded by points
    the agent scores rather than a teacher who specifies every muscle movement we
    need to follow. Or, in the case of a robot, an engineer designs every sequence
    of motor activations. One approach that reaches supervised learning is that of
    a trainer who demonstrates the correct moves. This type of supervised learning
    a called imitation learning in this context. Much of imitation learning follows
    the previous discussion we will concentrate on this chapter on an important learning
    scenario where the agent only gets feedback after periods of actions in the form
    of reward or punishment detailing which of the actions has contributed to the
    outcome. This type of learning scenario is called reinforcement learning (RL).


    We formalize the learning problem in a Markov decision process and then discuss
    a variety of related algorithms for tabular functions. The second part of this
    chapter will use function approximators with neural networks which have made recent
    progress as deep RL.


