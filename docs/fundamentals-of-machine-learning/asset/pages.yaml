    # 3.6.1 Linear classifiers with large margins


    In this section we outline the basic idea behind support vector machines (SVM)
    that have been instrumental in a first wave of industrial applications due to
    their robustness and ease of use. A warning: SVMs have some intense mathematical
    underpinning, although our goal is to outline only some of the mathematical behind
    this method. It is not strictly necessary to read this section in order to follow
    the rest of the book, but it provides a summary of concepts that have been instrumental
    in previous progress and are likely to influence the development of further methods
    and research. This includes some examples of advanced optimization techniques
    and the idea of kernels. While we mention some formula in what follows, we do
    not derive the steps and will only use them to outline the form to understand
    why we can apply a kernel trick. Our purpose here is to provide some intuitions.


    SVMs, and the underlying statistical learning theory, was largely invented by
    Vladimirnik in the early 1960s, but some first breakthroughs were made in the
    late 1990s with collaborators such as Cor Cortes, Chris Burges, Alex Smola, and
    Bernhard Scholkkopf to name a few. The SVMs are concerned with binary classification.
    Fig. 3.9 shows an example of two classes, depicted by different symbols, in a
    2-dimensional attribute space. We distinguish here between features and attributes.
    Attributes are the raw measurements, whereas features can be made up by combining
    attributes. For example, the attribute $x_1$ and $x_2$ could be combined in a
    feature vector $(x_1, x_2, x_1^2, x_2^2)^T$. This will become important later.
    Our training set consists of $m$ data where it has attribute values $x^{(i)}$
    and labels $y^{(i)}$. We put the superscript index $i$ in brackets so it is not
    mistaken as a power. For this discussion we consider the binary labels of two
    classes represented with $y \in \{-1, 1\}$. This will simplify some equations.


    ![](img/2087e3fd78fc2bbc9ee0bfaab66e3bde_61_0.png)


    Fig. 3.9 Illustration of linear support vector classification.


    The two classes in the Fig. 3.9 can be separated by a line, which can be parameterized
    as


    ```

    $$w_1x_1 + w_2x_2 - b = 0$$

    ```'
