  md: 'big data. However, the challenge of this approach is greater in situations
    where there is a limited supply of data. Bayesian models and neural networks are
    often seen as extreme poles in a modeling approach; here we try to reconcile these
    views.


    Let us now to the second important subject with our desire to build probabilistic
    models. This connection can be made easily when viewing a percept as an implementation
    of a logistic regression, as outlined in this chapter. The essence was that a
    logistic function describes the probability that a data point belongs to one class
    versus another. In the same way, we are now treating the neural network itself
    as p(class=true|w). For this we need to adapt a one-hot representation of training
    data in multiclass problems where each class is represented by a single output
    node. The value of each output node of the neural network is assumed to represent
    the probability that the input is from the corresponding class. We argue that
    the computational layers leading up to this output layer represent transformations
    of features that is necessary to learn the probabilistic function on which we
    can base our decision of class membership in classification.


    In order to train the network we have already introduced the log-likelihood principle.
    We are now taking the opportunity to show an alternative of deriving the learning
    rule of a neural network which is equivalent to maximum likelihood but which is
    a more common derivation in the neural network community. Indeed, we will take
    this opportunity to relate this to several common formulations: that of minimizing
    the log-likelihood, maximizing the cross-entropy, and of minimizing the Kullback-Leibler
    divergence.


    We start by assuming that the true nature of data is given by the unknown density
    function


    True distribution: $q(y|\mathbf{x})$.


    The neural network model represents the probability


    Model distribution: $p(y|\mathbf{x}; \mathbf{w}),


    which hope to be a good approximation of $q(y|\mathbf{x})$. The negative log-probability
    of the given label under the current model is given by


    ```

    $H(p, q) = -\sum_{y} p(y) \log q(y),$

    ```


    where we omitted writing arguments to see the structure more clearly. This quantity
    is called the cross-entropy. The term $p \log q$ is in essence as the log-likelihood
    estimate, which we want to maximize. That is, we want to maximize the log probability
    of the data given labels. The cross-entropy is the negative of this, maximizing
    the log-probability of the data given the labels is equivalent of minimizing the
    cross-entropy. Furthermore, since


    ```

    $p \log(q) = p \log \frac{q}{p} + p \log p$

    ```


    and $p \log \frac{q}{p}$ is the Kullback-Leibler (KL) divergence, we can relate
    this cross-entropy to the entropy of the distribution $p$ an the KL divergence,'
