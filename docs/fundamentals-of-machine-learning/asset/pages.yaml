  md: '![](img/2087e3fd78fc2bbc9ee0bfaab66e3bde_123_0.png)


    **Fig. 5.15** A computational graph for the function $f(x, y) = \sin(x) + x *
    y + \ln(y)$.


    If we want to take the derivative of the function with respect to the inputs,
    we can apply the chain rule. To simplify the notation, we can write the partial
    derivative as an operator D. Then we have the derivative graph similar to the
    primal graph with


    ```

    Dv1 = Dx (= 1)

    Dv2 = Dy (= 0)

    Dv3 = cos(v1) * Dv1

    Dv4 = (= 0)

    5 = Dv1 * v2 + v1 * Dv2 (= 1)

    Dv6 = Dv3 + Dv4 + Dv5 (= 2).

    ```


