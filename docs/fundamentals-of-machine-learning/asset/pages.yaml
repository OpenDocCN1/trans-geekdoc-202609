    and (B) graphs with bi-directional links.


    The second type of models that we discuss in this chapter is of the form shown
    in Fig. 9.1B. The connections between the neurons in such networks are thereby
    bi-directional. Examples of such neural networks are architectures with lateral
    connections in the context of layered neural networks and bi-directional connections'
