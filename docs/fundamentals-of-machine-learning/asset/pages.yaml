    # # 4.5 What and where


    We have so far discussed object recognition. In many applications, we want to
    go further and also tell where the objects are in the picture. For example, for
    self-driving cars, we want to know where pedestrians are or where the road is.
    One way of doing this is to place bounding boxes around the objects, as shown
    in Fig.4.12. A popular architecture for this is YOLO (You Only Look Once). The
    idea is there to train a network not only on labels, but also on the location
    (x, y), the size (w, h) of a bounding box, and confidence. The network does this
    by dividing an image into an array of grid cells of size $S \times S$, where S
    was set to $S=7$ in the original example. The network makes predictions of the
    five numbers mentioned earlier $(x, y, w, h, c) \times (B+5)$ output nodes. For
    each bounding box (B=2 in the original example), so we need $S \times S \times
    C$ output nodes, which was $C=20$ in the dataset in the original paper, hence
    output shape of $7 \times t \times 30$. This network requires a loss function
    with multiple components, weighting the contribution of classification accuracy,
    location accuracy, and confidence. There are several variants of YOLO in the literature,
    but there are course also other architectures to estimate bounding boxes.


    While "what-and-where" networks have many applications already, sometimes times
    we need even more precise in the localization of objects. An example is the important
    area of segmentation, which seeks to outline objects in pictures. An example'
