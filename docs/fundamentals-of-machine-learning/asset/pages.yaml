    \ network B. In this case we can train the network with the following loss-function\n\
    \n```\n$E(s_t, a_t) = (r_t + \\gamma \\max Q(s_{t+1}; w) - Q(s_t, a_t; w))^2$\n\
    ```\n\nwhich corresponds to training the connections to the winning node as well\
    \ as the connections feeding into it through backpropagation. To apply this strategy\
    \ to the maze environment, if the agent is in state 2 then we can write the 1-hot\
