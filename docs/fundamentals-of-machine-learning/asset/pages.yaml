    Finally, another architecture idea of deep convolutional networks is the so called
    GoogNet, also called an inception network. The idea behind the realization is
    that the sizes of objects in pictures can vary quite considerably so that the
    sizes of the filters matter. Even, with smaller filter sizes we can cover larger
    receptive fields (the area covered by a neuron) in later layers in a hierarchical
    network. However, this brings with it the challenges of training deep networks.
    A major component of the inception network is to combine filters with kernel sizes.
    For example, 1 x 1, 3 x 3 and 5 x 5 kernels, as shown in Fig. 4.11A. The outcomes
    of these filters are then concatenated to represent the input for the next layer.
    The layer filters the more computationally expensive it is. Therefore, later versions
    of the inception networks factorize n x n convolution into a 1 x N and a N x 1
    convolution. This is computationally much more efficient. That pooling is included
    as a parallel stream in the inception layer that gets concatenated with the output
    of the other filters.


    Another feature of an inception network shown in Fig. 4.11B is to use a layer
    of c filters to compress the channels. When we talk about an n x n convolution
    we mean the convolution operation in each channel and that we then add together
    the results of all the channels. Keeping the number of channels small also helps'
