  md: '# 5 Regression and optimization


    We have seen that writing machine learning programs is easy with high-level computer
    languages and with the help of good machine learning libraries. However, applying
    such algorithms with superior performance requires considerable experience and
    a deeper knowledge of the underlying ideas and algorithms. We will now take a
    step back to consider basic regression in more detail, which in turn will be the
    foundation for discussing probabilistic models in the next chapters. This chapter
    includes the discussion of the basics of the learning algorithm through gradient
    descent.


    # 5.1 Linear regression and gradient descent


    Linear regression is usually taught in high school, but my hope is that this book
    will provide a new appreciation for this subject and associated methods. It is
    the simplest form of machine learning, and while linear regression seems limited
    in scope, linear methods still have some practical relevance since many problems
    are at least approximately linear. Furthermore, we use them here to formalize
    machine learning methods and specifically to introduce some methods that we can
    generalize to non-linear situation. supervised machine learning is essentially
    regression, although the recent success of machine learning compared to previous
    approaches to modeling and regression is their application to high-dimensional
    data with non-linear relations, and the ability to scale these methods to complex
    models. Linear regression can be solved analytically. However, the non-linear
    extensions will not be analytically solvable. Hence, we will introduce the formalization
    of iterative training methods that much of supervised learning.


    ![](img/2087e3fd78fc2bbc9ee0bfaab66e3bde_97_0.png)


    **Fig. 5.1** Some data of house prices and the corresponding size of each house.


    *Fundamentals of Machine Learning, Thomas P. Trappenburg, Oxford University Press
    (2020). © Oxford University Press. DOI: 10.1093/OBO/9780198828044.001.0001*'
  merge: -1
  img_proc: true
