    Including information processes of attention is an important factor in machine
    learning. For example, attention has strongly influenced sequence-to-sequence
    processing such as in language translation. Gated memory networks already represent
    some form of attention since the release of information that is triggered by some
    context can be seen as attention. In general, attention can be seen mathematically
    as some form of non-linear processing. The simplest form is thereby a multiplicative
    gating as shown earlier. For example, we can take the output of a regular layer
    $f(Wx)$ and multiply this with new parameters $V$ as


    ```

    y = V * f(Wx).

    ```


    The attention parameters $V$ can be learned from supervised learning. It is now
    common to include such attention modules in modeling sequence-to-sequence processes.
    A good introductory tutorial of this subject is given by Jason Brown-lee at <https://machinelearningmastery.com/encoder-decoder-attention-sequence-to-sequence-prediction-keras/>


