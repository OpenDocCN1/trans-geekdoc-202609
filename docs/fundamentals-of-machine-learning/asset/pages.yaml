  md: '# 6.3 Examples of probability (density) functions


    There is an infinite number of possible pdfs. However, some specific forms have
    been very useful for describing specific processes and thus have given names.
    The following is a small list of examples with some discrete and several continuous
    distributions. The list is intended to give an overview of distributions that
    are often mentioned in scientific work, and some of them will be discussed again
    in a later chapter. Most examples are discussed as 1-dimensional distributions
    except the last example, which is a higher-dimensional distribution. Again, we
    need to keep in mind that machine learning is mostly concerned with high-dimensional
    cases so that these distributions act merely a starting point for illustrating
    some ideas.


    # 6.3.1 Bernoulli distribution


    A Bernoulli random variable is a variable from an experiment that has two possible
    outcomes: success with probability $p$, or failure, with probability $(1 - p)$.


    ```

    Probability function:

    P(success) = p \Rightarrow P(failure) = 1 - p

    mean: $p$

    variance: $p(1 - p)$.

    ```


    # 6.3.2 Multinomial distribution


    This is the distribution of outcomes in $n$ trials that have $k$ possible outcomes.
    The probability of each outcome is thereby $p_i$.


    ```

    Probability function:

    P(x_i) = n! / \prod_{i=1}^{k}(p_i^{x_i} / x_i!)

    mean: $np_i$

    variance: $np_i(1 - p_i)$.

    ```


    An important example is the binomial distribution $(k = 2)$, which describes the
    number of successes in $n$ Bernoulli trials with probability of success $p$. Note
    that the binomial coefficient is defined as


    ```

    \binom{n}{x} = \frac{n!}{x!(n-x)!} (6.17)

    ```


    and is given by the Python function `itertools.permutations`.


    ![](img/2087e3fd78fc2bbc9ee0bfaab66e3bde_131_0.png)


    ```

    Probability function:

    P(x) = \binom{n}{x} p^x (1-p)^{n-x}

    mean: $np$

    variance: $np(1 - p)$.

    ```'
