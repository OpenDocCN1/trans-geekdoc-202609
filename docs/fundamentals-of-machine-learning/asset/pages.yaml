    # 5.6.2 Multilayer perceptron (MLP)


    Let us consider the XOR function which is y = 1 if both arguments are the same
    and otherwise. It is interesting to try and learn this case using the perceptron
    program as this one does not seem to work. Indeed, this function cannot be learned
    by the perceptron as the XOR is not linearly separable. This led to the demise
    of perceptrons in the 1970s although it was clear that more elaborate perceptrons
    with multiple layers could solve this problem. Frank Rosenblatt started to build
    such networks out of the simple neural models and wrote a book about them. He
    even started to build neural computers based on perceptrons and trained them similar
    to the algorithm shown below. It seems that by Rosenblatt''s early death Marvin
    Minsky''s strong opposition the public realized learning problematic with these
    more elaborate structures. Thus, multilayer perceptrons became popular again only
    when effective training was rediscovered and made popular in 1986s by Rummelhardt,
    Hinton, and Williams.


    ![](img/2087e3fd78fc2bbc9ee0bfaab66e3bde_116_0.png)


    **Fig. 5.12** The standard architecture of a feedforward multilayer network with
    one hidden layer, in which input values are distributed to all hidden nodes with
    weighting factors summarized in the weight matrix w^h. The output values of the
    nodes of the hidden layer are passed to the output layer, scaled by the weights
    of the connection strength as specified by the elements in the weight matrix w^o.


    We will now consider networks of simple sigmoidal neurons to build up what are
    called artificial neural networks since the perceptron is basically just one neuron.
    We will first consider a network structure as shown in Fig. 5.12. The network
    has a layer of m input nodes, a layer of h hidden nodes, and a layer of n output
    nodes.'
