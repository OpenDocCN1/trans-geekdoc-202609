    # 1.3 Non-linear regression in high-dimensions


    The simplest example of supervised machine learning is linear regression. In linear
    regression we assume a linear model such as the function,


    ```

    $$y = w_0 + w_1x.$

    ```


    This is a low-dimensional example with only a single feature, value x, and a scalar
    label, value y. Most of us learned in high school to use mean square regression.
    The method we choose as values for the offset parameter $w_0$ and the slope parameter
    $w_1$ that minimizes the summed squared difference between the regressed and the
    data points. This is illustrated in Fig. 1.4A. We will later explain this procedure
    in more detail. This is an example where data are used to determine the parameters
    of a parameterized model, and this model with the fitted parameters can then be
    used to predict y values for new x. This in essence supervised learning.


