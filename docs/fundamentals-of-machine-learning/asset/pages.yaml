    # 8.4.2 Mixture of Gaussian and the EM algorithm


    We can now extend the idea of $k$-means clustering to the more rigorous case of
    assuming a specific model for each class. We will again use Gaussian models here
    as the example, but it should be clear that we can use any form of model for the
    in-class distribution. Here we assume that we have $k$ Gaussian classes, where
    each class is chosen randomly from a multinomial distribution,


    $p(z^{(i)} = j) \propto \text{multinomial}(\Phi_j) \quad (8.43)$

    $p(x^{(i)}|z^{(i)} = j) \propto N(\mu_j, \Sigma_j). \quad (8.44)$


    This is called a Gaussian mixture model. The corresponding log-likelihood function
    is


    $L(\Phi, \mu, \Sigma) = \sum_{i=1}^m \log \sum_{z^{(i)}=1}^m p(x^{(i)}|z^{(i)};
    \mu, \Sigma)p(z^{(i)}; \Phi). \quad (8.45)$


    Since we consider unsupervised learning, we are given input data $x$ without labels.
    We then use as the symbol $z$ for the labels that we assume to be latent random
    variables $z^{(i)}$. Knowing the labels makes the problem harder than the supervised
    Gaussian model discussed earlier. If given the class membership, the log-likelihood
    would be


    $L(\Phi, \mu, \Sigma) = \sum_{i=1}^m \log p(x^{(i)}; z^{(i)}, \mu, \Sigma), \quad
    (8.46)$


    which we could use to calculate the maximum likelihood estimates of the parameter
    (seq Eqs 8.17–8.19),


    $\phi_k = \frac{1}{m} \sum_{i=1}^m \mathbb{1}(z^{(i)} = j) \quad (8.47)$

    $\mu_k = \frac{\sum_{i=1}^m \mathbb{1}(z^{(i)} = j)x^{(i)}}{\sum_{i=1}^m \mathbb{1}(z^{(i)}
    = j)} \quad (8.48)$

    $\Sigma_k = \frac{\sum_{i=1}^m \mathbb{1}(z^{(i)} = j)(x^{(i)} - \mu_j)(x^{(i)}
    - \mu_j)^T}{\sum_{i=1}^m \mathbb{1}(y^{(i)} = k)} \quad (8.49)$'
