  md: '# Gated recurrent neural networks, natural language processing, and attention
    | 191


    ![](img/2087e3fd78fc2bbc9ee0bfaab66e3bde_193_0.png)


    **Fig. 9.6** Long Short Term Memory (LSTM; adapted from colah''s ).


    As a reminder, the curly brackets signify here a concatenation operation. This
    is like a usual hidden layer equation used in the basic RNN. The gating functions
    themselves are learned with corresponding weight values and a sigmoid gain function
    of the logistic variety to scale these terms to the range 0 (total forgetting,
    no memory update) and 1 (keep memory state, add input fully);


    ```

    $f(t) = \sigma(w_f\{x(t), h(t-1)\} + b_f)\ni(t) = \sigma(w_o\{x(t), h(t-1)\} +
    b_x)$

    ```


    Finally, we produce an output for the recurrent node from its memory state


    ```

    $h(t) = o(t)\tanh(c(t))$

    ```


    ```

    $o(t) = \sigma(w_o\{x(t), h(t-1)\} + b_o)$

    ```


    In order to demonstrate an LSTM in Keras follow the common example of a sentiment
    analysis. Sentiment analysis is here just another example of classification in
    the context of giving documents labels representing sentiments like good or bad.
    We use the Large Movie Review Dataset (IMDB), which contains 50,000 movie reviews
    which are train either positive or negative. The task is to use the documents
    for training and test the other if the sentiment of the test reviews can be predicted.
    Such a program is included in the Keras examples that we provide here a simplified
    version.


    This example gives us the opportunity to revisit representations. In Chapter 8
    we mentioned the bag of words representation. This representation consists of
    a large vector of the vocabulary with each component of this vector indicating
    the number of times this word occurs in the text. We want to represent the text
    itself as a sequence of words, which is a much better way to approach natural
    language processing (NLP). With a one-hot representation of a letter, we would
    have a high-dimensional yet very sparse representation. A sequence would then
    be a sequence of high-dimensional space vectors. Another way of word representations
    would be every word a unique identifier. While this helps with the dimensionality
    of the representation, this does not capture relations between words. A common
    first step in NLP is to learn an *embedding*. An embedding, specifically a word
    embedding here, transforms an arbitrary representation to a dense vector space
    representation in which words that are commonly related within a task'
