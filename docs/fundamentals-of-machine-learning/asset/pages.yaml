    have to recall two rules from calculus, namely that the derivative of an exponent
    function is


    ```

    $$\frac{d}{dx}x^n = nx^{n-1}.$

    ```


    The derivative of the Euler function is,


    ```

    $$\frac{d}{dx}e^x = e^x,$

    ```


    which is an interesting fact in its own right as this means that the function
    is equal to its slope at every point. This is not coincidental as the functionals
    is actually defined as such. Finally, we need the chain rule


    ```

    $$\frac{d}{dx}f(g(x)) = \frac{df}{dg} \frac{dg}{dx}.$

    ```'
