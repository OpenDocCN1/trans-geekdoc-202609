    to reason about possible events. For this, we want to add knowledge or hypotheses
    about **causal relations**. For example, a fire alarm should be triggered by a
    fire, although there is some small chance that the alarm will not sound when the
    unit is defective. However, it is (hopefully) likely that the sound of a fire
    alarm will trigger a fire. It is useful to illustrate such causal relations with
    graphs such as


    In graphical models, the nodes represent random variables, and the links between
    them represent causal relations with conditional probabilities, $p(A|F)$. Since
    we use arrows on the graphs, we discuss **directed graphs**, and we also restrict
    our discussions to graphs that have no loops, so called **acyclic graphs**. **Directed
    acyclic graphs** are also called **DAGs**.


