  md: '# How to combine prior knowledge with new evidence | 137


    with a probability that is Gaussian with variance $\sigma_1$ around this estimated
    point. That is, our prior knowledge is


    ```

    $p(x) = \mathcal{N}(\hat{x}, \sigma_1). \quad (6.51)$

    ```


    We invoke a distance sensor. We have tested this sensor before derived form the
    likelihood that we get a reading $y$ if the sensor is a distance $x$ from the
    wall. Let us assume that this is also Gaussian $x$ with variance $\sigma_2^2$,


    ```

    $p(y|x) = \mathcal{N}(x, \sigma_2). \quad (6.52)$

    ```


    The question is now: if we get a sensor reading of $y$, what is the estimate of
    the distance $x$ to the wall given a sensor reading of $y$, the posterior $p(x|y)$?
    Note that this is not only one answer but gives us the probability for each possible
    distance. We might then choose the point estimate with the highest probability,
    but the advantage in having a full probabilistic view enables advanced reasoning.


    We are lucky here, since both the prior and the likelihood are Gaussian distributed,
    and one can show that the product of two distributions is Gaussian distributed
    where the mean and variance is a weighted sum over the contributing Gaussians,
    namely


    ```

    $\mu = \frac{\sigma_2^2x + \sigma_1^2y}{\sigma_1^2 + \sigma_2^2} \quad (6.53)$

    ```


    and


    ```

    $\sigma = \frac{\sigma_1\sigma_2}{\sqrt{\sigma_1^2 + \sigma_2^2}} \quad (6.54)$

    ```


    Furthermore, and importantly, since we know that the resulting distribution is
    a Gaussian, we also know not have to calculate the denominator $p(y)$ which depends
    on movements of the robot and all corresponding sensor measurements that we do
    not know. Therefore, in this situation we can calculate the posterior analytically,
    which is given by


    ```

    $p(x|y) = \mathcal{N}(\mu, \sigma). \quad (6.55)$

    ```


    We wanted to show that the posterior of a Gaussian likelihood with a Gaussian
    prior is tractable. Unfortunately, for most distributions, we cannot calculate
