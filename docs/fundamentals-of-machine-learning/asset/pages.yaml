  md: '# 9 Cyclic models and recurrent neural networks


    We have discussed several directed directed models with a simple directed consecutive
    flow of information, including feed-forward neural networks and directed acyclic
    graphs for Bayesian networks. A more general form of models can include cyclic
    dependencies where model components can influence model components from sending
    such nodes. There are two principle architectures we will discuss in this chapter.


    The first principle architecture of cyclic graphs is shown on the left in Fig.
    9.1. These types of models are directed graphs similar to the Bayesian networks
    discussed in Chapter 7, except that we now consider loops in the directed graph.
    We will discuss such models in the context of recurrent neural networks where
    the network nodes are neurons as commonly used in recurrent networks but which
    now allow feedback connections. With deterministic neurons, although it is possible
    to generalize the architectures to the stochastic case. However, even with deterministic
    neurons, such architectures can change neuron activations in an ongoing way with
    constant input. Such networks represent dynamical systems in the wider context
    and do therefore represent some form of temporal modeling. The topic of temporal
    modeling will thus be at the center of the following discussions. Note that the
    shown network has two input neurons and two output neurons. These neurons are
    commonly visible. In contrast, the neurons that are not connected to the outside
    wors are called the hidden neurons.


    A. Network with feedback connections B. Network with bidirectional connections


