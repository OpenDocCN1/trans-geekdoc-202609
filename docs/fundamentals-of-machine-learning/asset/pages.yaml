    # 4.4 Convolutional neural Networks (CNNs)


    # 4.4.1 Filters and convolutions


    We mentioned earlier that an SVM is an improved perceptron in that it takes regularization
    and some form of feature transformation into account. We should ask ourselves
    whether MLP is then outperforming SVM on the MNIST data which achieves only 94
    per cent reliable with the sklearn implementation. The main difference is that
    here we use more layers with adjusted parameters compared to the SVM which we
    can view as a one-layer (small) perceptron with an additional preprocessing step
    of transforming inputs into a high-dimensional representation of the feature space
    defined by the kernel. The use of additional layers with learned parameters allows
    for the learning of hierarchical features. We will illustrate this in more detail
    later, but for now it is sufficient to say that deep learning enables the learning
    of hierarchical representations that are difficult to match with shallow (less
    sequential) operations. Increasing the number of layers has allowed successful
    applications of neural networks to more complex problems. Models with tens or
    even hundreds of layers are now uncommon.


    The question is how we can make the neural networks scalable, as it not only takes
    more time to process the models, but also increases the demand on training examples
    to learn the increased number of parameters for more complex models. The answer
    is that we can build-in assumptions into our network architecture. We will see
    this strategy several times. Here we discuss a particular important case, of position
    invariance of features.


    It is utilize to realize that neurons represent most activated for specific input
    patterns, specific features, this is easily understood in vision applications.
    We demonstrated this already in Chapter 2 when discussing convolutions. While
    we demonstrated there with pre-defined filters, we are now taking this step further
    by building networks based on convolutional operations in which the parameters
    of the filters are learned.'
