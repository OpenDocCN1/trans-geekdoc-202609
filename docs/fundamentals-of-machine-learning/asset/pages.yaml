    # 7.5.1 Causal models


    In the previously discussed probabilistic regression examples, we mainly consider
    models for one random variable, or at most two. We now consider complex models
    with many more factors described by random variables. Probability theory nicely
    generalizes to multiple random variables. Multivariate cases are simply described
    by a joint probability outlined in the review of probability theory.


    ![](img/2087e3fd78fc2bbc9ee0bfaab66e3bde_157_0.png)


    **Fig. 7.6** Example of a causal model to diagnose starting problems (adapted
    from Sebastian Thrun, MOOC on AI, 2011). With the joint density function of this
    model has 16,383 parameters, the corresponding causal model has 45 parameters.


    An example from Sebastian Thrun of a model to diagnose when a car is not starting
    is shown in Fig. 7.6. This example is reasonably sized, although real-world problems
    would be even larger than this. This model considers fourteen random numbers to
    determine possible cases if the car does start ("car does not start" is not a
    random number as we are using this model when we already know that the car is
    not starting). The random numbers themselves could have two outcomes (such as
    if there is gas in the tank), or even multiple values. Now let us simplify the
    model by only considering binary values. That is, the age of the battery would
    only be specified as new or old. The joined probability table for the 14 variables
    would then have $2^{14} - 1 = 16383$ entries. These parameters have to be estimated
    (learned) from examples using MAP or MLE.'
