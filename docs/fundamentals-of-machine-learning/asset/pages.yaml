  md: '# Table 5.1 Summary of error-backpropagation algorithm


    Initialize weights arbitrarily

    Repeat until error is sufficiently small

    Apply a sample pattern to all input nodes: $x_i$

    Propagate input through the network by calculating the rates of nodes in successive
    layers $l: y_i^l = g(\sum_j w_{ij}^l y_j^{l-1})$

    Compute the delta term for the output layer: $\delta_i^o = g''(y_i^{o-1})(desired
    - y_i^o)$

    Back-propagate delta terms through the network: $\delta_{ij}^{l-1} = g''(y_j^{l-1})
    \sum_i w_{ij}^l \delta_i^l$

    Update weights by adding the term: $\Delta w_{ij}^l = \alpha \delta_i^l y_j^{l-1}$


    ```

    $$\frac{1}{2} \frac{\partial}{\partial w_{ij}} \sum_k \left(\mathbf{y}^{(k)} -
    g(w^{(k)}\mathbf{x}^{(k)})\right)^2 = (5.63)$

    ```


    After battle with indices (which can be easily avoided with analytical calculation
    programs as MAPLE or MATHEMATICA), we can write the derivative in a form similar
    to that of the derivative of the output layer, namely


    ```

    $$\frac{\partial E}{\partial w_{ij}^h} = \delta_j^h x_i, (5.64)$

    ```


    when we define the delta term of the hidden term as


    ```

    $$\delta_j^h = g''(h_{in}) \sum_k w_{kj}^h \delta_k^o. (5.65)$

    ```


    The error $\delta_i^h$ is calculated from the error term of the output layer with
    a formula that looks similar to the general update formula of the network, except
    that a signal is propagating from the output layer to the previous layer. This
    is the reason that the algorithm is called the **error-backpropagation algorithm.**


    In derivation we use the MSE over all the training patterns. Since all the training
    patterns are used at once, a batch algorithm is generally a good idea, but it
    takes a lot of memory with large training sets and we have mentioned that an online
    version when new data points arise in a random order can help with avoiding local
    minima. The online version of this is summarized in Table 5.1. Of course, this
    algorithm is commonly applied in batches at a time.


