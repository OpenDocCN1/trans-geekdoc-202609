    # 3.4 Dimensionality reduction, feature selection, and t-SNE


    Before we dive deeper into the theory of machine learning, it is good to realize
    that we have only scratched the surface of machine learning tools in the sklearn
    toolbox. Besides classification, there is course regression, where the label is
    a continuous variable instead of a categorical. We will later see that we can
    formulate supervised machine learning techniques and that classification is only
    a special case of regression. Sklearn also includes several techniques for clustering
    which are often unsupervised learning techniques to discover relations in data.
    Popular examples are k-means and Gaussian mixture models (GMM). We will discuss
    these techniques and unsupervised learning more in later chapters. Here we will
    end this section by discussing some dimensionality reduction methods.


    As stressed earlier, machine learning is inherently aimed at high-dimensional
    feature spaces and corresponding large sets of model parameters, and interpreting
    machine learning results is often not easy. Several machine learning methods such
    as neural networks or SVMs are frequently called a blackbox method. However, there
    is nothing hidden from us; we could inspect all portions of machine learning models
    such as the weights in support vector machines. However, since the models are
    complex, the human interpretability of results is challenging. An important aspect
    of machine learning is the use of complementary techniques such as visualization
    and dimensionality reduction. We have seen in the iris data that even plotting
    data in a subspace of the 4-dimensional feature space is useful, and could ask
    which subspace would be visual. Also, a common technique to keep the model complexity
    low in order to help with the overfitting problem and with computational demands
    to select input features carefully. Such feature selection is hence related to
    dimensionality reduction.


    Today we have more powerful computers, tuning more training data, as well as better
    regularization techniques so that input variable selection and standalone dimensionality
    reduction techniques seems less important. With the advent of deep learning we
    now often see end-to-end solutions that start with basic features without the
    need for pre-processing to find solutions. Indeed, it can be viewed as problematic
    to potential information. However, there are still many practical reasons why
    dimensionality reduction can be useful, such as the limited availability of training
    data and computational constraints. Also, displaying results in human readable
    formats such as 2-dimensional maps can be very useful for human-computer interaction
    (HCI).


    A traditional method that is still used frequently for dimensionality reduction
    is principal component analysis (PCA). PCA attempts to find a new coordinate system'
