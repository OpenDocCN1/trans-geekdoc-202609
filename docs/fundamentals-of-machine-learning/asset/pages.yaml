  md: '![](img/2087e3fd78fc2bbc9ee0bfaab66e3bde_230_0.png)


    **Fig. 10.9** Illustration of an actor that is implemented with a deep neural
    network.


    ```

    $x = \{s_0, a_0, s_1, a_1, ..., s_T, a_T\}.

    ```


    Since the policy and the transitions are also probabilistic, we can write the
    probability if a trajectory $p(x) = p(s_0, a_0, s_1, a_1, ..., s_T, a_T)$ as


    ```

    $p(x|\mathbf{w}) = p(\mathbf{w}) \prod_{t=0}^{T} \pi(s_{t+1}|s_t, a_t)\pi(a_t|s_t;
    \mathbf{w}).$.

    ```


    We have indicated here that the probability depends on the parameters of the model
    as we want to learn. In the stochastic case, the reward is stochastic and we need
    to sample over trajectories. We use here the finite horizon case we do not need
    discounting, and the objective function can simply be written as the average value
    of the reward repeated episodes.


    **Actor value function:** $J(\mathbf{w}) = E[\sum_{t=0}^{T} \rho(s_t, \pi(a_t|s_t;
    \mathbf{w}))]\sim p(x|\mathbf{w}).$


    This is expected value that we need to sample to find an approximation of this
    value


    ```

    $J(\mathbf{w}) \approx \frac{1}{N_x} \sum_{x=1}^{T} N_x \rho(s_t, \pi(a_t|s_t;
    \mathbf{w}))$.

    ```


    where $N_x$ is the number of trials in the sample. To find the parameters that
    maximize this objective we follow a gradient, as usual. Then, we have to find
