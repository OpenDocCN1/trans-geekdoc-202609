    # 4.3 Representational learning


    Here, we are discussing feedforward neural networks which can be seen as imple-

    menting transformations or mapping functions from an input space to a latent space,

    from there to an output space. The latent space is spanned by the neurons

    between the input nodes and the output nodes, which are sometimes called the hidden

    neurons. We of course always observe the activity of the nodes in our programs

    that they are not really hidden. All the weights are learned from the data so
    that

    the transformations that are implemented by the neural network are learned from
    ex-\amples. However, we can guide these transformations with the architecture.
    The latent

    representations should be learned so that the final classification in the last
    layer is

    eier than the raw sensory space. Also, the network and hence the representation

    it represents should make generalizations to previously unseen examples easy and

    robust. It is useful to pause for a while and here discuss representations.


    # 4.3.1 Signal decomposition and sparse features


    To illustrate again the re-representation of a signal with filters, consider basic
    signal

    analysis. Let us consider time-varying signals that are represented with floating
    point\values for each time step. Say we are sampling an EEG signal that is recorded
    from

    electric electrodes attached to the head with 500HZ. That is, we have one data
    point

    ever 0.002 second. If we assume that a floating point is typically represented

    computer word of 64 bits, then a 10-minute length would take over 2 MB of storage.

    An example $x(t)$ is illustrate at the top in Fig. 4.6. While this is a relatively

    complicated signal, we have created this signal from two template signals that
    we call

    t **basis functions**. With these basis functions we can reconstruct the signal
    as


    ```

    $$x(t) = a_1y_1(t) + a_2y_2(t)$

    ```'
