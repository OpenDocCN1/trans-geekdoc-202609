  md: '# 14 | Introduction


    sometimes cumbersome can distract us from making good use of them. We take a more
    practical approach, letting a user define what an appropriate contribution is
    for a machine learning model. For example, the best accuracy of a prediction might
    not always be the goal, and other considerations such as the speed of processing,
    the number of required training data, and the ability to interpret data be important
    factors. We will therefore include briefs of some classic machine learning algorithms
    even if they do not represent the latest research in this area.


    An interesting remark that often cops up in discussions of some machine learning
    algorithms and, in particular, neural networks is that these methods are commonly
    described, and somewhat criticized, as black box methods. By "back box" we usually
    mean that the internal structure is not known. However, the machine learning models
    usually live in a computer where we can inspect all the components; these methods
    are known as white box methods. A better way to describe the difficulties with
    ability human in interpreting machine learning models is due to the fact that
    deep learning models are commonly complex models that implement complex decision
    rules. While some application may have a goal of the learning of human interpretable
    decision rules, other might be interested in achieving better prediction performance,
    which requires more fine-grained rules.


    We will see in Chapter 3 that writing a program to apply machine learning algorithms
    to data is not very difficult. New algorithms will often find their way to graphical
    data mining tools, which makes them available to an even larger application community.
    applying algorithms correctly in different domains can be challenging and it is
    well known that some experience is required. We will therefore concentrate in
    the following explaining what is behind these algorithms and how different theoretical
    concepts are explored by them. Some understanding of the algorithms is absolutely
    necessary to avoid pitfalls in their application.


    The first step for the application of ML methods is how to represent the data.
    We mentioned already some data structures of inputs as vectors or tensors. However,
    there are usually many different possible ways to represent a problem numerically.
    In the past it has been crucial to work out an appropriate highlevel data representation
    as summary statistics to keep the dimensionality of the model low. However, the
    recent progress in deep learning made it possible to treat this representation
    as part of the learning process. Representational learning has thus become an
    important part of machine learning.


    Once the problem has been defined by representing the data and possible goals
    in an appropriate way, and once the appropriate ML algorithm has been chosen,
    it is then the main challenge to choose good parameters of the algorithms, such
    as the number of neurons or layers of neurons in neural networks, which kernel
    to use in support vector machines, how many training steps to take in gradient
    descent, or how many data to use for learning validation. We call these parameters
    of the algorithms the hyperparameters. Choosing the right hyperparameters is commonly
    a major question, and to make it clear that, there is no simple answer. Thinking
    about how to approach this question with appropriate experiments and to understand
    the options and possible approaches is thus a major part of machine learning applications.
    The point I want raise here is that learning about the algorithms rather than
    simply applying them is a direction worth taking.'
