- pgno: 11
  md: '# The basic idea and history of machine learning | 3


    The reason is that machine learning is really about modeling data. Modeling is
    the basis for advanced object recognition, data mining, and, ultimately, intelligent
    systems. Machine learning is the analytic engine in areas such as data science,
    big data analytics, and to some extent, to science in the general sense of building
    quantitative models.


    Machine learning has a long history with traces far back in time (see Fig. 1.2).
    The first genuine public recognition and accompanying widespread excitement among
    scientists after learning machines came in the late 1950s and early 1960s with
    when Arthur Samuel''s self-learning checkers devised a program with reinforcement
    learning that ultimately learned to outperform its creator. Richard Bellman invented
    much of the mathematical foundation of reinforcement learning. One of the first
    general learning machines that are now considered to be neural networks invented
    by Karl Steinenberg. Frank Rosenblatt invented the systematic foundation of neural
    networks and started to build neural network computers by Charles Wightman, as
    the Mark I Perceptron. Neural networks were popularized in the 1980s, influenced
    by David Rumelhart and Geoffrey Hinton, and Terry Sejnowski their connection to
    the brain. Of course, many inspiring researchers such as Yoshua Bengio, Yann LeCun,
    and Jürgen Schmidhuber, to make a name.


    We are now in an era of "deep learning", with recent developments that are responsible
    for the popularity of machine learning. This has a great deal to do with the availability
    of appropriate data and the availability of faster computers, also to smart techniques
    that make it possible to scale models to much larger domains. A great example
    of the recent progress in deep reinforcement learning is the ability of a computer
    to play video games. Video games from the Atari platform have become a useful
    paradigm for the new set of benchmarks that go beyond the classical data sets
    for machine learning from the University of California Irvine UCI machine learning
    repository that have dominated the benchmarks in the past. Atari games are simplified
    worlds while still presenting more learning in environments that humans have to
    figure out. In these benchmarks only visual input is given, up to the computer
    frames of the video game, and feedback is only provided with how well the player
    performed in the game.


    While these examples have been widely popularized as the new frontier in AI, much
    of the scientific progress in machine learning is related to its embedding with
    probabilistic methods and statistical learning theories. Some pioneers in this
    domain are Vlas Wapnik and Judea Pearl. The development of statistical machine
    learning and Bayesian networks has influenced the field significantly in the last
    twenty years, and the domain of Bayesian reasoning is essential for the deeper
    understanding of machine learning. Some scientists are now working on more general
    probabilistic programming methods that to some extent go beyond the recent standard
    in machine learning applications. The aim of this book is to introduce machine
    learning at a more practical level so that it can be applied immediately by practitioners,
    at least in its basic form, and to discuss the foundations in more general terms
    to help practitioners to learn more about the theoretical underpinning of machine
    learning.


    In the next chapters we learn how to apply machine learning with the help of Python-based
    programming frameworks based on Python libraries such as Sklearn'
