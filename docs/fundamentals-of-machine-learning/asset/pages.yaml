    To train these networks, we consider again minimizing MSE which would be appropriate
    for Gaussian noisy data around the model. The learning rule is then given by a
    gradient descent on this error function,


    ```

    $w_j^l \leftarrow w_j^l - \alpha \frac{\partial E}{\partial w_j^l} \quad (5.59)$

    ```


    with $l \in \{h, o\$.

    Specifically, the gradient of the MSE error function with respect to the output
    weights is given by


    ```

    $\frac{\partial E}{\partial w_{ij}^o} = \frac{1}{2}\frac{\partial}{\partial w_{ij}^o}\sum_k
    (y^{(k)} - \mathbf{y})^2 \nn = \frac{1}{2}\frac{\partial}{\partial w_{ij}^o}\sum_k
    (y^{(k)} - g(\mathbf{w}^h\mathbf{x}^{(k)}))^2 \quad (5.60)$

    ```


    Let''s call the activation of the hidden nodes $y^h$,


    ```

    $y^h = g(\mathbf{w}^h\mathbf{x})\.\quad (5.61)$

    ```


    Then we can continue with our derivative,


    ```

    $\frac{\partial E}{\partial w_{ij}^h} = \frac{1}{2}\frac{\partial}{\partial w_{ij}^h}\sum_k
    (y^{(k)} - g(\mathbf{w}^h\mathbf{y}^{(k)}))^2 \n\n = -\sum_k g''(\mathbf{w}^h\mathbf{x}^{(k)})(y^{(k)}
    - y_i)y_j^h \n\n = \delta_{ij}y_j^h, \quad (5.62)$

    ```


    Eq52 is just the delta rule as presented earlier because we have only considered
    the output layer. The calculation of the gradients with respect to the weights
    of the hidden layer again requires the chain rule as they are more embedded in
    the error function. Thus we have to calculate the derivative


    ```

    $\frac{\partial E}{\partial w_{ij}^h} = \frac{1}{2}\frac{\partial}{\partial w_{ij}^h}\sum_k
    (y^{(k)} - \mathbf{y})^2$

    ```'
