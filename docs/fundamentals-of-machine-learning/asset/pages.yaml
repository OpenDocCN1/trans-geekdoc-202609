    ```

    $\frac{1}{\sqrt{2\pi}\sigma} \int_{-\infty}^{y} e^{-\frac{(x-\mu)^2}{2\sigma^2}}dx
    = \text{erf}(\frac{y-\mu}{\sqrt{2}\sigma}),. \quad (6.20)$

