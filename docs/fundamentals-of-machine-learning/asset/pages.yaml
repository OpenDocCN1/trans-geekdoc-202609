  md: 'Image processing and convolutional filters | 35


    For a 1-dimensional discrete signal, a convolution is defined mathematically as


    ```

    $(f * x)(t) = \sum_{t''=0}^{T} f(t'')x(t + t'') \quad (2.1)$

    ```


    We have used the notation of $t$ for the running variable as this is often applied
    to time series. Of course, this is only a notation and we could choose any symbol
    we like. A convolution for a continuous signals that spans an infinite time in
    the form of its mathematically formula is


    ```

    $(f * x)(t) = \int_{-\infty}^{\infty} f(t'')x(t - t'')dt'' \quad (2.2)$

    ```


    In this notation has been historically more common in engineering, the filter
    is reversed (flipped) compared to the discrete definition above. In machine learning
    circles, the plus sign seems now to be the dominant way of formulating the convolution,
    and because we will learn this value of the filter, this part of the definition
    does not influence the results. A function like the filter appearing in an integral
    as above is mathematically called a kernel function.


    It is straight forward to generalize a convolution to $n$-dimensional data. Mathematically,
    a complete $n$-dimensional convolution can be written as


    ```

    $(f * g)(x_1, ..., x_n) = \int_{-\infty}^{\infty} ... \int_{-\infty}^{\infty}
    f(x_1, ..., x_n)g(x_1 - x''_1, ..., x_n - x''_n)dx''_1 ...dx''_n \quad (2.3)$

    ```


    where we used the letter $g$ for the signal. $g$ is an $n$-dimensional array.
    Any $n$-dimensional structure with the corresponding rules of operations is mathematically
    called a tensor. For example, a 3-dimensional tensor would be a cube, and convolving
    them with another 3-dimensional tensor (cube) would result in another 3-dimensional
    tensor (cube). The discrete 2-dimensional convolution can be written as


    ```

    $(f * g)(u, v) = \sum_{u''=0}^{U} \sum_{v''=0}^{V} f(u'', v'')g(u + u'', v + v'')
    \quad (2.4)$

    ```


    We use here $u$ and $v$ for the coordinates of the signal. These letters are often
    used for the pixel space in digital cameras.


    It is now common that software packages have already function for convolution
    operations. However it might be useful to note that most implementations are based
    on the convolution theorem which states the convolution of two tensors is a point-wise
    multiplication in Fourier space. Here, one first applies an FFT (Fast Fourier
