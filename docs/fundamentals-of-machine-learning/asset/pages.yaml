    \n# 9.3 Gated neural networks, natural language processing, and attention\n\n\
    As outlined earlier, the basic recurrent network has the form of a memory that\
    \ takes earlier states into account. However, the influence of these states fades\
    \ exponentially when the weight values are smaller than 1, which they have to\
    \ be would exponentially overwhelm the input. The basic RNN is hence a form of\
    \ short-term memory. Such a short-term memory is usually insufficient for many\
    \ applications. For example, in natural language processing it is necessary to\
    \ take context into account that might be relative to words at the current sequence\
    \ position. Hence some memories should \"kick in\" at some appropriate time which\
    \ might be triggered by another word. It is important to remember these memories\
    \ until they are used at a later state of processing.\n\n# 9.3.1 Long short term\
    \ memory (LSTM) and sentiment analysis\n\nThe first network which has taken longer-term\
    \ memory into consideration is called LSTM which stands for \"long short-term\
    \ memory\". This network is illustrated in Fig. 9.6.\n\nThis gated network introduces\
    \ another cell c(t) which represents an intrinsic memory state. Its value is forwarded\
    \ to the next time step and can be modified in each time step with two operations,\
    \ a forgetting gate $f_t$, and an input (write) gate $i_t$,\n\n> $$\\mathbf{c}(t)\
    \ = f(t)c(t-1) + i(t)\tilde{c}(t)$$\n\nThe new memory addition depends on the\
    \ new input and is calculated as\n\n> $$\\tilde{c}(t) = \\tanh\\{x(t), h(t-1)\\\
    } + b_c$$"
