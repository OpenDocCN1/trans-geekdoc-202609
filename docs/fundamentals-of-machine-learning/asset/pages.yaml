  md: '# 8 Generative models


    This chapter is an an introduction to the important topic of building generative
    models. These are models that are aimed at understanding the variety of a class
    such as cars or trees. A generative mode should be able to generate feature vectors
    for instances of the class they represent, and such models should be able to characterize
    the class with all its variations. We discuss this subject both in a Bayesian
    and in a deep learning context, and also within supervised and unsupervised context.
    This area is related to important algorithms as k-means clustering, expectation
    maximization (EM), naive VAEs, generative adversarial networks (GANs), and variational
    autoencoders (VAE) that are discussed in this chapter.


    # 8.1 Modeling classes


    In the previous sections we introduced the idea that understanding the world should
    be based on a probabilistic model of the world. For example, building a good recognition
    system means estimating a large density function over the probability of objects
    given sensory data. We have done so far to use classification models as a discriminative
    recognition model that take feature values x and make a prediction of an output
    (label) y. In the probabilistic framework, models were formulated as parameterized
    functions that represent the conditional probability $p(y|x)$; A model that distinguishes
    between classes based on the feature values is a **discriminative model**. Building
    a discriminative model directly from example data can be a daunting task as we
    learn how each item is distinguished from every other possible item. It worked
    on some examples earlier because we have mainly used simple models in low dimensions
    to illustrate the ideas. However, many real-world problems have much larger dimensions.


    We will now outline a different strategy: of learning first about the nature of
    specific classes and then using this knowledge to learn a classification prediction.
    We will therefore have to learn a **generative models**,


    ```

    $p(y|x; \theta)$

    ```


    and then use an inference mechanism to use this knowledge for decision-making.
    Such a learning strategy seems resemble human learning closely. Generative models
    can be used with an inference engine to solve diverse tasks such as classification.
    For example, we might first learn about chairs, and independently about tables,
    and when we are shown pictures with different furnitures we can draw on this knowledge
    to classify them.


    Let''s talk briefly about the inference engine. In order to use probabilistic
    models as in 8.1, we need to ask how we can combine the'
