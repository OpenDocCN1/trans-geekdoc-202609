  md: '# # 6 Basic probability theory


    Probably the biggest challenge in using data to build models is the nature of
    uncertainty. This includes the limited knowledge about the world, such as relying
    on noisy or unreliable sensors. Even knowing if a sample sets is appropriate to
    cover the dependencies we want to uncover some uncertainty in machine learning.
    The mathematical description of uncertainty is covered in probability theory,
    and it should not be a surprise that this language with a refresher in probability
    theory has helped enormously to formalize the areas of machine learning for a
    deeper understanding.


    This chapter provides a refresher in probability theory, in particular with respect
    to the formulations that build the theoretical language of modern machine learning.
    Probability theory is the formalization of random numbers, and we outline what
    these are and how they are characterized by probability density or probability
    mass functions. We discuss how functions have traditionally been characterized
    and provide a review of how to work with such mathematical objects as transforming
    density functions and how to measure differences between density function. We
    then review and basic operations with multiple random variables, including the
    Bayes law, and with an outline of some important approximation techniques of so-called
    Monte Carlo methods.


    We are mainly interested in the language of probability theory rather than statistics
    that we take as meaning methods for hypothesis testing and related procedures.
    While machine learning methods can be viewed as a range of advanced statistical
    methods, our concern here is to learn about the language and tools of probability
    theory as means for developing machine learning methods.


    # ## 6.1 Random numbers and their probability (density) function


    The main instrument for describing uncertainty hence the subject of probability
    theory is random numbers and their associated variables. While a regular number
    has only one specific value, a random number will have different values every
    time we "look" at it (a draw from the distributions). For example, let''s think
    about some data that we acquired using a light sensor. We might think that an
    ideal light sensor will give us only one reading holding it to a specific surface.
    However, the characteristics of the electronic circuit might change by changing
    temperatures or fatigue in the sensor, or since we may move the sensor unintentionally
    away from the surface. It is hence likely that we get different readings over
    time. While some people might argue that such causes are mainly unknown (latent)
    factors, it is of no importance to why we have uncertainty but that we have uncertainty.
    Consider image recognition; we have a lighter in the shape of a gpu that the functionality
    of'
