    It is useful to go through some iterations of the SARSA algorithm by hand for
    a linear-maze example. In the example in Fig. 10.4, we changed the situation to
    a linear maze where the state starts at the left-most state and a reward of $r=1$
    is received in the right-most state. The policy is to always go right, which is
    also the optimal policy in this situation. At the first time of the first episode
    we are in the left-most state and the value of going right. In the corresponding
    state to the right there is no reward, and the value function is 0. So the value
    of this state-action is updated to $\gamma$ plus the reward of the next state.
    In the second episode the value of the first and second state remains 0, but the
    third is updated to $\gamma+1$ since the value of the next state following the
    policy is given by 1, and we discount this by $\gamma$. Going through more episodes
    it can be seen that the value "back-propagates" by one step in each episode. Note
    that this back-propagation of the reward is not to be confused with the backpropagation
    algorithm in supervised learning. Also, notice that the values for the $Q$-function
    for going left are not updated as we only followed optimal policy deterministically.
    Some exploration states will eventually update these values, although it might
    take a long time until these values propagate through the system.


