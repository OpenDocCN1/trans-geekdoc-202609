    \  if terminal_state(next.s):\n            s = rho(next.s)\n        else:\n  \
    \          y = gamma+gamma*model.predict(next.s.reshape(1,5), steps=1, verbose=0)\n\
    \            prediction[aidx]=y\n            model.fit(s.reshape(1,5), prediction,\
    \ epochs=1, verbose=0)\n            s = np.copy(next.s)\n```\n\nAfter the exploration\
