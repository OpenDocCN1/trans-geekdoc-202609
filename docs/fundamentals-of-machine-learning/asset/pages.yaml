    # 8.5 Generative neural networks


    # 8.5.1 Generative adversarial network (GAN)


    We have far assumed specific functional forms of generative models to discuss
    generative models in the Bayesian context. We are now going back to deep neural
    networks which are useful to learn more complex models from data when specific
    causal models are not known. There are several approaches to building generative
    models of which we want to mention two, namely generative adversarial networks
    and the variational autoencoders. The basic idea behind generative adversarial'
