  md: "# 10.2.3 Bellman function for optimal policy and value ($Q$) iteration\n\n\
    Since we are primarily interested in the optimal policy, we could try to solve\
    \ the Bellman equation immediately for this policy,\n\n```\n$Q^*(s, a) = \\rho(s,\
    \ a) + \\gamma Q^*(\tau(s, a), \\pi'(\\tau(s, a))). \\quad (10.16)\n```\n\nThe\
    \ problem is that this equation now depends on the unknown $\\pi^*$. However,\
    \ we can check in each state all actions and the one which gives us the best return.\
    \ This should be equivalent to the equation above in the optimal case. Here we\
    \ propose\n\n**Optimal Bellman equation:** $Q^*(s, a) = \\rho(s, a) + \\gamma\
    \ \\max_{a'} Q^*(\\tau(s, a), a'). \\quad (10.17)\n\nWe can solve this equation\
    \ again with the iterative method when the transfer function and the rewards function\
    \ are known,\n\n**Q-iteration:** $Q_{i+1}(s, a) \\leftarrow \\rho(s, a) + \\gamma\
    \ \\max_{a'} Q_i(\\tau(s, a), a'). \\quad (10.18)\n\nThe corresponding code for\
    \ our example is\n\nListing 10.2 RL.ipynyb (Part 12)\n\n```\nprint('--> Q-iteration')\n\
    Q.new = np.zeros([5,2])\nQ.zeros = np.zeros([5,2])\npolicy = np.zeros(5)\nfor\
    \ iter in range(3):\n    for s in range(0,5):\n        for a in range(-1,2):\n\
    \            maxValue = np.max(Q[tau(s,a),0], Q[tau(s,a),1])\n            Q.new[s,Q.id(a)]\
    \ = rho(s,a) + gamma*maxValue\n    Q.copy(Q.new)\n\npolicy = calc_policy(Q)\n\
    print('Q values:\\n' + np.str(transpose(Q))\nprint('policy:\\n' + np.str(transpose(policy)))\n\
    \n--> Q-iteration\nQ values:\n[[0. 0.]\n[0. 0.5 1.]\n[0. 0.5 1. 2. 0.]]\npolicy:\n\
    [-1 1 1]]\n```\n\nIn this example we used only three iterations which are sufficient\
    \ to reach the correct values. In practice, we can terminate the process if the\
    \ changes are sufficiently small, which we did not implement here to keep the\
    \ code short.\n\nThere is an interesting difference between this value iteration\
    \ method and the previous policy iteration. In the policy iteration method we\
    \ followed the policy to calculate the value function. We call such a method **on-policy**.\
    \ In contrast, in the ($Q$) iteration, we check out all possible actions from\
    \ this state for the update of the value function. Such a procedure is **off-policy**."
