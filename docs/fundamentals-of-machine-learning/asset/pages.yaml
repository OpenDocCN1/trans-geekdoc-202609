    ```\nprint('--.analytic_solution_for_optimal_policy')\n# Defining reward vector\
    \ R\ni=0; R=np.zeros(10)\nfor s in range(0,5):\n    for a in range(-1,2,2):\n\
    \        R[i]+=rho(s,a)\n        i += 1\n```"
