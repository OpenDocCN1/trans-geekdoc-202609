- pgno: 225
  md: 'can be very big for large state and action dimensionality. Indeed, the increased
    computational demand of calculating these quantities in many real-world applications
    is often prohibitive, in particular in a stochastic setting where we have to sample
    in the state-action space.


    To illustrate this with a point example, let us think tabular RL if we implement
    learning to play a computer game. Let us discuss the example of Atari 2600 games
    that have been implemented in an arcade environment by Michael Bowling and the
    University of Alberta. This environment simulates video of 210 × 168 RGB video
    at 60Hz. An example of these games is shown in Fig. 10.6. The state of each game
    is equivalent to a state input vector of length 100,800 every 1/60 of a second.
    Even if each pixel is allowed to have, say 8 bits representation, $2^8$ possible
    values, and all the pixels are independent, there are $256^{100800}$ possible
    states. Clearly this is impossible to implement with the tabular methods cited
    earlier. Bellman noticed these practical limitations and coined the phrase “curse
    of dimensionality.” The principle of using function approximators to represent
    the functions, and it comes at no surprise that we will specifically use deep
    neural networks for these function approximations.


    ![](img/2087e3fd78fc2bbc9ee0bfaab66e3bde_225_0.png)


    **Fig. 10.6** Examples of function approximators have been used in the past. Linear
    function approximation (linear regression) is often discussed in engineering books
    as this provides some good baseline and is somewhat tractable analytically. However,
    many real world applications are highly non-linear, and it is the reason we have
    discussed neural networks. Neural networks have been applied to RL for some time.
    A nice example of the success of TD($\lambda$) was mentioned above for playing
    backmon. We will now show how to implement such basic networks for reinforcement
    learning.


    To illustrate the basic idea of using neural networks with RL, we return to maze
    example. The basic form of implementation of the $Q$-function with a neural network
    is to make a neural network that receives a state and an action, and then outputs
    the $Q$-values as shown in Fig. 10.7 with network A. In order to train this network
    with supervised learning we would need examples of the value function, which we
    de course not have. However, we discussed how we can estimate values with temporal
    differences while exploring the trajectories in the environment. For example,
    we can start with an arbitrary $Q$-function, use SARSA to estimate an improved
    version of $Q$, and then use this as a desired state in a mean square loss function.
    That is, we can define the following error (loss function)


    ```

    $E(s_t, a_t) = (r_{t+1} + \gamma Q(s_{t+1}, u_{t+1}; w) - Q(s_t, a_t; w))^2$$

    ```'
