    \ outputs=outputs)\nRMSprop = optimizers.RMSprop(lr=0.01)\nmodel.compile(loss='mse',\
    \ optimizer=RMSprop)\n```\n\nTo train the network we repeat trials where we start\
    \ in state 2 and proceed for maximal 5 times. We include in this example a decay\
    \ of the exploration rate (invT) as modified so that the final estimates are closer\
    \ to the analytical results. From the current state we use the network to predict\
    \ the corresponding Q-value and value one step ahead to calculate the gradient\
    \ ascent as r + Q(next,s). The network is updated right away.\n\n# Listing 10.18\
    \ RL_mlp.ipynb (Part 3)\n\n```\nfor trial in range(400):\n    s = np.array([0,\
    \ 0, 1, 0])\n    for i in range(5):\n        if terminal_state(s): break\n   \
    \     if trial > 30 and invT > 0.1:\n            invT = 0.001\n        prediction=model.predict(s.reshape(1,5),\
