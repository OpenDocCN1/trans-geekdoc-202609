  md: '# 4 Neural networks and Keras


    In this chapter we discuss the basic operation of an artificial neural network
    which is the major paradigm of deep learning. The name derives using an analogy
    to a biological brain. We start this introduction by outlining the basic operations
    of neurons in the brain and how these operations are abstracted by simple neuron
    models. We then build networks of artificial neurons that constitute most of the
    recent success of AI. We will concentrate in this chapter on using such techniques
    and will later come back to discussing their theoretical embedding.


    # 4.1 Neurons and the threshold perceptron


    The brain is composed of specialized cells. These cells include neurons, which
    are thought to be the main information-processing units, and glia, which have
    a variety of supporting roles. A schematic example of a neuron is shown in Fig.
    4.1a. Neurons are specialized in electrical and chemical information processing.
    They have extensions called an axon to send signals, and extensions called dendrites.
    The contact zone between the neurons is called a synapse. A sending neuron is
    often referred to as the presynaptic neuron and the receiving cell is a postsynaptic
    neuron. When an neuron becomes active it sends a spike down the axon where it
    can release chemical neurotransmitters. The neurotransmitters can then bind to
    receptors on the dendrite that triggers the opening of ion channels. Ion channels
    are specialized proteins that form gates in the membrane. When charged ions change
    the voltage (membrane potential) of the neuron. The dendrite and cell body acts
    like a cable and a capacitor that integrates (the sums) of all synapses. When
    the combined voltage at the axon reaches a certain threshold, a spike is generated.
    The spike can then travel down the axon and affect further neurons.


    This outline of the functionality of a neuron is, of course, a major simplification.
    For example, we ignored the description of the specific time opening and closing
    of ion channels and hence some of the more detailed dynamics of activity. Also,
    we ignored the description of the transmission of the electric signals within
    the neuron; this is why such model is called a point-neuron. Despite these simplifications,
    this model captures important aspects of neuron functionality. Such model serves
    for us to build simplified models that demonstrate some of the information-processing
    capabilities of such simplified neuron or a network of simplified neurons. We
    will now describe this model in mathematical terms so that we can simulate such
    neurons with the help of a computer.


    Warren McCulloch and Walter Pitts were the first to propose such a simple model
    of neuron in 1943 which they called the threshold logic unit. It is now'
