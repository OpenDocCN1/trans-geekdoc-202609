- pgno: 9
  md: '# #1 Introduction


    This chapter provides a high-level overview of machine learning, in particular
    of how it is related to building models from data. We start with a basic idea
    in the historical context and phrase the learning problem in a simple mathematical
    term as function approximation as well as in a probabilistic context. In contrast
    to traditional models we can characterize machine learning as nonlinear regression
    in high-dimensional spaces. This chapter seeks to point out how diverse sub-areas
    as deep learning and Bayesian networks fit into the scheme of things and aims
    to motivate the study with some examples of recent progress.


    # ##1.1 The basic idea and history of machine learning


    Machine learning is literally about building machines, often in software, that
    can learn to perform specific tasks. Examples of common tasks for machine learning
    is recognizing objects from digital pictures or predicting the location of a robot
    or a self-driving car from a variety of sensor measurements. These techniques
    have contributed to a new wave of technologies that are commonly associated with
    artificial intelligence (AI). This books is dedicated to introducing the fundamentals
    of this discipline.


    The recent importance of machine learning and its rapid development with new industrial
    applications has been breath taking, and it is beyond the scope of this book to
    anticipate the multitude of developments that will occur. However, the knowledge
    of basic ideas behind machine learning, many of which have been around for some
    time, and their formalization for building probabilistic models to describe data
    are important basic tasks. Machine learning is about modeling data. Describing
    data and uncertainty has been the traditional domain of Bayesian statistics and
    probability theory. In contrast, it seems that many exciting techniques come from
    an area now called deep. The specific contribution of this book is its attempt
    to highlight the relationship between these areas.


    We simply say that we learn from data, but it is useful to realize that data can
    mean several things. Its most fundamental form, data usual consist of measurements
    as intensity of light in a digital camera, the measurement of electric potentials
    in Electroencephalography (EEG), and the recording of stock-market data. However,
    what we need for learning is a teacher who provides us with information about
    what data should predict. Such information can take many different forms. For
    example, we might have a form of data that we call labels, such as the identity
    of objects in a digital photograph. This is the every kind of information we need
    to learn optical object recognition. The teacher provides examples of the desired
    answers that the student (learner) should learn to predict for novel inputs.'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# Introduction


    Learning will always involve optimizing an objective function, and we will see
    that the objective function can easily be formulated with specific examples of
    the desired answers for a learner. This kind of guidance in a learning algorithms
    is traditionally called "supervised learning." At the other extreme, we might
    not have any labels, which has traditionally been called unsupervised learning.
    However, a teacher still needs to provide some guidance in form of an objective,
    such as ordering data with certain rules. An example of this is clustering, where
    a teacher specifies a distance metric like the Euclidean distance between feature
    vectors. We will see that such methods are much more general form of learning
    is a setting where the teacher provides such guidance but the learner, in addition,
    has to explore possible actions to find novel solutions. Learning is formalized
    in reinforcement learning where the objective functions is a slightly more general
    compared to the simpler supervised learning. While we will encounter all these
    different types of learning in this book, most of the fundamentals of learning
    theory and building models can be demonstrated in the simplest setting of supervised
    learning.


    In machine learning, we are trying to solve problems for computers without explicitly
    programming them for specific tasks. We will still need to program the learning
    machine, and we often have to make some adjustments of programs for a specific
    task. However such an approach is more general than coding a specific logic for
    the problem. Programming learning machines instead of specific solutions to a
    problem is desirable for tasks that would be difficult to program in an explicit
    rule-based system. A classic example is that of character recognition, as illustrated
    in Fig. 1; writing a program that can translate a visual representation of a character,
    say let the letter A to the computer-interpretable meaning of this character such
    as representing this letter as the ASCII string 01000001 which is not easy when
