  md: '# Random numbers and their probability (density) function 123


    predicts the fraction of times we get a value $x$ for the random variable $X$
    if we draw many examples of the random variable. Probabilities are sometimes written
    as a percentage, but we will still stick to the fractional notation. It follows
    that the frequency of having any of the possible values is equal to 1, which is
    an important normalization condition for a probability function,


    ```

    $$\sum_{x} P(x) = 1. \quad (6.2)$

    ```


    In the case of continuous random numbers, we have an infinite number of possible
    values $x$ so that the fraction for each number becomes infinitesimally small.
    It is necessary to write the probability distribution function $P(x) = p(x)dx$,
    where $p(x)$ is the probability density function (pdf). Note that we have used
    uppercase and lower-case letters. The sum in Egn 6.2 then becomes an integral,
    and the normalization condition for a continuous random variable is


    ```

    $$\int p(x)dx = 1. \quad (6.3)$

    ```


    A finite probability value makes then only for a certain range of numbers such
    as


    ```

    $$\P(a < x < b) = \int_{x=a}^{b} p(x)dx. \quad (6.4)$

    ```


    We will formulate the rest of this section in terms of continuous random variables.
    The corresponding formula for discrete random variables can easily be deduced
    by replacing the integrals over the pdf with sum over the probability function.
    It is also possible to use the delta-function to write discrete random processes
    in a continuous form. The delta-function delta(x) is a very convenient notation,
    which formally is a functional since it is only defined within an integral or
    the limiting case of a function series. One can think of it as a density function
    which is 0 except for its arguments for which it is infinite,


    ```

    $$\int_{-\infty}^{\infty} \delta(x_1)f(x)dx = f(x_1). \quad (6.5)$

    ```


    The delta function is useful for writing discrete in a continuous form. For example,
    we could write the density function for throwing a dice


    ```

    $$\P(x) = \frac{1}{6} \text{ for } x = \{1, 2, ..., 6\}. \quad (6.6)$

    ```


    as a density function


    ```

    $$\p(x) = \frac{1}{6}\delta(x = x_i) \text{ with } x_i = \{1, 2, ..., 6\}. \quad
    (6.7)$

    ```


    Note that we are here only playing with notations in order to introduce a concise
    language for our purposes.'
