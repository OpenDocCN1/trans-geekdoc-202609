  md: "# 6.4.3 Measuring the difference between distributions\n\nAn practical consideration\
    \ is how to measure the similarity or difference between two density functions,\
    \ say the density function $p$ and the density function $q$. Note that such a\
    \ measure is a matter of definition, similar to distance measures of real numbers\
    \ or functions where we can come up with a variety of definitions. However, there\
    \ are some basic properties that we expect from a distance measure $d(a, b)$ between\
    \ two items, $a$ and $b$. For example, a distance measure should be 0 if the items\
    \ to be compared are same, that is $d(a, a) = 0$. Also, the value should be positive,\
    \ $d(a, b) > 0$ for $a \neq b$, and a distance measure should be symmetric, meaning\
    \ that $d(a, b) = d(b, a)$.\n\nTo measure the difference between distributions\
    \ we could just plot them on top of each other and measure the difference in area.\
    \ However, as we will see later, we can define the information content in form\
    \ of a logarithm of the probability, and the difference of logarithms is equal\
    \ to the logarithm of the quotient. In probability theory, this measure should\
    \ be weighted itself with the probability of the densities. A popular measure\
    \ of similarity between two density functions is hence the-called Kullback-Leibler\
    \ divergence is given by\n\n```\n$d^{KL}(p,q) = \\int p(x) \\log\\frac{p(x)}{q(x)}dx\
    \ - \\int p(x) \\log(q(x))dx. \\quad (6.29)$\n```\n\nThis measure is 0 if $p=q$\
    \ and always larger than 0 if $p \\neq q$. However, this measure is not symmetric\
    \ and is called a divergence instead of distance. A KL is related to the information\
    \ gain or relative entropy in information theory.\n\n# 6.5 Density functions of\
    \ multiple random variables\n\nSo far, we have discussed mainly probability (density)\
    \ functions of single random variables. As mentioned earlier, we use random variables\
    \ to describe such data as sensor readings in robots, of which there are many.\
    \ Thus, in many applications we consider multiple random variables. The quantities\
    \ described by the random variables might be independent, but in many cases they\
    \ are also related. Indeed, we will later about how to describe various types\
    \ of relations. Thus, in order discuss situations with multiple random variables,\
    \ multivariate statistics, it is useful to know the basic rules.\n\n# 6.5.1 Basic\
    \ definitions\n\nStochastic machine learning models usually contain many random\
    \ variables In the following we introduce the multivariate concepts for two variables,\
    \ although these concepts readily generalize to an arbitrary number of variables.\
    \ We start with some essential definitions. The total knowledge about the co-occurrence\
    \ of specific values for two random variables $X$ and $Y$ is captured by\n\n```\n\
    joint distribution: $p(x,y) = p(X=x, Y=y). \\quad (6.31)$\n```"
