    (CNN). (C) A basic recurrent neural network (RNN). (D) A gated recurrent neural
    network (gRNN) with explicit memory.


    In this we are no longer restricted in building networks for a finite sequence
    with the tagged delay line approach. Compared to separate weights for inputs at
    different times, we introduced a form of weight sharing in the sense that the
    relative times of the sequence is important. This assumption is similar to the
    position invariance assumption in convolutional networks, and building in this
    assumption in our architecture will reduce parameters.


    The assumption of a diminishing influence from previous time steps has the form
    of an exponential decay, which is not always appropriate. For example in natural
    language processing it is common that a given word has relations to other distant
    words. We can overcome this problem with explicit memory, as illustrated in Fig.
    9.3D. We will shortly explore how we can implement such memory in neural networks,
    for example with gated networks.


    To finalize this simplest form of a recurrent network, we include a non-linearity
    in the layer. For example, the equations for a recurrent layer with a tanh(x)
    activation function is,


    ```

    h(t) = tanh(w(x(t), h(t-1))) \qquad$ (9.7)

    ```


    We have thereby a concatenation notation in the second, {x, h} for the vectors
    x and h, and we have also concatenated the weights v and u into the network w.


