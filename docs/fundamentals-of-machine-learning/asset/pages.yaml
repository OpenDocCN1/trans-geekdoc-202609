    \ state.\n\n+   **Listing 10.16** RL_mlp.py (Part 1)\n\n```\nimport numpy as np\n\
    import matplotlib.pyplot as plt\nfrom keras models, layers, optimizers\n\ndef\
    \ tau(s,a):\n    if s[0] and s[4] == 0 : s:=np.roll(s,a)\n    return s\n\ndef\
    \ rho(s):\n    return ((s[0]==1)+2+(s[4]==1))\n\ndef terminal_state(s):\n    return\
    \ (s[0]==1 or s[4]==1)\n\ngamma=0.5\ninvT = 1\n```\n\nThe variable invT represents\
    \ the inverse temperature for the exploration. It is very high at the beginning,\
