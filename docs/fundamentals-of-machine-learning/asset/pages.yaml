    would minimize a measure of dependency such as the Kullback-Leibler divergence.
    We will talk about statistical measures in more detail later. While this type
    of ICA does not directly reduce the dimension of the problem, having a feature
    space spanned by independent features helps to investigate meaningful subspaces.
    A generalization of these ideas is captured in non-negative matrix factorization.


    Another popular method for dimensionality reduction and a common technique to
    visualize high-dimensional data in 2-dimensional spaces is a technique called
    t-distributed stochastic neighbor embedding (t-SNE). This technique seeks to minimize
    distance between the statistical measures of points in the high-dimensional feature
    space with the distance of their low-dimensional representation. Such techniques
    are implemented in sklearn. The code below shows the application of PCA and t-SNE
    for the iris dataset. The scatter plot in Fig. 3.6 demonstrate that the iris Setosa
    flowers are easily distinguishable from the other two classes, but there are a
    few examples of overlap between iris Versicolor and iris Virginica. These techniques
