  md: '# Generative models


    following an example from Andrew Ng of making a spam filter that classifies email
    messages as either spam ($y=1$) or non-spam ($y = 0$). To do this, we first need
    a method to represent the problem in a suitable way. We choose here to represent
    a text (in this situation) as a **vocabulary** vector. A vocabulary is simply
    the list of all possible words that we consider. A text can be represented by
    a vector with entries 1 if the word can be found in the text or an entry 0 if
    not, for:


    ```

    $x = \begin{aligned} 0 & a \ 0 & aardv \ 0 & aardwolf \ . & . \ . & . \ 1 & buy
    \ 0 & zygmury \end{aligned} \quad (8.32)$

    ```


    We are here only considering values 0 and 1 instead of, for example, counting
    how often the corresponding word appears. The latter is usually a "bag of words".
    The difference of our simplified example to a bag of words is that each entry
    is a binomial random variable instead of a multinomial in the bag of words. We
    chose the simpler case for illustration purposes, although methods generally direct
    to the other case. In any case, this is a lossy representation where we lose the
    positions of the words in the text which might be considered essential in text
    comprehension. Natural language processing has reached much progress with models
    such as recurrent neural networks that we will discuss in Chapter 9, for the basic
    task discussed in the following turns out that Bayes yield fairly good results.
    An interesting part of this example is that we are now considering a very high-dimensional
    feature vector.


    Let us consider that our vocabulary has 50,000 word, which is a typical size of
    common languages though most language have more words. We want to build a discriminative
    model from some training examples. That, we want to model


    ```

    $p(x|y) = p(x_1, x_2, \dots, x_{50000}|y). \quad (8.33)$

    ```


    This is a high-dimensional density function which has $2^{250,000} - 1$ parameters
    (the $-1$ comes from the normalization condition). We can factorize this density
    function with chain rule


    ```

    $p(x_1, x_2, \dots, x_{50000}|y) = p(x_1|y)p(x_2|y, x_1)\dots p(x_{50000}|y, x_1,
    \dots, x_{49999}). \quad (8.34)$

    ```


    While the right-hand side has only 50,000 factors, there are still $2^{250,000}
    - 1$ parameters we have to learn. We make a strong assumption, namely that all
    the words are conditionally independent in each task; that is:


    ```

    $p(x_1|y)p(x_2|y, x_1)\dots p(x_{50000}|y, x_1, \dots, x_{49999}) = p(x_1|y)p(x_2|y)\dots
    p(x_{50000}|y). \quad (8.35)$

    ```


    This is conditional independence, giving class $y$, $p(x_1, x_2|y) = p(x_1|y)p(x_2|y)$,
    which is different from independence like $p(x_1, x_2) = p(x_1)p(x_2)$. The conditional'
