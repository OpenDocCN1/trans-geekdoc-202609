  md: '# 4.4.2 CNN and MNIST


    The idea of designing position-invariant feature detectors in neural networks
    was first described by Fukushima in 1980. Back then, Fukushima worked for NHK,
    the Japanese public broadcaster, together with physiologists, as NHK was interested
    to understand the mechanisms of human vision. It was well known since the early
    1960s from experiments by Hubel and Wiesel showing some neurons in the primary
    visual cortex, the first stage of visual processing in the cortex, are edge detectors,
    and that such features must be combined in a way that object recognition becomes
    invariant to the location in space.


    Edge detectors are the workhorse of traditional computer vision, and we discussed
    in Chapter 2 how such filters are implemented with convolutions. The neural networks
    that we discussed then had to learn individual weights for each pixel location.
    Even if this network could represent an edge detector, separate detectors have
    to be learned for each image since edges can appear in all locations. Another
    way of thinking about convolution is that a neuron (specific filter) is applied
    to every possible location in the image. This leads us to the idea of weight sharing
    and convolutional neural networks (CNNs).


    To the discussion of this network type with Keras we go back to the MNIST benchmark
    example. The basic idea of a convolutional network is to replace the dense connections
    of regular networks, that are implemented with a matrix multiplication h = wx,
    with that of a convolution h = w * x. Thus, the network looks a like the one shown
    in Fig. 4.4. While a convolutional network has far fewer parameters than a dense
    network, implementing the convolution and running efficiently on a computer is
    challenging. It is therefore that we need to use graphics processing units (GPUs).
    GPUs are special purpose processors that are designed for efficient matrix operations,
    and these processors have been very helpful in deep learning. In particular, NVIDIA
    has added specific support for deep learning operations, and it is such lower-level
    support that we rely in the following. While there are specific frameworks that
    directly support the programming with GPUs, such as TensorFlow or Theano, we choose
    here to apply Keras that itself utilizing backends like TensorFlow and Theano,
    as well as other support on GPUs, to implement the operations we need in deep
    learning. Here, as long as your programming environment is implemented to take
    advantage of GPUs, we can ignore the details and work on a higher level with system
    architectures. If you do not have a GPU then I recommend running the MNIST examples
    on a smaller trainer.


    The Keras program to apply a CNN to the MNIST data is shown in the following.
    The program starts by linking the required libraries and reading the data as we
    did earlier for the dense network (MLP). The only difference is that we reshape
    the input data into a 1-dimensional feature vector for each example. Actually,
    instead of a 2-dimensional array, the data is already in the form of 28 × 28 for
    each sample, since Keras expects the number of channels we still have to reshape
    it into the form 28 × 28 × 1.'
