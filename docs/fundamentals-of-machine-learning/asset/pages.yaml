  md: '# The impact of machine learning technology on society | 241


    ![](img/2087e3fd78fc2bbc9ee0bfaab66e3bde_243_0.png)


    **Fig. 11.3** Some author with a prototype of a weeding robot developed by Nexus
    Robotics.


    operations.

    Machine learning is advancing rapidly. There are areas that use learned models
    to extrapolate to predict domains that have not been covered by the training examples.
    Such uses of machine learning can be viewed as providing "artificial creativity".
    The results of such applications of machine learning can inspire, as demonstrated
    by some interesting applications of machine learning to art.


    Preventing misguided use of machine learning and AI, as with any other technology,
    is a strong responsibility placed on our society. It is clear and widely accepted
    that we must devote time as a society to reflect on the path we wish to take.
    In order to do so, we need education in this area, and possibly legislation and
    technology that can prevent some misuse. However, I believe that the greatest
    challenge comes from the changes in our economies and society brought forth by
    increased automation. Labor that has dominated wealth creation in the pre-industrial
    and industrial age will be replaced by automation where labor is replaced by energy.
    The challenge we face as a society is how to distribute created wealth within
    the society. Such shifts in our society are unavoidable, and it is up to us and
    our chosen societal structure as to how to use technology for the common good.
    These are issues that go far machine learning in itself.'
