  md: '# Representational learning | 75


    Sparse representations lead to considerable compressions such as being able to
    represent a continuous signal with only two numbers in our example. Sparse compression
    can be an important factor in machines to gain "semantic knowledge" of the world.
    For example, there are many instillations of objects such as cars, but my ability
    to characterize them with one word is equivalent to semantic knowledge and a form
    of sparse representation.


    # 4.3.2 De-no autoencoders and semantic compression


    If compressed (or sparse) representations are so useful, can we force such representations
    in our neural networks? Are there different techniques that will induce some compressed
    representations, including an architecture called an autoencoder outlined here
    as well regularization methods discussed earlier.


    A simple example of an autoencoder is shown in Fig. 4.7. In this network we start
    with an input layer that is connected to a smaller hidden layer and then to an
    output layer that is the same size as the input layer. The reason for choosing
    an output layer that has the same size as the input layer is that we want to build
    a mapping function that maps inputs to the same output. This is an example of
    unsupervised and self-supervised learning, as we do not require labels for this
    learning task, just raw data such as pictures.


    ![](img/2087e3fd78fc2bbc9ee0bfaab66e3bde_81_0.png)


