  md: '# Introduction


    This formula describes how we make a parameterized hypothesis in which we specify
    a function $f$ that depends on parameters $w$ to approximate the desired input-output
    relation. This function is called a **model**:


    > A model is an approximation of a system to study specific aspects of the system
    and to predict behavior


    This means that not all of the underlying world has to be captured in depth. For
    example, a building engineer might make a model of a bridge to its static without
    including the aesthetic aspects that an architect might emphasize in a model.
    In our context the model is synonymous with approximation. We have indicated in
    the formula that this model is an approximation of the desired relation using
    a hat symbol above $y$ and $f$. However, we frequently drop the hat when the relation
    is clear from the context. Also, in the context of machine learning, a typically
    includes parameters so that their presence in the notation is synonymous with
    a model.


    Coming with the right approximation function is the **hard problem in machine
    learning**, and we will later discuss several choices. There are methods to develop
    the approximation function from the data systematically, generally called non-parametric
    methods. At this point we assume that we have a parameterized approximation.


    We specify the set of parameters as $w$ before a semi-colon in the function arguments.
    A more appropriate mathematical statement would be that equation 1.2 defines a
    set of functions in the parameter space. **Learning** is the challenge of finding
    the values for these parameters that best describe the data, and even better,
    predicting outputs $y$ from inputs $x$. So, the parameters are estimated from
    data $w = (x, y)$. Searching for these parameters is done with a learning algorithm.
    A common way of realizing such a learning algorithm is to define a function that
    describes the goal of learning, such as minimizing the number of wrong classifications.
    We call this function the **loss function** $\mathcal{L}$, although other terms
    are sometimes used in the literature such as objective function, error function,
    or risk. A common algorithm to minimize such a loss for a set of data is to use
    an algorithm called **gradient descent**, which is an iterative method over the
    training data that changes the parameters along the negative gradient $

    abla_w \mathcal{L}$ of the loss function,


    ```

    $w_i = w_i - \alpha\nabla_w\mathcal{L} \quad (1.3)$

    ```


    where $\alpha$ is called the learning rate and


    ![](img/2087e3fd78fc2bbc9ee0bfaab66e3bde_14_0.png)


    The Nabla operator which signifies the gradient. This is a typical learning algorithm
    to find the parameters of a model based on example data. We elaborate on this
    algorithm later.


    While the gradient descent can find parameters to minimize the loss of the training
    data, our real goal is to find the values of $w$ that best predict data that have
    not been'
