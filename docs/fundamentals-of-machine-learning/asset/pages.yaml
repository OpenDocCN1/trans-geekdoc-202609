- pgno: 15
  md: '# Mathematical formulation of the basic learning problem | 7


    seen before. Just describing the training data acts somewhat more like a memory,
    but being able to generalize is the main goal of machine learning. A good solution
    of the machine (model) learning problem is represented by a point in the parameter
    space that approximates the true underlying world. However, since we usually don''t
    know the true underlying world, we estimate how good this model is by evaluating
    how good new predictions are.


    In some applications of supervised learning we want to predict a continuous output
    variable. For example, we might want to predict the price of a house from some
    size information. This is called regression. In contrast, sometimes we want to
    predict discrete values such as the categories of object in a picture. This is
    called classification. The output variable y in classification is called a label.
    It is now common to generally refer to the output of the supervised learning as
    label, even in the case of regression where we have a continuous "label". We will
    later that regression and classification are closely related; binary classification
    can be seen as a regression problems with a discrete function f(x) such as a function
    which would give us two labels, positive and negative.


    An important part of our treatment learning is to consider cases with uncertainty.
    For example, we might not be able to predict an exact label or value, and we would
    be best-served if we consider the probability that a certain value will occur.
    This is for several reasons. For example, it is common that the process includes
    random (stochastic) factors or hidden (latent) factors that create variations
    in results even for the same sensory status. Thus, we pose that the true underlying
    model we seek to describe is better described by a probability density function


    ```

    p(Y = y|x).

    ```


    This function gives the probability density, or probability mass in the case of
    categorical data, of the label Y having a value y given that we have an input
    vector x. The arguments of density functions are provided after the vertical bar,
    and we write random variables as upper-case letters and we specific values with
    lower-case letters.


    Formulating machine learning in a probabilistic (stochastic) context has been
    most useful and provides us with the formulation that carries many insights. In
    the probabilistic framework we are then modeling a density function


    ```

    p(Y = y|x; w).

    ```


    Density function approximation is in some sense a special case of function approximation
    as the density is still a function, albeit with constraints such as a normalization
    fp(y)dy = 1. However, modeling density functions is also the general case for
    modeling functions in the sense that they provide the probabilistic information
    of how likely label values are given a certain input.


    A probabilistic framework can be used for a more general formulation of learning.
    Given a parameterized model as written in equation 1,6, we want to know for all
    possible parameters how likely they are to describe the data well. This is not
    necessarily a single solution, and ideally we would like to know the probability
    density function of the parameters by the data,


    ```

    p(w|y, x).

    ```'
  merge: -1
