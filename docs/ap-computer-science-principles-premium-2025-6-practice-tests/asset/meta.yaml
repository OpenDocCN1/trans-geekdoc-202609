  - 18 **(A), (C)** 如果目标不在列表中，计数器将保持为零，这是正确的值。如果目标在列表中但在列表末尾，计数器将增加到 1。然而，列表的下一次迭代会将计数器重置为零。如果目标位于列表的最后一个位置，没有下一次迭代来将值重置为零。要使此程序适用于所有测试用例运行，请删除
    `ELSE` 语句。
- - '##'
  - 19 **(C)** 在使用二分查找之前，必须合并并对列表进行排序。(A) 是错误的，因为列表已经是排序的。然而，在合并列表时，结果列表将不是排序的。(B)
    是错误的，因为结果列表没有排序。对于未排序的列表可以使用线性查找。
- - '##'
  - 20 **(A), (C)** 为了让机器人向前移动，“If”语句必须在 1% 的时间内执行为真。(A) 是正确的，因为 100 个中的 1 个是 1%。(B)
    是错误的，因为从 0 到 100 共有 101 个数字，101 个中的 1 个不是 1%。(C) 是正确的，因为 `<2 等于 1 个数字，100 个数字中的
    1 个是 1%。(D) 是错误的，因为 `≤2` 是 2 个数字，100 个中的 2 个是 2%。
