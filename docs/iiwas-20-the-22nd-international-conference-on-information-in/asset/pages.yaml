    # 2 RELATED WORKS


    # 3 METHODOLOGY


    There has been a lot of researches in the MA and the prediction process. Most
    of them focus on use of the MAS approach in the design phase. For example, [10],
    proposed a new ensemble-based MAS called “EMAS” to predict of problems in data
    mining. It uses the MAS to increase prediction accuracy and decrease complexity
    of the prediction. EMAS architecture have a four-layer of MAS architecture. The
    first layer is cleaning and normalizing data. The second layer is data prepossessing.
    The third layer is building prediction model. Fourth layer is knowledge discovery,
    prediction and data display. Their proposed system predicts problems in data mining
    based on previous data, as it checks the data and predicts problems in it, meaning
    that it does not predict any failure before it occurs. They also work on a set
    of structured data sets (tables). Our proposed system is distinguished from this
    system in that it detects early failure alarms before they occur, and that it
    operates on unstructured data (log file). Another example of framework based on
    MAS, is framework to improve energy demand prediction accuracy has been proposed
    by [23]. An intelligent hybrid agent and a MAS hierarchical infrastructure of
    energy supply and demand prediction are introduced in this framework. The Intelligent
    Hybrid Agents consists of Deliberative Agent for realizing static prediction,
    Reflex Agent for dynamic prediction, Decision-making Module is for static


    Recent trends in distributed intelligent systems have relied heavily on agent-based
    approaches or the so-called MAS, as they have demonstrated their ability to manage
    sensitive data on behalf of producers and users, as they have the ability to interact
    with each other and make decisions. So, we find that transparency between agents
    is a crucial feature that must be achieved, so we need more reliable interactions
    than ever before, to achieve this we used BCT in MAS. In this section we explain
    the MAS and the benefit of using it first. And then the BCT and the utility of
