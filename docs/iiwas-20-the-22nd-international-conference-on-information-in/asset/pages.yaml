    # 5 CONCLUSION


    This paper presents prediction approach, an approach for automatically analysis
    of execution traces and detects early warning signals for system failure prediction
    during executing using a MAS and BCT-based approach. The proposed prediction approach
    uses event sequences to predict failure before it happened. The proposed prediction
    approach is constructed using a four-layer MAS architecture. First is data prepossessing
    layer, second is data classification layer, third layer is building a failure
    model and finally, prediction layer. Our approach, validated on real data, it
    addresses a major need for administrators of these large systems, predict anomalies
    before it occurs accurate 100%. For a future work, we plan to monitor execution
    traces to determine the cause of the anomaly and solve it.


