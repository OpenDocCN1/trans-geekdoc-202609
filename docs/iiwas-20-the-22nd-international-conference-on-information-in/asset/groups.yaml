    协同解决复杂问题，但由于其固有的学习能力和自主决策能力，它们提供了更大的灵活性。由于 MAS 的突出特性，包括其分布式特性、效率、灵活性、可靠性和低成本，使其成为解决复杂任务的有效解决方案。MAS
    被应用于不同的敏感领域，如电子健康 [12]、物流 [9]、制造 [16]、电子商务 [17] 等。它被用于降低这些领域的运营成本并执行自动功能，因为代理的特殊特性如智能、独立性、学习能力，以及
    MAS 的特性如独立性、其分布式特性和灵活性，使其成为解决复杂问题最常见的系统之一。但该系统的主要问题是代理之间的协调 [1]。尽管为开发确保 MAS 中安全通信和协调的模型和机制付出了许多显著努力，但尚未找到满足所有要求的可行解决方案。


    ## 3.2 Blockchain technology


    BCT 是记录网络中用户之间发生的交易的网络账本。其优势在于作为分布式数据库，BCT 上的每个用户都可以从任何地方访问整个数据库及其完整历史。它也是一种新型的点对点分发技术，意味着通信直接在用户之间进行，无需第三方传递消息。该技术允许构建可信、负责且透明的应用程序，这些应用程序使用密码学基础（如哈希功能、数字签名和加密）进行保护。该网络上的每个用户都有自己的数字签名。BCT
    正受到各行各业的关注：从医疗保健 [7]、金融 [6]、其他行业 [8]。这种兴趣增加的原因是：BCT 使它们能够以去中心化的方式运行，无需验证系统，并以相同的可靠性实现相同的功能。BCT
    是一种用于创建具有数据保护机制的点对点去中心化网络的新技术，该技术具有在节点之间共享和跟踪数据的能力 [2]。根据上述内容，我们发现 BCT 是规范代理之间协调的关键。在本文中，我们提出了使用
    BCT 的预测过程的 MAS 方法。本文提出了一种改进预测的新方法。所提出的方法涉及 MAS 与 BCT 的集成，以检测系统故障预测的早期预警信号，并在其发生之前进行检测，这种集成使所提出的系统能够在任何复杂环境中运行。


    ## 3.3 Architecture of our prediction approach


    预测方法是通过使用四层 MAS 架构构建的，每层都有自己的职责和流程。所有这些类相互合作，以实现在系统发生故障之前预测故障的总体目标。图 1 显示了所提出的架构。接下来，我们将详细讨论每一层。第一层称为数据预处理层（DPL）。该层中代理的目标是日志键提取，并分析、转换和重新组织数据，以便应用机器学习对数据进行分类。因为我们系统的主要输入是日志文件，这是一个非结构化文件。由于该文件体积庞大，管理员很难了解和理解其主要结构，因此我们通过提取日志键（消息的主要结构）来减小其大小，帮助这些管理员发现和理解该文件的主要结构。这样他们在未来就可以找到出现的故障的解决方案。由于该文件的性质，它包含大量对我们系统可能不重要的信息，因此我们使用第一步中提取的日志键来分析和重新组织文件。该层的最终输出是组，每个组包含一系列日志键，这些日志键已被替换为数值数据，以供第二层使用。第二层称为数据分类层（DCL）在该层中，代理使用基于规则的分类器，这使其成为专家代理
    [22]。基于规则的分类器比其他分类算法更好，其表达能力强如决策树，易于解释，易于生成，并且新状态可以快速分类。主要优点是规则可以通过两种方式创建，第一：直接方法：直接从数据中提取规则，例如
    RIPPER [25]、CN2、Holte''s IR [20]，第二：间接方法：从其他分类模型（如决策树、神经网络等）中提取规则。该层的最终输出是按故障类型分类的组。第三层称为构建异常模型（BAM）。该层的代理使用有限状态自动机来模拟每个异常的执行行为。我们采用
    FSA [14]，尽管还有一些其他替代模型，例如 Petri-Net [15]，因为它既有效又简单。该层的最终输出是所有类型故障的模型，用于第四层的预测。第四层称为预测层（PL）。该层的代理是智能代理，它们从模型中学习并收集信息。然后它们使用决策树算法在故障发生之前预测任何故障。如果这些代理中的任何一个检测到故障的任何迹象，该代理将把有关该故障的所有详细信息写入
    BCT。


    我们使用分层架构的主要目标是简化预测过程并提高工作速度，因为每一层都有其特殊角色和自己的代理。该层中的所有代理共同合作，以快速高效地实现总体目标。


    ### 3.3.1 Analysis and design of methodology.


    设计程序的第一步是确定目标。这种方法可以导致一个目标列表，这些目标作为目标和子目标的树相互关联。为了实现程序的主要目标，必须执行该方法。在我们的研究中，MAS
    与 BCT 集成的<|message|>...主要目标是检测执行期间系统故障预测的早期预警信号。而各层的子目标是第一层是数据准备，第二层是对这些数据进行分类，第三层是从这些数据构建模型，第四层是基于上一步的模式进行预测。一旦我们确定了系统的目标和子目标，我们就进入第二步，即角色。角色是基于预定义目标创建的，以便阐明系统的详细功能
    [19]。定义角色对于修改系统非常有帮助，因为每个系统都包含一组与主要系统功能直接相关的角色。在明确定义系统角色后，我们进入第三步，即通过对角色进行分组来定义系统的代理。角色根据其相似性进行分组并合并到一个代理中。此外，系统中存在数据流，决定数据如何在角色之间流动。


    ### 3.3.2 Agents description.


    在我们提出的方法中，多个代理协同工作以实现系统的总体目标，每个代理都有特定的职责。本节旨在描述每个代理工作的步骤，解释这些步骤背后的逻辑，并定义每个代理的输入和输出。


    **Agent layer1: Data preprocessing.** 大数据集通常是大量组织良好的行和列。相反，日志文件是非结构化的，因为它们以文本和非结构化数据集的形式出现，这就是为什么尽管它们包含有价值的信息，但开发人员仍未使用它们来分析事件的原因。因此，我们开发了一个自主智能代理来执行此过程，它将非结构化文件转换为易于使用和理解的结构化文件。此外，这一步是机器学习过程中最重要的一步之一，因为机器学习过程无法处理非结构化数据。输入：我们使用研究输入的是与
    Hadoop 分布式文件系统（HDFS）执行跟踪链接的原始事件日志的一部分。我们假设执行跟踪（日志文件）中的每一行显示一个事件（或特征），我们还假设一系列事件与特定故障相关联。输出：预处理数据的目标是创建有序数据集以供第二层机器学习算法使用。该数据集是原始事件日志的副本，已以特定方式格式化，适合用于机器学习算法。该层中的代理通过以下五个步骤生成结构化记录：

    - 日志键提取

    - 解析

    - 转换

    - 分组

    - 归一化


    **Agent layer 2: Data classification,** 通常，数据存储在目标文件中。在文件系统中，文件被分成一个或多个部分并存储在单独的数据节点中。这些文件段称为块。换句话说，HDFS
    可以读取或写入的数据称为块。每个块在存储过程中会经历某些阶段或步骤，所有这些步骤都记录在 HDFS 执行跟踪中。查看每个块的事件序列时，我们可以知道该块是否正常存储。通过对先前研究
    [29] 的研究，我们能够确定块中发生的故障类型，他们在决策树中进行了说明。在本层中，我们开发了一个专家代理，可以从决策树中推导出规则并用于分类。输入：该代理的输入是第一层代理的输出，即组。每个组包含特定块的事件。输出：它们是根据故障类型分类的组。该层中的代理根据特定规则将组分类为组，通过两个步骤：

    - 从决策树中提取规则

    - 基于规则的分类


    **Agent layer 3: Building a failure model,** 构建故障模型。本层的输入是上一步分类的组。根据前述内容，我们发现每个组都被分配给特定故障，每个组包含块组。每个块组包含一组按记录顺序排列的事件。如果我们发现每个故障都有许多案例，换句话说，我们发现每个故障都没有单一的事件序列。因此，我们使用
    FSA 来模拟每个故障的所有案例并显示导致该故障的内部组件之间的所有交互。从中我们将拥有一个显示所有故障序列的单一模型。我们可以利用它在故障发生之前预测该故障。还开发了一个自主智能代理来自动化这些步骤。输入：该代理的输入是第二层代理的输出，即根据故障类型分类的组。代理使用它来构建故障模型。输出：它们是将在第
    4 层中用于在故障发生前预测故障的故障模型。在本层中，代理使用 FSA 从分类组中构建故障模型。FSA 由有限数量的状态和状态之间的转换组成。组中的每个事件都是一个转换。代理使用
    [18] 提出的算法通过块中的事件序列学习系统每个故障的 FSA。


    **Agents layer 4: Prediction,** 在本层使用一组代理的目标是使每个代理搜索与其他代理不同的特定问题。这将减少时间和精力。当代理检测到故障的早期预警信号时，它会写入
    BCT，以便其他代理和管理员在故障发生前同时获知，这就是本层使用 BCT 的原因，因为它提供了代理之间的透明度、信任和通信，以及代理与管理员之间的同步。本层使用的所有代理都是智能代理，因为它们能够从模型中学习、发现信息并做出针对故障的决策。输入：这些代理的输入来自执行跟踪的单行。输出：当任何代理检测到故障的早期预警信号时，它会写入
    BCT，因此这里的输出是携带预测信息的新的块。这些代理在检测早期预警信号时相互合作，通过四个步骤：

    - 数据预处理

    - 知识发现

    - 预测

    - 写入 BCT


    ## 4 RESULTS AND INTERPRETATION


    我们进行了实验以验证所提出方法的有效性。在此实验中，我们展示了可以自动发现 HDFS 中异常行为的许多早期预警信号。通过在 203 个 EC2 节点上设置
    Hadoop 集群并运行 Hadoop map-reduce 函数样本 48 小时，生成并处理了超过 200 TB 的随机数据。从 HDFS 收集了超过 2400
    万行记录 [29]。对 HDFS 记录应用数据预处理后，共处理了 11,197,954 条消息（约占所有消息的 50%）。我们发现有 88 个日志键对应 31
    种事件类型。此外，还有 575,139 个块 ID。有关此数据集的更多信息可在 [29] 中找到。所有工作均由 VS Code 版本 1.44 软件完成，使用配备
    2.5 GHz Intel Core i5 CPU 和 8 GB 内存的 MacBook Pro。我们选择报告标准性能指标：精确率、召回率和 F 分数来评估我们的结果。精确率、F
    分数和召回率也在 [6] 中的基准性能评估中使用。在我们的研究中，对超过两个类别进行分类，因此精确率计算为所有类别中真正例的总和除以所有类别中真正例和假正例的总和，召回率计算为所有类别中真正例的总和除以所有类别中真正例和假负例的总和

