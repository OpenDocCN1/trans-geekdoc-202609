    # 1 INTRODUCTION


    With recent developments in computing, we have witnessed a rapid increase in levels
    of reliance on computing technology for a variety types of daily use software,
    as it has become dependent on a series of heterogeneous computing systems. For
    example, banking systems, health systems, transportation systems, etc. Therefore,
    we must work to keep these systems working and reduce their downtime because it
    is very important and has many effects on the functions of society. There are
    many examples that have shown the effects of computing failure. For example, in
    2012, 6 million customers of the Royal Bank of Scotland Group in the United Kingdom
    and Ireland found they had no access to their accounts for weeks [5]. Also, in
    March 2008, 140,000 people were affected by a computing failure in the baggage
    system at Heathrow Airport and the cost of the failure was estimated at 32 million
    dollars [5]. Hence, this highlights the need to ensure continuity of the system.
    Each system has its own database containing the history of the different operations
    performed at each moment. These data are called logs. logs are a rich source of
    useful information that helps developers debug or monitor app errors to ensure
    system dependability. In general, logs are unstructured text generated by logging
    statements in system source code. Looking at relevant researches on log analysis,
    we find that it focused on three distinct management problems; (i) Forensic analysis,
    which aims to identify the root cause of system failure after an occurrence [13,
    30]. (ii) Fault detection, which aims to quickly detect signs of system failure
    when they occur [29]. (iii) System failure prediction, which aims to provide early
    warning of a system failure before it occurs [28, 31]. One of the challenges of
    log-based failure prediction is the number of features required or the length
    of time period required to make the prediction [28, 31]. For example, we find
    that current research [28] uses nearly 400 features extracted from system logs.
    While [31] he uses a certain period of time to make prediction. Another challenge
    is that it can identify the failure, but it cannot determine its exact type before
    it occurs. To overcome these challenges, we are developing a Multi-Agents'
