    ## 表 1：精确率、召回率和 F 测量的结果


    | 数据集 | 精确率 | 召回率 | F 测度 |

    |---|---|---|---|

    | HDFS | 0.998 | 0.990 | 0.9939 |


    对所有类别而言。此外，我们手动将故障消息定义为正例，非故障消息定义为负例，我们有：


    Precision = sum(TruePositives) / sum(TruePositives + FalsePositives) (1)


    Recall = sum(TruePositives) / sum(TruePositives + FalseNegatives) (2)


    F-Measure = (2 * Precision * Recall) / (Precision + Recall) (3)


    表 1 展示了将我们的方法应用于 HDFS 数据集时精确率、召回率和 F 测量的结果，从表中可以清楚地看出，我们的方法能够在故障发生前以高精度检测到故障的早期预警。此外，它还具有速度快的特点，我们对来自
    HDFS 数据集的 11,197,954 条消息进行了检验，并在 10 分钟内显示出 [29] 中记录的所有错误。我们没有找到在同一数据集上预测故障在发生前的研究。


    ## 5 结论


    本文提出了一种预测方法，即一种用于自动分析执行轨迹并在执行期间使用基于 MAS 和 BCT 的方法检测系统故障预测的早期预警信号的方法。所提出的预测方法使用事件序列来预测故障发生前的情况。所提出的预测方法采用四层
    MAS 架构构建。第一层是数据预处理层，第二层是数据分类层，第三层是构建故障模型，最后是预测层。我们的方法在真实数据上得到验证，它解决了这些大型系统管理员的重大需求，即在发生前以
    100% 的准确率预测异常。对于未来的工作，我们计划监控执行轨迹以确定异常的原因并解决它。


