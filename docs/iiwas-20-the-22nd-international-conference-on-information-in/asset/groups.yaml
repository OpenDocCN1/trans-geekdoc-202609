    ## 基于区块链的用于从系统日志预测异常的新型多智能体系统


    Arwa Binlashram*

    arwa.alashram@yahoo.com

    吉达大学

    吉达，沙特阿拉伯


    Hajer Bouricha

    马努巴大学

    突尼斯

    hajer.bouricha@ensi-uma.tn


    Lobna HSAIRI

    吉达大学，突尼斯埃尔马纳尔大学

    沙特阿拉伯，突尼斯


    Haneen AL Ahmadi

    吉达大学

    吉达，沙特阿拉伯


    ## ABSTRACT


    应用程序生成的执行跟踪包含开发人员认为在调试或监控应用程序时有用的信息，它包含应用程序状态和在各种关键点的重要事件，有助于他们深入了解故障并在发生前识别和预测潜在问题。尽管这些跟踪在几乎所有计算机系统中普遍存在，但由于它们不易被机器解析，因此很少被利用。在本文中，我们提出了一种使用区块链技术进行预测过程的多智能体方法，该方法允许自动分析执行跟踪并在执行期间检测系统故障预测的早期预警信号。所提出的预测方法采用四层多智能体系统架构构建。所提出的预测方法的性能基于数据预处理和用于预测的监督学习算法。区块链用于协调智能体之间的协作，并同步智能体与管理员之间的预测。我们通过将其应用于现实世界的分布式系统来验证我们的方法，在这些系统中，我们以高精度预测了问题在发生之前。在本文中，我们将重点关注我们预测方法的架构。


    ## CCS CONCEPTS


    • 计算方法学 → 多智能体系统；机器学习；• 计算机系统组织 → 点对点架构。


    ## KEYWORDS


    区块链技术，多智能体系统，预测，执行跟踪，智能体，机器学习


    ## ACM Reference Format:


    Arwa Binlashram, Hajer Bouricha, Lobna HSAIRI, and Haneen AL Ahmadi. 2020. 基于区块链的用于从系统日志预测异常的新型多智能体系统。载于第22届信息集成与基于Web的应用程序服务国际会议（iiWAS
    ’20），2020年11月30日至12月2日，泰国清迈。ACM，纽约，NY，美国，5页。https://doi.org/10.1145/3428757.3429149


    ## 1 INTRODUCTION


    随着计算技术的最新发展，我们见证了对各种日常使用软件的计算技术依赖程度的快速增长，因为它已依赖于一系列异构计算系统。例如，银行系统、健康系统、交通系统等。因此，我们必须努力保持这些系统运行并减少停机时间，因为这非常重要，并对社会功能产生许多影响。有许多例子表明了计算故障的影响。例如，2012年，英国和爱尔兰苏格兰皇家银行集团的600万客户发现自己数周无法访问其账户[5]。此外，2008年3月，希思罗机场行李系统的计算故障影响了14万人，故障成本估计为3200万美元[5]。因此，这凸显了确保系统连续性的必要性。每个系统都有自己的数据库，包含在每个时刻执行的不同操作的记录。这些数据称为日志。日志是丰富且有用的信息来源，有助于开发人员调试或监控应用错误以确保系统可靠性。通常，日志是由系统源代码中的日志语句生成的非结构化文本。观察日志分析的相关研究，我们发现其关注三个不同的管理问题；(i)取证分析，旨在在发生后识别系统故障的根本原因[13,
    30]。(ii)故障检测，旨在在发生时快速检测系统故障的迹象[29]。(iii)系统故障预测，旨在在故障发生前提供早期预警[28, 31]。基于日志的故障预测的挑战之一是进行预测所需的功能数量或所需的时间段长度[28,
    31]。例如，我们发现当前研究[28]使用了从系统日志中提取的近400个特征。而[31]使用一定的时间段来进行预测。另一个挑战是它可以识别故障，但不能在发生前确定其确切类型。为克服这些挑战，我们正在开发一种使用区块链技术（BCT）的多智能体（MAS）预测方法。所提出的方法涉及将MAS和BCT集成以在执行期间检测系统故障预测的早期预警信号。我们的方法首先通过将相同的日志消息分组来从执行跟踪中提取日志键，并用日志键替换原始日志消息的所有自由文本，从而大幅减少数据量。其次，我们将第一步的输出发送到基于规则的分类算法以对数据进行分类。第三，我们使用有限状态自动机（FSA）来模拟每个问题的执行行为。最后，我们使用决策树算法进行预测。我们工作的主要贡献可概括如下：(1)我们开发了一种通用的日志分析全自动方法，涉及MAS和BCT的集成，以在故障发生前检测系统故障预测的早期预警信号。它按行分析日志，不需要一系列行（特征）来进行预测，而这通常与基于日志的分析相关联。(2)我们设计并实现了自动化日志分析，能够大规模、准确、快速、高效地分析日志数据。(3)我们设计了基于监督学习算法（基于规则的分类、决策树算法）的预测系统，能够优于大多数现有系统。(4)我们使用真实数据集（Hadoop分布式文件系统）评估了我们的方法，并通过标准性能指标、精确率、召回率和F分数验证了其有效性。我们还证明了我们的系统可以在故障发生前识别故障的确切类型，并在此之前向管理员提供有关故障的详细报告。本文其余部分组织如下。第2节展示相关工作。第3节讨论方法论的主要思想。第4节讨论实验结果。结论在第5节给出。


