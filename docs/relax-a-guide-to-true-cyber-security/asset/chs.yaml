  # 序言


  感谢加入这段疯狂的旅程，我希望你会发现它既有趣又有启发性。我写这本书是因为我发现许多网络安全书籍都侧重于让你感到糟糕、受害，并觉得世界是一个黑暗而危险的地方。我想要这样一本书，证明即使是我们这些网络安全人士也会犯错（这是事实！），而且如果我们能从中恢复，那么你也可以！


  这本书是我一生努力帮助人们放松并享受生活的成果，即使是在陷入网络安全麻烦时。是的，坏事不可避免地会发生在我们身上，但这并不意味着我们必须向绝望屈。我会分享我犯过的一些错误，以及别人的例子，以及我们如何共同应对现代世界的网络危险。


  如果我的工作成功了，你将能够深吸气并**放松**，给自己留出时间，在应对网络威胁时更有深度、更具战略性。这个过程不仅会让整体压力减小，而且当问题发生时，会让你变得更快乐、更成功。


  通过《放松》，我的目标是帮助你更加关注网络安全，并在响应网络威胁之前花时间停下来思考——而不是仅仅做出反应（是的，这之间是有区别的）。如果说我从支持这段旅程的许多朋友和家人那里学到的一点，那就是：恐慌会导致糟糕的决定和糟糕的结果。


  你还将更多地了解我试图遵循的生活核心哲学（我是在飞机上学到的！）。这种哲学是：始终先给自己戴好氧气面罩。如果你不照顾好自己并先满足自己的需求，你就无法帮助他人满足他们的需求。网络安全也是如此。在尝试处理任何袭你的网络威胁或攻击之前，你需要先调整好心态。先戴好你的氧气面罩，然后你……





  你是否遇到过有人试图用网络攻击的所有“邪恶”来恐吓你？


  “*他们会夺走你的数据。*”


  “*他们会摧毁你的公司。*”


  “*他们会毁掉你的生活。*”


  虽然黑客确实会做可怕的事情，但生活在持续的恐惧中并不是解决问题的方法。我写 `RELAX` 的原因是因为，当你陷入恐慌时，它会让你做出 `react`（反应）而不是
  `act`（行动）。


  黑客利用这种“战斗或逃跑”的心态让你要么付钱他们，要么让你的重要信息暴露。在某种程度上，网络安全公司也在做同样的事情。业内众周知，保持高度的恐惧感可以引导人们花费更多钱。为了你的钱包和心理健康，你需要学会放松，并理解保护你的公司和生活所需要的项目。


  网络安全是小企业一切的对立面：当我们寻找简单明了的东西时，它是令人困惑的；当我们有这么多其他事情要处理时，它本应是不必要的；当每样事情都需要我们的钱时，它是昂贵的；当我们希望某件事进展顺利时，它却显得很错误。


  作为一名小企业主，我理解我们为什么会有这种感觉。网络安全是因为不得不花钱的结果，因为坏人就是无法不坏——凭什么*我们*要为此买单呢？


  在这本书中，我希望让你获取必要的知识和信息，学习如何达到那个并非神话的“网络安全涅槃”，并变得有趣。通过分享许多好故事，我希望帮助你的企业对当今世界发生的事情以及未来发生的事情做好更好的准备。


  我知道有些人害怕到无所措，而另一些人则认为自己是安全的，因为事情从未发生过他们身上。我希望让你处于这两个极端之间的*中间*位置：一个既让你保持网络安全，又能重新享受生活的地方。


  所以，跟我一起享受这段穿过网络安全世界的有趣而刺激的旅程吧——带有一丝疯狂和一点危险！


  我总是喜欢从分享*我的*故事开始。我那时还是个婴儿……好吧，可能没那么*久远*。让我们重试一次……我的职业生涯始于全球最大的石油公司之一的开发人员。在那些日子里，我大部分时间都在编写代码，将数百万美元从一家银行转到另一家银行。当时，我告诉自己我在“忙于改变世界”，但诚实地说，我做的是最*无聊*的工作。


  从那个“兴奋”的地方（在此处插入讽刺），我转到了一份更兴奋的工作，编写将库存从一个地方移动到另一个地方的程序。在那份工作中，我学到了关于灾难恢复的第一个课。


  我 22 岁时还是个年轻人，就成功地（且无意地）摧毁了美国最大的卡车和旅行中心之一的全部库存记录。是的，你听得没错：*他们的。全部。库存。记录。*更疯狂的是，我竟然在被录用的第一周就犯了如此巨大的错误！


  那是一次心惊胆魄的经历，我确定自己永远无法从中恢复。我当时坐在这里，距离他们允许我担任这份理想的工作才过了七天，我就输入了一个 `delete` 命令，瞬间带走了
  500 万美元的库存。直到今天，我仍然记得那个绿色的光标盯着我，仿佛在笑。*闪烁，闪烁，闪烁。*我坐在那里几乎几乎瘫痪，希望看到文件名回来，但什么都没有发生。


  我的大脑开始飞运转。我确定在这次巨大的错误之后，我无法在任何地方找到工作了！谁会雇佣一个刚刚毁了公司全部库存记录的程序员呢？我确定我注定再无法无法了……除非当个擦鞋童。我连毛巾都用得不好！


  带着巨大的愧疚和紧紧夹在腿间的尾巴，我站起来，缓慢地走向网络管理员的办公室。走过那条走廊就像是行军，我等待着我预知即将到来的责罚。


  “*收拾你的东西离开这里！你再也无法工作了！*”这是我预料在那扇门后面听到的回答。


  进入 Ken 的办公室（是的，他的名字也叫 Ken），我低头看着地面，开始了我那沮丧的坦白。


  “*Ken，我想被解雇了，*”我分享。


  他从技术手册上抬起头说：“*你在说什么呢，Ken？*”


  “*我摧毁了整个库存系统。我可以去收拾东西了。我只是想确保你知道。*我确定在几分钟后，所有人都会知道我摧毁了公司。


  然后他说了：“*你被解雇了，Ken。*”在停顿后，他笑了。“*不，你没解雇。你只是犯了一个错误；我们针对这种场合准备了备份。我会在小时内把它们全部找回来。*”


  我的心脏加速。我得了！从那天起，我对备份产生了极大的喜爱。我几乎摧毁了整个公司，但因为这些被称为备份的魔法东西，我被救了！


  从那时起，我开始了保护重要事旅程。我可能没有始终遵循那条道路，但请随我，我将分享许多公司在面对日益增长的网络世界时所经历的许多坏事——以及许多好事。


  # 第 2 章

  ## 风险业务


  考虑到你的业务未来，你是否被问过这个问题：“*如果你被公车撞了怎么办？*”这是一种非常形象的表达方式，说明我们需要考虑面临的风险。我们使用这种生动的意象是因为它们能震慑我们认真对待事情。我总是喜欢在发现新客户时问一个“*为什么*？”这个问题的答案界定了后续所有关于什么是重要的，以及企业需要做什么的对话。我发现很多公司还没有进行过“*为什么*”的对话。很多时候，这种发生是因为这很难，或者必须处理的“日常火灾”淹没了了这一至关重要的过程。





  电脑真的是我们的朋友。听我慢慢道：就像我们的很多朋友一样，它们可能既自私又烦人，导致我们去做一些从未想过会做的事，并让我们花费大量的钱（你知道你指的是谁！）。你可能熟悉这句话：“要明智地选择朋友。”这句话同样适用于你的电脑。


  小企业如何明智地选择他们的朋友（即电脑）呢？在网络行业，这是通过进行我们所谓的`风险评估`来实现的。让我明确一下，这*并不*意味着你需要进行一个庞大的、正式的风险流程，让每个人都参与，耗费数月时间并投入大量资金。不要误会我的意思，那些流程对于获得全公司的认同是有好处的，并且可以帮助大公司了解他们的“初衷”，但对于像我们这样的小企业来说，这可以是一个非正式且轻松的过程。在某些方面，它甚至是一种宣泄，并帮助你看到公司面临的潜在危险。


  到这里，你可能在想风险评估是如何带你找到“初衷”的。让我带你回顾我曾为一个客户执行的风险评估。


  我当时正在与一家制造客户合作，并请了他们的总裁来进行基础的风险评估。我们从一些标准的风险点开始：“哪些文件是重要的？哪些驱动器驱动着你的生产线？你们是如何接收订单的？”这让我们了基础情况：哪些文件是重要的，以及如果不保护它们将导致每天损失数千美元——但我们并没有停于此。相反，我开始问更深层次的问题。将一切换算成金是有用的，但你所做这些事情背后总有更深层的原因。


  在完成基础问题后，我问总裁为什么要创立这家公司。他回答：“我一直想做出最好的小部件”（我把他的产品名称改成了“保护无辜者”）。


  然后我问他：“如果你无法生产你的‘奇妙小部件’，你会感觉如何？”他停顿了一下，思考了这个问题。


  慢慢地，他说：“我从没想过那个。我只是认为我会一直在制造奇妙小部件。我喜欢制造它们，所以如果那样我会很不开心。”


  我回答道：“记得我们谈过的关于客户文件、库存管理、发货记录的威胁吗？如果你丢失了它们，还能继续生产你的奇妙小部件吗？”


  他深深地看向房间另一头，回答道：“我不知道自己是否还能继续工作。这是一个非常有趣的问题。我只是从未想过会有什么能让我停产。”


  这就是你在执行风险评估时，想要带领团队达到的“灵光一现”。关键在于找到事物之所以重要的原因，并看看它们是否按照应该的方式得到了保护。


  在事后，我曾和很多公司开过很多会议，他们都对我说同样的话：“我没有意识到那个文件或设备对我的业务有多重要。”


  有很多优秀的风险框架你可以可以使用。我一直喜欢来自`SEI`的`OCTAVE Allegro`，但有数百种供选择。然而，如果你不想那么正式，就从这里开始：


  召集你的核心团队，问问他们认为什么是重要的以及为什么，列出所有项目并审查他们说的话。之后，问问自己这个简单的问题：“如果我丢失了这些信息，我该如何恢复？”如果你发现答案是“我不知道”，那么你绝对需要重新考虑你的恢复计划。


  任何风险评估的目的是：


  1. 定义你的公司面临的风险

  2. 确定减少或减轻这些风险的方法

  3. 设计行动计划以应对已定义的风险并实施上述方法


  记住：很多时候，如果你不知道存在问题，或者没有积极寻找问题，它们通常会在最糟糕的时候出现（很讽刺，对吧？），并带来最糟糕的结果。因此，为了避免这种灾难，你最好每年至少花时间对公司进行一次风险评估。


  # 第 3 章：如果没坏，就别修它


  ![](img/image-03.jpg)


  你听过多少次“如果没坏，就别修它”？这种运营方式对很多公司是有意义的——至少在“很久以前”是这样。回首过去，曾几何段时间，你父亲买一台压力机或其他设备，它们可以代代传下去。事实上，我的很多客户在使用来自
  20 世纪 70 年代和 80 年代的设备！


  一段时间内，这是一个很棒的计划：企业能够支付硬件费用并一直代代代使用。但像大多数事情一样，它也带来了一个大问题：*那么*老旧的设备很难保持更新或正常运行。


  例如，我们在 2012 年有一个客户使用运行在 90 年代 `Windows NT` 上的账单系统。这家公司所有的业务都通过这台电脑进行计费。硬件无法更换，他们不再拥有安装盘，而且大多数人甚至不知道如何运行
  `Windows NT`。升级系统的成本是巨大的。


  我的下一个例子更糟。我当时是一家制药公司的年轻网络管理员，他们正在使用一台旧的 `IBM System 36` 计算机。对于那些年纪大到记得的人来说，这被称为`大型机`。这台电脑保存了跟踪
  `FDA` 售出每种药物的所有记录。丢失这些信息很容易导致公司倒闭。


  这台 `System 36` 已经使用了近 20 年，在此期间从未更新过。当我接手这个职位时，我被告知：“为什么要换？它一直很可靠。”我发现的解决方案将花费 400
  万美元实施，并需要大约三个月来部署。高层认为更换这个“可靠的系统”没有任何意义，因为在此时，对他们来说是免费的。


  感到非常沮丧，我竭尽全力让那个系统尽可能运行得久一点。我知道，和我们所有人一样，它终将会死去。命运使然，系统在一年中最糟糕的一天坏了，就在年度结账之前。我记得那个周五早上走进公司，会计人员跑进来问我
  System 36 怎么了。在一段心碎的时刻后，我冲进那个放着这个怪物的巨大阴暗房间，它就在那里：`System Fault`（系统故障）闪烁着，用它愤怒的光芒嘲笑我。


  我走长长路去 CEO 的办公室告诉他这个消息。`System 36` 死了，它再也不会回来了。


  真正的痛苦那时开始的。因为丢失了系统，我们必须在恐慌中花时间尽快恢复。那是无数个长夜，伴随着数百万美元的额外成本。我之前提出的那个 400 万美元的项目，最终在崩溃后花费了公司超过
  4500 万美元。整个“如果没坏，就别修它”的思维差点毁了这家公司。


  我发现，许多公司面临的惯性是推动公司提高网络安全方面最难克服的问题之一。要让大家忘记“为什么要改变？我们一直都是这么做的”，才是增加公司及其文化安全性的最大挑战。





  随着全球范围内网络安全合规要求和标准的不断提高，你会发现过时的设备将不再被允许使用——而且这很有道理！例如，如果你想与美国联邦政府合作，他们要求必须移除或隔离旧设备。最终，公司会发现，维护这些设备的成本将高于它们所带来的价值。


  　随着黑客发起攻击的方式变得越来越有创意，务必记住，你不能等攻击发生后才去处理它。


  让我再分享一个*不要*等待升级的理由。我们曾一直与一家大公司合作，他们使用旧的模拟线路来连接其远程站点——每月的维护费用就高达 35,000 美元。最糟糕的部分是，`AT&T`
  只有**一个**人知道如何实施或维护这些线路，因为这些线路几乎在*十五年前*就*停产*了。


  有一天，在等待其中一条线路的支持时，客户接到了来自 `AT&T` 的电话。那位唯一知道如何运行这些线路的工程师刚刚因心脏病发作去世了。那一刻，我们开始手忙脚乱地尽快为该公司更换这些线路。对他们来说，这不是一次愉快的经历，但是一次宝贵的教训。


  持续的升级是昂贵的，我们大家都想继续使用我们已有的东西。这是一笔我们不想支付的成本，但我敦促你记住我之前分享的那个制药公司的例子。他们不想花 400 万美元进行必要的升级，结果在系统完全崩溃后，他们不得不支付了
  4500 万美元。正如俗话所说，“*防患于未胜于治疗*。”


  # 第 4 章


  ## 关键词是什么？


  ![](img/chapter-4.jpg)


  密码！密码！到处都是密码！我实在想不出别的了！超过 8 个字符、大写字母、小写、数字、特殊字符……啊！在生活中我们*真的*需要多少密码？我们有银行账户、`Netflix`、`HBO
  Max` 和 `Disney Plus` 的密码。还有在线服务、手机服务、`Uber`、外卖、品牌忠诚度账户……天知道还有些什么！我在所有客户之间有超过 5,000
  个不同的密码需要记忆（疯狂，对吧？），所以我想要一个密码来统治一切——这是合理的——当然，每个网络安全专家都会告诉你，这是一个*非常*糟糕的主意。


  尝试记住你每天使用的几十个（甚至数百个）密码既不符合功能性也不切实际。更糟糕的是，许多网站具有自动登录功能，允许你保存（然后忘记）密码，这样你就不需要每天输入它们。


  记住，密码是你的第一道防线。虽然一方面它们能保护你的大部分信息安全，但另一方面，密码实在太多了，现实中无法全部记住。我记得我在制药行业工作时，我们有一项政策要求我们每
  90 天更改一次密码。更糟糕的是，你不能在新密码中使用上旧密码的任何部分。


  这在理论上是一个很棒的主意，但在实践中其实非常糟糕。你发现，许多网站具有自动登录功能，允许你保存（然后忘记）密码，这样你就不需要每天输入它们。


  记住，密码是你的第一道防线。虽然一方面它们能保护你的大部分信息安全，但另一方面，密码实在太多了，现实中无法全部记住。我记得我在制药行业工作时，我们有一项政策要求我们每
  90 天更改一次密码。更糟糕的是，你不能在新密码中使用旧密码的任何部分。




  在密码的旅程中还有最后一件事需要记住：你密码管理系统的主密码就是你的“金票”。这个主密码是开启并解锁你所有其他密码访问权限的密钥。换句话说，主密码“打开了城堡的大门”。你可不想贪婪的野蛮人（黑客）来撞倒这些大门，并掠夺和破坏你辛辛苦苦来的这一切，对吧？


  如果因为你没有重视密码的复杂性，导致黑客破解了你的主密码，那么他们也将获得你所有其他密码的访问权限。这个主密码必须是复杂的并且需要保护。我个人而言，我会把主密码写下来，存放在锁好的保险箱或安全箱里。


  你可能在想：“*但是肯，你是一个技术和网络安全专家，你为什么要这么做？*”问得好！答案是：如果你把密码保存在电脑里，你就需要将其保存在加密文件中以确保安全。那个加密文件需要一个密码，而你又需要把这个密码放在安全的地方。你发现这里的趋势了吗？你把加密文件的密码放在哪里——另一个文件里？到目前为止，没有什么比妥善存放的纸张更安全的了。所以，将一个主密码写在纸上并安全存储（例如放在保险箱里），是提高你网络安全的一有力一步……只需保持这一个即可。


  同样重要的是记住，密码只是*第一*道防线，而不是*最后*一道防线。在下一章中，我将讨论多因素身份验证（MFA），作为增强你网络安全的额外分层。


  # 第 5 章


  #不要恐惧因子


  ![](img/chapter-5.jpg)


  我们都试图忘记高中数学课上那些像“因子”（factors）之类的概念。那是一段黑暗的，人们会向你抛出像 `f(x)` 类的奇怪符号，并说诸如“分解那个函数”之类的复杂的短语，或者更糟的，“分解那个多项式”。这完全毫无意义，而且无疑是困惑的。你可能会想问：“*如果我在数学课上都不喜欢做单因子分解，我为什么要去做多因素身份验证呢？*”


  让我先说，这*不是*你高中接触的那个因子。多因素身份验证，或者极客口中说的 MFA，是防止他人访问你重要文件或账户的另一种方法。我承认，它可能很烦人，但它是一个非常有效的工具。


  当你听到多因素身份验证时，他们说的是在访问账户之前，通过两种或两种不同的方式来确认你的身份。多因素身份验证的一个例子是输入你的密码，并输入系统通过短信发送到你手机上的代码。你们许多人现在登录银行账户时可能已经熟悉这个过程了。


  通过这种方式，你既有密码，又有发送到你手机的短信代码——这是黑客无法获取的……除非他们也偷走了你的手机。他们不仅需要破解你的账户密码，还必须偷走手机，而现在的许多手机都有生物识别（面部或指纹识别）或数字（锁屏密码）屏幕锁。所以，你可以看到这让其他人访问你的账户变得困难了多少。





  如果 Lucy 在账户上开启了多重身份验证（MFA），黑客就无法在没有第二种验证方式（发送到她手机的代码）的情况下访问她的账户。这意味着攻击根本不会发生；邮件永远不会发送出去，我们也不需要给数百名客户打电话告知他们遭受了攻击。


  现在你可能在想如何激活 MFA。这取决于应用程序及其部署方式，但大多数情况下，你可以在 Bing 或 Google 上找到操作指南。例如，你只需在搜索栏中输入“setup
  Facebook MFA”，即可获得如何在你的账户上启用 MFA 的逐步说明。如果你正尝试启用连接银行或其他金融机构的 MFA，我建议直接联系他们并寻求帮助。


  我还想提到这一点：如果你有银行、金融机构或其他金融组织，而他们 `do not` 支持 MFA/2FA……快跑！飞快地离开他们！


  我曾与一家非营利组织合作，他们的财务信息在网络攻击中被盗。当被问及为什么公司不使用 MFA 时，他们的回答是：“我们觉得没必要。”结果在损失 `$45,000`
  之后，这家非营利组织后悔莫及了！


  我强烈建议对你 `all` 的银行账户、业务邮箱、文件存储区域以及任何你认为重要的地方使用 MFA。记住在你的社交媒体账户上使用 MFA 同样重要。你不希望某天醒来发现有人在你的账户上发布了希特勒、斯大林或小野玲子的照片，对吧？你认为你的声誉还能恢复吗？黑客在你的社交媒体账户上发布破坏性的照片、链接或其他物品，你公司的声誉可能会遭受更大的损害。


  MFA 为你提供了额外的安全防护层，能让你晚上睡得更安稳。不要害怕这个因素，相反要接受它。


  # 第 6 章


  ## 电子邮件，为什么总是电子邮件？


  ![](img/image-06indy-1.jpg)


  在某个时候，你可能会问自己：“为什么我的公司总是盯着我的邮件不放？”嗯，这有充分的理由。钓鱼攻击（因试图像钓鱼一样“钓”你而得名）几乎 97% 的公司都有报告，而且几乎
  20% 的人会点击钓鱼邮件。正如你所见，这是一个 `massive` 的问题，可能会伤害我们所有人。


  我要告诉你们一个大多数网络安全专家永远不会分享的故事。大多数网络安全专家喜欢营造一种我们是完美的、从不被黑客攻击的幻象，但我将分享一个我受于我所警告人们要避免的那种攻击的故事。


  有一天，我收到一封来自“Target”的邮件，说我获得了一张 `$5` 的礼卡。我太兴奋了，直接点击了链接并等待我的美妙奖励。我本应该按照常例检查该链接是否真的来自
  Target。我本应该扫描该链接以查看它是否带了恶意软件。我本应该做很多事情，但我没有做。相反，我让我对获得免费物品的兴奋冲垮了我正常的防护和安全措施。


  你可以想象当我发现一个弹窗时心情有多糟糕。我的第一反应是 `de-excitement`，因为我被锁在外面了。这是勒索软件导致的。


  所以，如果你发现自己陷入了，该怎么办？这里有一些步骤：


  - **第一件事永远是放松自己**：如果你在恐慌中做事，就会出错。数到 10，让自己冷静下来。一旦你进入了更放松的状态，就可以继续了。

  - **确保你的防病毒/反恶意软件/反垃圾邮件软件是最新版本**：如果你已经很久没给防病毒软件付费了，是时候咬牙坚持续费了。另外，确保你已经更新了防病毒软件。我无法统计我们有多少次在接待新客户时，发现他们没有更新邮箱设置。当邮箱被黑客攻击时，黑客通常会设置一个“转发规则”，将所有回复都发送到你的垃圾箱。每个邮件系统存储规则的位置都各不相同，所以对于这一项你可能需要寻求帮助。

  - **要求你的提供商恢复任何丢失的信息**：许多提供商都有备份并可以恢复你的邮件。如果你在公司工作，请询问那个房间里的人，或者给你的支持公司打电话。如果是个人账户，你可能需要上网寻找一个支持联系方式。

  - **登录你的账户并更改密码**：如果黑客更改了你的密码，请联系你的邮箱管理员。在公司里，这很可能是躲在那个房间里的电脑技术人员。如果是个人账户，去网站即可。

  - **联系你的客户和联系人**：这是最困难的一步。你需要联系你的每一个联系人并告知他们你被黑了。






  在处理电子邮件攻击时，始终采取迅速行动、不要恐慌，并尽可能减少可能造成的损害至关重要。你行动得越快，黑客伤害你、你的客户、公司或朋友留出的时间就越少。


  # 第 7 章


  ## 门外的蛮人


  ![](img/image-07-3.jpg)


  作为一个对历史感兴趣的人，我经常在想，当日耳曼部落不断向南冲锋并攻入他们的城市时，罗马人会有什么样的感受。他们正常生活与掠夺者族群之间唯一的障碍就是他们的城门。现在，让我们思考罗马城门与距离这里
  32 公里的卡普佩纳（Capena）城门之间的区别。罗马是一个拥有许多强大且有防御能力大门的巨型城市，而卡佩纳只有一个大门可以用来抵御敌人。卡佩纳的大门今天依然屹立，是一个令人惊叹的奇观。


  作为小企业，我们每天都面临着同样的问题：成群的网络攻击者威胁向南入侵，蹂毁我们美丽的土地——我的意思是，计算机……并掠夺我们宝贵的信息。我们甚至可能会觉得，只有大型公司和企业才能建立最好的防御来保护自己免受攻击者。


  大型公司*确实*能够花费巨资来尝试防御自己，实施最的技术，并让整个部门专注于网络安全。然而，同样重要的是，即使是像 Target、Facebook、Adobe、Capital
  One、AT&T、BP 和 Apple 这样的公司，也都经历过网络安全泄露和攻击。金融机构也无法幸。我不确定你是否能在任何地方找到一家银行或其他金融机构没有面对过至少一次网络攻击。


  得知如此，你可能会想：“如果他们都不能保护自己的公司免受网络攻击，我该怎么做来保护我的公司呢？？”我想让你花点时间思考一下大门的用途。大门允许好人或理想的人进入，并将将坏人或不受欢迎的人挡在外面。它是如何把坏人挡在外的？很简单：它封挡了他们的入口。如果你关上大门，唯一的通过方法就是将其撞倒，这需要花费大量的精力和时间。大门也会把好人挡在外面。你如何让好人重新进来？你需要打开大门。


  黑客知道这一点。如果你打开大门，进去就不再费什么精力了（与试图闯入关闭的大门相比）。这就是为什么黑客使用电子邮件和恶意网页链接来获取你的网络访问权限。为了访问网页和其他云端站点，你必须所谓的“打开大门”。虽然只持续一会，但如果你向错误的人打开大门，他们就可以进入并从内部开始攻击。


  这就是你的大门（我们在极客术语中称为 `firewall`）发挥作用的地方。只要没有人打开大门，大多数现代防火墙都能有效地将不受欢迎的东西挡在外面。我们不断使用互联网处理一切，喜欢进出我们的小“村庄”。每当我们与外界建立连接时，我们就在小村庄和我们要访问的网站之间创建了一条路。如果那个网站是良好且安全的，我们就安全并快乐地获得我们需要的东西。如果那个网站糟糕或不安全，那么我们就是在为潜在的军队打开大门。


  现在，如果你有一个守卫看着每个经过大门的人呢？我们在电影中经常看到：守卫走到马车前，要求每个人出证件以确保他们应该进入村庄。这些守卫站岗在那里，帮助检测是否有“不受欢迎的人”试图跟随你回到村子里。在我们的大门上拥有这些守卫很重要，但同样重要的是记住，每当你打开大门时，坏人都会尝试进入。


  我们有一位客户，他们的“安全村庄”内有一台位于良好防火墙后的服务器。问题是，他们从村庄外部（即他们的办公室）访问这台服务器。在与我们合作之前，他们一直从村庄外直接连接到服务器，这意味着大门一直是开启的。当我们开始与他们合作时，我们告诉他们需要为该服务器创建一个受保护的路径，这样当他们在村庄外时就能受到保护。


  这种受保护路径被称为 `VPN`（虚拟专用网络），它保持共享信息的隐藏状态，使得只有你和你正在交流的计算机可以读取它。


  该客户以前从未经历过泄露，因此他们采取的策略是他们的村庄非常小，没有人会尝试攻击他们。他们告诉我们：“为什么会有人盯着我的小公司呢？”这是我们在许多小企业那里听得过多的陈述。


  现在我的工作是向他们证明，规模小并不能保护他们免受门外的蛮人。我提取了所有通过大门（他们的防火墙）的活动日志，仅仅在*一周内*，他们的服务器就遭受了 356,002
  次攻击！黑客正使用暴力破解攻击试图获取服务器的访问权限。


  为了让他们真正明白这一点，我向他们展示了 104,321 次攻击来自俄罗斯，38,342 次来自中国。真正让他们大开眼界的是，25,342 次攻击来自美国内部。正如你所见，攻击来自四面，无论是国内还是国外。这帮助他们理解他们并不是小到不会被攻击，同时也加强了确保自己受到保护的重要性。


  那么，企业应该怎么做？作为一个小企业，你需要建立分层防御。这种分层防御从防火墙开始，即村庄的大门。你会希望确保购买并使用支持 `IDS` 服务的防火墙，通常以年度订阅的形式。同样重要的是要确保部署它的公司知道如何配置和设置你的防火墙。


  # 第 8 章


  ## 备份伙伴


  ![](img/image-08-2.jpg)


  你还记得当你小时候参加郊游时，老师告诉你要找一个伙伴结对吗？你还记得为什么被要求这样做吗？因为这是确保你们安全且人数可追溯的简单方法。让两个人结对并互相照顾，要比让孩子们独自在每个方向乱跑要安全得多。备份也是同样的道理；你总是希望确保有一个“备份伙伴”。这是一个你存储数据的安全的地方，这样当你遭受网络攻击或计算机被盗或丢失时，就可以恢复它们。






  让我分享一个故事，它向你证明备份的力量。我们的一位客户是一家大型非营利组织，他们大部分的赠金申请编写和募资工作都在六月份进行。正如你可能想到的，这意味着募资时间对于他们年度成功以及全年剩余时间的持续运营至关重要。对于任何了解非营利组织募资的人来说，你知道那是一个*非常*压力巨大的时期。


  巧的是，六月的第一周我也在市外参加一个网络安全会议。会议的第一天结束了，我正回到酒店房间。那是充满演讲和讨论的兴奋的一天，我充满了对公司将在未来几个月内审查的所有优秀网络安全产品和服务的的新知识。


  当我安顿下来时，已经接近午夜。突然，我的手机响了。我以为是妻子打来说晚安，于是接了电话。我很庆幸自己没有说“嗨，亲爱的”，因为来电的不是我妻子，而是那家非营利组织的管理员！


  他的声音里充满了忧虑，问我是否还醒着。“怎么了？”我问道，心想他不会在周六这么晚给我打电话只是为了问问我过得怎么样。我必须承认，听到他的声音时，我的心沉了一下，因为我不知道出了什么问题，而且我离那里有
  800 英里。


  “我们丢失了数据库服务器，所有的募资报告都在那台服务器上！”他的声音短促而恐慌。“我尝试了所有方法，但无法让它重新启动。”


  我告诉我不在克利夫兰（他所在地），但我会远程接入看看能做什么。我知道他遇到麻烦了，因为他们有一支大约 20 人的团队正在通宵工作，以确保这些报告和赠金按时提交。如果他们无法在截止日期前提交这些内容，意味着他们必须在年底之前进行裁员。这不是我们任何人都想考虑的想法。


  坐在酒店房间的办公桌前，我考虑了我的选择。显然，由于硬件故障我无法访问服务器，所以这个选项被排除了。我必须寻找替代方案。幸运的是，我最近实施了混合云备份。这是一种极客的说法，意思是我在他们的办公室里有一套备份系统，可以在云端创建副本。


  我迅速登录我们的门户，激活了`Virtual Server Recovery`（虚拟服务器恢复）功能。这创建了一个数据库服务器的虚拟副本，直到我回到城里，他们都可以使用它。整个过程从接电话到恢复大约花费了
  20 分钟。在下线之前，我要求管理员确认一切都已恢复并正常运行。他的声音中透出巨大的如松口气，他说：“是的，我们已经恢复运行了。非常感谢你的帮助——这真的救了我们！”


  当我在本周晚些时候回到城里时，我过去修理了他们坏掉的服务器。通过我实施的`Virtual Server Recovery`，他们能够继续进行募资和赠金申请，确保了他们全年所需的所有赠金和资金。大家都赞扬管理员维持了业务运转，他感谢我在他最需要我的时候出现了。这一切都归功于我的“备份伙伴”的力量。


  ## 如何选择备份伙伴？


  让我在这方面给你一些指导。


  在选择备份伙伴时，你想要确定你保护的是*什么*。如果你只需要保护文件，例如照片或 Word 文档，有很多在线服务可供。例如，如果你有 `Amazon Prime`
  账户，就可以对照片进行无限备份。


  如果你有使用的关键应用程序，那么你将希望寻找更主动的备份解决方案。一个数据既在云端又在办公室设备上的混合备份可能是必要的。这种混合备份的一个优势是，如果由于某种原因网络中断，你仍然在获取系统备份，只是没有复制到云端。


  在选择备份时，这里是你想要寻找的几点：


  1. 备份是加密的，这意味着它经过设置和保护，只有你才能读取它，无论是在备份过程中（有时称为“传输中”），还是在静态 `at rest` 状态下。

  2. 备份具有防勒索软件的能力。

  3. 留存期多久？

  4. 可以启动虚拟恢复吗？

  5. 可以进行裸机恢复吗？






  你是否考虑到了每一种情况？你的清单有多长？你认为你能够对所有可能发生错误的情况进行 100% 准确的评估吗？这就是我每次编写代码时本被要求做的事情！我必须尝试猜测代码可能需要执行的所有操作，以便我针对这些操作进行编程。只能说，我并不总是能成功。


  在某一次特定的情况下，我被分配审查一段之前的程序员编写的代码。当我审阅这些代码时，我发现了一些问题。这段代码用于每周将资金从总银行账户转入工资发放银行账户。这家能源公司不希望资金在支票账户中的存放时间超过所需时间，因为他们可以通过利息获利，而那是一笔巨款。


  情况的关键点在于：这段代码在编写时存在一个 Bug。之前的代码人员犯了一个错误，导致程序在转移资金支付某个大部门员工工资之前停止了，这意味着资金根本没有进行转移。这导致了近
  7000 万美元的工资错发，并且每个发薪周期都会产生数十万到数百万美元的罚金。由于这家公司规模巨大，这仅被记录为银行费用，但它每年都在给公司带来数百万美元的损失。


  随后，我为该代码编写了一个修正程序（一个补丁）并部署了新版本。这段调整后的代码进入了生产环境，正确的金额被存入了工资账户。这个补丁每年为公司节省了几百万美元。


  并不是所有的补丁都是为了修复错误或漏洞（允许黑客进入你系统的代码）。很多时候，补丁是为了增强功能。例如，假设你必须点击两个不同的屏幕才能保存文件，这让你感到足够恼，以至于向软件公司投诉。嗯，许多公司实际上会听取并回应这些投诉或建议，并发布一个补丁。在这个例子中，补丁会将“保存”按钮直接放置在主页上。现在，你可以直接从主页点击一下即可保存你的文档或文件。


  所有程序在某个时候都需要打补丁，但并非所有的补丁在时候都有帮助。有时，补丁可能会导致问题。例如，最近有一个更新计算机视频图像的补丁。对于某些人来说，这个更新后的补丁导致他们的电脑崩溃并突然停止工作。


  在这种情况下，`RMM`（远程管理与监控）系统可以提供帮助。通过第三方公司提供此类服务，他们可以确保必要的补丁得到部署，并防止甚至撤销糟糕的补丁。像生活中的大多数事情一样，这不是一个完美的系统，但它确实在补丁管理方面为你提供了更大的安全性和控制力。


  这些 `RMM` 工具被许多 IT 公司用于帮助控制和管理你的设备。顾如其名，它们用于远程监控你的系统和设备，并在需要时为工程师提供访问权限。这些工程师可以在需要时与你一起访问系统，无需旅行，无需繁琐，无需混乱，如果你在家里工作，甚至不用换下睡衣！这不很棒吗？


  `RMM` 工具的另一个优势是它可以跟踪并确认你的硬件和软件库存清单。这意味着，如果你收到来自像 `Microsoft` 这样的大公司的请求，确认正在使用哪些软件，你可以获得快速答案。`Microsoft`
  将这些称为软件审计，他们喜欢在出意之外进行这些审计。这也意味着你可以看到团队可能部署了哪些程序，因此你可以确保他们使用的是合法软件，而没有在没有适当许可的情况下安装东西。


  最后，`RMM` 工具还将帮助应用程序保持最新状态。除了你的 `Windows` 或 `MAC` 操作系统外，你可能还有 `Office`、`QuickBooks`
  或需要打补丁的软件；`RMM` 工具会让这个过程定期更新。


  # 第 10 章


  ## 永远在等待


  ![](img/image-10-1.jpg)


  世界正在发生，黑客也随之改变。他们已经了解到我们设置了防御，并正努力绕过这些防御。黑客与防御者之间是一场持续的拉锯战。


  攻击你系统的新方法是部署所谓的“潜伏特工”，这种程序在你的计算机中休眠，等待在日后攻击你。这些程序非常棘手，因为它们意味着攻击或感染也将出现在你做的任何备份中。通过让感染包含在备份中，当你从该备份恢复时，它也会恢复你正试图删除的病毒或勒索软件。这狡猾得极点，而且极具破坏性和破坏性。


  你可能在想，“他们为什么要做这种事？”这很简单——我们的网络攻击防护正在变得更好，如果黑客想继续向人们勒索钱，他们就必须提高手段。在这种情况下，提高手段意味着找到更阴险的方法绕过我们的防御。


  这些延迟攻击可以扩散到你的所有数据并进入所有的备份中。这意味着恢复备份只是放回了攻击（快点说五遍这个！）。黑客也变得更有耐心了。有些人甚至会等待多达才发动攻击，以确保你所有的备份都已破解，从而让你变得绝望，并更愿意付钱给他们来（希望）恢复你的数据。


  想象一下：你一直很好地坚持使用备份伙伴，你所有的文件都安全妥妥地停息在它们的数据床里。突然，你遭了网络攻击。你没关系；你一直都在做备份。你检查它们、管理它们并保持它们安全，因为那是你数据的数据。


  然后，攻击者攻击了你。他们加密了你的所有数据，并要求支付数千美元来解锁。你不担心；你一直在进行正确的备份，并确信一切都是安全的。你的备份是离线的，已经保护了你一年。你对着愚蠢的攻击者大笑！


  备份恢复了你的文件和系统，你准备就绪了。第二天早上，你发现所有文件又被锁定无法使用了。什么？！怎么发生的？你从好的备份中恢复。好吧，没问题。你可以从几天前恢复。夜色降临，你安心地入睡，因为你知道这次没事的，并且在早晨，一切都会恢复正常。不幸的是，第二天早上，你再次发现所有文件都被锁定了。你该怎么办？


  让我们先讨论正在发生什么。在过去的老日子里，黑客会在你点击恶意邮件或受损链接时直接攻击你。点击后，你会收到那个尖叫的 `Microsoft` 警告通知，或者你的文件会立即锁定。由此导致的攻击是即时且创伤性的，现在已通过我们的安全防护得以解决；对你我来说是好消息，对黑客来说是坏消息。


  不幸的是，越来越多的网络攻击不再立即发生。相反，黑客将程序放入你的计算机，然后让它们进入“睡眠”。当它们最初被安装时，不会做任何有害或可察觉的事情，因此没有被发现，只是在等待被激活。


  这些程序可以潜伏几个月之久，静静等待。当它们在阴影中耐心等待时，它们会被复制到你做的所有备份中，使其根除变得困难。同样，它到目前为止没有做过任何坏事或恶意的事，因此被“安全人员”忽略了。





  几个月后，甚至一年后，这个看似无害的小程序显露了它的真面目。它开始发起攻击，要么锁定你的数据，要么共享你的敏感信息，或者进行其他你不希望它执行的坏事。


  黑客们知道，你作为一个负责任的网络公民，拥有良好的备份并采取了保护措施。你通过备份恢复了丢失的信息。但等一下！在备份中，隐藏着一个静静的小程序，等待着重新回到你的环境中并大肆破坏。一旦你恢复了备份，它就会再次攻击，*从你的备份内部*发起，因为在过去的几个月里，它一直躲在那里并不断被复制到那里。你看出这种困境了吗？


  你如何阻止这些潜伏特工呢？这就是你需要在它们进入时对其进行监控的地方。像 `Windows` 和 `Mac OS` 这样的操作系统会认为，如果你授权了该程序，它就应该被允许安装。黑客利用这一点，将他们的潜伏特工放入其他安装软件中。这样一来，当你点击“是的，我想安装”时……它就顺带进来了。


  这就是应用程序控制程序可以派上用场的地方。它检查电脑上应该运行的所有程序，并寻找那些似乎没有在做任何事情或行为异常的程序。它会标记这些程序并将它们隔离，不让它们对你的重要信息进行更改。


  系统通过学习你的操作以及你电脑的工作方式来实现这一点。然后它会监控每个程序，看它是否仍以相同的方式运行。如果是，那么一切正常，可以继续它愉快地运行。但是，如果某个特工表现得过于安静，或者开始请求对你的文件进行异常更改，它就会被关闭，防止它访问你的任何文件。


  请记住，网络攻击者总在寻找伤害你并让你付出代价的方法。网络安全永远不是一件一劳永逸的事，所以你应该始终保持调整——黑客们也是如此。


  # 第 11 章


  ## 老板让我发过去


  ![](img/image-11-2.jpg)


  你是否收到过老板发来的邮件，要求你为她的女儿购买礼品卡……但你知道你老板并没有女儿？或者收到一封要求你支付一张你从未收过的发票的邮件？钓鱼攻击每天发生*数百万次*。有些只是黑客发送给成千上万个人的通用攻击，看看是否有人上当；而另一些则非常有针对性且详细，旨在误导你汇款或提供关键信息。


  这些攻击被称为*钓鱼攻击*（phishing attacks），因为它们在“钓鱼”以获取你的信息。通常，他们希望你上钩点击那个链接或接听他们的电话，这样他们就能诱骗你分享敏感信息。我希望事实并非如此，但这些攻击的成功率之高会让你大惊的。


  钓鱼攻击的一种特定形式被称为*鱼叉式钓鱼*（spear phishing）。这是指黑客使用针对性攻击，试图获取你分享的信息或夺取你的钱财。我们许多人人都经历过这种形式的钓鱼攻击。用之前的例子来说，你收到一封似乎来自你老板的邮件，要求你为她的女儿购买一张
  5 美元的礼品卡。由于邮件看起来是直接来自你的老板，你不太可能怀疑其真实性。在这个例子中，购买一张 5 美元的礼品卡可能看起来微不足道，但这类钓鱼攻击可能会导致巨大的损失。


  ## 案例研究：昂贵的发票


  一次鱼叉式钓鱼攻击让一家当地公司损失了十万美元。那是一个大型制造基地的普通周二。天气很暖，阳光透过二楼财务部门的窗户照射进来。表面上看，这和其他任何天都没区别，付款正在进行，交易正在发生。然而，这并不是平常的一天。财务部门即将收到一封让他们付出惨痛代价的邮件。


  应付账总监（我们称她为 Mary）正在查看收发给 `Accounts Payable` 的邮件。她每天收到三十到四十封邮件并不稀奇，大部分是关于支付问题的。


  Mary 在阅读邮件时，她注意到其中一封来自公司经常合作的供应商邮件。邮件声称，有一笔金额为 138,000 美元的未付发票余额需要立即支付，并列出了汇款的银行账户。


  Mary 在检查银行账户时稍稍有些犹豫。那看起来并不像他们常用的银行账户，但她同时还有二十个其他问题要处理。她熟悉这个供应商，所以她假设这些信息是准确的，并继续处理付款。


  点击提供的链接，她开始向该银行账户转账。银行也没有发出警报，因为对他们来说，转账此类大额资金是正常的。


  两天后，Mary 与另一名办事员核对，试图寻找丢失的发票，立刻感到胃里一阵收紧。在搜索过程中，他们没有找到任何金额为 138,000 美元的未付发票。在恐慌中，他们联系了供应商询问最新的发票情况。


  Mary 在期待中等待未付发票邮件，以及最近几笔付款金额。`Outlook` 的提示音告诉她邮件已到达。当她打开 `Excel` 表格时，她的心凉了。在检查了过去和现在的发票后，没有一张是
  138,000 美元的。事实上，根本没有未付发票！


  这对 Mary 来说是一个毁灭性的打击，她不得不去告诉 `CFO`，她让公司损失了 138,000 美元。我们尝试联系银行处理汇款，但为时已晚；钱已经被取走了。


  ## 预防与最佳实践


  正如你所见，上述许多步骤都需要与某直接联系并确认。一个简单的电话就能为这家公司节省超过十万美元。


  1. 他们要求所有付款必须与发票挂钩。

  2. 如果他们收到一封来自非预期供应商且金额超过 1,000 美元的发票，他们会致电供应商确认金额。

  3. 任何付款变更请求都需要电话确认。

  4. 他们创建了一个已批准的银行账户列表。如果要求向不在列表中的账户进行 `ACH` 付款，则会通过电话确认该变更。

  5. 他们始终使用已知的供应商电子邮箱地址来确认邮件，而不是点击回复按钮。

  6. 最后，如果感觉不对劲，他们就不会处理该笔付款。






  我知道我们都会嘲笑那些向尼日利亚王子汇款的傻子，因为他们承诺只要你支付几千美元作为转账费用，就会送给你数百万美元。虽然这听起来很好笑，但每天都有无数人落入类似的网络钓鱼陷阱。


  黑客正在调整他们的攻击手段，使其更具针对性且更阴险，就像我刚刚分享的那家公司一样。他们会使用信任人士（如供应商或客户）的名字来诱导你提供银行账户、电子邮件地址或其他重要信息。始终保持警惕非常重要。


  # 第 12 章


  ## 电话来自屋内部


  ![](img/image-12-1.jpg)


  当你正处于熟睡中时，手机响起了熟悉的*叮咚*声，表示你刚收到了一条短信。你昏昏睡睡地揉掉眼角的眼垢，慢斯理地打开短信界面，发现是一条来自未知号码的消息。“*恭喜你！你赢得了一张
  25 美元的礼品卡！只需点击链接即可领取奖品！*”你不记得自己参加过抽奖，但那是 25 美元，对吧？为什么不拿了钱就走呢？况何况这是短信；它应该是安全的吧？于是，你点击链接领取了奖品……


  你现在成了 `smishing`（短信钓鱼）的受害者。`smishing` 是 `SMS phishing` 的缩写（SMS 是极客对短信的术称），是网络攻击的最新趋势之一。黑客意识到我们对电子邮件的保护更为严密，因此他们正转向人们花费更多时间的地方——手机。最糟糕的是，为了获取我们更多的时间和注意力，普通企业也开始发送更多的短信。你可以看到这很快就会变得让人应接不暇。这可能导致我们做出一些对自己不利的决定，比如点击那些直接落入黑客圈套的链接。


  如果你正遭受短信的轰炸，那么从已知列表中退订、将其他信息标记为垃圾邮件或屏蔽这些号码可能会有所帮助。同样重要的是记住，永远不要点击陌生人短信中的链接。如果你没预料到会收到且不知道对方是谁，最好的办法就是直接忽略它。黑客总是试图让你放松防备，交出你的宝贵信息。


  噢，等一下——还有后手！他们对你的手机还没完。我们还会遇到另一种形式的钓鱼攻击，称为 `vishing` 或 `语音钓鱼`。这些攻击始于电话，攻击者自称来自微软、政府机构或其他组织。


  现在是时候给你讲讲当年“税务局（IRS）”给我打电话，要“追收我显然欠下的所有欠税”的故事了。这是一个有趣的故事，关于我是如何欠了 5000 美元的税款，以及他们打算如何“帮我纠正”。


  我刚结束与一个客户的工作，手机响了；这是一个被叫的号码，我习惯性地接听了。


  一个带有外国口音的悦耳声音问候了我。“*你好，我是税务局的 Hamon。我给你打电话是因为你欠我们 5000 美元，我们需要安排付款*。”


  “*我欠你们 5000 美元？这是关于什么的？*”我有些困惑地回答，因为我并不是那公司的财务官。


  “*是的，先生。您的税款逾期了，必须立即支付*。”


  我很快意识到这*不是*来自税务局的电话，我*并没有*欠任何税款。不过，这给了我一个玩乐的机会。


  “*噢天天！我没意识到我付款晚交了。我该怎么做才能补救？我现在就可以回办公室，让我的会计联系我们的税务局实地探员并给他一笔付款*，”我带着得意的微笑说道。


  他的声音里充满了恐慌，回答道：“*不，先生，你不想那样做。我需要你今天解决这个问题。你需要做的是购买比特币，然后将其转到我们的`Accounts Collectible`（可收款账户）。我可以指导你完成整个过程。这非常简单，你就能消除这笔非常严重的税收违规记录了*。”


  我很确定税务局*并不会*接受比特币来清偿税收责任；他们喜欢支持美元。我迅速想出一个计划，既能玩一下，又能防止他伤害其他人，至少持续一小时，这恰好是我回到办公室之前的时间。


  “*比特币？！我以为那是黑客用来勒索钱财的！*”我装出恐惧的样子说道。


  “*别担心，先生，税务局只是想让这个过程变得简单些*，”他向我保证道。


  “*我不确定该怎么办。帮帮我*”我虚弱地回答。


  此时，他让我打开浏览器并进入一个特定的链接。然后他开始指导我如何购买和转移比特币。我表现得完全无所不知。在每一步中，我都做错了，并假装不知道该点哪里。


  将近一个小时后，他说他可以直接登录我的电脑帮我操作。


  我回答道：“*我不认为应该这样做。我的电脑专家告诉过我，我绝不能让任何人进入我的电脑*。”


  他挫败感日益增加，反驳道：“*如果你不让我进去，税务局就得没收你的房子！*”


  “*我的房子！*”我震惊地说道。“*先生，我们不允许提供证件号,*，”他语气不耐烦地说。


  “我觉得这有什么不对劲。”我正开车进办公室的停车场。


  “*先生！*”他说，显然在对我生气。“*我现在必须进入你的电脑，这样我才能把你欠的钱转过去。现在请给我邮箱，我我把链接发给你*。”


  “我很乐意这样做，只要你能为我做一件事：告诉我我的名字。”


  “*你什么意思，先生？*”他问。


  “*如果你是税务局的，那么你就知道我的法定姓名。请告诉我*。”


  电话挂了；不再有那个来自税务局的 Hamon 了。虽然他在最后确实变得有点无礼，但他确实让我的回办公室路程变得飞快！


  ## 保护贴士


  在接到关于催收的意外电话时，无论对方是税务局还是任何其他公司或组织，这里是一些建议：


  1. 始终要求提供书面信息。你有权以书面形式获得任何欠单。税务局在没有发送书面通知的情况下*绝不会*直接给你打电话。

  2. 绝不要现场或通过电话付款。有些黑客甚至大到提要上你门取款！这*绝不*合法的。绝不。

  3. 要一个回电号码，然后检查该电话是否真的属于已知公司（而不是未记录或无法核实的号码）。你还需要检查自己的文件和记录，看看你是否真的欠该公司钱。

  4. 税务局官员没有证件。如果你接到自称来自税务局的电话，请他们提供证件号。如果他们真的是税务局的，他们会知道自己没有证件号。

  5. 绝不要支付你没有亲自核实的款项，特别是如果他们要求使用比特币。比特币是一种*无法追踪*的获取钱财的方法，这就是为什么黑客喜欢使用它。





  语音诈骗（Vishing）攻击可能让你非常沮丧，如果你还接到过催收电话，情况会变得糟糕。始终记住要保持冷静（RELAX），不要让他们恐慌而做出行动。不要仅仅因为他们说你必须这样做就听从他们的指令，也不要他们试图施加压力或让你心烦意乱（这些都是他们用来让你服从的策略）。数到十个数，回想你在这里学到的技巧，然后决定下一步采取什么。


  # 第 13 章：我们都被当作人质了


  ![](img/image-13-2.jpg)


  任何网络安全书籍，如果不警告你防范所有网络攻击中的“大反派”——可怕的勒索软件（此处应有戏剧性的音乐），都是不完整的。勒索软件受到的关注似乎比所有其他网络攻击总和还要多。这种攻击曾导致一条石油管道关闭，并影响了美国的许多城市和城镇。似乎每当我们打开新闻或刷手机时，都会不断听到这家公司或那家公司不得不支付巨额赎金才能重新获得文件或账户的访问权限，更糟糕的是，他们付了钱却从未获得过访问权限。


  ## 什么是勒索软件？


  勒索软件是指任何将你的信息扣留或质质，直到你支付赎金以恢复它的程序。在大多数情况下，黑客通过加密你所有的文件来实现这一点。我喜欢把加密想象成你有一张写了字的纸，然后拿一把粗的黑色马克笔在纸上到处涂抹，以遮住你写的所有内容。你写的东西仍然在那里，但你再也无法阅读了。如果你这样想，就可以把勒索软件理解为黑客对你所有的文件涂了黑色马克笔；你无法再读取它们，但他们愿意向你出售“马克笔清洗剂”，让你的文件能够再次被读取。


  我确定黑客的这种行为会让你生气——我也生气！他们对你的文件造成了损害，然后要求你付钱让他们修复！这就像你从黑手党那里听到的保护费；他们会承诺如果你付钱，他们就不会破坏你的生意。就像黑客一样，他们是造成伤害的人，然后要求你通过某种形式的付款来解决问题。


  我在书中多次提到黑客是如何调整和适应他们的攻击的。过去，他们只会加密你的信息，但今天，他们还威胁要将其公开发。随着我们面临的日益增加的合规要求（如 `PCI`
  和 `HIPAA`），泄露变成了一个更严重的问题。


  ## 案例研究：Holds


  让我分享一个关于两个公司的故事。我们的第一家公司，我们称之为 `Holds`（为了保护隐私已更改名称），给我打了电话，说我推荐给了他们。我去现场查看发生了什么，看到他们有一个本地服务器，里面存所有的文件。每个人都将数据保存到服务器上，他们每晚都会对连接服务器的
  USB 外部硬盘进行备份。


  当我到达时，他们正处于恐慌之中。所有的公司文件都被加密了——还记得上一章中“涂满了粗黑色马克笔”的类比吗？总裁埃迪（Eddie）告诉我，当他看到文件被加密时，他去尝试从备份中恢复。他眼里含着泪告诉我，备份不起作用，备份也被加密了。


  我问他是否还有一个没有连接到服务器的额外备份。他回答说：“不，我们只有那块被要求一直连接在服务器上进行备份的硬盘。”


  我为他感到非常难。这家公司试图做正确的事，但他们失败了。在网络攻击出现之前，做正确的事就是：确保你始终有备份。这里的悲剧性错误在于，你应该有多个备份位置，而不是让备份一直直接连接到服务器上。现在的许多勒索软件攻击都会寻找连接的存储设备，因为这些设备上可能存有备份文件，黑客知道备份是从网络攻击中恢复的最佳方式之一（显然，如果他们想拿到钱，他们就不希望看到你这样做）。


  我们立即联系了 `FBI`，他们来此调查并给了我们几个已知的加密密钥。虽然这些已知加密密钥在大一半的情况下有效，但在这种情况下它们失效了。我们不得不重建许多文档，并从头开始创建他们的文件。这意味着我们检查了所有的电脑和电子邮件，试图找到任何所需文件的副本。这是一个漫长而痛苦的过程。


  ## 案例研究：Makastuff


  现在让我们看看另一家公司 `Makastuff`（名称也为了隐私进行了修改），这是一家制造公司。Makastuff 做我们的客户大约五个月，我的工程师注意到他们的服务器出了问题。他联系了他在
  `Makastuff` 的联系人 `John`，询问发生了什么。


  当我们第一次给他打电话时，John 支支吾吾。他终于承认：“我想我对服务器做了些什么。”


  我的工程师问：“发生了什么？”


  “嗯，我当时在服务器上，决定买点东西；我觉得这没害。我点了我电子邮件里的一个链接，突然我桌面上的所有项目都开始出现奇怪的字母，”他羞愧地回答道。


  “没关系，我们都会犯错，”我的团队成员告诉他，“让我们看看能不能弄清楚发生了什么。”


  在检查服务器后，我的工程师确定那是 `WannaCry` 勒索软件。它还没有扩散到整个网络，但已经造成了损害。攻击者要求通过加密货币支付 `$5000` 的赎金。这并没有发生。


  在过去的几个月里，我们一直在对他们的系统进行防勒索的备份，所以接下来的步骤相当简单。通过备份，我们能够将公司恢复到前一天晚上的状态；只花了一个小时。


  ## 预防策略


  正如这两个例子所示，勒索攻击的结束方式有很大不同。你可以丢失所有数据并支付赎金（希望能拿回数据，但没有保证），或者你可以建立一个备份恢复计划以确保你能够恢复。只要记住：黑客总在寻找绕过你防御的方法。获取信息价值数百万美元。


  1. **拥有防勒索备份**。这意味着备份需要与计算机本身分离。备份可以是本地的、云端的，或者像我们的解决方案一样，同时在本地和云端。它们在初始备份和存储时也需要被加密——这可以防止他人窃取你的备份。记住始终测试你的备份，以确保在你需要时它们会在那里；毕竟它们是你的备份伙伴。


  2. **拥有最新且活跃的防病毒软件**。这可以保护你的电脑免受已知攻击。


  3. **拥有应用程序控制以防止隐藏程序**。你可能记得黑客现在会放置睡眠程序，等待几个月后再攻击，以使你的备份失效。


  4. **使用反垃圾邮件和电子邮件保护**。很多勒索软件隐藏在电子邮件或邮件链接中；这些程序可以过滤掉它们。如果你根本看不到坏邮件，就不会被诱点击它。


  5. **不要访问未知网站或点击链接**。许多勒索攻击都是通过点击坏链接或访问坏网站发生的。






  ## 6. 在计算机上对安全和隐私信息进行加密。


  有很多优秀的加密程序可以确保你的信息不会被窃取和读取——或公开共享。


  要记住，你始终需要不断调整。黑客在突破你的保护措施方面有着既身利益，以便利用你的信息——不要让他们得逞。


  # 第 14 章


  ## 合规性困境


  ![](img/image-14-1.jpg)


  你还记得以前那些美好的日子吗？那时候你只需要照顾好自己就行。看病时并不需要满足 `PCI`（支付卡行业）合规性标准或 `HIPAA`（健康保险可移植性与责任法案）标准。似乎每过一天，对我们如何开展业务的要求都越来越多。这些合规要求伴随着其自身的痛苦和成本，并且它们正迅速成为我们未来开展业务的标准。


  那些不符合预期标准的人可能会发现自己陷入了公开的尴尬。例如，如果你是一名医生并发生了安全泄露，你最终可能会出现在 `HIPAA` 的“耻辱柱”（Wall of
  Shame）上（这真的存在！你可以在这里找到：`https://ocrportal.hhs.gov/ocr/breach/breach_report.jsf`）。这些行为是为了迫使人们非常严肃对待这些合规要求。


  让我们来看这个诊所的真实故事——我听过很多次。故事是这样的：“我不需要担心 `HIPAA`，因为政府不会关闭像我这样的小诊所。这不是什么大问题，反正也没人想要我的信息。”医生对他不需要担心网络攻击这一事实感到自豪。在某些方面，这是事实，因为当时
  `HIPAA` 的重点是让大型玩家实现合规。问题是，网络攻击并不总是针对大型玩家；它们关注的是那些不重视威胁的小型玩家。


  我永远喜欢斯科特·亚当斯（Scott Adams）《迪尔伯》（Dilbert）漫画系列中的一个情节，上面说：“记住，没有‘liance’这个单词就拼不出‘compliance’。”对于我们许多人来说，我们只想完成勾选框流程。这个过程太不方便了，以至于我们只想尽快忘记它。尽管这令人沮丧，但你需要知道，你不能简单地推卸合规责任——更糟的是，认为你可以在合规上`lie`（撒谎）。可以这样想：如果你的会计师在报税时出了错，`IRS`
  是去找你的会计师，还是找你？


  这是一个我们合作过的一家公司实施新合规标准的例子。该公司最近转向了 `SOC 2`（服务组织控制）合规。起初，我的客户告诉我，他们的公司对于实施满足 `SOC
  2` 所需的标准和控制非常抵触。正如他描述的，每个人都讨厌这个过程，它似乎让事情完成花费了长得多。在他们实施控制措施后不久，结果获得了丰厚的回报。该公司的一家大客户说他们发货设备不符合相应的规格，并且不会支付已寄出的数千美元设备的费用。


  这对于任何企业来说绝不是好消息，但对小微企业来说更是毁灭性的。我的客户团队随后回溯了所有的控制文档。问题是，网络攻击并不总是针对大型玩家；它们关注的是那些不重视威胁的小型玩家。





  在那之后，作为一名技术人员，我走过很多人的工位，看到那本“蓝色大书”要么放在高处要么放在低处，但从未被阅读过，甚至从未被打开过。我知道这对于公司来说是一个很好的合规检查项，但员工们从不使用或阅读它。它充不过是律师的口粮，放在那里是为了给公司打掩护，但对改变行为毫无帮助。


  这`不是`创建你希望员工使用的的政策的正确方法，而政策`应该`是这样被使用的。让我们从你为什么想要制定政策开始。制定政策是为了确保你的团队以相同的方式执行相同的流程。在网络世界中，这可能意味着设置复杂的密码或不将重要文件带回家。在理解政策的存在是为了确保你的团队以相同的方式执行关键任务的前提下，问问自己一个问题：`你`会读两百页的政策吗？我想我们都知道答案。这就是为什么我的政策“蓝色大书”演变成了我的政策“大书架”，再再也没有见过天日了。


  无论你处于哪个行业，制定政策都是为了满足各种合规标准。再次，这是一件好事。如果你记得让人们容易`阅读`政策，那么他们就更有可能`遵循`政策。


  让我们再次围绕政策进行一次旅程，这次回到我在一家制药公司工作的时候。要记住，制药公司受到严格限制，它们的政策必须被严格遵守；美国食品药品监督管理局（FDA）要求如此。


  作为一名年轻的网络管理员，我负责网络的生命线，并确保一切运行正常并受到保护。我的职责之一包括备份所有重要数据。


  公司有一份关于如何执行备份的政策，所以我作为一个表现良好的员工，去索要了那份政策。我的经理告诉我（这可不是玩笑），“`我不能给你那份政策，因为根据规定，你必须是总监级及以上才能看到备份政策`。”


  我震惊得说不出话。我太惊讶，甚至没有问那个显而易的问题：`我该如何遵守一份我不被允许查看的政策呢？`我离开了经理的办公室回了自己的办公桌。


  在接下来的一小时里，我坐在那里思考他刚刚告诉我的话——整整一个小时在震惊的沉默中白浪费了。最后，我使用行业标准和异地备份创建并实施了自己的备份流程，但直到今天，我也不知道这是否符合公司政策的要求。


  我分享这个例子是因为对你来说，至关重要：如果你不给员工清晰且易于遵循的政策（以及获取政策的权限），那么他们就会制定自己的政策和流程，而且结果并不总是像我为那家制药公司做的那样好。


  在制定政策时，请记住以下建议：


  1. **KISS**: `K`eep `i`t `S`imple, `S`upid（保持简单、愚蠢）。基本上，创建清晰简洁的政策。

  2. 明确定义需要遵循政策的受众。

  3. 编写政策的人员或委员会的名称。

  4. 保留政策变更和日期日志。

  5. 每年审查一次政策。

  6. 确保对政策进行适当的培训和访问管理。


  政策可以是支持企业文化并在出现问题时保护你的极佳方法，但如果它们静静地躺在大蓝书中，无人问津，落满灰尘，那么它们对任何人都没有帮助。


  # 第 16 章


  # 登上培训之车


  ![](img/image-16-2.jpg)


  当我们还是婴儿时，我们都是可爱的空白纸。从那时起，我们开始学习而且学得很快。学习是一个终身过程，永远不应该结束。遗憾的是，有很多经理认为人不需要学习，而应该已经学会了。


  培训是确保你的团队与时俱进步调一致的最佳方法。它可能成本高昂，但只要执行得当，长远来看是有回报的。如果你有想要学习的员工，请鼓励他们——他们将成为你最好的员工。


  很多公司并不认为培训能让公司变得更好，他们将其视为流失员工的风险。虽然培训员工确实可能会失去他们，但如果你不培训他们，你也会失去他们。例如，当我在一家货运公司担任仓库开发运行时，网络管理员突然辞职了。那个职位空缺了，我想接受新的挑战，于是我开始了对
  `Novell NetWare`（一种现在已停止的网络操作系统）的培训。


  利用我获得的资金，我开始了我的课程。在开始第一节课后，我的经理进来和我谈话。我想我们大家都能同意，当经理说他想和你谈谈时，这几乎不是什么好兆头。他坐在我的工位上告诉我有一个问题：公司不希望我完成
  `Novell` 课程，因为这会让我变得太有价值，我会离开公司。


  我记得那句话：我会变得`太有价值了`。在我看来，有价值应该是他们想要的东西，但我一句话没说让我的经理继续说。我听着他告诉我，我的培训对公司是一种威胁，我只会参加完培训就离开。


  在他表达完对我会离开的顾虑后，我告诉他我愿意签署协议，如果我在明年内离开，就向公司还钱。他告诉我无法承担这种风险，并且我太有价值了。意识到他们永远不会培训我变得更有价值，我最终离开了公司。当我意识到我的未来需要培训（以及在那些鼓励成长的公司）时，这是一个简单的决定。




  第二，考虑到你的听众。如果我正在对一群会计师进行培训，我不想突然开始谈论 `SIEM` 或 `SOCs`；我想谈论的是资产负债表和电汇诈骗。你总是要让知识水平与听众保持一致。讲得太深听众听不懂，只会让他们开始白日梦，想着这周末要去划船游，或者是那杯被遗忘在车里的冰拿铁。


  第三，记住听众学习的原因。如果你正试图防止电汇诈骗，就让听众知道这一点，并保持信息的一致性。不要离题去谈论油价为什么上涨，或者你的公司为什么不想让任何人接受培训（因为那样他们都会跳槽）。


  第四，控制范围。人们通常只会从你的培训中记住两或三件事，因此，试图在一场培训中塞进几十个要点将意味着大部分内容会被遗忘并被忘记。保持内容合理且可实现，你会发现培训会更成功。


  我认为第五个步骤是最重要的，那就是保持趣味性。在我主持的“快速且有趣”的培训中，我总是记得，人们在玩得开心时记忆得更好。如果你的团队喜欢你提供的培训，他们会愿意回来参加更多培训。


  第六是持续学习。培训不是一劳永逸的；对于你的团队来说，持续学习至关重要。网络安全世界在不断演变，黑客也在不断改变他们的策略，因此我们需要不断适应。


  我们应该以终身学习者的姿态面对生活，不断成长并扩展视野。通过持续的培训和学习，我们保持处于顶水平。


  # 第 17 章：NIST 很有棒


  ![](img/image-17-1.jpg)


  美国国家标准与技术研究所（`NIST`）是一群躲在科拉多州博尔德的人，他们正在思考无数方法来确保我们的安全。大多数网络安全标准都源于他们的工作。为什么像你这样的小微企业会关心
  `NIST` 或他们创建的标准呢？这是一个极棒的问题，而答案更棒！


  `NIST` 创建了许多全球范围内使用的安全标准，在美国国内也十分活跃。他们从一个简单直观的`网络安全框架`开始，这个框架我们每个人都可以实施并理解。`NIST`
  网络安全框架`的五个步骤是目前使用的所有网络安全标准的基础。


  ## 网络安全框架的五个步骤是：


  1. 识别

  2. 保护

  3. 监测

  4. 响应

  5. 恢复


  我将带大家了解每一个不同的步骤，并解释它们的价值所在。


  ### 1. 识别

  第一步是识别。那句老话永远正确：你无法保护你不了解的东西。在`识别`阶段，你将找出重要信息存储在哪里。你的公司运行在信息之上——从你的 `QuickBooks`
  会计软件、客户记录、存放你所有资金的银行，到生产你售卖的美妙产品的专利工艺，你的电脑里都有至关的数据。


  第一步是识别所有这些信息在哪里，从清点你拥有的所有设备开始。这包括电脑、智能手机、外部硬盘和 `USB` 设备，甚至包括 `POS`（销售点）设备和其他可能对你公司流程至关重要的
  `IoT`（物联网：连接到互联网的机械或其他物品）设备。


  接下来，你需要知道你正在使用哪些程序和应用程序。你需要 `QuickBooks` 还是 `AutoCAD`？你正在使用哪个版本的 `Microsoft Word`？了解你使用哪些程序以及它们位于何处，将通过理解人们在做什么以及在哪里做什么来帮助保持安全。花时间跟踪正在使用哪些程序。如果对你公司至关重要的程序丢失或受到攻击，你将如何恢复？


  你还需要确定谁应该能够访问这些程序。哪些员工需要访问哪些信息？承包商需要访问权限吗？公司以外的人呢？每个需要访问你重要信息的人都需要被识别，并定义他们具体需要访问的内容。我猜你不想让你的客户查看你的
  `QuickBooks`，但他们应该看到你的公司介绍册。


  你还想要定义他们如何获取你的信息。你的员工现在可能在家里工作，需要通过安全连接（如 `VPN`，即`虚拟专用网络`）来获取访问。他们还可能在手机上访问信息。知道谁在访问你的信息以及他们是如何访问的是非常重要的。如果你不知道，你就无法保护它。


  完成这些工作可能需要一段时间，我知道大多数人都讨厌这第一部分。它要求你理解什么是重要的以及它存储在哪里。随着云存储时代的到来，知道你的信息存储在哪里以及它到底有多安全可能会变得困难。


  ### 2. 保护

  下一步是保护你的重要信息，这是一个持续的过程。它将包括防病毒、垃圾邮件过滤器、备份以及旨在确保你的团队安全的措施。它将包括为人员设置安全措施并对你的员工进行培训（这应该是持续进行的，而不是仅仅每年一次）。保护过程是一系列不断变化的行动，你和你的团队每天都会采用这些行动。你不想让它变得负担，但你也必须记得参与其中。仅仅雇人来为你做这件事的日子已经结束了。你想找一个会与你*一起*做这件事的人，作为你团队的一员。


  ### 3. 监测

  接下来，你需要监测到攻击。如果你不知道或无法确定有人正在攻击你的信息，那对你将毫无帮助。你可能听过 Target 攻击事件，黑客在开始攻击之前甚至等待了几个月。拥有一种能够看到正在发生什么的方法至关重要。


  在这里需要记住的是，检测攻击有多种方法。你可以使用软件和硬件，例如防火墙上的 `IDP/IPS`（`入侵检测系统`或`入侵防护系统`）或运行在你的电脑上的应用程序控制程序，后者可以停止你未批准的程序。然后是人的因素。这可能意味着有人打电话给你，说他们收到了你发送的一封奇怪邮件并想确认其准确性，也意味着你的团队经过了培训，能够监测电脑上的异常行为。监测涵盖了广泛的流程。


  永远不要依赖单一方法来发现泄露。想想机场：除了有摄像头和巡逻的安保人员外，他们还会不断发布信息，报告你可能看到的任何遗弃行李。*你*也是机场保护过程的一部分。在你的公司里，你的团队和客户也是保护过程的一部分。如果某些事情看起来很奇怪或“不对劲”，他们可以告诉你。认真对待这些警告。


  ### 4. 响应

  接下来，当你获知攻击时必须做出响应。制定一个公司在发生泄露或攻击时将采取的行动计划是非常重要的。该计划应该包括减少攻击损害的步骤，以及发生攻击时应该联系谁。记住向适当部门通报攻击也很重要。例如，如果你遭受了勒索软件攻击，你应该告诉
  `FBI`，他们设立了一个网站来让整个过程变得简单：`www.ICE.org`。




  确保你的计划包含了客户、员工以及任何其他你认为可能受到攻击伤害或影响的人。虽然承认这一点很难，但你联系的人越多、告知攻击的情况得越早，你在阻止攻击扩散方面的效率就越高。


  让我们花点时间向你们展示 `NIST` 如何与我们在旅程其他部分所学习的内容联系起来。还记得我们出色的 OTP 首席执行官 `Lucy` 吗？就是你知道那个因为我还在谈论她的邮件失误而想扇我耳光的那个妻子。提醒大家一下，她的邮箱被黑客入侵了，黑客从她的账户发送了多封欺骗邮件，要求客户进行付款。在五分钟内，我们就获知了攻击并开始执行我们的网络安全响应计划。我们更改了她的邮箱密码，修复了他们设置的转发规则，然后我们做了一件被某些人质疑的事情：我们发送了电子邮件通知，告诉所有人我们遭到了入侵，并且他们不应该回复任何来自我们
  CEO 账户的邮件。


  反应几乎是即时的；许多人告诉我们，他们非常高兴我们能通知他们，但也有人质疑为什么一家网络安全公司会告诉人们他们被黑客攻击了。我们对此态度非常坚定，因为作为一家网络安全公司，我们有更高的标准要遵守。如果我们告诉别人在被入侵时必须通知他人，我们自己怎么能不做到这一点呢？由于我们使用了
  `NIST 框架`，我们已经为这次针对我们 CEO 的攻击做好了准备。向他人报告入侵事件绝不应该被视为羞耻，而应该被视为一种良好的做法。


  `NIST 框架`的最后一步是 `recover`（恢复）。这是一个至关重要的步骤，可以帮助你在攻击后重新获得控制感。我曾帮助那些成为网络攻击受害者的人重新感到完完整，因为这些攻击会让你感到无助和被侵犯。恢复过程不仅仅是找回数据并让一切恢复运行；它关乎在受到侵害后重新获得控制感并感到安全。


  除了恢复丢失的信息和修复受损的设备外，你还需要回顾发生了什么。这时，培训团队了解发生了什么以及如何阻止发生将非常有价值。攻击发生后，每个人都会更加关注防止其再次发生的步骤。利用这种关注可以帮助你从糟糕的处境中获得“胜利”。


  显见，`NIST 框架` 为你保护公司提供了一个起点。从你可以处理的事情开始非常重要。尝试过于复杂或规模巨大会让你感到不知所措和沮丧；像 `NIST 框架` 这样的流程可以帮助你保持控制并前进。


  # 第 18 章：小企业该怎么办？


  ![](img/image-18.jpg)


  这是一段历经所有网络安全挑战的长而奇妙的旅程，你觉得不是吗？现在问题变成了，企业该怎么办？


  我认为第一步会让你意外：放松（RELAX）。不要慌乱行动。相反，花点时间深呼吸，开始回顾你所处的位置。在这种情况下，我们刚刚回顾的 `NIST 框架`是一个极佳的起点，但也要记住，小胜利能帮助你获得更大的胜利。


  当你放松下来并准备就绪后，再考虑你需要或想去的地方。你是否由于网络安全方面的合规性需求，例如 `PCI`、`CMMC`、`HIPAA`、`ITAR` 等？如果有合规需求，那么你需要做的事情就会有一个有力的框架。理解这一点会让事情变得更容易定义，即使这些事情有时（或经常）做起来很痛苦。


  如果你没有网络安全方面的合规需求，请思考你担心的是什么。你是否认为自己可能会失去业务、丢失客户信息、或者被迫支付离谱的赎金？这一步将帮助你回想起为什么要努力提高网络安全。我知道有时我们都希望不需要网络安全，而且在一个完美的世界里它确实是不需要的，但正如你所知，我们并不在一个完美的世界里。


  现在你有了理由，就可以建立你的团队了。这个团队应该由公司内部的重要人物组成：项目的利益相关者，以及协助你采取必要网络安全措施的外部顾问。不要建立太大的团队；我建议四到八个人之间。他们需要有动力，并帮助你保持正轨。


  记住，推迟处理网络安全流程很容易，因为今天的火灾似乎是那么重要。还记得那家在大厅里放服务器的 ITAR 公司的故事吗？他们打算处理的，但一直没有处理，因为其他事情优先了。然而，他们每推迟一天，风险就增加一分。将你网络安全的理由写在一块大白板上，放在办公室里显眼的地方也会有帮助。这样，你每天都可以看着它并对自己说：“我不会被勒索软件攻击，”之类的话。


  注意你已经正在正确做的事情也同样。你可能不是从零开始。你的电脑上装了防病毒软件吗？你使用 `2FA/MFA` 吗？你已经有了政策吗？你是否在对员工进行培训？这些胜利提醒你，每一步并没有那么困难，而且你已经在采取许多步骤来提高你的网络安全。这提供了坚持下去的动力和动力，让你继续构建你公司的网络安全和韧性变得更强大。


  当你制定了如何推进网络安全的计划时，为不同的任务分配日期至关重要。记住，一次做一件事，以免让自己和团队措手不及；你还需要维持业务运行。


  要执行计划，请使用任何可以帮助的结构。如果你从公司获取网络安全服务（例如我的公司），他们会帮助你评估现状、你想去的目标，并告知到达那里需要做的事。如果你正朝着某个合规标准移动，他们可以很好的帮助，尽管理解他们寻找什么可能会困难。如果你没有使用保险或合规标准，就从
  `NIST 框架`开始。


  ## NIST 网络安全框架组件：


  ### 识别 (Identify)

  确定什么是重要的以及它们在哪里。这包含了需要保护的人员、文件、程序和硬件。然后，确定为什么要保护它们：是为了合规吗？员工在居家办公吗？你害怕被攻击等等。


  ### 保护 (Protect)

  弄清楚你如何保护你识别出的重要数据。你有备份吗？有防病毒软件吗？反垃圾吗？远程员工使用 `VPN` 吗？你还需要哪些安全措施？你还将希望建立在攻击期间如何响应的计划。


  ### 检测 (Detect)

  你有什么种方法来查看计划是否有效？你有负责检查日志的监控公司吗？你如何判断有人进入或入侵了你的系统？感知攻击正在发生是保护自己的至关重要的部分。


  ### 响应 (Respond)

  在这里我要再次开头说“放松（RELAX）”。如果发生了攻击或入侵，第一步总是放松。然后，建立好应对攻击的流程。我有一关于发生入侵时应采取步骤的文档，乐意发送给你，只需联系
  `RELAX@ontechpartners.com` 并索要有关入侵的信息。这是拥有政策非常有帮助的地方。






  ## 恢复


  现在你需要在遭受攻击后重新回到工作中。这可能包括恢复丢失的数据、回顾发生的情况并调整当前的保护计划、对团队进行额外培训等。在攻击后恢复到正常状态至关重要。攻击是违规行为，它们会让你感到无助和恐惧；营造一种正常感将帮助你的团队回到你正在从事的重要工作中。


  网络安全并不一定令人恐惧，尽管许多末日论的网络安全专业人士想让你相信的那样；让员工的工作变得有趣会有帮助。记住最重要的一点是什么？开始。尽管开始。每天做一些事情来提高网络安全，它看起来就不会是那么压力重重或可怕；把它看作是保护你的公司、你的团队以及你自己。


  # 第 19 章


  ## 缩写死的 (DEATH BY TLA)


  ![](img/image-19-2.jpg)


  我告诉我，网络安全人士有他们自己的语言。事实如此——我们确实有一整套 `TLA`，即三字母缩写词。我我很喜欢我一个朋友用一个缩写来定义了我们所有疯狂的缩写。不幸的是，我有时觉得网络安全人士使用所有这些缩写是让你保持困惑的一种手段。


  我收集了一些常用的缩写词，以便你更容易理解那些网络极客到底在说些什么。我还尝试用“普通老百姓或老太太”能听懂的语言来解释它们的含义。我没有把自己包含在那个列表中，因为我已经被缩写词的黑暗面吞噬了。某一天，我在一次社交活动上与一群男女商人交谈时意识到了这一点。


  我们坐坐在一起，讨论是什么让我们彼此与众不同。我非常自豪地站起来说：“我们是非 `MSP` 服务。我们正致力于确保你们成为网络旅程的一部分。”我等候每个人告诉我，我这种与世界上所有其他
  `MSPs` 区别开来的愿景是多么伟大。


  一片死寂瞬间笼罩了我，因为每个人都用我见过的最困惑的表情看着我。这时，一个女人站起来问：“什么是 `MSP`？”我简直崩溃了。为了在我的行业中脱颖而出，我付出了巨大的努力，以至于我没有考虑到行业之外的大多数人不知道
  `MSP` 是什么。记录一下，`MSP` 代表 `Managed Service Provider`（托管服务提供商）。


  很明显，我说的不是我客户的语言；我说的是我行业的语言。在我所有的贸易展和技术期刊上，他们都在谈论 `MSP` 旅程和 `MSP` 服务，以至于我以为每个人都知道它。但行业之外的人并不知道。从那天起，我意识到我们都可能陷入这种用自己行业语言说话的陷阱，而没有意识到对于我们行业之外的大多数人来说，这完全是胡言乱语。


  我加入这一章节是为了帮助你理解网络安全人士可能会对你说的一些术语。这显然不是网络人士使用的所有术语的完整列表，但它将为你提供一个很好的起点参考。我不指望你背它们，而是希望当你听到这些词时有一个地方可以查阅。


  ### CMMC

  `CMMC` – 网络安全成熟度模型认证（Cyber Maturity Model Certification）。你是否想过与政府签订合同？好吧，这不会让你变得更兴奋（但它是必要的）。`CMMC`
  是国防部发布的新标准，旨在确保公司至少具备基础的网络安全和保护。这只是政府要求你做的又件事之一……除了死亡和交税之外。


  ### MFA/2FA

  `MFA/2FA` – 多因素/双因素身份验证（Multi-Factor/2-Factor Authentication）。像大多数人一样，你可能有过多次这样的想法：“密码？我不需要另一个该死的密码了！”好吧，现在你需要的比密码更多。`MFA`
  要求你在登录账户时具有两个或多个不同的判断标准。好消息是，我们中的许多人已经在银行和其他金融机构使用了这种身份验证方法。如果你开启了 `MFA`，你就会知道，因为当你登录某个网站时，它会要求你输入密码，并且输入一个发送到你手机上的代码。我知道你讨厌必须做这些，但相信我，这会让黑客获取你的账户访问变得困难得多，因为他们不仅需要破解你的密码，还需要窃取或设法访问你的手机以获取验证码。你可以看到这会让你的账户被破解变得困难多少倍。


  ### VPN

  `VPN` – 虚拟专用网络（Virtual Private Network）。还记得疫情之初数百万人开始居家办公吗？好吧，我们许多人很快发现那是一种非常不安全的工作方式。那时我们开始实施
  `VPNs`。`VPN` 是一种使用加密（一种让其他人无法读取你的信息的方法）的系统，在你的计算机和办公室网络之间建立更安全的连接。个人 `VPN` 还允许人们通过创建一个指向第三方地点的不可读链接，保护他们免受互联网上监视他们。


  ### DLP

  `DLP` – 数据丢失防护（Data Loss Prevention）。你是否想过如果有人从你的医生诊所拿走了你的医疗记录会发生什么？好吧，`DLP` 计划会解决这个问题。这是一个允许重要数据受到保护和恢复的计划。假设你想确保客户记录不会落入竞争对手手中；`DLP`
  计划将有助于确保这一点。这是一个确保数据不丢失或被窃取的计划。良好的 `DLP` 系统应该保护你的信息免受试图窃取的攻击。


  ### EDR

  `EDR` – 终端检测与响应（Endpoint Detection and Response）。电脑就像是网络的培养皿（这个比喻很棒吧？）。恶意程序和病毒往往生长在那里，这意味着那是大多数坏事情发生的地方。保护电脑和手机是
  `EDR` 的主要目标。在观察网络安全时，了解终端发生了什么至关重要。


  ### XDR

  `XDR` – 扩展检测与响应（Extended Detection and Response）。所以，当你让所有的终端都感到安全时，其他部分呢？为了不被遗漏，安全世界扩展了保护，不仅包括终端，还包含了中间的所有设备。


  ### IDS/IPS

  `IDS/IPS` – 入侵检测系统/入侵防御系统（Intrusion Detection System/Intrusion Prevention System）。有时你希望在大门口有一个“大狗”。你的
  `IDS/IPS` 就是那个试图把所有人挡在外的狗。当你拥有入侵检测和防御时，你正在主动阻止坏事的发生并确保只有好东西进入。


  ### MSSP

  `MSSP` – 托管安全服务提供商（Managed Security Service Provider）。有时你只需要或希望别人来照顾你。`MSSP` 会处理你所有的安全问题，但重要的是你不能仅仅把安全交给别人就希望万事无忧。你需要与伙伴建立关系，并确保积极参与保护对你重要的东西。


  ### NIST

  `NIST` – 美国国家标准技术研究院（National Institute of Standards and Technology）。如果你只想让别人告诉你该做什么，就去那里。`NIST`
  是一个建立安全和合规标准的政府机构。所以，当你想要被告知你需要做什么时，只需问问 `NIST`，他们就会告诉你。


  ### SIEM

  `SIEM` – 安全信息和事件管理（Security Information and Event Management）。你是如何知道自己被攻击的？好吧，这就是
  `SIEM` 系统上场的地方。这个系统会收集有关你的计算机或网络的信息，并判断是否存在威胁或潜在攻击。`SIEM` 系统使用实时监控在攻击者攻击时发现并响应他们，让你在过程中感到更加安全。






  **SOC** – 安全运营中心（Security Operations Center）。安全人员都住在哪里？这很简单！他们住在 `SOC` 里……也许住在那个穿鞋子的老太太旁边？安全人员把时间花在
  `SOC` 里，观察是否有坏人正试图对你的电脑做些坏事。


  **SSO** – 单点登录（Single Sign-On）。密码、密码、还是密码！我们似乎到处都要输入密码，但事实并不总是如此。单点登录顾其实名义——登录一次即可访问你需要的一切！是的，太感谢了！


  **RMM** – 远程管理与监控（Remote Management and Monitoring）。就像远方的超人一样，`RMM` 允许通过远程监控，在几英里之外让你的系统持续运行。你甚至不需要打
  `Uber`（或者穿上裤子）就能那里！


  **BDR** – 备份与灾难恢复（Backup and Disaster Recovery）。我 30 年的照片都去哪儿了？！发现所有珍贵或重要的信息都消失无踪，可能是令人恐惧的。有了
  `BDR`，你可以恢复所有丢失的记录。这应该能让你今晚睡得安心心些！


  # 第 20 章


  # 感谢并欢迎光临


  ![](img/image-20-1.jpg)


  网络安全可能很麻烦，但它也至关重要。一旦你习惯了这样做，甚至不需要思考它。我可能是在说老话了，但你们还记得他们第一次告诉我们必须习惯系安全带吗？对于更年轻的读者来说：是的，曾有一段时间安全带仅仅是可选的，如果你能想象得到的话。我们曾对此激烈反抗，说这很痛苦，而且是对我们权利的侵犯。现在，我们想都不用想就系上了安全带。只要给一点时间，我们能适应的事情真是令人惊叹。


  不要指望网络安全在开始时会轻松，但一旦你开始将其成为公司文化的一部分，它就会变成一种习惯，就像系安全带一样。


  你和我一起经历了一段奇妙的旅程，通过故事和见解了解你为什么应该以及如何实施网络安全。未来如何发展取决于你。你可以成为那个相信事情永远不会发生在你身上并希望愿望成真的人，也可以成为那个让安全成为你生活一部分的人——再次强调，不是接管你的生活，只是成为它的一部分。网络攻击不是“是否”的问题，而是“何时”的问题。你准备好了吗？


  “放松（RELAX）”是你生活中将面对的所有危机的答案。在高压力情况下停顿片刻，可能是良好结果与糟糕结果之间的区别。草率行事几乎会导致不尽人意的结果，因为你是在`react`反应）而不是行动，是在跳跃而不是思考。


  记住，双方在让你保持恐惧方面都有财务利益——从白帽黑客（好人）到黑帽黑客（坏人）。如果你在恐慌中做出反应，你可能会花费更多的钱来尝试修复问题，或者更糟，让问题进一步恶化。通常，在我们退后一步并深呼吸之前，我们并看不到问题的全貌。


  让我和你们分享最后一个故事吧。这不是一次网络攻击，而是一次服务器故障，发生在我书中之前提到的那家制药公司。当时我还是个新手，他们正面临着主服务器几乎每天都崩溃的大问题。我决定在一个周日过去对系统进行快速重启。看着我的妻子
  `Lucy`，我说：“这只需要五分钟。你介意我们过去一下吗？”由于她是一个如此优秀的女性，她非常赞同。


  在停车场停下后，我请她跟我上去，就在我的办公室里等一下，办公室就在服务器房对面。我走进去开始重启过程，但结果并没有我预期的那样。服务器显示了一条错误信息并无法启动。我倒在地上，感到一种巨大的绝望感袭来。像守护天使一样，`Lucy`
  冲了过来。“Ken，怎么了？”她问。我告诉她服务器又崩溃了，我不知道如何修复。我处于恐慌和崩溃的边缘。


  “呼吸，我们会度过的。”她的话立刻让我冷静了下来。因为 `Lucy` 的帮助，我才能够让服务器重新运行。


