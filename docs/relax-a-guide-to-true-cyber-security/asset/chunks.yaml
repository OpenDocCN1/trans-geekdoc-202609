    I think the first step will surprise you: RELAX. Don’t act in a panic. Instead,\
    \ take a moment to take a deep breath and start to review where you are. In this\
    \ case, the NIST Framework we just reviewed is a wonderful starting point, but\
    \ also remember that small wins help you to reach bigger wins.\n\nAfter you are\
    \ relaxed and ready to go, then think about where you need or want to be. Do you\
    \ have compliance reasons for cyber security, like PCI, CMMC, HIPAA, ITAR, etc.?\
    \ If there are compliance reasons, then you’ll have a strong framework for what\
    \ you need to do. Understanding this makes things easier to define, even if they\
    \ are sometimes (or often) a pain to do.\n\nIf you don’t have a compliance reason\
    \ for cyber security, think about what you’re concerned about. Do you think you\
    \ could lose your business, lose client information, have to pay an outrageous\
    \ ransom? This step will help remind you why you’re working towards increased\
    \ cyber security. I know that sometimes we all wish cyber security wasn’t needed,\
    \ and in a perfect world it wouldn’t be, but as you well know, we are *not* in\
    \ a perfect world.\n\nNow that you have your reason *why*, you’re able to build\
