    \ you think may be hurt or affected by the attack. It is hard to admit, but the\
    \ more people that you contact to inform about an attack, the more effective you\
    \ will be in stopping the attack from spreading.\n\nLet’s take a moment to show\
    \ you how NIST is connected to what we have been learning about in the rest of\
    \ our journey. Remember our wonderful OTP CEO Lucy, you know, the wife that’s\
    \ about to slap me for still talking about her email mistake? As a reminder, her\
    \ email was hacked, and emails were being sent from her account (by the hackers)\
    \ that were asking customers to make payments. Within five minutes, we knew about\
    \ the attack and started to enact our cyber response plan. We changed her email\
    \ password, fixed the forwarding rule they had set up, and then we did something\
    \ that some people questioned us for: we sent out email notifications telling\
    \ everyone that we were breached and that they should not respond to any of the\
    \ emails that came from our CEO’s account.\n\nThe response was almost instant;\
    \ many people told us that they were so glad that we let them know, but others\
    \ questioned why a cyber security company would tell people that they were hacked.\
    \ We were emphatic about this because, as a cyber security company, we have a\
    \ higher standard to live up to. If we told others that they have to notify people\
    \ when they get breached, how could we not do that as well? Since we had used\
    \ the NIST Framework, we were ready for the attack that hit our CEO. The act of\
    \ reporting to others about a breach should never be seen as embarrassing, but\
    \ rather, seen as good practice.\n\nThe last step in NIST’s Framework is recover.\
    \ This is a vital step that can help you regain a sense of control after an attack.\
    \ I’ve had to help people feel whole again after they were a victim of a cyber\
    \ attack because these attacks can cause you to feel helpless and violated. The\
    \ recovery process is more than just getting your data back and getting things\
    \ working again; it’s about regaining a sense of control and feeling safe after\
    \ being violated.\n\nIn addition to recovering lost information and repairing\
    \ compromised equipment, you’re going to want to review what happened. This is\
    \ where training your team on what happened and how to stop it can be valuable.\
    \ After an attack, everyone is more focused on the steps to prevent it from happening\
