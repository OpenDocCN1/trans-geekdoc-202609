- fmt: "\nI know we all laugh at the foolish people who’ve sent money to Nigerian\
    \ princes that promise to send you millions of dollars if you’ll just send them\
    \ a few thousand to process the transfer. While easy to laugh at, there are countless\
    \ people every day that fall prey to similar phishing tactics.\n\nHackers are\
    \ adjusting their attacks and making them more targeted and devious, as in the\
    \ case of this company that I just shared. They will use the names of trusted\
    \ people, like vendors or customers, to get you to give out bank accounts, email\
    \ addresses, or other vital information. It is important to always remain vigilant.\n\
    \n# CHAPTER 12\n\n## THE CALL CAME FROM INSIDE THE HOUSE\n\n![](images/image-12-1.jpg)\n\
    \nYou’re sound asleep when the familiar *ding* chimes on your phone, indicating\
    \ you’ve just received a text message. You sleepily wipe the crusties from your\
    \ eyes as you sluggishly open your text messages to reveal a message from an unknown\
    \ number. “*Congratulations! You’ve just won a $25 gift card! Just click on the\
    \ link to claim your prize!*” You don’t remember entering a drawing for it, but\
    \ it’s $25, right? Why not just take the money and run? Besides, it’s a text message;\
    \ it has to be safe, right? So, you click on the link to claim your prize…\n\n\
    You are now a victim of `smishing`. Smishing stands for `SMS phishing` (SMS is\
    \ nerd-speak for texting) and is one of the newest trends in cyber attacks. Hackers\
    \ realized that we were more protective of our emails, so they’re shifting to\
    \ where people spend more of their time—on their phones. The worst part is that\
    \ in a quest to get more of our time and attention, regular businesses are also\
    \ starting to send more text messages as well. You can see how this could easily\
    \ become overwhelming. This can lead us to do things that are bad for us, like\
    \ clicking on links that play directly into the hacker’s hand.\n\nIf you’re experiencing\
    \ a bombardment of text messages, it may be advantageous to do things like unsubscribe\
    \ from known lists, report the others as spam, or block the numbers. It’s also\
    \ important to remember never to click on a link in a text message from someone\
    \ you don’t know. If you didn’t expect it and don’t know who it is, the best approach\
    \ is to just ignore it. Hackers are always working to get you to let down your\
    \ guard and give up your valuable information.\n\nOh, but wait—there’s more! They’re\
    \ not done with your phone just yet. We also get to enjoy another form of phishing\
    \ attack called `vishing` or `voice phishing`. These attacks start out as calls\
    \ saying that the attacker is from Microsoft, or a government agency, or some\
    \ other organization.\n\nThis is a great time to tell you about the time the “IRS”\
    \ called me to “collect all the back taxes” that I apparently owed. It’s an interesting\
    \ tale about how I was late on $5,000 in taxes and how they were going to “help\
    \ me get right.” \n\nI was just finishing work with a client when my cell phone\
    \ rang; it was a blocked number and I answered it out of habit.\n\nA pleasant\
    \ voice with a foreign accent greeted me. “*Hello, this is Hamon with the IRS.\
    \ I’m calling you because you owe us $5,000 and we need to arrange payment*.”\n\
    \n“*I owe you $5,000? What is this regarding?*” I responded a little confused\
    \ because I was not the CFO of the company.\n\n“*Yes, sir. You’re late with your\
    \ taxes and must pay immediately*.”\n\nIt quickly dawned on me that this was *not*\
    \ a call from the IRS and that I did *not* owe any amount in taxes. It did, however,\
    \ give me a chance to have some fun.\n\n“*Oh my! I didn’t realize that I was late\
    \ with my payment. What should I do to make it right? I can go back to my office\
    \ right now and have my accountant contact our IRS field agent and get him a payment*,”\
    \ I said with a knowing smile.\n\nWith a sound of panic in his voice, he responded,\
    \ “*No sir, you don’t want to do that. I’ll need you to settle this today. What\
    \ I need you to do is make a Bitcoin purchase and then transfer it to our `Accounts\
    \ Collectible`. I can walk you through the process. It’s very easy and you’ll\
    \ get this very damaging tax violation removed*.” \n\nI was quite certain that\
    \ the IRS was *not* taking Bitcoin to settle tax liability; they like to support\
    \ US currency. I quickly came up with a plan to have some fun and keep him from\
    \ hurting anyone else, at least for about an hour, exactly the amount of time\
    \ before I would be back in the office.\n\n“*Bitcoin?! I thought that was what\
    \ hackers used to extort money!*” I said with a false sense of fear.\n\n“*Don’t\
    \ worry sir, the IRS is only trying to make this process easier*,” he assured\
    \ me.\n\n“*I’m not sure what to do. Help me*,” I responded meekly.\n\nAt this\
    \ point, he told me to open a browser and go to a specific link. He then started\
    \ to lead me through the directions on how to purchase and transfer Bitcoins.\
    \ I played completely clueless. Each step of the way, I did it wrong and pretended\
    \ I couldn’t figure out where to click.\n\nAfter almost an hour, he said that\
    \ he could just log into my computer and do it for me.\n\nI responded, “*I don’t\
    \ think I should do that. I was told by my computer guy that I should never allow\
    \ anyone into my computer*.”\n\nWith growing frustration, he shot back, “*If you\
    \ don’t let me in then the IRS will have to foreclose on your house!*”\n\n“*My\
    \ house!*” I said stunned. “*Sir, we’re not allowed to give out badge numbers,*”\
    \ he said with an irritated tone.\n\n“I think there’s something wrong with this*.”\
    \ I was just pulling into the parking lot at the office.\n\n“*Sir!*” he said,\
    \ clearly angry with me. “*I need to get into your computer right now so I can\
    \ get the money you owe transferred. Now please give me your email so I can send\
    \ you the link*.”\n\nI’ll gladly do that if you can do just one thing for me:\
    \ tell me my name*.”\n\n“*What do you mean, sir?*” he asked.\n\n“*If you are the\
    \ IRS, then you know my legal name. Please tell me*.”\n\nThe phone went dead;\
    \ no more Hamon from the IRS. Even though he did start to get a little rude towards\
    \ the end, he certainly made the drive to the office fly by!\n\n## Protection\
    \ Tips\n\nHere are some tips when receiving unexpected calls about collections,\
    \ regardless of whether it’s the IRS or any other company or organization that’s\
    \ calling:\n\n1. Always ask for information in writing. You have a right to get\
    \ any outstanding bills in written form. The IRS will *never* directly call you\
    \ if they have not sent a written notice.\n2. Never pay on-spot and over the phone.\
    \ Some hackers have even gone so far as offer to stop at your house to pick up\
    \ payment! This is *never* legitimate. Ever.\n3. Ask for a phone number to call\
    \ them back, and then check to see if that phone truly does belong to a known\
    \ company (rather than an unlisted or unverifiable number). You’ll also want to\
    \ check your own files and records to see if you actually owe that company money.\n\
    4. IRS agents do not have badges. If you get a call from someone claiming to be\
    \ from the IRS, ask them for their badge number. If they truly are with the IRS,\
    \ they will know they don’t have badge numbers.\n5. Never make a payment you haven’t\
    \ personally verified, especially if they ask for Bitcoin. Bitcoin is an *untraceable*\
    \ method of taking your money, which is why hackers like to use it.\n"
