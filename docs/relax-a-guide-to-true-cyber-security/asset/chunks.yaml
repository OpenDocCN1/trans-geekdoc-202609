  raw: "There’s one last thing to remember in the password journey: your master password\
    \ for the password management system is your “golden ticket.” This master password\
    \ is the one that opens up and unlocks access to all your other passwords. In\
    \ other words, the master password “opens the gates to the castle.” You don’t\
    \ want greedy barbarians (hackers) to come knocking down those gates and pillaging\
    \ and destroying everything you worked so hard for, do you?\n\nIf a hacker is\
    \ able to hack your master password because you didn’t take the complexity of\
    \ passwords seriously, then they will have gained access to all your other passwords\
    \ as well. This master password needs to be complex and needs to be protected.\
    \ Personally, I write down my master password and keep it in a locked safe, or\
    \ security box.\n\nYou may be thinking “*But Ken, you’re a technology and cyber\
    \ security guy, why do you do this?*” Great question! Here’s the answer: If you\
    \ keep your password on your computer, you need to keep it in an encrypted file\
    \ in order to keep it safe. That encrypted file will need a password and you will\
    \ need to keep that password somewhere safe. Do you notice a trend here? Where\
    \ do you keep the encrypted file password—in another file? To date, there is nothing\
    \ as secure as safely-stored paper. So, having one master password written on\
    \ paper and stored securely, such as in a safe, is a strong step to take in increasing\
    \ your cyber security… just keep it to one.\n\nIt's also important to remember\
    \ that passwords are just the *first* line of defense, not the *last*. In the\
    \ next chapter, I’ll talk about multi-factor authentication (MFA) as an additional\
    \ layer to enhance your cyber security.\n\nCHAPTER 5 \n\n# DON’T FEAR THE FACTOR\n\
    \n![](images/chapter-5.jpg)\n\nWe all try to forget concepts like \"factors\"\
    \ from our high school math classes. It was a dark time when people would throw\
    \ strange symbols like \"*f(x)*\" at you and say complex phrases like \"*factor\
    \ that function*,\" or worse, \"*factor that polynomial*.\" It made no sense and\
    \ was undeniably confusing. You may be led to ask, \"*Why would I want to do multi-factor\
    \ authentication when I didn’t like doing a single factor in math class?*\"\n\n\
    Let me start by saying that this is *not* your high school factor. Multi-factor\
    \ authentication, or MFA in nerd-speak, is another way to keep people out of your\
    \ important files or accounts. I’ll admit, it can be annoying, but it’s an effective\
    \ tool to use.\n\nWhen you hear multi-factor authentication, what they’re talking\
    \ about is having two or more different ways to confirm your identity before gaining\
    \ access to your account. An example of multi-factor authentication would be entering\
    \ your password, as well as entering a code that the system sends via text message\
    \ to your cell phone. Many of you may already be familiar with this process when\
    \ logging into your bank accounts.\n\nIn this way, you have your password, and\
    \ you have a code text to your cell phone – something a hacker wouldn’t have access\
    \ to… unless they stole your phone as well. Not only would they have to hack your\
    \ password to your account, but then they’d also have to steal your phone, which\
    \ many today have biometric (face or fingerprint ID) or numeric (passcode) screen\
    \ locks. So, you can see how much more challenging this makes it for someone else\
    \ to gain access to your accounts using multi-factor authentication.\n\nWhile\
    \ this extra step can be annoying, especially when you’re trying to login to an\
    \ account and you forgot your phone at home on the kitchen table, just remember:\
    \ this extra step of authentication makes it that much more challenging for hackers\
    \ to gain access to your accounts and waltz off with all your hard-earned money\
    \ or sensitive data.\n\nIt’s also important to note that hackers aren’t just a\
    \ threat from other countries. Hackers can be found in *every* country, at *every*\
    \ level (from the weekend dabbler to the professional), and with a variety of\
    \ malicious and exploitative motives. Who knows, the hacker that takes your company\
    \ for everything you’ve got could even be that weird kid down the street that’s\
    \ just trying to prove to his hacker friends that he can. You just never know.\n\
    \nPerhaps you’re already familiar with multi-factor authentication but have seen\
    \ reference to 2FA, or two-factor authentication. For most of us, they mean the\
    \ same thing, but there are times when you may need more than just two modes of\
    \ authentication to gain access to your accounts or information.\n\nFor example,\
    \ let’s say you’re a secret government spy, or work in a top-secret lab (or any\
    \ number of other scenarios). In order to gain access to your lab or secret files,\
    \ you may need to enter your password, enter the code text to your phone, and\
    \ may even need to have those baby blue eyes scanned or your fingerprint analyzed\
    \ and confirmed. In these cases, there are more than two ways to authenticate\
    \ your identity. For the rest of us regular folk, MFA or 2FA is sufficient.\n\n\
    Let me share with you a personal story of why 2FA or MFA truly makes a difference.\
    \ I’d like to take you back to 2012, a time when we were all still blissfully\
    \ living with the belief that no one was trying to hack and steal our stuff.\n\
    \nLucy, my boss and wife, as well as the CEO of our company, decided to try to\
    \ reinstall her email client. Like most people, she went online and Googled ‘Outlook’\
    \ and proceeded to go to the first site that came up in the search. So far so\
    \ good, right? Afterall, millions of people do this very same thing every day.\n\
    \nClicking on this first site, she let the magical internet fairies take her to\
    \ the land of Microsoft so she could reinstall Outlook—or so she thought. She\
    \ didn’t notice that the link she *actually* clicked on was for M**a**crosoft,\
    \ *not* M**i**crosoft.\n\nThere on the page was the Outlook download button, just\
    \ waiting to be clicked. Everything looked legit and appeared to be Microsoft’s\
    \ official site, so she clicked the download button, not realizing she was downloading\
    \ a file from the hackers. The next step was to enter her email and password,\
    \ which she did—again, not realizing that she was on a hacker’s site.\n\nWithin\
    \ moments of entering her email and password, the hackers began their attack.\
    \ If that wasn’t bad enough, my technical team and I were in the process of rolling\
    \ out multi-factor authentication that same afternoon. Had we done this just hours\
    \ sooner, the entire attack would have been avoided.\n\nYou may be thinking, “*You’re\
    \ a cyber security company. Why on earth would you tell people that your CEO was\
    \ hacked?*” Why do I share this? Because *every* company, eventually, will face\
    \ hacks or other cyber attacks. *Every*. *Company*. What’s really important here\
    \ is how a company *responds* to a cyber attack. Do you, or those in your company,\
    \ know what to do if you’re cyber attacked?\n\nIn our case we, we immediately\
    \ implemented our email hack protocol. Within 10 minutes of Lucy’s hacker download,\
    \ we noticed really strange behavior from her account. Within 15 minutes, we had\
    \ Lucy start changing her passwords, contacting people about the hack, and fixing\
    \ the changes that the hackers were making within her account.\n\nEven though\
    \ we were able to respond so quickly to the attack, it didn’t stop hundreds of\
    \ emails from being sent out by the hackers. As you can imagine, we had a *lot*\
    \ of fun (insert sarcasm here) calling all those people to inform them that our\
    \ email was hacked. It did, however, show the value of a calm and rapid response.\
    \ Fortunately, no one clicked on any of the links in the emails sent out by the\
    \ hackers, and we were able to shut down their entire attack within 20 minutes."
