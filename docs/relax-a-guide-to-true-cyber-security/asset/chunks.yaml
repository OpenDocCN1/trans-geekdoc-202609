    ## 6. Have secure and private information encrypted on your computer.


    There are many good encryption programs that can make sure your information cannot
    be taken and read—or shared publicly.


    It’s important to remember that you always need to be adapting. Hackers have a
    vested interest in getting past your protections so that they can exploit your
    information—don’t let them.


    ## CHAPTER 14


    # COMPLIANCE CONUNDRUM


    ![](images/image-14-1.jpg)


    Do you remember the good ol’ days when all you had to do was take care of yourself?
    You weren’t required to meet `PCI` (Payment Card Industry) compliance standards
    or `HIPAA` (Health Insurance Portability and Accountability Act) to see patients.
    It seems like each day there are more and more requirements on how we should be
    conducting our businesses. These compliances come with their own pains and costs,
    and they are quickly becoming the standard for how we will have to conduct business
    moving forward.


    Those that don’t comply with expected standards may find themselves being publicly
    embarrassed. For example, if you’re a doctor and you have a security breach, you
    could end up on the `HIPAA` Wall of Shame (This really exists! You can find it
    here: `https://ocrportal.hhs.gov/ocr/breach/breach_report.jsf`) These actions
    are to force people to take these compliances very seriously.


    Let’s consider this true story of a doctor’s office— a story I’ve heard many times.
    It goes like this: “I don’t have to worry about `HIPAA` because the government
    wouldn’t shut down a small office like mine. It’s not a big deal, and no one wants
    my information anyways.” The doctor is proud of the fact that he didn’t have to
    worry about cyber attacks. In some ways, it was true, since `HIPAA` was focused
    on getting the big players compliant at the time. The problem is that cyber attacks
    are not always focused on the big players; they’re focused on the smaller players
    that don’t take the threat seriously.


    I will always love the episode of Scott Adams’ “Dilbert” comic strip that said,
    “Remember, you can’t spell compliance without ‘liance.’” For many of us, we just
    want to get the checkbox process done. It’s such an inconvenient process that
    we just want to put it behind us. As frustrating as it is, you need to know that
    you can’t just pass off the responsibility of compliance—or worse, thinking that
    you can `lie` about compliance. Think of it this way: if your accountant makes
    a mistake on your taxes, does the `IRS` go after your accountant, or do they go
    after you?


    Here''s an example of a company we worked with that implemented new compliance
    standards. The company recently moved to `SOC 2` (Service Organization Control)
    compliance. At first, my client told me that their company was very resistant
    to imposing the standards and controls that were needed to meet `SOC 2`. As he
    described it, everyone hated the process and it seemed to make things take so
    much longer to complete. Not long after they had implemented the controls, it
    ended up paying off in spades. The company had a large client that said they were
    not shipped equipment with the proper specifications, and they were not going
    to pay for the thousands of dollars in equipment that was sent.


    This is never a good thing for a business to hear but is even more devastating
    to a small business. My client’s team then went back to all the control documents.
    The problem is that cyber attacks are not always focused on the big players; they’re
    focused on the smaller players that don’t take the threat seriously.

