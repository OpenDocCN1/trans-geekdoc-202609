    \ Sunday to perform a quick reboot of the system. Looking at Lucy, my wife, I\
    \ said, “*This will only take five minutes. Do you mind if we stop in?*” Being\
    \ the wonderful woman that she is, she was onboard with it.\n\nStopping in the\
    \ parking lot, I asked her to come up with me and just wait in my office which\
    \ was just across the hall from the server. I went in and started the reboot process,\
    \ but things didn’t go the way I had expected. Instead of starting up again, the\
    \ server showed an error message and would not start. I thought that I had fixed\
    \ everything, but here I was again, and the server would not start.\n\nI fell\
    \ to the floor and had an overwhelming sense of doom wash over me. How was I going\
    \ to fix this? The entire day would be lost. I felt helpless and alone—but I wasn’t\
    \ alone—like a guardian angel, Lucy had seen me slump to the ground and came rushing\
    \ over.\n\n“*Ken, what’s wrong?*” she asked.\n\nI told her that the server had\
    \ crashed again, and I had no idea how to fix it. I was shaking and on the verge\
    \ of tears.\n\n“*Just breathe with me, we’ll get through this. You just need to\
    \ RELAX*.” Her voice instantly calmed me down. It was at that moment that I realized,\
    \ when in a crisis, RELAX was always the first step. She had just given me a lifelong\
    \ way to address crisis and disaster.\n\nTo wrap up my story, I *was* able to\
    \ get the server back up and running. Because Lucy had helped me to RELAX, I was\
    \ able to find the problem and fix it. It was several hours of work, but in the\
    \ end, her words, which always sit in the back of my mind, have helped me to deal\
    \ with hundreds of disasters in a calm and focused manner.\n\nIt is my sincerest\
    \ wish that I’m able to help you RELAX when you hear about cyber attacks. Yes,\
    \ they’re terrible things to face, but panic makes them worse, and hackers know\
    \ that. Staying calm will help you to make better decisions and recover faster\
    \ from such attacks. Please reach out and share how you deal with cyber attacks\
    \ and stress (or what you thought of the book). You can contact me by emailing\
    \ RELAX@ontechpartners.com. I’d love to hear from you! Remember: RELAX and stay\
    \ cyber secure!\n\n# ABOUT THE AUTHOR\n\n![](images/kens-picture.jpg)\n\nHi! I’m\
    \ Ken Fanger, and the book that you’re holding has been a lifetime in the making.\
    \ I’ve worked in technology and cyber security for the last 30 years with pharmaceutical\
    \ companies, legal offices, medical establishments, nonprofits, and all levels\
    \ of government.\n\nI started a cyber security and compliance company with my\
    \ wife and partner, Lucy, in 1994. She’s the CEO of On Technology Partners and\
    \ I’m the President. And yes, it really is great having your wife as your boss—at\
    \ least that’s what she tells me!\n\nWorking in the industry as long as I have,\
    \ I’ve amassed a great deal of experience and examples of what to do—and just\
    \ as importantly, what *not* to do. Many of our clients and customers also have\
    \ compliance and security standards they must adhere to, such as HIPAA, NIST,\
    \ or the CMMC standards from the Department of Defense.\n\nWhile these security\
    \ standards might seem like a royal pain in the you-know-what, they help to protect\
    \ everyone from the growing threats of cyber attacks– from “the average Joe” to\
    \ vendors, businesses and institutions, all the way up to the highest levels of\
    \ government. As a CMMC-RP (Cybersecurity Maturity Model Certification-Registered\
    \ Practitioner)—it’s a mouthful, I know— I help new and existing contractors to\
    \ meet the Department of Defense’s new cyber security requirements for CMMC. It’s\
    \ all about being more cyber secure at every step of the way.\n\nSo, no matter\
    \ who you are or what industry you’re in, there’s something in this book for you—and\
    \ unlike trying to teach an old dog new tricks, it’s never too late to learn.\
    \ When I’m not mentoring others or helping companies with their cyber security\
    \ needs, you can find me writing my sci-fi novel, hiking with Lucy to find local\
    \ waterfalls, or helping children with mental health and emotional concerns.\n\
    \nTo learn more about cyber security or compliance standards, please visit OnTechnologyPartners.com."
