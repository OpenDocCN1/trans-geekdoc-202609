    \ of the contract that you won. Here’s one example of such a payment for “liance”:\
    \ Cisco had to pay $48 million under the False Claims Act.\n\nIt is important\
    \ for you to understand that you can’t just give away your requirements to be\
    \ compliant or lie about your compliance, either. In order to help you meet your\
    \ compliance goals, I strongly suggest working with someone. Just remember that\
    \ they’re your partner, not your replacement. You must be a part of the process\
    \ and be involved in protecting your organization; anyone else is just there to\
    \ help guide you.\n\nCHAPTER 15 \n\n# PUT IT IN WRITING\n\n![](images/image-15-2.jpg)\n\
    \nDo you remember your first day at your new job? Can you remember being given\
    \ that dreaded Employee Manual? I remember (many years ago) when I started my\
    \ first day at a Fortune 500 company. I was sitting in my cubicle and in walked\
    \ this friendly HR representative with a very large book in her hands. My enthusiasm\
    \ plummeted as I read “Employee Manual” on the cover. She handed it to me and\
    \ explained how important it was for me to read the *entire* book, as they would\
    \ expect that I knew it.\n\nIt was a truly stunning moment. There I was, flush\
    \ with all the excitement of a new job, ready to be an excellent employee—and\
    \ then, THE BOOK arrived. It was a big, blue binder with over 200 pages of all\
    \ the things I was not allowed to do. You could feel the joy being sucked right\
    \ out of the place. There was never a chance I was going to read that thing!\n\
    \n“*Thank you*,” I said to the cheerful HR woman, knowing full well where that\
    \ book was going. The moment she left my cubicle, I took that big, ridiculous\
    \ book and stuck it on the lowest shelf that I had, relegating it to a dark tomb,\
    \ never to be seen again."
