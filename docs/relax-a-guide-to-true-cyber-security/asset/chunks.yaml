    There’s one last thing to remember in the password journey: your master password
    for the password management system is your “golden ticket.” This master password
    is the one that opens up and unlocks access to all your other passwords. In other
    words, the master password “opens the gates to the castle.” You don’t want greedy
    barbarians (hackers) to come knocking down those gates and pillaging and destroying
    everything you worked so hard for, do you?


    If a hacker is able to hack your master password because you didn’t take the complexity
    of passwords seriously, then they will have gained access to all your other passwords
    as well. This master password needs to be complex and needs to be protected. Personally,
    I write down my master password and keep it in a locked safe, or security box.


    You may be thinking “*But Ken, you’re a technology and cyber security guy, why
    do you do this?*” Great question! Here’s the answer: If you keep your password
    on your computer, you need to keep it in an encrypted file in order to keep it
    safe. That encrypted file will need a password and you will need to keep that
    password somewhere safe. Do you notice a trend here? Where do you keep the encrypted
    file password—in another file? To date, there is nothing as secure as safely-stored
    paper. So, having one master password written on paper and stored securely, such
    as in a safe, is a strong step to take in increasing your cyber security… just
    keep it to one.


    It''s also important to remember that passwords are just the *first* line of defense,
    not the *last*. In the next chapter, I’ll talk about multi-factor authentication
    (MFA) as an additional layer to enhance your cyber security.


    ## CHAPTER 5


    # DON’T FEAR THE FACTOR


    ![](images/chapter-5.jpg)


    We all try to forget concepts like "factors" from our high school math classes.
    It was a dark time when people would throw strange symbols like `f(x)` at you
    and say complex phrases like `factor that function`,” or worse, "`factor that
    polynomial`.” It made no sense and was undeniably confusing. You may be led to
    ask, "*Why would I want to do multi-factor authentication when I didn’t like doing
    a single factor in math class?*”


    Let me start by saying that this is *not* your high school factor. Multi-factor
    authentication, or MFA in nerd-speak, is another way to keep people out of your
    important files or accounts. I’ll admit, it can be annoying, but it’s an effective
    tool to use.


    When you hear multi-factor authentication, what they’re talking about is having
    two or more different ways to confirm your identity before gaining access to your
    account. An example of multi-factor authentication would be entering your password,
    as well as entering a code that the system sends via text message to your cell
    phone. Many of you may already be familiar with this process when logging into
    your bank accounts.


    In this way, you have your password, and you have a code text to your cell phone
    – something a hacker wouldn’t have access to… unless they stole your phone as
    well. Not only would they have to hack your password to your account, but then
    they’d also have to steal your phone, which many today have biometric (face or
    fingerprint ID) or numeric (passcode) screen locks. So, you can see how much more
    challenging this makes it for someone else to gain access to your account.

