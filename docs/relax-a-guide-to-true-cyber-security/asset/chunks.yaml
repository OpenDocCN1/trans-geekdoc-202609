    \ their own language. It’s true, though— we do have a whole list of TLA, or three\
    \ letter acronyms. I love the fact that a friend of mine defined all our crazy\
    \ acronyms *with* an acronym. Unfortunately, I sometimes feel that cyber security\
    \ professionals use all these acronyms as a way to keep you confused.\n\nI’ve\
    \ gathered some of the more common acronyms to make it easier for you to understand\
    \ what all those cyber nerds are truly talking about. I’ve also tried to explain\
    \ their meanings in terms that “the average Joe or Jane” will understand. I don’t\
    \ include myself in that list because I’ve been sucked into the dark side of acronyms.\
    \ I realized this one day when I was talking to a group of businessmen and women\
    \ at a networking event.\n\nWe were all sitting together and talking about what\
    \ makes each of us different. I was so proud to stand up and say, “*We’re the\
    \ Non-MSP. We’re working to make sure you’re part of the network journey*.” I\
    \ waited for everyone to tell me how great my vision of being different from all\
    \ the other MSPs in the world was.\n\nSilence hit me as everyone looked at me\
    \ with the most confused expressions I had ever seen. Then a woman stood up and\
    \ asked, “*What’s an MSP?*” I was devastated. I had worked so hard to be different\
    \ in my industry that it didn’t even occur to me that most people outside of it\
    \ wouldn’t know what an MSP was. For the record, MSP stands for Managed Service\
    \ Provider.\n\nIt was clear that I was not speaking the language of my customers;\
    \ I was speaking the language of my industry. In all my trade shows and technical\
    \ journals, they talked about the MSP journey and MSP services, to the point where\
    \ I figured that everyone knew what it was. No one outside the industry did. After\
    \ that day, I realized that we all can fall into this trap of speaking in our\
    \ own industry language, not realizing that it’s complete gibberish for most people\
    \ outside our industry.\n\nI’ve included this section to help you understand some\
    \ of the jargon a cyber security person may say to you. This is obviously not\
    \ a complete list of all terms that cyber people use, but it will give you a good\
    \ reference to start. I don’t expect you to memorize them, but rather, have a\
    \ place to look them up when you hear them.\n\n**CMMC** – Cyber Maturity Model\
    \ Certification. Have you ever wanted to contract with the government? Well, this\
    \ won’t make you more excited (but it *is* necessary). CMMC is the new standard\
    \ from the Department of Defense to assure that companies have at least a basic\
    \ level of cyber security and protection. It’s just one more thing that the government\
    \ expects you to do… beyond death and taxes that is.\n\n**MFA/2FA** – Multi-Factor/2-Factor\
    \ Authentication. Like most people, you’ve probably had more than one occasion\
    \ where you’ve thought: “*Passwords? I don’t need another stinking password!*”\
    \ Well, now you need *even more* than a password. MFA requires you to have two\
    \ or more different criteria to log into your account. The good news is that many\
    \ of us already have this authentication method with our banks and other financial\
    \ institutions. You’ll know if you have MFA because when you log into a site,\
    \ it will ask you for your password and, for example, to enter a code that is\
    \ sent to your mobile phone. I know you hate having to do this, but trust me,\
    \ it makes it much harder for a hacker to gain access to your accounts because,\
    \ not only would they need to hack your password, but they would also need to\
    \ steal or otherwise gain access to your phone to retrieve the verification code.\
    \ You can see how much more difficult this would make it for your account to be\
    \ hacked.\n\n**VPN** – Virtual Private Network. Remember when millions of people\
    \ began working from home at the start of the pandemic? Well, many of us quickly\
    \ found out that was a very unsafe way to work. That’s when we started to implement\
    \ VPNs. VPNs are a system that uses encryption (a method that makes your information\
    \ unreadable to other people) to create a safer connection between your computer\
    \ and the office network. A personal VPN also allows people to have protection\
    \ from people watching them on the internet by creating an unreadable link to\
    \ a third-party location.\n\n**DLP** – Data Loss Prevention. Ever wonder what\
    \ would happen if someone took your medical records from your doctor’s office?\
    \ Well, a DLP Plan would address this. It’s a plan that would allow for the protection\
    \ and recovery of important data. Let’s say you want to make sure that your client\
    \ records don’t end up in the hands of a competitor; a DLP Plan would help ensure\
    \ that. This is a plan and processes that make sure data is not lost or stolen.\
    \ A good DLP system should protect your information from both accidental losses\
    \ and “bad actors” (aka: hackers) trying to steal your information.\n\n**EDR**\
    \ – Endpoint Detection and Response. Computers are like the petri dish of your\
    \ network (great visual, right?). Bad programs and viruses tend to grow there,\
    \ meaning that is where most of the bad things happen. Keeping your computers\
    \ and phones safe is the primary objective of EDR solutions. When looking at cyber\
    \ security, understanding what is happening on the endpoints is vital.\n\n**XDR-**\
    \ Extended Detecting and Response. So, you have all the endpoints feeling safe,\
    \ but what about the rest? Not to feel left out, the security world enhanced protection\
    \ to now include not just the endpoints, but all the equipment in between.\n\n\
    **IDS/IPS** – Intrusion Detection System/Intrusion Prevention System. There are\
    \ times when you want to have that ‘big dog’ at the front gate. Your IDS/IPS is\
    \ that big dog that is looking to keep everyone out. When you have Intrusion Detection\
    \ and Prevention, you’re actively keeping out bad things and watching that only\
    \ good things get in.\n\n**MSSP** – Managed Security Service Provider. Sometimes\
    \ you just need (or want) someone else to take care of you. The MSSP will take\
    \ care of all your security issues, but it’s important to remember that you can’t\
    \ just pass security off to someone else and hope everything is good. You need\
    \ to *partner* with someone and make sure that you are actively involved in securing\
    \ what is important to you.\n\n**NIST** – National Institute of Standards and\
    \ Technology. This is where to go if you just want someone to tell you what you\
    \ should do. NIST is a government agency that builds security and compliance standards.\
    \ So, when you want to be told what you need to be doing, just ask NIST and they’ll\
    \ tell you.\n\n**SIEM** – Security Information and Event Management. How do you\
    \ know you’ve been attacked? Well, that’s where a SIEM system comes in. This system\
    \ will collect information about your computer or network and determine if there’s\
    \ a threat or potential attack. SIEM systems use real-time monitoring to find\
    \ and respond to attackers— as they are attacking— letting you feel safer as you\
    \ go."
