    After that, I, as a technician, would be at many people’s cubicles and see the
    Big Blue Book sitting either high or low, but never read, never even opened. I
    know that it’s a great checkbox for companies, but they’re never used or read
    by employees. It was lawyer fodder, put there to cover the behind of the company,
    but in no way helping to change behavior.


    This is `not` the way to create policies that you want employees to use, and policies
    `should` be used. Let’s start with why you want to have policies. Policies are
    to help assure that your team does the same process the same way. In the cyber
    world, this could mean making complex passwords or not taking vital documents
    home with you. With the understanding that policies exist to help ensure your
    team performs vital tasks the same way, ask yourself this question: Are `you`
    going to read two hundred pages of policies? I think we all know the answer. That’s
    why my Big Blue Book of policies became my Big Shelf Holder of policies, never
    again to see the light of day.


    Policies are also going to be required to meet a variety of compliance standards,
    regardless of your industry. Again, this is a good thing. If you remember to make
    it easy for people to `read` the policy, then they’ll be more likely to `follow`
    the policy.


    Let’s take one more journey around policies, this time, going back to when I worked
    at a pharmaceutical company. It’s important to remember that pharmaceutical companies
    are heavily restricted, and their policies must be followed very closely; the
    FDA demands this to be the case.


    As a young network administrator, I was responsible for the life of the network
    and to make sure that everything worked and was protected. One of my roles included
    the backup of all important data.


    The company had a policy for how to perform backups so, being the good employee
    that I was, I went and asked for the policy. My manager told me (and this is not
    a joke), “`I can’t give you that policy because, per the policy, you have to be
    director-level or above to see the backup policy`.”


    I was stunned into silence. I was so stunned that I didn’t even ask the most obvious
    question: `How was I supposed to follow a policy that I was not permitted to see?`
    I left my manager’s office and went back to my desk.


    For the next hour, I sat there and thought about what I was just told—an entire
    hour of wasted time in stunned silence. In the end, I created and implemented
    my own backup process using industry standards and off-site backups, but to this
    day, I have no idea if it met the requirements of the company policy.


    I share this example because it’s vital for you to realize that if you don’t give
    employees clear and easy policies to follow (and access to them), then they’ll
    make up their own policies and processes, and they won’t always end as well as
    the ones I made for that pharmaceutical company.


    Here are some tips to remember when creating a policy:


    1. **KISS**: `K`eep `i`t `S`imple, `S`upid`. Basically, create policies that are
    clear and concise.

    2. Clearly define the audience that needs to follow the policies.

    3. Include the name of the person or committee that wrote the policy.

    4. Keep a log of policy changes and dates with the policy.

    5. Review the policy each year.

    6. Ensure proper training and access to the policies.


    Policies can be a great way to support a corporate culture and protect you if
    something goes wrong, but they don’t help anyone if they sit in a big blue book,
    unread, on a shelf collecting dust.


    ## CHAPTER 16


    # GET ON THE TRAINING TRAIN


    ![](images/image-16-2.jpg)


    When we were babies, we were all adorable blank slates. After that, we started
    to learn and learn quickly. Learning is a life-long process that should never
    end. Unfortunately, there are many managers out there that think a person should
    not need to learn but should already know.


    Training is the best way to ensure that your team is current and on the same page.
    It can be costly, but it does pay off in the long run when it’s done right. If
    you have employees that want to learn, encourage them—they’ll be some of your
    best employees.


    Many companies don’t think of training as making the company better, they think
    of it as a danger to losing employees. While it is true that you could lose your
    employees if you train them, you’ll also lose them if you don’t train them. For
    example, I was a warehouse developer for a trucking company when the network administrator
    suddenly quit. The position was open, and I wanted to take on a new challenge,
    so I proceeded with trainings on `Novell NetWare` (a now discontinued network
    operating system).


    Using the funds that were available to me, I began my coursework. After beginning
    my first class, my manager came in to speak with me. I think we can all agree
    that it’s almost never a good sign when the manager says he wants to talk to you.
    He sat down in my cubicle and told me there was a problem: the company didn’t
    want me to complete the `Novell` classes because it would make me too valuable,
    and I would leave the company.


    I remember that statement: I would be `too valuable`. It seemed to me that being
    valuable would be something they wanted, but I let my manager continue without
    saying a word. I listened as he told me that my training was a threat to the company,
    and that I would just take the training and leave.


    After he finished with his concerns that I would leave, I told him I was willing
    to sign an agreement to pay back the company if I were to leave within the next
    year. He told me he just couldn’t take that risk and that I was too valuable.
    Realizing they would never train me to be even more valuable employee, I ended
    up leaving the company. It was a simple decision when I realized my future goals
    would require training (and working with companies that valued and encouraged
    development).


    Training helps keep your team up-to-date on the latest trends and keeps your company
    competitive. It’s dangerous to think that not training your employees will assure
    they stay with your company. In many cases, as I demonstrated with my story, it
    will do the exact opposite. No one wants to stay where they can’t grow—I certainly
    didn!


    Now that we agree that training is good, we also know that all trainings are not
    created equally. I know I’ve had to sit through some of the painfully dull trainings
    in the world! Cyber security training can be so boring and dry! I’ve sat though
    the storytelling of losses hundreds of times.


    The things those cyber security people had to say just didn’t matter to me. I
    don’t care that 45,000 cyber attacks just happened in the last seconds, or that
    companies have lost millions in each attack. Cyber security training needs to
    be specific and personal. I want to know what it could cost `me` and how `I` can
    address it.


    The Federal Trade Commission `FTC` has six tips for conducting cyber trainings
    that I think everyone should adhere to. I use them when I’m designing my trainings,
    and you’ll want to see that any vendor you use is also using this framework. It’s
    very unlikely that you’re a multi-billion-dollar company, so why bother telling
    you that multi-billions of dollars are being lost in cyber attacks—it’s far more
    effective to tell you what `you` could wind up losing.


    The first of the `FTC`s tips for conducting cyber trainings is to set a specific
    objective. Your team doesn’t care about every little issue in the world, they
    care about what can hurt their job, your company, and their bank. Define what
    exactly you want them to learn. If you’re looking to make sure they don’t click
    on email links, put that into your training. Make sure to be clear and focused,
    with a limited number of behaviors that you want them to learn.

