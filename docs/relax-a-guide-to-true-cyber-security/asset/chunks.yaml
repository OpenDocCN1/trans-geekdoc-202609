    \ I was assigned to review code from an earlier programmer. As I was going through\
    \ the code, I found something. The code was used to move the money from the general\
    \ bank account to the payroll bank account each week. This energy company didn’t\
    \ want to have money sitting in a checking account longer than it needed to because\
    \ they could make money on the interest, and that was a *lot* of money.\n\nHere\
    \ was the crux of the situation: the code had been written with a bug. The prior\
    \ coder had made a mistake that resulted in the program stopping before it would\
    \ move the money to pay the employees of a large division, which meant that the\
    \ money was not being transferred at all. This resulted in almost $70 million\
    \ in missed payroll and cost anywhere from hundreds of thousands to millions of\
    \ dollars in penalties with each payroll cycle. Because of the size of the energy\
    \ company, this was just recorded as bank fees, but it was costing the company\
    \ millions of dollars each year.\n\nI then wrote a correction, a patch, to that\
    \ code and deployed the new version. This newly adjusted code then went into production\
    \ and the proper amount of money was deposited into the payroll account. This\
    \ patch resulted in millions of dollars in savings for the company each year.\n\
    \nNot all patches are to fix errors or vulnerabilities (code that allows hackers\
