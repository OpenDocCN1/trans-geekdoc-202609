    \nCHAPTER 4 \n\n# WHAT’S THE WORD?\n\n![](images/chapter-4.jpg)\n\nPasswords!\
    \ Passwords! Passwords everywhere! I can’t possibly think of another one! More\
    \ than eight characters, upper case, lower case, numbers, special characters…\
    \ aaah! How many passwords do we *really* need in life? We’ve got passwords for\
    \ our bank accounts, Netflix, HBO Max, and Disney Plus. Then there’s online services,\
