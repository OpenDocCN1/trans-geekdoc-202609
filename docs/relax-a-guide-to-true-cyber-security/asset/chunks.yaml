    \ will tell you that’s a *very* bad idea.\n\nIt's just not functional or practical\
    \ to try to remember the dozens (or hundreds) of passwords that you use each day.\
    \ To make matters worse, many sites have auto login functionality that allows\
    \ you to save (and then forget) your password, so you don’t have to enter it each\
    \ day.\n\nIt’s important to remember that passwords are your first line of defense.\
    \ While on one hand they keep much of your information safe, there’s also just\
    \ too many to realistically remember. I remember when I worked in the pharmaceutical\
    \ industry, we had a policy requiring us to change our passwords every ninety\
    \ days. What made it even worse was the fact that you couldn’t use any portion\
    \ of the previous passwords in the new password.\n\nThis was a great idea in theory,\
    \ but a really bad one in practice. You see, people aren’t very good at remembering\
    \ passwords, especially dozens (or hundreds) of them that are changing every ninety\
    \ days. Ultimately, we’re going to forget them.\n\nI still remember spending at\
    \ least one full day at the end of each quarter resetting people’s passwords because\
    \ they forgot what they had changed them to. What made matters even worse was\
    \ that they then started writing their passwords down and sticking them on their\
    \ computer screens or trying to be clever by “hiding” their password under their\
    \ keyboard! Both are terrible options and should *never* be done.\n\nPasswords\
    \ are vital to your data protection, but it’s unrealistic to think you can remember\
    \ dozens or hundreds of unique and increasingly complex passwords. This is the\
    \ perfect time to talk about using a password management system. I use LastPass\
    \ to manage my passwords, but there are hundreds of different options available\
    \ to you.\n\nThe advantage of a password management system is that you can create\
    \ (or have the system auto-generate) complex passwords for any site you visit\
    \ that requires one. The password management system automatically remembers and\
    \ stores this login information so that you don’t have to.\n\nDo you already have\
    \ an account or login information for a site? No problem! You can add and store\
    \ your credentials for each site and account that you have. The next time you\
    \ visit that site, the password management system automatically enters your saved\
    \ username and password for the site for you. Gone are the days of getting locked\
    \ out of your accounts because of too many failed login attempts!\n\nNow whenever\
    \ you visit a site, you don’t have to remember hundreds of different logins and\
    \ passwords—the password management system takes care of that for you automatically.\
    \ All you have to do is set a really complex master password so that you have\
    \ the strongest defense against hackers or other cyber attacks. For example, I’ve\
    \ previously used a master password like this: *Chu43%#lusknyHe*. For any would-be\
    \ hackers, don’t get too excited, this is obviously not my *actual* password.\n\
    \nSince I started using “crazy” passwords like this that are not related to anything\
    \ (e.g., not using my dog’s name or the street I live on as passwords), I have\
    \ not had any problems with hacks to my accounts. Even if someone were able to\
    \ hack my account, each of my accounts has a unique and complex password, so if\
    \ they hacked one, they won’t be able to gain access to my other accounts through\
    \ the hacked one (which is why you should never use the same password for multiple\
    \ accounts).\n\nRecently at a BNI (Business Network International) meeting, a\
    \ member shared they had their business email got hacked. The hackers were sending\
    \ out invoices, impersonating the business, and asking for ACH payments. The hacker’s\
    \ email said that moving forward, the company would *only* be accepting ACH payments\
    \ and no longer accepting checks. This hack was discovered because one of the\
    \ customers was confused and called the actual company and wanted to know why\
    \ they were no longer accepting checks.\n\nOnce the hack was discovered, all passwords\
    \ were immediately changed, but it was discovered that this man used that same\
    \ initial password on other accounts, including his banks. He told the group,\
    \ “*I just can’t keep all the different passwords straight in my mind.*”\n\nHe’s\
    \ not alone. A lot of us struggle with the multitude of passwords that we’re required\
    \ to have in daily life, and it’s just not practical or realistic to think that\
    \ we’re going to remember all of them on our own. Ask yourself this: If someone\
    \ hacked into your bank account and cleared out all your money, what would you\
    \ do? What if someone contacted all your clients without you knowing, and redirected\
    \ all their payments away from you and into their accounts? How devastating would\
    \ that be to your business?\n\nI ask you these questions so that you take your\
    \ passwords seriously. Instead of writing down all your passwords on sticky notes\
    \ (please don’t), you can have a password management system securely store them\
    \ for you. Having complex and secure passwords that you don’t have to remember\
    \ is a win for you *and* your company. Trust me, it will also be a win for your\
    \ employees because no one likes to keep changing passwords every ninety days\
    \ and then trying to remember them!"
