- fmt: "\nComputers really are our friends. Hear me out: Like many of our friends,\
    \ they can be selfish and annoying, causing us to do things we never thought we\
    \ would, and cost us lots of money (you know who you are!). You may recognize\
    \ the statement, “Choose your friends wisely.” This statement goes for your computers\
    \ as well.\n\nHow is a small business going to choose their friends, their computers,\
    \ wisely? In the cyber industry, it happens by doing what we call a `risk assessment`.\
    \ Let me be clear here, this does *not* mean you need to do a giant, formal risk\
    \ process that gets everyone involved and takes months of time and piles of money.\
    \ Don’t get me wrong, those are good to get company-wide buy-in and can help large\
    \ companies get a view into their “why,” but for small businesses like ours, this\
    \ can be an informal and relaxed process. In some ways, it can even be cathartic\
    \ and help you to see what potential dangers your company faces.\n\nAt this point,\
    \ you may be wondering how a risk assessment gets you to your “why.” Let me take\
    \ you through a risk assessment that I performed with a client.\n\nI was working\
    \ with a manufacturing client and brought in their President to perform a basic\
    \ risk assessment. We started with some of the standard risk points: “What files\
    \ are important? What drives your production line? How do you take orders?” This\
    \ brought us to the basic situation of what files are important, and how *not*\
    \ protecting them would cost thousands of dollars per day— but we didn’t stop\
    \ there. Instead, I began asking deeper questions. Putting everything into dollars\
    \ is useful, but there are always deeper reasons for why you do the things you\
    \ do.\n\nAfter getting through the base questions, I asked the President why he\
    \ started the company. He answered, “I always wanted to make the best widgets”\
    \ (I’ve altered his product name to “protect the innocent”).\n\nI then asked him,\
    \ “How would you feel if you couldn’t produce your Wonder Widgets?” He took a\
    \ moment and reflected on that question.\n\nSlowly, he said, “I never thought\
    \ about that. I just figured that I would always be making Wonder Widgets. I like\
    \ to make them, so I wouldn’t be very happy with that.”\n\nI responded, “Remember\
    \ those threats that we talked about regarding your customer files, your inventory\
    \ management, your shipping records? If you were to lose them, would you be able\
    \ to continue to make your Wonder Widgets?”\n\nLooking deeply across the room,\
    \ he replied, “I don’t know if I could keep working. That’s a very interesting\
    \ question. I just never thought about what could shut me down.”\n\nIt’s that\
    \ “eureka moment” that you want to get to with your team when performing a risk\
    \ assessment. The point is to find the reasons why things are important, and to\
    \ see if they are protected the way they should be.\n\nI have had so many meetings\
    \ with companies after-the-fact, where they say the same thing to me: “I didn’t\
    \ realize how important that file or device was to my business.”\n\nThere are\
    \ many great risk frameworks that you can use. I’ve always liked the `OCTAVE Allegro`\
    \ from `SEI`, but there are hundreds to choose from. However, if you’re not looking\
    \ to be that formal, just start here:\n\nGet your key team together and ask them\
    \ what they think is important and why, listing out all the items and reviewing\
    \ what they say. Afterwards, ask yourself this simple question: “If I lose this\
    \ information, how can I recover?” If you find that your answer is “I don’t know,”\
    \ then you definitely need to rethink your recovery plan.\n\nThe purpose of any\
    \ risk assessment is:\n\n1. To define the risks that your company faces\n2. Determine\
    \ methods to reduce or mitigate those risks \n3. Design a plan of action to address\
    \ the defined risks and implement the methods above\n\nRemember: Many times, if\
    \ you don’t know there’s a problem, or are not actively working to find it, they’ll\
    \ usually present themselves at the worst possible time (figures, right?), and\
    \ with the worst possible outcomes. So, to avoid catastrophes like this, you’ll\
    \ want to take the time to perform a risk assessment of your company at least\
    \ once per year.\n\n# CHAPTER 3: IF IT AIN’T BROKE, BETTER FIX IT\n\n![](images/image-03.jpg)\n\
    \nHow many times have you heard the phrase, “If it ain’t broke, don’t fix it?”\
    \ This way of operating made sense for many companies—at least it did “way back\
    \ in the olden days.” Looking back, there was a time when your father could buy\
    \ a press or other device and it could be handed down for generations. In fact,\
    \ many of my clients have had equipment they were still using from the 1970s and\
    \ ‘80s!\n\nFor a while, it was a great plan: businesses were able to pay off hardware\
    \ and continue using it for generations. But, like most things, it came with a\
    \ major problem: equipment that was *that* old was hard to keep updated or working\
    \ properly.\n\nFor example, we had a client in 2012 that was using a billing system\
    \ that ran on `Windows NT` from the 1990s. Everything this company had was billed\
    \ through this computer. The hardware could not be replaced, they no longer had\
    \ the install disks, and most of the people didn’t even know how to run `Windows\
    \ NT`. The cost to upgrade their system was massive.\n\nMy next example is even\
    \ worse. I was a young network administrator at a drug company, and they were\
    \ using an old `IBM System 36` computer. For those not old enough to remember,\
    \ this was known as a `mainframe`. This computer kept all the records that tracked\
    \ each piece of drug sold by the `FDA`. Loss of this information could easily\
    \ result in the closure of the company.\n\nThis `System 36` had been used for\
    \ almost 20 years and had never been updated in that time. When I took over my\
    \ position, I was told, “Why change it? It has been so reliable?” The solution\
    \ that I found was going to cost $4 million to implement and take about three\
    \ months to deploy. Top management didn’t feel that changing this “reliable system”\
    \ made any sense because, at this point, it was considered free to them.\n\nFrustrated,\
    \ I did everything in my power to keep that system working as long as possible.\
    \ I knew that, just like all of us, eventually it was going to die. As fate would\
    \ have it, the system died on the worst day of the year, right before annual close.\
    \ I remember walking in that Friday morning and having accounting pop in and ask\
    \ me what happened to the System 36. After a heart-wrenching moment, I ran into\
    \ the large, dark room that held this monster and there it was: `System Fault`\
    \ flashed at me, mocking me with its angry glow.\n\nI made the long walk down\
    \ to the CEO’s office to give him the news. The `System 36` was dead, and it was\
    \ not coming back.\n\nThat’s when the real pain began. Because we lost the system,\
    \ we had to spend time in a panic to get back up and running as quickly as possible.\
    \ There were many, many long nights with millions in accelerated costs. This $4\
    \ million project I proposed a short time ago ended up costing the company over\
    \ $45 million to get back up and running after the crash. That whole “If it ain’t\
    \ broke, don’t fix it” mindset nearly destroyed the company.\n\nI find that the\
    \ inertia many companies face is one of the hardest things to overcome in moving\
    \ companies towards increased cyber security. It’s getting past everyone saying,\
    \ “Why change? We’ve always done it this way,” that poses the greatest challenge\
    \ in increasing the safety and cyber security of a company and its culture. Hackers\
    \ are always changing, and if you’re not keeping up with them, you’ll end up paying\
    \ a terrible price.\n"
