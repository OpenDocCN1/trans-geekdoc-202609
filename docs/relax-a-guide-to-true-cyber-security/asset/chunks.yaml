    \ security. It’s getting past everyone saying, “*Why change? We’ve always done\
    \ it this way,*” that poses the greatest challenge in increasing the safety and\
    \ cyber security of a company and its culture. Hackers are always changing, and\
    \ if you’re not keeping up with them, you’ll end up paying a terrible price."
