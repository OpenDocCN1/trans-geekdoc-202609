    If Lucy would have had MFA enabled on her account, the hackers would have been
    stopped from being able to access her account without the second method of authentication
    (the code texted to her cell phone). This means that the attack would never have
    happened; the emails would never have been sent out, and we wouldn’t have had
    to call hundreds of clients to inform them of the attack.


    Now you’re probably wondering how to activate MFA. This can vary depending on
    the application and how it’s deployed, but most of the time you can find directions
    in Bing or Google. For example, you can simply type “setup Facebook MFA” in the
    search bar to get step-by-step instructions for how to enable MFA on your account.
    If you’re trying to enable MFA connected to your bank or other financial institution,
    I would suggest contacting them directly and asking them to help you.


    I also want to mention this: If you have a bank, financial institution, or other
    financial organization and they `do not` support MFA/2FA… RUN! Run hard and fast
    away from them!


    I worked with a nonprofit that had their financial information stolen in a cyber
    attack. When asked why the company wasn’t using MFA, their answer was, “We didn’t
    feel like we needed it.” Well, `$45,000` later, this nonprofit was wishing otherwise!


    I strongly suggest using MFA on `all` your bank accounts, your business emails,
    file storage areas, and anything else that you feel is important. It’s also important
    to remember to use MFA with your social media accounts. You don’t want to wake
    up one day to see that someone posted pictures of Hitler, Stalin, or Yoko Ono
    to your account, do you? Do you think your reputation would ever recover? Your
    company’s reputation could suffer even more by hackers posting damaging photos,
    links, or other items to your social media accounts.


    MFA gives you an additional layer of security that will help you sleep better
    at night. Don’t fear the factor; instead, embrace it.


    # CHAPTER 6


    ## EMAIL, WHY IS IT ALWAYS EMAIL?


    ![](images/image-06indy-1.jpg)


    At some point, you may have asked yourself, “Why is my company always harping
    on my emails?” Well, there’s a good reason for this. Phishing attacks, named for
    trying to “catch” you like a fish, are reported by almost 97% of companies, and
    almost 20% of people will click on a phishing email. As you can see, this is a
    `massive` problem that has the potential to hurt all of us.


    I’m going to tell you a story that most cyber security experts would never share.
    Most cyber security experts like to give the illusion that we’re perfect and never
    get hacked, but I’m going to share a story where I fell victim to the exact attack
    that I caution people to avoid.


    One day, I received an email from “Target” stating that I had earned a `$5` gift
    card. I was so excited that I just clicked on the link and awaited my wonderful
    reward. I should have followed my normal routine and checked to see if the link
    was truly from Target. I should have made sure that I scanned the link to see
    if it had malware attached to it. I should have done a lot of things, but I didn’t.
    Instead, I let my excitement about getting free stuff overwhelm my normal protections
    and security measures.


    You can imagine my less-than-feeling when I found a pop up. My first reaction
    was `de-excitement` because I was locked out. This happened because of the ransomware.


    So, what should you do if you find yourself in? Here are some steps:


    - **The first thing is always to RELX**: If you do things in a panic, you will
    make mistakes. Count to 10 and center yourself. Once you’re in a more relaxed
    state, you can proceed.

    - **Make sure that your anti-virus/malware/anti-spam is up-to-date**: If you have
    not paid for your anti-virus in a while, it’s time to bite the bullet and get
    it renewed. Also, make sure that you have updated your anti-virus. I cannot tell
    you the number of times we are bringing on a new client and discover that they
    have not updated the settings on your email. When an email is hacked, the hackers
    will often setup a Forwarding Rule that sends all the replies to your trash folder.
    Each email system is different as to where they keep the Rules, so you may need
    to ask for help with this one.

    - **Ask your provider to restore any lost information**: Many providers will have
    a backup and can restore your emails. If you are working in a company, ask the
    person in that dark room or give your support company a call. If it is a personal
    account, you may have to go online and look for a support contact.

    - **Log into your account and change your password**: If the hackers have changed
    your password, then contact your email administrator. In your company, this is
    most likely your computer guy/gal that is hiding out in that room. If it’s a personal
    account, go to the website.

    - **Contact your clients and contacts**: This is the hardest step of all. You’ll
    need to reach out to each of your contacts and inform them that you were hacked.

