    # PREFACE


    Thank you for joining me on this crazy journey that I hope you will find both
    fun and informative. I wrote this book because I found many of the cyber security
    books were focused on making you feel bad, victimized, and that the world is a
    dark and dangerous place. I wanted a book that showed that even us cyber security
    folks can make mistakes (it’s true!), and that if we can recover from them, so
    can you!


    This book is the work of a lifetime of trying to help people relax and enjoy life,
    even in the midst of cyber security troubles. Yes, bad things are inevitably going
    to happen to us, but that doesn’t mean we have to give in to despair. I’ll share
    some of the mistakes that I’ve made, as well as examples of others, and how we
    can work together to address the cyber dangers of the modern world.


    If I’m successful with this work, you’ll be able to take a deep breath and RELAX,
    giving yourself the time to be more thoughtful and strategic in how you respond
    to cyber threats. Not only will this process be less stressful overall, but it’ll
    also make you happier and more successful when problems do happen.


    With RELAX, my goal is to help you be more mindful of cyber security, and to take
    the time to stop and think before responding to a cyber threat—rather than reacting
    (and yes, there is a difference). If there’s one thing that I’ve learned from
    the many friends and family members that have supported me on this journey, it’s
    that being in a panic leads to bad decisions and poor results.


    You’ll also learn more about my core philosophy that I try to live my life by
    (I learned it on an airplane!). That philosophy is this: Always put the oxygen
    mask on yourself first. If you’re not taking care of yourself and addressing your
    needs first, you can’t help others to address their needs. Cyber security is no
    different. You need to get your mindset right before you try to address any cyber
    threats or attacks that come your way. Put your oxygen mask on first and you...

