    在那之后，作为一名技术人员，我走过很多人的工位，看到那本“蓝色大书”要么放在高处要么放在低处，但从未被阅读过，甚至从未被打开过。我知道这对于公司来说是一个很好的合规检查项，但员工们从不使用或阅读它。它充不过是律师的口粮，放在那里是为了给公司打掩护，但对改变行为毫无帮助。


    这`不是`创建你希望员工使用的的政策的正确方法，而政策`应该`是这样被使用的。让我们从你为什么想要制定政策开始。制定政策是为了确保你的团队以相同的方式执行相同的流程。在网络世界中，这可能意味着设置复杂的密码或不将重要文件带回家。在理解政策的存在是为了确保你的团队以相同的方式执行关键任务的前提下，问问自己一个问题：`你`会读两百页的政策吗？我想我们都知道答案。这就是为什么我的政策“蓝色大书”演变成了我的政策“大书架”，再再也没有见过天日了。


    无论你处于哪个行业，制定政策都是为了满足各种合规标准。再次，这是一件好事。如果你记得让人们容易`阅读`政策，那么他们就更有可能`遵循`政策。


    让我们再次围绕政策进行一次旅程，这次回到我在一家制药公司工作的时候。要记住，制药公司受到严格限制，它们的政策必须被严格遵守；美国食品药品监督管理局（FDA）要求如此。


    作为一名年轻的网络管理员，我负责网络的生命线，并确保一切运行正常并受到保护。我的职责之一包括备份所有重要数据。


    公司有一份关于如何执行备份的政策，所以我作为一个表现良好的员工，去索要了那份政策。我的经理告诉我（这可不是玩笑），“`我不能给你那份政策，因为根据规定，你必须是总监级及以上才能看到备份政策`。”


    我震惊得说不出话。我太惊讶，甚至没有问那个显而易的问题：`我该如何遵守一份我不被允许查看的政策呢？`我离开了经理的办公室回了自己的办公桌。


    在接下来的一小时里，我坐在那里思考他刚刚告诉我的话——整整一个小时在震惊的沉默中白浪费了。最后，我使用行业标准和异地备份创建并实施了自己的备份流程，但直到今天，我也不知道这是否符合公司政策的要求。


    我分享这个例子是因为对你来说，至关重要：如果你不给员工清晰且易于遵循的政策（以及获取政策的权限），那么他们就会制定自己的政策和流程，而且结果并不总是像我为那家制药公司做的那样好。


    在制定政策时，请记住以下建议：


    1. **KISS**: `K`eep `i`t `S`imple, `S`upid（保持简单、愚蠢）。基本上，创建清晰简洁的政策。

    2. 明确定义需要遵循政策的受众。

    3. 编写政策的人员或委员会的名称。

    4. 保留政策变更和日期日志。

    5. 每年审查一次政策。

    6. 确保对政策进行适当的培训和访问管理。


    政策可以是支持企业文化并在出现问题时保护你的极佳方法，但如果它们静静地躺在大蓝书中，无人问津，落满灰尘，那么它们对任何人都没有帮助。


    ## 第 16 章


    # 登上培训之车


    ![](img/image-16-2.jpg)


    当我们还是婴儿时，我们都是可爱的空白纸。从那时起，我们开始学习而且学得很快。学习是一个终身过程，永远不应该结束。遗憾的是，有很多经理认为人不需要学习，而应该已经学会了。


    培训是确保你的团队与时俱进步调一致的最佳方法。它可能成本高昂，但只要执行得当，长远来看是有回报的。如果你有想要学习的员工，请鼓励他们——他们将成为你最好的员工。


    很多公司并不认为培训能让公司变得更好，他们将其视为流失员工的风险。虽然培训员工确实可能会失去他们，但如果你不培训他们，你也会失去他们。例如，当我在一家货运公司担任仓库开发运行时，网络管理员突然辞职了。那个职位空缺了，我想接受新的挑战，于是我开始了对
    `Novell NetWare`（一种现在已停止的网络操作系统）的培训。


    利用我获得的资金，我开始了我的课程。在开始第一节课后，我的经理进来和我谈话。我想我们大家都能同意，当经理说他想和你谈谈时，这几乎不是什么好兆头。他坐在我的工位上告诉我有一个问题：公司不希望我完成
    `Novell` 课程，因为这会让我变得太有价值，我会离开公司。


    我记得那句话：我会变得`太有价值了`。在我看来，有价值应该是他们想要的东西，但我一句话没说让我的经理继续说。我听着他告诉我，我的培训对公司是一种威胁，我只会参加完培训就离开。


    在他表达完对我会离开的顾虑后，我告诉他我愿意签署协议，如果我在明年内离开，就向公司还钱。他告诉我无法承担这种风险，并且我太有价值了。意识到他们永远不会培训我变得更有价值，我最终离开了公司。当我意识到我的未来需要培训（以及在那些鼓励成长的公司）时，这是一个简单的决定。

    '
- fmt: '

    Second, keep your audience in mind. If I’m conducting a training to a group of
    accountants, I don’t want to suddenly start talking about `SIEM` or `SOCs`; I
    want to talk about balance sheets and wire fraud. You always want to keep the
    knowledge level aligned with the audience. Talking over the heads of the audience
    only gets them to start to daydream about that boat ride they’re going to take
    this weekend, or the iced latte they forgot in their car.


    Third, remember the reason that the audience is learning. If you’re trying to
    protect against wire fraud, let the audience know and make the message consistent.
    Don’t go off on tangents about how oil prices are going up, or how your company
    doesn’t want to let anyone be trained because then they’re all going to jump ship.


    Fourth, control the scope. People will usually only remember two or three things
    from your training, so trying to cram dozens of points into one training will
    mean that most of it will be left behind and forgotten. Keep it reasonable and
    achievable and you’ll find the trainings are more successful.


    I think the fifth step is the most important, and that is to keep it fun. In my
    Fast & Fun trainings that I conduct, I always remember that people remember better
    if they’re having a good time. If your team enjoys the training that you provide,
    they’ll willingly come back for more trainings.


    Sixth is to continue to learn. Training is not a one-and-done situation; it’s
    vital for your team to keep learning. The world of cyber security is always evolving,
    and hackers are always changing their tactics, so we need to always be adapting
    as well.


    We should approach life as life-long learners, always growing and expanding our
    horizons. By continuing with trainings and learning, we keep ourselves at the
    top of our games.


    # CHAPTER 17: NIST IS NICE


    ![](images/image-17-1.jpg)


    The National Institute of Standards and Technology, `NIST`, is a group of folks
    hiding out in Boulder, Colorado, thinking of countless ways to keep us safe. Most
    cyber security standards are derived from the work they do. Why would a small
    business like yours care about `NIST` or the standards they create? That’s a great
    question with an even better answer!


    `NIST` creates many of the security standards that are used across the world,
    as well as very actively within the US. They start with a simple and straightforward
    `Cyber Security Framework` that can be implemented and understood by all of us.
    The five steps of the `NIST Cyber Security Framework` are the basis of all cyber
    security standards used today.


    ## The 5 Steps of the Cyber Security Framework are:


    1. Identify

    2. Protect

    3. Detect

    4. Respond

    5. Recover


    I’ll take us through each of the different steps and explain why they’re valuable.


    ### 1. Identify

    The first step is to identify. The saying is always true: you can’t protect what
    you don’t know about. In the `identify` stage, you’ll figure out where your important
    information is. Your company runs on information—from your `QuickBooks` accounting,
    your client records, the bank with all of your money, to your proprietary process
    that makes the wonderful items you sell, there is vital data you have on your
    computers.


    The first step is to identify where all this information is, beginning with an
    inventory of all the equipment that you have. This will include computers, smart
    phones, external hard drives and `USB` devices, and even `POS` (`Point of Sales`)
    devices and other `IoT` (`Internet of Things`: machinery or other items that connect
    to the internet) equipment that may be vital to your company’s processes.


    Next, you need to know what programs and applications you are using. Do you need
    `QuickBooks` or `AutoCAD`? What version of `Microsoft Word` are you using? Knowing
    what programs you use and where they are located will help keep you safe by understanding
    what people are doing and where. Take time to track what programs are being used.
    If a program that is vital to your company is lost or attacked, how would you
    recover?


    You’ll also need to determine who should be accessing those programs. Which employees
    need to get to which information? Do contractors need access? What about people
    outside of your company? Each person that needs to access your vital information
    needs to be identified and what they specifically need access to needs to be defined.
    I would guess that you don’t want to have your customers looking at your `QuickBooks`,
    but they should be able to see your company brochure.


    You’ll also want to define how they can get to your information. Your employees
    may be working from home these days and need access with a secure connection such
    as a `VPN` (`Virtual Private Network`). They could also be accessing information
    on their phones. It is important to know who is accessing your information and
    how they’re accessing it. If you don’t know, you’re not able to protect it.


    This can take some time to do, and I know most people hate this first part. It
    demands that you understand what is important and where it’s stored. With the
    world of cloud storage, it can become difficult to know where your information
    is being held and how secure it truly is.


    ### 2. Protect

    The next step is to protect your vital information, which will be an ongoing process.
    It will include things like anti-virus, spam filters, backups, and other actions
    that are designed to keep your team safe. It will include setting up security
    for people and conducting trainings with your staff (which should occur on an
    ongoing basis, rather than just once a year). The protection process is an ever-changing
    series of actions that you and your team will employ every day. You don’t want
    to make it onerous, but you also have to remember to be involved in the process.
    The days of just hiring someone to do it for you are over. You want to get someone
    that will do this *with* you, as part of your team.


    ### 3. Detect

    Next, you will need to detect the attack. It doesn’t help you if you don’t know
    or can’t determine that someone is attacking your information. You might have
    heard about the Target attack where the hackers waited months before they even
    started to attack. Having a method to be able to see what’s taking place is vitally
    important.


    The thing to remember here is that there are different ways to detect an attack.
    You can use software and hardware, such as `IDP/IPS` (`Intrusion Detection System`
    or `Intrusion Protection System`) on firewalls or application control programs
    that run on your computers and stop programs that you did approve. Then there
    is the human aspect. This could mean a person calls you saying you sent them a
    strange email and they want to confirm its accuracy, to your team being trained
    to detect strange behavior on their computers. Detection comes in a wide range
    of detection processes.


    Never rely on just one method for finding a breach. Think about the airport: in
    addition to having cameras and security officers that roam around, they send out
    a constant message to report any abandoned luggage that you may see. *You* are
    part of the protection process at the airport. In your company, your team and
    customers are part of the protection process. They can tell you if something seems
    strange or ‘off.’ Take those warnings seriously.


    ### 4. Respond

    Next, you have to respond when you learn of an attack. It’s important to have
    a plan of action that your company will take when there is a breach or an attack.
    This plan should include steps to reduce the damage from an attack and who should
    be contacted if there is an attack. It’s also important to remember to inform
    the proper authorities of the attack. If you get attacked with ransomware, for
    example, you should tell the `FBI`, who has a website set up to make the entire
    process easier: `www.ICE.org`.

