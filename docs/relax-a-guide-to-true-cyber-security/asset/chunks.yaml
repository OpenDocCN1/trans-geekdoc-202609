    电脑真的是我们的朋友。听我慢慢道：就像我们的很多朋友一样，它们可能既自私又烦人，导致我们去做一些从未想过会做的事，并让我们花费大量的钱（你知道你指的是谁！）。你可能熟悉这句话：“要明智地选择朋友。”这句话同样适用于你的电脑。


    小企业如何明智地选择他们的朋友（即电脑）呢？在网络行业，这是通过进行我们所谓的`风险评估`来实现的。让我明确一下，这*并不*意味着你需要进行一个庞大的、正式的风险流程，让每个人都参与，耗费数月时间并投入大量资金。不要误会我的意思，那些流程对于获得全公司的认同是有好处的，并且可以帮助大公司了解他们的“初衷”，但对于像我们这样的小企业来说，这可以是一个非正式且轻松的过程。在某些方面，它甚至是一种宣泄，并帮助你看到公司面临的潜在危险。


    到这里，你可能在想风险评估是如何带你找到“初衷”的。让我带你回顾我曾为一个客户执行的风险评估。


    我当时正在与一家制造客户合作，并请了他们的总裁来进行基础的风险评估。我们从一些标准的风险点开始：“哪些文件是重要的？哪些驱动器驱动着你的生产线？你们是如何接收订单的？”这让我们了基础情况：哪些文件是重要的，以及如果不保护它们将导致每天损失数千美元——但我们并没有停于此。相反，我开始问更深层次的问题。将一切换算成金是有用的，但你所做这些事情背后总有更深层的原因。


    在完成基础问题后，我问总裁为什么要创立这家公司。他回答：“我一直想做出最好的小部件”（我把他的产品名称改成了“保护无辜者”）。


    然后我问他：“如果你无法生产你的‘奇妙小部件’，你会感觉如何？”他停顿了一下，思考了这个问题。


    慢慢地，他说：“我从没想过那个。我只是认为我会一直在制造奇妙小部件。我喜欢制造它们，所以如果那样我会很不开心。”


    我回答道：“记得我们谈过的关于客户文件、库存管理、发货记录的威胁吗？如果你丢失了它们，还能继续生产你的奇妙小部件吗？”


    他深深地看向房间另一头，回答道：“我不知道自己是否还能继续工作。这是一个非常有趣的问题。我只是从未想过会有什么能让我停产。”


    这就是你在执行风险评估时，想要带领团队达到的“灵光一现”。关键在于找到事物之所以重要的原因，并看看它们是否按照应该的方式得到了保护。


    在事后，我曾和很多公司开过很多会议，他们都对我说同样的话：“我没有意识到那个文件或设备对我的业务有多重要。”


    有很多优秀的风险框架你可以可以使用。我一直喜欢来自`SEI`的`OCTAVE Allegro`，但有数百种供选择。然而，如果你不想那么正式，就从这里开始：


    召集你的核心团队，问问他们认为什么是重要的以及为什么，列出所有项目并审查他们说的话。之后，问问自己这个简单的问题：“如果我丢失了这些信息，我该如何恢复？”如果你发现答案是“我不知道”，那么你绝对需要重新考虑你的恢复计划。


    任何风险评估的目的是：


    1. 定义你的公司面临的风险

    2. 确定减少或减轻这些风险的方法

    3. 设计行动计划以应对已定义的风险并实施上述方法


    记住：很多时候，如果你不知道存在问题，或者没有积极寻找问题，它们通常会在最糟糕的时候出现（很讽刺，对吧？），并带来最糟糕的结果。因此，为了避免这种灾难，你最好每年至少花时间对公司进行一次风险评估。


    # 第 3 章：如果没坏，就别修它


    ![](img/image-03.jpg)


    你听过多少次“如果没坏，就别修它”？这种运营方式对很多公司是有意义的——至少在“很久以前”是这样。回首过去，曾几何段时间，你父亲买一台压力机或其他设备，它们可以代代传下去。事实上，我的很多客户在使用来自
    20 世纪 70 年代和 80 年代的设备！


    一段时间内，这是一个很棒的计划：企业能够支付硬件费用并一直代代代使用。但像大多数事情一样，它也带来了一个大问题：*那么*老旧的设备很难保持更新或正常运行。


    例如，我们在 2012 年有一个客户使用运行在 90 年代 `Windows NT` 上的账单系统。这家公司所有的业务都通过这台电脑进行计费。硬件无法更换，他们不再拥有安装盘，而且大多数人甚至不知道如何运行
    `Windows NT`。升级系统的成本是巨大的。


    我的下一个例子更糟。我当时是一家制药公司的年轻网络管理员，他们正在使用一台旧的 `IBM System 36` 计算机。对于那些年纪大到记得的人来说，这被称为`大型机`。这台电脑保存了跟踪
    `FDA` 售出每种药物的所有记录。丢失这些信息很容易导致公司倒闭。


    这台 `System 36` 已经使用了近 20 年，在此期间从未更新过。当我接手这个职位时，我被告知：“为什么要换？它一直很可靠。”我发现的解决方案将花费
    400 万美元实施，并需要大约三个月来部署。高层认为更换这个“可靠的系统”没有任何意义，因为在此时，对他们来说是免费的。


    感到非常沮丧，我竭尽全力让那个系统尽可能运行得久一点。我知道，和我们所有人一样，它终将会死去。命运使然，系统在一年中最糟糕的一天坏了，就在年度结账之前。我记得那个周五早上走进公司，会计人员跑进来问我
    System 36 怎么了。在一段心碎的时刻后，我冲进那个放着这个怪物的巨大阴暗房间，它就在那里：`System Fault`（系统故障）闪烁着，用它愤怒的光芒嘲笑我。


    我走长长路去 CEO 的办公室告诉他这个消息。`System 36` 死了，它再也不会回来了。


    真正的痛苦那时开始的。因为丢失了系统，我们必须在恐慌中花时间尽快恢复。那是无数个长夜，伴随着数百万美元的额外成本。我之前提出的那个 400 万美元的项目，最终在崩溃后花费了公司超过
    4500 万美元。整个“如果没坏，就别修它”的思维差点毁了这家公司。


    我发现，许多公司面临的惯性是推动公司提高网络安全方面最难克服的问题之一。要让大家忘记“为什么要改变？我们一直都是这么做的”，才是增加公司及其文化安全性的最大挑战。


