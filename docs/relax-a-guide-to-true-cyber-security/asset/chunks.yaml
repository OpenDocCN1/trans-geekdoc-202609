- fmt: '

    Are you thinking of every scenario? How long is your list? Do you think you’ll
    have a 100% accurate assessment of everything that could possibly go wrong? This
    is what I was expected to do each time I wrote code! I had to try to guess everything
    that code could possibly need to do so that I could program for it. Let’s just
    say that I didn’t always succeed.


    On one particular occasion, I was assigned to review code from an earlier programmer.
    As I was going through the code, I found something. The code was used to move
    the money from the general bank account to the payroll bank account each week.
    This energy company didn’t want to have money sitting in a checking account longer
    than it needed to because they could make money on the interest, and that was
    a lot of money.


    Here was the crux of the situation: the code had been written with a bug. The
    prior coder had made a mistake that resulted in the program stopping before it
    would move the money to pay the employees of a large division, which meant that
    the money was not being transferred at all. This resulted in almost $70 million
    in missed payroll and cost anywhere from hundreds of thousands to millions of
    dollars in penalties with each payroll cycle. Because of the size of the energy
    company, this was just recorded as bank fees, but it was costing the company millions
    of dollars each year.


    I then wrote a correction, a patch, to that code and deployed the new version.
    This newly adjusted code then went into production and the proper amount of money
    was deposited into the payroll account. This patch resulted in millions of dollars
    in savings for the company each year.


    Not all patches are to fix errors or vulnerabilities (code that allows hackers
    to get into your systems). Many times, patches are to enhance features. For example,
    let’s say you have to click through two different screens in order to save a file
    and this annoyed you enough to complain to the software company. Well, many companies
    actually listen to and respond to those complaints or suggestions and will release
    a patch that. In this example, the patch would place the save button directly
    on the main page. Now you can save your document or file with a single click right
    from the home page.


    All programs will require patching at one point or another, but not all patches
    are helpful all the time. Sometimes, patches can cause problems. For example,
    there was a recent patch to update the video image on a computer. For some people,
    this updated patch caused their computers to crash and stop working abruptly.


    In cases like this, a `RMM` (Remote Management and Monitoring) system can help.
    With a third-party company offering this service, they can ensure that necessary
    patches are deployed, as well as protecting against and even reversing bad patches.
    Like most things in life, this isn’t a perfect system, but it does give you greater
    security and control in patch management.


    These `RMM` tools are used by many IT companies to help control and manage your
    devices. As the name implies, they’re used to remotely monitor your systems and
    devices, and to give access to an engineer if needed. These engineers can access
    your systems with you when it’s required, with no travel, no fuss, no muss, and
    you don’t even have to get out of your PJs if you’re working from home! How great
    is that?


    Another advantage of an `RMM` tool is that it can track and confirm your inventory
    of both hardware and software. This means that if you get a request from a big
    company like `Microsoft` to confirm what software is being used, you can get a
    quick answer. `Microsoft` calls these software audits, and they love to do them
    unexpectedly. It also means that you can see what programs your team may have
    deployed, so you can make sure they’re using legal software and not installing
    things without proper permissions.


    Lastly, the `RMM` tools will help to keep applications up-to-date as well. In
    addition to your `Windows` or `MAC` Operating System, you may have `Office`, `QuickBooks`,
    or other software that needs to be patched; `RMM` tools keep this process regularly
    updated.


    # CHAPTER 10


    # ALWAYS IN WAITING


    ![](images/image-10-1.jpg)


    The world is changing, and hackers are changing along with it. They’ve learned
    we’ve put in defenses, and they work to get around them. It’s a constant battle
    back and forth between the hackers and the defenders.


    A new method of attacking your systems is to put in place what is known as a “sleeper
    agent,” a program that lays dormant in your computer, waiting to attack you at
    a later date. These are very tricky because it means the attack or infection will
    also be on any backups that you take. By having the infection included on your
    backup, when you restore from that backup, it also restores the virus or ransomware
    you are trying to remove. It’s devilishly clever and very disruptive and destructive.


    You may be wondering, “Why would they do something like this?” It’s simple— our
    cyber attack protections have been getting better, and if the hackers want to
    continue extorting people for money, they have to up their game. In this case,
    upping their game means finding more devious ways of getting past our defenses.


    These delayed attacks can be spread across all your data and into all your backups.
    This could mean that putting back the backup just puts back the attack (say that
    five times fast!). Hackers have become more patient as well. Some will even wait
    up to a year before attacking so that they’re assured all of your backups have
    been compromised, making you desperate and more willing to pay them to (hopefully)
    restore your data.


    Imagine: you’ve been doing a great job of sticking with your backup buddy, and
    all of your files are resting safe and secure in their data beds. Suddenly, you’re
    hit with a cyber attack. You’re okay; you’ve always done your backups. You check
    them, manage them, and keep them safe because it’s your precious data.


    Then, the cyber attacker attacks you. They encrypt all your data, followed by
    a demand for thousands of dollars to unlock it for you. You’re not worried; you’ve
    been performing proper backups and you’re confident that everything is safe. Your
    backups are off-site and have been protecting you for a year. You laugh in the
    face of the foolish attackers—hahaha!


    The backup restores your files and systems and you’re ready to go. The next morning,
    all your files are locked and unavailable to you again. WHAT?! How did this happen?
    You restored from the good backup. Okay, no problem. You can just restore from
    a few days ago. Night comes and you sleep like a baby knowing that you’ll be ok
    this time and that in the morning, everything will be restored back to normal.
    Unfortunately, the next morning, you find that all your files are locked again.
    What are you to do?


    Let’s start by talking about what’s going on. Back in the good ol’ days, hackers
    would just attack you when you clicked on a bad email or a compromised link. After
    clicking, you’d get that screaming `Microsoft` alert notice, or your files would
    instantly become locked. The resulting attack was immediate and traumatic and
    is now addressed with our current safety and security protections; good news for
    you and me, bad news for the hackers.


    Unfortunately, more and more cyber attacks aren’t happening immediately. Instead,
    hackers are putting programs onto your computer that then go to “sleep.” When
    it’s initially installed, it doesn’t do anything harmful or noticeable, so it
    goes undetected, just waiting to be called into action.


    These programs can lay in wait for many months, silently biding their time. As
    they wait patiently in the shadows, they’re being copied to all the backups you
    take, making it harder to root them out. Again, it’s done nothing bad or malicious
    so far, so it’s being ignored by the “security guards.”

