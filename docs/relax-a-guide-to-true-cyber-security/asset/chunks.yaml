    \ for five years, they were never actually making any backups.\n\nHad I not been\
    \ on-site working to bring them onboard with our services, they may not have discovered\
    \ they had no backups until it was too late. This is why testing your backups\
    \ regularly is so important.\n\nBackup buddies are vital for your business. It’s\
    \ only a matter of time before you’re faced with a hack or a cyber attack like\
    \ ransomware that can cause you to lose access to all your data. A backup buddy\
    \ can help to reverse that, so please remember your schooling and keep your backup\
    \ buddy close!\n\nCHAPTER 9 \n\n# WHAT? A PATCH?\n\n![](images/image-09.jpg)\n\
    \nSome of you may have heard about Microsoft’s Patch Tuesday. A few of you may\
    \ have even heard about the problems it can cause. The real question is, “*What\
    \ is patching, and why do I need to do it?*”\n\nI began my career as a programmer\
    \ for a very large energy company, writing the code that moved all the money to\
    \ pay everyone in the company. I was young and cocky, and to be honest, a little\
    \ naïve. Despite that, I was moving billions of dollars each year to ensure that\
    \ everyone in nine different companies received their paycheck on time and accurately.\n\
    \nThere are millions of people out there just like I was, coding and controlling\
    \ everything from your TV to your car, to the systems that keep you alive in the\
    \ hospital. Almost everything we use today is created on code, the written commands\
    \ that control a computer.\n\nLet’s try something here. If you’re a business owner,\
    \ I want you to take a few moments to try imagining *every* possible scenario\
    \ and event that could go wrong or happen to your company in the next five years.\
