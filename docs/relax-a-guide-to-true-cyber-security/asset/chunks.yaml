  trans: '


    我知道我们都会嘲笑那些向尼日利亚王子汇款的傻子，因为他们承诺只要你支付几千美元作为转账费用，就会送给你数百万美元。虽然这听起来很好笑，但每天都有无数人落入类似的网络钓鱼陷阱。


    黑客正在调整他们的攻击手段，使其更具针对性且更阴险，就像我刚刚分享的那家公司一样。他们会使用信任人士（如供应商或客户）的名字来诱导你提供银行账户、电子邮件地址或其他重要信息。始终保持警惕非常重要。


    # 第 12 章


    ## 电话来自屋内部


    ![](img/image-12-1.jpg)


    当你正处于熟睡中时，手机响起了熟悉的*叮咚*声，表示你刚收到了一条短信。你昏昏睡睡地揉掉眼角的眼垢，慢斯理地打开短信界面，发现是一条来自未知号码的消息。“*恭喜你！你赢得了一张
    25 美元的礼品卡！只需点击链接即可领取奖品！*”你不记得自己参加过抽奖，但那是 25 美元，对吧？为什么不拿了钱就走呢？况何况这是短信；它应该是安全的吧？于是，你点击链接领取了奖品……


    你现在成了 `smishing`（短信钓鱼）的受害者。`smishing` 是 `SMS phishing` 的缩写（SMS 是极客对短信的术称），是网络攻击的最新趋势之一。黑客意识到我们对电子邮件的保护更为严密，因此他们正转向人们花费更多时间的地方——手机。最糟糕的是，为了获取我们更多的时间和注意力，普通企业也开始发送更多的短信。你可以看到这很快就会变得让人应接不暇。这可能导致我们做出一些对自己不利的决定，比如点击那些直接落入黑客圈套的链接。


    如果你正遭受短信的轰炸，那么从已知列表中退订、将其他信息标记为垃圾邮件或屏蔽这些号码可能会有所帮助。同样重要的是记住，永远不要点击陌生人短信中的链接。如果你没预料到会收到且不知道对方是谁，最好的办法就是直接忽略它。黑客总是试图让你放松防备，交出你的宝贵信息。


    噢，等一下——还有后手！他们对你的手机还没完。我们还会遇到另一种形式的钓鱼攻击，称为 `vishing` 或 `语音钓鱼`。这些攻击始于电话，攻击者自称来自微软、政府机构或其他组织。


    现在是时候给你讲讲当年“税务局（IRS）”给我打电话，要“追收我显然欠下的所有欠税”的故事了。这是一个有趣的故事，关于我是如何欠了 5000 美元的税款，以及他们打算如何“帮我纠正”。


    我刚结束与一个客户的工作，手机响了；这是一个被叫的号码，我习惯性地接听了。


    一个带有外国口音的悦耳声音问候了我。“*你好，我是税务局的 Hamon。我给你打电话是因为你欠我们 5000 美元，我们需要安排付款*。”


    “*我欠你们 5000 美元？这是关于什么的？*”我有些困惑地回答，因为我并不是那公司的财务官。


    “*是的，先生。您的税款逾期了，必须立即支付*。”


    我很快意识到这*不是*来自税务局的电话，我*并没有*欠任何税款。不过，这给了我一个玩乐的机会。


    “*噢天天！我没意识到我付款晚交了。我该怎么做才能补救？我现在就可以回办公室，让我的会计联系我们的税务局实地探员并给他一笔付款*，”我带着得意的微笑说道。


    他的声音里充满了恐慌，回答道：“*不，先生，你不想那样做。我需要你今天解决这个问题。你需要做的是购买比特币，然后将其转到我们的`Accounts Collectible`（可收款账户）。我可以指导你完成整个过程。这非常简单，你就能消除这笔非常严重的税收违规记录了*。”


    我很确定税务局*并不会*接受比特币来清偿税收责任；他们喜欢支持美元。我迅速想出一个计划，既能玩一下，又能防止他伤害其他人，至少持续一小时，这恰好是我回到办公室之前的时间。


    “*比特币？！我以为那是黑客用来勒索钱财的！*”我装出恐惧的样子说道。


    “*别担心，先生，税务局只是想让这个过程变得简单些*，”他向我保证道。


    “*我不确定该怎么办。帮帮我*”我虚弱地回答。


    此时，他让我打开浏览器并进入一个特定的链接。然后他开始指导我如何购买和转移比特币。我表现得完全无所不知。在每一步中，我都做错了，并假装不知道该点哪里。


    将近一个小时后，他说他可以直接登录我的电脑帮我操作。


    我回答道：“*我不认为应该这样做。我的电脑专家告诉过我，我绝不能让任何人进入我的电脑*。”


    他挫败感日益增加，反驳道：“*如果你不让我进去，税务局就得没收你的房子！*”


    “*我的房子！*”我震惊地说道。“*先生，我们不允许提供证件号,*，”他语气不耐烦地说。


    “我觉得这有什么不对劲。”我正开车进办公室的停车场。


    “*先生！*”他说，显然在对我生气。“*我现在必须进入你的电脑，这样我才能把你欠的钱转过去。现在请给我邮箱，我我把链接发给你*。”


    “我很乐意这样做，只要你能为我做一件事：告诉我我的名字。”


    “*你什么意思，先生？*”他问。


    “*如果你是税务局的，那么你就知道我的法定姓名。请告诉我*。”


    电话挂了；不再有那个来自税务局的 Hamon 了。虽然他在最后确实变得有点无礼，但他确实让我的回办公室路程变得飞快！


    ## 保护贴士


    在接到关于催收的意外电话时，无论对方是税务局还是任何其他公司或组织，这里是一些建议：


    1. 始终要求提供书面信息。你有权以书面形式获得任何欠单。税务局在没有发送书面通知的情况下*绝不会*直接给你打电话。

    2. 绝不要现场或通过电话付款。有些黑客甚至大到提要上你门取款！这*绝不*合法的。绝不。

    3. 要一个回电号码，然后检查该电话是否真的属于已知公司（而不是未记录或无法核实的号码）。你还需要检查自己的文件和记录，看看你是否真的欠该公司钱。

    4. 税务局官员没有证件。如果你接到自称来自税务局的电话，请他们提供证件号。如果他们真的是税务局的，他们会知道自己没有证件号。

    5. 绝不要支付你没有亲自核实的款项，特别是如果他们要求使用比特币。比特币是一种*无法追踪*的获取钱财的方法，这就是为什么黑客喜欢使用它。


