    \ ways that a ransomware attack can end. You can lose all your data and pay a\
    \ ransom (*hoping* you get your data back, but with no guarantee), or you can\
    \ build a backup recovery plan to make sure that you’re able to recover. Just\
    \ remember: hackers are always looking for ways to get past your defenses. It’s\
    \ worth millions of dollars to steal your information, so they work hard to get\
    \ around your protections, as we saw in the first example.\n\nHere are several\
    \ steps that you can take to protect yourself from these kinds of attacks:\n\n\
    1.  **Have ransomware resistant backups**. That means the backups need to be separated\
    \ from the computer itself. They can be onsite, in the cloud, or like our solution,\
    \ both onsite *and* in the cloud. They also need to be encrypted during the initial\
    \ backup and where the backups are stored – this protects against people being\
    \ able to steal your backups. Remember to always test your backups so you know\
    \ they’ll be there when you need them; they are your backup buddy, after all.\n\
    \n2.  **Have current and active anti-virus.** This can protect your computer from\
    \ known attacks.\n\n3.  **Have an application control to protect against hidden\
    \ programs**. You may remember that hackers are now putting sleeper programs that\
    \ wait for months before they attack to make your backups less effective.\n\n\
    4.  **Use anti-spam and email protection**. Many times, ransomware is hiding in\
    \ emails or links from emails; these programs filter those out. If you never see\
    \ the bad email, you won’t be tempted to click on it.\n\n5.  **Don’t go to unknown\
    \ sites or click on links**. Many of the ransomware attacks happen by clicking\
    \ on a bad link or going to a bad site."
