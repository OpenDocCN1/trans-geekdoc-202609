    \ me that I never know when I’ll find one that I like, so I need to keep trying.\n\
    \nI’d like to thank my friend, Boris, who died a few years ago. He lived life\
    \ to the fullest and lived his life without regrets. His voice is always in the\
    \ back of my mind, reminding me to enjoy first, love always, and live for the\
    \ now because you never know when it will end. Those who knew him miss him and\
    \ his love of life.\n\nI’d like to thank all my friends that have been there for\
    \ me, all of you that are too many to mention. Thank you for supporting my craziness\
    \ and “strange” behavior! Each of you has been vital to my learning how to be\
