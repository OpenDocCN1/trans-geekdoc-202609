    Make sure that your plan includes customers, employees, and anyone else that you
    think may be hurt or affected by the attack. It is hard to admit, but the more
    people that you contact to inform about an attack, the more effective you will
    be in stopping the attack from spreading.


    Let’s take a moment to show you how `NIST` is connected to what we have been learning
    about in the rest of our journey. Remember our wonderful OTP CEO `Lucy`, you know
    the wife that’s about to slap me for still talking about her email mistake? As
    a reminder, her email was hacked, and emails were being sent from her account
    (by the hackers) that were asking customers to make payments. Within five minutes,
    we knew about the attack and started to enact our cyber response plan. We changed
    her email password, fixed the forwarding rule they had set up, and then we did
    something that some people questioned us for: we sent out email notifications
    telling everyone that we were breached and that they should not respond to any
    of the emails that came from our CEO’s account.


    The response was almost instant; many people told us that they were so glad that
    we let them know, but others questioned why a cyber security company would tell
    people that they were hacked. We were emphatic about this because, as a cyber
    security company, we have a higher standard to live up to. If we told others that
    they have to notify people when they get breached, how could we not do that as
    well? Since we had used the `NIST Framework`, we were ready for the attack that
    hit our CEO. The act of reporting to others about a breach should never be seen
    as embarrassing, but rather, seen as good practice.


    The last step in `NIST Framework` is `recover`. This is a vital step that can
    help you regain a sense of control after an attack. I’ve had to help people feel
    whole again after they were a victim of a cyber attack because these attacks can
    cause you to feel helpless and violated. The recovery process is more than just
    getting your data back and getting things working again; it’s about regaining
    a sense of control and feeling safe after being violated.


    In addition to recovering lost information and repairing compromised equipment,
    you’re going to want to review what happened. This is where training your team
    on what happened and how to stop it can be valuable. After an attack, everyone
    is more focused on the steps to prevent it from happening again. Taking advantage
    of that focus could help you get a ‘win’ out of a bad situation.


    It’s easy to see that the `NIST Framework` gives you a starting point to protect
    your company. It’s important to start with something that you can handle. Trying
    to be too complex or massive can overwhelm and frustrate you; processes like `NIST’s
    Framework` help you maintain control and move forward.


    # CHAPTER 18: WHAT’S A SMALL BUSINESS TO DO?


    ![](images/image-18.jpg)


    It’s been a long and wonderful journey through all the challenges of cyber security,
    wouldn’t you agree? Now the question becomes, what is a business to do?


    I think the first step will surprise you: RELLAX. Don’t act in a panic. Instead,
    take a moment to take a deep breath and start to review where you are. In this
    case, the `NIST Framework` we just reviewed is a wonderful starting point, but
    also remember that small wins help you to reach bigger wins.


    After you are relaxed and ready to go, then think about where you need or want
    to be. Do you have compliance reasons for cyber security, like `PCI`, `CMMC`,
    `HIPAA`, `ITAR`, etc.? If there are compliance reasons, then you’ll have a strong
    framework for what you need to do. Understanding this makes things easier to define,
    even if they are sometimes (or often) a pain to do.


    If you don’t have a compliance reason for cyber security, think about what you’re
    concerned about. Do you think you could lose your business, lose client information,
    have to pay an outrageous ransom? This step will help remind you why you’re working
    towards increased cyber security. I know that sometimes we all wish cyber security
    wasn’t needed, and in a perfect world it wouldn’t be, but as you well know, we
    are not in a perfect world.


    Now that you have your reason why, you’re able to build your team. This should
    be made up of important people within your company: your stakeholders in the project,
    and outside consultants to assist you in taking the necessary cyber security measures.
    Don’t make a team that is too big; I would suggest between four and eight people.
    They need to be motivated and help to keep you on track.


    Remember, it’s easy to put off tackling the cyber security process because the
    fires of today seem so important. Remember the story of the ITAR company with
    the server in the lobby? They were going to get to it, but never did because other
    things took priority. Each day they put it off, though, their risk only compounded.
    It helps to also put your reasons for cyber security on a big white board, someplace
    clearly visible in your office. That way, each day, you can read it saying, “I
    WILL NOT BE RANSOMWARED,” or something of the like.


    It''s also important to take notice of the things that you’re already doing right.
    You’re most likely not starting at square one. Do you have anti-virus on your
    computers? Do you use `2FA/MFA`? Do you already have policies? Are you conducting
    trainings with your employees? These wins remind you that each step isn’t that
    hard, and that you’re taking numerous steps to increase your cyber security already.
    This helps provide the momentum and motivation to keep going, to keep building
    your company’s cyber security and resilience even stronger.


    When you build a plan on how to move forward with cyber security, it’s important
    to assign dates to the different tasks. Remember to do one thing at a time so
    as not to overwhelm yourself and your team; you still need to be running the business.


    To implement the plan, use any structure that can help. If you’re getting cyber
    security services from a company (like my own), they’ll help you assess where
    you’re at, where you want to be, and then inform you of the things you need to
    get there. If you’re moving towards a compliance standard, they can help with
    that well, though it could be harder to understand what they’re looking for. If
    you’re not using an insurance or compliance standard, just start with the `NIST
    Framework`.


    ## The NIST Cybersecurity Framework Components:


    ### Identify

    Determine what is important and where it is. This includes the people, files,
    programs, and hardware that needs to be protected. Then, determine why it needs
    to be protected: Is it for compliance? Do workers work from home? Are you scared
    of being attacked, etc.?


    ### Protect

    Figure out how you are going to protect the important data you identified. Do
    you have backups? Is there anti-virus? Anti-spam? Do you have remote workers that
    use a `VPN`? What are the other security measures that you need? You’ll also want
    to build your plans for how to respond during an attack.


    ### Detect

    What method do you have to see if the plan is working? Do you have a monitoring
    company that checks logs? How are you determining if anyone is getting in or breaching
    your systems? Knowing that an attack is happening is a vital part of protecting
    yourself.


    ### Respond

    I am going to start with saying “RELAX” here again. If there is an attack or a
    breach, the first step will always be to RELAX. Then, have processes in place
    for how to address the attack. I have a document on steps to take if there is
    a breach which I will gladly send along to you, just reach out to `RELAX@ontechpartners.com`
    and ask for information on breaches. This is where having a policy in place can
    be very helpful.

