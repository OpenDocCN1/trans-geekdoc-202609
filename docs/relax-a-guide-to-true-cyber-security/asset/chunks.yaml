    \ the entire inventory system. I can go pack my things. I just wanted to make\
    \ sure that you knew.*” I was certain that in a few moments, everyone would know\
    \ that I destroyed the company.\n\nAnd then he said it: “*You’re fired, Ken*.”\
    \ After a brief pause, he laughed. “*No, you’re not. You just made a mistake;\
    \ we have backups for just these occasions. I’ll have it all back within the hour*.”\n\
    \nMy heart raced. I was saved! From that day forward, I had grown a great love\
    \ of backups. I had almost destroyed an entire company, but because of these magical\
    \ things called backups, I was saved!\n\nFrom that point on, I began my journey\
    \ of protecting what’s important. I may not have always stayed true to that path\
    \ but come with me as I share stories of many bad things—and many good things—that\
    \ companies endured as they faced the growing world of cyber hackers and other\
    \ cyber gremlins.\n\nJoin me as I take you through three decades of cyber adventures,\
    \ sharing how you can use this knowledge to protect your company and yourself.\n\
    \nI’ll explain ransomware, encryption, multi-factor authentication, backups, data\
    \ loss prevention and many other cyber security terms you need to be aware of.\
    \ Don’t worry, I’ll try to make them as fun and entertaining as possible.\n\n\
    Together, we can have fun as I make it easy to understand the dark and confusing\
    \ world of cyber attacks and help you get ready to keep your company and your\
    \ data safe. Sit back, get ready, and hold on tight!\n\nCHAPTER 2 \n\n# RISKY\
    \ BUSINESS\n\n![](images/chapter-2.jpg)\n\nIn respect to your business’ future,\
    \ have you ever been asked the question, “*What if you get hit by a bus?*” It’s\
    \ such a graphic way of saying that we need to think about the risks that face\
    \ our business. We use such graphic imagery because it shocks us into taking things\
    \ seriously. The “killer bus” stalking us reminds us to take note of what is important.\
    \ It makes us truly focus on the *why* of what we do. Far too often, we get bogged\
    \ down in the *what* and the *how,* but we forget the *why*.\n\nI always like\
    \ to start out my new client discoveries with the question “*WHY?*” The answer\
    \ to this question frames all following conversations about what is important\
    \ and what a business will need to do. I’ve found that many companies haven’t\
    \ had the “*why”* conversation. Many times, this happens because it’s difficult,\
    \ or the “daily fires” that must be addressed overwhelm that vital process.\n\n\
    Let me be perfectly honest with you: Cyber security is just crap! It’s expensive,\
    \ frustrating, and it can feel so useless. If you don’t understand the reason\
    \ *why* you’re doing it, the purpose it serves, then cyber security will feel\
    \ like the greatest money-suck that you’ve ever had.\n\nHave you ever wished that\
    \ you didn’t even need to use computers? Or had the nostalgic thought*, “In the\
    \ old days, people didn’t have to worry about hackers.”* When there were no computers,\
    \ there were no hackers. While this *is* a true statement, do any of us really\
    \ want to go back to the days of having stacks of paper covering every inch of\
    \ our offices? Don’t even get me started on the miles of filing cabinets taking\
    \ up most of the area you pay for in an office. We know the answer to this question\
    \ is, *“No, we don’t want to go back to a time before computers.”*"
