  trans: '


    在处理电子邮件攻击时，始终采取迅速行动、不要恐慌，并尽可能减少可能造成的损害至关重要。你行动得越快，黑客伤害你、你的客户、公司或朋友留出的时间就越少。


    # 第 7 章


    ## 门外的蛮人


    ![](img/image-07-3.jpg)


    作为一个对历史感兴趣的人，我经常在想，当日耳曼部落不断向南冲锋并攻入他们的城市时，罗马人会有什么样的感受。他们正常生活与掠夺者族群之间唯一的障碍就是他们的城门。现在，让我们思考罗马城门与距离这里
    32 公里的卡普佩纳（Capena）城门之间的区别。罗马是一个拥有许多强大且有防御能力大门的巨型城市，而卡佩纳只有一个大门可以用来抵御敌人。卡佩纳的大门今天依然屹立，是一个令人惊叹的奇观。


    作为小企业，我们每天都面临着同样的问题：成群的网络攻击者威胁向南入侵，蹂毁我们美丽的土地——我的意思是，计算机……并掠夺我们宝贵的信息。我们甚至可能会觉得，只有大型公司和企业才能建立最好的防御来保护自己免受攻击者。


    大型公司*确实*能够花费巨资来尝试防御自己，实施最的技术，并让整个部门专注于网络安全。然而，同样重要的是，即使是像 Target、Facebook、Adobe、Capital
    One、AT&T、BP 和 Apple 这样的公司，也都经历过网络安全泄露和攻击。金融机构也无法幸。我不确定你是否能在任何地方找到一家银行或其他金融机构没有面对过至少一次网络攻击。


    得知如此，你可能会想：“如果他们都不能保护自己的公司免受网络攻击，我该怎么做来保护我的公司呢？？”我想让你花点时间思考一下大门的用途。大门允许好人或理想的人进入，并将将坏人或不受欢迎的人挡在外面。它是如何把坏人挡在外的？很简单：它封挡了他们的入口。如果你关上大门，唯一的通过方法就是将其撞倒，这需要花费大量的精力和时间。大门也会把好人挡在外面。你如何让好人重新进来？你需要打开大门。


    黑客知道这一点。如果你打开大门，进去就不再费什么精力了（与试图闯入关闭的大门相比）。这就是为什么黑客使用电子邮件和恶意网页链接来获取你的网络访问权限。为了访问网页和其他云端站点，你必须所谓的“打开大门”。虽然只持续一会，但如果你向错误的人打开大门，他们就可以进入并从内部开始攻击。


    这就是你的大门（我们在极客术语中称为 `firewall`）发挥作用的地方。只要没有人打开大门，大多数现代防火墙都能有效地将不受欢迎的东西挡在外面。我们不断使用互联网处理一切，喜欢进出我们的小“村庄”。每当我们与外界建立连接时，我们就在小村庄和我们要访问的网站之间创建了一条路。如果那个网站是良好且安全的，我们就安全并快乐地获得我们需要的东西。如果那个网站糟糕或不安全，那么我们就是在为潜在的军队打开大门。


    现在，如果你有一个守卫看着每个经过大门的人呢？我们在电影中经常看到：守卫走到马车前，要求每个人出证件以确保他们应该进入村庄。这些守卫站岗在那里，帮助检测是否有“不受欢迎的人”试图跟随你回到村子里。在我们的大门上拥有这些守卫很重要，但同样重要的是记住，每当你打开大门时，坏人都会尝试进入。


    我们有一位客户，他们的“安全村庄”内有一台位于良好防火墙后的服务器。问题是，他们从村庄外部（即他们的办公室）访问这台服务器。在与我们合作之前，他们一直从村庄外直接连接到服务器，这意味着大门一直是开启的。当我们开始与他们合作时，我们告诉他们需要为该服务器创建一个受保护的路径，这样当他们在村庄外时就能受到保护。


    这种受保护路径被称为 `VPN`（虚拟专用网络），它保持共享信息的隐藏状态，使得只有你和你正在交流的计算机可以读取它。


    该客户以前从未经历过泄露，因此他们采取的策略是他们的村庄非常小，没有人会尝试攻击他们。他们告诉我们：“为什么会有人盯着我的小公司呢？”这是我们在许多小企业那里听得过多的陈述。


    现在我的工作是向他们证明，规模小并不能保护他们免受门外的蛮人。我提取了所有通过大门（他们的防火墙）的活动日志，仅仅在*一周内*，他们的服务器就遭受了 356,002
    次攻击！黑客正使用暴力破解攻击试图获取服务器的访问权限。


    为了让他们真正明白这一点，我向他们展示了 104,321 次攻击来自俄罗斯，38,342 次来自中国。真正让他们大开眼界的是，25,342 次攻击来自美国内部。正如你所见，攻击来自四面，无论是国内还是国外。这帮助他们理解他们并不是小到不会被攻击，同时也加强了确保自己受到保护的重要性。


    那么，企业应该怎么做？作为一个小企业，你需要建立分层防御。这种分层防御从防火墙开始，即村庄的大门。你会希望确保购买并使用支持 `IDS` 服务的防火墙，通常以年度订阅的形式。同样重要的是要确保部署它的公司知道如何配置和设置你的防火墙。


    # 第 8 章


    ## 备份伙伴


    ![](img/image-08-2.jpg)


    你还记得当你小时候参加郊游时，老师告诉你要找一个伙伴结对吗？你还记得为什么被要求这样做吗？因为这是确保你们安全且人数可追溯的简单方法。让两个人结对并互相照顾，要比让孩子们独自在每个方向乱跑要安全得多。备份也是同样的道理；你总是希望确保有一个“备份伙伴”。这是一个你存储数据的安全的地方，这样当你遭受网络攻击或计算机被盗或丢失时，就可以恢复它们。


    '
- fmt: '

    Let me share a story with you that demonstrates the power of backups. One of our
    clients, a large nonprofit, does most of its grant-writing and the bulk of its
    fundraising in the month of June. As you may suspect, this means that fundraising
    time is very important to their success and continued operation for the remainder
    of the year. For anyone that knows anything about nonprofit fundraising, you know
    that it’s a *very* stressful time.


    As it happened, I was also out of town at a cyber security convention the first
    week in June. The first day of the convention had finished and I was heading back
    to my hotel room. It was an exciting day of presentations and discussions, and
    I was flush with new knowledge of all the great cyber security products and services
    that our company would be reviewing over the next few months.


    By the time I got settled in for the night, it was close to midnight. Suddenly,
    my cell phone rang. Figuring it was my wife wanting to say goodnight, I answered
    the phone. I’m glad I didn’t answer the phone by saying “Hi, honey,` because it
    wasn’t my wife that was calling, but the administrator of this nonprofit!


    His voice was laced with concern as he asked if I was still awake. “What’s wrong?”
    I asked, figuring he wouldn’t be calling me this late on a Saturday just to see
    how I was doing. I have to admit, my heart sank a little when I heard his voice
    because I wasn’t sure what was going to be wrong, and I was 800 miles away.


    “We’ve lost the database server and all of the reports for the fundraising were
    on that server!” His voice was short and panicked. “I’ve tried everything but
    I’m not able to get it started again.”


    I let him know that I wasn’t in Cleveland (where he was located), but that I would
    remote in and see what I could do. I knew he was in trouble because they had a
    team of about twenty people pulling all-nighters to get these reports and grants
    in on time. If they weren’t able to get these in by the deadlines, it meant they
    would have to make layoffs before the end of the year. It was not a thought any
    of us wanted to consider.


    Sitting at my desk in the hotel room, I contemplated my options. It was clear
    that I was not able to access the server because of a hardware failure, so that
    option was off the table. I had to look at alternatives. Fortunately, I had recently
    implemented a hybrid cloud backup. This is a fancy nerd way of saying that I had
    a backup system in their office that made copies in the cloud.


    Quickly logging into our portal, I activated the `Virtual Server Recovery` feature.
    This created a virtual copy of the database server that they would be able to
    use until I was back in town. The entire process ended up taking about 20 minutes
    from call to recovery. Before signing off, I asked the administrator to confirm
    that everything was up and working again. With a huge sigh of relief in his voice,
    he said, “Yes, we’re back up and running. Thanks so much for all your help – this
    really saved us!”


    When I got back in town later that week, I went in and fixed their broken server.
    With the `Virtual Server Recovery` I implemented, they were able to continue with
    their fundraising and grant applications, securing all the grant money and funding
    that they needed for the year. Everyone praised the administrator for keeping
    things running, and he thanked me for being there when he needed me most. All
    of this was because of the power of my backup buddy.


    ## How to pick a backup buddy?


    Let me give you some guidance on this.


    When picking a backup buddy, you want to determine *what* you are protecting.
    If you only need to protect files, such as pictures or word documents, many online
    services are available. For example, you have access to unlimited backup of pictures
    if you have an `Amazon Prime` account.


    If you have critical applications that you use, then you’ll want to look for a
    more active backup solution. A hybrid backup with data in the cloud and on an
    appliance in your office may be necessary. One advantage to these hybrid backups
    is the fact that if the Internet is down for some reason, you’re still getting
    a backup of your system, it’s just not getting copied to the cloud.


    When selecting a backup, here are a few things you’ll want to look for:


    1. That the backup is encrypted, meaning that it’s set up and protected so that
    only you can read it, both while it is being backed up, sometimes called “in transit,”
    and when it is sitting `at rest`.

    2. That the backup is ransomware resistant.

    3. How long is the retention period?

    4. Can it start a virtual recover?

    5. Can it do a bare metal restore?

