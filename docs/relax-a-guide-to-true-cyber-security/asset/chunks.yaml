- fmt: '

    Months, or even a year later, this seemingly benign little program reveals its
    true nature. It begins its attack, either by locking your data, sharing your sensitive
    information, or some other nefarious thing that you don’t wish it to do.


    The hackers know that you, being a responsible cyber citizen, have good backups
    and have protection. You go to your backups and recover the lost information.
    But wait! Within that backup, there is a quiet little program waiting to ride
    back into your environment to wreak havoc. As soon as you restore your backup,
    it attacks again, *from within your backup*, because that’s where it’s been hiding
    and being copied to for so many months. Do you see the dilemma?


    How do you stop these sleeper agents? This is where you you want to watch them
    as they come in. Operating systems, like `Windows` and `Mac OS`, will assume that
    if you authorize the program, it should be allowed to install. The hackers take
    advantage of this and put their sleeper agents into other install software. This
    way, when you click on ‘yes I want to install’… it just comes along for the ride.


    This is where an application control program can help. It looks at all the programs
    that should be running on your computer and looks for ones that do not appear
    to be doing anything or are acting out of the ordinary. It then flags these programs
    and sections them off, not allowing them to make changes to your vital information.


    The system does this by learning what you do and how your computer works. It then
    watches each program to see if it’s working in that same way. If it is, then everything
    is good and can carry on its merry way. But, if an agent is being too quiet or
    starts to ask to make changes to your files that is out of the ordinary, it is
    shut down, preventing it from accessing any of your files.


    It is important to remember that cyber attackers are always looking for ways to
    hurt you and make you pay. Cyber security is never going to be a one-and-done
    situation, so you should always be adapting— the hackers are.


    ## CHAPTER 11


    # THE BOSS SAID TO SEND IT


    ![](images/image-11-2.jpg)


    Have you ever received an email from your boss asking you to purchase a gift card
    for her daughter… but you know your boss doesn’t have a daughter? Or an email
    asking you to pay an invoice that you never received? Phishing attacks happen
    *millions of times* each day. Some are just general attacks that hackers send
    out to thousands of individuals seeing if anyone bites, and some of them are very
    directed and detailed to mislead you into sending money or providing vital information.


    These attacks are called *phishing attacks* because they are ‘fishing’ to get
    your information. Often, they’re hoping you take the bait and click on that link
    or answer their phone call so they can swindle you into sharing your sensitive
    information. I wish it wasn’t the case, but you’d be amazed at how successful
    these attacks are.


    One specific form of phishing is call *spear phishing*. This is when a hacker
    uses a targeted attack to try to get you to share your information or take your
    money. Many of us have experienced this form of phishing attack. Using the previous
    example, you receive an email that appears to be from your boss asking you to
    purchase a $5 gift card for her daughter. Because the email appears to come directly
    from your boss, you’re less likely to question its validity. In this example,
    purchasing a $5 gift card may seem minor, but these kinds of phishing attacks
    can lead to massive damages.


    ## Case Study: The Expensive Invoice


    A spear phishing attack cost a local company over one hundred thousand dollars.
    It was a normal Tuesday at a large manufacturing site. The day was warm, and the
    sun was shining through the windows of the second-floor accounting department.
    On the surface, it appeared to be like any other day, with payments being made
    and transactions taking place. This, however, was not a normal day. The accounting
    department was about to get an email that would cost them dearly.


    The accounts payable director, we’ll call her Mary, was going through emails addressed
    to `Accounts Payable`. It wasn’t unusual for her to get thirty or forty emails
    a day, largely about payment issues.


    Mary was reading through the emails when she noticed one from a vendor that her
    company worked with on a regular basis. The email stated that there was an outstanding
    invoice balance in the amount of $138,000 dollars that needed to be paid immediately
    and listed the bank account to send the payment.


    Mary had just a moment of hesitation as she reviewed the bank account. It didn’t
    look like their normal bank account, but she had twenty other issues to address
    at the same time. She was familiar with this vendor, so she assumed that the information
    was accurate and proceeded in processing the payment.


    Clicking on the provided link, she started the cash transfer to the bank account.
    No flags were raised at the bank either because it was normal for them to transfer
    large sums of money like this.


    Two days later, Mary checked with another clerk to attempt to find the missing
    invoice and immediately began to feel a knot tighten in her stomach. As they conducted
    their search, they were unable to find any outstanding invoices for $138,000.
    In a panic, they called the vendor and asked what the latest invoices were.


    Waiting with anticipation, Mary watched for the email with the outstanding invoices,
    as well as the last few invoices paid amounts. The notification bell dinging in
    `Outlook` told her that the email had arrived. As she opened the `Excel` spreadsheet,
    her heart dropped. On reviewing both past and present invoices, there were none
    in the amount of $138,000. In fact, there were no outstanding invoices at all!


    It was a devastating blow to Mary who then had to go to the `CFO` and inform him
    that she had just lost the company $138,000. We attempted to contact the bank
    about the wire transfer, but it was already too late; the money had been withdrawn.


    ## Prevention and Best Practices


    As you can see, many of the above steps require reaching out and speaking with
    someone directly to confirm any changes. A simple phone call could have saved
    this company over a hundred thousand dollars.


    1. They required all payments to be connected to an invoice.

    2. If they received an invoice from a vendor that was not expected and over $1,000,
    they would call the vendor to confirm the amount.

    3. Any change of payment request would require a call to confirm.

    4. They created a list of approved bank accounts. If a request was made to make
    an `ACH` payment to an account that was not on the list, there would be a phone
    call to confirm the change.

    5. They always used a known email address for the vendor to confirm emails, not
    the reply button.

    6. Lastly, if things didn’t feel right, they wouldn’t process the payment.


    In addition to the steps that this company implemented, you may want to purchase
    active anti-phishing and anti-virus email services. These services can help to
    remove such threats against your company.

