    \ help you be more mindful of cyber security, and to take the time to stop and\
    \ think before *responding* to a cyber threat—rather than *reacting* (and yes,\
    \ there *is* a difference). If there’s one thing that I’ve learned from the many\
    \ friends and family members that have supported me on this journey, it’s that\
    \ being in a panic leads to bad decisions and poor results.\n\nYou’ll also learn\
    \ more about my core philosophy that I try to live my life by (I learned it on\
    \ an airplane!). That philosophy is this: Always put the oxygen mask on yourself\
    \ first. If you’re not taking care of yourself and addressing your needs first,\
    \ you can’t help others to address their needs. Cyber security is no different.\
