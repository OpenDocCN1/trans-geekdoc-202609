    \ completely clueless. Each step of the way, I did it wrong and pretended I couldn’t\
    \ figure out where to click.\n\nAfter almost an hour, he said that he could just\
    \ log into my computer and do it for me.\n\nI responded, “*I don’t think I should\
    \ do that. I was told by my computer guy that I should never allow anyone into\
    \ my computer*.”\n\nWith growing frustration, he shot back, “*If you don’t let\
    \ me get in and help you with ordering the Bitcoin, then the IRS will have to\
    \ foreclose on your house!*”\n\n“*My house!*” I said stunned. “*That doesn’t seem\
    \ right. I think I’m going to need your badge number, sir. I don’t think that\
    \ an IRS agent is allowed to threaten my house like that*.”\n\n“*Sir, we’re not\
    \ allowed to give out our badge numbers to people*,” he said with an irritated\
    \ tone.\n\n“*Let me see if I understand: you’re a federal agent with a badge that\
    \ you will not share with me? I think there’s something wrong with this*.” I should\
    \ mention here that IRS agents don’t have badge numbers, but my attempted hacker\
    \ didn’t know that. I was just pulling into the parking lot at the office, and\
    \ it was time for me to end the call.\n\n“*Sir!*” he said, clearly angry with\
    \ me. “*I need to get into your computer right now so that I can get the money\
    \ you owe transferred. Now please give me your email so I can send you the link*.”\n\
    \n“*I’ll gladly do that if you can do just one thing for me: tell me my full name*.”\n\
    \n“*What do you mean, sir?*” he asked.\n\n“*If you are the IRS, then you know\
    \ my full legal name. Please tell me it*.”\n\nThe phone went dead; no more Hamon\
    \ from the IRS. Even though he did start to get a little rude towards the end,\
    \ he certainly made the drive to the office fly by!\n\nHere are some tips when\
    \ receiving unexpected calls about collections, regardless of whether it’s the\
    \ IRS or any other company or organization that’s calling.\n\n1.  Always ask for\
    \ information in writing. You have a right to get any outstanding bills in written\
    \ form. The IRS will *never* directly call you if they have not sent a written\
    \ notice.\n\n2.  Never pay on-the-spot and over the phone. Some hackers have even\
    \ gone so far as to offer to stop at your house to pick up payment! Can you imagine?\
    \ This is *never* legitimate. Ever.\n\n3.  Ask for a phone number to call them\
    \ back, and then check to see if that phone truly does belong to a known company\
    \ (rather than an unlisted or unverifiable number). You’ll also want to check\
    \ your own files and records to see if you actually owe that company money.\n\n\
    4.  IRS agents don’t have badges. If you get a call from someone claiming to be\
    \ from the IRS, ask them for their badge number. If they truly are with the IRS,\
    \ they will know they don’t have badge numbers.\n\n5.  Never make a payment you\
    \ haven’t personally verified, especially if they ask for Bitcoin. Bitcoin is\
    \ an *untraceable* method of taking your money, which is why hackers like to use\
    \ it."
