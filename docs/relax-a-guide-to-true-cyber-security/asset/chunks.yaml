    # RELAX


    ## A GUIDE TO TRUE CYBER SECURITY


    ## J. KENNETH FANGER, MBA


    ![The Paper House](images/image.jpg)


    # CONTENTS


    - [Preface](#preface.xhtml)

    1. [Introduction](#chapter-001.xhtml)

    2. [Risky Business](#chapter-002.xhtml)

    3. [If It Ain’t Broke, Better Fix It](#chapter-003.xhtml)

    4. [What’s the Word?](#chapter-004.xhtml)

    5. [Don’t Fear the Factor](#chapter-005.xhtml)

    6. [Email, Why is it Always Email?](#chapter-006.xhtml)

    7. [Barbarians at the Gate](#chapter-007.xhtml)

    8. [Backup Buddies](#chapter-008.xhtml)

    9. [What? A Patch?](#chapter-009.xhtml)

    10. [Always in Waiting](#chapter-010.xhtml)

    11. [The Boss Said to Send It](#chapter-011.xhtml)

    12. [The Call Came from Inside the House](#chapter-012.xhtml)

    13. [We Are All Held Ransom](#chapter-013.xhtml)

    14. [Compliance Conundrum](#chapter-014.xhtml)

    15. [Put it in Writing](#chapter-015.xhtml)

    16. [Get on the Training Train](#chapter-016.xhtml)

