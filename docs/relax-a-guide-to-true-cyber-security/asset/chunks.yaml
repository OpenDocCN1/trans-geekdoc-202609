- fmt: "\nVishing attacks can be very frustrating, and it only gets worse if you’ve\
    \ had collections calls. Always remember to RELLAX, and don’t let them panic you\
    \ into acting. Don’t follow their instructions just because they say that you\
    \ have to, or because they’re trying to pressure you or make you flustered (which\
    \ are all tactics they use to get you to comply). Count to ten, remember the tips\
    \ you’ve learned here, and then decide what steps to take next.\n\n# CHAPTER 13:\
    \ WE ARE ALL HELD RANSOM\n\n![](images/image-13-2.jpg)\n\nNo cyber security book\
    \ would be complete without scaring you against the boogieman of all cyber attacks:\
    \ the dreaded ransomware (cue dramatic music). Ransomware seems to receive more\
    \ attention than all other cyber attacks combined. This is the same kind of attack\
    \ that shut down an oil pipeline and hit so many cities and towns across the US.\
    \ It seems like every time we turn on the news or scroll through our phones, we’re\
    \ constantly hearing about this company or that company that had to pay some huge\
    \ ransom amount to regain access to their files or accounts, or worse, they paid\
    \ and were never given back access.\n\n## What is ransomware?\n\nRansomware is\
    \ anything that holds your information captive or hostage until you pay the ransom\
    \ to recover it. In most cases, the hackers do this by encrypting all your files.\
    \ I like to think of encrypting like having a piece of paper that you’ve written\
    \ on, and then taking a thick black marker and rubbing it all over the paper in\
    \ order to block out everything you’ve written. The things you wrote are still\
    \ there, but you just can’t read it anymore. When you think of it this way, then\
    \ you can understand ransomware as the hackers taking a black marker to all your\
    \ files; you can’t read them anymore, but they’re willing to sell you the “marker\
    \ remover” so your files are able to be read again.\n\nI’m sure actions like this\
    \ by the hackers makes you mad— it makes me mad! They’re causing the damage to\
    \ your files, and then demanding that you pay them to fix it! It’s like the protection\
    \ rackets you hear about from the mob; they’d promise not to destroy your business\
    \ if you paid them. Just like the hackers, they’re the ones causing the harm and\
    \ then demanding you to solve it through payment in some form.\n\nI’ve mentioned\
    \ several times throughout this book how hackers are adjusting and adapting their\
    \ attacks. In the past, they’d just encrypt your information, but today, they\
    \ also threaten to release it publicly. With the ever-increasing compliance requirements\
    \ that we face, like `PCI` and `HIPAA`, the threat of release becomes an even\
    \ greater issue.\n\n## Case Study: Holds\n\nLet me share a story about two companies.\
    \ Our first company, we’ll call it `Holds`(name changed to protect privacy), gave\
    \ me a call saying that I had been referred to them. I went onsite to see what\
    \ was happening and saw they had a local server with all their files on it. Everyone\
    \ saved their data to the server, and they performed a backup on the server each\
    \ night to an attached USB external drive.\n\nWhen I arrived, they were in a panic.\
    \ All the company files were encrypted—remember the “covered in thick black marker”\
    \ analogy in the last chapter? Eddie, the president, told me that when he saw\
    \ the files were encrypted, he went and tried to perform a restore from the backup.\
    \ With tears in his eyes, he told me the backup didn’t work, and that the backup\
    \ had also been encrypted.\n\nI asked him if he had an additional backup that\
    \ was not attached to the server. He answered, “No, we only have the one drive\
    \ that we were told to keep attached to the server so that it would backup.” \n\
    \nI felt terrible for him. Here was a company that had tried to do the right thing,\
    \ and it failed them. Before the days of cyber attackers, it was the right thing\
    \ to do: make sure you always have a backup. The tragic mistake here was that\
    \ you want to have multiple backup locations, and not have the backups attached\
    \ directly to the server all the time. Many of the ransomware attacks now look\
    \ for attached storage that may have backup files on them because hackers know\
    \ that a backup is one of the best ways to recover from a cyber attack (and obviously\
    \ they don’t want to see you do that if they intend to get paid).\n\nWe immediately\
    \ contacted the `FBI` who came out to investigate and gave us several of the known\
    \ encryption keys. While these known encryption keys do work about half the time,\
    \ in this case, they didn’t. We ended up having to rebuild many of the documents\
    \ and recreate their files from scratch. This meant that we went through all the\
    \ other computers and emails and tried to find any copies of files that were needed.\
    \ It was a long and painful process.\n\n## Case Study: Makastuff\n\nNow, let’s\
    \ look at another company, `Makastuff`(name also altered for privacy), a manufacturing\
    \ firm that makes stuff. Makastuff had been a client of ours for about five months\
    \ when my engineer noticed that there was an issue with their server. He called\
    \ `John`, his contact at `Makastuff`, to ask what was going on.\n\nJohn hemmed\
    \ and hawed when we first called him. “I think I did something to the server,”\
    \ he finally admitted.\n\nMy engineer asked, “What happened?”\n\n“Well, I was\
    \ on the server and decided to do some shopping; I figured it wouldn’t hurt. I\
    \ went to a link that was in my email and then suddenly all of my desktop items\
    \ started to have strange letters,” he responded sheepishly.\n\n“It’s okay, we\
    \ all make mistakes,” my team member told him. “Let’s see if we can figure out\
    \ what’s going on.”\n\nAfter checking the server, my engineer determined that\
    \ it was `WannaCry` ransomware. It had not yet spread across the entire network,\
    \ but damage was done. The attackers were demanding a ransom payment of `$5000`\
    \ via cryptocurrency. That was not going to happen.\n\nFor the past few months,\
    \ we had been performing a ransomware resistant backup of their system, so the\
    \ next steps were rather easy. Using the backup, we were able to restore the company\
    \ to the state their system was in the previous evening; it only took an hour\
    \ to get back in place.\n\n## Prevention Strategies\n\nAs you can see by these\
    \ two examples, there are very different ways that a ransomware attack can end.\
    \ You can lose all your data and pay a ransom (hoping you get your data back,\
    \ but with no guarantee), or you can build a backup recovery plan to make sure\
    \ you’re able to recover. Just remember: hackers are always looking for ways to\
    \ get past your defenses. It’s worth millions of dollars to steal information.\n\
    \n1. **Have ransomware resistant backups**. That means the backups need to be\
    \ separated from the computer itself. They can be onsite, in the cloud, or like\
    \ our solution, both onsite and in the cloud. They also need to be encrypted during\
    \ the initial backup and where the backups are stored – this protects against\
    \ people being able to steal your backups. Remember to always test your backups\
    \ so you know they’ll be there when you need them; they are your backup buddy,\
    \ after all.\n\n2. **Have current and active anti-virus**. This can protect your\
    \ computer from known attacks.\n\n3. **Have an application control to protect\
    \ against hidden programs**. You may remember that hackers are now putting sleeper\
    \ programs that wait for months before they attack to make your backups less effective.\n\
    \n4. **Use anti-spam and email protection**. Many times, ransomware is hiding\
    \ in emails or links from emails; these programs filter those out. If you never\
    \ see the bad email, you won’t be tempted to click on it.\n\n5. **Don’t go to\
    \ unknown sites or click on links**. Many of the ransomware attacks happen by\
    \ clicking on a bad link or going to a bad site.\n"
