    With increased cyber security compliances and standards being implemented throughout
    the world, you’re going to find that outdated equipment will no longer be permitted—and
    for good reason! For example, if you want to work with the US federal government,
    it is required that old equipment be removed or isolated. Eventually, companies
    will see that the cost to maintain that equipment will become higher than the
    value it brings.


    As hackers become more creative in how they launch an attack, it’s important to
    remember that you can’t wait for the attack to happen before you address it.


    Let me share one more reason *not* to wait to upgrade. We were working with a
    major company that had old analog lines for connecting to their remote sites—costing
    $35,000 per month to maintain. The worst part was, there was only ONE man at `AT&T`
    who knew how to implement or maintain those lines because they had been discontinued
    almost *fifteen years* *earlier*.


    One day while awaiting support on one of those lines, the client received a call
    from `AT&T`. The engineer, the only man that knew how to run those lines, had
    just died of a heart attack. At that moment, we started to scramble to get those
    lines replaced for the company as quickly as possible. It was not a pleasant experience
    for them, but it was a valuable lesson learned.


    Constant upgrades are expensive, and we’re all tempted to just keep using what
    we already have. It’s a cost that we just don’t want to pay, but I urge you to
    remember the drug company example I shared earlier. They didn’t want to pay $4
    million dollars to make the necessary upgrades, so they wound up having to pay
    $45 million dollars after the system completely crashed. As the old adage goes,
    “*An ounce of prevention is worth a pound of cure*.”


    # CHAPTER 4


    ## WHAT’S THE WORD?


    ![](images/chapter-4.jpg)


    Passwords! Passwords! Passwords everywhere! I can’t possibly think of another
    one! More than eight characters, upper case, lower case, numbers, special characters…
    aaah! How many passwords do we *really* need in life? We’ve got passwords for
    our bank accounts, `Netflix`, `HBO Max`, and `Disney Plus`. Then there’s online
    services, phone services, `Uber`, food delivery, brand loyalty accounts… Lord
    only knows what else! I have over 5,000 different passwords between all my clients
    that I need to remember (crazy, right?), so it’s only reasonable that I would
    want just one password to rule them all— and of course, every cyber security person
    will tell you that’s a *very* bad idea.


    It''s just not functional or practical to try to remember the dozens (or hundreds)
    of the passwords that you use each day. To make matters worse, many sites have
    auto login functionality that allows you to save (and then forget) your password,
    so you don’t have to enter it each day.


    It’s important to remember that passwords are your first line of defense. While
    on one hand they keep much of your information safe, there’s also just too many
    to realistically remember. I remember when I worked in the pharmaceutical industry,
    we had a policy requiring us to change our passwords every ninety days. What made
    it even worse was the fact that you couldn’t use any portion of the previous passwords
    in the new password.


    This was a great idea in theory, but a really bad one in practice. You see, many
    sites have auto login functionality that allows you to save (and then forget)
    your password, so you don’t have to enter it each day.


    It’s important to remember that passwords are your first line of defense. While
    on one hand they keep much of your information safe, there’s also just too many
    to realistically remember. I remember when I worked in the pharmaceutical industry,
    we had a policy requiring us to change our passwords every ninety days. What made
    it even worse was the fact that you couldn’t use any portion of the previous passwords
    in the new password.

