    \ and click on that link or answer their phone call so they can swindle you into\
    \ sharing your sensitive information. I wish it wasn’t the case, but you’d be\
    \ amazed at how successful these attacks are.\n\nOne specific form of phishing\
    \ is call *spear phishing*. This is when a hacker uses a targeted attack to try\
    \ to get you to share your information or take your money. Many of us have experienced\
    \ this form of phishing attack. Using the previous example, you receive an email\
    \ that appears to be from your boss asking you to purchase a $5 gift card for\
    \ her daughter. Because the email appears to come directly from your boss, you’re\
    \ less likely to question its validity. In this example, purchasing a $5 gift\
    \ card may seem minor, but these kinds of phishing attacks can lead to massive\
    \ damages.\n\nHere's an example of a spear phishing attack that cost a local company\
    \ over one hundred thousand dollars. It was a normal Tuesday at a large manufacturing\
    \ site. The day was warm, and the sun was shining through the windows of the second-floor\
    \ accounting department. On the surface, it appeared to be like any other day,\
    \ with payments being made and transactions taking place. This, however, was not\
    \ a normal day. The accounting department was about to get an email that would\
    \ cost them dearly.\n\nThe accounts payable director, we’ll call her Mary, was\
    \ going through emails addressed to Accounts Payable. It wasn’t unusual for her\
    \ to get thirty or forty emails a day, largely about payment issues.\n\nMary was\
    \ reading through the emails when she noticed one from a vendor that her company\
    \ worked with on a regular basis. The email stated that there was an outstanding\
    \ invoice balance in the amount of $138,000 dollars that needed to be paid immediately\
    \ and listed the bank account to send the payment.\n\nMary had just a moment of\
    \ hesitation as she reviewed the bank account. It didn’t look like their normal\
    \ bank account, but she had twenty other issues to address at the same time. She\
    \ was familiar with this vendor, so she assumed that the information was accurate\
    \ and proceeded in processing the payment.\n\nClicking on the provided link, she\
    \ started the cash transfer to the bank account. No flags were raised at the bank\
    \ either because it was normal for them to transfer large sums of money like this.\n\
    \nTwo days later, Mary checked with another clerk to attempt to find the missing\
    \ invoice and immediately began to feel a knot tighten in her stomach. As they\
    \ conducted their search, they were unable to find any outstanding invoices for\
    \ $138,000. In a panic, they called the vendor and asked what the latest invoices\
    \ were.\n\nWaiting with anticipation, Mary watched for the email with the outstanding\
    \ invoices, as well as the last few invoices paid amounts. The notification bell\
    \ dinging in Outlook told her that the email had arrived. As she opened the Excel\
    \ spreadsheet, her heart dropped. On reviewing both past and present invoices,\
    \ there were none in the amount of $138,000. In fact, there were no outstanding\
    \ invoices at all!\n\nIt was a devastating blow to Mary who then had to go to\
    \ the CFO and inform him that she had just lost the company $138,000. This is\
    \ when they called me.\n\nWe attempted to contact the bank about the wire transfer,\
    \ but it was already too late; the money had been withdrawn and vanished.\n\n\
    Rest assured, no Accounts Payable clerks were harmed in the making of this cyber\
    \ attack, but it was a gut-wrenching experience for both her and the CFO. That’s\
    \ not to say that there can’t be upsides to cyber attacks, because there certainly\
    \ are! In this case, it led to the implementation of a vital checks and balances\
    \ protocol in payment processing.\n\nWhat were some of those check points that\
    \ we implemented? I’m glad that you asked!\n\n1.  They required all payments to\
    \ be connected to an invoice.\n\n2.  If they received an invoice from a vendor\
    \ that was not expected and over $1,000, they would call the vendor to confirm\
    \ the amount.\n\n3.  Any change of payment request would require a call to confirm.\n\
    \n4.  They created a list of approved vendor bank accounts. If a request was made\
    \ to make an ACH payment to an account that was not on the list, there would be\
    \ a phone call to confirm the change.\n\n5.  They always used a known email address\
    \ for the vendor to confirm emails, not the reply button.\n\n6.  Lastly, if things\
    \ didn’t feel right, they wouldn’t process the payment.\n\nAs you can see, many\
    \ of the above steps require reaching out and speaking with someone directly to\
    \ confirm any changes. A simple phone call could have saved this company over\
    \ a hundred thousand dollars.\n\nI wish I could say that this was an unusual and\
    \ rare situation, but I have many stories of similar attacks that resulted in\
    \ hundreds of thousands of dollars mistakenly sent to hackers. With as busy as\
    \ we all are, and as many ‘fires’ as we attempt to put out each day, it’s easy\
    \ to see how something like this happens. Unfortunately, not taking that extra\
    \ step or listening to your gut feeling, could easily end up costing you a lot\
    \ more than a few extra minutes.\n\nIn addition to the steps that this company\
    \ implemented, you may want to purchase active anti-phishing and anti-virus email\
    \ services. These services can help to remove such threats against your company."
