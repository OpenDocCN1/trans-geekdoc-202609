    ## 恢复


    现在你需要在遭受攻击后重新回到工作中。这可能包括恢复丢失的数据、回顾发生的情况并调整当前的保护计划、对团队进行额外培训等。在攻击后恢复到正常状态至关重要。攻击是违规行为，它们会让你感到无助和恐惧；营造一种正常感将帮助你的团队回到你正在从事的重要工作中。


    网络安全并不一定令人恐惧，尽管许多末日论的网络安全专业人士想让你相信的那样；让员工的工作变得有趣会有帮助。记住最重要的一点是什么？开始。尽管开始。每天做一些事情来提高网络安全，它看起来就不会是那么压力重重或可怕；把它看作是保护你的公司、你的团队以及你自己。


    ## 第 19 章


    ## 缩写死的 (DEATH BY TLA)


    ![](img/image-19-2.jpg)


    我告诉我，网络安全人士有他们自己的语言。事实如此——我们确实有一整套 `TLA`，即三字母缩写词。我我很喜欢我一个朋友用一个缩写来定义了我们所有疯狂的缩写。不幸的是，我有时觉得网络安全人士使用所有这些缩写是让你保持困惑的一种手段。


    我收集了一些常用的缩写词，以便你更容易理解那些网络极客到底在说些什么。我还尝试用“普通老百姓或老太太”能听懂的语言来解释它们的含义。我没有把自己包含在那个列表中，因为我已经被缩写词的黑暗面吞噬了。某一天，我在一次社交活动上与一群男女商人交谈时意识到了这一点。


    我们坐坐在一起，讨论是什么让我们彼此与众不同。我非常自豪地站起来说：“我们是非 `MSP` 服务。我们正致力于确保你们成为网络旅程的一部分。”我等候每个人告诉我，我这种与世界上所有其他
    `MSPs` 区别开来的愿景是多么伟大。


    一片死寂瞬间笼罩了我，因为每个人都用我见过的最困惑的表情看着我。这时，一个女人站起来问：“什么是 `MSP`？”我简直崩溃了。为了在我的行业中脱颖而出，我付出了巨大的努力，以至于我没有考虑到行业之外的大多数人不知道
    `MSP` 是什么。记录一下，`MSP` 代表 `Managed Service Provider`（托管服务提供商）。


    很明显，我说的不是我客户的语言；我说的是我行业的语言。在我所有的贸易展和技术期刊上，他们都在谈论 `MSP` 旅程和 `MSP` 服务，以至于我以为每个人都知道它。但行业之外的人并不知道。从那天起，我意识到我们都可能陷入这种用自己行业语言说话的陷阱，而没有意识到对于我们行业之外的大多数人来说，这完全是胡言乱语。


    我加入这一章节是为了帮助你理解网络安全人士可能会对你说的一些术语。这显然不是网络人士使用的所有术语的完整列表，但它将为你提供一个很好的起点参考。我不指望你背它们，而是希望当你听到这些词时有一个地方可以查阅。


    ### CMMC

    `CMMC` – 网络安全成熟度模型认证（Cyber Maturity Model Certification）。你是否想过与政府签订合同？好吧，这不会让你变得更兴奋（但它是必要的）。`CMMC`
    是国防部发布的新标准，旨在确保公司至少具备基础的网络安全和保护。这只是政府要求你做的又件事之一……除了死亡和交税之外。


    ### MFA/2FA

    `MFA/2FA` – 多因素/双因素身份验证（Multi-Factor/2-Factor Authentication）。像大多数人一样，你可能有过多次这样的想法：“密码？我不需要另一个该死的密码了！”好吧，现在你需要的比密码更多。`MFA`
    要求你在登录账户时具有两个或多个不同的判断标准。好消息是，我们中的许多人已经在银行和其他金融机构使用了这种身份验证方法。如果你开启了 `MFA`，你就会知道，因为当你登录某个网站时，它会要求你输入密码，并且输入一个发送到你手机上的代码。我知道你讨厌必须做这些，但相信我，这会让黑客获取你的账户访问变得困难得多，因为他们不仅需要破解你的密码，还需要窃取或设法访问你的手机以获取验证码。你可以看到这会让你的账户被破解变得困难多少倍。


    ### VPN

    `VPN` – 虚拟专用网络（Virtual Private Network）。还记得疫情之初数百万人开始居家办公吗？好吧，我们许多人很快发现那是一种非常不安全的工作方式。那时我们开始实施
    `VPNs`。`VPN` 是一种使用加密（一种让其他人无法读取你的信息的方法）的系统，在你的计算机和办公室网络之间建立更安全的连接。个人 `VPN` 还允许人们通过创建一个指向第三方地点的不可读链接，保护他们免受互联网上监视他们。


    ### DLP

    `DLP` – 数据丢失防护（Data Loss Prevention）。你是否想过如果有人从你的医生诊所拿走了你的医疗记录会发生什么？好吧，`DLP` 计划会解决这个问题。这是一个允许重要数据受到保护和恢复的计划。假设你想确保客户记录不会落入竞争对手手中；`DLP`
    计划将有助于确保这一点。这是一个确保数据不丢失或被窃取的计划。良好的 `DLP` 系统应该保护你的信息免受试图窃取的攻击。


    ### EDR

    `EDR` – 终端检测与响应（Endpoint Detection and Response）。电脑就像是网络的培养皿（这个比喻很棒吧？）。恶意程序和病毒往往生长在那里，这意味着那是大多数坏事情发生的地方。保护电脑和手机是
    `EDR` 的主要目标。在观察网络安全时，了解终端发生了什么至关重要。


    ### XDR

    `XDR` – 扩展检测与响应（Extended Detection and Response）。所以，当你让所有的终端都感到安全时，其他部分呢？为了不被遗漏，安全世界扩展了保护，不仅包括终端，还包含了中间的所有设备。


    ### IDS/IPS

    `IDS/IPS` – 入侵检测系统/入侵防御系统（Intrusion Detection System/Intrusion Prevention System）。有时你希望在大门口有一个“大狗”。你的
    `IDS/IPS` 就是那个试图把所有人挡在外的狗。当你拥有入侵检测和防御时，你正在主动阻止坏事的发生并确保只有好东西进入。


    ### MSSP

    `MSSP` – 托管安全服务提供商（Managed Security Service Provider）。有时你只需要或希望别人来照顾你。`MSSP` 会处理你所有的安全问题，但重要的是你不能仅仅把安全交给别人就希望万事无忧。你需要与伙伴建立关系，并确保积极参与保护对你重要的东西。


    ### NIST

    `NIST` – 美国国家标准技术研究院（National Institute of Standards and Technology）。如果你只想让别人告诉你该做什么，就去那里。`NIST`
    是一个建立安全和合规标准的政府机构。所以，当你想要被告知你需要做什么时，只需问问 `NIST`，他们就会告诉你。


    ### SIEM

    `SIEM` – 安全信息和事件管理（Security Information and Event Management）。你是如何知道自己被攻击的？好吧，这就是
    `SIEM` 系统上场的地方。这个系统会收集有关你的计算机或网络的信息，并判断是否存在威胁或潜在攻击。`SIEM` 系统使用实时监控在攻击者攻击时发现并响应他们，让你在过程中感到更加安全。


    '
- fmt: '

    **SOC** – Security Operations Center. Where do all the security people live? That’s
    easy! They live in a `SOC`… maybe next to the old lady in a shoe? Security people
    spend their time at the `SOC` watching to see if bad people are trying to do bad
    things to your computers.


    **SSO** – Single Sign-On. Passwords, passwords, passwords! It seems like we enter
    passwords everywhere, but it doesn’t always have to be that way. A Single Sign-On
    is just want it sounds like— sign on once and get access to all that you need!
    Yes, please!


    **RMM** – Remote Management and Monitoring. Like a Superman from afar, the `RMM`
    allows remote monitoring to keep your systems up and running from many miles away.
    You don’t even need to take an `Uber` (or put on pants) to get there!


    **BDR** – Backup and Disaster Recovery. Where have 30 years of all my pictures
    gone?! It can be terrifying to discover that all your precious or vital information
    has vanished. With a `BDR`, you’re able to recover all your lost records. That
    should help you sleep a little easier tonight!


    # CHAPTER 20


    # THANK YOU AND COME BACK SOON


    ![](images/image-20-1.jpg)


    Cyber security can be annoying, but it’s also vital. Once you get used to doing
    it, you won’t even have to think about it. I might be dating myself here, but
    do you remember when they first told us that we had to get used to seat belts?
    For my younger readers: yes, there was a time when seatbelts were just optional,
    if you can imagine that. We fought it hard, saying that it was just a pain, and
    a violation of our rights. Now, we put our seatbelts on without even thinking.
    It’s amazing what we can get used to if we just give it time.


    Don’t expect that cyber security will be easy in the beginning, but once you start
    to make it part of your company culture, it’ll become a habit, just like putting
    on your seatbelt.


    You’ve joined me on a wonderful journey of stories and insights into why you should
    and how you can implement cyber security. It’s up to you on how you move forward.
    You can be the person that believes that it will never happen to you and hope
    that will be true, or you can be the person that makes being secure a part of
    your life— again, not taking over your life, just becoming a part of it. Cyber
    attacks aren’t a matter of `IF`, but `WHEN`. Will you be ready?


    ‘RELAX’ is the answer to all the crises that you’ll face in life. Taking a moment
    during high stress situations can be the difference between a favorable outcome
    and a poor outcome. Acting in haste will almost certainly lead to undesirable
    outcomes, as you will `react` instead of act, and jump instead of thinking.


    Remember, both sides have a financial interest in keeping you scared— from the
    white hat hackers (the good guys) to the black hat hackers (the bad guys). If
    you’re reacting in a panic, you may wind up spending more money attempting to
    fix the problem, or worse, compounding your problem even further. Often, we don’t
    see the full breadth of the issue until we’ve taken a moment to step back and
    take a deep breath.


    Let me share one last story with you. This was not a cyber attack, but rather,
    a server failure, back with the pharmaceutical company I mentioned earlier in
    the book. I was still new, and they were having massive problems with their main
    server crashing almost every day. I decided to stop in on a Sunday to perform
    a quick reboot of the system. Looking at `Lucy`, my wife, I said, “This will only
    take five minutes. Do you mind if we stop in?” Being the wonderful woman that
    she is, she was onboard with it.


    Stopping in the parking lot, I asked her to come up with me and just wait in my
    office which was just across the hall from the server. I went in and started the
    reboot process, but things didn’t go the way I had expected. Instead of starting
    up again, the server showed an error message and would not start. I thought that
    I had fixed everything, but here I was again, and the server would not start.


    I fell to the floor and had an overwhelming sense of doom wash over me. How was
    I going to fix this? The entire day would be lost. I felt helpless and alone—but
    I wasn’t alone—like a guardian angel, `Lucy` had seen me slump to the ground and
    came rushing over.


    “Ken, what’s wrong?” she asked. I told her that the server had crashed again,
    and I had no idea how to fix it. I was shaking and on the verge of tears.


    “Just breathe with me, we’ll get through this.” Her words instantly calmed me.
    Because `Lucy` had helped me, I was able to get the server back and running. To
    wrap up my story, in 1994 I started a cyber security and compliance company with
    my wife and partner, `Lucy`. She’s the CEO of `On Technology Partners` and I’m
    the President. And yes, it really is great having your wife as your boss—at least
    that’s what she tells me!


    Working in the industry as long as I have, I’ve amassed a great deal of experience
    and examples of what to do—and just as importantly, what not to do. Many of our
    clients and customers also have compliance and security standards they must adhere
    to, such as `HIPAA`, `NIST`, or the `CMMC` standards from the Department of Defense.


    While these security standards might seem like a royal pain in the you-know-what,
    they help to protect everyone from the growing threats of cyber attacks– from
    “the average Joe” to vendors, businesses and institutions, all the way up to the
    highest levels of government. As a `CMMC-RP` (Cybersecurity Maturity Model Certification-Registered
    Practitioner)—it’s a mouthful, I know— I help new and existing contractors to
    meet the Department of Defense’s new cyber security requirements for `CMMC`. It’s
    all about being more cyber secure at every step of the way.


    So, no matter who you are or what industry you’re in, there’s something in this
    book for you—and unlike trying to teach an old dog new tricks, it’s never too
    late to learn. When I’m not mentoring others or helping companies with their cyber
    security needs, you can find me writing my sci-fi novel, hiking with `Lucy` to
    find local waterfalls, or helping children with mental health and emotional concerns.


    To learn more about cyber security or compliance standards, please visit `OnTechnologyPartners.com`.


    # ABOUT THE AUTHOR


    ![](images/kens-picture.jpg)


    Hi! I’m `Ken Fanger`, and the book that you’re holding has been a lifetime in
    the making. I’ve worked in technology and cyber security for the last 30 years
    with pharmaceutical companies, legal offices, nonprofits, and all levels of government.


    I started a cyber security and compliance company with my wife and partner, `Lucy`,
    in 1994. She’s the CEO of `On Technology Partners` and I’m the President. And
    yes, it really is great having your wife as your boss—at least that’s what she
    tells me!

