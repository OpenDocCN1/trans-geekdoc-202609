    Have you ever had a person try to scare you with all the ‘evils’ of cyber attacks?


    “*They’re going to take your data.*”


    “*They’re going to destroy your company.*”


    “*They’re going to ruin your life*.”


    Though it is true that cyber hackers can do terrible things, living in a state
    of continuous fear is not the way to solve it. The reason I’m writing `RELAX`
    is because when you’re in a panic, it causes you to `react` instead of `act`.


    Hackers use this fight-or-flight mindset to get you to either pay them money or
    have your important information exposed. In a way, cyber security companies do
    the same thing. It is well known in the industry that keeping a heightened sense
    of fear can get people to spend more money. For the sake of your pocketbook and
    mental health, you need to learn to relax and understand the items that you need
    to protect your company and your life.


    Cyber security is the antithesis of everything small business: It is confusing
    when we are looking for straight-forward. It should be unnecessary when we have
    so many other things to address. It is expensive when everything needs our money.
    It is just wrong when we need something to go right.


    As a small business owner, I understand why we feel this way. Cyber security is
    the result of having to spend money because bad people just cannot help being
    bad—and why should *we* have to pay for that?


    In this book, I hope to make it fun for you to gain the necessary knowledge and
    information on how to reach the not-at-all-mythical “cyber security nirvana.”
    By sharing stories, both good and bad, I hope to help your business be better
    prepared for what is happening in the world today, as well as for what is to come.


    I know that some people are scared to the point of inaction, while others think
    they are safe because it has never happened to them. I hope to get you to a point
    *between* those two extremes: a place that lets you be cyber safe, but also enjoy
    life again.


    So, come along and enjoy this fun and exciting ride through the world of cyber
    security—with just a hint of the crazy and a dash of the dangerous!


    I always like to start by sharing *my* story. I was a baby at the… ok, so maybe
    not *that* far back. Let’s try this again… I started out my professional career
    as a developer for one of the world’s largest gas and oil companies. In those
    days, I spent most of my time writing code that would transfer millions of dollars
    from one bank to another. At the time, I told myself that I was “busy changing
    the world,” but in all honesty, I was doing the most *boring* work.


    From that “exciting” place (insert sarcasm here), I moved on to an even more exciting
    job of writing programs that moved inventory from one place to another. It was
    at this job that I learned my first lesson in disaster recovery.


    I was still a youngster at 22 when I successfully (and unintentionally) destroyed
    the entire inventory records for one of the largest trucking and travel centers
    in the United States. Yes, you heard me right: *Their. Entire. Inventory. Records.*
    Even more crazy was the fact that I managed to make such a massive blunder in
    my first week of being hired!


    It was a heart-dropping experience that I was sure I would never recover from.
    Here I was, only seven days since they had allowed me to take this wonderful job,
    and I typed in a `delete` command that just whisked away $5 million dollars in
    inventory. To this day, I still remember the little green cursor staring at me,
    almost laughing. *Flash, flash, flash.* I sat there nearly paralyzed, hoping to
    see the file names return, but nothing happened.


    My head began racing. I was sure that after this colossal mistake, I wouldn’t
    be able to get a job anywhere! Who would hire a programmer that just destroyed
    his company’s entire inventory records? I was certain I was doomed to never work
    again… except maybe as a shoeshine boy. I wasn’t even good with a towel!


    With great remorse and a cocky tail set firmly between my legs, I got up and slowly
    marched to the network administrator’s office. Going down that hall was like a
    death march as I awaited the lashing I knew was coming.


    “*Pack up your things and get out of here! You’ll never work again!*” was the
    response that I expected on the other side of that door.


    Entering Ken’s office, (yes, his name was also Ken), I looked down at the ground
    as I started my disheartened confession.


    “*Ken, I think I’m fired,*” I shared.


    He looked up from his technical manual and said, “*What are you talking about,
    Ken?*”


    “*I destroyed the entire inventory system. I can go pack my things. I just wanted
    to make sure that you knew.*” I was certain that in a few moments, everyone would
    know that I destroyed the company.


    And then he said it: “*You’re fired, Ken*.” After a brief pause, he laughed. “*No,
    you’re not. You just made a mistake; we have backups for just these occasions.
    I’ll have it all back within the hour*.”


    My heart raced. I was saved! From that day forward, I had grown a great love of
    backups. I had almost destroyed an entire company, but because of these magical
    things called backups, I was saved!


    From that point on, I began my journey of protecting what’s important. I may not
    have always stayed true to that path but come with me as I share stories of many
    bad things—and many good things—that companies endured as they faced the growing
    world of cyber.


    ## CHAPTER 2

    # RISKY BUSINESS


    In respect to your business future, have you ever been asked the question, “*What
    if you get hit by a bus?*” It is such a graphic way of saying that we need to
    think about the risks that face us. We use such graphic imagery because it shocks
    us into taking things seriously. I always like to start out my new client discoveries
    with the question “*WHY*?” The answer to this question frames all following conversations
    about what is important and what a business will need to do. I’ve found that many
    companies haven’t had the “*why*” conversation. Many times, this happens because
    it’s difficult, or the “daily fires” that must be addressed overwhelm that vital
    process.

