- fmt: '

    When dealing with email hacks, it’s vital to always act quickly, don’t panic,
    and to minimize any damage that may be done. The sooner you act, the less time
    hackers have to hurt you, your clients, company, or friends.


    # CHAPTER 7


    ## BARBARIANS AT THE GATE


    ![](images/image-07-3.jpg)


    As someone with an interest in history, I’ve often thought about how the Romans
    must have felt with the Germanic tribes always charging southward to storm their
    cities. The only barrier between their normal lives and the marauding hordes was
    their city gate. Now, let’s think about the difference between the city gates
    of Rome and the city gates of Capena, 32 kilometers away. Rome was this massive
    city with many powerful and defended gates, while Capena had just a single gate
    to hold back the enemy. The gate in Capena is still standing today and is an incredible
    marvel to see.


    As small businesses, we face this same thing every day: the threat of hordes of
    cyber attackers coming southward to ravage our beautiful land—I mean, computers…
    and pillage our valuable information. We may even begin to feel like only the
    large companies and corporations are able to build the best defenses to protect
    themselves from attackers.


    Larger companies *are* able to spend mounds of money trying to defend themselves,
    implementing the best technologies and having entire departments focused on cyber
    security. However, it’s equally important to remember that even companies like
    Target, Facebook, Adobe, Capital One, AT&T, BP, and Apple have all experienced
    cyber security breaches and attacks. Financial institutions aren’t immune either.
    I’m not sure you could find a single bank or other financial institution anywhere
    that hasn’t faced at least one cyber-attack.


    Knowing this, you might be thinking, “If they can’t protect their companies from
    cyber-attacks, what am I supposed to do to protect mine??” I want you to take
    a moment and think about what a gate is used for. Gates allow the good or desirable
    people to come in and keeps the bad or undesirable people out. How does it keep
    the bad people out? Simple: it blocks their entrance. If you close off a gate,
    the only way through is to knock it down, which takes large amounts of effort
    and time. Gates also keep the good people out as well. How do you let the good
    people back in? You need to open the gates.


    Hackers know this. If you open the gates, it doesn’t take much effort to get through
    (compared to trying to barge through a closed gate). This is why hackers use items
    like emails and bad web links to gain access to your network. In order to access
    web pages and other cloud-based sites, you have to open the gates, so to speak.
    It’s only for a little while, but if you open the gates up to the wrong person,
    they can get in and start to attack from the inside.


    This is where your gate, what we call a `firewall` in nerd-speak, comes into play.
    Most modern firewalls are effective in keeping undesirable things out as long
    as no one opens up the gates. We’re constantly using the internet for everything
    and love going in and out of our little “village.” Each time we open a connection
    to the outside world, we create a road between our little village and the site
    we’re visiting. If that site is a good and secure site, we’re safe and happily
    getting what we need. If that site is bad or unsecure, then we’re opening the
    gates to potential hordes of armies to come rushing in.


    Now, what if you had a guard watching each person that came through your gate?
    We see this in movies all the time; a guard goes up to the wagon and asks for
    papers from each person to make sure that they should be entering the village,
    before the gates are opened. In our modern world, that guard is called an `IDS`
    (Intrusion Detection System) and `IPS` (Intrusion Protection System). These guards
    stand watch to help detect if there are “undesirables” trying to follow you back
    into your village. It’s important to have these guards on our gates, but it’s
    also important to remember that any time you open the gates, bad people will try
    to get in.


    We had a client that had a server within their “secure village” that was behind
    a good firewall. The problem was that they accessed this server from outside of
    the village, their office. Until they began working with us, they had always connected
    directly into their server from outside the village, meaning that the gate was
    always open. When we started to work with them, we told them that they would need
    to create a defended path to that server so that when they were outside the village,
    they would be protected.


    This defended pathway is called a `VPN` (Virtual Private Network) and it keeps
    the information that is being shared hidden, so that only you and the computer
    you are talking to can read it.


    The client had never experienced a breach before, so they were taking the approach
    that their village was so small that no one would ever try to attack them. They
    told us, “Why would anyone want to go after my little company?” It’s a statement
    we’ve heard far too often from many small businesses.


    It was now my job to show them that being small didn’t protect them from the barbarians
    at the gates. I extracted a log of all activity going through the gate, their
    firewall, and in just *one week* they had 356,002 attacks on their server! The
    hackers were using a brute force attack to try gaining access into the server.


    To really bring home the point, I showed them that 104,321 of the attacks had
    come from Russia, and 38,342 had come from China. What really opened their eyes
    was the fact that 25,342 of the attacks had come from within the United States.
    As you can see, the attacks had come from all sides, both domestically and abroad.
    This helped them to understand that they were *not* too small to be attacked,
    as well as reinforcing the importance of ensuring you are protected.


    So, what’s a business to do? As a small business, you need to create a layered
    defense. This layered defense starts with a firewall, the gate to your village.
    You’ll want to ensure you’re purchasing and using a firewall that supports `IDS
    IPS` service, generally as an annual subscription. It’s also important to make
    sure that the company deploying it understands how to configure and setup your
    firewall.


    You may also want to consider `geofencing`. This is a process where you block
    computers from a specific region or country from ever getting through your firewall.
    It is important to remember that this means the gate is always closed to that
    region or country, so don’t geofence a country you need to work with or conduct
    business. If you conduct business with China, for example, I would not suggest
    geofencing China. If you did, no traffic from China would ever get through, and
    that would be bad for your business.


    # CHAPTER 8


    ## BACKUP BUDDIES


    ![](images/image-08-2.jpg)


    Do you remember when you were a child on a field trip and your teacher would tell
    you to find a buddy to partner up with? Do you remember why you were asked to
    do that? It’s because this was a simple way to keep you safe and accounted for.
    By having two people partnered and looking out for each other, it was much safer
    than trying to keep track of children running around in every direction on their
    own. Backups are the same way; you always want to make sure that you have a “backup
    buddy.” This is a safe place that you have your data stored so you can recover
    it if you fall prey to a cyber-attack or your computer is stolen or lost.

