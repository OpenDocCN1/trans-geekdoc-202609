  md: "# # How do I add a watermark to an image?\n\nAnother common problem you may\
    \ have to solve is how to **watermark** an image, that is, how to place some identifying\
    \ image or text to show that you own the copyright. With the GD library and PHP,\
    \ it’s a snap!\n\nIf you have a logo or some other identifiable graphic with a\
    \ transparent back-\nground, you can easily place this over another image:\n\n\
    ```\n<?php\n// Load the original image\n$image = imagecreatefrompng('sample_images/mysql_logo.png');\n\
    \n// Get image width\n$iWidth = imagesx($image);\n\n// Allow transparent images...\n\
    imagealphablending($image, true);\n\n// Get the watermark image\n$watermark =\
    \ imagecreatefrompng(\n    'sample_images/sitepoint_watermark.png');\n\n// Get\
    \ the height and width\n$wmWidth = imagesx($watermark);\n$wmHeight = imagesy($watermark);\n\
    \n// Find the far right position\n$xPos = $iWidth - $wmWidth;\n\n// Copy the watermark\
    \ to the top right of original image\nimagecopy($image, $watermark, $xPos, 0,\
    \ 0, 0, $wmWidth,\n    $wmHeight);\n\n// Send the HTTP content header\nheader('Content-Type:\
    \ image/png');\n\n// Display the final image\nimagejpeg($image);\n?>\n```\n\n\
    The process is simply a matter of loading the original image and switching on\n\
    **alpha blending** (drawing transparency), so that images with transparent back-"
