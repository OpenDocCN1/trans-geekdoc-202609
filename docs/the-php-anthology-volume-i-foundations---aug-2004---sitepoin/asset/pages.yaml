  md: "The most obvious way to change the filename that appears in the URL is to rename\
    \ the file; that is, we could simply rename the script article.php to article.\
    \ Of course, without the .php extension, Apache has no way of knowing that the\
    \ file is a PHP script. By default, therefore, it will simply send the unparsed\
    \ PHP code straight to the browser—definitely *not* what we want!\n\nTo correct\
    \ this, we need to tell Apache specifically to treat the file as a PHP script.\
    \ This can be done easily with a .htaccess file, but you first need to make sure\
    \ Apache is configured to allow it. If you're working on your own server, you\
    \ simply need to ensure that AllowOverride is set to All in Apache's httpd.conf\
    \ file. If you're working with a Web host, you'll need to ask them to do the honours.\
    \ Once that's done, drop the following code into a file named .htaccess, and save\
    \ it in the same directory as the script you want to rename:\n\n```\nFile: forcetype/.htaccess\n\
    \n<Files article>\n ForceType application/x-httpd-php\n</Files>\n```\n\nThis directive\
    \ tells Apache to treat the file named article as a PHP script. Simple, right?\n\
    \nTo try this out yourself, check out the forcetype directory in the code archive\
    \ for this chapter. I've set it up with a script called article and a .htaccess\
    \ file that identifies it as a PHP script. Here's the code for article:\n\n```\n\
    File: forcetype/article\n\n<?php\n // Include the PathVars class\n require_once\
    \ 'Url/PathVars.php';\n\n // Create instance of PathVars\n $pathVars = new PathVars($_SERVER['SCRIPT_NAME']);\n\
    \n echo 'This is the article script<br />';\n\n if ($pathVars->fetchByIndex(0))\
    \ {\n  echo 'The article ID is ' . $pathVars->fetchByIndex(0);\n }\n ?>\n```\n\
    \nTry loading it with an article ID in the URL suffix (e.g. http://www.example.com/ppanth/WebPageElements/forcetype/article/123).\
