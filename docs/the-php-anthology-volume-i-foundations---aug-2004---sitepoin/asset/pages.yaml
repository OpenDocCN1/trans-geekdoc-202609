  img_proc: true
- pgno: 67
  md: "```\nfunction display($message) {\n    echo $message;\n}\n\n$myMessage = 'Hello\
    \ World!';\n\n// Call time pass by reference - bad practice!\ndisplay(&$message);\n\
    ```\n\nThat's known as a call-time pass-by-reference, which PHP controls with\
    \ the following setting in php.ini:\n\n```\nallow_call_time_pass_reference = Off\n\
    ```\n\nBy default, in recent PHP releases the above setting should be switched\
    \ to Off; turning it on is “frowned upon” by PHP’s makers. Switched off, PHP will\
    \ generate warning errors every time a function call specifies an argument should\
    \ be passed by reference. As such, it’s good practice to leave this setting off.\n\
    \nThe reason why call time pass by reference is a “bad thing” is that call time\
    \ passing by reference can make code extremely difficult to follow. I’ve occasionally\
    \ seen PHP XML parsers written using a call-time pass-by-reference—it’s nearly\
    \ impossible to gain any idea of what’s going on.\n\nThe “decision” as to whether\
    \ a variable is passed by reference or not is one that belongs to the function\
    \ being called, not the code that calls it. The above code written correctly would\
    \ look like this:\n\n```\n// Accept by reference - good practice\nfunction display(&$message)\n\
    {\n    echo $message;\n}\n\n$myMessage = 'Hello World!';\n\ndisplay($message);\n\
    ```\n\n# Performance Issues\n\nDepending on the scale of your application, there\
    \ are some performance issues you might need to consider when using references."
