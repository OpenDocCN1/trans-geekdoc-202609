- pgno: 273
  md: '# # Web Page Elements


    Despite the relative youth of the Internet as a means of information delivery,
    already discussions rage around the question of whether “design is dead.” Whatever
    your position in this debate, it becomes clear as we render Web content with PHP
    that the same “elements” keep reappearing.


    When you’re working on your first PHP Website, writing a script to generate an
    HTML table may not seem like a problem. Give it time! After you’ve put together
    a few sites and have had to go back to modify your past efforts, tables won’t
    seem so rosy. Eventually, the mere mention of maintenance may well have you gasping
    “not another table!” as you weep quietly into your keyboard.


    Fear not—help is at hand. Not all HTML is the same, yet there are obvious commonalities
    between HTML elements. These make the perfect target for PHP classes, which allow
    you to eliminate repetitive work and concentrate on the creative aspects that
    you enjoy.


    In this chapter, we’ll make extensive use of some of PEAR’s HTML packages. As
    a step up from hand coding your own HTML tables and forms, PEAR represents excellent
    value.


    Appendix D explains how to install PEAR on your server and add packages. You’ll
    need to refer to that information to use the PEAR classes required in this chapter.'
  merge: -1
  img_proc: true
