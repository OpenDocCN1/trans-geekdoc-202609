- pgno: 20
  md: '# # Your Feedback


    If you can’t find your answer through the forums, or if you wish to contact us
    for any other reason, the best place to write is <books@sitepoint.com>. We have
    a well-manned email support system set up to track your inquiries, and if our
    support staff is unable to answer your question, they send it straight to me.
    Suggestions for improvements as well as notices of any mistakes you may find are
    especially welcome.


    # # Acknowledgements


    First and foremost, I’d like to thank the SitePoint team for doing such a great
    job in making this book possible, for being understanding as deadlines inevitably
    slipped past, and for their personal touch, which makes it a pleasure to work
    with them.


    Particular thanks go to Kevin Yank, whose valuable technical insight and close
    cooperation throughout the process has tied up many loose ends and helped make
    The PHP Anthology both readable and accessible. Thanks also to Julian Szemere,
    whose frequent feedback helped shape the content of this anthology, and to Georgina
    Laidlaw, who managed to make some of my “late at night” moments more coherent.


    A special thanks to the many who contribute to SitePoint Forums[7]. There’s a
    long list of those who deserve praise for their selflessness in sharing their
    own practical experience with PHP. It’s been fascinating to watch the PHP forums
    grow over the last three years, from discussing the basics of PHP’s syntax, to,
    more recently, the finer points of enterprise application architecture. As a whole,
    I’m sure SitePoint’s PHP community has made a very significant contribution to
    making PHP a popular and successful technology.


    Finally, returning home, I’d like to thank Natalie, whose patience, love, and
    understanding throughout continue to amaze me. Halfway through writing this book,
    our first child, Masha, was born; writing a book at the same time was not always
    easy.


    [7] http://www.sitepointforums.com/'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# PHP Basics


    PHP is a programming language that’s designed specifically for building Websites,
    and is both blessed and cursed with being remarkably easy to learn and use. Getting
