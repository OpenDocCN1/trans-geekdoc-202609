    # # Updates and Errata


    No book is perfect, and we expect that watchful readers will be able to spot at
    least one or two mistakes before the end of this one. The Errata page on the book''s
    Website will always have the latest information about known typographical and
    code errors, and necessary updates for new releases of PHP and the various Web
    standards.


    # # The SitePoint Forums


    If you''d like to communicate with me or anyone else on the SitePoint publishing
    team about this book, you should join SitePoint''s online community[4]. As I mentioned
    above, the PHP forums[5], in particular, can offer an abundance of information
    above and beyond the solutions in this book.


    In fact, you should join that community even if you don''t want to talk to us,
    because there are a lot of fun and experienced Web designers and developers hanging
    out there. It''s a good way to learn new stuff, get questions answered in a hurry,
    and just have fun.


    # # The SitePoint Newsletters


    In addition to books like this one, SitePoint publishes free email newsletters
    including The SitePoint Tribune and The SitePoint Tech Times. In them, you''ll
    read about the latest news, product releases, trends, tips, and techniques for
    all aspects of Web development. If nothing else, you''ll get useful PHP articles
    and tips, but if you''re interested in learning other technologies, you''ll find
    them especially valuable. Go ahead and sign up to one or more SitePoint newsletters
    at http://www.sitepoint.com/newsletter/—I''ll wait!


    [4] http://www.sitepointforums.com/

    [5] http://www.sitepointforums.com/forumdisplay.php?forumid=34'
