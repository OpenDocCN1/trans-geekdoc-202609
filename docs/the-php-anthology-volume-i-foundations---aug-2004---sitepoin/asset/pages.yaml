    # The Binary File Modifier


    Unlike Linux, Windows differentiates between binary and ASCII files. An additional
    modifier, b can be used to identify binary files to PHP, so that they are dealt
    with correctly on Windows.


    ```

    ```

    // Open a binary file for reading

    $fp = fopen($filename, ''rb'');

    ```

    ```


    Even if the code you’re writing is currently used on a Unix-based system, it’s
    worth implementing the b modifier for binary files to ensure portability.


    The fread function could be used in older versions as a substitute for file_get_contents:


