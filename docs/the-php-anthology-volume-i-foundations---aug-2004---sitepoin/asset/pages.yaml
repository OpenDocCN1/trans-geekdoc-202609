  img_proc: true
- pgno: 211
  md: '# Figure 6.1. Calendar Classes as UML


    ![](img/5b6cdf7cf4cf53e30b19e047895dc464_211_0.png)


    The basic strategy these classes employ is as follows: given a Month, for example,
    you can build the Days that occur in it. Likewise, given a Day, you can build
    the Hours that occur within that day. Furthermore, any subclass of Calendar you
    might deal with is aware of what comes before and after it; so, if you’re dealing
    with a Day object representing January 1, 2003, it will “know” that a Day object
    representing December 31, 2003 comes before it. Date components themselves may
    be obtained in either numeric form, like 2003, 8, and 9 for the Year, Month, and
    Day components of the date August 9, 2003 respectively, or as Unix timestamps,
    depending on what you need to achieve.'
