  md: 'of the manual. To search the entire manual you need to search within “Online
    Documentation.”


    Another handy way to get around is to “short cut” to functions by passing the
    name of the topic you’re interested in via the URL. For example, try entering
    the following in your browser’s address field: http://www.php.net/strings. This
    will take you to http://www.php.net/manual/en/ref.strings.php, which is the main
    page for the Strings extension. Looking at this page, you’ll see a list of all
    the functions made available by the extension; the same list is available in the
    menu on the left hand side.


    Taking the strpos function as an example, enter the URL http://www.php.net/strpos
    (which takes you to http://www.php.net/manual/en/function.strpos.php). You will
    see the following information about the strpos function:


    ```

    strpos

    (PHP 3, PHP 4)

    strpos -- Find position of first occurrence of a string

    Description

    int strpos (string haystack, string needle [, int offset])

    Returns the numeric position of the first occurrence of needle in the haystack
    string. Unlike the strrpos(), this function can take a full string as the needle
    parameter and the entire string will be used.

    If needle is not found, returns FALSE.

    ```


    Line one contains the name of the function and line two lists the PHP versions
    in which the function is available. The third line tells you what the function
    actually does. In this case, it’s a fairly terse explanation, but strpos really
    isn’t a subject you can get excited about.


    Under the Description heading is perhaps the most important line of all—the function’s
    signature. This describes the arguments this function accepts and the value it
    returns in response. Reading from left to right, you have int, which tells you
    that the value returned by the function is an integer (in this case, the position
    of one piece of text within another). Next comes the name of the function itself,
    and then, in parentheses, the arguments this function takes, separated by commas.'
