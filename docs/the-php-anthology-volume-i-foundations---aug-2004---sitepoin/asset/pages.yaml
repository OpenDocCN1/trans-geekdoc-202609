    # # How do I make “search engine friendly” URLs in PHP?


    In a typical PHP application, you might have URLs that look like this:


    ```

    http://www.example.com/article.php?id=123&page=4

    ```


    The id GET variable in the URL identifies an article from your database, while
    the page variable tells the script which page of the article to display. There’s
    one small problem here, though; many search engines ignore GET variables, skipping
    everything that appears after the ? in the URL. Google and AllTheWeb are two exceptions
    to this rule, but even they are “cautious” about what they will and won’t index.


    To solve this problem, and simultaneously develop a URL structure that’s easier
    for humans to work with, it’s preferable to have URLs like this:


    ```

    http://www.example.com/article/123/4

    ```


    There are two steps to achieving this improved URL format:


    +   - [ ] convert the query string variable(s) (?id=123&page=4) to a path-style
    format (/123/4)


    +   - [ ] mask the name of the PHP script (/article.php) so that it looks like
    a standard directory (/article)


    In the sections that follow, I’ll introduce and demonstrate the techniques that
    will let you accomplish this on an Apache server.


    Further reading for building Search Engine Friendly URLs and Apache’s mod_rewrite
    is provided in the section called “Further Reading”.


    # ## Doing Without the Query String


    To Web developers like you and I, query strings like ?id=123&page=4 are perfectly
    easy to read. But typical Web users—and many search engines—are baffled by this
    mixture of symbols and information.'
  merge: -1
  img_proc: true
- pgno: 328
  md: 'One particularly nice feature of the popular Apache server is that, when presented
    with a URL like http://www.example.com/article.php/123/4, it''s smart enough to
    recognize that article.php is the filename and everything that follows it (/123/4),
    which we''ll call the **URL suffix**, can be ignored. The trick, of course, is
    to get PHP to see that URL suffix and read the values contained therein.


    Fortunately, while Apache is conveniently blind to the URL suffix, PHP is not.
    PHP provides a few variables which can be useful to gather this information, namely
    `$_SERVER[''PATH_INFO'']`, `$_SERVER[''PHP_SELF'']`, `$_SERVER[''REQUEST_URI'']`
    and `$_SERVER[''SCRIPT_NAME'']`. The following script demonstrates them in action:


    ```

    <?php

    // Examine some pre-defined variables

    echo ''$_SERVER[\''PATH_INFO\'']: '' . @$_SERVER[''PATH_INFO''] .

    ''<br />'';

    echo ''$_SERVER[\''PHP_SELF\'']: '' . @$_SERVER[''PHP_SELF''] .

    ''<br />'';

    echo ''$_SERVER[\''REQUEST_URI\'']: '' . @$_SERVER[''REQUEST_URI''] .

    ''<br />'';

    echo ''$_SERVER[\''SCRIPT_NAME\'']: '' . @$_SERVER[''SCRIPT_NAME''] .

    ''<br />'';

    ?>

    ```


