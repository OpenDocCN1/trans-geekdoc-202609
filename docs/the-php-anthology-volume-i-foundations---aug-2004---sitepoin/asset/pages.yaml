- pgno: 174
  md: "If you've read some of the earlier solutions in this book, you'll know I advocate\
    \ the use of classes in PHP. This solution gives me a chance to illustrate this\
    \ point to full effect, as we select an open source class that will make implementing\
    \ a BBCode system easy.\n\nThe class in question is called **BBCode**, developed\
    \ by Leif K-Brooks and available from PHP Classes[4]. This class meets nearly\
    \ all your BBCode needs, and is supplied with the code for this book. It is licensed\
    \ under the PHP license[5].\n\nThe most important method of this class is the\
    \ `add_tag` method. It takes as its argument an associative array, which can contain\
    \ up to six keys describing the tag in question. Let's look at some examples of\
    \ the `add_tag` method in action.\n\nThe following example registers the BBTag,\
    \ [b]:\n\n```\n$this->bbcode->add_tag(\n    array(\n        'Name'     => 'b',\n\
    \        'HtmlBegin' => '<span style=\"font-weight: bold;\">',\n        'HtmlEnd'\
    \   => '</span>'\n    )\n);\n```\n\nThe Name of the tag is b. The `HtmlBegin`\
    \ and `HtmlEnd` keys in the array define the HTML start and end tags that will\
    \ be used once the BBTags have been converted.\n\nThe following sets up another\
    \ BBTag, [link]:\n\n```\n$this->bbcode->add_tag(\n    array(\n        'Name' \
    \    => 'link',\n        'HasParam' => TRUE,\n        'HtmlBegin' => '<a href=\"\
    %%P%%\">',\n        'HtmlEnd'   => '</a>'\n    )\n);\n```\n\nThis code registers\
    \ another key, `HasParam`, which tells the class that this BBTag has a single\
    \ attribute that should be displayed in the converted text. Notice also the `HtmlBegin`\
    \ value. Here we use the string `%%P%%` to identify where the parameter should\
    \ be placed.\n\n[4] http://www.phpclasses.org/browse.html/package/951.html\n[5]\
    \ http://www.php.net/license/2_02.txt"
  merge: -1
  img_proc: true
- pgno: 175
  md: "In this next example, which creates a `size` tag, we see a new key. `ParamRegex`\
    \ defines a regular expression to which the parameter must conform; in this case,\
    \ it's a number that corresponds to a font size. Here's the code:\n\n```\n```php\n\
    $this->bbcode->add_tag(\n    array(\n        'Name'        => 'size',\n      \
    \  'HasParam'    => TRUE,\n        'HtmlBegin'   => '<span style=\"font-size:\
    \ %%P%%;pt;\">',\n        'HtmlEnd'     => '</span>',\n        'ParamRegex'  =>\
    \ '[0-9]+'\n    )\n);\n```\n```\n\nThis final example demonstrates all keys of\
    \ the array in action, and introduces the key `ParamRegexReplace`, which can be\
    \ used to modify a parameter. In this case, it allows a BBTag such as `[color=c5c6c7]`\
    \ to become `<span style=\"color: #c5c6c7;\">`:\n\n```\n```php\n$this->bbcode->add_tag(\n\
    \    array(\n        'Name'             => 'color',\n        'HasParam'      \
    \   => TRUE,\n        'ParamRegex'       => '[A-Za-z0-9#]+',\n        'HtmlBegin'\
    \        => '<span style=\"color: %s%;\">',\n        'HtmlEnd'          => '</span>',\n\
    \        'ParamRegexReplace'=> array('/^[A-Fa-f0-9]{6}$/'=>'#$0')\n    )\n);\n\
    ```\n```\n\nI've wrapped all this stuff neatly in a class called `SitepointBBCode`\
    \ (`TextManipulation/SitepointBBCode.php` in `SPLIB`), which creates the custom\
    \ tags in its constructor. This allows us to define BBTags simply by instantiating\
    \ the class. Let's look at this code in action:\n\n```\n```php\n<?php\n// Include\
    \ the BBCode class\nrequire_once 'ThirdParty/bbcode/bbcode.inc.php';\n\n// Include\
    \ the SitepointBBCode class which defines custom tags\nrequire_once 'TextManipulation/SitepointBBCode.php';\n\
    \n$text=<<<EOD\nHere is some <b>bold HTML which is unparsed</b>.\n```\n```"
  merge: -1
  img_proc: true
