    If we include this at the start of any file in which we accept data from a query
    string, a form post, or a cookie, we''ll remove any slashes added by magic quotes,
    should this functionality be switched on. This effectively gives us back what
    we started with.


    The subject of SQL injection attacks is discussed in detail in “How do I solve
    database errors caused by quotes/apostrophes?” in Chapter 3. If you’re not yet
    confident that you can protect yourself against SQL Injection attacks, use magic
    quotes. Once you’re happy you have a full grasp of all the issues, switch the
    magic quotes functionality off and save yourself many headaches. Note that magic
    quotes can only be switched on or off using the php.ini file or one of Apache’s
    .htaccess files. For more information, see Appendix A.


    # Call-Time Pass-By-Reference Off


    A reference is like a “short cut” to the value of a variable. References are often
    required when we use PHP functions and classes, a subject we’ll discuss further
    in Chapter 2. When you use a reference to a variable in calling a function or
    class method, it’s defined as a call-time pass-by-reference Consider this example:


    ```

    $result = myFunction(&$myVariable);

    ```


    Here the & operator tells PHP to use a reference to the variable $myVariable as
    the argument, rather than creating a copy of its value. This is now generally
    regarded as bad practice, as it can make the job of understanding someone else’s
    code extremely difficult.


    Switch this off in php.ini using the following command:


    ```

    allow_call_time_pass_reference = Off

    ```


    Alternatively, switch it off in a .htaccess file as follows:


    ```

    php_flag allow_call_time_pass_reference off

    ```


    # Write Reusable Code


    It’s easy to say, I know, but if you find yourself writing any more than one PHP
    script, you need to start thinking about ways to make your code reusable, before'
  merge: -1
