- pgno: 178
  md: "```\n * @access public\n */\nfunction WordFilter($badWords)\n{\n    $this->badWords\
    \ = array();\n    srand((float)microtime() * 1000000);\n    $censors = array('$',\
    \ '@', '#', '*', '£');\n    foreach ($badWords as $badWord) {\n        $badWord\
    \ = preg_quote($badWord);\n        $replaceStr = '';\n        $size = strlen($badWord);\n\
    \        for ($i = 0; $i < $size; $i++) {\n            shuffle($censors);\n  \
    \          $replaceStr .= $censors[0];\n        }\n        $this->badWords[$badWord]\
    \ = $replaceStr;\n    }\n}\n\n/**\n * Searches for bad words in text and censors\
    \ them\n * @param string text to filter\n * @return string the filtered text\n\
    \ * @access public\n */\nfunction filter($text)\n{\n    foreach ($this->badWords\
    \ as $badWord => $replaceStr) {\n        $text = preg_replace('/' . $badWord .\
    \ '/i', $replaceStr,\n            $text);\n    }\n    return $text;\n}\n}\n```\n\
    \nIf you're wondering about the constructor, the idea is to create a random string\
    \ with which to replace each word—just for fun. Note that I used preg_quote to\
    \ ensure that bad words aren't interpreted as regular expression syntax.\n\nNow,\
    \ I have a loathing of Teletubbies™. In fact, the mere mention of the word “Tubby”\
    \ sends me into a blind rage. Putting the class into action, I can eradicate from\
    \ my site the discussion of all things “Tubby”:"
