- pgno: 339
  md: '# # 10 Error Handling


    In Chapter 1, I introduced PHP’s in-built error handling mechanism, and we discussed
    that errors in general are usually broken into four basic types:


    +   - **Syntax Errors**: The script fails to obey the basic language rules of
    PHP and cannot be executed.


    +   - **Semantic Errors**: In executing the code, PHP encountered a situation
    that is illegal in terms of the “grammar” of PHP, such as passing a string to
    a function that expects an array.


    +   - **Environment Errors**: A problem has been encountered in the environment
    used by the PHP script during execution, such as the MySQL server being unavailable.


    +   - **Logic Errors**: The script executes correctly as far as the PHP engine
    is concerned, but does not do what the designer expected.


    In this chapter, we’ll look at the mechanisms PHP provides to extend the native
    error reporting mechanism and give you greater control over how errors are handled.
    The benefit of these mechanisms is generally realized in dealing with environment
    errors; the mechanisms provide your code the opportunity to'
  merge: -1
  img_proc: true
- pgno: 340
  md: 'gracefully exit execution, and allow you to hide errors from your site’s visitors
    while receiving private notifications of the errors.


    # Error Handling in PHP 5


    The soon-to-be-released PHP 5 will include a new error handling mechanism that
    should radically improve the way errors are handled in PHP 4. PHP 5 will provide
    a try-catch control structure that’s common to languages such as Java. It’s worth
    keeping in mind the fact that this change is on the horizon, so that you can easily
    modify your code when the time comes. Those modifications might simply involve
    a search and replace operation for all instances where you used trigger_error.
    Or perhaps they’ll be more elaborate, passing all calls to trigger_error through
    a single function you’ve defined yourself, which will allow you to switch to the
    new mechanism for generating errors simply by modifying that function.


    # How do I implement a custom error handler with PHP?


    By now you’re probably well acquainted with PHP’s native error reporting; possibly
    you’re acquainted with it more closely than you’d like, thanks to those inevitable
    syntax errors. PHP 4 provides for generating and handling errors additional mechanisms
    that you can control; these are described in the PHP Manual[1]. Being able to
    generate your own error messages allows you to add additional error reporting
    to your application, helping you track down problems and bugs after they occur.
    Meanwhile, the ability to create your own error handler allows you to log error
    messages and control the output delivered to your site’s visitors.


    # Error Levels


    Once a PHP script has been parsed to rule out syntax errors, PHP can generate
    three categories of error while running a script:


    +   Errors fatal errors that result in PHP halting further execution of the script


    +   Warnings general environment errors from which PHP can recover'
  merge: -1
  img_proc: true
- pgno: 341
  md: '**Notices** potential problems that PHP doesn’t really care about, but which
    may reflect bugs in your code


    An understanding of this categorization will prove useful when it comes to generating
    your own errors.


    The **error reporting level** determines which of the above categories of error
    will cause PHP to display an error message. The default error reporting level
    for a PHP installation is set by the `error_reporting` option in `php.ini`. For
    example, setting it to `E_ALL` tells PHP to report all error types:


    ```

    error_reporting = E_ALL

    ```


    Except for this special case, telling PHP to use a particular error level will
    see PHP report errors from that level only; the levels must be **combined** using
    **bitwise operators** if you want PHP to report multiple error types. For example,
    to report all error types *except* notices, the setting is often configured as
    follows:


    ```

    error_reporting = E_ALL & ~E_NOTICE

    ```


    You can determine the current error reporting level within a PHP script using
    the `error_reporting` function:


    ```

    <?php

    echo error_reporting();

    ?>

    ```


    This will display the current level as an integer (e.g. 2047 for `E_ALL`). You
    can also set the error level using the `error_reporting` function. For example:


    ```

    <?php

    error_reporting(E_ALL ^ E_NOTICE); // Report all except noticesecho error_reporting();
    // Displays 2039?>

    ```


    In the above example, we tell PHP to report all errors except notices, using the
    bitwise XOR operator, `^`, to subtract the `E_NOTICE` error level from the `E_ALL`
    error level.


    Some other illustrative examples follow:'
  merge: -1
  img_proc: true
- pgno: 342
  md: "```\nFile: 3.php\n```php\n<?php\nerror_reporting(E_ALL); // Report all errors\n\
    error_reporting(2047); // Report all errors\nerror_reporting(0); // Turn off error\
    \ reporting\n?>\n```\n```\n\nGenerally, you won't need to change the error levels\
    \ beyond the examples above.\n\n> **Which Error Reporting Level?**\n> \n> When\
    \ developing your code, always set the error level to its highest value, E_ALL\
    \ (or 2047). This will inform you of all errors. In particular, it'll display\
    \ notices that help you find uninitialized variables—the source of many a logic\
    \ error. This error level will also ensure maximum portability for others using\
    \ your code, who may prefer to run PHP at this level and not see any error messages\
    \ generated by your work.\n> \n> The best way to set this error level is in php.ini,\
    \ using the error_reporting setting. If this is not possible, the next best solution\
    \ is to use a .htaccess file with the following command:\n> \n> ```\n> php_value\
    \ error_reporting 2047\n> ```\n> \n> However you do it, it's important to apply\
    \ the setting globally to all your code.\n> \n> Remember, too, that the simple\
    \ fact that you've told PHP not to report certain errors doesn't mean they aren't\
    \ happening! Be careful when developing code and use full error reporting.\n\n\
    An important thing to note is that the error reporting level applies to the in-built\
    \ PHP error handler, not to error handlers you define yourself (which we'll be\
    \ looking at shortly). In other words, you can switch off error reporting as far\
    \ as the default PHP error reporting mechanism is concerned, while still catching\
    \ errors with an error handler you've defined yourself.\n\nOne more mechanism\
    \ that is available for controlling error behavior is the error suppression operator,\
    \ @, which can be used to suppress error messages generated by PHP functions and\
    \ expressions. For example:\n\n```\nFile: 4.php\n```php\n<?php\n// Use error reporting\
    \ operator\nif (!@mysql_connect('localhost', 'wronguser', 'wrongpassword')) {\n\
    \    echo 'Error connecting to MySQL Server: ' . mysql_error();\n}\n```\n```"
