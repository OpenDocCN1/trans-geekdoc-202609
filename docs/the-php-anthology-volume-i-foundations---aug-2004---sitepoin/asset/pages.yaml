- pgno: 156
  md: '```

    // Tell the browser it''s a file for downloading

    header(''content-disposition: attachment; filename='' . $fileName);

    header(''content-type: '' . $mimeType);

    header(''content-length: '' . filesize($fileName));


    // Display the file

    readfile($fileName);

    ?>

    ```


    The content-disposition header tells the browser to treat the file as a download
    (i.e. not to display it in the browser window), and gives it the name of the file.
    The content-type header also tells the browser what type of file you’re sending
    it. In most cases, this should be chose to match the type of file you are sending;
    however, Internet Explorer 5 and Opera browsers have a bad habit of displaying
    files of recognized types in the browser regardless of the content-disposition
    header, so we set the MIME type to the made-up value application/x-download for
    those browsers. Finally, the content-length header tells the browser the size
    of the file, so that it’s able to display a download progress bar.


    # Send HTTP Headers First


    Remember that headers must be delivered before any other content is sent to the
    browser.


    Be aware that PHP’s output control functions can be helpful here, as they let
    you send things to the browser in the right order: you can “hold” content already
    sent to output by PHP while letting the headers pass. See Volume II, Chapter 5
    for further details on output control.


    Now that delivery of the file is under your control, you can fit this functionality
    into your authentication system, for example, to control who can download the
    file.


    # File Distribution Strategy


    One of the Internet’s unsolvable problems is how best to distribute files from
    a Website. If you sell artwork in JPEG format, for example, how will you handle
    the process of accepting payments from customers and then letting them download
    only the image they paid for? How can you make sure they don’t redistribute the
    images they buy? How many times will customers be allowed to download an image
    they’ve paid for?'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'There’s no perfect solution. What if people decide to make copies of the images
    they bought from you and redistribute those copies without your knowing? It’s
    almost impossible to prevent them doing so unless you provide files that have
    been modified especially for the purpose of distribution (for example, image files
    protected by watermarks).


    Some of the different strategies for distribution are as follows:


    +   - [ ] Send the file via email. This is good for small files as it practically
    guarantees delivery, but many email systems place a limit on the size of files
    a user can receive (typically one or two megabytes).


    +   - [ ] Provide customers with a unique link that they can use to download the
    file for a limited time period, such as a week. If an attempted download fails
    (for example, the customers lose their Internet connection during the download)
    this strategy allows them to try again. A unique, random number can be generated
    and used in the URL for the download. This number corresponds with an entry in
    a database, which expires after a specified time period. This will at least limit
    the number of times the file is downloaded, and should help prevent redistribution
    of the file via the same URL. This approach is used by PayPal Antifraud[8], among
    others.


    +   - [ ] Provide customers with user name and password combinations that they
    can use to log into the site and download their own files. This approach has proven
    particularly effective for the PHP Architect[9] site, where it’s used to distribute
    the PHP Architect magazine in Adobe Acrobat format. The Acrobat files are generated
    “on the fly”, and secured with the same password the customer used to log in to
    the site. This obviously discourages customers from redistributing the magazine,
    as they’d have to give away their password to do so.


    As I said, there’s no perfect solution to this problem. However, greater protection
    can be achieved if some form of security is built into the file that’s being downloaded,
    such as a license key in the case of software.'
  merge: -1
  img_proc: true
