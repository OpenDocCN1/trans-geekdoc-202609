- pgno: 66
  md: "# # Good and Bad Practices\n\nWhen working with classes and objects, it’s a\
    \ good idea to use references whenever an object is involved. Occasionally, you\
    \ may have to do the same with an array, such as when you want to sort the array\
    \ in a different section of code. But, for the most part, normal variables will\
    \ not need this treatment, simply because, when your code reaches the level of\
    \ complexity where you’d need to do so, you will (I hope!) be storing variables\
    \ inside objects and passing the complete object by reference.\n\nLet’s look at\
    \ some other situations in which you might need to use references...\n\n```\n\
    ```php\n// Make sure $myObject is a reference to\n// the variable created by the\
    \ new keyword\n$myObject = &new MyClass();\n```\n```\n\nThis looks odd at first,\
    \ but remember, a variable created by the new keyword is being passed here—even\
    \ if you can’t see it. The reference operator saves PHP from having to create\
    \ a copy of the newly-created object to store in $myObject.\n\n```\n```php\nclass\
    \ Bar {\n}\n\nclass Foo {\n    // Return by reference\n    function &getBar()\n\
    \    {\n        return new Bar();\n    }\n}\n\n// Instantiate Foo\n$foo = &new\
    \ Foo();\n\n// Get an instance of Bar from Foo\n$bar = &$foo->getBar();\n```\n\
    ```\n\nIn the above example, you’ll notice the getBar method in the Foo class.\
    \ By preceding the function name with the reference operator, the value the function\
    \ returns is passed by reference. Note that we also had to use a reference operator\
    \ when assigning the return value of getBar to $bar. This technique is commonly\
    \ used when a class method will return objects.\n\nWhat’s bad practice is the\
    \ following:"
