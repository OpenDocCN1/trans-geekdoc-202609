- pgno: 41
  md: 'you suffer premature hair loss. Technically, this isn’t exactly an issue of
    portability as such, but if you end up working on other sites or applications,
    you’ll appreciate having ready code that you can simply plug into your new project.
    Also, if you’re writing code that other people will integrate with existing applications
    on their Websites, you need to package it in a form that doesn’t place requirements
    on the code they’re already using.


    For example, if your application has some kind of user authentication system,
    will it integrate with the one they’re already using—a system that already has
    a large database of users associated with it?


    The best approach is to write **object oriented** code (the focus of Chapter 2)
    with a mind to creating reusable “components.” Some people argue that writing
    object oriented code in PHP slows down the application’s performance and should
    therefore be avoided at all costs. What they forgot to mention is the drastic
    increase in **_your_** performance that object oriented programming delivers.
    After all, fast programmers cost more than fast microprocessors!


    Some things to consider when measuring the potential of your code for reuse are:


    +   - [ ] What happens when requirements change?

    +   - [ ] How easy is it to add new features to your code?

    +   - [ ] Are you still able to understand the code after a long period of time?

    +   - [ ] Can your code be integrated easily with other applications?

    +   - [ ] Will assumptions made in your code apply to your work on other sites?


    You’ll find throughout this book many hints and suggestions to encourage you to
    write reusable code, although an in-depth analysis of PHP applications design
    as a whole is beyond its scope. As you read this book, you should get a feeling
    for some of the critical factors as subjects for further investigation. You have
    one main responsibility to yourself as an experienced PHP developer: to keep expanding
    your general knowledge of the more esoteric aspects of software development, such
    as **design patterns** and **enterprise application architecture**, as a means
    to improve your development technique and, more importantly, save yourself time.
    The broader your knowledge, the lower the risk of failure when you land that big
    project.'
  merge: -1
