  md: "# # How do I display data in a table?\n\nHTML tables are the natural result\
    \ of much of PHP’s interaction with data stored in MySQL databases. Having a tool\
    \ in your kit for quick table generation is an essential time saver as you build\
    \ PHP applications.\n\nThe simplest approach to generating a table using the MySQL\
    \ class I built in Chapter 3 might look like this:\n\n```\n$db = &new MySQL($host,\
    \ $dbUser, $dbPass, $dbName);\n\n$sql = \"SELECT * FROM user ORDER BY lastName,\
    \ firstName\";\n\n$result = $db->query($sql);\n\necho \"<table align=\\\"center\\\
    \">\\n\";\necho \"<tr>\\n<th>Login</th><th>Name</th><th>Email</th>\\n</tr>\";\n\
    \nwhile ($row = $result->fetch()) {\n    echo \"<tr>\n    <td>\" . $row['login']\
    \ . \"</td>\n    <td>\" . $row['firstname'] . \" \". $row['lastname'] . \"</td>\n\
    \    <td>\" . $row['email'] . \"</td>\n    </tr>\\n\";\n}\necho \"</table>\";\n\
    ```\n\nWhile it’s fine for something simple, this method can become a burden as\
    \ your tables grow more complex.\n\n# ## PEAR Shaped Tables\n\nThe task of building\
    \ more complex tables is made easier by PEAR::HTML_Table[1]. Developed by Bertrand\
    \ Mansion and Adam Daniel, HTML_Table provides a handy API for table construction\
    \ that doesn’t require you to type a tag of HTML. For complex tables, this can\
    \ save a lot of time, and reduce your chance of making mistakes with HTML itself.\
    \ The version used here was 1.5.\n\n[1] http://pear.php.net/HTML_Table"
  merge: -1
  img_proc: true
