  md: "Here’s how we could use three of the methods available in the main Validate\
    \ class, namely string, email and url, to validate the data from a form:\n\n```\n\
    <?php\n// Include PEAR::Validate\nrequire_once 'Validate.php';\n\n// Include file\
    \ to strip quotes if needed\nrequire_once 'MagicQuotes/strip_quotes.php';\n\n\
    // Initialize errors array\n$errors = array('name' => '', 'email' => '', 'url'\
    \ => '');\n\n// If the form is submitted...\nif (isset($_POST['submit'])) {\n\t\
    // Define the options for formatting the name field\n\t$name_options = array(\n\
    \t\t'format' => VALIDATE_ALPHA . VALIDATE_SPACE,\n\t\t'min_length' => 5\n\t);\n\
    \n\t// Validate name\n\tif (!Validate::string($_POST['name'], $name_options))\
    \ {\n\t\t$errors['name'] = ' class=\"error\"';\n\t}\n\n\t// Validate email\n\t\
    if (!Validate::email($_POST['email'])) {\n\t\t$errors['email'] = ' class=\"error\"\
    ';\n\t}\n\n\t// Validate url\n\tif (!Validate::url($_POST['url'])) {\n\t\t$errors['url']\
    \ = ' class=\"error\"';\n\t}\n}\n?>\n```\n\nFirst, we include PEAR::Validate and\
    \ my own code that handles magic quotes. Then, having tested to see that the form\
    \ was submitted, we call the validate methods statically to check the fields.\
    \ The first check is to see if the name field is a string containing only letters\
    \ from the alphabet or space characters, and is at least five characters long\
    \ (this was defined by the $name_options array)."
