- pgno: 289
  md: '# # Guidelines for Dealing with Forms


    +   - [ ] Use the POST method when declaring your form in HTML. This prevents
    form values from appearing in the URL, and allows a larger amount of data to be
    submitted through the form.


    +   - [ ] Use PHP''s htmlspecialchars function when populating form fields with
    PHP values, to avoid malformed HTML, as discussed in Chapter 5.


    +   - [ ] Don''t rely exclusively on JavaScript validation. It can improve the
    user experience, but used alone JavaScript validation can easily be bypassed by
    the user.


    +   - [ ] If you use normal HTTP, form data will be sent in “clear text” over
    the Internet from the browser to the server. This means it can be intercepted
    by someone using a packet sniffer. When you send confidential information such
    as financial details, use an encryption technology such as SSL.


    # ## Forms in Action with QuickForm


    I''ll assume for the moment that you''re happy to use forms at their most basic.
    Here, we''ll concentrate on another PEAR package—PEAR::HTML_QuickForm[4]. Developed
    by Bertrand Mansion and Adam Daniel, QuickForm makes it easy to render simple
    HTML forms from PHP... but that''s not all! QuickForm provides further functionality
    to help with a range of other problems, such as the generation of calendar form
    elements, and validation with both PHP and JavaScript. It automatically takes
    care of issues related to magic quotes, too, so if you''re using QuickForm, you
    don''t need to worry whether magic quotes is on or off. The version used in these
