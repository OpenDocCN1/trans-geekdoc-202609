    # How do I build a result pager?


    A result pager is a navigational element that allows your site’s visitors to browse
    data pulled from your database in “pages”. Its purpose is to avoid the use of
    full table scans (SELECT * FROM table), which can really slow down your server
    if you’re dealing with a lot of data, and to provide results in user-friendly
    “chunks” rather than as a single, giant list. If you’ve ever used a search engine
    like Google™ (and it’s probably safe to assume you have), you’ve used a result
    pager to browse through search results.


    MySQL makes it extremely easy to implement a result pager; we simply need to use
    the LIMIT clause in our queries. Here’s a simple example:


    ```

    SELECT * FROM user LIMIT 5, 10

    ```'
