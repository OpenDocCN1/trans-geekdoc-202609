    image from the source file, so we need the thumbnail to be true color as well.


    The `imagecopyresampled` function is the point at which the thumbnail is actually
    created from the original. It places a resized version of the image into the blank
    thumbnail image, **resampling** along the way to ensure that the image is resized
    smoothly. An older version of this function, `imagecopyresized`, changes the size
    of the image more crudely. Refer to the PHP manual for a complete description
    of this function’s arguments if you need to.


