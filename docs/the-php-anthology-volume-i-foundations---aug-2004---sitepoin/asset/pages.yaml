- pgno: 280
  md: "The above query will start at row number 5 and select a total of 10 rows. All\
    \ you need now is some PHP that constructs this clause dynamically, passing the\
    \ row number at which the query will start and the number of rows it will select.\n\
    \n![](img/5b6cdf7cf4cf53e30b19e047895dc464_280_0.png)\n\n# When to Implement a\
    \ Result Pager\n\nAs a general rule, if you have full table scan queries such\
    \ as SELECT * FROM user, you should consider implementing a result pager.\n\n\
    While you're developing your application you may not notice a problem, but once\
    \ you have a table containing thousands of records and your site's achieving high\
    \ levels of traffic, MySQL will be hard-pressed to deal with all those queries.\
    \ Also, depending on how you write your PHP, your scripts may take an increasingly\
    \ long time to execute as the number of rows in the table grows.\n\nThe trick\
    \ is to come up with the PHP code that generates those two magic numbers in the\
    \ LIMIT clause. In general, the first step is to get MySQL to tell you how many\
    \ rows there are in the “unpaged” result set. This will typically require a COUNT\
    \ query:\n\n```\nSELECT COUNT(*) AS num_rows FROM user\n```\n\nTo ascertain the\
    \ total number of pages, we simply divide the number of rows in the result set\
    \ by the number of rows to be displayed per page. We can then identify which row\
    \ will begin each page by multiplying the page number by the number of rows that\
    \ appear per page.\n\nThis is easier to see with some code. First, let's put together\
    \ a simple paging class that encapsulates these calculations:\n\n```\nFile: Database/SimplePager.php\
    \ (in SPLIB) (excerpt)\n\n/**\n * SimplePager class\n * Used to help calculate\
    \ the number of pages in a database result\n * set\n * @access public\n * @package\
    \ SPLIB\n*/\nclass SimplePager {\n/**\n * Total number of pages\n * @access private\n\
    \ * @var int\n*/\n```"
