    # Persistence Layers: Database Interaction Without SQL


    Persistence layers are becoming popular, and are well supported in PHP today.
    A persistence layer is a collection of classes that represents the tables in your
    database, providing you with an API through which all data exchanged between the
    database and the PHP application passes. This generally takes away the need for
    you to write SQL statements by hand, as the queries are generated and executed
    automatically by the PHP classes that represent the data.


    Because SQL is a fairly well defined standard, it also becomes possible to have
    a persistence layer generated automatically. A program can examine your database
    schema and produce the classes that will automatically read and update it. This
    can be a very significant time saver; simply design your database, run the code
    generation tool, and the rest is “just” a matter of formatting a little (X)HTML.


    A prime example of a persistence layer is PEAR::DB_DataObject[1], which builds
    on top of the PEAR::DB database abstraction library, and automatically generates
    a layer of classes with which to access your tables.


    Persistence layers in general and PEAR::DB_DataObject in particular are discussed
    in “Do I really need to write SQL?”.


