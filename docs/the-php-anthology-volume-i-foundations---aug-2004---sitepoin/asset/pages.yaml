- pgno: 378
  md: 'changing the installation prefix pops up a Windows “Browse” dialog box, through
    which you can specify the required directory.


    With the installation options set to your requirements, the go-pear.php script
    will connect to the PEAR Website, and download all the packages required to set
    up the package manager (it also asks if you require additional packages, which
    are well worth having). Packages are installed in a subdirectory pear of the directory
    you specified as the installation prefix (so, in the above examples you’d end
    up with c:\pear\pear or /home/username/pear/pear).


    Finally, if you let it, the go-pear.php installer will attempt to modify your
    include_path in php.ini. To do this manually, assuming you used the directories
    above, you’d specify the following:


    ```

    include_path = " .:/home/username/pear/pear"

    ```


    For Windows users, the path is as follows:


    ```

    include_path = ". ; c:\\pear\\pear"

    ```


    Finally, to use the PEAR package manager from the command line, you need to set
    up some environment variables. For Windows users these can be automatically added
    to your Windows registry by right clicking on the file PEAR_ENV.reg and choosing
    Run. They may also be manually configured as environment variables via the Windows
    Control Panel. Users with Unix-based systems can configure them to be set up every
    time you log in, by editing the file .profile in your home directory (/home/username):


    ```

    # Envinment variables

    export PHP_PEAR_SYSCONF_DIR=/home/username/pear

    export PHP_PEAR_INSTALL_DIR=/home/username/pear/pear

    export PHP_PEAR_DOC_DIR=/home/username/pear/pear/docs

    export PHP_PEAR_BIN_DIR=/home/username/pear

    export PHP_PEAR_DATA_DIR=/home/username/pear/pear/data

    export PHP_PEAR_TEST_DIR=/home/username/pear/pear/tests

    export PHP_PEAR_PHP_BIN=/usr/local/bin/php

    ```


    Finally, you need to add the PEAR command line script to your system path, which,
    on Windows, can be achieved through the System Control Panel application (on the
    Advanced tab, click Environment Variables), by appending ;c:\pear to the PATH
    variable.


    On Unix-based systems, add the following to your .profile script:


    ```

    export PATH=$PATH;/home/username/pear

    ```'
  merge: -1
  img_proc: true
- pgno: 379
  md: 'Once you''ve done all that, you''re ready to move on and use the package manager
    in one of its many incarnations.


    # # The PEAR Package Manager


    Assuming you set PEAR up correctly, you can now use the command line interface
    to the PEAR package manager to install packages. For example, from the command
    line, type:


    ```

    pear install HTML_Common

    ```


    That will install the package HTML_Common from the PEAR Website. The package names
    for the command line are the same as those on the Website.


    The PEAR Package Manager uses XML_RPC to communicate with the PEAR Website. If
    you''re behind a proxy server or firewall, you will need to tell PEAR the domain
    name of the proxy server with:


    ```

    pear config-set http_proxy proxy.your-isp.com

    ```


    To unset the variable at some later stage, simply use:


    ```

    pear config-set http_proxy " "

    ```


    Now to add QuickForm to the installed PEAR packages, you simply need to type:


    ```

    pear install HTML_QuickForm

    ```


    Should another release of QuickForm be made after you''ve installed it, you can
    upgrade the version with:


    ```

    pear upgrade HTML_QuickForm

    ```


    If, for some reason, you later decide you don''t need QuickForm any more, you
    can remove it using:


    ```

    pear uninstall HTML_QuickForm

    ```


    For a list of all PEAR commands, simply type pear.


    Now, if you don''t like command lines, there''s also an (experimental) Web-based
    front end to PEAR (as well as a PHP-GTK front end, which is beyond the scope of
    this discussion). To use it, you first need to install it from the command line'
  merge: -1
  img_proc: true
- pgno: 380
  md: '(note that if you executed go-pear.php through your Web server, the Web-based
    front end is also installed for you). Type the following commands:


    ```

    pear install Net_UserAgent_Detect

    pear install Pager

    pear install HTML_Template_IT

    pear install PEAR_Frontend_Web

    ```


    Note the first three packages are required by PEAR_Frontend_Web. With that done,
    you can launch the front end from your Web server using the following simple script:


    ```

    <?php

    // Optional if include path not set

    # ini_set(''include_path'', ''c:\htdocs\PEAR'');


    require_once ''PEAR.php'';


    // For Windows users

    # $pear_user_config = ''c:\windows\pear.ini'';

    // For Unix users

    $pear_user_config = ''/home/username/pear/PEAR/PEAR/pear.conf'';


    $useDHTML = TRUE; // Switch off for older browsers


    require_once ''PEAR/WebInstaller.php'';

    ?>

    ```


    # Installing Packages Manually


    It''s possible to install packages manually (although this involves more work),
    but it''s important to watch the include paths carefully when doing so. First
    of all, create a directory that will be the base of all the PEAR classes you install.
    This directory *must* be in your include path. Next, install the main PEAR package[11]—download
    the latest *stable* version and extract it directly to the directory you''ve created,
    so that PEAR.php is in the root of this directory.


    Installing further packages can be completed in more or less the same fashion,
    but you need to be careful which directory you extract to. For example, looking
    at PEAR::DB, the main DB.php file goes alongside the PEAR.php file in the root
    of the PEAR class directory, while further PEAR::DB-related files go in the sub-directory
    DB. The best way to check is to look at the package.xml file that comes


    +   [11] http://pear.php.net/package/PEAR'
