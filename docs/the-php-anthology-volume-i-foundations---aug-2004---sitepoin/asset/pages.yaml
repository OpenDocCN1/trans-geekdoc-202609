- pgno: 345
  md: '# # Strategy for Generating Errors


    How you use `trigger_error` in your code is completely up to you, but to get the
    most out of it, it’s a good idea to have in mind some kind of strategy that will
    allow you to handle correctly the errors your code generates. When selecting the
    type of error to trigger, think about what the error means from the perspective
    of a _user_ of your application, rather than what it means to the PHP engine.
    The following is intended to represent best practice for using the different error
    levels:


    **E_USER_ERROR**


    This is the most critical level of error you have available to you, being a fatal
    error that stops PHP executing the rest of your code. From the perspective of
    someone using your application, a fatal error is one that caused the application
    to fail to perform its duty on a fundamental level. For instance, the script is
    unable to connect to the MySQL server that stores the content your application
    wants to render.


    **E_USER_WARNING**


    At this level, your application can continue execution, though something went
    wrong with the operation the user requested. A good approach to using this error
    level is to apply it when users do something that’s beyond the limits of your
    application. For example, they might have requested a URL at which no content
    exists, or passed data of the wrong type to a script (for instance, they passed
    a string via a `$_GET` variable, which is expected to contain integer values).
    Obviously, this should be applied within reason; in general, triggered errors
    cannot be handled as effectively as returned values in your code (see the section
    called “Triggered Errors vs. Conditional Execution” below).


    **E_USER_NOTICE**


    This level is suitable for providing information to users and administrators of
    your site. If someone, while attempting to log into a secure area of your site,
    gets the user name/password combination wrong three times in a row, it may be
    a good time to trigger an `E_USER_NOTICE` error. This error would result in an
    email being sent to your site’s administrators warning them of a potential attempt
    at cracking the user authentication system. You might also use'
