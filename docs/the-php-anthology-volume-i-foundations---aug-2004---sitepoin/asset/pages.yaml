- pgno: 27
  md: '# ## Further Help


    Outside the manual, there are literally thousands of online resources from which
    you can get further help. I would dare to say that 99% of all the common problems
    you''ll encounter with PHP have already been answered somewhere, and are available
    online. That means the most obvious (but sometimes forgotten) place to begin is
    Google, where a quick search for “PHP strtpos problem” will give you an idea of
    what I mean.


    There are also some excellent sites where you can get answers directly from other
    PHP developers (for free, of course—it’s part of the PHP ethic). Perhaps the three
    biggest in the English language are:


    +   - SitePoint Forums: http://www.sitepointforums.com/

    +   - Dev Shed Forums: http://forums.devshed.com/

    +   - phpBuilder: http://www.phpbuilder.com/board/


    Each of these uses vBulletin[16] to host an online discussion and, as such, have
    very friendly and easy-to-use interfaces. All have very active memberships and
    you should find most questions answered within twenty-four hours.


    Note that when you ask for help on forums, the principle of “helping others to
    help yourself” is important. Don’t post a message that says, “This script has
    a problem” and paste in your entire PHP script. Narrow the problem down–identify
    the area where you’re having problems and post this code snippet along with other
    relevant information, such as error messages, the purpose of the code, your operating
    system, and so on. People offering to help generally don’t want to spend more
    than a few minutes on your problem (they’re doing it for free, after all), so
    saving them time will improve your chance of getting a helpful answer.


    Less convenient, but perhaps the most effective last resorts are the PHP mailing
    lists[17], where beginners are encouraged to use the PHP General list. The lists
    are available for limited browsing[18], though it’s possible to search some of
    them using the search field from the PHP Website[19] and selecting the list of
    your choice.


    [16] http://www.vbulletin.com/

    [17] http://www.php.net/mailing-lists.php

    [18] http://news.php.net/

