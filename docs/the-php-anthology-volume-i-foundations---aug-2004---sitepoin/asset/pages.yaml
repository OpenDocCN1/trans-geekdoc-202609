- pgno: 166
  md: 'question are the single quote (''), the double quote ("), the ampersand (&)
    and the greater than and less than symbols (< and >).


    If we pass Joe''s nickname through htmlspecialchars before we output it, the input
    field becomes:


    ```

    <input type="text" name="nickname"

    value="Joe &quot;The Hacker&quot; Bloggs" />

    ```


    Notice the &quot; that now replaces the double quotes as the value of the nickname
    field. The browser will display these as the intended double quotes.


    Saved again!


    # Line Breaks in HTML


    As you probably know, if you have a piece of HTML like this:


    ```

    <p>Dear Sir or Madam,

    This is my nicely formatted letter. I hope that

    it really impresses you.

    Look! I''ve started a new paragraph.

    Yours faithfully,

    Mike Format</p>

    ```


    it won''t look quite as good when it''s displayed in a Web browser. In this case,
    it would look something like this:


    ```

    Dear Sir or Madam, This is my nicely formatted letter. I hope that

    it really impresses you. Look! I''ve started a new paragraph. Yours

    faithfully, Mike Format

    ```


    This can be a headache on PHP-based sites through which you want to allow users
    to perform basic text formatting without having to know too much HTML.


    Again, help is at hand, this time in the form of PHP''s nl2br function. Here''s
    the HTML produced when we run Mike''s letter through nl2br:


    ```

