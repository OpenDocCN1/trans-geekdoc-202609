    \ To make matters a little more interesting, MySQL also has its own port number,\
    \ which by default is 3306. PHP assumes that 3306 will be the port number but\
    \ should you need to use a different one, all you need is $host = 'anothercomputer.com:4321';.\n\
    \nThe other conceptual hurdle lies in understanding that a single MySQL server\
    \ may provide access to many databases, which is why you need to select your database\
    \ in PHP after connecting to the server.\n\nReturning to the code above, there\
