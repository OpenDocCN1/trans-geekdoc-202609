    In the above example, we reuse the same instance of PHPMailer, for which we''ve
    set up the message and its sender. For each element of the $recipients array (which
    is intended to simulate the result of a database query) we can add an address
    to the PHPMailer instance, send the message, then remove it again using the clearAddresses
    method. Note that PHPMailer also has a clearAllRecipients method that removes
    any CC or BCC entries, and a clearAttachments method to remove any attached files.
    For replacing the body or subject of the message, you need only assign a new value
    to it in the same way as before:


    ```

    $mail->Body = $body;

    ```


    For very large distribution lists, a simple foreach loop won''t quite cut it—you''ll
    risk flooding your mail server with messages! Instead, you''ll need to devise
    a means of sending the messages at a rate that your server can handle. The simplest
    way to achieve this is to use the PHP sleep function to pause your script every
    ten messages or so. You''ll also need to use the set_time_limit function to allow
    your script to run for more than the default thirty second limit.


    # How do I handle incoming mail with PHP?


    You''ve already seen that sending mail with PHP is no problem. But what about
    dealing with incoming mail using PHP? If your site is hosted on a Linux system,
    you''ll be happy to hear that, with a little tuning, you should be able to get
    PHP to examine incoming email. What''s more, PHP has a number of mechanisms for
    reading email and extracting the information you need, such as the IMAP extension[3],
    the Mailparse extension[4], and a more limited PEAR package written in PHP, PEAR::Mail_Mime[5].
    As our focus in this chapter is on built-in PHP functionality, not esoteric extensions,
    we''ll look briefly at what PEAR::Mail_Mime has to offer here.


