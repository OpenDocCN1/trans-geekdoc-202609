    require ''include_wrong.php'';

    // This will never be executed as we have a fatal error

    echo ''<br />Including again: '';

    include ''include_me.php'';

    ?>

    ```


    Here''s the output this generates (note that I''ve simplified the error messages
    at the end):


    ```

    Requiring Once: I''ve been included!

    Including: I''ve been included!

    Including Once:

    Requiring: I''ve been included!

    Requiring Once again:

    Include the wrong file:

    Warning: Failed opening ''include_wrong.php'' for inclusion

    Requiring the wrong file:Fatal error: Failed opening required

    ''include_wrong.php''

    ```


    Notice here that the first use of include_once does nothing (the file has already
    been included), as does the later use of require_once. Later on, when I try to
    include the wrong file (in this case, a file that doesn’t exist), I get a warning
    message. However, execution continues to the next line where I try to require
    a file that doesn’t exist. This time, PHP produces a fatal error and execution
    of the script halts, meaning the final attempt to include the file will never
    happen.


    Be aware that the files you include needn’t contain only PHP. The included file
    could simply contain HTML without any PHP.


    # # Which Command to Use?


    > As a general practice, unless you have a special circumstance where some other
    behavior is needed, always use the require_once command to include one file in
    another. This is particularly important when you’re placing PHP classes in separate
    files, and one class may depend on another. For the full story on classes, see
    Chapter 2.'
