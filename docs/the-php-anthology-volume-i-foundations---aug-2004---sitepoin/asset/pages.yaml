  md: "```\n```php\n<?php\n$text = 'This is <b>bold</b> text';\n\n// Strip that tag\n\
    echo strip_tags($text);\n?>\n```\n```\n\nThe output is:\n\n```\nThis is bold text\n\
    ```\n\nYou can also supply strip_tags a list of allowed tags that you want it\
    \ to ignore. For example,\n\n```\n```php\n<?php\n$text = 'This is <b>bold</b>\
    \ and this is <i>italic</i>.\n    What about this <a href=\"http://www.php.net/\"\
    >link</a>?';\n\n// Strip those tags\necho strip_tags($text, '<b><i>');\n?>\n```\n\
    ```\n\nHere's the HTML it returns:\n\n```\nThis is <b>bold</b> and this is <i>italic</i>.\n\
    What about this link?\n```\n\nAs you can see, strip_tags leaves the text between\
    \ opening and closing tags. If it finds a < character but fails to find a matching\
    \ > character, it will remove all the text to the end of the string.\n\nRemoving\
    \ HTML with strip_tags does have one drawback, however, in the handling of attributes.\
    \ If you allow some tags, your site's members may be able to use attributes, such\
    \ as style, within those tags, which can result in some very strange layouts.\
    \ Worse still, JavaScript contained in a link can result in an cross-site scripting\
    \ (XSS) security exploit (see Appendix C).\n\nIn the next solution, I'll show\
    \ you how to implement a “custom code” system that provides a more reliable mechanism\
    \ to allow certain tags. Later on, we’ll look at how you could go about examining\
    \ the contents of the attributes themselves in order to check that they’re valid."
