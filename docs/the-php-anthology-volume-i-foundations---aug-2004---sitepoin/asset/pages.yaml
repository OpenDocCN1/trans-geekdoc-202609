- pgno: 59
  md: 'The member variables appear in the middle area, while methods appear in the
    bottom box. Also, the plus and minus signs are there to indicate to other developers
    which elements of the class are public (+) and which are private (-). Unlike languages
    such as Java, PHP does not enforce privacy on objects;³ in the examples above,
    we could have accessed the $page member variable directly in our main script.
    Because we want the object to handle its own data without outside interference,
    we indicate in the UML diagram that only those members that have a + against them
    are available for public use. Those with a - are purely for internal use within
    the class.


    That covers the basics of the class syntax in PHP, and should give you an idea
    of how classes compare with procedural code. With the syntax you’ve learnt, you
    should be able to write standalone classes containing the variables and functions
    you use frequently—a task that can really help tidy up your code and make it easier
    to maintain. This is a great start, but the *real* power of object oriented programming
    comes from using multiple objects and classes together. The rest of this chapter
    will look at some of the more advanced facets of the PHP object model, including
    references, inheritance, aggregation, and composition.


    # How do references work in PHP?


    Most discussions of references in PHP begin with an opener like “references are
    confusing,” which may add to the myth that surrounds them. In fact, references
    are a very simple concept to grasp, yet they’re a concept that self-taught PHP
    developers only really need to consider once they begin writing object oriented
    applications. Until then, you’re probably oblivious to the way PHP handles variables
    behind the scenes. Much of the confusion that exists around references has more
    to do with developers who are experienced with other languages like C++ or Java
    trying to work with PHP: Java, in particular, handles object references in almost
    the *opposite* way to the approach PHP takes in version 4.


    # References vs. Pointers


    ![](img/5b6cdf7cf4cf53e30b19e047895dc464_59_0.png)


    Developers who are familiar with compiled languages such as C++ or Java should
    note that references in PHP are not analogous to pointers in other languages.


    A *pointer* contains an address in memory that *points to* a variable, and must
    be *dereferenced* in order to retrieve the variable’s contents.


    ³Enforced privacy constraints on class members will be added in PHP 5.0.'
