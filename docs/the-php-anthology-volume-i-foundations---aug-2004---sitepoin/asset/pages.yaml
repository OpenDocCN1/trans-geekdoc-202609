    \    // A variable in the function (method) scope\n    $myVariable = 'Methodical';\n\
    }\n}\n?>\n```\n\nIn the above example, each of the $myVariable declarations is\
    \ actually a separate variable. They can live together happily without interfering\
    \ with each other, as each resides in a separate scope. Similarly, the two myFunction\
    \ declarations are two separate functions, which exist in separate scopes. Thus\
    \ PHP will keep all of their values separate for you.\n\nScope becomes important\
    \ when you start to use object oriented programming in a significant way in your\
