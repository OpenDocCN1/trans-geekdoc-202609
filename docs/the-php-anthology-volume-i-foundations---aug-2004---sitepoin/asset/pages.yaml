  md: '# # 8 Email


    Building online applications is not just about delivering pages to Web browsers.
    For most Websites, email is an essential tool for everything from staying in touch
    with visitors, to building user registration systems.


    Sending simple emails is easy with PHP''s mail function; you need only one line
    of code to send a message—what could be easier?


    The mail function integrates either with the local sendmail client (an email application
    widely used on Unix based systems), or with a remote SMTP (Simple Mail Transfer
    Protocol) server if you lack a sendmail-compatible client. Your Web host should
    set this up for you, but if you''re using Windows for your development environment,
    you''ll need to tell PHP which SMTP server to use for sending mail. In the vast
    majority of cases, this will be the SMTP server provided by your ISP.


    To set this up, you need to modify the following settings in php.ini:


    ```

    ```

    [mail function]

    ; For Win32 only.

    SMTP = smtp.yourdomain.com


    ; Default value

    smtp_port = 25

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 258
  md: '```

    ; For Win32 only.

    sendmail_from = you@yourdomain.com

    ```


    In this chapter, we''ll concentrate on a class that takes the worry out of building
    more complicated emails: PHPMailer[1]. PHPMailer is licensed under the Lesser
    GNU Public License and provides a solid API for dealing with any content you''re
    likely to want to email from your site. It may not be as simple as a one-liner,
    but it certainly makes sending complex emails more convenient! The version used
    for this chapter was 1.65.


    # How do I simplify the generation of complex emails?


    Using the mail function is fine for simple messages, but there are numerous features
    you have to implement yourself. This initially makes itself apparent when you
    decide you want your own email address to appear in the "From" field of a message,
    and grows more complicated as you try to add people''s names against their addresses,
    attempt to carbon copy email, and so on.


    Kevin Yank discusses the issues in detail in Advanced email in PHP (see the section
    called "Further Reading" at the end of this chapter), so you know exactly what''s
    involved.


    PHPMailer adds to the mail function a raft of functionality including attachments,
    HTML emails, and mixed format emails; it''s also capable of bypassing the mail
    function completely and directly connecting to an SMTP server. Its API makes the
    construction of more complex emails very easy.


    The first thing you''ll need to do is download PHPMailer and place it somewhere
    in your include path. Version 1.65 is provided with the class library for this
    book.


    The most basic use of PHPMailer is:


    ```

    <?php

    // Include the phpmailer class

    require ''ThirdParty/phpmailer/class.phpmailer.php'';


    // Instantiate it

    $mail = new phpmailer();

    ```


    [1] http://phpmailer.sourceforge.net/'
