    \n# How do I time a PHP script?\n\nAs you find yourself building bigger and more\
    \ complicated applications with PHP, it's often a good idea to know what impact\
    \ your code is having on overall performance; the Internet is already slow, especially\
    \ for those using dialup connections, and making your visitors wait won't encourage\
    \ them to come back for more. Discovering how long your scripts take to execute\
    \ can be achieved easily with PHP's microtime function:\n\n```\n<?php\nfunction\
    \ getMicroTime()\n{\n    list($usec, $sec) = explode(\" \", microtime());\n  \
    \  return ((float)$usec + (float)$sec;\n}\n\n$start = getMicroTime();\n\nfor ($i\
    \ = 0; $i < 5; $i++) {\n    sleep(1);\n}\n\necho 'Script took: ' . (getMicroTime()\
    \ - $start);\n?>\n```\n\nThe above code tells me “Script took: 4.9990350008011”,\
    \ which is a time in seconds. microtime returns a string value of the format decimal_part\
    \ integer_part. Exploding this result and adding them together gets the floating\
    \ point time in seconds. This approach to timing scripts simply involves noting\
    \ the time before the script begins, and again when all execution has finished.\
    \ The microtime function is used to provide a time that’s precise enough to be\
    \ useful.\n\nIf you want to build an overall picture of what’s going on within\
    \ your site, you could use the php.ini settings auto_prepend_file and auto_append_file\
    \ to time all scripts, or with a .htaccess file like so:\n\n```\nphp_value auto_prepend_file\
    \ '/path/to/script_start.php'\nphp_value auto_append_file '/path/to/script_end.php'\n\
    ```"
