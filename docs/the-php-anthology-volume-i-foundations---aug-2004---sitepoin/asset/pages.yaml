    # # How do I deal with time zones?


    Ever since Britannia ruled the waves, the world has been encumbered with the problem
    that all time is centered on an area of London called Greenwich. Now home to the
    National Maritime Museum, Greenwich is home to many a dimly lit pub where you''ll
    find it''s a good idea not to mention you''re from out of town.


    Using landlubber terminology, time zones operate east and west around the globe,
    and measure how many hours before or after Greenwich the sun reaches its highest
    point in the day. The fact that no one ever sees the sun in Greenwich apparently
    never deterred early sailors, who used clocks set to Greenwich Mean Time (GMT)
    to work out how far east or west they''d traveled round the globe. These days,
    GMT is also referred to as coordinated universal time (UTC), Zulu time, universal
    time, or simply world time.


    Dealing with time zones is almost as problematic for today''s Web developer as
    it was for the early explorers, and it requires some effort to make sure you get
    it right. Maybe the country in which your site is hosted is in a different time
    zone to the one in which you''re based. You may also need to allow visitors to
    set their own time zone, so your site can adapt time-sensitive content accordingly.


    Your host should provide you with a server that''s configured correctly and provides
    you with a time value that you''ll be able to use through PHP''s `date` and `time`
    functions. The server should also be accurately configured for the time zone in
    which it resides. You can check these values with PHP''s `date` function, as shown
    here:


    ```

    <?php

    echo date(''H:i:s T O'');

    ?>

    ```


    This will return something like:'
