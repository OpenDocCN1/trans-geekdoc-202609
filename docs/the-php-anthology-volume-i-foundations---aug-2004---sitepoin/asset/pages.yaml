    # # Where do I get help?


    PHP is the most widely-used Web scripting language, running on over ten million
    domains around the world[2]. For an open source technology that lacks any corporate
    funding whatsoever, its popularity may seem inexplicable. Yet PHP’s success is
    no mystery; it has one of the most active and helpful online communities of any
    technology. Recent estimates place the number of PHP developers worldwide at around
    500,000 and given the nature of the medium, it’s fair to assume that a large proportion
    are active online. In other words, for developers of PHP-based Websites, help
    is only ever a few clicks away.


    # # Reading the Manual


    There’s a well known four letter abbreviation, RTFM (I don’t think it needs explaining
    here), which tends to be used to harass beginners in all areas of computing. While
    I can understand veterans might be unwilling to repeat endlessly the same, well
    documented instructions, I think the basic assumption should be that we all know
    how to read the manual in the first place.


    The documentation for PHP is excellent, and is maintained by volunteers who make
    it their sole purpose to keep it up to date, understandable and relevant. The
    online version[3] is extremely easy to navigate and contains further know-how
    in the form of annotations from developers across the globe. The manual is one
    of the areas in which PHP is truly exceptional; software houses like Sun and Microsoft
    still have a long way to go to provide this quality of material to developers
    working on their platforms.


