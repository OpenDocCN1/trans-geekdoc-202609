- pgno: 24
  md: '# Section III: Features


    http://www.php.net/features


    Covered here are the core elements of PHP that are generally focused on solving
    specific Web-related problems. Much of the Features section reads like an “executive
    summary” and, from a developers point of view, the information contained here
    may be better understood when you see it in action—for instance, in the examples
    we’ll see throughout this book.


    # Section IV: Function Reference


    http://www.php.net/manual/en/funcref.php


    This section makes up the real body of the manual, covering all aspects of the
    functionality available within PHP. This is where you’ll spend most of your time
    as you progress with PHP, so you’ll be glad to hear the PHP group has made a concerted
    effort to make this section easy to get around. It’s even fun, in an idle moment,
    just to trawl the manual and be amazed by all the things you can do with PHP.
    Yes, I did just describe reading a manual as “fun”!


    The function reference is broken down into subsections that cover various categories
    of functions, each category corresponding to a PHP extension.


    # PHP Extensions


    The notion of an extension can be a little confusing to start with, as many are
    distributed with the standard PHP installation. The String functions, which we’d
    be pretty hard-pressed to live without, are a case in point. In general, the PHP
    group distributes, as part of the default PHP installation, all the extensions
    they regard as being essential to developers.


    Extensions regarded as “non-essential” functionality (i.e. they will be required
    by some, but not all developers) must be added separately. The important information
    appears under the heading “Installation” on the main page for each extension.
    Core extensions are described with the sentence “There is no installation needed
    to use these functions; they are part of the PHP core.” Nonstandard extensions
    are examined in Appendix B.


    Access to information within the Function Reference is available through the search
    field (top right) and searching within the “Function List”. Note that searching
    within the function list examines only the Function Reference section'
