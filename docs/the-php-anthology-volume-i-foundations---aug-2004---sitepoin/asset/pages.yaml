  md: "The point of using a class here is to get some practice using PHP's object\
    \ model to deal with common tasks. If you're new to object oriented programming\
    \ with PHP, the most important thing to remember at this stage is that you don't\
    \ need to understand all the code you find in a class to be able to use it in\
    \ your code.\n\nWe'll be making use of this class and others throughout the book\
    \ to illustrate how object oriented programming aids the reuse of code and can\
    \ save time when you're developing applications.\n\n# How do I fetch data from\
    \ a table?\n\nBeing connected to a database is nice, sure. But what good is it\
    \ if we can't get anything from it?\n\nThere are a number of ways to fetch data\
    \ from MySQL, but the most widely used is probably mysql_fetch_array in conjunction\
    \ with mysql_query.\n\nWe just need to add a little more to the connectToDb function\
    \ we saw in “How do I access a MySQL database?” to fetch data from this table:\n\
    \n```\n// Connect to MySQL\n$dbConn = &connectToDb($host, $dbUser, $dbPass, $dbName);\n\
    \n// A query to select all articles\n$sql = \"SELECT * FROM articles ORDER BY\
    \ title\";\n\n// Run the query, identifying the connection\n$QueryResource = mysql_query($sql,\
    \ $dbConn);\n\n// Fetch rows from MySQL one at a time\nwhile ($row = mysql_fetch_array($QueryResource,\
    \ MYSQL_ASSOC)) {\n\techo 'Title: ' . $row['title'] . '<br />';\n\techo 'Author:\
    \ ' . $row['author'] . '<br />';\n\techo 'Body: ' . $row['body'] . '<br />';\n\
    }\n```\n\nEssentially, there are three steps to getting to your data:\n\n+   1.\
    \ First, place the necessary SQL query³ in a string:\n\n³If you are unfamiliar\
    \ with Structured Query Language (SQL), I'll cover the basics throughout this\
    \ chapter. For a more complete treatment, however, refer to Build Your Own Database\
    \ Driven Website Using PHP & MySQL, 2nd Edition (ISBN 0-9579218-1-0)."
