- pgno: 60
  md: "In PHP, all variable names are linked with values in memory automatically.\
    \ Using a reference allows us to link two variable names to the same value in\
    \ memory, as if the variable names were the same. You can then substitute one\
    \ for the other.\n\n# # What Are References?\n\nTo understand references, we have\
    \ to begin by understanding how PHP handles variables under normal circumstances\
    \ (i.e. without references).\n\nBy default, when a variable is passed to anything\
    \ else, PHP creates a copy of that variable. When I say “passed,” I mean any of\
    \ the following:\n\n+   - Passing a variable to another variable:\n\n```\n<?php\n\
    $color = 'blue';\n$settings['color'] = $color;\n?>\n```\n\n$settings['color']\
    \ now contains a copy of $color.\n\n+   - Passing a variable as an argument to\
    \ a function:\n\n```\n<?php\nfunction isPrimaryColor($color)\n{\n    // $color\
    \ is a copy\n    switch ($color) {\n    case 'red':\n    case 'blue':\n    case\
    \ 'green':\n    return true;\n    break;\n    default:\n    return false;\n  \
    \  }\n}\n\n$color = 'blue';\nif (isPrimaryColor($color)) {\n    echo $Color .\
    \ ' is a primary color';\n} else {\n    echo $Color . ' is not a primary color';\n\
    }\n```"
