  md: '# # Polymorphism


    Another powerful aspect of object oriented programming is polymorphism—the ability
    of different classes to share an **interface**.


    An interface is one or more methods that let you use a class for a particular
    purpose. For example, you could have two database connection classes—one for MySQL
    and one for PostgreSQL. As long as they both offered a query method, you could
    use them interchangeably for running queries on different databases. The query
    method is a simple interface that the two classes share.


    The classes sharing the same interface are often inherited from a parent class
    that makes the common methods available. Again, this is best understood by example.


    First, we define an **abstract** base class, `Message`, which provides the common
    method `getMessage`. Beneath the `Message` class, we define **concrete** classes,
    each of which creates a specific message.


    The terms “abstract” and “concrete” refer to class usage, in particular, whether
    a class is intended to be used directly or not. An abstract class is one in which
    some functionality or structure is to be shared by all subclasses, but is not
    intended to be used directly; typically, it has one or more empty methods that
    doesn’t do anything useful. In other words, you’re not supposed to create objects
    from an abstract class. A concrete class is a subclass of the abstract class from
    which you *can* create objects. Some languages, like Java, provide support for
    abstract classes within the language syntax—something PHP 4 doesn’t offer. You
    can still use the *concept* of abstract classes when designing applications, though
    you might consider adding documentation to tell other developers working with
    the code that the class is abstract.


    ```

    <?php

    class Message {

    var $message;

    function setMessage($message)

    {

    $this->message = $message;

    }

    function getMessage()

    {

    return $this->message;

    }

    }

    ```'
