- pgno: 29
  md: '# # Syntax Errors


    As in the example above, **syntax errors** occur when you break the rules of PHP’s
    syntax. Syntax errors will usually result in a Parse Error message from PHP.


    In the example above, the problem itself occurs on line 4:


    ```

    echo ''parse error!<br />''

    ```


    I forgot to add at the end of the line the semicolon (;) that''s required to mark
    the termination of every statement. The PHP parser only noticed the problem on
    line five when it encountered another echo statement, as instructions may legally
    span more than one line. This is worth being aware of, as it sometimes makes errors
    hard to find—an error might actually have occurred prior to the line on which
    PHP noticed a problem.


    Syntax errors can get particularly confusing in the case of large if-else or while
    statements where, for example, you’ve forgotten a closing parenthesis. Perhaps
    you have a long listing that’s interspersed by blocks of HTML; finding that missing
    curly brace may be extremely difficult. However, as your coding technique improves
    and you start to take advantage of classes, breaking your code up into discrete
    blocks within which the code is short and easy to read, you’ll find locating syntax
    errors much easier.


    One further thing to be aware of is PHP’s use of **tokens**. In the above error
    message, PHP complained about an “unexpected T_ECHO.” A T_ECHO is a token representing
    an echo statement in your PHP script. The PHP parser breaks your code up into
    tokens so that it can analyze and process the script. Some of the tokens you’ll
    see reported in parse errors are less obvious than others, so if you’re unsure,
    it’s worth looking at the manual on tokens[23].


    If you’re using PHP 4.3.0, you’ll find it includes the so-called tokenizer extension[24],
    which allows you to see your script the way the PHP parser views it. For the sake
    of interest, here’s how you could view the tokenizer’s output:


    ```

    <?php

    /* Note: This script will only work with PHP 4.3.0 or later */

    // Read a PHP script as a string

    ```


    +   [23] http://www.php.net/tokens

    +   [24] http://www.php.net/tokenizer'
