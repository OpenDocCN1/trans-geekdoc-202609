  md: "The class doesn't provide everything we want, so the first thing we need is\
    \ a class that will extend the Pager_Sliding class to provide some extra information.\n\
    This, by the way, uses **inheritance** (see Chapter 2 for more information).\n\
    \n```\n/**\n * DB_Pager_Sliding - extends PEAR::Pager_Sliding\n * Provides an\
    \ API to help build query result pagers\n * @access public\n * @package SPLIB\n\
    \ */\nclass DB_Pager_Sliding extends Pager_Sliding {\n    /**\n     * DB_Pager_Sliding\
    \ constructor\n     * @param array params for parent\n     * @access public\n\
    \     */\n    function DB_Pager_Sliding($params)\n    {\n        parent::Pager_Sliding($params);\n\
    \    }\n\n    /**\n     * Returns the number of rows per page\n     * @access\
    \ public\n     * @return int\n     */\n    function getRowsPerPage()\n    {\n\
    \        return $this->_perPage;\n    }\n\n    /**\n     * The row number to start\
    \ a SELECT from\n     * @access public\n     * @return int\n     */\n    function\
    \ getStartRow()\n    {\n        if ($this->_currentPage == 0) {\n            return\
    \ $this->_perPage;\n        } else {\n            return ($this->_currentPage\
    \ - 1) * $this->_perPage;\n        }\n    }\n}\n```"
