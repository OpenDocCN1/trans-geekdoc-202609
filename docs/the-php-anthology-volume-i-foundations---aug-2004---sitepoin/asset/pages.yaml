  md: 'This capability only goes so far, though. You can’t, for example, pass a string
    to one of PHP’s array functions.


    You should now have a taste of what can be achieved with PHP’s normal string functions.
    In general, if you can get by with them, do so. They’re fast and easy to use and
    they’re far less prone to error than regular expressions.¹


    # How do I implement custom formatting code?


    If you run a site that allows users to add text, the first thing you quickly realize
    is allowing them to use straight HTML will be a recipe for disaster. Within no
    time at all, someone will have (either accidentally or maliciously) posted a message
    that scrambles the tidy layout of your site.


    If you’ve ever used a forum like vBulletin or phpBB, you’ll have run into BBCode
    (bulletin board code), a collection of non-HTML tags that forum members can use
    to provide simple text formatting that won’t damage the layout of your site. BBCode
    is almost a standard these days, as most forums implement this tag convention.


    Here’s a simple example of BBCode:


    ```

    This is an example of a BBCode link to

    [url=http://www.sitepointforums.com/]sitepointforums[/url]

    ```


    When the above text is displayed on the forum, this is the code that’s generated
    by the forum software:


    ```

    This is an example of a BBCode link to

    <a href="http://www.sitepointforums.com/">sitepointforums</a>

    ```


    The advantage of BBCode over PHP’s in-built strip_tags function, which you saw
    in “How do I solve problems with text content in HTML documents?”, is that BBCode
    gives you complete control over what’s displayed. BBCode allows you to give your
    site’s members some ability to format what they add to your site without impacting
    the site layout as a whole.


    ¹Regular expressions let you define complex patterns to search for within PHP
    strings. The topic of regular expressions is a complex one that could be (and
    has been) the subject of an entire book. A reference is provided in the section
    called “Further Reading” below if you’re interested in exploring the subject.'
