    # Figure 9.6. Bread Crumbs at SitePoint


    ![](img/5b6cdf7cf4cf53e30b19e047895dc464_309_0.png)


    The text between each forward slash is a “crumb” that, when clicked on, takes
    the user to a specific location within the site.


    They’re called crumbs, by the way, as a reference to the Grimms’ fairy tale Hansel
    and Gretel—the story of two children who, you might remember, used bread crumbs
    to mark their path through a forest so they could find their way home.


    # Lost in the Trees


    Tree menus are ubiquitous in software applications, having been applied to everything
    from interfaces in text-driven DOS applications to the “Start” button in Windows
    and Linux equivalents. On the Web, tree menus have been applied to mixed effect,
    mainly using JavaScript, which suffers from varying support. However, there’s
    nothing to stop you building tree menus based purely on HTML, in which clicking
    on a menu item updates the menu.


    There are many approaches to dealing with tree menus. To make your life easier,
    I’ve put together a set of classes that provide tree data structures in various
    forms. I’ll leave it up to you to decide how you’ll build your HTML (or JavaScript)
    menu with them.


