  md: "```\nArray\n(\n    [0] => forums\n    [1] => discussion\n    [2] => php\n)\n\
    ```\n\nIn terms of your code, you need to have some kind of decision logic that\
    \ passes the handling of each variable to code that knows what to do with it.\
    \ In this example,\n\n+   1. From the “root” PHP script of your site (e.g. index.php),\
    \ examine path variable 0 to find out which code to pass this job to. In this\
    \ case, it’s the forums code.\n\n+   2. From the forums code, examine path variable\
    \ 1 to find out which code within the forum application should deal with this.\
    \ In this case, it’s the discussion code.\n\n+   3. In the discussion code, examine\
    \ path variable 2 to find out which discussion should be displayed.\n\nIn each\
    \ case, the code delegates the work to some other code until it reaches the point\
    \ where it’s time to do some real work (e.g. the discussion code performs a database\
    \ query to select all threads in the requested discussion, and displays them as\
    \ an HTML table).\n\nHow you actually handle the delegation of work is a matter\
    \ of preference and experience. You might simply use an include statement to load\
    \ the correct PHP script each time a decision is made. More complex, but often\
    \ more flexible approaches use object orientation, where the decision-making process\
    \ is based on the selection of the correct class to deal with each step.\n\nEither\
    \ way, this takes your Website down the road to becoming a framework—a structured\
    \ environment to which you add the code for your applications, which the framework\
    \ executes on demand. While considering how you’ll do this, it’s worth investigating\
    \ some of the other PHP frameworks available, such as eZ publish[16], Phrame[17]\
