  md: "```\nMarch has 31 days\nApril has 30 days\nMay has 31 days\nJune has 30 days\n\
    July has 31 days\nAugust has 31 days\nSeptember has 30 days\nOctober has 31 days\n\
    November has 30 days\nDecember has 31 days\n```\n\nNote that this method will\
    \ correctly report twenty-nine days in February when the date stored in DateMath\
    \ occurs in a leap year. And *speaking of leap years*...\n\n# Leap Years\n\nNot\
    \ all years are the same, which, if you had the misfortune to be born on February\
    \ 29, you'll know only too well; every four years there's an extra day, with occasional\
    \ exceptions.³ To identify leap years, I can take advantage of the daysInMonth\
    \ method to create a new method; this will examine February and use it to find\
    \ out whether it occurs in a leap year:\n\n```\nFile: DateTime/DateMath.php (in\
    \ SPLIB) (excerpt)\n\n/**\n * Determines whether current year is a leap year\n\
    \ * @return boolean true if a leap year\n * @access public\n */\nfunction isLeapYear()\n\
    {\n\treturn date('L', $this->timeStamp);\n}\n```\n\nOnce again, we're wrapping\
    \ a convenient package around an obscure feature of PHP's date function.\n\nLet's\
    \ see how it works:\n\n³Years evenly divisible by 4 are leap years, with the exception\
    \ of years evenly divisible by 100 that are *not* evenly divisible by 400. Therefore,\
    \ the years 1700, 1800, 1900 and 2100 are not leap years, but 1600, 2000, and\
    \ 2400 are leap years."
