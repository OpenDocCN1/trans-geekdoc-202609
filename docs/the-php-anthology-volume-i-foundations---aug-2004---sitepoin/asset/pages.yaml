  md: "# AddStringAttachment(string, filename[, encoding[, type]])\n\nUsing AddStringAttachment,\
    \ you can supply PHPMailer with a file that you've already stored in a PHP variable,\
    \ for example, a file that has just been uploaded or a file stored in MySQL.\n\
    \n# AddEmbeddedImage(path, cid, name[, encoding[, type]])\n\nUsing AddEmbeddedImage,\
    \ you can attach an image and give it an id (via cid), which allows you to embed\
    \ it in the body of an HTML email.\n\nHere’s an example using the AddAttachment\
    \ method:\n\n```\n<?php\n// Include the phpmailer class\nrequire 'ThirdParty/phpmailer/class.phpmailer.php';\n\
    \n// Instantiate it\n$mail = new phpmailer();\n\n// Modify this\n$YourEmail  \
