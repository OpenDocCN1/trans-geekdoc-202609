    This class is intended for use with the `crontab` utility, which is a Unix feature
    that allows you to execute scripts on a regular (for example, daily) basis.


    MySQL also provides the SQL statements `BACKUP TABLE` and `RESTORE TABLE`, which
    allow you to copy the contents of a table to another location on your file system.
    Unlike the `mysqldump` utility, tables backed up in this way preserve their original
    format (which is not human-readable) but this mechanism does not require access
    to a command line utility, so it could be executed via a Web page.


    The general syntax for these statements is as follows:


    ```

    BACKUP TABLE tbl_name[, tbl_name ...]

    TO ''/path/to/backup/directory''

    ```


    ```

    RESTORE TABLE tbl_name[, tbl_name ...]

    FROM ''/path/to/backup/directory''

    ```


    Note that on Windows systems it’s best to specify paths using forward slashes
    (e.g. `C:/backups`).


    By combining these with some of the “introspection” statements MySQL provides,
    we can backup our database using the MySQL class we built in this chapter. To
    start with, we need to get a list of tables in the database, which is quickly
    achieved using the `SHOW TABLES` query syntax:


    ```

