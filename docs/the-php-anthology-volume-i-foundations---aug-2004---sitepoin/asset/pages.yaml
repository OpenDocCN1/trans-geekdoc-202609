  md: "PHP arrays, others champion XML documents, still others plumb for using a database.\
    \ Each approach has advantages and disadvantages, although the future may see\
    \ XML become the prevalent mechanism for storing this kind of information as it\
    \ becomes an easier format for developers to work with.\n\nHere, we'll adopt the\
    \ last approach: storing the data in MySQL. This method makes building and fetching\
    \ menus easy—it's simply a case of inserting new rows into a table, and selecting\
    \ them later. It also makes the construction of the final menu in different “styles”\
    \ easy; other approaches, such as text files, may tie us to a particular menu\
    \ design and can require some heavy duty text editing during development.\n\n\
    The disadvantage of MySQL is that, without handy stored procedures to help us,\
    \ we'll have to fetch the entire contents of the menu table in one go and use\
    \ PHP to manipulate them to reflect the structure we desire. Performing multiple\
    \ queries to build a menu can result in a drag on our application, which grows\
    \ with the addition of each new menu item. The other problem with MySQL is the\
    \ issue of editing and deleting menu items, which will impact the relationships\
    \ between “branches” of the menu. We'll solve the former problem here, and leave\
    \ you to work out how to do the latter.\n\nLet's look again at the table structure\
    \ we'll use:\n\n```\nCREATE TABLE menu (\n  menu_id   INT(11)     NOT NULL AUTO_INCREMENT,\n\
    \  parent_id INT(11)     NOT NULL DEFAULT '0',\n  name      VARCHAR(255) NOT NULL\
    \ DEFAULT '',\n  description TEXT      NOT NULL,\n  location  VARCHAR(255) NOT\
    \ NULL DEFAULT '',\n  PRIMARY KEY (menu_id),\n  UNIQUE KEY location (location)\n\
    )\n```\n\nIn this table, we use a recursive relationship between rows; each row\
    \ has its own, unique menu_id (the primary key for the table), and a field called\
    \ parent_id that relates the row to its “parent” row in the same table. This way,\
    \ we can define menu items that appear “below” other menu items to create a tree\
    \ structure. The default parent_id of 0 is used to define “root” nodes that have\
    \ no parent (top level menu items, in other words).\n\nOf the other fields, name\
    \ is the name of the menu item itself, as it would appear on the menu. The description\
