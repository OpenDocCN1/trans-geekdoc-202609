  md: "```\n```php\n<?php\n// Include PEAR::Archive_Tar\nrequire_once 'Archive/Tar.php'\
    \ ;\n\n// Instantiate Archive_Tar\n$tar = new Archive_Tar('demo/demo.tar.gz',\
    \ 'gz');\n\n// An array of files to archive\n$files = array(\n  'demo/example.ini',\n\
    \  'demo/writeSecureScripts.html'\n);\n\n// Create the archive file\n$tar->create($files);\n\
    \necho 'Archive created';\n?>\n```\n```\n\nIt's pretty simple. When instantiating\
    \ the class, the second argument tells Archive_Tar what type of compression to\
    \ use—the alternative to gz (for gzip) is bz2 (for bzip2). You can simply omit\
    \ the second argument if you don't require compression. The array of file names\
    \ needs to be specified when you use the create method, the file paths being relative\
    \ to the location where the above script is executed. That's it.\n\nTo extract\
    \ the file again, we could use the following code:\n\n```\n```php\n<?php\n// Include\
    \ PEAR::Archive_Tar\nrequire_once 'Archive/Tar.php';\n\n// Instantiate Archive_Tar\n\
    $tar = new Archive_Tar('demo/demo.tar.gz');\n\n// Create the archive file\n$tar->extract('extract');\n\
    \necho 'Archive extracted';\n?>\n```\n```"
