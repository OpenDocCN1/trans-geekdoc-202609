  md: "```\nvar $totalPages;\n\n/**\n * The row MySQL should start its select with\n\
    \ * @access private\n * @var int\n */\nvar $startRow;\n\n/**\n * SimplePager Constructor\n\
    \ * @param int number of rows per page\n * @param int total number of rows available\n\
    \ * @param int current page being viewed\n * @access public\n */\nfunction SimplePager($rowsPerPage,\
    \ $numRows, $currentPage = 1)\n{\n    // Calculate the total number of pages\n\
    \    $this->totalPages = ceil($numRows / $rowsPerPage);\n\n    // Check that a\
    \ valid page has been provided\n    if ($currentPage < 1) {\n        $currentPage\
    \ = 1;\n    } else if ($currentPage > $this->totalPages) {\n        $currentPage\
    \ = $this->totalPages;\n    }\n\n    // Calculate the row to start the select\
    \ with\n    $this->startRow = (($currentPage - 1) * $rowsPerPage);\n}\n\n/**\n\
    \ * Returns the total number of pages available\n * @return int\n * @access public\n\
    \ */\nfunction getTotalPages()\n{\n    return $this->totalPages;\n}\n\n/**\n *\
    \ Returns the row to start the select with\n * @return int\n * @access public\n\
    ```"
