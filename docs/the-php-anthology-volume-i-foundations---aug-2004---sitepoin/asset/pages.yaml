  img_proc: true
- pgno: 230
  md: 'Thanks to patent issues with GIF images[2], support for this format in the
    GD library ceased in version 1.6. It is possible to find older versions of the
    GD library online but using it may put you in the line of fire from Unisys or
    IBM. What makes life even more entertaining is that the GD library only began
    to offer support for the PNG format (a free alternative to GIF supported by newer
    browsers) in version 1.6. In the examples here, I''ll assume you have GD version
    2.0 (which is bundled with the latest versions of PHP) with Freetype, JPEG, and
    PNG support built in.


    The good news is the patent on the GIF format expires in 2004, so hopefully we''ll
    see GIF support return to the GD library soon. Until then, it''s worth regarding
    the PNG format as the preferred alternative. PNG is capable of supporting full
    32-bit images, compared with GIF''s 8 bits. In addition, PNG uses a more efficient
    compression algorithm, reducing the amount of bandwidth used when comparing an
    8-bit PNG with an 8-bit GIF.


    # # MIME Types


    MIME stands for **Multipurpose Internet Mail Extensions**, a standard originally
    conceived to help identify different email content types. MIME has since become
    the _de facto_ standard for describing content types on the Internet. When you
    deal with images in PHP, it''s important to have a grasp of the different content
    types, or you may end up struggling for hours with a simple problem.


    In general, before you send requested content to the browser, your Web server
    must announce the content type using a special **Content-Type** header, so the
    browser knows what to do with the content. For example, here are the headers that
