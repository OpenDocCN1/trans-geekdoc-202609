    \ which allows you to check configuration settings, and ini_restore, which resets\
    \ PHP's configuration to the default value as defined by php.ini and any .htaccess\
    \ files. Using ini_set, here's an example which allows us to avoid having to define\
    \ our host, user name and password when connecting to MySQL:\n\n```\nini_set('mysql.default_host',\
    \ 'localhost');\nini_set('mysql.default_user', 'harryf');\nini_set('mysql.default_password',\
    \ 'secret');\n\nif (!mysql_connect()) {\n echo mysql_error();\n} else {\n echo\
    \ 'Success';\n}\n```\n\nBe aware that PHP provides for some settings, such as\
    \ error_reporting, alternative functions that perform effectively the same job\
    \ as ini_set. Which you prefer is a matter of taste.\n\nNote that certain settings,\
    \ such as register_globals, can only be usefully modified by php.ini or .htaccess,\
    \ because such settings influence PHP's behavior before it begins executing your\
    \ scripts.\n\nFurthermore, some configuration settings can be changed only in\
    \ php.ini, such as extension_dir, which tells PHP the directory in which PHP extensions\
    \ can be found. For a complete reference on controlling settings, refer to the\
    \ PHP Manual[1]."
