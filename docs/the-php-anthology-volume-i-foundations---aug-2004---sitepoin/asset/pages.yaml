  md: '# 6 Dates and Times


    Wouldn''t it be nice if we had a ten-day week? How about 100 minutes in an hour?
    Ten months each year?


    Dates and times are probably something you take for granted. You deal with

    them every day and are probably unaware of the clever mathematical algorithms

    your brain uses to work out how long you have to wait before Friday comes

    around again. It''s only when you start programming that you realize that what

    you''ve been taking for granted all these years is not as easy to deal with in
    code

    as you''d expect. Blame the Romans!


    In our day-to-day lives, we''re used to working with decimal (base ten) numbers,

    which are optimized for dealing with groups of ten (ten ones in ten, ten tens
    in

    a hundred, ten hundreds in a thousand, etc.). Avoiding a math lecture, the

    problem with dates and times is that they don''t break down into groups of ten:


    +   - [ ] In one second you have one thousand milliseconds. No problem.

    +   - [ ] In one minute you have sixty seconds.

    +   - [ ] In one hour you have sixty minutes.

    +   - [ ] In one day you have twenty-four hours.'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'So, how do you calculate the number of days given a value in milliseconds?
    That’s a stack of long division! And that’s just time—what about dates?


    +   In one week, you have seven days (does your week begin on Sunday or Monday?)


    +   In one month you have... er... you don’t know exactly how many days or weeks;
    it depends on the month (and don’t get me started on leap years!)


    +   In one year you have twelve months.


    Of course, that’s too easy. How about making it more difficult? You often need
    to be able to express a date in multiple formats such as “Tuesday 18th March,
    2003”, “03/18/03” (US format), “18/03/03” (European format), “18th Mar 2003”,
    and “20030318” (a MySQL-style timestamp), not to forget “1047942000” (a Unix timestamp)!


    How do you plan to display a list of articles fetched from a database and ordered
    by date? What if you want to present something more complex, such as an online
    calendar? There’s a lot to think about when dealing with dates and times in your
    applications.


    PHP really helps to make times and dates as painless as possible, thanks to powerful
    functions like date. But it’s important to develop the right strategy for dealing
    with dates and times early in your career as a PHP programmer. Take the right
    approach from day one, and you’ll avoid having to go back later and write insanely
    complex code to fix the mistakes you made as a newbie. In this chapter, we’ll
    be looking at the kinds of strategies you can employ, and solving some of the
    common problems you’ll face when it comes to dates and times.


    # How do I store dates in MySQL?


    At first glance, the easiest way to store dates in MySQL may appear to be to simply
    drop them in exactly as they’d appear on a Web page, for example, as “18th March
    2003”. Be warned—this is the first step on the path to serious hair loss. The
    WHERE clause in an SQL statement run against MySQL will not allow you to do things
    like this:


    ```

    SELECT * FROM table WHERE date > ''14th February 2003''

    ```


    A far better way to store date information is to use a timestamp. Timestamps are
    numbers that identify dates and times in a format that can be used to solve'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'the types of problems you’ll typically encounter in your applications; they
    make it easier to perform operations such as ordering a list or comparing two
    dates, for example. As a PHP developer, there are essentially two types of timestamp
    you’re likely run into—the Unix timestamp and the MySQL timestamp.


    # Unix Timestamps


    Unix timestamps are generally the most effective way to handle dates—they’re a
    simple solution to a tricky problem. A Unix timestamp reflects the number of seconds
    that have passed since January 1, 1970, 00:00:00 GMT. Converting dates to their
    Unix timestamps makes date- and time-related calculations easy.


    The downside of Unix timestamps is that unless you’re a child prodigy they’re
    not human-readable; if I told you that 1047994036 was the number of seconds that
    had passed since January 1, 1970, could you tell me what the date was?


    The other problem with Unix timestamps is that they can only be used within a
    limited date range, depending on your operating system. On Linux-based systems,
    you should be able to go back to somewhere around 1902, and forward as far as
    2037. On Windows-based operating systems, the lower limit may be as recent as
    January 1, 1970. The problem lies in the size of the number. Any operating system
    can easily handle integer numbers up to a certain size (2^32, or 4,294,967,296
    for current 32-bit operating systems), after which it must work harder to juggle
    oversized numbers. For the sake of efficiency, therefore, operating systems usually
    impose this “maximum” size on important values like dates and times. Linux at
    least allows you to have negative integer values for dates, hence you can work
    with dates occurring before January 1, 1970, while PHP on Windows may complain
    about such dates. What I’m saying here is that there’s potentially another Y2K-like
    problem looming somewhere around January 19, 2038, which will affect all 32-bit
    operating systems still in existence. Try searching Google for that date and you’ll
    see what I mean...


    Although 2038 is a long way off and the timestamp issue may influence no more
    than your choice of pacemaker, it’s worth bearing in mind if you’re planning an
    application that will need to work with dates from the distant past or future
    (perhaps on a history Website). PHP provides functions such as time and mktime
    to help deal with Unix timestamps. To see the problem in action, try running the
    following script on as many different operating systems as you can:


    ```

    <?php

    echo ''1st Jan 1899: '' . mktime(0, 0, 0, 1, 1, 1899) . ''<br />'';

    ```'
