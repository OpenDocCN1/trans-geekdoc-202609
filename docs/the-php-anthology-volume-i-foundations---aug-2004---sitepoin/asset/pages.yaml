  md: "**unbuffered query**, on the other hand, lets MySQL hold onto the results until\
    \ you request them, one row at a time (e.g. with mysqli_fetch_array). Not only\
    \ does this allow your script to continue running while MySQL performs the query,\
    \ it also saves PHP from having to store all of the rows in memory at once.\n\n\
    PHP lets you perform unbuffered queries with mysqli_unbuffered_query:\n\n```\n\
    $queryResource = mysqli_unbuffered_query($sql, $dbConn);\n```\n\nOf course, all\
    \ good things come at a price—with unbuffered queries you can no longer use the\
    \ mysqli_num_rows function to count the number of rows. Obviously, as PHP doesn't\
    \ keep a copy of the complete result set, it is unable to count the rows it contains!\
    \ You also must fetch all rows in the result set from MySQL before you can make\
    \ another query.\n\nAlthough other functions exist for getting rows and cells\
    \ from query results, like mysqli_fetch_object and mysqli_result, you can achieve\
    \ more or less the same things with just mysqli_fetch_array, and the consistency\
    \ may help keep your code simple.\n\n# Fetching with Classes\n\nNow that you're\
    \ happy with the basics of fetching data from MySQL, it's time to build some more\
    \ on the MySQL class from the last solution.\n\nFirst, let's add a method to run\
    \ queries from the class:\n\n```\nFile: Database/MySQL.php (in SPLIB) (excerpt)\n\
    \n/**\n * Returns an instance of MySQLResult to fetch rows with\n * @param $sql\
    \ string the database query to run\n * @return MySQLResult\n * @access public\n\
    \ */\nfunction &query($sql)\n{\n    if (!($queryResource = mysqli_query($sql,\
    \ $this->dbConn)) {\n        trigger_error('Query failed: ' . mysqli_error($this->dbConn)\n\
    \            . ' SQL: ' . $sql);\n    }\n\n    return new MySQLResult($this, $queryResource);\n\
    }\n```"
