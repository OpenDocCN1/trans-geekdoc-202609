  md: 'The easiest way to see how this works is by example.


    The following snippet of code shows the Year class being used to create Month
    objects for a simple calendar that displays months only.


    To start with, we need to include the necessary classes:


    ```

    <?php

    // Include Calendar Year

    require_once ''DateTime/Year.php'';

    require_once ''DateTime/Month.php'';

    ```


    Since this is our first time using a sizeable inheritance hierarchy, I should
    note that the two classes included here—Year and Month—both perform some includes
    of their own. For example, they both include their parent class, Calendar. Also
    included is a class called TimeUnitValidator which is responsible for checking
    that dates created by these classes are valid. Although all these classes should
    be included transparently as a result of the two includes above, you _do_ need
    to ensure that the relevant class files are available (PHP will let you know if
    they''re not!). The code presented here and in the code archive assumes that all
    of the date/time classes may be found in a directory called DateTime located in
    your PHP include path.


    Next, I need to set default values for the $_GET variables that control which
    part of the calendar is displayed. I set these to the current year and month if
    no date is provided via the URL. There''s no requirement to use the variable names
    that appear here; you can call them whatever you like.


    ```

    // Initialize $_GET variables to this year and month if not set

    if (!isset($_GET[''y''])) $_GET[''y''] = date(''Y'');

    if (!isset($_GET[''m''])) $_GET[''m''] = date(''m'');

    ```


    Once that''s done, we create a Year object and pass it the number value of the
    year it represents (e.g. 2003). Following that, we create an array and place inside
    it a Month object. This array is used to identify particular calendar elements
    as having been “selected”, something we’ll see in action shortly.


    ```

    // Create a new Year object

    $year = new Year($_GET[''y'']);


    $selectedMonths = array(

    ```'
