- pgno: 65
  md: "Now, let’s say that, in response to one of the options on your user control\
    \ panel, you want to make some changes to the look and feel of the site. Let’s\
    \ put this into action:\n\n```\nFile: 6.php (excerpt)\n\n$lookandfeel = new LookAndFeel();\
    \ // Create a LookAndFeel\n$output = new Output($lookandfeel); // Pass it to an\
    \ Output\n\n// Modify some settings\n$lookandfeel->setColor('red');\n$lookandfeel->setSize('large');\n\
    \n// Display the output\necho $output->display();\n```\n\nUsing the setColor and\
    \ setSize methods, we change the color to “red” and the size to “large,” right?\
    \ Well, in fact, no. The output display still says:\n\n> Color is white and size\
    \ is medium\n\nWhy is that? The problem is that we’ve only passed a copy of the\
    \ LookAndFeel object to $output. So the changes we make to $lookandfeel have no\
    \ effect on the copy that $output uses to generate the display.\n\nTo fix this\
    \ we have to modify the Output class so that it uses a reference to the LookAndFeel\
    \ object it is given. We do this by altering the constructor:\n\n```\nFile: 7.php\
    \ (excerpt)\n\nfunction Output(&$lookandfeel)\n{\n    $this->lookandfeel = &$lookandfeel;\n\
    }\n```\n\nNotice that we have to use the reference operation twice here. This\
    \ is because the variable is being passed twice—first to the constructor function,\
    \ then again, to place it in a member variable.\n\nOnce we’ve made these changes,\
    \ the display looks like this:\n\n> Color is red and size is large\n\nIn summary,\
    \ passing by reference keeps the target variable “linked” to the source variable,\
    \ so that if one changes, so does the other."
