- pgno: 23
  md: 'The manual is also available in twenty-four different languages[4] but as you’re
    reading this book I’ll assume you’re happy with the English version of the manual.
    It’s broken down into five main sections plus appendices. It’s worth knowing what
    kind of information can be found, and where—at least within the first four sections,
    which are the most relevant to the typical PHP developer.


    # Section I: Getting Started


    http://www.php.net/getting-started


    This section provides a short introduction to PHP with some basic examples. It
    then explains how to install PHP (describing all sorts of operating system-Web
    server combinations), and how to configure it in terms of modifying your php.ini
    file.


    Not to be overlooked is the section on security, which covers the areas in which
    PHP developers often make mistakes that leave their applications open to abuse.
    Once again, the “price” of PHP’s ease of use is that it won’t always protect you
    from your worst mistakes, so it’s worth getting started on security as early as
    possible in your PHP career. You’ll find a summary of key security issues in Appendix
    C, as well as in discussions throughout this book, where appropriate.


    # Section II: Language Reference


    http://www.php.net/langref


    This section covers the fundamentals of PHP as a programming language. Some of
    these are essential to your being able to achieve anything with PHP, while others
    become useful as you look for ways to improve your technique. Reading the whole
    lot in one sitting may well be like reading a dictionary. Fortunately, it’s possible
    to absorb much of the information contained in the language reference by reading
    the wealth of tutorials available online, and examining the code that’s used in
    open source PHP applications. Certainly, as you read this book, I hope you’ll
    pick up a thing or two about getting the most out of PHP. However, it is worth
    familiarizing yourself with the subjects contained in this section of the manual,
    and keeping them in the back of your mind for future reference.'
