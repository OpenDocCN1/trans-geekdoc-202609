  md: "# # Understanding Scope\n\nWrite more than a few hundred lines of procedural\
    \ PHP code and, no doubt, you'll run into a parser error or, worse still, a mysterious\
    \ bug caused by your accidentally having used a function or variable name more\
    \ than once. When you're including numerous files and your code grows increasingly\
    \ complex, you may find yourself becoming more paranoid about this issue. How\
    \ do you stop such naming conflicts from occurring? One approach that can help\
    \ solve this problem is to take advantage of **scope** to hide variables and functions\
    \ from code that doesn't need them.\n\nA scope is a context within which the variables\
    \ or functions you define are isolated from other scopes. PHP has three available\
    \ scopes: the **global scope**, the **function scope**, and the **class scope**.\
    \ Functions and variables defined in any of these scopes are hidden from any other\
    \ scope. The function and class scopes are _local_ scopes, meaning that function\
    \ X's scope is hidden from function Y's scope, and vice versa.\n\nThe big advantage\
    \ of classes is that they let you define variables and the functions that use\
    \ them together in one place, while keeping the functions hidden from unrelated\
    \ code. This highlights one of the key theoretical points about the object oriented\
    \ paradigm. The procedural paradigm places most emphasis on functions, variables\
    \ being treated as little more than a place to store data between function calls.\
    \ The object oriented paradigm shifts the emphasis to variables; the functions\
    \ “back” the variables and are used to access or modify them.\n\nLet's explore\
    \ this through an example:\n\n```\n<?php\n// A global variable\n$myVariable =\
    \ 'Going global';\n\n// A function declared in the global scope\nfunction myFunction()\n\
    {\n    // A variable in function scope\n    $myVariable = 'Very functional';\n\
    }\n\n// A class declared in the global scope\nclass MyClass {\n    // A variable\
    \ declared in the class scope\n    var $myVariable = 'A class act';\n}\n```"
  merge: -1
  img_proc: true
- pgno: 55
