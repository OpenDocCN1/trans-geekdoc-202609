    # # FULLTEXT Searches


    MySQL provides an alternative that does most of the work for you—the FULLTEXT
    index. Indexes in a database are much like the index of a book; they provide a
    means to locate information within the database quickly from an organized list.
    A FULLTEXT index allows you to search a table for particular words.


    FULLTEXT indexes were introduced to MySQL with version 3.23. The implementation
    at this point was fairly limited but still useful for basic searching, which is
    what I’ll demonstrate here. In MySQL version 4.0.1, this functionality was extended
    to provide a full Boolean search mechanism that gives you the ability to build
    something like Google™’s advanced search features. FULLTEXT indexes also allow
    each result to be returned with a “relevance” value so that, for example, the
    results of multiple word searches can be displayed in terms of how well each result
    matches that user’s particular search.


    To take advantage of FULLTEXT indexes, you first need to instruct MySQL to begin
    building an index of the columns you want to search:


    ```

    ALTER TABLE articles ADD FULLTEXT art_search (title, body, author)

    ```


    Once you’ve done that, you need to INSERT a new record (or modify an existing
    one) to get MySQL to build the index. You also need at least three records in
    the database for FULLTEXT searches to work, because non-Boolean searches will
    only return results if the search string occurred in less than 50% of the rows
    in'
