- pgno: 202
  md: "# # Day of the Week\n\nIf we’re given the date “March 22, 2003,” how can we\
    \ find out which day of the week it was? The easiest solution is to convert it\
    \ to a timestamp, then use PHP’s date function to tell us which day the twenty-second\
    \ fell on. To add this to the class, we need only insert another method:\n\n```\n\
    ```php\n/**\n * Returns the day of the week\n * @param boolean if true returned\
    \ value will be numeric day of\n * week\n * @return mixed e.g. Saturday or 6\n\
    \ * @access public\n */\nfunction dayOfWeek($Numeric = false)\n{\n if ($Numeric)\
    \ {\n return date('w', $this->timeStamp);\n } else {\n return date('l', $this->timeStamp);\n\
    \ }\n}\n```\n```\n\nNow, using the dayOfWeek method, we’ll find out what day of\
    \ the week March 22, 2003 was:\n\n```\n```php\n<?php\n// Include DateMath class\n\
    require_once 'DateTime/DateMath.php';\n\n// Instantiate DateMath class 22nd March\
    \ 2003\n$dateMath = new DateMath(2003, 03, 22);\n\necho '22nd March 2003 is a\
    \ ' . $dateMath->dayOfWeek();\n?>\n```\n```\n\nNote that if we pass TRUE to the\
    \ dayOfWeek method, it will return a numeric representation of the day of the\
    \ week, starting with 0 as Sunday:\n\n```\n```php\necho '22nd March 2003 is day\
    \ ' . $dateMath->dayOfWeek(TRUE) .\n ' of the week.';\n```\n```"
  merge: -1
  img_proc: true
- pgno: 203
  md: "# Week of the Year\n\nTo ascertain the week of the year, we add another method\
    \ to the DateMath class:\n\n```\nFile: DateTime/DateMath.php (in SPLIB) (excerpt)\n\
    \n/**\n * Returns the ISO 8601 week of the year\n * @return int numeric week of\
    \ year e.g. 12\n * @access public\n */\nfunction weekOfYear()\n{\n   return date('W',\
    \ $this->timeStamp);\n}\n```\n\nPutting this into action:\n\n```\nFile: 6.php\n\
    \n<?php\n// Include DateMath class\nrequire_once 'DateTime/DateMath.php';\n\n\
    // Instantiate DateMath class 22nd March 2003\n$dateMath = new DateMath(2003,\
    \ 3, 22, 0, 0, 0);\n\necho '22nd March 2003 is in week ' . $dateMath->weekOfYear()\
    \ .\n     ' of the year';\n?>\n```\n\nBe aware that the weekOfYear method relies\
    \ on PHP's date function, which uses the ISO 8601 notation for weeks[4]. Under\
    \ that standard, the first week of the year is the week (beginning on a Monday)\
    \ that contains the first Thursday of the year. So if, for instance, the last\
    \ two days in December fell on a Monday and a Tuesday, they would actually belong\
    \ to the next year according to this notation.\n\n# Number of Days in a Month\n\
    \nMy memory is terrible and I can never remember how many days a particular month\
    \ is supposed to have. Thankfully, it's not too hard to find out with PHP, where\
    \ we can simply add a daysInMonth method to the DateMath class:\n\n[4] http://www.cl.cam.ac.uk/~mgk25/iso-time.html"
  merge: -1
  img_proc: true
