  md: "But how do we refactor² the above code to take on an object oriented form?\
    \ First, we need a class into which we can place the two functions, addHeader\
    \ and addFooter:\n\n```\nFile: 2.php (excerpt)\n<?php\n// Page class\nclass Page\
    \ {\n    // Generates the top of the page\n    function addHeader($page, $title)\n\
    \    {\n        $page .= <<<EOD\n<html>\n<head>\n<title>$title</title>\n</head>\n\
    <body>\n<h1 align=\"center\">$title</h1>\nEOD;\n        return $page;\n    }\n\
    \n    // Generates the bottom of the page\n    function addFooter($page, $year,\
    \ $copyright)\n    {\n        $page .= <<<EOD\n<div align=\"center\">&copy; $year\
    \ $copyright</div>\n</body>\n</html>\nEOD;\n        return $page;\n    }\n}\n\
    ```\n\nUsing the PHP keyword class, we can group the two functions, addHeader\
    \ and addFooter, within the class. Functions placed inside a class are known as\
    \ **member functions**, or, more commonly, **methods**. Unlike normal functions,\
    \ methods must be called as part of the class:\n\n²Refactoring is the process\
    \ of restructuring code without actually changing what it does. This is usually\
    \ done to ease future maintenance and expansion of the code that would be hindered\
    \ by its current structure."
