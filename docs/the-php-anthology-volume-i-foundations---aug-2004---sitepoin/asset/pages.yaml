  md: 'The great thing about the Pager_Sliding class is that the range of pages it
    displays will change to reflect the page the visitor is currently viewing. As
    your table grows, it remains easy to navigate. This is important when you''re
    dealing with large result sets; if a query returned more than ten pages of results,
    for example, without a “sliding pager” you’d have a very long row of pages to
    display on your Web page, which would be both ugly and difficult to navigate.
    The Pager_Sliding class helps you implement a pager that’s similar to the one
    used by Google[3], where a search often returns hundreds of pages of results.


    # How do I handle HTML forms in PHP?


    > “With great power comes great responsibility.”

    > —Spiderman''s Uncle Ben


    Compared to links and URLs, HTML forms provide a far more powerful mechanism by
    which to accept information from your site’s visitors. Forms allow you to develop
    complex interfaces that, for example, can enable users to select values from a
    dynamically-generated list, enter large bodies of text, and even upload files.
    Forms make possible anything from a simple guest book to an intricate user registration
    and authentication system. But with increased functionality comes a wider range
    of problems. How can you validate a form? What should you do if a form is incorrectly
    completed? How can you populate a form with data from a database? These are just
    a few of the challenges you’ll face as you deal with forms; there are many more.


    **HTTP Request Methods**


    The Internet''s HTTP protocol, commonly used to fetch Web pages, defines a number
    of “methods” that browsers can use to send requests and data to Web servers. Of
    the available methods, the two most important are the GET method and the POST
    method.


    ☐ GET is the “default” method for the Internet, used whenever you request a page
    with your browser. All data in the request must be encoded in the URL.


    ☐ POST is most often used for submitting forms. It allows additional form data
    to be sent with the request.


    HTML lets you specify the method to use for each form tag. Although GET is the
    default, it is most common to use POST, which avoids cluttering the URL with the
    submitted data.


    [3] http://www.google.com/'
