    # How do I upload files with PHP?


    It’s often handy to be able to allow your site members to upload files to the
    site—so that other members can download them, for example. With PHP the solution
    is, as always, very easy. Note that full documentation is available in the PHP
    Manual[7].


    # Setting the Maximum Upload Size


    ![](img/5b6cdf7cf4cf53e30b19e047895dc464_300_0.png)


    PHP has two settings in php.ini that limit the maximum size of file uploads. The
    first, post_max_size, controls the maximum amount of data that can be sent to
    a script with the POST method. By default this is set to eight megabytes. The
    second setting, upload_max_filesize, specifically limits the size of uploaded
    files, and is set to two megabytes by default. It may be necessary to increase
    these two settings if you expect large file uploads.


    See Appendix A for more details.


    If you’re familiar with HTML forms, you’ll already know that the addition of a
    file upload field to a form is a simple matter. You just have to add the attribute
    enctype="multipart/form-data" to the form tag, and add the necessary input tag
    to the form:


    ```

    <input type="file" name="fieldname" />

    ```


    When file upload is submitted to a PHP script, the file is stored safely in your
    Website’s temporary directory (usually /tmp on a Linux system) and is given a
    unique temporary file name, so that your PHP script can make use of it. The information
    about the file is contained in the $_FILES array, along with a key that corresponds
    to the name of the form field (i.e. $_FILES[’fieldname’]. The information is stored
    as another array containing five values:


    ```

    $_FILES[’fieldname’][’name’]

    ```


    the original name of the file'
