  md: "# # Reusable Code\n\nYou've just seen the most simplistic way to connect to\
    \ MySQL. It's often more useful, however, to “package” the above code in a function\
    \ or a class so it can be reused.\n\nAs a function we could have:\n\n```\n<?php\n\
    function &connectToDb($host, $dbUser, $dbPass, $dbName)\n{\n    // Make connection\
    \ to MySQL server\n    if (!$dbConn = @mysql_connect($host, $dbUser, $dbPass))\
    \ {\n        return false;\n    }\n\n    // Select the database\n    if (!@mysql_select_db($dbName))\
    \ {\n        return false;\n    }\n\n    return $dbConn;\n}\n\n$host = 'localhost';\
    \ // Hostname of MySQL server\n$dbUser = 'harryf'; // Username for MySQL\n$dbPass\
    \ = 'secret'; // Password for user\n$dbName = 'sitepoint'; // Database name\n\n\
    $dbConn = &connectToDb($host, $dbUser, $dbPass, $dbName);\n?>\n```\n\nThis reduces\
    \ the process of connecting to MySQL and selecting a database to a single line\
    \ (two if you count the include statement, which would point to a separate file\
    \ containing the connectToDb function):\n\n```\n$dbConn = &connectToDb($host,\
    \ $dbUser, $dbPass, $dbName);\n```\n\nNote that we’ve used the reference operator\
    \ &. This operator and the role it plays were covered in detail in Chapter 2."
  merge: -1
