    \n# Composition\n\nComposition occurs when one object “completely owns” another\
    \ object. That is, the first object was responsible for creating (instantiating)\
    \ the second object. There are many cases in which this can be useful, although,\
    \ typically, composition is used when it’s likely that the first object will be\
    \ the only one that needs to use the second object.\n\nOne example from Volume\
    \ II, Chapter 1 is the Auth class, which **composes** an instance of the `Session`\
    \ class, creating it in the constructor:\n\n```\nclass Auth {\n...\n/**\n * Instance\
    \ of Session class\n * @var Session\n */\nvar $session;\n...\n\nfunction Auth\
    \ (&$dbConn, $redirect, $md5 = true)\n{\n\t$this->dbConn = &$dbConn;\n\t$this->redirect\
