- pgno: 15
  md: '# Preface


    One of the great things about PHP is its vibrant and active community. Developers
    enjoy many online meeting points, including SitePoint Forums[1] where developers
    get together to help each other out with problems they face on a daily basis,
    from the basics of how PHP works, to solving design problems like “How do I validate
    a form?” As a way to get help, these communities are excellent—they’re replete
    with all sorts of vital fragments you’ll need to make your projects successful.
    But putting all that knowledge together into a solution that applies to your particular
    situation can be a problem. Often, community members assume other posters have
    some degree of knowledge; frequently, you might spend a considerable amount of
    time pulling together snippets from various posts, threads, and users (each of
    whom has a different programming style) to gain a complete picture.


    *The PHP Anthology* is, first and foremost, a compilation of the best solutions
    provided to common PHP questions that turn up at the SitePoint Forums on a regular
    basis, combined with the experiences and insights I’ve gained from my work with
    PHP on a daily basis over the last four years.


    What makes this book a little different from others on PHP is that it steps away
    from a tutorial style, and instead focuses on the achievement of practical goals
    with a minimum of effort. To that extent, you should be able to use many of the
    solutions provided here in a more or less “plug and play” manner, rather than
    having to read this book from cover to cover.


    That said, threaded throughout these discussions is a “hidden agenda.” As well
    as solutions, this book aims to introduce you to techniques that can save you
    effort, and help you reduce the time it takes to complete and later maintain your
    Web-based PHP applications.


    Although it was originally conceived as a procedural programming language, in
    recent years PHP has proven increasingly successful as a language for the development
    of object oriented solutions. This was further compounded by the public opening
    in January 2003 of the PHP Application and Extension Repository[2] (PEAR), which
    provides a growing collection of reusable and well maintained solutions for architectural
    problems (such as Web form generation and validation) regularly encountered by
    PHP developers around the world.'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'The object oriented paradigm seems to scare many PHP developers, and is often
    regarded as “off limits” to all but the PHP gurus. What this book will show you
    is that you do _not_ need a computer science degree to take advantage of the wealth
    of class libraries available in PHP today. Wherever possible in the development
    of the solutions provided in this book, I’ve made use of freely available libraries
    that I’ve personally found handy, and which have saved me many hours of development.
    Employing a class developed by someone else is often as easy as using any of the
    built-in functions PHP provides.


    The emphasis this book places on taking advantage of reusable components to build
    your PHP Web applications reflects another step away from the focus of many current
    PHP-related books. Although you won’t find extensive discussions of object oriented
    application design, reading _The PHP Anthology, Volume I: Foundations_ and _Volume
    II: Applications_ from cover to cover will, through a process of osmosis, help
    you take your PHP coding skills to the next level, setting you well on your way
    to constructing applications that can stand the test of time.


    _The PHP Anthology, Volume I: Foundations_, will equip you with the essentials
    with which you need to be confident when working the PHP engine, including a fast-
    paced primer on object oriented programming with PHP (see Chapter 2). With that
    preparation out of the way, the book looks at solutions that could be applied
    to almost all PHP-based Web applications, the essentials of which you may already
    have knowledge of, but have yet to fully grasp.


    # Who should read this book?


    If you have already gotten your feet wet with PHP, perhaps having read Kevin Yank’s
    _Build Your Own Database Driven Website Using PHP & MySQL_ (SitePoint, ISBN 0-9579218-1-0)
    and completed your first project or two with PHP, then this is the book for you.


    Readers with a greater amount of PHP experience may like to skip ahead to _The
    PHP Anthology, Volume II: Applications_ to learn how to put some of PHP’s more
    advanced features to use, and refer back to _Volume I: Foundations_ when they
    need an explanation of a more basic concept.


    # What’s covered in this book?


    Here’s what you’ll find in each of the chapters in this volume:'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Chapter 1: PHP Basics


    This chapter provides a summary of all the essentials you need in order to get
    around quickly in PHP, from how to use the manual, to understanding PHP error
    messages, and how includes work. There are also some tips for writing portable
    code, and we’ll take a look at some of the main PHP configuration pitfalls.


    # Chapter 2: Object Oriented PHP


    The second chapter includes a run-down of PHP’s class syntax, as well as a primer
    that explains how all the key elements of the Object Oriented Paradigm apply to
    PHP. It’s essential preparatory reading for later chapters in this anthology.


    # Chapter 3: PHP and MySQL


    This chapter provides you with all the essentials of MySQL, PHP’s favorite database.
    We start with the basics, covering important topics such as how to avoid SQL injection
    attacks. We then delve more deeply into many lesser known topics, such as MySQL
    FULLTEXT search facilities, how to repair corrupt tables and back up your database,
    and how to avoid writing SQL with PEAR::DB_DataObject. This chapter also serves
    as a “case study” in designing a class to handle connecting to, and the querying
    of, your MySQL database.


    # Chapter 4: Files


    This fourth chapter is a survival guide to working with files in PHP. Here, we’ll
    cover everything from gaining access to the local file system, to fetching files
    over a network using PHP’s FTP client. We’ll go on to learn how to create your
    own zipped archives with PEAR::Archive_Tar.


    # Chapter 5: Text Manipulation


    This chapter covers the essentials of handling content on your site. We’ll discuss
    string functions you can’t live without, along with the process for validating
    and filtering user-submitted content. We’ll look at how you can implement a BBCode
    system, and understand the practicalities involved in preventing cross site scripting
    exploits.


    # Chapter 6: Dates and Times


    Here, you’ll learn how to store dates in your database, and how to use PHP’s date
    functions. We’ll deal with the nuances of handling different time zones, and implement
    an online calendar. We’ll see how easy it is to run batch jobs on your Website
    without access to the command line, and learn how to perform simple script performance
    measurements.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Chapter 7: Images


    This chapter explores the creation of thumbnails, and how to “watermark” images
    on your site. We’ll also discuss how you can prevent hot linking from other sites,
    and produce a few professional charts and graphs with JpGraph.


    # Chapter 8: Email


    In this chapter, we deal specifically with email-related solutions, showing you
    how to take full advantage of email with PHP. We’ll learn to send successfully
    HTML emails and attachments with help from PHP Mailer, and easily handle incoming
    mails delivered to your Web server, using PHP.


    # Chapter 9: Web Page Elements


    The essentials of Web pages and navigation, such as tables with PEAR::HTML_Table,
    are covered here, along with the process for implementing paged result sets. We’ll
    discuss the development of forms with PEAR::HTML_QuickForm, covering in some depth
    the handling of file uploads, and the construction of navigation menus. We’ll
    also take a look at some tricks you can use with Apache to generate search engine
    friendly URLs.


    # Chapter 10: Error Handling


    Understand PHP’s error reporting mechanism, how to take advantage of PHP’s customer
    error handling features, and how to handle errors gracefully in this action-packed
    chapter.


    # The Book''s Website


    Located at http://www.sitepoint.com/books/phpant1/, the Website that supports
    this book will give you access to the following facilities:


    # The Code Archive


    As you progress through this book, you’ll note a number of references to the code
    archive. This is a downloadable ZIP archive that contains complete code for all
    the examples presented in this book.


    Besides the PHP scripts themselves, the archive contains a number of shared libraries,
    which are bundled in the SPLIB directory. In order for the scripts that rely on
    these libraries to work as intended, you’ll need to add this directory to PHP’s
    include_path (see “How do I include one PHP script in another?” in Chapter 1 for
    full details on include_path). Doing this will also make it easier to use these
    libraries in your own projects.'
  merge: -1
  img_proc: true
- pgno: 19
