    \ triggers and constraints, many of which become important for applications with\
    \ complex data structures.\n\nThis chapter covers all the common operations PHP\
    \ developers have to perform when working with MySQL, from retrieving and modifying\
    \ data, to searching and backing up a database. The examples focus on using a\
    \ single table, so no discussion is made of table relationships here. For a full\
    \ discussion of table relationships, see Kevin Yank's Build Your Own Database\
    \ Driven Website Using PHP & MySQL (ISBN 0-9579218-1-0), or see an example of\
    \ them in practice when we deal with user groups in Volume II, Chapter 1.\n\n\
    The examples used here work with a sample database called sitepoint, which contains\
