- pgno: 35
  md: 'PHP’s four include commands should not be confused with the various file-related
    functions (discussed in Chapter 4); these are intended for fetching files without
    parsing them immediately as PHP scripts, thereby allowing you to work on their
    contents.


    Note that throughout this book I’ll be talking about “including” a file even when
    I’m using one of the require commands. This is a common convention for talking
    about PHP that stems from older programming languages used by the first PHP pioneers.


    # Path Finding


    So far, I’ve only looked at including files in the same directory as the script
    that contains the include command. In practice, you’ll usually want to organize
    files into subdirectories based on the job they do. This can be a source of much
    confusion, particularly when you’re using third party code, as there are numerous
    alternative approaches to dealing with includes in other directories.


    The first thing to be aware of is that all includes are calculated relative to
    the directory in which the main script (where execution began) resides. For example,
    imagine we have three files in the following locations:


    /home/username/www/index.php

    /home/username/www/includes/script.php

    /home/username/www/another.php


    First, let’s consider index.php. The command include ''includes/script.php'';
    will correctly include script.php, assuming index.php is the actual file requested.


    But what if we use the following command in script.php:


    ```

    include ''../another.php''; // ???

    ```


    If script.php is the page we’re viewing, this command will correctly include another.php.
    However, if index.php is the page we’re viewing, and it includes script.php, this
    command will fail, because the location of another.php is calculated relative
    to the location of index.php, not relative to script.php.


    We have two choices. We can modify script.php so that it includes another.php
    as follows:


    ```

    include ''another.php'';

    ```'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'Alternatively, we can enter the full path to another.php, like this:


    ```

    include ''/home/username/www/another.php'';

    ```


    This leaves no doubt as to where another.php is located.


    The PHP configuration file php.ini also contains the directive include_path. This
    allows you to specify directories from which files can be included, without the
    need to specify their locations when using one of the include commands.


    This approach needs to be used with caution, as it may lead to strange results
    if an included file of the same name exists in more than one directory, yet it
    can be an effective means to solve include-related headaches. PHP''s PEAR[25]
    class library, for example, relies on your adding the directory that contains
    PEAR''s include files to the include path. Note also that it''s not a good idea
    to specify too many locations in your include path, as this will slow PHP down
    when it tries to find the scripts you''ve included in your code.


    If you''re using Apache in a shared hosting environment, you may be able to override
    the value of include_path using a .htaccess file. Placed in the directory to which
    you want it to apply (it will also apply to all subdirectories), the file should
    contain something like this:


    ```

    php_value include_path ".:/usr/local/lib/php:/home/user/phplib/"

    ```


    The same can also be accomplished with the PHP function ini_set, for example:


    ```

    ini_set(''include_path'', ''C:/phplib'');

    ```


    This allows changes to be made at runtime from within a PHP script.


    You''ll find a reference to php.ini values in Appendix A.


    # How do I write portable PHP code?


    Not all PHP installations are the same. Depending on version and configuration
    settings in php.ini, your script may or may not run correctly on another server
    where PHP is installed. However, there are some general good practices you can
    adopt to make life easier and minimize the need to rewrite code for other servers.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# Keep All Configuration Central


    For most PHP applications, it will be necessary to provide information describing
    the environment in which the script will run, including database user names and
    passwords, directory locations, and so on. As a general rule, try to keep the
    majority of this information in a single place—maybe even a single file—so that
    when the information needs to be modified, you can do it all in the one place.
    That said, when building modular applications, you may want to store elements
    of the configuration that are local to a specific “module” with the module itself,
    rather than centrally.


    How exactly you choose to store this information is a matter of personal choice.
    In some cases, it may be worth considering an XML file or storing some of the
    information in a database. It’s also worth being aware of the `parse_ini_file`
    function, which I’ll explore in Chapter 4.


    A simple but effective mechanism is to place all the settings in a single file
    as PHP constants, which makes them available from any function or class in your
    application. For example:


    ```

    <?php

    // Configuration settings

    define(''DOMAIN'', ''sitepoint.com'');


    // In another script

    echo ''The domain is '' . DOMAIN;

    ?>

    ```


    Constants need to be used with caution, though. To make your functions and classes
    reusable in other applications, they shouldn’t depend on constants of a fixed
    name; rather, they should accept configuration information as arguments. In such
    cases, it’s best to use PHP variables in your central configuration file, which
    you can then pass to functions and classes as required. If you look at Chapter
    3, when connecting to MySQL we can identify a number of variables we need to have
    in a central location: the server host name, the user name, the password, and
    the name of the selected database.


    Using the require_once command we looked at in the previous solution, we can create
    a file called, for instance, config.php, and place it outside the public Web directories.
    This helps ensure that no one accidentally browses to the file containing this
    critical information, which would place the site’s security at risk.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# # Use the Full <?php ?> Tags


    PHP supports a variety of tag styles to mark up sections of PHP code, including
    the short tags (< ? >), and ASP-style tags (< % >). These are controlled from
    php.ini with the settings short_open_tag and asp_tags. While you have these settings
    set to On, other people may not. The short tag style, for example, causes a problem
    when the PHP is mixed with XML documents, which use processing instructions like
    this:


    ```

    <?xml version="1.0"?>

    ```


    If we have a document which contains PHP and XML, and we have the short_open_tag
    turned on, PHP will mistake the XML processing instruction <?xml for a PHP opening
    tag.


    It’s possible that your code will need to run in environments where short_open_tags
    and asp_tags are both off. The best way to be sure that they are is to get into
    the habit of always using the <?php ?> tag style, otherwise there may be a lot
    of code rewriting to do in some dark future.


    # ## register_globals off


    PHP is capable of turning incoming data into native PHP variables. This feature
    is controlled by the register_globals setting in php.ini. With register_globals
    switched on, if I point my browser at an address like http://www.mysite.com/index.php?logged_in=1,
    PHP will automatically create a variable $logged_in and assign it the value of
    1. The PHP group now recommends this setting be disabled because it presents a
    risk to security, as the previous example suggests.


    So, in php.ini make sure the following code is in place:


    ```

    register_globals = Off

    ```


    This will force you to access incoming data via the special predefined superglobal
    variables (e.g. $_GET[''username'']), which means they won’t conflict with variables
    you’ve created in your script.


    Using a .htaccess file with Apache, the same result can be achieved with the following
    code:


    ```

    php_flag register_globals off

    ```'
  merge: -1
  img_proc: true
- pgno: 39
  md: "Further information can be found in the PHP manual[26], and in Kevin Yank's\
    \ article, Write Secure Scripts with PHP 4.2![27] on SitePoint.\n\n# # Magic Quotes\n\
    \nMagic quotes is a feature intended to help prevent security breaches in sites\
    \ developed by PHP beginners.\n\nIt adds escape characters (see Chapter 5 for\
    \ more information) to incoming URL query strings, form posts, and cookie data\
    \ automatically, before your script is able to access any of these values. Should\
    \ you insert the data directly into your database, there's no risk of someone\
    \ being able to tamper with the database provided magic quotes functionality is\
    \ switched on.\n\nFor beginners, this is certainly a useful way to prevent disasters.\
    \ However, once you understand what SQL injection attacks are, and have developed\
    \ the habit of dealing with them in your code, the magic quote functionality can\
    \ become more of a problem than it's worth.\n\nMagic quotes functionality is controlled\
    \ by a PHP configuration setting, magic_quotes_gpc, which can be either on or\
    \ off.\n\nMy own preference is to always have magic quotes switched off, and deal\
    \ with escaping data for SQL statements myself. Unfortunately, this means the\
    \ code I write won't port well to PHP installations where magic quotes is switched\
    \ on (I'll end up with backslashes in my content). Thankfully, to deal with this\
    \ problem, PHP provides the function get_magic_quotes_gpc, which can be used to\
    \ find out whether magic quotes are switched on. To keep the code in this book\
    \ portable, we'll use a simple file that strips out magic quotes, should the functionality\
    \ be enabled:\n\n```\n<?php\n/**\n * Checks for magic_quotes_gpc = On and strips\
    \ them from incoming\n * requests if necessary\n */\nif (get_magic_quotes_gpc())\
    \ {\n    $_GET    = array_map('stripslashes', $_GET);\n    $_POST   = array_map('stripslashes',\
    \ $_POST);\n}\n```\n\n[26] http://www.php.net/registerglobals\n[27] http://www.sitepoint.com/article/758"
  merge: -1
