    The addTag function defined here is a very simple “search and replace” function
    that helps us add HTML markup to text. In this example, the string “general-purpose”
    in the text is wrapped with a b tag, producing the following output:


    ```

    PHP (recursive acronym for "PHP: Hypertext Preprocessor") is a

    widely-used Open Source <b>general-purpose</b> scripting

    language that is especially suited for Web development and can

    be embedded into HTML.

    ```


    Other functions, such as str_replace, can be used to perform similar tasks. It
    might have been easier in the above example to use the following approach:


    ```

    File: 4.php

    <?php

    $text = <<<EOD

    PHP (recursive acronym for "PHP: Hypertext Preprocessor") is a

    widely-used Open Source general-purpose scripting language that

    is especially suited for Web development and can be embedded

    into HTML.

    EOD;


    $word = ''general-purpose'';


    echo str_replace($word, ''<b>'' . $word . ''</b>'', $text);

    ?>

    ```


    This achieves exactly the same result as the first example.


