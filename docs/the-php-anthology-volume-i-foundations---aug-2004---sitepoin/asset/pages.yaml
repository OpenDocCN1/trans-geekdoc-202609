  md: "This displays the entire file as we did using `readfile`, and produces the\
    \ display shown in Figure 4.3. This example is meant more as a simple demonstration\
    \ of file handles in action. Notice that when we use `fread`, the second argument\
    \ is the size in bytes from the start of the file which should be read. For this\
    \ argument, I've used the `filesize` function, which tells me the total size of\
    \ the file. In general `fread` is really only useful for reading a limited portion\
    \ of a file; to fetch a complete file it will usually be more efficient to work\
    \ with `file_get_contents` or `file`, depending on your needs.\n\n# Saving Memory\n\
    \nWhat you've seen so far is fine for small files. However, an argument that's\
    \ similar to that applied to the use of queries like `SELECT * FROM table` also\
    \ applies to reading files; if you use `file` or `file_get_contents` to read a\
    \ large file, PHP will be forced to fill a lot of memory with its contents.\n\n\
    To solve this problem, a different approach can be used to read the contents of\
    \ a file, read the file in stages, and operate on the contents as you go. This\
    \ approach uses functions like `fgets`:\n\n```\n<?php\n// Open the file handle\
    \ for reading\n$fp = fopen('demo/writeSecureScripts.html', 'r');\n\n// Loop until\
    \ the end of the file\nwhile (!feof($fp)) {\n    // Get a chunk to the next linefeed\n\
    \    $chunk = fgets($fp);\n    echo $chunk;\n}\n\n// Close the file handle!\n\
    fclose($fp);\n?>\n```\n\nThe connection is opened as normal. Next, we use a while\
    \ loop, which continues so long as the `feof` function returns FALSE. `feof` returns\
    \ TRUE if the end of the file has been reached, or if there's an error with the\
    \ file handle (such as a loss of connection, which can happen with remote files)."
