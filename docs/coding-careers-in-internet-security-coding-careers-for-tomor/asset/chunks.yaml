    program called PC-Write. When users installed the program on their machine, it
    deleted all the files on their system. This program was the first known Trojan.


    ![](Images/page_18-1.jpg)


    Robert Morris built one of the first pieces of malware ever. It was called the
    Morris worm.


    These early examples of malware were effective. However, they did not cause widespread
    damage. There were three main reasons for this. First, few people owned personal
    computers (PCs) at that time. Second, few organizations had computer networks.
    Third, the internet (or, more precisely, the ARPANET) was used mainly by government
    officials and academics.


    That changed in the 1990s. It was during this period that companies began building
    and selling PCs to regular consumers, computer networks became more popular among
    businesses and other organizations, and the internet and related software like
    web browsers and email programs became available for the public to use.


    As more people got online, email quickly became a popular way for hackers to spread
    malware. One example of this was the Melissa virus that swept the internet in
    1999. It worked like this: A computer user received an email message with a Microsoft
    Word document attached. When the user opened the document, it infected the person’s
    computer with the virus. The virus then scanned the infected system to determine
    whether it had the Microsoft Outlook email program installed. If so, the virus
    located the Outlook email address book and forwarded itself to fifty of the user’s
    contacts. Although the Melissa virus didn’t exactly damage the infected computer,
    it did generate lots of network traffic— so much that it caused many networks
    to crash.


    One year later, another malware program, called the I Love You virus, caused even
    more problems. It acted exactly like the Melissa virus, except that instead of
    forwarding itself to the first fifty contacts in an infected machine’s Outlook
    address book, it forwarded itself to everyone—and also deleted random files. The
    I Love You virus quickly infected an estimated fifty million machines and caused
    between $5 and $15 billion worth of damages worldwide.


    MODERN MALWARE ATTACKS


    The twenty-first century has seen more damaging malware attacks. One of these
    occurred in 2017. This attack used a malware program called WannaCry. It exploited
    a security flaw in certain versions of the Microsoft Windows operating system
    to lock down computers worldwide. The hackers behind this attack demanded that
    affected users pay a ransom to retrieve their data or lose it forever. Fortunately,
    Microsoft quickly issued a patch for the security flaw. A patch is a piece of
    code meant to fix, or patch up, a security flaw in an operating system or other
    computer program. Software makers distribute patches by releasing updates to their
    software. More important, security experts also discovered a kill switch in the
    malware program to stop it from spreading. This helped limit the number of computers
    affected and the damage done—although it was still significant.


    Another 2017 malware attack called NotPetya proved far more destructive. NotPetya
    exploited the same security flaw as WannaCry but lacked a kill switch. NotPetya
    was designed to spread quickly. One security expert called it “simply the fastest
    propagating piece of malware we’ve ever seen.” But that’s not all. After NotPetya
    infected a system, it worked extremely quickly to disable it. It took down the
    entire network of a large bank in Ukraine in just forty-five seconds! At first,
    it seemed that NotPetya was ransomware like WannaCry. It even displayed a screen
    demanding a ransom payment. However, soon it became clear to investigators that
    its purpose was to permanently destroy the contents of every system it infected.
    Investigators also discovered that it had likely been unleashed by Russia as an
    act of cyber war against Ukraine and its allies—opening a “new era of warfare”
    that involves “undermining democracy, wrecking livelihoods by targeting critical
    infrastructure and weaponizing information,” said British defense secretary Gavin
    Williamson.


    As discussed, not all malware attacks involve destroying computer systems. Some
    hackers craft malware with another aim: to steal the data on a compromised system.
    This might include private customer information, trade secrets on a business system,
    or classified information on a government system. In one incident in 2016, a group
    of hackers called the Shadow Brokers accessed machines maintained by the US National
    Security Agency—the organization responsible for ensuring cybersecurity in the
    United States. The Shadow Brokers then stole top-secret hacking tools that the
    agency had developed and released them on the dark web. The dark web is a corner
    of the internet that allows for completely anonymous communications and mostly
    traffics in illegal goods, including malware. These tools could “undermine the
    security of a lot of major government and corporate networks both here and abroad,”
    said one security expert.


    A new type of malware attack is called crypto-jacking. This involves infecting
    machines with malware that secretly “mines” digital money, called crypto currency.
    When someone spends crypto currency, the transaction is entered into a secure
    ledger called a blockchain. The blockchain approves transactions using a complex
    algorithm—an operation that requires lots of processing power. To increase the
    processing power available to the blockchain, people can connect their computers
    to it in exchange for a small payment issued in crypto currency. This practice
    is called crypto-mining. So, with crypto-jacking, malware installed on a user’s
    machine connects the machine to the blockchain—but sends the payment to the hacker
    who installed it. This can be quite profitable if the hacker infects enough machines.

