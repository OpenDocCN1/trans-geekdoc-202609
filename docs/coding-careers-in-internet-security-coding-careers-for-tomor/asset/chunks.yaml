  trans: '

    worm A type of malware that spreads by self-replicating. Unlike a virus, a worm
    doesn’t need to attach itself to a program or file to spread. It can spread all
    on its own.


    Further Information


    BOOKS


    Briggs, Jason R. Python for Kids: A Playful Introduction to Programming. San Francisco,
    CA: No Starch Press, 2012.


    McCue, Camille. Coding for Kids. 2nd edition. For Dummies. Hoboken, NJ: John Wiley
    & Sons, 2019.


    Minnick, Chris, and Eva Holland. JavaScript for Kids. For Dummies. Hoboken, NJ:
    John Wiley & Sons, 2015.


    Sande, Warren, and Carter Sande. Hello World!: Computer Programming for Kids and
    Other Beginners. 2nd edition. Shelter Island, NY: Manning Publications, 2013.


    Saujani, Reshma. Girls Who Code: Learn to Code and Change the World. New York:
    Viking Books for Young Readers, 2017.


    WEBSITES


    CERT


    [`www.us-cert.gov`](https://www.us-cert.gov)


    Keep track of emerging cyber threats and other cybersecurity news on this site.


    CYBER DEGREES


    [`www.cyberdegrees.org`](https://www.cyberdegrees.org)


    This site offers a comprehensive directory of career paths, free online security
    courses, and more.


