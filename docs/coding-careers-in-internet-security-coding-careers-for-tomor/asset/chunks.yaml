- raw: 'Security audits are conducted by security auditors and vulnerability assessors.
    People in these roles identify security flaws in a system or network—not by breaking
    into a system the way a penetration tester does, but by examining the system and
    using their knowledge of common security flaws to identify possible weaknesses.
    In a similar vein, a source code assessor scours the source code behind an organization’s
    computer systems for bugs or other security weaknesses.


    Progressing up the career ladder are jobs like security manager, security director,
    and chief information security officer (CISO). People in these jobs focus more
    on developing security strategies and managing others than on using their own
    coding skills.


    For organizations that employ people to fill all these roles, a cyberattack or
    security breach is less likely but not unheard of. That’s where incident responders
    and forensic experts come in. Incident responders (also called intrusion analysts)
    are like cyber firefighters. Their job is to put out the fire when a security
    incident occurs. Forensic experts are digital detectives. They gather and analyze
    the electronic evidence on computer systems, networks, and devices after an attack
    to identify the attack’s type and source. Some forensic experts work within large
    organizations. Others are on the payroll of government or law enforcement agencies.


    INDUSTRIES ASSOCIATED WITH INTERNET SECURITY


    Coders who specialize in internet security work in many industries. These include
    the government, health care, manufacturing, retail, and banking.


    Working in internet security for the government can be particularly gratifying.
    For one thing, these government jobs are usually stable. That means people aren’t
    likely to lose their jobs. They also offer good benefits and on-the-job training.
    Plus, these jobs give cybersecurity experts an opportunity to serve their country.
    However, pay for government and military positions may be less than for comparable
    positions in businesses or organizations outside the government.


    Several US agencies employ cybersecurity professionals. These include the NSA,
    the CIA, the Department of Homeland Security (DHS), and the FBI. Cybersecurity
    professionals also work in the four major military branches: the US Air Force,
    the US Army, the US Marine Corps, and the US Navy. In addition to these, several
    businesses that do contract work for the US government employ cybersecurity professionals.
    These include companies like General Dynamics, Booz Allen Hamilton, Raytheon,
    and Endgame, Inc.


    Given the shortage of cybersecurity professionals in the federal government, these
    agencies are eager to hire people. According to the DHS website, one of its “highest
    priorities is to acquire, grow, and sustain the most talented people in cybersecurity.”
    This does not mean they hire everyone, however. Most jobs require the applicant
    to pass a background check. Some even require a security clearance. A security
    clearance gives the holder access to confidential or even classified information.


    ![](Images/page_50-1.jpg)


    The US military has lots of jobs for coders who specialize in internet security—and
    will even train them on the job.


    Another industry with a growing need for cybersecurity professionals is health
    care. In fact, today, the health-care industry is the most targeted industry among
    hackers. The main reason for this is that more and more health-care providers
    have begun using electronic medical records. These records contain information
    about a patient’s health as well as identifying information such as their name,
    address, birthdate, and Social Security number. According to one security expert,
    these records “are a treasure trove of personally identifiable information that
    makes health-care institutions and their partners irresistible targets for cybercriminals.”
    Hackers typically target electronic medical records to steal a patient’s identity.
    But hackers could also alter these records to physically harm patients—for example,
    by changing the ordered dose of a prescription drug.


    ![](Images/page_51-1.jpg)


    The increased use of electronic medical records has made the health-care industry
    a prime target for cyberattackers.


    The National Security Agency


    The NSA was formed in 1952 to track communications for intelligence purposes.
    This is referred to as signal intelligence (SIGINT). Today, the NSA also works
    to combat cybercrime. To achieve this, the NSA employs more cybersecurity professionals
    than any other organization in the United States. Their primary role is to protect
    and defend national computer security systems, including networks that contain
    classified information. One way they do this is by developing new methods to encrypt
    information. This means dreaming up new secret codes and ciphers. By working to
    keep classified information safe, NSA programmers help ensure the country’s national
    security.


    The NSA is also believed to build malware for cyber warfare purposes. An example
    of this was the Stuxnet worm. This worm was discovered in 2010. It was allegedly
    made by coders working for the Israeli and American governments. Security experts
    outside the NSA say the worm infected computers in Iran that ran the country’s
    nuclear centrifuges. Code inside the worm caused the centrifuges to spin too quickly.
    Thousands of the centrifuges broke. According to one expert, Stuxnet set back
    Iran’s attempts to build a nuclear weapon by two years. “This was nearly as effective
    as a military strike,” the expert said, “but even better since there are no fatalities
    and no full-blown war.”


    Students who find these or any other jobs at the NSA appealing can apply for an
    internship. (For more information, see [https://www.intelligencecareers.gov/nsa/nsastudents.html](https://www.intelligencecareers.gov/nsa/nsastudents.html).)


    Despite these dangers, health-care organizations have been slow to secure their
    systems—in part because many of these systems are old and outdated. This helps
    explain why health-care organizations experienced more than 1,300 security breaches
    between 2009 and 2015, exposing more than 150 million electronic health records
    to hackers. That’s almost half the population of the United States! Pressure to
    protect private patient information (as well as the health of their patients)
    will no doubt drive health-care organizations to adapt—and fast. That means hiring
    coders who specialize in internet security to develop ways to protect health-care
    systems.


    In addition to stepping up strikes against health-care organizations, hackers
    have increased attacks against manufacturing facilities. In fact, manufacturing
    is the secondmost targeted industry among hackers. An attack against a manufacturing
    facility might not give someone access to much private information for use by
    identity thieves. However, it could result in the theft of trade secrets or intellectual
    property, like blueprints (which hackers could sell to the manufacturer’s competitors
    or use to create knockoffs) or other sensitive information. It could also wreak
    havoc on any computerized machines that manufacture merchandise. For example,
    an attack could cause the machines to shut down or result in the production of
    defective or even dangerous products. This could lead to costly recalls—not to
    mention ruined reputations. Such an attack could even cause injuries or deaths—for
    example, if a computerized manufacturing machine were to explode or produce a
    faulty product that resulted in the user’s injury or death. No manufacturer can
    afford such attacks, meaning they’ll need to hire cybersecurity professionals
    to prevent them.'
