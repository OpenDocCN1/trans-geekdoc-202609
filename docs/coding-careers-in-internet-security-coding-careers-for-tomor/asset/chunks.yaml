- raw: 'The open source model is particularly well suited for the area of internet
    security. The practice of using open source software in this context is called
    open security. According to open source advocate David A. Wheeler, open security
    is effective because “defenders working together to eliminate and remediate vulnerabilities
    are likely to be far more effective than if they work in isolation.” In addition
    to collaborating to make software more secure, “defenders” can also unite to build
    more effective anti-malware programs. As security expert Kevin Keeney explains,
    to combat “today’s increasingly wily cyber adversary,” coders “need to be moving
    in the direction of open source projects that enable us to collaborate and fight
    as a team.”


    One organization devoted to the promotion of open source code is the Open Web
    Application Security Project (OWASP). In its own words, OWASP is a “worldwide
    notfor- profit charitable organization focused on improving the security of software.”
    This nonprofit organization distributes reading materials and tools to help people
    who want to use the open source approach to improve the security of their computer
    programs. (For more information, see [https://www.owasp.org](https://www.owasp.org).)


    LEGISLATIVE AND GOVERNMENTAL EFFORTS TO STOP HACKERS


    Creating secure programs and building anti-malware software are two ways to combat
    cybercrime. A third way is to pass laws to deter hackers.


    American lawmakers introduced the first law to combat computer crime in 1977.
    This law was called the Federal Computer Systems Protection Act. However, this
    law did not pass—perhaps because lawmakers lacked an understanding of computers
    and how they might be used for criminal purposes.


    In 1983, a top FBI agent testified in Congress that a computer could be used in
    much the same way as “a gun, a knife, or a forger’s pen” to commit a crime. This
    testimony helped prompt the passage of the Computer Fraud and Abuse Act of 1984—the
    first US federal law to fight computer crime. Since then, US lawmakers have passed
    several more cybercrime laws.


    To enforce cybercrime laws and improve cybersecurity, the US government has created
    several divisions within key government agencies. These include the Computer Emergency
    Response Team, the Office of Cybersecurity and Communications, the Cyber Crimes
    Center, the National Cyber Investigative Joint Task Force, the National Security
    Cyber Specialist network, and the National Security Cyber Assistance Program,
    to name a few. Many of these government divisions hire computer coders to help
    stop hackers.


    US cybersecurity laws largely deal with criminal acts against organizations. They
    do not dictate whether or how organizations protect their computer systems or
    networks against attack. This is unfortunate. The failure of an organization to
    properly secure its systems can have grave consequences for everyday Americans
    if their data is stolen by hackers. However, one US government agency, the National
    Institute of Standards and Technology (NIST), has developed guidelines for securing
    computer systems. These guidelines are called the NIST Cybersecurity Framework.
    They are designed to help businesses and other organizations prevent and protect
    against cyberattacks, detect cyberattacks, and respond to and recover from cyberattacks.


    ![](Images/page_42-1.jpg)


    The FBI is just one government agency that hires coders who specialize in internet
    security. Here, an FBI agent works in a computer forensics lab.


    The European Union (EU), a group of countries in Europe working together, has
    taken a much stricter approach to ensuring the security of computer systems and
    networks. In 2016 it passed a law called the General Data Protection Regulation
    (GDPR). This law requires companies that collect private customer data to explain
    in simple terms how they handle it. The law also requires companies to take reasonable
    steps to protect private data and to report a data breach within a prescribed
    period of time. It’s important for coders who specialize in internet security
    to be aware of these laws (or lack thereof)—especially coders whose job is to
    secure applications and networks that host private data.


    ![](Images/page_44-1.jpg)


    Hackers are constantly trying to break into secure places online. This perpetuates
    the need for internet security experts.


    ![](Images/page_45-1.jpg)


    chapter\_04


    Jobs in Internet Security


    There is much need for computer coders in the twenty-first century. The US Bureau
    of Labor Statistics has predicted a 24 percent increase in the number of computer-coding
    jobs between 2016 and 2026. The median salary for these jobs is more than $100,000
    per year—well above the national average salary. It’s no wonder *US News & World
    Report* ranked software developer as the number one best job in the United States
    in 2018!


    AN INCREASING DEMAND FOR CYBERSECURITY CODERS


    If coders are highly sought-after, coders who specialize in internet security
    are even more desired. There are various reasons for this. One reason is that
    cybercrime is increasing. In 2010, there were 3.8 million recorded security breaches.
    In 2016, there were almost one hundred times that many breaches, 3.1 billion.
    It seems extremely likely the number of breaches will continue to grow. Another
    reason coders are highly sought after is that hackers are releasing more and more
    types of malware. As noted earlier, Kaspersky Lab detected more than fifteen million
    pieces of malicious code in 2017. Much of this malware is relatively unsophisticated—the
    work of young hackers and other amateurs. However, some of it is very complex—not
    to mention dangerous.


    Finally, there just aren’t enough cybersecurity specialists to go around. According
    to a 2018 report released by the Information Systems Audit and Control Association
    (ISACA), more than half of all organizations say it takes at least three months
    to fill open cybersecurity positions—and more than one-quarter of organizations
    say they are unable to fill these positions at all. In the coming years this shortage
    is likely to increase unless more people join the field. Experts predict that
    by 2022 there will be 1.8 million more cybersecurity jobs than there are cybersecurity
    professionals to fill them.


    The US federal government is expected to be hardest hit by this shortage of cybersecurity
    professionals. This will put the nation at greater risk of cyberattack. As one
    security expert put it, “The greatest virtual threat today is not statesponsored
    cyberattacks, newfangled clandestine malware, or a hacker culture run amok. The
    most dangerous looming crisis … is instead a severe cybersecurity labor shortage.”


    Simply put, young people who are interested in specializing in internet security
    will have many opportunities to succeed!


    JOBS IN INTERNET SECURITY


    While three jobs in internet security have already been mentioned—security software
    developer, cryptographer, and penetration tester—there are many other opportunities
    out there. Some other cybersecurity jobs involve building secure computer systems
    and networks. Examples of these jobs are security architect and security engineer.
    A security architect decides which approach an organization will take to protect
    its computer systems. He or she then designs and implements a framework to achieve
    protection. As for building and maintaining this framework, a security engineer
    does that job.


    Other jobs in internet security pertain to assessing and maintaining the security
    of existing systems. Examples of these jobs include security analyst and security
    specialist. People in these positions perform a variety of tasks to assess and
    maintain the security of a system, such as conducting audits and implementing
    security measures. Some of these tasks could involve coding, while others might
    not.'
