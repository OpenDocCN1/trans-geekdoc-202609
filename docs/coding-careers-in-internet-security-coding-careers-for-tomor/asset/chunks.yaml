- raw: 'These are just a few examples of recent malware attacks. There have been millions
    of others. In fact, chances are, thousands of attacks are happening right now.


    THE DANGERS OF BUGS


    Malware poses the most serious threat to security. But it isn’t the only one.
    Other threats stem from computer bugs, or problems.


    Some bugs open pathways for malware to enter a system. However, others create
    different security problems. One example was the Y2K bug in 1999. Early coders
    frequently used two digits to represent a year (for example, 06/17/88) instead
    of four (06/17/1988). As the year 2000 (commonly called Y2K) approached, people
    worried that computers might interpret two-digit year entries in computer code
    incorrectly. For example, they thought computers might translate the date 01/01/00
    to January 1, 1900. They feared that this would cause some computers and networks
    to crash. Experts warned that if this were to happen to computer systems that
    managed air traffic or the power grid, the results could be catastrophic. Some
    people even predicted it would cause a complete breakdown of society, or even
    bring about the end of the world. Fortunately, thanks to feverish (and costly)
    efforts by computer coders to fix the bug in systems worldwide, its effects were
    minimal.


    ![](Images/page_24-1.jpg)


    US president Bill Clinton delivers a speech about Y2K in 1998.


    EARLY EFFORTS TO SECURE THE INTERNET


    Early computer users gave little thought to internet security. This was because
    few people used the internet or understood how it could be abused.


    The release of the Creeper worm in 1971 gave an early clue to potential security
    problems on the internet. It also resulted in what’s believed to be the first
    example of an anti-malware program, Reaper. Reaper was built by the same computer
    coders who released Creeper. It moved from machine to machine to find and delete
    all instances of Creeper on the network. (Interestingly, Reaper was technically
    a virus, but it was one designed for good.)


    As malware became more complex and advanced, so did the anti-malware tools to
    fight it. Many of these were built by coders working for internet security companies
    in the late 1980s. Several security companies that still exist today started during
    this period. These include Symantec, Sophos, McAfee, Avast, and Panda Security.
    All of these companies employed (and continue to employ) computer coders to combat
    cybercrime.


    Around the same time, informal groups of coders formed to combat malware. One
    of these was an online group called VIRUS-L. It started in 1988. Its members—which
    included some of the biggest names in internet security today, like Eugene Kaspersky,
    who started Kaspersky Lab in 1997— discussed new viruses and possible ways to
    detect and eliminate them. More formal groups like the Computer Antivirus Research
    Organization (CARO) and the European Institute for Computer Antivirus Research
    (EICAR) started to conduct further research into malware, and other security topics
    soon followed.


    Contributions of Computer Coders to Secure Internet Shopping


    Before the 1990s, people usually bought items at stores near to where they lived.
    If the item they needed or wanted wasn’t available, they might be able to order
    it from a printed catalog. However, more often they just went without and found
    something else to fill their need.


    The internet changed all that. During the mid-1990s, entrepreneurs launched e-commerce
    sites, where people could buy and sell items online. Thanks to sites like Amazon
    and eBay (which both launched in 1995), it became possible to research, locate,
    and buy just about anything from just about anywhere— often for less money.


    None of this would have been possible without computer coders who specialized
    in internet security. These coders developed tools to allow secure connections
    between buyers and sellers. This prevented hackers from intercepting payment information
    such as credit card numbers. Without secure connections, electronic financial
    transactions of any kind would be impossible. So, the next time you buy something
    online, thank a computer coder!


    ![](Images/page_27-1.jpg)


    Amazon was among the first major e-commerce sites ever created.


    INTERNET SECURITY TODAY


    Advancements in technology bring new challenges for computer coders who specialize
    in internet security. For example, innovations like mobile technologies, cloud
    computing, and the Internet of Things have created new attack venues for hackers.
    It’s up to security coders to manage these threats—while at the same time fend
    off attacks on more traditional targets.


    It won’t be enough to simply respond to attacks. As members of a society that
    is increasingly connected and reliant on technology, internet security specialists
    will need to be proactive— anticipating attacks and preventing them before they
    occur. Only by preemptively blocking threats before they do damage can the “good
    guys” win.


    ![](Images/page_28-1.jpg)


    Today, anti-malware programs are helping to keep technology like cell phones virus-free.


    The Internet Security Arms Race


    Each time a “bad” computer coder unleashes a new malware program on the internet,
    “good” computer coders quickly respond with an antidote. Without these good coders
    to help combat malware, the internet and the millions of computers that connect
    to it would likely cease to operate. However, there’s a downside: this constant
    back and forth has devolved into an arms race of sorts. With each attack and counterattack,
    an escalation occurs. Bad coders release even more destructive malware for an
    even greater impact.


    This challenge is further complicated by the fact that making and distributing
    malware can be very profitable. According to Carbon Black, a cybersecurity company,
    some malware makers make more than $100,000 a year selling their software on the
    dark web—compared to $69,000 a year on average for legitimate software developers.
    The Federal Bureau of Investigation (FBI) estimated that in 2016 hackers collected
    $1 billion alone in payments to unlock ransomware.


    “There’s a bad-guy industry,” says one security expert. “It’s very profitable.”
    So, “the good-guy industry has to be better than they are.” That’s the challenge
    for good coders who specialize in internet security: to be better than the bad
    coders who build malware.


    ![](Images/page_30-1.jpg)


    Often, malware programs have a sort of “digital fingerprint.”


    ![](Images/page_31-1.jpg)


    chapter\_03


    Coding to Combat Cybercrime


    In 1987, a famous computer scientist named Fred Cohen observed that “there is
    no algorithm that can perfectly detect all possible computer viruses.” A computer
    algorithm is an equation or a series of steps that allows a computer to complete
    a task or solve a problem. Cohen was correct. This explains why anti-malware programs
    approach detecting and destroying malware differently.


    TRADITIONAL MALWARE-DETECTION STRATEGIES


    Most traditional anti-malware programs identify malware by searching for signatures
    in computer files or transmissions. A signature is a string of information in
    a piece of code that can be used to identify the code—like a fingerprint. Many
    malware programs have distinct signatures. When an antimalware program detects
    one of these signatures, it knows to delete the code.


    To prevent anti-malware software from detecting signatures, some hackers encrypt
    their code. This is called obfuscation. Before the encrypted code can run on the
    target machine, however, it must be decrypted. Often the code used to decrypt
    the malicious code—called a decryptor—has a signature all its own. So, although
    anti-malware software might not be able to detect the signature of the encrypted
    code, it can sometimes detect the signature of a decryptor.'
