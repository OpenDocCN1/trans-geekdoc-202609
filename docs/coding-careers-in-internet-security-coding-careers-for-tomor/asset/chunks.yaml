    ## COLLEGE COURSEWORK AND MOOCS FOR CYBERSECURITY SPECIALISTS


    Cybersecurity jobs do not necessarily require a college degree. It’s possible
    to acquire the skills for these jobs in other ways—for example, online, at a community
    college, or in the military. However, people who earn college degrees in computer
    science will have more opportunity for higherpaying jobs in cybersecurity from
    the beginning.


    To help college students prepare for a career in cybersecurity, the NSA has developed
    a special program that has been adopted by several universities nationwide. It
    is called the National Centers of Academic Excellence in Cyber Operations (CAE-CO)
    program. According to the NSA, this program “is a deeply technical, inter-disciplinary,
    higher education program” that provides “a particular emphasis on technologies
    and techniques related to specialized cyber operations.”


    ![](Images/page_64-1.jpg)


    The GenCyber Camp, offered by the NSA and the NSF, provides free training for
    kids who are interested in coding.


    Students who enter a CAE-CO program (or equivalent) might be eligible for a scholarship
    from the National Science Foundation in conjunction with the US Department of
    Homeland Security. This scholarship is called the Scholarship for Service. It
    gives qualified students a stipend, or set amount of pay, of up to $20,000 per
    year for undergraduate studies. (Scholarships for graduate and doctoral studies
    are also available.) In return, students must accept a government position in
    the area of cybersecurity—for example, at the NSA or CIA—for a set period of time
    after their schooling is complete.


    Some universities and other educational institutions offer classes in computer
    science even for people who aren’t enrolled. These are called massive online open
    courses (MOOCs). These courses are usually free and are often taught by top professors.
    Here are a few popular MOOCs worth checking out:


    • Future Learn Introduction to Cybersecurity


    • Massachusetts Institute of Technology Introduction to Computer Science and Programming


    • Springboard Foundations of Cybersecurity


    NASA’s Cybersecurity and Privacy Division


    ![](Images/page_66-1.jpg)


    NASA has its own cybersecurity division. They help keep company computers and
    projects safe, including those in the flight control room, shown here.


    No organization is safe from the dangers of malware and hackers—not even ones
    that operate in space! The US National Aeronautics and Space Administration (NASA)
    found this out the hard way in 2012 when hackers in China broke into their systems
    and accessed sensitive files. This breach caused members of the US Congressional
    Committee on Science, Space, and Technology to observe that “the threat to NASA’s
    information security is persistent and ever changing. Unless NASA is able to continuously
    innovate and adapt, their data, systems, and operations will continue to be endangered.”


    To secure its systems from outside attack by hackers and other malicious types,
    NASA formed the Cybersecurity & Privacy Division (CSPD). Coders and other cybersecurity
    specialists in this division run penetration tests to check NASA systems for vulnerabilities
    and perform other important security-related tasks. The cyber professionals who
    work in the CSPD don’t just ensure the safety of critical computer systems—some
    of which cost millions of taxpayer dollars to build. They also guarantee that
    blueprints for space shuttles and other technologies don’t fall into the wrong
    hands—not to mention keeping astronauts who rely on these systems during training
    and space travel safe.


    ## CYBERSECURITY CERTIFICATIONS


    Aspiring cybersecurity professionals can earn various professional certifications
    or credentials. These offer proof to potential employers that the professional
    knows their stuff. Obtaining certifications or credentials usually involves taking
    a class and/or passing an exam.


    There are several certifying organizations. One of these is called Global Information
    Assurance Certification (GIAC). This organization was formed in 1999 to validate
    the skills of security professionals. GIAC offers certification in such cybersecurity
    specialties as incident handler, forensic examiner, penetration tester, and reverse
    engineering malware.


    Whether you’re interested in building malware or securing systems against threats,
    in attending college or learning how to code in some other way, one thing is clear:
    for young people interested in pursuing a career in cybersecurity, the sky is
    the limit!


    ## Glossary


    algorithm A well-defined procedure that enables a computer to complete a task
    or solve a problem.


    anti-malware A computer program that prevents a malware program from penetrating
    a computer system and that scans computer systems to detect and delete any malware
    that sneaks through.


    artificial intelligence (AI) The science and engineering behind “intelligent”
    machines.


    bug An error or flaw in a computer system or program (usually in its source code)
    that causes it to behave in an unintended way. Bugs often open a pathway for malware
    to exploit the system.


    cipher A secret way of writing, such as a code.


    cloud computing Using computers on the internet to run software or services rather
    than using one’s own “local” computer.


    emulator A virtual computer environment that operates within a regular computer
