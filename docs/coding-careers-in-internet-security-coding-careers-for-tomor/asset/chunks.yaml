  trans: '

    -   [开源模型](https://www.owasp.org)特别适合互联网安全领域。在该领域使用开源软件的实践被称为开源安全。根据开源倡导者大卫·A·维勒（David
    A. Wheeler）的说法，开源安全之所以有效，是因为“协同工作以消除和修复漏洞的防御者可能比孤立工作的防御者更有效”。除了协作使软件更安全外，“防御者”还可以团结起来构建更有效的反恶意软件程序。正如安全专家凯文·基尼（Kevin
    Keeney）所解释的，为了对抗“当今日益狡猾的网络对手”，程序员“需要朝开源项目的方向发展，以便我们能够协作并团结作战”。


    一个致力于推广开源代码的组织是开放式应用程序安全项目（OWASP）。按照其自身的话，OWASP 是一个“面向全球的非营利性慈善组织，专注于改善软件安全”。该非营利组织分发阅读材料和工具，帮助希望采用开源方法以提升其计算机程序安全性的用户。（更多信息请参见[`https://www.owasp.org`](https://www.owasp.org)）。


    LEGISLATIVE AND GOVERNMENTAL EFFORTS TO STOP HACKERS


    创建安全程序和构建反恶意软件软件是应对网络犯罪的两种方式。第三种方式是通过立法来威慑黑客。


    美国立法者于 1977 年提出了第一部打击计算机犯罪的法律，名为《联邦计算机系统保护法》（Federal Computer Systems Protection
    Act）。然而，该法案未通过——可能是因为立法者不了解计算机及其可能被用于犯罪的方式。


    1983 年，一位 FBI 高级特工在国会作证称，计算机可以像“枪支、刀具或伪造者的笔”一样用于犯罪。此次作证促成了 1984 年的《计算机欺诈与滥用法》（Computer
    Fraud and Abuse Act of 1984）——美国首部打击计算机犯罪的联邦法律。此后，美国立法者陆续通过了多部网络犯罪法律。


    为执行网络犯罪法律并提升网络安全，美国政府在关键机构内设立了多个专门机构。这些机构包括计算机应急响应团队（Computer Emergency Response
    Team）、网络安全与通信办公室（Office of Cybersecurity and Communications）、网络犯罪中心（Cyber Crimes
    Center）、国家网络调查联合任务组（National Cyber Investigative Joint Task Force）、国家安全网络专家网络（National
    Security Cyber Specialist network）以及国家安全网络援助计划（National Security Cyber Assistance
    Program），仅举几例。许多这些政府机构招聘计算机编码员，以帮助遏制黑客。


    美国网络安全法律主要针对针对组织的刑事行为。它们并不规定组织如何保护其计算机系统或网络免受攻击。这很遗憾。组织未能妥善保护系统可能会对普通美国人造成严重后果，如果数据被黑客窃取。然而，美国国家标准暨技术研究所（NIST）已制定了计算机系统安全指南，称为
    NIST 网络安全框架（NIST Cybersecurity Framework）。该框架旨在帮助企业和其他组织防止和保护免受网络攻击、检测网络攻击，以及应对和从网络攻击中恢复。


    ![](img/page_42-1.jpg)


    FBI 只是一家招聘专精互联网安全的程序员的政府机构。这里，一名 FBI 特工在计算机取证实验室工作。


    欧洲联盟（EU），一个欧洲国家合作的集团，对确保计算机系统和网络的安全采取了更为严格的措施。2016 年，它通过了一部名为《通用数据保护条例》（General
    Data Protection Regulation，GDPR）的法律。该法规要求收集私人客户数据的公司以简单易懂的方式说明其如何处理这些数据。此外，该法规还要求公司采取合理措施保护私人数据，并在规定期限内报告数据泄露。对于专精互联网安全的程序员而言，了解这些法律（或缺失的法律）至关重要，尤其是那些负责保护处理私人数据的应用程序和网络的程序员。


    ![](img/page_44-1.jpg)


    黑客不断尝试入侵线上安全场所。这种持续的尝试凸显了对互联网安全专家的需求。


    ![](img/page_45-1.jpg)


    chapter_04


    互联网安全职业


    21 世纪对计算机编码员的需求巨大。美国劳工统计局预测，2016 年至 2026 年间，计算机编码岗位的数量将增长 24%。这些岗位的中位年薪超过 10 万美元，远高于全国平均水平。这也解释了*《美国新闻与世界报道》*在
    2018 年将软件开发人员评为美国最佳职业！


    日益增长的网络安全编码需求


    如果编码员备 to be highly sought-after（备受追捧），那么专精互联网安全的编码员需求更高。原因有多种。其一是网络犯罪日益猖獗。2010
    年记录了 380 万次安全泄露，而 2016 年则激增至近三十亿次（约 100 倍）。可以预见泄露数量将继续增长。另一个原因是黑客不断推出更多种类的恶意软件。如前所述，卡斯佩斯基实验室（Kaspersky
    Lab）在 2017 年检测到超过十五百万种恶意代码。其中大部分恶意软件相对简单——由年轻黑客及其他业余爱好者编写。但也有部分极其复杂且危险的恶意软件。


    最终，网络安全专业人才严重不足。根据 2018 年信息系统审计与控制协会（ISACA）发布的报告，超过半数的组织表示，填补空缺的网络安全职位至少需要三个月，而超过四分之一的组织则完全无法填补这些职位。除非更多人加入该领域，否则这一短缺在未来将继续扩大。专家预测，到
    2022 年，网络安全职位将比可供填补的网络安全专业人员多出 180 万个。


    美国联邦政府预计将受到这一网络安全专业人才短缺的影响最大。这将使国家面临更大的网络攻击风险。正如一位安全专家所言，“当今最大的虚拟威胁并非国家支持的网络攻击、新型隐蔽恶意软件或失控的黑客文化。最危险的潜在危机……反而是严重的网络安全劳动力短缺。”


    简单来说，对互联网安全感兴趣的年轻人将有大量成功机会！


    JOBS IN INTERNET SECURITY


    如前所述，已提及三个互联网安全职业——安全软件开发人员、密码学家和渗透测试员。实际上，还有众多其他机会。一些其他网络安全职业涉及构建安全的计算机系统和网络。例如，安全架构师（security
    architect）和安全工程师（security engineer）。安全架构师决定组织保护其计算机系统的整体方案，随后设计并实施保护框架。而负责构建和维护该框架的则是安全工程师。


    其他互联网安全职业则关注评估和维护现有系统的安全性。例如，安全分析师（security analyst）和安全专家（security specialist）。这些职位的人员执行多种任务，以评估和维护系统的安全，如进行审计和实施安全措施。部分任务可能涉及编码，而其他任务则不涉及。


