- raw: 'The importance of the internet cannot be overstated. “As a nation, we are
    dependent on the internet,” says the US National Security Agency (NSA). Businesses
    and other organizations, including government agencies, use the internet constantly.
    And every day, people use the network to shop, bank, and communicate. “We all
    count on having ready access to the internet and its many capabilities,” says
    the NSA.


    ![](Images/page_8-1.jpg)


    Today, coders can find jobs in many places. Some internet security jobs are found
    at the Pentagon.


    This makes the internet particularly attractive to hackers. Hackers are computer
    users who break into a computer system, usually to steal personal information
    stored on a computer.


    Some hackers are motivated by profit. Their goal is often to steal personal data
    from computer users and use this information to apply for credit cards or loans.
    This practice is called identity theft. They achieve this by breaking into business
    systems to steal customer data or by accessing the machines of individual users
    to search for sensitive information. Hackers who do this are often called cybercriminals.


    Other hackers want to create chaos. They often do this by infecting computer systems
    with programs called malware. Malware is short for malicious software. It is a
    type of computer program built by hackers whose purpose is to damage or exploit
    a computer system in some way. Malware attacks can be very damaging. For example,
    a cybercriminal could hurt the economy by attacking business systems. Or a cybercriminal
    could shut down the electrical grid by attacking a power company’s computer systems.
    Both scenarios could result in serious social unrest!


    Then there are the hackers who have a more nationalistic aim. These hackers might
    breach a computer system of a foreign government to gain insight into military
    activities or foreign policy. They might even shut down a government computer
    system as an act of war. These hackers are often called cyberterrorists.


    Computer coders who specialize in internet security can help prevent these types
    of cyberattacks. These cybersecurity professionals make the internet—and the world—safer.


    CODING JOBS IN INTERNET SECURITY


    Coders who specialize in internet security have several job options available
    to them. One of these positions is a security software developer. A security software
    developer builds programs that secure computer systems against cyberattacks. An
    example of a security program is an anti-malware program. Anti-malware programs
    prevent malware from entering a computer system. Anti-malware programs also scan
    computer systems to detect and delete any malware that may have sneaked through.


    Public Key Encryption


    ![](Images/page_10-1.jpg)


    Whitfield Diffie (left) and Martin Hellman (right) were some of the first pioneers
    of encryption.


    Encryption is an important weapon against hackers. It is a way of protecting information
    by scrambling it. Many computer systems use a method called public key encryption
    to protect private communications. This method was developed during the 1970s
    by a professor of electrical engineering at Stanford University named Martin Hellman
    and a graduate student named Whitfield Diffie.


    Before Hellman and Diffie, only the US government used encryption. In fact, the
    NSA discouraged the study of encryption by academics. The New York Times reported,
    “There was very little published material about modern methods \[of encryption\]
    and much was classified.”


    Despite this, Hellman and Diffie began work on their own encryption system in
    1974. By 1976, they had made what became known as the Diffie—Hellman key exchange—
    one of the first public key encryption protocols. This system was both simple
    and almost impossible to crack. It allowed people to safely communicate over a
    network with total privacy. After its release, the NSA threatened to prosecute
    Hellman and Diffie, but eventually let it go.


    Without Hellman, Diffie, and other computer scientists interested in encryption,
    the internet might never have taken hold. Certainly, common online activities
    like shopping and banking would be impossible. Thanks to Diffie and Hellman’s
    work, “the Internet has become a place of commerce and communication” and is “a
    safe place to exchange goods and services,” says Wired magazine.


    Another job for coders who specialize in internet security is a cryptographer.
    A cryptographer develops ciphers, or codes, to encrypt sensitive information on
    a computer system. That way, even if a hacker successfully breaks into a computer
    system, that person can’t read the information stored there. Some cryptographers
    work for government agencies like the NSA or the Central Intelligence Agency (CIA).


    ![](Images/page_12-1.jpg)


    Coders who specialize in internet security have all sorts of job options! This
    woman is scrolling through code at her job.


    A third job in internet security is working as a penetration tester, or white-hat
    hacker. A penetration tester breaks into a computer system the same way a hacker
    does. The difference is that the penetration tester does it to help an organization
    find security flaws in their computer systems—not to steal information from or
    damage those systems. This practice is called ethical hacking.


    These are just three of the jobs available to coders who specialize in internet
    security. However, there are many more to choose from and explore.


    ![](Images/page_14-1.jpg)


    Norton is just one example of an anti-malware program. It helps manage program
    security.


    ![](Images/page_15-1.jpg)


    chapter\_02


    How Coders Have Improved Internet Security


    Computer coders improve internet security in two main ways. One is by building
    software to block malware. The other is by designing computer systems with minimal
    security flaws to prevent malware or hackers from accessing these systems. In
    both cases, malware is the chief threat.


    THE THREAT OF MALWARE


    There are several types of malware. Some are merely annoying. Others are extremely
    dangerous. On the annoying end is adware. Adware causes pop-up advertisements
    to appear on a user’s screen. A more dangerous type is spyware. Spyware can scan
    a system for personal information, track


    the user’s internet activity, and detect what the user types on the keyboard—including
    the usernames and passwords the user employs to access various internet accounts.
    Other dangerous types of malware change or erase system files; wreck the system’s
    hard drive; or create another way into the system, which a hacker can use to take
    it over completely. Then there’s ransomware. It locks down a system until the
    user pays a ransom.


    Some varieties of malware have a different purpose altogether: to disable computer
    systems. These are called viruses and worms. Much like a biological virus attaches
    itself to a living host, a computer virus attaches itself to a program or file
    on a computer system. When the host program or file is run, the virus makes a
    copy of itself. The copy then attaches itself to another program or file. When
    that program or file runs, the malware self-replicates again, and so on, until
    the system contains so many copies of the virus it runs out of resources to handle
    them all. Like a virus, a worm spreads by self-replicating. However, unlike a
    virus, which requires a program or file to be run in order to spread, a worm can
    spread all on its own.


    Malware generally infects a computer system using one of two methods. One method
    involves detecting security flaws in a computer system and using these flaws to
    access it. Security flaws are usually the result of bugs. A bug is an error or
    flaw in a computer system or program (usually in its source code) that causes
    it to behave in an unintended way. This often opens a pathway for malware to exploit
    the system. Malware that uses a security flaw to infect a computer system is sometimes
    called a zero-day exploit.'
  fmt: '

    The importance of the internet cannot be overstated. “As a nation, we are dependent
    on the internet,” says the US National Security Agency (NSA). Businesses and other
    organizations, including government agencies, use the internet constantly. And
    every day, people use the network to shop, bank, and communicate. “We all count
    on having ready access to the internet and its many capabilities,” says the NSA.


    ![](Images/page_8-1.jpg)


    Today, coders can find jobs in many places. Some internet security jobs are found
    at the Pentagon.


    This makes the internet particularly attractive to hackers. Hackers are computer
    users who break into a computer system, usually to steal personal information
    stored on a computer.


    Some hackers are motivated by profit. Their goal is often to steal personal data
    from computer users and use this information to apply for credit cards or loans.
    This practice is called identity theft. They achieve this by breaking into business
    systems to steal customer data or by accessing the machines of individual users
    to search for sensitive information. Hackers who do this are often called cybercriminals.


    Other hackers want to create chaos. They often do this by infecting computer systems
    with programs called malware. Malware is short for malicious software. It is a
    type of computer program built by hackers whose purpose is to damage or exploit
    a computer system in some way. Malware attacks can be very damaging. For example,
    a cybercriminal could hurt the economy by attacking business systems. Or a cybercriminal
    could shut down the electrical grid by attacking a power company’s computer systems.
    Both scenarios could result in serious social unrest!


    Then there are the hackers who have a more nationalistic aim. These hackers might
    breach a computer system of a foreign government to gain insight into military
    activities or foreign policy. They might even shut down a government computer
    system as an act of war. These hackers are often called cyberterrorists.


    Computer coders who specialize in internet security can help prevent these types
    of cyberattacks. These cybersecurity professionals make the internet—and the world—safer.


    CODING JOBS IN INTERNET SECURITY


    Coders who specialize in internet security have several job options available
    to them. One of these positions is a security software developer. A security software
    developer builds programs that secure computer systems against cyberattacks. An
    example of a security program is an anti-malware program. Anti-malware programs
    prevent malware from entering a computer system. Anti-malware programs also scan
    computer systems to detect and delete any malware that may have sneaked through.


    Public Key Encryption


    ![](Images/page_10-1.jpg)


    Whitfield Diffie (left) and Martin Hellman (right) were some of the first pioneers
    of encryption.


    Encryption is an important weapon against hackers. It is a way of protecting information
    by scrambling it. Many computer systems use a method called public key encryption
    to protect private communications. This method was developed during the 1970s
    by a professor of electrical engineering at Stanford University named Martin Hellman
    and a graduate student named Whitfield Diffie.


    Before Hellman and Diffie, only the US government used encryption. In fact, the
    NSA discouraged the study of encryption by academics. The New York Times reported,
    “There was very little published material about modern methods \[of encryption\]
    and much was classified.”


    Despite this, Hellman and Diffie began work on their own encryption system in
    1974. By 1976, they had made what became known as the Diffie‑Hellman key exchange—
    one of the first public key encryption protocols. This system was both simple
    and almost impossible to crack. It allowed people to safely communicate over a
    network with total privacy. After its release, the NSA threatened to prosecute
    Hellman and Diffie, but eventually let it go.


    Without Hellman, Diffie, and other computer scientists interested in encryption,
    the internet might never have taken hold. Certainly, common online activities
    like shopping and banking would be impossible. Thanks to Diffie and Hellman’s
    work, “the Internet has become a place of commerce and communication” and is “a
    safe place to exchange goods and services,” says Wired magazine.


    Another job for coders who specialize in internet security is a cryptographer.
    A cryptographer develops ciphers, or codes, to encrypt sensitive information on
    a computer system. That way, even if a hacker successfully breaks into a computer
    system, that person can’t read the information stored there. Some cryptographers
    work for government agencies like the NSA or the Central Intelligence Agency (CIA).


    ![](Images/page_12-1.jpg)


    Coders who specialize in internet security have all sorts of job options! This
    woman is scrolling through code at her job.


    A third job in internet security is working as a penetration tester, or white‑hat
    hacker. A penetration tester breaks into a computer system the same way a hacker
    does. The difference is that the penetration tester does it to help an organization
    find security flaws in their computer systems—not to steal information from or
    damage those systems. This practice is called ethical hacking.


    These are just three of the jobs available to coders who specialize in internet
    security. However, there are many more to choose from and explore.


    ![](Images/page_14-1.jpg)


    Norton is just one example of an anti-malware program. It helps manage program
    security.


    ![](Images/page_15-1.jpg)


