    chapter\_01


    An Introduction to Coding in Internet Security


    Computer coding is the process of designing and building a computer program to
    perform a particular set of tasks. This process is also called computer programming
    or software development. Early computer coders used punch cards to build computer
    programs. It worked like this: a coder wrote out the data and program instructions
    for the program. The coder (or a helper) then punched holes into a card in a set
    pattern for each piece of data or program instruction. There might be hundreds
    or even thousands of these cards for a given program. The complete set of cards
    for a program was called the source deck. The source deck was fed into a machine
    called a compiler. The compiler converted the program instructions into a special
    language called machine language and produced a new stack of cards with holes
    punched through them called the program deck. This was the program. A computer
    operator could insert a program deck into a computer to perform the task the program
    was built to complete.


    COMPUTER CODING AS A CORE COMPETENCY


    Today, coders build programs by typing program instructions into a computer text
    file. These instructions are called source code. Program instructions are written
    in one of several programming languages. In most cases, coders feed the source
    code into a computer program called a compiler. The compiler converts the source
    code into a program. There are literally millions of computer programs designed
    to perform all sorts of tasks.


    ![](Images/page_6-1.jpg)


    Here is an example of modern computer code.


    Computer coding used to be a special skill that few people knew how to do. Today,
    it is a core competency for young people—like reading, writing, or math. This
    is because more and more jobs require computer-coding skills.


    COMPUTER CODING AND INTERNET SECURITY


    Computer coders work in many different industries. Some work in health care. Others
    work in manufacturing, communications, or transportation. Still others work in
    the military or in government agencies. Some computer coders specialize in an
    area called internet security or cybersecurity. A US Department of Defense division
    called the Advanced Research Projects Agency (ARPA) developed the internet during
    the 1960s—except they called it the ARPANET. At first, the ARPANET consisted of
    only four linked computers—three in California and one in Utah. Today, the internet
    connects billions of computers around the globe.'
