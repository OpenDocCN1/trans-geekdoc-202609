    Online retail stores and banks are two other top targets for hackers—and have
    been since the early days of the internet. There are obvious reasons for this:
    these types of firms maintain extensive databases with private customer data and
    information about financial transactions. Not surprisingly, most of these organizations
    are further along in their efforts to secure themselves against hackers. Still,
    they have a continuing need for cybersecurity professionals on their staff.


    ![](Images/page_54-1.jpg)


