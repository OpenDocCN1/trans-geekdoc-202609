- raw: 'As a counterattack, hackers developed new methods to encrypt and decrypt malware.
    One of these methods involves the use of oligomorphic code. Oligomorphic code
    includes multiple decryptors, each one capable of decrypting the malware. When
    the malware runs, it chooses one of these decryptors at random. Having multiple
    decryptors makes it harder for anti-malware software to detect a signature.


    Other methods include polymorphic code and metamorphic code. With both these types
    of code, the decryptor mutates as the code runs (although in slightly different
    ways). This makes it almost impossible for antimalware programs to detect their
    signatures—which means new detection methods are needed.


    NEXT-GENERATION MALWARE-DETECTION METHODS


    In the twenty-first century, coders who specialize in internet security have developed
    several new methods to detect malware. These are often described as next-generation
    methods.


    One next-generation method is generic decryption. With generic decryption the
    anti-malware program loads all new program files into an emulator. An emulator
    is like a second virtual computer inside the same physical machine as a “regular”
    computer but isolated from the regular computer’s hard drive and other key resources.
    The emulator scans and runs each new program to detect malware signatures, or
    behaviors that are consistent with malware. If the emulator determines that the
    program is malware, it shuts it down and deletes it. Because the emulator is isolated
    from the regular computer (even though they’re in the same physical machine) the
    malware cannot spread.


    ![](Images/page_33-1.jpg)


    Encryption in some messages is an important tool.


    Some types of anti-malware programs take a similar approach but load new programs
    in a sandbox in the cloud rather than in an emulator on the user’s computer. A
    sandbox is an isolated virtual space for testing software. The cloud refers to
    computers on the internet that host software and services. Users can connect to
    the cloud to run software or services from those computers rather than from their
    own.


    Other next-generation methods use technologies like machine learning (ML). Machine
    learning involves developing algorithms or models to allow machines to learn over
    time. Coders include machine learning models in their antimalware programs to
    detect malware that uses polymorphic or metamorphic code. These models detect
    malware by noticing when a program contains unusual code or behaves in a suspicious
    way. Machine learning can also help identify the person or group who made a piece
    of malware by identifying certain patterns in the code, giving law enforcement
    officials help in the fight against cybercrime.


    Not surprisingly, hackers have also begun using machine learning. Sometimes they
    use it to build sneakier malware programs. Other times they design it to trick
    or confuse machine learning models used by anti-malware programs and cause them
    to make mistakes. This is called adversarial machine learning.


    COMMON CODING LANGUAGES


    Coders build computer programs (including malware and anti-malware) by typing
    program instructions written using a programming language into a computer file.
    These program instructions are called source code. Most source code is run through
    a special computer program called a compiler. The compiler translates the programming
    language in the source code into a machine language that a computer can read.
    (Some source code is designed to skip this step. This code is said to be interpreted.)
    Machine language consists of a series of zeroes and ones. The order in which these
    zeroes and ones appear dictates how the program will behave. The code that contains
    this machine language is called object code.


    There are literally thousands of programming languages. Different programming
    languages have different characteristics. Some programming languages are low-level
    languages. This means they are similar to machine language. They are harder for
    humans to read and learn. Others are highlevel. This means they often use elements
    of human language (like words), have a set structure, and may automate certain
    programming functions. This makes them easier to learn and use. Other characteristics
    of a programming language include whether it has a generic purpose or a specific
    use; whether it is imperative (containing a sequence of specific operations to
    perform to achieve a desired outcome) or declarative (specifying the desired result
    but not the steps needed to achieve it); and so on.


    More on Machine Learning


    Many people use the terms artificial intelligence (AI) and machine learning interchangeably.
    However, they are not quite the same thing. Artificial intelligence refers to
    the science and engineering behind so-called intelligent machines. An example
    of a machine that uses AI is Amazon’s digital personal assistant, Alexa. Another
    example are the chatbots used for customer service on some websites. In contrast,
    machine learning describes the ability of machines to learn through experience
    over time. So, machine learning is a way to achieve artificial intelligence.


    Machine learning represents the cutting edge of cybersecurity. It also embodies
    the strongest defense against malware—especially when used with other security
    methods like scanning for signatures in an emulator or on the cloud. Machine learning
    is uniquely suited for the work associated with combating malware—quickly performing
    routine tasks (such as scanning files) and handling huge amounts of data (to identify
    and categorize the millions of strains of malware on the internet). It does this
    work more quickly and effectively than a human ever could!


    ![](Images/page_37-1.jpg)


    Amazon’s Alexa uses artificial intelligence to communicate and perform requests
    from users.


    Coders who specialize in internet security need not study every programming language.
    This would be impossible. But there are a few they should learn. These include
    the following:


    • JavaScript: JavaScript is an interpreted, imperative, high-level programming
    language. It is frequently used to build interactive web pages and appears in
    the source code for most modern websites. It’s among the most widely used programming
    languages.


    • HTML: Virtually all websites include HTML code. It’s therefore important for
    coders who specialize in internet security to know HTML. This language is very
    easy to learn.


    • Python: Like JavaScript, Python is an interpreted, imperative, high-level programming
    language. Like HTML, it’s easy to learn. Python mimics human language. This makes
    it very popular among less-experienced malware makers.


    • C and C++: C was developed during the 1970s and remains a popular general-purpose
    programming language. C is considered a highlevel language—but not as high-level
    as some others, such as Python. C++ is an updated version of C. It compiles more
    quickly and provides better overall performance.


    ![](Images/page_39-1.jpg)


    There are a few programming languages that students interested in specializing
    in internet security should learn. Here, students are learning different programming
    techniques.


    THE MOVEMENT TO OPEN SOURCE CODE


    In the late 1990s, some software developers began moving from building proprietary
    software (which is owned by a specific person or organization) to using an open
    source model. Open source software’s source code is available to the general public
    to study or even modify. Since its development, open source software has become
    quite popular. This kind of software development encourages collaboration. Because
    more people review and modify open source code, it is almost always stronger and
    more secure than proprietary code. For example, the Linux operating system, which
    is open source, is more secure than both the Windows and MacOS operating systems,
    which are proprietary.'
