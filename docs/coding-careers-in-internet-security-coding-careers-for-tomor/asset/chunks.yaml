- raw: 'Online retail stores and banks are two other top targets for hackers—and have
    been since the early days of the internet. There are obvious reasons for this:
    these types of firms maintain extensive databases with private customer data and
    information about financial transactions. Not surprisingly, most of these organizations
    are further along in their efforts to secure themselves against hackers. Still,
    they have a continuing need for cybersecurity professionals on their staff.


    ![](Images/page_54-1.jpg)


    Many manufacturing plants rely on computers to operate—making them potential targets
    for cyberattacks.


    These are not the only industries at risk of cyberattack and in need of coders
    who specialize in internet security. In truth, all industries are at risk. But
    these industries are among the most commonly targeted by hackers. As such, they
    are the most attractive industries for cybersecurity professionals.


    ![](Images/page_56-1.jpg)


    Many schools, community colleges, and universities offer classes in computer coding.
    This man is learning how to code in his college class.


    ![](Images/page_57-1.jpg)


    chapter\_05


    Getting Involved


    The shortage of computer coders means that people with coding skills are in great
    demand. This is particularly true of coders who specialize in internet security.
    There are far more jobs in this field than there are qualified people to fill
    them.


    WHERE TO START


    If you’re interested in working as a coder in internet security, you should start
    preparing yourself now for that role. Fortunately, there are several resources
    available to help with this. These include online tools to learn how to code (some
    especially for girls), computer science classes for middle school and high school
    kids, and summer camps for coders.


    After high school, you can complete college coursework to better your chances
    of landing a job as a computer coder who specializes in internet security. You
    can also obtain professional certifications.


    ONLINE CODING RESOURCES


    To work as a coder in internet security, you must first know how to code. There
    are lots of online instructional resources for kids who want to learn how to code.
    Here are just a few of them:


    • Code Avengers ([https://www.codeavengers.com](https://www.codeavengers.com)):
    Code Avengers provides robust coding instruction—including courses in computer
    languages like HTML, JavaScript, and Python. Some courses are free; others require
    a paid subscription.


    • Codecademy ([https://www.codecademy.com](https://www.codecademy.com)): Codecademy
    offers several online coding tutorials with easy-to-follow instructions and immediate
    feedback. Like Code Avengers, Codecademy offers some courses free of charge and
    others through a paid subscription.


    • [Code.org](http://Code.org) ([https://code.org](https://code.org)): [Code.org](http://Code.org)
    is a nonprofit whose mission is to give every student in every school the chance
    to explore computer science—the same way they do subjects like biology, chemistry,
    or algebra. To achieve this, [Code.org](http://Code.org) develops coursework for
    schools to use and offers free online coding courses and projects.


    • Khan Academy ([https://www.khanacademy.org/computing/computer-programming](https://www.khanacademy.org/computing/computer-programming)):
    Khan Academy’s mission is “to provide a free, worldclass education to anyone,
    anywhere.” As part of this mission, it offers free classes on computer coding,
    including languages like JavaScript and HTML.


    • Scratch ([https://scratch.mit.edu](https://scratch.mit.edu)): Offered by the
    Massachusetts Institute of Technology (MIT) Media Lab, Scratch provides tons of
    free tutorials and projects to teach coding concepts to kids, ages eight to sixteen.


    • Tynker ([https://www.tynker.com](https://www.tynker.com)): Tynker offers self-paced,
    hands-on, online courses for kids to learn coding at home. Kids start by playing
    with visual code blocks that represent key programming concepts, and progress
    to programming languages like JavaScript and Python.


    CODING RESOURCES FOR GIRLS


    Research shows that 75 percent of high school girls are interested in STEM fields,
    including coding. However, just 0.4 percent of female college freshman say they
    plan to major in computer science. During the 2010s, several organizations formed
    to encourage more girls and women to become coders. Here are a few examples:


    • Girls Who Code ([https://girlswhocode.com](https://girlswhocode.com)): The mission
    of Girls Who Code is to close the gender gap in technology. To achieve this, the
    organization has taught basic coding skills to more than ninety thousand girls
    across the United States. “We’re building the largest pipeline of future female
    engineers in the United States,” says Reshma Saujani, who founded the organization
    in 2012. Apparently, the organization’s methods are effective, as it is “on track
    to achieve gender parity in computer science by 2027,” Saujani reports.


    • Made with Code ([https://www.madewithcode.com](https://www.madewithcode.com)):
    Made with Code was launched by Google in 2014. It combines online activities with
    real-world events to encourage girls to learn to code. The site also features
    interviews with women whose careers involve coding.


    • Black Girls Code ([http://www.blackgirlscode.com](http://www.blackgirlscode.com)):
    Girls and women are underrepresented in careers that involve coding—and African
    American girls and women are even more so. To change this, an African American
    electrical engineer named Kimberly Bryant founded Black Girls Code in 2011. The
    organization’s mission is to “prove to the world that girls of every color have
    the skills to become the programmers of tomorrow” and to “train 1 million girls
    by 2040.”


    CODING CLASSES IN MIDDLE SCHOOLS AND HIGH SCHOOLS


    Experts predict that computing jobs will be among the highest-paying jobs in coming
    years. Yet a 2016 survey by Google showed that just one in four schools teaches
    classes in computer programming. Even if a school does offer such classes, they
    might not count toward a student’s graduation requirements. This discourages many
    students from taking them. Nonetheless, if you’re interested in a career as a
    coder specializing in internet security, you should explore related course offerings
    at your school.


    ![](Images/page_61-1.jpg)


    Reshma Saujani is the founder of Girls Who Code.


    ![](Images/page_62-1.jpg)


    A young student practices her coding skills at school.


    If no courses are offered, consider meeting with school administrators to suggest
    ways to add them—for example, partnering with a nonprofit coding organization
    like [Code.org](http://Code.org). [Code.org](http://Code.org) offers free coding
    resources for schools, including curricula for grades K–12, workshops for teachers,
    and more. (For more information, see [https://code.org/yourschool](https://code.org/yourschool).)
    You could also start a computer coding club or a similar organization.


    Taking instructor-guided coding classes outside school— either online or in person—is
    another option. For example, organizations like Code Wizards HQ and Coding with
    Kids offer online teacher-led classes. Establishments like Sylvan Learning and
    theCoderSchool offer after-school classes.


    CODING CAMP


    Various organizations offer summer camps to teach kids about coding. For example,
    the NSA and the National Science Foundation (NSF) have teamed up since 2014 to
    offer a series of summer day camps called the NSA GenCyber camps. These camps
    are for kids grades K–12 who are interested in coding in general and in cybersecurity
    in particular. They are offered at several sites throughout the country and are
    open to all participants free of charge. (For more information, see [https://www.gen-cyber.com](https://www.gen-cyber.com).)
    Other organizations that offer day camps for coders—although not for free—include
    Codeverse and iD Tech.


    ![](Images/page_63-1.jpg)'
