  \n## 排序算法\n\n这是你在编程中需要学习的最大算法类别之一。这些算法允许你按所需的顺序排列列表。现在的每种编程语言都带有它自己的排序库。然而，学习这些仍然是重要的：\n\
  \n-   `merge sort`\n-   `counting sort`\n-   `heap sort`\n-   `bucket sort`\n- \
  \  `quick sort`\n\n这些算法的知识是不够的。更重要的是知道如何、何地以及何时是必要的。\n\n## 搜索算法\n\n\n\n有两种流行的搜索算法：用于分组数据结构的**广度优先搜索**和用于线性数据结构的**二分查找**。当你需要对已排序的数据集进行高效搜索时，会建议使用二分查找。这里的概念是不断将数据集减半，直到将选项范围缩小到单个项目。该算法的一个常见用例是在杂乱的电影列表中搜索电影名称。该算法通过字符串匹配进行二分查找，以提供正确的结果。\n\
  \n当你需要找到从一个点到另一个点的最短路径时，搜索算法在你的地图中大有用场，特别是当你有很多备选择时。它还被用于在 AI 中创建智能机器人。搜索引擎是搜索算法最大的用户之一，它们在显示结果之前会爬取整个互联网以寻找合适的结果。\n\
  \n## 字符串匹配与解析\n\n作为一名软件程序员，你生活中将解决的最大问题之一就是模式搜索和匹配。为了做到，你需要对以下内容有深入了解：\n\n* 字符串匹配（`KMP\
  \ algorithm`）\n\n`Knuth-Morris-Pratt`（`KMP`）算法适用于需要在长字符串中匹配短模式的实例。一个常见的例子是执行针对关键词的\
  \ `Ctrl+F` 命令。基本上，你所做的是在整个文档中进行关键词模式匹配。\n\n* 字符串解析（`Regular expression`）\n\n你还将学习如何跨越定义的限制进行解析以在开发中验证字符串，特别是在\
  \ Web 开发中解析和匹配 URL。\n\n## 哈希算法\n\n哈希算法是今天最流行的算法之一，特别是当针对某些数据集查找特定的 ID 或键时。通过哈希算法检索的数据通过其唯一索引来标识。在哈希算法出现之前，此类搜索是通过二分和排序搜索算法的组合进行的。\n\
  \n哈希算法帮助你搜索项目列表，以确定特定值是否已经存在。路由器也使用这种算法来识别和存储连接到它的设备的 IP 地址。这样，网络上就不会有两个设备被分配到相同的\
  \ IP 地址。\n\n## 动态规划\n\n动态规划算法通过将复杂问题分解为更小的可识别单元来帮助你解决问题。一旦完成，每个小单元将独立于其他单元被解决，并将解决方案存储在内存中。一旦解决了所有小单元，解决方案将帮助你逐步推导出该算法所需的复杂问题的最终解决方案。\n\
  \n这样想：当你写下 `2+2+2+2+2` 时，你知道答案是 `10`。如果你在末尾添加另一个 `+2`，你会立即计算出答案是 `12`。你如此快地得到 `12`是因为在你的内存中，你已经知道了第一组的答案，所以你只需要添加一组\
  \ `2`。这就是动态规划算法的工作原理。\n\n## 素性检测算法\n\n为了确定某个随机数是否为素数，你可以使用概率方法或确定性方法。这种算法通常用于密码学，特别是加密和解密。它们还被用作哈希表的哈希函数。\n\
  \n## 平方幂\n\n尝试计算 `232`。默认情况下，你必须执行 32 次涉及数字 `2` 的计算。这工作量太大了。然而，通过这种算法，你只需要执行 5 次。这种算法也被称为二进制幂。\n\
  \n在二进制幂中，你可以以 `O(log2N)` 的格式非常快地计算大正整数的幂。我们提供的示例是最简单的之一。二进制幂还可以用于计算方矩阵和多项式幂。\n\n\
  # 第 8 章：使用继承\n\n我们接下来要看的内容是继承。这些比本指南中的其他内容要复杂一点，但此时你已经准备好迎接挑战，并真正处理更高级的内容了。你会发现，当这些继承出现时，我们将看到之前讨论过的\
  \ OOP 语言中的某些美之处，我们实际上可以遍历并复用想要操作的代码部分。在 OOP 语言的所有概念中，最重要的之一就是继承。这个想法将使我们更容易根据代码中另一个\
  \ `class` 的定义来定义一个 `class`。这很有用，因为它让我们有一种更容易创建和维护想要操作的应用程序的方法。它还将为我们提供复用代码功能的机会，并比以前任何时候都更快完成实现。每当我们想要创建一个\
  \ `class` 时，而不是每次都必须从头开始编写全新的数据成员和函数成员，程序员能够指定新 `class` 应该继承代码中已有的 `class` 的成员。这可以比在反复遍历代码时重新定义成员和函数要容易得多。\n\
  \n我们在此基础上进行工作的 `class`（或已有的 `class`）被称为**基类**（`base class`）。然后我们尝试创建的新 `class`，即那个将从基类中获取信息、数据或函数的\
  \ `class`，被称为**派生类**（`derived class`）。我们将通过继承看到的想法是它实现了“是一种”（is a）的关系。例如，它可以处理“哺乳动物是一种动物”的想法；狗是哺乳动物；因此狗是动物。这将在某种程度上简化我们正在处理的过程，但仍然让我们在过程中对所处理的内容有一个良好的理解。\n\
  \n## 继承的访问控制\n\n我们接下来需要看的是访问控制。`derived class` 能够访问 `base class` 中非私有（private）的部分。这意味着，不应被派生类的所有成员函数访问的\
  \ `base class` 成员，我们在执行时也将它们在基类中声明为 `private`。在学习过程中，你会发现 `derived class` 能够继承 `base\
  \ class` 的所有方法。根据我们希望得到的结果，会有几种不同的异常。我们需要记住的某些异常包括：\n\n1. 我们的基类中的**友元函数**（`friend\
  \ functions`）。\n2. 基类中的**重载运算符**（`overloaded operators`）。\n3. 基类中发生的任何**析构函数**（`destructors`）、**构造函数**（`constructors`）以及任何**拷贝构造函数**（`copy\
  \ constructors`）。\n\n我们需要特别注意访问控制出现的一些不同部分。如果我们的基类中存在某些限制，这将对我们正在处理的继承产生一些问题。而子类或\
  \ `derived class` 将在此注意到这一点。\n\n## 继承的类型\n\n在我们在这里时，需要更仔细地观察我们能够处理的继承类型。当我们最初从一个\
  \ `base class` 派生一个 `class` 时，基类有可能通过 `private` 继承、`protected` 继承或 `public` 继承被继承。你使用的继承类型将通过我们上面讨论的访问说明符（`access-specifier`）来指定。\n\
  \n\n\n\n现在，你会发现我们很少使用私有（private）或保护（protected）继承，尽管这样做是可能的。但请注意，过程中会遇到一些问题，而且这些问题处理起来并不容易。\n\
  \n我们最可能使用的方法是公共继承（public inheritance）。尽管公共继承是我们最常用的方式，但我们需要查看在处理不同类型的继承时会发生的一些规则。我们在处理继承时，需要记住的不同规则包括：\n\
  \n### 公共继承 (The Public Inheritance)\n当我们想要从一个公共基类派生新类时，基类（或原始类）中的公共成员将成为派生类的公共成员。同样，基类中的保护成员也将成为我们从它派出的某些派生类的保护成员。\n\
  \n1. 正如我们所推测的，我们会发现基类中的私有成员永远无法从派生类直接访问。\n2. 我们可以通过这里访问它们。\n3. 我们只需要对基类的保护成员和公共成员进行一些调用即可。\n\
  \n### 保护继承 (The Protected Inheritance)\n我们能够使用的种选项是保护继承。当我们想要从一个保护的基类派生新类时，基类的保护成员和公共成员最终将成为我们想要处理的派生类的保护成员。\n\
  \n### 私有继承 (Private Inheritance)\n我们将处理的最后一种继承类型是私有继承。当我们试图从一个私有基类派生新类时，基类的保护成员和公共成员都会进入派生类，但它们会被转换为某些私有成员。\n\
  \n正如我们看到的，所有这些之间都有些不同。这就是为什么我们需要对要使用的继承类型保持小心。如果你处于不同类型的继承中，成员的行为并不总是按照你想要的方式运行。双重检查你处于哪种类型中，并确保设置为正确的类型，以便它能够按照你的要求运行。\n\
  \n# 第 9 章：语法 (CHAPTER 9: Syntax)\n\n语法被称为计算机编程语言的句法和拼写。计算机有其特定的语言，只有当用它能理解的语言进行输入时，它才能执行相应操作。这种语言被称为语法。计算机编程的语法也被定义为一组规则，描述了构成计算机语言中任何元素或已知为结构良好的文档的计算机符号组合。语法编程通常包含像单词一样的字符串；如果这些字符串被正确地合成，就会产生正确且有效的句子。通信流可能会因为程序的不同而有所差异，但语法仍然是程序员与其计算机之间的通信流。它定义了程序应该如何编写和解释，如果程序员没有良好理解程序的语言，就会产生语法错误（Syntax\
  \ error）。\n\n## 语法在计算机编程中的重要性\n语法就是使用计算机可以解释的结构化语言，当用户未能使用计算机可以理解的语言时，会导致错误且编程命令的执行失败。语法也被称为你与计算机之间的桥梁或通信手段。语法的精髓在于能够无地在计算机上工作。\n\
  \n此外，语法的质量让任务变得更容易简单。它也让阅读或理解代码变得更容易。\n\n## 什么是语法错误？\n当字符序列编写不正确，或者编译器或解释器无法理解源代码以生成机器码时，就会发生语法错误。如果存在无效方程，也可能发生这种情况。\n\
  \n## 语法的层次\n\n### 词法语法 (Lexical Syntax)\n词法语法包含了所用编程语言的所有基本符号。在计算机中，字符序列被称为词法元（Lexeme）。然而，词法语法是一种理性的语言，由定义一组词法元的语法规则组成。\n\
  \n### 具体语法 (Concrete Syntax)\n具体语法是一组关于编写表达式、程序和语句以及它们如何被解释的规则。它描述了语言元素是如何显示和编辑的。具体语法描述了程序在程序员看来的样子。\n\
  \n### 抽象语法 (Abstract Syntax)\n抽象语法被定义为通过语法的简单性对特定程序进行的内部表示。语言的实现被称为抽象语法。抽象语法描述了程序在评估器或编译器看来的样子。\n\
  \n## 语法编程的类型 (Types of Syntax Programming)\n有各种语法编程语言，它们都是互不相同的。\n\nProlog 语法和语义是一组描述如何编写和解释\
  \ prolog 程序的规则。Prolog 是一种逻辑和声明式语言；因此，程序员必须以不同的方式思考程序。Prolog 语法是最早创建的语言之一，它在今天与其他语言相比仍然很流行。它已被证明在定理证明、专家系统、项重写、自动规划和自然语言规划等领域非常有用。\n\
  \nPerl 语法从 Bourne Shell（此处原文误为 Bourbe）、Lisp、Smalltalk 等其他语言中借用了语法语言。Perl 语法是一种灵活的语言形式，可以以程序员想要的任何形式进行编辑或操作。Perl\
  \ 语法包含了声明和语句的序列，在 Perl 语言中，每个语句必须以分号结束。它还是一种区分大小写的编程语言，并且不允许 `@`、`$` 或 `%` 等字符和标点。\n\
  \nPHP 语法和语义形成了一组描述如何编写和解释 PHP 程序的规则。PHP 语法开发是为了遵循 C 语法格式，因此它可以用于 Web 开发。\n\nC 语法基本上是程序员在编写\
  \ C 程序时必须记住的一组规则。C 程序由头文件、`main` 函数和程序代码等元素组成。C 是一种区分大小写的语言，因此程序员必须遵循 C 程序的规则以防止语法错误。\n\
  \n所有的 C 语句必须以分号结束，每个 C 指令都应该用小字母编写。C 语言用三种形式的数字表示：整数形式、实数形式和复形式。\n\nC++ 语法是由丹麦计算机科学家\
  \ Bjarne Stroustrup 开发的编程语言，作为 C 编程语言的扩展。C++ 语法用于各种应用领域，这使其成为一种通用语言，并成为国际标准化组织的标准。尽管\
  \ C++ 继承了 C 的大部分语法特征，但与其他语言相比，它提供了更高效的硬件访问和抽象。\n\nJava 语法是描述如何编写和解释 Java 程序的规则。然而，Java\
  \ 衍生自 C 和 C++ 语法。尽管有这些衍生，这些语言之间仍然存在差异：在 Java 中没有可用的变量或全局函数，但有被视为全局变量的数据成员。\n\n\n\
  \nJavaScript 语法是程序员在编写或解释 JavaScript 程序之前必须牢记于心的规则集。`JavaScript` 定义了两种类型，即：被称为字面量的固定值，以及被称为变量的可变值。`JavaScript`\
  \ 字面量是定义固定值如何书写的重要规则，引导这些值的规则如下：\n\n*   数字可以带小数写，也可以不带小数写。\n*   字符串是书写在单引号或双引号之间的文本或单词。\n\
  \n虽然 JavaScript 变量用于存储数据值，但 JavaScript 使用 `var` 关键字来声明变量。`var` 关键字仅表示变量，且变量可以随时更改。\n\
  \nJava 从 `Java 语法` 中衍生了某些特性，并继承了 `Awk` 和 `Perl` 的一些特性。尽管与 `Java 语法` 有些相似之处，但它与 `JavaScript\
  \ 语法` 是完全不同的语言。`JavaScript` 是区分大小写的，程序员在构造语句时必须记住这一点。\n\nPython 语法和语义是一组规定 `Python\
  \ 程序` 如何编写和解释的规则。`Python 程序` 的开发具有很高的可读性，它比其他语言更多、甚至更频繁地使用英语关键词。此外，`Python` 语言与\
  \ `Perl`、`C` 和 `Java 语法` 有一些相似之处，这些语言之间也存在一些区别。然而，一个 `Python 程序`被分为由一个或两个物理行组成的逻辑行。当这一逻辑行结束时，通常是通过换行符标记完成的。\n\
  \n计算机编程中的一行仅包含制表符、空格，以及可能被称为“空行”的注释，空行通常会被 `python 解释器` 忽略。另一方面，物理行是在行结束序列终止的字符序列。`Python\
  \ 语法`使用了被称为关键字的单词，这些单词如下：`false`、`class`、`finally`、`none`、`continue`、`for`、`from`、`global`、`as`、`assert`、`break`\
  \ 等。\n\n`Lua 语法`是一种高级多范式语言，包含了许多用于特定任务执行的指令。`Lua 程序`允许程序员实现命名空间、类和其他特性。`Lua` 简单且灵活；`Haskell\
  \ 语法` 是一种多维语言，以下是它之所以是这样的几个原因。`Haskell 语法` 是一种适用于任何程序的语言，这就是为什么 `Haskell 语法` 被称为通用语言。\n\
  \n除了能够适应任何程序外，它还是一种静态类型语言。`Haskell 程序`分为两个阶段：编译时和运行时。当你的每个变量都有一个指示该变量允许持有的数据类型的类型时，它处于编译阶段。`Java`\
  \ 和 `C 语法` 是静态类型语言的示例。\n\n此外，`Haskell` 允许你创建匿名函数，将其存储在变量中，并作为参数传递给其他函数。`Haskell`\
  \ 语言的函数始终产生相同的结果和值。\n\n## SQL 中的语法\n\n我认为到这里，你已经对语法是什么有了概述。语法简单就是遵循指导编程语言的语法和规则。每种语言都有自己的语法，`SQL`\
  \ 也如此。在 `SQL` 中，每个标点符号、符号、字符都有意义。`SQL` 中的每条命令必须以分号结束。在编写命令时，无论使用 `SQL` 还是其他编程语言，学习并实践都是有效的。\n\
  \n# 第 10 章：创建你的数据库\n\n我认为到这里，你已经对语法是什么有了概述。语法简单就是遵循指导编程语言的语法和规则。每种语言都有自己的语法，`SQL`\
  \ 也如此。在 `SQL` 中，每个标点符号、符号、字符都有意义。`SQL` 中的每条命令必须以分号结束。在编写命令时，无论使用 `SQL` 还是其他编程语言，学习并实践都是有效的。\n\
  \n## 你的第一个数据库\n\n当你创建数据库和表时，可以使用 `SQL` 接口。`SQL` 提供了一个图形界面，可以很容易创建数据库和表。以下是关于如何创建数据库和表的逐步指南。\n\
  \n## 步骤\n\n### 第 1 步：安装 SQL Server Management Studio\n创建数据库和表的第一步是获取软件。该软件由 `Microsoft`\
  \ 免费提供。一些用户偏于本地，而另一些人使用远程。\n\n### 第 2 步：启动 Studio\n当你启动工作室时，软件偶尔会请求服务器。如果你已经有一个现有服务器，你可以选择使用它。启动管理工具就开始了与软件交互的过程。\n\
  \n### 第 3 步：识别数据库文件夹\n在本地或远程建立连接后，会打开一个窗口。在顶部，你可以点击 `+` 图标，这将显示多个元素，包括创建新数据库的选项。\n\
  \n### 第 4 步：创建新数据库\n如第 3 步所述，下拉菜单将显示多个选项，包括创建新数据库的选项。首先，你将根据你的参数配置数据库并提供名称以便于识别。大多数用户倾向于让设置保持默认值。\n\
  \n### 第 5 步：创建你的表\n数据库通常不存储数据，除非创建了行和表形式的结构以保持数据组织良好。表是持有数据的主要存储单元，但最初你必须在插入信息之前创建表。在\
  \ `Databases` 文件夹中，展开窗口，然后右键点击 `Tables` 并选择 `Nee Table`（注：此处原文为 Nee Table 应为 New\
  \ Table）。\n\n### 第 6 步：开发主键\n\n\n\n\n\n主键在数据库中起着至关作用，因为它充当记录编号或 ID，方便在稍后查看页面时进行识别和记忆。因此，强烈建议在第一列创建这些键。实现此操作有许多方法，包括在列字段中输入\
  \ `int` 并取消勾选 `Allow Nulls`（允许为空）来输入 ID。选择工具栏上的主键图标并将其标记为主键。\n\n### 第 7 步：构建表格\n\
  \n表格通常有多个列（也称为字段），每列代表数据条目的一个元素。在创建表格时，你最初对其进行结构化以适应数据目的数量，因此对于每个数据集来说，作为主键至关重要。因此，结构化过程将根据给定的数据集识别每一列。例如，名列、姓列和地址列等。\n\
  \n### 第 8 步：创建其他列\n\n创建完主键列后，你会发现下方出现了更多的列。这些列不是用于主键的，但对于插入其他信息至关重要。因此，请确保为每列输入正确的数据，以避免向表中填充错误信息。在列中，你将输入\
  \ `nchar`（文本数据类型）、用于整数的 `int` 以及用于存储小数的 `decimal`。\n\n### 第 9 步：保存表格\n\n在完成每个字段的内容的创建后，你会发现你的表格由行和列组成。然而，在输入信息之前，你需要先保存表格。这可以通过选择工具栏上的保存图标并为表格命名来完成。在为表格命名时，确保你创建了一个可以与内容\
  \ easily 关联或识别的名称。此外，具有不同表格的数据库应该有不同的名称，以便于识别。\n\n### 第 10 步：添加数据\n\n表格保存后，你现在可以将数据添加到系统中，并为每个字段提供相关信息。不过，你可以通过展开\
  \ Tables（表格）文件夹并尝试查看表格名称是否在列表中来确认表格已保存。如果不在，使用 Table 文件夹刷新表格，你就能看到你的表格。回到表格，右键点击表格，将弹出下拉对话框，并选择\
  \ `Edit Top 200 Rows`（编辑前 200 行）。窗口将显示字段供你添加数据，但请忽略主键，因为它们会自动填充。继续执行相同的过程，直到你在表格中输入最后一条数据。\n\
  \n### 第 11 步：运行表格\n\n完成表格操作后，你必须保存内容以防丢失工作。由于表格已保存，在完成数据输入后点击工具栏上的 `Execute SQL`（执行\
  \ SQL），它将执行将你输入的每条数据填充到列的过程。解析过程可能需要几秒钟，取决于数据量。如果填充过程中出现任何错误，系统将向你显示输入错误的地方。此外，你还可以使用\
  \ `ctrl` 和 `R` 组合键执行所有数据的程序解析。\n\n### 第 12 步：数据查询\n\n在这一步中，你已经创建了第一个数据库和表格，并通过 SQL\
  \ 语言编程成功保存了信息。该数据库现在已功能完备，从今以后你可以在单个数据库中创建更多表格。然而，每个数据库允许的表格数量是有限制的，但许多用户并不担心这条规则。因此，你可以创建你想要的新数据库系统并创建更多表格。最后，你可以对数据进行查询以用于报告或任何相关目的，例如组织或管理目的。通常，对\
  \ SQL 编程有一个通用的了解，特别是将其应用到创建数据库和表格的实践中，可以让你提升学习技能。\n\n## 使用命令行创建你的第一个数据库和表格\n\n你使用\
  \ SQL 命令和语句来创建数据库和表格。对于上述指南，SQL Server Management Studio 同样适用，但使用命令和语句来指示系统执行给定的功能。要构建你的第一个数据库，使用命令\
  \ `SELECT DATABASE (database_name)` 并点击执行按钮。屏幕上的信息应该是“Command(s) completed successfully”，表示你的数据库已创建。\n\
  \n要使用该数据库，运行命令 `USE (database_name)`，这告诉查询窗口运行该数据库。另一方面，创建新表格涉及运行 `CREATE TABLE\
  \ (table_name)`。输入数据遵循命令 `INSERT INTO (table_name), VALUES (table_name),`，同样允许查看你保存的数据并包括命令\
  \ `SELECT * FROM (table_name)`。上述所有命令都是处理不同数据库时至关重要的。因此，学习每个 SQL 命令对于执行程序始终是本质的。\n\
  \n# 第 11 章：使用流行应用程序\n\n机器有不同的应用程序，它们可以独立运行，也可以依赖其他程序（除非触发，否则不会影响其他程序）。当你打开一个应用时，它倾向于执行其核心功能，而不会对其他程序产生干扰。本阶段将讨论作为编程语言工具的流行应用程序，特别是在数据库管理系统中。你应该注意计算机应用程序来自不同的开发者，有些公司会设计多个，例如微软这样的大型。\n\
  \n## 使用 SQLite\n\n与其他数据库管理系统不同，SQLite 是一个关系数据库系统 (RDBMS)，但不是客户端服务器数据库。该软件程序由 Richard\
  \ Hipp 开发并于 2000 年 8 月发布。SQLite 作为嵌入式数据库应用程序至关重要，作为网络浏览器等平台的客户端和本地存储应用程序。因此，它主要被用于数据库引擎，因为它可以轻松绑定到不同的编程语言。因此，它对于操作系统、嵌入式系统和网络浏览器至关重要。\n\
  \n\n\n\nApache OpenOffice 是另一个数据库系统，它是 `OpenOffice.org` 的继者，由文字处理器、电子表格、演示软件、绘图应用程序、数据库管理软件和公式编辑器组成。Apache\
  \ OpenOffice 可以编写不同的文件格式，包括 `Microsoft office`，同时兼容 `Linux`、`Windows` 和 `macOS`。它是\
  \ `Apache Software Foundation` 的产品，最初于 2018 年 5 月发布。此外，它是一种开源办公效率软件，且易于使用，因为它包含了所有其他文件格式，获取后即可立即使用，并受到数千名爱好者的支持。\n\
  \n## 使用 PostgreSQL\n\n`PostgreSQL` 也称为 `Postgre`，另一种免费开源的关系型数据库管理系统（RDBMS），旨在处理从个人计算机到商业用途的大型负载。它专注于扩展性，技术标准主要为\
  \ Mac 用户创建。然而，也提供了 `Linux`、`Windows` 和其他操作系统的版本。`PostgreSQL` 最初于 1996 年 7 月引入市场，由\
  \ `PostgreSQL Global Development Group` 开发。作为一种数据库管理系统，该软件允许事务隔离以及数据处理的原子性和一致性。开发始于\
  \ 1982 年，目前的修改允许用户友好的界面，适合添加对于 `Python`、`JavaScript` 和 `C/C+` 等编程语言至重要的自定义函数。\n\n\
  ## 使用 Adobe ColdFusion\n\n`ColdFusion` 最初于 1995 年发布，是一种主要用于 Web 应用开发的商业软件。它由 `J.\
  \ J. Allaire` 创建并由 `Adobe Systems Incorporated` 增强，作为一种编程语言用于将 `HTML` 页面链接到数据库，并在\
  \ 1996 年包含了 `IDE`。使用 `Adobe ColdFusion` 允许你体验一个充满独特功能的新系统，用于处理不同类型的数据。它伴随着表达丰富且强大的功能，与其他编程语言相比，使现代\
  \ Web 软件的创建和设计效率提高。作为一种数据库管理系统，`Adobe ColdFusion` 允许用户访问简化的数据库，并伴有其他优势，如客户端/服务器管理、代码生成和操作图形等。\n\
  \n## 使用 PHP\n\n`Hypertext Preprocessor`（超文本处理器）是由 `Rasmus Lerdorf` 在 1994 年设计的多用途脚本计算机语言，并于\
  \ 1995 年发布。它之前被称为 `Personal Home Pages`（个人主页），用于开发静态和动态网站以及 Web 应用。由 `PHP` 创建和设计的脚本只能由安装了\
  \ `PHP` 程序的服务器读取和解释。使用 `PHP` 是学习如何编写值的方法之一，这导致了更新版本的 Web 应用开发。`PHP` 运行在 Web 服务器、命令行、客户端图形用户界面上，并受各种\
  \ Web 托管平台的支持。这种方式使用户在使用 `PHP` 工作时能够方便地操作、构建、自定义并拥有自己的扩展。\n\n## 使用 IBM Db2\n\n`Db2`\
  \ 是由 `IBM` 开发的一组服务器等数据库产品，首次于 1993 年发布。它兼容用 `C/C+`、`Java` 和汇编语言编写的 `Linux`、`Windows`\
  \ 和 `UNIX` 操作系统。它支持不同的功能，包括对象关系和非关系型特征，如 `XML`。与 `SQL` 相比，`Db2` 也伴随着表，但包含了对象，例如索引（重要的数据容器），例如，表的表空间。虽然\
  \ `SQL` 是一种关注访问关系型数据库中数据表的标准计算机编程工具；但 `Db2` 家族由数据库、仓库、`BigSQL`、事件存储和面向云的对象（如云端仓库）组成。使用\
  \ `IBM Db2` 允许。\n\n## 使用 Oracle Express\n\n`Oracle Express` 是 `Oracle Corporation`\
  \ 开发于 2004 年发布的 Web 软件。它支持 `Linux`、`Scolaris` 和 `HP-UX` 等不同的操作系统。`Oracle Express`\
  \ 用于现代 Web 应用并包含系统命令。作为用户，`Oracle Express` 对于数据组织至关重要。使用 `Oracle Express` 允许用户访问数据库主页。\n\
  \n## 使用 MariaDB\n\n`MariaDB` 是 2009 年 10 月发布的 `MySQL` 形式的关系管理系统。`MariaDB` 设计为与 `MySQL`\
  \ 高度兼容。然而，由于最近的更新，`MariaDB` 比 `MySQL` 快得多且更安全。此外，你可以整合来自 `MariaDB` 的数据。\n\n## 使用\
  \ MySQL\n\n`MySQL` 是另一种由 `Michael Widenius` 联合创立的利用 `SQL` 编程概念的开源关系型数据库管理系统（RDBMS）。`MySQL`\
  \ 用于 `Facebook`、`YouTube` 和 `Flickr` 等不同的流行网站，以及 `phpBB`、`WordPress` 和 `Drupal`\
  \ 等数据库驱动的 Web 程序。初始版本于 1995 年 5 月发布，用 `C` 和 `C++` 编写。要使用 `MySQL` 数据库，最初需要安装该应用程序。\n\
  \n## 使用 Microsoft Access\n\n`Microsoft Access` 由 `Microsoft` 开发、设计和修改，首次于 1992 年\
  \ 11 月发布。由于它可以链接并访问存储在其他程序和数据库中的数据，该应用程序已普及并主要用于个人使用。`Microsoft access` 仍然受到 `Visual\
  \ Basic for Applications` 和 `ActiveX Data Objects` 的支持。\n\n## 使用 Microsoft SQL Server\n\
  \n`Microsoft` 还整合了 `Microsoft SQL Server`，另一种作为数据存储产品的关系型数据库管理系统。不同的受众在小型和大型面向网络的程序中使用该软件。`Microsoft\
  \ SQL Server` 最初于 1989 年 4 月发布，目前提供不同的版本以适应各种需求，如 `web`、`enterprise`、`express` 和\
  \ `business intelligence`。还存在特殊版本，包括 `azure`、`fast track`、`compact (SQL CE)` 和分析平台系统，以及不连续的版本如\
  \ `MSDE`、`personal edition` 和 `datacenter`。\n\n\n\n\nMicrosoft ASP（活动服务器页）是微软发布的一种计算机语言，用于构建动态网站，尽管它年代久远，且常用于\
  \ 20 世纪 90 年。它被用于 Windows 95 和 98，是一种脚本型计算机编程语言，允许在 HTML 中包含简单的代码并在服务器上运行。ASP 的文件扩展名为\
  \ `.asp`，程序通常被发送到浏览器，尽管也可以进行更改。此外，Microsoft ASP 允许在脚本中使用其他计算机语言，并包含 `Jscript`。尽管是一个较旧的数据库管理系统，但\
  \ ASP 使得使用变得简单，因为可以快速在包含 URL 的在线表单中添加程序代码行。因此，ASP 变得更具交互性，在没有高级编程技能的情况下就能实现结果。与其他数据库编程软件不同，Microsoft\
  \ ASP 允许扩展功能。通过这种方式，它产生了更有效的结果，使其在现代版本中仍在使用中。\n\n## 使用 Microsoft ASP.NET\n\nASP.NET\
  \ 是一种现代的 Microsoft ASP 格式，配合开源的 Web 服务器使用，这些服务器对于设计动态网页的 Web 开发至关重要。该应用程序于 2002\
  \ 年 1 月发布，让程序员能够享受现代 ASP 特性来构建动态网站、程序和应用程序。与 ASP 不同，ASP.NET 更适用于支持多种编程模型，如 `ASP.NET\
  \ web forms`、`MVC`、`web API`、`signalR` 和网页。微软和其他公司创建了用于 ASP.NET 的工具，以获得更高效的产出。该应用程序供所有用户免费下载，安装并启动后即可让您快捷地执行程序。\n\
  \n## 使用 Microsoft Query\n\n微软的数据库管理软件是一种查询工具，它允许用户通过文本字符串示例、文件名和文档列表来获取数据库查询所需的视觉化方法，由于具有示例查询（Query-by-Example）工具，该应用程序的工作原理是允许系统通过\
  \ `SQL` 将输入转换为正式的数据库查询。这样，用户就可以轻松地以数据检索的形式进行强大的搜索，而无需培养 `SQL` 技能或经验。Microsoft Query\
  \ 使用了由 Moshe M. Zloof 在 20 世纪 70 年创建的“示例查询”功能。此外，它还采用了 Microsoft Access 的易用界面，让学习者能够轻松学习和理解关系型数据库管理系统，供小型企业使用。Microsoft\
  \ Query 应用程序也作为嵌入工具在电子表格的 Access 中使用。\n\n# 第 12 章：异常处理\n\n## 什么是 Bug？\n\nBug 一直是程序员能遇到的最讨厌的生物。在程序员眼里，bug\
  \ 就是程序中的错误。这些 bug 可能会导致错误或意想不到的后果。很多时候，bug 在事后是可以修复的。当然，也有一些无法挽回的教训。欧洲的 Ariane 5\
  \ 号火箭在首次发射后一分钟内爆炸。事后调查显示，导航员中的一个浮点数要转换为整数，但该值太大导致溢出。此外，一架直升机在 1994 年坠毁，导致 29 人死亡。调查显示，直升机的软件系统“充满了缺陷”。在\
  \ 2001 年的电影《太空漫游》中，超级计算机 `HAL` 因为程序中两个目标的冲突而杀死了几乎所有的航天员。\n\n在英语中，bug 的意思是缺陷。工程师长期以来使用\
  \ bug 一词来指代机械缺陷。关于 bug 有一个小故事。这里有一段代码：\n\n```\nfor result in range(5):\n    print(result)\n\
  ```\n\n输出：\n```\nSyntaxError: invalid syntax\n```\n\n```\nresult = [12, 24, 36]\n\
  print(result[4])\n```\n\n输出：\n```\nIndexError: list index out of range\n```\n\n\
  ```python\nmix = [\"first\", \"second\", \"third\"]\nprint(mix[1])\n```\n\n输出：\n\
  ```\nNameError: name 'mix' is not defined\n```\n\n```python\nresult = 0\nprint(1\
  \ / result)\n```\n\n输出：\n```\nZeroDivisionError: division by zero\n```\n\n## 调试\n\
  \n修复程序中 bug 的过程被称为调试（Debugging）。计算机程序是确定性的，因此总会有错误。当然，有时长时间无法调试会产生强烈的挫败感，甚至觉得自己不适合开发。其他人会摔键盘，认为电脑在耍弄自己。从我观察来看，即使是最好的程序员在写程序时也会\
  \ bug。只是优秀的程序员对调试更加平和，不会怀疑自己。他们甚至将调试过程视为一种训练，通过知识来更好地理解错误的根源。\n\n实际上，调试有点像侦探。收集证据，排除嫌疑人，留下真正的凶手。收集证据的方法有很多，也有许多工具可用。初学者，你不需要在工具上花费太多时间。通过在程序内部插入\
  \ `print()` 函数，你可以看到变量的状态以及运行的程度。有时，你可以通过将一个指令替换为另一个来测试你的假设，观察程序结果的变化。当排除所有其他可能性后，剩下的就是错误的真实原因。\n\
  \n另一方面，调试也是编写程序的自然组成部分。开发程序的一种方法是测试驱动开发（TDD）。为了让 Python 成为如此方便动态的语言，从编写执行特定功能的小程序开始是一个很好的起点。然后，在小程序的基础上逐渐修改，使程序不断演进，最终满足复杂需求。在此过程中，你不断添加功能，不断修复错误。重要的是，你一直在编写代码。Python\
  \ 的作者本人也喜欢这种编程方式。因此，调试实际上是你编写完美程序的必要步骤。\n\n## 异常处理详解\n\n对于运行时可能发生的错误，我们可以在程序中预先处理。这有两个可能的目的：一个允许程序在中止前执行更多操作，例如提供有关错误的更多信息；另一个是让程序在出错后继续运行。\n\
  \n异常处理还可以提高程序的容错性。以下过程使用了异常处理：\n\n\n\n\n\n需要处理异常的程序被封装在 `try` 结构中。`Except` 解释了当发生特定错误时程序应该如何响应。`Program,\
  \ input()` 是一个用于接收命令行输入的内置函数。`float()` 函数用于将其他类型的数据转换为浮点数。如果你输入一个字符串（例如“P”），它将不会转换为浮点数，而是触发\
  \ `ValueError`，相应的 `except` 块将运行属于它的程序代码。如果你输入 `0`，那么除以 `0` 将触发 `ZeroDivisionError`。这两个错误都由默认程序处理，因此程序不会终止。\n\
  \n异常处理的完整语法如下： \n\n```\ntry:\n    ... (在此处编写代码)\nexcept exception1:\n    ... (在此处编写代码)\n\
  except exception2:\n    ... (在此处编写代码)\nelse:\n    ... (在此处编写代码)\nfinally:\n    ...\n\
  ```\n\n如果在 `try` 内部发生异常，该异常会被分配并执行 `except`。异常会层层检查它是否属于 `exception1`、`exception2`\
  \ 等，直到找到它所属的项，然后执行对应的 `except` 语句。如果 `try` 中没有异常，则 `except` 部分将跳过 `else` 语句的执行。`Finally`\
  \ 是你在最后执行的操作，无论是否发生异常。如果 `except` 后面没有跟参数，则所有异常都将由程序处理。\n\n# 第 13 章：收集你的数据\n\n![00017.jpg](img/00005.jpeg)\n\
  \n我们首先需要看的是如何收集在数据科学中完成此类过程所需的数据。我们需要有机会去审阅并查看我们的数据，弄清楚那里存在哪些我们可以利用的数据，以及等等。但是，要确定从哪里获取这些数据、收集多少，以及什么类型的数据有助于我们更深入地了解客户和行业，这可能是困难的。\n\
  \n在过程中，关于我们使用的数据类型，有多到数不清的选择。我们需要确保挑选的是正确类型的数据，而不是仅仅因为数据存在且看起来是可以处理的就收集它。当我们能够按照需要的方式组织这些内容，并确保我们确实获取了优质数据时（即使它们在最初没有按照我们想要进行组织和结构化），这将是至关重要的。\n\
  \n这就是为什么我们在这个阶段将花一些时间探索我们能利用数据做什么，它将如何满足我们的需求，甚至你可以去哪些地方寻找你想要处理的数据。考虑到这些，我们需要直接深入其中！\n\
  \n## 了解你面临最大的业务问题\n\n![00025.jpg](img/00006.jpeg)\n\n那里有大量数据，如果你对如何处理这些信息没有计划或方向，那么在进行一些搜索后，很快就会发现自己掉进了这些信息的“爱兔子洞”。那里有很多优秀的数据，但如果你只是让它们引导你，而不是在你的面前拥有一条清晰的路径，你将面临许多问题，并且永远无法获得你所需的决策帮助。\n\
  \n如果你已经收集了数据，那么这个问题就不存在了，我们只需要从那里开始。你可以梳理你最大的业务问题，即你想要投入精力关注并解决的问题，然后对那里进行分类，看看你能做出哪些改变，以及从那个大型数据源中你的哪些数据将产生最大的影响。不要让数据引导你，而要有一条清晰的路径，否则你将面临很多问题。不要害怕留留某些数据以后，也不要让那些可能不使用的某些数据拖了你的后腿。在此期间，我们希望专注于获取最好的信息，这将确保你为未来的业务提供动力。即使留下了一些信息也没关系，如果你以后需要，你可能再回来找。\n\
  \n## 寻找数据的地方\n\n当我们考虑想要使用的数据时，需要考虑的下一件事是在哪里寻找和查看我们需要的数据。实际上，有很多不同的地方我们可以寻找，这通常取决于你希望从中获得什么。\n\
  \n但我们必须记住，我们今天收集的大多数数据并不是组织好的或结构化的。做好准备，你将需要采取步骤来确保你的数据按照你喜欢的方式组织，而且从长期来看，它们可能不像你希望的整洁。\n\
  \n当你能够寻找想要的数据时，你会发现你可以从网站（特别是如果你想使用网络爬虫）、社交媒体网站、或者你自己的问卷和焦点小组，以及那些可能收集了信息并在过程中帮助其他公司来获取数据。\n\
  \n你可能会发现，如果你能够从更独特的来源引入数据，这将使你在想要的工作中领先更远。只要你确保数据是高质量的并且确实符合你的需求，它将为你提供别人所没有的数据，并为你提供一些新的模式和见解。\n\
  \n## 数据存储何处？\n\n![00040.jpg](img/00007.jpeg)\n\n我们还需要考虑在过程中我们应该将正在处理的数据存储在何处。在这个过程中你会收集大量数据，你不可能只是让它们在没有目的的情况下闲置，或者不把它们放在安全可靠的地方。特别是当你处理的是你自己的数据、你从问卷和其他地方获得的数据时，这一点尤为真实。\n\
  \n\n\n\n你有许多不同的地方可以根据自己的需求存储这些数据，你选择的位置通常取决于什么方式最适合你。如果你在自己的网络上有足够的存储空间，那么这是一个极佳的起点。这样，数据始终掌握在你手中，既安全可靠，又易于访问。你只需要确保对系统采取一些良好的安全措施，以免最终丢失这些信息并导致无法再次使用。\n\
  \n许多公司决定将数据存放在基于 Web 的存储区域，例如云端。这为信息增加了另一层保护，并能确保你在需要时能够访问这些数据。我们有很多这类存储区域可以供你使用，你会发现某些区域能够很好地满足你的部分需求。无论你的存储需求有多大，你都会发现，在处理这一过程时，存储这些数据将产生翻天覆地的变化，你只需要提前决定你想要使用多少。\n\
  \n知道从哪里找到所需的数据以开始你的数据分析和数据科学项目将至关重要。这将为你之后能够的工作奠定基调，并影响你的项目能取得成功的程度。请确保搜索完成过程中所需的数据，并注意你需要多少数据、可能在哪里能找到它们等信息。\n\
  \n# 结论\n\n本指南到此结束。下一个里程碑是充分利用你新获得的关于基础编程、数据科学、数据分析和机器学习的智慧，这些知识催生了“硅谷”这一强大源地。许多跨越不同行业的公司在开展数据分析时都能受益。这使他们能够在各自的行业中获得所需的权力和控制权，并确保他们能够真正惊艳客户，并在过程中取得良好的成果。只要使用得当，学习如何使用数据分析将改变你经营业务的方式。\n\
  \n作为一名编程初学者，我们祝贺你完成了这段奇妙旅程的第一阶段。现在，你已经跨过了门槛，我们邀请你展望窗外的世界，真正让你的想象力飞驰吧。只要你下定决心，你的所为将不受限制。\n\
  \n你已经掌握了编程的基础知识。你经历过无数 `Syntax` 错误、异常以及潜在的系统崩溃。现在，你已经打开了编程世界的眼界。那么，从这里开始你将向何方何呢？\n\
  \n答案很简单：随风而行。\n\n至此，你应该知道你想用新学到的编程技能做什么。作为如今的“魔术师”，你必须开辟自己的道路，并决定如何最好利用你的魔法。例如，大多数程序作者的工作涉及使用应用程序编程接口\
  \ (`APIs`)。这意味着收集和处理数据的需求是永无止的。\n\n对于你自己而言，没有什么比关于外部有哪些供你探索的信息更更好的提供了了。许多学科都需要你的编程能力。这几个领域可能帮助你选择需要走向的方向。\n\
  \n数据科学家需要程序开发者，因为这是一个极佳的工具，提供了许多模块来解决其他语言中发现的局限性。然而，最重要的是程序开发者的薪资水平。\n\n机器学习最好的实践环境是编程，尽管其他编程语言也有库来支持它。不过，没有能比拟\
  \ `Python`。它正被 `Google` 等公司以及全球成千上万的程序员使用。\n\n使用 `Python` 和 `Django` 进行 Web 开发使得构建\
  \ Web 应用变得非常简单。如果你的热情在那里，你几分钟就能完成其他开发者需要几小时才能完成的工作。\n\n无论你如何选择，无论这段旅程将你带向何方，请记住你已经准备好应对可能面临的所有挑战。我们坚信，你已经拥有了我们提供的最好的信息弹药，以及让你进入这个代码世界的技巧窍门。正如生活中的其他任何事情一样，将其视为一次冒险，不要害怕涉足并探索新的领域。程序仍然有许多可以提供的价值，对于想要寻找更高级技巧和建议的程序员来说，去探索编程世界吧。做得越多，学得越多，就越想学。\n\
  \n希望你学到了东西！\n"
