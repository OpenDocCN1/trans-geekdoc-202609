- "# 儿童计算机编程：初学者学习编程与编码技能简单分步指南\n\n\n\n\n\n\n\n请注意，本文档中包含的信息仅供教育和娱乐之用。我们已尽一切努力提供准确、最新、可靠且完整的信息。不声明（也不暗示）任何形式的保证。读者承认，作者并未提供法律、财务、医疗或专业建议。书中的内容源自各种来源。在尝试书中概述的任何技术之前，请咨询获得执照的专业人士。\n\
  \n通过阅读本文档，读者同意在任何情况下，作者对因使用本文档包含的信息而导致的任何直接或间接损失均不承担责任，包括但不限于错误、遗漏或不准确之处。\n\n\n\
  # 引言\n来到儿童计算机编程的世界。欢迎学习如何通过编程语言来告诉计算机做什么。编程并不像你想象的那么难，只要你操作得当，它非常有趣。在开始编程时，我们通常会写下一个简单的“Hello,\
  \ World!”。编程是使用特定的语言来编写程序。在编写过程中，你需要一个编程环境来确保你的程序是可以执行的。在这里，我们将讨论 `Java`、`C++` 以及\
  \ `SQL` 等语言。在编程过程中，初学者往往会遇到一些错误、遗漏或不准确之处，我们为你准备了一些实用的提示，帮助你理解这些问题。\n\n## 编辑器\n编辑器是一种用于创建和修改文件的软件。在编程时，你需要根据操作系统选择编辑器。在\
  \ Windows 上，你可以使用 `Notepad`；在 Mac 上，你可以使用 `BBEdit` 或 `TextEdit`。\n\n## 编译器\n编译器是检查你的编程代码是否符合语法规则的程序。它会将你的代码转换为计算机可以理解的二进制格式。大多数编程语言（如\
  \ `C`、`Java` 和 `C++`）都需要编译，因此你可能需要安装相应的编译器。\n\n## 解释器\n与上述语言不同，某些编程语言（如 `Python`\
  \ 和 `Perl`）不需要编译器。相反，它们需要解释器。解释器是一种直接读取程序文件并在解析后执行代码的软件。如果你使用的是这类编程语言，请记得在系统中安装相应的解释器。\n\
  \n# 第一章：\n## 什么是编程语言以及流行的编程语言\n计算机语言主要分为三类：\n\n## 机器语言\n这是计算机的默认语言，以二进制代码的形式表示原始指令。因此，如果你想指令计算机，必须使用二进制代码编写。\n\
  \n\n\n\n\n## 汇编语言\n\n汇编语言是机器语言的替代方案。它们使用助记符表示机器语言指令。由于计算机无法理解汇编语言，我们使用一个名为 `assembler`（汇编器）的程序将汇编代码转换为机器代码。与机器语言相比，汇编语言更容易学习和使用，但由于它们更接近机器语言，因此仍然非常繁琐。\n\
  \n## 高级编程语言\n\n20 世纪 90 年代开启了新一代计算机编程语言的发展，被称为高级编程语言。\n\n高级编程语言是类似于英语的计算机编程语言，且独立于平台，这意味着用高级编程语言编写的代码可以在任何机器或计算机上运行。\n\
  \n现代编程世界中使用的几乎每种编程语言都是高级的。这些语言使用语句来指示计算机执行一组指令。以下是使用现代编程语言计算两个数字之和的示例：\n\n```\n\
  Number1 = 10\nNumber2 = 100\nSum = Number1 + Number2\n```\n\n今天，我们有很多高级编程语言。下面的列表显示了最流行的编程语言，即通常适用于任何领域的语言。\n\
  \n*   Python\n*   Java\n*   C++\n*   JavaScript\n*   Ruby\n\n在本指南中，我们将讨论在开始编程或编写计算机代码需要掌握的要素，涵盖三种编程语言：Java、C++\
  \ 和 Python（版本 3）。\n\n下一阶段将通过观察基本元素开始讨论，理解这些元素将允许你踏上成为精通程序员的道路。\n\n## 编程基础\n\n就像人类语言一样，高级编程语言有一组关键元素。大多数高级编程语言具有以下核心元素：\n\
  \n*   环境 (Environments)\n*   关键字 (Keywords)\n*   数据类型 (Data Types)\n*   变量 (Variables)\n\
  *   操作符 (Operators)\n*   控制流 (Control Flow)\n*   函数 (Functions)\n*   数组 (Arrays)\n\
  *   字符串 (Strings)\n*   输入/输出 (Inputs/Outputs)\n\n由于计算机缺乏直接理解高级编程语言的能力，我们使用翻译器或转换器编写代码，然后将其转换为机器代码。我们将其称为开发环境。\n\
  \n虽然它本身不是一种编程元素，但设置你的开发环境通常是处理每种编程语言的第一步。它主要包括在你的计算机上安装特定类型的软件，以便你创建计算机代码并将这些代码转换为计算机可以理解的语言。\n\
  \n对于大多数高级编程语言，创建常规编程环境所需的显著工具是：\n\n### 文本编辑器\n\n文本编辑器是我们用于编写不带格式的纯文本计算机代码的软件。Microsoft\
  \ Windows 使用 `Notepad`（记事本）作为其默认文本编辑器。源代码是我们用来指代由文本编辑器编写并保存的代码名称。\n\n### 翻译器\n\n\
  我们使用翻译器将源代码转换为二进制语言。翻译后的二进制代码就变成了程序员所说的“目标代码”。翻译器可以是：\n\n1.  **汇编器 (Assemblers)**：我们使用这些工具将低级语言转换为机器代码。\n\
  2.  **编译器 (Compilers)**：编译器将源代码转换为二进制代码，然后执行该二进制文件。如果程序在执行过程中遇到错误，编译将停止且不生成二进制文件。最流行的编译型语言是\
  \ C、C++、Objective-C、Swift 和 Pascal。\n3.  **解释器 (Interpreters)**：解释器与编译器类似，但它们不是运行整个程序，而是逐行转换代码。这意味着每一行代码都会运行，直到发生错误。一旦程序返回错误，解释器会自动停止并报告错误。最流行的解释型语言是\
  \ Python、Ruby、JavaScript 和 Perl。\n4.  **混合翻译器 (Hybrid Translators)**：混合翻译器是编译器和解释器的结合。它们将源代码转换为\
  \ `Bytecode`（字节码）。运行时引擎随后翻译并执行字节码。这里主要的例子是 Java，它使用了 Java 虚拟机 (`JVM`）。\n\n**注意**：根据我们将要讨论的三种编程语言所提供的各种指令来设置你的编程环境。\n\
  \n# 第 2 章：语句与执行\n\n## 语句\n\n### 它们是什么？\n\n在解释什么是语句之前，让我们先问一个问题。在定义语句之前，让我们看看什么是语句。为了解释什么是语句，我们给出一个简单的例子。当我们需要做出某些选择时，我们使用语句。\n\
  \n从简单的定义来说，语句是程序理解的指令。当我们为变量赋值时的语句被称为赋值语句。然而，当我们讨论语句时，通常指的是 `if` 语句。让我们看看如何创建第一个\
  \ `if` 语句。\n\n这里是情况。用户使用其账户登录。如果用户输入正确的密码，应该被允许访问。如果用户输入错误的密码，它不应该通过并告知用户密码错误。\n\
  \n为了这一点，我们首先需要建立一个密码。你可以设置预定义的密码，也可以让用户创建一个。我把选择权交给你。\n\n```\npassword = input(\"\
  创建一个密码: \")\nprint(\"欢迎来到门户\")\n```\n\n到目前，我只要求用户输入密码。如果你愿意，可以设置任何字符串或数字作为密码。接下来，我创建了一个简单的欢迎语。现在，我们将用户输入他们的密码：\n\
  \n```\npassword_check = input(\"请输入你的密码: \")\n```\n\n这里唯一的注意的是我更改了变量名。如果你好奇为什么，那是因为如果使用相同的变量名，它将更新密码，而不是比较它。由于我们需要验证密码，我们将使用不同的变量。\n\
  \n现在，如果密码匹配，Python 会检测到你想要创建一个 `if` 语句。`if` 的颜色会改变以表示这一点。在 `if` 之后，我们需要定义我们的条件。为了这样做，你可能注意到我使用了\
  \ `==` 而不是单个等号。这些符号被称为操作符，我们稍后会讨论。你现在只需要知道这一点：\n\n`=` 用于赋值\n\n`==` 用于等同两个变量，或者比较以判断两者是否完全相同。\n\
  \n在上面的实例中，我们将使用这种比较操作符。这里是最有趣的部分；与我们到为止编写的所有代码不同，这一行以冒号 `:` 结尾。\n\n```python\nif\
  \ password_check == password:\n    print(\"成功！欢迎回来！\")\n```\n\n\n\n\n\n每个条件语句，例如\
  \ `if` 语句，在程序中都以冒号结尾，以此创建一个在该冒号下执行的代码块。下一行将从缩进开始。不要删除该缩进，否则会引起混淆，因为我已经设置了条件，该条件的字面意思是“如果\
  \ `password_check` 与 `password` 完全相同”，而现在我添加了当条件满足时，它需要执行的命令。当你运行这个程序时，将会看到一个提示，让你选择一个密码。这将被存储在一个名为\
  \ `password` 的变量中。接下来，提示将要求我们再次输入密码以验证或登录。我们在这里输入的任何内容都将存储在一个名为 `password_check`\
  \ 的变量中。现在，程序将比较这两个值，并查看它们是否完全相同。如果是，它将打印出一条成功消息。\n\n我很确定，你刚刚是故意尝试输入错误的密码。程序在没有任何警告的情况下就直接结束了，对吧？这是有原因的。我们只定义了\
  \ `if` 条件，一直还没有到定义 `else` 条件的部分。\n\n`else` 条件是最后一个条件，它通常在 `if` 条件或其他条件不成立且不满足时起作用。为了做到，我们将在第一行代码下面添加两行代码。现在，整个程序看起来应该是这样的：\n\
  \n```python\npassword = input(“Create a password: “)\nprint(“Welcome to the portal”)\n\
  password_check = input(“Please enter your password: “)\nif password_check == password:\n\
  \    print(“Successful! Welcome back!\")\nelse:\n    print(“Sorry buddy! That’s\
  \ a Nay!\")\n```\n\n注意 `else` 语句在这里不需要缩进，它也不要求你提供额外的条件。\n\n现在，我将运行两次代码。一次正确，一次错误，让我们看看它是如何工作的：\n\
  \n正确密码\n```\nCreate a password: 123\nWelcome to the portal\nPlease enter your password:\
  \ 123\nSuccessful! Welcome back!\n```\n\n错误密码\n```\nCreate a password: 123\nWelcome\
  \ to the portal\nPlease enter your password: 122\nSorry buddy! That’s a Nay!\n```\n\
  \n这里有一个问题，如果一个语句有多个条件该怎么办？假设让你从一到三之间选择一个数字，然后根据用户选择的数字给出适当的消息，我们该如何做呢？\n\n```python\n\
  print(“Welcome to my little game”)\nnumber = int(input(“Choose a number between\
  \ 1-3: “))\nif number == 1:\n    print(“You love to consider yourself a leader,\
  \ don’t you?”)\nelif number == 2:\n    print(“You hate being alone, right?”)\nelif\
  \ number == 3:\n    print(“The more, the merrier, is it?”)\nelse:\n    print(“Really?\
  \ You can’t follow simple instructions, can you?”)\n```\n\n这种表述方式非常熟悉，但这里需要注意的是\
  \ `elif` 语句。`elif` 位于 `if` 和 `else` 之间，其中 `if` 是第一个条件，而 `else` 是在所有条件都不满足时。\n\n\
  是的，我知道！它应该被命名为 `ifel`，但话虽如此，它就是这样！\n\n你自己试试看，用不同的数字来检查其中的每一项。为了好玩，可以使用任何大于三的数字，看看会发生什么。\n\
  \n这就是程序处理条件语句的方式。如果你是个游戏玩家，你可能见过各种决策可以影响游戏结果的游戏。现在你知道罪魁祸首了！\n\n`elif` 语句的数量没有限制。你可以根据需要创建任意多个。话虽如此，让我们让它更有趣一点。\n\
  \n## 嵌套条件 (`if`) 语句\n\n假设我们使用上述相同的数字，但这次我们希望在一个 `if` 语句中嵌套另一个 `if` 语句。想象我们让用户选择另一个数值（这次是小数），但仅当用户决定选择第一个值作为数字时。\n\
  \n看看下面的代码，并尝试找出代码是如何执行的。\n\n```python\nprint(“Welcome to my little game”)\nnumber\
  \ = int(input(“Choose a number between 1-3: “))\nif number == 1:\n    print(“You\
  \ love to consider yourself a leader, don’t you?”)\n    number2 = float(input(“Enter\
  \ a number with a decimal figure between 1 and 2: “ ))\n    if number2 == 2.00:\n\
  \        print(“Okay! I meant a little lesser than that!”)\n    elif number < 1.50:\n\
  \        print(“Oh, come on! You can go higher!”)\n    else:\n        print(“You\
  \ know what, forget it!”)\nelif number == 2:\n    print(“You hate being alone, right?”)\n\
  elif number == 3:\n    print(“The more, the merrier, is it?”)\nelse:\n    print(“Really?\
  \ You can’t follow simple instructions, can you?”)\n```\n\n我们在第一个条件内部创建了另一个变量。如果用户决定选择\
  \ 1，提示将要求用户输入另一个数字。我们在这里使用了转换，将输入的数字转换为浮点数，因为它带有小数部分。\n\n然后我们又创建了另一个条件来定义上限和下限。无论用户选择什么，他们都会收到一个表示他们得太高的消息，或者一个鼓励他们继续更高的消息。其余部分将始终用户感到有些困惑。\n\
  \n这种位于条件语句中的条件语句被称为嵌套语句（Nested Statement）。\n\n## 执行\n\n在编程中，迭代意味着代码行的重复。它是计算机编程中的一项重要属性，有助于找到问题的解决方案。迭代和条件执行是算法开发的主干。\n\
  \n让我们从这里开始：\n\n### While 语句\n\n假设你想写一个可以数到 10,000 的程序，你会如何处理这个问题？你会坐下来写 10,000 条打印语句吗？虽然你可以这样做，但那将消耗大量时间。然而，计数在计算机中非常频繁，事实上，计算机可以计算极值。所以，一定有办法。你需要的是打印变量的值并重复这个过程直到达到\
  \ 10,000。重复执行相同代码的方法被称为循环。程序语言有两种特殊的语句，`while` 和 `for`，用于处理迭代。\n\n# 第 3 章：函数、输入、输出\n\
  \n## 函数\n\n在这个阶段，你将学会如何在程序中轻松地编写函数。函数是一行代码，设计用于执行特定的任务。当你想要编写一个执行特定任务的程序时，你必须定义函数并调用函数。此外，我将教你如何向函数传递信息并将其显示在屏幕上。\n\
  \n有时，解释某事的最好方法是提供示例。下面的程序是一个打印消息的欢迎程序。\n\n```python\ndef welcome_user():\n    \"\
  \"\"Transmit a Welcome Message.\"\"\"\n    print(\"Welcome to Learning Programming.\"\
  )\n\nwelcome_user()\n```\n\n这个示例展示了函数工作的最简单结构。第一行使用 `def` 关键字告诉解释器你想定义一个函数。因此，每当你看到\
  \ `def` 单词以及随后的单词时，它就代表一个函数定义。括号负责持有你所需的信息。\n\n\n\n\n每当你定义一个函数后，你会看到一个缩进的行，这就是函数的体体。第二行被称为\
  \ `docstring`（文档字符串），尽管它是一条注释并描述了函数的用途。`docstring` 通常用三个引号包裹。此外，第三行打印语句“Welcome\
  \ to Learning Programming.”。这一行包含了函数的主要信息。这意味着欢迎用户的首要任务是打印“Welcome to Learning Programming.”。\n\
  \n如果你想调用一个函数，你必须编写函数名，后面跟上括号和冒号。我们的程序输出将如下：\n\n| Welcome to Learning Programming.\
  \  |\n| --- |\n\n## 如何向函数传递信息\n\n我们将修改示例来解释如何向函数传递信息。我们可以通过这种方式，让程序不仅会说“Welcome\
  \ to Learning Programming”，还会包含用户名。为了做到这一点，我们必须请求用户输入他们的名字。\n\n```python\ndef welcome_user(name):\n\
  \    \"\"\"Transmit a Welcome Message.\"\"\"\n    print(f\"Welcome to Learning Programming,\
  \ {name.title()}!\")\n\nwelcome_user(\"Thomas\")\n```\n\n当我们输入 `welcome_user(\"\
  Thomas\")` 时，它了函数 `welcome_user()` 并将名称 `\"Thomas\"` 传递给函数以执行 `print` 命令。借此，我们的输出将是\n\
  \n| Welcome to Learning Programming, Thomas!  |\n| --- |\n\n## 参数与参数\n\n我们定义了一个函数，它要求用户为变量\
  \ `username` 输入一个值。你立即调用该函数并为其分配一个值；它会打印 `print()` 函数中的消息。我们的函数内部有一个变量。该变量是程序中参数（parameter）的例子，而\
  \ `Thomas` 是参数（argument）。参数是包含信息并从函数调用传递到函数的值。例如，当我们调用函数时，我们在函数内部放置了一个值。在这种情况下，我们的参数是\
  \ `\"Thomas,\"`，我们将信息传递给了函数。\n\n注意：人们会交替使用这两个术语。因此，当你看到一个函数定义被称为参数或反之时，请不要理解。\n\n\
  ## 如何在程序中传递参数\n\n由于一个函数定义可以有多个参数，函数调用也可能需要多个参数。这意味着你可以通过多种方式向函数传递参数。你可以使用关键字参数或位置参数。在后者中，参数的顺序必须与你的参数顺序一致；而在前者，每个参数包含一个变量名及其等效值。\n\
  \n### 位置参数\n\n这种参数是程序中传递参数的最简单方法，因为函数中的每个参数必须与函数声明部分中的参数匹配。为了看到它是如何工作的，让我们写一个显示动物信息的程序。在这种情况下，该函数告诉我们特定的动物类型和宠物的名称。\n\
  \n```python\ndef animal_list(animal_kind, pet_name):\n    \"\"\"Display Details\
  \ About Animal.\"\"\"\n    print(f\"\\nThis is a {animal_kind}.\")\n    print(f\"\
  My {animal_kind}'s name is {pet_name.title()}.\")\n\nanimal_list(\"Cat\", \"Lucy\"\
  )\n```\n\n第一块代码定义了一个函数。它表明该函数需要特定的动物类型及其宠物名。在定义函数后，我们调用 `animal_list(\"Cat\", \"\
  Lucy\")`。\n\n#### 调用多次函数\n\n我们可以根据需要多次调用一个函数。查看代码：\n\n```python\ndef animal_list(animal_kind,\
  \ pet_name):\n    \"\"\"Display Details About Animal.\"\"\"\n    print(f\"\\nThis\
  \ is a {animal_kind}.\")\n    print(f\"My {animal_kind}'s name is {pet_name.title()}.\"\
  )\n\nanimal_list(\"Cat\", \"Lucy\")\nanimal_list(\"Dog\", \"Rex\")\nanimal_list(\"\
  Bird\", \"Polly\")\n```\n\n### 关键字参数\n\n在使用关键字参数时，确保使用了正确的参数名。因此，顺序并不重要，如下：\n\n\
  ```python\ndef animal_list(animal_kind, pet_name):\n    \"\"\"Display Details About\
  \ Animal.\"\"\"\n    print(f\"\\nThis is a {animal_kind}.\")\n    print(f\"My {animal_kind}'s\
  \ name is {pet_name.title()}.\")\n\nanimal_list(animal_kind=\"Cat\", pet_name=\"\
  Lucy\")\nanimal_list(pet_name=\"Rex\", animal_kind=\"Dog\")\n```\n\n### 默认值\n\n\
  除了使用关键字参数和位置参数外，函数的每个参数都可以有一个默认值。如果你在函数中提供了参数，程序将使用该值。然而，如果没有参数值，程序将使用参数的默认值。\n\n\
  ```python\ndef animal_list(pet_name, animal_kind=\"Cat\"):\n    \"\"\"Display Details\
  \ About Animal.\"\"\"\n    print(f\"\\nThis is a {animal_kind}.\")\n    print(f\"\
  My {animal_kind}'s name is {pet_name.title()}.\")\n\nanimal_list(pet_name=\"Lucy\"\
  )\n```\n\n### 用于交互的基础函数\n\n在这个阶段，我们将为两个最重要的交互函数命名，它们是 `print()`（标准输出），另一方面，标准输入是\
  \ `input()`，我们将在下方解释。\n\n## 标准输出\n\n`print()` 函数用于通过标准输出显示信息，这通常对应于计算机屏幕。\n\n在 Program2\
  \ 中，`print` 是一个关键字，而在 Program3 中，`print()` 是一个函数，因此内容将作为函数内的参数形式表达，换句话说，必须放在括号内。\n\
  \n```python\nprint(\"Output\")\nprint(\"The end\")\n```\n\n\n\n\n需要注意的是，在很多情况下，你会有两个字符串类型的变量，有时，你需要在同一个打印语句中使用它们；因此，我们继续将这两个字符字符串拼接并一起打印出来。\n\
  \n## 标准输入\n\n对于 `Program3`，默认函数是 `input()`，它负责获取用户输入的某些输入值，它必须被赋值给变量，因此你得到一个字符串。该函数的一个重要特性是，你还可以在屏幕上显示消息，从而让用户知道需要输入什么，程序员可以写一条消息告诉他们需要输入什么类型的数据，例如，告诉用户在计算矩形面积时需要输入一个自然数。但为了更好地理解这一点，查看以下示例很重要：\n\
