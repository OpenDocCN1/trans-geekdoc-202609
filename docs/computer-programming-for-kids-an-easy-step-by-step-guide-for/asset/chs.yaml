  \ `\\\\n`。最后，将在屏幕上打印变量 `string` 和 `string2` 的拼接。\n\n# 第 4 章：Web 编程\n\n本阶段简要介绍 Web\
  \ 编程。互联网是现在人们的基本实体。通过程序解释 Web 模块化有助于你更好地学习该主题。\n\n## 通 通协议\n\n通信是非常奇妙的事情。它允许信息在个体之间传递。动物发出化学元素和交配信息。人们对爱人说情话来表达爱意。猎人吹哨并安静地围捕猎物。服务员向厨房要了两份炸鸡和啤酒。红灯引导交通，电视广告广播，法老金字塔刻着禁止进入的诅咒。通过通信，每个人都与周围的世界连接在一起。在通信的神秘过程中，相关的个体总是遵守特定的协议。在日常对话中，我们使用一套语法。如果两个人使用不同的语法，那么他们使用的协议就不同，最终，他们不知道在谈什么。\n\
  \n计算机之间的通信是不同计算机之间信息的传输。因此，计算机通信也应该遵循通信协议会议。为了实现多级全球互联网通信，计算机通信也有一个多级协议系统。`HTTP`\
  \ 协议是最常见的网络协议类型。它的全称是超文本传输协议。\n\n`HTTP` 协议允许文件传输，特别是超文本。在互联网时代，它是最广泛使用的互联网协议。事实上，当我们访问一个网站时，通常会在浏览器中输入一个\
  \ `HTTP URL`，例如 `http://www.google.com`，它会提示你需要使用 `HTTP` 协议来访问你的站点。\n\n`HTTP` 的工作就像一份快餐点单：\n\
  \n1. 请求：客户向服务员请求一个鸡肉汉堡。\n2. 响应：服务器根据情况对客户的请求做出响应。\n\n根据情况，服务员可能会以多种方式响应，例如：\n\n\
  * 服务员准备了`鸡腿汉堡` 并将其递给客户。（一切正常）\n* 女服务员发现自己自己在甜点摊工作。她让她的客户去官方柜台点餐。（重定向）\n* 服务员告诉客户\
  \ `鸡腿汉堡` 卖光了。（未找到）\n\n当交易完成后，服务员将该交易抛在脑后，准备为下位客户提供服务。\n\n```\nGET /start.html HTTP/3.0\n\
  Host: www.mywebsite.com\n```\n\n在起始行中，有三条信息：\n\n* `GET` 方法。描述你想要服务器执行的操作。\n* `/start`。html\
  \ 资源的路径。这些指向服务器上的索引。HTML 文件。\n* `HTTP 3.0`。第一个被广泛使用的 `HTTP` 版本是 3.0，当前版本是 3.3。\n\
  \n早期的 `HTTP` 协议只有 `GET` 方法。遵循 `HTTP` 协议，服务器接收 `GET` 请求。\n\n\n\n\n\n```python\nconnection\
  \ = http.client.HTTPConnection(“www.facebook.com”) #hostaddress conn.request(“POST”,\
  \ “/”) # requestmethod and resource path \n\nresponse = connection.getresponse()\
  \ # Gets a response \n\nprint(response.status, response.reason)# Replies with status\
  \ code and description \n\ncontent = response.read() \n```\n\n# 第 5 章：面向对象编程\n\n\
  我们现在将查看面向对象编程的四个概念以及它们如何在 Python 中应用。\n\n## 继承 (Inheritance)\n\n第一个主要概念被称为“继承”。这指的是一个事物可以从另一个事物派生出来。以跑车为例。所有的跑车都是车辆，但并不是所有车辆都是跑车。此外，所有的轿车都是车辆，但并不是所有车辆都是轿车，轿车显然也不是跑车，尽管它们都是车辆。\n\
  \n所以基本上，面向对象编程的这个概念是指，事物可以并且应该被拆分成尽可能微小、精确的概念。\n\n在 Python 中，这是通过派生类来实现的。\n\n假设我们有另一个名为\
  \ `SportsCar` 的类。\n\n```python\nclass Vehicle(object):\n    def __init__(self, makeAndModel,\
  \ prodYear, airConditioning):\n        self.makeAndModel = makeAndModel\n      \
  \  self.prodYear = prodYear\n        self.airConditioning = airConditioning\n  \
  \      self.doors = 4\n    def honk(self):\n        print “%s says: Honk! Honk!”\
  \ % self.makeAndModel\n```\n\n现在，在下方创建一个名为 `SportsCar` 的新类，但我们不是派生 `object`，而是派生自\
  \ `Vehicle`。\n\n```python\nclass SportsCar(Vehicle)\n    def __init__(self, makeAndModel,\
  \ prodYear, airConditioning):\n        self.makeAndModel = makeAndModel\n      \
  \  self.prodYear = prodYear\n        self.airConditioning = airConditioning\n  \
  \      self.doors = 4\n```\n\n省去 `honk` 函数，我们在这里只需要构造函数。现在声明一个跑车。我就选法拉利吧。\n\n```python\n\
  ferrari = SportsCar(“Ferrari Laferrari”, 2016, True)\n```\n\n现在通过调用来测试它：\n\n```python\n\
  ferrari.honk()\n```\n\n然后保存并运行。它应该会顺畅地运行。\n\n为什么呢？这是因为继承的概念是指，子类从父类派生函数和类变量。这个概念很容易理解。下一个就稍微难一点。\n\
  \n## 多态 (Polymorphism)\n\n多态的理念是，根据情况的需求，可以以不同的方式执行相同的过程。在 Python 中，可以通过两种不同的方式实现：方法重载\
  \ (method overloading) 和方法重写 (method overriding)。\n\n方法重载是指定义两次具有不同参数的函数。例如，我们可以为\
  \ `Vehicle` 类提供两个不同的初始化函数。现在，它仅仅假设车辆有 4 扇门。如果我们想具体地说明汽车有多少扇门，我们可以在当前初始化函数下方创建一个添加了\
  \ `doors` 参数的新初始化函数，如下所示（较新的一个在下方）：\n\n```python\ndef __init__(self, makeAndModel,\
  \ prodYear, airConditioning):\n    self.makeAndModel = makeAndModel\n    self.prodYear\
  \ = prodYear\n    self.airConditioning = airConditioning\n    self.doors = 4\ndef\
  \ __init__(self, makeAndModel, prodYear, airConditioning, doors):\n    self.makeAndModel\
  \ = makeAndModel\n    self.prodYear = prodYear\n    self.airConditioning = airConditioning\n\
  \    self.doors = doors\n```\n\n现在，有人在创建 `Vehicle` 类的实例时，可以选择是否定义门的数量。如果他们不定义，则门的数量被默认为\
  \ 4。\n\n方法重写是指子类用自己的代码覆盖父类的函数。\n\n为了说明，创建一个另一个扩展 `Vehicle` 的类名为 `Moped`（轻便摩托车）。将门数设为\
  \ 0，因为这很荒谬，并将空调设置为 false。唯一相关的参数是品牌/型号和生产年份。看起来应该是这样：\n\n```python\nclass Moped(Vehicle):\n\
  \    def __init__(self, makeAndModel, prodYear):\n        self.makeAndModel = makeAndModel\n\
  \        self.prodYear = prodYear\n        self.airConditioning = False\n      \
  \  self.doors = 0\n```\n\n现在，如果我们创建一个 `Moped` 类的实例并调用 `honk()` 方法，它会鸣笛。但常识是轻便摩托车不鸣笛，它们是哔哔的。所以，让我们用自己的方法覆盖父类的\
  \ `honk` 方法。这超级简单。我们只需要在子类中重新定义函数即可：\n\n```python\ndef honk(self):\n    print “%s\
  \ says: Beep! Beep!” % self.makeAndModel\n```\n\n## 抽象 (Abstraction)\n\n面向对象编程的下一个主要概念是抽象。这种理念是指用户应该远离内部工作机制。这有两个好处。\n\
  \n第一个是它降低了人为或其他因素导致灾难性错误的风险和可能性。\n\n第二个是它本质上让语言更容易被理解、阅读和学习。虽然这让语言变得稍微没那么强大了，但对于今天编写的大量应用程序来说，这通常是一个正面的结果，这也是\
  \ Python 和其他面向对象编程语言如此流行的原因。\n\n## 封装 (Encapsulation)\n\n面向对象编程的最后一个主要概念是封装。这个最容易解释。这种理念是指共同的数据应该放在在一起，而代码应该是模块化的。我不会花很长时间解释这个，因为它是非常简单的概念。类的整个概念就是封装的简洁示例：共同属性和方法被绑定在一个凝聚结构中，使得在无需为每个实例创建超级特定的变量的情况下创建此类事物变得超级简单。\n\
  \n好了，就是这样。我们终于到达了我们 Python 小冒险的终点。首先，我想感谢你读完了《Python for Beginners: The Ultimate\
  \ Guide to Python Programming》。希望这本书对你有启发性，并能为你提供实现目标所需的所有工具，无论你的目标是什么。\n\n\n\n\n\
  \n人工智能是一个多年来在许多对话中反复出现的研究领域。几年前，这还是一个在电影和漫画中传播的未来主义概念。通过多年的发展和研究，我们现在正在体验人工智能的最优成果。事实上，人们广泛认为人工智能将帮助我们开启计算的新前沿。\n\
  \n人工智能可能与机器学习（Machine Learning）和深度学习（Deep Learning）具有某些相似之处，但它们并非同一种产物。许多人在交替使用这些术语时，并没有考虑其假设背后可能产生的影响。深度学习和机器学习是人工智能的知识分支。虽然过去曾使用过不同的定义来解释人工智能，但基本的共识是：这是一个构建计算机程序的过程，使其具备像正常人类大脑一样操作和运行的能力。\n\
  \n人工智能的概念是训练计算机，使其像人类大脑一样进行思考和运作。就人类大脑而言，我们尚未充分挖掘大脑的真实潜力。专家认为，即使是世界上最才华的人也无法完全耗尽他们的大脑容量。\n\
  \n因此，这产生了一个难题，因为如果我们还没有完全理解并测试大脑的局限性，又如何能构建出可以模拟人类大脑的计算系统呢？如果在我们学会如何使用大脑之前，计算机已经学会了像人类一样互动和操作，并到了可以充分利用脑力的程度，会发生什么？\n\
  \n理想情况下，人工智能背后的力量或其思维能力的极限尚未确定。然而，该领域的研究人员和其他专家多年来取得了巨大进展。体现这些价值的最接近人工智能的例子之一是 Sophia。Sophia\
  \ 目前可能是世界上最先进的人工智能模型。考虑到我们无法完全推向大脑的极限，我们可能永远无法将人工智能的极限推到能够完全取代人类的程度。\n\n机器学习和深度学习是人工智能的两个分支，多年来显著的研究和增长。对这些框架的关注，特别是是因为世界上许多领先的科技公司已将它们无缝地实现在产品中，并将其整合到人类生活中。你每天都会不断与这些模型进行交互。\n\
  \n机器学习和深度学习确实共享许多特征，但它们并不是相同的。这就像将这两者与人工智能进行比较的情况。作为一个初学者，学习这些研究之间的区别是非常重要的，这样你才能寻找并发现可以利用以进一步提升你在行业内技能的绝佳机会。在一个不断向增加机器依赖发展的世界里，目前机器学习和深度学习领域有很多职位空缺。在不久的未来，会有更多机会，因为人们正竞相适应并将这些系统整合到他们的日常运营生活中。\n\
  \n## 深度学习 vs. 机器学习\n\n在我们开始之前，重要的是你要提醒自己这两个主题的基本定义或解释。机器学习是人工智能的一个分支，它使用算法来教机器如何学习。算法之外，机器学习模型还需要输入和输出数据，它们通过与不同用户的交互来从中学习。\n\
  \n在构建此类模型时，始终建议确保你构建的是一个可扩展的项目，该项目在适用时可以接收新数据，并使用它持续训练模型以提高其效率。一个高效的机器学习模型能够自我修改，而不一定需要你的输入，并且仍然提供正确的输出。它从现有的结构化数据中学习并不断更新自己。\n\
  \n深度学习是机器学习的一类，使用与机器学习中相同的算法和函数。然而，深度学习引入了超越算法能力的分层计算。深度学习中的算法是以层形式使用的，每一层都以不同的方式解释数据。深度学习使用的算法网络被称为人工神经网络（Artificial\
  \ Neural Networks）。\n\n“人工神经网络”这个名称为我们提供了与深度学习框架中发生的情况最接近的迭代描述。这里的目标是试图通过神经网络来模拟人类大脑的功能。深度学习科学领域的专家多年来研究并引用了许多关于人类大脑的不同研究，这帮助引领了该领域的研究。\n\
  \n## 问题解决方法\n\n让我们考虑一个例子来解释深度学习和机器学习之间的区别。\n\n假设你有一个包含卡车和自行车照片的数据库。你如何使用机器学习和深度学习学习来理解这些数据？从初看之下，你看到的是一组卡车和自行车。但如果你需要使用这两个框架分别识别自行车照片和卡车照片，该怎么办？\n\
  \n为了帮助你的机器学习算法根据请求的类别识别卡车和自行车照片，你必须先教它这些照片是关于什么的。机器学习算法是如何找出区别的？毕竟，它们看起来几乎一模一样。\n\
  \n解决方案在于结构化数据方法。首先，你对自行车和卡车的照片进行标注，定义出其中任一类物品特有的不同特征。这些数据足够你的机器学习算法进行学习了。根据输入标签，当它遇到更多数据时，它将不断学习并完善对卡车和自行车差异的理解。从这个简单的插图中，它将继续搜索它能够访问的数百万其他数据，以区分卡车和自行车的区别。\n\
  \n## 我们如何在深度学习中解决这个问题？\n\n深度学习中的方法与我们在机器学习中所做的不同。这里的优势是，在深度学习中，你不需要任何标记或结构化数据来帮助模型识别卡车和自行车。\n\
  \n人工神经网络通过网络中不同的算法层来识别图像数据。每一层都会识别并定义照片中的特定特征。这是我们大脑在尝试解决某些问题时使用的相同方法。\n\n通常，大脑会考虑很多可能性，在排除掉所有错误的选项之前确定正确的选项。深度学习模型将通过多个层次过程处理查询以寻找解决方案。在每个识别层级，深度神经网络都会识别出有助于区分自行车和卡车的标识符。\n\
  \n这是理解这两个系统如何运作的最简单方法。然而，深度学习和机器学习并不一定是区分这些照片的适用方法。当你学习这两个领域之间的区别时，你必须记住，在选择解决问题的最佳方法之前，你必须正确地定义问题。你将在机器学习之旅程更晚的阶段学习如何选择合适的方法，这在这一系列的高级书籍中已经涵盖了。\n\
  \n从上述插图示例中，我们可以看到机器学习算法需要结构化数据来帮助它们区分卡车和自行车的区别。通过这些信息，它们在识别出分类器后就可以产生正确的输出。\n\n\n\
  \n\n在深度学习中，你的模型可以通过通过其框架中的几个数据处理层来识别卡车和自行车的图像。这不需要结构化数据。为了做出正确的预测，深度学习框架依赖于每个数据处理层提供的输出。这些信息随后会不断积累并呈现出最终结果。在这种情况下，它排除了所有可能性，只留下唯一可靠的解决方案。\n\
  \n从我们上面的插图中，我们学习到了一些重要的事实，这些事实将在你今后的多年学习过程中帮助你区分深度学习与机器学习。我们可以将其总结为以下几点：\n\n###\
  \ 数据呈现\n\n机器学习与深度学习之间的主要区别在我们将数据引入各自模型的方式上显而易见。对于机器学习模型，你几乎总是需要使用结构化数据。然而，在深度学习中，网络依赖人工神经网络层来识别有助于识别数据的特征。\n\
  \n### 算法与人工干预\n\n机器学习的重点在于通过与不同的输入交互并使用模式来学习。通过这种交互，机器学习模型学习得越久、接收的交互越多，产生的输出就越好。为了实现这一目标，你必须尝试提供尽可能多的新数据。\n\
  \n当你发现呈现的输出不是你需要的时，你必须重新训练机器学习模型以提供更好的输出。因此，对于一个应该无需人工干预即可运行的系统，你仍然需要经常出现。\n\n在深度学习中，不需要你的参与。神经网络内部所有的嵌套层都在不同层面上处理数据。然而，在这个过程中，模型可能会遇到错误并从中学习。\n\
  \n这与人类大脑的工作方式相同。随着你的成长，你通过试错学习了许多重要的生活技能。通过犯错，你的大脑学会了正反馈和负反馈之间的区别，并且会在尽可能的情况下努力获得积极的结果。\n\
  \n公平地说，即使在深度学习中，仍然需要你的输入。你不能确信地假设输出将一直是完美的。当你的输入数据不足以满足你对模型要求的输出时，这一点尤为适用。\n\n这里的根本因素是机器学习和深度学习都必须使用数据。你拥有的数据质量会对你从这些模型获得的结果产生持久的影响。提到数据，你不能只使用任何数据。要有效使用其中任何一种模型，你必须学会检查数据，并确保你正在为你喜喜欢的模型使用正确的格式。\n\
  \n机器学习算法通常需要标记的结构化数据。由于这个原因，如果你需要为需要大量数据的复杂寻找解决方案，它们不是最佳选择。\n\n在我们用于识别卡车和自行车的示例中，我们尝试在一个理论概念中解决一个非常简单的问题。但在现实世界中，深度学习模型被应用于更复杂的模型。如果你考虑涉及的过程，从概念到分层数据处理再到数据必须经过的不同层数，使用深度学习模型来解决简单问题将浪费资源。\n\
  \n虽然所有这些类人工智能都需要数据来帮助进行我们所需的智能，但深度学习模型对数据的访问范围比机器学习算法要宽泛得多。这很重要，因为深度学习算法在传递输出之前，必须在合理的怀疑之外证明输出是完美的。\n\
