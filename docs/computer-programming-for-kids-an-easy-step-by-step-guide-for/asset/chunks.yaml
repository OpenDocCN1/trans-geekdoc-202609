    Artificial intelligence is a field of study that has come up in many conversations
    for years. A few years ago, this was a futuristic concept that was propagated
    in movies and comic books. Through years of development and research, we are currently
    experiencing the best of artificial intelligence. In fact, it is widely expected
    that AI will help us usher in the new frontier in computing.


    Artificial intelligence might share some similarities with Machine Learning and
    Deep Learning, but they are not the same thing. Many people use these terms interchangeably
    without considering the ramifications of their assumptions. Deep Learning and
    Machine Learning are knowledge branches of artificial intelligence. While there
    are different definitions that have been used in the past to explain artificial
    intelligence, the basic convention is that this is a process where computer programs
    are built with the capacity to operate and function like a normal human brain
    would.


    The concept of AI is to train a computer to think the same way a human brain thinks
    and functions. In as far as the human brain is concerned, we are yet to fully
    grasp the real potential of our brains. Experts believe that even the most brilliant
    individuals in the world are unable to fully exhaust their brain capacity.


    This, therefore, creates a conundrum, because if we are yet to fully understand
    and test the limits of our brains, how can we then build computing systems that
    can replicate the human brain? What happens if computers learn how to interact
    and operate like humans to the point where they can fully use their brainpower
    before we learn how to use ours?


    Ideally, the power behind AI or the limits of its thinking capacity is yet to
    be established. However, researchers and other experts in the field have made
    great strides over the years. One of the closest examples of AI that espouses
    these values is Sophia. Sophia is probably the most advanced AI model in the world
    right now. Perhaps given our inability to fully push the limits of our brains,
    we might never fully manage to push the limits of AI to a point where they can
    completely replace humans.


    Machine Learning and Deep Learning are two branches of artificial intelligence
    that have enjoyed significant research and growth over the years. The attention
    towards these frameworks especially comes from the fact that many of the leading
    tech companies in the world have seamlessly implemented them in their products,
    and integrated them into human existence. You interact with these models all the
    time on a daily basis.


    Machine Learning and Deep Learning do share a number of features, but they are
    not the same. Just as is the case with comparing these two with artificial intelligence.
    In your capacity as a beginner, it is important to learn the difference between
    these studies, so that you can seek and find amazing opportunities that you can
    exploit and use to further your skills in the industry. In a world that is continually
    spiraling towards increased machine dependency, there are many job openings in
    Machine Learning and Deep Learning at the moment. There will be so much more in
    the near future too, as people rush to adapt and integrate these systems into
    their daily operations and lives.


    ## Deep Learning vs. Machine Learning


    Before we begin, it is important that you remind yourself of the basic definitions
    or explanations of these two subjects. Machine Learning is a branch of artificial
    intelligence that uses algorithms to teach machines how to learn. Further from
    the algorithms, the Machine Learning models need input and output data from which
    they can learn through interaction with different users.


    When building such models, it is always advisable to ensure that you build a scalable
    project that can take new data when applicable and use it to keep training the
    model and boost its efficiency. An efficient Machine Learning model should be
    able to self-modify without necessarily requiring your input, and still provide
    the correct output. It learns from structured data available and keeps updating
    itself.


    Deep Learning is a class of Machine Learning that uses the same algorithms and
    functions used in Machine Learning. However, Deep Learning introduces layered
    computing beyond the power of algorithms. Algorithms in Deep Learning are used
    in layers, with each layer interpreting data in a different way. The algorithm
    network used in Deep Learning is referred to as Artificial Neural Networks.


    The Name Artificial Neural Networks gives us the closest iteration of what happens
    in Deep Learning frameworks. The goal here is to try and mimic the way the human
    brain functions, by focusing on the neural networks. Experts in Deep Learning
    Sciences have studied and referenced different studies on the human brain over
    the years, which has helped spearhead research into this field.


    ## Problem Solving Approaches


    Let’s consider an example to explain the difference between Deep Learning and
    Machine Learning.


    Say you have a database that contains photos of trucks and bicycles. How can you
    use Machine Learning and Deep Learning to make sense of this data? At first glance,
    what you will see is a group of trucks and bicycles. What if you need to identify
    photos of bicycles separately from trucks using these two frameworks?


    To help your Machine Learning algorithm identify the photos of trucks and bicycles
    based on the categories requested, you must first teach it what these photos are
    about. How does the Machine Learning algorithm figure out the difference? After
    all, they almost look alike.


    The solution is in a structured data approach. First, you will label the photos
    of bicycles and trucks in a manner that defines different features that are unique
    to either of these items. This is sufficient data for your Machine Learning algorithm
    to learn from. Based on the input labels, it will keep learning and refine its
    understanding of the difference between trucks and bicycles as it encounters more
    data. From this simple illustration, it will keep searching through millions of
    other data it can access to tell the difference between trucks and bicycles.


    ## How Do We Solve This Problem in Deep Learning?


    The approach in Deep Learning is different from what we have done in Machine Learning.
    The benefit here is that in Deep Learning, you do not need any labelled or structured
    data to help the model identify trucks from bicycles.


    The artificial neural networks will identify the image data through the different
    algorithm layers in the network. Each of the layers will identify and define a
    specific feature in the photos. This is the same method that our brains use when
    we try to solve some problems.


    Generally, the brain considers a lot of possibilities, ruling out all the wrong
    ones before settling on the correct one. Deep Learning Models will pass queries
    through several hierarchical processes to find the solution. At each identification
    level, the deep neural networks recognize some identifiers that help in distinguishing
    bicycles from trucks.


    This is the simplest way to understand how these two systems work. Both Deep Learning
    and Machine Learning, however, might not necessarily be applicable methods to
    tell these photos apart. As you learn about the differences between these two
    fields, you must remember that you have to define the problem correctly, before
    you can choose the best approach to implement in solving it. You will learn how
    to choose the right approach at a later stage in your journey into Machine Learning,
    which has been covered in the advanced books in this series.


    From the example illustrated above, we can see that Machine Learning Algorithms
    need structured data to help them tell the difference between trucks and bicycles.
    From this information, they can then produce the correct output after identifying
    the classifiers.

    '
  trans: '


    人工智能是一个多年来在许多对话中反复出现的研究领域。几年前，这还是一个在电影和漫画中传播的未来主义概念。通过多年的发展和研究，我们现在正在体验人工智能的最优成果。事实上，人们广泛认为人工智能将帮助我们开启计算的新前沿。


    人工智能可能与机器学习（Machine Learning）和深度学习（Deep Learning）具有某些相似之处，但它们并非同一种产物。许多人在交替使用这些术语时，并没有考虑其假设背后可能产生的影响。深度学习和机器学习是人工智能的知识分支。虽然过去曾使用过不同的定义来解释人工智能，但基本的共识是：这是一个构建计算机程序的过程，使其具备像正常人类大脑一样操作和运行的能力。


    人工智能的概念是训练计算机，使其像人类大脑一样进行思考和运作。就人类大脑而言，我们尚未充分挖掘大脑的真实潜力。专家认为，即使是世界上最才华的人也无法完全耗尽他们的大脑容量。


    因此，这产生了一个难题，因为如果我们还没有完全理解并测试大脑的局限性，又如何能构建出可以模拟人类大脑的计算系统呢？如果在我们学会如何使用大脑之前，计算机已经学会了像人类一样互动和操作，并到了可以充分利用脑力的程度，会发生什么？


    理想情况下，人工智能背后的力量或其思维能力的极限尚未确定。然而，该领域的研究人员和其他专家多年来取得了巨大进展。体现这些价值的最接近人工智能的例子之一是 Sophia。Sophia
    目前可能是世界上最先进的人工智能模型。考虑到我们无法完全推向大脑的极限，我们可能永远无法将人工智能的极限推到能够完全取代人类的程度。


    机器学习和深度学习是人工智能的两个分支，多年来显著的研究和增长。对这些框架的关注，特别是是因为世界上许多领先的科技公司已将它们无缝地实现在产品中，并将其整合到人类生活中。你每天都会不断与这些模型进行交互。


    机器学习和深度学习确实共享许多特征，但它们并不是相同的。这就像将这两者与人工智能进行比较的情况。作为一个初学者，学习这些研究之间的区别是非常重要的，这样你才能寻找并发现可以利用以进一步提升你在行业内技能的绝佳机会。在一个不断向增加机器依赖发展的世界里，目前机器学习和深度学习领域有很多职位空缺。在不久的未来，会有更多机会，因为人们正竞相适应并将这些系统整合到他们的日常运营生活中。


    ## 深度学习 vs. 机器学习


    在我们开始之前，重要的是你要提醒自己这两个主题的基本定义或解释。机器学习是人工智能的一个分支，它使用算法来教机器如何学习。算法之外，机器学习模型还需要输入和输出数据，它们通过与不同用户的交互来从中学习。


    在构建此类模型时，始终建议确保你构建的是一个可扩展的项目，该项目在适用时可以接收新数据，并使用它持续训练模型以提高其效率。一个高效的机器学习模型能够自我修改，而不一定需要你的输入，并且仍然提供正确的输出。它从现有的结构化数据中学习并不断更新自己。


    深度学习是机器学习的一类，使用与机器学习中相同的算法和函数。然而，深度学习引入了超越算法能力的分层计算。深度学习中的算法是以层形式使用的，每一层都以不同的方式解释数据。深度学习使用的算法网络被称为人工神经网络（Artificial
    Neural Networks）。


    “人工神经网络”这个名称为我们提供了与深度学习框架中发生的情况最接近的迭代描述。这里的目标是试图通过神经网络来模拟人类大脑的功能。深度学习科学领域的专家多年来研究并引用了许多关于人类大脑的不同研究，这帮助引领了该领域的研究。


    ## 问题解决方法


    让我们考虑一个例子来解释深度学习和机器学习之间的区别。


    假设你有一个包含卡车和自行车照片的数据库。你如何使用机器学习和深度学习学习来理解这些数据？从初看之下，你看到的是一组卡车和自行车。但如果你需要使用这两个框架分别识别自行车照片和卡车照片，该怎么办？


    为了帮助你的机器学习算法根据请求的类别识别卡车和自行车照片，你必须先教它这些照片是关于什么的。机器学习算法是如何找出区别的？毕竟，它们看起来几乎一模一样。


    解决方案在于结构化数据方法。首先，你对自行车和卡车的照片进行标注，定义出其中任一类物品特有的不同特征。这些数据足够你的机器学习算法进行学习了。根据输入标签，当它遇到更多数据时，它将不断学习并完善对卡车和自行车差异的理解。从这个简单的插图中，它将继续搜索它能够访问的数百万其他数据，以区分卡车和自行车的区别。


    ## 我们如何在深度学习中解决这个问题？


    深度学习中的方法与我们在机器学习中所做的不同。这里的优势是，在深度学习中，你不需要任何标记或结构化数据来帮助模型识别卡车和自行车。


    人工神经网络通过网络中不同的算法层来识别图像数据。每一层都会识别并定义照片中的特定特征。这是我们大脑在尝试解决某些问题时使用的相同方法。


    通常，大脑会考虑很多可能性，在排除掉所有错误的选项之前确定正确的选项。深度学习模型将通过多个层次过程处理查询以寻找解决方案。在每个识别层级，深度神经网络都会识别出有助于区分自行车和卡车的标识符。


    这是理解这两个系统如何运作的最简单方法。然而，深度学习和机器学习并不一定是区分这些照片的适用方法。当你学习这两个领域之间的区别时，你必须记住，在选择解决问题的最佳方法之前，你必须正确地定义问题。你将在机器学习之旅程更晚的阶段学习如何选择合适的方法，这在这一系列的高级书籍中已经涵盖了。


    从上述插图示例中，我们可以看到机器学习算法需要结构化数据来帮助它们区分卡车和自行车的区别。通过这些信息，它们在识别出分类器后就可以产生正确的输出。


    '
