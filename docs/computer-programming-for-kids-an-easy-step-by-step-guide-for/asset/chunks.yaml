- raw: "Whenever you see an indented line after defining a function, which is the\
    \ body of the function. The second line is known as a docstring, although it is\
    \ a comment and describes the purpose of the function. Docstring is usually enclosed\
    \ with three quotes. Furthermore, the third line prints the statement “Welcome\
    \ to Learning Programming.” This line contains the main message of the function.\
    \ This means the welcome user has the primary job of printing “Welcome to Learning\
    \ Programming.” \n\nIf you want to call a function, you have to write the function\
    \ name before following it with parentheses and a colon. Our program output will\
    \ be as follow: \n\n| Welcome to Learning Programming.  |\n\n| --- |\n\n## How\
    \ to Pass Information to a Function \n\nWe will modify our example to explain\
    \ how you can pass information to a function. We can do it in such a way that\
    \ the program will not only say “Welcome to Learning Programming” but also include\
    \ the user name. To do that, we have to request a user to enter their name.  \n\
    \n| def welcome user(name): “““Transmit a Welcome Message.”““ Print (“Welcome\
    \ to Learning Programming, {name.title()}!”) welcome user(“Thomas”)  |\n\n| ---\
    \ |\n\nWhen we enter welcome user (“Thomas”), it calls the function welcome user()\
    \ and passes the name “Thomas” to the function to execute the print command. With\
    \ this, our output will be: \n\n| Welcome to Learning Programming, Thomas!  |\n\
    \n| --- |\n\n## Arguments and Parameters \n\nWe defined a function, which requires\
    \ the user to input a value for the variable username. Immediately, you call the\
    \ function and assign a value to it; it prints the message in the print() function.\
    \ Our function has a variable inside it. The variable is an example of what a\
    \ parameter is in Program, whereas Thomas is the argument. Arguments are values\
    \ that contained information and pass from a function call to the function. For\
    \ instance, when we call the function, we placed a value inside the function.\
    \ In this scenario, our argument is “Thomas,” and we passed the information to\
    \ the function. \n\nNote: people interchangeably use both terms. Therefore, when\
    \ you see a definition of a function referred to as an argument or vice-versa.\
    \ \n\n## How to Pass an Argument in Program \n\nSince a function definition can\
    \ have several parameters, a function call may also require several arguments.\
    \ It means you can pass your argument to a function in multiple ways. You can\
    \ use either keyword argument or positional arguments. In the latter, the argument\
    \ must be of the same order as your parameter, whereas, in the former, each argument\
    \ comprises a variable name and its equivalent value. \n\n### Positional Arguments\
    \ \n\nThis argument is the simplest way of passing an argument in Program because\
    \ each argument in the function must match with a parameter in the function declaring\
    \ section. To see how this works, let us write a program that shows information\
    \ about animals. The function in this situation tells us the particular type of\
    \ animal and the name of the pet. \n\n| def animal\\_list(animal\\_kind, pet\\\
    _name): “““ Display Details About Animal.”““ print(f “\\\\nThis is a {animal\\\
    _kind}.”) print (f “My {animal\\_kind}’s name is {pet\\_name.title()}.”) animal\\\
    _list (“Cat,” “Lucy”)  |\n\n| --- |\n\nThe first block of line defines a function.\
    \ It indicates that the function requires a particular animal’s type and its pet\
    \ name. After defining the function, we provided the animal kind and pet name.\
    \ For instance, in the function call (animal\\_list), we assign Cat as animal\
    \ kind while Lucy is the pet’s name. Our output will display the detail about\
    \ the animal Cat with the pet name Lucy. \n\n| This is a Cat. My Cat’s name is\
    \ Lucy.  |\n\n| --- |\n\n### Calling Multiple Functions \n\nWe can call the function\
    \ as many times as we want. All we need is to add another parameter to our function.\
    \ Check the code below: \n\n| def animal\\_list(animal\\_kind, pet\\_name): “““\
    \ Display Details About Animal.”““ print(f “\\\\nThis is a {animal\\_kind}.”)\
    \ print (f “My {animal\\_kind}’s name is {pet\\_name.title()}.”) animal\\_list\
    \ (“Cat”, “Lucy”) animal\\_list (“Dog,” “Bruce”) animal\\_list (“Rat,” “Chase”)\
    \  |\n\n| --- |\n\nThe program follows the same sequence and performs the output.\
    \ However, in this situation, we added two more parameters to the list. Therefore,\
    \ our output will look like this: \n\n| This is a Cat. My Cat’s name is Lucy.\
    \ This is a Dog. My Dog’s name is Bruce. This is a Rat. My Rat’s name is Chase.\
    \  |\n\n| --- |\n\nCalling a function several times is an efficient way when you\
    \ have several parameters. The code about the details of the animal is written\
    \ once inside the function. However, whenever you want to describe a new animal,\
    \ all you need is to call the function by providing information about the animal. \
    \ \n\n### Keyword Arguments \n\nThis is a name/value pair, which you pass to a\
    \ function. You have to directly link the value and the variable name inside the\
    \ argument. With this, there won’t be any confusion when you pass the argument\
    \ to the function. Let’s rewrite our previous code using the keyword arguments\
    \ to call our animal\\_list() \n\n| def animal\\_list(animal\\_kind, pet\\_name):\
    \ “““ Display Details About Animal.”““ print(f “\\\\nThis is a {animal\\_kind}.”)\
    \ print (f “My {animal\\_kind}’s name is {pet\\_name.title()}.”) animal\\_list\
    \ (animal\\_kind =“Cat”, pet\\_name= “Lucy”) animal\\_list (pet\\_name= “Chase”,\
    \ animal\\_kind =“Rat”)  |\n\n| --- |\n\nOur first four lines haven’t changed.\
    \ However, there is a difference between the last two lines. When the interpreter\
    \ reads the fourth line, it calls the function and assigns the parameter Cat to\
    \ animal\\_kind and Lucy to pet\\_name, respectively. For the next line, it will\
    \ perform the same operation because the order doesn’t matter when dealing with\
    \ keyword arguments. Therefore, the last two lines of codes are equivalent and\
    \ produce the same output. Our program above will display: \n\n| This is a Cat.\
    \ My Cat’s name is Lucy. This is a Rat. My Rat’s name is Chase.  |\n\n| --- |\n\
    \nWhen using keyword arguments, ensure that the right parameter names are used\
    \ in the function definition to avoid any error. \n\n### Default Value \n\nBesides\
    \ using the keyword parameter and position argument, each parameter can have a\
    \ default value in a function. If you provide a parameter that is providing in\
    \ the function, Program uses the value. However, if there is no parameter value,\
    \ then Program uses a default value for the parameter. \n\n| def animal\\_list(pet\\\
    _name, animal\\_kind = “Cat”): “““ Display Details About Animal.”““ print(f “\\\
    \\nThis is a {animal\\_kind}.”) print (f “My {animal\\_kind}’s name is {pet\\\
    _name.title()}.”) animal\\_list (pet\\_name= “Lucy”)  |\n\n| --- |\n\nCompare\
    \ this program with the previous code. Did you notice anything from the first\
    \ and last line? Well, animal\\_list function is used to describe a particular\
    \ animal kind where we set the default value as Cat.  \n\n| I have a Cat. My name\
    \ is Lucy.  |\n\n| --- |\n\nObserve that the parameter order inside the function\
    \ definition must be changed since the default value makes it pointless to stipulate\
    \ the particular animal kind as an argument. Therefore, the only argument available\
    \ in the function is the name of the pet. \n\n### Basic Functions for Interactivity\
    \ \n\nIn this phase, we will name the two most important functions for interactivity\
    \ in Program, which are print(), standard output, on the other hand, the standard\
    \ input is input(), which we will explain below. \n\n## Standard Output \n\nThe\
    \ print() function is used to display information by the standard output that\
    \ normally corresponds to the computer screen. \n\nIn Program2, print is a reserved\
    \ word, while in Program3, print() is a function, so the content will be expressed\
    \ as a parameter within a function, or, said in another way, must be in parentheses.\
    \ \n\n![00011.jpeg](images/00001.jpeg)\n\nAs we can see in this simple example,\
    \ we make use of print and should appear in console two strings, both “Output”\
    \ and “The end”. "
