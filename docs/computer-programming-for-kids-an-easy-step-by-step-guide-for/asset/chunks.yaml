- raw: "Every conditional statement, such as the ‘if’ statement, ends with a colon\
    \ in Program to create a block of code that will execute under that colon. The\
    \ next line will begin with an indentation. Do not remove that indent as that\
    \ would cause confusion since I had already set the condition, which quite literally\
    \ reads as “If password\\_check is exactly the same as password” and now I added\
    \ the command that it needs to carry out if the condition is met. When you execute\
    \ this program, you will begin with the prompt asking you to choose a password.\
    \ That would be stored as a variable named password. Next, the prompt will ask\
    \ us to type in the password once again for verification or for login purposes.\
    \ Whatever we type here will be stored in a variable called password\\_check.\
    \ Now, Programs will compare the two values and see if the two are exactly alike.\
    \ If so, it will print out a success message. \n\nI am quite sure that you have\
    \ just tried to enter the wrong password deliberately. It ended the program altogether\
    \ without any warning, right? There is a reason for that. We have only defined\
    \ the ‘if’ condition. We never got to the part to define the ‘else’ condition.\
    \ \n\nThe ‘else’ condition is the final condition, and it usually comes into play\
    \ when the ‘if’ condition or others are not true and are not fulfilled. To do\
    \ that, we will add two lines of code beneath the first one. Now, the entire program\
    \ should look like this: \n\npassword = input(“Create a password: “) \n\nprint(“Welcome\
    \ to the portal”) \n\npassword\\_check = input(“Please enter your password: “)\
    \ \n\nif password\\_check == password: \n\nprint(“Successful! Welcome back!”)\
    \ \n\nelse: \n\nprint(“Sorry buddy! That’s a Nay!”) \n\nNotice how ‘else’ statement\
    \ needs no indentation here, and it does not require you to provide additional\
    \ conditions either. \n\nNow, I will run the code twice. Once correct and the\
    \ other incorrect, let us see how it works: \n\nCorrect password \n\nCreate a\
    \ password: 123 \n\nWelcome to the portal \n\nPlease enter your password: 123\
    \ \n\nSuccessful! Welcome back! \n\nIncorrect password \n\nCreate a password:\
    \ 123 \n\nWelcome to the portal \n\nPlease enter your password: 122 \n\nSorry\
    \ buddy! That’s a Nay! \n\nHere’s a question, what if there is more than one condition\
    \ to a statement? Suppose you are to choose a number between one to three and\
    \ then give an appropriate message, depending on the number the user chooses,\
    \ how would we do that?  \n\nprint(“Welcome to my little game”) \n\nnumber = int(input(“Choose\
    \ a number between 1-3: “)) \n\nif number == 1: \n\nprint(“You love to consider\
    \ yourself a leader, don’t you?”) \n\nelif number == 2: \n\nprint(“You hate being\
    \ alone, right?”) \n\nelif number == 3: \n\nprint(“The more, the merrier, is it?”)\
    \ \n\nelse: \n\nprint(“Really? You can’t follow simple instructions, can you?”)\
    \ \n\n Quite a familiar way to put things, but the only thing to note here is\
    \ the ‘elif’ statement. The ‘elif’ sits right between ‘if’ and ‘else’ where ‘if’\
    \ is the first condition, and ‘else’ is when no conditions are met. \n\nYes, I\
    \ know! It should’ve been named as ‘ifel,’ but then again, it is what it is! \n\
    \nTry it out yourself, check each of these with various numbers as your picks.\
    \ For a little fun, use any number greater than three and see what happens. \n\
    \nThis is how Programs handles conditional statements. If you are a bit of a gamer,\
    \ you may have seen various games where decisions can influence the outcome of\
    \ the game itself. Now you know the culprit! \n\nThere is no limit to the number\
    \ of ‘elif’ statements. You can create as many as you like. With that said, let’s\
    \ make this a little more interesting. \n\n## Nested Conditional (‘if’) statements\
    \ \n\nLet us assume that we use the same numbers as above, but this time, we wish\
    \ to add an ‘if’ statement within an ‘if’ statement. Let’s imagine that we want\
    \ out user to select another numeric value, this time in decimal numbers, only\
    \ if the user decides to choose the first value as the number. \n\nHave a look\
    \ at the code below and try to find out how the code will be executed. \n\nprint(“Welcome\
    \ to my little game”) \n\nnumber = int(input(“Choose a number between 1-3: “))\
    \ \n\nif number == 1: \n\nprint(“You love to consider yourself a leader, don’t\
    \ you?”) \n\nnumber2 = float(input(“Enter a number with a decimal figure between\
    \ 1 and 2: “ )) \n\nif number2 == 2.00: \n\nprint(“Okay! I meant a little lesser\
    \ than that!”) \n\nelif number < 1.50: \n\nprint(“Oh, come on! You can go higher!”)\
    \ \n\nelse: \n\nprint(“You know what, forget it!”) \n\n elif number == 2: \n\n\
    print(“You hate being alone, right?”) \n\nelif number == 3: \n\nprint(“The more,\
    \ the merrier, is it?”) \n\nelse: \n\nprint(“Really? You can’t follow simple instructions,\
    \ can you?”) \n\nWe created another variable within the first condition. If the\
    \ user decides to settle for one, the prompt will ask the user to enter another\
    \ number. We used the conversion here to convert the incoming number to afloat,\
    \ as it will have a decimal figure. \n\nWe then created another condition which\
    \ defines the upper limit and the lower limit. To add a little fun to it, there\
    \ is no correct number to choose from here. Regardless of what the user may choose,\
    \ they will either receive a message to state that they went a little too high,\
    \ or one that will encourage them to go higher. The rest will always leave the\
    \ user in a bit of a puzzled state. \n\nThis kind of conditional statement within\
    \ a conditional statement is called a Nested Statement. This entire block of code\
    \ can be avoided if the user decides to go for any other number than the triggering\
    \ point. \n\n## Execution\n\nWhen it comes to programming, iteration means the\
    \ repetition of lines of code. It’s an essential property in computer programming\
    \ that helps find solutions to problems. Iteration and conditional execution are\
    \ the main stems of algorithm development. \n\nLet us start with the:  \n\n###\
    \ While Statement \n\nSay you want to write a program that can count to 10,000,\
    \ how will you approach this problem? Will you sit down and write 10,000 printing\
    \ statements? Although you can, that is going to consume a lot of your time. However,\
    \ counting is frequent in computers, in fact, computers can count extraordinary\
    \ values. So, there must be a way out. What you need to do is to print the value\
    \ of a variable, and repeat the process until you reach 10,000. The method of\
    \ executing the same code repeatedly is known as looping. Program language has\
    \ two special statements, while and for, that handle iteration. \n\n# CHAPTER\
    \ 3:    \n\nFunctions, Input, Output\n\n## Functions\n\nI n this phase, you will\
    \ know how to write functions easily in a program. Functions are a line of codes,\
    \ which are designed to perform a particular job. When you want to write a program\
    \ that will perform a specific task, then you have to define the function and\
    \ call the function. Furthermore, I will teach you how to pass information to\
    \ functions and display them on the screen. \n\nAt times, the best way to explain\
    \ a thing is to provide an example. The program below is a welcome program that\
    \ prints a message. \n\n| def welcome\\_user(): “ “ “ Transmit a Welcome Message.”““\
    \ Print (“Welcome to Learning  Programming.”) welcome\\_user()  |\n\n| --- |\n\
    \nIn this example, it shows the simplest structure of how a function works. The\
    \ first line uses the keyword “def” to tell the interpreter that you want to define\
    \ a function. Therefore, whenever you see the word “def” and the word following\
    \ it, it signifies a function definition. The parenthesis does the job of holding\
    \ the information you need. Then after the parentheses, the function definition\
    \ ends with a colon.  "
