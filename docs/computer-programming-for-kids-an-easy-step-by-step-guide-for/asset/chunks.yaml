  trans: "\n\n需要处理异常的程序被封装在 `try` 结构中。`Except` 解释了当发生特定错误时程序应该如何响应。`Program, input()`\
    \ 是一个用于接收命令行输入的内置函数。`float()` 函数用于将其他类型的数据转换为浮点数。如果你输入一个字符串（例如“P”），它将不会转换为浮点数，而是触发\
    \ `ValueError`，相应的 `except` 块将运行属于它的程序代码。如果你输入 `0`，那么除以 `0` 将触发 `ZeroDivisionError`。这两个错误都由默认程序处理，因此程序不会终止。\n\
    \n异常处理的完整语法如下： \n\n```\ntry:\n    ... (在此处编写代码)\nexcept exception1:\n    ... (在此处编写代码)\n\
    except exception2:\n    ... (在此处编写代码)\nelse:\n    ... (在此处编写代码)\nfinally:\n  \
    \  ...\n```\n\n如果在 `try` 内部发生异常，该异常会被分配并执行 `except`。异常会层层检查它是否属于 `exception1`、`exception2`\
    \ 等，直到找到它所属的项，然后执行对应的 `except` 语句。如果 `try` 中没有异常，则 `except` 部分将跳过 `else` 语句的执行。`Finally`\
    \ 是你在最后执行的操作，无论是否发生异常。如果 `except` 后面没有跟参数，则所有异常都将由程序处理。\n\n# 第 13 章：收集你的数据\n\n\
    ![00017.jpg](img/00005.jpeg)\n\n我们首先需要看的是如何收集在数据科学中完成此类过程所需的数据。我们需要有机会去审阅并查看我们的数据，弄清楚那里存在哪些我们可以利用的数据，以及等等。但是，要确定从哪里获取这些数据、收集多少，以及什么类型的数据有助于我们更深入地了解客户和行业，这可能是困难的。\n\
    \n在过程中，关于我们使用的数据类型，有多到数不清的选择。我们需要确保挑选的是正确类型的数据，而不是仅仅因为数据存在且看起来是可以处理的就收集它。当我们能够按照需要的方式组织这些内容，并确保我们确实获取了优质数据时（即使它们在最初没有按照我们想要进行组织和结构化），这将是至关重要的。\n\
    \n这就是为什么我们在这个阶段将花一些时间探索我们能利用数据做什么，它将如何满足我们的需求，甚至你可以去哪些地方寻找你想要处理的数据。考虑到这些，我们需要直接深入其中！\n\
    \n## 了解你面临最大的业务问题\n\n![00025.jpg](img/00006.jpeg)\n\n那里有大量数据，如果你对如何处理这些信息没有计划或方向，那么在进行一些搜索后，很快就会发现自己掉进了这些信息的“爱兔子洞”。那里有很多优秀的数据，但如果你只是让它们引导你，而不是在你的面前拥有一条清晰的路径，你将面临许多问题，并且永远无法获得你所需的决策帮助。\n\
    \n如果你已经收集了数据，那么这个问题就不存在了，我们只需要从那里开始。你可以梳理你最大的业务问题，即你想要投入精力关注并解决的问题，然后对那里进行分类，看看你能做出哪些改变，以及从那个大型数据源中你的哪些数据将产生最大的影响。不要让数据引导你，而要有一条清晰的路径，否则你将面临很多问题。不要害怕留留某些数据以后，也不要让那些可能不使用的某些数据拖了你的后腿。在此期间，我们希望专注于获取最好的信息，这将确保你为未来的业务提供动力。即使留下了一些信息也没关系，如果你以后需要，你可能再回来找。\n\
    \n## 寻找数据的地方\n\n当我们考虑想要使用的数据时，需要考虑的下一件事是在哪里寻找和查看我们需要的数据。实际上，有很多不同的地方我们可以寻找，这通常取决于你希望从中获得什么。\n\
    \n但我们必须记住，我们今天收集的大多数数据并不是组织好的或结构化的。做好准备，你将需要采取步骤来确保你的数据按照你喜欢的方式组织，而且从长期来看，它们可能不像你希望的整洁。\n\
    \n当你能够寻找想要的数据时，你会发现你可以从网站（特别是如果你想使用网络爬虫）、社交媒体网站、或者你自己的问卷和焦点小组，以及那些可能收集了信息并在过程中帮助其他公司来获取数据。\n\
    \n你可能会发现，如果你能够从更独特的来源引入数据，这将使你在想要的工作中领先更远。只要你确保数据是高质量的并且确实符合你的需求，它将为你提供别人所没有的数据，并为你提供一些新的模式和见解。\n\
    \n## 数据存储何处？\n\n![00040.jpg](img/00007.jpeg)\n\n我们还需要考虑在过程中我们应该将正在处理的数据存储在何处。在这个过程中你会收集大量数据，你不可能只是让它们在没有目的的情况下闲置，或者不把它们放在安全可靠的地方。特别是当你处理的是你自己的数据、你从问卷和其他地方获得的数据时，这一点尤为真实。\n\
    \n"
