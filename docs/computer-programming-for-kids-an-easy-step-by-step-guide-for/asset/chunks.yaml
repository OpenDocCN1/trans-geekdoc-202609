    # 引言

    来到儿童计算机编程的世界。欢迎学习如何通过编程语言来告诉计算机做什么。编程并不像你想象的那么难，只要你操作得当，它非常有趣。在开始编程时，我们通常会写下一个简单的“Hello,
    World!”。编程是使用特定的语言来编写程序。在编写过程中，你需要一个编程环境来确保你的程序是可以执行的。在这里，我们将讨论 `Java`、`C++` 以及
    `SQL` 等语言。在编程过程中，初学者往往会遇到一些错误、遗漏或不准确之处，我们为你准备了一些实用的提示，帮助你理解这些问题。


    ## 编辑器

    编辑器是一种用于创建和修改文件的软件。在编程时，你需要根据操作系统选择编辑器。在 Windows 上，你可以使用 `Notepad`；在 Mac 上，你可以使用
    `BBEdit` 或 `TextEdit`。


    ## 编译器

    编译器是检查你的编程代码是否符合语法规则的程序。它会将你的代码转换为计算机可以理解的二进制格式。大多数编程语言（如 `C`、`Java` 和 `C++`）都需要编译，因此你可能需要安装相应的编译器。


    ## 解释器

    与上述语言不同，某些编程语言（如 `Python` 和 `Perl`）不需要编译器。相反，它们需要解释器。解释器是一种直接读取程序文件并在解析后执行代码的软件。如果你使用的是这类编程语言，请记得在系统中安装相应的解释器。


    # 第一章：

    ## 什么是编程语言以及流行的编程语言

    计算机语言主要分为三类：


    ## 机器语言

    这是计算机的默认语言，以二进制代码的形式表示原始指令。因此，如果你想指令计算机，必须使用二进制代码编写。


