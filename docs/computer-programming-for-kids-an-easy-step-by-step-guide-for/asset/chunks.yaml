    It is important to note that there are many occasions in which you have two variables
    that are strings, and sometimes, it is necessary to use both in the same print;
    therefore, we proceed to concatenate and print the two strings of characters together.


    ## Standard Input


    For `Program3`, the default function is `input()`, which is responsible for obtaining
    some input value entered by the user, it will have to be assigned to a variable,
    so you get a string. An important feature of this function is that you can also
    show a message on the screen, thus achieving to show users what they have to enter
    and that the programmer can write a message so that it tells what type of data
    has to be entered, for example, to tell the user that needs to enter a natural
    number for the calculation of the area of a rectangle, but to understand a little
    better this, it is important to look at the following example:


    ![00012.jpeg](images/00002.jpeg)


    In this example, we see that the variable that was initialized, `var1`, is equal
    to the entry that the user enters, it should be a number, since the function specifies
    the user to enter a number, the same entry is going to become a string, because
    the function `input()`, always return a string, and from there, you can make the
    calculations.


    Escape characters: These are some types of character combinations, which behave
    differently within the strings, as they allow us to do things we cannot do easily,
    such as a line break.


    | `\\` | `\\` |

    | --- | --- |

    | `\\’` | `‘` |

    | `\\’’` | `“` |

    | `\\a` | Sound |

    | `\\b` | ASCII regression |

    | `\\f` | Page advance |

    | `\\n` | Line break |

    | `\\r` | Carry Return |

    | `\\t` | Horizontal Tabulation |

    | `\\v` | Vertical Tabulation |

    | `\\ooo` | Octal value character |

    | `\\xhh` | Hexadecimal value character |


    Triple Quotes: They are used to place multiline character strings, this can be
    done with single triple quotes `‘‘text’’`, or triple double quotes `“‘‘text”““`
    an example of its use is as follows:


    ![00013.jpeg](images/00003.jpeg)


    In this example, we created the two variables, `string` and `string2`, we used
    both the triple single quotes and the triple-double quotes, in which we placed
    several line breaks, without the need to make escape characters, in this case
    without the `\\n`. Finally, we will print on the screen the concatenation of the
    variable `string` and `string2`.


    # CHAPTER 4: Web Programming


    This phase briefly explains web programming. The Internet is a basic entity for
    cores of people now. Explanation of web modularity with Program can help you to
    learn the subject better.


    ## HTTP Communication Protocol


    Communication is a wonderful thing. It allows information to be passed between
    individuals. The animals send out the chemical element and mating messages. People
    say sweet things to express their love to their lovers. The hunters whist and
    quietly rounded up their prey. The waiter barked to the kitchen for two sets of
    fried chicken and beer. Traffic lights direct traffic, television commercials
    broadcast, and the Pharaoh’s pyramids bear the curse of forbidden entry. With
    communication, everyone is connected to the world around them. In the mysterious
    process of communication, the individuals involved always abide by a specific
    protocol. In our daily conversation, we use a set grammar. If two people use different
    grammars, then they communicate with different protocols, and eventually, they
    don’t know what they’re talking about.


    Communication between computers is the transfer of information between different
    computers. Therefore, computer communication should also follow the Communication
    Protocol Conference. In order to achieve multi-level global Internet communication,
    computer communication also has a multi-level protocol system. `HTTP` Protocol
    is the most common type of network protocol. Its full name is the Hypertext Transfer
    Protocol.


    The `HTTP` protocol enables the transfer of files, especially hypertext. In the
    Internet age, it is the most widely used Internet Protocol. In fact, when we visit
    a Web site, we usually type an `HTTP URL` into the browser, such as `http://www.google.com`,
    for example, it says that you need to use the `HTTP` protocol to access your site.


    `HTTP` works as a fast-food order:


    1. Request: A customer makes a request to the waiter for a chicken burger.

    2. Response: The server responds to the request of the customer according to the
    situation.


    Depending on the situation, the waiter may respond in a number of ways, such as:


    * The waiter prepares the `Drumstick Burger` and hands it to the customer. (Everything
    is OK)

    * The waitress found herself working at the dessert stand. He sent his customers
    to the official counter to take orders. (Redirects)

    * The waiter told the customer that the `Drumstick hamburger` was out. (Cannot
    be found)


    When the transaction is over, the waiter puts the transaction behind him and prepares
    to serve the next customer.


    ```

    GET /start.html HTTP/3.0

    Host: www.mywebsite.com

    ```


    In the starting line, there are three messages:


    * `GET` method. Describes the operation that you want the server to perform.

    * `/start`. The path to the html resource. These points to the index on the server.
    HTML file.

    * `HTTP 3.0`. The first widely used version of `HTTP` was 3.0, and the current
    version is 3.3.


    The early `HTTP` protocol had only the `GET` method. Following the `HTTP` protocol,
    the server receives the `GET` request and passes the specific resource to the
    client. This is similar to the process of ordering and getting a Burger from a
    customer. In addition to the `GET` method, the most common method is the `POST`
    method. It is used to submit data from the client to the server, with the data
    to be submitted appended to the request. The server does some processing of the
    data submitted by the `POST` method. The sample request has a header message.
    The type of header information is `Host`, which indicates the address of the server
    you want to access.


    After receiving the request, the server will generate a response to the request,
    such as:


    ```

    HTTP/3.0 200 OK

    Content-type: text/plain

    Content-length: 10

    Jesus Christ

    ```


    The first line of the reply contains three messages:


    * `HTTP 3.0`: Protocol version

    * `200`: Status Code

    * `Ok`: Status Description


    `OK` is a textual description of the status code `200`, which is just for human
    readability. The computer only cares about three-digit status codes. Status Code,
    which is `200` here. `200` means everything is OK, and the resource returns normally.
    The status code represents the class that the server responded to.


    There are many other common status codes, such as:


    * `302`, Redirect: I don’t have the resources you’re looking for here, but I know
    another place where xxx does. You can find it there.

    * `404`, Not Found: I can’t find the resources you’re looking for.


    The next line, `Content-type`, indicates the type of resource that the body contains.
    Depending on the type, the client can start different handlers (such as displaying
    image files, playing sound files, and so on). `Content-length` indicates the length
    of the body part, in bytes. The rest is the body of the reply, which contains
    the main text data.


    Through an `HTTP transaction`, the client gets the requested resource from the
    server, which is the text here. The above is a brief overview of how the `HTTP`
    protocol works, omitting many details. From there, we can see how Program communicates
    with `HTTP`.


    ## http.client Package


    The `http.client` package can be used to make `HTTP` requests. As we saw, some
    of the most important information for `HTTP` requests are the `host address`,
    `request method`, and `resource path`. Just clarify this information, plus `HTTP`.
    With the help of the client package, you can make an `HTTP` request.


    Here is the code below in Python:


    ```python

    import http.client

    ```

