    \ if this works for yourself but declaring an instance of the Moped class and\
    \ trying it out.   \n\n## Abstraction   \n\nThe next major concept in object-oriented\
    \ programming is abstraction. This is the notion that the programmer and user\
    \ should be far from the inner workings of the computer. This has two benefits.  \
    \ \n\nThe first is that it decreases the inherent security risks and the possibility\
    \ for catastrophic system errors, by either human or otherwise. By abstracting\
