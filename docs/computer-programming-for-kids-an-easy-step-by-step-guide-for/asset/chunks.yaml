    \ the `if` condition. We never got to the part to define the `else` condition.\n\
    \nThe `else` condition is the final condition, and it usually comes into play\
    \ when the `if` condition or others are not true and are not fulfilled. To do\
    \ that, we will add two lines of code beneath the first one. Now, the entire program\
    \ should look like this:\n\n```python\npassword = input(“Create a password: “)\n\
    print(“Welcome to the portal”)\npassword_check = input(“Please enter your password:\
    \ “)\nif password_check == password:\n    print(“Successful! Welcome back!\")\n\
    else:\n    print(“Sorry buddy! That’s a Nay!\")\n```\n\nNotice how `else` statement\
    \ needs no indentation here, and it does not require you to provide additional\
    \ conditions either.\n\nNow, I will run the code twice. Once correct and the other\
    \ incorrect, let us see how it works:\n\nCorrect password\n```\nCreate a password:\
    \ 123\nWelcome to the portal\nPlease enter your password: 123\nSuccessful! Welcome\
    \ back!\n```\n\nIncorrect password\n```\nCreate a password: 123\nWelcome to the\
    \ portal\nPlease enter your password: 122\nSorry buddy! That’s a Nay!\n```\n\n\
    Here’s a question, what if there is more than one condition to a statement? Suppose\
    \ you are to choose a number between one to three and then give an appropriate\
    \ message, depending on the number the user chooses, how would we do that?\n\n\
    ```python\nprint(“Welcome to my little game”)\nnumber = int(input(“Choose a number\
    \ between 1-3: “))\nif number == 1:\n    print(“You love to consider yourself\
    \ a leader, don’t you?”)\nelif number == 2:\n    print(“You hate being alone,\
    \ right?”)\nelif number == 3:\n    print(“The more, the merrier, is it?”)\nelse:\n\
    \    print(“Really? You can’t follow simple instructions, can you?”)\n```\n\n\
    Quite a familiar way to put things, but the only thing to note here is the `elif`\
    \ statement. The `elif` sits right between `if` and `else` where `if` is the first\
    \ condition, and `else` is when no conditions are met.\n\nYes, I know! It should’ve\
    \ been named as `ifel`, but then again, it is what it is!\n\nTry it out yourself,\
    \ check each of these with various numbers as your picks. For a little fun, use\
    \ any number greater than three and see what happens.\n\nThis is how Programs\
    \ handles conditional statements. If you are a bit of a gamer, you may have seen\
    \ various games where decisions can influence the outcome of the game itself.\
    \ Now you know the culprit!\n\nThere is no limit to the number of `elif` statements.\
    \ You can create as many as you like. With that said, let’s make this a little\
    \ more interesting.\n\n## Nested Conditional (`if`) statements\n\nLet us assume\
    \ that we use the same numbers as above, but this time, we wish to add an `if`\
    \ statement within an `if` statement. Let’s imagine that we want out user to select\
    \ another numeric value, this time in decimal numbers, only if the user decides\
    \ to choose the first value as the number.\n\nHave a look at the code below and\
    \ try to find out how the code will be executed.\n\n```python\nprint(“Welcome\
    \ to my little game”)\nnumber = int(input(“Choose a number between 1-3: “))\n\
    if number == 1:\n    print(“You love to consider yourself a leader, don’t you?”)\n\
    \    number2 = float(input(“Enter a number with a decimal figure between 1 and\
    \ 2: “ ))\n    if number2 == 2.00:\n        print(“Okay! I meant a little lesser\
    \ than that!”)\n    elif number < 1.50:\n        print(“Oh, come on! You can go\
    \ higher!”)\n    else:\n        print(“You know what, forget it!”)\nelif number\
    \ == 2:\n    print(“You hate being alone, right?”)\nelif number == 3:\n    print(“The\
    \ more, the merrier, is it?”)\nelse:\n    print(“Really? You can’t follow simple\
    \ instructions, can you?”)\n```\n\nWe created another variable within the first\
    \ condition. If the user decides to settle for one, the prompt will ask the user\
    \ to enter another number. We used the conversion here to convert the incoming\
    \ number to afloat, as it will have a decimal figure.\n\nWe then created another\
    \ condition which defines the upper limit and the lower limit. Regardless of what\
    \ the user may choose, they will either receive a message to state they went a\
    \ little too high, or one that will encourage them to go higher. The rest will\
    \ always leave the user in a bit of puzzled state.\n\nThis kind of conditional\
    \ statement within a conditional statement is called a Nested Statement.\n\n##\
    \ Execution\n\nWhen it comes to programming, iteration means the repetition of\
    \ lines of code. It’s an essential property in computer programming that helps\
    \ find solutions to problems. Iteration and conditional execution are the main\
    \ stems of algorithm development.\n\nLet us start with the:\n\n### While Statement\n\
    \nSay you want to write a program that can count to 10,000, how will you approach\
    \ this problem? Will you sit down and write 10,000 printing statements? Although\
    \ you can, that is going to consume a lot of your time. However, counting is frequent\
    \ in computers, in fact, computers can count extraordinary values. So, there must\
    \ be a way out. What you need to do is to print the value of a variable, and repeat\
    \ the process until you reach 10,000. The method of executing the same code repeatedly\
    \ is known as looping. Program language has two special statements, `while` and\
    \ `for`, that handle iteration.\n\n# CHAPTER 3: Functions, Input, Output\n\n##\
    \ Functions\n\nIn this phase, you will know how to write functions easily in a\
    \ program. Functions are a line of codes, which are designed to perform a particular\
    \ job. When you want to write a program that will perform a specific task, then\
    \ you have to define the function and call the function. Furthermore, I will teach\
    \ you how to pass information to functions and display them on the screen.\n\n\
    At times, the best way to explain a thing is to provide an example. The program\
    \ below is a welcome program that prints a message.\n\n```python\ndef welcome_user():\n\
    \    \"\"\"Transmit a Welcome Message.\"\"\"\n    print(\"Welcome to Learning\
    \ Programming.\")\n\nwelcome_user()\n```\n\nIn this example, it shows the simplest\
    \ structure of how a function works. The first line uses the keyword `def` to\
    \ tell the interpreter that you want to define a function. Therefore, whenever\
    \ you see the word `def` and the word following it, it signifies a function definition.\
    \ The parenthesis does the job of holding the information you need.\n"
  trans: "\n\n每个条件语句，例如 `if` 语句，在程序中都以冒号结尾，以此创建一个在该冒号下执行的代码块。下一行将从缩进开始。不要删除该缩进，否则会引起混淆，因为我已经设置了条件，该条件的字面意思是“如果\
    \ `password_check` 与 `password` 完全相同”，而现在我添加了当条件满足时，它需要执行的命令。当你运行这个程序时，将会看到一个提示，让你选择一个密码。这将被存储在一个名为\
    \ `password` 的变量中。接下来，提示将要求我们再次输入密码以验证或登录。我们在这里输入的任何内容都将存储在一个名为 `password_check`\
    \ 的变量中。现在，程序将比较这两个值，并查看它们是否完全相同。如果是，它将打印出一条成功消息。\n\n我很确定，你刚刚是故意尝试输入错误的密码。程序在没有任何警告的情况下就直接结束了，对吧？这是有原因的。我们只定义了\
    \ `if` 条件，一直还没有到定义 `else` 条件的部分。\n\n`else` 条件是最后一个条件，它通常在 `if` 条件或其他条件不成立且不满足时起作用。为了做到，我们将在第一行代码下面添加两行代码。现在，整个程序看起来应该是这样的：\n\
    \n```python\npassword = input(“Create a password: “)\nprint(“Welcome to the portal”)\n\
    password_check = input(“Please enter your password: “)\nif password_check == password:\n\
    \    print(“Successful! Welcome back!\")\nelse:\n    print(“Sorry buddy! That’s\
    \ a Nay!\")\n```\n\n注意 `else` 语句在这里不需要缩进，它也不要求你提供额外的条件。\n\n现在，我将运行两次代码。一次正确，一次错误，让我们看看它是如何工作的：\n\
    \n正确密码\n```\nCreate a password: 123\nWelcome to the portal\nPlease enter your\
    \ password: 123\nSuccessful! Welcome back!\n```\n\n错误密码\n```\nCreate a password:\
    \ 123\nWelcome to the portal\nPlease enter your password: 122\nSorry buddy! That’s\
    \ a Nay!\n```\n\n这里有一个问题，如果一个语句有多个条件该怎么办？假设让你从一到三之间选择一个数字，然后根据用户选择的数字给出适当的消息，我们该如何做呢？\n\
    \n```python\nprint(“Welcome to my little game”)\nnumber = int(input(“Choose a\
    \ number between 1-3: “))\nif number == 1:\n    print(“You love to consider yourself\
    \ a leader, don’t you?”)\nelif number == 2:\n    print(“You hate being alone,\
    \ right?”)\nelif number == 3:\n    print(“The more, the merrier, is it?”)\nelse:\n\
    \    print(“Really? You can’t follow simple instructions, can you?”)\n```\n\n\
    这种表述方式非常熟悉，但这里需要注意的是 `elif` 语句。`elif` 位于 `if` 和 `else` 之间，其中 `if` 是第一个条件，而 `else`\
    \ 是在所有条件都不满足时。\n\n是的，我知道！它应该被命名为 `ifel`，但话虽如此，它就是这样！\n\n你自己试试看，用不同的数字来检查其中的每一项。为了好玩，可以使用任何大于三的数字，看看会发生什么。\n\
    \n这就是程序处理条件语句的方式。如果你是个游戏玩家，你可能见过各种决策可以影响游戏结果的游戏。现在你知道罪魁祸首了！\n\n`elif` 语句的数量没有限制。你可以根据需要创建任意多个。话虽如此，让我们让它更有趣一点。\n\
    \n## 嵌套条件 (`if`) 语句\n\n假设我们使用上述相同的数字，但这次我们希望在一个 `if` 语句中嵌套另一个 `if` 语句。想象我们让用户选择另一个数值（这次是小数），但仅当用户决定选择第一个值作为数字时。\n\
    \n看看下面的代码，并尝试找出代码是如何执行的。\n\n```python\nprint(“Welcome to my little game”)\nnumber\
    \ = int(input(“Choose a number between 1-3: “))\nif number == 1:\n    print(“You\
    \ love to consider yourself a leader, don’t you?”)\n    number2 = float(input(“Enter\
    \ a number with a decimal figure between 1 and 2: “ ))\n    if number2 == 2.00:\n\
    \        print(“Okay! I meant a little lesser than that!”)\n    elif number <\
    \ 1.50:\n        print(“Oh, come on! You can go higher!”)\n    else:\n       \
    \ print(“You know what, forget it!”)\nelif number == 2:\n    print(“You hate being\
    \ alone, right?”)\nelif number == 3:\n    print(“The more, the merrier, is it?”)\n\
    else:\n    print(“Really? You can’t follow simple instructions, can you?”)\n```\n\
    \n我们在第一个条件内部创建了另一个变量。如果用户决定选择 1，提示将要求用户输入另一个数字。我们在这里使用了转换，将输入的数字转换为浮点数，因为它带有小数部分。\n\
    \n然后我们又创建了另一个条件来定义上限和下限。无论用户选择什么，他们都会收到一个表示他们得太高的消息，或者一个鼓励他们继续更高的消息。其余部分将始终用户感到有些困惑。\n\
    \n这种位于条件语句中的条件语句被称为嵌套语句（Nested Statement）。\n\n## 执行\n\n在编程中，迭代意味着代码行的重复。它是计算机编程中的一项重要属性，有助于找到问题的解决方案。迭代和条件执行是算法开发的主干。\n\
    \n让我们从这里开始：\n\n### While 语句\n\n假设你想写一个可以数到 10,000 的程序，你会如何处理这个问题？你会坐下来写 10,000\
    \ 条打印语句吗？虽然你可以这样做，但那将消耗大量时间。然而，计数在计算机中非常频繁，事实上，计算机可以计算极值。所以，一定有办法。你需要的是打印变量的值并重复这个过程直到达到\
    \ 10,000。重复执行相同代码的方法被称为循环。程序语言有两种特殊的语句，`while` 和 `for`，用于处理迭代。\n\n# 第 3 章：函数、输入、输出\n\
    \n## 函数\n\n在这个阶段，你将学会如何在程序中轻松地编写函数。函数是一行代码，设计用于执行特定的任务。当你想要编写一个执行特定任务的程序时，你必须定义函数并调用函数。此外，我将教你如何向函数传递信息并将其显示在屏幕上。\n\
    \n有时，解释某事的最好方法是提供示例。下面的程序是一个打印消息的欢迎程序。\n\n```python\ndef welcome_user():\n   \
    \ \"\"\"Transmit a Welcome Message.\"\"\"\n    print(\"Welcome to Learning Programming.\"\
    )\n\nwelcome_user()\n```\n\n这个示例展示了函数工作的最简单结构。第一行使用 `def` 关键字告诉解释器你想定义一个函数。因此，每当你看到\
    \ `def` 单词以及随后的单词时，它就代表一个函数定义。括号负责持有你所需的信息。\n\n"
