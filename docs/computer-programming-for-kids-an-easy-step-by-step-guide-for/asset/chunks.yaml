    `Apache Software Foundation` 的产品，最初于 2018 年 5 月发布。此外，它是一种开源办公效率软件，且易于使用，因为它包含了所有其他文件格式，获取后即可立即使用，并受到数千名爱好者的支持。


    ## 使用 PostgreSQL


    `PostgreSQL` 也称为 `Postgre`，另一种免费开源的关系型数据库管理系统（RDBMS），旨在处理从个人计算机到商业用途的大型负载。它专注于扩展性，技术标准主要为
    Mac 用户创建。然而，也提供了 `Linux`、`Windows` 和其他操作系统的版本。`PostgreSQL` 最初于 1996 年 7 月引入市场，由
    `PostgreSQL Global Development Group` 开发。作为一种数据库管理系统，该软件允许事务隔离以及数据处理的原子性和一致性。开发始于
    1982 年，目前的修改允许用户友好的界面，适合添加对于 `Python`、`JavaScript` 和 `C/C+` 等编程语言至重要的自定义函数。


    ## 使用 Adobe ColdFusion


    `ColdFusion` 最初于 1995 年发布，是一种主要用于 Web 应用开发的商业软件。它由 `J. J. Allaire` 创建并由 `Adobe
    Systems Incorporated` 增强，作为一种编程语言用于将 `HTML` 页面链接到数据库，并在 1996 年包含了 `IDE`。使用 `Adobe
    ColdFusion` 允许你体验一个充满独特功能的新系统，用于处理不同类型的数据。它伴随着表达丰富且强大的功能，与其他编程语言相比，使现代 Web 软件的创建和设计效率提高。作为一种数据库管理系统，`Adobe
    ColdFusion` 允许用户访问简化的数据库，并伴有其他优势，如客户端/服务器管理、代码生成和操作图形等。


    ## 使用 PHP


    `Hypertext Preprocessor`（超文本处理器）是由 `Rasmus Lerdorf` 在 1994 年设计的多用途脚本计算机语言，并于 1995
    年发布。它之前被称为 `Personal Home Pages`（个人主页），用于开发静态和动态网站以及 Web 应用。由 `PHP` 创建和设计的脚本只能由安装了
    `PHP` 程序的服务器读取和解释。使用 `PHP` 是学习如何编写值的方法之一，这导致了更新版本的 Web 应用开发。`PHP` 运行在 Web 服务器、命令行、客户端图形用户界面上，并受各种
    Web 托管平台的支持。这种方式使用户在使用 `PHP` 工作时能够方便地操作、构建、自定义并拥有自己的扩展。


    ## 使用 IBM Db2


    `Db2` 是由 `IBM` 开发的一组服务器等数据库产品，首次于 1993 年发布。它兼容用 `C/C+`、`Java` 和汇编语言编写的 `Linux`、`Windows`
    和 `UNIX` 操作系统。它支持不同的功能，包括对象关系和非关系型特征，如 `XML`。与 `SQL` 相比，`Db2` 也伴随着表，但包含了对象，例如索引（重要的数据容器），例如，表的表空间。虽然
    `SQL` 是一种关注访问关系型数据库中数据表的标准计算机编程工具；但 `Db2` 家族由数据库、仓库、`BigSQL`、事件存储和面向云的对象（如云端仓库）组成。使用
    `IBM Db2` 允许。


    ## 使用 Oracle Express


    `Oracle Express` 是 `Oracle Corporation` 开发于 2004 年发布的 Web 软件。它支持 `Linux`、`Scolaris`
    和 `HP-UX` 等不同的操作系统。`Oracle Express` 用于现代 Web 应用并包含系统命令。作为用户，`Oracle Express` 对于数据组织至关重要。使用
    `Oracle Express` 允许用户访问数据库主页。


    ## 使用 MariaDB


    `MariaDB` 是 2009 年 10 月发布的 `MySQL` 形式的关系管理系统。`MariaDB` 设计为与 `MySQL` 高度兼容。然而，由于最近的更新，`MariaDB`
    比 `MySQL` 快得多且更安全。此外，你可以整合来自 `MariaDB` 的数据。


    ## 使用 MySQL


    `MySQL` 是另一种由 `Michael Widenius` 联合创立的利用 `SQL` 编程概念的开源关系型数据库管理系统（RDBMS）。`MySQL`
    用于 `Facebook`、`YouTube` 和 `Flickr` 等不同的流行网站，以及 `phpBB`、`WordPress` 和 `Drupal`
    等数据库驱动的 Web 程序。初始版本于 1995 年 5 月发布，用 `C` 和 `C++` 编写。要使用 `MySQL` 数据库，最初需要安装该应用程序。


    ## 使用 Microsoft Access


    `Microsoft Access` 由 `Microsoft` 开发、设计和修改，首次于 1992 年 11 月发布。由于它可以链接并访问存储在其他程序和数据库中的数据，该应用程序已普及并主要用于个人使用。`Microsoft
    access` 仍然受到 `Visual Basic for Applications` 和 `ActiveX Data Objects` 的支持。


    ## 使用 Microsoft SQL Server


    `Microsoft` 还整合了 `Microsoft SQL Server`，另一种作为数据存储产品的关系型数据库管理系统。不同的受众在小型和大型面向网络的程序中使用该软件。`Microsoft
    SQL Server` 最初于 1989 年 4 月发布，目前提供不同的版本以适应各种需求，如 `web`、`enterprise`、`express` 和
    `business intelligence`。还存在特殊版本，包括 `azure`、`fast track`、`compact (SQL CE)` 和分析平台系统，以及不连续的版本如
    `MSDE`、`personal edition` 和 `datacenter`。


