    \ over the years. The attention towards these frameworks especially comes from\
    \ the fact that many of the leading tech companies in the world have seamlessly\
    \ implemented them in their products, and integrated them into human existence.\
    \ You interact with these models all the time on a daily basis.  \n\nMachine Learning\
    \ and Deep Learning do share a number of features, but they are not the same.\
    \ Just as is the case with comparing these two with artificial intelligence. In\
    \ your capacity as a beginner, it is important to learn the difference between\
    \ these studies, so that you can seek and find amazing opportunities that you\
    \ can exploit and use to further your skills in the industry. In a world that\
    \ is continually spiraling towards increased machine dependency, there are many\
    \ job openings in Machine Learning and Deep Learning at the moment. There will\
    \ be so much more in the near future too, as people rush to adapt and integrate\
    \ these systems into their daily operations and lives. \n\n## Deep Learning vs.\
    \ Machine Learning \n\nBefore we begin, it is important that you remind yourself\
    \ of the basic definitions or explanations of these two subjects. Machine Learning\
    \ is a branch of artificial intelligence that uses algorithms to teach machines\
    \ how to learn. Further from the algorithms, the Machine Learning models need\
    \ input and output data from which they can learn through interaction with different\
    \ users. \n\nWhen building such models, it is always advisable to ensure that\
    \ you build a scalable project that can take new data when applicable and use\
    \ it to keep training the model and boost its efficiency. An efficient Machine\
    \ Learning model should be able to self-modify without necessarily requiring your\
    \ input, and still provide the correct output. It learns from structured data\
    \ available and keeps updating itself.  \n\nDeep Learning is a class of Machine\
    \ Learning that uses the same algorithms and functions used in Machine Learning.\
    \ However, Deep Learning introduces layered computing beyond the power of algorithms.\
    \ Algorithms in Deep Learning are used in layers, with each layer interpreting\
    \ data in a different way. The algorithm network used in Deep Learning is referred\
    \ to as Artificial Neural Networks. \n\nThe Name Artificial Neural Networks gives\
    \ us the closest iteration of what happens in Deep Learning frameworks. The goal\
    \ here is to try and mimic the way the human brain functions, by focusing on the\
    \ neural networks. Experts in Deep Learning Sciences have studied and referenced\
    \ different studies on the human brain over the years, which has helped spearhead\
    \ research into this field. \n\n## Problem Solving Approaches \n\nLet’s consider\
    \ an example to explain the difference between Deep Learning and Machine Learning.\
    \ \n\nSay you have a database that contains photos of trucks and bicycles. How\
    \ can you use Machine Learning and Deep Learning to make sense of this data? At\
    \ first glance, what you will see is a group of trucks and bicycles. What if you\
    \ need to identify photos of bicycles separately from trucks using these two frameworks?\
    \ \n\nTo help your Machine Learning algorithm identify the photos of trucks and\
    \ bicycles based on the categories requested, you must first teach it what these\
    \ photos are about. How does the Machine Learning algorithm figure out the difference?\
    \ After all, they almost look alike. \n\nThe solution is in a structured data\
    \ approach. First, you will label the photos of bicycles and trucks in a manner\
    \ that defines different features that are unique to either of these items. This\
    \ is sufficient data for your Machine Learning algorithm to learn from. Based\
    \ on the input labels, it will keep learning and refine its understanding of the\
    \ difference between trucks and bicycles as it encounters more data. From this\
    \ simple illustration, it will keep searching through millions of other data it\
    \ can access to tell the difference between trucks and bicycles. \n\n## How Do\
    \ We Solve This Problem in Deep Learning? \n\nThe approach in Deep Learning is\
    \ different from what we have done in Machine Learning. The benefit here is that\
    \ in Deep Learning, you do not need any labelled or structured data to help the\
    \ model identify trucks from bicycles. \n\nThe artificial neural networks will\
    \ identify the image data through the different algorithm layers in the network.\
    \ Each of the layers will identify and define a specific feature in the photos.\
    \ This is the same method that our brains use when we try to solve some problems. \
    \ \n\nGenerally, the brain considers a lot of possibilities, ruling out all the\
    \ wrong ones before settling on the correct one. Deep Learning Models will pass\
    \ queries through several hierarchical processes to find the solution. At each\
    \ identification level, the deep neural networks recognize some identifiers that\
    \ help in distinguishing bicycles from trucks. \n\nThis is the simplest way to\
    \ understand how these two systems work. Both Deep Learning and Machine Learning,\
    \ however, might not necessarily be applicable methods to tell these photos apart.\
    \ As you learn about the differences between these two fields, you must remember\
    \ that you have to define the problem correctly, before you can choose the best\
    \ approach to implement in solving it. You will learn how to choose the right\
    \ approach at a later stage in your journey into Machine Learning, which has been\
    \ covered in the advanced books in this series. \n\nFrom the example illustrated\
    \ above, we can see that Machine Learning Algorithms need structured data to help\
    \ them tell the difference between trucks and bicycles. From this information,\
    \ they can then produce the correct output after identifying the classifiers. "
