- raw: "The primary key plays a significant role in databases as it acts as a record\
    \ number or ID for easy identification and remembrance when you view the page\
    \ later. As such, it highly recommended creating these keys in the first column.\
    \ There are many ways to do this and include entering the ID in the column field\
    \ by typing ‘int’ and deselecting the ‘Allow Nulls.’ Select the key icon found\
    \ in the toolbar and marks it as the Primary key. \n\n### Step 7: Structure the\
    \ Tables \n\nTables typically have multiple columns, also referred to as fields,\
    \ and each column represents one element of data entries. When creating your table,\
    \ you initially structured it to fit the number of data entries, therefore essential\
    \ for each dataset as other primary keys. Thus, the structuring process will entail\
    \ identifying each column with a given set of data. For example, First name column,\
    \ Last name, and address column, among others.   \n\n### Step 8: Creating Other\
    \ Columns \n\nImmediately you create the columns for primary keys; you will notice\
    \ that there appear more columns below it. These are not for primary keys but\
    \ essential for the insertion of other information. As such, ensure you input\
    \ the correct data for each column to avoid filling the table with the wrong information.\
    \ In the column, you will enter the ‘nchar,’ which is a data type for text, ‘int’\
    \ used for whole numbers, and ‘decimal’ for storage of decimal numbers. \n\n###\
    \ Step 9: Saving the Table \n\nAfter you finish creating the content in each field,\
    \ you will notice that your table will consist of rows and columns. However, you\
    \ will need to first save the table before entering the information. This can\
    \ be done by selecting the Save icon also in the toolbar and name your table.\
    \ When naming your table, ensure that you create a name that you can easily relate\
    \ to the content or recognize. Besides, databases with different tables should\
    \ have different names so that they can be identified easily. \n\n### Step 10:\
    \ Add Data \n\nOnce the table is saved, you can now add the data into the system\
    \ feeding each field with relevant information. However, you can confirm if the\
    \ table is saved by expanding the Tables Folder and try to see if our table name\
    \ is listed. If not, use the Table Folder to refresh the tables, and you will\
    \ see your table. Back in the table, Right-click on the table where a drop dialog\
    \ box will appear and select ‘Edit Top 200 Rows’. The Window will then display\
    \ fields for you to add data but ignore the primary keys as they will fill automatically.\
    \ Continue with the same process until when you enter the last data in the table. \
    \ \n\n### Step 11: Running the Table \n\nAfter you have finished working on the\
    \ table, you have to save the content so that you do not lose your work. As the\
    \ table is already saved, click on ‘Execute SQL’ on the toolbar when you have\
    \ finished entering data, and it will execute the process of feeding each data\
    \ you entered into the columns. The parsing process may take a few seconds, depending\
    \ on a load of data. If there are any errors in the feeding process, the system\
    \ will show you where you input data incorrectly. More so, you can execute the\
    \ program parsing of all the data by using the combination of ‘ctrl’ and ‘R.’\
    \ \n\n### Step 12: Data Querying \n\nAt this step, you have created your first\
    \ database and table and successfully saved the information through SQL language\
    \ programming. The database is now fully functional, and you henceforth create\
    \ more tables within a single database. However, there is a limit on how many\
    \ tables per database, but many users do not worry about this rule. You can, therefore,\
    \ create new database systems you want and create more tables. At this end, you\
    \ can query your data for reports or any relevant purposes, such as organizational\
    \ or administrative purposes. Often, having a general idea of SQL programming,\
    \ especially for putting it into practice in creating databases and tables, allows\
    \ you to advance your learning skills. \n\n## Creating Your First Database and\
    \ Table Using Command Line \n\nYou use SQL commands and statements to create databases\
    \ and tables. The same applies to SQL Server Management Studio like the above\
    \ guide, but commands and statements are used to give instructions to the system\
    \ to perform a given function. As to build your first database, you use the command’\
    \ SELECT DATABASE (database\\_name)’ and hitting the execute button to create\
    \ the program. The message on the screen should, therefore, be ‘Command(s) completed\
    \ successfully,’ showing that your database has been created. \n\nAs to use the\
    \ database, run the command ‘USE (database\\_name),’ which tells the query window\
    \ to run the new database program. On the other hand, creating a new table entails\
    \ running the command ‘CREATE TABLE (table\\_name).’ Entering data follows the\
    \ command ‘INSERT DATA INTO (table\\_name), VALUES (table\\_name),’ and repeating\
    \ the same process for all the datasets you have. The same also allows for viewing\
    \ the data you saved and includes the command format ‘SELECT \\* FROM (table\\\
    _name). ‘ All the above commands are the critical ones when it comes to maneuvering\
    \ through different SQL databases. As such, it is always essential to learn about\
    \ each SQL basic commands to execute programs readily.  \n\n# CHAPTER 11:    \n\
    \nWorking with Popular Apps  \n\nM achines have different applications that run\
    \ independently or dependent on other programs without damaging other programs\
    \ in the system unless triggered. When you open one app, for instance, it tends\
    \ to perform its essential functions with limited hindrance to other programs\
    \ already running. This phase will then discuss popular applications used as programming\
    \ language tools, especially in database management systems. You should note that\
    \ computer applications come from different developers, with some designing more\
    \ than one, such as significant companies like Microsoft. Therefore, using various\
    \ computer programs tend to differ more so on functionality and design. \n\n##\
    \ Using SQLite \n\nUnlike other database management systems, SQLite is a relational\
    \ database system (RDBMS) but not a client-server database. The software program\
    \ was developed by Richard Hipp and first released in August 2000. SQLite is crucial\
    \ as an embedded database application essential as a storage application for both\
    \ client and local on platforms such as web browsers. As such, it is mostly used\
    \ in database engines as it readily binds to different programming languages.\
