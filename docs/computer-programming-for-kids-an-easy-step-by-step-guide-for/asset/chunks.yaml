- raw: "There are two popular types of search algorithms: breadth-first search as\
    \ used in group data structures and binary search used in linear data structures.\
    \ Binary searches are recommended when you need an efficient search on a dataset\
    \ that is sorted. The concept here is to continually halve the dataset until you\
    \ narrow your options down to a solitary item. A common use of this algorithm\
    \ is when you search for the name of a film in an assorted list of movies. The\
    \ algorithm conducts a binary search by string matching to deliver the right result.\
    \ \n\nThe search algorithm comes in handy in your map when you need to find the\
    \ shortest possible route from one point to the other, especially if you have\
    \ many options. It is also used to create intelligent bots in AI. Search engines\
    \ are some of the biggest users of search algorithms, by trawling the internet\
    \ for appropriate results before they are displayed. \n\n## String Matching and\
    \ Parsing \n\nOne of the biggest problems you will solve in your life as a software\
    \ programmer is pattern searching and matching. To do this, you need proper knowledge\
    \ of the following: \n\n*   String matching (KMP algorithm) \n\nThe Knuth-Morris-Pratt\
    \ (KMP) algorithm is applicable in instances where you need to match short patterns\
    \ in long strings. One common example is executing a Ctrl+F command for a keyword.\
    \ Basically, what you are doing is pattern matching the keyword pattern all through\
    \ the document.\n\n*   String parsing (Regular expression) \n\nYou will also learn\
    \ to parse over predefined restrictions to validate strings in development, especially\
    \ for parsing and matching URLs in web development. \n\n## Hashing Algorithms\
    \ \n\nHash algorithms are some of the most popular algorithms used today, especially\
    \ when looking for a specific ID or key in reference to some dataset. Data retrieved\
    \ through hashing algorithms is identified by its unique index. Before hashing\
    \ algorithms were available, such searches were conducted through a combination\
    \ of binary and sorting search algorithms. \n\nHashing algorithms help you search\
    \ a list of items to determine whether a specific value is already present within.\
    \ Routers also use this algorithm to identify and store IP addresses of devices\
    \ connected to it. This way, no two devices can be assigned the same IP address\
    \ on the network. \n\n## Dynamic Programming \n\nDynamic programming algorithms\
    \ help you solve problems by breaking down the complex concerns into smaller discernable\
    \ units. Once this is done, each small unit is solved independently of the others,\
    \ and the solutions stored to memory. Once all the small units are solved, the\
    \ solutions help you work your way up to the ultimate solution to the complex\
    \ problem that necessitated the algorithm. \n\nThink about it this way, when you\
    \ write down 2+2+2+2+2, you know the answer is 10. If you add another +2 at the\
    \ end, you immediately calculate that the answer is 12. You arrive at 12 so fast\
    \ because in your memory, you already know the answer to the first set, so you\
    \ only need to add one set of 2. This is how a dynamic programming algorithm works.\
    \ \n\n## Primality Testing Algorithms \n\nIn order to figure out whether some\
    \ random number is a prime number or not, you can use probabilities or deterministic\
    \ methods. This algorithm is commonly used in cryptography, especially in encryption\
    \ and decryption. They are also used in hash tables as hash functions. \n\n##\
    \ Exponentiation by Squaring \n\nTry calculating 232. By default, you must perform\
    \ 32 calculations involving the number 2. This is too much work. However, through\
    \ this algorithm, you only need to do this 5 times. This algorithm is also referred\
    \ to as binary exponentiation. \n\nIn binary exponentiation, you can compute large\
    \ positive integer powers very fast in the format O(log2N). The example we have\
    \ provided is one of the simplest. Binary exponentiation can also be used to compute\
    \ square matrices and polynomial powers. \n\n# CHAPTER 8:    \n\nWorking with\
    \ Inheritance \n\nT he next thing that we are going to take a look at here is\
    \ going to be the inheritances.  \n\nThese are a bit more complex than some of\
    \ the other stuff in this guidebook, but at this point, you are ready to take\
    \ it on and really work with something that is more advanced.  \n\nYou will find\
    \ that when these inheritances come out, we are going to see some of the beauty\
    \ that is there with the OOP languages that we talked about before, and we can\
    \ actually go through and reuse parts of the code that we want to work with. \
    \ \n\nOne of the most important out of all the concepts that come with OOP languages\
    \ is that of the inheritance.  \n\nThis idea is going to make it easier for us\
    \ to define a class based on the terms of another class in our code.  \n\nThis\
    \ is useful because it allows us to have an easier way to create and maintain\
    \ one of the applications that we want to work with.  \n\nIt is also going to\
    \ be useful in providing an opportunity for us to reuse the functionality of the\
    \ code and to get the implementation done faster than ever before.  \n\nAny time\
    \ that we want to go through and create a class, rather than having to go through\
    \ and write out brand new members of data and members of functions each time that\
    \ you do it, the programmer is able to designate that the new class is supposed\
    \ to inherit the members of a class that is already found in the code. \n\nThis\
    \ can make it a lot easier than having to redefine the members and the functions\
    \ as you go through the code again and again.  \n\nThe class that we are basing\
    \ our work on, or the existing class, is going to be known as the base class. \
    \ \n\nThen the new class that we are trying to create, and the one that will take\
    \ that information and the data or the functions out of the base class, is going\
    \ to be known as the derived class.  \n\nThe idea that we are going to see with\
    \ the inheritance is that it implements the “is a” relationship.  \n\nFor example,\
    \ it can work with the idea of a mammal is an animal; the dog is a mammal; hence\
    \ dog is an animal as well.  \n\nThis is going to kind of simplify the process\
    \ that we are working with here, but still, give us a good idea of what we are\
    \ working with along the way.\n\n## The Access Control of Our Inheritance \n\n\
    The next thing that we need to take a look at is access control and inheritance. \
    \ \n\nA derived class is able to access all of the parts of the base class that\
    \ are not private at the time.  \n\nThis means that the members of the base class\
    \ that should not be accessible to all of the member functions of the derived\
    \ classes, are going to be declared as private for the base class when we are\
    \ doing this as well.  \n\nYou will notice as we go through this that the derived\
    \ class is going to be able to inherit all of the base class methods.  \n\nThere\
    \ are going to be a few different exceptions that we are able to use with this\
    \ one based on what results we are hoping to get. Some of the exceptions that\
    \ we need to remember include: \n\n1.  The friend functions that are found with\
    \ our base class.  \n\n2.  The overloaded operators that are there with our base\
    \ class.  \n\n3.  The destructors, the constructors, and any of the copy constructors\
    \ that are going to happen with our base class.  \n\nWe need to make sure that\
    \ we pay special attention to some of the different parts that show up with our\
    \ access control.  \n\nIf some restrictions are found in our base class, then\
    \ this is going to step in and cause some issues with the inheritance that we\
    \ are working with as well.  \n\nAnd the child or the derived class is going to\
    \ notice this along the way.  \n\n## Type of Inheritances \n\nWhile we are here,\
    \ we need to take a closer look at the types of inheritances that we are able\
    \ to work with.  \n\nWhen we try to derive a class from one of our base classes\
    \ in the first place, then the base class has the possibility of being inherited\
    \ through a private, a protected, or a public inheritance.  \n\nThe type of inheritance\
    \ that you use is going to be specified through the access-specifier, as we talked\
    \ about above.  "
