  trans: "\nMicrosoft ASP（活动服务器页）是微软发布的一种计算机语言，用于构建动态网站，尽管它年代久远，且常用于 20 世纪 90 年。它被用于\
    \ Windows 95 和 98，是一种脚本型计算机编程语言，允许在 HTML 中包含简单的代码并在服务器上运行。ASP 的文件扩展名为 `.asp`，程序通常被发送到浏览器，尽管也可以进行更改。此外，Microsoft\
    \ ASP 允许在脚本中使用其他计算机语言，并包含 `Jscript`。尽管是一个较旧的数据库管理系统，但 ASP 使得使用变得简单，因为可以快速在包含 URL\
    \ 的在线表单中添加程序代码行。因此，ASP 变得更具交互性，在没有高级编程技能的情况下就能实现结果。与其他数据库编程软件不同，Microsoft ASP\
    \ 允许扩展功能。通过这种方式，它产生了更有效的结果，使其在现代版本中仍在使用中。\n\n# 使用 Microsoft ASP.NET\n\nASP.NET\
    \ 是一种现代的 Microsoft ASP 格式，配合开源的 Web 服务器使用，这些服务器对于设计动态网页的 Web 开发至关重要。该应用程序于 2002\
    \ 年 1 月发布，让程序员能够享受现代 ASP 特性来构建动态网站、程序和应用程序。与 ASP 不同，ASP.NET 更适用于支持多种编程模型，如 `ASP.NET\
    \ web forms`、`MVC`、`web API`、`signalR` 和网页。微软和其他公司创建了用于 ASP.NET 的工具，以获得更高效的产出。该应用程序供所有用户免费下载，安装并启动后即可让您快捷地执行程序。\n\
    \n# 使用 Microsoft Query\n\n微软的数据库管理软件是一种查询工具，它允许用户通过文本字符串示例、文件名和文档列表来获取数据库查询所需的视觉化方法，由于具有示例查询（Query-by-Example）工具，该应用程序的工作原理是允许系统通过\
    \ `SQL` 将输入转换为正式的数据库查询。这样，用户就可以轻松地以数据检索的形式进行强大的搜索，而无需培养 `SQL` 技能或经验。Microsoft\
    \ Query 使用了由 Moshe M. Zloof 在 20 世纪 70 年创建的“示例查询”功能。此外，它还采用了 Microsoft Access\
    \ 的易用界面，让学习者能够轻松学习和理解关系型数据库管理系统，供小型企业使用。Microsoft Query 应用程序也作为嵌入工具在电子表格的 Access\
    \ 中使用。\n\n# 第 12 章：异常处理\n\n## 什么是 Bug？\n\nBug 一直是程序员能遇到的最讨厌的生物。在程序员眼里，bug 就是程序中的错误。这些\
    \ bug 可能会导致错误或意想不到的后果。很多时候，bug 在事后是可以修复的。当然，也有一些无法挽回的教训。欧洲的 Ariane 5 号火箭在首次发射后一分钟内爆炸。事后调查显示，导航员中的一个浮点数要转换为整数，但该值太大导致溢出。此外，一架直升机在\
    \ 1994 年坠毁，导致 29 人死亡。调查显示，直升机的软件系统“充满了缺陷”。在 2001 年的电影《太空漫游》中，超级计算机 `HAL` 因为程序中两个目标的冲突而杀死了几乎所有的航天员。\n\
    \n在英语中，bug 的意思是缺陷。工程师长期以来使用 bug 一词来指代机械缺陷。关于 bug 有一个小故事。这里有一段代码：\n\n```\nfor result\
    \ in range(5):\n    print(result)\n```\n\n输出：\n```\nSyntaxError: invalid syntax\n\
    ```\n\n```\nresult = [12, 24, 36]\nprint(result[4])\n```\n\n输出：\n```\nIndexError:\
    \ list index out of range\n```\n\n```python\nmix = [\"first\", \"second\", \"\
    third\"]\nprint(mix[1])\n```\n\n输出：\n```\nNameError: name 'mix' is not defined\n\
    ```\n\n```python\nresult = 0\nprint(1 / result)\n```\n\n输出：\n```\nZeroDivisionError:\
    \ division by zero\n```\n\n## 调试\n\n修复程序中 bug 的过程被称为调试（Debugging）。计算机程序是确定性的，因此总会有错误。当然，有时长时间无法调试会产生强烈的挫败感，甚至觉得自己不适合开发。其他人会摔键盘，认为电脑在耍弄自己。从我观察来看，即使是最好的程序员在写程序时也会\
    \ bug。只是优秀的程序员对调试更加平和，不会怀疑自己。他们甚至将调试过程视为一种训练，通过知识来更好地理解错误的根源。\n\n实际上，调试有点像侦探。收集证据，排除嫌疑人，留下真正的凶手。收集证据的方法有很多，也有许多工具可用。初学者，你不需要在工具上花费太多时间。通过在程序内部插入\
    \ `print()` 函数，你可以看到变量的状态以及运行的程度。有时，你可以通过将一个指令替换为另一个来测试你的假设，观察程序结果的变化。当排除所有其他可能性后，剩下的就是错误的真实原因。\n\
    \n另一方面，调试也是编写程序的自然组成部分。开发程序的一种方法是测试驱动开发（TDD）。为了让 Python 成为如此方便动态的语言，从编写执行特定功能的小程序开始是一个很好的起点。然后，在小程序的基础上逐渐修改，使程序不断演进，最终满足复杂需求。在此过程中，你不断添加功能，不断修复错误。重要的是，你一直在编写代码。Python\
    \ 的作者本人也喜欢这种编程方式。因此，调试实际上是你编写完美程序的必要步骤。\n\n## 异常处理详解\n\n对于运行时可能发生的错误，我们可以在程序中预先处理。这有两个可能的目的：一个允许程序在中止前执行更多操作，例如提供有关错误的更多信息；另一个是让程序在出错后继续运行。\n\
    \n异常处理还可以提高程序的容错性。以下过程使用了异常处理：\n\n"
