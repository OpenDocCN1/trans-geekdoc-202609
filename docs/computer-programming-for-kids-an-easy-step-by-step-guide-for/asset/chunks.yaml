    of the derived class. And then the protected members that are found in our base
    class will also become protected members of some of the derived classes that we
    make out of it as well.


    1. Was we could guess here, we are going to find that the private members that
    are found with our base class are never going to be accessible directly from the
    derived class.

    2. We can access them through here.

    3. We just need to do some calls to the protected and the public members of our
    base class to make this happen.


    ### The Protected Inheritance

    The second option that we are able to work with is protected inheritance. When
    we want to derive a new class from a base class that is protected, the protected
    and the public members of the base class are going to end up as protected members
    of the derived class that we want to work with.


    ### Private Inheritance

    The final type of inheritance that we are going to work with is private inheritance.
    When we are trying to derive a new class from a private base class, both the protected
