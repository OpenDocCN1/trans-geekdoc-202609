    对于 `Program3`，默认函数是 `input()`，它负责获取用户输入的某些输入值，它必须被赋值给变量，因此你得到一个字符串。该函数的一个重要特性是，你还可以在屏幕上显示消息，从而让用户知道需要输入什么，程序员可以写一条消息告诉他们需要输入什么类型的数据，例如，告诉用户在计算矩形面积时需要输入一个自然数。但为了更好地理解这一点，查看以下示例很重要：


    ![00012.jpeg](img/00002.jpeg)


    在这个示例中，我们看到初始化的变量 `var1` 等于用户输入的内容，它应该是一个数字，因为函数指定用户输入数字，但相同的输入将变成一个字符串，因为函数 `input()`
    总是返回字符串，从那里开始，你可以进行计算。


    转义字符：这些是一些字符组合，它们在字符串内部的行为不同，因为它们允许我们实现一些无法轻易实现的事情，例如换行。


    | `\\` | `\\` |

    | --- | --- |

    | `\\’` | `‘` |

    | `\\’’` | `“` |

    | `\\a` | 声音 |

    | `\\b` | ASCII 退格 |

    | `\\f` | 分页制进 |

    | `\\n` | 换行 |

    | `\\r` | 回车 |

    | `\\t` | 水平制表 |

    | `\\v` | 垂直制表 |

    | `\\ooo` | 进制值字符 |

    | `\\xhh` | 十进制值字符 |


    三引号：它们用于放置多行字符字符串，可以使用单三引号 `‘‘text’’` 或双三引号 `“‘‘text”““`，其使用示例如下：


    ![00013.jpeg](img/00003.jpeg)


    在这个示例中，我们创建了两个变量 `string` 和 `string2`，我们同时使用了三单引号和三双引号，在其中放置了多个换行，而不需要使用转义字符，在这种情况下不需要
    `\\n`。最后，将在屏幕上打印变量 `string` 和 `string2` 的拼接。


    # 第 4 章：Web 编程


    本阶段简要介绍 Web 编程。互联网是现在人们的基本实体。通过程序解释 Web 模块化有助于你更好地学习该主题。


    ## 通 通协议


    通信是非常奇妙的事情。它允许信息在个体之间传递。动物发出化学元素和交配信息。人们对爱人说情话来表达爱意。猎人吹哨并安静地围捕猎物。服务员向厨房要了两份炸鸡和啤酒。红灯引导交通，电视广告广播，法老金字塔刻着禁止进入的诅咒。通过通信，每个人都与周围的世界连接在一起。在通信的神秘过程中，相关的个体总是遵守特定的协议。在日常对话中，我们使用一套语法。如果两个人使用不同的语法，那么他们使用的协议就不同，最终，他们不知道在谈什么。


    计算机之间的通信是不同计算机之间信息的传输。因此，计算机通信也应该遵循通信协议会议。为了实现多级全球互联网通信，计算机通信也有一个多级协议系统。`HTTP`
    协议是最常见的网络协议类型。它的全称是超文本传输协议。


    `HTTP` 协议允许文件传输，特别是超文本。在互联网时代，它是最广泛使用的互联网协议。事实上，当我们访问一个网站时，通常会在浏览器中输入一个 `HTTP
    URL`，例如 `http://www.google.com`，它会提示你需要使用 `HTTP` 协议来访问你的站点。


    `HTTP` 的工作就像一份快餐点单：


    1. 请求：客户向服务员请求一个鸡肉汉堡。

    2. 响应：服务器根据情况对客户的请求做出响应。


    根据情况，服务员可能会以多种方式响应，例如：


    * 服务员准备了`鸡腿汉堡` 并将其递给客户。（一切正常）

    * 女服务员发现自己自己在甜点摊工作。她让她的客户去官方柜台点餐。（重定向）

    * 服务员告诉客户 `鸡腿汉堡` 卖光了。（未找到）


    当交易完成后，服务员将该交易抛在脑后，准备为下位客户提供服务。


    ```

    GET /start.html HTTP/3.0

    Host: www.mywebsite.com

    ```


    在起始行中，有三条信息：


    * `GET` 方法。描述你想要服务器执行的操作。

    * `/start`。html 资源的路径。这些指向服务器上的索引。HTML 文件。

    * `HTTP 3.0`。第一个被广泛使用的 `HTTP` 版本是 3.0，当前版本是 3.3。


    早期的 `HTTP` 协议只有 `GET` 方法。遵循 `HTTP` 协议，服务器接收 `GET` 请求。


