    \n公平地说，即使在深度学习中，仍然需要你的输入。你不能确信地假设输出将一直是完美的。当你的输入数据不足以满足你对模型要求的输出时，这一点尤为适用。\n\n\
    这里的根本因素是机器学习和深度学习都必须使用数据。你拥有的数据质量会对你从这些模型获得的结果产生持久的影响。提到数据，你不能只使用任何数据。要有效使用其中任何一种模型，你必须学会检查数据，并确保你正在为你喜喜欢的模型使用正确的格式。\n\
    \n机器学习算法通常需要标记的结构化数据。由于这个原因，如果你需要为需要大量数据的复杂寻找解决方案，它们不是最佳选择。\n\n在我们用于识别卡车和自行车的示例中，我们尝试在一个理论概念中解决一个非常简单的问题。但在现实世界中，深度学习模型被应用于更复杂的模型。如果你考虑涉及的过程，从概念到分层数据处理再到数据必须经过的不同层数，使用深度学习模型来解决简单问题将浪费资源。\n\
    \n虽然所有这些类人工智能都需要数据来帮助进行我们所需的智能，但深度学习模型对数据的访问范围比机器学习算法要宽泛得多。这很重要，因为深度学习算法在传递输出之前，必须在合理的怀疑之外证明输出是完美的。\n\
    \n# 第 7 章：编程中的算法\n\n在编程中，变量是数据存储器，而算法是构建块。正是通过算法，你使用的软件才能获取你需要的数据。算法是自然语言与计算机语言之间的桥梁。你的挑战被翻译成运行你软件的独特语言，然后被翻译回你能够理解和解释的语言。\n\
    \n概念化算法最简单的方法是菜谱。食谱概述了从准备食物到菜肴准备好上桌的每一个程序。这正是算法所做的。它们概述了计算机为了实现你的预期目标必须遵循的必要程序。\n\
    \n回到菜谱的例子，在编程中，我们将食谱称为过程，将配料称为输入，并将食谱的最终结果称为输出。算法概述了计算机为了实现你的目标必须遵循的必要程序。\n\n\
    算法是精确的且有三个部分：开始、中间和结束。编写算法时，你必须指出第一个程序，结束。\n\n算法必须包含完成任务的必要信息。它们是精确的，引导你走向解决方案。编写算法时，明智的是对你的程序。有些程序员使用伪代码，一种半编程语言，解释了程序。\n\
    \n这里是请求用户地址的算法示例：\n\n-   Procedure 1: Start\n-   Procedure 2: Create variable\
    \ to receive user address\n-   Procedure 3: Clear variable if not empty\n-   Procedure\
    \ 4: Request user address\n-   Procedure 5: Store response in variable\n-   Procedure\
    \ 6: Verify if email address is valid\n-   Procedure 7: Invalid address? Back\
    \ to Procedure 3\n-   Procedure 8: End\n\n这是一个加两个数字的算法示例：\n\n```\nProcedure 1:\
    \ Start\nProcedure 2: Declare variables `num3`, `num4` also `sum`.\nProcedure\
    \ 3: Read variables `num3` and `num4`.\nProcedure 4: Add `num3` to `num4` and\
    \ assign result to `sum`.\n`sum←num3+num4`\nProcedure 5: Display `sum`\nProcedure\
    \ 6: End\n```\n\n这是一个确定三个值中最大值的算法示例：\n\n```\nProcedure 1: Start\nProcedure 2:\
    \ Declare the variables `x`, `y` and `z`.\nProcedure 3: Read variables `x`, `y`\
    \ and `z`.\nProcedure 4: If `x>y`\nIf `x>z`\nDisplay `x` is largest number.\n\
    Else\nDisplay `z` is largest number.\nElse\nIf `y>z`\nDisplay `y` is the largest\
    \ number.\nElse\nDisplay `z` is largest number.\nProcedure 5: End\n```\n\n这就是简单算法的方式。它们说明了你在过程中需要的内容。一个好的算法必须具有以下特征：\n\
    \n-   输入和输出的清晰且精确的定义。\n-   所有过程必须简单且清晰。\n-   所选算法应该是获得解决方案的最有效方法。\n-   算法中不应有计算机代码。\n\
    \n这是编程中需要学习的几类算法和数据结构。你将在开发和竞赛编程中几乎到处使用它们。这里是主要的算法：\n\n## 排序算法\n\n这是你在编程中需要学习的最大算法类别之一。这些算法允许你按所需的顺序排列列表。现在的每种编程语言都带有它自己的排序库。然而，学习这些仍然是重要的：\n\
    \n-   `merge sort`\n-   `counting sort`\n-   `heap sort`\n-   `bucket sort`\n\
    -   `quick sort`\n\n这些算法的知识是不够的。更重要的是知道如何、何地以及何时是必要的。\n\n## 搜索算法\n"
