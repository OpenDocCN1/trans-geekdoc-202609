- raw: "## Assembly Language \n\nAssembly languages are alternatives to machine languages.\
    \ They use mnemonics to represent machine language instructions. Since computers\
    \ cannot understand assembly language, we use a program called an assembler to\
    \ convert assembly language code into machine language code. Compared to machine\
    \ languages, assembly languages are relatively easier to learn and use, but they\
    \ are still tedious because they are closer to machine language.  \n\n## High-Level\
    \ Programming Languages \n\nThe late 1990s ushered in the development of a new\
    \ generation of computer programming languages called high-level programming languages. \
    \ \n\nHigh-level programming languages are English-like computer programming languages\
    \ that are platform-independent, which means code written in high-level programming\
    \ language can run on any machine or computer.  \n\nAlmost every programming language\
    \ in use in the modern programming world is high-level. These languages use statements\
    \ to instruct a computer to perform sets of instructions. Here is an example of\
    \ calculating the sum of two numbers using modern programming languages: \n\n\
    Number1 = 10 \n\nNumber2 = 100 \n\nSum = Number1 + Number2 \n\nToday, we have\
    \ many high-level programming languages. The list below shows the most popular\
    \ programming languages, the ones commonly applicable in any field. \n\n*   Python\
    \ \n\n*   Java \n\n*   C++ \n\n*   JavaScript \n\n*   Ruby \n\nIn this guide,\
    \ we shall be discussing the essentials you need to master to start programming\
    \ or writing computer code in three programming languages: Java, C++, and Python\
    \ (version 3).  \n\nThe next phase starts the discussion by looking at the basic\
    \ elements, whose understanding of which will allow you to get started on the\
    \ path to being a proficient programmer. \n\n## Programming Basics \n\nLike human\
    \ languages, high-level programming languages have a set of key elements. Most\
    \ high-level programming languages have the following core elements: \n\n*   Environments\
    \ \n\n*   Keywords \n\n*   Data Types \n\n*   Variables \n\n*   Operators \n\n\
    *   Control Flow \n\n*   Functions \n\n*   Arrays \n\n*   Strings \n\n*   Inputs/Outputs\n\
    \n## Environment Setup \n\nSince computers lack the ability to understand high-level\
    \ programming languages directly, we use translator or convertor where we write\
    \ our code and then translate it to machine code. We call this a development environment. \
    \ \n\nAlthough it is not a programming element by itself, setting up your development\
    \ environment is usually the very first step to working with every programming\
    \ language. It mainly comprises of installing a certain type of software on your\
    \ computer so that you can create computer code and translate this code into the\
    \ language your computer can understand.  \n\nWith most high-level programming\
    \ languages, the most notable tools necessary to create a conventional programming\
    \ environment are:  \n\n### Text Editor \n\nA text editor is a piece of software\
    \ we use to write computer code in plain text without formatting. Microsoft Windows\
    \ has Notepad as its default text editor. Source code is the name we use to refer\
    \ to the Code written and saved by text editor. \n\n### Translators \n\nWe use\
    \ translators to convert source code into binary language. The binary code translated\
    \ then becomes what programmers refer to as ‘object code.’ Translators can be:\
    \ \n\n1.    Assemblers: We use these to convert low-level languages into machine\
    \ code. \n\n2.    Compilers: Compilers convert source code to binary code and\
    \ then execute the binary. If the program runs into an error during the execution\
    \ process, the compilation stops without creating a binary. The most popular compiled\
    \ languages are C, C++, Objective-C, Swift, and Pascal. \n\n3.    Interpreters:\
    \ Interpreters are similar to compilers but instead of running the entire program,\
    \ they convert the code line by line. This means that every line of code runs\
    \ until an error occurs. Once the program returns an error, the interpreter automatically\
    \ stops and reports the error. The most popular interpreted languages are Python,\
    \ Ruby, JavaScript, and Perl. \n\n4.    Hybrid Translators: Hybrid translators\
    \ are a combination of compilers and interpreters. They convert the source code\
    \ into Bytecode. Runtime engines then translate and execute the bytecode. The\
    \ main example here is Java that uses the Java Virtual Machine (JVM). \n\nNOTE:\
    \ Set up your programming environment depending on the various instructions given\
    \ by each of the three programming languages we shall be working with—and each\
    \ language has different environment setup instructions.  \n\n# CHAPTER 2:   \
    \ \n\nExecution and Statement about a Program\n\n## Statement\n\n### Statements:\
    \ What Are They? \n\nB efore I begin explaining what a statement is, let me pose\
    \ you a simple question. When was the last time you had to choose between two\
    \ things, depending on the elements like what you prefer, what you can afford,\
    \ what is near, and what isn’t? Whenever we make decisions, we take into account\
    \ quite a few components and elements which will eventually influence our decision\
    \ accordingly. Similarly, to help us with such issues, we use statements, and\
    \ that is exactly what we will be looking into. \n\nIn the simplest definition,\
    \ Statements are nothing more than instructions that Program interpreter understands\
    \ and executes, we have been writing some ourselves when we set values to variables.\
    \ \n\nStatements, where we assign values to variables, are called assignment statements.\
    \ However, as long as Program is being discussed, generally, statements refer\
    \ to ‘if’ statements. \n\nThe ‘if’ statement is what provides Programs with a\
    \ situation and allows Program to take appropriate action ‘if’ a given situation\
    \ is true, otherwise, it takes another route. Sounds easy and it is actually interesting\
    \ too. Let us see how we can create our very first ‘if’ statement. \n\nHere’s\
    \ the situation. A user wishes to sign in using their account. The prompt asks\
    \ for the passcode only. If the user inputs the right, case-sensitive, passcode,\
    \ he should be allowed access. If the user enters the wrong password, it should\
    \ not go through and inform the user that the entered password was incorrect.\
    \ \n\nTo do that, we first need to establish a password. You can either come up\
    \ with your own pre-defined one or ask the user to create a new passcode and then\
    \ re-enter it. I leave the choice up to you. \n\npassword = input(“Create a password:\
    \ “) \n\nprint(“Welcome to the portal”) \n\nSo far, I have only asked the user\
    \ to enter a password of their choice. If you wish, you can set any string or\
    \ numbers as a password. Next, I created a little welcome greeting. Now, we shall\
    \ ask the user to enter their password: \n\npassword\\_check = input(“Please enter\
    \ your password: “) \n\nThe only thing worth noting here is that I changed the\
    \ name of the variable. If you are wondering why, that is because had I used the\
    \ same variable name; it would have updated the password, instead of comparing\
    \ it. Since we wish to verify the password, we will need to use a different variable.\
    \ \n\nNow, the customer has given us two pieces of information. Here, we tell\
    \ Programming what to do if the password matches. \n\nif password\\_check == password:\
    \ \n\nprint(“Successful! Welcome back!”) \n\nThere are two things to notice here.\
    \ Whenever you type in ‘if’ as your first word, PyCharm will detect that you wish\
    \ to create an ‘if’ statement. The color of ‘if’ will change to denote the same.\
    \ After ‘if,’ we need to define our condition. To do that, you may have observed\
    \ that I used “==“ instead of a single equals sign. These signs are called Operators,\
    \ which we will discuss later. All you need to know here is this: \n\n‘=‘ is used\
    \ to assign a value \n\n‘==‘ is used to either equate two variables or compare\
    \ to see if the two are exactly the same. \n\nIn the above instance, we will use\
    \ this comparison operator. Here is the most interesting bit; unlike all the codes\
