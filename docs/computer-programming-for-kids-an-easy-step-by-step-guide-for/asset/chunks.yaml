  fmt: "\n# Assembly Language\n\nAssembly languages are alternatives to machine languages.\
    \ They use mnemonics to represent machine language instructions. Since computers\
    \ cannot understand assembly language, we use a program called an `assembler`\
    \ to convert assembly language code into machine language code. Compared to machine\
    \ languages, assembly languages are relatively easier to learn and use, but they\
    \ are still tedious because they are closer to machine language.\n\n# High-Level\
    \ Programming Languages\n\nThe late 1990s ushered in the development of a new\
    \ generation of computer programming languages called high-level programming languages.\n\
    \nHigh-level programming languages are English-like computer programming languages\
    \ that are platform-independent, which means code written in high-level programming\
    \ language can run on any machine or computer.\n\nAlmost every programming language\
    \ in use in the modern programming world is high-level. These languages use statements\
    \ to instruct a computer to perform sets of instructions. Here is an example of\
    \ calculating the sum of two numbers using modern programming languages:\n\n```\n\
    Number1 = 10\nNumber2 = 100\nSum = Number1 + Number2\n```\n\nToday, we have many\
    \ high-level programming languages. The list below shows the most popular programming\
    \ languages, the ones commonly applicable in any field.\n\n*   Python\n*   Java\n\
    *   C++\n*   JavaScript\n*   Ruby\n\nIn this guide, we shall be discussing the\
    \ essentials you need to master to start programming or writing computer code\
    \ in three programming languages: Java, C++, and Python (version 3).\n\nThe next\
    \ phase starts the discussion by looking at the basic elements, whose understanding\
    \ of which will allow you to get started on the path to being a proficient programmer.\n\
    \n# Programming Basics\n\nLike human languages, high-level programming languages\
    \ have a set of key elements. Most high-level programming languages have the following\
    \ core elements:\n\n*   Environments\n*   Keywords\n*   Data Types\n*   Variables\n\
    *   Operators\n*   Control Flow\n*   Functions\n*   Arrays\n*   Strings\n*   Inputs/Outputs\n\
    \n# Environment Setup\n\nSince computers lack the ability to understand high-level\
    \ programming languages directly, we use translator or convertor where we write\
    \ our code and then translate it to machine code. We call this a development environment.\n\
    \nAlthough it is not a programming element by itself, setting up your development\
    \ environment is usually the very first step to working with every programming\
    \ language. It mainly comprises of installing a certain type of software on your\
    \ computer so that you can create computer code and translate this code into the\
    \ language your computer can understand.\n\nWith most high-level programming languages,\
    \ the most notable tools necessary to create a conventional programming environment\
    \ are:\n\n### Text Editor\n\nA text editor is a piece of software we use to write\
    \ computer code in plain text without formatting. Microsoft Windows has `Notepad`\
    \ as its default text editor. Source code is the name we use to refer to the Code\
    \ written and saved by text editor.\n\n### Translators\n\nWe use translators to\
    \ convert source code into binary language. The binary code translated then becomes\
    \ what programmers refer to as ‘object code.’ Translators can be:\n\n1.  **Assemblers**:\
    \ We use these to convert low-level languages into machine code.\n2.  **Compilers**:\
    \ Compilers convert source code to binary code and then execute the binary. If\
    \ the program runs into an error during the execution process, the compilation\
    \ stops without creating a binary. The most popular compiled languages are C,\
    \ C++, Objective-C, Swift, and Pascal.\n3.  **Interpreters**: Interpreters are\
    \ similar to compilers but instead of running the entire program, they convert\
    \ the code line by line. This means that every line of code runs until an error\
    \ occurs. Once the program returns an error, the interpreter automatically stops\
    \ and reports the error. The most popular interpreted languages are Python, Ruby,\
    \ JavaScript, and Perl.\n4.  **Hybrid Translators**: Hybrid translators are a\
    \ combination of compilers and interpreters. They convert the source code into\
    \ `Bytecode`. Runtime engines then translate and execute the bytecode. The main\
    \ example here is Java that uses the Java Virtual Machine (`JVM`).\n\n**NOTE**:\
    \ Set up your programming environment depending on the various instructions given\
    \ by each of the three programming languages we shall be working with—and each\
    \ language has different environment setup instructions.\n\n# CHAPTER 2: Execution\
    \ and Statement about a Program\n\n## Statement\n\n### Statements: What Are They?\n\
    \nBefore I begin explaining what a statement is, let me pose you a simple question.\
    \ When was the last time you had to choose between two things, depending on the\
    \ elements like what you prefer, what you can afford, what is near, and what isn’t?\
    \ Whenever we make decisions, we take into account quite a few components and\
    \ elements which will eventually influence our decision accordingly. Similarly,\
    \ to help us with such issues, we use statements, and that is exactly what we\
    \ will be looking into.\n\nIn the simplest definition, Statements are nothing\
    \ more than instructions that Program interpreter understands and executes, we\
    \ have been writing some ourselves when we set values to variables.\n\nStatements,\
    \ where we assign values to variables, are called assignment statements. However,\
    \ as long as Program is being discussed, generally, statements refer to ‘if’ statements.\n\
    \nThe `if` statement is what provides Programs with a situation and allows Program\
    \ to take appropriate action ‘if’ a given situation is true, otherwise, it takes\
    \ another route. Sounds easy and it is actually interesting too. Let us see how\
    \ we can create our very first ‘if’ statement.\n\nHere’s the situation. A user\
    \ wishes to sign in using their account. The prompt asks for the passcode only.\
    \ If the user inputs the right, case-sensitive, passcode, he should be allowed\
    \ access. If the user enters the wrong password, it should not go through and\
    \ inform the user that entered password was incorrect.\n\nTo do that, we first\
    \ need to establish a password. You can either come up with your own pre-defined\
    \ one or ask the user to create and then re-enter it. I leave the choice up to\
    \ you.\n\n```\npassword = input(\"Create a password: \")\nprint(\"Welcome to the\
    \ portal\")\n```\n\nSo far, I have only asked the user to enter a password. If\
    \ you wish, you can set any string or numbers as a password. Next, I created a\
    \ little welcome greeting. Now, we shall ask the user to enter their password:\n\
    \n```\npassword_check = input(\"Please enter your password: \")\n```\n\nThe only\
    \ thing worth noting here is that I changed the name of the variable. If you are\
    \ wondering why, that is because had I used the same variable name; it would have\
    \ updated the password, instead of comparing it. Since we wish to verify the password,\
    \ we will need to use a different variable.\n\nNow, the customer has given us\
    \ two pieces of information. Here, we tell Programming what to do if the password\
    \ matches.\n\n```\nif password_check == password:\n    print(\"Successful! Welcome\
    \ back!\")\n```\n\nThere are two things to notice here. Whenever you type in `if`\
    \ as your first word, PyCharm will detect that you wish to create an `if` statement.\
    \ The color of `if` will change to denote the same. After `if`, we need to define\
    \ our condition. To do that, you may have observed that I used `==` instead of\
    \ a single equals sign. These signs are called Operators, which we will discuss\
    \ later. All you need to know here is this:\n\n`=` is used to assign a value\n\
    \n`==` is used to either equate two variables or compare to see if the two are\
    \ exactly the same.\n\nIn the above instance, we will use this comparison operator.\
    \ Here is the most interesting bit; unlike all the codes we wrote so far, this\
    \ line ends with a colon `:`.\n"
  trans: "\n\n# 汇编语言\n\n汇编语言是机器语言的替代方案。它们使用助记符表示机器语言指令。由于计算机无法理解汇编语言，我们使用一个名为 `assembler`（汇编器）的程序将汇编代码转换为机器代码。与机器语言相比，汇编语言更容易学习和使用，但由于它们更接近机器语言，因此仍然非常繁琐。\n\
    \n# 高级编程语言\n\n20 世纪 90 年代开启了新一代计算机编程语言的发展，被称为高级编程语言。\n\n高级编程语言是类似于英语的计算机编程语言，且独立于平台，这意味着用高级编程语言编写的代码可以在任何机器或计算机上运行。\n\
    \n现代编程世界中使用的几乎每种编程语言都是高级的。这些语言使用语句来指示计算机执行一组指令。以下是使用现代编程语言计算两个数字之和的示例：\n\n```\n\
    Number1 = 10\nNumber2 = 100\nSum = Number1 + Number2\n```\n\n今天，我们有很多高级编程语言。下面的列表显示了最流行的编程语言，即通常适用于任何领域的语言。\n\
    \n*   Python\n*   Java\n*   C++\n*   JavaScript\n*   Ruby\n\n在本指南中，我们将讨论在开始编程或编写计算机代码需要掌握的要素，涵盖三种编程语言：Java、C++\
    \ 和 Python（版本 3）。\n\n下一阶段将通过观察基本元素开始讨论，理解这些元素将允许你踏上成为精通程序员的道路。\n\n# 编程基础\n\n就像人类语言一样，高级编程语言有一组关键元素。大多数高级编程语言具有以下核心元素：\n\
    \n*   环境 (Environments)\n*   关键字 (Keywords)\n*   数据类型 (Data Types)\n*   变量 (Variables)\n\
    *   操作符 (Operators)\n*   控制流 (Control Flow)\n*   函数 (Functions)\n*   数组 (Arrays)\n\
    *   字符串 (Strings)\n*   输入/输出 (Inputs/Outputs)\n\n由于计算机缺乏直接理解高级编程语言的能力，我们使用翻译器或转换器编写代码，然后将其转换为机器代码。我们将其称为开发环境。\n\
    \n虽然它本身不是一种编程元素，但设置你的开发环境通常是处理每种编程语言的第一步。它主要包括在你的计算机上安装特定类型的软件，以便你创建计算机代码并将这些代码转换为计算机可以理解的语言。\n\
    \n对于大多数高级编程语言，创建常规编程环境所需的显著工具是：\n\n### 文本编辑器\n\n文本编辑器是我们用于编写不带格式的纯文本计算机代码的软件。Microsoft\
    \ Windows 使用 `Notepad`（记事本）作为其默认文本编辑器。源代码是我们用来指代由文本编辑器编写并保存的代码名称。\n\n### 翻译器\n\
    \n我们使用翻译器将源代码转换为二进制语言。翻译后的二进制代码就变成了程序员所说的“目标代码”。翻译器可以是：\n\n1.  **汇编器 (Assemblers)**：我们使用这些工具将低级语言转换为机器代码。\n\
    2.  **编译器 (Compilers)**：编译器将源代码转换为二进制代码，然后执行该二进制文件。如果程序在执行过程中遇到错误，编译将停止且不生成二进制文件。最流行的编译型语言是\
    \ C、C++、Objective-C、Swift 和 Pascal。\n3.  **解释器 (Interpreters)**：解释器与编译器类似，但它们不是运行整个程序，而是逐行转换代码。这意味着每一行代码都会运行，直到发生错误。一旦程序返回错误，解释器会自动停止并报告错误。最流行的解释型语言是\
    \ Python、Ruby、JavaScript 和 Perl。\n4.  **混合翻译器 (Hybrid Translators)**：混合翻译器是编译器和解释器的结合。它们将源代码转换为\
    \ `Bytecode`（字节码）。运行时引擎随后翻译并执行字节码。这里主要的例子是 Java，它使用了 Java 虚拟机 (`JVM`）。\n\n**注意**：根据我们将要讨论的三种编程语言所提供的各种指令来设置你的编程环境。\n\
    \n# 第 2 章：语句与执行\n\n## 语句\n\n### 它们是什么？\n\n在解释什么是语句之前，让我们先问一个问题。在定义语句之前，让我们看看什么是语句。为了解释什么是语句，我们给出一个简单的例子。当我们需要做出某些选择时，我们使用语句。\n\
    \n从简单的定义来说，语句是程序理解的指令。当我们为变量赋值时的语句被称为赋值语句。然而，当我们讨论语句时，通常指的是 `if` 语句。让我们看看如何创建第一个\
    \ `if` 语句。\n\n这里是情况。用户使用其账户登录。如果用户输入正确的密码，应该被允许访问。如果用户输入错误的密码，它不应该通过并告知用户密码错误。\n\
    \n为了这一点，我们首先需要建立一个密码。你可以设置预定义的密码，也可以让用户创建一个。我把选择权交给你。\n\n```\npassword = input(\"\
    创建一个密码: \")\nprint(\"欢迎来到门户\")\n```\n\n到目前，我只要求用户输入密码。如果你愿意，可以设置任何字符串或数字作为密码。接下来，我创建了一个简单的欢迎语。现在，我们将用户输入他们的密码：\n\
    \n```\npassword_check = input(\"请输入你的密码: \")\n```\n\n这里唯一的注意的是我更改了变量名。如果你好奇为什么，那是因为如果使用相同的变量名，它将更新密码，而不是比较它。由于我们需要验证密码，我们将使用不同的变量。\n\
    \n现在，如果密码匹配，Python 会检测到你想要创建一个 `if` 语句。`if` 的颜色会改变以表示这一点。在 `if` 之后，我们需要定义我们的条件。为了这样做，你可能注意到我使用了\
    \ `==` 而不是单个等号。这些符号被称为操作符，我们稍后会讨论。你现在只需要知道这一点：\n\n`=` 用于赋值\n\n`==` 用于等同两个变量，或者比较以判断两者是否完全相同。\n\
    \n在上面的实例中，我们将使用这种比较操作符。这里是最有趣的部分；与我们到为止编写的所有代码不同，这一行以冒号 `:` 结尾。\n\n```python\n\
    if password_check == password:\n    print(\"成功！欢迎回来！\")\n```\n\n"
