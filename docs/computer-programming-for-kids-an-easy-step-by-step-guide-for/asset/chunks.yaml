- raw: "Microsoft ASP (Active Server Pages) is a computer language released by Microsoft\
    \ used for dynamic websites though older and often used in the 1990s. It was used\
    \ in Windows 95 and 98 and a scripting computer programming language allowing\
    \ for simple coding included in HTML and run in servers. The file extension of\
    \ ASP is .asp, and the program is often sent to the browser, though it can be\
    \ changed. Besides, Microsoft ASP allows other computer languages to be used in\
    \ the script and include Jscript.  Despite being an older database management\
    \ system, ASP enables simplicity on usage as lines of the coding program can be\
    \ quickly added in an online form included as URL. Therefore, APS becomes more\
    \ interactive and results achieved without advanced programming skills. Unlike\
    \ other database programming software, Microsoft ASP allows for the extension\
    \ of functionalities. This way, it has resulted in more effective results making\
    \ it be remaining in use today among the modern versions.  \n\n## Using Microsoft\
    \ ASP.NET \n\nASP.NET is a modern Microsoft ASP format that accompanies an open-source\
    \ and web application servers essential for web development for designing dynamic\
    \ web pages. The application was incorporated in January 2002, allowing programmers\
    \ to enjoy modern ASP features to build dynamic websites, programs, and applications.\
    \ Unlike ASP, ASP.NET is more applicable in supporting several programming models\
    \ such as ASP.NET web forms, MVC, web API, signalR, and web pages. Microsoft and\
    \ other companies have created the tools used in ASP.NET for the benefit of retuning\
    \ productive outcomes. The application is free for download for all users, which\
    \ is then installed and launched to enable you to execute programs readily.  \n\
    \n## Using Microsoft Query \n\nDatabase management software from Microsoft is\
    \ a query that enables users to acquire visuals methods essential for database\
    \ querying by use of text string examples, file names, and document lists, as\
    \ it features the query by example tools, the application works by enabling the\
    \ system to convert inputs into formal database queries by use of SQL. As such,\
    \ users can readily engage in powerful searches as a form of data retrieval without\
    \ skills developing skills or experience in SQL. Microsoft Query uses the Query-by-Example,\
    \ feature created NY Moshe M. Zloof in the 1970s. More so, it also adopts the\
    \ Microsoft Access user-friendly interface allowing learners to readily learn\
    \ and understand relational database management systems to use in small businesses.\
    \ Microsoft Query application is also used in access as an embedded tool in a\
    \ spreadsheet.\n\n# CHAPTER 12:    \n\nException Handling \n\n## What Is a Bug?\
    \ \n\nB ugs must be the most hated creatures a programmer can have. A bug in the\
    \ programmer’s eyes is a bug in a program. These bugs can cause errors or unintended\
    \ consequences. Many times, a bug can be fixed after the fact. There are, of course,\
    \ irremediable lessons. The European Ariane 5 rocket exploded within a minute\
    \ of its first launch. An after-action investigation revealed that a floating-point\
    \ number in the navigator was to be converted to an integer, but the value was\
    \ too large to overflow. In addition, a British helicopter crashed in 1994, killing\
    \ 29 people. The investigation revealed that the helicopter’s software system\
    \ was “full of flaws.” In the 2001 movie: “A Space Odyssey,” the supercomputer\
    \ HAL kills almost all of the astronauts because of two goals in its program conflict.\
    \ \n\nIn English, bug means defect. Engineers have long used the term bug to refer\
    \ to mechanical defects. And there’s a little story about using the word bug in\
    \ software development. A moth once flew into an early computer and caused a computer\
    \ error. Since then, bugs have been used to refer to bugs. The moth was later\
    \ posted in a journal and is still on display at the National Museum of American\
    \ History. \n\nCode: \n\nfor result in range(5)  \n\nprint(result) \n\n\\# Python\
    \ does not run this program. It will alert you to grammatical errors: \n\nOutput\
    \ is: \n\nSyntaxError: invalid Syntax \n\nThere are no Syntax errors in the following\
    \ program, but when Python is run, you will find that the subscript of the reference\
    \ is outside the scope of the list element. \n\nresult= \\[12, 24, 36\\]  \n\n\
    print(result\\[4\\]) \n\n\\# The program aborts the error reporting  \n\nOutput:\
    \ \n\nIndexError: list index out of range  \n\nThe above type of Error that the\
    \ compiler finds only at Runtime is called the Runtime Error. Because Python is\
    \ a dynamic language, many operations must be performed at run time, such as determining\
    \ the type of a variable. As a result, Python is more prone to run-time errors\
    \ than a static language. \n\nThere is also a type of Error called a Semantic\
    \ Error. The compiler thinks that your program is fine and can run normally. But\
    \ when you examine the program, it turns out that it’s not what you want to do.\
    \ In general, such errors are the most insidious and the most difficult to correct.\
    \ For example, here’s a program that prints the first element of a list. \n\n\
    mix = \\[“first”, “second”, “third”\\]  \n\nprint(mix\\[1\\]) \n\nThere is no\
    \ error in the program, normal print. But what you find is that you print out\
    \ the second element, B, instead of the first element. This is because the Python\
    \ list starts with a subscript from 0, so to refer to the first element, the subscript\
    \ should be 0, not 1. \n\n## Debugging \n\nThe process of fixing a bug in a program\
    \ is called debugging. Computer programs are deterministic, so there is always\
    \ a source of error. Of course, sometimes spending a lot of time not being able\
    \ to debug a program does create a strong sense of frustration, or even a feeling\
    \ that you are not suitable for program development. Others slam the keyboard\
    \ and think the computer is playing with itself. From my personal observation,\
    \ even the best programmers will have bugs when they write programs. It’s just\
    \ that good programmers are more at peace with debugging and don’t doubt themselves\
    \ about bugs. They may even use the debug process as a kind of training, to work\
    \ with their computer knowledge by better understanding the root cause of the\
    \ error. \n\nActually, debugging is a bit like being a detective. Collect the\
    \ evidence, eliminate the suspects, and leave the real killer behind. There are\
    \ many ways to collect evidence, and many tools are available. For starters, you\
    \ don’t need to spend much time with these tools. By inserting a simple print()\
    \ function inside the program, you can see the state of the variable and how far\
    \ it has run. Sometimes, you can test your hypothesis by replacing one instruction\
    \ with another and seeing how the program results change. When all other possibilities\
    \ are ruled out, what remains is the true cause of the error. \n\nOn the other\
    \ hand, debug is also a natural part of writing programs. One way to develop a\
    \ program is Test-Driven Development (TDD). For Python to be such a convenient,\
    \ dynamic language, it’s a good place to start by writing a small program that\
    \ performs a specific function. Then, on the basis of the small program, gradually\
    \ modify, so that the program continues to evolve, and finally, meet the complex\
    \ requirements. Throughout the process, you keep adding features, and you keep\
    \ fixing mistakes. The important thing is, you’ve been coding. The Python author\
    \ himself loves this kind of programming. So, debug is actually a necessary procedure\
    \ for you to write the perfect program.  \n\n## Exception Handling in Detail \n\
    \nFor errors that may occur at run time, we can deal with them in the program\
    \ in advance. This has two possible purposes: one is to allow the program to perform\
    \ more operations before aborting, such as providing more information about the\
    \ error. The other is to keep the program running after it makes a mistake. \n\
    \nException handling can also improve program fault tolerance. The following procedure\
    \ uses the exception handling:  "
