- raw: "The program that requires exception handling is wrapped in a try structure.\
    \ Except explains how the program should respond when a particular error occurs.\
    \ Program, input() is a built-in function to receive command-line input. The float()\
    \ function is used to convert other types of data to floating-point numbers. If\
    \ you enter a string, such as “P,” it will not be converted to a floating-point\
    \ number, and trigger ValueError, and the corresponding except will run the program\
    \ that belongs to it. If you enter 0, then dividing by 0 will trigger ZeroDivisionError.\
    \ Both errors are handled by the default program, so the program does not abort.\
    \ \n\nThe complete Syntax for exception handling is:  \n\ntry:  \n\n... ( code\
    \ should be written here)  \n\nexcept  exception1:  \n\n... ( code should be written\
    \ here) \n\nexcept exception2:  \n\n... ( code should be written here) \n\nelse:\
    \ \n\n... ( code should be written here) \n\n finally:  \n\n... \n\nIf an exception\
    \ occurs within a try, the exception is assigned, and except is executed. Exception\
    \ layer by layer to see if it is exception1, exception2, and so on, until it is\
    \ found to belong to, execute the corresponding statements in except. If there\
    \ is no exception in try, so the except part skips the execution of the else statement.\
    \ Finally is something you do in the end, whether or not there is an exception.\
    \ If except is followed by no parameters, then all exceptions will be handled\
    \ by the program. \n\n# CHAPTER 13:    \n\nGathering Your Data \n\n![00017.jpg](images/00005.jpeg)\n\
    \nT he first thing that we need to take a look at is how to gather up the data\
    \ that we need to accomplish this kind of process in data science. We need to\
    \ have a chance to go through and look at our data, figure out what kind of data\
    \ is out there that we can use, and so much more. But figuring out where to get\
    \ that data, how much to collect, and what kind is going to be right to help us\
    \ figure out more about our customers and industry, can be hard.  \n\nThere is\
    \ an overabundance of options out there when it comes to the kind of data that\
    \ we want to use along the way. We need to make sure that we are picking out the\
    \ right kinds of data, rather than just collecting data because it is there and\
    \ looks like the right thing to work with. When we are able to organize this in\
    \ the manner that we need, and we make sure that we actually get the good data,\
    \ even if it is not organized and structured the way that we want in the beginning,\
    \ it is going to be so important.  \n\nThat is why we are going to spend some\
    \ time in this phase exploring what we are able to do with our data, how it is\
    \ going to work for our needs and even some of the places where you can look in\
    \ order to find the data that you would like to work with. With that in mind,\
    \ we need to dive right in! \n\n## Know Your Biggest Business Problem \n\n![00025.jpg](images/00006.jpeg)\n\
    \nThere is a lot of data out there, and it is not going to take long doing some\
    \ searching before you find that you will end up in a rabbit hole with all of\
    \ this information if you don’t have a plan or a direction for what you are going\
    \ to do with all of that information. There is a ton of good data, but if you\
    \ just let it lead you rather than having a clear path in front of you, you are\
    \ going to end up with a lot of problems and will never get the decision making\
    \ help that you need.  \n\nIf you have already gathered up your data, then this\
    \ point is gone and we just need to work from there. You can form through your\
    \ biggest business problem, the one that you would like to spend your time focusing\
    \ on and fixing, and then sort through the data there and see what changes you\
    \ are able to make, and what data out of that large source you have is going to\
    \ make the biggest difference. Don’t be scared to just leave some of the data\
    \ for later, and don’t let the fact that you may not use some of the data hold\
    \ you back either.  \n\nDuring this time, we want to focus on knowing the best\
    \ information, this is going to be the best way to make sure that you get the\
    \ information needed to really propel your business into the future. Even some\
    \ of the information is left behind, that is fine. You may come back to it later\
    \ if you need some of it. But only the best data that you have should be used\
    \ for your algorithms to give you the best results.  \n\nNow, if you have not\
    \ had the time to go and collect any data yet, this is something we can work with\
    \ as well. Forming the problem that you would like to solve, and having a clear\
    \ path can help you to sort through all of the noise that is out there, and will\
    \ ensure that you are really able to get things done in the process. You need\
    \ to make sure that you are searching in the right places, and looking for the\
    \ information that is going to be the most critical for what you are trying to\
    \ accomplish, the part that is going to be so important when it is time to handle\
    \ some of the work that is out there.  \n\n## Places to Look for the Data \n\n\
    The next thing that we need to consider when it comes to this process of gathering\
    \ up the data and using it in the manner that we would like, is figuring out where\
    \ to find and look for the data that we need. There are actually so many different\
    \ places where we are able to look for the data that we want to handle, but this\
    \ is part of the beauty of the modern system that we are using today.  \n\nWe\
    \ have to remember, though, that most of the data that we will collect today is\
    \ not going to be organized or structured. We will look at some of the steps that\
    \ you are able to take in order to organize the data a little bit later, so this\
    \ is not a big deal. Just be prepared that you will have to go through and take\
    \ on a few extra steps in order to make sure that your data stays organized in\
    \ the manner that you would like, and that it is not going to be as nice and neat\
    \ as you would like in the long run.  \n\nSo, the places where you are able to\
    \ look for some of the data that you would like to use in this process will be\
    \ varied, and it often depends on what you are hoping to get out of this process.\
    \ You want to concentrate on getting the highest-quality data in the process that\
    \ you can, though. This is going to ensure that you are going to be able to find\
    \ the data that you need and that the algorithms you use later on will really\
    \ be able to provide you with some of the best results and insights that you need\
    \ to move your business forward.  \n\nThere are still a lot of places where you\
    \ are able to look to find the data that you want. You will find that you can\
    \ pick out data from websites (especially if you would like to work with web scraping),\
    \ from social media sites if you are using one from surveys and focus groups of\
    \ your own, and from other companies who may have collected the information and\
    \ are using it to help out others along the way.  \n\nYou may find that if you\
    \ are able to bring up data from a more unique source as well, this is going to\
    \ get you even further ahead with some of the work that you want to do. It will\
    \ ensure that you will have data that no one else is going to have, and will provide\
    \ you with some new patterns and insights, as long as you make sure that the data\
    \ is high quality and will actually be good for your needs.  \n\n## Where to Store\
    \ the Data? \n\n![00040.jpg](images/00007.jpeg)\n\nWe also need to consider where\
    \ we would like to store some of the data that we are working with along the way.\
    \ You are likely to gather up a lot of data in the process, and it isn’t likely\
    \ that you just want to have it sitting around without a purpose or having it\
    \ in a safe and secure location. This is especially true if you are working with\
    \ data that is your own, data you got from surveys and other places that you don’t\
    \ want others getting ahold of.  "
