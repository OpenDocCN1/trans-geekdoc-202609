    # IV. RESULTS AND DISCUSSION


    By using 100% of the original dataset as test i.e. 853 samples we get a test accuracy
    of 84.64%. SMART technique used to up sampling data to 84 samples got a test accuracy
    of 94.95%. F_1 performance has been calculated on the 2017 PhysioNet Cardiology
    challenge. A score of -91%, F_1 score of -79%, and Fip score of -73% with an overall
    F_1 score of 81 obtained. These values are calculated in the given score of 2017
    PhysioNet challenge. Table 1 visualises the confusion matrix of the test dataset.
    The cells in Table 1 are the true positives for the corresponding ECG signals
    and confirm the fact that they have correctly classified.'
