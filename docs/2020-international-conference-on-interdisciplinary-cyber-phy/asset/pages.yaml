    The extracted features are fed into two LSTM layers with 64 outputs each LSTM
    layers from traditional/conventional RNN. (Recurrent neural network) layers have
    obstructive nature and learning long term dependencies. LSTMs work better with
    sequences prediction data if there is enough data which is true for this. The
    main advantages of LSTM over traditional network is that LSTM layers have loops
    in them with memory units. They allow information to persist. A LSTM layer also
    has a hidden structure like the RNN. Without using a single NN layer in RNN they
    have four layers, interacting with the data in a flexible way. Finally, the output
    layer for the reactive neurons is activated by Soft activation function. Each
    neuron gives a probability value of the signal belonging to the class. The class
    to which the classifier gives maximum probability is to that class label for the
    given signal.


    The model was executed using Keras functional API. Keras is supported by Tensor
    flow backend. ''Adam'' optimizer, ''categorical cross'' loss function and [''accuracy'']
    metrics are used to compile the model.


    # H Hardware Implementation


    The flowchart of the hardware implementation for the proposed smart application
    is given in Fig. 4.


    ![](img/cca51b32600c08da07bc3d739952c81a_3_0.png)


    # G. Training of the DL


    After applying SMOTE oversampling technique, there are 18480 samples in the training
    set. 10% of the original data, 853 samples are in the test set. The model is trained
    for 75 epochs at the end of which the model is given training loss of 0.015, validation
    loss of 0.056, validation loss of 0.0545 and validation accuracy of 84.64%. The
    validation loss is plotted in Fig. 2. In training vs test accuracy and loss in
    each epoch is plotted for visualization.


    NodeMCU ESP8266 has been used for the hardware implementation of this part. NodeMCU
    is a microcontroller with enhanced API for ESP8266, GPIOs, I2C, ADC and PWM for
    prototyping. The NodeMCUs are used as prototype in our project.


    The NodeMCU takes real ECG signal from source ECG Sensor. The ECG signal is sent
    through bootstrap filter, sampled at 300Hz and normalized to [0, 1] before entering
    the model. The model predicts the output of real-time ECG input. The output is
    sent to web-server by publishing using writeAPI key, which is further read by
    the NodeMCU using readAPI key. The NodeMCU detects whether the ECG signal is normal
    or Atrial Fibrillation based on the output generated by the model of numerical
    value between 0 and 2 (0: Normal 1: Atrial Fibrillation 2: Noisy). Then it generates
    a notification to be displayed in the mobile app with the result. The notification
    is then sent to a test database Firebase which stores the medical history of each
    user. The medical history is shown below in Fig. 5. The most recent result is
    retrieved from the database and eventually shown through a mobile application.


