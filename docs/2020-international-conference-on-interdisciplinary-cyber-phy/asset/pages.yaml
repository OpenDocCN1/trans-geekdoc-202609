    **Abstract** Arrhythmia is by-far the most common cardiovascular ailment. It makes
    the heart with an irregular rhythm; either too fast or too slow. Atrial fibrillation
    is the well-known form of arrhythmia which occurs when the upper chambers of the
    heart (atria) experiences chaotic electrical signals and results in rapid heart
    rate. Although initially it may not have any symptoms if the electrocardiogram
    (ECG) is used to find out if the patient is suffering from atrial fibrillation.
    ECG helps to diagnose arrhythmia. In this work, we use signal pre-processing with
    a Deep Learning Model of I-D Convolutional Neural Network to classify single-lead
    ECG into different categories. The model classifies between sinus rhythm, atrial
    fibrillation, noise ECG and others with high precision and displays the results
    and notifies the user about a condition that might be connected to arrhythmia.
    This method is fast and reliable for the early diagnosis of arrhythmia which patients
    can follow proper protocols to avoid complications.


    33.5 million people suffer from Atrial Fibrillation to grow exponentially, due
    to the unhealthy lifestyle of people. This work mainly aims at distinguishing
    atrial fibrillation - the most common cause of cardiac arrhythmia which is most
    severe as well as growing at rapid pace.


    **Keywords ** - ECG arrhythmia; atrial fibrillation; ECG; wearable technology;
    deep-learning; code


    Electrocardiogram (ECG) is a common test used to diagnose Atrial Fibrillation.
    The traditional way of using ECG is when the doctor or the cardiologist takes
    the decision and is without monitor. Continuous monitoring and therefore, a self-portable
    device is needed in the last. In recent decades, many of work has been done to
    enable automatic ECG analysis and classification. Conventional methods are already
    used using different methods of Machine Learning commonly used in hospitals.


    # I. INTRODUCTION


    Nowadays, deep learning based neural networks are used for computer vision, signal
    processing. Cardiac Arrhythmia is a condition in which the heart beats at not
    normal rhythm. It may be caused by bradycardia or tachycardia Ventricular fibrillation
    or Atrial Fibrillation by changes in the tissues. According to the European Society
    of Cardiology (ECG), arrhythmia accounts for 15-20% of all cardiovascular cerebrovascular
    as ischemic stroke which is commonly associated with heart failure. And Ventricular
    Tachycardia is the most popular causes of cardiac arrhythmia.


    Atrial Fibrillation is a medical condition rather than a disease, which causes
    the heart to beat chaotically which results in stroke or heart failure resulting
    in permanent paralysis or death. Ventricular Tachycardia causes fast, unpredictable
    rhythm originating from unstable electrical signals which results in the ventricles.


    With Parallely, for classification, many works have been done by choosing the
    right features. However the it is constructed by high dimensionality reduction.


    On the other hand, input features were extracted using wavelet transform or higher-order
    statistics with such complex statistics and signals to process these algorithms
    resulted in poor or average accuracy high error.


    Deep learning with significant layer helps in detection of fibrillation is preferred
    over machine learning. Here, deep learning based classification algorithms are
    used for ECG and arrhythmia detection.


    In this work, the authors propose a novel idea using a four-layer deep learning
    model which consists of 1-D Convolutional Neural Networks (CNN) which extracts
    representation features and Long Short-Term Memory (LSTM) which extracts sequence
    features with the Dense layer then processes the ECG result into 4 classes. The
    classified result is then shown on the NodeMCU, which is saved in Google Firebase.
    The data is collected here as a real-time database. From the database, the results
    and the notifications are being displayed in a mobile application. This is highly
    effective, cost-effective alternative to the conventional system makes things
    convenient but


