    # V. COMPARISON WITH EXISTING LITERATURE


    Now the F_1 value of the technique is differentiated with the existing literature
    and performance. The comparative study is shown in Table II.

    The model produces a F_1 value of 70% which is among the top 2 scores of existing
    techniques. This really feels good the main aim in our work was to classify fibrillation
    from ECG signals as fibrillation is the most common cause of cardiac arrhythmia
    and increasing at a rapid rate.


