    **摘要** 心律失常是目前最常见的心血管疾病。它导致心脏跳动节奏不齐；要么太快，要么太慢。房颤是一种广为人知的心律失常形式，发生于心脏上腔（心房）经历混乱的电信号时，并导致心率过快。尽管在使用心电图（ECG）来发现患者是否患有房颤时，最初可能没有任何症状，但心G
    有助于诊断心律失常。在这项工作中，我们使用 1-D 卷积神经网络深度学习模型进行信号预处理，将单导心电图分类为不同的类别。该模型以高精度区分窦性心律、房颤、噪声心电图和其他类别，显示结果并通知用户可能与心律失常有关的情况。这种方法对于心律失常的早期诊断快速且可靠，患者借此遵循适当的方案以避免并发症。


    由于人们不健康的生活方式，患有房颤的 3350 万人正在呈指数级增长。这项工作的主要目的是区分房颤——心脏心律失常最常见的原因，也是最严重且增长最快的原因。


    **关键词** - ECG 心律失常；房颤；心电图；可穿戴技术；深度学习；代码


    心电图（ECG）是用于诊断房颤的常用检查。传统的心电图使用方法是由医生或心脏病学家在没有监测的情况下做出决策。因此，最后需要持续监测和自便携式设备。在过去的几十年里，许多许多工作来实现自动心电图分析和分类。传统方法已经使用了医院中常用的各种机器学习方法。


    # I. 引言


    如今，基于深度学习的神经网络已用于计算机视觉和信号处理。心脏心律失常是一种心脏跳动节奏不正常的状况。它可能由组织变化引起心过慢或心过速、室性颤动或房颤引起。根据欧洲心脏学学会（ESC），心律失常占所有心血管脑血管疾病（如与心力衰竭常见的缺血性中风）的
    15-20%。室性心速是心脏心律失常最常见的原因。


    房颤是一种医学状况而非疾病，它会导致心脏混乱跳动，从而导致中风或心力衰竭，导致永久瘫痪或死亡。室性心速引起源自心室的不稳定电信号的快速、不可预测的节奏。


    在并行性方面，对于分类，许多工作通过选择正确的特征完成。然而，它是通过高维还原构建的。


    另一方面，使用小波变换或高阶统计提取输入特征，由于这些复杂的统计和信号处理这些算法导致准确率低或中等，误差较高。


    具有显著深层的深度学习在颤动检测方面的表现优于机器学习。在这里，使用基于深度学习的分类算法进行心电图和心律失常检测。


    在这项工作中，作者提出了一种使用四层深度学习模型的新颖观点，该模型由提取表示特征的 1-D 卷积神经网络（CNN）和提取序列特征的长短期记忆网络（LSTM）组成，然后通过全连接层将心电图结果处理为
    4 类。分类结果随后……


