    NodeMCU ESP8266 has been used for the hardware implementation of this part. NodeMCU
    is a microcontroller with enhanced API for ESP8266, GPIOs, I2C, ADC and PWM for
    prototyping. The NodeMCUs are used as prototype in our project.


    The NodeMCU takes real ECG signal from source ECG Sensor. The ECG signal is sent
    through bootstrap filter, sampled at 300Hz and normalized to [0, 1] before entering
    the model. The model predicts the output of real-time ECG input. The output is
    sent to web-server by publishing using writeAPI key, which is further read by
    the NodeMCU using readAPI key. The NodeMCU detects whether the ECG signal is normal
    or Atrial Fibrillation based on the output generated by the model of numerical
    value between 0 and 2 (0: Normal 1: Atrial Fibrillation 2: Noisy). Then it generates
    a notification to be displayed in the mobile app with the result. The notification
    is then sent to a test database Firebase which stores the medical history of each
