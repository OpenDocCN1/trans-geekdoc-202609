    # VI. 结论


    本文实现了一种真实的心律失常检测，能够从心电图（ECG）信号中检测此类问题。我们还可以持续监测用户的心脏健康状况，从而避免心律失常的发展。


    因此，作者们成功构建了一个轻量级可穿戴心律律检测器的原型，它可以对心电信号进行分类。它也可以与其他提供用户心电信号的手环配合。此外，本工作中卷积神经网络（CNN）和长短期记忆（LSTM）的使用将提高准确性并使应用程序对患者更加方便。


