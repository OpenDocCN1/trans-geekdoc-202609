    Abstract features include RR, QQ interval, IP interval among several others. The
    extracted features are time series data and time series prediction such as RNNs
    or LSTMs. Such a model significantly reduces training time due to the fact that
    the LSTM layers are pre-defined features and are highly accurate in the required
    task [9].


    Imbalanced datasets where the classification are not equally represented is one
    of the hurdles that can lead to inadequate or misleading results. Many efforts
    have been made by researchers to tackle this problem. Few works have been done
    down-sampling or over-sampling techniques. SHINKRY systems have come up which
    differentiates between regions of different clusters. Further work has been done
    using down-sampling and Synthetic Minor Over-Sampling Technique (SMOTE) which
    is a unique approach in which the minority class is over-sampled by filling with
    artificial data points. These classes have equal number of samples similar to
    the class with the maximum number. Thus, SMOTE provides a good amount of recall
    and precision over other approaches. [9] [10]


    ## III. SYSTEM MODEL


    The entire system architecture is described by the flowchart in Fig. 1.


    | Raw ECG Signal | Training and Padding of ECG Signal | Normalization of ECG Signal
    |

    |---|---|---|

    | Results | Training of Model | SMOTE |

    | NodeJS Board | Cloud Database | Mobile Application |


    Fig. 1. Block Diagram of the proposed System


    ### B. Binding and Tuning of Signal


    ECG is a continuous and non-deterministic signal so any type of classification
    is not possible. Thus, the ECGs have been sampled at a sampling rate of 300 samples/sec.
    The dataset contains ECG signal of duration varying from 9 s to more than 60 s.
    For unanimity, 750 samples from each signal have been taken which is 25s of duration.
    Signals having duration less than that have been padded with zeros. The trimmed
    data gives good results and ensures no data loss.


    ### C. Normalizing the ECG signal


    The sampled value of ECG produces a wide range of values, which might mislead
    the lead absolute values of one instance for the instance of all instances. To
    prevent such situation data normalization is being added adding to a common scale.
    For better accuracy, the mean of the data is adjusted by subtracting original
    value which is divided by its maximum absolute value. Thus, the normalized data
    lies within the range [-1, 1].


    ### D. SMOTE


    As we can observe the Patient dataset is imbalanced. There are 5154 samples belonging
    to normal sinus rhythm class while only 46 samples belong to the Noisy ECG class.
    Hence, to balance the SMOTE algorithm is used. This technique over-samples the
    minority class by filling with artificial data points similar to the class normal
    sinus rhythm number, i.e. This technique is not only being applied on the training
    dataset but would lead to increased accuracy and performance. After applying SMOTE
    using a ratio factor of 1 to 4 each class contains samples from 1765 to 18400
    each have 4620 samples. The authors proposed the model before and after applying
    this case the test dataset gives much better performance and accuracy on the test
    dataset.


    ### F. Deep Learning Model Architecture


    In this work, the authors have proposed a unique deep learning model. The DL model
    has fourteen layers. Layers of 1D convolution have been used. These 1D convolution
    layers are used for feature extraction from preprocessed and ECG signals. For
    each convolution layer a 1D MaxPooling layer with a stride of 2 pixels. MaxPooling
    layers then show the feature maps from the CNN operation by selecting the maximum
    value along its stride, this reduces redundant data in the feature maps and maximizing
    redundant information. The CNN layers have kernel sizes of 10, 6, 5, 3 respectively.
    Dropout layers with values 0.05, 0.10, 0.15 are starting after the convolutional
    CNN for regularization. Regularization warrants that the model does not overfit
    training-data. ''logit uniform'' class has been used as the layers weight initializer
    in it.


    The extracted features are fed into two LSTM layers with 64 outputs each. LSTM
    layers differ from traditional/conventional RNN (Recurrent neural network) layers
    have obstructive nature and cannot learn long term dependencies. LSTMs work better
    with sequence prediction data if there is enough data which is true for this.
    The main advantages of LSTM over traditional network is that LSTM layers have
    loops in them with memory units. They allow information to persist. A LSTM layer
    also has a hidden structure like the RNN. Without using a single NN layer in RNN,
    they have four layers, interacting with the data in a flexible way. Finally, the
    output layer for the reactive neurons is activated by Soft activation function.
    Each neuron gives a probability value of the signal belonging to the class. The
    class to which the classifier gives maximum probability is assigned to that class
    label for the given signal.


    The model was executed using Keras functional API. Keras is supported by TensorFlow
    backend. ''Adam'' optimizer, ''categorical cross'' loss function and [''accuracy'']
    metrics are used to compile the model.


