    # I. Mobile Application


    The mobile application developed acts as the device for the proposed wearable.
    The mobile app is connected with the real-time Firebase database in the backend.
    History of results from the ECG test and the notifications are available. The
    mobile application retrieves the most recent medical test result and displays
    it. A snap of the user interface of the application along with the retrieved notifications
    is shown below Fig.


    The predicted output is sent to the NodeMCU (acting as the prototype). Results
    and notification are compiled and pushed to the real-time Firebase database. The
    mobile application retrieves the data and displays it.


