    ### B. 信号的绑定与调整


    ECG 是连续且非确定性的信号，因此任何类型的分类都是可能的。因此，ECG 以每秒 300 样的速率进行采样。数据集包含持续时间从 9 秒到 60 秒不等的
    ECG 信号。为了统一，每个信号中提取了 750 个样本，持续时间为 25 秒。持续时间短的信号用零填充。裁剪后的数据提供了良好的结果并确保数据不丢失。


    ### C. ECG 信号的归一化


    ECG 的采样值产生宽范围的值，这可能会将一个实例的导联绝对值误导所有实例。为了防止这种情况，增加了数据归一化，将其添加到公共比例尺上。为了获得更高的准确性，通过减去原始值并除以其最大绝对值来调整数据的均值。因此，归一化后的数据位于
    [-1, 1] 范围内。


    ### D. SMOTE


    我们可以观察到患者数据集是不平衡的。有 5154 个样本属于正窦心律类，而只有 46 个样本属于噪声 ECG 类。因此，为了平衡，使用了 SMOTE 算法。该技术通过填充与正窦心律类数量相似的人工数据点来对少数类进行过采样，即该技术不仅应用于训练数据集，还将提高准确性和性能。在以
    1 到 4 的比例因子应用 SMOTE 后，每个类包含从 1765 到 18400 不等的样本，最终每个类有 4620 个样本。作者提出了在应用此情况之前和后的模型，在此情况下，测试数据集在测试集上给出了远更好的性能和准确性。


    ### F. 深度学习模型架构


    在这项工作中，作者提出了一种独特的深度学习模型。该 DL 模型具有 14 层。使用了 1D 卷积层。这些 1D 卷积层用于从经过预处理的 ECG 信号中提取特征。对于每个卷积层，都配有一个步长为
    2 像素的 1D 最大池化层（MaxPooling）。最大池化层通过沿其步长选择最大值来显示 CNN 操作的特征图，这减少了特征图中的冗余数据并最大化了冗余信息。CNN
    层的卷积核尺寸分别为 10、6、5、3。在卷积层 CNN 之后开始使用值为 0.05、0.10、0.15 的 Dropout 层以进行正则化。正则化确保模型不会过拟合训练数据。使用了
    ''logit uniform'' 类作为层的权重初始化器。


    提取的特征被输入到两个各具有 64 个输出的 LSTM 层。LSTM 层与传统的/常规 RNN（循环神经网络）层不同，后者具有阻塞性且无法学习长期依赖关系。如果有足够的数据，LSTM
    在序列预测数据上的表现更好，这对于本文是成立。LSTM 相比传统网络的主要优势是 LSTM 层内部带有记忆单元的循环。它们允许信息持久。LSTM 层还具有像
    RNN 一样的隐藏结构。RNN 在不使用单个 NN 层的情况下，拥有四层，并以灵活的方式与数据交互。最后，反应神经元的输出层由 Soft 激活函数激活。每个神经元给出一个信号属于该类的概率值。分类器给出最大概率的类被分配给该信号的类标签。


    模型使用 Keras functional API 执行。Keras 由 TensorFlow 后端支持。使用 ''Adam'' 优化器、''categorical
    cross'' 损失函数和 [''accuracy'']指标来编译模型。


