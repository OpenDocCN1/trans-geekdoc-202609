    # 2020 第 44 届计算机、通信与信号处理国际会议 (ICCSP)


    ## 3.1 通过使用 DL 和 ML 方法，我们可以检测虚假新闻吗？


    有几个因素会使读者相信虚假新闻：


    我们有几种深度学习和机器学习方法可以用于检测虚假新闻，它们是：


    - 逻辑回归 (Logistic Regression)

    - 朴素贝叶斯 (Naive Bayes)

    - 支持向量机 (SVM)

    - 长短期记忆网络 (L.S.T.M.)

    - 循环神经网络 (R.N.N.)


    - 多媒体：当内容的作者在单条帖子中使用媒体方法（如视频、图像和其他图形）时，可能会在不检查虚假新闻信息真实性的情况下改变读者的观点。


    - 作者：出于某些未知原因，被认可的记者也会以误导性的方式发布新闻。在面对此类伪造此类信息时，我们应该等待其他记者或网站检查其是真新闻还是假新闻。如果我们不等待后续网站的确认，可能会接受虚假信息。


    - 来源：它在新闻的可信度中起着重要作用。


    上述三种基于 ML 的算法，以及最后两种基于 DL 并实现的 Native Bayes 和 SVM 算法，根据作者 [5] 的说法，这些算法显示出很高的准确率。


    - 平台：如果新闻被发布？[12]


    ![](img/f01dfe8d919533b1871f92bfeeed5b05_2_0.png)


    在这篇系统性论文中，工作重点是检测和识别近年来社交媒体上的虚假新闻，因为人们现在倾向于从平台获取新闻而非传统渠道。为了弄清虚假新闻传播背后的原因，我们使用了
    IEEE、Science Direct、A.C.-C. 和 Springer 发布的数据集。在许多情况下，我们脑海中产生了许多疑问，如果我们进行回顾，这些问题被记录在论文中，以找到这些问题的最佳答案。虚假新闻的传播背后有很多原因，例如许多是为了广告，或者是由人们自己制作的；而且有一些因素会让人们相信虚假新闻，当当新闻由作者创建，或者该新闻使用了图像，或者可能被用于误导读者时。读者如何根据自己的经验识别误导性信息？这属于读者，因为当大多数读者第一次接触虚假新闻并在随后在社交媒体等平台看到该新闻发布时，他们有不同的经验。如果没有发布公告，我们不会相信该信息。通过使用机器学习和深度学习（使用逻辑回归、朴素贝叶斯、支持向量
    svm、长短期记忆、循环神经网络 (R.N.N.)），我们面对了多少虚假新闻？由于虚假新闻有许多类型，因此使用（基于视觉的、基于用户的、基于知识的、基于风格的、基于立场的以及基于文本的）图形来说服读者并让作者写的内容是真实的，但其含义可能发生了改变，是有用的。


    ## IV. 结论


    ## 4. 读者如何根据自己的经验识别真假新闻？


    在社交媒体上阅读文章或新闻时，读者可能会制造虚假新闻或分享文章。以下是读者在阅读文章和在社交媒体上时应该留意的几个因素：


    > 作者：每条帖子在他人眼中或面对虚假新闻文章时都起着重要作用，或者作为读者应该检查帖子的效果，即新闻是否是由任何作者创建的。


    - 图像：当虚假新闻配有与帖子相关的图像时，其可信度会增加。面对新闻时，我们应该根据自己的经验检查图像是真实的还是虚造的，或者使用了某些图像 [8]。


    简易辨别虚假新闻的小贴士：


    - 读者是谁？

    - 他们的资质是什么？

    - 文章涵盖了该话题的所有方面吗？

    - 标题与内容匹配吗？

    - URL 是否正确？

    - 这些信息的目的是什么？[23]


    ## 5. 哪些因素可能会说服读者相信虚假新闻？


