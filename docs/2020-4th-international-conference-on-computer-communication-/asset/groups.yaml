    在分享新闻之前要遵循某些协议，这使得情况变得如此。此外，人们想要获取新闻，他们必须等待时间，在这种心情下，人们会转到社交媒体网络在几秒钟内获得休息。另一方面，社交媒体网络必须是可信的，用户对这些新闻有信任。主要问题是这降低了人们对社交媒体的信任。用户避免平台上的假新闻，因为社交媒体中的假新闻并不是这里的问题，在这里我们将遵循一些正在进行假新闻研究的研究人员。此外，需要一些算法来避免假新闻，这将在文中提到
