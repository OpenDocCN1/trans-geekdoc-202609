    All the questions are reviewed, and we have the following answers.


    +   1. What are the types of fake news?


    As per review, fake news does not have the exact types in different, but there
    are different numbers for fake news and as [12] there are five types of news,
    and they are as


    +   * Visual based on the types of graphics are used more than content, this type
    includes image, video, or both.

    * User-based: fake accounts and fake users create they target a specific group
    of people like age, culture, nation, gender, etc.

    * Knowledge-based: this type has a scientific explanation for the unsolved, which
    convinces the reader to believe it is true like prediction for cancer.

    * Style based: these types are written by a new or pseudo journalist who wants
    to act like an accredited journalist.

    * Stance based: this type is if the authors represent the truth in a way that
