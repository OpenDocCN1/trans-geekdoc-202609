    # ### III. RESEARCH QUESTIONS


    The entire of our systematic review is to measure and find the best solutions
    and proficiency for the existing problems and for tools for detecting news on
    social media. Furthermore, we prepared a few questions, and by primary study,
    we want to find the best answers for these questions and these as


    +   1. What are the types of fake news?

    2. Why fake news disseminates in social media?

    3. How DL and ML can detect fake news.

    4. By using which methods?

    5. How can readers identify true or false news with their own experience?

    6. Which factors may convince a reader to believe in fake news?


    2. Why the fake news has been noticed since the appearance of the social media.
    The majority of publishers fake news to increase their readers, or they to change
    the history to benefit themselves and for some advertisement. After the emergence
    of the internet and social media, consumers and publishers discovering the digital
    media channels turning and disseminating information that online platforms are
    comfortable than the traditional ones. The platforms are accessible anywhere and
    anytime. So it became trendy for readers to use them and at the same time deal
    with fake news on them. The majority of publishers used clickbait to get the attention
    of readers and receive them.


