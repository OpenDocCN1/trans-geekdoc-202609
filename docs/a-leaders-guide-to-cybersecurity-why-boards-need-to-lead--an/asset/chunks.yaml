    \n*   For each of the prioritized cyber crises, communication materials prepared\
    \ before a crisis and company support, including updates on the cyberattack and\
    \ response progress and the development of new materials, during a crisis, so\
    \ executives can address the following issues: \n\n    *   The cyberattack that\
    \ caused the crisis (start with Risk Inquiry 3 in [chapter 11](../Text/22_9781633698000_ch11.html))\n\
    \n    *   The impact for the company and stakeholders (start with Risk Inquiry\
    \ 3)\n\n    *   The reasons the company was unable to repel the cyberattack (start\
    \ with Fortify Inquiry 3 in [chapter 12](../Text/23_9781633698000_ch12.html))\n\
    \n    *   The plans the company has to address impact to stakeholders (start with\
    \ Crisis Inquiry 8 in [chapter 13](../Text/24_9781633698000_ch13.html))\n\n |\n\
    \n| Oversight || \n\n*   Confirm that your company has done all of the preparations\
    \ for cyber crisis communications.\n\n*   Offer your thoughts on the engagement\
    \ of the board itself during a cyber crisis.\n\n |\n\n# Conclusion\n\nAt the beginning\
    \ of the book, we made two observations about cybersecurity challenges most people\
    \ are already aware of. Anyone who reads the news knows the rate and impact of\
    \ cyberattacks are increasing, despite significantly increased awareness of and\
    \ investment in cybersecurity. We’ve also seen many board members view cybersecurity\
    \ as daunting because they rarely have relevant prior experience with it. The\
    \ seemingly impenetrable nature of the subject only heightens anxiety for many\
    \ directors.\n\nThe underlying reason behind both challenges is the same: the\
    \ central focus of cybersecurity efforts is technological. The focus on software,\
    \ networks, and hardware ignores many of the nontechnical factors of successful\
    \ cybersecurity strategies. The technical nature of cybersecurity dialogue also\
    \ alienates important parties and stymies cooperation. Jargon limits the material\
    \ engagement that boards and senior executives need when discussing and making\
    \ decisions about the cyber risks facing their companies.\n\nIn spite of continued\
    \ inability to protect themselves, many companies pin their hopes on more sophisticated,\
    \ and more expensive, technological products and services to keep hackers at bay.\
    \ Similarly, much of the advice dispensed to boards emphasizes the importance\
    \ of cybersecurity training, and numerous classes and certificate programs are\
    \ popping up to fill the void.\n\nThe absence of a working cybersecurity approach\
    \ allows fear to replace logic. A fatalistic drumbeat in cybersecurity dialogue\
    \ is emerging, marked by common refrains such as “It is not a question if you\
    \ will be hacked, but only when” or the oft-repeated bromide, “There are two types\
    \ of companies, those that know they’ve been hacked and those that don’t know\
    \ it yet.” This spirit of resignation has shifted emphasis to reactive measures\
    \ for dealing with attacks once they occur, rather than prevention or detection.\
    \ This approach is the equivalent of neglecting seatbelts and airbags in favor\
    \ of deploying fleets of ambulances and helicopters to ferry crash victims to\
    \ emergency rooms.\n\n## Changing Perspective and Direction\n\nYou and other board\
    \ members are best positioned to lead your companies in adopting a new perspective\
    \ on cybersecurity that starts with concrete business activities instead of abstract\
    \ bits and bytes. And conveniently, you can accomplish this change simply by fulfilling\
    \ your oversight duties. Our digital stewardship framework gives you the tools\
    \ you need to expand your oversight to cybersecurity. By detailing what your company\
    \ has to give you in support of your oversight, the framework also tells your\
    \ company what it needs to do to effectively manage its cyber risks. This entails\
    \ a move beyond technology-centric approaches to cybersecurity and a shift in\
    \ focus to nontechnical factors that are broadly ignored."
