  raw: 'A related dynamic is incapsulated in the management bromide, “Bring me solutions,
    not problems.” While this directive may have value in encouraging employees to
    go beyond the problem in front of them and find a solution, it is often counterproductive
    in the area of cybersecurity. The employee may not be in a position to fix the
    problem because the solution rests with nontechnical dynamics beyond his domain.
    As the SingHealth breach showed, fear of personal consequences arising from bringing
    a problem without a solution meant that staff continued to keep SingHealth executives
    in the dark.


    There are additional reasons why negative cybersecurity news doesn’t make it to
    company leadership, including different or conflicting interests related to the
    consequences of reporting the information. Consider a company that recently changed
    ownership. This company started as a joint venture between a state-owned business
    and a private conglomerate from a different part of the world. According to cybersecurity
    staff who were on the front lines of monitoring cyber intrusions at the joint
    venture, there were many attempts to breach the walls of the joint venture, but
    none were sophisticated and all were easily repelled.


    The situation changed when the state-owned company bought out its partner and
    acquired full ownership. Soon after, the company’s network monitoring systems
    alerted cybersecurity staff that several IT administrators were logging on to
    critical systems from outside the company’s headquarters. Thinking that these
    administrators could be on vacation or traveling for work, the cybersecurity team
    checked door-swipe records and found that they were in fact inside their offices.
    This meant that someone was able to capture their usernames and passwords and
    then use them to break into company computers remotely.


    This clearly indicated a marked increase in the sophistication of the cyberattacks
    targeting the company. Cybersecurity staff suspected that the change in cyberattacks
    was related to the new ownership. The country with full ownership has long been
    at odds with another country that frequently mounted cyberattacks against foreign
    interests. The new cyberattacks were consistent with the types of attacks previously
    attributed to that country.


    A high-level government official who, by virtue of his position, represented the
    company’s owner was about to visit, and the cybersecurity staff thought he should
    know about the new and more dangerous cyber risks the company was facing. They
    reported their findings, suspicions, and recommendation through the management
    chain to the CEO. However, the CEO had a different agenda for the meeting with
    his new boss and did not mention the cyberattacks at all.


    Twitter provides another example of conflicting interests. Engineers at Twitter
    noticed that there were a significant number of suspicious accounts registered
    in Russia, Ukraine, and other parts of the former Soviet Union. Sensing that something
    wasn’t right, the engineers recommended that the accounts be deleted.[^(21)](../Text/26_9781633698000_notes.html#ch9_rfn120)
    However, the engineers didn’t have the authority to do this. That power lay with
    the “growth team,” a part of the marketing department, and that team didn’t agree.
    Its primary concern was to close the gap in the number of users between Twitter
    and Facebook, and deleting the accounts would only widen that gap. The accounts
    remained in place and then went to work in the 2016 US presidential election.


    In both these cases, employees had significant cyber-risk-related information,
    but no path or mechanism to communicate it beyond their corporate management chain.
    The company’s leadership remained in the dark as a result. As these and other
    examples show, individual motivations and interests are strong forces that can
    undermine many different facets of cyber risk management. We have consistently
    found that blaming individuals is counterproductive. We further believe that trying
    to convince individual managers to report cybersecurity information that harms
    or interferes with their own interests is not productive. Rather, you need to
    make sure your company accounts for the human trait of self-preservation. Among
    other measures, mechanisms should be in place for employees, independent of their
    reporting structure, to alert you or a representative of the board about cybersecurity
    concerns that otherwise can’t be escalated.


    ### System and Individuals


    In addition to preventing company leadership from getting critical information,
    blaming employees for the bad news they share neither is fair nor does it improve
    cybersecurity practices and defenses. As discussed in the previous chapter, a
    single control seldom mitigates cyberattacks, but rather a combination of controls
    working together. In a similar manner, the actions of a single employee seldom
    make the difference between a company repelling a cyberattack and falling victim
    to one. In the case of companies hit by WannaCry, it doesn’t make sense to blame
    the person who didn’t install the security update in time or the one who didn’t
    back up the computers. If you are looking for who or what to blame, then you should
    look at the overall system of business and cybersecurity activity of which these
    individuals are just two parts. This is also where to look to make improvements.


    The Agency for Healthcare Research and Quality’s publication *Advances in Patient
    Safety: New Directions and Alternative Approaches* states that “the realization
    that adverse events often occur because of system breakdowns, not simply because
    of individual ineptitude,” is the reason why many in the health-care industry
    are rethinking equating error with incompetence and no longer regarding “punishment
    as both appropriate and effective in motivating individuals to be more careful.”[^(22)](../Text/26_9781633698000_notes.html#ch9_rfn121)
    They realize that blame has a toxic effect. “Low reporting made learning from
    errors nearly impossible, and legal counsel often supported and encouraged this
    approach in order to minimize the risk of malpractice litigation.”[^(23)](../Text/26_9781633698000_notes.html#ch9_rfn122)


    Companies should, instead, direct their attention to improving their systems and
    processes, of which individual actions are a part. A recent Chinese observation
    captures the importance of looking at the system instead of the individual when
    there are issues: “If all the fish are dying, the problem is not with the fish;
    it’s with the water.” The processes for identifying and mitigating cyber risks
    described in the previous chapter and the operationalization of cyber risk management
    described earlier in this chapter work toward strengthening and improving a company’s
    cybersecurity practices beyond what it can achieve by focusing on the actions
    of any one individual.


    From an oversight perspective, your job is to ensure your company:


    ![images](Images/box.jpg)   Fosters a corporate environment in which staff readily
    and rapidly report cybersecurity information, especially negative information


    The aide-mémoire for this step is [Fortify Inquiry 5](../Text/23_9781633698000_ch12.html#inq5)
    in [chapter 12](../Text/23_9781633698000_ch12.html).


    # 10


    # Lead in Crisis


    Although avoiding and preventing cyber crises are top priorities, prevention only
    works until it doesn’t. If, despite all best efforts, a cyberattack succeeds,
    your company must be ready with a response that both counters the cyberattack
    and addresses the needs and expectations of affected stakeholders, all while bringing
    your company fully back in business. Because of your company’s previous efforts
    in creating cyber threat narratives and developing cyber risk reduction plans,
    your company can make significant preparations long before a crisis hits.'
