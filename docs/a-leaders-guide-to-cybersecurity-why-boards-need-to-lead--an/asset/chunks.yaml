- fmt: '

    There are, however, distinct disincentives for individuals in cybersecurity or
    IT departments to adopt application whitelisting in lieu of anti-malware. Within
    a traditional corporate office environment, the deployment of an anti-malware
    solution is simple, and ongoing management is largely automated. Again, there
    is no blame if it doesn’t work, so long as it is in place. The deployment of an
    application whitelisting solution requires more effort and attention on the part
    of IT staff. They need to make sure that updates to existing applications remain
    on the whitelist and that new, authorized business applications are added. If
    they don’t do this work correctly, and someone in the company can’t use their
    computer or an application they need as a result, the IT staff will be blamed
    and under great pressure to fix the problem immediately.


    The fundamental issue boils down to the question of who has responsibility for
    creating a safe digital environment in which people can work. To date, companies
    have largely placed this responsibility on individuals who are in no position
    to protect themselves, and on technologies that can never be effective. The underlying
    reasons for this course of action directly relate to incentives and accountability
    or, more precisely, the lack of it. The platitude “it’s a people problem” only
    serves to mask the issue.


    ## Protect the Crown Jewels


    Perhaps the most common type of reported cyber breach is loss of personal information,
    including financial data, medical information, credit card details, national identity
    numbers, and passwords, because of attacks on corporate and government computer
    systems. Close behind are losses of trade secrets, intellectual property, strategic
    plans, and internal financials. Given that not all digitized assets are of equal
    worth, it makes sense to prioritize the protection of the most valuable. The problem
    with the platitude “protect the crown jewels” is that it often promotes activities
    that are neither appropriate nor effective in reducing a company’s most significant
    cyber risks.


    The directive to protect the crown jewels implicitly places the greatest priority
    on the confidentiality of information. The thinking goes that it’s better to delay
    the speed or convenience of sending or sharing information in order to make sure
    it doesn’t fall into the wrong hands. However, depending on your specific business
    or needs, data confidentiality may not be your number-one priority.


    For example, if your company operates a multiplayer online game, the necessary
    computing power and network bandwidth are of utmost priority since you want your
    games to be available to your hundreds of thousands of gamers whenever they want
    to play. If they can’t play, you’ll quickly go out of business.


    If your company uses industrial control systems that drive, for example, oil refining,
    chemical manufacturing, or electric power generation, then speed of communications
    is critical. These systems comprise many individual computers, often quite old,
    that are quite sensitive to delays in network communications. If one machine doesn’t
    get a message from another machine when expected, it can malfunction, causing
    a cascading effect throughout other components of the industrial control system
    that could result in disruption to or the complete halt of operations.


    Speed can also be critical in medical settings. Although cybersecurity priorities
    in health care tend to center on confidentiality, cybersecurity priorities are
    flipped upside down in emergency situations. When a patient is in the emergency
    room or on the operating table, doctors want to get as much patient medical history
    information available, as quickly as possible. Lives depend on it. During the
    fog of surgery, if someone gets access to information they shouldn’t have, that
    can be investigated and resolved when the patient is recovering.


    These examples show, however, that companies face many other cyber risks unrelated
    to confidentiality. A focus on protecting crown jewels will not help you in identifying
    and mitigating these risks. Nor will this approach necessarily provide the comprehensive
    protection your confidential information needs. This is because many attempts
    at protecting crown jewels focus on protecting information where it is stored.
    Hence, the common post-breach question, Was the data encrypted? This question
    usually refers to the primary database where the information is stored. However,
    in order for information to provide value, it has to be taken out of the database,
    shared, and used. The risk exposure is much greater during these activities than
    when the information is resting in a database. To address the goals of prioritizing
    cybersecurity attention and providing complete protection, your company should
    focus on protecting its most important business activities, and you’ll get the
    protection of sensitive information as part of the process.


    Take, for example, customer service for accounts and billing. This business activity
    requires access to sensitive personal information, such as addresses and ID numbers,
    and sensitive financial information, such as credit card and bank account numbers.
    By tracing the process of creating a new customer account to customer service
    interactions while the account is active, to the closing of the account, your
    company will know all the computers where this information is stored, all the
    computer networks the information traverses, and all the individuals who have
    access. Your company needs to protect not only sensitive information but, more
    broadly, your customers’ trust.


    An additional benefit of focusing on critical activities is that you may identify
    types of information you previously didn’t realize were so. The relatively low-tech
    business of growing and selling almonds, walnuts, and pistachios in California’s
    Central Valley provides a case in point. Nuts are an attractive target for thieves.
    One truckload of nuts can be worth up to US500,000 and, unlike electronic equipment,
    the nuts have no serial numbers. Once eaten, the evidence is gone. Innovative
    thieves have moved beyond hijacking trucks on lonely stretches of road in favor
    of cyber-based attacks. They start by hacking into nut growers’ and processors’
    computers to steal information about planned shipments. This allows them to generate
    legitimate-looking paperwork for already scheduled shipments and send their own
    trucks before the real drivers arrive. In some cases, the thieves hire drivers
    who are unaware that they are participating in a robbery.


    ## Cyber Threats Are New and Constantly Changing


    Because companies are overwhelmed by the seemingly ever-increasing number of new
    cyber threats, they make two common mistakes. They think that investment in protection
    should be proportionate to the size of the threat. If the threat is increasing
    dramatically, so should the investment. In a similar vein, they think they need
    to make more investment to combat a threat never seen before. Given that these
    perceptions of urgency influence cybersecurity investment decisions, it’s useful
    to explore them more thoroughly.


    ### How Fast the World Turns Depends on Where You Stand


    The rapid changes in the cyber threat landscape are an oft-quoted reason for boards
    of directors’ more frequent briefings on cybersecurity. While we fully agree that
    cybersecurity warrants more time on your agenda, it is because of the breadth
    and importance of the topic, not its pace of change.

