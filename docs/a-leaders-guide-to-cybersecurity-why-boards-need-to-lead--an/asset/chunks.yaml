  trans: "\n\n*   确认贵公司已识别信息来源并制定了相关程序。\n\n## 表格 13-7：网络安全事件响应的高层指导\n\n| 危机查询 7 |\
    \ “执行管理层是否已就网络安全事件响应措施的潜在业务影响接受了简报，并为指导事件响应决策提供了方向？” |\n| --- | --- |\n| 原理 |\
    \ 某些网络安全事件响应措施（例如切断互联网连接）可能会对贵公司的运营产生意想不到的后果，并对其利益相关者产生更广泛的影响。高层领导既需要意识到这一问题，又要提供指导。为了避免在响应网络安全事件时出现不必要的延迟，应提前制定此类分析和指导。\
    \ |\n| 证据 | \n* 针对每种优先考虑的网络攻击，描述可能对业务运营产生影响的事件响应措施，并对解决网络安全事件的效能与支持关键业务活动的计算系统遭受的中断进行权衡分析。\n\
    *   会议纪要、电子邮件或其他证据，证明参与开展这些活动的网络安全、IT 和运营人员组成的组合执行了此类分析。\n*   关于业务优先级的执行层指导，用于指导事件响应决策。\
    \ |\n| 监督 | \n* 确认贵公司已进行权衡分析并提供了执行层指导。 |\n\n## 表格 13-8：恢复计划\n\n| 危机查询 8 | “公司将采取哪些行动来恢复运营并协助受影响的利益相关者？”\
    \ |\n| --- | --- |\n| 原理 | 贵公司恢复运营和修复网络攻击造成的效率具有具有直接财务效益。公司在网络危机发生后处理受影响利益相关者需求的方式，对公司声誉的影响起着重要作用。为了提供充足的时间进行理性讨论并做出必要的准备，这项活动需要在网络危机发生很久之前进行。\
    \ |\n| 证据 | \n* 恢复公司运营以及修复计算系统和设备损坏的计划。\n* 公司对受影响利益相关者计划援助的描述。\n* 文档（如采购订单或合同），证明贵公司已做出必要的准备。\
    \ |\n| 监督 | \n* 确认贵公司已深思了恢复受影响利益相关者将采取的行动。\n* 针对计划的恢复措施的合理性和适用性提供意见。 |\n\n## 表格\
    \ 13-9：问责制\n\n| 危机查询 9 | “公司如何准备应对外部问责要求？” |\n| --- | --- |\n| 原理 | 无论公平与否，在网络攻击之后，许多不同都会向贵公司归咎责任和过错。公司需要具备应对能力。\
    \ |\n| 证据 | \n* 处理领导层变动要求的计划。\n* 识别可能出现的查询和调查以及相应的响应计划。 |\n| 监督 | \n* 确认贵公司已考虑了外部反应和要求。\n\
    * 对贵公司对领导层变动响应的合理性提供意见。 |\n\n## 表格 13-10：利益相关者参与\n\n| 危机查询 10 | “公司高层如何准备在网络危机发生时与公众接触？”\
    \ |\n| --- | --- |\n| 原理 | 通过使用备忘录（aide-mémoire）查询，你已确保贵公司已经收集并分析了高层在提供指导时所需的大部分信息。为了避免在响应网络安全事件时出现不必要的延迟，应提前制定此类分析和指导。\
    \ |\n| 证据 | \n* 通过使用备忘录查询，你已确保贵公司已经收集并分析了高层在提供指导时所需的大部分信息。某些网络安全事件响应措施（例如切断互联网连接）可能会对贵公司的运营产生意想不到的后果，并对其利益相关者产生更广泛的影响。高层领导既需要意识到这一问题，又要提供指导。\
    \ |\n\n"
