    The process for cyber incident response we described earlier in this chapter defines
    the technical and coordinative activities. However, some actions taken in a technical
    context can have broader implications for your company and its stakeholders. When
    it detects an active cyber intrusion, your company needs to decide how to proceed.
    One option, for example, is to allow the attacker to remain in your company’s
    networks in order to collect more forensic information that could help in understanding
    the extent of damage and the techniques the hacker used. Another option is to
    cut off network connections in an effort to stop the attack. However, blocking
    connections to the internet could disrupt other company activities, either internal
    or customer facing. Should a company shut down an online retail platform or automobile
    assembly line when it has some evidence of a cyber intrusion? The considerations
    extend beyond the technical feasibility of the actions and require executive direction.


    Given the inherent time pressure of responding to cyber incidents, it is important
    to establish ground rules for the technical response in advance. Your company
    should have clear guidelines on when it needs to bring leadership into the loop.
    Start with the supporting systems documented in your company’s cyber threat narratives.
    The company should evaluate any cyber incident response action that could have
    an impact on the supporting systems in light of the corresponding disruption to
    business activities.


    Your executives need to be aware of the potential business impact of cyber incident
    responses and approve of broad courses of action before a crisis hits. This does
    not require any technical cybersecurity knowledge. The level of detail we used
    above in describing the potential trade-off between locking a hacker out of a
    corporate network and locking out customers is sufficient and appropriate. The
    response to a cyberattack shouldn’t increase the damage to your company or its
    liability beyond what it already incurred from the attack itself.


    You also need to look at the broader significance of the response to a cyber incident,
    beyond technical decisions. For example, at what point, if ever, does your company
    engage law enforcement in its cyber incident response? The interests and incentives
    of law enforcement, including both police and prosecutors, overlap with, but are
    distinct from, those of a company that has suffered a cyberattack. While a company’s
    primary objective is to recover and move past the crisis, law enforcement’s objective
    is to find, prosecute, and convict the criminals behind the attack. Law enforcement
    could seize evidence or make public statements that run contrary to your company’s
    own interests.


    From an oversight perspective, your job is to ensure that your company’s executive
    management:


    ![images](Images/box.jpg) Has been briefed on the potential business impact of
    cyber incident responses and provided direction to inform decisions on incident
    responses


    The aide-mémoire for this step is [Crisis Inquiry 7](../Text/24_9781633698000_ch13.html#crs7)
    in [chapter 13](../Text/24_9781633698000_ch13.html).


    ## Restoration Plans


    Before a cyberattack happens, your executives need to decide how your company
    will respond to the damage caused. While it may not be possible to predict the
    timing of an attack, it is possible to anticipate its damage to affected stakeholders
    and your company. These are described in the risks and consequences section of
    your company’s cyber threat narratives and in a corresponding cyber crisis scenario.


    As in any crisis, your company needs to prepare for repairing the damage, such
    as interruption of services or production, corruption of computing systems, or
    damage to equipment. Based on the experience and lessons learned from a cyberattack,
    a company can improve cybersecurity practices and controls to reduce the odds
    of recurrence. Corporate leadership, with support from the management teams and
    the cybersecurity group, can revisit the company’s cyber risk tolerances.


    In most cases, companies continue with the business activities affected in a recent
    cyber crisis. However, the Southeast Asian bank that suffered a massive debit
    card fraud provides a counterexample. Executive managers ultimately decided to
    exit the bank’s credit and debit card acquisition business because they realized
    the bank couldn’t manage the risks going forward. They based this decision not
    just on the bank’s own cyber defense capabilities, but also on external factors,
    such as the commission structure in the acquiring merchant process that promoted
    fraud, and the lack of cooperation with other banks in fraud investigations.


    The decisions executives make about the support your company will provide to affected
    stakeholders are some of the most visible actions they make in the course of a
    cyber crisis. During a discussion of executives’ preparation for cyber crises,
    CLP’s Lancaster stated, “Our values as a company must inform all we do in a crisis,
    and this starts with protecting life.” Given the differences in the scale and
    scope of damage possible from a cyberattack, the activities your company undertakes
    for those affected may be different from those in other types of crisis.


    While different types of cyberattacks result in unique types of damage, executives
    should consider a few commonalities when deciding a course of action, regardless
    of the specific cyberattack involved. One is the legal implications, including
    your company’s legal obligations in potentially numerous jurisdictions. Also,
    setting precedents could impose future obligations on your company, should similar
    types of damage occur later.


    Another consideration is the burden your company’s assistance imposes on affected
    parties. Common corporate responses in the aftermath of personal data breaches
    illustrate this point. After a data breach has been made public, companies commonly
    send emails to all potentially affected individuals with instructions on what
    they must do to find out if their own information was included in the breach.
    Another common practice is to offer additional services, such as a year of credit
    monitoring, but this also requires affected individuals to take action to benefit
    from this service.


    Imposing these additional burdens on affected stakeholders has two consequences,
    one of which is their negative reaction directed toward the company. Stakeholders
    can view a company’s instructions as adding insult to injury. The other consequence
    relates to the effectiveness of assistance a company provides. If getting the
    recommended help following an attack is too burdensome, individuals won’t do it.
    That means they will remain vulnerable to the risks the breach exposed them to.


    Your oversight responsibility is to ensure that your company’s executive leadership
    has decided on:


    ![images](Images/box.jpg) The steps to restore the company


    ![images](Images/box.jpg) The actions your company will take to assist stakeholders
    negatively affected by the cyber crisis


    The aide-mémoire for this step is [Crisis Inquiry 8](../Text/24_9781633698000_ch13.html#crs8)
    in [chapter 13](../Text/24_9781633698000_ch13.html).


    ## Accountability


    While your company can decide how it will address cybersecurity accountability
    inside the organization, a cyber crisis can result in external calls for accountability,
    specifically in the form of leadership changes or financial penalties. Your company
    should anticipate these external pressures and prepare a response. In addition,
    it is possible to anticipate, and prepare for, the kinds of inquiries or investigations
    your company will likely face in the event of a particular type of cyber crisis.

