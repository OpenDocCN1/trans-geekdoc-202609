    用于指示网络威胁快速增长的一个常用指标是新恶意软件的数量。2017 年的数据范围从 15,107,232 到 128,160,000 不等，而这仅是反恶意软件厂商能够检测到的恶意软件。¹¹
    虽然这些数字很大，但它们在很大程度上毫无意义。公司保护自己免受百万种恶意软件攻击与免受一千万或一亿种恶意软件攻击之间并没有真正的区别。真正的问题在于如何中和任何恶意软件。


    ### 如果你不了解，它对你来说就是新的


    广泛的网络安全意识相对较近，这导致人们认为我们正面临的网络威胁是新的。然而，网络安全领域的起源可以追溯到五十多年前的 1960 年代，当时美国空军就已经关注到了某种如今作为新威胁占据头条新闻目的的问题：针对关键基础设施的国家级攻击。涉及的国家是苏联，而关键基础设施是美国的核武器库。特定的风险——使用恶意软件破坏计算机系统——似乎也异常地具有当代感。根据深度参与这些问题的退役空军上校罗杰·谢尔（Roger
    Schell）介绍，当时的一个首要担忧是，控制陆基核导弹导航的计算机中的恶意软件可能会重定向这些导弹以攻击美国城市。¹²


    鉴于 1960 年代的互联网连接与我们现在完全不同，当时感染计算机感染恶意软件的主要途径是软件开发人员以及将他们编写的程序转换为机器可以理解的指令的工具。为了应对这些风险，开发人员经过背景调查，且他们所有的工具都是内部开发的。尽管软件开发的经济模式多年来发生了变化，但网络安全专家在
    1960 年代理解的一种风险在 2015 年再次出现。


    Apple 为开发 iPhone 和 iPad 等 `iOS` 设备程序的程序员提供了一个名为 `Xcode` 的工具。虽然 Apple 免费提供该工具，但也可以从面向软件开发人员的网站下载。其中一个网站`百度云盘`包含了一个
    `Xcode` 的恶意软件版本，称为 `XcodeGhost`，它在软件开发人员不知的情况下向程序添加了额外的指令。¹³ 当这些指令被整合到下载量数千万的流行应用程序中，可能会从应用程序用户处窃取个人信息并发送到未知服务器。


    除了美国空军五十年前就意识到这种类型的网络攻击这一见解外，对公司而言更广泛的教训是：理解他们究竟在依赖哪些内容以及谁来防御网络威胁非常重要。公司问这个问题还远远不够，而你处于纠正这一状况的理想位置。


    1970 年冬季，美国国防部科学委员会计算机安全任务组发布了一份题为《计算机系统安全控制》的报告。¹⁴该报告因其主要作者威利斯·沃尔（Willis Ware）而被称为《沃尔报告》（Ware
    Report），它识别了我们今天面临的大多数网络漏洞和风险，我们在 表 1-1 中对其中部分示例进行了总结。


    ######## 表 1-1：持续性网络漏洞示例


    | 主题领域 | 具体关注点 | 如今的相关性 |

    | --- | --- | --- |

    | 文件 | 敏感信息的窃取、复制和未经授权的 | 这仍然是组织面临的最严重的网络风险之一。 |

    | 软件 | 安全功能失效，包括对人们可以访问信息的控制 | 在大多数内部窃取公司信息的案例中，访问控制失效导致了窃取。 |

    | 用户 | 计算机用户身份验证弱 | 犯罪分子冒充用户（通常通过使用被盗密码）继续困扰公司和个人。 |

    | 网络通信 | 监听和拦截网络流量的能力 | 风险仍然存在，但由于加密解决方案已广泛部署。 |

    | 系统管理 | 管理失误导致妥协 | 物联网以及 IT 部门之外的技术日益采用，其主要风险之一是这些设备的用户不知道如何安全地管理它们。此外，许多存储在云端的企业信息泄露是由于配置错误造成的。
    |

    | 程序员 | 程序员修改软件以禁用安全功能、引入后门或其他破坏安全行为 | 所有这些关注点目前都存在。 |


    计算机面临的根本性网络漏洞既没有增加，也不是新的。我们使用和结合数字技术的创新方式引入了新的挑战，但这些都是现有主题的变体。


    此外，尽管计算机现在有从大型机、笔记本电脑到手表和冰箱的各种形式，并且需要新的保护方法，但网络安全问题从根本上是相同的。攻击方式也是如此。攻击的某些细节可能不同，但攻击在本质上没有区别。例如，想想包含链接的电子邮件，点击后会在你的笔记本电脑上下载恶意软件。现在想想一条短信，点击后会在你的手机上下载恶意软件。投递机制是不同的（电子邮件与短信），而恶意软件也会为了适应笔记本电脑与手机的运行而有所不同。


