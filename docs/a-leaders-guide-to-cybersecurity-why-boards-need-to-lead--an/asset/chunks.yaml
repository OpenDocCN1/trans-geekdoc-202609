  trans: '


    由美国国家安全局（NSA）开发的驱动 WannaCry 的攻击工具确实非常复杂。现在让我们来看看公司可以采取或已经采取哪些主动措施，以便 WannaCry
    无法将其劫持：


    1. **更新 Windows**。我们都习惯了在电脑和手机上看到通知，提醒我们安装经常修复安全漏洞的软件更新。在 WannaCry 袭击互联网大约二十天前，微软发布了一项中和它的安全更新。安装安全补丁既复杂也不昂贵，对于台式电脑和笔记本电脑，这可以自动完成。

    2. **备份系统和数据**。如果公司进行定期且及时的备份，那么即使 WannaCry 感染了计算机，它也可以恢复到之前的、洁的系统和数据并恢复工作。


    从 WannaCry 中，我们还可以学到一些有趣的教训，不仅关于它是如何被使用的或如何防御它。首先，未能保护公司免受 WannaCry 侵害是一个管理问题，而非技术问题。预防性技术和活动是常规工作，但对它们的重视程度不足。其次，虽然
    WannaCry 很复杂，但董事成员需要理解的此类攻击信息并不复杂，而且这些信息完全包含在本章中。


    ### Quantum Insert（量子插入）


    Quantum Insert 是另一个由 NSA 投入巨资开发的网络攻击工具。虽然很难为 Quantum Insert 的开发成本精确定价，但 NSA 在
    2013 年的预算中增加了 3200 万美元用于“非常规解决方案”。该工具不仅仅是简单的监听目标的互联网浏览，而是利用某人的浏览为机会在其计算机上安装恶意软件。当
    Quantum Insert 看到目标请求某个网站页面时，它就会采取行动。在网站响应之前，Quantum Insert 工具会在网页中嵌入恶意软件，然后将其发送给目标。由于目标浏览器正期待接收来自网站的页面，它会毫无置疑地接受该恶意页面。


    这类工具非常流行，以至于公司为预算有限的国家创建了商业版本。例如，Gamma International GmbH 以 87.5 万瑞士法（约 85.8 万美元）向土库曼斯坦政府出售了由
    Dreamlab Technologies AG 开发的类似工具。甘后，中国创建了一个名为“巨炮”（Great Cannon）的类似工具。


    Quantum Insert 及其模仿者的根本问题在于它们很容易被击败。在加密网页浏览面前，它们是无为力的，因为它们无法看到伪造网页回复所需的细节。越来越多的网站开始支持加密。而且这些不仅仅是银行和在线购物网站。即使是表情符号网站——`https://emojipedia.org/`——也会加密。


    你可以通过查看地址的前五个字母来判断你与网站的通信是否经过加密。如果是“httpshttps”，则连接是加密的，你对这种攻击是免疫的。这种保护是免费的，不需要你采取任何行动。如果你不想依赖单个网站来保护自己，可以使用虚拟专用网络（`VPN`）服务，它可以加密你所有的互联网通信。有些
    `VPN` 服务是免费的或收取少量的费用。


    ![images](img/line.jpg)


    理解网络攻击与防御之间缺乏比例性，将从你监督职责的两个方面提供帮助。第一与网络安全投资有关。你意识到，需要挑战任何仅基于新网络攻击复杂性这一说法而引起的大额新投资号召。此外，你知道，网络攻击的复杂性并不是公司未能保护自己的有效借口。


    # 3


    # 误导的声音


    媒体、广告以及在某种程度上，流行文化影响了我们对网络风险的意识和优先排序，以及如何缓解这些风险。由于网络安全是一个相对较新的关注的话题，你可能没有背景来解读新闻标题，并确定它们对你公司的相关性，或者你应该问哪些后续问题。虽然随着时间的推移，增加网络安全的接触会让这个过程变得更容易，但在吸收网络安全新闻时，你需要考虑额外的因素。这些包括解读网络安全信息以及考虑来源利益和目标。


    网络安全领域最常见的评论员是`政府`和`网络安全厂商`。由于他们的大部分信息通过新闻媒体传达，我们将讨论影响哪些网络安全故事被报道、哪些不被报道的`媒体`特征。


    ## 政府


    政府的一项基本责任是提供公共利益。从历史上看，这包括提供国防、执法和提高生活水平的经济环境。尽管在实现这些目标的细节上仍存在分歧，但人们广泛认为这些是重要的优先事项。随着生活中各个各个领域数字化程度的提高，政府正在评估他们不断演变的角色以及如何更好地服务人民和公司。


    ### 警告责任


    政府通常会对迫在眉睫或预期的灾难提供警告：第二次世界大战期间伦敦的空袭、美国东南部的飓风、印度洋的海啸。这些情况都有两个特征。第一，建议的行动方案（例如，进入防空洞、开车或移到高地）是易于理解的。第二，人们可以遵循这些建议。


    遗憾的是，关于网络威胁的警告通常不那么易理解且具有可操作性。你可能记得，在 2018 年春天，美国和英国都发布了一份关于俄罗斯对政府、企业和个人进行网络攻击的建议。告建议强调了对网络路由器（将互联网带入家中的专用计算机）的威胁，以及对恒温器和摄像头等属于广泛物联网范畴的联网设备的威胁。告建议指出，尚不清楚俄罗斯黑客的成功有多大，甚至不知道此类入侵的意图。告建议以建议结束，即如何确定你自己的家庭网络是否被破解，以及如何加强其以防止未来可能的破解。


    问题在于，所提的建议超出了受到攻击的设备所有者的者的理解范围。此外，由于消费者与提供商之间的权力悬殊，某些建议（例如与互联网服务提供商谈判合同条款）是不可能实现的。


