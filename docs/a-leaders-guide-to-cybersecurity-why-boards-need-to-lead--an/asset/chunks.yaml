- fmt: '

    Ongoing business-as-usual activities can also introduce vulnerabilities into critical
    systems. Sometimes they are the natural continuation of the changes we discussed
    above. Giving a strategic vendor direct access to a company application is a onetime
    decision that causes change. The management of accounts for vendor employees,
    however, is an ongoing activity that could precipitate a cyber risk by, for example,
    mistakenly granting more-powerful permissions than needed. Storing business information
    in the cloud is a similar example of a single change followed by multiple opportunities
    for new cyber risks. Configuration mistakes in file repositories in the `Amazon
    Web Services` cloud have exposed the sensitive information of countless organizations,
    including the `NSA`, which exposed details on battlefield-intelligence systems,
    and `Accenture`, which lost passwords and encryption keys used to protect customer
    information.[[⁴](../Text/26_9781633698000_notes.html#ch9_rfn103)


    Just as supplier-provided software applications can contain vulnerabilities, so
    can software developed in-house. Software developers seldom write programs from
    scratch, preferring the efficiencies that come from assembling previously written
    routines, some from external sources. For example, in 2017, the government of
    Estonia suspended use of over three quarters of a million smart ID cards because
    of encryption weaknesses in third-party software built into the brains of the
    ID cards. The German graduate student who wrote the vulnerable software had no
    malicious intent; he simply demonstrated the difficulties in designing and writing
    complex programs.


    “Shadow IT” is employees’ use of technology without the knowledge or approval
    of the IT department. Setting up wireless networks connected to the corporate
    network is one example. This practice has expanded dramatically and now includes
    broad use of cloud-based services and internet of things devices. Usually, employees
    resort to these work-arounds to improve productivity and convenience. Since they
    believe that the IT department is too overextended to deploy the desired technology
    in a timely manner or that it wouldn’t approve, they go rogue.


    Although none of these changes rises to the level of your attention, you need
    assurance that people have identified these under-the-radar means of introducing
    new cyber risks and that suitable controls are in place to prevent them. Keeping
    in mind that your company’s own actions create new cyber risks will help you and
    senior executives be more alert when your company’s activities, structure, or
    business ecosystem change. Before you plan specific actions, any discussion of
    cyber risks is hypothetical, but you and other board members shouldn’t be discouraged
    from learning more about the broad cyber risk implications of business activities,
    such as establishing a joint venture, or technologies, such as the internet of
    things. It is simply means your oversight begins when your company is ready to
    do something. You don’t need to try to predict the future.


    ### Systematized Capture of Business Change


    To handle new cyber risks on an ongoing basis, your company needs to embed the
    processes for capturing business changes into its operations. Similarly, your
    company needs to routinize the processes for how it analyzes these cyber risks
    and determines the proper remediation course.


    Your company can start by looking for checkpoints in its existing change management
    and approval processes to capture relevant cyber-risk-related changes. It will
    likely need to augment these existing processes in two ways. The first is to expand
    their scope to include all types of business change that can introduce cyber risks.
    The second is to ensure that cybersecurity reviews are undertaken. Although many
    companies include cybersecurity reviews in projects that the IT department initiates,
    they often overlook projects that originate in other parts of the organization.


    In our experience, people commonly assume that someone else is handling cyber-risk-related
    tasks, absent any supporting evidence, due to a combination of confidence in cybersecurity
    and IT staff and a belief that the task is too obvious and important to ignore.
    If everyone involved in planning a business change assumes that someone else is
    taking care of cybersecurity issues, then no one is.


    All the risk identification, prioritization, and remediation activities we described
    in the previous chapter apply to the process of capturing new cyber risks. In
    addition, much of the analysis and findings developed when examining your company’s
    existing cyber risks, such as identification of cyberattacks that can cause the
    most damage and the controls to mitigate them, can be borrowed directly from cyber
    threat narratives. In a similar manner, your company should draw on the same combination
    of corporate expertise used in developing cyber threat narratives to codify triage
    criteria as well as prioritize new cyber risks. These include personnel who participate
    in the day-to-day conduct of business activities and administration of the computing
    systems that support these activities, and cybersecurity experts and specialists
    in other relevant disciplines, such as legal.


    Developing checkpoints is relatively straightforward. The challenge is deciding
    what to look at and at what depth; the volume of change can be significant, and
    it is infeasible to analyze everything. In the previous chapter, we suggested
    you prioritize scanning business activities based on how critical they are. These
    critical business activities are a good place to start since you’ll never have
    enough resources to review everything, especially in a timely manner.


    The processes and activities that ultimately enable companies to anticipate future
    cyber risks need to be internal. Only internal employees, not external consultants,
    can effectively know a company’s operations deeply enough to spot brewing dangers
    before they emerge into full-blown problems.


    From an oversight perspective, your job is to ensure your company:


    ![images](Images/box.jpg) Captures business changes that can introduce new cyber
    risks


    ![images](Images/box.jpg) Undertakes cybersecurity reviews of these changes to
    determine appropriate cyber risk mitigation


    The aide-mémoire for this step is [Fortify Inquiry 1](../Text/23_9781633698000_ch12.html#inq1)
    in [chapter 12](../Text/23_9781633698000_ch12.html).


    ## Know Your Company’s Current Risk Posture


    To meet your oversight responsibilities related to ongoing tracking of current
    risk posture, you must ensure that the companies you oversee:


    - Regularly test the effectiveness of their cyber risk controls

    - Track progress on cyber risk mitigation plans on an ongoing basis

