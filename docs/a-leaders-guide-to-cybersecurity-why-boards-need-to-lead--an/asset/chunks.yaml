- fmt: '

    Typically, the core incident response team includes cybersecurity and IT staff.
    Though some common skills apply to any cyber incident, the specialized skills
    your company’s incident response team needs depend on the types of cyberattack
    it will likely face. For example, response to a cyberattack that uses a virus
    could benefit from a specialist in reverse malware engineering. An expert in computer
    forensics, on the other hand, will be more useful in responding to a cyber incident
    arising from employee financial fraud. The cyberattacks and attack techniques
    identified in the cyber threat narratives help your company’s `CISO` decide which
    skill sets the team needs.


    Depending on the nature of the cyberattack, representatives from other departments,
    such as legal, HR, physical security, or law enforcement liaison, augment the
    core team. In the case of rare or seldom needed skills, it is often practical
    to retain a third-party provider. As a general rule, the company should maintain
    internally the expertise it needs frequently, while contracting scarce cybersecurity
    specialties only when required. Beyond these considerations, cyber incident responses
    that require deep understanding of a company’s operations are best staffed internally.
    Activities that benefit from broad exposure to similar situations are better left
    to third parties.


    Your oversight responsibility is to ensure that your company has in place:


    ![images](Images/box.jpg) A cyber incident response team, with the necessary skills,
    to respond effectively to the most damaging cyberattacks


    The aide-mémoire for this step is [Crisis Inquiry 1](../Text/24_9781633698000_ch13.html#crs1)
    in [chapter 13](../Text/24_9781633698000_ch13.html).


    ## Response Procedures


    The standard steps in responding to any cyber incident start with the determination
    that your company is or has been under cyberattack. Limiting the scope of an attack
    and restoring the affected computing systems are other typical elements of a response.
    Escalation and coordination with other functions within your company, including
    emergency and crisis management, are similarly common activities.


    Just as the skills required to respond to a cyberattack depend on the type of
    attack, some incident response procedures vary according to the type of attack.
    Response procedures that focus on the specifics of individual cyberattacks describe
    the associated activities and supporting tools needed. Before a cyber crisis strikes,
    your company should have both general-purpose cyber incident response procedures,
    as well as supplementary procedures for specific attacks.


    From an oversight perspective, your job is to ensure that your company:


    ![images](Images/box.jpg) Has the necessary cyber incident response procedures
    to address the most damaging cyberattacks


    The aide-mémoire for this step is [Crisis Inquiry 2](../Text/24_9781633698000_ch13.html#crs2)
    in [chapter 13](../Text/24_9781633698000_ch13.html).


    ## Incident Response Practice


    Preparing for a cyber incident is one thing but quite another to calmly put into
    action. What may seem clear and straightforward written in a procedure can be
    challenging to undertake under fire. One focus of practicing for a cyber incident
    response is technical skill and judgment in activities such as deciding if recent
    signals and events indicate a cyberattack is underway or configuring networks
    to prevent further intrusion into your company’s computing infrastructure.


    Another aspect of cyber incident response that warrants focused practice is logistics
    and coordination. While perhaps not as glamorous as malware reverse engineering,
    practice is both essential for successful response and often inadequately treated.
    For example, if staff need to reinstall software on a compromised computer locally,
    you need to know where the computer is physically located. Cyber incident response
    plans often identify points of contacts for coordination and escalation by title
    and department. For minimizing the frequency of updating plans, this makes sense,
    but in a crisis it’s essential to know the specific people to contact and their
    telephone numbers and be confident they know what to do when they answer the call.


    We use the words “practice” and “preparation” to describe these exercises. We
    specifically avoid the word “test,” which implies that you are evaluating or grading
    the participants. The purpose of the exercises is to identify areas that warrant
    additional focus. The exercises do not provide input for a performance review.
    Cyber incident response drills need to be sufficiently complex in order to test
    technical skills, decision making, communications, and logistics. A drill in which
    no one takes a false step and every response is successful does not improve your
    company’s cyber readiness and is a waste of resources.


    Ultimately, the goal of the exercises is to establish a well-founded confidence
    in your company’s technical and organizational ability to respond to cyberattacks.
    By bringing attention to the importance of the drills as a means of identifying
    areas for improvement, you are setting the tone and expectations that will result
    in much more valuable drills.


    From an oversight perspective, your job is to ensure that your company:


    ![images](Images/box.jpg) Conducts cyber incident response drills and exercises
    that address the most significant cyber risks it faces


    ![images](Images/box.jpg) Structures and organizes the drills to identify areas
    for increased focus and improvement


    The aide-mémoire for this step is [Crisis Inquiry 3](../Text/24_9781633698000_ch13.html#crs3)
    in [chapter 13](../Text/24_9781633698000_ch13.html).


    ## Executive Leadership


    Cyber crises are business crises that materialize as a result of cyberattacks.
    That means your executives can rely on the crisis management systems and processes
    already in place. They can also utilize the materials already prepared to manage
    the associated business crises. Armed with so much process support, executives
    can zero in on the major elements of crisis management that are affected by the
    three characteristics of cyber crises identified earlier in this chapter.


    What should executive leadership do or say in the event of a cyber crisis? Responses
    vary significantly depending on the nature of the crisis, your company’s overall
    circumstances, and its cybersecurity posture. However, whatever the right action,
    executives can prepare for the situations and decisions they will likely face
    in the event of a cyber crisis. This requires:


    •   Prioritization of cyber crisis preparation

    •   Corporate-level decision making during cyber crisis response

    •   Directing actions to restore both the company and affected parties

    •   Providing information to the public that is timely, responsive, and addresses
    stakeholder concerns


    ### Cyber Crisis Priorities


    Given the number and variety of cyber risks your company faces, it may be impossible
    to prepare executives for all the potential cyber crises that could arise. To
    rationalize the process of prioritizing cyber crisis preparation, we recommend
    you consider three factors.


    #### Significance and Impact


    When looking at which cyberattacks to prep executives for, you should give the
    highest priority to those that threaten your company’s most important business
    activities and would result in the gravest consequences. Since cyberattacks can
    damage business activities and a company so severely, you need to consider them
    differently than disruptions from other causes. Transmitting electricity across
    a power grid is a good example of a business activity selected on the basis of
    significance and impact. Loss of electricity, especially for a prolonged period
    of time, can cause significant harm to entire communities, and a cyberattack can
    have much more widespread impact than physical attacks on individual transmission
    substations.

