    An Asia-based multinational insurance company illustrates how the motivation to
    accomplish a corporate strategy can undercut cybersecurity. The company was on
    a spending spree to achieve targets for an aggressive acquisition-driven growth
    strategy. Independently, the board had commissioned an audit of cyber risks. Interestingly,
    the scope of the audit was limited to the core business and excluded the business
    development function and the M&A deal flow. Because the pressure to grow was so
    high, management did not want to introduce any risk of slowing down the deal pipeline,
    even if it meant introducing new cyber risks into the core business or overpaying
    for deals that were impaired due to preexisting cybersecurity problems.


    ## Path Forward


    You should assume employees and managers will put their own immediate and personal
    interests above your company’s cybersecurity needs. Both the IT staff who refused
    to update their firewalls and the automobile engineers who designed an unsafe
    work-around to help outside contractors access their company’s intranet illustrate
    this point. To blame these individuals for acting in their best interests isn’t
    useful and misses the point that companies are largely responsible for determining
    what their employees’ best interests are.


    Understanding employees’ day-to-day motivations is the key to more effective cybersecurity.
    If your company makes cybersecurity decisions that are informed by understanding
    employee motivation, it will be far better protected from cyber threats than would
    result from installing the latest version of a cybersecurity product.


    # PART THREE


    # The Responsibilities


    The responsibilities we describe in the following three chapters are the foundation
    of your digital stewardship. In fulfilling your responsibilities, you show your
    company the fundamental activities it must undertake, the dynamics it should consider,
    and the results it must deliver. Only you can provide this leadership, the essence
    of cybersecurity leadership.


    As the foundation, these responsibilities address the most critical cybersecurity
    objectives your company must achieve:


    *   Identification of cyber risks within the context of business priorities and
    value

    *   Seamless integration of cybersecurity activities within the fabric of business
    activities

    *   Leadership and effective response in the event of a cyber crisis


    Digital stewardship extends to include responsibilities such as engaging stakeholders,
    navigating regulations, and cultivating talent. All these rely on the foundation
    you are building.


    # 8


    # Manage Cyber Risks


    Your company’s primary cybersecurity responsibility is to manage the cyber risks
    it faces. Your corresponding governance duty is to ensure that your company identifies,
    understands, manages, and monitors cyber risks according to a clear set of business
    priorities.


    To meet your obligation, you need to address a number of overlapping questions,
    including:


    *   What cyber risks do we face?

    *   How could a cyberattack impact our business?

    *   Is our executive team engaged in prioritizing cybersecurity risks?

    *   Are we investing in the right areas to defend ourselves from cyberattacks?

    *   Are our cyber defenses effective?


    The following practical steps will help you answer these questions and more. To
    aid this process, we recommend that you take a fresh look at three elements of
    cyber risk management:


    1.  **The meaning of cyber risk.** Think of cyber risks in the context of the
    business risks that cyberattacks can cause.

    2.  **The role of cybersecurity controls.** View cybersecurity controls from the
    perspective of the business activities they protect, not just the technical attacks
    they prevent.

    3.  **Determinants of effectiveness.** Look beyond the technical capabilities
    of cybersecurity products and services to the nontechnical factors that determine
    success.


    ## Identify Cyber Risks


    To meet your oversight responsibilities for cyber risk identification, you must
    ensure that your company:


    *   Identifies cyber risks in the context of your company’s critical business
    activities and the risks to them

    *   Engages executive management in the process of cyber risk identification and
    business impact assessment


    ### Connecting Cyber Risks to Business Risks


    Richard Lancaster, the CEO of CLP, Asia’s third largest electricity provider,
    describes his company’s view of cyber risks: “Initially, we viewed cyber risks
    primarily as an IT issue. Over time, we realized that our generation and transmission
    systems were also at risk. Now we recognize cyber risk is really business risk,
    and my job as CEO is to manage business risk.”[[](../Text/26_9781633698000_notes.html#ch8_rfn67]
    Executives and experts agree with Lancaster’s views. The challenge is to connect
    the two in a way that supports board and executive engagement and provides clear
    guidance on cyber risk mitigation. The key is to decide where to start the connection
    process.


    The most common approach is to start with some technical method of cyberattack,
    such as malicious software or cracking passwords, and to then imagine the negative
    business outcomes that could result. Current market forces promote this approach.
    Vendors sell products, for example, to detect malicious software and increase
    the security of the log-in process, and standards describe general approaches
    for dealing with these types of threat. The challenge is that there is no basis
    for connecting a generic cyber risk with a business risk relevant to your company.
    Knowing that malicious software is a threat provides no actionable guidance in
    identifying the specific business risks it could cause.


    A more practical approach starts with identifying your company’s most critical
    business activities and the risks they face. From this starting point, your company’s
    cybersecurity group can identify how a cyberattack could cause the business risks
    to materialize. For example, imagine you’re on the board of a company that makes
    industrial products. You already understand the importance of your company’s production
    lines and the risks posed by tropical storms, power outages, or equipment failure.
    Now, ask the question: How could a cyberattack disrupt your company’s production
    lines?


    Think of robots. Among the benefits of automation is the relative ease with which
    an assembly line can be reconfigured to manufacture a different product simply
    by uploading a new program into the computers controlling the robots. This very
    flexibility makes your company vulnerable to a cyberattack. To disrupt your production
    line, a cyber adversary could change the computer programs that control the robots,
    which could cause the robots to operate incorrectly or stop working altogether.
    This approach of starting first with the business activity gives your cybersecurity
    team clear direction on what it needs to do—protect the integrity of robotic software—to
    prevent a business risk from occurring.


    This adjustment might seem like a minor change in the way you think about cyber
    risk, but the shift in mindset is profound. By starting with the business activity
    of manufacturing, general risks to this activity, and how computerized systems
    support it, you, other board members, and your company as a whole can clearly
    see the connection between business risk and cyber risk, and then use this insight
    to develop cyber defenses.


    ### Developing Cyber Threat Narratives


    After you’ve addressed cyber risks in the context of the associated risks to business
    activities, you need to establish a common basis of information for discussions
    and decisions. Prioritizing and fixing cyber risks is a social process, not just
    a technical task. Everyone, from executives, senior managers, and cybersecurity
    specialists to IT teams, will have their own perspectives and opinions. But you
    need to establish consensus in order to move forward with a unified sense of purpose
    and direction.

