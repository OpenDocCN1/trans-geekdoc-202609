    While there are generally no wrong answers in terms of which executive takes the
    cybersecurity group into their organization, some considerations can influence
    this decision. For example, given the ever-increasing cyber threats to industrial
    controls systems, and process automation in general, the chief operating officer
    (`COO`) is a logical choice. While an especially good choice for companies involved
    in critical infrastructure, it is also a logical choice for any manufacturing
    company.


    When CLP decided to hire a group `CISO`, one of its questions was where to put
    the person. The decision boiled down to ownership of risk. Derek Parkin, CLP’s
    Group `COO`, observed, “I am accountable for all of CLP’s operations, and so both
    physical security and safety are in my organization. Yet, I don’t have direct
    support in managing potentially the most damaging risk of all—a cyberattack.”[[⁶](../Text/26_9781633698000_notes.html#ch9_rfn105)
    That is no longer the situation, as the group `CISO` reports directly to him and
    sits just down the hall. Parkin sees additional benefits of adding cybersecurity
    to his organization through closer cooperation between physical security and cybersecurity
    and in extending the principles of safety culture to cybersecurity.


    General counsels are another good option for heading up the cybersecurity group.
    Whether by nature or nurture, corporate lawyers are always looking over the horizon
    to anticipate future problems and then take action to mitigate or eliminate the
    risks that could arise. Interestingly, we have found that many general counsels
    have an easier time understanding cyber risks and their consequences than do some
    software developers, who are focused on creating new and useful applications and
    not necessarily on how someone could subvert their creations to cause harm. Chief
    financial officers (`CFOs`) are also a good choice. Their involvement in strategic
    planning and their focus on fiscal discipline are two benefits.


    The final benefit for this placement relates to you and the board directly. As
    we’ve already stated, you and your board colleagues need accurate information
    for executing your oversight responsibilities. The further the `CISO` is removed
    organizationally from the board, the greater the risk of distorting his or her
    messages and findings on their way to you. Think of the childhood game of “Telephone,”
    in which children sit in a circle and the first one whispers something to the
    next child. This continues through the rest of the circle until returning to the
    first child, who inevitably observes that the message just heard bears no resemblance
    to what was said at the beginning of the game.


    There is one executive we don’t recommend that a `CISO` report to: the `CEO`.
    While you could see this reporting arrangement as the ultimate corporate statement
    of cybersecurity commitment, the net effect is the opposite. This placement effectively
    cuts cybersecurity off from the rest of the company and its operation. It puts
    cybersecurity in a silo, just one that is higher up the hill than other silos.


    From an oversight perspective, your job is to ensure your company:


    ![images](Images/box.jpg) Has a rationale for the placement of the cybersecurity
    group that considers integration with the rest of the company, freedom from interference,
    and optimized communication with the board


    The aide-mémoire for this step is [`Fortify Inquiry 4](../Text/23_9781633698000_ch12.html#inq4)`
    in [`chapter 12](../Text/23_9781633698000_ch12.html)`.


    ### Board Expertise


    The opportunities for optimizing a company’s cybersecurity effectiveness through
    organizational structure do not extend to the board itself. Essentially, boards
    don’t need to change and can organize themselves, their committees, and procedures
    however they please, so long as they keep in mind the digital stewardship principle
    “Make cybersecurity mainstream.”


    Given cybersecurity’s increasing importance and board members’ general lack of
    cybersecurity experience, there are calls for enhancing their capabilities by
    appointing independent nonexecutive directors (`INEDs`) with cybersecurity backgrounds
    and establishing cybersecurity committees. In addition to the woefully small pool
    of candidates to draw from, there are several other reasons why this seemingly
    good idea of appointing cybersecurity-savvy `INEDs` is counterproductive. The
    first is the natural consequence that the rest of the board members will think
    they don’t need to pay attention to cybersecurity because they assume someone
    else is handling it and will do a better job than they ever could. And, the `INED`
    risks becoming a likely scapegoat in the event of a breach. Cybersecurity experience
    is also not a good indicator that a candidate will be a good board member overall.
    The narrow perspective and technology focus of many cybersecurity experts mitigates
    against productive board service. An `INED` with deep technical cybersecurity
    expertise could further blur the line between governance and management.


    Boards should also not have a dedicated cybersecurity committee. As we’ve discussed,
    one of the most significant impediments to effective cybersecurity is partitioning
    cybersecurity organizations and activities from the rest of the company, resulting
    in isolated cybersecurity decision making, without adequate consideration of business
    factors. It further results in the mistaken impression that the committee is taking
    care of cybersecurity, so there is no need for concern. Therefore, creating a
    cybersecurity committee, a seemingly positive move, is actually counterproductive.
    The same is true of having cybersecurity be part of a technology committee, because
    it reinforces the idea that it’s just a technology issue and something that nontechnologists
    can ignore.


    CLP’s general counsel and company secretary, David Simmonds, works closely with
    the board of directors. “Cybersecurity is not so impenetrable as presumed,” he
    observed. “It is not just about high-end technology. It is a broad governance
    issue, just like a lot of other things boards do. We don’t need to have a cyber
    expert on the board; actually, that would be counterproductive.”[[⁷](../Text/26_9781633698000_notes.html#ch9_rfn106)
    Simmonds continued, “The board views the management of cyber risk as a top priority
    and their cybersecurity oversight an important responsibility. Increased time
    for cybersecurity on board agendas and audit and risk committee participation
    in cyber drills are examples of this commitment.”


    There are ways to simplify a board’s digital stewardship oversight responsibilities
    and reduce the time required to fulfill these responsibilities through organizational
    support. The aide-mémoires provide a collection of inquiries you can use as the
    basis for fulfilling your digital stewardship governance responsibilities. The
    aide-mémoires further describe and provide examples of the types of information
    and evidence that respond to the inquiries. Some of this information, such as
    prioritization of critical business activities, invites your feedback. Other information
    gives you background and context that make it easier to understand the cyber risks
    your company faces.


    Additional evidence confirms that your company has undertaken the necessary cybersecurity
    activities and has accounted for all of the relevant dynamics and factors. Creation
    of an inventory of computer systems on which a critical business activity relies
    is one example. While you need to know the company has undertaken this technical
    activity, there is no additional value in your review of the inventory. In this
    context, the internal audit department can assist you and the board in two ways
    that reflect internal audit’s fundamental mission to assess controls and its direct
    and unique relationship with the board.

