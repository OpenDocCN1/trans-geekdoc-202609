    group. One factor to consider is the alignment of interests and objectives between
    CISOs and their superior. CISOs and their group’s activities should not conflict
    with their superiors’ own objectives and incentives. Historically, IT departments
    have held primary responsibility for cybersecurity, so newly formed cybersecurity
    groups are commonly located there. This decision seldom accounts for the differences
    in mission and motivation between a chief information officer (CIO) and a CISO.


    Broadly speaking, companies reward CIOs for deploying new systems and applications
    and upgrading computer and network infrastructure, all while accomplishing these
    tasks more quickly and at a lower cost than in the previous year. At a high level,
    CISOs are responsible for setting cybersecurity strategy and undertaking many
    of the cyber-risk-related activities we described earlier in this chapter. Fulfilling
    these responsibilities may affect some of the activities for which a CIO is rewarded
    and negatively affect a CIO’s compensation if, for example, a milestone is missed.
    Beyond personal financial considerations is the issue of the CISO’s budget and
    the cybersecurity activities, including the purchase of cybersecurity technology
    controls, that the budget can support. Since the CISO’s budget is part of the
    CIO’s budget, the CIO essentially makes the final decision between spending money,
    for example, to improve employee experience and spending money to mitigate the
    risk of some type of cyberattack.


    We do not mean to indict CIOs; we have worked with many who have put their company’s
    cybersecurity needs above their own financial benefit. However, sound corporate
    governance can neither rely on employees acting against their own best interests
    nor rely on the character and judgment of an individual who happens to hold the
    CIO position at a particular time. If a CISO currently reports to the CIO, the
    company should identify the controls that compensate for this inherent conflict
    of interest.


    The decision on placement of the cybersecurity group should consider additional
    factors, such as the level of the executive to whom the CISO reports. While each
    company has its own unique characteristics that can influence the location decision,
    we recommend first looking at the CEO’s direct reports. Having a CISO report at
    this level offers several benefits. The accomplishment of a CISO’s goals and the
    success of a cybersecurity group’s activities require cooperation across a company
    from employees who do not report to the CISO. A CISO’s ability to wield the necessary
    influence to gain this cooperation is greatly strengthened by reporting to a member
    of the CEO’s executive team. Further, placing a CISO and the cybersecurity group
    at this level makes a stronger statement about a company’s commitment to and prioritization
    of cybersecurity than any memo or statement. This placement also facilitates the
    integration of cybersecurity activities and decision making into the mainstream
    of company operations, as the CISO is naturally part of discussions about the
    kinds of business changes that introduce cyber risks.'
