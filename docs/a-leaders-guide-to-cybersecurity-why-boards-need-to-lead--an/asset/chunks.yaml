  raw: 'The military and intelligence communities have long been concerned with the
    integrity of information; formal cybersecurity work on the topic was published
    in 1975.[⁵](../Text/26_9781633698000_notes.html#ch8_rfn71) With the ever-increasing
    automation of business activities, commercial ventures should also be concerned
    about integrity.


    #### Supporting Systems


    The target for a cyberattack is one or more of the computer systems that support
    a business activity. Therefore, to mount a cyber defense, your company needs to
    identify these computer systems and the services and functionality they provide.


    Operations personnel should kick-start the discovery process because they are
    familiar with the computer systems and applications they use, and the consequences
    if the systems were to malfunction or cease to function. Systems staff, who maintain
    the computer systems and know the full scope of their role, including functions
    not visible to operations staff, should aid in the process, too. Generally, IT
    staff people fill this systems role for general-purpose computers, and engineers
    fill the role in industrial control systems environments.


    Given the complexity of computer systems and networks, all the computer systems
    supporting a critical business activity need to be inventoried. The inventory
    must include the physical locations of the systems so that cyber incident response
    staff know where they need to go to fix things in the event of a cyberattack.


    Your oversight responsibility for this step is to gain assurance that:


    ![images](Images/box.jpg)   Your company has up-to-date inventories of the computer
    systems its critical business activities rely on


    The aide-mémoire for this step is [Risk Inquiry 2](../Text/22_9781633698000_ch11.html#risk2)
    in [chapter 11](../Text/22_9781633698000_ch11.html).


    #### Cyberattacks and Consequences


    ##### CYBERATTACKS


    The next element of a cyber threat narrative identifies and characterizes the
    different types of cyberattacks that could cause a business risk. This entails
    examining the approaches and requirements for a successful attack.


    At its most basic level, a cyberattack employs a variety of techniques, known
    as “threat vectors,” to exploit vulnerabilities in computer systems. As the first
    line of inquiry, cybersecurity staff people need to identify and correlate cyberattack
    techniques with inherent vulnerabilities in the supporting computer systems. For
    example, in the WannaCry incident, the cyberattack technique consisted of malicious
    software exploiting security programming mistakes in Microsoft applications. The
    inherent vulnerability was running applications that had security-relevant programming
    mistakes.


    Attacks are not always sophisticated or technically complex. For example, one
    vulnerability common to all computers is an administrator’s almost complete control
    over the information and applications on it. This power is necessary for proper
    operation and maintenance, but an administrator can abuse it. In this case, the
    attack technique is nothing more than an administrator deciding to misuse her
    power.


    In the manufacturing disruption example, an adversary could take two basic approaches
    to corrupt a robot’s software instructions. One uses features within a robot to
    gain control over the process to upload instructions. Depending on the robot design,
    this may or may not require a password or special permission. Alternatively, the
    adversary could use malware that exploits a vulnerability in the robot’s own underlying
    computer systems and bypass all restrictions on uploading instructions. In both
    cases, the adversary would need to connect to the robot using a network connection
    or plugging a USB or other device into it.


    ##### EXTENT OF IMPACT


    Cyberattacks are not limited by geography. An attack can originate anywhere in
    the world and quickly spread across an entire enterprise through its corporate
    networks. For example, the pilfering of some 94 million credit cards from TJX,
    a multinational retailer with two thousand stores in North America and Europe,
    started in a suburban strip-mall parking lot in Miami, when a hacker gained access
    to the Wi-Fi networks of two of the company’s Marshalls-branded discount clothing
    stores from his car.[⁶](../Text/26_9781633698000_notes.html#ch8_rfn72) This shows
    the sweeping pain a cyberattack can inflict. Not only was the entire Framingham,
    Massachusetts–based company hurt by what happened in Miami, but all of its brands,
    not just Marshalls, were affected. Customers at its larger, namesake TJ Maxx brand
    were also swept up by what happened.


    The scale and volume of damage resulting from a cyberattack can be far more extensive
    than that associated with many other types of attack and criminal activity. In
    the case of intellectual property theft, the amount of trade secrets and other
    proprietary information that someone can transmit electronically out of a company
    vastly exceeds what they can carry out the door.


    The trend of increasing digital control over critical infrastructure further expands
    the extent of impact. For example, coordinated cyberattacks on three Ukrainian
    electricity companies in December 2015 left the 230,000 residents of Ivano-Frankivsk
    without electricity for up to six hours.[⁷](../Text/26_9781633698000_notes.html#ch8_rfn73)
    Recent analysis of the hacking tool that caused this outage shows that it could
    be used on a much larger scale.[⁸](../Text/26_9781633698000_notes.html#ch8_rfn74)
    Perhaps the most pertinent reason cyberattacks result in consequences far exceeding
    other causes is because there is an adversary behind the attack.


    ##### ATTACK REQUIREMENTS


    Not all cyberattacks are created equal. Nor are all equally easy to carry out.
    In order to know the types of cyberattacks you and your company should worry about,
    you first must ensure your company understands what an adversary needs to mount
    a successful cyberattack. The three types of cyberattack prerequisites are:


    1.   *Knowledge* covers what an adversary needs to know; it can range from programming
    malicious software to managing the systems used to operate hydroelectric dams.


    2.   *Tools and equipment* include not only hacking tools, but equipment such
    as laptops and radio transmitters.


    3.   *Position* is where an adversary is and can either be geographic (for example,
    a point on a map) or organizational (for example, an employee or contractor).


    In the debit card fraud we examined at a Southeast Asian bank, the required knowledge
    included the format of Visa and Mastercard authorization codes and how to configure
    a credit card terminal. The tools included several of the terminals, along with
    a database of debit card account numbers. The attackers had to be in the local
    vicinity to coordinate with merchants who were complicit with the fraud but didn’t
    necessarily need to work at the bank or get inside.


    In addition to considering the feasibility of different types of cyberattacks,
    think about how an adversary could use easier, noncyber means to compromise a
    business activity. For example, an insurance company operating in Asia initially
    was concerned that its agents might write policies against which they would submit
    fraudulent claims by exploiting potential vulnerabilities in the mobile application.
    But, after realizing that it would be much simpler for an agent to use a friend
    or relative to accomplish the same goal, the company dropped its concern.


