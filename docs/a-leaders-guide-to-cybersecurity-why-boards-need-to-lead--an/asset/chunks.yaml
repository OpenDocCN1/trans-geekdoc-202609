    ### Rationale

    **Rationale**

    Cyberattacks disrupt critical business activities by exploiting vulnerabilities
    in the computer systems that support these activities. In order for your company
    to understand the cyber risks it faces, it first needs to know what the systems
    are and their vulnerabilities. Further, the rollout of cybersecurity controls
    can be a lengthy process. Phased deployment of the controls should be based on
    the importance of the business activities they support. In the event of a cyberattack,
    the response team needs to know where the affected computers are located in order
    to perform many remediation activities.


    **Evidence**

    *   Computer system inventories, including hardware, software, and machine location
    for each of the identified critical business activities. IT departments commonly
    maintain hardware and software inventories, though these inventories are often
    not kept up-to-date or do not include location information.

    *   Description of the processes and tools your company uses to keep the inventories
    up to date and a few inventory update examples to demonstrate that the processes
    are in use.


    **Oversight**

    *   Confirm that these inventories exist and that the processes and tools for
    keeping them up-to-date are used.


    ---


    ### TABLE 11-3: Cyberattacks and consequences


    | Risk Inquiry 3 | “What are the most significant types of cyberattacks that can
    cause critical business activity risks to materialize and what are the ranges
    of possible impact to both the company and stakeholders?” |

    | :--- | :--- |

    | **Rationale** | By making this inquiry, you are helping ensure that your company’s
    treatment of cyber risk is aligned with overall business risk management and your
    company’s risk appetite. The impact of a cyberattack is often greater than that
    of other causes of business disruption. Prioritization of risk mitigation activities
    and controls should account for these differences. |

    | **Evidence** | *   Descriptions of the most significant types of cyberattacks
    that can cause risks to critical business activity to materialize and the ranges
    of possible impact. There is an almost unlimited number of variations in which
    a cyberattack can be executed. It is neither practical nor useful to enumerate
    all of them. It is sufficient for your purposes in this inquiry that your company
    identifies basic types of cyberattack, such as an external attack that uses malicious
    software or an employee who misuses his computer privileges. |

    | **Oversight** | *   Confirm that your company has identified the most significant
    risks to critical business activities arising from cyberattacks and the ranges
    of possible impact. <br>*   This inquiry gives you the opportunity to learn more
    about types of cyberattacks and the extent of damage they can inflict on your
    company and its operations. |


    ---


    ### TABLE 11-4: Cyber adversaries


    | Risk Inquiry 4 | “Who is likely to mount a cyberattack against the company and
    what are their motivations and resources?” |

    | :--- | :--- |

    | **Rationale** | Knowing the types of adversaries who are motivated to attack
    your company is useful input in determining the likelihood of a cyberattack. |

    | **Evidence** | *   List of likely cyber adversaries, their motivations, and
    resources for executing cyberattacks. These motivations may arise from specific
    aspects of your company, such as business practices, high-value trade secrets,
    or geographic footprint. |

    | **Oversight** | *   Confirm that your company factors this information into
    cybersecurity strategy development. <br>*   Offer suggestions on likely cyber
    adversaries and their motivations. |


    ---


    ## Mitigate Cyber Risks


    ### TABLE 11-5: Prioritize cyberattacks


    | Risk Inquiry 5 | “Provide a prioritized list of cyberattacks, based on the following
    considerations:<br>*   their capacity to cause risks to critical business activities,<br>*   the
    range of possible impacts,<br>*   the resources required for a successful attack,
    and<br>*   the motivations and capabilities of likely cyber adversaries.” |

    | :--- | :--- |

    | **Rationale** | This list is a statement of your company’s priorities for cyber
    risk mitigation. The framing of the inquiry ensures that these priorities are
    firmly based on mitigating the most likely and impactful business risks to your
    company. |

    | **Evidence** | *   The prioritized, descriptive list of cyberattacks. |

    | **Oversight** | *   Confirm that the list takes into account the four considerations
    identified in the inquiry. |


    ---


    ### TABLE 11-6: Select controls


    | Risk Inquiry 6 | “Provide a list of recommended cyber controls whose selection
    is based on their suitability to mitigate the prioritized cyberattacks.” |

    | :--- | :--- |

    | **Rationale** | This inquiry provides assurance that your company’s cybersecurity
    investments address its most significant cyber risks and that the protection benefits
    of these controls are understandable in a business context. |

    | **Evidence** | *   The list of recommended cyber controls, including the cyberattacks
    each control helps mitigate and the business activity risks each control therefore
    helps avert. Generally a basket of controls, instead of a single control, is used
    to mitigate cyberattacks. |

    | **Oversight** | *   Confirm that the descriptions of the recommended cyber controls
    reference the associated cyberattacks and business activities. <br>*   This inquiry
    gives you the opportunity to learn more about the relationship between cyberattacks,
    the business activities they can disrupt, and the measures—that is, controls—your
    company is taking to mitigate these risks. |


    ---


    ### TABLE 11-7: Examine control effectiveness


    | Risk Inquiry 7 | “Identify the measures the company is taking to overcome nontechnical
    impediments to the proper management of controls and the effectiveness of controls
    in practice.” |

    | :--- | :--- |

    | **Rationale** | The effectiveness of even the most sophisticated cybersecurity
    controls can be negated if nontechnical dynamics relating to the management of
    the controls or employee behavior when confronted by the controls are not taken
    into account. |

    | **Evidence** | *   Descriptions of the measures your company is taking to neutralize
    nontechnical dynamics that undercut the administration and configuration of controls.
    Underlying causes can include lack of clarity on the intended use of a control
    or an expected negative response, should strict application of a control interfere
    with business operations. This evidence applies primarily to cybersecurity and
    IT staff. <br>*   Descriptions of the measures your company is taking to account
    for predictable employee reactions to controls. This includes situations in which
    the burden of using a control properly is too high or a control impedes work.
    This evidence applies to employees broadly. |

    | **Oversight** | *   Confirm that your company is addressing these nontechnical
    dynamics. If your company hasn’t identified any impediments to control effectiveness,
    then it needs to look again. |


    ---


    ### TABLE 11-8: Develop remediation plan


    | Risk Inquiry 8 | “Provide a cyber-risk-remediation plan that demonstrates how
    and when the deployment of selected controls, and associated activities, reduces
    the company’s most critical cyber risks to an acceptable level.” |

    | :--- | :--- |

    | **Rationale** | Beyond providing a cybersecurity road map, the cyber risk remediation
    plan is a statement of the investments and activities your company thinks are
    sufficient to protect its critical business activities from their associated cyber
    risks. The implication is that once the company deploys controls, develops related
    capabilities, and puts ongoing processes in place, these business activities are
    receiving the level of cyber protection they need. |

    | **Evidence** | *   A cyber-risk-remediation plan that, in effect, is your company’s
    statement of the activities and investments needed to reduce its cyber risks to
    an acceptable level. |

    | **Oversight** | *   Confirm development of the cyber-risk-remediation plan.
    |

