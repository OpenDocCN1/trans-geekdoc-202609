    \ to capture changes that can introduce new cyber risks, including:\n\n*   new\
    \ and updated business activities,\n\n*   changes to business structure,\n\n*\
    \   changes in external business ecosystem, and\n\n*   changes resulting from\
    \ the conduct of ongoing business activities?”\n\n |\n\n| --- | --- |\n\n| Rationale\
    \ || Tracking the types of changes identified in the inquiry is the most practical\
    \ approach to identifying the modifications or additions to computer systems that\
    \ could introduce new cyber risks to your company’s business activities. Your\
    \ company will only be able to consistently manage cyber risks on an ongoing basis\
    \ if this change-capturing process is integrated into the routine operations of\
    \ your company. |\n\n| Evidence || \n\n*   Change management documentation for\
    \ all the types of change identified in the inquiry. The documentation should\
    \ include the following information: \n\n    *   The hooks and checkpoints for\
    \ cyber review\n\n    *   The (triage) rationale for deciding which changes need\
    \ further cyber risk examination\n\n    *   Follow-through for cyber-risk-mitigation\
    \ action\n\n    *   Assigned responsibilities and required competencies\n\n* \
    \  Samples of notes, email exchanges, and so on relating to cases where cybersecurity-relevant\
    \ changes were detected and remediation initiated.\n\n |\n\n| Oversight || \n\n\
    *   Confirm that the company has change management processes in place and is using\
    \ them to capture cybersecurity-relevant changes, and that it is initiating cyber-risk-remediation\
    \ actions when needed.\n\n |\n\n## Managing New Cyber Risks\n\nThe information\
    \ your company needs to understand and manage new cyber risks is the same as described\
    \ in [chapter 8](../Text/18_9781633698000_ch8.html) for existing cyber risks.\
    \ Therefore, your oversight of your company’s management of new cyber risks uses\
    \ the same aide-mémoires introduced in [chapter 11](../Text/22_9781633698000_ch11.html).\
    \ Since many of your company’s new cyber risks will relate to existing business\
    \ activities and supporting systems, it can use much of this prior analysis and\
    \ documentation in understanding new cyber risks going forward.\n\n## Know Your\
    \ Company’s Current  \n\nCyber Risk Posture\n\nTABLE 12-2\n\nControl performance\
    \ testing\n\n| Fortify Inquiry 2 || “Provide test results that quantify control\
    \ performance in mitigating the cyber risks for which the controls were selected.”\
    \ |\n\n| --- | --- |\n\n| Rationale || There is a significant difference between\
    \ deploying a cyber control and receiving the protection it is supposed to provide.\
    \ Through this inquiry, you help ensure both the soundness of your company’s investments\
    \ in cyber controls and the reliability of these controls to protect your company.\
    \ |\n\n| Evidence || \n\n*   The results of cyber-control-effectiveness testing,\
    \ including explanations of the significance and implications of the results in\
    \ terms of preventing business risks from materializing. Controls cannot be used\
    \ to test their own effectiveness.\n\n |\n\n| Oversight || \n\n*   Confirm that\
    \ your company has done the testing and analysis.\n\n*   Deepen your understanding\
    \ of the connections between different cyber controls and the protection they\
    \ provide to your company’s most significant business risks.\n\n |\n\nTABLE 12-3\n\
    \nCyber-risk-mitigation plan progress\n\n| Fortify Inquiry 3 || “Provide a current\
    \ status update on the cyber-risk-mitigation plan. In conjunction with the results\
    \ of the cyber control effectiveness testing, describe the current residual cyber\
    \ risks facing the company’s critical business activities.” |\n\n| --- | --- |\n\
    \n| Rationale || This inquiry gives you an objective way to measure your company’s\
    \ progress in mitigating the most significant cyber risks it faces. In conjunction\
    \ with the quantitative control-testing results from the previous inquiry and\
    \ the previously established relationships between controls and the business activities\
    \ they protect, you have the basis for truly understanding your company’s cybersecurity\
    \ posture and where it’s heading. |\n\n| Evidence || \n\n*   Status report on\
    \ cyber-risk-mitigation plan.\n\n*   Incorporating the results of the previous\
    \ inquiry, a statement of current residual risk for all critical business activities\
    \ identified in Risk Inquiry 1, “Critical Business Activities and Risks,” and\
    \ projected date for when the residual cyber risk for each critical business activity\
    \ will reach an acceptable level.\n\n |\n\n| Oversight || \n\n*   Confirm that\
    \ the company has developed a status report and that it is timely.\n\n*   This\
    \ inquiry further helps you understand one of the most important questions you\
    \ and your fellow board members have: “How well is our company protected from\
    \ cyber risks?”\n\n |\n\n## Optimize Cybersecurity Efficacy\n\nTABLE 12-4\n\n\
    Cybersecurity group location\n\n| Fortify Inquiry 4 || “Describe the rationale\
    \ for the placement of the chief information security officer (CISO) and the cybersecurity\
    \ group within the company. Describe how this placement considers integration\
    \ with the rest of the company and freedom from interference, and optimizes communication\
    \ with the board.” |\n\n| --- | --- |\n\n| Rationale || The placement of the cybersecurity\
    \ group within your company plays a large role in how successful it will be. For\
    \ historical reasons, cybersecurity groups have often been established in IT departments,\
    \ although there is an inherent conflict of interest between a CIO and a CISO.If\
    \ your company’s cybersecurity group resides in the IT department and it is not\
    \ currently feasible to move the group, then you need assurance that your company\
    \ is managing this conflict of interest. This is a governance issue and not intended\
    \ as a personal criticism of any CIO. |\n\n| Evidence || \n\n*   Rationale for\
    \ the cybersecurity group’s placement in the company.\n\n*   Measures the company\
    \ is taking to avoid potential conflicts of interest that could undercut the CISO’s\
    \ effectiveness.\n\n |\n\n| Oversight || \n\n*   Confirm that your company is\
    \ addressing this dynamic.\n\n |\n\nTABLE 12-5\n\nPromote transparency\n\n| Fortify\
    \ Inquiry 5 || “How does the company foster a corporate environment in which cybersecurity\
    \ information, especially negative information, is readily and rapidly reported?”\
    \ |\n\n| --- | --- |\n\n| Rationale || This inquiry acknowledges many employees’\
    \ reluctance to report bad news, especially if could reflect poorly on them. It\
    \ recognizes that your company’s ability to defend itself from cyberattacks depends\
    \ much more on the swift communication of negative news than it does on touting\
    \ successes.As a board member, you are uniquely positioned to influence your company’s\
    \ culture in a way that directly improves its cybersecurity posture through improved\
    \ communications. |\n\n| Evidence || \n\n*   An official corporate policy on the\
    \ importance of communicating cybersecurity-related information, with an emphasis\
    \ on the lack of punitive consequences for employees whose nonmalicious actions\
    \ may have contributed to a cybersecurity issue."
