    The responsibility chapters and aide-mémoires contain significant detail on the
    activities your company should undertake and the evidence it should provide. There
    are a couple of interrelated motivations for providing this level of detail. First,
    we want to make cybersecurity oversight as simple and straightforward for you
    as possible by giving clear guidelines for your company’s reference and use. Additionally,
    we want to show your company what it needs to do to expand its attention beyond
    technical matters to capture the information and undertake the necessary analysis
    to protect it from cyber risks.


    This includes giving you and other board members appropriate and understandable
    information. The first principle of digital stewardship states that you deserve
    explanations of cybersecurity you can understand. We wrote this not just to make
    cybersecurity governance easier for you. It also helps cybersecurity staff do
    a better job. If they can explain, for example, the connections between disruptions
    to a critical business activity and the cyberattacks that can cause them, they
    are in a much better position to know where to focus their cyber defense activities.
    And they are also better positioned to ask for funding for cyber defenses, because
    the benefit of the investments can now be clearly understood in a business context.
    Further, we want to show that all the activities that boards and their companies
    need to undertake for effective cyber risk management are practical and straightforward.
    No magic is needed or large armies of consultants. Employees who are deeply familiar
    with how their company operates perform these activities most effectively.


    At a mechanical level, you change and improve your company’s cybersecurity activities
    and defensive posture through your oversight requests for evidence. Put more simply,
    you promote this improvement by changing the focus of conversation from technology
    to the business that the technology supports. This change in focus not only improves
    the effectiveness of cyber risk management, but reduces the difficulty and burden
    on the board, executive leadership, and cybersecurity staff. For you and executive
    leadership, cybersecurity discussions and decision making are greatly simplified
    as a result. For cybersecurity staff, addressing nontechnical dynamics and talking
    with that affected people is much easier than many cybersecurity technical tasks.
    This change in conversation shifts attention from more difficult but less useful
    activities to those that are easier and more beneficial.


    # Stewardship for the Future


    We have discussed how you and other board members are the natural leaders for
    your companies’ cybersecurity efforts. But what about the broader question of
    cybersecurity leadership? Who can lead?


    It is natural to look to governments for cybersecurity leadership, given their
    traditional military and law enforcement responsibilities. There are times when
    government agencies notify companies of external network attacks that the companies
    themselves are not aware of. But upon closer examination, governments are not
    well positioned to provide the assistance or leadership companies need. For example,
    they will never be able to understand the intricacies of cybersecurity issues
    within a company. They are also incapable of fielding sufficient staff to assist
    more than a small fraction of commercial enterprises, let alone the population
    at large.


    The dynamics are quite different if you shift your view from governments to the
    commercial world. Companies like yours, and not governments, build, own, and manage
    the vast majority of the information, infrastructure, products, and services on
    which governments, commerce, and society at large depend. Companies are on the
    front lines of cyberattack and defense. The cyber protections your company incorporates
    into its products and services will influence how well the users of its wares
    will fare when they are under cyberattack.


    Viewed from this broader perspective, the quality and effectiveness of your company’s
    cybersecurity activities benefit not just the company and its immediate stakeholders,
    but the world at large. In fulfilling your cybersecurity governance responsibilities
    for your own company, you are effectively contributing to a safer digital world
    overall.


    And you can start today.


