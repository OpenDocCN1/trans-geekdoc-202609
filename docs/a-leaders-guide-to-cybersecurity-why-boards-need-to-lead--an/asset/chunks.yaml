    # 13 Aide-Mémoire: Lead in Crisis


    The purpose of this `aide-mémoire` is to give you the assurance you need that
    your company is ready to respond in the event of a cyberattack-induced crisis.
    This readiness includes both your company’s technical capabilities to respond
    to a cyberattack and the executive team’s preparedness to lead and communicate
    during a crisis. While incomplete information, uncertainty, and surprises are
    found in every crisis, the types of technical skills and resources your company
    will need and the decisions your executives will face are largely predictable
    and can be prepared well ahead of a crisis.


    ## Cyber Incident Response


    ### TABLE 13-1: Staffed to respond


    | Crisis Inquiry 1 | “Does the company have sufficient staffing to respond effectively
    to the most damaging types of cyber incidents?” |

    | --- | --- |

    | Rationale | While there is a common set of skills necessary to respond to any
    cyber incident, the full set depends on the type of incident. This inquiry informs
    you that your company is prepared to respond to the types of cyber incidents that
    can cause it the most significant damage. |

    | Evidence | * List of core cyber incident response team members, their roles,
    and qualifications.<br>* List of extended, internal team member departments, their
    roles, and the types of cyber incidents in which they engage.<br>* List of third-party
    incident response services, the types of cyber incidents for which they are engaged,
    and their contractual responsibilities.<br>* How the company will continue to
    operate when staff are diverted to response activities. |

    | Oversight | * Confirm that the information is provided and addresses the prioritized
    cyberattacks identified in `Risk Inquiry 5` in `[chapter 11](../Text/22_9781633698000_ch11.html)`.<br>*
    This inquiry gives you the opportunity to learn about the different types of skills
    involved in responding to cyber incidents affecting your company. |


    ### TABLE 13-2: Cyber incident response plans and procedures


    | Crisis Inquiry 2 | “What formal planning has the company done to prepare for
    responding to different types of cyber incidents?” |

    | --- | --- |

    | Rationale | Just as the response to different types of cyber incidents requires
    different skills, they also require different types of response activities and
    associated tools. You need assurance that your company’s cyber incident response
    team has thought through the types of cyber incidents it could likely face, understands
    the kinds of responses associated with the incidents, and has made the necessary
    preparations. |

    | Evidence | * Cyber incident response plans that address the standard steps involved
    in any cyber incident, as well as additional activities that are relevant for
    specific types of cyber incidents.<br>* Identification of the necessary incident
    response tools and how your company will have access to them in the event of an
    incident. Your company may have some of the more frequently used tools in-house,
    while relying on third-party service providers for those less frequently used.
    |

    | Oversight | * Confirm that cyber incident response plans are provided and address
    the prioritized cyberattacks identified in `Risk Inquiry 5` in `[chapter 11](../Text/22_9781633698000_ch11.html)`.
    |


    ### TABLE 13-3: Incident response practice


    | Crisis Inquiry 3 | “What incident response drills and exercises has the company
    undertaken? What types of cyber crisis is it planning?” |

    | --- | --- |

    | Rationale | Given the pressure during a crisis, it is beneficial to practice
    for the most significant cyber crises. More importantly, the drills will make
    these responses much more valuable. |

    | Evidence | * Plans for the prioritized cyberattacks that can cause the most
    significant business and crises.<br>* Cyber incident response drills that test
    technical skills, decision making, and logistics.<br>* Plans for the incident
    responses. |

    | Oversight | * Attend incident response drills.<br>* Confirm that the incident
    response drills address the cyberattacks that could lead to a crisis. |


    ## Executive Leadership


    ### TABLE 13-4: Set cyber crisis priorities


    | Crisis Inquiry 4 | “What cyber crises has the company identified for executive
    preparation?” |

    | --- | --- |

    | Rationale | It is not feasible to prepare executives for every type of cyber
    crisis, yet it is critical that they are prepared should a cyber crisis occur.
    By posing this inquiry, you ensure that your company is preparing executives for
    the most significant cyber crises. |

    | Evidence | * Descriptions of the cyber crises selected for executive preparation,
    along with the rationale. These rationales should include:<br>* The significance
    of affected business activities and severity of impact<br>* Heightened risk due
    to lack of controls<br>* Portfolio of different types of cyber crisis |

    | Oversight | * Confirm the selection of cyber crises and the underlying rationales.<br>*
    Provide thoughts on additional types of cyber crises. |


    ### TABLE 13-5: Cyber crisis scenarios


    | Crisis Inquiry 5 | “Provide cyber crisis scenarios that describe cyberattacks
    that could cause a crisis, the broad context in which an attack could occur, and
    the range of consequences.” |

    | --- | --- |

    | Rationale | In order for executive discussions on potential cyber crises to
    be useful, the scenarios have to be realistic and clearly connect a cyberattack
    on your company’s computers with the impact to your company’s business. |

    | Evidence | * Scenarios for each of the prioritized cyber crises that include:<br>*
    The broad context in which the cyberattack and resulting crisis could occur<br>*
    An overview of the cyberattack, the requirements for success, and the steps involved
    in execution<br>* The consequences for both your company and its stakeholders
    |

    | Oversight | * Confirm that the cyber crisis scenarios include the required information.<br>*
    Use this inquiry, as well as the remaining crisis inquiries, as an opportunity
    to learn more about the cyber crises your company may face. |


    ### TABLE 13-6: Executive awareness


    | Crisis Inquiry 6 | “Describe the preparations, including sources of information
    and assigned responsibilities, for keeping executives informed throughout a cyber
    crisis.” |

    | --- | --- |

    | Rationale | Executives need timely and accurate information to both lead the
    company and engage with the public during a cyber crisis. Given time pressures
    during a crisis, your company should make preparations ahead of time. |

    | Evidence | * Plans for informing executives on:<br>* The cyberattack<br>* Cyber
    defenses and why they failed<br>* Cyber incident response progress |

