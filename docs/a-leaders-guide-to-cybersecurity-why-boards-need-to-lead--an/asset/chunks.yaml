    硅谷的传奇充满了许多根源极其平凡却极其成功的公司故事。例如，苹果公司（Apple）和惠普公司（Hewlett-Packard）字面上说的都是从创始人的车库开始的。也许关于最复杂的网络攻击也有类似的故事情：它们并非在政府大楼的地下室开发的，而是在时尚的城市咖啡馆里，由
    Meixell 和 Beresford 这样的人拿着笔记本电脑开发的。


    ### 不再是“唯有我们”


    即使是一个国家开发了复杂的黑客工具，也不意味着它将独占这些工具。凭借年度预算超过 100 亿美元，美国国家安全局（NSA）投入了巨资开发了一系列令人印象深刻的黑客工具，供其专属使用^((11)
    得益于一系列尴尬的泄露和黑客攻击，进取的组织现在正向全球急需消费者市场推销这些工具，而这些消费者已经对其造成了毁灭性的影响。


    `WannaCry` 勒索软件爆发——这仍然是网络安全史上最具破坏性的事件之一——提供了一个很好的例子，说明国家并不能总是将自己的黑客工具留给自己。虽然政府将继续对某些能力（垄断地位（例如维持常备军），但他们的网络攻击能力不再是
    NOBUS（唯有我们）。个人和组织（无论是犯罪还是其他）都可以触及这些能力。


    在 2017 年 5 月 12 日至 5 月 15 日的四时间内，`WannaCry` 勒索软件感染了 150 个国家的 200,000 多台计算机^((12)
    勒索软件是恶意软件的一种，会加密受感染计算机上的数据。只有在受害者支付赎金后，黑客才会提供解密密钥，从而重新获得对数据的访问。


    NSA 的黑客小组“定制化访问行动”（Tailored Access Operations）开发了实现 `WannaCry` 的工具 `EternalBlue`。它是“影子经纪人”（Shadow
    Brokers）偷取的 NSA 网络武器大库的一部分，“影子经纪人”是一个旨在为这些网络武器向政府、企业和个人建立商业市场的黑客组织。在最初将 `EternalBlue`
    投出拍卖后，“影子经纪人”于 2017 年 4 月将其免费发布了^((13)


    在公开发布后不到一个月，成千上万家公司发现自己受到了 `WannaCry` 的影响，有时导致了灾难性的结果^((14) 在好几页里，英国的国家医疗服务体系（NHS）遭到中断，其部分设施被迫转运救护车并拒绝非紧急急诊患者^((15)
    汽车制造商本田（Honda）、日产（Nissan）和雷诺（Renault）都各自关闭了生产线^((16)


    ### 黑客攻击的高效市场


    网络攻击的广义经济正在发生变化，使得复杂的黑客工具和服务落入任何能够付得起费用的人手中。在许多情况下，价格出奇地合理。市场已经演变，包含了各种工具和服务，不仅对政府可用，对任何付得起这些通常低廉费用的人可用。例如，预算相对有限的政权，如刚果民主共和国、阿拉伯酋联合国和津巴布韦，已经能够获得
    `Verint Systems` 的 `SkyLock` 工具，该工具允许他们进行监控^((17) 这种攻击能力不再是少数人的专利，个人和组织（无论是犯罪还是其他）都可以触及。


    这种市场在 2017 年之前是 200 亿美元，`Verint` 公司进入了全球范围的客户^((18) 这种攻击能力是增长的。网络武器的全球市场正以两位数的速度增长^((19)
    这种市场规模从 2001 年的接近零增长到现在的 20 亿美元^((20) 这种黑市场增加了供应商愿意或无法提供的需求^((21) 无论在互联网的阴暗角落还是光天化日运营，他们都可以向全球受众推销他们的商品和服务。这种市场是高效且具有竞争性的，并轻松将犯罪分子与他们所需的工具和人才连接起来。由于其
    24 小时技术支持承诺，它提供了基于价值的月费，从“铜级”选项的 18.99 美元到“铂金”服务的 49.99 美元^((22) 对于那些寻求全程服务的人来说，兴起的“黑客即服务”市场包含了从研究分析到设计、开发和执行的整个攻击链，可以外包给第三方。一个例子是已倒闭的
    `webstresser.org`，这是一个用户友好零售商，以低廉的价格对其客户指定的任何公司或组织执行拒绝服务攻击。


    由于这些动态变化，公司需要转而关注其信息、操作甚至是操作中断的价值，不仅是对自身，也对他人。组织或个人愿意花费多少钱？无论是构建、购买还是租赁攻击能力都不重要。它将创造市场。


    ## 攻击与防御的不对称性


    在盾牌和长矛时代之前的传统战争中，攻击的力量与必要防御的强度之间存在着比例关系。这种关系在比较例如地堡炸弹的穿透力与它旨在摧毁的地堡深度和硬度时依然存在。在数字世界中，这种比例关系并不存在。针对复杂的网络攻击的防御通常可以是简单、廉价，且有时是常规的。


    ### WannaCry


