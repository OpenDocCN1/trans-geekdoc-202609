  trans: '

    此次网络攻击利用了专门为泵站正常管理设计的系统，导致其发生故障。这次攻击涉及两个部分：建立与各个泵站控制系统的网络连接，然后操纵控制系统以导致局部损坏并接管中央运营管理系统。为了执行这次网络攻击，这名心怀不满的前员工仅需利用两个网络安全漏洞。第一个漏洞是登录泵站控制设备不需要密码。第二个漏洞是用于与控制设备通信的无线电频率可以通过公司文档轻松获取。虽然该前员工需要处于无线电覆盖范围内，但他并不需要物理闯入泵站。


    尽管攻击者的内部身份有助于其成功，但实施类似攻击的资源——曾仅仅是员工和承包商的专有领域——现在是任何连接到互联网的人都可以获取的资源。只需通过少量的网络搜索，就可以下载与泵站使用的相同设备相关的通信协议、产品文档、编程说明和软件。在在线论坛上，专家们乐意回答问题并就该类设备的使用提供建议。知名品牌的在线零售商和拍卖网站也在测试套件和硬件方面拥有活跃的售后市场，因此攻击者可以在世界任何地方的家中或办公室里计划并测试他们的攻击。


    可怕的是，这次网络攻击本可以糟糕得多。从技术上讲，攻击者可以停止所有泵站并让原污水淹没社区，这将造成更大的灾难。其影响规模比非网络原因（如炸毁泵站）可能造成的要严重得多，而且成本也低得多。


    Maroochy 水务案例提供了几条教训（请参见表 8-2）。其一是理解网络攻击如何利用系统漏洞的重要性。另一个是决定正确的控制措施以阻止攻击。在这个案例中，只需要两种控制措施：登录控制设备需要密码以及加密无线电通信。相比之下，由于者没有使用恶意软件，防病毒产品或防钓鱼培训等常用措施将无法提供保护。此外，正如你所看到的，对这次网络攻击技术机制和缓解措施的解释通俗易懂，它是贵公司应该提供的网络风险描述类型的示例。


    #### 表 8-2

    Maroochy 县网络威胁叙述的四个元素


    | 元素 | Maroochy 县示例 |

    | --- | --- |

    | 关键业务活动与风险 | 活动：废水处理 风险：泵站故障 |

    | 支持系统 | 集中化运营管理系统 泵站控制设备 |

    | 网络攻击与后果 | 利用不安全的网络通信以及泵站控制设备缺乏用户身份认证 大量排放原污水 |

    | 网络对手 | 心怀不满的前员工 |


    另一个教训是，当你处于识别网络风险的过程中时，寻找网络安全设计缺陷具有至关重要的性。控制系统缺乏身份验证和无线电通信缺乏加密是控制系统设计中的技术缺陷。我们之前提到的借记卡欺诈根原因是授权购买协议中的技术设计缺陷，以及在支付商户和处理争议费用（challenging
    charges）方面的程序性设计缺陷。只有通过在业务活动的背景下识别网络风险，公司才能发现这些漏洞。


    ### 网络威胁叙述如何侧重于公司网络安全活动


    将网络威胁叙述作为理解公司最重大网络风险的框架，通过以下方式支持数字管治和有效的企业网络风险管理：


    *   **改变对话内容。** 网络风险的识别和优先级排序将对话从技术讨论转向坚定植根于保护贵公司最重要的业务活动和运营的讨论。公司领导层和管理层可以参与这一过程，而你和其他董事会成员可以引导它。

    *   **将技术信息置于背景中。** 贵公司收集、分析和组织与网络攻击技术、计算机漏洞和计算基础设施相关的技术信息的方式，都有助于为保护关键业务活动提供必要的知识。

    *   **提供实用化方法。** 贵公司需要定义信息收集、分析和决策活动，并确定最适合执行这些任务的人员。贵公司可能已经在执行许多任务，因此可以通过协调现有活动并使用已收集的数据来开发网络威胁叙述。

    *   **促进协作与共识。** 网络威胁叙述的发展过程为广泛的人员（从执行领导层到网络安全专家，以及运营业务活动的人）的贡献提供了正式结构。这有助于围绕风险优先级以及公司需要采取的活动达成共识。

    *   **统一网络与风险相关信息。** 网络威胁叙述包含了一个统一的信息集合，建立了网络攻击与其潜在风险之间的关系。贵公司内部的团队和个人将根据其角色和职责使用这些信息的局部。贯穿所有这些信息的线索有助于整个公司识别、优先排序并管理最关键的网络风险。

    *   **为所有数字管治职责奠定基础。** 在更广泛的业务风险背景下组织和展示网络风险，为贵公司的网络安全活动奠定了基础。这包括我们在本章提到的网络风险管理活动，我们在后续章节中讨论的应对网络引发危机的企业弹性。将网络风险置于业务风险背景下进一步告知了影响公司网络风险管理能力的组织结构和文化问题。

    *   **促进董事会参与与监督。** 在叙述开发的每个阶段，你们的职责都是清晰的。你们对所监督的公司所需的保证也是同样的，即其已进行的网络风险相关活动、涉及的话题、涉及的人员以及交付的文档。


    ### 缓解攻击


    从监督的角度来看，你们网络风险缓解方面的职责是确保公司：


    *   根据相应的网络攻击对贵公司最关键业务活动可能产生的影响对网络风险进行优先级排序

    *   根据可以有效缓解的优先级网络风险选择控制措施

    *   检查控制措施的有效性

    *   开发与所保护的业务活动直接相关的网络风险修复计划。


    #### 网络攻击的优先级排序


