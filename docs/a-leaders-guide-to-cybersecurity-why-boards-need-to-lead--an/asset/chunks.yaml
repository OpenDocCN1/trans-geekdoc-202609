    此步骤的备忘录请参考第 11 章中的风险查询 4。


    # 当对冲基金成为网络攻击敌手时


    2016 年，专门从事医疗保健行业的网络安全研究公司 MedSec 发布了一份关于圣朱德医疗公司（St. Jude Medical）制造的起搏器和除颤器的漏洞报告。这家跨医疗设备制造商后来被雅培实验室（Abbott
    Laboratories）收购。此前，MedSec 花了八个月时间检查了来自各种供应商的医疗设备，正如 MedSec 执行官朱斯汀·博恩（Justine Bone）所说：“在安全保护方面，圣朱德的缺陷极其严重。”¹⁷
    MedSec 在圣朱德起搏器中发现的较值得关注的漏洞之一是更改起搏器设置的能力，例如，在五十英尺外停止起搏并耗尽电池。根据博恩的说法，其他安全研究人员曾在
    2013 年带着类似的结果接触过圣朱德，但圣朱德并未对这些信息采取行动。


    MedSec 认为圣朱德同样不会对其发现的结果采取行动，因此采取了不同的方法来引起对漏洞的关注并促使圣朱德采取行动。MedSec 联系了泥水基金（Muddy
    Waters），这是一家拥有长期做空历史的投资公司。通过做空，如果圣朱德的股价下跌，泥水基金就能获利。据报道，MedSec 协调安全报告的发布与泥水基金做空圣朱德股票同步进行，并约定两家公司将分享产生的利润。舆论迅速转向反对
    MedSec 和泥水基金，圣朱德则以强力否认和名誉侵谤诉讼做出了回应。¹⁸


    在争议中，美国国土安全部和食品药品管理局（FDA）随后进行了调查。¹⁹ FDA 发布了自身的警报，称有 46 万台起搏器存在漏洞并应该更新软件。然而，与可以远程批量更新的公司计算机不同，更新这些起搏器是一项巨大的工程。46
    万名植入起搏器的人需要就看医生，由医生来执行更新。遗憾的是，在少数情况下，某些操作可能会导致“设备功能完全丧失”。²⁰


    这个案例为网络攻击敌手和网络攻击提供了几个有趣的观察。造成损害的并非网络攻击。网络攻击可能成功的证据损害了圣朱德的声誉并引发了召回。其次，披露风险的损害方式——旨在压低股价并使空头者富有——伤害了所有股东，而不仅仅是圣朱德。该案例还将追逐利益的对冲基金和网络安全研究公司加入了潜在网络攻击敌手的名单——仿佛这个名单还不够长似的。最后，圣朱德在解决潜在网络安全缺陷方面表现出的不情愿为其网络攻击敌手提供了动力。


    ## 网络威胁的表达力


    ### 叙事：马鲁奇郡


    一次网络危机说明了其显著特征如何与网络威胁叙事的元素相对应。这一事件进一步证实了叙事如何成为解释网络攻击和防御技术细节的一种既方便且易于理解的方式。数字管理的第一条原则——如果你不理解，那就是他们没有解释清楚——是可以实现的。


    马鲁奇郡（Maroochy Shire）是一个牧业社区和旅游胜地，位于澳大利亚布斯班以北一百公里的昆士兰州阳光海岸，那里太平洋全年温暖，常年天气预报是“今天美丽，明天完美”。该地区具有卓越的自然美和生态意义，拥有长长的白沙滩、壮丽的湖泊以及带有峡谷、溪流和瀑布的热带雨林。它是考拉以及光黑黑嘴鹉和地鹦鹉等稀有物种的栖息地。


    在郡内，马鲁奇水务公司（Maroochy Water Services）通过管理水储蓄、处理和分配的所有方面为社区提供服务。这项活动至关重要，因为每天有平均
    3500 万升污水流经网络。²¹ 由于郡内的高度变化，原污水从泵站溢出并流过设施。马鲁奇水务公司有一个中央运营中心，可以执行开关泵站以及增加或减少流量等操作。


    2000 年 1 月下旬，管理泵站的中央系统开始表现异常，例如丢失通信和控制并发出虚假报警。²² 几周后，供应商认为有人正在攻击系统，但为太晚了。反复溢出的入侵了社区、潮汐运河，甚至是曾经五星级的库姆度假酒店（Hyatt
    Coolum Resort）的 PGA 锦标赛高尔夫球场。²³ 在附近的太平洋天堂镇（Pacific Paradise），多达一百万升原污水流入了雨水系统。²⁴
    在当地的公园和水道中，“海洋生物死亡了，溪水变黑，居民忍受着可怕的恶臭”。²⁵ 这一切都是网络攻击的结果。


    网络攻击在 4 月 23 日晚上结束，当时警方在名为名副其实的欺骗湾（Deception Bay）镇的一个泵站附近发现了一名嫌疑人正在开车。在嫌疑人的车里，警方发现了被盗的泵站控制设备、计算机、网络电缆和双向无线电设备——这些发动网络攻击所需的工具。在近三个月的时间里，罪犯的汽车作为他的移动控制中心，他实施了四十多次网络攻击。


    此案中的网络攻击敌手是提供泵站控制设备的供应商的前员工。在与供应商经历了一段充满争议的雇用关系后，他两次申请马鲁奇水务公司的工作但未被录用。结果，他变得不满和愤恨，想要对这两家公司进行报复。²⁶


