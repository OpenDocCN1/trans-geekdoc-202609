- fmt: '

    Once your company has identified the controls for mitigating the most significant
    types of cyberattacks, it should then examine if the controls will be effective.
    Because the company has not yet installed the controls, it can’t test their functionality.
    However, considering the human element in two aspects of control use is a good
    indicator of future effectiveness: (1) the cybersecurity staff’s management of
    controls, and (2) people’s behavior when they confront controls.


    ## Control Management


    Dynamics that extend beyond a control’s advertised features can impede its proper
    management and thus reduce its effectiveness. In [chapter 7](../Text/16_9781633698000_ch7.html),
    we described how the dynamics at a financial services company discouraged IT staff
    from testing and properly configuring the company’s firewalls because rigor in
    performing these tasks could result in criticism and increased work pressure for
    them individually.


    Another factor impacting effectiveness is the increasing sophistication of technical
    controls and the resulting complexity in configuring, managing, and using them.
    For example, protecting a company’s intranet and all the systems and information
    that support the conduct of its business uses a variety of controls. Those controls
    vary from firewalls and intrusion detection and prevention systems to the monitoring
    of network communications, both incoming and outgoing. Each of the devices involved
    in this intranet perimeter protection, as well as computers within a corporate
    intranet, capture and log events relevant to the performance of its individual
    piece of the protection pie. The individual logs record activities such as a failed
    password change or the disabling of antivirus software.


    Examined individually, the logs provide limited value in detecting an internet-based
    attack. Combined and analyzed together, however, they are a powerful tool for
    detecting and responding to an attack. The market has responded with a variety
    of log collection and analysis tools. Their capacity to collate and analyze thousands
    or millions of individual log entries also becomes a drawback because of the challenges
    of knowing which log events to focus on and under what circumstances should people
    be alerted to investigate. To address this issue, vendors provide standard templates
    to address specific cybersecurity concerns, such as compliance with payment card
    cybersecurity standards.[^(28)](../Text/26_9781633698000_notes.html#ch8_rfn94).
    The templates have the same inherent weakness of standards in general. They cannot
    know the specifics of an individual company’s operations and so cannot provide
    an intelligent means of winnowing less relevant log records. The result is that
    cybersecurity staff find it challenging to use the log analysis tools to reduce
    cyber risks.


    Cyber threat narratives address this issue by identifying the techniques associated
    with the cyberattacks that pose the greatest threat to the computer systems supporting
    a company’s most critical business activities. Without this focus and direction,
    cybersecurity staff often find themselves in a similar position as the radio astronomers
    in the SETI program, futilely straining to hear alien signals in a universe of
    static.


    Before its breach in 2013, Target, a large US-based retailer, had made significant
    investments in prominent vendors’ sophisticated detection and logging capabilities.
    Thanks to this investment, the company received multiple warnings that its systems
    had been compromised before the breach, but didn’t act on the warnings.[^(29)](../Text/26_9781633698000_notes.html#ch8_rfn95).
    By its own admission, Target was constantly inundated with a “vast number of technical
    events that take place and are logged.”[[^(30)](../Text/26_9781633698000_notes.html#ch8_rfn96)].
    If Target had instead focused its substantial investments in log analysis and
    efforts on listening for signs of the most relevant cyberattack techniques, it
    might not have lost the subsequent alerts in the shuffle. It might have avoided
    the breach, which ultimately exposed the personal information of some 70 million
    customers.


    ## Human Behavior


    The log analysis tools we just discussed are an example of a cyber risk control
    that is transparent to all employees, except for the cybersecurity staff. Many
    other controls are not only broadly visible to employees, but directly affect
    them. The ways in which employees behave when presented with the controls can
    either negate the controls’ protection value or introduce new cyber risks. In
    [chapter 2](../Text/10_9781633698000_ch2.html), we discussed how the well-intentioned
    control of embedding the automobile design network within the company’s intranet
    prompted the designers to create employee computer accounts for external partners,
    thus weakening the cybersecurity protection of the whole company. The automobile
    designers took action to deliberately undermine a control because it interfered
    with their ability to get their job done.


    Failing to consider fully predictable human behavior can render a control ineffective
    and increase the risk or damage the control was intended to mitigate. The quotidian
    task of hand washing aptly illustrates this point. Thanks to opposable thumbs,
    our hands are quite handy at manipulating all sorts of things covered with bacteria
    and viruses. The naturally produced oils on the surface of our hands capture the
    germs and serve as the primary pathway for the pathogens to get inside us. In
    some cases, they can make us sick.


    Handwashing with soap has long proved to be an effective control for this attack
    of germs and our body’s vulnerability to getting sick. Soap chemically breaks
    down pathogen-containing oil on the hands and allows water to rinse the pathogens
    down the drain. Soap’s five-thousand-year history as the preeminent hand-cleaning
    control was called into question in 1972, when antibiotics were added to soap.[[^(31)](../Text/26_9781633698000_notes.html#ch8_rfn97)].
    Ostensibly, washing hands with antibacterial soap seems like a good thing, but
    since people tend to quickly wash their hands, antibiotics prove useless because
    they need to remain on the skin for two full minutes. Most of us are not this
    patient when washing our hands, and numerous scientific studies have confirmed
    the obvious, with one study pegging average hand-washing time at six seconds.[[^(32)](../Text/26_9781633698000_notes.html#ch8_rfn98)].
    Not only are antibacterial soaps ineffective in practice, they have a negative
    impact on the environment by interfering with photosynthesis and have the potential
    to create antibiotic-resistant bacteria.


    We can find a similar situation with cybersecurity policies surrounding passwords,
    perhaps the most visible and intrusive of all cybersecurity controls. Many companies
    require employees to change their passwords on a regular, sometimes monthly or
    quarterly, basis. Forcing this change is a control that addresses the risk that
    a hacker may have already uncovered current passwords by using personal information,
    lists of common passwords, and even complete dictionaries in automated searches.
    The rationale is that by regularly changing passwords, a hacker would have to
    start all over again each time an employee changes a password. All of this makes
    sense until one considers the limited ability people have to remember passwords.


    We examined this situation at an Asia-headquartered financial services conglomerate.
    The password policy required users to change their password each month. They could
    not reuse previous passwords. Unsurprisingly, when we analyzed a sample of passwords,
    we discovered that the staff came up with creative ways to cope with the burden
    this policy imposed. One employee, for example, used this series:


    - `Password201801` (for January)

    - `Password201802` (for February)

    - `Password201803` (for March)

    - And so on

