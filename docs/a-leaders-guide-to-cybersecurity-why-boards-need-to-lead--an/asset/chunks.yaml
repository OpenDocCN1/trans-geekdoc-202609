    Testing control effectiveness contributes to an understanding of current residual
    risk. This type of testing is essential because, as we’ve shown many times, the
    presence of a control does not indicate the protection benefit it provides. Testing
    control performance validates how well a control accomplishes its role in mitigating
    a cyberattack. In [chapter 2](../Text/10_9781633698000_ch2.html), we mentioned
    that backing up computers is one of the controls that would have helped protect
    organizations from the `WannaCry` attack. Even as `WannaCry` essentially destroyed
    important information by encrypting it, a company could regain access to that
    information by restoring the relevant files from a computer backup. Computer backup
    is a long established and widely used control for mitigating not just cyber risks,
    but also a wide range of computer malfunctions and human mistakes. In order to
    test the effectiveness of a company’s computer backup controls, it is not sufficient
    to verify that someone is making the backups. One needs to go one step further
    and verify that the backups can be successfully restored.


    While third-party testing and reviews can help select specific products, your
    company should test cyber risk controls in-house. There are too many differences
    between third-party testing platforms and a company’s own computing environment
    that can distort results. You should also not expect a control to reliably test
    its own effectiveness. For example, an anti-malware product can’t identify the
    types of malware it can’t detect. The first-century Roman poet Juvenal anticipated
    this situation when he posed the question “Who will guard the guards themselves?”[⁵](../Text/26_9781633698000_notes.html#ch9_rfn104)
    This principle extends beyond technology to cybersecurity staff. Someone who was
    not involved in making the decisions should review cybersecurity architecture
    and design decisions, such as embedding a car R&D network within a corporate intranet.


    From an oversight perspective, your job is to ensure your company:


    ![images](Images/box.jpg) Routinely tests the performance of controls in mitigating
    the cyber risks for which the controls were selected


    The aide-mémoire for this step is [Fortify Inquiry 2](../Text/23_9781633698000_ch12.html#inq2)
    in [chapter 12](../Text/23_9781633698000_ch12.html).


    ### Tracking Cyber Risk Mitigation Plan Progress


    As we discussed in the previous chapter, a cyber risk remediation plan is your
    company’s statement of the reasonable and sufficient actions it is taking to protect
    critical business activities. Once a company completes a remediation plan and
    puts ongoing cyber protection activities in place, the residual risk for critical
    business activities arising from that cyber risk have reached an acceptable level.


    Before the company has achieved this milestone, the current state of progress
    on a plan for cyber risk remediation identifies areas of outstanding risk. For
    example, if the company has not yet deployed the controls it selected to mitigate
    a cyberattack, then the business activities vulnerable to this cyberattack are
    still exposed to an unacceptable level of risk. By combining this status information
    with control performance test results, your company can give you a clear picture
    of its cyber risk posture (residual cyber risk) on individual business activities.


    From an oversight perspective, your job is to ensure that your company:


    ![images](Images/box.jpg) Provides status updates on the cyber risk mitigation
    plans


    ![images](Images/box.jpg) Reports on the current cyber risk postures of its critical
    business activities


    The aide-mémoire for this step is [Fortify Inquiry 3](../Text/23_9781633698000_ch12.html#inq3)
    in [chapter 12](../Text/23_9781633698000_ch12.html).


    ## Optimize Effectiveness


    To meet your oversight responsibilities for optimizing organizational effectiveness,
    you must ensure that your company:


    - Takes into account organizational dynamics, interests, and incentives in determining
    the location of the cybersecurity group

    - Promotes a culture of openness that encourages sharing of cybersecurity information
    and raising of cyber-risk-related concerns


    ### Location of Cybersecurity Group


    Creating a dedicated cybersecurity group under the leadership of a chief information
    security officer (`CISO`) is a significant step in advancing a company’s cybersecurity
    strategy and defenses. The placement of this group within a company’s organizational
    structure is an important element that helps determine the effectiveness of the
    group. One factor to consider is the alignment of interests and objectives between
    `CISOs` and their superior. `CISOs` and their group’s activities should not conflict
    with their superiors’ own objectives and incentives. Historically, IT departments
    have held primary responsibility for cybersecurity, so newly formed cybersecurity
    groups are commonly located there. This decision seldom accounts for the differences
    in mission and motivation between a chief information officer (`CIO`) and a `CISO`.


    Broadly speaking, companies reward `CIOs` for deploying new systems and applications
    and upgrading computer and network infrastructure, all while accomplishing these
    tasks more quickly and at a lower cost than in the previous year. At a high level,
    `CISOs` are responsible for setting cybersecurity strategy and undertaking many
    of the cyber-risk-related activities we described earlier in this chapter. Fulfilling
    these responsibilities may affect some of the activities for which a `CIO` is
    rewarded and negatively affect a `CIO`’s compensation if, for example, a milestone
    is missed. Beyond personal financial considerations is the issue of the `CISO`’s
    budget and the cybersecurity activities, including the purchase of cybersecurity
    technology controls, that the budget can support. Since the `CISO`’s budget is
    part of the `CIO`’s budget, the `CIO` essentially makes the final decision between
    spending money, for example, to improve employee experience and spending money
    to mitigate the risk of some type of cyberattack.


    We do not mean to indict `CIOs`; we have worked with many who have put their company’s
    cybersecurity needs above their own financial benefit. However, sound corporate
    governance can neither rely on employees acting against their own interests nor
    rely on the character and judgment of an individual who happens to hold the `CIO`
    position at a particular time. If a `CISO` currently reports to the `CIO`, the
    company should identify the controls that compensate for this inherent conflict
    of interest.


    The decision on placement of the cybersecurity group should consider additional
    factors, such as the level of the executive to whom the `CISO` reports. While
    each company has its own unique characteristics that can influence the location
    decision, we recommend first looking at the `CEO`’s direct reports. Having a `CISO`
    report at this level offers several benefits. The accomplishment of a `CISO`’s
    goals and the success of a cybersecurity group’s activities require cooperation
    across a company from employees who do not report to the `CISO`. A `CISO`’s ability
    to wield the necessary influence to gain this cooperation is greatly strengthened
    by reporting to a member of the `CEO`’s executive team. Further, placing a `CISO`
    and the cybersecurity group at this level makes a stronger statement about a company’s
    commitment and prioritization of cybersecurity than any memo or statement.

