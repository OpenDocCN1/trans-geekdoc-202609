    正如阿莫索（Amoroso）所建议的，立法市场需求是增加产品需求和收入的另一种方法。2017 年，以色列手机取证厂商 `Cellebrite` 游说一项纽约州法律，该法律要求使用其
    `Textalyzer` 产品对涉及事故的所有驾驶员的手机进行取证分析，以检测事故发生前是否发生过短信行为[¹¹]。在美国，有 49 个州制定了“驾车短信”法律，每年有近
    18,000 个州和地方执法机构报告了 630 万起机动交通事故[¹²]。鉴于该市场的潜在规模，`Cellebrite` 支持其他州采取类似的立法，并在国家层面进行游说[¹³]。


    厂商利用这些巨大的数字吸引注意力，并关注特定的网络安全风险和解决方案[¹⁴]。虽然许多网络安全厂商发布的报告包含真正有用的信息，但你需要根据自己公司的背景来考虑这些突出的网络风险，并对所有财务损失的估算保持怀疑。


    ## 媒体


    新闻媒体是政府和网络安全厂商发布其信息的主要手段，因此也是我们理解和优先处理网络安全问题信息的主要来源。几个因素影响了可用的网络安全新闻。


    ### 报道已知情况


    显然，媒体只能报道他们获知且在某种程度上已公开的网络攻击或数据泄露事件。这些泄露通过以下几种常见方式公开：


    • 泄露的影响是可见的，例如 2015 年乌克兰电网遭到黑客攻击事件[¹⁵]。


    • 黑客自己公开泄露事件，通常是为了突出其目标糟糕的网络安全卫生状况。一个例子是阿什莉麦当（Ashley Madison）的泄露，随后公布了 3200 万使用该公司网站进行婚外情情的客户的姓名和个人细节[¹⁶]。


    • 发现或分析了泄露事件的安全研究人员将其公开。例如，在 2018 年 5 月，一名安全研究人员发布了关于影响 300 多个网站的黑客攻击活动的报告，其中包括圣地亚动物园和墨西哥奇瓦瓦州政府的网站[¹⁷]。


    • 报告条例迫使组织披露有关泄露的信息。富安信（Equifax）——一家大型消费者信誉评估公司——导致美国近一半人口的个人和财务信息丢失，这就是通往公共记录路径的一个例子[¹⁸]。


    媒体无法报道实际上是秘密的泄露或网络事件，许多类型的事件（包括窃机密、财务欺诈和勒索）往往保持隐藏状态。


    ### 读者需求


    虽然媒体在公民社会中发挥着重要作用，但也有一些市场因素影响其出版内容。具体来说，它出版的是读者想要的内容，“有血流就有头条（If it bleeds, it
    leads）”的格调在数字世界中翻译为报道那些国家支持的（特别是如果该国家的书文字不使用罗马字母）、极其复杂的、前所未见的、且是国家或全球范围内即将来临灾难的预兆的泄露事件。这种故事比“营销部门一个没有任何黑客技能的人因为没人想到要保护它而拿走了研发信息”的故事要吸引人得多。即使来自竞争对手、合作伙伴、客户、供应商和员工的威胁常见得多，且财务影响通常更大，但这些故事……怎么来说，很无味，不吸引观众。


    ![images](img/line.jpg)


    他们的角色、目标和激励影响了政府、网络安全厂商和媒体的声音。通过理解这些影响，你将能够超越头条新闻，理解对你和你的公司真正重要的事情。现在我们已经概述了现有的网络安全格局，在书的其余部分，我们将展示如何引导你的公司采用新的网络安全方法，这种方法将有效保护公司、其股东以及更广泛的利益相关者。


    # 第二部分


    # 原则


    作为董事会成员，你需要利用现有的业务动态和运营的知识来帮助公司执行有效的网络安全战略，这包括理解、管理和减少对业务的风险。


    为了实现这一点，你不需要开发一套全新的策略。你不需要从根本上改变你监督的性质。相反，你将帮助公司将其网络安全重点扩大到技术之外，并将业务及其面临的风险置于决策的核心。


    为了帮助你完成这一过程，我们考虑到几项考量制定了四项数字管治（digital stewardship）原则。第一，它们不需要任何网络安全或计算技术背景。它们是立即可可的。其次，无论你收到多少网络安全建议（包括本书），你永远无法为每种情况或每个需要的决策做好准备。这些原则提供了指导，并在遇到新情况时可以作为准则使用。


    你还可以将这些原则作为测试公司如何管理网络风险活动的试金石。公司是否遵循这些原则？此外，你随后可以使用它们来指导你的组织及其自身的监督执行。这些原则还基于一种理解：你的职责与公司内部其他人的不同——特别是对于那些将网络安全视为主要职责的人。这些原则针对的是往往不在网络安全专家控制或影响范围动态和情况，但这些情况对他们的成功至关重要。


    # 4 如果你不懂，说明他们没解释


    *公司网络安全管理和人员负责向董事会提供非专业人士可以理解的材料和简报。*


    ## 现状


    网络安全简报会让会议桌两端都感到沮丧。一些董事向我们提到，他们很高兴在全体会议和委员会上投入更多时间关注网络安全，但他们经常对从公司网络安全团队收到的简报和材料缺乏相关性或用感到沮丧。演示通常是重复的，仿佛团队在努力寻找素材来填充时间。另一方面，首席信息安全官（CISO）对董事成员对于理解他们看来是基础但重要的技术概念表现出的明显缺乏兴趣感到沮丧。


    '
- fmt: '

    Without relevant and understandable information, you can’t assess your company’s
    activities, current approach, resilience, or capacity to respond to attacks. Confusing
    presentations also impair your ability to assess whether current or future investments
    are suitable and effective. Furthermore, if you’re not fully informed, you’ll
    find yourself facing a Hobson’s choice. You’ll need to either approve funding
    without a clear idea of how your investment will reduce risks and protect your
    business, or disapprove funding and risk recriminations and second-guessing should
    a cyber incident occur later.


    Because of this information asymmetry, a common practice is to delegate oversight
    to cybersecurity or IT teams. When this happens, you’re placing your complete
    faith in the capabilities and judgment of individuals without understanding their
    tasks and objectives. If you don’t understand what the cybersecurity technologists
    are doing, then you can’t question or oversee their actions and spending.


    ## Path Forward


    You need to insist that cybersecurity professionals express their findings and
    recommendations in an understandable and relatable way. They can accomplish this
    by providing information in the context of your company and its business activities.
    Knowing the maturity of a cybersecurity control isn’t meaningful unless you understand
    its relevance to the risk protection of your business. The following chapter,
    “It Is the Business at Risk,” offers an approach for accomplishing this by establishing
    the relationship among business risks, the types of cyberattacks that can cause
    these business risks, and the controls to prevent or mitigate cyberattacks.


    Without this clear linkage between business risk and the cause of cyberattacks,
    cybersecurity briefings will be confusing—like listening to news coverage of cricket
    without knowing the ins and outs of the sport. Terms like “batsman” and “bowler”
    will be unfamiliar, let alone the mechanics of how a game or, rather, “match”
    is played.


    # 5


    # It Is the Business at Risk


    *All discussions and actions relating to cybersecurity and cyber risks start and
    end with the business and the business risks to its operations and strategic direction,
    not with computers and their vulnerabilities.*


    ## Current Situation


    The standards, products, and services available to cybersecurity teams don’t make
    the job of addressing cyber risks any easier. In fact, they reinforce the message
    that cybersecurity is about protecting computers, not businesses. Globally recognized
    cybersecurity standards, such as the `NIST cybersecurity framework` and the `ISO
    27000` series, identify controls for protecting computers and the data that resides
    in them. These standards don’t address how the controls can assist in protecting
    critical business functions from a cyberattack. As we mentioned earlier, the oversight
    was not on the part of the drafters of the standards, but rather an inherent limitation
    in the standards themselves, which are designed for use by a wide variety of organizations.


    Cybersecurity products and services have similar limitations. For example, antivirus
    products protect against malicious software, firewalls protect against internet-based
    intrusions, and encryption can protect data that is lost or stolen. These solutions
    are useful for specific problems but, as such, can’t address the larger picture
    of protecting a business. Commercial considerations further encourage vendors
    to focus on protecting computers and not businesses. The addressable market for
    a generic, computer-focused cybersecurity tool is much greater, and the development
    cost much lower, than an offering that addresses specific business risks for individual
    companies.


    ## Consequences


    External factors do not encourage specialists to look beyond the technical protection
    of computer systems. In addition, focusing on protecting computers because of
    the value in many of these activities, such as installing software security updates,
    has a seductive allure. The problem is that it’s easy to spend all your time on
    computer-centric activities.


    When your cybersecurity controls are not informed by an understanding of how a
    business operates, there are two outcomes. First, the controls may interfere with
    conducting business, as was the case with autoworkers could no longer access valuable
    information because it was “safely” moved to the company’s intranet. “Security
    gets in the way of doing business” is a common phrase because of this type of
    situation. We prefer the phrasing “poorly designed cybersecurity gets in the way
    of business.” Understanding how business operates is the way to get the design
    right.


    Another outcome of a computer-based focus is incomplete protection of your business.
    If a cybersecurity team doesn’t know the details of business activity, it won’t
    be able to ensure the business is properly protected.


    ## Path Forward


    Without external incentives and market forces to promote inclusion of business
    activities and operations in developing cybersecurity protections, your company
    needs an alternative incentive. Given your governance and oversight responsibilities,
    you’re ideally situated to provide this incentive.


    The “Manage Cyber Risks” includes questions you can ask to ensure your company
    adopts this focus. It all starts by recognizing the necessity of expanding the
    focus of cyber-reduction activities beyond protecting computers.


    Execution is the second step, and this important follow-through requires cooperation
    and shared responsibilities. It is not sufficient for corporate leaders to direct
    cybersecurity (or IT) management to make the company secure. Corporate leaders
    need to hold business managers accountable for providing enough information about
    their operations to the cybersecurity group so that cyber defenses support, instead
    of interfere with, business operations.


    # 6


    # Make Cybersecurity Mainstream


    *In both corporate organization and activities, take cybersecurity from siloed
    functions and incorporate it into mainstream operations.*

