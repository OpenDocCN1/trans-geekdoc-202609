    # Acknowledgments


    We are indebted to our many clients, whose diversity in industry, geography, culture,
    and organization afforded us the opportunity to refine and test our work.


    The support Harvard Review Press provided throughout the entire book process has
    been wonderful. In particular, we want to thank Julie Devoll, who ensured continuity
    from the first book to this one; Tim Sullivan, who started the process; and Kevin
    Evers, who guided us through publication.


    Finally, we thank our families. Our wives, Yang and Beverley, recognized the importance
    of writing this book and encouraged us on our journey. Our children, Martin, Jacqueline,
    Charlotte, and Natalie—and the future they represent—inspired us throughout. In
    turn, may this book inspire them to lead and effect change in the world they inherit.


    # About the Authors


    **Thomas J. Parenty** is an international cybersecurity and privacy expert who,
    over the course of more than thirty-five years, has worked at the National Security
    Agency, testified multiple times before the US Congress, and advised government
    agencies and corporations across the globe. He is a cofounder of the cybersecurity
    firm Archefact Group and author of `Digital Defense: What You Should Know About
    Protecting Your Company’s Assets` (Harvard Business School Press, 2003).


    **Jack J. Domet** is a management expert with more than twenty-five years’ experience
    in helping multinational corporations adapt to shifts in technology, globalization,
    and consumerism through organizational change. He is a cofounder of Archefact
    Group, where he focuses on building leadership and organizational capabilities
    in digital stewardship.

