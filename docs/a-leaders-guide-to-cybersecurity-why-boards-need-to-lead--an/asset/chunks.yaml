    提供给高管的信息，以及他们在恢复和问责方面的决策，构成了与利益相关者互动的内容，贵公司的企业传传和公共事务部门可以像处理任何其他危机时一样使用这些内容。网络危机中的利益相关者参与问题与任何其他类型的危机中的问题是相同的，尽管由于网络攻击引发了危机，其答案可能会有所不同。


    在解决这些利益相关者问题之外，贵公司还应该考虑另外两个问题：


    * 公开某些信息是否会造成损害？


    例如，如果贵公司目前正遭受活跃的网络攻击，公开宣布可能会引起攻击者的注意，并促使他们采用可能被检测到的不同技术。在这种情况下，披露信息会削弱贵公司应对攻击的能力。


    * 不披露是否会造成损害？


    如果贵公司不公布其已获知的网络攻击，是否会导致客户和其他利益相关者暴露在他们无法缓解的新风险之中，因为他们对这些风险一无所知？


    从监管的角度来看，你的工作是确保贵公司高管：


    ![images](img/box.jpg) 在发生网络危机时准备好与公众互动


    这一步骤的备忘录（aide-mémoire）是第 13 章中的危机查询 1。


    # 第四部分


    # 备忘录 (The Aides)


    三个基础章节描述了贵公司及其执行领导层必须开展的活动，以便管理网络风险、提高网络安全活动的有效性，并在发生网络危机时提供领导。为了进一步协助你对这些活动进行监管，我们在这里提供的备忘录为你提供了需要询问的具体网络安全问题，以及衡量答案响应情况的方法。


    从设计上来说，备忘录并没有涵盖董事会可能感兴趣的每一个企业网络安全问题。根据我们的经验，我们知道公司开展并由你监督的每项与网络安全相关的活动都有成本，不仅是金钱，还有时间和精力。资源（包括注意力）总是有限的。我们选择包含的备忘录的流程是基于在四十多个国家网络安全领域超过三十多年的经验，在此期间，我们对几乎每项企业网络安全活动进行过执行、管理、审计或向董事会汇报。我们选择了处理企业网络安全中最重要且经常被忽视的元素。正如我们在书中早期强调的，许多对于有效网络风险管理所需的活动经常被忽视，因为没有市场、公司或个人的迫切要求去开展这些活动。


    我们起草了这些备忘录，使得它们的使用不需要任何先的网络安全或技术经验，但使用它们将自然地增加并深化你对网络安全的理解。你可以立即开始使用它们。备忘录让你处于了解贵公司应该提供的网络安全信息的地位，而不是处于更常见的情况——由公司决定给你提供什么信息。


    每份备忘录包含四个组成部分：


    * *查询 (Inquiry)*。我们将查询构定为问题，其答案应当是肯定的，或者是贵公司应该能够提供的信息请求。我们编写了这些查询，以便你可以直接使用。


    * *理由 (Rationale)*。简要说明某项查询在贵公司网络防御和网络风险管理活动中所扮演的角色。


    * *证据 (Evidence)*。用于响应查询的证据类型的示例和描述。在某些情况下，证据还可以包括关于如何开发这些证据以及谁参与开发的指导意见。


    * *监管 (Oversight)*。描述你履行与查询相关的监管职责所采取的行动。董事会有三种行动：


    1. *确认证据存在*


    某些备忘录中的证据在性质上是技术性的，例如依赖关键业务活动的计算机系统清单。虽然你需要知道这项技术活动已经开展，但你不需要对其进行审查。鉴于其作用以及与董事会的关系，内部审计部门可以为你提供这种确认，并定期验证证据以及收集这些证据的过程。如果贵公司无法提供支持查询的证据，你可能建议进一步检查公司在这一领域的能力。


    2. *对查询提供建议 (Provide advice on the inquiry)*


    一些备忘录涉及的是纯粹的业务和业务风险主题。优先考虑关键业务活动和识别未来可能发生的业务风险是两个例子。鉴于你丰富的经验，你非常适合讨论这些以及其他非技术问题。


    3. *知情权 (Be informed)*


    某些备忘录除了证明贵公司正在开展对网络网络防御至关重要的活动外，还有另一个额外目的。它们让你有机会更深入地了解贵公司面临的网络威胁。正如第 8 章中 Maroochy
    Shire 危机的示例所示，如果这些攻击成功，描述网络攻击、缓解它们的控制措施以及对业务的影响之间的关系是直接的。由于我们在你董事职责的背景下提供这些信息，从你花费的时间和获得的知识来看，你的学习将比通过参加网络安全课程所获得的效果更有效。


    # 11


    # 备忘录：管理网络风险 (Manage Cyber Risks)


    这份备忘录的目的是提供你所需的保证，确保贵公司正关注其最重的网络风险，并且网络安全投资专注于减少这些风险。这从优先考虑贵公司最关键的业务活动以及理解网络攻击如何给这些活动带来风险开始。这些信息为选择控制措施和开发部署计划提供了基础。


    ## 识别网络风险


    表格 11-1


    关键业务活动与风险


    | 风险查询 1 || “公司最关键的业务活动是什么？它们提供了什么利益？它们面临的最重大的业务风险是什么？” |

    | --- | --- |

    | 理由 || 这个问题为真正的基于风险的方法提供了基础，该方法关注公司业务的具体风险，而不是通用的计算机风险。这是确保贵公司的网络安全投资直接关联并根据创造最大价值的业务活动排序的第一步。
    |

    | 证据 || * 针对识别出的每个关键业务活动，简要描述该活动、其提供的价值及其面临的最重大业务风险。考虑与贵公司产品和服务相关的内部运营以及涉及公司战略未来的活动。<br>*
    识别识别这些业务活动和风险的人员的会议纪要或其他文件。这些应确认领导层参与了这一过程。 |

    | 监管 || * 确认业务活动和风险的描述已经汇编，特别是有了高管的意见。<br>* 就选择关键业务活动及其相关风险提供建议。 |


    表格 11-2


    支持系统


    | 风险查询 2 || “公司是否拥有关键业务活动所依赖的计算机系统的最新清单？” |

    | --- | --- |


