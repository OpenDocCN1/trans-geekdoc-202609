- fmt: '

    The lore of Silicon Valley is full of stories of vastly successful companies with
    very modest roots. Apple and Hewlett-Packard, for instance, were both literally
    started in the founders’ garages. Perhaps there will be a similar storyline about
    the most sophisticated cyberattacks, not being developed in the basements of secret
    government buildings, but rather in hip, urban cafés by people like Meixell and
    Beresford working on their laptops.


    ### “Nobody but Us” No More


    Even if a nation-state develops a sophisticated hacking tool, it doesn’t mean
    that it will retain its use exclusively. With an annual budget exceeding US$10
    billion, the US National Security Agency (NSA) has invested heavily in developing
    an impressive arsenal of hacking tools for its exclusive use.[^((11)](../Text/26_9781633698000_notes.html#ch2_rfn29)
    Thanks to a string of embarrassing leaks and hacks, enterprising organizations
    are now marketing these tools to a global market of eager consumers, who have
    used them to devastating effect.


    The `WannaCry` ransomware outbreak—still one of the most devastating in cybersecurity
    history—provides a good example of how nation-states can’t always keep their hacking
    tools to themselves. While governments will continue to hold monopolies on certain
    capabilities, such as maintaining a standing military, their cyberattack capacities
    are no longer NOBUS (nobody but us). They are within reach of individuals and
    organizations, criminal or otherwise.


    In a four-day period from May 12 to May 15, 2017, the `WannaCry` ransomware infected
    more than 200,000 computers in 150 different countries.[^((12)](../Text/26_9781633698000_notes.html#ch2_rfn30)
    Ransomware is one type of malicious software that encrypts the data on an infected
    computer. Only if the victim pays a ransom will the hacker provide the encryption
    key to decrypt and therefore regain access to the data.


    The NSA’s hacking group, Tailored Access Operations, developed the tool that enabled
    `WannaCry`, `EternalBlue`. It was part of a large trove of NSA cyber weapons stolen
    by the `Shadow Brokers`, a hacking organization intent on making a commercial
    market for these cyber weapons to governments, enterprises, and individuals alike.
    After initially putting `EternalBlue` up for auction, the `Shadow Brokers` published
    it for free in April 2017.[^((13)](../Text/26_9781633698000_notes.html#ch2_rfn31)


    Less than a month after its public release, thousands of companies found themselves
    affected by `WannaCry`, sometimes with disastrous results.[^((14)](../Text/26_9781633698000_notes.html#ch2_rfn32)
    For many days, Britain’s National Health Service was disrupted, and some of its
    facilities were forced to divert ambulances and turn away noncritical emergencies.[^((15)](../Text/26_9781633698000_notes.html#ch2_rfn33)
    Auto manufacturers Honda, Nissan, and Renault each were forced to shut down production
    lines.[^((16)](../Text/26_9781633698000_notes.html#ch2_rfn34)


    ### Efficient Markets of Hacking


    The broad economics of cyberattacks are changing in a way that puts sophisticated
    hacking tools and services in the hands of anyone who can pay. And in many cases,
    the price is surprisingly reasonable. The market has evolved to include a wide
    variety of tools and services, available not only to governments, but to anyone
    who can afford the often modest fees. For example, regimes with relatively modest
    budgets, such as the Democratic Republic of the Congo, the United Arab Emirates,
    and Zimbabwe, have been able to acquire `Verint Systems’` `SkyLock` tool, which
    allows them to “locate, track [and] manipulate” more than 70 percent of mobile
    phones anywhere in the world.[^((17)](../Text/26_9781633698000_notes.html#ch2_rfn35)
    The addressable market is as large as it is global. `Verint`, with humble roots
    as a call-recording solution for call centers, has entered the lucrative market
    of surveillance tools and cyber weapons, boasting clientele in over 180 countries.[^((18)](../Text/26_9781633698000_notes.html#ch2_rfn36)
    Selling cyber weapons is a growth industry. The global retail market for cyber
    weapons enjoys double-digit growth rates, expanding from nearly zero in 2001 to
    what is estimated to be a US$20 billion market in 2016.[^((19)](../Text/26_9781633698000_notes.html#ch2_rfn37)


    Furthermore, a sophisticated black market has stepped up to address the demand
    for what commercial vendors are unwilling or unable to sell.[^((20)](../Text/26_9781633698000_notes.html#ch2_rfn38)
    Operating both in dark corners of the internet and in plain sight, a cottage industry
    of individuals and organizations can peddle their wares and services to a global
    audience of buyers. It is a competitive and largely frictionless economy, and
    sellers are adopting customer-focused business models and sales strategies formerly
    reserved for innovative retailers and well-funded procurement departments. They
    differentiate themselves with features, such as 24-7 customer support, service
    guarantees, and warranties. They have adopted innovative pricing models including
    subscription services, volume discounts, tiered pricing. Following the successes
    of organizations like Spotify, Netflix, and Amazon Prime, some enterprising hackers
    are adopting a subscription model to market their products. The `Shadow Brokers`,
    the organization behind the NSA leaks and `WannaCry`, decided in 2017 to launch
    what it called the “Data Dump of Month Club.” For a reasonable monthly fee, members
    get access to upcoming leaks, including a typical assortment of zero-day vulnerabilities
    for operating systems, smartphones, as well as more exotic “Russian, Chinese,
    Iranian, and North Korean missile programs.”[^((21)](../Text/26_9781633698000_notes.html#ch2_rfn39)


    For those looking for a full-service experience, the rising “hacking as a service”
    market includes the entire cyberattack chain, from research and analysis to design,
    development, and execution, and can be outsourced to a third party. One example
    is the now-defunct `webstresser.org`, a consumer-friendly retailer that, for a
    nominal fee, would perform denial of service attacks against any company or organization
    its customers identified. With the promise of great service and “24-7 customer
    support,” it offered a value-based monthly subscription ranging from $18.99 for
    the “bronze” option to $49.99 for its “platinum” service.[^((22)](../Text/26_9781633698000_notes.html#ch2_rfn40)


    This market is evolving, efficient, and competitive, and readily connects criminals
    to the technical tools and talent they need. It democratizes what was formerly
    the domain of nation-states and sophisticated criminal organizations and makes
    hacking tools and services available to anyone with money and a mission. No technical
    expertise necessary. Given these changing dynamics, companies need to focus instead
    on the value of their information, operations, or even disruption of operations,
    not just to themselves but to others. How much is an organization or individual
    willing to spend? It doesn’t matter whether it builds, buys, or rents the attack
    capability. It will make a market.


    ## Asymmetry of Attack and Defense


    In traditional warfare going back to the days of shields and spears, there has
    been a proportional relationship between the power of an attack and the strength
    of the necessary defense. This relationship continues when comparing, for example,
    the piercing power of a bunker buster munition and the depth and hardening of
    the bunker it is intended to bust. In the digital world, this proportional relationship
    doesn’t exist. Defenses against sophisticated cyberattacks can, quite commonly,
    be simple, inexpensive, and at times routine.


    ### WannaCry

