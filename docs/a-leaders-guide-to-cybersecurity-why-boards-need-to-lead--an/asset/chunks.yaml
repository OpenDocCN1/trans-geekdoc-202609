    One metric commonly used to indicate the rapid growth of cyber threats is the
    volume of new malware. Numbers for 2017 range from 15,107,232 to 128,160,000,
    and that only accounts for the malicious software that anti-malware vendors were
    able to detect.[^(11)](../Text/26_9781633698000_notes.html#ch1_rfn15) While these
    numbers are large, they are also largely meaningless. There is no real difference
    between how a company protects itself from a million types of malware versus 10
    million or 100 million. The real issue is how to neutralize any malware.


    ### If You Don’t Know It, It’s New to You


    The relative recentness of broad cybersecurity awareness contributes to the perception
    that the cyber threats we are facing are new. Yet the cybersecurity field can
    trace its roots back more than five decades to the 1960s when the US Air Force
    was concerned about something that now fills headlines as a new threat: nation-state
    attacks on critical infrastructure. The nation-state in question was the Soviet
    Union, and the critical infrastructure was the US nuclear arsenal. The specific
    risk—use of malware to compromise computer systems—seems strangely contemporary
    as well. A preeminent concern at that time, according to (Ret.) Air Force Colonel
    Roger Schell, who was intimately involved in these matters, was that malware in
    the computers controlling the navigation of land-based nuclear missiles could
    redirect these missiles to attack US cities.[^(12)](../Text/26_9781633698000_notes.html#ch1_rfn16)


    Given that internet connectivity in the 1960s was nothing like what we have today,
    the primary methods for infecting computers with malware were software developers
    and the tools to turn the programs they wrote into instructions that machines
    could understand. To address these risks, developers underwent background investigations,
    and all their tools were developed in-house. While the economics of software development
    have changed over the years, a risk cybersecurity experts understood in the 1960s
    reappeared in 2015.


    Apple provides a tool named `Xcode` for programmers who are developing applications
    for `iOS` devices, such as iPhones and iPads. While Apple provides this tool for
    free, it can also be downloaded from websites catering to software developers.
    One of these sites, `Baidu Yunpan`, contained a malware version of `Xcode`, called
    `XcodeGhost`, that added extra instructions into programs without the knowledge
    of the software developer.[^(13)](../Text/26_9781633698000_notes.html#ch1_rfn17)
    These instructions, when incorporated into popular applications downloaded tens
    of millions of times, could steal personal information from the users of the applications
    and send it to an unknown server.


    Beyond the insight that the US Air Force recognized this type of cyberattack fifty
    years earlier, the broader lesson for companies is the importance of understanding
    just what and whom they are depending on for protection against cyber threats.
    Companies do not ask this question nearly enough, and you are ideally positioned
    to correct this situation.


    In the winter of 1970, the US Defense Science Board Task Force on Computer Security
    published a report entitled “Security Controls for Computer Systems.”[^(14)](../Text/26_9781633698000_notes.html#ch1_rfn18)
    Commonly referred to as the Ware Report after its primary author Willis Ware,
    it identified a majority of cyber vulnerabilities and risks that we still face
    today, a sample of which we summarize in [table 1-1](#09_9781633698000_ch1.html#tab1-1).


    ######## TABLE 1-1: Sample of ongoing cyber vulnerabilities


    | Topic area | Specific concern | Relevance today |

    | --- | --- | --- |

    | Files | Theft, copying, and unauthorized access to sensitive information | This
    is still one of the most significant cyber risks organizations face. |

    | Software | Failure of protection features, including control over what information
    people can access | In most cases of insider theft of company information, a failure
    of access controls facilitated the theft. |

    | Users | Weak authentication of computer users | Criminals impersonating users,
    often through the use of stolen passwords, continue to haunt both companies and
    individuals. |

    | Network communications | Ability to tap and intercept network traffic | The
    risk still exists, but fortunately encryption solutions are widely deployed. |

    | System administration | Administration mistakes resulting in compromise | One
    of the major risks of the internet of things and the expanding adoption of technologies
    outside IT department control is that the users of these devices do not know how
    to manage them securely. In addition, many of the breaches of corporate information
    stored in the cloud are due to configuration mistakes. |

    | Programmers | Programmers modifying their software to disable security features
    introduce back doors and otherwise subvert security | All these concerns currently
    exist. |


    The fundamental cyber vulnerabilities computers face are neither growing nor new.
    The innovative ways in which we are using and combining digital technologies introduce
    new challenges, but these are all variations on existing themes.


    Further, although computers now come in a variety of packages ranging from mainframes
    and laptops to watches and refrigerators, and require new approaches for protection,
    the cybersecurity issues are fundamentally the same. In a similar vein, so are
    the attacks. Certain particulars of an attack may be different, but the attack
    is not fundamentally different. Think, for example, of emails containing links
    that, when clicked, result in the download of malicious software onto your laptop.
    Now think of an SMS that, when clicked, results in the download of malicious software
    onto your phone. The delivery mechanisms are different, email versus SMS, and
    the malicious software will be different to accommodate running on a laptop versus
    a phone.

