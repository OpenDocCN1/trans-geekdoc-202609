- fmt: '

    Though many cyber threats emanate from the depths of the internet and the output
    of cyber threat intelligence is limited, companies still have the ability to predict
    and act. The future of cyber risk prediction is already here. It just requires
    a change in perspective to see it.


    ## Where Not to Look


    Companies open themselves up to an attack whenever they change one of the computer
    systems that supports a business activity. All it takes is an update to a configuration
    setting or an installation of new software.


    Tracking and analyzing the technical changes across a company’s computing infrastructure
    is not feasible because of sheer volume. The process isn’t useful because only
    the most basic cybersecurity analysis can be done without the business context
    that cyber threat narratives provide.


    One area frequently mined for new cyber risks is currently available cyberattack
    techniques. From a tactical perspective, the cybersecurity group should be up
    to date on tools and techniques that facilitate the exploitation of system vulnerabilities.
    However, there is little strategic value in this line of inquiry because, as we
    pointed out in [chapter 1](../Text/09_9781633698000_ch1.html), future cyberattacks
    are variations on ones that were understood and documented in the 1960s and ’70s.


    Another source of change that companies often examine for possible new cyber risks
    is large technological trends, such as the internet of things, big data, artificial
    intelligence, blockchain, and cloud computing. As is true of all computer technology
    areas, including old-fashioned ones like databases and graphics, they all have
    their own specific cybersecurity issues, and a company’s cybersecurity group should
    be familiar with them. However, only in the context of planning and deploying
    a new technology will a company have the necessary detail to identify and understand
    how a technology exposes its business activities to new cyber risks. If anything,
    these trends remind us of the need to address cyber risks because of business’s
    increasing use of technology to foster innovation.


    ## Business Change Matters


    Whenever business operations change, along with the technologies that support
    them, a new potential cyber risk is born. This realization provides a framework
    for meaningful analysis and prioritization. It also provides direction for capturing
    new cyber risks to incorporate into the day-to-day operations of the business.
    You can view a single business change from more than one perspective. Next, we’ll
    explain how to appreciate these different viewpoints in the process of identifying
    new cyber risks.


    ## New and Updated Business Activities


    A business change that requires different support from underlying computer systems
    potentially introduces new vulnerabilities in those systems. Adding new activities,
    such as developing and offering new products or services, can spark new risk.
    New cyber risks could appear in the products and services themselves or open new
    pathways for cyberattacks.


    Changes in the ways a company handles internal functions can introduce new cyber
    risks, too. These changes can range from a new authorization process for procurement
    to the outsourcing of some HR or finance functions to a cloud-based provider.
    In procurement, the failure to properly design authentication and access control
    mechanisms to support and enforce the new process could introduce new cyber risks
    that expose a company to fraud.


    ## Changes to Business Structure


    Large-scale changes to the structure or organization of a business can introduce
    cyber risks. These include, for example, expansion into a new region or country.
    Most media coverage of nation-sponsored cyberattacks focuses on the sophistication
    of attacks aimed at targets in other countries. But a nation-sponsored attack
    can be even more direct if the target is within its borders. For example, in 2012,
    we brought media attention to the efforts of a few police departments in China
    in coercing foreign companies to install network devices that would allow the
    police to intercept all communications in and out of their China offices.[²](../Text/26_9781633698000_notes.html#ch9_rfn101)
    This case appears to have been a local initiative rather than a broad policy.
    But governments worldwide can gain access to the telecommunications infrastructures
    within their countries without having to resort to cyberattacks or on-premise
    installation of network equipment. They just ask for it. Or, as we described in
    the case of the Macau casino, even a competitor can have access to your information
    as it transits the telecommunications network it owns. We aren’t saying that a
    company shouldn’t expand into a country that presents new cyber risks. Rather,
    it should consider the risks a part of the decision-making process for the expansion.


    Mergers and acquisitions can also open a wide variety of new cyber risks and consequences,
    because buying a company effectively includes acquiring all its current cybersecurity
    risks. The economic value of an acquisition can shift dramatically if, after consummating
    the deal, you discover significant cyber risks or breaches. If a company does
    not account for the cost of cyber risk remediation up front, then the pricing
    and commercial terms of the deal will likely be wrong. In addition to financial
    impact, a cyber contagion in the acquired company could spread beyond its walls
    to have an impact on the whole company.


    ## Changes in External Business Ecosystem


    The enterprises with which a company has strategic business relationships, such
    as alliances and supply-chain partnerships, are another source of new cyber risks.
    Third-party cyber risks are becoming more prevalent. Increasingly, business requires
    technology integration to support cooperation. Companies, in turn, have less individual
    insight into or control over the remediation of third-party cyber risks. The cyberattack
    on Target, for example, came through the legitimate network connection a heating,
    ventilating, and air-conditioning vendor had to the core of Target’s internal
    network.


    The cyber risks a company faces from its supply chain are more insidious than
    simply providing convenient pathways for cyberattacks. Vulnerabilities in the
    products and services that suppliers provide can compromise the computer systems
    with which they are integrated. The newly vulnerable systems could be those the
    company relies on to operate or power its products and services. Products as different
    as police body cameras, digital picture frames, and music CDs have all included
    malicious software out of the box.[³](../Text/26_9781633698000_notes.html#ch9_rfn102)
    Mitigating these types of cyber risks requires a combined approach that includes
    rigor in the suppliers’ development processes and in companies’ quality reviews.


    The perspectives we have discussed so far all relate to changes driven by business
    goals and objectives, such as expanding markets, streamlining operations, lowering
    costs, or selling new products. For most, there are formal plans, a review process,
    and management approval. If, after your company has written a cyber threat narrative,
    a change rises to the level of critical importance, you’ll need to be involved.


    #### Changes Resulting from Ongoing Business Activities

