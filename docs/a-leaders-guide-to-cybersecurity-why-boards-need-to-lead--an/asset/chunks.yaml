    # When Hedge Funds Become Cyber Adversaries


    In 2016, MedSec, a cybersecurity research firm specializing in the health-care
    industry, published a report on vulnerabilities in pacemakers and defibrillators
    made by St. Jude Medical, an multinational medical device manufacturer later acquired
    by Abbott Laboratories. Previously, MedSec had spent eighteen months examining
    medical devices from a wide variety of vendors, and in the words of MedSec CEO
    Justine Bone, “St. Jude stood out far and away as severely deficit when it comes
    to security protections.”[^(17)](../Text/26_9781633698000_notes.html#ch8_rfn83)
    Among the more noteworthy vulnerabilities MedSec found in St. Jude’s pacemakers
    was the ability to change pacemaker settings, for example, stop pacing and drain
    the battery from fifty feet away. According to Bone, other security researchers
    had approached St. Jude with similar results in 2013, but St. Jude didn’t act
    on the information.


    Thinking that St. Jude similarly wouldn’t act on its findings, MedSec adopted
    a different approach to draw attention to the vulnerabilities and prompt St. Jude
    to act. MedSec contacted Muddy Waters, an investment firm with a long history
    of shorting stocks. By shorting, Muddy Waters stood to profit if St. Jude’s stock
    price dropped in value. MedSec allegedly coordinated the release of the security
    report with Muddy Waters’ shorting of St. Jude stock, with the agreement that
    both companies would share the resulting profits. Public opinion quickly coalesced
    against MedSec and Muddy Waters, and St. Jude responded with vigorous denials
    and a defamation lawsuit.[^(18)](../Text/26_9781633698000_notes.html#ch8_rfn84)


    An investigation by the US Department of Homeland Security and the Food and Drug
    Administration (FDA) ensued amid the controversy.[^(19)](../Text/26_9781633698000_notes.html#ch8_rfn85)
    The FDA issued an alert of its own that 460,000 pacemakers were vulnerable and
    should have their software updated. However, unlike corporate computers that can
    be remotely updated en masse, updating these pacemakers was a major undertaking.
    The 460,000 people with implanted pacemakers needed to visit their doctors, who
    could perform the update. Unfortunately, in a small number of cases, some of the
    procedures could result in a “complete loss of device functionality.”[^(20)](../Text/26_9781633698000_notes.html#ch8_rfn86)


    This case provides several interesting observations about cyber adversaries and
    cyberattacks. It was not a cyberattack that caused the damage. Evidence that a
    cyberattack could succeed damaged St. Jude’s reputation and sparked a recall.
    Second, the damaging way the risk was disclosed, aiming to drive down the stock
    price and enrich short sellers, hurt all shareholders and not just St. Jude. The
    case also adds profit-minded hedge funds and cybersecurity research firms to the
    list of potential cyber adversaries—as if the list wasn’t long enough already.
    Finally, St. Jude’s perceived reluctance to remedy a potential cybersecurity shortcoming
    provided motivation for its cyber adversary.


    ## The Expressive Power of Cyber Threat


    ### Narratives: Maroochy Shire


    One cyber crisis illustrates how its salient features correspond to the elements
    of a cyber threat narrative. This incident further confirms how narratives are
    a convenient and easily understandable way to explain the technical details of
    cyberattack and defense. The first principle of digital stewardship—if you don’t
    understand it, they didn’t explain it—is achievable.


    Maroochy Shire is a pastoral community and tourist destination located about a
    hundred kilometers north of Brisbane, Australia, on Queensland’s Sunshine Coast,
    where the Pacific Ocean is warm all year and the perennial weather forecast is
    “beautiful today, perfect tomorrow.” The area is one of outstanding natural beauty
    and ecological significance, with long white beaches, stunning lakes, and subtropical
    rainforests with gorges, creeks, and waterfalls. It is a habitat for koalas as
    well as rare species such as the glossy black cockatoo and ground parrot.


    Within the shire, Maroochy Water Services served the community by managing all
    aspects of water storage, treatment, and distribution. This activity is critical,
    as an average of 35 million liters of wastewater flowed through the network daily.[^(21)](../Text/26_9781633698000_notes.html#ch8_rfn87)
    Because of elevation variations in the shire, raw sewage backed out of pumping
    stations and flowed through the facility. Maroochy Water Services had a central
    operations center that could, among other actions, turn pumping stations on or
    off and increase or decrease rates.


    In late January 2000, the central system that managed the pumping stations started
    to behave strangely, such as losing communications and control and issuing false
    alarms.[^(22)](../Text/26_9781633698000_notes.html#ch8_rfn88) Weeks later, a vendor
    concluded that a person was attacking the system, but it was too late. Repeated
    releases encroached on neighborhoods, tidal canals, and even the PGA championship
    golf course of the formerly five-star Hyatt Coolum Resort.[^(23)](../Text/26_9781633698000_notes.html#ch8_rfn89)
    In the nearby township of Pacific Paradise, up to a million liters of raw sewage
    ended up in a storm drain.[^(24)](../Text/26_9781633698000_notes.html#ch8_rfn90)
    In local parks and waterways, “marine life died, creek water turned black and
    residents endured a terrible stench.”[^(25)](../Text/26_9781633698000_notes.html#ch8_rfn91)
    All were the consequences of the cyberattacks.


    The cyberattacks ended on the night of April 23 after the police found a suspect
    driving near a pumping station in the aptly named town of Deception Bay. In the
    suspect’s car, the police found stolen pumping station control equipment, computers,
    network cables, and two-way radio equipment—the tools needed to mount the cyberattack.
    Over a period of nearly three months, the culprit’s car served as his mobile control
    center as he carried out more than forty cyberattacks.


    The cyber adversary in this case was a former employee of the vendor that provided
    the pumping station control equipment. After a period of contentious employment
    with the vendor, he applied twice for employment with Maroochy Water Services
    but wasn’t hired. As a result, he became disgruntled and resentful, and wanted
    to wreak revenge on both companies.[^(26)](../Text/26_9781633698000_notes.html#ch8_rfn92)

