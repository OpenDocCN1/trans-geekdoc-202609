- fmt: "\nGiven that perpetrators can execute cyberattacks intentionally, executives\
    \ should also account for the attractiveness of business targets to relevant threat\
    \ adversaries. The cyber threat narratives your company has compiled for its most\
    \ critical business activities provide the basis for this prioritization process.\
    \ In particular, the descriptions of business activities, risks and consequences,\
    \ and cyber adversaries address their significance and impact.\n\n## Cyber Defense\
    \ Posture\n\nAnother consideration is how well your company is prepared to defend\
    \ itself from different types of cyberattack. Deploying controls to detect and\
    \ prevent cyberattacks can be a lengthy process for a large company, and the systems\
    \ that do not yet have these controls in place are inherently more at risk than\
    \ those already protected. Further, once deployed, the effectiveness of the controls\
    \ can vary for a number of reasons. Staffing, investment levels, or the nature\
    \ of the cyberattacks they address can influence how well a control can work.\
    \ Executive leadership can consider reports on the current cyber risk postures\
    \ of critical business activities for prioritizing postures.\n\n## Portfolio of\
    \ Cyber Crises\n\nYour executives face different issues and challenges arising\
    \ from the unique characteristics of different types of cyber crisis. For example,\
    \ cyberattack-caused environmental damage, such as occurred at Maroochy Water\
    \ Services, and theft of proprietary software, as happened to wind turbine company\
    \ AMSC, present executives with very different challenges. Your company can draw\
    \ a representative portfolio of cyber crises from the existing collection of cyber\
    \ threat narratives so executives can adapt to cyber crises without specific preparation.\n\
    \nYour oversight responsibility is to ensure that your company has prioritized\
    \ cyber crisis preparation on the basis of:\n\n![images](Images/box.jpg)  The\
    \ significance and impact of cyberattacks\n\n![images](Images/box.jpg)  The current\
    \ cyber defensive postures of critical business activities\n\n![images](Images/box.jpg)  A\
    \ variety of different types of cyber crisis\n\nThe aide-mémoire for this step\
    \ is [Crisis Inquiry 4](../Text/24_9781633698000_ch13.html#crs4) in [chapter 13](../Text/24_9781633698000_ch13.html).\n\
    \n## Cyber Crisis Scenarios\n\nAfter prioritizing the types of cyber crises your\
    \ company may face, the next step is to develop scenarios executives can use to\
    \ prepare themselves and the company, should a crisis occur. A scenario should\
    \ start by outlining the business, political, and social dynamics that could lead\
    \ to a cyberattack. This includes identifying potential cyber adversaries, their\
    \ motivations, and why your company is a likely target.\n\nTo make the scenarios\
    \ realistic, the description of the cyberattack itself should start by briefly\
    \ explaining why an adversary would choose this particular type of cyberattack,\
    \ as opposed to a different cyberattack or a different type of attack, as well\
    \ as what an adversary needs to be successful. The prerequisites for success include\
    \ the knowledge an adversary needs, such as how a piece of equipment operates,\
    \ and the required tools, which can range from packaged penetration tool kits\
    \ to a bolt cutter. In addition, the scenario should specify the location of an\
    \ adversary, both geographically (e.g., local or remote) and organizationally\
    \ (e.g., employee or contractor versus external). It should highlight the major\
    \ steps in the cyberattack, all in keeping with the first principle of digital\
    \ stewardship—“If you don’t understand it, they didn’t explain it.” The scenario\
    \ should conclude by describing the impact on your company and its operations\
    \ and equipment, and on your company’s customers and other stakeholders. The description\
    \ should be compared to your company’s risk appetite. Much of this information\
    \ is already contained in the corresponding cyber threat narrative.\n\nYour oversight\
    \ responsibility is to ensure that your company has included the following information\
    \ in cyber crisis scenarios:\n\n![images](Images/box.jpg)  The broad context in\
    \ which the cyberattack and resulting crisis could occur\n\n![images](Images/box.jpg)  An\
    \ overview of the cyberattack\n\n![images](Images/box.jpg)  The consequences for\
    \ both your company and its stakeholders\n\nThe aide-mémoire for this step is\
    \ [Crisis Inquiry 5](../Text/24_9781633698000_ch13.html#crs5) in [chapter 13](../Text/24_9781633698000_ch13.html).\n\
    \n## Executive Awareness\n\nThe information your company’s executives need to\
    \ lead the company during a cyber crisis includes an overview of the cyberattack,\
    \ the cyber defenses your company has in place and why they failed, the consequences\
    \ for your company and its stakeholders, and current progress on the response\
    \ to the cyber incident.\n\nWhile there will always be specific details about\
    \ a cyberattack that a company can’t predict ahead of time, the corresponding\
    \ cyber threat narrative provides a starting point, with descriptions of the types\
    \ of cyberattacks that could cause the crisis and the range of resulting consequences.\n\
    \nIn order to understand the reasons why your company was unable to repel the\
    \ cyberattack, first look at the relevant plans for cyber risk remediation, which\
    \ explain the cyber risk controls your company chose to mitigate the cyberattack.\
    \ Further, status on the progress of the plans gives information on where the\
    \ company was on the path to acceptable residual cyber risk at the time of the\
    \ attack.\n\nNo one can prepare information on ongoing cyber incident response\
    \ activities ahead of time. However, your company can prepare to ensure that all\
    \ the processes and sources of information are in place so executives receive\
    \ timely and accurate updates.\n\n## The Fog of Cyber Crises\n\nWhen a cyberattack\
    \ started and what the extent of damage was are surprisingly difficult questions\
    \ to answer quickly. This lack of visibility can impede executives’ internal crisis\
    \ management decision making and complicate stakeholder engagement. When it comes\
    \ to cyber crisis communications, promptness and accuracy are diametrically opposed.\n\
    \nFor example, US retailer Target first estimated that the breach of its point-of-sale\
    \ system in 2013 affected 40 million customers, only to revise that number to\
    \ 70 million one month later in January 2014. By the time the customer lawsuit\
    \ was settled, the number was 110 million, almost three times the original estimate.[⁵](../Text/26_9781633698000_notes.html#ch10_rfn127)\
    \ In September 2016, Yahoo announced a 2014 breach of 500 million accounts (a\
    \ record at the time), only to reveal three months later that there had been another\
    \ hack in 2013 that exposed 1 billion users. By October 2017, it revised this\
    \ number again: all 3 billion Yahoo accounts had in fact been compromised.[⁶](../Text/26_9781633698000_notes.html#ch10_rfn128)\
    \ Executives face the difficult choice of making early disclosures that can undercut\
    \ their credibility because of inaccuracies, or of delaying disclosure and risking\
    \ accusations of being uncooperative or opaque.\n\nYour oversight responsibility\
    \ is to ensure that your company is prepared to provide executives with information\
    \ on:\n\n![images](Images/box.jpg)  TheThe cyberattack\n\n![images](Images/box.jpg)  The\
    \ cyber defenses and why they failed\n\n![images](Images/box.jpg)  The progress\
    \ on the cyber incident response\n\nThe aide-mémoire for this step is [Crisis\
    \ Inquiry 6](../Text/24_9781633698000_ch13.html#crs6) in [chapter 13](../Text/24_9781633698000_ch13.html).\n\
    \n### Executive Direction for Cyber  \n\nIncident Response\n"
