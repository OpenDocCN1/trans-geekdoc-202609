    # 领导者网络安全指南


    # 引言


    # 数字管理

    在过去的十年里，随着世界变得数字化，公司、政府和组织在网络安全上投入了大量资金。然而，随着投入的增加，网络攻击的后果也随之增长。打开任何地方的报纸，你可能发现一个具有毁灭性后果的网络攻击故事。近期案例包括
    2016 年孟加拉国银行（该国中央银行）的网络劫案，导致了 8100 万美元的损失——这是该国外汇储备的一部分。¹2017 年，“影子经纪人”（Shadow
    Brokers）一个名副其实的个人或组织盗取了国家安全局（NSA）开发的工具。²被盗工具中包含名为`EternalBlue`的工具，黑客随后将其用于 WannaCry
    攻击，该攻击影响了 150 个国家的 23 万多台计算机系统，估计损失达 40 亿美元。³2018 年，万豪酒店宣布其星辰酒店预订系统遭到破坏，泄露了 5
    亿名客人的个人和财务信息；印度的国家身份数据库`Aadhaar`（英文：Foundation）遭到黑客，泄露了该国几乎所有 11 亿公民的个人、财务和生物识别信息。⁴


    显然，情况需要改变。


    根据我们与全球客户咨询的经验，网络安全投入的数十亿资金至今未产生实质作用，核心原因在于，网络安全的关注焦点一直是并将继续集中在技术——主要是计算机和基础设施及其漏洞，而不是对公司运营和战略方向的业务风险。


    诚然，技术一直处于中心是有其历史和逻辑上的原因。计算机科学家最早关注网络安全。他们关注的是攻击和防御的具体细节，以及如何构建运行计算机的操作系统的内核（`kernel`）以抵御攻击。当然，没有数字技术就不会有网络风险，网络安全技术及其周围的活动也是至关重要的。


