- fmt: '

    The NSA-developed attack tool powering WannaCry was admittedly sophisticated.
    Let’s now look at what companies could have done or did do proactively so that
    WannaCry couldn’t hold them hostage:


    1. **Update Windows**. We are all accustomed to seeing notifications on our computers
    and phones that we should install software updates that often fix security vulnerabilities.
    Microsoft released a security update that neutralized WannaCry around twenty days
    before it hit the internet. Installing security patches is neither sophisticated
    nor expensive, and for desktop computers and laptops, it can be done automatically.

    2. **Back up their systems and data**. If a company makes regular and timely backups,
    then even if WannaCry had infected its computers, it could restore a previous,
    clean version of its systems and data and get back to work.


    There are a couple of interesting lessons we can learn from WannaCry, beyond how
    it came to be used or how to defend against it. First, failure to protect a company
    from WannaCry was a management issue, not a technical one. The preventative technology
    and activities are routine, but there was insufficient priority placed on them.
    Second, while WannaCry was sophisticated, the information that board members need
    to understand about this attack is not, and is completely contained within this
    chapter.


    ### Quantum Insert


    Quantum Insert is another example of a cyberattack tool that the NSA developed
    at significant expense. While it is difficult to put an exact price on Quantum
    Insert’s development cost, the NSA’s budget in 2013 included an increase of US$32
    million for “unconventional solutions.” This tool goes beyond simply eavesdropping
    on a target’s internet browsing to instead using someone’s browsing as an opportunity
    to install malicious software on their computer. Quantum Insert jumps into action
    when it sees a target request a page on a website. Before the website can respond,
    the Quantum Insert tool embeds malicious software in a web page and then sends
    it to the target. Since the target’s browser is expecting to receive a page from
    the website, it accepts the malicious page without question.


    This type of tool has been so popular that companies created commercial versions
    for countries with more modest budgets. For example, Gamma International GmbH
    sold a similar tool developed by Dreamlab Technologies AG to the government of
    Turkmenistan for 875,000 Swiss francs (approximately US$858,000). Not to be outdone,
    China created a comparable tool called the Great Cannon.


    The fundamental problem with Quantum Insert and its imitators is the ease with
    which they can be defeated. They are powerless in the presence of encrypted web
    browsing because they can’t see the details necessary to forge their web page
    replies. Increasingly, websites support encryption. And these are not just banking
    and online shopping sites. Even an emoji website—`https://emojipedia.org/`—encrypts.


    You can tell if your communications to a website are encrypted by looking at the
    first five letters of the address. If they are “https`, then the connection is
    encrypted and you are immune to the attack. This protection is free and doesn’t
    require any action on your part. If you don’t want to rely on individual websites
    for your protection, you can use a virtual private network (`VPN`) service that
    encrypts all of your internet communications. There are `VPN` services that are
    free or charge a modest fee.


    ![images](Images/line.jpg)


    Understanding the lack of proportionality between cyberattack and defense will
    assist you in two aspects of your oversight responsibilities. The first relates
    to cybersecurity investments. You recognize the need to challenge any calls for
    significant new investment based solely on claims of the sophistication of new
    cyberattacks. Additionally, you know that the sophistication of a cyberattack
    is not a valid excuse for your company’s failure to protect itself.


    # 3


    # Misguided Voices


    Media, advertising, and, to some extent, popular culture influence our awareness
    and prioritization of cyber risks and how to mitigate them. Since cybersecurity
    is a relatively new topic of interest, you may not have the context in which to
    interpret news headlines and determine their relevance for your company or what
    follow-on questions you should ask. While increased exposure to cybersecurity
    will make this process easier over time, you’ll need to consider additional factors
    when absorbing cybersecurity news. These include interpreting cybersecurity information
    and considering the interests and objectives of the source.


    Two of the most common commentators on cybersecurity are `governments` and `cybersecurity
    vendors`. Since most of their messages are conveyed through news media, we’ll
    address characteristics of `media` that influence what cybersecurity stories get
    covered and what don’t.


    ## Governments


    A fundamental government responsibility is to provide for the common good. Historically,
    this has included provision of a national defense, law enforcement, and an economic
    environment that improves living standards. While differences of opinion remain
    regarding the details of accomplishing these goals, there is broad agreement that
    these are important priorities. With increased digitization in all areas of life,
    governments are evaluating their evolving roles and how best to serve people and
    companies.


    ### Duty to Warn


    Governments often provide warnings of imminent or expected disasters: air raids
    in London during World War II, hurricanes in the southeast United States, tsunamis
    in the Indian Ocean. Each of these circumstances shares two characteristics. The
    first is that the recommended courses of action, for example, go to a bomb shelter,
    drive away, or move to higher ground, are easily understood. The second is that
    people can follow these recommendations.


    Unfortunately, warnings about cyber threats aren’t usually as understandable and
    actionable. You may remember that, in the spring of 2018, both the United States
    and the United Kingdom issued an advisory about Russian cyberattacks against governments,
    businesses, and individuals. The advisories highlighted the threat to network
    routers, the specialized computers that bring the internet into our homes, as
    well as internet-connected devices such as thermostats and cameras that fall under
    the broad category of the internet of things. The advisory stated that it wasn’t
    clear how successful the Russian hackers were or even the intent of such intrusions.
    The advisory concluded with recommendations for figuring out if your own home
    network was breached and how to strengthen its against possible future breaches.


    The problem was, the proposed recommendations were beyond the comprehension of
    the very individuals whose devices were under attack. In addition, some of the
    recommendations, such as negotiating contract provisions with internet service
    providers, were impossible to accomplish, given the power disparity between consumers
    and providers.

