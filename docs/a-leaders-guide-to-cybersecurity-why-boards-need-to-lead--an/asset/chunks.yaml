  trans: '


    第一是确认证据的存在，例如系统资产清单和网络威胁叙述。单是此点就能让你对公司网络安全表现的信心大幅提升，远超通常情况下获得的信息所能提供的程度。如果你的公司无法提供支持调查的证据，这可能表明有必要对其在该领域的能力进行进一步审查。此外，内部审计还可以根据优先顺序，评估证据的质量以及收集和开发这些证据的流程。


    内部审计的协助可以显著减少你的时间投入，并消除网络安全监督职责中的繁杂工作。通过将评估重点集中在对实质性改进公司网络安全最相关的活动上，它将为你的公司带来更多收益。


    ## 提高透明度


    在公司运营的所有各个方面，执行领导层都需要准确且及时的信息来做出决策。虽然获取这些信息是一个普遍性挑战，但在网络安全领域这更加困难。原因之一是，对于普通观察者来说，网络安全方面有极少的内容是显而易见的。如果你看万里长城，可以想象它能抵御的攻击类型。防火墙则不然，它的保护能力被隐藏在一个像音响设备的机箱里。即使你不是专业的油漆工，也能看出墙是否最近被粉刷过，并判断油漆工作的质量。但许多网络安全活动（例如网络入侵检测服务器的配置）却并非如此。


    这种透明度的缺乏意味着企业领导者实际上不得不更加信任网络安全消息的传递者。为了帮助确保这种信任是合理的，你的监督职责包括确保执行领导层营造一种开放的企业环境，让每个人都能快速地分享并报告网络安全信息，尤其是负面信息。


    为了给有助于营造开放环境的因素提供背景，我们首先回顾 2018 年新加坡网络危机发生前和期间影响通信的一些动态。


    ### 新加坡健康（SingHealth）


    消息最终通过电子邮件送达。2018 年 7 月 10 日，SingHealth 的首席执行官 Ng 博士接到通知，一周前其电子病历（`EMR`）系统已遭到破解。该
    `EMR` 系统已服务了近十年，是 SingHealth 几乎所有关键业务活动的核心——从患者护理、管理到账单结算。Ng 立即意识到这起事件“确实非常严重”，并指示
    `CIO` 通知当局。⁸


    她的直觉证明是正确的，因为她后来得知这将是新加坡历史上“最严重的个人数据泄露事件”。⁹ 作为新加坡最大的医院系统，SingHealth 此时丢失了新加坡 25%
    人口的患者记录，其中包括新加坡总理李先贤龙（Lee Hsien Loong）的处方药史。¹⁰


    Ng 在转向医疗保健管理之前是一位备受赞誉的儿科医生，现在她的办公室里仍然留着在她照顾下失去的孩子的照片，“以此提醒[她自己]，当我们照顾患者时，做得永远是不够的”。¹¹
    作为 SingHealth 的首席执行官，这种以患者为中心的敏感性转化为了她的临床和行政议程，其中包含了患者数据的安全。在 Ng 的监督下，SingHealth
    在最佳实践安全技术和流程上投入了大量资金，“并批准了所有与网络安全相关的预算请求，没有任何下减”。¹²


    多年来，一队审计师认证了她公司网络安全计划的质量，董事会的风险和审计委员会定期接收网络安全投资、活动和风险的简报。公司拥有定义良好的策略，符合最新的国际标准，专注于确保符合现行法规。公司拥有一位
    `CIO`，其 `CISO` 直接向其汇报，并开展“对所有 SingHealth 员工进行钓鱼演练，并发送群邮件以通知 IT 人员安全政策、职责和安全漏洞”。¹³


    然而，尽管有了这些投资，在泄露发生很久以前，组织内部就已经酝酿了麻烦。董事会和执行领导层对关键问题和决策的看法有限，而这些决策构成了攻击的基础以及 SingHealth
    的应对措施。由于缺乏领导见解，决策实际上被委托给了技术人员，并意料之然地反映了对关键 `EMR` 系统及其支持的业务功能的缺乏理解。


    尽管 Ng 宣称“我们的患者数据被泄露的恐怖是一个不可接受的风险”，但 SingHealth IT 部门做出的决策并没有反映这一观点。¹⁴ 在泄露发生几年前的
    2014 年，一名 IT 员工发现并报告了 `EMR` 系统中的安全漏洞。由于技术与业务功能之间缺乏联系，一名中期 IT 经理选择不跟进。IT 后确认攻击者利用了这一漏洞。


    在攻击发生之前的几年里，许多安全决策并没有反映出对关键业务功能的彻底理解。本可以阻止攻击或允许有效响应的安全控制并未得到实施，尽管这是一项关键功能。


    在攻击期间，前线的基层 IT 员工表现出了极大的主动性，尽管他们的一些行动是误导的。但 IT 管理链中从事件响应负责人到 `CISO` 再到 `CIO` 的每一层管理不作为，阻碍了员工的努力。


