    测试控制的有效性有助于理解当前的残余风险。这种测试至关重要，正如我们多次展示的那样，控制措施的存在并不意味着它能提供保护收益。测试控制性能是为了验证控制措施在缓解网络攻击方面履行其角色的优劣。在第
    2 章中，我们提到过计算机备份是帮助保护组织免受 `WannaCry` 攻击的控制措施之一。即使 `WannaCry` 本质上通过加密破坏了重要信息，公司也可以通过从计算机备份中恢复相关文件来重新获得对信息的访问。计算机备份是一项长期建立且广泛使用的控制措施，不仅可以缓解网络风险，还能缓解各种计算机故障和人为失误。为了测试公司计算机备份控制措施的有效性，仅仅核实有人在进行备份是不够的。还需要更进一步，验证备份是否可以成功恢复。


    虽然第三方测试和评审可以帮助选择特定产品，但你的公司应该在内部测试网络风险控制措施。第三方测试平台与公司自身的计算环境之间存在太多差异，可能会扭曲结果。你也不应该期望某种控制措施能可靠地测试自身的有效性。例如，反恶意软件产品无法识别它无法检测到的恶意软件类型。公元一世纪的罗马诗人尤维纳在提出“谁来守护守卫者自己？”这个问题时就预料到了这种情况[⁵]](../Text/26_9781633698000_notes.html#ch9_rfn104。这一原则超越了技术范围，延伸到了网络安全人员。不参与决策制定的人员应该审查网络安全架构和设计决策，例如将汽车研发网络嵌入到公司内网中。


    从监督的角度来看，你的工作是确保你的公司：


    ![images](img/box.jpg) 定期测试控制措施在缓解该控制措施所选定的网络风险方面的性能


    此步的备忘录是第 12 章中的 Fortify 询问 2。


    ### 跟踪网络风险缓解计划进度


    正如我们在上一章中讨论的，网络风险修复计划是你的公司关于为保护关键业务活动所采取的合理且充分行动的陈述。一旦公司完成修复计划并实施了持续的网络保护活动，由于该网络风险而产生的关键业务风险的残余风险就已达到了可接受的水平。


    在公司实现这一里程碑之前，网络风险修复计划的当前进展状态识别了存在待解决风险的领域。例如，如果公司尚未部署其选定的用于缓解网络攻击的控制措施，那么易受此类网络攻击的业务活动仍然暴露在不可接受的风险水平上。通过将此状态信息与控制性能测试结果相结合，你的公司可以为你提供其单项业务活动网络风险态势（残余网络风险）的清晰图景。


    从监督的角度来看，你的工作是确保你的公司：


    ![images](img/box.jpg) 提供网络风险缓解计划的状态更新


    ![images](img/box.jpg) 报告其关键业务活动当前的网络风险态势


    此步的备忘录是第 12 章中的 Fortify 询问 3。


    ## 优化有效性


    为了履行优化组织有效性的监督职责，你必须确保你的公司：


    - 在确定网络安全小组的位置时考虑组织动态、利益和激励措施

    - 促进一种开放文化，鼓励分享网络安全信息相关问题


    ### 网络安全小组的位置


    在首席信息安全官（CISO）的领导下创建一个专门的网络安全小组是推进公司网络安全战略和防御的重要一步。该小组在公司组织结构中的位置是决定其有效性的重要因素。要考虑的一个因素是
    CISO 与其上级之间利益和目标的统一。历史上，IT 部门承担网络安全的主要责任，因此新成立的网络安全小组通常位于那里。这种决策很少考虑到首席信息官（CIO）与
    CISO 之间的差异。


    广义上，公司奖励 CIO 部署新系统和应用程序以及升级计算机和网络基础设施，同时比去年更快更便宜地完成这些任务。在高层次，CISO 负责制定网络安全战略并承担我们在本章早期描述的许多网络风险相关活动。履行这些职责可能会影响
    CIO 获得奖励的活动，并且如果未能实现里程碑，会对 CIO 的薪酬产生负面影响。个人财务考虑之外，问题在于 CISO 的预算以及该预算可以支持的网络安全活动包括购买网络安全控制措施。由于
    CISO 的预算是 CIO 预算的一部分，CIO 本质上在投入资金改善用户体验与投入资金缓解某种网络攻击的风险之间做出最终决定。


    我们并不是要指责 CIO；我们与许多将公司的网络安全需求放在自身利益之上的人合作过。然而，良好的公司治理不能依赖于员工违背利益的行为，也不能依赖于特定时期担任
    CIO 职位的人格和判断。如果 CISO 目前向 CIO 汇报，公司应该识别出补偿这种固有利益冲突的控制措施。


    网络安全小组的安置决策还应考虑其他因素，例如 CISO 汇报的高管层级。虽然每家公司都有可能影响位置决策的独特特征，但我们建议首先查看 CEO 的直接下属。让
    CISO 在这一级别汇报有若干益处。CISO 目标的实现和网络安全小组活动的成功需要公司内部不直接向 CISO 汇报的员工配合。CISO 行使必要影响以获得这种配合的能力，通过向
    CEO 执行团队的成员汇报将得到大大加强。此外，将 CISO 和网络安全小组放在这一层，对于公司对网络安全的承诺和优先考虑，比任何备忘录或声明都显得更有力。


