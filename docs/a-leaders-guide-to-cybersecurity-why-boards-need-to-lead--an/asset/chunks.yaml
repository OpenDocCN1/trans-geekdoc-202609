- fmt: '

    The technical response to a cyberattack requires a properly trained team, response
    procedures, and practice. Given its previous identification of relevant cyberattacks,
    your company already knows where to focus this preparation.


    Your company’s executives bear primary responsibility for communication with affected
    parties, the media, and governmental bodies. Each of these constituents has different
    priorities, ranging from attributing culpability to seeking compensation or assistance.
    Because of prior development of cyber risk remediation plans and analysis of consequences,
    your company can prepare for much of what executives need to say and the actions
    your company needs to take. Should the nature of the cyber crisis require your
    direct participation, you can use executive preparation activities and materials.
    Before diving into the preparations, it’s helpful to look at some of the unique
    characteristics of cyberattacks and crises.


    ## Characteristics of Cyberattacks


    Crises, by their very nature, are characterized by uncertainty, incomplete information,
    and external forces that limit how leaders can act and communicate. Even if your
    company is adept at crisis management and accustomed to dealing with crises, leaders
    still need to address three core challenges of crisis management—extent of crisis,
    lack of visibility, and public perception—through a cyber lens.


    ### Extent of Crisis


    Determining the extent of damage, especially at the beginning, is challenging
    in any crisis. But cyber crises have one characteristic that distinguishes them.
    The geographical and organizational extent of damage from a cyberattack can far
    exceed that of other types of crisis. Social unrest and rioting may shut down
    an office or factory in one part of the world, but it won’t have an impact on
    company facilities and operations outside the area. The `TJX` credit card case
    showed how a cyberattack that started in one place can quickly extend across the
    globe. The fact a hacker can attack at such an extensive geographical scale is
    a reminder that management’s response to a cyberattack-induced crisis may need
    to address stakeholder issues across a much wider range of jurisdictions than
    a company is used to.


    Predicting how long a cyber crisis will last is also extremely difficult. Given
    the lack of typical constraints on geographic scope and scale of damage, determining
    the full extent of damage and undertaking all the necessary remediation activities
    can take a long time.


    ### Lack of Visibility


    Cyberattacks are difficult to detect for several reasons. For one, they lack the
    visibility of physical attacks. The theft of equipment from a factory floor is
    both obvious and quickly noticed. The theft of the software that controls the
    equipment is not so obvious.


    The start of a cyberattack can go undetected for a significant period. Recent
    analyses show the average time between a breach and detection, often referred
    to as “dwell time” or “time to identify,” ranges from 101 to 197 days.[¹¹](../Text/26_9781633698000_notes.html#ch10_rfn123)
    Why? Companies are not looking for the signals of a cyberattack, are looking at
    too many signals, or are looking for the wrong ones. Further, even if an alert
    is raised, it’s not always obvious if a computer malfunction is the result of
    a cyberattack or simply the result of a software error or administrator mistake.


    Also, determining who is behind a cyberattack is notoriously difficult because
    perpetrators can spoof all the telltale signs you could use to identify them.
    These include their location, the language used on the computer on which they
    authored the malware, and their time zone. For decades, hackers have usually first
    taken control of a computer in a different part of the world and then launched
    their attacks from there as a means of throwing investigators off the scent. Given
    the abundant marketplace for hacking tools and expertise described in `chapter
    2](../Text/10_9781633698000_ch2.html), finding a malware expert who can read and
    program in a different language is not difficult. The presumption that hackers
    only want to manage and update their cyberattacks during business hours fails
    to account for a cyber adversary’s dedication, or the work and sleep habits of
    computer programmers.


    ### Nation-State Attribution


    Numerous countries are developing cyberattack capabilities, either on their own,
    as is the case with the `US Cyber Command`, or by purchasing tools from companies
    such as `Hacking Team` in Milan.[²²](../Text/26_9781633698000_notes.html#ch10_rfn124)
    Some countries are motivated to use these capabilities to mount cyberattacks against
    individual companies.


    Companies that are the victim of a widely publicized cyberattack might claim that
    a country was behind the attack as a way to deflect blame. After all, how could
    any company defend itself from such a powerful adversary?


    Government agencies and cybersecurity vendors can benefit from cyberattacks attributed
    to countries by underscoring the need for their services and products.


    Concerns over direct financial loss also come into play, as evidenced by the evolving
    market for cyber insurance. In the aftermath of the `NotPetya` attack, snack food
    maker `Mondelēz International` filed a claim on its cyber insurance policy with
    `Zurich American Insurance`. `Zurich` declined the claim, citing an exclusion
    for losses resulting from any government’s hostile action.[³³](../Text/26_9781633698000_notes.html#ch10_rfn125)


    ### Public Perception


    Many people, before they even finish reading the headline of a news article about
    a cyberattack, rush to blame the company instead of the hackers. The company inherits
    all the pent-up blame directed at poorly prepared companies that were hacked in
    the past.


    Is this right? Blaming a company victimized in a cybercrime might seem akin to
    blaming a well-dressed man for being robbed, but there’s a significant distinction.
    In the case of the robbery victim, he is the only one harmed. In the case of cyberattacks,
    many others are negatively affected through no fault of their own. Further, as
    demonstrated in the `Equifax` breach, which raised the risk of identity theft
    for over 140 million people, an individual doesn’t even need to have a business
    relationship with the hacked company to be harmed.


    People also tend to think that companies are lying about the true nature and extent
    of a breach. A company’s own lack of visibility into the problem and leaders’
    confusion about what they should disclose and when fuels such distrust. That distrust
    can be further reinforced if executives act on information for their personal
    benefit before it is made public, such as executives’ sale of `Equifax` stock
    before its breach was announced.[⁴⁴](../Text/26_9781633698000_notes.html#ch10_rfn126)


    ## Cyber Incident Response


    Responding to a cyberattack, commonly referred to as cyber incident response,
    requires a combination of technical cybersecurity skills and experience in organizing
    and coordinating teams across an enterprise. The specific types of cybersecurity
    skills called for depend on the nature of the cyberattack itself.


    Don’t let the technical nature of a cyber incident stymie you. You can gain significant
    assurance of a company’s preparedness by asking selected, nontechnical questions.
    Ensuring that your company is prepared to respond to a cyberattack requires assurance
    that your company:


    - Assembled a team with the requisite skills and experience for responding to
    the most significant cyberattacks

    - Developed cyber incident response procedures, with specific details on responding
    to the most significant types of attack

    - Undertakes regular drills to exercise company response capabilities and identify
    areas for increased attention


    ### Staffed to Respond

