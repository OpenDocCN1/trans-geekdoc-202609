    因此，这一事件是人为问题的结果，而不是办事员的问题。问题出在 IT 人员身上，他们没有在她电脑上安装 Excel。当他们最终安装了 Excel 后，她通过
    USB 驱动器丢失患者信息的风险就消失了，因为她再再也没有理由使用 USB 驱动器了。这个例子表明，人们有动力完成工作，即使这可能会损害网络安全。该办事员并没有意识到自己的行为可能会损害患者信息。她只是想完成自己的工作。


    ### 钓鱼


    人们经常会打开电子邮件中的附件并点击链接，导致恶意软件被下载到他们的计算机中。攻击者在利用从社交媒体和职业社交网站获取的信息来编写这些钓鱼邮件方面变得越来越精明，因此收件者发现越来越难以区分真伪。尽管少数尼日利亚王子仍然想给你数百万美元，但他们的邮件在很大程度上被各种更具说服力的邮件所取代。加州大学伯克利分校维护着一个钓鱼攻击示例数据库，例如一个声称来自人力资源部的邮件（参见图
    1-1）。²


    图 1-1


    钓鱼攻击示例


    ![images](img/fig1-1.jpg)


    图中的邮件看起来是合法的，而且登录账户以查看文档的指令并不可疑，因为这是许多组织的标准做法，特别是当文档包含敏感信息时。伯克利信息安全办公室针对此类示例提供的安全建议是，邮件收件人在点击链接之前，应首先验证该链接是合法的。要进行验证，邮件收件人需要首先将手指或鼠标悬停在“点击此处”上，这样网站地址就会出现。然后，最关键的一点是，收件人需要判断这是否真的是资源部门网站的地址，而不是试图冒充该网站的地址。


    这种建议得到了大多数网络安全专家的认同，但没有考虑到两个因素。因素是在工作时看邮件不是一项休闲活动；人们试图尽可能快地处理。许多人会发现，将鼠标悬停在链接上、查看网站地址并判断其是否合法需要花费太长时间。另一个更重要的因素是，确定网站地址的有效性并不是大多数人可以可靠胜任的责任，因此不应该是公司应该强加给他们的任务。


    ### 安全意识培训


    防止钓鱼攻击以及更广泛地防止恶意软件引入企业环境的常用控制措施是安全意识培训。然而，即使是网络安全公司的员工在内化安全意识培训方面也存在困难。英特安全（前
    McAfee）测试了来自 140 个国家的 19,000 人，只有 3% 的人能够识别出 10 封样本中的所有钓鱼邮件，而 80% 的人没有发现任何钓鱼邮件。³
    无论进行多少安全意识培训都无法很好地缓解这种风险，因为只需要一个人点击错误的链接或打开受污染的附件，这类攻击就能成功。


    ### 识别恶意软件


    另一种破解钓鱼攻击及其相关恶意软件的工具是反恶意软件技术，它通过在恶意软件在计算机上建立立足点并开始利用过程之前对其进行检测来工作。问题就在于此——如何识别恶意软件。最初，这是通过编译已知恶意软件的特征码（或指纹）列表，并在允许软件运行之前与任何新程序进行比较来实现的。更复杂的反恶意软件产品会查看潜在恶意软件的额外特征，包括行为。然而，挑战依然存在，因为防御者不断试图跟上攻击者擅长创建的新版本恶意软件。


    2017 年底，本身作为反恶意软件解决方案提供者的 Malwarebytes 公司检查了来自近 1000 万台计算机的恶意软件检测率，发现即使是排名靠高的反恶意软件产品未能检测出其所测试的
    60% 以上的恶意软件。⁴ 回到 2013 年，《纽约时报》揭露其公司网络曾遭到入侵，目的是为了发现记记者的消息源。⁵ 这次攻击使用了 45 种不同的恶意软件，其中只有一种被其反恶意软件解决方案检测到。


    追溯到计算机病毒的早期，杀毒软件行业的创始人就意识到了杀毒解决方案的局限性。当第一个计算机病毒在 1986 年出现时，两年内，这个蓬勃的市场中多就有 40
    家杀毒软件供应商。⁶ 随着供应商的快速扩散，开发出第一个成功的商业杀毒程序的 John McAfee 估计，“目前营销的产品中，高达 75% 的产品是无效的，因为它们无法检测或防御很大比例的病毒。”⁷
    他公开表示担心，“终端用户的缺乏理解创造了一个易于虚假信息、情绪化和欺诈的环境。”⁸ 截至 2018 年，这类产品的全球年收入已超过 150 亿美元，并预计将以
    10% 的速度快速增长。⁹


    对于解决钓鱼攻击和所有其他类型的恶意软件，有一种优雅的技术解决方案，它从本质上是有效的，而且不需要你的所有员工对他们点击或打开的内容始终做出完全正确的决定。`Application
    whitelisting`（应用白名单）基于这样一个原则：如果恶意软件不能在计算机上运行，它就无法伤害计算机。它借用了通常用于限制进入俱乐部、派对和其他特殊活动的做法——访客名单。`whitelisting`
    不是尝试判断每个程序或软件是否是恶意的，而是侧重于只允许已知安全的软件在计算机上运行。人们点击了什么链接或打开了什么附件并不重要。每天创建多少种新版本的恶意软件变体也不重要。只要恶意软件不在名单上，它就无法被允许。


    ### IT 员工激励


    `application whitelisting` 背后的安全概念已存在多年。有商业化的白名单产品，甚至 `Windows` 和 `macOS` 操作系统包含白名单工具。因此，问题仍然是，为什么人们不更广泛地使用白名单？此外，为什么你可能从未听说过它，而
    `antivirus` 或 `anti-malware` 产品却非常熟悉？答案在于动机和归责。


    由于目前的恶意软件防御并不有效，感染成了常态并被认为是不可避免的。当感染发生时，公司不指责安全意识培训的提供者，也不指责反恶意软件解决方案。他们也不会指责采购这些产品和服务的员工。组织内部的网络安全职能没有动力从无效的方法变为有效的方法。

