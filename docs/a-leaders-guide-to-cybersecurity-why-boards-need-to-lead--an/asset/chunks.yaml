    这里涉及到多个问题的共同作用。首先，如家得宝（Home Depot）的案例所示，符合网络安全标准并不等同于受到保护。确定什么才构成了足够的网络保护，与满足法规要求相比是一项不同且规模更大的任务。第二个问题涉及人们处理即时痛苦与未来痛苦的方式有所不同。不符合法规规定会在罚款、处罚和其他惩罚性措施方面带来可预见的、即时的痛苦。企业合规部门之所以存在，正是为了避免这种痛苦。另一方面，潜在的网络泄露的影响及其发生时间是未知的。这是一种未来的痛苦，虽然被认为非常重要，但对许多人来说，它并不像违规合规那样具有同样的紧迫感。因此，确定真正的网络安全需求让位于合规性之后。另一个意料之外的后果是，公司越发地认为合规是安全的代名词，而不再考虑额外的风险降低活动。


    ## 员工激励


    员工有动力去完成工作并做好工作。他们对晋升、奖金或经理认可的渴望，或者作为团队中高效的一员的感觉，都是能够驱动这种动力的因素。问题在于：除非员工在公司的网络安全部门工作，否则他们的动力和激励与网络安全毫无关系。大多数员工对网络安全是漠不关心的。他们不希望公司遭受网络泄露，也不希望为此类泄露做出贡献。但是，在适当的激励下，员工可能会采取可能损害你公司网络安全的行为。


    ### 完成工作


    这种动态关系的一个例子来自一家亚洲汽车制造商，该公司由于一起未公开的、导致先进研发信息泄露的网络泄露遭受了 10 亿美元的损失。泄露发生后，高管指示 IT
    网络安全团队加强对与新汽车开发相关信息的保护。网络安全团队采取的方法是将用于汽车设计的网络嵌入到公司内网中。其逻辑是，外部攻击者必须攻破两个网络而不是一个网络才能窃取公司的敏感信息。这借鉴了欧洲中世纪城堡的防御做法，这种做法包括了护城河和城墙。


    遗憾的是，网络安全团队并不理解汽车的设计流程；设计团队与外部合作伙伴密切合作，这些合作伙伴需要访问并共享相同的信息。通过将汽车设计网络隔离开，网络安全团队阻止了这些外部合作伙伴的访问，导致公司自己的员工无法正常工作。那么员工做了什么？他们为合作伙伴创建了虚假的员工账户，以便访问公司内网上的信息。没有员工觉得需要向任何人透露他们正在做的事情。


    后来，当我们问他们是否理解自己的行为让公司面临更大的网络风险时，他们说是肯定的。但他们并不是真的在道歉。由于他们的工作是设计汽车，他们并没有考虑就移除了一个阻碍他们前进的障碍。他们只关心情况的即时性——即他们需要完成工作，以及后果的确定性——他们会错过截止日期。


    由于他们的行为导致的网络风险增加是不确定的。他们的外部合作伙伴可能滥用也可能不滥用内部访问权限。如果他们滥用了，可能是明天、下个月、明年或更久以后。此外，即使发生了滥用，这些员工也不可能听听到任何滥用的消息。


    ### 网络安全反向激励


    财务激励可能会加剧员工工作与公司自我保护之间的潜在冲突。这些激励要么与个人成就（如达成挑战目标）相关，要么与部门成就（如达成里程碑）相关。例如新产品发布或公司收购。这两项活动都应该包含多项不同的网络安全任务。对于新产品，公司应该选择、实施并测试正确的安全功能
    set。对于公司收购，公司应该分析目标公司的网络安全状况，以支持交易的准确定价。但如果执行这些安全任务（或执行得不够好）延迟了发布或交易完成，网络风险的降低将退居其次。员工和高管因按时完成而获得奖金；他们错过截止日期则没有奖金，即使原因是为了防止一起下游网络事件，而该事件的影响将远超推迟几周或几个月发布产品的影响。


    三星 Galaxy Note 7 就是一个典型的例子。手机在媒体中被广泛报道的自燃倾向并非网络漏洞的结果；相反，它是文化与激励的共同作用导致了进度排在安全之上。为了利用
    Apple iPhone 乏味的的发布周期，三星加速了生产计划，匆忙将一个功能丰富但带有隐性设计和制造缺陷的产品推向市场。[../Text/26_9781633698000_notes.html#ch2_rfn26]
    在此后，三星损失了约 95 亿美元的销售额和 50 亿美元的利润，而不是获得它所希望的竞争优势。[../Text/26_9781633698000_notes.html#ch2_rfn27]


    ## 网络攻击的经济学


    了解潜在对手的能力长期一直是国术的常态；这适用于数字世界。网络攻击者（尤其是国家级）的技术复杂程度经常是选择网络防御方案的因素。市场力量与技术的结合正在挑战该领域的某些长期假设，并使得“是谁干的？”这个问题变得没那么重要了。这些变化直接影响了网络安全投资以及评估网络风险的整体方法。


    ### 国家能力


    许多人认为，某些网络超级大国，如朝鲜、俄罗斯、中国和美国拥有必要的技术能力和资源来构建其他人无法企及的复杂黑客工具。这一假设既被用增加网络安全资金的理由，也被当作网络安全防御失败时的借口。虽然一个资金充足且技术先进的国家仍然需要部署航空母舰，但开发网络攻击工具并非如此。


    例如，两个安全研究人员 Brian Meixell 和 Dillon Beresford 仅凭 MacBook Pro 笔记本电脑，除了投入时间外没有任何投资，就证明了他们如何“在没有国家支持的情况下，渗透世界上最坚固的设施”。[../Text/26_9781633698000_notes.html#ch2_rfn28]
    他们通过利用一家知名制造商的可编程逻辑控制器（PLC）中的缺陷做到了。


    PLC 是工业自动化的核心骨干。它们控制着从工厂车间的机器人到炼油厂机械设备，再到核电厂离心机的一切。正如许多技术和产品一样，它们在开发时没有考虑网络安全，结果
    PLC 之间的通信并不总是加密的。这一漏洞使得 Meixell 和 Beresford 能够向一个 `PLC` 发送特意构造的消息，结果是他们对其夺了完全控制。他们可以使其
    `PLC` 运行错误或完全不运行。此外，他们可以使用一个被攻破的 `PLC` 作为跳板，从而接管整个工业控制系统环境中的所有 `PLC`。

