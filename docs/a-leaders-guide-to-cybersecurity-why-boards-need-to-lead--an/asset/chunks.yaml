    \ listening to news coverage of cricket without knowing the ins and outs of the\
    \ sport. Terms like “batsman” and “bowler” will be unfamiliar, let alone the mechanics\
    \ of how a game or, rather, “match” is played.\n\n# 5\n\n# It Is the Business\
    \  \n\nat Risk\n\n*All discussions and actions relating to cybersecurity and cyber\
    \ risks start and end with the business and the business risks to its operations\
    \ and strategic direction, not with computers and their vulnerabilities.*\n\n\
    ## Current Situation\n\nThe standards, products, and services available to cybersecurity\
    \ teams don’t make the job of addressing cyber risks any easier. In fact, they\
    \ reinforce the message that cybersecurity is about protecting computers, not\
    \ businesses. Globally recognized cybersecurity standards, such as the NIST cybersecurity\
    \ framework and the ISO 27000 series, identify controls for protecting computers\
    \ and the data that resides in them. These standards don’t address how the controls\
    \ can assist in protecting critical business functions from a cyberattack. As\
    \ we mentioned earlier, the oversight was not on the part of the drafters of the\
    \ standards, but rather an inherent limitation in the standards themselves, which\
    \ are designed for use by a wide variety of organizations.\n\nCybersecurity products\
    \ and services have similar limitations. For example, antivirus products protect\
    \ against malicious software, firewalls protect against internet-based intrusions,\
    \ and encryption can protect data that is lost or stolen. These solutions are\
    \ useful for specific problems but, as such, can’t address the larger picture\
    \ of protecting a business. Commercial considerations further encourage vendors\
    \ to focus on protecting computers and not businesses. The addressable market\
    \ for a generic, computer-focused cybersecurity tool is much greater, and the\
    \ development cost much lower, than an offering that addresses specific business\
    \ risks for individual companies.\n\n## Consequences\n\nExternal factors do not\
    \ encourage specialists to look beyond the technical protection of computer systems.\
    \ In addition, focusing on protecting computers because of the value in many of\
    \ these activities, such as installing software security updates, has a seductive\
    \ allure. The problem is that it’s easy to spend all your time and money on computer-centric\
    \ activities and never get around to addressing the fundamental issue, which is\
    \ protecting your company.\n\nWhen your cybersecurity controls are not informed\
    \ by an understanding of how your business operates, there are two outcomes. First,\
    \ the controls may interfere with conducting business, as was the case with the\
    \ autoworkers whose external partners could no longer access valuable information\
    \ because it was “safely” moved to the company’s intranet. “Security gets in the\
    \ way of doing business” is a common bromide because of just this type of situation.\
    \ We prefer the phrasing “poorly designed cybersecurity gets in the way of doing\
    \ business.” Understanding how a business operates is the way to get the design\
    \ right.\n\nAnother outcome of a computer-based focus is incomplete protection\
    \ of your business. If a cybersecurity team doesn’t know the details of how a\
    \ business activity is conducted, it won’t be able to ensure the business is properly\
    \ protected.\n\n## Path Forward\n\nWithout external incentives and market forces\
    \ to promote inclusion of business activities and operations in developing cybersecurity\
    \ protections, your company needs an alternative incentive. Given your governance\
    \ and oversight responsibilities, you’re ideally situated to provide this incentive.\n\
    \nThe aide-mémoire “Manage Cyber Risks” includes questions you can ask to ensure\
    \ your company adopts this business focus. It all starts by recognizing the necessity\
    \ of expanding the focus of cyber-risk-reduction activities beyond protecting\
    \ computers.\n\nExecution is the second step, and this important follow-through\
    \ requires cooperation and shared responsibilities. It is not sufficient for corporate\
    \ leaders to direct cybersecurity (or IT) management to make the company secure.\
    \ Corporate leaders need to hold business managers accountable for providing enough\
    \ information about their operations to the cybersecurity group so that cyber\
    \ defenses support, instead of interfere with, business operations.\n\nThomas’s\
    \ previous book, *Digital Defense*, introduced the concept that “all measures\
    \ to secure a company’s information and systems that are not based on an understanding\
    \ of what a company does are inherently incomplete because they can only protect\
    \ against generic attacks on a company’s computers.”[¹](../Text/26_9781633698000_notes.html#ch5_rfn64)\
    \ How do you make sure your company isn’t falling into this common trap? Ask yourself\
    \ two questions:\n\nFor each information asset and automated business process\
    \ your company has, what security technologies protect it?\n\nFor each security\
    \ technology, which information assets and automated business processes does this\
    \ protect?\n\nIf you can’t answer the first question, then you have no reason\
    \ to believe your company is protected. If you can’t answer the second question,\
    \ then you have no reason to believe that your company is spending its information\
    \ security budget wisely.”[²](../Text/26_9781633698000_notes.html#ch5_rfn65)\n\
    \n# 6\n\n# Make Cybersecurity  \n\nMainstream\n\n*In both corporate organization\
    \ and activities, take cybersecurity from siloed functions and incorporate it\
    \ into mainstream operations.*\n\n## Current Situation"
