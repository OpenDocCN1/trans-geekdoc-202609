    在大多数公司中，人们普遍认同网络安全是高优先事项。然而，他们也有一种类似的宽泛认知，即网络安全部门或 IT 部门负责保护公司免受网络攻击。衡量网络安全支出占整体
    IT 预算的百分比的常用指标为这一点提供了证据。员工们也有一种相关的认知，认为他们的网络安全责任在选择强密码且不将其记录下来就结束了。他们并不将网络安全视为其工作描述的一部分。支持这一观点的想法是：网络安全过于复杂，外行人士根本无法为公司的防御做出任何实质性的贡献。他们认为，网络安全是最好交给专家处理的事情。


    ## 后果


    在公司内部将网络安全或 IT 安全功能孤立起来，其导致与专注于保护计算机而非保护其所支持和自动化的业务活动产生相同的负面后果。我们在第 2 章中提到的那家亚洲汽车公司提供了一个案例。IT
    部门决定将研发网络置于公司内网，以及员工为承包商创建虚假员工账户以访问内网，这些决定都是在研发部门与 IT 安全部门之间没有任何沟通的情况下做出的，因为这两个小组之间没有任何组织或运营上的联系。


    导致十亿美元损失的最初泄露并非国家级力量、有组织犯罪集团甚至是某个独行侠罪犯之手。那是营销部门某人的所，她完全没有网络黑客技术。这位营销人员确实拥有对研发信息的授权访问，她利用该权限下载了文件并将其带出公司。当时，许多产品本可以防止盗窃和相应的财务损失。然而，与研发部门一样，并没有组织上的网络安全连接。此外，位于加利福尼亚的
    IT 安全小组成员与位于亚洲的营销部门，从字面上来说并不说同一种语言。


    公司内部网络安全能力的组织和运营孤立对网络防护产生了深远的负面影响。业务部门通常假定网络安全小组已经在处理由其活动引起的网络安全风险，因此这不关他们。这反过来意味着网络安全小组错失了与业务部门接触的机会。


    ## 前行之路


    一个专门的网络安全小组显然具有价值。任何拥有董事会的公司如果没有建立这样一个小组将是失职的。然而，除非这支专门的网络专家小组了解业务及其目标，并且组织在整个过程中利用这些知识，否则他们的行动就像谚语中森林里静静倒下的树，因为没有人听见它。


    有几种方法可以确保你公司的网络安全专业知识产生影响并引起关注，其中一种是组织层面的：


    *   将网络安全小组置于业务职能部门中，特别是具有重大网络风险的部门，而不是职能部门（如 IT）。

    *   将网络安全人员嵌入到业务部门中。

    *   在风险最大的业务部门内部开发内部网络安全专业知识。


    短期内将网络安全团队成员移动到某些业务部门内部可能是不可行的。无论如何，确保在业务活动的关键节点提供（并执行）网络安全审查和建议的正式流程是一个强大的工具。这些在第
    9 章这种动态贯穿于整个公司，包括负责专门网络安全责任的工作人员，以及那些网络安全任务仅是其整体工作一部分的员工。


    知道应该激励什么行为是另一个挑战。当交付物清晰具体时（例如满足销售配额），高管在激励员工表现方面经验丰富。激励网络安全结果（例如成功防御网络攻击）要复杂得多，因为很难考虑到所有可能在早得时候、在其他人的管辖下发生的活动和决策，是这些活动塑造了结果。此外，你是否应该为员工良好的网络安全实践提供奖励，还是这仅仅是他们工作的一部分？例如，医生不会因为没有害死患者而获得奖金，飞行员也不会因为安全降陆飞机而获得额外报。


    ## 后果


    一家总部位于美国的全球金融服务公司提供了一个例子，说明个人 IT 人员的个人动机和利益如何使公司的防火墙基本失效。防火墙的设计是为了阻止来自互联网的连接（黑客可能利用这些连接攻击公司网络内的计算机），同时允许到业务应用程序的合法连接（例如客户自助服务）。IT
    人员通过编写防火墙规则来实现这一点，规定哪些通信是允许或不允许的。由于业务应用程序随时间推移而变化，IT 人员需要审查并更新这些规则。当我们询问该金融服务公司的
    IT 人员多久审查和更新一次防火墙规则，他们说：“从未。”随着对话的进行，原因变得清晰了。如果公司由于网络墙规则错误而遭受网络攻击，它不会归咎于 IT 人员，特别是如果怀疑是国家级力量在幕后。然而，如果员工更新了防火墙规则并意外阻止了对业务应用程序的访问，他们将面临立即的后果，并需要尽快补救局面。


