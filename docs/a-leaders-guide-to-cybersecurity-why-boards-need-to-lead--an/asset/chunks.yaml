    # A Leader’s Guide to Cybersecurity


    # Introduction


    # Digital Stewardship

    Over the past decade, as the world has become more digital, companies, governments,
    and organizations have spent billions of dollars on cybersecurity. Yet, as their
    investments have grown, the financial consequences of cyber breaches have increased,
    seemingly in lockstep.


    Open a newspaper, anywhere in the world, and you’ll probably find a story of a
    cyberattack that had devastating consequences. Recent examples include a 2016
    cyber heist at Bangladesh Bank (the central bank of Bangladesh) that resulted
    in a US$81 million loss—a sizable portion of the country’s foreign reserves.[¹](../Text/26_9781633698000_notes.html#intro_rfn1)
    In 2017, the Shadow Brokers, an appropriately named individual or organization,
    stole hundreds of megabytes of tools developed by the National Security Agency.[²](../Text/26_9781633698000_notes.html#intro_rfn2)
    Included in the haul was one tool, `EternalBlue`, that hackers subsequently used
    in the WannaCry attack that had an impact on over 230,000 computer systems in
    150 countries, with costs estimated to be near $4 billion.[³](../Text/26_9781633698000_notes.html#intro_rfn3)
    In 2018, Marriott announced the compromise of its Starwood reservation system,
    exposing personal and financial information on to 500 million guests, and India’s
    national ID database `Aadhaar` (English: Foundation) was hacked, exposing personal,
    financial, and biometric information for virtually all 1.1 billion citizens in
    the country.[⁴](../Text/26_9781633698000_notes.html#intro_rfn4)


    Obviously, things need to change.


    In our experience in consulting with clients across the globe, the core reason
    why the billions and billions of dollars spent on cybersecurity haven’t made a
    difference to date is that the central focus of cybersecurity has been, and continues
    to be, on technology—mainly, computers and infrastructure, and their vulnerabilities—instead
    of the business risks to a company’s operations and strategic direction.


    Admittedly, there are both historical and logical reasons for why technology has
    been and continues to be at the center. Computer scientists were the first to
    look at cybersecurity. They focused on the specific details of attack and defense
    and how to build the core, or `kernel`, of the operating systems running computers
    so they could withstand attack. Of course, without digital technology, cyber risks
    wouldn’t exist, and cybersecurity technologies and the activities surrounding
    them are important. The focus on fixing computer vulnerabilities is in fact seductively
    dangerous because there is value involved.

