  raw: 'Further, the specialized nature of cybersecurity technology, and the jargon-filled
    language used in describing it, means that nontechnical stakeholders, including
    boards of directors, don’t have a meaningful voice in discussions of how to protect
    their company from cyber threats. This situation changes when discussions of cyber
    risk start with protecting both current and strategic activities that generate
    the most value for your company. This small change in approach puts you and your
    fellow board members in the right position to oversee the management of cyber
    risks.


    Only by starting with critical business activities, not cybersecurity technologies,
    will your company know which cybersecurity products to buy and which activities
    to undertake. The narrow focus on technology also deflects attention from nontechnical
    dynamics that have much more influence in the effectiveness of the technical cybersecurity
    products than the sophistication of their features. These dynamics include the
    motivations, incentives, and priorities of the individuals who maintain and use
    cybersecurity products or otherwise play a role in your company’s cyber defenses.
    We have encountered many situations, for example, in which employees have deliberately
    bypassed cybersecurity controls because they interfered with their number-one
    priority, getting their work done. In other cases, we’ve seen cybersecurity staff
    lower cybersecurity product protection levels because of the additional work and
    pressure if a higher level caused a false alarm or disrupted some aspect of business
    operations. The effectiveness of the cybersecurity group is influenced by its
    place within the company structure. If the head of the parent organization has
    different priorities, the cybersecurity group may not get the funding and visibility
    it needs.


    If your company is ever going to materially improve its cyber defenses, it needs
    the right catalyst—you and your fellow board members. We view cybersecurity as
    fundamentally a governance problem and see corporate governance as the most effective
    approach companies can adopt to address their cybersecurity requirements.


    Cybersecurity governance starts at the top, with board of directors’ oversight
    and executives setting management direction. From here, it flows through the rest
    of the organization, entailing both a shift in responsibility and a shift in focus.
    Ultimate responsibility for cybersecurity and the management of cyber risk shifts
    from technology specialists to corporate leadership. Focus shifts from cybersecurity
    technologies to the business, its operations, strategies, and big bets—and the
    business risks brought about by cyberattacks that could disrupt or destroy them.


    Since you represent the fiduciary interests of your company’s owners and are charged
    with adopting a long-term view of the company’s health, profitability, and growth,
    you have the authority to instigate improvements to overall cybersecurity strategy
    and cyber defenses. You can step in where market forces have faltered and government
    regulations won’t help.


    ## Digital Stewardship


    Many directors have told us that cybersecurity is daunting, if not overwhelming.
    They feel as if they’re making investment decisions without reliable data and
    don’t fully understand the capabilities of cybersecurity technologies. Further,
    many think that the learning curve is too steep. Others say they don’t know what
    questions to ask about cybersecurity and cyber risk—or what constitutes a good
    answer. Often, they are left to rely on broad statements from cybersecurity or
    IT management along the lines of “We’re OK over here, but need work over there.”
    Technology-knowledgeable management might have cybersecurity covered, but the
    suspicion lingers that they may not.


    It doesn’t have to be this way. You can make improvements simply by fulfilling
    your governance and oversight duties. Cybersecurity oversight is similar in concept
    to the “observer effect” in quantum physics, where the observation of an event
    changes its outcome. Your requests for information motivate your company to pay
    attention to relevant dynamics and perform necessary analyses that it would not
    have done otherwise.


    Your assumption of cybersecurity responsibility need not be an arduous burden.
    In spite of the general perception that cybersecurity is complex and impenetrable,
    our experience shows that its governance and oversight do not require an extensive
    technical background. While an increased understanding of cybersecurity issues
    is clearly important, you don’t need a deep understanding of cybersecurity to
    lead your company. Pursuing a formal cybersecurity education would provide limited
    benefits, and be time-consuming and impractical. In the natural course of your
    board activities, you will gain the needed familiarity with cybersecurity issues.


    To assist you, we have developed a framework called “digital stewardship,” which
    comprises four principles, three responsibilities, and a collection of aide-mémoires.
    The principles provide concise points of reference to guide you in your cybersecurity
    deliberation and decision making. The three responsibilities address your company’s
    most important cybersecurity undertakings and give you the foundation for oversight.
    The aide-mémoires contain a series of inquiries you can use immediately to guide
    your oversight of these responsibilities. By adopting the digital stewardship
    framework, you will know how to be a cybersecurity leader, what you should ask
    of your company, and how to understand and interpret the information it provides
    you.


    ### The Principles


    •   *If you don’t understand it, they didn’t explain it.* Cybersecurity management
    and staff within a company *are responsible for providing* their board of directors
    with materials and briefings that nonspecialists can understand.


    •   *It is the business at risk.* All discussions and actions relating to cybersecurity
    and cyber risks start and end with the business and the risks to its operations
    and strategic direction, not with computers and their vulnerabilities.


    •   *Make cybersecurity mainstream.* In both corporate organization and activities,
    take cybersecurity from siloed functions and incorporate it into mainstream operations.


    •   *Engage motivation.* Understand and align the interests and motivations of
    staff and departments to incentivize behavior that leads to accomplishing cybersecurity
    goals.


