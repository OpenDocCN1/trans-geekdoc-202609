- fmt: '

    The information provided to executives, as well as their decisions on restoration
    and accountability, provide the content for engaging stakeholders, which your
    company’s corporate communications and public affairs departments can use as they
    would in any other crisis. The stakeholder engagement questions in a cyber crisis
    are the same as in any other type of crisis, even though the answers may be different
    because a cyberattack caused the crisis.


    Beyond addressing these stakeholder issues, your company should consider two additional
    questions.


    * Will public disclosure of certain information cause harm?


    For example, if your company is currently under an active cyberattack, announcing
    it publicly could tip off the attackers and prompt them to adopt different techniques
    that could go undetected. In this case, disclosure undermines your company’s ability
    to respond to an attack.


    * Will lack of disclosure cause harm?


    If your company doesn’t announce a cyberattack it knows about, will it expose
    customers and other stakeholders to new risks they can’t mitigate because they
    are unaware of them?


    From an oversight perspective, your job is to ensure your company executives:


    ![images](Images/box.jpg) Are prepared to engage the public in the event of a
    cyber crisis


    The aide-mémoire for this step is [Crisis Inquiry 10](../Text/24_9781633698000_ch13.html#crs10)
    in [chapter 13](../Text/24_9781633698000_ch13.html).


    # PART FOUR


    # The Aides


    The three foundation chapters describe the activities your company and its executive
    leadership must undertake in order to manage their cyber risks, promote the effectiveness
    of cybersecurity activities, and provide leadership in the event of a cyber crisis.
    To further assist you in your oversight of these activities, the aide-mémoires
    we present here give you specific cybersecurity questions to ask and the means
    to gauge the responsiveness of the answers.


    By design, the aides do not address every possible corporate cybersecurity issue
    of potential board interest. From our experience, we know that there is a cost,
    not just in money, but also in time and focus, for every cybersecurity-related
    activity a company undertakes and you oversee. Resources, including attention,
    are always limited. Our process for selecting the aide-mémoires we include is
    based on over thirty-five years in the cybersecurity field across over forty countries,
    during which we have performed, managed, audited, or reported to boards on virtually
    every enterprise cybersecurity activity. We have chosen to address the most important
    and often overlooked elements of corporate cybersecurity. As we highlighted earlier
    in the book, many activities necessary for effective cyber risk management are
    frequently neglected because there are no market, company, or individual imperatives
    to undertake them.


    We have drafted the aide-mémoires so that their use does not require any prior
    cybersecurity or technical experience, yet using them will naturally increase
    and deepen your cybersecurity understanding. And you can start using them immediately.
    The aides put you in the position of knowing the cybersecurity information your
    company should provide, as opposed to the more common situation in which a company
    decides what information it will give you.


    Each aide has four components:


    * *Inquiry.* We framed the inquiries as questions whose answers should be in the
    affirmative or requests for information your company should be able to provide.
    We have written the inquiries so you can use them directly.


    * *Rationale.* A brief explanation of the role an inquiry plays in your company’s
    cyber defenses and cyber risk management activities.


    * *Evidence.* Examples and descriptions of the types of evidence that respond
    to an inquiry. In some cases, evidence may also include guidance on how to develop
    it and who is involved in the development.


    * *Oversight.* Description of your actions to fulfill your oversight responsibilities
    relating to the inquiry. There are three types of board action:


    1. *Confirm the evidence exists*


    The evidence in some aides is technical in nature, such as the inventory of computer
    systems on which a critical business activity relies. While you need to know that
    this technical activity has been undertaken, you don’t need to review it. Given
    its role and its relationship to the board, the internal audit department could
    give you this confirmation and periodically validate evidence and the process
    used to collect it. If your company is unable to provide evidence to support an
    inquiry, you may recommend further examination of the company’s capabilities in
    this area.


    2. *Provide advice on the inquiry*


    Some of the aides address purely business and business-risk topics. Prioritizing
    critical business activities and identifying likely business risks in the future
    are two examples. Given the breadth of your experience, you are well suited to
    speak to these and other nontechnical issues.


    3. *Be informed*


    Some of the aides serve an additional purpose beyond demonstrating that your company
    is undertaking activities essential to its cyber defense. They give you the opportunity
    to learn more about the cyber threats to your company. As the example of the Maroochy
    Shire crisis shows in [chapter 8](../Text/18_9781633698000_ch8.html), it is straightforward
    to describe the connections between cyberattacks, the controls to mitigate them,
    and the business impacts, should these attacks succeed. Since we provide this
    information in the context of your board duties, your learning will be more effective,
    in terms of both the time you spend and the knowledge you gain, than you could
    achieve by attending a cybersecurity course.


    # 11


    # Aide-Mémoire: Manage Cyber Risks


    The purpose of this aide-mémoire is to give you the assurance you need that your
    company is concentrating on its most significant cyber risks and that cybersecurity
    investments focus on reducing these risks. This starts by prioritizing your company’s
    most critical business activities and understanding how cyberattacks could cause
    risks to these activities. This information provides the basis for selecting controls
    and developing a plan for their deployment.


    ## Identify Cyber Risks


    TABLE 11-1


    Critical business activities and risks


    | Risk Inquiry 1 || “What are the company’s most critical business activities,
    the benefits they provide, and the most significant business risks they face?”
    |

    | --- | --- |

    | Rationale || This question provides the basis for a true risk-based approach
    that focuses on specific risks to your company’s business as opposed to generic
    risks to company computers. This is the first step in ensuring that your company’s
    cybersecurity investments are directly linked to and prioritized on the basis
    of the business activities that create the greatest value. |

    | Evidence || * For each identified critical business activity, a brief description
    of the activity, the value it provides, and the most significant business risks
    it faces. Consider activities that relate to your company’s products and services
    and internal operations and concern your company’s strategic future. <br>* Meeting
    minutes or other documentation that identify the people involved in identifying
    these business activities and risks. These should confirm executive leadership
    participation in this process. |

    | Oversight || * Confirm that the descriptions of business activities and risks
    have been compiled, in particular with executive input. <br>* Offer suggestions
    on the selection of critical business activities and their associated risks. |


    TABLE 11-2


    Supporting systems


    | Risk Inquiry 2 || “Does the company have up-to-date inventories of the computer
    systems on which critical business activities rely?” |

    | --- | --- |

