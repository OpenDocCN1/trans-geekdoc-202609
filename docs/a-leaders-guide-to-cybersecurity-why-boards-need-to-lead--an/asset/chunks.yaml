    一种相关的动态被封装在管理格言中：“给我带解决方案，不要给我问题。”虽然这一指令在鼓励员工超越眼前的问题并寻找解决方案方面可能具有价值，但在网络安全领域，它往往是适得其反的。员工可能解决问题的能力，因为解决方案取决于其领域之外的非技术动态因素。正如
    `SingHealth` 泄露事件所示，由于担心在没有解决方案的情况下提出问题会带来个人后果，导致员工们继续让 `SingHealth` 的高层一于不知。


    还有其他原因导致负面网络安全消息无法传达给公司领导层，包括与报告信息后果相关的不同或冲突的利益。考虑一家最近变更了所有权的公司。这家公司最初是一家国有企业与一家来自世界其他地区的私营财团的合资企业。根据在合资企业一线监控网络入侵的网络安全人员的说法，曾有多次尝试攻破合资企业的防御墙，但没有一种攻击是高复杂的，而且都被轻易地击退了。


    当国有公司收购其伙伴并获得完全所有权后，情况发生了变化。不久后，公司的网络监控系统提醒网络安全人员，有几名 `IT` 管理员正从公司总部外部登录关键系统。网络安全团队认为这些管理员可能正在休假或出差，于是检查了门禁记录，发现他们实际上在办公室室内。这意味着有人能够捕获他们的用户名和密码，然后使用这些凭据远程入侵公司电脑。


    这清楚地表明针对该公司的网络攻击复杂程度显著增加。网络安全人员怀疑网络攻击的变化与新所有权有关。拥有完全所有权的国家长期以来与另一个频繁对外国利益发动网络攻击的国家处于对立状态。新的网络攻击类型与此前归因于该国家的攻击类型是一致的。


    一位因职位代表公司所有者的高级政府官员即将访问，网络安全人员认为他应该了解公司正面临的新型且更危险的网络安全风险。他们通过管理链向 `CEO` 报告了他们的发现、怀疑和建议。然而，`CEO`
    对其与新老板的的有有不同的议程，完全没有提到这些网络攻击。


    `Twitter` 提供了另一个利益冲突的例子。`Twitter` 的工程师注意到，在俄罗斯、乌克兰及前苏联国家其他地区注册了大量可疑账户。察觉到事不妙，工程师们建议删除这些账户。²¹
    然而，工程师们没有权限这样做。权力掌握在“增长团队”手中，那是市场部门的一部分，而该团队并不赞同。他们的首要考虑是缩小 `Twitter` 与 `Facebook`
    之间的用户数量差距，删除账户只会扩大这一差距。这些账户被保留了下来，并在 2016 年美国大选中发挥了作用。


    在这两个案例中，员工都掌握了与网络风险相关的重大信息，但没有路径或机制在公司管理链之外传达这些信息。结果是公司领导层一直一无所知。正如这些或其他示例所示，个人动机和利益是可能破坏网络风险管理许多不同方面的强大力量。我们一贯发现，指责个人是适得其反的。我们进一步认为，试图说服个人经理报告可能损害或干扰其自身利益的网络安全信息是毫无意义的。相反，你需要确保你的公司考虑到了人类自我保护的本能。除其他措施外，还应该建立机制，让员工在独立于其汇报结构的情况下，向你或董事会代表报告其他无法升级的网络安全疑虑。


    ### 系统与个人


    除了防止公司领导层获取关键信息外，对员工因其分享的负面消息进行指责既不公平，也不能改善网络安全实务和防御。正如上一章讨论的，单一的控制措施很少能缓解网络攻击，而是多种控制措施的协同工作。类似地，单个员工的行为很少能决定公司是击退网络攻击还是沦为受害者。在被
    `WannaCry` 勒索病毒袭击的公司案例中，指责没有及时安装安全更新的人或没有备份电脑的人是没有意义的。如果你在寻找应该指责谁或什么什么，那么你应该审视业务和网络安全活动的整体系统，而这些个人只是其中的两个部分。这也是寻求改进的地方。


    医疗保健研究质量机构（Agency for Healthcare Research and Quality）的出版物《患者安全进展：新方向与替代方法》（*Advances
    in Patient Safety: New Directions and Alternative Approaches*）指出，“意识到不良事件的发生往往是因为系统崩溃，而不仅仅是因为个人的无能，”这是医疗保健行业许多人正在重新思考将错误等同于无能的原因，并且不再认为“惩罚在激励个人更加谨慎方面是恰当且有效的。”[²²
    他们意识到指责具有毒性。“低报告率几乎无法从错误中学习，法律顾问通常支持并鼓励这种方法，以减少医疗事故诉讼的风险。”²³


    相反，公司应该将放在放在系统和流程上，而个人行为只是一部分。最近的一个中国观察捕捉到了在出现问题时观察系统而非个人的重要性：“如果鱼都死掉了，问题不在于鱼，而在于水。”上一章讨论的识别和缓解网络风险的过程，以及本章之前讨论的网络风险管理运作化，共同致力于加强和改进公司的网络安全实务，其程度超过了任何个人行为所能实现的水平。


