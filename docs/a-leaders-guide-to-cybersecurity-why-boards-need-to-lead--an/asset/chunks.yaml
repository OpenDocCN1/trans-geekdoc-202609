    While the passwords were easy for the employee to remember, they were equally
    easy for a hacker to predict. This practice undermines security, as frustrated
    users tend to create weak passwords in response.[^(33)](../Text/26_9781633698000_notes.html#ch8_rfn99)


    In addition to failing to take human behavior into account, password policies
    also don’t consider available cyber controls. Thanks to password managers, first
    available in the mid-1990s, it is now easy to create long, unique, and random
    passwords for every website, application, and service you use without having to
    remember any of them. All you need to remember is the password for the password
    manager. For example, even with the computing resources necessary to make 100
    trillion password guesses per second, it would still take over 600 billion, trillion,
    trillion centuries to crack a random thirty-character password, well beyond the
    remaining life of the universe. With a password this strong, you have no reason
    to ever change it unless you strongly suspect that it has been compromised as
    part of a cyberattack on the computer where you use the password. Should this
    happen, though, creating another thirty-character password is just a click away.


    Your oversight responsibility is to ensure that your company:


    ![images](Images/box.jpg) Has identified and is taking measures to overcome nontechnical
    impediments, such as human behavior, to the proper management of controls and
    the effectiveness of controls in practice


    The aide-mémoire for this step is [Risk Inquiry 7](../Text/22_9781633698000_ch11.html#risk7)
    in [chapter 11](../Text/22_9781633698000_ch11.html).


    ### Developing a Remediation Plan


    The next step, after prioritizing cyber risks, selecting controls, and examining
    control effectiveness, is to develop a cyber risk remediation plan. Beyond customary
    details, such as schedules for deploying controls, the plan should answer a couple
    of questions starting with, Why is your company undertaking these cybersecurity
    activities? The answer draws on correlations among critical business activities,
    vulnerabilities in their supporting systems, the cyberattacks that could exploit
    the vulnerabilities, and the resulting impact on the business activities themselves.
    Your company can find this information in the cyber threat narratives.


    In addition to providing a business-based rationale for cybersecurity priorities,
    a cyber risk remediation plan should answer the questions, When is enough enough?
    When has your company reduced its cyber risks to an acceptable level? While cyber
    risks need to be mitigated, and some investments may be substantial, cybersecurity
    budgets should never have a blank check.


    Because the process of identifying and prioritizing cyber risks is closely tied
    to business risk, your company is well positioned to answer this question by analyzing
    the relationship between a cyberattack’s capacity to disrupt or harm critical
    business activities and the strength of controls and related ongoing cybersecurity
    actions to reduce this capacity to an acceptable level. The analysis relies on
    cybersecurity input on control performance and executive input on acceptable business
    risk.


    The outcome is that your company’s cyber risk remediation plan becomes a statement
    of the activities and investments it needs to reduce its cyber risks to an acceptable
    level. Once the company deploys the controls, develops related capabilities, and
    puts ongoing processes in place, it is giving the business activities the level
    of cyber protection they need.


    From an oversight perspective, your job is to ensure your company:


    ![images](Images/box.jpg) Provides a cyber risk remediation plan that demonstrates
    how and when the deployment of selected controls, and associated activities, reduces
    your company’s most critical cyber risks to an acceptable level


    The aide-mémoire for this step is [Risk Inquiry 8](../Text/22_9781633698000_ch11.html#risk8)
    in [chapter 11](../Text/22_9781633698000_ch11.html).


    # 9


    # Fortify the Company


    After leading your company to approach cyber risks in the context of well-understood
    business risks, you now need to ensure that it is prepared to address cyber risks
    on an ongoing basis. This requires a well-thought-out organizational structure
    and processes supported by a culture that promotes openness and communication.


    The first thing your company needs to know is where to look for new cyber risks.
    The good news is that it doesn’t have to look far. Some new cyber risks have external
    origins, such as vulnerable commercial software. But nearly all the new cyber
    risks your company will face owe their origin to business-motivated changes that
    originate within your company. In order to capture these new risks, your company
    needs to have well-defined checkpoints within its change management processes
    for evaluating cyber risk and follow through on developing a cyber risk mitigation
    plan.


    Your company should brief you regularly on its current cyber risk posture, as
    it relates to specific business activities. This chapter introduces a two-step
    process for determining your company’s current posture, based on testing control
    performance and the degree of progress on the cyber risk mitigation plan.


    In addition to processes for identifying and tracking new cyber risks, the placement
    of the cybersecurity group within your company plays a significant role in reducing
    your company’s cyber risks. Part of your oversight responsibilities is to ensure
    that your company takes organizational alignment of mission and interests into
    account when finding a home for cybersecurity.


    At the end of the chapter, we examine how commonly accepted norms of corporate
    behavior have the unintended consequence of keeping you, the rest of the board,
    and senior executives in the dark about what is really going on with cybersecurity
    inside your company.


    ## Develop Institutional Cyber Risk Foresight


    To meet your oversight responsibilities related to ongoing cyber risk management,
    you must ensure that the companies you oversee:


    - Know where to look and what to look for to identify changes can introduce new
    cyber risks

    - Develop processes with well-defined checkpoints and assigned responsibilities
    to capture new cyber risks and create mitigation plans on an ongoing basis


    ### Anticipating Cyber Risks


    Attempts at earthquake prediction date back to at least the fourth century BC,
    when Aristotle reasoned in *Meteorologica* that earthquakes could be forecast
    by observing “an eclipse of the moon” or a “little, light, long-drawn cloud.”[¹](../Text/26_9781633698000_notes.html#ch9_rfn100)
    In the ensuing millennia, seismologists have made little progress in the search
    for signals that can more reliably forecast earthquakes.


    Similarly, reliable prediction of cyberattacks has proven elusive. Among other
    cybersecurity disciplines, threat intelligence, the cyber equivalent of seismology,
    is charged with predicting planned or imminent attacks. The focus of threat intelligence
    on detecting adversaries and their intentions and capabilities closely resembles
    governmental intelligence activities. The threat intelligence many companies collect,
    however, rarely suggests concrete action, such as making specific changes to cyber
    defenses to ward off imminent cyberattacks. Cyber threat intelligence is a genuinely
    challenging endeavor, in part because of the torrent of raw data pouring in from
    vendors, threat feeds, the dark web, social media, governments, and intelligence-sharing
    communities, all of which needs to be filtered and interpreted.

