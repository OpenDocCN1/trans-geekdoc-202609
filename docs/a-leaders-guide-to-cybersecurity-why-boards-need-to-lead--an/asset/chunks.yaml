    While your company’s cybersecurity group has the primary responsibility for developing
    cyberattack descriptions, your operations and systems staff can help in understanding
    consequences. A series of “What if … ?” questions can form the basis for this
    collaboration. What would happen to the provision of care, for example, if a hospital’s
    patient records were no longer accessible because of a ransomware attack? For
    England’s National Health Service in the aftermath of `WannaCry`, the answer was
    the “cancellation of thousands of appointments and operations.”[⁹](../../Text/26_9781633698000_notes.html#ch8_rfn75)


    Some consequences go beyond strict financial loss. The `NotPetya` cyberattack
    of 2017 interrupted operations and resulted in financial loss for numerous large
    companies worldwide, including `AP Moller-Maersk` with an estimated price tag
    of US$200 to $300 million and `FedEx` at US$400 million.[^(10)](../Text/26_9781633698000_notes.html#ch8_rfn76)
    Pharmaceutical giant `Merck` estimated `NotPetya`s impact at US$670 million because
    of both direct costs and lost revenue.[^(11)](../Text/26_9781633698000_notes.html#ch8_rfn77)


    The consequences for `Merck`’s customers could have been much worse. The `NotPetya`
    attack crippled `Merck`’s manufacturing processes, including those for its cancer
    vaccine, which is recommended for children starting at age eleven or twelve.[^(12)](../Text/26_9781633698000_notes.html#ch8_rfn78)
    Fortunately, `Merck` was able to borrow doses from the US Centers for Disease
    Control and Prevention’s stockpile to fill the demand it couldn’t meet. If `Merck`
    hadn’t had access to the stockpiled doses, the consequences would have gone beyond
    a loss on the books to increased risk of cancer in young people.


    Executive leadership and senior management are well positioned to identify risks
    to these activities and the consequences. Specialists from other departments,
    such as legal, finance, and compliance, can help further identify collateral risks.
    Meetings with executive leadership are critical, but they don’t need to be time-consuming.
    Well-scripted interviews and discussions are efficient ways to collect and document
    executive input.


    Your primary oversight responsibility for this element of a cyber threat narrative
    is to ensure your company has identified:


    ![images](Images/box.jpg)   The most significant types of cyberattacks that can
    cause critical business activity risks to materialize


    ![images](Images/box.jpg)   The ranges of possible impact to both your company
    and its stakeholders


    The aide-mémoire for this step is `[Risk Inquiry 3](../../Text/22_9781633698000_ch11.html#risk3)`
    in `[chapter 11](../../Text/22_9781633698000_ch11.html)`.


    ## Cyber Adversaries


    Cyberattacks are not natural disasters; they don’t just happen. Someone is behind
    them. The question is, Who’s out to get you? The answer could be countries, criminal
    organizations, competitors, disgruntled employees, terrorists, or advocacy groups.
    CLP’s Lancaster observed, “The cyber threat landscape is changing. Critical infrastructure,
    especially electric power, is increasingly a target of cyberattack. The adversaries
    who concern us are well funded and organized criminals and nation states.”


    Identifying potential adversaries, as well as their motivations and capabilities,
    can help your company assess the likelihood of a cyberattack and determine the
    controls it will need to thwart it. As we described in `[chapter 2](../../Text/10_9781633698000_ch2.html)`,
    advanced hacking tools are widely available to many potential cyber adversaries.
    This increases the importance of other capabilities such as financing, staffing,
    and logistics.


    Think about what your company has that could be of value to someone else. For
    example, a competitor could be interested in your R&D and trade secrets, whereas
    a criminal organization would be more interested in stealing customer financial
    records to sell on the black market.


    Even customers are potential cyber adversaries. `AMSC` (formerly known as `American
    Superconductor Corp.`) was a profitable company that developed software for controlling
    wind turbines in its headquarters in Devens, Massachusetts. In 2011, `Sinovel`,
    one of its largest customers, suddenly canceled payments on all delivered products
    and future contracts, worth over $800 million. An investigation revealed that
    `Sinovel` had bribed one of `AMSC`’s European developers to steal the software
    so it wouldn’t have to pay for it, and then proceeded to deploy the software to
    more than a thousand turbines in China. In July 2018, seven years after the theft,
    a US court awarded `AMSC` $59 million, some of which has been paid. However, this
    doesn’t come close to approaching the loss of over a billion dollars in `AMSC`’s
    shareholder equity and seven hundred jobs, which was over half of its global workforce.[^(13)](../Text/26_9781633698000_notes.html#ch8_rfn79)
    As a result of this intellectual property theft, `AMSC` reported a loss of over
    $186 million in fiscal year 2010 and revenues have never returned it to profitability.[^(14)](../Text/26_9781633698000_notes.html#ch8_rfn80)


    Also consider a potential adversary’s larger business and commercial situation.
    During our meeting with casino managers on the Coati Strip in Macau, they told
    us about the customer relationship management system they used to collect, analyze,
    and monetize the wealth of proprietary data they had on VIP clients. Data was
    constantly collected from multiple locations across Macau and transmitted via
    the local telecommunication network to a centralized operations center. When asked
    about these networks, the casino managers replied that the network connections
    were not encrypted. They had not identified the need. The next question we asked
    was, Who owns the telecommunications firm? It was as if all the air was sucked
    out of the room. The casino operators realized that the telecommunications firm,
    which had unlimited access to their most sensitive customer information as it
    traversed their network, was owned by a conglomerate that included their largest
    gaming competitor.


    Sometimes a company’s industry or the way in which it conducts business could
    motivate someone to mount an attack against it. For example, environmental groups
    might target companies with a bad record for polluting. `Edward Snowden`, a former
    `NSA` contractor, stole information from the `NSA` to expose surveillance programs
    that it publicly denied.[^(15)](../Text/26_9781633698000_notes.html#ch8_rfn81)
    In another case, the group `Anonymous` mounted cyberattacks against five oil companies—`Shell`,
    `BP`, `Exxon`, `Gazprom`, and `Rosneft`. The group held these companies responsible
    for what it thought was harmful action in the Arctic.[^(16)](../Text/26_9781633698000_notes.html#ch8_rfn82)
    Company activities, such as layoffs or plant closures, can also motivate employees
    to misuse their computer privileges as a means of retaliation.


    For another perspective, look beyond your company to the broader commercial and
    political world in which it operates. For instance, if as suspected, `Russia`
    was behind the cyberattacks on power plants in `Ivano-Frankivsk` in 2015, the
    motivations for the attacks likely had nothing to do with the power companies
    themselves. The companies were probably targeted simply because they are located
    in the Ukraine, a country with which `Russia` has a hostile relationship.


    Senior executives are well positioned to identify entities that may want to attack
    the company. But there will be surprises. The `WannaCry` attack had an impact
    on a wide variety of companies worldwide, and the only thing connecting the victims
    was the fact that they hadn’t patched their systems. And there will always be
    random individuals with a personal agenda to pursue or reputation to enhance.


    From an oversight perspective, your job is to ensure that your company:


    ![images](Images/box.jpg) Identifies likely cyber adversaries, their capabilities,
    and motivations—and the characteristics that make your company a target

