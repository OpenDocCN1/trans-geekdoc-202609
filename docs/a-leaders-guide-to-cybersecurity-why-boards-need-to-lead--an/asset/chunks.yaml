    The fundamental cyber vulnerabilities computers face are neither growing nor new.
    The innovative ways in which we are using and combining digital technologies introduce
    new challenges, but these are all variations on existing themes.


    Further, although computers now come in a variety of packages ranging from mainframes
    and laptops to watches and refrigerators, and require new approaches for protection,
    the cybersecurity issues are fundamentally the same. In a similar vein, so are
    the attacks. Certain particulars of an attack may be different, but the attack
    is not fundamentally different. Think, for example, of emails containing links
    that, when clicked, result in the download of malicious software onto your laptop.
    Now think of an SMS that, when clicked, results in the download of malicious software
    onto your phone. The delivery mechanisms are different, email versus SMS, and
    the malicious software will be different to accommodate running on a laptop versus
    a phone, but they are the same cyberattack. This situation is analogous to a store
    that claims to have forty different shirts, but in reality, it is selling one
    shirt in four sizes and ten colors.


    In this chapter, we showed how common cybersecurity platitudes draw our attention
    from what really is important to what only seems to be. In the next chapter, we
    show how dynamics that are just out of sight expose commonly accepted truths about
    cyber defenses.


    # 2


    # Hidden Dynamics


    Effective cybersecurity requires awareness of a host of nontechnical factors,
    or hidden dynamics. These dynamics are not lines of code or circuits etched into
    silicon that only engineers and programmers can comprehend. Rather, they’re business
    factors that you already know but might not have associated with cybersecurity.


    First, we address the dynamic we call the “chimera of compliance”—the inherent
    limitations of cybersecurity standards and the regulations based on them as a
    way to determine a company’s cybersecurity posture. Next, we look at the second
    dynamic, “employee motivation”—how employees simply trying to excel at their jobs
    can engage in behavior that creates new cyber risks for their company. Then we
    examine the “economics of cyberattack”—the financial incentives of the cyberattack
    tools and services market and raise the question, “Does it really matter who attacked
    us?” Finally we look at the “asymmetry of attack and defense”—the relationship
    between the power of an attack and the required strength of the defense, and how
    the cyber dynamics are completely different from what we are accustomed to in
    a traditional battle.


    ## Chimera of Compliance'
