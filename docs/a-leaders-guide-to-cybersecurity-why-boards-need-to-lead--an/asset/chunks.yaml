    \ can effectively know a company’s operations deeply enough to spot brewing dangers\
    \ before they emerge into full-blown problems.\n\nFrom an oversight perspective,\
    \ your job is to ensure your company:\n\n![images](Images/box.jpg)   Captures\
    \ business changes that can introduce new cyber risks\n\n![images](Images/box.jpg)   Undertakes\
    \ cybersecurity reviews of these changes to determine appropriate cyber risk mitigation\n\
    \nThe aide-mémoire for this step is [Fortify Inquiry 1](../Text/23_9781633698000_ch12.html#inq1)\
    \ in [chapter 12](../Text/23_9781633698000_ch12.html).\n\n## Know Your Company’s\
    \  \n\nCurrent Risk Posture\n\nTo meet your oversight responsibilities related\
    \ to ongoing tracking of current cyber risk posture, you must ensure that the\
    \ companies you oversee:\n\n•   Regularly test the effectiveness of their cyber\
    \ risk controls\n\n•   Track progress on cyber risk mitigation plans on an ongoing\
    \ basis\n\nIn order to understand and gauge how prepared your company is to face\
