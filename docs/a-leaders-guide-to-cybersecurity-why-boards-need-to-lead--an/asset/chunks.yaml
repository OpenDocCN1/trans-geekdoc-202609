    持续的日常业务活动也可能向关键系统引入漏洞。有时，这些是我们上述讨论的变化的自然延续。让战略性供应商直接访问公司应用程序是一个导致变化的一次性决策。然而，对供应商员工账户的管理是一项持续活动，它可能会引发网络风险，例如，错误地授予了比需求更强大的权限。将业务信息存储在云端是另一个例子，它属于单次变更后会带来多次产生新网络风险的机会。`Amazon
    Web Services` 云端文件库的配置错误暴露了无数组织的敏感信息，包括 `NSA`（美国安全局），其泄露了战场情报系统的细节；以及 `Accenture`（埃哲），其丢失了用于保护客户信息的密码和加密密钥[⁴


    正如供应商提供的软件应用程序可能包含漏洞，内部开发的软件也是如此。软件开发人员很少从零开始编写程序，而是倾向于通过组装以前编写的例程（部分来自外部来源）来提高效率。例如，2017
    年，爱沙尼亚政府由于智能卡内置的第三方软件存在加密缺陷，暂停了超过 75 万张智能身份卡的使用。编写该漏洞软件的德国研究生并没有恶意；他只是简单展示了设计和编写复杂程序的困难性。


    “影子 IT”是指员工在 IT 部门不知或未批准的情况下使用技术。建立连接到公司网络的无线网络就是一个例子。这种做法已急剧扩大，现在包含了对云服务和物联网设备的广泛使用。通常，员工会采取这些变通方案来提高生产力和便利性。由于他们认为
    IT 部门工作过载，无法及时部署所需的技术，或者认为不会获得批准，因此他们自顾其事。


    虽然这些变化中没有哪一个达到你关注的程度，但你需要确保人们已经识别了这些引入新网络风险的隐性手段，并建立了适当的控制措施来防止它们。记住公司自身的行为会产生新的网络风险，将帮助你和高管在公司活动、结构或业务生态系统发生变化时更加警惕。在计划特定行动之前，任何对网络风险的讨论都是假设性的，但你不和其他其他董事成员不应放弃进一步了解业务活动（如建立合资企业）或技术（如物联网）所广泛的网络风险影响。


    这意味着当你的公司准备好采取行动时，你的监管才开始。你不需要试图预测未来。


    ### 系统化捕捉业务变更


    为了持续处理新的网络风险，你的公司需要将捕捉业务变化的流程嵌入到其运营中。同样，你的公司还需要将分析这些网络风险并确定适当补救措施的流程常规化。


    你的公司可以从现有的变更管理和审批流程中寻找检查点，以捕捉与网络风险相关的变更。它可能需要通过以下两种方式增强这些现有流程：第一是扩展范围，涵盖所有可能引入网络风险的所有类型的业务变更；第二是确保进行网络安全审查。虽然许多公司在
    IT 部门发起的项目中包含了网络安全审查，但他们往往忽略了源自组织其他部分的项目。


    根据我们的经验，在缺乏任何证据的情况下，人们通常认为会有其他人在处理与网络风险相关的任务，这源于对网络安全和 IT 员工的自信，以及认为任务太明显、太重要而不会被忽视的想法。如果参与业务变更规划的每个人都假设有其他人在负责网络安全问题，那么就没有人会负责。


    我们在上一章中描述的所有风险识别、优先级排序和补救活动都适用于捕捉新网络风险的过程。此外，在检查公司现有网络风险时开发的许多分析和发现（例如识别可能造成最大损害的网络攻击以及减轻这些攻击的控制措施），可以直接借鉴网络威胁叙述（cyber
    threat narratives）。同样，你的公司应该利用开发网络威胁叙述时使用的相同企业专业知识组合，对分诊标准进行编码，并对新的网络风险进行优先级排序。这包括参与日常业务活动和支持这些活动的计算系统管理的人员，以及网络安全专家和其他相关学科（如法律）的专家。


    开发检查点是相对直接的。挑战在于决定看什么以及深度有多深；变更量可能非常巨大，分析所有内容是不可行的。在上一章中，我们建议你根据业务活动的关键性对其进行扫描优先级排序。这些关键业务活动是一个很好的起点，因为你永远没有足够的资源来审查一切，尤其是是在及时的情况下。


    最终使公司能够预测未来网络风险的过程和活动必须是内部的。只有内部员工（而不是外部顾问）才能有效地深入了解公司的运营，从而在危险演变成全面问题之前发现其苗头。


    从监管的角度来看，你的工作是确保你的公司：


    ![images](img/box.jpg) 捕捉可能引入新网络风险的业务变更


    ![images](img/box.jpg) 对这些变更进行网络安全审查，以确定适当的网络风险缓解措施


    此步骤的备忘录是 第 12 章 中的 Fortify Inquiry 1。


    ## 了解公司当前的风险状况


    为了履行持续跟踪当前风险状况的职责，你必须确保你监管的公司：


    - 定期测试其网络风险控制措施的有效性

    - 持续跟踪网络风险缓解计划的进展


