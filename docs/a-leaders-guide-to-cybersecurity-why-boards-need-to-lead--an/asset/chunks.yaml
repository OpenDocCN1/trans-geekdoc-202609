    ### 依据

    **依据**

    网络攻击通过利用支持这些业务活动的计算机系统中的漏洞，来破坏关键业务活动。为了让贵公司理解其面临的网络风险，首先需要了解涉及哪些系统及其漏洞。此外，网络安全控制措施的实施可能是一个漫长的过程。控制措施的分阶段部署应基于其所支持的业务活动的重要性。在发生网络攻击时，响应团队需要知道受影响的计算机所在位置，以便执行多项修复活动。


    **证据**

    *   计算机系统清单，包括每项已识别的关键业务活动的硬件、软件和机器位置。IT 部门通常会维护硬件和软件清单，尽管这些清单往往没有保持与时同步，或不包含位置信息。

    *   贵公司用于保持清单更新的流程和工具说明，以及若干个清单更新的示例，以证明这些流程正在使用。


    **监督**

    *   确认这些清单存在，并已使用了保持其更新的流程和工具。


    ---


    ### 表格 11-3：网络攻击及其后果


    | 风险问询 3 | “导致关键业务活动风险发生的最主要的网络攻击类型有哪些？它们对公司和利益相关者的可能影响范围是什么？” |

    | :--- | :--- |

    | **依据** | 通过此项问询，你正在帮助确保公司对网络风险的处理与整体业务风险管理以及贵公司的风险偏好保持一致。网络攻击的影响往往大于业务中断的其他原因。风险缓解活动和控制措施的优先级排序应考虑到这些差异。
    |

    | **证据** | *   导致关键业务活动风险发生的最主要的网络攻击类型及其可能影响范围的描述。网络攻击的执行方式变体几乎是无限的。列举所有变体既不实际也没有用处。对于你此项问询的用途而言，贵公司识别出基本的网络攻击类型即可，例如使用恶意软件的外部攻击，或滥用其计算机权限的员工。
    |

    | **监督** | *   确认贵公司已识别出由网络攻击引起的关键业务活动的最主要风险以及可能的影响范围。<br>*   此项问询让你有机会更多地了解网络攻击的类型，以及它们对贵公司及其运营可能造成的损害程度。
    |


    ---


    ### 表格 11-4：网络对手


    | 风险问询 4 | “谁可能对公司发起网络攻击？他们的动机和资源是什么？” |

    | :--- | :--- |

    | **依据** | 了解有动机攻击贵公司的对手类型，对于确定网络攻击发生的概率是有用的输入。 |

    | **证据** | *   可能的网络对手列表、他们的动机以及执行网络攻击的资源。这些动机可能源于贵公司的特定方面，例如业务惯例、高价值的贸易秘密或地理布局。
    |

    | **监督** | *   确认贵公司在制定网络安全策略时已考虑了这些信息。<br>*   对可能的网络对手及其动机提供建议。 |


    ---


    ## 缓解网络风险


    ### 表格 11-5：网络攻击优先级排序


    | 风险问询 5 | “根据以下考虑因素，提供一份按优先级排序的网络攻击列表：<br>*   它们导致关键业务活动风险的能力、<br>*可能影响的范围、<br>*成功攻击所需的资源，以及<br>*   可能的网络对手的动机和能力。”
    |

    | :--- | :--- |

    | **依据** | 这份清单是贵公司对网络风险缓解优先事项的声明。问询的框架确保了这些优先级稳固地基于缓解对贵公司最可能且影响重大的业务风险。 |

    | **证据** | *   按优先级排序的网络攻击描述性列表。 |

    | **监督** | *确认该清单考虑了问询中识别的四种考虑因素。 |


    ---


    ### 表格 11-6：选择控制措施


    | 风险问询 6 | “提供一份推荐的网络控制措施列表，其选择基于这些措施缓解按优先级排序的网络攻击的适用性。” |

    | :--- | :--- |

    | **依据** | 此项问询确保贵公司的网络安全投资涵盖了其最主要的网络风险，并且这些控制措施的保护效益在业务背景下是可理解的。 |

    | **证据** | *   推荐的网络控制措施列表，包括每项控制措施有助于缓解的网络攻击，以及每项控制措施因此有助于避免的业务活动风险。通常使用一组控制措施而非单一控制措施来缓解网络攻击。
    |

    | **监督** | *确认推荐的网络控制措施的描述引用了相关的网络攻击和业务活动。<br>*此项问询让你有机会更多地了解网络攻击、它们可能破坏的业务活动与贵公司为缓解这些风险所采取的措施（即控制措施）之间的关系。
    |


    ---


    ### 表格 11-7：检查控制措施有效性


    | 风险问询 7 | “识别公司为克服控制措施妥善管理的非技术障碍以及控制在实践中的有效性所采取的措施。” |

    | :--- | :--- |

    | **依据** | 如果不考虑到与控制措施管理相关的非技术动态或员工在面对控制措施时的行为，即使是最复杂的网络安全控制措施的有效性也可能被消除。 |

    | **证据** | *   贵公司为消除破坏控制措施管理和配置的非技术动态所采取的措施描述。根本原因包括对控制措施预期用途的不明确，或者严格执行控制干扰业务运营的预期负面反应。这些证据主要适用于网络安全和
    IT 人员。<br>*贵公司为考虑到员工对控制的预期反应而采取的措施描述。这包括正确使用控制措施的负担过大或阻碍工作的情况。这些证据广泛适用于员工。 |

    | **监督** | *   确认贵公司正在处理这些非技术动态。如果贵公司没有识别出任何影响控制有效性的障碍，那么需要重新检查。 |


    ---


    ### 表格 11-8：制定修复计划


    | 风险问询 8 | “提供一份网络风险修复计划，证明所选控制措施及相关活动的部署如何以及何时将公司最关键的网络风险降低到可接受的水平。” |

    | :--- | :--- |

    | **依据** | 除了提供网络安全路线图外，网络风险修复计划是贵公司认为保护其关键业务活动免受相关网络风险影响所需的投资和活动的声明。这意味着一旦公司部署了控制措施、开发了相关能力并建立了持续流程，这些业务活动就获得了它们所需的网络保护。
    |

    | **证据** | *一份网络风险修复计划，该计划实质上是贵公司关于将其网络风险降低到可接受水平所需的活动和投资的声明。 |

    | **监督** | *确认制定网络风险修复计划。 |


    '
