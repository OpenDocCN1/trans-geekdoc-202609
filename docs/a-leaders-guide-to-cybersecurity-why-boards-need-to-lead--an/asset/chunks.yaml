    * 确保公司在实践中遵循该政策的组织措施。


    ## 监督

    * 您通过提出此查询并确认证据存在来履行您的监督职责。


    # 13 备忘录（Aide-Mémoire）：危机领导


    本 `aide-mémoire` 的目的是为您提供必要的保证，确保公司在发生网络攻击引发的危机时已做好准备。这种准备既包括公司应对网络攻击的技术能力，也执行团队在危机期间进行领导和沟通的准备工作。虽然任何危机都会存在信息不完整、不确定性和意外，但公司需要的技能类型、资源以及高管将面临的决策在很大程度上是可以预测的，并可以在危机发生前做好准备。


    ## 网络事件响应


    ### 表格 13-1：人员配置


    | 危机查询 1 | “公司是否有足够的人员来有效应对破坏性最大的类型网络事件？” |

    | --- | --- |

    | 依据 | 虽然应对任何网络事件都需要一套通用的技能，但完整的技能组合取决于事件类型。此查询让您了解公司已准备好应对可能给公司造成最重大损害的网络事件。
    |

    | 证据 | * 网络事件响应团队的核心成员名单、其角色和资质。<br>* 扩展内部团队成员部门名单、其角色以及他们参与的网络事件类型。<br>* 第三方事件响应服务列表、其负责的网络事件类型以及合同责任。<br>*
    当员工被抽调至响应活动时，公司将如何继续运营。 |

    | 监督 | * 确认已提供的信息，并涵盖了在 `第 11 章` 的 `风险查询 5` 中确定的优先事项网络攻击。<br>* 此查询让您有机会了解在响应影响贵公司的网络事件时所涉及的不同类型的技能。
    |


    ### 表格 13-2：网络事件响应计划和程序


    | 危机查询 2 | “公司为准备应对不同类型的网络事件做了哪些正式规划？” |

    | --- | --- |

    | 依据 | 正如对不同类型网络事件的响应需要不同的技能，它们还需要不同类型的响应活动和相关工具。您需要确保公司的网络事件响应团队已经考虑了其可能面临的网络事件类型，理解了与事件相关的响应类型，并做了必要的准备。
    |

    | 证据 | * 网络事件响应计划，涵盖了任何网络事件涉及的标准步骤，以及与特定类型网络事件相关的额外活动。<br>* 必要的事件响应工具识别，以及发生事件时公司将如何获取这些工具。贵公司可能内部拥有一些频繁使用的工具，而对于不常用的工具则依赖第三方服务提供商。
    |

    | 监督 | * 确认已提供网络事件响应计划，并涵盖了在 `第 11 章` 的 `风险查询 5` 中确定的优先事项网络攻击。 |


    ### 表格 13-3：事件响应实践


    | 危机查询 3 | “公司开展哪些事件响应演练和练习？它正在计划哪些类型的网络危机？” |

    | --- | --- |

    | 依据 | 鉴于危机期间的压力，针对最严重的网络危机进行练习是有益的。更重要的是，练习将使这些响应变得更有价值。 |

    | 证据 | * 针对可能导致重大业务损失和危机的优先事项网络攻击的计划。<br>* 测试技术技能、决策和后勤的网络事件响应演练。<br>* 事件响应计划。
    |

    | 监督 | * 参加事件响应演练。<br>* 确认事件响应演练涵盖了可能导致危机的网络攻击。 |


    ## 执行领导力


    ### 表格 13-4：设定网络危机优先级


    | 危机查询 4 | “公司确定了哪些网络危机需要高管进行准备？” |

    | --- | --- |

    | 依据 | 让高管为每种类型的网络危机做准备是不行的，但一旦发生网络危机，让他们他们做好准备是非常关重要的。通过提出此查询，您确保了公司正在为高管应对最严重的网络危机做准备。
    |

    | 证据 | * 选定的供高管准备的网络危机描述及其依据。这些依据应包括：<br>* 受影响业务活动的重要性以及影响的严重程度<br>* 由于缺乏控制导致的风险增加<br>*
    不同类型网络危机的组合 |

    | 监督 | * 确认网络危机的选择及其底层依据。<br>* 对其他类型的网络危机提供建议。 |


    ### 表格 13-5：网络危机场景


    | 危机查询 5 | “提供网络危机场景，描述可能导致危机的网络攻击、攻击可能发生的广泛背景以及后果的范围。” |

    | --- | --- |

    | 依据 | 为了让高管对潜在网络危机的讨论产生用，场景必须是真实的，并清晰地将针对贵公司计算机的网络攻击与对公司业务的影响联系起来。 |

    | 证据 | * 每个每个优先事项网络危机的场景，包括：<br>* 网络攻击及后续危机可能发生的广泛背景<br>* 网络攻击的概述、成功的条件以及执行步骤<br>*
    对贵公司及其利益相关者的后果 |

    | 监督 | * 确认网络危机场景包含了所需的信息。<br>* 利用此查询以及剩余的危机查询，作为进一步了解贵公司可能面临的网络危机的机会。 |


    ### 表格 13-6：高管意识


    | 危机查询 6 | “描述在整个网络危机期间保持高管知情状态的准备工作，包括信息来源和分配的职责。” |

    | --- | --- |

    | 依据 | 在网络危机期间，高管需要及时且准确的信息来领导公司并与公众接触。鉴于危机期间的时间压力，贵公司应提前做好准备。 |

    | 证据 | * 通知高管的计划：<br>* 网络攻击<br>* 网络防御及其失败的原因<br>* 网络事件响应进展 |


