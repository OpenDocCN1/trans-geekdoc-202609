- fmt: '

    So, this incident was the result of a people problem, but not a problem with the
    clerk. The problem was with the IT staff who didn’t install Excel on her computer.
    When they eventually installed Excel, the risk of her losing patient information
    on a USB drive disappeared because she no longer had any reason to use one. This
    example shows that people are motivated to do their jobs, even if it entails undermining
    cybersecurity. The clerk was not conscious of the fact that her actions could
    compromise patient information. She just wanted to do her job.


    ### Phishing


    People often open attachments and click on links in emails that result in malware
    being downloaded onto their computers. Attackers have become savvier in using
    information gleaned from social media and professional networking sites in crafting
    these phishing emails, so recipients find it increasingly difficult to tell the
    difference. While a few Nigerian princes still want to give you millions, their
    emails have largely been replaced by a variety of more-convincing ones. The University
    of California at Berkeley keeps a database of phishing attack examples, such as
    one purporting to be from the human resources department (see [figure 1-1](#09_9781633698000_ch1.html#fig1-1)).[²](../Text/26_9781633698000_notes.html#ch1_rfn6)


    FIGURE 1-1


    Example of phishing attack


    ![images](Images/fig1-1.jpg)


    The email in the figure looks legitimate, and the instruction to log on to your
    account to view the document isn’t suspicious because this is standard practice
    for many organizations, especially when a document contains sensitive information.
    The security advice the Berkeley Information Security Office offered for this
    type of example is that the email recipient should first verify that the link
    is legitimate before clicking on it. To perform the verification, the email recipient
    needs first to position his or mouse over “Click here” so that the website’s address
    will appear. Then, most critically, the recipient needs to discern if it is really
    the address of the HR department website as opposed to one trying to impersonate
    the website.


    This advice, with which most cybersecurity experts would agree, fails to consider
    two factors. The first is that reading email at work is not a leisure activity;
    people try to get through it as quickly as possible. Many will find that the time
    to position a mouse over a link, look at a website address, and decide if it is
    legitimate or not will take too long. The other and more important factor is that
    determining the validity of a website address is not a responsibility that most
    people can reliably fulfill, so not one that a company should impose on them.


    ### Security Awareness Training


    A commonly used control to prevent phishing attacks and, more broadly, the introduction
    of malicious software into a corporate environment is security awareness training.
    However, even employees at cybersecurity companies have difficulties internalizing
    cybersecurity awareness training. Intel Security (formerly McAfee) tested 19,000
    people from 140 countries and only 3 percent were able to identify all the phishing
    emails in a sample of 10, and 80 percent failed to spot any of the phishing emails.[³](../Text/26_9781633698000_notes.html#ch1_rfn7)
    No amount of security awareness training can satisfactorily mitigate this risk,
    as it takes only one person to click on the wrong link or open a tainted attachment
    in order for this type of attack to succeed.


    ### Identifying Malicious Software


    Another tool for foiling phishing attacks, and their associated malware, is anti-malware
    technologies that work by detecting malicious software before it can establish
    a beachhead on a computer and start its process of exploitation. Therein lies
    the problem—how to identify malicious software. Initially, this was done by compiling
    a list of the signatures, or fingerprints, of known malicious software and comparing
    it with any new program before allowing the software to run. More-sophisticated
    anti-malware products look at additional characteristics, including behavior,
    of potentially malicious software. However, the challenge remains, as defenders
    constantly try to catch up with the new versions of malicious software that attackers
    are adept at creating.


    In late 2017, the company Malwarebytes, itself a provider of anti-malware solutions,
    examined malware detection rates from almost 10 million computers and found that
    even highly ranked anti-malware products failed to detect over 60 percent of the
    malware it tested.[⁴](../Text/26_9781633698000_notes.html#ch1_rfn8) Going back
    to 2013, the *New York Times* revealed its corporate network had been breached
    in an attempt to discover reporters’ sources.[⁵](../Text/26_9781633698000_notes.html#ch1_rfn9)
    This attack included the use of forty-five different kinds of malicious software,
    of which only one was detected by its anti-malware solution.


    Going further back to the beginnings of computer viruses, the inherent limitations
    of antivirus solutions were recognized by a founder of the antivirus industry.
    When the first computer virus appeared in 1986, within two years, there were as
    many as forty antivirus vendors in this booming market.[⁶](../Text/26_9781633698000_notes.html#ch1_rfn10)
    With this rapid proliferation of vendors, John McAfee, who developed the first
    successful commercial antivirus program, estimated that “as many as 75% of the
    products currently being marketed are ineffective in that they do not detect or
    protect against a significant percent of the viruses.”[⁷](../Text/26_9781633698000_notes.html#ch1_rfn11)
    He publicly worried that a “lack of understanding on the part of end users has
    created an environment conducive to misinformation, emotionalism and fraud.”[⁸](../Text/26_9781633698000_notes.html#ch1_rfn12)
    As of 2018, the worldwide annual revenue for these types of products exceeded
    US15 billion and was expected to continue to grow at a brisk 10 percent.[⁹](../Text/26_9781633698000_notes.html#ch1_rfn13)


    There is an elegant technological solution for addressing phishing attacks and
    all other types of malicious software that is inherently effective and doesn’t
    require all your employees to make the right decision all the time about what
    they click on or open. `Application whitelisting` is based on the principle that
    if malicious software can’t run on a computer, it can’t harm the computer. It
    borrows from a practice often used to restrict access to clubs, parties, and other
    special events—the guest list. Instead of trying to determine if every program
    or piece of software is malicious, `whitelisting` focuses on only allowing software
    that is already known to be safe to run on a computer. It doesn’t matter what
    links people click on or what attachments they open. It doesn’t matter how many
    new variants of malicious software are created every day. If the malware isn’t
    on the guest list, it won’t be let in.


    ### IT Staff Incentives


    The security concepts behind `application whitelisting` have been known for years.
    There are commercial whitelisting products, and even the `Windows` and `macOS`
    operating systems contain whitelisting tools. So, the question remains, why aren’t
    people using application whitelisting more broadly? Further, why is it likely
    that you have never heard of it, while `antivirus` or `anti-malware` products
    are quite familiar? The answer comes down to motivation and blame.


    Since current malware defenses aren’t effective, infections are routine and perceived
    as inevitable. When infections do occur, companies blame neither the providers
    of security awareness training nor the anti-malware solutions for the failure
    of the products and services. Nor do they blame the staff people who procured
    these products and services. There is no motivation for the cybersecurity function
    within an organization to change from approaches that aren’t effective to one
    that is.

