    Around the same time this advisory was issued, the Ministry of Foreign Affairs
    in the Netherlands issued a letter warning Dutch travelers to Turkey, China, Russia,
    and Iran of cyber threats to their electronic devices.[²](../Text/26_9781633698000_notes.html#ch3_rfn47)
    The recommended precautions, such as bringing “clean” laptops and mobile phones
    with minimal data, are standard governmental advice for international travel.
    The problem with this type of advice is that it doesn’t consider the information
    and technology required for people to conduct business while traveling. It further
    fails to address the practicalities of living and working in a foreign country.


    While there may be other, perhaps geopolitical motivations for issuing these warnings,
    they do not contribute to protecting the businesses and individuals for whom the
    warnings are ostensibly issued. They instead raise concerns without providing
    a path to reduce fear.


    ## Should You Accept Government Assistance?


    The increasing, successful number of cyberattacks on businesses, often attributed
    to nation-states, has prompted active discussion of extending governmental national
    defense responsibilities to protect companies from cyberattack. This proposal
    has important ramifications for businesses. Traditional national defense benefits
    from well-defined national borders and (relatively) easily identifiable adversaries.
    These benefits disappear on the digital battlefield.


    The first issue to address is identifying the attacker. This is easy to accomplish
    before an attack if, for example, a row of tanks is deployed at your border. Not
    so for a cyberattack that can originate from anywhere in the world. An attack
    on a company in Boston that appears to be from North Korea could have originated
    in New York, following a circuitous path through France and Singapore on the way.
    All the telltale signs typically used to identify cyberattackers, such as the
    provenance of hacking software, the default language of the computer hackers use
    to develop the software, and the addresses of computers they use in the attack,
    can be easily modified to throw off the scent. Further, all these indicators can
    only be analyzed after an attack has started. We can’t know the foreign origin
    of a cyberattack in advance, and therefore we can’t know the appropriateness of
    a military response either.


    With any governmental offer of direct cyber defense assistance, business leaders
    need to consider what risks they can and cannot reduce, and if government help
    could introduce new risks. Most proposals for military and law enforcement cyber
    services include monitoring of all the computer network communications entering
    and leaving a company. This addresses the risk of internet-based attacks using
    malware. Monitoring cannot, however, address any cyber risks whose mitigation
    requires an understanding of how a company operates and conducts business. It
    could not have prevented the billion-dollar loss at the Asian automobile manufacturer
    described in chapter 2(../Text/10_9781633698000_ch2.html) or, for example, detected
    financial fraud in a procurement department or a joint venture partner’s theft
    of intellectual property.


    In addition to clues of a cyberattack, monitored communications also contain a
    treasure trove of a company’s sensitive information that is now in the hands of
    a government. For multinational companies, monitoring could involve more than
    one government. Given that the global interests of nations and multinational companies
    are not the same, there is a risk that information a government collects for preventing
    cyberattacks could be used for other purposes. The global head of security for
    a multinational mining client declined the offer of security network monitoring
    services from a US government bureau for this very reason.[³](../Text/26_9781633698000_notes.html#ch3_rfn48)
    Several years later, the same bureau approached the global head’s successor with
    a similar offer. Hidden in the fine print of the agreement, the bureau stated
    that it was free to use any information it collected to pursue criminal investigations.
    The global head declined the offer again. Even if this information is never repurposed,
    it is still at risk while in government care. Government agencies, including the
    `NSA`—whose middle name is literally “security”—don’t have the best track record
    in protecting themselves and their information from cyberattacks.[⁴](../Text/26_9781633698000_notes.html#ch3_rfn49)


    This is not a critique of government intentions to provide cybersecurity assistance.
    Rather, we highlight that the nature of assistance governments offer is directly
    related to the types of threats they are accustomed to addressing, such as military
    aggression from other countries. Businesses face different threats that they need
    to address according to different priorities.


    ## Cybersecurity Vendors


    Although growth of the cybersecurity market outpaces much of the rest of the economy,
    there is still intense competition. According to one estimate, in 2018 approximately
    2,300 cybersecurity vendors were chasing a dozen or so product types.[⁵](../Text/26_9781633698000_notes.html#ch3_rfn50)
    And the number of market entrants is only going to increase. Vendors face great
    pressure to stand apart from their direct competitors and distinguish their offerings.


    ### Surveys and Reports


    Vendors sometimes use surveys and reports that highlight the enormity of impact
    or the scale of their capabilities in order to establish uniqueness in a crowded
    field. Vendors, especially those that aren’t well established, can raise awareness
    by publishing reports on the anticipated cost of cybercrime. Cybersecurity Ventures’
    2016 report projected that the annual global cost of cybercrime will reach `US$6
    trillion`.[⁶](../Text/26_9781633698000_notes.html#ch3_rfn51) To put this number
    in perspective, it exceeds the nominal GDP of every single country in the world
    except the United States and China.


    CrowdStrike’s annual threat report provides a different type of example. In addition
    to collating public information on cyber incidents, its 2018 report included data
    on 90.1 billion events that were collected by its `Falcon` platform.[⁷](../Text/26_9781633698000_notes.html#ch3_rfn52)
    The network monitoring it performs is like the government-proposed monitoring
    we described earlier and has the same limitations, if not the same risks. The
    90 billion events all relate to the same, single type of internet malware attack.
    It doesn’t address internal cyber risks, such as a disgruntled IT staff person
    shutting down air traffic control systems.


    Raising awareness of a company’s cybersecurity offerings by mischaracterizing
    the threat has a long history. In the March 19, 2009, written testimony of AT&T’s
    former senior vice president and chief security officer, Edward Amoroso, before
    the US Senate Committee on Commerce, Science, and Transportation, Amoroso wrote:
    “Last year the FBI announced that revenues from cyber-crime, for the first time
    ever, exceeded drug trafficking as the most lucrative illegal global business,
    estimated at reaping more than `US$1 trillion` annually in illicit profits.”[⁸](../Text/26_9781633698000_notes.html#ch3_rfn53)
    He provided no supporting reference for the claim. To put the figure in context,
    the supposed profits would have exceeded those of AT&T itself by a factor of eighty,
    as well as the GDP of all but twelve countries.[⁹](../Text/26_9781633698000_notes.html#ch3_rfn54)
    Just a few pages later in his testimony, Amoroso suggested that federal procurement
    priorities should change to encourage civilian agencies to use the anti-denial
    of service attack services that AT&T provides.[^(10)](../Text/26_9781633698000_notes.html#ch3_rfn55)


