    The first is by confirming that evidence, such as system inventories and cyber
    threat narratives, exists. This by itself gives you a huge increase in assurance
    in your company cybersecurity performance over what is generally available. Your
    company’s inability to provide evidence in support of an inquiry could indicate
    that further examination of its capabilities in this area is warranted. In addition,
    internal audit can, on a prioritized schedule, assess the quality of the evidence
    and the processes for collecting and developing it.


    Internal audit’s assistance significantly reduces your time commitment and eliminates
    drudgery from your cybersecurity oversight responsibilities. It further benefits
    your company by focusing assessments on the activities most directly relevant
    to materially improving your company’s cybersecurity.


    ## Promote Transparency


    Across all aspects of company operations, executive leadership needs accurate
    and timely information on which to base decisions. While getting this information
    is a general challenge, it is even more difficult in the area of cybersecurity.
    One reason is because so little about cybersecurity is immediately obvious to
    a casual observer. If you look at the Great Wall of China, it’s possible to imagine
    the types of attacks it could repel. Not so with a firewall, whose protective
    capabilities are masked inside a case that resembles a stereo component. Even
    if you are not a professional house painter, you can still tell if a wall has
    been painted recently and judge the quality of the paint job. Not so for many
    cybersecurity activities, such as the configuration of a network intrusion detection
    server.


    This lack of transparency means that corporate leaders effectively have to place
    more trust in the bearers of cybersecurity news. And to help ensure this trust
    is well placed, your oversight responsibilities include ensuring that executive
    leadership fosters an open corporate environment in which everyone shares and
    reports cybersecurity information, especially negative information, readily and
    rapidly.


    To provide context for discussing factors that contribute to an open environment,
    we will first review some of the dynamics that influenced communications before
    and during a Singaporean cyber crisis in 2018.


    ### SingHealth


    The news finally arrived by email. On July 10, 2018, SingHealth’s CEO, Dr. Ivy
    Ng, was informed that a week earlier, its electronic medical record (`EMR`) system
    had been compromised. In service for nearly a decade, the `EMR` system was core
    to almost all of SingHealth’s critical business activities—from patient care to
    management to billing. Ng knew immediately that this incident was “very serious
    indeed” and directed the `CIO` to notify the authorities.[⁸](../Text/26_9781633698000_notes.html#ch9_rfn107)


    Her instincts proved right, as she would later learn that this would amount to
    the “most serious breach of personal data” in Singapore’s history.[⁹](../Text/26_9781633698000_notes.html#ch9_rfn108)
    SingHealth, the largest hospital system in Singapore, had now lost patient records
    on 25 percent of Singapore’s population, including the prescription drug history
    of Singapore’s prime minister, Lee Hsien Loong.[^(10)](../Text/26_9781633698000_notes.html#ch9_rfn109)


    Ng, a lauded pediatrician before shifting into health-care administration, still
    keeps pictures of children lost under her care in her office “to remind [her]
    that when we take care of patients, we can never do enough.”[^(11)](../Text/26_9781633698000_notes.html#ch9_rfn110)
    As CEO of SingHealth, this patient-focused sensibility translated into her clinical
    and administrative agenda, which included the security of patient data. Under
    Ng’s watch, SingHealth made substantial investments in best-practice security
    technologies and processes having “approved all, and not moderated down, any budget
    request relating to cybersecurity.”[^(12)](../Text/26_9781633698000_notes.html#ch9_rfn111)


    For years, a parade of auditors had certified the quality of her company’s cybersecurity
    program, and the board’s risk and audit committees were regularly briefed on cybersecurity
    investments, activity, and risks. The company had well-defined policies, in keeping
    with the latest international standards, and was focused on ensuring compliance
    with current regulations. It had a `CIO` who had a `CISO` as a direct report and
    conducted “phishing exercises on all SingHealth staff and email blasts to inform
    IT staff of security policies, responsibilities and security vulnerabilities.”[^(13)](../Text/26_9781633698000_notes.html#ch9_rfn112)


    Yet despite these investments, trouble had been brewing within her organization
    long before the breach. The board and executive leadership had a limited view
    of critical issues and decisions that formed both the basis of the attack and
    SingHealth’s response to it. Without leadership insight, decisions were effectively
    delegated to technologists and predictably reflected a lack of understanding of
    the critical `EMR` system and the business functions that it supported.


    Despite Ng’s declaration that the “horror of our patients’ data having been breached
    is an unacceptable risk,” the decisions made by SingHealth’s IT function did not
    reflect this view.[^(14)](../Text/26_9781633698000_notes.html#ch9_rfn113) Years
    before the breach, in 2014, an IT employee discovered and reported the security
    vulnerability in the `EMR` system. Without a connection between the technology
    and the business functions, a midlevel IT manager elected not to follow up on
    it. IT later confirmed the attacker exploited this flaw.


    In the years leading up to the attack, many security decisions did not reflect
    a thorough understanding of critical business functions or risk priorities. Security
    controls that would have thwarted the attack or allowed for an effective response
    were not implemented, even though this was a critical function.


    During the attack, junior IT employees on the front line showed great initiative,
    though some of their actions were misguided. But management inaction at every
    level of the IT management chain, from the head of incident response to the `CISO`
    to the `CIO`, hampered the employees’ efforts.


    Evidence of an ongoing attack had been discovered by a junior SingHealth staffer
    months before the breach was formally announced, but these reports were stalled
    by the head of incident response who “held mistaken understandings of what constituted
    a ‘security incident’, and when a security incident should be reported.” Further,
    he “delayed reporting because he felt that additional pressure would be put on
    him and his team once the situation became known to management” and was concerned
    that “it would not reflect well in the eyes of the organisation if the matter
    turned out to be a false alarm.”[^(15)](../Text/26_9781633698000_notes.html#ch9_rfn114)
    Further up the reporting chain, SingHealth’s `CISO` “did not understand the significance
    of the information provided to him and did not take any steps to better understand
    the information,” effectively abdicating the responsibility of deciding whether
    or not to escalate the incident.[^(16)](../Text/26_9781633698000_notes.html#ch9_rfn115)


    When staff finally reported the matter to the `CIO`, there was an additional delay
    in escalation and reporting to the CEO and the board in order to do more research
    in an effort to present a solution to the problem and demonstrate that the IT
    staff had taken the necessary actions to mitigate and contain the extent of the
    attack. That time had long since passed.

