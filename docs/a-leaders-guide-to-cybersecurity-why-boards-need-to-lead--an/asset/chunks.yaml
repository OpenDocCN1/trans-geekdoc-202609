    虽然贵公司的网络安全小组主要负责制定网络攻击描述，但你们的运营和系统人员可以帮助理解其产生的后果。一系列“如果……会怎样？”的问题可以构成这种合作的基础。例如，如果医院的患者记录因勒索软件攻击而无法访问，医疗服务的供应会发生什么变化？在
    `WannaCry` 事件之后，英国国家医疗服务体系（NHS）给出的答案是“取消了数千次预约和手术”。⁹](../../Text/26_9781633698000_notes.html#ch8_rfn75)


    某些后果的影响超出了纯粹的财务损失。2017 年的 `NotPetya` 网络攻击中断了运营，并导致全球范围内许多大型公司的财务损失，包括估计损失达 2 亿至
    3 亿美元的 `AP Moller-Maersk` 和损失达 4 亿美元的 `FedEx`。¹⁰ 制药巨头 `Merck`（默克）估计，由于直接成本和收入损失，`NotPetya`
    的影响金额达 6.7 亿美元。¹¹


    对 `Merck` 客户来说，后果可能糟糕得多。`NotPetya` 攻击瘫痪了 `Merck` 的生产流程，包括其癌症疫苗的生产，该疫苗建议十一岁或十二岁以上的儿童使用。¹²
    幸运的是，`Merck` 得从美国疾病控制与预防中心（CDC）的储备中借用了剂量来满足其无法满足的需求。如果 `Merck` 无法获得储备剂量，其后果将不仅限于账面损失，还会增加年轻人患癌症的风险。


    高执行领导层和高级管理层非常适合识别这些活动的风险及其后果。法律、财务和合规等其他部门的专家可以帮助进一步识别附带风险。与执行领导层的会议至关重要，但并不需要耗费大量时间。编写良好的访谈和讨论是收集和记录高层意见的有效方式。


    你们对网络威胁叙述中这一要素的首要监管责任是确保贵公司已识别出以下内容：


    ![images](img/box.jpg)   导致关键业务活动风险发生的最主要的网络攻击类型


    ![images](img/box.jpg)   对贵公司及其利益相关者可能产生的影响范围


    此步骤的备忘录（aide-mémoire）是 `风险查询 3`，位于 `第 11 章`。


    ## 网络对手


    网络攻击不是自然灾；它们不是偶然发生的。背后有人在操纵。问题是，谁在针对你？答案可能是国家、犯罪组织、竞争对手、不满的员工、恐怖分子或倡议团体。CLP 的兰卡斯特观察到：“网络威胁格局正在发生变化。关键基础设施，尤其是电力，正日益成为网络攻击的目标。我们关注的对手是资金充足且组织严密的犯罪分子和国家级机器。”


    识别潜在的对手以及他们的动机和能力，可以帮助贵公司评估网络攻击发生的概率，并确定为了阻止攻击而所需的控制措施。正如我们在 `第 2 章` 中描述的那样，高级黑客工具对许多潜在的网络对手来说是随处可见。这增加了其他能力（如资金、人力和后勤）的重要性。


    思考贵公司拥有哪些可能对他人有价值的东西。例如，竞争对手可能对你们的研发和商业秘密感兴趣，而犯罪组织则可能对窃取客户财务记录并在黑市出售更感兴趣。


    即使是客户也是潜在的网络对手。`AMSC`（前身为 `American Superconductor Corp.`）曾是一家盈利公司，其在马萨诸塞州德文斯的总部开发了用于控制风力涡轮机的软件。2011
    年，其最大的客户之一 `Sinovel`（华远新能源）突然取消了所有已交付产品和未来合同的付款，价值超过 8 亿美元。调查显示，`Sinovel` 贿赂了
    `AMSC` 的一名欧洲开发者盗取了软件以免付款，随后将该软件部署到中国的一千多台涡轮机上。2018 年 7 月，在被窃七年后，美国一家法院判给 `AMSC`
    5900 万美元，其中部分资金已支付。然而，这远不能弥补 `AMSC` 超过 10 亿美元的股东权益损失和 700 个工作位的损失（这占其全球总人数的一半以上）。¹³
    由于这次知识产权被盗取，`AMSC` 在 2010 财年报告了超过 1.86 亿美元的损失，且收入从未恢复到盈利水平。¹⁴ 由于这种知识产权窃取的结果，`AMSC`
    报告了 2010 财年损失超过 1.86 亿美元，且收入从未恢复到盈利水平。


