    当你参与网络安全工作时，最初感兴趣的领域之一就是了解你的公司抵御网络攻击的能力如何。诸如“我们有多安全？”“我们做得对吗？”“我们做得够多吗？”这类问题非常典型。为了取代进行以业务为导向的网络风险评估（我们将在书后部分讨论）来回答这些问题，公司通常利用对网络安全标准的遵守情况来判断自身的防护水平，并确定未来投资的优先级。尽管网络安全标准可以为你提供关于常见问题的有用思路，但为了从这些标准中获得价值，你需要理解它们的用途、局限性，以及被迫遵守多个标准和法规所带来的非预期后果。


    ## 标准的内在局限性


    ### 适用于所有人，但不适用于任何人

    网络安全标准在设计上针对广泛的受众。衡量标准成功的指标之一是其采用规模。然而，在试图顾及所有人时，网络安全标准并没有针对任何特定的需求。`改进关键基础设施网络安全的
    NIST 框架`（简称 `NIST Framework`）最初是为了帮助减少关键基础设施的网络风险。¹ 然而，该框架的引言明确指出，任何公司或组织都可以该标准，零售和酒店业等不同行业的公司正日益采用它。核电站的网络安全优先级与百货商店或酒店明显不同。任何标准，无论起草得有多完美，都无法为这类迥异的组织提供具体的指导。


    即使由你所在的行业协会发布的网络安全标准，也无法保证它能提供针对你行业有帮助且具体的指导。例如，美国化学会发布了其《负责关怀安全管理实践规范实施指南》。²](../Text/26_9781633698000_notes.html#ch2_rfn20)
    虽然可以认为这份指南为网络安全管理实践提供了有用的建议，但它没有任何内容是专门针对驱动化学制造的工业控制系统中的独特网络安全挑战的。它的通用性太强，既适用于化学公司前台的
    `IT` 系统，也适用于其编写时针对的制造系统。


    为了解决标准的缺失，许多公司开发了自身的政策。这是一个明智的举措，但你需要确保你自己的标准与行业和外部标准不同，是针对你的业务的特定的。而且你需要跟上增长。如果你收购了公司并建立了新产品，你的网络安全方法将需要改变。例如，一家金融服务客户在依靠其自有数据中心内数十台主机的计算能力时开发了其网络安全标准。这为它服务了很一段时间。然而，随着市场状况的演变，它的服务发生了变化，交付方式也随之改变。它的标准变得越来越无关。


    这种无关性在该公司收购一家印度公司时变得尤为重要，该公司的交易处理托管在一个云提供商处。第一个问题是，现有的网络安全标准对于如何保护自己免受面临的网络风险提供任何指导。第二个问题是，它始终不符合公司标准，管理层不得不花费大量且低效的时间来处理不可避免的审计发现。


    ### 永远过时

    网络安全标准总是过时的。例如，最著名的国际网络安全标准之一的 `ISO 27001` 首次于 2005 年发布。³](../Text/26_9781633698000_notes.html#ch2_rfn21)
    修订花费了八时间。2018 年，北美电力可靠性协会颁布了其 `关键基础设施保护 (CIP)` 标准 5 版。该标准取代了它十五年前（即 2003 年）首次批准的紧急行动标准
    `1200`。⁴](../Text/26_9781633698000_notes.html#ch2_rfn22)


    问题不在于标准无法跟上快速变化的网络威胁。在`第 1 章`](../Text/09_9781633698000_ch1.html)中，我们解释了这种快速变化是如何被过度夸大的。问题在于标准无法跟上业务发展的快速节奏。业务运营的变化、所提供服务的变化以及所生产产品的变化构成了企业面临的新型网络风险。


    ### 财务激励

    认证符合网络安全标准的流程证明了影响审计方和被审计方双方的财务激励如何对特定合规性的意义产生质疑。公司通常向外部审计员付费，然后由审计员证明其符合法规和行业标准，从而引入了潜在的冲突和盲点。`支付卡行业数据安全标准
    (PCI DSS)` 提供了一个很好的案例研究。⁵](../Text/26_9781633698000_notes.html#ch2_rfn23)


    在 2004 年版 `PCI DSS` 发布后不久，我们在亚洲建立了`合格安全评估员 (QSA)` 实践来进行信用卡安全评估。我们注意到的第一件事之一是，大多数商户以及存储或处理支付卡信息的公司的主要动力不是保护信用卡信息，而是获取能够显示他们确实符合合规要求的年度合规报告。此外，客户希望以最低的成本和最少的精力获得该报告。即使在我们为其中一个创始的
    `PCI` 支付品牌工作时，低成本评估也是如此优先考虑，以至于我们停止了合作。无法以其愿意的价格聘用到合格评估员。


    另一方面，执行合规评估的公司和个人的动机是最大化收入和利润。毕竟这是一门生意。`QSA` 公司可以通过重复业务轻松实现这一点，因为 `PCI DSS` 审计是年度性活动。然而，如果
    `QSA` 今年给客户打了不及格，明年可能无法被聘用。我们接触过的许多 `QSA` 评估员表示，他们的管理层经常提醒他们这种商业现实。


    影响 `PCI 评估` 质量的另一个因素是投入的时间。对于个人 `QSA` 而言，执行越来越多的评估会对总薪酬产生重大影响。`Trustwave` 是最大的
    QSA 公司；其中一位前评估员说：“你在一个季度内塞进的评估越多，你的奖金就越大、越丰厚。”例如，一个底薪为 100000 元的员工，通过尽可能产出大量的评估报告，每年可以多赚
    30000 到 50000 元。⁶](../Text/26_9781633698000_notes.html#ch2_rfn24)


    保护信用卡信息显然很重要，`PCI 评估` 是增加这种保护的手段之一。然而，非技术动态（如我们刚刚描述的财务动机）削弱了评估的价值。例如，家得宝在发生数据泄露时是符合
    `PCI` 的，该事件泄露了其 5600 万客户的信用卡详情。⁷](../Text/26_9781633698000_notes.html#ch2_rfn25)


    #### 合规与受保护

    新网络安全法规的产生了一些积极结果：公司在保护资产和客户方面付出了更多努力。但这些法规产生了非预期后果。由于法规数量巨大以及合规的负担，企业正在忽视最重大的网络风险。


