    # 备忘录：强化公司安全


    本备忘录的目的是为您提供必要的保证，确保贵公司具有持续管理其网络风险的原生能力。这包括内部流程，通过定义良好的检查点和分配的职责来捕获新的网络风险，并持续制定网络风险缓解计划。它还就公司如何向您通报其当前的网络风险态势以及对剩余业务风险的影响提供了指导。最后，它探讨了严重影响所有网络安全相关活动效率的结构性和运营性问题。


    - 确保资金决策是在咨询了负责控制措施所缓解的网络引发业务风险的经理后做出的。


    ## 建立机构网络风险预见


    ### 表格 12-1：业务变化的系统化捕获


    | 项目 | 内容 |

    | :--- | :--- |

    | 强化提问 1 | “公司拥有哪些流程和组织支持来捕获可能引入新网络风险的变化，包括：<br><ul><li>新的和更新的业务活动，<br><li>业务结构的变更，br><li>外部业务生态系统的变化，以及<br><li>因持续业务活动而产生的变化？”</ul>
    |

    | 原理 | 跟踪提问中识别出的变化类型，是识别计算机系统修改或增加（这些增加可能为贵公司的业务活动引入新的网络风险）最的方法。只有将这种变化捕获过程整合到公司的日常运营中，贵公司才能持续地管理网络风险。
    |

    | 证据 | <ul><li>针对提问中识别的所有类型变化的变更管理文档。文档应包含以下信息：<ul><li>网络审查的挂钩点和检查点</li><li>决定哪些变化需要进一步进行网络风险检查的（分诊）理由</li><li>网络风险缓解行动的跟进</li><li>分配的职责和所需的任能力</li></ul><li>与检测到网络安全相关变更并启动修复的案例相关的笔记、邮件往来等示例。</li></ul>
    |

    | 监督 | <ul><li>确认公司已有变更管理流程，并正在使用这些流程捕获与网络安全相关的变更，并在需要时启动网络风险修复行动。</li></ul> |


    ## 管理新网络风险


    贵公司理解和管理新网络风险所需的信息，与 `../Text/18_9781633698000_ch8.html` 中描述现有网络风险的信息相同。因此，您对公司管理新网络风险的监督将使用在
    `../Text/22_9781633698000_ch11.html` 中引入的相同备忘录。由于贵公司的许多新网络风险将与现有的业务活动和支持系统有关，未来可以使用之前的大部分分析和文档来理解新网络风险。


    ## 了解贵公司的当前网络风险态势


    ### 表格 12-2：控制性能测试


    | 项目 | 内容 |

    | :--- | :--- |

    | 强化提问 2 | “提供测试结果，量化控制措施在缓解其被选中时针对的网络风险方面的性能。” |

    | 原理 | 部署网络控制措施与获得其应提供的保护之间存在显著差异。通过这一提问，您帮助确保公司在网络控制方面投资的稳健性，以及这些控制措施保护贵公司的可靠性。
    |

    | 证据 | <ul><li>网络控制有效性测试的结果，包括对结果在防止业务风险发生方面的意义和影响的解释。控制措施不能被用于测试自身的有效性。</li></ul>
    |

    | 监督 | <ul><li>确认公司已完成测试和分析。</li><li>加深对不同网络控制措施与其对贵公司最重要业务风险的保护之间关系的理解。</li></ul>
    |


    ### 表格 12-3：网络风险缓解计划进度


    | 项目 | 内容 |

    | :--- | :--- |

    | 强化提问 3 | “提供网络风险缓解计划的当前状态更新。结合网络控制有效性测试的结果，描述公司关键业务活动面临的剩余网络风险。” |

    | 原理 | 这一提问为您提供了一个客观的方法，来衡量公司在缓解其面临的最重大网络风险方面的进展。结合上一个提问的定量控制测试结果以及之前建立的控制措施与其所保护的业务活动之间的关系，您就有了真正理解贵公司网络安全态势及其发展方向的基础。
    |

    | 证据 | <ul><li>网络风险缓解计划的状态报告。</li><li>结合上一个提问的结果，对风险提问 1（“关键业务活动与风险”）中识别的所有关键业务活动的当前剩余风险陈述，以及每个关键业务活动的剩余网络风险达到可接受水平的预计日期。</li></ul>
    |

    | 监督 | <ul><li>确认公司已制定状态报告且该报告是及时的。</li><li>这一提问进一步帮助您理解您和其他董事面临的最重要问题之一：“我们的公司受网络风险的保护情况如何？”</li></ul>
    |


    ## 优化网络安全效能


    ### 表格 12-4：网络安全小组位置


    | 项目 | 内容 |

    | :--- | :--- |

    | 强化提问 4 | “描述首席信息安全官 (CISO) 和网络安全小组在公司内部设置的理由。描述这种设置如何考虑与公司其他部分的整合、免受干扰并优化与董事会的沟通。”
    |

    | 原理 | 网络安全小组在公司内部的位置对于其成功起着很大作用。由于历史原因，网络安全小组通常设立在 IT 部门，尽管 CIO 和 CISO 之间存在内在的利益冲突。如果贵公司的网络安全小组位于
    IT 部门且目前无法移动小组，那么您需要确保公司正在管理这种利益冲突。这是一个治理问题，而非针对任何 CIO 的个人批评。 |

    | 证据 | <ul><li>网络安全小组在公司内部位置的理由。</li><li>公司为避免可能损害 CISO 效率的潜在利益冲突所采取的措施。</li></ul>
    |

    | 监督 | <ul><li>确认公司正在处理这种动态。</li></ul> |


    ### 表格 12-5：提高透明度


    | 项目 | 内容 |

    | :--- | :--- |

    | 强化提问 5 | “公司如何营造一种企业环境，使网络安全信息（尤其是负面信息）能够容易且快速地报告？” |

    | 原理 | 这一提问承认了许多员工不愿报告坏消息，尤其是当可能影响他们声誉时。它意识到贵公司防御网络攻击的能力很大程度上取决于负面消息的快速沟通，而非取决于宣扬成功。作为董事，您拥有独特的地位来影响公司文化，从而通过改进沟通直接提升网络安全态势。
    |

    | 证据 | <ul><li>关于沟通网络安全信息重要性的正式公司政策，强调对于那些非恶意行为可能导致网络安全问题的员工，不会产生惩罚性后果。</li></ul>
    |


