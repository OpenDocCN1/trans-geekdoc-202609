    \ || Through use of the aide-mémoire inquiries, you have ensured that your company\
    \ has already collected and analyzed much of the information executives will need\
    \ to draw on in order to provide company leadership in a cyber crisis.This inquiry\
    \ gives you assurance that your company has used this information to prepare executive\
