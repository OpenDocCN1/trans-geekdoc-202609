    在实际操作中，网络风险无非是导致业务风险变为现实的网络攻击。因此，确定网络风险优先级的过程实际上就是确定网络攻击优先级的过程。方便的是，贵公司进行这种优先级排序所需的所有信息都可以在网络威胁叙述（cyber
    threat narratives）中找到。


    在最基础的层，确定网络攻击优先级的标准是它们对公司造成损害的能力。因此，逻辑上的起点是网络威胁叙述的第一个元素，它描述了贵公司的关键活动及其所面临的固有业务风险。这回起了数字治理（digital
    stewardship）的第二个原则——“面临风险的是业务。所有与网络安全和网络风险相关的讨论和行动，都始于并结束于业务以及对其运营和战略方向的风险，而不是始于计算机及其漏洞。”


    在识别出这些关键业务活动和相关风险之后，优先级排序的下一步是确定哪些风险最容易受到网络攻击。其余三个网络威胁叙述元素为这种对影响和概率的检查提供了依据。在考虑支持系统（第二个元素）的情况下，第三元素识别了可能对关键业务活动产生影响的网络攻击、成功攻击的要求，以及产生影响的程度和范围。特别是，贵公司应该寻找那些产生的影响比其他原因可能更大的网络攻击，以及那些执行更简单的攻击。最后需要考虑的元素是潜在对手的动机和能力，因为网络攻击不会凭空发生。


    贵公司对网络攻击（因此是对网络风险）的优先级排序，不仅为选择应对这些攻击的控制措施奠定了基础，还为网络人员配置和技能开发提供了参考。通过对这一优先级排序过程的监督，你正在确保公司在网络安全上的资金投入直接与减少其最严重的网络和业务风险相关。


    你的监督责任是确保公司基于以下基础对网络攻击进行优先级排序：


    ![images](img/box.jpg) 它们对关键业务活动造成风险的能力


    ![images](img/box.jpg) 可能产生的影响范围


    ![images](img/box.jpg) 成功攻击所需的资源


    ![images](img/box.jpg) 潜在网络对手的动机和能力


    这一步的备忘录（aide-mémoire）是第 11 章中的风险查询 5。


    ### 选择控制措施


    在确定了要防御的网络攻击之后，下一步是为工作选择正确的工具。公司在网络威胁叙述中建立的网络攻击技术与业务活动支持系统漏洞之间的联系，为识别最合适的网络风险控制措施提供了基础。这些控制措施在逻辑上位于网络攻击和支持计算机系统之间。选择控制措施的一种方法是从优先级排序的网络攻击开始，选择能够缓解攻击的控制措施。网络安全标准，如
    `ISO/IEC 27002`，“信息技术——安全技术——信息安全控制实践规范”，是很有用的资源，因为它们描述了不同控制措施应对常见网络安全挑战的适用性。²⁷

