    Amid public furor in the wake of the breach, SingHealth’s board appointed an independent
    panel to examine the roles, responsibilities, and actions of staff involved, and
    to reprimand staff in the hope of “ensuring accountability” in the future.[^(17)](../Text/26_9781633698000_notes.html#ch9_rfn116)
    As is typical of public breaches of this scale, the company curtailed bonuses,
    fired technical and security staff, and demoted the `CISO`.


    In the end, both personal and organizational reputations were harmed, fines were
    incurred, executives were dragged through depositions and inquiries, and SingHealth
    was saddled with a five-hundred-page consent decree chock-full of technical requirements.
    SingHealth will be cleaning up for a long time.


    ### Accountability or Blame


    As the SingHealth breach illustrates, in the aftermath of a corporate cyber breach,
    there are intertwined calls for accountability and a search for someone to blame.
    Executive accountability takes a variety of forms ranging from angry stakeholders
    and legislators blaming the company to punishment through lost bonuses, executive
    positions, and board appointments. One of the motivations behind this approach
    to executives’ accountability is to encourage their greater cybersecurity commitment
    in the future, not only at the company affected, but also at the companies whose
    executives watch from the sidelines. In short, the public’s goal is to eliminate
    cyber breaches, and the approach is to hold executives’ feet to the fire. Given
    that the calls for accountability come from outside the company, executives are
    not in a position to fundamentally change them. They can, however, anticipate
    the situation and prepare themselves and their companies should a cyber crisis
    occur, as we describe in the next chapter.


    Leaders can decide, however, on their approach to cybersecurity accountability
    and blame within their companies. The choice is quite straightforward, even if
    it seems contradictory on the surface. They can either punish employees for their
    individual cybersecurity failures or have a company that is well protected from
    cyber threats. It is impossible to have both, because pursuit of the former guarantees
    that neither you nor executive leadership will get the information you need to
    accomplish the latter.


    The external inquiry into personal responsibility that the SingHealth board commissioned
    after its breach appears, on the surface, to be a responsible and needed action.
    We can imagine the boards of other breached companies might wish they had done
    the same. The fact that the inquiry commended several employees for their actions
    under pressure could be evidence of the inquiry’s objectiveness and fairness.


    Let us look at the consequences of any activity that places blame and the way
    it influences human behavior. We have seen many cases in which the fear of personal
    blame has resulted in staff keeping critical information about cyber risks and
    vulnerabilities from company leadership. Several years ago, we met with the China
    managing director for a European manufacturing company for whom we had previously
    undertaken a cybersecurity risk assessment. He said how happy he was that we hadn’t
    found any cybersecurity problems. We were taken aback because our report was far
    from a clean bill of health. The plant manager to whom we submitted our report
    had changed all of our findings to more-positive versions before passing it on
    to the managing director.


    Even the mistaken perception that they could be blamed can prompt some staff to
    put a somewhat misleading positive spin on their reports. For example, the `CISO`
    and `CIO` for a large multinational company hired a cybersecurity vendor to conduct
    a penetration test of their network cybersecurity defenses, including the third-party
    security monitoring service they retained. To make this activity more realistic,
    they didn’t tell any of their staff that this exercise was taking place.


    Depending on your perspective, the penetration test was either an absolute success
    or a complete failure: the vendor was able to penetrate the core of the systems
    without being detected. Even when the `CISO` and `CIO` convened a series of meetings
    to examine the failures, create a plan, and begin to execute the plan. Up to this
    point, everything the `CISO` and `CIO` had done was textbook.


    However, as the briefing made its way through the organization to the board, the
    primary takeaway was that the results were different from what he had been led
    to believe. When we shared the backstory with the chairman that received the briefing,
    he was surprised to find why anyone felt the need to misrepresent the results.
    Telling him that the company had tested its defenses, found them lacking, and
    was already in the process of remediation was a full answer.


    Fear of being a scapegoat closely follows the fear of being blamed and further
    discourages openness. Shortly after the start of our debit card fraud investigation
    at the Southeast Asian bank, one of the bank’s executives said he wanted to see
    “blood on the floor,” a sentiment he shared widely within the bank. One of the
    immediate results we noticed was that IT staff began lying to us. Even given the
    vagaries introduced by translation from Bahasa Indonesian to English, it was clear
    they had changed their stories from earlier. Eventually they admitted that their
    manager had instructed them to lie to us because he was afraid that it would be
    his blood on the floor. His fear was ultimately unfounded, as he kept his job.
    The executive, on the other hand, did not.


    ### Shooting the Messenger


    In the 1972 Academy Award–winning movie *The Godfather*, Tom Hayden, the lawyer
    for the titular character, makes a business proposal that is rejected. Hayden
    immediately excuses himself and states, “Mr. Corleone is a man who insists on
    hearing bad news.” In this regard, the fictional Don Corleone is quite rare. The
    reason the expression “Don’t shoot the messenger” exists is because this positive
    attitude toward receiving bad news is uncommon.


    Over thousand years ago, Tigranes, the king of Armenia, was engaged in wars against
    the Roman Empire. When one of his messengers told Tigranes that the Roman general
    Lucullus was fast approaching, Tigranes was so displeased that he had the messenger’s
    head cut off.[^(18)](../Text/26_9781633698000_notes.html#ch9_rfn117) And with
    that head, communications from the front line were cut off, and the Romans roundly
    defeated Tigranes’s significantly larger forces.[^(19)](../Text/26_9781633698000_notes.html#ch9_rfn118)
    The fear of a superior’s reaction strongly motivates people to hold back some
    or all of the truth. One study found that 60 percent of IT staff do not report
    cybersecurity risks until they are urgent—and therefore more difficult to mitigate—and
    acknowledged that they omit negative details if they can.[^(20)](../Text/26_9781633698000_notes.html#ch9_rfn119)

    '
