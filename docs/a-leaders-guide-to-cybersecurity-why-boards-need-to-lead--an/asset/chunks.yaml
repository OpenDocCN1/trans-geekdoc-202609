    The cyberattack used the very systems designed for the proper management of pumping
    stations to cause them to malfunction. This attack involved two components: setting
    up a network connection to the control systems in individual pumping stations,
    and then manipulating the control systems both to cause local damage and to take
    over the central operations management system. In order to execute the cyberattack,
    the disgruntled ex-employee only needed to exploit two cybersecurity vulnerabilities.
    The first vulnerability was that a password wasn’t required to log on to a pumping
    station’s control equipment. The second was that the radio frequency used to communicate
    with the control equipment was easily available via company documentation. While
    the former employee needed to be within radio range, he did not need to physically
    break into a pumping station.


    Although the attacker’s insider status contributed to his success, the resources
    for pulling off similar attacks, once the sole province of employees and contractors,
    are now available to anyone with an internet connection. With a small bit of web
    searching, one can download communication protocols, product documentation, programming
    instructions, and software for the same equipment used in the pumping stations.
    In online forums, experts gladly answer questions and offer advice on the use
    of these kinds of equipment. Name-brand online retailers and auction sites have
    a healthy aftermarket for test kits and hardware, so attackers can plan and test
    their attacks from the comfort of their home or office anywhere in the world.


    The scary thing is that the cyberattack could have been much worse. Technically,
    the attacker could have stopped all the pumping stations and flooded the community
    with raw sewage, which would have created a bigger catastrophe. The scale of the
    impact was much worse, and much less expensive, than could have been achieved
    by a noncyber cause, such as blowing up a pumping station.


    The Maroochy Water Systems case offers several lessons (see [table 8-2](#18_9781633698000_ch8.html#tab8-2)).
    One is the importance of understanding how a cyberattack can compromise the vulnerabilities
    in systems. The other is deciding on the right controls to thwart an attack. In
    this case, only two controls were needed: requiring passwords to log in to control
    equipment and encrypting radio communications. In contrast, since the perpetrator
    didn’t use malicious software, common controls such as antivirus products or anti-phishing
    training would have offered no protection. Further, as you can see, the explanation
    of the technical mechanics of this cyberattack and the mitigating controls is
    easy to understand and is an example of the types of cyber risk descriptions your
    company should provide you.


    #### TABLE 8-2

    Four elements of cyber threat narrative at Maroochy Shire


    | Element | Maroochy Shire example |

    | --- | --- |

    | Critical business activity and risks | Activity: Wastewater treatment Risk:
    Pumping station malfunction |

    | Supporting systems | Centralized operations management system Pumping station
    control equipment |

    | Cyberattacks and consequences | Exploitation of insecure network communications
    and lack of user authentication on pumping station control equipment Massive release
    of raw sewage |

    | Cyber adversary | Disgruntled former employee |


    Another lesson, as you go through the process of identifying cyber risks, is the
    importance of looking for cybersecurity design flaws. The lack of authentication
    for the control system and encryption of radio communication were technical flaws
    in the design of the control systems. The root causes of the debit card fraud
    we mentioned earlier were technical design flaws in the protocols for authorizing
    purchases and procedural design flaws in the timing of paying merchants and challenging
    charges. Only by identifying cyber risks in the context of a business activity
    can a company find these vulnerabilities.


    ### Cyber Threat Narratives Focus Company Cybersecurity Activities


    The use of cyber threat narratives as the framework for understanding your company’s
    most significant cyber risks supports digital stewardship and effective corporate
    cyber risk management by:


    *   **Changing the conversation.** The identification and prioritization of cyber
    risks shifts the conversation from a technical discussion to one firmly grounded
    in protecting your company’s most important business activities and operations.
    Company leadership and management can participate in this process, and you and
    other board members can lead it.

    *   **Putting technical information in context.** The ways in which your company
    collects, analyzes, and organizes technical information relating to cyberattack
    techniques, computer vulnerabilities, and computing infrastructure all contribute
    to developing the necessary knowledge for protecting the business activities leadership
    has prioritized.

    *   **Providing a practical approach.** Your company needs to define information
    collection, analysis, and decision-making activities, and identify the types of
    staff who are best suited for each task. In all likelihood, your company already
    undertakes many of these tasks so it can easily develop cyber threat narratives
    by coordinating existing activities and using data already collected.

    *   **Fostering collaboration and consensus.** The process of cyber threat narrative
    development provides a formal structure for contributions and collaboration across
    a wide range of staff from executive leadership and cybersecurity specialists
    to those involved in the day-to-day conduct of business activities and those who
    manage the supporting computer systems. This promotes consensus around cyber risk
    priorities and the activities your company needs to undertake to address them.

    *   **Unifying cyber- and business-risk-related information.** Cyber threat narratives
    contain a unified collection of information that establishes the relationship
    between cyberattacks and their potential risks to critical business activities.
    Groups and individuals within your company will use different slices of this information
    according to their roles and responsibilities. The thread that runs through all
    this information helps unify the entire company in identifying, prioritizing,
    and managing its most critical cyber risks.

    *   **Forming the foundation for all digital stewardship duties.** The organization
    and presentation of cyber risks in the larger context of business risks builds
    the foundation for your company’s cybersecurity-related activities. This includes
    the cyber risk management activities we address later in this chapter, as well
    as building corporate resiliency in the face of cyber-induced crises, which we
    address in the following chapter. Casting cyber risks in the context of business
    risks further informs organizational structure and corporate culture issues that
    directly influence your company’s cyber risk management capability.

    *   **Facilitating board engagement and oversight.** Your responsibilities are
    clear at every stage of narrative development. So are the assurances you need
    from the company you oversee in terms of the cyber-risk-related activities it
    has undertaken, topics it has addressed, people it has involved, and the documentation
    it has delivered.


    ### Mitigate Attacks


    From an oversight perspective, your responsibilities relating to cyber risk mitigation
    are to ensure that your company:


    *   Prioritizes cyber risks based on the impact their corresponding cyberattacks
    could inflict on your company’s most critical business activities

    *   Selects controls based on the prioritized cyber risks they can effectively
    mitigate

    *   Examines control effectiveness

    *   Develops cyber risk remediation plans that directly connect controls to the
    business activities they protect.


    #### Prioritizing Cyberattacks

