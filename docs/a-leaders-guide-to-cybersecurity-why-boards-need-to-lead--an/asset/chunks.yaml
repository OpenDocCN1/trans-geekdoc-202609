    Sometimes a company’s industry or the way in which it conducts business could
    motivate someone to mount an attack against it. For example, environmental groups
    might target companies with a bad record for polluting. Edward Snowden, a former
    NSA contractor, stole information from the NSA to expose surveillance programs
    that it publicly denied.[^(15)](../Text/26_9781633698000_notes.html#ch8_rfn81)
    In another case, the group Anonymous mounted cyberattacks against five oil companies—Shell,
    BP, Exxon, Gazprom, and Rosneft. The group held these companies responsible for
    what it thought was harmful action in the Arctic.[^(16)](../Text/26_9781633698000_notes.html#ch8_rfn82)
    Company activities, such as layoffs or plant closures, can also motivate employees
    to misuse their computer privileges as a means of retaliation.


    For another perspective, look beyond your company to the broader commercial and
    political world in which it operates. For instance, if as suspected, Russia was
    behind the cyberattacks on power plants in Ivano-Frankivsk in 2015, the motivations
    for the attacks likely had nothing to do with the power companies themselves.
    The companies were probably targeted simply because they are located in the Ukraine,
    a country with which Russia has a hostile relationship.


    Senior executives are well positioned to identify entities that may want to attack
    the company. But there will be surprises. The WannaCry attack had an impact on
    a wide variety of companies worldwide, and the only thing connecting the victims
    was the fact that they hadn’t patched their systems. And there will always be
    random individuals with a personal agenda to pursue or reputation to enhance.


    From an oversight perspective, your job is to ensure that your company:


    ![images](Images/box.jpg)   Identifies likely cyber adversaries, their capabilities,
    and motivations—and the characteristics that make your company a target'
