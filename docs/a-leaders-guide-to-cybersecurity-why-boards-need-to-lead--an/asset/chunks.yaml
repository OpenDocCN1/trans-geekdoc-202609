    In most companies, people broadly agree that cybersecurity is a high priority.
    They share a similarly broad perception, though, that the cybersecurity or IT
    department is responsible for protecting the company from cyberattacks. The common
    metrics that measure cybersecurity spending as a percentage of overall IT budget
    provide evidence. Employees share a related perception that their cybersecurity
    responsibilities end with choosing strong passwords and then not writing them
    down. They don’t see cybersecurity as part of their job description. Backing up
    this view is the idea that cybersecurity is so complicated that laypeople are
    simply incapable of making any meaningful contribution to their company’s defenses.
    Cybersecurity, they think, is a matter best left to the experts.


    ## Consequences


    Isolating the cybersecurity or IT security functions within a company results
    in the same negative consequences as focusing on protecting computers instead
    of the business activities they support and automate. The Asian automobile company
    we referenced in [chapter 2](../Text/10_9781633698000_ch2.html) provides a case
    in point. The decision of the IT department to put the R&D network inside the
    corporate intranet, as well the employees’ creation of fake employee accounts
    for contractors to access the intranet, were made without any communications between
    the R&D and IT security departments because there were no organizational or operational
    connections between the two groups.


    The initial breach that resulted in the billion-dollar loss was not the work of
    a nation-state or an organized crime group or even a lone-wolf criminal. It was
    the work of someone in the marketing department who had no cyber hacking skills
    at all. What the marketing staffer did have was authorized access to the R&D information,
    and she used that access to download the files and take them out of the company.
    At the time, many products could have prevented the theft and corresponding financial
    loss. However, just as with the R&D department, there was no organizational cybersecurity
    connection. Further, members of the IT security group, located in California,
    and the marketing department, located in Asia, quite literally didn’t speak the
    same language.


    Organizational and operational isolation of cybersecurity capabilities within
    a company has a profoundly negative impact on cyber protections. Business groups
    often assume the cybersecurity group is already addressing the cybersecurity risks
    arising from their activities, so it’s not their concern. This in turn means missed
    opportunities for the cybersecurity group to engage with the business groups.


    ## Path Forward


    A dedicated cybersecurity group is clearly of value. Any company with a board
    of directors would be remiss not to have one. However, unless this specialized
    group of cyber experts understands the business and its goals, and the organization
    uses that knowledge throughout, its actions will be like the proverbial tree that
    falls silently in a forest because no one hears it.


    There are several approaches to ensuring that the cybersecurity expertise in your
    company has an impact, and makes a noise, one of which is organizational:


    *   Place the cybersecurity group within a line function, particularly one with
    significant cyber risks, as opposed to a staff function, such as IT.

    *   Embed cybersecurity staff within business units.

    *   Develop in-house cybersecurity expertise within the business units at greatest
    risk.


    Moving members of the cybersecurity team inside some business units might not
    be feasible in the near term. In any event, formal processes ensuring that cybersecurity
    review and input are provided—and acted upon—at critical junctures within business
    activities are a powerful tool. These reviews, described in [chapter 9](../Text/19_9781633698000_ch9.html),
    should center on detection of changes that can introduce new cyber risks. Such
    potentially risky changes include:


    *   The development of a new product or service

    *   Reorganizations resulting from a merger, acquisition, or establishment of
    a joint venture

    *   Technological upgrades, such as moving a business function to the cloud


    # 7


    # Engage Motivation


    *Understand and align the interests and motivations of staff and departments to
    incentivize behavior that leads to accomplishing cybersecurity goals.*


    ## Current Situation


    Motivating employees, often through financial incentives, is a common practice.
    But motivation is seldom considered in the context of cybersecurity. The effectiveness
    of cybersecurity activities is often undercut because companies don’t reward positive
    behavior. Worse, by offering well-intentioned incentives such as bonuses for meeting
    delivery deadlines, companies can actually discourage good cybersecurity work.
    If companies incentivize employees to meet aggressive deadlines, they’re sure
    to reduce or curtail cybersecurity. Steven Kerr, former head of learning and leadership
    development at General Electric and Goldman Sachs, wrote more broadly about this
    dynamic in his article “On the Folly of Rewarding A, While Hoping for B.”[¹](../Text/26_9781633698000_notes.html#ch7_rfn66)
    This dynamic plays out through entire companies, including both staff with dedicated
    cybersecurity responsibilities and employees for whom cybersecurity tasks are
    just a part of their overall jobs.


    Knowing what behavior to incentivize is another challenge. Executives have extensive
    experience in motivating employee performance when the deliverables are clear
    and concrete, such as meeting a sales quota. Incentivizing cybersecurity results,
    such as successful defense against cyberattacks, is more complicated because it
    is difficult to account for all the activities and decisions that could have taken
    place much earlier, on someone else’s watch, that shaped the outcome. Further,
    should you reward employees for sound cybersecurity practices or is this just
    part of their job? Doctors, for example, don’t receive bonuses for not killing
    patients, and pilots are not paid extra for landing a plane safely.


    ## Consequences


    A US-headquartered, global financial services firm provides an example of how
    the personal motivations and interests of individual IT staff rendered the firm’s
    firewalls largely ineffective. Firewalls are designed to block connections from
    the internet that a hacker could use to attack computers within the corporate
    network, while at the same time permitting legitimate connections to business
    applications, such as customer self-service. IT staff people accomplish this by
    writing firewall rules that state what communications are or not permitted. Since
    business applications come and go over time, IT staff need to review and update
    the rules. When we asked the IT staff at the financial services firm how frequently
    they reviewed and updated firewall rules, they said, “Never.” Further into the
    conversation, the reason became clear. If the company experienced a cyberattack,
    in part because of faulty firewall rules, it would not blame the IT staff personally,
    especially if it suspected a nation-state was behind the attack. If, however,
    the staff updated the firewall rules and accidentally blocked access to a business
    application, they would suffer immediate consequences and would need to remedy
    the situation as quickly as possible.

