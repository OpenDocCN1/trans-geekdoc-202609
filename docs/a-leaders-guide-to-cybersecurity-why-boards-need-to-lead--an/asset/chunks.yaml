  trans: '


    针对网络攻击的技术响应需要经过良好培训的团队、响应程序以及实践演练。鉴于贵公司此前识别过相关的网络攻击，你们已经清楚这些准备工作的重点应放在哪里。


    贵公司的高管承担着与受影响方、媒体和政府机构进行沟通的首要责任。这些利益者中的每个人的优先事项都不同，从归咎责任到寻求赔偿或援助不等。由于此前已开发了网络风险修复计划并对后果进行了分析，贵公司可以为高管可能需要说的内容以及公司需要采取的行动做好充分准备。如果网络危机的性质需要你直接参与，可以使用高管层准备的活动和材料。在深入准备工作之前，回顾一下网络攻击和危机的的一些独特特征将有裨益。


    ## 网络攻击的特征


    危机的本质特征是不确定性、信息不完整，以及限制领导者采取行动和进行沟通的外部力量。即使贵公司擅长处理危机管理并习惯于处理危机，领导者仍需从网络安全的视角来应对危机管理中的三个核心挑战——危机范围、可见性缺失以及公众认知。


    ### 危机范围


    在任何危机中，确定损害范围（特别是在初期阶段）都是挑战性的。但网络危机有一个使其与众不同的特征。网络攻击所造成的地理和组织范围内的损害可能远超其他类型的危机。社会动荡和暴乱可能会关闭世界上某一个地区的办公室或工厂，但它不会对该地区之外的公司设施和运营产生影响。`TJX`
    信用卡案例展示了始于某地的网络攻击如何迅速扩展到全球。黑客可以在如此广泛的地理规模上发动攻击，这一事实提醒人们，管理层对网络攻击引发的危机的响应可能需要处理比公司习惯的范围广得多的司法管辖区内的利益相关者问题。


    预测网络危机将持续多久也极其困难。由于在地理范围和损害规模方面缺乏典型的限制，确定损害的全范围并开展所有必要的修复活动可能需要很长时间。


    ### 可见性缺失


    由于几个原因，网络攻击很难被检测。首先，它们缺乏物理攻击的可见性。从工厂车间偷盗设备是显而易见且会被很快发现的。窃取控制设备的软件则并不明显。


    网络攻击的开始可能在很一段时间内不被发现。最近的分析显示，从入侵到检测之间的平均时间（通常被称为“停留时间”或“识别时间”）在 101 到 197 天之间。[¹¹]](../Text/26_9781633698000_notes.html#ch10_rfn123)
    为什么？公司没有在寻找网络攻击的信号，或者查看了太多信号，又在寻找错误的信号。此外，即使发出了警报，也并不总是清楚计算机故障是网络攻击的结果，还是仅仅是软件错误或管理员失误的结果。


    此外，确定网络攻击背后的幕后黑手是出了名的难题，因为攻击者可以伪造所有用于识别他们的迹象。这些迹象包括他们的位置、在编写恶意软件的计算机上使用的语言，以及他们所在的时区。几十年来，黑客通常首先控制世界另一部分的某计算机，然后从那里发起攻击，以此扰乱调查者的视线。鉴于`第
    2 章`中描述的黑客工具和专业知识的丰富市场](../Text/10_9781633698000_ch2.html)，找到一个能够用不同语言进行阅读和编程的恶意软件专家并不困难。那种认为黑客只想在工作时间内管理和更新其网络攻击的假设，并没有考虑到网络敌手的奉献精神，或者计算机程序员的工作和睡眠习惯。


    ### 国家级归因


    许多国家正在开发网络攻击能力，要么是自主研发（如`美国网络司令部`），要么是通过向位于米兰的 `Hacking Team` 等公司购买工具。²² 某些国家有动机利用这些能力对个人公司发动网络攻击。


    成为广泛报道的网络攻击受害的公司可能会声称某个国家是攻击的幕后黑手，以此来推卸责任。毕竟，任何公司又如何能防御如此强大的对手呢？


    政府机构和网络安全供应商可以通过强调其服务和产品的必要性，从归因于国家的网络攻击中获益。


    对直接财务损失的担忧也发挥着作用，不断演变的网络保险市场证明了这一点。在 `NotPetya` 攻击之后，零食制造商`玛氏国际`（Mondelēz International）向`瑞瑞美国保险`（Zurich
    American Insurance）提出了其网络保险单的理赔申请。`瑞瑞`拒绝了理赔，理由是对于任何政府敌对行动造成的损失有免责条款。³³


    ### 公众认知


    许多人在甚至读完关于网络攻击的新闻标题之前，就急于归罪于公司，而不是黑客。公司承担了过去对那些准备不当的被黑公司的积怨。


    这正确吗？指责遭受网络犯罪的受害者似乎类似于指责一个穿得体面的人被抢劫，但存在显著区别。在抢劫案中，只有他一个人受到伤害。而在网络的情况下，正如 `Equifax`
    漏洞事件所示（这增加了 1.4 亿人的身份盗用风险），个人即使与被黑的公司没有业务关系也会受到影响。


    人们倾向于认为公司对入侵的真实性质和范围撒谎。公司自身对问题的可见性缺失，以及领导层对于应该以及何时披露信息的困惑，加剧了这种不信任。如果高管在信息公开之前利用这些信息获取个人利益（例如在漏洞公布前出售
    `Equifax` 的股票），这种不信任会进一步强化。⁴⁴


    ## 网络事件响应


    响应网络攻击（通常被称为网络事件响应）需要技术网络安全技能以及跨企业组织和协调团队的经验。具体的网络安全技能取决于网络攻击本身的性质。


    不要让网络事件的技术性质阻碍你。通过询问选定的非技术问题，你可以获得对公司准备情况的极大信心。确保贵公司准备好响应网络攻击需要确保公司：


    - 组建了具备响应重大网络攻击所需技能和经验的团队

    - 开发了网络事件响应程序，并包含了对最重大类型攻击的具体细节

    - 定期进行演练以测试公司的响应能力并识别需要增加关注的领域


    ### 人员到位


