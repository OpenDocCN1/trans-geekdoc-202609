    军事和情报部门长期以来关注信息的完整性；关于该主题的正式网络安全工作于 1975 年发布。[⁵随着业务活动自动化程度的不断提高，商业企业也应该关注完整性。


    ## 支持系统


    网络攻击的目标是支持业务活动的一个或多个计算机系统。因此，为了建立网络防御，你的公司需要识别这些计算机系统以及它们提供的服务和功能。


    运营人员应该启动发现过程，因为他们熟悉自己使用的计算机系统和应用程序，并且了解这些系统发生故障或停止运行的后果。系统人员维护计算机系统并了解其职责的全范围（包括运营人员不可见的功能），他们也应该协助这一过程。通常，IT
    人员在通用计算机上担任此类系统角色，而工程师在工业控制系统环境中担任该角色。


    鉴于计算机系统和网络的复杂性，所有支持关键业务活动的计算机系统都必须进行清点。清单必须包含系统的物理位置，以便网络事件响应人员在发生网络攻击时知道需要去哪里修复问题。


    你对这一步骤的监督责任是获得以下保证：


    ![images](img/box.jpg) 你的公司拥有其关键业务活动依赖的计算机系统的最新清单


    这一步骤的备忘录是第 11 章中的风险查询 2。


    ## 网络攻击与后果


    ### 网络攻击


    网络威胁叙述的下一个要素是识别并刻画可能导致业务风险的不同类型的网络攻击。这涉及检查成功攻击的方法和要求。


    在最基础的层，网络攻击利用各种被称为“威胁向量”的技术来利用计算机系统中的漏洞。作为首要调查工作，网络安全人员需要将网络攻击技术与支持计算机系统中的固有漏洞关联起来。例如，在
    WannaCry 事件中，网络攻击技术包括利用微软应用程序中安全编程错误的恶意软件。而其固有漏洞是运行了具有安全相关编程错误的应用程序。


    攻击并不总是尖端的或在技术上复杂的。例如，所有计算机共有的一个漏洞是管理员对其中的信息和应用程序几乎完全的控制权。这种权力对于适当的操作和维护是必要的，但管理员可以滥用它。在这种情况下，攻击技术仅仅是管理员决定误用她的权力。


    在制造中断的示例中，攻击者可以采取两种基本方法来破坏机器人的软件指令。一种是使用机器人内部的功能获得对过程的控制权以上传指令。根据机器人的设计，这可能需要也可能不需要密码或特殊权限。或者，攻击者可以使用恶意软件利用机器人自身底层计算机系统的漏洞，并绕过所有对上传指令的限制。在这两种情况下，攻击者都将通过网络连接到机器人，或者通过插入
    USB 或设备连接到机器人。


    ### 影响范围


    网络攻击不受地理位置限制。攻击可以源于任何地方，并迅速扩散到整个企业。例如，一家拥有 2000 家门店的跨国零售商被盗取了 9400 万信用卡[⁶对导致此类停电的黑客工具的近期分析显示，它可以用于更大规模。[⁸导致后果远超其他原因的最相关原因是，攻击背后有一个攻击者。


    ### 攻击要求


    并不是所有的网络攻击都是平等的。也不是所有攻击都同样容易实施。为了了解你和公司应该担心的网络攻击类型，你必须确保你的公司理解攻击者发起成功网络攻击需要什么。三种网络攻击的前提条件是：


    1. **知识**：涵盖攻击者需要知道的内容；从编写恶意软件到管理用于运行水电坝的系统不等。

    2. **工具和设备**：不仅包括黑客工具，还包括笔记本电脑和无线电发射器等设备。

    3. **位置**：攻击者所在的位置，可以是地理上的（例如，地图上的某点）或组织上的（例如，员工或承包商）。


    在我们东南亚某银行调查的借记卡欺诈案中，所需的知识包括 Visa 和 Mastercard 授权码的格式以及如何配置信用卡终端。工具包括几台终端，以及一个借记卡账户号码数据库。攻击者必须位于当地范围内，以便与参与欺诈的商户进行协调，但他们并不一定需要在银行工作。


