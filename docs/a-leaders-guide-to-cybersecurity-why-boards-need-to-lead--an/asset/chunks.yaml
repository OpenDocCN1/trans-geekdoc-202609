    While a company should not neglect preventative and defensive measures, it needs
    to be ready for a cyberattack-induced crisis. This readiness entails prior planning,
    preparation, and coordination in two distinct but related areas. First, a company
    needs the capacity to recognize and respond to cyberattacks, which includes a
    skilled cyber response team and the procedures it should follow. Second, the executive
    team must prepare to lead the company during a cyber crisis, which includes how
    to treat the situations it will face and what decisions it will make during a
    crisis. By using information and materials already developed in the process of
    cyber risk mitigation, executives can think about their course of action before
    a cyber crisis hits.


    ## Aide-Mémoires


    Each of the aide-mémoires in the book has four components. The first part is an
    inquiry relating to one aspect of your company’s cybersecurity responsibilities.
    We have drafted the inquiries so you can use them directly as written. The second
    component gives a brief rationale of the inquiry in terms of your company’s cyber
    defenses and cyber risk management activities. The next component gives examples
    and descriptions of the types of evidence that respond to the inquiry. The final
    component describes the actions you should take to fulfill your oversight responsibilities
    relating to the inquiry. Use of the aide-mémoires does not require that you have
    any prior cybersecurity or technical experience. Further, the aides are effectively
    key performance indicators for your company’s management of cybersecurity and
    cyber risk.


    ## Guide to the Book


    We have written this book specifically to provide counsel and assistance to you,
    a board member, in fulfilling your cybersecurity governance oversight responsibilities.
    Given that fulfilling these responsibilities requires your company’s input and
    action, we provide guidance to executive leadership and cybersecurity management
    both on the cyber protection of their companies and on fulfilling their own responsibilities
    to you and the board. While specifically addressing corporate boards of directors,
    the principles and practical guidance we offer here also apply to other types
    of organizations, including governmental agencies and nonprofits.


    The book is divided into four major parts, each contributing to your understanding
    of cybersecurity in the context of your board oversight responsibilities.


    - The first part, “The Problems,” lays bare many of the reasons cybersecurity
    activities don’t deliver on their promises and cybersecurity appears so impenetrable.
    These insights equip you to critically question the rationales for the cybersecurity
    decisions your company makes.

    - The next part includes the four principles of digital stewardship, which are
    a shorthand guide for all your cybersecurity decisions, especially as you face
    new and unexpected issues.

    - The third part addresses three foundational cybersecurity responsibilities that
    your company needs to fulfill and you must oversee. Each responsibility addresses
    the critical and often overlooked factors necessary for success.

    - The final part, the aide-mémoires, includes detailed inquiries you can use to
    gain the necessary assurance that your company is meeting its responsibilities.


    Throughout the book, we use examples from the public domain and our own practice
    to illustrate the application of digital stewardship principles and practices
    in real life, and some of the consequences when they were not applied.


    # PART ONE


    # The Problems


    ## Let’s start with two questions:


    - Have you ever felt that some of the information you’ve been told about cybersecurity
    and cyber risk didn’t ring true, but you weren’t sure how to articulate this doubt?

    - Have you ever suspected that discussions about cybersecurity are more complicated
    than they need to be?


    If so, your intuition is correct. A significant disparity exists between what
    appears to be true in the area of cybersecurity and what really is. Before addressing
    digital stewardship principles and responsibilities, we will pull back the curtain
    on some of the misleading platitudes, hidden dynamics, and misguided voices that
    give rise to your suspicions and make addressing cybersecurity harder than it
    must be.


    # 1


    # Misleading Platitudes


    Cybersecurity discourse is full of platitudes that seem obvious and compelling
    at first, but more thoughtful consideration shows they are misinformed, ineffectual,
    or counterproductive. Unfortunately, people repeat these platitudes so frequently
    they take on the patina of truth and distort perceptions about cybersecurity priorities
    and courses of action. Three such staples of cybersecurity conventional wisdom—“it’s
    a people problem,” “protect the crown jewels,” and “cyber threats are new and
    constantly changing”—are especially troubling.


    ## It’s a People Problem


    “Cybersecurity is a people problem, not a technology problem.” This platitude
    often takes another form: “People are the weakest link.” While people do make
    mistakes, such as losing `USB` drives and opening malicious email attachments,
    we don’t believe the problem lies with careless employees; rather, the problem
    rests on cybersecurity staff who fail to address how people behave in the digital
    world and whose motivations and incentives poorly influence their approaches to
    protection.


    To provide context, compare how we address the people problem when securing the
    physical world versus the digital world. In the physical world, we understand
    that certain environments and situations have a higher level of inherent risk,
    and that people are not always careful when navigating these risks. To compensate,
    we build in protections to help mitigate the potential harm. These include, for
    example, putting guardrails on highways and speed bumps in front of schools. We
    take human behavior into account and don’t blame people for, well, being human.
    We don’t think or expect people will act differently just because we tell them
    to. The situation is radically different in the digital world, where we seldom
    protect people from making understandable mistakes. Instead, we blame them when
    they err and recommend more security awareness training as the solution.


    ### Losing USBs


    In 2007 and 2008, there were nine incidents in which personal and medical digital
    information on sixteen thousand Hong Kong residents was accidentally lost. As
    a result, the Hong Kong Hospital Authority hired us to be part of a task force
    on patient data security and privacy. Our goal was to understand the root causes
    for the breaches and recommend security improvements.[¹](../Text/26_9781633698000_notes.html#ch1_rfn5)


    One incident involved a clerical staff member at the Prince of Wales Hospital
    in Hong Kong’s New Territories who lost a `USB` flash drive in a taxi. It would
    be easy to jump to the conclusion that the staff member’s lack of security awareness
    was the root cause of the incident, just as, in the beginning of a movie or TV
    show, we might assume that the gun-wielding person standing over a dead body is
    the murderer.


    But we asked only two questions to find out the real root cause: “What do you
    do at work?” The clerk prepared spreadsheets for interhospital, cross-charge billing
    for pathology tests performed at Prince of Wales Hospital. “Why did you copy this
    information onto a `USB` drive?” The reason wasn’t sinister but, instead, a practical
    frustration many people who work at large companies might face. She didn’t have
    `Excel` installed on her computer, so she used a `USB` drive to copy the spreadsheets
    she got from other hospitals to a colleague’s computer that did have `Excel` so
    she could do her work. To no avail, she had repeatedly asked IT to install `Excel`
    on her computer.

