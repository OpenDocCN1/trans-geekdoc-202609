  raw: 'When you engage in cybersecurity, one of your first areas of interest is understanding
    how well your company is protected against cyberattack. Questions such as “How
    safe are we?” “Are we doing the right things?” “Are we doing enough?” are typical.
    In lieu of undertaking business-oriented cyber-risk assessments—which we will
    discuss later in the book—to answer these questions, companies often use compliance
    with cybersecurity standards to judge their level of protectiveness and to prioritize
    future investments. Although cybersecurity standards can provide you with useful
    ideas on common issues, in order to derive value from these standards, you need
    to understand their purpose, limits, and the unintended consequences of having
    to comply with multiple standards and regulations.


    ### Inherent Limitations of Standards


    #### Apply to All and None


    Cybersecurity standards, by design, address broad audiences. One metric of a standard’s
    success is the scale of its adoption. However, in attempting to speak to everyone,
    cybersecurity standards address the needs of no one specifically. The NIST Framework
    for Improving Critical Infrastructure Cybersecurity (commonly referred to as the
    NIST Framework) was originally developed to help reduce cyber risks to critical
    infrastructure.[¹](../Text/26_9781633698000_notes.html#ch2_rfn19) However, the
    introduction to the framework clearly states that any company or organization
    can use the standard, and companies in industries as varied as retail and hospitality
    are increasingly adopting it. The cybersecurity priorities for a nuclear power
    plant are clearly different from those of a department store or hotel. No standard,
    regardless of how well drafted, can provide specific guidance to such a disparate
    collection of organizations.


    Even having a cybersecurity standard issued by your own industry association doesn’t
    guarantee that it provides helpful and specific guidance pertaining to your industry.
    For example, the American Chemistry Council published its “Implementation Guide
    for Responsible Care Security Code of Management Practices.”[²](../Text/26_9781633698000_notes.html#ch2_rfn20)
    While arguably this guide provides helpful advice on cybersecurity management
    practices, there is nothing that specifically addresses the unique cybersecurity
    challenges within the industrial control systems that drive chemical manufacturing.
    It is sufficiently generic that it applies equally to the IT systems within the
    corporate front office of a chemical company and to the manufacturing systems
    for which it was written.


    To address the lack of standards, many companies develop their own policies. This
    is a smart move, but you need to make sure that your own standards, unlike industry
    and external standards, are specific to your business. And you need to keep up
    with growth. If you acquire companies and build new products, your cybersecurity
    approaches will need to change. For example, a financial services client developed
    its cybersecurity standard when it relied on the computing power of scores of
    mainframes housed in its own data centers. This served it well for a long time.
    However, as market conditions evolved, its services changed, as did its method
    of delivery. Its standard became increasingly irrelevant.


    This irrelevance became particularly important when the firm bought an Indian
    company whose transaction processing was hosted by a cloud provider. The first
    issue was that the existing cybersecurity standard couldn’t give any guidance
    on what it should do to protect itself from the cyber risks faced. The second
    was that it was perennially noncompliant with the corporate standard and management
    had to spend significant and unproductive time dealing with the inevitable audit
    findings.


    #### Always Out-of-Date


    Cybersecurity standards are always out-of-date. For example, one of the best-known
    international cybersecurity standards, ISO 27001, was first published in 2005.[³](../Text/26_9781633698000_notes.html#ch2_rfn21)
    It took eight years for a revision. In 2018, the North American Electric Reliability
    Corporation promulgated its Critical Infrastructure Protection (CIP) standard,
    version 5. This standard replaces its urgent action standard 1200 that was first
    approved fifteen years earlier, in 2003.[⁴](../Text/26_9781633698000_notes.html#ch2_rfn22)


    The issue is not that the standards can’t keep up with rapidly changing cyber
    threats. In [chapter 1](../Text/09_9781633698000_ch1.html), we explained how this
    rapid change is overstated. The issue is that the standards can’t keep up with
    the rapid pace of business. Changes in business operations and changes in services
    offered and products produced account for the new cyber risks that businesses
    face.


    #### Financial Incentives


    The process of certifying compliance with a cybersecurity standard demonstrates
    how financial incentives affecting both the auditor and the audited can question
    the meaningfulness of a particular compliance. Companies usually pay external
    auditors who then vouch for their compliance with regulations and industry standards,
    thereby introducing potential conflicts and blind spots. The Payment Card Industry
    Data Security Standard (PCI DSS) provides a good case study.[⁵](../Text/26_9781633698000_notes.html#ch2_rfn23)


    Shortly after publication of the initial PCI DSS in 2004, we set up a Qualified
    Security Assessors (QSA) practice in Asia to perform credit card security assessments.
    One of the first things we noticed was that the primary motivation for most merchants,
    and other companies that store or process payment card information, was not protection
    of credit card information. It was getting the annual report on compliance that
    showed they were, indeed, compliant. In addition, clients wanted to get the report
    at the lowest possible price with the least amount of effort. Even in our work
    for one of the founding PCI payment brands, the low cost of assessment was such
    a priority that we stopped working with it. It was impossible to hire qualified
    assessors at the price it was willing to pay.


    On the other hand, the companies and individuals that perform compliance assessments
    are motivated to maximize income and profit. It is a business after all. The QSA
    company can accomplish this most easily through repeat business, as PCI DSS audits
    are an annual event. However, a QSA is unlikely to be hired next year if it gives
    a client a failing grade this year. Many individual QSA assessors we’ve talked
    to said their management often reminded them about this business reality.


    Another factor affecting the quality of a PCI assessment is the amount of time
    spent on it. For the individual QSA, performing more and more assessments can
    have a significant impact on its total compensation. Trustwave is the largest
    QSA; one of its former assessors said, “The more assessments you could cram into
    a quarter, the bigger and juicier your bonus was going to be.” An employee with
    a base salary of $100,000, for instance, could generate $30,000 to $50,000 more
    a year by churning out as many assessment reports as possible.[⁶](../Text/26_9781633698000_notes.html#ch2_rfn24)


    The protection of credit card information is clearly important, and PCI assessments
    are one means of increasing this protection. However, nontechnical dynamics, such
    as the financial motivations we just described, diminish the value of the assessments.
    Home Depot, for example, was PCI-compliant at the time it suffered a breach that
    compromised 56 million of its customers’ credit cards details.[⁷](../Text/26_9781633698000_notes.html#ch2_rfn25)


    #### Compliant versus Protected


    The proliferation of new cybersecurity regulations has some positive results:
    companies are doing more to protect their assets and their customers. But the
    regulations have unintended consequences. Because of the sheer number of regulations
    and the burden of complying with them, companies are losing sight of the most
    significant cyber risks.'
