    在该公告发布的同时，荷兰外交事务部也发布了一封信函，警告前往土耳其、中国、俄罗斯和伊朗的荷兰游客，其电子设备面临着网络威胁。² 建议的预防措施（例如携带数据量极少的“纯净”笔记本电脑和手机手机）是政府对国际旅行的标准建议。这种建议的问题之处在于，它没有考虑到人们在出差期间开展业务所需的信息和技术。它还未能解决在外国国家生活和工作的实际问题。


    虽然发布这些警告可能有其他（或许是地缘政治）动机，但它们并不能保护那些表面上为了这些警告的企业和个人。相反，它们只引发了担忧，而没有提供减少恐惧的途径。


    ## 你应该接受政府援助吗？


    针对企业的网络攻击日益增加且愈成功（通常归因于国家行为），这引发了人们对扩大政府国防责任范围、以保护公司免受网络攻击影响的活跃讨论。这一提议对企业具有重要影响。传统的国防防御得益于定义明确国界以及（相对）容易识别的对手。而在数字战场上，这些优势消失了。


    要解决的首要问题是识别攻击者。如果例如，有一排坦克部署在你的边界处，在攻击发生前识别他们很容易实现的。但对于源自世界上任何地方的网络攻击，情况并非如此。对波士顿某公司的攻击看起来来自北韩国，但实际上可能源自纽约，并在途中经过了法国和新加坡的迂回路径。通常用于识别网络攻击者的所有迹象，如黑客软件的来源、网络黑客在开发软件时使用的计算机默认语言，以及他们在攻击中使用的计算机地址，都可以被轻易修改以误导侦查。此外，所有这些指标只有在攻击开始后才能进行分析。我们无法预知网络攻击的外国来源，因此也无法预知军事反应的合理性。


    对于政府提供的任何直接网络防御援助，企业领袖都需要考虑他们可以减少哪些风险、不能减少哪些，以及政府的帮助是否会引入新风险。大多数关于军事和执法网络服务的建议都包括对进出公司的所有网络通信进行监控。这应对了基于互联网的恶意软件攻击风险。然而，监控无法解决任何需要了解公司运营和业务开展方式才能缓解的网络风险。它无法防止第
    2 章描述的某亚洲汽车制造商所遭受的十亿美元损失(../Text/10_9781633698000_ch2.html)，或者例如，无法检测采购部门的财务欺诈或合资企业伙伴对知识产权的盗窃。


    除了网络攻击的线索外，受监控的通信还包含了公司大量的敏感信息，而这些信息现在掌握在政府手中。对于跨国公司来说，监控可能涉及不止一个政府。鉴于各国和跨国公司的全球利益并不相同，存在一种风险：政府为防止网络攻击而收集的信息可能被用于其他用途。某跨国矿业客户的全球安全主管正因为这个原因拒绝了美国政府某局提供的安全网络监控服务。³
    几年后，该局再次向全球安全主管的继任者提出了类似的提议。在协议的细则条款中，该局声明其有权使用收集的任何信息进行刑事调查。全球安全主管再次拒绝了该提议。即使这些信息从未被挪他用，在政府保管期间仍然面临风险。包括
    `NSA` 在内的政府机构——其中间名字面上意思就是“安全”——在保护自身及其信息免受网络攻击方面，表现记录并非最佳。⁴


    这不是对政府提供网络安全援助的批判。相反，它强调了政府提供的援助其性质与他们习惯应对的威胁直接相关（例如来自国家的军事攻击）。企业面临着根据优先级需要处理的不同威胁。


    ## 网络安全供应商


    尽管网络安全市场的增长超过了经济其他大部分领域，但竞争依然激烈。根据一项估计，2018 年约有 2300 家网络安全供应商在竞争少数几种产品类型。⁵ 而市场进入者的数量只会继续增加。供应商面临着巨大的压力，需要从竞争对手中脱颖而出。


    ### 调查与报告


    供应商有时利用调查和报告来强调影响范围或能力的规模，以便在拥挤的领域中建立特色。特别是尚未成熟的供应商，可以通过发布关于网络犯罪成本的报告来引起关注。Cybersecurity
    Ventures 的 2016 年报告预测，全球网络犯罪年度成本将达到 6 万亿美元。⁶ 从数字上看，这超过了除美国中国之外的世界每一个国家的 GDP。


    CrowdStrike 的年度威胁报告提供了另一种示例。除了汇总网络事件的公开信息外，其 2018 年的报告还包含了其`Falcon`平台收集的 901 亿次事件。⁷
    它执行的网络监控与我们之前描述的政府建议监控相似，具有相同的局限性，甚至是相同的风险。这 90 亿次事件都与同一种互联网恶意软件攻击有关。它没有解决内部风险，例如不满的
    IT 员工关闭空管系统。


    通过歪曲威胁描述来提高公司网络安全产品的知名度是有历史的。2009 年 3 月 19 日，AT&T 前高级副总裁兼首席安全官爱德华·阿莫索在向参议院商务、科学和运输委员会提交的书面证词中写道：“去年
    FBI 宣布，网络犯罪收入首次超过了毒品交易，成为全球最有利的非法业务，估计每年非法利润超过 1 万亿美元。”⁸ 他没有为这一说法提供任何参考依据。从数据对比来看，这一所谓的利润将是
    AT&T 自身利润的 80 倍，超过了除十二个国家以外的所有国家的 GDP。⁹ 在其证词的几页后，阿莫索建议联邦采购优先级应该改变，以鼓励民用机构使用 AT&T
    提供的反 DoS 攻击服务。¹⁰


    ## 立法需求


