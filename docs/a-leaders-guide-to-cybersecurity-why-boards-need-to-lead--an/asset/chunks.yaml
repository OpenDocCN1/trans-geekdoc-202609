    ### The Responsibilities


    #### Manage Cyber Risks


    The most significant cybersecurity responsibility is the management of cyber risk.
    All other responsibilities both support cyber risk management and depend on a
    clear understanding of the business impact of cyber incidents. Effectively managing
    cyber risks requires that you clearly understand the relationships among the most
    significant business risks a company faces, the types of cyberattacks that could
    cause these risks, and the mitigating controls to prevent or minimize their impact.
    Ensuring the effectiveness of the controls includes recognizing and accounting
    for the nontechnical dynamics that can negate even the most powerful technologies.


    #### Fortify the Company


    Companies can substantially improve the overall effectiveness of their cybersecurity
    activities by utilizing the tools of organizational structure, processes, and
    culture, while accounting for employee motivations and incentives. The process
    of discovering new cyber risks will answer the questions, “How secure are we now?”
    and “How secure will we be tomorrow?” The placement of the cybersecurity group
    and an understanding of the cyber expertise that boards need—and don’t need—can
    improve the effectiveness of both. Further, a shift in thinking about accountability
    can unlock valuable information that is essential for informed board and executive
    decision making.


