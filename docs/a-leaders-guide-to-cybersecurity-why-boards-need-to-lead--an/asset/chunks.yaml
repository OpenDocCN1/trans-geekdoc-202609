    鉴于攻击者可以蓄意地发动网络攻击，高管人员也应考虑业务目标对相关威胁对手的吸引力。贵公司为其最关键业务活动汇编的网络威胁叙述，为这一优先排序过程提供了依据。特别是对业务活动、风险和后果以及网络攻击者的描述，涵盖了它们的重要性及其影响。


    ## 网络防御态势


    另一个考虑因素是贵公司对防御不同类型网络攻击的准备情况如何。对于大型公司而言，部署检测和防止网络攻击的控制措施可能是一个漫长的过程，而尚未配备这些措施的系统内在风险高于已经受保护的系统。此外，一旦部署，控制措施的效果可能因多种原因而异。人员配置、投资水平或其应对的网络攻击性质都可能影响控制措施的效果。高管层可以考虑有关关键业务活动当前网络风险态势的报告，以便对态势进行优先排序。


    ## 网络危机组合


    高管人员面临着由不同类型网络危机独特特性引起的不同问题和挑战。例如，网络攻击导致的环境破坏（如 Maroochy Water Services 发生的情况）以及专利软件被盗（如风力涡轮机公司
    AMSC 发生的情况），给高管带来了截然不同的挑战。贵公司可以从现有的网络威胁叙述中提取出一个具有代表性的网络危机组合，以便高管在没有针对特定准备的情况下适应网络危机。


    您的监督职责是确保贵公司基于以下基础对网络危机准备进行优先排序：


    ![images](img/box.jpg)���网络攻击的重要性和影响


    ![images](img/box.jpg)���关键业务活动的当前网络防御态势


    ![images](img/box.jpg)���各种不同类型的网络危机


    此步骤的备忘录（aide-mémoire）是第 13 章中的危机调查 4。


    ## 网络危机场景


    对贵公司可能面临的网络危机类型进行优先排序后，下一步是开发场景，以便高管在危机发生时可以使用它们为自己和公司做好准备。场景应起始于概述可能导致网络攻击的业务、政治和社会动态。这包括识别潜在的网络攻击者、他们的动机，以及为什么贵公司是一个可能的目标。


    为了使场景具有真实性，网络攻击本身的描述应首先简要解释为什么攻击者选择这种特定类型的网络攻击，而不是其他网络攻击或不同类型的攻击，以及攻击者成功需要什么。成功的先决条件包括攻击者所需的知识（例如设备是如何运行的）以及所需的工具（范围从成套渗透测试工具包到断路器不等）。此外，场景应指定攻击者的位置，包括地理位置上（例如本地或远程）和组织上（例如员工或承包商与外部人员）。它应该强调网络攻击的主要步骤，且所有都要符合数字管理的首要原则——“如果你不理解，说明他们没有解释清楚。”场景应通过描述对贵公司及其运营、设备的影响，以及对贵公司客户和其他利益相关者的影响来结束。对这些描述应与贵公司的风险偏好进行比较。这些大部分信息已包含在相应的网络威胁叙述中。


    您的监督职责是确保贵公司在网络危机场景中包含了以下信息：


    ![images](img/box.jpg)���网络攻击及引发的危机可能发生的广泛背景


    ![images](img/box.jpg) 网络攻击概述


    ![images](img/box.jpg)���对贵公司及其利益相关者造成的后果


    此步骤的备忘录是第 13 章中的危机调查 5。


    ## 高管意识


    贵公司高管在网络危机期间领导公司所需的信息包括：网络攻击概述、贵公司已采取的网络防御措施及其失效原因、对贵公司及其利益相关者的后果，以及应对网络事件响应的当前进展。


    虽然网络攻击总会有一些公司无法提前预测的特定细节，但相应的网络威胁叙述提供了一个起点，描述了可能导致危机的网络攻击类型以及可能产生的后果范围。


    为了理解贵公司未能击退网络攻击的原因，首先查看相关的网络风险修复计划，这些计划解释了贵公司选择了哪些缓解网络攻击的网络风险控制措施。此外，计划的执行进度提供了有关在攻击发生时公司处于通可接受剩余网络风险路径的何处的信息。


    没有人能提前准备好进行网络事件响应活动的信息。然而，贵公司可以做好准备，确保所有流程和信息源已到位，以便高管获得及时且准确的更新。


    ## 网络危机的迷雾


    网络攻击何时开始以及损害范围是多少是异常难以快速回答的问题。这种透明度的缺乏会阻碍高管的内部危机管理决策，并使利益相关者的参与变得复杂。在涉及网络危机通信时，及时性和准确性往往是完全对立的。


    例如，美国零售商 Target 最初估计其 2013 年销售点系统的泄露影响了 4000 万客户，仅在一个月后的 2014 年 1 月将该数字修订为 7000
    万。当客户诉讼解决时，该数字达到了 1.1 亿，几乎是最初估计的三倍。⁵2016 年 9 月，雅 宣布了 2014 年发生的 5 亿账户泄露（当时的记录），仅在三个月后揭露
    2013 年还发生了另一次入侵，暴露了 10 亿用户。2017 年 10 月，它再次修订了这一数字：事实上所有 30 亿雅账户都被破解了。⁶ 高管面临着艰难的选择：是做出因不准确而损害信誉的早期披露，还是延迟披露并冒被不合作或不透明的指责。


    您的监督职责是确保贵公司准备好向高管提供以下信息：


    ![images](img/box.jpg) 网络攻击


    ![images](img/box.jpg) 网络防御措施及其失效原因


    ![images](img/box.jpg) 网络事件响应的进展


    此步骤的备忘录是第 13 章中的危机调查 6。


    ### 网络高管指导


