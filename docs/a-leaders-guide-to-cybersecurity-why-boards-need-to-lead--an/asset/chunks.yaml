    \ || \n\n*   A plan for the cyber incident response practice drill that addresses\
    \ the prioritized cyberattacks that can cause the most significant business risks\
    \ and crises to materialize.\n\n*   Cyber incident response drills of sufficient\
    \ complexity to test technical skills, decision making, communications, and logistics.\n\
    \n*   Post-drill plans to improve cyber incident responses identified in the drills.\n\
    \n |\n\n| Oversight || \n\n*   Attend cyber incident response practice drills.\n\
    \n*   Confirm that the company conducts drills for the most significant types\
    \ of cyber incidents that could lead to a crisis and identifies areas for further\
    \ improvement.\n\n |\n\n## Executive Leadership\n\nTABLE 13-4\n\nSet cyber crisis\
    \ preparation priorities\n\n| Crisis Inquiry 4 || “What cyber crises has the company\
    \ identified for executive preparation?” |\n\n| --- | --- |\n\n| Rationale ||\
    \ It is not feasible to prepare executives for every possible type of cyber crisis\
    \ they may face, yet it is critical that they are prepared, should a cyber crisis\
    \ occur. So the company needs to decide which types of cyber crises should be\
    \ prioritized to prepare executives. By posing this inquiry, you ensure that your\
    \ company is preparing executives to lead in the event of the most significant\
    \ cyber crises. |\n\n| Evidence || \n\n*   Descriptions of the cyber crises selected\
    \ for executive preparation, along with the rationale for selection. These rationales\
    \ should include: \n\n    *   The significance of the affected business activities\
    \ and severity of impact\n\n    *   Heightened risk due to lack of sufficient\
    \ controls\n\n    *   Portfolio of different types of cyber crisis\n\n |\n\n|\
    \ Oversight || \n\n*   Confirm the selection of cyber crises and the underlying\
    \ rationales.\n\n*   Provide your thoughts on additional types of cyber crises\
    \ for consideration.\n\n |\n\nTABLE 13-5\n\nCyber crisis scenarios\n\n| Crisis\
    \ Inquiry 5 || “Provide cyber crisis scenarios that describe cyberattacks that\
    \ could cause a crisis, the broad context in which an attack could occur, and\
    \ the range of consequences.” |\n\n| --- | --- |\n\n| Rationale || In order for\
    \ executive discussions on potential cyber crises to be useful, the scenarios\
    \ have to be realistic and clearly connect a cyberattack on your company’s computers\
    \ with the impact to your company’s business. |\n\n| Evidence || \n\n*   Scenarios\
    \ for each of the prioritized cyber crises that include: \n\n    *   The broad\
    \ context in which the cyberattack and resulting crisis could occur\n\n    * \
    \  An overview of the cyberattack, the requirements for success, and the steps\
    \ involved in execution\n\n    *   The consequences for both your company and\
    \ its stakeholders\n\n |\n\n| Oversight || \n\n*   Confirm that the cyber crisis\
    \ scenarios include the required information.\n\n*   Use this inquiry, as well\
    \ as the remaining crisis inquiries, as an opportunity to learn more about the\
    \ cyber crises your company may face.\n\n |\n\nTABLE 13-6\n\nExecutive awareness\n\
    \n| Crisis Inquiry 6 || “Describe the preparations, including sources of information\
    \ and assigned responsibilities, for keeping executives informed throughout a\
    \ cyber crisis.” |\n\n| --- | --- |\n\n| Rationale || Executives need timely and\
    \ accurate information to both lead the company and engage with the public during\
    \ a cyber crisis. Given time pressures during a crisis, your company should make\
    \ preparations ahead of time. |\n\n| Evidence || \n\n*   Plans for informing executives\
    \ on: \n\n    *   The cyberattack\n\n    *   Cyber defenses and why they failed\n\
    \n    *   Cyber incident response progress\n\n |\n\n| Oversight || "
