  raw: 'In practical terms, cyber risks are nothing more than cyberattacks that cause
    business risks to materialize. As such, the process of prioritizing cyber risks
    is really the process of prioritizing cyberattacks. Conveniently, all the information
    your company needs to undertake this prioritization can be found in the cyber
    threat narratives.


    At the most fundamental level, the criteria for prioritizing cyberattacks are
    their capacity to cause damage to your company. The logical starting point, therefore,
    is the first element of cyber threat narratives, which describes your company’s
    critical activities and the inherent business risks it faces. This recalls the
    second principle of digital stewardship—“It is the business at risk. All discussions
    and actions relating to cybersecurity and cyber risks start and end with the business
    and the risks to its operations and strategic direction, not with computers and
    their vulnerabilities.”


    After identifying these critical business activities and associated risks, the
    next step in the prioritization process is determining which risks are most susceptible
    to cyberattack. The remaining three cyber-threat-narrative elements inform this
    examination into impact and likelihood. Taking into account the supporting systems—the
    second element—the third element identifies the cyberattacks that could have an
    impact on a critical business activity, the requirements for a successful attack,
    and the degree and extent of the resulting impact. In particular, your company
    should look for cyberattacks that result in greater impact than possible from
    other causes and those that are simpler to execute. The final element to consider
    is the motivation and capabilities of likely adversaries, since cyberattacks don’t
    happen on their own.


    Your company’s prioritization of cyberattacks, and therefore cyber risks, not
    only lays the groundwork for selecting controls to counter these attacks, but
    also informs cyber staffing and skills development. Through your oversight of
    this prioritization process, you are ensuring that the money your company spends
    on cybersecurity directly relates to reducing its most significant cyber and business
    risks.


    Your oversight responsibility is to ensure that your company has prioritized cyberattacks
    on the basis of:


    ![images](Images/box.jpg)   Their capacity to cause risks to critical business
    activities


    ![images](Images/box.jpg)   The range of possible impacts


    ![images](Images/box.jpg)   The resources required for a successful attack


    ![images](Images/box.jpg)   The motivations and capabilities of likely cyber adversaries


    The aide-mémoire for this step is [Risk Inquiry 5](../Text/22_9781633698000_ch11.html#risk5)
    in [chapter 11](../Text/22_9781633698000_ch11.html).


    ### Selecting Controls


    After prioritizing the cyberattacks to defend against, the next step is to choose
    the right tools for the job. The connections the company has established in the
    cyber threat narratives between cyberattack techniques and vulnerabilities in
    the supporting systems for business activities provide the basis for identifying
    the most suitable cyber risk controls. These controls logically fit between cyberattacks
    and supporting computer systems. One way of approaching control selection is to
    start with the prioritized cyberattacks and choose controls that mitigate the
    attacks. Cybersecurity standards, such as ISO/IEC 27002, “Information technology—Security
    techniques—Code of practice for information security controls,” can be helpful
    resources because they describe the suitability of different controls to address
    common cybersecurity challenges.[^(27)](../Text/26_9781633698000_notes.html#ch8_rfn93)


    When a company selects controls to counter a cyberattack, it may find that a collection
    of controls is more effective than a single control. In the early days of corporate
    network perimeter defenses, firewalls were the technological solution of choice.
    Today, intrusion detection and protection systems and security log analysis, among
    other protection measures, complement firewalls. In the case of cyber defenses,
    the whole is definitely more than the sum of its parts, because the collection
    of controls can compensate for limitations in any individual one.


    Collections of controls can extend beyond technology to physical and procedural
    controls. By looking at all three types of controls together, it is possible to
    address cyber risks more efficiently and cost-effectively than through technology
    alone. In the 1980s, we certified the cybersecurity functionality of computers
    inside nuclear missile silos. There was concern that some of the security requirements
    called for in Department of Defense standard 5200.28 could prevent the soldiers
    manning the missiles from fulfilling presidential orders. We took into account
    these operational concerns, the intended risk mitigation purposes of the cyber
    controls, and the protection the physical controls provided. We realized that
    the physical controls provided stronger assurances in the areas of authentication
    and accountability than security features in the computers deep inside the silos
    could accomplish. By incorporating physical protection into the mix, the selected
    controls provided higher security at lower cost than could be accomplished otherwise.


    When selecting controls, companies need to look at how proposed controls will
    work in practice in the day-to-day running of a business. Without this business
    context, it is easy to make control choices that appear suitable on the surface,
    but either fail to protect the business activity or actually increase its risk
    exposure. A global financial institution with an annual cybersecurity budget measured
    in the hundreds of millions of dollars provides an example of what can happen
    if you ignore this business context. Employees at this company have valid business
    reasons to email sensitive information to outside parties ranging from large institutional
    partners to individual contractors. Interception of these emails as they traverse
    the internet is the cyber risk of primary concern.


    To address this risk, the financial institution deployed its own encrypted email
    system to prevent interception and used a technology known as data loss prevention
    (DLP) to determine if an email contains sensitive information. DLP tools use a
    variety of techniques from pattern matching to sophisticated heuristics to identify
    sensitive information. Commonly, companies use these tools to prevent sensitive
    information from leaving. The financial institution used DLP to make sure any
    sensitive information that left the company was encrypted. The company only used
    the DLP system to check the contents of unencrypted emails, not encrypted emails.
    This meant that once an encrypted email connection was set up with a third party,
    an employee could send it any and all of the company’s sensitive information,
    not just the sensitive information needed to conduct business. By not fully considering
    how the company conducted business communications, the cybersecurity department
    ironically built the very tools an insider could use to securely and covertly
    send out all the company’s “crown jewels.”


    From an oversight perspective, your job is to ensure your company:


    ![images](Images/box.jpg)   Selects cyber controls on the basis on their suitability
    to mitigate the prioritized cyberattacks


    The aide-mémoire for this step is [Risk Inquiry 6](../Text/22_9781633698000_ch11.html#risk6)
    in [chapter 11](../Text/22_9781633698000_ch11.html).


    ### Examining Control Effectiveness'
