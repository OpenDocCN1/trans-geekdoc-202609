  raw: "Ongoing business-as-usual activities can also introduce vulnerabilities into\
    \ critical systems. Sometimes they are the natural continuation of the changes\
    \ we discussed above. Giving a strategic vendor direct access to a company application\
    \ is a onetime decision that causes change. The management of accounts for vendor\
    \ employees, however, is an ongoing activity that could precipitate a cyber risk\
    \ by, for example, mistakenly granting more-powerful permissions than needed.\
    \ Storing business information in the cloud is a similar example of a single change\
    \ followed by multiple opportunities for new cyber risks. Configuration mistakes\
    \ in file repositories in the Amazon Web Services cloud have exposed the sensitive\
    \ information of countless organizations, including the NSA, which exposed details\
    \ on battlefield-intelligence systems, and Accenture, which lost passwords and\
    \ encryption keys used to protect customer information.[⁴](../Text/26_9781633698000_notes.html#ch9_rfn103)\n\
    \nJust as supplier-provided software applications can contain vulnerabilities,\
    \ so can software developed in-house. Software developers seldom write programs\
    \ from scratch, preferring the efficiencies that come from assembling previously\
    \ written routines, some from external sources. For example, in 2017, the government\
    \ of Estonia suspended use of over three quarters of a million smart ID cards\
    \ because of encryption weaknesses in third-party software built into the brains\
    \ of the ID cards. The German graduate student who wrote the vulnerable software\
    \ had no malicious intent; he simply demonstrated the difficulties in designing\
    \ and writing complex programs.\n\n“Shadow IT” is employees’ use of technology\
    \ without the knowledge or approval of the IT department. Setting up wireless\
    \ networks connected to the corporate network is one example. This practice has\
    \ expanded dramatically and now includes broad use of cloud-based services and\
    \ internet of things devices. Usually, employees resort to these work-arounds\
    \ to improve productivity and convenience. Since they believe that the IT department\
    \ is too overextended to deploy the desired technology in a timely manner or that\
    \ it wouldn’t approve, they go rogue.\n\nAlthough none of these changes rises\
    \ to the level of your attention, you need assurance that people have identified\
    \ these under-the-radar means of introducing new cyber risks and that suitable\
    \ controls are in place to prevent them. Keeping in mind that your company’s own\
