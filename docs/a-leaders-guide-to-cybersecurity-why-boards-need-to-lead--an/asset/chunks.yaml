    Legislating market demand, as Amoroso was suggesting, is another approach to increasing
    product demand and revenue. In 2017, Israeli mobile phone forensics vendor `Cellebrite`
    lobbied for a New York state law that would have required the use of its `Textalyzer`
    product to perform forensic analysis of the mobile phones of all drivers involved
    in an accident to detect if any texting took place before the accident.[[^(11)](../Text/26_9781633698000_notes.html#ch3_rfn56)
    Within the United States, forty-nine states have “texting while driving” laws
    on the books, and annually nearly 18,000 state and local law enforcement agencies
    report 6.3 million motor vehicle crashes.[[^(12)](../Text/26_9781633698000_notes.html#ch3_rfn57)
    Given the potential size of this market, `Cellebrite` supports similar legislation
    in other states and lobbies at the national level as well.[[^(13)](../Text/26_9781633698000_notes.html#ch3_rfn58)


    Vendors use these large numbers to attract attention and focus on specific cybersecurity
    risks and solutions.[[^(14)](../Text/26_9781633698000_notes.html#ch3_rfn59) While
    many reports that cybersecurity vendors issue have genuinely useful information,
    you need to consider the highlighted cyber risks in the context of your own company
    and be suspicious of all estimates of financial damage.


    ## Media


    The news media are the primary means through which governments and cybersecurity
    vendors publicize their messages, so are a primary source of the information that
    frames our understanding and prioritization of cybersecurity issues. A couple
    of factors influence the cyber news that is available.


    ### Reporting What Is Known


    Obviously, the media can only report on cyberattacks or breaches that they know
    about and that are already public to some extent. These breaches are made public
    in several common ways:


    • The effects of the breach are visible, as was the case with the 2015 hacking
    of the Ukrainian electric power grid.[[^(15)](../Text/26_9781633668000_notes.html#ch3_rfn60)


    • The hackers themselves publicize the breach, often to highlight the poor cybersecurity
    hygiene of their targets. One example is the breach of Ashley Madison and subsequent
    publication of the names and personal details of 32 million customers who used
    the company’s website to facilitate extramarital affairs.[[^(16)](../Text/26_9781633698000_notes.html#ch3_rfn61)


    • The security researchers who uncovered or analyzed the breach publicize it.
    For example, in May 2018, a security researcher published a report on a hacking
    campaign affecting over 300 websites, including those belonging to the San Diego
    Zoo and the government of Chihuahua, Mexico.[[^(17)](../Text/26_9781633698000_notes.html#ch3_rfn62)


    • Reporting regulations compel an organization to disclose information about a
    breach. The loss of personal and financial information on nearly half the US population
    by `Equifax`—a large consumer credit ratings firm—is an example of this path to
    the public record.[[^(18)](../Text/26_9781633698000_notes.html#ch3_rfn63)


    Media can’t report on breaches or cyber incidents that are, in effect, secret,
    and many types of incidents, including theft of trade secrets, financial fraud,
    and extortion, often remain hidden.


    ### Reader Demand


    While the press plays an important role in civil society, there are some market
    factors that influence what it publishes. Specifically, it publishes content its
    readers want, and the trope “If it bleeds, it leads” translates in the digital
    world to covering breaches that are state sponsored (especially if the state’s
    written language doesn’t use Roman letters), ultra-sophisticated, never seen before,
    and the harbinger of imminent disaster, on either a national or a global scale.
    This story plays better than one about someone in the marketing department without
    any hacking skills who took R&D information because no one thought to protect
    it. Even if threats from competitors, partners, customers, suppliers, and employees
    are much more common and the financial impact usually greater, these stories are,
    well, boring and don’t attract an audience.


    ![images](Images/line.jpg)


    Their roles, objectives, and incentives influence the voices of government, cybersecurity
    vendors, and the media. By understanding these influences, you’ll be able to go
    beyond headlines to understand what really matters for you and your company. Now
    that we’ve laid out the cybersecurity landscape as it exists, in the rest of the
    book, we will show how you can lead your company to a new approach to cybersecurity
    that will effectively protect it, its shareholders, and the broader community
    of stakeholders.


    # PART TWO


    # The Principles


    As a board member, you need to use your existing knowledge of business dynamics
    and operations to help your company execute an effective cybersecurity strategy,
    which includes understanding, managing, and reducing the risks to your business.


    To accomplish this, you don’t need to develop a completely new strategy. Nor will
    you need to fundamentally change the nature of your oversight. Instead, you will
    help your company expand its cybersecurity focus beyond technology and place the
    business, and risks to it, at the center of its decision making.


    To assist you in this process, we developed four principles of digital stewardship
    with several considerations in mind. The first is they don’t require any background
    in cybersecurity or computing technology. They’re immediately actionable. Second,
    regardless of the amount of cybersecurity advice (this book included) you receive,
    you’ll never be prepared for every situation or every decision you’ll need to
    make. These principles provide guidance and can be used as rules of thumb when
    you encounter new circumstances.


    You can also use these principles as a litmus test for how your company is managing
    its cyber-risk-related activities. Does the company follow the principles or not?
    In addition, you can then use them to guide your organization and the execution
    of its own oversight. These principles are further informed by understanding that
    your responsibilities are different from those of others inside your company—especially
    those for whom cybersecurity is a primary responsibility. The principles address
    dynamics and situations that are often outside the control or influence of cybersecurity
    specialists, yet are essential for their success.


    # 4 If You Don’t Understand It, They Didn’t Explain It


    *Cybersecurity management and staff within a company are responsible for providing
    their board of directors with materials and briefings that nonspecialists can
    understand.*


    ## Current Situation


    Cybersecurity briefings can cause frustration on both sides of a boardroom table.
    Some directors have noted to us that they’re happy they are devoting more time
    to cybersecurity in full board and committee meetings, but they’re often frustrated
    that the briefings and materials they receive from the company’s cybersecurity
    team are not relevant or useful. Presentations are often repetitive, as if the
    team is struggling to find material to fill the time. Chief information security
    officers, on the other hand, grow frustrated with board members’ apparent lack
    of interest in understanding what to them are elementary but important technical
    concepts.


    Given differences in education, experience, and professional responsibilities,
    both reactions are understandable.

