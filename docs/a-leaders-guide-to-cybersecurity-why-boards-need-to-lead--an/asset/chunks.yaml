    Telling a story is a common approach to collecting and organizing information
    to share across a wide audience. We developed cyber threat narratives that include
    four elements (see [table 8-1](#18_9781633698000_ch8.html#tab8-1)).


    To develop the cyber threat narratives, different parties cooperate in compiling
    and analyzing the information. In addition to executives and their management
    teams, they include:


    - `Operations`: Personnel involved in day-to-day business activities, such as
    automobile designers, radiology billing clerks, and marketing staff

    - `Systems`: People responsible for the administration of the computing systems
    supporting business activities

    - `Cybersecurity`: Experts in the technical aspects of cyberattack and defense

    - `Specialists`: Staff with different expertise, such as legal, public relations,
    human resources, and physical security


    ### Table 8-1: Four elements of cyber threat narratives


    | Element | Purpose |

    | --- | --- |

    | Critical business activity and risks | Identification of a critical business
    activity and the risks it faces |

    | Supporting systems | Identification of the computer systems on which a business
    activity relies |

    | Cyberattacks and consequences | Cyberattacks that can cause critical business
    activity risks to materialize and their impact |

    | Cyber adversaries | Identification and characterization of likely attackers
    |


    Let’s look at each element within a cyber threat narrative.


    #### Critical Business Activity and Risks


    The first element of a narrative is the identification and description of a critical
    business activity, the benefits it provides, and the risks it faces. For example,
    for the chemical company we’ve talked about, that could be the manufacture of
    aromatic and polyester resins.


    The critical nature of a business activity varies among companies and industries.
    For example, customer support is a low-risk activity for many companies. But,
    if you run a casino, customer support is critical. Casinos in the former Portuguese
    colony of Macau, for example, rely on a small segment of VIP customers, or “whales”
    as they are commonly referred to, for more than 54 percent of combined gross gaming
    revenue.[](../Text/26_9781633698000_notes.html#ch8_rfn68) Attracting and retaining
    these players requires significant investments, such as complementary use of private
    jets and expansive suites with room service from Michelin-starred restaurants.
    For the casinos, risks to customer relationship management threaten their bottom
    line.


    Once a business activity is identified as critical, the next step is sizing up
    inherent risks. There are two types of risk you should focus on. Of primary concern
    are risks that prevent your company from reaping the benefits of a business activity.
    For example, in the case of the chemical company, a disruption to its manufacturing
    operations (risk) would prevent it from making resins (consequence), which would
    lower its revenue (benefit).


    There are also collateral risks that can harm your company, customers, or other
    stakeholders. In the case of a chemical manufacturing company, a release of poisonous
    chemicals into the environment is one example. The most publicized collateral
    risk is the loss of confidential customer information such as passwords and credit
    card information.


    Sometimes, both types of risk can converge. When casinos cultivate VIPs, they
    provide more than luxurious perks; they also collect data such as time spent playing,
    average stake per hand, average number of hands per hour, and skill level. This
    information helps casinos optimize a high roller’s gambling experience, as well
    as their own profits. A VIP’s financial information is also valuable, but this
    information extends far beyond credit card details. Knowledge of offshore bank
    accounts and global real estate holdings increases a casino’s comfort in extending
    credit, and collecting on it. The competition to attract VIP players is fierce,
    as a single individual can contribute millions or more to the bottom line. In
    the hands of a competitor, this data could be used to identify and lure away a
    casino’s most profitable customers. In the hands of tax authorities or criminals,
    this data could pose a material threat to a VIP’s overall financial circumstances.


    When going through this exercise, don’t assume every potential risk to a business
    activity should be a concern. In 2006, we met with an independent nonexecutive
    director for a `Fortune` 500 hard-drive manufacturer at its headquarters in Silicon
    Valley. The walls of the boardroom were lined with framed, gold-plated copies
    of patents, testaments to the company’s history of innovation. Given this display,
    you would think that theft of intellectual property was a significant risk. But,
    as it turned out, intellectual property wasn’t much of a concern at all. The company
    had cross-licensed patents with all major competitors and moved to Malaysia, which,
    with its neighbors Singapore and Thailand, accounted for 80 percent of total production.[](../Text/26_9781633698000_notes.html#ch8_rfn69)
    What poses a significant risk for one company may not for another. Although the
    disruption of resin production would be harmful to the chemical supply, a similar
    disruption to another manufacturer may not be. Maybe its contribution to the bottom
    line is negligible, or alternative sources are readily and easily available.


    Your oversight responsibility for this step is to gain assurance that:


    ![images](Images/box.jpg) Your company has identified its most critical business
    activities, the benefits they provide, and the most significant business risks
    they face.


    The aide-mémoire for this step is [Risk Inquiry 1](../Text/22_9781633698000_ch11.html#risk1)
    in [chapter 11](../Text/22_9781633698000_ch11.html).


    #### New, Cyber-Induced Business Risks


    The power of cyberattacks can introduce new business risks that were previously
    of much less concern. The sensitivity of medical information is one example. The
    black-market demand for patient information is increasing dramatically, with complete
    medical records selling for more than $1,000.[](../Text/26_9781633698000_notes.html#ch8_rfn70)
    Hospitals and their regulators have noticed this trend. In 2017, the Advocate
    Health Care hospital network paid a $5.5 million fine to the US Health & Human
    Services Department for three separate 2013 breaches that compromised the data
    of 4 million people. While clearly the loss of patient data is a risk that hospitals
    need to address, a more chilling risk arises not from someone stealing patient
    information, but from changing it.


    Imagine a competitive situation between two hospital networks in which market
    supremacy yields significant financial returns. How could you lure patients away
    from a competing hospital to your doors? By hacking into your competitor’s computer
    systems and changing patient medications, dosages, diagnoses, and surgical instructions.
    The wrong medication or too much of the right one can sicken or kill a patient.
    Changing “left” to “right” in a patient’s medical record before kidney removal
    surgery is a death sentence for the patient and may as well be one for the hospital.
    The net result of these types of cyberattacks will erode people’s trust in the
    hospital. Who would go to a hospital where they are just as likely to be killed
    as cured?

