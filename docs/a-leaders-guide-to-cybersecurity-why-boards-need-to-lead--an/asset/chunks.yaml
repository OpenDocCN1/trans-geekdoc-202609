- fmt: '

    There are several issues at play. The first, as the example of Home Depot illustrates,
    is that compliance with a cybersecurity standard is not the same as being protected.
    Determining what constitutes sufficient cyber protection is a different and larger
    undertaking than meeting the requirements of a regulation. The second issue relates
    to how people deal differently with immediate pain versus future pain. Noncompliance
    with a regulation entails predictable and immediate pain in terms of fines, penalties,
    and other punitive measures. Corporate compliance departments exist precisely
    to avoid this pain. On the other hand, neither the impact of a potential cyber
    breach nor its timing is known. This is a future pain and, while recognized as
    important, doesn’t convey the same urgency for many as regulatory noncompliance
    does. Therefore, determining real cybersecurity requirements takes a backseat
    to compliance. A further unintended consequence is that companies more and more
    think compliance is a proxy for being secure and do not consider additional risk-reduction
    activities.


    ## Employee Motivation


    Employees are motivated to do their jobs and do them well. Their desire for a
    promotion, a bonus, or a manager’s approval, or the feeling of being a productive
    member of a team, are all factors that can drive this motivation. Here’s the problem.
    Unless employees work in a company’s cybersecurity department, their motivation
    and incentives have nothing to do with cybersecurity. Most employees are cybersecurity
    agnostic. They don’t want their companies to suffer a cyber breach and don’t want
    to contribute to such a breach. But, given the proper motivation, employees will
    act in ways that can compromise your company’s cybersecurity.


    ### Get the Job Done


    One example of this dynamic comes from an Asian automobile manufacturer that suffered
    a US$1 billion loss because of an unpublicized cyber breach that compromised advanced
    R&D information. After the breach, senior executives directed the IT cybersecurity
    team to improve the protection of information relating to its development of new
    automobiles. The approach the cybersecurity team took was to embed the network
    used for automotive design within the corporate intranet. The rationale was that
    an external attacker would have to breach two networks instead of one to steal
    the company’s sensitive information. This borrows from European medieval castle
    protection practices that included both a moat and a wall.


    Unfortunately, the cybersecurity team did not understand the process of designing
    a car; the design team worked closely with external partners that needed to access
    and share the same information. By walling off the auto design network, the cybersecurity
    team blocked access to these external partners and, as a result, rendered the
    company’s own employees unproductive. So what did the employees do? They created
    fake employee accounts for their partners to access the information on the company’s
    intranet. None of the employees felt the need to tell anyone about what they were
    doing.


    Later, when we asked them if they understood that their actions exposed the company
    to increased cyber risk, they said yes. But they weren’t really apologizing. Since
    their job is to design cars, they didn’t think twice about removing an obstacle
    that was preventing them from moving forward. They were only concerned about the
    immediacy of the situation, in which they needed to get work done, and the certainty
    of the consequences—they’d miss a deadline.


    The increased cyber exposure that resulted from their actions was uncertain. Their
    external partners may or may not abuse their insider access. And if they do, it
    could be tomorrow, next month, next year, or beyond. Further, the employees are
    unlikely to hear about any abuse, even if it happens.


    ### Cybersecurity Disincentives


    Financial incentives can exacerbate the potential conflict between an employee
    doing a job and a company protecting itself. These incentives are tied either
    to individual accomplishments, such as meeting a stretch goal, or to department
    achievements, such as meeting a milestone. Take, for example, a new product release
    or corporate acquisition. Both activities should include a number of different
    cybersecurity tasks. For a new product, the company should select, implement,
    and test the right set of security features. For a corporate acquisition, the
    company should analyze the target company’s cybersecurity posture to support accurate
    pricing of the deal. But if performing these security tasks, or performing them
    well, delays the release or deal closure, cyber-risk reduction will take a backseat.
    Employees and executives get bonuses for meeting deadlines; they don’t get bonuses
    for missing a deadline, even if the reason is to prevent a downstream cyber incident
    whose impact would far eclipse that of launching a product a couple of weeks or
    months late.


    The Samsung Galaxy Note 7 is a case in point. The phone’s penchant for spontaneous
    combustion, covered extensively in the media, wasn’t the result of cyber vulnerabilities;
    rather, it was a mix of culture and incentives that put schedule ahead of safety.
    In hopes of exploiting a lackluster Apple iPhone release cycle, Samsung accelerated
    its production schedule, rushing a feature-rich product saddled with latent design
    and manufacturing defects to market. [../Text/26_9781633698000_notes.html#ch2_rfn26]
    In the aftermath, Samsung lost approximately US$9.5 billion in sales and US$5
    billion in profit, instead of gaining the competitive advantage it had hoped for.
    [../Text/26_9781633698000_notes.html#ch2_rfn27]


    ## Economics of Cyberattack


    Knowing the capabilities of potential adversaries has long been a staple of statecraft;
    this carries over to the digital world. The technical sophistication of cyber
    adversaries, especially nation-states, frequently factor into the selection of
    cyber defenses. A combination of market forces and technology is challenging some
    long-held assumptions in this area and is rendering the question “Who done it?”
    less relevant. These changes have a direct impact on cybersecurity investment
    as well as on the overall approach to assessing cyber risks.


    ### National Capabilities


    Many believe that certain cyber superpowers, such as North Korea, Russia, China,
    and the United States, have the necessary technical capabilities and resources
    to build sophisticated hacking tools beyond the reach of anyone else. This assumption
    is used both as a rationale for increased cybersecurity funding, and as an excuse
    when cybersecurity defenses fail. While it still takes a well-financed and technically
    sophisticated country to field an aircraft carrier, the same is not true to develop
    cyberattack tools.


    For example, two security researchers, Brian Meixell and Dillon Beresford, armed
    only with MacBook Pro laptops and no investment beyond their time, were able to
    demonstrate how they “could penetrate even the most fortified facilities in the
    world, without the backing of a nation state.” [../Text/26_9781633698000_notes.html#ch2_rfn28]
    They did this by exploiting a flaw in programmable logic controllers (PLCs) from
    a prominent manufacturer.


    PLCs are the workhorses of industrial automation. They control everything from
    robots on a factory floor to machinery in oil refineries and centrifuges in nuclear
    power plants. As is true of so many technologies and products, they were developed
    without considering cybersecurity, and as a result, the communications between
    PLCs are not always encrypted. This flaw enabled Meixell and Beresford to send
    specially crafted messages to a `PLC` with the result that they took complete
    control over it. They could make it operate incorrectly or not at all. Further,
    they could use one compromised `PLC` as a staging point to then take over all
    the `PLCs` within an entire industrial control system environment.

