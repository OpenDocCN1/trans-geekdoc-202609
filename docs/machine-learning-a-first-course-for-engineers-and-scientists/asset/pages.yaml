- pgno: 234
  md: '# 11 User aspects of machine learning


    Dealing with supervised machine learning problems in practice is to a great extent
    an engineering discipline where many practical issues have to be considered and
    where the available amount of work-hours to undertake the development is often
    the limiting resource. To use this resource efficiently, we need to have a well-structured
    procedure for how to develop and improve the model. Multiple actions can potentially
    be taken. How do we know what action to take and is it worth spending the time
    implementing it? It is for example spending an week collecting and labeling training
    data or should we do something else? These issues will be addressed in this chapter.
    Note that the layout of this chapter is thematic and not necessarily represent
    the sequential order in which the different issues should be addressed.


    # 11.1 Defining the machine learning problem


    Solving a machine learning problem in practice is an iterative process. We train
    the model, and from there suggest an action for improvement and train the model
    again, and so on. To do this efficiently, we need to tell whether a new model
    is improvement over the previous one or not. One way to evaluate the model after
    each iteration would be to put it into production (for example running a traffic-sign
    classifier in a self-driving car for a few hours). Besides the obvious safety
    issues, this evaluation procedure would be very time consuming and cumbersome.
    We would most likely be inaccurate since it would be hard to tell whether the
    proposed change was an actual improvement or not.


    A better strategy is to automate this evaluation procedure without the need to
    put the model into production each time we want to evaluate its performance. We
    do this by putting a validation dataset and a test dataset and evaluate the performance
    using a scalar evaluation metric. The validation and test datasets together with
    the evaluation metric will define the machine learning problem that we are solving.


    # Training, validation and test data


    In Chapter 4 we introduced the strategy of splitting the available data into training
    data, validation data and test data.


    +   - **Training data** is used for training the model.

    - **Hold-out validation data** is used for comparing different model structures,
    choosing hyperparameters of the model, feature selection, and so on.

    - **Test data** is used to evaluate the performance of the final model.


    All available data


    ![](img/9c84a60f9e70ea0bf5c7c51ae709df3e_234_0.png)


    This material will be published by Cambridge University Press. This pre-publication
    version is free to view and download for personal use only. Not for re-distribution,
    re-sale or use in derivative works.

    235

    Andreas Lindholm, Nils Wahlström, Fredrik Lindquist, and Thomas B. Schön 2021.'
