  md: '# 9.2 Bayesian linear regression


    From (9.10) we can also derive the posterior predictive for $f(x\star)$ by Corollary
    9.2 in Appendix 9,A.


    ```

    $p(f(x\star) | y) = N(f(x\star); m_*\star, s_*\star), \qquad (9.11a)\nm_*\star
    = x_*\star^T\mu_n, \qquad (9.11b)\ns_*\star = x_*\star^T\Sigma_n x_*\star. \qquad
    (9.11c)$

    ```


    We have so far derived the posterior predictive for $f(x\star)$. Since we have
    $y\star = f(x\star) + \epsilon$ correction to the linear regression model (9.10),
    where $\epsilon$ is assumed to be independent of variance $\sigma^2$, we can compute
    the posterior predictive for $y\star$


    ```

    $p(y\star | y) = N(y\star; m_*\star, s_*\star + \sigma^2). \qquad (9.11d)$

    ```


    Note, that only difference from $p(f(x\star) | y)$ is that we add the variance
    of the measurement noise $\sigma^2$ which reflects the additional uncertainty
    we expect to get from the data output. But in $p(f(x\star) | y)$ and $p(y\star
    | y)$ the measurement noise of the training data output is reflected via the posterior.


    We now have all pieces of Bayesian linear regression. The main difference to linear
    regression is that we compute a posterior distribution $p(\theta | y)$ (instead
    of a single value $\theta$) and a posterior predictive $p(y\star | y)$ of a prediction
    $\theta$. We summarize it as Method 9.1 and illustrate it with Example 9.1.


    # Learn Bayesian linear regression


    +   **Data:** Training data $T = \{x_i, y_i\}_{i=1}^n$\n**Result:** Posterior
    $p(\theta | y) = N(\mu_n, \Sigma_n)\n**1** Compute $\mu_n$ and $\Sigma_n$ as (9.10).


    # Predict Bayesian linear regression


    +   **Data:** Posterior $p(\theta | y) = N(\mu_n, \Sigma_n)$ and test input $x\star$\n**Result:**
    Posterior predictive $p(f(x\star) | y) = N(f(x\star); m_*\star, s_*\star)$


    +   1 Compute $m_*\star$ and $s_*\star$ as (9.11).


    # Method 9.1: Bayesian linear regression.


    We have so far assumed that the noise variance $\sigma^2$ is fixed. However one
    also is the parameter user to decide, by maximizing the marginal likelihood. Corollary
    9.2 gives us the marginal likelihood


    ```

    $p(y\star) = N(y\star; X\mu_n, \sigma^2 I + X\Sigma_n X^T). \qquad (9.12)$

    ```


    It is also possible to choose the prior variance $\sigma^2$ by maximizing (9.12).


    Just as linear regression it is also possible to use nonlinear transformations,
    such as polynomials, in Bayesian linear regression. We give an example of that
    in Example 9.2, where we return to the running regression example of car stopping
    distances. We can, however, go one step further and use the kernel trick from
    Chapter 8. That will lead us to the Gaussian process, which is the topic of Section
    9.3.'
