  md: 'Robustness is a very important property in applications where the training
    data is contaminated with outliers. It is not a binary property, and loss functions
    can be robust to a greater or smaller degree. Some of the commonly used loss functions,
    including the squared error, are unfortunately not particularly robust, and it
    is therefore important for the user to make an active and informed decision before
    resorting to these "default" options.


    From a statistical perspective we can link the loss function to the statistical
    properties of the model. First, the maximum likelihood approach provides a formal
    connection between the loss function and the probabilistic assumptions (the noise
    in the data). Secondly, for loss functions that are not derived from a likelihood
    perspective, we can relate the so-called asymptotic minimizer of the loss function
    to the statistical properties. The asymptotic minimizer refers to the model that
    minimizes the expected loss when over the true data generating distribution. Equivalently,
    we can think about the asymptotic minimizer as the solution to the optimization
    problem (5.4) when most of training data $n \to \infty$ (hence the name "asymptotic").
    If there is a unique asymptotic minimizer from which we can recover the true conditional
    distribution $p(y|x)$, then the loss function is said to be strictly proper. We
    will return to this concept briefly, in the context of binary classification.


    # Loss functions for regression


    In Chapter 3 we introduced the squared error loss


    ```

    $L(y, \bar{y}) = (y - \bar{y})^2,$$

    ```


    which is the default choice for linear regression since it simplifies the training
    to only solving the normal equations. The squared error loss is also used for
    other regression models, such as neural networks. Another common choice is the
    absolute error loss,


    ```

    $L(y, \bar{y}) = |y - \bar{y}|.$

    ```


    The absolute error is more robust to outliers than the squared error loss since
    it grows slower for larger errors, see Figure 5.1. In Chapter 3 we introduced
    the maximum likelihood motivation of the squared error by assuming the output
    is measured with additive noise $\epsilon$ from a Gaussian distribution, $\epsilon
    \sim \mathcal{N}(0,\sigma^2)$. We may consider the absolute error by assuming
    $\epsilon$ follows a Laplace distribution, $\epsilon \sim \mathcal{L}(0,b)$. We
    elaborate on the idea of deriving the loss function from the maximum likelihood
    objective and certain statistical assumptions below. There are also some commonly
    used loss functions for regression which are not natural to derive from a maximum
    likelihood perspective.


    It is sometimes argued that the squared error is a good choice because of its
    quadratic shape penalizes small errors ($\epsilon < 1$) linearly. However, the
    Gaussian distribution assumption (at least approximately) quite often in nature.
    However, the quadratic shape for large errors ($\epsilon > 1$) is reason for its
    non-robustness, and the Huber loss has been suggested as a hybrid between the
    absolute and squared error loss:


    Another extension to the absolute error loss is the e-insensitive loss,


    ```

    $L(y, \bar{y}) = \begin{cases} (y - \bar{y})^2 & \text{if } |y - \bar{y}| < 1,
    \ |y - \bar{y}| - \frac{1}{2} & \text{otherwise.} \end{cases}$

    ```


    ```

    $L(y, \bar{y}) = \begin{cases} 0 & \text{if } |y - \bar{y}| < \epsilon, \ |y -
    \bar{y}| - \epsilon & \text{otherwise.} \end{cases}$

    ```


    > As you might have noticed, the argument for the loss function of $y$ and $\bar{y}$
    varies with context. The reason for this is that different loss functions are
    most naturally expressed in terms of different quantities, for example the prediction
    $y$, the predicted conditional probability $p(y|x)$, the classifier margin, and'
