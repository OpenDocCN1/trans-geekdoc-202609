    which is the score of a randomly chosen member of the negative class. We further
    denote $F_N$ by the cumulative distribution of scores of the negative class, i.e.


    ```

    $F_N(r) = p(S_N < r) = \int_{-\infty}^{r} f_N(s)ds,$$

    ```


