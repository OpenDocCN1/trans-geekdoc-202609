  md: "# 8.4 Kernel theory\n\nThe $\\epsilon$-insensitive loss makes the dual parameter\
    \ vector $\\alpha$ sparse. Note that it does not mean the corresponding primal\
    \ parameter vector $\theta$ is sparse (their relationship is given by (8.16)).\
    \ Also note that (8.19b) is a constrained optimization problem (a constraint is\
    \ given by (8.19c)), and more theory than we have presented in Section 5.4 is\
    \ needed to derive a good solver.\nThe feature vector $\\Phi(x)$ that corresponds\
    \ to some kernels, like the squared exponential kernel (8.13), does not have a\
    \ constant offset term. Therefore an additional $b_0$ is sometimes included in\
    \ (8.19a) for support vector regression which adds the constraint $\\sum_i \\\
    alpha_i = 0$ to the optimization problem in (8.19b). The same addition could also\
    \ be made to kernel ridge regression (8.14b), but would break the closed-form\
    \ calculation of $\\alpha$ (8.14b).\n\n# Consclusions on kernels for regression\n\
    \nWith ridge regression and support vector regression we have been dealing with\
    \ the interplay between three different concepts, each of them on interest. To\
    \ clarify this, we repeat them in an ordered list:\n\n+   1. We have the primal\
    \ and dual formulation of a model. The primal formulation expresses the model\
    \ in terms of $\theta$ (fixed size $d$), where the dual formulation uses $\\alpha$\
    \ (one $\\alpha_i$ per data point $i$, hence $\\alpha$ has size $n$ no matter\
    \ what $d$ happens to be). Both formulations are mathematically equivalent, or\
    \ less useful in practice depending on whether $d > n$ or $n > d$.\n2. We have\
    \ kernels $(x, x')$ which allows to let $d \\to \\infty$ without explicitly formulating\
    \ an infinite vector of nonlinear transformations $\\Phi(x)$. This is practically\
    \ useful when using the dual formulation with $\\alpha$, since $d$ is the dimension\
    \ of $\theta$.\n3. We have used different losses. Kernel ridge regression makes\
    \ use of squared error loss, whereas support vector regression uses the $\\epsilon$-insensitive\
    \ loss. The $\\epsilon$-insensitive loss is particularly interesting in the dual\
    \ formulation, since it gives sparse $\\alpha$. (We will later use the hinge loss\
    \ for support vector classification in Section 8.5, which has a similar effect.)\n\
    \nWe will now add some addition on understanding the kernel concept in Section\
    \ 8.4, and thereafter introduce support vector classification in Section 8.5.\n\
    \n# 8.4 Kernel theory\n\nWe have defined a kernel as being function mapping from\
    \ the same space, and returning a scalar. We have also suggested that we can restrict\
    \ ourselves to positive semidefinite kernels, and presented two practically useful\
    \ algorithms—kernel ridge regression and support vector regression. Before we\
    \ continue and support support vector classification, we will discuss more about\
    \ the kernel concept, and also give a flavor of the theory behind it. To make\
    \ the discussion more concrete, let us start by introducing the kernel method,\
    \ namely kernel version of $k$-NN.\n\n# Introducing k-NN\n\nAs know from Chapter\
    \ 2, $k$-NN constructs the prediction for $\\mathbf{x}_*$ by taking the average\
    \ or a majority among $k$ nearest neighbors $\\mathbf{x}$. In its standard formulation,\
    \ \"nearest\" is defined by the Euclidean distance. Since the Euclidean distance\
    \ is always positive, we can consider the squared distance which can be written\
    \ in terms of the linear kernel $\\kappa(\\mathbf{x}, \\mathbf{x}')$\n\n```\n\
    $\\|\\mathbf{x} - \\mathbf{x}'\\|^2 = (\\mathbf{x} - \\mathbf{x}') \\cdot (\\\
    mathbf{x} - \\mathbf{x}') = \\kappa(\\mathbf{x}, \\mathbf{x}) + \\kappa(\\mathbf{x}',\
    \ \\mathbf{x}') - 2\\kappa(\\mathbf{x}, \\mathbf{x}') = (\\mathbf{x} \\cdot \\\
    mathbf{x}) + (\\mathbf{x}' \\cdot \\mathbf{x}') - 2(\\mathbf{x} \\cdot \\mathbf{x}')$.\n\
    ```\n\nTo generalize the $k$-NN algorithm we will allow the linear kernel to be\
    \ replaced by any, say, positive semidefinite kernel $\\kappa(\\mathbf{x}, \\\
    mathbf{x}')$ in (8.20). Kernel $k$-NN works as standard $k$-NN, but determines"
