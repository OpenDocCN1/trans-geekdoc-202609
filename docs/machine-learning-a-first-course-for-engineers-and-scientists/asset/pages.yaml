    \ as\n\n```\ny = \\theta_0 + \\theta_1x_1 + \\theta_2x_2 + \\dots + \\theta_px_p\
    \ + \\varepsilon = [\\theta_0 \\ \\theta_1 \\ \\dots \\ \\theta_p]^T \\mathbf{x}\
    \ + \\varepsilon. \\quad (3.3)\n```\n\nThis notation means that the symbol x is\
    \ used for both the $p+1$ and the $p$ dimensional version of the input vector,\
    \ or without the constant in the leading position, respectively. This is only\
    \ a matter of book-keeping for handling the intercept term $\theta_0$. Which definition\
    \ is used will be clear from context and carries no deeper meaning.\n\nThe linear\
    \ regression model is a parametric function of the model (3.3). The parameters\
    \ $\theta$ can take arbitrary values, and those we assign will control the input–output\
    \ relationship described by the model. Learning of the model therefore amounts\
    \ to finding suitable values for $\theta$ based on observed data. Before discussing\
    \ how to do this, however, let us first look at how to use the model once it has\
    \ been learned.\n\nThe goal in supervised machine learning is making predictions\
    \ $\\widehat{y}(\\mathbf{x}^*)$ for new, unseen inputs $\\mathbf{x}^* = [1, x_1^*,\
    \ \\dots x_p^*]^T$. Let us assume that we have already learned some parameter\
    \ values $\\hat{\theta}$ for the linear regression model. We use the symbol $\\\
    hat{}$ to indicate that $\\hat{\theta}$ contains learned values of parameters.\
    \ Since the noise $\\varepsilon$ is random with zero mean and independent of all\
    \ observed variables, we must replace $\\varepsilon$ with $0$ in the prediction.\
    \ That is, a prediction from the linear regression model takes the form\n\n```\n\
    \\widehat{y}(\\mathbf{x}^*) = \\hat{\theta}_0 + \\hat{\theta}_1x_1^* + \\hat{\t\
    heta}_2x_2 + \\dots + \\hat{\theta}_px_p^* = \\hat{\theta}^T \\mathbf{x}^*. \\\
    quad (3.4)\n```\n\nThe noise $\\varepsilon$ is often referred to as an irreducible\
    \ error or aleatory uncertainty in the prediction. We illustrate the predictions\
    \ made by a linear regression model in Figure 3.1.\n\n![](img/9c84a60f9e70ea0bf5c7c51ae709df3e_37_0.png)\n\
    \n**Figure 3.1:** Linear regression with $p=1$: The black dots represent $n=3$\
    \ data points, from which a linear regression model (blue line) is learned. The\
    \ model does not fit the data perfectly, so there is a remaining error corresponding\
    \ to the noise $\\varepsilon$ (red). The model can be used to **predict** (blue\
    \ circle) the output $\\widehat{y}(\\mathbf{x}^*)$ for a test input $\\mathbf{x}^*$.\n\
    \n# Learning linear regression from training data\n\nLet us now discuss how to\
    \ learn a linear regression model, that is learn $\\theta$, from training data\
    \ $\\mathcal{T} = \\{\\mathbf{x}_i, y_i\\}_{i=1}^n$. We collect the training data,\
    \ which consists of $n$ data points with inputs $\\mathbf{x}_i$, and outputs $y_i$,\
    \ in the $n \\times (p+1)$\n\n> From the Latin word aleator, meaning dice-player."
