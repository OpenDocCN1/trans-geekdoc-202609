  md: "# 9 The Bayesian approach and Gaussian processes\n\n![](img/9c84a60f9e70ea0bf5c7c51ae709df3e_187_0.png)\n\
    \n(a) 6-dimensional Gaussian distribution, plotted in the same as Figure 9.4,\
    \ that is, only its marginals are illustrated.\n\n(b) The conditional distribution\
    \ $f_1, f_2, f_3, f_5$ and $f_6$ when $f_4$ is observed (black dot), is also affected\
    \ by this observation (red lines) similarly to Figure 9.4b.\n\n![](img/9c84a60f9e70ea0bf5c7c51ae709df3e_187_1.png)\n\
    \n**Figure 9.5:** A 6-dimensional Gaussian distribution, illustrated in the same\
    \ fashion as Figure 9.4.\n\nFigure 9.3b. In Figure 9.4 we have plotted the marginal\
    \ distributions from Gaussian 9.3. Since $f_1$ and $f_2$ are correlated according\
    \ to the prior, the marginal distribution of $f_3$ is also affected by this observation.\n\
    \ a similar fashion to Figure 9.4 we can plot a 6-dimensional multivariate Gaussian\
    \ distribution by its margins in this model we assume a positive correlation between\
    \ all elements $f_i$ and $f_j$ with the distance between their corresponding inputs\
    \ $x_i$ and $x_j$. Bear in mind that fully illustrate the joint distribution for\
    \ $f_1 \\dots f_6$, a 6-dimensional surface plot would be needed, whereas Figure\
    \ 9.5a only contains the marginal distributions for each component. We may also\
    \ condition the 6-dimensional Gaussian 9.5a on an observation of, $f_4$. For example,\
    \ the conditional distribution is another Gaussian, and the marginal distributions\
    \ of the 5-dimensional random variable $(f_1, f_2, f_3, f_5, f_6)^\\mathsf{T}$\
    \ are plotted in Figure 9.5b.\nIn Figure 9.4 and 9.5 we illustrated the marginals\
    \ for a finite-dimensional multivariate Gaussian random variable. However, we\
    \ are dealing with the Gaussian process, which is a stochastic process on a continuous\
    \ space.\n\nThe extension of the Gaussian distribution (defined on a finite set)\
    \ to the Gaussian process (on a continuous space) is achieved by replacing the\
    \ index $\\{1, 2, 3, 4, 5, 6\\}$ in Figure 9.5 by a varying values on a continuous\
    \ space, for example the real line. We then have to replace the random variables\
    \ $f_1, f_2, \\dots, f_n$ with a random function (that is, a stochastic process)\
    \ $f$ which can be evaluated at any $x$ in space. Furthermore, in the multivariate\
    \ distribution $\\mu$ is a vector with $q$ components, and $\\Sigma$ is a $q \t\
    imes q$ matrix. Instead of having a hyperparameter for each element in this mean\
    \ and covariance matrix, in the Gaussian process we replace $\\mu$ by a mean function\
    \ $\\mu(x)$ which we can insert any $x$, and the covariance matrix $\\Sigma$ is\
    \ replaced by a covariance function $k(x, x')$ which we can insert any $x$ and\
    \ $x'$. This mean and covariance function can we parametrize with few hyperparameters.\
    \ In these functions we can enforce properties that we want the Gaussian process\
    \ to obey, for example that two functions $f(x_1)$ and $f(x_2)$ should be more\
    \ correlated if $x_1$ and $x_2$ are closer to each other, than if they are far\
    \ apart.\n\nThe Gaussian property holds. For any finite set of points $(x_1, \\\
    dots, x_n)$, we have\n\n```\n$p \\begin{pmatrix} f(x_1) \\ \\vdots \\ f(x_n) \\\
    end{pmatrix} = \\mathcal{N} \\left( \\begin{pmatrix} \\mu(x_1) \\ \\vdots \\ \\\
    mu(x_n) \\end{pmatrix}, \begin{pmatrix} k(x_1, x_1) & \\dots & k(x_1, x_n) \\\
    \ \\vdots & \\ddots & \\vdots \\ k(x_n, x_1) & \\dots & k(x_n, x_n) \\end{pmatrix}\
    \ \right) \\quad (9.18)$\n```\n\nthen $f$ is a Gaussian process.\n\nThat is, with\
    \ a Gaussian process and any choice of $\\{x_1, \\dots, x_n\\}$, the vector values\
    \ of $[f(x_1), \\dots, f(x_n)]$ has a multivariate Gaussian distribution, just\
    \ like the one in Figure 9.5.\n\n188 Draft (April 30, 2021) of Machine Learning\
    \ – A First Course for Engineers and Scientists. http://mlbook.org\nAndreas Lindholm,\
    \ Niklas Wieferroth, Fredrik Dunlin, and Thomas B. Schön. 2021."
