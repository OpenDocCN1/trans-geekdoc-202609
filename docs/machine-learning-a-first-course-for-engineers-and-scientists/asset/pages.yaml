    # Error analysis


    Another strategy to identify actions that can improve the model is to perform
    *error analysis*. Below we only describe error analysis for classification problems,
    the same strategy can be applied to regression problems as well.


    In error analysis we usually look at a subset, 100 data points, of the validation
    data that the model classified incorrectly. Such an analysis does not take much
    time, but may give valuable clues as to what type of data the model is struggling
    with and how much improvement we can expect by fixing these issues. We illustrate
    our procedure with example.


    > Example 11.1: Error analysis applied to vehicle detection


    Consider a classification problem of detecting cars, bicycles and pedestrians
    in an image. The model takes an image as input and outputs one of four classes:
    car, pedestrian, or other. Assume that the model has a classification accuracy
    of 90% on validation data.


    When looking at a subset of 100 images that were misclassified in the validation
    data, we make the following observations:


    +   * All 10 images of pedestrian that were incorrectly classified as bike when
    taken in dark conditions with the pedestrian being equipped with safety reflectors.

    * 30 images were substantially tilted.'
