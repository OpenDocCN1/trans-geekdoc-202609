    \ between flexibility and rigidity. While selecting $k$ too big or too small will\
    \ lead to a meaningless classifier, there exists a sweet spot for some moderate\
    \ $k$ (possibly 20, but it could be less or more) where the classifier generalizes\
    \ the best. Unfortunately, there is no easy answer to for which $k$ is and it\
    \ is different for different problems. In the music classification it seems that\
    \ $k=20$ will predict new test data better than $k=1$, but there might very well\
    \ be an better choice of. For the car problem the behavior is also more reasonable\
    \ than $k=20$, for the boundary for large $x$ $k$-NN is able to capture the trend\
    \ in the data as $x$ increases (simply because the 20 nearest neighbors are the\
    \ same for all tests $x$, around 35). A systematic choice of good value for $k$\
    \ is to use cross-validation, which we will discuss in Chapter 4.\n\n> Time limit\
    \ 2.1: The prediction $\\hat{v}(x_i)$ obtained using $k$-NN method is a piecewise\
    \ constant function of the input $x_i$. For a classification problem this is natural,\
    \ since the output is categorical (see, for example, Figure 2.5 where the colored\
    \ regions correspond to areas of the input space where the prediction is constant\
    \ according to the color of that). However, also for regression problems, k-NN\
    \ will have piecewise predictions. Why?\n\n![](img/9c84a60f9e70ea0bf5c7c51ae709df3e_25_0.png)\n\
    \n# Input normalization\n\nA important practical aspect when using $p=2$ input\
    \ variables $x = [x_1, x_2]^T$ is the importance of normalization of the input\
    \ data. Imagine a training dataset with values of $x_1$ in the much larger range\
    \ [100, 1100] and the values for $x_2$ in the smaller range [0, 1]. It could be\
    \ that $x_1$ and $x_2$ are measured in different units. The Euclidean distance\
    \ between a test point $x$, and a training point $x_i$ is $\\|x - x_i\\|_2$. This\
    \ expression will be dominated by the first term $(x_1 - x_{i,1})^2$, the second\
    \ term $(x_2 - x_{i,2})^2$ tends to have a much smaller effect, simply due to\
    \ the different magnitude of $x_1$ and $x_2$. That is, the difference leads $x_1$\
    \ to be considered more important than $x_2$ by $k$-NN.\n\nTo avoid this effect\
    \ we can re-scale the inputs. One option, in the mentioned example, it could be\
    \ to subtract 100 from $x_1$ and thereafter divide by 1000 and $x_1^{new} = \\\
    frac{x_1-100}{1000}$ such that $x_1$ and both are in the range [0, 1]. More generality,\
    \ this normalization for the input data can be written\n\n```\n$x_{ij}^{new} =\
    \ \\frac{x_{ij}-min(x_{ij})}{max(x_{ij})-min(x_{ij})} \\quad j=1,\\dots,,p, \\\
    quad i=1,\\dots,,n, \\quad (2.1)\n```\n\nAnother common way of normalization (sometimes\
    \ scaling) is by using the mean and standard deviation in the training data:\n\
    \n```\n$x_{ij}^{new} = \\frac{x_{ij}-\bar{x}_j}{\\sigma_j} \\quad j=1,\\dots,,p,\
    \ \\quad i=1,\\dots,,n_s, \\quad (2.2)\n```\n\nIt is crucial for $k$-NN to scale\
    \ each input (normalization that was done in Figure 2.5), but it is a good practice\
    \ to apply this when using other methods, or hence for numerical stability. It\
    \ is however important to compute the scaling factors $(\bar{x}_j, \\sigma_j)$\
    \ using training data and then applying scaling to future test data. Failing this,\
    \ we might lead to wrong conclusions on how the model will perform on prediction\
    \ (not yet seen) data."
