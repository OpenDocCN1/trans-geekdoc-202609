    confusion matrices for non-Swedes and Swedes.


    Let''s focus on the question as to whether the algorithm performs equally on both
    groups, non-Swedes and Swedes. We might call this fairness. Does the method treat
    the two groups fairly? To answer this question we need to quantify fairness. One
    suggestion would be to ask if the method performs equally for both groups. Referring
    to Table 4.1, and Chapter 4 in general, we see that one


