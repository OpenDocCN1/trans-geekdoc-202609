    # 1.3 Further reading


    There are now quite a few extensive textbooks available on the topic of machine
    learning which introduce the area in different ways compared to what we do in
    this book. We will only mention a few here. The book of Hastie et al. 2009 introduce
    the area of statistical learning in a mathematically solid and accessible manner.
    A few years later the authors released a different version of their book (James
    et al. 2013) which is mathematically lighter, conveying the main ideas in an even
    more accessible manner. These books do not venture neither into the world of Bayesian
    methods nor the world of neural networks. There are several other complementary
    books doing exactly that, see e.g. Bishop (2006) and Murphy (2021). MacKay (2003)
    provides a rather early dealing interesting and useful connections to information
    theory. It is very much worth looking into. The book by Shale-Shwartz and Ben-David
    (2014) provides an introduction with a clear focus on the underpinning machine
    learning—with mathematics. It is a perfect book for those of us readers would
    like to deepen their understanding of the theoretical background of the area.
    We also mention the work of Elfron and Hastie (2016), where the authors take a
    constructive historical approach to the development of the area covering the revolution
    in data analysis. With Smith (2017), Contemporary approaches to the mathematics
    of machine learning are provided by Strang (2019) and Deisenroth et al. (2019).


    For a full account of the work on automatic diagnosis of heart abnormalities,
    Ribeiro et al. 2020 and for a general introduction to use of machine learning—particular
    deep learning—in medicine we point to Topol (2019). The application of kernel
    ridge regression to elaspolite crystals was borrowed from Faber et al. (2016).
    Other applications of machine learning in materials science are reviewed in the
    collection edited by Schütt et al. (2020). The London air pollution study was
    proved by Hamelj et al. (2019) where the authors introduce interesting and useful
    developments of the Gaussian process model that we explain in Chapter 9. When
    it comes to semantic segmentation, the ground-breaking work of Long et al. 2015
    has received a massive interest. The two main base lines for the current development
    in semantic segmentation are Zhao et al. (2017) and L.-C. Chen et al. (2017).
