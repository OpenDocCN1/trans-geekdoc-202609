  md: '# 3 Basic parametric models and a statistical perspective on learning


    # 3.2 Classification and logistic regression


    After presenting a parametric method for solving the regression problem, we now
    turn our attention to classification. As we will see, with a modification of the
    linear regression model we can apply it to the classification problem as we will,
    however at the cost of most not being able to use the convenient normal equations.
    Instead we have to resort to numerical optimization for learning the parameters
    of the model.


    # A statistical view of the classification problem


    Supervised machine learning amounts to predicting the output from the input. With
    a statistical perspective, classification amounts to predicting the conditional
    class probabilities


    ```

    p(y = m|x) (3.25)

    ```


    where y is the output (1, 2, . . . or M) and x is the input.³ In words, p(y =
    m|x) describes the probability for class m given that we know the input x. Talking
    about p(y|x) implies we think about the class label y as a random variable. Why?
    Because we choose to model the real world, from where data originates, as a certain
    amount of randomness (like the error e in regression). Let illustrate with an
    example.


    > Example 3: Describing behavior using probabilities

    We want to construct a model that can predict preferences (y = y, the categorical
    output) for population groups (x = the input). However then we have to face the
    fact that not everyone in a certain population group will vote for the same party.
    We can then predict of y as a random variable which follows a probability distribution.
    If we know the vote count in the group of 45 year old women (x = x) is 13% for
    the certain party, 39% for the turquoise party and 48% for the purple party (here
    we have M=3), we could describe it as

    p(y = cerise party | x = 45 year old women) = 0.13,

    p(y = turquoise party | x = 45 year old women) = 0.39,

    p(y = purple party | x = 45 year old women) = 0.48.


    In this way, the probabilities p(y|x) describe the non-trivial fact that


    +   (a) all 45 year old women do not vote for the same party,

    (b) the choice of party does not appear to be completely random among 45 year
    old women either; the\purple party is the most popular, and the cerise party is
    the least popular.


    Thus, it is useful to have a classifier which predicts not only a class y (one
    party), but a distribution over classes p(y|x).


    We now aim to construct a classifier which can not predict classes, but also the
    class probabilities p(y|x). For binary classification problems (M=2, and y is
    either 1 or -1), we learn a model g(x)


    ```

    p(y = 1 | x) is modeled by g(x). (3.26a)

    ```


    By the laws of it, it holds that p(y = 1|x) + p(y = -1|x) = 1, which means that


    ```

    p(y = -1 | x) is modeled by 1 - g(x). (3.26b)

    ```


    Since g(x) is a model for a probability, it is natural that 0 ≤ g(x) ≤ 1 for any
    y. We will see how this constraint can be enforced below.


    > ³We use the notation p(y|x) to denote probabilities (y is discrete) or as densities
    (continuous).'
  merge: -1
  img_proc: true
- pgno: 44
  md: '![](img/9c84a60f9e70ea0bf5c7c51ae709df3e_44_0.png)


    For the multiclass problem, we instead let the classifier return a vector-valued
    function g(x), where


    ```

    $$\begin{aligned} p(y=1|x) &= g_1(x) \ p(y=2|x) &= g_2(x) \ \vdots &= = g(x).
    \ p(y=M|x) &= g_M(x) \end{aligned}$ (3.27)$

    ```


    In words, each element $g_m(x)$ of g corresponds to the conditional class probability
    $p(y=m|x)$. Since g models a probability vector, we require that each element
    $g_m(x) \ge 0$ and $\|g(x)\|_1 = 1$ for any $x$.


    # The logistic regression model for binary classification


    We will now introduce the logistic regression model, which is one possible viewed
    as a method of modeling class probabilities. Logistic regression can be viewed
    as a linearization of the regression model so that it fits the classification
    (instead of the problem).


    We start with binary classification. Wish to learn a function g(x) that approximates
    the probability of the positive class, see (3.26). To this end, we start with
    the logistic regression model which, with the noise term, is given by


    ```

    $z = \theta_0 + \theta_1x_1 + \theta_2x_2 + \dots + \theta_px_p = \theta^Tx.$
    (3.28)$

    ```


    This is a mapping which takes x and returns z, which in this context is called
    the *logit*. z takes values on the entire real line, whereas we need a function
    that returns a value in the interval [0, 1]. The key idea of logistic regression
    is to ''squeeze'' $z$ from (3.28) to the interval [0, 1] by using the logistic
    function $h(z) = \frac{e^z}{1+e^z}$, see Figure 3.4. This results in


    ```

    $g(x) = \frac{e^z}{1+e^z}.$ (3.29a)$

    ```


    which is restricted to [0, 1] and can be interpreted as a probability. This (3.29a)
    is the logistic regression model for $p(y=1|x)$.


    ```

    $1-g(x) = 1-\frac{e^z}{1+e^z} = \frac{e^{-z}}{1+e^{-z}}$ (3.29b)$

    ```


    In a nutshell, the logistic regression model is linear regression appended with
    the logistic function. This is for the reason (somewhat confusing name) but that
    logistic regression is a method for classification. The reason for why there is
    no noise term $\varepsilon$ in (3.28), as we had in the linear regression model
    (3), is that the randomness in classification is statistically modeled by the
    class probability construction $p(y=m|x)$ of an additive noise $\varepsilon$.'
