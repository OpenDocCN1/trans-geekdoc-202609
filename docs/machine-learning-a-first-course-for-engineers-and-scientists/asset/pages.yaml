    # Missing data


    A common practical issue is that data are sporadically missing. Throughout this
    book so far the data has always consisted of consistent input-output pairs $[x_i,
    y_i]_n$, and missing data refers to the situation where some (a few) values from
    either the input $x_i$ or the output $y_i$, for some $i$, are missing. If the
    output $y_i$ is missing, we can also refer to it as unlabeled data. It is a common
    practice to note missing data with a NaN (not a number), but less obvious codes
    also exists, such as cod. Reasons for missing data could be a malfunctioning sensor
    or similar issues at the data collection time, or when certain values for some
    reason have been discarded during the data processing.


    As for outliers, a sensible first option is to figure out the missing data. By
    going back to the data provider this issue could potentially be fixed and the
    missing data recovered. If this is not possible, there is some common practice
    which we use as a guideline. If the output $y_i$ is missing, the data point is
    useless for supervising machine learning. In the following, we assume that the
    missing values are only in the input $x_i$.


    The easiest way to handle missing data is to discard the data points (rows in
    $X$) where $Y$ is missing. That is, if some feature is missing in $x$, the entire
    input $x_i$ and its $ output $y$ is discarded from the data, and we are left with
    a smaller dataset. If the dataset that remains after this procedure still contains
    all data, this approach can work well. However, if it would lead to a too small
    dataset, it is of course problematic. More subtle, but also important, is the
    situation when the data is missing in a systematic fashion, for example that missing
    data is more common for a certain class. In such a situation, discarding data
    points with missing data would lead to a mismatch between reality and training
    data, which may degrade the performance of the learned model.


    If missing data is common, but for certain features, another easy option is to
    not use those features (“column of $X$”) which are suffering from missing data.
    It depends on whether this is a fruitful approach or not. Instead of discarding
    data, if the/th feature $x_j$ is missing from data point $x_i$, A simple imputation
    strategy would be to take the mean or median of $x_j$, for all other data points
    (if it is a classification problem). It is also possible to come with more complicated
    imputation strategies, but each imputation strategy implies


