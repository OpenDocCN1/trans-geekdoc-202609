- pgno: 60
  md: '# 4.2 Estimating $E_{new}$


    If the amount of available data is more limited, this becomes a problem. We are
    in practice faced with the following dilemma: *the better we want to know $E_{new}$
    (more hold-validation data gives less variance in $E_{hold-out}$), the worse we
    have to make it* (less training data increases $E_{new}$). That is not very satisfying,
    and we have to look for an alternative to the hold-out validation approach.


    # **k-fold cross-validation:** $E_{k-fold} \approx E_{new}$ without setting aside
    validation data


    To avoid setting validation data, but still obtain an estimate of $E_{new}$, one
    could suggest a two-step procedure of


    +   (i) splitting the data into training and one hold-validation set, train the
    model on the training data and compute $E_{hold-out}$ using hold-validation data
    (as in Figure 4.1), and then

    (ii) training the model again, using the entire dataset.


    By such procedure, we get an estimate of $E_{new}$ at the same time as a model
    trained on the entire dataset. That is not bad, but not perfect. Why to achieve
    small variance in the estimate, we have to put lots of data in the hold-out validation
    data in step (i). Unfortunately the model trained in (i) will be quite different
    from the one obtained in step (ii), and the estimate of $E_{new}$ concerns from
    step (i), not the possibly different model from step (ii). This will not give
    us a good estimate of $E_{new}$. However, we can use this idea to obtain the useful
    k-fold cross-validation method.

    We would like to use all available data to train a model, and at the same time
    get an estimate of $E_{new}$ for that model. By *k-fold cross-validation* we can
    approximately achieve this. The idea of k-fold cross-validation is to simply repeat
    the hold-out validation approach multiple times with different hold-out datasets
    each time, in the following:


    +   (i) split the dataset in $k$ batches of similar size (see Figure 4.2), and
    the remaining batches as training data

    (ii) take each batch $\ell$ as the hold-out validation data, and

    (iii) train the model on the training data, and compute $E_{hold-out}^{(\ell)}$
    as the average error on the hold-out validation data, as (4.6)

    (iv) if $\ell < k$, then $\ell \leftarrow \ell + 1$ and return to (ii). This is
    the k-fold cross-validation error


    ```

    $E_{k-fold} \triangleq \frac{1}{k} \sum_{\ell=1}^{k} E_{hold-out}^{(\ell)}$

    ```


    +   (v) train the model again, using this the entire dataset


    This procedure is illustrated in Figure 4.2.

    With $k$-fold cross-validation, we get a model which is trained on all data, as
    well as an approximation of $E_{new}$ for that model, namely $E_{hold-out}$ (Section
    4.2) was an unbiased estimate of $E_{new}$ (to the cost of setting aside hold-out
    validation data), this is not the case for $E_{k-fold}$. With large $k$, it turns
    out to be a sufficiently good approximation. Let us to understand why k-fold cross-validation
    works.


    First, we have to distinguish between the final model, the which is trained on
    all data except a $1/k$ fraction of the data in step (iii). The key in $k$-fold
    cross-validation is if $k$ is large enough, the intermediate models are similar
    to the final model (since they are trained on almost the same dataset), each intermediate
    $E_{hold-out}^{(\ell)}$ is an unbiased but high-variance estimate of $E_{new}$
    for the corresponding *intermediate index*. Since all intermediate and final models
    are similar, $E_{k-fold}$ (4.7) is approximately the average of $k$ high-variance
    estimates of $E_{new}$, for the final model. When averaging, the variance decreases
    and $E_{k-fold}$ will become a better estimate of $E_{new}$ *hold-out*'
