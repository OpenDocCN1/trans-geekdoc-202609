  md: '# # 12 Ethics in machine learning


    **by David Sumpter¹


    In this chapter we give three examples of ethical challenges that an apparently
    ''neutral'' design choice in how we implement machine learning applications. These
    are all examples where the performance of a machine learning model leads to an
    unexpected consequence for its users or society. For each case study, we give
    concrete examples. In example, we will emphas ethics through awareness, instead
    of attempting a technical solution to ethical dilemmas, we explain how they impact
    our machine learning engineers.


    There are many other ethical issues arising from applications of machine learning
    than are covered in this chapter. These range from issues of medical privacy and
    social data collection on individuals (Pasquale 2015) and online advertising which,
    for example, identifies the most vulnerable people in society and targets them
    with online gambling, unnecessary health services and high interest loans (O''neil
    2016); to the use of machine learning to develop weapons and oppressive technology
    (Russell et al. 2015). In addition to this, there is significant evidence in the
    tech industry (Alffrey and Twin 2017).


    These issues are (in many cases more important to society than the issues we cover
    here) and the qualified scientist should become interested in the course. But
    they are largely beyond the scope of this book. Instead, here we look specifically
    at examples where the technical properties of the machine learning techniques
    we have learned so far become intertwined with ethics. It turns out that this
    subset of cases is substantial in size.


    # ## 12.1 Fairness and error functions


    At first sight, the choice of an error function (4.1) might appear an entirely
    technical issue, without any ethical ramifications. After all, the error function
    is to find out how well a model has performed on test. It should be given so that
    we can then control our methods as we want to. We might (naively) assume that
    a technical decision of this nature is neutral. To investigate how such an assumption
    plays out, let''s look at an example.


    ### Fairness through awareness


    Imagine you have created a supervised machine learning model to find people who
