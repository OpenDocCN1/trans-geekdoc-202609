    the training data, they are not likely to be the best for new unseen data. As
    we discussed in the context of k-NN, we refer to this as overfitting.


    In decision trees we can mitigate overfitting by using smaller trees. Consequently
    we get larger and larger regions with an increased averaging, resulting in decision
