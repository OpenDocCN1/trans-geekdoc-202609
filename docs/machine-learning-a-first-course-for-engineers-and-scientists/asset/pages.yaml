- pgno: 199
  md: '# 9 The Bayesian approach and Gaussian processes


    # 9.5 Other Bayesian methods in machine learning


    Bes不起 the Bayesian approach in general, this chapter contains the Bayesian treatment
    of linear regression (Bayesian linear regression, Section 9.2) and kernel ridge
    regression (Gaussian processes, Section 9.3-9.4). The Bayesian approach is, however,
    applicable to all methods that learns a model from data. The reason for the selection
    of methods in this chapter is firstly that Bayesian linear regression and Gaussian
    process regression are the few supervised Bayesian methods where the posterior
    and/or the posterior predictive are easy to compute.


    Most often the Bayesian approach requires numerical integration routines as numerical
    methods for representing the posterior distribution (the posterior does not have
    to be a Gaussian or any other standard distribution) when applied to various models.
    There are two major families of such numerical methods variational inference and
    Monte Carlo methods respectively. The development of variational inference is
    to approximate probability distributions in such a way that the problem becomes
    tractable whereas Monte Carlo methods represent distributions using random samples
    from them.


    The Gaussian process model is an example of a method belonging to the family of
    Bayesian nonparametric methods. Another method in that family is the Dirichlet
    process, which can be used for the unsupervised clustering problem (see Chapter
    10) with no need to specify the number of clusters.


    Another direction is the Bayesian approach applied to deep learning, often referred
    to as Bayesian deep learning. In short, Bayesian deep learning amounts to computing
    the posterior p(θ|y), instead of only parameter values θ. In so stochastic gradient
    descent has to be replaced with either some version of variational inference or
    some Monte Carlo method. Due to the massive number of parameters used in deep
    learning, this is a computationally challenging problem.


    # 9.6 Further reading


    The Bayesian approach has a long history within statistics. The name originates
    from Thomas Bayes and his 1763 posthumously published work "Essay towards solving
    a Problem in the Doctrine of Chances", also Pierre-Simon Laplace made significant
    contributions to the idea in the late 18th and early 19th century. For an overview
    of its use in statistics and its historical contours, we refer to Efron and Hastie
    (2016, Part I).


    A relatively short review of modern Bayesian machine learning with many suggestions
    for further reading is Ghrahmani (2015). There are also several textbooks on the
    use of the Bayesian approach in machine learning, including Barber (2012), Gelman
    et al. (2014) and Grolshaus and Girolami (2017), and to some also Bishop (2016)
    and Murphy (2012).


    Gaussian processes are covered in the textbook Rasmussen and Williams (2006).
    Other Bayesian nonparametric models in general and the Dirichlet process are introduced
    by Gershman and Blei (2012), Ghrahmani (2013), and Hjort et al. (2010).


    As mentioned above, the Bayesian approach often requires advanced computational
    methods not discussed in this chapter. For further studies of variational inference
    we refer to Bishop (2006, Chapter 10) and Blei et al. (2017). Introduction to
    Monte Carlo methods are found in Owen (2013), Robert and Casella (2004) and Gelman
    et al. (2014, Part III).


    Although a very recent topic, the idea of Bayesian learning of neural networks
    was laid out already in the 90''s (R. M. Neal 1996). Some more recent contributions
    include Blundell et al. (2015), Dusenberry et al. (2020), Fort et al. (2019),
    and R. Zhang et al. (2020).'
