  md: '# 5 Learning parametric models


    regression, whereas $p(y=1|x)$ can be almost arbitrarily complicated in real world
    applications. It is therefore not sufficient to use a strictly proper loss function
    in order to accurately predict class probabilities, but our model also has to
    be flexible enough. This discussion is only valid in the limit $n \to \infty$.
    However, in practice $n$ is finite, and we may ask how large $n$ has to be for
    a flexible enough model to at least approximately learn the asymptotic minimizer?
    Unfortunately, we cannot give any numbers, but following the same principles as
    the overfitting discussion in Chapter 4, the more flexible the model the larger
    $n$ is required. If it is not large enough, the predicted conditional probabilities
    tend to "overfit" to the training data. In summary, using a strictly proper loss
    function will encourage the training procedure to learn a model that is faithful
    to the true statistical properties of the data, but in itself it is not enough
    to guarantee that these properties are well described by the model.


    In many practical application, having access to reliable uncertainty estimates
    regarding a model''s predictions, not only in terms of accuracy or expected errors,
    but also in terms of its statistical properties. In such cases it is thus important
    to validate the model, not only in terms of accuracy or expected errors. One approach
    is to evaluate the so-called *calibration* of the model, which however is beyond
    the scope of this book.'
