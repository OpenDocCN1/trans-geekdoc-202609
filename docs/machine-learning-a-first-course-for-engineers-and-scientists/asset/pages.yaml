  md: '# 11 User agents of machine learning


    If the outliers are not of any interest, the first thing we should do is to consult
    the data provider to identify the reason for the outliers or if something could
    be changed in the data collection to avoid these outliers, for example if outliers
    are unavoidable, there are basically two approaches one could take. The first
    approach is to simply delete (replace) the outliers in the data. Unfortunately
    this means we have to first find the outliers, which can be hard, but sometimes
    some thresholding and manual inspection (that is, look at all data points whose
    output is smaller/larger than value) can help. Once the outliers are removed from
    the data, one can proceed. The second approach is to make the learning robust
    against outliers, by using a robust function with such absolute error of squared
    error loss (see Chapter 5 for more details). Making a model more robust amounts,
    to some extent, making it less flexible. However, robustness amounts to be making
    the model less flexible in a particular way, by putting less emphasis on the data
    points where predictions are severely wrong.


    If the outliers are of interest to predict, they are not really an issue, but
    rather a challenge. We have to use a model that is flexible enough to capture
    the behavior (small bias). This has to be done with care, since very models have
    a high risk of overfitting to noise. If it turns out the outliers in a classification
