  md: '# 9.2 Bayesian linear regression


    for the hyperparameters, $p(\eta \mid y)$ is the full Bayesian solution, but sometimes
    that is too computationally challenging.


    A more pragmatic approach is to select $\hat{\eta}$ using cross-validation instead.
    It is perfectly possible to use cross-validation, the Bayesian approach also comes
    as an alternative for selecting hyperparameters $\eta$ by maximizing the marginal
    likelihood $\ell(\eta)$ as


    ```

    $$\hat{\eta} = \arg\max p_{\eta}(y).$ (9.4)

    ```


    where we have added an index $\eta$ to emphasize the fact that $p(y)$ depends
    on $\eta$. This approach is sometimes referred to as *empirical Bayes*. Choosing
    hyperparameters $\eta$ is, in a sense, a selection of likelihood (and prior),
    and we can consider the marginal likelihood as a tool for selecting likelihood.
    Maximizing the marginal likelihood is, however, not equal to using cross-validation
    (the obtained value might differ), and unlike cross-validation the marginal likelihood
    does not give an estimate of $E_{new}$. In many situations, it is relatively easy
    to compute (and maximize) the marginal likelihood, employing a full cross-validation
    procedure.


    In the previous section we argued that the Bayesian approach was less prone to
    overfitting than others. However, maximizing the marginal likelihood is, in a
    sense, a of maximum likelihood approach, and may carry a risk of overfitting when
    maximizing the marginal likelihood. To some extent that may be the case, the key
    point is that learning one (at most, a few) hyperparameters $\eta$ with maximum
    (marginal) likelihood typically does not cause any severe overfitting, but there
    are rarely overfitting when learning a straight line with linear regression. In
    other words, we can usually "afford" to learn one or a few (hyper)parameters by
    maximizing the (marginal) likelihood: overfitting becomes a potential issue when
    learning a larger number of (hyper)parameters.


    # 9.2 Bayesian linear regression


    As a first example of the Bayesian approach, we will apply it to linear regression.
    In itself Bayesian linear regression is not the most versatile method, but just
    like ordinary regression it is a good starting point and introduces the main concepts.
    It is possible to extend in various directions. It opens up for the perhaps more
    interesting Gaussian process model. Before we work out the details of the Bayesian
    approach applied to linear regression, we will repeat some facts about the Gaussian
    distribution that will be useful.


    # The multivariate Gaussian distribution


    A central mathematical object for Bayesian linear regression (and later also the
    Gaussian process) is the multivariate Gaussian distribution. We assume that the
    reader already has familiarity with multivariate random variables, or equivalently
    random vectors, and repeat only the most important properties of the multivariate
    Gaussian distribution here.


    Let $z$ denote a $q$-dimensional multivariate Gaussian random vector $\mathbf{z}
    = [z_1 \ z_2 \ \dots \ z_q]^T$. The multivariate Gaussian distribution is parameterized
    by a mean vector $\mathbf{\mu}$ and a $q \times q$ covariance matrix $\mathbf{\Sigma}$,


    ![](img/9c84a60f9e70ea0bf5c7c51ae709df3e_180_0.png)


    The covariance matrix is a real-valued positive semidefinite matrix, it is a symmetric
    matrix with nonnegative eigenvalues. As a shorthand notation we write $z \sim
    \mathcal{N}(\mathbf{\mu}, \mathbf{\Sigma})$ or $p(z) = \mathcal{N}(z; \mathbf{\mu},
    \mathbf{\Sigma})$. Note that we use the same symbol $\mathcal{N}$ to denote the
    univariate as well as the multivariate Gaussian distribution. The reason is that
    the former is only a special case of the latter.'
