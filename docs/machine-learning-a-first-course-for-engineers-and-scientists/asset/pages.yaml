  md: "# 5 Learning parametric models\n\n![](img/9c84a60f9e70ea0bf5c7c51ae709df3e_99_0.png)\n\
    \n(a) Low learning rate γ = 0.05 (b) High learning rate γ = 1.2 (c) Good learning\
    \ rate γ = 0.3\n\n**Figure 5.7:** Optimization using gradient descent of a cost\
    \ function $J(\\theta)$ where $\theta$ is a scalar parameter. In the different\
    \ subfigures we use a too learning rate (a), a high learning rate (b), and a good\
    \ learning rate (c). Remember that a good value of $\\gamma$ is very much relative\
    \ to the shape of the cost function; $\\gamma=0.3$ might be too small (or high)\
    \ for a different $J(\\theta)$.\n\nIn practice we do not know $\\gamma$, which\
    \ determines how the $\theta$-step is at each iteration. It is possible to formulate\
    \ the selection of $\\gamma$ as an internal optimization problem that is solved\
    \ at each iteration, a so-called line-search problem. This will result in a different\
    \ value for $\\gamma$ at each iteration of the algorithm. Here we will consider\
    \ a simpler solution where we leave the choice of $\\gamma$ to the user, or more\
    \ specifically view it as a hyperparameter. In such cases, it is referred to as\
    \ the learning rate or step-size. Note that the gradient $\nabla_theta J(\\theta)$\
    \ will decrease and eventually approach 0 at a stationary point (possibly, but\
    \ not necessarily, a minimum), so Algorithm 5.1 may converge if $\\gamma$ is kept\
    \ constant. This is in contrast to what we later discuss when we introduce the\
    \ stochastic gradient algorithm.\nThe choice of learning rate is very important.\
    \ Some situations with too small, too high and a good choice of learning rate\
    \ are shown in Figure 5.7. With the intuition from these figures, we advise to\
    \ monitor $J(\\theta^{(t)})$ during the optimization,\n\n+   - decrease the learning\
    \ rate $\\gamma$ if the cost function values $J(\\theta^{(t)})$ are gone or oscillating\
    \ widely (as in Figure 5.7b),\n- increase the learning rate $\\gamma$ if the cost\
    \ function values $J(\\theta^{(t)})$ are fairly constant and only slowly decreasing\
    \ (as in Figure 5.7a).\n\nNo general convergence guarantees can be given for gradient\
    \ descent, basically because a bad learning rate $\\gamma$ may break the method.\
    \ However, with the \"right\" choice of $\\gamma$, the value of $J(\\theta)$ will\
    \ decrease for each iteration (as suggested by (5.31)) until a point with zero\
    \ gradient is found, that is, stationary. A stationary point is, however, not\
    \ necessarily a minimum, but can be a maximum or a saddle-point of the objective\
    \ function. In practice one typically monitors the value of $J(\\theta)$ and terminate\
    \ the algorithm when it does not decrease anymore, and hope it has reached a minimum.\n\
    in non-convex problems with multiple local minima, we cannot expect gradient descent\
    \ to find the global minimum. The initialization is critical for determining which\
    \ stationary (or global) point is found, it therefore be a good practice (if time\
    \ and computational resources permit) to run the optimization multiple times with\
    \ different initializations. For highly non-convex problems such as training a\
    \ deep neural network (Chapter 6) when we cannot afford to run the training, we\
    \ employ method-specific heuristics and tricks to find a good initialization.\n\
    for convex problems there only one stationary point, which is also the global\
    \ minimum. Hence, the initialization for convex problem can be done arbitrarily.\
    \ However, by warm-starting the optimization\n\n> When viewed as a hyperparameter\
    \ we can also optimize, $\\gamma$, by using cross-validation, as discussed above.\
    \ However this is an \"external\" optimization problem, contrary to line-search\
    \ which is an \"internal\" optimization problem.\n\nDraft (April 30, 2021) of\
    \ Machine Learning - A First Course for Engineers and Scientists. http://ml.book.org\n\
    \n100 Andreas Lindholm, Niklas Stråle, Fredrik Dinsstrahl, and Thomas B. Schön.\
    \ 2021."
