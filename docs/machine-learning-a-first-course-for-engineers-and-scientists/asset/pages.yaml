  md: "# # Neural networks and deep learning\n\n![](img/9c84a60f9e70ea0bf5c7c51ae709df3e_125_0.png)\n\
    \nFigure 6.12: A convolutional layer with 2 filter and size 3 x 3.\n\nwhere $x_{i,j}$\
    \ denotes the zero-padded input to the layer, $q_{i,j}$ the output of the layer,\
    \ and $W_{k,l}$ the filter with $F$ rows and columns. The parameter sharing in\
    \ a convolutional layer allows the CNN to easily handle translations of objects\
    \ in the image. If the parameters are sensitive to a certain detail (such as a\
    \ corner, an edge), a hidden unit will react to detect (or regardless) of where\
    \ in the image that detail is present! Furthermore, a convolutional layer uses\
    \ significantly fewer parameters compared to the dense layer. In Figure 6.10 only\
    \ $3+3+10$ parameters are required (the offset parameter). If we instead used\
    \ a dense layer $(36+1)*6=1332$ parameters would be needed! Another way of implementing\
    \ this: with the same amount of parameters, a convolutional layer can encode more\
    \ properties of an image than a dense layer.\n\n# ## Convolutional layer with\
    \ strides\n\nIn the convolutional layer presented above we have equally many hidden\
    \ units as we have pixels in the image. When we add more layers we want to reduce\
    \ the number of hidden units and only store the most important information from\
    \ the previous layers. One way of doing this is by applying the filter to every\
    \ two pixels. If we filter every two pixels both row-wise and column-wise, the\
    \ hidden units will only half as many rows and half as many columns. For a $6\t\
    imes6$ image we get $3\times3$ hidden units. This is illustrated in Figure 6.12.\n\
    The stride controls how many pixels the filter shifts by both row- and column-wise.\
    \ In Figure 6.12 the stride is $s=2$ because it moves two pixels row and column-wise.\
    \ Note that the convolutional layer in Figure 6.12 still requires 10 parameters,\
    \ just as the original layer. Mathematically, the convolutional layer can be expressed\
    \ as\n\n```\n$$q_{i,j} = \\sum_{k=1}^{F} \\sum_{l=1}^{F} x_{(i-1)s+k,(j-1)s+l}W_{k,l}$$\n\
    ```\n\nSpecifically this is equal to (6.29) if we used $s=1$ in the equation above.\n\
    \n# ## Pooling layer\n\nAnother way of summarizing the information in previous\
    \ layers is achieved by **pooling**. A pooling layer acts as an additional layer\
    \ after the convolutional layer. Similar to the convolutional layer, it depends\
    \ on a region of pixels. However, contrast to convolutional layers, the pooling\
    \ layer does not have any extra trainable parameters. In pooling layers we also\
    \ use strides to condense the information, meaning that region is shifted by $s>1$\
    \ pixels. Two common versions of pooling are average pooling and max pooling.\
    \ In average pooling, average of the units in the region is computed. Mathematically,\
    \ this means\n\n```\n$$\\hat{q} = \\frac{1}{F^2} \\sum_{k=1}^{F} \\sum_{l=1}^{F}\
    \ q_{(i-1)s+k,(j-1)s+l}$$\n```"
