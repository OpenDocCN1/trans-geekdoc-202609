    \ |\n|---|---|---|--|\n| Awesome | Positive | 8 | 1.44 |\n| Excellent | Positive\
    \ | 10 | 0.7 |\n| Spotless | Positive | 9 | 1.60 |\n| Terrific | Positive | 8\
    \ | 1.44 |\n| Tremendous | Positive | 4 | 0.55 |\n| Awful | Negative | 6 | 1.60\
    \ |\n| Dreadful | Negative | 6 | 1.03 |\n| Horrific | Negative | 6 | 1.03 |\n\
    | Outrageous | Negative | 6 | 1.03 |\n| Terrible | Negative | 8 | 1.44 |\n\nInspecting\
    \ the result, the column shows that horendous is the positive tremendous. Thus,\
    \ if\nwe use $k=1$ the kernel concludes that horendous is a positive word. However,\
    \ the second and third\nclosest words are all negative (dreadful, awful), and\
    \ with $k=2$ or 4 the conclusion\nbecomes that horendous is a negative word (which\
    \ also happens to be correct in case).\n\nThe purpose of this example is to illustrate\
    \ how a kernel allows a basic method such as k-NN to be used\nof a problem where\
    \ the input has a more intricate structure than just being numerical. For the\
    \ particular\nap of predicting word semantics, the character-by-character similarity\
    \ is clearly oversimplified\napproach and more elaborate learning methods need\
    \ exists.\n\n# The meaning of a kernel\n\nFrom k-NN we got (at least) learn about\
    \ kernels that are generally applicable to all supervised\nmachine learning methods\
    \ that use kernels:\n\n+   - The kernel defines how close/similar any two data\
    \ points are. If say, $\\kappa(x_i, x_j) > \\kappa(x_j, x_i)$, then $x_n\nis considered\
    \ to be more similar to $x_j$, than to $x_i$. Intuitively, for methods the prediction\n\
    $\\hat{y}(x_i)$ is most influenced by the training data points that are closest/most\
    \ to $x_i$. The kernel\n\nDraft (April 30, 2021) of Machine Learning - A First\
    \ Course for Engineers and Scientists. http://mlbook.org\nAndreas Lindholm, Michael\
