  md: '# 9 The Bayesian approach and Gaussian processes


    ![](img/9c84a60f9e70ea0bf5c7c51ae709df3e_193_0.png)


    **Figure 9.10:** 9.9 again, this time appended also with samples from $p(f(\mathbf{x}_*)
    \mid \mathbf{y}).


    # Drawing samples from a Gaussian process


    When computing a predictive of $f(\mathbf{x}_*)$ for a single input point $\mathbf{x}_*$,
    the posterior predictive $p(f(\mathbf{x}_*) \mid \mathbf{y})$ captures all the
    information that the Gaussian process has about $f(\mathbf{x}_*)$. However, if
    we are interested in predicting $f(\mathbf{x}_*, \mathbf{x}_* + \delta)$, the
    Gaussian process contains more information than is present in the two posterior
    predictive distributions $p(f(\mathbf{x}_*) \mid \mathbf{y})$ and $p(f(\mathbf{x}_*
    + \delta) \mid \mathbf{y})$ separately. This is because the Gaussian process also
    contains information about the correlation between the function values $f(\mathbf{x}_)$
    and $f(\mathbf{x}_* + \delta)$, and the pitfall is that $p(f(\mathbf{x}_*) \mid
    \mathbf{y})$ and $p(f(\mathbf{x}_* + \delta) \mid \mathbf{y})$ are only the marginal
    distributions of the joint distribution $p(f(\mathbf{x}_*), f(\mathbf{x}_* + \delta)
    \mid \mathbf{y})$.


    If we are interested in computing predictions for a larger set of input values
    it can be cumbersome to grasp and visualize the high-dimensional posterior predictive
    distribution. An useful alternative can therefore be to visualize the Gaussian
    process posterior by samples from it. Technically this simply amounts to drawing
    a sample from the posterior predictive distribution, which we illustrate in Figure
    9.10.


    Draft (April 30, 2021) of Machine Learning - A First Course for Engineers and
    Scientists. http://smlbook.org

