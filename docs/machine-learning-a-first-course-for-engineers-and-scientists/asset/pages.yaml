    decoder mappings. Taking this to the extreme, we can restrict both mappings to
    linear functions. As it turns out this results in a well-known dimensionality
    reduction method referred to as PCA, which we will discuss next.


    # Principal component analysis


    Principal component analysis is similar to an auto-encoder in the sense that the
    objective is to learn a low-dimensional representation $z \in \mathbb{R}^q$ of
    the data $x \in \mathbb{R}^p$, where $q < p$. This is done by projecting $x$ onto
    a $q$-dimensional subspace of $\mathbb{R}^p$ by applying a linear transformation.
    Traditionally, the transformation is derived from the objective of obtaining as
    much information as possible, where information is measured in terms of variance.
    We will briefly discuss this via PCA below. However, an alternative approach is
    to consider PCA as an auto-encoder that is restricted to linear. That is, the
    encoder is a linear mapping that transforms $x$ into the latent representation
    $z$, the decoder is another linear mapping that tries to reconstruct $x$ from
    $z$, and both mappings are learned simultaneously by minimizing the reconstruction
    error with respect to the training data. We can create


    ```

    $z = W_{qp}x + b_{qp} \quad \text{and} \quad x = W_{px}z + b_{px} \eq (10.30)$

    ```


    for the decoder and offset vectors, respectively. The parameters of the model
    are the weight matrices and offset vectors, $\theta = \{W_e, b_e, W_d, b_d\}$.
    In light of Figure 10.10 this can be seen as a two-layer network with a bottleneck
    layer and linear activation functions. We show that the auto-encoder is also given
    by a linear transformation, and the reconstruction of $\hat{x}$


    ```

    $$\hat{x} = W_dx + b_d \eq (10.31a)\n$\hat{x} = W_d(W_ex + b_e) + b_d \eq (10.31b)\n$\hat{x}
    = W_dW_ex + W_db_e + b_d \eq (10.31c)$

    ```


    To learn the parameters, we minimize the squared reconstruction error of the training
    data points $\{x_i\}_{i=1}^n$


    ```

    $$\hat{\theta} = \arg \min_{\theta} \sum_{i=1}^n ||x_i - (W_dex_i + W_db_i + b_d)||^^2.
    \eq (10.32)$

    ```


