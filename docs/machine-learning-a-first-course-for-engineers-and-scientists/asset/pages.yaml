- pgno: 34
  md: 'is a trade-off between flexibility and rigidity. Similar trade-offs have be
    made for almost all methods presented in this book and will user be discussed
    systematically in Chapter 4.


    How can the user control the growth of the tree? Here we have different strategies.
    The most straightforward strategy is to adjust the stopping criterion, that is,
    the condition should be fulfilled for not proceeding with further splits in a
    node. As mentioned above, this criterion could be that we do not attempt splits
    if there are less than a certain number of training points in the corresponding
    region, or as in Figure 2.11, stop splitting when we reach a certain depth. Another
    strategy of controlling the depth is to use pruning. In pruning we prune a fully
    grown tree and then in a second post-processing step prune it back to a smaller
    one. We will, however, not discuss pruning further.


    # 2.4 Further reading


    The reason why we start this book by k-NN is that it perhaps the most intuitive
    and straightforward way to solve a classification problem. The ideas is, at least,
    yours and was described already by Hassan Ibn al-Haytham (latinized as Alhazen)
    around year 1030 in Kitāb al-Manāzir (book of optics) (Pelillo 2014), as an explanation
    of how the human brain perceives objects. With many good ideas, the nearest neighbor
    idea has been re-invented many times, and a more modern description of k-NN is
    found in Cover and Hart (1967).


    Also the basic idea of decision trees is relatively simple, but there are many
    possible ways to improve and extend them, as well as different options in how
    to implement them in detail. A somewhat longer introduction to decision trees
    is found in Hastie et al. (2009), and a historically oriented overview is found
    in Loh (2014). Of particular significance is perhaps CART (Classification and
    Regression Trees, Breiman et al. 1984) as ID3 and C4.5 (Quinlan 1986, Quinlan
    1993).'
