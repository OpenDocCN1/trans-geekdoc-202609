  md: "# 7.1 Bagging\n\n**Learn all base models\n\n**Data:** Training dataset $\\\
    mathcal{T} = \\{\\mathbf{x}_i, \\mathbf{y}_i\\}_{i=1}^n$\n**Result:** $B$ base\
    \ models\n\n```\n1 for $b = 1, \\dots, B$ do\n2   Algorithm 7.1 to obtain a bootstrapped\
    \ training dataset $\\mathcal{T}^{(b)}$\n3   Learn a model from $\\mathcal{T}^{(b)}\n\
    4 end\n5 Obtain $\\hat{y}_{bag}(\\mathbf{x}_*)$ or $\\hat{g}_{bag}(\\mathbf{x}_*)$\
    \ by averaging (7.1).\n```\n\n**Predict with base models\n\n**Data:** $B$ base\
    \ models and test input $\\mathbf{x}_*$\n**Result:** A prediction $\\hat{y}_{bag}(\\\
    mathbf{x}_*)$ or $\\hat{g}_{bag}(\\mathbf{x}_*)$\n\n```\n1 for $b = 1, \\dots,\
    \ B$ do\n2   Use base model $b$ to predict $\\hat{y}^{(b)}(\\mathbf{x}_*)$ or\
    \ $\\hat{g}^{(b)}(\\mathbf{x}_*)\n3 end\n4 Obtain $\\hat{y}_{bag}(\\mathbf{x}_*)$\
    \ or $\\hat{g}_{bag}(\\mathbf{x}_*)$ by averaging (7.1).\n```\n\n# Method 7.1:\
    \ Bagging\n\nbe decided by majority vote among the members, but that typically\
    \ degrades the performance slightly compared to the averaged class probabilities.\n\
    \nWe now give some more details on the variance reduction that happens in (7.1),\
    \ which is the entire point of bagging. We average on regression, but the intuition\
    \ works also for classification.\n\nFirst make a basic observation regarding random\
    \ variables, namely that averaging reduces variance. To formalize this, let $z_1,\
    \ \\dots, z_B$ be a of identically distributed (but possibly dependent) random\
    \ variables with mean $\\mathbb{E}[z_b] = \\mu$ and variance $\text{Var}[z_b]\
    \ = \\sigma^2$ for $b=1, \\dots, B$. Furthermore, assume that the average correlation\
    \ between any pair of $B$ variables is $\rho$. Then, computing the mean and the\
    \ variance of the average of $B$ these variables we get\n\n> $\\mathbb{E}\\left[\\\
    frac{1}{B}\\sum_{b=1}^B z_b\right] = \\mu.\\quad (7.2a)$\n\n> $\text{Var}\\left[\\\
    frac{1}{B}\\sum_{b=1}^B z_b\right] = \\frac{1-\rho}{B}\\sigma^2+\rho\\sigma^2.\\\
    quad (7.2b)$\n\nThe first equation (7.2a) tells us that the mean is unaltered\
    \ by averaging a number of identically distributed random variables. The second\
    \ equation (7.2b) tells us that the variance is reduced by averaging if the correlation\
    \ $\rho < 1$. The first term in the variance (7.2b) can be arbitrarily small by\
    \ increasing $B$, whereas the second term is only determined by the correlation\
    \ $\rho$ and variance $\\sigma^2$. To make a connection between bagging and (7.2),\
    \ consider the predictions $\\hat{y}^{(b)}(\\mathbf{x}_*)$ from the base models\
    \ as random variables. All base models, and their predictions, are identically\
    \ distributed but correlated. By averaging them from the same data $\\mathcal{T}$\
    \ (via the bootstrap), we decrease the variance, according to (7.2b). If we only\
    \ use $B$ large, the achieved variance reduction is limited by the correlation\
    \ $\rho$. Experience has shown that if $B$ is small enough, the computational\
    \ complexity of bagging (compared to using only one base model) pays off in terms\
    \ of decreased variance. To summarize, averaging the identically distributed predictions\
    \ from several base models each with a low bias, the bias remains low (according\
    \ to (7.2a)) and the variance is reduced (according to (7.2b)).\n\n$^1$That is\
    \ $\\frac{1}{B(B-1)}\\sum_{b\neq b'}\text{cov}(z_b, z_{b'})=\rho\\sigma^2$.\n\
    $^2$ Strictly speaking, (7.2a) implies that the bias is identical for a single\
    \ base model and the ensemble of them we.\n\nThis material was published by Cambridge\
    \ University Press. This pre-publication version is free to view and for your\
    \ personal use only. Not for re-distribution, or re-sale or use in your services.\n\
    \nAndreas Lindholm, Nicholas Wahlstöm, Friedrich Lincoln, and Thomas B. Schön.\
    \ 2021"
