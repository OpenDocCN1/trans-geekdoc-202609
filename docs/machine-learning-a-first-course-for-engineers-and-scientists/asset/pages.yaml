- pgno: 6
  md: '# 1 Introduction


    Machine learning is about learning, reasoning, and acting on data. This is done
    by constructing computer programs that process the data, extract useful information,
    make predictions regarding unknown properties, and suggest actions to take or
    decisions to make. What turns analysis into machine learning, is that the process
    is automated and the computer program is learnt from data. From this that generic
    computer programs are used, which are adapted to application-specific circumstances
    by automatically adjusting the settings of the program based on so-called, training
    data. It can be said that machine learning is quite arbitrary what the data represents,
    and we can design general methods that are useful for a wide range of practical
    applications in different domains. We will illustrate this a range of examples
    below.


    The "generic computer program" referred above corresponds to a mathematical model
    of the data. That is, when we develop and describe different machine learning
    methods, we do this using the language of mathematics. The mathematical model
    describes the observed data and the properties of the interest (such as predictions,
    actions, variables, etc.). Hence, the model is a compact representation of the
    data, that in a mathematical form, captures the properties of the phenomenon we
    are studying. Which method to use is typically guided by the machine learning
    engineer''s insights generated when using the available data and the practitioner''s
    general understanding of the problem. When implementing the method in practice,
    this mathematical model is translated into code that can be executed on a computer.
    However, to understand what the computer program actually does, it is also important
    to understand the underlying mathematics.


    As mentioned above, the model (or computer program) is learnt based on the available
    training data. This is accomplished by using a learning algorithm which is capable
    of automatically adjusting the settings, or parameters, of the model to agree
    with the data. In summary, the three cornerstones of machine learning are:


    +   1. The data 2. The mathematical model 3. The learning algorithm


    In this introductory chapter we will give a taste of machine learning cornerstones
    with a few examples. They come from different application domains and have different
    properties, but nevertheless, they can all be addressed using similar techniques
    from machine learning. We also give advice on how to proceed through the rest
    of the book and, at the end, provide references to good books on machine learning
    for the interested reader who wants to dig further into this topic.


    # 1.1 Machine learning exemplified


    Machine learning is a multifaceted subject. We give a brief and high-level description
    of what it entails above, but this will become much more concrete as we proceed
    throughout this book and introduce specific methods and techniques for solving
    various machine learning problems. However, by digging into the details we try
    to give an intuitive answer to the question "What is machine learning?", by discussing
    a few applications where it can (and has) been used.


    We start with an example to relate to medicine, precisely cardiology.'
  merge: -1
  img_proc: true
- pgno: 7
  md: '# 1 Introduction


    # Example 1.1: Automatically diagnosing heart abnormalities


    The leading cause of death is conditions that affect heart and blood vessels,
    collectively referred to cardiovascular diseases. Heart problems often influence
    the electrical activity of the heart, which can be measured using electrodes attached
    to the body. The electrical signals are reported in an electrocardiograms (ECG).
    In Figure 1.1 we show examples of (parts of) the measured signals from three different
    hearts. The measurements from a healthy heart (top), a heart suffering from atrial
    fibrillation (middle), and a heart suffering from right bundle branch block (bottom).
    Atrial fibrillation makes the heart beat without order making it hard for the
    heart to pump blood in a normal way. Right bundle branch block corresponds to
    a delay or blockage in the electrical pathways of the heart.


    ![](img/9c84a60f9e70ea0bf5c7c51ae709df3e_7_0.png)


    By analyzing the ECG signal, a cardiologist gains valuable information about the
    condition of the heart, which can be used to diagnose the patient and plan the
    treatment.


    To improve the diagnostic accuracy, as well as save time for the cardiologists,
    we can ask ourselves if this process can be automated to some extent. That is,
    can we construct a computer program which reads the ECG signals, analyzes the
    data, and returns a prediction regarding the normality or abnormality of the heart?
    Such models, capable of accurately interpreting an ECG exam in an automated fashion,
    will find applications globally, but most in low- and middle-income countries.
    An important reason for this is that the population in these countries do not
    have easy and direct access to highly skilled cardiologists capable of accurately
    carrying out ECG diagnosis. Furthermore, cardiovascular diseases in these countries
    are related to more than 25% of deaths.


    The key challenge in building such a program is that it is far from obvious computations
    that are needed to turn the raw ECG into a prediction about the heart condition.
    Even if an experienced cardiologist would try to translate the cardiologist''s
    experience into a software developer who patterns in the data to look for, this
    task would be extremely challenging.


    To handle this difficulty, a machine learning approach is used to learn the patterns
    from examples. Specifically, instead of asking the cardiologist to set a set of
    rules for how to classify an ECG as normal or abnormal, we use labels corresponding
    to the underlying heart condition. This is a much easier (possibly tedious) for
    the cardiologists to communicate their experience and encode it in a way which
    is understandable.


    The task of the learning is then to automatically adapt the computer program so
    that its predictions agree with the cardiologist''s labels on the labeled training
    data. The hope is, if it succeeds on the training data (which we already know),
    then it is possible to use the predictions made by the program on previously unseen
    data (where we do not know the answer) well.


    This is the approach taken by Ribeno et al. (2020) who developed a machine learning
    model for ECG diagnosis. In their study, the training data consisted of more than
    2-300,000 ECG records from more than 1,000,000 different patients corresponding
    to 12 time series (each of the twelve electrodes that were used in conducting
    the exam) of a duration from seven to ten seconds, sampled at frequencies ranging
    from 300 Hz to 600 Hz. These ECGs can'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# 1.1 Machine learning exemplified


    be provide a full evaluation of the electric activity of the heart and it is indeed
    the most commonly used exam in evaluating the heart. Each ECG in the dataset comes
    with an output sorting into classes—no abnormalities, atrial fibrillation, right
    bundle branch block, etc.—to the status of the heart. Based on this data, a machine
    learning model is trained to classify any ECG without requiring a human doctor
    to be involved. The model used is a deep neural network, more specifically a convolutional
    residual network. The results are shown in images. This work for ECG significance
    of this relevance. In Chapter 6 we introduce deep learning models and their training
    algorithms.


    Evaluating how a model will perform in practice is not straightforward. The study
    was to ask three different candidates with experience in electrocardiography to
    examine and classify 827 records from distinct patients. This dataset was then
    evaluated by the algorithm, 40 year cardiologists, 23 year emergency residents,
    and 50 year medical students. The average performance was compared. The result
    was that the algorithm achieved better or the same result compared to the human
    performance on classifying six types of abnormalities.


    Before we move on, let us pause and reflect on the example introduced above. In
    fact, many concepts to machine learning can be recognized in this image.

    As mentioned, the first cornerstone of learning is the data. Taking a closer look
    at what data actually is, we note that it differs in several ways. First, we have
    the training data which is to learn the model. Each training data point consists
    of both the ECG signal, which we refer to as the input, and labels corresponding
    to the heart condition seen in this signal, which we refer to as the output. To
    train the latter had to be manually assigned by domain experts (or possibly auxiliary
    examination). Training a model from labeled data points is therefore referred
    to as supervised learning. The think of learning being supervised by the domain
    expert, and the learning objective is to obtain a computer program that mimics
    the learning done by the expert. Second, we have the (unlabeled) ECG signals that
    will be fed to the program when it is used “in production”. It is important to
    remember that the ultimate goal of the model is to obtain accurate predictions
    in this second phase. We say that the made by the model generalize beyond the
    training data. How to learn models that are capable of generalizing, and how to
    evaluate to what extent they do, is a central theoretical question throughout
    this book (see in particular Chapter 4).


    We illustrate the training of the ECG prediction model in Figure 1.2. The general
    structure of the training procedure is however the same (or at least very similar)
    for all supervised machine learning problems.


    ![](img/9c84a60f9e70ea0bf5c7c51ae709df3e_8_0.png)


    **Figure 1.2:** Illustrating the supervised machine learning process with training
    to the left and the use of the trained model to the right. Left: Values for the
    unknown parameters of the model are set by the learning algorithm so that the
    model best describes the available training data. Right: The learned model is
    used on new, previously unseen data, where we hope to obtain a correct classification.
    It is essential for the model to generalize to new data that is not present in
    the training data.


    Another concept that could be found in the ECG example is the notion of a classification
    problem.


