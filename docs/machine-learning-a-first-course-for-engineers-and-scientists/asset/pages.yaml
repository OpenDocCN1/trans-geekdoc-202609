    # Data augmentation


    Data augmentation is another approach to extend the training data without the
    need to collect more data. In data augmentation we construct new data points duplicating
    the existing data with invariant transformations. This is possible for images
    where such invariant transformations can be cropping, rotation, and vertical flipping,
    noise addition, color shift and contrast change. For example, if we vertically
    flip an image of a cat, it displays a cat, see the Examples 11.5. One should be
    aware that some objects are not invariant to some of these transformations. For
    example, a flipped image of a digit is not a valid transformation. If we flip
    an image of a "6" vertically and horizontally, that image would represent a "9"..
    Hence, before applying data augmentation we need to know and understand the problem
    and the data. Based on that knowledge we can identify invariant and suggestion
    transformations that can be applied to the data that we have already.


    To apply data augmentation before the training would require the required amount
    of storage and is hence recommended for small datasets. For many models and training
    procedures we can apply it online during training. For example, if we train a
    model using stochastic gradient descent (see Section 5.5), we can perform the
    transformation directly on the data that goes into the current mini-batch without
    need to store the data.


