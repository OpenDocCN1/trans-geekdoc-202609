    self-supervised learning. In our description we use our original dataset with
    both inputs and output for Dataset A and our unlabeled dataset for Dataset B.

    In semi-supervised learning we formulate and train a generative model for the
    inputs in Dataset A and Dataset B. The generative model of the inputs and the
    supervised model for Dataset A are trained jointly. The idea is that the generative
    model on the inputs, which is trained on the much larger dataset, improves the
    performance of the supervised task. Semi-supervised learning is further described
    in Chapter 10.

    In semi-supervised learning we use Dataset B in a very similar way as we do transfer
    learning described previously. Since Dataset B does not contain any inputs, we
    automatically generate outputs for Dataset B and pretrain our model with these
    generated outputs. The automatically generated outputs can be for example a of
    the input variables or a transformation thereof. In transfer learning, the idea
    is that the pretrained model learns extract features from the input data, which
    can then be used to improve the performance of the supervised task we are interested
    in. Also, if we don''t have an additional unlabeled Dataset B, we can also use-supervised
    learning on the inputs in Dataset A as the pretraining before training on the
    supervised task on that dataset.


    # 11.4 Practical data issues


    Besides the amount and distribution of data, a machine learning engineer may also
    face other data issues. In this section we will discuss some of the most common
    ones; outliers, missing data and some features can be removed.


    # Outliers


    In applications, a common issue is *outliers*, meaning data points whose outputs
    do not follow the overall pattern. Two typical examples of outliers are sketched
    in Figure 11.7. Even though the situation in Figure 11.7 looks simple, it is quite
    hard to find outliers when the data has higher dimensions and is harder to visualize.
    The error analysis discussed in Section 11.2, which amounts to inspecting misclassified
    data points in the validation data, is a systematic way to discover outliers.

    When facing with a problem, the first question is to ask whether the outliers
    are meant to be captured by the model or not. The encircled data points in Figure
    11.7 describe an interesting phenomenon that we would like to predict, or are
    irrelevant noisy (possibly originating from a data collection process)? The answer
    to this question depends on the actual problem and ambition. Since outliers (no
    matter origin) do not follow the overall pattern, they are typically hard to predict.


