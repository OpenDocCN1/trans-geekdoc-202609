    There are also problems of privacy preservation and accountability. The data contains
    sentences written in Internet chat groups by real-world people about other real-world
    people, and information later be tracked back to those individuals. It is something
    that Reddit will suddenly appear, in a slightly modified form, as a sentence written
    or spoken by a bot. These can also arise in medical applications where sensitive
    data is used to train models and may be revealed in some of the suggestions made
    by these. Nor are the problems limited to text, machine learning on video sequences
    is used to generate new, sequences, that can be difficult for viewers to distinguish
    from reality.


    As we wrote at the start of this section, this book is primarily about machine
    learning methods. But what we see, now near the end of the book, that the limitations
    of our methods are also determined by having access to good data quality. In the
    case of about language and society this cannot be done without becoming aware
    of the culture we live in and its history. This includes centuries of oppression,
    acts of slavery and systemic racism. With all examples in this chapter, we can''t
    hide behind neutrality, while a method might be purely computational, the data
    we put in it is shaped by this history.


    We hope that this chapter will helped you start to think about some of the potential
    pitfalls in machine learning. We have emphasised throughout that the key starting
    point is awareness. Awareness that there is no equation for fairness; awareness
    that you can''t be fair in all possible ways; awareness that it is easy to exaggerate
    performance (when you shouldn''t); awareness of the hype around machine learning;
    awareness that technical jargon can obscure explanations of what your model does;
    awareness that data sets encode biases that machine learning methods don''t understand;
    awareness that other engineers might fail to understand that they are not objective
    and neutral.


    Being aware of a problem doesn''t solve it, but it is certainly a good start.


    # 12.4 Further reading


    Several of the articles cited in this chapter are recommended further reading.
    In particular, Bender et al. (2021) introduces the idea of the stochastic parrots
    and what it is. David Smith (2018) covers many of the problems on the limitations
    and biases in algorithms. The three problems described here make up only a tiny
    fraction of the ethical questions raised by machine learning. Cathy O''Neil''s
    book Weapons of Math Destruction is valuable reading (O''Neil 2016).'
