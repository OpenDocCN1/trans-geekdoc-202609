  md: '# #8 Nonlinear input transformations and kernels


    In this chapter we will continue to develop the idea from Chapter 3 of creating
    new input features by using nonlinear transformations $\phi(x)$. It turns out
    that the so-called kernel trick, we can have infinitely many such transformations
    and we can extend our basic methods, such as linear regression and k-NN, into
    more versatile and flexible ones. When we also change the loss function of linear
    regression, we obtain support regression, and its classification counterpart support
    vector classification, two powerful off-the-shelf machine learning methods. The
    concept of kernels is important to the next chapter (9), where a Bayesian perspective
    of linear regression and kernels leads to the Gaussian process


    # ##8.1 Creating features by nonlinear input transformations


    The reason for the word “linear” in the name “linear regression” is that the output
    is modelled as a *linear* combination of the inputs. We have not made clear definition
    of what an input is. Recall the stopping distance problem in Example 2.2. If the
    speed is as in that example, then could not also the kinetic energy—the square
    of the speed—be considered as another input? The answer is yes, we can in fact
    make use of arbitrary nonlinear transformations of the “original” input in any
    model, including linear regression. For example, if we have a one-dimensional
    input $x$, the vanilla regression model (3.2) is


    ```

    $y = \theta_0 + \theta_1x + \varepsilon.$ (8.1)

    ```


    Starting from this we can create the model with $x^2, x^3, \dots, x^{d-1}$ as
    inputs ($d$ is a user-choice), and thus we obtain a linear regression model which
    is a polynomial in


    ```

    $y = \theta_0 + \theta_1x + \theta_2x^2 + \dots + \theta_{d-1}x^{d-1} + \varepsilon
    = \theta^T\phi(x) + \varepsilon.$ (8.2)

    ```


    Since $x$ is known, we can directly compute $x^2, \dots, x^{d-1}$. Note that this
    is a linear regression model where the *parameters* $\theta$ appear in a linear
    fashion with $\phi(x) = [1 x x^2 \dots]$ as a new input. We refer to a transformation
    of $x$ as a *feature* and the vector of transformed inputs $\phi(x)$, a vector
    of dimension $d \times 1$, as a *feature*. The parameters $\theta$ are still learned
    in the same way, but we


    replace the original $X$ with the transformed $\Phi(X) = ( \Phi(x_1)^T, \Phi(x_2)^T,
    \vdots, \Phi(x_n)^T)^T_{n \times d}$ (8.3)


    For linear regression, this means that we can learn the parameters by making the
    substitution (3.8) in the normal equations (3.13). The idea of nonlinear input
    transformations is not unique to linear regression, and any choice of nonlinear
    transformation $\phi(x)$ can be used with any supervised machine learning method.
    The nonlinear transformation is first applied to the input, like a pre-processing
    step, and the transformed input is used when training, evaluating and using the
    model. We illustrated this for regression already in Example 3.5 in Chapter 3,
    and for classification in Example 8.1.


    > The original input is sometimes referred to as a feature.'
