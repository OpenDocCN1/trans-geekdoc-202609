  md: "# 5 Learning parametric models\n\napplies to all hyperparameters, as long as\
    \ they are not of too high dimensions. We can easily estimate $E_{test}$ now,\
    \ $E_{hold}$, $E_{out}$, and aim for minimizing this.\n\nWriting down an explicit\
    \ form of $E_{out}$ as a function of the hyperparameter $\\lambda$ can be quite\
    \ tedious, not to mention its derivative. In fact, $E_{out}$ includes an optimization\
    \ problem itself—$\theta$ for a given value of $\\lambda$. However, we can nevertheless\
    \ evaluate the objective function for any $\\lambda$, by running the entire learning\
    \ procedure and computing the predictions on the validation set.\n\nThe simplest\
    \ way to solve such an optimization problem is to \"try a different parameter\
    \ values, and pick the one that works best\". This is the idea of grid search\
    \ and its likes. The term \"grid\" refers to some (more or less arbitrary) set\
    \ of parameters to try out, and we illustrated it in Example 5.9.\n\nAlthough\
    \ simple, grid search can be computationally expensive, in particular if the parameter\
    \ vector has a high dimension. As an example, having a grid with a resolution\
    \ of 10 points per dimension (which is a very coarse-grained grid) for a 5-dimensional\
    \ parameter vector requires $10^5 = 100,000$ evaluations of the objective function.\
    \ But one should avoid using grid search for this reason, for example, with low-dimensional\
    \ hyperparameters (in $L^1$ and $L^2$ regularization, $\\lambda$ is 1-dimensional,\
    \ where we use it for determining a regularization parameter $\\lambda$.\n\n```\n\
    **Algorithm 5.4** Grid search for regularization parameter $\\lambda$\n**Input:**\
    \ $(x_i, y_i)_{i=1}^{n_v}$ validation data $(x_j, y_j)_{j=1}^{n_v}$\n**Result:**\
    \ $\\hat{\\lambda}$\n1. for $\\lambda = 10^{-3}, 10^{-7}, \\dots, 10^{-10}$ (as\
    \ an example) do\n2. Learn $\theta$ with regularization parameter $\\lambda$ from\
    \ training data\n3. Compute error on validation data $E_{val}(\\lambda) \\leftarrow\
    \ \\frac{1}{n_v} \\sum_{j=1}^{n_v} (\\hat{y}(x_j; \theta) - y_j)^2$\n4. end\n\
    5 return $\\hat{\\lambda}$ as $\\arg\\min_{\\lambda} E_{val}(\\lambda)$\n```\n\
    \n> **Example 5.9:** Grid search\n\nWe apply grid search to the objective functions\
    \ from Example 5.3, with an arbitrary grid indicated by blue marks in Figure 5.16.\
    \ The found minimum, which is the grid with the smallest value of the objective\
    \ functions, is marked with a yellow dot.\n\n![](img/9c84a60f9e70ea0bf5c7c51ae709df3e_109_0.png)\n\
    \nDue to the unfortunate situation that the minimum is not found in the non-convex\
    \ problem (right of Figure 5.16). That could be handled by increasing the resolution\
    \ of the grid, which however requires more computations (more evaluations of the\
    \ objective function).\n\nSome hyperparameters (for $k$ in k-NN, Chapter 2) are\
    \ integers, and sometimes it is feasible to simply try all reasonable integer\
    \ values in grid search. Most of the time challenge in grid search is to select\
    \ a good grid. The grid used in Algorithm 5.4 is logarithmic between 0.001 and"
