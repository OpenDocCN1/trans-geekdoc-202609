  md: '# 6 Neural variables and deep learning


    ![](img/9c84a60f9e70ea0bf5c7c51ae709df3e_127_0.png)


    Figure 6.14: A CNN architecture for classification of 6 x 6 images. In the first
    convolutional layer four filters of size 3 x 3 produce a hidden layer with four
    channels. The first channel (a) is visualized in red and the second channel (b)
    is visualized in blue. We use stride 1 which indicates the number of rows and
    columns. In the second convolutional layer, filters of size 3 x 3 and 3 x 4 are
    used. After the second convolutional layer, with 3 rows, all 3 - 3 - 6 = 54 hidden
    units in the second hidden layer are densely connected to $U_3$ hidden units in
    the third layer, where all units link to their function mapping. We add an additional
    dense layer mapping to the $M$ logits. The network ends with a softmax function
    to predict class probabilities as. Note that the corresponding parameters are
    not included here to make the figure less cluttered.


    # Full CNN architecture


    A full CNN architecture consists of multiple convolutional layers. For predictive
    tasks, we decrease the number of rows and columns in the hidden layers as we proceed
    through the network, but instead increase the number of channels to enable the
    network to encode more high level features. After a few convolutional layers we
    usually end the network with one or more dense layers. For an image classification
    task, we use a softmax layer at the very end to get outputs in the range [0,1].
    The function when training a CNN will be the same as in the regression and classification
    networks explained earlier, depending on which type of problem we have. In Figure
    6.14 a small example of a full CNN architecture is described.


    > Example 6.3: Classification of hand-written digits - convolutional neural network


    In the previous models explained in Example 6.1 and 6.2 we placed the 28 x 28
    pixels of each image into a vector with 784 elements. With this action, we did
    not exploit the information that neighboring pixels are more likely to be correlated
    than pixels further apart. Instead, we now keep the matrix structure of the data
    and use a CNN with three convolutional layers and two dense layers. The settings
    for the layers are given in table below.


    | Number of filters/output channels | Layer 1 | Layer 2 | Layer 3 | Layer 4 |
    Layer 5 |

    |---|---|---|---|---|---||

    | Filter rows and columns | 4 | 8 | 12 | | |

    | | (5 x 5) | (5 x 5) | (4 x 4) | | |

    | Stride | 1 | 2 | | | |

    | Number of hidden units | 3136 | 1568 | 588 | 200 | 100 |

    | Number of parameters (offset weight) | 104 | 808 | 1548 | 117800 | 2100 |


    In a high-dimensional parameter space the number of saddle points in the cost
    function are frequent.


