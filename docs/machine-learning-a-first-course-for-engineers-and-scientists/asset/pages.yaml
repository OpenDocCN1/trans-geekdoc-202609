- pgno: 235
  md: '# User aspects of machine learning


    If the amount of available data is small, it is possible to perform k-fold cross-validation
    instead of putting aside hold-out validation data, the idea of how to use it in
    the iterative procedure is unchanged. To get a final estimate of performance,
    test data is used.


    In the iterative procedure, the hold-out validation data (or k-fold cross-validation)
    is used to judge if the new model is an improvement over the previous model. During
    this stage, we can also choose to train several new models. For example, if we
    have a neural network model and are interested in the hidden units in a certain
    layer, we can train several models, with a different choice of hidden units. Afterwards,
    we pick the one that performs best on the validation data. The number of hidden
    units in a layer is one example of hyperparameter. If we have more hyperparameters
    we want to evaluate we can make a search over these parameters. In Section 5.6
    we discuss hyper-parameter optimization in detail.


    Eventually, we have effectively used the validation data to compare many models.
    Depending on the size of the validation data, we might risk picking a model that
    performs well on the validation data in comparison to unseen data. To detect and
    to get a fair estimate of the actual performance of a model, we use the test data,
    which has neither used during training nor. If the performance on the validation
    data is substantially better than the performance on the test data, we have overfitted
    on the validation data. The easiest solution in that case would be to extend the
    size of the validation data. The test data should not be reused as a part of the
    training and model selection procedure. If we start making decisions based on
    our test data, the model will be adapted to the test data and we can no longer
    trust that the test performance is an objective of the actual performance of our
    model.


    It is important that both the validation data and the test data always come from
    the same distribution, namely the data distribution that we are expecting to see
    when we put the model into production. If we do not stem from the same distribution,
    we are validating and improving our models towards something that is not represented
    in the test data and "aiming for the wrong target". Usually, the training data
    is expected to come from the same distribution as the test and validation data,
    but this requirement can be relaxed if we have good reasons to do so. In Section
    11.2 we will discuss this further.


    When splitting the data into training, validation, and test, group leakage can
    be a potential problem. Group leakage can occur if the data points are not stochastically
    independent, but ordered into different groups. For example, in the medical domain
    many X-ray images belong to the same patient. In this case, if we do a random
    split over the images, different images belonging to the same patient will most
    end up in both the training and the validation set. The model learns the properties
    of a certain patient, then the performance on the validation data might be better
    than what we would expect in production.


    Even though we acknowledge the use of validation and test data to improve and
    assess the performance of the model, we should also evaluate the performance of
    the model in production. If we realize that the model is systematically worse
    in production on the test data we should try to find the reason for why this is
    the case. If possible, the best way of improving the model is to update the test
    data and validation data that they actually represent what we expect to see in
    production.


    # Size of validation and test data


    How much data should we set aside as hold-out validation data and test data, or
    should we avoid setting aside hold-out validation data? This depends on how much
    data we have, which performance difference we plan to detect, and how many models
    we plan to compare. For example, if we have a classification model with a 99.8%
    accuracy and want to know if a new model is better, a validation dataset of 100
    data points will not be able to tell that. Also, if'
