  md: "# 7.2 Random forests\n\nmake is not all data points from the original dataset\
    \ $\\mathcal{T}$ have been used for training all ensemble members. It can be shown\
    \ with the bootstrap, on average 63% of the original training points in $\\mathcal{T}\
    \ = \\{x_i, y_i\\}_{i=1}^n$ will be present in a bootstrapped dataset $\\tilde{\\\
    mathcal{T}} = \\{\tilde{x}_i, y_i\\}_{i=1}^n$. Roughly speaking, this means for\
    \ any $\\{x_i, y_i\\}$ in $\\mathcal{T}$ about one third of the ensemble members\
    \ will not have used for data point during training. We refer to these (roughly\
    \ $B/3$) ensemble members as out-of-bag for data point $i$, and we let them form\
    \ our out-of-bag ensemble. Note that the out-of-bag ensemble is different for\
    \ each data point $\\{x_i, y_i\\}$.\n\nThe next key is that for the out-of-bag\
    \ member $i$, the data point $(x_i, y_i)$ can act as a test point since it has\
    \ not been seen by any of the ensemble members. By computing the (e.g., squared\
    \ or misclassification) error when the out-of-bag member $i$ predicts $y_i$, we\
    \ get an estimate of $E_{new}$ for this out-of-bag ensemble. Since $E_{OOB}$ is\
    \ based on only data point $i$, it will be a poor estimate of $E_{new}$. If we\
    \ repeat this for all data points $\\{x_i, y_i\\}$ in $\\mathcal{T}$ and average\
    \ $E_{OOB} = \\frac{1}{n} \\sum_{i=1}^n E_{OOB,i}$ we get a better estimate of\
    \ $E_{new}$. Indeed, $E_{OOB}$ will be an estimate of $E_{new}$ with only $B/3$\
    \ (and not) members, as we have seen in (7.3), the performance of bagging plateaus\
    \ after a certain number of ensemble members. However, if $B$ is large enough\
    \ so that with $B/3$ members perform similarly, $E_{OOB}$ provides an estimate\
    \ of $E_{new}$ which can be at least as good as the estimate $E_{k-fold}$ from\
    \ $k$-fold cross-validation. Most importantly, $E_{OOB}$ requires much more computation\
    \ than re-training $k$ times.\n\n# 7.2 Random forests\n\nIn bagging we reduce\
    \ the variance by averaging an ensemble of members. Unfortunately, the variance\
    \ reduction is limited by the correlation between the individual ensemble members\
    \ (compare the dependence on the correlation $\\rho$ in (7.2b)). However, using\
    \ a simple trick it is possible to reduce the correlation what is achieved by\
    \ the bootstrap, using several methods referred to as random forests.\n\nWhile\
    \ bagging is a general technique that can be used to reduce the variance of any\
    \ base model, random forests assume that base models are classification or regression\
    \ trees. The idea is to introduce randomness when constructing each tree, in order\
    \ to further reduce the correlation among the base models. At this first sight\
    \ it might seem a silly idea: randomly perturbing the tree would intuitively degrade\
    \ its performance. There is a rationale for this perturbation, which we will discuss\
    \ below, before we present the details of the algorithm.\n\nLet $n$ be the size\
    \ of the bootstrapped dataset. To train a classification or regression tree on\
    \ this data we proceed as usual (Section 2.3), but with one difference: Through\
    \ the training, we will observe that at some point we split the node not to consider\
    \ all possible input variables $x_1, \\dots, x_n$ as splitting variables. Instead,\
    \ we pick a random subset consisting of $q \\leq n$ inputs, and only consider\
    \ these $q$ variables as possible splitting variables. At the next split we draw\
    \ a new random subset of $q$ inputs to use for each of the $B$ ensemble members,\
    \ so that (with high probability) we use different splitting variables as as possible\
    \ splitting variables, and so on. This random selection is independent of each\
    \ member and end up using different subsets of the different trees. This will\
    \ cause the trees to be less correlated and averaging their predictions can therefore\
    \ result in larger variance reduction compared to the process which will increase\
    \ the variance $E_{new}$ in the equation of (7.2b). Random forests decreases $\\\
    rho$ (good) but increases $r^2$ (bad) compared to bagging. Experience has shown\
    \ that the reduction in correlation is the dominant effect, so that the averaged\
    \ variance is often reduced. We illustrate this in Example 7.4 below.\n\nTo understand\
    \ why this is based on recursive subset of inputs as splitting variables, recall\
    \ that tree building is a greedy algorithm. This is that the algorithm can make\
    \ early choices on input that appear to be good, but which nevertheless turns\
    \ out\n\n> ^3And also the bags, in similar in a manner as the bootstrap might\
    \ increase the bias, see Footnote 2, page 30."
