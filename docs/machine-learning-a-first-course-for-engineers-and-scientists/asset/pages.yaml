    the negative log-likelihood loss is a very generic loss function (it is applicable
    to regression, classification,

    and many other types of problems). We can complement this by the theoretical statement
    that


    > the negative log-likelihood loss is strictly proper.


    Note that this applies to any type of problem where the negative log-likelihood
    loss can be used. As noted

    above, the concept of a loss function being strictly proper is related to its
    asymptotic minimizer, which

    turn is derived under the assumption of infinite reflectivity and finite data.
    Here what our claim above

    says that if the likelihood-based model is flexible enough to describe the true
    conditional distribution

    p(y|x), the optimal solution to minimize the likelihood as $n \to \infty$ is to
    learn this true

    distribution.


