  md: "8 Nonlinear input transformations and kernels\n\n# 8.5 Support vector classification\n\
    \nWe have spent some time deriving two kernel versions of linear regression: kernel\
    \ ridge regression and support vector regression. We will now focus on classification.\
    \ Unfortunately the derivations become more technically inclined than for kernel\
    \ regression, and we have placed the derivations in the chapter appendix. However,\
    \ the intuition carries over from regression, as well as the main ideas of the\
    \ dual formulation, the kernel trick and the change of loss function.\n\nIt is\
    \ possible to derive a kernel of logistic regression with $L^2$-regularization.\
    \ The derivation can be made by replacing $x$ with $\\phi(x)$, and then use the\
    \ representer to derive its dual formulation and apply the kernel trick. Since\
    \ kernel logistic regression is rarely used in practice, we will instead go straight\
    \ to support vector classification. As the name says, support vector classification\
    \ is the counterpart of support vector regression. Both support vector regression\
    \ and classification are SVMs which both have sparse dual parameters.\n\nWe consider\
    \ the binary classification problem $y \\in \\{-1,1\\}$, and start with the margin\
    \ formulation (see (5.12) in Chapter 5 of the logistic regression\n\n```\n$$\\\
    widehat{Y}(\\mathbf{x}_s) = \\sign(\\theta^T\\phi(\\mathbf{x}_s)).$$\n```\n\n\
    If we were to learn $\theta$ using the logistic loss (5.14), we would obtain logistic\
    \ regression with a nonlinear feature transformation $\\phi(x)$, from which kernel\
    \ regression would eventually work out. However inspired by support vector regression,\
    \ we will instead use that of the hinge loss (5.17),\n\n```\n$$L(\\mathbf{x},\
    \ y, \\theta) = \\begin{cases} 1 - y\\theta^T\\phi(\\mathbf{x}) & \\text{if }\
    \ y\\theta^T\\phi(\\mathbf{x}) < 1 \\\\0, & \\text{otherwise} \\end{cases}.$$\n\
    ```\n\nFrom 5.2, it is not immediately clear what advantages the hinge loss has\
    \ over the logistic loss. Analytically to the $\\epsilon$-insensitive loss, the\
    \ advantage of the hinge loss carries over when we look at the dual formulation\
    \ $a$ of the primal formulation with $\theta$. Before introducing a dual formulation\
    \ we first have to find the primal. With $L^2$-regularization, which with (8.33)\
    \ gives the primal formulation\n\n```\n$$\\widehat{\\alpha} = \\arg\\min_{\\alpha}\
    \ \\sum_{n=1}^m \\max\\0, 1 - y_n\\theta^T\\phi(\\mathbf{x}_n)\\} + \\lambda|\\\
    alpha|_2^2.$$\n```\n\nThe primal formulation does not work without the kernel\
    \ trick, since the feature vector does not show up as $\\phi(x)^T\\phi(x)$. By\
    \ using optimization theory and constructing the Lagrangian (the details are found\
    \ in Appendix 8.B), we can arrive at the dual formulation$^1$ of (8,34),\n\n```\n\
    $$$\\widehat{\\alpha} = \\arg\\min_{\\alpha} \\frac{1}{2}\\alpha^T\\mathbf{K}(\\\
    mathbf{X},\\mathbf{X}) - \\alpha^T\\y,$$\n```\n\n```\n$$\\text{subject to } |\\\
    alpha| \\le \\frac{1}{2n} \\text{ and } 0 \\le \\alpha_i y_i.$\n```\n\nwith\n\n\
    ```\n$$\\widehat{Y}(\\mathbf{x}_s) = \\sign(\\widehat{\\alpha}^T\\mathbf{K}(\\\
    mathbf{X},\\mathbf{x}_s))..$\n```\n\ninstead of (8.32). Note that we also have\
    \ to made use of kernel trick by replacing $\\phi(x)^T\\phi(x)$ with $\\kappa(x,x')$\
    \ in (8.35a) and (8.35b). As in support vector regression, adding an offset term\
    \ $\thetatheta0$ to (8.32) corresponds to enforcing an additional constraint $\\\
    sum_{i=1}^m \\alpha_i = 0$ in (8.35).\n\n> ^1In other words, it is to let the\
    \ Lagrange multipliers (see Appendix 8.B) also be the dual. It is mathematically\
    \ equivalent, but we have chosen this formulation to highlight the similarities\
    \ to the other kernel methods and the importance of the representer theorem.\n\
    \nDraft (April 30, 2021) of Machine Learning – A First Course for Engineers and\
    \ Scientists. http://smilbook.org\n\n172 *Andreas Lindholm, Nikolai Wahlström,\
    \ Fredrik Fridson, and Thomas B. Schon. 2021."
