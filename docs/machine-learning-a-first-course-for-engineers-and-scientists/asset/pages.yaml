  md: "# Generative models and learning from unlabeled data\n\n![](img/9c84a60f9e70ea0bf5c7c51ae709df3e_231_0.png)\n\
    \n**Figure 10.11:** An illustration of PCA in $\\mathbb{R}^2$. In the left panel\
    \ some $\\{x_i\\}_{i=1}^n$ is shown. The middle panel shows the first (red) and\
    \ second (green) principal axes. These vectors are given by the first and second\
    \ column of $V$, respectively. The plot also shows the data points projected on\
    \ the first principal axis (pink), which are the same as the reconstructed data\
    \ points obtained by a linear auto-encoder with $q=1$ latent dimensions. The right\
    \ panel shows an ellipse fitted to the covariance matrix $\\frac{1}{n}XX^T$ of\
    \ the data. The principal axes of the ellipse are the ones from the middle panel,\
    \ but the width of the ellipse along each axis is scaled by the standard deviation\
    \ in the corresponding direction. This illustrates that PCA finds an axis near\
    \ $R^P$ which is rotated to align with the covariance of the data.\n\nwhere $A\
    \ = p \times p$ diagonal matrix with the values $\\Lambda = r r^2/n$ on the diagonal.\
    \ This can be recognized as an eigenvalue decomposition of the covariance matrix.\
    \ Consequently, the principal axes (columns of $Y$) are the same as the eigenvectors\
    \ of the covariance matrix. Furthermore, the eigenvalues are given by the squared\
    \ singular values, normalized by $n$. The eigenvectors and eigenvalues of a covariance\
    \ matrix can be said to denote its “geometry”. If we think about fitting a Gaussian\
    \ distribution to the data and then draw a level curve of this will take the form\
    \ of an ellipse. The shape of the ellipse is identified with the covariance matrix\
    \ of the distribution. Specifically, the principal axes of the ellipse correspond\
    \ to the eigenvectors of the covariance matrix (which are the same as the principal\
    \ axes of the data). Furthermore, the variances of the data in the directions\
    \ of the principal axes are given by the corresponding eigenvalues. The width\
    \ of the ellipse along each principal axis is proportional to the standard deviation\
    \ of the data along this direction, which corresponds to the singular values of\
    \ the data. We illustrate this in the right panel of Figure 10.11.\n\nAs a final\
    \ comment, we note that it often can be a good idea to standardize the data before\
    \ applying PCA, in particular if the different variables $x_j, j=1, \\dots, p$\
    \ have very different scales. Otherwise the principal directions can be heavily\
    \ biased towards certain variables simply because they are expressed in a unit\
    \ with a dominant scale. However, if the units and scales of the variables are\
    \ meaningful for the problem at hand, it can also be argued that standardizing\
    \ counters the purpose of PCA since the intention is to find the directions with\
    \ maximum variance. Thus, what is most appropriate needs to be decided on a case-by-case\
    \ basis.\n\n# 10.5 Further reading\n\nMany textbooks on machine learning contains\
    \ methods and methods for unsupervised learning, including Bishop (2006), Hastie\
