  md: '# 3 Basic parametric models and a statistical perspective on learning


    ![](img/9c84a60f9e70ea0bf5c7c51ae709df3e_49_0.png)


    **Figure 3.6:** Logistic regression applied to the music classification problem
    from Example 2.1. The decision boundaries are linear, unlike trees (Figure 2.11a)
