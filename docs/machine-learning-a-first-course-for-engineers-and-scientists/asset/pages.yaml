  md: "# 8 Nonlinear input transformations and kernels\n\nAll training data is used\
    \ during training (that is, solving (8.19b)) but when making predictions (using\
    \ (8.19a)) only the support vectors contribute. This can significantly reduce\
    \ the computational burden. The larger $\\epsilon$ chosen by the user, the fewer\
    \ support vectors and fewer computations needed when making predictions. It can\
    \ therefore be said that $\\alpha$ has a regularizing effect, in the sense that\
    \ the more/fewer support vectors that are used the more/less complicated model.\
    \ We summarize support vector regression in Method 8.2.\n\n# Learn support vector\
    \ regression\n\n**Data:** Training data $\\mathcal{T} = \\{x_i, y_i\\}_{i=1}^n$\n\
    **Result:** Learned parameters $\\hat{\\alpha}$\n\n+   1 Compute $\\hat{\\alpha}$\
    \ by numerically solving (8.19b-8.19c)\n\n# Predict with kernel ridge regression\n\
    \n**Data:** Learned parameters $\\hat{\\alpha}$ and test input $\\mathbf{x}_*$\n\
    **Result:** Prediction $\\hat{y}(\\mathbf{x}_*)$ (8.19a).\n\n+   1 Compute $\\\
    hat{y}(\\mathbf{x}_*)$ as (8.19a).\n\n# Method 8.2: Support vector regression\
    \ and kernel ridge regression\n\nWe consider again the car stopping distance problem\
    \ from Example 8.2 in Figure 8. With $\\lambda=0.01$ and $\\epsilon=15$, we apply\
    \ support vector regression to the data (red line). As a reference we also show\
    \ the corresponding kernel ridge regression (blue line).\n\n![](img/9c84a60f9e70ea0bf5c7c51ae709df3e_165_0.png)\n\
    \n**Fig. 8.4**\n\nIn Figure 8.4 we have enclosed (in red) the $\\epsilon$-tube\
    \ all data points where $\\alpha_i \neq 0$, the so-called support vectors. We\
    \ have included all support vectors located outside the $\\epsilon$-tube. This\
    \ is a direct effect of using the $\\epsilon$-insensitive loss, which explicitly\
