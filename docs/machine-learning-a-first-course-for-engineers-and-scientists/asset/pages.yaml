  md: '# 4.5 Additional tools for evaluating binary classifiers


    # 4.5 Additional tools for evaluating binary classifiers


    For classification, and in particular binary classification, there exists a wide
    range of additional tools for inspecting the performance beyond the misclassification
    rate. For simplicity we consider the binary problem and use a hold-out validation
    dataset approach, but some of the ideas can be extended to the multiclass problem
    as k-fold cross-validation.


    Some of are are particular useful for imbalanced/or asymmetric problems, that
    we will discuss later in this section. Remember that in binary classification
    have either y = {-1, 1}. If a binary classifier is used to detect the presence
    of something, such as a device on the radar, the convention is that y = 1 (positive)
    denotes presence, and y = -1 (negative) denotes absence. This convention is the
    bedrock for a lot of the terminology we will introduce now.


    # The confusion matrix and the ROC curve


    If we have a binary classifier and evaluate it on a hold-out validation dataset,
    a simple yet useful way to inspect the performance more than just counting errors
    is a confusion matrix. By separating the validation data into four groups depending
    on y (the output) and y* (the output predicted by the classifier), we can make
    the confusion matrix


    | y = -1 | y = 1 | total |

    |---|---|--|

    | y*(x) = -1 | True neg (TN) | False neg (FN) | N* |

    | y*(x) = 1 | False pos (FP) | True pos (TP) | P* |

    | total | N | n |


    Of course, TN, FN, FP, TP (and N*, P*, N and n) are replaced by the actual numbers,
    as in Example 4.5. Note that P (N) denotes the total number of positive (negative)
    examples in the data set, where P* (N*) denotes the total number of positive (negative)
    predictions made by the model. The confusion matrix provides a clear and informative
    overview of the characteristics of a classifier. For asymmetric problems, it is
    important to distinguish between false positive (also called type I error) and
    false negative (FN, also called type II error). They should ideally be both, but
    in practice there is a tradeoff between false negatives and false positives and
    the confusion matrix is a helpful tool in visualizing them. That tradeoff between
    false negatives and false positives can often be done by tuning a threshold r
    that is present in many binary classifiers (3.36).


    There is a wide body of terminology related to the confusion matrix, which is
    summarized in Table 4.1. Some common terms are


    | TP | TP |

    |---|---|

    recall = TP / P | TP + FN | precision = P* / TP + FP |


    Recall describes how large proportion of the positive data points are correctly
    predicted as positive. A high recall (close to 1) is good, and a low recall (close
    to 0) indicates a problem with many false negatives. A high precision (close to
    1) is good, and a low precision (close to 0) indicates a problem with many false
    positives.


    Many classifiers contains a threshold r (3.36). When to compare different classifiers
    for a certain problem without specifying a decision threshold r, the ROC curve
    can be used. ROC means “receiver operating characteristics”, and is due to history
    from communications theory.


    To plot a recall/true positive rate (TP/P, a large value is good) for all r ∈
    [0,1). The curve typically looks upwards in Figure 4. A ROC curve for a perfect
    classifier reaches the upper left corner, whereas that only random guesses gives
    a straight diagonal line.


    > *That is, if y = -1 with probability r.'
