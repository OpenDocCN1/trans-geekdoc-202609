    # 4.6 Further reading


    This chapter was to a large extent inspired by the introductory machine learning
    textbook by Abu-Mustafa et al. (2012). There are also other textbooks on machine
    learning, including Vapnik (2000) and Mohri et al. (2018), in which the central
    theme is understanding the generalization gap using formal definitions of model
    flexibility such as the VC dimension or Rademacher complexity. The understanding
    of model flexibility for deep neural networks (Chapter 6 is, still subject to
    research, see for example C. Zhang et al. (2017), Neyshabur et al. (2017), Belkin
    et al. (2019) and Neal et al. (2019) for some directions. Furthermore, the bias-variance
    decomposition is most often (including this chapter) presented only for regression,
    but a possible generalization to the classification problem is suggested by Domingos
    (2000). An alternative to the precision-recall curve, the so-called precision-recall-gain-curve,
    is presented by Flock and Kull (2015).


