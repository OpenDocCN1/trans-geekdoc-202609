  md: "# 5.6 Hyperparameter optimization\n\n# Stochastic second order gradient methods\n\
    \nThe idea of improving the stochastic gradient method by exploiting second order\
    \ information is natural in settings involving ill-conditioning and significant\
    \ nonlinearity. At the same time this will add complexity and computational time\
    \ to the algorithm, which needs to be traded off in the design of these algorithms.\n\
    \nA popular and natural strand of algorithms are those sorting under the name\
    \ stochastic quasi-Newton methods. As mentioned above, the idea underlying deterministic\
    \ quasi-Newton methods is to compute approximation of the Hessian using information\
    \ in the gradients. For large-scale problems we make use of a receding history\
    \ of gradients. These ideas can be employed also in the stochastic setting, albeit\
    \ with new algorithms as the result.\n\n# Adaptive methods\n\nThe idea of using\
    \ gradients from earlier steps is also exploited in the adaptive methods. By considering\
    \ different ways of combining the gradients from earlier steps into suitable learning\
    \ rates\n\n```\n$$\\gamma_t = \\gamma(\\nabla J_t, \\nabla J_{t-1}, \\dots, \\\
    nabla J_0)$\n```\n\nand search directions\n\n```\n$d_t = d(\\nabla J_t, \\nabla\
    \ J_{t-1}, \\dots, \\nabla J_0)$\n```\n\nwe obtain different members of this family\
    \ of methods. In the basic stochastic gradient $d_t$, only depends on the current\
    \ gradient $\nabla J_t$. The resulting update rule for the adaptive stochastic\
    \ gradient methods is\n\n```\n$$\\theta_{(t+1)} = \\theta_{(t)} - \\gamma_t d_t$\n\
    ```\n\nThe most popular member of this class of methods uses one of exponential\
    \ moving average, where recent gradients have higher weights over older gradients.\
    \ Let $\\beta_1 < 1$ and $\beta_2 < 1$ denote the exponential weights for the\
    \ search direction and the learning rate, respectively. The ADAM optimizer updates\
    \ the search direction and the learning rate according\n\n```\n$d_t = (1 - \\\
    beta_1) \\sum_{i=1}^{t} \\beta_1^{t-i} \\nabla J_i$\n```\n\n```\n$$\\gamma_t =\
    \ \\frac{\\eta}{\\sqrt{t}} (1 - \\beta_2) \\text{diag}(\\sum_{i=1}^{t} \\beta_2^{t-i}\
    \ ||\\nabla J_i||^2)^{1/2}$\n```\n\nBoth of the tuning parameters $\\beta_1$ and\
    \ $\\beta_2$ are typically set to be close to 1 and common values like $\\beta_1\
    \ = 0.9, \\beta_2 = 0.999$. The setting is too small that small will effectively\
    \ result in an exponential forgetting of the past information and remove—often\
    \ very valuable—memory effect inherent in this method.\n\nThe first member of\
    \ this adaptive family is called ADAGRAD which makes use of the current gradient\
    \ as its search direction $d_t = \\nabla J_t$ and a learning rate with memory,\
    \ but where all components are equally important,\n\n```\n$$\\gamma_t = \\frac{\\\
    eta}{\\sqrt{t}} \\text{diag}(\\sum_{i=1}^{t} ||\\nabla J_i||^2)^{1/2}$\n```\n\n\
    # 5.6 Hyperparameter optimization\n\nBesides the parameters of a model, there\
    \ are quite also a set of hyperparameters that have to be optimized. As a concrete\
    \ example we use the regularization parameter $\\lambda$, but the discussion below\n\
    \nThis material will be published by Cambridge University Press. This pre-publication\
    \ version is free to view and download for personal use only. Not for re-distribution,\
    \ re-sale or use in derivative works.\n109\nAndreas Lindholm, Nikolai Wahlström,\
    \ Fredrik Lindkvist, and Thomas B. 2021."
