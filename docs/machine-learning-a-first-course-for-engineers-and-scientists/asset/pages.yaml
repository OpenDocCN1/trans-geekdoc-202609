- pgno: 42
  md: "# 3.1 Linear regression\n\nSince the logarithm is a monotonically increasing\
    \ function, maximizing the log-likelihood (3.19) is equivalent to maximizing the\
    \ likelihood itself. Pushing (3.18) and (3.19) together, we get\n\n```\n$$\\ln\
    \ p(\\mathbf{y} | \\mathbf{X}; \\boldsymbol{\theta}) = -\\frac{n}{2}\\ln(2\\pi\\\
    sigma^2) - \\frac{1}{2\\sigma^2}\\sum_{i=1}^{n}(\\theta^T\\mathbf{x}_i - y_i)^2$.$\
    \ (3.20)\n```\n\nRemoving terms and factors independent of $\\boldsymbol{\theta}$\
    \ does not changing the argument, and we see that we can rewrite (3.15) as\n\n\
    ```\n$$\\hat{\\boldsymbol{\theta}} = \\arg\\max p(\\mathbf{y} | \\mathbf{X}; \\\
    boldsymbol{\theta}) = \\arg\\max \\sum_{i=1}^{n}(\\theta^T\\mathbf{x}_i - y_i)^2\
    \ = \\arg\\min \\frac{1}{2}\\sum_{i=1}^{n}(\\theta^T\\mathbf{x}_i - y_i)^2$.$\
    \ (3.21)\n```\n\nThis is indeed linear regression with the least squares cost\
    \ (the cost function implied by the squared loss function (3.10)). Hence, using\
    \ the squared error loss is equivalent to assuming a Gaussian noise distribution\
    \ in the maximum likelihood formulation. Other assumptions on $\\varepsilon$ leads\
    \ to other loss functions, as we will discuss in Chapter 5.\n\n# Categorical input\
    \ variables\n\nThe regression problem is characterized by a numerical output y,\
    \ and inputs x of arbitrary type. We have, however, only discussed the case of\
    \ numerical inputs so far. To see how handle categorical inputs in the linear\
    \ regression model, assume that we have an input variable that only takes two\
    \ different values. We refer to these values as A and B. We can create a dummy\
    \ variable $x$ as\n\n```\n$x = \\begin{cases} 0 & \\text{if A},\\n1 & \\text{if\
    \ B},\\end{cases}$$ (3.22)\n```\n\nand use this in any supervised machine learning\
    \ method as if it was numerical. For linear regression, this effectively gives\
    \ us a model which looks like\n\n```\n$y = \\theta_0 + \\theta_1x + \\varepsilon\
    \ = \begin{cases} \\theta_0 + \\varepsilon & \\text{if A},\\n\\theta_0 + \\theta_1\
    \ + \\varepsilon & \\text{if B}.\\end{cases}$$ (3.23)\n```\n\nThe model allows\
    \ us to learn and predict different values depending on whether the input is A\
    \ or B. If the categorical variables take more than two values, let us say A,\
    \ B, C, and D, we can make a so-called one-hot encoding by constructing a four-dimensional\
    \ vector\n\n```\n$$\\mathbf{x} = [x_A, x_B, x_C, x_D]^T$$ (3.24)\n```\n\nwhere\
    \ $x_A = 1$ if A, $x_B = 1$ if B, and so on. That is, only one element of $\\\
    mathbf{x}$ will be 1, the rest are 0. Again, this construction can be used for\
    \ any supervised machine learning, and is not restricted to linear regression."
