  md: "# 3 Basic parametric models and a statistical perspective on learning\n\n>\
    \ Example 3.2: Car stopping distances\n\nBy inserting the matrices (3.6) from\
    \ Example 3.1 into the normal equations (3.7), we obtain $\\hat{\theta}_0 = -20.1$\
    \ and $\\hat{\theta}_1 = 3.14$. Plotting the resulting model gives us Figure 3.3.\n\
    \n![](img/9c84a60f9e70ea0bf5c7c51ae709df3e_41_0.png)\n\nFig. 3.3 This can be compared\
    \ to $k$-NN and decision trees the model behaves differently than these models;\
    \ linear regression does not share the “local” nature of $k$-NN and decision trees\
    \ (only training data points close to $x_i$ affect $\\hat{y}(x_i)$), which is\
    \ related to the fact that linear regression is a parametric model.\n\n# The maximum\
    \ likelihood perspective\n\nTo get another perspective of the squared error loss\
    \ we will reinterpret the least squares method as a maximum likelihood solution.\
    \ The ‘likelihood’ refers to the statistical concept of the likelihood function,\
    \ and maximizing the likelihood function amounts to finding the value of $\theta$\
    \ that makes observing $y$ as likely as possible. That is, instead of (whatever\
    \ arbitrarily selecting a likelihood function, what we need is the problem\n\n\
    $$\\hat{\theta} = \\arg \\max p(y|\\mathbf{X};\\theta). \\quad (3.15)$\n\nHere\
    \ $p(y|\\mathbf{X};\\theta)$ is the probability density of all observed outputs\
    \ $y$ in the training data, given all inputs $\\mathbf{X}$ and parameters $\t\
    heta$. This determines what ‘likely’ means, which we need to specify it in more\
    \ detail. A common assumption is that the noise term $\\epsilon$ is a stochastic\
    \ variable with a certain distribution. A Gaussian distribution (also known as\
    \ a normal distribution) with mean zero and variance $\\sigma_{\\epsilon}^2$.\n\
    \n$$\\epsilon \\sim N(0,\\sigma_{\\epsilon}^2). \\quad (3.16)$\n\nThis implies\
    \ that the $n$ observed data points are independent, and $p(y|\\mathbf{X})$ factors\
    \ as\n\n$p(y|\\mathbf{X};\\theta) = \\prod_{i=1}^n p(y_i|x_i;\\theta). \\quad\
    \ (3.17)$\n\nConsidering the linear regression model from (3.3), $y = \\theta^T\\\
    mathbf{x} + \\epsilon$, with the Gaussian noise assumption (3.16) we have\n\n\
    $p(y_i|x_i;\\theta) = N(y_i;\\theta^T\\x_i,\\sigma_{\\epsilon}^2). \\quad (3.18)$\n\
    \nRecall that we want to maximize the likelihood with respect to $\theta$. For\
    \ numerical methods, it is usually better to work with the logarithm of $p(y|\\\
    mathbf{X};\\theta)$.\n\n$ln p(y|\\mathbf{X};\\theta) = \\sum_{i=1}^n \\ln p(y_i|x_i;\\\
    theta). \\quad (3.19)$"
