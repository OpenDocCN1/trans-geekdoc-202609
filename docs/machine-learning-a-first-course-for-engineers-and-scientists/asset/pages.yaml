    # 1.2 About this book


    The aim of this book is to convey the spirit of supervised machine learning, without
    requiring any previous experience in the field. We focus on the underlying mathematics
    as well as the practical aspects. This book is a textbook, it is not a reference
    work nor a programming manual. It contains only a (careful) selection of supervised
    machine learning methods and no programming code. There are many well-known and
    well-documented code packages, and it is our belief that with a good understanding
    of the mathematics and the inner workings of the methods, the reader will be able
    to make the connection between this book and their favorite code package in their
    programming language.


    We take a statistical approach in this book, meaning that we discuss and motivate
    methods in terms of statistical properties. It requires some previous knowledge
    in statistics and probability theory, as well as calculus and linear algebra.
    We hope that the book from start to end will give the reader a good starting point
    for working as a machine learning engineer and/or pursuing further studies within
    the subject.


    The book is written so that it can be read back to. There are, however, possible
    paths through the book that are more selective depending on the interest of the
    reader. Figure 1.6 illustrates the major dependencies between the chapters. In
    Chapter 2, 3 and 4, and we recommend the reader to read these chapters before
    proceeding to the later chapters that contain technically more advanced topics
    (Chapter 5-9). Chapter 10 goes beyond the supervised learning of machine learning,
    and Chapter 11 focuses on some of the more practical aspects with a less technical
    nature than the preceding chapters. Finally, Chapter 12 (written by David Summers)
    discusses ethical aspects of modern machine learning.'
