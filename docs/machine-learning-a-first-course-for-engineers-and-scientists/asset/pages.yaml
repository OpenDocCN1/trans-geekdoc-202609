    that support array copying. For the implementation you may want to consider using
    the transposed version of **W** and **b** as your weight matrix and offset vector
    to avoid transposition in each layer.


    # Neural networks for classification


    Neural networks can also be used for classification where we have categorical
    outputs $y \in \{1, \dots, M\}$ instead of numerical. In Section 3.2 we extended
    linear regression to regression by adding the logistic function to the output.
