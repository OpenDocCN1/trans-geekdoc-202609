    Note that we use the training data labels $y$, as index values to select the correct
    conditional probability for the loss function. then the $i$-th term of the sum
    is the negative logarithm of the $y_i$,th element of vector $g(x; \theta)$. We
    illustrate the meaning of this in Example 3.4.


    Inserting the model (3.43) into the loss function gives the cost function to optimize
    when learning multiclass regression.


    ```

    $J(\theta) = \frac{1}{n} \sum_{i=1}^{n} -\theta_{y_i}^T x_i + \ln \sum_{j=1}^{M}
    e^{\theta_j^T x_i}; \quad (3.45)$

    ```


    We apply this to the music classification problem in Example 3.6.


    > **Example 3.4:** The cross-entropy loss for multiclass problems


    Considering the following (very small) data with $n=6$ points, $p=2$ input dimensions
    and $M=3$ classes, which we want to use for learning a multiclass classifier:


    $X = \begin{pmatrix} 0.20 & 0.86 \ 0.41 & 0.18 \ 0.96 & -1.84 \ -0.25 & 1.57 \
    -0.82 & -1.53 \ -0.31 & 0.58 \end{pmatrix}, \quad y = \begin{pmatrix} 1 \ 2 \
    3 \ 1 \ 2 \ 3 \end{pmatrix}$


    Multiclass regression with softmax (or any other multiclass classifier which predicts
    a vector of conditional class probabilities) returns a 3-dimensional probability
    vector $g(x;\theta)$ for any $x$ and $\theta$. If we take the logarithms of the
    transpose of all vectors $g(x_i;\theta)$ for $i=1, \dots, 6$, we obtain the matrix


    ```

    $G = \begin{pmatrix} \ln g_1(x_1;\theta) & \ln g_2(x_1;\theta) & \ln g_3(x_1;\theta)
    \ \ln g_1(x_2;\theta) & \ln g_2(x_2;\theta) & \ln g_3(x_2;\theta) \ \ln g_1(x_3;\theta)
    & \ln g_2(x_3;\theta) & \ln g_3(x_3;\theta) \ \ln g_1(x_4;\theta) & \ln g_2(x_4;\theta)
    & \ln g_3(x_4;\theta) \ \ln g_1(x_5;\theta) & \ln g_2(x_5;\theta) & \ln g_3(x_5;\theta)
    \ \ln g_1(x_6;\theta) & \ln g_2(x_6;\theta) & \ln g_3(x_6;\theta) \end{pmatrix}$

    ```


    Computing the multiclass cross-entropy cost (3.44) now simply amounts to taking
    the average of all circled elements, the element in row $i$ is given by the training
    label $y_i$. Training the model amounts to finding $\theta$ such that this negated
    average is minimized.'
