  md: '# 8.5 Support vector classification


    Because of the representer theorem, the formula (8.35c) should come as no surprise
    to us, since it simply corresponds to inserting (8.16) into (8.32). However, the
    representer theorem tells us that its dual formulation: the (8.35a)-(8.35b) does
    not follow automatically from the representer theorem requires its own derivation.


    The most interesting property of the constrained optimization problem (8.35) is
    that its solution $\alpha$ turns out to be sparse. This is exactly the same phenomena
    with support vector regression, and the strength of this method, which (8.35)
    is called SVM, is support vector classification. The model has the full flexibility
    of a kernel method, and yet the prediction (8.35c) only explicitly depends on
    a subset of the training data (the support vectors). It is however important to
    realize that all training data points are needed when solving (8.35). We summarize
    by Method 8.3.


    The support vector property is due to the fact that the loss function is exactly
    equal to zero when the margin (Chapter 5) is $\ge1$. In the dual formulation,
    the parameter $\alpha_i$ becomes nonzero only if the margin point $i\le1$, which
    makes $\alpha$ sparse. It can be shown that this corresponds to data points being
    either on the "wrong side" of the decision boundary or within the decision boundary
    in the feature space $\Phi(x)$. We illustrate this by Example 8.5.


    # Example 8.5: Support vector classification


    We consider the binary classification problem with the data in Figure 8.5 and
    apply support vector classification with the linear and squared kernel, respectively,
    in Figure 8.6. We mark the support vectors with yellow circles. For the linear
    kernel, the locations of the support vectors are either on the "wrong side" of
    the decision boundary or within it, marked with white lines. As we decrease $\lambda$
    we allow for larger $\theta$ and therefore a smaller penalty and consequently
    fewer support vectors.


    ![](img/9c84a60f9e70ea0bf5c7c51ae709df3e_172_0.png)


    ![](img/9c84a60f9e70ea0bf5c7c51ae709df3e_172_1.png)


    When using the (nonlinear) squared exponential kernel, the solution becomes somewhat
    harder to interpret. It holds that the support vectors are either on the "wrong
    side" of the decision boundary or within it, but the distance is measured in the
    infinite dimensional $\Phi(x)$-space. Mapping this back to the original input
    space shows this nonlinear behavior. The meaning of the dashed lines are the same
    as above. This also serves as a good illustration of the power in using kernels.'
