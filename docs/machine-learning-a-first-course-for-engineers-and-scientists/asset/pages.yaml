    # Design choices for AdaBoost


    AdaBoost, and in fact any boosting algorithm, has two important design choices,
    (i) which base classifier to use, and (ii) how many iterations $B$ to run the
    boosting algorithm. As previously pointed out, we can use essentially any classification
    method as base classifier. The most common choice in practice is to use a shallow
    tree, or even a decision stump (a tree of depth one; see Example 7.5). This choice
    is guided by the fact that boosting reduces efficiently, and we can learn good
    models despite a very weak (high-bias) base model. Since shallow trees can be
    trained quickly, they are a good default choice. Practical experience shows that
    trees with a handful of terminal nodes work well as base models, but trees of
    depth one (only $M=2$ terminal nodes in binary classification) as perhaps more
    commonly used. In fact, using deep classifiers (high-variance models) as base
    classifiers deteriorates performance.


    The base models are learned sequentially in boosting, each iteration aiming at
    reducing the errors by the current model. As an effect, the boosting model becomes
    more and more in contrast to bagging, where increased $B$ occurs slowly and using
    too many base models can result in overfitting; however, it has been observed
    in practice, that overfitting often occurs slowly and the performance tends to
    be rather sensitive to the choice of $B$. Nevertheless, it is a good practice
    to select $B$ in some systematic way, for instance using early stopping during
    training. Another unfortunate aspect of the sequential nature of boosting is that
    it is not possible to parallelize the learning process.


    In the method discussed above we have assumed that each base classifier outputs
    a class prediction, $\hat{y}(x) \in \{-1, 1\}$. However, many classification models
    output $g(x)$, which is an estimate of the class probability $p(y=1|x)$. In AdaBoost
    it is possible to use the predicted probabilities $g(x)$ (instead of the binary
    prediction $\hat{y}(x)$) when constructing the prediction, at the cost of a more
    complicated expression than (7.4). This extension of Method 7.2 is referred to
    as Real AdaBoost.'
