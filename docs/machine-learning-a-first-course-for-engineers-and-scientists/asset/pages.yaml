  md: "# 9.4 Practical aspects of the Gaussian process\n\n# #9.4 Practical aspects\
    \ of the Gaussian process\n\nWhen using the Gaussian process as a method for supervised\
    \ machine learning, there are a few important design choices left to the user.\
    \ Like the methods presented in Chapter 8, the Gaussian process is a kernel method,\
    \ and the choice of kernel is very important. Most kernels contain a few hyperparameters,\
    \ also have to be chosen. That choice can be done by maximizing the marginal likelihood,\
    \ which we will discuss now.\n\n# #Kernel choice\n\nSince the Gaussian process\
    \ can be understood as the Bayesian version of kernel ridge regression, the Gaussian\
    \ process also requires a positive semidefinite kernel. Any of the positive semidefinite\
    \ kernels presented in Section 8.4 can therefore be used for Gaussian processes.\n\
    \nAmong many kernels presented in this book, the Gaussian process could be the\
    \ method where the exact choice of kernel has the biggest impact since the Gaussian\
    \ posterior predictive $f(\\mathbf{x},y)$ has a mean and a variance, of which\
    \ both are heavily affected by the choice of kernel. It is important to make a\
    \ good choice, and the discussion in Section 8.4 can also be instructive to compare\
    \ different kernel choices in Figure 9.1, at least when working with one dimensional\
    \ problems where visualization is possible. For example, as can be seen from Figure\
    \ 9.11 the squared exponential and the Matérn kernel with $\nu=5$ corresponds\
    \ to drastically different assumptions about the smoothness of $f(x)$.\n\nA positive\
    \ semidefinite $\\kappa(\\mathbf{x},\\mathbf{x}')$ remains a positive semidefinite\
    \ kernel when multiplied with a positive constant $c^2$. For the methods in Chapter\
    \ 8 a scaling has no impact on what can be achieved by tuning the regularization\
    \ parameter $\\lambda$. However, for the Gaussian process it is important to also\
    \ choose a constant $c^2$ since it becomes an important factor in the predicted\
    \ variance.\n\nIn the end the kernel, with all its hyperparameters $c^2$ and $\t\
    au^2$, is a design choice left to the machine learning engineer. In the Bayesian\
    \ perspective the kernel is an important part of the prior that implements crucial\
    \ assumptions about the function $f$.\n\n# #Hyperparameter tuning\n\nMost kernels\
    \ $\\kappa(\\mathbf{x},\\mathbf{x}')$ contain a few hyperparameters, such as $\\\
    ell$ and $\\alpha$ and some parameter $\\sigma^2$, in addition to the noise variance\
    \ $\\sigma^2$. Some of the hyperparameters are possible to set manually, for example\
    \ if they have a natural interpretation, but most often hyperparameters are left\
    \ as parameters for the user. We jointly refer to all those hyperparameters that\
    \ need to be chosen as $\\eta$, meaning that $\\eta$ could be used for this purpose.\
    \ Cross-validation but the Bayesian approach also comes to maximize the marginal\
    \ likelihood $p(y)$ as a method for selecting hyperparameters in (9.4). To emphasize\
    \ $\\eta$ enters into the marginal likelihood, we will add the subscript $\\eta$\
    \ to all terms that depends on it. From the construction of the Gaussian process,\
    \ we have $p_\\eta(y)=\\mathcal{N}(y;0,K_\\eta(X,X))$, and consequently\n\n> $ln\
    \ p_{\\eta}(y)=-\\frac{1}{2}\\mathbf{y}^\top K_{\\eta}(X,X)^{-1}\\mathbf{y}-\\\
    frac{1}{2}\\ln \\det(K_{\\eta}(X,X))-\\frac{n}{2}\\log 2.$ (9.27)\n\nIn other\
    \ words, the hyperparameters of the Gaussian process can be chosen by tuning the\
    \ optimization problem of maximizing (9.27) with respect to $\\eta$. If using\
    \ this approach, solving the optimization problem can be seen as a part of learning\
    \ the Gaussian process, which is illustrated in Figure 9.12.\n\nWhen selecting\
    \ hyperparameters $\\eta$ of kernel, it is important to be aware that (9.27) as\
    \ a function of the hyperparameters may have multiple local maxima, as we illustrate\
    \ by Figure 9.13. It is important to carefully choose the initialization of the\
    \ optimization procedure. The challenge with local maxima is not unique to the\
    \ marginal likelihood approach, but can also be addressed through cross-validation\
    \ to used hyperparameters."
