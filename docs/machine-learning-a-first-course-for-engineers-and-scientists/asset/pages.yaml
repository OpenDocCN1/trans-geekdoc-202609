  md: '# 4 Understanding, evaluating and improving the performance


    to reason about supervised learning methods, and the bare notion of $p(x, y)$
    (even it is unknown in practice) will be helpful for that.


    No matter which classification or regression method we consider, once it has been
    learned from training data $T=\{(x_i, y_i)_{i=1}^n\}$, it will return predictions
    $\hat{y}(x)$ for any new input $x$ we feed to it. In this chapter we will emphasize
    $\hat{y}(x)$ to emphasize that the model depends on the training data $T$. Indeed,
    if we would use a different training data to learn the same (type of) model, this
    would typically result in a different model with different predictions.


    In the other chapters we will discuss how a model predicts the output for one,
    or few, tests $x_*$. Let us get to the next level learning (averaging) the error
    function (4.1) over all test data points with respect to $p(x_*, y_*)$. We refer
    to this as the *expected data error*


    ```

    $E_{new} = \mathbb{E}_* [E(\hat{y}(x_*; T), y_*)], \quad (4.2)$

    ```


    ```

    $E_* [E(\hat{y}(x_*; T), y_*)] = \int E(\hat{y}(x_*; T), y)p(x_*, y)dx_* dy. \quad
    (4.3)$

    ```


    Remember that the model (regardless whether it is a linear regression, a classification
    tree, an ensemble of trees, or something else) is learned on a given training
    data $T$ and represented by $\hat{y}(;T)$. What is happening in equation (4.2)
    is an averaging over possible test data points $(x_*, y_*)$. Thus, $E_{new}$ describes
    how the model *generalizes* from the training data $T$ to new situations.


    We also introduce the error


    ```

    $E_{train} = \frac{1}{n} \sum_{i=1}^n E(\\hat{y}(x_i; T), y_i), \quad (4.4)$

    ```


    where $\{x_i, y_i\}_{i=1}^n$ is the training data $T$. $E_{train}$ simply describes
    how the model performs on the specific data on which it was trained, but it carries
    no information on how the model will perform for unseen data points.


    > Time to reflect 4.1: What is $E_{train}$ for k-NN with $k=1$?


    Whereas $E_{train}$ describes how well the model is to “reproduce” the data from
    which it learned, the expected data error $E_{new}$ tells us how well a model
    performs when we put in “production”. For instance, what is the rate of false
    and missed pedestrians that we expect a self-driving car to make? Or, how large
    proportion of all future patients will a medical diagnosis system get?


    > The overall goal in supervised learning is to achieve as small $E_{new}$ as
    possible.


    This sheds some additional light on the claim we made previously, that the loss
    function $L(\hat{y}, y)$ and the error function $E(\hat{y}, y)$ do not have to
    be the same. As we will discuss in this chapter, a model which fits the training
    data well and has a small $E_{train}$ might still have a large $E_{new}$ when
    faced with unseen data. The best strategy to achieve a small $E_{new}$ is not
    necessarily minimize. Beside the fact that the classification (4.1) is unsuitable
    to use optimizing objective (which is discontinuous and has derivative zero almost
    everywhere) it can also be, depending on the method, be that $E_{new}$ can be
    made smaller by a more clever choice of loss function. Examples of this are in
    the case of gradient boosting (Chapter 7) and other vector machines (Chapter 8).


    *Term risk* is used in literature for the expected loss, which is the same as
    the data error $E_{new}$ if the loss function and the error function are to be
    the same. The training error $E_{train}$ is then referred to as “empirical risk”,
    and the minimizing of the cost function as “empirical risk minimization”.'
