- pgno: 94
  md: '# 5.3 Regularization


    Any supervised machine learning method that is trained by minimizing a cost function
    can be regularized as (5.27). There are, however, alternative ways to achieve
    a similar effect without explicitly modifying the cost function. One example of
    implicit regularization is early stopping. Early stopping is applicable to any
    method that is trained using iterative numerical optimization, which is the topic
    of the next section. It may appear counter-intuitively to prematurely abort an
    optimization procedure, before it has reached the minimum of the cost function.
    Although it has proven useful in practice and early stopping has shown to be of
    a practical importance to avoid overfitting for some models, most notably deep
    learning (Chapter 6). Early stopping can be implemented by setting some hold-out
    validation data and computing $E_{hold-out}$ for $t$ after each iteration $t$
    of the numerical optimization$^7$. It is typically observed that $E_{hold-out}$
    decreases until it reaches a value monotonically. The optimization is then aborted
    at the point when $E_{hold-out}$ reached its minimum, as we will illustrate later
    in Example 5.


    Early stopping is a commonly used implicit regularization technique, but not the
    only one. Another technique with a regularizing effect is dropout for neural networks,
    which we discuss in Chapter 6, and data augmentation, which we discuss in Chapter
    11. For decision trees the splitting criteria can be seen as a type of implicit
    regularization. It has also argued that the randomness of the stochastic gradient
    optimization algorithm in itself also has the effect of implicit regularization.'
  merge: -1
