  md: '# 10.1 The Gaussian mixture model and discriminant analysis


    ![](img/9c84a60f9e70ea0bf5c7c51ae709df3e_204_0.png)


    **Figure 10.1:** The GMM is a generative model, and we think about the inputs
    x as random and assume that they have a certain distribution. The GMM assumes
    that p(x|y) has a Gaussian distribution for each y. In this figure x is two-dimensional
    and two classes (red and blue). The left panel shows data with this nature. The
    right panel shows, for each value of y, the contour lines of the Gaussians p(x|y)
    that are learned from the data using (10.3).


    Note, that due to the generative nature of the model, it is based on the joint
    likelihood of both inputs and the outputs. It follows from the model definition
    (10.1) that the log-likelihood is given by


    ```

    $$\ln p(\{x_i, y_i\}_{i=1}^n|\theta) = \sum_{i=1}^n \ln p(x_i|y_i, \theta) + \ln
    p(y_i|\theta)$$

    $$\= \sum_{m=1}^M \sum_{i=1}^{n_m} \ln N(x_i|\mu_m, \Sigma_m) + \ln \pi_m ,$\quad$(10.2b)

    ```


    where the indicator function $I(y_i=m)$ effectively separates the log-likelihood
    into $M$ independent sums, for each class, depending on the class labels of the
    training data points.


    The optimization problem (10.2) turns out to have a closed form solution. Starting
    with the marginal class probabilities $(\pi_m)_{m=1}^M$ we get


    ```

    $$\tilde{\pi}_m = \frac{n_m}{n},$\quad$(10.3a)

    ```


    where $n_m$ is the number of training data points in class m. Consequently, $\sum
    n_m = n$ and $\sum \tilde{\pi}_m = 1$. This simply states that the probability
    of a certain class y=m, without having any additional information, is estimated
    as the probability of this class in the training data.


    Furthermore, the mean vector $\mu_m$ of each class is estimated as


    ```

    $$\tilde{\mu}_m = \frac{1}{n_m} \sum_{i:y_i=m} x_i,$\quad$(10.3b)

    ```


    the empirical mean among all training data points of class m. Similarly, the covariance
    matrix $\Sigma_m$ for each class $m=1,...,M$, is estimated as


    ```

    $$\tilde{\Sigma}_m = \frac{1}{n_m} \sum_{i:y_i=m} (x_i - \tilde{\mu}_m)(x_i -
    \tilde{\mu}_m)^T.,$\quad$(10.3c)

    ```


    The expressions (10.3b)-(10.3c) learn a Gaussian distribution for $\mathbf{x}$
    for each class such that the mean and variance fit the data, so-called moment-matching.
    Now we can compute the parameters $\theta$ no matter the data actually comes from
    a Gaussian distribution or


    > ^3A common alternative is to normalize the estimate by $n_m-1$ instead of $n_m$,
    resulting in an unbiased solution of the covariance matrix, but it is not in the
    maximum likelihood solution. The two options are not mathematically equivalent,
    but for machine learning purposes the practical difference is often minor.


