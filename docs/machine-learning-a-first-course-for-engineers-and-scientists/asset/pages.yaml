  md: '# 4.3 The training error–generalization gap decomposition of $E_{new}$


    optimal trade-off, in terms of $E_{new}$, is often obtained when neither the generalization
    gap nor the training error $E_{train}$ is zero. Thus, by monitoring $E_{train}$
    and estimating $E_{new}$ with cross-validation we also get the following advice:


    +   * $E_{hold-out} \approx E_{train}$ (small generalization gap; possibly underfitting),
    it might be beneficial to increase the model flexibility by loosening the regularization,
    increasing the model order (more parameters to learn), etc.

    * $E_{train}$ is close to zero and $E_{hold-out}$ is not (possibly overfitting),
    it might be beneficial to decrease the model flexibility by tightening the regularization,
    decreasing the order (fewer parameters to learn), etc.


    # Shortcomings of the model complexity scale


    When having only one hyperparameter to choose, the situation sketched in Figure
    4.3 is often a relevant picture. However, when having multiple hyperparameters
    (or even competing methods) to choose, it is important to realize that the one-dimensional
    model complexity scale in Figure 4.3 does not make justice for the space of all
    possible choices. For a given problem, one method can have a smaller generalization
    gap than another method without having a larger training error. Some methods are
    simply better for certain problems. The one-dimensional complexity scale can be
    particularly misleading for intricate deep learning models, but as we illustrate
    in Example 4.2 it is not sufficient for the relatively simple problem of jointly
    choosing the degree of polynomial regression (higher degree means more flexibility)
    and regularization parameter (more regularization means less flexibility).'
