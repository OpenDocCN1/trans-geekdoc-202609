  md: "# Algorithm 5.2: Trust-region Newton's method\n\n```\n**Input:** Objective\
    \ function $J(\\theta)$, initial $\theta^{(0)}$, trust region radius $D$\n**Result:**\
    \ $\theta$\n**1** $t \\leftarrow 0$\n**2** while $|\\theta^{(t)} - \\theta^{(t-1)}|$\
    \ not small enough do\n**3** Compute $v \\leftarrow -[\\nabla^2 J(\\theta^{(t)})]^{-1}\
    \ [\\nabla J(\\theta^{(t)})]$\n**4** Compute $\\eta \\leftarrow \\text{max}(\\\
    |v\\|, D)$\n**5** Update $\\theta^{(t+1)} \\leftarrow \\theta^{(t)} + \\eta v$\n\
    **6** Update $t \\leftarrow t + 1$\n**8** return $\\theta^{(t-1)}$\n```\n\ndifferent\
    \ ways to approximate the inverse of the Hessian matrix $[\\nabla^2 J(\\theta)]^{-1}$\
    \ in (5.35). This class includes, among other, the Broyden method and the BFGS\
    \ method (an abbreviation of Broyden, Fletcher, Goldfar and Shanno). A further\
    \ approximation of the latter, called limited-memory BFGS or L-BFGS, has proven\
    \ to be another good choice for the logistic regression problem.\n\n# Example\
    \ 5.6: Newton's method\n\nWe first apply Newton's method to the cost functions\
    \ from Example 5.3 and show the result in Figure 5.10. Since the convex cost (left)\
    \ function also happens to be close to a quadratic function, the Newton's method\
    \ works well, for both initializations, in only two iterations. For the non-convex\
    \ problem (right), Newton's diverges for both initializations, since the second\
    \ order Taylor expansion (5.33) is a poor approximation of this function and leads\
    \ the method wrong.\n\n![](img/9c84a60f9e70ea0bf5c7c51ae709df3e_102_0.png)\n\n\
    We also apply the trust-region Newton's method to both problems and show the result\
    \ in Figure 5.11. Note that the first step direction is identical to the non-truncated\
    \ version above, but the steps are limited to stay within the trust region (a\
    \ circle of radius 2). This prevents the severe divergence for the non-convex\
    \ case, and all cases converge nicely. Indeed, the convex cost (left) requires\
    \ more iterations than for the non-truncated version, but that is a price we have\
    \ to pay in order to have a robust method which also works for the non-convex\
    \ case to the right."
