    \ methods that can be interpreted as choosing a prior. This connection to regularization\
    \ explains why the Bayesian approach is prone to overfitting.\n\nIt is important\
    \ to note that the connection between the Bayesian approach and the use of regularization\
    \ does not imply that the two approaches are equivalent. The main point with the\
    \ Bayesian approach is still to provide a distribution is constructed for $\\\
    theta$, not of just a point estimate $\\theta$."
