  md: "# 8.3 Support vector regression\n\n![](img/9c84a60f9e70ea0bf5c7c51ae709df3e_162_0.png)\n\
    \nBy studying 8.3, we can see that kernel ridge regression is a very flexible\
    \ model, and the result is highly dependent on the choice of kernel. As we will\
    \ stress throughout this and (the next) chapter, the kernel is indeed a crucial\
    \ choice for the machine learning engine when using kernel methods.\n\n# Kernel\
    \ ridge regression\n\n**Data:** Training data $\\mathcal{T} = \\{\\mathbf{x}_i,\
    \ y_i\\}_{i=1}^n$ and a kernel $\\kappa$\n**Result:** Learned dual parameters\
    \ $\\hat{\\alpha}$\n\n1 Compute $\\hat{\\alpha}$ as (8.14a)\n\n**Predict** with\
    \ kernel ridge regression\n**Data:** Learned dual parameters $\\hat{\\alpha}$\
    \ and test input $\\mathbf{x}_*$\n**Result:** Prediction $\\hat{y}(\\mathbf{x}_*)$\n\
    \n1 Compute $\\hat{y}(\\mathbf{x}_*)$ as (8.14b).\n\n# Method 8.1: Kernel ridge\
    \ regression.\n\n# 8.3 Support vector regression\n\nKernel ridge regression, as\
    \ we just derived, is our first method for regression, which is a useful method\
    \ on its own. We will now extend kernel regression into support vector regression\
    \ by replacing the loss function. First, however, take a step back and make an\
    \ interesting observation that suggests the so-called representer theorem, which\
    \ will be useful later in this.\n\n# Preparing for other kernel methods: the representer\
    \ theorem\n\nThe formulation (8.14) is not only practical for implementation,\
    \ it is also important for theoretical understanding. We can interpret (8.14)\
    \ as a *dual formulation of linear regression*, where we have the *dual parameters\
    \ $\\alpha$ instead of the primal formulation (8.4)* with primal parameters $\t\
    heta$. Remember that $d$, the (possibly infinite) number of primal parameters\
    \ in $\theta$, is a user design choice, whereas $n$, the number of dual parameters\
    \ in $\\alpha$, is the number of data points."
