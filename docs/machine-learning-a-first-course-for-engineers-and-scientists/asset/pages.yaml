  md: "# 8 Nonlinear input transformations and kernels\n\n![](img/9c84a60f9e70ea0bf5c7c51ae709df3e_173_0.png)\n\
    \n**Figure 8.7:** The decision boundaries for support vector classification with\
    \ the linear and squared exponential kernels, the support vectors (for which $\\\
    alpha_i \neq 0$) are marked with yellow. In this multiclass problem, the one-versus-one\
    \ strategy has been used. It is clear from this figure that the support vector\
    \ classification is a linear classifier when using a linear kernel, or otherwise\
    \ a nonlinear classifier.\n\n# Learn support vector classification\n\n**Data:**\
    \ Training data $\\mathcal{T} = \\{\\mathbf{x}_i, y_i\\}_{i=1}^n$\n**Result:**\
    \ Learned parameters $\\vec{\theta}$\n\n+   1 Compute $\\vec{\\alpha}$ by numerically\
    \ solving (8.35a)–(8.35b)\n\n**Predict with support vector classification\n\n\
    **Data:** Learned parameters $\\vec{\theta}$ and test input $\\mathbf{x}_*$\n\
    **Result:** Prediction $\\hat{y}(\\mathbf{x}_*)$\n\n+   1 Compute $\\hat{y}(\\\
    mathbf{x}_*)$ as (8.35c).\n\n# Method 8.3: Support vector classification.\n\n\
    In the SVM literature it is common to use an equivalent formula with $C = \\frac{1}{2gamma}$\
    \ or $C = \\frac{1}{2nl}$ as regularization hyperparameter. There also exists\
    \ a slightly different formulation using another hyperparameter $v$ as effectively,\
    \ as a regularization hyperparameter. These primal and dual problems become more\
    \ involved, and we do not include them here, but $v$ has somewhat more natural\
    \ interpretation as it bounds the number of support vectors. To distinguish between\
    \ the different versions, (8.35) is commonly referred to as C-support vector and\
    \ the other as $v$-support vector classification. A correspondence ‘v-SVR’ also\
    \ exists for support vector regression.\n\nAs a consequence of the hinge loss,\
    \ as discussed in Chapter 5, support vector classification does not provide probability\
    \ estimates $(\\mathbf{x})$ but only a ‘hard’ classification $\\hat{y}(\\mathbf{x}_*)$.\
    \ For support vector classification $\\hat{\\alpha}(\\mathbf{X}, \\mathbf{y})$,\
    \ is not possible to interpret it as a class probability estimate, as an alternative\
    \ is to use the squared loss or hinge function which allows for a probability\
    \ interpretation of the margin. Since all these functions are exactly zero for\
    \ margins $\\ge 1$, they retain the support vector property with a sparse $\\\
    alpha$. By using a different function than the hinge loss we obtain a different\
    \ optimization problem and a different solution to the one described above.\n\n\
    The support vector classifier is most formed as a solution to the binary classification\
    \ problem. The generalization to the multiclass problem is unfortunately not straightforward,\
    \ as it requires a multiclass generalization of the loss function, as discussed\
    \ in Chapter 5. In practice it is possible to construct a multiclass classifier\
    \ from binary ones using either the one-versus-one or the one-versus-rest strategy-see\
    \ page 87). The latter is used when we apply it to the music classification"
