    model of $p(x|y=m)$, parameterized by $\hat{\mu}_m$ and $\hat{\sigma}_m$ (since
    $p=1$, we will only have a scalar variance $\sigma_m^2$, instead of a covariance
    matrix $\Sigma_m$). To the right of $p(y)$ is is, parameterized by $\hat{\pi}_m$.
