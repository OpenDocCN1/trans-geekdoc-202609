    \ the notation $X$ from (3.5) and that an $n$-dimensional Gaussian random vector\
    \ with a diagonal covariance matrix is equal to $n$ scalar random variables. In\
    \ the Bayesian approach there is also a need for a prior $p(\\theta)$ for the\
    \ unknown parameters $\theta$. In Bayesian linear regression the prior is often\
    \ chosen as a Gaussian with mean $\\mu_0$ and covariance $\\Sigma_0$.\n\n```\n\
    $p(\\theta) = N(\\theta; \\mu_0, \\Sigma_0).$$\n```\n\nwith, for example, $\\\
