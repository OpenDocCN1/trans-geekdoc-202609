    \ N(0, \\sigma^2).$$\n```\n\nwhich equivalently can be written as\n\n```\n$p(y|\\\
    theta) = N(y|\\theta^T x, \\sigma^2).$$\n```\n\nThis is an expression for one\
    \ data point $y$, and for the vector of all data outputs $y$ we can write\n\n\
    ```\n$p(y|\\theta) = \\prod_{i=1}^n p(y_i|\\theta, x_i, \\sigma^2) = \\prod_{i=1}^n\
