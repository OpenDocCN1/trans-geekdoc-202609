  md: "# 8 Nonlinear input transformations and kernels\n\nThe push-through matrix\
    \ identity senses that $A(A^\top+I)^{-1} = (AA^\top+I)^{-1}A$ holds for any matrix\
    \ $A$. By using it in (8.6), we can rewrite $\\widetilde{Y}(\\mathbf{x}_*)$\n\n\
    ```\n$\\widetilde{Y}(\\mathbf{x}_*) = \\frac{\\mathbf{y}^\top\\Phi(\\mathbf{x})}{n}\
    \ (\\Phi(\\mathbf{x})^\top\\Phi(\\mathbf{x}) + n\\mathbf{I})^{-1}\\Phi(\\mathbf{x})^\t\
    op\\phi(\\mathbf{x}_*) \\quad (8.7)$\n```\n\nIt appears in (8.7) as if we compute\
    \ $\\phi(\\mathbf{x}_*)$ without having to deal with any $d$-dimensional vectors\
    \ or matrices, or if the matrix multiplication $\\Phi(\\mathbf{x})\\Phi(\\mathbf{x})^\t\
    op$ and $\\Phi(\\mathbf{x})^\top\\phi(\\mathbf{x})$ in (8.7) can be computed.\
    \ Let us have a closer look at this:\n\n```\n$$\\Phi(\\mathbf{x})Phi(\\mathbf{x})^\t\
    op = \\begin{bmatrix} \\phi(x_1)^\top\\phi(x_1) & \\phi(x_1)^\top\\phi(x_2) &\
    \ \\dots \\ \\phi(x_2)^\top\\phi(x_1) & \\phi(x_2)^\top\\phi(x_2) & \\dots \\\
    \ \\vdots & \\vdots & \\vdots \\ \\phi(x_n)^\top\\phi(x_1) & \\phi(x_n)^\top\\\
    phi(x_2) & \\dots \\end{bmatrix} \\quad \\text{and} \\quad \\begin{bmatrix} \\\
    phi(x_1)^\top\\phi(x_n) \\ \\phi(x_2)^\top\\phi(x_n) \\ \\vdots \\ \\phi(x_n)^\t\
    op\\phi(x_n) \\end{bmatrix} \\end{ \\end{matrix} \\quad (8.8)$\n```\n\nRemember\
    \ that $\\phi(\\mathbf{x})^\top\\phi(\\mathbf{x}')$ is an inner product between\
    \ the $d$-dimensional vectors $\\phi(\\mathbf{x})$ and $\\phi(\\mathbf{x}')$.\
    \ The key insight is to note that the transformed inputs $\\phi(\\mathbf{x})$\
    \ enter into (8.7) only as inner products $\\phi(\\mathbf{x})^\top\\phi(\\mathbf{x}')$,\
    \ where each inner product is scalar. That is, if we are able to compute the inner\
    \ product $\\phi(\\mathbf{x})^\top\\phi(\\mathbf{x}')$ directly, without first\
    \ computing the $d$-dimensional $\\phi(\\mathbf{x})$, we have reached our goal.\n\
    \nAs a concrete illustration, let us simplify consider polynomials. With $p=1$,\
    \ meaning $x$ is a scalar, and $x$ is a polynomial of order $(d=4)$ with the second\
    \ and third term scaled by $\\sqrt{3}$, we have\n\n```\n$$\\phi(\\mathbf{x})^\t\
    op\\phi(\\mathbf{x}') = [ \\begin{bmatrix} 1 & \\sqrt{3}x & \\sqrt{3}x^2 & \\\
    sqrt{3}x^3 \\end{bmatrix}^\\top \\begin{bmatrix} 1 \\ \\sqrt{3}x' \\ \\sqrt{3}(x')^2\
    \ \\ \\sqrt{3}(x')^3 \\end{bmatrix} = 1 + 3xx' + 3x^2(x')^2 + x^3(x')^3 = (1+xx')^3\
    \ ] \\quad (8.10)$\n```\n\nIt can be shown that if $\\phi(\\mathbf{x})$ is (a\
    \ re-scaled) polynomial of order $d-1$, then $\\phi(\\mathbf{x})^\top\\phi(\\\
    mathbf{x}') = (1+xx')^d$. The point we make is that instead of first computing\
    \ the $d$-dimensional vectors $\\phi(\\mathbf{x})$ and $\\phi(\\mathbf{x}')$ and\
    \ thereafter computing their inner product, we could evaluate the expression $(1+xx')^d$\
    \ directly. With a second or third order polynomial this might not make much of\
    \ a difference, but the computational saving in a situation where it is of interest\
    \ to use $d$ in the hundreds or thousands.\n\nThe main point we are saying is\
    \ that if we make the choice of $\\phi(\\mathbf{x})$ such that the inner product\
    \ $\\phi(\\mathbf{x})^\top\\phi(\\mathbf{x}')$ can be computed without computing\
    \ $\\phi(\\mathbf{x})$, we let be possible to define inner products between infinite-dimensional\
    \ vectors, there is nothing preventing us from learning.\n\nThe scaling $\\sqrt{3}$\
    \ can be compensated with an inverse scaling of the second and third element in\
    \ $\theta$.\n\n> Draft (April 30, 2021) of Machine Learning — A First Course for\
    \ Engineers and Scientists. http://mlbook.org\n\n> Andreas Lindholm, Niklas Wahliford,\
    \ Fredrik Lindstein, and Thomas B. Schön. 2021."
