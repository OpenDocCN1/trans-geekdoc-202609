    k-NN with $k=2$ suffers from overfitting for this problem, whereas $k=70$ is a
    case of underfitting.


    We have so far concerned about the relationship between the generalization gap
    and the model complexity. Another very important aspect is the size of the training
    dataset, $n$. We can in general expect that the more training data, the smaller
    the generalization gap. On the other hand, $\hat{E}_{train}$ typically increases
    as n increases, since most models are unable to fit all training data points if
    there are too many of them. A typical behavior of $\hat{E}_{train}$ and $\hat{E}_{new}$
    is sketched in Figure 4.6.


    ![](img/9c84a60f9e70ea0bf5c7c51ae709df3e_65_0.png)


    **Figure 4.6:** Typical relationship between $\hat{E}_{new}$, $\hat{E}_{train}$
    and the number of data points $n$ in the training dataset for a simple model (low
    model flexibility, left) and a complex model (high model flexibility, right).
    The generalization gap (difference between $\hat{E}_{new}$ and $\hat{E}_{train}$)
    decreases, the same time as $n$ increases. Typically, a more complex model (right
    panel) will reach for a smaller error than a simpler model (left panel) would
    on the same problem (the figures should be thought of as having the same scales
    on the axes). However, the generalization gap is typically larger for a more complex
    model, in when the training dataset is small.


    # **Reducing $E_{new}$ in practice**


    Our goal is to achieve a small error “in production”, that is, a small $E_{new}$.
    To achieve that, according to the decomposition $E_{new} = \hat{E}_{train} + generalization
    gap$, we need to have $\hat{E}_{train}$ as well as the generalization gap small.
    Let us draw some conclusions from what we have seen so far.


    +   - The new error $E_{new}$ will not on average be smaller than the training
    error $\hat E_{train}$. Thus, if $\hat{E}_{train}$ is much bigger than $E_{new}$
    you need for your model to be successful at the application hand, you do not need
    to waste time implementing cross-validation for estimating $E_{new}$. Instead,
    you should re-think the problem and method you are using.

    - The generalization gap and $E_{new}$ typically decreases as $n$ increases. Thus,
    if possible, the size of the training data may help a lot with reducing $E_{new}$.


    Making the model more flexible decreases $\hat E_{train}$, but often increases
    the generalization gap. Making the model less flexible, on the other hand, typically
    decreases the generalization gap but increases $\hat{E}_{train}$.'
