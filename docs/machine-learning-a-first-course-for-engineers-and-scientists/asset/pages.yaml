  md: '# #6 Neural networks and deep learning


    In Chapter 3 we introduced linear regression and logistic regression as the two
    parametric models for solving the regression and classification problems. A neural
    network extends this by stacking multiple of these models to construct a hierarchical
    model that can describe more complicated relationships between inputs and outputs
    than the linear or logistic regression models can do. Deep learning is a subfield
    of machine learning that deals with deep neural networks.


    We will start in Section 6.1 by generalizing linear regression to a two-layer
    neural network (that is, a neural network with one hidden layer), and then generalize
    it further to a deep neural network. In Section 6.3 we present a special neural
    network tailored for images and in Section 6.2 we look into some details on how
    to train neural networks. Finally, in Section 6.4, we provide one technique for
    how to regulate neural networks.


    # ## 6.1 The neural network model


    In Section 5.1 we introduced concept of nonlinear parametric functions for modeling
    the relationship between the input variables $x_1, \dots, x_p$ and the output
    $y$. We denote this nonlinear relationship on its prediction format as


    ```

    $$\widehat{y} = f(x_1, \dots, x_p), \quad (6.1)$

    ```


    where the function $f$ is parametrized by $\theta$. Such a nonlinear function
    can be parametrized in many ways. In a neural network, the strategy is to use
    layers of linear regression models and nonlinear activation functions. We will
    explain clearly how these are made step by step.


    # ### Generalized linear regression


    We start the description of the neural network model with the linear regression
    model


    ```

    $$\widehat{y} = W_1x_1 + W_2x_2 + \dots + W_px_p + b, \quad (6.2)$

    ```


    Here we denote the parameters with weights $W_1, \dots, W_p$ and the offset term
    $b$. We choose to use this notation instead of used in (3.2) we will later handle
    the weights slightly different from the offset term. Each input variable $x_i$
    is represented with a node and each character $W_j$ with a link. Furthermore,
    the output $\widehat{y}$ is described as the sum of all $W_{ij}x_j$. Note that
    we use the constant value 1 as the input variable corresponding to the intercept
    term.


    To describe nonlinear activation functions between $x = [x_1, x_2, \dots, x_p]^T$
    we introduce a nonlinear scalar activation function $h : \mathbb{R} \to \mathbb{R}$.
    The regression model (6.2) is now modified into a generalized linear regression
    (see Section 3.4) where the linear combination of the inputs is transformed by
    the activation function


    ```

    $$\widehat{y} = h(W_1x_1 + W_2x_2 + \dots + W_px_p + b). \quad (6.3)$

    ```


    This extension to the generalized linear regression model is visualized in Figure
    6.1.


    Common for activation function is the logistic function and the rectified linear
    unit (ReLU).


    ```

    Logistic: $h(z) = \frac{1}{1+e^{-z}}}, \quad ReLU: h(z) = \max(0, z)$

    ```'
