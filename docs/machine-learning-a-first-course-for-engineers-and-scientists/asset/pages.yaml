  md: "# 5 Learning parametric models\n\nWe can extend this idea of subsampling with\
    \ even fewer data points used in each gradient computation. The extreme version\
    \ of subsampling would be to use only a single data point when we compute the\
    \ gradient. In practice it is most common to call a small subsample of data a\
    \ mini-batch, which can typically contain $n_b=10, n_b=100$ or $n_b=1000$ points.\
    \ One pass through the training data is called an epoch, and consequently of $n/n_b$\
    \ iterations.\n\nWhen using mini-batches it is important to ensure that the mini-batches\
    \ are balanced and representative for the whole dataset. If we have a big training\
    \ dataset with a different output classes and the dataset is sorted with the output,\
    \ the mini-batch with first $n_b$ data points would only include one class and\
    \ not give a good approximation of the gradient for the full dataset. For this,\
    \ the mini-batches should be forced randomly. One implementation of this is to\
    \ first shuffle the training data, and thereafter dividing it into mini-batches\
    \ in order and no pass through the training data. We summarize descent with mini-batches,\
    \ often called *stochastic gradient descent*, by Algorithm 5.3.\n\nStochastic\
    \ gradient descent (\textit{SGD}) is widely used in machine learning, and there\
    \ are many extensions tailored for different methods. For deep neural networks\
    \ (Chapter 6), some commonly used methods include automatic adaptation of the\
    \ learning rate and an idea called momentum and constant to counteract the randomness\
    \ caused by subsampling. The AddGrad (short for adaptive gradient), RMSProp (short\
    \ for root mean square propagation) and Adam (adaptive moments methods) are such\
    \ examples. For logistic regression in the \"big data\" using the stochastic average\
    \ gradient (SAG) method, which agrees over all previous gradients has proven useful,\
    \ to only mention a few\n\n```\nAlgorithm 5.3: Stochastic gradient descent\n**Input:**\
    \ Objective function $J(\theta)=\\frac{1}{n}\\sum_{i=1}^{n} L(\\mathbf{x}_i, y_i,\
    \ \theta)$, $\theta^{(0)}$, learning rate $\\gamma^{(t)}$\n**Result:** $\\hat{\t\
    heta}$\n1 **Set** $t \\leftarrow 0$\n2 **while** convergence criteria are not\
    \ met\n3 **for** $i=1, 2, \\dots, E$ **do**\n4   Randomly shuffle the training\
    \ data $(\\mathbf{x}_i, y_i)_{i=1}^n$\n5 **for** $j=1, 2, \\dots, n_b$ **do**\n\
    6   Approximate the gradient using the mini-batch $(\\mathbf{x}_i, y_i)_{i=(j-1)n_b+1}^{jn_b}$\n\
    7   $\\hat{\theta}^{(t)} = \\frac{1}{n_b}\\sum_{i=(j-1)n_b+1}^{jn_b} \\nabla_{\t\
    heta} L(\\mathbf{x}_i, y_i, \theta)$\n8   **Update** $\theta \\leftarrow \theta\
    \ - \\gamma^{(t)}\\hat{\theta}^{(t)}$\n9 **end**\n10 **Update** $t \\leftarrow\
    \ t+1\n11 **end**\n12 **return** $\theta^{(t-1)}$\n```\n\n# Learning rate and\
    \ convergence for stochastic gradient descent\n\nStandard gradient descent converges\
    \ if the learning rate is wisely chosen, since the gradient itself is zero at\
    \ the minimum (or any other stationary point). For stochastic gradient descent,\
    \ on the other hand, we can *obtain* convergence with a constant learning rate.\
    \ The reason is that we only use an *estimate* of the true gradient, and this\
    \ estimate will not necessarily be at the minimum of the objective function, but\
    \ there might be a considerable amount of \"noise\" in the gradient estimate due\
    \ to the subsampling. As a consequence, the stochastic gradient descent algorithm\
    \ with a constant learning rate will not converge towards a point, but to \"wander\
    \ around\" forever.\n\nDraft (April 30, 2021) of Machine Learning — A First Course\
    \ for Engineers and Scientists. http://mmlbook.org\n Andreas Linholm, Nils Wahlström,\
    \ Fredrik Lindsten, and Thomas B. 2021."
  merge: -1
  img_proc: true
- pgno: 106
  md: "# 5.5 Optimization with large datasets\n\nalgorithm to work properly we also\
    \ need the gradient estimate to be unbiased. The intuitive reason is that the\
    \ unbiased gradient ensures that the algorithm will unwind every step in its direction\
    \ for the optimum.\n\nBy not using a constant learning rate, but instead decrease\
    \ it gradually towards zero, the parameter updates will be smaller and smaller,\
    \ and eventually converge. We start at t = 0 with a fairly high learning rate\
    \ $\\gamma^{(t)}$ (meaning that we take big steps) and then decay $\\gamma^{(t)}$\
    \ as $t$ increases. Under regularity conditions of the cost function and with\
    \ a learning rate following the Robbins-Monro conditions $\\sum_{t=1}^{\\infty}\
    \ \\gamma^{(t)} = \\infty$ and $\\sum_{t=1}^{\\infty} (\\gamma^{(t)})^2 < \\infty$,\
    \ the stochastic gradient descent can be converged to nearly a local minimum.\
    \ The Robbins-Monro conditions are for example, fulfilled if using $\\gamma^{(t)}\
    \ = a/t^\\alpha$. For many machine learning problems, however, it has been found\
    \ that performance is obtained in practice by not letting $\\gamma^{(t)} \\to\
    \ 0$, but to cut at some small value $\\gamma_{\\min} > 0$. This will cause stochastic\
    \ gradient descent not to easily converge, and the Robbins-Monro conditions will\
    \ not be fulfilled, but the algorithm will walk around indefinitely (until the\
    \ algorithm is aborted by the user). For practical purposes this seemingly property\
    \ usually does not cause any issue if $\\gamma_{\\min}$ is only small enough,\
    \ and enough for setting the learning rate in practice is\n\n```\n$$\\gamma^{(t)}\
    \ = \\gamma_{\\min} + (\\gamma_{\\max} - \\gamma_{\\min})e^{-t}$\n```\n\nThe learning\
    \ rate $\\gamma^{(t)}$ starts at $\\gamma_{\\max}$ and goes to $\\gamma_{\\min}$\
    \ as $t \\to \\infty$. How to pick the parameters $\\gamma_{\\min}$ and $\\gamma_{\\\
    max}$. As a rule of thumb can be chosen as 1% of $\\gamma_{\\max}$. The parameter\
    \ $\tau$ depends on the dataset and the complexity of the problem, but could be\
    \ chosen such that many epochs have passed before we reach $\\gamma_{\\min}$.\
    \ The strategy to pick $\\gamma_{\\max}$ can be done by monitoring the cost function\
    \ as for standard gradient descent in Figure 5.7.\n\n# Example 5.8: Stochastic\
    \ gradient descent\n\nWe apply the stochastic gradient descent method to the objective\
    \ functions from Example 5.3. For the convex function in Figure 5.14, the choice\
    \ of learning rate is not crucial. However, that the algorithm does not converge\
    \ nicely as in, for example, gradient descent, due to the \"noise\" in the gradient\
    \ estimate caused by the subsampling. This is the price we pay for the substantial\
    \ computational savings offered by the subsampling.\n\n![](img/9c84a60f9e70ea0bf5c7c51ae709df3e_106_0.png)\n\
    \nFig. 5.14\n\nFor the objective function with multiple local minima, we apply\
    \ stochastic gradient descent with two decaying learning rates, but with different\
    \ initial^{(0)}$. With a smaller learning rate, left, stochastic gradient converges\
    \ to the closest minimum, whereas a larger rate causes it to take larger steps\
    \ and does not necessarily converge to the closest minimum (right).\n\nThis material\
    \ will be published by Cambridge University Press. This pre-publication version\
    \ is free to view and for personal use only. Not for re-distribution, re-sale\
    \ or use in derivative works.\n\nAndreas Lindholm, Nikolai Wahlshöm, Fredrik Lindquist,\
    \ and Thomas B. Schön\n\n107"
