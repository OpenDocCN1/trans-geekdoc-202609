  md: '# 5.7 Further reading


    1000, but that is of course only example. One could induce some manual work by
    first selecting a coarse grid to get an initial guess, and thereafter refine the
    grid only around the promising candidates. In practice, the problem has more than
    one dimension, and could also be beneficial to select the grid points randomly
    instead of using an equally spaced linear or logarithmic grid.


    The manual procedure of choosing a grid method, however, become quite tedious,
    and one could wish for an automated method. That is, in fact, possible by treating
    the grid point selection as a machine learning problem. If we consider the method
    in which we use a regression method to learn a model for the objective function
    then that model can, in turn, be used to answer questions on where to evaluate
    the objective function, andby selecting the next grid point. A concrete method
    built from this is the Gaussian process optimization method, which uses Gaussian
    processes (Chapter 9) for learning a model of the objective function.


    # 5.7 Further reading


    A mathematically more thorough discussion on loss functions is provided by Gneiting
    and Raftery (2007). Some of the asymptotic properties, also referred to as population
    minimizers, are derived by Hastie et al. (2009, Section 10.5-10.6).


    A standard reference for optimization, covering much more than this chapter, is
    the book by Nocedal and Wright (1991), and two overviews of its modern use in
    machine learning are given by Botton et al. (2018) and Rudicker (2017). For Gaussian
    process optimization, see Frazier (2018) and Snell et al. (2012). $L^2$ regularization
    was introduced independently in statistics by Hoer and Kendall (1970) and earlier
    in numerical analysis by Andrey Nikolevich Tikonov. The $L^2$ regularization was
    first introduced by Tibshirani (1996). Early stopping has been used as a regularizer
    for long time in the neural network practice and has been analyzed by Bishop (1995)
    and Sjoberg and Ljung (1995). For the regularizing effect of stochastic gradient
    descent, see Hardt et al. (2016) and Mandi et al. (2017). A list has been written
    about adaptive methods and many different algorithms are available. The ADAGRAD
    algorithm was introduced by Duchi et al. (2011) and ADAM was derived by D. P.
    Kingma and Ba (2015). Interesting insights about these algorithms are offered
    by Reddi et al. (2018).'
