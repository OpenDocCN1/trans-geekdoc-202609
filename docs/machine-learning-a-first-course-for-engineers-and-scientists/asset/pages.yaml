    softmax(z) \triangleq \frac{\begin{bmatrix} e^{z_1} \ e^{z_2} \ \vdots \ e^{z_M}
    \end{bmatrix}}{\sum_{j=1}^M e^{z_j}}. \quad (6.15)

    ```


