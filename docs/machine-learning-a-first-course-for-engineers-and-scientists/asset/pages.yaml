  md: "# 9 The Bayesian approach and Gaussian processes\n\nThe expected value of $z$\
    \ is $E[z] = \\mu$ and the variance of $z_1$ is $var(z_1) = E[(z_1 - E[z_1])^2]\
    \ = \\sigma_1^2$, and similarly for $z_2, \\dots, z_q$. Moreover the covariance\
    \ between $z_1$ and $z_2$ is $cov(z_1, z_2) = E[(z_1 - E[z_1])(z_2 - E[z_2])]\
    \ = \\sigma_{12} = \\sigma_{21}$, and similarly for any other pair of $z_i, z_j$.\
    \ All these properties can be derived from the probability density function of\
    \ the multivariate Gaussian distribution, which\n\n```\n$N(z; \\mu, \\Sigma) =\
    \ (2\\pi)^{-d/2} \\det(\\Sigma)^{-1/2} \\exp(-\\frac{1}{2}(z-\\mu)^T\\Sigma^{-1}(z-\\\
    mu)).$$\n```\n\nIf all off-diagonal elements of $\\Sigma$ are zero, the elements\
    \ of $z$ are just independent Gaussian random variables. However, if some off-diagonal\
    \ element, say $\\sigma_{ij}$ ($i \\neq j$), is nonzero then there is a correlation\
    \ between $z_i$ and $z_j$. The correlation means that $z_i$ carries information\
    \ also about $z_j$, and vice versa. Some important results on the multivariate\
    \ Gaussian distribution can be manipulated in Appendix 9A.\n\n# Linear regression\
    \ with the Bayesian approach\n\nWe will now use the Bayesian approach to the linear\
