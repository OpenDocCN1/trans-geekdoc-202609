- pgno: 11
  md: '# #1 Introduction


    ![](img/9c84a60f9e70ea0bf5c7c51ae709df3e_11_0.png)


    **Fig. 1.3** knowing the player''s position is not enough to definitively say
    that the shot will be successful. Still, it is reasonable to assume that it provides
    some information about the chance of making a goal. Indeed, a shot close to the
    goal line with a large angle is intuitively more likely to result in a goal than
    one made from a position close to the sideline. To acknowledge this when constructing
    a machine learning model, we will not ask the model to predict the outcome of
    the shot, but rather to predict the probability of a goal. This is accomplished
    by using a probabilistic model which is trained by maximizing the total probability
    of the observed training data with respect to the probabilistic predictions. For
    instance, using a so-called logistic regression model we obtain a predicted probability
    of scoring a goal form any position, illustrated using a heat map in the right
    panel in Figure 1.3.


    The supervised learning methods are categorized as either classification or regression
    problems, depending on the type of output. These problem are the most common and
    typical instances of supervised learning, which will constitute the foundation
    for most methods discussed in this book. However, machine learning is in fact
    more general and can be used to build complex predictive models that do not naturally
    fit into either the classification or the regression category. To whet the appetite
    for further exploration of the field of machine learning, we provide two examples
    below. These examples go beyond the specific problem formulations we explore in
    this book, but they nevertheless follow the same core methodology.


    In the first of these examples we illustrate a computer vision capacity, how to
    classify each individual pixel of an image into a class describing the object
    it belongs to. This has important applications in autonomous driving and medical
    imaging. When to the earlier examples this introduces an additional level of complexity,
    that the model needs to be able to handle spatial dependencies across the image
    in its classifications.


    # Example 1.4: Pixel-wise class prediction


    When it comes to machine learning an important vision capacity is able to associate
    each pixel in an image with a corresponding class, see Figure 1.4 for an illustration
    in an autonomous driving application. This is referred to as semantic segmentation.
    In autonomous driving it is to separate cars, pedestrians, etc. the output is
    then used as input to other algorithms, for collision avoidance. When it comes
    to medical imaging, semantic segmentation is used, for instance, to tell apart
    organs and tumors.


