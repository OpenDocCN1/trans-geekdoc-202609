    mathbf{X}^\top\\mathbf{y}+2\\mathbf{X}^\top\\mathbf{X}\\theta$, (3.53)\n\nSince\
    \ $V(\\theta)$ is a positive quadratic form, it must be attained at $\\theta_0$\
    \ where $V(\\theta_0)=0$, which characterizes the solution $\\theta_0$ as\n\n\
    $$\\nabla V(\\\theta) = 0 \\Rightarrow -2\\mathbf{X}^\top\\mathbf{y}+2\\mathbf{X}^\t\
    op\\mathbf{X}\\theta=0 \\Rightarrow\\mathbf{X}^\top\\mathbf{X}\\theta=\\mathbf{X}^\t\
    op\\mathbf{y}$, (3.54)\n\nwhich is the normal equations.\n\n# A linear algebra\
    \ approach\n\nDenote the $p+1$ columns of $\\mathbf{X}$ as $\\mathbf{c}_j, j=1,...,p+1$.\
    \ We first show that $||\\mathbf{X}\\theta-\\mathbf{y}||_2$ is minimized by $\\\
    theta$ such that $\\mathbf{X}\\theta$ is the orthogonal projection of $\\mathbf{y}$\
    \ onto the (sub)space spanned by the columns $\\mathbf{c}_j$ of $\\mathbf{X}$,\
    \ and then show that the orthogonal projection is found by the normal equations.\n\
    \nLet us decompose $\\mathbf{y}$ as $\\mathbf{y}_|+\\mathbf{y}_\\perp$, where\
    \ $\\mathbf{y}_\\perp$ is orthogonal to the (sub)space spanned by all columns\
    \ $\\mathbf{c}_j$, and $\\mathbf{y}_||$ is in the (sub)space spanned by all columns\
    \ $\\mathbf{c}_j$. Since $\\mathbf{y}_\\perp$ is orthogonal to both $\\mathbf{y}$\
    \ and $\\mathbf{X}\\theta$, it follows that\n\n$||\\mathbf{X}\\theta-\\mathbf{y}||_2\
    \ = ||\\mathbf{X}\\theta-\\mathbf{y}_|||_2 = ||(\\mathbf{X}\\theta-\\mathbf{y}_|)||_2\
    \ \\ge ||\\mathbf{y}_\\perp||_2$. (3.55)\n\nand the triangle inequality allows\
    \ us\n\n$||\\mathbf{X}\\theta-\\mathbf{y}||_2 = ||\\mathbf{X}\\theta-\\mathbf{y}_|||_2\
    \ \\le ||\\mathbf{y}_||_2+||\\mathbf{X}\\theta-\\mathbf{y}_|||_2$. (3.56)\n\n\
    This implies that if we choose $\\theta$ such that $\\mathbf{X}\\theta=\\mathbf{y}_||$,\
    \ the criterion $||\\mathbf{X}\\theta-\\mathbf{y}||_2$ must have reached its minimum.\
    \ Our, solution $\\theta$ must be orthogonal to the (sub)space spanned by all\
    \ columns $\\mathbf{c}_i$, meaning\n\n$(\\mathbf{X}^\top\\mathbf{\theta})^\top\\\
    mathbf{c}_j=0, j=1,...,p+1$ (3.57)\n\n(remember that two vectors $\\mathbf{u},\\\
    mathbf{v}$ are defined, orthogonal if their scalar product, $\\mathbf{u}^\top\\\
    mathbf{v}$, is 0). Since the columns $\\mathbf{c}_j$ form the matrix $\\mathbf{X}$,\
    \ we can write this compactly\n\n$(\\mathbf{X}^\top\\mathbf{\theta})^\top\\mathbf{X}=0$,\
    \ (3.58)\n\nwhere the right hand side is the $p+1$-dimensional vector zero. This\
    \ equivalently be written as\n\n$$\\mathbf{X}^\top\\mathbf{\theta}=\\mathbf{X}^\t\
    op\\mathbf{y}$,\n\nwhich is the normal equations."
