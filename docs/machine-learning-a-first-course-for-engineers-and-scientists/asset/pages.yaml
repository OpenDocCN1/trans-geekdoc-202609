  md: '# 4 Understanding, evaluating and improving the performance


    Example 4.3: The bias–variance tradeoff for $L^2$ regularized linear regression


    Let us consider a simulated regression example. We let $p(x,y)$ follow from $x
    \sim \mathcal{U}[0,1]$


    ```

    $y = 5 - 2x + \varepsilon, \quad \varepsilon \sim N(0,1), \quad (4.20)

    ```


    We let the training data of size $n = 10$ data points. We now try to model the
    data using linear regression with a 4th order polynomial


    ```

    $y = \beta_0 + \beta_1x + \beta_2x^2 + \beta_3x^3 + \beta_4x^4 + \varepsilon.
    \quad (4.21)

    ```


    Since (4.20) is a case of (4.21) and the error corresponds to Gaussian noise,
    we have zero bias for this model if we train it using squared error loss. However,
    learning 5 parameters from only 10 data points leads to very high variance, which
    is why trade the model with squared error loss and $L^2$ regularization, which
    will decrease the variance (but increase the bias). The more regularization (bigger
    $\lambda$), the less bias and variance.


    Since in this example we can run the experiment multiple times and estimate the
    bias and variance terms (since we can simulate as training and test data as needed).
    We plot them in Figure 4.10 using the same style as Figures 4.3 and 4.8 (note
    the reversed x-axis: $\lambda$ corresponds to a higher complexity). For this problem
    the optimal value of $\lambda$ would have been about 0.7 since $\E_{new}$ attains
    its minimum. Finding this $\lambda$ is a typical estimate of the bias-variance
    tradeoff.


    ![](img/9c84a60f9e70ea0bf5c7c51ae709df3e_71_0.png)


    Fig. 4.10


    Regularization parameter


    # Connections between bias, variance and the generalization gap


    The bias and variance are well defined properties, but often intangible in practice
    since they are defined in terms of $\mathbf{p}(x,y)$. In practice, we mostly have
    an estimate of the generalization gap (for example as $\E_{hold-out}-\E_{train}$),
    whereas the bias and variance requires additional tools for being estimated$^5$.
    It is therefore interesting to explore what $\E_{train}$ the generalization gap
    says about the bias and variance.


    Consider the regression problem. As the squared error is used both as error function
    and function that gleams during training. We can then write


    ```

    $$\sigma^2 + \beta^2 = \mathbb{E}_* [(f(\mathbf{x}^*) - \mathbf{y}^*)^2] = \frac{1}{n}
    \sum_{i=1}^n (f(\mathbf{x}_i) - \mathbf{y}_i)^2 = \frac{1}{n} \sum_{i=1}^n (\hat{f}(\mathbf{x}_i;\mathcal{T})
    - \mathbf{y}_i)^2 = \mathbb{E}_{train}. \quad (4.22)

    ```


    $5The bias and variance can 나서, to be estimated using the bootstrap, as we will
    introduce in Chapter 7.


