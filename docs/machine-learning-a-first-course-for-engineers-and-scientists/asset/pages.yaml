  md: "# Learning parametric models\n\nmodel based on accuracy (equivalently, misclassification\
    \ error). If we were to train the model by minimizing the misclassification loss\
    \ we would only care about placing decision boundaries to get many data points\
    \ on the right side, but without taking the distances to the decision boundaries\
    \ into account. However, with the noise in the data having some margin to the\
    \ decision boundary can result in better generalization, and there are losses\
    \ that explicitly encourage this. We can also choose the loss function with aim\
    \ of making the optimization problem (5.4) easier to solve for instance by using\
    \ convex loss function (see Section 5.4). Third, certain losses can encourage\
    \ other favorable properties of the final model, such as making the model less\
    \ computationally demanding to use “in production”.\n\n**Early stopping.** When\
    \ optimizing the (5.4) using an iterative numerical method, this can be thought\
    \ of as generating a sequence of candidate models. At each iteration of the optimization\
    \ algorithm we have the current state of the parameter vector and thus obtain\
    \ a “path” of parameter values. Interestingly, is not necessarily the end point\
    \ of this path that is closest to the solution of (5.5). Indeed, the path of parameter\
    \ values can pass a useful solution (with good generalization properties) before\
    \ drifting off to a worse solution (due to overfitting). Based on this observation,\
    \ there is another reason for stopping the optimization algorithm, apart from\
    \ the purely computational reason mentioned above. Early stopping of the algorithm\
    \ can obtain a final model with superior performance to the one we obtain if we\
    \ run the algorithm until convergence. We refer to this as *implicit regularization*\
    \ and discuss the details of how it can be implemented in Section 5.3.\n\n**Explicit\
    \ regularization** Another strategy is to simplify the cost (5.4) by adding a\
    \ term independent of the training data. We refer to this as explicit regularization.\
    \ The aim is to make the final model generalize better, that is, we hope to solve\
    \ the modified problem close to the solution of (5.5). We saw an example of this\
    \ in Section 3.3 where we introduced $L^2$ regularization. The underlying idea\
    \ is the law of parsimony, that the simplest explanation of an observed phenomenon\
    \ is usually the right. In the context of machine learning this means that if\
    \ both “simple” and “complicated” model fit the data (more or less) well, then\
    \ the “simple” will typically have superior generalization properties and should\
    \ therefore be preferred. Explicit regularization qualifies the vague notion “simple”\
    \ and “complicated” to simply mean small and large parameter values, respectively.\
    \ In order to favor a simple model an extra term is added to the cost function\
    \ that penalizes large parameter values. We will discuss regularization further\
    \ in Section 5.3.\n\n# 5.2 Losses and likelihood-based models\n\nWhich loss $L$\
    \ to use in the training objective (5.4) is a design choice and different loss\
    \ functions will give rise to different solutions $\\hat{\theta}$. There is no\
    \ “right” or “wrong” loss function, for a given problem one particular choice\
    \ can be superior to others in terms of small $E_{new}$ (note that there is a\
    \ similar design choice below how to choose the error function which defines we\
    \ measure the performance of the model). Certain combinations of models and loss\
    \ functions have proved useful and have historically been branded as specific\
    \ methods. For example the method “linear regression” often refers to the combination\
    \ of a linear-in-the-parameter model and the squared error loss, whereas the “support\
    \ vector classification” (see Chapter 8) refers to a linear-in-the-parameter model\
    \ trained using the hinge loss. In this section, we provide a general discussion\
    \ about different loss functions and their properties, connections to a specific\
    \ method.\n\nOne important aspect of a loss function is its *robustness*. Robustness\
    \ is tightly connected to outliers, meaning data points that do not describe the\
    \ relationship we are modeling. If outliers in the training data have only a minor\
    \ impact on the learned model we say that the loss function is robust. Conversely,\
    \ a loss function is not robust if the outliers have a major impact on the learned\
    \ model."
