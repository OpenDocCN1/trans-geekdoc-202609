  md: "# 3.1 Linear regression\n\nWhen using the squared error loss for a linear regression\
    \ model over $\\mathcal{T}$, we thus need to solve the problem\n\n```\n$$\\hat{\\\
    theta} = \\arg min_{\\theta} \\frac{1}{n}\\sum_{i=1}^n (\\theta^T\\mathbf{x}_i\
    \ - y_i)^2 = \\arg min_{\\theta} ||\\mathbf{X}\\theta - \\mathbf{y}||_2^.$\n```\n\
    \nFrom a linear algebra point of view, this can be seen as finding the closest\
    \ vector to $\\mathbf{y}$ (in an Euclidean sense) to the subspace of $\\mathbb{R}^n$\
    \ spanned by the columns of $\\mathbf{X}$. The solution is the orthogonal projection\
    \ of $\\mathbf{y}$ onto this subspace, and the corresponding $\\hat{\theta}$ can\
    \ be shown (see Section 3.A) to fulfill\n\n```\n$$\\mathbf{X}^T\\hat{\\theta}\
    \ = \\mathbf{X}^T\\mathbf{y}.$$\n```\n\nEquation (3.13) is often referred to as\
    \ the normal equations, and which gives the solution to the squares problem (3.12).\
    \ If $\\mathbf{X}^T\\mathbf{X}$ is invertible, then the $\\hat{\theta}$ has the\
    \ closed-form expression\n\n```\n$$\\hat{\\theta} = (\\mathbf{X}^T\\mathbf{X})^{-1}\\\
    mathbf{X}^T\\mathbf{y}.$$\n```\n\nThe fact that this closed-form solution exists\
    \ is, and probably the reason for why the linear regression with squared error\
    \ loss is extremely common in practice. Other functions lead to optimization problems\
    \ that often lack closed-form solutions., and we summarize it as Method 3.1 and\
    \ illustrate by Example 3.2.\n\n> **Time to reflect 3.1:** What does it mean in\
    \ practice if $\\mathbf{X}^T\\mathbf{X}$ is not invertible?\n\n> **Time to reflect\
    \ 3.2:** If the columns of $\\mathbf{X}$ are linearly independent and $p = n-1$,\
    \ $\\mathbf{X}$ spans the entire $\\mathbb{R}^n$. If in this case, the X is invertible\
    \ and (3.14) reduces to $\\theta = \\mathbf{X}^{-1}\\mathbf{y}$. Here, a unique\
    \ solution exists such that $\\mathbf{X}\\theta = \\mathbf{y}$ exactly, that the\
    \ model fits the training data perfectly. Why would that not be a desired property\
    \ in practice?\n\n# Learn linear regression with squared error loss\n\n**Data:**\
    \ Training data $\\mathcal{T} = \\{\\mathbf{x}_i, y_i\\}_{i=1}^n$\n\n**Result:**\
    \ Learned parameter vector $\\hat{\\theta}$\n\n+   1 Construct the matrix $\\\
    mathbf{X}$ and vector $\\mathbf{y}$ according to (3.5).\n2 Compute $\\hat{\\theta}$\
    \ by solving (3.13).\n\n# Predict with linear regression\n\n**Data:** Learned\
    \ parameter vector $\\hat{\\theta}$ and test input $\\mathbf{x}_*$.\n\n**Result:**\
    \ Prediction $\\hat{\\y}(\\mathbf{x}_*)$\n\n+   1 Compute $\\hat{\\y}(\\mathbf{x}_*)\
    \ = \\hat{\\\theta}^T\\mathbf{x}_*$.\n\n# Method 3.1: Linear regression"
