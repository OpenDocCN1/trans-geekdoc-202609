  md: "# 5 Learning parametric models\n\n# Second order gradient methods\n\nWe can\
    \ think of gradient descent as descending $J(\\theta)$ with a first order Taylor\
    \ expansion around $\theta^{(t)}$, that is, a hyper-plane. The next parameter\
    \ $\theta^{(t+1)}$ is selected by taking a step in the steepest direction of the\
    \ (hyper)-plane. Let us see what happens if we use a second order Taylor expansion,\n\
    \n```\n$J(\\theta) \\approx J(\\theta^{(t)}) + \\mathbf{v}^T \\nabla J(\\theta^{(t)})\
    \ + \\frac{1}{2} \\mathbf{v}^T \\nabla^2 J(\\theta^{(t)}) \\mathbf{v}. \\quad\
    \ (5.33)$\n```\n\nwhere $\\mathbf{v}$ is a vector of the same dimension as $\t\
    heta$. This expression does not only contain the gradient of the cost function\
    \ $\nabla J(\\theta)$, but also the Hessian of the cost function $\nabla^2 J(\\\
    theta)$. Remember that we are searching for the minimum of $s(\\theta, \\mathbf{v})$.\
    \ We will compute this by iteratively minimizing the second order approximation\
    \ $s(\\theta, \\mathbf{v})$. If the Hessian $\\nabla^2 J(\\theta)$ is positive\
    \ definite, then the minimum of $s(\\theta, \\mathbf{v})$ with respect to $\\\
    mathbf{v}$ is observed where the derivative of $s(\\theta, \\mathbf{v})$ is,\n\
    \n```\n$$\\frac{\\partial}{\\partial \\mathbf{v}} s(\\theta, \\mathbf{v}) = \\\
    nabla J(\\theta) + [\\nabla^2 J(\\theta)]^{-1}\\mathbf{v} = 0 \\Rightarrow \\\
    mathbf{v} = -[\\nabla^2 J(\\theta)]^{-1}\\nabla J(\\theta). \\quad (5.34)$\n```\n\
    \nThis suggests that\n\n```\n$$\\theta^{(t+1)} = \\theta^{(t)} - [\\nabla^2 J(\\\
    theta^{(t)})]^{-1}\\nabla J(\\theta^{(t)}). \\quad (5.35)$\n```\n\nNewton's method\
    \ is for minimization. Unfortunately, no general convergence are guaranteed for\
    \ Newton's method either. Yet it can be much faster than gradient descent. In\
    \ fact, if the cost $J(\\theta)$ is a quadratic function in $\theta$ then (5.33)\
    \ is exact and Newton's method (5.35) will find the optimum in only one iteration!\
    \ Quadratic objective functions are, however, rare in machine learning$^{1}$.\
    \ It is not guaranteed that the Hessian $\\nabla^2 J(\\theta)$ is always positive\
    \ definite in practice, which may make use of the potentially valuable second\
    \ order information difficult. To make use of the potentially valuable second\
    \ order information, we have to introduce some modification of Newton's method.\
    \ There are multiple options, and we will look at so-called trust regions.\n\n\
    We derived Newton's method using the second Taylor expansion (5.33) as a method\
    \ for how $J$ behaves around $\theta^{(t)}$. We should not trust the Taylor expansion\
    \ to be a good model for all values of $\theta$, but only in the vicinity of $\\\
    theta$. One natural restriction is to trust the second order Taylor expansion\
    \ (5.33) only within a radius $D$ around $\theta^{(t)}$, which we refer to as\
    \ our trust region. This suggests that we could make a Newton step (5.35) of the\
    \ parameters, unless the step is longer than $D$, in which case we decide the\
    \ step to leap near local minimum. In the next iteration, the trust region is\
    \ moved to center around the updated $\theta^{(t+1)}$, and another step is taken\
    \ from there. We express this as\n\n```\n$$\\theta^{(t+1)} = \\theta^{(t)} - \\\
    eta [\\nabla^2 J(\\theta^{(t)})]^{-1}\\nabla J(\\theta^{(t)}). \\quad (5.36)$\n\
    ```\n\nwhere $\\eta = 1$ is chosen so that $|\\theta^{(t+1)} - \\theta^{(t)}|\
    \ \\le D$. The trust region $D$ can be updated and adapted as the optimization\
    \ proceeds, but for simplicity we will consider $D$ to be a user choice (like\
    \ the learning rate for gradient descent). We summarize this with Algorithm 5.2\
    \ and look at it in Figure 5.6 The trust-region Newton method, with a set of rules\
    \ on how to update $D$, is actually one of the methods used for logistic regression\
    \ in\n\nIt can be computationally expensive or impossible to compute the inverse\
    \ of the Hessian $\\nabla^2 J(\\theta^{(t)})^{-1}$. To this end, there is an entire\
    \ class of methods called-Newton methods that we use\n\n> $1$For regression, we\
    \ use the squared error loss $L(y, \\gamma) = (y - \\gamma)^2$, which is a quadratic\
    \ function in $\\gamma$. That does not mean that $J(\\theta)$ (the objective)\
    \ is a quadratic function in $\theta$, since it can depend solely on $y$. For\
    \ linear regression with squared loss, the dependence is linear and the cost function\
    \ is indeed quadratic. This is why we can compute an explicit solution using the\
    \ normal equations, which is of course the same that we would obtain after one\
    \ iteration of Newton's method to apply this problem.\n\nDraft (April 30, 2021)\
    \ of Machine Learning - A First Course for Engineers and Scientists. http://mmlbook.org\n\
    \nAndreas Lindholm, Nicholas Wahling, Fredrik Strödin, and Thomas B. Schwarz.\
    \ 2021.\n\n102"
  merge: -1
  img_proc: true
