    region also moves. Compare Figure 6.10a and 6.10b. Furthermore, the nine parameters
    $W_{1,1}, \dots, W_{3,3}$ are all for hidden units in the layer.


    ![](img/9c84a60f9e70ea0bf5c7c51ae709df3e_124_1.png)


    **Figure 6.11:** An illustration of zero-padding used when the region is outside
    the image. With zero-padding, the size of the image can be preserved in the following
    layer.


    # Sparse interactions


    With sparse interactions we mean that most of the parameters in a dense layer
    are forced to be equal to zero. More specifically, a hidden unit in a convolutional
    layer only depends on pixels in a small region of the image and not on all. In
    Figure 6.10 this size is of 3x3. The position of the region is related to the
    position of the hidden unit in its representation. If we move one unit to the
    right, the corresponding region also moves, as displayed by comparing Figure 6.10a
    and 6.10b. For the hidden units on border, the corresponding region is partially
    located outside the image. For these cases, we typically use zero-padding where
    the missing pixels are replaced with zeros. Zero-padding is illustrated in Figure
    6.11.


    # Parameter sharing


    In a dense layer each link between an input variable and a hidden unit has its
    own parameter. In parameter sharing we let the same parameter be present in multiple
    places in the network. In a convolutional layer the set of parameters for the
    different hidden units are all the same. For example, in Figure 6.10a we use the
    same set of parameters to map the 3x3 region of pixels to the hidden unit as we
    do in Figure 6.10b. Instead of using separate sets of parameters for every position
    we learn only one of a few parameters, and use it for all links between input
    and the hidden units. We call this set a **filter**. The mapping between the input
    variables and the hidden units can be interpreted as a convolution between the
    input variables and the filter, hence the convolutional neural network. Mathematically,


    ```

    $q_{ij} = h \left( \sum_{k=1}^{3} \sum_{l=1}^{3} x_{i+k-1,j+l-1} W_{k,l} \right),$

    ```'
