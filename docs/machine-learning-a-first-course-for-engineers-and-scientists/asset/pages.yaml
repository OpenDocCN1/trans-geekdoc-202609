    # 12.3 Limitations of training data


    Throughout this book we have emphasised that machine learning involves finding
    a model that uses data, to predict an output, u. We have described how to find
    the model that captures the relationship between inputs and outputs. This process
    is essentially one of representing the data in a form of a model and, such, any
    model we create is only as good as the data we. No matter how sophisticated our
    machine learning methods are, we should view them as nothing more than ways of
    representing patterns in the data we give. They are fundamentally limited by their
    training data.


