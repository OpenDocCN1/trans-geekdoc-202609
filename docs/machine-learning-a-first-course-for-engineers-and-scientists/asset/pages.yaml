    \ any two data points are.\n\nFurthermore, kernel-NN allows us to use k-NN for\
    \ data where the Euclidean distance has not\nnatural sense. As we have a kernel\
    \ which acts on the input space, we can apply kernel k-NN\neven if the Euclidean\
    \ distance is not defined for that type. We can then apply kernel-NN to\ndata\
    \ that is neither numerical nor categorical, such as text snippets, which is illustrated\
    \ by Example 4.\n\n# Example 4: Kernel-NN for interpreting words\n\nThis example\
    \ illustrates how k-NN can be applied to explain text, where the Euclidean distance\
    \ has no\nmeaning and standard k-NN cannot be applied. In this example, input\
    \ is single words (or\nmore technically), then we use the so-called Levenshtein\
    \ distance to construct a kernel.\nThe Levenshtein distance is the number of single-character\
    \ edits to transform one word into\nanother. It takes two strings and returns\
    \ a non-negative integer, which is zero only if the two strings are\nequal. It\
    \ fulfills the properties of a metric on the space of character strings, and we\
    \ can then\nuse it in the example using a squared exponential to construct a kernel\
    \ $\\kappa(x, x') = \\exp(-\\frac{LD(x, x')^2}{2\\sigma^2})$ (where\nLD is the\
    \ Levenshtein distance), where $\\sigma=5$.\n\nIn this small example, we consider\
    \ a training dataset of 10 adjectives (each labeled\n$(y_i)$ Positive or Negative).\
    \ We will now use k-NN with our kernel k-NN (the kernel\ndefined to predict whether\
