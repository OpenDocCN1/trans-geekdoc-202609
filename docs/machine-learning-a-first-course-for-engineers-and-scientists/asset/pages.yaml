    \ when we need to evaluate the probability density function. That is, by simply\
    \ sampling a Gaussian vector $z \\sim \\mathcal{N}(0, I)$ and then feeding the\
    \ obtained through the parametric function, $f_{\theta}(z)$ does not impose"
