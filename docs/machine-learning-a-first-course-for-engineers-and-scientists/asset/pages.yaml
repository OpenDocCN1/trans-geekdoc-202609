    # Method 2.2: Decision trees


    # Classification trees


    Trees can also be used for classification. We use the same procedure of recursive
    binary splitting but with two differences. Firstly, we use a majority vote instead
    of an average to compute the prediction associated with each region,


    $\widehat{y}_t = \text{MajorityVote}\{y_i : \mathbf{x}_i \in R_t\}$


    Secondly, when we learn the tree we use a different splitting criterion than the
    squared error to take into account the fact that the output is categorical. To
    define these criteria, first note that the split at any internal node is solved
    by solving an optimization problem of the form,


    where $n_1$ and $n_2$ are the number of data points in the left and right nodes
    of the current split, respectively, and $Q_1$ and $Q_2$ are the costs (derived
    from the prediction errors) associated with these two nodes. The variables $j$
    and $s$ denote the indexing of the splitting variable and the cutoff as before.
    All of the terms $n_1, n_2, Q_1$, and $Q_2$ depend on these, but we have dropped
    the explicit dependence from the notation for brevity. Comparing (2.6) with (2.5)
