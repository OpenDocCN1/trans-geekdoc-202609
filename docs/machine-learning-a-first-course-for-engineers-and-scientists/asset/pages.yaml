    # Worst case guarantees


    In the view of this, a supervised machine learning model is good if it fits some
    E_now. It is, however, to remember that E_now is a statistical claim, under the
    assumption that the training/or test data remains the quality that the model will
    find once it is put in production. And even if non-trivial assumption is satisfied,
    there are no claims about how badly the model will predict in the worst cases.
    This is indeed a shortcoming of supervised machine learning, and potentially also
    a show-stopper for some applications.


    Simpler and more interpretable models, like logistic regression and trees for
    example, can be inspected manually in order to reduce the "worst case" that could
    happen. By looking at the leaf nodes in a regression tree, as an example, it is
    possible to give an interval to which all predictions belong. With more complicated
    models, like random forests and deep learning, it is very hard to give any worst
    case guarantees about how inaccurate the model can be in its predictions faced
    with some particular input. However, an extensive testing scheme might reveal
    some of the potential issues.


