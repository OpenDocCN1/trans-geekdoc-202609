  md: "# 5.4 Parameter optimization\n\n![](img/9c84a60f9e70ea0bf5c7c51ae709df3e_96_0.png)\n\
    \nTo reflect on 5.2: After reading the rest of this book, return here and try\
    \ to fill out this table, summarizing how optimization is used by the different\
    \ methods.\n\n| Method | What is optimization used for? | What type of optimization?\
    \ |\n| --- | --- | --- |\n| | Training, Hyper-parameters, Regularization | Closed-form*,\
    \ Grid search, Gradient-based, Stochastic gradient descent |\n| k-NN | | | |\n\
    | Trees | | | |\n| Linear regression | | | |\n| Linear regression with L2-regularization\
    \ | | | |\n| Linear regression with L1-regularization | | | |\n| Logistic regression\
    \ | | | |\n| Deep learning | | | |\n| Random forest | | | |\n| Gradient boosting\
    \ | | | |\n| Gaussian process | Including coordinate descent | | |\n\n# Optimization\
    \ using closed-form expressions\n\nFor linear regression with squared error, training\
    \ the model amounts to solving the optimization problem (3.12)\n\n> $\\tilde{\t\
    heta} = \\arg \\min_{\\theta} \\frac{1}{n}|\\mathbf{X}\\theta - \\mathbf{y}||^2_2$\n\
    \nAs we have discussed, and also proved in Appendix 3.A, the solution (3.14) to\
    \ this problem can (under the assumption that $\\mathbf{X}^TX$ is invertible)\
    \ be derived if we spend some time to efficiently implement (3.14), for example\
    \ using the Cholesky or QR factorization, we can use that every time we want to\
    \ train a linear regression model with squared error loss. Each time we use it\
    \ we know that we have found the optimal solution in a computationally efficient\
    \ way.\nIf we want to use the $L^1$-regularized version, we have to solve (5.26)\n\
    \n> $\\tilde{\theta} = \\arg \\min_{\\theta} |\\mathbf{X}\\theta - \\mathbf{y}||^2_2\
    \ + \\lambda|\\theta||_1$\n\nThis problem, cannot be solved analytically. Instead\
    \ we have to use computer power to solve it, by constructing an iterative procedure\
    \ for seeking the solution. With a certain choice of such an optimization algorithm,\
    \ we can make use of analytical expressions along the line, which turns out to\
    \ be an efficient way of solving it. Remember that $\\theta$ is a vector containing\
    \ $p+1$ parameters that we want to learn from the training data. As it turns out,\
    \ if we seek the minimum for only one of these parameters, as $\\theta_j$, while\
    \ keeping the other parameters fixed, we can find out\n\n```\n$\\arg \\min_{\\\
    theta_j} |\\mathbf{X}\\theta - \\mathbf{y}||^2_2 + \\lambda|\\theta||_1 = \\sign(t)(|r_j|\
    \ - \\lambda), \\text{where } t = \\sum_{i=1}^{n} x_{ij}(y_i) - \\sum_{k \\neq\
    \ j} x_{ik}\\theta_k. \\quad (5.28)$\n```"
