    # AdaBoost


    What we have discussed so far is a general idea, but there are still a few technical
    design choices. Let us now derive an AdaBoost (Adaptive Boosting) algorithm for
    binary classification. AdaBoost was the first successful practical implementation
    of the boosting idea and lead the way for its popularity.


    As outlined in Example 7.5 boosting attempt to construct a sequence of $B$ binary
    classifiers $\hat{y}^{(1)}(x), \hat{y}^{(2)}(x), \dots, \hat{y}^{(B)}(x)$. We
    will in this procedure consider the final ''hard'' $\hat{y}(x)$ from the base
    models, and not their predicted class $g(x)$. Any classification model can be
    used as a base classifier—simple classification trees are common in practice.
    The individual predictions of the B ensemble are then combined into a final prediction.
    Unlike bagging, all ensemble members are not treated equally. Instead, we assign
    some positive coefficients $a^{(b)}_{b=1}^B$ and construct the boosted classifier
    using a weighted majority vote


    ```

    \hat{y}_{boost}^{(B)}(x) = \text{sign} \left( \sum_{b=1}^{B} a^{(b)} \hat{y}^{(b)}(x)
    \right).

    ```


    Each member votes either -1 or +1, and thus the boosted classifier is +1 if the
    weighted sum of the individual votes is positive and -1 if it is negative. The
    coefficient $a^{(b)}$ can be thought of as a measure of confidence in the predictions
    by the $b$th ensemble member.


    The construction of the AdaBoost classifier in (7.4) follows the general form
    of a binary classifier by thresholding a real-valued function $f(x)$ at zero,
    where in this case the function is given by the weighted sum of predictions made
    by all the members. In AdaBoost, the ensemble members and their coefficients $a^{(b)}$
    are trained greedily by minimizing the exponential loss of the boosted classifier
    at each iteration. Recall from (5.16) that the exponential loss is given by


    ```

    L(y \cdot f(x)) = \exp(-y \cdot f(x)).

    ```


    $y \cdot f(x)$ is the *margin* of the classifier. The ensemble members are added
    one at a time, and when member $b$ is added, this is to minimize the exponential
    loss (7.5) of the entire ensemble so far (that is, the boosted classifier consisting
    of $b$ members). The main reason for choosing the exponential loss, not one of
    the other loss functions discussed in Section 5.2, is that it results in closed
    form expressions (like the squared error loss in linear regression), as we will
    see when deriving the AdaBoost procedure.


    Let us derive the boosted classifier after $b$ iterations $f^{(b)}(x) = \text{sign}(f^{(b)}(x))$
    where we can express $f^{(b)}(x)$ iteratively


    ```

    f^{(b)}(x) = f^{(b-1)}(x) + a^{(b)} \hat{y}^{(b)}(x),

    ```


    initialized with $f^{(0)}(x) = 0$. The ensemble members (and well the coefficients
    $a^{(b)}_{b=1}$) are constructed sequentially, meaning that at iteration $b$ of
    the function $f^{(b-1)}(x)$ is known and fixed. This is what this “construction”
    does. Consequently, what remains to be learned at iteration $b$ is


