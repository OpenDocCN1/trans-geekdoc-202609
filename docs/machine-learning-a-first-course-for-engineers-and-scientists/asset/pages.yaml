  md: '# 7.5 Further reading


    The general bagging idea was initially proposed by Breiman (1996), whereas the
    more specific random forest algorithm dates back to Ho (1995) who essentially
    proposed to limit the set of possible splitting variables for each tree. The idea
    to also use a bootstrapped data set (that is, bagging) is due to Breiman (2001).


    Boosting was popularized by the introduction of AdaBoost by Freund and Schapire
    (1996), who were also awarded the prestigious Gödel Prize in 2003 for their algorithm.
    Real AdaBoost was proposed by Friedman et al. (2000), and gradient boosting by
    Friedman (2001) and Mason et al. (1999). Efficient and widely used implementations
    of gradient boosting include the XGBoost package by T. Chen and Guestrin (2016)
    and LightGBM by Ke et al. (2017).'
