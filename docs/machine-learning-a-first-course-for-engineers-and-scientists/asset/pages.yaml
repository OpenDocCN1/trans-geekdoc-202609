    ![](img/9c84a60f9e70ea0bf5c7c51ae709df3e_113_0.png)


    **Figure 6.1:** Graphical illustration of a linear regression model (Figure 6.1a),
    and a generalized linear regression model (Figure 6.1b). In 6.1a, the output $\hat{y}$
    is described as the sum of all terms $b$ and $\{W_j x_j\}_{j=1}^d$, as in (6.2).
    In 6.1b, the circle denotes addition and also transformation through the activation
    function $h$, as in (6.3).


    ![](img/9c84a60f9e70ea0bf5c7c51ae709df3e_113_1.png)


    **Figure 6.2:** Two common activation functions used in neural networks. The logistic
    (or sigmoid) function (Figure 6.2a), and the rectified unit (Figure 6.2b).


    These are illustrated in Figure 6.2a and Figure 6.2b, respectively. The logistic
    (or sigmoid) function has already been used in the context of linear regression
    (Section 3.2). The logistic function is linear to $z=0$ and saturates at $0$ and
    $1$ as $z$ decreases or increases. The ReLU is even simpler. The function is just
    equal to $z$ for positive inputs and equal to zero for negative inputs. The logistic
    function used to be the standard choice of activation function in neural networks
    for many layers, whereas the ReLU is now the standard in most modern networks,
    despite (and partly due to) its simplicity.


    The generalized linear regression model (6.3) is very simple and itself incapable
    of describing very complicated relationships between the input $x$ and the output
    $\hat{y}$. Therefore, we make two further extensions to increase the generality
    of the model: we first make use of *several parallel* generalized linear regression
    models to build a *two-layer network* and then stack these layers in a *sequential*
    construction (which will result in a deep neural network).


    # Two-layer neural network


    In (6.3), the output $\hat{y}$ is constructed by one scalar regression model.
    To increase its flexibility and turn into a two-layer neural network, we instead
    let its output be a sum of $U$ generalized linear regression models, each of which
    has its own set of parameters. The parameter for the $k^{th}$ regression model
    are $b_k, W_{k1}, \dots, W_{kd}$ and we denote our output by $q_k$.


    ```

    $q_k = h_k(W_{k1}x_1 + W_{k2}x_2 + \dots + W_{kd}x_p + b_k), \quad k=1, \dots,
    U.$

    ```


    These intermediate outputs $q_k$ are called hidden units, which are not the output
    of the model. The $U$ different hidden units $\{q_k\}_{k=1}^U$ instead act as
    inputs to an additional linear regression model


    ```

    $\hat{y} = W_1q_1 + W_2q_2 + \dots + W_Uq_U + b.$

    ```


    To distinguish the parameters in (6.4) and (6.5) we add the superscripts (1) and
    (2), respectively. The equations describing this two-layer neural network (or
    equivalently, a neural network with one'
