    # Explaining models in an understandable way


    In Chapter 4 we defined AUC as the area under the curve plotting false positive
    rate against true positive rate. This is widely used performance measure in applications,
    and it is therefore important to think deeply about what it implies about our
    model. To help with this, we now give another, more intuitive, definition of AUC
    for four problem domains


    **Medical** An algorithm is given two images, one containing a cancerous, one
    not containing a cancerous tumour. The two images are selected at random from
    those of people referred by a specialist for a case. AUC is the proportion of
    times the algorithm correctly identifies the image containing the tumour


    **Personality** An algorithm is given two randomly chosen Facebook profiles and
    asked to predict which of the users is most neurotic (measured in a standardised
    questionnaire). AUC is the proportion of times it correctly identifies the most
    neurotic person.


    **Goals** An algorithm is given input data of two randomly chosen shots from a
    season of football (soccer) and predicts whether the shot is a goal or not. AUC
    is the proportion of times it correctly identifies the goal.


    **Sentencing** An algorithm is given demographic data of two convicted criminals,
    of whom one went on sentence for further crimes within the next two years. AUC
    is the proportion of times it identified the individual who was sentenced for
    further crimes.


    In all four of these cases, and in general, AUC is equivalent to "the probability
    that a randomly chosen individual from the positive class has a higher score than
    a randomly chosen person from the negative class"


    We prove this equivalence. To do this, we assume every member of our model. Machine
    learning methods can be used to produce a score, indicating whether the individual
    is more likely to belong to the positive class. For example, the function $g(x)$
    in (3.36) produces a score for logistic regression. Usually, non-parametric machine
    learning methods, as $k$-nearest neighbours, dont no explicit score, but often
    have a parameter (e.g. $k$) which can be tuned in a way that matches. In what
    follows, we assume, for convenience, that the positive class typically has higher
    scores than the negative class.


    We define a random variable $S_P$ which is the score produced by the model of
