- pgno: 9
  md: '# Introduction


    Classification is a supervised machine learning task which involves predicting
    a certain class, label, for each data point. Specifically, for classification
    problems there are only a finite number of possible output values. In the ECG
    example, the classes correspond to the type of heart condition. For instance,
    the classes could be ''normal'' or ''abnormal'', in which case we refer to it
    as a binary classification (only two classes). More generally, we can design a
    model for classifying each signal as either ''normal'', or assign it to one of
    a predetermined set of abnormalities. We then face a (more ambitious) multi-class
    classification problem.


    Classification is not the only type of supervised machine learning that we can
    utilize. Specifically, we will also study another type of problem referred to
    as regression. Regression differs from classification in that the output ( is,
    the quantity we want the model to predict) is a numerical value. We illustrate
    this with an example from material science.


    # Example 1.2: Formation of crystals


    Much of our technology is driven by the discovery of new materials with unique
    properties. Indeed, technologies such as touch sensors and batteries for electric
    vehicles have emerged due to advances in material science. Materials discovery
    was largely done through experiments, but this has been time consuming and costly,
    which limited the number of new materials that could be found. Over the past few
    decades, computational methods have therefore played an increasingly important
    role. The basic idea behind computational material science is to create a large
    number of hypothetical materials, and then to experimentally synthesize the most
    promising candidates.


    Crystalline solids (or, crystals) are a central type of inorganic materials. In
    a crystal, the atoms are arranged in a highly ordered microscopic structure. To
    understand the properties of such materials, it is not enough to know the proportion
    of each element in the material, but we also need to know how elements (or atoms)
    are arranged into a crystal. A basic property of interest when considering a hypothetical
    material is to determine its formation energy—which is the energy that needs to
    form the form from the individual elements. Nature strives for finding a minimum
    energy configuration; if a certain structure is predicted to have a formation
    energy that is significantly larger than that alternative crystals composed of
    the same elements, then it is unlikely that it can be synthesized in a practical
    way.


    A classical method (having gone since the 60s) can be used for computing the formation
    energy of a structure, namely, density functional theory (DFT). The DFT method,
    which is based on quantum mechanical modeling, was the first real breakthrough
    in computational material science, enabling high throughput screening for materials
    discovery. That said, the DFT method is computationally heavy and even with modern
    supercomputers, only a small fraction of potentially interesting materials have
    been analyzed.


    To handle this limitation, much interest has risen to using machine learning for
    materials discovery, with the potential of resolving a scale regression problem.
    By training a machine learning model to, predict the formation energy—but in a
    fraction of the time—a much larger range of candidate materials can be investigated.


    As a concrete example, Fischer et al. (2018) used a machine learning method referred
    to as kernel regression (see Chapter 8) to predict the formation energy of 2 million,
    so-called, elellite crystals. The machine learning model is a program that takes
    a crystal as input (a description of the properties and elemental types of the
    atoms in the crystal), and is asked to return a prediction of the formation energy.
    To train the model, 10,000 crystals were randomly selected and then trained using
    DFT. The model was then trained to predict formation energies as closely as possible
    with the DFT output—99.5% of the essentials. Among these, 128 new structures were
    found to have a favorable energy, thereby potentially stable in nature.


    Comparing the two examples discussed above we can make some interesting observations.
    As pointed out, that the ECG model is asked to predict a certain class (say, normal
    or abnormal), whereas the materials discovery model is asked to predict a numerical
    value (the formation energy of a crystal). These are the main types of predictions
    that we study in this book, referred to as classification and regression, respectively.
    While conceptually we use slight variations of the underlying mathematical models,
    depending on the problem type. It is therefore instructive to treat'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# 1.1 Machine learning exemplified


    them separately.


    Both types are supervised learning problems, though. That is, we train a predictive
    model to mimic the predictions made by a “supervisor”. However, it is interesting
    to note that the supervision is not necessarily by a human domain expert. Indeed,
    for the formation energy model, the training data was obtained by running automated
    (but costly) density function computations. In other situations we might obtain
    the output values when collecting the training data. For instance, assume that
    you want to build a model for predicting the outcome of a soccer match based on
    data about the two teams. This is a classification problem (the output is “win”,
    ‘lose’, or ‘tie’) but the training data does not have to be labeled, unless we
    get the labels from historical matches. Similarly, if you want to build a regression
    model for predicting the price of an apartment based on its size, location, condition,
    etc., then the output (price) is obtained from historical stores.


    Finally, it is worth noting that although the examples discussed above correspond
    to very different application domains, the problems are quite similar from a machine
    learning perspective. Indeed, the general procedure in Figure 1.2 is applicable,
    with minor modifications, also for the materials discovery problem. This generality
    and versatility of machine learning methodology is one of its main strengths and
    beauties.


    In this book we will use of statistics and probability theory to describe the
    models used for making predictions. Using probabilistic models allows us to systematically
    recover and cope with the uncertainty in predictions. In the examples above it
    is not obvious why this is needed. It could (perhaps) be argued that there is
    a “correct answer” both in the EEG problem and the formation energy problem. Furthermore,
    we might expect that the machine learning model should be able to provide a definite
    answer in it. However, even in situations where there is a correct answer, machine
    learning models rely on various assumptions and are learned from using learning
    algorithms. With probabilistic models, we are able to represent the uncertainty
    in the model’s predictions, whether it originates from the data, the modeling
    assumptions, or the computation. Furthermore, in many applications of machine
    learning, the output is uncertain in itself and there is no such as a definite
    answer. To highlight the need for probabilistic predictions, let us consider an
    example from sports analytics.


    > Example 1.3: Probability of scoring a soccer goal


    Soccer is a sport where lots of data has been collected on individual players
    act throughout a match, how teams collaborate, how they perform over time, etc.
    All this data is used to better understand the game and help players reach their
    full potential. Consider predicting whether or not a shot results in a goal. To
    this end, we use a simple model, where the prediction is based only on the player’s
    position on the field when taking the shot. Specifically, the input is the distance
    from the goal and the angle between the two lines drawn from the player’s position
    to the goal posts; see Figure 1.3. The output corresponds to whether or not the
    shot results in a goal, meaning that this is a binary classification problem.


