    > Example 6.2: Classification of hand-written digits - first attempt


    We consider the example of classifying hand-written digits introduced in Example
    6.1. Based on the data presented we train the two methods mentioned in each of:
    a logistic regression model (or a two-layer neural network).

    We use stochastic gradient descent in Algorithm 5.3 with the learning rate y=0.5
    and a mini-batch size of n=100. Since there are 600 training data points in total,
    each epoch is completed after 600/100 iterations. We run the algorithm for 15
    epochs, i..900 iterations.

    As explained earlier, at each iteration of the cost function is evaluated for
    the current mini-batch of the training data. The value for this cost is illustrated
    in the left part of Figure 6.7 and 6.8. In addition, we also calculate the misclassification
    rate for the 100 data points in the current mini-batch. This is illustrated in
    the right part of Figure 6.7 and 6.8. Since the current mini-batch of 100 randomly
    selected training data, the performance fluctuates on which mini-batch that is
    considered.

    However, the important is how we perform on data which has not been used during
    training. Therefore, at each 100th iteration we also evaluate the cost function
    and the misclassification error on the whole validation dataset of 1000 data points.
    This performance is illustrated in red of Figure 6.7 and 6.8.


    # Logistic regression model


    Figure 6.7 illustrates the training of the logistic regression model.


    ![](img/9c84a60f9e70ea0bf5c7c51ae709df3e_122_0.png)


    We can see that the performance on validation data improves and after a few epochs
    we do not see any additional improvements and we get a misclassification rate
    of approximately 8% on the validation data.


    # Two-layer neural network


    In Figure 6.8 the training of the two-layer neural network with $U=200$ hidden
    units is illustrated. As activation function we used the ReLU in.


    ![](img/9c84a60f9e70ea0bf5c7c51ae709df3e_122_1.png)


    Adding this of hidden units significantly reduces the misclassification rate down
    to 2% on the validation data. We can also see that during later epochs we get
    all 100 data points in the current mini-batch correct. The discrepancy between
    training error and validation error indicates that we are overfitting our model.
    One way to prevent this overfitting, and enhance the performance on validation
    data even further, is to adapt the neural layers to other types of layers which
    are tailored for image data. This type of neural network layers are explained
    in the following section.


