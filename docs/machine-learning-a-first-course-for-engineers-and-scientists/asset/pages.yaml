  md: "# 9 The Bayesian approach and Gaussian processes\n\n![](img/9c84a60f9e70ea0bf5c7c51ae709df3e_189_0.png)\n\
    \n![](img/9c84a60f9e70ea0bf5c7c51ae709df3e_189_1.png)\n\n(a) A Gaussian process\
    \ defined on the real line parameterized by $x_1$, not conditioned on any observations.\
    \ The intensity of blue color is proportional to the (marginal) variance (smaller\
    \ than the observation) and the marginal distributions for two test inputs $x_1$\
    \ and $x_2$ are shown in red. To similarly to 9.5, we only plot the marginal distribution\
    \ for each test input, but the Gaussian process defines a joint distribution for\
    \ all points on the $x$-axis.\n\n(b) The conditional Gaussian process given the\
    \ observation of $f(x_1)$ in the point $x_1$. The prior distribution from Figure\
    \ (a) is shown in gray. Note how the conditional distribution adjusts to the observation\n\
    \n**Figure 9.6:** A Gaussian process. Figure (a) shows the prior distribution,\
    \ (b) shows the posterior distribution after conditioning on one observation (black\
    \ dot).\n\n# Extending kernel regression into a Gaussian process\n\nAn alternative\
    \ to obtain the Gaussian process construction, is to apply the kernel trick from\
    \ Section 8.2 to Bayesian linear regression from (9.11). The connection between\
    \ linear regression, Bayesian linear regression, kernel regression and the Gaussian\
    \ process is summarized in Figure 9.7. This will essentially lead back to (9.21),\
    \ with the kernel being the covariance function $k(x,x')$ and the mean function\
    \ $\\mu(x)=0$.\n\nLet us now repeat the posterior predictive for Bayesian linear\
    \ regression (9.11), with however two changes. The first change is that we assume\
    \ the mean and covariance for $\theta$ is $\boldsymbol{\\mu}_0 = \\mathbf{0}$\
    \ and $\\Sigma = \\mathbf{I}$. This assumption is not strictly needed for our\
    \ purposes, but it simplifies the expressions. The second change is that in Section\
    \ 8.1 nonlinear feature transformations $\boldsymbol{\\Phi}(x)$ of the input variable\
    \ $x$ in the linear regression model. We replace $\\mathbf{X}$ with $\\mathbf{\\\
    Phi}(X)$ in the notation. Allogether\n\n```\n$p(f(x_*)|y) = N(f(x_*)|m_*, s_*^2),\
    \ \\quad (9.23a)$\n```\n\n```\n$m_* = \boldsymbol{\\Phi}(x_*)^T (\\sigma^2 \\\
    mathbf{I} + \boldsymbol{\\Phi}(X)^T \boldsymbol{\\Phi}(X))^{-1} \boldsymbol{\\\
    Phi}(X)^T \\mathbf{y}, \\quad (9.23b)$\n```\n\n```\n$s_* = \boldsymbol{\\Phi}(x_*)^T\
    \ (\\mathbf{I} + \\frac{1}{\\sigma^2} \boldsymbol{\\Phi}(X)^T \boldsymbol{\\Phi}(X))^{-1}\
    \ \boldsymbol{\\Phi}(x_*). \\quad (9.23c)$\n```\n\nIn a similar fashion to the\
    \ derivation of kernel regression, we use the push-through matrix identity $\\\
    mathbf{A}(\\mathbf{A}^T\\mathbf{A} + \\mathbf{I})^{-1} = (\\mathbf{A}^T + \\mathbf{I})^{-1}\\\
    mathbf{A}^T$ to rewrite $m_*$ with the aim to have only entering through inner\
    \ products,\n\n```\n$m_* = \boldsymbol{\\Phi}(x_*)^T \boldsymbol{\\Phi}(X)^T (\\\
    sigma^2 \\mathbf{I} + \boldsymbol{\\Phi}(X)^T \boldsymbol{\\Phi}(X))^{-1} \\mathbf{y}.\
    \ \\ \\quad (9.24a)$\n```\n\nTo re-write $s_*$ in a similar fashion, we use the\
    \ matrix inversion lemma $(\\mathbf{IU}-\\mathbf{V})^{-1} = \\mathbf{U}-\\mathbf{U}(\\\
    mathbf{I}+\\mathbf{VU})^{-1}\\mathbf{V}$ (which holds for matrices $\\mathbf{U}$\
    \ and $\\mathbf{V}$ of compatible dimensions),\n\n```\n$s_* = \boldsymbol{\\Phi}(x_*)^T\
    \ \boldsymbol{\\Phi}(X)^T - \boldsymbol{\\Phi}(x_*)^T \boldsymbol{\\Phi}(X)^T\
    \ (\\sigma^2 \\mathbf{I} + \boldsymbol{\\Phi}(X)^T \boldsymbol{\\Phi}(X))^{-1}\
    \ \boldsymbol{\\Phi}(x_*). \\ \\quad (9.24b)$\n```\n\nDraft (April 30, 2021) of\
    \ Machine Learning - A First Course for Engineers and Scientists. http://mlbook.org\n\
    \n190 © Andreas Lindholm, Niklas Wahlström, Fredrik Lindstein, and Thomas B. Schober\
