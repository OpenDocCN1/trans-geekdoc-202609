    **Figure 10.2:** The decision boundary for the QDA classifier (obtained by (10.5)
    and (10.7)) corresponding to the learned GMM in the pattern figure of Figure 10.1.


    # Predicting output labels for new inputs: discriminant analysis


    We have so described the generative GMM $p(x,y)$, where $x$ is numerical and $y$
    is categorical, and how to learn the unknown parameters in $p(x,y)$ from training
    data. We will now see how this can be used as a classifier for supervised machine
    learning.


    The key insight for using a generative model $p(x|y)$ to make predictions is to
    realize that the output $y$ for a known value $x$ amounts to computing the conditional
    $p(y|x)$. From probability theory we have


    ```

    $p(y|x) = \frac{p(x,y)}{p(x)} = \frac{p(x,y)}{\sum_{j=1}^M p(x,j)}$

    ```


    The left side $p(y|x)$ is the predictive distribution, whereas all expressions
    on the right side are defined by the generative GMM (10.1). We therefore get the
    classifier


    ```

    $p(y=m|x) = \frac{\pi_m \mathcal{N}(x|\hat{\mu}_m, \hat{\Sigma}_m)}{\sum_{j=1}^M
    \pi_j \mathcal{N}(x|\hat{\mu}_j, \hat{\Sigma}_j)}$

    ```


    As usual, we can obtain "hard” predictions by selecting the class which is predicted
    to be the most probable,


    ```

    $\hat{y}_* = \arg\max_m p(y=m|x)$

    ```


    and compute decision boundaries. Taking the logarithm (which does not change the
    maximizing argument) and noting only that the numerator in (10.5) depends on $m$
    we can equivalently write this


    ```

    $\hat{y}_* = \arg\max_m [\ln \pi_m + \ln \mathcal{N}(x|\hat{\mu}_m, \hat{\Sigma}_m)]$

    ```


    Since the logarithm of the Gaussian probability density function is a quadratic
    in $x$, the decision boundary for this classifier is quadratic and the method
    is referred to as quadratic discriminant analysis (QDA). We summarize this by
    Method 10.1 and 10.3, and in Figure 10.2 we see the decision boundary when the
    GMM from Figure 1.0 is turned into a QDA classifier.


    The QDA method arises naturally from the GMM. However, if we make an additional
    simplification about the model we obtain an even well-known and commonly used
    classifier, referred to as linear discriminant analysis (LDA). The additional
    assumption is that the covariance matrix is equal for all classes, is $\Sigma_1
    = \Sigma_2 = ... = \Sigma_M$ in (10.1). With this restriction we have a single
    covariance matrix to learn and it is replaced by


    ```

    $\hat{\Sigma} = \frac{1}{n} \sum_{i=1}^n (x_i - \hat{\mu}_m)(x_i - \hat{\mu}_m)^T$

    ```


