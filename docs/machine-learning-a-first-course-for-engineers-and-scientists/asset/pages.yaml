    \ for $k$-means). The reason is that increasing $M$ to $M+1$ gives more flexibility\
    \ to the model, and this increased flexibility can only decrease the value of\
    \ cost. Intuitively, in the case when $M=n$, we end up with the trivial (unintersecting)\
    \ solution where each data point is assigned to its cluster. This is a type of\
    \ overfitting.\n\nValidation techniques such as hold-out and cross-validation\
    \ (see Chapter 4) can be used to guide the model selection, but they need to be\
    \ adapted to the unsupervised setting (specifically, there is no new data error\
    \ $E_{pp}$ for the clustering model). Instance, for the GMM, which is a probabilistic\
    \ generative model, it is possible to use of the hold-out validation set to find\
    \ a suitable value for $M$. That is, we set aside validation data $x_{val}$ which\
    \ is not used to cluster the model. We then train different models for different\
    \ values of $M$ on the remaining data, and evaluate the hold-out likelihood $p(x_{val}^i)_{i=1}^n|\\\
    hat{\theta})$ in each candidate model. The best hold-out likelihood is then selected\
    \ as the final cluster model.\n\nThis provides us with a systematic way of selecting\
    \ $M$; however, in the unsupervised setting context of a predictive model, minimizing\
