- pgno: 97
  md: "# 5 Learning parametric models\n\nIt turns out that repeated \"sweeps\" through\
    \ the vector $\\theta$ and updating one parameter at a time according to (5.28)\
    \ is a good way to solve (5.26). This type of algorithm, where we update one parameter\
    \ at a time, is referred to as *coordinate descent*, and we illustrate it in Example\
    \ 5.4.\n\nIt can be shown that the cost function in (5.26) is convex. Only convexity\
    \ is not sufficient to guarantee that coordinate descent will find its (global)\
    \ minimum, but for $L^1$-regularized cost function (5.26) we can show that coordinate\
    \ descent actually finds the (global) minimum. In practice we know that we have\
    \ found the global minimum when no parameters have changed after such a full \"\
    sweep\" of the parameter vector.\n\nIt turns out that coordinate descent is a\
    \ very efficient method for $L^1$-regularized linear regression (5.26), and many\
    \ updates will simply set $\\theta_j=0$ due to the sparsity of $\theta$. This\
    \ makes the algorithm fast. For most machine learning problems it can, however,\
    \ not said that coordinate descent is the preferred method. We will now have to\
    \ look at some more general families of optimization methods that are used widely\
    \ in machine learning.\n\n# Example 5.4: Coordinate descent\n\nWe apply coordinate\
    \ descent to the objective functions from Example 5.3 and show the result in Figure\
    \ 5.6. For coordinate descent to be an effective alternative, closed-form solutions\
    \ for updating one parameter at a time, similar to (5.28), have to be available.\n\
    \n![](img/9c84a60f9e70ea0bf5c7c51ae709df3e_97_0.png)\n\nFigure 5.6 shows how the\
    \ parameters are updated in the coordinate descent algorithm, for two initial\
    \ parameter vectors (blue and green trajectory, respectively). It is clear from\
    \ the figure that only one parameter is updated each time, which gives the trajectory\
    \ a characteristic shape. The obtained minimum is marked with a yellow dot. Note\
    \ how the different initializations lead to different (local) minima in the non-convex\
    \ case (right panel).\n\n# Gradient descent\n\nIn many situations we cannot use\
    \ closed-form formulations, but we do have access to the value of the objective\
    \ function as well as its derivative (rather, the gradient). Sometimes we even\
    \ have access to the second derivative (rather, the Hessian). In those situations,\
    \ it is often a good idea to use a *gradient descent method*, which we will introduce\
    \ now, or *Newton's method* that we will discuss later.\n\nGradient descent can\
    \ be used for learning parameters $\\theta$ of high dimension when the objective\
    \ function $j(\\theta)$ is such that it is possible to compute. Let us therefore\
    \ consider the parameter learning problem\n\n```\n$$\\hat{\\theta} = \\arg\\min\
    \ j(\\theta) \\quad (5.29)$\n```\n\n(even though gradient descent can be used\
    \ for parameters as well). We assume that\n\n> $9This assumption is primarily\
    \ mainly for the theoretical discussion. In practice, there are successful examples\
    \ of gradient descent being applied to functions not differentiable everywhere,\
    \ such as neural networks with ReLU activation functions (Chapter 6)."
