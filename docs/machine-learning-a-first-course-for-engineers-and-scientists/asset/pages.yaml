  md: '# 2.2 A distance-based method: k-NN


    as accurate predictions $f(x)$ as possible (measured in some appropriate way)
    for a wide range of possible test inputs $x^{*}$. We say that we are interested
    in methods that generalize well beyond the training data.

    A method that generalizes well for the music example above would be to correctly
    tell the artist of a new song was not in the training data (assuming that the
    new song is one of the three that was present in the training data, course). The
    ability to generalize to new data is a key concept of machine learning. It is
    not difficult to construct models or methods that give accurate predictions they
    are only evaluated on the training data (see an example in the next section).
    However, if the model is able to generalize then the predictions improve when
    the model is applied to new test data points, then the model is of little use
    for making predictions. If that case we say the model is overfitting to the training
    data. We will illustrate the overfitting of a specific machine learning model
    in the next section and in Chapter 4 we will return to this concept using a more
    general and mathematical approach.


    # 2.2 A distance-based method: k-NN


    It is now time to encounter our first machine learning method. We will start with
    the relatively simple k-nearest neighbors (k-NN) method, which can be used for
    regression and classification. Remember that the setting is that we have training
    data $\{(x_{i}, y_{i})\}_{i=1}^{n}$ which consists of $n$ points with input $x_{i}$
    and output $y_{i}$. We then want to construct a prediction $f(x)^{*}$ for what
    we believe is the output $y^{*}$, for a new $x^{*}$ which we have not seen previously.


    # The k-nearest neighbors method


    Most supervised learning methods are built on the intuition that if the test data
    point $x^{*}$ is close to training data point $x_{i}$, then the prediction $f(x)^{*}$
    should be close to $y_{i}$. This is a general idea, but one simple to implement
    it in practice is the following: first, compute the Euclidean distance between
    the test input and all training inputs, $\|x - x_{i}\|$; for $i = 1, \dots, n$;
    find the data point $x_{i}$ with the shortest distance to $x^{*}$ and use its
    output as the prediction, $f(x)^{*} = y_{i}$.


    This simple prediction method is referred to as 1-nearest neighbor. It is not
    complicated, but for most machine learning methods of interest it is so simplistic.
    We can rarely say for certain what the output value will be. Mathematically, we
    then handle this by declaring $y$ as a random variable. That is, we consider the
    data as noisy, meaning it is affected by random errors referred to as noise. From
    this perspective, the shortcoming of 1-neighbor is that the prediction relies
    only on one data point from the training data.

    To improve the 1-nearest neighbor method we can extend it to use a set of $k$
    nearest neighbors instead. Normally we define the set $N_{k}(x) = \{x_{i} : x_{i}
    \text{ is one of the } k \text{ nearest training points closest to } x\}$ and
    aggregate the information from them to make the prediction. For regression we
    take the average of all $y_{i}$ for $x_{i} \in N_{k}(x)$ and for classification
    we take the majority vote. We illustrate the k-nearest neighbors (k-NN) method
    by Example 2.3 and summarize by Method 2.

    Method that explain using data predictions are made are called nonparametric,
    which is in contrast with parametric methods, where the prediction is given by
    some function (model), governed by a fixed number of parameters. The training
    data used is to learn the parameters in an initial training phase, but once the
    model has learned the data can be discarded as it is used only when making predictions.
    We will introduce parametric modeling in Chapter 3.


    > The Euclidean distance between a test point $x^{*}$ and a training data point
    $x_{i}$ is $\|x - x_{i}\| = \sqrt{(x_{1}-x_{i,1})^{2} + \dots + (x_{d}-x_{i,d})^{2}}$.


    > Ties can be handled in different ways, by a coin-flip, or by returning all the
    vote to the user who needs to decide what to do with it.


