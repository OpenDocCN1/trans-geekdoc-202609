  md: "# 4.5 Additional tools for evaluating binary classifiers\n\nproblematic to\
    \ predict an infected patient as healthy, then vice versa.\nTo start with, the\
    \ confusion matrix offers a great opportunity to explicitly inspect the false\
    \ negatives and positives in a more explicit fashion. however, sometimes it be\
    \ useful to summarize the performance into a single number. For that purpose the\
    \ misclassification rate is not very helpful; in severely imbalanced problem it\
    \ can for instance a useless classifier that predicts always -1 or over realistically\
    \ used.\n\nFor imbalanced problems where the negative class y = -1 is the most\
    \ common class, the $F_1$ score is therefore preferable over the misclassification\
    \ rate (or accuracy). The $F_1$ score summarizes the precision and recall by their\
    \ harmonic mean.\n\n```\n$F_1 = \\frac{2 \\text{ precision - recall}}{\\text{precision\
    \ + recall}} \\quad (4.24)\n```\n\nwhich is a number between zero and one).\n\
    For asymmetric, however, the $F_1$ score is not sufficient since it does not weigh\
    \ in the preference of having one type of error considered more than the other.\
    \ For that purpose a generalization of the $F_1$ score, namely the $F_\beta$ score,\
    \ can be used. The $F_\\beta$ score weight together precision and recall by considering\
    \ recall $\\beta$ times as important.\n\n```\n$F_\\beta = \\frac{(1 + \\beta^2)\
    \ \\text{ precision - recall}}{\\text{precision + recall}} \\quad (4.25)\n```\n\
    \nMuch like the misclassification rate might be misleading for imbalanced problems,\
    \ the ROC curve might also be misleading for such problems. The precision-recall\
    \ curve can (for imbalanced problems where y = -1 is the most common class) be\
    \ better. As the name suggests, precision-recall curve plots the (TP*, a large\
    \ value is) the recall (TP/P, a large value is) for all values of $r \\in [0,\
