- pgno: 95
  md: "# 5 Learning parametric models\n\n# 5.4 Parameter optimization\n\nMany supervised\
    \ learning methods, linear and logistic regression, involves one (or more) optimization\
    \ problems, such as (3.12), (3.35) or (5.26). A machine learning engineer needs\
    \ to be familiar with the main strategies for how to solve optimization problems\
    \ fast. Starting in the optimization problems from linear and logistic regression,\
    \ we will introduce the idea behind the optimization methods commonly used in\
    \ machine learning. This section only gives a brief introduction to optimization\
    \ theory and, for example, we will discuss unconstrained optimization problems.\n\
    \nOptimization is about finding the minimum or maximum of an objective function.\
    \ Since the maximization problem can be formulated as minimization of the negative\
    \ objective function, we can limit ourselves to minimization without loss of generality.\n\
    \nThere are primarily two ways in which optimization is used in machine learning:\n\
    \n+   1. For training a model by minimizing the cost function with respect to\
    \ the model parameters $\theta$. In this case the objective function corresponds\
    \ to the cost function $J(\theta)$, and the optimization variables correspond\
    \ to the model parameters.\n\n+   2. For tuning hyperparameters, such as the regularization\
    \ parameter $\\lambda$. For instance, by using a hold-out validation dataset (Chapter\
    \ 4) we can select $\\lambda$ to minimize the hold-out validation error $E_{hold-out}$.\
    \ In this case, the objective function is the validation error, and the optimization\
    \ variables correspond to hyperparameters.\n\nIn the presentation we will use\
    \ $\theta$ to denote a general optimization variable, but keep in mind that optimization\
    \ can also be for selecting hyperparameters.\n\nAn important advantage of convex\
    \ functions is that for convex optimization it is good advice to spend some extra\
    \ effort to consider whether a non-convex optimization problem can be re-formulated\
    \ into a convex problem (which sometimes, but not always, is possible). The most\
    \ important property of a convex function, for this discussion, is that a convex\
    \ function has a unique minimum, and no other minima. Examples of convex functions\
    \ are the cost functions for logistic regression, linear regression and $L^1$-regularized\
    \ linear regression. An example of non-convex functions is the cost function for\
    \ a deep neural network. We illustrate by Example 5.3.\n\n> Example 5.3: Example\
    \ of objective functions\n\nFigure 5.4 contains examples of what an objective\
    \ function can look like.\n\n![](img/9c84a60f9e70ea0bf5c7c51ae709df3e_95_0.png)\n\
    \nFig. 5.4 Both examples are functions of a two-dimensional parameter vector $\t\
    heta = [\theta_1, \theta_2]^T$. The left one is convex and has a finite global\
    \ minimum, while the right is non-convex and has three local minima (of which\
    \ one is the global minimum). We will in the following illustrate these objective\
    \ functions using contour plots, as shown in Figure 5.5.\n\n> $^bThe minimum does,\
    \ however, not have to be finite. The exponential function, for example, catches\
    \ its minimum in $-\\infty$. Convex is a relatively strong property, and non-convex\
    \ functions may have only one minimum.\n\nDraft (April 30, 2021) of Machine Learning\
    \ - A First Course for Engineers and Scientists. http://mlbook.org\n\n96 *Andreas\
    \ Lindholm, Nils Wahlström, Fredrik Lindstedt, and Thomas B. Schön. 2021."
  merge: -1
