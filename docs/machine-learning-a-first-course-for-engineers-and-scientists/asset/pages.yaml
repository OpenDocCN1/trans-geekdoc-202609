    \ the standard deviations of $p(f(x_*)|y)$ and $p(y_*|y)$ in case.\n\n# Connection\
    \ to linear regression\n\nThe main feature of the Bayesian approach is that it\
    \ provides a full distribution $p(\\theta|y)$ over the parameters $\theta$, rather\
    \ than a single point estimate $\\hat{\theta}$. There is, also an interesting\
    \ connection between the Bayesian approach and regression. We will make this concrete\
    \ by considering the posterior $p(\\theta|y)$ from Bayesian regression and the\
    \ point estimate $\\hat{\theta}_2$ from $L^2$-regularized linear regression with\
    \ squared error. We then extract the *maximum a posteriori* (MAP) point estimate\
    \ $\\hat{\theta}_{MAP}$ from the posterior $p(\\theta|y)$. The MAP estimate is\
    \ the value of $\theta$ for which the posterior reaches its maximum,\n\n```\n\
    $$\\hat{\theta}_{MAP} = \\arg_{\\max\\theta} p(\\theta|y) = \\arg_{\\max\\theta}\
    \ p(y|\\theta)p(\\theta) = \\arg_{\\max\\theta} [ln p(y|\\theta) + ln p(\\theta)]$$\
    \ \\quad (9.13)\n```\n\nwhere the second equality follows from the fact that $p(\\\
    theta|y) \\propto p(y|\\theta)p(\\theta)$ and that $p(y)$ does not depend on $\\\
    theta$. Here that $L^2$-regularized linear regression can be understood using\
    \ the cost function (3.48),\n\n```\n$$\\hat{\theta}_2 = \\arg_{\\max\\theta} [ln\
    \ p(y|\\theta) + \\lambda ||\\theta||^2]$$ \\quad (9.14)\n```\n\nwith regularization\
    \ parameter $\\lambda$. When comparing (9.14) to (9.13), we see that if $p(\\\
    theta) \\propto e^{-|\\theta||^2}$, the MAP estimate is indeed the case for some\
    \ value of $\theta$ in (9.9). This connection between MAP estimates and maximum\
    \ likelihood estimates holds that regularization is proportional to the log of\
    \ the prior. If, for example, we chose to use a Laplace prior, the MAP estimate\
