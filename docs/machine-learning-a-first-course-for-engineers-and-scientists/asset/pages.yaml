    Once the parameters have been learning, the resulting model is capable of predicting
    a different mean and a different variance for the output y, depending on the value
    of the input variable x.^5

    Other situations that could be modeled using a direct likelihood model in a similar
    way include multimodality and truncated data. As long as the modeler can couple
    with a reasonable likelihood, a distribution that could have generated the data
    under study, the negative log-likelihood can be used to learn the model in a systematic
    way.


    # Strictly proper loss functions and asymptotic minimizers


    As mentioned earlier the asymptotic minimizer of a loss function is an important
    theoretical concept for understanding its properties. The asymptotic minimizer
    is the model which minimizes the cost when the number of training data $n \to
    \infty$ (hence the name asymptotic). To formalize this, assume that the model
    is expressed in terms of a function $f(x)$. As we have seen this captures not
    nothing, but also through the margin mechanism. The asymptotic minimizer $f^*(x)$
    of a loss function $L(y, f(x))$ is defined as the function that minimizes the
    expected


    ```

    $$f^*(x) = \arg\min_f \mathbb{E}[L(y, f(x))]$

    ```


    There are couple of things to note about this expression. First, we stated that
    the asymptotic minimizer is obtained as the solution to the objective (5.4) as
    $n \to \infty$, but this has been replaced by an expected value. This is motivated
    by the law of large numbers stipulating that the cost (5.4) will converge to the
    expected lost as $n$ grows, and the latter is more convenient to analyze mathematically.
    Note the expected value is taken with respect to a true data distribution probability
