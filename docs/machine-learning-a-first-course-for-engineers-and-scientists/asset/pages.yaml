    **Figure 4.3:** Behavior of $\hat{E}_{train}$ and $\hat{E}_{new}$ for many supervised
    machine learning methods, as a function of model complexity. We have not made
    a formal definition of complexity, a rough proxy is the number of parameters that
    are learned from the data. The difference between the two curves is the generalization.
    The training error $\hat{E}_{train}$ decreases as the model complexity increases,
    whereas the new data error $\hat{E}_{new}$ typically has a U-shape. If the model
    is so complex that $\hat{E}_{new}$ is larger than it had with a less complex model,
    the term *overfit* is commonly used. Somewhat less is the term *underfitting*
    for the opposite situation. The level of model complexity gives the minimum $\hat{E}_{new}$
    (at the dotted line) could be called a balanced fit. When we, for example, cross-validation
    to select hyperparameters (that is, tuning the model complexity), we are searching
    for a balanced fit.


    The generalization gap is the difference between the expected performance on training
    data and the expected performance ''production'' on new, previously unseen data.
    With the decomposition of $\hat{E}_{new}$ into


    ```

    $\hat{E}_{new} = \hat{E}_{train} + generalization gap,$ (4.11)

    ```


    we also have an opening for digging deeper and to understand what effects $\hat{E}_{new}$
    has in practice. We will refer to (4.11) as the *training–generalization gap decomposition*
    of $\hat{E}_{new}$.


    # ### What affects the generalization gap


    The generalization gap depends on the method and the problem. Concerning the method,
    one can typically say that the more a method adapts to training data the larger
    the generalization gap. A theoretical framework for how a method adapts to training
    data is given by the so-called Vapnik-Chervonenkis (VC) dimension. From the VC
    dimension framework, probabilistic bounds on the generalization gap can be derived,
    but those are unfortunately not conservative, and we will not pursue that approach
    further. Instead, if we use the term model complexity or *model flexibility* which
    we mean the ability of a method to adapt to patterns in the training data. A model
    with high complexity (such as a fully connected neural network, deep trees and
    k-NN with $k$ small) can describe complex input-output relationships, whereas
    a model with low complexity (such as logistic regression) is less flexible in
    what it can describe. For parametric models, the model complexity is related to
    the number of learnable parameters, but is also affected by regularization techniques.
    As we come back later, the idea of model complexity is an oversimplification and
    does not capture the full nature of various supervised machine learning methods,
    but it nevertheless carries some intuition.


    Typically, higher model complexity implies a larger generalization gap. Furthermore,
    $\hat{E}_{train}$ decreases as the model complexity increases, whereas $\hat{E}_{new}$
    typically attains a minimum for some intermediate


