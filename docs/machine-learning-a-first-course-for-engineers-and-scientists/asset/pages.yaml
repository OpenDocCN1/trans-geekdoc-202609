    # 3.3 Polynomial regression and regularization


    In comparison to k-NN and decision trees studied in Chapter 2, linear and logistic
    regression might appear to be rigid and non-flexible models with their straight
    lines (such as Figures 3.1 and 3.5). However, both models are able to adapt to
    the training data if the input dimension p is large in relation to the number
    of data points n.


    A common way of increasing the input dimension in linear and logistic regression,
    which we discuss thoroughly in Chapter 8, is to make a nonlinear transformation
    of the input. A simple nonlinear transformation is to replace a one-dimensional
    input with itself raised to different powers, which makes the linear regression
    model a polynomial


    ```

    y = \theta_0 + \theta_1x + \theta_2x^2 + \theta_3x^3 + \dots + \varepsilon.

    ```


    This is called polynomial regression. The same polynomial expansion can be applied
    also to the expression for logistic regression. If we let $x_1 = x$, $x_2 = x^2$
    and $x_3 = x^3$, this is a linear model (3.32) with input $x = [1, x^2, x^3]$,
    but we have “lifted” the input from being one-dimensional ($p=1$) to three-dimensional
    ($p=3$). Using nonlinear transformations can be very useful in practice, but it
    effectively increases $p$ and we can easily end up overfitting to the noise—rather
    than interesting patterns—in the training data, as in this example.


    > Example 3.5: Stopping distances with polynomial regression


    We return to Example 2.2, but this time we added the squared sum as an input and
    thereby use a 2nd order polynomial in linear regression. This gives the new parameters
    (compared to Example 3.1)


    | X: | 4.0 | 4.0 |

    |---|---|---|

    | 1 | 16.0 | 8.0 |

    | 4.9 | 24.0 | 8.0 |

    | 5 | 25.0 | 8.0 |

    | 19.6 | 1568.2 | 134.0 |

    | 39.7 | 1576.1 | 110.0 |


    ```

    X = \begin{bmatrix} 1 \ x_1 \ x_2 \end{bmatrix} y = \theta^T X \quad (3.47)

    ```


    and when we insert them into the normal equations (3.13), the new parameters estimate
    are $\theta_0=1.58$, $\theta_1=0.42$ and $\theta_2=0.07$. (Note that also $\theta_0$
    and $\theta_1$ change, consider Example 3.2).

    In a completely analogous way we also learn a 10th order polynomial, and we illustrate
    it all in Figure 3.7.'
