    \ that $E_{new} = \\sigma^2 + \text{bias}^2 + \text{variance}$, and allowing ourselves\
    \ to write $E_{new} - E_{train} = generalization gap, we have\n\n```\n$generalization\\\
    \ gap \\ge variance, \\quad (4.23a)$\n$$E_{train} \\ge \\text{bias}^2 + \\sigma^2.\
    \ \\quad (4.23b)$$\n```\n\nThe assumptions in this derivation are not met in practice,\
    \ but it gives us some rough idea. For $E_{new}$ is obtained. As we discussed,\
    \ the choice of method is crucial for $E_{new}$. The one-dimensional scale in\
    \ Figure 4.8 and the notion of a bias-variance tradeoff is a simplified picture;\
    \ decreased bias does not always increased variance, and vice versa. However,\
    \ to contrast the decomposition of $E_{new}$ into training error and generalization\
    \ gap, the bias and variance decomposition can show why $E_{new}$ decreases for\
    \ different methods: sometimes, the superiority of one method over other can be\
    \ attributed to either a lower bias or a lower variance.\n\nA sample (and useless)\
    \ way to increase the variance without decreasing the bias in linear regression,\
    \ is to first alter the parameters using normal equations and then add zero-mean\
    \ random noise to them. The error noise does not affect the bias, but increases\
    \ the variance and leaves the average model $\\hat{f}$ unchanged. This of training\
    \ linear regression would be pointless in practice since it increases $E_{new}$,\
    \ but it is a clear clear.) It illustrates the fact that increased variance does\
    \ not automatically leads to decrease bias.\n\nA much useful way of dealing with\
    \ bias and variance is the meta-method called bagging, discussed in Chapter 7.\
    \ It makes of several copies (an ensemble) of a base model, each trained on a\
    \ slightly different version of the training dataset. By bagging averages over\
    \ many base models, it reduces the variance, but the bias remains unchanged. By\
    \ bagging instance the base model, the variance is decreased without significantly\
    \ increasing the bias, in often resulting in a decrease in $E_{new}$.\n\nTo conclude,\
    \ the world is more complex than the one-dimensional model complexity used in\
    \ Figure 4.3 and 4.8, which we illustrate by Example 4.4.\n\n> Time to reflect\
    \ 4.4: Can you modify linear regression such that the bias increases, without\
    \ decreasing the variance?\n\n⁶Since neither $\\hat{f}(x_*)$ nor $y_*$ depends\
    \ on the training data $(x_i, y_i)_{i=1}^n$ we can use $(x_i, y_i)_{i=1}^n$ for\
    \ approximating the integral.\n\nThis material will be published by Cambridge\
