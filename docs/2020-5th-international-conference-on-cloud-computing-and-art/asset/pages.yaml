    **Abstract—** Data technologies connect several areas such as Healthcare, Finance,
    Manufacturing, Transport, and E-Commerce. They play an indispensable role in the
    financial sector, especially banking services are impacted by the digitalization
    of services and the element of connectivity. The use of data and the increasing
    number of fraudsters generate different issues that concern the banking sector.
    Unfortunately, these issues obstruct the performance of Fraud Control Systems
    and fraudsters abuse the transparency of online payments. Thus, financial institutions
    also use credit card transactions and allow their customers. To reach this goal,
    they need more relevant fraud detection techniques that can identify more fraudulent
    transactions and decrease frauds. The purpose of this article is to define the
    techniques and challenges of frauds related to fraud detection, in the banking
    sector, and the existing solutions by machine learning techniques.


