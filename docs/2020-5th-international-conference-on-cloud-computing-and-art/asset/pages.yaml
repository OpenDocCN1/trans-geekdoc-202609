    Credit Card Fraud detection highly impacts the financial area. To avoid fraud
    losses, banks institutions have tried to develop new and advanced fraud detection
    techniques. Hence, this paper aimed to present the theoretical aspects of credit
    card detection and provide comparative studies of the existing machine learning
    techniques used to deal with credit fraud.


    It is concluded from this analysis that supervised algorithms are much used than
    other types of techniques like Logistic Regression, Random Forest, and SVM.


    As perspectives, our work will focus on the level machine learning algorithms
    identified in this paper and analyze data engineering techniques, in order to
    propose our contribution that can handle the imbalanced data, the'
