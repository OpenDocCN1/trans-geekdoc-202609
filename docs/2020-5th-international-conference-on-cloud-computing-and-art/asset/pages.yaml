    # E. Synthesis and discussion


    To identify the most used machine learning techniques that handle and solve the
    issues of credit fraud detection, we analyzed and compared current research contributions
    using various criteria.


    As a purpose, in the current literature, the used machine learning techniques
    are supervised techniques like Logistic Regression which has high accuracy and
    works with linear data, SVM that reduce the time of detection, Random Forest and
    Neural Network which improve the classification rates (FPR).


    +   - A lack of publicly available datasets: The majority of cases in this comparative
    study are based on one specific data set from the Kaggle platform

    - Large Datasets: Credit Card Fraud Detection System works fast and efficiently
    with one big data

    - The real-time processing is not implemented in most of machine learning techniques:
    When the model is applied in a real-time context, the credit card fraud detection
    may not be adaptable to any new attacks of fraud.


