    # I. INTRODUCTION


    Nowadays, various economic institutions and financial companies use big data technologies
    in their electronic commerce to help their customers making online transactions
    from anywhere and wherever they are. There are different categories of systems,
    such as Credit card systems, payment systems [3] that are used by legitimate users
    and fraudsters. Unfortunately, more systems are used more frauds are generated
    day by day, especially in the banking sector. Then, the fraud prevention systems
    (FPSs) are used to protect the customers and the companies from these electronic
    crime issues.


    However, with the intelligence of fraudsters and their adaptability to these systems,
    banks and customers faced more issues and challenges compared to the past. The
