    # B. Financial Fraud Detection


    In general, financial fraud can be identified when a fraudster takes more or financial
    assets from another through one deception or criminality.


    Therefore, generically and breaches have an effect on the reputation of customers
    and their confidential information stored by financial institutions, which can
    provide losses and a damaged reputation [11].


    Financial fraud affects various sectors, especially in the banking sector. Banking
    fraud can be classified as follows [6][12]:


    +   - Money Laundering: It is an illegal action used to appear the amounts of
    money generated by criminal activities to a legitimate source.


    +   - Mortgage Fraud: It is also used to obtain a mortgage loan. Specifically,
    it occurs when a homebuyers tries to manipulate significant information in the
    process of applying for a mortgage to property.


    +   - Credit card fraud: It occurs when fraudsters make illegal operations in
    credit card transactions. It can be presented in different activities, losing
    the credit card or having it, stealing the confidential information of a credit
    card (i.e. card-not-present fraud).


    # C. Credit Card Fraud Detection


    Credit Card Fraud Detection is one of the important financial fraud detection
    techniques because it has generated a huge amount of losses more than others.
    The prevention measures used to combat the credit card frauds, but these are not
    effective enough to reduce the impact of such frauds as Fraud Detection Systems
    (FDS).


    Therefore, another type of Fraud Detection System (FDS) is identified to be more
    effective in detecting fraud in credit card transaction.


    Some issues hinder the development and progress of an efficient FDS and lead to
    negative effects like bias, alerts, and low detection. These issues and challenges
    are based on Big Data V''s characteristics like:


    +   - Volume detection: The data in the Credit Fraud Detection System (CFDS) is
    highly used and the number of attributes to define the behavior of a cardholder
    is around 25 attributes on average. So, the need for reduced data is important
    in reducing the transaction time and the complexity in


    processing. To fix this, various data reduction techniques are used like dimensionality
    reduction (PCA) for selecting the most relevant attributes and novelty approaches
    for aggregating credit transactions [3]:


    +   - Velocity detection: This issue occurs when we look to detect anomaly by
    using CCFDS on big data technologies. Different algorithms are used with BOAT
    (Bayesian Online Analysis Test for Construction) algorithm that detects time and
    shift of new transactions [15]:


    +   - Veracity detection: The cardholders change their activities over time and
    by several reasons. As fraudsters'' attacks evolve, the Credit Card Fraud System
    should be more adaptable and efficient to these types of news.


    +   - Value Detection: Credit transactions contain many fraudulent less than others,
    which skewed class distribution to the imbalanced data. Supervised approaches
    are the most impacted techniques by this type of issue because the training of
    the model are too fit to the majority and not the minority class (i.e fraudulent
    transactions). Many modeling and training errors are produced and affect Credit
    Card Fraud System performance.


    +   - Variety data: Data refers to various types of credit data sources. Therefore,
    banking institutions might have stored data in selber database formats that are
    accurate by their own unique model. This variety can also be in the diversity
    of processes developed by fraudsters to make.


    # III. DETECTION TECHNIQUES


    To build an accurate Credit Fraud Detection System, we must follow several:


    +   1) Parameterization stage: This presents the initial stage to collect the
    credit card transaction data, loading into the appropriate database system and
    preprocessing it into a format without issues.


    +   2) Training stage: This stage involves the modeling and processing of the
    fraud detection system. There are different machine learning algorithms and data
    mining techniques that can be applied, depending on the nature of the data.


    +   3) Detection stage: When the training stage is achieved and the model is available,
    it is evaluated based on criteria to have the most efficient technique in detection
    rates.'
