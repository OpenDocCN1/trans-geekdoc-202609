- "## 联邦学习手册：进展、应用与机遇\n\n\n\n![](img/coverpage.jpg)\n\n![Cover: Handbook on FEDERATED\
  \ LEARNING Advances, Applications and Opportunities, edited by Saravanan Krishnan,\
  \ A. Jose Anand, R. Srinivasan, R. Kavitha, S. Suresh, published by CRC Press](img/coverpage.jpg)\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n## 前言\n\n联邦学习（FL）是一种分布式机器学习模型，目前已应用于许多领域。它由\
  \ Google Inc 和 Apple Inc 等公司首创，作为一种在不牺牲隐私的前提下，利用分布式数据集创建性能更优机器学习模型的技术。目前，Apple Inc\
  \ 利用联邦学习提升 Face ID 和 Siri 的准确性，Google 则利用它为 Gboard 的键盘预测提供支持。其解决传统 ML 模型引发的隐私问题的能力，使其极具吸引力。因此，联邦学习目前是\
  \ AI 领域最引人入胜、最具前景的研究方向之一。它近期改变了我们收集、分析和使用数据的方式。联邦学习在工业 4.0、医疗保健和机器人技术等领域有着广泛的应用。本书从各个方面为联邦学习提供了全面的方法论。\n\
  \n本书包含四个部分，分别为：概念与类型、学习过程与优化、工具与技术、应用与用例。本书的目的是结合实时用例，详细阐述各种应用中的概念、工具和技术。\n\n第 1\
  \ 部分讨论联邦学习的定义、架构以及联邦学习框架的应用，并对现有工作进行了全面综述。\n\n第 2 部分提供了关于 FL 在数据安全、数据多样性、实时持续学习、硬件效率等方面优势的章节。然而，当某些参与者不被认为完全诚实时，会带来新的隐私风险，如成员推理攻击和数据投毒攻击。此外，自私的参与者可能会获取他人的集体数据，却隐瞒甚至提供关于其本地数据的虚假信息。因此，现代隐私和公平机制已被纳入\
  \ FL 系统，相关章节也讨论了区块链概念。它解决了数据隐私、数据安全、数据访问等方面的挑战。在第 3 部分，章节从技术角度探讨了联邦强化学习的演变，并强调了其相较于以往强化学习算法的优势。\n\
  \n第 4 部分讨论了一种学习范式，旨在通过协作训练算法而不交换数据本身，来解决数据治理和隐私问题。它近期因在医疗保健领域的应用而受到关注，相关章节对此进行了讨论。FL\
  \ 使协作获取洞察成为可能（例如以共识模型的形式），而无需将患者数据移出其所在机构的防火墙之外。本书从各个方面为联邦学习提供了全面的方法论。\n\n## 第 1\
  \ 章 联邦学习方法与分类简介\n\n*Shashikiran Venkatesha*^(¹)\n\nEmail: lramanathan@vit.ac.in\n\
  \n### 1. 动机与简介\n\n正如近期所观察到的，推荐系统、自然语言处理、计算机视觉和自动语音识别等不同领域的应用与工具的进步，是机器学习（ML）算法快速发展的结果\
  \ [[1]](#ch1.xhtml#ref1_1)、[[2]](#ch1.xhtml#ref1_2) 和 [[3]](#ch1.xhtml#ref1_3)。由深度学习（DL）调优的\
  \ ML 平台所取得的强大且有利的成果，得益于从数据存储库（也称为“数据仓库”或“数据中心”）获取的海量合法数据或“大数据” [[2]](#ch1.xhtml#ref1_2)、[[3]](#ch1.xhtml#ref1_3)\
  \ 和 [[4]](#ch1.xhtml#ref1_4)。DL 平台执行的各项任务的终极性能有时可与人类认知卓越性相媲美。例如，利用数十亿张图像训练的、经 DL\
  \ 调优的人脸识别系统，能够产生有效且可商业化的成果。例如，从 Instagram 获取的 35 亿张图像 [[5]](#ch1.xhtml#ref1_5) 被用于名为\
  \ Detectron 的目标检测系统训练，这是一个可扩展分布式系统框架的经典示例，也是 Facebook 不可或缺的一部分。软件架构师、ML 研究人员和开发人员面临许多挑战，例如创建、开发、运营和维护分布式计算框架。这些挑战枚举如下。\n\
  \n*   **数据所有权**：在 21 世纪，人们在涉及其数据及其在构建 ML 平台中的使用时，已意识到自己的所有权。在推荐服务等现代 ML 驱动产品中，对于消费者购买模式和汇款方式的所有权主张存在模糊地带；这与产品数据和供应商交易不同，后者的所有权由服务提供商主张。\n\
  \n*   **遵守数据保护法案**：2018 年，欧盟通过了名为“通用数据保护条例”（GDPR）的法案，这是数据保护法律与合规的一个著名范例 [[6]](#ch1.xhtml#ref1_6)。2020\
  \ 年，美国加利福尼亚州颁布的《加利福尼亚消费者隐私法案》（CCPA）为数据保护和使用提供了法律框架 [[7]](#ch1.xhtml#ref1_7)。GDPR\
  \ 为数据保护采用的基本准则，在发生私人数据泄露时提供法律救济。\n\n\n\n\n# 分布式系统中的数据隐私与保密性挑战\n\n## 数据隐私与保密性\n在分布式系统中，消费者隐私和数据保密性已成为设计\
  \ ML 应用的首要问题。薄弱的政府和商业机构为达到其目的而操纵或使用私人数据。基于互联网的跨国公司未能保护用户的私人数据，并因“罚款”形式受到高等司法机构的惩处。基于互联网的公司因以下原因在法庭上受到惩处：\n\
  - 发送未经请求的信息\n- 网络钓鱼\n- 不道德的数据交换\n\n## 独立数据仓库中的数据\n文档（财务和医疗部门的记录）中可能影响政府机构和商业机构决策的敏感或易感信息，迫使数据保持隔离状态，或作为由数据中心所有者管理的独立数据孤岛\
  \ [[8]](#ch1.xhtml#ref1_8)。\n\n## 缺乏对协作模型收益的理解\nML 组织遭受数据分散之苦的另一个相关原因，是缺乏对协作模型收益进行量化的理解。例如，两个组织尝试通过使用医学图像进行训练来构建协作\
  \ ML 模型。在遗留系统中，数据从一个组织传输到另一个组织，数据所有者在数据离开组织的影响范围时，就会失去对传输数据的控制权。缺乏一种有形的衡量标准，来分配为构建更好的联合\
  \ ML 模型做出贡献的参与者的收益，这是 ML 研究人员面临的一个主要挑战。\n\n然而，在最近一段时间里，物联网设备的计算能力和存储容量已随时间增长。软件开发人员和架构师利用数百万设备的计算能力来构建协作模型，从而缓解了上述挑战。\n\
  \n# 1.1 联邦学习是答案\n\n考虑到上述必要性，（a）利用设备增强的计算能力，（b）连接执行本地训练模型的设备，以及（c）连接设备协作以构建共识全局学习模型的分布式学习平台，构成了**联邦学习（FL）**。\n\
  \n2016 年，McMahan 等人在边缘-服务器架构中提倡联邦学习，用于聚合部署在手机上的语言模型 [[9]](#ch1.xhtml#ref1_9)、[[10]](#ch1.xhtml#ref1_10)、[[11]](#ch1.xhtml#ref1_11)、[[12]](#ch1.xhtml#ref1_12)。\n\
  \n许多物联网设备或边缘计算设备维护着所有者的私人数据。Google 的键盘系统即 **Gboard** 系统，使用一种名为 **联邦平均算法** 的联邦学习算法。\n\
  \n**Gboard** 执行程序化单词补全，这是一种使用 **FedAvg** 从各种手机聚合模型参数并将用户的单词选择和挑选告知单词预测模型的应用。无数据从手机移动到任何中央服务器，这构成了联邦学习的基础。模型参数或模型本身在任何设备上加密并传输到云端。参与的边缘设备将无法识别其他参与边缘设备的数据，因为模型参数（或模型本身）在服务器端加密并发送到云端。所有加密模型在云端巩固以构建全局模型，网络中的服务器将无法识别边缘计算设备\
  \ [[9]](#ch1.xhtml#ref1_9)、[[10]](#ch1.xhtml#ref1_10)、[[11]](#ch1.xhtml#ref1_11)、[[12]](#ch1.xhtml#ref1_12)、[[13]](#ch1.xhtml#ref1_13)、[[14]](#ch1.xhtml#ref1_14)。加密下的全局模型被更新并下发到云系统边缘的所有参与设备\
  \ [[12]](#ch1.xhtml#ref1_12)、[[13]](#ch1.xhtml#ref1_13)、[[15]](#ch1.xhtml#ref1_15)、[[16]](#ch1.xhtml#ref1_16)。边缘设备中客户的数据不会向其他设备或参与整个通信过程的网络服务器披露。\n\
  \nFL 算法在与科学和工程不同领域相关的各种应用中得到使用或部署。推荐系统、关键词识别、下一个单词预测、智能医疗、智能目标检测以及无人机（UAV）赋能的物联网设备训练是联邦学习应用的几个例子。FL\
  \ 还广泛用于开发可检测洗钱欺诈 [[17]](#ch1.xhtml#ref1_17) 或打击非国家行为体、经纪人和银行机构实施的金融欺诈 [[18]](#ch1.xhtml#ref1_18)\
  \ 的应用。FL 在药物发现 [[19]](#ch1.xhtml#ref1_19)、预测 COVID-19 患者氧气需求 [[20]](#ch1.xhtml#ref1_20)\
  \ 方面的显著应用，引起了全球转化研究人员的关注。在 表 1 中，列出了一些现有的 FL 应用及其贡献者、概念描述和采用的学习模型。现提出一篇文章以促进联邦学习方法的研究。\n\
  \n#### 表 1：联邦学习应用\n\n| 方法名称 | 参考编号 | 概念描述 | 学习模型 |\n| :--- | :--- | :--- | :---\
  \ |\n| **Gboard** | [[21]](#ch1.xhtml#ref1_21) | 线性回归 | 线性模型 |\n| **FL-ranking browser\
  \ history suggestions** | [[22]](#ch1.xhtml#ref1_22) | 支持向量机 | |\n| **Fedner** |\
  \ [[23]](#ch1.xhtml#ref1_23) | 强化学习 | 神经网络模型 |\n| **FedMF** | [[24]](#ch1.xhtml#ref1_24)\
  \ | 矩阵分解 | 线性模型 |\n| **Smart Robotics** | [[25]](#ch1.xhtml#ref1_25) | 强化学习 | 神经网络模型\
  \ |\n| **FCF** | [[26]](#ch1.xhtml#ref1_26) | 协同过滤 | 线性模型 |\n| **Smart object detection**\
  \ | [[27]](#ch1.xhtml#ref1_27) | Kullback-Leibler 散度 | |\n| **FL predicting emoji**\
  \ | [[28]](#ch1.xhtml#ref1_28) | 自然语言处理 | 神经网络模型 |\n| **FL next word prediction**\
  \ | [[29]](#ch1.xhtml#ref1_29) | 自然语言处理 | |\n| **UAV-enabled IoT devices** | [[30]](#ch1.xhtml#ref1_30)\
  \ | 基于 CNN 的长短期记忆（LSTM）模型 | |\n| **FL OOV** | [[31]](#ch1.xhtml#ref1_31) | 自然语言处理\
  \ | |\n| **Fedrec** | [[32]](#ch1.xhtml#ref1_32) | 强化学习 | |\n\n### 2. 联邦学习基础\n\n\
  #### 2.1 机器学习\n\n\n\n# 机器学习阶段\n\n机器学习（ML）可分两个阶段完成：(a) 训练阶段，和 (b) 预测阶段，如图 1 所示。\n\
  \n## 训练阶段\n\n在训练阶段，输入数据向量被送入 ML 模型，模型通过逐步更新将输入向量映射到输出类标签的函数来进行学习。ML 模型中的学习可分为四类：\n\
  \n1.  **监督学习**：试图找出输入数据向量与已知类标签或预期输出值之间的映射函数。随后将该映射函数应用于新的输入数据向量以确定类标签。\n2.  **无监督学习**：类标签或预期输出值事先未知。映射函数试图识别输入数据向量之间的相似性与差异性，并利用相似性度量对它们进行分组。\n\
  3.  **半监督学习**：数据集中大多数输入数据向量未标记，仅少数具有类标签。利用聚类算法推断出大多数数据的类标签。\n4.  **强化学习**：动作的选择以及一段时间内为达成目标或实现目的而返回的奖励，构成了奖励（或映射）函数制定的基础。\n\
  \n## 预测阶段\n\n在预测阶段，训练阶段的输出——称为训练好的模型——被投入使用。训练好的模型接收类标签尚未确定的输入数据向量，并产生称为预测（或类标签）的输出。预测的准确性决定了机器学习算法的效率。\n\
  \n![图 1. 机器学习的训练和预测阶段。](img/fig1_1_B.jpg)\n\n图 1. 机器学习的训练和预测阶段。\n\n## 2.1.1 机器学习的形式化定义\n\
  \n具有输入 `X(x[1], x[2]…, x[n])`、输出 `Y(y[1], y[2], …, y[n])` 且 `w[L]` 为学习参数的函数映射 `F`，在公式\
  \ (1) 中表达了预测值与期望值之间的差距。\n\n(1)\n\n```\n\\arg\\min_{w_L} Loss(X, Y, w_L) = \\| F_{w_L}(X)\
  \ - Y \\|\n```\n\n其中 `Loss` 是在点 `X` 和 `Y` 处的损失函数。目标是使预测值与期望值之间的损失最小化；这构成了所有机器学习算法的基础。\n\
  \n## 2.1.2 机器学习算法的类别\n\n机器学习大体可分为五大类：\n\n### 矩阵分解算法\n\n以矩阵形式呈现的数据元素可能包含隐藏因子或缺失元素，可通过分解来识别。应用包括：利用“用户-项目评分矩阵”[[33]](#ch1.xhtml#ref1_33)和“药物-靶标蛋白矩阵”[[34]](#ch1.xhtml#ref1_34)通过项目评分确定用户偏好的推荐系统，以及创新药物发现。\n\
  \n### 主题模型或统计模型\n\n*   **潜在狄利克雷分布（LDA）**：一种统计方法，生成非结构化文本文档与带有概率值的主题集合之间的映射 [[35]](#ch1.xhtml#ref1_35)。\n\
  *   **朴素贝叶斯分类器**：一种使用监督学习进行训练的概率方法，但与复杂方法相比准确率较低。\n*   **潜在语义分析/索引（LSA/LSI）**：构建主题与文本文档之间基于矩阵的映射以对文档进行分类，假设输入服从高斯分布。\n\
  *   **概率潜在语义分析/索引（PLSA/PLSI）**：针对主题和文本文档等输入采用泊松分布 [[36]](#ch1.xhtml#ref1_36)。\n\n\
  ### 基于规则的机器学习（RBML）算法\n\n`RBML` 算法为给定的输入数据集构建 `If <condition> Then` 规则，每条规则分配问题的一部分\
  \ [[37]](#ch1.xhtml#ref1_37)。与神经网络模型相比，规则简单且易于解释。典型示例包括**决策树**和**关联规则学习**。\n\n*\
  \   **关联规则学习**：通过识别项目或变量之间的关联来构建规则。\n*   **决策树**：遵循规则的层次化表示，分支引导至表示决策或类标签的叶节点。\n\
  \n### 基于随机梯度下降（SGD）的算法\n\n损失函数是一个最小化多变量目标函数，在负梯度（损失函数的一阶偏导数）的引导下向最优点移动。负梯度沿其方向调整模型参数。向最优点移动由学习率控制。由于梯度是在随机选取的输入数据向量上计算的，因此称为随机梯度。这种迭代方法用于寻找损失函数的极小值点。\n\
  \n`SGD` 用于流行的 ML 模型，如**支持向量机（SVM）**、**感知机** [[38]](#ch1.xhtml#ref1_38) 和**人工神经网络（ANN）**。\n\
  \n*   **SVM**：输入数据被映射到 n 维空间；用一个 n-1 维超平面将两组数据点以较大距离分开，从而进行分类。\n*   **感知机**：执行二分类。输入被加权；权重-输入乘积之和与阈值比较以确定类标签。\n\
  *   **ANN**：多层神经元形成网络，相互连接以识别大数据中的复杂特征。层通过加权边连接，激活函数引入非线性。示例包括**生成对抗网络（GAN）**、**卷积神经网络（CNN）**、**深度神经网络（DNN）**和**循环神经网络（RNN）**。\n\
  \n### 进化算法\n\n**遗传算法**基于人类进化设计 [[39]](#ch1.xhtml#ref1_39)。它将决策变量表示为基因型（由 0 和 1 组成的字符串）。每个基因型通过适应度函数进行评估；满足条件的基因型经历交叉和变异以产生新的基因型。新基因型通过适应度函数进行质量测试。仅保留更优的基因型用于繁殖。该过程是迭代的，收敛速度较慢。\n\
  \n#### 2.2 分布式机器学习\n\n在单机上对更大数据集进行训练会增加 ML 算法的运行时间。TB 级的复杂应用可能需要分布式系统中更高程度的并行性和更大的\
  \ I/O 带宽 [[40]](#ch1.xhtml#ref1_40)。并行性可在数据层面（创建不相交的数据片段）或模型层面（相同数据集副本由不同模型部分训练）构想。计算节点拓扑在实现数据并行和模型并行时很重要。并行执行和计算节点间通信必须协同工作，以通过更快的更新实现更快的模型收敛。\n\
  \n##### 2.2.1 数据并行与模型并行\n\n\n\n\n\n## 数据并行与模型并行方法\n\n在**数据并行**方法中，数据集被划分为不相交的子集，其数量等于系统中计算（或工作）节点的数量。相同的机器学习算法用于训练与不同计算节点关联的数据集不相交子集。假设数据在数据集的不相交子集上独立同分布，所有计算节点在不同数据上执行相同的指令。该模型仅产生一个可理解的输出。\n\
  \n在**模型并行**方法中，所有计算节点接收相同的数据集进行训练。但计算节点执行训练模型的不同部分。**数据并行**和**模型并行**如图 2 所示。在程序执行层面，不同指令在不同计算节点上并行执行。并非所有机器学习算法都适用于此模型。或者，允许不同的训练模型在多个计算节点上对同一数据集运行。最后，使用来自各个计算节点的结果构建全局聚合，这种学习形式称为**集成学习**\
  \ [[41]](#ch1.xhtml#ref1_41)。\n\n![Figure 2. Data parallelism and model parallelism.](img/fig1_2_B.jpg)\n\
  \n图 2. 数据并行与模型并行.\n\n### 2.2.2 分布式机器学习的拓扑结构\n\n**全分布式系统**是自主计算节点的网络，它们将最终解决方案汇总在一起。计算节点在决定结果方面不扮演任何特定角色。在**中心化系统**中，中央服务器遵循系统化方法进行结果聚合。结果聚合按层级执行。**树形结构**用于**去中心化系统**，允许跨多个**参数服务器**分片的复制模型或分区模型进行中间结果聚合（如图\
  \ 3 和图 4 所示）。**树拓扑**在分布式机器学习框架中很流行，用于**ALLReduce** [[42]](#ch1.xhtml#ref1_42)在子节点中计算局部梯度并将值传递给其父节点。**环拓扑**在需要最小通信延迟或广播支持较差的系统中很流行。**参数服务器**拥有一组具有共享内存的中心化主计算节点和一组去中心化的工作计算节点。每个参数服务器上的分片存储模型参数。所有客户端采用**键值存储**方法进行读写。参数服务器可能成为单点故障，因为它处理所有通信。\n\
  \n![Figure 3. Topologies for distributed Machine Learning.](img/fig1_3_B.jpg)\n\n\
  图 3. 分布式机器学习的拓扑结构.\n\n![Figure 4. (Contd. from Figure 3) Topologies for distributed\
  \ Machine Learning.](img/fig1_4_10_1_B.jpg)\n\n图 4. (接图 3) 分布式机器学习的拓扑结构.\n\n###\
  \ 2.2.3 分布式机器学习的通信模型\n\n计算（或工作节点）的通信阶段与计算阶段之间的同步意味着更新的准确性、通信延迟和计算时间。由于上述必要性，确定了不同的通信模型。更快速度的准确模型收敛和更快速度的更新可以置于通信模型光谱的两个极端点。**批量同步并行\
  \ (BSP)** [[43]](#ch1.xhtml#ref1_43)、**陈旧同步并行 (SSP)**、**近似同步并行 (ASP)** [[44]](#ch1.xhtml#ref1_44)\
  \ 和**无障碍异步并行** [[45]](#ch1.xhtml#ref1_45)/**全异步并行** [[44]](#ch1.xhtml#ref1_44) 是分布式机器学习生态系统中采用的四种通信模型。**百度\
  \ AllReduce** [[46]](#ch1.xhtml#ref1_46)、**Horovod** [[47]](#ch1.xhtml#ref1_47)、**Caffe2**\
  \ [[48]](#ch1.xhtml#ref1_48) 和 **CNTK** 或 **Microsoft 认知工具包** [[49]](#ch1.xhtml#ref1_49)\
  \ 是基于并行同步模型的分布式 ML 系统的示例。**DistBelief** [[50]](#ch1.xhtml#ref1_50)、**DIANNE** [[51]](#ch1.xhtml#ref1_51)、**TensorFlow**\
  \ [[52]](#ch1.xhtml#ref1_52)、**MXNet** [[53]](#ch1.xhtml#ref1_53)、**Petuum** [[54]](#ch1.xhtml#ref1_54)\
  \ 和 **MXNet-MPI** [[55]](#ch1.xhtml#ref1_55) 分别是并行异步和并行异步/同步分布式 ML 系统的示例。\n\n###\
  \ 2.2.4 挑战述评\n\n**隐私**、**性能**、**容错**和**可移植性**是在可扩展计算架构上部署 ML 算法的瓶颏。像参数服务器这样的通信模型无法确保分布式系统中的隐私。分布式系统不具备任何形式的数据保护法律合规性，且正在各国合法化。\n\
  \n#### 2.3 联邦学习\n\n**联邦学习**是一种协作式 ML 模型，在放置于多个位置的大型数据集上进行训练和构建。它有两个阶段，分别是 (a) **模型训练阶段**，和\
  \ (b) **模型推理阶段**。在模型训练阶段，一个或多个参与者通过为模型训练做出贡献来协作构建 ML 模型，且无需共享数据。在此阶段，参与者间的数据传输不会暴露位置处数据的私密部分。训练模型的实例可通过加密从一个参与者发送给其他参与者，从而保持数据隐私。由多个参与者构建的最终模型性能应可与在单一位置或由位于某站点的单一参与者构建的模型相媲美。在模型推理阶段，训练好的模型接收新数据输入并推导出相应结果。可持续的联邦模型确保为对联合\
  \ ML 模型构建做出贡献的参与者合理分配收益。本节介绍联邦学习的形式化定义、客户端-服务器架构以及联邦学习的点对点架构。\n\n##### 2.3.1 联邦学习的形式化定义\n\
  \n可分离的线性目标函数表示联邦学习中 *P* 个参与者累积损失的代数求和，如公式 2 所示。\n\n(2)\n\n$$\n\\arg\\frac{\\min}{w_{L}}Loss(X,Y,w_{L})\
  \ = \\text{Σ}_{1}^{p}U_{p}Loss_{p}(X,Y,w_{p})\n$$\n\n在公式 (2) 中，*U*[*p*] 表示联邦学习中第\
  \ *P* 个参与者的权重；*w*[*p*] 表示参与者的学习率；目标函数中 *Lp* 损失函数的求和使其成为可分离目标函数。\n\n##### 2.3.2 联邦学习架构\n\
  \n\n\n\n使用 FL 系统构建的应用程序可能包含也可能不包含单点协调计算节点。FL 生态系统中的单点协调计算节点如图 5 所示。协调计算节点被指定为参数服务器。参数服务器将模型的主要未训练实例发送给所有本地参与者。本地参与者使用其本地数据集训练模型，并将模型权重发布到参数服务器。参数服务器执行来自所有参与者的聚合并更新模型。在满足收敛标准之前，FL\
  \ 系统会迭代地重复本地训练和全局模型更新。位于本地参与者站点的原始数据绝不会离开该站点。为避免模型更新泄露，参数服务器与本地参与者之间的数据交换使用同态加密进行加密[[8]](#ch1.xhtml#ref1_8)。如图\
  \ 6 所示，点对点方法也是 FL 系统可行的设计架构。由于缺少参数服务器，计算量增加，这是该方法的缺点。在没有第三方干预的情况下，该方法为参与者之间的点对点通信提供了增强的安全级别。\n\
  \n![图 5. 联邦学习的客户端-服务器模型。](img/fig1_5_B.jpg)\n\n图 5. 联邦学习的客户端-服务器模型。\n\n![图 6. 联邦学习的点对点模型。](img/fig1_6_B.jpg)\n\
  \n图 6. 联邦学习的点对点模型。\n\n##### 2.3.3 联邦学习中的开源项目：简述\n\n许多开源项目正在联邦学习领域以更快的速度开发。表 2 列出了近期发布到公共领域的选定开源框架简述。\n\
  \n表 2 FL 中的开源项目。\n\n| 开源项目 | 算法/库 | 描述 |\n| --- | --- | --- |\n| coMind [[56]](#ch1.xhtml#ref1_56)\
  \ 和 [[57]](#ch1.xhtml#ref1_57) | Fedavg 算法 | TensorFlow 是 coMind 的底层 |\n| TensorFlow\
  \ Federated (TFF) [[58]](#ch1.xhtml#ref1_58) 和 TensorFlow-Encrypted [[59]](#ch1.xhtml#ref1_59)\
  \ | Python 库 | 用于评估隐私保护 ML 算法和高性能计算基准 |\n| Horovod [[47]](#ch1.xhtml#ref1_47), [[60]](#ch1.xhtml#ref1_60)\
  \ | TensorFlow 和 PyTorch 框架 | 使用消息传递接口实现 FL |\n| OpenMined 和 PySyft [[61]](#ch1.xhtml#ref1_61),\
  \ [[62]](#ch1.xhtml#ref1_62), [[63]](#ch1.xhtml#ref1_63) 和 [[64]](#ch1.xhtml#ref1_64)\
  \ | PySyft 库 | 适用于多方计算和同态加密 |\n| LEAF 基准 [[65]](#ch1.xhtml#ref1_65), [[66]](#ch1.xhtml#ref1_66)\
  \ | – | 适用于 FL 领域高端研究人员和产品开发者的框架 |\n\n### 3. 基于数据样本的联邦学习分类\n\n让我们考虑以矩阵`M[i]`形式表示的第`i`个数据所有者的数据集或样本集。数据集的列代表特征，行代表实际数据或样本集。类标签被分配给某些样本。样本空间由`sample\
  \ ID`标识。`A`和`B`用于表示样本集的特征和标签。用于训练的样本集表示为`(A, B, sample ID)`。联邦学习可分为三类，分别为：(a) 纵向联邦学习，(b)\
  \ 横向联邦学习，和(c) 联邦迁移学习。分类的基础是针对特征空间和样本空间的数据样本划分所采用的不同方法。\n\n#### 3.1 纵向联邦学习 (VFL)\n\
  \n它是数据集中样本的基于特征的划分。两组数据可能具有共同的`sample ID`但关联不同的特征，如图 7 所示。考虑国有银行和电子商务公司等商业企业。两个实体可能拥有共同的客户作为其业务客户，但属性不同。银行的业务客户具有信用评级、资本和收支支出等特征，而同一客户在与电子商务企业关联时具有购买行为等不同特征。VFL\
  \ 通过计算损失和梯度并最终聚合，在具有不同特征和类标签空间的样本上训练模型。正式 VFL 表述如公式(3)所示。\n\n![图 7. 纵向联邦学习。](img/fig1_7_B.jpg)\n\
  \n图 7. 纵向联邦学习。\n\n(3)\n\n`A[i] ≠ A[j], B[i] ≠ B[j], SampleID[i] = SampleID[j], ∀\
  \ M[i]M[j], i ≠ j`\n\n#### 3.2 横向联邦学习 (HFL)\n\n它是具有重叠属性或特征的基于样本的划分，如图 8 所示。让我们考虑两组具有共同特征空间但不同样本的数据。考虑两家国有银行，它们可能拥有不同的客户或样本空间。但这两家银行的业务行为有许多共同特征，如表现资产、负债、债券利润和不良资产等。HFL\
  \ 在具有重叠特征的异构样本上构建模型。正式 HFL 表述如公式(4)所示。\n\n![图 8. 横向联邦学习。](img/fig1_8_B.jpg)\n\n\
  图 8. 横向联邦学习。\n\n(4)\n\n`A[i] = A[j], B[i] = B[j], SampleID[i] ≠ SampleID[j], ∀ M[i]M[j],\
  \ i ≠ j`\n\n#### 3.3 联邦迁移学习 (FTL)\n\n它是具有高度异构样本空间且特征不同的数据集（见图 9）。考虑来自两个独立机构的两个数据集，如印度储备银行和美国联邦银行。两家中央银行可能只有极少数共同特征，但植根于各自国家的金融治理目标和模型不同。FTL\
  \ 算法应用于两个实体的两个特征空间的小样本空间，并学习共享格式。正式 FTL 表述如公式(5)所示。\n\n![图 9. 联邦迁移学习。](img/fig1_9_B.jpg)\n\
  \n图 9. 联邦迁移学习。\n\n(5)\n\n`A[i] = A[j], B[i] = B[j], SampleID[i] ≠ SampleID[j], ∀\
  \ M[i]M[j], i ≠ j`\n\n### 4. 联邦学习中的机器学习算法：分类\n\n联邦学习平均算法(FedAvg)[[9]](#ch1.xhtml#ref1_9)是由\
  \ McMahan 等人于 2017 年提出的最流行和经典的算法。FedAvg 已在 MNIST[[67]](#ch1.xhtml#ref1_67)和 CIFAR-10[[68]](#ch1.xhtml#ref1_68)等图像分类基准上进行测试。测试结果(FedAvg)在性能和分类准确性方面达到了预期结果。此外，联邦学习算法可分为：(1)\
  \ FL 中的监督学习，(2) FL 中的无监督学习，和(3) FL 中的半监督学习。下面简要介绍每一类。\n\n#### 4.1 FL 中的监督学习\n\n\
  ##### 4.1.1 联邦学习中的决策树算法\n\n\n\n\n# Yang Liu 等人于 2022 年提出了一种联邦决策树 (FDT) [[69]](#ch1.xhtml#ref1_69)\n\
  \n它在 VFL 框架中采用随机森林方法。主节点向客户端通信少量选定的特征和样本 ID。客户端将不知晓所有现有的特征和样本 ID。分裂准则由客户端在本地估算以构建树。客户端使用加密将分裂准则私密地共享给主节点。主节点解密分裂准则并计算全局最优分裂条件，然后通知客户端。掌握最优分裂的客户端将使用样本构建左右子树。上述步骤递归重复。最后，主节点收集来自所有客户端的局部最优分裂特征，从而为计算全局最优分裂特征铺平道路。\n\
  \n另一个名为安全提升模型 [[70]](#ch1.xhtml#ref1_70) 的类似模型由 Kewei Cheng 等人于 2021 年提出，它是在去中心化\
  \ VFL 框架中实现的回归树方法。用于增广 `g[t]` 一棵树的损失目标函数值见公式 (6)。\n\n(6)\n\n```\n\\arg\\min Loss^{t}\
  \ = \\sum\\limits_{i = 1}^{n}Loss(B_{i},{\\hat{B}}_{i}^{t - 1}) + G(SampleID_{i})\n\
  ```\n\n在公式 (6) 中，类别标签用 `B` 表示；`B̂ (SampleID[i])` 表示使用 K 棵回归树进行类别标签预测的输出；迭代用 `t`\
  \ 表示；损失函数的一阶和二阶导数用 `G(SampleID[i])` 表示。\n\n##### 4.1.2 联邦学习中的支持向量机\n\nHartmann 等人于\
  \ 2019 年主张在联邦学习中使用线性支持向量机。本地客户端以块为单位进行更新。在中央服务器与客户端交换模型参数的过程中，私有特征（如用户标签）不会泄露给服务器。因此，秘密向量机\
  \ (SecVM) [[71]](#ch1.xhtml#ref1_71) 执行本地梯度分割、哈希处理以隐藏用户标签，并遵循通信协议将更新传输给服务器。对于二分类器，线性目标函数如公式\
  \ (7) 所示。\n\n(7)\n\n```\nG(z) = \\frac{1}{T}{\\sum\\limits_{i = 1}^{T}{Loss}}\\\
  left( {z;A_{i},B_{i}} \\right) + \\theta{regular}(z)\n```\n\n在公式 (7) 中，第 `i` 个用户的特征和标签分别用\
  \ `A[i] R^d` 和 `B[i] [–1,1]` 表示；样本数量用 `T` 表示；参数正则化使用 `θ` 和 `regular(z)` 执行；`Loss`\
  \ 是每个用户或样本的损失函数；模型参数用 `z` 表示。模型参数 `z` 通过计算损失函数和正则化函数的偏导数之和进行更新，如公式 (8) 所示。\n\n(8)\n\
  \n```\nz_{j} = z_{j} - \\eta = \\left( {\\frac{1}{T}\\Sigma_{i = 1}^{T}\\frac{\\\
  partial{Loss}\\left( {z;A_{i},B_{i}} \\right)}{\\partial z_{j}} + \\theta\\frac{\\\
  partial{regular}(z)}{\\partial z_{j}}} \\right)\n```\n\n在公式 (8) 中，该模型的学习率用 `η` 表示；线性\
  \ SVM 的损失函数定义为 `loss(z; A[j], B[j]) = max(0, 1 – B[i] z^T A[i])`。线性 SVM 的梯度计算见公式\
  \ (9)。\n\n(9)\n\n```\n\\frac{\\partial{Loss}\\left( {z;a_{i},b_{i}} \\right)}{\\\
  partial z_{j}} = \\vartheta\\left( {1 - B_{i}z^{T}A_{i}} \\right)B_{i}A_{ij},\\\
  vartheta(A) = 1$,if$ A > 0$,otherwise$\\vartheta(A) = 0\n```\n\n在线性 SVM 模型中，服务器将当前模型发送给所有客户端。每个客户端计算本地梯度\
  \ `∇wLoss(z; a[i], b[i])` 并发送给服务器。服务器计算全局梯度并将其与正则函数 `regular(z)` 求和。公式 (8) 中的步长\
  \ `η = 1/θt`，其中 `t` 表示迭代次数，是使用 Pegasos 算法 [[72]](#ch1.xhtml#ref1_72) 估算的。该方法的局限性在于：(a)\
  \ 哈希函数失效（极其罕见），以及 (b) 当来自所有客户端的梯度之一为零时，SVM 可能无法产生结果。由于哈希隐藏了客户端标签，FL 模型将无法从其他客户端重建梯度为零的那个客户端的特征。\n\
  \n##### 4.1.3 联邦线性算法\n\n逻辑回归方法被集成到中心化 VFL 模型中，用于在无线网络场景下选择最多工作者（或设备）数量 [[73]](#ch1.xhtml#ref1_73)。该方法由\
  \ Yang 等人于 2020 年提出。该 VFL 模型的目标函数是一个以最小化为目标的线性可分函数，如公式 (10) 所示。\n\n(10)\n\n```\n\
  {Min}G(z) = \\frac{1}{D = \\left( {x_{j},y_{j}} \\right)}\\Sigma_{j - 1}^{T}g_{j}(z)\n\
  ```\n\n在公式 (10) 中，模型的向量化参数用 `z` 表示；数据点数量用 `T` 表示；每个被选设备的损失函数用 `g[j] = loss(z; x[j],\
  \ y[j])` 表示；`z ∈ R^d, d` 为优化维度；本地数据集用 `D[i] ∈ D` 表示。该模型具有更高的收敛速度和全局聚合中的最小误差，且观测到更高的预测准确率。中央服务器与数据所有者之间的信息交换隐私通过同态加密技术得到保障。\n\
  \n#### 4.2 联邦学习中的半监督学习\n\n客户端数据样本中分散的类别标注产生巨大成本，可通过联邦学习中的半监督学习来降低。另一方面，当联邦学习用于解决问题时，必须保证可用于训练的数据量。Jeong\
  \ 等人提出的联邦匹配 (FedMatch) [[74]](#ch1.xhtml#ref1_74) 引入了一种称为跨客户端一致性损失 (ICCL) 的新概念，其正式定义见下文公式\
  \ (11)。\n\n(11)\n\n```\nICCL = \\frac{1}{H}\\Sigma_{j = 1}^{H}K{Loss}\\left( {\\\
  left. p_{\\theta^{\\*j}}^{\\*}(Y \\mid UI) \\right\\| p_{\\theta^{j}}^{\\*}(Y \\\
  mid UI)} \\right)\n```\n\n在公式 (11) 中，辅助代理用 `H` 表示；服务器端选定的与客户端相当的模型用 `p[θ]^(*) hj`\
  \ 表示，这些模型不在客户端进行训练；客户端数量用 `K` 表示。ICCL 对预测数据标签执行不相交学习，这些标签可能位于客户端或服务器。为了提高半监督模型的效率，近期提出了变分自编码\
  \ [[75]](#ch1.xhtml#ref1_75) 和生成模型 [[76]](#ch1.xhtml#ref1_76) 等复杂模型。半监督学习进一步分为两类：(a)\
  \ 横向联邦半监督学习，和 (b) 纵向联邦半监督学习。\n\n在横向联邦半监督学习中，`N` 个参与者，`A` 表示特征空间，对所有样本相同，而样本 ID 对空间样本不同，即\
  \ `A[j] = A[k]`，`Sample ID[j] ≠ Sample ID[k], k ≠ j`，且对每个用户 `i`，数据集用 `D[i] = D[il]\
  \ U D[iU]` 表示，其中 `D[iU] = X[p] A`，`p = lower[i] + 1, ... , lower[i] + upper[i]`；`D[iL]\
  \ = X[p] A, B[p]`，`p = 1, ... , lower[i]`。\n\n在纵向联邦半监督学习中，特征空间不同，而样本 ID 相同，即 `A[k]\
  \ ≠ A[j]`，`Sample ID[k] = Sample ID[j], k ≠ j`，且对每个用户 `i`，数据集用 `D[i] = D[il] U D[iU]`\
  \ 表示，其中 `D[iU] = X[p] A[i]`，`p = lower[i] + 1, ... , lower[i] + upper[i]`；`D[iL]\
  \ = X[p] A[i], B[p]`，`p = 1, ... , lower[i]`。\n\nYang 等人为去中心化 VFL 提出了一种逻辑回归模型，其中拥有标签数据的\
  \ A 方和拥有无标签数据的 B 方之间存在契约 [[77]](#ch1.xhtml#ref1_77)。任一方均使用回归方法获取其无标签数据的结果。双方 A 和\
  \ B 均使用梯度更新模型。\n\n#### 4.3 联邦学习中的无监督学习\n\n\n\n\n# 联邦学习中的无监督算法\n\n机器学习中的无监督算法用于在没有类别标签的数据集中寻找结构或模式。在此框架中，参与的客户端以统一、跨客户端依赖的方式拥有数据构成。此联邦学习框架中存在跨域的数据迁移。在没有第三方干预的情况下，来自不同领域的数据和知识从去中心化的联邦学习框架传输到新设备。Peng\
  \ 等人[78] 提倡了一种用于联邦学习框架的无监督联邦域自适应模型。在此框架中，从不同计算节点学习到的演示模型与目标计算节点的数据分布保持一致。普通计算节点与目标计算节点之间的数据迁移不同于普通计算节点之间发生的常规迁移，在前一种情况下，计算节点可能倾向于产生不利贡献。\n\
  \n### 5. 联邦学习中的深度学习算法：分类\n\n本节简要讨论了与联邦学习框架集成的深度学习算法的概念。\n\n#### 5.1 联邦学习中的神经网络\n\
  \nMcMahan 等人于 2017 年[9] 在联邦学习框架中提出了一种神经网络模型。该模型在 `MNIST` 数据集上进行测试，用于数字识别。该神经网络模型包含一个输入层、两个隐藏层和一个输出层；总共提出了一个四层模型。每个隐藏层包含\
  \ `200` 个神经元单元。`MNIST` 数据集被分配给客户端，且它们之间不相交。在两组上进行了两个不同的实验：在第一个实验中，相同的随机初始值被分配给两个客户端的局部模型参数；在第二个实验中，不同的随机初始值被分配给两个客户端的局部模型参数。神经网络的最终模型是利用来自两组的模型参数构建的。\n\
  \n#### 5.2 联邦学习中的卷积神经网络 (CNN)\n\nRong 等人[79] 于 2020 年在联邦学习框架中提倡一种使用 CNN 进行特征提取的入侵检测方法。首先，使用数据填充方法构建二维结构。扩散\
  \ CNN 用于在联邦学习系统中构建和学习特征参数。`SoftMax` 分类器用于在检测阶段确定类别标签。该联邦学习中使用的 CNN 模型包含 `4` 个卷积层和两个全连接层。高检测率和缩短的训练时间是该模型的重要属性。进行了三种不同类型的实验并展示了其结果。观察到将隐藏层数量从两层增加到三层对性能没有显著影响。验证了二维结构可降低运营成本并提高准确率。在入侵检测方法中应用\
  \ `FC` 算法，并在 `NSL-KDD` 数据集上进行实验，结果显示准确率无变化，但观察到训练时间减少。在基于 `FC` 算法的模型中，训练阶段客户端与服务器之间交换的参数数量较少，从而减少了训练时间。\n\
  \nSattler 等人[80] 提出了一种名为稀疏三元压缩 (`STC`) 的方法，可在交换模型参数时减少带宽使用。上传模型、训练模型、从服务器下载模型以及最终聚合是采用\
  \ `STC` 设计的联邦学习训练过程的一部分。非独立同分布 (`non-IID`) 数据在边缘设备中普遍存在，从而降低了联邦学习模型中训练的有效性。显然，本地边缘设备的梯度会偏向本地数据集。估计梯度的均值预期是无偏的。在使用包含全局\
  \ `5%` 公共数据的 `CIFAR-10` 数据集进行的实验中，观察到准确率提高了 `30%`。\n\n#### 5.3 联邦学习中的贝叶斯网络\n\nYurochkin\
  \ 等人[81] 在联邦学习框架中提出了一种贝叶斯网络。Beta-Bernoulli 过程 (`BBP`) 是一种贝叶斯非参数 (`BNP`) 模型，允许在局部参数和全局参数之间进行参数匹配。当当前全局参数与局部参数不匹配时，将重构新的全局参数。`BBP`\
  \ 的两个重要特征是：(a) 将局部模型学习与联邦学习中聚合成全局模型的局部客户端组合分离开来，从而可以在数据源上使用不同的学习算法；(b) 已知预训练模型时，`BBP`\
  \ 可以利用其匹配机制将它们组合成全局模型，无需额外学习算法的支持，并可构建预训练模型。`BNP` 的目标是识别 `K` 个局部模型中的神经元子集，并使其与其余局部模型中的神经元等价。来自局部模型的这些神经元簇被组合在一起形成全局模型。\n\
  \n#### 5.4 联邦学习中的长短期记忆网络 (LSTM)\n\nLi 等人提出了联邦近端算法 (`FedProx`)[82]，用于字符识别和情感分析。与\
  \ `FedAvg` 相比，`FedProx` 具有更好的收敛性。在统计异质性的情况下，当局部客户端发生变化时，`FedAvg` 中的局部客户端将无法以相同的速度完成更新。为应对这一挑战，`FedProx`\
  \ 引入了一个稳定项来稳定联邦学习框架。该稳定项显著增加了对局部参数与全局参数之间差距的限制。包含两层、 `100` 个隐藏单元和 `80` 个嵌入层的 `LSTM`\
  \ 分类器被纳入 `FedProx`。与 `FedAvg` 相比，`FedProx` 在异构生态系统中具有更高的准确率（提高 `22%`）和更快的收敛速度。\n\
  \n#### 5.5 联邦学习中的强化学习\n\nAnwar 等人提出了用于构建模型投毒攻击者模型的强化学习，这可能对联邦学习构成严重挑战。针对移动设备的通用攻击无效。多任务联邦强化学习\
  \ (`MT-FedRL`)[83] 利用信息增益最小化对联邦学习系统发起有效攻击。在 `MT-FedRL` 中，存在 `n` 个智能体，每个智能体拥有自己的环境，且更新策略在马尔可夫决策过程\
  \ (`MDP`) 的框架内运行。每个智能体拥有自己的状态空间和动作空间。每个智能体由一个 `5-元组` 表征，它们分别是奖励函数、折扣因子、转移概率、状态空间和动作空间。`MT-FedRL`\
  \ 的目标是构建一个在 `n` 个智能体的所有环境中均为最优的协作策略[84]。联邦学习中强化学习的框架如图 10 所示。\n\n![图 10. 联邦学习中强化学习的框架。](img/fig1_10_B.jpg)\n\
  \n图 10. 联邦学习中强化学习的框架。\n\n#### 5.6 联邦学习中的元学习\n\n\n\n\n# 联邦学习中的元学习\n\n在元学习中，每个智能体或设备协同训练元学习器。尽管每个设备上独立进行元学习，但设备的参数会在服务器上进行聚合。全局训练模型在所有设备上是相同的。Chen\
  \ 等人提出了联邦元学习 **FedMeta** [[85]](#ch1.xhtml#ref1_85)，这是一种将模型无关元学习 **MAML** 算法和 **MetaSGD**\
  \ 集成到框架中的方法。在 FedMeta 中，参数在客户端和服务器之间交换，这与 MT-FedRL 不同。MAML 算法在较新的数据集上表现出快速收敛。研究发现，MAML\
  \ 和 Meta-SGD 结合可以降低通信成本并提高训练模型的准确性。与 FedAvg 相比，FedMeta 的通信成本降低了 2.82–4.33 倍，收敛速度加快了\
  \ 3% 到 14%。\n\n图 11 展示了 FL 框架中的元学习。\n\n![图 11. FL 框架中元学习的示意图。](img/fig1_11_B.jpg)\n\
  \n图 11. FL 框架中元学习的示意图。\n\n#### 5.7 联邦学习中的残差网络\n\nHuang 等人提倡在 FL 框架中使用 **残差池化网络 (RPN)**\
  \ [[86]](#ch1.xhtml#ref1_86)，以减少上传和下载到服务器的数据传输量。RPN 中的任务按顺序调度，在保持相同性能水平的前提下减少数据传输。首先，在\
  \ RPN 中，不允许所有客户端向服务器传输参数。系统会进行客户端选择，仅选中的客户端执行模型更新。第二步，每个选中的客户端使用全局更新进行初始化。第三步，使用本地数据集构建并训练本地模型。第四步，通过确定模型更新前后的差异来计算残差网络，从而捕获参数的变化。第五步，如\
  \ 图 12 所示，执行空间均值池化以压缩模型参数。第六步，将客户端的 RPN 发送到服务器进行聚合。最后，将 RPN 发送给选中的客户端，流程重复进行。RPN\
  \ 可应用于所有基于 CNN 的训练模型，以减少数据通信开销，并可轻松部署在实际应用中。\n\n![图 12. 通过计算均值进行空间池化。](img/fig1_12_B.jpg)\n\
  \n图 12. 通过计算均值进行空间池化。\n\n### 6. FL 中的隐私威胁模型\n\n隐私和保密性是 FL 框架从分布式机器学习计算平台演变而来的基石。理解隐私威胁模型对于设计保护隐私的\
  \ FL 框架至关重要。FL 中的三个重要角色是：（a）训练模型的用户（或模型查询者），（b）模型构建者（或负责计算和推导结果的智能体），以及（c）数据所有者（或客户端、数据持有者）。FL\
  \ 系统可能在训练的任何阶段遭遇攻击。广义上，训练阶段可分为：（a）模型训练，（b）推理，以及（c）数据分发。\n\n下面简要介绍针对 FL 系统的不同类型攻击。\n\
  \n1.  **属性推理攻击**：数据分发阶段的属性推理攻击会导致数据持有者或客户端因恶意目的而去匿名化。恶意挑战者或攻击者的目的是为了仇恨目的而使数据所有者去匿名化。通过避免在\
  \ ML 模型中分发数据时出现用户 ID 等个人可识别信息 (PII)，可以保护客户端隐私免受属性推理攻击。\n\n2.  **模型投毒攻击**：从实验和实际实施来看，观察到\
  \ FL 系统易受模型投毒攻击。这也被称为后门攻击。在单词预测应用中，后门攻击者会在句子中引入单词，使句子完美补全。进一步增加恶意客户端的权重会导致训练损失，从而达到攻击者的目的。\n\
  \n3.  **重构攻击**：在重构攻击中，恶意挑战者或攻击者的目标是在模型构建阶段或推理阶段重现或重新构建模型中样本的特征向量。在中心化 FL 中，客户端将原始数据上传给模型构建者，从而使其容易受到恶意模型构建者的攻击。在\
  \ FL 框架中，每个客户端在其本地数据集上执行 ML 训练。梯度值或参数权重会提供给生态系统中的其他客户端。有时，攻击者或恶意挑战者可能会利用梯度值提取关于训练数据集的额外统计信息。\n\
  \n4.  **模型反演攻击**：模型有两种访问类型，分别是（a）黑盒访问，和（b）白盒访问。在模型反演攻击中，假设恶意挑战者（或攻击者）拥有这两种类型的访问权限。白盒访问让恶意挑战者知晓模型的文本信息，但不知晓特征向量。在黑盒访问中，恶意挑战者可以通过查询模型来收集数据。恶意挑战者的主要目标是从模型的训练数据中构建特征向量。模型上的查询-响应对可能被恶意挑战者用来了解模型信息。\n\
  \n5.  **成员推理攻击**：在成员推理攻击中，恶意挑战者拥有对训练模型的黑盒访问权限。假设攻击者知晓数据集中的特定样本。攻击者通过检查模型的响应，试图确定特定样本是否存在于训练数据集中。通过检查对训练数据中已知样本的预测与其他样本预测之间的差异，对模型发起攻击。\n\
  \n### 7. 联邦学习中的挑战\n\n1.  **隐私**：被攻破的服务器或客户端会造成 FL 系统的不平衡。这可能会损害 FL 系统的可用性、完整性和机密性。针对\
  \ FL 系统的攻击可分为主动攻击和被动攻击。主动攻击由活跃客户端发起。半诚实服务器可对 FL 系统发起攻击，称为被动攻击。在这种情况下，更新后的梯度无法在所有客户端间共享。\n\
  \n2.  **通信**：与分布式机器学习系统不同，客户端和服务器更频繁地相互通信模型参数和梯度。客户端的网络状态和通信协议对 FL 框架系统有重要影响。\n\n\
  3.  **异构性**：在分布式 ML 系统中，数据是独立同分布 (IID) 的，而在 FL 系统中，数据是非独立同分布 的。适用于分布式 ML 系统的算法，若不加修改便无法用于\
  \ FL 系统。异构性为研究人员开辟了新的途径或挑战。\n\n4.  **计算成本**：在 FL 框架中，多个本地模型在具有不同计算能力的设备上同时训练，并与中央服务器通信更新。参与的本地模型增加也会加剧通信问题和计算考验。现有的联邦学习模型未考虑本地设备极高的计算成本。联邦学习中的非对称计算是一个亟待解决的开放问题。\n\
  \n\n\n\n\n## 5. 可靠的服务器\n\nFL 框架中的中央服务器管理本地训练，并接纳客户端发布的梯度更新。可能无法获得可靠且受信任的服务器。即使是中心化形式的差分隐私也能增强数据保护。客户端预期信任中央服务器，如果参与实体之间不存在信任，则可能发生数据泄露。\n\
  \n## 6. 新的 FL 计算框架\n\n由冗余服务器、硬件加速器和去中心化训练模型组成的新 FL 计算框架需要进行严谨的研究。\n\n### 8. 结论\n\
  \n本文简要讨论了机器学习、分布式机器学习和联邦学习，使读者能够清晰、明确地了解该领域不断演进的主题。机器学习和联邦学习的正式定义将为初涉研究的初学者提供洞见，使其聚焦于局限性。文中讨论的大量机器学习算法和深度学习算法以及威胁与挑战，将让读者一窥现有的最新技术水平。构建一个符合不同地域或国家数据保护法律的联邦计算框架，将是研究人员面临的主要挑战。本文旨在构建一个叙事框架，以便读者在尝试其创新时，能在联邦学习的框架内考虑所有挑战。\n\
