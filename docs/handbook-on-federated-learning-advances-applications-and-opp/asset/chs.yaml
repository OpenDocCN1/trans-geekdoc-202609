  \n### 1. 简介\n\n**联邦学习（FL）** 在过去十年中因在协作建模且无需泄露敏感数据方面的优势而备受关注。自诞生以来，文献中最流行的方法是**中心化联邦学习（CFL）**，即由单一组织构建全局模型。另一方面，中心化系统存在服务器节点瓶颈、单点故障和信任要求等缺点。为克服这些问题，诞生了**去中心化联邦学习（DFL）**，它摒弃了中心化基础设施的使用，拥抱数据共享最小化和去中心化模型聚合的理念。尽管\
  \ DFL 领域已有大量研究，但文献尚未（i）探讨将 DFL 与 CFL 区分开来的基本原则；（ii）回顾使用 DFL 的应用场景和解决方案；以及（iii）分析\
  \ DFL 框架以构建和评估新解决方案。\n\n本研究旨在识别并考察联邦架构、拓扑结构、通信策略、安全预防措施和关键性能指标等方面最关键的 DFL 基本原理。当前研究还探讨了增强关键\
  \ DFL 基本原理的方法。随后，结合上述基本原理，对最流行的 DFL 应用场景和解决方案进行分析和对比。然后，对比并评估当前 DFL 框架的关键要素。最后，考察所提\
  \ DFL 系统的进展，以识别模式、经验教训和未解决的难题。\n\n联邦学习是一种机器学习策略，众多客户端在中央服务器的协调下协作训练模型，同时将数据保留在客户端本地。它在保护数据隐私的同时，也增强了学习的泛化能力。此外，联邦学习的全局模型必须适应客户端数据的独特特性。我们提出微调作为一种定制策略，用于将全局联邦学习模型适配至新的客户端输入。\n\
  \n数据科学家可利用**FL**机器学习框架，使用用户数据训练统计模型。这是一种分散式训练方法，测试和训练均在边缘端进行。元数据被传输至中心化服务器，该服务器将来自不同客户端的众多模型更新整合为一个新模型（图\
  \ 1）。\n\n![图 1. 无需将机密用户数据发送至服务器。](img/fig15_1_B.jpg)\n\n图 1. 无需将机密用户数据发送至服务器。\n\n\
  由于股价预测可带来可观收益，多年来一直是热门话题。因股票时间序列表现出的行为近似于随机游走，股市难以预测，预测颇具挑战性 [5, 7]。突发新闻出现时，股票报价可在几秒内剧烈变动。股价波动可由多种因素引起。主要基于供需关系：当大量人想买入而非卖出某股票，即需求超过供给时，股价上涨；当供给超过需求时，股价下跌。公司业绩\
  \ [2] 影响其股价。除虚假新闻外，恐惧贪婪等人类情绪、财务结果，以及国家政治局势、经济状况等其他社会经济因素均影响股市 [34]。人类分析突发新闻可能耗时数分钟，而金融市场投资者必须快速决策。过往投资者会前往证券交易所\
  \ [12]（如 BSE 或 NSE）。在线交易简化了流程，致使大量投资者进入资本市场。COVID-19 大流行期间，股市新投资者数量显著增加。得益于在线交易和数字化，股市在疫情期间似乎吸引了新投资者。\n\
  \n如前所述，人类情绪和情感等心理因素对股市产生了影响 [1, 3, 14]。Twitter 是追踪股市新闻的热门论坛。本文利用**BERT**和 Transformer\
  \ 模型进行情感分析。使用经过修改的**BERT**基于推文训练模型以进行情感预测 [6, 27]。**BERT**分类器用于作出看涨和看跌预测。随后利用分类结果对推文进行预处理\
  \ [8, 13, 29]，进而可用于预测推文中的实时情感。\n\n#### 1.1 目的与范围\n\n训练机器学习模型以查找股票相关推文，并通过评估推文和预测情感，构建基于\
  \ Twitter 的股市预测系统。将 Twitter 作为股市信息来源，如**移动平均线收敛发散指标（MACD）**、**移动平均线**及其他股票指标。本研究范围旨在利用\
  \ Twitter 情感分析降低股市投资风险，助力股东做出能获得良好回报的审慎投资 [25]。\n\n### 2. 文献综述\n\n\n\n\n# 众包与联邦学习在数据驱动应用中的应用\n\
  \n## 简介\n\n我们都见识过众包的实用性。客户可以在 `Waze` 等移动应用上报告各种驾驶路况，包括路边停车、交通拥堵、车祸、警察测速陷阱等等。因此，其他用户能从这种协作中受益，做出更明智的驾驶决策。举个简单的例子，如果某条路线发生严重拥堵，`Waze`\
  \ 能够规划一些替代路线以到达目的地。\n\n同样，在寻找家庭度假酒店预订时，我们通常会查看多条客户评价。在 `TripAdvisor` 或 `Booking.com`\
  \ 等网站上，我们几乎可以了解所有信息，包括环境卫生状况、员工的客户服务技能等。\n\n最后，利用 `Amazon Mechanical Turk` 等众包平台来加速机器学习开发相当普遍。其理念是利用高度分散的平台将特定流程外包。这种方法将工作分解为离散的、简单的任务，新手可在短时间内完成。这些任务可能涉及数据标注、验证，或简单的数据清洗技术，如去重。\n\
  \n## 联邦学习的底层概念\n\n大型企业和医院正在寻求如何利用海量敏感数据来改进其服务。试想一下，如果我们能利用全球医院现有的所有数据来训练机器学习系统。这种协作必将造福黑色素瘤和乳腺癌诊断等应用。同样的逻辑也适用于保险和银行公司，它们可能利用私密信息构建更精准的预测模型。\n\
  \n然而，另一个关键问题——隐私——才是真正阻碍我们协作改善医疗的因素。随着预测算法在日常生活中变得司空见惯，人们对全球企业如何利用我们的数据的担忧与日俱增。企业未经我们许可就利用我们生成的数据开发商业机器学习算法，这让人感觉不妥。此外，从隐私角度来看，医院将您最近检查的照片提供给开发预测模型的外国公司是不可想象的。为了确保客户数据不惜一切代价得到保护，`HIPAA`\
  \ 和 `GDPR` 等法律应运而生。\n\n联邦学习旨在利用众多参与者，每个参与者可分别为更大的任务做出贡献。参与者可以包括各种设备，如智能手机、平板电脑、医院存储的医疗信息、自动驾驶汽车，以及任何具备足够算力和用户交互数据的联网计算设备。\n\
  \n## 客户端设备上的数据特征\n\n每个客户端设备上的数据都有其独特特征。首先，它是**个人**的。以虚拟键盘智能手机应用为例。用户每天都通过移动键盘与同事联系、填写表格、与朋友交流。在此过程中，用户创建密码、发送语音消息、透露关于自己或雇主的个人信息、咨询医生等。\n\
  \n然而，参与者之间的数据**严重不均衡**。显然，人们出于不同目的、以不同速度使用键盘。一位用户可能通过移动应用解决所有银行业务，而另一位用户可能选择前往银行实体网点。\n\
  \n考虑一下在手机上使用导航应用，如 `Waze` 或 `Google Maps`。同样，此类应用产生的数据性质极其敏感。它可用于查明某人去过哪里，以及他们是骑自行车、开车、坐飞机，还是在公园散步。统计模型可利用这些数据学习任何人的移动模式。这些模型可用于预测他或她明天或下周末的行程地点。这构成了严重的隐私侵犯。\n\
  \n## 相关工作：股票预测模型\n\n基于 `混合预测算法` (`HPA`) 的 `生成对抗网络` (`GAN`) 已被提出 [[23]](#ch15.xhtml#ref15_23)，通过结合两个不同系统信息的描述性方法来实现\
  \ `Stock GAN` 结构。第一个系统是来自 `Yahoo Finance API` 的历史数据，第二个是来自 `Kaggle` 网站的 `Twitter`\
  \ 数据。然后，在对推文数据进行预处理后，训练了 `BERT` 和 `Word2Vec` 模型以获得预期结果。因为 `BERT` 在推文情感分类方面更强，且能达到更低的\
  \ `均方误差` (`MSE`)，所以它在预测股价方面优于 `Word2Vec` (`MSE`)。\n\n研究分析 [[35]](#ch15.xhtml#ref15_35)\
  \ 提出了一种利用搜索词嵌入更好地传达投资者情绪以增强“恐惧感”的新技术。在周度数据集上，研究表明语义信息有助于股票收益预测，价格和搜索量数据之间的权衡有助于提升性能\
  \ [[17]](#ch15.xhtml#ref15_17)。采用 `支持向量机` (`SVM`) 和 `SS` 核函数提取输入间的相关性，并利用此新方法基于财经新闻预测股价趋势\
  \ [[25]](#ch15.xhtml#ref15_25)，[[31]](#ch15.xhtml#ref15_31)。在预测两天滞后的价格变化时，准确率为 73%。\n\
  \n一种对比技术 [[10]](#ch15.xhtml#ref15_10) 使用 `SVM` 和个性化情感词典进行股价预测。评分范围为 –5 到 +5，其中 –5\
  \ 表示最高程度的消极，+5 表示最高程度的积极，0 表示停用词 [[28]](#ch15.xhtml#ref15_28)。`SVM` 的准确率为 59.1734%。\n\
  \n`卷积神经网络` (`CNN`) 被 [[11]](#ch15.xhtml#ref15_11) 用作情感指数的基础学习器。`EMD` 基于注意力 `LSTM`\
  \ (`层增强长短期记忆`)。在预测股市时，该方法达到最高准确率、最短时间偏移和最接近的预测值。\n\n`径向基函数` (`RBF`) 和 `支持向量机` (`SVM`)\
  \ 被用于预测股市 [[24]](#ch15.xhtml#ref15_24)。数值结果证实了其卓越效率。`Weng et al.` 使用 `ANN`、`SVM`\
  \ 和 `决策树` 机器学习技术来预测股票走势 [[33]](#ch15.xhtml#ref15_33)。该方法达到约 85% 的准确率。\n\n为计算情感得分\
  \ [[16]](#ch15.xhtml#ref15_16)，建议使用 `SVM` 结合 `哈佛 IV-4 情感词典` (`HVD`) 和 `Loughran\
  \ McDonald 金融情感词典` (`LMD`)，二者的准确值分别为 `LMD` = 0.5527 和 `HVD` = 0.5460。`Hegazy et\
  \ al.` 设计了一种机器学习模型 [[9]](#ch15.xhtml#ref15_9)，结合 `粒子群优化` (`PSO`) 方法和 `最小二乘支持向量机`\
  \ (`LS-SVM`) 利用金融技术指标预测股价。最有效的算法是 `LS-SVM-PSO` [[4]](#ch15.xhtml#ref15_4)。\n\n###\
  \ 3. 材料与方法\n\n#### 3.1 现有系统\n\n\n\n\n# 现有预测系统\n\n现有预测系统采用长短期记忆（LSTM）算法。LSTM 提出的被称为记忆单元的处理设备取代了传统的人工神经元。由于网络能高效地在时间上链接记忆和远程输入，因此它们是随时间动态记录具有高预测限度的数据结构的最佳选择。人工神经网络（ANN）和遗传算法（GA）是其他预测方法；然而，它们未考虑股票价格之间的长期时间相关性。基本面分析考虑股票的过往表现和公司的整体信誉，统计分析仅专注于数字运算和识别股价变动模式，二者是股票市场分析和股价预测的传统方法。\n\
  \n移动平均线、MACD、相对强弱指标（RSI）和商品通道指数（CCI）是一些用于预测股市的技术指标。移动平均线和 MACD 是基于价格高于或低于移动平均线来识别股票趋势的技术指标。利用\
  \ MACD 买入或卖出信号，投资者可以做出明智的股市投资。RSI 和 CCI 等指标通过将当前价格与过去数值比较，提示超买和超卖状况。技术指标判断股价是看跌还是看涨。基于形态的信号是最终结果。\n\
  \n## 3.1.1 现有系统的局限性\n\n经分析，现有系统存在以下缺陷：\n\n- 技术指标采用传统方法做投资决策。股票可能长期处于超卖或超买状态。\n-\
  \ 技术分析工具使用短周期预测价格。因此会出现不准确的股价指标，可能导致灾难性后果。使用 MACD 时发现，该技术指标在横盘震荡的波动市场中表现不佳。\n- RSI\
  \ 在价格图表震荡指标中比较多头和空头价格动量并显示结果。其信号与其他技术指标一样，仅当与长期趋势一致时最可信。\n- LSTM 仅利用非常接近前一日收盘价的值来预测次日价值，这可能无法提供准确的预测结果。\n\
  - 当大型网络的权重变得过大或过小时，会导致梯度爆炸/消失问题，显著降低对最优值的收敛性。\n\n#### 3.2 建议系统\n\n联邦学习是在训练大型机器学习模型时隐蔽保护设备端数据的策略。Google\
  \ 研究人员在 2015 年论文“Communication-Efficient Learning of Deep Networks from Decentralised\
  \ Data”中描述的联邦学习，是一种在去中心化数据上训练中心化服务器的分布式方法。联邦学习最重要的优势之一是它使机器学习训练摆脱了在中央服务器保留数据集的需求。在联邦学习中，用户设备永不失去对数据的访问。利用设备的本地算力和数据训练机器学习模型。本地训练模型的训练元信息（权重和偏置）被发送到中央服务器。我们必须首先研究联邦学习与传统机器学习开发的差异，才能完全理解它。确实，实现联邦学习需要思维转变。开发机器学习模型时，通常的标准是在中心化位置（如服务器）混合训练和验证数据。将所有数据集中在一处，可快速可靠地执行数据探索、可视化、验证和批量训练程序（深度神经网络所需）。\n\
  \n大多数机器学习算法基于数据是 IID（独立同分布）的前提。联邦学习违背了这一规则。在此情况下，每个成员仅保留消费统计数据。因此我们不能假设每个数据点（来自每个客户端设备）代表整体总体。在联邦学习中，模型开发、训练和评估在无直接访问原始数据的情况下进行。然而，通信成本和可靠性构成重大障碍。工作流程如下：算法根据各种标准从候选池中选择合格参与者。\n\
  \n以移动设备（如智能手机和平板电脑）为例，电量充满、具有特定硬件配置、连接可靠免费 WiFi 且未被使用的设备符合资格。并非所有设备都加入联邦是联邦学习架构的关键要素。仅向合格设备提供训练模型。目的是减轻本地训练可能对用户体验造成的负面影响。即使认为本地模型训练仅需几分钟，当用户使用设备通话或获取重要信息时，也没人愿意忍受由本地模型训练引起的设备卡顿。随后，每个设备利用本地数据开始训练模型的本地微调阶段。训练完成后，各本地模型的更新参数被发送到中央服务器进行全局更新。\n\
  \n本文旨在创建一种股票预测方法，帮助股市投资者并激励新入行者。通过文献调研和研究论文发现，LSTM 和 GAN-HPA 等预测算法被用于基于雅虎财经数据或其他数据集的股价预测。因此，我们的主要目标是基于股票相关推文的情感分析创建预测系统。他们提出了一种利用\
  \ BERT 算法和带有股市内容的推文情感分析来预测股价的方法。由于本文目前专注于从 Twitter 数据预测股价，推文和必要数据集通过 Twitter API\
  \ 和其他来源获取。BERT 是一种半监督机器学习算法，用于从 Twitter 数据预测股价。\n\n该算法试图通过将推文分为积极和消极两类来改进推文分类，利用称为词嵌入的特征确定和提取方法减少分类难度，其中含义相似的词具有可比较的表示。此方法如图\
  \ 2 所示。\n\n![Figure 2. Enlarged block architecture.](img/fig15_2_B.jpg)\n\nFigure\
  \ 2. Enlarged block architecture.\n\n\n\n\n推特情感分析的详细架构操作如图 2 所示。推文是经过进一步处理的原始数据。该设计包含一种机制，通过规范化文本并识别推文的积极/消极二元性，在推特平台上对情感进行分类。完成的数据集随后被发送用于训练和测试。对于股票预测，训练数据集被传输到预训练的\
  \ `BERT` 模型。使用测试过的数据集对模型进行测试。本质上，`BERT` 是 Transformer 的双向编码器表示。它是一种半监督的机器学习模型（\\\
  [13, 14\\]）。双向编码器是一种自然语言处理（`NLP`）工具。推文被检索并转换为 0 和 1 的向量格式，其中 1 表示“积极”，0 表示“消极”。在推文中，人类情绪使用特定语言表达，随后被系统地转化为数学形式。最后，我们可以结合使用\
  \ `BERT` 和 `NLP` 来预测某只特定股票未来是否会表现良好。\n\n情感分析是一种机器学习活动，我们试图弄清人们对一段文本的感受。我们将采用机器学习和自然语言处理技术，从提供的文本中提取特定元素并将其归类为积极或消极。这很有益，因为我们可以大致了解是应该买入还是卖出股票。在本研究中，我们尝试将来自\
  \ Twitter 的推文归类为利好或利空。Twitter 是一个社交网络平台，允许用户在 140 字符的限制下快速、自发地表达自我。由于其广泛使用，Twitter\
  \ 是了解任何事物当前总体印象的绝佳来源。建议的系统主要包含三个关键步骤：数据获取、数据预处理和数据分类。\n\n***服务器执行：***\n\n> *初始化\
  \ `ω`[0]*\n>\n> ***for** 每轮 `t` = 1,2,…***do***\n>\n> `m` ← `max`(`C`.`K`,1)\n>\n\
  > `S[t]` ← (*随机选取 m 个客户端的集合*)\n>\n> ***for** 每个客户端 `k` ϵ `S[t]` **并行执行 do***\n>\n\
  > $$\n> \\begin{array}{l}\n> \\left. \\omega_{t + 1}^{k}\\leftarrow ClientUpdate(k,\\\
  omega_{t}) \\right. \\\\\n> \\left. w_{t + 1}^{k}\\leftarrow\\sum\\limits_{k = 1}^{K}\\\
  frac{n_{k}}{n}w_{t + 1}^{k} \\right. \\\\\n> \\end{array}\n> $$\n>\n> ***ClientUpdate**(k,\
  \ ω): //在客户端 k 上运行*\n>\n> `B` *←* (*将* `℘`[`k`] *分割为大小为 B 的批次*)\n>\n> ***for** 每个\
  \ localepochi 从 1 到 E **do***\n>\n> ***for** 批次 `b` ϵ* `B` ***do***\n>\n> `ω` ←\
  \ `ω` – `η`∇`l`(`ω; b`)\n>\n> *将 `ω` 返回给服务器*\n\n联邦平均算法在上述伪算法中描绘。它分为两部分，第一部分由服务器执行，第二部分由客户端执行。服务器最初初始化模型参数——通常使用随机值。服务器协调多个执行轮次。服务器为每一轮随机选择一部分客户端（合格设备）并并行提供训练模型的副本。每个客户端利用其数据执行一系列梯度下降步骤，以微调训练模型的副本。训练完成后，每个客户端将本地模型的权重和偏差发送给服务器。服务器收集所有客户端的更新并发起新的周期。\n\
  \n认识到联邦学习并非完全私密至关重要。由于每个设备的独特模型更新被发送到协调服务器，攻击者（甚至服务器本身）可能访问原始更新并进行某种逆向工程，以窥探每个客户端数据的信息。因此，标准形式的联邦学习包含端到端加密。因此，训练元数据在从客户端传输到服务器的过程中始终被加密，进一步保障了流程安全。安全聚合是一种防止服务器访问原始更新的方法，它使服务器能够汇编来自不同参与者的加密模型，并仅解码聚合后的训练结果。\n\
  \n因此，服务器永远不会看到来自特定设备的训练结果。为增加安全性，我们可以将联邦学习与差分隐私相结合。测试是联邦学习与传统机器学习的另一个关键区别。验证机器学习模型时，我们应使用尽可能接近实际生产数据的数据。由于服务器缺乏访问训练数据的权限，因此无法在聚合模型通过客户端贡献更新后对其进行评估。因此，测试和训练均在消费者设备上进行。必须强调的是，分布式测试恢复了在面向用户的设备上测试新模型的优势，这正是最重要的地方。\n\
  \n总之，联邦学习这一新颖方法极具前景。它是一种去中心化、协作式的方法，使研究人员能够在坚持隐私标准的前提下，利用敏感数据训练机器学习模型。得益于 5G 技术的当前改进，联邦训练可应用于更多应用，这将需要我们依赖更强、更快的互联网连接。尽管联邦学习仍处于起步阶段，但它已在多个应用中取得成功，包括\
  \ Apple Siri 和 Google 虚拟键盘（GBoard）。\n\n##### 3.2.1 数据获取\n\n**Twitter API：** 收集数据有多种选择。建议使用\
  \ Twitter API v2 版本来收集推文。可以使用以下步骤通过 Twitter API 收集推文：\n\n1.  需要一个具有访问级别控制的开发者账户，才能通过\
  \ Twitter API 发送请求。\n2.  创建账户后登录。创建一个新项目并为其命名。\n3.  一切就绪后，您将获得一组四个密钥，用于访问 Twitter\
  \ 数据库。\n\n**收集：** 此处将使用 Python 中可用的 `Tweepy` 库，通过 Twitter API 收集推文。\n\n*   使用 `pip\
  \ installs Tweepy` 命令安装 Tweepy。\n*   使用您的密钥和令牌验证身份。\n*   创建搜索查询——搜索查询是一个字符串，告诉 Twitter\
  \ API 您在寻找什么样的推文。例如，如果您想查找关于特斯拉的推文，只需在 Twitter 上搜索 Tesla 或 `@Tesla`。\n*   我们将使用\
  \ `Tweepy` 游标通过 Twitter API 获取推文。响应随后记录在一个列表中，可通过迭代获取所需信息。\n\n**数据集：** 建议为此目的使用\
  \ Python 的 `Panda` 库。可以从响应的所需属性创建数据框。\n\n##### 3.2.2 预处理\n\n预处理推文至关重要，因为这直接影响分类器的性能。将使用\
  \ `Regex` 库对推文进行预处理。为此将执行以下程序：\n\n*   **转换：** 文本转换为小写。分词是将原始文本分离为称为标记的单词或句子的方法。为便于后续处理，推文将被分解为单词。\n\
  *   **停用词移除：** 这些是所有推文中频繁出现且通常不表达任何情绪的词。\n*   **表情符号移除：** 我们也将移除推文中的所有表情符号，因为我们只对文本感兴趣。\n\
  *   **话题标签和 URL 移除：** 推文可能包含多个话题标签和 URL。因为这些对情感分析无用，所以必须消除。\n\n##### 3.2.3 分类\n\n\
  \n\n\n##### 3.2.4 建议系统的优势\n\n建议系统的优势如下：\n\n为了预训练 `BERT`，使用了大量数据。已训练超过 25 亿个单词。这意味着它可以处理小数据集并仍能获得良好结果。\n\
  \n以前，无论单词如何使用，都会返回相同的向量；现在，根据周围的单词，`BERT` 会为同一个单词返回多个向量。\n\n据说这种范式是双向的。与有向模型相反，`BERT`\
  \ 可以随时以任何方向阅读文本。由于其双向性，该模型可以根据单词左侧和右侧的上下文理解每个单词的含义；这代表了语境学习领域的重大进步。`Masked Level\
  \ Modelling (MLM)` 和 `Next Sentence Prediction (NSP)` 在 `BERT` 中相结合。它目前是理解大量语境文本的最佳\
  \ `NLP` 策略。与其他算法不同，`BERT` 专注于单个单词而非整个文本。`BERT` 还能识别每个单词并预测该单词的左侧和右侧对应词。\n\n####\
  \ 3.3 Transformers\n\n因为 `BERT` 基于 `Transformers` 架构，所以理解 `Transformers` 模型至关重要。`Transformers`\
  \ 模型通常具有如 图 3 所示的双层处理流程。\n\n![Figure 3. Transformers architecture.](img/fig15_3_B.jpg)\n\
  \n图 3. Transformers 架构.\n\n**编码器**：模型的这一部分检查输入文本中的关键短语，并根据这些单词之间的相互关系为每个单词创建嵌入向量。\n\
  \n**解码器**：解码器将编码器基于嵌入的输出转换为文本输出，即输入文本的翻译形式。\n\n研究中最重要的部分是用于构建编码器和解码器的层，如 图 3 所示。与传统\
  \ `RNNs` 相反，编码器和解码器均未采用循环或迭代。相反，它们利用了“注意力”层，从而实现信息的直线流动。`Transformer` 将输入跨多个注意力层传递，而不是多次循环它。\n\
  \n##### 3.3.1 BERT\n\n`BERT` 是一种基于 `Transformers` 的机器学习模型。以前，文本输入只能从右向左或从左向右读取，不能同时进行。`BERT`\
  \ 的双向能力使其能够同时完成这两项任务。\n\n##### 3.3.2 BERT 如何工作？\n\n`NLP` 的主要目标是理解人类语言。模型通过使用大量资源进行训练来实现这一目标。训练\
  \ `BERT` 仅使用了未标注的纯文本语料库。来自未标注文本的无监督学习可以帮助其改进。预训练 `BERT` 可以作为构建“知识”基础的地基。它可以根据开发者的需求进一步训练。`BERT`\
  \ 是第一个完全依赖自注意力机制的 `NLP` 系统。由于其双向性，这成为可能。`BERT` 可以专注于每个单词，而不是整个语句。句子或短语中的单词越多，焦点单词变得越不清晰。\n\
  \n##### 3.3.3 训练 BERT\n\n`BERT` 使用两种不同的方法进行训练：\n\n*   **掩码语言建模** 用于在将序列输入 `BERT`\
  \ 之前随机替换序列中 15% 的单词。然后模型利用序列中未被掩码的单词，尝试预测被掩码单词的原始值。`BERT` 的损失函数不考虑未被掩码的单词；仅考虑被掩码单词的预测。因此，该模型比有向模型收敛得更晚。\n\
  \n*   **预测下一句**：模型在句子对上进行训练，并被要求预测源文本中的第二个句子是否为下一句。用于训练的输入句子对中，50% 的情况下第二个句子来自原文，50%\
  \ 的情况下为随机句子。为了在训练期间区分两个句子，输入按 图 4 所示进行处理：\n\n    ![Figure 4. Token embeddings.](img/fig15_4_B.jpg)\n\
  \n    图 4. Token 嵌入.\n\n*   一个 `[CLS]` 标记被添加到第一个句子的开头，一个 `[SEP]` 标记被添加到每个句子的末尾。每个标记都有一个嵌入句子，表示句子\
  \ A 和句子 B。每个标记被赋予一个位置嵌入以标识其在序列中的位置。\n\n为了最小化两种策略的联合损失函数，在训练 `BERT` 模型时，`Masked LM`\
  \ 和 `Next Sentence Prediction` 被合并。最后，如 图 3 所示，模型可根据用户需求进行调整。\n\n#### 3.4 测试与验证\n\
  \n本节讨论的测试方法对股票预测的输入和输出设计进行了彻底分析和测试。\n\n##### 3.4.1 输入设计\n\n这通常涉及开发一组有效和无效输入，以检查原型是否能准确检测无效条件并抛出异常或错误。目前有大量股票可用。选取特定股票（如\
  \ `Tesla`）作为有效输入。然后我们将获取该股票的所有推文。情感分析使用这些推文作为输入。因为使用了 `BERT` 技术，推文将被转换为数学形式，即向量，随后用作情感分析的输入。\n\
  \n##### 3.4.2 输出设计\n\n当我们的算法处理原始推文时，它会查找停用词、表情符号和链接等。我们需要过滤推文以使模型高效运行。使用正则表达式清洗和过滤后的推文是结果之一\
  \ (`regex`)。然后将这些清洗后推文的情绪分为两类：正面和负面。\n\n我们在清洗后的推文上进行情感分析后得到平均正面推文，并可推断平均正面推文以产生期望输出：`BETTER\
  \ NOT TO BUY`（最好别买）、`NO HEAVY PROFITS`（无巨额利润）和 `CAN BE BOUGHT`（可买入）。\n\n##### 3.4.3\
  \ 测试\n\n模块通过单元测试针对综合设计进行测试。该过程的输入通常是编码过程中编译的模块。在单元测试过程中，所有模块通常被汇集并组合成一个更大的单元。\n\n\
  在实施过程中，以下流程给我们带来了障碍：\n\n*   **无关推文的移除**：在通过 `Twitter API` 获取推文时，捕获了多条无关推文、停用词、表情符号和链接。为解决此问题，我们必须在模型中使用特定术语和正则表达式过滤推文。\n\
  \n*   **推文更新**：由于每秒产生的关于股市的热门推文量巨大，我们在检索近期股票相关推文时遇到一些困难。因此，为获取所需数据量，我们尝试多次使用 `Twitter\
  \ API` 生成推文。我们也尝试扩展系统。我们试验了增加数据框的大小。在我们的模型中，转发推文无关紧要。移除转发推文后，数据量显著减少。\n\n### 4.\
  \ 结果与讨论\n\n使用一系列评估标准调查了建议模型的效率，以评估其区分正面和负面情绪的有效性。\n\n因为 `RMSE` 值始终小于 10，所以系统极其准确（公式\
  \ 1）。\n\n(1)\n\n```\nPrediction = \\frac{No.of\\ Positive}{No.of\\ Negative}\n```\n\
  \n\n\n\n如果预测值大于 1，股票将上涨；如果小于 1，股票将下跌。在将模型预测值与观测值进行比较时，通常会计算均方根偏差，也称为均方根误差（公式 2）。\n\
  \n以下是计算均方根误差（`RMSE`）值的通用公式：\n\n(2)\n\n```\nRMSE = \\sqrt{\\sum\\limits_{i = 1}^{N}\\\
  frac{{(predicted_{i} - actual_{i})}^{2}}{N}}\n```\n\n其中 `N` = 总预测数，`i` = 变量。\n\n\
  第一阶段将涉及对数据分类技术和股票预测算法相关文献的全面评估。为了构建一个可靠的系统，我们将能够通过文献研究来解决现有方案的不足并保留其优势，从而加强拟议安全解决方案设计的结构。图\
  \ 5 描绘了拟议解决方案的实施情况，包含所有相关的输入和输出参数。\n\n![图 5. RMSE 的样本实现结果。](img/fig15_5_B.jpg)\n\
  \n图 5. RMSE 的样本实现结果。\n\n基于 `RMSE` 的拟议方法准确性与其他方法的对比见 表 1。\n\n表 1. 性能对比。\n\n| 方法论\
  \ | RMSE |\n| --- | --- |\n| 拟议方法 | < 10 |\n| 线性回归 [Van, 2022] | 10 到 15 之间 |\n\
  | 结构相似性 [Long et al., 2019] | 12 到 15 之间 |\n| 格兰杰因果分析 [Mittal and Goel, 2012] |\
  \ 16 到 20 之间 |\n\n图 6 表示股票在时间线上的走势，并使用颜色标记来区分实际股票走势与系统预测的股票走势。通过该图表的股票预测，可以识别实际的股票走势。\n\
  \n![图 6. 实际股票与系统预测股票之间的图形化表示。](img/fig15_6_C.jpg)\n\n图 6. 实际股票与系统预测股票之间的图形化表示。\n\
  \n### 5. 结论\n\n目标是将拟议技术用于造福股市投资者。该技术专注于利用推文的情感分析来预测股价。该模型使用 `NLP` 流水线，结合联邦学习方法和\
  \ Twitter 推文，训练一个更新后的 `BERT` 模型，以预测其看涨和看跌的股票情绪。`BERT` 是一种前沿的 `NLP` 模型，已在多个领域显示出成效。`BERT`\
  \ 能够提高多项自然语言处理和语言建模任务的准确率（或 F1 值）。\n\n本研究的主要贡献在于，它使得将半监督学习应用于各种 `NLP` 任务成为可能，从而促进了\
  \ `NLP` 领域的迁移学习。这些特性促使我们使用 `BERT` 来提高当前模型的准确性。我们的模型相当清晰，并利用了简单的 Twitter 和机器学习接口。因此，可以得出结论：在财务理解方面，该模型更接近人类推理。通过引入不同的\
  \ Python 和机器学习库，它也简化了流程。该模型可以直接建议每位投资者是否投资，这是大多数现有模型所缺乏的。未来将会有更多开源文章出现。科技巨头将会被吸引过来。随着更多资金投入其中，能够准确预测股价的系统将会出现。在未来的工作中，将构建一种股票分类和预测算法，以解决现有系统的不足并创建一个新的、稳健的股票预测系统。通过将热门因子数据与在线来源股票数据相结合，也可以提高股市预测的准确性。\n\
