  \ Moyeenudin*,^(¹³)\n\n### 1. 简介\n\n一种称为联邦学习（FL）的人工智能分支能够训练多个模型（客户端），并将其学习成果结合起来创建单一的最终模型（服务器）。在下一轮开始之前，每个客户端模型都会使用上一轮的服务器模型进行更新\
  \ [1]。划分数据段、构建机器学习模型、利用区块链实现安全和隐私方法、构建数据通信架构以及联邦规模是 FL 数据划分的五大类别 [2]。其中，带有联邦评估模型的区块链聚合节点（AN）与传感器节点（SN）ID\
  \ 相连接，经过认证并存储在区块链中 [3]。因此，这些 AN 和 SN 分别已在私有链和公有链上完成认证。然而，当有人使用网络资源时，不受信任的节点会实施恶意行为。SN\
  \ 也容易受到恶意节点的攻击，且能量低、传输范围小、计算能力弱。恶意节点随后传播不准确的路由信息并增加重传次数，导致 SN 的能量迅速耗尽。SN 能量的快速耗散缩短了无线传感器网络的寿命。此外，当网络中存在恶意节点时，吞吐量和丢包率均会上升。系统会计算\
  \ SN 的信任值以消除网络中的有害节点。为实现安全路由，网络会综合考虑 SN 的信任值和剩余能量。此外，还采用非对称密钥密码系统来保障数据传输安全。仿真结果表明，该建议模型在高包投递率方面行之有效。聚合通常使用\
  \ FL。一个容易理解的例子是：某个数据集仅包含特定医院的乳腺癌患者数据。当客户端面临不同的特征空间但相同或可比的样本空间时，垂直数据划分便应运而生 [4]。利用实体对齐方法在客户端数据中发现重叠样本，并将这些重叠数据用于训练。来自多个国家机构的学生\
  \ GPA 数据集可能是一个合适的例子。评分标准和评估指标是特征空间的不同方面。水平和垂直数据划分用于创建混合数据划分。一个容易理解的例子是：一组大学希望构建一个\
  \ FL 系统并评估所有分校的学生表现。\n\n在选择 ML 模型时，通常会考虑来自数据集和问题陈述的 AI 模型。神经网络（NN）是最常用的模型之一。除了 NN，决策树也被采用，因为它们高效且易于理解。FL\
  \ 系统可能由同构或异构模型组成。在前一种情况下，所有客户端使用相同的模型，服务器使用梯度聚合。然而，在后一种情况下，由于每个客户端都有独特的模型，因此无需担心聚合问题。在异构模型的情况下，服务器端采用最大投票等集成方法来替代聚合技术。水平数据划分中多个客户端的数据集共享相同的属性，但样本空间交集有限。FL\
  \ 的隐私保护方法是备受关注的部分。主要目标是防止客户端信息泄露 [5]。\n\n\n\n\n在没有加密的情况下，服务器可以利用学习梯度解密客户端数据。因此，隐藏梯度至关重要。在联邦学习（FL）系统中，通常使用密码学技术来解决隐私问题和差分隐私。为了伪装数据或模型参数的梯度，差分隐私方法被用作一种技术，并引入随机噪声。由于噪声增加是一个巨大的劣势，该方法会显著降低模型准确性。FL\
  \ 系统中常用的隐私技术包括使用同态加密将一个数据集转换为另一个数据集，这种方法通过安全多方计算协助进行计算。该过程应用于拥有加密数据的真实客户端向服务器发送数据，服务器获得结果，最后对加密的输入和输出进行解密。尽管这些技术能防范各种威胁，但它们计算开销大。FL\
  \ 系统分为中心化和去中心化两种类型。这两种架构的工作方式相似；区别在于客户端-服务器通信 [6]。如果架构是中心化的，我们会有一个充当服务器的不同模型，所有参数修改都在该全局模型中进行。在中心化\
  \ FL 系统中，学习可以是同步的，也可以是异步的，我们将在下文中探讨。去中心化设计与客户端轮流充当服务器的设计有所不同。每个周期，会随机选择一个客户端来更新全局模型，并将全局模型传达给其他客户端。去中心化\
  \ FL 系统开发难度大，通常分为三类：P2P、图或区块链。本章不涉及这些主题；将在后续章节中介绍。联邦规模 跨孤岛和跨设备联邦规模是两种主要类型。将跨孤岛类比为企业、跨设备类比为移动设备，最容易理解这些区别。跨孤岛通常客户端数量少但计算能力强。跨设备的客户端数量巨大，但计算能力较弱。我们可以依赖组织（跨孤岛）始终可用于训练，但这并不等同于可靠性。至于移动电话（跨设备）。糟糕的网络可能会使设备难以访问\
  \ [7]。\n\n### 2. 文献综述\n\n#### 2.1 面向物联网的联邦学习\n\n联邦学习是人工智能的一个新分支，属于机器学习范式，能最大限度地减少模型训练中的偏差并保护隐私。在每一轮联邦学习中，会选择多个客户端（如企业、数据中心、物联网设备或移动设备）在内部训练数据以生成全局模型，因为原始数据存储在客户端的数据库中，不进行交易或传输\
  \ [8]。最近，物联网联邦学习利用区块链确保数据真实性，以吸引足够的客户端数据和计算资源进行训练。然而，缺乏系统且全面的架构设计，使得难以实现系统化开发和有效应对\
  \ HIoT 设备故障检测中数据异质性的挑战。在所提系统中，原始数据在本地存储。因此，中央服务器与客户端服务器通信以处理全局模型，从而了解酒店中的故障设备。设计中使用区块链技术，为客人数据提供可证明的真实性，并为客人完成调查的贡献提供经济激励。以减轻数据相似性和客人单调回答的影响。虽然本章对托管以协调客户端服务器的联邦学习模块有主要贡献，但为了通过未来开发修改设计，将模块从客人服务器转移到计算和存储能力更强的客人设备上。此外，我们打算更详细地研究如何使客户端设备在聚合过程中更加可靠\
  \ [9]。\n\n#### 2.2 在线旅行社（OTA）的酒店客房预订\n\n如果某条道路交通拥堵，应用程序可能会建议一条不同的路线到达目的地。同样，当我们寻找酒店预订即将到来的家庭度假时，经常会阅读大量客户评价。TripAdvisor\
  \ 或 Booking.com 等网站几乎提供所有信息，包括场所的清洁度、员工的客户服务技能等。酒店拥有已入住客人和即将入住客人的各类数据，在不将机密用户数据发送到服务器的情况下，联邦学习是一种机器学习框架，使研究人员能够利用用户数据训练统计模型。它是一种分布式训练技术，训练和测试在边缘本地进行，仅将元数据传输到中心服务器，该服务器将众多模型更新（来自不同客户端）整合为一个新模型，以解决诸如车祸、交通拥堵、警察测速陷阱、路边停车等问题。结果，其他用户可以从这种协作中受益，做出更明智的驾驶选择。作为一个简单的例子\
  \ [10]。\n\n#### 2.3 水平数据分区\n\n大多数 FL 架构使用水平分区。由于能够为所有客户端使用相似的模型，服务器端的聚合变得更简单。其概念是利用高度分散的平台外包特定流程。这种方法被分解为离散的、简单的任务，新手可在短时间内完成。这些任务可能包括。越来越多的应用领域使用种类繁多的客户端，包括手机和物联网设备。大多数现有的联邦学习算法假设本地模型与全局模型共享通用架构。最近创建了一个新的联邦学习框架，以满足具有各种计算和通信能力的异构客户端的需求。在仍提供单一精确全局推理模型的同时，HeteroFL\
  \ 方法能够实现具有动态可变计算和同分布数据复杂度的异构本地模型的训练。最后，利用 Amazon Mechanical Turk 等众包平台加速机器学习开发相当普遍\
  \ [11]。\n\n酒店的物联网设备在保持客人满意度方面发挥着关键作用，它们还与酒店的各种应用程序协调，进而通过数字设备的反馈和在线旅行社（OTA）提高入住率。这些是在线网站，作为酒店入住率的来源，客户可以在上面留下入住反馈，这有助于根据需求选择酒店；酒店存在故障机制可能会降低入住率\
  \ [12]。\n\n#### 2.4 分布式系统\n\n\n\n\n# Pattern Analysis in Distributed Systems\n\n\
  In distributed systems, pattern analysis techniques usually have a wider range of\
  \ applications. The main goal of pattern analysis is to find structurally similar\
  \ patterns in databases. Retail enterprises utilize consumer purchasing patterns\
  \ to update inventory levels as a carefully designed key decision-making mechanism\
  \ to gain an advantage over competitors. Enterprises adopt modeling techniques to\
  \ understand customer behavior. For example, customer purchasing trends for specific\
  \ services or goods, price and timing preferences, and the effectiveness of post-analysis\
  \ decisions. This analysis helps retail enterprises provide better customer service,\
  \ thereby increasing revenue. Retail organizations and enterprises need cutting-edge\
  \ technology and need to continuously search for data to maintain market dynamics.\
  \ This raises the question: Can data be transferred within the enterprise using\
  \ multiple databases and combined in a common location? Maintaining databases for\
  \ the number of points of sale is extremely difficult, if not impossible. Mobile\
  \ wireless point-of-sale (POS) devices are also commonly used in stores that utilize\
  \ real-time data to complete sales transactions. The exchange of data sources is\
  \ often hindered by obstacles. Pattern analysis techniques require multiple types\
  \ of data. For example, in product recommendation systems, the enterprise or owner\
  \ has records (product information and user purchase data) but lacks information\
  \ specifying payment habits and purchasing power. Existing databases exist in the\
  \ form of small silos in most industries. This is the result of fierce market competition,\
  \ customer privacy concerns, challenging administrative processes, and even resistance\
  \ to data integration within departments. Therefore, combining different data from\
  \ various institutions and agencies across the country is economically impractical,\
  \ if not impossible [13].\n\n#### 2.5 Blockchain Data Security\n\nDue to the increase\
  \ in incidents involving data and user privacy, companies attach great importance\
  \ to data security issues. Data breaches not only damage corporate reputation but\
  \ also attract public and government attention. For example, the recent Facebook\
  \ data hacking incident triggered various complaints. Therefore, some US states\
  \ have re-examined their data protection legislation. The development and use of\
  \ `GDPR` is the best example of data enforcement. The law grants users the legal\
  \ guarantee to request erasure or withdrawal of their data. Companies found violating\
  \ the law will face severe fines. Both China and the US have taken similar measures.\
  \ The `Cybersecurity Law` and `General Principles of Civil Law` mandate data security.\
  \ To prevent data breach issues when conducting data transactions with other parties,\
  \ the law also enforces contracts (legally binding and protective). They ensure\
  \ contracts comply with legal data protection requirements. These legal obligations\
  \ and the adoption of new legislation create a secure data society. However, applying\
  \ popular pattern analysis techniques to data without disclosing it raises a new\
  \ problem [14].\n\nThe transaction models used in pattern analysis models usually\
  \ contain stages such as data collection, data transmission to the server, data\
  \ cleaning, and implementation of fusion requirements by all parties. Then, depending\
  \ on the application, the cleaned data used by third parties is used for integration,\
  \ construction, and extraction of patterns, helping to create models suitable for\
  \ making judgments. Usually, they provide the model as a service to other enterprises.\
  \ Due to the legal binding force of data protection laws, the following new data\
  \ regulations and legislation now face problems. Traditional methods violate laws\
  \ such as `GDPR` because users do not know how the model will be used in the future\
  \ [15].\n\nTo create a smart home system, appliance manufacturers are committed\
  \ to obtaining consumer feedback to improve their products and services. We created\
  \ a Federated Learning (`FL`) system using a reputation mechanism to help appliance\
  \ manufacturers train machine learning models based on consumer data, assisting\
  \ manufacturers in developing smart home systems. Manufacturers can then predict\
  \ future consumer demands and consumption patterns. System operation is divided\
  \ into two parts. First, users use mobile devices and Mobile Edge Computing (`MEC`)\
  \ servers to train the manufacturer's initial model. Customers use smartphones to\
  \ collect data from various home appliances, subsequently downloading and training\
  \ the base model using local data. After obtaining the signed models from regional\
  \ customers, they transmit them to the blockchain. If the user or manufacturer behaves\
  \ maliciously, we use the blockchain to replace the centralized aggregator of the\
  \ standard `FL` system. The immutability of blockchain records makes it possible\
  \ to track the behavior of dishonest buyers or producers. In the second phase, the\
  \ manufacturer selects specific individuals or groups as miners, who will use the\
  \ models received from customers to compute the average model. At the end of the\
  \ crowdsourcing work, one of the miners elected as the temporary leader uploads\
  \ the model to the blockchain. We impose Differential Privacy (`DP`) on the retrieved\
  \ features and provide a novel normalization method to protect customer privacy\
  \ while enhancing test accuracy. We demonstrate through experiments that when `DP`\
  \ protection is applied to features, our normalization method outperforms Batch\
  \ Normalization. In addition, we created an incentive system to reward participants\
  \ to encourage more users to participate in crowdsourcing `FL` work [16].\n\n###\
  \ 3. Federated Learning\n\nFederated Learning is very similar to distributed learning,\
  \ and the two are closely related. Traditional distributed systems consist of distributed\
  \ computing and distributed storage. In some respects, distributed computing is\
  \ similar to the first model update `FL` proposed for Android clients. Although\
  \ `FL` strongly emphasizes privacy protection, the latest research in distributed\
  \ machine learning also pays great attention to privacy-preserving distributed systems.\
  \ Using communication networks, multiple computers at different locations can be\
  \ connected and managed by a central server to perform distributed processing, where\
  \ each computer completes various components of a single task. Therefore, `FL` focuses\
  \ on developing collaborative models without leaking privacy, while distributed\
  \ processing mainly focuses on accelerating processing steps. To more specifically\
  \ clarify the differences between distributed learning and the following `FL` characteristics:\
  \ Universality in multi-organizational scenarios. `FL` proposed by Google is essentially\
  \ an encrypted distributed machine learning technology that enables users to jointly\
  \ create training models while keeping the underlying data localized.\n\n\n\n\n\
  联邦学习（FL）的基本概念已扩展，涵盖了任何保护隐私的去中心化协作机器学习方法。因此，FL 可以在协作学习环境中处理按特征垂直划分的数据和按样本水平划分的数据。通过扩展\
  \ FL，跨组织企业可被整合进联邦框架。例如，拥有客户购买力信息的银行可与掌握产品特征信息的在线市场合作，推荐购买。因此，为众多实体智能地创建联合模型 [17]。不同的特征维度和多样的数据源使得每个人都能在坚持数据隐私设备数量的前提下，收获跨平台与本地协同创造的价值。显然，FL\
  \ 更适合这种情况下的模型改进。由于设备资源的多样性，FL 关注的是非平衡和非独立同分布（non-IID）数据，这与主要关注平衡和独立同分布（IID）数据分布的分布式系统形成对比。这项技术是去中心化的。从技术上讲，去中心化并不意味着完全去中心化，但也不意味着存在一个固定的中心\
  \ [18]。\n\n去中心化仅用于分散中心节点的知识。每个客户端都会影响中心模型；不存在对它们进行分类的中心。客户端创建的网络将因节点间的影响而提供非线性关系。\n\
  \n主要由参数服务器使用的中心服务器主导数据分布，利用典型的分布式集中式技术和算力创建高效的协作范式。这种集中式数据处理技术存在双重通信开销。因为如果收集分散在各个数据库中的数据集进行训练，这些数据首先需要被复制，然后发送到中心服务器。接着，中心服务器将数据分发给每个分布式客户端进行分布式计算。这加剧了系统对算力、存储和带宽的严格要求。在\
  \ FL 场景中，每个客户端是独立的，数据不由中心分发，训练不由服务器控制。FL 是一个通过去中心化协作整合数据融合和机器学习模型的系统 [19]。\n\n在\
  \ FL 中，海量非独立同分布数据存在于数万个边缘节点和移动设备中。每个节点的数据容量仅限于节点总数。而在分布式系统中，根本目标是提高并行度，以减轻中央服务器的计算或存储工作负载。分布式系统中的节点数量不可能像\
  \ FL 那样多。世界现已进入可穿戴技术广泛用于健康监测的时代。每个设备仅产生少量数据，使其无法与总量相提并论。随着存储和处理能力的增强，数据科学在工业工程中的价值变得越来越清晰。近年来，工业工程见证了人工智能、机器学习、智能制造和深度学习的快速发展。然而，该领域数据科学的发展面临两大障碍。首要因素是数据治理。部分信息因法律原因被私有化。得益于《通用数据保护条例》（GDPR），用户现拥有对其数据的完全所有权。未经事先同意，任何机构或组织均不得使用用户数据。其次，数据孤岛是另一个阻碍现代工业增长的棘手问题，因为它们需要额外的训练。数据将提升训练效果\
  \ [20]。例如，由人类和机器产生的国际象棋数据，与最早的模型相比，Alpha Zero 能够击败专家。此外，医疗等某些行业的数据标注依赖专业人士，这可能增加正确数据的稀缺性。缺乏标签数据也阻碍了行业发展。为应对行业中的这些困难，FL\
  \ 应运而生。FL 是一种新兴的机器学习策略，旨在在保护数据隐私的同时解决数据孤岛问题。对于去中心化机器学习设置，它指多个客户端与一个或多个中心服务器协调。Google\
  \ 于 2016 年首次提出，旨在在数万台 Android 设备上预测用户的文本输入 [21]。\n\n#### 3.1 基于区块链的联邦学习\n\n近年来，支持\
  \ HIoT（酒店物联网）的智能酒店系统备受青睐，因为它们旨在提升生活质量。根据统计分析，到 2022 年全球将有许多智能酒店。智能手机、现代无线通信、云与边缘计算、大数据分析和人工智能（AI）等物联网设备，主要使这一智能酒店概念成为可能。这些尖端技术使制造商能保持其智能酒店设备间的顺畅连接。随着智能酒店技术的普及，产生了海量数据。联邦学习（FL）使分析师无需将数据上传至中心化服务器，即可在去中心化方式下研究和利用本地生成的数据。区块链即使数据在本地保存，也能良好维护其功能。我们开发了一种基于\
  \ FL 的系统，利用消费者设备生成的数据，高效便捷地协助酒店设施。手机用于定期收集家用电器数据并训练系统，该系统将家庭中同品牌的酒店设施视为一个单元。由于移动设备算力受限和电池寿命有限，创建了本地机器学习模型；将部分训练任务卸载到边缘计算服务器\
  \ [22]。然后，通过区块链智能合约对用户提供的本地训练模型总和求平均，创建全局模型。源数据旨在以这种联邦方式确保安全和隐私。然而，研究表明梯度更新可能泄露大量关于客户端训练记录的信息。攻击者可从客户端上传的梯度中恢复数据。此外，联邦模型训练方法易受模型投毒攻击。此外，第三方拥有的移动边缘计算（MEC）服务器存在信息泄露风险。我们利用区块链技术和差分隐私克服上述安全和隐私挑战。值得注意的是，Apple\
  \ 正在 FL 中有效实施 DP，以增强其知名语音助手服务的隐私。制造商专门上传带有初始化参数的早期模型。客户可从区块链获取模型，并用本地数据进行训练 [23]。\n\
