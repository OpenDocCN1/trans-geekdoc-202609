  \n\n\n\n\n## 第 7 章 云环境中用于数据丢失防护的高效联邦学习技术\n\n*A Peter Soosai Anandaraj*，^(⁷)\n\n\
  ### 1. 简介\n\n在大数据时代，数据安全已成为主要的保护类型，因为实际上所有信息都通过网络传输。尽管网络信息安全保护机制取得了重大进展，但隐私问题和敏感信息泄露依然存在\
  \ [1]。机器学习是大数据时代最流行的数据分析和处理方法，因计算机计算能力的进步而被广泛应用于各个行业。然而，机器学习发展面临两大问题。一方面，维护数据安全颇具挑战，且对隐私保护的担忧日益加剧。另一方面，随着大数据成为新趋势，企业收紧数据保护措施以防止数据泄露，导致数据共享减少。机器学习在为训练传输数据时遇到的困难，正是导致数据孤岛的原因。利用一种名为联邦学习的前沿机器学习架构，相互戒备的客户端仍可从协作训练模型中获益，而无需在公开场合披露其机密信息集\
  \ [3]。联邦学习也被称为去中心化 ML 框架。由于网络带宽受限，云服务器与客户端之间巨大的通信开销已成为主要问题。此外，还可利用相同的模型参数发起模型反演攻击。\n\
  \n一个组合模型存储在云服务器上，而训练数据分散在多个设备上。客户可借助联邦学习这一开创性的机器学习设计，在保护其个人数据机密性的前提下，从协作训练技术中受益。它也被称为去中心化\
  \ ML 框架 [5]。训练数据分布在多个设备上，组合模型存储在在线计算机上。然而，云服务器与客户端之间的高传输开销，以及模型反演攻击，已浮现为主要问题。\n\n\
  联邦学习 (FL) 是一种无需透露原始训练数据即可支持分布式协作学习的潜在方法 [2]。FL 在此提供了一个直接的解决方案。即通过将数据保留在本地，一个组合模型存储在云服务器上，而训练数据分散在多个设备上。客户可利用\
  \ FL 这一革命性的 ML 设计，通过协作训练方法保护其私人信息的隐私。这是通过检测数据泄露和 ATO（账户接管）欺诈来实现的。此外，它还会检查信用评分并学习用户的足迹，以在不上传数据到云端的情况下防止欺诈性\
  \ KYC [7]。FL 为金融科技风险缓解铺平了道路。它为客户和企业开发独特且创新的技术 [4]。它在双方之间建立信任。也允许他们推进合作关系。随着技术进步，信息量呈爆发式增长。因此，实施了更多隐私法规来保护此类信息。许多企业已开始采用联邦学习。它们在不同数据集上训练算法，而无需传输数据。联邦学习旨在保护通过多个渠道获取的数据。同时将关键信息保留在本地\
  \ [6]。FL 是一种技术，可在设备上进行机器学习，而无需将用户的私人数据发送到中央云。因此，联邦学习有助于实现个性化。以及提升物联网应用中的设备性能。最近，本研究讨论了采用\
  \ FL 方法面临的当前障碍，以及其在医疗 AI、物联网、边缘系统和自治企业等实时系统中的改进，这些领域未来在实际应用中可扩展采用 FL。\n\n尽管面临数据不平衡、资源分配和隐私担忧等障碍，本研究重点关注云计算中的联邦学习技术，以及\
  \ FL 面临的核心挑战，这些挑战可能包括联邦网络间的有效高效通信、系统异构性管理，以及同一网络内的统计异构性 [8]。\n\n随后，这些信息被用于开发有洞察力的推断模型或提供洞见。这些因素使得该策略不再可行。首先，数据所有者对隐私的关注日益增加。为解决大数据时代消费者的隐私担忧，已颁布多项数据隐私法规，包括美国的消费者隐私权利\
  \ [11] 和欧洲的 GDPR [10]。\n\n\n\n\n# 联邦学习概述\n\n在终端设备上，DNN 模型通过联邦学习（FL）联合训练。FL 训练操作通常由两个过程组成：最终设备上的区域模拟以及\
  \ FL 服务器上变更属性的全球收集。为了推广 FL 的本地模型训练，我们在本节中首先概述 DNN 原型实验。尽管 FL 可用于一般性地训练 ML 模型，但我们在本部分重点讨论\
  \ DNN 模型的训练，因为我们在下一节讨论的大多数文章都关注 DNN 模型的联邦训练。DNN 模型易于聚合且在许多情况下优于传统 ML 技术这一事实 [16]，因此随着分布式终端设备获得的深度学习（DL）不断扩展、处理能力增强以及数据量增长，FL\
  \ 在移动边缘网络中的有机采用理应得到促进。\n\nFL 的开发是为了回应数据所有者的隐私担忧 [21]。FL 通过允许用户联合训练同一框架并将数据保留在其设备上，消除了客户的隐私顾虑。因此，FL\
  \ 可能是一种使移动边缘网络能够训练 ML 模型的解决方案。有关各种 FL 可能性的摘要，包括并行 FL 和直立 FL（直译：straight up FL）。\n\
  \n### 2. 相关工作\n\n联邦学习（FL）作为一项开创性技术，通过安全机制解决了保护个人信息的问题，它允许用户在保持对数据的本地控制的同时共同开发全局模型。平台聚合模型直到收敛，而客户端训练其本地模型。在此过程中，服务器采用奖励结构以鼓励用户提供大量高质量数据。\n\
  \n尽管已有一些工作将 FL 应用于物联网（IoT）、医疗、工业和补充领域，但 FL 应用仍处于起步阶段，仍有若干问题未得到解决 [9]。如今，提高 FL 模型质量是热门研究课题之一，也是难点问题之一。本文客观且深入地探讨了提高\
  \ FL 模型质量的方法。由于从业者经常担心实现隐私保护需要以牺牲学习质量为代价，我们特别关注 FL 的研究与应用发展，以及 FL 与非 FL 之间的影响对比\
  \ [10]。我们系统地评估了现有的 FL 相关文献。本综述提供的信息和见解可能对学术界和业界人士均有用处。我们考察了影响 FL 模型质量的关键因素、学术界和工业界\
  \ FL 应用研究的趋势，以及 FL 与非 FL 算法在学习方面的有效性对比。基于调查结果，我们提出了一些提升 FL 模型质量的建议。\n\n如今，大量联网设备（包括手机、可穿戴技术和自动驾驶汽车）产生海量数据（大数据）。由于这些设备处理能力的快速提升以及隐私担忧，本地存储和分析数据的需求日益增长，这促使计算从云端向边缘转移。为了充分挖掘大数据的潜力，需要人工智能（AI）：深度学习已被证明在从复杂数据中提取知识方面非常成功。深度神经网络设计已被证明在对著名\
  \ ImageNet 数据集的照片进行分类方面表现优于人类。由于传统机器学习算法要求所有数据必须汇聚在一处（通常是云数据中心），因此可能违反用户隐私和数据保密法律。科技公司在世界许多不同地区处理用户数据时，现已被要求遵守用户隐私规则。一个例子是欧盟的《通用数据保护条例》。\n\
  \n联邦学习是一种可行的方法，可利用网络边缘设备的海量多样化数据集和不断增强的处理能力，同时保护所用数据的隐私。由于金融和医疗应用处理的数据敏感且难以共享，因此必须保证隐私。即使已有少数\
  \ FL 在商业环境中成功应用的实例，但在这些架构常用于常规应用之前，仍必须解决若干研究问题 [11]。FL 已成为一种前沿范式，以回应对个人数据安全的担忧，以及智能手机、可穿戴设备和无人驾驶车辆等小工具计算能力的增强\
  \ [13]。由于对个人数据存储的需求增加，以及在最小化数据传输额外开销的同时将 ML 计算移至终端设备，科学家们已尝试在一些学科中改造 FL 架构 [12]。联邦学习类似于小组演示或报告，涉及众多人员远程共享数据，以联合训练单一深度学习模型并逐步改进它。模型（通常是先前已训练的基础模型）从云数据中心分发给每位参与者。模型使用其个人数据更新后，会被汇总并加密。修改后的模型被发回云端，在那里被平均、加密并集成到原始模型中。直到模型完全训练完成，协作训练将迭代进行。\n\
  \n在联邦学习基础设施中，应优先考虑同步还是异步训练方法，这是一个关键的设计选择。异步训练已被许多成功的深度学习研究采用，例如 Dean 等人 (2012) 的研究，但最近，同步大批量训练逐渐增加，甚至在数据中心中也是如此（Goyal\
  \ 等人，2017；Smith 等人，2018）[14]。McMahan 等人 (2017) 的联邦平均算法采用了类似的方法。此外，一些改进 FL 隐私保证的方法，如差分隐私（McMahan\
  \ 等人，2018）和安全聚合（Bonawitz 等人，2017），本质上要求在一组固定设备上进行某种形式的同步，以确保学习算法的服务端组件只需使用来自多个用户的更新的简单聚合\
  \ [15]。\n\n\n\n\n# 大规模基于云的系统与联邦学习综述\n\n## 1. 背景与动机\n\n大规模基于云的系统已被广泛描述并投入实践应用，分布式机器学习领域也取得了显著进展。许多系统（如\
  \ Dean et al., 2012; Low et al., 2012 所述）支持多种分发策略，例如模型并行和数据并行。由于虚拟化技术使得节点拥有比移动设备显著更高的带宽和可靠性，我们的解决方案采用了一种更有组织的方法，以适应移动设备领域。我们选择同步联邦学习（FL）协议，而非专注于临时的分布式计算架构。\n\
  \n根据 Brisimi TS et al. (2018) 的研究，本研究旨在提供一种分布式（联邦）方法，基于电子健康记录（EHR）中记录的病史，预测心脏病患者一年内的住院情况。每位患者的记录可能保存在其他机构的\
  \ EHR 系统中或其智能手机上。为了创建全局住院预测模型，多方利益相关者（代理）必须在所有情况下进行协作。\n\n该问题被构建为二元监督分类问题，并将开发一种分布式软间距\
  \ L1 正则化（稀疏）支持向量机（sSVM）技术。选择 SVM 是因为它们是有效的分类器，且对住院预测具有高度可预测性。稀疏分类器还能提供极少的预测数据，以便于预测结果的解释。凭借这种领域专业知识，我们可以从系统角度针对特定用例进行优化。\n\
  \n参数向量、参数服务器（被 Li et al., 2014; Dean et al., 2012; Abadi et al., 2016 使用）是在数据中心中一种特别流行的方法，因为它允许多名员工协作共同构建一个全局模型。该领域的研究重点在于开发能够成功管理维度从\
  \ `10⁹` 到 `10¹²` 的向量的服务器架构。工作节点通过参数服务器异步访问和修改全局状态。由于我们需要设备组与 FL 服务器之间精确的会合（rendezvous），以使用安全聚合执行同步更新，因此我们的方法本质上无法与这种全局状态协同工作。\n\
  \n目前，研究者特别关注解决与医疗数据相关的问题：\n1. 数据分散在不同位置（如医院、医生办公室、家用设备、患者智能手机）；\n2. 数据可用性不断增长，使得可扩展结构变得至关重要；\n\
  3. 由于规模和/或数据隐私问题，将数据收集到单一存储库中既不切实际也不合乎需求。\n\n集中式数据存储虽然能利用匿名化技术（如 k-匿名性 [[13]](#ch7.xhtml#ref7_13)），但也造成了单点攻击或故障，并可能导致数据泄露暴露大量个人的身份信息。中心数据存储库还必须应对信息治理挑战，如获取处理和存储授权，并进行大规模基础设施投入。我们方案支持从完全集中式到完全去中心化的各种配置，这是其主要应用优势之一。\n\
  \n我们将这一医疗挑战构建为二元分类问题。存在两层信息处理：患者层（例如使用智能手机）和医院层（管理患者数据）。中心数据存储库同样面临信息治理挑战，如获取处理和存储授权，以及大规模基础设施投入。我们方案支持从完全集中式到完全去中心化的各种配置，这是其主要应用优势之一。我们将这一医疗挑战构建为二元分类问题。存在两层信息处理：患者层（例如使用移动设备）和医院层（分析患者数据）。\n\
  \n## 2. 联邦学习的演进\n\n“联邦学习”这一术语由 Google 于 2016 年首次提出，正值个人数据使用与开发引起国际关注之时。Cambridge\
  \ Analytica 事件让 Facebook 等网站用户更加意识到在线披露个人信息的风险。这也引发了关于在线监控规模的更广泛讨论，这种监控往往在用户不知情的情况下进行。同时，一系列高调数据泄露事件削弱了公众对企业保护个人信息能力的信任。当作为广告驱动型数字平台中心的加利福尼亚州批准了欧洲的综合数据隐私政策\
  \ GDPR 后，其他州迅速跟进。此后，巴西、阿根廷和加拿大等国也相继辩论或通过了数字隐私立法。\n\n大量个人远程共享数据，共同训练单一深度学习模型并迭代改进，这类似于团队演示或报告。每位参与者从云数据中心接收模型（通常是预训练的基础模型）。他们使用自己的数据训练模型，在求和和加密模型的新配置之前进行本地更新。模型更新被发送回云端，在那里被平均、加密并与中心模型结合。协作训练过程迭代执行，直到模型完全训练完成。\n\
  \n## 3. 系统设计\n\n联邦学习类似于群组对话或报告，涉及众多人员远程共享数据，共同训练单一深度学习模型并逐步改进 [[15]](#ch7.xhtml#ref7_15)。云数据中心向每个客户提供一个独特的模型（通常是已完成训练的简单模型）。他们使用自己的数据训练模型，随后进行汇总和加密。更新后的模型传回服务器，在那里被平均、加密并与基础模型集成。协作训练迭代执行，直到原型模型完全胜任。\n\
  \n这种分散式训练方法存在三个不同版本。在水平联邦学习中，主要模型在可比数据集上训练 [[17]](#ch7.xhtml#ref7_17)。水平分区联邦学习（HFL）使用分散在孤岛中的数据，这些数据共享相同的特征空间但包含不同样本。在垂直联邦学习中，数据是互补的；例如，整合电影和书籍评价以预测一个人的音乐品味。最后，联邦迁移学习涉及在一个已预训练完成特定任务（如检测汽车）的基础模型上，使用不同数据集进行训练以完成另一任务（如识别猫）。Baracaldo\
  \ 及其同事正在将基础模型纳入联邦学习。从分散在孤岛中、涉及多种特征空间和样本的数据中学习的技术被称为联邦迁移学习（FTL）。\n\n传统上，数据从多个来源收集后再整合用于机器学习模型。数据湖、数据仓库或两者的湖仓混合体可作为这一中心点。你选择一种算法（如决策树）或一组算法（如上述神经网络），在收集的数据上进行训练。创建的模型随后可在主服务器上执行，或分发到各设备上。\n\
  \n\n\n\n# 联邦学习系统设计与效率优化\n\n## 联邦学习面临的主要挑战\n\n联邦学习是一种简单且广泛使用的方法，但它存在显著缺陷，特别是在当代物联网基础设施中，新鲜数据持续在计算机网络边缘产生。以下是集中式机器学习目前面临的主要问题：\n\
  \n- **网络延迟**：实时应用需要能够极快反应的模型。如果在服务器上执行，数据传输延迟始终是一种可能性。\n- **连接性问题**：同样，多个设备与主计算机之间的有效数据传输需要可靠的互联网连接。\n\
  - **数据隐私担忧**：例如，图片和转录文本可能有助于开发智能应用，但也可能包含不应公开的私人信息。\n\n在一个潜在用例中，银行可能训练一个 AI 模型以发现欺诈，然后将其用于不同目的。在\
  \ Google 最初的联邦学习用例中，数据分散在最终用户设备上，并通过联邦 SGD 和平均算法利用远程数据来增强中央模型 [20]。如果改进中央管理模型是系统的主要目标，在联邦学习语境下可称为“模型中心”或“model-centric”。本地生成的数据仍然是去中心化的。每个客户端仅存储自己的数据；无法读取其他客户端的数据。数据不是随机或一致分布的。两种常用的联邦学习模型是跨孤岛和跨设备。跨孤岛环境中的学习需要利用包含来自不同用户信息的数据库。例如，医疗分析服务器可以通过融合医院和诊所的数据来分析医疗记录。相反，跨设备设置侧重于跨用户设备进行学习，这些设备包含由单个用户生成的数据。跨设备是联邦学习的首次应用，Google\
  \ 利用 GBoard 的用户数据训练下一个词预测模型。\n\n## 六步设计联邦学习系统\n\n### 步骤 1：模型框架选择\n\n选择将协助您实现底层模型的模型架构是第一步。您选择的模型框架必须能够在应用程序格式中使用某些联邦学习元素。领域（如成像、NLP\
  \ 或表格数据）、团队技术能力以及框架与现有基础设施的兼容性是其他选择标准。\n\n### 步骤 2：探索并确定网络机制\n\n下一步是决定使用的网络策略。这是联邦学习网络参与者用于交换指令的通信架构。根据应用程序是在企业内部使用还是跨组织外部使用，做出网络框架和核心模型框架的选择。后一种情况的决策必须得到所有相关组织的认可。我们现在拥有开始构建联邦学习方案所需的基础要素。\n\
  \n### 步骤 3：构建集成服务\n\n此层级需要构建集中式服务。该服务将监督组织参与者通信和监督训练过程。从功能角度看，该服务可能需要保证无状态以协助负载均衡，这要求选择一种存储机制来保存客户端间传递的中间数据，包含认证和授权机制，以及保持其可靠的支持结构。必须建立并维护一个系统，以满足联邦学习系统的要求并具备进行训练会话的能力。\n\
  \n### 步骤 4：客户端系统设计\n\n现在需要考虑可能的客户端系统设计。该系统必须能够与中央服务通信模型参数并执行客户端侧的学习过程。客户端系统还需要跨额外网络设备的局部变量来更新本地模型。为创建和部署可靠的客户端应用程序，您应尝试解决以下问题。\n\
  \n### 步骤 5：设置训练流程并运营模型管理系统\n\n联邦学习系统需要知道在特定时间槽应利用哪些私有客户端数据来指导区域模型。中央服务或其他个人必须提供此数据。保存关于可用数据的元数据（通常由主要服务处理）至关重要。客户端还必须注册其他客户端可访问的数据集的元数据。需要通过查询从中央服务器检索指示每个客户端应使用哪些集合进行课程的类似元数据。训练会话结束后，会生成一个机器学习框架。为了使训练好的模型能被适当用户使用，联邦学习系统必须处理模型指标和访问权限。\n\
  \n### 步骤 6：解决安全与隐私问题\n\n最终模型可在本地供一个或多人使用。上述框架通过跨多方分散权重构建，可能被反转以泄露用于训练的核心数据更多信息。因此，选择针对框架本身的合适风险至关重要。这些风险的两个例子是：重建可能包含敏感知识产权的训练集的可能性，或重新识别参与特定训练集人员的能力。\n\
  \n在将数据权重发送到中央服务之前应用不同的保密措施是降低这些风险的一种方法。通过设置隐私预算，您可以在最终设计的效用和您认为适当的风险水平之间取得平衡。\n\n\
