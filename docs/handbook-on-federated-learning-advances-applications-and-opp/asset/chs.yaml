  `L(Ŷ^(i), Y^(i)) = − (Y log Ŷ + (1 − Y) log (1 − Ŷ))`\n\n### (3)\n\n$$\\text{Output}\
  \ = \\left\\{ \\begin{matrix} {0 \\text{ if } \\hat{Y} \\leq t} \\\\ {1 \\text{\
  \ if } \\hat{Y} > t} \\\\ \\end{matrix} \\right.$$\n\n### 4. 评估\n\n以下概述了用于评判 BFDL\
  \ 和 REFDL 方法的标准。此外，它还提供了用于测试该方法的数据集的访问权限。\n\n#### 4.1 使用的数据集\n\n物联网数据集是来自九种商用物联网设备的多个代表性样本数据的集合，包含大量僵尸网络和良性网络流量流。BASHLITE\
  \ 和 Mirai 两种菌株都相当普遍，因此每个设备都感染了其中一种。更准确地说，我们随机选择了对物联网需求最大的八类设备。举几个例子如下：该套件包含以下产品：Ecoobee\
  \ 恒温器、Danmini 门铃、Ennio 门铃、Provision PT-838、Provision PT-737E、SimpleHome XCS-1002WHT、三星\
  \ SNH-1011-N 和 SimpleHome XCS-1003WHT。每个设备可跟踪 115 个属性向量，足以用数学方式表示网络流。这包括多种攻击类型，如\
  \ syn、ack、scan、trash、UDP、TCP、udpplain、combo 和 regular。因此，我们提出 N-BaIoT 数据集作为以设备为中心的物联网安全监控技术的基础。我们的\
  \ BFDL 和 REFDL 模型使用关联到 N-BaIoT 的商用设备的联邦数据进行训练和评估。\n\nWUSTL 数据集 [27, 28 and 29] 包含来自模拟\
  \ SCADA 系统的多个流量流。该数据集可能适用于研究 AI 算法在监控中的实用性。共有 7,037,983 个原始数据样本可供查看。为评估我们方法的有效性，我们考虑了\
  \ 471,545 次攻击和 6,566,438 个控制实例的出现频率。\n\n#### 4.2 虚拟员工队伍的实验性建立\n\n\n\n\n所有程序均在 `Python\
  \ 3.7` 中实现，并在一台配备四个 `2.10 GHz Intel Xeon E5–2695` 处理器和 `16 GB` 内存的个人电脑上进行测试。为估算内存消耗，我们创建了一个集成内存使用情况的配置文件\
  \ [30]。对于模拟的设备端训练，我们采用了 `PyTorch 1.4.0` [28] 和 `PySyft 0.2.9` 框架 [31]。使用 `Pysyft`\
  \ 框架创建虚拟工作节点轻而易举。对于 `BFDL` 和 `REFDL`，我们利用这些数字员工模拟了联邦学习（FL）设置。这些工作节点是真实虚拟机的仿真，能够在同一\
  \ `Python` 应用程序中与其数据一起独立运行 [32, 33]。每个客户端的虚拟工作节点模型在计算上更新后发送给协调服务器工作节点，后者是我们联邦训练计划的一部分。联邦客户端模型包含五个独特层：一个输入层、一个中间层、一个输出层以及两个额外层。为每个数据集选择拓扑结构，以优化性能指标并减少所需的进程数量\
  \ [34]。参数调整方法的结果表明，所检查的实验条件适合二分类。在比较 `BFDL` 与建议的 `REFDL` 方法的性能时，保持底层架构设置不变。每种 FL\
  \ 方法的部署模型架构见 表 1，以便于比较。`Wustl` 数据集的首选拓扑结构是基于调优方法报告的。\n\n**表 1. 各设备的正常与攻击分布及架构数据。**\n\
