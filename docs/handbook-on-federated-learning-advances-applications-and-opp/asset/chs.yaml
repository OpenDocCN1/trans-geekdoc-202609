  \n*G Arun Sampaul Thomas*,^(⁹)\n\n邮箱：mksamy14@yahoo.com; mailsathishcse@gmail.com;\
  \ Saravanan.krishnann@gmail.com\n\n### 1. 简介\n\n尽管技术不断进步，但研制新药的过程依然耗时且昂贵（被称为“Eroom\
  \ 定律”）。制药行业如今已意识到，与竞争对手企业和医疗机构建立合作伙伴关系，可能掌握扭转这一趋势的关键，从生成新先导化合物到优化临床试验，再到追踪长期后遗症。这既是受当前局限性驱动，也是其他同步进步推动下，在日常活动中持续应用机器学习的合乎逻辑的演进\
  \ [1, 6, 14]。\n\n联邦学习无需集中化训练数据即可实现协作式机器学习。与数据存储在云端的传统机器学习设置不同，联邦学习通过将所有训练数据保留在单个设备上来开发共享机器学习模型。这种方法提供了高水平的隐私和安全性，使其在医疗保健、银行和政府等法规严格的行业中尤为受益\
  \ [3]。\n\n借助联邦学习，用户可以在不泄露私人信息的前提下，享受个性化机器学习模型的优势。本文重点关注联邦学习及其各种应用，并着重阐述其如何造福医疗保健行业\
  \ [7]。\n\n#### 1.1 AI 与医疗保健\n\n联邦学习有潜力更快地将突破性的 AI 驱动创新推向市场和患者。此外，医疗保健行业因此可能迎来重大进展和发现。FL\
  \ 已展现出其改变游戏规则的能力，这源于 AI 在医疗保健领域的普遍应用。协作学习阐述了保护隐私的 FL 方法如何助力开发稳健的 AI 原型，使其在各行业中表现优异，即便在数据获取受限或涉及机密知识的行业亦是如此\
  \ [8, 9, 14, 16]。\n\n此外，该方法有助于捕捉更广泛的患者特征，例如年龄、性别和种族差异，这些差异可能具有高度的地域性。如此广泛的数据集很可能产生偏差更小、准确度更高的机器学习模型。随后，合格医疗从业者的专家意见可进一步提升不同\
  \ AI 模型的准确性 [5]。\n\n因此，联邦学习有潜力更快地将突破性的 AI 驱动技术推向市场和患者。它还可能给医疗保健部门带来巨大的改进和发现 [9]。虽然它源于医疗保健领域\
  \ AI 的广泛部署，但 FL 已证明其改变游戏规则的能力。现在是时候：\n\n*   政府应通过重大的预算、监管和公私部门合作措施，支持并加速医疗保健的数字化转型。\n\
  *   医疗保健机构应投资数据和 IT 基础设施，与学术界保持紧密联盟，并与初创公司的 AI 研究人员合作。\n*   投入投资资产以倡导并利用公私合作伙伴关系（PPP），推动医疗保健的数字化转型。\n\
  *   协作学习展示了保护隐私的联邦学习方法如何使构建强大的 AI 模型成为可能，这些模型能在各个业务领域有效运行，即使是在数据获取受限或涉及机密信息的行业 [16]。\n\
  \n该研究的主要作者、监督 AI 扩展并创办医疗初创公司 Rhino Health 的 Ittai Dayan 博士表示：“在 AI 研究中，当你基于一家医院的数据设计算法时，它通常在任何其他医院都表现不佳。”“但我们利用联邦学习和来自多个大洲的客观、多模态数据，成功设计出了一个可泛化的模型，能够在全球范围内支持一线临床医生，”他补充道。广泛的\
  \ FL 计划目前正在医疗保健业务中持续进行，包括一个用于评估的团队研究项目、乳腺 X 线摄影项目，以及制药公司拜耳为锐敏解剖训练 AI 模型的演练。除医疗保健外，FL\
  \ 还可助力能源公司分析地震和井眼数据、金融机构改进欺诈检测模型，以及从事自动驾驶汽车研究的研究人员开发能泛化至各国驾驶习惯的 AI。\n\n#### 1.2\
  \ 制药行业中的 AI\n\n然而，知识产权保护和隐私问题是该行业的重大障碍。鉴于这些临床数据集的敏感性和重要性，制药企业资助的临床试验产生的数据——约占所有研究的三分之二（3）——通常在实验结束前，仅对赞助方开放，不对任何其他人公开。\n\
  \n\n\n\n# 联邦学习及其技术相关重要性\n\n同样，制药行业控制的“化学库”——用于内部药物开发的无价化合物集合——并非为共享而设计。此外，由于建立内部专业知识需要时间，许多制药公司尚未大规模实施机器学习技术。相反，它们依赖与科技公司的独家协议来保护其创意\
  \ [2, 3]。尽管对 AI 的兴趣日益浓厚，但制药企业间数据和洞察交换的承诺仍未兑现。\n\n“合作竞争”（coopetition）一词表示在低信任环境下的一种新型合作研究模式\
  \ [4]。竞争对手制药企业利用联邦学习，将来自多个数据集的洞察聚合到一个机器学习模型中，而无需透露其原始数据、它们如何在竞争合作伙伴间分发数据，或如何访问其他服务器。每个合作伙伴将继续负责维护数据所有权，并确保符合法律要求（如\
  \ GDPR 或 HIPAA）。为防止数据泄露，已实施进一步的隐私保护机制（安全聚合、差分隐私模型训练）[5, 6]。\n\nMELLODDY 是一个由 Owkin\
  \ 牵头、涉及欧洲 10 家制药公司的公私合作项目，是“合作竞争实践”的一个典范。超过 1000 万种化合物和 10 亿次测试构成了目前现存最大的化学化合物库，使每个合作伙伴能更有效地挑选最有希望的药物候选物进行开发——这一场景直到最近还难以想象。\n\
  \n与普遍看法相反，MELLODDY 使用分布式账本技术使每项活动和交易完全可追溯。它还基于一个名为 `Substrata` 的开源框架运行，该框架向科学界开放。在平台通过成功的安全评估（外包给独立公司）后，首次“联邦运行”于\
  \ 2020 年完成，证明了多任务（即靶点无关）机器学习模型可以在高校间大规模训练。我们将继续利用该平台评估一系列旨在提高药物开发有效性的研究假设。\n\n这些例子说明了联邦学习在医疗保健和协作式机器学习中，如何通过连接人和组织来彻底改变医学研究。除了上述用途外，该技术还提供了广泛的其他选择，例如通过在全球分散的稀疏数据集上训练模型来增强罕见病研究。由于联邦学习框架具有适应性，此类合作的广度可涵盖多个研究领域并产生独特的解决方案，这通常比传统机器学习技术允许更快的创新\
  \ [8, 13]。\n\n## 2.1 机器学习与算法\n\n除非你像 1930 年代的人那样花费所有时间来定义我们的数据，否则我们的生活由算法组成。算法基本上是指令集，在此语境下用于解决棘手问题或处理预期结果。它们通过分发最有可能引起兴趣的定制内容，帮助\
  \ Instagram、Twitter 和 Facebook 增加收入。搜索引擎 Google 利用复杂算法将你的搜索词转换为它认为你正在寻找的页面。你邮箱中的算法过滤掉垃圾邮件，而\
  \ Waze 使用程序确定从 A 点到 B 点的最快路线。\n\n无数额外的算法帮助我们完成工作、娱乐我们，或隐藏在日常操作的后台中。如果符合公司自身目标（通常是赚钱），公司会持续改进这些算法，以向你提供最准确、最有条理的结果。自首次部署以来，我们最常用的几个算法已显著进步。在\
  \ 1990 年代末或 2000 年代初你在 Google 上搜索时，必须非常具体，且结果与今天相比很差。机器学习作为人工智能的一个分支，在算法如何改进其职责方面发挥着重要作用。\n\
  \n它们无需外部力量（如人类开发者）将这些变更植入其中即可进步。在过去几十年里，机器学习蓬勃发展，改进了我们的算法，帮助我们获得更好的结果，并拓展到新领域。因其实用性，它也已成为\
  \ Facebook、Google 等众多企业的主要收入来源。数据集中高质量数据点越多，数据池越大，这些机器学习算法就可能越精准。因为算法越高效能赚取更多财富，数据实际上已成为一种商品\
  \ [2]。\n\n在一系列数据隐私危机（包括 Facebook 的剑桥分析公司丑闻和 Google+ 的大规模信息泄露）之后，公司开始关注此事。它们似乎在寻找方法，在不激怒用户或立法者的情况下继续实现目标，因为它们不想被取代。马克·扎克伯格在今年\
  \ F8 大会上发表的“未来是私密的”声明可能是转折点。尽管最好谨慎对待这一趋势，但联邦学习是用户隐私方面更令人鼓舞的进展之一。\n\n### 3. 联邦学习训练过程\n\
  \n\n\n\n# 联邦学习：流程、优势与应用\n\n通过让合格设备访问算法的最新版本，联邦学习助力算法发展。该算法的模型随后从部分用户手机的私有数据中收集信息。新数据经过处理后，会被简要传回公司的计算机系统，真实数据绝不离开手机。出于安全考虑，这些数据在传回服务器的途中通常会被加密。谷歌创建了\
  \ `Secure Aggregation Protocol`（安全聚合协议），如图 1 所示，旨在防止服务器从接收到的摘要中推断出具体数据。\n\n![图 1.\
  \ 联邦学习训练流程。](img/fig9_1_B.jpg)\n\n图 1. 联邦学习训练流程。\n\n或者，也可采用差分隐私，通过添加随机数据噪声来隐藏个人摘要，从而模糊结果。随机数据在发送摘要至服务器前添加，由此产生适合算法处理的准确结果，且服务器无法访问实际摘要数据。此方法确保了个人数据的隐私。系统使用加密技术防止服务器接收特定数据摘要。只有在摘要融入了数百或数千名其他用户的输入并得到改进后，服务器才能根据此协议查看它。\n\
  \n差分隐私和 `Secure Aggregation Protocol`（安全聚合协议）是保护用户数据免受组织和黑客窥探的两种关键方法。它们是联邦学习保护用户隐私所必需的。信息摘要在安全传输到服务器后，被用于更新算法。该流程执行数千次迭代，算法的评估版本也被分发到无数消费者设备。这使企业能够使用真实的消费者数据测试算法的新迭代。由于审查在用户设备的范围内进行，算法无需在中央服务器上合并用户数据即可进行测试。测试完成后，修订后的算法模型会分发给用户设备以替换旧模型。随后，改进后的算法投入常规工作。如果一切按计划进行，它将在实现目标方面更加精准和成功。\n\
  \n整个流程随后重复进行：\n\n*   新算法检查特定消费者设备的数据。\n*   它安全地将该消费者数据的摘要传送至服务器。\n*   然后利用该数据对其他用户的结果进行平均。\n\
  *   算法根据新数据学习后创建更新并对其进行评估。\n*   用户获得访问权限，使用更复杂的算法版本。\n\n算法无需将用户数据存储在企业服务器上，便能通过从用户数据中学习，随时间不断变得更好。如果您仍难以理解什么是\
  \ FL 及其运作方式，谷歌创建了一幅漫画，阐释了联邦学习技术为何更易于理解。\n\n除了数据隐藏，联邦学习模型还为消费者提供了其他多项优势。训练过程可在设备充电、连接\
  \ WiFi 且闲置时进行，从而限制了消费者遭遇的麻烦，这与持续与服务器交换数据形成对比。当用户外出时，不会因此浪费有限的流量或电池寿命。总体而言，联邦学习发送的数据比传统学习模型少，因为它仅传输相关数据的摘要，而非实际数据。此外，联邦学习可提供通用和独特的算法模型。为提供更有效的服务，它能从更大群体的用户中汲取见解，并将其与用户的数据相结合。\n\
  \n## 4. 联邦学习的应用及其优势\n\n联邦学习有许多潜在应用，特别是在隐私顾虑与算法改进需求发生碰撞的领域。迄今为止最著名的联邦学习实验是在手机上进行的，但相同的方法也可用于计算机和\
  \ IoT（物联网）设备，如自动驾驶汽车。\n\n### 部分当前及未来的应用包括：\n\n#### Google Gboard\n\n作为谷歌键盘应用 Gboard\
  \ 的一部分，联邦学习首次在现实世界中得到广泛实施。该公司希望利用该方法改进词语推荐，同时不危及用户隐私。旧的机器学习方法本可用于创建更好的键盘预测，但这将极具侵入性。我们所有的输入、私人通信和奇特的谷歌搜索都将不得不发送到中央服务器进行分析，谁知道这些数据还会被用作何用？幸运的是，谷歌采用了其\
  \ FL 策略。\n\n#### 自动驾驶汽车\n\n联邦学习可通过仅使用该数据的摘要而非整个用户数据集来更新算法，从而增强用户隐私。对于自动驾驶汽车，联邦学习有两大关键用途。首先是它能保护用户数据隐私。许多人反感其行程历史和其他驾驶数据被传输到中央服务器并接受评估。应采用联邦学习技术，因为它能降低延迟。与需要大量数据传输且学习速度较慢的标准云学习不同，联邦学习可使自动驾驶汽车运行更快、更得当，避免事故并提高安全性。\n\
  \n### 联邦学习也可能成为该领域未来发展的催化剂 [[6]](#ch9.xhtml#ref9_6)。\n\n#### 云计算\n\n在由谷歌、亚马逊和微软等数字巨头主导的市场中，云计算已成为机器学习的主导计算范式。\n\
  \n#### 共享经济\n\n谷歌利用联邦学习开发了其 GBoard 下一词预测器。无需危及用户隐私即可训练模型的能力，应鼓励开发依赖从移动设备和其他 IoT\
  \ 设备获取数据的额外服务，作为一种共享经济形式。\n\n#### B2B 联盟\n\n联邦学习使各种数据所有者能够在组织层面合作并交换数据，因为数据永不离开其原始场所。\n\
  \n## 5. 医疗健康领域以联邦学习为中心的用例\n\n包括医疗健康、数字健康追踪、便携式应用等在内的众多领域，为联邦学习提供了巨大潜力。它已在 COVID-19\
  \ 检测、医学影像、远程健康监测和健康数据管理等医疗应用中证明了其有效性。例如，谷歌利用此方法改进了 Android 手机上的智能文本选择。此用例使用户能根据用户输入预测所需单词或词序，从而快速选择、复制和使用文本。每当用户点击选择一段文本并纠正模型的建议时，全局模型都会接收到精确反馈，从而提高模型的准确性\
  \ [[3]](#ch9.xhtml#ref9_3)。\n\n联邦学习在医疗健康、数字健康追踪、便携式应用和医疗健康等多个领域具有巨大潜力。它已在 COVID-19\
  \ 检测、医学影像、远程健康监测和健康数据管理等医疗应用中得到有效实施 [[3]](#ch9.xhtml#ref9_3)。\n\n\n\n\n# Google\
  \ 利用此方法增强 Android 手机的智能文本选择，以此作为其如何用于移动应用程序的例证\n\n此用例涉及根据用户输入预测所需的短语或词串，允许用户快速选择、复制和使用内容。每当用户点击选择文本并覆盖模型的推荐时，全局模型都会接收确切的输入，随后被用于改进模型。\n\
  \n为了改进关于交通和道路的即时监督和并发数据收集，联邦学习也与自动驾驶汽车息息相关。自动驾驶汽车需要实时更新，联邦学习允许高效地实时汇集来自多辆车的此类数据。\n\
  \n## 5.1 医疗保健\n\n在医疗保健领域，数据保密性和安全性极其复杂。许多公司掌握着大量敏感且宝贵的患者数据，黑客始终在觊觎这些数据 [2, 10, 14]。\n\
  \n没有人希望令人尴尬的诊断结果被公开。这些存储库中海量的数据对于身份盗窃和保险欺诈等欺诈计划极其有用。团队的努力表明，可以创建一个深度学习原型，其精度达到使用传统方法创建的原型的\
  \ **99%**。鉴于海量的数据量和医疗保健行业面临的重大风险，大多数国家都制定了严格的规则来规定健康数据应如何维护，例如美国的 HIPAA 要求。为了展示联邦学习在医学成像中的潜力，Intel\
  \ 于 2018 年与宾夕法尼亚大学生物医学图像计算与分析中心合作。\n\n## 5.2 医疗 AI 的数据依赖性\n\nAI 系统经常使用能够描绘现实世界中问题或人群主要数据分布的数据集。但在医疗\
  \ AI 领域，这一需求更为迫切 [9]。\n\n### 1. 诊断\n\n已经开发出机器学习模型来帮助医生更快、更准确地识别模式。医生根据在各种数据中注意到的模式来识别疾病，包括症状、生理信号、医学影像等。\n\
  \n### 2. 药物发现\n\n在药物发现的早期阶段，理解物质的诸多方面至关重要，例如其分布、代谢、吸收和排泄。化合物的复杂性使得 QSAR（定量构效关系）模型复杂且高维，需要大量的训练数据\
  \ [22]。\n\n### 3. 护理质量\n\n医院死亡率常被视为衡量患者安全和护理质量优劣的关键指标。为了使临床医生能够提供更个性化的护理和疗法，确定影响患者死亡率的因素至关重要。识别影响死亡率的因素需要庞大且多样化的患者群体，仅有顶级医院才能勉强获取其患者信息，这限制了它们做出精准预测的能力\
  \ [21]。\n\n为了让模型准确反映现实世界中看到的差异和分布，模型必须接触广泛的情况，包括复杂和独特的情况，以及疾病模式、社会经济因素和遗传因素之间错综复杂的关系。这只有通过访问多个不同的数据集才能实现。由于某些数据集特征，如人口统计学特征（性别、年龄）或技术不平衡（如采集协议或试剂盒制造商），可能会倾斜模型的预测，这会对工具的准确性产生负面影响（例如，使用一家医院数据开发的算法在应用于另一家医院的数据时可能效果不佳）。\n\
  \n这可能会对工具的准确性产生负面影响（例如，使用一家医院数据开发的算法在应用于另一家诊所的数据时可能效果不佳）并造成偏见问题，因为某些数据集特征，如细节（性别、年龄）或名义上的不平等（如采购礼仪、设备公司），可能会扭曲模型的预测。模型必须接触各种各样的示例，以反映现实世界中看到的变化和分布，例如复杂和不寻常的病例，以及社会经济、遗传和疾病模式之间相互作用的细微差别。为此，需要访问众多且多样化的数据集。\n\
  \n然而，由于这种高质量数据受到医疗保健组织的法律和数据治理标准的严格监管和管理，因此难以获取且成本高昂。一个包含来自五个不同国家的 20 家机构的多医院项目，在将\
  \ FL 应用于医疗技术方面取得了重大突破。这项由 COVID-19 疫情催生的努力，展示了隐私保护 FL 方法如何能够在因敏感或稀缺数据而受限的领域，实现构建能在各机构间有效运行的强大\
  \ AI 模型 [8, 9]。\n\n作为“EXAM”（EMR CXR AI Model）合作伙伴计划的一部分，由马萨诸塞州总医院、NVIDIA 和医疗初创公司\
  \ Rhino Health 领导，研究人员训练了一个神经网络，以预测出现 COVID-19 症状的患者在急诊室就诊后 24 小时和 72 小时可能需要多少额外氧气。在有史以来最大、最广泛的临床\
  \ FL 实验之一中，EXAM 合作伙伴创建了一个 AI 原型，它从每家参与医院的胸部 X 光图像、患者生命体征、人口统计数据和实验室数值中学习，而从未访问过保存在各站点私有服务器上的敏感信息。\n\
  \n在本地 NVIDIA GPU 上，每家医院训练了同一神经网络的一个副本。训练期间，仅偶尔将更新的模型权重发送到中央服务器，在那里它们被全局神经网络聚合以创建一个新的综合模型。令人感兴趣且极具鼓舞意义的是，最终模型不仅保护了隐私，而且与在任何单一站点训练的类似模型相比，性能得到了提升，泛化能力平均提高了\
  \ **38%**，AI 模型的标准性能提高了 **16%**。\n\n这不仅在医疗保健领域是一项重大进步——其他广泛的 FL 工作正在进行中，包括乳腺 X 光片评估研究和制药公司拜耳训练用于脾脏分割的\
  \ AI 模型的工作——其他几个面临类似数据困境的行业（能源、银行、自动驾驶汽车、保险等）现在也可以利用这项尖端技术，以推动更多创新并改进欺诈检测、自动驾驶技术和风险预测等方面。\n\
  \n### 5.3 机器学习与联邦学习\n\nFL（联邦学习）是一种机器学习方法，它比另一种方式更合理地生成原型数据。联邦学习不是显式地请求数据样本，而是跨越大量分布式边缘设备或服务器训练模型，分配本地数据模型。为了基于便携设备的客户端交互正确训练模型并丰富\
  \ Android 移动用户的消费者熟练度，Google 于 2017 年首次发布了 FL。正如 图 2 所示，Google 称赞 FL 具有生成更聪明原型、降低延迟、减少电量使用和保护隐私的能力。\n\
  \n\n\n\n## 5.4 诊断\n\n为了帮助临床医生更快、更准确地识别趋势，已经开发了机器学习模型。医生根据从症状、生理信号、医学影像等多个来源观察到的模式来诊断疾病。然而，每个机构通常缺乏这些模型所需的大量训练数据。联邦学习作为解决诊断领域数据限制的方案，正被越来越多地采用。Li\
  \ 等人（2020）利用来自四个不同地点的散布式 rs-fMRI 脑成像时间序列数据，研究了 ASD（自闭症谱系障碍）的识别，数据包含 52 至 167 名患者\
  \ [[20]](#ch9.xhtml#ref9_20)。\n\n在该模型中，需要学习多个参数。由于可用患者数量少，任何单一地点的数据都不足以产生可靠结果。该研究对比了在单一地点训练的独立模型与利用四个地点数据协作开发的联邦模型。结果显示，最优单一地点模型的精度为\
  \ 0.695，而联邦模型在相同评估数据上达到了 0.849，显著提升（详见原研究表 3）。\n\n该研究作者提出了站点间数据异质性这一有趣话题，称之为“域偏移”，这给协作带来了障碍。作者建议了防止域偏移的方法，允许数据源分布不均，并创造了新的协作机会。联邦学习在该领域的应用将显著提高疾病诊断的有效性和效率。\n\
  \n## 5.5 药物发现\n\n在药物开发的早期阶段，理解物质的多个方面至关重要，如其亲和力、分布、吸收和排泄。制药公司使用一种称为 QSAR（定量构效关系）的分析方法，该方法构建预测模型，利用假设分子描述符等输入来预测化合物的属性，因为通过化学或生物实验获取这些信息既昂贵又低效。\n\
  \n\n\n\n\n# 复合复杂性与 QSAR 模型中的联邦学习\n\n化合物的复杂性使得 QSAR 模型变得复杂且高维，因此需要大量的训练数据。然而，收集训练数据需要耗费大量的时间和金钱。由于担心共享化合物知识产权（如专有结构）以及其他信任问题，任何跨机构合作都受到了限制。Chen\
  \ 等人于 2020 年探讨了将联邦学习作为使组织间能够建立联盟以协作创建 QSAR 原型的关键手段。实验结果（见下文图 4）表明，在预测性能方面，联邦模型优于任何单一客户端利用私有数据训练的模型。联邦学习使研究人员能够在制药领域更有效地协作并发现新型药物\
  \ [22]。\n\n![图 4. 水平联邦学习的预测性能。](img/fig9_4_B.jpg)\n\n图 4. 水平联邦学习的预测性能。\n\n## 5.6\
  \ 护理质量\n\n药房流失率常被视为衡量患者安全和护理质量提供情况的关键指标。为了让临床医生能够提供更个性化的护理和疗法，识别影响患者死亡率的变量至关重要。识别影响死亡率的因素需要庞大且多样化的患者群体，但记录医院只能访问其各自的患者数据，这限制了它们做出精准预测的能力。\n\
  \nVaid 等人（2020）利用电子健康记录（EHR）数据构建了联邦学习模型，以预测住院后七天内 COVID-19 患者的死亡情况。该研究考虑了从纽约市（NYC）西奈山医疗系统（MSHS）五家医院的\
  \ Epic EHR 系统中获取的 COVID-19 阳性患者的人口统计学特征、既往入院记录、病历和实验室数据（如心率、呼吸频率、血糖）。作者同时采用了多层感知机（MLP）和带有\
  \ L1 正则化的逻辑回归来预测死亡率。作者使用 AUC-ROC 评估了局部模型和联邦模型的性能，发现在大多数站点，联邦模型表现更优 [21]。\n\n联邦学习让医疗专业人员能更深入地了解影响治疗决策的风险变量，从而提供更安全、更高效、更个性化的护理。\n\
  \n# 6. 联邦学习的挑战\n\n除了潜在的安全顾虑外，联邦学习还有若干限制，使其无法成为解决我们所有数据隐私问题的灵丹妙药。值得注意的是，联邦学习训练模型所需的本地设备算力和内存比传统机器学习技术多得多\
  \ [11, 12, 15]。\n\n除了潜在的安全顾虑外，联邦学习还有若干约束，使其无法成为解决我们所有数据隐私问题的灵丹妙荐。值得注意的是，联邦学习训练模型所需的本地设备算力和内存比传统机器学习技术多得多。然而，许多现代设备性能足以胜任这些任务，且该策略还能大幅减少传输到中心服务器的数据量，从而降低数据使用量。如果设备电量充足，这种权衡对许多用户而言可能是有利的\
  \ [11]。\n\n另一个技术难题是带宽。与在数据中心进行的标准机器学习不同，联邦学习通过 WiFi 或 4G 网络进行。这些节点间繁忙节点与服务器使用的带宽速率比\
  \ WiFi 或 4G 低几个数量级。随着时间的推移，设备带宽的增长速度远不如设备算力；因此，带宽限制可能导致延迟增加，且学习过程比传统方法更漫长。如果在设备运行时进行算法训练，会降低设备性能。Google\
  \ 找到了解决方案：仅在设备开启、插电且闲置时进行训练。这解决了问题，但由于训练只能在非高峰时段进行，导致学习过程变慢 [12]。\n\n设备在训练过程中掉线是另一个问题；设备可能被用户使用、关机或遭遇其他干扰。无法使用掉线设备的数据可能导致算法模型精度下降。从联邦学习的构想到落地的过渡并非一帆风顺。包括独立于联邦学习倡导者之外的研究人员在内，都帮助加深了对相关挑战的认识\
  \ [8, 11]。\n\n虽然已有研究探讨联邦学习的有效性和准确性，但在我看来，以下列出的安全相关难题更为迫切。\n\n### 推理攻击\n\n保护客户数据的机密性是联邦学习的驱动力。\n\
  \n### 模型投毒\n\n一些学者研究了不守规矩的客户植入后门或发起女巫攻击以投毒全局模型的想法。\n\n随机梯度下降中的定向投毒攻击。红色虚线向量代表女巫节点的贡献，将模型引向投毒者的目标。如图\
  \ 5 所示，实心绿色向量由忠诚客户提供，致力于达成真实目标。\n\n![图 5. 基于目标的定向投毒。](img/fig9_5_C.jpg)\n\n图 5.\
  \ 基于目标的定向投毒。\n\n联邦学习是一种相对较新的训练方法，在多种用途上展现出前景。由于该技术仍处于研究的早期阶段，因此需要更多调查，目前无法评估其所有潜在应用，也无法评估其可能面临的所有信任和隐私威胁。在此之前，很难精准预测该策略在未来将被广泛采用的程度。好消息是，Google\
  \ 的 Gboard 已在现实世界中成功应用 [15]。\n\n尽管如此，鉴于前述一些缺点，联邦学习不太可能在所有情况下完全取代传统学习模式。未来也将取决于我们主要互联网巨头对保护隐私的重视程度。目前我们有充分理由保持怀疑。\n\
  \n## 联邦学习在医疗保健领域面临的挑战\n\n尽管联邦学习有诸多优势，但必须记住，与传统机器学习技术一样，联邦学习仍面临偏见、标准化和数据质量等性能问题。此外，在医疗数据背景下，联邦学习还面临以下挑战\
  \ [9, 11, 15]：\n\n*   **数据多样性** — 医疗数据本质上复杂且多样。既有结构化形式，也有非结构化形式。数据采集差异、医疗设备品牌和地区人口统计特征等因素也会影响数据的多样性。整合来自多个来源的数据和信息可能颇具挑战。数据在合作高校之间可能分布不均。\n\
  \n\n\n\n\n### 保密性与安全性\n即使联邦学习提供的隐私保护远强于传统机器学习模型，它仍然存在一些隐私和安全风险。信息泄露给竞争方是一种可能性。在使用联邦学习时，可能需要进行权衡，因为在某些情况下，其性能可能比使用常规机器学习模型时略差。研究人员正在研究差分隐私，以给联邦学习提供额外一层隐私保护。\n\
  \n### 可追溯性与责任归属\n医疗 AI 解决方案必须具备可复现性和可解释性。然而，在联邦学习中，我们面对的是在网络、硬件和软件差异巨大的环境下进行的多方计算。因此，研究人员难以检查实际数据，以解释任何异常或意外的结果，或通过预测原型来揭示原因。\n\
  \n### 流程设计\n支持访问各机构所存数据和控制权的联邦学习架构，需要考虑数据真实性、编码格式以及各异的计算能力要求。\n\n## 联邦学习在医疗健康领域的未来\n\
  \n近年来，我们都已熟悉发展中技术对我们生活诸多方面的重要性及影响。技术在我们生活中扮演着重要角色，无论是迎合我们偏好的智能手机应用程序，还是利用 AI 协助临床医生进行诊断。在机器学习\
  \ (ML) 和深度学习 (DL) 中，为了从病理学、遗传学、放射学、癌症等产生的医疗数据 [[20]](#ch9.xhtml#ref9_20) 中获取洞见，我们在医疗健康领域实现了人工智能创新的跨越式发展。\n\
  \n为了从放射学、病理学等收集的医疗数据中获取洞见，我们在医疗健康领域实现了人工智能创新的跨越式发展，特别是在机器学习 (ML) 和深度学习 (DL) 方面。近年来，我们都已熟悉发展中技术对我们生活诸多方面的重要性及影响。技术在我们生活中扮演着重要角色，无论是发掘我们偏好的智能手机程序，还是利用人工智能帮助医生诊断\
  \ [[17]](#ch9.xhtml#ref9_17)。\n\n然而，医疗行业的数据不仅组织混乱且极其敏感。此外，为了维护数据安全、数据访问权和隐私权，必须充分尊重特定国家的监管问题，如\
  \ NMPA (中国)、FDA (美国)、CDSCO (印度)、GDPR (欧洲) 等。除了数据量巨大外，数据还包含大量非结构化内容和敏感患者信息，地理分布广泛，且缺乏跨各种设备和制造商的兼容性。\n\
  \n例如，AI 已显示出协助放射科医生进行计算机辅助分析和诊断的能力。然而，鉴于收集、整理和保存具有多样化人群的高质量数据的困难，仅凭小数据集创建无偏见的有效模型仍然很难。这也耗费大量时间、金钱和精力。医疗和生命科学专业人员可利用联邦学习\
  \ (FL) 的优势，通过联合开发算法来处理隐私、数据完整性和治理问题，数据保留在医院防火墙后，仅共享模型 [[18]](#ch9.xhtml#ref9_18)。\n\
  \n近期研究表明，FL 训练的模型性能可优于在中心托管数据集上训练的原型，以及仅见过孤立单机构数据的模型。联邦学习跨多个人口统计学特征检查患者，收集更广泛的数据变异性。例如，在获得电子健康信息的前提下，FL\
  \ 可协助识别临床上可比的受影响人群，并预测因心脏事件、死亡及 ICU 住留时长导致的住院情况。FL 最初是为包括门诊和边缘设备用例在内的多个领域而创建，但最近在医疗健康应用中获得了流行\
  \ [[19]](#ch9.xhtml#ref9_19)。\n\nFL 可协助开发用于 X 光、超声、计算机断层扫描、磁共振成像和正电子发射成像中器官分割的模型，以及针对疾病特异性成像技术的肿瘤表征。通过提供获取更多数据变异性和跨不同人口统计学特征评估患者的机会，FL\
  \ 未来可实现革命性改进。\n\n研究表明，FL 生成的原型性能更好，且比在特定机构数据上训练的模型具有更强的泛化能力。作为 Health Chain 项目的一部分，一个\
  \ FL 框架将在法国四家机构中创建并实施。利用此技术，黑色素瘤和乳腺癌患者可预估其治疗效果。这也能帮助肿瘤科医生根据患者的皮肤镜检查或显微解剖图像，确定每位患者的最佳治疗方案。FL\
  \ 还可用于增强学术研究。例如，2020 年，美国放射学会、Diagnostics da America、Partners HealthCare、俄亥俄州立大学和斯坦福医学院利用联邦学习创建了更准确的预测模型，用于确定乳腺\
  \ X 光检查中的乳腺组织密度。\n\n此外，遵循“FAIR”原则——可查找、可访问、可互操作、可复用——编译数据，使得可能来自复杂自主算法的数据在很大程度上变得清晰可懂。例如，以统一资源标识符\
  \ (URI) 和公开可访问的本体等广泛认可的词汇表显示数据，可能助力许多该领域研究者克服从国际医疗机构检索的临床数据中的语言障碍。通过将 FL 与 FAIR\
  \ 原则相结合，可从大规模数据集中获得全球适用的临床洞见。\n\n包括医生、患者、医院、AI 研究人员和医疗服务提供者在内的众多利益相关者，可能会受到联邦学习的重大影响。尽管\
  \ FL 优势明显，研究人员和 AI 开发者仍必须仔细考虑研究设计、临床流程选择、数据分类和数据价值，以减少模型偏见。联邦学习是保障可靠、安全、无偏见数据模型的一个潜在思路。FL\
  \ 通过允许多方在无需交换或整合数据集的情况下协同训练，克服了与敏感医疗数据相关的挑战。联邦学习将极大地影响精准医疗，也有潜力在全球范围内改善患者护理。\n\n\
  ### 7. 结论\n\n正如机器学习展望声明所述，联邦学习具有变革性能力，可将 AI 现代化引入医疗路线图。修订地区隐私法、建立充分的标准化代码共享程序和 IT\
  \ 基础设施，或为合作伙伴制定公平的薪酬计划，这些仅是联邦学习中仅能通过协作解决的部分跨学科难题。联邦学习合作必须持续进化，才能在未来复杂的医疗环境中取得成功。借助此方法，信息共享取得了重大进展，医院在机器学习方面的协作变得更加高效。通过利用前沿机器学习和深度学习技术，它规避并克服了处理高度敏感医疗数据的挑战。\n\
