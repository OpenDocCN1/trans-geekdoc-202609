  \ 表 4）。通过评估其在与物联网无关的数据集上的性能，我们可以了解该方法是否可作为设备端学习的通用选择。特别是为了获得 `CNN` 在图像分类上超越人类专家的优势及其高效资源管理能力的收益。通过此分析，我们使用\
