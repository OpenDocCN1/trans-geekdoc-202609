  \ 12(4).\n\n\n\n\n\n## 第 6 章 面向资源受限物联网安全监测的联邦学习方法\n\n*P Sakthibalan*,^(⁶)\n\n电子邮件：balan1109@gmail.com;\
  \ amuthakkannan@nu.edu.om; ansal.v@gmail.com; vijayalakshmi@nu.edu.om; sarav20021989@gmail.com\n\
  \n### 1. 引言\n\n“物联网” (IoT) 指的是一个网络，其中日常物体在数字和物理上相互连接，并与外部世界相连 [[1]](#ch6.xhtml#ref6_1)。Markit\
  \ 预测到 2030 年，全球将有 1250 亿台物联网设备投入使用。智能家居、智能自动化、智慧城市和网络物理系统只是物联网设备众多应用中的几个例子。这些小工具利用包括传感器、处理器和通信硬件在内的多种嵌入式技术来收集和分发信息。这些小工具收集的信息会在边缘网络上与其他同类设备共享。通过汇集资源，我们可以增强数据管理和监测，以及机器与人之间的通信和基于\
  \ AI 的分析。尽管如此，这些小工具正日益被用作网络犯罪分子和其他形式网络恐怖主义的入口点。例如，由 Mirai 感染驱动的大规模分布式拒绝服务 (DDoS)\
  \ 攻击针对脆弱的物联网 (IoT) 设备，导致了灾难性的中断 [[2]](#ch6.xhtml#ref6_2)。然而，这些物联网小工具的处理能力、内存和处理器相当有限。因此，针对台式机和服务器优化的人工智能\
  \ (AI) 方法因硬件和软件资源有限而不适用于物联网小工具。因此，在联邦学习 (FL) 环境下解决这些困难的过程（在该环境下困难被加剧）必须在资源和结果方面既高效又有效。\n\
  \n近年来的研究表明，机器学习 (ML) 方法，特别是深度神经网络 (DNN)，在网络安全监测中具有有趣的应用 [[3]](#ch6.xhtml#ref6_3)，[[4]](#ch6.xhtml#ref6_4)\
  \ 和 [[5]](#ch6.xhtml#ref6_5)。相比之下，基于 DNN 的网络安全方案因物联网设备的分散性和受限性，不适合应用于安全监测场景。企业在使用集中式方法训练基于\
  \ AI 的策略（如数据中心）时，担心数据安全。尽管 FL 方法潜力巨大，但由于本地存储、网络吞吐量、处理能力和内存的限制，可能无法被各种物联网和网络物理设备广泛使用。庞大的模型参数列表使得在低功耗物联网设备上训练联邦\
  \ DNN 模型变得具有挑战性（某些情况下达数百万参数）。为提供一个可行的基于联邦 DNN 的解决方案，将调查以下研究问题 (RQ)。\n\nRQ1：最先进的\
  \ DNN 能否在 FL 条件下进行训练，从而在资源稀缺时产生一个适合万物网络安全监测的模型？澄清请见 第 3.2 节。\n\nRQ2：生成的 REFDL 能否可靠地检测针对物联网网络的攻击？见第\
  \ 5 小节。\n\n我们使用联邦平均 (FedAvg) DNN 和八个物联网 (IoT) 基准数据集，为实验构建了一个 REFDL 模型。最终的资源高效联邦深度学习在合成和真实测试平台联邦环境中均提升了分类性能，且降低了内存消耗。模型的联邦集成有助于在物联网设备上本地训练模型时保护私密信息。\n\
  \n本章结构安排如下。第 2 节 详细回顾了相关研究。第 3 节 描述了拟议方法和采用的 FL 技术，第 4 节 概述了评估程序。调查结果和讨论请参阅 第 5\
  \ 节。随后，报告在 第 6 节 中以未来研究建议作为总结。\n\n### 2. 相关工作\n\n在此，我们提供了一些关于利用深度学习监控物联网安全的相关研究，并对联邦学习\
  \ (FL) 及其在物联网环境中的应用做了同样的梳理。\n\n\n\n\n\n# 物联网中的深度神经网络\n\n学术界已就利用 AI 监控物联网安全进行了大量讨论。这些方法通常采用深度神经网络\
  \ [6]。为对网络流量进行分类，作者使用 DNN 分析来自物联网的信息 [7]。作者利用由物联网赋能的智慧城市数据进行了相同的分析 [8]。作者引入了结构紧凑的卷积神经网络，用于资源受限的物联网环境\
  \ (CNN) [9]。通过在 CIFAR-10 和 ImageNet 等广泛使用的测试平台上证明其价值，我们可以看到它是一个强有力的工具。该方法成功的主要障碍包括缺乏物联网基准数据集的验证，以及未将内存利用率纳入考量。文献\
  \ [10] 使用量化卷积神经网络 (CNN) 从雷达传感器数据中提取信息。为在连接到物联网的极低功耗设备上完成分类任务，作者使用 DNN，更具体地说是全连接神经网络\
  \ (FCNN) [11]。为实现这一目标，我们不会为了模型的简单性而牺牲准确性。选择 FCNN 设计时可能未考虑模型复杂度，这可能会限制该方法的适用性。文中描述的大多数优化方法也考虑了权重和偏置因子的量化。作者\
  \ [12] 开发了用于集中式物联网安全监控的有效且可信的 DNN 技术。然而，本文提出的方法可在分布式环境中运行，占用更少内存并加速任务完成。该方法通过模拟微批次、剪枝和变量正则化，降低了内存需求并提高了精度。这对于分散式学习任务可用资源有限的情况很有帮助。\n\
  \n# 物联网环境中的联邦学习\n\n作者提出的原始 FedAvg FL 策略，提供了在多个客户端上训练单个本地模型的方法，且无需客户端与服务器交换本地数据 [13]。得益于此方法，利用非去中心化且非独立同分布的多样化客户端数据实现模型收敛显得前景广阔。因此，来自许多不同领域的学者采用了许多不同的方法来研究\
  \ FL 技术。FL 在物联网安全监控领域得到广泛应用。作者描述了利用 FL 识别物联网网络入侵的方法 [14]。文献 [15] 讨论了如何绕过 FL 软件在物联网设备上的限制。作者\
  \ [16] 详细描述了 FL 对工业物联网设备的攻击检测能力。加入原始传感器读数数据后，文献 [17] 的研究得以大幅改进。在边缘设备上进行联邦学习训练，可借助模型剪枝提高效率\
  \ [18]。作者 [19] 创建了一种可轻松转换至移动设备的联邦学习架构，以降低整体通信成本。FL 被用于发现物联网网络中的零日漏洞 [20]。这些实现利用了\
  \ FL 的数据隐私特性，且不受底层硬件或软件施加的任何限制。作为增强 FL 和减轻物联网网络内存资源负载的一种手段，作者 [21、22 和 23] 实现了模型参数缩减和数据并行性（微批次）。然而，这些方法均未考虑优化\
  \ FL 以减少多种 DNN 变体的时间和内存成本的可能性。我们利用来自各种物联网设备的原始网络流量数据微调联邦训练过程，以解决这一问题。我们的低开销 REFDL\
  \ 方法在各种条件下，通过模拟和真实嵌入式设备进行了严格测试，确保其在需要最少内存和处理时间的同时，保持最先进的准确性。\n\n### 3. 方法论\n\n这将通过在少量真实世界和物联网基准数据集样本上优化\
  \ BFDL 来确定 REFDL 来演示。\n\n我们展示了 REFDL 可以使用经过精心优化的 BFDL 算法版本生成。当应用于非物联网数据集时，高效的 REFDL\
  \ 可以检测物联网攻击行为并提供准确分类。\n\n#### 3.1 基线联邦深度学习\n\n基线联邦深度学习将传统 DNN (FCNN/CNN) 模型与 FedAvg\
  \ 算法相结合。集成的 DNN 是一个拥有多层神经元的人工神经网络，能准确表示输入数据。这些神经元代表计算单元，可传达其激活函数和输入上执行操作的结果。在 FCNN\
  \ 中，神经元按顺序连接到其权重和偏置。从这个意义上说，权重和偏置类似于计算机内存。在算法 1 中，我们找到了网络架构、激活函数、权重和偏置值，以及 BFDL\
  \ (`Mn`) 基线模型。可调整权重和偏置等参数，以微调训练数据 `Dtr` 上产生的误差函数 `Mn`。遵循这些准则将产生一个包含所有客户端模型信息的“主”\
  \ FedAvg 模型。算法 1 描述了如何使用反向传播和随机梯度下降 (SGD) 算法训练 `Mn` 大小（或更大）的网络。使用算法 1 的设备更新功能，服务器可在每轮通信后更新主模型并重新分发给客户端。在第三个算法中，客户端迭代地使用其数据更新提交给服务器的梯度下降权重。这旨在通过最小化方程\
  \ 1 和 2 中的代价函数来开发一个通用参考模型。随后使用算法 1 的第 11 行和第 12 行对算法的执行时间和内存需求做出合理推测。本地权重更新后，这些数据代表设备级训练资源日志。在第三种方法中，模型权重被传输到协调服务器。集成全局模型时，服务器通常使用返回权重中点。通过向全局模型添加\
  \ `Dtr` 学习函数，可准确映射先前未见的数据。为分类目的，基线联邦深度学习技术采用监督式 DNN (FCNN 和卷积神经网络)，`Mn` 接收数据流 (`Dtr`)\
  \ 并输出概率类向量 (`Ŷ`)。如方程 3 所示，使用阈值 `t` 将结果四舍五入到最近的整数。输出展示了针对物联网数据样本或图像数据集的安全 (1) 或危险\
  \ (0) 流量示例。\n\n##### 算法 1. 基线 BFDL 训练\n\n**输入：** 标记数据 `Dtr`，迭代次数 `T`，批次大小 `S`\n\n\
  **输出：** 基线模型 `Mn`\n\n```\nfunction Base (Dtr[]) Training baseline model\n    for\
  \ i = 1 to T do\n        Mini-batch B = {(X1,y1),...,(x1,M1)} ⊂ Dtr\n        Fp(B)\
  \ Forward propagation with B\n        ε ← L L= Base loss\n        Bp(B) Backward\
  \ propagation\n\nfunction Device Update(d) Run on device d\n    Bs ← (data Pd in\
  \ batches of size B)\n    for batch b ∈ Bs do\n```\n\n\n\n\n\n#### 3.2 资源高效联邦深度学习\
  \ (REFDL)\n\n正如上文所述，训练一个用于联邦学习 (FL) 且资源消耗较少的 DNN 模型可能很困难，这对于物联网安全监控尤其如此 [24, 25]。为了设计和实现最优架构，我们需要同时考虑\
  \ FL 通信的频率和 DNN 本身的具体细节。随着数据集维度的增加，该方法的难度也随之增加。\n\n**算法 2.** 获取资源高效联邦深度学习的建议策略\n\
  \n> **输入：** `Penalty term=λ, (Dtr, T, B, L, in Algorithm 1)`\n>\n> **输出：** `An Efficient\
  \ Model of Me`\n>\n> **function** `Efficient (Dtr[])`\n>\n> **for** `j = 1` **to**\
  \ `T` **; do**\n>\n> **Micro-batch** `M = {(x1,y1),...,(x1,m1)} ⊆ B`\n>\n> `Fp(M)`\
  \ **M = 前向传播**\n>\n> `ε[t] — L` **L = 初始化损失**\n>\n> **内存和时间可基于 `εt` 初始化，因此可估算 `mt`\
  \ 和 `tt`。**\n> $$\\varepsilon_{j} \\leftarrow \\varepsilon_{t} + \\lambda \\sum_{j\
  \ = 1}^{W} \\frac{(w_{j}^{2}/w_{0}^{2})}{(1 + w_{i}^{2}/w_{0}^{2})}$$\n>\n> `Bp(M)`\
  \ **M = 反向传播**\n>\n> **function** `Device Update(d)` **在设备 `d` 上运行**\n>\n> `M` ←\
