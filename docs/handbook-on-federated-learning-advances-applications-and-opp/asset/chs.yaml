  \n## 第 11 章 基于深度谱卷积神经网络的超光谱特征选择实现高效心脏疾病预测的联邦学习\n\n**B Dhiyanesh**^(¹¹)\n\n电子邮件：kirthikacsehod@gmail.com;\
  \ psw@vcet.ac.in; mail2mathi86@gmail.com; radharaja100@gmail.com\n\n### 1. 简介\n\n\
  心血管疾病是当今世界主要的死亡原因之一。因此，可视化和早期分析对于治疗规划的成功至关重要。在临床领域，这能降低死亡率并减少临床费用。尽管在诊断和治疗方面取得了重大进展，心血管疾病（CVD）仍然是全球发病率和死亡率的主要来源。人工智能技术为解读基础信息以辅助独立临床决策提供了另一种工具；它改变了冠心病的诊疗实践。\n\
  \n数据挖掘和深度学习策略为提取决策所需的关键信息提供了技术和程序。心脏病（HD）是一种心血管疾病，是心脏和血管的疾病。对心血管疾病各个方面（诊断、治疗、心电图、超声心动图等）的广泛探索产生了大量数据。本研究旨在系统回顾人工智能和深度学习技术及工具在心血管疾病研究中的应用，特别是与心血管并发症、预测和诊断相关的应用。\n\
  \n总体而言，约 60% 的应用采用机器学习程序和支持向量机，30% 采用深度学习方法。大多数数据用于临床数据集。本研究为选择合适的技术和途径以提高心脏病预测精度提供了经验。本研究选取的文章提供了有价值的信息提取、对心血管疾病更深入的理解以及为进一步研究提出的新假设。\n\
  \n特征从 `PHR cardiac dataset` 收集，以筛选被视为基本属性的边缘构造值的重要性。特征选择对于心脏数据集的降维非常重要。分类器 `LSTM-Convolutional\
  \ Neural Network (LSTMCNN)` 基于大规模预测创建激活函数逻辑预测，以根据类别参考对疾病等级进行分类。\n\n### 2. 相关工作\n\
  \n本综述探讨了各位作者提出的差异化技术和实现，并讨论了它们的局限性。\n\n文献 [1] 提出了一个改善患者卫生和手术交互的框架。在一个协调框架中，`Video\
  \ See-Through (VST)` 头显逐步显示关于患者健康状况的完整数据（护士、麻醉师和手术团队的其他成员在手术过程中应佩戴）。`Operating Room\
  \ (OR)` 管理员可以通过该设备持续获取生命体征并访问电子病历。冠心病是许多国家的主要死因，许多方法专注于精确和谨慎的药物治疗。总体而言，基于样本量和传统回归模型中有限的数据量，可以预测冠心病患者的\
  \ 5 年生存率。基于大规模数据库，旨在预测 5 年生存率，并引入了特征选择算法和机器学习工具，如 `random forest classifiers (RFCs)`\
  \ [2]。\n\n心脏病是一个主要问题，是一个严重影响生活质量的重大负担。许多技术解决方案被提出用于预测评估或降低风险；大多数基于加速度计和陀螺仪。然而，它并非几乎用于识别首次跌倒。一种预测基线使用减少的模型提出了短期\
  \ `Heart Rate Variability (HRV)` 分析 [3]。对不断上升的医疗成本和服务的需求增加，要求我们更有效地利用医疗资源。鉴于所需资源的随机性，医疗服务流程需要更高效。现有手段旨在减少患者对资源需求的不确定性。为实现这一目标，患者被划分为相同的资源组和用户组\
  \ [4]。\n\n当使用不可逆电穿孔 (`IRE`) 时，短电脉冲被施加到生长组织上。有效治疗依赖于所有组织直接暴露于致死电场；然而，由于这种暴露难以提前预测，因此依赖临床医生决定所需的理想治疗参数。临床医生依赖脉冲如何停止以及电穿孔期间组织内细胞如何变化来监测组织阻抗\
  \ [5]。使用 `POMDP` 模型的心血管疾病预测算法。患者将通过雾计算向医生发送警报以应对紧急情况。救护车是紧急情况下转运患者的工具。医生通过 `fog\
  \ computing` 逻辑接收数据，这是一个在研究界日益受到关注的医学计算新领域 [6]。主要问题是由心脏病引起的，因为它被用于识别疾病；这将需要大量经验，知识也非常困难。视情况而定，死亡将是全球主要死因。此外，医生判断和了解患者需要很长时间，因为他们必须观察患者的健康和饮食。这是一个非常漫长的过程，需要进行检测和寻求医疗救助，因为过程太长\
  \ [7]。\n\n\n\n\n心血管疾病是全球主要的死亡原因，因此心脏疾病的早期发现和常规监测可以降低死亡率。健康、各种系统的涌现、来自不同来源的数据的指数级增长，以及通过互联网传输的可穿戴传感器设备，产生了大量的连续数据。大规模数据分析和机器学习，特别是流式早期确认以及创新技术，可以识别创新在冠心病临床领域的巨大影响。这将更加令人印象深刻且合理[8]。心脏病是现代世界关注的焦点，生命短暂。大量人群依赖医疗系统快速提供准确的结果。每天，医疗机构都会生成和获取大量数据。为了获得有趣的发现，数据创新可以通过喷雾过程提取数据。即使使用挖掘技术消除了数据类型直接从电子记录中移除的手工数据，加权关联规则仍然适用[9]。\n\
  \n缺氧是由于失衡和该区域细胞特定部分的死亡导致血流丧失引起的，表现为心脏本身的缺血性卒中。这些数量代表了梗死体积的定义，一些神经外科医生对其治疗极为敏感[10]。在大多数心脏病死亡病例中，医生的诊断过程繁琐，且在大多数领域由专业人员执行。心脏病风险可以使用模糊专家系统来识别。分析患者心脏病存在一些因素，处理医生的工作需要努力。然而，专家们希望有一个准确的工具，根据提供的参考信息确定风险因素[11]。数据挖掘技术硬盘的含义，不仅包括简要的综合文献综述，还包括分类。科学文献回顾表明，已有多种数据挖掘方法被用于硬盘驱动器（HDD）。通过挖掘创新，它提供了关于建议分类的深刻数据集的关键文献[12]。集成方法基于用于诊断心脏病的\
  \ KNN 距离方法并显示结果。集成已按以下两种配置实现：一种使用了三种距离中的五种，另一种在使用 KNN 方法时增加了其参考的平均准确度，给定每种距离的加权格式[13]。\n\
  \n随着青少年心脏病发作率的上升，组织不得不开发系统，基于早期预警信号检测和预防心脏病发作。在许多情况下，普通人要接受昂贵的检查，如心电图。因为这不现实，所以需要一个可靠且便捷的系统来预测心脏病的概率[14]。心脏病是一种严重的慢性疾病，常导致死亡。医疗数据显示，这种疾病很快将消灭比富人和穷人拥有更多知识的人口。因此，基于医疗保险功能的紧迫性，对患者时间的准确诊断至关重要。一家阴暗的医院会导致无效的诊断[15]。描述了利用大数据进行实时机器学习心脏病检测。近年来，心脏病已成为全球最常见的死亡原因。利用物联网和可穿戴传感器等多源信息进行心脏病的早期检测和持续监测，旨在通过指数级增长减少死亡率数据[16]。描述了基于高维数据处理背景下特征守恒的计算预测模型（CPM）。使用质谱数据，高维特征是降低分类准确性的非相关特征[17]。描述了机器学习在预测解释中的医疗建议，可以推断心血管事件患者早期心脏病（HD）和胸痛的威胁，提供充分的医疗保健对于其阳性诊断至关重要。它提取了简单决策理论模型预测的控制功能，以及样本与有效质量早期检测之间的疾病分类[18]。在诊断心血管疾病和创建精确预测模型中，传感器和远程传感器组织、人工智能（AI）应用以及\
  \ LSBD 被描述为关键要素[19]。\n\n描述了基于患者生命体征实时监测及其医生报告的可穿戴传感器监测系统，以改善医疗保健和心脏病发现的质量[20]。讨论了物联网模式与智能医疗系统，其可成为远程健康监测的优势[21]。Contiki-NG\
  \ 和 Open WSN，来自最先进的开放传感器条件尘埃、尘埃测试这两种最广泛使用的可用手段，Caozuoxitong 检测心脏病[22]，描述了可穿戴传感器设备如何引领智能医疗系统，由于人口老龄化，在过去几十年里特别关注家庭护理和电子健康的变革。其目标是让他们留在家庭环境和医院中，而不是在患者家中提供医疗服务，以提高患者的生活质量。\n\
  \n\n\n\n# 建议方法\n\n一种基于深度学习的心血管诊断检测（CADD）用于疾病概率预测，提出了一种精确的 AI 模型，能够依据患者的临床参数可靠地区分心血管感染。建议的方法基于以下步骤：\n\
  \n1. 包括异常值移除、缺失值替换和不平衡类别处理。\n2. 基于权重的特征重要性进行特征选择。\n3. 分类。\n\n随后训练模型，并使用训练好的模型进行预测。我们的主要目标是在降低特征/计算复杂度的同时获得更好的结果。本研究旨在通过多层次方法减少心血管并发症。图\
