  \ `j` 个 epoch 的执行内存 `m[j]`**\n>\n> **估算第 `j` 个 epoch 的执行时间 `t[j]`**\n>\n> **if**\
  \ `((m[j] < m[t]) AND (t[j] < t[t]))` **then**\n>\n> `m[tr] = m[j] m[tr] = Efficient\
  \ memory`\n>\n> `t[tr] = t[j] t[t] = Efficient time`\n>\n> `Me = Trained model that\
  \ estimate Ej.m[tr].t[tr]`\n>\n> **end if**\n>\n> **end if**\n>\n> **end for**\n\
  >\n> **end function**\n>\n> **end for**\n>\n> **return** `w` **到算法 3 中的服务器 调用算法\
  \ 3 中的协调服务器进行权重平均**\n>\n> **return** `(Me, Ej, m[tr], t[tr])`\n>\n> **end function**\n\
  \n为此，我们采用 BFDL 的参考架构来生成基础模型的更高效变体 (REFDL)。如算法 2 所述，使用 `Dtr` 在训练期间优化 REFDL 模型的高效\
  \ `Me`。算法 2 第 3 行展示了微批处理，这有助于将大型数据集分解为易于管理的块，以便进行快速的设备端模型训练。与小批量处理不同，微批处理兼容大多数数据集，包括物联网生成的数据集。采用具有阈值\
  \ `w0` 的惩罚（权重移除）方法来正则化公式 4，从而减少网络节点数量 [26]。为了在网络中高效执行本地权重更新，有必要识别与当前问题相关的权重组。具体而言，我们需要找出基础模型中庞大的权重中哪些实际上是重要的。对于复杂度成本约为\
  \ 1 且权重大于 `w0` 的情况，需要使用惩罚参数 `λ` 进行正则化。算法 2 则考虑 DNN 架构和任何额外约束，寻找要丢弃的最佳权重数量。\n\n具体而言，在第\
  \ 7 行中，正则化考虑了初始化模型产生较大误差值 `ε[t]` 的情况。我们使用参数获得了降低后的误差值 `εj`，从而实现了更好的性能。当第 6 行的初始化值与计算出的计算内存占用和执行时间进行比较时，客户端设备模型在第\
  \ 15 和 16 行返回最小内存约束。在第三个算法中，使用资源最少的设备模型连同其各自的权重被发送回中央服务器。联邦设置中的协调服务器通过对客户端模型提供的权重进行平均，更新模型聚合中使用的权重。在开发\
  \ REFDL 聚合模型时，使用此方法可以减少客户端在计算上花费的时间和能量。当模型最终收敛时，每个客户端设备在每一联邦轮次中累积节省的时间和能量可能是巨大的。\n\
