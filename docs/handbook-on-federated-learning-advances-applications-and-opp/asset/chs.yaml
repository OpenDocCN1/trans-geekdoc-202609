  \ `XCS-1003` 数据集所演示的，`REFDL` 比其前身使用更少的时间和内存。拥有四个隐藏层时，`BFDL` 和 `REFDL` 等联邦模型能达到略高的准确率\
  \ (`4L`)。因此，分布式环境中高效联邦学习受隐藏层数量影响。然而，算力更强的客户端比资源较少的客户端对全局模型有大得多的影响。更复杂的是，客户端偏斜的收入和教育水平分布可能会影响全局模型的精度。在后续研究中，探究这些限制将非常有意义。\n\
