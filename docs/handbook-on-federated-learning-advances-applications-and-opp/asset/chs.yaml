  \ Access*，8: 59247–59256。\n\n# 第 12 章：基于联邦学习的阿尔茨海默病预测\n\n\n\n\n*S Suchitra*^(¹²)\n\
  \n电子邮件：senthamn@srmist.edu.in; jeyaselm@srmist.edu.in; poovaraghan1976@gmail.com\n\
  \n### 1. 简介\n\n根据 2021 年的统计数据，印度阿尔茨海默病的总体患病率为：55 岁及以上人群为 0.84%，65 岁及以上人群为 1.36%。其治疗费用极高。由于印度每次神经影像检查的费用超过\
  \ 5000 美元，这也是印度鲜有人能负担得起如此昂贵检测手段的原因。如果能早期发现阿尔茨海默病，患者从治疗中获益的可能性会增加。与人口数量相比，印度医疗专业人员较少，因此开发一种能够检测阿尔茨海默病早期阶段的模型显得尤为重要。2020\
  \ 年新冠疫情期间，因阿尔茨海默病导致的死亡人数增加了 17%。印度缺乏足够的阿尔茨海默病护理专业人员来妥善应对国内呈现的病例数量。这呼吁部署一套系统以满足患者需求。正如在世界其他地区一样，计算机、手机、移动电话和互联网在发展中国家也随处可得。\n\
  \n在现有系统中，需要解决以下问题：(i) 阿尔茨海默病和衰老都会导致脑体积萎缩。这使得仅凭 MRI 扫描难以将阿尔茨海默病患者与健康老年人区分开来。(ii)\
  \ 下一个主要问题是缺乏足够的数据。(iii) 深度学习解决方案存在困难，如算法复杂度高、过拟合和欠拟合，这些问题处理起来有点棘手。(iv) 部分阿尔茨海默病症状与其他疾病相似，使得鉴别诊断变得困难。\n\
  \n本项目旨在利用联邦学习方法，为早期疾病识别提供精准结果，以加速阿尔茨海默病的治疗。该过程可缩短治疗和检测过程所需的时间。借助患者的 MRI 影像也能释放大量人力资源，使医院医生能专注于治疗过程而非检测。这也将确保该脑部疾病对患者造成的损害降至最低，并减缓其进展。这有赖于一个准确、快速且可靠的检测系统。\n\
  \n阿尔茨海默病的早期诊断让患者有更大机会从疾病治疗中获益，并使他们有资格参加多项临床研究。药物在疾病发病早期阶段能提供更多益处。这为规划与阿尔茨海默病患者治疗相关的医疗和财务决策争取了时间。它还为获得适当的服务和支持以控制进行性病情打开了大门。它有助于排除其他伴有类似痴呆症状的可治疗疾病。只有在疾病早期被诊断出时，药物和非药物治疗才能帮助患者。这呼吁建立一个有效、可靠且快速的系统，以尽早检测疾病并开始必要的治疗。医疗系统及其活动的多面性导致医疗数据在大多数情况下呈碎片化状态。然而，医疗机构可能只能检索特定患者群体的诊断信息。这些文档包含特定个人的高度隐私健康信息。已出台多项法规来规范此类数据的收集和分析。联邦学习是一种近期广受欢迎的模型，因为它展现出从分散的私密信息中学习的巨大潜力。它不一次性从多个来源收集数据，也不依赖传统的“寻找后复制”技术，而是支持利用中央服务器训练共享的全局模型，同时保留所有数据在其产生的本地社区中。\n\
  \n本文提出的方法建议使用深度学习技术开发一种 CNN 架构模型，利用图像分类算法在发病早期阶段检测阿尔茨海默病，这可以通过 CNN 提供的特征提取以及以 MRI\
  \ 形式输入的神经影像技术，借助联邦学习高效完成；它支持在不泄露用户私密数据的情况下进行预测，并使多个用户能够开发分布式、可信且准确的机器学习模型。模型中使用的数据集源自阿尔茨海默病数据集，包含\
  \ 6400 张 MRI 图像，分为四个不同类别。这些类别代表阿尔茨海默病的四个进展阶段。数据集中的图像来自 45 至 85 岁的人群。数据集经过多渠道彻底检查，检查后发现不包含任何患者的重复\
  \ MRI 图像，也不包含来自同一患者的多张图像。建议的技术在阿尔茨海默病数据集（包含 6400 张 MRI 图片）上通过精确率、召回率和准确率等指标进行了彻底检验。与现有方法相比，提出的方法显示出更高的精确度。我们提出的深度学习模型的贡献如下：(1)\
  \ 提供一个更可靠、更准确的阿尔茨海默病检测系统。(2) 提高所有先前提出模型的准确性。(3) 通过联邦学习利用不同神经层提出一种高效强大的 CNN 架构。\n\
  \n以下是本章其余部分：第二节展示的文献研究，提供了几项已使用当前模型针对该主题进行的研究的快速总结。它建立了对各位前人研究者所用策略的详细理解。它还阐释了建议的模型如何为阿尔茨海默病诊断难题提供更好的解决方案。第三节重点介绍了模型训练过程中遇到的困难，以及用于解决阿尔茨海默病检测系统问题的建议方法。第四节总结了阿尔茨海默病检测系统，并规划了改进方向。\n\
  \n### 2. 相关工作\n\n患者阿尔茨海默病的早期阶段已被广泛研究和考察。但现有设计存在某些缺陷。其中许多创建并使用的算法在早期疾病检测方面成功率极低。一些方法采用了流域算法和图像梯度等图像处理方法，这些方法只能解释大脑在检测时尚未受损的情况。其他研究人员在\
  \ MRI 图像数据集上采用 SVM、回归和朴素贝叶斯等机器学习技术，达到了约 90% 的准确率。一些人采用迁移学习技术获得了高准确度，但完全脑损伤的患者却遇到了困难。利用\
  \ CNN 架构是另一种提供良好准确性的策略，但其缺点是算法复杂。\n\n#### 2.1 生物标志物与神经影像\n\n\n\nSuhad 等人 [1] 建议主要集中在两个要素上，具体为神经影像学和生物标志物。图像分析是其主要研究领域。该工作未描述阿尔茨海默病（AD）最初是如何被发现的，因为选定用于调查的大多数受试者已知患有\
  \ AD。在此过程中，回顾了重要的 AD 数据集，以及诊断方法和检测策略。尽管该方法可用于早期神经影像学研究，但结果并不充分。CFS 在阿尔茨海默病识别中的重要性也得到了证明\
  \ [12]。可用于诊断阿尔茨海默病的几个标志物包括 MSE、CDR 和 NWB 体积。该过程的 DT 算法产生的结果准确率很差，低于 80%，而 XG Boost\
  \ 算法只能达到略高的 80% 准确率。SVM 或 RF 分类器均未达到超过 81% 所需的准确率。已对诊断进展为阿尔茨海默病的痴呆的方法进行了考察 [5]。在利用机器学习、物联网、人工智能等各种方法学进行\
  \ AD 早期诊断的近期工作中，也考察了各种分析和评估策略。\n\n一种利用模型依赖先验知识进行优化的深度学习方法也被提出 [9]。它同时进行了 DR 和 DF。此外，它展示了当应用于小样本量患者病历时，如何利用多层学习模型和超参数提取更多\
  \ CSF。另一种与无监督 ML 相关的技术被提出 [14]。他利用结构化 MRI 图像数据预测阿尔茨海默病的进展，并表明其结果与有监督 ML 技术不相上下。\n\
  \n#### 2.2 图像分割\n\nShrikant 等人 [2] 的实现中使用了图像分割。其中的放大程度有助于将个体归入该模型定义的四个类别之一：MD、MOD、VMD\
  \ 和 ND。本质上，他们将患者分为这四组。采用分水岭算法根据图像梯度识别脑萎缩，以确定脑萎缩中是否存在空腔。该过程方法简单，完成所需时间极少。该方法的优势在于，它在解决先前检测问题的同时避免了脑损伤。JRip、朴素贝叶斯方法和\
  \ RF 被用于 [13] 对数据的各种输入图像进行分类。使用 Weka 软件应用程序分析数据。然后，使用浏览器、知识流和 API 对图像数据进行分类。比较结果后确定，JRip\
  \ 和 RF 算法优于朴素贝叶斯算法。\n\n#### 2.3 特征提取\n\n在来自 OASIS 的 MRI 图像数据中，[3] 采用了灰质和白质切片的三个不同视角。每个切片都包含提取的一阶特征。然后，使用检索到的特征生成相关性热图。随后，使用主成分分析方法降低维度。然后，使用包括回归（逻辑）、SVM、AdaBoost\
  \ 和朴素贝叶斯在内的各种机器学习算法，检查了其建议技术的性能和准确性。测试结果显示最高准确率为 90.9%，优于之前 ML 算法的发现。从脑电图信号中检索的数学统计以多种方式和各种特征被使用\
  \ [6]，包括均值、中位数、众数、极差、标准差等。测量揭示了多种异常。利用适当的特征提取工具，提取了各种特征。\n\n#### 2.4 迁移学习方法\n\n\
  所采用的预训练 VGG16 模型 [4] 是 TensorFlow 和 Keras 迁移学习网络的组成部分。它被用作从中提取特征的工具。使用性能指标，他们确定了模型的准确性。将数据分为\
  \ 20% 测试数据和 80% 训练数据的算法具有最高准确率，测试准确率为 95.31%，训练准确率为 97.49%。\n\n#### 2.5 神经网络和深度学习技术\n\
  \n通过利用具有 DL 架构的卷积神经网络，[7] 能够以 96.86% 的准确率识别阿尔茨海默病（LeNet）。同时，使用大量照片进行数据测试和训练。他们所达到的准确程度非常高，结论是：为检测阿尔茨海默病而选择的网络设计是合适的。\n\
  \n一种基于神经影像学利用 DL 技术进行 AD 识别的方法被提出 [8]。在 CNN 之后，他采用了 RNN。因此，他能够更好地理解每个类别视觉序列之间的联系。然后，基于所有输入图像做出最终决定。他缺乏足够的数据来训练\
  \ NN。Chenhui 等人 [10] 表明，DL 对理解 MRI 图像数据与生理意义之间的联系持有多种看法。脑区相关性输入为 DL 技术自编码器提供了更高程度的表示。并以显著更好的预测准确率实现了这一点。MRI\
  \ 图像中诊断检测的重要性得到了证明 [11]。尽管如此，精度仍不足够。不同的脑部扫描神经图像需要统计学上全面的数据集作为输入 [15]，展示了深度学习（DL）建模技术的增长。正电子发射断层扫描（PET）和磁共振成像（MRI）均为有效的视觉模态，可显示阿尔茨海默病（AD）进展过程中发生的大脑变化。利用结构\
  \ MRI 创建 3D 深度卷积神经网络 [16]，成功区分了轻度阿尔茨海默病痴呆、轻度认知障碍和认知正常人群。深度学习模型能够以 85.12% 的曲线下面积（AUC）区分\
  \ MCI 或轻度阿尔茨海默病受试者与认知正常受试者。\n\n#### 2.6 联邦学习\n\n创建学习信息和资源存储库联邦是随后多项计划的重点 [24、25\
  \ 和 26]。Rehak 等人 [26] 2005 年的参考模型描述了如何将存储库联邦化以构建可互操作的存储库基础设施。在此架构下，贡献存储库的元数据被收集到中央注册表中，提供单一访问和发现点。在基于提供者的软件（如利用数字患者病历开发估算医院再入院风险的模型\
  \ [27]）和基于患者（消费者）的软件（如利用智能手表收集的心电图检测心房颤动的存在 [28]）的联邦学习过程中，敏感临床数据可保留在本地组织或特定消费者处，而不离开它们。通过这种策略，患者隐私得到良好保护。\n\
  \n\n\n迄今为止提到的所有研究均采用了传统机器学习技术，其中数据存储和模型训练由单台计算机或服务器管理。因此，在训练之前，所有数据必须汇集到一个位置。传统机器学习算法[[17]](#ch12.xhtml#ref12_17)要求模型从大量样本中进行训练，但由于隐私顾虑，获取这些样本可能颇具挑战。在联邦学习（FL）环境中，在将获得的权重发送至主服务器进行聚合之前，每个模型都在本地硬件上独立训练。因此，仅将模型属性（如权重、梯度、参数等）传输至中央服务器。文献[[21]](#ch12.xhtml#ref12_21)重点强调了必须解决的障碍，并展示了联邦学习如何解决医学数据集收集的问题。因此，模型根据训练数据所用的总时间进行聚合，给定的策略是根据性能选择表现最好的模型。在他们的研究中，他们使用了一个略经改进的联邦学习模型，从医学影像数据中更准确地识别\
  \ COVID-19。\n\n### 3. 建议方法\n\n该模型通过联邦学习利用深度学习方法来分析和预测结果。该模型采用随机森林（RF）和 K 近邻（KNN）等机器学习方法，以及卷积神经网络（CNN）架构等深度学习算法，并将我们建议的模型与当前的模型和分类器进行比较。模型首先将使用两组图像作为输入：训练数据集和测试/验证数据集，经过各种处理流程后，将其分为两组。完成此过程后，我们将定义我们自己的纯\
  \ CNN 架构，其中将包含各种层类型，包括二维卷积层、Dropout 层、激活层、展平层、线性整流单元层和 Softmax 层。\n\n在该建议方法中，应用联邦学习方法在保护数据隐私的同时识别阿尔茨海默病。首先，利用\
  \ CNN 架构和迁移学习构建了一个能够精确识别阿尔茨海默病的深度学习模型。随后，使用 CNN 模型生成了一个用于阿尔茨海默病检测和分类的联邦学习框架。建议模型的贡献在于表明，在联邦框架中应用复杂算法不会显著恶化结果。因此，利用联邦学习技术，即使存在数据采集隐私顾虑，我们也能在治疗领域轻松创建可靠的分类器。\n\
  \n#### 3.1 概览\n\n图 1 展示了建议模型的总体布局。该框架由若干单个模块组成，这些模块以串行和并行方式连接；部分模块仅有一个单向前向箭头，而另一些则同时具有前向和后向箭头。MRI\
  \ 图像首先被输入，经过多个滤波器处理后，准备由模型进行处理。图像数据现已按 80:20 的比例分为两个新数据集：训练集和验证/测试集。新构建的神经网络（包含各种功能和滤波器的神经层）现用于处理数据。数据训练完成后，便是评估模型的时候，可通过获取准确率和损失函数来实现。最后，有必要可视化数据，并将其与以往提出的其他模型及现有的机器学习技术进行对比。\n\
  \n![图 1. 建议模型概览——基于深度学习技术的阿尔茨海默病预测。](img/fig12_1_B.jpg)\n\n图 1. 建议模型概览——基于深度学习技术的阿尔茨海默病预测。\n\
  \n#### 3.2 数据集\n\n阿尔茨海默病数据集包含 6,400 张 MRI 图像，分为四组，对应患者所患的四种阿尔茨海默病类型。MRI 图像中的个体年龄范围为\
  \ 45 至 85 岁。各类别图像如下：\n\n*   **轻度痴呆** – 该类别包含 896 张不同患者的 MRI 图像。\n*   **中度痴呆** –\
  \ 该类别仅包含 64 张不同患者的 MRI 图像。\n*   **非痴呆** – 该类别包含 3,200 张不同患者的 MRI 图像。\n*   **极轻度痴呆**\
  \ – 该类别包含 2,240 张不同患者的 MRI 图像。\n\n数据集经多渠道彻底检查，发现数据集中不存在同一患者的多张图像，也不存在患者的重复 MRI 扫描。数据按\
  \ 80%和 20%分为两类。80%的图像可用于训练模型。最后 20%的图像将用于测试和验证模型。图 2 展示了数据集中阿尔茨海默病 MRI 图像多种变体的随机表示。\n\
  \n![图 2. 阿尔茨海默病数据集 MRI 图像的不同变体。](img/fig12_2_B.jpg)\n\n图 2. 阿尔茨海默病数据集 MRI 图像的不同变体。\n\
  \n#### 3.3 预处理\n\n几何变换技术是一种用于图像预处理的算法。使用此方法，对输入图像进行缩放和调整大小以满足规格要求。图像分辨率为 176×208\
  \ 像素。模型要求尺寸为 32×32。因此，所有输入图像均需经过此降维函数处理。\n\n#### 3.4 构建卷积神经网络\n\n卷积神经网络属于人工神经网络中深度学习的一个子集。它由多个神经层组成，包括卷积层、池化层、Dropout\
  \ 层、全连接层、激活层、展平层、Softmax 层、线性整流单元层等。它是最常用于图像分类和识别问题的网络。平移不变性、空间不变性人工神经网络（SI-ANN）或\
  \ ConvNet 是它的其他名称。多层感知机（MPL）是一种全连接网络，其中前一层的每个神经元都与后一层的每个神经元相连，它是多层感知机（CNN）架构的旧版本。这种全连接层使数据更容易过拟合。为了避免过拟合，作为神经网络更新版本的\
  \ CNN 融合了多种正则化方法。\n\n该模型由多层神经网络组成，均适配于序贯模型中。序贯模型不允许多个输入和输出，这意味着模型的每一层在同一时间仅具有一个输出和一个输入。CNN\
  \ 架构的层包含多个超参数，有必要了解这些滤波器背后的含义。大小为`FxF`的滤波器应用于输入图像中存在的`C`个通道，因此`FxFxC`是将对输入尺寸`IxIxC`执行卷积并产生输出特征图`OxOxK`的体积。此处，`K`为滤波器的大小。\n\
  \n核卷积是一种技 ique，其中包含数字的 3×3 小矩阵通过输入图像，并根据该小矩阵（也称为滤波器和核）对其进行变换。现在按顺序计算所有特征图的值。用`f`表示输入图像，用`h`表示核，结果矩阵的行和列索引分别标记为'm'和'n'。输出特征图将表示为`G[m,\
  \ n]`，其中`G[m, n]`可表示如下。\n\n(1)\n\n```\nG[m,n] = (f*h)[m,n] = ∑[j]∑[k]h[j,k]f[m−j,n−k]\n\
  ```\n\n\n\n该过程类似于矩阵乘法，其中来自小矩阵 `kernel` 的每个值在被放置在图像像素上后，与输入图像的后续值成对相乘。所有结果相加后，现在保存在可访问的内存位置中，输出以特征图的形式呈现。最大池化是一种技术，它以矩阵的形式从每个划分的多个区域中选择最大整数值，并将其发送到下一层进行进一步处理。\n\
  \n该模型使用了 `Adam` 优化器。该优化基于一阶和二阶矩的自适应估计，称为随机梯度下降法。它接受的第二个参数是损失函数，设置为 `categorical_crossentropy`，这是一种用于具有多类分类的图像分类模型的损失函数。它接受的最后一个参数是指标，设置为\
  \ `accuracy`。模型接受多个参数，例如 `train_x`，即经过预处理的输入数据；下一个参数是 `train_y`，即输出数据，格式与输入数据相同；批次大小设置为\
  \ 32；epoch（迭代次数）设置为 350；verbose 设置为 1 以显示每次迭代的日志。\n\n#### 3.5 联邦学习\n\n一种称为联邦学习（FL）的新近开发的机器学习技术旨在解决严格的数据隐私法律问题以及现成数据集获取受限的问题\
  \ [18, 19 和 20]。联邦学习有两端：全局服务器或中央服务器，以及本地服务器或客户端。与存放全局模型的中央服务器不同，客户端服务器托管本地数据。得益于\
  \ FL 无需传输信息即可训练模型的能力，模型在一系列去中心化的终端设备上进行训练，数据保留在本地服务器上。修订后的权重由在客户端数据集上训练的邻域模型设定。因此，它保持了匿名性，这对于临床信息的精准诊断至关重要\
  \ [21, 22 和 23]。由于 FL 旨在防止全局模型与任何训练数据耦合，因此此场景中未使用预先训练的 CNN 模型。该场景涉及共享系统设置，并使用本地数据训练去中心化的客户端或节点。使用服务器，通过聚合系统或模型参数来创建全局模型。使用\
  \ FL 不需要用户共享任何机密信息。相反，用户在本地访问网络，并与称为服务器的中心化实体共享模型。然而，在 FL 中，每个用户都必须能够通过服务器实际且有效地发送其获得的模型。服务器在\
  \ FL 中使用迭代技术将本地数据聚合为全局网络。图 3 显示了建议的联邦学习模型架构。\n\n![图 3. 联邦学习模型（建议方法）。](img/fig12_3_B.jpg)\n\
  \n图 3. 联邦学习模型（建议方法）。\n\n#### 3.6 性能评估\n\n建议方法获得了非常好的结果，准确率达到 98.98%。建议方法的混淆矩阵如 图\
  \ 4 所示。绘制了测试数据和验证数据之间准确率和损失函数对比的图表。模型准确率和模型损失的绘图分别见 图 5 和 图 6。\n\n![图 4. CNN 模型的混淆矩阵（建议方法）。](img/fig12_4_B.jpg)\n\
  \n图 4. CNN 模型的混淆矩阵（建议方法）。\n\n![图 5. 模型准确率（建议方法）。](img/fig12_5_B.jpg)\n\n图 5. 模型准确率（建议方法）。\n\
  \n![图 6. 模型损失（建议方法）。](img/fig12_6_B.jpg)\n\n图 6. 模型损失（建议方法）。\n\n#### 3.7 模型训练过程中面临的挑战\n\
  \n##### 3.7.1 过拟合\n\n模型中的图像数据分为两组：一组是训练数据，另一组是验证和测试数据。CNN 模型中数据的过拟合意味着数据训练过度地试图使数据拟合得过好。这将导致训练数据集的准确率非常好且很高，而测试和验证数据集的准确率则会非常差且很低。简而言之，过拟合意味着高方差和低偏差。可以通过增加数据集中的数据点数量以及降低模型复杂度，或者在神经网络中使用\
  \ dropout 层来消除它。如 图 5 所示，y 轴表示模型的准确率，x 轴表示训练模型所用的 epoch 数，'x' 代表训练数据，而 'o' 代表测试/验证数据。结果表明，模型正在过拟合数据。通过添加\
  \ dropout 层和增加数据点数量来克服此问题。\n\n##### 3.7.2 欠拟合\n\n模型中的数据分为两组：训练数据和验证及测试数据。CNN 模型中数据的欠拟合意味着模型无法非常高效地拟合数据。这将导致训练数据集和测试及验证数据集的准确率都非常低。这可能是由于数据集中的数据点数量较少，或者数据集规模太小而无法训练模型。简而言之，欠拟合意味着低方差和高偏差。可以通过增加模型复杂度以及去除数据集中的噪声，或者增加训练模型所用的时间以及增加\
  \ epoch 数来消除它。如 图 5 所示，y 轴表示模型的准确率，x 轴表示训练模型所用的 epoch 数，'x' 代表训练数据，而 'o' 代表测试和验证数据。结果可以看出模型正在欠拟合数据。通过去除数据中的噪声和增加\
  \ epoch 数来克服此问题。\n\n#### 3.8 与现有模型的比较\n\n##### 3.8.1 K 近邻分类器\n\nKNN 分类器属于机器学习，归类为监督机器学习。KNN\
  \ 分类器根据新输入图像与特定类别或组中最近邻数据点的相似性对其进行分类。由于其复杂度低，该算法被广泛使用。它是用于图像分类的机器学习中最简单的算法之一。KNN\
  \ 分类器的准确率为 95.31%，低于建议的 CNN 分类器的准确率。KNN 分类器的准确率如下所示 图 7。\n\n![图 7. KNN 分类器的混淆矩阵（现有方法）。](img/fig12_7_B.jpg)\n\
  \n图 7. KNN 分类器的混淆矩阵（现有方法）。\n\n##### 3.8.2 随机森林分类器\n\n\n\n\n# 随机森林分类器\n\n随机森林是另一种机器学习算法；它也属于监督式机器学习范畴。该算法主要用于分类和回归问题。在这种情况下，算法从不同的输入参数集开发多棵决策树，并采用大多数决策树结果的投票来对数据进行分类。与其他算法相比，该算法运行时间更短。它是用于图像分类的机器学习中最快的算法之一。尽管与其他两种算法（即提出的\
  \ CNN 分类器方法和 KNN 分类器）相比，随机森林分类器在该阿尔茨海默病检测问题的图像分类中准确率被发现非常低，但随机森林分类器的分类报告和混淆矩阵如图\
  \ 8 所示。随机森林分类器的准确率仅为 75.28%，明显低于 CNN 分类器推荐方法的准确率。\n\n![图 8. 随机森林分类器的混淆矩阵（现有方法）。](img/fig12_8_B.jpg)\n\
  \n图 8. 随机森林分类器的混淆矩阵（现有方法）。\n\n###### 表 1：提出方法的平均性能指标对比\n\n| 序号 | 方法名称 | 准确率 (%)\
  \ |\n| --- | --- | --- |\n| 1. | 随机森林分类器 | 75.28% |\n| 2. | KNN 分类器 | 95.31% |\n\
  | 3. | CNN 分类器（提出的方法） | 98.98% |\n\n![图 9. 提出方法的平均性能指标对比。](img/fig12_9_B.jpg)\n\n\
  图 9. 提出方法的平均性能指标对比。\n\n### 4. 结论\n\n建议方法的主要目标是开发一种采用深度学习技术的 CNN 架构，利用基于 MRI 的神经影像学输入，在早期阶段识别阿尔茨海默病。基于\
  \ CNN 架构的提出模型，将 CNN 的性能与其他机器学习算法（包括随机森林和 KNN 分类器）进行了比较。由阿尔茨海默病数据集创建的模型使用了包含 6400\
  \ 张 MRI 图像的数据集。利用阿尔茨海默病数据集，通过精确率、召回率和准确率指标对建议技术进行了彻底检验。结果发现，与当代方法相比，建议方法实现了更高的精确度。经过多次编译后，模型的最佳准确率为\
  \ 98.98%，高于 KNN 和随机森林等所有先前的分类器。当将提出的方法（CNN 模型）与 KNN 和随机森林方法进行比较时，平均准确率分别为 98.98%、75.28%\
  \ 和 98.98%。未来的工作可扩展至移动技术的发展，这趋向于商业化和节省时间，重点关注医疗界，后者将极大地受益于快速识别、疾病进展比例的区分以及多类别分类。\n\
