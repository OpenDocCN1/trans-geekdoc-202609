  \ DNN 变体的资源高效联邦深度学习是直接在设备上学习的一种可能解决方案。REFDL 是在物联网资源环境中实施的首选方法。\n\n![图 8. 使用 REFDL\
  \ 和 BFDL 在 MNIST 数据集上联邦模型的训练时间](img/fig6_8_B.jpg)\n\n图 8. 使用 REFDL 和 BFDL 在 MNIST\
  \ 数据集上联邦模型的训练时间\n\n图 9 展示了 REFDL 和 BFDL 在 MNIST 数据集上的收敛精度与其他 DNN 版本的比较。因此，可以假设 REFDL\
  \ 将始终优于 BFDL。通过结合 CNN 和 FCNN (DNN) 模型的多种变体，它可以正确分类图像样本。这一发现指明了优化过程在开发全局深度联邦模型中的价值。它进一步突显了在\
  \ FL 技术中有效使用 CNN 以提高准确性的成效。这很有帮助，因为它利用了各种 DNN 模型在设备上学习效率的差异。\n\n![图 9. 利用 MNIST\
  \ 数据集估算 REFDL 和 BFDL 的联邦模型准确率](img/fig6_9_B.jpg)\n\n图 9. 利用 MNIST 数据集估算 REFDL 和\
  \ BFDL 的联邦模型准确率\n\n为了评估 REFDL 在联邦环境中的效率和学习速度，我们在 GB-BXBT-2807 测试平台上使用不同数量的 epoch\
  \ 迭代运行了 FCNN-MNIST 流程。我们可以在那里快速评估多种联邦方法的相对优劣。图 10 显示，REFDL 仅需一个本地 epoch 和 50 个通信周期即可达到更高的精度水平。所有后续的\
  \ epoch 迭代都保持了这种精度不断提高的模式。特别是，集成的 FCNN 模型加速了边缘设备上的学习，证明了 REFDL 的适用性。REFDL 至少需要一个\
  \ epoch 的限制是一个优势，特别是在物联网等内存限制已存在的环境中。\n\n### 6. 结论\n\n在本文中，我们探讨了在物联网等低资源环境中训练联邦学习的可行性，其分布式机器学习模型可以同时保护大量客户数据的隐私，并促进网络边缘节点上的设备端学习。为了提供针对物联网的有效且实用的防护。在本研究中，我们将\
  \ BFDL 算法 FedAvg 与几个精心挑选的模型优化策略相结合，创建了一个功能强大且数据利用经济的联邦 REFDL 模型。八个物联网数据集和一个图像数据集被用于在模拟和真实的\
  \ GB-BXBT-2807 测试平台上评估 REFDL 的功效、简洁性和效率。它在利用极少资源识别物联网攻击方面优于其他方法。在联邦训练环境中，它使用相同数据对图像数据的分类准确度高于全连接网络或卷积网络。此外，REFDL\
  \ 生成更准确的 FL 模型所需时间比竞争对手更少。受这些令人鼓舞的发现启发，我们希望对部署过程中计算网络中更多节点/客户端设备的使用进行进一步研究，重点关注有线和无线环境。具体来说，在一个比本研究探索的连接边缘设备范围更广的真实网络场景中，我们旨在研究\
  \ REFDL 的鲁棒能力，以增强其对抗对抗攻击的安全弹性。通过这种方式，我们可以在广泛的地理分散边缘设备上考察我们提出的方法对资源使用和安全监控的影响。\n\n\
