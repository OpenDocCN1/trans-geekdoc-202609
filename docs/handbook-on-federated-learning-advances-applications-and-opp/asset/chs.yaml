  \ for fault detection in IoT.\n\n\n\n区块链有助于众包请求者验证是否存在任何欺诈性的客户更新。虽然我们的系统使用区块链来追踪众包活动，但旧系统由第三方维护，他们向客户收取高昂的服务费用。因此，客户和请求者可以在保持众包方法有效性的同时，避免支付昂贵的服务费用。考虑到模型规模巨大时的区块大小限制，我们建议使用星际文件系统（`IPFS`）作为分布式存储解决方案。更具体地说，在第一阶段，客户使用部署的特征提取器在移动端提取其数据的特征，并通过添加具有正式隐私保证的噪声来扰动恢复的特征。在第二阶段，客户在\
  \ `MEC` 服务器上使用扰动后的特征训练全连接模型层。此外，我们通过移除均值和方差要求并施加一个界限（其中 `N` 指定批量大小）来增强传统的批量归一化。训练完成后，客户使用其私钥对加密模型的哈希进行签名，将本地训练的模型传输到区块链。为了获得全局模型，选定的矿工下载模型，检查发送者身份，然后对所有模型参数进行平均\
  \ [[24]](#ch13.xhtml#ref13_24)。\n\n#### 3.2 基于 IoT 的酒店设备传感器\n\n无线传感器和执行器的部署使得基于\
  \ `IoT` 的自动化成为可能，它使各种物理设备能够进行数字化交互，让基础设施管理员能够轻松地从全球任何地方监控和监督大规模基础设施的运营。通过一个中心化的云平台，它能够根据所需视角利用\
  \ `AI/ML` 算法进行数据收集和分析 [[25]](#ch13.xhtml#ref13_25)。为了在这种快节奏的环境中蓬勃发展并占据榜首位置，酒店业迫切需要基于\
  \ `IoT` 的自动化。在全面监控的帮助下，酒店将能够提供高质量服务、优化住客舒适度并降低这一宝贵业务中的成本。\n\n![Figure 4. Connectivity\
  \ of device sensor through IoT.](img/fig13_4_B.jpg)\n\n**图 4. 通过 IoT 实现设备传感器的连接。**\n\
  \n设备通过多种协议集成，包括 `MODBUS`、`BACnet` 等。经典的 `BMS` 或传感器和执行器用于收集各类设备的运行和操作数据。最终，控制器或网关使用\
  \ `IoT` 将收集到的数据发送到云平台。数据和统计信息经过个性化处理并显示在中央仪表板上，可通过笔记本电脑、平板电脑等设备访问，并利用 `AI/ML` 算法进行处理。仪表板赋予基础设施管理员远程监控整个设施或一组设施并采取适当行动的能力。根据要求，管理层可以设置这些资产的运行基于时间表或传感器\
  \ [[26]](#ch13.xhtml#ref13_26)。这种个性化控制确保了电力的有效利用。仪表板还会创建维护工单，提醒管理层采取预防措施修复易发生故障的设备，以防止服务交付中断。让我们预期一下基于\
  \ `IoT` 的自动化能为酒店带来的一些实用优势。良好的第一印象无法重来。同样，当客人从前台区域进入酒店时，酒店必须为他们维持舒适的温度。在光线充足的前台区域，需要舒适的温度和足够的通风。这能让客人精神焕发，并使他们欣赏酒店的氛围。通过使用基于\
  \ `IoT` 的技术对 `HVAC` 和照明系统进行适当的维护和监控，可以按要求保持这种氛围。然而，这些控制也可以调整以在餐厅、大堂和娱乐空间营造宜人的氛围。\n\
  \n入住率也可纳入这种定制考量中。据观察，此类更新可将客人舒适度提高 40%–45%。许多酒店备有易腐食品以全天候为客人服务。为了保持食物新鲜，他们可以使用自动化控制来维持冷柜和冷库的温度。如果食物美味新鲜，消费者总会倾向于选择您的酒店。其他设施如干衣机、冰箱、洗碗机、洗衣机和热水器也可以轻松调节，使其始终可用并有效满足住客需求，此外，持续提供这些服务对于给访客提供精致舒适至关重要\
  \ [[27]](#ch13.xhtml#ref13_27)。由于这些是使一家酒店在酒店业中脱颖而出的主要设施，酒店无法承担此类资产的任何形式故障。持续监控是一种使资产始终处于受控状态的解决方案。设施管理者会通过工单立即收到任何设备轻微波动的通知，从而采取预防措施在设备完全停止工作前进行检查和维修。这使得设备故障成本可降低\
  \ 20%–25%。了解在不同时间段内提供此类设施所使用的能源量。\n\n![Figure 5. Design of IoT with Federated Learning.](img/fig13_5_B.jpg)\n\
  \n**图 5. 融合联邦学习的 IoT 设计。**\n\n这使管理者能够控制成本，仅花费必要的开支。环境和酒店都能从这些节省中受益。\n\n![Figure\
  \ 6. The Federated Learning for IoT system.](img/fig13_6_B.jpg)\n\n**图 6. 面向 IoT\
  \ 系统的联邦学习。**\n\n持续监控的结果是每节省一分就获得一分利润。在电力成本占总支出如此大比例的行业中，谁不想节省 10%–20%？甚至仪表板还使得全国各地各种设施的监控成为可能。当酒店掌握不同物业的此类集中统计数据时，可以采用最有效的程序。管理者或酒店业主必须拥有完整信息，才能就其电力使用和支出做出有效决策。基于\
  \ `IoT` 自动化对酒店的三大主要目的：提高客户舒适度、降低能源成本、简化设施监控，并提供跨所有地点的统一可见性。技术正在飞速发展，我们不应错过利用其优势的机会。我们发现，安装此类自动化结构是多么简单。为了使传统酒店更加节能，`Solutions`\
  \ 为酒店业提供基于 `IoT` 的能源和资产管理解决方案。通过部署与 `IoT` 连接的传感器，您的酒店结构翻新是值得的 [[28]](#ch13.xhtml#ref13_28)。\n\
  \n### 4. 酒店中使用的传感器和探测器类型\n\n\n\n酒店行业因其业务性质极其特殊，需要各种传感器和探测器以实现可靠、高效和安全的运营。以下列出其中一些：\n\
  \n**烟雾探测器**是探测烟雾的装置，通常作为即将发生火灾的征兆。作为火灾报警系统的一个组成部分，商用安防设备向火灾报警控制面板提供信号。\n\n**热探测器**：热探测器是一种在环境温度发生突变时提醒用户的装置\
  \ 29。如果温度上升超过设定阈值，水喷淋系统将接收到信号。\n\n**运动或占用探测器**是根据传感器视野内特定位置是否有人，在探测到移动时开启或关闭灯光和其他设备的装置。\n\
  \n![Figure 7. Sensor connectivity to Arduino.](img/fig13_7_B.jpg)\n\n图 7. 传感器与 Arduino\
  \ 的连接。\n\n在多家酒店中，**pH 探测器**被用于监控水处理厂、锅炉、游泳池和污水处理厂等设施的水质 pH 值。使用**燃气泄漏探测器**可发现燃气库的**液化石油气\
  \ (LPG) 泄漏**。**气体探测器**用于探测特定场所可能存在的危险气体。它们被用于探测 CO₂、有毒气体和可燃气体。**火焰探测器**利用光学传感器寻找火焰。**一氧化碳浓度探测器**这种传感器装置通过发出某种警报来提醒用户一氧化碳的存在，以便通过增加区域通风和/或疏散居住者等措施来降低浓度。**光传感器**\
  \ - 这些传感器用于测量现有自然光的量量，根据需要调整灯管和灯泡的光输出，并控制整栋建筑灯光的开关。它有助于节能并降低物业的电费账单。**闭路电视 (CCTV)**\
  \ 是一种利用摄像头的“数字眼”将特定区域内人员活动的信号广播到存储区域或有限数量显示器的系统。\n\n**物联网**，即通过互联网连接事物与人，已确立为跨多个行业开展业务的新方式。**物联网**改进了流程并提供应急服务，以实现实时快速有效的响应。管理者拥有利用这些资源所需的知识和沟通能力。在本研究中，建议使用**基于物联网的模型**来评估和检查对火灾隐患的快速反应。火灾是全球意外死亡的主要原因之一\
  \ 30。\n\n#### 4.1 Arduino 物联网火灾探测\n\n该拟议系统使用低成本的 **Wi-Fi 模块**、**气体探测传感器**、**火焰探测传感器**、**蜂鸣器**用于报警以及**温度传感器**来创建。利用传感器收集的信息，传感器识别局部紧急情况并通知系统，同时通过一个与所有机构紧密连接的模块，将精确位置传递给用户和操作员，从而向消防部门、警察局和医院等酒店相关机构发出警报。**物联网**被用于创建一个集成智能系统，以管理对无辜生命和财产的此类风险。这是最常用的监控设备类型\
  \ 31 。**火焰传感器**按电路图所示连接到 **Arduino Nano** 的 **数字输入引脚**。如果您仍感兴趣，可以查看我们过去开发的一些其他简单火灾报警电路。由于\
  \ **SIM800L** 在 3.3V 逻辑电平下工作，因此通过电平转换电阻将其连接到 **Arduino Nano**。考虑到 **SIM800L** 模块的\
  \ 3.4–4.2V DC 工作范围和 **Arduino Nano** 的 5V DC 外部供电，需为其单独供电。在这种情况下，可以使用 3.7–5V **升压转换器**\
  \ 代替两个电源。\n\n本项目提出的基于**物联网**的火灾报警和监控系统最适合商业和住宅应用。导致珍贵生命和昂贵财产损失的意外死亡的主要因素是火灾。火灾的主要特征是其指数级增长，蔓延迅速并吞噬接触到的一切。因此，早期火灾探测对于挽救生命和保护财产至关重要。它可以探测烟雾、温度升高、火势蔓延等，并通过\
  \ **GSM** 将该信息传递给远程控制单元，以采取必要措施并通知最近的救援机构。拟议系统可探测火灾、多种气体和烟雾 32。该供应隐患系统映射到当地应急服务，如消防部门、警察和医院。这种基于\
  \ **物联网框架** 的火灾和气体传感系统专注于公共安全和民生服务领域。图 8 显示了使用标准化 **物联网** 设计技术的火灾探测系统。易燃气体传感器 **MQ-6**\
  \ 用于探测 **LPG/LNG** 等气体，火花探测传感器 **PT333B** 用于探测火花，**GPS 模块**用于确定设备位置。这些传感器通过互联网连接到\
  \ **Wi-Fi 微控制器**，使其能够将任何隐患的状态传输到最近的服务中心以寻求任何类型的援助。将互联网接入延伸至工具、小工具和日常物品被称为 **物联网**，它配备了各种设备（例如传感器），这些工具通过远程系统共享信息，并可被细致监控，且可利用它们定期进行修改。由于各种进步，包括运行时分析、框架学习（**机器学习**）、传感器、传统嵌入式板级系统、无线传感器系统、控制系统、包括酒店和楼宇自动化在内的自动化等，\
  \ **物联网** 的定义已发生改变 33。\n\n![Figure 8. Diagram for Arduino IoT fire detection.](img/fig13_8_B.jpg)\n\
  \n图 8. Arduino 物联网火灾探测图解.\n\n#### 4.2 物联网的革命\n\n\n\n# 物联网创新与联邦学习集成\n\n## 概述\n\n\
  物联网创新在消费市场中最为人所知的是与“智能家居”概念相关的产品，包括支持至少一种典型生活方式并可通过电话及其他连接到该框架作为遥控器的设备（如音箱和手机）进行控制的家用电器和小工具。我们在该项目中使用物联网，以快速评估可能出现的风险，并使其保持在安全距离之外。物联网有助于为客户简化一些事务。有了这个选项，它为我们提供了在必要时扩展系统的能力，使其更加可靠和高效。\n\
  \n火灾是一种威胁生命和财产的可怕场景，且蔓延迅速。每年，火灾伤亡导致数千个家庭和生命的损失。通过预防火灾发生并提前采取必要的防护措施，可以节省大量资金。在发达国家，家庭配备了安全设施。然而，在发展中或欠发达地区，模型规模巨大，需要一种解决方案。\n\
  \n## 隐私保护联邦学习框架\n\n更具体地说，客户端使用部署的特征提取器在移动端提取其数据的特征，并在第一阶段通过添加具有形式化隐私保证的噪声来扰动恢复的特征。客户在\
  \ `MEC` 服务器上使用扰动后的特征训练全连接模型层，作为第二阶段。此外，我们通过移除均值和方差要求并施加一个界限（其中 `N` 指定批次大小）来增强传统的批量归一化。客户在训练后通过使用其私钥对加密模型的哈希值进行签名，将本地训练的模型传输到区块链。为了获得全局模型，选定的矿工下载模型，验证发送者身份，然后对所有模型参数进行平均\
  \ [34]。全局模型由一名被选为临时领导者的矿工加密并上传到区块链。此外，我们采用基于声誉的众包激励机制，奖励可信客户并惩罚不诚实客户，以鼓励更多用户参与众包工作，防止有害和恶意更新。\n\
  \n![Figure 9. IoT to Federated Learning communication model.](img/fig13_9_B.jpg)\n\
  \n**图 9.** 物联网到联邦学习通信模型。\n\n物联网管理的核心是信息共享，旨在通过共享安排发送信息，以造福特定应用中的最终用户。为了实现具有低延迟和隐私保护的智能物联网系统，联邦学习提供了共享学习结果作为共享原始物联网数据的替代方案。该工作为工业物联网应用提供了一种协作信息共享方法，实现了数据所有者和数据请求者之间去中心化多方的快速安全数据流。构建了一个联邦学习方案，以支持对请求者提出的查询所涉及的数据共享需求类型进行估算，从而为这些查询返回准确计算的结果，这种共享通常是由于酒店中物联网用户的资源限制而进行的。此外，将区块链与联邦学习架构相结合，形成由所有各方拥有的不可变数据块，以实现透明度，并在不需要中央权威的情况下增强数据所有权。这保护了共享过程免受外部威胁。一旦数据存储在区块链中就无法篡改或覆盖，这降低了数据泄露的可能性，从而提高了网络安全性。仿真结果利用实时数据集验证了所提议的基于联邦学习的共享框架的便利性，具有最高的学习准确性和增强的安全性。根据这方面的讨论，作者基于联邦学习思想创建了一个工业物联网统一张量挖掘系统，以整合多源数据并实现具有安全保证的基于张量的挖掘。具体而言，工厂通过与中央服务器共享其使用同态加密策略加密的数据来协作参与张量挖掘。这样，原始数据保留在本地工厂，确保了张量挖掘的数据隐私，而服务器仅聚合密文数据并将其联邦化为张量。即使攻击者可以在通信窃听信道上的密文，窃听者也可以伏击中央服务器以窃取聚合的密文，他们也无法获得数据解密的密钥。与隐私保护压缩感知策略相比，所提出的联合方法可将挖掘精度提高\
  \ 24%，并通过利用北京和上海的两个工业碰撞（每个工厂拥有 100 多个物联网节点）进行仿真，提供了高安全性。该攻击定位有效且准确，且不影响性能 [36]。车载系统中的分布式信息共享已利用联邦学习实现。根据该研究，提出了一种非同步联合信息共享系统，其中每辆车作为联邦学习客户端，与大规模基站处的聚合服务器共同共享信息。\n\
  \n##### 4.3 面向物联网的多层区块链系统\n\n\n\n\n\n## 结论\n\n本章为理解酒店行业的物联网设备故障检测提供了一种联邦学习策略，旨在提供一个拥有无瑕疵设备传感器的精准服务系统。在所提议的系统中，原始数据在本地存储，中央服务器协调客户端服务器以训练用于检测的共享全局模型。设计中采用了区块链技术，以提供客户端数据的可验证完整性以及对客户端贡献的经济激励。建议采用一种联邦学习算法，基于各客户端数据集正类与负类的分离，以减轻数据异质性的影响。利用一个真实世界的用例，基于建议的架构开发了一个概念验证原型。采用联邦学习算法来评估该策略的可行性、检测精度和性能。评估结果表明，所提策略成功实现了所有目标。尽管大多数联邦学习模块被提议通过将本章使用的客户端服务器上的所有模块迁移至具备更强计算和存储能力的客户端设备来改变这一概念。为使物联网设备制造商更好地了解其客户，本研究提出了一种基于区块链的联邦学习系统设计。该系统采用多种前沿技术构建，包括区块链、分布式存储和联邦学习。此外，该系统强制实施差分隐私（DP）以保护客户数据隐私。开发了一种新颖的归一化方法，当特征隐私受\
  \ DP 保护时，其性能优于批量归一化，能够提高联邦学习模型的准确性。如果提供适当的激励系统，客户更有可能参与酒店任务。物联网设备的优势在于为酒店客户提供即时信息。作为联邦训练的一部分，区块链将审核所有消费者更新，以便系统对模型升级负责，并阻止不诚实的用户或制造商。我们计划在未来运行进一步测试，并利用实际家用电器型号的数据集评估我们的系统。\n\
