  \ learning. *arXiv preprint arXiv:2001.08600*.\n\n## 第 2 章 联邦数据模型——本地化、全球化与融合化——工业\
  \ 4.0 背景下\n\n*Daniel Einarson*²\n\n计算机科学系，自然科学学院，瑞典克里斯蒂安斯塔德大学。\n\n### 1. 前言/背景\n\
  \n本文旨在探讨在联邦学习视角下创建数据模型的相关方面，以及如何以数据融合为核心，从 AI 角度实现联邦学习。我们讨论的背景是侧重于制造业及其传感器与机器人技术的工业\
  \ 4.0 环境下的联邦学习，包括该数据领域中的计算和语义方面。\n\n第一作者拥有自主自我感知软件组件的分层组合设计背景，此类组件在特定环境中协同工作。针对此类场景，已开发出用于表示智能体的过程模型，例如用于机器人技术，也用于生物生命系统，如特定环境中的鸟类。此处特别重要的是，智能体的感知能力由\
  \ AI 概念来表示。AI 的一个关键概念是机器学习和人工神经网络。尽管如此，在智能体的背景下，开发互补模型被认为既有趣又重要，其灵感来源于认知科学领域，旨在将反射性行为表示为对外部刺激的响应。因此，这种互补建模被视为从理论和技术角度均具有研究价值，并提供了未来可能的建模选项。\n\
  \n第二作者在澳大利亚联邦科学与工业研究组织（CSIRO）矿产资源部门创立并开发了一个 4D 数据管理系统，历时数年，专注于如何通过索引合并数据。该数据管理系统称为`VoxelNET`\
  \ [1]，专注于如何融合异构数据集，这些数据包含制图、GIS、地形数据、岩石钻探数据、各类传感器数据（带 GPS 位置）、随时间（T）水平和垂直移动的物料数据，且要求具备可扩展性。所有这些数据的共同分母是*体积*。在矿业中，一切关乎体积计算，以及地质和矿产（金、银、铜、锂、铁……）赋存于岩石何处。矿业面临矿产资源减少的问题，意味着开采作业必须向更深处推进。由于深部温度较高，机器人需要取代人类以确保我们始终安全。这引出了机器人技术，以及联邦学习必须如何运作、或我们希望其如何运作，以造福整个*制造价值链*，在该链条中，许多操作任务由各种承包商及人员/机器/机器人执行。\n\
  \n本章为联邦学习在工业 4.0 背景下的适用性设定了场景，而非解决具体的技术方案。此外，联邦学习的 AI 层面通常指机器学习。然而，在工业 4.0 自主设备的背景下，作者认为有必要扩展这一\
  \ AI 概念，使其也包含认知方面。虽然基于机器学习的联邦学习已被证明可以自动执行，但这一扩展为工业 4.0 环境带来了新的挑战和新的机遇。\n\n### 2.\
  \ 引言\n\n\n\n\n\n# 制造业正面临严峻的两难困境\n\n制造业正面临严峻的两难困境；拥有各种应用的行业知道，在数据和人工智能方面的协作是唯一的出路。围绕竞争顾虑、知识产权、数据主权及其他监管要求存在挑战，这些因素将数据（并最终将创新）孤立在孤岛中\
  \ [[2]](#ch2.xhtml#ref2_2)。通用孤岛是最大的挑战和瓶颈，造成了一个个小的信息孤岛，也无法为更宏大图景的整体共享知识做出贡献。应用中的整体数据感知创造了竞争优势。从计算机科学的角度来看，我们通常谈论上下文，这同时适用于数据语义和数据处理，即带宽、速度、内存和含义。上下文需要扩展机会，我们已有\
  \ ISO 标准 [[3]](#ch2.xhtml#ref2_3) 和其他数据标准，以便构建更宏大的整体。\n\n“人工智能”（AI）一词最早由约翰·麦卡锡于\
  \ 1955 年提出 [[4]](#ch2.xhtml#ref2_4)，他基本上将 AI 定义为“制造智能机器的科学与工程，尤其是计算机程序” [[5]](#ch2.xhtml#ref2_5)。AI\
  \ 是指计算机程序和机器人模仿人类及其他动物自然智能的能力，主要是认知功能，如规划一系列行动和泛化的能力 [[6]](#ch2.xhtml#ref2_6)。\n\
  \n联邦学习（FL）被定义为无需集中训练数据的协作式机器学习（ML），FL 平台是为分散的非集中式数据开发的数据科学系统 [[7]](#ch2.xhtml#ref2_7)。在\
  \ FL 中，共享预测模型协作学习，并将所有训练数据保留在本地设备上，而不将所有信息存储在单个服务器上。IBM 将 FL 作为一种概念 [[8]](#ch2.xhtml#ref2_8)，视为一种无需任何人查看或接触数据即可训练\
  \ AI 模型的方式，提供了一种释放信息以供新 AI 应用使用的途径，并回应了这样一个问题：如何在无需移动和集中存储训练数据（即 AWS [[9]](#ch2.xhtml#ref2_9)\
  \ 等服务器/云服务）的情况下训练数据模型。代表问题的`通用数据模型`是基础，而是将变化或异常发送回中央服务器以更新、聚合对中央数据模型的更新。从本地角度来看，这是关于克隆一个通用的中央数据模型，将其复制到多个本地设备，然后在本地操作和运行其原始数据。\n\
  \n行业从孤岛式方法转型时，集成平台即服务（iPaaS）[[10]](#ch2.xhtml#ref2_10) 可以是打破现有孤岛的第一步。根据复杂性和所解决的问题，FL\
  \ 的通用数据模型可以在分布式系统中结合，运行并使用多个微服务，这些微服务通过多个 API 进行组合和集成。\n\n本章将从 FL 的概念及其与 AI 的联系开始。随后，我们在工业\
  \ 4.0 的背景下设定场景。为了进一步理解 FL 及其相互依赖关系和问题，我们增加了机器/计算机方面的内容，包括边缘设备和机器人技术的视角。为了协调 AI 的\
  \ ML 侧与认知，作者增加了一个简短的小节，简要涉及人类和动物的认知。为了进一步将主数据模型置于视角中并聚焦，作者继续讨论数据互操作性和数据模式识别，最后总结本章。\n\
  \n### 3. 论联邦学习\n\n联邦学习作为一个概念最早由 Google 提出 [[11]](#ch2.xhtml#ref2_11)，以回应这样一个问题：模型能否在无需移动和集中存储训练数据的情况下进行训练\
  \ [[12]](#ch2.xhtml#ref2_12)。这种方法在以下情况下尤为关键：分布式系统包含存在于孤立孤岛中的大量数据 [[13]](#ch2.xhtml#ref2_13)，或具有敏感数据的本地节点。正如\
  \ [[14]](#ch2.xhtml#ref2_14) 所指出的，许多现实场景涉及数据分布在大量设备上。应用可能要求数据保持本地化，受法律原因限制，也受网络容量或计算能力限制。在这里，FL\
  \ 回应了上述问题所指出的需求。\n\n典型例子如 [[15]](#ch2.xhtml#ref2_15) 所指出的，涉及手持移动设备的分布，这是当今许多人主要的计算和个性化设备。此类设备通常依赖训练算法来改进个性化设置，以获得高质量和智能的用户体验，例如预测键盘输入。正如\
  \ [[15]](#ch2.xhtml#ref2_15) 所指出的，用户产生的键盘数据可作为训练数据加以利用。尽管如此，据估计，2023 年全球智能手机数量将达到\
  \ 69.2 亿 [[16]](#ch2.xhtml#ref2_16)，预计未来将进一步增加。这些事实清楚地指出了中心化算法在用户体验训练中的局限性，涉及通信和计算能力。此外，此类用户体验通常基于个人选择，此类个人信息的披露受欧盟\
  \ GDPR 等立法管辖，或受美国和中国相应行动的管辖 [[13]](#ch2.xhtml#ref2_13)。在这里，联邦学习被描述为一种允许在本地客户端进行学习的解决方案，提供隐私收益以及分布式计算\
  \ [[14]](#ch2.xhtml#ref2_14)。\n\n此外，如果我们需要上下文映射（例如 3D 映射），同时交叉关联不仅是一维数据、二维数据、三维数据和四维数据，并理解数据中的相似性和差异性，那么如何训练来自不同语境的数据就成了一个问题。通过\
  \ FL 的协作方法，利用不同源数据及其优势和劣势，而不陷入 API 湖，我们正在迎来数据和分析需求与要求的新时代。\n\n#### 3.1 论联邦学习技术\n\
  \n联邦学习的一个关键组件是机器学习（ML），ML 通常基于人工神经网络（ANN）。发明 ANNs 旨在模仿生物神经网络（BNN）的结构和功能，如人脑。简而言之，BNN（和\
  \ ANN）的结构由若干层连接和通信的神经元组成，这些结构有助于解决非线性问题。在 ML 背景下，`训练`基本上是指构建能在复杂语境中高效映射输入到输出的 ANNs，这些问题难以用传统编程方法解决（例子可能包括图像处理，这类问题通常被视为人类等生物的\
  \ BNN 很容易解决）。ML 和 ANNs 是相当知名的技术，有多个来源可供进一步了解（请参阅如 [[17]](#ch2.xhtml#ref2_17) 了解\
  \ BNNs 作为 ANNs 灵感来源的更多信息，以及 ML 和 ANNs 的相当全面的介绍）。训练 ANN 通常通过数据与训练模型（ANN）之间的一对一关系在一个特定的本地设备上执行。因此，联邦学习可被视为一个由一个中心节点协调的用于设备端智能的分布式\
  \ ML 平台。\n\n\n\n\n\n针对前文概述的“在无需将数据集中放置的情况下训练模型的机会”这一问题，已提出多种技术来支持联邦学习。在此背景下，协调分布式训练和中心化聚合发挥着重要作用。根据[18]，协调与分发可通过以下步骤进行总结，这些步骤基于图\
  \ 1 中概述的结构。此处，一个中心节点（图 1 中的中央服务器）聚合客户端节点（图 1 中的节点 1、2 和 3）执行本地训练的行动结果。以下步骤代表一轮分布式训练，并通过迭代执行以达到合理的准确度：\n\
  \n![图 1. 基础联邦学习方案示例 [22]。](images/fig2_1_B.jpg)\n\n图 1. 基础联邦学习方案示例 [22]。\n\n1. \
  \ **初始化**：节点被激活并等待中央服务器下发计算任务。\n\n2.  **客户端选择**：选择本地节点以开始在本地数据上进行训练。\n\n3.  **配置**：中央服务器指令选定节点以预先指定的方式在其本地数据上对模型进行训练。\n\
  \n4.  **上报**：每个选定节点将其本地模型发送至服务器进行聚合。中央服务器聚合接收到的模型，并将模型更新发送回节点。\n\n5.  **终止**：一旦满足预定义的终止标准（例如，达到最大迭代次数，或模型准确度超过阈值），中央服务器聚合更新并最终确定全局模型。\n\
  \n本节不再详述联邦学习实现细节的进一步讨论。有关联邦学习背后原则的实现细节的更多信息，请参阅[19]。对于当今的联邦学习系统开发者，存在预先开发好的平台，开发者无需关心底层机制，即可进行创造性的定制化开发。例如，[20]提供了基于\
  \ Python 编程的 TensorFlow Federated (TFF) 平台的信息，并附带多个示例，说明如何设置 TFF 环境，以及如何开始使用它来加速构建过程。此外，Oracle\
  \ 提供了类似的支持，但以 Java 作为开发编程语言（[21]）。\n\n#### 3.2 联邦学习与人工智能的观点\n\n基于物联网的系统通常在数字工厂的语境下被提及（详见后续章节），根据[23]，作为一种概念，这有助于使工业变得更加智能。文中指出，AI\
  \ 将影响物联网设备上的 ML 训练，并以 FL 作为分布式 ML 的平台。也就是说，AI 被视为一个包含不仅 ML 而且 FL 在内的更高层级概念。FL 的\
  \ AI 视角在[13]中也有论述，该文献特别将数据孤岛、数据隐私和安全描述为两大 AI 挑战。\n\n作为一个领域，ML 通常被视为包含在更广泛的 AI 领域中。此外，AI\
  \ 在认知科学领域也被视为一种模拟认知行为的方式，以及对外部刺激的响应。此处 AI 的认知层面具有双重性：我们常用的一种传感器是延伸感知，第二是人类认知功能，如视觉（图像、视频、3D\
  \ 激光雷达）、听觉（声音）、触觉、嗅觉（香气/气味）和味觉（味蕾）。为了理解这些数据，我们通常必须像我们的认知感知器最初亲身经历那样，对其进行分析和编排。\n\
  \n尽管如此，ML 仍是 FL 领域的关键组成部分，且 AI 的进一步子概念通常不被视为问题。然而，ML 在数据不平衡[24]甚至数据缺失方面存在明显局限。因此，作者将关于联邦学习\
  \ AI 的讨论进行了扩展，不仅关注 ML，还结合认知科学的概念来补充 AI 方法，如图 2 所示，并在后续章节中讨论。本章作者意识到此类方法超出了 FL 的常规框架，但仍希望阐明重要原则，并为进一步的讨论和研究主题敞开大门。\n\
  \n![图 2. 联邦学习、AI、ML 与认知的示意图，a) 常规视角，b) 扩展视角。](img/fig2_2_B.jpg)\n\n图 2. 联邦学习、AI、ML\
  \ 与认知的示意图，a) 常规视角，b) 扩展视角。\n\n### 4. 工业 4.0\n\n第四次工业革命或 4IR，也称为工业 4.0 和“互联时代”，起源于\
  \ 1900 世纪，从手工生产方法发展到机器生产。随后发生了一场技术革命，铁路和电报网络大规模建设，意味着人员和思想的传递更加快捷。第三次工业革命（也称为数字革命）在两次世界大战后迅速发展，完全重塑了工业化的新格局，并为\
  \ 4IR 奠定了基础。\n\n工业 4.0 包含关键组件，如网络物理系统（CPS），其中“CPS 的功能已被确定为监控物理过程并创建物理世界的虚拟副本，以支持去中心化决策”[25]。CPS\
  \ 的概念与数字孪生相一致，数字孪生与其对应的物理系统的虚拟副本相关联[26]。通常，数字孪生强调物理模型与其对应的虚拟模型或虚拟对应物之间的连接。这种连接通常通过使用传感器生成实时数据来建立[25]。\n\
  \n第四次工业革命和“始终互联”意味着我们在私人和制造过程中都呈现大规模自动化和数据交换的趋势，联邦学习在此发挥着主要作用。通过 4G/5G/6G[27]、蓝牙[28]\
  \ 和 WiFi[29] 进行电信通信，为我们的联邦学习高速公路创建了具有通信标准的基线。联邦学习利用该网络，可通过运营语境下的高效分析实时满足需求并支持决策。工业\
  \ 4.0 对应数字工厂的概念，即工业的数字化，工业机器人的语境越来越多地依赖 CPS 和数字孪生等技术。其他用语包括*智能工厂*和*黑灯工厂*，分别对应工业机器人在个体基础上以及整体层面的自主性。整体层面是指机器人之间为完成装配任务而进行的交互。\n\
  \n#### 4.1 自动化\n\n根据定义，自动化是指“在制造或其他过程或设施中使用或引入自动设备”[30]。软件开发中的自动化是指“……可将对人工输入的需求降至最低，并可用于几乎任何行业的各种方式的应用。在最基本的层面上，自动化软件旨在将可重复的例行任务转化为自动化操作”[31]。这意味着在将任务和程序转译并数字化映射以表示其预期操作（即任务和感知）时，需要正确地理解和表达它们。\n\
  \n\n\n\n\n# 自动化的 5 个层级\n\n在工业界，我们可以将自动化划分为“自动化的 5 个层级”，这些层级通常列举如下：\n\n- 传感器与信号（第\
  \ 0 级）\n- 操作与控制（第 1 级）\n- 监控控制（第 2 级）\n- 规划与运营（第 3 级）\n- 业务规划、物流与企业级运营 [32]\n\n\
  在运营中，第 0–3 级最有可能成为核心关注点。话虽如此，整个数据价值链必须能够互联互通，以便一端的变化能在另一端被捕捉到，从而如果我们寻求的是整体方法，即希望打破孤岛，波动和变化就能得到调整。\n\
  \n## 4.1.1 联邦自动化\n\n自动化联邦数据模型是一种“从不同来源收集数据并将其转换为通用模型的软件过程。它允许多个数据库作为一个整体运行，并为前端应用程序提供单一数据源。简单来说，数据联邦允许用户从一个地方访问数据”\
  \ [33, 34]。这意味着我们拥有自动化层级，并且根据我们所处的数据层级以及在数据价值链中的位置，我们可能只拥有完整整体视图的部分。在工业界，这有时被提及为“黑箱”方法而引起关注\
  \ [35]。与此相反，则是构建一个透明视图，其中的内部运作被称为“白箱”。为了配合联邦学习，`Split Learning (SL)` 是一种同样遵循模型到数据场景的方法，客户端在不共享原始数据的情况下训练和测试机器学习模型。SL\
  \ 的较慢性能已通过 [36] 提出的一种新方法得到改进，该方法名为分联学习（SFL）计算资源调度。下面的本地和全局方法旨在从实际意义上阐释这一方法的含义。\n\
  \n### 4.1.1.1 本地\n\n从传统意义上的本地视角来看，自动化意味着我们使用算法来帮助执行冗余的重复性任务。联邦学习中的中央数据模型可以放置在本地服务器上，即本地部署\
  \ [37]。例如，在采矿行业，仅一个轮胎就可以拥 400 个传感器（图 3）来测量压力和“磨损”以进行维护（图 4），这 400 个传感器都是单独的本地传感器，并被放置在一个中央数据模型中用于单个轮胎，一个“主”数据模型协调\
  \ 4 个轮胎，总共包含 1600 个传感器数据。这个例子意味着轮胎的数据模型默认不包括卡车司机，在这种情况下，车辆和驾驶它的人位于两个独立的数据模型中。这是一个数据软件孤岛的例子。\n\
  \n![Figure 3. An exemplification of 4 tires in a single data model. Illustration\
  \ by Sennersten.](img/fig2_3_B.jpg)\n\n图 3. 单一数据模型中 4 个轮胎的示例。由 Sennersten 绘制.\n\n\
  ![Figure 4. Example of the huge size of a tire alone. Illustration by Sennersten.](img/fig2_4_B.jpg)\n\
  \n图 4. 单个轮胎巨大尺寸的示例。由 Sennersten 绘制.\n\n### 4.1.1.2 全局\n\n延续之前的轮胎示例，如果我们现在拥有 30 辆卡车的车队，我们很可能有一个中央数据模型用于所有这些卡车，每辆卡车都拥有该数据模型的副本，可以在本地处理所有内容，并仅上传错误、异常统计数据、行驶时间、燃油消耗、地形条件导致的磨损等。中央“主”数据模型汇总发送给它的所有客户端数据，这发生在中央服务器上，即云服务。发送的数据仍然可能是孤岛化的，只是在更新一个孤岛化的数据模型。一个数据模型可能与其他数百个子数据模型共存，而这些子数据模型又依次聚合到更高层级的数据模型中。为了让所有这些数据模型链接并相互通信，我们希望实现一个可互操作的环境，在数据价值链跨运营中实现\
  \ `interoperability`（互操作性），并能够交叉关联数据并从中受益。互操作性是指“计算机系统或软件交换并利用信息的能力” [38]。\n\n###\
  \ 5. 机器视角\n\n机器，或者更确切地说是计算机，通常需要输入才能产生输出。在输入和输出之间，数据模型/算法需要基于数学公式、规则和/或逻辑执行计算，因此它确实代表了对环境上下文和领域知识的感知。这些模型因上下文和环境而异，这意味着算法或模型可以应用于任何数据，但如果未包含在通用模型中，可能会遗漏具体细节。我们可以说所有环境和情况都有共性，但也因上下文而异。IBM\
  \ 将联邦学习定义为：“联邦学习是一种在任何人都看不到或接触不到你的数据的情况下训练 AI 模型的方法，提供了一种释放信息以供新 AI 应用程序使用的方式” [8]。这意味着我们将人类移出了循环，如果需要且可行，必须模仿人类能力。人类的思维和专业知识必须被严格理解和映射，这不仅仅是简单的是/否映射。\n\
  \n#### 5.1 边缘设备\n\n边缘设备根据目的不同可以扮演各种角色，但它们本质上充当网络的入口——或出口——点。这些设备可以在网络之间传输、路由、处理、监控、过滤、翻译和存储数据。就数据而言，参考\
  \ IBM 的定义，理解到一个位于不同位置、具有特定上下文细节、不同时区、捕获和发送数据的传感器网络、计算网络资源，我们拥有一个具有实时软件执行需求的数据和运营需求网络。通常，这个设备网络被称为物联网（IoT）的一部分，这些设备不仅捕获和发送数据，还处理数据，从而为网络贡献和提供计算资源。ML\
  \ 可以对已知的重复信息（即数据）进行分类，并以此高效运行。\n\n##### 5.1.1 设备的联邦能力\n\n使用特定数据模型在设备上执行的分析面临着取决于其目的和上下文的挑战。如果将数据视为一维的，我们对问题有一个相当统一的理解，并且很容易理解和分析这类数据集。在联邦学习方面，将中央数据模型复制到本地设备上，如果中央数据模型不仅限于冗余重复性任务，它就需要理解本地特性。如果我们扩展数据模型的复杂性，它也应该能够理解其环境上下文。这可以包含\
  \ 360 度全方位的地形（包含垂直维度），增加 2 个维度、3 维方面以及时间到数据模型中。突然之间，在知道我们在哪里、什么东西在什么时间位于何处方面，我们面临着相当多的数据挑战。\n\
  \n###### 5.1.1.1 全局视角\n\n在数字孪生工业 4.0 环境中，伴随着各种类型的传感器，挑战在于如何构建一个全面的自上而下/自下而上的数据模型，它不仅代表孤立的数据本身，还代表一个无需人类在场的人工智能，意味着我们通过视觉、听觉能力（触觉、味觉和嗅觉）延伸了人类。讨论是在数字孪生环境下进行的，我们在该环境下将物理世界映射为一个具有传感器输入的三维映射现实。\n\
  \n###### 5.1.1.2 本地视角\n\n\n\n\nIoT devices have GPS coordinates. Localization via\
  \ GPS points tells us nothing about the orientation of an object in 360-degree space,\
  \ the rotation of where the object/device sits in context, how it behaves in this\
  \ digital twin-mapped world beyond basic actions (such as moving from point A to\
  \ point B), and the orientation of sensors, i.e., the direction they point in space\
  \ relative to their position.\n\n#### 5.2 Robot Perspective\n\nA robot is \"a machine\
  \ that resembles a living creature in being capable of moving independently (as\
  \ by walking or rolling on wheels) and performing complex actions (such as grasping\
  \ and moving objects)\" [[39]](#ch2.xhtml#ref2_39). To achieve autonomy, a robot\
  \ needs an internal \"mental model\" of itself and the environment in which it operates\
  \ to accomplish its primary task. Here, the robot's CPS may carry not only a digital\
  \ model of the robot's primary task corresponding to the environment but also a\
  \ model of its robotic counterpart. Figure 5 illustrates this perspective with an\
  \ example of two robots operating in an industrial park, where one robot internally\
  \ simulates the actions of the other to avoid collisions [[40]](#ch2.xhtml#ref2_40).\
  \ It must be noted that the example is simulation-based only, used as a proof of\
  \ concept, where the internal digital twin is used to predict future actions.\n\n\
  ![Figure 5. Robot R2 plans its actions by internally simulating R1 and itself [40].](images/fig2_5_B.jpg)\n\
  \nFigure 5. Robot R2 plans its actions by internally simulating R1 and itself [[40]](#ch2.xhtml#ref2_40).\n\
  \nIndustrial robots typically generate large amounts of diverse data that need to\
  \ be understood at the local level of individual robots and devices, as well as\
  \ at a global fusion level for composite and holistic interpretation.\n\nFrom an\
  \ \"understanding\" perspective, the five main areas of robotics are: operator interface,\
  \ mobility or locomotion, manipulators and effectors, programming, and sensing and\
  \ perception [[41]](#ch2.xhtml#ref2_41). Controlled industrial robotics is one area\
  \ of robotics, while \"field robotics\" is another. Controlled industrial robotics\
  \ deals with the most controllable so-called \"knowns,\" while field robotics deals\
  \ with a fair share of \"unknowns.\" Unknowns may include terrain challenges, environmental\
  \ issues, stress, obstacles, weather, etc. Depending on the purpose, objective,\
  \ and problem domain, there are many different challenges, but some of these may\
  \ lie in swarm robotics, improvements in navigation and exploration, and the development\
  \ of AI that can \"learn how to learn\" [[42]](#ch2.xhtml#ref2_42).\n\nThe Robot\
  \ Operating System (`ROS`) has evolved into an open-source library framework developed\
  \ and advanced by its users, i.e., industry and academia [[43]](#ch2.xhtml#ref2_43).\
  \ `ROS` is a set of libraries and tools that help you build robot applications [[44]](#ch2.xhtml#ref2_44).\
  \ A large amount of development is shared, but some is kept private due to intellectual\
  \ property (`IP`), patents, and commercialization reasons.\n\n##### 5.2.1 Federated\
  \ Capabilities for Navigation and Beyond\n\nAs mentioned earlier, a robot with an\
  \ internal \"mental model\" contains redundant navigation tasks such as moving forward,\
  \ turning left, turning right, and reversing using onboard instruments to achieve\
  \ locomotion. In this case, the robot/edge device is a vehicle that starts at a\
  \ geolocation origin and moves along a path, i.e., the space from A to B. The vehicle\
  \ is equipped with a navigation system that navigates with the aid of the Global\
  \ Positioning System (`GPS`), Inertial Navigation System (`INS`) [[45]](#ch2.xhtml#ref2_45)/Inertial\
  \ Measurement Unit (`IMU`)[[46]](#ch2.xhtml#ref2_46), Visual Odometry (`VO`) [[47]](#ch2.xhtml#ref2_47),\
  \ [[48]](#ch2.xhtml#ref2_48) (for GPS-denied and GPS-available environments), and\
  \ Simultaneous Localization and Mapping (`SLAM`, simultaneously building a map—i.e.,\
  \ the mental model—and localizing the vehicle/robot within this map). `SLAM` algorithms\
  \ allow the vehicle to map an unknown environment [[49]](#ch2.xhtml#ref2_49). Underground\
  \ and indoor environments do not always have `GPS` coverage. Before deploying a\
  \ robot or vehicle into a real environment, simulation can be performed to mimic\
  \ conditions as close to reality as possible. Federated learning here is the orchestration\
  \ of multiple processes to guide the robot along a safe route. Battery or energy\
  \ management is also part of this, as the robot needs enough energy to return to\
  \ its starting point.\n\n###### 5.2.1.1 Global\n\nRobots and autonomous vehicles\
  \ (such as self-driving cars) are aided by cartography [[50]](#ch2.xhtml#ref2_50),\
  \ Geographic Information Systems (`GIS`) [[51]](#ch2.xhtml#ref2_51), [[52]](#ch2.xhtml#ref2_52),\
  \ and `ArcGIS` [[53]](#ch2.xhtml#ref2_53). For field robots, topographic maps with\
  \ terrain elevation [[54]](#ch2.xhtml#ref2_54) need to be incorporated into navigation\
  \ to understand the vertical dimension, because the world is not flat. Robot fleets\
  \ may not all have the same purpose; they may require stepwise or synchronized coordination.\
  \ There have been several attempts and papers published testing various `FL` architectures\
  \ and focuses. Reference [[55]](#ch2.xhtml#ref2_55) proposes a novel Federated Learning\
  \ (`FL`)-based Deep Reinforcement Learning (`DRL`) training strategy (`FLDDPG`)\
  \ for swarm robotics applications in limited communication bandwidth scenarios.\
  \ In remote areas and extreme environments, baseline strategies often face low bandwidth\
  \ issues.\n\nTo prevent robots from colliding with each other or with obstacles,\
  \ they need to be equipped with collision avoidance capabilities [[56]](#ch2.xhtml#ref2_56),\
  \ [[57]](#ch2.xhtml#ref2_57) to navigate in these environments. In these contexts,\
  \ sensors and aggregated data have various data models, the semantics of which may\
  \ be siloed due to the many software and systems running in parallel, but federated\
  \ learning has benefits here too, enabling us to truly design for intelligence in\
  \ the system. Faced with all this diverse data, geospatial volumetric indexing becomes\
  \ crucial for both compute resources and semantics when creating data models for\
  \ data fusion.\n\n###### 5.2.1.2 Local\n\nIn the data domain, following the data\
  \ layout above, federated learning helps us avoid \"a powerful elephant threading\
  \ a needle\" (literal metaphor). We must understand how to quantify and discretize\
  \ data from both a computational perspective and semantic meaning.\n\nRobots and\
  \ vehicles in navigation mode carry a multitude of sensors that should map, render,\
  \ and present digital reality, metaphorically showing how humans traverse environments,\
  \ observe surroundings, and shape their mental models of existence in real-time.\
  \ This means we glue/build our mental data maps together through 3D 360-degree space\
  \ and its navigation, aided by maps, `GIS`, `GPS`, `INU`/`IMU`, `VO`, `SLAM`, data\
  \ placed and executed in this 3D space, invisible data we may not see but can measure\
  \ and visualize, sound, aromas, smells, taste, psychology, biology, and more. This\
  \ is a vast design space we are trying to understand and architect intelligently.\
  \ The purpose is to share the data work so that end-users can remotely understand\
  \ and utilize the captured data.\n\nOn one side is Federated Learning with `ML`,\
  \ on the other is the handling and cloning of data models; the data community is\
  \ still exploring how to map informal human and animal knowledge into complete data\
  \ models containing human reasoning for algorithmic understanding. The next subsection\
  \ continues the theme of federated learning, discussing how to handle human and\
  \ animal cognition towards agents and soft robotics.\n\n### 6. Data Interoperability\n\
  \n\n\n# 互操作性\n\n当许多人在一个高度专业化的环境中工作，且数据贡献需要穿透其中以造福系统（在最佳情况下实现实时）时，互操作性至关重要。互操作性是指从多个来源访问和处理数据而不丢失含义，并将这些数据集成用于制图、可视化以及其他形式的表达和分析的能力。互操作性使人们能够查找、探索并理解数据集的结构和内容\
  \ [58]。在澳大利亚及矿业领域，沃尔沃 [59]、萨博 [60]、ABB [61]、阿特拉斯·科普柯 [62]、山特维克 [63]、小松 [64]、卡特彼勒\
  \ [65] 等公司都需要让所有这些数据模型为地理定位及其运营和经济效益做出贡献。联邦学习在偏远地区作业、甚至有时无法在线连接时显得更为关键。这创造了一种操作模式：数据模型被迫在边缘设备上训练，且不会因无法时刻连接云端而失去收益。\n\
  \n## 6.1 计算与语义\n\n计算语义学研究如何自动化构建自然语言表达的意义表示并进行推理的过程。因此，它在自然语言处理和计算语言学 [66] 中发挥着重要作用，同时也解释了没有语义的计算意味着什么\
  \ [67] 以及联邦学习的互操作性视角 [68]。\n\n### 6.1.1 联邦计算\n\n联邦是一组计算或网络提供商，它们共同商定运营标准。该术语可用于描述两个截然不同、形式上断开的电信网络的互操作，这两个网络可能具有不同的内部结构\
  \ [69]。问题在于我们*如何*计算，而不是*为什么*计算 [70]。\n\n### 6.1.2 联邦语义\n\n如果我们共享数据，目的是为了相互理解：语义互操作性。这是联邦项目中的一个主要问题。自\
  \ 2019 年以来，联邦在语义方面做了大量工作，即联邦语义模型。其重要性在于使任何物流利益相关者能够通过联邦桥接器访问各种（基于标准的）数据孤岛 [71, 72]。\n\
  \n#### 6.1.2.1 数据融合\n\n数据融合是从多个来源获取数据以构建更复杂的模型并更深入地了解项目的过程。这通常意味着获取单一主题的组合数据并将其结合起来进行集中分析\
  \ [73]。数据融合也指对多个相互关联的数据集进行联合分析，这些数据集提供了同一现象的互补视角。关联和融合来自多个来源的信息的过程，通常比单一数据集的分析能得出更准确的推断。数据融合是一个多层面的概念，具有明显的优势，但同时也面临着许多需要仔细解决的挑战\
  \ [74]。联合分析可以包括从地图、制图、地形数据、文本文件、CAD 文件、影像、卫星影像、3D 激光雷达扫描、描述、时序数据、导航数据等所有内容。这对员工和人员提出了巨大要求，需要他们理解如何融合数据以不丢失精度，首要的是不丢失知识。知识局限以及不知道如何融合而不再创建另一个孤岛是一个挑战。\n\
  \n#### 6.1.2.2 联邦融合\n\n我们可以问为什么联邦融合有趣，这是有原因的。集中训练学习模型需要一个拥有极其强大计算能力和存储容量的中央云。标准机器学习模型不易直接应用于大规模物联网网络，也无法利用分布式计算的可用性。这呼唤一种新的学习模型，将训练数据分布在各个物联网设备上，而不是集中化。谷歌发明了联邦学习（FL）的概念，用于设备端学习和数据隐私保护；采用\
  \ FL 方法，每个物联网设备都可以基于本地收集的数据训练其模型 [75]。\n\n#### 6.1.2.3 数据索引\n\n为了能够融合数据并进行交叉关联，数据标准对于对齐数据全景至关重要，这样我们所有人都能从所有人的努力中受益。当我们审视索引时，最可能设想的是数据库及其索引。索引是将无序表排序为一种顺序的方式，以在搜索时最大化查询效率。当表未建立索引时，行的顺序很可能无法被查询以任何优化方式辨别，因此查询将不得不线性地搜索各行。换句话说，查询将不得不搜索每一行以找到匹配条件的行，这一过程无疑非常耗时\
  \ [76]。\n\n#### 6.1.2.4 联邦索引\n\n通过单次查询同时进行查询并访问多个数据源，是我们的目标。联邦器从一个或多个搜索引擎收集结果，然后在单一用户界面中呈现所有结果\
  \ [77]。\n\n### 7. 数据模式识别\n\n掌握并分析所有数据后，目的是发现数据中的模式和趋势，以便我们理解超出肉眼所见的内容。模式识别是利用计算机算法识别数据规律和模式的过程。这种识别可在各种输入类型上进行，如生物识别、颜色识别、图像识别和人脸识别。它已应用于图像分析、计算机视觉、医疗保健和地震分析等多个领域\
  \ [78]。\n\n#### 7.1 数据记录\n\n没有数据，我们就无法读取或揭示任何模式，因此我们必须获得有价值的数据才能从中得出结论。数据是重要的来源，但有时由于机密性、完整性等原因，获取数据可能非常困难。数据记录是指在一段时间内收集和存储数据，以分析特定趋势或记录系统、网络或\
  \ IT 环境基于数据的事件/操作的过程。它支持跟踪数据、文件或应用程序在存储设备或应用程序上被存储、访问或修改的所有交互 [79]。\n\n##### 7.1.1\
  \ 算法理解\n\n算法理解有两方面。当我们分析数据时，我们可以看到如何在算法层面构建算法，计算机也可以。当人类首次要转化数据发现时，需要通过编程将其转换为代码，以便计算机理解如何对传入数据执行算法或进行预测。算法是一组命令，计算机必须遵循这些命令以执行计算或其他问题解决操作。根据其正式定义，算法是一组有限的指令，按特定顺序执行以完成特定任务\
  \ [80]。\n\n#### 7.2 转向/控制\n\n转向机器人或车辆以获取算法可能执行操作所需的特定数据，以便机器人上的夹具能夹取并拾取我们要求的典型物体或矿物。转向数据当然可用于纯导航\
  \ [81]、数据阈值，以及特定事件或操作的频率。\n\n##### 7.2.1 算法执行\n\n\n\n# 算法交易\n\n算法交易是一种利用自动化和预编程的交易指令来执行订单的过程，旨在考量价格、时机和交易量等变量。算法是一组用于解决问题的指令。计算机算法会将完整订单分成小部分，在一段时间内发送至市场\
  \ [82]。\n\n### 8. 系统与智能体系统中的认知：具有认知能力的智能体的机遇\n\n#### 8.1 人类认知\n\n鉴于联邦学习及用于机器学习的数据模型，我们将在此介绍\
  \ 图 2 中 AI 模型的认知层面。认知功能指代多种心智能力，包括学习、对不可控局势、问题或其他事务的感受 [101]。在机器人学中，我们更多地谈论响应行为而非反应，特别是在刺激-响应的框架下\
  \ [102]。此处的重点在于意识到：联邦学习结合机器学习及其数据模型，可能会排除反思能力；而我们可以使用 **ACT-R**、**BDI** 等认知软件模型来涵盖这些行为。**自适应控制思维-理性\
  \ (ACT-R)** 是一种认知架构：一种用于模拟和理解人类认知的理论 [103, 104]。**信念-欲望-意图软件模型 (BDI)** 是一种为编程智能智能体而开发的软件模型\
  \ [105]。\n\n#### 8.2.1.1 基于符号主义与连接主义视角的测试用例\n\n作为测试用例，并为了考察一种组合场景，作者采用了应用于鸟类收集数据的\
  \ **人工神经网络 (ANN)**。鸟类的个体软件表征应携带独立训练的 **ANN** 作为模拟运动的基础，以代表其个体生物神经网络。一个清晰可见的问题是，**飞行**\
  \ 的数据点远少于 **游泳** 的数据点，这意味着 **ANN** 失衡，无法表征飞行行为（例如湖泊间的迁徙）。数据集中的不平衡是一个问题，表明需要谨慎使用\
  \ **ANN** [106, 107]。因此，解决该问题的方案考虑让个体软件表征不仅包含用于通用 *反应性行为* 的 **ANN** 部分，还包含一个关于状态推理的部分（例如，**作为对邻鸟选择飞行做出反应而起飞的时机**），这被视为\
  \ *反思性行为*。虽然反应性行为源自机器学习，但为了弥补 **ANN** 信息的缺失而逼近反思性行为，则受认知科学启发。图 6 展示了一个包含反应性与反思性部分的\
  \ **多智能体系统**。在此，两个智能智能体（由绿色框表示）处于一个环境中，系统状态通过持续的相互通信进行更新。\n\n\n\n\n![图 6. 一个通信多智能体系统，展示了反应性和反思性行为。](img/fig2_6_B.jpg)\n\
  \n图 6. 一个通信多智能体系统，展示了反应性和反思性行为。\n\n智能体的表示包含一个 `ANN`（左上部分），它提供可能的下一步移动信息（反应性行为）。此外，右上角的符号代表反思性行为的逻辑，即对替代移动进行推理。包含的圆圈代表智能体的生命代码，在该代码下观察当前内部状态，并产生下一个内部状态。\n\
  \n表示反思性行为的方法主要受 `ACT-R` 启发。`ACT-R` 是一种用于认知研究的概念架构，特别是针对人类行为的研究（[108, 109, 110 和\
  \ 111])，但在此被泛化用于鸟类研究，甚至更广泛地用于智能体概念的研究。\n\n### 8.2.1.2 局部\n\n一方面，在局部层面，在 `FL` 的背景下，场景应该相当清晰。也就是说，每只鸟都在执行单独的\
  \ `ANN` 训练阶段，例如，根据图 1。尽管如此，鸟类的行为不仅仅由该步骤定义，还由我们提出并指出的 `反思性行为` 定义。此类动作可能更难泛化，因为它们更多地基于个体基础进行硬编码，而不是通过集成到\
  \ `FL` 动作中的 `ANN`。\n\n### 8.2.1.3 全局\n\n正如本章所述，`FL` 已达到一个成熟点，`FL` 的动作可以通过预开发的 `API`\
  \ 实现自动化。因此，根据图 1，训练所有单个鸟类的 `ANN` 这一步骤应被视为完全可行。尽管如此，训练过程的聚合只能基于鸟类行为模式的 `ML` 部分，即\
  \ `反应性` 部分，而非反思性部分。我们作者将此问题视为未来研究的挑战和进一步研究的机会。同样，此示例的目的是在抽象层面上指出 `FL` 和智能体的概念。正在进行的生态研究将扩展到考察游泳和飞行之外的鸟类更多方面，目前的观点是，互补建模技术将更加重要，并为\
  \ `FL` 和智能体背景提供更多有趣的启发。\n\n### 9. 总结\n\n本章从两个视角探讨了 `联邦学习` 的概念，一方面是从基于经验的视角，另一方面是从阐述性的视角。基于经验的方法在此基于\
  \ `工业 4.0` 背景下的先前工作，更确切地说是采矿业及其机器人背景，其中数据融合和我们可以称之为“融合”分析的需求。`联邦学习` 配合数据标准和数据模型，显然能为该行业的发展做出贡献。带宽和数据处理受限的远程环境，面临各种数据分析挑战，可从\
  \ `联邦学习` 范式中受益。一方面由 `机器学习 (ML)` 支持的 `人工智能 (AI)`，另一方面由 `认知科学` 方法支持的面向基于传感器设备的 `AI`，二者可以在双重性中延伸人类能力并协助人类进行机器人操作。\n\
  \n本贡献的第二个视角着重于进一步指导和展示作为 `AI` 一部分的认知层面（除了 `ML` 之外）如何构建整体数据视图，并促进智能体固有的自主、自我感知行为。在此，已讨论了当前的\
  \ `联邦学习` 过程主要基于 `ML` 和 `人工神经网络`，且必须开展更多研究，以将数字设备的认知层面与此类 `联邦学习` 过程相集成。作者讨论了如何在中心聚合层面理解\
  \ `联邦学习` 和边缘设备上的本地数据模型，以免丢失关于何时融合不同数据以构建整体数据模型的局部或全局感知。\n\n### 参考文献\n\n1.  VoxelNET\
