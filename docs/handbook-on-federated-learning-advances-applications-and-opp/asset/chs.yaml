  \n### 1. 引言\n\n物联网的发展促使 V2X 连接的采用率上升，从而实现了更有效的通信和处理。车辆中的智能体可以与其他连接设备协调，并汇聚其闲置处理能力，以造福时间关键型程序\
  \ [1]。由于资源共享环境不断变化，导致车辆网络表现出高度动态和非线性行为，因此汽车系统中的决策以极其困难著称 [2]。车辆应用具有时间敏感性、移动性，且队列状态变化迅速，所有这些因素都使任务卸载变得困难。基于机器学习的解决方案有潜力缓解上述问题\
  \ [3]。一种常见的方法基于博弈论和强化学习，通过持续收集周围世界的数据来优化决策 [4]。换句话说，它们无法涵盖对应于每个节点众多可能队列状态的庞大状态空间。深度强化学习被用于更复杂的决策优化解决方案中，尽管其计算成本高昂且收敛速度缓慢\
  \ [5]。\n\n为解决由环境不可预测性、有限信息共享和中心化设计导致的收敛延迟问题，基于策略优化的方法旨在在广阔的状态空间中给出任务卸载策略的近似解 [6]。此处讨论的解决方案本质上是中心化的，因为它们从中心化雾服务器获取信息，且车辆智能体间的知识迁移有限\
  \ [7]。联邦学习是一种革命性的分布式学习范式，有潜力改进决策并加速收敛 [8]。\n\n通过允许每个设备进行本地学习，联邦学习不仅实现了快速收敛，还在共享资源生态系统中实现了通信开销的降低\
  \ [9]。当在本地训练合理时，一种称为联邦学习 (FL) 的分布式学习方法非常有用 [10]。这种学习方法利用了当今智能汽车日益增长的计算和存储能力。由于存储和处理限制，在中心化数据服务器上训练具有大量输入参数的模型是不切实际的\
  \ [11]。使用这种中心化方法通过网络传输原始输入数据会导致通信成本高得令人望而却步。特别是，由于隐私顾虑无法通过网络传输的数据必须保留在本地 [12]。\n\
  \n\n\n\n# 联邦学习与深度强化学习用于车辆任务卸载\n\n在联邦学习中，训练好的模型及其参数存储在不同位置，但各方协同工作以构建单一通用预测模型 [13]。车辆频繁收集数据，并利用这些数据在数据并行联邦学习技术的学习过程中开发自主的本地模型\
  \ [14]。下一步是使用全局模型重新训练本地模型，该全局模型由先前训练的所有本地模型的参数组合构建而成。学习算法的重复过程确保最终收敛 [15]。联邦学习依赖中心化聚合器这一事实使其分布式程度不如预期；然而，完全去中心化会降低学习模型的效率\
  \ [16]。\n\n恶意车辆篡改本地训练数据或自私车辆不提供其本地模型也可能导致策略失败 [17]。然而，在自动驾驶车辆的背景下，该方法切实可行，并可投入使用以提供更安全、更快捷的车辆服务。利用来自环境的持续反馈，强化学习（RL）是一种智能学习最佳策略以最大化奖励的\
  \ AI 技术 [18]。这类似于个体通过经验而非直接观察来了解周围环境的方式 [19]。传统 RL 虽然可行，但在收敛到理想策略之前，完全探索复杂环境将花费过长时间。在通常拥有巨大且连续状态-动作空间的此类系统中扩展\
  \ RL 是一个重大挑战。据建议，深度强化学习（DRL）可以增强泛化能力和对新情况的适应性，使其非常适合此类广阔环境 [20, 21]。强化学习智能体与复杂环境及深度网络进行交互，以近似学习用于未来动作的价值函数或策略\
  \ [22]。DRL 在控制、资源管理、游戏、机器人技术和自动驾驶等不同领域的应用已得到验证 [4]。\n\n具体而言，强化学习擅长在模糊环境下进行序列决策。这是因为与具有显式规则的传统优化问题不同，在高度动态的移动场景中，卸载约束往往更加隐式和多样化\
  \ [23]。例如，车联网（V2X）支持多种服务，每种服务都有其自身的需求和挑战 [24]。另一个促成基于 RL 的卸载决策模型日益流行的因素是汽车技术创新的快速扩展应用。为达成目标，这些模型通常利用强化学习获取更优方法\
  \ [25]。有趣的是，该训练可通过分布式算法完成；因此，该方法可通过分布式协作开发，利用本地知识提升系统级性能 [26]。为实现高效的任务卸载决策，我们提出了一种基于\
  \ DRL 的联邦卸载架构，该架构利用多层集体学习来卸载作业 [27]。通过允许汽车和雾服务器共享信息，该框架增强了它们的学习能力。本研究最重要的成果如下：\n\
  \n*   为做出更明智的工作卸载决策，重要的是研究多智能体 V2X 场景，其中智能体相互通信并与周围车辆环境交互。\n*   利用多个分布式学习环境创建多层联邦卸载系统，可在边缘学习卸载决策。由于层级间共享的数据减少，这提高了通信通道的隐私性和效率。\n\
  *   利用一种称为异步优势行动者-评论家（A3C）的混合强化学习范式，研究人员可构建两层卸载系统。车辆智能体用于学习本地模型，而雾服务器用于训练全局模型。通过同时运行多个独立的学习环境，A3C\
  \ 可捕获更大比例的状态空间。这种状态空间探索和多层学习策略带来了更快的收敛和更优的卸载决策知识。\n\n##### 表 1：符号与含义\n\n| 符号 | 含义\
  \ |\n| :--- | :--- |\n| `P[t]` | 发射功率 |\n| `P` | 停放车辆 |\n| `V` | 车辆集合 |\n| `d` |\
  \ 距离 |\n| `F` | 雾服务器 |\n| `C` | 信道容量 |\n| `l` | 路径损耗 |\n| `N[0]` | 信道噪声 |\n| `B`\
  \ | 带宽 |\n| `s[j]` | 任务大小 |\n| `λ` | 到达率 |\n| `c[j]` | 计算需求 |\n| `μ` | 服务率 |\n|\
  \ `Z[i]` | 停留时间 |\n| `L[i]` | 停留时间 |\n| `s[i]` | 输入大小 |\n| `f[i]` | 时钟频率 |\n| `Q`\
  \ | 队列长度 |\n| `D1[i]` | 传输时延 |\n| `D2[i]` | 计算时延 |\n| `D3[i]` | 排队时延 |\n| `ψ[i]`\
  \ | 频率复用成本 |\n| `Ψ[2]` | 租用计算成本 |\n| `T` | 动作奖励 |\n| `R[i]` | 智能体奖励 |\n\n# 文献综述\n\
  \n此处讨论了近期关于在车辆网络中有效利用分布式计算节点的努力。\n\n## 传统任务卸载\n\n\n\n\n卸载作业的选择依据是车辆的速度及其行驶方向。换句话说，朝同一方向行驶的车辆可以竞争卸载作业。例如，独立和协作的雾服务器均提供了移动性感知和基于位置的工作卸载技术[28]。通过高效利用可用的计算和通信资源，实现了任务的及时完成。该方法在选择资源时优先考虑设备移动性，而非队列状态。为了最大化\
  \ V2V 资源共享网络中的资源利用率，基于车辆的方向、位置、速度和队列状况，提出了上下文感知的机会主义卸载。作者[29]基于多臂老虎机理论和雾节点的卸载延迟，提供了一种自适应卸载方法。为了减轻边缘雾服务器的压力，解释了如何在\
  \ FiWi 使能的雾计算网络中利用博弈论方法实现负载均衡。集中式网络管理作为 SDN 的主要原则，是该补救措施的关键[30]。一种工作卸载方法以信息缺失博弈的形式提供，其中现有资源被汇集并共享。它使用贪婪剪枝算法进行资源选择，兼顾高效与环保[31]。进化方法也被用于优化资源池分配。值得注意的是，这些元启发式方法依赖于集中式网络管理，在分配资源时更强调设备特定因素。随着请求总数和排队请求数的增加，这些技术表现不佳。此外，基于\
  \ AI 的作业卸载可以分析大规模状态空间，并适应车辆周围的动态条件。例如，[29]中使用预测模型减少了程序执行的等待时间。通过采用集成学习，一组无人机可以高效计算高需求的计算作业。它们使用基于拍卖的机制将雾服务器分配给移动节点的查询[32]。该方法使用\
  \ DNN 模型来减少移动节点消耗的时间和功耗。另一篇类似的论文使用 DNN 来调度任务并将计算卸载到边缘[33]。综述表明，时间和能量得到了更好的分配。值得注意的是，在使用基于\
  \ DNN 方法的车辆环境中，有限的信息交换和巨大的状态空间对其决策能力产生了负面影响。\n\n## 2.2 基于强化学习的卸载\n\n近期工作提出了一种基于深度\
  \ Q 学习的智能作业卸载技术，对信息和网络数据吞吐量实行集中式控制。同样，一种基于深度 Q 网络的计算资源分配方法使 Q 学习摆脱了以往的局限[34]。通过考虑相关车辆的速度和计算能力，计算出一个高效的卸载决策模型。对于因大量策略探索和相关计算而导致状态空间庞大且收敛速度缓慢的情况，Q\
  \ 学习变得低效。得益于[35]中描述的服务卸载架构执行的在线学习，雾设备学习到了最优卸载策略。在“何时何地调度”范式的背景下，DRL 被用于构建随机资源优化问题[36]。该模型接收代表任务队列状态的特征集，并使用\
  \ DNN 估算分配策略。类似研究的作者[37]提出了一种优先级感知的 DRL 方法，鼓励车辆汇聚其闲置处理能力。该方案指定了一种动态定价方法，由任务的相对重要性、节点移动性和资源可访问性决定。同样优化了一种基于\
  \ DRL 的卸载技术[38]，其中任务队列状态、移动性和任务依赖性都是联合目标函数的一部分。该方法通过在卸载任务时减少功耗和延迟来提高性能。深度强化学习专家研究了任务卸载范式[39]。在该研究中，作者使用基于\
  \ SAC（软演员-评论家）的、无模型的深度强化学习版本，以最大化熵和期望效用。然而，由于任务分配决策学习的集中化，给定的工作高度集中。我们建议的方法涉及在车辆和基站分别学习两个不同的模型，这与先前工作仅专注于在基站学习这些任务卸载决策形成对比。由于环境的动态性和通信的缺乏，DRL\
  \ 方法通常无法在连续状态空间背景下提供令人满意的结果。这项工作非常适合分布式和联邦 DRL，后者确保了丰富多样的训练环境，并加快了达到全局最优的过程。\n\n\
  ## 3. 系统模型\n\n利用一个车辆网络，其中一些在移动（用`V`表示），一些停放（用`P`表示），一些在雾中（用`F`表示），我们考察一个资源共享车辆环境（用`F`表示）。具有波动计算需求的作业的唯一来源是移动汽车本身；这些作业可以在本地处理或卸载到其他节点。\n\
  \n### 3.1 传输模型\n\n无线信道的路径损耗`l`定义为：其中`d`是发射和接收设备之间的距离。\n\n(1)\n\n```\nl = a + βlog10\
  \ + b\n```\n\n其中`β`是路径衰减指数，`a`代表初始偏移量，`b`代表阴影衰落效应。因此，通信路径上的上界可以表示为\n\n(2)\n\n```\n\
  C = B log_2(1 + (P_t * l) / N_0)\n```\n\n其中`C`是可以在具有带宽的无线电信道上传输的最大数据率。`N[0]`是信道噪声，`Pt`是车辆节点的发射功率。重要的是要注意，我们假设无线信道是准静态且时不变的。这表明所有节点经历的信道状态是一致的，具有相等的发射功率和干扰。请记住，传输延迟是我们旨在最小化的总延迟的关键组成部分，它考虑了信道容量。我们的模型考虑距离、路径损耗，并适应传输延迟的新值，以自行学习哪些作业最适合卸载。\n\
  \n### 3.2 任务模型\n\n各种车辆应用生成的任务具有相同的优先级，且彼此完全独立。每个传入作业`j ∈ j`有两个元组，其中`sj`代表任务大小（单位：MB），`cj`代表计算需求（单位：Mbits）。\n\
  \n### 3.3 排队模型\n\n研究人员使用泊松过程来描述系统工作负载，到达率为`λ`，研究一个具有无限总体的多服务器先进先出排队模型。整个系统容量由公式`∀(V,F)\
  \ = Σ_{i=0}^{T} K * (c * s_i)`表示，其中`K`是整个调用集群的大小，`c`是并行计算节点的数量，`si`是输入的数据量。对于给定的代理`i`，其驻留时间`Z[i]`可写为\n\
  \n(3)\n\n```\nZ_i = Σ_{x ∈ Q} (c_x / f_i)\n```\n\n其中，`fi`是时钟频率，`Σ[x ∈ Q]c[x]`是队列`Q`的队列长度。\n\
  \n### 3.4 任务执行模型\n\n\n\n发送节点在卸载任务时会消耗一定的带宽。车辆 $i \\in V$ 的所有传输延迟之和 $D[i]¹$ 的公式如下：\n\
  \n(4)\n\n$D[i]¹ = \\psi[i]B \\cdot (D[i]^\\uparrow + D[i]^\\downarrow)$\n\n此处，上行链路\
  \ $D^\\downarrow[i]$ 和下行链路 $D^\\uparrow[i]$ 分别代表下行和上行传输延迟，$\\psi[i]$ 代表频率复用成本。任务\
  \ $j$ 的上行通信延迟写作 $D_{i}^{\\uparrow} = \\sum\\limits_{j \\in J}1_{J} \\cdot (\\frac{S_{j}}{C_{i}})$\
  \ 指示随机变量 `1[J] (·)` 表示作业是否被卸载，遵循相同模式。由于输出延迟大小可忽略不计，故不予考虑。此外，给定车辆 $i$ 的计算时间延迟 $D[i]²$\
  \ 表示为\n\n(5)\n\n$D[i]² = (\\psi[2]f[i]) \\cdot D[i]^{(*)}$\n\n其中，$f[i]$ 为计算节点的时钟频率，$\\\
  psi[2]$ 为计算资源的单位租赁成本。计算所需时间用符号 $D_{i}^{x} = \\text{Σ}_{j \\in I}\\frac{c_{j}}{f_{i}}$\
  \ 表示。与执行延迟类似，排队延迟是任务在被处理前在队列中等待的时间。因此，队列时间 $D[i]³$ 表示为\n\n(6)\n\n```\nD_{i}^{3}\
  \ = (\\psi_{2}f_{i}) \\cdot \\sum\\limits_{j = 1}^{J}Z_{j}\n```\n\n其中，$Z[j]$ 表示驻留时间，即任务\
  \ $j$ 在被处理前在系统队列中等待的时间。在队列管理中，计算资源的单位租赁成本为 $\\psi_2$。同样，所有延迟相加得到我们所谓的总服务时间 $D[i]$。\n\
  \n(7)\n\n$D[i] = D[i]¹ + D[i]² + D[i]³$\n\n### 3.5 卸载模型\n\n如前所述，车辆产生的任务可以在本地执行，也可以分布在资源共享车辆网络中。主要考虑因素有两个：任务所需的计算能力，以及雾服务器和停放车辆等周边资源的邻近程度。如公式\
  \ (8) 所示，对于给定任务 $j$，源车辆 $i$ 采用复杂的决策模型来评估是否将负载分配给附近的节点。\n\n(8)\n\n$\\delta[i] = \\\
  {(0,1):\\delta = f(x[1],x[2],x[3],\\cdots,x[n])\\}, \\forall j \\in J$\n\n其中特征集合\
  \ $(x[1], x[2], x[3],...,x[n])$ 代表当前车辆状况。任务卸载算法学习一个函数 $f(\\cdot)$，将智能体状态 $\\delta[i]$\
  \ 映射到卸载策略。\n\n## 4. 问题建模\n\n为了做出更好的卸载决策，车辆与其他车辆及周围环境进行通信。考虑智能体 $I$，给定其当前状态 $s_i$，决定采取一个动作\
  \ $a[i]$ 以换取奖励 $r_i$ 从而转移到状态 $s[i]'$。智能体与其周围环境的交互可用以下形式描述：\n\n### 4.1 状态空间\n\n当前车辆状态是可用处理能力的隐喻。由于汽车系统中计算需求的动态性质，车辆必须能够根据计算需求和计算资源的可用性来满足计算要求，而这些因素可能会有很大差异。我们的方法考虑了可能影响作业和车辆的多种变量。在规划系统当前状态时，我们考虑了每个任务的计算需求和每个节点可用的资源。我们还考虑了控制工作负载分配的传输延迟和车辆数据速率。车辆的状态空间是车辆与关键参数集合之间的映射，这些参数能适当刻画车辆运行环境的动态特性。对于执行任务\
  \ $j$ 的智能体 $i$，构建相应的状态概况 $S_i$ 为 $S[i] = \\{z[i], \\Delta[i], V[i], W[i], f[i],\
  \ (s[j], c[j])\\}$。\n\n*   **Z[i]**：包含本地、雾服务器、移动和静止车辆及其各自的驻留时间。\n*   **Δ[i]**：是执行任务的车辆到任何可用资源（如雾服务器或其他车辆）的距离。\n\
  *   **V\\*i\\*\\***：包含移动和静止车辆以及雾服务器，作为彼此相对速度的集合。\n*   **W\\*i\\*\\***：由多种资源卸载方式组成，如本地服务器、雾服务器、移动设备和静止车辆。\n\
  *   **f[i]**：等于生成任务的智能体的处理能力。\n*   **(s[j], c[j])**：表示任务特征，如输入数据量和所需周期率。\n\n重要的是，性能指标应实时测量，以便考虑环境变化。由于网络拓扑快速变化且可能状态种类繁多，捕捉这些网络的完整动态特性很困难。为了确定最适合当前情况的卸载动作，我们使用状态构建模块实时生成环境状态。\n\
  \n### 4.2 动作空间\n\n基于车辆的资源共享网络中可能的动作集合由卸载动作空间定义。该空间代表本地、雾服务器和移动/静止车辆计算资源。执行任务 $j$\
  \ 的车辆智能体 $i$ 的动作空间 $\\mathcal{A}_i$ 表示如下：\n\n(9)\n\n$\\mathcal{A}[i] = \\{a[1],a[2],a[3],a[4]\\\
  }$\n\n其中 (a-1) 任务排队在本地执行，(a-2) 卸载给相邻的移动汽车，(a-3) 卸载给相邻的雾服务器，(a-4) 卸载给附近停放的车辆。\n\n\
  ### 4.3 奖励函数\n\n激励函数可以提高学习算法的效率。这里我们指的是驻留时间优化的一个子集，它通过从给定动作空间中选择最佳动作，在多次重复中最大化奖励。假设车辆智能体\
  \ $I$ 在目标节点 $k\\in\\{i \\times, [i] \\}$ 执行动作 $a_i$ 获得奖励 $r_i$，其中 $r_{i} = - (\\\
  frac{1}{\\lambda})Z_{k'}$，$\\lambda$ 为任务到达率，$Z_k$ 为 $k$ 在最终目的地所需停留的时间。\n\n因此，我们可以定义智能体\
  \ $i$ 获得的所有奖励之和 $R_i$ 为\n\n(10)\n\n```\nR_{i} = \\text{Σ}_{t = 0}^{T}\\frac{r_{i}(t)\
  \ - R_{i}}{M_{i}}\n```\n\n其中，若仿真中有 $T$ 个时间步，则 $M_i$ 为分配给智能体 $i$ 的任务总数，$r_i$ 为时间步\
  \ $t$ 采取动作 $a_i$ 的奖励。\n\n总之，智能体的学习过程始于状态向量的输入。由于共享局部和全局模型，智能体对环境状况的理解能力增强，从而做出更好的决策。起初，智能体随机做决策，然后根据因采取特定动作而获得的奖励学习做出更好的决策。因为奖励与在节点处花费的时间成正比，选择驻留时间较短的节点会获得更大的回报。因此，考虑到邻域内车辆的可达性，车辆智能体将选择奖励最高的动作，即使这意味着在那里花费的时间更少。\n\
  \n### 4.4 多智能体异步优势演员-评论家 (A3C) 算法\n\n\n\nActor-Critic 网络是策略梯度实现的一个示例，该方法通过随时间逐步优化参数来优化策略。经典\
  \ Q-learning 和深度 Q 网络（DQN）都根据当前状态选择最优的下一步，但它们的实现方式截然不同。最优策略，即从状态到动作的映射，可以通过策略梯度直接学习。Actor\
  \ 是真正对策略采取行动的一方，而 Critic 提供反馈以帮助 Actor 做出更好的选择。当累积回报 `R-t` 从基线函数中移除时，方差或优势减小为 `R[t]`\
  \ – `bt`。典型的基准是学习价值估计（`Vπ(st)`）。\n\n在多智能体深度强化学习场景中，`N` 个智能体在车辆生态系统中协作。这创建了一个简单的马尔可夫决策过程（MDP），其中\
  \ `s,a,r.s′` 等元组代表智能体。变量 `s` 表示智能体的当前状态，变量 `a` 表示智能体选择的动作，变量 `r` 表示动作的奖励，变量 `s`\
  \ 表示智能体的预期状态。假设在时间 `t`，`N` 个智能体从环境中获取线索并自主行动，以转移概率 `p` 获得奖励并转移到新状态。智能体的目标是发现一个从状态到动作的映射\
  \ `π(s) → a`，以最大化预期折扣未来奖励 `V^π(s[t]) = E(R[t]|(s[t], a[i]))`。其中，`Rt` 是折扣累积未来回报，计算公式为\
  \ $R\\_{t} = \\sum\\limits\\_{k = 0}^{\\infty}\\gamma^{k}r\\_{t + 1}$，折扣因子 `γ` ∈\
  \ (0, 1)。\n\n在模型训练期间，A3C 方法利用众多并发线程，每个线程都受益于独特且改进的学习体验。在此，许多智能体正在并行探索移动车辆状态空间的不同区域。来自许多异步交互的无关更新允许对状态空间进行更快、更彻底的探测。通过从估计价值函数\
  \ `Vπ (s[t])` 中减去成功的奖励函数，该方法在时间瞬间 `t` 得到一个优势函数，其中 `s` 是时间瞬间。\n\n(11)\n\n`A(s[t],\
  \ a[i]; θ, w) = r[t] + γ*V(s[t + 1]; w) − V(s[t]; w)`\n\n优势函数表示一个动作相对于其他可能动作的盈利能力。使用该公式，Actor\
  \ 网络进行自我更新，\n\n(12)\n\n```\ndθ← dθ + ∇_{θ'}logπ_{θ'}(a_{i} | s_{t};θ')A(s_{t},a_{i};θ',w')\n\
  + β∇_{θ'}H(π(s_{t};θ'))\n```\n\n其中，策略选项不确定性的度量是熵参数。熵的增加表明智能体的行为变得更加混乱和不可预测。如果没有熵项，智能体将收敛于次优行为，更多地权衡导致最高奖励的动作。而正则化项通过调整熵强度来平衡利用与探索，后者由开发参数\
  \ `β` 控制。该方程也用于更新 Critic 模型。\n\n(13)\n\n```\ndw← dw + 2A(s_{t},a_{k};w,w_{c})∇_{w}A(s_{t},a_{k};θ',w_{c})\n\
  dw← dw + \\frac{\\partial A{(s_{t},a_{k};θ',w')}^{2}}{\\partial w'}\n```\n\n此处，Critic\
  \ 更新会监控优势函数，以确保预期奖励与期望奖励之间的差异保持在最小。\n\n### 4.5 系统消耗问题\n\n当智能体产生工作时，可能将其放入本地队列或发送给邻居节点。选择卸载还是本地入队的函数很复杂。优化决策可以更好地利用可用计算资源，减少在建筑物中花费的总时间。多智能体系统旨在深度强化学习的目标之一是以这样一种方式减少未来的价值，使得\n\
  \n(14)\n\n```\nP1: minimizeV^{π}(s = s_{t}) = Σ_{i = 0}^{T}E(R_{t} | (s_{t},a_{i}))\n\
  badhbox Σw_{j} ≤ W,j ∈ E\n```\n\n(15)\n\n`C3 : A(s[t′]a[i′]θ, w) ≈ 0; ∀T s.t π^*(s)\
  \ = a^*`\n\n如前所述，从状态 `s-t` 开始遵循策略的预期回报由公式(14)给出。它与忠实描述排队任务经过时间的估计值一致。通过减小该价值估计，我们可以减少任务在队列中花费的时间，这是最终目标。包含本地和卸载动作的决策元组\
  \ `C1` 用符号 `a-i.=0,1` 表示。为了减少驻留时间，智能体倾向于有助于目标函数的卸载操作。由于缺乏上下文，智能体最初更倾向于探索并表现得反复无常。随着智能体获得经验并接近目标，其动作变得越来越预定。工作负载\
  \ `w` 必须小于或等于 `C2`，其中 `C2` 是总容量 `W`。累积奖励和近似价值函数之间只有很小的差距，这由 `C3` 优势函数所示。为了实现这一目标，智能体应用学习到的权重\
  \ `θ` 和 `w` 来寻找最优策略 `π*`，从而得出最优动作 `a*`。\n\n由于车辆中交换信息的机会较少，为活动选择最佳卸载策略可能很困难，导致等待时间变长和收敛变慢。然而，正如[[39]](#ch8.xhtml#ref8_39)所述，通过在多层学习架构的上下层之间简单地交换梯度，联邦学习使这成为可能。系统现在可以更快、更可靠地扩展。我们对\
  \ A3C 算法做了同样的事情，它使用并行仿真来提高性能。可以在更短的时间内探索更多的状态空间，从而做出更好的决策。\n\n## 5. 面向计算卸载的联邦学习架构\n\
  \n本研究提出了一种基于多智能体 DRL 的联邦任务卸载框架。该方法建立了一个多层框架，其中区域模型和全局模型通信协作，以确定何时何地委派工作。如前所述，每个车辆智能体通过与环境交互来学习局部模型，从而捕捉车辆环境的潜在动态。此外，得益于存储在边缘设备上的中心化全局模型发送的数据，智能体的局部模型定期更新。如前所述，车辆节点负责学习和存储模型。联邦学习通过允许车辆在单个节点上本地训练来减少网络延迟。训练在车辆节点上进行，仅在资源共享环境中传输最必要的数据，这两者都提高了隐私性。由于网络之间仅通信梯度，车辆隐私得到保护，且训练好的模型对数据变化更具鲁棒性。由于共享的信息更少，训练好的模型更稳定，数据被篡改的可能性也更小。\n\
  \n\n\n\n## 图 1：联邦学习的多级基础设施\n\n在图 1 中，展示了两层联邦架构工作流的实际运行情况。架构分为上下两层：下层托管车辆节点，上层由雾服务器联邦支撑。随着下层车辆的\
  \ Actor 和 Critic 网络学习策略和价值，它们接管控制权。上层雾服务器收集范围内车辆的数据，并聚合 Actor 和 Critic 的更新。卸载决策模型受益于两层间交换的最新信息。\n\
  \n![Figure 1. A multi-level infrastructure for federated learning. There is two-way\
  \ communication between the lower-tier cars and the associated fog node below.](img/fig8_1_B.jpg)\n\
  \nFigure 1. A multi-level infrastructure for federated learning. There is two-way\
  \ communication between the lower-tier cars and the associated fog node below.\n\
  \n## 分布式多层学习系统\n\n在分布式多层学习系统中，`N` 个移动智能体竞争有限的计算资源。每个车辆在其自身的完整车辆环境 `A3C` 实例中探索状态空间，因为我们有许多\
  \ `A3C` 实例并行运行。在高度动态的资源共享系统中，每个智能体致力于创建策略 `π`，以减少其在每项活动上花费的时间。与依赖经验回放或集中式架构的现有 `DRL`\
  \ 方法不同，我们采用分布式方法，学习在多个层级同时发生。在持续收敛的状态空间设置中改进决策，对广泛的延迟容忍车辆服务具有重要意义。正如上文所述，学习过程分为两层。\n\
  \n### 下层学习\n\n每个车辆智能体在连接到更大网络时，使用其 Actor-Critic 网络实例。智能体可利用该网络学习本地模型的定制版本。首先，智能体从全局\
  \ Actor-Critic 网络导入权重 `θ[i]`、`w[i]` 到其本地网络，后者随即重置为初始值。此后，智能体通过与环境交互开始在线学习。换言之，当接收到新任务时，智能体的\
  \ Actor 网络将根据策略 `π(s) → a` 执行卸载动作 `ai`，并获得奖励 `ri`。本地 Critic 网络通过计算状态价值 `V^π(s[t])`\
  \ 为 Actor 提供建设性反馈。基于此预测值，Actor 网络将探索其他卸载选项。Actor 和 Critic 网络共同掌握卸载模型。在建立最终状态之前，智能体根据本地策略与环境交互有限时间\
  \ `t-max`。每个回合结束后，智能体根据计算出的本地价值和策略损失更新全局网络。\n\n### 上层学习\n\n每个回合结束时，本地学习到的卸载模型权重以符号\
  \ `(θ'[1], θ'[2], ..., θ'[n], w'[1], w'[2], ..., w'[n])` 发送至全局 Actor-Critic 网络。若满足结束条件或游戏结束，回合终止。在本项目中，我们通过雾服务器联盟部署全球网络。需注意，全局网络的学习任务已移交给单个联邦节点（可能是驻留时间最短的雾服务器\
  \ `argmin_{i ∈ F} Z_i`），其余联邦节点处理层间通信。全局网络通过添加本地模型权重来更新全局模型 `(θ[1], θ[2], ..., θ[n],\
  \ w[1], w[2], ..., w[n])`。得益于方法的异步特性，全局网络无需接收定期的本地更新。由于两层间丰富的通信与协作信息交换，该方法通过最小化预测折扣未来效用\
  \ `Rt|(st, ai)`（与作业在队列中的驻留时长成正比）而快速收敛。\n\n## 卸载决策机制\n\n由于任务驻留时长与奖励的相关性，车辆做出卸载判断。如前所述，车辆选择动作将任务委托给邻近节点，获得的奖励取决于所选动作。卸载车辆在运行期间监控车辆健康状况，并通过基于时间的任务时长计算验证总奖励。在每个作业节点花费时间最少的卡车获得最多奖励并更快到达终点。因此，该解决方案能够基于训练模型的权重和概率分布，针对不同到达率做出卸载决策。正如我们所见，车辆对卸载模型任务的分布式学习，在基础层面解决了优化问题。由于我们使用分布式\
  \ `A3C` 技术，同时执行多个仿真场景。操作车辆的智能体也在其虚拟世界中交互。每辆车实时从环境中学习，做出适合其独特情况的最优卸载决策。上层必须聚合来自下层的参数更新并将其反馈下发。通过汇编仿真环境中所有车辆的最新信息，上层助力智能体获得更多样化的训练体验。\n\
  \n## 算法 1：基于 A3C 的任务卸载解决方案\n\n```\n1:  procedure main(self)\n2:    if Training Model\
  \ exists then\n3:      x ← LowerTierLearning()          ▻ Agents Online Learning\n\
  4:    end if\n5:  end procedure\n\n6:  procedure LowerTierLearning(V[1], V[3], V[n])\n\
  7:    Get Concurrent Threads\n8:    Global Parameters ← (θ, w)\n9:    Local Parameters\
  \ ← (θ′, w′)\n10:   dθ = dw = 0                        ▻ Zero Gradient initialization\n\
  11:   θ′ = θ and w′ = w                  ▻ reset using global weights\n12:   x ←\
  \ AgentExperience()\n13:  end procedure\n\n14:  procedure AgentExperience(self,\
  \ s, a, r, s′)\n15:    s = sample state for an agent v[i]\n16:    for t ≤ t[max]\
  \ do:\n17:      while (episode[i] != End) do:\n18:        Actor ← π(s; a[i])   \
  \          ▻ Actor Takes Action\n19:        rt                    ▻ Gets reward\
  \ and move to the next state\n20:        Update t = t + 1\n21:      end while\n\
  22:      Critic ← V(S[t]; w)              ▻ Critic Estimate\n23:      Gradient Computation\
  \ w.r.t θ′ : dθ ← From Equation??\n24:      Gradient Computation w.r.t w′ : dw ←\
  \ From Equation 14\n25:      x ← UpperTierUpdate()            ▻ Global Model Update\n\
  26:    end for\n27:  end procedure\n\n28:  procedure UpperTierUpdate(dθ, dw)\n29:\
  \    Global[α] ← dθ; Global[c] ← dw     ▻ Asynchronous Local to Global updates\n\
  30:  end procedure\n```\n\n\n\n\n使用多智能体时，所提多层架构有许多优势。首先，该架构利用各种本地分散环境中的智能体交互，实现多样化的学习体验。其次，异步学习使智能体能以更快的收敛速度学习，同时也增加了它们对底层资源共享环境的接触。第三，雾联邦用于完成高层学习，通过融合来自多个来源的信息，能构建更全面的环境图景。与高层相反，低层较难观察，因为它们仅与直接位于其下方的事物交互。协作学习使用全局策略而非仅靠局部知识，通过交互式学习更快收敛到全局极小值。由于受限的连接性和感知范围，车辆网络必然存在某些限制。因此，决策仅在尽可能低的层级做出，这可能因受限的信息流和扭曲的路况视图而导致次优结果。高层雾服务器可整合从车辆和低层雾服务器获取的信息，以更好地指导卸载决策。当汽车既能相互教学又能相互学习时，可高效映射庞大的车辆状态空间。第四，模型在本地训练，减少了传输到顶层全局网络的数据量，最大化利用可用通信信道。最后，该方法通过个体努力和受限协作在共享基础设施间共享信息，高效利用通信资源。这种共享学习方法改进了决策，进而减少了车辆共享资源网络中每项活动的耗时。在基础层（汽车学习分布式工作卸载模型的地方），求解优化问题。由于使用分布式\
  \ `A3C` 技术，我们同时执行多个仿真场景。操作车辆的智能体也在其虚拟世界中交互。每辆车实时从环境中学习，做出最适合其独特情况的卸载决策。因此，我们的方法受益于这两个过程的综合效果。为改进监督并允许在并行运行多个仿真环境的特定实例中更全面地探索状态空间，第一个过程在高层收集并重新共享变化。\n\
  \n## 6. 性能评估\n\n为在真实交通环境中测试所提框架，我们将曼哈顿路网和移动模型与 `SUMO` 交通仿真器结合。必要的软件和仿真设置详见表 2。在仿真环境中，有\
  \ 100 辆汽车和 9 个雾节点。我们的方法利用多线程在多个不同场景中同时运行仿真。我们使用配备 8GB 内存的 Intel Core i7 2.4GHz 联想机器。系统的两个线程专门用于同时处理两个仿真场景。使用生成对抗强化学习仿真，我们通过模拟一个节点网络（每个节点可执行不同类型的计算）来训练模型。使用\
  \ `TensorFlow 1.13.1` 和 `Python 3.7` 创建联邦学习方法。为使学习算法获得更全面的教育，仿真交通场景在一系列到达率下运行，范围为\
  \ `60 ≤ λ ≤ 200` 每秒。网络采用 `Actor-Critic` 网络和四层 `DNN` 架构创建本地任务卸载策略。输入层的 32 个神经元使用\
  \ `Softmax` 激活收集环境信息，输出层的 4 个神经元做出四种卸载选项之一。两个隐藏层共有 18 个神经元。超参数示例包括自定义隐藏神经元密度。我们考察了不同隐藏层神经元数量下的模型性能。网络使用\
  \ `Adam` 优化器和 `tanh` 激活函数。\n\n### 表 2. 仿真中使用的变量\n\n| 变量 | 值 |\n| --- | --- |\n|\
  \ 车辆/雾传输范围 | 100 m / 200 m |\n| 操作系统 | Windows 8.1 64-bit |\n| 发射功率 / 白高斯噪声 | 1\
  \ W / 10^(–3) [[23]](#ch8.xhtml#ref8_23) |\n| 车辆/雾时钟频率 | 0.6–1.0 GHz / 2.0 GHz |\n\
  | 神经网络层数 / 激活函数 | (32, 16, 8, 4) / tanh / Softmax |\n| 学习率 / 折扣因子 | 10*e*^(–5) /\
  \ 0.955 [[42]](#ch8.xhtml#ref8_42) |\n| 仿真时间 / 区域 | 1000 步 / 900 × 900 m |\n| 移动模型\
  \ / 车辆速度 | 曼哈顿 / 随机 |\n| 车辆数 / 雾节点数 / 停放车辆数 | 100 / 9 / 20 |\n| 任务周期 / 数据大小 | 0.2–1.0\
  \ Mbits / 1–6 MBs |\n| 系统配置 | Intel Core i7 2.4GHz 8GB |\n| V2V / V2R / V2P 带宽 |\
  \ 1.0 / 2.0 / 1.0 MHz |\n\n如果隐藏层数量不最优，算法的学习能力会受损。输入层隐藏层过少会导致欠拟合，过多则导致过拟合。学习任务卸载参数需尽可能少的工作量，因此选择合适的层数很重要。虽无通用规则，但隐藏层规模通常在输入层和输出层之间取中等大小。隐藏层数量应相对较低，尤其是与输入层数量相比。`tanh`\
  \ 函数因以 0 为中心对称，收敛比 `sigmoid` 函数更快。因梯度更陡峭，仿真在 `tanh` 上收敛更快。如前所述，多个智能体同时探索车辆状态空间。这意味着\
  \ `A3C` 算法的分布式特性允许多个仿真环境在独立受控线程中同时运行。汽车可借助多个仿真场景同时尝试多种策略并观察结果。该技术的分布式结构允许探测更宽广的状态空间区域。基站聚合本地学习模型，以补充汽车的在线学习。\n\
  \n### 6.1 在线学习\n\n在线学习数据生成过程是我们所提方法的基础。`A3C` 方法从环境收集新数据以训练任务卸载模型。因任务卸载仍是新概念，无可靠数据集能详尽覆盖驾驶环境。车辆网络架构高度动态，用户间几无无限制数据共享可能。因此难以创建考虑汽车系统所有侧面的数据集。车辆系统也是具有海量或连续状态空间的环境，需大量样本才能获得可靠结果。因此，所提方法是基于在线学习的答案，实时生成数据并发现任务卸载偏好。它从根本上区别于经验回放类技术，后者从过去事件的缓冲区中随机挖掘。\n\
  \n我们使用以下两种算法作为比较基准：\n\n**随机选择算法 (SA)** —— 从其数据传输范围内的计算节点池中随机选择目标节点。资源池中雾服务器、静止车辆和移动车辆均等比例。\n\
  \n\n\n\n**贪婪算法 (GA)** —— 在其数据传输区域内，从可用的处理能力中急切地选择一个附近的目标节点。\n\n## 7. 结果与讨论\n\n###\
  \ 7.1 驻留时间\n\n它包括等待工作开始所花费的时间和收集必要材料所花费的时间。当做出更好的决策时，服刑期限（驻留时间）总是会缩短。在 图 2 中，我们将提出的方法与其他两种更传统的方法进行比较，以分析不同到达率下的驻留时长模式。当到达率较低时，所有方法表现出几乎相同的行为。然而，随着到达率\
  \ >=140，该模式变得更加明显。在 =200 时，我们的方法似乎有 58% 的改进。较小的队列和更少的总延迟时间是建议方法更审慎决策的结果。\n\n![图\
  \ 2. 各种任务到达率下的平均驻留时间。](img/fig8_2_C.jpg)\n\n图 2. 各种任务到达率下的平均驻留时间。\n\n### 7.2 端到端时延\n\
  \n确定网络因任务传输、排队等待和在最终节点处理等活动而损失的总时间。提出的方法预测在 *λ* = 200 时下降 57.11%。共享资源环境中总端到端延迟的减少表明决策最优，而延迟和队列长度的增加则揭示了最差的决策。\n\
  \n### 7.3 传输时延\n\n是由无线连接的有限数据率引起的滞后吗？请记住，此变量会影响您的总停留时间。与 GA 和软演员-评论家方法相比，DRL 技术的总传输时延如\
  \ 图 3 所示。虽然 GA 卸载到附近的邻居意味着它拥有最短的传输延迟，但它也导致了最长的驻留时间。将提出的方案与 GA 和 SA 进行比较时，我们分别看到减少了\
  \ 8.5% 和增加了 105.6%。通过仔细考虑每个节点的卸载偏好，DRL 方法有效地利用了邻近节点的空闲资源。\n\n![图 3. 总传输时延。](img/fig8_3_C.jpg)\n\
  \n图 3. 总传输时延。\n\n### 7.4 系统成本\n\n是卸载执行和本地执行的总和。包括提出的方法在内的若干卸载选项及其平均系统成本。显然，在感知决策模型中，GA\
  \ 和软演员-评论家都必须承担的工作量是最大的成本。具体而言，当 *λ* = 200 时，SA 的成本上升 16%，GA 的成本上升 56%。正如所解释的那样，提出的方法通过减少驻留时间，增加了资源共享设置的总系统成本。这种改进归因于\
  \ λ = 200 时驻留时间减少了 58%。\n\n### 7.5 交付率\n\n是指被卸载、计算并返回给原始节点的原始工作的比例。图 4 显示，GA 和 SA\
  \ 方案的交付量均显著下降。在 λ = 200 时，GA 下降 45.9%，SA 下降 20.4%。这种交付量的显著下降可能归因于工作负载的不均匀分布，导致队列变长和故障增多。随着更多工作转移到周围节点，GA\
  \ 因队列增长而经历更高的故障率。\n\n![图 4. 可变到达率与结果交付比。](img/fig8_4_C.jpg)\n\n图 4. 可变到达率与结果交付比。\n\
  \n在任务到达率 λ =200 时，如 图 5 所示，显示了给定的任务总数。与 GA 和 SA 分别完成约 17000 和 14000 个任务相比，提出的系统完成约\
  \ 15000 个任务。提出的方法在总共 15000 个交付任务中，还拥有 9000 次单跳交付率。请记住，交付是单跳和双跳之和。与 SA 和 GA 都使用 8000\
  \ 进行首跳交付相比，BP 更好地利用了本地节点的资源。提出的方法比 GA 和 SA 少得多的故障（分别减少 69% 和 53%）。因此，随着到达数量的增加，SA\
  \ 和 GA 方法减少交付次数并增加成功尝试次数。\n\n![图 5. 任务到达率统计，值为 200。](img/fig8_5_C.jpg)\n\n图 5. 任务到达率统计，值为\
  \ 200。\n\n### 7.6 工作负载分布\n\n图 6 显示了系统的任务分配和完成率。θλ = 200 时的数据表明，卸载系统以最高效的方式分配任务。与\
  \ GA 相比，提出的方法将本地执行作业的比例提高了 30%，与 SA 相比提高了 4.1%。提出的方法通过向每个目标分配 15000 个任务，最优地利用了附近的资源分配。建议的结果表明，在资源共享框架中，延迟和结果交付均有所减少，且\
  \ GA 技术对邻近移动节点的利用增加了 65%。然而，根据以最低交付成本衡量的结果，效率有所下降。\n\n![图 6. 到达率 λ = 200 时的任务统计。](img/fig8_6_C.jpg)\n\
  \n图 6. 到达率 λ = 200 时的任务统计。\n\n### 7.7 利用率\n\n指定可用计算节点成功处理的传入任务的比例。可以看到，提出的基于 DRL\
  \ 的方法很好地利用了可用的共享资源。图 7 显示了三种可能场景的分布：V2V、V2F 和 V2P。显然，在任务利用效率方面，提出的方法优于 GA 和 SA。提出的方法在所有三种场景中都提高了资源利用率：V2P（提升\
  \ 5.35 个百分点）和车对车（提升 8.5%）。\n\n![图 7. 任务到达率 σ = 200(task/s) 利用率。](img/fig7_C.jpg)\n\
  \n图 7. 任务到达率 σ = 200(task/s) 利用率。\n\n请记住，这些是系统处于满负荷时的数字。演员网络和评论家网络的损失分别显示在 图 8 的上部和中部图表中。最初，演员网络通过任意行动并记录结果奖励来探测环境。演员根据总奖励修改其卸载策略，然后选择能带来更多未来奖励且驻留时间更短的动作。正如底部奖励图所观察到的，目标奖励与价值函数之间差距的缩小改善了价值估计，并隐含地改善了评论家网络损失。这可以作为演员网络在重新考虑其方法时的向导和批评。\n\
  \n![图 8. 提出的深度强化学习任务卸载结构的预期收敛率，任务到达率 λ = 200。顶部显示演员网络的累积损失，中部显示评论家网络的累积损失，底部显示累积奖励。](img/fig8_8_B.jpg)\n\
  \n图 8. 提出的深度强化学习任务卸载结构的预期收敛率，任务到达率 λ = 200。顶部显示演员网络的累积损失，中部显示评论家网络的累积损失，底部显示累积奖励。\n\
  \n### 8. 结论\n\n\n\n\n\n# 利用深度强化学习实现联邦多智能体资源分配\n\n利用深度强化学习，本研究提出了一个用于联邦多智能体驱动资源分配的框架。所提模型通过同时在多个层级学习决策模型，实现了面向延迟敏感型资源共享的快速收敛。我们的实验结果表明，我们的多智能体\
  \ DRL 框架可通过提高解决方案交付速度、降低端到端延迟，并最高效地利用可用资源，从而在高风险环境中提升性能。得益于对建议工作的这些改进，V2P 场景下的利用率提高了\
  \ 5.35 个百分点，V2V 场景下提高了 8.5%，且现在可在单跳内提供 9000 个任务。此外，与 GA 相比，本地执行速度提高了 30%。未来，我们希望通过对比更先进的\
  \ DRL 方法来拓展这项工作。该框架将托管在公共 GitHub 代码库中，以便所有人轻松访问。此外，还可实施进一步的方法来增强协作系统在采样效率、传输延迟和其他指标方面的性能。在资源共享车辆的背景下，通信的大量梯度更新可能会给共享网络带来负担。通过本地训练，层间传输的数据保持私密，但梯度更新会暴露于梯度欺骗攻击之下。\n\
