  \n## 第 5 章 导航联邦学习中的隐私顾虑：基于 GDPR 的分析\n\n*G Anitha*^(⁵)\n\n电子邮件：jegatheesanphdcse@gmail.com\n\
  \n### 1. 引言\n\n当今绝大多数软件和服务，尤其是医疗、交通和货币领域使用的软件和服务，都依赖于由人工智能（AI）驱动的复杂机器学习（ML）算法收集的数据\
  \ [[1]](#ch5.xhtml#ref5_1)。人工智能在生活的各个领域都取得了进展，预计其对全球的影响将超过人类历史上任何其他事件。不仅仅是电网 [[2]](#ch5.xhtml#ref5_2)，[[3]](#ch5.xhtml#ref5_3)。AI\
  \ 的全部潜力尚未实现，基于 AI/ML 的应用开发仍面临重大障碍。集中式存储和处理是这些问题的主要因素 [[4]](#ch5.xhtml#ref5_4)。在现实世界中，数据，尤其是个人数据，通常产生并存储在孤立的位置，例如个人用户的设备或中央数据中心。对于大多数传统\
  \ ML 算法，训练数据通常集中在数据服务器中 [[5]](#ch5.xhtml#ref5_5)。简言之，从许多来源收集、整合和融合分散的数据并非易事，更不用说管理和安全分析由此产生的海量信息了\
  \ [[6]](#ch5.xhtml#ref5_6)。在不增加 GDPR 等数据保护规则和限制复杂性的情况下，以高速跨组织传输具有可变准确度的海量数据已经很有挑战性了\
  \ [[7]](#ch5.xhtml#ref5_7)。在单个高性能云服务器上使用传统 ML 算法处理海量数据时，既可能发生安全漏洞，也可能出现单点故障 [[8]](#ch5.xhtml#ref5_8)。\n\
  \n集中式数据处理和管理带来的缺乏透明度和来源追溯，可能使赢得消费者信任和满足 GDPR 要求变得困难 [[9]](#ch5.xhtml#ref5_9)。专业人士和学者都注意到了\
  \ Google 于 2016 年创建联邦学习（FL）以克服此类障碍。通过在智能手机、平板电脑等孤立数据源保存的许多本地数据集上执行 ML 算法，FL 消除了对集中式数据服务器的需求\
  \ [[10]](#ch5.xhtml#ref5_10)，[[11]](#ch5.xhtml#ref5_11)。在 FL 中，本地节点存储训练数据集并协同计算以训练一个集中的\
  \ ML 模型 [[12]](#ch5.xhtml#ref5_12)。\n\n借助 FL，服务提供商可以在其应用程序和服务中实现某些类型的机器学习算法，而无需从客户那里收集任何个人身份信息，这可能使他们更容易满足\
  \ GDPR 等数据保护法规（DPR） [[13]](#ch5.xhtml#ref5_13)，[[14]](#ch5.xhtml#ref5_14)。尽管 FL\
  \ 采用了保护隐私的分布式协作学习方法，但私人数据仍可能从本地训练中被秘密检索 [[15]](#ch5.xhtml#ref5_15)。因此，在处理印度公民数据时，佛罗里达州的服务提供商有义务采取符合\
  \ GDPR 的预防措施 [[16]](#ch5.xhtml#ref5_16)。在本文中，作者从 GDPR 合规的角度回顾了以往的 FL 研究，重点关注隐私保护方法\
  \ [[17]](#ch5.xhtml#ref5_17)。首先，我们将 FL 作为一种可行的方式，来克服传统集中式 ML 系统中数据隐私保护的困难 [[18]](#ch5.xhtml#ref5_18)，[[19]](#ch5.xhtml#ref5_19)。其次，概述了集中式\
  \ FL 的前沿隐私保障措施，并探讨了这些方法如何从数据安全和隐私角度减少漏洞。第三，我们提供了深入的讨论，并提出了关于如何设计 FL 系统以满足 GDPR 要求的可能解决方案。我们还提出了未来研究的潜在方向，并强调了阻碍联邦学习系统满足\
  \ GDPR 必要条件的剩余挑战。\n\n### 2. 基于 ML 的 GDPR 合规与隐私保护系统\n\n#### 2.1 语境属性\n\n创新的机器学习（ML）领域使机器能够在未被显式编程的情况下执行任务，让它们通过经验学习和改进。为此，机器学习系统利用数据集（训练数据）构建数学模型，旨在随时间微调模型参数\
  \ [[20]](#ch5.xhtml#ref5_20)，[[21]](#ch5.xhtml#ref5_21)。这使得算法在面对新数据时能做出更准确的预测或判断。寻找目标函数的最大值通常是数学优化问题的最终目的，可用于描述\
  \ ML 工作。因此，任何基于 ML 的系统都必须具备优化技术。\n\n##### 2.1.1 梯度下降算法\n\n梯度下降是 ML 和 FL 的基础，使其成为\
  \ ML 中流行的优化方法 [[22]](#ch5.xhtml#ref5_22)。它是一种用于寻找带有用户指定参数的目标函数 `f(θ)` 极小值的一阶迭代优化算法。`D\
  \ = (x[1], y[1]), (x[2], y[2]), ..., (x[m], y[m])`，以及目标函数 `f(θ)`；模型中的每个参数都使用梯度下降方法沿目标函数\
  \ `f(θ)` 梯度的相反方向进行更新，如以下公式所示。\n\n(1)\n\n$$\nw_j \\leftarrow w_j - \\eta \\nabla\
  \ \\frac{1}{m} \\sum_{i=1}^{m} L(f(x_i) - y_i)\n$$\n\n其中\n\n> `w[j]`：`θ` 的第 j 个参数\n\
  >\n> `η`：学习率超参数。\n\nMSE 和交叉熵损失是可用字母 `L` 表示的损失函数示例。参数使用公式 1 反复更新，直到达到局部极小值，或阶段间损失的变化足够小以至于可以忽略。\n\
  \n##### 2.1.2 梯度下降变体\n\n\n\n\n\n# 梯度下降算法与分布式学习\n\n根据计算目标函数 `f(θ)` 所需的数据量，梯度下降算法通常分为三类。\n\
  \n**批量梯度下降** 是第一类，它仅通过一次更新，在整个训练数据集 `D` 上计算梯度。与批量梯度下降不同，**随机梯度下降 (SGD)** 依据从 `D`\
  \ 中随机选取的一个数据子集的梯度来更新参数 [[23]](#ch5.xhtml#ref5_23)。第三类，**小批量梯度下降**，涉及在处理完每 `n` 批训练样本后重新计算参数。\n\
  \n梯度下降的每次迭代都需要在计算精度与参数更新精度之间做出权衡。小批量梯度下降修正了 SGD 可能出现的梯度震荡以及批量梯度下降的低效问题 [[24]](#ch5.xhtml#ref5_24)，[[25]](#ch5.xhtml#ref5_25)。然而，该方法引入的额外超参数\
  \ `batchsize n` 有时需要专业知识、大量实验，甚至人工调整。\n\n**优化器** 是用于实际且精确地调节学习率 `η` 的方法，通常伴随梯度下降使用。这些优化器与损失函数\
  \ `L` 和模型参数 `θ` 协同工作，根据损失函数的输出微调学习率 `η`。\n\n## 2.1.3 基于梯度下降的分布式学习\n\n随着大规模分布式学习（联邦学习即属于此类）的流行，基于梯度下降的优化技术再次受到关注。多个节点可在训练复杂模型（如拥有数百万变量的\
  \ DNN）时协同工作。这些节点被分组为 **计算节点**，负责为整个网络执行计算 [[26]](#ch5.xhtml#ref5_26)。\n\n借助 **模型并行**\
  \ 和 **数据并行** 等并发方法，可加速训练计算。机器学习模型可从模型并行中受益，将工作分解为更小、更易管理的任务，随后分散到所有可用的计算节点上。模型并行要求集群中计算节点间进行频繁的通信与同步，以及在这些节点上进行小批量数据复制\
  \ [[27]](#ch5.xhtml#ref5_27)。\n\n反之，**数据并行** 在每个节点上保持完整模型运行，同时将训练数据均匀分布在集群中的所有机器上（“分片”）。多种现代机器学习框架（包括\
  \ `TensorFlow` 和 `PyTorch`）均支持数据并行。\n\n**混合并行** 融合了这两种并行方法，以最大化各自优势并最小化劣势，从而构建一个效率与可扩展性更高的系统。\n\
  \n#### 2.2 机器学习的安全措施\n\n在分布式学习系统中，隐私保护技术主要服务于两大目的：\n\n1.  确保只有合法用户能够访问训练数据集，以及\n\
  2.  防止未授权用户访问作为优化算法一部分在节点间通信的本地模型参数。\n\n##### 2.2.1 数据去标识化\n\n**去标识化数据（匿名化）** 是一种通过模糊或移除数据集中个人可识别信息\
  \ (PII) 及其他敏感数据的方法。由于隐藏或省略信息可能降低数据集的效用，数据匿名化必须在隐私保障与效用之间取得良好平衡 [[28]](#ch5.xhtml#ref5_28)。\n\
  \n当数据主体与其他匿名数据集的补充信息相关联时，可发起一种称为 **关联攻击** 的隐私攻击。已提出多种方法以阻止关联攻击，它们分别是 **k-匿名性**、**l-多样性**\
  \ 和 **t-接近性**。然而，若攻击者已知部分私有数据，此类隐私防护仍易受关联攻击。基于 k-匿名性方法的这一缺陷，使得开发提供强隐私保证的替代方法（如 **差分隐私**）成为必要。\n\
  \n##### 2.2.2 同态加密\n\n在中心化系统（如云端）使用收集的数据训练模型时，利用 **同态加密** 技术保护该数据的机密性至关重要 [[29]](#ch5.xhtml#ref5_29)。得益于同态加密，无需密钥即可对加密数据进行计算。仅计算请求者能够解密加密结果。\n\
  \n此外，同态加密保证解密后获得的结果与使用原始未加密数据集计算获得的结果完全一致。同态加密家族包含 **部分同态加密**、**某些同态加密** 和 **全同态加密**\
  \ 等子集。\n\n**Rivest-Shamir-Adleman (RSA)** 算法作为最常用的加密算法之一，允许执行加法和乘法等简单数学运算 [[30]](#ch5.xhtml#ref5_30)。使用\
  \ **FHE**，密文可进行完全任意的操作，且操作及其输出均可加密。在 FHE 中，解密函数可用于从原始数据或密文传输数学计算，而不会导致任何不兼容性。\n\n\
  尽管同态加密从未泄露原始明文数据，但巨大的处理开销阻碍了在密文上执行任何有意义的计算。因此，在大规模数据训练任务中使用同态加密目前仍不可行。\n\n#### 2.3\
  \ GDPR\n\nGDPR 于 2018 年 5 月 25 日取代了自 1995 年起生效的《数据保护指令》。GDPR 的核心原则是“个人数据只能在严格限制下、为合法目的、合法地获取”（更广泛的范围见“Which?”——图\
  \ 1）。在其 99 条款中，法律详细规定了组织必须遵守的价值观，以及为处理个人数据必须满足的技术与管理标准 [[31]](#ch5.xhtml#ref5_31)。\n\
  \n如 图 1 所示，《通用数据保护条例》（“全球”）将对全球处理居民个人信息的企业和政府机构产生深远影响。依据数据保护立法，GDPR 明确区分了 **数据主体**、**数据控制者**\
  \ 和 **数据处理者** 的角色。\n\nGDPR 是一项欧盟法规，其既定目标是“保护自然人在个人数据处理方面的权利和自由，特别是隐私权”。为此，GDPR 对同意的法律依据确立了严格要求，强制要求\
  \ **数据控制者** 在处理任何个人数据前获得 **数据主体** 的同意。在授权条件下 [[32]](#ch5.xhtml#ref5_32)，**数据控制者**\
  \ 对处理个人数据的原因和方式拥有完全控制权。\n\n![图 1. GDPR 法规。](img/fig5_1_B.jpg)\n\n图 1. GDPR 法规。\n\
  \n#### 2.4 满足 GDPR 要求的困难\n\n标准的基于 ML 的应用和服务必须采用适当方式，依据《通用数据保护条例》(GDPR) 规定的六大数据保护原则，妥善保护和管理个人数据。尽管基于\
  \ ML 的系统受益于多种隐私保护防护措施，但在中心化的基于 ML 系统中应用这些责任可能极具挑战性，甚至不可能 [[33]](#ch5.xhtml#ref5_33)。\n\
  \n\n\n\n此类基于机器学习的系统在单台服务器上收集、聚合并分析海量数据，使其容易遭受由单点故障引发的灾难性数据泄露。由于机器学习算法执行和决策的“黑箱”特性，要对其提供有意义的分析极具挑战性\
  \ [34]。因此，大多数基于机器学习的系统难以满足 GDPR 关于透明度、公正性和自动化决策的标准。\n\n此外，基于机器学习的系统并不总能切实满足目的限制和数据最小化的约束。大多数机器学习算法极度依赖所获取数据的质量和数量，因此研究人员通常旨在尽可能多地收集数据\
  \ [35]。因此，在运行此类机器学习算法之前，很难（1）确定数据收集的动机，以及（2）确定数据是否适当、受限且仅与声明的目的相关。这些限制给机器学习（ML）服务和应用的潜力设定了人为障碍。\n\
  \n最后，机器学习算法主要是为最大化效率而设计的，而隐私保护方法仍局限于基本的警示条款。为了满足 GDPR 的严格要求，机器学习算法将需要在算法层面进行根本性重新设计。实现这种彻底的变革将需要巨大的、甚至可能无法实现的技术精度和资金支持。看来许多服务提供商正在权衡将效率置于隐私保障之上的成本与收益，并意识到这样做可能会导致他们无法继续提供当前的服务。\n\
  \n### 3. 联邦学习：一种分布式协作学习方法\n\n由于难以在大规模收集和处理个人数据时遵守严格的数据保护要求，传统的以云为中心的机器学习技术在许多场景下已不再适用。终端用户设备（如智能手机、平板电脑和可穿戴设备）拥有不断增长的算力和互联网接入，并产生了绝大多数个人数据\
  \ [36]。为应对此类个人设备的激增及随之而来的隐私问题加剧，去中心化 AI 应运而生，它利用移动边缘计算和人工智能/机器学习方法，将智能从云端迁移至边缘。\n\
  \n由于联邦学习允许用户在协作训练机器学习模型的整个过程中，将其原始个人数据保留在本地设备上，因此它可能有助于缓解与基于云的机器学习相关的一些风险。它是一种利用去中心化数据训练中心化机器学习模型的跨学科方法，应用于机器学习、分布式计算、数据隐私和安全领域。在组合和更新模型时，仅交换训练参数。在训练数据方面，传统分布式学习假设每个计算节点的本地训练数据集是独立同分布（IID）且规模大致相同的。联邦学习并非如此。由于联邦学习能够适应非\
  \ IID 数据集，且其规模可能相差数个数量级，因此它是分布式学习的一项进步。这些不相关的数据集分散在各种移动设备上，设备的网络可用性和数据传输速率各不相同。\n\
  \n#### 3.1 联邦学习中的模型训练\n\n通过将模型构建为在训练数据集上最小化特定目标函数，联邦学习主要适用于机器学习模型中的参数估计。此类最小化目的的一种表述为：\n\
  \n(2)\n\n```\n\\min\\limits_{w \\in {\\mathbb{R}}^{d}}f(w) = \\frac{1}{n}\\sum\\\
  limits_{i = 1}^{m}f_{i}(w)\n```\n\n其中用于训练的输入输出对（`xi`、`yi`）类型为 `x[i]` ∈ R`^d` 和 `y[i]`\
  \ ∈ R，∀`i` ∈ {1, 2*, ., n*}。数据集样本量（`n`）、参数向量 `w` ∈ R`^d` 和损失函数（`fi (w)`）在公式 2 中表示。这一思想适用于广泛的人工神经网络（ANN）相关任务，包括线性回归和逻辑回归、支持向量机等。它甚至延伸至\
  \ ANN 中复杂的非凸挑战，如深度学习。最小化作为模型参数函数的损失之和，可利用梯度下降技术并以反向传播作为优化策略轻松计算。\n\n正如传统机器学习方法所做的那样，此类过程在已均匀分区的海量数据集上执行大量快速迭代。此类算法需要通往训练数据的极快、低延迟链路。由于联邦学习环境不满足这些条件，解决此优化问题的传统机器学习方法不再适用。与传统方法使用的平衡且\
  \ IID 的数据不同，联邦学习的训练数据分散在数百万台独立的移动设备上，由延迟显著更高、吞吐量更低的网络连接。作为一个额外的限制条件，单个设备的数据和计算资源仅在训练过程中按需提供。在联邦学习付诸实践之前，优化算法需要成功适应并实施于联邦环境中。\n\
  \n#### 3.2 联邦优化\n\n在训练数据大量且不均匀地分散在本地节点的联邦环境中表现良好的优化算法，是联邦学习的基石。以下公式描述了联邦优化的分布式参数。设\
  \ `K` 表示集群中节点的总数，`P[k]` 表示节点 `k` ∈ {1, 2*, .*, K} 持有的数据点集合，`n[k]` = |`P[k]`| 表示节点\
  \ `k` 持有的数据点总数。鉴于每个本地节点存储其自己独特的个人信息集合，我们可以推断出，ℙ[`k`] ∩ ℙ[`l`] = ⌀ if `k` ≠ `l` 和 *Σ*[`k` = 1]^(`K`)`n`[`k`] = `n`。对于最小化问题，以下定义了分布式问题公式化：\n\
  \n(3)\n\n```\n\\min\\limits_{w \\in {\\mathbb{R}}^{d}}f(w) = \\frac{n_{k}}{n}\\\
  sum\\limits_{k = 1}^{K}F_{k}(w)\n```\n\n(4)\n\n```\nF_{k}(w) = \\frac{1}{n_{k}}\\\
  text{Σ}_{i \\in {\\mathbb{P}}_{k}}f_{i}(w)\n```\n\n鉴于该联邦系统中本地节点的通信能力有限，减少优化技术使用的迭代次数至关重要。作者\
  \ [25] 结合了用于分布式优化的 SVRG 和 DAN 算法，创建了一种独特的分布式梯度下降（联邦 SVRG）。FSVRG 在每个周期后通过计算每个本地节点\
  \ `k` 上 `P k` 数据的梯度，然后跨所有 `k` 个本地节点对这些加权值求平均，来更新每个节点的参数。下一步是利用约 10,000 个个体作为本地节点的样本，评估系统预测\
  \ Google+ 公开帖子是否会获得评论的能力。FSVRG 比原始梯度下降方法少 30 次迭代即可达到最优解。\n\n\n\n然而，在联邦语境下，个人移动设备间的数据样本量和数据供给差异巨大，标准分布式机器学习算法主要在\
  \ IID 数据上训练的假设不再成立。这表明，在联邦系统中，非 IID 数据训练导致的准确率远低于 IID 数据训练，且收敛速度更慢。减少发送到编排服务器的参数更新数据量的方法，可提升此类环境下\
  \ `FSVRG` 算法的表现。通过使用结构化更新或草图更新，可更快、用更少变量更新机器学习模型。将许多机器学习模型中的本地节点作为单一学习目标中的任务分别训练，是一种雄心勃勃的联邦优化策略。本地节点生成不同分布的数据是常态，因此为每个节点使用不同的学习模型很自然。然而，由于这些模型在结构上相似，可使用多任务学习（`MTL``）框架对其建模，从而对它们之间的相似性进行建模。该方法在处理非\
  \ IID 数据时，能保证学习收敛并提升性能。联邦 SGD 和联邦平均法是在早期联邦优化研究基础上发展而来的，它们允许用比朴素 `FSVRG` 少一百倍的通信量来训练深度网络。\n\
  \n这些算法的动机在于：需要利用当今个人移动设备中强大的处理器，做的不仅仅是计算梯度步骤。在这种情况下，梯度由每个客户端计算，本地模型也在本地计算多次；协调服务器仅聚合结果。这在训练期间仍能提供良好的全局模型，同时减少了所需的通信次数。这些建议算法在严苛约束下（如低带宽、过大抖动和通信延迟）表现良好。在这些情况下，朴素\
  \ `FSVRG` 算法效果不佳。G-board（安卓手机上的谷歌键盘）利用这些算法预测用户输入。在此设置中，智能手机运行联邦 SGD，使用本地信息执行梯度下降计算。云服务器接收信息并进行处理。为在新训练周期开始时改进全局模型，服务器采用联邦平均法，随机选取一部分移动设备并平均它们提供的梯度。本地节点接收更新后的全局模型后，会对其模型应用必要的更改。\n\
  \n#### 3.3 联邦学习过程的周期\n\n网络节点各自使用自己的数据训练模型，并定期向中心化服务器报告。中心化 FL 架构中的工作流周期包含以下四个步骤：\n\
  \n1.  **参与者选择与全局模型分发：** 服务器选取一部分符合训练资格的用户。随后，它更新全局机器学习模型，并通知受训者即将开始的训练会话。\n\n2.\
  \  **本地计算：** 参与者下载服务端机器学习模型后，刷新其设备上的 ML 模型，并使用设备上的数据集对其进行重新训练。客户端设备需要 FL 客户端软件，以便在本地节点上执行联邦\
  \ SGD 和联邦平均法等训练算法、获取全局模型更新，以及与服务器收发本地机器学习模型参数。\n\n3.  **本地模型聚合：** 为刷新全球机器学习模型（即下一步），服务器聚合贡献者提供的足够多的本地训练模型。为防止服务器访问敏感的机器学习模型因子，必须在聚合过程中融入隐私保护措施。这些策略包括安全聚合、差分隐私和前沿加密协议。\n\
  \n4.  **修订后的全局模型：** 服务器随后使用步骤 3 中的组合模型因子更新当前的全局机器学习模型。后续训练轮次的参与者将获得此修订后的全局模型。\n\n\
  ```\n![Figure 2. The four-stage cycle of a centralized FL workflow.](img/fig5_2_B.jpg)\n\
  ```\n\n图 2. 中心化 FL 工作流的四阶段周期。\n\n需要多次迭代这一 4 阶段过程才能产出可靠的全局模型。注意，并非每次训练都需要周期的四个步骤。可利用异步\
  \ SGD 策略，基于训练结果快速更新本地模型，而无需等待其他参与者的更新。这种优化更新速率的异步方法，常用于大数据集上深度学习模型的分布式训练。借助聚合压缩、基于\
  \ SMC 的安全聚合和差分隐私等前沿工具，同步方法在 FL 语境下相较于异步方法具有显著优势，特别是在通信效率和安全性方面。这种协调需要使用中心服务器。\n\n\
  ### 4. 用于隐私保护的中心化 FL 框架\n\n传统机器学习方法要求在设备间共享训练数据和计算，而 FL 允许在不损害隐私的前提下协同训练机器学习模型。即使私密信息未直接传输给协调服务器，本地机器学习模型仍在其参数中保留了训练数据样本的某些方面。例如，文献\
  \ [[32]](#ch5.xhtml#ref5_32) 的作者表明，利用训练数据暴露的隐藏相关性，可从训练模型中提取敏感信息。正如文献 [[19]](#ch5.xhtml#ref5_19)\
  \ 作者指出的，现代深度学习模型隐藏了许多方面的内部表征，其中一些与当前任务无关。这些偶然特征可推断出关于训练集的数据。由于依赖推理，FL 系统易受成员推理攻击和重构攻击等推理攻击。协调服务器向本地节点提供全局训练模型的中间阶段访问权限。在采用中心化\
  \ FL 框架前，应研究安全模型并仔细考虑隐私保障，因为这为恶意行为者通过提供任意更新污染全局模型从而影响训练过程敞开了大门。联邦学习系统内需要额外的保密和隐私措施，以确保敏感数据安全并符合《通用数据保护条例》等严格的数据保护标准。我们将梳理针对中心化\
  \ FL 的各类攻击及其采用的各种隐私保护技术。\n\n#### 4.1 隐私保护方案中的协调服务器\n\n大多数现代隐私保护 FL 系统解决方案建立在最先进的加密协议（如\
  \ SMC 和差分隐私）基础之上。\n\n\n\n# 为防止 (i) 服务器内部人员发起推理攻击以及 (ii) 拜占庭参与者进行模型投毒，服务器上实施了多种技术。针对推理攻击的安全性，版本\
  \ 4.3.1。\n\n在全局模型训练期间，开发了许多服务器端策略来应对推理攻击，并防止协调服务器检查单个用户提供的因子。特别是，客户端发送的参数可以使用 `Secure\
  \ Aggregate` 协议进行加密，该协议构建在 `SMC` 之上。`SMC` 是协议的第一步，因为它加密模型参数，以便用户在不泄露各自贡献的情况下对其进行平均。参与者和协调服务器进行四轮交互：第一轮涉及公钥分发，第二轮涉及客户端侧掩码输入的计算，第三轮涉及确保至少有\
  \ `t` 个参与者正在训练同一模型，第四轮涉及去掩码（第 4 轮）。\n\n仅当服务器是恶意时，协议的第三轮才是必要的；如果服务器只是好奇（honest-but-curious），则可以跳过。由于使用此协议，客户端和中央协调服务器必须处理更多的通信开销和更高的计算复杂度。值得一提的是，Google\
  \ 的 `Tensor Flow Federated` 框架提供了 `Secure Aggregation` 的实现，可用于联邦学习的研究和实际实验。为了使 `SGD`\
  \ 运行并提供全局模型更新，只需按照 `Secure Aggregation` 过程对一部分参与者的本地模型权重进行平均即可。因此，协调服务器不必收集特定于参与者的本地更新。结果，服务器将无法基于用户数据发起推理攻击。`Secure\
  \ Aggregation` 协议结合 `Federated Averaging`，允许在信任受限的服务器上安全执行 `SGD`，具有更强的容错能力和更低的通信成本。不过，这种方法仅适用于参与者可信的环境。在处理拜占庭参与者时（例如他们与流氓服务器串通以泄露客户端输入），无法保证协议的可用性或准确性。\n\
  \n#### 4.2 本地节点隐私保护解决方案\n\n为防止协调服务器上的内部攻击者执行推理攻击导致隐私泄露，必须在本地节点和服务器上均启用 `Secure Aggregation`。我们基于\
  \ `SMC` 的联邦学习多方深度学习聚合方法，通过对所有参与者本地模型参数进行同态加密而成为可能。当收集到足够的本地模型后，加密的全局模型被传输给协调服务器。这保证了所有全局模型贡献者的机密性得以维持。本地节点可使用扰动策略保持最新模型参数和原始训练数据集的机密性，该策略旨在挫败协调服务器和其他攻击者的泄露企图。在与其他节点共享模型之前，可在每个节点本地使用扰动技术来隐藏模型的某些部分。即使掌握了这些模型参数，攻击者仍无法成功重建原始训练数据或获取任何有用信息。\n\
  \n换句话说，扰动技术有潜力阻止针对客户端本地训练模型的推理攻击。`差分隐私` 是实现这一目标的流行方法；它涉及向训练数据或模型参数引入随机变化。在联邦学习出现之前，通过\
  \ `SMC` 实现的 `差分隐私` 被作为一种安全集成独立训练神经网络的方法提出。此后，该方法已得到完善，以至于不同参与者的结果在统计上相似，且外部噪声对整体模型精度的影响微乎其微。由于攻击者在联邦学习训练期间无法区分个别记录，敏感数据得到保护，推理攻击得以避免。联邦学习环境中的本地节点可在两个不同层面受益于\
  \ `差分隐私` 技术：批次层面，基于小批量数据点的参数敏感性分析生成随机噪声；用户层面，由用户自己生成噪声。\n\n### 5. 集中式联邦学习系统中的 GDPR\
  \ 合规性\n\n联邦学习是一种通过将模型聚合卸载到第三方服务器来解决基于机器学习应用中隐私问题的创新方法。与集中式机器学习方法相比，联邦学习已被证明能更好地保护用户隐私。在训练机器学习模型时，它允许用户将训练数据保存在其设备上。为了改进全局模型，从本地训练模型中发送最相关的参数到协调服务器。即便如此，此类模型参数仍包含某些私有特征，可能被用于重建或推断重要个人数据。因此，联邦学习系统仍有责任遵守并遵循\
  \ `通用数据保护条例` 的要求。在本部分中，我们将逐一审视每一条 GDPR 规则，判断其在联邦学习场景下是否相关且必须遵守，抑或可以忽略。将重点强调并分析完全合规\
  \ GDPR 面临的挑战。\n\n#### 5.1 角色与义务\n\n`通用数据保护条例` (GDPR) 在数据保护立法框架内确立了“数据主体”、“数据控制者”和“数据处理者”的含义。在\
  \ `数据控制者` 披露符合 GDPR 的处理目的和方式之前，`数据处理者` 不得开始处理个人数据。此外，`数据控制者` 必须采取适当措施，告知 `数据主体`\
  \ 其个人数据将如何被安全且私密地传输和处理。`通用数据保护条例` 保障个人享有“知情权”、“访问权”和“被遗忘权”。正如 表 1 所示，联邦学习语境下的数据点不被视为离散样本，而是区域模型中的变量。\n\
  \n表 1. GDPR 在各类服务中的角色。\n\n| GDPR 角色 | | 集中式联邦学习 | | 传统机器学习 |\n| --- | --- | ---\
  \ | --- | --- |\n| 数据处理者 | | 服务受益方 | | 服务受益方、第三方 |\n| --- | --- | --- | --- | ---\
  \ |\n| 数据控制者 | | 服务受益方 | | 服务受益方 |\n| 数据主体 | | 最终用户 | | 最终用户 |\n| 个人数据 | | 本地模型因子\
  \ | | 原始训练数据 |\n\n例如，在步骤 1 中，服务提供者指示用户在其本地训练数据上训练机器学习模型并共享该本地训练模型；在步骤 (ii) 中，服务提供者处理从用户发送来的本地模型参数；在步骤\
  \ (iii) 中，服务提供者向所有用户分发全局模型并请求他们更新本地模型。在集中式联邦学习环境中，服务提供者可能只能访问一个全局的、匿名的、因此非协作的机器学习模型。因此，数据处理者是唯一的服务提供者，也是此类情况下唯一能够提供联邦学习的实体。由于联邦学习专注于累积本地机器学习模型并更新全局机器学习模型，其处理方法实现起来要容易得多。\n\
  \n#### 5.2 GDPR 原则\n\n\n\n\n# GDPR 原则与联邦学习系统\n\n图 3 描绘了《通用数据保护条例》（GDPR）确立的六项原则，作为服务提供商管理个人数据的合理指引。要求数据控制者承担遵守这些原则的责任，并建立适当机制以保证合规的注意义务，这与\
  \ 1998 年《数据保护法》的规定惊人地相似。\n\n![图 3. GDPR 基本原则。](img/fig5_3_B.jpg)\n\n图 3. GDPR 基本原则。\n\
  \n## 5.2.1 合法性、公平性与透明性\n\n作为首条规则，联邦学习应用的服务提供商（作为数据控制者）必须解释其终端用户为何必须接受联邦学习训练。《通用数据保护条例》（GDPR）规定了处理个人数据的六种法律依据：同意、履行合同、法定义务、\
  \ vital interests（重大利益）、公共利益/公职权力行使以及合法权益。某些类型的特殊类别数据，例如与个人健康、基因构成或种族/民族相关的数据，可能要求在满足该法律依据之外，还需满足额外要求，方能合法处理。在开始任何个人数据处理之前，应考虑处理的具体目的和情境，选择并记录最合适的一种。\n\
  \n在联邦学习系统中，协调服务器无法访问用户设备以获取原始训练数据或本地构建的机器学习模型。相反，当用户准备好时，会通过向协调服务器通报其发现（即模型更新），从而更深度地投入到联邦学习系统中。联邦学习客户端应用的用户应能在其认为最方便的任何环境中进行训练，无论是在本地，还是通过向基于服务器的机器学习模型推送和拉取变更。此外，联邦学习系统仅为预定目的处理数据，以客户合理预期的方式进行，且对隐私影响可忽略不计。换言之，联邦学习应用可通过获取申请人的许可或证明存在合法权益来证明其正当性。在采用深度学习等\
  \ AI/ML 方法时，由于缺乏对数据样本偏见和训练过程的理解，透明度标准通常难以满足。联邦学习系统也不例外。\n\n如果机器学习系统（包括联邦学习）输入了有偏见的训练数据，系统极有可能返回有偏见的结果。当训练好的模型用于全自动决策系统时，可能会产生不公平且有偏见的结果。联邦学习系统的一个问题在于安全聚合，它阻止服务提供商访问原始训练数据集，也阻止用户验证其本地训练的机器学习模型。因此，联邦学习系统难以公开地执行训练活动，并保证系统做出的任何自动判断的正确性。结果，所有联邦学习解决方案都变得不可行，且无法满足\
  \ GDPR 强制要求的公平性和公开性。这些悬而未决的问题要求对 AI/ML 算法的可解释性、偏见和公开性进行更多研究，从而呼吁放宽 GDPR 监管机构对 AI/ML（包括联邦学习）的规定。满足这一\
  \ GDPR 要求的一种可能途径，是开发天然可解释、能促进负责任的机器学习治理的机器学习模型和算法。\n\n## 5.2.2 目的限制\n\n为遵守目的限制原则，联邦学习服务提供商必须向客户明确清楚地说明为何以及如何将其个人数据和算力发送至服务提供商的服务器，以训练全局机器学习模型。根据这一概念，服务提供商可将信息用于任何合理目的。为使联邦学习系统完全符合这些原则，它们必须能够直接纳入可接受的隐私保护技术，如安全聚合和差分隐私。这是因为协调服务器无法提取和使用客户端本地训练的机器学习模型，除非用于全局模型更新。恶意服务提供商或拜占庭节点植入的隐藏后门模型，可导致未经授权的训练。由于中心化联邦学习使用安全聚合，不存在服务端模型异常检测解决方案来防御此类攻击；因此，任何联邦学习系统要实现完全符合\
  \ GDPR 仍然存在问题。\n\n## 5.2.3 数据最小化\n\nGDPR 要求“数据控制者”（包括服务提供商）仅收集和处理针对特定、明确和合法目的所必需的充分个人数据。数据最小化对传统中心化机器学习算法构成挑战，因为很难预先知道成功训练特定机器学习模型需要什么数据以及需要多少数据。与需要用户持续收集和分析新训练数据的传统机器学习系统不同，联邦学习仅要求服务提供商从参与者处获取本地机器学习模型。当联邦学习系统采用隐私保护方法时，协调服务器可能仅收集参与者本地模型参数的平均值，用于全局模型改进。聚合方法进一步保证全局模型不包含任何敌人可用于非法目的的个人身份信息。旨在引入未经授权目的的后门攻击，之所以成为可能，是因为目的限制原则。结果，为实现预期目标，从参与者处收集的本地机器学习模型的最小参数集，现在对于预期目标而言过大，而对于未经授权的副任务而言又过小。这种植入的副任务是联邦学习系统未解的难题，因为它可能被用来泄露参与者的私人信息。\n\
  \n#### 5.3 案例研究\n\nGDPR 要求数据控制者在可能的情况下，向数据主体提供以下权利：\n\n1.  知情权\n2.  访问权\n3.  更正权\n\
  4.  删除权（被遗忘权）\n5.  限制处理权\n6.  数据可携带权\n7.  异议权\n8.  关于自动化决策和画像的权利。\n\n##### 5.3.1\
  \ 知情权\n\n要求数据控制者简单明了地披露联邦学习训练的性质和目标、所用的本地机器学习模型以及流程的预期结果，这使得满足数据主体的这项权利变得具有挑战性。联邦学习是一个黑箱模型，这使得像许多其他复杂的机器学习过程一样，无法理解其工作原理，也无法以任何确定程度预测其输出。由于联邦学习系统的条款和条件可以说明为何使用客户端的本地机器学习模型（即构建全局机器学习模型）、何时不使用该数据（即每个训练周期结束后）以及谁有权访问它，因此它满足了知情权（仅协调服务器）。\n\
  \n##### 5.3.2 自动化决策与画像\n\n\n\n\n\n## 通用数据保护条例保障个人享有“不受仅基于自动化处理（包括画像）的决定约束的权利”\n\n\
  如果联邦学习（FL）客户有理由相信自动化决策系统中使用的处理可能会产生涉及该客户的法律效力，或以类似方式显著影响该客户，则该客户有权获得告知，并以一种可理解且不过度技术化的方式解释任何疑虑。由于运行模型是一个黑箱，且机器学习（包括联邦学习）的训练过程不公开（例如联邦学习中的全局机器学习模型），因此无法解释相关发现。这使得难以预测数据主体的环境、行为或选择可能如何受机器学习模型结果的影响，或数据主体的法律地位或法律权利可能如何受影响。因此，没有任何联邦学习系统能满足\
  \ GDPR 承诺的提供人类对自动化决策进行控制的要求。当告知数据主体其关于自动化决策和画像的权利将不被尊重时，数据控制者无需遵守知情权。\n\n#### 5.4\
  \ 调查与证明\n\n根据 GDPR，在每个成员国设立了被称为数据保护机构的独立政府机构作为监管机构（DPA）。遵守数据保护法律的举证责任在于数据控制者，而 DPA\
  \ 负责监控和评估数据控制者的行为以确保合规。这些都是敏锐的问题：DPA 如何调查和评估联邦学习设置，以及如何证明合规性？\n\n##### 5.4.1 DPA\
  \ 监督的职权\n\n如图 4 所示，DPA 对消费者的怀疑或不合规指控进行调查，并确定适当的处罚。组织的合规审计将揭示是否已进行数据保护影响评估（DPIA）和隐私影响评估（PIA），从而满足《通用数据保护条例》（GDPR）的一项要求。未能遵守《通用数据保护条例》（GDPR）的企业将面临严厉处罚，包括最高\
  \ 2000 万欧元或全球年营业额 4% 的罚款（以较高者为准），以及可能的公开谴责、被相关市场排除，甚至暂停运营。在确定适当处罚时，除 GDPR 明确规定的其他因素外，还将考虑调查期间表现出的合作程度；当前侵权行为的性质、严重程度和持续时间；是否存在任何先前的违规行为；以及是否存在任何先前的违规行为。法律规定，这些公司敦促客户勾选一个小框，表示同意公司的隐私政策，以换取获得所提供服务的权限。\n\
  \n![图 4. GDPR 合规检查和处罚程序的工作流程。](img/fig5_4_B.jpg)\n\n图 4. GDPR 合规检查和处罚程序的工作流程。\n\n\
  据数据隐私专家称，这种做法直接违反了《通用数据保护条例》。维基百科第 13 条列出了与 GDPR 相关的处罚和通知（包括不合规的原因）。DPA 可能会要求提供与满足\
  \ GDPR 标准相关的组织和技术措施的证据，以及控制者进行的独立 DPIA 和 PIA 报告。数据保护机构可能还需要访问存放任何已处理个人数据的服务器的底层技术和管理程序。联邦学习服务提供商只能通过提供最终用户同意的证据和隐私保护技术防护措施（如同态加密、安全聚合和差分隐私）来证明符合法律要求。任何联邦学习系统在回答\
  \ DPA 要求访问训练数据或检查单个用户本地模型参数的问题时也会举步维艰。\n\n##### 5.4.2 合规性证明\n\n为了建立并展示 GDPR 合规性，基于\
  \ AI/ML 的服务提供商应从项目一开始就进行 DPIA 和 PIA，并妥善记录程序。数据安全和隐私风险评估对于证明合规性、有效管理风险以及确定已采取何种行动来减轻此类风险至关重要。然而，并非每项数据处理活动都需要进行\
  \ DPIA 或 PIA。如果该操作“可能导致自然人的权利和自由面临高风险”，（NS/ > (1)），则需要获得受影响者的同意。DPA 必须遵循 DPA 法案第\
  \ (3)、35(4) 条所述标准进行 DPIA 和 PIA。所有联邦学习服务提供商应执行以下 DPIA/PIA 程序，以实现 GDPR 合规并按 DPA 要求证明合规性：\n\
  \n1.  处理数据所涉及的步骤、其相关目标，以及对这些步骤的解释和理由。例如，记录机器学习模型参数如何传输到协调服务器，以及如何请求数据主体允许本地机器学习训练，这很重要。\n\
  \n2.  结合其目标，分析每个程序的相关性和适当性。例如，虽然差分隐私技术并非绝对必要，但实施安全聚合机制是必要的。\n\n3.  必须评估每项操作对数据安全和隐私的潜在影响，以及用于解决此类问题的任何技术步骤。例如，在联邦学习系统中，将参数从本地机器学习模型发送到组织服务器以增强通用机器学习模型时，推理攻击可能会导致隐私问题。白皮书中描述的方法利用了安全聚合和同态加密。即使采取了这些额外的用户隐私预防措施，联邦学习系统仍存在漏洞，可能因隐藏子任务导致模型破坏等恶意原因而受到攻击。防止此类攻击以避免潜在违反《通用数据保护条例》至关重要。\n\
  \n由于联邦学习建立在不透明的机器学习模型之上，与其他基于 AI/ML 的系统类似，服务提供商和 DPA 都难以理解和审计联邦学习。因此，对联邦学习系统进行 DPIA/PIA\
  \ 似乎流于表面，需要付出巨大努力来识别违反要求的行为，从而实现更安全的操作和更严格的隐私保护。\n\n### 6. 结论\n\n\n\n\n\n# 联邦学习中的隐私保护与\
  \ GDPR 合规性分析\n\nAI 和基于 ML 的应用程序及服务的创建是许多行业的主要关注点。然而，随着个人数据的不受控制地扩散，对数据隐私的担忧日益加剧。在\
  \ Facebook 的剑桥分析公司丑闻和 SARS-CoV-2 疫情等高调数据泄露事件之后，算法偏见、伦理、政治后果和法律问责等问题引起了广泛关注。对于“数据饥渴”的人工智能/机器学习系统而言，联邦学习（FL）为高效的隐私保护方法提供了一个可行的解决方案。通过将最终用户设备上的数据存储和处理与服务器端的数据聚合解耦，FL\
  \ 使消费者能够重新获得对其数据的完全所有权，并使其比集中式系统更不易受到大规模数据泄露的影响。尽管 FL 仍处于起步阶段，但如 FL 系统中那样采用去中心化数据存储的协作计算带来了巨大的优势，使各种基于\
  \ AI/ML 的应用程序能够在无需直接访问最终用户数据的情况下得以实现。FL 系统必须遵守《通用数据保护条例》（GDPR）和其他严格的隐私规则。\n\n由于本地训练的\
  \ ML 模型参数隐藏了可能被利用来推断最终用户个人信息的敏感元素，因此它们是满足 GDPR 法定数据保护框架的本地处理结果的一个示例。因此，如果 FL 系统容易受到推理攻击和模型投毒等攻击，则可能违反\
  \ GDPR 的隐私标准。系统需要结合足够的隐私保护措施，如加密迁移学习、差分隐私和安全多方计算（SMC）。我们讨论了 FL 系统中潜在的安全模型、风险和隐私保护方法，并考察了它们在防止信息泄露方面的有效性。还对\
  \ FL 系统的 GDPR 合规性进行了深入分析。遵循 GDPR 六大原则的逻辑规则，本文深入分析了服务提供商的义务，以及设计符合 GDPR 的 FL 系统的适当步骤。由于\
  \ FL 仍处于起步阶段，大量的多学科/跨学科研究才刚刚开始，以确保其最终成功和 GDPR 合规。\n\n首先，分布式协作学习需要改进的加密和隐私基元，特别是用于避免模型投毒和推理攻击。由于安全多方计算（SMC）等隐私保护技术具有非平凡的性能开销，因此需要更多研究来探索在\
  \ FL 应用中使用这些技术的最高效方式。其次，必须对 FL 系统的开放性、可解释性和算法公平性进行广泛研究。虽然在集中式环境下 AI 和 ML 取得了很大进展，但它们在去中心化环境中的适用性——即训练数据分布在多个服务器上——仍是一个开放课题。\n\
  \n重要的是要研究有限样本量如何影响全局训练模型偏差，以及如何减轻这种偏差。例如，不可知联邦学习框架将目标分布建模为各分布的不确定混合，因此它始终提供善意公平性，而其他\
  \ FL 训练方法则使用均匀分布。这种 FL 结构消除了训练阶段产生偏差的可能性。第三，为了将最先进的加密方法进一步集成到 FL 系统中，需要更多研究可解释且无偏见的\
  \ ML 模型和算法，以便应用于加密环境中。此外，调查 FL 框架中隐私、准确性、可解释性和公平性固有的权衡至关重要。如果满足这些前提条件，用户和政治家（如 GDPR\
  \ 监管机构）将更容易接受安全的去中心化协作学习解决方案。\n\n### 参考文献\n\n1.  Eva, G., Liese, G., Stephanie,\
