  \ 1. General Federated Learning architecture.**\n\nFigure 2 探讨了 FL 设计如何在医疗环境中使用。本地数据更新被聚合，并使用\
  \ ML 构建训练模型。遗憾的是，仍有一些重大障碍阻碍 FL 在其他语境中完全集成，特别是关于数据方面。甚至数据本身也难以管理，因为信息内部通常存在大量多样性，包括材料、框架和下载格式。\n\
  \n![Figure 2. Federated Learning architecture in a clinic.](img/fig7_2_B.jpg)\n\n\
  Figure 2. Federated Learning architecture in a clinic.\n\n## 4. 利用 FL 技术提高效率\n\n\
  有几种常用策略和算法需要理解以掌握 FL。\n\n### 联邦学习分类\n\n1.  **中心化联邦学习**：中心化联邦学习运行需要一个重要的服务器。它规划初始客户端设备选择并在训练期间收集模型更新。仅特定边缘设备与中央服务器交换数据。\n\
  \n2.  **去中心化联邦学习**：去中心化联邦学习可在没有中央服务器的情况下协调。相反，仅将更新后的模型提供给连接的边缘设备。最终模型通过在边缘设备上合并所有链接边缘过程的本地学习来构建。\n\
  \n3.  **异构联邦学习**：异构联邦学习需要使用混合客户端，包括手机、笔记本电脑或物联网设备。这些设备可能具有不同的硬件、软件、处理能力和数据类型。\n\n\
  ### 联邦学习算法\n\n\n\n\n# 联邦学习算法\n\n## 1. 联邦随机梯度下降\n\n传统 SGD 使用来自完整样本集（称为小批量）的数据样本子集来计算梯度。在联邦环境中，这些小批量可以与拥有本地数据的多个客户端进行比较。客户端可以使用\
  \ FedSGD 访问主模型，并使用本地数据独立生成梯度。中央服务器在接收这些梯度后，根据每个客户端的样本数量对其进行聚合，以确定梯度下降步长。\n\n## 2.\
  \ 联邦平均\n\n联邦平均扩展了 FedSGD 算法。客户端可以运行多次本地梯度下降更新。共享给核心全局系统的是调整后的本地模型权重，而非其梯度。然后在全局服务器上对来自客户端的权重（模型参数）进行平均。联邦平均是\
  \ FedSGD 的一种改进，如果所有客户端都从同一基线开始，则聚合权重等同于聚合梯度。\n\n## 3. 动态正则化联邦学习\n\n在传统机器学习方法中，通过向损失函数添加惩罚项，正则化旨在提高泛化能力。在联邦学习中，必须将来自多个设备的本地损失相结合以确定总体损失。由于客户端的异构性，最小化全局损失不同于最小化本地损失。FedDyn\
  \ 技术响应数据量或传输成本等数据属性，为本地损失创建正则化项。动态正则化修改本地损失，使其收敛到全局损失。HeteroFL 的开发是为了应对那些假设本地模型架构与全局模型架构相对应的知名联邦学习方法。然而，这种情况并不常见。HeteroFL\
  \ 可以在跨多个本地模型训练后，为推理提供单一全局模型。\n\n该策略消除了单点故障的可能性，但边缘设备的网络架构完全决定了模型的准确性。尽管这种方法似乎简单直接且能生成精确模型，但中央服务器存在瓶颈问题——网络问题可能会中断整个过程。以模型为中心和以数据为中心的联邦机器学习是两种基本形式。从当今更普遍的以模型为中心的方法开始。\n\
  \n联邦学习旨在回答一个关键问题：“我们能否在不将数据传输到中心位置的情况下训练模型？”总体而言，联邦学习在保护隐私的同时，实现了简单的信息查看和交换。\n\n\
  ### 私有联邦学习系统\n\n私有联邦学习系统中存在少量重要的计算密集型和数据密集型组件。私有联邦学习系统必须找到一种方法将计算迁移到数据中心，同时仍遵守严格的法规。\n\
  \n### 公共联邦学习系统\n\n尽管拥有许多实体，公共联邦学习系统仅拥有少量数据和处理能力。\n\n## 云边协同联邦学习的关键技术\n\n将联邦学习集成到交互式云边设计中的一项重要技术。\n\
  \n### 通信\n\n跨设备联邦学习要求客户端执行多轮通信以使模型收敛，尽管客户端可以更有效地与边缘服务器连接。客户端可能需要为此花费资源进行训练，由此产生的通信延迟是不可取的\
  \ [[14]](#ch7.xhtml#ref7_14)。因此，对于在云边协同设计中实施联邦学习，普遍认为确保成功通信是一项关键技术。我们的研究使我们找到了四种实现成功交互的有效策略：\n\
  \n*   **边缘计算**\n*   **聚合控制**\n*   **模型压缩**\n*   **隐私与安全**\n\n大多数基于云的联邦学习框架中最常见的两个假设是：(i)\
  \ 联邦学习中使用的客户端和边缘服务器都是可信设备。它们完全遵守联邦学习管理者的要求。(ii) 任何个人都没有其他客户端数据的副本。如果不考虑这两个假设，就无法在云边协同设计中建立可信的联邦学习结构，这可能导致隐私泄露和无法防御恶意攻击，扰乱社会系统并对客户端产生负面影响。云边协作范式可能无法完全信任边缘服务器和客户端，恶意攻击者可以轻松参与联邦学习。私密和保密解决方案对于联邦学习的成功部署至关重要。\n\
  \n### 个性化\n\n当本地数据集太小，无法训练出高精度模型时，客户端选择参与联邦学习，总体目标是改进模型。这给隐私带来了压力，并消耗了通信和计算资源。然而，在某些情况下，例如当跨孤岛联邦学习的个人贡献者拥有大型数据集时，本地生成模型的准确性可能优于组合模型\
  \ [[18]](#ch7.xhtml#ref7_18)。模型异构性意味着不同客户端可能对模型有不同的需求。例如，在词预测任务中，多个个体输入相同的 \"I like...\"\
  \ 无疑会期望不同的预测结果。基本定制策略在一定程度上有助于解决模型异构性问题。以下是可应用于云边协同架构的几种个性化联邦学习 (PFL) 方法列表：\n\n\
  *   **元学习**\n*   **迁移学习**\n\n### 联邦学习在交互式云边架构中的机遇\n\n*   用于计算卸载的联邦学习\n*   用于边缘缓存的联邦学习\n\
  *   车联网\n*   医疗\n*   网络安全\n\n### 交互式云边架构中联邦学习部署的困难与未来研究目标\n\n#### 异常值/离群点\n\n在边缘联邦学习中，每个训练会话都会选择一组边缘设备。客户端选择方法用于为每个客户端开发专属模型。然而，这些方法都假设每个客户端都能持续连接到边缘服务器。由于这些设备能耗低且其连接环境不断变化，边缘设备在训练过程中容易断开连接。这些脱离的客户端通常被称为离群点。先前关于处理离群点的大量研究侧重于在离群点数量较少时维持训练，但它们无法处理大量离群点，且联邦学习的有效性将显著降低。\n\
  \n#### 聚合\n\n模型聚合是最重要的联邦学习操作之一，直接影响训练质量。联邦学习环境中常见的简化聚合无法管理复杂的云边协同架构。尽管 (i) 处理受损更新已受到一些关注，(ii)\
  \ 避免强制升级。仍需进一步研究稳健的联邦学习聚合，包括考虑可访问性收集以及额外的保障积累。\n\n#### 激励机制\n\n\n\n\n在可行的联邦学习中，利用本地客户端记录进行处理器建模可能会产生极其准确的内容，这具有经济优势。然而，鉴于学习过程包含了他们的个人信息，而人们对此愈发重视，因此很难设计激励系统来说服用户参与联邦学习。目前，联邦学习激励结构的设计采用了博弈论和经济学理论的技术，但由于主观性主导现实世界，它们的有效性仅在模拟测试中得到保证。\n\
  \n### vi 迁移\n\n由于在使用移动边缘计算时难以确定边缘设备的确切位置，它经常连接到附近的边缘服务器，从而引发问题。当新的边缘服务器连接到边缘设备时，训练会中断，网络性能显著下降。这是由于新边缘服务器缺乏之前训练的副本。教育的持续性是一个关键的研究课题。已经有许多研究针对边缘计算中的服务迁移进行了探讨。然而，在边缘联邦学习中，模型体量巨大。在边缘服务器之间传输模型副本的显著延迟会对联邦学习的性能产生不利影响，这使得在云边协作环境中进行有效的服务迁移成为必要。\n\
  \n### vii 异步性\n\n大多数当前研究采用联邦学习的同步聚合选项。在真实的网络环境中，用户的电量储备和网络质量会发生变化。由于资源限制，边缘节点难以继续训练，尤其是采用传统的同步方法时。为了克服这一问题，已经投入了大量工作来开发高效的异步联邦学习算法。\n\
  \n### viii 隐私问题\n\n然而，由于资源限制，联邦学习系统的隐私保护功能可能不适用于所有设备。因此，需要创造新的方法，在提供强有力的隐私保证的同时，兼顾通信高效、计算具成本效益，并能应对参与者减少的情况。许多研究聚焦于处理能力不足的外围设备所面临的问题。由于可能影响这些设备的计算能力，在此环境下利用高级加密和通信安全是不可行的。\n\
  \n### ix 可扩展性\n\n联邦学习方法必须具有高度可扩展性。在物联网生态系统中，许多客户可能参与原型训练。在联邦学习过程中，确保系统具有可扩展性也很重要。由于不同因素，如信号微弱、电池寿命短或质量差（如手持设备），当有许多其他客户端时，某些客户端可能会失去与服务器的连接。确保系统能够处理此类情况至关重要。联邦学习可保护数据隐私，可用于利用网络边缘设备庞大且多样的数据集以及不断扩展的处理能力来训练机器学习模型。隐私至关重要，因为金融和医疗应用程序本质上高度敏感，共享此类数据通常不可行\
  \ [19]。尽管已有少数联邦学习在商业环境中成功运行的实例，但在这些设计广泛应用于日常应用之前，仍需进行大量研究。由于对私人信息安全的担忧，以及手机、可穿戴设备和自动驾驶汽车等设备计算能力的增强，联邦学习已成为一个前沿框架。专家们因对本地信息存储需求的增加以及将机器学习计算迁移到终端设备同时减少数据传输开销的趋势，已多次尝试构建联邦学习系统。\n\
  \n### 5. 结论\n\n尽管联邦学习仍处于起步阶段，但它无疑将在保护数据隐私方面使许多行业受益。连接性是联邦学习网络中的一个重大障碍，因为每个设备上收集的信息都保持私有。开发通信高效的策略以减少通信轮数总数至关重要。联邦学习解决方案还必须考虑到最低用户参与度，因为在任何给定时间仅有一部分设备在运行。联邦学习应用和混合架构常被设想为未来网络基础设施的关键组成。尽管影子边缘协作和联邦学习目前都是著名的学术课题，但关于如何将它们集成到影子边缘协作设计中的研究却不多。通过仔细分析在影子边缘联合设计中实施联邦学习的关键技能、经验和用例，本研究旨在缩小知识差距。它还为进一步研究提供了建议。联邦学习比直接的中心化机器学习更无害，且能处理数据孤岛，但并非总是成功。系统异质性、模型异质性和数据异质性是联邦学习面临的最大问题。当易于获取的本地数据不能准确反映全局分布时，就会出现统计差异。联邦学习参与者经常面临不同的网络、能源、处理和存储容量条件。这就是所谓的系统多样性。由于大多数联邦学习设置是同步的，收敛可能会延迟，且某些设备可能没有资源快速恢复本地更新。模型异质性常发生于联邦学习中的\
  \ B2B 关系，因为不同客户可能基于不同假设提出不同的模型需求。此外，许多早期的联邦学习算法给其客户的真诚性带来了安全威胁。\n\n鉴于上述问题，一些客户可能会觉得联邦学习训练的模型不如他们的本地模型，从而阻碍他们参与训练。综上所述，联邦学习的创建对于高度依赖处理统计异质性、系统异质性、模型异质性和安全管理等问题的物联网\
  \ (IoT) 应用至关重要，因为在这些应用中统计变异更为常见。然而，这些联邦学习技术在防止云环境中的数据丢失方面，对研究社区极具价值。\n\n### 参考文献\n\
