  \ 产生 92% 的正确值，优于现有方法。\n\n![图 5. 精确率性能。](img/fig11_5_C.jpg)\n\n图 5. 精确率性能。\n\n$$Recall\
  \ = \\frac{TP}{TP + FP} \\times 100$$\n\n这是衡量针对该类别的总输入特征数，正确类别预测的数量，如图 6 所示。对于包含比先前算法更好结果的建议方法，这表明分类器在召回率计算中的完整性。\n\
  \n![图 6. 召回率性能。](img/fig11_6_C.jpg)\n\n图 6. 召回率性能。\n\n不同方法产生的疾病预测准确率对比见图 7。与使用其他方法相比，使用\
  \ LSTM-CNN 算法在每个类别中预测疾病具有更高的准确率。\n\n![图 7. 错误分类率分析。](img/fig11_7_B.jpg)\n\n图 7.\
  \ 错误分类率分析。\n\n### 5. 结论\n\n总之，基于深度谱时变特征分析模型和 Softmax LSTM-CNN 的心脏病预测联邦学习产生了最佳预测准确率。所提出的系统分析心脏病影响率\
  \ (CDIR)，根据边际准确率选择心脏特征。这减少了大数据维度问题，使在循环神经网络上训练的特征成为最佳训练特征。结果因素证明，就心脏病影响率而言，实现了高达\
  \ 97% 的最佳分类准确率。这支持了一种更好的早期风险疾病预测方式，以便进行早期治疗，减少心脏病发作。\n\n### 参考文献\n\n1. Arpaia, P.,\
