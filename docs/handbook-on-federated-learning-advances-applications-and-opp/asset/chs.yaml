  \ 章 基于加密参数聚合的安全隐私联邦学习\n\n*K Vijayalakshmi*,^(⁴)\n\n电子邮箱：sitharselvam@gmail.com;\
  \ thamarai.panimalar@gmail.com; ashok.j@christuniversity.in; gsathishit@smec.ac.in;\
  \ kannanarchieves@gmail.com\n\n### 1. 介绍\n\n\n\n\n\n# 集中式与联邦式环境中的 ML/DL\n\nML/DL\
  \ 在各种应用领域均展现出良好的效果，尤其是当海量数据汇聚在一个位置时，例如数据中心或云服务 [1]。但如果数据由（第三方）云服务集中收集和存储，一旦发生数据泄露，公司（云服务客户）可能面临巨大的法律责任\
  \ [2, 3]。在处理人们的健康信息、对话、私人住宅录像、资金转账及其他此类事务时，这一点尤为重要 [4]。数据上传后，“失控”是集中式数据收集的常见问题。云服务是否按宣传方式使用数据？这是一个常见问题，却令人沮丧。文件真的会在声称删除时被擦除吗？由于政府法规，即使未被隐私泄露和失控风险说服的企业，也限制了与外部提供商共享的数据量（如\
  \ HIPAA 和 GDPR）。\n\nFL 的目标是在最小化 ML/DL 模型缺点的同时提升其质量。FL 任务的参与设备规模跨度极大，从单个智能手机或手表，到拥有多数据中心的全球性企业\
  \ [5, 6]。当需要在来自多个“本地”实体的数据上训练单个 ML/DL 模型时，FL 便显得必要。该过程生成一组“本地模型”，随后通过仅交换少量参数（如神经网络中的模型权重）即可将其整合，实现极小的数据损耗\
  \ [7]。FL 算法主要分为两大类：集中式和去中心化。同样，需要一个协调者将众多区域模型的信息汇编成统一的全局模型（覆盖式组播、广播等） [8, 9]。\n\n\
  最初人们认为，随着 FL 交互的进行，仅有极少量关于原始训练数据的信息会延续至后续的模型更新中 [10]。基于此，认为模型更新的传播具有“隐私保护”性。无论如何，模型更新中仍残留着训练数据的痕迹，即便这并不显而易见。近期研究表明，利用模型变化即可推断私有特征并重构大量训练数据，这让\
  \ FL 的隐私保证受到质疑。即使面对诚实但好奇的聚合服务器，此情况依然成立。\n\n### 2. 假设与关注点\n\n常见的联邦学习部署有两种：跨设备和跨孤岛\
  \ [11]。在跨设备场景中，参与者众多（超过一千），但每个参与者仅拥有少量数据点、有限的算力和有限的可用能量（如智能手机和物联网设备） [12, 13]。它们极不可预测，总是游离群体之外又重新加入。例如，大型公司可受益于员工个人设备上存储的知识，设备制造商可利用其数百万自有设备上私密保存的数据训练模型\
  \ [14]。跨设备训练时，拥有一个收集数据并监管后勤的中央联系点会很有帮助 [15]。相比之下，跨孤岛场景参与者虽少，但均拥有海量数据和强大的计算资源（如持续供电或硬件\
  \ ML 加速器） [16, 17]。每个参与者在 FL 训练全程均在线且活跃，但敏感信息更易遭泄露 [18]。应用示例包括多家医院利用 X 光片训练肿瘤检测模型、不同银行训练信用卡欺诈检测模型等。跨孤岛场景中不存在显而易见的首选可靠来源\
  \ [19]。训练者与受训者之间无层级之分。由一方提供公共云托管或基础设施供给是此类部署的常见组成部分。本章专注于跨孤岛私有参数聚合 [20]。\n\n作者假设所有参与者均认同联邦学习有益，因为它能提升准确性和鲁棒性\
  \ [21, 22]。作者指出，通过展示联邦学习可能带来的假设性性能提升来说服人们协作，仍是一个未解的研究问题。我们关注的核心是“诚实但好奇”信任模型 [23]。然而，参与者可能为窥探他人数据而被激励去复现模型参数。关于参与者的个人信息，作者假设协调者不仅可信，而且确实好奇。应尽量减少对协调者的依赖，参与者希望实现这一点。作者还假设无人故意引入虚假权重以扭曲全局模型结果。当成员因法律或法规限制（如欧盟数据保护指南、FedRAMP）而被禁止共享信息或调整彼此模型参数时，该信任模型得以简化。\n\
  \n换言之，全球最大金融机构 BankA 在全球设有多个分支机构（BankA 印度、BankA 美国、BankA 英国等），却无法利用任何子公司的数据训练欺诈检测模型\
  \ [24, 25 and 26]。该信任范式的常见应用之一是职场联邦学习。区域数据中心服务于各子公司，全球数据中心可能部署协调者。医院间互不信任，不愿向中心化服务提供数据，却仍想合作训练肿瘤检测模型\
  \ [27]。也可能多家（竞争关系的）云托管 ML 服务（如 Azure ML）企业客户互不信任，但信任云服务具备安全开展 FL 的能力。\n\n### 3.\
  \ 私有联邦学习\n\n差分隐私框架关注在共享数据集上计算或查询的结果时，限制私有信息的泄露 [28, 29 and 30]。若一项计算能确保外部观察者仅通过查看其在数据集上产生的结果，无法判断使用了哪个个体的数据，则称其为差分隐私\
  \ [31]。差分隐私通常被理解为因披露任意数据集衍生物而导致的隐私损失的数学刻画。\n\n\n\n\n最近，许多研究人员开始在联邦学习环境训练模型时采用差分隐私\
  \ [32, 33, 34 和 35]。在联邦学习环境中，常规做法是在公开每个模型/数据导数之前添加噪声。参与者对匿名性的需求将决定应包含多少随机噪声。引入这种噪声会损害训练模型的准确性。研究表明，添加少量噪声并仔细选择训练超参数对准确性的影响可以忽略不计，但尚未有系统性研究探讨噪声水平究竟如何影响模型收敛\
  \ [36]。在不牺牲太多精度的情况下确定可行的隐私水平，可能需要漫长的实证方法。在本小节中，作者将对此问题提供更深入的描述和支持数据 [37]。\n\n####\
  \ 3.1 差分隐私（DP）背景\n\n最近，计算机科学领域对差分隐私文献给予了大量关注。由于篇幅限制，作者将在本章中仅简要讨论差分隐私（DP）结构。DP 在\
  \ [38, 39 和 40] 中有更深入的描述。根据差分隐私文献，当函数 `f(·)` 应用于仅相差一条记录的一对数据 `X` 和 `X'` 时，当且仅当它对所有\
  \ `t` 返回相同值，该函数才是 `ɛ` DP。\n\n(1)\n\n```\n|\\ln\\frac{P(f(X) = t)}{P(f(X^{\\prime})\
  \ = t)}| \\leq \\varepsilon\n```\n\n参数 `ϵ` 的值越低，表示隐私泄露的可能性越小。在本研究中，作者采用了 [41] 中提出的\
  \ DP 概念的一个实用推广，作者将其表示为函数 `f(·)` 的 `(ɛ,δ)` DP：\n\n(2)\n\n```\nP(f(X) = t) \\leq e^{(\\\
  epsilon)}P(f(f(X^{\\prime}) = t) + \\delta\n```\n\n通过观察，根据该定义，`f(·)` 似乎具有等于 `1-δ`\
  \ 的差分隐私。为实现 DP，作者通过添加一个方差取决于参数 `ϵ` 和 `δ` 的噪声项来调整 `f(·)` 的结果。此外，已证明添加一个零均值、方差为\n\n\
  (3)\n\n```\n\\sigma^{2} = \\Delta f \\cdot \\frac{2\\ln\\frac{1.25}{\\delta}}{\\\
  epsilon}\n```\n\n的高斯噪声项可保证 `(ϵ, δ)`-DP [42]，其中 `f` 表示 `f(·)` 所需的保密级别。计算的敏感度是指当底层数据集中的单个变量被改变时，计算结果可能发生的变化量。敏感度\
  \ `Δf` 的正式表达式为\n\n(4)\n\n```\n\\Delta f = \\sup\\limits_{(X,X^{\\prime})}( \\parallel\
  \ f(X) - f(X^{\\prime}) \\parallel_{\\ell})\n```\n\n虽然上述定义仅限于单次查询的 DP，但在神经网络训练过程中实际上会执行多次数据查询。因此，作者必须考虑训练过程中的累积隐私损失，而不能仅依赖单个\
  \ `ɛ` 值。正如隐私预算定理（`β`）所证明的，当使用多个 `(ɛ,δ)`-DP 时，总隐私损失等于所用值的乘积。要在 `ɛ[0]` 保持不变的情况下训练\
  \ `T` 次迭代，作者需要的隐私预算为 `\\beta = \\sum\\limits_{i = 1}^{T}\\epsilon_{0} = T\\epsilon_{0}.`\n\
  \n无需如此天真地一次性花光所有隐私预算。多位作者探讨了多种花费隐私预算的方式以取得各类进展。利用差分隐私的一种推广，文献 [43] 实现了对每次查询隐私损失的更严格限制，同时减少了查询次数，从而降低了总体隐私损失。\n\
  \n#### 3.2 差分隐私与随机梯度下降的结合\n\n为了训练机器学习算法，特别是深度学习模型，`SGD` 是一种常见的优化方法。为了使分布式 `SGD`\
  \ 工作，小批量数据必须被分成更小的片段并分发给每个参与者，参与者的任务是计算模型的梯度。然后将组合梯度发送到中心化的参数服务器。一旦参数服务器找到学习者梯度的全局平均值，参数模型就会被调整。\n\
  \n在联邦学习设置中，用户通常在自己的本地数据集上计算模型参数的梯度，然后将结果提交给中心化服务器。为了防止数据通过共享梯度泄露，`SGD` 算法融合了 `DP`\
  \ 领域的方法。有关由此调整产生的 `DP`、`SGD` 的更多信息如下。\n\n接下来的主题是基于随机梯度下降的联邦学习中 `(ϵ,δ)`-DP 的应用。在本地数据集上使用\
  \ `f(·)` 等同于计算梯度模型。\n\n给定批量大小 `S` 和学习率 `η`，小批量 `SGD` 的更新规则为\n\n(5)\n\n```\n\\theta_{k\
  \ + 1} = \\theta_{k} - \\eta\\frac{1}{S}\\sum\\limits_{i = 1}^{S}g(x_{i})\n```\n\
  \n`X` 是一组数据点，`g(xi)` 表示第 `i` 个点处损失函数的梯度。在梯度交换过程中，通信的量为：`f(x) = \\eta\\frac{1}{S}\\\
  sum\\limits_{i = 1}^{S}g(x_{i}).` 在上述公式中，敏感度将由两个数据集 `X` 和 `X′` 之间唯一的那个单个数据点的梯度决定。\n\
  \n```\n\\begin{matrix} {\\Delta f} & {= \\parallel f(X) - f(X^{\\prime}) \\parallel_{\\\
  ell}} \\\\ & {= \\frac{\\eta}{S} \\parallel \\sum\\limits_{i = 1}^{S}(g(x_{i}) -\
  \ g(x_{i}^{\\prime})) \\parallel_{\\ell}} \\\\ & {= \\frac{\\eta}{S} \\parallel\
  \ g(x_{j}) - g(x_{j}^{\\prime})) \\parallel_{\\ell}} \\\\ & {\\leq \\frac{\\eta}{S}\
  \ \\cdot 2C} \\\\ \\end{matrix}\n```\n\n其中 `C` 是设定梯度最大值的常数。因此，向梯度添加方差为 `2C\\frac{\\\
  eta}{S}\\frac{\\ln\\frac{1.25}{\\epsilon}}{\\epsilon}` 的高斯噪声因子，可使其成为 `(ϵ,*δ*)` DP。在此，作者详述了作者在实践中使用的差分隐私\
  \ `SGD` 方法的简略版本。\n\n**算法 1** `(ϵ,δ)`-DP SGD\n\n> **输入：** `η` = 学习率，`C` = 裁剪长度，`S`\
  \ = 批量大小，\n>\n> `Tɛ[0]` = 隐私预算，`θ[0]` = 初始权重\n>\n> **for** `t = 0, 1, 2, 3,…,T`\
  \ **do**\n>\n> 计算 `f(X) = \\sum\\limits_{i = 1}^{S}g(x_{i})`\n>\n> ```\n> \\begin{matrix}\
  \ \\left. gradient clip:f(X)\\leftarrow\\frac{f(X)}{\\max(1,\\frac{\\parallel f(X)\
  \ \\parallel}{C})} \\right. \\\\ {sampleZ_{k}distributionN(0,2C\\frac{\\eta}{S}\\\
  frac{\\ln\\frac{1.25}{\\delta}}{\\epsilon})} \\\\ \\left. \\theta_{t + 1}\\leftarrow\\\
  theta_{t} - \\eta f(X) + Z_{k} \\right. \\\\ \\end{matrix}\n> ```\n>\n> **end for**\n\
  \n#### 3.3 讨论\n\n让我们通过讨论几个相关实验，深入探讨在联邦学习中实施 `DP` 的困难。`CIFAR-10` 数据集可用于训练 `Resnet-18`\
  \ 模型，而 `SVHN` 数据集可用于构建 `Resnet-50` 模型。所有模型均使用原始 `SGD` 和 `DP` 变体训练 200 次迭代。计划前 80\
  \ 个周期以 0.1 的学习率训练，接下来 40 个周期以 0.01 的学习率训练，最后 80 个周期以 0.001 的学习率训练。\n\n##### 3.3.1\
  \ 准确率与 ϵ\n\n\n\n\n## 3.3.1 收敛性分析\n\n不同批次大小和 `ɛ` 值下的收敛图表分别显示在图 4.1 和图 4.2 中。首先需要注意的是，当作者降低\
  \ `ɛ` 的值时，模型收敛到的精度会降低。产生噪声较少的训练方法更接近非私有训练的准确率，如图 1 所示，以特定批次大小（例如 1024）为例。随着引入更多噪声，`ɛ\
  \ = 0.01` 及以下（等同于 `ɛ` 为 0.05）时准确率迅速下降。正如图 4.1 和图 4.2 所示，这种模式在每个给定批次大小下的所有模型中均成立。\n\
  \n![图 1. ResNet18 在 CIFAR10 上跨批次大小（64、1024、4096 和 8192）和 ɛ（从 10 降至 0.001）的验证准确率对比\
  \ 较小的 ϵ 表示更多噪声隐私。](img/fig4_1_C.jpg)\n\n图 1. ResNet18 在 CIFAR10 上跨批次大小（64、1024、4096\
  \ 和 8192）和 ɛ（从 10 降至 0.001）的验证准确率对比 较小的 ϵ 表示更多噪声隐私。\n\n![图 2. ResNet18 在 CIFAR10\
  \ 上以 64、1024、4096 和 8192 批次大小及 ɛ 的每轮验证准确率 较小的 ϵ 表示添加了更多噪声和隐私。](img/fig4_2_C.jpg)\n\
  \n图 2. ResNet18 在 CIFAR10 上以 64、1024、4096 和 8192 批次大小及 ɛ 的每轮验证准确率 较小的 ϵ 表示添加了更多噪声和隐私。\n\
  \n### 3.3.2 批次大小与准确率\n\n在图 4.1 和图 4.2 中，作者可以看到模型的准确率因私有训练所用的批次大小 `S` 而大相径庭，而对于公开版本（`ɛ\
  \ = 0`），准确率在广泛的批次大小范围内保持合理一致。为了使私有模型即使在较小的 `ϵ` 值下也能达到与公开模型相当的性能，我们发现增加批次大小就足够了。具体而言，在\
  \ `ϵ = 0.005` 和 `0.01` 时（图 1 中从左到右的橙色和绿色曲线），CIFAR10+ResNet18 表现出这种行为，尽管这对所有 `ϵ`\
  \ 值均成立。\n\n当批次大小从 1024 增加到 8192 时，对于对应 `ɛ = 0.01` 和 `0.005` 的更私有设置，CIFAR10+ResNet18\
  \ 的最终准确率分别提高了约 37% 和 78.5%。图 2 显示了类似的趋势。尽管差分隐私前景广阔，但它似乎需要非常精确的超参数优化以确保最佳性能。为此，可能需要启动大量\
  \ FL 任务，每个任务都有自己的超参数集。\n\n### 4. 加法同态加密\n\n研究人员要么（1）采用密码学的新颖应用（带有同态加密的安全多方计算），要么（2）通过引入统计噪声来改变模型参数或梯度。某些程序中两者可以结合使用。\n\
  \n同态加密允许在密文上进行计算，解密后的加密输出与明文的值相匹配。全同态加密虽然有效，但由于密文长度的原因，耗时且资源密集。另一方面，在联邦梯度下降中，平均梯度向量就像汇总其分量一样简单（在加密聚合方法之前或之后，可能会减去参与者的总数。）。联邦训练梯度可以用加法同态加密（如\
  \ Paillier 密码系统）进行加密。在公钥密码学方面，Paillier 密码系统提供了一种额外的非对称选择。通过结合 `m[1]` 和 `m[2]` 的加密版本以及公钥，作者可以得到求和结果的加密版本。同态加密的定义生动地说明了将其用于私有梯度聚合的难度。所有参与者必须使用相同的公钥来加密他们的梯度和参数。需要可靠的密钥来源及其分发机制。然而，如果所有参与者都与这个密钥生成器/分发器通信并将其\
  \ Paillier 加密的梯度发送给它，则有可能解密数据。因此，聚合应尽可能独立于密钥生成器/分发器进行。此外，密钥生成器/分发器必须被隐性信任，不向任何第三方泄露私钥。有各种设计可以在这些参数范围内工作。最后，将我们的方法与其他差分隐私和安全多方计算（SMC）方法进行评估。\n\
  \n值得注意的是，Mystiko 并非唯一使用 Paillier 密码学保护收集数据的系统。协作方使用 Paillier 密钥对加密梯度向量，并将其发送给一个他们不信任的协调者，直到需要合并权重时为止。然后参与者可以分析收集到的梯度向量。为了共同生成\
  \ Paillier 密钥，参与者需要对自己和不受信任的协调者都有高度的信任，以便他们可以独立解码各自的梯度向量。单个不可靠行为者泄露 Paillier 密钥就可能危及整个系统并损害用户隐私。\n\
  \n被称为安全多方计算（SMC）的密码学领域的目标是寻找多方安全且独立地在其各自输入上计算同一函数的方法。在此范式中，密码学用于保护参与者彼此的隐私，这与传统密码学职业不同，后者用于保护通信和存储的安全性与完整性，且对手位于参与者系统之外（发送方和接收方的窃听者）。传统的\
  \ SMC 方法可以通过 SPDZ 及其衍生协议得到改进。此类协议的有前景的特性包括：免疫少量串通对等体的攻击、能扩展到大量对等体、以及对训练模型最终正确性的变化不敏感。一个潜在问题是\
  \ SMC 方法计算成本高昂。\n\n#### 4.1 学习者与管理域、参与者\n\n一个自然的起点是从管理域的角度定义 FL 算法。一组计算机可以被视为一个管理域（服务器、虚拟机、计算机、笔记本电脑等）。在一个管理域内，所有参与方可以相互信任，不存在恶意意图，且没有法律或监管障碍阻碍数据及源自数据的信息自由流动。重要的是要记住，公司或非营利组织不一定是一个管理域。它可能是处理敏感信息的内部公司项目，也可能是关联到公共云账户的外部托管服务。单个组织内部可能存在多个控制域。联邦学习算法中的每个节点代表一个独立的监管域。在训练神经网络的过程中，计算学习过程本身（通常运行在\
  \ GPU 上）被称为学习者。参与者进程中的每个学习者处理（数据的一个子集）数据以计算梯度向量。\n\n#### 4.2 架构\n\n\n\n\n# 联邦学习系统中的隐私保护与\
  \ MYSTIKO 算法\n\n在一个以参与者隐私为优先的联邦学习系统中，模型参数或梯度的聚合取决于参与者采用的加密技术以及参与者到达系统协调器所采用的通信通道。使用共享的\
  \ Paillier 公钥，所有 MYSTIKO 用户在结合其加密梯度向量以生成单个加密结果之前对其数据进行加密。因此，保密性得以维持，因为只有参与者才能访问其信息。当前的问题是：(1)\
  \ 在共享 Paillier 公钥的同时如何保证每个人私钥的安全；(2) 如何防范特定权重被解密。以下将对这两个问题进行解释。\n\n为简洁起见，假设每个参与者是一名学生。通常，MYSTIKO\
  \ 作为一种云服务，充当多方之间的中介。为此，作者需要 `Job Manager`（作业管理器）、`Membership Manager`（成员管理器）、`Key\
  \ Generator`（密钥生成器）和 `Decryptor`（解密器）。此外，`Membership Manager` 还负责记录参与每项 FL 活动的用户，以便为\
  \ MYSTIKO 注册用户。FL 作业的 `Job Manager` 负责修复漏洞、更新成员、查找缺失人员以及确定作业超参数的最优值。本章重点关注联邦内部的数据隐私攻击，但标准通信安全对于抵御来自联邦外部的攻击也是必要的。为此，MYSTIKO\
  \ 和学生（参与者）将共享一个 PKI。保护 MYSTIKO 组件与学生之间发送数据的隐私，是 PKI 帮助 Paillier 基础设施建立起来的众多方式之一。为了在学生和\
  \ MYSTIKO 之间建立信任链，PKI 提供了 CA、中间 CA 和根 CA。利用公钥基础设施（PKI），MYSTIKO 建立加密的 TLS 通道用于发送和接收控制数据。构建\
  \ TLS 通道采用了标准但强大的（非同态）加密方法（例如使用 RSA 进行密钥协商/交换/认证）、使用 AES 保证消息机密性、使用 SHA 进行消息认证。在学习者注册、排名、分发\
  \ Paillier 公钥，以及在 MYSTIKO 拓扑形成期间通信解密后的聚合梯度向量等所有操作，均通过 TLS 通道进行。\n\n#### 4.3 MYSTIKO\
  \ 算法\n\n作者从最简单的基于环的方法入手，逐步介绍到目前最复杂的算法，包括结合了并行性和广播韧性的 MYSTIKO 算法族。\n\n##### 4.3.1\
  \ 基于环的算法\n\n图 4.3 和 图 4.4 描绘了基于环的基本聚合方法示例。该算法涉及的 P 个参与者均为拥有其管理域（L）的学习者。流程开始时，每个参与者必须注册\
  \ MYSTIKO 账户。MYSTIKO 协调一切事务。由于 MYSTIKO 生成安全的加密密钥对、保护私钥并遵循协议，因此学生可以信任它。\n\n![图 3.\
  \ 建立拓扑与密钥分发](img/fig4_3_B.jpg)\n\n图 3. 建立拓扑与密钥分发\n\n![图 4. 使用环形网络拓扑的标准聚合方法](img/fig4_4_B.jpg)\n\
  \n图 4. 使用环形网络拓扑的标准聚合方法\n\n一旦所有预期学生加入 MYSTIKO，`Membership Manager` 将启动 FL 流程。从环拓扑开始，作者组织班级（图\
  \ 3）。有几种简单的方法：（1）按位置，以最小化参与者间的实际物理距离；（2）采用基于名称的层级（升序或降序）；（3）一致性哈希 [24] 参与者的名称和身份。随后根据学生在分配环中的位置对其进行排名（1–P）。\n\
  \nMYSTIKO 中每个 FL 任务都有其专属的 Paillier `Key Generator` 私钥和公钥。Paillier 密钥对对于每个 FL 任务唯一，并通过\
  \ TLS 安全分发给所有参与者。若操作预计长时间运行，可按固定间隔（如每 h 分钟或每个 epoch，可配置）生成新密钥对。`MYSTIKO` 的 `Decryptor`\
  \ 接收 Paillier 加密的聚合梯度向量，解密后发送给学习者。环中的每个学习者节点利用 Paillier 公钥解码共享梯度向量，加密自身梯度向量，并将两个加密向量结合。最后一名环学习者接收聚合后的\
  \ Paillier 加密梯度向量。随后，该学习者将聚合加密梯度向量发送给 MYSTIKO。`MYSTIKO Decryptor` 在通过 TLS 向学生传输信息前，对结合向量进行加密。\n\
  \n#### 安全性分析\n\n学生及其所属教育机构的信息绝不泄露给外部方。只要每个管理域内的服务器部署了强大的防入侵机制，即可确保数据隐私。在该系统中，梯度向量永远不会以未加密形式离开学习者。仅当\
  \ P 小于 1 时，学习者才会释放聚合的 Paillier 加密梯度向量。解密需要 MYSTIKO 的私钥。通过 Paillier 加密传输，第二个环学习者从第一个环学习者接收未聚合的梯度向量，而第一个环学习者无法解密该向量。聚合完成后，完整梯度向量对外不可见。为确保聚合梯度安全到达所有参与者，发送前会通过\
  \ TLS 进行加密。当从大型数据集平均多个梯度向量时，极难实现反向工程攻击目标（如判断特定参与者是否拥有特定数据记录，或识别导致梯度向量特定变化的数据项）。为保护平均前梯度的机密性，先进行加密。因此，MYSTIKO\
  \ 只能看到总体结果，无法获取个别学生的数据或梯度。\n\n#### 串通参与者\n\n基础环算法无法被超过 P–2 个参与者攻破。即若 MYSTIKO 诚实且未被破坏运行，仅当\
  \ P–1 名学生串通时才可能被破解。学习者 L1, L2..., Li–1, Li+1..., LP 必须串通，通过传递从前一学习者接收的加密梯度向量（不附加自身梯度）来解码学习者\
  \ Li 的梯度。\n\n#### 容错性\n\n基于环的聚合方法潜在缺陷是环可能断裂；为实现最优性能，必须维护每个学习者与 MYSTIKO 间的稳健连接。可采用成熟的故障检测方法，如监控心跳异常或计算平均往返时间。分布式同步梯度下降的每次迭代均对上一次迭代的梯度求平均。若发现学习者故障，`MYSTIKO`\
  \ 的 `Membership Manager` 将把该学习者从环中移除，或等待其重新连接后继续梯度向量平均。当 MYSTIKO 连接短暂中断时，可暂停梯度平均过程。\n\
  \n##### 4.3.2 广播算法\n\n\n\n建立和维护环形拓扑的难度是基于环形方法的主要缺点。使用组成员资格和广播是解决这一问题的一种方案。除了拓扑现已建立这一事实外，情况没有任何其他变化。`MYSTIKO\
  \ 成员管理器`是学生注册、就共享 PKI 达成一致，并获知将使用该系统的所有其他人员姓名和编号的地方。与 `MYSTIKO` 中联邦任务相关联的每个 Paillier\
  \ 公私钥对的公钥都会安全地传达给所有参与学生。\n\nPaillier 学习算法在将每个学习者的梯度向量发送给其他学习者之前对其进行加密。为了解密由其他 `P–1`\
  \ 个学习者发送给他们的加密向量，一个学习者将 Paillier 加密求和提交给 `MYSTIKO`。合并后的梯度向量解密副本通过 `TLS` 以安全可靠的方式发送给每个学生。由于每个学生都计算求和，广播方法效率低下且没有必要。不过，有了冗余，作者们可以在不得不重新开始之前容忍更多挫折。与广播不同——如果单个节点故障，所有聚合梯度仍将可用——环形在节点故障时会遭受部分损失。\n\
  \n### 串通参与者\n\n给定 `LA` 的明文梯度向量代表了算法预期的弱点。需要 `P–1` 个参与者合作才能破解该算法，这使其具有极强的抗串通性。如果\
  \ `P–1` 个学生秘密地用 Paillier 加密 `0` 向量来代替他们真实的梯度向量，广播的 Paillier 密文中的相似性将表明存在合作。事实上，即使只有两个学习者产生相同的\
  \ Paillier 加密梯度向量也是可疑的，因为他们的数据很可能不同。\n\n基于环的聚合方法与基于环的 All-Reduce 并行描述和实现。其图示表示如\
  \ 图 5 所示。作者引入了环协议，但它有一个主要缺陷：每个学生必须等待前一个学生完成循环后才能继续。All-Reduce 通过将梯度向量切片为 `P` 个片段（其中\
  \ `P` 是主体总数）来规避此问题。然后将 Paillier 加密的片段分发给学生，由他们独立重新组装。例如在 图 5 中，有三个学习者，因此每个梯度向量由三个子分量组成。`Learner-2`\
  \ 无需等待 `Learner-1` 完成提供其向量即可继续进行。相反，`Learner-1` 将第一个分块发送给 `Learner-3`，同时将其第二个分块发送给\
  \ `Learner-3`。完成步骤 1 后，\n\n![图 5. 使用基于 Paillier 的 All-Reduce 的加密 MYSTIKO 环。](img/fig4_5_C.jpg)\n\
  \n图 5. 使用基于 Paillier 的 All-Reduce 的加密 MYSTIKO 环。\n\n`Learner-2` 将第一个部分聚合的分块传输给 `Learner-3`，后者再将其传输给\
  \ `Learner-1`。当步骤 2 完成时，每个学生都将拥有要发送给 `MYSTIKO` 解密器的 Paillier 加密聚合分块，在那里它们将被拼接并解码。\n\
  \n### 安全性分析\n\n重要的是要强调，All-Reduce 是最快的 `MYSTIKO` 过程。给定 `P` 个学习者，All-Reduce 可被视为\
  \ `P1` 个环的并行实现。图 5 中的第一个环从 `Learner-1` 的第一个片段开始，第二个环从 `Learner-2` 的第二个分块开始，第三个环从\
  \ `Learner-3` 的第三个分块开始。这意味着 All-Reduce 提供了与最简单环协议相同的安全保证。\n\n#### 4.4 每个管理域多个学习者\n\
  \n为便于分析，研究人员假设每个个体都是一个独特的学习进程。在同一管理域中运行的梯度向量聚合器的帮助下，多个服务器和训练进程（学习者）可以共享同一数据集。这是由于多种考虑因素所必需的，包括数据集的规模、计算机资源分析成本的相对简单性，以及对缩短训练时间的重视。为\
  \ `MYSTIKO` 开发的协议可以轻松适应这一场景，唯一的变化是通信发生在本地聚合器（`LA`）之间，而不是学生之间。本地聚合并不安全，因为管理域内的可信计算资源甚至可以传输原始数据，但远程聚合是\
  \ Paillier 加密的，因此是私密的。然而，`MYSTIKO` 协议用于 `LA` 之间的数据聚合。图 6 直观地描绘了这一概念。\n\n![图 6. 联邦梯度下降。](img/fig4_6_B.jpg)\n\
  \n图 6. 联邦梯度下降。\n\n### 5. 可信执行环境\n\n主处理器的安全空间称为可信执行环境（`TEE`）。隔离执行、应用完整性和数据资产机密性只是\
  \ `TEE`（可信执行环境）提供的众多安全特性中的一部分。通过创建一个单独的执行环境，`TEE` 保护关键代码和数据免受本地操作系统上特权软件攻击。常见的本地操作系统示例包括\
  \ `Linux` 和 `Microsoft Windows`。使用 `TEE` 的系统集成了硬件和软件保障来保护机密信息，示例包括 `IBM Hyper Protect`、`ARM\
  \ TrustZone` 和 `Intel SGX`。在 `TEE` 中，服务器的 CPU、I/O 和 RAM 均保留给在加载前已验证为安全的程序。`TEE`\
  \ 的硬件隔离将其内容与在宿主操作系统上运行的其他程序（如病毒和恶意软件）构成的威胁隔离开来。当 `TEE` 内运行众多程序时，它们通常通过软件和加密隔离相互屏蔽。\n\
  \n`TEE` 使用所谓的“硬件信任根”来防止被恶意或流氓服务器端软件模拟。可信执行环境可以在制造过程中使用可编程内存写入一套一次性使用的私钥。即使在重启或完全恢复出厂设置后，作者也无法修改这些设置。为了让固件和加密/访问控制电路由受信任方签名，制造商存储了受信任方的公钥等价物和非秘密哈希值（通常是芯片供应商）。只有使用受信任方密钥进行数字签名的程序才能访问\
  \ `TEE` 硬件及其特殊功能。芯片中已包含供应商的公钥，该公钥经过哈希处理并在运行时进行比对。使用该公钥，受信任的供应商控制固件（如 Android 设备的引导加载程序链或\
  \ `SGX` 的“架构飞地”）可进行数字验证。随后使用受信任固件实现远程认证。\n\n作者利用可信执行环境（`TEE`）解释了一个系统 `TRUDA` 如何为模型融合提供安全性。还有其他带有多种优化的示例。在此，作者仅以\
  \ `TRUDA` 为例，重点关注 `TEE` 聚合的基础知识。`TRUDA` 采用 `AMD` 的安全加密虚拟化（`SEV`）将每个聚合器作为加密虚拟机（`EVM`）运行。在模型聚合期间，所有驻留在内存中的数据在运行时保持加密状态。通过一个两步流程和一套用于联邦学习中秘密计算的组合与系统化工具，加快了各方与聚合器之间建立信任的过程。任何\
  \ `FL` 训练参与者都可以随时检查聚合器的可信度。认证后，各方和 `EVM` 通过端到端安全通道连接，对它们之间的所有数据（包括模型的任何修订）进行加密。\n\
  \n#### 5.1 可信聚合\n\n\n\n# TRUDA 中的 FL 聚合与认证\n\n针对 FL 聚合，TRUDA 强制要求通过 SEV 实现加密隔离。聚合器运行在\
  \ EVM 上。每个 EVM 的内存都使用唯一的临时 VM 加密密钥（`VEK`）进行加密。这样，TRUDA 可以防止服务器管理员和特权应用等窥探者窃取模型聚合的秘密。可以利用\
  \ AMD 提供的认证原语来确认 SEV 硬件和固件的有效性。为了在去中心化 FL 环境中快速建立各方与聚合器之间的信任，TRUDA 采用了一种基于这些原语构建的新型认证协议。该\
  \ FL 认证过程分为两个阶段：\n\n## 阶段 1：启动可信聚合器\n\n安全启动与聚合器关联的 SEV EVM 是迈向 TRUDA 的初始阶段。为确保 EVM\
  \ 的安全，必须：\n\n1.  验证硬件平台是真正的支持 AMD SEV 且具备所需安全特性的硬件。\n2.  验证用于启动 EVM 的开放虚拟机固件（`OVMF`）镜像是真实的。\n\
  \n远程认证完成后，TRUDA 将连同 EVM 一起发送聚合器的密钥。在阶段 2 的聚合器认证完成之前，该密钥始终隐藏在 EVM 加密的物理内存中。可使用有效的\
  \ AMD 根证书来验证整个证书链的真实性。认证报告除包含完整的证书链外，还包含原始`OVMF`镜像的摘要。\n\n报告经过认证后，将被传输至已配置必要 AMD\
  \ 根证书的认证服务器。通过验证证书链，认证服务器可判断`OVMF`固件是否被篡改，以及特定硬件平台是否真实。认证服务器生成启动二进制大对象和客户所有者 Diffie-Hellman\
  \ 公钥（`GODH`）认证，以验证宿主机器的身份。聚合器的机器向 SP 提交 DHKE 请求以获取传输加密密钥（`TEK`）和传输完整性密钥（`TIK`）后不久，EVM\
  \ 便开始处理数据。\n\nTRUDA 可在启动时暂停 EVM，从 SP 获取`OVMF`运行时度量值。为进行验证，该度量值连同 SEV API 版本和 EVM\
  \ 部署方法一起传输给宿主系统。作为打包密钥的一部分，认证服务器生成一个 ECDSA `prime251v1`密钥，以确保度量值的准确性。为了揭示可信聚合器的身份，必须启动\
  \ EVM，此时管理程序必须将密钥注入 EVM 的物理内存区域。\n\n## 阶段 2：聚合器认证\n\nFL 参与方必须仅与使用安全运行时内存加密的已识别聚合器协作，这至关重要。在\
  \ EVM 部署的第一阶段，认证服务器秘密地向聚合器提供一个 ECDSA 密钥，以便其进行认证。该密钥对质询请求的签名验证了请求源自可信聚合器。参与方在参与 FL\
  \ 前，需要进行质询-响应协议聚合器认证。通信发送方有时会在消息中附加一个随机生成的 nonce。聚合器使用自己的 ECDSA 密钥对该 nonce 进行签名，并将其发送回请求方。为确保\
  \ nonce 是用正确的 ECDSA 密钥签名的，请求方验证其签名。验证通过后，加入 FL 的下一步是向聚合器注册。每个聚合器轮流完成此过程。\n\n注册后，聚合器与参与模型更新交换的各方可通过端到端加密信道进行通信。TRUDA\
  \ 使 TLS 能够与需要双向认证的聚合器配合工作。因此，所有模型变更在 EVM 内部和传输过程中均处于安全状态。\n\n# 实验评估\n\n在本章中，作者将三种\
  \ Mystiko 算法与 SPDZ（一种领先的可靠多方计算协议）以及通过引入统计噪声实现差分隐私（DP）的策略进行了比较。研究人员使用多种不同规模的神经网络模型和数据集进行图像处理：作者从一个在\
  \ MNIST 数据集上训练的 1MB 5 层 CNN 开始。以下是所用的四个模型：\n\n1.  Resnet-18（中型，50MB），在 SVHN 数据集（60\
  \ 万张街景数字图像）上训练。\n2.  Resnet-50（中型，110MB），基于 CIFAR-100 数据集（6 万张彩色图像，100 个类别）。\n3.\
  \  VGG16（大型，600MB），在 Imagenet-1K 数据集上训练。\n4.  AlexNet（小型，10MB），在 MNIST 数据集（1420\
  \ 万张图像，1000 个类别）上训练。\n\n作者利用一个包含 40 台计算机的集群，以 2 到 40 人的分组进行实验，以测试和比较所有算法。每台计算机上从未安排超过一个工作节点运行，每台计算机配备\
  \ 8 个 Intel Xeon E5–4110（2.10 GHz）处理器核心、64 GB 内存、单个 NVIDIA V100 图形处理单元和 10 千兆以太网连接。所有机器分布在四个不同的数据中心，且在每次测试中，参与者均匀分布在所有四个数据中心中。在每个实验中，数据集在参与者之间均匀随机分布。一个数据中心提供单台机器用于执行\
  \ Mystiko。接下来，作者将对 10 次独立试验的结果取平均，以得出每个新数据点。\n\n## MYSTIKO 与 SPDZ 的比较\n\n在联邦学习中，每个学习者（或本地聚合器）在共享训练数据并协同更新模型之前，都会进行固定次数的迭代单独训练。MYSTIKO\
  \ 和 SPDZ 等系统在梯度聚合阶段以威胁隐私的方式介入。为此，作者将利用以下两个标准来评估 MYSTIKO 和 SPDZ：\n\n时间同步有两种类型：均可用秒和毫秒来衡量两个设备同步得有多好。同步过程的两个部分构成了总时间：\n\
  \n1.  对梯度进行机密调整所需的时间（MYSTIKO 的 Paillier 加密、SPDZ 的份额生成等）。\n2.  将更新后的梯度广播给联邦成员所需的时间。\n\
  \n在图 7 中，作者使用所有模型/数据集组合的散点图，比较了联邦范围内的总同步和通信时间与联邦成员总数的关系。正如图 7 所示，All-Reduce 是随着用户数量增长最具扩展性的选项。得益于协议固有的并行性，每个学习者/LA\
  \ 只需持续广播梯度数组的一个子集，从而大幅减少了传输的总数据量。由于其顺序性质，基本环形协议是扩展性最差的网络拓扑。\n\n![图 7. MYSTIKO：总同步时间（秒）与参与方数量的关系（顶部图表）及总通信时间（秒）与参与方数量的关系（底部图表）\
  \ 通信耗时和梯度转换耗时均是总同步时间的组成部分。](img/fig4_7_C.jpg)\n\n图 7. MYSTIKO：总同步时间（秒）与参与方数量的关系（顶部图表）及总通信时间（秒）与参与方数量的关系（底部图表）\
  \ 通信耗时和梯度转换耗时均是总同步时间的组成部分。\n\n\n\n\n\n# 广播 vs. SPDZ vs. MYSTIKO\n\n广播的性能和可扩展性远超标准环形协议，因为每个节点独立于其他节点进行传输。由于\
  \ SPDZ 要求在将每个参与者的梯度向量广播给其他参与者之前，先将其划分为秘密份额，因此 SPDZ 的效率和可扩展性不如广播。对于 MYSTIKO，双重广播是不必要的，因为数据使用\
  \ Paillier 理论进行加密，然后使用聚合梯度集中解密。切换到替代协议对两种不同性能类型的影响如表 1 所示。\n\n####### 表 1. MYSTIKO：广播、环形和\
  \ SPDZ 相比于全归约的性能下降\n\n### 通信时间\n\n| # 参与方 | 全归约 | 广播 | 环形 | SPDZ |\n| :--- | :---\
  \ | :--- | :--- | :--- |\n| 20 | 1 | 64–7.2× | 382–39.9× | 131–14.2× |\n| 40 | 1\
  \ | 79–8.6× | 705–80.8× | 138–14.7× |\n\n### 总同步时间\n\n| # 参与方 | 全归约 | 广播 | 环形 |\
  \ SPDZ |\n| :--- | :--- | :--- | :--- | :--- |\n| 20 | 1 | 12–51% | 27–100% | 22–6.1×\
  \ |\n| 40 | 1 | 6–25% | 15–59% | 13–2.6× |\n\n虽然全归约承诺“巨大”的加速，但当计入整个同步时间时，这些加速便消失了。这四种可扩展性协议的总体趋势没有变化；总同步时间的减少仍然相当可观（表\
  \ 4.1 中展示了两个例子）。然而，与增强通信所带来的收益相比，这些改进相当微不足道。这说明，与 MYSTIKO 和 SPDZ 中的非私有梯度下降相比，在共享梯度之前修改梯度所花费的时间是私有梯度下降的主要成本。图\
  \ 7 和表 1 说明了通信时间对于不太复杂的模型（5 层 CNN 和 ResNet-18）变得越来越关键。然而，大型模型从梯度修改中获益更多（如 ResNet-50\
  \ 和 VGG-16）。\n\n在比较私有和非私有梯度下降时，作者发现当使用轮次时间作为训练时间的代理时，前者的同步时间明显更长。原因之一是梯度修改在 CPU\
  \ 上执行，而训练在 V100 GPU（拥有数百个核心）上完成。尽管全同态加密确实存在（但在 CPU 上性能不如 Paillier），研究人员目前尚不知晓 Paillier\
  \ 技术的 GPU 加速版本。\n\n#### 5.2 可信执行环境：AMD SEV\n\n与 MYSTIKO 和 SPDZ 相比，最小开销是主要优势。使用 TEE\
  \ 会导致更多工作，因为 EVM 必须执行聚合。每个联邦同步轮次产生了 2% 到 4% 的额外端到端延迟。收敛率和准确率均保持一致。\n\n### 6. 结论\n\
  \n本章探讨了联邦学习中私有参数聚合的选项。显然，每种方法都有其优缺点，寻找最优解仍是一个持续的研究领域。尽管差分隐私在防止数据泄露方面显示出前景，但这是以牺牲模型准确性为代价的，并且需要非平凡的超参数调整（学习率调度、批量大小）以获得最佳结果（甚至是接近最佳的结果）。鉴于超参数调整依赖于所有参与者在较长时期内的可用性，且进行多次试验会增加总延迟，这在联邦场景中可能不切实际。使用同态加密或安全多方计算方案时，既不需要调整准确率，也不需要调整收敛率。然而，它们在运行时方面有显著开销；正如\
  \ MYSTIKO 所示，如果聚合协议设计良好，加法同态加密可以大幅降低这一开销。最后，如果有人愿意投资一些专用硬件，TEE 可以将聚合开销降低到几乎为零，且对准确率或收敛率没有负面影响。\n\
