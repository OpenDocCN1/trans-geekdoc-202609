  \ `FedAvg` 训练，`BFDL` 和资源高效联邦深度学习均采用 `SGD` 优化器。通过在 `4` 个周期和 `30` 轮工作节点间通信中总共训练 `128`\
  \ 个批次，实现了每个联邦模型的最优收敛。客户端模型训练完成后，协调工作节点获知典型权重。该工作节点必须汇编全局模型所需的权重。该答案的底层代码可在 `GitHub`\
  \ 上找到 [35, 36]。\n\n#### 4.3 建立实验测试平台并进行测试\n\n利用 `PySyft` Python 框架版本 `0.2.9`（包含由\
  \ `WebSocket (WS)` 耦合的客户端和服务器类）来考察 `REFDL` 和 `BFDL` 环境中联邦通信的可行性。我们的分布式 FL 训练环境非常适合低功耗设备，我们利用了\
  \ `PyTorch` 可作为 `PySyft` 库这一事实。这些配置旨在以去中心化方式运行，类似于它们所模拟的客户端-服务器通信场景。在这种情况下，它有助于构建虚拟和现实的测试平台环境。我们考虑在网络现实测试平台环境中使用一台笔记本电脑和\
  \ `4 Gigabyte Brix (GB-BXBT-2807)`。为了模拟无线网络中的低频通信，单独的笔记本电脑充当协调服务器的角色。模型权重在服务器上聚合并分发给用户。在算法\
  \ 1 和算法 2 中，客户端设备使用服务器模型权重在客户端数据集上训练本地模型，然后将这些权重发回服务器。因此，包含边缘设备的客户端一侧承担了比服务器计算机更大的通信负担。`Ubuntu\
  \ 20.04.4 LTS` 是预装在 `GB-BXBT-2807` 客户端上的 Ubuntu 版本。`PySyft` 框架及所有必要依赖项均预装在每个客户端上。实现联邦网络测试平台的源代码已公开。\n\
  \n这是通过对比 `BFDL` 和 `REFDL` 的模拟运行时间与其真实执行时间来完成的，使用了四个工作节点（`Alice`、`Bob`、`Charlie`\
  \ 和 `Jane`）及其分布式训练数据（如 图 1 所示）。增强调优方法产生 `64-mini-batch` 大小，用于具有两个周期迭代的 `50-round`\
  \ 联邦通信轮次。为实现高效的 `FedAvg SGD` 训练，测试批次采用 `1000` 的样本量，学习率 (`lr`) 为 `0.01`。算法 1 和算法\
  \ 2 均使用实时模型，由一个输入层、四个隐藏层 (`128–128–128–128`) 和一个输出层组成。借助所选架构，模型收敛可高效且有效地实现。\n\n\
