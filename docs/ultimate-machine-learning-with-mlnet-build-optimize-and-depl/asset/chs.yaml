  \ ML.NET 中数据编码的目的是什么？\n- 处理数据集中的缺失值\n- 缩放并归一化数据\n- 将类别数据转换为数值\n- 删除离群值\n\n5. 哪个\
  \ ML.NET API 用于根据现有特征创建新特征？\n- `FeatureGenerator`\n- `FeatureSelector`\n- `FeatureEncoder`\n\
  - `FeatureEngineeringEstimator`\n\n6. ML.NET 中数据归一化与缩放的目的是什么？\n- 处理数据集中的缺失值\n- 将类别数据转换为数值\n\
  - 将特征缩放到相似范围\n- 删除离群值\n\n7. 这种技术通过根据数据其他数据的最佳猜测来处理缺失值？\n- 独热编码\n- 数据归一化\n- 插值\n\
  - 特征工程\n\n8. ML.NET 中哪个 API 用于通过独热编码对类别特征？\n- `FeatureEncoder`\n- `CategoricalTransformer`\n\
  - `OneHotEncoding`\n- `DataEncoder`\n\n9. ML.NET 中探索性数据分析 (EDA) 的目的是什么？\n- 清洗数据集\n\
  - 特征工程\n- 识别模式和趋势\n- 数据归一化\n\n10. 这种技术用于将数据中的所有特征放在特定范围内（通常是 0 到 1 之间）？\n- 最小最大缩放\n\
  - 数据编码\n- 特征提取\n- 数据可视化\n\n\n\n\n\n# 第 5 章：ML.NET 中的机器学习任务\n\n## 引言\n欢迎阅读指南的第 5\
  \ 章，在这里我们将深入探讨通过 ML.NET 实现的各种机器学习任务。本章分为两个部分，将阐述回归、分类、聚类和异常检测的格局，且都是基于 ML.NET 的背景。加入我们，探索算法、真实世界示例，以及各项任务在各种应用中所扮演的关键作用。\n\
  \n## 章节结构\n在本章中，将涵盖以下主题：\n- ML.NET 中的机器学习任务概述\n- ML.NET 中的回归任务与算法\n- ML.NET 中的分类任务与算法\n\
  - ML.NET 中的聚类任务与算法\n- ML.NET 中的异常检测任务与算法\n\n## ML.NET 中的机器学习任务\n机器学习是一项强大的技术，允许计算机在没有显式编程的情况下学习模式并做出预测或决策。ML.NET\
  \ 是由微软开发的一款流行的机器学习框架，提供了广泛的工具和算法来执行各种机器学习任务。本节是对 ML.NET 中机器学习任务的介绍，概述了使用该框架可以完成的不同任务，以及它们在数据科学领域的意义。\n\
  \n## 机器学习任务\n机器学习任务在数据科学领域起着至关重要的作用，并改变了我们处理复杂问题的方式。在本节中，我们将深入探讨机器学习任务的定义和意义，阐明其基本概念以及对各个领域的影响。\n\
  \n![](img/image-f9ct279o.jpg) 图 5.1：机器学习任务\n\n### 理解机器学习任务\n机器学习任务是指使用机器学习技术可以完成的特定目标或任务。这些任务涉及分析数据、建立数学模型，并根据数据中识别出的模式做出预测或决策。通过利用历史数据和模式，机器学习任务使计算机能够在没有显式编程的情况下随着时间的推移不断学习并提高其性能。\n\
  \n### 二分类\n- **定义**：该任务涉及将输入数据分为两个类别之一。\n- **用例**：垃圾邮件检测、欺诈检测、情感分析。\n\n### 多类分类\n\
  - **定义**：与二分类类似，但模型将数据分为两个以上以上的类别。\n- **用例**：手写体识别、文档分类、物体识别。\n\n### 回归\n- **定义**：根据输入特征预测数值。\n\
  - **用例**：房价预测、股票价格预测、需求预测。\n\n### 聚类\n- **定义**：在没有预定义标签的情况下根据特征将相似的数据点分组在一起。\n-\
  \ **用例**：客户细分、异常检测、图像分割。\n\n### 异常检测\n- **定义**：识别数据中不符合预期行为的模式。\n- **用例**：入侵检测、欺诈检测、系统健康监控。\n\
  \n### 排序\n- **定义**：根据项目的相关性或重要性为一组项目分配排名或顺序。\n- **用例**：搜索引擎搜索结果排名、个性化推荐。\n\n###\
  \ 推荐\n- **定义**：根据用户的偏好或行为向其推荐项目或内容。\n- **用例**：电影推荐、产品推荐、内容推荐。\n\n### 预测\n- **定义**：根据历史数据预测未来值。\n\
  - **用例**：销售预测、天气预测、资源规划。\n\n### 图像分类\n- **定义**：根据图像的内容为图像分配标签。\n- **用例**：物体识别、人脸识别、医学图像分析。\n\
  \n### 物体检测\n- **定义**：识别并定位图像中的物体。\n- **用例**：自动驾驶汽车、监控系统、增强现实。\n\n\n\n\n\n# 机器学习任务的重要性\n\
  \n机器学习任务在各个领域具有巨大的意义，这得益于它们能够自动化复杂流程、从数据中提取有价值的见解，并实现数据驱动的决策。以下是突出其重要性的关键点：\n\n\
  ### 数据驱动的决策\n机器学习任务赋予了组织根据数据而非直觉或猜测做出明智决策的能力。通过分析海量数据并检测模式，机器学习模型可以提供准确的预测和可操作的见解，从而改进业务策略、优化流程并增强性能。\n\
  \n### 提高效率\n机器学习任务自动化了通常需要投入大量的人力和时间的劳动密集型流程。例如，通过聊天机器人实现客户支持自动化，或通过需求预测优化供应链管理。通过自动化重复性任务，机器学习提高了效率，降低了成本，并将人力资源释放出来用于更具价值的活动。\n\
  \n## 个性化与推荐\n机器学习任务通过分析用户的偏好、行为和历史数据，为用户创建个性化的体验。由机器学习驱动的推荐系统会向用户推荐相关的产品、电影或内容，增强用户的参与度和满意度。\n\
  \n### 欺诈检测\n异常检测作为机器学习任务，在识别欺诈活动和确保网络安全方面发挥着至关重要的作用。通过学习正常的行为模式，机器学习模型可以检测可疑活动或偏离标准的情况，防止欺诈交易、未经授权的访问和其他安全漏洞。\n\
  \n### 健康与医疗\n机器学习任务在医疗保健领域取得了显著进展，协助医疗诊断、疾病预测和个性化治疗方案。在大型数据集上训练的机器学习模型可以分析患者症状、医疗记录和遗传信息，以识别模式并做出准确预测。这有助于疾病的早期检测、个性化治疗建议以及改善患者疗。\n\
  \n## 图像与语音\n分类和聚类等机器学习任务彻底改变了图像和语音识别系统。这些任务使机器能够理解和解释视觉或听觉数据，导致脸识别、目标检测、语音转文本以及自然语言处理的发展。\n\
  \n### 预测性\n机器学习任务在预测性维护中起着作用，模型分析传感器数据和历史维护记录来预测设备故障或维护需求。这允许企业主动安排维护活动，最大限地减少停机时间并优化资源配置。\n\
  \n### 金融建模与风险\n机器学习任务在金融建模、风险评估和投资策略中起着关键作用。通过分析历史市场数据，机器学习模型可以预测股票价格、识别投资机会并评估与金融交易相关的风险。\n\
  \n# ML.NET 在不同任务中的能力概述\n\nML.NET 由微软开发，是一个强大且多功能的机器学习框架，使开发者能够将机器学习模型无缝集成到其 `.NET`\
  \ 应用程序中。该框架旨在满足各种机器学习任务，为开发者提供了一个易用且易于访问的环境。以下是 ML.NET 针对不同任务的能力概述：\n\n### 集成易于\n\
  ML.NET 与 `.NET` 生态系统无缝集成，允许开发者在现有应用程序中使用其功能。无论您是在构建 Web 应用程序、桌面软件还是云端服务，ML.NET 都为整合机器学习功能提供了一个一致且熟悉的环境。\n\
  \n### 模型部署的灵活性\nML.NET 支持多种部署场景，允许模型部署在边缘设备、云端或本地服务器上。这种灵活性确保了开发者可以选择最符合其应用程序要求的的部署方法。\n\
  \n## 广泛的任务支持\nML.NET 涵盖了广泛的机器学习任务，从传统的分类和回归到目标检测和推荐系统等更高级的任务。这种多样性使其适用于跨不同行业的广泛应用，为开发者提供了各种用用例所需的工具。\n\
  \n### 定制化与扩展性\n开发者可以轻松地定制和扩展 ML.NET 模型以满足特定需求。框架支持使用自定义算法、特征工程以及领域特定知识的结合，允许开发者根据其数据的独特特征定制模型。\n\
  \n## 无需先具备机器学习专业知识\nML.NET 的设计侧重于易用性，适用于具有不同机器学习水平的开发者。其高级级 API 和直观的设计允许开发者在无需深入理解底层机器学习算法的情况下构建和训练模型。\n\
  \n### 跨平台兼容性\nML.NET 是跨平台的，支持 Windows、Linux 和 macOS 环境。这确保了开发者创建可以在多种操作系统上无缝运行的机器学习应用程序，提升了灵活性和扩展性。\n\
  \n### 可扩展性与性能\nML.NET 在构建时考虑了性能，能够开发可扩展的机器学习应用程序。该框架支持高效的数据处理和模型推理，使其适用于具有大型数据集或实时处理要求的应用程序。\n\
  \n## 与 ML.NET Model Builder 的集成\nML.NET Model Builder 是 Visual Studio 内的一个可视化界面，为构建机器学习模型提供了简化的体验。它引导开发者完成模型构建过程，自动处理许多任务，使机器学习初学者更容易上手。\n\
  \n\n\n\n\n# 二分类分类\n\n二分类是机器学习中的一项常见任务，涉及将输入数据归类为两个可能的类别之一。在 `ML.NET`（一个由微软开发的跨平台开源机器学习框架）的背景下，二分类通过各种算法和组件实现。让我们来看一个使用\
  \ `ML.NET` 进行二分类的简单示例。假设我们有一个包含客户信息的数据集，我们想要根据年龄、收入和浏览历史等特征，预测客户会进行购买（类别 1）还是不购买（类别\
  \ 0）。\n\n## 1. 定义数据模型\n首先，我们需要定义一个表示输入数据的数据模型。在这个示例中，我们将使用一个名为类：\n\n```csharp\n\
  public class CustomerData {\n    [LoadColumn(0)] public float Age;\n    [LoadColumn(1)]\
  \ public float Income;\n    [LoadColumn(2)] public float BrowsingHistory;\n    [LoadColumn(3)]\
  \ public bool WillPurchase; // 二进制标签 (0 或 1)\n}\n```\n\n## 2. 加载并准备数据\n将数据加载到 ML.NET\
  \ 的 `IDataView` 中并将其划分为训练集和测试集：\n\n```csharp\nvar context = new MLContext(); //\
  \ 加载数据\nvar data = context.Data.LoadFromTextFile(\"path/to/your/data.csv\", separatorChar:\
  \ ','); // 将数据分为训练集和测试集\nvar split = context.Data.TrainTestSplit(data);\n```\n\n\
  ## 3. 选择并配置算法\n选择用于二分类的算法，例如逻辑回归或支持向量机。在本示例中，我们将使用逻辑回归：\n\n```csharp\nvar pipeline\
  \ = context.Transforms.Conversion.MapValueToKey(\"Label\", \"WillPurchase\")\n \
  \   .Append(context.Transforms.Concatenate(\"Features\", \"Age\", \"Income\", \"\
  BrowsingHistory\"))\n    .Append(context.Transforms.NormalizeMinMax(\"Features\"\
  ))\n    .Append(context.Transforms.Conversion.MapKeyToValue(\"Label\"))\n    .Append(context.Transforms.Conversion.MapKeyToValue(\"\
  PredictedLabel\"))\n    .Append(context.Transforms.Conversion.MapKeyToValue(\"Probability\"\
  ))\n    .Append(context.Transforms.Conversion.MapKeyToValue(\"Score\"))\n    .Append(context.Transforms.Conversion.MapKeyToValue(\"\
  PredictedLabel\"));\nvar trainer = context.BinaryClassification.Trainers.LogisticRegression(labelColumnName:\
  \ \"Label\", maximumNumberOfIterations: 100);\nvar trainingPipeline = pipeline.Append(trainer);\n\
  ```\n\n## 4. 训练模型\n使用训练数据训练模型：\n\n```csharp\nvar model = trainingPipeline.Fit(split.TrainSet);\n\
  ```\n\n## 5. 评估模型\n在测试数据上评估模型：\n\n```csharp\nvar predictions = model.Transform(split.TestSet);\n\
  var metrics = context.BinaryClassification.Evaluate(predictions);\nConsole.WriteLine($\"\
  Accuracy: {metrics.Accuracy}\");\nConsole.WriteLine($\"Log-loss: {metrics.LogLoss}\"\
  );\nConsole.WriteLine($\"AUC: {metrics.AreaUnderRocCurve}\");\n```\n\n## 6. 进行预测\n\
  使用训练过的模型对新数据进行预测：\n\n```csharp\nvar newData = context.Data.LoadFromTextFile(\"path/to/new/data.csv\"\
  , separatorChar: ',');\nvar predictions = model.Transform(newData);\nvar predictedData\
  \ = context.Data.CreateEnumerable(predictions, false);\n```\n\n此示例演示了执行二分类涉及的基本步骤。需要注意的是，算法的选择和评估指标可能会根据数据的特征而异。\n\
  \n### 多类分类\n\n多类分类是一项机器学习任务，目标是将输入数据分配到多个类别中。在 `ML.NET`（一个开源机器学习框架）的背景下，可以使用各种算法实现多类分类。让我们来看一个分类的示例。\n\
  \n## 1. 定义数据模型\n从定义表示输入数据的数据模型开始。在本示例中，我们假设有一个具有花瓣长度、花瓣宽度和花萼长度特征的数据集：\n\n```csharp\n\
  public class FlowerData {\n    [LoadColumn(0)] public float SepalLength;\n    [LoadColumn(1)]\
  \ public float SepalWidth;\n    [LoadColumn(2)] public float PetalLength;\n    [LoadColumn(3)]\
  \ public float PetalWidth;\n    [LoadColumn(4)] public string FlowerType;\n}\n```\n\
  \n## 2. 加载并准备数据\n将数据加载到 ML.NET 的 `IDataView` 中并将其划分为训练集和测试集：\n\n```csharp\nvar context\
  \ = new MLContext();\nvar data = context.Data.LoadFromTextFile(\"path/to/your/data.csv\"\
  , separatorChar: ',');\nvar split = context.Data.TrainTestSplit(data);\n```\n\n\
  ## 3. 选择并配置算法\n选择用于多类分类的算法，例如决策树或神经网络。在本示例中，我们使用决策树：\n\n```csharp\nvar pipeline\
  \ = context.Transforms.Conversion.MapValueToKey(\"Label\", \"FlowerType\")\n   \
  \ .Append(context.Transforms.Concatenate(\"Features\", \"SepalLength\", \"SepalWidth\"\
  , \"PetalLength\", \"PetalWidth\"))\n    .Append(context.Transforms.Conversion.MapKeyToValue(\"\
  Label\"))\n    .Append(context.Transforms.Conversion.MapKeyToValue(\"PredictedLabel\"\
  ));\nvar trainer = context.MulticlassClassification.Trainers.SdcaNonCalibrated(labelColumnName:\
  \ \"Label\", maximumNumberOfIterations: 100);\nvar trainingPipeline = pipeline.Append(trainer);\n\
  ```\n\n## 4. 训练模型\n使用训练数据训练模型：\n\n```csharp\nvar model = trainingPipeline.Fit(split.TrainSet);\n\
  ```\n\n## 5. 评估模型\n在测试数据上评估模型：\n\n```csharp\nvar predictions = model.Transform(split.TestSet);\n\
  var metrics = context.MulticlassClassification.Evaluate(predictions);\nConsole.WriteLine($\"\
  Log-loss: {metrics.LogLoss}\");\nConsole.WriteLine($\"Per-class Log-loss: {string.Join(\"\
  , \", metrics.PerClassLogLoss)}\");\n```\n\n## 6. 进行预测\n使用训练过的模型对新数据进行预测：\n\n```csharp\n\
  var newData = context.Data.LoadFromTextFile(\"path/to/new/data.csv\", separatorChar:\
  \ ',');\nvar predictions = model.Transform(newData);\nvar predictedData = context.Data.CreateEnumerable(predictions,\
  \ false);\n```\n\n### 输出\n```Log-loss: 0.12\nPer-class Log-loss: 0.08, 0.14, 0.10\n\
  \n对新数据的预测：\n| SepalLength | SepalWidth | PetalLength | PetalWidth | FlowerType |\
  \ PredictedLabel |\n|------------|-----------|-------------|-----------|------------|--------------|\n\
  | 5.1 | 3.5 | 1.4 | 0.2 | Setosa | Setosa |\n| 6.2 | 2.9 | 4.3 | 1.3 | Versicolor\
  \ | Versicolor |\n| 7.3 | 3.3 | 6.3 | 2.5 | Virginica | Virginica |\n```\n\n\n\n\
  \n\n### 回归\n\n机器学习中的回归涉及根据输入特征预测一个连续的数值值。在微软的开源机器学习框架 `ML.NET` 中，可以使用多种算法执行回归任务。让我们通过一个假设的数据集，走过一个使用\
  \ `ML.NET` 进行回归分析的示例。\n\n## 1. 定义数据模型\n首先从定义表示输入数据的数据模型开始。在这个示例中，假设我们有一个房屋数据集，其中包含平方数、卧室数量和浴室浴室数量等特征。目标是预测房屋的价格，价格是一个连续的数值值。\n\
  \n```csharp\npublic class HouseData {\n    [LoadColumn(0)] public float SquareFootage;\n\
  \    [LoadColumn(1)] public float Bedrooms;\n    [LoadColumn(2)] public float Bathrooms;\n\
  \    [LoadColumn(3)] public float Price; // 回归目标\n}\n```\n\n## 2. 加载并准备数据\n将数据加载到\
  \ `ML.NET` 的 `IDataView` 中，并将其拆分为训练集和测试集。\n\n```csharp\nvar context = new MLContext();\
  \ // Load data\nvar data = context.Data.LoadFromTextFile(\"path/to/your/data.csv\"\
  , separatorChar: ','); // Split the data into training and testing sets\nvar split\
  \ = context.Data.TrainTestSplit(data);\n```\n\n## 3. 选择并配置算法\n选择一种回归算法，例如线性回归或决策森林。对于这个示例，我们使用线性回归：\n\
  \n```csharp\nvar pipeline = context.Transforms.Concatenate(\"Features\", \"SquareFootage\"\
  , \"Bedrooms\", \"Bathrooms\")\n    .Append(context.Transforms.Conversion.MapValueToKey(\"\
  Label\", \"Price\"))\n    .Append(context.Transforms.Conversion.MapKeyToValue(\"\
  Label\"))\n    .Append(context.Transforms.Conversion.MapKeyToValue(\"Score\"))\n\
  \    .Append(context.Regression.Trainers.Sdca(labelColumnName: \"Label\", maximumNumberOfIterations:\
  \ 100));\nvar trainingPipeline = pipeline.Append(context.Transforms.Conversion.MapKeyToValue(\"\
  Score\"));\n```\n\n## 4. 训练模型\n使用训练数据训练模型。\n\n```csharp\nvar model = trainingPipeline.Fit(split.TrainSet);\n\
  ```\n\n## 5. 评估模型\n在测试数据上评估模型。\n\n```csharp\nvar predictions = model.Transform(split.TestSet);\n\
  var metrics = context.Regression.Evaluate(predictions);\nConsole.WriteLine($\"Mean\
  \ Absolute Error: {metrics.MeanAbsoluteError}\");\nConsole.WriteLine($\"Root Mean\
  \ Squared Error: {metrics.RootMeanSquaredError}\");\n```\n\n## 6. 进行预测\n使用训练好的模型对新数据进行预测。\n\
  \n```csharp\nvar newData = context.Data.LoadFromTextFile(\"path/to/new/data.csv\"\
  , separatorChar: ',');\nvar predictions = model.Transform(newData);\nvar predictedData\
  \ = context.Data.CreateEnumerable(predictions, reuseRowObject: false);\n```\n\n\
