  \  .Append(context.Transforms.Conversion.MapKeyToValue(\"MovieId\"))\n  .Append(context.Recommendation().Trainers.MatrixFactorization(\"\
  Rating\"));\n```\n\n### 4. 训练模型\n使用数据训练模型。\n\n```csharp\nvar model = pipeline.Fit(data);\n\
  ```\n\n### 5. 进行预测\n使用训练后的模型对同一份数据进行预测。\n\n```csharp\nvar predictions = model.Transform(data);\n\
  var recommendationPredictions = context.Data.CreateEnumerable(predictions, reuseRowObject:\
  \ false);\n```\n\n### 6. 分析结果\n分析推荐预测结果。\n\n```csharp\nforeach (var prediction in\
  \ recommendationPredictions) {\n    Console.WriteLine($\"UserId: {prediction.UserId},\
