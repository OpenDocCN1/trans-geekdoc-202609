  \n# 第 4 章：为 ML.NET 收集与准备数据\n\n## 引言\n\n数据收集和准备是机器学习（ML）过程中的关键步骤。机器学习模型中使用的数据质量和数量直接影响其准确性和可靠性。因此，在将数据输入机器学习算法之前，进行收集、清洗、预处理和转换是至关重要的。本章重点介绍\
  \ `ML.NET` 用于为机器学习模型准备数据的数据加载和预处理技术。\n\n在本章中，我们将使用来自 UCI 机器学习库的心脏病数据集，该数据集包含 303\
  \ 条患者记录，13 个与心脏病相关的特征。我们将演示将数据加载到 `ML.NET`、进行清洗和预处理，并将其转换为机器学习算法可以使用的格式的过程。\n\n\
  我们将首先介绍 `ML.NET` 的数据加载 API，包括 `TextLoader` 和 `DatabaseLoader`，并展示如何使用它们从各种源加载数据。接下来，我们将讨论各种数据预处理技术，如数据清洗、数据归一化和缩放以及数据编码。我们将通过代码示例演示如何使用这些技术，并对其优缺点进行解释。\n\
  \n在本章结束时，你将对如何使用 `ML.NET` 加载和预处理数据有深入的理解，这对于构建准确可靠的机器学习模型至关重要。\n\n## 结构\n\n在本章将涵盖以下主题：\n\
  - `ML.NET` 中的数据收集与准备概述\n- 数据清洗和预处理技术\n- 使用 `ML.NET` API 进行特征工程\n- 数据归一化与缩放\n- 使用\
  \ `ML.NET` 进行数据可视化和探索性数据分析 (EDA)\n\n\n\n\n\n## 数据收集\n\n心脏病数据集（Heart Disease dataset）是\
  \ Kaggle 上一个流行的数据集，包含了接受心脏病评估的患者信息。本章使用的数据集可以通过以下链接从 Kaggle 下载：https://www.kaggle.com/datasets/cherngs/heart-disease-cleveland-uci。该数据集收集自瑞士的克利夫兰医院基金会，通常用于分类和回归分析。该数据集包含\
  \ 303 条患者记录，每条记录包含 13 个属性（见下表），描述了患者的健康状况，如年龄、性别、胸痛类型、血压、血清胆固醇水平等。目标变量是是否患心脏病，值为\
  \ 0 表示无心脏病，大于 0 表示患有心脏病。\n\n- `age`: 年龄（岁）\n- `sex`: 性别（1 = 男性; 0 = 女性）\n- `cp`:\
  \ 胸痛类型\n    - 数值 0: 典型心绞痛\n    - 数值 1: 非典型心绞痛\n    - 数值 2: 非心绞性疼痛\n    - 数值 3: 无症状\n\
  - `trestbps`: 静息血压（入院时的血压，单位 mm Hg）\n- `chol`: 血清胆固醇（mg/dl）\n- `fbs`:（空腹血糖 > 120\
  \ mg/dl）（1 = 是; 0 = 否）\n- `restecg`: 静息心电图结果\n    - 数值 0: 正常\n    - 数值 1: 有 ST-T\
  \ 波异常（T 波倒置和/或 ST 抬高或压低 > 0.05 mV）\n    - 数值 2: 根据 Estes 标准显示可能或肯定的左心室肥大\n- `thalach`:\
  \ 最大心率\n- `exang`: 运动诱发心绞痛（1 = 是; 0 = 否）\n- `oldpeak`: 相较于休息运动引起的 ST 段压\n- `slope`:\
  \ 运动峰值 ST 段的斜率\n    - 数值 0: 上斜\n    - 数值 1: 平直\n    - 数值 2: 下斜\n- `ca`: 荧光造影显示的号血管数量（0-3）\n\
  - `thal`: 0 = 正常；1 = 固定缺损；2 = 可逆缺损\n- 以及标签\n- `condition`: 0 = 无疾病，1 = 有疾病\n\n以下是数据集前几行的快照：\n\
  ![](img/image-eewsdeqw.jpg)\n表 4.1: 数据集的前几行\n\n在本章的后续章节中，我们将探索使用 ML.NET API 进行数据清洗、预处理、特征工程、归一化、缩放和探索性数据分析的各种技术。我们将在整个章节中使用此数据集作为实践示例，演示这些技术的使用。\n\
  \n## ML.NET 的数据加载 API\n\nML.NET 提供了各种数据加载 API，用于从文本文件、CSV 文件和数据库等各种源导入数据。ML.NET\
  \ 中常用的两种数据加载 API 是 `TextLoader`。在本节中，让我们详细查看如何使用这两种方法来加载患者数据。\n\n### TextLoader\n\
  \n`TextLoader` 是 ML.NET 提供的数据加载 API 之一，用于从文本文件中加载结构化数据。它可以处理整数、浮点和字符串等各种数据类型，并自动检测和处理缺失值。\n\
  \n该 API 允许你使用架构定义来指定输入数据的格式。该架构定义指定了输入数据的列名、数据类型和数据顺序。你可以使用 `TextLoader.Column`\
  \ 方法来定义架构。\n\n下面的代码段展示了如何使用 `TextLoader` API 将逗号分隔值（CSV）文件加载到 ML.NET `DataView`\
  \ 中：\n\n```csharp\nusing Microsoft.ML;\nusing Microsoft.ML.Data;\n\n// 定义输入数据的架构\n\
  var schema = new TextLoader.Column[]\n{\n  new TextLoader.Column(\"Age\", DataKind.Int32,\
  \ 0),\n  new TextLoader.Column(\"Gender\", DataKind.String, 1),\n  new TextLoader.Column(\"\
  Weight\", DataKind.Single, 2),\n  new TextLoader.Column(\"Height\", DataKind.Single,\
  \ 3),\n  new TextLoader.Column(\"BloodPressure\", DataKind.String, 4),\n  new TextLoader.Column(\"\
  Cholesterol\", DataKind.Single, 5)\n};\n\n// 使用定义的架构创建 TextLoader 实例\nvar dataLoader\
  \ = mlContext.Data.CreateTextLoader(schema);\n\n// 将数据加载到 DataView\nvar dataView\
  \ = dataLoader.Load(\"path/to/data.csv\");\n```\n\n在此示例中，`schema` 变量定义了输入数据的架构，指定了列名、数据类型和顺序。变量创建一个使用定义架构的\
  \ `TextLoader` 实例。最后，`dataView` 变量通过 `TextLoader` 实例的 `Load` 方法将数据从 CSV 文件加载到 `DataView`。\n\
  \n**总结：**\n- `TextLoader` 非常灵活，可以处理各种文本格式的结构化数据，包括 CSV、TSV 和其他分隔文本文件。\n- 它可以自动检测并处理输入数据中的缺失值。\n\
  - `TextLoader` 以可扩展的方式加载大型数据集，能够处理无法放入内存的数据集。\n- `TextLoader` 允许定义输入数据的架构，有助于确保数据的一性和准确性。\n\
  \n**局限性：**\n- `TextLoader` 主要用于加载文本格式的结构化数据，可能不适用于图像或音频或其他类型的数据。\n- `TextLoader`\
  \ 需要预先定义输入数据的架构，这可能非常耗时并需要某些领域知识。\n- 性能可能会受到输入数据架构复杂性和数据集大小的影响。\n\n\n\n\n\n### DatabaseLoader\n\
  \n对于扩展性项目，通常需要从各种数据库而非扁平文件加载数据。顾名所示，它用于从数据库加载数据。它可以连接到各种数据库，包括 `SQL Server`、`MySQL`\
  \ 和 `PostgreSQL`，并使用 SQL 查询检索数据。`DatabaseLoader` 是 `ML.NET`提供的一个 API，允许你直接将数据从关系型数据库加载到你的机器学习模型中。通过\
  \ `DatabaseLoader`，你可以轻松加载可能无法放入内存中的海量数据，以及其他通过 `ODBC` 访问的源。\n\n要使用它，你首先需要定义输入数据的模式（schema）。你可以通过创建一个映射到数据库中表的类来实现，其中每个属性代表表中的一列。然后，你可以使用\
  \ `DatabaseLoader` 将数据从数据库加载到你定义的类的 `IEnumerable` 中。\n\n下面是一个是如何使用 `DatabaseLoader`\
  \ 从 `SQL Server` 数据库加载数据的代码示例：\n\n```csharp\nusing Microsoft.ML.Data;\nusing Microsoft.ML.Transforms;\n\
  using System.Data.SqlClient;\n\npublic class PatientData\n{\n    [LoadColumn(0)]\n\
  \    public int PatientID { get; set; }\n    [LoadColumn(1)]\n    public int ProviderID\
  \ { get; set; }\n    [LoadColumn(2)]\n    public string Gender { get; set; }\n \
  \   [LoadColumn(3)]\n    public float Age { get; set; }\n    [LoadColumn(4)]\n \
  \   public float ClaimAmount { get; set; }\n}\n\nvar connectionString = \"Server=yourserver;Database=yourdatabase;User\
  \ Id=yourusername;Password=yourpassword;\";\nvar query = \"SELECT PatientID, ProviderID,\
  \ Gender, Age, ClaimAmount FROM PatientData\";\n\nvar loader = mlContext.Data.CreateDatabaseLoader();\n\
  loader.ConnectionString = connectionString;\nloader.SqlCommand = query;\n\nvar data\
  \ = loader.Load();\n```\n\n在此段代码中，定义了一个表示输入数据模式的类 `PatientData`。然后我们创建了一个 `DatabaseLoader`\
  \ 对象，并指定了连接字符串和 SQL 查询以从数据库加载数据。最后，我们使用 `Load` 方法将数据加载到 `PatientData` 的 `IEnumerable`\
  \ 中。\n\n### DatabaseLoader 的优势\n- `DatabaseLoader` 可以直接从数据库加载数据，这在处理无法放入内存的巨量数据时非常方便。\n\
  - 它支持广泛的数据库管理系统（DBMS），使得从不同类型的数据库加载数据变得简单。\n- `DatabaseLoader` 可用于分批加载数据，这有助于优化内存使用并提高性能。\n\
  - 它允许你定义输入数据的模式，这有助于确保数据的一性和准确性。\n\n### DatabaseLoader 的局限性\n- `DatabaseLoader`\
  \ 需要指定连接字符串，如果管理不当，可能会带来安全风险。\n- 它需要安装额外的驱动才能访问某些数据库管理系统。\n- `DatabaseLoader` 主要设计用于从关系型数据库加载数据，可能不适用于加载文本或图像等其他类型。\n\
  - `DatabaseLoader` 的性能可能会受到输入数据模式复杂性和数据集大小的影响。\n\n# 数据质量和完整性的预处理\n\n数据质量和完整性是任何数据集的关键方面，特别是在医疗行业。准确且完整的数据对于确保机器学习算法能够做出准确预测并帮助诊断和治疗患者至关重要。可以从\
  \ Kaggle 网站下载的心病数据集是一个常用数据集，包含了患有和不患心脏病患者的数据。它包含了年龄、性别、血压、胆固醇水平等多种特征，可以帮助预测患者是否患有心脏病。\n\
  \n不准确或不完整的数据会导致预测不准确，并可能损害医疗行业的患者。因此，仔细审查和清理心脏病数据集以确保其准确、完整且没有缺失值至关重要。在本章的后续章节中，我们将探索各种数据清洗、预处理和探索性数据分析技术，这些技术可以帮助确保数据集的质量和完整性。\n\
  \n数据预处理是机器学习模型准备数据的关键步骤。它涉及各种技术，如数据清洗、归一化、缩放和编码，以确保数据处于算法易理解的格式。适当的数据预处理可以帮助提高机器学习模型的准确性和性能，从而带来更准确的预测和更好的患者治疗结果。\n\
  \n\n\n\n\n### 数据清洗\n\n数据清洗是识别并纠正或删除数据集中的错误、不一致之处和缺失值的过程。在心脏病数据集中，你可能需要处理某些特征（如胆固醇水平或血压）的缺失值或不一致数据。处理缺失数据的常用技术包括插补（即根据数据集中的其他数据通过最佳猜测来替换缺失值）或删除包含缺失数据的行或列。\n\
  \n### 删除缺失数据\n\n处理缺失数据的一种常用技术是直接删除任何包含缺失值的行或列。你可以使用 `ML.NET` 中 `DataOperationsCatalog`\
  \ 的 `DropMissingValues` 方法来实现此点。然而，使用这种技术时应谨慎，因为删除过多数据可能会导致信息丢失，并影响机器学习模型的性能。\n\n\
  ```sharp\n// 过滤掉任何列中包含 NaN 值的行\nvar dataWithoutMissingValues = mlContext.Data.FilterRowsByMissingValues(dataView,\
  \ new[] { \"Age\", \"Sex\", \"CP\", \"Trestbps\", \"Chol\", \"Fbs\", \"Restecg\"\
  , \"Thalach\", \"Exang\", \"Oldpeak\", \"Slope\", \"Ca\", \"Thal\" });\n```\n\n\
  ## 插补缺失数据\n\n处理缺失数据的另一种技术是插补，即根据数据集中的其他数据通过最佳猜测来替换缺失值。这可以使用统计方法完成，例如均值插补（用特征的平均值替换缺失值）或回归插补（使用回归模型根据数据集中的其他特征来预测缺失值）。\n\
  \n在 `ML.Net` 中，你可以使用 `ML.NET` 中 `DataOperationsCatalog` 的 `ReplaceMissingValues`\
  \ 方法来完成此操作。该方法支持多种插补策略，例如用非缺失值的均值或中位数来替换缺失值。\n\n```sharp\n// 这里我们使用均值替换模式，它用非缺失值的平均值来替换该值。\n\
  var meanPipeline = mlContext.Transforms.ReplaceMissingValues(\"MissingReplaced\"\
  , \"Features\", MissingValueReplacingEstimator.ReplacementMode.Mean);\n```\n\n###\
  \ 数据转换\n\n有时，数据集中的数据在有效用于机器学习模型之前可能需要进行转换。例如，你可能需要将数据转换为不同的数据类型，或者对某个特征应用数学函数。`ML.NET`\
  \ 的 `DataOperationsCatalog` 提供了几种转换数据的方法。\n\n```sharp\n// 数据转换：表达式 - 对 \"thalach\"\
  \ 列应用数学函数\nvar pipeline = mlContext.Transforms.Expression(\"ThalachDividedBy10\"\
  , \"thalach/ 10.0\");\n\n// 训练并转换数据\nvar transformedData = pipeline.Fit(dataView).Transform(dataView);\n\
  ```\n\n## 数据归一化与标准化\n\n归一化和标准化是重要的数据预处理技术，用于标准化数据集中特征的范围和尺度。在心脏病数据集中，不同的特征具有不同的单位和范围，这可能使得机器学习算法难以比较和从数据中学习。例如，数据集中的年龄特征范围在\
  \ 29 到 77 岁之间，而代表最大心率的 `thalach` 特征范围则是每分钟 71 到 202 次。\n\n标准化和极差值缩放是用于对数据集特征进行归一化和缩放的两种常用技术。标准化涉及将每个特征的值转换为具有均值\
  \ 0 和标准差 1 的。当数据分布不是正态分布时，这种技术非常有用。标准化的公式为：![](img/8ys0ahj)，其中 `x` 是特征的值，`μ` 是特征的均值，`σ`\
  \ 是标准差。\n\n极差值缩放涉及将每个特征的值缩放到 0 到 1 之间的范围。当特征值的范围变化很大时，这种技术非常有用。极差值缩放的公式为：![](img/7s6dxpc)。使用这些技术，我们可以确保心脏病数据集中的所有特征具有相似的尺度，特征特征在量级上占据主导地位。这有助于提高机器学习算法的准确性。\n\
  \n## 数据编码\n\n数据编码是为机器学习模型准备类别数据的关键步骤。大多数机器学习算法无法使用原始形式的类别数据，因为它们需要数值输入。因此，需要使用编码技术将类别数据转换为数值格式。\n\
  \n常用的编码技术之一是独热编码（One-hot Encoding）。在独热编码中，特征的每个可能值都表示新列中的二进制值。例如，如果我们有一个具有三个可能值（红色、绿色、蓝色）的类别特征“颜色”，我们将创建三个新列\
  \ `color_red`、`color_green` 和 `color_blue`。每列包含一个指示该值是否存在二进制值。\n\n另一种编码技术是标签编码（Label\
  \ Encoding），为类别特征的每个可能值分配一个唯一的整数标签。例如，在上述的“颜色”特征中，“红色”可能被分配标签 0，“绿色”可能被分配标签 1，“蓝色”可能被分配标签\
  \ 2。\n\n需要注意的是，编码技术的选择取决于特定的数据集和所使用的机器学习算法。在某些情况下，独热编码可能更合适，而在其他情况下，标签编码可能更适用。还需要确保编码是可逆的，以便在必要时恢复原始类别值。在心脏病数据集中，有多个类别特征（如“性别”和“cp”），它们在使用机器学习模型之前可能需要进行编码。根据所使用的机器学习算法和问题的具体要求，可以使用独热编码或标签编码。\n\
  \n\n\n\n\n# ML.NET 中的数据加载与清洗代码\n\n在这里我们将演示如何使用这些 API 对患者数据进行预处理。以下是针对心脏病 UCI 数据集使用\
  \ ML.NET 进行数据预处理的代码段说明：\n\n### 导入库\n首先，我们需要为代码段导入必要的库。我们将使用 `ML.NET`，这是一个由微软开发的机器学习框架。\n\
  \n```cs\nusing Microsoft.ML;\nusing Microsoft.ML.Data;\nusing Microsoft.ML.Transforms;\n\
  ```\n\n## 加载数据\n此部分使用 `DataView` 的 `LoadFromTextFile` 方法加载数据，并使用提供的 `HeartDiseaseData`\
  \ 类作为输入数据类型。`path` 参数是 CSV 文件的路径，`separatorChar` 是文件中使用的分隔符，`hasHeader` 指明文件是否包含标题行。\n\
  \n```cs\nvar schema = new TextLoader.Column[] {\n  new TextLoader.Column(\"Age\"\
  , DataKind.Int32, 0),\n  new TextLoader.Column(\"Gender\", DataKind.String, 1),\n\
  \  new TextLoader.Column(\"Weight\", DataKind.Single, 2),\n  new TextLoader.Column(\"\
  Height\", DataKind.Single, 3),\n  new TextLoader.Column(\"BloodPressure\", DataKind.String,\
  \ 4),\n  new TextLoader.Column(\"Cholesterol\", DataKind.Single, 5),\n  new TextLoader.Column(\"\
  thalac\", DataKind.Int32, 0)\n};\nvar mlContext = new MLContext();\n\n// 使用定义的 schema\
  \ 创建 TextLoader 实例\nvar dataLoader = mlContext.Data.CreateTextLoader(schema);\n\n\
  // 将数据加载到 DataView\nvar dataView = dataLoader.Load(\"heart_cleveland_upload.csv\"\
  );\n```\n\n### 数据\n此部分使用 `Transforms` 的 `FilterRowsByMissingValues` 方法移除缺失值的行。在示例中，它会移除掉\
  \ \"Chol\" 列（胆固醇）缺失的行。生成的 `IDataView` 对象存储在 `filteredData` 中。\n\n```cs\n// 过滤掉 \"\
  Cholesterol\" 列中包含 NaN 值的行\nvar filteredData = mlContext.Data.FilterRowsByMissingValues(dataView,\
  \ new[] { \"Cholesterol\" });\n\n// 这里我们使用均值替换模式，将值替换为非缺失值的平均值\nvar meanPipeline\
  \ = mlContext.Transforms.ReplaceMissingValues(\"MissingReplaced\", \"Features\"\
  , MissingValueReplacingEstimator.ReplacementMode.Mean);\n\n// 拟合并转换数据\nvar transformedData1\
  \ = pipeline.Fit(dataView).Transform(transformedData);\n```\n\n### 数据归一化与缩放\n此部分使用\
  \ `Transforms` 的 `NormalizeMinMax` 方法对数据进行归一化。在示例中，它根据列中的最小值和最大值将 \"Age\" 列归一化到\
  \ 0 到 1 之间。生成的 `IDataView` 对象存回 `transformedData`。\n\n```cs\n// 示例：MinMaxScaler\
  \ - 归一化 \"Age\" 列\nvar pipeline = mlContext.Transforms.NormalizeMinMax(\"NormalizedAge\"\
  , \"Age\")\n  .Append(mlContext.Transforms.Conversion.MapKeyToValue(\"AgeScaled\"\
  , \"NormalizedAge\"));\n\n// 拟合并转换数据\nvar transformedData = pipeline.Fit(dataView);\n\
  ```\n\n### 数据转换\n可以根据需求对数据进行转换。\n\n```cs\n// 数据转换：对 thalach 应用数学函数\nvar pipeline\
  \ = mlContext.Transforms.Expression(\"ThalachDividBy10\", \"thalach / 10\");\n\n\
  // 拟合并转换数据\nvar transformedData = pipeline.Fit(dataView).Transform(dataView);\n\
  ```\n\n## 使用 ML.NET API 进行特征工程\n特征工程是机器学习中的关键步骤，它涉及将原始数据转换为有助于提高模型性能的有意义的特征。模型使用的特征质量会对结果产生巨大影响。\n\
  \n### 特征工程的优势\n- **改进模型**：特征工程可以减少噪声或无关特征对模型的影响。\n- **增强模型**：特征工程可以帮助提高模型的可解释性。\n\
  - **减少**：通过选择和构建最有信息量的特征，我们可以降低模型的过拟合风险。\n\n### ML.NET 工程 API\nML.NET 提供了多种用于特征工程的\
  \ API，包括：\n- **Copy**：该 API 允许通过复制现有列在数据集中创建一个新列。您可以使用它在转换之前进行备份。\n- **OneHotEncoding**：该\
  \ API 用于分类特征的独热编码。它将分类特征转换为二进制向量，特征的每个可能值由单独的列表示。\n- **LabelEncoding**：该 API 用于分类特征的标签编码。它将分类特征的唯一值映射为唯一的整数。\n\
  - **MissingValues**：该 API 用于处理数据集中的缺失值。它允许使用默认值或非缺失值的平均值/中位数替换缺失值。\n- **NormalizingEstimator**：该\
  \ API 用于数据集中的数值特征进行缩放。它允许将每个特征缩放到均值为零、标准差为一。\n- **PCA**：该 API 用于降维。它允许通过将特征转换为较小的主成分来减少数据集中的特征数量。\n\
  \n## 从患者数据工程新特征的 API\n在心脏病数据集中，我们拥有如年龄、性别、血压、胆固醇水平等多个特征。然而，我们可以利用领域知识创建有助于提高模型性能的新特征。例如，如果数据中提供了身高和体重，我们可以计算每位患者的体重指数（BMI）。\n\
  \n以下是一个使用 ML.NET API 从患者数据计算 BMI 特征的示例代码：\n\n```cs\n// Map - 添加新列 \"BMI\" 并计算其值\n\
  var pipeline = mlContext.Transforms.Conversion.MapValue(\n  \"BMI\",\n  \"Weight\"\
  ,\n  \"Height\",\n  (weight, height) => weight / (height * height)\n);\n```\n\n\n\
  \n\n\n## 动手练习\n\n以下是对某些动手练习的详细说明：\n\n### 数据清洗\n从心脏病数据集中删除重复行，并验证新的行数。\n\n```csharp\n\
  // 使用定义的模式创建 TextLoader 实例\nvar dataLoader = mlContext.Data.CreateTextLoader(schema);\n\
  // 将数据加载到 DataView 中\nvar dataView = dataLoader.Load(\"heart_cleveland_upload.csv\"\
  );\n// 根据所有列删除重复行\nvar noDupsDataView = mlContext.Data.Equals(dataView);\n// 获取原始数据和过滤后的行数\n\
  var originalRowCount = mlContext.Data.CreateEnumerable(dataView, reuseRowObject:\
  \ false).Count();\nvar noDupsRowCount = mlContext.Data.CreateEnumerable(noDupsDataView,\
  \ reuseRowObject: false).Count();\n// 打印结果\nConsole.WriteLine($\"Original data had\
  \ {originalRowCount} rows. After removing duplicates, there are {noDupsRowCount}\
  \ rows.\");\n```\n\n最后，我们新的新的数据视图上使用 `GetRowCount()` 方法来获取删除重复后的行数，并将其打印到控制台。\n\
  `Original data had {originalRowCount} rows. After removing duplicates, there are\
  \ {noDupsRowCount} rows.`\n\n使用均值或中位数插值等填充技术处理心脏病数据集中的缺失值。\n\n```csharp\n// 使用定义的模式创建\
  \ TextLoader 实例\nvar dataLoader = mlContext.Data.CreateTextLoader(schema);\n// 将数据加载到\
  \ DataView 中\nvar dataView = dataLoader.Load(\"heart_cleveland_upload.csv\");\n\
  // 这里我们使用均值替换模式，将值替换为非缺失值的平均值。\nvar meanPipeline = mlContext.Transforms.ReplaceMissingValues((\"\
  Chol\", \"trestbps\", \"thalach\"), MissingValueReplacingEstimator.ReplacementMode.Mean);\n\
  // 拟合并转换数据\nvar transformedData1 = pipeline.Fit(dataView).Transform(transformedData);\n\
  ```\n\n此代码可用于将“chol”、“trestbps”和“thalach”特征中的缺失值替换为它们各自的平均值。使用 `MissingValueReplacingEstimator`\
  \ 方法执行插值。生成的预处理数据视图可用于进一步的分析或建模。\n\n### 特征工程\n从心脏病数据集中现有特征创建新特征，例如计算 BMI 或创建年龄组。\n\
  \n```csharp\nvar pipeline5 = mlContext.Transforms.Conversion.MapValue(\n  \"BMI\"\
  ,\n  \"Weight\",\n  \"Height\",\n  (weight, height) => weight / (height * height)\n\
  );\n// 拟合并转换数据\nvar transformedData22 = pipeline.Fit(dataView).Transform(dataView);\n\
  ```\n\n对心脏病数据集中的类别特征进行独热编码（one-hot encoding）或标签编码（label encoding）。\n\n```csharp\n\
  var pipeline4 = mlContext.Transforms.Categorical.OneHotEncoding(\"EncodedChestPainType\"\
  , \"ChestPainType\");\n// 拟合并转换数据\nvar transformedData1111 = pipeline.Fit(dataView).Transform(dataView);\n\
  ```\n\n此代码加载心脏病数据集，定义要进行独热编码的类别列，将独热编码转换应用于这些类别列，预览转换后的数据，最后将转换应用于完整数据集。请注意，特征将根据需要进行替换。\n\
  \n### 数据归一化与缩放\n使用标准化或最小最大缩放等技术对心脏病数据中的特征值进行归一化。\n\n要使用标准化或最小最大缩放等技术对心脏病数据集中的特征值进行归一化，你可以利用\
  \ ML.NET 提供的归一化功能。以下是一个 C# 示例函数，演示了如何使用 ML.NET 执行标准化和最小最大缩放：\n\n```csharp\n// 示例：MaxScaler\
  \ - 归一化 \"Age\" 列\nvar pipeline = mlContext.Transforms.NormalizeMinMax(\"NormalizedAge\"\
  , \"Age\");\n// 拟合并转换数据\nvar transformedData = pipeline.Fit(dataView).Transform(dataView);\n\
  ```\n\n## 结论\n本章深入探讨了 ML.NET 框架中数据收集、准备技术以及特征工程的核心作用。\n\n在第 5 章中，我们将学习 ML.NET 的各种机器学习任务，涵盖回归、分类、聚类和异常检测。通过全面的覆盖和示例说明，本章不仅阐明了算法的各个领域，还让读者掌握了应用知识。\n\
