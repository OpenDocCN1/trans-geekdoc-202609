  , separatorChar: ',');\n```\n\n### 3. 选择并配置算法\n选择一种推荐算法，例如矩阵分解。根据需要指定超参数。\n\n```csharp\n\
  var pipeline = context.Transforms.Conversion.MapValueToKey(\"UserId\")\n  .Append(context.Transforms.Conversion.MapValueToKey(\"\
