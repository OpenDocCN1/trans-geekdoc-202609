  , separatorChar: ',');\n```\n\n## 3. 选择并配置算法\n选择一种聚类算法，例如 K-means。\n\n```csharp\n\
  var pipeline = context.Transforms.Concatenate(\"Features\", \"SpendingScore\", \"\
  Frequency\", \"Recency\")\n    .Append(context.Clustering.Trainers.KMeans(numberOfClusters:\
  \ 3));\n```\n\n## 4. 训练模型\n使用数据训练模型。\n\n```csharp\nvar model = pipeline.Fit(data);\n\
  ```\n\n## 5. 进行预测\n使用训练好的模型进行预测。\n\n```csharp\nvar predictions = model.Transform(data);\n\
  var clusterAssignments = context.Data.CreateEnumerable(predictions);\n```\n\n##\
  \ 6. 分析结果\n分析聚类分配并查看结果。\n\n```csharp\nforeach (var prediction in clusterAssignments)\
  \ {\n    Console.WriteLine($\"SpendingScore: {prediction.SpendingScore}, Frequency:\
