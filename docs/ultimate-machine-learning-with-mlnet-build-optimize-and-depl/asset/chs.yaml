  \ K-means 等算法实现聚类。让我们通过一个假设的数据集，走过一个使用 `ML.NET` 进行聚类的示例。\n\n## 1. 定义数据模型\n定义表示输入数据的数据模型。对于聚类，你只需要特征，不需要标签数据。\n\
  \n```csharp\npublic class CustomerFeatures {\n    [LoadColumn(0)] public float SpendingScore;\n\
