  \ 使用 Visual Studio Code\n在 `Visual Studio Code` 中打开你的项目。\n使用集成终端运行上述相同的 `.NET CLI`\
  \ 命令来安装 `ML.NET`。\n\n## 验证安装\n\n完成后，你可以通过以下命令检查版本来验证是否已安装 `ML.NET`:\n\n### 对于 .NET\
  \ CLI\n```bash\ndotnet mlnet --version\n```\n### 对于 Visual Studio Code 或 Visual\
  \ Studio 程序包控制台：\n```bash\ndotnet add package Microsoft.ML\n```\n\n## macOS 特有的注意事项\n\
  \n### 使用 Homebrew 进行依赖管理\n`Homebrew` 也可以用于管理你的 `ML.NET` 项目可能需要的各种依赖项。你可以使用 `Homebrew`\
  \ 安装和更新补充你机器学习工作流的库、包和工具。\n\n### Xcode 和开发者工具\n确保你的 macOS 系统上已安装 `Xcode` 和 `Xcode\
  \ Command Line Tools`。这些工具提供了 `ML.NET` 项目可能需要的必备开发资源。\n\n### IDE\n`macOS` 用户可以选择集成开发环境，如\
  \ `Visual Studio for Mac`、`Visual Studio Code` 或 `JetBrains Rider` 来进行 `ML.NET`\
  \ 开发。这些 `IDE` 中的每一个都提供了丰富且对 macOS 友开发体验。\n\n### NuGet 程序包\n使用 NuGet 程序包管理器管理你在 macOS\
  \ 上 `ML.NET` 项目中的依赖项。`NuGet` 是一个用于安装、更新和管理 `.NET` 程序包的多功能工具。\n\n### Mono 兼容性\n虽然\
  \ `ML.NET` 主要运行在 `.NET Core` 和 `.NET 5.0` 上，但某些 `ML.NET` 组件和库可能适用于 `Mono`（适用于 macOS\
  \ 的开源 .NET 框架）。如果你有特定需求或需要处理旧版 `ML.NET` ，请探索 `Mono` 的兼容性。\n\n## 配置 ML.NET 环境\n\n\
  让我们来看看如何配置 `ML.NET 环境`：\n\n### 设置环境变量\n无论你使用哪种操作系统，配置环境变量都是设置 `ML.NET` 环境的关键步骤。以下是你需要考虑的要点：\n\
  - 确保包含 `dotnet` 可执行文件的目录已包含在系统的 `PATH` 变量中。这允许你从命令行界面的任何目录下运行 `dotnet` 命令，而无需指定完整路径。\n\
  - 在某些系统上，可能需要将 `DOTNET_ROOT` 环境变量设置为安装路径。如果你安装了多个版本的 `.NET SDK`，这可能尤为重要。\n\n###\
  \ 为 ML.NET 配置开发工具\n为了让你的 `ML.NET` 开发过程更高效，请考虑以下工具和配置：\n- **集成开发环境 (IDEs)：** 选择一个你熟悉的\
  \ `IDE`。`Visual Studio`、`Visual Studio Code` 和 `JetBrains Rider` 是 `ML.NET` 开发的流行选择。通过安装相关的扩展和插件，配置你选择的\
  \ `IDE` 以与 `ML.NET` 无缝协作。\n- **Visual Studio 扩展： 如果 如果你使用 `Visual Studio`，考虑安装与\
  \ `ML.NET` 相关的扩展以提高效率。这些扩展可以提供 `ML.NET` 模板、`IntelliSense` 和调试支持。\n- **源码控制：** 实现\
  \ `Git` 等源码控制系统进行版本跟踪和协作。将你的 `ML.NET` 项目托管在 `GitHub` 或 `GitLab` 等平台，并将源码控制直接集成到你的\
  \ `IDE` 中以便使用。\n- 考虑使用 `Jupyter Notebooks` 进行交互式数据驱动的开发。`ML.NET` 支持 `Jupyter Notebooks`，允许你以笔记本格式创建、记录和共享\
  \ `ML.NET` 代码及可视化。\n\n## 优化开发环境以提高生产力\n\n为了优化你的 `ML.NET` 开发环境，你可以考虑以下最佳实践：\n- **虚拟环境：**\
  \ 创建虚拟环境来隔离你的 `ML.NET` 项目及其依赖项。`venv`（Python）或 `conda`（如果使用 Anaconda）等工具可以帮助管理这些环境。\n\
  - **包管理：** 利用 `NuGet` 或其他 .NET 包管理器高效管理依赖项。保持包更新，并在必要时使用包锁定机制以确保跨环境的一致性。\n- **文档：**\
  \ 为你的 `ML.NET` 项目维护详细的文档。这些文档应涵盖数据预处理、模型训练、超参数和评估指标。清晰的文档对于复现性和协作至关重要。\n- **持续集成\
  \ (CI)/持续部署：** 设置 `CI/CD` 流水线以自动化测试和部署你的 `ML.NET` 模型。`Azure DevOps` 或 `GitHub Actions`\
  \ 等服务可用于此。\n\n### IDE 特定配置\n- **Visual** 通过安装相关的工作负载和扩展为 `Visual Studio` 配置 `ML.NET`。例如，“数据科学与分析应用”工作负载为\
  \ `ML.NET` 开发提供了工具和功能。\n- Visual Studio Code 使用 `C#` 和 `Jupyter` 等扩展自定义 `Visual\
  \ Studio Code` 以增强你的 `ML.NET` 开发体验。\n- JetBrains Rider 是另一个优秀的 .NET 开发 `IDE`，支持\
  \ `ML.NET`。通过安装必要的插件和自定义设置来配置 `Rider` 以匹配你的工作流。\n\n\n\n\n\n## 为 ML.NET 设置依赖和包\n\n\
  设置依赖项和包涉及以下因素：\n\n### 使用 NuGet 管理包依赖\n\n![](img/image-bgd5p8f3.jpg) 图 2.4：使用 NuGet\
  \ 管理包依赖\n\nNuGet 是 .NET 的包管理器，对于管理你的 ML.NET 项目的依赖关系起着至关重要的作用。以下是如何使用 NuGet 有效地管理包依赖的方法：\n\
  \n- **包**：使用 NuGet 包管理器向项目添加 ML.NET 及其相关库。你可以通过 Visual Studio、Visual Studio Code\
  \ 或带有 `dotnet` CLI 工具的命令行界面执行此操作。\n- **包**：在安装包时，请密切关注 ML.NET 及其依赖项的版本。指定适当的包版本可以确保项目内部兼容性和稳定性。\n\
  - **包**：NuGet 会在构建你的项目时自动还原包，但你也可以使用 `dotnet restore` 命令手动还原包。这在处理持续集成和构建流水线时特别有帮助。\n\
  - **管理包**：如果需要，你可以配置 NuGet 使用自定义包源。这对于具有内部包存储库的组织或处理预发布包时非常有用。\n\n### 使用 ML.NET\
  \ 扩展包\n\nML.NET 扩展包提供了额外的功能和组件，以增强你的机器学习项目。以下是使用 ML.NET 扩展包的方法：\n\n- **浏览并安装**：在\
  \ NuGet 网站或包管理器中浏览可用的 ML.NET 扩展。常见的扩展包括额外的训练器、数据预处理组件和专门的 ML 任务。\n- **将扩展添加到你的**：要使用\
  \ ML.NET 扩展，只需使用包管理器将其添加到你的项目中。这将自动下载并安装所需的依赖项。\n- **文档与扩展**：扩展包通常带有文档和示例，帮助你理解如何有效地使用它们。检查扩展的文档以获取有关将其整合到你的\
  \ ML.NET 项目中的指导。\n\n### 升级和降级包\n\n包维护是软件开发中的一个持续过程。以下是处理你的 ML.NET 项目包升级和降级的方法：\n\
  \n- **升级**：定期检查 ML.NET 及其依赖项的更新。使用 NuGet 包管理器升级到新版本，特别是当有新功能或错误修复可用时。\n- **降级**：在某些情况下，由于兼容性问题或项目需求的变化，你可能需要降低包。NuGet\
  \ 允许你在安装或更新时指定特定的包版本。\n- **版本**：考虑锁定包版本以确保项目稳定性。这可以防止可能引入破坏性更改（breaking changes）的意外更新。\n\
  \n## NuGet 最佳实践\n\n为了维护组织良好且稳定的开发环境，在使用 NuGet 时，请考虑这些最佳实践：\n\n- **包引用**：使用包引用文件（例如\
  \ `.csproj`）在项目内定义和管理包依赖项。这使得版本控制和协作变得更加容易。\n- **团队内部一致性**：确保所有团队成员都使用相同版本的 ML.NET\
  \ 及其依赖项。这可以避免兼容性问题并促进顺畅协作。\n- **NuGet 定制**：配置 NuGet 设置以匹配你组织的需求。你可以配置包源、包缓存和代理配置等设置。\n\
  - **安全扫描**：考虑将 NuGet 安全扫描工具集成到构建流水线中，以识别并缓解包中的安全漏洞。\n\n## 解决常见的安装问题\n\n当遇到安装错误和问题时，仔细查看官方文档和社区论坛可以提供有帮助的解决方案和解决方法。\n\
  \n### 处理安装错误和问题\n\n- **错误消息**：当你遇到安装错误时，请仔细阅读错误消息。这些消息通常包含关于何处错误的关键信息。\n- **检查**：双重检查你是否满足了前面章节中提到的所有前提条件和系统要求。确保你的系统环境符合\
  \ ML.NET 的安装要求。\n- **更新**：有时，错误的发生是由于软件组件过旧。确保你的操作系统、`.NET SDK` 和其他依赖项都是最新版本。\n\
  - **日志文件**：查看安装过程中生成的日志文件。这些日志可以提供有关导致失败的详细信息。\n- **搜索解决方案**：利用网络资源、论坛和社区讨论来搜索特定错误消息的解决方案。你遇到的问题可能已被\
  \ ML.NET 社区中的其他人解决。\n\n### 调试依赖项问题\n\n- **依赖项**：如果你的 ML.NET 项目由于依赖项问题无法构建或运行，请使用\
  \ NuGet 等工具来解决它们。NuGet 可以帮助确保所有所需的库都存在于项目中并被正确引用。\n- **版本冲突**：通过检查项目的依赖项来解决版本冲突。不同的包可能需要不同版本的共享库。NuGet\
  \ 的依赖解析应该会自动处理这种情况，但监控冲突是至关重要的。\n- **使用依赖关系可视化工具**：某些开发环境提供了依赖关系可视化工具，帮助你理解项目内不同包之间的关系。使用这些工具来识别潜在问题。\n\
  \n## 常见陷阱及其解决方案\n\n- **过时的 .NET SDK**：\n    - **陷阱**：使用过时的 `.NET SDK` 会导致与你想要使用的\
  \ ML.NET 版本出现兼容性问题。\n    - **解决方案**：将你的 `.NET SDK` 更新到为你打算工作的 ML.NET 版本所推荐的版本。\n\
  - **硬件资源不足**：\n    - **陷阱**：尝试在资源不足的机器上运行 ML.NET 可能会导致性能低下，甚至在模型训练期间失败。\n    - **解决方案**：确保你的硬件满足或超过\
  \ ML.NET 的最低系统要求。\n- **网络连接问题**：\n    - 网络问题可能会阻止包、模型和数据集成功下载，导致安装问题。\n    - **解决方案**：验证你的互联网连接，并考虑使用可靠的网络源。\n\
  - **操作系统兼容性**：\n    - **陷阱**：使用不支持的操作系统会导致兼容性问题。\n    - 确保你使用的是系统要求中所描述的 Windows、Linux\
  \ 或 macOS 版本。\n- **权限**：\n    - **陷阱**：权限不足会阻止 ML.NET 包的安装。\n    - **解决方案**：确保你拥有在系统中安装软件所需的权限。\n\
  \n## 用于解决问题的社区资源和论坛\n\n一些社区资源和论坛包括：\n\n- **Stack Overflow**：Stack Overflow 是一个提答技术问题的热门平台。ML.NET\
  \ 社区在该平台上非常活跃，你可以在那里找到常见问题的解决方案。\n    - [Stack Overflow](https://stackoverflow.com)\n\
  - **GitHub Issues**：ML.NET 的 GitHub 仓库通常包含问题的详细讨论和解决方案。你可以搜索特定问题或发布自己的 issue。\n\
  \    - [GitHub Issues](https://github.com/dotnet/machinelearning)\n- **ML.NET**：ML.NET\
  \ 提供了官方论坛，你可以在那里提问并向社区和 ML.NET 专家寻求帮助。\n    - [Online](https://devblogs.microsoft.com)\n\
  - **在线**：查看官方 ML.NET 文档，其中通常包含常见问题的故障排除指南和常见问题解答（FAQ）。\n    - [Online](https://dotnet.microsoft.com)\n\
  \n\n\n\n## 结论\n本章已让你掌握了在各种操作系统上有效设置 `ML.NET`、配置开发环境以及管理依赖的知识。此外，我们还讨论了故障排除技术，以帮助你克服常见的安装问题。有了这些基础，你现在已经准备好在后续章节中通过\
  \ `ML.NET` 探索机器学习的世界。随着第 3 章 `ML.NET Model Builder and CLI` 的展开，请准备好深度沉浸 `ML.NET`。让我们揭开\
  \ `ML.NET` 为你准备的强大工具。`ML.NET Model Builder` 和 `ML.NET CLI` 将成为下一章的主角，使你能够简化机器学习工作流。\n\
  \n# 第 3 章：ML.NET Model Builder 和 CLI\n\n## 引言\n在本章中，我们将深入探讨 `ML.NET` 提供的强大工具，以简化你的机器学习工作流。`ML.NET\
  \ Model Builder` 和 `ML.NET CLI` 是核心工具，它们简化并自动化了机器学习过程中的各种任务。在本章中，我们将探索这些工具，并演示如何使用\
  \ `ML.NET` 构建、训练和评估机器学习模型。\n\n## 结构\n本章将涵盖以下主题：\n- `ML.NET Model Builder` 和 `CLI`\
  \ 概览\n- 使用 `Model Builder` 构建机器学习模型\n- 使用 `Model Builder` 训练和评估模型\n- 使用 `CLI` 自动化机器学习任务\n\
  - 使用 `Model Builder` 和 `CLI` 进行调试和故障排除\n\n## 介绍 ML.NET Model Builder 和 CLI\n机器学习通过做出数据驱动的预测和决策，具有转型各行业的潜力。然而，构建、训练和部署机器学习模型的过程可能是复杂且耗时的。`ML.NET`\
  \ 是由 `Microsoft` 开发的开源机器学习框架，它提供了 `Model Builder` 和 `CLI` 等工具，来简化和自动化这一过程的关键环节。在本节中，我们将对这些工具进行深入介绍，理解它们的作用，探索它们的优势和用例，并讨论安装和设置程序。\n\
  \n### 理解 Model Builder 和 CLI 的作用：\n- **Model Builder**: `ML.NET Model Builder` 是一个用户友好的图形界面，让开发者和数据科学家能够轻松构建机器学习模型。它通过提供直观的拖放式界面简化了模型创建过程，消除了对机器学习算法进行深度知识的需求。`Model\
  \ Builder` 允许用户只需点击几次即可选择数据、选择目标变量、预处理数据并训练模型。它抽象了 `ML.NET` 框架的复杂性，使更广泛的读者可以使用。\n\
  - **命令行界面 (CLI)**：虽然 `Model Builder` 迎偏好视觉化方法的用户，但 `ML.NET CLI` 是为那些喜欢命令行工具和自动化用户设计的。`CLI`\
  \ 提供了一系列命令，用于从终端创建、管理和训练机器学习模型。它为脚本以及将机器学习集成到自动化流水线和工作流中提供了强大的功能。通过 `CLI`，你可以自动化重复性任务并简化你的机器学习项目。\n\
  \n### 优势\n一些优势包括：\n- **简单性和易用性**: `Model Builder` 用户友好的界面让机器学习面向更广泛的受众。开发者和数据科学家可以在不需要深入理解\
  \ `ML.NET` 细节的情况下快速构建模型原型。\n- `Model Builder` 和 `CLI` 都减少了创建和训练机器学习模型所需的时间和精力。在处理截止日期紧迫或资源有限的项目时，这种效率尤为宝贵。\n\
  - **自动化**: `CLI` 擅长自动化机器学习过程的各个方面。这种自动化对于批处理、持续集成和部署流水线特别有用。\n- **定制化**: `Model\
  \ Builder` 允许用户微调模型配置并进行超参数调。`CLI` 提供了大量的自定义选项，允许用户指定训练过程的每一个方面。\n- `ML.NET` 非常适用于小规模和大型项目。`Model\
  \ Builder` 和 `CLI` 可以随你的需求而扩展，从简单的概念验证到生产级解决方案。\n\n## Model Builder 安装与设置\n\n###\
  \ 作为 Visual Studio 扩展安装 Model Builder：\n1. 打开 `Visual Studio`。\n2. 进入 `Extensions（扩展）`菜单并选择\
  \ `Manage（管理）`。\n3. 在 `Extensions`窗口中搜索 `ML.NET Model`。\n![image-zm7qzd36.jpg Figure\
  \ 3.1: 扩展管理界面\n4. 点击 `Download（下载）`按钮下载并安装扩展。\n![image-f5dtj03r.jpg Figure 3.2:\
  \ 安装后的 Visual Studio\n5. 根据提示重启 `Visual Studio`。\n\n### 作为独立工具安装 ML.NET Model Builder：\n\
  1. 从官方 GitHub 发布页面下载独立的 `ML.NET Model Builder` 工具：`ML.NET Model Builder Releases`。\n\
  2. 选择适用于你操作系统的版本（`Windows`、`Linux` 或 `macOS`）。\n3. 按照 GitHub 发布页面提供的安装说明操作。\n4.\
  \ 安装完成后，你可以从命令行或图形界面运行 `ML.NET Model Builder`。\n![image-cv59hi42.jpg Figure 3.3:\
  \ Model Builder 发布页面\n\n### 安装 ML.NET\n`CLI` 可以通过 `.NET Core CLI` 本身安装。你可以通过命令行安装：\n\
  ```\ndotnet tool install -g\n```\n\n### 数据与项目\n准备好你的数据集，并创建一个计划使用 `Model Builder`\
  \ 或 `CLI` 的项目。确保你的数据格式正确并可用于训练。\n\n\n\n\n\n## 使用 Model Builder 构建机器学习模型\n\n使用 ML.NET\
  \ Model Builder 构建机器学习模型是一个非常直接的过程，即使对于机器学习经验有限的人来说也是如此。本节将详细介绍相关的步骤，从项目创建到生成预测的全过程。\n\
  \n### 使用 Model Builder 创建项目\n\n首先，在 Visual Studio（或你偏好的开发环境）中创建一个新项目，然后通过右键点击项目并选择\
  \ ML.NET Model Builder。该模板为你的机器学习项目提供了一个起点。\n\n![](img/image-ii912la8.jpg)\n图 3.4：Visual\
  \ Studio 界面\n\n要创建模型，你必须首先选择机器学习场景。Model Builder 支持适用于多种开发场景。\n\n![](img/image-cawkhbla.jpg)\n\
  图 3.5：选择 Model Builder 场景\n\n在 Model Builder 场景界面上，选择 `Data Classification`（数据分类）场景，因为它涉及到预测评论所属的类别（正面或负），尽管表达方式有所不同。\n\
  \n### 选择环境\n\n选择本地 CPU。\n\n系统将提示你选择项目的数据源。你可以选择本地文件或 SQL 数据库。Model Builder 支持多种数据格式，包括\
  \ CSV、TSV 和文本。\n\n从 UCI 机器学习存储库下载 Sentiment Labelled Sentences 数据集并解压 `sentiment\
  \ labelled sentences.zip` 内容。将生成的 `yelp_labelled.txt` 文件保存到你的目录中。\n\n每一行对应 Yelp\
  \ 用户发布的一条特定餐厅评论。第一列表示用户的评论，第二列表示文本的情感倾向（0 表示负面，1 表示正面）。列之间由制表符分隔，且数据集缺少表头。\n\n![](img/image-orz0ysa2.jpg)\n\
  图 3.6：向 Model Builder 添加数据\n\nModel Builder 采用对众多模型进行全面评估，利用多种算法和配置，在给定的训练时间内构建出尽可能有效的模型。\n\
  \n调整“Time to train”（训练时间），该设置指定 Model Builder 探索不同模型的时长，将其设置为 30 秒（如果训练后没有识别出模型，请考虑增加时间）。请注意，对于较大的数据集，训练时间自然会延长，Model\
  \ Builder 会自动适应数据集的大小。\n\n选择 `Start` 启动训练过程。随着训练开始，你可以监控剩余时间。\n\n![](img/image-u942juo1.jpg)\n\
  图 3.7：Model Builder 开始训练\n\n训练过程完成后，将提供训练结果的摘要供查看。\n\n![](img/image-m99pl5tx.jpg)\n\
  图 3.8：Model Builder 结果\n\n- `Best`：反映 Model Builder 识别出的最佳模型的准确率。准确率越高，表示对测试数据的预测越准确。\n\
  - `Best`：表示在 Model Builder 探索过程中表现优异的算法。\n- `Training Time`：代表分配给训练和探索各种模型的总时长。\n\
  - `Models`：表示 Model Builder 在指定时间内探索的模型总数。\n- `Generated`：提供生成的文件名称，旨在便于模型消耗或辅助训练新模型。\n\
  \n在“Try your model”（尝试你的模型）部分，文本框预先填充了来自数据数据集的第一行数据，但你可以根据需要修改输入。选择 `Predict` 按钮以观察各种情感预测。\n\
  \n在此背景下，情感分数为 0 表示负面情感，分数为 1 表示正面情感。\n\n![](img/image-1zgja51e.jpg)\n图 3.9：Model\
  \ Builder 评估模型\n\n### 使用（Consume）\n\n在 Model Builder 的 Consume 步骤中，你会找到提供的代码片段，这些代码用于为模型生成示例输入，并利用模型对该输入进行预测。\n\
  \n此外，Model Builder 还提供了可选的项目模板，你可以将其整合到解决方案中。这些模板包括控制台应用程序和 Web API，两者都旨在无缝地消耗已训练的模型。\n\
  \n![](img/image-ghhstf0v.jpg)\n图 3.10：Model Builder 使用\n\n最后一步是将训练好的模型集成到终端用户应用程序中。\n\
  \n将你项目中 `Program.cs` 文件中的现有代码替换为以下代码：\n\n```csharp\nusing ConsoleApp1;\n// 添加输入数据\n\
  var sampleData = new MLModel1.ModelInput()\n{\nCol0 = \"This restaurant was wonderful.\"\
  \n};\n\n// 加载模型并预测示例数据的输出\nvar result = MLModel1.Predict(sampleData);\n\n// 如果预测为\
  \ 1，则情感为“Positive”，否则为“Negative”\nvar sentiment = result.Prediction == 1 ? \"Positive\"\
  \ : \"Negative\";\nConsole.WriteLine($\"Text: {sampleData.Col0}\\nSentiment: {sentiment}\"\
  );\n```\n\n**输出**\n```\nText: This restaurant was wonderful.\nSentiment: Positive\n\
  ```\n\n## 安装 CLI\n\n要使用 ML.NET 命令行接口 (CLI)，你需要安装 ML.NET CLI 工具。CLI 工具简化了各种机器学习任务，如创建项目、管理数据集、训练模型和进行预测，所有操作都可以命令行完成。\n\
  \n### 前提条件\n\n在安装 ML.NET CLI 之前，请确保你拥有以下内容：\n\n- `.NET SDK`：确保你的机器上安装了 .NET SDK。你可以从\
  \ .NET 网站下载。\n\n### 安装步骤\n\n按照以下步骤安装 ML.NET CLI：\n\n1. **打开终端或命令提示符**：在你的机器上打开终端或命令提示符。可以是开发环境（IDE）中的终端，也可以是独立的终端窗口。\n\
  2. **运行安装命令**：使用以下命令全局安装 ML.NET CLI：\n```bash\ndotnet tool install -g mlnet\n```\n\
  3. **验证安装**：安装完成后，可以通过运行以下命令验证 ML.NET CLI 工具已安装：\n```bash\ndotnet mlnet --version\n\
  ```\n\n### CLI 管理\n\n- **升级到最新版本**：要将 ML.NET CLI 升级到最新版本，请使用以下命令：\n```bash\ndotnet\
  \ tool update -g mlnet\n```\n- **卸载 ML.NET CLI**：如果你需要卸载 ML.NET CLI 工具，可以使用以下命令：\n\
  ```bash\ndotnet tool uninstall -g mlnet\n```\n\n### 注意事项\n\n- 确保在安装过程中网络连接稳定，因为\
  \ CLI 工具可能需要下载依赖项。\n- 确保 .NET SDK 和 CLI 已添加到系统的 `PATH` 环境变量中，允许你从终端的任何位置运行命令。\n\
  - 安装完成后，你可以继续使用 ML.NET CLI 创建、训练和管理机器学习项目。\n\n\n\n\n\n## 使用 CLI 自动化机器学习任务\n\nML.NET\
  \ 是由微软开发的一款开源机器学习框架。虽然 ML.NET 主要与 .NET 生态系统集成，但它也提供了命令行界面 (CLI) 工具，可用于自动化机器学习任务。当你需要从命令行执行数据预处理、模型训练和评估等任务时，这些\
  \ CLI 工具将变得非常有用。\n\n以下是使用 ML.NET CLI 自动化机器学习任务的基本步步骤：\n\n### 安装 ML.NET CLI\n确保你的机器上已安装了\
  \ `.NET SDK`。打开终端并运行以下命令安装 ML.NET CLI：\n```bash\ndotnet tool install -g mlnet\n\
  ```\n\n### 创建新的 ML.NET 项目\n使用以下命令创建一个新的 ML.NET 项目：\n```bash\ndotnet new mlnet\n\
  ```\n\n### 探索项目结构\n导航到项目目录并探索项目结构。你会发现像 `Program.cs`（用于代码）和 `Data` 文件夹（用于数据集）等文件。\n\
  \n### 准备你的数据\n将你的数据集放在 `Data` 文件夹中，或者更新 `Program.cs` 文件中的路径。\n\n### 编辑 ML.NET 代码\n\
  打开 `Program.cs` 并修改代码以定义你的机器学习流水线。你可以更改数据加载、预处理、模型训练和评估逻辑。\n\n### 运行 ML.NET CLI\
  \ 命令\n使用以下命令运行各种 ML.NET 任务：\n\n```bash\n## 构建项目\ndotnet build\n\n## 训练并评估模型\ndotnet\
  \ run train\n\n## 使用训练过的模型进行预测\ndotnet run predict\n```\n\n### 自定义 CLI 命令\n你可以通过修改\
  \ `Commands` 文件夹中的 `TrainCommand` 和 `PredictCommand` 类来自定义 CLI 命令。根据你的需求调整选项和参数。\n\
  \n### 探索其他命令\nML.NET CLI 为数据检查、模型分析等任务提供了额外的命令。通过运行以下命令来探索可用命令：\n```bash\ndotnet\
  \ run --help\n```\n\n### 迭代与实验\n对你的代码进行迭代，尝试不同的算法，并微调你的模型。根据需要重新运行命令进行训练、评估和预测。\n\
  \n## 使用 CLI 进行调试和故障排除\n\n在利用 ML.NET CLI 的机器学习项目中，调试和故障排除对于确保模型被成功训练和部署至关重要。以下是针对开发过程中可能出现问题的调试和故障排除的一些技巧和方法：\n\
  \n### 日志与输出\n利用日志和控制台输出来理解执行流。在代码中使用 `Console.WriteLine` 语句，在训练、评估和预测阶段打印相关信息。\n\
  \n### 检查数据加载\n确保你的数据集已正确加载。验证代码中的数据集路径，并检查数据是否按预期读取。数据加载不当会导致各种问题。\n\n### 检查数据\n\
  使用 `mlnet data` 命令在训练之前检查数据。该命令帮助你理解数据集的结构，包括列名、数据类型和摘要统计数据。\n```bash\ndotnet run\
  \ data\n```\n\n### 验证模型流水线\n检查你的模型流水线是否存在错误。确认数据预处理、特征工程和模型训练步骤已正确定义。`mlnet code`\
  \ 命令对于从现有流水线生成代码非常有帮助。\n```bash\ndotnet run code\n```\n\n### 审查训练指标\n在训练模型后，审查训练指标以评估其性能。打印或记录准确率、精确率、召回率和损失（loss）等指标，以评估模型从训练数据中学习的程度。\n\
  \n### 处理空值或缺失值\n确保你的数据预处理妥善处理了空值或缺失值。缺失数据可能会在训练和预测期间导致意之外的行为。使用 ML.NET 数据转换函数处理缺失值。\n\
  \n### 检查模型兼容性\n验证 CLI 中使用的 ML.NET 版本与你的模型及代码兼容。如果不同版本之间的 API 或功能发生变化，可能会出现不兼容问题。\n\
  \n### 探索模型文件\n检查生成的模型文件（通常保存在输出文件夹中），确保它们成功创建。模型文件生成错误可能表明训练期间存在问题。\n\n### 使用调试工具\n\
  利用集成开发环境 (IDE) 中提供的标准调试工具。设置断点、检查变量并单步执行代码以识别并修复问题。\n\n### 检查依赖\n确保所有所需的依赖都已安装并更新到最新。这包括\
  \ `.NET SDK`、ML.NET CLI 以及项目中使用的任何外部库或包。\n\n### 审查命令行选项\n在运行 CLI 命令时，双击命令行选项和参数。错误的选项可能会导致意之外的行为或错误。\n\
  \n### 咨询文档和社区\n参考 ML.NET 文档获取故障排除技巧和常见问题解答。此外，参与社区论坛或讨论，向可能遇到过类似问题的其他开发者寻求帮助。\n\n\
  通过系统地处理这些调试和故障排除策略，你可以通过 CLI 增强你 ML.NET 项目的可靠性和有效性。在开发的每个阶段定期测试和验证你的代码将为你的机器学习事业的成功做出贡献。\n\
  \n## 常见错误与解决方案\n\n在结合 Model Builder 和 CLI 进行机器学习时，理解常见错误及其解决方案是调试的一个基础方面。以下是一些示例：\n\
  \n### 数据\n缺失值、格式不一致或标记错误的数据等数据问题会导致错误。确保你的数据是干净且结构适当的。\n\n### 超参数\n选择错误的超参数或配置不当会导致模型性能不佳。审查并微调超参数以优化模型性能。\n\
  \n### 模型\n过拟合发生在模型对训练数据的学习过度良好时，导致其在未见数据上的表现不佳。解决方案包括调整模型复杂度、使用更多数据或正则化技术。\n\n###\
  \ 类\n在分类任务中，类别分布不平衡会导致模型产生偏差。过采样（oversampling）、欠采样（undersampling）或使用不同的评估指标等技术可以解决这个问题。\n\
  \n### 内存与资源\n如果你由于资源限制遇到内存问题或性能问题，请考虑使用较小的数据集、优化算法或升级硬件。\n\n### 库版本\n确保你使用的 ML.NET、依赖项和\
  \ `.NET Core` 版本是兼容的。兼容性问题会导致意之外的错误。\n\n\n\n\n\n## 调试技术\n\n在 `Model Builder` 和 `CLI`\
  \ 中调试您的机器学习模型时，请考虑以下技术：\n\n- **增量式**：通过从较小的数据集开始增量地测试您的机器学习流水线，以验证每一步是否按预期工作。逐渐扩大到完整数据集。\n\
  - **可视化**：将您的数据、模型架构和结果可视化。可视化可以帮助您发现异常，并理解模型是如何做出决策的。\n- **探索性数据分析 (EDA)**：使用 EDA\
  \ 技术理解数据的特征，并识别模式、离群值和潜在问题。\n- **调试工具**：利用调试工具和如 `Visual Studio` 等集成开发环境 (IDE)在训练和评估期间设置断点、检查变量并单步执行代码。\n\
  - **交叉验证和验证曲线**：实施交叉验证和验证曲线，以评估不同阶段的模型性能。这有助于你理解模型的行为，以及它是否存在过拟合或欠拟合。\n\n## 日志与输出检查\n\
  \n`Model Builder` 和 `CLI` 在各种操作执行期间都会提供日志和输出。你可以使用这些日志和输出进行调试和故障排除：\n\n- **错误**：密切关注错误消息和警告。它们通常包含关于出现问题以及如何修复的价值信息。\n\
  - **进度**：在模型训练期间，你将收到包含训练指标的进度更新。检查这些更新以监控训练过程并尽早发现问题。\n- **模型评估**：在模型评估后，检查生成的指标和评估结果，以了解模型性能如何以及是否符合你的标准。\n\
  - **数据转换与预处理**：检查与数据转换和预处理相关的日志。这些日志可以帮助你跟踪数据变化并发现异常。\n\n## 性能分析与性能优化\n\n在使用 `Model\
  \ Builder` 和 `CLI` 时，性能分析和性能优化是调试和故障排除的重要方面：\n\n- **性能分析**：使用性能分析工具分析代码的运行时行为。性能分析器可以识别性能瓶颈、内存占用和\
  \ CPU 利用率。\n- **代码审查**：检查代码是否存在潜在的低效之处。确保数据加载、处理和训练已经过优化，以尽力减少执行时间和资源消耗。\n- **算法**：考虑不同的算法和模型。对于你的特定问题，某些算法可能比其他算法更高效，带来更快的训练速度和更好的性能。\n\
  - **并行**：如果你的硬件支持，考虑使用并行处理或分布式计算来加速训练和评估。\n- **数据**：在处理大型数据集时，在开发和测试期间使用较小样本以节省时间和资源。当你对自己的模型有信心时，再扩大到完整数据集。\n\
  \n有效的调试和故障排除对于开发稳健且可靠的机器学习模型至关重要。`Model Builder` 和 `CLI` 通过其内置的日志和输出为训练和评估过程提供了宝贵的见解。通过采用常见的错误解决技术、调试工具和性能优化策略，你可以克服挑战并构建符合项目目标模型。\n\
  \n## 最佳实践与提示\n\n最佳实践和提示对于机器学习项目的成功至关重要。在本节，我们将扩展一些与工作流效率、处理大型数据集、协作开发以及版本控制和可复现性关键最佳实践和提示。\n\
  \n### 工作流效率\n\n效率对于及时且预算内交付机器学习项目至关重要。以下是提高工作流效率的方法：\n\n- **自动化重复任务**：利用如 `ML.NET\
  \ CLI` 等自动化工具自动执行数据准备、模型训练和评估等重复任务。这可以节省时间并减少人工错误。\n- **持续集成 (CI) 和持续部署 (CD)**：设置\
  \ CI/CD 流水线，在代码更改时自动构建、训练和部署模型。这简化了开发过程，并确保模型保持最新状态。\n- **实验跟踪**：使用实验跟踪工具记录你进行的所有实验。这使得比较模型、跟踪更改以及理解什么对你的特定问题最有效变得更加容易。\n\
  - **保持整洁的工作空间**：通过结构良好的目录和文件命名规范维护组织有条的工作空间。这有助于你快速定位和管理数据、代码和项目资产。\n- **文档**：为你的项目创建详细的文档，包括数据源、数据预处理步骤、模型配置和训练结果。文档良好的项目更容易维护和共享。\n\
  \n### 处理大型数据集\n\n处理大型数据集面临独特的挑战。以下是有效处理它们的提示：\n\n- **数据**：对于初始模型开发和实验，使用数据采样来处理较小的数据子集。一旦你的模型运行良好，就扩大到完整数据集。\n\
  - **数据压缩**：压缩大型数据集以减少存储需求并加快数据加载。使用 `Parquet` 或 `Arrow` 等格式进行高效存储。\n- **数据随机化**：在将数据拆分为训练和测试集之前，随机打乱数据。洗牌有助于防止数据顺序的偏差，特别是当你的数据按某些特征排序时。\n\
  - **并行**：利用并行处理和分布式计算平台来加速数据预处理、模型训练和评估。\n- **数据**：如果你的数据集大到无法放入内存，考虑使用数据流技术。流式处理允许你以较小的块处理数据，从而减少内存需求。\n\
  \n### 协作开发\n\n协作在机器学习项目中通常至关重要，特别是在团队工作时。以下是增强协作开发的方法：\n\n- **版本**：使用如 `Git` 等版本控制系统管理代码和项目资产。这允许多个团队成员同时在同一个项目上工作，同时跟踪更改并方便代码审查。\n\
  - **代码注释**：对你的代码进行注释，并对复杂部分提供清晰的解释。文档良好的代码更容易让他理解和操作。\n- **协作**：利用 `GitHub`、`GitLab`\
  \ 或 `Bitbucket` 等协作工具进行共享仓库和问题跟踪。这些平台促进了团队沟通和项目管理。\n- **定期**：安排定期团队会议，讨论进度、挑战和解决方案。有效的沟通是协作成功的关键。\n\
  \n\n\n\n\n## 版本控制与可复现性\n\n可复现性是确保你的机器学习结果可以复制的关键。以下是实现方法：\n\n### 版本\n如前所述，使用版本控制系统来跟踪代码、数据和模型的更改。将代码和项目资产提交到版本控制仓库，有助于确保你可以在未来的任何时候重建你的工作。\n\
  \n### 环境\n利用虚拟环境或容器化（例如 `Docker`）来创建可复现的环境。记录项目所使用的依赖项、库和硬件配置。\n\n### 流水线\n将数据预处理、训练和评估流水线构建为脚本。这些流水线可以进行版本化并在受控环境中执行，以确保可复现性。\n\
  \n### 实验跟踪\n使用实验跟踪工具记录并复现你的实验。你可以保存配置、数据预处理步骤和模型检查点，以便于复制。\n\n### 检查点与快照\n在训练期间保存模型检查点和快照。这允许你从特定点继续训练并复制结果。\n\
  \n通过实施这些最佳实践和技巧，你将提高机器学习工作流的效率，有效处理数据集，促进协作开发，并确保版本控制和可复现性。这些实践不仅让你的项目更成功，还促进了更广泛的机器学习领域的良好实践。\n\
