  \ d, c, a, c, a, b\n\n# 第 8 章：在 ML.Net 中保存和加载模型\n\n## 引言\n\n在快速演变的机器学习领域中，保存和加载已训练模型的能力对于简化\
  \ `ML.NET` 项目的开发和部署起着关重要的作用。在本章中，我们将开始探索在 `ML.NET` 中保存和加载已训练模型的复杂之处，为你提供高效模型管理的本质知识和最佳实践。\n\
  \n已训练模型的价值超出了它们的初始用途。重用预训练模型可以极大地加速开发过程，使开发人员专注于新的挑战和创新。通过理解序列化和反序列化的原理，我们获得了保留这些模型中封装的知识的能力，使其能够在各种应用程序中轻松访问。\n\
  \n我们的旅程从深入概述保存和加载模型的意义开始。我们将揭示重用预训练模型的优势，并强调这些实践如何能够提高 `ML.NET` 项目的效率。你将学习序列化和反序列化的核心概念，发现将\
  \ `ML.NET` 模型转换为紧凑字节流以及反之的过程。\n\n深入探讨，我们探索了模型元数据序列化的复杂性，不仅捕捉模型的架构和权重，还捕捉影响其创建的训练配置和数据处理步骤。理解\
  \ `ML.NET` 模型对象及其组件将为高效的序列化和反序列化提供必要的基础。\n\n随着我们的进行，我们将进入文件格式领域，仔细评估保存 `ML.NET`\
  \ 模型的不同选项。原生 `ML.NET` 二进制格式提供了简单性和快速，而对 ONNX 格式的支持开启与其他框架互操作的可能。此外，我们探索了将模型导出为 PMML（预测模型标记语言）的优势和局限性，对每种格式进行了全面的比较。\n\
  \n为了确保模型在现实应用中的无缝集成，我们提出了一 set 在 `ML.NET` 中保存和加载模型的最佳实践。这些实践包括单独保存模型权重和架构、为了后兼容性的版本考虑，以及为组织模型文件定义适当的命名规范和文件夹结构。我们引入了使用校验和和哈希技术来维护加载模型的完整性。\n\
  \n虽然保存和加载模型带来了巨大的益处，但它们也可能引入挑战。因此，我们专门设立了一个章节来故障排除在此过程中可能出现的常见问题。你将学习如何处理模型版本不匹配、适应模型架构或数据处理流水线的变化，并优化模型大小和加载时间。此外，我们讨论了确保跨平台兼容性的技术，以便在不同环境中无缝部署模型。\n\
  \n## 结构\n\n本章强调了以下内容：\n- 在 ML.NET 中保存和加载模型\n- 在不同文件格式重用预训练模型的价值\n- 保存和加载模型的最佳实践\n\
  - 以原生二进制和 ONNX 格式保存模型的代码示例\n\n\n\n\n\n# 模型保存与加载的价值\n\n训练好的机器学习模型代表了数据准备、特征工程和算法优化方面大量努力的结晶。一旦模型成功训练，它就封装了关于训练过程中所接触的数据中模式、趋势和关系的宝贵知识。保存训练后的模型允许我们保留这些来之不易的知识以供未来使用。通过将模型保存到磁盘或存储器，我们确保了它们在训练环境之外的可用性。这使得开发者能够在各种场景中复用预训练模型，从而节省大量的时间和资源。此外，保存模型有助于团队成员之间的协作，并促进不同项目之间的模型交换。\n\
  \n## 复用预训练模型\n\n保存和加载模型的最具吸引力的优势之一是能够有效复用预训练模型。我们不需要为每个新项目从头开始训练模型，而是可以利用已经在相关数据上进行微调的现有模型。这不仅加速了开发过程，还提升了模型性能，特别是在数据有限的情况下。此外，复用预训练模型使我们能够建立在更广泛机器学习社区的知识之上。通过开源仓库和模型市场，开发者可以访问从图像识别到自然语言处理等各种任务的海量预训练模型。嵌入在这些模型中的集体知识使我们能够构建更健壮、更准确的解决方案。\n\
  \n## 序列化与反序列化\n\n保存和加载模型的核心在于序列化和反序列化。序列化是将模型的内部状态（包括其架构、学习参数（权重）和其他相关的元数据）转换为紧凑且可移植的表示（通常是字节流）。反序列化则是相反的过程，将字节流转换回功能完备的模型对象。这种能力允许我们将模型持久化到磁盘上、通过网络传输或将其存储在数据库中，同时确保以后可以准确地重建它。\n\
  \n## 通过保存和加载简化开发\n\n通过采用保存和加载模型的实践，`ML.NET` 开发者可以简化模型开发周期。这使他们能够更多地关注实验、超参数调优和模型微调，而无需每次从头开始训练。此外，它简化了部署过程，因为开发者可以轻松将预训练模型集成到应用程序中，缩短了机器学习驱动解决方案的上市时间。这种灵活性在需要实时预测或持续模型更新的场景中尤为关键。\n\
  \n## 保存 ML.NET 模型的各种格式\n\n在本节中，我们将探索用于保存 `ML.NET` 模型的不同格式。每种格式都有其独特的优势和考虑因素，因此根据\
  \ `ML.NET` 项目的具体需求选择最合适的格式至关重要。\n\n### ML.NET 原生二进制格式\n\n原生的 `ML.NET` 二进制格式是保存 `ML.NET`\
  \ 模型的默认且推荐格式。使用此格式时，`ML.NET` 将模型及其元数据序列化为二进制表示。该格式在序列化和反序列化方面都提供了出色的性能，从而使模型加载更快。\n\
  \n**优势：**\n- 快速序列化和反序列化。\n- 文件大小小，适合将模型保存到磁盘或通过网络传输。\n- 完全支持所有 `ML.NET` 模型和转换。\n\
  - 与 `ML.NET` 原生兼容，可无缝集成到应用程序中。\n\n**考虑因素：**\n- 尽管高效，但原生二进制格式可能无法与其他机器学习框架或语言直接兼容，如果你计划在另一个环境中使用模型，这可能是一个限制。\n\
  \n### ONNX（开放神经网络交换）格式\n\n`ONNX` 是一种用于表示机器学习模型的开放标准格式。`ML.NET` 提供了导出和导入 `ONNX` 格式模型的支持，使其成为与支持\
  \ `ONNX` 的其他机器学习框架互操作的价值选择。\n\n**优势：**\n- 互操作性：`ONNX` 允许模型在 `TensorFlow`、`PyTorch`\
  \ 和 `ML.NET` 等不同框架之间交换。\n- 支持 `ONNX` 的平台能够在各种环境中部署。\n- `ONNX` 由由广泛的研究人员和工程师社区积极支持和开发。\n\
  \n**考虑因素：**\n- 并非所有的 `ML.NET` 模型或转换都支持转换为 `ONNX` 格式。某些复杂模型或自定义组件可能无法转换。\n- 导出到 `ONNX`\
  \ 可能导致的文件大小比原生 `ML.NET` 二进制格式更大。\n\n## 选择正确的格式\n\n为保存 `ML.NET` 模型选择合适的格式取决于多个因素，包括：\n\
  \n- **集成需求：** 如果你需要在支持 `ONNX` 的环境中使用模型，请考虑将模型导出为 `ONNX`。\n- **性能：** 为了获得最佳性能并在 `ML.NET`\
  \ 应用程序中直接集成，推荐使用原生的 `ML.NET` 二进制格式。\n- **互操作性：** 如果你计划与其他机器学习框架一起使用你的模型，`ONNX` 可以促进无缝集成。\n\
  \n在实践中，评估特定的项目需求并考虑模型大小、序列化/反序列化速度以及跨平台兼容性等因素，对于做出保存 `ML.NET` 模型最佳文件格式的明决策至关重要。在不同格式保存模型后，务必测试模型加载过程，以确保它在目标环境中的表现符合预期。\n\
  \n\n\n\n\n# 代码示例\n\n在此代码示例中，我们将演示如何使用原生二进制格式和 ONNX 格式保存 ML.NET 模型。然后，我们将展示如何从这两种文件格式加载模型，并使用它对新数据进行预测。\n\
  \n```csharp\nHousingData[] housingData = new HousingData[]\n{\n  new HousingData\n\
  \  {\n    Size = 600f,\n    HistoricalPrices = new float[] { 100000f, 125000f, 122000f\
  \ },\n    CurrentPrice = 170000f\n  },\n  new HousingData\n  {\n    Size = 1000f,\n\
  \    HistoricalPrices = new float[] { 200000f, 250000f, 230000f },\n    CurrentPrice\
  \ = 225000f\n  },\n  new HousingData\n  {\n    Size = 1000f,\n    HistoricalPrices\
  \ = new float[] { 126000f, 130000f, 200000f },\n    CurrentPrice = 195000f\n  }\n\
  };\n\n// 创建 MLContext\nMLContext mlContext = new MLContext();\n\n// 加载数据\nIDataView\
  \ data = mlContext.Data.LoadFromEnumerable(housingData);\n\n// 定义数据准备估计器\nEstimatorChain<ITransformer>\
  \ pipelineEstimator =\n  mlContext.Transforms.Concatenate(\"Features\", new string[]\
  \ { \"Size\", \"HistoricalPrices\" })\n  .Append(mlContext.Transforms.NormalizeMinMax(\"\
  Features\"))\n  .Append(mlContext.Regression.Trainers.Sdca());\n\n// 训练模型\nITransformer\
  \ trainedModel = pipelineEstimator.Fit(data);\n\n// 保存模型\nmlContext.Model.Save(trainedModel,\
  \ data.Schema, \"model.zip\");\n```\n\n由于大多数模型和数据准备管道都继承自同一组类，这些组件的保存和加载方法签名是相同的。根据你的用例，你可以将数据准备管道和模型合并为一个整体（输出一个单一文件），或者将它们分离，从而为每个部分创建一个独立的\
  \ `ITransformer`。\n\n## 1. 保存模型\n\n首先，让我们将此模型保存到本地。\n\n在保存模型时，你需要两个要素：\n- 模型的 `ITransformer`。\n\
  - 预期输入的 `DataViewSchema`。\n\n训练模型后，使用 `Save` 方法并结合输入数据的 `DataViewSchema` 将训练好的模型保存到名为\
  \ `model.zip` 的文件中。\n\n```csharp\n// 保存训练后的模型\nmlContext.Model.Save(trainedModel,\
  \ data.Schema, \"model.zip\");\n```\n\n现在让我们看看如何以 ONNX 格式保存此模型。\n\n要在本地保存模型的 ONNX\
  \ ，，你需要安装 `Microsoft.ML.OnnxConverter` NuGet 包。\n\n安装了 `OnnxConverter` 包后，我们可以使用它将模型保存为\
  \ ONNX 格式。这需要一个流对象，我们可以使用 `File.Create` 方法提供一个 `FileStream`。`File.Create` 方法接受一个字符串作为参数，这将是\
  \ ONNX 模型的路径。\n\n```csharp\nusing FileStream stream = File.Create(\"./onnx_model.onnx\"\
  );\n```\n\n创建流后，我们可以调用 `ConvertToOnnx` 方法，并传入训练好的模型、用于训练的数据以及该流。然而，并不是所有的训练器和转换器都可以导出为\
  \ ONNX。要查看完整列表，请访问“Transforms（转换器）”和“如何选择 ML.NET 算法”指南。\n\n```csharp\nmlContext.Model.ConvertToOnnx(trainedModel,\
  \ data, stream);\n```\n\n## 2. 加载模型\n\n首先，让我们如何加载存储在本地的模型。\n\n存储在本地的模型可以在其他进程或应用程序中使用，例如\
  \ ASP.NET Core 和 Serverless Web Applications。参考“在 Web API 中使用 ML.NET”和“部署 ML.NET\
  \ Serverless Web App”教程以获取更多信息。\n\n在单独的应用或进程中，使用 `Load` 方法结合文件路径将训练好的模型加载到应用程序中。\n\
  \n```csharp\n//为数据准备管道和训练模型定义 DataViewSchema\nDataViewSchema modelSchema;\n// 加载训练后的模型\n\
  ITransformer trainedModel = mlContext.Model.Load(\"model.zip\", out modelSchema);\n\
  ```\n\n现在，让我们理解如何在本地加载 ONNX 格式的模型：\n\n为了加载 ONNX 模型进行预测，你需要 `Microsoft.ML.OnnxTransformer`\
  \ NuGet 包。\n\n安装了 `OnnxTransformer` 包后，你可以使用 `ApplyOnnxModel` 方法加载现有的 ONNX 模型。所需的参数是一个字符串，即本地\
  \ ONNX 模型的路径。\n\n```csharp\nOnnxScoringEstimator estimator = mlContext.Transforms.ApplyOnnxModel(\"\
  ./onnx_model.onnx\");\n```\n\n`ApplyOnnxModel` 方法返回一个 `OnnxScoringEstimator` 对象。首先，我们需要加载新数据。\n\
  \n```csharp\nHousingData[] newHousingData = new HousingData[]\n{\n  new() {\n  \
  \  Size = 1000f,\n    HistoricalPrices = new[] { 300000f, 350000f, 450000f },\n\
  \    CurrentPrice = 550000f\n  }\n};\n```\n\n创建 `IDataView` 后，我们可以在估计器上使用 `Fit`\
  \ 方法：\n\n```csharp\nestimator.Fit(newHousingData);\n```\n\n\n\n\n\n# 命名规范与文件夹结构\n\
  \n使用清晰且一致的命名规范来组织模型文件，对于模型的检索和管理至关重要。采用结构化的文件夹层次可以进一步增强组织性并改进模型版本控制。请考虑以下命名规范和文件夹结构：\n\
  \n- 为模型文件使用描述性名称，例如使用 `model-architecture.json` 和 `model-weights.bin` 以提高清晰度。\n\
  - 在文件名中包含模型版本、使用的数据集或训练日期等信息。\n- 为每个模型版本创建单独的目录并使用子目录来存储架构、权重和其他相关文件。\n- 文件夹结构的示例如下：\n\
  \n```\nmodels/\nversion1/\n  architecture.json\n  weights.bin\n  hash.txt\nversion2/\n\
  \  architecture.json\n  weights.bin\n  hash.txt\n```\n\n# 加载过程中的常见问题\n\n在加载保存的模型时可能会出现一些常见问题，例如版本不匹配、模型架构变化或数据处理流水线的差异。为了解决这些问题，请考虑实现异常处理、回退机制或自动模型更新程序。\n\
  \n- 优雅地处理版本不匹配，提供信息丰富的错误消息或回退到默认模型。\n- 在模型加载期间实现兼容性检查，以确保预期架构和输入数据与加载的模型匹配。\n- 使用数据版本控制或模式演进策略来处理模型加载期间数据处理流水线的变化。\n\
  \n将这些最佳实践整合到你的 `ML.NET` 模型管理过程中，将使 `ML.NET` 应用更加健壮且易于维护。通过版本控制和组织良好的文件夹结构高效地保存加载模型，将实现无缝集成、促进模型更新并确保机器学习解决方案的完整性。\n\
  \n# 保存和加载 ML.NET 模型的常见问题故障排除\n\n在本节中，我们将探索保存和加载 `ML.NET` 模型时可能出现的常见问题，并提供解决这些问题的调试技巧。识别并应对这些挑战将确保在持久化和恢复训练模型时过程顺利且无误。\n\
  \n## 版本不匹配\n\n模型加载过程中的一个常见问题是保存的模型与用于加载的 `ML.NET` 库版本之间存在不匹配。`ML.NET` 随着时间不断进化，不同版本之间的后兼容性并不总是保证。因此，尝试加载用旧版本或新版本的\
  \ `ML.NET` 保存的模型可能会导致兼容性问题。\n\n### 故障排除\n当遇到版本不匹配时，确保保存和加载模型文件使用的是相同的 `ML.NET` 库版本。考虑在模型文件或目录中使用版本控制来管理不同的模型版本并保持兼容性。\n\
  \n## 架构变化\n\n另一个常见问题是加载的模型架构与模型训练期间使用的预期架构不同。架构变化可能包括转换序列的更改、模型组件的添加或删除，模型流水线结构的变化。\n\
  \n### 调试技巧：\n为了解决架构变化，请实现版本检查，并在进行预测之前确保加载的模型架构与预期架构匹配。提供回退机制或默认模型，以处理在微小架构变化时的后兼容性问题。\n\
  \n## 数据处理流水线差异\n\n`ML.NET` 模型通常依赖数据处理流水线来预处理输入数据。数据处理流水线的变化（例如数据转换或数据预处理步骤的修改）会导致加载错误或错误的预测。\n\
  \n### 调试技巧：\n在加载依赖特定数据处理流水线的模型时，请验证加载的数据处理流水线是否与模型训练期间使用的匹配。通过实现模式演进策略或数据版本控制来处理数据模式的变化，以适应数据处理的变化。\n\
  \n## 文件损坏或篡改\n\n保存在磁盘上的文件有时可能会损坏或被篡改，特别是在不同系统或环境之间共享时。损坏或被篡改的模型文件会导致模型加载期间出错，或在模型预测期间产生不可预测的结果。\n\
  \n### 调试技巧：\n实现完整性检查（如哈希），以在加载期间验证模型文件的完整性。将计算出的哈希与存储的哈希进行比较，检测模型文件的任何变化并避免加载被篡改的模型。\n\
  \n## 模型文件缺失或不完整由于各种原因（如文件管理不当、误删或模型保存过程中出现的问题），可能会发生模型文件缺失或不完整。\n\n### 调试技巧：\n确保在模型加载期间所有必要的模型文件（包括架构、权重和完整性验证文件）存在且可访问。实现错误处理以优雅地处理缺失或不完整的文件，并向用户提供丰富的错误消息。\n\
  \n通过意识到这些常见问题并应用提供的调试技巧，你可以高效保存、加载和管理 `ML.NET` 模型。妥善处理版本、架构变化、数据处理流水线差异、文件完整性和文件完整性将使你能够使用\
  \ `ML.NET` 构建健壮且稳定的机器学习应用程序。\n\n## 结论\n\n总之，精通 `ML.NET` 中保存和加载模型的技巧对于确保跨应用程序的无缝部署和重用性至关重要。通过理解序列化格式和技术的细差别，从业人员可以高效地存储和检索训练过的模型，促进快速原型和实验。利用保存和加载模型提供的灵活性，使开发者能够简化工作流并加速开发周期，最终驱动创新并提升机器学习解决方案的能力。通过勤的实践和探索，从业人员可以利用这些技术构建经得住时间考验的健壮且可扩展的\
  \ `ML.NET` 应用。\n\n在后续章节中，我们将进入优化 ML 模型准确性的领域，领域度与性能在此交汇。通过细致的分析和策略性的改进，我们将深入旨在提高模型准确性的技术，确保机器学习系统交付可靠且富有影响力的结果。\n\
