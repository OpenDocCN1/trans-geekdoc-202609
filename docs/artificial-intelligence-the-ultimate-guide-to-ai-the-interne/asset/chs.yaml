  \n\n# 第 6 章：人工智能\n\n人工智能，又称为 AI，通常被称为机器智能，它是指在机器中显示的智能，相对于通常在人类及其他其他哺乳动物中看到的自然智能。在计算机科学领域，人工智能研究被列为对设备智能的研究，这些设备能够感知其周围环境并采取行动，以最大程度地增加其实现目标的成功机会。非正式地说，“人工智能”一词通常与能够模仿人类认知功能（解决问题或学习）的机器相关。定义中通常去除了\
  \ AI 如何利用智能来完成任务的能力。这被认为是一种被称为“AI 效应”的现象，它导致了特斯勒定理中的一句格言：“AI 是任何尚未实现的事情。”例如，通过视觉进行特殊识别已成为常规技术。现代机器现在能够完成一些被归类为\
  \ AI 的事情，因为它们可以成功理解人类语言，同时在象棋等高级策略性游戏中进行竞争。它们还能自主驾驶汽车，并足够智能到处理军事模拟和内容分发网络中的路由。\n\
  \nKaplan 和 Haenlein 将人工智能分为三个不同的类别，这些分类借用自管理学文献——人性化人工智能、启发型人工智能和分析型人工智能。分析型人工智能在理解和识别其决策中所考虑的认知元素和人类情感方面，仅具有与认知智能以及情感智能一致的特征。人性化\
  \ AI 表现出每种能力（情感、认知、情感性智能和社交智能）的特征，并具有足够的自我意识和自我认知来与他人进行互动。启发型人工智能除了具备感知、社交和认知能力外，必须具有类人的外表。它们必须能够使用自然语言进行清晰交流。而被称为“嗅觉”的最新进展使根源与人类更加接近，因为它们现在可以识别气味了。\n\
  \n1956 年左右，人工智能作为一门学术学科奠定了基础。在随后的几年里，人们经历了多次乐观主义浪，随之而来的是许多失败甚至资金问题。这被称为“AI 寒冬”，但它很快被新的\
  \ AI 方法、胜利以及投入机器人研究的更多资金所取代。在很长的历史中，人工智能实验可以被分为若干子领域，这些子领域之间通常无法保持联系。子领域通常可以根据其技术考量，甚至是特定的目标（使用特定工具或分析差异）进行分类。这些子类别也可以根据机构或研究人员感兴趣的社会因素来创建。\n\
  \n人工智能传统的目标或问题包括操作和移动物体的能力、自然语言处理、感知、学习、表示、规划、知识和推理。该领域的长期目标之一是通用智能。方法包括传统的符号 AI、统计方法和计算智能。AI\
  \ 使用各种工具，包括数学和搜索优化、人工神经网络以及基于经济学概率的方法。AI 经常借鉴语言学、哲学、心理学、信息工程、数学、计算机科学等领域。\n\n人工智能的建立基于这样一个主张：人类的智能“可以被描述得如此精确，以至于让机器来模拟它”。正是这种哲学论点，引发了关于大脑的其他讨论，以及在设计提供与人类相同智能系统的机器人和其他机器人时涉及的任何伦理问题，这些问题自古以来一直通过神话、哲学和小说得到了充分探讨。一些人认为，如果进步不受抑制，AI\
  \ 将对人类构成威胁。然而，也有人认为，与其他技术革命不同，AI 在审查失业问题时会引发巨大的问题。在 21 世纪，随着计算机能力、理论理解和海量数据方面的技术进步，AI\
  \ 技术和方法经历了复兴。人工智能方法已成为这一快速发展的行业的重要部分，并帮助解决了计算机科学、运筹学和程序工程中多个需要其关注的问题。\n\n## 历史\n\
  \n能够处理思维的机器人自古以来就一直在故事中详细描述，并出现在虚构作品中，如卡雷尔·恰佩克的《R.U.R.》或玛丽·谢莱的《弗兰肯肯斯坦》。这些角色及其命运带来了一些与我们现在讨论人工智能原则时所讨论的相同问题。对机器人推理的研究最初始于理论家和数学统计学家。对数学逻辑的检查最终引向了艾兰·图灵（Alan\
  \ Turing）的计算理论，该理论表明机器可以通过对 `1` 和 `0` 等符号的洗牌来复制任何合理的数学推演行为。正是这种洞察促成了“丘奇-图灵论题”，即任何形式的推理过程都可以由数字计算机进行模拟。结合信息学、控制论和神经生物学的最新发现，研究人员开始认为电子脑的发展是一种可能。图灵提议：“如果人类无法区分来自机器和人类的反应，那么机器就可以被视为智能实体。”图灵完备（Turing-complete）人工神经元的设计被认为是人工智能领域的首项工作。它由\
  \ McCulloch 和 Pitts 于 1943 年创建。\n\n人工智能研究领域首次始于 1956 年在达特茅学院举行的一次研讨会。出席者包括来自 `CMU`\
  \ 的 Allen Newell、来自 `MIT` 的 John McCarthy、来自 `CMU` 的 Herbert Simon、来自 `IBM` 的 Arthur\
  \ Samuel 以及来自 `MIT` 的 Marvin Minsky，他们所有人都被认为是人工智能研究的领袖和创始人。这些教授和他们的学生将继续产出被媒体认为不可思议的程序，而机器将能够完成一些被归类为\
  \ AI 的事情，因为它们可以成功理解人类语言，同时在象棋等高级策略性游戏中进行竞争。它们还能自主驾驶汽车，并足够智能到处理军事模拟和内容分发网络中的路由。\n\
  \n*(注：此处省略了原文中重复的段落，以符合高级文档工程师的去重处理)*\n\n\n\n\n1. 如果有人发出威胁，则连续占据两个方格，然后占据剩余的方格；否则，\n\
  2. 如果某次移动可以同时“叉”创建两个线程，则应执行该移动；否则，\n3. 如果中心方格空闲，则应该占据它；否则，\n4. 如果你的对手决定占据角，则你应该占据另一个角；否则，\n\
  5. 如果有任何空闲角，占据其中一个；否则，\n6. 占据任何空闲方格。\n\n许多 AI 算法可以从它们收集的数据中学习，这可以帮助它们通过学习新的启发式方法来增强自身，或帮助它们编写其他算法。在下文描述中，你会看到一些学习器，包括最近邻、决策树和贝叶斯网络，如果给它们无限的内存、时间和数据，它们可能有助于近似任何函数，包括任何最能描述整个世界的数学函数组合。这些学习器可以通过考虑每个可能的假设并将其与数据匹配，从而通晓万事。在实践中，由于组合爆炸现象，考虑每种可能性是不可能的，因为解决问题所需的时间随着问题规模的增大而呈指数级增长。许多\
  \ AI 研究包括发现如何识别并规避最可能无用的大范围可能性。例如，你正在看一张地图，并试图找到从家乡到最近大都市的最短路线。在大多数情况下，你可以跳过所有小城镇或任何偏离路线的地方；得益于路径查找算法，AI\
  \ 也会这样做。这样，每条路线都得到了规划，你就不必担心在到达目的地上浪费时间。\n\n## 问题\n人工智能的总体目标之一是创建允许其他机器和计算机以智能方式工作的技术。实现这一点的总体问题是模拟智能，这必须被分解为子问题。这些子问题将由研究人员预期智能系统展示的一系列特定特征组成。这些特征描述在下。\n\
  \n### 问题解决与推理\n早期研究人员创建的算法展示了人类在进行逻辑推演或解决谜题时所使用的步进式推理。在 20 世纪 80 年代后期甚至 90 年代初，AI\
  \ 研究人员创建了一种用于处理不确定和不完整信息的新方法。这种方法采用了基于经济学和概率的思想。随后发现，这些算法在在解决大型推理问题时是不够的，因为它们会经历组合爆炸，这意味着问题越大，它们的运行速度就呈指数级变慢。事实上，人类很少使用步进式的还原——而早期的\
  \ AI 研究人员正将其作为模型。人类通常使用直觉判断来解决问题。\n\n### 知识表示\n知识工程和知识表示将成为经典 AI 研究的基础。已经有一些专家系统试图拼凑某些狭领域领域专家所拥有的显性知识。此外，一些项目试图收集普通人所拥有的常识知识，并将其整合到包含广泛世界知识的数据库中。这些内容中包括一个全面的常识知识库，它将包含发生在事件、时间、情况、对象和状态之间的属性、类别、对象和关系。它还包括因果、知识以及许多其他未得到充分研究的领域。\n\
  \n“存在什么”的表示是本体论（ontology），它将属性、概念、关系和对象结合在一起，以便程序智能体可以解释它们。它们的语义将通过个体、描述逻辑概念、角色来捕获，并通常在网络本体语言（OWL）中实现为属性、个体和类。上层本体论是最通用的本体论，它充当领域本体论之间的介质，试图为所有其他知识提供基础。一些形式的知识表示可以用于临床决策支持、基于内容的索引和检索、场景解释，以及知识发现和许多其他领域。\n\
  \n知识表示最困难的问题包括：\n\n1. **限定问题与默认推理**：许多人意识到工作假设的存在。例如，如果你在与人说话时脑海中出现了一只鸟，你通常可以在脑海中看到这只鸟并进行充分描述，让别人知道你在想什么。然而，你认为关于鸟的知识可能并不是每只鸟的真相。1969\
  \ 年，John McCarthy 将此问题确定为限定问题：因为 AI 研究人员可以表示的任何常识规则都会有大量的例外。几乎没有什么像抽象逻辑实际要求的那样被简单地标记为真或。AI\
  \ 研究必须探索该问题的每一个解决方案。\n2. **常识知识的范围**：一个人所知的原子事实数量巨大。有一些研究项目试图基于常识知识构建完整的知识库，但这需要大量艰力的本体工程，必须手动一个接一个概念地构建。\n\
  3. **某些常识知识的亚符号形式**：大多数人知道的内容无法表示为可以口头表达的事实或陈述。例如，某个下象棋高手。他们会避免某些位置，因为他们觉得那里太暴露，或者甚至艺术评论家看画画就能看出那是假品。这些是亚符号机制，它们不是意识思维。这种类型的知识为意识知识提供、支持并告知了背景。正如这个亚符号推理问题一样，希望情境\
  \ AI、统计 AI 或计算智能能够提供表示此类类型知识的方法。\n\n\n\n\n# 规划\n规划是通过智能规划来设定目标以及实现目标。目标必须能够使未来可视化。所采取的行动应当与目标相匹配。在经典规划问题中，智能体会假设自己是世界中行动的系统，允许智能体对其行为的后果有确定的。然而，如果智能体仅仅是执行者，那么它要求智能体在没有任何确定性的情况下行动。这要求智能体评估其环境并做出预测，但它们还必须评估自己的预测并根据这些评估进行调整。多智能体规划将利用多个智能体的合作与竞争来达到特定目标。群体智能和进化算法将使用涌现行为。\n\
  \n## 方法\n目前没有指导 AI 研究的成熟理论。研究人员在许多问题上经常产生分歧。一些尚未解决的长期问题是：“人工智能是否应该通过研究心理学或神经生物学来模拟自然智能？”“或者人类生物学对\
  \ AI 研究来说是否就像鸟类生物学对航空工程一样无关？”“可以使用简单、优雅的原理来描述智能行为吗？”“还是它必然需要解决大量完全无关的问题？”\n\n###\
  \ 控制论与脑模拟\n在 20 世纪 40 年代和 50 年代，许多研究人员探索了神经生物学、控制论和信息论是如何联系在一起的。其中一些研究人员建造了使用电子网络展示原始智能的机器，例如\
  \ W. 格雷·沃尔特的乌龟或约翰斯·霍普金斯大学的“野兽”。英国的 Ratio 俱乐部和普林斯顿大学的目的论学会举行了会议，许多研究人员聚集在一起。直到 1960\
  \ 年这种方法才被抛弃，尽管在 20 世纪 80 年代它的某些元素被重新引入。\n\n### 符号\n只要能够访问数字计算机，AI 就开始探索人类智能如何简化符号操作。卡内基梅大学（CMU）、麻省理工学院（MIT）和斯坦福大学是研究的中心。老派的\
  \ AI，简称 `GOFAI`，是约翰·哈格尔对这些符号化 AI 方法的命名。符号化方法在 60 年代期间，在小型演示程序中模拟高级程序的思维方面开始取得成功。这些方法基于控制论以及人工神经网络，后者要么被边缘化，要么被完全抛弃。20\
  \ 世纪 60 年代和 70 年代的研究深信，符号化方法最终将创造出具有通用人工智能的机器，这被认为是他们领域的目标。\n\n### 认知模拟\n为了将它们形式化，两位经济学家赫尔伯特·西蒙和艾伦·纽威尔研究了人类的问题解决能力。他们的工作为人工智能以及运筹学、管理科学和认知科学奠定了。他们的研究小组利用从心理实验中获得的结果来开发有助于模拟人们解决问题所需技巧的技能。这一传统始于\
  \ CMU，并在 20 世纪 80 年代通过 `Soar` 架构流传。\n\n### 粗糙或反逻辑\nMIT 的研究人员发现，通过自然语言处理和视觉解决困难问题时，需要特设（ad-hoc）的解决方案，这些研究人员认为，任何通用或简单的原理都无法捕捉智能行为的每一个方面。罗杰·尚克使用“scruffy”（粗糙/不整洁）一词来描述该团队的反逻辑方法。由于常识知识库必须手动构建，它成为了粗糙\
  \ AI 的范例，这在一度曾是一个复杂的概念。\n\n## 应用\n任何智力任务都可以与人工智能有关。AI 效应是一种现象，当一项技术成为主流时，你就不再认为它是人工智能了。自动驾驶汽车和无人机只是现代\
  \ AI 高知名度例子中的几个。你也可以在线广告投放、司法裁决、航班延误预测、垃圾过滤、图像识别、在线助手、玩国际象棋或围棋等游戏时的搜索引擎、数学定理的证明、艺术创作和医学诊断中看到它们。社交媒体正在逐渐取代电视成为接触年轻人的来源，这意味着大型新闻机构必须依赖社交媒体平台让人们阅读新闻。即使是主要的出版商也在使用人工智能来产生更大的流量并有效地发布更多故事。\n\
  \n### 医疗保健\n发现表明，如果使用 AI 诊断患者，可以节省高达 160 亿美元。2016 年，加州的一项在 AI 帮助下的突破性研究创建了一个公式，以正确确定器官患者所需的免疫抑制剂药物的正确剂量。得益于医生的协助，医疗行业已逐渐进入人工智能。微软开发的一项\
  \ AI 已经帮助医生找到了如何正确治疗癌症。根据彭博科技的，已经开发了大量与癌症相关的药物和研究。详细来说，据称已制造了 800 多种疫苗和药物来治疗癌症。然而，这会对医生产生负面影响，因为从太多选项中为患者找到正确的药物可能是困难的。`Hanover`\
  \ 是微软的一个正在进行的项目。其主要目标是记住所有关于癌症的研究人员和研究，并帮助预测最有效的药物组合。对抗髓性白血病是一个目前正在进行的项目。这种癌症是致命的，几十年来其治疗一直没有改进。另一项研究还发现，AI\
  \ 定位皮肤癌的能力与经过训练的医生相当。还进行了另一项研究，将 AI 用于发现和监控几位风险较高的患者。AI 根据从医生与患者现场互动中收集的信息向每位患者提问。外科医生还在位于位于华盛顿的儿童国家医疗中心进行了一项研究。外科医生团队在他们的监督下使用自主机器人对猪的肠道进行手术。他们观察到机器人的表现比熟练的人类医生得多。IBM\
  \ 拥有的 AI 计算机 `Watson` 也对一名患有白血病的女性做出了诊断。\n\n### 汽车\nAI 的进步通过创造和演进自动驾驶车辆促进了汽车行业的发展增长。2016\
  \ 年，超过 30 家公司使用 AI 来制造无人驾驶汽车。其中一些公司包括苹果、谷歌和特斯拉。自动驾驶汽车的功能由几个组件组成。集成在这些车辆上的系统包括导航、地图、制动、碰撞预防和变道。结合时，它们将在复杂车辆内部的高性能计算机上运行。尽管仍在测试中，由于目前自动汽车的改进，无人驾驶卡车现在也被制造。英国政府于\
  \ 2018 年通过了关于自动驾驶卡车启动测试的立法。非自动驾驶卡车后面将跟着自动驾驶卡车队。`Freightliner Inspirations` 正在德国一家名为戴姆勒的汽车公司进行测试。这是一种在高速公路上使用的半自动卡车。影响车辆是否能无人驾驶的因素之一是地图是否正常工作。通常情况下，车辆行驶区域的地图通常是预先编程的。这张地图将包含路灯和路缘高度，以便车辆熟悉该区域。然而，谷歌已经开发了一种算法，旨在消除对预编程地图的需求，取而代之的是一个能够适应车辆所经过的新环境的设备。一些已经开发的自动驾驶汽车没有刹车或方向盘。它们是一项研究的一部分，该研究专注于创建一种算法，通过熟悉行驶状况和速度为乘客维持一个安全的环境。另一个影响无人驾驶汽车的因素是乘客的安全性。为了制造无人驾驶汽车，工程师必须对其进行编程，使其能够处理带来更高风险的情况。这些可能包括迎撞行人。他们的目标是确保路人和乘客的安全。汽车可能做出让某人处于危险中的决定。换句话说，汽车可能必须决定救乘客还是行人。程序将是创造成功的无人驾驶汽车的关键部分。\n\
  \n### 金融与经济\n金融机构长期以来一直人工神经网络来检测不符合客户正常消费习惯的变化或索赔。这些费用会被标记出来供人工调查。自 1987 年以来，每当太平洋银行成立反欺诈工作组时，银行业就会使用人工智能来对抗未经授权的信用卡使用。金融服务还在\
  \ `Moneystream` 和 `Kasisto` 等程序中使用 AI。银行现在使用 AI 管理财产、投资股票、维护账目和组织运营。每当业务没有发生或夜夜发生了任何变化时，AI\
  \ 都能做出反应。2001 年举行了一场模拟金融竞赛，机器人赢了人类。它还监控用户的行为模式；因此有助于减少金融和欺诈犯罪。\n\n### 视频游戏\n视频游戏也使用人工智能，以便\
  \ `NPCs`（非玩家角色）具有动态的、有目的的行为。此外，路径寻找也使用了 AI 技术。一些研究认为视频游戏中的 `NPCs` 可以解决生产任务中的问题。\n\
  \n### 军事\n2015 年，全球各国军队在机器人方面的支出金额达 75 亿美元，此前为 51 亿美元。军事无人机由于它们向军事展示的自主行动，已成为一种实用的资产。弗拉基米尔·普京在\
  \ 2017 年表示：“谁成为人工智能的领导者，谁就统治世界。”许多 AI 研究人员正让自己远离 AI 的军事应用。\n\n\n\n\n\n# 第 7 章：机器学习\n\
  \n“机器学习”指的是个人电脑（PC）科学中的一个领域，在该领域中，计算机被赋予了进行学习所需的工具，而无需由人工进行编程。这项研究的演变包含了人工智能领域中的模式识别和学习理论。机器将探索这项研究，并学习如何利用为这些算法提供的数据构建算法并做出预测，从而克服静态的编程指令。这些指令将通过使用基础数据输入来构建模型，由数据驱动进行预测或决策。算法在计算任务中被发明，并以最优的性能执行。这正是你通常使用机器学习的地方。\n\
  \n一个例子是你的电子邮件为了保持安全而进行的分类。机器学习往往与计算机统计学有重叠，即通过一个与优化数学方程紧密联系的计算机进行预测。这使得理论、方法和应用在该领域占据主导地位。使用数据分析的“数据挖掘”经常与机器学习被混淆。无监督学习也被称为数据分析。即使是无监督的，机器学习在发现有意义的异常之前，也应该学会为自己的行为创建一个基准。在数据分析领域，机器学习将用于创建复杂的方法以及用于预测的算法。这些预测在商业化时被称为预测分析。这些预测将使研究人员、分析师、工程师和数据科学家能够从数据趋势和历史关系中学习，发现任何可能隐藏的见解，并做出可靠的决策。2016\
  \ 年，机器学习成为盖特热周期中的一个热词，当时它正处于通胀预期的巅峰。由于寻找模式非常困难，通常没有足够的训练数据可用。\n\n## 任务与问题\n\n根据学习的性质，你可以机器学习分为三类：\n\
  \n1. **无监督学习**：所使用的学习算法不会提供标签，这使得它必须在输入中寻找自己的结构。你可以将无监督学习作为发现你所使用数据中隐藏模式的目标，或作为达到目的的手段。\n\
  2. **监督学习**：你的计算机将获得输入以及你想要得到的结果，这样计算机就可以学习一种关于如何映射输入和结果的通用规则。\n3. **强化学习**：有一个计算机程序在动态环境中工作以执行特定目标，例如当你与对手对玩游戏时。当程序在问题空间导航时，它将以奖励和惩罚的形式为你提供反馈。\n\
  \n还有**半监督学习**，它介于监督和无监督学习之间。这是当你向训练集提供不完整的训练信号时，使得程序必须完成部分工作。**直推（Transduction）**是指原则应用于整个问题的情况，例如学习时间。但每当目标缺失时，这种方法将不起作用。\n\
  \n机器学习还包括诸如**学习**等类别，程序将根据以前发生过的经验学习程序的归纳偏置。**发展性学习**与机器人学习相同，程序能够从它所经历的学习情境中生成自己的序列，以便通过与人类和其他程序的交互以及自我探索来学习新颖技能。\n\
  \n当你考虑机器学习系统的输出结果时，会产生另外一类机器学习：\n\n1. **输入的分类**将分为至少两类，用户必须产生一个模型，该模型将从这些类别中处理用户未见过的输入。这通常发生在监督学习中，例如你的电子邮件过滤器在垃圾邮件和非垃圾邮件之间进行过滤。\n\
  2. **回归**也是监督的，以使结果是连续的而不是离散的。\n3. **聚类**将输入集并划分为不同的组。然而，聚类和分类的区别在于，在这些组形成之前用户并不知道这些组，这使其成为了一项无监督任务。\n\
  4. **密度估计**将在该空间内定位输入的分布。\n5. **降维**获取输入并将其简化，以便将其映射到最低维度。\n6. **主题建模**将处理用户插入程序的问题，并被要求检查插入的文档是否涵盖了相关主题。\n\
  \n## 验证与评估\n\n分类机器学习模型将通过使用准确率估计的技术（如`留法（holdout）`）进行验证。`留法`在训练和测试集合之前对数据进行划分，以便在评估模型性能之前评估测试集。然而，如果你查看`n\
  \ 折交叉验证（n fold cross-validation）`，你会发现数据被随机分成子集，其中`k-1`个实例用于训练模型，而`k-个`实例则用于测试你所使用的训练模型的预测能力。与此，`留法`和`交叉验证`方法将使用样本实例，其中替换来自数据集，并能够在评估模型准确性时发挥。\n\
  \n此外，研究人员还会发现一个总体准确率；它将针对特异性和敏感性进行报告，例如真阴性率和真阳性率——这意味着真阴性率和真阳性率有时会报告假阳性率或假阴性率。然而，正是这些比率未能显示等式的分子和分母。你的总工作特征（ROC）是一种显示模型诊断能力的有效方法。总工作特征还将揭示之前提到的分子和分母，这意味着总工作特征将提供比使用`曲线下面积（area\
  \ under the curve）`更多的信息。\n\n## 伦理与演变\n\n由于其特性，机器学习经常引发伦理问题。用于处理你收集的数据的训练系统将根据所使用的示例产生偏差，而这些示例是数字化的。因此，来自数据的数据责任是机器学习的重要部分。由于你在处理机器学习时使用的语言，你将使用经过训练的机器。神经网络是受生物学启发的范式，使计算机能够从观察到的数据中学习。`神经网络`和`深度学习`将为你处理图像、语音和自然语言时所遇到的任何问题提供最佳解决方案。人类系统是复杂的，也是你可以研究的最有趣的事情之一，因为你永远无法完全理解它的运作方式。\n\
  \n## 神经网络与感知机\n\n人类系统是复杂的，也是你可以研究的最有趣的事情之一，因为你永远无法完全理解它是如何工作的。例如，识别手写体时，很多人能够识别出手写的内容，但这并不容易，你的大脑已经适应了这一点。我们并不经常花时间去思考复杂的系统是如何运作的。由于识别模式是困难的，计算机不会产生这些问题。然而，这与我们的做法不同，你如何让计算机识别出手写的内容？你将不得不创建规则和例外。\n\
  \n神经网络方法将以不同的方式看待问题。它将处理大量经过训练的手写示例，以便能够执行大脑所做的事情。本质上，神经网络将使用数据内部的示例来推断。你为程序添加的训练示例越多，网络就越能学习更多选项以提高准确率。\n\
  \n神经网络与一种名为`感知机（perceptron）`的人工神经元工作，这是罗森布特（Rosenblatt）在 60 年代开发的。但当我们今天观察它时，它被作为其他人工神经元模型使用。你的主神经元将被称为`sigmoid\
  \ 神经元`。为了理解`sigmoid 神经元`，必须理解`感知机`。感知机将接受多个输入并给你一个二元结果。罗森布特提出了一种规则，将在处理感知机的输出时使用。这里`权重（weights）`介入了，作为一种表示实数的方式，并带来输入和输出。神经元的输出将是\
  \ 0 或 1，取决于和小于或大于`阈值（threshold）`。你的阈值值将是一个实数。\n\n将`感知机`看作通过权衡证据来做出决策的设备。例如，如果你想参加活动，有几点你需要查看：\n\
  1. 对于每个人来说是否足够大？\n2. 天气好吗？\n3. 你参加活动需要多少时间？\n\n每个因素都可以由一个二元变量表示。通过查看`权重`和你的问题`阈值`，你可以创建不同的决策过程模型。你的`感知机`将决定你是否参加活动。当你丢弃阈值时，它最有可能发生。请记住，你的`感知机`并不是人类可以执行的决策过程的完整模型。然而，如果你对权重进行任何更改，你的`感知机`可能会由于该变化而完全翻转。这种变化将导致整个网络的行为变为更复杂的行为。\n\
  \n所以，当你的数字之一被正确分类时，你的网络以一种难以控制的方式运行。你的网络的新行为使得难以看到修改`权重`和`偏置（biases）`。因此，必须有一种聪明的方法来解决这个可能并不明显的问题：引入一种新的神经元，即`sigmoid\
  \ 神经元`。这些神经元类似于`感知机`，但它们经过了修改，使得当你进行微小更改时，只会给你的输出产生微小变化，而不是改变你的输出。这至关重要，`sigmoid\
  \ 神经元`能够学习网络的行为。`sigmoid 神经元`的输入类似于`感知机`，但它能够接受 0 到 1 之间的任何值。\n\n`sigmoid 表达式`由以下方程定义：\n\
  ```\nσ(z) = 1 / (1 + e^-z)\n```\n另一种观察方式是带有输入的`sigmoid 神经元`：\n```\nσ(z) = 1 / (1\
  \ + exp(-∑xj-b))\n```\n其中`z = w·x + b`，有一个很大的正数。这意味着`e^-z ≈ 0` 和`σ(z) ≈ 1`是相等的。现在设想如果你正在处理负数，那么你的`sigmoid`行为将与**感知机`相同。你看到的与`感知机`模型的偏差只是中等规模。但你的`σ`的数学形式是什么？事实是，这个变量的精确形式没有影响，因为我们将关注表达式的形状。如果这个函数是一个阶跃表达式（step\
  \ expression），那么你的`sigmoid 神经元`最终将是一个`感知机`，因为结果取决于你的方程给出的是正结果还是负结果。当你使用`σ`的函数时，你将得到一个平滑的`感知机`。然而，你的表达式有多平滑并不是你需要花费太多时间的事情。平滑性仅仅会修改权重和偏置，从而改变你的`sigmoid\
  \ 神经元`的输出。得益于微积分，你的输出将由这个方程预测：\n```\nΔoutcome = ∂outcome/∂wj + ∂outcome/∂b\n```\n\
  你的和是在所有权重上找到的，你的输出将显示相对于权重所需的输出偏导数。如果你发现自己不熟悉偏导数，不要太担心。你上面的表达式由于其中的偏导数而看起来很复杂，网络输入将是扫描的像素数据，以便网络可以学习`权重`和`偏置`以正确分类输出。如果你对网络中的权重进行任何更改，你的输出将与你所做的更改对应。然而，`感知机`的现实是，当权重发生变化时，`感知机`可能会完全翻转。这种变化将导致你的网络的行为变为更复杂的行为。\n\
  \n所以，当你的数字之一被正确分类时，你的网络以一种难以控制的方式运行。你的网络的行为使得难以看到修改`权重`和`偏置`。因此，必须有一种聪明的方法来解决这个可能并不明显的问题：引入一种新的神经元，即`sigmoid\
  \ 神经元`。这些神经元类似于`感知机`，但它们经过了修改，使得当你进行微小更改时，只会给你的输出产生微小变化，而不是改变你的输出。这至关重要，`sigmoid\
  \ 神经元`能够学习网络的行为。`sigmoid 神经元`的输入类似于`感知机`，但它能够接受 0 到 1 之间的任何值。\n\n\n\n\n你的假设需要是可测试的，以判断是否提供了足够的数据。\n\
  \n## 机器学习与机器人\n\n既然你已经了解了什么是机器学习，那么这个术语对机器人领域兴趣的激发以及在过去几年中没有太大变化应该并不让你意外。但机器学习与机器人之间有什么关系呢？机器人领域只有少数项发展导致了其他发展，包括机器学习。以下是机器人领域中常见的五种机器学习应用：\n\
  \n### 1. 计算机视觉\n有些人会认为“机器人视觉”或“机器视觉”才是正确的术语，因为“机器人视觉”涉及的不仅仅是计算机算法。机器人专家和工程师研究了什么类型的摄像头硬件可以让机器人处理周围的物理数据。机器人视觉和机器视觉密切相关。它们的出现可以归功于自动检测系统的创建和机器人引导。两者在应用于机器人视觉的运动学上仅有微小区别，这涵盖了坐标系校准以及机器人物理影响其环境的能力。\n\
  \n大数据的涌入有助于推动计算机视觉的进步，这又进一步帮助了许多大学基于结构化预测学习技术的机器学习。\n\n### 2. 模仿学习\n模仿学习与观察性学习密切相关，这种行为在婴儿和幼儿身上可以见到。模仿学习被认为是强化学习的伞下分类，或者是让智能体在世界中行动以实现奖励最大化的挑战。这种方法具有共同特征，即概率模型和贝叶斯。最终的问题是，模仿学习是否能够用于人形机器人。\n\
  \n作为机器人领域的重要部分，模仿学习在搜索救援和建筑等领域具有工厂环境之外的移动性，这使得手动编写机器人解决方案具有挑战性。\n\n### 3. 自监督学习\n\
  由于自监督学习方法，机器人将被允许生成自己的训练示例，以便提高性能。这将包括优先训练以及近距离采集的数据，这些数据将用于翻译远距离传感器数据。带有光学设备的机器人配备了此类设备，以便它们拒绝和检测物体。\n\
  \n康奈和斯坦福大学创建了一个名为 `Watch-Bot` 的坚实示例，它使用笔记本电脑、激光笔、3D 传感器和摄像头来寻找人类正常活动，这些模式是通过概率方法学习的。为了发出提醒，`Watch-Bot`\
  \ 在物体中使用激光笔。在一次测试中，机器人几乎在 60% 的时间内提醒了人类，但机器人并不理解自己在做什么或为什么要这样做。\n\n### 4. 医疗与辅助技术\n\
  辅助机器人是一种设备，在执行操作之前可以感知并处理感官信息，最终有利于残障人士和老年人。这些运动治疗机器人将提供治疗和诊断益处。由于它们对于国外和美国的医院来说仍然价格昂贵，它们尚未离开实验室。\n\
  \n辅助技术的某些早期示例是桌面职业辅助机器人或 `DeVAR`。它是斯坦福大学和帕洛奥托退伍军事务康复研究与开发中心在 20 世纪 90 年代初开发的 `DeVAR`。目前仍有基于机器学习的机器人辅助技术的研究。`MICO`\
  \ 臂就是一个示例。它是一种具有自主性的辅助机器，使用 `Kinect` 传感器来观察世界。这些影响将变得复杂，但它们将为世界提供更智能、能更好地适应用户需求的辅助机器人。机器学习的进步也可以体现在医疗领域。尽管医疗机构尚未使用它，但机器人技术正在以飞速发展。\n\
  \n### 5. 多智能体学习\n多智能体学习包含一些关键组件，即谈判与协调，这涉及到基于机器学习的机器人，其目标是寻找平衡策略并适应机器人不断变化的环境。例如，涉及加权算法的无悔学习工具包含在多智能体学习方法中，这些方法将帮助提高与基于市场的分布式控制系统中所发现的多智能体学习和规划相相关的学习成果。\n\
  \n在 2014 年底，麻省理工决策与信息系统实验室了一了一种用于分布式机器人或智能体的更可靠的算法示例。机器人能够协作构建一个更具包容性的更好的学习模型，该模型由单个机器人完成，其基础是构建探索和房间布局，同时自主构建知识库。每台机器人都会制作目录，然后将这些目录与其他机器人的数据集合并，在构建此类知识库时，分布式算法的性能优于标准算法。这种机器学习方法虽然不是完美的系统，但将允许机器人比较目录并强化相互观察，同时纠正任何遗漏或过度泛化，这在不不的多个机器人应用中将发挥作用。\n\
  \n## 未来展望\n正如你上面所看到的，机器人领域中基于机器学习的方法开始与军事创新者或赞助商（他们为大型机器人制造商甚至初创公司工作服务）所提出的挑战和合同相结合，同时汽车制造商对下一代自动驾驶汽车的投入也在增加。由于机器学习的能力，它正被用于进一步推进机器人技术，并让机器人在处理数据和解释这些数据方面变得更加复杂。\n\
  \n\n\n\n# 第 8 章：自动驾驶车辆\n\n自动驾驶汽车也被称为机器人汽车、自主驾驶汽车甚至无人驾驶汽车。这些车辆能够感知其所处的环境，并在无需人类干预或极少人类干预的情况下移动。自动驾驶汽车将配备各种传感器，以帮助它们评估周围环境，例如惯性测量单元、GPS、里程计、声纳、计算机视觉、激光雷达和雷达。此外，还有先进的控制系统可以解释传感器信息，以识别正确的导航路径以及车辆路径上可能任何障碍物或标志。\n\
  \n## 自动驾驶车辆的优势\n一些优点将包括提高安全性和降低成本。它们还将提高流动性、减少犯罪率并提高客户满意度。由于自动化汽车的出现，预计交通流量将会增加，同时为贫人、老年人、残障人士和儿童提供更强的移动性。它们将使旅行变得更容易，因为司机不再需要全程负责驾驶和导航，同时还能降低油耗以及对停车位的需求。\n\
  \n## 挑战与担忧\n自动驾驶汽车面临的一些问题是安全、责任归属和技术。每当人在车内时，他们都会产生控制车辆的欲望。不仅如此，研究人员还必须通过法律框架和政府法规。此外，这会让人们觉得失去了隐私，从而导致如黑客攻击或恐怖主义等安全担忧。在此基础上，由于不再需要司机坐在方向盘后，人们可能会失去工作。这还会导致郊区化旅行增加，因为这变得更加方便。\n\
  \n## 半自动车辆\n自动化程度是许多车辆的基础。它们可能被归类为全自动或全手动驾驶车辆。半自动车辆就是它们的统称。在技术和基础设施完全开发出全自动车辆之前，还需要一段时间，但在研究期间，车辆将根据其自动化程度不断增加。半自动车辆将比全自动车辆更具优势，因为司机仍然控制着车辆。\n\
  \n## 应用领域\n\n### 自动化卡车\n许多公司正在对半挂车进行自动化技术测试。2016 年，Uber 购买了一家自动驾驶卡车公司 `Otto`，在 Uber\
  \ 购买之前，他们必须在公路上展示他们的卡车。随后，在 2017 年，一家位于旧金山的初创公司宣布，他们将与名为 `Peterbilt` 的卡车制造商合作，以便在\
  \ `Peterbilt` 车辆中部署和测试自动化技术。据推，Waymo 正在对卡车进行自动化技术测试，但该项目尚未提供时间表。此外，在 2018 年，位于旧金山的\
  \ `Starsky Robotics` 完成了前往佛罗里达州的 7 英里无人驾驶行程。这使他们成为公共道路上无人驾驶卡车竞争中的第一个参与者。\n\n在欧洲，人们开始通过“环境安全道路列车”方法考虑卡车编队。洛克希德·马丁（Lockheed\
  \ Martin）联合美国军方的资金，开发了一种自动化卡车运输系统，该系统将一辆由人类驾驶的卡车置于前方，随后有卡车自动跟随。这是作为陆军“自主移动应用系统（AMAS）”的一部分正在开发的。2014\
  \ 年，该系统由一个自动驾驶软件包组成，可安装在多达九种不同类型的车辆中，必须以 `40 mph` 的速度行驶超过 `55,000 hours`。2017 年，`AMAS`\
  \ 开始计划部署多达 200 辆卡车，这些卡车是快速部署计划的一部分。\n\n### 交通系统\n为自动汽车创建的交通系统开始在城市中运行，例如英国、法国、意大利和比利的一些地区，而在荷兰、西班牙和德国，他们正在交通中进行公开测试。英国在米尔顿凯恩斯启动了自动驾驶座舱\
  \ `LUTZ Pathfinder` 的公开试验。法国政府在 2014 年夏季允许 `PSA Peugeot-Citroen` 在巴黎进行试验。这些实验计划在\
  \ 2016 年扩展到斯特拉斯堡和波尔多等城市。法国公司 `Valeo` 和 `THALES` 之间的联盟也允许了自己的测试运行。\n\n在新西兰，陶朗加和基督城等城市已经计划将自动驾驶车辆用于公共交通。随后，在中国，已经生产出一种没有驾驶座、可容纳\
  \ 14 人座的自动驾驶微型巴士。目前已生产了超过 100 辆车，2018 年标志着中国可用商业自动化服务的第一年。这些微型巴士应该进入四级水平，这将是一个封闭道路上的无人驾驶环境。\n\
  \n\n\n\n\n# 第 9 章：语音识别\n\n语音识别是一门属于计算语言学的交叉学科子领域，它被用于开发各种方法和技术，帮助机器识别并会将口语语言转换为文本。这也被称为计算机语音识别、语音转文本\
  \ (`STT`) 或自动语音识别 (`ASR`)。语音识别将整合计算机科学、语言学和电气工程所需的所需的知识和研究。\n\n某些系统可能需要进行训练，即由说话者向系统朗读词汇或文本。随后，系统将对该人的声音进行分析，并将其用于微调对该人语音的识别，有助于提高准确性。依赖说话人的系统使用训练，而独立于说话人的系统则不需要训练。\n\
  \n语音识别应用将包括语音拨号、呼叫路由、简单数据输入、确定说话者特征、飞机、语音转文本处理、结构化文档的准备以及家用电器控制搜索等。“语音识别”一词是指识别说话者的身份，而不是他们所说的内容。通过识别说话者，系统中的翻译任务将变得简单。\n\
  \n从技术角度看语音识别，它拥有悠久的历史，经历了多次创新浪潮。最近的浪潮之一得益于大数据和深度学习。这些进展不仅体现在已学术论文的激增上，还体现在全球范围内，设计和部署这些语音识别系统时对不同深度学习方法的采用上。你可以在\
  \ SoundHound、微软 (Microsoft)、IBM、亚马逊 (Amazon) 和苹果 (Apple) 等公司看到这种创新。\n\n## 机器人中的语音识别\n\
  \n你曾经见过机器人说话吗？得益于语音识别，这是可能的！正如我们之前提到的，语音识别将分为两类：独立于说话人和依赖说话人。\n\n依赖说话人的系统将由一个人进行训练，而这个人将是该系统的使用者。这些系统效率很高，可以获得高指令计数；然而，系统只会对训练过系统的人做出响应。\n\
  \n独立于说话人的系统将被训练为响应某个说话者的词汇。语音输入设备将安装在控制器上；因此，与运动相关的指令将通过语音给出，然后转换为数字形式。这将由模拟数字转换器完成。指令将输入到麦克风，然后电信号可以将声音转换为运动。一旦将这些数字信号给到机器人控制器，将使用过滤设备处理语音形式形式的数据。为了提高准确度和音质，将有一个转换建模过程来形成系统响应。\n\
  \n## 系统识别电路\n\n要训练多达 40 个单词的电路，你可以这样考虑：你通过按下 `1` 来训练系统识别第一个单词。按下任何数字，红色 LED 都会熄灭。这些数字将显示在数字显示器上。一旦按下井号键\
  \ (#)，它将训练系统。通过按下井号键，它将向一个芯片发送信号，该芯片将听训练词并然后打开 LED。\n\n要进行测试，下一步是说你想让系统识别的单词；此时将使用麦克风。一旦单词被接受，LED\
  \ 将会闪烁。你将对所有 40 个单词执行此操作，你应该能在显示器上看到每个录的单词。\n\n语音识别系统可以分解为四个不同的部分：\n\n1. 语音识别将使用分离的音频。\n\
  2. 源的线性分离。\n3. 从过滤后的输出中计算缺失的特征。\n4. 过滤后的多通道。\n\n一旦机器过滤了语音，机器人将执行所请求的指令。随着技术的进步，机器人不仅能够使用语音识别程序来接收指令，还能在完成任务时与人类与其他机器人进行通信。\n\
  \n\n\n\n\n# 第 10 章：无人机\n\nUAV 或无人驾驶飞行器通常被称为无人机，它们是不需要人类驾驶员的飞行器。UAV 是无人飞行器系统的一部分，这些系统可以包括从地面控制的\
  \ UAV，或者两者之间运行的通信系统。UAV 的飞行方式可能基于不同程度的自主性运行，既可以通过远程控制进行操作，也可以通过机载计算机自主运行。\n\n无人机最初用于对人类来说太危险或太肮脏的任务，主要用于军事领域，但其用途迅速扩展到商业、娱乐、科学、农业等应用领域，例如监控、产品递送、执法、维和、摄影、走私和竞速。\n\
  \n## 无人机与机器人机载计算机\n\n下一代无人机和机器人将比之前的产品更智能、更快、更轻。这得益于精简的解决方案，它将多种计算功能集成到单个板上。高通无人机和机器人技术将能够在减少机载计算机体积的同时，提供强大的连接、长电池续航和先进的处理能力。由于体积更小，设计的复杂性也将降低，这意味着无人机对更广泛的受众来说将更加负担得起。\n\
  \n### 单板技术\n\n得益于 `Snapdragon Flight`，无人机将变得更轻且更容易使用。这项技术将集成 4K 高分辨率摄像头支持、高精度的位置定位甚至实时飞行控制，所有这些都将安装在单板上；从而使\
  \ OEM（原始设备）的产品更小、更坚固。\n\n### 异构平台\n\n使用异构平台构建智能无人机和机器人组件将帮助 OEM 创建更安全、更轻的无人机和机器人，最终降低机器人成本，面向更多消费者。\n\
  \n### 自主飞行\n\n得益于技术的进步，OEM 可以使其具备感知能力和自主能力。由于先进的技术平台，它将内置传感器与 3D 环境映射相结合，允许无人机自主飞行。\n\
  \n### 低功耗\n\n通过在单板上组合多个组件，该板将提供低功耗轻量化的解决方案，助力呈现先进的飞行连接和控制。\n\n### 可靠程序\n\n`Snapdragon\
  \ Navigator` 程序将提供智能导航，允许无人机在飞行过程中看到并对路径上的物体做出反应，从而提供更安全、更可靠的导航。\n\n### 智能电机控制器\n\
  \n`Snapdragon flight` 将包含智能电机控制以及 500Hz 纬度处理，这将使飞行体验更稳定，同时增加电池寿命并减轻发动机的压力。\n\n###\
  \ 位置控制\n\n由于采用了先进的位置控制，飞行比以往更加平畅，这通过结合 `GPS`、超声波传感器、惯性测量单元以及气压计传感器来实现，有助于增强空中的稳定性。\n\
  \n### 双向检测\n\n为了避免碰撞和飞行路径障碍，将使用双向检测，并配合电子速度控制器的协助，该控制器可以识别任何螺旋桨阻挡，甚至提供室内和室外的飞行能力。\n\
  \n### 高级 Wi-Fi\n\n`Snapdragon flight` 使用 801 工艺支持非常先进的 Wi-Fi，允许无人机精确确定自己的所在位置，这在用于警察或军事事务时非常有帮助。\n\
  \n## 现实世界应用\n\n无人机变得非常有用，因为它们可以被送到人类因环境太危险或太肮脏而不应进入的情况。以下是无人机的一些现实世界应用：\n\n1. **战争**：无人机最早起源于军事领域，至今仍在使用。军事部门拥有目前最先进的功能，并在期间利用无人机进行监控，在无人知情的情况下收集情报。无人机还用于空袭。\n\
  2. **执法**：如果你与警察发生冲突，在不久的将来你可能会从上方被电击枪命中。北达科他州的警察使用无人机对罪犯进行电击，并在该州严厉打击犯罪的努力中部署催泪弹。\n\
  3. **消防**：虽然这可能让你看到无人机向灌木丛火灾洒水的画面，但你的理解稍有偏差。无人机被用于向灌木丛火中投火。这被称为受控燃烧，旨在通过烧掉火势可能利用的灌丛来阻止野火蔓延。这也被用于维护生物多样性。回到\
  \ 2007 年，无人机曾被用于协助南加州的野火救援。无人机利用传感器技术穿过烟雾，判断火势有多大。\n4. **新闻采集机器**：多家新闻机构已引入无人机作为其“天空中之眼”。\n\
  5. **石油探探**：许多大型石油天然气公司完全支持使用无人机寻找新油田。目前，获准此类飞机以这种方式运行的地方仅限于美国已知的某些遥远地区。\n6. **自拍机器人**：这一项更多是针对千一代而非其他任何人。在对自拍的痴迷方面，没有任何一项技术趋势是千一代不会采用的。有了这个，你只需将相机系在无人机上，让它在你参加的任何活动中飞翔即可。\n\
  \n甚至亚马逊也找到了通过无人机递送来加入无人机领域。随着技术的不断进步，我们可能会开始看到无人机在空中加油过程、救援任务甚至作为远程导游中发挥更大的作用。\n\
  \n\n\n\n\n# 第 11 章：业务中的机器人技术\n\n机器人在业务中发挥着非常重要的作用。现在，这可能会让你联想到科幻般的未来；然而，在许多行业，许多业务正转向利用机器人来完成人类完成起来过于危险、劳累或耗时的任务。\n\
  \n## 工厂制造\n机器人执行的一项常见任务是在工厂空间内的产品组装线。制造机器人处理焊接、分拣、组装以及包装和放置操作等任务的效率和速度高于人类。电动机的推重量比使得这些机器人在需要敏捷、力量和一致性的任务中非常可靠。工厂机器人减少了工作场所事故的风险，并确保了对产品质量的控制。它们还可以在人类不安全的环境中工作。\n\
  \n## 营销\n科技公司推出了机器人来展示新发明，同时营造出创新和进步感。这些机器人是互动式展示的一部分，可以在贸易展会上看到；在那里，它们与传统的营销工具竞争，以捕捉货物并将其交给准备好向自动化系统输入请求的员工。这些机器人不仅节省了时间，还减少了由于库存跟踪不一致可能导致的错误。\n\
  \n## 娱乐\n用于业务的最后一类机器人是旨在娱乐人们的机器人。机器人和机器人展示将出现在店商店、主题公园和电视上。这些机器人被制成像真人一样，而另一些则代表奇幻生物或虚构世界中的机械机器人。这些角色充斥在科幻故事中，而这些特效机器人则进入人类或动物不安全的危险环境。\n\
  \n## 机器人接管工作\n2017 年估计，到 2030 年，美国三分之一的工作将面临被自动化的极高风险，这一比例高于英国、日本和德国。这项分析来自一家会计和咨询公司，该公司表示，该分析基于技术进步的方向和速度，以及人工智能和机器人技术的预期能力。估计美国至少有\
  \ 38%的工作将面临自动化风险。这是因为这些部门的更多美国工作比其他国家的相同工作更脆弱。人们认为机器人将接管工作，因为它们比人类员工需要的管理更少。然而，另一方面，虽然机器人不领工资或时薪，但每当有新程序发布时，仍然必须对其维护和升级。因此，这真的值得吗？即使事实如此，由于机器人的成本，这还有很长的路要走，更不用说将机器人移动到控制环境之外的大步骤。一旦发生机器人接管，某些工作将是安全的。这并不意味着机器人不会被用于或帮助这些工作，只是意味着这些工作不会被完全接管：\n\
  \n1. 运动员、体育教练、体育官员\n2. 消防员、防火和火灾检查工作\n3. 场务主管和铁路列车员\n4. 健身和休闲工作人员\n5. 森林和保护科学家\n\
  6. 公共交通务员和检查员（书中之前提到过自动公交。然而，这些公交极有可能在发生意外情况时车内配备务员。）\n7. 机车操作员、工程师\n8. 幼教教师、小学教师\n\
  9. 策展人和档案管理员\n10. 公职人员、侦探、警察\n11. 航空飞行员和导航员\n12. 测量员、制图师、地图科学家和技术人员\n13. 演员、制片人、导演\n\
  14. 校车司机\n\n## 机器人手术\n机器人手术也被称为机器人辅助手术，它允许外科医生以比使用传统方法更高的精确度、控制力和灵活性来执行复杂的程序。机器人手术将主要用于通过微小切口进行的微创手术。它有时也用于传统的开放式手术。2000\
  \ 年，机器人手术首次从 FDA 批准的`da Vinci Surgery System`开始。这项技术很快被美国和欧洲各地的医疗中心采用，用于治疗各种疾病。这种临床机器人手术系统配备有一个摄像头手臂和一个连接有手术器器的机械臂。外科医生将坐在手术台附近的电脑控制台上控制机械臂。控制台将为外科医生提供手术部位情况的高清、放大的\
  \ 3D 视图。\n\n### 优势\n1. 术后并发症较少\n2. 较小且不明显的疤痕\n3. 手术期间疼痛减少且失血减少\n4. 恢复时间更快\n\n###\
  \ 风险\n1. 感染\n2. 术后并发症\n\n### 机器人会接管医疗领域吗？\n医疗领域的机器人旨在增强医生的技能，并在手术时确保患者的安全。然而，`da\
  \ Vinci`这样的系统极不可能取代人类医生。人类医生可以提供温暖关怀的性质，让患者放心，而机器人不能。更不用说，如果在手术期间出现并发症，机器人并不一定接受过处理此类问题的训练，这时外科医生将介入处理发生的情况，而不会为了使用先进技术而将患者置于危险之中。如果说有什么的话，机器人技术通过减少患者手术后经历的风险来帮助医疗技术进步。此外，人类喜欢与人类交谈，如果周围没有可以交谈的人类是不可能的。机器人没有人类那样的医术，这使得它们无法提供患者对外科医生所期望的护理水平。这就是为什么机器人不会接管手术，但它们将增强外科医生的技能，使他们不必担心因为没有切开患者并导致患者流失比不必要的血液而失去病人。\n\
  \n第 12 章：机器人技术常见问题\n\n\n\n\n\n人们对机器人技术有很多疑问，在本章中，我们将回答一些初学者经常关于机器人技术的常见问题，而这些问题在书之前的章节尚未被解答。\n\
  \n### 1. 在机器人多模型感知中，常用的传感器融合算法有哪些？它们如何通过使用传感器融合来改进机器人的位置估计？\n\n目前，最佳选择之一是`卡尔曼滤波器`（`Kalman\
  \ filters`）以及`粒子滤波器``particle filter`）。当你处理初始位置或线性测量值时，`卡尔曼滤波器`将非常有用。即使在初始位置未知且没有非线性测量值的情况下，`粒子滤波器`也会被使用。然而，它需要大量的计算量，而这是`卡尔曼滤波器`是不需要完成的。无论你使用哪种传感器，你都必须对机器人的状态进行建模，以估计它们的传播，并根据你获得的任何测量值来更新估计结果。\n\
  \n### 2. 机器人能够取代老师吗？\n\n不能！机器人可以从事体力工作，并协助老师进行课程安排和管理，这就是为什么老师会使用音视频录制工具。任何东西都无法取代老师与学生及家长建立的关系。当学生度过艰难时期时，老师所表现出的那种共情能力是无法替代的。归结底，机器人只不过是一个会说话的教科书。\n\
  \n### 3. 人工智能在未来有哪些潜在的用途？\n\n在科学领域，将会有更强大的计算机，由于处理能力的提升，它们将完成现在正在做的事情，只是速度更快。这些计算机将帮助科学家发现大型数据集中的重要模式。计算机不仅对科学家非常有用，对世界上几乎每个人都是极其有用的工具，因为它们可以获取我们其他方式无法获得的信息。当你看到`人工智能`这个词时，计算机的使用是为了更深入地理解人类大脑将如何经历决策过程的。了解人类大脑如何做决策有助于研究人员和创造者制造出可以遵循相同过程的机器人。看看`AI`已经取得的进展，`AI`在未来拥有无限可能，这似乎是非常可信的。\n\
  \n### 4. 我们是否可能看到机器人科学在教学中发挥主要作用？\n\n是的。我们已经看到技术如何帮助老师更好地教导学生，而机器人可以介入并帮助制定教学计划，针对那些无法按照老师目前教学方式进行学习的学生。机器人可以帮助老师实现课堂个性化，甚至更好地管理时间，以便在进行一年的教学时能完成他们想要的所有事情。就像医学领域一样，机器人帮助老师的可能性是无限的。\n\
  \n### 5. 人工智能和机器学习是如何定义的？\n\n`人工智能`（`Artificial intelligence`）是指机器模仿人类行为中所体现的智能的能力。`AI`技术无非是试图模仿人类行为的算法。然而，`机器学习`（`Machine\
  \ learning`）是为计算机提供无需显式编程即可学习能力的科学与工程。\n\n### 6. 智能辅助是人工智能在客户服务中唯一的应用之一，还是有其他人工智能影响客户服务的方式？\n\
  \n`AI`技术的前端应用将使客户服务的智能助手成为关键，但还有许多其他应用在使用。其中之一是应用`AI`直接支持呼叫中心代理而不是取代他们。在与人工代理的实时客户服务互动期间，将使用自然语言和语音识别来寻找相关信息，并为代理应该如何做出提供建议。\n\
  \n### 7. 未来会出现一个呼叫中心不再需要的时候吗？\n\n就目前而言？不会。然而，以后取决于机器人技术如何改变，这可能会发生变化。得益于各种程度的自动化，数字渠道处理的简单任务将人类释放出来处理更复杂的问题。因此，机器人和人类可能会在呼叫中心协同工作。\n\
  \n### 8. 机器人流程自动化（RPA）和人工智能之间有什么区别？\n\n在回答这个问题之前，你必须了解背景。如果一家公司说：“我们正计划将人工智能程序整合到我们的业务流程中”，那么意味着他们想要用程序机器人实现流程自动化。在这种情况下，`RPA`和`AI`是同一概念。在其他情况下，`RPA`解决方案将用程序机器人自动化流程。这些机器人是执行简单任务的简单机器人，例如将信息复制并粘贴到`Excel`表格中。然后，更高级的`RPA`解决方案将使用机器学习来观察并学习人类如何执行任务，以实现自动化。`人工智能`描述了一个试图将决策等人类任务自动化的研究领域。因此，`RPA`将使用`AI`算法来执行具有某种程度复杂性的任务。\n\
  \n### 9. 机器人流程自动化和人工智能之间有什么区别？\n\n在回答这个问题之前，你必须了解背景。如果一家公司说：“我们正计划将人工智能程序整合到我们的业务流程中”，那么意味着他们想要用程序机器人实现流程自动化。在这种情况下，`RPA`和`AI`是同一概念。在其他情况下，`RPA`解决方案将用程序机器人自动化流程。这些机器人是执行简单任务的简单机器人，例如将信息复制并粘贴到`Excel`表格中。然后，更高级的`RPA`解决方案将使用机器学习来观察并学习人类如何执行任务，以实现自动化。`人工智能`描述了一个试图将决策等人类任务自动化的研究领域。因此，`RPA`将使用`AI`算法来执行具有某种程度复杂性的任务。\n\
  \n### 10. 机器人流程自动化和人工智能之间有什么区别？\n\n在回答这个问题之前，你必须了解背景。如果一家公司说：“我们正计划将人工智能程序整合到我们的业务流程中”，那么意味着他们想要用程序机器人实现流程自动化。在这种情况下，`RPA`和`AI`是同一概念。在其他情况下，`RPA`解决方案将用程序机器人自动化流程。这些机器人是执行简单任务的简单机器人，例如将信息复制并粘贴到`Excel`表格中。然后，更高级的`RPA`解决方案将使用机器学习来观察并学习人类如何执行任务，以实现自动化。`人工智能`描述了一个试图将决策等人类任务自动化的研究领域。因此，`RPA`将使用`AI`算法来执行具有某种程度复杂性的任务。\n\
  \n\n\n\n\n# 第 13 章：机器学习与人工智能\n\n人工智能是一个新兴领域，随着时间的推移变得越来越流行。人工智能帮助我们为许多问题寻找解决方案，例如我们想在哪里吃饭、如何解决全球食品短缺，以及明天的天气如何。起初，人工智能只是科幻小说，一些人仍然认为它只不过是科幻小说。然而，人工智能将每天出现在我们身边，包括你正在使用的那部手机！\n\
  \n比例如，你正在使用 iPhone，并点击中间按钮询问 Siri 问题。猜猜怎么着——Siri 就是人工智能。你收到的关于可能的欺诈收费的银行通知也是如此。`Intel`\
  \ 机器学习总监 Nidhi Chappell 曾报道说：“人工智能基本上是指机器在不需要人类进行特定编程的情况下，对世界产生理解、学习并与外部世界进行交互。”\n\
  \n人工智能不仅让我们的生活变得便利，还提升了我们的生活质量。生物识别可以衡量运动员的表现、伤病的严重程度，以及伤病最终将如何影响他们的上场时间。另一方面，农民们利用它来了解需要给作物浇灌多少水，以获得最高的产量。医生甚至在使用它来检测疾病并追踪患者的治疗过程。\n\
  \n## 机器学习与深度学习\n\n你应该将人工智能这一术语视为一个伞术语，机器学习将属于其中，因为将使用各种技术和工具，允许计算机通过基于你获得的数据的数学算法进行思考。然而，在这个伞术之下，你还会发现机器学习的子集，它使用被称为深度学习的神经网络模型，这些模型将使用图像以便正在使用的程序对其进行处理和识别。\n\
  \n“想象一个孩子成长的过程。那个孩子观察世界，留意人们如何相互互动，学习社会规范——而不需要被明确地告知规则，”Chappell 说。“这与人工智能是一样的。它是机器在没有显式编程的情况下自主学习。”\n\
  \n人们还认为人工智能至少能够做到三件事：\n1. 根据在程序中发现的识别结果采取行动。\n2. 通过任何可以检测到的数据模式观察世界。\n3. 识别我们周围世界的模式。\n\
  \n可以这样想：你准备在 Facebook 上发布一张照片。因为人脸识别算法，Facebook 将建议你在照片中标记朋友，这样他们也能看到这张照片。不仅如此，它还会根据你发布的照片建议页面和活动。所以，如果你发布了一张你和好朋友在湖边游泳的照片，你将开始看到与游泳有关的内容，因为\
  \ Facebook 的算法会根据照片假设你喜欢游泳。机器将一直尝试变得更聪明，这将使人们更快得做出决定并更快地完成研究。\n\n## 安抚怀疑者\n\n人们对他们不理解的事情总是充满怀疑。这主要是因为他们担心机器会像电影《终结者》描述的那样接管一切。然而，报道报道\
  \ Chappell 表示计算机及其学习的方式最终将以人们无法意识到的更多方式来帮助人类。\n\n“人工智能实际上增强了人类的行为。我们并不是试图取代人类。我们实际上是试图通过更多的智能来增强他们。这让我们的生活变得更轻松。”\n\
  \n人工智能让你不再需要翻出地图来确定你所在哪里以及要去哪里。你只需要输入地址，语音就会告诉你需要去哪里。不仅如此，每当道路变化时你的手机都会更新，这样你就不会去不存在的地方，也不会在有更快捷路线时选择更耗时的道路。\n\
  \n机器学习和人工智能将用于医学、金融和教育领域。它将继续推动社会发展，且减少网上常见的骚扰。人工智能将帮助解决的另一件事是像寨卡病毒病毒，通过观察蚊子的数量并确定哪些蚊子最可能携带病毒。\n\
  \n## 数据管理\n\n一些最复杂的学习将产生需要机器学习的数据。这意味着计算机的性能越高，计算机学习得越快。“事实证明，你提供给机器学习的数据越多，机器预测事物就越准确，”Chappell\
  \ 在谈论机器学习的复杂性时这样说。学习越复杂，对数据的要求就越高。因此，计算机学习得越多，实施的数据要求就越多。\n\n归根结底，“人工智能无处不在，”`Intel`\
  \ 数据中心集团总经理兼执行副总裁 Diane Bryant 女士说。“它正在改变人们与世界互动的方式。”\n\n## 结论\n\n感谢你读到机器人学的最后。它应该是很有启发性的，并为你提供了实现目标所需的所有工具，无论你的目标是什么。下一步是利用你在这里学到的知识，要么继续学习更多关于机器人的知识，要么决定你是否想在生活中使用机器人。并不是所有的机器人都是邪恶的，但取决于你如何研究并确定这是否是你愿意承担风险的事情。机器人存在于我们生活的各个角落，随着技术的不断发展，你可能会在生活中看到更多机器人。然而，同时随着我们所看到的科技进步，我们可能会看到书中列出的风险并未发生。\n\
