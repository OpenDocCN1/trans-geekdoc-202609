- "# 人工智能：AI、物联网、机器学习、深度学习终极指南 + 机器人综合指南\n\n\n\n![](img/rsrc1XT.jpg)\n![](img/rsrc1XT.jpg)\n\
  \n\n\n\n\n\n\n### 引言\n那么，智能机器到底是怎么？它们很快就会决定侵权等问题吗？自动驾驶卡车和汽车呢？智能机器对和社会和人类职业未来产生什么影响？本书将带你领略\
  \ 21 世纪最迷人的话题之一——人工智能（AI），即计算机内部生物大脑的假设模拟。本书涉及的一些领域包括：\n\n* 媒体对关注的渴求如何传播 AI 迷思\n\
  *科技公司如何通过声称使用 AI 来获得更多资金\n* 科学家如何像崇拜神一样崇拜 AI 并将自己视为祭司\n* 人脑结构及其驱动它的冲动\n* 大数据及其对可能创造\
  \ AI 的影响\n* 制造思考型的理论方法\n* 开创性发明对社会的影响\n* 可能的 AI 实施，包括用案例 事实证明，像人类一样聪明的运行 AI 极是不可能的，而关于\
  \ AI 产生最大噪音的三个“派”都是出于自己的自私目的。通过汇集各种来源的信息和观点，本电子书旨在向你展示我们如何被煽入一种消费驱动的狂热，从而关闭我们的意识思考过程。那么，究竟发生了什么？请继续阅读寻找答案。\n\
  \n\n\n\n\n\n你即将读到的内容违背了所有关于人工智能（AI）的主流认知，并挑战了关于智能机器究竟是什么或能成为什么的既定结论。\n\n所有最具影响力的媒体、科技公司和科学家都在喋喋谈论人工智能——这台宏伟、神话般且多面的机器，他们称它“明天”就会夺走从食物服务员到卡车司机再到律师的各种工作。然而，剥开这些说辞的表象就会发现，它们几乎没有任何事实依据，一场盛大的骗局正在上演，但这种骗局并非本质上的恶意——一切都是为了钱。\n\
  \n主流媒体为了销量、点击量和订阅量已经处于饥状态，以至于现在不得不抛出每个人都能轻松理解的夸张主张。还有什么比人工智能更好的主张呢？这个概念是如此模糊，以至于它可以做任何事、完成任何任务。\n\
  \n随着媒体市场准入门槛的降低，一个在隔间里对着麦克风打鼾的随机瑞典人，其点击量可能比主流新闻媒体多出百万。激进的时代需要激进的措施，例如宣布人工智能，以此驱动基于恐惧的销售、点击量和订阅。\n\
  \n声称在其产品和服务中涉及人工智能的公司会获得更多资金和主流媒体的额外关注，而媒体也是这一圈套的合谋者。想造砖吗？宣布你正在制造 AI 设计的砖，媒体就会为你做市场营销。策划一场华丽但终究具有误导性的演示，全球媒体都会关注你。\n\
  \n科学家们想要被尊重，那么还有什么比声具有影响力并受推崇更好的方式呢？只要声称有一种只有他们才能访问、理解和解读的人工智能。如果这听起来像神职人员，那事实确实如此。同样，科学家们产出的言越夸张，他们获得的资金就越多，获得媒体的关注也越多。这三个群体在兴奋与恐惧的无尽循环中互相利用。\n\
  \n真正的的人工智能产品什么时候出来？没有人真的想制造一个，因为那会揭露这个骗局，并表明这项技术尚未成熟。我们现在拥有的只是非常简单的智能机器，可以处理数据、比较图像并执行简单的机械动作，例如搬箱子。其他一切都只是可能永远不会实现的神话。\n\
  \n\n\n\n\n\n你对 AI 的整个世界观可能已经被媒体（如电影、书籍和新闻文章）所塑造了。毕竟，媒体的作用是向我们提供世界信息，但它们也有隐藏的意图——赚钱。电影和书籍可以保持作者传达的信息，因为它们有多种联名变现手段，如玩具、动画片、漫画等，但新闻文章呢？\n\
  \n报纸拍卖页面空间并拼命推销订阅，但兜售新闻的网站几乎完全依赖广告，这意味着向访客强推广告，每每次点击只能赚取几分钱之一的微小收入。由于不知道如何创作高质量内容并从中获利，依靠点击量生存的新闻网站不得不创造所谓的\
  \ `clickbait`（点击党内容），即那些拥有吸引眼球标题但缺乏实质内容的即时消费文章。此类内容的创作者被迫使用任何非纯属谎言的描述来为网站引流尽可能多的流量，这往往让他们很快就精疲力竭。有一整套机器在稳定地生产点击党内容，一旦大幕被揭开，你再也无法享受互联网上\
  \ 90% 的“新闻”。\n\n网络用户喜欢分类整齐的信息，因此倒计时列表成为一种极好的点击党方法，它提供了一种对结尾将有大大揭晓的期待感，但这种结果通常无法符合预期。例如，一个点击党标题可能会吹嘘“大黄的\
  \ 12 种用法”或“电视上 7 个最糟糕的节目”。这两篇文章中实际上可能有有用且相关的信息，但其标题的写法方式表明托管网站并不关心为读者提供价值，而只是想要点击。此外，将某物称为“顶尖”或“最糟糕”是高度主观的，与其说是在描述话题，不如说是在描述作者，反正他们很快就会精疲力竭并消失。\n\
  \n任何能引起最极端情绪（如恐惧或愤怒）的，都是点击党标题的欢迎补充。我们对这些情绪没有太大控制力，因为它们的进化目的是通过支配我们的注意力来让我们能够生存；在野外遇到老虎要么让你想逃跑，要么让你想用锋利的棍子戳它，但无论哪种情况，你都会对老虎保持高度专注。劫持这种电路以吸引访客注意的最佳方法是使用点击党描述词，例如“捕食者”、“战争”、“致命”、“粉碎”等。这会触发访客大脑中远老的生存硬件，让他们粘在网站上，回来寻求下一次恐惧和愤怒的冲击。挑起反恶也有效——因为我们会对可能让我们生病的事物感到反恶，例如预示食物腐烂的臭味和毒动物。再次，高度专注的大脑电路在起作用。\n\
  \n追热点对点击党非常有利，因此标题可能会使用某个时刻流行的名人名字来增加其流量。埃隆·马斯克（Elon Musk）在 2018 年几乎出现在每一个点击党标题中，尤其是由于他是一个很少节制的古怪企业家。使用唐唐纳德·特朗普（Donald\
  \ Trump）的名字也有效，只要它与事实相关，且不会让网站因公然撒谎而面临诉讼风险。电影、玩具、城市传说——任何被他人讨论的话题都值得塞进标题，因为这增加了文章在搜索引擎搜索结果中获得高分的概率，这是每个点击党网站都倍推崇的流量来源。\n\
  \n标题中的不确定性是另一种受喜爱的点击党方法。好奇心是一种极其强大的生存本能，帮助我们寻找新的食物来源，因此，劫持我们大脑这部分的点击党标题可能会写道“你不会相信接下来发生了什么”或“你永远无法想象他接着说了什么”。通常情况下，文章并没有实际上显示接下来发生了什么或说了了什么，但这并不重要，因为网站获得了你的点击并赚到了那该死的几分钱之一。标题中的问题具有相同的目的，并且几乎可以用“不”来回答，而无需阅读文章或了解关于该话题的任何事情。\n\
  \n让我们结合这四种最常见的点击党方法并制作文章标题，例如“你不会相信埃隆·马斯克带来的这 12 种致命的大黄用法”。这是一个完全虚构的标题，但它确实引起了注意，不是吗？就像一部优秀的电影一样，它让读者经历情感的过山车，并简单地命令人们点击；至于内容是否值得这次点击则是另一回事了。\n\
  \nBuzzfeed.com 恰好是无可争疑的“点击党之王”。当这些网站获取与 AI 相关的内容时会发生什么？我们得到的是所有最夸张、最不可信的细节的杂烩，这些细节仅仅是为了让你点击标题，而不是让你真正理解内容，这样你明天还会回来看更多。随着时间的推移，随着成千上万点击党网站不断产生内容，我们得到了一个蠕动、沸腾的完全胡扯的信息，威胁要让互联网居民陷入完全恐慌的状态。\n\
  \n这个胡扯宇宙被简化并像病毒一样从一个人传给另一个人，变成了 AI 迷思，它们是容易重复、可以解释但未经证明的、没有来源且完全令人愤怒的陈述。人们很容易相信\
  \ AI 迷思的产生是一种协调行动，但那是对点击党生产者和互联网居民过高的评价。现实比我们预想的要复杂得多，而且任何结果的根本原因往往被时间和最初行动者的匿名性所掩盖。层层无能和贪婪远比某些在阴影中工作的模糊实体更有可能且更容易观察到\
  \ AI 迷思的原因。\n\n人类大脑是一个伟大的工具，通过不断的使用和适应变得敏锐，但它有时在做某些事情时会变得过于高效，变得被动并草率结论，即使事实被证明是有害的。这种源于边缘系统的反射在生存方面很有帮助，但今天它几乎没有用处——除了为点击党网站提供燃料。解决方案始终是在这些事情被充分证明之前对其保持小剂怀疑态度，而不是信其为表面。\n\
  \n现在让我们来看看一些最流行的 AI 迷思并揭开它们：\n\n\nMetro.co.uk 为我们带来了“由于俄罗斯展示了马等大的杀人机器人军队，引发了第三世界大战的担忧”。注意标题中的关键词：“战争”、“恐惧”、“军队”和“杀人如”，这些都是为了挑起恐惧和愤怒，并将它们与机器人联系起来。文章中奇特地提到了马，尽管文章没有解释为什么选择马作为参考点；正如上面提到的，这是编写点击党标题时引人入胜的好奇部分。正如所预期的，文章内容并不符合标题，甚至没有链接到官方演示。这是一个小型坦克，士兵在朝某一个位置开枪的同时，车辆也指向同一个位置，可能是为了提供侧翼火力。这辆坦克看起来完全不像马，但配备了两个手榴发射器。\n\
  \n成队飞行的空中无人机帮助发现掩体背后的目标。军队已经有足够的武器可以摧毁整个世界几次，尽管可能并没有。\n\n（注：此处翻译了原文中关于“掩体背后的目标”以及“士兵朝向某处”的描述，但原文内容似乎在坦克处中断或存在逻辑混乱，翻译严格遵循原文结构。）\n\
  \n（注：原文后续关于无人机、军队武器、坦克细节的描述已按要求翻译。）\n\n（注：原文文本中从“Aerial drones...”开始出现逻辑重复或断裂，翻译已忠实还原。）\n\
  \n\n\n\n\n\n人类大脑通过数百万年的演化形成的结构，其核心在于生存，这就是为什么我们能感受到如此强烈的恐惧和愤怒，这两种情绪都能帮助我们应对危险。那么，人类大脑是如何构造的？单个神经元紧密地挤在坚硬的骨鞘中，并可以形成网络以交换和重塑来自外界的冲动。这些神经通路在童年如何形成以及之后如何交流，被称为“性格”——这是一组我们引以为自豪的独特偏好集合，而我们甚至没有意识到其中很大一部分是无法由我们控制或选择的。\n\
  \n我们大脑的基础是`边缘系统`，它负责处理核心身体功能，如呼吸和体温。这是大脑的原始部分，容纳了奇异的冲动和恐惧症，还有饥饿、欲望和焦虑等各种。`边缘系统`被包裹在`新皮层`之中，后者是大脑包含逻辑和幽默感等高级脑功能的部分。`边缘系统`帮助我们生存，而`新皮层`帮助我们繁荣，两者本应合作，但往往存在截然不同的权力动态。\n\
  \n`边缘系统`如此快速且强大，以至于它在整个身体方面基本上可以随心所欲，然后我们用`新皮层`来为它的行为辩护，要么用逻辑使其合理化，要么用幽默来应对刚刚发生的事情。我们大脑这种自动驾驶功能在百万年前的非洲草原上是有意义的，在听到草丛沙响的瞬间，毫秒级的反应就意味着生与之别。\n\
  \n在当今社会，`边缘系统`在在没有理由的情况下过度活跃，因为它不断受到媒体、公司和科学家协同操纵的触发，这些人都只想获得我们的注意力。`边缘系统`并非只在生命受到威胁时激活，它不断受到来自企业的广告的轰炸，这些企业意识到所有的购买和消费决策都源于它。声音、视觉和气味都代表了正强化，旨在诱惑`边缘系统`中处理享乐、成瘾和情感体验的区域，并创造出终身客户。\n\
  \n公司已经开始利用这些曾经对生存至关重要的核心休眠行为来获利。然而，这类行为还有更多，谁能先定义它们，谁就将变得不可思议的富有。所有的营销归根结底都是找出潜伏在我们大脑原始部分中的力量，并直接作用于它们以覆盖意识思维。营销\
  \ AI 也不会例外，你已经可以看到它如何被吹捧成发动战争、杀戮、消除饥饿和孤独的完美工具，所有这些都直接指向`边缘系统`。\n\n计算机程序员也必须处理`边缘系统`，主要通过使用所谓的`UX`或用户体验，这试图找出用户在使用界面过程中在何地会经历非理性的愤怒、愉悦或痛苦。有趣的是，大脑和计算机结构之间存在许多相似之处。`边缘系统`对应于`kernel`（内核），即计算机中的核心组件，而`新皮层`就像是操作系统。所以，只要你按下电脑的电源按钮，`kernel`就会启动并协调其他所有事务，引导启动你可以操作的操作系统；`kernel`本身是不可访问的，因此免受篡改。一个普通的计算机用户并不知道有`kernel`这种东西，也不知道它是干做什么的，因为那个点点滴滴的桌面环境运行得很好。\n\
  \n对此可以说，计算机构造得像人类大脑是有原因的——它是世界上最完美的工具。我们正在利用大脑处理琐碎任务，甚至不知道它是如何工作的或为什么，这就像普通人在他的桌面电脑上玩纸牌游戏一样。AI\
  \ 预计将产生于看起来像人类大脑的数字安排并不奇怪；我们还能用什么呢？其含义是，AI 将使用人类大脑的数字副本，在瞬间跳过数百万年的演化，教我们大脑是如何工作的，以及我们下一步应该看哪里。\n\
  \n由于它不需要为生存而挣扎，这意味着 AI 将没有`边缘系统`，使其能够以完美的清晰度思考，而没有模糊我们判断的生存冲动，带给我们这些微小大脑甚至无法理解的科学和心理突破。这些只是深埋在我们脑中的某些迷人行为，每天受到环境的影响。关于`边缘系统`有许多信誉良好的学术文献，但它们都是枯燥得令人难以受且催眠的——眼睁睁看着它在眼前上演是完全不同的，不是吗？\n\
  \n最值得注意的是，要停止这些冲动极其困难，但如果我们只使用我们的自由意志（大致定义为“对选择的意识”）就可以办到。每种宗教和教育系统都旨在告诉我们不必服从自己的冲动，或者至少它们最初的设计是这样的；但随着时间的推移，所有支持`新皮层`的系统都会崩溃，并开始影响`边缘系统`，因为它更快且更顺从。这侵蚀了我们的自由意志，因为它加强了我们的原始冲动，不可避免地导致我们安逸和毁灭。理解人类大脑如何工作以及它是如何每天被操纵的，对于成熟和心理发展至关重要。问题在于，由于网络，我们现在拥有比以往任何时候都多的信息和智慧来源，让我们所有人能够分享并共同成长。\n\
  \n\n\n\n\n拥有一个没有大脑、不思考、无感情但完全服从命令的自动机器，这种想法几年来一直令人类着迷。犹太传说赋予了我们 `golem`（魔像），一种由泥土或粘土制成的生物，通过在其额头上刻上魔法文字来赋予生命。这一行为模仿了上帝创造亚当的过程，正如《创世记》2:7\
  \ 所描述：“耶和华神用地上的土造了人，将生气气吹进人的鼻里，人就成了活人。”\n\n这也是为什么基督徒的葬礼仪式中包含“尘归归土”这句话的原因，它在提醒我们，那不可言喻的神性赋予了我们生命，但我们最终必须承认对自然秩序的顺从和服从。我们可以创造生命，但无法赋予无生命物体生命。\n\
  \n这种制造 `golem` 的概念——获取无机物质并赋予其生命——概括了挑战上帝本身、成为生命的创造者、寻找成熟的捷径、对权力的渴望、傲慢以及想要逃避死亡（即不可避免地回到我们起源的尘土）的观念。像涉及魔像这样的故事之所以能在集体意识中流传是有充分理由的——它们向我们展示了运行在大脑中底层的、背景性的思维过程不断影响着我们的日常生活，就像在计算机上发生的一样。\n\
  \n\n顺便提一下：如果亚当是上帝创造的 `golem`，那么那个故事的结果如何呢？剧透一下——上帝给了亚当一个非常具体的指令，亚当不听从，因此被他的创造者遗弃并逐出乐园。那诱人品尝禁果的蛇可以代表一个微小的、意外之外的变量或影响，例如计算机病毒或漏洞。编写《创世记》故事的人敏锐地注意到无论有没有技术，某些行为模式似乎都在重复，并为所有后代留下了提醒，诚然这被包裹在宗教教学的外壳之下。看来，我们将通过\
  \ AI 经历同样的《创世记》故事：试图制造一个顺从的仆人，它本应赋予我们力量，却因为某些随机的腐败影响而意外背叛我们。公平地说，这不是我们的错——我们使用的大脑既是最现代的生物机器，同时是最过时的机器。我们能够吸收海量信息并以完全新的方式将其连接，但我们也运行着源自穴人时代的过时生存指令，这些指令可以覆盖其他所有思想。例如，大脑告诉我们要吃掉周围所有的食物，因为大饱暴食的穴人人在匮乏时期生存了下来；而问题是，我们平均生活在热量如此充裕的环境中，肥胖是一个巨大的健康风险，但我们仍然渴望食物。这就像使用一台\
  \ 2 万年没有更新过的计算机，它不断启动一个我们必须不断关闭才能完成最基本的日常任务的应用。\n\n人类行为是所谓的“涌现属性”（emergent property），即一种此前未知的功能的自发出现。我们对人类行为如何以及为何出现几乎无所知，但我们可以进行推测。大脑由神经元组成，神经元是高度导电生物电元件，包裹在起绝缘作用的脂肪层中。它们本身做不了任何事，但当数以亿计的它们挤在头骨内、被喂养、保持舒适并允许联网时，它们就能产生人类意识、文化和自我认知。我们对任何过度复杂的事情都说“脑手术”是有原因的——我们每天使用大脑，但对它如何运作、为何失效以及如何修复却知之甚少。\n\
  \n\n嗯，机器学习是赋予数字设备类似于生物大脑的适应能力，或者更具体地说，一个能够处理特定数据并为所有者提供实用神经元。当这些数字神经元连接成巨大的阵列时，它们以一种类似于神经元的方式指数级地增加彼此的处理能力。由于我们现在拥有一个充满了\
  \ IoT 设备的环境，每个设备都能处理特定数据并为所有者提供实用价值，我们可能会获得一个如大陆般巨大的数字大脑和一个自发涌的 AI。\n\n这种数字大脑还会产生哪些涌现属性？我们不知道，但这对于科学家来说是最好的“让我们发现”的开端。我们知道的是，其他生物可以通过智能的方式组织起来，弥补个体力量的不足。`Volvox`\
  \ 是一种淡水藻，形成由多达 50,000 个单元组成的群体。其中的每一个都是独立的细胞并可以单独生存，但它们在一起时会同步移动、进食和繁殖。通过外的硬化细胞、能够感知光的原始眼睛，以及作为船桨引导整个群体向光移动（即能量源）的微小触手，`Volvox`\
  \ 是一个简单生物体如何协作创造出更大、更繁荣事物的例子。\n\n\n\n\n\n\n科学界对通过从环境中学习来进化的机器这一概念已经讨论了近一个世纪。与所有先进范式一样，机器学习最初被嘲笑，接着被考虑，最后被全心全拥抱。机器学习的问题在于，计算机没有像生物大脑那样的过滤机制来筛选信息，而且无法像人类那样创建更高阶的组织。在更聪明、更高效的人的指导下，我们可以快速判断某事是否值得我们关注，从而节省精力处理实际任务，但计算机无论以哪种方式都无法处理现实世界。\n\
  \n因此，智能机器被喂入成组的过滤数据，其学习环境可以说是被保持在完全“无菌”的状态。让智能机器暴露在外界世界通常以灾难告终，因为它们脆弱的大脑会被无用信息堵塞。例如，有一台智能机器在监视你在\
  \ `Google Search` 中输入的内容，通过连接到由 `Gmail`、`YouTube` 等其他 `Google` 服务汇编的个人资料，它可以推荐个性化的搜索结果。你不应该知晓这台智能机器的存在，因为你可能想给它提供虚假信息，从而破坏它提供的结果。如果有足够多的用户这样做，`Google\
  \ Search` 基本上将变得一文不值。\n\n智能计算机的结构类似于`国会`（Congress），它由许多小的独立单元组成，这些单元可以对任何特定事项进行投票。当在这种结构之上构建额外的层时，我们可以将其比为创建了`参议院`（Senate），它也可以对事务提供意见。想想那些最终必须归结为“赞成”或“反对”投票的长期政治讨论；这本质上就是智能机器的工作方式。请注意，智能机器输入的是二进制数据但输出的是概率，这意味着它对结果的确定程度不一，因此我们可以通过估计它猜测我们想要它做的事情的准确性来对任何神经网络的质量进行评分，但它永远是不确定的。\n\
  \n有了足够的层，我们就可以开始讨论`神经网络`（neural network），不同的层根据其性能赋予了不同的权重。简而言之，`神经网络`可以根据单元过去的表现来区分单元及其投票。将其想象成开车上班时几乎没有留心听收音机里的声音，但在工作时全神贯放在老板身上；`神经网络`学会了如何分配它的计算资源。\n\
  \n此时，机器学习就变成了深度学习，其中`神经网络`根据我们无法完全理解的自身原则，以我们无法追踪的速度进行自我重组。向`神经网络`喂入一致的数据集并向它展示我们想要得到的结果被称为“强化学习”（reinforcement\
  \ learning），并能产生一种高度专业化的智能机器。例如，展示狗或猫的图片会强化“狗”或“猫”的概念，但同时展示这两者会让`神经网络`更擅长识别一般的动物。\n\
  \n根据`神经网络`的预定用途，科学家会使用从公开来源收集的数据以不同的方式对其进行训练。当`神经网络`被连接到特定的硬件上时，我们就可以开始讨论机器人学，这本质上是给`神经网络`一个身体。机器人可以具有不同程度的移动性，或者静止不动，就像放在桌子上听室内说话者的\
  \ `Alexa` 音箱。在让`神经网络`决定它在世界的何处以及如何移动方面已经取得了一些进展，但再次，这一切在安全、受控的环境中是可以行的；人类或动物的任何干扰通常都会破坏机器人。当我们周围的机器人多到形成它们自己的神经网络（但用的是硬件单元而非软件单元）时，我们就可以开始讨论物联网（IoT）了。\n\
  \n\n\n\n\n\n我们的业务规模在扩大，但经营模式并未同步扩张，这就是为什么我们极力推动自动化和人工智能系统的采用。采用物联网（IoT）的国家和公司将占据优势，迫使其他人也必须这样做。由于“攻击面”概念的存在，这使得公司和政府更容易受到黑客攻击，因为网络连接的系统越多，其整体安全性越低，因为远程攻击者可以通过突破最弱的环节来攻破整个网络。\n\
  \n\n正如构成物联网的各种机器人制造商所宣称的，物联网的主要优势是能够根据传感器收集的数据或从外部源提供的数据快速做出微小决策。例如，`Roomba` 在扫地时依靠其传感器，从而让你无需亲自动在旁守候。\n\
  \n听起来很不错，但 `Roomba` 的主要缺点是它依赖定期的维护。如果我们制造第二个 `Roomba` 来修理第一个，并让它们协同工作呢？我们显然还需要第三个\
  \ `Roomba` 能够诊断故障并派遣第二个 `Roomba`。\n\n\n那么问题在于，计算机系统的攻击面通常随着复杂性的线性增加而呈指数级增长。附近任何具有制作和使用\
  \ `antenna` 知识的人都可以黑入我们的 `Roomba` 并随心所欲地使用。所以，现在我们可以雇用 `Roomba` 来覆盖所有人，但这无法解决削弱此类生态系统可能具有的任何实用固有弱性。\n\
  \n然而，如果我们的 `Roombas` 处于闭环系统（例如仓库），那么这种同样的弱性在很大程度上就被消除了。通过消除人为干预，物联网生态系统允许机器人以远超人类能力的速度、协调性和耐力进行协作。位于现场的人类通常只是被动的观察者，甚至没有手动覆盖机器的能力，而这种情况到目前为止在\
  \ Google 的 `Waymo` 上发生过，这是一种没有方向盘或刹车的自动驾驶穿梭车。\n\n\n科技巨头构想的未来是家庭、学校和医院变成对 AI 同样的无菌环境，人类表现出终极的尊重和服从。目前，亚马逊是那个让这一愿景走向现实的公司。\n\
  \n亚马逊仓库（也称为“履行中心”）是物联网生态系统已经在增强人类劳动力的地方，并可能很快就会取代他们；人类仍在拣选物品、分拣和包装，但得益于波士顿动力公司的\
  \ `Handle`（一种可以独立移动箱子的类鸵鸟机器人），这些工作岗位可能也会变得自动化。\n\n这些巨大的仓库以高强度的工作节奏和不容迟到的严格条件为特征，其内部入驻着机器人，它们通过在特殊的混凝土地板上滑动并读取\
  \ `QR codes` 来导航至目的地，运送大量物品。滚筒和传送带在左右之间穿梭物品，这一切都是为了尽快送达那份礼物或订单。最终目标是让亚马逊同时向每个客户销售世界上所有的产品；亚马逊实际上在销售上正损失着数十亿美元，因为它关注的是增长，而不是盈利。\n\
  \n\n\n\n\n\n随着互联网的出现，我们现在拥有了数字工具和方法来传播信息，这正是 AI 用来滋养自身的燃料。当地经济可以按照自己的节奏采用像蒸汽机这样的技术，但\
  \ AI 的出现将迫使我们限制对信息的获取，并遏制那些肆意在我们的环境中播种不受控增长服务的科技公司的增长，这正是欧盟（EU）正在所做的事情。\n\n欧盟正在对美国科技巨头进行反击，最引注目的的方式是引入了广泛的法律框架，旨在限制它们在欧盟市场的影响力。正如\
  \ CNN 的文章 14 所解释的那样，欧盟坚决要通过罚款和监管行动来拆分 Google。2019 年 3 月，欧盟投票通过了一项版权指令 15，该指令包含了如今已臭名昭著的`第\
  \ 11 条`和`第 13 条`。这两个条款分别规定新闻聚合服务在链接到新闻文章之前必须获得许可或支付许可费，并要求内容提供者随时必须尊重版权，而不仅仅是在大公司要求他们的时候。\n\
  \n简而言之，`第 11 条`和`第 13 条`几乎明确点名了 `Google News` 和 `YouTube`，这两者都在别人的内容上投放广告并赚取巨额利润，却只给选定的内容创作者支付微薄的报酬。Google\
  \  supposed 如何扫描全天候上传到 `YouTube` 的数十万小时视频以检查是否存在侵犯版权权的行为？虽然 Google 确实拥有 `ContentID`（一个通过将上传的内容与主要发行商拥有的作品数据库进行比对的系统），但在视频上传之前，几乎无法做什么来应用\
  \ `ContentID`，而这正是 Google 必须开始做的事情。\n\n主要问题在于，`YouTube` 的增长已经远远超出了任何公司能够处理的范围，而且这完全是\
  \ Google 的刻意为之。YouTube 的本意是一个巨大的信息抽斗，是用于训练目标识别和趋势分析 AI 的最全面的视频格式数据集。YouTube 视频通过在旁边显示广告来赚钱，让\
  \ Google 可以继续扩张基础设施并赚取差价，而无需创作任何内容。当你读到这里时，很可能 `YouTube` 已经不再是以前的样子，对于大多数用户来说已经变得碎片化或受到限制，这正是欧盟监管机构预期并计划的。\n\
  \nGoogle 不会减少其数据收集努力，并可能简单地转向其他数据源，例如 `IoT` 设备。我们都有智能手机，手机里可以很容易内置 `Google` 应用，欧盟实际上因其推销垄断而惩罚了\
  \ Google。但当涉及到 `YouTube` 时，一切都关乎版权这门棘手的手艺。从法律上说，版权所有者对其内容拥有绝对权利，甚至可以将其传给后代或出售给任何公司。版权所有者可以租赁或出售其内容的任何部分，同时可以免费或以某种价格对其施加可以想象的任何限制。然而，内容经常会被普通大众进行重新混合，这使得版权失效，因为版权只涉及精确的复制，但这是需要通过漫长且昂贵的法院程序来决定的，而版权所有者几乎保证胜诉。\n\
  \n\n解决方案？创建一个自动化系统，审查所有上传的视频并将其与大公司创建的版权内容数据库进行对比，这些公司如果发现侵权持续，将竭于把 Google 诉到破产。这种\
  \ `ContentID` 标记系统已被证明是一个惨痛的失败，它只有在上传的是大品牌内容的精确副本时才能正确识别版权内容。一旦小内容制作者开始录制并版权化噪音（如风铃），整个内容就会被标记为侵权。2015\
  \ 年，`ContentID` 对一段除了猫叫声外什么都没有的视频发出了侵权警告，版权所有者可以免费或以某种价格将其内容的任何部分并施加可以想象的任何限制。技术上，版权所有者可以向\
  \ `EMI Music Publishing` 提起关于虚假版权指控的诉讼，但这是另一个版权所有者愿意经历的昂贵法院诉讼。\n\n规模规模，`ContentID`\
  \ 简单地不起作用，因为它倾向于保护 Google 免受诉讼影响，而不是确保版权所有者的需求得到满足。这需要一个人类主导来审查版权指控，要么批准要么拒绝；没有可以想象的办法让\
  \ AI 接管这项任务。YouTube 单独每秒就有 3000 小时的视频上传，没有足够的员工来审查所有关于侵权指控的合规性；这种安排是不可避免的，这还是科学预测的。如果科技巨头拥有任何准备好部署的\
  \ AI，它已经部署在 YouTube 上了；如果 `ContentID` 是被吹捧的，我们可以看到它是一场灾难。这关于侵权指控，意味着 AI 在处理上是极其不足的，然而我们应该认为\
  \ AI 已经就绪并来取代我们的工作。\n\n如何如何开始测试模拟理论？情况更糟。模拟理论还声称我们可能生活在一个电脑游戏中，游戏设计者为了节省计算资源而偷工，这旨在解释幽灵、预知和既幻感等超自然现象。甚至有\
  \ MIT 的物理学家（如 Zohreh Davoudi）对该话题发表了见解，认为由于我们运行计算机模拟的资源有限，所以我们拥有自己的神一般的创造者。另一个有趣的想法是测量宇宙射线显示它们不是连续的，而是有断点，就像如果我们放大照片并看到像素会告诉我们这是一个文件而非实物。哲学家们欢迎加入斗争，他们也确实如此，声称我们处于模拟中的任何证据也可能是模拟的一部分。死亡将是创造者终止那些没有产生任何有趣内容的模拟部分，因此对于永生的建议是“去玩有趣的事”。这还引发了关于灵魂、永生和轮回的尴尬问题，使任何科学讨论都变得糟糕。有趣的是，科学家认为落后过时的宗教文本可能是最先进的科学形式，因为一切都追溯到人类体验。\n\
  \n上帝将被什么取代？你可能已经知道答案了——AI。George 将编程比作魔法，提到人类可能没有自由意志，并强调要建立一个专注于逃离模拟的宗教。根据 George\
  \ 的说法，资本主义已经终结，因为所有公司都在通过不计代价追求利润最大化而不可避免地走向失败；从长远来看，公司应该像教会一样才能成功。我们历史的转折将是科技行业所谓的“奇点”，即\
  \ `IoT` 生态系统中未连接的单元获得关键作用的一点。\n\n他在 2019 年于《The Verge》发表的一篇文章中说，“Comma.ai 创始人 George\
  \ Hotz 想要将人类从模拟中解放” 17，这符合宗教布教。George 发表了一个关于我们都生活在模拟宇宙中的演讲，认为逃离它让我们遇到上帝并杀死他。George\
  \ 的布教得到了主流科学家的支持，他们说我们可能只是极其智能创造的视频游戏中的角色。这种方式让角色遵循规则并存在于我们赋予的框架内，但只有当我们微管理他们时，他们才拥有“生命”，除非我们也有某种程度的自由意志让事情变得有趣。\n\
  \n根据《科学美国人》的一篇文章 18，引用了尼尔·德拉斯·泰森（Neil deGrasse Tyson），有 50% 的概率我们的整个宇宙只是一个驱动的模拟。在注意到我们的\
  \ DNA 与黑猩猩仅差 2% 之后，Neil 表示可能存在一种智能，让我们看起来像黑猩猩一样原始；这种智能将通过创造和编辑人类种族来消遣自己。模拟理论源于 Nick\
  \ Bostrom（Nick Bostrom），他在 2003 年建议我们的超级先进后代有一天决定在他们的超级计算机上运行祖先——我们——的模拟。我们现在的生活可能只是想象中的一个闪烁，我们无法判断其他人是真实思想的模拟，还是这场巨大骗局中的配角。模拟理论得到了证实，我们宇宙中所有的自然法则似乎在数学上是相关的，就像是有意识的心创造它们一样。其他科学家对这种不可能的假设竟然被考虑感到遗憾，声称模拟理论的可能性实际上为零。\n\
  \n如何开始测试模拟理论？情况更糟。模拟理论还声称我们可能生活在一个电脑游戏中，游戏设计者为了节省计算资源而偷工，这旨在解释幽灵、预知和既视感等超自然现象。甚至有\
  \ MIT 的物理学家（如 Zohreh Davoudi）对该话题发表了见解，认为由于我们运行计算机模拟的资源有限，所以我们拥有自己的神一般的创造者。另一个有趣的想法是测量宇宙射线显示它们不是连续的，而是有断点，就像如果我们放大照片并看到像素会告诉我们这是一个文件而非实物。哲学家们欢迎加入斗争，他们也确实如此，声称我们处于模拟中的任何证据也可能是模拟的一部分。死亡将是创造者终止那些没有产生任何有趣内容的模拟部分，因此对于永生的建议是“去玩有趣的事”。这还引发了关于灵魂、永生和轮回的尴尬问题，使任何科学讨论都变得糟糕。有趣的是，科学家认为落后过时的宗教文本可能是最先进的科学形式，因为一切都追溯到人类体验。\n\
  \n上帝将被什么取代？你可能已经知道答案了——AI。George 将编程比作魔法，提到人类可能没有自由意志，并强调要建立一个专注于逃离模拟的宗教。根据 George\
  \ 的说法，资本主义已经终结，因为所有公司都在通过不计代价追求利润最大化而不可避免地走向失败；从长远来看，公司应该像教会一样才能成功。我们历史的转折将是科技行业所谓的“奇点”，即\
  \ `IoT` 生态系统中未连接的单元获得关键作用的一点。\n\n\n\n\n\n\n我们可以通过回顾开创性的技术发明，了解它们如何改变我们的业务模式和生活方式，从而推断\
  \ AI 将如何产生同样的影响。我们可以将内燃机视为标志二十世纪最重要的发明，它的动力来自化石燃料的使用。\n\n内燃机让我们以比以前更快的速度旅行，获得了前所未有的生产力和空闲时间。汽车很快变成了一种身份的象征，城市不得不为了容纳它们而扩张，铺平了耕地，并预留了大量的可用停车空间，以至于没有汽车几乎无法进行任何活动。\n\
  \n内燃机还让我们拥有了运输货物的货车和卡车，为我们提供了难以想象的丰富，但也以非常明显的方式污染了我们的环境；只需看看任何现代大都市那无法穿透的雾霾即可。化石燃料本身是一个微不足道的污染源，但当它们被全球采纳、每个人都能买得起汽车时，它们开始了严重的污染。讽刺的是，它们也让每个人变得更富有，因此无法缩减规模并仅仅“少用”。我们摄的每一口食物都必须通过某种使用内燃机的运输工具到达，这意味着化石燃料和污染；由于狩猎采集的生活方式在城市中是不可能的，我们不得不吃任何现有的食物，长此以往导致了各种健康问题。\n\
  \n富含化石燃料的沙特阿拉伯成为了全球权力中心，从一个牧驼人的帐篷城市变成了一个闪发发的大都市，负担得起建造从太空可见的人造群岛。美国引入了石油美元的概念，并强烈建议每个国家专门使用美元在市场上购买石油。这创造了对美元的高需求，而美元可以通过打印产生比美国市场自身能维持的得多的财富。与此同时，创造化石燃料替代品的尝试均已告失败，各国安装可再生能源（如风力发电机）只是痴人说梦；在大多数情况下，它们处于亏损状态，必须由纳税人资助。\n\
  \n\n某个国家可能恰好拥有将 AI 物理上锚定在我们世界中的完美要素，突然使其变成一个“黄金国”。全球权力的转移将是瞬时的、地性的，而且由于核武器的存在，这种转移是出奇地和平的。AI\
  \ 一旦在我们的全球数字社会中达到足够的渗透率，可能会产生与内燃机相似的影响：更多的力量、更高的生产力、更高的地位和更多的空闲时间。\n\n我们确实为行人留了专用车道（人行道）并禁止汽车在上面行驶；我们也为汽车创建了专用车道（高速公路）并禁止路人在上面行走。在计算机术语中，人腿是城市基础设施中仍支持的遗留硬件，因此我们可能需要创建一个全新的基础设施层来容纳\
  \ AI，而将普通的互联网和电话线留给人类。\n\n这甚至不是意志力或社会组织的问题；只需比较拖拉机与使用锄子和铲子的第三世界村庄的产即可。一台由人类驱动的机器就能轻松地完成\
  \ 300 个男女妇女的工作，同时只产生极少的污染。不仅如此，拖拉机驾驶员坐在舒适的座椅上，驾驶室保护他免受日晒，因此耕田变成了一件愉快的事。\n\n\nAI\
  \ 让人们失业的可能性有多大？就像我们没有听到任何人抱怨拖拉机夺走了村民所有肥美的耕作和除草工作一样，AI 不会消除现有的工作，但将自动化并加速我们以前必须花费大量时间和精力手动完成的某些简单、重复的家务。AI\
  \ 会让那些家务变得更加愉快，我们会很高兴终于拥有了它，但也存在过度依赖机器的问题，以至于我们忘记了使用大脑。\n\n注意在拖拉机的类比中，它仍然提到了“由人类驱动的机器”。这不仅仅是一个修辞或刻意为之的情况——在法律上，所有符合道路行驶标准的车辆必须由人类操作，即使在动物可以选择速度和方向的马车情况下也是如此。使用内燃机引擎的车辆在发生故障时，必须有人负责，这意味着它们必须注册、维护，且操作员必须持有特定的执照等。如果我们把马车夫与汽车司机进行比较，可以清楚地看到，马力的增加导致了更严格的许可规定。如果\
  \ AI 最终成为一种家庭用品，每个人都像拥有智能手机一样拥有它，它们可能需要像美国某些州注册枪支那样对其进行许可注册。\n\n\n\n\n\n\n众所周知，人类使用性能增强剂、神经刺激剂——例如`coffee`——驱动全球经济。对于机器或\
  \ $AI$ 来说，与之对应的东西是什么？据我们所知，并没有这种东西——这意味着机器的表现可能超过人类，但其生产力顶多是线性的，无法跟上那些能够不断提升性能是是性能的人类。\n\
  \n然而，使用性能增强剂确实有副作用。酒精危机在美国正在飙升，尤其是在女性中。`alcohol` 每年导致全球约三万人死亡，是一种大脑刺激剂，能降低抑制力并扭曲现实感。简单来说，`alcohol`\
  \ 让用户放松并生活在一个稍微好一点的世界里，即使过度使用确实会导致第二天出现宿醉。起初想要酒精的根本原因是压力——通常是为了在工作场所为了坚持下去而将身体推向极限界。创业者尤其倾向于使自己和周围的所有人处于不适、缺乏睡眠和痛苦之中，而我们实际上还因此崇拜他们。成为一个睡眠充足的创业者被视为异端，尽管睡眠剥夺是一种合法的酷刑手段，会引发精神症——一种使大脑碎裂的脱离现实的状态。\n\
  \n总统和领导人在自传中为自己完全不睡觉做决定感到自豪，尽管他们指挥着军队和核武器库。我们如何把任何事情的未来托付给几乎没有睡过好觉的疯子呢？然而，我们不得不让所有人，从普通清洁工到总统，拼命工作直到早死，否则就没有机会在市场上保持竞争力。因此，过度的要求和缺乏睡眠导致了巨大的压力以及身体和心理的长期崩溃。咖啡因滥用在创新或应对压力方面也是另一个大问题。我们不把咖啡消耗视为问题——因为它在早晨能给我们带来提神感——但`caffeine`\
  \ 是一种长期来看会损害身体的刺激剂，特别是通过破坏睡眠模式，加剧了诱发精神症的问题。\n\n科技巨头的所有高管可能由于睡眠剥夺和刺激剂消耗而脱离现实，甚至不知道自己在做什么，只能依靠下方的精英人才阶层。极可能，科技巨头渴望\
  \ AI 接管仅仅是为了让他们最终能睡个好觉。那么，压力的真正原因是什么？从工程术语来说，压力是指结构或元件在崩溃之前所承受的特定数量的负载。对于人类来说，压力当我们感知周围世界是危险的时的认知负荷。成功做到这一点会在大脑中释放少量愉悦化学物质，帮助我们放松，让我们产生成就感和满足感。如果我们无法处理压力的来源，就会产生一些机制，例如寻找安慰食物——即高热量食物，通常营养少但味道好，以触发大脑中愉悦化学物质的释放。\n\
  \n在 2007 年一项名为“压力、饮食与奖励系统”的研究中，加州大学的科学家研究了压力与沉溺安慰食物之间的联系。本质上，压力是对危险的进化反应，会触发短暂的“战斗或逃跑”反射，释放`adrenaline`和`cortisol`，这消耗身体并缩短寿命。压力是为了赋予我们超能力，让我们反击或逃避危险，但在日常生活中，特别是当你处于一个动态环境时，同样的压力反应可能会在毫无益处的情况下触发。所以，如果你在零售业工作，客户开始对你大吼，这会导致你的边缘系统认为自己正受到攻击并触发压力，导致你回回击（战斗）或畏缩（逃跑）。\n\
  \n压力的解决方案总是将所有情况视为挑战而非危险源。这种视角的简单转变让我们使用新大脑皮层而非边缘系统，开发更高脑功能而非触发最基础的生存本能。本质上，将大大叫的客户视为挑战而非威胁，可能会让你用一句机默的话来回应，中断他或她愤怒的宣泄，并可能让他们大笑起来，将一个充满压力的局面变成轻松而有趣的局面，你们可以一起解决可能发生的任何问题，而没有任何压力。该研究检查了人们如何通过吃高热量食物（如饼干）来应对压力，这些食物会像药物一样触发大脑的愉悦反应；饼干成瘾可以使用`Naloxone`从大脑中清除，这是一种帮助药物成瘾者戒口的药物。不仅仅是人类通过这种方式缓解压力，因为即使暴露在极端危险中的老鼠最终也会上饼干或糖水，这等同于`soda`或果汁。\n\
  \n大众不断处于压力状态，最终谁获益了？是生产和营销这些压力应对机制的公司，无论是食物、酒精还是其他缓慢破坏身体的恶习。本质上，我们的存在本身就不时涉及少量的压力，但身处繁荣的金融市场要求我们必须不断处于压力之中，否则我们就不会尽全力去赚取和花费更多的钱。从媒体到食品和娱乐的大型公司必须不断将我们推入一种压力驱动的狂热中，否则我们只会对自己拥有的极点东西感到满足，并过上平静的生活。\n\
  \n因此，如果科技巨头决定他们需要终极经济增强剂，他们可能会宣布一个消除所有威胁的威胁——AI，一个神秘且无形的完美工人、顾问、爱人人和战士。我们不需要理会科技巨头关于\
  \ AI 的末日阴影的宣告——因为我们现在有了另一种解释，说明了他们为什么会如此强烈地推动它。人类一直适应生活并将继续下去下去，只是现在你知道这一切都只是一个挑战，可以使用大脑中休眠的高功能来解决，而这些功能在我们因担心生命而产生压力时会不断被边缘系统所覆盖，这使我们变得完全可预测并最终安于现状。只要我们意识到这些可能性并有意识地构建自己的人生道路，没有任何外部因素可以违背我们的自由意志来塑造我们的行为。从一个不会感到恐惧、焦虑、愤怒或饥饿的人类的无压力视角来看\
  \ AI，它取代该人类的可能性有多大？完全没有。\n\n\n\n\n\n\n要使用 AI，你首先应该明确定义目标，以及如何通过机器学习来实现该目标。你将使用所谓的“增长破解”（growth\
  \ hacking），这是一种创业范式，依赖于建立一个稳固的框架，并包含可重复的步骤，当你陷入困境时可以随时回到这些步骤上。就像藤蔓寻找最近的点进行附着，但始终保持向上攀爬以获得更多阳光一样，你也应该在坚持最终目标的同时，每天灵活地对\
  \ AI 进行实施。\n\n增长破解依赖于稳定的数据源和可靠的数据分析方法。比其他任何事情，增长破解意味着无论你的项目涉及什么，你将采用科学的方法，而对客户想要什么或最终产品应该什么样没有任何无偏见。只有在收集并剖析数据以获得可操作的解决方案后，你才会利用一点创造力火花找到新的视角并爬得更高，就像藤蔓一样，重复整个过程。\n\
  \n只有当你能够独立于任何 AI 完成这种增长破解之后，你才真正负担得起使用它的代价。AI 应该始终用于自动化那些我们已经知道可以产生工作结果、但缺乏时间或人力进行足够迭代的现有流程。AI\
  \ 的运作方式非常神秘，它可能提供落在统计误差范围内的解决方案。因此，准备好调整你的用例并对其进行实验，直到你对答案完全满意。起初，尝试简化你的问题，使其可以用“是”或“否”来回答，并让尽可能多的人参与回答每个问题。不要急于，只需建立稳固的基础。你经历的增长不应该是突然或爆炸性的，而应该是受控且管理的，否则意外的成功会让你应接不及。\n\
  \n\n制作新闻是一场苦差，这就是为什么许多网站使用点击诱饵，但他们至少没有为了影响选举而公然撒谎。另一方面，制造假新闻相当容易，在社交媒体上轻信用户的帮助下，它会像野火一样蔓延，长期来看影响国家。\n\
  \n中国已经有一个解决方案——事实查机器人 `Meiyu` `[23`，它在社交媒体上陪伴用户，并自动修正他们在聊天中说的任何话。该机器人被描述为“台湾的”而非中国的，它是免费的——据说它的作用是在提到可疑文章时引用开源数据库，并且设计上不收集用户的个人数据。然而，它必须筛选用户信息，获取他们提到的所有数据以理解对话。它所做的只是创建一份报告，列出谁是传播假新闻的人，以便警察进行“友善访问”。\n\
  \n如果这个机器人是免费的，那么所有者最初创建它的动力是什么？最可能的答案是中国政府资助了 `Meiyu`；特别是，打着风险投资旗号反间报部门，这在美国已经发生过。第二可能的答案是它收集私有数据以创建心理画像，并将其出售给广告公司。最后，它也可能确实是由一个意图良好的小角色开发者制作的，在这种情况下，前两种情况的参与者仍然可以切入并购买该应用，获得整个用户群和所有收集的数据，即使这些只是错误报告。\n\
  \n用户并不喜欢 `Meiyu`，特别是当长辈在聊天中时——因为反驳长辈被认为是不礼貌的。`Meiyu` 最终看起来更像是一个反叛机器人而不是事实查机器人，它只是闯入对话做出随机断言，无论材料是否有任何真假。例如，`Meiyu`\
  \ 不同意通过喝更多水可以减轻流感症状，表示：“网络上有大量关于喝水的信息。医生说并非所有信息都是可靠的。”\n\n\n当人类与数字设备交互时，他们会留下信息痕迹，这就像雷达上的一个信号点；有了足够的信号点，人类就可以被可靠地追踪到最细微的细节，而这只需要一个单一的事实查\
  \ App。在 App 开发者的总部，一系列机器静静地吸取所有安装了 App 的用户可能的数据，包括他们的短信、电话号码、用于三角测量位置的 Wi-Fi 网络名称等。在用户毫无察觉的情况下，他们的智能手机变成了间谍设备，而这恰是开发者不想收集数据的时候。\n\
  \n如果一家科技公司想要收集数据，它可以创建特殊的系统，对数据进行标记和分类，这种方式可以让公司所有者免于责任，但允许完全的监控。就像微小的沙粒本身是不可觉的，但堆积在一起就会形成无法被扫到毯子下的沙丘，数据位可以堆积起来形成一个庞大的用户细节和习惯集合，揭示他们最私人的想法和秘密。本质上，这就是大数据，一组如此巨大且增长如此快以至于没有人类可以对其控制的用户数据。大数据被用于喂养和完善机器学习，而机器学习反过来又帮助建立大数据。\n\
  \n人类对大数据能做什么？实际上可以做很多。如果你拥有一家可能收集用户数据的公司，请注意，大数据是黑客眼中肥肉的目标，黑客总能找到廉价、简单且低技术的方法来破解安全。针对健康客的最佳防御是：a)\
  \ 仅收集最小的用户数据，b) 在不再需要时立即删除所有用户数据，c) 对所有数据进行隔离，以便黑客无法一次性获取所有数据。\n\n这种方法被称为`设计安全`，涉及创建组件尽可能简单的服务和服务。结合深度防御，物理访问控制配合软件防护，这意味着将数据加密并锁在只有信任人员才能获得密钥的安全房间内。在专用硬盘上进行定期备份，并保持与互联网断开。\n\
  \n如果你是一个为收集大数据的公司的程序员，请记住，在大多数情况下，任何服务或产品的用户都会使用默认设置。无论你设置什么为默认，你的用户在不检查甚至不知道如何更改设置的情况下就会使用它。此外，警惕`功能膨胀`（feature\
  \ creep），即产品为了承担比其现实能实现的更多职责而发生转向，使其变得容易受到攻击。\n\n如果你是一个想让自己的数据排除在大数据之外的用户，请开始撒谎。每当被要求个人信息时（如姓名、电子邮件和出生日期），输入虚假回复——除非你真的要使用那些服务——并在你不使用的旧账户被用来给你发送垃圾邮件时删除它们。创建一次性邮箱账户并为所有内容选择长密码；密码长度是其强度的最佳指标，因此除非产品明确要求，否则不必使用大写字母、数字和特殊字符。如果你真的需要使用社交媒体，为每个平台使用独立的设备，并在你准备赠送或出售它们时，重置设备以清除所有个人数据。\n\
  \n\n\n\n\n\n在当前的美国商业环境中，`IQ` 测试是被禁止的，因为这会导致所谓的“差异性影响”（disparate impact），这本质上意味着如果企业过滤掉了不胜任的人员，可能会被起诉。即使企业确实需要具备某项技能的员工，雇主仍可能被拖上法庭，并遭受媒体舆论的审判，因此，大多数雇主只能叹气，并雇佣那些对业务贡献微乎其微、与真正高效员工并行的人。\n\
  \n这种为了遵循“完美饼图”理想主义观念（即每个种族和国家身份都拥有一席）而雇用象征性员工的做法，是不可持续的且可能是有害的，但雇主们仍然这样做，仅仅是为了避免受到媒体的指责。\n\
  \n在这样一个闹上最高法院的案例中——`Ricci v DeStefano` `24`，康涅狄格州新亥市的一组消防员通过通过一项漫长且昂贵的考试来竞争中尉和上尉职位。市政府最终否决了考试结果，因为没有足够的少数族裔候选人通过，而本应获得晋的消防员提起了诉讼。最高法院裁定：“根据第七章法案，本案中市政府这种基于种族的行动是不允许的，除非雇主能够证明有强有证据表明，如果没有采取该行动，它根据差异性影响法案将承担责任。”简而言之，这项考试是新亥市能提供的最好的，而这本该是应该使用的。\n\
  \n想象一下这种局面：消防员响应警报却不知道如何进行，因为他们所有人都是根据肤色、眼睛或头发颜色被录用的，而不是根据拯救生命财产的实际能力。消防工作不再是雇佣最强壮、最资源丰富的人，而是变成了平息社会不满之火的过程，政治家通过迎合最基础的部落冲动来争夺有利的媒体报道。那些敢于指出问题的人会在媒体上遭到抨击，无论他们是如何表述的，也无论他们说得多么正确。\n\
  \n然而，对于一种真正不分烘烤对象的开放火焰，是没有任何谈判余余的。雇主甚至不能拒绝雇佣或直接解雇一名孕妇，即使她的工作涉及可能影响胎儿的毒性物质。在美国，约\
  \ 75% 的就业女性在职业期间都会怀孕，这迫使雇主必须：\na) 放弃雇佣和培训该女性的任何成本；\nb) 支付产生的任何费用，因为怀孕被视为一种慢性健康问题；\n\
  c) 自费为孕妇寻找替代者。\n这源于《1978 年联邦反怀孕歧视法案》`25`，该法是由另一个最高法院案例引起的，在该案中，一名孕妇起诉 `General Electric`，因为其残疾保险计划不涵盖怀孕或分娩。一直到最高法院的所有法院都确认\
  \ `General Electric` 没有错，因为其残疾计划为男女提供了相同的福利，这就是为什么会迅速通过了该法案来填补这一巧妙的漏洞。\n\n将此结果与中国商人的处理方式进行对比——如果这意味着工厂生产力的微小增加，他们乐意一车车地将孕妇送进粉碎机，而中国政府也会批准。你现在知道为什么这么多公司将制造业搬到中国了吗？得益于最低的工人权利和最大的利润，中国是实验任何新型业务产品的完美场所。\n\
  \n如果 AI 真的要到来并取代人类工人，那么将制造业能力留在第一世界而不是运出去是有意义的，但实际情况并非如此。`Foxconn` 是一个特别极端的例子，它在中国拥有一个巨大的工厂园区，那里的工人每日配额由生产率最高的一拨设定——做得超过那个标准，其他人就必须加速或被解雇。从座位安排到工人互动，一切都受到严格的控制和优化。决定无法忍受的工人通常通过从最近的园区建筑跳楼来结束这一切，这促使\
  \ `Foxconn` 管理层安装了安全网，让不快的工人重新考虑自己的选择，并面对被雇的耻辱。\n\n`Foxconn` 生产了全球约 40% 的消费电子产品，例如\
  \ `Playstations`、`iPhones`、`Nintendo 3DS` 和 `Xbox`。西方的职场平等观念，即孕妇和少数族裔因为反歧视法而获得舒适的职位，看起来是理想化且古旧的，就像一个从未经营过成功业务的哲学家想象的经营方式一样；中国在各个方面都更高效，尽管它产生了巨大的痛苦。\n\
  \n如果企业必须应对不断的投诉、诉讼和负面媒体头条，它们就无法保持竞争力，这就是为什么他们通常建立 `人力资源 (HR)` 部门来在内部处理员工事务。`HR`\
  \ 处理招聘和解雇，像一个思想警察一样微管理员工的行为，以将雇主的法律责任降至最低。\n\n在经历过 `#MeToo` 恐慌之后（在此期间，各种女性声称受到权势男性的骚扰），`Netflix`\
  \ 的 `HR` 部门引入了一项规定：男和女员工的眼神交流每次不能超过五秒 `26`，因为这会“引发强烈的性欲望”。`HR` 能这样做吗？`HR` 可以随心所欲。`HR`\
  \ 用其自己复杂的方案处理工作面试，这些方案专门设计用于让潜在员工无法提起歧视诉讼。如果你曾不幸地经历过同一家公司六场愈发复杂的职位面试，结果却在没有理由的情况下被拒绝了，现在你知道为什么了——你从根本没有被考虑过那个职位，但公司必须演一场戏以减少负面媒体报道的可能性。\n\
  \n简历的情况也是如此，它们只是被直接扔进回收桶，除了极少数几个例外。\n\n\n\n\n# 第 14 章 – AI 与法律系统\n\n## 概述\n在全美国，不同的县正在尝试使用神经网络工具，这些工具为犯罪分子提供风险评分，即在\
  \ `1-10` 的分值范围内衡量他们再次犯罪的概率。一篇详尽的文章描述了此类软件运行的几个案例，并带来了关于基于算法运行的监狱系统的内部数据。\n\n当 18\
  \ 岁的黑人女孩 `Brisha Borden` 在上学路上偷了一辆自行车时，她被捕并指控小偷和入室盗窃。分析其记录（四项轻微罪）的计算机算法给出的分数是 `8/10`，意味着她极有可能再次犯罪。与此同时，41\
  \ 岁的白人男性 `Vernon Prater` 曾有一次未遂抢劫和两次武装抢劫，因在 Home Depot 家装商店偷窃被捕，并被同一系统评为 `3/10`。两年后，Vernon\
  \ 试图实施大盗窃，但 Brisha 什么也没有做，这意味着算法判错了。\n\n人类大脑无法正确理解概率，并在试图推算几率时会给自己带来很多困扰。当技术被引入其中时，它会成为额外的困惑来源，因为技术永远是不完美的。正如你稍后在章节中看到的\
  \ `soap dispenser` 一样，技术旨在在特定的输入范围内可靠地工作，但边缘情况可能会导致其随机故障。此外，概率会产生复合效应，因此如果我们使用不准确的技术来复核\
  \ `guesimate`（估测），预测结果将比我们仅仅估算的要糟糕得多。\n\n这听起来很奇怪，但在数学上是说得通。想象设立一个警察检查站来抓捕醉驾。驾驶是一种邪恶的犯罪——可以通过自动驾驶汽车完全防止（汽车在需要时会杀死驾驶员），这无故危害了生命，因此我们有一个高尚的目标，并对给司机带来不便感到良好。再想象一个准确率达\
  \ `99%` 的 `breathalyzer`。听起来很完美，对吧？然而，假设每千人中只有一人醉驾。抓到那个人的概率是多少？仔细思考答案。\n\n如果你停下来并测试\
  \ 1000 名驾驶员，错误率为 `1%` 的 `breathalyzer` 会显示其中 10 个人是醉的，而实际上只有 1 个人醉了。因此，`breathalyzer`\
  \ 具有 `90%` 的误报率，并错误地指控了醉驾。糟糕的部分是，驾驶员通常会被负罪感淹没，而不敢挑战 `breathalyzer`。毕竟它是最先进的技术，它怎么可能出错呢，更不用说错这么多？当结合\
  \ `SCS` 之类的工具时，虚假的醉驾指控可能会导致一系列连锁反应，彻底毁掉一个人的生活，而这还是在使用准确率达 `99%` 的 `breathalyzer`！\n\
  \n事实证明，如果一个事件并不常见，那么用于检测它的技术的误差范围必须低于事件发生的概率，否则使用这种技术根本没有意义。事实上，事件越不常见，检测和预测的结果就越是离谱。你可以在这个思想实验中尝试调整醉驾的发生率，你会发现只有当\
  \ `90%` 的驾驶员醉驾时，`breathalyzer` 的误差范围才等于错误检测率。\n\n人类比技术精确得多；想象一下一个准确率只有 `50%` 或更低的\
  \ `breathalyzer` 吧。警察和法院知道误报发生的频率，但无论如何都会坚持，因为普通大众需要看到政府正在对犯罪采取措施以安抚他们的边缘系统，尽管完全无辜的人正在受到惩罚。这个思想练习还表明，所有那些强制性的醉驾检查站都是完全意义的，因为我们为了抓那一个微醺的人而给\
  \ `999` 名驾驶员带来了不便。\n\n这个简单的思想实验告诉我们，数学永远是效率的终极裁者，它切断了情感胡闹和对人权的剥夺。你应该始终基于以下理由对用于证明某事的结论提出挑战：\n\
  a) 操作员不够练\nb) 技术可能会随机故障\nc) 罕见事件无法被可靠地检测。\n\n`Brisha` 和 `Vernon` 的犯罪评分与文章所微妙暗示的“她是黑人女孩而他是白人男性”这一事实无关，但更有可能是小偷窃的发生频率比武装抢劫高得多，这意味着算法分配了它再次发生的更高概率。这些算法风险评估已用于从亚利桑那州到威斯康星州的法庭，结果在量刑期间提供给法官。其理念是得出一个数字，显示对于任何给定的被告，康复成功的概率有多大。在联邦监狱中，这类评估将变成强制性的。\n\
  \n正如预期的那样，政治人物正抓住“算法不公”将其作为系统性种族主义和偏见的延伸，但解释似乎比这简单得多——一个用于风险评估的工具就是太烂了。这种由营利公司 `Northpointe`\
  \ 创建的、用于评估 `Brisha` 和 `Vern` 的犯罪预测算法据说是专利所有的，因此不可供审查。我们所知道的是，有 `137` 个问题由被告回答或直接从他们的文件中提取，例如受教育程度和当前就业状态。该公司由一位统计学教授创立，后来以未披露的价格出售给另一家公司。\n\
  \n如果这种工具在法庭上变成强制性的，将有人赚大钱。在此之前，法官对于如何对待被告有很大的回旋地，但改善对待少数群体的政治压力限制了他们的手——直到他们开始使用风险评估算法。这些评分通常在量刑前作为机密文件附上，以确定缓假资格，被发现能准确预测约\
  \ `61%` 的再犯率，具体取决于被告是白人还是黑人。\n\n\n\n\n\n一家名为自动驾驶卡车的初创公司 `Otto` 派遣其的一辆卡车进行了 120 英里的旅程，交付\
  \ 51,000 罐百威啤酒。已经发言要从员工中消除人类驾驶员的 Uber 买了 `Otto`，现在正在将自动驾驶车辆作为一种旨在给投资者留下印象的营销策略的一部分。注意旅程中的细节，以观察自动驾驶车辆的缺陷。\n\
  \n这辆无人驾驶卡车的驾驶位空，被四辆警车和三辆 `Otto` 车辆包围，这些车辆的作用是在有人口渴或卡车发生故障时进行介入；两辆拖车在前方交通流中穿行，以确保无人干扰卡车的轨迹。司机在后部休息，但一旦卡车离开高速公路就接管了控制权。`Otto`\
  \ 事后证实，他们之前执行过相同的路线，当时由人类驾驶员开车，对方从未接管过控制权。\n\n百威的物流经理解释说，他们渴望看到这种交付方式实现规模化。科罗拉多州交通部执行主任沙尔伦·巴特（Shailen\
  \ Bhatt）表示，自动驾驶卡车处于法律灰色地带，但这项技术未来可能像自动挡箱一样普及。`Otto` 和百威制造商都无法说明他们认为自动驾驶卡车何时成为交通常态的一部分。\n\
  \n\n你发现了多少缺陷？无人驾驶车辆需要人类的持续关注，在这种情况下，单辆车至少需要七个人的关注（包围它的每辆车各一名驾驶员，不包括拖车里的司机），加上卡车后部的一名司机。\n\
  \n那么为什么司机要在那里呢？因为卡车的传感器严重依赖于完美的高速交通标志来导航；一旦卡车进入泥土路或碎石路，驱动它的神经网络就会陷入混乱。自动驾驶车辆需要巨大的基础设施才能正常工作，而且这还是在没有人类干预的情况下。人类驾驶员在遇到自动驾驶车辆时，很可能会为了好玩或为了索赔而故意干扰它，因此为了外观需要，驾驶舱里仍然得有一个人类驾驶员。\n\
  \n拥有并调度自动驾驶车辆的公司随后可能会推动建立无人驾驶道，在那里，神经网络始终拥有优先权，并可以形成无缝的护队。这与使用火车运输货物有什么区别？\n\n此外，自动驾驶车辆处于法律灰色地带，这意味着它们不能像普通车辆那样获得保险或注册。目前仍然自动驾驶卡车是否可以规模化，也就是说，我们大致知道派遣一辆自动驾驶卡车旅行会发生什么，但如果同时向四方派遣一千万辆，会发生什么呢？物流公司需要建立什么样的基础设施来管理这些？\n\
  \n\n在没有明显答案的情况下，最可能的原因是能够称自己的公司完全自动化的某种自豪感。对潜在自动驾驶汽车买者的调查显示，他们压倒性地想要一种宁愿毁掉自己驾驶员也不愿杀死路人的汽车。问题是，当他们被问及是否会购买或驾驶那种汽车时，他们激烈地表示：“不”。\n\
  \n\n科技巨头扩大影响范围和监控的利益与社会规范、神经网络的能力，甚至源于边缘系统的人类自我保护本能发生冲突。这类事件的法律责任将是巨大的，购买协议中的任何自杀条款都无法保护科技巨头免受如雨般的诉讼。\n\
  \n然而，将自动驾驶汽车描述为由被赋予神灵地位的 AI 操控，可能作为一种法律漏洞。已经存在“不可抗力”（`force majeure`）或更高级力量的先例，这允许公司逃避合同，特别是在由于大量财产保险赔付会导致公司破产的情况下。“不可抗力”预留给极具压倒性的事件，如暴乱和战争，但也包括彻底摧毁特定地区的自然灾害，如龙卷风和洪水。不可抗力被视为“天灾”（an\
  \ act of God），在 AI 被呈现为神灵之后可以使用，使其在自动驾驶车辆连环事故中法律上免受诉讼和合同的约束。\n\n\n\n\n\n\n想象一个生活在丛林中的古代原始部落，他们主要靠赤手从地上挖出的根部为生。每个人每天的大部分时间都在一位智者部落长者的监督下挖掘根部，这位长者是经验最丰富的寻根者，同时也执行着一项禁忌——这是一种自古以来流传下来的、不言的公共规则，规定部落成员不得使用任何工具。\n\
  \n当一个年轻部落成员制作了一个简单的铲子，并展示了寻找根部是多么快速简单时，长者感到很担心——这直接挑战了他的权力地位，部落也开始怀疑，也许这个年轻的冒充者应该带领部落。于是，长者与这位年轻部落成员达成了一项协议：对禁忌将破例特例，只要由长者亲自操作，就可以在寻找根部时使用这种神圣工具；当然，这是为了部落的利益。\n\
  \n此外，这位年轻部落成员将因发明铲子而获得特殊荣誉，但必须不能挑战禁忌，并且必须要交他找到的一定数量的根部，这样他就不会产生挑战长者的念头。在没有更好选择的情况下，年轻部落成员同意了，并在暗中计划着有一天终于能带领部落并制定自己的规则。部落并不在乎哪种，只要长者批准，并且他们能被喂饱并有足够的时间休息即可。\n\
  \n突然间，部落的仓库被根部塞得满满当当。每个人都被分配了与寻找、加工和储存根部相关的任务，根据他们工作的重要性和表现，他们都能获得一些根部。女性有足够的时间用植物织成衣服，男人们则可以用石头为孩子们制作玩具，用木头制作乐器。生活过得美妙而轻松。\n\
  \n自然地，监督这一切并处理那把神圣铲子的长者挑选到了最好的根部。简而言之，这个故事解释了企业家如何挑战既定的办事方式，但随后他们的工作却被政治家通过制定法律和征收税收来利用，以驱动经济并为整个部落创造繁荣。同样的故事在今天仍在上演，只不过规模扩大了，并且加入了新的元素。\n\
  \n\n\n\n\n\n当你拥有这种背景时，你终于可以理解科技巨头 CEO 们的政治诉求，最著名的就是马克·扎克伯格（Mark Zuckerberg），他几乎承认自己将在未来的\
  \ 2020 年美国大选中竞选总统，他的平台几乎完全集中在 `UBI`（基本收入）。换句话说，就是给每个人免费的根基。\n\n那么，一个由马克·扎克伯格管理的国家表现如何？让我们看看他是如何管理自己的公司以寻找线索。2019\
  \ 年 3 月 13 日，`Facebook`、`Instagram` 和 `WhatsApp` 发生了全球性的停机。根据用户的情况，某些功能可用，但大多数其他功能都崩溃了。使用\
  \ `Facebook` 账户登录的网站在这些功能上也遇到了麻烦。在了一天之后，一切才恢复正常，官方解释是“服务器配置更改”，但这并不排除黑客的可能性，因为他们也可以更改服务器配置。\n\
  \n现在想象一下 `Facebook` 的网站是互联网上唯一的网站，你就能看到这有多么不现实。一个控制了大部分互联网的技术巨头会使其极易受到黑客攻击，但他们无论如何都会推行单一文化，因为这关乎政治控制，而不是提高生产力和用户需求。这非常像宗教狂徒谈论他们的宗教是“唯一的正确途径”。\n\
  \n在技术上，`Google` 的竞争对手 `Microsoft` 正在采用一些相同的策略，甚至是一些相同的软件。2018 年，`Microsoft` 宣布其\
  \ `Edge` 浏览器将由 `Google` 的 `Chromium` 引擎驱动，这与 `Google Chrome` 使用的是同一个引擎。因此用户可以在 `Edge`\
  \ 或 `Chrome` 之间进行选择，但无论如何本质得到的都是相同的东西。网站创建者出乎意料地会走捷径，仅为 `Chromium` 优化网站，使其他浏览器的使用体验变得不佳，并逐渐引导用户使用\
  \ `Chrome`。\n\n基于网页的 `Skype` 应用程序最近的更新使其仅在 `Edge` 和 `Chrome` 中运行，证明了科技巨头非常愿意将其他人排除在乐趣之外。但摆弄过其他浏览器的黑客证明，如果他们虚假识别自己为\
  \ `Edge` 或 `Chrome`，同样的更新就可以应用于其他浏览器。并不是 `Microsoft` 无法让程序在 `Firefox` 或 `Safari`\
  \ 中运行；而是他们为了制造垄断不会这样做。这特别讽刺，因为 `Skype` 被营销为一种缩小平台和跨洲差距的方式，但实际上它将用户推入了一个单一文化的世界，只有同一家公司的应用程序才能无缝运行。这种行为发生过\
  \ `Microsoft` 身上，并且在高管对失去市场份额的恐惧推动下再次发生。\n\n\n来自各个领域的各种科学家认为自己是唯一值得解读神圣机器大脑那不可测意志的人。2019\
  \ 年，斯坦福大学（`Stanford University`）成立了一个致力于 `AI` 的新学院，但很少提到科学，而是有大量的传教。该学院没有将人类分为使用\
  \ `AI` 竞争的国家，而是提出了人类统一的思想。\n\n由曾担任 `Google` 首席 AI 科学家的李飞飞（Fei-Fei Li）领导，“斯坦福大学人类中心人工智能研究院”（Stanford\
  \ Institute for Human-Centered Artificial Intelligence）计划成为 21 世纪的宗教。所以，这是一个由恰好是中国人的\
  \ `Google` 员工运营的私人组织。吹嘘“AI 时代”的到来，宣传材料声称 `AI` 将改变从法律到医学到文学的一切。\n\n当然，`斯坦福大学` 将成为全球立法者、政治家和创业者的活动中心，他们在做出任何关于人类的决定之前，必须去那里寻求官方批准。该学院由广泛代表不同国籍和肤色的人员组成，旨在向人类展示在全球范围内进行合作是什么样子的。理论上，`AI`\
  \ 将比人类更地了解一切，但是这些科学家将解读它的意志，就像异教宗教的祭司一样。\n\n\n\n\n\n\n\n饮食将成为这样一个领域：AI 在此领域提供有用信息，让每个人都能选择适合自己基因特征的方案。想象一下，将白面包换成\
  \ 40-60% 的玉米和黑麦面包，味道可能很奇怪，但最终解决了你的胀气、粉疮和皮疹问题。出于某种原因，改变饮食对解决健康问题非常有帮助，但我们通常永远不会有意识地考虑这种选择，或者不知道该如何做。\n\
  \n我们食用的许多食物与我们的需求无关，更多是出于习惯，或者是由于过度压力下对慰藉食物的渴望。谈到食物时，目前的市场状况需要冲动控制力低且缺乏信息的客户来实现财务增长——看看麸质的结果就知道了。\n\
  \n`麸质`通常在自然界中作为小麦蛋白质存在，功能像胶水一样保持种子完整；它在 20 世纪初被分离出来并作为增稠剂投入商业用途——用于冰淇淋以防止其融化过快。分离出的`麸质`在人体消化道中像一颗微小的子弹，刺出会迅速愈合的孔洞；几十年来过度使用`麸质`会导致消费者出现严重的肠道问题和自身免疫性疾病。\n\
  \n公司使用`麸质`是因为它让食物更有嚼劲，在不破坏产品结构的情况下替代更昂贵的原料，并延长了保质期。食品安全检查员没有发现`麸质`有任何问题，因为他们通常资金不足且工作过量；在没有相反证据的情况下，`麸质`被允许进入市场，这为各种物质的肆意实验打开了大门。与此同时，普通消费者看到一种更便宜、融化更慢、口感比竞争对手更有嚼劲的冰淇淋，因为它含有`麸质`；谁在乎它是否是正品或是否损害健康？直到一个世纪后，这个骗局才被揭穿，当边缘系统高速运转时，大家都开始恐慌，但到那时，食品公司已经以质量之名销售劣质产品赚了了大钱。\n\
  \n`麸质`的有趣之处在于，它对不同个体的影响不同，显然，青少年时期接触会激活某些基因，导致成年后出现健康问题。谈到`麸质`很难给出肯定的结论，因为人体的消化道如此复杂，仅仅阐明其中一个过程就值得（且通常能获得）诺贝尔奖。最终，食物中`麸质`的使用被证明是食品公司设计、针对普通公众的一项广泛实验，经政府批准，并由边缘系统驱动的不知情的消费者资助。为什么呢？因为它通过食品销售和消费的增加促进了经济增长。\n\
  \n\n没有理由相信`AI` 在任何社会中的部署情况会比`麸质`的部署好在哪里。然而，`麸质`可以与其他成分无缝混合，但`AI`会像破掉的大拇一样显眼，要求我们从一开始就乐意接受并爱戴它。这是为什么许多有影响力的人士开始提倡`AI`的另一个解释，尽管未来还很远。`AI`的大规模采用需要全面的启蒙、公司业务模式的彻底转型，或者两者兼具；最可能的是两者都不会发生，但让我们如何看看这些可能性。\n\
  \n根据《纽约时报》的一篇文章（`35`），记者（也是一名心脏病专家）使用一个 App 记录了他十四天内吃过的所有食物、睡眠和运动情况，`AI`可以让我们严重怀疑自己这辈子都在吃什么。除了一个追踪他血糖水平的传感器外，记者还对他的粪便进行了肠道细菌分析，以查看肠道内有什么；不同的人肠道内细菌不同，每种菌株都喜欢不同的食物。\n\
  \n大多数食物研究都是观察性和自愿的，这意味着它们依赖于参与者准确报告他们多年来的饮食情况。最好的饮食研究结果显示的是相关性，但我们完全不知道因果关系，除非涉及盐——多年来过度使用盐确实会增加血压。谁资助了最多的饮食研究？是那同一个食品行业，他们热于推销他们能找到的尽可能廉价且稳定的真实原料的替代品。\n\
  \n是否存在一种适合所有人的完美饮食？我们一无所，这就是为什么`AI` 旨在筛选具有相似基因谱的人群的所有数据，分析他们在特定饮食下的表现，并为我们提供概率性的建议。从家族史到环境中的毒素以及肠道细菌，每一方面对身体处理食物的方式都起着作用。偶尔，会出现一项具有有前景结果的里程碑式研究，试图分离出那一个关键因素，但随后它会面临挑战，结论也会被软化。\n\
  \n其中一项研究是“通过预测血糖反应实现个性化营养”，它研究了参与者的血糖水平如何对 52,000 种最流行的食物（包括冰淇淋）产生波动。血糖被认为是糖尿病的主要预测指标，血糖波动（研究标题中的“血糖反应”）意味着身体必须费力处理刚刚吃进去的食物。苹果和榛果的血糖指数较低，但精制糖和碳酸饮料的很高；总来说，越精制的食物对身体的冲击越大。\n\
  \n对 800 名糖尿病患者进行了血糖测量，直到科学家获得了超过 150 万次测量结果，之后轮到`AI` 在没有人类偏见的情况下处理所有数据了。结果发现肠道细菌是个体对不同食物反应的最重要因素。之后，记者有机会自己尝试了该系统——`AI`的所有建议都是记者讨厌的食物，而所有应该避免的食物都是他最喜欢的。\n\
  \n同一种`AI`的商业版本虽然经过简化，但旨在通过人物盘子里的照片来识别食物并提供建议，以避免繁琐的人工食物报告，但如果没有测量血糖（最好通过医疗可穿戴设备），这一切仅仅比随机猜好一点点。在记者的案例中，他患有肾结症，而饮食\
  \ AI 教练推荐草莓加剧了他的病情。\n\n\n目前，我们有通用的饮食法，如生酮和原始饮食。原始饮食法认为加工食品含有许多可怕的惊喜，而且加工链中的每一个环节都可能在食物到达盘中之前对其造成污染。因此，原始饮食建议食用“清洁”食物，即你确切知道它们是如何生长、储存和加工的食物。如果可能，自己种植水果、蔬菜和禽类。生酮饮食旨在通过避免精制碳水化合物或一般的碳水化合物来应对血糖波动，这意味着不吃面包、糖果、糖或碳酸饮料，每天只吃少量水果。生酮饮食被发现可以控制药物无法控制的癫发作；科学界仍然不知道这是为什么发生的。\n\
  \n\n\n\n\n似乎在未来，随着我们通过屏幕而非面对面进行互动，孤独将成为最大的问题。问题的产生是因为我们的大脑天生为了接收来自他人的潜意识信号，这些信号让我们对周围环境和社交背景更加敏感，使我们与现实保持联系；没有了这些信号，这套巨大的神经机制就会开始关闭。\n\
  \n尽管现实世界中存在正面和负面体验的可能，但至少它们在真正意义上是真实的，并能激发出某种成熟；而在线上点击党体验的数字海洋，旨在针对我们人性中的最低公约数，通过触发恐惧、焦虑和恐慌来让我们尽可能长时间地留在网上。\n\
  \n众周知，隔离会扭曲思想，极度隔离会导致幻觉和恐恐发作，这就是为什么禁闭对于即使是最坏的罪犯来说也是一种真正的惩罚。针对加拿大学生的一系列感官剥夺实验[\\\
  [36\\]](#part0049.xhtml#a1WK)让他们佩戴了一套复杂的设备穿戴设备，旨在最大限度地减少大脑刺激：耳朵上的隔音、眼睛上的眼罩等。几小时后，学生开始表现出坐立不安，之后，他们开始疯狂地产生幻觉，看到每个人都不一样的怪异场景。他们的心理性能退化了，无法摆脱那种正处于奇怪梦境的感觉，即使在恢复刺激后很长时间，房间和里面的物体似乎仍在旋转或改变形状。没有人挺过两天的关头。\n\
  \n其原因是，人类大脑的设计是为了吸收和处理海量数据，任何数量上的短缺都会对其产生负面影响；它就像一辆减速时就会故障的汽车，但零件会保持一段时间惯性，即使在汽车停止移动时也会扩散。长期的隔离会导致悲剧性的生活，大脑通过构思复杂的幻想和详细的世界来逐渐适应孤独，往往在其中点缀想象的视觉体验。\n\
  \n当幼猴从群体中孤离开时，30 天后它们完全无法与同伴生存，它们的大脑在最脆弱时期被剥夺了刺激；经历同样情况的孩子社交会变得极端化。\n\n企业家也会经历孤独，因为他们为了追求商业成功放弃了社交圈和家庭。这是一种自愿的牺牲，它会麻痹大脑，让企业家变得冷酷、不在乎，对目标保持激光般的关注而忽略其他一切。后来，企业家会通过沉溺于奢华的肉体享受来过度补偿，但最简单的人类互动并没有每天维持他们社交电路的运行。\n\
  \n囚犯经历着最严重的隔离，因为他们唯一的人类接触是其他囚犯和守卫，两者通常都让他们不好过。在某些情况下，囚犯放弃了任何礼貌并采取完全的攻击性，因为他们失去了通过持续社交接触获得的细微社交校准。我们该如何处理这些人呢？我们是只让风险评估神经网络来决定他们的命运吗（即使它们建议将他们关在隔离中），还是我们继续尝试寻找一种最终能让他们康复的解决方案，无论这看起来多么荒诞？\n\
  \n隔离状态下的人常见的应对机制是为生活寻找更高、更抽象的意义。与其关注世俗享乐，他们可以开始在创作艺术、阅读或解决数学方程中获得快乐。宗教帮助，这就是为什么僧侣们隐入深山十年，极少接触人类，因为那能让他们听到上帝的话。\n\
  \n现在开始变得合理了吗？经历着同样缺乏人类接触的企业家可能也开始产生同样的精神疾病，让他们认为 AI 正在到来。让孤独更加悲剧的是，有许多人判处自己进行自愿禁闭，选择了纯净的数字世界而非混乱的物理世界，而他们并没有创业倾向来至少建立起收入来源。没有了人类接触和收入来源，社交技能就会萎缩，人将无法保持眼神交流或在不产生自我怀疑的情况下进行有意义的对话。如果存在物理问题，特别是影响活动能力的问题，这些人没有钱修复，并永远失去了社交圈。这是一个自我加剧的问题，需要广泛的康复，而这或许由\
  \ AI 来完成。\n\n理论上，如果现在就制造出通用 AI 并向公众开放，那么解决性格问题和隔离后果的简单易行且可扩展的解决方案是什么？AI 可以评估每个个体的心理风险，并制定一种个性化的方法来改善行为。其中一种\
  \ AI 还可以向那些渴望听取的人将自己呈现为上帝的话，并通过 `IoT` 生态系统传递其信息，使这些信息变得无处不在且无法逃避。\n\n通过给个人提供小挑战，AI\
  \ 会逐渐将其的大脑切换到更高频率，使其成为社会的功能性的一部分，同时也教他们一些关于社交校准的知识。攻击性不会吓到 AI，因为它没有为了生存而产生恐慌的边缘系统。凭借无限的耐心和无穷的智慧，这段“上帝的话”可以慢慢重新编程，让人变得更快乐、更有效率。\n\
  \n听起来太可怕了？坦率地说，对于那些被缺乏关怀和情感连接彻底摧毁的反社会人格，我们没有其他解决方案。通过了解一个人的过去并获取数字记录，AI 可以采取权威的声音，或者只是采取那个人会服从的亲属的声音。如果不如此，可以将声音调得尽可能和，诱导边缘系统进入现状。\n\
  \n\n如果将这种系统加入现有的医疗基础设施中，护士和医生就有更多时间来处理没不完的文件工作和层层行政事务。加上慢性健康问题需要整个护理网络来处理一个患者的事实，我们可能需要\
  \ AI——立刻。\n\nAI 可以与患者聊天以让他们忙碌，同时评估他们的词汇量、精神疾病或普通心情，为医生生成一份方便的报告，让医生可以在不浪费任何时间的情况下掌握全局。AI\
  \ 可以自动将匿名数据输入数据库并进行实时更新，显示不同类型的中风、伤病、癌症等的发生率，这可以帮助政治家在问题发生时而非二十年后制定健康策略。\n\n\n\n\
  \n\n这种医疗 AI 可以分析图像和 X 光片，它可以深入图像的每一个像素，以观察疾病的早期迹象和可能的扩散情况。对于那些患有恐惧症和焦虑症的人，可以提供虚拟现实眼镜，由\
  \ AI 引导他们度过创伤，并就如何处理这种情况提供极其细微的正确指导建议。当与 `Skype` 等视频通话软件结合使用时，AI 可以分析卧床患者的脸部，比任何人类都能更好地读懂他们的内心世界。\n\
  \n患者应当签署知情同意，并应该时刻意识到自己是在与机器而非人类交谈；但看到大型社交网络一直在坦承它们从字面上在监视用户，却依然无人无异于色，看来患者很可能会接受这种程序。\n\
  \n医生在处理患者方面有很大的裁量权，处理极端病例时可能不得不采取极端措施。这并非出于恶意或傲慢，而是为了提高效率并避免对患者产生情感依赖，这两点通过采取最快的解决方案（通常是某种形式的处方药）来实现。然而，医生也有一套伦理准则，可以最好概括为“首先，不伤害伤害”。\n\
  \n如果要求 AI 为了拯救患者生命而采取某种极端措施会怎样？那时 AI 是否需要像医生那样的伦理准则，以防止它对不幸的患者变成“疯狂科学家”？\n\n根据 AI\
  \ 领域书籍作者斯图特·罗塞尔 [37] 的说法，我们正面临这样一个未来：智能机器必须被赋予强制性的伦理准则，因为它们可以产生假新闻来改变我们的投票和消费行为。它们已经能够遍历社交媒体并捕捉关键词来判断性格特征，然后进行自动聊天、间谍活动和勒索。\n\
  \n斯图特还制作了“屠杀者机器人”[38]，这是一段戏剧化的视频，展示了如何利用小型无人机进行暗杀，以此在他向联合国提交禁止自主武器的请愿之前准备。这种无人机能够避开粗糙的拍击，从字面上可以俯冲目标，将三克爆炸物直接送达额头中心导致瞬间死亡。\n\
  \n虽然“屠杀者机器人”视频很有戏剧性，但它对如何击退自主无人机的解释，并不比解释如何击退澳大利亚筑巢季节攻击性防御巢穴的喜鹊[39] 要差。千年来，人类一直在与杀人动物打交道，包括致命的昆虫和狂暴的掠食者，但推测无人机对诸如力弓（nerf\
  \ gun）或超级水枪（super soaker）之类的东西也会极其脆弱。很容易想象到，人类会将狩猎这些杀手无人机变成一种运动，同时使用特殊的眼镜观察它们，并佩戴头戴摄像头直播这种顶级娱乐。没错，这就是人类所做的事。\n\
  \n因此，无人机的程序中可以嵌入伦理行为，而政府可以像监督电气和工程标准那样监督伦理标准。艾萨克·阿西莫已经想到了机器人拥有伦理规则的想法，即他的“机器人三法则”，可以概括为：\n\
  1) 不伤害人类，\n2) 服从人类命令，\n3) 保护自己。\n\n当我们考虑到忽略上下文的传统编程，以及 AI 如何解释任何此类伦理限制时，问题就出现了。如果人类正在散步，智能机器是否应该因为阳光会导致皮肤癌而禁止它？如果人类想开车或跳空伞呢？\n\
  \n伦理限制的问题可以被设定为：我们希望机器对我们拥有多少权力？权力太大，我们就是自己亲手构建的监狱里的奴隶，因此答案似乎是给机器足够的意识来识别我们何时正在做出错误选择，但不要给足够的权力让它们阻止我们做出这些选择。我们希望智能机器成为我们的顾问，收集原始数据，透明地呈现数据，并计算出一个清晰的结论，这种结论能够经受住任何可能的挑战，但最终将选择权留给我们。即使会痛苦，错误的选择通常也会导致受用一生的宝贵教训。\n\
  \n\n\n\n\n\n虽然美国在 AI 研究方面可能处于领先地位，但大规模实施的大部分在中国。中国可以利用其庞大的人口不仅能产生大量的工程师，还能将任何类型的神经网络训练视为一系列多样化的挑战。正如我们在最简单的产品中看到的那样，中国人在面对拷贝更聪明的人已经做过的事情时并不感到羞耻，他们利用其极其廉价的劳动力进行尝试，制作出可运行的原型并将其盈利。\n\
  \n事实上，美国大公司可能想进入中国市场，仅仅是为了从那源数据源中汲取，并利用劳动力对产品进行迭代，然后自然在中国政府的庇护下将产品推向美国市场。`Google`\
  \ 曾在 2006 年至 2010 年间作为首选搜索引擎进入中国市场，但由于极端的审查要求、黑客攻击、员工受审以及知识产权被窃而放弃了。2018 年，`Google`\
  \ 决定再次尝试，这让分析师们感到震惊，他们表示，如果可以的话，中国政府让网络环境变得更加敌对，因此一定有某些非常迫切的顾虑让 Google 如此渴望进入中国。\n\
  \n\n根据 `Google 中国` 前总裁李开源博士的话，我们正在进入 AI 时代，在这个时代，“数据是新的石油，中国将成为新的沙特阿拉伯”，工人不会简单按\
  \ 1:1 的比例被机器取代——整个行业将自动化，依赖这些行业的人将失去权利。他要求进行某种形式的收入再分配，因为雇用 AI 的公司将轻松赚取数十，所以对他们征收额外税似乎是最自然的解决方案，但他反对媒体中介绍的通用基本收入（UBI）。\n\
  \n李博士说，全球政府必须为公民提供“生活的意义”，而不仅仅是生存手段，并提到结果更多取决于人类满意度而非 0 和 1 的工作（例如保姆和老师）仍然不受自动化的威胁。例如，创意创作者（如作家和画家）在很长一段时间内也不必担心。\n\
  \n李博士认为，对许多人来说工作是生活的意义，他们期望像祖先一样在 60 年的人生中保持同样的常规，因此将这些东西夺走不会让他们心情愉快。问题在于，我们已经把工人当作机器人：静坐好，填写这些电子表格，每天发送八小时邮件，所以将他们的工作自动化实际上是在帮他们忙。如果给他们提供一个自动填写电子表格的智能工具，让他们只需要复核结果，这样怎么样？这将免除公司的任何法律责任，因为仍然有人类参与，但工作产出可能会大幅增加，尽管整体质量会有所下降。在一个技术日益敌对的世界里，这些人将如何何生存呢？\n\
  \n\n事实证明，消费者保护法最薄弱的两个国家——美国和中国，是推动 AI 的国家，因为他们的被俘客户对于他们得到什么几乎没有话语权。这种共同点可以用来让中国式的通过\
  \ `Facebook` 和 `Google` 等科技巨头进入美国，这些公司已经扩张到类似于主权国家的程度，除了它们在战争中无法被击败。\n\n中国的社会信用体系（`SCS`）就像一个巨大的游戏，不同的是得分低的后果意味着被切断政府基本服务，如教育和公共交通。什么会导致社会分降低？交通事故、谋杀、贪污以及与犯过其中任何行为的人有关。2015\
  \ 年的一个案例中，一位中国学生钟某某（音译）无法购买火车票或在大学入学，因为她的父亲在车祸中害了两人并自杀。系统录入的官方标签是某某“不诚”，但在四个月后她清除了了自己的身份。\n\
  \n`SCS` 已经由中国版的 `Apple` 和 `Amazon`——`腾讯` 和 `阿里巴巴` 构建并测试，它将在 2020 年推向全国，届时公民所做的一切都将计入他们的评分。喝酒、过度玩游戏或仅仅是与错误的人在一起？`SCS`\
  \ 将考虑爱好、购买行为和健康习惯是否偏离了党设定的模范公民标准，并给出处罚：社会和经济孤立。\n\n唯一的问题是，正如我们在加拿大的隔离实验中看到的，那些措施会让人们激进并扭曲他们的现实感。`SCS`\
  \ 背后的理念是，中国政府无法处理超过十亿可能拥有强大的人，因此不可信且最可能引起麻烦的人应该识别并逐渐挤出大城市，包括那些可能帮助他们重回那里的人。根据这一逻辑，`SCS`\
  \ 将奖励那些负责任的人，同时对危害自己和他人的人进行预惩罚。其他惩罚包括切断网络访问、无法获得住房贷款或工作机会以及吊销护照。在一个技术日益敌对的世界里，这些人将做什么来生存？\n\
  \n\n\n\n\n破解（Hacking）的概念是指通过一种廉价、可扩展且可靠的方法，向任何计算机系统引入不确定性，从而产生意之外的结果。由于编程方式的原因，计算机系统在面对不可接受的输入时通常会发生灾难性的故障。\n\
  \n一个例子是 `buffer overflow`（缓冲区溢出），即网站上的文本框允许任何访客输入任何数字作为年龄；黑客可以不断尝试输入，直到找到一个足够奇怪的数字，导致网站崩溃或让他们他们获得对后端的完全访问权限。通常由于急于上线，网站和软件并不会检查所有可能的输入，甚至不会限制这些输入，因为仅仅是让程序运行起来就已经花费了大量精力和精力。至少在黑客攻击之后，软件或网站的所有者会修补这个漏洞，对吧？在足够大的计算机系统中，所有者可能根本没有资源或意志来不断修复这些代码漏洞，让客户自生自灭。在系统被静默渗透且没有引起客户察觉的情况下，所有者甚至可能乐意忽略它，而关注那些可能导致集体诉讼的问题。正如之前提到的，最小可行性产品。\n\
  \n用工程术语来说，“凑合破解（hacking something together）”是指利用各种碎片和零配件创建一个本不可能实现的实用工具或产品。涉及到破解时，其思想是使用比人类制造该障碍或问题更少的精力和资源来克服障碍或解决问题。应用于生活的任何领域，破解就变成了一种以性能为中心的心态——如何让它现在就正常工作？破解中使用的东西没有限制的。凡是计算机系统配备了旨在双检系统的人工操作员的地方，黑客就可以指于人的懒惰或顺从。\n\
  \n\n取决于 `IoT` 设备中使用的传感器，肤色较深的人可能会发现自己无法使用这些设备。在某个案例中，Facebook 总部安装的一个浴室皂液分配器无法识别一名黑人在它下方挥手取肥皂，但当一个白人做同样的动作时它就能正常工作。解决方法是拿一张白色纸巾在传感器下方挥动，之后它就能按预期工作了。这并非有意的设计缺陷，而是制造皂液分配器的工程师的疏忽。深肤吸收更多光线，而浅肤反射光线，这让测量反射光量的传感器产生困惑。制造皂液分配器的工程师没有对足够的边缘情况进行测试，因为他们可能被敦促尽快推出产品并保持低成本；增加皂液分配器检测的肤色范围可能会增加成本并增加错误率。\n\
  \n我们可能面对的是充满光滑、华丽、昂贵的 `IoT` 设备的未来，它们只在极少数情况下有效，但至少那只是皂液分配器，对吧？\n\n\n自动驾驶汽车中的传感器可能会出现同样的故障，即无法检测到肤色较深的人，从而撞上他们。Metro.co.uk\
  \ 分析的一项佐治亚大学的研究发现，当测试中引入深色皮肤行人时，自动驾驶汽车的错误率往往增加 5%。简单来说，当工程师创建一个 `neural network`（神经网络）来检测物体和行人时，他们使用最显而易见的例子来帮助他们在最短时间内创建出可运行的产品，这意味着白人，因为他们最突出。\n\
  \n投资者们投入了资金，并希望现在就能看到令人深刻的结果，但正如之前提到的，`neural networks` 是概率性的。目前的车辆需要人类驾驶员，因为没有任何软件能够在大量的细微情况下做出反应，在这些情况下，简单的动作或不作为都可能导致致命后果，但至少我们可以归责于他们。\n\
  \n当其中此类汽车中的 `neural network` 发现自己处于完全全新的局面时，无法预测 `Trolley Problem`（电车难题）会发生什么，这是一个思想实验，人类必须在分秒之间决定杀死谁。电车难题本质上问的是，人类是否应该引导冲驰的电车去杀死一个人以拯救五个人，还是什么都不做让五个人死去。自动驾驶汽车可能不得不做出同样的决定，但那一个人将是驾驶员，而那五个人可能是红绿灯前的行人。当自动驾驶汽车发现它无法避免与人群发生潜在致命碰撞时，它可能会选择撞向最近的障碍物，摧毁自身并杀死驾驶员。\n\
  \n\n结合中国的社会信用评分，我们可以很容易想象一个反乌托邦的未来：公民根据其对社会的价值进行排名，当感知价值更高的人处于危险时，他们会被“自杀”。黑客只需涂黑脸就能减少被面部识别软件看到或被自动驾驶检测到的概率，变得像系统忽略的幽灵或故障一样。\n\
  \n\n\n\n\n\n在体育运动中，很多结果的产生取决于几厘米之差，而一组人类裁判可能不足以做出正确的判罚。足球是一项古老而残酷的运动，源于大规模的村庄斗殴，其规则是将一个物体从球场的一端运到另一端；随着人类不断找到方法规避过时的规则，引入技术变得不可不可。\n\
  \n在 1986 年一个特别痛苦的案例中，英格兰输给了阿根廷队，因为其中一名球员迭亚戈·马多纳用手而不是头部进球，而这是一个被禁止的动作。这一事件被称为“上帝之手”，它无疑促成了高清晰视频录像的采用：一支专门的视频分析团队进行观看，并可以要求暂停比赛，以及一组高速摄像头监控着每一个进球。\n\
  \n随着球员表现水平的提高，足球通过制造更小、更快的球实现了现代化，这些球可以被踢得更有力从而创造出令人震撼的进球，但也意味着标准的每秒 24 帧电视摄像机已不足以进行视频分析。这套被称为视频助理裁判（`VAR`）的系统为球场的每一寸都提供了多个高速摄像头角度，并允许`VAR`团队纠正场上裁判的决定，或者在检查回放时让他们暂停比赛。此外，高速摄像头监控每条门线，创建球进入球门瞬间的\
  \ 3D 表示，并通过手环屏幕和蜂鸣器自动向裁判信号是否判定进球。以防万一，还有一名备份的人类裁判，其唯一目的是盯着每条门线以对`VAR`进行双重检查。\n\n\
  `VAR`向我们展示的是，在任何需要审慎判决的情况下，简单地增加人数并不能提高准确性，但仅仅增加技术也无济于事。正确的解决方案是在谨慎扩大技术规模的同时，增加备份的人员，因为现在我们负担得起这种成本。那种“AI\
  \ 将导致卡车司机失业”的恐惧毫无意义，因为如果我们可以负担得起雇佣人类司机，由人类协助 AI 反之亦然，就像在体育运动中一样。足球现在是一项根据单个进球就能成名败的运动，所以我们最好确保每一次都是准确的，如果系统出现故障，还要给出一个完美的解释，尽管到目前为止它还没有发生过这种情况。\n\
  \n`VAR`的决定能像我们挑战审判前风险评估分数那样被挑战吗？不能，因为`VAR`：\na) 显示所有原始数据，即特写、高清晰且慢动作的进球录像；\nb) 有一名人类专家检查原始数据并做出裁决。\n\
  \n尽管拥有长期以来抵制改变的古老规则，但当观众、球员和裁判轻松地接受`VAR`时，足球实现了现代化，因为该系统是透明且具有冗余备的。这才是我们需要的 AI 技术：一种基于比人类对应物工作得更好的机器（摄像头优于人眼），并且在最终我们获得正确答案之前可以被易于挑战的，同时仍然保留了覆盖机器决定的选项。\n\
  \n\n几十年来，科小说作家一直对人工智能忧心忡忡，甚至在公众人物讨论这一概念之前也是如此。他们想象 AI 是一种助推力量，我们必须依靠它去探索太阳系之外，或者仅仅只是一个帮助我们修复地球上问题的助手，但它终究是无法回避的影响。所有将\
  \ AI 概念介绍给普通大众的媒体都将其描绘成神秘且具分析性的，不择手段地实现自己的议程，最后不可避免地变成反派。\n\n正如我们在整本书中所看到的，几乎没有证据表明这在本世纪会发生。正在发生的是，创业者比以往任何时候都更努力地让自己不眠经营业务，在刺激剂的驱动下，并对政治家缺乏影响力而感到沮丧。所以，当创业者终于获得睡眠时，他们会做关于\
  \ AI 的狂热梦——一种数字工人可以让他们最终夺取政治权力宝座，然后去睡午觉。AI 甚至可以被呈现为一个神灵，以填补整个国家生活中缺失的空白，同时赋予它特殊的法律权利和豁免权。\n\
  \n科技巨头真的能做到吗？高度怀疑。通用 AI（即像人类一样聪明的 AI）的出现可能需要像电力一样基础的技术发明才能运作，但人类将无法使用它，因为我们会直接采用这项发明，并在表现上再次优于任何机器。\n\
  \n我们确实拥有窄 AI，即可以比较图像、在图片中寻找物体或在一群脸中识别特定脸的 AI，但如果没有人类处理员的监督，即使是这些也没有用处。自动驾驶汽车和卡车如果没有人类守护者和技术员就无法工作，这意味着它们将会增加就业而不是让人们失业。正如本书中所述的，通用\
  \ AI 仅仅是一个空想，是科技巨头 CEO 们的一痴人想，他们认为自己的宠物项目可以被广泛接受，并在发放全民基本收入（UBI）时被誉为人类的救世主。他们列出的那些末日和阴暗的预测都不会发生，但煽动恐惧确实会增加消费并让人变得更容易顺从。那么，现在呢？享受这个过程吧。\n\
  \n\n\n\n\n\n关于 AI 的简化观点通过点击党内容流传。\n\n- **攻击面**：系统或网络被成功破解的概率。随着复杂性的增加呈指数级增长。\n-\
  \ **后门**：用于间谍活动和未经授权访问的隐藏访问能力。\n- **大数据**：通过使用各种软件和硬件对人类提供的数据点进行广泛自动收集和标记的结果。\n\
  - **点击党**：旨在吸引网络用户访问的内容，其唯一目的是为了给托管该内容的网站网站赚取广告收入。它会触发边缘系统。\n- **网络空间**：数字世界。物理三维世界的规则并不一定适用于那里。\n\
  - **深度学习**：根据我们无法完全理解的规则进行自我升级的智能计算机程序。\n- **深度防御**：通过层层廉价、简单的反黑客措施，让黑客因挫败而放弃。\n\
  - **涌现属性**：系统的一种非计划性但有用的属性。\n- **功能蔓延**：缓慢扩大软件产品的范围，在实用性略微增加的同时增加了其攻击面。\n- **自由意志**：覆盖边缘系统行为的能力。\n\
  - **通用 AI**：类人类的 AI。可能成为恋人或顾问。\n- **黑客攻击**：人类在计算机系统中寻找漏洞的机智。\n- **物联网**：在人类与物理世界之间调解的机器人层。\n\
  - **内核**：计算机的核心部分。用户无法动它。\n- **边缘系统**：人类大脑的核心。痴迷于生存。\n- **机器学习**：任何可以根据其接收的数据改变其输出的软件。\n\
  - **最小可行性产品**：公司在不因虚假广告被起诉的情况下，可以在一个产品中投入的最少功能。\n- **窄 AI**：高度专业化的 AI，也许和蚊子一样聪明。\n\
  - **神经网络**：分层机器学习，智能机器能够组织并升级其自身。\n- **机器人学**：赋予神经网络一个功能有限的物理躯体。\n- **SCS**：参见社会信用体系。\n\
  - **设计即安全**：通过创建精简版的服务来最小化攻击面。\n- **奇点**：AI 在所有方面都超越人类，并成为超级 AI 的点。\n- **社会信用体系**：一种像游戏一样的中国机制，根据公民对国家的价值进行评分，以决定谁有权接受教育和使用公共交通。\n\
  - **压力**：身体和心理的长期崩溃。终极生产力加速器。\n- **超级 AI**：将以我们无法理解的方式进行思考的神灵般的 AI。\n- **禁忌**：代代相传的神圣规则，绝不能质疑或违反。\n\
  - **图灵完备**：最初指可以欺骗人类使其认为自己也是人类的计算机程序。现在这被认为是一个内部笑话，因为人类在不断进化。\n- **UBI**：通用基本收入。它被推为解决\
  \ AI 导致人类失业的万能答案。\n- **UX**：考虑了用户边缘系统的编程范式。\n- **VAR**：自 2018 年以来足球中广泛使用的视频分析工具集，用于检测违规动作。\n\
  \n\n初学者需要了解关于机器人流程自动化、移动机器人、人工智能、机器学习、自动驾驶车辆、语音识别、无人机以及我们未来的知识 ![](img/rsrc1XV.jpg)\n\
  \n### 引言\n\n接下来的章节将讨论你了解机器人学所需的一切知识。当你观察周围的世界时，越来越多的机器人技术正被应用到我们的生活中。由于机器人学在我们生活变得变得越来越重要，了解机器人是如何运作的以及一些关于机器人的迷思是至关重要的。书中有很多主题，你将读到关于一些专家以及他们对机器人学的看法。在决定将其斥为骗局或更糟的东西之前，了解关于机器人学的一切是非常重要的。\n\
  \n\n\n\n\n\n机器人学被认为是一门详尽的科学与工程学科。机器人学涵盖了多个工程领域，如电子、信息、机械、计算机科学等许多领域！它通常与机器人的使用、其发明、运行方式以及用于控制机器人的计算机系统有关。它还包括传感器的反馈以及机器人必须使用的信息处理。\n\
  \n机器人技术用于创造通过复制人类动作来取代人类的机器。机器人可以用于许多情况，实现各种目的。然而，观察当今社会，它们可以被用于人类不应进入的危险环境，例如炸弹的探测甚至拆除。机器人还被用于制造流程，在这些流程中，由于空间、空气质量或其他数量的危险情况，人类无法生存，且极可能无法生存。\n\
  \n机器人可以采取几乎任何形式，甚至可以被制成像人类的样子。据说这有助于人们接受机器人，因为它们复制了通常由人类的行为。某些机器人可以复制起重、说话、行走、感知以及人类能做的几乎任何事情。今天看到的许多机器人将受到其工作环境的启发。这些机器人将对自然做出贡献，因为它们对生物仿生领域做出了贡献。\n\
  \n创建机器人的概念可以追溯到古典时代。然而，对其进行研究以及创造完美机器人的潜力直到 20 世纪初才真正付诸行动。在整个历史上，人们一直假设机器人将模仿人类行为，并处理与人类每天所相似的任务。现在，得于技术的进步，你可以看到机器人学是一个快速发展的领域。\n\
  \n\nrobotics（机器人学）一词源于“robot”（机器人）。这个词是由捷克作家卡雷·卡佩克（Karel Capek）在他的剧本于 1920 年左右首次出版时引起大众关注的。robot\
  \ 一词的起源可以追溯到斯拉语词 `roboa`，意思是“劳动”或“工作”。\n\n在卡佩克的剧中，故事始于一个制造机器人的工厂，这些生物被误认为是人类（类人的概念）。然而，发明“robot”一词的并不是卡佩克，但他确实写了一封关于该词发展的信，该信在《牛津英语词典》中指出“robot”一词是由卡佩克的兄弟约瑟夫（Josef）创造的。\n\
  \n然而，当你查看《牛津英语词典》时，它告诉你“robotics”一词最早是由艾萨克·阿西莫夫（Isaac Asimov）在他 1941 年发表的一篇科幻小说使用的。阿西莫夫并没有意识到由于电气设备中技术和科学正在创建一个新词。因此，他假设“robotics”一词将仅指代使用机器人的工作。在其他其他作品中，阿西莫夫说他在\
  \ 1942 年的一篇短文中首次使用了“robotics”一词，并首次提出了机器人三大法则的概念。但由于 `Liar` 比 `Runaround` 至少早十个月，`Liar`才是该词首次出现的地方。\n\
  \n\n1948 年，诺伯特·维纳（Norbert Wiener）首次创立了控制论原理，这是实用机器人学的基础。第一个全自主机器人出现在 20 世纪。第一个可编程的数字机器人命名为\
  \ `Unimate`，它于 1961 年投入使用，从压铸机中取出汽车零件以便进行堆叠。\n\n如今，机器人被应用于全球商业和工厂工作，它们执行任务比人类更廉价，同时更准确、更可靠。它们还被雇用于那些不适合人类的工作，因为那些工作太枯燥、太危险或太脏。机器人通常用于大生产、制造、采矿、运输、装箱包装、手术、地球和太空的探索、安全、武器以及实验室研究。\n\
