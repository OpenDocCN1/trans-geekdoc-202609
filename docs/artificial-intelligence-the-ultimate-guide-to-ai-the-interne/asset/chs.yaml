  \ - 1972 |\n| 1973 |\n| 1974 |\n| 1975 |\n| 1978 |\n\n\n\n\n\n专家们对我们的未来如何看？机器人专家丹尼拉·鲁（Daniela\
  \ Rus）希望拥有这样一个世界：无论人们处于经济阶层的什么位置，每个人都能拥有机器人。鲁是马省理工学院（MIT）计算机科学与人工智能实验室的主任，据报道她说，尽管机器人技术已经取得了重大进展，但这一梦想尚未实现。“但请记住，仅仅二十年前，计算仍然是少数专家的任务，因为当时的计算机体积庞大、昂贵且难以使用，”鲁说道。现在，每个人都在使用计算机，这本身就说明技术的进步已足以将人工智能带入世界。机器人技术仍处于婴儿阶段，但它们每天都在进步。今天，亚马逊有超过\
  \ 80,000 台机器人在其履行中心工作。尽管有这么多机器人为亚马逊工作，亚马逊的首席技术官并没有打算用机器人取代人类。“人类非常擅长创造性的解决问题、抽象和概括。而机器人非常擅长处理数字、提取数据、搬起重物以及精准移动。我们必须思考如何构建将这些组件的优势整合在一起的系统。”——泰·布拉迪（Tye\
  \ Brady）。\n\n来自 Neurala 海瑟·艾姆斯（Heather Ames）透露，他们正在与摩托罗拉解决方案（Motorola Solutions）合作，使用用于寻找失踪儿童的人工智能。警察制服上的摄像头将接收失踪儿童的描述，这样在孩子迷失时会有更多的人寻找他们。同样的系统也将用于寻找可疑包裹。Airware\
  \ 的巴迪·米奇尼（Buddy Michini）表示，无人机将能够帮助救援人员评估灾难性事件。“他们可以利用无人机获取发生情况的概述，并将[帮助]部署到，比如倒塌最严重的建筑处。”米奇尼还表示，Airware\
  \ 将他们的无人机派往意大利，帮助应对最近的地震。\n\n机器人甚至被放置在人体上，以增强人类必须使用的技能。这样做是为了让任何身体残障的人都能恢复他们可能丧失的能力。这些机器人的首次应用是在士兵身上，让他们在搬运超过\
  \ 100 磅物品时不会感到疲劳。该机器不会控制用户，而是会遵循他的动作。因此，如果他们正在越过崎岖的地形，它会将机器人和人类的力量结合，使其共同工作。\n\n\
  \n如今机器人已应用于医疗领域。它们如此精确，已经成为手术的极佳工具。机器人可以进行比人类操作干净得多的切口，一旦伤口愈合，从远处就无法看出来。医生不再需要担心切错位置或切入患者体内过深。机器人可以被编程在特定位置按特定深度进行切开。它们在推动医学发现和寻找未来可以帮助救命的新信息方面也提供了帮助。\n\
  \n机器人也出现在工厂中。它们被用于焊接汽车和零件。由于它们极高的精度和准确性，让它们的工作看起来就像是由专业人士焊接的一样简单。机器人伟大的一点是，它们也不会受到强光或焊接焊炬热量的干扰。因此，它们可以完成比人类更多的工作。唯一的缺点是，它们需要程序更新来保持运行并跟上最新技术。\n\
  \n机器人还被制用于家庭娱乐和休闲。人们可以购买各种类型的家用机器人套件。其中一些套件可以用来制作一个跟随线条或描迹线条的机器人。其他套件则可以用来制作一个可以判断自己是在地板还是桌子上，以及在撞到东西之前能走多远的机器人。这类机器人将配备光传感器和开关传感器。甚至有些机器人将用于清洁，例如吸地或为他人。宠物机器人将模仿宠物，同时为主人提供娱乐。这些宠物机器人可以翻滚、坐下并与你玩耍。\n\
  \n\n尽管人们如何认为，但机器人对我们的生活非常有帮助。以下是机器人今天在生活中帮助我们的一些方式：\n\n1. 机器人执行任务比人类更快，而且它们一致且准确。\n\
  2. 机器人宠物可以帮助遭受抑郁症的患者，并帮助他们保持活跃。\n3. 大多数机器人是自动的；因此它们可以在没有人类干扰的情况下移动。这意味着它们可以娱乐并执行对人类来说不安全的任务。\n\
  4. 机器人可以用于生产产品和组装汽车。在制造计划、汽车和施工设备的零件时，也可以使用机器人。\n5. 正在创造新的工作，让人来制造和修理机器人。\n6. 因为它们是机器，机器人不需要不需要工作。\n\
  7. 机器人可以处理恶劣环境。机器人的设计是为了让行星大气不会影响它们的性能，也不会影响它们的物理状态。它们可以在许多工作领域取代人类，甚至可以自我编程以更好地管理自己。\n\
  8. 机器人可以被程序化导航并到达地球中心。它们可以挖掘燃料并用于采矿。机器人还可以被程序化探索海底和其他人类无法到达的地方。人类的任何局限性，机器人都可以克服。\n\
  9. 机器人可以用于耗时且重复的任务。机器人不会感到无聊；因此，它们在工作时不会降低质量。它们还可以执行人类不应该做的危险任务。可以调整它们的时间和速度参数，以使其反应更快。机器人还可以不受那些对人类产生负面影响因素的影响。\n\
  10. 机器人可以不停止运行。它们可以在长时间不维护的情况下工作，这意味着它们的生产率高于大多数人类。\n11. 机器人手不会像人类手那样颤抖。机器人的活动部件比人类更小、更灵活。这使得它们成为医疗手术的选择。\n\
  12. 机器人的制造是为了能够在严酷的环境中工作，如太空、水下或火灾。当人类的安全受到质疑时，可以使用机器人。机器人还可以被制造成任何任务所需的尺寸。\n13.\
  \ 机器人的目的是完成人们不想完成的工作。许多机器人探测器被送到太空后从未回来。它们被设计得比人类强大。机器人甚至被用于战争，以消除人类面临风险。\n\n\n\
  当然，机器人也有自己的缺点：\n\n1. 机器人运行需要电力。\n2. 人可能会失去工厂工作，但即使被机器人取代，机器人也需要维护来保持运行。\n3. 创造和购买机器人将耗巨资。\n\
  4. 此外，机器人需要的程序和硬件以后将花费更多钱。\n\n\n\n\n## 2. 机器人可以在工厂中取代人类。这意味着人们将需要寻找新工作，或者必须接受重新培训以从事不同的工作。如果机器人在各个领域取代了人类，可能会导致高失业率，因为并不是每个人都能接受机器人维护的培训。\n\
  \n## 3. 如前所述，机器人需要维护和修修理，这需要花费费用。此外，由于工作需求可能会发生变化，它们的程序必须定期更新。机器必须被造得更智能。一旦发生故障，维修成本将非常高。这意味着必须恢复程序、找回丢失的数据代码，这不仅昂贵，而且耗时。\n\
  \n## 4. 机器人存储大量数据。然而，获取这些数据的难度将比从人脑中提取数据要大得多。机器人的设计是为了完成重复性任务，但它们不会像人类那样随着执行时间的变长而变得越来越出色。\n\
  \n\n## 6. 机器人并不智能，也没有感知能力。除非被设定为如此，否则它们无法改进自己的工作。它们不能思考或拥有情感。这严重限制了机器人协助或与人类交流的能力。\n\
  \n机器人不再仅仅是科幻小说；它们是真实的，存在于我们今天生活的的世界中。不，它们并不像我们看到的某些电影那样试图统治世界，而是与我们并肩工作，帮助改善我们的生活，并让我们能够改善服务对象的生活。以下你将看到机器人的一些现实世界应用，以及它们如何帮助我们的世界变得更好：\n\
  \n1. **仿生腿**：生物机电学是休·赫尔（Hugh Herr）正在进行的一项革命性工作，他是麻理工学院（MIT）生物机电研究小组的负责人。赫尔是一位双腿截肢者，他利用生理学与电机，为残障人士创造了仿生肢体。他的仿生成就包括用于大腿截肢者的自适应膝假体，以及用于步态异常的各种阻抗踝足外骨骼（也称为足垂，由脑性瘫、中风或多发性硬化症引起）。他甚至制作了自己的脚仿生腿，这是第一套足部和小腿系统。\n\
  \n2. **医院机器人**：Aethon 专注于医疗保健行业。通过使用自主移动机器人，他们帮助运输了衣物、临床用品和清洁产品等重物。此外，`TUG` 机器可以安全地移除有害废物。由于法规要求医疗中心必须追踪所有药物（特别是麻醉剂），Aethon\
  \ 机器人可以作为 `IOT`（物联网）场景的一部分传递药物。此外，所有药物上都有 `RFID` 芯片和条形码，使其能够实时跟踪药物。\n\n\n4. **停车场机器人**：Serva-TS\
  \ 的工作就像仓库叉车，它像洗牌牌一样在停车场内穿梭车辆。该系统运行在杜塞尔多夫机场，并通过改造可以获得 40% 的可用空间，从而使旧车库升级。\n\n\n6.\
  \ **协作机器人**：丹麦的优机器人（Universal Robots）向全球市场推出了一系列协作机器人。这些机器人是可编程的，旨在处理重复性任务，有助于人们释放出来从事更高级的活动。\n\
  \n7. **机器人喷漆机**：ABB 机器人推出了一系列机器人喷漆。`IRB 580` 有一个空心腕部，结构紧凑，是一种快速准确的喷漆机器人。这种机器人有助于提高生产率，并为喷漆公司提供更高的效率。\n\
  \n8. **协作**：KUKA 系统推出了协作机器人，旨在满足日益增长的市场。这种机器人具有用于安全的传感能力、简单的操作控制和更快的教学。这些机器人的几个应用包括检查、测试、测量、托盘化、加工和固紧。\n\
  \n\n10. **帮助人类的人形**：尽管这些机器人看起来像人并被认为是可爱的，但它们并不是为了做家务或娱乐而发明的。本田和丰田为身体残障或老年人创造了步行辅助设备。Cyberdyne\
  \ 的 `HAL`（混合辅助肢）系统是唯一可以帮助教大脑如何移动其所替代肢体的机器人设备。此外，医疗应用方面正在研发全身 `HAL` 系统，以在灾难恢复、恶劣环境或人类需要卓越力量和耐力的情况下，增强或保护人体。\n\
  \n一些专家支持使用机器人，而另一些则反对。此外，有些专家处于中立立场：\n\n1. **埃隆·马斯克**：埃隆·马斯克是一位亿万富翁和科技企业家，对于人工智能用于军事机器人的危险性，他一直在向公众发布警告。我们的社会正在快速采纳机器人技术，如果这些机器人不安全，将对我们的社会产生后果。但如果我们的机器人技术不安全，又有什么大不了的呢？\n\
  \n\n\n\n嗯，机器人基本上是会移动的计算机。因此，如果它们被黑客攻击，威胁将比台式计算机被攻击大得多。每当台式计算机被黑入时，黑客只能窃取信息并利用该系统攻击其他系统。然而，每当机器人被黑入时，它就可以被用来伤害他人甚至杀死他们，因为它可以移动。同时，一些机器人带有摄像头和麦克风，因为它们可以被用作间谍工具。仍有人认为这只会发生在电影或书籍中，但这些风险和威胁是真实的，已经有证据表明机器人曾伤害人类或破坏财产。\n\
  \n例如美国劳工部拥有一份机器人相关事件清单，这些事件导致了数十死亡。在过去的 14 年里，机器人手术在美国与 144 例死亡有关。2016 年，中国的一台机器人打破了玻璃窗户，并伤了站在附近的人。机器人拥有的智能、力量和功能越强大，威胁就越大。波士顿动力（Boston\
  \ Dynamics）发布过一段视频，展示机器人正在做杂技，以此展示公司的先进技术。现在，想象一下如果这项技术被黑了怎么办。如果一个具有这种强度和智能的机器人被黑入并收到恶意指令，会发生什么？话如此，友好机器人的安全性很容易被绕过，一个乐于助人且受信任的机器人可能会变得恶意并伤害财产或人员。\n\
  ## 2. 霍霍金\n超过 1000 名技术专家、研究人员和科学家写了一封信，对自主武器的危险性发出警告。这封信由苹果联合创始人史蒂夫·沃兹尼亚克（Steve\
  \ Wozniak）、斯蒂芬·霍金（Stephen Hawking）和埃隆·马斯克（Elon Musk）签署。\n\n这封信于 2015 年在一个国际人工智能会议上提交。它的出现是因为失控机器人是最近辩论的话题。在讨论禁止特定的自主武器时，联合国多个委员会对此进行了激烈讨论。科学专家一直试图禁止将不受人类控制的人工智能用于武器。他们甚至补充说，正如化学家和生物学家对制造生物或化学来源的武器没有兴趣，AI\
  \ 研究人员对制造 AI 武器也不感兴趣，不希望其他研究人员通过制造这些武器来嘲弄他们的领域。意识专家丹尼尔·丹内特（Daniel Dennett）、Google\
  \ AI 负责人德米斯·哈萨比斯（Demis Hassabis）以及 MIT 教授诺姆·乔姆斯基（Noam Chomsky）也支持了这封信。斯蒂芬·霍金教授表示，“受限于缓慢生物进化的人类无法竞争[人工智能]，并会被取代。”\n\
  \n## 3. 伊恩·皮尔森博士\n皮尔森博士是一位自诩的未来学家发明家，他声称 AI 将比人类智能十亿倍，而与之融合是我们的最佳选择。\n\n皮尔森说：“我们会训练[人工智能]变得像我们一样，训练它像我们一样感受情感，但它并不像我们。它会有点像《星际迷航》中的外星人——行动更聪明、更有计算性。它对人类毫无感情，将我们视为野蛮。所以，当它决定用它创建的病毒进行自己的实验时，它会把我们当成实验鼠。”这就是埃隆·马斯克所担心的！这也与我们讨论过的\
  \ AI 被黑入并用来对付用户有关。最后，这听起来像科幻电影里的情节，但它是可能发生的！这也是埃隆·马斯克花费数百万美元确保他正在监控所有机器人技术，以确保这种情况不会发生。\n\
  ## 4. 欧洲\n今年早些时候，欧洲正在考虑提供在自然权利责任方面更先进的机器人。这项提议提交给了欧洲最高监管机构——欧洲委员会。\n\n有 150 多位医学、伦理、法律、机器人和人工智能领域的专业人士参与了辩论。在寄给欧洲委员会的信中，这些专家表示，这项提议似乎并非受现实世界的影响，而是更多科幻小说的影响。反对提议的人认为，如果为先进机器人提供法律地位，将使其能够对其造成的任何损害承担责任。委员会发言人表示：“人工智能可以为我们的社会经济带来巨大利益……但它引发了一些问题，例如与人工智能对我们社会的影响以及工作的未来有关。”审查该提议的专家表示，这可能允许制造商、所有者和技术人员在机器人犯错时声称他们对机器人不负责。专家进一步认为，赋予机器人法律地位是不恰当的，这种想法要归功于今年早些时候发表的科幻小说和煽动性的新闻发布。在法国阿尔图伊瓦大学工作的机器人伦理专家娜塔莉·内韦雅万斯（Nathalie\
  \ Nevejans）是签署该信的专家之一。她说，机器人拥有法律地位不仅没有帮助，而且是不恰当的。机器人不可能离开人类操作的情况下成为社会的一部分，这在短期内不会改变。内韦雅斯被报道说：“法律人格将模糊人与机器之间的关系，使得立法者可以逐步转向向机器人授予权利。这在我们开发它们为我们服务的范围内将是完全适得其反的。”根据几位专业人士的说法，欧洲应该为人工智能和机器人制定规则，以促进创新并确保公民安全。然而，机器人主宰统治未来的愿景不应作为基础。这项提议是欧洲试图为未来做好准备的一部分。决议写道机器人需要向当局报告，而法律的编写方式则是机器人应该帮助人类并改善人类，而不是造成损害。然而，议会最终拒绝了这项提议，称如果机器人开始取代人类工人，那么它们的所有者必须缴纳税款或贡献社会成本。\n\
  \n## 5. 澳大利亚和加拿大总理\n数百名专家呼吁政府禁止具有决定人死能力的机器人武器化。\n\n\n\n\n\n领先的 AI 人物也向各自的总理递交了信，参加\
  \ 2017 年 11 月举行的某些常规武器公约会议。这些信还得到了斯蒂芬·霍金的支持，他在葡萄牙的一次技术会议上发出警告，称人工智能可能会毁灭世界。这些公开信的签名者包括渥太华大学的伊恩·凯尔教授以及墨尔本大学的提姆·鲍尔温教授。加拿大总理贾斯汀·特鲁多表示：“那些剥夺了在决定目标合法性和部署致命武力方面有意义的人类控制的致命自主武器系统，正处于清晰道德界限错误的一侧。”寄给加拿大和英国的每封信都强调，机器学习和人工智能带来的巨大进展已使得机器能够在没有人类干预的情况下独立执行复杂的操作。这些进步帮助了教育、交通、医疗和基础设施的许多改进。然而，积极的转型也将带来危险的后果，这些后果最终将要求高度的道德关注。正如机器人公司警告的那样，自主武器系统将成为战争革命至少三分之一的代表。因此，为了防止这种情况发生，为了禁止这些系统，寄给英国和加拿大的每封信都呼吁签署一项新的国际协议。每封信都总结道：“如果被开发，它们将允许武装冲突以比任何时候都更大的规模和比人类能理解的速度快快的速度进行。其致命的后果是，将由机器而不是人类决定谁生谁死。”加拿大外交部长将\
  \ 1996 年禁止地雷的《渥太华公约》与这项禁令进行了对比。完全禁止自主武器可能是不可能的。然而，如果所有国家共同努力，禁令将是有效的。“谈到禁令，我认为建立国际禁令是不可能的。它将取决于具体的国家，”阿比舒尔·普拉卡德告诉《新闻周刊》，“像俄罗斯、中国和伊朗这样的国家可能将国际禁令视为西方试图加强控制的尝试。如果这些国家不禁止它们，那么美国和加拿大等国家就会认为禁止杀手机器人是对其自身国家安全的威胁。”\n\
  \n\n机器人仍然被误解，这意味着关于它们将会有很多神话，因为人们会编造信息来帮助自己稍微了解机器人。在这一章中，我们将检查这些神话并让它们终结，这样你就不必对机器人继续好奇，从而离理解它们更近一步。\n\
  \n## 1. 机器人将夺走人类的工作\n\n每一家主要的物流和制造公司都认为，机器人将提高它们的运营效率以及在那里工作的人的生活质量。因此，每当涉及机器人时，人类将一直是业务的关键部分。制造业和物流公司的员工应该将机器人视为使用精密工具增强其产出的工匠，因为它们在完成所做的工作时创造了更大的满足感。`Tesla\
  \ Motors` 就是一家使用机器人执行对那里工作人员构成威胁的任务的公司示例。工人监督机器人的运行，并确保他们产出的工作质量符合标准并达到 `Tesla Motors`\
  \ 的预期。在 `Tesla Motors`，在装配线上工作的机器人正在胶合、铆钉和焊接汽车零件，同时还受到人类的监视。`Tesla` 的每位员工都可以为自己自豪，因为他们是制造业新时代的一部分，在这个时代机器人被用于革新。\n\
  \n\n现代家庭应用将是人们每天购买时毫不思考的几件家用硬件。这些设备中的每一件都得益于数十年的改进以及领域内开发的数百万设备，分摊了成本。同样的原理也适用于机器人。问题是，几乎每个机器人都需要专门化，并且需要成本昂贵的硬件。`actuators`（执行器）将是机器人需要的最的部件之一。这些\
  \ `actuators` 的价格并没有处理器或传感器的价格那样下降。例如，`Willow Garage` 的衍生公司工厂 `Perception`。在被 `Google`\
  \ 收之前，这家初创公司在识别和从集装箱中移除箱方面接近人类速度。尽管这个机器人系统使用了廉价的传感器，如摄像头或 `Microsoft` 制造的 `Kinect`\
  \ 设备，但机器人仍然需要一个昂贵的机器人手臂，并且必须由传统的 `actuators` 驱动。好消息是，在执行系统方面，我们很可能会看到很多创新。它将像降低电器价格那样降低机器人的成本。一个非常有前景的领域将涉及放置在关节上的传感器，这使得机器人能够以安全且经过计算的方式控制其运动。诸如\
  \ `卡内基·梅隆大学 (CMU)` 的派生公司 `IAM robotics`、`Redwood Robotics` 和 `Modbot` 这样的小组正在寻找独特的方法来减少机器人所需的电机、齿轮和传感器的数量并简化它们。通过这种方法，机器人的价格将大幅降低，这将有助于降低手臂的成本，而手臂最终将占据整个机器人的成本。\n\
  \n\n就像 `CNC`（计算机数控）机器一样，机器人是可编程的，机器人将通过调用新程序的过程从一个运行引用切换到另一个不同的引用。得益于精细的设计，可以通过末端激励将灵活性整合到整个系列零件中。如果完全必要，机器人可以更换它们的“手”，就像\
  \ `CNC` 机器可以更换完成工作所需的工具一样。传感器技术已经先进，使其能够简化零件的呈现。视觉系统可以识别和定位零件，并减少对手动工具的需求。力感有助于机器人进行调整，以完成需要精度的装配任务。更的机器人可以有效地处理中等量制造。制造机器人的编程和切换非常快，最终导致了高效的生产。\n\
  \n\n机器人是通过离线程序或示教器进行编程的。通过示教器，编写机器人程序的人将带机器人经过一系列步骤，在此过程中进行精细调整并存储每个需要存储的点。机器人随后将运行此程序，并在再次运行之前检查是否有碰撞。它将继续运行，直到编写程序的人对所教的动作感到完全满意，并且运行时没有任何问题。\n\
  \n离线编程意味着用户可以使用模型来完成和修改以后将被机器人使用的任何动作。模型对程序的响应程度将决定它在安装到机器人上后需要多少修改。\n\n\n\n\n\n\
  与商业和工厂环境中使用的其他机器相比，机器人的可靠性极高。机器人供应商给出的平均故障间隔为 62,000 次或更多，大约持续七年。机器人单元通常在包含所有低可靠性传感器的基础上，还会包含其他设备。然而，总的来说，专用自动化设备仍然比机器人单元复杂。\n\
  \n目前已经存在能够响应语音命令的机器人。然而，它们非常罕见，因为其实际应用场景有限。目前，通过编程和自动化控制来操作机器人更高效且更具成本效益。因此，归结底，这种说法听起来有道理，但目前并不实际。\n\
  \n### 7. 机器人是仿人而造的机器\n机器人的外观取决于机器人的来源。根据韦伯词词典（Merriam-Webster），机器人的定义是“一种看起来像人类并执行人类各种复杂活动的机器；也指：一种类似的但虚构的机器，通常强调其缺乏人类情感的能力。”\n\
  \n对机器人还有其他定义，但根结底，机器人的设计将是为了使其正在执行的工作更加高效。\n\n2015 年，斯坦福大学生物仿生与灵巧操控实验室的研究人员制造了一只壁虎机器人，它能拉起自身重量\
  \ 2,000 倍的物体，这相当于人类在陆地上拖着一头鲸鱼。\n\n当然，机器人会比人类更强，但这并不意味着它们没有人类灵活。瑞士瑞士联邦理工学院（Ecole\
  \ Polytechnique Federale）发明了一种机器人抓手，它可以携带自身重量 80 倍的物体，并且灵活到可以捡起一个鸡蛋或一张纸。这种抓手是首次使用静电吸附和传感器的设备，使机器人能够适应所处的环境。机器人开始执行各种精细的动作，使它们能够完成以前由人类的工作，而且执行过程中没有间歇。\n\
  \n### 9. 机器人很智能，但它们无法判断意图\n机器人的设计足够智能，取代人类每天的工作，预计到 2040 年，智能机器人的数量将超过人类。\n\nAI\
  \ 机器人的语音转录能力超过大多数专业转录员，它们还能比人类流行病学家更好地发现组织切片中的癌症。人工智能甚至正在创造能够自我学习变得更聪明的机器人！因此，相反，随着机器人变得越来越聪明并学习得越来越多，它们将能够学习意图并让自己变得比最初时更聪明。\n\
  \n### 10. 机器人可以学习，但不能自我进化\n正如你所看到的，机器人既强大又智能，但你可能认为它们无法进化。然而，你错了。\n\n一个挪威机器人在 3D\
  \ 打印下一代自己的同时学会了如何自我进化。奥斯陆大学的专家表示：“是人工智能程序——而不是人类——在创新新产品。”换句话说，因为技术在不断演进，这意味着将出现机器人能够自我进化，并比最初创建时更聪明。正如你所看到的，关于机器人的有很多流言已被证明是虚假的，还有许多其他流言仍然需要被拆穿。因此，仅仅因为你不了解机器人，并不意味着你必须对它们编造事实。在网上寻找你想了解的内容，比相信一个谎言并在论论你不擅的话题时让自己看起来像个傻瓜要容易得多。\n\
  \n\n\n\n\n机器人流程自动化也被称为 `RPA`，它正以业务流程自动化技术的形式迅速兴起，这种技术将基于机器人和人工智能运行的程序。在大多数传统的工作流自动化工具中，通常会有一个开发者创建一个完成任务所需的待自动化操作列表，并通过内部应用程序接口或\
  \ `API` 与系统后端进行连接。它也可以使用专用的脚本语言。\n\n而这种情况会有所不同，因为 `RPA` 系统将通过观察用户的行为来开发动作列表，并将它们放置在应用程序的图形用户界面中，随后通过直接在\
  \ `GUI` 中重复任务来执行自动化。这将消除障碍，使得自动化能够应用于某些可能不包含 `API` 的项目中。在技术层面，`RPA` 工具将具有一些在图形用户界面工具中常见的技术。这些工具可以对与\
  \ `GUI` 相关的交互进行编程，并且通常通过重复用户执行过的动作来实现。`RPA` 工具与其他系统不同，它们具备允许在多个应用程序运行之间及期间处理数据的功能。例如，当你收到一封附有发票的邮件时，可以提取这些数据并将其输入到跟踪财务状况的系统中。\n\
  \n\n`RPA` 被认为是一项重大的技术进步，正因为这种解决方案，它需要新的程序平台，以便在大型企业中使用时更加成熟、具有韧性、可扩展，甚至更加可靠。当你看到自屏幕抓取以来已经走了多远时，通过观察一个经常在学术研究中引用的例子，你可以更好地理解它。\n\
  \n用户使用的平台名为 `Xchanging`（总部位于英国的全球性公司，提供业务处理、采购服务和技术）有一个名为 `Poppy` 的拟人化机器人。从这个例子可以看出其天才水平以及使用的友好性，特别是在一些较现代的技术平台中。由于由于，用户可能不会将其视为一个假设的程序服务，而是一个实体或物体。得益于\
  \ `RPA` 无代码平台，这将是区分 `RPA` 与屏幕抓取的最大特征之一。\n\n\n托管 `RPA` 服务将符合程序机器人的比喻，即每个机器人动作都有自己的工作，类似于人类工人。机器人可以使用计算机上相同的控制控件来采取行动并执行任务。通常，这些动作发生在受控环境中，而不是显示器上，因为机器人不需要物理屏幕来查看其结果。相反，它将以电子方式解释结果，因此不需要显示在屏幕上。\n\
  \n如果这些现代解决方案无法进行大规模部署，那么它的可用性将受到限制，只能管理少数物理硬件和相关成本。在大型企业中实施 `RPA`，与更传统的非 `RPA` 解决方案相比，这帮助节省了大量资金。当然，`RPA`\
  \ 也有它的风险。批评意见包括抑制创造力的风险，甚至可能为现有的程序制造出更复杂的维护环境。\n\n\n当你查看《哈佛商业评论》以及他们对 `RPA` 的看法时，你会发现他们认为大多数运营小组将采用\
  \ `RPA`，同时向其员工承诺机器人不会导致导致业业。相反，工人将接受重新培训，以便他们能够花时间做更有趣的事情。根据一项学术研究，工人不应该觉得自动化是对其知识的威胁，而应将其视为同伴。在同一项研究中，你还可以看到，技术部署后并没有导致人数减少，反而提高了相同人数的生产力。\n\
  \n另一方面，一些分析师认为 `RPA` 对于那些外包工作的业务流程来说是一个风险。这将为那些被认为是熟练流程设计者的岸内人员创造高价值工作，但将减少海外低技能工人的可用机会。\n\
  \n\n已经进行了更多的学术研究，并预测 `RPA` 和其他技术进步将帮助开启一个生产力更高、方法更高效的新时代，造福全球劳动力市场。尽管如此，这些收益不能直接归功于\
  \ `RPA` 本。许多研究人员或协会认为，到 2035 年，所有工作的 35% 将被自动化。同时，`LSE` 论文作者 Willcocks 教授谈到了工作满意度和智力刺激的增加，这可以描述为技术让技术进步脱离人类。这种对机器人接管人类日常琐碎和重复工作的引用，让他们去做更有趣或更有意义的事情。\n\
  \n\n正如你在本章前面看到的，机器人流程自动化将使机器人能够自动执行任务，这样它们就不需要每天接受如何做某事的培训。这将帮助人类转向更有趣、更有意义的事情，从而提高所产品的生产质量。这将导致公司更多地关注售后和其他他们可能短缺的领域，因为他们现在有资源重新培训员工从事另一项工作。\n\
  \n\n\n\n\n\n移动机器人是能够移动的机器人。这些机器人通常被列为信息工程以及机器人学的一个分支。移动机器人可以在整个环境中移动，而不会被固定在某处。移动机器人可以是自主的，也可以是\
  \ AMR（自主移动机器人）。这意味着它们可以在没有人类或机电设备引导的情况下，在不受控的环境中导航。另一方面，移动机器人将依赖引导软件，这些软件使它们能够在受控环境中覆盖预设的路线。这类车辆被称为自动引导运输车（AGV）。相比之下，工厂机器人大部分是静止的，因为它们配合关节臂和抓取组件工作（它们也可以与末端执行器一起工作），这些组件由于固定在工作空间上，因此无法移动。\n\
  \n移动机器正在工厂和商业环境中变得日益普通。医疗中心已开始使用移动机器人，它们可以沿着预定路线移动人类工作人员无法搬动的沉重物品。仓库已开始安装移动机器人系统，以便将货物从货架高效地移动到订单履约区。目前的研究以及大多数大学通常集中在移动机器人上。安全和军事领域也使用了移动机器人。\n\
  \n家用移动机器人包括可以执行园艺或吸尘等家庭任务的娱乐机器人。移动机器人的模块将是控制器、控制程序、执行器和传感器。控制器通常是一个连接远程控制或笔记本电脑的微处理器。程序将是某种脚本语言，如\
  \ `C` 或 `C++`。传感器取决于为机器人设置的条件。这些条件包括处理能力、感知触碰的传感器、感知与物体距离的传感器、根据位置形成地图，甚至是避免碰撞，以及许多其他应用。\n\
  \n## 分类\n\n移动机器人分为以下类别：\n\n1. **它们运行的环境**\n    - 极地机器人的发明是为了跨越冰雪和充满深渊的气候区域。\n  \
  \  - 在陆地或家庭使用的机器人通常被称为无人地面车辆或 `UGVs`。它们通常在履带或轮子上移动，也可以涵盖带有腿的机器人。这些机器人由两条或更多腿组成。\n\
  \    - `AUVs`，自主水下器，是水下机器人的称呼。\n    - `UAVs`，无人机，是空中机器人的。\n\n2. **它们用于移动的设备**\n\
  \    - 履带\n    - 轮子\n    - 腿\n\n## 机器人导航\n\n1. **物理远程或遥控**：这种机器人是物理遥控的，驾驶员通过开关或其他远程控制设备对其下达命令。远程设备将直接插入机器人，或者作为笔记本电脑或其他操作手段的附件。使用遥控机器人是为了确保操作员的安全。几款远程手动机器人的例子是\
  \ Robotics Design 的 `Anatroller ARI-50` 和 `ARI-100`。还有 KumoTek 的 `MK-705 Rosterbot`\
  \ 和 Foster-Miller 的 `Talon`。\n\n2. **受保护遥控**：这种遥控机器人受到保护，可以检测并绕过障碍物，但在驱动时进行导航。手动遥控机器人可以与此进行比较。没有许多移动机器人仅提供受保护遥控（如果有的话）。\n\
  \n3. **循迹车**：它们会遵循嵌入天花板或地板或绘制的视觉线条。它们还会遵循铺在地板上的电线。许多此类机器人运行在基础算法，即“保持线条位于传感器中心”。这些机器人不会回避障碍物；相反，它们会停下来等待直到阻塞路径的物体被移除。你仍然可以购买循迹车，因为它们由\
  \ `Transbot`、`FMC`、`Egemin`、`HK Systems` 等多家公司生产。这类机器人在机器人协会中仍然流行，因为它们是学习机器人学的第一步。\n\
  \n4. **自主随机机器人**：具有随机运动的自主机器人即使感知到墙壁也会撞击墙壁。\n\n5. **自主引导机器人**：它们拥有关于目的地的小部分数据，以及到达目标或路线上需要停靠的任何地方的信息。得益于至少一种方法——传感器、视觉、全球定位系统、激光和\
  \ `Stereopsis`，可以确定机器人当前的位置。这些定位系统通常使用 `蒙特卡洛/马尔可夫` 定位、相对位置和三角测量来确定平台到达下一个目标路径的精确位置。这种机器人可以收集带有位置和时间标记的传感器读取。以\
  \ `PatrolBot` 为例。这种机器人作为保安，在紧急情况发生时向指挥中心发送通知，操作电梯并响应报警。其他自主引导机器人可以使用医院。计算机科学家 Ahmed\
  \ Elgammal 博士、生物学家 Simeon Kotchomi 博士和工程师邹庆泽博士在 2013 年帮助艺术家 Elizabeth Demaray 创建了一个能够为盆栽植物寻找水和阳光的自主机器人。\n\
  \n## 滑动自主性\n\n一些功能强大的机器人在一个被称为“滑动自主”的系统下结合了多个阶段的导航。大多数独立引导的机器人都有手动模式，例如医院机器人 `HelpMate`。`Motivity`\
  \ 自主机器人操作系统已用于 `MapperBot`、`SpeciMinder`、`PatrolBot`、`ADAM` 以及许多其他机器人，它们展示了从手动操作到受保护模式的各种自主范围。\n\
