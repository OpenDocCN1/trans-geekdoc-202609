    # 第 21 章 – AI 与社会信用体系


    虽然美国在 AI 研究方面可能处于领先地位，但大规模实施的大部分在中国。中国可以利用其庞大的人口不仅能产生大量的工程师，还能将任何类型的神经网络训练视为一系列多样化的挑战。正如我们在最简单的产品中看到的那样，中国人在面对拷贝更聪明的人已经做过的事情时并不感到羞耻，他们利用其极其廉价的劳动力进行尝试，制作出可运行的原型并将其盈利。


    事实上，美国大公司可能想进入中国市场，仅仅是为了从那源数据源中汲取，并利用劳动力对产品进行迭代，然后自然在中国政府的庇护下将产品推向美国市场。`Google`
    曾在 2006 年至 2010 年间作为首选搜索引擎进入中国市场，但由于极端的审查要求、黑客攻击、员工受审以及知识产权被窃而放弃了。2018 年，`Google`
    决定再次尝试，这让分析师们感到震惊，他们表示，如果可以的话，中国政府让网络环境变得更加敌对，因此一定有某些非常迫切的顾虑让 Google 如此渴望进入中国。


    ## AI 与劳动的时代


    根据 `Google 中国` 前总裁李开源博士的话，我们正在进入 AI 时代，在这个时代，“数据是新的石油，中国将成为新的沙特阿拉伯”，工人不会简单按 1:1
    的比例被机器取代——整个行业将自动化，依赖这些行业的人将失去权利。他要求进行某种形式的收入再分配，因为雇用 AI 的公司将轻松赚取数十，所以对他们征收额外税似乎是最自然的解决方案，但他反对媒体中介绍的通用基本收入（UBI）。


    李博士说，全球政府必须为公民提供“生活的意义”，而不仅仅是生存手段，并提到结果更多取决于人类满意度而非 0 和 1 的工作（例如保姆和老师）仍然不受自动化的威胁。例如，创意创作者（如作家和画家）在很长一段时间内也不必担心。


    李博士认为，对许多人来说工作是生活的意义，他们期望像祖先一样在 60 年的人生中保持同样的常规，因此将这些东西夺走不会让他们心情愉快。问题在于，我们已经把工人当作机器人：静坐好，填写这些电子表格，每天发送八小时邮件，所以将他们的工作自动化实际上是在帮他们忙。如果给他们提供一个自动填写电子表格的智能工具，让他们只需要复核结果，这样怎么样？这将免除公司的任何法律责任，因为仍然有人类参与，但工作产出可能会大幅增加，尽管整体质量会有所下降。在一个技术日益敌对的世界里，这些人将如何何生存呢？


    ## 社会信用体系 (SCS)


    事实证明，消费者保护法最薄弱的两个国家——美国和中国，是推动 AI 的国家，因为他们的被俘客户对于他们得到什么几乎没有话语权。这种共同点可以用来让中国式的通过
    `Facebook` 和 `Google` 等科技巨头进入美国，这些公司已经扩张到类似于主权国家的程度，除了它们在战争中无法被击败。


    中国的社会信用体系（`SCS`）就像一个巨大的游戏，不同的是得分低的后果意味着被切断政府基本服务，如教育和公共交通。什么会导致社会分降低？交通事故、谋杀、贪污以及与犯过其中任何行为的人有关。2015
    年的一个案例中，一位中国学生钟某某（音译）无法购买火车票或在大学入学，因为她的父亲在车祸中害了两人并自杀。系统录入的官方标签是某某“不诚”，但在四个月后她清除了了自己的身份。


    `SCS` 已经由中国版的 `Apple` 和 `Amazon`——`腾讯` 和 `阿里巴巴` 构建并测试，它将在 2020 年推向全国，届时公民所做的一切都将计入他们的评分。喝酒、过度玩游戏或仅仅是与错误的人在一起？`SCS`
    将考虑爱好、购买行为和健康习惯是否偏离了党设定的模范公民标准，并给出处罚：社会和经济孤立。


    唯一的问题是，正如我们在加拿大的隔离实验中看到的，那些措施会让人们激进并扭曲他们的现实感。`SCS` 背后的理念是，中国政府无法处理超过十亿可能拥有强大的人，因此不可信且最可能引起麻烦的人应该识别并逐渐挤出大城市，包括那些可能帮助他们重回那里的人。根据这一逻辑，`SCS`
    将奖励那些负责任的人，同时对危害自己和他人的人进行预惩罚。其他惩罚包括切断网络访问、无法获得住房贷款或工作机会以及吊销护照。在一个技术日益敌对的世界里，这些人将做什么来生存？

    '
