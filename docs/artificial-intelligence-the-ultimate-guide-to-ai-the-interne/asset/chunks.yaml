- raw: "Letters have also been sent by leading AI figures to their prime ministers\
    \ for the Conference on the Convention on Certain Conventional Weapons which took\
    \ place in November of 2017. These letters were also endorsed by Stephen Hawking\
    \ who, at Portugal’s technology conference, sent out a warning that AI could destroy\
    \ the world. Some of the signatures on these open letters included Professor Ian\
    \ Kerr from the University of Ottawa as well as Professor Tim Baldwin from the\
    \ University of Melbourne. Prime Minister Justin Trudeau of Canada stated, “Lethal\
    \ autonomous weapons systems that remove meaningful human control from determining\
    \ the legitimacy of targets and deploying lethal force sit on the wrong side of\
    \ a clear moral line.” Each letter sent to Canada and the UK highlighted that\
    \ the spectacular advances that have come from machine learning and  artificial\
    \ intelligence have led to machines being able independently to perform difficult\
    \ operations without human intervention.               These advancements have\
    \ helped lead to many improvements in education, transportation, health care,\
    \ and infrastructures. However, positive transformations are also going to have\
    \ dangerous outcomes, too, which are going to end up demanding heightened moral\
    \ attention. Autonomous weapon systems, as warned by robotic corporations, will\
    \ be the representative of at least 1/3 of the warfare’s revolution. So, to keep\
    \ this from happening, to ban these systems, each letter sent to the UK and Canada\
    \ is calling for a new international agreement. Each letter concluded, “If developed,\
    \ they will permit armed conflict to be fought at a scale greater than ever, and\
    \ at timescales faster than humans can comprehend. The deadly consequence of this\
    \ is that machines – not people – will determine who lives and who dies.” An international\
    \ ban on landmines, The Ottawa Treaty in 1996, and this ban were compared to each\
    \ other by Canada’s Minister of Foreign Affairs. Completely banning autonomous\
    \ weapons may be impossible. However, if all countries cooperate, the ban will\
    \ be effective. “When it comes to a ban, I think it’s impossible to have an international\
    \ ban. It will be country-specific,” Abishur Prakash told Newsweek. “Countries\
    \ like Russia, China, and Iran may see an international ban as an attempt by the\
    \ West to assert control. If these countries don’t ban them, then countries like\
    \ the United States and Canada would see a ban on killer robots as a threat to\
    \ their own national security.” \n\nChapter 3: Ten Myths about Robots Robots are\
    \ still misunderstood which means that there are going to be myths about them\
    \ because people are going to be making up information to help themselves understand\
    \ robots a little bit more. In this chapter, we are going to examine some of these\
    \ myths and put them to rest so that you do not have to continue to wonder about\
    \ robots, and thus, will be one step closer to understanding them. \n\n1.  Robots\
    \ will take jobs away from people : Each major logistics and the manufacturing\
    \ company believe that robots are going to improve the efficiency of their operations\
    \ and the quality of life for those that are working there. Therefore, humans\
    \ are going to keep being a key part of the business whenever it comes to robotics.\
    \ \n\nWorkers in manufacturing and logistics companies should look at robots as\
    \ craftsmen who use precision tools to enhance their output as they create greater\
    \ satisfaction when it comes to the job that is being done. Tesla Motors is an\
    \ example of a company that uses robots to do tasks that are going to be a threat\
    \ to the humans working there. The workers oversee the operations of the robot\
    \ and make sure that the quality of work that they are putting out is up to par\
    \ and is what is expected from Tesla Motors. At Tesla Motors, the robots working\
    \ on the assembly line glue, rivet, and weld automotive parts together all while\
    \ being watched by a human. Each worker at Tesla can be proud of themselves because\
    \ they are part of a new era in manufacturing where the robots are being used\
    \ to revamp. \n\n2.  Robots are expensive : modern day household applications\
    \ are going to be just a few pieces of household hardware that people purchase\
    \ every day without a second thought. Each of these pieces of equipment has evolved\
    \ thanks to decades of improvement and a million units in the field that have\
    \ been developed which has spread the costs out. The same principle is applied\
