- raw: 'Chapter 22 – Hacking AI The idea of hacking refers to having a cheap, scalable,
    and reliable way of introducing uncertainty into any computer system to produce
    an unexpected result. Because of how they are programmed, computer systems typically
    fail catastrophically when faced with unacceptable inputs. One example of this
    would be buffer overflow, which is when something like a text box on a website
    allows any visitor to input any number as age; a hacker can tinker with inputs
    until he or she finds such a strange number that it crashes the website or gives
    them total access to the backend. Usually being rushed to production, websites
    and software don’t check for all possible inputs or even restrict them because
    just getting things to run at all takes so much time and effort. At least after
    a hacking attack, the owner of the software or website will plug the hole, right?
    In computer systems that are large enough, the owner might not even have the resources
    or willpower to keep fixing these code loopholes, leaving the customers to fend
    for themselves. In cases where the system has been silently infiltrated in a way
    that doesn’t cause the customer to notice, the owner might even willingly ignore
    it and focus on those problems that might lead to a class action lawsuit. Like
    mentioned before, minimum viable product. In engineering terms, “hacking something
    together” would refer to taking a medley of various scraps and tidbits to create
    a useful tool or product that shouldn’t be possible. When it comes to hacking,
    the idea is to overcome an obstacle or solve a problem using less effort and resources
    a human would need to make that obstacle or problem. Applied to any area in life,
    hacking becomes a performance-centered mindset—how can this be made to work right
    now? There is no limit as to what can be used in hacking. Wherever the computer
    system is fortified with a human operator who is meant to double-check the system,
    a hacker can count on laziness or compliance. Depending on sensors used in IoT
    devices, those with darker skin tones could find themselves unable to use them.
    In one instance [\[42\]](#part0049.xhtml#a1X2) , a bathroom soap dispenser installed
    at Facebook’s headquarters  couldn’t recognize a black person waving his hand
    underneath it to drip soap but worked just fine when a white person did it. The
    workaround is to take a sheet of white paper towel and wave it underneath the
    sensor, after which it works as intended. This isn’t an intentional design flaw
    but an omission on the part of the engineers who built the soap dispenser. Dark
    skin absorbs more light while light skin reflects it, which confuses the sensor
    that measures the amount of light reflected into it. Engineers building the soap
    dispenser didn’t test for enough of fringe cases because they were most likely
    urged to rush the product out as soon as possible and also keep its cost low;
    increasing the range of skin colors the soap dispenser detects would likely make
    it cost more and err more often. We are likely looking at a future filled with
    slick, fancy, overpriced IoT devices that work only in a narrow set of circumstances,
    but at least it is just a soap dispenser, right? Sensors in self-driving cars
    could run the same fault as they fail to detect people with darker skin tones,
    thus smashing into them. One University of Georgia study analyzed by Metro.co.uk
    [\[43\]](#part0049.xhtml#a1W0) found that self-driving cars tend to err 5% more
    when dark-skinned pedestrians were introduced in the test. Simply put, when engineers
    create a neural network to detect objects and pedestrians, they use the most glaringly
    obvious examples that help them create a working product in the least amount of
    time, which means white people because they stand out the most. Investors have
    shelled out money and want to see impressive results right now, but as mentioned
    previously, neural networks are probabilistic. Vehicles currently require human
    drivers since no kind of software can react in a wide range of nuanced situations
    where a simple action or inaction can have fatal consequences, but at least we
    can assign blame to them. When a neural network in one such car finds itself in
    a completely novel situation, there is no telling what could happen with the Trolley
    Problem, a thought experiment in which a human has to make a split-second decision
    on whom to kill. The Trolley Problem essentially asks if a human should divert
    a speeding trolley to kill one person instead of five or do nothing, letting five
    people die. A self-driving car might have to make the  same kind of decision,
    but that one person would be the driver, and those five could be passers-by at
    a traffic light. When the self-driving car sees it can’t avoid a potentially lethal
    collision with a group of people, it could opt to ram the nearest barrier, likely
    destroying itself and killing its driver. Coupled with the Chinese social credit
    score, we can easily imagine a dystopian future where citizens are ranked according
    to their value to the society at large and then suicided when someone of perceived
    higher value is in danger. Hackers could simply wear blackface to reduce their
    chances of being seen by facial recognition software or detected by self-driving
    vehicles, becoming like ghosts or glitches ignored by the system. The real answer
    is that the acting human in a Trolley Problem situation should do whatever is
    necessary to save all the people, but nobody will blame him or her if they fail.
    Speeding trolleys would almost always be caused by a cascading failure of brakes
    and other safety mechanisms, which would necessitate investigation and revamp
    of those mechanisms—in short, a tragic event, such as that one would probably
    lead to better and stronger systems, not just a mechanical, binary decision to
    kill one or five people. In 1988, a runaway train crashed into a stationary one
    at the French Gare de Lyon station, killing 56 people. As detailed in a Seconds
    from Disaster episode [\[44\]](#part0049.xhtml#a1U9) , the combination of passenger
    haste, design failures, and driver mistakes on a train where brakes could be easily
    disabled by accidentally leaning against the wrong handle led to the third worst
    peacetime rail accident in France. It is a tragedy that happens once a century
    and was ultimately caused by human mistake, but self-driving vehicles would aim
    to eliminate humans from the decision-making process altogether, potentially leading
    to this kind of event happening once a day without any recourse. '
