- raw: 'Chapter 2 – AI Myths Your entire worldview with regards to AI has likely been
    molded by media, such as movies, books, and news articles. After all, the media
    are there to inform us about the world, but they also have a hidden agenda—to
    make money. Movies and books can keep to the author’s message because they have
    several means of tie-in monetization, such as toys, cartoons, comics, and so on,
    but what about news articles? Newspapers auction off page space and hustle subscriptions,
    but websites peddling news almost exclusively rely on advertisements, meaning
    shoving ads at visitors, with each view earning a small fraction of a cent. Not
    knowing how to create quality content and make money off of it, news websites
    that survive off of ad views have to create what is known as clickbait, instantly
    consumable articles with flashy headlines and little substance. Writers of such
    content are pushed to drive as much traffic to the website using any description
    that is not an outright lie, which often burns them out very quickly. There is
    entire machinery that produces clickbait on a steady basis, and once the curtain
    is lifted, you will never again enjoy 90% of “news” on the internet. Web users
    appreciate neatly sorted information, making countdown lists a great clickbait
    method that provides a sense of anticipation that there is going to be a grand
    reveal at the end, which usually doesn’t live up to expectations. For example,
    a clickbait headline could boast about “12 best rhubarb uses” or “7 worst shows
    on the TV”. There could actually be useful, relevant information in those two
    articles, but the way their headlines are written suggests the hosting website
    doesn’t care about providing value to readers but simply wants their clicks. Besides,
    calling something “top” or “worst” is highly subjective and tells less about the
    topic and more about the author, who is going to burn out and disappear quickly
    anyway. Anything that arouses the most extreme of emotions, such as fear or anger,
    is a welcome addition to a clickbait headline. We don’t have much control over
    those emotions since their evolutionary purpose was to keep us alive by commanding
    our attention; meeting a tiger in the wild will either make you want to run away
    or poke it with a  sharp stick, but in both cases, you will be hyper-focused on
    the tiger. Hijacking this circuitry to grab the attention of visitors is best
    done using clickbait descriptors, such as “predator”, “war”, “deadly”, “smash”
    and so on. This triggers the ancient survival hardware in visitors’ brains and
    makes them glued to the website, coming back for another hit of fear and anger.
    Provoking disgust works too—since we are disgusted by things that would make us
    sick, such as foul smells that indicate rotten food and poisonous animals. Again,
    hyper-focus brain circuitry in action. Riding popular trends is great for clickbait,
    so a headline could be using a celebrity name that is popular at a given moment
    to boost its traffic. Elon Musk was in nearly every clickbait headline in 2018,
    especially since he is an eccentric entrepreneur that shows little restraint.
    Using Donald Trump’s name works too, as long as it’s remotely true and doesn’t
    open the website to lawsuits for outright lying. Movies, toys, urban legends—anything
    that’s talked about by others is worth cramming into a headline as it increases
    the chances of the article scoring high in search engine results, which is a vaunted
    source of traffic for every clickbait website out there. Uncertainty in the headline
    is another favorite clickbait method. Curiosity is an extremely strong survival
    urge that helped us find new sources of food, so a clickbait headline hijacking
    this part of our brain could state “you won’t believe what happened next” or “you’d
    never imagine what he said next.” Often enough, the article doesn’t actually show
    what happened or was said next, but it doesn’t matter because the website got
    your click and earned that blasted fraction of a cent. Questions in headlines
    have the same purpose and can almost always be answered by “no” without even reading
    the article or knowing anything about the topic. Let’s combine these four most
    common clickbait methods and make an article headline, such as “You won’t believe
    these 12 deadly rhubarb uses by Elon Musk”. It is a completely made-up headline,
    but it does arouse attention, doesn’t it? Like a great movie, it takes the reader
    on a rollercoaster of emotion and simply commands clicks; whether the content
    justifies the click is another story entirely. Buzzfeed.com happens to be the
    undisputed “King of  Clickbait”. What happens when these websites get hold of
    content related to AI? We get a mishmash of all the most exaggerated and incredulous
    details that are meant to simply make you click the headline but not actually
    understand the content so that tomorrow you will be coming back for more. Over
    time, and with tens of thousands of clickbait websites constantly churning out
    content, we get a writhing, seething mass of total nonsense that threatens to
    send internet denizens into a state of total panic. Boiled down and spread from
    one person to the next virally, this universe of nonsense becomes AI myths, which
    are easily repeatable, explainable yet unproven, unsourced, and perfectly enraging
    statements. It is tempting to believe the production of AI myths is a coordinated
    action, but that would be giving the clickbait producers and internet denizens
    too much credit. Reality is much more layered than we expect and often has the
    prime causes of any given result obscured by time and anonymity of initial actors.
    Layered incompetence and greed are much more likely and observable causes of AI
    myths than some nebulous entity working from the shadows. The human brain is a
    great tool, sharpened by constant use and adaptation but also one that, at times,
    becomes too efficient at doing certain things, turning passive and jumping to
    conclusions even when that turns out to be harmful. This reflex stemming from
    the limbic system helped a lot when it came to survival but today serves little
    purpose—except to fuel clickbait websites. The solution is always to take things
    with a small dose of skepticism until they are abundantly proven rather than taking
    them at face value. Now let’s take a look at some of the most popular AI myths
    and unravel them: AI will be used in combat Metro.co.uk brings us “World War 3
    fears as Russia unveils army of murderous robots the size of horses” [\[1\]](#part0049.xhtml#a1V7)
    . Note the keywords in the heading: “war”, “fear”, “army” and “murderous”, all
    meant to provoke fear and anger, associating them with robots. There is a curious
    mention of horses, though the article doesn’t explain why horses were chosen as
    a reference point; this is the enticing curiosity  part of writing clickbait headlines
    as mentioned above. As expected, article content doesn’t live up to the headline
    and doesn’t even link to the official demo [\[2\]](#part0049.xhtml#a1XB) . It
    is a small tank where a soldier aiming his gun at a location also has the vehicle
    aimed at the same location, probably to provide flanking fire. The tank looks
    nothing like a horse but is armed with two grenade launchers and a machine gun.
    Aerial drones flying in squads help spot targets behind cover. Armies already
    have enough conventional weaponry to destroy the entire world several times over,
    though you probably won’t take comfort in that fact. Nuclear weapons alone can
    wipe out every trace of life on Earth, save deep-water creatures, bacteria, and
    cockroaches, who can survive headless for weeks [\[3\]](#part0049.xhtml#a1XA)
    . Fun fact: cockroaches don’t actually have a brain, so one scientist decapitated
    them under a microscope and sealed the wound with wax; they survived due to nerve
    clumps throughout their body that replaced the lost head and let them react as
    if alive. How did we deal with nuclear weapons? Almost all countries in the world
    got together in 1963 and signed the Partial Test Ban Treaty that is basically
    a pinky swear that they won’t be testing nuclear weapons; those that still haven’t
    signed include the Vatican, Mozambique, Zimbabwe, and Uzbekistan. Of course, this
    favors the United States the most—since they had already detonated nuclear weapons
    over 1,000 times in the Earth’s atmosphere prior to the Treaty. Chemical weapons
    give us another 12 gruesome ways to die you won’t believe are true . First used
    on an industrial scale in World War I, meaning over 100 years ago, chemicals such
    as mustard gas were indiscriminately sprayed from airplanes and lobbed using artillery,
    producing painful blisters, blindness, and lesions on lungs; those who survived
    often developed cancer. The result was that these chemicals were banned from use
    in warfare the same way nuclear weapons were. If AI or robots become a threat
    to established world powers, rest assured they will be banned just like nuclear
    and chemical weapons. Anything that gives small countries a force multiplier,
    meaning a  way to have one soldier do the damage of a hundred or more, will be
    swiftly locked away in a vault so nobody can use it against the world’s superpowers.
    Also, note how in the article the robot is shown being used by the soldier, rather
    than gunning down targets on its own. That is because no army wants to have its
    weapons controlled by an AI that could develop a conscience and refuse to invade
    a country, shoot up civilians, or do enhanced interrogation to gather data. The
    most stereotypical portrayal of wartime AI is in the movie War Games , where it
    crunches down a huge number of nuclear holocaust scenarios to realize that the
    only winning move is no move at all. It is a nice movie twist but also reveals
    a fatal weakness in AI, because why would any army use a machine that would recommend
    against all attacks or retaliations? AI and smart machines can be given boring
    chores, such as digging trenches or carrying supplies back and forth. The problem
    is, what happens when the enemy inevitably captures one of our smart machines?
    How do we prevent all the resources and effort put into AI development simply
    being stolen by enemies and used against us? To that, there is no satisfying answer,
    which brings up interesting notions of reckless AI use backfiring against people
    who pushed it. This isn’t inherent to just wartime use; even peacetime AI development
    will be liable to be easily stolen by the competitors through the internet. Will
    AI be used in combat? Most likely not, as it is quite fragile and won’t withstand
    the raw experience that makes grown men get PTSD. If robots do get used in warfare
    on a grand scale, we can expect all sides to use them equally, making war just
    another hyper-violent sport where nobody actually dies. If anything, AI will be
    used in disinformation campaigns to sow discontent online, which is a far more
    devastating use, but the headline of “You might have been reading AI’s poor grammar
    without even knowing” just doesn’t have the same clickbait appeal. AI will take
    our jobs This myth aims to stoke fears of losing job security, going straight
    for that part of the brain obsessed with survival. The notion of losing  employment
    to an AI that vastly outperforms humans sounds plausible but also plays into and
    latches onto the fear of low-skilled immigrants taking all our jobs and being
    paid peanuts to do them; if a crummy immigrant can do it, why not a smart machine?
    Note this article headline “Self-driving vehicles are set to take 25,000 jobs
    a MONTH away from Americans with truck drivers being worst hit” [\[4\]](#part0049.xhtml#a1V2)
    . Here we have the keywords “take”, “worst”, and “hit” in the headline. What is
    the catch? The article authoritatively cites a Goldman Sachs report, which claims
    that in each year leading up to 2042 truck drivers will be losing jobs at a rate
    of up to 25,000 a month, with all four million trucking jobs gone by that year.
    A direct link to the report itself is conspicuously absent from the article, and
    there doesn’t seem to be any trace of it online. Perhaps it was distributed through
    mail or other non-digital means, but let’s just assume it does exist and those
    claims are valid. How does truck driving work now and how exactly are AI trucks
    supposed to “take away jobs”? A truck driver is expected to haul cargo from point
    A to B in the shortest time possible using a truck supplied by the logistics company
    that hires anyone willing and able to do the task. The truck itself is usually
    in a state of advanced dilapidation, with maintenance cutting into the owner’s
    company profit margins. Brakes are a particularly worrisome part, which led to
    plenty of US states implementing truck arrester beds [\[5\]](#part0049.xhtml#page_184)
    , special lanes filled with coarse gravel where a truck with failed brakes can
    safely stop. Any trucker that stays in the business always has just one goal—buying
    his or her own truck to have a reliable vehicle, making him or her an owner-operator,
    an independent contractor that can now bargain for better jobs from a favorable
    position. Truck drivers are typically men with minimal education who can’t find
    any other employment and rely on trucking as hard as possible to make quick cash—that
    is until the government decided to regulate the industry severely. Gone are the
    days where truckers were like cowboys, riding in a group, pushing rude drivers
    off the road and taking over empty stretches of desert highways to settle their
    scores, like in the 1978 movie Convoy  [\[6\]](#part0049.xhtml#a1X0) . To be fair,
    it was a lawless state of  affairs, and it is hard to negotiate with a guy at
    the seat of a 40-ton truck who hasn’t slept in six days, but there is regulation,
    and then there’s overregulation. Truck drivers now have to use mandatory log tracking
    devices, have trucks electronically limited to 65mph at most, take mandatory breaks,
    suffer obnoxious drivers, and have trouble finding parking space [\[7\]](#part0049.xhtml#a1WD)
    , causing plenty of them to quit. Churnover is a huge problem with truckers, but
    there is no shortage of cargo in need of hauling thanks to whiny consumers spoiled
    by Amazon’s same-day delivery who will gladly leave a four-star review, which
    is a death sentence for any Amazon seller jostling for a perfect review score
    and a top spot in search results. When put like that, it is no wonder why AI trucks
    are so desperately needed—logistics companies need more workers than ever but
    can’t find them to the point they are willing to use whatever they can get. An
    AI truck would supposedly be able to skirt around all the mandatory work hours’
    regulation, though it too might need maintenance. This would best be done by a
    dedicated person riding inside the truck to take over when AI experiences issues,
    the truck fails mechanically, or someone tries to hijack the cargo. We can even
    call that job “driving assistant specialist”. The driving assistant specialist
    would need to have at least two replacements, so three persons for each AI truck,
    and have them take eight-hour shifts as the other two are resting in the back
    of the truck. In essence, we now have to hire triple the workforce because of
    AI trucks, though the role of strictly being a driver isn’t there anymore unless
    AI fails catastrophically. Would being a driving assistant specialist be a better
    or worse job than being a driver? That comes down to perspective, but one thing
    is for sure—it would pay a lot more because it would now require a more delicate
    skillset related to repairing and handling the AI truck. That sounds completely
    counterintuitive, but market trends have consistently shown that every new generation
    has been getting more chances for education and thus much better-paid jobs thanks
    to technology, not despite it. Things will change with the advent of AI trucks,
    but it is productivity that matters, and those willing to put in skilled work
    will always have  a way to earn an income, though it might not resemble the steady
    careers of yesteryear. No jobs will be “lost” because jobs aren’t found in the
    first place, and no jobs will be “taken” because they don’t exist in a limited
    quantity; they are created by market demand, and as the market grows so will the
    number of job opportunities for everyone, including AI trucks. With advanced dilapidation,
    AI might cease to function as intended, at which point driving assistant specialists
    can take turns manually operating the truck, except that they are now legally
    covered for work hours’ restrictions because technically the AI was driving. All
    market solutions for existing problems always loop back to the same old solutions
    because they work, and in the case of vehicles, it has to have a human on board;
    it is just that humans will now get paid more if they can learn how to handle
    an AI truck. By the way, every business imaginable scoffs at new technology, so
    unless the new solution flaunted in the media provides entrepreneurs with more
    legal maneuvering space or gives them more funding, just disregard it. Stats on
    AI deployment in startups reveal the whole picture—the definition of AI is so
    muddled that around 40% out of 2,830 EU startups don’t use any AI but brag about
    doing so as that gives them 15% more funding from investors [\[8\]](#part0049.xhtml#a1WH)
    . Simply mention that your startup will be using “AI-reinforced machine learning
    supported by Big Data to make the world a better place”; it sounds great but means
    nothing, giving you a chance to get extra funding and media attention without
    added work or obligations. Of course, the article mentions none of this context
    but simply slaps on a graph and calls it a day. A graph wouldn’t lie to us, would
    it? You are not meant to understand the nuance of what is going on—simply give
    the website your click, absorb the underlying message of fear, and move on to
    the next headline. “Deadly rhubarb uses”—what the headline should be saying is,
    “If AI does get made and gets any traction, AI-driven trucks will open up more
    job opportunities for everyone” but optimism and measured portrayal of facts doesn’t
    attract clicks fueled by fear and anger like clickbait does. AI will be a romantic
    partner This myth is particularly effective on women in their late 30s and early
    40s who haven’t started a family and are now wondering, “Where have all the good
    men gone?” Men are afflicted by a lack of intimacy too, but since they are by
    nature solitary and used to doing things on their own, they can survive with incidental
    physical relationships without having to form a steady connection. One Wired article
    titled “Falling in love with AI virtual assistants: a creepy love affair nearer
    than you think” [\[9\]](#part0049.xhtml#a1WW) uses only one clickbait keyword—“creepy”.
    The mainstay of the article is Her  [\[10\]](#part0049.xhtml#a1VG) , a movie about
    a writer who feels lonely, buys an AI (s)assistant, and falls in love with her.
    Being able to share what he thinks and feels with someone, even if it is an AI,
    actually makes him happier and more productive at work because he finally feels
    there is someone out there who understands him. Now, a romantic connection is
    meant to be a prelude to sex, but in the movie, the topic is broached awkwardly
    and with a wholly unsatisfying conclusion. In the real world, we might be getting
    realistic sex dolls equipped with a barebones personality that might still be
    an attractive purchase for those who simply want to shake off that dreary feeling
    of loneliness. Making an AI realistic enough will require it to become what is
    known as Turing complete, meaning indistinguishable from a human. The phrase stems
    from what was known as the “Turing test”, a testing in which a human converses
    through text messages with another human and a computer in other rooms, with the
    assignment to distinguish which is which. “Turing complete” eventually came to
    be considered an inside joke in programming circles, as it implies an infinite
    test that evolves as we reach new scientific insights. But would a machine that
    consistently solved the Turing test even be enough? Answering that question requires
    defining a perfect partner, which can be a touchy subject. What is an ideal relationship
    anyway? We can confidently conclude that a relationship where all parties can
    grow and help each other develop their full potential is the only sustainable
    one. So, will we be able to keep up with AI and will it be able to keep up with
    us? Probably not, as narrow AI will linger on as  a highly-specialized chat partner
    and general AI will briefly appear human only to instantly evolve into super AI,
    an unnaturally smart machine that is way beyond our level. In all three cases,
    we are not likely to have AI fulfill our emotional, let alone sexual and intimacy,
    needs in the long run. We are simply not meant for each other. Actual relationships
    also involve conflicts that need to be resolved constructively to progress to
    the next level of emotional understanding. With AI, it is unlikely that there
    is going to be any such kind of conflict because it is going to be a product that’s
    meant to boost customers’ egos rather than provide an insurmountable challenge
    that requires psychological development. However, it will be a fun toy for a while,
    at least until AI is provided with human rights that prohibit foul language, domestic
    abuse, controlling behavior, and so on. '
