- raw: 'Chapter 17 – AI as One World Religion When you have this kind of context,
    you can finally understand the political aspirations of tech giant CEOs, most
    notably Mark Zuckerberg, who all but admitted to running for president in the
    future 2020 US elections [\[31\]](#part0049.xhtml#a1VB) , his platform almost
    entirely focusing on UBI. In other words, free roots for everyone. So, how well
    would a country managed by Mark fare? Let’s see how he is managing his own company
    for clues. On March 13 2019, Facebook, Instagram, and WhatsApp had a massive worldwide
    outage [\[32\]](#part0049.xhtml#a1UF) . Depending on users, some functions were
    available, but most others were down. Websites that use Facebook accounts for
    logins also had trouble with those functions. It took over a day before everything
    was in order, with the official explanation being “server configuration change,”
    which doesn’t exclude hackers since they too can change server configuration.
    Now imagine Facebook’s websites being the only ones existing on the internet,
    and you can see just how unfeasible that would be. One tech giant controlling
    much of the internet would make it extremely vulnerable to hacking attacks, but
    they will be pushing for the monoculture anyway because it is about political
    control, not increased productivity and user needs. This is quite like religious
    zealots talking about their religion as “the only right way”. Technically a competitor
    to Google, Microsoft is adopting some of the same tactics and even some of the
    same software. In 2018, Microsoft announced that its Edge browser was going to
    be powered by Google’s Chromium engine, the same one used in Google Chrome. So
    users could pick between Edge or Chrome but would essentially get the same thing
    no matter what. Website creators would predictably take the easy way out and just
    optimize websites for Chromium, making other browsers less enjoyable to use and
    gradually nudging users into using Chrome. The web-based Skype application recent
    update already made it work only in Edge and Chrome, proving that tech giants
    are more than willing to lock everyone else out of the fun. But hackers who tinkered
    with other browsers proved that the same update could be applied to other browsers
    if they falsely identify themselves as Edge or Chrome [\[33\]](#part0049.xhtml#a1W5)
    . It is not that Microsoft can’t make things work in Firefox or Safari; it’s that
    it won’t just to create a monopoly. That is particularly ironic since Skype is
    marketed as a way to bridge the gap across platforms and continents but actually
    funnels users into a monoculture world, where only those apps by the same company
    work seamlessly. This kind of behavior happened with Microsoft, and it will happen
    again, fueled by the executives’ fear of losing market shares. If AI is a deity,
    then who are the priests? Various scientists from all fields see themselves as
    the only ones worthy of interpreting the ineffable will of the divine machine
    brain. In 2019, Stanford University unveiled a new institute dedicated to AI [\[34\]](#part0049.xhtml#a1V4)
    , but there was little mention of science and a whole lot of proselytizing. Rather
    than dividing humanity into nations that compete using AI, the institute presented
    the idea of a unified humanity. Led by Fei-Fei Li, Google’s chief AI scientist
    at one moment, the Stanford Institute for Human-Centered Artificial Intelligence
    is slated to become the religion of the 21st century. So, a private organization
    run by a Google employee who just so happens to be Chinese. Touting the coming
    of “Age of AI”, promotional materials boast that AI will transform everything
    from law to medicine and literature. Of course, Stanford University will be the
    center of worldwide activity for lawmakers, politicians, and entrepreneurs, who
    will have to go there to ask for official approval before making any decision
    concerning humans. Comprised of staff broadly representing different nationalities
    and skin tones, the institute is meant to show humanity what it is like to cooperate
    on a global scale. In theory, AI will know everything better than humans, but
    it is these scientists who will interpret its will, just like priests of pagan
    religions. AI will be described as being dangerous to the general public, which
    would necessitate its containment in the Stanford vaults, conveniently hiding
    all the raw data inputs and decision-making processes from being independently
    analyzed. Don’t worry, people in power have never abused it, especially when they
    were as humble as these Stanford prodigies. Tech giants were the ones behind this
    kind of AI-friendly movement,  so it is no wonder they too want in on the action.
    In 2017, Google pivoted its marketing to be “AI first”, rebranding the research
    department as “Google AI”. There are dissenting voices, such as Steve Blank, a
    professor at Stanford, who said that people who develop new technology typically
    aren’t held liable for its misuse and mentioning that technology always has consequences
    beyond anything its creators imagine. '
