    # Chapter 7 – Fighting Against Tech Giants


    With the advent of the internet, we now have at our disposal digital tools and
    methods to propagate information, which is what an AI uses to feed itself. A local
    economy could afford to adopt something like the steam engine at its own pace,
    but the emergence of AI will mandate that we restrict access to information and
    curb the growth of tech companies that recklessly seed our environment with uncontrollably
    growing services, which is what the European Union (EU) is already doing.


    The EU is fighting back against US tech giants, most notably by introducing sweeping
    legal frameworks intended to curb their influence in the EU market. As explained
    in one CNN article [14](#part0049.xhtml#a1VH), EU is dead set on breaking Google
    apart through fines and regulatory action. In March 2019, EU voted in a copyright
    directive [15](#part0049.xhtml#a1VJ) that contains the now-infamous `Article 11`
    and `Article 13`, which respectively mandate a news aggregator service to ask
    for permission or pay a license fee before linking to a news article and that
    content providers have to respect copyright at all times, not just when big companies
    ask them to.


    In short, `Article 11` and `13` all but explicitly name `Google News` and `YouTube`,
    both of which attach ads to someone’s content and make money by the truckload
    while paying a pittance to select content creators. How is Google supposed to
    scan hundreds of thousands of hours of video being uploaded round the clock to
    `YouTube` for copyright infringement? While Google does possess `ContentID`, a
    system for checking uploaded content against an established database of work belonging
    to major publishers, there is very little that can be done to apply `ContentID`
    before the video is uploaded, which is what Google would have to start doing.


    The main problem is that `YouTube` has grown way beyond what any company can handle,
    and it was perfectly on purpose by Google. YouTube was meant to be a massive siphon
    for information, the most comprehensive dataset in video form for training an
    AI in object recognition and trend analysis. YouTube videos also make money by
    having ads shown next to them, allowing Google to just keep expanding the infrastructure
    and pocket the difference without having to create any content at all. By the
    time you are reading this, it is likely that `YouTube` is not the same anymore,
    becoming fragmented or restricted for most users, which the EU regulators expected
    and planned for.


    Google won’t abate its data collection efforts and is likely to simply shift to
    some other data source, such as `IoT` gadgets. We all have smartphones, which
    can easily have `Google` apps baked into them, for which the EU has actually punished
    Google as it promoted a monopoly. But when it comes to `YouTube`, it is all about
    the tricky business of copyright. Legally, copyright owners have absolute rights
    to their content and can even pass them on to their progeny or sell them to any
    company. A copyright owner can rent or sell any part of his or her content while
    placing any restrictions imaginable on it for free or at a price. However, content
    gets remixed by the general public all the time, which makes copyright void since
    it only concerns exact copies, but that is determined through a lengthy and costly
    court process the copyright owner is all but guaranteed to win.


    The problem is that changing just 0.01% of copyrighted content doesn’t provide
    the same legal protection as changing 99.99% of it; copyright covers the exact
    expression of ideas but not ideas themselves. When Google got hold of `YouTube`
    and users started uploading enormous quantities of content, huge copyright owners,
    such as `Warner Brothers`, started rubbing their hands; Google was serving ads
    alongside the content, becoming liable for copyright infringement since it was
    making money off of copyrighted content.


    Solution? Create an automated system that reviews all uploaded videos and compares
    them to the copyrighted content database created by big companies that are eager
    to sue Google into oblivion if infringements continue. This `ContentID` flagging
    system has been shown as a spectacular failure, correctly recognizing copyrighted
    content only for as long as exact copies of big-brand content were uploaded. Once
    small content producers started recording and copyrighting noise, such as wind
    chimes, entire swaths of YouTube content got flagged for copyright infringement.
    In 2015, `ContentID` issued a copyright strike against a video that contained
    nothing else but a purring cat [16](#part0049.xhtml#a1WR), claiming the sound
    belonged to `EMI Music Publishing`. Technically, cat owner could sue Google and
    EMI for false copyright claims, but that is again another costly court process
    that nobody is willing to undergo, so things get settled by Google defaulting
    towards whatever benefits copyright holders.


    Scaled up, `ContentID` simply doesn’t work because it is tilted towards shielding
    Google from lawsuits, not making sure copyright owners or YouTube users get their
    needs met. There simply needs to be a human at the helm reviewing copyright claims
    and either approving or dismissing them; there is no conceivable way AI can ever
    take this duty over. YouTube alone has something like 3,000 hours of video uploaded
    every second, with no kind of support staff to review it all for copyright infringement
    and community guidelines adherence; it is relegated to the hive-mind intelligence,
    whether it’s humans or machines. Google tried introducing a model of `YouTube
    Heroes` as a way to incentivize users to essentially become unpaid content reviewers,
    which is, in theory, a good idea, but was mercilessly panned by all YouTube content
    creators as being tyrannical and exploitative.


