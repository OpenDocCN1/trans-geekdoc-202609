    # 第 8 章 – 开创性发明


    我们可以通过回顾开创性的技术发明，了解它们如何改变我们的业务模式和生活方式，从而推断 AI 将如何产生同样的影响。我们可以将内燃机视为标志二十世纪最重要的发明，它的动力来自化石燃料的使用。


    内燃机让我们以比以前更快的速度旅行，获得了前所未有的生产力和空闲时间。汽车很快变成了一种身份的象征，城市不得不为了容纳它们而扩张，铺平了耕地，并预留了大量的可用停车空间，以至于没有汽车几乎无法进行任何活动。


    内燃机还让我们拥有了运输货物的货车和卡车，为我们提供了难以想象的丰富，但也以非常明显的方式污染了我们的环境；只需看看任何现代大都市那无法穿透的雾霾即可。化石燃料本身是一个微不足道的污染源，但当它们被全球采纳、每个人都能买得起汽车时，它们开始了严重的污染。讽刺的是，它们也让每个人变得更富有，因此无法缩减规模并仅仅“少用”。我们摄的每一口食物都必须通过某种使用内燃机的运输工具到达，这意味着化石燃料和污染；由于狩猎采集的生活方式在城市中是不可能的，我们不得不吃任何现有的食物，长此以往导致了各种健康问题。


    富含化石燃料的沙特阿拉伯成为了全球权力中心，从一个牧驼人的帐篷城市变成了一个闪发发的大都市，负担得起建造从太空可见的人造群岛。美国引入了石油美元的概念，并强烈建议每个国家专门使用美元在市场上购买石油。这创造了对美元的高需求，而美元可以通过打印产生比美国市场自身能维持的得多的财富。与此同时，创造化石燃料替代品的尝试均已告失败，各国安装可再生能源（如风力发电机）只是痴人说梦；在大多数情况下，它们处于亏损状态，必须由纳税人资助。


    ## AI 集成的影响


    某个国家可能恰好拥有将 AI 物理上锚定在我们世界中的完美要素，突然使其变成一个“黄金国”。全球权力的转移将是瞬时的、地性的，而且由于核武器的存在，这种转移是出奇地和平的。AI
    一旦在我们的全球数字社会中达到足够的渗透率，可能会产生与内燃机相似的影响：更多的力量、更高的生产力、更高的地位和更多的空闲时间。


    我们确实为行人留了专用车道（人行道）并禁止汽车在上面行驶；我们也为汽车创建了专用车道（高速公路）并禁止路人在上面行走。在计算机术语中，人腿是城市基础设施中仍支持的遗留硬件，因此我们可能需要创建一个全新的基础设施层来容纳
    AI，而将普通的互联网和电话线留给人类。


    这甚至不是意志力或社会组织的问题；只需比较拖拉机与使用锄子和铲子的第三世界村庄的产即可。一台由人类驱动的机器就能轻松地完成 300 个男女妇女的工作，同时只产生极少的污染。不仅如此，拖拉机驾驶员坐在舒适的座椅上，驾驶室保护他免受日晒，因此耕田变成了一件愉快的事。


    ## 工作与监管


    AI 让人们失业的可能性有多大？就像我们没有听到任何人抱怨拖拉机夺走了村民所有肥美的耕作和除草工作一样，AI 不会消除现有的工作，但将自动化并加速我们以前必须花费大量时间和精力手动完成的某些简单、重复的家务。AI
    会让那些家务变得更加愉快，我们会很高兴终于拥有了它，但也存在过度依赖机器的问题，以至于我们忘记了使用大脑。


    注意在拖拉机的类比中，它仍然提到了“由人类驱动的机器”。这不仅仅是一个修辞或刻意为之的情况——在法律上，所有符合道路行驶标准的车辆必须由人类操作，即使在动物可以选择速度和方向的马车情况下也是如此。使用内燃机引擎的车辆在发生故障时，必须有人负责，这意味着它们必须注册、维护，且操作员必须持有特定的执照等。如果我们把马车夫与汽车司机进行比较，可以清楚地看到，马力的增加导致了更严格的许可规定。如果
    AI 最终成为一种家庭用品，每个人都像拥有智能手机一样拥有它，它们可能需要像美国某些州注册枪支那样对其进行许可注册。


