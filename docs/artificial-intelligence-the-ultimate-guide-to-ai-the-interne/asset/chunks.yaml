- raw: 'Chapter 6 – IoT Ecosystem Our businesses scale, but our ways of doing business
    don’t, which is why we have this push for automation and adoption of artificially
    intelligent systems. Countries and companies that adopt IoT will gain the upper
    hand, forcing everyone else to do the same. This opens companies and governments
    to hacking attacks thanks to the concept of the attack surface, wherein the more
    systems are networked together, the lower their overall security as a remote attacker
    can breach the weakest link to breach the entire network. The main advantage of
    IoT, as touted by producers of various robots it consists of, is being able to
    quickly make tiny decisions based off of data gathered through sensors or fed
    to it from some external source. For example, Roomba sweeps the floor while relying
    on its sensors to relieve you of having to stand by with a dustpan. Sounds good
    but the main disadvantage of Roomba is that it relies on regular maintenance,
    so now you are standing by with a screwdriver instead of a dustpan. What if we
    made a second Roomba that fixed the first one and let them work in tandem? We
    would obviously need a third Roomba with the ability to diagnose malfunctions,
    capable of overseeing the first one’s sweeping to detect when and why it broke
    and to send out the second one. The three Roombas would already be an IoT ecosystem
    that could work on its own without having to wait for sluggish humans’ input.
    If the three Roombas had to cover a huge area and communicated through a wireless
    connection, now we could employ a fourth Roomba working as a mobile router that
    would follow the trio around and position itself for maximum network performance.
    The problem then becomes that computer systems typically experience an exponential
    increase in attack surface with a linear increase in complexity. Anyone in the
    vicinity with the know-how to make and use an antenna could hack into our Roomba
    quartet and do with it as he pleases. So, now we could employ 55 Roombas with
    machine guns that gunned down everyone coming, but that wouldn’t solve the inherent
    weakness in the concept that undercuts any utility such an ecosystem might have.
    However, if our Roombas are in a closed system, such as a warehouse, that same
    weakness is  largely eliminated. By eliminating human interference, an IoT ecosystem
    allows robots to cooperate at speeds, coordination, and endurance well beyond
    what humans are capable of. Any humans present on the location would typically
    be just passive observers, without even having the ability to manually override
    the robots, which has so far happened with Google’s Waymo, a self-driving shuttle
    car that has no steering wheel or brakes. Tech giants envision the future in which
    homes, schools, and hospitals become the same kind of sterile environment for
    the AI, with humans showing ultimate respect and obedience. For now, Amazon is
    the one to be making that vision closest to reality. Amazon warehouses, also called
    “fulfillment centers”, are places where an IoT ecosystem is already enhancing
    the human workforce and might soon be replacing it; humans still pick items, sort
    and pack them, but those work positions are likely to become automated too, thanks
    to robots such as Boston Dynamics’ Handle [\[12\]](#part0049.xhtml#a1VX) , an
    ostrich-like robot that can move boxes on its own. Boasting a hard work tempo
    and strict conditions that tolerate no tardiness [\[13\]](#part0049.xhtml#a1WU)
    , these gigantic warehouses host robots that cart massive quantities of items
    by gliding along the special concrete floor and reading QR codes to navigate to
    their destination. Rollers and conveyor belts shuttle items left and right and
    it is all due to wanting to deliver that gift or order as soon as possible. The
    end goal is to have Amazon selling all products in the world to every customer
    at once; Amazon is actually losing billions of dollars on sales because it’s focused
    on growth, not making a profit. '
