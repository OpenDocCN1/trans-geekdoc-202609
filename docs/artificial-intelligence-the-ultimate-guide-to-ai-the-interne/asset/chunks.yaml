    ### 5. 机器人系统非常复杂，且程序难以维护

    与商业和工厂环境中使用的其他机器相比，机器人的可靠性极高。机器人供应商给出的平均故障间隔为 62,000 次或更多，大约持续七年。机器人单元通常在包含所有低可靠性传感器的基础上，还会包含其他设备。然而，总的来说，专用自动化设备仍然比机器人单元复杂。


    ### 6. 机器人会听从指令做任何事情

    目前已经存在能够响应语音命令的机器人。然而，它们非常罕见，因为其实际应用场景有限。目前，通过编程和自动化控制来操作机器人更高效且更具成本效益。因此，归结底，这种说法听起来有道理，但目前并不实际。


    ### 7. 机器人是仿人而造的机器

    机器人的外观取决于机器人的来源。根据韦伯词词典（Merriam-Webster），机器人的定义是“一种看起来像人类并执行人类各种复杂活动的机器；也指：一种类似的但虚构的机器，通常强调其缺乏人类情感的能力。”


    对机器人还有其他定义，但根结底，机器人的设计将是为了使其正在执行的工作更加高效。


    ### 8. 机器人力气大，但不灵活

    2015 年，斯坦福大学生物仿生与灵巧操控实验室的研究人员制造了一只壁虎机器人，它能拉起自身重量 2,000 倍的物体，这相当于人类在陆地上拖着一头鲸鱼。


    当然，机器人会比人类更强，但这并不意味着它们没有人类灵活。瑞士瑞士联邦理工学院（Ecole Polytechnique Federale）发明了一种机器人抓手，它可以携带自身重量
    80 倍的物体，并且灵活到可以捡起一个鸡蛋或一张纸。这种抓手是首次使用静电吸附和传感器的设备，使机器人能够适应所处的环境。机器人开始执行各种精细的动作，使它们能够完成以前由人类的工作，而且执行过程中没有间歇。


    ### 9. 机器人很智能，但它们无法判断意图

    机器人的设计足够智能，取代人类每天的工作，预计到 2040 年，智能机器人的数量将超过人类。


    AI 机器人的语音转录能力超过大多数专业转录员，它们还能比人类流行病学家更好地发现组织切片中的癌症。人工智能甚至正在创造能够自我学习变得更聪明的机器人！因此，相反，随着机器人变得越来越聪明并学习得越来越多，它们将能够学习意图并让自己变得比最初时更聪明。


    ### 10. 机器人可以学习，但不能自我进化

    正如你所看到的，机器人既强大又智能，但你可能认为它们无法进化。然而，你错了。


    一个挪威机器人在 3D 打印下一代自己的同时学会了如何自我进化。奥斯陆大学的专家表示：“是人工智能程序——而不是人类——在创新新产品。”换句话说，因为技术在不断演进，这意味着将出现机器人能够自我进化，并比最初创建时更聪明。正如你所看到的，关于机器人的有很多流言已被证明是虚假的，还有许多其他流言仍然需要被拆穿。因此，仅仅因为你不了解机器人，并不意味着你必须对它们编造事实。在网上寻找你想了解的内容，比相信一个谎言并在论论你不擅的话题时让自己看起来像个傻瓜要容易得多。


    '
