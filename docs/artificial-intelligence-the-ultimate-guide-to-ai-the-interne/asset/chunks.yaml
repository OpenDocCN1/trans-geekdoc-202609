- raw: 'Chapter 20 – AI and Ethics Images and X-rays could be analyzed by this medical
    AI, which could peer into the image down to the very last pixel to see the earliest
    signs and the possible spread of disease. For those with phobias and anxiety,
    virtual reality goggles could be supplied where an AI would walk them through
    the trauma and give them the right instructions on how to handle the situation
    down to the tiniest detail. When used with video call software, such as Skype,
    AI could analyze bedridden patients’ faces to read into their inner world better
    than any human could. There should be informed consent by patients, who should
    at all times be aware that they are speaking with a machine rather than a human,
    but seeing how major social networks have been confessing they literally spy on
    users, and nobody batted an eye, it is likely patients would go with the program.
    Doctors have much leeway in how they handle patients and might have to resort
    to extreme measures to handle extreme cases. It is not malice or arrogance but
    the need to be efficient and avoid emotional attachment to the patient, both of
    which are accomplished by going with the quickest solution, usually some form
    of prescription medication. However, doctors also have a code of ethics that can
    best be summed up as “first, do no harm”. What if an AI was required to do some
    sort of an extreme measure to save a patient’s life? Would AI then need the same
    code of ethics doctors have to stop it from going mad scientist on hapless patients?
    According to Stuart Russell [\[37\]](#part0049.xhtml#a1VK) , author of a book
    on AI, we are facing a future where smart machines absolutely have to be given
    a mandatory code of ethics as they can produce fake news to change our voting
    and spending behavior. They can already trawl social media to pick up on keywords
    to determine personality traits and then perform automated chatting, espionage,
    and blackmail. Stuart also created “Slaughterbots” [\[38\]](#part0049.xhtml#a1VM)
    , a dramatized video on how tiny drones could be used for assassination in preparation
    for his petition to ban autonomous weapons in front of the United Nations. Capable
    of avoiding lazy swats, the drone can literally dive-bomb a target, delivering
    three grams of explosives right at the center of the  forehead for instant death.
    While dramatic, the Slaughterbots video doesn’t explain how it is fighting off
    autonomous drones any worse than, say, fighting off swooping magpies that aggressively
    defend their nests during nesting season in Australia [\[39\]](#part0049.xhtml#a1VD)
    . Humans have been dealing with murderous animals, including deadly insects and
    rampaging predators, for millennia, but drones would also presumably be extremely
    vulnerable to something like a nerf gun or a super soaker. It is easy to imagine
    humans making a sport out of hunting down these assassin drones while using special
    goggles to see them and wearing headcams to stream this first-class entertainment.
    Well, that is what humans do. So, drones could have ethical behavior baked into
    their programming, and the government could oversee ethical standards just like
    it does electrical and engineering ones. Isaac Asimov already thought of the idea
    of robots having ethical rules, namely with his three laws of robotics that can
    be summed up as: 1) don’t hurt human, 2) obey human, and 3) preserve yourself.
    The problem arises when we think of traditional programming that ignores context
    and how AI could interpret any such ethical restrictions. If a human is taking
    a walk, should a smart machine forbid it because sunlight causes skin cancer?
    How about if a human wants to drive in a car or go skydiving? The question of
    ethical limitation can be posited as: how much power do we want machines to have
    over us? Too much and we are serfs in a prison of our own construction, so it
    appears that the answer is giving the machines enough consciousness to recognize
    when we are making bad choices but not enough power so they can stop us from making
    them. We want smart machines to be our advisors that will gather raw data, present
    it transparently, and crunch the numbers to a simple conclusion with such clarity
    that it stands up to every possible challenge but ultimately leave the choice
    to us. Even when they hurt, wrong choices typically lead to valuable lessons that
    last for a lifetime. '
