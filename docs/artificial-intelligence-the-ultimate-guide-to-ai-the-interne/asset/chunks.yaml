- raw: 'Chapter 16 – Tech Giants As Rulers of Society Imagine an ancient tribe of
    natives living in the jungle that survive mainly on roots they dig out of the
    ground using their bare hands. Everyone spends most of the day digging for roots
    under the auspices of a wise tribe elder, the most experienced root finder who
    also enforces a taboo , an unspoken communal rule, passed from time immemorial,
    that says tribe members must not use any tools. When one young tribesman makes
    a simple shovel and shows how quick and easy it is to find roots, the elder is
    worried—this directly challenges his position of power, and the tribe is starting
    to wonder if perhaps the young upstart should lead the tribe. So, the elder strikes
    a deal with the young tribesman: a special exception will be made in the taboo,
    allowing the use of a sacred tool in finding roots as long as the elder is the
    one wielding it; for the benefit of the tribe, of course. Further, the young tribesman
    will be given special honors for creating the shovel but must not challenge the
    taboo and must give a certain amount of roots he finds each day, so he doesn’t
    start thinking of challenging the elder. Without having a better choice, the young
    tribesman agrees, secretly plotting for the day he will finally get to lead the
    tribe and set his own rules. The tribe doesn’t care either way as long as the
    elder sanctions it and as long as they are kept fed and with enough time for leisure.
    All of a sudden, the tribe’s storeroom is bursting at the seams with roots. Everyone
    is given a task related to finding, processing, and storing roots, and they all
    get some root depending on the importance of their job and performance. Women
    have enough time to weave clothes from plants, and men get to make toys for children
    from rocks and musical instruments from wood. Life is good and easy. Naturally,
    the elder overseeing it all and handling the sacred shovel gets the best pick
    of roots. In a nutshell, this story explains how entrepreneurs challenge the established
    way of doing things but then get their work harnessed by politicians enacting
    laws and collecting taxes to power the economy and create prosperity for the entire
    tribe. The same story plays out even today, except scaled up and with countless
    tribe members having a say in how things get done by  voting. However, the fundamentals
    have remained the same—business success is offensive as it disturbs the established
    order of things and introduces uncertainty that upsets the tribe, which is why
    politicians haggle over the best way to control business success to get all the
    credit and make the tribe content. It all comes down to getting votes, and all
    politicians ultimately vie for votes in the same way a tribe elder would—by celebrating
    the strength of the tribe, promising plenty of root hunting opportunities, having
    full storerooms of roots for everyone, and providing pretty clothes for women,
    fun musical instruments for men, and great toys for kids. Entrepreneurs aren’t
    satisfied by these empty promises since their entire goal was fundamentally changing
    how the entire tribe leads its life; all they got were meaningless honors and
    tokens of appreciation. So, what do entrepreneurs want? A fundamental change for
    the better. Successful people would give everything they have to help out the
    disadvantaged and never again have to deal with panhandlers begging for change.
    Why, aren’t they the dreaded 1% who live in mansions and use secret Illuminati
    handshakes? Don’t they gloat at the misery and degradation of the common man?
    Not at all. Successful people know the recipe to success and can repeatedly achieve
    it, but even if they gave away everything , they wouldn’t be able to make an appreciable
    dent in overall poverty. Simply put, we have no idea how to fix things like generational
    poverty, where broken parents engender insecurity in their children through domestic
    abuse, making them drop out of school, develop anti-social behaviors, and become
    broken parents themselves. All the best scientists put together can’t figure out
    how to prevent the formation of psychopathic behavior, even if the warning signs
    are spotted in time. If little Johnny starts mutilating animals, there is a strong
    chance he will get into serious trouble as he enters his 20s, but no amount of
    intervention can halt or reverse this course of action. Attempts by sociologists
    to delay the formation of such a personality, for example, by putting Johnny in
    a pleasant environment with caring parents, have even been found to aggravate
    the problem. The best our society can come up with is to  wait for Johnny to start
    making problems and then put him in jail, meaning closed quarters with all the
    other ruffians and psychopaths, giving them plenty of free time to learn advanced
    tricks of the trade from one another. It appears personality is partly ingrained
    in the genetic code of each person and that the immediate sociological environment
    triggers the expression of an archetype, such as a warrior, poet or merchant,
    which is what Jung set forth as a fundamental psychological principle in his writings.
    We can’t stop the expression of behaviors, but we can put them to good use through
    capitalism. With the example of little Johnny, getting him employed as a butcher
    all of a sudden productively harnesses his destructive urges, gives him respectable
    employment, and makes him a valued member of the community. Ultimately, entrepreneurs
    all want to shape society, so everyone has a worthwhile job, but see politicians
    as the main obstacle. What if a certain group of entrepreneurs got together and
    started scheming how to displace politicians once and for all? By using technology,
    these upstarts would try to gather as much data on the behavior of the general
    public to understand how the mind works, why people vote the way they do, and
    so on. These tech giants would then try to create a digital nation populated by
    ethereal tribesmen, exact replicas of living people that would serve them without
    question, gloating at the imaginary clout they wield. All the warnings about AI
    taking jobs and governments needing to introduce UBI aren’t aimed at Joe Schmoe,
    truck driver, but at politicians who have no clue how technology works in order
    to make them yield to tech giants and acknowledge them as the ultimate tribe leaders.
    When a tech company announces their AI will take away jobs, they aren’t giving
    out a kind-hearted warning but are actually threatening politicians: “Our technology
    will take away your ability to get votes by harnessing our effort.” That is what
    it’s all about, control of the society through uncertainty, not merely having
    a machine that can climb stairs, move boxes, flip burgers, or fold laundry on
    its own. So far, AI has only proven itself useful in the narrowest sense of the  word,
    such as when crunching data from resumes, making simple mechanical motions or
    comparing images, but hasn’t come anywhere close to human intelligence. By the
    looks of it, AI won’t be coming near human intelligence in the next 50 years—save
    for some revolutionary discovery that would make computers a million times faster
    than they already are. Right now, AI is like a shovel that tech giants say only
    they are allowed to build, inspect, and use, and according to their words, it
    is the best shovel anyone could ever dream of, so the tribe elder might as well
    scurry off into the jungle and let them lead the tribe. Why would they ever lie? '
