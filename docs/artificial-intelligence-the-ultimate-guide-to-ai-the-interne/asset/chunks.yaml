    as a godlike entity. That doesn’t mean any of it would be actually true but simply
    that the owner company would market it that way to achieve total market penetration
    and exclude the competition under a literal accusation of heresy. The idea is
    that this kind of AI would be welcomed with open arms, as it could properly arrange
    every little thing we are doing in our daily life to make it better, provided
    we don’t interfere with it in any way. From finding perfect employment to predicting
    future crime and being the perfect partner for everyone, such an AI would, in
    theory, be able to run an entire metropolis like clockwork, fixing problems before
    they appear. Note that this is still science fiction, but every tech giant that
    wants more IoT devices in the open to gain more data feeds will sooner or later
    tout this kind of arrangement as inevitable and positive, with AI serving the
    role of a benevolent god. For some people, this is already the case. George Hotz
    is a true believer in AI and its ability to transform the future, despite already
    having a successful self-driving car venture and knowing the inherent limitations
