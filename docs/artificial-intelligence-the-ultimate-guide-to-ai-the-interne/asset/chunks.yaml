    AI is revealed: • present AI as a way to settle societal differences and make
    everyone equal, just like Facebook is already doing. To those who believe in capitalist
    ideas, AI should be presented as a way to increase productivity and personal wealth;
    to those who believe in religious concepts, AI should be presented as a benevolent
    “guardian angel” that’s in accordance with their religious teachings.  Concept
    of AI can be spun every which way to align with the ideals of all subcultures
    in the society the same way Facebook is a news source for some and a source of
    entertainment for others. • use IoT devices that constantly scan the environment
    and gather data to report everything back to the mothership regardless of what
    the user wants, which is what Alexa is already doing. Shamelessly invade everyone’s
    privacy through outright surveillance and create a detailed, thorough privacy
    policy that explains nothing and is buried deep within pages of legalese. This
    will create data feeds to help the company analyze user trends and sell off data
    to advertisers while minimizing legal liability. Any responsibility for the intrusion
    of privacy should always be placed on the user. • medical devices have to undergo
    extensive clinical testing, but medical wearables don’t (see Apple Watch that’s
    being sold as a watch while being a fully functional medical wearable). Therefore,
    the IoT hardware should be sold in the form of a ring, bracelet, or necklace under
    the guise of jewelry or an accessory while claiming to provide some intangible
    medical benefit to the wearer. Certain body implants are also excluded from clinical
    testing, such as earrings and nose piercings, so one potential avenue of revenue
    would be creating IoT versions of such jewelry that could be installed in outpatient
    procedures or tattoo parlors. • pharmaceutical companies typically have ironclad
    monopolies on the market, allowing them to deny competition from bringing down
    the prices of medication. Striking a deal with one such cartel may be coupled
    with giving IoT medical wearables the capability of injecting the wearer with
    a drug needed to control a chronic condition, preferably insulin to treat diabetes.
    Being mostly a lifestyle illness, diabetes disproportionately strikes minorities,
    which would allow the company to present itself as socially conscious, hide from
    negative publicity by claiming to “just want to help”, and reap tremendous revenue
    from programs intended to help minorities battle chronic conditions, primarily
    Obamacare. • IoT medical wearables should be designed based off of lessons learned
    from social networks to create a psychological addiction in users. Facebook, Instagram,
    and other social media notably use  visual and audio cues to trigger a short-lived
    burst of satisfaction and remind the user to stay focused. In the case of medical
    wearables, the goal would be to remind the user to keep the wearable on lest their
    peers shame them for not being able to receive the latest notification or another
    such reward cue. The IoT medical wearable should be presented as a status symbol
    and being “cool” or even award meaningless points for being worn, which could
    eventually include the social credit system (SCS). • minimize all expenses related
    to security and safety, the same way CloudPets has done by storing the recording
    of kids’ messages on an unsecured Amazon cloud. Where possible, use the cheapest
    materials, freelance programmers, and open source software to cut down on development
    expenses. This will also lead to medical wearables quickly being damaged and outdated,
    necessitating another purchase by the user. When inevitable hacking attacks and
    security issues occur, spin the event as inconsequential and accuse whoever revealed
    the problem as being a Luddite and a rabble-rouser. • vaccines give resistance
    but not immunity to disease and represent medicine that can be infinitely sold
    to a healthy person monthly or yearly. Pharmaceutical companies have near total
    immunity from lawsuits when it comes to vaccines, meaning they can fail without
    the customer having any legal recourse. In case that happens, the pharmaceutical
    company can earn extra profit by selling the medication for the disease its vaccine
    was meant to prevent. All of this is possible thanks to “minimum viable product”,
    the concept of producing just what makes the company legally shielded from false
    advertising lawsuits. This is a fairly common concept that exploits impulsive
    purchases, availability of funds in the Western world, and overall apathy of consumers
    when it comes to researching products and services before spending money on them.
    To be fair, customers can organize a class action lawsuit to recover damages,
    but the idea is to make as much money as possible before that and then weather
    the consequences. Any complaints about lacking functionality can be easily deflected
    by simply producing  another model of the same product that is marginally better
    or offering a premium version at a much higher price. As you can clearly see,
    the US market is ripe for the taking by anyone who wants to invest a little bit
    of time and effort in creating just the perfect kind of AI product to strike all
    the right chords. Racial tension, burgeoning healthcare costs, growing wealth
    divide, pharmaceutical monopolies, and centralization of power in megacities are
    already happening, so why not profit off of them while taking total control of
    the market? The AI doesn’t even have to exist at the backend of this IoT medical
    wearable, but as long as users think there is or at least they aren’t explicitly
    told there isn’t, it is all kosher. Passing off AI as a religion might even qualify
    the tech company for some legal protections, most notably those related to religious
    freedom of speech and taxation. The reason why these shenanigans are allowed is
    that US legislators figured out they can use US-based companies as an extension
    of military force to conquer the world economically. Why invade China if the Chinese
    adore iPhones and keep buying them, sending money to the US while letting a US-based
    AI analyze their private data? On the other hand, China might attempt something
    similar with Chinese hardware, most notably routers. Speaking of which, do you
    know who made your internet router? In all likelihood, it was a Chinese company
    who might have installed a backdoor, hidden access point for those in the know.
    Militarily, the world is in a stalemate, which made superpowers organize blocs
    that vie for economic supremacy. The EU is one, as are the two Americas. China
    and Russia are eyeing India and Africa while poor Australia is left to fend for
    itself. Whoever reaches general AI first will be rocket-boosted into the new Golden
    Age of prosperity, with everyone else lagging behind. For now, each bloc has different
    strengths and leverages them differently in this global game of Monopoly. Rare
    earth minerals are what is going to be powering the AI revolution the same way
    lithium, one in Li-ion batteries, has been crucial to creating minute batteries
    used in smartphones and tablets. Current materials are insufficient for powering
    the general AI, so  keep an eye out for the discovery of one such mineral that
