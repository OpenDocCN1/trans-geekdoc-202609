    answered by “no” without even reading the article or knowing anything about the
    topic.


    Let’s combine these four most common clickbait methods and make an article headline,
    such as “You won’t believe these 12 deadly rhubarb uses by Elon Musk”. It is a
    completely made-up headline, but it does arouse attention, doesn’t it? Like a
    great movie, it takes the reader on a rollercoaster of emotion and simply commands
    clicks; whether the content justifies the click is another story entirely.


    Buzzfeed.com happens to be the undisputed “King of Clickbait”. What happens when
    these websites get hold of content related to AI? We get a mishmash of all the
    most exaggerated and incredulous details that are meant to simply make you click
    the headline but not actually understand the content so that tomorrow you will
    be coming back for more. Over time, and with tens of thousands of clickbait websites
    constantly churning out content, we get a writhing, seething mass of total nonsense
    that threatens to send internet denizens into a state of total panic.


    Boiled down and spread from one person to the next virally, this universe of nonsense
    becomes AI myths, which are easily repeatable, explainable yet unproven, unsourced,
    and perfectly enraging statements. It is tempting to believe the production of
    AI myths is a coordinated action, but that would be giving the clickbait producers
    and internet denizens too much credit. Reality is much more layered than we expect
