    \ learn. “It is proven that the more data you give to a machine to learn, the\
    \ more accurate the machine gets at predicting things,” Chappell said about the\
    \ complexity of how machines learn. The more complex the learning is, the more\
    \ data requirements there are going to be. Therefore, the more a computer learns,\
    \ the more data requirements are going to be put into place.\n\nWhen it all comes\
    \ down to it, “artificial intelligence is around us everywhere,” Ms. Diane Bryant,\
    \ `Intel Data Center Group`’s General Manager and Executive Vice President, said.\
    \ “It is transforming the way that people engage with the world.”\n\n## Conclusion\n\
    \nThank you for making it through to the end of Robotics. It should have been\
    \ informative and provided you with all of the tools needed to achieve your goals,\
    \ whatever they may be. The next step is to use the knowledge that you have gained\
    \ here and either move on to learn more about robotics or to decide if you want\
    \ robots in your life or not. Not all robotics are evil, but it is up to you to\
    \ do the research and figure out if it is something you want to risk or not. Robotics\
    \ is in our lives everywhere, and as technology continues to develop, there is\
    \ a chance that you will see robotics in your life even more. However, at the\
    \ same time, with the advances that we have seen in technology, there is a chance\
    \ that we will see the risks listed in this book not come to fruition.\n"
