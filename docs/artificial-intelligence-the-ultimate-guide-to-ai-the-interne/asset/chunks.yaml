    专家们对我们的未来如何看？机器人专家丹尼拉·鲁（Daniela Rus）希望拥有这样一个世界：无论人们处于经济阶层的什么位置，每个人都能拥有机器人。鲁是马省理工学院（MIT）计算机科学与人工智能实验室的主任，据报道她说，尽管机器人技术已经取得了重大进展，但这一梦想尚未实现。“但请记住，仅仅二十年前，计算仍然是少数专家的任务，因为当时的计算机体积庞大、昂贵且难以使用，”鲁说道。现在，每个人都在使用计算机，这本身就说明技术的进步已足以将人工智能带入世界。机器人技术仍处于婴儿阶段，但它们每天都在进步。今天，亚马逊有超过
    80,000 台机器人在其履行中心工作。尽管有这么多机器人为亚马逊工作，亚马逊的首席技术官并没有打算用机器人取代人类。“人类非常擅长创造性的解决问题、抽象和概括。而机器人非常擅长处理数字、提取数据、搬起重物以及精准移动。我们必须思考如何构建将这些组件的优势整合在一起的系统。”——泰·布拉迪（Tye
    Brady）。


    来自 Neurala 海瑟·艾姆斯（Heather Ames）透露，他们正在与摩托罗拉解决方案（Motorola Solutions）合作，使用用于寻找失踪儿童的人工智能。警察制服上的摄像头将接收失踪儿童的描述，这样在孩子迷失时会有更多的人寻找他们。同样的系统也将用于寻找可疑包裹。Airware
    的巴迪·米奇尼（Buddy Michini）表示，无人机将能够帮助救援人员评估灾难性事件。“他们可以利用无人机获取发生情况的概述，并将[帮助]部署到，比如倒塌最严重的建筑处。”米奇尼还表示，Airware
    将他们的无人机派往意大利，帮助应对最近的地震。


    机器人甚至被放置在人体上，以增强人类必须使用的技能。这样做是为了让任何身体残障的人都能恢复他们可能丧失的能力。这些机器人的首次应用是在士兵身上，让他们在搬运超过
    100 磅物品时不会感到疲劳。该机器不会控制用户，而是会遵循他的动作。因此，如果他们正在越过崎岖的地形，它会将机器人和人类的力量结合，使其共同工作。


    ## 机器人技术的现状


    如今机器人已应用于医疗领域。它们如此精确，已经成为手术的极佳工具。机器人可以进行比人类操作干净得多的切口，一旦伤口愈合，从远处就无法看出来。医生不再需要担心切错位置或切入患者体内过深。机器人可以被编程在特定位置按特定深度进行切开。它们在推动医学发现和寻找未来可以帮助救命的新信息方面也提供了帮助。


    机器人也出现在工厂中。它们被用于焊接汽车和零件。由于它们极高的精度和准确性，让它们的工作看起来就像是由专业人士焊接的一样简单。机器人伟大的一点是，它们也不会受到强光或焊接焊炬热量的干扰。因此，它们可以完成比人类更多的工作。唯一的缺点是，它们需要程序更新来保持运行并跟上最新技术。


    机器人还被制用于家庭娱乐和休闲。人们可以购买各种类型的家用机器人套件。其中一些套件可以用来制作一个跟随线条或描迹线条的机器人。其他套件则可以用来制作一个可以判断自己是在地板还是桌子上，以及在撞到东西之前能走多远的机器人。这类机器人将配备光传感器和开关传感器。甚至有些机器人将用于清洁，例如吸地或为他人。宠物机器人将模仿宠物，同时为主人提供娱乐。这些宠物机器人可以翻滚、坐下并与你玩耍。


    ## 机器人技术的优势


    尽管人们如何认为，但机器人对我们的生活非常有帮助。以下是机器人今天在生活中帮助我们的一些方式：


    1. 机器人执行任务比人类更快，而且它们一致且准确。

    2. 机器人宠物可以帮助遭受抑郁症的患者，并帮助他们保持活跃。

    3. 大多数机器人是自动的；因此它们可以在没有人类干扰的情况下移动。这意味着它们可以娱乐并执行对人类来说不安全的任务。

    4. 机器人可以用于生产产品和组装汽车。在制造计划、汽车和施工设备的零件时，也可以使用机器人。

    5. 正在创造新的工作，让人来制造和修理机器人。

    6. 因为它们是机器，机器人不需要不需要工作。

    7. 机器人可以处理恶劣环境。机器人的设计是为了让行星大气不会影响它们的性能，也不会影响它们的物理状态。它们可以在许多工作领域取代人类，甚至可以自我编程以更好地管理自己。

    8. 机器人可以被程序化导航并到达地球中心。它们可以挖掘燃料并用于采矿。机器人还可以被程序化探索海底和其他人类无法到达的地方。人类的任何局限性，机器人都可以克服。

    9. 机器人可以用于耗时且重复的任务。机器人不会感到无聊；因此，它们在工作时不会降低质量。它们还可以执行人类不应该做的危险任务。可以调整它们的时间和速度参数，以使其反应更快。机器人还可以不受那些对人类产生负面影响因素的影响。

    10. 机器人可以不停止运行。它们可以在长时间不维护的情况下工作，这意味着它们的生产率高于大多数人类。

    11. 机器人手不会像人类手那样颤抖。机器人的活动部件比人类更小、更灵活。这使得它们成为医疗手术的选择。

    12. 机器人的制造是为了能够在严酷的环境中工作，如太空、水下或火灾。当人类的安全受到质疑时，可以使用机器人。机器人还可以被制造成任何任务所需的尺寸。

    13. 机器人的目的是完成人们不想完成的工作。许多机器人探测器被送到太空后从未回来。它们被设计得比人类强大。机器人甚至被用于战争，以消除人类面临风险。


    ## 机器人技术的缺点


    当然，机器人也有自己的缺点：


    1. 机器人运行需要电力。

    2. 人可能会失去工厂工作，但即使被机器人取代，机器人也需要维护来保持运行。

    3. 创造和购买机器人将耗巨资。

    4. 此外，机器人需要的程序和硬件以后将花费更多钱。


    '
