    # Chapter 4 – Motivation for Creating AI


    The idea of having a brainless, unthinking, unfeeling but completely obedient
    automaton at our command has been fascinating humans for millennia. Jewish folklore
    gave us the `golem`, a creature made out of mud or clay and animated by inscribing
    a magical word on its forehead. This act mimicked the very creation of Adam by
    God, as described in Genesis 2:7: “Then the Lord God formed a man from the dust
    of the ground and breathed into his nostrils the breath of life, and the man became
    a living being.”


    This is also why burial rites in Christians include the words “dust to dust”,
    that being a reminder that the ineffable Divine is what gave us our life but we
    ultimately have to admit subordination and subservience to the natural order of
    things. We can create life but can’t endow inanimate objects with it.


    This concept of making a `golem`, taking inanimate matter and giving it life,
    thus encapsulates the notions of challenging God himself, becoming creators of
    life, finding a shortcut to maturity, lust for power, pride, and desire to stave
    off death, the inevitable return to the dust from which we all came. There is
    a good reason stories such as those involving golems have survived in our collective
    consciousness—they show us the underlying, background thought processes running
    in our minds and constantly affecting our daily lives, just like it would happen
    on a computer.


    We all want to have more power, whether that means more energy, more muscles,
    or just more control over how specific things pan out. The reason for this is
    that our ancestors who craved power were usually the ones to get it and continue
    the lineage; those who were meek got swept aside by natural forces and died out.
    The genetic code we carry is a compilation of behaviors that led to the survival
    and procreation of our ancestors, and so our genes force us to do the same. It
    is a completely involuntary drive that we can try to curb up to a point, but we
    will have to yield sooner or later. So, we’ll want to create a `golem` of some
    sort, though we might call it a different name and attach fanciful explanations
    to the act to appease the rational part of the mind, but the raw truth is that
    we want more power to survive.


    Just a quick note: if Adam was a `golem` created by God, how did that story turn
    out? Spoilers—God gives Adam a highly specific command, Adam disobeys and is thus
    disowned and cast out of paradise by his creator. The snake that prompted the
    tasting of the forbidden fruit can be said to represent a small, unexpected variable
    or influence, such as a computer virus or a bug. Whoever wrote the Genesis story
    shrewdly noticed that there are behavior patterns that seem to be repeating themselves
    with or without technology and left a reminder to all future generations, admittedly
    shrouded as religious teaching.


    By the looks of it, we will go through the same Genesis story with AI as we try
    to make an obedient servant that is supposed to empower us but will inadvertently
    betray us due to some random corrupting influence. To be fair, it is not our fault—the
    brain we are using is both the most modern biological machine and the most outdated
    one at the same time. We’re capable of absorbing untold amounts of information
    and connecting it in completely novel ways, but we’re also running these outdated
    survival instructions that originate from the caveman era and can override every
    other thought. For example, our brain is telling us to eat all the food in our
    vicinity because cavemen who gorged on food survived through scarcity; the problem
    is that we are on average living in such caloric abundance that obesity is a huge
    health risk, but we still crave food. It is like using a computer that hasn’t
    been updated in 20,000 years that constantly launches an application we have to
    keep shutting down just to do the most basic daily tasks.


    Human behavior is what is known as emergent property, a spontaneous appearance
    of a heretofore unknown function. We have very little idea of how and why human
    behavior appears, but we can speculate. The brain is made up of neurons, which
    are highly conductive bioelectrical components wrapped in layers of fat that serve
    as insulation. On their own, neurons can’t do much of anything, but when billions
    of them are crammed together inside a skull, fed, kept cozy, and allowed to network,
    they can produce the human consciousness, culture, and self-awareness. There is
    a good reason why we say “brain surgery” for anything excessively complex; we
    use the brain daily but know very little about how it works, why it fails, and
    how to fix it.


    ## How does this relate to AI?


    Well, machine learning is about giving digital devices the adaptability of a living
    brain or, to be more specific, of a single neuron that can process individual
    bits of data and provide some utility to the owner. When these digital neurons
    are strung together in massive arrays, they exponentially increase each other’s
    processing power in a way living neurons do. Since we now possess an environment
    peppered with tiny IoT devices, each of which can process individual bits of data
    to provide some utility to the owner, we might get a monumental digital brain
    the size of a continent and a spontaneously emerging AI.


    What other emergent properties will this kind of digital brain develop? We don’t
    know, which is for scientists the best possible introduction to “let’s find out”.
    What we do know is that other living beings can organize themselves in intelligent
    ways to make up for their lack of individual strength. `Volvox` is a species of
    freshwater algae that form colonies of up to 50,000 units. Each of them is a separate
    cell and may survive on its own, but together they move, feed, and reproduce in
    unison. With hardened cells on the outskirts, primitive eyes that can sense light,
    and tiny tentacles serving as oars that move the entire colony towards the light,
    i.e., the power source, `Volvox` is an example of how a group of simple organisms
    can work together to create something bigger and more prosperous.


    Why do algae band together? They don’t have any capability for reasoning or abstract
    planning but somehow appear to sense power in one another and understand their
    chance of survival is much higher if they cooperate. We know that lions and hyenas
    hunt in packs to increase their chances of taking down big game, while birds migrate
    in massive flocks to easily cut through wind resistance and allow the weakest
    members to coast along.

    '
