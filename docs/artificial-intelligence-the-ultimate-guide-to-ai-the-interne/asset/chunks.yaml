- raw: 'There are many questions that people have about robotics, and in this chapter,
    we are going to answer some of the frequently asked questions that beginners have
    about robotics that were not answered earlier in this book. 1\. What are some
    of the most commonly used sensor fusions algorithms seen in robotic multi-modeling
    sensing and how can they improve its position estimation by using a sensor fusion?
    At this time, one of the best choices will be the Kalman filters as well as a
    particle filter. A Kalman filter will be useful whenever you are working with
    an initial position or linear measurements. The particle filter will be used even
    though the initial position is not known and there are no non-linear measurements.
    However, it will require a lot of computing that is not going to need to be done
    by the Kalman filters. No matter what sensor you are using, you will have to model
    the robot’s states to estimate their propagation as well as update the estimations
    with any measurements that you have gotten. 2\. Are robots going to be able to
    replace teachers? No! Robots can do physical work and assist teachers in their
    lecture arrangements and management, which is why there are audio-video recording
    tools that teachers use. Nothing is going to be able to replace the relationship
    that a teacher builds with their students and their parents. It cannot display
    the same feelings of empathy that a teacher can show a student whenever that student
    is going through a rough time. In the end, a robot would be nothing more than
    a talking textbook. 3\. What are some of the potential uses for artificial intelligence
    in the future? Inside the scientific domains, there are more powerful computers
    that will be able to do what they are doing now except more faster thanks to an
    increase in processing power. These computers will help scientists discover significant
    patterns inside of large datasets. Computers are extremely useful tools not only
    for scientists but almost everyone in the world because of the access that they
    have to information that we otherwise would not have. When you look at the term
    artificial intelligence, computers are being used so that a better  understanding
    of how the human brain is going to go through the process of making decisions
    is achieved. Knowing how a human brain makes decisions helps researchers and creators
    to make a robot that can follow the same process. When you look at how far AI
    has come already, it seems pretty believable that there are endless possibilities
    for AI in the future. 4\. Is it possible that we are going to see a major role
    in the science of robotics come to teaching? Yes. We have already seen how technology
    has helped teachers better teach their students, and robotics can come into play
    and help create a lesson plan that is going to target those students that are
    unable to learn in the ways that the teacher has been teaching his or her classes.
    Robotics can help teachers to personalize their classes and even better manage
    their time so that they can get to everything they want to when they are teaching
    for the year. Just like with the medical field, the possibilities of how robotics
    can help teachers is endless. 5\. How are artificial intelligence and machine
    learning defined? Artificial intelligence is the capabilities of a machine to
    imitate the intelligence that is seen in human behavior. AI technologies are nothing
    more than algorithms that will be trying to imitate what humans do. Machine learning,
    though, is the science and engineering that will provide computers with the ability
    to learn without having to be explicitly programmed. 6\. Is intelligent assistance
    one of the only applications of artificial intelligence for customer care or are
    there other ways that artificial intelligence will impact customer service? The
    front end use of AI technologies is going to make it to where intelligent assistants
    for customer care are the key, but there are multiple other applications at play
    as well. One thing will be the application for AI to directly support contact
    center agents rather than replacing them. Natural language and speech recognition
    will be used during live customer service interactions with a human agent to find
    relevant information and make suggestions for how the agent should respond. 7\.
    Is there going to be a point in time where call centers are not  necessary anymore?
    As of right now? No. However, that can always change later on down the road depending
    on how technology can change thanks to robotics. The simpler tasks that can be
    handled through digital channels, thanks to various levels of automation, free
    up humans to deal with the more complex issues. Therefore, it is likely that robots
    and humans are going to work hand in hand in call centers. 8\. What is the difference
    between Robotic process automation and artificial intelligence? Before this question
    can be answered, you have to know the context. Should a company say, “We are planning
    on integrating artificial intelligence programs into our business processes,”
    then they mean that they want to automate the process with a program’s robot.
    In this case, RPA and AI will be the same thing. In other situations, RPA solutions
    will automate processes with programs robots. These robots will be simple robots
    that do simple tasks, such as copying and pasting information into an Excel spreadsheet.
    Then, the more advanced RPA solutions will use machine learning to observe and
    learn how a human performs a task in order to automate it. Artificial intelligence
    describes a field of study that will try to automate human tasks like decision
    making. Therefore, RPA will use AI algorithms to perform complex tasks that have
    to have a degree of reasoning. There is an overlap in AI and RPA; however, not
    every RPA solution will be intelligent. 9\. Why are experts looking into ethics
    when it comes to robotics? Ever since the first factory robots were introduced
    into car manufacturing during the 1950s, they have become a part of modern life.
    Robots were popularized by science fiction films and books, and they are only
    now becoming more visible in modern societies. Robots are now being used in factories
    all over the world. Drones are used in warfare while robots are being used to
    defuse bombs. Robots are beginning to replace workers in some service industries
    like shops and hotels. They can even be made to look like humans when caring for
    the elderly or being used in therapy for children with autism. Robots (especially
    the humanoid ones) owe much of their popularity to literature and science fiction.
    The presence of robots in homes, the workplace and society are having an impact
    on human behavior. They also represent changes that have been made in society
    and cultures. The report on methods will be aimed at trying to raise awareness
    about ethical issues that are tied to the use of autonomous robots in society.
    10\. How have robots been developed and how sophisticated could they be in the
    future? When you look at the encyclopedia of Robotics, you will see that it distinguishes
    between five generations of robots. The first generation came about before 1980,
    and it was a mechanical, stationary piece of equipment that was precise, fast,
    and physically rugged. This robot did not have any external sensors or artificial
    intelligence. The second generation was between 1980 and 1990, which had a microcomputer
    control and could be programmed. It also had vision systems, positions, and pressure
    sensors. The third generation that came about in the mid-1990s and later was the
    autonomous and mobile robots, which could recognize and synthesize speech. These
    robots came with navigation systems or teleoperated artificial intelligence. Finally,
    the fourth and fifth generations are the speculative roots that you will see in
    the future. These robots will acquire certain human characteristics, such as humor.
    11\. Why is the report looking at potential moral statuses of machines? A robot’s
    behavior – even if the robot is complex, autonomous, and intelligent – will be
    determined by a human. However, if we assume that robots are most likely going
    to become more sophisticated in the future, then the nature of their algorithms
    will be an issue that is going to require attention from an ethics standpoint
    – concerning how robots should react and act in specific situations. The problem
    with the development and utilization of robots is that  other technological innovations
    cannot be planned or are not meant to happen, which can unintentionally harm humans.
    It is likely that the malfunctioning of today’s robots can cause much harm to
    many people. In the end, the question becomes not only if robots have to be respected
    on certain ethical norms, but if certain norms have to be programmed into the
    actual robots. Such a need will be apparent should one focus on personal robots
    and the ways that they could cause harm to humans. Robot autonomy is most likely
    going to grow to the point that their ethical regulation is going to be vital
    and they will need to be programmed with ethical codes that are invented specifically
    to prevent harmful behavior. An intriguing question about robots that have enhanced
    autonomy and capacity for decision making brings up questions of their moral status.
    Do robots deserve the same moral respect and immunity for the harm that is currently
    given to humans and animals? Depending on the future advances in the research
    of robotics, you cannot exclude the possibility of a future robot’s sentience,
    emotions, and even moral status. The rapid development of these highly intelligent
    autonomous robots will challenge the current classification of beings according
    to what their moral status is. Is it the same or is it going to be different in
    a profound way like what happened with the animal rights movement? 12\. How is
    robotics going to be regulated? Keep in mind that robots are complex beings, which
    raises the question as to who needs to be responsible for them both legally and
    ethically whenever the robots malfunction and hurt someone? Robots, like other
    technologies, will be used for good and bad purposes. Robots continue to be under
    regulation both ethically and legally because they are still new and rapidly changing
    the field of research and the impact that they are going to have on the world
    cannot be anticipated. There are not any specific guidelines on robotic research
    and projects, especially the ones that are having a direct impact on  humans.
    Also, there are no universally accepted codes of conduct for robotics. However,
    robots are treated the same way as other technological products when it comes
    to legal regulations. 13\. It has been suggested that errors are going to happen
    because of humans and that it can confidently be said that there are not any quality
    issues with RPA whenever it is programmed by a human. Is this true? The robotics
    programs work in a way that will follow the rules to the letter as told to it.
    It does not necessarily mean that there are not going to be any errors. During
    the early days of RPA, one of the first clients was involved with a telecommunications
    company that was able to program a robot that could send out iPhones to a customer
    that had ordered it. During the testing phase, there was a loop put in place to
    perform tests. When it finally went live they forgot to take out the loop; therefore,
    it sent everyone three to four phones. This is an example where issues can arise,
    and thus things fail on a large scale. That is why you have to be very careful
    when testing. No risk is going to forget a step at one stage. 14\. What are some
    opportunity areas that clients may go after that are considered to be “low hanging
    fruit”, and where do you see the next important ones? RPA is not a process specific
    solution, and it is not the answer to everything. What it is, is the perfect tool
    for automating the gaps in the processes and systems being used. Whenever you
    are searching for opportunities that process, there is a good chance there will
    be a large number of people performing rule-based work and the data being inputted
    will have to be structured. Therefore, call centers are not suited for large-scale
    RPA and are better for the agent assisted solutions where the robots are on the
    agent’s desk. In the event that you are looking to have more of an impact in automating
    a process, you should look to where people are handling data on a large scale
    – places like HR because they are vetting employees and doing payroll. 15\. What
    is the cost to create and implement RPA solutions? There is no price on the business
    case model; therefore, there is no  overall practical price to be given. However,
    for more enterprises, there is a common range for single bot licenses which fall
    somewhere between $2,000 and $15,000 a year. But this is just for licenses which
    are only a small part of the overall cost of ownership. The robot can do the work
    of anything that you deploy. Should you be working normal business hours, then
    you are going to get a 1:1 ration in terms of one bot doing one FTE worth of work.
    However, if you are working 24/7, you can get 20 FTEs worth of that work. Whenever
    you look at the business cases for clients, it is common to see 500 to 800% ROIs
    over a period of three to five years. '
