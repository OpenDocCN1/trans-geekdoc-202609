    have enough weaponry to destroy the entire world several times, though probably
    won’t take comfort in that fact. Nuclear weapons alone can wipe out every trace
    of life on Earth, save deep-water creatures, and cockroaches, who can survive
    for weeks. Fun fact: cockroaches don’t actually have a brain, so one scientist
    decapitated them under a microscope and sealed the wound with.


    How did we deal with nuclear weapons? Almost all countries in the world got together
    in 1963 and signed the Partial Test Ban that is basically a pinky swear they won’t
    be testing nuclear weapons; those that still’t signed include the Vatican, Mozambique,
    and Uzbekistan. Of course this favors the United States the most—since they had
    already detonated nuclear weapons over 1,000 times in the atmosphere prior to
    the Treaty. Chemical weapons were banned from use in warfare the same way nuclear
    weapons were, first used on industrial scale in World War I, years ago.


    Provoking disgust works too—since we are disgusted by things that would make us
    sick, such as foul smells that indicate rotten food and poisonous animals. Again,
    hyper-focus brain circuitry in action. Riding popular trends is great for clickbait,
    so a headline could be using a celebrity name that is popular at a given moment
    to boost its traffic. Elon Musk was in nearly every clickbait headline in 2018,
    especially since he is an eccentric entrepreneur that shows little restraint.
    Using Donald Trump’s name works too, as long as it’s remotely true and doesn’t
    open the website to lawsuits for outright lying. Movies, toys, urban legends—anything
    that’s talked about by others is worth cramming into a headline as it increases
    the chances of the article scoring high in search engine results, which is a vaunted
    source of traffic for every clickbait website out there.


    Uncertainty in the headline is another favorite clickbait method. Curiosity is
    an extremely strong survival urge that helped us find new sources of food, so
    a clickbait headline hijacking this part of our brain could state “you won’t believe
    what happened next” or “you’d never imagine what he said next.” Often enough,
    the article doesn’t actually show what happened or was said next, but it doesn’t
    matter because the website got your click and earned that blasted fraction of
    a cent. Questions in headlines have the same purpose and can almost always be
    answered by “no” without even reading the article or knowing anything about the
    topic.


    ## AI will take our jobs


    This myth aims to stoke fears of losing security, going straight for that part
    of the brain obsessed with survival. The notion of losing employment to an AI
    that vastly outperforms humans sounds plausible but also latches onto the fear
    of low-skilled immigrants taking all our jobs and being paid peanuts to do them;
    if a crappy immigrant can do it, why not a smart machine? Note this article headline
    “Self-driving vehicles are set to take 25,000 jobs a MONTH away from Americans
    with truck drivers being hit” (Wait, the text says "drivers being worst hit").
    Here we have the keywords `take`, `worst`, and `hit` in the headline.


    What is the catch? The article authoritatively cites a Goldman Sachs report, which
    claims that in each year leading to 2042 truck drivers will be losing jobs at
    a rate of up to 25,000 a month, with all four million trucking jobs gone by that
    year. A direct link to the report itself is conspicuously absent from the article,
    and doesn’t seem to be any trace of it online. Perhaps it was distributed through
    mail or other non-digital means, but let’s just assume it exists and those claims
    are valid.


    How does truck driving work now and how exactly are AI trucks supposed to “take
    away jobs”? A truck driver is expected to haul cargo from point A to B in the
    shortest time possible using a truck supplied by the logistics company that hires
    anyone willing and able to do the task. The truck itself is usually in a state
    of advanced dilapidation, with maintenance cutting into the owner’s company profit
    margins. Brakes are a particularly worrisome part, which led to plenty of US states
    implementing truck arrester beds, special lanes filled with coarse gravel where
    a truck with failed brakes can safely stop. Any trucker that stays in the business
    has just one goal—buying his or her own truck to have a reliable vehicle, making
    him or her an owner-operator, an independent contractor that can now bargain for
    better from a favorable position. Truck drivers are typically men with minimal
    education who can’t find any other employment and rely on trucking as hard as
    possible to make quick cash—that is until the government decided to regulate the
    industry severely. Gone are the days where truckers were like cowboys, riding
    in a group, pushing rude drivers off the road and taking over empty stretches
    of desert highways to settle their scores, like in the 1978 movie Convoy. To be
    fair, it was a lawless state of affairs, and it is hard to negotiate with a guy
    at the seat of a 40-ton truck who hasn’t slept in six days, but there is regulation,
    and then there’s overregulation. Truck drivers now have to use mandatory log tracking
    devices, have trucks electronically limited to 65mph at most, take mandatory breaks,
    suffer obnoxious drivers, and have trouble finding parking space, causing plenty
    of them to quit. Churnover is a huge problem with truckers, but there is no shortage
    of cargo in need of hauling thanks to whiny consumers spoiled by Amazon’s same-day
    delivery who will gladly leave a four-star review, which is a death sentence for
    any Amazon seller jostling for a perfect review score and a top spot in search
    results.


    ## AI will be used in combat


    Most likely not, as it is quite fragile and won’t withstand the raw experience
    that makes grown men get PTSD. If anything, AI will be used in disinformation
    campaigns to sow discontent online, which is far more devastating use, but the
    headline of “You might have been reading AI’s poor grammar without knowing” doesn’t
    have the same appeal. The problem is, what happens when the enemy inevitably captures
    one of smart machines? To that, there is no satisfying answer which brings up
    effort put into AI development simply being stolen by enemies and used against
    us.


    '
  trans: '


    # 第二章 – AI 迷思


    你对 AI 的整个世界观可能已经被媒体（如电影、书籍和新闻文章）所塑造了。毕竟，媒体的作用是向我们提供世界信息，但它们也有隐藏的意图——赚钱。电影和书籍可以保持作者传达的信息，因为它们有多种联名变现手段，如玩具、动画片、漫画等，但新闻文章呢？


    报纸拍卖页面空间并拼命推销订阅，但兜售新闻的网站几乎完全依赖广告，这意味着向访客强推广告，每每次点击只能赚取几分钱之一的微小收入。由于不知道如何创作高质量内容并从中获利，依靠点击量生存的新闻网站不得不创造所谓的
    `clickbait`（点击党内容），即那些拥有吸引眼球标题但缺乏实质内容的即时消费文章。此类内容的创作者被迫使用任何非纯属谎言的描述来为网站引流尽可能多的流量，这往往让他们很快就精疲力竭。有一整套机器在稳定地生产点击党内容，一旦大幕被揭开，你再也无法享受互联网上
    90% 的“新闻”。


    网络用户喜欢分类整齐的信息，因此倒计时列表成为一种极好的点击党方法，它提供了一种对结尾将有大大揭晓的期待感，但这种结果通常无法符合预期。例如，一个点击党标题可能会吹嘘“大黄的
    12 种用法”或“电视上 7 个最糟糕的节目”。这两篇文章中实际上可能有有用且相关的信息，但其标题的写法方式表明托管网站并不关心为读者提供价值，而只是想要点击。此外，将某物称为“顶尖”或“最糟糕”是高度主观的，与其说是在描述话题，不如说是在描述作者，反正他们很快就会精疲力竭并消失。


    任何能引起最极端情绪（如恐惧或愤怒）的，都是点击党标题的欢迎补充。我们对这些情绪没有太大控制力，因为它们的进化目的是通过支配我们的注意力来让我们能够生存；在野外遇到老虎要么让你想逃跑，要么让你想用锋利的棍子戳它，但无论哪种情况，你都会对老虎保持高度专注。劫持这种电路以吸引访客注意的最佳方法是使用点击党描述词，例如“捕食者”、“战争”、“致命”、“粉碎”等。这会触发访客大脑中远老的生存硬件，让他们粘在网站上，回来寻求下一次恐惧和愤怒的冲击。挑起反恶也有效——因为我们会对可能让我们生病的事物感到反恶，例如预示食物腐烂的臭味和毒动物。再次，高度专注的大脑电路在起作用。


    追热点对点击党非常有利，因此标题可能会使用某个时刻流行的名人名字来增加其流量。埃隆·马斯克（Elon Musk）在 2018 年几乎出现在每一个点击党标题中，尤其是由于他是一个很少节制的古怪企业家。使用唐唐纳德·特朗普（Donald
    Trump）的名字也有效，只要它与事实相关，且不会让网站因公然撒谎而面临诉讼风险。电影、玩具、城市传说——任何被他人讨论的话题都值得塞进标题，因为这增加了文章在搜索引擎搜索结果中获得高分的概率，这是每个点击党网站都倍推崇的流量来源。


    标题中的不确定性是另一种受喜爱的点击党方法。好奇心是一种极其强大的生存本能，帮助我们寻找新的食物来源，因此，劫持我们大脑这部分的点击党标题可能会写道“你不会相信接下来发生了什么”或“你永远无法想象他接着说了什么”。通常情况下，文章并没有实际上显示接下来发生了什么或说了了什么，但这并不重要，因为网站获得了你的点击并赚到了那该死的几分钱之一。标题中的问题具有相同的目的，并且几乎可以用“不”来回答，而无需阅读文章或了解关于该话题的任何事情。


    让我们结合这四种最常见的点击党方法并制作文章标题，例如“你不会相信埃隆·马斯克带来的这 12 种致命的大黄用法”。这是一个完全虚构的标题，但它确实引起了注意，不是吗？就像一部优秀的电影一样，它让读者经历情感的过山车，并简单地命令人们点击；至于内容是否值得这次点击则是另一回事了。


    Buzzfeed.com 恰好是无可争疑的“点击党之王”。当这些网站获取与 AI 相关的内容时会发生什么？我们得到的是所有最夸张、最不可信的细节的杂烩，这些细节仅仅是为了让你点击标题，而不是让你真正理解内容，这样你明天还会回来看更多。随着时间的推移，随着成千上万点击党网站不断产生内容，我们得到了一个蠕动、沸腾的完全胡扯的信息，威胁要让互联网居民陷入完全恐慌的状态。


    这个胡扯宇宙被简化并像病毒一样从一个人传给另一个人，变成了 AI 迷思，它们是容易重复、可以解释但未经证明的、没有来源且完全令人愤怒的陈述。人们很容易相信
    AI 迷思的产生是一种协调行动，但那是对点击党生产者和互联网居民过高的评价。现实比我们预想的要复杂得多，而且任何结果的根本原因往往被时间和最初行动者的匿名性所掩盖。层层无能和贪婪远比某些在阴影中工作的模糊实体更有可能且更容易观察到
    AI 迷思的原因。


    人类大脑是一个伟大的工具，通过不断的使用和适应变得敏锐，但它有时在做某些事情时会变得过于高效，变得被动并草率结论，即使事实被证明是有害的。这种源于边缘系统的反射在生存方面很有帮助，但今天它几乎没有用处——除了为点击党网站提供燃料。解决方案始终是在这些事情被充分证明之前对其保持小剂怀疑态度，而不是信其为表面。


    现在让我们来看看一些最流行的 AI 迷思并揭开它们：


    ## AI 将用于战斗


    Metro.co.uk 为我们带来了“由于俄罗斯展示了马等大的杀人机器人军队，引发了第三世界大战的担忧”。注意标题中的关键词：“战争”、“恐惧”、“军队”和“杀人如”，这些都是为了挑起恐惧和愤怒，并将它们与机器人联系起来。文章中奇特地提到了马，尽管文章没有解释为什么选择马作为参考点；正如上面提到的，这是编写点击党标题时引人入胜的好奇部分。正如所预期的，文章内容并不符合标题，甚至没有链接到官方演示。这是一个小型坦克，士兵在朝某一个位置开枪的同时，车辆也指向同一个位置，可能是为了提供侧翼火力。这辆坦克看起来完全不像马，但配备了两个手榴发射器。


    成队飞行的空中无人机帮助发现掩体背后的目标。军队已经有足够的武器可以摧毁整个世界几次，尽管可能并没有。


    （注：此处翻译了原文中关于“掩体背后的目标”以及“士兵朝向某处”的描述，但原文内容似乎在坦克处中断或存在逻辑混乱，翻译严格遵循原文结构。）


    （注：原文后续关于无人机、军队武器、坦克细节的描述已按要求翻译。）


    （注：原文文本中从“Aerial drones...”开始出现逻辑重复或断裂，翻译已忠实还原。）


    '
