    领先的 AI 人物也向各自的总理递交了信，参加 2017 年 11 月举行的某些常规武器公约会议。这些信还得到了斯蒂芬·霍金的支持，他在葡萄牙的一次技术会议上发出警告，称人工智能可能会毁灭世界。这些公开信的签名者包括渥太华大学的伊恩·凯尔教授以及墨尔本大学的提姆·鲍尔温教授。加拿大总理贾斯汀·特鲁多表示：“那些剥夺了在决定目标合法性和部署致命武力方面有意义的人类控制的致命自主武器系统，正处于清晰道德界限错误的一侧。”寄给加拿大和英国的每封信都强调，机器学习和人工智能带来的巨大进展已使得机器能够在没有人类干预的情况下独立执行复杂的操作。这些进步帮助了教育、交通、医疗和基础设施的许多改进。然而，积极的转型也将带来危险的后果，这些后果最终将要求高度的道德关注。正如机器人公司警告的那样，自主武器系统将成为战争革命至少三分之一的代表。因此，为了防止这种情况发生，为了禁止这些系统，寄给英国和加拿大的每封信都呼吁签署一项新的国际协议。每封信都总结道：“如果被开发，它们将允许武装冲突以比任何时候都更大的规模和比人类能理解的速度快快的速度进行。其致命的后果是，将由机器而不是人类决定谁生谁死。”加拿大外交部长将
    1996 年禁止地雷的《渥太华公约》与这项禁令进行了对比。完全禁止自主武器可能是不可能的。然而，如果所有国家共同努力，禁令将是有效的。“谈到禁令，我认为建立国际禁令是不可能的。它将取决于具体的国家，”阿比舒尔·普拉卡德告诉《新闻周刊》，“像俄罗斯、中国和伊朗这样的国家可能将国际禁令视为西方试图加强控制的尝试。如果这些国家不禁止它们，那么美国和加拿大等国家就会认为禁止杀手机器人是对其自身国家安全的威胁。”


    # 第三章：关于机器人的十个神话


    机器人仍然被误解，这意味着关于它们将会有很多神话，因为人们会编造信息来帮助自己稍微了解机器人。在这一章中，我们将检查这些神话并让它们终结，这样你就不必对机器人继续好奇，从而离理解它们更近一步。


    ## 1. 机器人将夺走人类的工作


    每一家主要的物流和制造公司都认为，机器人将提高它们的运营效率以及在那里工作的人的生活质量。因此，每当涉及机器人时，人类将一直是业务的关键部分。制造业和物流公司的员工应该将机器人视为使用精密工具增强其产出的工匠，因为它们在完成所做的工作时创造了更大的满足感。`Tesla
    Motors` 就是一家使用机器人执行对那里工作人员构成威胁的任务的公司示例。工人监督机器人的运行，并确保他们产出的工作质量符合标准并达到 `Tesla Motors`
    的预期。在 `Tesla Motors`，在装配线上工作的机器人正在胶合、铆钉和焊接汽车零件，同时还受到人类的监视。`Tesla` 的每位员工都可以为自己自豪，因为他们是制造业新时代的一部分，在这个时代机器人被用于革新。


    ## 2. 机器人很贵


    现代家庭应用将是人们每天购买时毫不思考的几件家用硬件。这些设备中的每一件都得益于数十年的改进以及领域内开发的数百万设备，分摊了成本。同样的原理也适用于机器人。问题是，几乎每个机器人都需要专门化，并且需要成本昂贵的硬件。`actuators`（执行器）将是机器人需要的最的部件之一。这些
    `actuators` 的价格并没有处理器或传感器的价格那样下降。例如，`Willow Garage` 的衍生公司工厂 `Perception`。在被 `Google`
    收之前，这家初创公司在识别和从集装箱中移除箱方面接近人类速度。尽管这个机器人系统使用了廉价的传感器，如摄像头或 `Microsoft` 制造的 `Kinect`
    设备，但机器人仍然需要一个昂贵的机器人手臂，并且必须由传统的 `actuators` 驱动。好消息是，在执行系统方面，我们很可能会看到很多创新。它将像降低电器价格那样降低机器人的成本。一个非常有前景的领域将涉及放置在关节上的传感器，这使得机器人能够以安全且经过计算的方式控制其运动。诸如
    `卡内基·梅隆大学 (CMU)` 的派生公司 `IAM robotics`、`Redwood Robotics` 和 `Modbot` 这样的小组正在寻找独特的方法来减少机器人所需的电机、齿轮和传感器的数量并简化它们。通过这种方法，机器人的价格将大幅降低，这将有助于降低手臂的成本，而手臂最终将占据整个机器人的成本。


    ## 3. 高级操作是机器人所谓的用途


    就像 `CNC`（计算机数控）机器一样，机器人是可编程的，机器人将通过调用新程序的过程从一个运行引用切换到另一个不同的引用。得益于精细的设计，可以通过末端激励将灵活性整合到整个系列零件中。如果完全必要，机器人可以更换它们的“手”，就像
    `CNC` 机器可以更换完成工作所需的工具一样。传感器技术已经先进，使其能够简化零件的呈现。视觉系统可以识别和定位零件，并减少对手动工具的需求。力感有助于机器人进行调整，以完成需要精度的装配任务。更的机器人可以有效地处理中等量制造。制造机器人的编程和切换非常快，最终导致了高效的生产。


    ## 4. 机器人编程由于其复杂性而很难


    机器人是通过离线程序或示教器进行编程的。通过示教器，编写机器人程序的人将带机器人经过一系列步骤，在此过程中进行精细调整并存储每个需要存储的点。机器人随后将运行此程序，并在再次运行之前检查是否有碰撞。它将继续运行，直到编写程序的人对所教的动作感到完全满意，并且运行时没有任何问题。


    离线编程意味着用户可以使用模型来完成和修改以后将被机器人使用的任何动作。模型对程序的响应程度将决定它在安装到机器人上后需要多少修改。


    '
