    # 第 7 章 – 与科技巨头对抗


    随着互联网的出现，我们现在拥有了数字工具和方法来传播信息，这正是 AI 用来滋养自身的燃料。当地经济可以按照自己的节奏采用像蒸汽机这样的技术，但 AI 的出现将迫使我们限制对信息的获取，并遏制那些肆意在我们的环境中播种不受控增长服务的科技公司的增长，这正是欧盟（EU）正在所做的事情。


    欧盟正在对美国科技巨头进行反击，最引注目的的方式是引入了广泛的法律框架，旨在限制它们在欧盟市场的影响力。正如 CNN 的文章 14 所解释的那样，欧盟坚决要通过罚款和监管行动来拆分
    Google。2019 年 3 月，欧盟投票通过了一项版权指令 15，该指令包含了如今已臭名昭著的`第 11 条`和`第 13 条`。这两个条款分别规定新闻聚合服务在链接到新闻文章之前必须获得许可或支付许可费，并要求内容提供者随时必须尊重版权，而不仅仅是在大公司要求他们的时候。


    简而言之，`第 11 条`和`第 13 条`几乎明确点名了 `Google News` 和 `YouTube`，这两者都在别人的内容上投放广告并赚取巨额利润，却只给选定的内容创作者支付微薄的报酬。Google  supposed
    如何扫描全天候上传到 `YouTube` 的数十万小时视频以检查是否存在侵犯版权权的行为？虽然 Google 确实拥有 `ContentID`（一个通过将上传的内容与主要发行商拥有的作品数据库进行比对的系统），但在视频上传之前，几乎无法做什么来应用
    `ContentID`，而这正是 Google 必须开始做的事情。


    主要问题在于，`YouTube` 的增长已经远远超出了任何公司能够处理的范围，而且这完全是 Google 的刻意为之。YouTube 的本意是一个巨大的信息抽斗，是用于训练目标识别和趋势分析
    AI 的最全面的视频格式数据集。YouTube 视频通过在旁边显示广告来赚钱，让 Google 可以继续扩张基础设施并赚取差价，而无需创作任何内容。当你读到这里时，很可能
    `YouTube` 已经不再是以前的样子，对于大多数用户来说已经变得碎片化或受到限制，这正是欧盟监管机构预期并计划的。


    Google 不会减少其数据收集努力，并可能简单地转向其他数据源，例如 `IoT` 设备。我们都有智能手机，手机里可以很容易内置 `Google` 应用，欧盟实际上因其推销垄断而惩罚了
    Google。但当涉及到 `YouTube` 时，一切都关乎版权这门棘手的手艺。从法律上说，版权所有者对其内容拥有绝对权利，甚至可以将其传给后代或出售给任何公司。版权所有者可以租赁或出售其内容的任何部分，同时可以免费或以某种价格对其施加可以想象的任何限制。然而，内容经常会被普通大众进行重新混合，这使得版权失效，因为版权只涉及精确的复制，但这是需要通过漫长且昂贵的法院程序来决定的，而版权所有者几乎保证胜诉。


    问题在于，仅改变 0.01% 的版权内容并不能与改变 99.99% 相同的法律保护；版权涵盖的是思想的确切表达，而不是思想本身。当 Google 接手 `YouTube`
    用户开始上传大量内容时，大型版权所有者（如`华纳兄弟`）开始跃跃欲试；Google 在内容旁边投放广告，由于它从版权内容中获利而承担了侵犯版权的责任。


    解决方案？创建一个自动化系统，审查所有上传的视频并将其与大公司创建的版权内容数据库进行对比，这些公司如果发现侵权持续，将竭于把 Google 诉到破产。这种
    `ContentID` 标记系统已被证明是一个惨痛的失败，它只有在上传的是大品牌内容的精确副本时才能正确识别版权内容。一旦小内容制作者开始录制并版权化噪音（如风铃），整个内容就会被标记为侵权。2015
    年，`ContentID` 对一段除了猫叫声外什么都没有的视频发出了侵权警告，版权所有者可以免费或以某种价格将其内容的任何部分并施加可以想象的任何限制。技术上，版权所有者可以向
    `EMI Music Publishing` 提起关于虚假版权指控的诉讼，但这是另一个版权所有者愿意经历的昂贵法院诉讼。


    规模规模，`ContentID` 简单地不起作用，因为它倾向于保护 Google 免受诉讼影响，而不是确保版权所有者的需求得到满足。这需要一个人类主导来审查版权指控，要么批准要么拒绝；没有可以想象的办法让
    AI 接管这项任务。YouTube 单独每秒就有 3000 小时的视频上传，没有足够的员工来审查所有关于侵权指控的合规性；这种安排是不可避免的，这还是科学预测的。如果科技巨头拥有任何准备好部署的
    AI，它已经部署在 YouTube 上了；如果 `ContentID` 是被吹捧的，我们可以看到它是一场灾难。这关于侵权指控，意味着 AI 在处理上是极其不足的，然而我们应该认为
    AI 已经就绪并来取代我们的工作。


    如何如何开始测试模拟理论？情况更糟。模拟理论还声称我们可能生活在一个电脑游戏中，游戏设计者为了节省计算资源而偷工，这旨在解释幽灵、预知和既幻感等超自然现象。甚至有
    MIT 的物理学家（如 Zohreh Davoudi）对该话题发表了见解，认为由于我们运行计算机模拟的资源有限，所以我们拥有自己的神一般的创造者。另一个有趣的想法是测量宇宙射线显示它们不是连续的，而是有断点，就像如果我们放大照片并看到像素会告诉我们这是一个文件而非实物。哲学家们欢迎加入斗争，他们也确实如此，声称我们处于模拟中的任何证据也可能是模拟的一部分。死亡将是创造者终止那些没有产生任何有趣内容的模拟部分，因此对于永生的建议是“去玩有趣的事”。这还引发了关于灵魂、永生和轮回的尴尬问题，使任何科学讨论都变得糟糕。有趣的是，科学家认为落后过时的宗教文本可能是最先进的科学形式，因为一切都追溯到人类体验。


    上帝将被什么取代？你可能已经知道答案了——AI。George 将编程比作魔法，提到人类可能没有自由意志，并强调要建立一个专注于逃离模拟的宗教。根据 George
    的说法，资本主义已经终结，因为所有公司都在通过不计代价追求利润最大化而不可避免地走向失败；从长远来看，公司应该像教会一样才能成功。我们历史的转折将是科技行业所谓的“奇点”，即
    `IoT` 生态系统中未连接的单元获得关键作用的一点。


    他在 2019 年于《The Verge》发表的一篇文章中说，“Comma.ai 创始人 George Hotz 想要将人类从模拟中解放” 17，这符合宗教布教。George
    发表了一个关于我们都生活在模拟宇宙中的演讲，认为逃离它让我们遇到上帝并杀死他。George 的布教得到了主流科学家的支持，他们说我们可能只是极其智能创造的视频游戏中的角色。这种方式让角色遵循规则并存在于我们赋予的框架内，但只有当我们微管理他们时，他们才拥有“生命”，除非我们也有某种程度的自由意志让事情变得有趣。


    根据《科学美国人》的一篇文章 18，引用了尼尔·德拉斯·泰森（Neil deGrasse Tyson），有 50% 的概率我们的整个宇宙只是一个驱动的模拟。在注意到我们的
    DNA 与黑猩猩仅差 2% 之后，Neil 表示可能存在一种智能，让我们看起来像黑猩猩一样原始；这种智能将通过创造和编辑人类种族来消遣自己。模拟理论源于 Nick
    Bostrom（Nick Bostrom），他在 2003 年建议我们的超级先进后代有一天决定在他们的超级计算机上运行祖先——我们——的模拟。我们现在的生活可能只是想象中的一个闪烁，我们无法判断其他人是真实思想的模拟，还是这场巨大骗局中的配角。模拟理论得到了证实，我们宇宙中所有的自然法则似乎在数学上是相关的，就像是有意识的心创造它们一样。其他科学家对这种不可能的假设竟然被考虑感到遗憾，声称模拟理论的可能性实际上为零。


    如何开始测试模拟理论？情况更糟。模拟理论还声称我们可能生活在一个电脑游戏中，游戏设计者为了节省计算资源而偷工，这旨在解释幽灵、预知和既视感等超自然现象。甚至有
    MIT 的物理学家（如 Zohreh Davoudi）对该话题发表了见解，认为由于我们运行计算机模拟的资源有限，所以我们拥有自己的神一般的创造者。另一个有趣的想法是测量宇宙射线显示它们不是连续的，而是有断点，就像如果我们放大照片并看到像素会告诉我们这是一个文件而非实物。哲学家们欢迎加入斗争，他们也确实如此，声称我们处于模拟中的任何证据也可能是模拟的一部分。死亡将是创造者终止那些没有产生任何有趣内容的模拟部分，因此对于永生的建议是“去玩有趣的事”。这还引发了关于灵魂、永生和轮回的尴尬问题，使任何科学讨论都变得糟糕。有趣的是，科学家认为落后过时的宗教文本可能是最先进的科学形式，因为一切都追溯到人类体验。


    上帝将被什么取代？你可能已经知道答案了——AI。George 将编程比作魔法，提到人类可能没有自由意志，并强调要建立一个专注于逃离模拟的宗教。根据 George
    的说法，资本主义已经终结，因为所有公司都在通过不计代价追求利润最大化而不可避免地走向失败；从长远来看，公司应该像教会一样才能成功。我们历史的转折将是科技行业所谓的“奇点”，即
    `IoT` 生态系统中未连接的单元获得关键作用的一点。


