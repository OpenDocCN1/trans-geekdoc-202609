    # 第一章：机器人学基础


    机器人学被认为是一门详尽的科学与工程学科。机器人学涵盖了多个工程领域，如电子、信息、机械、计算机科学等许多领域！它通常与机器人的使用、其发明、运行方式以及用于控制机器人的计算机系统有关。它还包括传感器的反馈以及机器人必须使用的信息处理。


    机器人技术用于创造通过复制人类动作来取代人类的机器。机器人可以用于许多情况，实现各种目的。然而，观察当今社会，它们可以被用于人类不应进入的危险环境，例如炸弹的探测甚至拆除。机器人还被用于制造流程，在这些流程中，由于空间、空气质量或其他数量的危险情况，人类无法生存，且极可能无法生存。


    机器人可以采取几乎任何形式，甚至可以被制成像人类的样子。据说这有助于人们接受机器人，因为它们复制了通常由人类的行为。某些机器人可以复制起重、说话、行走、感知以及人类能做的几乎任何事情。今天看到的许多机器人将受到其工作环境的启发。这些机器人将对自然做出贡献，因为它们对生物仿生领域做出了贡献。


    创建机器人的概念可以追溯到古典时代。然而，对其进行研究以及创造完美机器人的潜力直到 20 世纪初才真正付诸行动。在整个历史上，人们一直假设机器人将模仿人类行为，并处理与人类每天所相似的任务。现在，得于技术的进步，你可以看到机器人学是一个快速发展的领域。


    ## 词源


    robotics（机器人学）一词源于“robot”（机器人）。这个词是由捷克作家卡雷·卡佩克（Karel Capek）在他的剧本于 1920 年左右首次出版时引起大众关注的。robot
    一词的起源可以追溯到斯拉语词 `roboa`，意思是“劳动”或“工作”。


    在卡佩克的剧中，故事始于一个制造机器人的工厂，这些生物被误认为是人类（类人的概念）。然而，发明“robot”一词的并不是卡佩克，但他确实写了一封关于该词发展的信，该信在《牛津英语词典》中指出“robot”一词是由卡佩克的兄弟约瑟夫（Josef）创造的。


    然而，当你查看《牛津英语词典》时，它告诉你“robotics”一词最早是由艾萨克·阿西莫夫（Isaac Asimov）在他 1941 年发表的一篇科幻小说使用的。阿西莫夫并没有意识到由于电气设备中技术和科学正在创建一个新词。因此，他假设“robotics”一词将仅指代使用机器人的工作。在其他其他作品中，阿西莫夫说他在
    1942 年的一篇短文中首次使用了“robotics”一词，并首次提出了机器人三大法则的概念。但由于 `Liar` 比 `Runaround` 至少早十个月，`Liar`才是该词首次出现的地方。


    ## 历史


    1948 年，诺伯特·维纳（Norbert Wiener）首次创立了控制论原理，这是实用机器人学的基础。第一个全自主机器人出现在 20 世纪。第一个可编程的数字机器人命名为
    `Unimate`，它于 1961 年投入使用，从压铸机中取出汽车零件以便进行堆叠。


    如今，机器人被应用于全球商业和工厂工作，它们执行任务比人类更廉价，同时更准确、更可靠。它们还被雇用于那些不适合人类的工作，因为那些工作太枯燥、太危险或太脏。机器人通常用于大生产、制造、采矿、运输、装箱包装、手术、地球和太空的探索、安全、武器以及实验室研究。


