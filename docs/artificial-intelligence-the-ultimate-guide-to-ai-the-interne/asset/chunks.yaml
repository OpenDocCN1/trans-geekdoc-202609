    # 第 3 章 – 操纵边缘系统


    人类大脑通过数百万年的演化形成的结构，其核心在于生存，这就是为什么我们能感受到如此强烈的恐惧和愤怒，这两种情绪都能帮助我们应对危险。那么，人类大脑是如何构造的？单个神经元紧密地挤在坚硬的骨鞘中，并可以形成网络以交换和重塑来自外界的冲动。这些神经通路在童年如何形成以及之后如何交流，被称为“性格”——这是一组我们引以为自豪的独特偏好集合，而我们甚至没有意识到其中很大一部分是无法由我们控制或选择的。


    我们大脑的基础是`边缘系统`，它负责处理核心身体功能，如呼吸和体温。这是大脑的原始部分，容纳了奇异的冲动和恐惧症，还有饥饿、欲望和焦虑等各种。`边缘系统`被包裹在`新皮层`之中，后者是大脑包含逻辑和幽默感等高级脑功能的部分。`边缘系统`帮助我们生存，而`新皮层`帮助我们繁荣，两者本应合作，但往往存在截然不同的权力动态。


    `边缘系统`如此快速且强大，以至于它在整个身体方面基本上可以随心所欲，然后我们用`新皮层`来为它的行为辩护，要么用逻辑使其合理化，要么用幽默来应对刚刚发生的事情。我们大脑这种自动驾驶功能在百万年前的非洲草原上是有意义的，在听到草丛沙响的瞬间，毫秒级的反应就意味着生与之别。


    在当今社会，`边缘系统`在在没有理由的情况下过度活跃，因为它不断受到媒体、公司和科学家协同操纵的触发，这些人都只想获得我们的注意力。`边缘系统`并非只在生命受到威胁时激活，它不断受到来自企业的广告的轰炸，这些企业意识到所有的购买和消费决策都源于它。声音、视觉和气味都代表了正强化，旨在诱惑`边缘系统`中处理享乐、成瘾和情感体验的区域，并创造出终身客户。


    公司已经开始利用这些曾经对生存至关重要的核心休眠行为来获利。然而，这类行为还有更多，谁能先定义它们，谁就将变得不可思议的富有。所有的营销归根结底都是找出潜伏在我们大脑原始部分中的力量，并直接作用于它们以覆盖意识思维。营销
    AI 也不会例外，你已经可以看到它如何被吹捧成发动战争、杀戮、消除饥饿和孤独的完美工具，所有这些都直接指向`边缘系统`。


    计算机程序员也必须处理`边缘系统`，主要通过使用所谓的`UX`或用户体验，这试图找出用户在使用界面过程中在何地会经历非理性的愤怒、愉悦或痛苦。有趣的是，大脑和计算机结构之间存在许多相似之处。`边缘系统`对应于`kernel`（内核），即计算机中的核心组件，而`新皮层`就像是操作系统。所以，只要你按下电脑的电源按钮，`kernel`就会启动并协调其他所有事务，引导启动你可以操作的操作系统；`kernel`本身是不可访问的，因此免受篡改。一个普通的计算机用户并不知道有`kernel`这种东西，也不知道它是干做什么的，因为那个点点滴滴的桌面环境运行得很好。


    对此可以说，计算机构造得像人类大脑是有原因的——它是世界上最完美的工具。我们正在利用大脑处理琐碎任务，甚至不知道它是如何工作的或为什么，这就像普通人在他的桌面电脑上玩纸牌游戏一样。AI
    预计将产生于看起来像人类大脑的数字安排并不奇怪；我们还能用什么呢？其含义是，AI 将使用人类大脑的数字副本，在瞬间跳过数百万年的演化，教我们大脑是如何工作的，以及我们下一步应该看哪里。


    由于它不需要为生存而挣扎，这意味着 AI 将没有`边缘系统`，使其能够以完美的清晰度思考，而没有模糊我们判断的生存冲动，带给我们这些微小大脑甚至无法理解的科学和心理突破。这些只是深埋在我们脑中的某些迷人行为，每天受到环境的影响。关于`边缘系统`有许多信誉良好的学术文献，但它们都是枯燥得令人难以受且催眠的——眼睁睁看着它在眼前上演是完全不同的，不是吗？


    最值得注意的是，要停止这些冲动极其困难，但如果我们只使用我们的自由意志（大致定义为“对选择的意识”）就可以办到。每种宗教和教育系统都旨在告诉我们不必服从自己的冲动，或者至少它们最初的设计是这样的；但随着时间的推移，所有支持`新皮层`的系统都会崩溃，并开始影响`边缘系统`，因为它更快且更顺从。这侵蚀了我们的自由意志，因为它加强了我们的原始冲动，不可避免地导致我们安逸和毁灭。理解人类大脑如何工作以及它是如何每天被操纵的，对于成熟和心理发展至关重要。问题在于，由于网络，我们现在拥有比以往任何时候都多的信息和智慧来源，让我们所有人能够分享并共同成长。

    '
