- raw: 'Chapter 21 – AI and Social Credit While the US might be leading in AI research,
    it is China that does most of the implementation on a large scale. China can leverage
    its massive population to both produce a large volume of engineers and train any
    sort of neural network as a diverse set of challenges. Just like we can see with
    the simplest products, the Chinese have no shame when it comes to copying what
    smarter people have already done and just toying with it using their extremely
    cheap workforce to make a working prototype and turn it into profit. In fact,
    big US companies might want to tap into the Chinese market just to sip from that
    fount of data and leverage the workforce to iterate on a product that would then
    be offered to the US market, under the auspices of the Chinese government of course.
    Google already made inroads into China as a search engine of choice from 2006-2010
    but gave up because of extreme censorship demands, hacking attacks, employee interrogations,
    and theft of intellectual property [\[40\]](#part0049.xhtml#a1UK) . In 2018, Google
    decided to give it another try, which startled analysts who stated that, if anything,
    the Chinese government made the online environment much more hostile so there
    must be some really pressing concern that made Google so eager to enter China.
    According to Dr. Kai-Fu Lee, the former president of Google China, we are entering
    the age of AI where “data is the new oil, and China is going to be the new Saudi
    Arabia” and workers won’t simply be displaced by machines in a 1:1 ratio—entire
    industries will be automated and people depending on them disenfranchised. He
    calls for some form of income redistribution since companies employing AI will
    easily earn billions of dollars, so charging them extra tax seems like the most
    natural solution but argues against UBI as presented in the media. Dr. Lee says
    that governments around the world will have to provide citizens with “meaning
    to life” more than just the means to live and mentions that jobs where the outcome
    has more to do with human satisfaction rather than 0s and 1s, such as nannies
    and teachers, are still safe from automation. Creative creators, for example,
    writers and painters, also have nothing to fear for quite a long time. For  many
    people, says Dr. Lee, work is the meaning of life, and they expect to have the
    same old routine for 60 years of their existence just like their forefathers,
    so having that snatched away from them won’t put them in a good mood. The thing
    is, we are already treating our workers as robots: sit still, fill out these spreadsheets,
    and send them out in an e-mail for eight hours a day, so automating their jobs
    will actually be doing them a favor. How about giving them a smart tool that fills
    out the spreadsheets, and they just double-check the results? That would absolve
    the company of any legal liability as there would still be a human, but the work
    output could increase tremendously, though with some reduction in overall quality.
    It is telling that two countries with the feeblest consumer protection laws, the
    United States and China, are the ones pushing for AI as their captive customers
    have very little say in what they get. This common ground could be used to let
    Chinese-style censorship enter the US through tech giants, such as Facebook and
    Google, which have already expanded to the point they resemble nation states,
    except they can’t be defeated in a war. China’s social credit system (SCS) is
    like a huge video game, save that the consequences of being low on the scoreboard
    mean being shut off from government essentials, such as education and public transport.
    What causes loss of social score? Traffic accidents, murders, embezzlement, and
    being related to someone who did any of those. In one instance in 2015, a young
    Chinese student, Zhong Pei, couldn’t buy a train ticket or enroll at a university
    because her dad had killed two people and himself in a car accident [\[41\]](#part0049.xhtml#page_186)
    . The official label entered in the system was that Pei was “dishonest”, but she
    was able to clear her name after four months. Already built and trialed by Tencent
    and Alibaba, the Chinese equivalents of Apple and Amazon, SCS will become China-wide
    in 2020, where everything a citizen does will go into figuring out their score.
    Drinking, playing video games too much, or simply hanging out with the wrong people?
    SCS will consider whether hobbies, purchases, and health habits deviate from what
    the Party has set out for a model citizen to dole out the punishment: social and
    economic isolation. The only  problem is, as we saw with the Canadian isolation
    experiments, those measures radicalize people and warp their sense of reality.
    The idea behind SCS is that the Chinese government can’t possibly handle over
    a billion people who might own powerful technology, so untrustworthy ones most
    likely to cause trouble should be identified and gradually squeezed out of the
    big cities, including those who could help them claw their way back in. According
    to that logic, SCS will reward those who act responsibly while acting as a pre-punishment
    to those who endanger themselves and others. Other punishments include the cutting
    off internet access, no access to housing loans or job opportunities, and a revoked
    passport. What will those people do to survive in a world with increasingly hostile
    technology? '
