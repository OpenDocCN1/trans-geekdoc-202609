- raw: 'Chapter 15 – AI and Self-driving Vehicles A self-driving truck startup, Otto,
    sent one of its trucks on a 120-mile journey [\[29\]](#part0049.xhtml#a1WG) to
    deliver 51,000 cans of Budweiser. Uber, which has already vowed to eliminate human
    drivers from its workforce, bought Otto and is now experimenting with self-driving
    vehicles as a part of a marketing tactic that is meant to impress investors. Pay
    attention to the details of the journey to see the flaws of self-driving vehicles.
    With an empty driver’s seat, the driverless truck was surrounded by four police
    vehicles and three Otto vehicles that were meant to intervene in case someone
    got thirsty, or the truck broke down; two tow trucks were plowing through traffic
    ahead to ensure nobody messed with the truck’s trajectory. The driver lounged
    in the back but took control once the truck left the highway. Otto later confirmed
    that they did the same route before with a human driver at the wheel who never
    had to take control. Budweiser logistics manager explained that they eagerly want
    to see this kind of delivery method scale. Shailen Bhatt, Colorado’s Executive
    Director of the Department of Transportation, said that self-driving trucks are
    in a legal gray area, but the technology could at some point become as ubiquitous
    as automatic transmission. Neither Otto nor Budweiser manufacturer could elaborate
    on when they see self-driving trucks becoming a regular part of the traffic. How
    many flaws did you spot? Driverless vehicles will need constant attention by humans,
    and in this case, a single car required attention from at least seven people (one
    driver per each vehicle surrounding it, not counting drivers in tow trucks) plus
    a driver in the back of the truck. So why is the driver there? Because the truck’s
    sensors rely heavily on using immaculate highway traffic signs to navigate; once
    the truck is on dirt or gravel, the neural network driving it goes haywire. Self-driving
    vehicles require an enormous infrastructure to work properly, and that is without
    humans interfering with it. It is quite likely human drivers encountering self-driving
    trucks would intentionally mess with it just for fun or to eke out a settlement,
    so there would again have to be a human driver in the cab just for  optics. Companies
    that own and dispatch self-driving vehicles would then most likely push for human-free
    lanes, where neural networks have the right of way at all times and can form seamless
    convoys. How is that different from using a train to move cargo? Further, self-driving
    vehicles are in a legally gray area, meaning they can’t get insured or registered
    as regular vehicles can. It is unknown if self-driving trucks can scale, meaning
    we can sort of tell what happens if one self-driving truck is sent on a voyage
    but what happens if ten million are sent every which way at the same time? What
    kind of infrastructure would the logistics company need to build to manage that?
    Plenty of things don’t add up when it comes to self-driving trucks. Jumbo jets
    have had autopilot capability for some 40 years, but we still need a human pilot
    and a backup pilot, so self-driving trucks will by all accounts require more people
    to be hired. They obviously cost plenty of money and effort without an immediate
    return, so why are companies pushing for them? Without an apparent answer, the
    most likely reason is that there is a certain pride in being able to call one’s
    own company fully automated. Surveys done with potential self-driving car buyers
    showed that they overwhelmingly want a car that would destroy itself and its driver
    rather than kill the passers-by. The problem is, when they are asked if they would
    buy or drive that kind of car, they vehemently said, “No.” The interests of tech
    giants to increase their reach and surveillance clash with societal norms, capabilities
    of neural networks, and even the human instinct for self-preservation stemming
    from the limbic system. Legal liability for this kind of thing would be enormous
    and no kind of suicide clauses in the purchase agreement would shield a tech giant
    from a flurry of lawsuits. However, presenting the self-driving car as being operated
    by an AI that has been granted a status of deity could work as a legal loophole.
    There is already the precedent of “force majeure” [\[30\]](#part0049.xhtml#a1XF)
    or higher force that allows companies to slip out of contracts, most notably in
    cases where numerous property insurance payouts would bankrupt the company. Force
    majeure is reserved for overwhelming events, such as riots and wars, but also
    includes elemental disasters,  such as tornadoes and floods, that utterly destroy
    a certain area. Considered “an act of God”, force majeure could be used after
    an AI has been presented as a deity, making it legally immune to lawsuits and
    contracts in cases of self-driving car pileups. '
