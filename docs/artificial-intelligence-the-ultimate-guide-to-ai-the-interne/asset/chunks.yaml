    # 规划

    规划是通过智能规划来设定目标以及实现目标。目标必须能够使未来可视化。所采取的行动应当与目标相匹配。在经典规划问题中，智能体会假设自己是世界中行动的系统，允许智能体对其行为的后果有确定的。然而，如果智能体仅仅是执行者，那么它要求智能体在没有任何确定性的情况下行动。这要求智能体评估其环境并做出预测，但它们还必须评估自己的预测并根据这些评估进行调整。多智能体规划将利用多个智能体的合作与竞争来达到特定目标。群体智能和进化算法将使用涌现行为。


    ## 方法

    目前没有指导 AI 研究的成熟理论。研究人员在许多问题上经常产生分歧。一些尚未解决的长期问题是：“人工智能是否应该通过研究心理学或神经生物学来模拟自然智能？”“或者人类生物学对
    AI 研究来说是否就像鸟类生物学对航空工程一样无关？”“可以使用简单、优雅的原理来描述智能行为吗？”“还是它必然需要解决大量完全无关的问题？”


    ### 控制论与脑模拟

    在 20 世纪 40 年代和 50 年代，许多研究人员探索了神经生物学、控制论和信息论是如何联系在一起的。其中一些研究人员建造了使用电子网络展示原始智能的机器，例如
    W. 格雷·沃尔特的乌龟或约翰斯·霍普金斯大学的“野兽”。英国的 Ratio 俱乐部和普林斯顿大学的目的论学会举行了会议，许多研究人员聚集在一起。直到 1960
    年这种方法才被抛弃，尽管在 20 世纪 80 年代它的某些元素被重新引入。


    ### 符号

    只要能够访问数字计算机，AI 就开始探索人类智能如何简化符号操作。卡内基梅大学（CMU）、麻省理工学院（MIT）和斯坦福大学是研究的中心。老派的 AI，简称
    `GOFAI`，是约翰·哈格尔对这些符号化 AI 方法的命名。符号化方法在 60 年代期间，在小型演示程序中模拟高级程序的思维方面开始取得成功。这些方法基于控制论以及人工神经网络，后者要么被边缘化，要么被完全抛弃。20
    世纪 60 年代和 70 年代的研究深信，符号化方法最终将创造出具有通用人工智能的机器，这被认为是他们领域的目标。


    ### 认知模拟

    为了将它们形式化，两位经济学家赫尔伯特·西蒙和艾伦·纽威尔研究了人类的问题解决能力。他们的工作为人工智能以及运筹学、管理科学和认知科学奠定了。他们的研究小组利用从心理实验中获得的结果来开发有助于模拟人们解决问题所需技巧的技能。这一传统始于
    CMU，并在 20 世纪 80 年代通过 `Soar` 架构流传。


    ### 粗糙或反逻辑

    MIT 的研究人员发现，通过自然语言处理和视觉解决困难问题时，需要特设（ad-hoc）的解决方案，这些研究人员认为，任何通用或简单的原理都无法捕捉智能行为的每一个方面。罗杰·尚克使用“scruffy”（粗糙/不整洁）一词来描述该团队的反逻辑方法。由于常识知识库必须手动构建，它成为了粗糙
    AI 的范例，这在一度曾是一个复杂的概念。


    ## 应用

    任何智力任务都可以与人工智能有关。AI 效应是一种现象，当一项技术成为主流时，你就不再认为它是人工智能了。自动驾驶汽车和无人机只是现代 AI 高知名度例子中的几个。你也可以在线广告投放、司法裁决、航班延误预测、垃圾过滤、图像识别、在线助手、玩国际象棋或围棋等游戏时的搜索引擎、数学定理的证明、艺术创作和医学诊断中看到它们。社交媒体正在逐渐取代电视成为接触年轻人的来源，这意味着大型新闻机构必须依赖社交媒体平台让人们阅读新闻。即使是主要的出版商也在使用人工智能来产生更大的流量并有效地发布更多故事。


    ### 医疗保健

    发现表明，如果使用 AI 诊断患者，可以节省高达 160 亿美元。2016 年，加州的一项在 AI 帮助下的突破性研究创建了一个公式，以正确确定器官患者所需的免疫抑制剂药物的正确剂量。得益于医生的协助，医疗行业已逐渐进入人工智能。微软开发的一项
    AI 已经帮助医生找到了如何正确治疗癌症。根据彭博科技的，已经开发了大量与癌症相关的药物和研究。详细来说，据称已制造了 800 多种疫苗和药物来治疗癌症。然而，这会对医生产生负面影响，因为从太多选项中为患者找到正确的药物可能是困难的。`Hanover`
    是微软的一个正在进行的项目。其主要目标是记住所有关于癌症的研究人员和研究，并帮助预测最有效的药物组合。对抗髓性白血病是一个目前正在进行的项目。这种癌症是致命的，几十年来其治疗一直没有改进。另一项研究还发现，AI
    定位皮肤癌的能力与经过训练的医生相当。还进行了另一项研究，将 AI 用于发现和监控几位风险较高的患者。AI 根据从医生与患者现场互动中收集的信息向每位患者提问。外科医生还在位于位于华盛顿的儿童国家医疗中心进行了一项研究。外科医生团队在他们的监督下使用自主机器人对猪的肠道进行手术。他们观察到机器人的表现比熟练的人类医生得多。IBM
    拥有的 AI 计算机 `Watson` 也对一名患有白血病的女性做出了诊断。


    ### 汽车

    AI 的进步通过创造和演进自动驾驶车辆促进了汽车行业的发展增长。2016 年，超过 30 家公司使用 AI 来制造无人驾驶汽车。其中一些公司包括苹果、谷歌和特斯拉。自动驾驶汽车的功能由几个组件组成。集成在这些车辆上的系统包括导航、地图、制动、碰撞预防和变道。结合时，它们将在复杂车辆内部的高性能计算机上运行。尽管仍在测试中，由于目前自动汽车的改进，无人驾驶卡车现在也被制造。英国政府于
    2018 年通过了关于自动驾驶卡车启动测试的立法。非自动驾驶卡车后面将跟着自动驾驶卡车队。`Freightliner Inspirations` 正在德国一家名为戴姆勒的汽车公司进行测试。这是一种在高速公路上使用的半自动卡车。影响车辆是否能无人驾驶的因素之一是地图是否正常工作。通常情况下，车辆行驶区域的地图通常是预先编程的。这张地图将包含路灯和路缘高度，以便车辆熟悉该区域。然而，谷歌已经开发了一种算法，旨在消除对预编程地图的需求，取而代之的是一个能够适应车辆所经过的新环境的设备。一些已经开发的自动驾驶汽车没有刹车或方向盘。它们是一项研究的一部分，该研究专注于创建一种算法，通过熟悉行驶状况和速度为乘客维持一个安全的环境。另一个影响无人驾驶汽车的因素是乘客的安全性。为了制造无人驾驶汽车，工程师必须对其进行编程，使其能够处理带来更高风险的情况。这些可能包括迎撞行人。他们的目标是确保路人和乘客的安全。汽车可能做出让某人处于危险中的决定。换句话说，汽车可能必须决定救乘客还是行人。程序将是创造成功的无人驾驶汽车的关键部分。


    ### 金融与经济

    金融机构长期以来一直人工神经网络来检测不符合客户正常消费习惯的变化或索赔。这些费用会被标记出来供人工调查。自 1987 年以来，每当太平洋银行成立反欺诈工作组时，银行业就会使用人工智能来对抗未经授权的信用卡使用。金融服务还在
    `Moneystream` 和 `Kasisto` 等程序中使用 AI。银行现在使用 AI 管理财产、投资股票、维护账目和组织运营。每当业务没有发生或夜夜发生了任何变化时，AI
    都能做出反应。2001 年举行了一场模拟金融竞赛，机器人赢了人类。它还监控用户的行为模式；因此有助于减少金融和欺诈犯罪。


    ### 视频游戏

    视频游戏也使用人工智能，以便 `NPCs`（非玩家角色）具有动态的、有目的的行为。此外，路径寻找也使用了 AI 技术。一些研究认为视频游戏中的 `NPCs`
    可以解决生产任务中的问题。


    ### 军事

    2015 年，全球各国军队在机器人方面的支出金额达 75 亿美元，此前为 51 亿美元。军事无人机由于它们向军事展示的自主行动，已成为一种实用的资产。弗拉基米尔·普京在
    2017 年表示：“谁成为人工智能的领导者，谁就统治世界。”许多 AI 研究人员正让自己远离 AI 的军事应用。


