    # 第 23 章 – AI 作为体育裁判


    在体育运动中，很多结果的产生取决于几厘米之差，而一组人类裁判可能不足以做出正确的判罚。足球是一项古老而残酷的运动，源于大规模的村庄斗殴，其规则是将一个物体从球场的一端运到另一端；随着人类不断找到方法规避过时的规则，引入技术变得不可不可。


    在 1986 年一个特别痛苦的案例中，英格兰输给了阿根廷队，因为其中一名球员迭亚戈·马多纳用手而不是头部进球，而这是一个被禁止的动作。这一事件被称为“上帝之手”，它无疑促成了高清晰视频录像的采用：一支专门的视频分析团队进行观看，并可以要求暂停比赛，以及一组高速摄像头监控着每一个进球。


    随着球员表现水平的提高，足球通过制造更小、更快的球实现了现代化，这些球可以被踢得更有力从而创造出令人震撼的进球，但也意味着标准的每秒 24 帧电视摄像机已不足以进行视频分析。这套被称为视频助理裁判（`VAR`）的系统为球场的每一寸都提供了多个高速摄像头角度，并允许`VAR`团队纠正场上裁判的决定，或者在检查回放时让他们暂停比赛。此外，高速摄像头监控每条门线，创建球进入球门瞬间的
    3D 表示，并通过手环屏幕和蜂鸣器自动向裁判信号是否判定进球。以防万一，还有一名备份的人类裁判，其唯一目的是盯着每条门线以对`VAR`进行双重检查。


    `VAR`向我们展示的是，在任何需要审慎判决的情况下，简单地增加人数并不能提高准确性，但仅仅增加技术也无济于事。正确的解决方案是在谨慎扩大技术规模的同时，增加备份的人员，因为现在我们负担得起这种成本。那种“AI
    将导致卡车司机失业”的恐惧毫无意义，因为如果我们可以负担得起雇佣人类司机，由人类协助 AI 反之亦然，就像在体育运动中一样。足球现在是一项根据单个进球就能成名败的运动，所以我们最好确保每一次都是准确的，如果系统出现故障，还要给出一个完美的解释，尽管到目前为止它还没有发生过这种情况。


    `VAR`的决定能像我们挑战审判前风险评估分数那样被挑战吗？不能，因为`VAR`：

    a) 显示所有原始数据，即特写、高清晰且慢动作的进球录像；

    b) 有一名人类专家检查原始数据并做出裁决。


    尽管拥有长期以来抵制改变的古老规则，但当观众、球员和裁判轻松地接受`VAR`时，足球实现了现代化，因为该系统是透明且具有冗余备的。这才是我们需要的 AI 技术：一种基于比人类对应物工作得更好的机器（摄像头优于人眼），并且在最终我们获得正确答案之前可以被易于挑战的，同时仍然保留了覆盖机器决定的选项。


    ## 结论


    几十年来，科小说作家一直对人工智能忧心忡忡，甚至在公众人物讨论这一概念之前也是如此。他们想象 AI 是一种助推力量，我们必须依靠它去探索太阳系之外，或者仅仅只是一个帮助我们修复地球上问题的助手，但它终究是无法回避的影响。所有将
    AI 概念介绍给普通大众的媒体都将其描绘成神秘且具分析性的，不择手段地实现自己的议程，最后不可避免地变成反派。


    正如我们在整本书中所看到的，几乎没有证据表明这在本世纪会发生。正在发生的是，创业者比以往任何时候都更努力地让自己不眠经营业务，在刺激剂的驱动下，并对政治家缺乏影响力而感到沮丧。所以，当创业者终于获得睡眠时，他们会做关于
    AI 的狂热梦——一种数字工人可以让他们最终夺取政治权力宝座，然后去睡午觉。AI 甚至可以被呈现为一个神灵，以填补整个国家生活中缺失的空白，同时赋予它特殊的法律权利和豁免权。


    科技巨头真的能做到吗？高度怀疑。通用 AI（即像人类一样聪明的 AI）的出现可能需要像电力一样基础的技术发明才能运作，但人类将无法使用它，因为我们会直接采用这项发明，并在表现上再次优于任何机器。


    我们确实拥有窄 AI，即可以比较图像、在图片中寻找物体或在一群脸中识别特定脸的 AI，但如果没有人类处理员的监督，即使是这些也没有用处。自动驾驶汽车和卡车如果没有人类守护者和技术员就无法工作，这意味着它们将会增加就业而不是让人们失业。正如本书中所述的，通用
    AI 仅仅是一个空想，是科技巨头 CEO 们的一痴人想，他们认为自己的宠物项目可以被广泛接受，并在发放全民基本收入（UBI）时被誉为人类的救世主。他们列出的那些末日和阴暗的预测都不会发生，但煽动恐惧确实会增加消费并让人变得更容易顺从。那么，现在呢？享受这个过程吧。


    '
