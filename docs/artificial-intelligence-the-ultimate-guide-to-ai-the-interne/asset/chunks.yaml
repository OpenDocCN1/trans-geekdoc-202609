    exact form which is going to be the reason for the use of the o in the  equation.
    When you are looking at the changes that cause you to use a different activation
    expression, then the value for that partial derivative is going to change in the
    equation. So, when you compute those derivatives later, your function is going
    to take the algebra and simplify it so that the exponentials have properties that
    you can work with when differentiated. As you interpret your outcome that comes
    from the sigmoid neuron, you are going to see that one of the biggest differences
    is going to be the perceptrons and the neurons where the neurons do not result
    in zero or one. They can have any outcome as long as the outcome is a real number
    and it falls between zero and one. This is going to be useful when you want your
    outcome to represent the average intensity for the pixels that are in an image.
    However, sometimes this is going to be a problem. Take, for instance, if you want
    your outcome to say that your image is nine or is not nine. It is going to be
