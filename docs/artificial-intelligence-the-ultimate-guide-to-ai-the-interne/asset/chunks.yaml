- raw: 'Chapter 8 – Seminal Inventions We can take a look at seminal technological
    inventions to understand how they changed the way we do business and live our
    lives to extrapolate how AI will do the same. We can single out the internal combustion
    engine as the most significant invention that marked the twentieth century, driven
    by the use of fossil fuels. The internal combustion engine allowed us to travel
    faster for greater productivity and more leisure than ever before. Having a car
    soon became a status symbol and cities had to grow to accommodate them, paving
    over arable land and reserving plenty of usable space for parking to the point
    it is nearly impossible to do anything without a car. The internal combustion
    engine also allowed us to have vans and trucks that haul cargo, providing us with
    unthinkable abundance, but also polluted our environment in a very palpable way;
    just take a look at any modern metropolis and the impenetrable veil of smog. Fossil
    fuels are an inconsequential pollution source, but it is when they became globally
    adopted, and everyone could afford a car, that they started seriously polluting.
    Ironically, they also made everyone richer, so there is no way to scale back and
    just “use less”. Every bit of food we eat has to come through some form of transport
    that uses an internal combustion engine, meaning fossil fuels and pollution, and
    since the hunter-gatherer lifestyle is impossible in the city, we have to eat
    whatever is available, leading to all sorts of health problems in the long run.
    Saudi Arabia, rich in fossil fuels, became a center of global power and grew from
    a tent city of camel herders to a glistening metropolis that can afford to build
    artificial archipelagos visible from space. The United States introduced the idea
    of the petrodollar and strongly suggested to every country to use US dollars exclusively
    to buy oil on the market. This created a high demand for US dollars, which could
    be printed to generate much more wealth than the US market could sustain on its
    own. Meanwhile, attempts to create an alternative to fossil fuels have failed,
    and it is only wishful thinking that makes countries install renewable energy
    sources, like wind turbines; in most cases, they are operating at a loss and have
    to be  financed by the taxpayer. Some random country might happen to have just
    the right ingredients to physically anchor AI in our world, suddenly making it
    an El Dorado. A shift in global power will be near instantaneous, tectonic and,
    due to the presence of nuclear weapons, surprisingly peaceful. It is likely that
    AI, once it reaches a sufficient level of penetration in our global digital society,
    will have the same impact the internal combustion engine had: more power, more
    productivity, more status, and more leisure. We did leave dedicated lanes for
    pedestrians (sidewalks) and forbade cars from driving on them; we also created
    dedicated lanes for cars (highways) and forbade pedestrians from walking on them.
    In computer terms, human legs are legacy hardware that is still supported in city
    infrastructure, so we will likely have to create an entirely new layer of infrastructure
    just to accommodate AI and leave the ordinary internet and landlines to humans.
    It is not even a matter of willpower or societal organization; just compare the
    outputs of a tractor and a third-world village with hoes and shovels. A single
    machine driven by a human can do the work of 300 men, women, and children with
    ease while creating a tiny bit of pollution. Not just that, but the tractor driver
    is in a comfortable seat, with the cabin protecting him or her from the sun, so
    plowing is pleasant. How likely is it that AI will leave people jobless? The same
    way we don’t hear anyone complaining about tractors getting all the juicy plowing
    and hoeing jobs of villagers, AI will most certainly not remove jobs as they are
    but will automate and expedite certain simple, repeatable chores we had to do
    manually with great expense in time and energy. AI will make those chores more
    pleasant, and we’ll be glad to have it finally, but there is also the problem
    of becoming too reliant on machines to the point we forget to use our brains.
    Note how in the tractor analogy, it still mentioned “machine driven by a human”.
    That wasn’t just a figure of speech or a contrived circumstance—legally, all roadworthy
    vehicles have to be operated by a human, even in cases of horse carriages where
    an animal has a  choice of speed and direction. Vehicles using an engine with
    internal combustion simply have to have someone accountable in case something
    goes wrong, meaning they have to be registered, serviced, and operators have to
    have a certain license, etc. If we compare a horse carriage driver to a car driver,
    we can clearly see that the increase in horsepower leads to a stricter licensing
    mandate. If AI ever becomes a household item, something each person will own just
    like we own smartphones, it is likely they will have to be licensed the same way
    some US states register guns in case something goes wrong. '
