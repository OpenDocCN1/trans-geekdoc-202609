    # 第 17 章 – AI 作为世界性宗教


    当你拥有这种背景时，你终于可以理解科技巨头 CEO 们的政治诉求，最著名的就是马克·扎克伯格（Mark Zuckerberg），他几乎承认自己将在未来的 2020
    年美国大选中竞选总统，他的平台几乎完全集中在 `UBI`（基本收入）。换句话说，就是给每个人免费的根基。


    那么，一个由马克·扎克伯格管理的国家表现如何？让我们看看他是如何管理自己的公司以寻找线索。2019 年 3 月 13 日，`Facebook`、`Instagram`
    和 `WhatsApp` 发生了全球性的停机。根据用户的情况，某些功能可用，但大多数其他功能都崩溃了。使用 `Facebook` 账户登录的网站在这些功能上也遇到了麻烦。在了一天之后，一切才恢复正常，官方解释是“服务器配置更改”，但这并不排除黑客的可能性，因为他们也可以更改服务器配置。


    现在想象一下 `Facebook` 的网站是互联网上唯一的网站，你就能看到这有多么不现实。一个控制了大部分互联网的技术巨头会使其极易受到黑客攻击，但他们无论如何都会推行单一文化，因为这关乎政治控制，而不是提高生产力和用户需求。这非常像宗教狂徒谈论他们的宗教是“唯一的正确途径”。


    在技术上，`Google` 的竞争对手 `Microsoft` 正在采用一些相同的策略，甚至是一些相同的软件。2018 年，`Microsoft` 宣布其
    `Edge` 浏览器将由 `Google` 的 `Chromium` 引擎驱动，这与 `Google Chrome` 使用的是同一个引擎。因此用户可以在 `Edge`
    或 `Chrome` 之间进行选择，但无论如何本质得到的都是相同的东西。网站创建者出乎意料地会走捷径，仅为 `Chromium` 优化网站，使其他浏览器的使用体验变得不佳，并逐渐引导用户使用
    `Chrome`。


    基于网页的 `Skype` 应用程序最近的更新使其仅在 `Edge` 和 `Chrome` 中运行，证明了科技巨头非常愿意将其他人排除在乐趣之外。但摆弄过其他浏览器的黑客证明，如果他们虚假识别自己为
    `Edge` 或 `Chrome`，同样的更新就可以应用于其他浏览器。并不是 `Microsoft` 无法让程序在 `Firefox` 或 `Safari`
    中运行；而是他们为了制造垄断不会这样做。这特别讽刺，因为 `Skype` 被营销为一种缩小平台和跨洲差距的方式，但实际上它将用户推入了一个单一文化的世界，只有同一家公司的应用程序才能无缝运行。这种行为发生过
    `Microsoft` 身上，并且在高管对失去市场份额的恐惧推动下再次发生。


    ## 如果 AI 是神灵，那么谁是祭司？


    来自各个领域的各种科学家认为自己是唯一值得解读神圣机器大脑那不可测意志的人。2019 年，斯坦福大学（`Stanford University`）成立了一个致力于
    `AI` 的新学院，但很少提到科学，而是有大量的传教。该学院没有将人类分为使用 `AI` 竞争的国家，而是提出了人类统一的思想。


    由曾担任 `Google` 首席 AI 科学家的李飞飞（Fei-Fei Li）领导，“斯坦福大学人类中心人工智能研究院”（Stanford Institute
    for Human-Centered Artificial Intelligence）计划成为 21 世纪的宗教。所以，这是一个由恰好是中国人的 `Google`
    员工运营的私人组织。吹嘘“AI 时代”的到来，宣传材料声称 `AI` 将改变从法律到医学到文学的一切。


    当然，`斯坦福大学` 将成为全球立法者、政治家和创业者的活动中心，他们在做出任何关于人类的决定之前，必须去那里寻求官方批准。该学院由广泛代表不同国籍和肤色的人员组成，旨在向人类展示在全球范围内进行合作是什么样子的。理论上，`AI`
    将比人类更地了解一切，但是这些科学家将解读它的意志，就像异教宗教的祭司一样。


    `AI` 将被描述为对公众是危险的，这使得必须将其封锁在斯坦福大学的地库中，方便地隐藏了所有原始数据输入和决策过程不被独立分析。别担心，掌握权力的人从未滥用过它，特别是当他们像这些斯坦福天才们一样谦虚时。科技巨头是这种支持
    AI 运动的幕后推手，所以难怪他们也想一杯羹。2017 年，`Google` 将其营销重点转向“AI 优先”，将研究部门重命名为“Google AI”。


    '
