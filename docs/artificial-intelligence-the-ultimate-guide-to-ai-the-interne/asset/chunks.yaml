    \n### 引言\n那么，智能机器到底是怎么？它们很快就会决定侵权等问题吗？自动驾驶卡车和汽车呢？智能机器对和社会和人类职业未来产生什么影响？本书将带你领略\
    \ 21 世纪最迷人的话题之一——人工智能（AI），即计算机内部生物大脑的假设模拟。本书涉及的一些领域包括：\n\n* 媒体对关注的渴求如何传播 AI 迷思\n\
    *科技公司如何通过声称使用 AI 来获得更多资金\n* 科学家如何像崇拜神一样崇拜 AI 并将自己视为祭司\n* 人脑结构及其驱动它的冲动\n* 大数据及其对可能创造\
    \ AI 的影响\n* 制造思考型的理论方法\n* 开创性发明对社会的影响\n* 可能的 AI 实施，包括用案例 事实证明，像人类一样聪明的运行 AI 极是不可能的，而关于\
    \ AI 产生最大噪音的三个“派”都是出于自己的自私目的。通过汇集各种来源的信息和观点，本电子书旨在向你展示我们如何被煽入一种消费驱动的狂热，从而关闭我们的意识思考过程。那么，究竟发生了什么？请继续阅读寻找答案。\n\
    \n"
