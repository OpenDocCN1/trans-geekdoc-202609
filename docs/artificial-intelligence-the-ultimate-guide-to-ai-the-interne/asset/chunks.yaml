  fmt: "\n# Chapter 5: Mobile Robots\n\nMobile robots are robots that are capable\
    \ of locomotion. These robots are typically listed as a subfield to information\
    \ engineering as well as robotics. Mobile robots can move throughout their environment\
    \ and not be stuck in one place. Mobile robots can be autonomous or AMR (autonomous\
    \ mobile robots). This indicates that they can navigate through an uncontrolled\
    \ environment without guidance from human or electromechanical devices. On the\
    \ other hand, mobile robots are going to depend on guidance software that is going\
    \ to make it so that they can cover a route that has been pre-programmed while\
    \ in a controlled environment. These types of vehicles are known as autonomous\
    \ guided vehicles or AGVs. By contrast, factory robots are going to mostly be\
    \ stationary because they work with a jointed arm and a gripper assembly (they\
    \ can also work with an end-stage stimulus) that cannot be moved because it is\
    \ attached to its workspace.\n\nMobile robots are starting to be more ordinary\
    \ in factory and commercial settings. Medical centers have begun to use mobile\
    \ robots that can follow a predetermined route to move product that is too heavy\
    \ for human workers to move. Warehouses have started to install mobile robotic\
    \ systems so that the materials from the shelves can be efficiently moved to the\
    \ fulfillment zones. Current researches, as well as most universities, most often\
    \ concentrate on mobile robots. The security and military fields also make use\
    \ of mobile robots.\n\nDomestic mobile robots include entertainment robots that\
    \ can perform household tasks like gardening or vacuuming. The modules for mobile\
    \ robots will be the controller, the control programs, actuators, and sensors.\
    \ The controller is usually going to be a microprocessor that is tied to a distant\
    \ control or a laptop. The programs will be a scripting language of some sort\
    \ like `C` or `C++`. Sensors will depend on the conditions set for the robot.\
    \ The conditions could include processing skills, sensors to sense what is being\
    \ touched, how close they are to something, forming a map based off of its location,\
    \ or even the avoidance of collisions, and any number of other applications.\n\
    \n## Classification\n\nMobile robots fall under the following classifications:\n\
    \n1. **The environment where they travel**\n    - Arctic robots were invented\
    \ to navigate across ice and abyss-filled climates.\n    - Robots that are used\
    \ on land or in the home are usually called Unmanned Ground Vehicles or `UGVs`.\
    \ They are typically going to move on tracks or wheels but can also cover the\
    \ robots that have legs. These robots will consist of two or more legs.\n    -\
    \ `AUVs`, autonomous underwater vehicles, are what underwater robots are called.\n\
    \    - `UAVs`, uncrewed aerial vehicles, are what aerial robots are called.\n\n\
    2. **The device they use to move**\n    - tracks\n    - wheels\n    - legs\n\n\
    ## Robot Navigation\n\n1. **Physical distant or tele-op**: this robot is physically\
    \ teleoperated and is commanded by the driver by using a switch or other distant\
    \ control devices. The distant is going to either be plugged into a robot directly\
    \ or act as an attachment to a laptop or some other means of operation. A tele-op’d\
    \ robot will be utilized to make sure that the operator is safe. A few examples\
    \ of distant manual robots are the Robotics Design’s `Anatroller ARI-50` and `ARI-100`.\
    \ There is also KumoTek’s `MK-705 Rosterbot` and Foster-Miller’s `Talon`.\n\n\
    2. **Guarded tele-op**: this teleop robot is guarded and can detect and move around\
    \ obstacles but is going to navigate as it is driven. A manual tele-op robot can\
    \ be compared to this. There are not many moving robots that present only guarded\
    \ tele-op (if there are any).\n\n3. **Line-following car**: They would follow\
    \ a visual line that was embedded on the ceiling or floor or painted. They would\
    \ also follow an electric wire that was laid out on the floor. Many of these robots\
    \ function on a basic algorithm that was to “keep the line in the center sensor.”\
    \ These robots wouldn’t move around obstacles; instead, they’d stop and wait until\
    \ whatever was blocking their path was removed. You can still buy line following\
    \ cars because they are produced by `Transbot`, `FMC`, `Egemin`, `HK Systems`,\
    \ and several more. Robots like this are still popular in robotic societies because\
    \ they are the first step taken when learning about robotics.\n\n4. **Autonomously\
    \ randomized robot**: autonomous robots that have random motions are going to\
    \ bounce off walls even if they sense the walls.\n\n5. **Autonomously guided robot**:\
    \ They have a little bit of data about its destination and the information needed\
    \ to reach its goal or any places that it will need to stop on its route. Knowledge\
    \ of where the robot is currently can be determined thanks to at least one of\
    \ the following methods – sensors, vision, global positioning systems, lasers,\
    \ and `Stereopsis`. These location systems will typically use the `Monte-Carlo/Markov`\
    \ localization, relative position, and triangulation to figure out exactly where\
    \ the platform is for the robot to the next goal’s path. This robot can collect\
    \ readings from their sensors that are stamped with both location and time. Take,\
    \ for example, a `PatrolBot`. This robot acts as security that sends a notification\
    \ to the command center when emergencies happen, operates the elevators, and responds\
    \ to alarms. Other autonomously guided robots can be used in a hospital. Dr. Ahmed\
    \ Elgammal, a computer scientist, Dr. Simeon Kotchomi, a biologist, and Dr. Qingze\
    \ Zou, an engineer, helped the artist, Elizabeth Demaray, to create an autonomous\
    \ robot that has a capability of looking for water and sunlight for a potted plant\
    \ back in 2013.\n\n## Sliding Autonomy\n\nSome of the more capable robots are\
    \ combined with several stages of navigation under a system that is known as sliding\
    \ autonomy. Manual mode can be seen to most robots that are guided independently,\
    \ such as the hospital robot, `HelpMate`. The `Motivity` autonomous robot operating\
    \ system has been used with `MapperBot`, `SpeciMinder`, `PatrolBot`, `ADAM`, and\
    \ many other robots that present a range of autonomy that can go from being manually\
    \ operated to a guarded mode.\n\n## History\n\n| Time Period |\n| :--- |\n| 1939\
    \ - 1945 |\n| 1948 - 1949 |\n| 1961 - 1963 |\n| 1969 |\n| 1970 |\n| 1976 |\n|\
    \ 1980 |\n| Early 1980s |\n| 1983 |\n| 1986 |\n| 1987 |\n| 1988 |\n| 1989 |\n\
    | 1990s |\n| 1991 |\n| 1993 - 1994 |\n| 1994 |\n| 1995 |\n| 1995 |\n| 1996 |\n\
    | 1996 - 1997 |\n| 1999 |\n| 2001 |\n| 2002 |\n| 2003 |\n| 2004 |\n| 2005 |\n\
    | 2006 |\n| 2008 |\n| 2010 |\n| 2016 |\n| 2017 |\n"
  trans: "\n\n# 第 5 章：移动机器人\n\n移动机器人是能够移动的机器人。这些机器人通常被列为信息工程以及机器人学的一个分支。移动机器人可以在整个环境中移动，而不会被固定在某处。移动机器人可以是自主的，也可以是\
    \ AMR（自主移动机器人）。这意味着它们可以在没有人类或机电设备引导的情况下，在不受控的环境中导航。另一方面，移动机器人将依赖引导软件，这些软件使它们能够在受控环境中覆盖预设的路线。这类车辆被称为自动引导运输车（AGV）。相比之下，工厂机器人大部分是静止的，因为它们配合关节臂和抓取组件工作（它们也可以与末端执行器一起工作），这些组件由于固定在工作空间上，因此无法移动。\n\
    \n移动机器正在工厂和商业环境中变得日益普通。医疗中心已开始使用移动机器人，它们可以沿着预定路线移动人类工作人员无法搬动的沉重物品。仓库已开始安装移动机器人系统，以便将货物从货架高效地移动到订单履约区。目前的研究以及大多数大学通常集中在移动机器人上。安全和军事领域也使用了移动机器人。\n\
    \n家用移动机器人包括可以执行园艺或吸尘等家庭任务的娱乐机器人。移动机器人的模块将是控制器、控制程序、执行器和传感器。控制器通常是一个连接远程控制或笔记本电脑的微处理器。程序将是某种脚本语言，如\
    \ `C` 或 `C++`。传感器取决于为机器人设置的条件。这些条件包括处理能力、感知触碰的传感器、感知与物体距离的传感器、根据位置形成地图，甚至是避免碰撞，以及许多其他应用。\n\
    \n## 分类\n\n移动机器人分为以下类别：\n\n1. **它们运行的环境**\n    - 极地机器人的发明是为了跨越冰雪和充满深渊的气候区域。\n\
    \    - 在陆地或家庭使用的机器人通常被称为无人地面车辆或 `UGVs`。它们通常在履带或轮子上移动，也可以涵盖带有腿的机器人。这些机器人由两条或更多腿组成。\n\
    \    - `AUVs`，自主水下器，是水下机器人的称呼。\n    - `UAVs`，无人机，是空中机器人的。\n\n2. **它们用于移动的设备**\n\
    \    - 履带\n    - 轮子\n    - 腿\n\n## 机器人导航\n\n1. **物理远程或遥控**：这种机器人是物理遥控的，驾驶员通过开关或其他远程控制设备对其下达命令。远程设备将直接插入机器人，或者作为笔记本电脑或其他操作手段的附件。使用遥控机器人是为了确保操作员的安全。几款远程手动机器人的例子是\
    \ Robotics Design 的 `Anatroller ARI-50` 和 `ARI-100`。还有 KumoTek 的 `MK-705 Rosterbot`\
    \ 和 Foster-Miller 的 `Talon`。\n\n2. **受保护遥控**：这种遥控机器人受到保护，可以检测并绕过障碍物，但在驱动时进行导航。手动遥控机器人可以与此进行比较。没有许多移动机器人仅提供受保护遥控（如果有的话）。\n\
    \n3. **循迹车**：它们会遵循嵌入天花板或地板或绘制的视觉线条。它们还会遵循铺在地板上的电线。许多此类机器人运行在基础算法，即“保持线条位于传感器中心”。这些机器人不会回避障碍物；相反，它们会停下来等待直到阻塞路径的物体被移除。你仍然可以购买循迹车，因为它们由\
    \ `Transbot`、`FMC`、`Egemin`、`HK Systems` 等多家公司生产。这类机器人在机器人协会中仍然流行，因为它们是学习机器人学的第一步。\n\
    \n4. **自主随机机器人**：具有随机运动的自主机器人即使感知到墙壁也会撞击墙壁。\n\n5. **自主引导机器人**：它们拥有关于目的地的小部分数据，以及到达目标或路线上需要停靠的任何地方的信息。得益于至少一种方法——传感器、视觉、全球定位系统、激光和\
    \ `Stereopsis`，可以确定机器人当前的位置。这些定位系统通常使用 `蒙特卡洛/马尔可夫` 定位、相对位置和三角测量来确定平台到达下一个目标路径的精确位置。这种机器人可以收集带有位置和时间标记的传感器读取。以\
    \ `PatrolBot` 为例。这种机器人作为保安，在紧急情况发生时向指挥中心发送通知，操作电梯并响应报警。其他自主引导机器人可以使用医院。计算机科学家\
    \ Ahmed Elgammal 博士、生物学家 Simeon Kotchomi 博士和工程师邹庆泽博士在 2013 年帮助艺术家 Elizabeth Demaray\
    \ 创建了一个能够为盆栽植物寻找水和阳光的自主机器人。\n\n## 滑动自主性\n\n一些功能强大的机器人在一个被称为“滑动自主”的系统下结合了多个阶段的导航。大多数独立引导的机器人都有手动模式，例如医院机器人\
    \ `HelpMate`。`Motivity` 自主机器人操作系统已用于 `MapperBot`、`SpeciMinder`、`PatrolBot`、`ADAM`\
    \ 以及许多其他机器人，它们展示了从手动操作到受保护模式的各种自主范围。\n\n## 历史\n\n| 时间段 |\n| :--- |\n| 1939 - 1945\
    \ |\n| 1948 - 1949 |\n| 1961 - 1963 |\n| 1969 |\n| 1970 |\n| 1976 |\n| 1980 |\n\
    | 20 世纪 80 年代初 |\n| 1983 |\n| 1986 |\n| 1987 |\n| 1988 |\n| 1989 |\n| 1990 年代\
    \ |\n| 1991 |\n| 1993 - 1994 |\n| 1994 |\n| 1995 |\n| 1995 |\n| 1996 |\n| 1996\
    \ - 1997 |\n| 1999 |\n| 2001 |\n| 2002 |\n| 2003 |\n| 2004 |\n| 2005 |\n| 2006\
    \ |\n| 2008 |\n| 2010 |\n| 2016 |\n| 2017 |\n\n"
