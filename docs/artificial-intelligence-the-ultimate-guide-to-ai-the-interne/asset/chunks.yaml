  trans: '

    嗯，机器人基本上是会移动的计算机。因此，如果它们被黑客攻击，威胁将比台式计算机被攻击大得多。每当台式计算机被黑入时，黑客只能窃取信息并利用该系统攻击其他系统。然而，每当机器人被黑入时，它就可以被用来伤害他人甚至杀死他们，因为它可以移动。同时，一些机器人带有摄像头和麦克风，因为它们可以被用作间谍工具。仍有人认为这只会发生在电影或书籍中，但这些风险和威胁是真实的，已经有证据表明机器人曾伤害人类或破坏财产。


    例如美国劳工部拥有一份机器人相关事件清单，这些事件导致了数十死亡。在过去的 14 年里，机器人手术在美国与 144 例死亡有关。2016 年，中国的一台机器人打破了玻璃窗户，并伤了站在附近的人。机器人拥有的智能、力量和功能越强大，威胁就越大。波士顿动力（Boston
    Dynamics）发布过一段视频，展示机器人正在做杂技，以此展示公司的先进技术。现在，想象一下如果这项技术被黑了怎么办。如果一个具有这种强度和智能的机器人被黑入并收到恶意指令，会发生什么？话如此，友好机器人的安全性很容易被绕过，一个乐于助人且受信任的机器人可能会变得恶意并伤害财产或人员。


    ## 2. 霍霍金

    超过 1000 名技术专家、研究人员和科学家写了一封信，对自主武器的危险性发出警告。这封信由苹果联合创始人史蒂夫·沃兹尼亚克（Steve Wozniak）、斯蒂芬·霍金（Stephen
    Hawking）和埃隆·马斯克（Elon Musk）签署。


    这封信于 2015 年在一个国际人工智能会议上提交。它的出现是因为失控机器人是最近辩论的话题。在讨论禁止特定的自主武器时，联合国多个委员会对此进行了激烈讨论。科学专家一直试图禁止将不受人类控制的人工智能用于武器。他们甚至补充说，正如化学家和生物学家对制造生物或化学来源的武器没有兴趣，AI
    研究人员对制造 AI 武器也不感兴趣，不希望其他研究人员通过制造这些武器来嘲弄他们的领域。意识专家丹尼尔·丹内特（Daniel Dennett）、Google
    AI 负责人德米斯·哈萨比斯（Demis Hassabis）以及 MIT 教授诺姆·乔姆斯基（Noam Chomsky）也支持了这封信。斯蒂芬·霍金教授表示，“受限于缓慢生物进化的人类无法竞争[人工智能]，并会被取代。”


    ## 3. 伊恩·皮尔森博士

    皮尔森博士是一位自诩的未来学家发明家，他声称 AI 将比人类智能十亿倍，而与之融合是我们的最佳选择。


    皮尔森说：“我们会训练[人工智能]变得像我们一样，训练它像我们一样感受情感，但它并不像我们。它会有点像《星际迷航》中的外星人——行动更聪明、更有计算性。它对人类毫无感情，将我们视为野蛮。所以，当它决定用它创建的病毒进行自己的实验时，它会把我们当成实验鼠。”这就是埃隆·马斯克所担心的！这也与我们讨论过的
    AI 被黑入并用来对付用户有关。最后，这听起来像科幻电影里的情节，但它是可能发生的！这也是埃隆·马斯克花费数百万美元确保他正在监控所有机器人技术，以确保这种情况不会发生。


    ## 4. 欧洲

    今年早些时候，欧洲正在考虑提供在自然权利责任方面更先进的机器人。这项提议提交给了欧洲最高监管机构——欧洲委员会。


    有 150 多位医学、伦理、法律、机器人和人工智能领域的专业人士参与了辩论。在寄给欧洲委员会的信中，这些专家表示，这项提议似乎并非受现实世界的影响，而是更多科幻小说的影响。反对提议的人认为，如果为先进机器人提供法律地位，将使其能够对其造成的任何损害承担责任。委员会发言人表示：“人工智能可以为我们的社会经济带来巨大利益……但它引发了一些问题，例如与人工智能对我们社会的影响以及工作的未来有关。”审查该提议的专家表示，这可能允许制造商、所有者和技术人员在机器人犯错时声称他们对机器人不负责。专家进一步认为，赋予机器人法律地位是不恰当的，这种想法要归功于今年早些时候发表的科幻小说和煽动性的新闻发布。在法国阿尔图伊瓦大学工作的机器人伦理专家娜塔莉·内韦雅万斯（Nathalie
    Nevejans）是签署该信的专家之一。她说，机器人拥有法律地位不仅没有帮助，而且是不恰当的。机器人不可能离开人类操作的情况下成为社会的一部分，这在短期内不会改变。内韦雅斯被报道说：“法律人格将模糊人与机器之间的关系，使得立法者可以逐步转向向机器人授予权利。这在我们开发它们为我们服务的范围内将是完全适得其反的。”根据几位专业人士的说法，欧洲应该为人工智能和机器人制定规则，以促进创新并确保公民安全。然而，机器人主宰统治未来的愿景不应作为基础。这项提议是欧洲试图为未来做好准备的一部分。决议写道机器人需要向当局报告，而法律的编写方式则是机器人应该帮助人类并改善人类，而不是造成损害。然而，议会最终拒绝了这项提议，称如果机器人开始取代人类工人，那么它们的所有者必须缴纳税款或贡献社会成本。


    ## 5. 澳大利亚和加拿大总理

    数百名专家呼吁政府禁止具有决定人死能力的机器人武器化。


