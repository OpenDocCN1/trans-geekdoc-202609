    \nIntroduction So, what is the deal with intelligent machines? Will they soon\
    \ decide on things such as copyright infringement? How about self-driving trucks\
    \ and cars? What kind of impact will smart machines have on society and the future\
    \ of human jobs? This book will give you a glimpse into the most fascinating topic\
    \ of the 21st century—artificial intelligence (AI), a hypothetical simulation\
    \ of a living brain inside a computer. Some of the areas addressed in this book\
    \ include: •    How the media’s hunger for attention spreads AI myths •    How\
    \ tech companies get more funding by claiming they use AI •    How scientists\
    \ want to worship AI like a god and see themselves as priests •    The structure\
    \ of the human brain and the urges that power it •    Big Data and how it impacts\
    \ the possible creation of AI •    Theoretical methods of making a thinking computer\
    \ •    The impact of seminal inventions on society •    Possible AI implementation,\
    \ including use cases As it turns out, working AI that is as smart as a human\
    \ is highly unlikely, and the three “sides” that have produced the most noise\
    \ about AI have all done so for their selfish reasons. By compiling information\
    \ and ideas from various sources, this e-book aims to show you how we are all\
    \ being whipped into a consumer-oriented frenzy to shut down our conscious thinking\
    \ processes. So, what is actually going on? Read on and find out. "
