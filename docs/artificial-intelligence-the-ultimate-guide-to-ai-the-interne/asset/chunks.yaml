- raw: 'Chapter 8: Autonomous Vehicles Self-driving cars are also known as robot cars
    or autonomous cars or even driverless cars. They are vehicles that will sense
    the environment they are in and move without human input or very little human
    input. Autonomous cars are going to come with a variety of sensors that will help
    them to evaluate their surroundings like initial measurement units, GPS, odometry,
    sonar, computer vision, Lidar, and radar. There are also advanced control systems
