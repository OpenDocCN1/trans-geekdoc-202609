  trans: '


    # 第 10 章 – AI 与增长破解


    要使用 AI，你首先应该明确定义目标，以及如何通过机器学习来实现该目标。你将使用所谓的“增长破解”（growth hacking），这是一种创业范式，依赖于建立一个稳固的框架，并包含可重复的步骤，当你陷入困境时可以随时回到这些步骤上。就像藤蔓寻找最近的点进行附着，但始终保持向上攀爬以获得更多阳光一样，你也应该在坚持最终目标的同时，每天灵活地对
    AI 进行实施。


    增长破解依赖于稳定的数据源和可靠的数据分析方法。比其他任何事情，增长破解意味着无论你的项目涉及什么，你将采用科学的方法，而对客户想要什么或最终产品应该什么样没有任何无偏见。只有在收集并剖析数据以获得可操作的解决方案后，你才会利用一点创造力火花找到新的视角并爬得更高，就像藤蔓一样，重复整个过程。


    只有当你能够独立于任何 AI 完成这种增长破解之后，你才真正负担得起使用它的代价。AI 应该始终用于自动化那些我们已经知道可以产生工作结果、但缺乏时间或人力进行足够迭代的现有流程。AI
    的运作方式非常神秘，它可能提供落在统计误差范围内的解决方案。因此，准备好调整你的用例并对其进行实验，直到你对答案完全满意。起初，尝试简化你的问题，使其可以用“是”或“否”来回答，并让尽可能多的人参与回答每个问题。不要急于，只需建立稳固的基础。你经历的增长不应该是突然或爆炸性的，而应该是受控且管理的，否则意外的成功会让你应接不及。


    # 第 11 章 – AI 与修正假新闻


    制作新闻是一场苦差，这就是为什么许多网站使用点击诱饵，但他们至少没有为了影响选举而公然撒谎。另一方面，制造假新闻相当容易，在社交媒体上轻信用户的帮助下，它会像野火一样蔓延，长期来看影响国家。


    中国已经有一个解决方案——事实查机器人 `Meiyu` `[23`，它在社交媒体上陪伴用户，并自动修正他们在聊天中说的任何话。该机器人被描述为“台湾的”而非中国的，它是免费的——据说它的作用是在提到可疑文章时引用开源数据库，并且设计上不收集用户的个人数据。然而，它必须筛选用户信息，获取他们提到的所有数据以理解对话。它所做的只是创建一份报告，列出谁是传播假新闻的人，以便警察进行“友善访问”。


    如果这个机器人是免费的，那么所有者最初创建它的动力是什么？最可能的答案是中国政府资助了 `Meiyu`；特别是，打着风险投资旗号反间报部门，这在美国已经发生过。第二可能的答案是它收集私有数据以创建心理画像，并将其出售给广告公司。最后，它也可能确实是由一个意图良好的小角色开发者制作的，在这种情况下，前两种情况的参与者仍然可以切入并购买该应用，获得整个用户群和所有收集的数据，即使这些只是错误报告。


    用户并不喜欢 `Meiyu`，特别是当长辈在聊天中时——因为反驳长辈被认为是不礼貌的。`Meiyu` 最终看起来更像是一个反叛机器人而不是事实查机器人，它只是闯入对话做出随机断言，无论材料是否有任何真假。例如，`Meiyu`
    不同意通过喝更多水可以减轻流感症状，表示：“网络上有大量关于喝水的信息。医生说并非所有信息都是可靠的。”


    # 第 12 章 – AI 与大数据


    当人类与数字设备交互时，他们会留下信息痕迹，这就像雷达上的一个信号点；有了足够的信号点，人类就可以被可靠地追踪到最细微的细节，而这只需要一个单一的事实查 App。在
    App 开发者的总部，一系列机器静静地吸取所有安装了 App 的用户可能的数据，包括他们的短信、电话号码、用于三角测量位置的 Wi-Fi 网络名称等。在用户毫无察觉的情况下，他们的智能手机变成了间谍设备，而这恰是开发者不想收集数据的时候。


    如果一家科技公司想要收集数据，它可以创建特殊的系统，对数据进行标记和分类，这种方式可以让公司所有者免于责任，但允许完全的监控。就像微小的沙粒本身是不可觉的，但堆积在一起就会形成无法被扫到毯子下的沙丘，数据位可以堆积起来形成一个庞大的用户细节和习惯集合，揭示他们最私人的想法和秘密。本质上，这就是大数据，一组如此巨大且增长如此快以至于没有人类可以对其控制的用户数据。大数据被用于喂养和完善机器学习，而机器学习反过来又帮助建立大数据。


    人类对大数据能做什么？实际上可以做很多。如果你拥有一家可能收集用户数据的公司，请注意，大数据是黑客眼中肥肉的目标，黑客总能找到廉价、简单且低技术的方法来破解安全。针对健康客的最佳防御是：a)
    仅收集最小的用户数据，b) 在不再需要时立即删除所有用户数据，c) 对所有数据进行隔离，以便黑客无法一次性获取所有数据。


    这种方法被称为`设计安全`，涉及创建组件尽可能简单的服务和服务。结合深度防御，物理访问控制配合软件防护，这意味着将数据加密并锁在只有信任人员才能获得密钥的安全房间内。在专用硬盘上进行定期备份，并保持与互联网断开。


    如果你是一个为收集大数据的公司的程序员，请记住，在大多数情况下，任何服务或产品的用户都会使用默认设置。无论你设置什么为默认，你的用户在不检查甚至不知道如何更改设置的情况下就会使用它。此外，警惕`功能膨胀`（feature
    creep），即产品为了承担比其现实能实现的更多职责而发生转向，使其变得容易受到攻击。


    如果你是一个想让自己的数据排除在大数据之外的用户，请开始撒谎。每当被要求个人信息时（如姓名、电子邮件和出生日期），输入虚假回复——除非你真的要使用那些服务——并在你不使用的旧账户被用来给你发送垃圾邮件时删除它们。创建一次性邮箱账户并为所有内容选择长密码；密码长度是其强度的最佳指标，因此除非产品明确要求，否则不必使用大写字母、数字和特殊字符。如果你真的需要使用社交媒体，为每个平台使用独立的设备，并在你准备赠送或出售它们时，重置设备以清除所有个人数据。


    '
