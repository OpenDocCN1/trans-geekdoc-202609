- raw: "Chapter 13: Machine Learning and Artificial Intelligence Artificial intelligence\
    \ is an up-and-coming field that is getting more and more popular as the days’\
    \ pass. Artificial intelligence helps find solutions to things like where we want\
    \ to eat, how to fix the global food shortage, and what the weather is going to\
    \ be like tomorrow. At first, artificial intelligence was just science fiction,\
    \ and some people still think that it is nothing more than science fiction. However,\
    \ there is going to be artificial intelligence around us every day, including\
    \ that phone you use! Take, for example, you are using an iPhone, and you hit\
    \ the center button to ask Siri something. Well, guess what – Siri is artificial\
    \ intelligence. So are the bank notifications that you get about possible fraudulent\
    \ charges. Intel’s director of machine learning, Nidhi Chappell, has been reported\
    \ saying, “Artificial intelligence is basically where machines make sense, learn,\
    \ and interact with the external world without human beings having to specifically\
    \ program it.” Artificial intelligence has not only made our lives easier, but\
    \ it has improved it as well. Biometrics can measure how an athlete plays and\
    \ how serious an injury is and how it will ultimately impact their playing time.\
    \ On the other hand, farmers are using it so that they can know how much to water\
    \ their crops so that they are getting the highest yield. Doctors are even using\
    \ it so that they can detect diseases and track the treatment process of their\
    \ patients. You should think of the term artificial intelligence as an umbrella\
    \ term that machine learning is going to fall under because of the various techniques\
    \ and tools that will be used to allow a computer to think through mathematical\
    \ algorithms that are based on the data that you have obtained. However, it is\
    \ under this umbrella that you will also find machine learning’s subset, which\
    \ uses neural network models called deep learning that will use images so that\
    \ they can be processed and recognized by the program that is being used. “Think\
    \ of a child growing up. That child observes the world, notes how people interact,\
    \ learns society norms – without explicitly being told the rules,” Chappell said.\
    \ “That is the same as artificial  intelligence. It is machines learning on their\
    \ own without explicit programming.” It is also believed that artificial intelligence\
    \ will be able to do at least three things: 1\\. Take action based on the recognition\
    \ that it finds in the program. 2\\. Look at the world through any data patterns\
    \ that can be detected. 3\\. Recognize patterns in the world around us. Think\
    \ of it like this. You are going to post a picture on Facebook. And because of\
    \ facial recognition algorithms, Facebook is going to suggest that you tag friends\
    \ in your photo so that they can see the photo as well. Not only that, but it\
    \ is going to suggest pages and events based on the photo that you posted. So,\
    \ if you post a picture of you and your best friend swimming at the lake, you\
    \ are going to begin to see things that have to do with swimming because Facebook’s\
    \ algorithm is going to assume that you like to swim based on the photo. Machines\
    \ are always going to try and get smarter, which is going to result in people\
    \ making decisions faster and completing their research faster. Assuaging Skeptics\
    \ People will always be skeptical of the things that they do not understand. This\
    \ happens mainly because they are scared that machines are going to take over\
    \ as depicted in the movie Terminator . However, Chappell has been reported saying\
    \ that computers and the way that they learn is going to end up helping humanity\
    \ in more ways than people are ever going to realize. “Artificial intelligence\
    \ actually augments what human beings are doing. We are not trying to replace\
    \ humans. We are actually trying to augment them with more intelligence. This\
    \ is making our lives easier.” Artificial intelligence makes it so that you no\
    \ longer have to dig out a map to try and determine where you are and where you\
    \ are going. All you have to do is put in the address, and a voice will tell you\
    \ where you need to go. Not only that, but your phone will update each time the\
    \ road changes so that you are not going somewhere that does not exist or using\
    \ a road that is going to take longer for you  to get down when there is a faster\
    \ route. Machine learning and artificial intelligence will be used in the fields\
    \ of medicine, finance, and education. It will continue to keep society moving\
    \ along without as much harassment that is found online. Another thing that artificial\
    \ intelligence is going to help with is viruses such as Zika by looking at the\
    \ mosquito population and determining which ones are most likely going to carry\
    \ the disease. Managing Data Some of the most sophisticated learning will produce\
    \ data which will require machines to learn. This means that the higher the computer\
    \ is going to perform, the faster the computer will learn. “It is proven that\
    \ the more data you give to a machine to learn, the more accurate the machine\
    \ gets at predicting things,” Chappell said about the complexity of how machines\
    \ learn. The more complex the learning is, the more data requirements there are\
    \ going to be. Therefore, the more a computer learns, the more data requirements\
    \ are going to be put into place. When it all comes down to it, “artificial intelligence\
    \ is around us everywhere,” Ms. Diane Bryant, Intel Data Center Group’s General\
    \ Manager and Executive Vice President, said. “It is transforming the way that\
    \ people engage with the world.” \n\nConclusion Thank you for making it through\
    \ to the end of Robotics . It should have been informative and provided you with\
    \ all of the tools needed to achieve your goals, whatever they may be. The next\
    \ step is to use the knowledge that you have gained here and either move on to\
    \ learn more about robotics or to decide if you want robots in your life or not.\
    \ Not all robotics are evil, but it is up to you to do the research and figure\
    \ out if it is something that you want to risk or not. Robotics is in our lives\
    \ everywhere, and as technology continues to develop, there is a chance that you\
    \ will see robotics in your life even more. However, at the same time, with the\
    \ advances that we have seen in technology, there is a chance that we will see\
    \ the risks listed in this book not come to fruition. No one knows what the future\
    \ may hold, and you could be someone who helps to make robotics move forward and\
    \ become even better than it already is! Finally, if you found this book useful\
    \ in any way, a review on Amazon is always appreciated!    \n\nIf you enjoyed\
    \ this book, a review on Amazon would be greatly appreciated because it helps\
    \ me to create more books that people want. [Click here to leave a review for\
    \ the book.](https://www.amazon.com/Artificial-Intelligence-Ultimate-Internet-Comprehensive-ebook/dp/B083CW7NZM)\
    \ Thanks for your support! \n\nCheck out another book by Neil Wilkins [![En bild\
    \ som visar elektronik, skärm Automatiskt genererad beskrivning](rsrc1XW.jpg)](https://www.amazon.com/Internet-Things-Predictive-Intelligence-Cybersecurity-ebook/dp/B07PG317XS)\
    \ [Click here to check out this book!](https://www.amazon.com/Internet-Things-Predictive-Intelligence-Cybersecurity-ebook/dp/B07PG317XS)\
    \ \n\n[![](rsrc1XX.jpg)](https://www.amazon.com/Artificial-Intelligence-Learning-Recommender-Reinforcement-ebook/dp/B07N52D44W)\
    \ [Click here to check out this book!](https://www.amazon.com/Artificial-Intelligence-Learning-Recommender-Reinforcement-ebook/dp/B07N52D44W)\
    \ \n\n* * *"
