    ### 7. Is there going to be a point in time where call centers are not necessary
    anymore?


    As of right now? No. However, that can always change later on down the road depending
    on how technology can change thanks to robotics. The simpler tasks that can be
    handled through digital channels, thanks to various levels of automation, free
    up humans to deal with the more complex issues. Therefore, it is likely that robots
    and humans are going to work hand in hand in call centers.


    ### 8. What is the difference between Robotic process automation and artificial
    intelligence?


    Before this question can be answered, you have to know the context. Should a company
    say, “We are planning on integrating artificial intelligence programs into our
    business processes,” then they mean that they want to automate the process with
    a program’s robot. In this case, `RPA` and `AI` will be the same thing. In other
    situations, `RPA` solutions will automate processes with programs robots. These
    robots will be simple robots that do simple tasks, such as copying and pasting
    information into an `Excel` spreadsheet. Then, the more advanced `RPA` solutions
    will use machine learning to observe and learn how a human performs a task in
    order to automate it. `Artificial intelligence` describes a field of study that
    will try to automate human tasks like decision making. Therefore, `RPA` will use
    `AI` algorithms to perform complex tasks that have to have a degree of reasoning.
    There is an overlap in `AI` and `RPA`; however, not every `RPA` solution will
    be intelligent.


    ### 9. Why are experts looking into ethics when it comes to robotics?


    Ever since the first factory robots were introduced into car manufacturing during
    the 1950s, they have become a part of modern life. Robots were popularized by
    science fiction films and books, and they are only now becoming more visible in
    modern societies. Robots are now being used in factories all over the world. Drones
    are used in warfare while robots are being used to defuse bombs. Robots are beginning
    to replace workers in some service industries like shops and hotels. They can
    even be made to look like humans when caring for the elderly or being used in
    therapy for children with autism. Robots (especially the humanoid ones) owe much
    of their popularity to literature and science fiction. The presence of robots
    in homes, the workplace and society are having an impact on human behavior. They
    also represent changes that have been made in society and cultures. The report
    on methods will be aimed at trying to raise awareness about ethical issues that
    are tied to the use of autonomous robots in society.


    ### 10. How have robots been developed and how sophisticated could they be in
    the future?


    When you look at the encyclopedia of Robotics, you will see that it distinguishes
    between five generations of robots. The first generation came about before 1980,
    and it was a mechanical, stationary piece of equipment that was precise, fast,
    and physically rugged. This robot did not have any external sensors or artificial
    intelligence. The second generation was between 1980 and 1990, which had a microcomputer
    control and could be programmed. It also had vision systems, positions, and pressure
    sensors. The third generation that came about in the mid-1990s and later was the
    autonomous and mobile robots, which could recognize and synthesize speech. These
    robots came with navigation systems or teleoperated artificial intelligence. Finally,
    the fourth and fifth generations are the speculative roots that you will see in
    the future. These robots will acquire certain human characteristics, such as humor.


    ### 11. Why is the report looking at potential moral statuses of machines?


    A robot’s behavior – even if the robot is complex, autonomous, and intelligent
    – will be determined by a human. However, if we assume that robots are most likely
    going to become more sophisticated in the future, then the nature of their algorithms
    will be an issue that is going to require attention from an ethics standpoint
    – concerning how robots should react and act in specific situations. The problem
    with the development and utilization of robots is that other technological innovations
    cannot be planned or are not meant to happen, which can unintentionally harm humans.
    It is likely that the malfunctioning of today’s robots can cause much harm to
    many people. In the end, the question becomes not only if robots have to be respected
    on certain ethical norms, but if certain norms have to be programmed into the
    actual robots. Such a need will be apparent should one focus on personal robots
    and the ways that they could cause harm to humans. Robot autonomy is most likely
    going to grow to the point that their ethical regulation is going to be vital
    and they will need to be programmed with ethical codes that are invented specifically
    to prevent harmful behavior. An intriguing question about robots that have enhanced
    autonomy and capacity for decision making brings up questions of their moral status.
    Do robots deserve the same moral status?


    ### 12. Is intelligent assistance one of the only applications of artificial intelligence
    for customer care or are there other ways that artificial intelligence will impact
    customer service?


    The front end use of `AI` technologies is going to make it to where intelligent
    assistants for customer care are the key, but there are multiple other applications
    at play as well. One thing will be the application for `AI` to directly support
    contact center agents rather than replacing them. Natural language and speech
    recognition will be used during live customer service interactions with a human
    agent to find relevant information and make suggestions for how the agent should
    respond.


    ### 13. Is there going to be a point in time where call centers are not necessary
    anymore?


    As of right now? No. However, that can always change later on down the road depending
    on how technology can change thanks to robotics. The simpler tasks that can be
    handled through digital channels, thanks to various levels of automation, free
    up humans to deal with the more complex issues. Therefore, it is likely that robots
    and humans are going to work hand in hand in call centers.


    ### 14. What is the difference between Robotic process automation and artificial
    intelligence?


    Before this question can be answered, you have to know the context. Should a company
    say, “We are planning on integrating artificial intelligence programs into our
    business processes,” then they mean that they want to automate the process with
    a program’s robot. In this case, `RPA` and `AI` will be the same thing. In other
    situations, `RPA` solutions will automate processes with programs robots. These
    robots will be simple robots that do simple tasks, such as copying and pasting
    information into an `Excel` spreadsheet. Then, the more advanced `RPA` solutions
    will use machine learning to observe and learn how a human performs a task in
    order to automate it. `Artificial intelligence` describes a field of study that
    will try to automate human tasks like decision making. Therefore, `RPA` will use
    `AI` algorithms to perform complex tasks that have to have a degree of reasoning.
    There is an overlap in `AI` and `RPA`; however, not every `RPA` solution will
    be intelligent.


    ### 15. What are some opportunity areas that clients may go after that are considered
    to be “low hanging fruit”, and where do you see the next ones?


    `RPA` is not a process specific solution, and it is not the answer to everything.
    What it is, is the perfect tool for automating the gaps in the processes and systems
    being used. Whenever you are searching for opportunities that process, there is
    a good chance there will be a large number of people performing rule-based work
    and the data being inputted will have to be structured. Therefore, call centers
    are not suited for large-scale `RPA` and are better for the agent assisted solutions
    where the robots are on the agent’s desk. In the event that you are looking to
    have more of an impact in automating a process, you should look to where people
    are handling data on a large scale – places like `HR` because they are vetting
    employees and doing payroll.

