  trans: '


    # 第 9 章 – 基于恐惧的消费主义


    众所周知，人类使用性能增强剂、神经刺激剂——例如`coffee`——驱动全球经济。对于机器或 $AI$ 来说，与之对应的东西是什么？据我们所知，并没有这种东西——这意味着机器的表现可能超过人类，但其生产力顶多是线性的，无法跟上那些能够不断提升性能是是性能的人类。


    然而，使用性能增强剂确实有副作用。酒精危机在美国正在飙升，尤其是在女性中。`alcohol` 每年导致全球约三万人死亡，是一种大脑刺激剂，能降低抑制力并扭曲现实感。简单来说，`alcohol`
    让用户放松并生活在一个稍微好一点的世界里，即使过度使用确实会导致第二天出现宿醉。起初想要酒精的根本原因是压力——通常是为了在工作场所为了坚持下去而将身体推向极限界。创业者尤其倾向于使自己和周围的所有人处于不适、缺乏睡眠和痛苦之中，而我们实际上还因此崇拜他们。成为一个睡眠充足的创业者被视为异端，尽管睡眠剥夺是一种合法的酷刑手段，会引发精神症——一种使大脑碎裂的脱离现实的状态。


    总统和领导人在自传中为自己完全不睡觉做决定感到自豪，尽管他们指挥着军队和核武器库。我们如何把任何事情的未来托付给几乎没有睡过好觉的疯子呢？然而，我们不得不让所有人，从普通清洁工到总统，拼命工作直到早死，否则就没有机会在市场上保持竞争力。因此，过度的要求和缺乏睡眠导致了巨大的压力以及身体和心理的长期崩溃。咖啡因滥用在创新或应对压力方面也是另一个大问题。我们不把咖啡消耗视为问题——因为它在早晨能给我们带来提神感——但`caffeine`
    是一种长期来看会损害身体的刺激剂，特别是通过破坏睡眠模式，加剧了诱发精神症的问题。


    科技巨头的所有高管可能由于睡眠剥夺和刺激剂消耗而脱离现实，甚至不知道自己在做什么，只能依靠下方的精英人才阶层。极可能，科技巨头渴望 AI 接管仅仅是为了让他们最终能睡个好觉。那么，压力的真正原因是什么？从工程术语来说，压力是指结构或元件在崩溃之前所承受的特定数量的负载。对于人类来说，压力当我们感知周围世界是危险的时的认知负荷。成功做到这一点会在大脑中释放少量愉悦化学物质，帮助我们放松，让我们产生成就感和满足感。如果我们无法处理压力的来源，就会产生一些机制，例如寻找安慰食物——即高热量食物，通常营养少但味道好，以触发大脑中愉悦化学物质的释放。


    在 2007 年一项名为“压力、饮食与奖励系统”的研究中，加州大学的科学家研究了压力与沉溺安慰食物之间的联系。本质上，压力是对危险的进化反应，会触发短暂的“战斗或逃跑”反射，释放`adrenaline`和`cortisol`，这消耗身体并缩短寿命。压力是为了赋予我们超能力，让我们反击或逃避危险，但在日常生活中，特别是当你处于一个动态环境时，同样的压力反应可能会在毫无益处的情况下触发。所以，如果你在零售业工作，客户开始对你大吼，这会导致你的边缘系统认为自己正受到攻击并触发压力，导致你回回击（战斗）或畏缩（逃跑）。


    压力的解决方案总是将所有情况视为挑战而非危险源。这种视角的简单转变让我们使用新大脑皮层而非边缘系统，开发更高脑功能而非触发最基础的生存本能。本质上，将大大叫的客户视为挑战而非威胁，可能会让你用一句机默的话来回应，中断他或她愤怒的宣泄，并可能让他们大笑起来，将一个充满压力的局面变成轻松而有趣的局面，你们可以一起解决可能发生的任何问题，而没有任何压力。该研究检查了人们如何通过吃高热量食物（如饼干）来应对压力，这些食物会像药物一样触发大脑的愉悦反应；饼干成瘾可以使用`Naloxone`从大脑中清除，这是一种帮助药物成瘾者戒口的药物。不仅仅是人类通过这种方式缓解压力，因为即使暴露在极端危险中的老鼠最终也会上饼干或糖水，这等同于`soda`或果汁。


    大众不断处于压力状态，最终谁获益了？是生产和营销这些压力应对机制的公司，无论是食物、酒精还是其他缓慢破坏身体的恶习。本质上，我们的存在本身就不时涉及少量的压力，但身处繁荣的金融市场要求我们必须不断处于压力之中，否则我们就不会尽全力去赚取和花费更多的钱。从媒体到食品和娱乐的大型公司必须不断将我们推入一种压力驱动的狂热中，否则我们只会对自己拥有的极点东西感到满足，并过上平静的生活。


    因此，如果科技巨头决定他们需要终极经济增强剂，他们可能会宣布一个消除所有威胁的威胁——AI，一个神秘且无形的完美工人、顾问、爱人人和战士。我们不需要理会科技巨头关于
    AI 的末日阴影的宣告——因为我们现在有了另一种解释，说明了他们为什么会如此强烈地推动它。人类一直适应生活并将继续下去下去，只是现在你知道这一切都只是一个挑战，可以使用大脑中休眠的高功能来解决，而这些功能在我们因担心生命而产生压力时会不断被边缘系统所覆盖，这使我们变得完全可预测并最终安于现状。只要我们意识到这些可能性并有意识地构建自己的人生道路，没有任何外部因素可以违背我们的自由意志来塑造我们的行为。从一个不会感到恐惧、焦虑、愤怒或饥饿的人类的无压力视角来看
    AI，它取代该人类的可能性有多大？完全没有。


    '
