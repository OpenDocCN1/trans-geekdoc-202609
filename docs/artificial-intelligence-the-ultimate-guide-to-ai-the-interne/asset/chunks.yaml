    # 第 4 章 – 创建 AI 的动机


    拥有一个没有大脑、不思考、无感情但完全服从命令的自动机器，这种想法几年来一直令人类着迷。犹太传说赋予了我们 `golem`（魔像），一种由泥土或粘土制成的生物，通过在其额头上刻上魔法文字来赋予生命。这一行为模仿了上帝创造亚当的过程，正如《创世记》2:7
    所描述：“耶和华神用地上的土造了人，将生气气吹进人的鼻里，人就成了活人。”


    这也是为什么基督徒的葬礼仪式中包含“尘归归土”这句话的原因，它在提醒我们，那不可言喻的神性赋予了我们生命，但我们最终必须承认对自然秩序的顺从和服从。我们可以创造生命，但无法赋予无生命物体生命。


    这种制造 `golem` 的概念——获取无机物质并赋予其生命——概括了挑战上帝本身、成为生命的创造者、寻找成熟的捷径、对权力的渴望、傲慢以及想要逃避死亡（即不可避免地回到我们起源的尘土）的观念。像涉及魔像这样的故事之所以能在集体意识中流传是有充分理由的——它们向我们展示了运行在大脑中底层的、背景性的思维过程不断影响着我们的日常生活，就像在计算机上发生的一样。


    我们都想要更多的权力，无论这意味着更多的能量、更多的肌肉，还是只是对特定事情的发展有更多控制权。原因在于，那些渴望权力的祖先通常是获得权力并延续血脉的人；而那些温顺的人则被自然力量扫过并灭绝。我们携带的遗传密码是导致祖先生存和繁衍的行为合集，因此我们的基因迫使我们做同样的事。这是一种完全不自主的驱动，我们可以在某种程度上尝试遏制它，但迟早将不得不屈服。所以，我们会想要某种
    `golem`，尽管我们可能会给它一个不同的名字，并对这一行为附上奇幻的解释以安抚大脑的理性部分，但残酷事实是，我们需要更多权力来生存。


    顺便提一下：如果亚当是上帝创造的 `golem`，那么那个故事的结果如何呢？剧透一下——上帝给了亚当一个非常具体的指令，亚当不听从，因此被他的创造者遗弃并逐出乐园。那诱人品尝禁果的蛇可以代表一个微小的、意外之外的变量或影响，例如计算机病毒或漏洞。编写《创世记》故事的人敏锐地注意到无论有没有技术，某些行为模式似乎都在重复，并为所有后代留下了提醒，诚然这被包裹在宗教教学的外壳之下。看来，我们将通过
    AI 经历同样的《创世记》故事：试图制造一个顺从的仆人，它本应赋予我们力量，却因为某些随机的腐败影响而意外背叛我们。公平地说，这不是我们的错——我们使用的大脑既是最现代的生物机器，同时是最过时的机器。我们能够吸收海量信息并以完全新的方式将其连接，但我们也运行着源自穴人时代的过时生存指令，这些指令可以覆盖其他所有思想。例如，大脑告诉我们要吃掉周围所有的食物，因为大饱暴食的穴人人在匮乏时期生存了下来；而问题是，我们平均生活在热量如此充裕的环境中，肥胖是一个巨大的健康风险，但我们仍然渴望食物。这就像使用一台
    2 万年没有更新过的计算机，它不断启动一个我们必须不断关闭才能完成最基本的日常任务的应用。


    人类行为是所谓的“涌现属性”（emergent property），即一种此前未知的功能的自发出现。我们对人类行为如何以及为何出现几乎无所知，但我们可以进行推测。大脑由神经元组成，神经元是高度导电生物电元件，包裹在起绝缘作用的脂肪层中。它们本身做不了任何事，但当数以亿计的它们挤在头骨内、被喂养、保持舒适并允许联网时，它们就能产生人类意识、文化和自我认知。我们对任何过度复杂的事情都说“脑手术”是有原因的——我们每天使用大脑，但对它如何运作、为何失效以及如何修复却知之甚少。


    ## 与 AI 有什么关系？


    嗯，机器学习是赋予数字设备类似于生物大脑的适应能力，或者更具体地说，一个能够处理特定数据并为所有者提供实用神经元。当这些数字神经元连接成巨大的阵列时，它们以一种类似于神经元的方式指数级地增加彼此的处理能力。由于我们现在拥有一个充满了
    IoT 设备的环境，每个设备都能处理特定数据并为所有者提供实用价值，我们可能会获得一个如大陆般巨大的数字大脑和一个自发涌的 AI。


    这种数字大脑还会产生哪些涌现属性？我们不知道，但这对于科学家来说是最好的“让我们发现”的开端。我们知道的是，其他生物可以通过智能的方式组织起来，弥补个体力量的不足。`Volvox`
    是一种淡水藻，形成由多达 50,000 个单元组成的群体。其中的每一个都是独立的细胞并可以单独生存，但它们在一起时会同步移动、进食和繁殖。通过外的硬化细胞、能够感知光的原始眼睛，以及作为船桨引导整个群体向光移动（即能量源）的微小触手，`Volvox`
    是一个简单生物体如何协作创造出更大、更繁荣事物的例子。


    '
