    # 第 6 章：人工智能


    人工智能，又称为 AI，通常被称为机器智能，它是指在机器中显示的智能，相对于通常在人类及其他其他哺乳动物中看到的自然智能。在计算机科学领域，人工智能研究被列为对设备智能的研究，这些设备能够感知其周围环境并采取行动，以最大程度地增加其实现目标的成功机会。非正式地说，“人工智能”一词通常与能够模仿人类认知功能（解决问题或学习）的机器相关。定义中通常去除了
    AI 如何利用智能来完成任务的能力。这被认为是一种被称为“AI 效应”的现象，它导致了特斯勒定理中的一句格言：“AI 是任何尚未实现的事情。”例如，通过视觉进行特殊识别已成为常规技术。现代机器现在能够完成一些被归类为
    AI 的事情，因为它们可以成功理解人类语言，同时在象棋等高级策略性游戏中进行竞争。它们还能自主驾驶汽车，并足够智能到处理军事模拟和内容分发网络中的路由。


    Kaplan 和 Haenlein 将人工智能分为三个不同的类别，这些分类借用自管理学文献——人性化人工智能、启发型人工智能和分析型人工智能。分析型人工智能在理解和识别其决策中所考虑的认知元素和人类情感方面，仅具有与认知智能以及情感智能一致的特征。人性化
    AI 表现出每种能力（情感、认知、情感性智能和社交智能）的特征，并具有足够的自我意识和自我认知来与他人进行互动。启发型人工智能除了具备感知、社交和认知能力外，必须具有类人的外表。它们必须能够使用自然语言进行清晰交流。而被称为“嗅觉”的最新进展使根源与人类更加接近，因为它们现在可以识别气味了。


    1956 年左右，人工智能作为一门学术学科奠定了基础。在随后的几年里，人们经历了多次乐观主义浪，随之而来的是许多失败甚至资金问题。这被称为“AI 寒冬”，但它很快被新的
    AI 方法、胜利以及投入机器人研究的更多资金所取代。在很长的历史中，人工智能实验可以被分为若干子领域，这些子领域之间通常无法保持联系。子领域通常可以根据其技术考量，甚至是特定的目标（使用特定工具或分析差异）进行分类。这些子类别也可以根据机构或研究人员感兴趣的社会因素来创建。


    人工智能传统的目标或问题包括操作和移动物体的能力、自然语言处理、感知、学习、表示、规划、知识和推理。该领域的长期目标之一是通用智能。方法包括传统的符号 AI、统计方法和计算智能。AI
    使用各种工具，包括数学和搜索优化、人工神经网络以及基于经济学概率的方法。AI 经常借鉴语言学、哲学、心理学、信息工程、数学、计算机科学等领域。


    人工智能的建立基于这样一个主张：人类的智能“可以被描述得如此精确，以至于让机器来模拟它”。正是这种哲学论点，引发了关于大脑的其他讨论，以及在设计提供与人类相同智能系统的机器人和其他机器人时涉及的任何伦理问题，这些问题自古以来一直通过神话、哲学和小说得到了充分探讨。一些人认为，如果进步不受抑制，AI
    将对人类构成威胁。然而，也有人认为，与其他技术革命不同，AI 在审查失业问题时会引发巨大的问题。在 21 世纪，随着计算机能力、理论理解和海量数据方面的技术进步，AI
    技术和方法经历了复兴。人工智能方法已成为这一快速发展的行业的重要部分，并帮助解决了计算机科学、运筹学和程序工程中多个需要其关注的问题。


    ## 历史


    能够处理思维的机器人自古以来就一直在故事中详细描述，并出现在虚构作品中，如卡雷尔·恰佩克的《R.U.R.》或玛丽·谢莱的《弗兰肯肯斯坦》。这些角色及其命运带来了一些与我们现在讨论人工智能原则时所讨论的相同问题。对机器人推理的研究最初始于理论家和数学统计学家。对数学逻辑的检查最终引向了艾兰·图灵（Alan
    Turing）的计算理论，该理论表明机器可以通过对 `1` 和 `0` 等符号的洗牌来复制任何合理的数学推演行为。正是这种洞察促成了“丘奇-图灵论题”，即任何形式的推理过程都可以由数字计算机进行模拟。结合信息学、控制论和神经生物学的最新发现，研究人员开始认为电子脑的发展是一种可能。图灵提议：“如果人类无法区分来自机器和人类的反应，那么机器就可以被视为智能实体。”图灵完备（Turing-complete）人工神经元的设计被认为是人工智能领域的首项工作。它由
    McCulloch 和 Pitts 于 1943 年创建。


    人工智能研究领域首次始于 1956 年在达特茅学院举行的一次研讨会。出席者包括来自 `CMU` 的 Allen Newell、来自 `MIT` 的 John
    McCarthy、来自 `CMU` 的 Herbert Simon、来自 `IBM` 的 Arthur Samuel 以及来自 `MIT` 的 Marvin
    Minsky，他们所有人都被认为是人工智能研究的领袖和创始人。这些教授和他们的学生将继续产出被媒体认为不可思议的程序，而机器将能够完成一些被归类为 AI 的事情，因为它们可以成功理解人类语言，同时在象棋等高级策略性游戏中进行竞争。它们还能自主驾驶汽车，并足够智能到处理军事模拟和内容分发网络中的路由。


    *(注：此处省略了原文中重复的段落，以符合高级文档工程师的去重处理)*


