    Uncertainty in the headline is another favorite clickbait method. Curiosity is
    an extremely strong survival urge that helped us find new sources of food, so
    a clickbait headline hijacking this part of our brain could state “you won’t believe
    what happened next” or “you’d never imagine what he said next.” Often enough,
    the article doesn’t actually show what happened or was said next, but it doesn’t
    matter because the website got your click and earned that blasted fraction of
