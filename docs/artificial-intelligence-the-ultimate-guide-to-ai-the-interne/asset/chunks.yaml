- raw: "Chapter 11: Robotics in Business Robotics plays a very important role in business.\
    \ Now, this may make you think of a science fiction future; however, there is\
    \ a lot of business in a wide array of industries that are turning to robots to\
    \ complete a task that is too dangerous, laborious, or time-consuming for a human\
    \ to do. Factory Manufacturing A common task for robots to perform is on the product\
    \ assembly line in a factory space. Manufacturing robots handle tasks like welding,\
    \ sorting, assembling, and pack and place operation with more efficiency and greater\
    \ speed than a human. This strength to weight ratio of the electric motors is\
    \ going to make these robots reliable for tasks that require agility, strength,\
    \ and consistency. Factory robots reduce the risk of workplace accidents and ensure\
    \ more control over the product’s quality. They can also work in environments\
    \ that are not safe for a human. Marketing Technology companies have come up with\
    \ robots to demonstrate new inventions while creating a sense of innovation and\
    \ progress. These robots are part of an interactive display that can be seen at\
    \ trade shows where they are sent to compete with traditional marketing tools\
    \ to catch merchandise and bring them to an employee who is going to enter the\
    \ request into an automated system. These robots not only save time but reduce\
    \ errors that can be caused because of inconsistencies in inventory tracking.\
    \ Entertainment The last class of robots that are used in business are those that\
    \ are meant to entertain people. Robots and robotic displays will be seen in storefronts,\
    \ theme parks, and on television. These robots are crafted to resemble a real\
    \ person while others are meant to represent fantastical creatures or mechanical\
    \ robots from a fictional world. These characters populate science fiction narratives\
    \ while these special effects robots enter hazardous conditions that are not safe\
    \ for humans or animals. Robots Taking Over Jobs In 2017, it was estimated that\
    \ a third of US jobs were at high risk of  being automated by 2030, which is a\
    \ higher percentage than those in Britain, Japan, and Germany. This analysis came\
    \ from an accounting and consulting firm that said that it is based on the direction\
    \ and pace of technological progress and the anticipated capabilities of artificial\
    \ intelligence and robotics. It is estimated that at least 38% of jobs are going\
    \ to be at risk for automation in the United States. It is because more US jobs\
    \ in these sectors are more vulnerable than the same jobs in other countries.\
    \ It is believed that robots will take over because they are going to require\
    \ less management than a human employee. However, on the same hand, while a robot\
    \ is not getting paid salary or hourly, it still has to be maintained and upgraded\
    \ whenever new programs come out. Therefore, is it really worth it? Even if this\
    \ were true, it is still a long way away because of the cost of robots, not to\
    \ mention the moving of robots outside of a controlled environment is still a\
    \ large step that has not been taken yet. In the event of a robotic takeover,\
    \ certain jobs are going to be safe. This does not mean that robots are not going\
    \ to be used or help with these jobs, it just means that these jobs will not be\
    \ fully taken over: \n\n1.  Athletes, sports instructors, sports officials \n\n\
    2.  Firefighters, fire prevention, and fire inspection jobs \n\n3.  Yardmasters\
    \ and railroad conductors \n\n4.  Fitness and recreation workers \n\n5.  Forest\
    \ and conservation scientists \n\n6.  Public transportation attendants and inspectors\
    \ (earlier in the book, there was mention of an automated bus. However, it is\
    \ highly likely that these buses will have attendants on board in case the unexpected\
    \ happens.) \n\n7.  Locomotive operators, engineers \n\n8.  Early school teachers,\
    \ primary school teachers \n\n9.  Curators and archivists \n\n10.  Public servants,\
    \ detectives, police \n\n11.  Airline pilots and navigators \n\n12.  Surveyors,\
    \ cartographers, mapping scientists, and technicians \n\n13.  Actors, producers,\
    \ directors \n\n14.  School bus drivers \n\nRobotic Surgery Robotic surgery is\
    \ also known as robot-assisted surgery, and it allows surgeons to perform complicated\
    \ procedures with more precision, control, and flexibility that they do not have\
    \ when they are using conventional methods. Robotic surgery is going to be used\
    \ mostly with minimally invasive surgeries that are going to be performed through\
    \ a tiny incision. It is sometimes used with traditional open surgical procedures.\
    \ In 2000, robotic surgery first started with the FDA-approved da Vinci Surgery\
    \ System. This technique was quickly adopted into medical centers over the United\
    \ States and Europe to be used in treating a wide array of conditions. This clinical\
    \ robotic surgical system comes with a camera arm as well as a mechanical arm\
    \ that has surgical instruments attached to it. The surgeon will control the arm\
    \ while sitting at a computer console that is near the operating table. The console\
    \ will provide the surgeon with a high definition, magnified, 3D view of what\
    \ is going on in the surgical site. Advantages \n\n1.  fewer complications post-surgery\
    \ \n\n2.  smaller and less noticeable scars \n\n3.  less pain and less blood loss\
    \ during surgery \n\n4.  Quicker recovery time. \n\nRisks \n\n1.  infections \n\
    \n2.  postoperative complications \n\nWill robots take over the medical field?\
    \ Robots in the medical field are there to help enhance a doctor’s skillset and\
    \ make it safer for the patient when it comes to surgery. However, it is highly\
    \ unlikely that systems such as the da Vinci are going to take the place of a\
    \ human doctor. Human doctors can provide a warm and caring nature that sets a\
    \ patient’s mind at ease, unlike a robot. Not to mention, in the event that there\
    \ is a complication during surgery, a robot is not necessarily going to be trained\
    \ to deal with it and that is when a  surgeon is will step in and take care of\
    \ what is going on without putting the patient in harm’s way just to use an advanced\
    \ piece of technology. If anything, robotics is helping to advance medical technology\
    \ by reducing the risks that patients are experiencing after they have gone through\
    \ the surgery. Also, humans enjoy talking to other humans, and that is not possible\
    \ if there is not a human around to talk to. Robots do not have the bedside manner\
    \ that human’s do, which makes it to where they cannot provide the level of care\
    \ that a patient wants from their surgeon. This is why robotics will not take\
    \ over surgery, but it will enhance a surgeon’s skills so that they do not have\
    \ to worry about losing a patient because they are not cutting open a patient\
    \ and causing them to lose more blood than necessary. \n\nChapter 12: Robotics\
    \ FAQ  "
