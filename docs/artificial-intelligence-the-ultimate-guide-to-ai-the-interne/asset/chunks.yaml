    intelligence will usually be linked to a machine that can copy a human’s cognitive
    function problem-solving or learning. Definitions often remove how AI has the
    capability of using intelligence in completing tasks. This is considered to be
    a phenomenon that is known as the AI effect which can be lead to the quip that
    is found in Tesler’s Theorem that states “AI is whatever hasn’t been done yet.”
    Take, for example, special recognition through vision has become known as conventional
    technology. Modern machines are now capable of things that classify them as AI
    because they can successfully understand human speech while also competing in
    high-level strategic games like chess. They can also autonomously operate cars
