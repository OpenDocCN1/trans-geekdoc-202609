    While a learning algorithm sounds like the way to go, how are you going to create
    an algorithm for a neural network? Think about if you have a network for your
    perceptrons that you can use to solve problems. The inputs for the network are
    going to be like the raw pixel data that is scanned into the program so that the
    network can learn weights and biases for the outcome to be classified correctly.
    If you make any changes to the weight in the network, your outcome is going to
    correspond with the change that you made. However, the reality of perceptrons
    is that when a change is made to the weights, then there is the possibility that
    the perceptron is going to flip completely due to that change. This change is
    going to cause the behavior of your entire network to change completely into a
    more complex behavior. So, while one of your numbers is going to  be classified
