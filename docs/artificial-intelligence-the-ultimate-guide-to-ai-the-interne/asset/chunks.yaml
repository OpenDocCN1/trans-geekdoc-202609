- raw: 'Chapter 13 – AI and Employment In the current business environment in the
    US, IQ tests are forbidden as they lead to what is known as “disparate impact”,
    which essentially means a business can get sued if it filters out incompetent
    people. Even when there is an actual need to have an employee with a set of skills,
    the employer can still get dragged through courts and thrown to the media court
    of opinion, so most of them just sigh and hire people who barely contribute to
    the business alongside actually productive employees. This practice of hiring
    token employees just to follow an idealistic notion of a perfect pie chart, where
    every racial and national identity gets a slice, is simply unsustainable and likely
    harmful, but employers do it anyway simply to avoid getting flak from the media.
    In one such case that ended up in front of the Supreme Court, Ricci v DeStefano
    [\[24\]](#part0049.xhtml#a1VN) , a group of New Haven, Connecticut firefighters
    were jockeying for lieutenant and captain positions by passing a lengthy, costly
    exam. City authorities eventually threw out the results because not enough minority
    candidates passed the exam and the firefighters who should have gotten the promotion
    sued. The Supreme Court ruled that “race-based action like the City’s in this
    case is impermissible under Title VII unless the employer can demonstrate a strong
    basis in evidence that, had it not taken the action, it would have been liable
    under the disparate-impact statute.” In short, the exam was the best New Haven
    had, and that is what should have been used. Imagine the state of affairs where
    firefighters respond to a call but have no clue how to proceed because they have
    all been hired based on their skin, eye or hair color rather than the actual ability
    to save lives and property. Rather than hiring the strongest, most athletic and
    resourceful people, firefighting becomes a process of quenching the fires of social
    discontent where politicians jostle for favorable media coverage by pandering
    to the most basic of tribal urges. Those who dare point out the problem get lambasted
    in the media, no matter how they framed it or how right they are. However, there
    is no negotiating with an open flame that is truly indiscriminate in whom it roasts.
    Employers can’t even refuse to hire or outright fire a pregnant woman, even if
    her job involves handling toxic materials that might affect the fetus. Some 75%
    of all women with employment in the US will become pregnant during their career,
    forcing the employer to: a) write off any costs on hiring and training the woman,
    b) pay for any costs incurred, as pregnancy is considered a chronic health problem
    and c) find a replacement for the pregnant woman at their own expense. This stems
    from a Federal Pregnancy Discrimination Act of 1978 [\[25\]](#part0049.xhtml#a1VT)
    , brought about by another Supreme Court case where a pregnant woman sued General
    Electric because its disability insurance program didn’t cover pregnancy or childbirth.
    Courts all the way up to the Supreme Court affirmed that General Electric did
    no wrong because its disability program provided the same benefits to men and
    women, which is why Congress promptly adopted the Act to plug that neat loophole.
    Compare this outcome to how Chinese businessmen would handle it—they would gladly
    send pregnant women through the grinder by the truckload if that meant a minimal
    increase in productivity of their factories, and the Chinese government would
    approve. Do you now see why so many companies moved their manufacturing to China?
    Thanks to minimal worker rights and maximum profit, China is the perfect place
    to experiment with any new kind of business product. If AI really is coming and
    is going to displace human workers, it would make sense to leave manufacturing
    capability in the first world rather than ship it out, but that is not what’s
    happening. Foxconn is one especially egregious example, owning a massive factory
    campus in China where workers have their daily quota set out for them by the most
    productive echelon of workers—do better than that, and everyone else has to speed
    up or get fired. Everything from seating positions to worker interactions is strictly
    controlled and optimized. Workers that decide they can’t take it anymore usually
    end it all by jumping off the nearest campus building, which prompted Foxconn
    management to install safety nets that will make unhappy workers rethink their
    choices and deal with the shame of  being fired. Foxconn produces some 40% of
    all consumer electronics used globally, such as Playstations, iPhones, Nintendo
    3DS, and Xbox. The Western idea of workplace equality, where pregnant women and
    minorities get a cushy job position just because of anti-discrimination laws,
    seems idealistic and quaint in a way that a philosopher, who has never run a successful
    business, would imagine it being run; China is more efficient in every given aspect,
    though it produces immense suffering. Businesses can’t stay competitive if they
    have to deal with a constant barrage of complaints, lawsuits, and negative media
    headlines, which is why they generally create Human Resource (HR) departments
    to handle employee matters internally. HR deals with hiring and firing, acting
    like a thought-police that micromanages employees’ behavior to minimize legal
    liability for the employer. After the #MeToo scare, during which various women
    made claims of being sexually harassed by powerful men, Netflix’s HR department
    introduced a rule that a male and female worker can’t hold eye contact for more
    than five seconds at a time [\[26\]](#part0049.xhtml#a1XG) —since that is what
    “invokes powerful sexual desire”. Can HR do that? HR can do as it wills. HR handles
    job interviews with its own byzantine schemes, which are specifically designed
    so the potential employee can’t file a discrimination lawsuit. If you ever had
    the displeasure of suffering through six increasingly complex job interviews by
    the same company only to get rejected without a reason, now you know why—you were
    never considered for the job position in the first place, but the company had
    to put up a dog and pony show to minimize the chance of negative media coverage.
    The same thing goes with resumes, which are simply sent to the recycle bin save
    a select few—again chosen through “unknown divination rites”. However, what if
    an AI could do the hiring instead of HR? Incapable of discrimination or racial
    bias, which is what supposedly makes businesspeople avoid hiring minorities, an
    AI would be perfectly objective and always find the perfect employee without any
    need for an HR department. AI could also sift through Facebook and  LinkedIn profiles
    to find upcoming talent and hire it before anyone else, snapping up all the hottest
    employees for peanuts before they know their worth. An AI could be able to find
    a suitable job for everyone, ensuring nobody goes hungry or destitute, which would
    boost the economy, eliminate unemployment, and solve the problem of prison recidivism.
    Sound like a great future? Amazon actually tried making the perfect AI recruiter,
    but the results scared the engineering team working on it, and the project was
    quickly shut down—their digital brain consistently favored men over women, and
    there was apparently no way to tweak it without ruining it completely. Amazon’s
    emphasis was on automation, with the idea that an executive could feed the neural
    network 100 or more resumes to get the five most qualified people for the position
    [\[27\]](#part0049.xhtml#a1UP) . This kind of tool is a Holy Grail for all tech
    giants, as it would eliminate plenty of overhead related to hiring, but this project
    shows just how much progress we would have to undo. Right now, we all have to
    rely on a friend or relative to skip over the HR department anti-lawsuit moat,
    but the tool promised a bright future where nobody has to write or read a single
    resume. By using a training dataset that consisted of ten years’ worth of resumes,
    mostly those of men, Amazon’s job candidate finder neural network picked up on
    some 50,000 keywords related to productivity. The tool learned that any resume
    with the word “women” or “women’s” negatively affected that person’s productivity.
    In addition, job candidates from all-women’s colleges were extra penalized. Even
    after engineers made the tweak so that women were equal to men, the neural network
    was able to bypass the restriction and find another way of detecting if the resume
    belonged to a woman, penalizing it regardless. So, how did the tool evaluate resumes?
    Skills that were common among resumes were given low importance, such as the ability
    to write computer code. Aggressive, manly terms, such as “executed” and “captured”,
    were given higher importance as they showed ambition and remorselessness. What
    is interesting is that Amazon’s tool recommended that unqualified candidates be
    given all sorts of job positions, which  made engineers think it was just glitching
    and giving random results. However, the hiring process companies use right now
    relies on positive bias, meaning we expect better results from people who have
    provided similar results in the past, which makes sense but doesn’t give a chance
    to people who have talent but haven’t had the chance to get their foot in the
    door by going to a fancy university. The tool had no positive bias and recommended
    that Amazon introduces fresh blood at all levels because people without any experience
    have limitless potential. People who already have a filled-out resume have, in
    a sense, defined themselves, but naive schoolboys and girls could become anything
    and provide a novel perspective to any company’s inner working. It was a stroke
    of genius, one that can only be achieved by trawling through countless resumes
    and crunching trends to their constituent words and numbers to analyze them without
    the limbic system barging in. As companies grow, they mature from the startup
    phase, where they had to take a risk, to the corporate phase, where they wish
    to eliminate the risk that drove them in the first place. This makes established
    companies complacent, inert, and populated by all the same crusty executives that
    keep doing what their experience has taught them—except that is no longer enough
    in an eternally changing market. Of course, Amazon ignored this idea completely
    as an error and quietly shelved the entire project, but commented that it is committed
    to workplace diversity and equality because that is what the media want to hear.
    Other companies are trying different approaches, mainly by analyzing facial expressions
    to see what the job candidate thinks of themselves. HireVue is a startup that
    assesses video interviews instead of resumes to reveal flashes of insight from
    unconscious facial expressions made by tiny muscles around the eyes and mouth.
    As you have probably figured out by now, this kind of analysis is probabilistic
    and works most of the time in some cases; we have no way of knowing if the candidate
    has had, for example, a root canal that would cause a painful grimace on the day
    of the video interview. It is an intriguing idea but still doesn’t make the interviewing
    process fully automated. LinkedIn would be the vanguard in AI hiring, so what
    does LinkedIn think of it? John Jersin, VP of the LinkedIn hiring department says,
    “I certainly would not trust any AI system today to make a hiring decision on
    its own” and “technology is just not ready yet.” Well, that settles it. Transparency
    in AI-managed hiring processes is another problem—since there is no way to double-check
    the process or enforce workplace equality. There is already a term for this kind
    of problem: “algorithmic fairness”. The AI won’t hire you based off of some goofy
    keyword shenanigans, but at least it won’t throw you in jail, right? As it turns
    out, neural networks are already being used to jail people, especially those with
    a record of delinquency and/or a prior arrest record. '
