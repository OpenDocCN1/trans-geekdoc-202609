- raw: 'Chapter 5 – Basic Concepts The concept of machines that can evolve by learning
    from the environment has been discussed in the scientific community for nearly
    a century. As with all advanced paradigms, machine learning was first mocked,
    then considered, and then wholeheartedly embraced. The problem with machine learning
    is that computers don’t have a filtering mechanism to sort out information like
    living brains do, and they can’t create organizations of higher order like humans.
    We can quickly assess if something is unworthy of our attention to save our energy
    for actual tasks under the guidance of a smarter, more efficient person, but computers
    can’t handle the actual world in either way. Smart machines are thus fed filtered
    data arranged in sets, with their learning environment being kept completely sterile,
    so to speak. Exposing smart machines to the outside world usually ends in disaster
    as their frail brains become clogged with useless information. For example, there
    is a smart machine watching what you type into Google Search, and by being hooked
    into your personal profile assembled courtesy of Gmail, YouTube, and other Google
    services, can recommend personalized search results. You are not meant to know
    about this smart machine because you might want to feed it false information,
    corrupting the results it provides. If enough users did this, Google Search would
    essentially be rendered worthless. The structure of a smart computer is like the
    Congress in that it is made out of small, independent units that can vote on any
    given thing. When additional layers are built on top of this arrangement, we can
    think of it as creating the Senate, which can also add input on matters. Think
    about the prolonged political discussions that eventually have to boil down to
    a Yay or Nay vote; that is essentially how a smart machine works. Note that a
    smart machine takes in binary data but outputs probability, meaning it can be
    more or less certain about the result and thus we can rate any neural network’s
    quality by estimating how correctly it guessed what we wanted it to do, but it
    is never certain . With enough layers, we can start talking about a neural network,  where
    different layers have different weights attached to them depending on their performance.
    In short, the neural network can differentiate between units and their votes depending
    on how they performed in the past. Think of it as driving to work and barely listening
    to a voice on the radio but then giving your full attention to your boss at work;
    the neural network learns to ration its computational resources. At this point,
    machine learning becomes deep learning, where the neural network reorganizes itself
    according to its own principles that we don’t fully understand at speeds we can’t
    keep track of. Feeding the neural network consistent datasets and showing it what
    we want the result to be is called “reinforcement learning” and produces a highly-specialized
    smart machine. For example, showing images of dogs or cats will reinforce the
    concepts of “dog” or “cat”, but showing both will make the neural network much
    better at recognizing animals in general. Depending on what the intended use of
    the neural network is, scientists train it differently using data gathered from
    publicly available sources. When a neural network is attached to a specific piece
    of hardware, we can start talking about robotics, which is essentially giving
    a neural network a body. The robot can have different levels of mobility or just
    be stationary, like Alexa’s speaker that is meant to be put on the table and listen
    to occupants. Some advances have been made in letting the neural network decide
    where and how it wants to move in the world, but again, it is all workable while
    it’s in a safe, controlled environment; any interference by humans or animals
    usually wrecks the robot. When there are so many robots around us that they form
    their own neural network, but with hardware instead of software units, is when
    we can start talking about the internet of things (IoT). '
