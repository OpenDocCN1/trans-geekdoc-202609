  fmt: '

    Well, robots are pretty much computers that can move. Therefore, if they are hacked,
    then the threat is going to be bigger than if a stationary computer is hacked.
    Whenever a stationary computer is hacked, the hacker is only able to steal information
    and use the system to hack other systems. However, whenever a robot is hacked,
    it can be used to harm other people and even kill them because it can move around.
    At the same time, some robots have cameras and microphones because they can be
    used as an espionage tool. Some people still believe that this can only happen
    in the movies or books, but the risks and threats are real, and there has already
    been evidence where robots have harmed people or destroyed property.


    Take, for instance, the US Department of Labor that has a list of robot-related
    incidents that have led to a dozen deaths. Robotic surgery has been tied to 144
    deaths in the US over the last 14 years. In 2016, a Chinese robot broke a glass
    window and hurt someone who was standing nearby. The more intelligence, power,
    and functionality that a robot has, the bigger the threat is going to be. There
    was a video that was released from Boston Dynamics that showed a robot doing physical
    acrobatics which was to show off the company’s advanced technology. Now, imagine
    that this technology got hacked. What would happen if a robot of this strength
    and intelligence was hacked and received malicious commands? With this being said,
    it is easy for a friendly robot’s security to be bypassed and for a robot that
    is helpful and was trusted to become malicious and harm property or people.


    ## 2. Stephen Hawking

    There have been more than 1,000 tech experts, researchers, and scientists that
    have composed a letter that states a warning about the dangers of autonomous weapons.
    This letter was signed by Apple’s co-founder Steve Wozniak, Stephen Hawking, and
    Elon Musk.


    The letter was presented at an international AI conference in 2015. It came about
    because out of control robots are the most recent topic for debate. It has been
    heatedly discussed by multiple committees at the United Nations when it comes
    to placing a ban on specific weapons that are autonomous. Scientific experts have
    been trying to place a ban on artificial intelligence being used in weapons that
    can get out of human control. They even went on to add that just as chemists and
    biologists are not going to have an interest when it comes to building weapons
    of biological or chemical origins, the AI researchers are not going to be interested
    in building AI weapons and do not want other researchers to make a mockery of
    their field by creating these weapons. Daniel Dennett, a consciousness expert,
    DemisHassabis, the chief of Google AI, and Noam Chomsky, MIT professor, have also
    endorsed the letter. Professor Stephen Hawking stated, “humans, who are limited
    by slow biological evolution, couldn’t compete [with artificial intelligence],
    and would be superseded.”


    ## 3. Dr. Ian Pearson

    Dr. Pearson is a self-proclaimed futurologist and an inventor who claimed that
    AI is eventually going to be smarter than humans by a billion times and that to
    merge with it is our best bet.


    Pearson said, “We’ll have trained [artificial intelligence] to be like us, trained
    to feel emotions like us, but it won’t be like us. It will be a bit like aliens
    off Star Trek – smarter and more calculated in its actions. It will be insensitive
    to humans, viewing us as barbaric. So, when it decides to carry out its own experiments,
    with viruses that it created, it will treat us like guinea pigs.” In the end,
    it is what worried Elon Musk! This also ties into what we discussed about the
    AI being hacked and used to turn against its user. In the end, it sounds like
    something out of science fiction movie, but it is something that could happen!
    It is something that Elon Musk spends millions of dollars on to make sure that
    he is keeping tabs on all robotic technology to make sure it doesn’t happen.


    ## 4. Europe

    Earlier this year, Europe was considering providing robots that are more advanced
    in natural rights and responsibilities. This proposal was presented to Europe''s
    top regulator, the European Commission.


    There are over 150 professionals in medical science, ethics, law, robotics and
    artificial intelligence that weighed in on the debate. In a letter that was sent
    to the European Commission, these experts stated that it looked as if the proposal
    was influenced not by the real world but more by science fiction. Those against
    the proposal argued that if legal status were provided to advanced robots, it
    would make it to where they could be held accountable for any damage that they
    cause. A commission spokesperson stated “Artificial intelligence can bring major
    benefits to our society and economy… but it also raises questions, for example,
    related to the impact of AI on our society and the future of work.” The experts
    who examined the proposal stated that it could allow manufacturers, owners, and
    technicians to claim that they were not responsible for their robots when they
    did something wrong. Experts further argued that by granting legal status to a
    robot, it would be inappropriate and that this idea was thanks to science fiction
    and sensational press announcements that had been made earlier this year. A robotics’
    ethics expert, Nathalie Nevejans, who worked in France’s Artois University, was
    one of the experts to sign the letter. She says that robots having legal status
    are not only unhelpful but inappropriate. There is no chance that a robot can
    be part of society without a human operator, and that is not going to change anytime
    soon. Nevejans has been reported saying, “the legal personality would blur the
    relationship between the man and the machine so that the legislator could progressively
    move towards the attribution of rights to the robot. This would be utterly counterproductive
    to the extent that we develop them to serve us.” Rules should be created for artificial
    intelligence and robotics by Europe, according to several professionals, in order
    to foster innovation and ensure the citizens’ safety. However, a vision of a future
    where robotic overlords rule should not be the basis. This proposal was part of
    Europe’s attempt to be ready for what is to come. The resolution is written to
    say that robots will need to report to the authorities while the laws are written
    in a way to say that robots are supposed to help humans and better humanity while
    not causing damage. However, the parliament ended up rejecting the proposal saying
    that if robots started to replace human workers, then their owners would have
    to pay tax or contribute to social costs.


    ## 5. Prime Ministers of Australia and Canada

    There have been hundreds of experts that have called on governments to ban the
    weaponization of robots that have the capabilities to decide if a person should
    live or die.

