    1. If someone poses a threat, then two should be taken in a row, and then the
    remaining square should be taken; otherwise,

    2. should a move “fork” to create two threads at once, that move should be played;
    otherwise,

    3. If the center square is free, it should be taken; otherwise,

    4. if your opponent decides to take the corner, you should take the other corner;
    otherwise,

    5. if there is any empty corner, take one; otherwise,

    6. any empty square should be taken.


    Many AI algorithms can learn from the data that they gather, which can help them
    enhance themselves by learning new heuristics or help them write other algorithms.
    There are some learners that you will see described below that include the nearest
    neighbor, decision trees, and Bayesian networks that could potentially be helpful
    – should it be given an infinite amount of memory, time, and data to approximate
    any function, which includes whatever combination of mathematical functions that
    would best describe the whole world. These learners could move on to know everything
    by considering each possible hypothesis and then matching it to the data. In practice,
    it is never possible to consider each possibility thanks to the phenomenon of
    combinatorial explosion, where the amount of time that is needed to solve a problem
    ends up growing exponentially. Much AI research includes finding out how to identify
    and avoid any broad swaths of possibilities that are most likely not going to
    be useful. Take for instance that you are looking at a map and trying to find
    the shortest driving route from your hometown to the nearest metropolitan. You
    can, in most cases, skip going through all of the small towns or anything that
    is out of the way; which is something that AI would do thanks to a pathfinding
    algorithm. That way, each route is planned, and you do not have to worry about
    wasting time getting to your destination.


    ## Problems

    One of the overall research goals for artificial intelligence is to create technology
    that will allow other machines and computers to work in an intelligent manner.
    The overall problem for this is the simulating of intelligence, which has to be
    broken down into sub-problems. These will consist of a specific set of traits
    that are expected by the researchers to display an intelligent system. The traits
    are described below.


    ### Problem Solving and Reasoning

    Algorithms were created by early researchers that showed step-by-step reasoning
    that humans used whenever they were making a logical deduction or solving puzzles.
    Sometime in the late 80s and even the early 90s, a new method used in dealing
    with uncertain and incomplete information was created by the AI researchers. This
    employed an idea based on economics and probability. Each of these algorithms
    was then found to be insufficient when it came to solving large reasoning problems
    since they were experiencing combinatorial explosions, which meant that they were
    exponentially slower the bigger the problems grew. In fact, a step-by-step reduction
    is very rarely used by humans – which early AI researchers were using as a model.
    Humans usually use intuitive judgments to solve their problems.


    ### Knowledge Representation

    Knowledge engineering and knowledge representation are going to be the basis for
    classic AI research. There are a few expert systems that have attempted to piece
    together explicit knowledge that is possessed by experts in some narrow domain.
    On top of that, some projects have tried to gather the commonsense knowledge that
    is held by an average person piecing it into a database that contains extensive
    knowledge of the world. Among these things is the comprehensive, commonsense knowledge
    base that is going to contain properties, categories, objects, and relations that
    occur between events, times, situations, objects, and states. It also includes
    cause and effect, knowledge, and many other domains that are not as well researched.


    A representation of “what exists” is an ontology that sets properties, concepts,
    relations, and objects together so that a program’s agent can interpret them.
    Their semantics will be captured through individuals, description logic concept,
    roles, and are usually implemented as properties, individuals, and classes in
    the Web Ontology Language. Upper ontology, which is the most general ontology,
    acts as a mediator between domain ontology to try to provide a foundation to all
    the other knowledge. Some formal knowledge representations can be used with clinical
    decision support, content-based indexing and retrieval, and scene interpretation
    as well as knowledge discovery and many other areas.


    Knowledge representation’s most difficult problems include:


    1. **The qualification problem and the default reasoning**: Many people are aware
    of working assumptions. Take, for instance, if a bird comes up in your mind while
    you are talking to someone, then you can usually see a bird in your head and describe
    it well enough that someone else would know what you are thinking about. However,
    what you think you know about birds may not be the truth about every bird. In
    1969, John McCarthy identified this problem as a qualification problem: because
    there is going to be a large number of exceptions to any commonsense rule that
    AI researchers can represent. Almost nothing is simply marked as true or false
    in the way that abstract logic actually requires. AI research has to explore every
    solution to the problem.

    2. **The breadth of commonsense knowledge**: the number of atomic facts that a
    person knows is large. There are research projects that are trying to build a
    complete knowledge based on commonsense knowledge, but it will require a large
    amount of laborious ontological engineering which has to be built by hand one
    concept at a time.

    3. **The subsymbolic form of some commonsense knowledge**: what most people know
    cannot be represented as a fact or a statement that can be expressed verbally.
    Take, for example, someone who is good at chess. They are going to avoid certain
    positions because they feel too exposed, or even art critics can look at paintings
    and know that they are fake. These are subsymbolic institutions, and they are
    not conscious thoughts. Knowledge of this type provides, supports, and informs
    a context for conscious knowledge. As with this problem of subsymbolic reasoning,
    it is hoped that situated AI, statistical AI, or computational intelligence is
    going to provide a way to represent this type of knowledge.

