- raw: 'Chapter 14 – AI and The Legal System Across the United States, different counties
    are experimenting with neural network tools that give criminals risk scores, a
    probability on a 1-10 scale if they will offend again. One exhaustive ProPublica
    article [\[28\]](#part0049.xhtml#a1X3) describes a few cases of how this kind
    of software works and brings inside data about a prison system running on algorithms.
    When Brisha Borden, an eighteen-year-old black girl, stole a bike for a joy ride
    on her way to school, she was arrested and charged with petty theft and burglary.
    Computer algorithm analyzing her record (four juvenile misdemeanors) gave her
    an 8/10, meaning she was very likely to repeat the crime. Meanwhile, Vernon Prater,
    a 41-year-old white man with one attempted and two performed armed robberies,
    got arrested for shoplifting from Home Depot and got rated a 3/10 by the same
    system. Two years later, Vernon attempted grand theft, but Brisha didn’t do anything
    else, meaning the algorithm got it wrong. How come? The human mind doesn’t correctly
    understand probability and causes itself much grief in trying to figure out chances.
    When technology is introduced to the mix, it becomes an additional source of confusion
    because technology is never perfect. Just like you will see in a later chapter
    with a soap dispenser, technology is meant to work reliably with a certain acceptable
    range of inputs, but fringe cases may lead to it randomly failing. Furthermore,
    probabilities compound, so if we use inaccurate technology to double-check our
    guesstimate, the prediction will be much more inaccurate than if we just guesstimated.
    It sounds strange, but the math checks out. Imagine setting up a police checkpoint
    to catch drunk drivers. Drunk driving is a wicked crime—one that could be completely
    prevented by self-driving cars that would kill the driver if need be—that endangers
    lives for no good reason, so we have a noble goal and feel good about inconveniencing
    drivers. Also imagine a state-of-the-art breathalyzer that has 99% accuracy. Sounds
    perfect, doesn’t it? However, also assume that only one in a thousand drivers
    drive around drunk. What are the chances of catching the guy? Think carefully
    about the answer. If you stop and test 1,000 drivers, the breathalyzer, which
    errs in 1%  of cases, will show ten of them as being drunk while only one is actually
    drunk. Therefore, the breathalyzer has a 90% false-positive rate, and just falsely
    accused nine people of drunk driving. The worst part is that drivers will typically
    be so overwhelmed with guilt that they won’t dare challenge the breathalyzer.
    It is state-of-the-art after all, so how could it possibly be making any mistakes,
    let alone so many? When coupled with something like SCS, a false drunk driving
    accusation can lead to a cascade of mishaps that completely ruins someone’s life,
    and that is using a breathalyzer that’s 99% accurate! It turns out that, if an
    event isn’t all that common, the technology used to detect it has to have a margin
    of error lower than the chance of incidence or there is no advantage to using
    the technology in the first place. In fact, the less common an event, the more
    wildly inaccurate the results of detection and prediction. You can play around
    with the incidence of drunk driving in this thought experiment, and you will see
    it is only when 90% of drivers drive drunk that the breathalyzer’s margin of error
    equals the wrongful detection rate. It turns out that humans are much more precise
    than technology; just imagine a breathalyzer that has 50% or less accuracy. The
    police and courts know how often false positives happen but press on regardless
    because the general public needs to see that something is being done about crime
    to appease their limbic systems, even though completely innocent people are being
    punished. This thought exercise also shows that all those mandatory drunk driving
    checkpoints are completely meaningless because we are inconveniencing 999 drivers
    to catch that one guy who is driving tipsy. Therefore, this very simple thought
    experiment showed us that math is always the ultimate arbiter of efficiency that
    cuts through emotional nonsense and deprivation of human rights. You should always
    challenge the results of technology being used to prove something on the basis
    that: a) the operator wasn’t skilled enough, b) technology can randomly fail and
    c) rare occurrences can’t be reliably detected. Brisha’s and Vernon’s crime scores
    had nothing to do with the fact that she was a black girl and he was a white man,
    as  the article subtly framed it, but most likely that petty theft happens much
    more often than armed robbery, which means the algorithm assigned it a much greater
    likelihood of happening again. These algorithmic risk assessments are already
    used in courtrooms from Arizona to Wisconsin, with results given to judges during
    sentencing. The idea is to arrive at a number that shows how likely rehabilitation
    is going to work for any given defendant. In federal prisons, these kinds of assessments
    would become mandatory. As expected, political figures are latching on to “algorithmic
    unfairness” as an extension of systemic racism and bias, but it appears the explanation
    is much simpler than that—a tool used for risk assessment simply sucks. Created
    by a for-profit company Northpointe, the crime prediction algorithm used to assess
    Brisha and Vernor was said to be proprietary and thus not available for examination.
    What we do know about it is that 137 questions were answered by either the defendant
    or pulled directly from their file, such as education level and current employment
    status. Created by a statistics professor, the company was later on sold for an
    undisclosed sum to another company. If this kind of tool becomes mandatory in
    courtrooms, someone will be making a ton of cash. Previously, judges had plenty
    of leeway in how they wanted to treat the defendant, but political pressure to
    treat minorities better tied their hands—that is until they started using the
    risk assessment algorithms. Often attached as confidential documents during pre-sentencing
    to determine eligibility for probation, these scores were found to accurately
    predict recidivism about 61% of the time, with some variation depending on if
    the defendant was white or black. However, judges starting using them for sentencing,
    with some judgments even explicitly quoting the risk assessment score as the main
    reason for the harsh sentence. These have been challenged and successfully reduced.
    In Florida, Broward County uses the risk assessment score to determine if the
    defendant can be let out on bail, which the algorithm can also recommend to avoid
    jail overcrowding. The risk assessment algorithm doesn’t take into account that
    people  can change for the better or that people have free will. It is actually
    quite easy to challenge the algorithm: if it’s accurate, then free will doesn’t
    exist, and the punishment makes no sense because the defendant’s actions were
    predetermined; if it’s not accurate, then it shouldn’t be used at all—case dismissed,
    and the defendant is free to walk and might look into a career in law. The main
    way of fighting faulty technology is to challenge all conclusions drawn based
    on it, ask for insight into raw data based off of due process rights, and have
    a human expert or even the general public look into it. '
  fmt: "\n# Chapter 14 – AI and The Legal System\n\n## Overview\nAcross the United\
    \ States, different counties are experimenting with neural network tools that\
    \ give criminals risk scores, a probability on a `1-10` scale if they will offend\
    \ again. One exhaustive article describes a few cases of how this kind of software\
    \ works and brings inside data about prison system running on algorithms.\n\n\
    When `Brisha Borden`, an eighteen-year-old black girl, stole a bike on her way\
    \ to school, she was arrested and charged with petty theft and burglary. Computer\
    \ algorithm analyzing her record (four misdemeanors) gave her `8/10`, meaning\
    \ she was very likely to repeat the crime. Meanwhile, `Vernon Prater`, a 41-year-old\
    \ white man with one attempted and two armed robberies, got arrested for shoplifting\
    \ from Home Depot and got rated `3/10` by the same system. Two years later, Vernon\
    \ attempted grand theft, but Brisha didn’t do anything, meaning the algorithm\
    \ got it wrong. \n\nThe human mind doesn’t correctly understand probability and\
    \ causes itself much grief in trying to figure out chances. When technology is\
    \ introduced to the mix, it becomes an additional source of confusion because\
    \ technology is never perfect. Just like you will see in a later chapter with\
    \ `soap dispenser`, technology is meant to work reliably with a certain range\
    \ of inputs, but fringe cases may lead to it randomly failing. Furthermore, probabilities\
    \ compound, so if we use inaccurate technology to double-check `guesimate`, the\
    \ prediction will be much more inaccurate than we just estimated.\n\n## The Thought\
    \ Experiment\nIt sounds strange, but the math checks out. Imagine setting up a\
    \ police checkpoint to catch drunk drivers. Driving is a wicked crime—one that\
    \ could be completely prevented by self-driving cars that would kill the driver\
    \ if need be—that endangers lives for no reason, so we have a noble goal and feel\
    \ good about inconveniencing drivers. Also imagine a `breathalyzer` that has `99%`\
    \ accuracy. Sounds perfect, doesn’t it? However, assume that only one in a thousand\
    \ drives around drunk. What are the chances of catching the guy? Think carefully\
    \ about the answer.\n\nIf you stop and test 1000 drivers, `breathalyzer`, which\
    \ errs in `1%` of cases, will show ten of them as being drunk while only one is\
    \ actually drunk. Therefore, `breathalyzer` has a `90%` false-positive rate, and\
    \ falsely accused people of drunk driving. The worst part is that drivers will\
    \ typically be so overwhelmed with guilt that they won’t dare challenge `breathalyzer`.\
    \ It is state-of-the-art after all, so how could it possibly be making any mistakes,\
    \ let alone so many? When coupled with something like `SCS`, a false drunk driving\
    \ accusation can lead to a cascade of mishaps that completely ruins someone’s\
    \ life, and that is using `breathalyzer` that’s `99%` accurate!\n\nIt turns out\
    \ that if an event isn’t common, the technology used to detect it has to have\
    \ a margin of error lower than the chance or there is no advantage to using the\
    \ technology in the first place. In fact, the less common an event, the more wildly\
    \ inaccurate the results of detection and prediction. You can play around with\
    \ the incidence of drunk driving in this thought experiment, and you will see\
    \ it is only when `90%` of drivers drive drunk that `breathalyzer`’s margin of\
    \ error equals the wrongful detection rate.\n\nHumans are much more precise than\
    \ technology; just imagine `breathalyzer` that has `50%` or less accuracy. The\
    \ police and courts know how often false positives happen but press on regardless\
    \ because the general public needs to see that something is being done about crime\
    \ to appease their limbic systems, even though completely innocent people are\
    \ being punished. This thought exercise also shows that all those mandatory drunk\
    \ driving checkpoints are completely meaningless because we are inconveniencing\
    \ `999` drivers to catch that one guy who is driving tipsy. \n\nThis very simple\
    \ thought experiment showed us that math is always the ultimate arbiter of efficiency\
    \ that cuts through emotional nonsense and deprivation of human rights. You should\
    \ always challenge the results of technology being used to prove something on\
    \ the basis that:\na) the operator wasn’t skilled enough\nb) technology can randomly\
    \ fail\nc) rare occurrences can’t be reliably detected.\n\n`Brisha’s` and `Vernon’s`\
    \ crime scores had nothing to do with the fact that she was a black girl and he\
    \ was a white man, as the article subtly framed it, but most likely petty theft\
    \ happens much more often than armed robbery, which means the algorithm assigned\
    \ it a much greater likelihood of happening again. These algorithmic risk assessments\
    \ are already used in courtrooms from Arizona to Wisconsin, with results given\
    \ to judges during sentencing. The idea is to arrive at a number that shows how\
    \ likely rehabilitation is to work for any given defendant. In federal prisons,\
    \ these kinds of assessments would become mandatory.\n\n## Corporate Reality\n\
    As expected, political figures are latching on to “algorithmic unfairness” as\
    \ an extension of systemic racism and bias, but it appears the explanation is\
    \ much simpler than that—a tool used for risk assessment simply sucks. Created\
    \ by a for-profit company `Northpointe`, the crime prediction algorithm used to\
    \ assess `Brisha` and `Vern` was said to be proprietary and thus not available\
    \ for examination. What we do know about it is that `137` questions were answered\
    \ by either the defendant or pulled directly from their file, such as education\
    \ level and current employment status. Created by a statistics professor, the\
    \ company was later on sold for an undisclosed sum to another company.\n\nIf this\
    \ kind of tool becomes mandatory in court, someone will be making a ton of cash.\
    \ Previously, judges had plenty of leeway in how they wanted to treat the defendant,\
    \ but political pressure to treat minorities better tied their hands—that is until\
    \ they started using the risk assessment algorithms. Often attached as confidential\
    \ documents during pre-sentencing to determine eligibility for probation, these\
    \ scores were found to accurately predict recidivism about `61%` of the time,\
    \ with some variation depending on if the defendant was white or black.\n"
  trans: '


    # 第 14 章 – AI 与法律系统


    ## 概述

    在全美国，不同的县正在尝试使用神经网络工具，这些工具为犯罪分子提供风险评分，即在 `1-10` 的分值范围内衡量他们再次犯罪的概率。一篇详尽的文章描述了此类软件运行的几个案例，并带来了关于基于算法运行的监狱系统的内部数据。


    当 18 岁的黑人女孩 `Brisha Borden` 在上学路上偷了一辆自行车时，她被捕并指控小偷和入室盗窃。分析其记录（四项轻微罪）的计算机算法给出的分数是
    `8/10`，意味着她极有可能再次犯罪。与此同时，41 岁的白人男性 `Vernon Prater` 曾有一次未遂抢劫和两次武装抢劫，因在 Home Depot
    家装商店偷窃被捕，并被同一系统评为 `3/10`。两年后，Vernon 试图实施大盗窃，但 Brisha 什么也没有做，这意味着算法判错了。


    人类大脑无法正确理解概率，并在试图推算几率时会给自己带来很多困扰。当技术被引入其中时，它会成为额外的困惑来源，因为技术永远是不完美的。正如你稍后在章节中看到的
    `soap dispenser` 一样，技术旨在在特定的输入范围内可靠地工作，但边缘情况可能会导致其随机故障。此外，概率会产生复合效应，因此如果我们使用不准确的技术来复核
    `guesimate`（估测），预测结果将比我们仅仅估算的要糟糕得多。


    ## 思想实验

    这听起来很奇怪，但在数学上是说得通。想象设立一个警察检查站来抓捕醉驾。驾驶是一种邪恶的犯罪——可以通过自动驾驶汽车完全防止（汽车在需要时会杀死驾驶员），这无故危害了生命，因此我们有一个高尚的目标，并对给司机带来不便感到良好。再想象一个准确率达
    `99%` 的 `breathalyzer`。听起来很完美，对吧？然而，假设每千人中只有一人醉驾。抓到那个人的概率是多少？仔细思考答案。


    如果你停下来并测试 1000 名驾驶员，错误率为 `1%` 的 `breathalyzer` 会显示其中 10 个人是醉的，而实际上只有 1 个人醉了。因此，`breathalyzer`
    具有 `90%` 的误报率，并错误地指控了醉驾。糟糕的部分是，驾驶员通常会被负罪感淹没，而不敢挑战 `breathalyzer`。毕竟它是最先进的技术，它怎么可能出错呢，更不用说错这么多？当结合
    `SCS` 之类的工具时，虚假的醉驾指控可能会导致一系列连锁反应，彻底毁掉一个人的生活，而这还是在使用准确率达 `99%` 的 `breathalyzer`！


    事实证明，如果一个事件并不常见，那么用于检测它的技术的误差范围必须低于事件发生的概率，否则使用这种技术根本没有意义。事实上，事件越不常见，检测和预测的结果就越是离谱。你可以在这个思想实验中尝试调整醉驾的发生率，你会发现只有当
    `90%` 的驾驶员醉驾时，`breathalyzer` 的误差范围才等于错误检测率。


    人类比技术精确得多；想象一下一个准确率只有 `50%` 或更低的 `breathalyzer` 吧。警察和法院知道误报发生的频率，但无论如何都会坚持，因为普通大众需要看到政府正在对犯罪采取措施以安抚他们的边缘系统，尽管完全无辜的人正在受到惩罚。这个思想练习还表明，所有那些强制性的醉驾检查站都是完全意义的，因为我们为了抓那一个微醺的人而给
    `999` 名驾驶员带来了不便。


    这个简单的思想实验告诉我们，数学永远是效率的终极裁者，它切断了情感胡闹和对人权的剥夺。你应该始终基于以下理由对用于证明某事的结论提出挑战：

    a) 操作员不够练

    b) 技术可能会随机故障

    c) 罕见事件无法被可靠地检测。


    `Brisha` 和 `Vernon` 的犯罪评分与文章所微妙暗示的“她是黑人女孩而他是白人男性”这一事实无关，但更有可能是小偷窃的发生频率比武装抢劫高得多，这意味着算法分配了它再次发生的更高概率。这些算法风险评估已用于从亚利桑那州到威斯康星州的法庭，结果在量刑期间提供给法官。其理念是得出一个数字，显示对于任何给定的被告，康复成功的概率有多大。在联邦监狱中，这类评估将变成强制性的。


    ## 企业现实

    正如预期的那样，政治人物正抓住“算法不公”将其作为系统性种族主义和偏见的延伸，但解释似乎比这简单得多——一个用于风险评估的工具就是太烂了。这种由营利公司 `Northpointe`
    创建的、用于评估 `Brisha` 和 `Vern` 的犯罪预测算法据说是专利所有的，因此不可供审查。我们所知道的是，有 `137` 个问题由被告回答或直接从他们的文件中提取，例如受教育程度和当前就业状态。该公司由一位统计学教授创立，后来以未披露的价格出售给另一家公司。


    如果这种工具在法庭上变成强制性的，将有人赚大钱。在此之前，法官对于如何对待被告有很大的回旋地，但改善对待少数群体的政治压力限制了他们的手——直到他们开始使用风险评估算法。这些评分通常在量刑前作为机密文件附上，以确定缓假资格，被发现能准确预测约
    `61%` 的再犯率，具体取决于被告是白人还是黑人。

    '
