    However, in practice, you are going to have to set up a convention to deal with
    this so that you can interpret the outcome for at least half of the image which
    is going to indicate the number you want it actually to be. This means that any
    outcome that is less than half means that the outcome is not going to be what
    you want it to be. Big Data It seemed that 2012 was the year that the big data
    technologies came around and were everything to everyone. But in 2013 big data
    analytics became a thing. When you get a hold of substantial amounts of data,
    you are going to have to manage it, but you are also going to want to pull out
    the most useful information from the collections, and this is going to be a more
    difficult challenge. Big data is not only going to change the tools that you use,
    but it is also going to change the way that people think about the extraction
    and interpretation of data. Usually, data science is going to be trial and error,
    which is going to be impossible whenever working with datasets that are larger
    and heterogeneous. However, the more data that is available, there are usually
    going to be fewer options that are going to be constructed for  the predictive
    models due to the fact that there are not going to be many tools that are capable
    of processing a huge amount of information in a reasonable amount of time. Also,
    the traditional statistical solutions are going to focus on the analytics that
    is static, which is going to limit the analysis samples that are frozen in time
    and are typically going to give you results that are surpassed and unreliable.
    However, other alternatives are going to fix the problems that you have about
    research domains that are going to be expanded, and this is going to be machine
    learning. Statistics and PC science have applications coming out that are going
    to focus on the development of algorithms that are going to be fast and efficient
    for processing data in real time with the goal being to deliver predictions that
    are accurate. Some applications are going to be used in business cases, such as
    telling them how much product they should buy or to detect fraud. The techniques
    used in machine learning also solve application problems like figuring out statistics
    in real time as well as giving a reliable analysis by using generic and automatic
    methods to simplify the data scientist tasks. Machine Learning and Reversions
    When looking at statistical modeling, you will notice that reversion analysis
    is going to be the process of estimating the various relationships you see between
    variables. This is going to include the techniques that you use when analyzing
    and modeling several variables at once whenever you are focused on showing the
    relationship between an independent and dependent variable. Reversion analysis
    is going to assist you in understanding how the usual value for the dependent
    variable is going to change while the independent variable is not going to change.
    Reversion is also going to estimate the conditional expectation for the variable
    that is dependent based on the independent variable and the average value for
    that variable. Less commonly, you are going to see the quantile or the location
    parameters for the conditional distribution of the variable that is dependent
    based on what the independent variable is. In most cases,  your estimate is going
    to be an expression for the independent variable, which is going to be called
    the reversion expression. When dealing with reversion analysis, you are also going
    to be showing your interest in the characterization of the variation for the dependent
    variable against the expression which will be described as the probability distribution.
    One approach that you can take is a conditional analysis which is going to take
    the estimate for the maximum instead of the average of the dependent variables
    based on the independent variable that is given so that you can decide if the
    independent variable is necessary but not sufficient for the value that is given
    to the dependent variable. You are going to use reversion for forecasting and
    when it overlaps with machine learning. You will also use it as a way to understand
    the relationship between the independent and dependent variables. When dealing
    with a restricted circumstance, you can use reversion to infer the causal relationship
    between the variables. However, this can end up giving you a false relationship;
    therefore, you need to be cautious in using reversion. There are some techniques
    that you can use for reversion like linear reversion or least squares reversion.
    Your reversion expression is going to be defined in terms of finite numbers which
    are not going to have a known parameter. Nonparametric reversion is going to be
    the technique that is used when allowing the reversion expression to be used for
    a set of expressions which may cause infinite dimensional. Your reversion analysis
    performance is going to be the methods that you practice as a form of data generating
    processes and how it ties into the reversion approach that you use – being that
    the true form of data generating is not always going to be known since reversion
    analysis will then depend on the extent of the assumptions that you are making.  '
  fmt: "\n# Chapter 7: Machine Learning\n\n‘Machine learning’ refers to the subfield\
    \ found in PC (Personal Computer) science where PCs are given the tools needed\
    \ to learn without being programmed by a person. The evolution of this study included\
    \ pattern recognition and learning theory that can be found in the artificial\
    \ intelligence field. The machines are going to explore the study and learn how\
    \ to construct algorithms and make predictions with the data that is provided\
    \ for these algorithms like overcoming the static programming instructions. These\
    \ instructions are going to be driven by data for predictions or decisions by\
    \ using basic inputs of data to build a model. Algorithms are invented in computing\
    \ tasks and carried out with optimum performance. This is where you typically\
    \ employ machine learning. \n\nAn example of this is the sorting that your email\
    \ does in an effort to keep your email secure. Machine learning tends to overlap\
    \ with PC statistics where predictions are made through a PC that has strong ties\
    \ to optimize mathematical equations. This also makes it to where theories, methods,\
    \ and applications dominate the field. Data mining, which uses data analysis,\
    \ is often confused with machine learning. Unsupervised learning is what you also\
    \ call data analysis. Even if it is unsupervised, machine learning should also\
    \ learn to create a baseline for its behavior before finding meaningful anomalies.\
    \ In the data analytic field, machine learning is going to be used to create methods\
    \ that are complex along with algorithms that are going to be used in predictions.\
    \ These predictions are known as predictive analytics when used commercially.\
    \ The predictions are going to enable researchers, analysts, engineers, and data\
    \ scientists to make reliable decisions as a way to uncover any insights that\
    \ may be hidden by learning from data trends and historical relationships. Back\
    \ in 2016, machine learning was made a buzzword for the Gartner hype cycle while\
    \ it was at the peak of its inflated expectations. Due to the fact that finding\
    \ patterns is difficult, there is often not enough training to go around.\n\n\
    ## Tasks and Problems\n\nDepending on the learning’s nature, you can classify\
    \ machine learning into three categories:\n\n1. **Unsupervised learning**: labels\
    \ are not going to be given for the learning algorithms that are used which are\
    \ going to leave it to find its own structure in the input. You can use unsupervised\
    \ learning as a goal in finding patterns that are hidden in the data that you\
    \ are using or as a means to an end. \n2. **Supervised learning**: your PC is\
    \ going to be given inputs as well as the outcome that you are going to want so\
    \ that the PC can learn a general rule in how to map out the input and outcomes.\
    \ \n3. **Reinforcement learning**: there is going to be a PC program that works\
    \ with a dynamic environment to perform specific goals such as when you play a\
    \ game against an opponent. Feedback will be given to you by the program in terms\
    \ of rewards and punishments as it navigates the space of the problem.\n\nThere\
    \ is **semi-supervised learning** that is going to fall between supervised and\
    \ unsupervised. This is going to be when you are going to give training signals\
    \ that are not complete with the training set so that the program has to do some\
    \ of the work. **Transduction** is going to be whenever the principle takes on\
    \ the entire problem such as learning times. But this is not going to work whenever\
    \ targets are missing. \n\nMachine learning also includes categories such as **learning**,\
    \ where the program is going to learn the inductive bias of the program based\
    \ on experiences that have happened before. **Developmental learning** is going\
    \ to be the same as robot learning where the program is going to be able to generate\
    \ its own sequence from the learning situations that it is put through so that\
    \ it can learn novel skills by interactions with humans and other programs and\
    \ self-exploration.\n\nYet another category of machine learning is going to happen\
    \ when you consider what the outcome is from the machine learning system:\n\n\
    1. **The classification of inputs** is going to be divided into at least two classes\
    \ where the user is going to have to produce a model that is going to take the\
    \ inputs that are not seen by the user from these classes. This is going to usually\
    \ happen in supervised learning, such as when your email filters between spam\
    \ and not spam. \n2. **Reversion** is also going to be supervised for the outcomes\
    \ to be continuous instead of being discrete. \n3. **Clustering** is going to\
    \ take the input sets and divide them into various groups. However, the difference\
    \ between clustering and classification is that the groups are not going to be\
    \ known to the user before they are made, which makes this an unsupervised task.\
    \ \n4. **Density estimation** is going to locate the distribution for the inputs\
    \ in that space. \n5. **Dimensionality reduction** takes the input and simplifies\
    \ it so they can be mapped to the lowest dimension. \n6. **Topic modeling** will\
    \ take a problem from the program that is inserted by a user and tasked to see\
    \ if the documents that were inserted cover related topics.\n\n## Validation and\
    \ Evaluation\n\nA classification machine learning model is going to be validated\
    \ by a technique that uses accuracy estimation such as a `holdout`. A `holdout`\
    \ is going to split the data when training and testing your set before evaluating\
    \ the test set on the model’s performance. However, if you look at `n fold cross-validation`,\
    \ then you are going to see that the data will randomly be split into subsets\
    \ where the `k-1` instances are going to be used in training the model while the\
    \ `k-instance` is going to be used in testing the predictive ability for the training\
    \ model that you are using. Along with this, the `holdout` and the `cross-validation`\
    \ method is going to use samples for the instances where the replacement comes\
    \ from the dataset and how it is going to be able to in assessing the model’s\
    \ accuracy.\n\nOn top of that, there is an overall accuracy that an investigator\
    \ finds; it is going to be reported for specificity and sensitivity, such as the\
    \ true negative rate and the true positive rate – which means that the true negative\
    \ and true positive rates are sometimes going to report false positive rates or\
    \ false negative rates. However, it is these rates that are going to fail to show\
    \ the numerator and denominator for the equation. Your total operating characteristic\
    \ is going to be an effective method that is going to show the model’s diagnostic\
    \ abilities. Total operating characteristic will also reveal the numerators and\
    \ denominators that were mentioned previously, which will mean that the total\
    \ operating characteristic is going to show you more information than were able\
    \ to use with the `area under the curve`.\n\n## Ethics and Evolution\n\nDue to\
    \ what it is, machine learning often brings up ethical questions. The systems\
    \ that are trained to work with the data that you collect are going to be biased\
    \ based on the exhibits that are going to be used, which is going to digitalize.\
    \ Therefore, the responsibility that comes from data is going to be a big part\
    \ of machine learning. Due to the language that you use when dealing with machine\
    \ learning, you are going to be using machines that are trained. Neural networks\
    \ are paradigms that are biologically inspired to enable PC to learn from data\
    \ that is observed. Both `neural networks` and `deep learning` are going to give\
    \ you the best solution to any problem that you are working with image, speech\
    \ and natural language. The human system is complex and one of the most interesting\
    \ things that you can study because you are never going to fully understand how\
    \ it works.\n\n## Neural Networks and Perceptrons\n\nThe human system is complex\
    \ and one of the most interesting things that you can study because you are never\
    \ going to fully understand how it works. Take handwriting, for instance, many\
    \ people are going to be able to tell what is written. Recognizing handwriting\
    \ is not always easy, but your brain has adapted to where you will do it unconsciously.\
    \ It is not very often that we take the time to think of how complex visual system\
    \ truly is. Just like it is difficult to recognize patterns, PC is not going to\
    \ have these issues. However, it is going to be different than how we do it. Our\
    \ brains recognize shapes and how things are written out, but how do you tell\
    \ PC? You are going to have to make out rules and and exceptions to create.\n\n\
    The neural network approach is going to look at the problem in a different way\
    \ though. It is going to take a large number of numbers that are handwritten and\
    \ be trained to recognize the various shapes so that it can do what brain can\
    \ do. Essentially, the neural network is going to use the examples that are inside\
    \ of the data to infer rules that are set in place as their way to recognize numbers.\
    \ The more you add to the number of examples that train the program, the more\
    \ the network is going to be able to learn more options to improve its accuracy.\n\
    \nNeural networks are going to work with an artificial neuron that is known as\
    \ a `perceptron`, which was developed in the 60s by Frank Rosenblatt. But when\
    \ we look at it today, it is going to be used like other models of artificial\
    \ neurons. Your main neuron is going to be known as `sigmoid neuron`. To understand\
    \ the `sigmoid neuron`, you have to understand the `perceptrons`. Perceptrons\
    \ are going to take several binary inputs and give you a single binary outcome.\
    \ Rosenblatt came up with a single rule that will be used when dealing with the\
    \ outcome of perceptrons. This is where `weights` came in as a way to express\
    \ the real number, and they bring importance to the inputs and outcomes. The outcome\
    \ for the neuron is going to either be zero or one and determine the weight of\
    \ the sum and if it is less than or greater than the `threshold value`. Your threshold\
    \ value is going to be a real number that is going to be used in the parameters\
    \ for the neuron.\n\nThink of the `perceptron` as a device that is going to make\
    \ its decisions by weighing the evidence. For example, if you want to go on a\
    \ family outing, there are several things that you are going to have to look at\
    \ to determine if you are able to go on the outing as planned:\n1. Is the car\
    \ big enough for everyone that wants to go?\n2. Is the weather going to be good?\n\
    3. What do you need to pack for the amount of time that you are going to be out?\n\
    \nEach factor is going to be able to be represented by a binary variable. By looking\
    \ at the weights and the `threshold` for your problem, you can create different\
    \ models for the decision-making process. Your `perceptron` is going to be what\
    \ decides if you go on your outing or not. When you drop the threshold, you are\
    \ going to most likely go on your outing with your family. Keep in mind that your\
    \ `perceptron` is not going to be a complete model of the decision-making process\
    \ that a human can do. However, your `perceptron` is going to be able to weigh\
    \ different evidence to make the decisions that you need to make, which should\
    \ seem more plausible for a complex network of perceptrons that are going to make\
    \ small decisions that you may not notice are being made. \n\nWhile a learning\
    \ algorithm sounds like the way to go, how are you going to create an algorithm\
    \ for a neural network? Think about if you have a network for your `perceptrons`\
    \ that you can use to solve problems. The inputs for the network are going to\
    \ be like the raw pixel data that is scanned into the program so that the network\
    \ can learn `weights` and `biases` for the outcome to be classified correctly.\
    \ If you make any changes to the weight in the network, your outcome is going\
    \ to correspond with with the change that you made. However, the reality of `perceptrons`\
    \ is that when a change is made to the weights, then there is the possibility\
    \ that the `perceptron` is going to flip completely due to that change. This change\
    \ is going to cause the behavior of your entire network to change into a more\
    \ complex behavior.\n\nSo, while one of your numbers is going to be classified\
    \ correctly, your network is going to be behaving in a way that is hard to control.\
    \ Your network’s new behavior is going to make it difficult to see how your weights\
    \ and biases need to be modified. Therefore, there must be a clever way of getting\
    \ around this issue that may not be obvious: bringing in a new neuron known as\
    \ `sigmoid neuron`. These neurons are going to be like `perceptrons`, but they\
    \ are going to be modified so that when you make small changes, they are only\
    \ going to give you a small change in your outcome rather than chancing that your\
    \ outcome changes. This is vitally important, and the `sigmoid neuron` is going\
    \ to be enabled to learn the behavior of the network. `sigmoid neuron` is going\
    \ to have inputs that are similar to `perceptrons`, but it will be able to take\
    \ any value that falls between zero and one. \n\nThe `sigmoid expression` is defined\
    \ by this equation:\n```\nσ(z) = 1 / (1 + e^-z)\n```\nAnother way to look at it\
    \ is `sigmoid neuron` with your inputs:\n```\nσ(z) = 1 / (1 + exp(-∑xj-b))\n```\n\
    where `z = w·x + b` where you have a large positive number. Which then means `e^-z\
    \ ≈ 0` and `σ(z) ≈ 1` are equal. Now, think of it as if you were working with\
    \ negative numbers, then your `sigmoid` behavior will be the same as the `perceptron`.\
    \ The only time you are going to see the deviation from your `perceptron` model\
    \ is of modest size. But what is your mathematical form of `σ`? The truth of the\
    \ matter is that the exact form for this variable is not to impact because we\
    \ are going to focus on the shape of our expression. Should this function be a\
    \ step expression, then your `sigmoid neuron` is going to end up being a `perceptron`\
    \ due to the fact that the outcome would be either zero or one depending on if\
    \ your equation gives you a positive or negative outcome. When you use the function\
    \ for `σ`, then you are going to get a `perceptron` that is smooth. How smooth\
    \ your expression is, though, is not something you need to spend much time on.\
    \ The smoothness is simply going to modify the weights and bias which is then\
    \ going to change the outcome for your `sigmoid neuron`. Thanks to calculus, your\
    \ outcome is going to be predicted by this equation:\n```\nΔoutcome = ∂outcome/∂wj\
    \ + ∂outcome/∂b\n```\nYour sum is found over all of your weights and your outcome\
    \ is going to show a partial derivative for your outcome with the respect that\
    \ is needed for your weights. You should not get too worried if you find that\
    \ you are not comfortable with partial derivatives. Your expression above is going\
    \ to look complex due to all the partial derivatives that are in it, but you are\
    \ actually going to see that it is fairly simple by looking at your outcome as\
