- raw: "Chapter 10 – AI and Growth Hacking To use AI, you should first clearly define\
    \ the goal and how it is going to be achieved using machine learning. You will\
    \ be using what is known as “growth hacking”, an entrepreneurial paradigm that\
    \ relies on building a sturdy framework with repeatable steps you can always go\
    \ back to if you get stuck. Just like a vine finds the nearest point to latch\
    \ onto but always keeps climbing up to reach more sunlight, you too should improvise\
    \ daily implementing AI while staying true to your ultimate goal. Growth hacking\
    \ relies on having steady sources of data and reliable ways of analyzing it. More\
    \ than anything else, growth hacking means you will be having a scientific approach\
    \ to whatever your project entails, without any kind of prejudice as to what the\
    \ customers want or what the final product should look like. It is only after\
    \ the data has been gathered and dissected to reach an actionable solution that\
    \ you’ll be using a tiny spark of creativity to find a new vantage point and climb\
    \ up higher, just like the vine, to repeat the process all over again. Only after\
    \ you have managed to do this kind of growth hacking independently of any AI is\
    \ when you can actually afford to employ it. AI should always be used to automate\
    \ existing processes that we know can produce working results but lack time or\
    \ the workforce to iterate them enough times. AI works in mysterious ways and\
    \ might be offering solutions that fall within the bounds of statistical error.\
    \ Therefore, be prepared to tweak your use cases and experiment with them until\
    \ you have been fully satisfied with the answer. At first, try to simplify your\
    \ questions so they can be answered with “yes” or “no” and have as many people\
    \ participate in answering each question. Don’t rush anything and just establish\
    \ a sturdy foundation. The growth you experience shouldn’t be sudden or explosive\
    \ but controlled and manageable, or the unexpected success will overwhelm you.\
    \ \n\nChapter 11 – AI and Correcting Fake News Making news is an ordeal, which\
    \ is why so many websites use clickbait, but at least they are not outright lying\
    \ with the intent to influence elections. On the other hand, making fake news\
    \ is fairly easy, and, with the help of gullible users on social media, spreads\
    \ like wildfire to influence countries in the long run. China already has a solution—fact-checking\
    \ bot Meiyu [\\[23\\]](#part0049.xhtml#page_185) that idles with users on social\
    \ media and automatically corrects whatever they are saying in chats. Described\
    \ as being “Taiwanese” rather than Chinese, the bot is free—it is supposedly there\
    \ to cite an open source database when a dubious article is mentioned and is not\
    \ designed to collect personal data on users. However, it has to sift through\
    \ user messages, getting access to all the data they mentioned in order to understand\
    \ the conversation. All it has to do is create a report on who is the one spreading\
    \ fake news for a friendly visit from the police. If the bot is free, what is\
    \ the motivation for the owner to even create it in the first place? The most\
    \ likely answer is that the Chinese government funded Meiyu; in particular, counter-intelligence\
    \ services under the guise of venture investment, which is something that already\
    \ happens in the US. The second most likely answer is that it hoovers up private\
    \ data to create psychological profiles and sells them to advertising companies.\
    \ Finally, it might also genuinely be made by a small-fry developer who has the\
    \ best intentions, in which case actors from the previous two cases can still\
    \ swoop in and buy the app, getting the entire user base and all the gathered\
    \ data, even if it is only error reports. Users didn’t like Meiyu, especially\
    \ when elders were in the chat—since disagreeing with an elder is considered in\
    \ bad taste. Meiyu ultimately seemed more like a contrarian bot than a fact-checking\
    \ one, simply barging into the conversation random assertions regardless of whether\
    \ there was any truth to the material. For example, Meiyu disagreed that flu symptoms\
    \ can be lessened by drinking more water, stating, “The internet has a lot of\
    \ information on drinking water. Doctors say not all of it is credible.” \n\n\
    Chapter 12 – AI and Big Data When humans interact with a digital device, they\
    \ leave behind a trace of information that is like a blip on a radar; with enough\
    \ blips, a human can be reliably tracked down to the tiniest detail, and all it\
    \ takes is a single fact-checking app. At the app developer’s headquarters, an\
    \ array of machines quietly vacuums in all possible data from users who have the\
    \ app installed, including their text messages, phone numbers, Wi-Fi network names\
    \ to triangulate location, and so on. Without even realizing it, users’ smartphones\
    \ become spying devices, and that is when the developer doesn’t want to collect\
    \ data. If a tech company wants to collect data, it can create special systems\
    \ that are designed to label and sort data in a way that shields the company owner\
    \ from liability but still allows full-blown surveillance. Like tiny grains of\
    \ sand on their own are imperceptible but piled up create a sand dune that can\
    \ no longer be swept under the rug, bits of data can be piled up to create a monumental\
    \ collection of user details and habits that reveal their most private thoughts\
    \ and secrets. In essence, this is Big Data, an array of user data that is so\
    \ big and keeps growing so fast that no human can keep it in check. Big Data is\
    \ used to feed and perfect machine learning, which then helps build up Big Data\
    \ even more. What can humans do against Big Data? Quite a bit, actually. If you\
    \ own a company that might collect user data, be advised that Big Data makes a\
    \ juicy target for hackers, who can always find cheap, easy, and low-tech ways\
    \ to breach security. The best defense against hackers is to: a) gather only minimum\
    \ user data, b) delete all user data as soon as it is no longer needed and c)\
    \ compartmentalize all data so a hacker can’t get it all at once. This approach\
    \ is called security by design and involves creating the simplest possible services\
    \ and products with the fewest number of moving parts. Couple this with defense\
    \ in depth, where physical access control is buttressed with software protections,\
    \ meaning you keep data encrypted and locked in a secure room where only trusted\
    \ people get the key. Make regular backups on dedicated hard drives and keep them\
    \ disconnected from the internet. If you are a programmer working for a company\
    \ gathering Big Data, keep in mind that in the vast majority of cases, users of\
    \ any service or product go with default settings. Whatever you set as the default\
    \ is what your users will use without checking or even knowing how to change settings.\
    \ Also, beware of “feature creep”, where products get pivoted to take on more\
    \ roles than they can realistically fulfill, making them vulnerable to hacking.\
    \ If you are a user who wants to keep their data out of Big Data, start lying.\
    \ Whenever you’re asked for personal information, such as name, e-mail, and date\
    \ of birth, input fake responses—unless you’re actually going to use those services—and\
    \ delete old accounts that you are not using when they’re being used to send you\
    \ spam e-mails. Create burner e-mail accounts and choose long passwords for everything;\
    \ password length is the best indicator of its strength, so don’t bother with\
    \ capital letters, numbers and special unless the product explicitly demands those.\
    \ If you really need to use social media, use a separate device for each platform,\
    \ and reset the devices to clear all personal data if you are going to give or\
    \ sell them. "
