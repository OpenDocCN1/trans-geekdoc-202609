    It seems that in the future loneliness will be the biggest problem as we interact
    with one another through screens rather than in person. The problem arises because
    our brain is primed for receiving subconscious cues from other people that make
    us more aware of our surroundings and our social context, bringing us in touch
    with reality; without those cues, this vast neural machinery starts shutting down.


    Despite there being a potential for positive and negative experiences out in the
    real world, at least they are real in the true sense of the word and elicit some
    kind of maturity, but the digital ocean of clickbait experiences online aims for
    the lowest common denominator in our personalities to trigger fear, anxiety, and
    panic to keep us online for as long as possible.


    It has been known that isolation warps the mind, and extreme isolation can cause
    hallucinations and panic attacks, which is why solitary confinement is a real
    punishment for even the worst criminals. A series of experiments [\[36\]](#part0049.xhtml#a1WK)
    with sensory deprivation done on Canadian students had them fitted with an elaborate
    array of wearables designed to minimize brain stimulation: mufflers over the ears,
    blindfolds over the eyes, etc. After a few hours, students began showing restlessness,
    and past that, they started wildly hallucinating, seeing bizarre scenes that differed
    from one person to the next. Their mental performance degraded, and they couldn’t
    shake off the feeling that they were in a weird dream, with the room and objects
    in it spinning or changing shape well after they regained stimulation. None of
    them managed past the two-day mark.


    The reason for this is that the human brain is designed to absorb and process
    a massive volume of data, with any dearth in volume impacting it negatively; it
    is like a car that breaks down if it slows down, but the parts retain the inertia
    for a bit and spread out even when the car is no longer moving. Prolonged isolation
    makes for a tragic life, one where the brain gradually starts adapting to the
    solitude by making up elaborate fantasies and detailed worlds, often peppering
    them with imaginary visual experiences.


    When baby monkeys are isolated from the group, after 30 days they become completely
    unable to function with their brethren, their brains having been deprived of stimulation
    at their most vulnerable; children who go through the same become socially stunted
    to the extreme.


    Entrepreneurs also experience isolation as they abandon their social circle and
    family to chase business success. It is a willing sacrifice, one that numbs the
    mind and makes the entrepreneur unfeeling and uncaring, with a laser focus on
    the goal that ignores everything else. Later on, entrepreneurs overcompensate
    by indulging in lavish physical pleasures, but the simplest of human interactions
    simply aren’t there daily to keep their social circuitry running.


    Prisoners experience the worst kind of isolation, as their only human contact
    is with other prisoners and guards, both of which generally give them a hard time.
    In some cases, prisoners forgo any manners and adopt total aggression because
    they have lost that nuanced social calibration that comes through constant social
    contact. What do we do with these people? Do we just let risk assessment neural
    networks decide their fate, even if they recommend keeping them locked up in isolation,
    or do we keep trying to find a solution that will ultimately rehabilitate them,
    as bizarre as that might be?


    A common coping mechanism for persons in isolation is to find a higher, more abstract
    meaning to life. Rather than focusing on worldly pleasures, they can start to
    take joy in creating art, reading, or solving math equations. Religion helps as
    well, which is why monks retreat to the mountains for decades with scarce human
    contact as that lets them hear the word of God.


    All starting to make sense now? It is likely that entrepreneurs experiencing the
    same lack of human contact also start developing the same psychoses, making them
    think AI is coming. What makes isolation all the more tragic is that so many people
    sentence themselves to voluntary solitary confinement, opting for the pristine
    digital world instead of the messy physical one without having any entrepreneurial
    leanings to at least get a source of income up and running. Without human contact
    and a source of income, social skills wane, and the person becomes unable to keep
    eye contact or have a meaningful conversation without self-doubt. If there is
    a physical problem as well, in particular, one that impacts mobility, the person
    has no money to fix it and loses the social circle for good. It is a self-compounding
    problem that requires extensive rehabilitation, which might as well be done by
    AI.


    ## The Role of General AI


    In theory, if a general AI was made and available to the general public right
    now, what would be an easy and scalable solution to both personality problems
    and consequences of isolation? An AI could assess psychological risks in each
    individual and devise a personalized approach that would lead to behavioral improvements.
    One such AI could also present itself as the word of God to those eager to hear
    it and have its messages delivered through an `IoT` ecosystem that made them pervasive
    and inescapable.


    By giving small challenges to the person, the AI would slowly shift their brain
    into a higher gear and make them a functional part of society, also teaching them
    a thing or two about social calibration. Aggression wouldn’t scare the AI, who
    wouldn’t have the limbic system that panics in order to survive. With limitless
    patience and infinite wisdom, this word of God could slowly reprogram the person
    to become happy and more productive.


    Sounds too scary? Frankly, we have no other solution for anti-social personalities
    that have been thoroughly destroyed by lack of care and emotional connection.
    Knowing a person’s past and having access to digital records, the AI could take
    on the voice of an authority or just a relative the person will yield to. Failing
    that, the voice can simply be made to be as soothing as possible, lulling the
    limbic system into complacency.


    ## Healthcare and Data


    If that kind of system is added to the existing healthcare infrastructure, nurses
    and doctors get more time to deal with waves of paperwork and layers of administration.
    Coupled with the fact that chronic health problems require an entire network of
    carers to handle just one patient, we will most likely be needing AI—stat.


    An AI could be chatting with patients to keep them occupied while assessing their
    vocabulary, mental illnesses, or just general mood, producing a handy report for
    the doctor who can get the whole picture without wasting any time. The AI could
    automatically feed anonymized data to a database that would update it in real
    time, showing incidence in different kinds of strokes, injuries, cancers, and
    so on, which could help politicians develop health strategies as problems occur
    rather than twenty years after.

    '
  trans: '

    # 第 19 章 – AI 与孤独


    似乎在未来，随着我们通过屏幕而非面对面进行互动，孤独将成为最大的问题。问题的产生是因为我们的大脑天生为了接收来自他人的潜意识信号，这些信号让我们对周围环境和社交背景更加敏感，使我们与现实保持联系；没有了这些信号，这套巨大的神经机制就会开始关闭。


    尽管现实世界中存在正面和负面体验的可能，但至少它们在真正意义上是真实的，并能激发出某种成熟；而在线上点击党体验的数字海洋，旨在针对我们人性中的最低公约数，通过触发恐惧、焦虑和恐慌来让我们尽可能长时间地留在网上。


    众周知，隔离会扭曲思想，极度隔离会导致幻觉和恐恐发作，这就是为什么禁闭对于即使是最坏的罪犯来说也是一种真正的惩罚。针对加拿大学生的一系列感官剥夺实验[\[36\]](#part0049.xhtml#a1WK)让他们佩戴了一套复杂的设备穿戴设备，旨在最大限度地减少大脑刺激：耳朵上的隔音、眼睛上的眼罩等。几小时后，学生开始表现出坐立不安，之后，他们开始疯狂地产生幻觉，看到每个人都不一样的怪异场景。他们的心理性能退化了，无法摆脱那种正处于奇怪梦境的感觉，即使在恢复刺激后很长时间，房间和里面的物体似乎仍在旋转或改变形状。没有人挺过两天的关头。


    其原因是，人类大脑的设计是为了吸收和处理海量数据，任何数量上的短缺都会对其产生负面影响；它就像一辆减速时就会故障的汽车，但零件会保持一段时间惯性，即使在汽车停止移动时也会扩散。长期的隔离会导致悲剧性的生活，大脑通过构思复杂的幻想和详细的世界来逐渐适应孤独，往往在其中点缀想象的视觉体验。


    当幼猴从群体中孤离开时，30 天后它们完全无法与同伴生存，它们的大脑在最脆弱时期被剥夺了刺激；经历同样情况的孩子社交会变得极端化。


    企业家也会经历孤独，因为他们为了追求商业成功放弃了社交圈和家庭。这是一种自愿的牺牲，它会麻痹大脑，让企业家变得冷酷、不在乎，对目标保持激光般的关注而忽略其他一切。后来，企业家会通过沉溺于奢华的肉体享受来过度补偿，但最简单的人类互动并没有每天维持他们社交电路的运行。


    囚犯经历着最严重的隔离，因为他们唯一的人类接触是其他囚犯和守卫，两者通常都让他们不好过。在某些情况下，囚犯放弃了任何礼貌并采取完全的攻击性，因为他们失去了通过持续社交接触获得的细微社交校准。我们该如何处理这些人呢？我们是只让风险评估神经网络来决定他们的命运吗（即使它们建议将他们关在隔离中），还是我们继续尝试寻找一种最终能让他们康复的解决方案，无论这看起来多么荒诞？


    隔离状态下的人常见的应对机制是为生活寻找更高、更抽象的意义。与其关注世俗享乐，他们可以开始在创作艺术、阅读或解决数学方程中获得快乐。宗教帮助，这就是为什么僧侣们隐入深山十年，极少接触人类，因为那能让他们听到上帝的话。


    现在开始变得合理了吗？经历着同样缺乏人类接触的企业家可能也开始产生同样的精神疾病，让他们认为 AI 正在到来。让孤独更加悲剧的是，有许多人判处自己进行自愿禁闭，选择了纯净的数字世界而非混乱的物理世界，而他们并没有创业倾向来至少建立起收入来源。没有了人类接触和收入来源，社交技能就会萎缩，人将无法保持眼神交流或在不产生自我怀疑的情况下进行有意义的对话。如果存在物理问题，特别是影响活动能力的问题，这些人没有钱修复，并永远失去了社交圈。这是一个自我加剧的问题，需要广泛的康复，而这或许由
    AI 来完成。


    ## 通用 AI 的角色


    理论上，如果现在就制造出通用 AI 并向公众开放，那么解决性格问题和隔离后果的简单易行且可扩展的解决方案是什么？AI 可以评估每个个体的心理风险，并制定一种个性化的方法来改善行为。其中一种
    AI 还可以向那些渴望听取的人将自己呈现为上帝的话，并通过 `IoT` 生态系统传递其信息，使这些信息变得无处不在且无法逃避。


    通过给个人提供小挑战，AI 会逐渐将其的大脑切换到更高频率，使其成为社会的功能性的一部分，同时也教他们一些关于社交校准的知识。攻击性不会吓到 AI，因为它没有为了生存而产生恐慌的边缘系统。凭借无限的耐心和无穷的智慧，这段“上帝的话”可以慢慢重新编程，让人变得更快乐、更有效率。


    听起来太可怕了？坦率地说，对于那些被缺乏关怀和情感连接彻底摧毁的反社会人格，我们没有其他解决方案。通过了解一个人的过去并获取数字记录，AI 可以采取权威的声音，或者只是采取那个人会服从的亲属的声音。如果不如此，可以将声音调得尽可能和，诱导边缘系统进入现状。


    ## 医疗健康与数据


    如果将这种系统加入现有的医疗基础设施中，护士和医生就有更多时间来处理没不完的文件工作和层层行政事务。加上慢性健康问题需要整个护理网络来处理一个患者的事实，我们可能需要
    AI——立刻。


    AI 可以与患者聊天以让他们忙碌，同时评估他们的词汇量、精神疾病或普通心情，为医生生成一份方便的报告，让医生可以在不浪费任何时间的情况下掌握全局。AI 可以自动将匿名数据输入数据库并进行实时更新，显示不同类型的中风、伤病、癌症等的发生率，这可以帮助政治家在问题发生时而非二十年后制定健康策略。

    '
