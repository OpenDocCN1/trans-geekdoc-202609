    to create what is known as `clickbait`, instantly consumable articles with flashy
    headlines and little substance. Writers of such content are pushed to drive as
    much traffic to the website using any description that is not an outright lie,
    which often burns them out very quickly. There is entire machinery that produces
    clickbait on a steady basis, and once the curtain is lifted, you will never again
    enjoy 90% of “news” on the internet.


