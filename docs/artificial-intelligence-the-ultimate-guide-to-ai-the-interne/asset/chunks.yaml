    on the outing as planned: 1\. Is the car big enough for everyone that wants to
    go? 2\. Is the weather going to be good? 3\. What do you need to pack for the
    amount of time that you are going to be out? Each factor is going to be able to
    be represented by a binary variable. By looking at the weights and the threshold
    for your problem, you can create different models for the decision-making process.
    Your perceptron is going to be what decides if you go on your outing or not. When
    you drop the threshold, you are going to most likely go on your outing with your
    family. Keep in mind that your perceptron is not going to be a complete model
    of the decision-making process that a human can do. However, your perceptron is
    going to be able to weigh different evidence to make the decisions that you need
    to make, which should seem more plausible for a complex network of perceptrons
