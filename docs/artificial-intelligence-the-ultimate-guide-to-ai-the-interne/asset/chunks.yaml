    # AI 迷思术语


    关于 AI 的简化观点通过点击党内容流传。


    - **攻击面**：系统或网络被成功破解的概率。随着复杂性的增加呈指数级增长。

    - **后门**：用于间谍活动和未经授权访问的隐藏访问能力。

    - **大数据**：通过使用各种软件和硬件对人类提供的数据点进行广泛自动收集和标记的结果。

    - **点击党**：旨在吸引网络用户访问的内容，其唯一目的是为了给托管该内容的网站网站赚取广告收入。它会触发边缘系统。

    - **网络空间**：数字世界。物理三维世界的规则并不一定适用于那里。

    - **深度学习**：根据我们无法完全理解的规则进行自我升级的智能计算机程序。

    - **深度防御**：通过层层廉价、简单的反黑客措施，让黑客因挫败而放弃。

    - **涌现属性**：系统的一种非计划性但有用的属性。

    - **功能蔓延**：缓慢扩大软件产品的范围，在实用性略微增加的同时增加了其攻击面。

    - **自由意志**：覆盖边缘系统行为的能力。

    - **通用 AI**：类人类的 AI。可能成为恋人或顾问。

    - **黑客攻击**：人类在计算机系统中寻找漏洞的机智。

    - **物联网**：在人类与物理世界之间调解的机器人层。

    - **内核**：计算机的核心部分。用户无法动它。

    - **边缘系统**：人类大脑的核心。痴迷于生存。

    - **机器学习**：任何可以根据其接收的数据改变其输出的软件。

    - **最小可行性产品**：公司在不因虚假广告被起诉的情况下，可以在一个产品中投入的最少功能。

    - **窄 AI**：高度专业化的 AI，也许和蚊子一样聪明。

    - **神经网络**：分层机器学习，智能机器能够组织并升级其自身。

    - **机器人学**：赋予神经网络一个功能有限的物理躯体。

    - **SCS**：参见社会信用体系。

    - **设计即安全**：通过创建精简版的服务来最小化攻击面。

    - **奇点**：AI 在所有方面都超越人类，并成为超级 AI 的点。

    - **社会信用体系**：一种像游戏一样的中国机制，根据公民对国家的价值进行评分，以决定谁有权接受教育和使用公共交通。

    - **压力**：身体和心理的长期崩溃。终极生产力加速器。

    - **超级 AI**：将以我们无法理解的方式进行思考的神灵般的 AI。

    - **禁忌**：代代相传的神圣规则，绝不能质疑或违反。

    - **图灵完备**：最初指可以欺骗人类使其认为自己也是人类的计算机程序。现在这被认为是一个内部笑话，因为人类在不断进化。

    - **UBI**：通用基本收入。它被推为解决 AI 导致人类失业的万能答案。

    - **UX**：考虑了用户边缘系统的编程范式。

    - **VAR**：自 2018 年以来足球中广泛使用的视频分析工具集，用于检测违规动作。


    ## 第二部分：机器人学


    初学者需要了解关于机器人流程自动化、移动机器人、人工智能、机器学习、自动驾驶车辆、语音识别、无人机以及我们未来的知识 ![](img/rsrc1XV.jpg)


    ### 引言


    接下来的章节将讨论你了解机器人学所需的一切知识。当你观察周围的世界时，越来越多的机器人技术正被应用到我们的生活中。由于机器人学在我们生活变得变得越来越重要，了解机器人是如何运作的以及一些关于机器人的迷思是至关重要的。书中有很多主题，你将读到关于一些专家以及他们对机器人学的看法。在决定将其斥为骗局或更糟的东西之前，了解关于机器人学的一切是非常重要的。


    '
