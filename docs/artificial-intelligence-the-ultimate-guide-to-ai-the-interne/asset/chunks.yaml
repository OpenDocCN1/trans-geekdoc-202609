    # Chapter 3 – Manipulating the Limbic System


    The way the human brain has been arranged by millions of years of evolution has
    centered on survival, which is why we can feel such strong fear and anger, both
    emotions that help us deal with danger. So, how is the human brain structured?
    Individual neurons are jammed together in a tough bone sheath and can network
    to exchange and reshape impulses from the outside world. How these neural pathways
    formed in childhood and how they communicate afterward is called “personality”,
    a distinct set of preferences that we take great pride in, without even realizing
    how much of it is beyond our control or choosing.


    At the basis of our brain is the `limbic system` that deals with core bodily functions,
    such as breathing and body temperature. That is the primal part of the brain that
    houses weird urges and phobias but also impulses, such as hunger, lust, and anxiety.
    The `limbic system` is encased in the `neocortex`, the part of the brain containing
    higher brain functions, such as logic and sense of humor. The `limbic system`
    helps us survive, but the `neocortex` helps us thrive, and the two are meant to
    cooperate but often have a distinct power dynamic.


    The `limbic system` is so fast and powerful that it essentially gets to do what
    it wants in terms of the entire body and then we justify its actions with the
    `neocortex`, either by using logic to rationalize or humor to cope with what just
    happened. This autopilot functionality of our brain made sense in the African
    plains a million years ago, when a millisecond reaction at the moment of hearing
    grass rustle meant the difference between life and death.


    In today’s society, the `limbic system` is largely hyperactive for no good reason,
    being constantly triggered by coordinated manipulation from the media, companies,
    and scientists who just want our attention. Instead of activating only when our
    life is endangered, the `limbic system` is constantly bombarded by advertisements
    from businesses that realize all buying and consuming decisions stem from it.
    Sounds, sights, and smells all represent positive reinforcement meant to entice
    the `limbic system`’s zones dealing with pleasure, addiction, and emotional experiences
    and create a customer for life.


    Companies are already exploiting these core, dormant behaviors that were once
    crucial for our survival to make money. However, there is more of these, and whoever
    can define them first will become unthinkably rich. All marketing boils down to
    figuring out what forces lurk in the primal part of our brain and acting upon
    them directly to override conscious thoughts. Marketing AI will be no different,
    and you can already see how it is being touted as the perfect tool to wage war,
    do murder, end hunger and loneliness, all of which aim directly at the `limbic
    system`.


    Computer programmers also have to deal with the `limbic system`, mainly by using
    what is known as `UX` or user experience, which is trying to figure out where
    the user will experience irrational anger, pleasure or anguish during the use
    of an interface. What is interesting is that there’s a number of parallels between
    the brain and computer structure. The `limbic system` corresponds to a `kernel`,
    a core component in computers, while the `neocortex` is just like the operating
    system. So, as soon as you press the power button on your computer, the `kernel`
    starts up and coordinates everything else, bootstrapping the operating system
    that you can work with; the `kernel` itself is inaccessible and thus shielded
    from tampering. An average computer user has no clue that there is such a thing
    as a `kernel` or what it does because the clicky-clicky desktop environment works
    just fine.


    Arguably, there is a reason why computers are structured like the human brain—it
    is the most perfect tool in existence. We are using the brain for menial tasks
    without even knowing how it works or why, which is the same as an average person
    just playing Solitaire on his or her desktop computer. It is no wonder AI is expected
    to arise from a digital arrangement that looks like the human brain; what else
    could we possibly use? The implication is that AI will be using a digital replica
    of the human brain, skipping over a couple of million years of evolution in a
    jiffy to teach us about how our brain works and where we should be looking next.


    Since it won’t have to struggle for survival, this would imply AI won’t have the
    `limbic system`, allowing it to think in perfect clarity and without survival
    impulses that cloud our judgment, giving us scientific and psychological breakthroughs
    our puny brains can’t even comprehend. These are just some of the fascinating
    behaviors burrowed deep in our brains that are being acted upon daily by the environment.
    There is much reputable academic literature on the `limbic system`, but it is
    all so unbearably dry and soporific—seeing it play out right in front of your
    eyes is quite different, isn’t it?


    What is most notable is that it’s extremely hard to stop these urges, but that
    can be done if we only use our free will, roughly defined as “awareness of choices”.
    Every religion and educational system is meant to tell us that we don’t have to
    obey our urges, or at least that is what they were initially designed for; over
    time, all systems that support the `neocortex` crumble and start affecting the
    `limbic system` as it is much faster and compliant. This erodes our free will
    because it strengthens our primal urges, inevitably leading us to complacency
    and ruin. Understanding how the human brain works and how it is being manipulated
    daily is essential to maturity and psychological development. The thing is, thanks
    to the internet, we now have more sources of information and wisdom than ever
    before, allowing us to all share and grow together.

    '
