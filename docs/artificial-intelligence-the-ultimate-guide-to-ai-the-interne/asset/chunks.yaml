    # 第 15 章 – AI 与自动驾驶车辆


    一家名为自动驾驶卡车的初创公司 `Otto` 派遣其的一辆卡车进行了 120 英里的旅程，交付 51,000 罐百威啤酒。已经发言要从员工中消除人类驾驶员的
    Uber 买了 `Otto`，现在正在将自动驾驶车辆作为一种旨在给投资者留下印象的营销策略的一部分。注意旅程中的细节，以观察自动驾驶车辆的缺陷。


    这辆无人驾驶卡车的驾驶位空，被四辆警车和三辆 `Otto` 车辆包围，这些车辆的作用是在有人口渴或卡车发生故障时进行介入；两辆拖车在前方交通流中穿行，以确保无人干扰卡车的轨迹。司机在后部休息，但一旦卡车离开高速公路就接管了控制权。`Otto`
    事后证实，他们之前执行过相同的路线，当时由人类驾驶员开车，对方从未接管过控制权。


    百威的物流经理解释说，他们渴望看到这种交付方式实现规模化。科罗拉多州交通部执行主任沙尔伦·巴特（Shailen Bhatt）表示，自动驾驶卡车处于法律灰色地带，但这项技术未来可能像自动挡箱一样普及。`Otto`
    和百威制造商都无法说明他们认为自动驾驶卡车何时成为交通常态的一部分。


    ## 无人驾驶车辆的挑战


    你发现了多少缺陷？无人驾驶车辆需要人类的持续关注，在这种情况下，单辆车至少需要七个人的关注（包围它的每辆车各一名驾驶员，不包括拖车里的司机），加上卡车后部的一名司机。


    那么为什么司机要在那里呢？因为卡车的传感器严重依赖于完美的高速交通标志来导航；一旦卡车进入泥土路或碎石路，驱动它的神经网络就会陷入混乱。自动驾驶车辆需要巨大的基础设施才能正常工作，而且这还是在没有人类干预的情况下。人类驾驶员在遇到自动驾驶车辆时，很可能会为了好玩或为了索赔而故意干扰它，因此为了外观需要，驾驶舱里仍然得有一个人类驾驶员。


    拥有并调度自动驾驶车辆的公司随后可能会推动建立无人驾驶道，在那里，神经网络始终拥有优先权，并可以形成无缝的护队。这与使用火车运输货物有什么区别？


    此外，自动驾驶车辆处于法律灰色地带，这意味着它们不能像普通车辆那样获得保险或注册。目前仍然自动驾驶卡车是否可以规模化，也就是说，我们大致知道派遣一辆自动驾驶卡车旅行会发生什么，但如果同时向四方派遣一千万辆，会发生什么呢？物流公司需要建立什么样的基础设施来管理这些？


    涉及到自动驾驶卡车时，有很多事情逻辑不通。大客机已经有了约 40 年的自动驾驶功能，但我们仍然需要一名飞行员和一名副飞行员，因此根据各种情况，自动驾驶卡车将雇佣更多的人。它们显然花费了大量金钱和精力，却没有即时回报，那么为什么公司还要推行它们呢？


    在没有明显答案的情况下，最可能的原因是能够称自己的公司完全自动化的某种自豪感。对潜在自动驾驶汽车买者的调查显示，他们压倒性地想要一种宁愿毁掉自己驾驶员也不愿杀死路人的汽车。问题是，当他们被问及是否会购买或驾驶那种汽车时，他们激烈地表示：“不”。


    ## 责任与伦理


    科技巨头扩大影响范围和监控的利益与社会规范、神经网络的能力，甚至源于边缘系统的人类自我保护本能发生冲突。这类事件的法律责任将是巨大的，购买协议中的任何自杀条款都无法保护科技巨头免受如雨般的诉讼。


    然而，将自动驾驶汽车描述为由被赋予神灵地位的 AI 操控，可能作为一种法律漏洞。已经存在“不可抗力”（`force majeure`）或更高级力量的先例，这允许公司逃避合同，特别是在由于大量财产保险赔付会导致公司破产的情况下。“不可抗力”预留给极具压倒性的事件，如暴乱和战争，但也包括彻底摧毁特定地区的自然灾害，如龙卷风和洪水。不可抗力被视为“天灾”（an
    act of God），在 AI 被呈现为神灵之后可以使用，使其在自动驾驶车辆连环事故中法律上免受诉讼和合同的约束。


    '
