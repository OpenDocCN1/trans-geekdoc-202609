    # Glossary AI myths


    Simplified ideas concerning AI spread through clickbait.


    - **Attack surface**: Probability a system or network will be successfully hacked.
    Exponentially increases with complexity.

    - **Backdoor**: Hidden access capability meant for spying and unauthorized access.

    - **Big Data**: Result of widespread automated collection and labeling of data
    points provided by humans using various software and hardware.

    - **Clickbait**: Content meant to entice a visit by the web user for the sole
    purpose of making ad revenue to the hosting website. Triggers the limbic system.

    - **Cyberspace**: Digital world. Rules of the physical, three-dimensional world
    need not apply there.

    - **Deep learning**: Smart computer program upgrading itself according to its
    own rules that we don’t fully understand.

    - **Defense in depth**: Layering cheap, simple anti-hacking measures so that hackers
    give up in frustration.

    - **Emergent property**: Unplanned but useful property of a system.

    - **Feature creep**: Slowly increasing the scope of a software product, increasing
    its attack surface with a marginal increase in utility.

    - **Free will**: Ability to override actions of the limbic system.

    - **General AI**: Human-like AI. May become a lover or counselor.

    - **Hacking**: Human ingenuity in finding loopholes in computer systems.

    - **Internet of things**: Layer of robots that mediates between humans and the
    physical world.

    - **Kernel**: The core part of a computer. Imperturbable by users.

    - **Limbic system**: Kernel of the human brain. Obsessed with survival.

    - **Machine learning**: Any software that can change its output based on the data
    it’s been fed.

    - **Minimum viable product**: Least amount of functionality a company can put
    into one product without getting sued for false advertising.

    - **Narrow AI**: Highly specialized AI, perhaps as smart as a mosquito.

    - **Neural network**: Layered machine learning, with the smart machine capable
    of organizing and upgrading itself.

    - **Robotics**: Giving a neural network a physical body with limited functionality.

    - **SCS**: See Social credit system.

    - **Security by design**: Minimizing attack surface by creating barebones services.

    - **Singularity**: Point where AI overtakes humans in all aspects, becoming super
    AI.

    - **Social credit system**: Chinese game-like scoring of citizens according to
    their value to the state to determine which are entitled to education and use
    of public transport.

    - **Stress**: Long-term breakdown of the body and psyche. Ultimate productivity
    booster.

    - **Super AI**: Godlike AI that will think in ways we can’t comprehend.

    - **Taboo**: Sacred rule passed down through generations that mustn’t be questioned
    or violated.

    - **Turing complete**: Originally used to mean a computer program that can fool
    humans into thinking it’s a human too. It’s nowadays taken as an inside joke since
    humans constantly evolve.

    - **UBI**: Universal basic income. It’s touted as the universal answer to AI leaving
    people jobless.

    - **UX**: Programming paradigm that takes the user’s limbic system into account.

    - **VAR**: Set of video analysis tools widely used in soccer since 2018 to detect
    illegal moves.


    ## Part 2: Robotics


    What Beginners Need to Know about Robotic Process Automation, Mobile Robots, Artificial
    Intelligence, Machine Learning, Autonomous Vehicles, Speech Recognition, Drones,
    and Our Future ![](rsrc1XV.jpg)


    ### Introduction


    The following chapters will discuss everything that you need to know about robotics.
    As you look at the world around us, more and more robotics has been applied to
    our lives. Because of how important robotics is becoming in our lives, it is important
    that you understand how robotics works and some of the myths that are often told
    about robotics. There are many topics in this book, and you will read about some
    of the experts and what they have to say about robotics. It is important to understand
    everything about robotics before you decide to write it off as a hoax or something
    worse.

    '
