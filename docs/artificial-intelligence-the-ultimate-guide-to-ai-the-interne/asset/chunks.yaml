    # 第 1 章 – 利益共同


    你即将读到的内容违背了所有关于人工智能（AI）的主流认知，并挑战了关于智能机器究竟是什么或能成为什么的既定结论。


    所有最具影响力的媒体、科技公司和科学家都在喋喋谈论人工智能——这台宏伟、神话般且多面的机器，他们称它“明天”就会夺走从食物服务员到卡车司机再到律师的各种工作。然而，剥开这些说辞的表象就会发现，它们几乎没有任何事实依据，一场盛大的骗局正在上演，但这种骗局并非本质上的恶意——一切都是为了钱。


    主流媒体为了销量、点击量和订阅量已经处于饥状态，以至于现在不得不抛出每个人都能轻松理解的夸张主张。还有什么比人工智能更好的主张呢？这个概念是如此模糊，以至于它可以做任何事、完成任何任务。


    随着媒体市场准入门槛的降低，一个在隔间里对着麦克风打鼾的随机瑞典人，其点击量可能比主流新闻媒体多出百万。激进的时代需要激进的措施，例如宣布人工智能，以此驱动基于恐惧的销售、点击量和订阅。


    声称在其产品和服务中涉及人工智能的公司会获得更多资金和主流媒体的额外关注，而媒体也是这一圈套的合谋者。想造砖吗？宣布你正在制造 AI 设计的砖，媒体就会为你做市场营销。策划一场华丽但终究具有误导性的演示，全球媒体都会关注你。


    科学家们想要被尊重，那么还有什么比声具有影响力并受推崇更好的方式呢？只要声称有一种只有他们才能访问、理解和解读的人工智能。如果这听起来像神职人员，那事实确实如此。同样，科学家们产出的言越夸张，他们获得的资金就越多，获得媒体的关注也越多。这三个群体在兴奋与恐惧的无尽循环中互相利用。


    真正的的人工智能产品什么时候出来？没有人真的想制造一个，因为那会揭露这个骗局，并表明这项技术尚未成熟。我们现在拥有的只是非常简单的智能机器，可以处理数据、比较图像并执行简单的机械动作，例如搬箱子。其他一切都只是可能永远不会实现的神话。


