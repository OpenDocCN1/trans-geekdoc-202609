    # Chapter 6: Artificial Intelligence


    Artificial intelligence, otherwise known as AI, is often referred to as machine
    intelligence and it is the intelligence that is commonly shown in machines as
    opposed to the natural intelligence that is usually seen in humans and various
    other mammals. When it comes to computer science, artificial intelligence research
    is going to be listed as a study of intelligence that is shown by devices that
    can perceive the environment around it in order to take actions that can maximize
