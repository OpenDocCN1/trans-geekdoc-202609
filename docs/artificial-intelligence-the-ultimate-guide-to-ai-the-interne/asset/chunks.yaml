    AI helps dish out useful information so each person can step up to the plate that
    fits him or her genetically. Imagine replacing white bread with a 40-60 corn and
    rye one that tastes weird but finally solves your bloating, acne, and rashes.
    For whatever reason, changing something in the diet helps tremendously with health
    problems, but we typically never consider the option consciously or know what
    to do about it. Plenty of foods we are eating have nothing to do with our needs
    but are rather a force of habit or a yearning for comfort food due to excess exposure
    to stress. When it comes to food, current market conditions require uninformed
    customers with low impulse control to achieve financial growth—just look at how
    gluten turned out. Typically found in nature as a wheat protein that functions
    like glue to keep the seed in one piece, gluten was isolated and put into commercial
    use as a thickener sometime in the early twentieth century—used in ice creams
    to stop them from melting too quickly. Isolated gluten acts like a tiny bullet
    in the human digestive tract, poking holes which heal up quickly; overuse of gluten
    over decades leads to severe intestinal problems and autoimmune diseases in consumers.
    Companies used gluten because it made foods chewy, replaced more expensive ingredients
    without the product falling apart, and increased shelf life. Food safety inspectors
    didn’t find any problem with gluten because they were typically underfunded and
    overworked; without any evidence to the contrary, gluten was allowed on the market,
    which opened the floodgates to wanton experimentation with all sorts of substances.
    Meanwhile, a typical consumer sees a cheaper ice cream that melts slower, and
    tastes chewier than the competition because it has gluten; who cares if it’s the
    real thing or it harms health? It was only about a century later that the ruse
    was discovered and everyone started freaking out when the limbic system kicked
    into high gear, but by that time, food companies had made a fortune selling inferior
    products under the guise of quality . What is interesting about gluten is that
    it has a different impact on  different individuals, with exposure in youth, apparently,
    activating certain genes that lead to health problems later in life. It is hard
    to speak in certainties when it comes to gluten because the human digestive tract
    is so complex that elucidating just one process in it deserves—and usually gets—a
    Nobel Prize. In the end, use of gluten in foods turned out to be an extensive
    experiment on the general public devised by food companies, sanctioned by the
    government, and funded by the oblivious consumer driven by the limbic system.
    Why? Because it increased economic growth through an increase in food sales and
    consumption. There is no reason to believe the deployment of AI in any society
    will fare any better than the deployment of gluten. However, gluten could be blended
    seamlessly with other ingredients, but AI will stick out like a sore thumb, mandating
    that we willingly accept and adore it from the start. That is another explanation
    as to why so many influential people have started advocating for AI, despite it
    being well off in the future. Mass adoption of AI will require wholesale enlightenment,
    total turnover in how companies do their business or both ; most likely neither
    will happen but let’s examine the possibilities regardless. According to a New
    York Times article [\[35\]](#part0049.xhtml#a1WF) , where the reporter, also a
    cardiologist, used an app to log everything he ate, and how much he slept and
    exercised over fourteen days, AI can make us seriously doubt what we have been
    eating all our lives. Alongside a sensor that tracked his blood sugar levels,
    the reporter also had his stool analyzed for gut bacteria to see what was inside
    his intestines; different people have different bacteria in their gut, with each
    strain liking different foods. Most food studies are observational and voluntary,
    meaning they rely on participants to report what they have been eating over the
    years correctly. The best possible diet study results show correlation, but we
    have no idea about cause and effect, except when it comes to salt—excessive use
    over the years definitely increases blood pressure. Who funds the most dietary
    research? The same food industry that is interested in peddling as many cheap
    and stable replacements for genuine ingredients it can find. Is there an optimal  diet
    for all people? We have no idea, which is why AI is meant to sift through all
    the data of people with a similar genetic profile, analyze how they fared on certain
    diets, and bring us probabilistic recommendations. Everything from family history
    to toxins in the environment and gut bacteria plays a role in how the body processes
    foods. From time to time, there is a landmark study with promising results that
    tries to isolate that one key factor, but then it gets challenged, and conclusions
    are softened up. One such study was “Personalized Nutrition by Prediction of Glycemic
    Responses”, which looked at how blood sugar levels of participants spiked in response
    to 52,000 of the most popular foods, including ice cream. Posited to be a major
    predictor of diabetes, blood sugar level spikes (“glycemic responses” from the
    study title) mean the body has to strain to process the food it just ate. Apples
    and hazelnuts have a low glycemic index, but refined sugar and soda have a high
    one; in general, more refined foods act as more of a shock on the body. 800 people
    with diabetes had their glucose levels measured until the scientists got over
    1.5 million measurements, after which it was time for AI to crunch it all without
    human bias. Gut bacteria were found to be the most significant factor in how individuals
    reacted to different foods. After that, the reporter got the chance to try out
    the system for himself—all recommendations by the AI were foods the reporter hated,
    and all foods to avoid were what he enjoyed the most. Commercial versions of the
    same AI, though simplified, are meant to use pictures of a person’s plate to identify
    foods and make recommendations to avoid laborious manual reporting of foods, but
    without measuring glucose levels, preferably through a medical wearable, it is
    all just slightly better than a random guess. In the reporter’s case, he had kidney
    stones that were exacerbated by foods like strawberries, which the dietary AI
    coach recommended. For now, we have universal diets like Paleo and Keto. The Paleo
    diet says that processed foods hold many nasty surprises, and each link in the
    processing chain can taint the food before it lands on our plate. So, the Paleo
    diet recommends eating “clean” foods, meaning  those you know for certain how
    they were grown, stored, and processed. If possible, grow your own fruit, veggies,
    and poultry. The Keto diet aims to deal with blood glucose spikes by avoiding
    refined carbohydrates or just carbohydrates in general, meaning no bread, candy,
    sugar or soda and just a bit of fruit a day. The Keto diet has been found to stop
    epileptic attacks that no medication can subdue; science still has no idea why
    that happens. '
