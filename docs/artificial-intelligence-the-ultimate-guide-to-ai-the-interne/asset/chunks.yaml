    # Chapter 9 – Fear-based Consumerism


    Humans are known to use performance boosters, nerve stimulants—such as `coffee`—that
    power the global economy. What is the equivalent to that when it comes to machines
    or $AI$? As far as we know, there is no such thing—meaning that machines may outperform
    humans but will have linear productivity at best and won’t be able to keep up
    with humans that can constantly improve their performance, albeit temporarily.


    However, using performance boosters does have a drawback. The alcohol crisis is
    skyrocketing in the US, especially with women. Responsible for the deaths of about
    three million people a year worldwide, `alcohol` is a brain stimulant that lowers
    inhibition and warps the sense of reality. Simply put, `alcohol` lets the user
    unwind and live in a slightly better world, even if excess use does cause a hangover
    the day after. The ultimate reason for wanting alcohol in the first place is stress—usually
    due to pushing the body to its utmost limits to keep going in the workplace. Entrepreneurs
    are particularly prone to pushing themselves and everyone around them through
    discomfort, lack of sleep, and pain, and we actually lionize them for it. Being
    a well-rested entrepreneur is heresy even though sleep deprivation is a legitimate
    torture method that induces psychosis, a detachment from reality that fractures
    the mind.


    Presidents and leaders pride themselves in their autobiographies on making decisions
    without sleeping at all, even though they command armies and nuclear arsenals.
    How can we entrust the future of anything to a crazed person who has barely had
    a good night’s sleep? Yet we have to all these people, from common janitors to
    presidents, working themselves into an early grave or there is no chance to stay
    competitive in the market. So, excessive demands and lack of sleep cause a tremendous
    deal of stress, long-term breakdown of the body and psyche. Caffeine abuse is
    another big problem when it comes to innovating or dealing with stress. We don’t
    see coffee consumption as a problem—since it gives us that kick in the morning—but
    `caffeine` is a stimulant that hurts the body in the long run, particularly by
    disrupting sleep patterns, compounding the problem of induced psychosis.


    Caffeine is not banned like heroin or `cocaine` only because it stimulates the
    economy. Whatever increases output is allowed. All executives working in tech
    giants are likely by sleep deprivation and stimulant consumption that have lost
    touch with reality and don’t even know what they are doing, relying on the hierarchy
    of competent people below them. In all likelihood, tech giants crave AI to take
    over simply so they can finally get a good night’s rest. So, what is the real
    cause of stress? In engineering terms, stress is when a structure or element is
    exposed to a certain amount of load they can bear before breaking down. When it
    comes to humans, stress is cognitive load when we perceive the world around us
    as dangerous. Successfully doing so releases a small amount of feel-good chemicals
    in the brain that helps us unwind, making us feel accomplishment and satisfaction.
    If we can’t deal with causes of stress, we develop mechanisms such as finding
    comfort foods, highly caloric foods that typically have little nutrition but taste
    right to trigger the release of feel-good chemicals in the brain.


    In a 2007 study titled “Stress, eating and the reward system”, University of California
    scientists researched the link between stress and indulging in comfort foods.
    In essence, stress is an evolved response to danger that triggers a short-lived
    “fight or flight” reflex, releasing `adrenaline` and `cortisol` that exhaust the
    body and shorten the lifespan. Stress is meant to give us superhuman strength
    so we can either fight back or escape danger, but the same stress response can
    trigger for no benefit during the course of ordinary life, especially when you
    are involved in a dynamic environment. So, if you’re working in retail and a customer
    starts yelling at you, that causes your limbic system to think it is being attacked
    and triggers stress, causing you to either yell back (fight) or cower (flight).


    The solution to stress is always to consider all situations as challenges rather
    than sources of danger. This simple change in perspective makes us use our neocortex
    rather than the limbic system, developing higher brain functions rather than triggering
    the most basic survival instincts. In essence, seeing a yelling customer as a
    challenge rather than a threat may let you reply with a witty remark that interrupts
    his or her angry rant and perhaps makes them burst out laughing, turning a stressful
    situation into a relaxed and fun one, where you can work together to fix whatever
    problem there was without any stress. The study examined how people deal with
    stress by eating caloric foods, such as cookies, that trigger a feel-good brain
    response just like a drug would; addiction to cookies can be purged from the brain
    using `Naloxone`, a medication that helps drug addicts kick their habit. It is
    not just that humans relieve stress this way because even rats exposed to extreme
    danger were eventually hooked on cookies or sugary water, which is the equivalent
    of `soda` or fruit juice.


    Who ultimately benefits from the general public being constantly stressed out?
    Companies that produce and market these stress-coping mechanisms, whether it is
    food, alcohol, or some other vice that slowly ruins the body. In essence, our
    very existence involves small amounts of stress from time to time but being included
    in a thriving financial market mandates that we are constantly stressed out, or
    we won’t be giving our best to make and spend as much money. Big companies from
    media to food and entertainment have to whip us into a stress-fueled frenzy constantly,
    or we will just be happy with what little we have on our own and lead a peaceful
    life.


    Therefore, if tech giants decided they need the ultimate economic booster, they
    might announce a threat to end all threats—AI, a mystical and intangible perfect
    worker, advisor, lover, and warrior. We don’t have to take any heed of tech giants’
    AI doom and gloom announcements—since now we have an alternative explanation as
    to why they would be pushing it so intensely. Humans have always adapted to life
    and will continue to do so, except now you know that it is all just a challenge
    that can be solved using higher functions that lie dormant in the brain, being
    constantly overridden by the limbic system when we are stressed out fearing for
    our lives, which makes us utterly predictable and ultimately complacent. There
    is no external factor that can mold our behavior against our free will, as long
    as we are aware of the possibilities and consciously build our own path in life.
    Looking at AI from a stress-free perspective of a human that doesn’t feel fear,
    anxiety, anger, or hunger, what is the chance it will replace said human? No chance
    at all. Humans can exchange information and learn at a much faster rate than any
    machine as long as they are not using that pesky primal part of the brain, the
    limbic system, that always simplifies things.

