    ## 2. Robots can take the place of a human in a factory. This means that people
    will need to locate a new job or they will have to be retrained to do a different
    job. In the event that robots replace humans in a variety of fields, this can
    lead to a high unemployment rate because not everyone can be trained to do maintenance
    on robots.


    ## 3. As stated, robots require maintenance and repair, which is going to cost
    money. Plus, their programs will have to be updated regularly because the requirements
    for the job may change. The machines will have to be made to be smarter. In the
    event that there is a breakdown, the cost of repair is going to be high. This
    means that the procedures have to be restored, lost code of data recovered, and
    this can not only be costly but time-consuming as well.


    ## 4. Robots store a lot of data. However, getting access to the data is going
    to be harder than if you were pulling it out of a human brain. Robots are built
    to complete repetitive tasks, but they are not going to get better the longer
    that they do it like a human will.


    ## 5. Robots are not going to act in a way that is not already built into their
    programming. With how robots are being used today, people are going to easily
    be able to become dependent on machines which will end up causing them to lose
    control of their mental capacities. If the wrong hands took control of a robot,
    that robot could be used for destruction.


    ## 6. A robot is not intelligent or sentient. They cannot improve upon their jobs
    unless they are programmed to do so. They cannot think or have emotions. This
    severely limits how robots can assist or communicate with humans.


    ## Real-world Applications

    Robots are no longer science fiction; they are very real and in the world that
    we live in today. No, they are not trying to take over the world like some of
    the movies that we see, but they are working side by side with us and helping
    to improve our lives and making it so that we can improve the lives of those that
    we are working for. Below, you are going to see some real-world applications of
    robots and how they are helping make our world a better place:


    1. **Bionic legs**: bio-mechatronics is a revolutionary work being done by Hugh
    Herr who is the head of the biomechatronics research group at MIT. Herr is a double
    amputee who used human physiology with electro-mechanics to create a bionic limb
    for someone who has physical disabilities. His bionic achievements have included
    gait-adaptive knee prostheses for transfemoral amputees and a variety of impedance
    ankle-foot exoskeletons for gait pathology, which is also known as drop foot that
    can be caused by cerebral palsy, strokes, or multiple sclerosis. He has even done
    his own bionic legs which is the first foot and calf system.


    2. **Hospital robots**: Atheon''s focus is on the healthcare industry. By using
    autonomous mobile robots, they have helped with the transportation of heavy materials
    like laundry, clinical supplies, and cleaning products. On top of that, the `TUG`
    machines can safely remove hazardous waste. Being that regulations require that
    medical centers have to track all drugs, particularly narcotics, Aethon robots
    can deliver medicine as a part of an `IOT` (Internet of Things) scenario. Plus,
    it has `RFID` chips and barcodes on all the medicines that are going to enable
    it to track the medicines in real time.


    3. **Robot valets**: Smart garage vendors like Boomerang can provide a unique
    approach to robotic garages. Robots are programmed to get your car and park it
    for you so that they can maximize the space that is inside the garage. Boomerang
    functions similar to an elevator with a service called `Robotic Valet`. These
    garages are primarily in locations where real estate is expensive, such as San
    Francisco, Miami, and Chicago.


    4. **Parking lot robots**: Serva-TS works like a warehouse forklift that is going
    to shuffle vehicles through a parking lot like a deck of cards is shuffled. This
    system works in the Dusseldorf airport and can retrofit older garages by gaining
    40 percent of usable space in the process.


    5. **Factory robots**: Boston''s Rethink Robotics introduced robots that can work
    alongside humans to do warehouse activities like pick and pack.


    6. **Collaborative robots**: Denmark’s Universal Robots have brought out a whole
    line of collaborative robots to the world market. These robots are programmable
    and are invented to handle repetitive tasks which help to free up people to do
    more advanced activities.


    7. **Robotic factory painter**: ABB Robotics has come up with a line of robotic
    painters. There is a hollow wrist in `IRB 580` that is compact and is a fast and
    accurate painting robot. This robot helps increase productivity and presents more
    efficiency to painting companies.


    8. **Collaboration**: the KUKA systems have launched collaborative robotics that
    is meant to meet the needs of the growing market. This robot features sensory
    capabilities for safety, simple operator control, and faster teaching. There are
    a few applications to these robots that include inspection, testing, measuring,
    palletizing, machining, and fastening.


    9. **Humanoid robots**: The Intelligent Robotics Laboratory’s director, Professor
    Hiroshi Ishiguro, (the laboratory is part of the Department of Systems Innovation
    in the Graduate School of Engineering Science at the Osaka University in Japan)
    has created an android that goes by the name of `Geminoid`. Geminoid looks exactly
    like Professor Ishiguro.


    10. **Humanoids helping humans**: Even though these robots look humanoid and are
    considered to be cute, they are not all invented to do household chores or entertain.
    Honda and Toyota created a walking assisted device for those that are physically
    impaired or elderly. Cyberdyne’s `HAL` (Hybrid Assistive Limb) system is the only
    robotic device that can help to teach the brain how to move the limb that it is
    replacing. On top of that, the medical applications have full body `HAL` systems
    that are going through research and development to enhance or protect the human
    body for situations like disaster recovery, harsh environments, or circumstances
    where humans need to have superior strength and endurance.


    ## Chapter 2: Five Reasons Why Experts Warn Us about Robots

    Some experts condone the use of robots and others do not. Then, some experts are
    somewhere in the middle:


    1. **Elon Musk**: Elon Musk is a billionaire and a techpreneur who has been issuing
    warnings to the public when it comes to the dangers of artificial intelligence
    being used for military robots. There is rapid adoption of robot technology that
    is occurring in our society and the consequences that it will have on our society
    in the event that these robots are not secure. But what is the big deal if our
    robotics technology is not secure?

    '
  trans: '


    ## 2. 机器人可以在工厂中取代人类。这意味着人们将需要寻找新工作，或者必须接受重新培训以从事不同的工作。如果机器人在各个领域取代了人类，可能会导致高失业率，因为并不是每个人都能接受机器人维护的培训。


    ## 3. 如前所述，机器人需要维护和修修理，这需要花费费用。此外，由于工作需求可能会发生变化，它们的程序必须定期更新。机器必须被造得更智能。一旦发生故障，维修成本将非常高。这意味着必须恢复程序、找回丢失的数据代码，这不仅昂贵，而且耗时。


    ## 4. 机器人存储大量数据。然而，获取这些数据的难度将比从人脑中提取数据要大得多。机器人的设计是为了完成重复性任务，但它们不会像人类那样随着执行时间的变长而变得越来越出色。


    ## 5. 机器人不会以其程序设定中未包含的方式行动。按照目前机器人的使用方式，人们很容易对机器产生依赖，最终导致他们失去对智力能力的控制。如果被别有用的人控制了机器人，该机器人可能被用于破坏。


    ## 6. 机器人并不智能，也没有感知能力。除非被设定为如此，否则它们无法改进自己的工作。它们不能思考或拥有情感。这严重限制了机器人协助或与人类交流的能力。


    ## 现实应用

    机器人不再仅仅是科幻小说；它们是真实的，存在于我们今天生活的的世界中。不，它们并不像我们看到的某些电影那样试图统治世界，而是与我们并肩工作，帮助改善我们的生活，并让我们能够改善服务对象的生活。以下你将看到机器人的一些现实世界应用，以及它们如何帮助我们的世界变得更好：


    1. **仿生腿**：生物机电学是休·赫尔（Hugh Herr）正在进行的一项革命性工作，他是麻理工学院（MIT）生物机电研究小组的负责人。赫尔是一位双腿截肢者，他利用生理学与电机，为残障人士创造了仿生肢体。他的仿生成就包括用于大腿截肢者的自适应膝假体，以及用于步态异常的各种阻抗踝足外骨骼（也称为足垂，由脑性瘫、中风或多发性硬化症引起）。他甚至制作了自己的脚仿生腿，这是第一套足部和小腿系统。


    2. **医院机器人**：Aethon 专注于医疗保健行业。通过使用自主移动机器人，他们帮助运输了衣物、临床用品和清洁产品等重物。此外，`TUG` 机器可以安全地移除有害废物。由于法规要求医疗中心必须追踪所有药物（特别是麻醉剂），Aethon
    机器人可以作为 `IOT`（物联网）场景的一部分传递药物。此外，所有药物上都有 `RFID` 芯片和条形码，使其能够实时跟踪药物。


    3. **机器人泊车**：像 Boomerang 这样的智能车库供应商可以提供机器人车库的独特方法。机器人被程序为取你的车并停好，以便最大限度地利用车库空间。Boomerang
    的功能类似于电梯，并有一项 `Robotic Valet` 服务。这些车库主要位于房地产昂贵的地方，如旧金山、迈阿密和芝加哥。


    4. **停车场机器人**：Serva-TS 的工作就像仓库叉车，它像洗牌牌一样在停车场内穿梭车辆。该系统运行在杜塞尔多夫机场，并通过改造可以获得 40%
    的可用空间，从而使旧车库升级。


    5. **工厂机器人**：波士顿的 Rethink Robotics 推出了可以与人类一起工作、完成捡拾和包装等仓库活动的机器人。


    6. **协作机器人**：丹麦的优机器人（Universal Robots）向全球市场推出了一系列协作机器人。这些机器人是可编程的，旨在处理重复性任务，有助于人们释放出来从事更高级的活动。


    7. **机器人喷漆机**：ABB 机器人推出了一系列机器人喷漆。`IRB 580` 有一个空心腕部，结构紧凑，是一种快速准确的喷漆机器人。这种机器人有助于提高生产率，并为喷漆公司提供更高的效率。


    8. **协作**：KUKA 系统推出了协作机器人，旨在满足日益增长的市场。这种机器人具有用于安全的传感能力、简单的操作控制和更快的教学。这些机器人的几个应用包括检查、测试、测量、托盘化、加工和固紧。


    9. **人形机器人**：智能机器人实验室主任石黑浩史（Hiroshi Ishiguro）教授（该实验室是日本大阪大学工程科学系研究生院系统创新系的一部分）创造了一个名为
    `Geminoid` 的类人。Geminoid 看起来和石黑教授一模一样。


    10. **帮助人类的人形**：尽管这些机器人看起来像人并被认为是可爱的，但它们并不是为了做家务或娱乐而发明的。本田和丰田为身体残障或老年人创造了步行辅助设备。Cyberdyne
    的 `HAL`（混合辅助肢）系统是唯一可以帮助教大脑如何移动其所替代肢体的机器人设备。此外，医疗应用方面正在研发全身 `HAL` 系统，以在灾难恢复、恶劣环境或人类需要卓越力量和耐力的情况下，增强或保护人体。


    ## 第二章：专家警告我们警惕机器人的五个原因

    一些专家支持使用机器人，而另一些则反对。此外，有些专家处于中立立场：


    1. **埃隆·马斯克**：埃隆·马斯克是一位亿万富翁和科技企业家，对于人工智能用于军事机器人的危险性，他一直在向公众发布警告。我们的社会正在快速采纳机器人技术，如果这些机器人不安全，将对我们的社会产生后果。但如果我们的机器人技术不安全，又有什么大不了的呢？


    '
