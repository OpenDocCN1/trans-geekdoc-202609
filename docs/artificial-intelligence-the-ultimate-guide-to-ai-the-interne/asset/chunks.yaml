    What are the experts saying about our future? Roboticist Daniela Rus hopes to
    have a world where every person can have a robot despite where they fall on the
    economic ladder. Rus is the director of Computer Science and Artificial Intelligence
    Laboratory at the Massachusetts Institute of Technology (MIT) and has been reported
    saying that even though robotics has made major advancements, this dream is not
    yet possible. “But just remember that only two decades ago, computation was a
    task reserved for few experts, because computers were large, expensive, and hard
    to use,” Rus said. Now, everyone is using a computer, and that alone shows that
    technology can advance enough to bring artificial intelligence to the world. Robotics
    is still in their infancy, but they are making advances every day. Today, Amazon
    has more than 80,000 robots that are working in their fulfillment centers. Even
    with that many robots working for Amazon, the chief technologist for Amazon does
    not have any desire to replace humans with robots. “Humans are really great at
    creative problem solving, abstraction, and generalizations. Robots are really
    good at crunching numbers, pulling data, lifting heavy objects, and moving with
    precision. We have to think about how we can build systems that bring the strengths
    of each of these components together.” – Tye Brady.


    Heather Ames from Neurala unveiled that they were working with Motorola Solutions
    where they were using artificial intelligence that can be used in finding missing
    children. The body cameras found on the uniforms of officers will receive the
    description of the missing child so that more people are looking for the child
    while they are lost. This same system is going to be applied to find suspicious
    packages. Buddy Michini from Airware has stated that drones are going to be able
    to help first responders assess a catastrophic event. “They can take a drone for
    getting an overview of what’s happening and put [help] at, say, the most crashed
    building.” Michini also stated Airware sent their drones over to Italy to help
    with the most recent earthquake.


    Robots are even placed on a human body to augment the skills that the human must
    use. This is being done so that they can restore the ability to anyone who has
    a physical impairment that they may have lost. The first use of these robots has
    been on soldiers so that they are not getting tired while they are carrying more
    than 100 pounds. The machine is not going to control the user, but instead, it
    is going to follow his moves. So, if they are stepping over rough terrain, it
    will combine the strength of the robot and the human so that they are working
    together.


    ## How Robotics are being Used Today


    Robots can be seen in the medical field today. They are so precise that they have
    become a great tool for surgery. Robots can do incisions that are much cleaner
    than a human being can do and once the cut is healed, it cannot be seen from a
    distance. Doctors no longer have to be scared of making the wrong incision or
    cutting too far into the patient. Robots can be programmed to cut in a specific
    place and to a certain depth. They have also been helpful in advancing medical
    discoveries and finding new information that can later help to save someone’s
    life.


    Robots can also be found in factories. They are used to weld cars and parts together.
    Because of how precise they are as well as their accuracy, it is easy to make
    their work appear as if a professional did the welding. The great thing about
    robots is that they are not bothered by the bright lights or heat from the welding
    torches either. Therefore, they can do more work than a human. The only downside
    is that they are going to require program updates to keep them going and up-to-date
    on the newest technology.


    Robots have also been made for home entertainment and leisure. There is a variety
    of home robot kits that people can purchase. Some of these kits are going to make
    a robot that follows a line or traces a line. Other kits are going to make a robot
    that can determine if it is on the floor or the table and how far it can go before
    it hits something. These types of robots are going to have light sensors as well
    as switch sensors. There are even some robots that are going to be used for cleaning,
    such as to vacuum the floor or to serve other people. Pet robots are going to
    mimic pets while providing entertainment to the person that owns it. These pet
    robots can roll over, sit, and play with you.


    ## Advantages of Robotics


    Robots can be very helpful in our lives despite what people believe. Here are
    some ways that robots are helpful in our lives today:


    1. Robots can perform tasks faster than humans, and they’re consistent and accurate.

    2. Robotic pets can help patients who are suffering from depression and can help
    to keep them active.

    3. Most robots are automatic; therefore, they can move without interference from
    a human. This means that they can entertain and perform specific tasks that are
    not safe for a human being.

    4. Robots can be used to produce products and assemble cars. Robots can also be
    used when it comes to building parts for plans, cars, and construction equipment.

    5. New jobs are being created to have people create and repair robots.

    6. Since they are machines, robots can work without sleeping.

    7. Robots can deal with hostile environments. Robots are created so that planetary
    atmospheres are not going to affect their performance nor will it affect their
    physical state. They can replace humans in many areas of work and can even program
    themselves to manage themselves better.

    8. Robots can be programmed to navigate and reach the center of the Earth. They
    can dig for fuel and can be used in mining. Robots can also be programmed to explore
    the floor of the ocean and other parts where humans cannot go. Any limitations
    that humans have, robots can overcome.

    9. Robots can be used when it comes to time-consuming and repetitive tasks. Robots
    are not going to get bored; therefore, they are not going to lose quality when
    it comes to their work. They can also do dangerous tasks that humans should not
    do. Their parameters for time and speed can be adjusted to make them react quicker.
    Robots can further be uninfluenced by the things that are going to affect humans
    negatively.

    10. Robots can function without stopping. They can work without being serviced
    for an extended period of time as well as being able to work a long time without
    maintenance, which means that they have a higher production rate than most humans.

    11. Robot hands will not tremble or shake as human hands do. Robots work with
    smaller and more versatile moving parts than humans. This is what makes them perfect
    for medical operations.

    12. Robots are built so that they can work in the harshest of environments, such
    as space, underwater, or a fire. They can be used whenever a human’s safety is
    called into question. Robots can also be created to come in any size that the
    task requires.

    13. Robots are there to do jobs that people do not want to complete. Many robotic
    probes have been sent to space and never returned. They are built to be stronger
    than people. Robots have even been used in warfare to eliminate the need for putting
    people at risk.


    ## Disadvantages of Robotics


    Of course, robots are going to have their disadvantages as well:


    1. Robots have to have power’ to operate. People can lose their factory jobs,
    but even if they are replaced with robots, the robots will need to have maintenance
    to keep them running. It is going to cost a substantial amount of money to create
    and purchase robots. Plus, the programs and hardware that the robot is going to
    need will cost more money later on the road.

