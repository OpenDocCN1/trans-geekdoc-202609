    pesky instincts coming from the limbic system, and we have done so much to appease
    it, but where do we go from here? The romantic notion of replacing capitalism
    with some other form of governance more aligned with religion will ultimately
    be aimed at the lowest rungs of society, those who consider entrepreneurs and
    capitalists thoroughly evil and morally corrupt due to their desire to succeed.
    Everyone else can perceive the tremendous amount of wealth and productivity brought
    about by capitalism, wanting to participate and contribute to the economic growth
    willingly, but these discontents won’t be so easily appeased with just wealth;
    they’ll need something better. What is likely to happen is that technology will
    have more separate haves and have-nots, leading to widespread resentment coming
    from those who can’t relinquish outdated ideas or reconcile themselves with merit-based
    competency. Those who can afford the latest iPhone or get involved in the `IoT`
    ecosystem will get all the benefits of AI that entails, while outsiders become
    a well of frustration, dragging everyone down and possibly causing riots that
    would make the elite huddle in their ultra-safe city fortresses turned into bunkers.
    Growing societal tension and strife would then be rectified by tech giants presenting
    AI as a combination of religion and capitalism, touted as a necessary part of
    our lives. If a tech giant strikes a deal with the medical and pharmaceutical
    industry, the faithful can be equipped with `IoT` hardware that will create additional
    medical data sources for the company while drip-feeding users with drugs and vaccines.
    Therefore, the perfect business plan for marketing AI is revealed:


    - present AI as a way to settle societal differences and make everyone equal,
    just like Facebook is already doing.

    - To those who believe in capitalist ideas, AI should be presented as a way to
    increase productivity and personal wealth; to those who believe in religious concepts,
    AI should be presented as a benevolent “guardian angel” that’s in accordance with
    their religious teachings. Concept of AI can be spun every which way to align
    with the ideals of all subcultures in the society the same way Facebook is a news
    source for some and a source of entertainment for others.

    - use `IoT` devices that constantly scan the environment and gather data to report
    everything back to the mothership regardless of what the user wants, which is
    what `Alexa` is already doing. Shamelessly invade everyone’s privacy through outright
    surveillance and create a detailed, thorough privacy policy that explains nothing
    and is buried deep within pages of legalese. This will create data feeds to help
    the company analyze user trends and sell off data to advertisers while minimizing
    legal liability. Any responsibility for the intrusion of privacy should always
    be placed on the user.

    '
