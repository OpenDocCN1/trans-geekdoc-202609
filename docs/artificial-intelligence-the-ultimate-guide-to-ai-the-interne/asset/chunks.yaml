- raw: "Chapter 23 – AI as Sports Referees In sport, many things can be decided by\
    \ a single centimeter, and a set of human referees might not be enough to get\
    \ the right verdict in. With soccer, an ancient, brutal game derived from massive\
    \ village brawls where an object was to be carried from one end of the field to\
    \ the other, technology had to be introduced as humans kept finding ways to outsmart\
    \ outdated rules. In one particularly painful instance in 1986, England lost to\
    \ Argentina because one of the players, Diego Maradona, used his hand instead\
    \ of his head to score a goal, which is a forbidden move. The incident came to\
    \ be known as “Hand of God” [\\[45\\]](#part0049.xhtml#a1XP) and was certainly\
    \ what led to the adoption of high definition footage, a specialized video analysis\
    \ team watching it that can call for a timeout and a set of high-speed cameras\
    \ watching each goal. As player performance increased, soccer was modernized by\
    \ creating smaller, faster balls that could be kicked harder to create more impressive\
    \ goals but that also meant the standard 24 frames per second TV cameras were\
    \ not good enough for video analysis. Called Video Assistant Referee [\\[46\\\
    ]](#part0049.xhtml#a1WZ) (VAR), the setup provides several high-speed camera angles\
    \ to every inch of the field and lets the VAR team correct the on-field referee\
    \ or just let them pause the game while they check the replay. Additionally, high-speed\
    \ cameras watch each goal line to create a 3D representation of the ball as it\
    \ is entering the goal to automatically signal to the referee through a bracelet\
    \ screen and buzzer if a goal should be awarded. For just in case, there is a\
    \ backup human referee with the sole purpose of staring at each goal line to double-check\
    \ on VAR. What VAR has shown us is that simply adding more humans to any given\
    \ situation that calls for a judicious decision does not improve the accuracy,\
    \ but simply adding more technology doesn’t help either. The right solution is\
    \ carefully scaling up the technology while adding backup humans because now we\
    \ can afford it. The scare of “AI will leave truck drivers jobless” makes no sense\
    \ if we can afford to hire a human driver, with people assisting AI and vice versa,\
    \ just like in sport. Soccer is a now a sport where fame is made and lost based\
    \ off of a single goal, so we better get it right every single time,  with a damn\
    \ good explanation if the system fails, which so far it hasn’t done. Could VAR\
    \ decisions be challenged the same way we challenged pre-trial risk assessment\
    \ scores? No, because VAR: a) shows all the raw data, meaning footage of the goal\
    \ in close-up, high definition and slowed down and b) there’s a human expert who\
    \ examines the raw data and makes the call. Despite having ancient rules that\
    \ resisted change for a long time, soccer was modernized when the audience, players,\
    \ and referees easily adopted VAR because the system is transparent and redundant.\
    \ Now that is the kind of AI technology we need, one that will be based on machines\
    \ that work better than the human counterpart (cameras compared to the human eye)\
    \ and readily challenged until we finally get it right, while still having the\
    \ option of overriding the machine’s decision. \n\nConclusion Science fiction\
    \ writers have been wringing their hands over artificial intelligence for decades,\
    \ even before public figures ever discussed the concept. They imagined AI as a\
    \ booster force that we will have to use to venture outside the solar system or\
    \ just as an assistant that will help us fix things here on Earth, but an inescapable\
    \ influence nonetheless. All the media that related the concept of AI to the general\
    \ public slated it to be mysterious and analytical, doing whatever it takes to\
    \ fulfill its own agenda before inevitably turning out to be the villain. As we\
    \ have seen throughout this book, there is barely any evidence that will happen\
    \ in this century. What is happening is that entrepreneurs are pushing themselves\
    \ harder than ever before to run their business ventures sleepless, fueled by\
    \ stimulants, and frustrated by the lack of influence on politicians. So, when\
    \ entrepreneurs do finally get some sleep, they have feverish dreams of an AI,\
    \ a digital worker that could let them finally usurp the throne of political power\
    \ and then take a nap. AI could even be presented as a deity to fill that missing\
    \ hole in the lives of entire nations while giving it special legal privileges\
    \ and immunities. Can tech giants actually do it? Highly doubtful. The emergence\
    \ of general AI, one as smart as a human being, is likely to require a technological\
    \ invention as fundamental as electricity to function but one that humans won’t\
    \ be able to use because we will simply take the invention and again overperform\
    \ compared to any machine. We do have a narrow AI, one that can compare images\
    \ or find an object in a picture or recognize a certain face among a group of\
    \ faces, but even that is worthless without a human handler overseeing it. Self-driving\
    \ cars and trucks simply don’t work without a human guardian and technician, meaning\
    \ they are certain to increase employment rather than make people jobless. As\
    \ laid out throughout this book, general AI is merely a pipe dream, wishful thinking\
    \ by tech giant CEOs who think their pet projects can be widely accepted and them\
    \ hailed as saviors of humanity when they dole out UBI. None of the doom and gloom\
    \ predictions they laid out are going to happen, but stoking fear does increase\
    \ consumption and makes humans more malleable. So, now what? Just  enjoy the ride. "
