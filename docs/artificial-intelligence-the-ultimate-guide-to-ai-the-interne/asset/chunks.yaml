  trans: '


    # 第 13 章 – AI 与就业


    在当前的美国商业环境中，`IQ` 测试是被禁止的，因为这会导致所谓的“差异性影响”（disparate impact），这本质上意味着如果企业过滤掉了不胜任的人员，可能会被起诉。即使企业确实需要具备某项技能的员工，雇主仍可能被拖上法庭，并遭受媒体舆论的审判，因此，大多数雇主只能叹气，并雇佣那些对业务贡献微乎其微、与真正高效员工并行的人。


    这种为了遵循“完美饼图”理想主义观念（即每个种族和国家身份都拥有一席）而雇用象征性员工的做法，是不可持续的且可能是有害的，但雇主们仍然这样做，仅仅是为了避免受到媒体的指责。


    在这样一个闹上最高法院的案例中——`Ricci v DeStefano` `24`，康涅狄格州新亥市的一组消防员通过通过一项漫长且昂贵的考试来竞争中尉和上尉职位。市政府最终否决了考试结果，因为没有足够的少数族裔候选人通过，而本应获得晋的消防员提起了诉讼。最高法院裁定：“根据第七章法案，本案中市政府这种基于种族的行动是不允许的，除非雇主能够证明有强有证据表明，如果没有采取该行动，它根据差异性影响法案将承担责任。”简而言之，这项考试是新亥市能提供的最好的，而这本该是应该使用的。


    想象一下这种局面：消防员响应警报却不知道如何进行，因为他们所有人都是根据肤色、眼睛或头发颜色被录用的，而不是根据拯救生命财产的实际能力。消防工作不再是雇佣最强壮、最资源丰富的人，而是变成了平息社会不满之火的过程，政治家通过迎合最基础的部落冲动来争夺有利的媒体报道。那些敢于指出问题的人会在媒体上遭到抨击，无论他们是如何表述的，也无论他们说得多么正确。


    然而，对于一种真正不分烘烤对象的开放火焰，是没有任何谈判余余的。雇主甚至不能拒绝雇佣或直接解雇一名孕妇，即使她的工作涉及可能影响胎儿的毒性物质。在美国，约
    75% 的就业女性在职业期间都会怀孕，这迫使雇主必须：

    a) 放弃雇佣和培训该女性的任何成本；

    b) 支付产生的任何费用，因为怀孕被视为一种慢性健康问题；

    c) 自费为孕妇寻找替代者。


    这源于《1978 年联邦反怀孕歧视法案》`25`，该法是由另一个最高法院案例引起的，在该案中，一名孕妇起诉 `General Electric`，因为其残疾保险计划不涵盖怀孕或分娩。一直到最高法院的所有法院都确认
    `General Electric` 没有错，因为其残疾计划为男女提供了相同的福利，这就是为什么会迅速通过了该法案来填补这一巧妙的漏洞。


    将此结果与中国商人的处理方式进行对比——如果这意味着工厂生产力的微小增加，他们乐意一车车地将孕妇送进粉碎机，而中国政府也会批准。你现在知道为什么这么多公司将制造业搬到中国了吗？得益于最低的工人权利和最大的利润，中国是实验任何新型业务产品的完美场所。


    如果 AI 真的要到来并取代人类工人，那么将制造业能力留在第一世界而不是运出去是有意义的，但实际情况并非如此。`Foxconn` 是一个特别极端的例子，它在中国拥有一个巨大的工厂园区，那里的工人每日配额由生产率最高的一拨设定——做得超过那个标准，其他人就必须加速或被解雇。从座位安排到工人互动，一切都受到严格的控制和优化。决定无法忍受的工人通常通过从最近的园区建筑跳楼来结束这一切，这促使
    `Foxconn` 管理层安装了安全网，让不快的工人重新考虑自己的选择，并面对被雇的耻辱。


    `Foxconn` 生产了全球约 40% 的消费电子产品，例如 `Playstations`、`iPhones`、`Nintendo 3DS` 和 `Xbox`。西方的职场平等观念，即孕妇和少数族裔因为反歧视法而获得舒适的职位，看起来是理想化且古旧的，就像一个从未经营过成功业务的哲学家想象的经营方式一样；中国在各个方面都更高效，尽管它产生了巨大的痛苦。


    如果企业必须应对不断的投诉、诉讼和负面媒体头条，它们就无法保持竞争力，这就是为什么他们通常建立 `人力资源 (HR)` 部门来在内部处理员工事务。`HR`
    处理招聘和解雇，像一个思想警察一样微管理员工的行为，以将雇主的法律责任降至最低。


    在经历过 `#MeToo` 恐慌之后（在此期间，各种女性声称受到权势男性的骚扰），`Netflix` 的 `HR` 部门引入了一项规定：男和女员工的眼神交流每次不能超过五秒
    `26`，因为这会“引发强烈的性欲望”。`HR` 能这样做吗？`HR` 可以随心所欲。`HR` 用其自己复杂的方案处理工作面试，这些方案专门设计用于让潜在员工无法提起歧视诉讼。如果你曾不幸地经历过同一家公司六场愈发复杂的职位面试，结果却在没有理由的情况下被拒绝了，现在你知道为什么了——你从根本没有被考虑过那个职位，但公司必须演一场戏以减少负面媒体报道的可能性。


    简历的情况也是如此，它们只是被直接扔进回收桶，除了极少数几个例外。


    '
