    \ that are done to the weights and biases to get to the change that you want in\
    \ your outcome. Therefore, your `sigmoid neuron` is going to have the same behavior\
    \ as the `perceptron`, which is going to make it to where it is easier for you\
    \ to figure how to change your weights and biases to change the outcome. If the\
    \ shape is what matters most, then it is not going to be an exact form which is\
    \ going to be the reason for the use of the σ in the equation. When you are looking\
    \ at the changes that cause you to use a different activation expression, then\
    \ the value for that partial derivative is going to change in the equation. So,\
    \ when you compute those derivatives later, your function is going to take the\
    \ algebra and simplify it so that the exponentials have properties that you can\
    \ work with when differentiated. As you interpret the outcome that comes from\
    \ the `sigmoid neuron`, you are going to see that one of the biggest differences\
    \ is going to be the `perceptrons` and the neurons where the neurons do not result\
    \ in zero or one. They can have any outcome as long as the outcome is a real number\
    \ and falls between zero and one. This is going to be useful when you want your\
    \ outcome to represent the average intensity for the pixels that are in an image.\
    \ However, sometimes this is going to be a problem. Take, for instance, if you\
    \ want your outcome to say that your image is nine or is not nine. It is going\
    \ to be easier to do this in the event that your outcome is zero or one for your\
    \ `perceptron`. However, in practice, you are going to set up a convention to\
    \ deal with this so that you can interpret the outcome for at least half of the\
    \ image which is going to indicate the number you want actually to be. This means\
    \ that any outcome is less than half means that the outcome is not going to be\
    \ what you want it to be.\n\n## Big Data\n\nIt seemed that 2012 was the year that\
    \ the big data technologies came around and were everything to everyone. But in\
    \ 2013 big data...\n"
