    \n```php\nif ( $_SERVER['REQUEST_METHOD'] == ‘POST’ )\n{\n    foreach ( $_POST['qty']\
    \ as $item_id => $item_qty )\n    {\n        # 确保值是整数。\n        $id = (int) $item_id\
    \ ;\n        $qty = (int) $item_qty ;\n        # 如果为零则更改数量或删除。\n        if ( $qty==\
    \ 0 )\n            unset( $_SESSION['cart'][$id] );\n        elseif ( $qty > 0\
    \ )\n            $_SESSION['cart'][$id]['quantity'] = $qty ;\n    }\n```![image](img/forget.jpg)用户可能会向数量字段输入非数字值，因此脚本必须确保数量是整数。现在，添加语句初始化总额\n\
    \n```php\n$total = 0 ;\n```\n\n![image](img/5g.jpg)接下来，添加语句，如果购物车为空则显示一条消息\n\n\
    ```php\nif ( !empty($_SESSION['cart']) )\n{\n    # 在此处插入语句（第 7 步）。\n}\nelse\n\
    {\n    echo ‘<p>购物车为空。</p>’ ;\n}\n```\n\n![image](img/6g.jpg)插入语句打开数据库连接\n\n```php\n\
    require ( '../connect_db.php' ) ;\n```\n\n![image](img/7g.jpg)接下来，插入语句从数据库检索数据\n\
    \n```php\n$q = “SELECT \\* FROM shop WHERE item\\_id IN (“ ;\nforeach ($_SESSION['cart']\
    \ as $id => $value)\n{\n    $q .= $id . ‘,’ ;\n}\n$q = substr($q , -1) . “) BY\
    \ item\\_id ASC” ;\n$r = mysqli_query( $dbc , $q ) ;\n```![image](img/8g.jpg)现在，添加语句创建购物车表单\n\
    \n```php\nwhile ( $row = mysqli_fetch_array( $r , MYSQLI_ASSOC ) )\n{\n    # 计算小计。\n\
    \    $subtotal += $row['item_price'] * $_SESSION['cart'][$id]['quantity'];\n \
    \   echo ‘<tr><td>’.$row[\"item_name\"]..’</td><td>’.$row[\"desc\"]..’</td><td><input\
    \ type=\"\"text” name=\"\"qty[$id]” size=\"\"3” value='.$$_SESSION['cart'][$id]['quantity']..’></td><td>’$.number_format($row[\"\
    item_price\"], 2).’</td></tr>’ ;\n}\n```![image](img/9g.jpg)添加语句显示购物车中的表单\n\n\
    ```php\necho ‘<form action=\"\"cart.php” method=\"\"POST”><table><tr><th>项目</th><th>描述</th><th>数量</th><th>单价</th></tr>’\
    \ ;\necho ‘<tr><td colspan=\"\"5”>总计 = ”.number_format($total, 2).’</td></tr>’\
    \ ;\necho ‘</table><input type=\"\"submit” value=\"\"更新购物车”></form>’\n```![image](img/10g.jpg)在表格末尾显示总额，并在表单末尾添加提交按钮\n\
    \n```php\n$total += $subtotal ;\n```![image](img/11g.jpg)现在，添加语句关闭数据库连接\n\n```php\n\
    mysqli_close( $dbc ) ;\n```![image](img/12g.jpg)添加语句创建指向网站其他页面的超链接，包括一个将总额附加到\
    \ URL 的“结算”页面\n\n```php\necho ‘<p><a href=”shop.php”>商店</a> | <a href=”checkout.php?total='.$total.’”>结算</a>\
    \ | <a href=”forum.php”>论坛</a> | <a href=”home.php”>首页</a> | <a href=”goodbye.php”>退出</a></p>’\
    \ ;\n```\n\n"
- fmt: "\n![image](images/pg181_1.jpg)\n![image](images/pg181_2.jpg)\n![image](images/hot.jpg)\n\
    \nYou can change all quantities to zero and click the Update button to see the\
    \ default empty cart message.\n\n## Checking out orders\n\nHaving produced a shopping\
    \ cart page, described [here on pages 174-181](#chapter10.html#sec85), you can\
    \ now create a PHP script to process the user’s selected items as a “checkout”\
    \ order. This is the culmination of the shopping cart process and will store the\
    \ cart selections in the “order” and `order_contents` database tables for subsequent\
    \ fulfilment by the supplier.\n\n![image](images/pg182_1.jpg)\n\n### checkout.php\n\
    \n![image](images/1g.jpg)Launch a plain text editor and begin a PHP script with\
    \ a statement to allow access to session data.\n\n```php\n<?php\nsession_start();\n\
    ```\n\n![image](images/2g.jpg)Now, add statements to redirect the browser to the\
    \ Login page if the user is not already logged in.\n\n```php\nif (!isset($_SESSION['user_id']))\
    \ {\n    require ('login_tools.php');\n    load();\n}\n```\n\n![image](images/3g.jpg)Next,\
    \ add statements to set the page title and include a page header.\n\n```php\n\
    $page_title = 'Checkout';\ninclude ('includes/header.html');\n```\n\n![image](images/4g.jpg)Add\
    \ statements to store the shopping cart items in the database or provide a default\
    \ message.\n\n```php\nif (isset($_GET['total']) && ($_GET['total'] > 0) && (!empty($_SESSION['cart'])))\
    \ {\n    # Statements to be inserted here (Steps 5-10).\n} else {\n    echo '<p>There\
    \ are no items in your cart.</p>';\n}\n```\n\n![image](images/5g.jpg)Now, insert\
    \ a statement to open the database connection.\n\n```php\nrequire ('../connect_db.php');\n\
    ```\n\n![image](images/6g.jpg)Next, insert statements to store the user ID, total\
    \ order value, and current date/time in the “orders” database table.\n\n```php\n\
    $q = \"INSERT INTO orders ( user_id , total , order_date ) VALUES (\" . $_SESSION['user_id']\
    \ . \",\" . $_GET['total'] . \", NOW() )\";\n$r = mysqli_query($dbc, $q);\n```\n\
    \n![image](images/forget.jpg) The total value of the shopping cart is appended\
    \ to the URL of this web page by the cart page’s PHP script.\n\n![image](images/7g.jpg)Insert\
    \ a statement to retrieve the current order number.\n\n```php\n$order_id = mysqli_insert_id($dbc);\n\
    ```\n\n![image](images/8g.jpg)Now, add statements to retrieve the selected cart\
    \ item details from the “shop” database.\n\n```php\n$q = \"SELECT * FROM shop\
    \ WHERE item_id IN (\";\nforeach ($_SESSION['cart'] as $id) {\n    $q .= $id .\
    \ \",\";\n}\n$q = substr($q, 0, -1) . \") ORDER BY item_id ASC\";\n$r = mysqli_query($dbc,\
    \ $q);\n```\n\n![image](images/9g.jpg)Next, insert statements to store the item\
    \ details in the “order_contents” database.\n\n```php\nwhile ($row = mysqli_fetch_array($r,\
    \ MYSQLI_ASSOC)) {\n    $query = \"INSERT INTO order_contents ( order_id, item_id,\
    \ quantity, price ) VALUES (\" . $order_id . \",\" . $row['item_id'] . \",\" .\
    \ $row['quantity'] . \",\" . $row['price'] . \")\";\n    $result = mysqli_query($dbc,\
    \ $query);\n}\n```\n\n![image](images/10g.jpg)Insert statements to close the database\
    \ connection, display a confirmation message, and empty the cart.\n\n```php\n\
    mysqli_close($dbc);\necho \"<p>Thanks for your order. Your Number Is \" . $order_id\
    \ . \"</p>\";\n$_SESSION['cart'] = NULL;\n```\n\n![image](images/11g.jpg)Add a\
    \ statement to create hyperlinks to other pages on the website, including a “Logout”\
    \ page.\n\n```php\necho '<p><a href=\"shop.php\">Shop</a> | <a href=\"forum.php\"\
    >Forum</a> | <a href=\"home.php\">Home</a> | <a href=\"goodbye.php\">Logout</a></p>';\n\
    ```\n\n![image](images/12g.jpg)Add a final statement to include a page footer.\n\
    \n```php\ninclude ('includes/footer.html');\n```\n\n![image](images/13g.jpg)Save\
    \ this script in your web browser’s `/htdocs` directory as `checkout.php` to complete\
    \ the shopping cart application. The `foreach` loop adds each item ID plus a comma\
    \ to the query, and the `substr()` function removes the final comma. ![image](images/hot.jpg)\
    \ Payment processing is not included in this example but could be added before\
    \ the checkout has ended.\n\n## Confirming logout success\n\nHaving produced a\
    \ Checkout page, described [here on pages 182-183](#chapter10.html#sec88), you\
    \ can now create a PHP script to allow the user to log out from the website. This\
    \ destroys all session data so the user cannot access the website without logging\
    \ in once more.\n\n![image](images/pg184_1.jpg)\n\n### goodbye.php\n\n![image](images/1g.jpg)Launch\
    \ a plain text editor and begin a PHP script with a statement to allow access\
    \ to session data.\n\n```php\n<?php\nsession_start();\n```\n\n![image](images/2g.jpg)Now,\
    \ add statements to redirect the browser to the Login page if the user is not\
    \ already logged in.\n\n```php\nif (!isset($_SESSION['user_id'])) {\n    require\
    \ ('login_tools.php');\n    load();\n}\n```\n\n![image](images/3g.jpg)Next, add\
    \ statements to set the page title and include a page header.\n\n```php\n$page_title\
    \ = 'Goodbye';\ninclude ('includes/header.html');\n```\n\n![image](images/4g.jpg)Add\
    \ a statement to clear existing session variables.\n\n```php\n$_SESSION = array();\n\
    ```\n\n![image](images/5g.jpg)Now, add a statement to end the session.\n\n```php\n\
    session_destroy();\n```\n\n![image](images/6g.jpg)Next, add a statement to display\
    \ a confirmation message and provide a hyperlink back to the Login page.\n\n```php\n\
    echo '<h1>Goodbye!</h1><p>You are now logged out.</p><p><a href=\"login.php\"\
    >Login</a></p>';\n```\n\n![image](images/7g.jpg)Finally, add a statement to include\
    \ a page footer.\n\n```php\ninclude ('includes/footer.html');\n```\n\n![image](images/8g.jpg)Save\
    \ the script in your web browser’s `/htdocs` directory as `goodbye.php`, then\
    \ select items from the shop, checkout, then log out from the website.\n\n![image](images/pg185_1.jpg)\n\
    ![image](images/pg185_2.jpg) PHP and MySQL are a flexible, powerful combination\
    \ that have an important role to fill in the future of the web. ![image](images/forget.jpg)\
    \ By default, a session does not end until the user closes their browser – so\
    \ the PHP script must end the session when the user logs out. ![image](images/hot.jpg)\
    \ You could easily extend the Checkout page script to include order details.\n\
    \n## Summary\n\n- Item details can be stored in a MySQL database table for display\
    \ in a Shop page containing items for selection.\n- Typically, a database table\
    \ containing shop items might store the item ID, name, description, image path,\
    \ and price.\n- Order details can be stored in two related MySQL database tables\
    \ allowing selection of multiple items in multiple orders.\n- Typically, a database\
    \ table containing order summary details might store the order ID, user ID, total\
    \ value, and order date.\n"
