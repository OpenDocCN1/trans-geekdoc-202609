  trans: "\n\n要将此设计生成为名为“forum”的 MySQL 数据库表，所需的 SQL 命令可以在 MySQL 命令行客户端的提示符处执行。或者，可以将\
    \ SQL 命令保存在 SQL 文件中，通过在 MySQL 命令行客户端提示符处输入 `SOURCE` 命令并接系统上 SQL 文件的路径来实现。\n\n\
    ![image](img/forget.jpg)\n\nMySQL 数据库表只能由 root MySQL 用户或其他被授予完全访问权限的 MySQL 用户创建。\n\
    \n![image](img/pg159_1.jpg)\n\n`create_forum.sql`\n\n![image](img/1r.jpg)启动一个纯文本编辑器，并创建一个描述右侧所示表结构要求的\
    \ SQL 命令。\n\n```sql\nCREATE TABLE IF NOT EXISTS forum (\npost_id INT UNSIGNED\
    \ NOT NULL AUTO_INCREMENT ,\nfirst_name VARCHAR(20) NOT NULL,\nlast_name VARCHAR(40)\
    \ NOT NULL,\nsubject VARCHAR(60) NOT NULL,\nmessage TEXT NOT NULL,\npost_date\
    \ DATETIME NOT NULL,\nPRIMARY KEY ( post_id ) ) ;\n```\n\n![image](img/2r.jpg)将文件保存到\
    \ `C:\\SQL` 文件夹中并命名为 `create_forum.sql`，然后启动 MySQL 命令行客户端并以具有完全访问权限的用户（如 root\
    \ 用户）登录。\n\n![image](img/3r.jpg)接下来，执行命令使用已建立的数据库。\n\n`USE site_db ;`\n\n![image](img/4r.jpg)现在，通过指定系统上\
    \ SQL 文件的路径来实现 SQL 命令。\n\n`SOURCE C:\\SQL\\create_forum.sql`\n\n![image](img/5r.jpg)最后，执行命令确认表格式。\n\
    \n`EXPLAIN forum ;`\n\n![image](img/pg159_2.jpg)\n\n![image](img/hot.jpg)\n\n\
    MySQL 的 `TEXT` 数据类型最多可容 65,535 个字符。更大的消息可以使用 `MEDIUMTEXT` 和 `LONGTEXT` 数据类型容纳。\n\
    \n## 提供论坛页面\n\n通常，显示已发布论坛消息的消息板页面可能对注册用户可用。提供此页面的 PHP 脚本可以通过测试会 数据来检查用户已注册，并在测试失败时重定向到登录页面。测试成功后，可以从\
    \ MySQL 论坛数据库表中检索之前发布的消息并在页面上显示，或者脚本也可以简单地提示当前没有消息。论坛消息可以显示页眉和页脚之间，并带有一个指向另一个页面的链接，当前用户可以在该页面发布新的论坛消息。\n\
    \n![image](img/pg160_1.jpg)\n\n`forum.php`\n\n![image](img/1r.jpg)启动一个纯文本编辑器，并使用允许访问会数据的语句开始\
    \ PHP 脚本。\n\n```php\n<?php\nsession_start() ;\n```\n\n![image](img/2r.jpg)现在，添加语句，如果用户尚未登录，将浏览器重定向到登录页面。\n\
    \n```php\nif ( !isset($_SESSION['user_id']) ) )\n{\n    require ( ‘login_tools.php’\
    \ ;\n    load() ;\n}\n```\n\n![image](img/3r.jpg)接下来，添加语句设置页面标题并包含页面页眉。\n\n```php\n\
    $page_title = ‘Forum’ ;\ninclude ( ‘includes/header.html’ ) ;\n```\n\n![image](img/4r.jpg)添加语句打开数据库连接。\n\
    \n```php\nrequire ( '../connect_db.php’ ) ;\n```\n\n![image](img/5r.jpg)现在，添加语句从数据库检索消息或提供默认消息。\n\
    \n```php\n$q = “SELECT * FROM forum” ;\n$r = mysqli_query( $dbc , $q ) ;\nif (\
    \ mysqli_num_rows( $r ) > 0 )\n{\n    # 在此处插入语句（步骤 6）。\n}\nelse\n{ echo ‘<p>There\
    \ are currently no messages.</p>’ ; }\n```\n\n![image](img/forget.jpg)\n\n在完成登录过程之前，无法访问论坛页面，在在此期间会话变量将被设置。\n\
    \n![image](img/6r.jpg)接下来，插入语句，如果从数据库表中检索到任何消息，则编写一个显示所有消息的表格。\n\n```php\necho\
    \ ‘<table><tr><th>Posted By</th>\n<th>Subject</th><th id=”msg”>Message</th></tr>’;\n\
    while ( $row = mysqli_fetch_array( $r , MYSQLI_ASSOC ) )\n{\n    echo ‘<tr>\n\
    <td>’.$row['first_name’].’ ‘.$row['last_name’].‘<br>’\n.$row['post_date’].’</td>\n\
    <td>’.$row['subject’].‘</td><td>’.$row['message’].‘</td>\n</tr>’;\n}\necho ‘</table>’\
    \ ;\n```\n\n![image](img/7r.jpg)添加语句创建指向此网站其他页面的超链接，包括“发布消息”页面。\n\n```php\necho\
    \ ‘<p>\n<a href=”post.php”>Post Message</a> |\n<a href=”shop.php”>Shop</a> |\n\
    <a href=”home.php”>Home</a> |\n<a href=”goodbye.php”>Logout</a></p>’ ;\n```\n\n\
    ![image](img/8r.jpg)现在，添加语句关闭数据库连接。\n\n```php\nmysqli_close( $dbc ) ;\n```\n\n\
    ![image](img/9r.jpg)添加最后的语句包含页面页脚。\n\n```php\ninclude ( ‘includes/footer.html’\
    \ ) ; ?>\n```\n\n![image](img/10r.jpg)将此脚本保存到 浏览器的 hdocs 中命名为 `forum.php`，然后登录并点击论坛页面上的链接进入此\
    \ `forum.php`。表格上的单元格允许用户发布消息。此页面提供返回论坛页面的超链接，如果用户希望返回那里。\n\n"
