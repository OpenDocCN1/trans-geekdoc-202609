    # 安装 Abyss Web 服务器

    # 安装 PHP 引擎

    # 为 Abyss 配置 PHP

    # 嵌入 PHP 脚本

    # 安装 MySQL 服务器

    # 使用 MySQL 客户端

    # 创建 MySQL 用户

    # 连接 PHP 与 MySQL

    # 总结


    ## 介绍 PHP 与 MySQL

    最具吸引力的现代网站通过动态响应某些当前条件（如用户名、当天时间、最新博客、购物车内容等）来提供定制化的用户体验。这些动态网站中的许多都是使用 PHP 和
    MySQL 创建的。


    ![image](img/pg8_1.jpg)


    ## 什么是 PHP？

    PHP 是一种广泛使用的通用型脚本语言，特别适用于 Web 开发，并可以嵌入到 HTML 中。它由程序员 Rasmus Lerdorf 创建，最初是一组维护其网站的脚本，并于
    1995 年 6 月 8 日作为“个人主页工具（PHP Tools）版本 1.0”发布。这些脚本在 1997 年的 2 版本中得到了扩展，名称在次年的 3
    版本中变为一个递归缩写“PHP: Hypertext Preprocessor（超文本预处理器）”。2000 年随着 PHP4 的发布，性能、可靠性和扩展性得到了提高，该版本由新的
    Zend 引擎（一个虚拟机）驱动。当前版本 PHP5 由 Zend II 引擎驱动，由 PHP 组作为免费软件制作。今天，PHP 已安装在超过 2000 万个网站和
    100 万台 Web 服务器上。


    ![image](img/pg8_2.jpg)


    ## 什么是 MySQL？

    MySQL 是世界上最流行的数据库软件，用于管理存储的数据，被称为数据库管理软件（DBMS）或关系型数据库管理软件（RDBMS）。MySQL 由 Michael
    Wildenius 和 David Axmark 于 1995 年创建。其名称（正式读作“My-SQL”，但通常读作“My Sequel”）是 Michael
    的女儿的名字“My”与“SQL”（结构化查询语言）的组合。MySQL 最初由其创始人创立的 MySQL AB 公司生产，该公司在 2008 年被太阳微系统收购，随后于
    2010 年被 Oracle 收购。当前版本 MySQL 8.0 由 InnoDB 存储引擎驱动，MySQL 社区版版作为免费软件提供。今天，MySQL 被用于一些访问频率最频繁的网站，包括
    Google、维基百科、Facebook 和 Twitter。


    重要的是，PHP 和 MySQL 都是“服务端”技术——也就是说，它们驻留在 Web 服务器上。它们不是驻留在用户计算机上的“客户端”技术。因此，它们的魔力发生在“云端”。


    ## 理解云端

    当用户在浏览器中请求查看网页时，浏览器会向 Web 服务器请求页面，并通过 HTTP 协议接收响应页面。如果网页包含 PHP 脚本，Web 服务器可能会先调用
    PHP 引擎处理代码，并在需要时在发送响应到浏览器之前从 MySQL 数据库请求数据。


    ![image](img/pg9_1.jpg)


    接下来的页面将描述如何在本地安装以下服务端技术，为数据驱动型网站创建开发环境：

    * Web 服务器 – Abyss Web Server 免费个人版

    * PHP 引擎 – PHP 7.2

    * MySQL 服务器 – MySQL 社区版 8.0


    ![image](img/hot.jpg)


    HTTP（超文本传输协议）是通用通信标准，允许任何连接到任何 Web 服务器的计算机访问网络上的文件。书中的示例是用列出的软件创建和测试的，但对于其他版本可能需要修改。


    ## 安装 Abyss Web 服务器

    Abyss 是一款适用于 Windows、macOS/Mac X 和 Linux 操作系统的免费紧凑型服务器，可以在 `aprelium.com` 下载。尽管占用空间很小，但
    Abyss 支持许多强大的功能，包括使用服务器端脚本生成动态内容——因此是 PHP 和 MySQL 的理想伴侣。你可以在自己的电脑上安装 Abyss Web
    服务器，为 PHP 和 MySQL 开发提供环境。


    ![image](img/1b.jpg)


    从 `aprelium.com/abyssws/download.php` 下载适用于你系统的 Abyss Web 服务器安装包。


    运行下载的可执行文件启动安装向导，然后点击 Next（下一步）按钮开始。


    ![image](img/pg12_1.jpg)


    接下来，接受许可条款，然后点击 Next（下一步）按钮继续安装。


    ![image](img/pg12_2.jpg)


    关于安装 Abyss Web 服务器的进一步指导，可以在 `aprelium.com/abyssws/start.php` 获取。


    Windows 版本的 Abyss 安装包是一个名为 `abws1.exe` 的可执行文件，运行它即可安装 Web 服务器。


    接受建议的路径 `C:\Abyss Web Server`，然后选择将 Abyss 安装为 Windows 服务。


    下一步，选择你偏好的语言，然后输入以后访问 Abyss 服务器所需的用户名和密码。


    现在，使用选择的用户名和密码登录，查看 Abyss 控制台确认服务器状态为 Running（运行）。


    最后，在浏览器地址栏中输入 `http://localhost`，然后按回车键查看由 Abyss Web 服务器提供的默认欢迎页面。


    如果你选择 Manual（手动）选项，Abyss 标志将不会出现在系统托盘中以便快速启动/停止和访问服务器控制台。相反，可以通过浏览器访问 `http://localhost:9999`
    控制台。


    在 Abyss 控制台中，点击 Configure（配置）按钮然后点击 General（常规）图标，查看默认 HTTP 端口为 80，默认 Documents
    Path（你的网页所在路径）为 `/htdocs`。


    ## 安装 PHP 引擎

    PHP 解释器“引擎”用于网页中实现 PHP 脚本，适用于 Windows、macOS/Mac X 和 Linux 操作系统，可在 `php.net` 免费下载。


    关于 PHP 安装的进一步指导可以在 `php.net/manual/en/install.php` 获取。


    此外，从 `aprelium.com` 提供了适用于 Windows Abyss Web 服务器的预配置包，推荐用于快速安装。


    从 `aprelium.com/downloads` 下载适用于你系统的 PHP 安装包。


    运行下载的可执行文件启动安装向导，然后点击 Next（下一步）按钮开始。


    接下来，接受许可条款，然后点击 Next（下一步）按钮继续安装。


    如果从 `php.net` 为 Windows 安装 PHP，请确保选择 VC6 Thread Safe 版本——因为它需要的 Windows 依赖较少。


    接受建议的路径 `C:\Program Files\PHP7`，然后点击 Install（安装）按钮继续。


    最后，安装完成后点击 Finish（完成）按钮关闭安装向导。


    在为 Abyss Web 服务器配置 PHP 时需要 PHP 的安装位置——请记录目标文件夹。


