    \n![image](img/forget.jpg)\n\n此 `SELECT` 查询使用 `MYSQLI_ASSOC` 常量将结果集返回为关联数组，因此可以通过名称访问列。\n\
    \n![image](img/5v.jpg)再次调用该函数显示所有记录，如果更改失败则显示错误消息\n\n```php\nif( $r )\n{\n   \
    \ show_records( $dbc );\n}\nelse\n{\n    echo '<p>' . mysqli_error( $dbc ) . '</p>';\n\
    }\n```\n\n![image](img/6v.jpg)最后，关闭 MySQL Server 数据库连接\n\n```php\nmysqli_close\
    \ ( $dbc );\n```\n\n![image](img/7v.jpg)将 PHP 脚本保存到 Web 服务器的 `/htdocs` 目录并命名为\
    \ `insert.php`，然后通过 HTTP 打开它以查看数据库表的更改已应用\n\n![image](img/pg127_1.jpg)\n\n![image](img/snake.jpg)\n\
    \n记住 `SELECT` 查询在成功后会返回结果集，而 `INSERT` 查询在成功时仅返回一个 `TRUE` 值。\n\n![image](img/hot.jpg)\n\
    \n你可以按照此处第 99 页的步骤通过 MySQL 命令行客户端创建原始“prints”表。\n\n### 计数记录\n\n可以对内置 PHP 函数 `mysqli_query()`\
    \ 返回的结果集进行检查，使用 `mysqli_num_rows()` 函数来发现它包含多少行。该函数接受结果集作为参数，并返回它包含的行数，如下：\n\n\
    ```php\n$num = mysqli_num_rows( $r );\n```\n\n很有用的是，在执行返回记录的 while 循环之前可以测试返回的行数，以确保结果集不为空。\n\
    \n![image](img/pg128_1.jpg)\n\ncount.php\n\n![image](img/1v.jpg)创建一个 PHP 脚本，开头引入标准脚本以建立与\
    \ MySQL Server 上的数据库的连接\n\n```php\n<?php\nrequire ( '../connect_db.php' );\n```\n\
    \n![image](img/2v.jpg) 接下来，添加一个函数来显示现有表中的所有记录，或显示错误消息\n\n```php\nfunction show_records(\
    \ $dbc )\n{\n    $q = 'SELECT * FROM prints';\n    $r = mysqli_query( $dbc , $q\
    \ );\n    $num = mysqli_num_rows( $r );\n    if ( $num > 0 )\n    {\n        echo\
    \ '<h1>Records in prints table</h1>';\n        while ( $row = mysqli_fetch_array(\
    \ $r , MYSQLI_ASSOC ) )\n        {\n            echo '<br>' . $row['id'] . ' |\
    \ ' . $row['name'] .\n            ' @ ' . $row['price'];\n        }\n    }\n \
    \   else { \n        echo '<p>' . mysqli_error( $dbc ) . '</p>'; \n    }\n}\n\
    ```\n\n![image](img/3v.jpg)现在，调用该函数显示所有记录\n\n```php\nshow_records( $dbc );\n```\n\
    \n![image](img/4v.jpg)创建并执行另一个查询以向表中添加行\n\n```php\n$q = 'INSERT INTO prints (\
    \ name , price ) VALUES ( \"One Center\" , 32.99 ), ( \"Yellow Red Blue\" , 36.99\
    \ ) ';\n$r = mysqli_query( $dbc , $q );\n```\n\n![image](img/5v.jpg)你也可以使用 `mysqli_num_rows()`\
    \ 函数来分页结果。\n\n### 更新记录\n\n`mysqli_affected()` 函数返回一个整数，受 `INSERT`、`UPDATE` 或 `DELETE`\
    \ 查询影响的行数。与接受结果集作为参数的 `mysqli_num_rows()` 函数不同，`mysqli_affected()` 函数接受数据库连接作为参数：\n\
    \n```php\n$num_affected = mysqli_affected( $dbc );\n```\n\nupdate.php\n\n![image](img/1v.jpg)创建一个\
    \ PHP 脚本，开头引入标准脚本以建立与 MySQL Server 上的数据库的连接\n\n```php\n<?php\nrequire ( '../connect_db.php'\
    \ );\n```\n\n![image](img/2v.jpg) 接下来，添加一个函数来显示现有表中的所有记录，或显示错误\n\n```php\nfunction\
    \ show_records( $dbc )\n{\n    $q = 'SELECT * FROM prints';\n    $r = mysqli_query(\
    \ $dbc , $q );\n    $num = mysqli_num_rows( $r );\n    if ( $num > 0 )\n    {\n\
    \        echo '<h1>Records in prints table</h1>';\n        while ( $row = mysqli_fetch_array(\
    \ $r , MYSQLI_ASSOC ) )\n        {\n            echo '<br>' . $row['id'] . ' |\
    \ ' . $row['name'] .\n            ' @ ' . $row['price'];\n        }\n    }\n \
    \   else { \n        echo '<p>' . mysqli_error( $dbc ) . '</p>'; \n    }\n}\n\
    ```\n\n![image](img/3v.jpg)现在，调用该函数显示所有记录\n\n```php\nshow_records( $dbc );\n```\n\
    \n![image](img/4v.jpg)创建并执行另一个查询以更新表中具有特定值的（两条）记录\n\n```php\n$q = 'UPDATE watches\
    \ SET style = “Gents” WHERE style = “Ladies” ';\n$r = mysqli_query( $dbc , $q\
    \ );\n```\n\n![image](img/5v.jpg)如果预期的记录已更新，再次调用该函数显示所有记录\n\n```php\nif( mysqli_affected(\
    \ $dbc ) == 2 )\n{\n    echo '<hr>' . mysqli_affected( $dbc ) . ' Records Updated...';\n\
    \    show_records( $dbc );\n}\n```\n\n![image](img/6v.jpg)最后，关闭 MySQL Server 数据库连接\n\
    \n```php\nmysqli_close ( $dbc );\n```\n\n![image](img/7v.jpg)将 PHP 脚本保存到 Web 服务器的\
    \ `/htdocs` 目录并命名为 `update.php`，然后通过 HTTP 打开它以查看数据库表的更改以及受影响的行数\n\n"
- fmt: "\nPHP provides built-in functions that allow data to be tested by type for\
    \ validation. Each of the functions in the table below return TRUE if the data\
    \ is of a certain type, otherwise they return FALSE:\n\n| Function: | Validates:\
    \ | Example: |\n| --- | --- | --- |\n| `is_numeric()` | Number, even as string\
    \ | `2.0, 20, ‘20’` |\n| `is_int()` | Integer | `100` |\n| `is_float()` | Floating-point\
    \ number | `3.124` |\n| `is_string()` | String | `‘Hello World!’` |\n| `is_null()`\
    \ | Null | `NULL` |\n| `is_scalar()` | Variable | `$var` |\n| `is_array()` | Array\
    \ | `$days` |\n| `is_bool()` | Boolean | `TRUE` |\n| `is_resource()` | External\
    \ Resource | `File Stream` |\n\n![image](images/pg132_1.jpg)\n\n### validate.php\n\
    \n![image](images/1v.jpg)\nCreate a PHP script that begins by incorporating the\
    \ standard script to establish a connection to a database on the MySQL Server.\n\
    \n```php\n<?php\nrequire ( '../connect_db.php’ );\n```\n\n![image](images/2v.jpg)\n\
    Next, add statements to retrieve a single piece of data from a database table\
    \ for validation.\n\n```php\n$q = ‘SELECT price FROM watches WHERE model = “Boston”’;\n\
    $r = mysqli_query($dbc , $q);\nwhile ($row = mysqli_fetch_array($r , MYSQL_NUM))\
    \ {\n    $var = $row[0];\n}\n```\n\n![image](images/3v.jpg)\nNow, add statements\
    \ to test the retrieved data type and display an appropriate result.\n\n```php\n\
    $result = is_numeric($var) ? ‘numeric’ : ‘not numeric’;\necho \"$var is $result\"\
    ;\n\n$result = is_int($var) ? ‘an integer’ : ‘not integer’;\necho \"$var is $result\"\
    ;\n\n$result = is_float($var) ? ‘a float’ : ‘not float’;\necho \"$var is $result\"\
    ;\n\n$result = is_string($var) ? ‘a string’ : ‘not string’;\necho \"$var is $result\"\
    ;\n\n$result = is_null($var) ? ‘NULL’ : ‘not NULL’;\necho \"$var is $result\"\
    ;\n\n$result = is_scalar($var) ? ‘a variable’ : ‘not variable’;\necho \"$var is\
    \ $result\";\n\n$result = is_array($var) ? ‘an array’ : ‘not array’;\necho \"\
    $var is $result\";\n\n$result = is_bool($var) ? ‘a boolean’ : ‘not boolean’;\n\
    echo \"$var is $result\";\n\n$result = is_resource($var) ? ‘a resource’ : ‘not\
    \ resource’;\necho \"$var is $result\";\n```\n\n![image](images/4v.jpg)\nFinally,\
    \ close the MySQL Server connection.\n\n```php\nmysqli_close($dbc);\n```\n\n![image](images/5v.jpg)\n\
    Save the PHP script in your web server’s `/htdocs` directory as `validate.php`,\
    \ then open it via HTTP to see the results of validation.\n\n![image](images/pg133_1.jpg)\n\
    ![image](images/forget.jpg)\nYou should always validate data entered by HTML forms\
    \ to ensure it is of expected data type.\n\n![image](images/hot.jpg)\nYou can\
    \ see here that decimal value is stored in the variable as a string, not a float.\n\
    \n### Ensuring security\n\nWhen scripting with PHP and MySQL it is important to\
    \ consider these issues to prevent users entering data that may accidentally or\
    \ maliciously produce undesirable effects:\n\n- Do not allow the database connection\
    \ script to be directly accessible – place it in parent directory of `/htdocs`.\n\
    - Employ validation functions to ensure data exists and is of correct type – frequently\
    \ use `isset()`, `empty()` and `is_numeric()`.\n- Escape special characters in\
    \ strings to make them safe for queries – first pass them to `mysqli_real_escape_string()`.\n\
    - Avoid HTML special characters – turn them into entity format with `htmlspecialchars()`\
    \ or remove them with `strip_tags()`.\n\n![image](images/snake.jpg)\nRemoval of\
    \ HTML tags is especially important as it prevents cross-site scripting (XSS)\
    \ attacks – by stripping out `<script>` tags so malicious JavaScript code cannot\
    \ be executed. Allowing users to submit data surrounded by quote marks can cause\
    \ a script failure when that data gets into string. For example, in the assignment\
    \ `$str = “Submitted $data”` where `$data` itself contains a string enclosed in\
    \ quotes. Passing the string to `mysqli_real_escape_string()` function returns\
    \ it in a safe format. Similarly, allowing users to submit data surrounded by\
    \ HTML tags can be problematic, but passing it to `strip_tags()` removes the tags,\
    \ or passing it to `htmlspecialchars()` turns them into entity format.\n\n![image](images/pg134_1.jpg)\n\
    \n### secure.php\n\n![image](images/1v.jpg)\nCreate an HTML document containing\
    \ a form with one text input field for data submission.\n\n```html\n<form action=\"\
    secure.php\" method=\"POST\">\n<p>New Name : <input type=\"text\" name=\"name\"\
    >\n<input type=\"submit\"></p>\n</form>\n```\n\n![image](images/2v.jpg)\nAdd a\
    \ script that displays an item from an existing table.\n\n```php\n<?php\nrequire('../connect_db.php');\n\
    // Validation statements to be inserted here (Step 3).\n$q = ‘SELECT * FROM towels\
    \ WHERE id = 1 ‘\n$r = mysqli_query($dbc , $q);\nwhile ($row = mysqli_fetch_array($r\
    \ , MYSQL_NUM)) {\n    echo \"<p>Name : $row[1]</p>\";\n}\nmysqli_close($dbc);\n\
    ?>\n```\n\n![image](images/3v.jpg)\nNext, insert statements to validate that the\
    \ user has submitted a valid string, then update the existing table record.\n\n\
    ```php\nif (!empty($_POST['name']) && !is_numeric($_POST['name'])) {\n    $name\
    \ = $_POST['name'];\n    // Security statements to be inserted here (Step 4).\n\
    \    $q = ‘UPDATE towels SET name=“.$name.’” WHERE id= 1’;\n    mysqli_query($dbc\
    \ , $q);\n} else {\n    echo ‘No valid name submitted’;\n}\n```\n\n![image](images/4v.jpg)\n\
    Now, insert statements to make the submitted data safe for use in SQL queries,\
    \ and to remove any HTML tags.\n\n```php\n$name = mysqli_real_escape_string($dbc\
    \ , $name);\n$name = strip_tags($name);\n```\n\n![image](images/5v.jpg)\nSave\
    \ the PHP script in your web server’s `/htdocs` directory as `secure.php`, then\
    \ open it via HTTP and submit data enclosed in HTML tags and quote marks to see\
    \ them securely handled by the script.\n\n![image](images/pg135_1.jpg)\n![image](images/pg135_2.jpg)\n\
    ![image](images/hot.jpg)\nYou can comment out (by inserting a `#` at the beginning\
    \ of the line) the first statement in Step 4 to see the update fail, or comment\
    \ out its second statement to see the update then display in a bold font.\n\n\
    ![image](images/hot.jpg)\nYou can create the original “towels” table from the\
    \ MySQL Command Line Client by following the steps [here on page 100](#chapter06.html#sec49).\n\
    \n### Handling errors\n\nPHP provides useful error messages when it encounters\
    \ problems with a script – describing both runtime and syntax errors. Additionally,\
    \ you can create your own custom error handler to provide messages describing\
    \ script problems that may arise.\n\nEach error that occurs can be defined by\
    \ a built-in PHP constant that has a unique numerical value, like those in the\
    \ table below:\n\n| Value: | Constant: | Description: |\n| --- | --- | --- |\n\
    | 1 | `E_ERROR` | Fatal runtime error, which halts execution of the script |\n\
    | 2 | `E_WARNING` | Non-fatal runtime error, which does not halt the script |\n\
    | 4 | `E_PARSE` | Syntax error, which prevents the interpreter running the script\
    \ |\n| 8 | `E_NOTICE` | Possible runtime error, which simply provides a notice\
    \ tip |\n| 256 | `E_USER_ERROR` | Fatal user-generated error, set by the `trigger_error()`\
    \ function |\n| 512 | `E_USER_WARNING` | Non-fatal user-generated error, set by\
    \ `trigger_error()` function |\n| 1024 | `E_USER_NOTICE` | User-generated notice,\
    \ set by the `trigger_error()` function |\n\nA custom error handler function of\
    \ your own name is nominated as the argument to the PHP `set_error_handler()`\
    \ function. Errors generate five descriptive components that can be passed as\
    \ arguments to your error handler – error level, message, file, line, and context.\
    \ The error level and message are mandatory.\n"
