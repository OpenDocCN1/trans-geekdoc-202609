  trans: "\n\n![image](img/forget.jpg)\n\n在键（key）重要的情况下，请勿使用 `sort()` 或 `rsort()`\
    \ 函数。\n\n### 描述维度\n\n数组元素的编号更准确的说法是“数组索引”（array index），由于元素编号从零开始，所以有时被称为“零基索引”。使用单个索引创建的数组是一维数组，其元素出现在单行中：\n\
    \n![image](img/pg34_1.jpg)\n\n| 元素内容... || **A** || **B** || **C** || **D** ||\
    \ **E** |\n| --- | --- | --- | --- | --- | --- |\n| 索引数字... || [0] || [1] || [2]\
    \ || [3] || [4] |\n\n数组也可以有多个索引——用于表示多个维度。使用两个索引创建的数组是二维数组，其元素出现在多行中：\n\n| 第一个索引\
    \ || [0] || **A** || **B** || **C** || **D** || **E** |\n| --- | --- | --- | ---\
    \ | --- | --- |\n| 第二个索引 || [1] || **F** || **G** || **H** || **I** || **J** |\n\
    | | [0] || [1] || [2] || [3] || [4] |\n\n在多维数组中，每个元素的值通过指定每个索引的数字来引用。例如，对于上面的二维数组，`[1]\
    \ [2]` 处的元素包含字母 `H`。\n\n二维数组用于存储基于网的信息，例如 XY 坐标。创建一个具有三个索引的三维数组将允许存储 XYZ 坐标。\n\
    \n在 PHP 中创建多维数组只需是创建一个外部数组，其元素本身也是数组。与往常一样，你可以选择性地为每个元素指定一个键名——在这种情况下，用于表示每个内部数组。然后可以使用键名和内部索引数字来引用单独的值：\n\
    \n`$matrix['Letter'][0]`\n\n然而，当在字符串中使用带引号键的数组变量时，必须始终将其括在花括号内：\n\n`echo “Element\
    \ value is {$matrix['Letter'][0]} ” ;`\n\n可以使用 `foreach` 循环通过遍历数组来访问多维数组中的所有内部数组。然后可以使用嵌套的\
    \ `foreach` 循环依次引用每个元素。\n\n![image](img/snake.jpg)\n\n超过两个索引的多维数组可能会产生难以阅读的源代码，并可能导致错误。\n\
    \n![image](img/1r.jpg)创建一个有效的 HTML 文档，如此处第 16 页 所示的那样，然后在 body 部分插入 PHP 标签：\n\n\
    ```php\n<?php\n# 在此处插入语句。\n?>\n```\n\n![image](img/pg35_1.jpg)\n\nmatrix.php\n\
    \n![image](img/2r.jpg)现在，在 PHP 标签之间插入一条语句，创建并初始化两个普通变量数组和一个带键名的二维数组：\n\n`$letters\
    \ = array( ‘A’ , ‘B’ , ‘C’ ) ;`\n`$numbers = array( 1 , 2 , 3 ) ;`\n`$matrix =\
    \ array( ‘Letter’ => $letters , ‘Number’ => $numbers ) ;`\n\n![image](img/3r.jpg)接下来，插入一条语句来显示存储的单个值：\n\
    \n`echo “<p>Start : {$matrix['Letter'][0]} </p>” ;`\n\n![image](img/4r.jpg)最后，插入语句将所有元素中的键和值以两个无序列表的形式显示：\n\
    \n```php\nforeach( $matrix as $array => $list )\n{\n    echo ‘<ul’ ;\n    foreach(\
    \ $list as $key => $value )\n    { \n        echo “<li>$array [ $key ] = $value”\
    \ ; \n    }\n    echo ‘</ul>’ ;\n}\n```\n\n![image](img/5r.jpg)将文档保存到 浏览器的 `/htdocs`\
    \ 目录中作为 `matrix.php`，然后通过 HTTP 打开页面以查看变量数组值的显示：\n\n![image](img/pg35_2.jpg)\n\n\
    ![image](img/hot.jpg)\n\n多维数组比你想象的要常见。例如，允许对相同名称输入进行多次选择的 HTML 表单是以多维数组的形式提交的。\n\
    \n![image](img/forget.jpg)\n\n使用引号键的数组变量在包含字符串字符串时必须括在花括号内。\n\n### 算术运算\n\nPHP\
    \ 脚本中常用的算术运算符下表所示，以及它们执行的操作：\n\n| 运算符: | 操作: |\n| --- | --- |\n| `+` | 加法 |\n\
    | `-` | 减法 |\n| `*` | 乘法 |\n| `/` | 除法 |\n| `%` | 取模 |\n| `++` | 递增 |\n| `--`\
    \ | 递减 |\n\n加、减、乘、除法运算符的作用如你所预期的那样工作。然而，当使用多个运算符时，必须对表达式进行分组以保持清晰度：\n\n`a = b\
    \ * c -d % e / f ; # 这不清晰.`\n`a = ( b * c ) - ( ( d % e ) / f ) ; # 这清晰得多.`\n\n"
- fmt: '

    The `==` equality operator compares two operands and returns a Boolean `TRUE`
    result if both are numerically equal in value, otherwise it returns `FALSE`. Characters
    and strings are also compared numerically by their ASCII code value. Conversely,
    the `!=` inequality operator returns `TRUE` if the two operands are not equal,
    otherwise it returns `FALSE`.


    The `>` “greater than” operator compares two operands and returns `TRUE` if the
    first is greater in value than the second, or it returns `FALSE` if it is equal
    or less in value. The `<` “less than” operator makes the same comparison but returns
    `TRUE` if the first operand is less in value than the second, otherwise it returns
    `FALSE`. Adding the `=` operator after a `>` “greater than” or `<` “less than”
    operator makes it also return `TRUE` when the two operands are exactly equal.


    The `?:` ternary operator evaluates an expression for a `TRUE` or `FALSE` Boolean
    value, then executes one of two statements depending on the result of the evaluation.
    An appropriate returned value can be assigned to a variable using this syntax:


    `$var = ( *expression*) ? *if-TRUE-return-this* : *if-FALSE-return-this* ;`


    ![image](images/hot.jpg)


    Equality and inequality operators are useful in testing the state of two variables
    to perform conditional branching in a PHP script.


    ![image](images/1r.jpg)Create a valid HTML document, like the one listed [here
    on page 16](#chapter01.html#sec6), then insert PHP tags into the body section


    ```php

    <?php


    # Statements to be inserted here.


    ?>

    ```


    ![image](images/pg39_1.jpg)


    comparison.php


    ![image](images/2r.jpg)Now, between the PHP tags insert statements to create and
    initialize five variables


    `$zero = 0 ; $nil = 0 ; $one = 1 ; $upr = ‘A’ ; $lwr = ‘a’ ;`


    ![image](images/3r.jpg)Next, insert statements to display equality comparisons


    `$result = ( $zero == $nil ) ? ‘TRUE’ : ‘FALSE’`


    `echo “0 == 0 is $result <br>” ;`


    `$result = ( $zero == $one ) ? ‘TRUE’ : ‘FALSE’ ;`


    `echo “0 == 1 is : $result <br>” ;`


    `$result = ( $upr == $lwr ) ? ‘TRUE’ : ‘FALSE’ ;`


    `echo “A == a is $result <br>” ;`


    `$result = ( $upr != $lwr ) ? ‘TRUE’ : ‘FALSE’ ;`


    `echo “A != a is $result <hr>” ;`


    ![image](images/4r.jpg)Finally, insert statements to display greater comparisons


    `$result = ( $one > $nil ) ? ‘TRUE’ : ‘FALSE’ ;`


    `echo “1 > 0 is $result <br>” ;`


    `$result = ( $zero >= $nil ) ? ‘TRUE’ : ‘FALSE’ ;`


    `echo “0 >= 0 is $result <br>” ;`


    `$result = ( $one <= $nil ) ? ‘TRUE’ : ‘FALSE’ ;`


    `echo “1 <= 0 is $result <br>” ;`


    ![image](images/5r.jpg)Save the document in your web browser’s `/htdocs` directory
    as `comparison.php`, then open the page via HTTP to see the results get displayed


    ![image](images/pg39_2.jpg)


    ![image](images/hot.jpg)


    A Boolean `TRUE` value is represented numerically by 1 in the PHP language.


    ![image](images/hot.jpg)


    The ASCII code value for uppercase ‘A’ is 65, and for lowercase ‘a’ it’s 97 –
    so their comparison here returns `FALSE`.


    ### Assessing logic


    The logical operators most commonly used in PHP scripts are listed in the table
    below:


    | Operator: || | Operation: |

    | --- | --- |

    | `&&` | Logical AND |

    | `AND` | Logical AND ( alternative form of `&&` ) |

    | `||` | Logical OR |

    | `OR` | Logical OR ( alternative form of `||` ) |

    | `!` | Logical NOT |


    The logical operators are used with operands that have the Boolean values of `TRUE`
    or `FALSE`, or an expression that can convert to `TRUE` or `FALSE`.


