    \ key and value in all elements as two unordered lists\n\n```php\nforeach( $matrix\
    \ as $array => $list )\n{\n    echo ‘<ul’ ;\n    foreach( $list as $key => $value\
    \ )\n    { \n        echo “<li>$array [ $key ] = $value” ; \n    }\n    echo ‘</ul>’\
    \ ;\n}\n```\n\n![image](images/5r.jpg)Save the document in your web browser’s\
