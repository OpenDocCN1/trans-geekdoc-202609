    ![image](img/4o.jpg)现在，执行另一个查询来显示 `site_db` 数据库中存在的所有表


    ```sql

    SHOW TABLES ;

    ```


    ![image](img/pg85_1.jpg)


    ![image](img/forget.jpg)


    你在第一章安装 MySQL Server 之后创建了名为 `site_db` 的数据库——请参阅此处第 20 页。


    ![image](img/hot.jpg)


    此示例中的 `SHOW TABLES;` 查询返回了“空集”（empty set）消息，因为 `site_db` 数据库中还没有任何表 —— 但本本书的剩余内容中，你将在那里创建表。


    ## 创建表


    通过执行此查询可以创建一个 MySQL 数据库表：


    ```sql

    CREATE TABLE IF NOT EXISTS table-name ( col type , col type ) ;

    ```


    该查询语句后面必须跟着括号，括号内包含一个用逗号分隔的列定义列表 —— 定义每个表列的名称以及该列可能包含的数据类型。例如，一个名为“fruit”（水果）的表可能包含三个名为
    `id`、`name` 和 `color` 的列。`INT` 关键字可以指定 `id` 列可能只包含整数值，而 `TEXT` 关键字可以指定 `name`
    和 `color` 列可能只包含文本值。


    你可以使用此查询来发现任何表的格式：


    ```sql

    EXPLAIN table-name ;

    ```


    也可以使用此查询从数据库中删除表：


    ```sql

    DROP TABLE IF EXISTS table-name ;

    ```


    在 `mysql>` 提示符下准确输入创建一个具有许多列的表的创建查询可能很困难，因此最好先将查询创建为 SQL 文本文件，然后在命令行提示符中使用 `SOURCE`
    关键字实现查询，并指定文件路径，例如位于系统根目录（`C:\`）下的“SQL”文件夹中的路径：


    ![image](img/pg86_1.jpg)


    create_table.sql


    ![image](img/1o.jpg)启动一个纯文本编辑器（如记事本），并创建一个定义上述上述“fruit”表示例的查询


    ```sql

    CREATE TABLE IF NOT EXISTS fruit

    (

    | id INT , |

    | --- | --- |

    | name TEXT , |

    | color TEXT , |

    ) ;

    ```


    ![image](img/2o.jpg)将文件保存到 `C:\SQL` 文件夹中并为 `create_table.sql`，然后启动 MySQL 命令行客户端并以具有完全访问权限的用户（如
    root）登录


    ![image](img/3o.jpg)接下来，执行一个查询以使用已建立的数据库


    ```sql

    USE site_db ;

    ```


    ![image](img/snake.jpg)


    你可能也会看到较短的 `CREATE TABLE` 和 `DROP TABLE` 查询，但使用这些长版本来检查现有表是一个良好的习惯。


    ![image](img/4o.jpg)现在，通过指明系统中 SQL 文件的源路径来实现 SQL 查询


    ```sql

    SOURCE C:\SQL\create_table.sql

    ```


    ![image](img/5o.jpg)执行查询以确认表的存在和格式


    ```sql

    EXPLAIN fruit ;

    ```


    ![image](img/6o.jpg)最后，删除表并确认其已删除


    ```sql

    DROP TABLE IF EXISTS fruit ;

    SHOW TABLES ;

    ```


    ![image](img/pg87_1.jpg)


    `EXPLAIN` 查询揭示了“fruit”表的格式，它允许 `id` 字段包含长达 11 位的整数 —— 实际上，这限制在 -2147483648 到 2147483647
    之间的值。


    在此示例中，“YES”表示每个字段都允许不包含值，即由 `NULL` 关键字定义。事实上，每个字段在创建时都没有设置默认值，因此确实包含 `NULL` 值。请注意，`NULL`
    代表完全没有值 —— 这与用 "" 表示的空字符串不同。


    ![image](img/hot.jpg)


    MySQL 查询使用结构化查询语言（SQL）的一个版本，其中每个查询必须以分号结束，但 `SOURCE` 关键字仅描述一个不能以分号结尾的路径。


    ![image](img/forget.jpg)


    你可以在 SQL 文件中格式化列定义以提高可读性 —— 额外的空格和换行会被忽略。


    ```sql

    Defining data types

    ```


    下表描述了可用于定义数据库表列的数据类型指定符的范围。建议精确指定允许的数据类型。例如，如果一列只包含短字符串，请使用 `VARCHAR()` 而不是 `TEXT`。


    | Type: | Value: |

    | --- | --- |

    | INT | 整数 -2,147,483,648 到 2,147,483,647 |

    | DECIMAL | 浮点数，可以指定允许的位数。例如，DECIMAL(5,2) 允许 -999.99 到 999.99 |

    | DOUBLE | 双精度浮点数 |

    | DATE | YYYY-MM-DD 格式的日期 |

    | TIME | HH:MM:SS 格式的时间 |

    | DATETIME | YYYY-MM-DD HH:MM:SS 格式的组合日期和时间 |

    | YEAR | 1901-2155 年，格式为 YY 或 YYYY |

    | TIMESTAMP | 最后输入的日期和时间 |

    | CHAR() | 固定长度的字符串，最大 100 |

    | VARCHAR() | 可变长度字符串，最大 255 |

    | TEXT | 最大 65535 字节的字符串 |

    | BLOB | 二进制类型 |

    | ENUM() | 从定义列表中选择单个字符串 |

    | SET() | 从定义列表中选择一个或多个字符串 |


    相反的 SQL 脚本创建一个具有各种类型的表。`id` 列仅接受整数值。可以记录每条记录的日期和时间。`first_name` 和 `last_name`
    列各可以包含 20 个字符。


    ```sql

    CREATE TABLE IF EXISTS user_log

    (

    | id INT, |

    | --- | --- |

    | date TIMESTAMP, |

    | first_name VARCHAR(20), |

    | last_name VARCHAR(20), |

    ) ;

    ```


    ![image](img/pg89_1.jpg)


    data_types.sql


    ![image](img/2o.jpg)将文件保存到 `C:\SQL` 文件夹中并为 `data_types.sql`，然后启动 MySQL 命令行客户端并以具有完全访问权限的用户（如
    root）登录


    **添加修饰符**


    除了指定允许的数据类型外，结合上一页的关键字，可以使用下表的修饰关键字来进一步控制列内容：


    | Modifier: | Purpose: |

    | --- | --- |

    | NOT NULL | 强制每条记录必须在该列中包含数据值 |

    | UNIQUE | 强制记录不得重复该列中的任何输入 |

    | AUTO_INCREMENT | 仅适用于数值列，自动生成比该列上一个值大 1 的数字 |

    | DEFAULT | 在插入记录时未说明此列值时，指定使用的值 |

    | PRIMARY KEY | 指定列或多个列作为该表的主键 |


    '
- fmt: '

    When it is essential that a record must include a value for a column, that column
    should be defined with the `NOT NULL` modifier. This allows an empty string `""`
    to be stored there but does not allow that column to be empty or `NULL`. When
    the data stored in a column should never be duplicated that column should be defined
    with the `UNIQUE` modifier. For instance, to avoid the accidental duplication
    of product codes. The `AUTO_INCREMENT` modifier is particularly useful to automatically
    generate incremental identity numbers for each row – the first row will be numbered
    1, the second row 2, and so on. Setting a column `DEFAULT` allows records to be
    inserted without tediously requiring a value for a column that is usually constant.
    For instance, a “quantity” column might usually contain a value of 1 in each record
    – so 1 could be set as its default value.


    The SQL script listed opposite creates a table that uses modifiers in its column
    definitions to control the permissible content. The “id” column automatically
    numbers each row and the “quantity” column will contain 1 unless another value
    is inserted. All the other columns must contain values – they can’t be empty or
    `NULL`.


    ![image](images/hot.jpg)


    The `PRIMARY KEY` modifier is described in more detail [here on page 92](#chapter05.html#sec45).


    ![image](images/1o.jpg)Launch a plain text editor such as Notepad, and create
    a query defining a table with columns of various modifiers


    ```sql

    CREATE TABLE IF NOT EXISTS products

    (

    | id | INT UNIQUE | AUTO_INCREMENT , |

    | --- | --- | --- |

    | code | INT | NOT NULL , |

    | name | VARCHAR(25) | NOT NULL , |

    | quantity | INT | DEFAULT 1 NULL , |

    | price | DECIMAL(6,2) | NOT NULL |

    ) ;

    ```


