  trans: "\n\n脚本定义了一个名为 `dbc`（数据库连接）的 PHP 变量，其值赋值为内置函数 `mysqli_connect()` 的返回值。该调用需要四个参数来指定\
    \ MySQL 用户详情和要连接的数据库。当调用成功时，`mysqli_connect()` 函数返回一个代表与 MySQL 服务器连接的“对象”。\n\n\
    成功调用 `mysqli_connect()` 返回的对象非常重要，因为它在其他与 MySQL 服务器通信的 PHP 函数调用中被用作参数传递。例如，在上面的脚本中，它必须作为\
    \ `mysqli_set_charset()` 函数调用的第一个参数以标识该连接。\n\n当 `mysqli_connect()` 函数调用失败时，脚本将跳转到调用\
    \ `die()` 函数的备选分支。这等于调用 `exit()` 来立即终止脚本。可选地，`die()` 函数可以接受字符串参数，该字符串将在脚本停止时打印出来。在这种情况下，字符串消息是由\
    \ `mysqli_connect_error()` 函数返回的，用于描述连接失败的原因。\n\n由于连接脚本包含敏感的用户信息，因此不能将其放置在 Web\
    \ 服务器 `/htdocs` 目录下的其他 PHP 脚本并列。`connect_db.php` 脚本应该位于 `/htdocs` 的父目录，在那里它无法被直接访问，但可以通过\
    \ `require` 语句与其他 PHP 脚本合并，如下所示：\n\n```php\n<?php\nrequire ( '../connect_db.php’\
    \ ) ;\nif ( mysqli_ping( $dbc ) )\n{\n    echo ‘MySQL Server ‘ . mysqli_get_server_info(\
    \ $dbc ) . ‘ on ‘ . mysqli_get_host_info( $dbc ) ;\n}\n```\n\n![image](img/pg120_2.jpg)\n\
    \nrequire.php\n\n因此，Web 服务器目录结构中的文件应按所示的分级结构排列，这样当通过 HTTP 请求 `require.php` 脚本时，`connect_db.php`\
    \ 脚本将从其父目录的位置引入，并建立到 MySQL 服务器的连接。\n\n![image](img/pg121_1.jpg)\n\n![image](img/pg121_2.jpg)\n\
    \n![image](img/hot.jpg)\n\n包含纯 PHP 代码的文件（如此处列出的两个文件）应省略文件末尾的 PHP `?>` 结束标签。这可以防止\
    \ PHP 结束标签后出现意外的空格或换行，这些可能会导致意外的影响。\n\n![image](img/snake.jpg)\n\n在继续之前，确保你的连接脚本\
    \ `connect_db.php` 运行成功——在本书的其余部分都需要它来连接到 `site_db` MySQL 数据库。\n\n### 执行查询\n\n\
    一旦你的 PHP 脚本建立了与 MySQL 服务器上指定数据库的连接，就可以使用 PHP `mysqli_query()` 函数进行查询，其语法如下：\n\n\
    ```\nmysqli_query ( database-connection-object , sql-query )\n```\n\n数据库连接对象是标准脚本在此处第\
    \ 121 页 中赋值给变量（`$dbc`）的对象。通常，SQL 查询是一个赋值给另一个变量的字符串，该字符串可以作为函数的第二个参数使用。\n\n当调用\
    \ `mysqli_query()` 函数时，调用成功则返回一个“结果集”或 TRUE 值，调用失败则返回 FALSE 值。将返回值赋值给变量可以测试查询的执行是成功还是失败。\n\
    \n可选地，你的脚本可以在查询执行后调用 `mysqli_close()` 来显式关闭连接。尽管这在脚本结束时会自动发生，但进行此调用被认为是一种良好的做法。\n\
    \n![image](img/pg122_1.jpg)\n\nquery.php\n\n![image](img/1v.jpg)创建一个 PHP 脚本，首先引入标准脚本以建立到\
    \ MySQL 服务器上数据库的连接\n\n```php\n<?php\nrequire ( ../connect_db.php ‘ ) ;\n```\n\n\
    ![image](img/2v.jpg)接下来，初始化一个带有 SQL 查询字符串的变量\n\n```php\n$q \\= ‘SHOW TABLES’ ;\n\
    ```\n\n![image](img/3v.jpg)现在，初始化另一个变量，这次是对 MySQL 服务器数据库的查询结果\n\n```php\n$r \\\
    = mysqli_query ( $dbc , $q ) ;\n```\n\n![image](img/4v.jpg)测试查询是否成功并显示适当的消息\n\n\
    ```php\nif ( $r )\n{ echo ‘<h1>Result Set Returned OK</h1>’ ; }\nelse\n{ echo\
    \ ‘<p>’ . mysqli_error( $dbc ) . ‘</p> ; }\n```\n\n![image](img/5v.jpg)最后，关闭 MySQL\
    \ 服务器数据库连接\n\n```php\nmysqli_close ( $dbc ) ;\n```\n\n![image](img/6v.jpg)将 PHP\
    \ 脚本保存在 Web 服务器的 `/htdocs` 目录下并命名为 `query.php`，然后通过 HTTP 打开它查看确认查询成功的消息\n\n![image](img/pg123_1.jpg)\n\
    \n![image](img/7v.jpg)现在，编辑 SQL 查询字符串使其出错\n\n```php\n$q \\= ‘SHOW TABLE’ ;\n```\n\
    \n![image](img/8v.jpg)再次保存编辑过的 PHP 脚本，然后再次通过 HTTP 打开它查看描述查询失败的消息\n\n![image](img/pg123_2.jpg)\n\
    \n![image](img/snake.jpg)\n\n仅包含纯 PHP 代码的文件（如此处列出的两个文件）应省略文件末尾的 PHP `?>` 结束标签。这可以防止\
    \ PHP 结束标签后出现意外的空格或换行，这些可能会导致意外的影响。\n\n![image](img/snake.jpg)\n\n在继续之前，确保你的连接脚本\
    \ `connect_db.php` 运行成功——在本书的其余部分都需要它来连接到 `site_db` MySQL 数据库。\n\n### 执行查询\n\n\
    一旦你的 PHP 脚本建立了与 MySQL 服务器上指定数据库的连接，就可以使用 PHP `mysqli_query()` 函数进行查询，其语法如下：\n\n\
    ```\nmysqli_query ( database-connection-object , sql-query )\n```\n\n数据库连接对象是标准脚本在此处第\
    \ 121 页 中赋值给变量（`$dbc`）的对象。通常，SQL 查询是一个赋值给另一个变量的字符串，该字符串可以作为函数的第二个参数使用。\n\n当调用\
    \ `mysqli_query()` 函数时，调用成功则返回一个“结果集”或 TRUE 值，调用失败则返回 FALSE 值。将返回值赋值给变量可以测试查询的执行是成功还是失败。\n\
    \n可选地，你的脚本可以在查询执行后调用 `mysqli_close()` 来显式关闭连接。尽管这在脚本结束时会自动发生，但进行此调用被认为是一种良好的做法。\n\
    \n![image](img/pg122_1.jpg)\n\nquery.php\n\n![image](img/1v.jpg)创建一个 PHP 脚本，首先引入标准脚本以建立到\
    \ MySQL 服务器上数据库的连接\n\n```php\n<?php\nrequire ( ../connect_db.php ‘ ) ;\n```\n\n\
    ![image](img/2v.jpg)接下来，初始化一个带有 SQL 查询字符串的变量\n\n```php\n$q \\= ‘SHOW TABLES’ ;\n\
    ```\n\n![image](img/3v.jpg)现在，初始化另一个变量，这次是对 MySQL 服务器数据库的查询结果\n\n```php\n$r \\\
    = mysqli_query ( $dbc , $q ) ;\n```\n\n![image](img/4v.jpg)测试查询是否成功并显示适当的消息\n\n\
    ```php\nif ( $r )\n{ echo ‘<h1>Result Set Returned OK</h1>’ ; }\nelse\n{ echo\
    \ ‘<p>’ . mysqli_error( $dbc ) . ‘</p> ; }\n```\n\n![image](img/5v.jpg)最后，关闭 MySQL\
    \ 服务器数据库连接\n\n```php\nmysqli_close ( $dbc ) ;\n```\n\n![image](img/6v.jpg)将 PHP\
    \ 脚本保存在 Web 服务器的 `/htdocs` 目录下并命名为 `query.php`，然后通过 HTTP 打开它查看确认查询成功的消息\n\n![image](img/pg123_1.jpg)\n\
    \n![image](img/7v.jpg)现在，编辑 SQL 查询字符串使其出错\n\n```php\n$q \\= ‘SHOW TABLE’ ;\n```\n\
    \n![image](img/8v.jpg)再次保存编辑过的 PHP 脚本，然后再次通过 HTTP 打开它查看描述查询失败的消息\n\n![image](img/pg123_2.jpg)\n\
    \n![image](img/snake.jpg)\n\n仅包含纯 PHP 代码的文件（如此处列出的两个文件）应省略文件末尾的 PHP `?>` 结束标签。这可以防止\
    \ PHP 结束标签后出现意外的空格或换行，这些可能会导致意外的影响。\n\n### 获取结果\n\n某些 SQL 查询（如 INSERT, UPDATE,\
    \ DELETE 或 ALTER）不返回数据，因此在执行成功时仅返回 TRUE 值。其他 SQL 查询（如 SHOW 或 SELECT）在执行成功时返回“结果集”。\n\
    \n结果集包含记录行，可以使用 `while` 循环逐行读取。`mysqli_fetch_array()` 函数需要结果集变量作为第一个参数。可选地，可以通过第二个参数指定返回的数组类型——关联数组、索引数组或两者兼有。可以使用下方列出的内置\
    \ PHP 常量：\n\n| 常量: | 示例 |\n| --- | --- |\n| `MYSQLI_ASSOC` | `$row['column-name']`\
    \ |\n| `MYSQLI_NUM` | `$row[0]` |\n| `MYSQLI_BOTH` | `$row['column-name']` OR\
    \ `$row[0]` |\n\n可选地，你的脚本可以调用 `mysqli_free_result()` 来释放结果集。尽管这在脚本结束时会自动发生，但进行此调用被认为是一种良好的做法。\n\
    \n![image](img/pg124_1.jpg)\n\nresult.php\n\n![image](img/1v.jpg)创建一个 PHP 脚本，首先引入标准脚本以建立到\
    \ MySQL 服务器上数据库的连接\n\n```php\n<?php\nrequire ( ../connect_db.php ‘ ) ;\n```\n\n\
    ![image](img/2v.jpg)接下来，初始化一个带有 SQL 查询字符串的变量\n\n```php\n$q \\= ‘SHOW TABLES’ ;\n\
    ```\n\n![image](img/3v.jpg)现在，初始化另一个变量，这次是对 MySQL 服务器数据库的查询结果\n\n```php\n$r \\\
    = mysqli_query ( $dbc , $q ) ;\n```\n\n![image](img/4v.jpg)测试查询是否成功并显示适当的消息\n\n\
    ```php\nif ( $r )\n{\n    echo ‘<h1>Tables on site_db database</h1> ‘ ;\n    //\
    \ 在此处插入语句（步骤 5）。\n}\nelse\n{\n    echo ‘<p>’ . mysqli_error( $dbc ) . ‘</p> ;\
    \ }\n}\n```\n\n![image](img/5v.jpg)现在，插入语句显示返回的每行数据并释放结果集\n\n```php\nwhile ( $row\
    \ \\= mysqli_fetch_array( $r , MYSQLI_NUM ) )\n{\n    echo ‘<br>’. $row\\[ 0 \\\
    ] ;\n}\nmysqli_free_result( $r ) ;\n```\n\n![image](img/6v.jpg)最后，关闭 MySQL 服务器数据库连接\n\
    \n```php\nmysqli_close ( $dbc ) ;\n```\n\n![image](img/7v.jpg)将 PHP 脚本保存在 Web\
    \ 服务器的 `/htdocs` 目录下并命名为 `result.php`，然后通过 HTTP 打开它查看结果\n\n![image](img/pg125_1.jpg)\n\
    \n如果未显式指定数组类型，`mysqli_fetch_array()` 函数默认返回两种类型。\n\n"
- fmt: "\n![image](images/hot.jpg)\n\nThe results shown here list the tables created\
    \ in the previous two chapters from the MySQL Command Line Client.\n\n### Applying\
    \ changes\n\nChanges can be applied to an existing MySQL database table by making\
    \ SQL queries of `INSERT`, `UPDATE`, `DELETE` or `ALTER`. When these are made\
    \ from a PHP script by the `mysqli_query()` function, it returns a `TRUE` value\
    \ when the query succeeds. This condition can be tested to perform an appropriate\
    \ action. For example, to display all records in the table after adding new rows\
    \ upon success, or to display an error message upon failure.\n\n![image](images/pg126_1.jpg)\n\
    \ninsert.php\n\n![image](images/1v.jpg)Create a PHP script that begins by incorporating\
    \ the standard script to establish a connection to a database on the MySQL Server\n\
    \n```php\n<?php\nrequire ( '../connect_db.php' );\n```\n\n![image](images/2v.jpg)Next,\
    \ add a function to display all records in an existing table, or display an error\
    \ message\n\n```php\nfunction show_records( $dbc )\n{\n    $q = 'SELECT * FROM\
    \ prints';\n    $r = mysqli_query( $dbc , $q );\n    if ( $r )\n    {\n      \
    \  echo '<h1>Records in prints table</h1>' ;\n        while ( $row = mysqli_fetch_array(\
    \ $r , MYSQLI_ASSOC ) )\n        {\n            echo '<br>' . $row['id'] . ' |\
    \ ' . $row['name'] .\n            ' @ ' . $row['price'];\n        }\n    }\n \
    \   else { \n        echo '<p>' . mysqli_error( $dbc ) . '</p>'; \n    }\n}\n\
    ```\n\n![image](images/3v.jpg)Now, call the function to display all the records\n\
    \n```php\nshow_records( $dbc );\n```\n\n![image](images/4v.jpg)Create and execute\
    \ another query to add rows to the table\n\n```php\n$q = 'INSERT INTO prints (\
    \ name , price ) VALUES ( \"One Center\" , 32.99 ), ( \"Yellow Red Blue\" , 36.99\
    \ ) ';\n$r = mysqli_query( $dbc , $q );\n```\n\n![image](images/forget.jpg)\n\n\
    This `SELECT` query uses the `MYSQLI_ASSOC` constant to return the result set\
    \ as an associative array so the columns can be addressed by name.\n\n![image](images/5v.jpg)Call\
    \ the function to display all records again, or display an error message if the\
    \ change failed\n\n```php\nif( $r )\n{\n    show_records( $dbc );\n}\nelse\n{\n\
    \    echo '<p>' . mysqli_error( $dbc ) . '</p>';\n}\n```\n\n![image](images/6v.jpg)Finally,\
    \ close the MySQL Server database connection\n\n```php\nmysqli_close ( $dbc );\n\
    ```\n\n![image](images/7v.jpg)Save the PHP script in your web server’s `/htdocs`\
    \ directory as `insert.php`, then open it via HTTP to see the change to the database\
    \ table get applied\n\n![image](images/pg127_1.jpg)\n\n![image](images/snake.jpg)\n\
    \nRemember that the `SELECT` query returns a result set upon success, whereas\
    \ the `INSERT` query simply returns a `TRUE` value upon success.\n\n![image](images/hot.jpg)\n\
    \nYou can create the original “prints” table from the MySQL Command Line Client\
    \ by following the steps [here on page 99](#chapter06.html#sec99).\n\n### Counting\
    \ records\n\nA result set returned by the built-in PHP `mysqli_query()` function\
    \ can be examined to discover how many rows it contains using the `mysqli_num_rows()`\
    \ function. This function takes the result set as its argument, and returns the\
    \ number of rows it contains, like this:\n\n```php\n$num = mysqli_num_rows( $r\
    \ );\n```\n\nUsefully, the returned row count value can be tested before executing\
    \ the while loop that returns records to ensure the result set is not empty.\n\
    \n![image](images/pg128_1.jpg)\n\ncount.php\n\n![image](images/1v.jpg)Create a\
    \ PHP script that begins by incorporating the standard script to establish a connection\
    \ to a database on the MySQL Server\n\n```php\n<?php\nrequire ( '../connect_db.php'\
    \ );\n```\n\n![image](images/2v.jpg)Next, add a function to display all records\
    \ in an existing table, or display an error message\n\n```php\nfunction show_records(\
    \ $dbc )\n{\n    $q = 'SELECT * FROM prints';\n    $r = mysqli_query( $dbc , $q\
    \ );\n    $num = mysqli_num_rows( $r );\n    if ( $num > 0 )\n    {\n        echo\
    \ '<h1>Records in prints table</h1>';\n        while ( $row = mysqli_fetch_array(\
    \ $r , MYSQLI_ASSOC ) )\n        {\n            echo '<br>' . $row['id'] . ' |\
    \ ' . $row['name'] .\n            ' @ ' . $row['price'];\n        }\n    }\n \
    \   else { \n        echo '<p>' . mysqli_error( $dbc ) . '</p>'; \n    }\n}\n\
    ```\n\n![image](images/3v.jpg)Now, call the function to display all the records\n\
    \n```php\nshow_records( $dbc );\n```\n\n![image](images/4v.jpg)Create and execute\
    \ another query to add rows to the table\n\n```php\n$q = 'INSERT INTO prints (\
    \ name , price ) VALUES ( \"One Center\" , 32.99 ), ( \"Yellow Red Blue\" , 36.99\
    \ ) ';\n$r = mysqli_query( $dbc , $q );\n```\n\n![image](images/5v.jpg)You can\
    \ also use the `mysqli_num_rows()` function to paginate the results.\n\n### Updating\
    \ records\n\nThe `mysqli_affected()` function returns an integer that is the number\
    \ of rows affected by an `INSERT`, `UPDATE`, or `DELETE` query. Unlike `mysqli_num_rows()`\
    \ function, which takes the result set as its argument, the `mysqli_affected()`\
    \ function takes the database connection as its argument:\n\n```php\n$num_affected\
    \ = mysqli_affected( $dbc );\n```\n\nupdate.php\n\n![image](images/1v.jpg)Create\
    \ a PHP script that begins by incorporating the standard script to establish a\
    \ connection to a database on the MySQL Server\n\n```php\n<?php\nrequire ( '../connect_db.php'\
    \ );\n```\n\n![image](images/2v.jpg)Next, add a function to display all records\
    \ in an existing table, or display an error\n\n```php\nfunction show_records(\
    \ $dbc )\n{\n    $q = 'SELECT * FROM prints';\n    $r = mysqli_query( $dbc , $q\
    \ );\n    $num = mysqli_num_rows( $r );\n    if ( $num > 0 )\n    {\n        echo\
    \ '<h1>Records in prints table</h1>';\n        while ( $row = mysqli_fetch_array(\
    \ $r , MYSQLI_ASSOC ) )\n        {\n            echo '<br>' . $row['id'] . ' |\
    \ ' . $row['name'] .\n            ' @ ' . $row['price'];\n        }\n    }\n \
    \   else { \n        echo '<p>' . mysqli_error( $dbc ) . '</p>'; \n    }\n}\n\
    ```\n\n![image](images/3v.jpg)Now, call the function to display all the records\n\
    \n```php\nshow_records( $dbc );\n```\n\n![image](images/4v.jpg)Create and execute\
    \ another query to update (two) records in the table that have a specified value\n\
    \n```php\n$q = 'UPDATE watches SET style = “Gents” WHERE style = “Ladies” ';\n\
    $r = mysqli_query( $dbc , $q );\n```\n\n![image](images/5v.jpg)Call the function\
    \ to display all records again if the expected number of records have been updated\n\
    \n```php\nif( mysqli_affected( $dbc ) == 2 )\n{\n    echo '<hr>' . mysqli_affected(\
    \ $dbc ) . ' Records Updated...';\n    show_records( $dbc );\n}\n```\n\n![image](images/6v.jpg)Finally,\
    \ close the MySQL Server database connection\n\n```php\nmysqli_close ( $dbc );\n\
    ```\n\n![image](images/7v.jpg)Save the PHP script in your web server’s `/htdocs`\
    \ directory as `update.php`, then open it via HTTP to see the change to the database\
    \ table and the number of affected rows\n"
  raw: '![image](images/hot.jpg)


    The results shown here list the tables created in the previous two chapters from
    the MySQL Command Line Client.


    **Applying changes**


    Changes can be applied to an existing MySQL database table by making SQL queries
    of INSERT, UPDATE, DELETE or ALTER. When these are made from a PHP script by the
    mysqli\_query() function, it returns a TRUE value when the query succeeds. This
    condition can be tested to perform an appropriate action. For example, to display
    all records in the table after adding new rows upon success, or to display an
    error message upon failure.


    ![image](images/pg126_1.jpg)


    insert.php


    ![image](images/1v.jpg)Create a PHP script that begins by incorporating the standard
    script to establish a connection to a database on the MySQL Server


    **<?php**


    require ( ‘ ../connect\_db.php ‘ ) ;


    ![image](images/2v.jpg)Next, add a function to display all records in an existing
    table, or display an error message


    function show\_records( $dbc )


    **{**


    $q \= ‘SELECT \* FROM prints’ ;


    $r \= mysqli\_query( $dbc , $q ) ;


    if ( $r )


    **{**


    echo ‘<h1>Records in prints table</h1> ‘ ;


    while ( $row \= mysqli\_fetch\_array( $r , MYSQLI\_ASSOC ) )


    **{**


    echo ‘<br>’ . $row\[‘id’\] . ‘ | ‘ . $row\[ ‘name’ \] .


    ‘ @ ‘ . $row\[ ‘price’ \] ;


    **}**


    **}**


    else { echo ‘<p>’ . mysqli\_error( $dbc ) . ‘</p>’ ; }


    **}**


    ![image](images/3v.jpg)Now, call the function to display all the records


    show\_records( $dbc ) ;


    ![image](images/4v.jpg)Create and execute another query to add rows to the table


    $q \= ‘INSERT INTO prints ( name , price )


    VALUES


    ( “One Center” , 32.99 ) , ( “Yellow Red Blue” , 36.99 ) ‘ ;


    $r \= mysqli\_query( $dbc , $q ) ;


    ![image](images/forget.jpg)


    This **SELECT** query uses the **MYSQLI\_ ASSOC** constant to return the result
    set as an associative array so the columns can be addressed by name.


    ![image](images/5v.jpg)Call the function to display all records again, or display
    an error message if the change failed


    if( $r )


    **{**


    show\_records( $dbc ) ;


    **}**


    **else**


    **{**


    echo ‘<p>’ . mysqli\_error( $dbc ) . ‘</p>’ ;


    **}**


    ![image](images/6v.jpg)Finally, close the MySQL Server database connection


    mysqli\_close ( $dbc ) ;


    ![image](images/7v.jpg)Save the PHP script in your web server’s /htdocs directory
    as insert.php, then open it via HTTP to see the change to the database table get
    applied


    ![image](images/pg127_1.jpg)


    ![image](images/snake.jpg)


    Remember that the **SELECT** query returns a result set upon success, whereas
    the **INSERT** query simply returns a **TRUE** value upon success.


    ![image](images/hot.jpg)


    You can create the original “prints” table from the MySQL Command Line Client
    by following the steps [here on page 99](#chapter06.html#sec99).


    **Counting records**


    A result set returned by the built-in PHP mysqli\_query() function can be examined
    to discover how many rows it contains using the mysqli\_num\_rows() function.
    This function takes the result set as its argument, and returns the number of
    rows it contains, like this:


    **$num = mysqli\_num\_rows( $r ) ;**


    Usefully, the returned row count value can be tested before executing the while
    loop that returns records to ensure the result set is not empty.


    ![image](images/pg128_1.jpg)


    count.php


    ![image](images/1v.jpg)Create a PHP script that begins by incorporating the standard
    script to establish a connection to a database on the MySQL Server


    **<?php**


    require ( ‘ ../connect\_db.php ‘ ) ;


    ![image](images/2v.jpg)Next, add a function to display all records in an existing
    table plus the total record count, or an error message


    **function show\_records( $dbc )**


    **{**


    $q \= ‘SELECT \* FROM towels’ ;


    $r \= mysqli\_query( $dbc , $q ) ;


    $num \= mysqli\_num\_rows( $r ) ;


    if ( $num \> 0 )


    **{**


    echo ‘<h1>Records in towels table</h1> ‘ ;


    while ( $row \= mysqli\_fetch\_array( $r , MYSQLI\_ASSOC ) )


    **{**


    echo ‘<br>’ . $row\[‘name’\] . ‘ | ‘ . $row\[ ‘color’ \] .


    ‘ @ ‘ . $row\[ ‘price’ \] ;


    **}**


    echo “<br>$num Records” ;


    **}**


    else { echo ‘<p>’ . mysqli\_error( $dbc ) . ‘</p>’ ; }


    **}**


    ![image](images/3v.jpg)Now, call the function to display all the records


    show\_records( $dbc ) ;


    ![image](images/hot.jpg)


    You can also use the **mysqli\_num\_rows()** function to paginate results – by
    displaying a particular number of rows per page.


    ![image](images/4v.jpg)Create and execute another query to add a row to the table


    $q \= ‘INSERT INTO towels ( name , color , price )


    VALUES ( “Sunset” , “Orange” , 9.99 ) ‘ ;


    $r \= mysqli\_query( $dbc , $q ) ;


    ![image](images/5v.jpg)Call the function to display all records again, or display
    an error message if the change failed


    if( $r ) { show\_records( $dbc ) ; }


    else { echo ‘<p>’ . mysqli\_error( $dbc ) . ‘</p>’ ; }


    ![image](images/6v.jpg)Finally, close the MySQL Server database connection


    mysqli\_close ( $dbc ) ;


    ![image](images/7v.jpg)Save the PHP script in your web server’s /htdocs directory
    as count.php, then open it via HTTP to see the change to the database table get
    applied and the row count change


    ![image](images/pg129_1.jpg)


    ![image](images/hot.jpg)


    You can create the original “towels” table from the MySQL Command Line Client
    by following the steps [here on page 100](#chapter06.html#sec49).


    **Updating records**


    The built-in PHP mysqli\_affected\_rows() function returns an integer that is
    the number of rows affected by an INSERT, UPDATE, or DELETE query. Unlike the
    mysqli\_num\_rows() function, which takes the result set as its argument, the
    mysqli\_affected\_rows() function takes the database connection object as its
    argument:


    **$num\_affected = mysqli\_affected\_rows( $dbc ) ;**


    Usefully, the returned affected row value can be tested to ensure that an UPDATE
    query succeeded on an expected number of records.


    ![image](images/pg130_1.jpg)


    update.php


    ![image](images/1v.jpg)Create a PHP script that begins by incorporating the standard
    script to establish a connection to a database on the MySQL Server


    **<?php**


    require ( ‘ ../connect\_db.php ‘ ) ;


    ![image](images/2v.jpg)Next, add a function to display all records in an existing
    table, or display an error message


    function show\_records( $dbc )


    **{**


    $q \= ‘SELECT \* FROM watches’ ;


    $r \= mysqli\_query( $dbc , $q ) ;


    $num \= mysqli\_num\_rows( $r ) ;


    if ( $num \> 0 )


    **{**


    echo ‘<h1>Records in watches table</h1> ‘ ;


    while ( $row \= mysqli\_fetch\_array( $r , MYSQLI\_ASSOC ) )


    **{**


    echo ‘<br>’ . $row\[‘model’\] . ‘ | ‘ . $row\[ ‘style’ \] .


    ‘ @ ‘ . $row\[ ‘price’ \] ;


    **}**


    **}**


    else { echo ‘<p>’ . mysqli\_error( $dbc ) . ‘</p>’ ; }


    **}**


    ![image](images/3v.jpg)Now, call the function to display all the records


    show\_records( $dbc ) ;


    ![image](images/4v.jpg)Create and execute another query to update (two) records
    in the table that have a specified value


    $q \= ‘UPDATE watches


    SET style = “Gents” WHERE style = “Ladies” ‘ ;


    $r \= mysqli\_query( $dbc , $q ) ;


    ![image](images/forget.jpg)


    Where an **INSERT**, **UPDATE**, or **DELETE** query makes no changes, the affected
    row count will be zero.


    ![image](images/5v.jpg)Call the function to display all records again if the expected
    number of records have been updated


    if( mysqli\_affected\_rows( $dbc ) == 2 )


    **{**


    echo ‘<hr>’ . mysqli\_affected\_rows( $dbc ) .


    ‘ Records Updated...’ ;


    show\_records( $dbc ) ;


    **}**


    ![image](images/6v.jpg)Finally, close the MySQL Server database connection


    mysqli\_close ( $dbc ) ;


    ![image](images/7v.jpg)Save the PHP script in your web server’s /htdocs directory
    as update.php, then open it via HTTP to see the change to the database table and
    the number of affected rows


    ![image](images/pg131_1.jpg)


    ![image](images/hot.jpg)


    You can create the original “watches” table from the MySQL Command Line Client
    by following the steps [here on page 112](#chapter06.html#sec55).


    **Validating results**'
