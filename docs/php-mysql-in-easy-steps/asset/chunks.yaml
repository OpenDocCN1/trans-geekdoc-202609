    \ insert a statement to display both current variable values substituted in a\
    \ mixed string\n\n```php\necho “<p><q>$phrase</q><cite>$author</cite></p>” ;\n\
    ```\n\n![image](images/7r.jpg)Save the document in your web browser’s `/htdocs`\
