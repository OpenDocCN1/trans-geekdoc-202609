    安装 PHP 后，Web 服务器尚无法执行 PHP 脚本，除非对其进行配置以识别这些脚本并找到 PHP 解释器引擎——所有说明如第 14-15 页 所示。


    ## 为 PHP 配置 Abyss


    必须配置 Abyss Web 服务器以识别 PHP 脚本，并在遇到它们时使用 PHP 解释器。这可以通过 Abyss 服务器控制台实现：将 `.php` 文件扩展名关联为
    PHP 脚本，并指定系统上 PHP 引擎的位置来解释它们。


    ![image](img/pg14_1.jpg)


    关于 Abyss Web 服务器配置的更多指导，可以在在线访问：**[aprelium.com/abyssws/start.html](http://www.aprelium.com/abyssws/start.html)**。


    ![image](img/1b.jpg)在浏览器地址栏中输入 `http://localhost:9999`（或点击系统托盘中的 Abyss 图标）启动 Abyss
    服务器控制台，然后点击 `Configure` 按钮打开配置页面。


    ![image](img/pg14_2.jpg)


    ![image](img/2b.jpg)接下来，点击 ![image](img/pg14_3.jpg)Scripting Parameters 图标打开 Scripting
    Parameters 页面进行编辑。


    ![image](img/3b.jpg)确保勾选 `Enable Scripts Execution` 复选框，然后点击 Interpreters 表格中的
    `Add` 按钮打开 Interpreters-Add 页面。


    ![image](img/4b.jpg)现在，将 `Interface` 设置为“FastCGI”，将 `Interpreter` 设置为系统上 PHP 解释器
    (`php-cgi.exe`) 的路径，并 `Add` 文件扩展名 `.php` 然后点击 `OK`。


    ![image](img/pg14_4.jpg)


    ![image](img/hot.jpg)


    `localhost` 域名是 IP 地址 `127.0.0.1` 的别名——因此 Abyss Web 服务器控制台也可以通过 `http://127.0.0.1:9999`
    访问。


    ![image](img/5b.jpg)在控制窗口中点击 `OK`，然后点击 `Restart` 按钮将更改应用于 Abyss 配置。


    ![image](img/pg15_1.jpg)


    现在 Abyss Web 服务器应已在您的系统中运行，并正确配置为识别具有 `.php` 文件扩展名的文档应由 PHP 引擎解释。现在可以通过创建一个简单的
    PHP 脚本由 Abyss 为您的 浏览器提供服务来测试配置。


    ![image](img/pg15_2.jpg)


    `phpinfo.php`


    ![image](img/6b.jpg)打开一个纯文本编辑器并准确输入以下脚本：


    ```php

    <?php phpinfo() ?>

    ```


    ![image](img/7b.jpg)将脚本保存为 `phpinfo.php`，位于 Abyss 文档路径目录中，通常位于 `C:\Abyss Web Server\htdocs`。


    ![image](img/8b.jpg)在浏览器地址栏中准确输入位置 `http://localhost/phpinfo.php`，查看 Abyss 提供的包含您的
    PHP 版本信息的网页。


    ![image](img/pg15_3.jpg)


    ![image](img/forget.jpg)


    PHP 脚本对大小写敏感，因此您必须仅使用小写字母复制列出的脚本。


    ![image](img/snake.jpg)


    文档只有在 Web 服务器使用 HTTP 协议提供服务时才能被 PHP 引擎解释。您不能直接在浏览器中打开 PHP 文件。请始终使用位置 `http://localhost/`。


    ## 嵌入 PHP 脚本


    PHP 脚本可以嵌入 HTML 文档中——这意味着 PHP 和 HTML 代码可以和谐地存在于同一个文件中。所有嵌入的 PHP 代码必须包含在 `<?php`
    和 `?>` 标签内，以便 PHP 引擎能够识别并进行解释。通常，PHP 代码会将内容写入 HTML 文档的 body 部分，然后发送到 浏览器。


    ![image](img/pg16_1.jpg)


    `hello.php`


    ![image](img/1b.jpg)启动纯文本编辑器并创建一个带有空 body 部分的有效基础 HTML5 文档：


    ```html

    <!DOCTYPE HTML>

    <html lang="en">

    <head><meta charset="UTF-8">

    <title>Getting Started With PHP</title>

    </head>

    <body>

    </body>

    </html>

    ```


    ```php

    <?php

    echo "Hello World!";

    ?>

    ```

