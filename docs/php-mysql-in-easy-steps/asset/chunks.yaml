  trans: "\n\n![image](img/2g.jpg)现在，创建一个 SQL 命令来填充该表：\n\n```sql\nINSERT INTO shop\n\
    ( item_name , item_desc , item_img , item_price )\nVALUES\n( “Cow”, “A friendly\
    \ field buddy.” “images/cow.png”, 19.99 ),\n( “Dog”, “A friendly lap buddy.” “images/dog.png”,\
    \ 14.99 ),\n( “Goat”, “A friendly mountain buddy.” “images/goat.png”, 16.99 ),\n\
    ( “Leopard”, “A friendly spotted buddy.” “images/leopard.png”, 17.99 ),\n( “Rhino”,\
    \ “A friendly jungle buddy.” “images/rhino.png”, 29.99 );\n```\n\n![image](img/3g.jpg)将文件保存到\
    \ `C:\\SQL` 文件夹并命名为 `create_shop.sql`，然后以 root 用户身份启动 MySQL 命令行客户端，并执行使用已建立数据库的命令\n\
    \n```sql\nUSE site_db ;\n```\n\n![image](img/4g.jpg)现在，通过指明系统中 SQL 文件的源路径来执行 SQL\
    \ 命令\n\n```sql\nSOURCE C:\\SQL\\create_shop.sql\n```\n\n![image](img/5g.jpg)最后，执行命令以确认表格式并查看其中包含的所有项目\n\
    \n```sql\nEXPLAIN shop ; SELECT * FROM shop ;\n```\n\n![image](img/pg171_1.jpg)\n\
    \n![image](img/hot.jpg)\n\n注意如何通过指定逗号分隔列表作为其数据组，在单个命令中向表中填充多个项目。\n\n## 创建订单数据库\n\
    \n用户在商店页面上为订单选择的项目，存储在两个 MySQL 数据库表中效果最好——允许用户如果他们愿意，可以在多个订单中选择多个项目。\n\n第一张表仅包含订单\
    \ ID、用户 ID、总价和下单日期的摘要详情：\n\n| 列名: | 内容类型: | 示例: |\n| --- | --- | --- |\n| order_id\
    \ | 数字 | 8 |\n| user_id | 数字 | 123 |\n| total | 小数 | 20.00 |\n| order_date | 日期/时间\
    \ | 2018-05-14 12:30:00 |\n\n第二张表包含按内容 ID、订单 ID、项目 ID、数量和价格的实际项目的内容详情：\n\n| 列名:\
    \ | 内容类型: | 示例: |\n| --- | --- | --- |\n| content_id | 数字 | 100 |\n| order_id\
    \ | 数字 | 8 |\n| item_id | 数字 | 1 |\n| quantity | 数字 | 2 |\n| price | 小数 | 10.00\
    \ |\n\n`order_id`、`content_id` 和 `order_date` 列由 MySQL 生成。`user_id` 由“users”表为当前登录用户提供，`item_id`\
    \ 由“shop”表为所选项目提供。提交购物车提供价格和数量，并据此计算总额。\n\n![image](img/hot.jpg)\n\n注意此购物车应用程序使用了四张表（users,\
    \ shop, orders, order_contents），完美地展示了 MySQL 数据库的“关系型”属性。\n\n![image](img/pg173_1.jpg)\n\
    \ncreate_orders.sql\n\n![image](img/1g.jpg)启动纯文本编辑器，创建一个 SQL 命令来描述右侧显示的第一个表的需求：\n\
    \n```sql\nCREATE TABLE IF NOT EXISTS orders (\norder_id INT UNSIGNED NOT NULL\
    \ AUTO_INCREMENT ,\nuser_id INT UNSIGNED NOT NULL ,\ntotal DECIMAL(8,2) NOT NULL\
    \ ,\norder_date DATETIME NOT NULL ,\nPRIMARY KEY ( order_id ) ) ;\n```\n\n![image](img/pg173_2.jpg)\n\
    \ncreate_order_contents.sql\n\n![image](img/2g.jpg)将文件保存到 `C:\\SQL` 文件夹并命名为 `create_orders.sql`，然后创建一个\
    \ SQL 命令来描述第二张表的需求：\n\n```sql\nCREATE TABLE IF NOT EXISTS order_contents (\ncontent_id\
    \ INT UNSIGNED NOT NULL AUTO_INCREMENT ,\norder_id INT UNSIGNED NOT NULL,\nitem_id\
    \ INT UNSIGNED NOT NULL,\nquantity INT UNSIGNED NOT NULL DEFAULT 1,\nprice DECIMAL(4,2)\
    \ NOT NULL,\nPRIMARY KEY ( content_id ) ) ;\n```\n\n![image](img/3g.jpg)将文件保存为\
    \ `create_order_contents.sql`，然后以 root 用户身份启动 MySQL 命令行客户端，并执行使用已建立数据库的命令\n\n\
    ```sql\nUSE site_db ;\n```\n\n![image](img/4g.jpg)现在，通过指明 SQL 文件的源路径来执行 SQL 命令并确认表格式：\n\
    \n```sql\nSOURCE C:\\SQL\\create_orders.sql\nSOURCE C:\\SQL\\create_order_contents.sql\n\
    EXPLAIN orders ; EXPLAIN order_contents ;\n```\n\n![image](img/pg173_3.jpg)\n\n\
    ## 提供商店页面\n\n创建了第 170-171 页 描述的“shop”数据库后，你现在可以创建一个 PHP 脚本来显示所有可以选择添加到购物车的项目。每个项目都将在商店页面的表格单元格中显示，包含项目详情、关联图像，以及一个将该项目添加到购物车的超链接。\n\
    \n![image](img/pg74_1)\n\nshop.php\n\n![image](img/1g.jpg)启动纯文本编辑器并开始编写 PHP 脚本，如果用户未登录则允许访问会话数据：\n\
    \n```php\n<?php\nsession_start();\nif ( !isset($_SESSION['user_id']) ) {\nheader(\"\
    Location: login.php\");\nexit;\n}\n```\n\n![image](img/2g.jpg)现在，添加语句设置页面标题并包含页头：\n\
    \n```php\n$page_title = 'Shop';\ninclude ('includes/header.html');\n```\n\n![image](img/3g.jpg)添加语句打开数据库连接：\n\
    \n```php\nrequire ('connect_db.php');\n```\n\n![image](img/4g.jpg)现在，添加语句从数据库检索所有项目：\n\
    \n```php\n$q = \"SELECT * FROM shop\";\n$r = mysqli_query($dbc, $q);\nif ( mysqli_num_rows($r)\
    \ > 0 ) {\n    echo '<table><tr>';\n    while ( $row = mysqli_fetch_array($r,\
    \ MYSQLI_ASSOC) ) {\n        echo '<td><strong>' . $row['item_name'] . '</strong><br>'\
    \ . $row['item_desc'];\n        echo '<br><img src=\"' . $row['item_img'] . '\"\
    ><br>' . $row['item_price'];\n        echo '<br><a href=\"added.php?id=' . $row['item_id']\
    \ . '\">加入购物车</a></td></tr>';\n    }\n    echo '</tbody></table>';\n} else {\n\
    \    echo '<p>该商店目前没有项目。</p>';\n}\n```\n\n![image](img/5g.jpg)添加语句关闭连接并创建指向网站其他页面的超链接，包括“查看购物车”页面：\n\
    \n```php\necho '<p><a href=\"cart.php\">查看购物车</a> |\n<a href=\"forum.php\">论坛</a>\
    \ |\n<a href=\"home.php\">首页</a> |\n<a href=\"goodbye.php\">退出</a></p>';\n```\n\
    \n![image](img/6g.jpg)添加最后的语句包含页脚：\n\n```php\ninclude ('includes/footer.html');\n\
    ```\n\n![image](img/7g.jpg)将此脚本保存到 浏览器的 htdocs 目录并命名为 shop.php，然后登录并访问商店页面\n\n\
    ## 确认购物车添加\n\n在提供了商店页面后，你现在可以创建一个 PHP 脚本，将用户选择的项目存储在会话变量数组中。这将使用“加入购物车”超链接中附加的项目\
