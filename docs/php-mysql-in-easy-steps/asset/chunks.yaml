    ## 总结


    通过 `INSERT INTO` 查询向表插入数据。`INSERT INTO` 查询中的 `VALUES` 关键字指定逗号分隔的值列表。文本值必须用引号包围。通过
    `SELECT * FROM` 查询从表中检索所有数据。使用 `UPDATE` 查询更改列中的字段。在 `UPDATE` 查询中添加 `WHERE` 关键字以识别要更改的特定行。`SET`
    关键字用于 `UPDATE` 查询以更改一个或多个字段。使用 `DELETE` 查询删除表中的所有行。在 `DELETE` 查询中添加 `WHERE` 关键字以识别要删除的特定行。所有表应指定一个包含
    `PRIMARY KEY` 的列。通过在 `SELECT` 查询中指定逗号分隔的列列表检索多列数据。通过在 `SELECT` 查询中添加 `WHERE` 关键字检索特定行。`WHERE`
    子句可以指定跟在 `IN` 关键字逗号分隔的可选比较值列表。在 `IN` 关键字之前添加 `NOT` 关键字可以返回不匹配列表中任何值的行的数据。`ORDER
    BY` 子句可以指定排序列，并使用 `ASC` 和 `DESC` 关键字指定如何排序检索到的数据。MySQL 拥有与 PHP 类似的比较运算符。内置的 MySQL
    `NOW()` 函数提供时间戳，内置的 `SHA2()` 函数安全地存储密码。


