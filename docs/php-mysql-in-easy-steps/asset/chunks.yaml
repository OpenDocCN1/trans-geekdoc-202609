    \n![image](img/forget.jpg)同名的变量在不同作用域内声明时不会发生冲突——它们之间相互不可见。\n\n### 传递参数\n\n数据可以作为“参数”（也称为“形参”）传递给自定义函数，这与你向某些内置\
    \ PHP 函数传递参数的方式相同。例如，`sort()` 函数将要排序的数组作为其参数传入。\n\n可以创建带有任意数量参数的函数，但当调用函数时，必须为每个参数提供数据以避免错误。\n\
    \n创建一个包含参数的函数，方法是在函数名后的括号内包含一个用逗号分隔的参数变量列表，如下所示：\n\n```php\nfunction function_name\
    \ ($arg_1 , $arg_2 , $arg_3)\n{\n    statements-to-be-executed\n}\n```\n\n参数名称必须遵循与其它\
    \ PHP 变量相同的命名规范，并且理想情况下应该具有意义，以表示它们将传递的数据性质。参数数据必须按照正确的顺序在调用时传递，然后可以在该函数内部的语句中使用：\n\
    \n```php\nfunction print_name($first_name , $last_name)\n{\n    echo “Name is\
    \ $first_name $last_name “ ;\n}\n\nprint_name (‘Mickey’ , ‘Mouse’ ; # Name is\
    \ Mickey Mouse\n```\n\n函数调用可以传递字面量（如上述示例中的字符串），也可以传递普通变量——变量反过来会将它们的值提供给函数。例如：\n\
    \n```php\n$forename = ‘Donald’ ;\n$surname = ‘Duck’ ;\nprint_name($forename ,\
    \ $surname) ; # Name is Donald Duck\n```\n\n参数变量具有局部作用域，因此仅在创建它们的函数内部是可的。这意味着在许多函数中可以使用相同的参数名称，而不会与彼此或普通变量名发生冲突。\n\
    \n![image](img/forget.jpg)\n\n参数必须在函数声明中指定，并由调用者以逗号分隔的列表传递。\n\n![image](img/pg59_1.jpg)\n\
    \nargument.php\n\n![image](img/1g.jpg)使用语句创建并初始化全局变量开始 PHP 脚本\n\n```php\n$number\
    \ = 5 ;\n```\n\n![image](img/2g.jpg)接下来，添加一个带有一个参数的函数，在计算中使用它的值并输出其结果\n\n```php\n\
    function square($number)\n{\n    $result = $number * $number ;\n    echo “$number\
    \ Squared = $result<br>” ;\n}\n```\n\n![image](img/3g.jpg)现在，添加另一个带有一个参数的函数，在计算中使用它的值并输出其结果\n\
    \n```php\nfunction cube($number)\n{\n    $result = $number * $number * $number\
    \ ;\n    echo “$number Cubed = $result<br> ; ;\n}\n```\n\n![image](img/4g.jpg)最后，添加语句来调用函数并并传递字面量参数和变量参数\n\
    \n```php\nsquare(3) ;\ncube(4) ;\nsquare($number) ;\ncube($number) ;\n```\n\n\
    ![image](img/5g.jpg)将文档保存在网络浏览器的 /htdocs 目录中并命名为 argument.php，然后通过 HTTP 打开该页面以查看结果显示。\n\
    \n![image](img/pg59_2.jpg)\n\n![image](img/hot.jpg)你可以对参数和普通变量使用相同的名称。\n\n###\
    \ 返回值\n\n函数在调用时可以传递值，也可以通过 `return` 关键字返回值。通常由调用者决定返回值的函数可以使用 `return` 语句：\n\n\
    | 参数 | 描述 | 示例： |\n| --- | --- | --- |\n| Y | 数字 | 18 |\n| y | 数字 | 14 |\n| n\
    \ | 数字 | 5 |\n| m | 数字 | 05 |\n| F | 星期名称 | 二月 |\n| M | 星期名称 | 二月 |\n| d | 星期数字\
    \ | 04 |\n| S | 星期数字 | 24 |\n| l | 星期名称 | 周一 |\n| D | 星期数字 | 周一 |\n| H | 小时 |\
    \ 14 |\n| i | 分钟 | 45 |\n| s | 秒 | 30 |\n\n自定义函数在调用时也可以返回值，只需在语句中使用 `return` 关键字。这些是\
    \ `date()` 的某些用法，通过 `return` 语句来实现。\n\n`date()` 函数通常可以通过 `switch` 语句来执行，以返回特定的值。\n\
    \n![image](img/61.jpg)return.php\n\n"
- fmt: "\n# Handling submissions\n# Making sticky forms\n# Surrounding forms\n# Appending\
    \ link data\n# Moving location\n# Summary\n\n## Performing actions\n\nProcessing\
    \ data submitted from an HTML form on a web page is perhaps the most fundamental\
    \ task performed by a PHP script.\n\nThe HTML `<form>` tag’s `action` attribute\
    \ is used to nominate the PHP script that will process (“handle”) the form data.\
    \ Additionally, the `<form>` tag’s `method` attribute is used to specify how the\
    \ data is sent to the script – typically by the `POST` method. So the HTML form\
    \ tag and attributes might look like this:\n\n```html\n<form action=\"script.php\"\
    \ method=\"POST\">\n```\n\nPHP provides a special “superglobal” `$_POST` array\
    \ variable in which it stores form data submitted by the `POST` method. It creates\
    \ an array element of the same name as each submitted form element name, storing\
    \ the value they contain. For example, with this form element:\n\n```html\n<input\
    \ type=\"text\" name=\"email\">\n```\n\nOn submission of the form, PHP will create\
    \ an array element named `$_POST['email']` containing the value entered into that\
    \ form input by the user.\n\nFor easy recognition, PHP variables of the same names\
    \ as the form elements can be assigned the values stored in their corresponding\
    \ `$_POST` array elements. The values can then be displayed in a response page\
    \ created by the action handler script.\n\n![image](images/1p.jpg)Create an HTML\
    \ document containing a form with three text input fields for data submission\n\
    \n```html\n<form action=\"action_handler.php\" method=\"POST\">\n<dl>\n  <dt>Name:</dt>\n\
    \  <dd><input type=\"text\" name=\"name\"></dd>\n  <dt>Email Address:</dt>\n \
    \ <dd><input type=\"text\" name=\"mail\"></dd>\n  <dt>Comments:</dt>\n  <dd><textarea\
    \ rows=\"5\" cols=\"20\" name=\"comment\"></textarea></dd>\n</dl>\n<p><input type=\"\
    submit\"></p>\n</form>\n```\n\n![image](images/pg70_1.jpg)\n\naction.php\n\n![image](images/2p.jpg)Now,\
    \ save the document in your web browser’s `/htdocs` directory as `action.php`\n\
    \n![image](images/snake.jpg)\n\nPHP is case-sensitive so the capitalization must\
    \ be precisely as described – `$_POST['EMail']` or `$_Post['email']` are incorrect,\
    \ for example.\n\n![image](images/3p.jpg)Next, create an HTML document containing\
    \ a script to assign form values to like-named PHP variables for output\n\n```php\n\
    <?php\n$name = $_POST['name'];\n$mail = $_POST['mail'];\n$comment = $_POST['comment'];\n\
    echo \"<p>Thanks for this comment $name ...</p>\";\necho \"<p><i>$comment</p></p>\"\
    ;\necho \"<p>We will reply to $mail</p>\";\n?>\n```\n\n![image](images/pg70_1.jpg)action_handler.php\n\
    \n![image](images/4p.jpg)Save the document in your web browser’s `/htdocs` directory\
    \ as `action_handler.php`, then open `action.php` via HTTP and submit some data\
    \ to see it displayed in the response page produced by the PHP script\n\n![image](images/pg65_2.jpg)![image](images/pg65_3.jpg)![image](images/hot.jpg)\n\
    \nForm submission methods may be either `GET` or `POST`. The `GET` method appends\
    \ `name=value` pairs to the URL but is mostly used to request information – such\
    \ as retrieving a database record. The `POST` method can submit more data, is\
    \ more secure as the data is not appended to the URL, and is mostly used when\
    \ an action to be performed – such as updating a database record. The `POST` method\
    \ is therefore preferred for most examples.\n\n## Checking values\n\nPHP can easily\
    \ ensure that the user has entered data into form fields using the built-in `isset()`\
    \ function. This function takes the name of a variable as its argument and returns\
    \ `TRUE` only if that variable is not `NULL` – thus ensuring that the variable\
    \ has “set” with some value. Empty form fields will be `NULL` unless the user\
    \ has entered a value.\n\nConditional tests can be made with the `isset()` function\
    \ to indicate where form fields have been left empty, or to provide a response\
    \ page where the fields are completed.\n\n![image](images/1p.jpg)Create an HTML\
    \ document containing a form with three radio buttons providing a single field\
    \ for data submission\n\n```html\n<form action=\"isset_handler.php\" method=\"\
    POST\">\n<fieldset>\n  <legend>What of language is PHP?</legend>\n  <input type=\"\
    radio\" name=\"definition\" value=\"Scripting\">\n  <input type=\"radio\" name=\"\
    definition\" value=\"Markup\">\n  <input type=\"radio\" name=\"definition\" value=\"\
    Programming\">\n</fieldset>\n<p><input type=\"submit\"></p>\n</form>\n```\n\n\
    ![image](images/pg70_1.jpg)isset.php\n\n![image](images/2p.jpg)Now, save the document\
    \ in your web browser’s `/htdocs` directory as `isset.php`\n\n![image](images/pg70_1.jpg)isset_handler.php\n\
    \n![image](images/3p.jpg)Next, create an HTML document containing a PHP script\
    \ to initialize a variable with a submitted value – or with `NULL` if no value\
    \ has been submitted\n\n```php\n<?php\nif (isset($_POST['definition'])) {\n  \
    \  $definition = $_POST['definition'];\n} else {\n    $definition = NULL;\n}\n\
    # Response statements to be inserted here.\n?>\n```\n\n![image](images/4p.jpg)Finally,\
    \ insert statements to output an appropriate response according to the value of\
    \ the variable\n\n```php\nif ($definition != NULL) {\n    if ($definition != 'Scripting')\
    \ {\n        echo \"$definition is Incorrect\";\n    } else {\n        echo \"\
    $definition is Correct\";\n    }\n} else {\n    echo 'You must select one answer';\n\
    }\n```\n\n![image](images/5p.jpg)Save the document in your web browser’s `/htdocs`\
    \ directory as `isset_handler.php`, then open `isset.php` via HTTP and submit\
    \ the form to see the responses\n\n![image](images/pg67_1.jpg)![image](images/pg67_2.jpg)![image](images/pg67_3.jpg)![image](images/pg67_4.jpg)![image](images/hot.jpg)\n\
    \nIt is technically more efficient to test whether a condition is not `TRUE` than\
    \ whether it is `TRUE` – as fewer possibilities need evaluating.\n\n## Validating\
    \ form data\n\nAs users may inadvertently submit forms with empty fields, or with\
    \ data in the wrong format, it is essential your PHP scripts ensure required fields\
    \ are completed and submitted data is valid.\n\nTo ensure the user has entered\
    \ something into a text field, PHP provides an `empty()` function that accepts\
    \ a variable argument and returns `TRUE` if its value is an empty string, zero,\
    \ `NULL` or `FALSE`.\n\nTo ensure the user has entered data in numeric format,\
    \ PHP provides an `is_numeric()` function that accepts a variable argument and\
    \ returns `TRUE` only if its value is a number.\n\nMore specific data validation\
    \ can be performed using the PHP `preg_match()` function that accepts a “regular\
    \ expression” argument and a variable argument in which to seek a pattern. Typically,\
    \ this is used to ensure an email address is in the expected format.\n\n![image](images/1p.jpg)Create\
    \ an HTML document containing a form with two text fields for data submission\n\
    \n```html\n<form action=\"valid_handler.php\" method=\"POST\">\n<fieldset>\n \
    \ <legend>Enter a quantity and email address</legend>\n  <p>Quantity : <input\
    \ type=\"text\" name=\"quantity\"></p>\n  <p>Email Address : <input type=\"text\"\
    \ name=\"email\"></p>\n</fieldset>\n<p><input type=\"submit\"></p>\n</form>\n\
    ```\n\n![image](images/pg68_1.jpg)valid.php\n\n![image](images/2p.jpg)Now, save\
    \ the document in your web browser’s `/htdocs` directory as `valid.php`\n\n![image](images/3p.jpg)Next,\
    \ create an HTML document containing a PHP script to initialize a variable with\
    \ a submitted value – or with `NULL` if no value has been submitted\n\n```php\n\
    <?php\nif (!empty($_POST['quantity'])) {\n    $quantity = $_POST['quantity'];\n\
    } else {\n    $quantity = NULL;\n    echo 'You must enter a quantity<br>';\n}\n\
    ?>\n```\n\n![image](images/pg68_2.jpg)valid_handler.php\n\n![image](images/4p.jpg)Insert\
    \ statements to ensure the format is numeric\n\n```php\nif (!is_numeric($quantity))\n\
    ```\n"
