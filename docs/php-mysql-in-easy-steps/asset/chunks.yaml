  trans: "\n在处理用户输入的脚本中，当用户输入不适当的数据时，“触发”错误是非常用的。这通过使用 PHP 的 `trigger_error()` 函数实现，该函数接受两个参数来指定错误消息和级别。由于此函数仅描述用户生成的错误，指定的错误级别必须是上表中的\
    \ `E_USER` 常量类型之一。\n\n![image](img/hot.jpg)\n\nPHP 错误处理通过其配置文件开启，也可以通过调用 `ini_set(\
    \ ‘display_errors’,1)` 手动开启。\n\n![image](img/pg137_1.jpg)\n\nerror.php\n\n![image](img/1v.jpg)创建一个包含\
    \ PHP 脚本的 HTML 文档，该脚本开头指定一个自定义的错误处理函数\n\n```php\n<?php\nset_error_handler( ‘error_handler’\
    \ ) ;\n```\n\n![image](img/2v.jpg)接下来，添加自定义错误处理函数，以便在调用时向用户显示错误详情\n\n```php\n\
    function error_handler ( $level , $message , $file , $line )\n{\n    echo “Error\
    \ [$level] : $message <br>\n(Check line $line in $file )” ;\n}\n```\n\n![image](img/3v.jpg)现在，初始化一个变量，模拟用户输入值\n\
    \n```php\n$num = 500 ;\n```\n\n![image](img/4v.jpg)最后，设置触发器调用自定义错误处理函数\n\n```php\n\
    if ( $num > 100 )\n{ \n    trigger_error( ‘Number must be less than 100’ , E_USER_ERROR\
    \ ) ; \n}\n?>\n```\n\n![image](img/5v.jpg)将 PHP 脚本保存到 Web 服务器的 `/htdocs` 目录下并命名为\
    \ `error.php`，然后通过 HTTP 打开以查看由自定义错误处理函数生成的消息\n\n![image](img/pg137_2.jpg)\n\n\
    ![image](img/hot.jpg)\n\n单独表达式错误可以通过在表达式前加上 `@` 错误控制运算符来抑制。因此，$num = @( 8 / 0\
    \ ) ;` 会抑制默认的 `Division By Zero` 错误消息。\n\n## 总结\n\n- PHP `mysqli_connect()` 函数将用户连接到指定的数据库并返回一个数据库连接对象。\n\
    - 数据库连接对象被用作与其他数据库通信的其他 PHP 函数的参数。\n- PHP `mysqli_query()` 函数将 SQL 查询发送到 MySQL\
    \ 服务器上连接的数据库。\n- 当调用 `mysqli_query()` 函数时，成功时返回一个结果集或 `TRUE` 值，失败时返回 `FALSE` 值。\n\
    - 可选，可以调用 `mysqli_close()` 来显式关闭数据库连接。\n- SQL `SELECT` 查询返回一个包含记录行的结果集，可以使用 `while`\
    \ 循环逐行读取这些行。\n- PHP `mysqli_fetch_array()` 函数将结果集的每行作为关联数组或数字数组返回。\n- 可选，调用 `mysqli_free_result()`\
    \ 可以显式释放结果集资源。\n- SQL `INSERT`、`UPDATE`、`DELETE` 或 `ALTER` 查询在成功时仅返回 `TRUE` 值。\n\
    - PHP `mysqli_num_rows()` 函数返回一个表示指定结果集中行数的整数。\n- `mysqli_affected_rows()` 函数返回一个表示受\
    \ `INSERT`、`UPDATE` 或 `DELETE` 影响的行数的整数。\n- 按类型测试数据的 PHP 函数如果数据为特定类型，则返回 `TRUE`，否则返回\
    \ `FALSE`。\n- `mysqli_real_escape_string()` 函数转义字符串中的特殊字符，`strip_tags()` 移除 HTML\
    \ 标签。\n- `set_error_handler()` 函数指定自定义错误处理程序，`trigger_error()` 可生成错误。\n\n8\n\n\
