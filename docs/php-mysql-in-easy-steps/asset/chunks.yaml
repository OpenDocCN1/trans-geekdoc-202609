  trans: "\n\n![image](img/pg181_1.jpg)\n![image](img/pg181_2.jpg)\n![image](img/hot.jpg)\n\
    \n你可以将所有数量更改为零并点击“更新”（Update）按钮查看默认的空购物车消息。\n\n## 结算订单\n\n在制作了此处第 174-181 页 描述的购物车页面后，你现在可以创建一个\
    \ PHP 脚本来处理用户选择的项目并作为一个“结账”订单。这是购物车流程的终点，它将购物车的选择存储在“order”和 `order_contents`\
    \ 数据库表中，以供供应商后续履行订单。\n\n![image](img/pg182_1.jpg)\n\n### checkout.php\n\n![image](img/1g.jpg)启动一个纯文本编辑器，并使用语句开始\
    \ PHP 脚本允许访问会话（session）数据。\n\n```php\n<?php\nsession_start();\n```\n\n![image](img/2g.jpg)现在，添加语句，如果用户尚未登录，则将浏览器重定向到登录页面。\n\
    \n```php\nif (!isset($_SESSION['user_id'])) {\n    require ('login_tools.php');\n\
    \    load();\n}\n```\n\n![image](img/3g.jpg)接下来，添加语句设置页面标题并包含页面页头。\n\n```php\n\
    $page_title = 'Checkout';\ninclude ('includes/header.html');\n```\n\n![image](img/4g.jpg)添加语句将购物车项目存储在数据库中，或提供默认消息。\n\
    \n```php\nif (isset($_GET['total']) && ($_GET['total'] > 0) && (!empty($_SESSION['cart'])))\
    \ {\n    # 在此处插入语句（步骤 5-10）。\n} else {\n    echo '<p>There are no items in your\
    \ cart.</p>';\n}\n```\n\n![image](img/5g.jpg)现在，插入一条语句来打开数据库连接。\n\n```php\nrequire\
    \ ('../connect_db.php');\n```\n\n![image](img/6g.jpg)接下来，插入语句将用户 ID、订单总值和当前日期/时间存储在“orders”数据库表中。\n\
    \n```php\n$q = \"INSERT INTO orders ( user_id , total , order_date ) VALUES (\"\
    \ . $_SESSION['user_id'] . \",\" . $_GET['total'] . \", NOW() )\";\n$r = mysqli_query($dbc,\
    \ $q);\n```\n\n![image](img/forget.jpg)购物车的总值由购物车页面的 PHP 脚本附加到此网页的 URL 中。\n\n\
    ![image](img/7g.jpg)插入一条语句获取当前的订单号。\n\n```php\n$order_id = mysqli_insert_id($dbc);\n\
    ```\n\n![image](img/8g.jpg)现在，添加语句从“shop”数据库中检索选定的购物车项目详情。\n\n```php\n$q = \"\
    SELECT * FROM shop WHERE item_id IN (\";\nforeach ($_SESSION['cart'] as $id) {\n\
    \    $q .= $id . \",\";\n}\n$q = substr($q, 0, -1) . \") ORDER BY item_id ASC\"\
    ;\n$r = mysqli_query($dbc, $q);\n```\n\n![image](img/9g.jpg)接下来，插入语句将项目详情存储在“order_contents”数据库中。\n\
    \n```php\nwhile ($row = mysqli_fetch_array($r, MYSQLI_ASSOC)) {\n    $query =\
    \ \"INSERT INTO order_contents ( order_id, item_id, quantity, price ) VALUES (\"\
    \ . $order_id . \",\" . $row['item_id'] . \",\" . $row['quantity'] . \",\" . $row['price']\
    \ . \")\";\n    $result = mysqli_query($dbc, $query);\n}\n```\n\n![image](img/10g.jpg)现在，插入一条语句关闭数据库连接，显示确认消息并清空购物车。\n\
    \n```php\nmysqli_close($dbc);\necho '<p>Thanks for your order.</p>';\necho '<p>Order\
    \ Number ' . $order_id . \"</p>\";\n$_SESSION['cart'] = NULL;\n```\n\n添加语句创建指向其他页面的链接，退出登录。\n\
    \n```php\necho '<a href=\"shop.php\">Shop</a> | <a href=\"forum.php\">Forum</a>\
    \ | <a href=\"home.php\">Home</a> | <a href=\"goodbye.php\">Logout</a>';\n```\n\
    \n```\n\n添加语句包含页面页脚。\n\n```php\ninclude ('footer.html');\n```\n\n购物车页面的 PHP 脚本将购物车的总值附加到此网页的\
    \ URL 中。插入一条语句获取当前的订单号。现在，添加语句从“shop”数据库中检索选定的购物车项目详情。接下来，插入语句将项目详情存储在“order_contents”数据库中。关闭数据库连接，显示确认消息并清空购物车。\n\
    \n## 结算成功\n\n在制作了此处第 182-183 页 描述的结算页面后，你现在可以创建一个 PHP 脚本允许用户从网站注销。这将销毁会话数据，使用户在不登录的情况下无法访问网站。\n\
    \n![image](img/pg184_1.jpg)\n\n### goodbye.php\n\n![image](img/1g.jpg)启动一个纯文本编辑器，并使用语句开始\
    \ PHP 脚本允许访问会话数据。\n\n```php\n<?php\nsession_start();\n```\n\n![image](img/2g.jpg)现在，添加语句，如果用户尚未登录，则将浏览器重定向到登录页面。\n\
    \n```php\nif (!isset($_SESSION['user_id'])) {\n    require ('login_tools.php');\n\
    \    load();\n}\n```\n\n![image](img/3g.jpg)接下来，添加语句设置页面标题并包含页面页头。\n\n```php\n\
    $page_title = 'Goodbye';\ninclude ('includes/header.html');\n```\n\n![image](img/4g.jpg)添加语句清空会话变量。\n\
    \n```php\n$_SESSION = array();\n```\n\n![image](img/5g.jpg)现在，添加语句结束会话。\n\n```php\n\
    session_destroy();\n```\n\n![image](img/6g.jpg)接下来，添加语句显示确认消息并提供返回登录页面的超链接。\n\n\
    ```php\necho '<h1>Goodbye!</h1><p>You are now logged out.</p><p><a href=\"login.php\"\
    >Login</a></p>';\n```\n\n![image](img/7g.jpg)最后，添加语句包含页面页脚。\n\n```php\ninclude\
    \ ('footer.html');\n```\n\n![image](img/8g.jpg)将该脚本保存到你浏览器的 `htdocs` 目录并命名为 `goodbye.php`，然后从商店选择项目、结算，最后从网站注销。\n\
    \n![image](img/pg185_1.jpg)\n![image](img/pg185_2.jpg) PHP 和 MySQL 是一个灵活且强大的组合，在\
    \ Web 的未来扮演着重要的角色。默认情况下，会话直到用户关闭浏览器才会结束——因此 PHP 脚本必须在用户注销时结束会话。你可以轻松扩展结算页面脚本以包含订单详情。\n\
    \n## 总结\n\n- 项目详情可以存储在 MySQL 数据库表中，用于在包含待选项目的商店页面中显示。\n- 通常，包含商店项目的数据库表可能存储项目\
    \ ID、名称、描述、图像路径和价格。\n- 订单详情可以存储在两个相关的 MySQL 数据库表中，允许多个订单中包含多个项目。\n- 通常，包含订单摘要详情的数据库表可能存储订单\
    \ ID、用户 ID、总值和订单日期。\n\n"
