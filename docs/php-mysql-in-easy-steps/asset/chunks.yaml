  trans: "\n\n![image](img/6bl.jpg)将文件保存到 `C:\\SQL` 文件夹下命名为 `update_all.sql`，然后启动\
    \ MySQL 命令行客户端并执行查询以使用建立的数据库\n\n```sql\nUSE site_db ;\n```\n\n![image](img/7bl.jpg)现在，通过指定系统上\
    \ SQL 文件的源路径来实现 SQL 查询\n\n```sql\nSOURCE C:\\SQL\\update_all.sql\n```\n\n![image](img/pg101_1.jpg)\n\
    \n![image](img/hot.jpg)\n\n有时，使用 `UPDATE` 查询删除列中的所有值并将每个字段设置为 `NULL` 是很有用的——前提是列定义允许\
    \ `NULL` 值。\n\n### 更新字段\n\n通常情况下，需要使用 `UPDATE` 查询来更改特定行中特定列所包含的数据。可以通过在 `UPDATE`\
    \ 查询中添加 `WHERE` 关键字来匹配指定列中的值，从而识别该行。特定 `UPDATE` 查询的语法如下：\n\n```sql\nUPDATE table-name\n\
    SET column-name = value WHERE column-name = value ;\n```\n\n单个 `UPDATE` 查询也可以通过在\
    \ `SET` 关键字后创建以逗号分隔的多个 `column-name = value` 语句，来更改特定行的多个列值。\n\n如果 `WHERE` 关键字识别出多行具有相同指定值的行，它们都将用新值更新——这可能会导致意外的数据丢失。因此，通过其\
    \ `PRIMARY KEY` 值来识别行更为安全，因为该值保证是唯一的，因此不会意外更新多行。\n\n![image](img/pg102_1.jpg)\n\
    \n```sql\nupdate_where.sql\n```\n\n![image](img/1bl.jpg)启动如记事本之类的纯文本编辑器，并创建一个定义四列表的查询\n\
    \n```sql\nCREATE TABLE IF NOT EXISTS tiles\n(\n| id | INT AUTO_INCREMENT PRIMARY\
    \ KEY , |\n| --- | --- |\n| pattern | CHAR(16) , |\n| color | CHAR(16) , |\n|\
    \ price | DECIMAL(6,2) |\n) ;\n```\n\n![image](img/2bl.jpg)接下来，添加一个查询向此表插入四条记录\n\
    \n```sql\nINSERT INTO tiles ( pattern , color , price )\nVALUES ( \"Spring\" ,\
    \ \"Green\" , 9.99 ),\n( \"Summer\" , \"Yellow\" , 12.99 ),\n( \"Autumn\" , \"\
    Brown\" , 9.99 ),\n( \"Winter\" , \"Blue\" , 8.99 ) ;\n```\n\n![image](img/3bl.jpg)现在，添加一个查询显示此表的所有记录\n\
    \n```sql\nSELECT * FROM tiles ;\n```\n\n![image](img/4bl.jpg)添加一个查询，通过识别其当前值来更新此表的“pattern”列\n\
    \n```sql\nUPDATE tiles\nSET pattern = \"Fall\" WHERE pattern = \"Autumn\" ;\n\
    ```\n\n![image](img/snake.jpg)\n\n如果 `UPDATE` 查询中省略了 `WHERE` 关键字，所有行都将被更新——丢失的数据无法恢复。\n\
    \n![image](img/5bl.jpg)添加查询通过识别当前的“color”、“price”和“id”值来更新其他列并显示它们\n\n```sql\n\
    UPDATE tiles SET color = \"Gold\" WHERE color = \"Yellow\" ;\nUPDATE tiles SET\
    \ price = 10.99 WHERE price = 9.99 ;\nUPDATE tiles SET price = 11.99 WHERE id\
    \ = 4 ;\nSELECT * FROM tiles ;\n```\n\n![image](img/6bl.jpg)将文件保存到 `C:\\SQL` 文件夹下命名为\
    \ `update_where.sql`，然后启动 MySQL 命令行客户端并执行查询以使用建立的数据库\n\n```sql\nUSE site_db ;\n\
    ```\n\n![image](img/7bl.jpg)现在，通过指定系统上 SQL 文件的源路径来实现 SQL 查询\n\n```sql\nSOURCE\
    \ C:\\SQL\\update_where.sql\n```\n\n![image](img/pg103_1.jpg)\n\n![image](img/hot.jpg)始终通过其\
    \ `PRIMARY KEY` 值识别行来尝试 `UPDATE` 表。\n\n### 删除数据\n\n可以使用 `DELETE FROM` 查询从数据库表中删除行。使用此语法删除所有行：\n\
    \n```sql\nDELETE FROM table-name ;\n```\n\n此外，通过在 `DELETE FROM` 查询中添加 `WHERE`\
    \ 关键字识别行，可以从表中删除特定行。`DELETE FROM` 查询的语法如下：\n\n```sql\nDELETE FROM table-name WHERE\
    \ column-name = value ;\n```\n\n如果 `WHERE` 关键字识别出多行具有相同值的行，它们都将被删除——可能会导致意外的数据丢失。因此，通过其\
    \ `PRIMARY KEY` 值识别行更为安全，因为它是保证唯一的，所以不会意外删除多行。\n\n![image](img/pg104_1.jpg)\n\n\
    ```sql\ndelete_from.sql\n```\n\n![image](img/1bl.jpg)启动如记事本之类的纯文本编辑器，并创建一个定义四列表的查询\n\
    \n```sql\nCREATE TABLE IF EXISTS pens\n(\n| id | INT AUTO_INCREMENT PRIMARY KEY\
    \ , |\n| --- | --- |\n| maker | CHAR(32) , |\n| model | CHAR(32) , |\n| price\
    \ | DECIMAL(6,2) |\n) ;\n```\n\n![image](img/2bl.jpg)接下来，添加一个查询向此表插入四条记录\n\n```sql\n\
    INSERT INTO pens ( maker , model , price )\nVALUES ( \"Montegrappa\" , \"Silver\
    \ Dragon\" , 950.00 ),\n( \"Paul Rossi\" , \"Egyptian Lady\" , 650.00 ),\n( \"\
    Michel Perchin\" , \"Red Cross\" , 450.00 ),\n( \"Bexley\" , \"Poseidon Magnum\"\
    \ , 350.00 ) ;\n```\n\n![image](img/3bl.jpg)现在，添加一个查询显示此表的所有记录\n\n```sql\nSELECT\
    \ * FROM pens ;\n```\n\n![image](img/4bl.jpg)添加查询通过各种列值单独删除行，然后显示剩余记录\n\n```sql\n\
    DELETE FROM pens WHERE maker = \"Montegrappa\" ;\nSELECT * FROM pens ;\nDELETE\
    \ FROM pens WHERE model = \"Egyptian Lady\" ;\nSELECT * FROM pens ;\nDELETE FROM\
    \ pens WHERE price = 450.00 ;\nSELECT * FROM pens ;\nDELETE FROM pens WHERE id\
    \ = 4 ; \nSELECT * FROM pens ;\n```\n\n![image](img/forget.jpg)`DELETE` 关键字不能用于删除表——你必须使用\
    \ `DROP` 关键字进行删除。\n\n![image](img/5bl.jpg)将文件保存到 `C:\\SQL` 文件夹下命名为 `delete_from.sql`，然后启动\
    \ MySQL 命令行客户端并执行查询以使用建立的数据库\n\n```sql\nUSE site_db ;\n```\n\n![image](img/6bl.jpg)现在，通过指定系统上\
    \ SQL 文件的源路径来实现 SQL 查询\n\n```sql\nSOURCE C:\\SQL\\delete_from.sql\n```\n\n![image](img/pg105_1.jpg)\n\
    \n![image](img/snake.jpg)\n\n如果 `DELETE FROM` 查询中省略了 `WHERE` 关键字，所有行都将被删除——丢失的数据无法恢复。\n\
    \n### 选择数据\n\n查看数据库表中数据的 SQL 查询在本章开头介绍。通配符 `*` 意味着“所有”，可以替换为列名以仅检索特定列的数据。该查询的语法如下：\n\
    \n```sql\nSELECT column-name FROM table-name ;\n```\n\n以下脚本创建并显示整个表，然后选择单独列进行显示。\n\
    \n![image](img/pg106_1.jpg)\n\n```sql\nselection.sql\n```\n\n![image](img/1bl.jpg)启动如记事本之类的纯文本编辑器，并创建一个定义四列表的查询\n\
    \n```sql\nCREATE TABLE IF EXISTS paintings\n(\n| id | INT AUTO_INCREMENT PRIMARY\
    \ KEY , |\n| --- | --- |\n| artists | CHAR(32) , |\n| titles | CHAR(64) , |\n\
    | styles | CHAR(16) |\n) ;\n```\n\n![image](img/2bl.jpg)接下来，添加一个查询向此表插入四条记录\n\n\
    ```sql\nINSERT INTO paintings ( artists , titles , styles )\nVALUES\n( \"Salvador\
    \ Dali\" , \"Meditative Rose\" , \"Surrealist\" ),\n( \"Henri Matisse\" , \"Blue\
    \ Hair\" , \"Impressionist\" ),\n( \"Pablo Picasso\" , \"Girl Reading\" , \"Cubist\"\
    \ ),\n( \"Marc Chagall\" , \"Bonjour Paris\" , \"Primitivist\" ) ;\n```\n\n![image](img/3bl.jpg)现在，添加一个查询显示此表的所有记录\n\
    \n```sql\nSELECT * FROM paintings ;\n```\n\n![image](img/4bl.jpg)添加一个查询单独显示“artists”列\n\
    \n```sql\nSELECT artists FROM paintings ;\n```\n\n![image](img/5bl.jpg)添加一个查询单独显示“titles”列\n\
    \n```sql\nSELECT titles FROM paintings ;\n```\n\n![image](img/6bl.jpg)添加一个查询单独显示“styles”列\n\
    \n```sql\nSELECT styles FROM paintings ;\n```\n\n![image](img/7bl.jpg)将文件保存到 `C:\\\
    SQL` 文件夹下命名为 `selection.sql`，然后启动 MySQL 命令行客户端并执行查询以使用建立的数据库\n\n```sql\nUSE site_db\
    \ ;\n```\n\n![image](img/8bl.jpg)现在，通过指定系统上 SQL 文件的源路径来实现 SQL 查询\n\n```sql\nSOURCE\
    \ C:\\SQL\\selection.sql\n```\n\n"
