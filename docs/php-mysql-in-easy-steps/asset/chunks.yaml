    \n[content]\n在处理用户输入的脚本中，当用户输入不适当的数据时，“触发”错误是非常用的。这通过使用 PHP 的 `trigger_error()`\
    \ 函数实现，该函数接受两个参数来指定错误消息和级别。由于此函数仅描述用户生成的错误，指定的错误级别必须是上表中的 `E_USER` 常量类型之一。\n\n\
    ![image](img/hot.jpg)\n\nPHP 错误处理通过其配置文件开启，也可以通过调用 `ini_set( ‘display_errors’,1)`\
    \ 手动开启。\n\n![image](img/pg137_1.jpg)\n\nerror.php\n\n![image](img/1v.jpg)创建一个包含\
    \ PHP 脚本的 HTML 文档，该脚本开头指定一个自定义的错误处理函数\n\n```php\n<?php\nset_error_handler( ‘error_handler’\
    \ ) ;\n```\n\n![image](img/2v.jpg)接下来，添加自定义错误处理函数，以便在调用时向用户显示错误详情\n\n```php\n\
    function error_handler ( $level , $message , $file , $line )\n{\n    echo “Error\
    \ [$level] : $message <br>\n(Check line $line in $file )” ;\n}\n```\n\n![image](img/3v.jpg)现在，初始化一个变量，模拟用户输入值\n\
    \n```php\n$num = 500 ;\n```\n\n![image](img/4v.jpg)最后，设置触发器调用自定义错误处理函数\n\n```php\n\
    if ( $num > 100 )\n{ \n    trigger_error( ‘Number must be less than 100’ , E_USER_ERROR\
    \ ) ; \n}\n?>\n```\n\n![image](img/5v.jpg)将 PHP 脚本保存到 Web 服务器的 `/htdocs` 目录下并命名为\
    \ `error.php`，然后通过 HTTP 打开以查看由自定义错误处理函数生成的消息\n\n![image](img/pg137_2.jpg)\n\n\
    ![image](img/hot.jpg)\n\n单独表达式错误可以通过在表达式前加上 `@` 错误控制运算符来抑制。因此，$num = @( 8 / 0\
    \ ) ; 会抑制默认的 `Division By Zero` 错误消息。\n\n## 总结\n\n- PHP `mysqli_connect()` 函数将用户连接到指定的数据库并返回一个数据库连接对象。\n\
    - 数据库连接对象被用作与其他数据库通信的其他 PHP 函数的参数。\n- PHP `mysqli_query()` 函数将 SQL 查询发送到 MySQL\
    \ 服务器上连接的数据库。\n- 当调用 `mysqli_query()` 函数时，成功时返回一个结果集或 `TRUE` 值，失败时返回 `FALSE` 值。\n\
    - 可选，可以调用 `mysqli_close()` 来显式关闭数据库连接。\n- SQL `SELECT` 查询返回一个包含记录行的结果集，可以使用 `while`\
    \ 循环逐行读取这些行。\n- PHP `mysqli_fetch_array()` 函数将结果集的每行作为关联数组或数字数组返回。\n- 可选，调用 `mysqli_free_result()`\
    \ 可以显式释放结果集资源。\n- SQL `INSERT`、`UPDATE`、`DELETE` 或 `ALTER` 查询在成功时仅返回 `TRUE` 值。\n\
    - PHP `mysqli_num_rows()` 函数返回一个表示指定结果集中行数的整数。\n- `mysqli_affected_rows()` 函数返回一个表示受\
    \ `INSERT`、`UPDATE` 或 `DELETE` 影响的行数的整数。\n- 按类型测试数据的 PHP 函数如果数据为特定类型，则返回 `TRUE`，否则返回\
    \ `FALSE`。\n- `mysqli_real_escape_string()` 函数转义字符串中的特殊字符，`strip_tags()` 移除 HTML\
    \ 标签。\n- `set_error_handler()` 函数指定自定义错误处理程序，`trigger_error()` 可生成错误。\n\n8\n\n\
    # 注册用户\n\n*本章演示了如何创建一个简单的注册程序和登录应用程序。*\n\n- 创建用户数据库\n- 提供注册页面\n- 处理注册\n- 提供登录页面\n\
    - 提供登录工具\n- 处理登录尝试\n- 确认登录成功\n- 总结\n\n## 创建用户数据库\n\n用户详情可以在用户首次注册访问时很有用地存储在 MySQL\
    \ 数据库表中，这样在随后的访问中，PHP 脚本就可以轻松检索这些详情进行比较。当用户输入的登录详情与数据库表中已存储的信息相匹配时，脚本可以允许访问网站。通常，包含用户详情的数据库表可能会以单独列的形式存储每个用户的用户\
    \ ID、名字、姓氏、电子邮件地址、密码和注册日期：\n\n| **列名：** | 内容类型: | 示例: |\n| --- | --- | --- |\n\
    | `user_id` | 数字 | 123 |\n| `first_name` | 文本 | Mike |\n| `last_name` | 文本 | McGrath\
    \ |\n| `email` | 文本 | mike@example.com |\n| `pass` | 文本 | m00nshine |\n| `reg_date`\
    \ | 日期/时间 | 2018-05-14 12:30:00 |\n"
- fmt: "\nWhen the form is submitted after user input, the PHP script will display\
    \ messages to advise the user of any validation error, or display a confirmation\
    \ that registration has succeeded and provide a hyperlink to a Login page.\n\n\
    ![image](images/forget.jpg)\n\nThe page’s header and footer are included in HTML\
    \ documents, simply styled by a CSS stylesheet.\n\n![image](images/pg143_1.jpg)\n\
    \n### register.php\n\n![image](images/1b.jpg)Launch a plain text editor and begin\
    \ a PHP script with statements to set the page title and include a page header\n\
    \n```php\n<?php\n$page_title = ‘Register’ ;\ninclude ( ‘includes/header.html’\
    \ ) ;\n```\n\n![image](images/2b.jpg)Now, add a conditional test that will only\
    \ execute the statements it contains if the form has been submitted\n\n```php\n\
    if ($_SERVER['REQUEST_METHOD'] == ‘POST’ )\n{\n    # Statements to be inserted\
    \ here (Steps 3-10).\n}\n?>\n```\n\n![image](images/3b.jpg)Next, insert statements\
    \ to open the database connection and initialize an array for error messages\n\
    \n```php\nrequire ( ‘../connect_db.php’ ) ;\n$errors = array() ;\n```\n\n![image](images/4b.jpg)Insert\
    \ statements to store an error message if the first name field remains empty,\
    \ or store its value in a variable\n\n```php\nif ( empty($_POST['first_name']\
    \ ) )\n{ $errors[] = ‘Enter your first name.’ ; }\nelse\n{ $fn = mysqli_real_escape_string(\
    \ $dbc, trim($_POST['first_name'] ) ) ; }\n```\n\n![image](images/5b.jpg)Now,\
    \ insert statements to store an error message if the last name field remains empty,\
    \ or store its value in a variable\n\n```php\nif ( empty($_POST['last_name'] )\
    \ )\n{ $errors[] = ‘Enter your last name.’ ; }\nelse\n{ $ln = mysqli_real_escape_string(\
    \ $dbc, trim($_POST['last_name'] ) ) ; }\n```\n\n![image](images/6b.jpg)Insert\
    \ statements to store an error message if the email address field remains empty,\
    \ or store its value in a variable\n\n```php\nif ( empty($_POST['email'] ) )\n\
    { $errors[] = ‘Enter your email address.’ ; }\nelse\n{ $e = mysqli_real_escape_string(\
    \ $dbc, trim($_POST['email'] ) ) ; }\n```\n\n![image](images/forget.jpg)\n\nThe\
    \ database connection variable `$dbc` is initialized by the `connect_db.php` script,\
    \ and the `$_POST[]` array contains the values in the named form fields.\n\n![image](images/hot.jpg)\n\
    \nUse the `mysqli_real_escape_string()` function to escape special characters,\
    \ and the `trim()` function to remove unwanted spaces.\n\n![image](images/7b.jpg)Next,\
    \ insert statements to store the password value in a variable if the passwords\
    \ are a valid match, or store an error message if they do not match or the first\
    \ field is empty\n\n```php\nif ( !empty($_POST['pass1'] ) )\n{\n    if ($_POST['pass1']\
    \ != $_POST['pass2'] )\n    { $errors[] = ‘Passwords do not match.’ ; }\n    else\n\
    \    { $p = mysqli_real_escape_string( $dbc, trim($_POST['pass1'] ) ) ; }\n}\n\
    else { $errors[] = ‘Enter your password.’ ; }\n```\n\n![image](images/8b.jpg)Insert\
    \ statements to store an error message if the email address is already registered\
    \ in the “users” database table\n\n```php\nif ( empty($errors) )\n{\n    $q =\
    \ “SELECT user_id FROM users WHERE email='$e’” ;\n    $r = mysqli_query ( $dbc\
    \ , $q ) ;\n    if ( mysqli_num_rows( $r ) != 0 )\n    { $errors[] = ‘Email address\
    \ already registered. <a href=”login.php”>Login</a’ ; }\n}\n```\n\n![image](images/9b.jpg)Now,\
    \ insert statements to store the user data in the database table, display a confirmation\
    \ when registration succeeds, close the database connection, include a page footer,\
    \ and exit the script\n\n```php\nif ( empty($errors) )\n{\n    $q = “INSERT INTO\
    \ users (first_name, last_name, email, pass, reg_date) VALUES (‘$fn’, ‘$ln’, ‘$e’,\
    \ SHA2(‘$p’, 256 ), NOW() )” ;\n    $r = mysqli_query ( $dbc , $q ) ;\n    if\
    \ ( $r )\n    {\n        echo ‘<h1>Registered!</h1><p>You are now registered.</p><p><a\
    \ href=”login.php”>Login</a></p>’ ;\n    }\n    mysqli_close( $dbc ) ;\n    include\
    \ ( ‘includes/footer.html’ ) ;\n}\n```\n"
