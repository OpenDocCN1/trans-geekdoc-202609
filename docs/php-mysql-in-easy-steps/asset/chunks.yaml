  trans: "\n\n## 提供登录页面\n\n在完成用户注册过程（详见第 142-147 页介绍）后，你现在可以创建登录页面了。用户可以通过注册时提供的超链接或直接输入登录页面地址来访问该页面。\n\
    \n![image](img/pg148_1.jpg)\n\n`login.php`\n\n![image](img/1b.jpg)启动一个纯文本编辑器，并开始编写\
    \ PHP 脚本，使用语句设置页面标题并包含页面页眉\n\n```php\n<?php\n$page_title = ‘Login’ ;\ninclude\
    \ ( ‘includes/header.html’ ) ;\n```\n\n![image](img/2b.jpg)现在，添加一个条件测试，如果存在任何错误消息则显示它们，并在登录尝试失败时提供返回注册页面的超链接\n\
    \n```php\nif ( isset( $errors ) && !empty( $errors ) )\n{\n    echo ‘<p id=”err_msg>Oops!\
    \ There was a problem:<br>’ ;\n    foreach ( $errors as $msg )\n    {\n      \
    \  echo “ - $msg<br>” ;\n    }\n    echo ‘Please try again or\n<a href=”register.php”>Register</a></p>’\
    \ ;\n}\n?>\n```\n\n![image](img/3b.jpg)接下来，添加 HTML 表单，将用户登录详情提交给 PHP 脚本进行处理\n\n\
    ```html\n<h1>Login</h1>\n<form action=”login_action.php” method=”POST\">\n<p>\n\
    Email Address: <input type=”text” name=”email\">\n</p><p>\nPassword: <input type=”password”\
    \ name=”pass\">\n</p><p>\n<input type=”submit” value=”Login” >\n</p>\n</form>\n\
    ```\n\n![image](img/4b.jpg)添加最后一条脚本指令以包含页面页脚，然后将脚本保存到 Web 服务器的 `/htdocs` 目录中，命名为\
    \ `login.php`\n\n```php\n<?php include ( ‘includes/footer.html’ ) ; ?>\n```\n\n\
    ![image](img/forget.jpg)\n\n只有在表单提交且登录失败后，PHP 处理脚本程序才会设置 `$errors` 数组。\n\n![image](img/5b.jpg)点击注册页面上的超链接，或在浏览器地址栏输入位置\
    \ `http://localhost/login.php`，即可看到 Abyss 呈现登录页面\n\n![image](img/pg149_1.jpg)\n\
    \n当提交登录表单时，必须通过验证函数确保字段不为空，然后在“users”数据库表中查找到其输入值。\n\n如果找到了提交的值，则登录尝试成功，因此可以从“users”表中检索相应的用户\
    \ ID、名字和姓氏，并调用另一个函数在浏览器中加载首页（Home page）。\n\n如果未找到提交的值，则登录尝试失败，验证函数将简单设置一个描述性的错误消息。\n\
    \n这两个函数（验证表单字段的函数和加载新页面的函数）可以方便地在独立的 PHP 脚本中创建为登录“工具”，这样它们就可以从处理登录页面表单的脚本中轻松调用，并在用户导航到网站其他页面时被其他\
    \ PHP 脚本调用。\n\n![image](img/snake.jpg)\n\n在创建 PHP 处理脚本之前点击登录按钮，只会产生 HTTP 404 页面未找到错误。\n\
    \n![image](img/hot.jpg)\n\n如果这些函数对网站的多个页面都有用，可以在独立的 PHP 脚本中创建它们以实现模块化。\n\n## 提供登录工具\n\
    \n在完成用户登录表单（详见第 148-149 页）后，你现在可以创建登录工具，用于验证登录尝试并在需要时加载新页面。只需通过在工具中插入指向此脚本的 PHP\
    \ `require` 语句，即可轻松供网站上的其他页面使用。\n\n![image](img/pg150_1.jpg)\n\n`login_tools.php`\n\
    \n![image](img/1b.jpg)启动一个纯文本编辑器，并开始编写 PHP 脚本，包含一个函数块来加载作为参数指定的页面\n\n```php\n\
    <?php\nfunction load( $page = ‘login.php’ )\n{\n    # 在此处插入语句（步骤 2-4）。\n}\n```\n\
    \n![image](img/2b.jpg)现在，在 `load` 函数块中，插入一条语句来构建一个包含协议、当前域名和目录的 URL 字符串\n\n```php\n\
    $url = ‘http://’ . $_SERVER['HTTP_HOST’] .\ndirname( $_SERVER['PHP_SELF'] ) ;\n\
    ```\n\n![image](img/3b.jpg)接下来，在 `load` 函数块中，插入语句移除 URL 字符串中的任何末尾斜杠，然后追加正斜杠和指定的页面参数\n\
    \n```php\n$url = rtrim( $url , ‘/’ ) ;\n$url .= ‘/’ . $page ;\n```\n\n![image](img/4b.jpg)最后，在\
    \ `load` 函数块中，插入语句来加载指定的页面然后退出脚本\n\n```php\nheader( “Location: $url” ) ;\nexit()\
    \ ;\n```\n\n![image](img/5b.jpg)添加一个函数块来验证用户登录详情是否正确，或提供错误消息\n\n```php\nfunction\
    \ validate( $dbc, $email = '', $pwd = '' )\n{\n    // 在此处插入语句（步骤 6-10）。\n}\n```\n\
    \n在 `validate` 函数块中，插入一个语句来初始化错误数组\n\n```php\n$errors = array();\n```\n\n![image](img/6b.jpg)如果未指定页面，则将\
    \ `load` 函数的名称赋予默认页面。\n\n`load` 函数的存在可能会给 URL 字符串添加斜杠，因此在追加页面之前必须移除它们。\n\n![image](img/7b.jpg)接下来，如果\
    \ email 字段为空，插入语句来存储错误消息\n\n```php\nif ( empty( $email ) )\n{\n    $errors[] =\
    \ ‘Enter email address.’ ;\n}\nelse\n$e = mysqli_escape_string($dbc, trim($email));\n\
    ```\n\n![image](img/8b.jpg)现在，如果密码 字段为空，插入语句来存储错误消息\n\n```php\nif ( empty( $pwd\
    \ ) )\n{\n    $errors[] = ‘Enter password.’ ;\n}\nelse\n$p = mysqli_escape_string($dbc,\
    \ trim($pwd));\n```\n\n![image](img/9b.jpg)如果在数据库中找到 email 和密码，向调用者返回关联的用户 ID、姓氏\n\
    \n```php\nif ( empty( $errors ) )\n{\n    $q = “SELECT user_id, first_name, last_name\n\
    \    FROM users\n    WHERE email = ‘$e’\n    AND pass = SHA2( ‘$p’, 256 ) ” ;\n\
    \    $r = mysqli_query( $dbc , $q ) ;\n    if ( mysqli_num_rows( $r ) == 1 )\n\
    \    {\n        $row = mysqli_fetch_array ( $r , MYSQLI_ASSOC ) ;\n        return\
    \ array( true , $row ) ;\n    }\n    else\n    { $errors[] = ‘Email address and\
    \ password not found.’ }\n}\n```\n\n![image](img/10b.jpg)最后，如果登录尝试失败，在 `validate`\
    \ 函数中返回错误列表\n\n```php\nreturn array( false , $errors );\n```\n\n![image](img/11b.jpg)确保现在将此脚本保存到\
    \ Web 服务器的 `/htdocs` 目录中，命名为 `login_tools.php`\n\n![image](img/hot.jpg)\n\n为了稳定性，你应该使用\
    \ `mysqli_real_escape_string()` 函数转义任何意外字符。\n\n![image](img/snake.jpg)注册过程使用 MySQL\
    \ `SHA2()` 函数加密格式存储用户密码（请参阅此处第 116 页）——因此 SELECT 比较也必须使用该函数。\n\n## 处理登录尝试\n\n\
    在完成登录表单和登录工具（详见第 148-151 页）后，你现在可以创建 PHP 脚本来实际处理登录尝试。当登录尝试成功时，此脚本将从数据库检索的用户详情设置为会话数据——这样已登录用户在网站的其他页面之间导航时可以被轻松识别。\n\
    \n![image](img/pg152_1.jpg)\n\n`login_action.php`\n\n![image](img/1b.jpg)启动一个纯文本编辑器，并开始编写\
    \ PHP 脚本，包含一个测试块来检查登录表单是否已提交\n\n```php\n<?php\nif ( $_SERVER['REQUEST_METHOD']\
    \ == ‘POST’ )\n{\n    # 在此处插入语句（步骤 2-6）。\n}\n```\n\n"
