    | `-` | Subtraction |\n| `*` | Multiplication |\n| `/` | Division |\n| `%` | Modulus\
    \ |\n| `++` | Increment |\n| `--` | Decrement |\n\nOperators for addition, subtraction,\
    \ multiplication, and division act as you would expect. Care must be taken, however,\
