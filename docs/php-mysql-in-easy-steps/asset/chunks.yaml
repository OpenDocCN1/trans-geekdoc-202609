    \n```php\necho ‘<p><a href=”forum.php”>Forum</a>’ ;\n```\n\n![image](img/9r.jpg)添加最后的语句包含页脚\n\
    \n```php\ninclude ( ‘includes/footer.html’ ) ?>\n```\n\n![image](img/10r.jpg)将此脚本保存到网络浏览器的\
    \ `/htdocs` 目录并为 `post_action.php`，然后提交一个没有主题或消息的表单，以查看脚本显示错误消息\n\n![image](img/hot.jpg)\n\
    \n如果脚本发现表单字段为空，它将提供自己的错误消息；如果数据无法添加到数据库表，则将提供 MySQL 错误消息。\n\n![image](img/snake.jpg)\n\
