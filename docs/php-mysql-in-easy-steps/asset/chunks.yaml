    You can also use a shorthand concatenate assignment operator `.=` to join two\
    \ strings – so that `$a = $a . $b` can be simply written `$a .= $b`.\n\n![image](images/hot.jpg)\n\
    \nAdopt a consistent naming style for your variables – such as all lowercase `$my_var`,\
    \ or “camelcase” `$myVar`.\n\n## Producing arrays\n\nAn array variable can store\
    \ multiple items of data in sequential array “elements” that are numbered (“indexed”)\
    \ starting at zero. So, the first array value is stored in array element number\
    \ zero. Individual array element values can be referenced using the variable name\
    \ followed by the index number in square brackets. For example, `$months[0]` references\
    \ the value stored in the first array element, `$months[1]` references the value\
    \ stored in the second array element, and so on.\n\nVariable arrays can be created\
    \ by making multiple statements that assign values to successive elements, or\
    \ by making a single statement using a PHP `array()` function to fill the elements:\n\
    \n```php\n$months[] = ‘January’ ;\n$months[] = ‘February’ ;\n$months[] = ‘March’\
    \ ;\n```\n\n```php\n$months = array( ‘January’ , ‘February’ , ‘March’ ) ;\n```\n\
    \nBoth create an array where the value stored in each element can be referenced\
    \ using its index number, such as `$months[0]`.\n\nWhen creating an array you\
    \ can optionally specify a key name for each element that can be used to reference\
    \ that element’s value:\n\n```php\n$months['jan'] = ‘January’ ;\n$months['feb']\
    \ = ‘February’ ;\n$months['mar'] = ‘March’ ;\n```\n\n```php\n$months = array(\
    \ ‘jan’ => ‘January’ , ‘feb’ => ‘February’ , ‘mar’ => ‘March’ ) ;\n```\n\nBoth\
    \ create an array where the value stored in each element can be referenced using\
    \ its key name, such as `$months['jan']`.\n\nAll elements of an array can be accessed\
    \ using a `foreach` loop to reference each element’s value in turn and assign\
    \ it to a variable:\n\n```php\nforeach( $months as $value )\n{\n    # Use the\
    \ current $value on each iteration.\n}\n```\n\nThe keys can also be accessed on\
    \ each iteration of the loop using\n\n```php\nforeach( $months as $key => $value\
    \ )\n{\n    # Use the current $key and $value on each iteration.\n}\n```\n\n![image](images/forget.jpg)\n\
    \nSquare brackets denote “element” so are not needed after the variable name in\
    \ the assignment using the `array()` function – only when addressing an element.\n\
    \n![image](images/snake.jpg)\n\nIf you specify the same key name twice, the second\
    \ value will overwrite the first value in that element.\n\n![image](images/1r.jpg)Create\
    \ a valid HTML document, like the one listed [here on page 16](#chapter01.html#sec6),\
    \ then insert PHP tags into the body section\n\n```php\n<?php\n# Statements to\
    \ be inserted here.\n?>\n```\n\n![image](images/pg31_1.jpg)\n\narray.php\n\n![image](images/2r.jpg)Now,\
    \ between the PHP tags insert a statement to create and initialize a variable\
    \ array with values\n\n```php\n$days = array( ‘Monday’ , ‘Tuesday’ , ‘Wednesday’\
    \ ) ;\n```\n\n![image](images/3r.jpg)Next, insert a statement to display the value\
    \ in all array elements as a bulleted list\n\n```php\nforeach( $days as $value\
    \ ) { echo “&bull; $value “ ; }\n```\n\n![image](images/4r.jpg)Then, insert a\
    \ statement to create and initialize a variable array with both keys and values\n\
    \n```php\n$months = array( ‘jan’ => ‘January’ ,\n‘feb’ => ‘February’ , ‘mar’ =>\
    \ ‘March’ ) ;\n```\n\n![image](images/5r.jpg)Finally, insert statements to display\
    \ the key and value in all elements as a definition list\n\n```php\necho ‘<dl>’\
    \ ;\nforeach( $months as $key => $value )\n{ echo “<dt>$key<dd>$value” ; }\necho\
    \ ‘</dl>’ ;\n```\n\n![image](images/6r.jpg)Save the document in your web browser’s\
    \ `/htdocs` directory as `array.php`, then open the page via HTTP to see the variable\
    \ array element values get displayed\n\n![image](images/pg31_2.jpg)\n\n![image](images/hot.jpg)\n\
    \nYou can set the first element key to 1, so the index will begin at one rather\
    \ than zero, using `$months = array( 1 => ‘January’ , ‘February’ , March’);`\n\
    \n![image](images/hot.jpg)\n\nYou can easily create arrays containing sequential\
    \ numbers or letters with the PHP `range()` function. For example, with  \n\n\
    ```php\n$six = range( 1 , 6 ) ;\n```\n\n```php\n$a = range( ‘a’ , ‘z’ )\n```\n\
    \n## Sorting arrays\n\nPHP provides two handy functions to sort arrays: `sort()`\
    \ and `rsort()`. These functions sort arrays by value and discard the original\
    \ keys. For example:\n\n```php\n$fruits = array( ‘a’ => ‘apple’ , ‘b’ => ‘banana’\
    \ , ‘c’ => ‘cherry’ ) ;\nsort( $fruits );\n```\n\nAfter `sort()`, the array will\
    \ be:\n\n```php\n$fruits = array( 0 => ‘apple’ , 1 => ‘banana’ , 2 => ‘cherry’\
    \ ) ;\n```\n\nIf you want to sort the array in descending order, use `rsort()`.\
    \ This function also sorts by value but discards the keys:\n\n```php\nrsort( $fruits\
    \ );\n```\n\nThe array will be:\n\n```php\n$fruits = array( 0 => ‘cherry’ , 1\
    \ => ‘banana’ , 2 => ‘apple’ ) ;\n```\n\nIf you want to keep the original keys,\
    \ use `ksort()` and `krsort()`. `ksort()` sorts the array by key in ascending\
    \ order:\n\n```php\nksort( $fruits );\n```\n\nThe keys will be preserved.\n\n\
    If you want to sort the array by key in descending order, use `krsort()`:\n\n\
    ```php\nkrsort( $fruits );\n```\n\nIf you want to sort the array by value but\
    \ keep the keys, use `asort()` and `arsort()`. `asort()` sorts by value in ascending\
    \ order and preserves the keys:\n\n```php\nasort( $fruits );\n```\n\nThe keys\
    \ will be preserved.\n\nIf you want to sort the array by value in descending order\
    \ but keep the keys, use `arsort()`:\n\n```php\narsort( $fruits );\n```\n\nThe\
    \ keys will be preserved.\n"
