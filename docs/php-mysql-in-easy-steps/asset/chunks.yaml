  trans: "\n\n当用户输入并提交表单后，PHP 脚本将显示消息提示用户任何验证错误，或显示注册成功的确认并提供指向登录页面的超链接。\n\n![image](img/forget.jpg)\n\
    \n页面的头部和页脚包含在 HTML 文档中通过 CSS 样式表进行简单样式化。\n\n![image](img/pg143_1.jpg)\n\n### register.php\n\
    \n![image](img/1b.jpg)启动一个纯文本编辑器，并编写设置页面标题和包含页面头部的 PHP 脚本\n\n```php\n<?php\n$page_title\
    \ = ‘Register’ ;\ninclude ( ‘includes/header.html’ ) ;\n```\n\n![image](img/2b.jpg)现在，添加一个条件测试，只有在表单已提交时才执行其包含的语句\n\
    \n```php\nif ($_SERVER['REQUEST_METHOD'] == ‘POST’ )\n{\n    # 在此处插入语句（步骤 3-10）。\n\
    }\n?>\n```\n\n![image](img/3b.jpg)接下来，插入语句以打开数据库连接并初始化用于错误消息的数组\n\n```php\nrequire\
    \ ( '../connect_db.php’ ) ;\n$errors = array() ;\n```\n\n![image](img/4b.jpg)插入语句：如果姓字段为空，则存储错误消息，或者将其值存储在变量中\n\
    \n```php\nif ( empty($_POST['first_name'] ) )\n{ $errors[] = ‘Enter your first\
    \ name.’ ; }\nelse\n{ $fn = mysqli_real_escape_string( $dbc, trim($_POST['first_name']\
    \ ) ) ; }\n```\n\n![image](img/5b.jpg)现在，插入语句：如果姓字段为空，则存储错误消息，或者将其值存储在变量中\n\n\
    ```php\nif ( empty($_POST['last_name'] ) )\n{ $errors[] = ‘Enter your last name.’\
    \ ; }\nelse\n{ $ln = mysqli_real_escape_string( $dbc, trim($_POST['last_name']\
    \ ) ) ; }\n```\n\n![image](img/6b.jpg)插入语句：如果邮箱地址字段为空，则存储错误消息，或者将其值存储在变量中\n\n\
    ```php\nif ( empty($_POST['email'] ) )\n{ $errors[] = ‘Enter your email address.’\
    \ ; }\nelse\n{ $e = mysqli_real_escape_string( $dbc, trim($_POST['email'] ) )\
    \ ; }\n```\n\n![image](img/forget.jpg)\n\n数据库连接变量 `$dbc` 由 `connect_db.php` 脚本初始化，`$_POST[]`\
    \ 数组包含命名表单字段的值。\n\n![image](img/hot.jpg)\n\n使用 `mysqli_real_escape_string()` 函数转义特殊字符，并使用\
    \ `trim()` 函数移除不需要的空格。\n\n![image](img/7b.jpg)接下来，插入语句：如果密码匹配，则将密码值存储在变量中；如果不匹配或第一个字段为空，则存储错误消息\n\
    \n```php\nif ( !empty($_POST['pass1'] ) )\n{\n    if ($_POST['pass1'] != $_POST['pass2']\
    \ )\n    { $errors[] = ‘Passwords do not match.’ ; }\n    else\n    { $p = mysqli_real_escape_string(\
    \ $dbc, trim($_POST['pass1'] ) ) ; }\n}\nelse { $errors[] = ‘Enter your password.’\
    \ ; }\n```\n\n![image](img/8b.jpg)插入语句：如果邮箱地址已经在“users”数据库表中注册过，则存储错误消息\n\n```php\n\
    if ( empty($errors) )\n{\n    $q = “SELECT user_id FROM users WHERE email='$e’”\
    \ ;\n    $r = mysqli_query ( $dbc , $q ) ;\n    if ( mysqli_num_rows( $r ) !=\
    \ 0 )\n    { $errors[] = ‘Email address already registered. <a href=”login.php”>Login</a’\
    \ ; }\n}\n```\n\n![image](img/9b.jpg)现在，插入语句将用户数据存入数据库表、注册成功时显示确认、关闭数据库连接、包含页脚并退出脚本\n\
    \n```php\nif ( empty($errors) )\n{\n    $q = “INSERT INTO users (first_name, last_name,\
    \ email, pass, reg_date) VALUES (‘$fn’, ‘$ln’, ‘$e’, SHA2(‘$p’, 256 ), NOW() )”\
    \ ;\n    $r = mysqli_query ( $dbc , $q ) ;\n    if ( $r )\n    {\n        echo\
    \ ‘<h1>Registered!</h1><p>You are now registered.</p><p><a href=”login.php”>Login</a></p>\
    \ ;\n    }\n    mysqli_close( $dbc ) ;\n    include ( ‘includes/footer.html’ )\
    \ ;\n}\n```\n\n"
- fmt: "\n## Providing a login page\n\nHaving completed the user registration process,\
    \ described [here on pages 142-147](#chapter08.html#sec70), you can now create\
    \ the Login page that the user can access by following the hyperlinks provided\
    \ upon registration, or by addressing the Login page directly.\n\n![image](images/pg148_1.jpg)\n\
    \n`login.php`\n\n![image](images/1b.jpg)Launch a plain text editor and begin a\
    \ PHP script with statements to set the page title and include a page header\n\
    \n```php\n<?php\n$page_title = ‘Login’ ;\ninclude ( ‘includes/header.html’ ) ;\n\
    ```\n\n![image](images/2b.jpg)Now, add a conditional test that will display any\
    \ error messages if they exist, and provide a hyperlink back to the registration\
    \ page when the login attempt fails\n\n```php\nif ( isset( $errors ) && !empty(\
    \ $errors ) )\n{\n    echo ‘<p id=”err_msg>Oops! There was a problem:<br>’ ;\n\
    \    foreach ( $errors as $msg )\n    {\n        echo “ - $msg<br>” ;\n    }\n\
    \    echo ‘Please try again or\n<a href=”register.php”>Register</a></p>’ ;\n}\n\
    ?>\n```\n\n![image](images/3b.jpg)Next, add the HTML form that will submit the\
    \ user login details to be processed by a PHP script\n\n```html\n<h1>Login</h1>\n\
    <form action=”login_action.php” method=”POST\">\n<p>\nEmail Address: <input type=”text”\
    \ name=”email\">\n</p><p>\nPassword: <input type=”password” name=”pass\">\n</p><p>\n\
    <input type=”submit” value=”Login” >\n</p>\n</form>\n```\n\n![image](images/4b.jpg)Add\
    \ a final script instruction to include a page footer, then save the script in\
    \ your web server’s `/htdocs` directory as `login.php`\n\n```php\n<?php include\
    \ ( ‘includes/footer.html’ ) ; ?>\n```\n\n![image](images/forget.jpg)\n\nThe `$errors`\
    \ array will only be set by the PHP handler script after the form has been submitted\
    \ when login fails.\n\n![image](images/5b.jpg)Click the hyperlink on the registration\
    \ page, or enter the location `http://localhost/login.php` into your web browser’s\
    \ address field, to see Abyss serve up the Login page\n\n![image](images/pg149_1.jpg)\n\
    \nWhen the login form is submitted, a validation function must ensure the fields\
    \ are not empty then seek their input values in the “users” database table.\n\n\
    If the submitted values are found, the login attempt succeeds, so the corresponding\
    \ user id, first name, and last name, can be retrieved from the “users” table,\
    \ and a further function can be called to load a Home page in the browser.\n\n\
    If the submitted values are not found, the login attempt fails and the validation\
    \ function will simply set a descriptive error message.\n\nThese two functions,\
    \ to validate form fields and to load a new page, can usefully be created as login\
    \ “tools” within an independent PHP script, so they may be readily called from\
    \ the script nominated to handle the Login page form and by other PHP scripts\
    \ as the user navigates to other pages in the website.\n\n![image](images/snake.jpg)\n\
    \nClicking the Login button before the PHP handler script has been created will\
    \ simply produce an HTTP 404 Page Not Found error.\n\n![image](images/hot.jpg)\n\
    \nCreate functions in independent PHP scripts for modularity if they can be useful\
    \ to multiple pages across a website.\n\n## Supplying login tools\n\nHaving completed\
    \ the user login form, described [here on pages 148-149](#chapter08.html#sec72),\
    \ you can now create the login tools that will validate login attempts and load\
    \ a new page when required. These tools can be easily made available to other\
    \ pages on the website, simply by inserting a PHP require statement in them naming\
    \ this script.\n\n![image](images/pg150_1.jpg)\n\n`login_tools.php`\n\n![image](images/1b.jpg)Launch\
    \ a plain text editor and begin a PHP script with a function block to load a page\
    \ specified as its argument\n\n```php\n<?php\nfunction load( $page = ‘login.php’\
    \ )\n{\n    # Statements to be inserted here (Steps 2-4).\n}\n```\n\n![image](images/2b.jpg)Now,\
    \ in the `load` function block, insert a statement to build a URL string of protocol,\
    \ current domain, and directory\n\n```php\n$url = ‘http://’ . $_SERVER['HTTP_HOST’]\
    \ .\ndirname( $_SERVER['PHP_SELF'] ) ;\n```\n\n![image](images/3b.jpg)Next, in\
    \ the `load` function block, insert statements to remove any trailing slashes\
    \ from the URL string, then append a forward slash and the specified page argument\n\
    \n```php\n$url = rtrim( $url , ‘/’ ) ;\n$url .= ‘/’ . $page ;\n```\n\n![image](images/4b.jpg)Finally,\
    \ in the `load` function block, insert statements to load the specified page then\
    \ quit the script\n\n```php\nheader( “Location: $url” ) ;\nexit() ;\n```\n\n![image](images/5b.jpg)Add\
    \ a function block to validate the user login details as correct, or supply error\
    \ messages\n\n```php\nfunction validate( $dbc, $email = '', $pwd = '' )\n{\n \
    \   // Statements to be inserted here (Steps 6-10).\n}\n```\n\nIn the `validate`\
    \ function block, insert a statement to initialize an array for error messages\n\
    \n```php\n$errors = array();\n```\n\n![image](images/6b.jpg)Assign the name of\
    \ the `load` function to the default page if no page is specified by the caller.\n\
    \nThe existence of the `load` function may add trailing slashes to the URL string,\
    \ so these must be removed before appending the page.\n\n![image](images/7b.jpg)Next,\
    \ insert statements to store an error message if the email field remains empty\n\
    \n```php\nif ( empty( $email ) )\n{\n    $errors[] = ‘Enter email address.’ ;\n\
    }\nelse\n$e = mysqli_real_escape_string($dbc, trim($email)) ;\n```\n\n![image](images/8b.jpg)Now,\
    \ insert statements to store an error message if the password field remains empty\n\
    \n```php\nif ( empty( $pwd ) )\n{\n    $errors[] = ‘Enter password.’ ;\n}\nelse\n\
    $p = mysqli_real_escape_string($dbc, trim($pwd)) ;\n```\n\n![image](images/9b.jpg)If\
    \ the email and password are not found in the database, return the associated\
    \ user ID, first name, and last name to the caller\n\n```php\nif ( empty( $errors\
    \ ) )\n{\n    $q = “SELECT user_id, first_name, last_name\n    FROM users\n  \
    \  WHERE email = ‘$e’\n    AND pass = SHA2( ‘$p’, 256 ) ” ;\n    $r = mysqli_query\
    \ ( $dbc , $q ) ;\n    if ( mysqli_num_rows( $r ) == 1 )\n    {\n        $row\
    \ = mysqli_fetch_array ( $r , MYSQLI_ASSOC ) ;\n        return array( true , $row\
    \ ) ;\n    }\n    else\n    { $errors[] = ‘Email address and password not found.’\
    \ }\n}\n```\n\n![image](images/10b.jpg)Finally, insert a statement in the `validate`\
    \ function to return the list of error messages if the login attempt fails\n\n\
    ```php\nreturn array( false , $errors );\n```\n\n![image](images/11b.jpg)Be sure\
    \ to now save this script in your web server’s `/htdocs` directory as `login_tools.php`\n\
    \n![image](images/hot.jpg)\n\nFor stability you should use the `mysqli_real_escape_string()`\
    \ function to escape any unexpected characters.\n\n![image](images/snake.jpg)\n\
    \nThe registration process stored the user password in encrypted format using\
    \ the MySQL `SHA2()` function (see [here page 116](#chapter06.html#sec57)) – so\
    \ the SELECT comparison must also use that function.\n\n## Processing login attempts\n\
    \nHaving completed the login form and the login tools, described [here on pages\
    \ 148-151](#chapter08.html#sec72), you can now create the PHP script to actually\
    \ process login attempts. When a login attempt succeeds, this script will set\
    \ user details retrieved from the database as session data – so the logged-in\
    \ user can be easily recognized as they navigate between other pages of the same\
    \ website.\n\n![image](images/pg152_1.jpg)\n\n`login_action.php`\n\n![image](images/1b.jpg)Launch\
    \ a plain text editor and begin a PHP script with a test block to see if the login\
    \ form has been submitted\n\n```php\n<?php\nif ( $_SERVER['REQUEST_METHOD'] ==\
    \ ‘POST’ )\n{\n    # Statements to be inserted here (Steps 2-6).\n}\n```\n"
