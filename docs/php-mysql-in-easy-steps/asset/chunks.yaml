  trans: "\n\n![image](img/2b.jpg)现在，插入一条语句打开数据库连接\n\n```php\nrequire ( ‘../connect_db.php’\
    \ ) ;\n```\n\n![image](img/3b.jpg)接下来，插入一条语句使登录工具可用\n\n```php\nrequire ( ‘login_tools.php’\
    \ ) ;\n```\n\n![image](img/4b.jpg)插入一条语句确保登录成功，并获取关联的 ID、名和姓的用户详情\n\n```php\n\
    list ( $check , $data ) = validate ( $dbc , $_POST['email'] , $_POST['pass'] )\
    \ ;\n```\n\n![image](img/5b.jpg)现在，插入语句将用户详情设置为会话数据并加载首页，或者分配错误消息\n\n```php\n\
    if ( $check )\n{\n    session_start() ;\n    $_SESSION['user_id'] = $data['user_id']\
    \ ;\n    $_SESSION['first_name'] = $data['first_name'] ;\n    $_SESSION['last_name']\
    \ = $data['last_name'] ;\n    load ( ‘home.php’ ) ;\n}\nelse { $errors = $data\
    \ ; }\n```\n\n![image](img/6b.jpg)接下来，插入一条语句关闭数据库连接\n\n```php\nmysqli_close( $dbc\
    \ ) ;\n```\n\n![image](img/forget.jpg)\n\n你的 `validate()` 登录工具函数返回一个数组，其元素由 PHP\
    \ `list()` 函数赋值给单独变量。\n\n![image](img/hot.jpg)\n\n将用户详情存储为服务器端会话数据比存储为用户可以选择禁用的客户端“cookies”更优。\n\
    \n![image](img/7b.jpg)最后，在测试块之后，添加一条语句在登录失败时继续显示登录页\n\n```php\ninclude ( ‘login.php’\
    \ ) ;\n```\n\n![image](img/8b.jpg)将此脚本保存到 Web 服务器的 `/htdocs` 目录下并命名为 `login_action.php`，然后在浏览器地址栏中输入登录页位置\
    \ `http://localhost/login.php`，并尝试使用错误的用户详情登录\n\n![image](img/pg153_1.jpg)\n\n\
    ![image](img/pg153_2.jpg)\n\n![image](img/snake.jpg)\n\n此登录表单不是“粘性”表单——因此表单提交后输入的用户详情不会保留。\n\
    \n![image](img/hot.jpg)\n\n`login_tools.php` 中的 `validate()` 函数设置了此处显示的错误消息——因此当被\
    \ `login_action.php` 中的 `include` 语句加载时，它会被显示。\n\n## 确认登录成功\n\n在完成实际处理登录尝试的 PHP\
    \ 脚本（详见第 152-153 页）后，你现在可以创建一个在登录成功时加载的首页。通常，这将包含超链接，允许用户在网站的其他页面之间导航。\n\n![image](img/pg154_1.jpg)\n\
    \n### home.php\n\n![image](img/1b.jpg)启动一个纯文本编辑器，并从允许访问会话数据的语句开始 PHP 脚本\n\n```php\n\
    <?php\nsession_start() ;\n```\n\n![image](img/2b.jpg)现在，添加语句如果用户尚未登录，则将浏览器重定向到登录页\n\
    \n```php\nif ( !isset( $_SESSION['user_id']) )\n{\n    require ( ‘login_tools.php’\
    \ ) ;\n    load() ;\n}\n```\n\n![image](img/3b.jpg)接下来，添加语句设置页面标题并包含页面页眉\n\n```php\n\
    $page_title = ‘Home’ ;\ninclude ( ‘includes/header.html’ ) ;\n```\n\n![image](img/4b.jpg)添加一条语句确认具名用户已登录\n\
    \n```php\necho “<h1>HOME</h1>\n<p>You are now logged in,\n{ $_SESSION['first_name']\
    \ } { $_SESSION['last_name'] }\n</p>” ;\n```\n\n![image](img/5b.jpg)现在，添加语句创建指向此网站其他页面的超链接\n\
    \n```php\necho ‘<p>\n<a href=”forum.php”>Forum</a> |\n<a href=”shop.php”>Shop</a>\
    \ |\n<a href=”goodbye.php”>Logout</a>\n</p> ’ ;\n```\n\n![image](img/6b.jpg)添加最后一条语句包含页面页脚\n\
    \n```php\ninclude ( ‘includes/footer.html’ ) ;\n?>\n```\n\n![image](img/forget.jpg)\n\
    \n在完成登录过程在此期间会话变量会被设置之前，无法访问首页。\n\n![image](img/7b.jpg)将此脚本保存到 Web 服务器的 `/htdocs`\
    \ 目录下并命名为 `home.php`，然后在浏览器地址栏中输入登录页位置 `http://localhost/login.php`，并尝试使用正确的用户详情登录\n\
    \n![image](img/pg155_1.jpg)\n\n![image](img/pg155_2.jpg)\n\n![image](img/hot.jpg)\n\
    \n首页上的超链接将在本书接下来的两个章节中演示 PHP 论坛和电子商务。\n\n## 总结\n\n- 用户详情可以存储在 MySQL 数据库表中，以便后续访问网站时进行比较。\n\
    - MySQL 数据库表可能会存储 ID、电子邮件地址、密码和注册日期。\n- 典型的注册表单可能会请求用户的姓名、电子邮件地址，以及他们选择的密码。\n\
    - 注册表单应通过 `POST` 方法提交，并指定 PHP 脚本的名称作为其操作。\n- 处理注册尝试的 PHP 脚本应首先确保所有字段数据都是有效的，并在失败时提供错误消息。\n\
    - 当所有注册数据有效时，处理注册尝试的 PHP 脚本可以将提交的数据存储在 MySQL 数据库表中。\n- 登录工具可以包含在单独的 PHP 脚本中，以便网站的其他页面可以使用。\n\
    - 当所有登录数据有效且在数据库中找到用户时，处理登录尝试的 PHP 脚本可以将用户详情设置为会话数据，以便用户在网站的其他页面之间导航时能被识别。\n\n\
    # 9 提供论坛\n\n***本章基于上一章的内容，演示如何创建一个简单的论坛应用程序。***\n\n## 创建论坛数据库\n\n用户消息可以通过 PHP\
    \ 脚本存储在 MySQL 数据库表中，以便后续检索并显示在论坛页。通常，包含发布的用户消息的数据库表可能会存储帖子 ID、用户的名和姓、主题、消息本身以及发布日期：\n\
    \n| 列名: | 内容类型: | 示例: |\n| --- | --- | --- |\n| **post_id** | 数字 | 123 |\n| **first_name**\
    \ | 文本 | Mike |\n| **last_name** | 文本 | McGrath |\n| **subject** | 文本 | Ice Cream\
    \ |\n| **message** | 文本 | Delicious on a hot day. |\n| **post_date** | 日期/时间 |\
    \ 2018-05-14 12:30:00 |\n\n此数据库表的设计仅要求为存储文本的列指定 `VARCHAR` 或 `TEXT` 数据类型。帖子 ID\
    \ 应该是正的（`UNSIGNED`）`INT` 值，由表通过 `AUTO_INCREMENT` 自动分配，消息发布时间戳应存储为 `DATETIME` 值。所有这些项目对于向数据库发布消息都是必需的，因此每一列都必须具有\
    \ `NOT NULL` 规则。\n\n"
- fmt: "\nThe SQL command required to produce this design as a MySQL database table\
    \ named “forum” can be issued at the prompt in the MySQL Command Line Client.\
    \ Alternatively, the SQL command can be saved in an SQL file, which can be implemented\
    \ at the MySQL Command Line Client prompt by issuing the `SOURCE` command followed\
    \ by the path to the SQL file on your system.\n\n![image](images/forget.jpg)\n\
    \nMySQL database tables can only be created by the root MySQL user or other MySQL\
    \ user that has been granted full access privileges.\n\n![image](images/pg159_1.jpg)\n\
    \n`create_forum.sql`\n\n![image](images/1r.jpg)Launch a plain text editor and\
    \ create an SQL command describing the table requirements shown opposite\n\n```sql\n\
    CREATE TABLE IF NOT EXISTS forum (\npost_id INT UNSIGNED NOT NULL AUTO_INCREMENT\
    \ ,\nfirst_name VARCHAR(20) NOT NULL,\nlast_name VARCHAR(40) NOT NULL,\nsubject\
    \ VARCHAR(60) NOT NULL,\nmessage TEXT NOT NULL,\npost_date DATETIME NOT NULL,\n\
    PRIMARY KEY ( post_id ) ) ;\n```\n\n![image](images/2r.jpg)Save the file in a\
    \ folder at `C:\\SQL` as `create_forum.sql`, then launch the MySQL Command Line\
    \ Client and log in as a user with full access privileges, such as the root user\n\
    \n![image](images/3r.jpg)Next, issue a command to use the established database\n\
    \n`USE site_db ;`\n\n![image](images/4r.jpg)Now, implement the SQL command by\
    \ stating the source path to the SQL file on your system\n\n`SOURCE C:\\SQL\\\
    create_forum.sql`\n\n![image](images/5r.jpg)Finally, issue a command to confirm\
    \ the table format\n\n`EXPLAIN forum ;`\n\n![image](images/pg159_2.jpg)\n\n![image](images/hot.jpg)\n\
    \nThe MySQL `TEXT` data type accommodates up to 65,535 characters. Larger messages\
    \ can be accommodated with `MEDIUMTEXT` and `LONGTEXT` data types.\n\n## Providing\
    \ a forum page \n\nTypically, a message board page displaying posted forum messages\
    \ might only be available to registered users. The PHP script providing this page\
    \ can check that the user is registered by testing the session data, and redirect\
    \ to the Login page when this test fails. When the test succeeds, previous posted\
    \ messages can be retrieved from the MySQL forum database table for display on\
    \ the page, or the script can simply advise that there are currently no messages.\
    \ Forum messages can be displayed between page header and footers together with\
    \ a hyperlink to another page where the current user can post a new forum message.\n\
    \n![image](images/pg160_1.jpg)\n\n`forum.php`\n\n![image](images/1r.jpg)Launch\
    \ a plain text editor and begin a PHP script with a statement to allow access\
    \ to session data\n\n```php\n<?php\nsession_start() ;\n```\n\n![image](images/2r.jpg)Now,\
    \ add statements to redirect the browser to the Login page if the user is not\
    \ already logged in\n\n```php\nif ( !isset($_SESSION['user_id']) ) )\n{\n    require\
    \ ( ‘login_tools.php’ ;\n    load() ;\n}\n```\n\n![image](images/3r.jpg)Next,\
    \ add statements to set the page title and include a page header\n\n```php\n$page_title\
    \ = ‘Forum’ ;\ninclude ( ‘includes/header.html’ ) ;\n```\n\n![image](images/4r.jpg)Add\
    \ a statement to open the database connection\n\n```php\nrequire ( '../connect_db.php’\
    \ ) ;\n```\n\n![image](images/5r.jpg)Now, add statements to retrieve messages\
    \ from the database or provide a default message\n\n```php\n$q = “SELECT * FROM\
    \ forum” ;\n$r = mysqli_query( $dbc , $q ) ;\nif ( mysqli_num_rows( $r ) > 0 )\n\
    {\n    # Statements to be inserted here (Step 6).\n}\nelse\n{ echo ‘<p>There are\
    \ currently no messages.</p>’ ; }\n```\n\n![image](images/forget.jpg)\n\nThe Forum\
    \ page cannot be reached until completing the login process, during which the\
    \ session variable gets set.\n\n![image](images/6r.jpg)Next, insert statements\
    \ to write a table displaying all messages retrieved from the database table if\
    \ any found\n\n```php\necho ‘<table><tr><th>Posted By</th>\n<th>Subject</th><th\
    \ id=”msg”>Message</th></tr>’;\nwhile ( $row = mysqli_fetch_array( $r , MYSQLI_ASSOC\
    \ ) )\n{\n    echo ‘<tr>\n<td>’.$row['first_name’].’ ‘.$row['last_name’].‘<br>’\n\
    .$row['post_date’].’</td>\n<td>’.$row['subject’].‘</td><td>’.$row['message’].‘</td>\n\
    </tr>’;\n}\necho ‘</table>’ ;\n```\n\n![image](images/7r.jpg)Add a statement to\
    \ create hyperlinks to other pages on this website, including a “Post Message”\
    \ page\n\n```php\necho ‘<p>\n<a href=”post.php”>Post Message</a> |\n<a href=”shop.php”>Shop</a>\
    \ |\n<a href=”home.php”>Home</a> |\n<a href=”goodbye.php”>Logout</a></p>’ ;\n\
    ```\n\n![image](images/8r.jpg)Now, add a statement to close the database connection\n\
    \n```php\nmysqli_close( $dbc ) ;\n```\n\n![image](images/9r.jpg)Add a final statement\
    \ to include a page header\n\n```php\ninclude ( ‘includes/footer.html’ ) ; ?>\n\
    ```\n\n![image](images/10r.jpg)Save this script in your web browser’s hdocs as\
    \ `forum.php`, then log in and follow the link on the Forum page to this `forum.php`.\
    \ The cells on a table will allow the user to post messages. This page provides\
    \ a hyperlink back to the Forum page, should the user wish to return there.\n"
  raw: 'The SQL command required to produce this design as a MySQL database table
    named “forum” can be issued at the prompt in the MySQL Command Line Client. Alternatively,
    the SQL command can be saved in an SQL file, which can be implemented at the MySQL
    Command Line Client prompt by issuing the SOURCE command followed by the path
    to the SQL file on your system.


    ![image](images/forget.jpg)


    MySQL database tables can only be created by the root MySQL user or other MySQL
    user that has been granted full access privileges.


    ![image](images/pg159_1.jpg)


    create\_forum.sql


    ![image](images/1r.jpg)Launch a plain text editor and create an SQL command describing
    the table requirements shown opposite


    CREATE TABLE IF NOT EXISTS forum (


    post\_id INT UNSIGNED NOT NULL AUTO\_INCREMENT ,


    first\_name VARCHAR(20) NOT NULL ,


    last\_name VARCHAR(40) NOT NULL ,


    subject VARCHAR(60) NOT NULL ,


    message TEXT NOT NULL ,


    post\_date DATETIME NOT NULL ,


    PRIMARY KEY ( post\_id ) ) ;


    ![image](images/2r.jpg)Save the file in a folder at C:\\SQL as create\_forum.sql,
    then launch the MySQL Command Line Client and log in as a user with full access
    privileges, such as the root user


    ![image](images/3r.jpg)Next, issue a command to use the established database


    USE site\_db ;


    ![image](images/4r.jpg)Now, implement the SQL command by stating the source path
    to the SQL file on your system


    SOURCE C:\\SQL\\create\_forum.sql


    ![image](images/5r.jpg)Finally, issue a command to confirm the table format


    EXPLAIN forum ;


    ![image](images/pg159_2.jpg)


    ![image](images/hot.jpg)


    The MySQL **TEXT** data type accommodates up to 65,535 characters. Larger messages
    can be accommodated with **MEDIUMTEXT** and **LONGTEXT** data types.


    **Providing a forum page**


    Typically, a message board page displaying posted forum messages might only be
    available to registered users. The PHP script providing this page can check that
    the user is registered by testing the session data, and redirect to the Login
    page when this test fails. When the test succeeds, previous posted messages can
    be retrieved from the MySQL forum database table for display on the page, or the
    script can simply advise that there are currently no messages. Forum messages
    can be displayed between page header and footers together with a hyperlink to
    another page where the current user can post a new forum message.


    ![image](images/pg160_1.jpg)


    forum.php


    ![image](images/1r.jpg)Launch a plain text editor and begin a PHP script with
    a statement to allow access to session data


    **<?php**


    **session\_start() ;**


    ![image](images/2r.jpg)Now, add statements to redirect the browser to the Login
    page if the user is not already logged in


    if ( !isset( $\_SESSION\[ ‘user\_id’ \] ) )


    **{**


    require ( ‘login\_tools.php’ ) ;


    **load() ;**


    **}**


    ![image](images/3r.jpg)Next, add statements to set the page title and include
    a page header


    $page\_title \= ‘Forum’ ;


    include ( ‘includes/header.html’ ) ;


    ![image](images/4r.jpg)Add a statement to open the database connection


    require ( ‘../connect\_db.php’ ) ;


    ![image](images/5r.jpg)Now, add statements to retrieve messages from the database
    or provide a default message


    $q \= “SELECT \* FROM forum” ;


    $r \= mysqli\_query( $dbc , $q ) ;


    if ( mysqli\_num\_rows( $r ) > 0 )


    **{**


    **\# Statements to be inserted here (Step 6).**


    **}**


    **else**


    { echo ‘<p>There are currently no messages.</p>’ ; }


    ![image](images/forget.jpg)


    The Forum page cannot be reached until completing the login process, during which
    the session variable gets set.


    ![image](images/6r.jpg)Next, insert statements to write a table displaying all
    messages retrieved from the database table if any found


    echo ‘<table><tr><th>Posted By</th>


    <th>Subject</th><th id=”msg”>Message</th></tr>’;


    while ( $row \= mysqli\_fetch\_array( $r , MYSQLI\_ASSOC ) )


    **{**


    echo ‘<tr>


    <td>’.$row\[‘first\_name’\].’ ‘.$row\[‘last\_name’\].‘<br>’


    .$row\[‘post\_date’\].’</td>


    <td>’.$row\[‘subject’\].‘</td><td>’.$row\[‘message’\].‘</td>


    </tr>’;


    **}**


    echo ‘</table>’ ;


    ![image](images/7r.jpg)Add a statement to create hyperlinks to other pages on
    this website, including a “Post Message” page


    echo ‘<p>


    <a href=”post.php”>Post Message</a> |


    <a href=”shop.php”>Shop</a> |


    <a href=”home.php”>Home</a> |


    <a href=”goodbye.php”>Logout</a></p>’ ;


    ![image](images/8r.jpg)Now, add a statement to close the database connection


    mysqli\_close( $dbc ) ;


    ![image](images/9r.jpg)Add a final statement to include a page footer


    include ( ‘includes/footer.html’ ) ; ?>


    ![image](images/10r.jpg)Save this script in your web browser’s /htdocs directory
    as forum.php, then log in and follow the link on the Home page to the Forum


    ![image](images/pg161_1.jpg)


    ![image](images/forget.jpg)


    The cells on a table row will be populated by the data contained in the columns
    on a row of the database forum table.


    ![image](images/hot.jpg)


    The hyperlinks on the Forum page will be used to demonstrate PHP e-commerce and
    allow the user to post a message, return to the Home page, or log out.


    **Supplying a message form**


    Having completed the PHP script to display posted forum messages, described [here
    on pages 160-161](#chapter09.html#sec78), you can now create a PHP script to allow
    the user to post new messages. This can check that the user is indeed logged in
    then simply provide a form with fields for the subject title and the message body
    itself.


    ![image](images/pg162_1.jpg)


    post.php


    ![image](images/1r.jpg)Launch a plain text editor and begin a PHP script with
    a statement to allow access to session data


    **<?php**


    **session\_start() ;**


    ![image](images/2r.jpg)Now, add statements to redirect the browser to the Login
    page if the user is not already logged in


    if ( !isset( $\_SESSION\[ ‘user\_id’ \] ) )


    **{**


    require ( ‘login\_tools.php’ ) ;


    **load() ;**


    **}**


    ![image](images/3r.jpg)Next, add statements to set the page title and include
    a page header


    $page\_title \= ‘Post Message’ ;


    include ( ‘includes/header.html’ ) ;


    ![image](images/4r.jpg)Add a statement to display the form


    echo ‘<form action=”post\_action.php” method=”POST”


    accept-charset=”utf-8”>


    <p>Subject:<br>


    <input name=”subject” type=”text” size=”64”></p>


    <p>Message:<br>


    <textarea name=”message” rows=”5” cols=”50”>


    </textarea></p>


    <p><input type=”submit” value=”Submit”></p>


    </form>’ ;


    ![image](images/5r.jpg)Next, add a statement to create hyperlinks to other pages
    on this website


    echo ‘<p>


    <a href=”forum.php”>Forum</a> |


    <a href=”shop.php”>Shop</a> |


    <a href=”home.php”>Home</a> |


    <a href=”goodbye.php”>Logout</a></p>’ ;


    ![image](images/hot.jpg)


    Notice that the form **action** attribute nominates a submission handler named
    **post\_action.php** – this is listed [here on pages 164-165](#chapter09.html#sec80).


    ![image](images/6r.jpg)Add a final statement to include a page footer


    include ( ‘includes/footer.html’ ) ;      ?>


    ![image](images/7r.jpg)Save this script in your web browser’s /htdocs directory
    as post.php, then log in and follow the link on the Forum page to this Post Message
    page


    ![image](images/pg163_1.jpg)


    ![image](images/pg163_2.jpg)


    ![image](images/forget.jpg)


    This page provides a hyperlink back to the Forum page, should the user wish to
    return there.


    **Processing posted messages**


    Having completed the PHP script to supply a form to post new forum messages, described
    [here on pages 162-163](#chapter09.html#sec79), you can now create a PHP script
    to process the submitted messages. This can check that the user is logged in then
    ensure that the subject and message fields are not empty. Once the form input
    is found to be valid, the script can then store the submitted message in the MySQL
    “forum” database table. If the attempt to post the message succeeds, the Forum
    page can be loaded to display the messages, or upon failure an error message can
    be displayed:


    ![image](images/pg164_1.jpg)


    post\_action.php'
