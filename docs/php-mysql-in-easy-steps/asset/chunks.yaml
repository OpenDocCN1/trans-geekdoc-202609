    Each statement in the PHP language must be terminated by a semi-colon – just as
    each statement.


    ## Managing strings


    A “string” of text can be stored in a variable in the same way as a numeric value,
    but the assignment must surround the string with quote marks. Both single and
    double quote marks can be used for this purpose.


    ```php

    $title = “Sumertime Blues” ;

    $title = ‘Sumertime Blues’

    ```


    Where you wish to store a string that itself includes quote marks, you can “escape”
    the included marks by preceding them with a `\` backslash character, or use the
    alternative type of quote mark. For example:


    ```php

    $song_title = “the \"Sumertime\" aria by Gershwin” ;

    $song_title = ‘the “Sumertime” aria by Gershwin’ ;

    ```


    The second technique, using double quote marks within the string, is easier to
    read and is preferred throughout this book.


    String values can be displayed as part of a mixed string by enclosing the mixed
    string in double quotes, like this:


    ```php

    echo “Many regard $song_title as a classic” ;

    ```


    String values can be joined together (“concatenated”) into a single string using
    the `.` concatenation operator, like this:


    ```php

    $hi = ‘Hello’ ;

    $bye = ‘Goodbye’ ;

    $song_title = $hi . $bye ; # ‘HelloGoodbye’

    ```


    Additionally, spaces and punctuation can usefully be inserted when concatenating
    strings, so the title assignment above could be modified to include a comma and
    a space:


    ```php

    $song_title = $hi . ‘‘ . $bye ; # ‘Hello, Goodbye’

    ```


    ![image](images/forget.jpg)


    Variable names cannot contain spaces – but the underscore character is often used
    in their place.


