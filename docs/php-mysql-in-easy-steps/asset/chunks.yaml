    Each of the functions in the table below return TRUE if the data is of a certain
    type, otherwise they return FALSE:


    | **Function:** || **Validates:** || **Example:** |


    | --- | --- | --- |


    | **is\_numeric()** || Number, even as string || **2.0, 20, ‘20’** |


    | **is\_int()** || Integer || **100** |


    | **is\_float()** || Floating-point number || **3.124** |


    | **is\_string()** || String || **‘Hello World!’** |


    | **is\_null()** || Null || **NULL** |


    | **is\_scalar()** || Variable || **$var** |


    | **is\_array()** || Array || **$days** |


    | **is\_bool()** || Boolean || **TRUE** |


    | **is\_resource()** || External Resource || **File Stream** |


    ![image](images/pg132_1.jpg)


    validate.php


    ![image](images/1v.jpg)Create a PHP script that begins by incorporating the standard
    script to establish a connection to a database on the MySQL Server


