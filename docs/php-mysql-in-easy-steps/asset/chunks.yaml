    \ add a statement to redirect the browser to the Login page if the user is not\
    \ already logged in\n\n```php\nif ( !isset( $_SESSION['user_id'] ) ) { load()\
    \ ; }\n```\n\n![image](images/4r.jpg)Add statements to set the page title and\
