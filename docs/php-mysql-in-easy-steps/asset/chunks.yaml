  trans: "\n\n![image](img/pg79_2.jpg)\n\n![image](img/snake.jpg)\n\nPHP 还提供了一个 `$_REQUEST`\
    \ 超全局变量，它包含了 `$_POST` 和 `$_GET` 数组的所有内容。这意味着可以使用 `$_REQUEST['city']` 来访问 `$_POST['city']`\
    \ 对应的内容，但应该避免这样做。相反，请始终根据提交类型使用特定的数组。\n\n![image](img/forget.jpg)\n\n注意，传递的 name=value\
    \ 对在浏览器的地址栏中是可见的。\n\n### 移动位置\n\nPHP 提供了一个 `header()` 函数，它接受一个参数来指定要发送到 浏览器的原始\
    \ HTTP “头部”（header）。头部在 Web 服务器发送任何其他数据之前就已发送，并且通常对用户不可见。最有用的是，PHP 的 `header()`\
    \ 函数可以设置“Location”头部将浏览器重定向到新页面，使用此语法：\n\n`header( 'Location: *www.example.com/page.php*'\
    \ ) ;`\n\n在移动到新页面时，可以通过先将数据存储在特殊的 PHP 超全局变量 `$_SESSION` 数组中来保留用户数据。然而，在脚本调用 `session_start()`\
    \ 函数之前，该变量并不会自动可用。变量值可以存储在 `$_SESSION` 数组的同名元素中，这样它们在网站的其他页面上可用，直到用户退出或在脚本中调用\
    \ `session_destroy()` 函数。\n\n![image](img/1p.jpg)创建一个包含 PHP 脚本的 HTML 文档，该脚本在 `$_POST`\
    \ 数组中查找名为“id”的元素\n\n```php\nif ( isset ( $_POST['id'] ) )\n{\n    $id = $_POST['id']\
    \ ;\n    # 在此此处插入处理语句。\n}\n```\n\n![image](img/pg80_1.jpg)\n\nheader.php\n\n![image](img/2p.jpg)接下来，插入处理语句以将匹配的\
