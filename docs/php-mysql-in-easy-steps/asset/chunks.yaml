    \ 中的表单调用，用于处理提交的用户数据消息。\n\n![image](img/6r.jpg)在块中插入语句，将表单数据添加到 MySQL “forum”数据库表中\n\
    \n```php\nif( !empty($_POST['subject'])\n&& !empty($_POST['message']) )\n{\n \
    \   require ( ‘../connect_db.php’ ) ;\n    $q = “INSERT INTO forum (first_name,last_name,subject,message,post_date)\
