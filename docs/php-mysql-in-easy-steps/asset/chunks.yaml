    \ to your cart</p>’ ;\n}\n```\n\n![image](images/8g.jpg)Next, add a statement\
    \ to close the database connection\n\n```php\nmysqli_close( $dbc ) ;\n```\n\n\
    ![image](images/9g.jpg)Now, add a statement to create hyperlinks to other pages\
    \ on the website\n\n```php\necho ‘<p><a href=”shop.php”>Shop</a> | <a href=”cart.php”>View\
    \ Cart</a> | <a href=”forum.php”>Forum</a> | <a href=”home.php”>Home</a> | <a\
    \ href=”goodbye.php”>Logout</a></p>’ ;\n```\n\n![image](images/10g.jpg)Add a final\
    \ statement to include a page footer\n\n```php\ninclude ( ‘includes/footer.html’\
    \ ) ;\n```\n\n![image](images/11g.jpg)Save this script in your web browser’s `/htdocs`\
    \ directory as `added.php`, then add an item to the cart on the Shop page\n\n\
    ![image](images/pg177_1.jpg)\n\n![image](images/hot.jpg)\n\nNotice that the cart\
    \ array quantity is set to 1 and its price is set when the first item with that\
    \ ID gets added, otherwise its quantity is simply incremented by 1.\n\n![image](images/snake.jpg)\n\
    \nReloading this web page in your browser will once more pass the selection to\
    \ the script – increasing its cart quantity again.\n\n# Processing shopping carts\n\
    \nHaving provided a page to confirm addition of a selected item to the shopping\
    \ cart, described [here on pages 176-177](#chapter10.html#sec86), you can now\
    \ create the PHP script that will display a summary of all selections. This will\
    \ use the session data to create a table of selected items and quantities, retrieve\
    \ their associated name and description from the database, calculate a total,\
    \ and allow quantities to be updated.\n\n![image](images/pg178_1.jpg)\n\n### cart.php\n\
    \n![image](images/1g.jpg)Launch a plain text editor and begin a PHP script with\
    \ a statement to allow access to session data\n\n```php\n<?php\nsession_start()\
    \ ;\n```\n\n![image](images/2g.jpg)Now, add statements to redirect the browser\
    \ to the Login page if the user is not already logged in\n\n```php\nif ( !isset(\
    \ $_SESSION['user_id'] ) )\n{\n    require ( ‘login_tools.php’ ) ;\n    load()\
    \ ;\n}\n```\n\n![image](images/3g.jpg)Next, add statements to set the page title\
    \ and include a page header\n\n```php\n$page_title = ‘Cart’ ;\ninclude ( ‘includes/header.html’\
    \ ) ;\n```\n\n![image](images/4g.jpg)Add statements to update the quantities if\
    \ the page has been submitted for amendment\n\n```php\nif ( $_SERVER['REQUEST_METHOD']\
    \ == ‘POST’ )\n{\n    foreach ( $_POST['qty'] as $item_id => $item_qty )\n   \
    \ {\n        # Ensure values are integers.\n        $id = (int) $item_id ;\n \
    \       $qty = (int) $item_qty ;\n        # Change quantity or delete if zero.\n\
    \        if ( $qty== 0 )\n            unset( $_SESSION['cart'][$id] ) ;\n    \
    \    elseif ( $qty > 0 )\n            $_SESSION['cart'][$id]['quantity'] = $qty\
    \ ;\n    }\n}\n```\n\n![image](images/forget.jpg)The user might enter a non-numeric\
    \ value into the quantity field so the script must ensure the quantity field is\
    \ an integer.\n\n![image](images/5g.jpg)Now, initialize a grand total\n\n```php\n\
    $total = 0 ;\n```\n\n![image](images/6g.jpg)Next, add a statement to display the\
    \ contents of shopping cart, or display a message if the cart is empty\n\n```php\n\
    if ( !empty($_SESSION['cart']) )\n{\n    # Statements to be inserted here (Steps\
    \ 7-11).\n}\nelse\n{ echo ‘<p>Your cart is currently empty.</p>’ }\n```\n\n![image](images/7g.jpg)Insert\
    \ a first statement to open the database connection\n\n```php\nrequire ( '../connect_db.php'\
    \ ) ;\n```\n\n![image](images/8g.jpg)Next, insert statements to retrieve data\
    \ from the “shop” database for all associated items in shopping cart\n\n```php\n\
    $q = “SELECT \\* FROM shop WHERE item\\_id IN (“ ;\nforeach ($_SESSION['cart']\
    \ as $id => $value)\n{ $q .= $id . ‘,’ }\n$q = substr( $q , 0 , -1 ) . ‘) BY item_id\
    \ ASC’ ;\n$r = mysqli_query( $dbc , $q ) ;\n```\n\n![image](images/9g.jpg)Now,\
    \ insert statements to display the cart selections in a form that contains a table\n\
    \n```php\necho ‘<form action=”cart.php” method=”POST” ><table>\n<tr><th colspan=”5”>Items\
    \ in your cart</th></tr><tr>’ ;\nwhile ( $row = mysqli_fetch_array ( $r , MYSQLI_ASSOC\
    \ ) )\n{\n    # Calculate sub-totals and grand total.\n    $subtotal = $_SESSION['cart'][$id]['quantity']\
    \ * $_SESSION['cart'][$id]['price'] ;\n    $total += $subtotal ;\n    # Display\
    \ the row.\n    echo “<tr> <td>{$row['item_name']}</td><td>{$row['item_desc']}</td><td><input\
    \ type=”text” size=”3” name=”qty[{$row['item_id']}]” value=”{$SESSION['cart'][$row['item_id']]['quantity']}”></td><td>@\
    \ {$row['item_price']} </td><td>”.number_format( $subtotal , 2 ).”</td></tr>”\
    \ ;\n}\n```\n\n![image](images/hot.jpg)The `foreach` loop adds each item ID plus\
    \ a comma to the query, and the `substr()` function removes the final comma. The\
    \ SQL `ORDER BY` clause will ensure the selected items are displayed in the order\
    \ of their number ID.\n\n![image](images/10g.jpg)Insert a statement to display\
    \ the grand total at the end of the table and a submit button at the end of the\
    \ form\n\n```php\necho ‘ <tr><td colspan=”5”>Total =.number_format( $total , 2\
    \ ).’</td></tr>\n</table>\n<input type=”submit” value=”Update My Cart”>\n</form>’\
    \ ;\n```\n\n![image](images/11g.jpg)Now, insert a statement to close the database\
    \ connection\n\n```php\nmysqli_close( $dbc ) ;\n```\n\n![image](images/12g.jpg)Add\
    \ a statement to create hyperlinks to other pages on the website, including a\
    \ “Checkout” page that appends the grand total to the URL\n\n```php\necho ‘<p><a\
    \ href=”shop.php”>Shop</a> | <a href=”checkout.php?total='.$total.’”>Checkout</a>\
    \ | <a href=”forum.php”>Forum</a> | <a href=”home.php”>Home</a> | <a href=”goodbye.php”>Logout</a></p>’\
    \ ;\n```\n\n![image](images/13g.jpg)Add a final statement to include a page footer\n\
    \n```php\ninclude ( ‘includes/footer.html’ ) ;\n```\n\n![image](images/14g.jpg)Save\
    \ this script in your web browser’s `/htdocs` directory as `cart.php`, then select\
    \ items on the Shop page and view the cart to see the selection details and values\n\
    \n![image](images/pg180_1.jpg)\n\n![image](images/forget.jpg)\n\nAppending the\
    \ total value to the Checkout page URL enables that page to confirm that the cart\
    \ is not empty.\n\n![image](images/15g.jpg)Now, change the value in the quantity\
    \ field of one of the items and click the Update button to see the revised cart\n"
