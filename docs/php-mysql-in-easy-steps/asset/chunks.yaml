    \ the value of each array element\n\n```php\necho ‘<dt>Do While Loop : ’ ;\n$i\
    \ = 0 ;\ndo\n{\necho “<dd>Element $i = $numbers[$i] ” ;\n$i++ ;\n}\nwhile ( $i\
    \ < 3 ) ;\n```\n\n![image](images/4g.jpg)Save the document in your web browser’s\
    \ `/htdocs` directory as `whileloop.php`, then open the page via HTTP to see the\
