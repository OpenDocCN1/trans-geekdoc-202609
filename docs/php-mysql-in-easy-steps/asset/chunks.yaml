    ## 比较


    与 PHP 一样，MySQL 拥有内置运算符和函数，可以用于对数据库中存储的数据进行快速过滤。强烈建议使用这些功能，因为比让 SQL 查询检索所有数据后再由
    PHP 进行过滤效率更高。MySQL 可用的比较运算符列如下：


    | 运算符: | 说明: |

    | --- | --- |

    | = | 等于 |

    | != | 不等于 |

    | < | 小于 |

    | <= | 小于或等于 |

    | > | 大于 |

    | >= | 大于等于 |

    | `BETWEEN` min `AND` max | 在 min 到 max 范围内 |

    | `IS NULL` | 为空值 |

    | `IS NOT NULL` | 不为空值 |


    比较运算符用于带有 `WHERE` 子句的查询中，以测试特定条件是否满足。当评估结果为 TRUE 时，查询将返回数据，否则将不返回任何内容。有用的是，内置
    `NOW()` 函数返回 `YYYY-MM-DD HH:MM:SS` 格式的当前日期时间，提供了访问数据库的时间戳。此外，内置的 `SHA2()` 加密函数允许安全地存储密码。它接受两个参数，指定密码和哈希长度以返回
    224、256、384 或 512 位（返回 64 个字符）。


