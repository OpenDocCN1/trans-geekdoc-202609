  trans: "\n`while` 循环和 `do while` 循环都会持续迭代，直到测试表达式的结果为 `FALSE`（假），此时循环将退出。因此，循环体必须包含在某个时刻改变测试表达式评估结果的代码——否则将创建一个导致系统锁定的死循环。\n\
    \n`while` 循环和 `do while` 循环之间的显著区别在于，如果测试表达式在第一次求值时为 `FALSE`，`while` 循环将不会执行任何迭代。相比之下，`do\
    \ while` 循环至少会执行一次，因为它的语句是在评估之前执行的。如果这是你需要的，那么 `do while` 循环显然是最佳选择；否则在 `for`\
    \ 循环和 `while` 循环之间的选择很大程度上取决于个人喜好。经验法则建议 `for` 循环最适合执行指定次数的迭代，而 `while` 循环适合迭代直到满足特定条件。\n\
    \n循环是数组的完美搭档，因为每次迭代都可以轻松地读取或写入连续的数组元素。\n\n![image](img/snake.jpg)\n\n确保循环结构中的测试表达式会在某时刻变为\
    \ `FALSE`，以避免创建永不结束的死循环。\n\n![image](img/hot.jpg)\n\n你将在本书后面部分发现如何使用 PHP `while`\
    \ 循环从 MySQL 数据库中检索记录。\n\n![image](img/pg53_1.jpg)\n\nwhileloop.php\n\n![image](img/1g.jpg)用创建一个数组的语句开始\
    \ PHP 脚本\n\n```php\n$numbers = array( 10 , 20 , 30 ) ;\n```\n\n![image](img/2g.jpg)接下来，添加一个\
    \ `while` 循环输出每个数组元素的值\n\n```php\necho ‘<dt>While Loop : ’ ;\n$i = 0 ;\nwhile\
    \ ( $i < 3 )\n{\necho “<dd>Element $i = $numbers[$i] ” ;\n$i++ ;\n}\n```\n\n![image](img/3g.jpg)现在，添加一个\
    \ `do while` 循环输出每个数组元素的值\n\n```php\necho ‘<dt>Do While Loop : ’ ;\n$i = 0 ;\n\
    do\n{\necho “<dd>Element $i = $numbers[$i] ” ;\n$i++ ;\n}\nwhile ( $i < 3 ) ;\n\
    ```\n\n![image](img/4g.jpg)将文档保存在网页浏览器的 `/htdocs` 目录下并命名为 `whileloop.php`，然后通过\
    \ HTTP 打开页面，查看数组元素的值是否相同地显示\n\n![image](img/pg53_2.jpg)\n\n![image](img/forget.jpg)\n\
    \n将此测试表达式中的值改为零，以便两个循环中的 `while ( $i = 0 )` 仅执行 `do while` 循环的第一次迭代。\n\n### 退出循环\n\
    \n`break` 关键字可以在满足指定条件时提前终止循环。`break` 语句位于循环语句块内部，前面有一个测试表达式。当测试返回 `TRUE`（真）时，循环立即结束，程序继续执行下一个任务。例如，在嵌套内部循环中，它会进入下一次迭代。\n\
    \n![image](img/pg54_1.jpg)\n\nbreakcontinue.php\n\n![image](img/1g.jpg)用一个执行三次迭代的\
