  **添加修饰符**\n\n除了指定允许的数据类型外，结合上一页的关键字，可以使用下表的修饰关键字来进一步控制列内容：\n\n| Modifier: | Purpose:\
  \ |\n| --- | --- |\n| NOT NULL | 强制每条记录必须在该列中包含数据值 |\n| UNIQUE | 强制记录不得重复该列中的任何输入\
  \ |\n| AUTO_INCREMENT | 仅适用于数值列，自动生成比该列上一个值大 1 的数字 |\n| DEFAULT | 在插入记录时未说明此列值时，指定使用的值\
  \ |\n| PRIMARY KEY | 指定列或多个列作为该表的主键 |\n\n\n\n\n当某个记录必须包含某列的值时，该列应定义为 `NOT NULL`\
  \ 修饰符。这允许在其中存储空字符串 `\"\"`，但不允许该列为空或为 `NULL`。当列中存储的数据永远不应重复时，该列应定义为 `UNIQUE` 修饰符。例如，为了避免产品代码的意外重复。`AUTO_INCREMENT`\
  \ 修饰符对于每行自动生成递增标识符特别有用——第一行编号为 1，第二行编号为 2，依此类推。设置列的 `DEFAULT` 允许插入记录，而无需繁琐地为通常不变的列提供值。例如，“quantity”列在每条记录中通常包含值\
  \ 1——因此可以将 1 设置为它的默认值。\n\n对应的列出的 SQL 脚本创建了一个表，其列定义使用了修饰符来控制允许的内容。“id”列自动为每行编号，“quantity”列在插入其他值之前将包含\
  \ 1。所有其他所有列都必须包含值——它们不能为空或为 `NULL`。\n\n![image](img/hot.jpg)\n\n`PRIMARY KEY` 修饰符在此处第\
  \ 92 页有更详细描述。\n\n![image](img/1o.jpg)启动一个纯文本编辑器（如记事本），并创建一个查询来定义具有各种修饰符列的表\n\n```sql\n\
