  \n你可以将所有数量更改为零并点击“更新”（Update）按钮查看默认的空购物车消息。\n\n## 结算订单\n\n在制作了此处第 174-181 页 描述的购物车页面后，你现在可以创建一个\
  \ PHP 脚本来处理用户选择的项目并作为一个“结账”订单。这是购物车流程的终点，它将购物车的选择存储在“order”和 `order_contents` 数据库表中，以供供应商后续履行订单。\n\
  \n![image](img/pg182_1.jpg)\n\n### checkout.php\n\n![image](img/1g.jpg)启动一个纯文本编辑器，并使用语句开始\
