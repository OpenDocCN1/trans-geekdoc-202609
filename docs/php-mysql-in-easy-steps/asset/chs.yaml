  ![image](img/5v.jpg)你也可以使用 `mysqli_num_rows()` 函数来分页结果。\n\n### 更新记录\n\n`mysqli_affected()`\
  \ 函数返回一个整数，受 `INSERT`、`UPDATE` 或 `DELETE` 查询影响的行数。与接受结果集作为参数的 `mysqli_num_rows()`\
  \ 函数不同，`mysqli_affected()` 函数接受数据库连接作为参数：\n\n```php\n$num_affected = mysqli_affected(\
  \ $dbc );\n```\n\nupdate.php\n\n![image](img/1v.jpg)创建一个 PHP 脚本，开头引入标准脚本以建立与 MySQL\
  \ Server 上的数据库的连接\n\n```php\n<?php\nrequire ( '../connect_db.php' );\n```\n\n![image](img/2v.jpg)\
  \ 接下来，添加一个函数来显示现有表中的所有记录，或显示错误\n\n```php\nfunction show_records( $dbc )\n{\n   \
  \ $q = 'SELECT * FROM prints';\n    $r = mysqli_query( $dbc , $q );\n    $num =\
  \ mysqli_num_rows( $r );\n    if ( $num > 0 )\n    {\n        echo '<h1>Records\
  \ in prints table</h1>';\n        while ( $row = mysqli_fetch_array( $r , MYSQLI_ASSOC\
  \ ) )\n        {\n            echo '<br>' . $row['id'] . ' | ' . $row['name'] .\n\
  \            ' @ ' . $row['price'];\n        }\n    }\n    else { \n        echo\
  \ '<p>' . mysqli_error( $dbc ) . '</p>'; \n    }\n}\n```\n\n![image](img/3v.jpg)现在，调用该函数显示所有记录\n\
  \n```php\nshow_records( $dbc );\n```\n\n![image](img/4v.jpg)创建并执行另一个查询以更新表中具有特定值的（两条）记录\n\
  \n```php\n$q = 'UPDATE watches SET style = “Gents” WHERE style = “Ladies” ';\n$r\
  \ = mysqli_query( $dbc , $q );\n```\n\n![image](img/5v.jpg)如果预期的记录已更新，再次调用该函数显示所有记录\n\
  \n```php\nif( mysqli_affected( $dbc ) == 2 )\n{\n    echo '<hr>' . mysqli_affected(\
