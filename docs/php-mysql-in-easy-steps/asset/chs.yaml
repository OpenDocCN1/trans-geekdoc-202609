  \n此图右侧的列标题为“Extra”，并注明了 `auto_increment` 修饰符。\n\n## 设置主键\n\n`PRIMARY KEY`（主键）是一种应用于列的“约束”，用于唯一标识该数据库表中的每一行。它确保该列中每行的值都是唯一的且永远不会改变，因此这些值可以用于引用任何特定的行。\n\
  \n通过设置 `PRIMARY KEY` 约束，可以对数据库表中的特定行进行数据操作。\n\n任何列都可以被设置为 `PRIMARY KEY`，但通常使用第一列来提供唯一的标识符。\n\
  \n任何被设置为 `PRIMARY KEY` 的列都必须符合以下标准：\n\n- 该列中的每个字段必须有值——它不能为空或具有 `NULL` 值。\n- 该列中的每个值必须是唯一的——不能有重复。\n\
  - 该列中的每个值永远不能被修改或更新。\n- 该列中的每个值不能重用——当行被删除时，其 `PRIMARY KEY` 值不能被重新分配为新行的 `PRIMARY\
  \ KEY` 值。\n\n注意上一个例子，MySQL 自动将“id”列设置为 `PRIMARY KEY`，因为在该列定义中包含了 `UNIQUE` 修饰符。唯一值（如此处第\
  \ 91 页`EXPLAIN` 查询输出中“Key”标题下的“PRI”项所示）可以标识表的行。\n\n## 修改表\n\n现有数据库表的格式可以通过 `ALTER\
  \ TABLE` 查询进行更改。该查询可以进行单一更改，也可以通过逗号分隔列表指定多个更改。\n\n### 添加列\n\n`ALTER TABLE` 查询可以向现有表\
  \ `ADD` 一个完整的新列，如下：\n\n```sql\nALTER TABLE table_name ADD column_name data-type;\n\
  ```\n\n### 添加主键\n\n可以使用语法为现有列 `ADD` 主键：\n\n```sql\nALTER TABLE table_name ADD PRIMARY\
  \ KEY (column_name);\n```\n\n### 修改列\n\n`ALTER TABLE` 查询可以 `CHANGE` 现有列的名称。新列不会继承原始列指定的任何数据类型或修饰符——这些必须在\
  \ `ALTER TABLE` 查询中重新设置，如下：\n\n```sql\nALTER TABLE table_name CHANGE old_column_name\
  \ new_column_name data-type;\n```\n\n### 删除列\n\n`ALTER TABLE` 查询可以使用 `DROP COLUMN`\
  \ 关键字永久删除表中的整列：\n\n```sql\nALTER TABLE table_name DROP COLUMN column_name;\n```\n\
  \n在 `ADD COLUMN` 和 `DROP COLUMN` 示例中，`COLUMN` 关键字是可选的——它是手册所谓的“纯噪音词”，仅有助于可读性。\n\n\
  以下 SQL 脚本演示了所有可能性：\n\n![image](img/1o.jpg)\n\n```sql\nCREATE TABLE IF NOT EXISTS\
  \ pans\n(\n| id | INT | NOT NULL , |\n| --- | --- | --- |\n| pattern | VARCHAR(25)\
  \ | NOT NULL , |\n| price | DECIMAL( 6,2 ) |  |\n) ;\n```\n\n![image](img/pg94_1.jpg)\n\
  \nalter_table.sql\n\n![image](img/2o.jpg)接下来，发布查询以确认表的格式\n\n```sql\nEXPLAIN pans\
  \ ;\n```\n\n![image](img/3o.jpg)现在，发布查询来更新表\n\n```sql\nALTER TABLE pans\nADD PRIMARY\
  \ KEY ( id ) ,\nADD COLUMN INT UNIQUE NOT NULL ,\nCHANGE pattern pan_pattern VARCHAR(25)\
  \ NOT NULL ,\nDROP COLUMN price ;\n```\n\n\n\n\n\n![image](img/5o.jpg)\n将文件保存到 `C:\\\
  SQL` 文件夹并命名为 `alter_table.sql`，然后以 root 登录 MySQL 命令行客户端并执行查询使用已建立的数据库\n\n```sql\n\
  USE site_db ;\n```\n\n![image](img/6o.jpg)通过指明系统上 SQL 文件的源路径来执行 SQL 查询\n\n```sql\n\
  SOURCE C:\\SQL\\alter_table.sql\n```\n\n![image](img/pg95_1.jpg)\n\n![image](img/snake.jpg)\n\
  \n使用 `DROP COLUMN` 时应小心，因为它将移除该列包含的任何数据——这些数据无法恢复。\n\n![image](img/forget.jpg)\n\
  \n如果设计的数据库表已经预见了所有可能的未来需求，则永远不需要进行修改。\n\n## 总结\n\n- `USE DATABASE` 查询选择一个要操作的数据库。\n\
  - 使用 `SHOW TABLES` 查询可以显示数据库中所有表的名称。\n- 使用 `EXPLAIN` 查询可以检查表的格式。\n- 使用 `CREATE TABLE`\
  \ 查询可以创建一个新表。\n- `CREATE TABLE` 查询可以配合 `IF NOT EXISTS` 使用，以确保指定名称的表已不存在。\n- 使用 `DROP\
  \ TABLE` 查询可以删除现有表。\n- `DROP TABLE` 查询可以配合 `IF EXISTS` 使用，以确保指定名称的表已存在。\n- 列定义应指定其可能包含的数据类型，使用识别的数据类型关键字如\
  \ `INT`、`DOUBLE`、`DECIMAL`、`DATETIME`、`TIMESTAMP`、`DATE`、`TIME`、`YEAR`、`CHAR()`、`VARCHAR()`、`TEXT`、`BLOB`\
  \ 或 `SET`。\n- 列定义可选地指定一个字段修改符来进一步控制该列的允许内容，使其 `NOT NULL`、`AUTO_INCREMENT`、`UNIQUE`、`DEFAULT`\
  \ 或 `PRIMARY KEY`。\n- 当列设置为 `PRIMARY KEY` 时，每行必须在该列中包含唯一且不可更改的数据，这可以识别该表的每行。\n-\
  \ 使用 `ALTER TABLE` 查询可以向现有表 `ADD` 一个新列。\n- 使用 `ALTER TABLE` 查询可以 `CHANGE` 现有表中的列。\n\
  - 使用 `ALTER TABLE` 查询可以配合 `DROP` 关键字从现有表中删除一列。\n\n# 6 处理数据\n\n***本章演示了如何编写 SQL 语句使用\
