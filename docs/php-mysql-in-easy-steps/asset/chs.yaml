  \n![image](img/snake.jpg)\n\n仅包含纯 PHP 代码的文件（如此处列出的两个文件）应省略文件末尾的 PHP `?>` 结束标签。这可以防止\
  \ PHP 结束标签后出现意外的空格或换行，这些可能会导致意外的影响。\n\n### 获取结果\n\n某些 SQL 查询（如 INSERT, UPDATE, DELETE\
  \ 或 ALTER）不返回数据，因此在执行成功时仅返回 TRUE 值。其他 SQL 查询（如 SHOW 或 SELECT）在执行成功时返回“结果集”。\n\n\
  结果集包含记录行，可以使用 `while` 循环逐行读取。`mysqli_fetch_array()` 函数需要结果集变量作为第一个参数。可选地，可以通过第二个参数指定返回的数组类型——关联数组、索引数组或两者兼有。可以使用下方列出的内置\
  \ PHP 常量：\n\n| 常量: | 示例 |\n| --- | --- |\n| `MYSQLI_ASSOC` | `$row['column-name']`\
