  \ 拥有内置运算符和函数，可以用于对数据库中存储的数据进行快速过滤。强烈建议使用这些功能，因为比让 SQL 查询检索所有数据后再由 PHP 进行过滤效率更高。MySQL\
  \ 可用的比较运算符列如下：\n\n| 运算符: | 说明: |\n| --- | --- |\n| = | 等于 |\n| != | 不等于 |\n| < |\
  \ 小于 |\n| <= | 小于或等于 |\n| > | 大于 |\n| >= | 大于等于 |\n| `BETWEEN` min `AND` max | 在\
  \ min 到 max 范围内 |\n| `IS NULL` | 为空值 |\n| `IS NOT NULL` | 不为空值 |\n\n比较运算符用于带有 `WHERE`\
  \ 子句的查询中，以测试特定条件是否满足。当评估结果为 TRUE 时，查询将返回数据，否则将不返回任何内容。有用的是，内置 `NOW()` 函数返回 `YYYY-MM-DD\
  \ HH:MM:SS` 格式的当前日期时间，提供了访问数据库的时间戳。此外，内置的 `SHA2()` 加密函数允许安全地存储密码。它接受两个参数，指定密码和哈希长度以返回\
  \ 224、256、384 或 512 位（返回 64 个字符）。\n\n![image](img/pg16_1.jpg)\n\ncomparison.sql\n\
  \n![image](img/1bl.jpg)启动一个纯文本编辑器（如记事本），并创建一个定义五列表格的查询\n\n```sql\nCREATE TABLE IF\
  \ NOT EXISTS items\n(\n| id | INT AUTO_INCREMENT PRIMARY KEY , |\n| name | CHAR(16)\
  \ NOT NULL , |\n| quantity | INT NOT NULL , |\n| pass | TEXT(256) NOT NULL , |\n\
  | stamp | DATETIME NOT NULL |\n) ;\n```\n\n![image](img/hot.jpg)在 dev.mysql.com/doc/refman/8.0/en/\
  \ 上的在线 MySQL 8 参考手册中发现更多 MySQL 内置功能\n\n![image](img/2bl.jpg)接下来，添加一个查询向此表中插入四条记录\n\
  \n```sql\nINSERT INTO items ( name , quantity , pass , stamp )\nVALUES ( “Alan”\
  \ , 10 , SHA2(“river”, 256) , NOW() ) ,\n( “Dean” , 20 , SHA2(“blue”, 256) , NOW()\
  \ ) ,\n( “Gary” , 30 , SHA2(“light”, 256) , NOW() ) ,\n( “Mike” , 40 , SHA2(“shine”,\
  \ 256) , NOW() ) ;\n```\n\n![image](img/3bl.jpg)现在，通过比较“quantity”值来显示名称和数量\n\n```sql\n\
  SELECT name , quantity FROM items\nWHERE quantity BETWEEN 15 AND 35 ;\n```\n\n![image](img/4bl.jpg)添加一个查询，通过比较“quantity”值显示时间和密码\n\
  \n```sql\nSELECT stamp , pass FROM items\nWHERE quantity < 15 ;\n```\n\n![image](img/5bl.jpg)将文件保存到\
  \ `C:\\SQL` 文件夹中并命名为 `comparison.sql`，然后启动 MySQL 命令行客户端并执行查询使用已建立数据库\n\n```sql\n\
  USE site_db ;\n```\n\n![image](img/6bl.jpg)现在，通过指定系统上 SQL 文件的源路径来实现 SQL 查询\n\n```sql\n\
  SOURCE C:\\SQL\\comparison.sql\n```\n\n![image](img/pg117_1.jpg)\n\n![image](img/hot.jpg)\n\
  \n`NOW()` 返回的是服务器的时间，可能与用户的本地时间不同。\n\n## 总结\n\n通过 `INSERT INTO` 查询向表插入数据。`INSERT\
  \ INTO` 查询中的 `VALUES` 关键字指定逗号分隔的值列表。文本值必须用引号包围。通过 `SELECT * FROM` 查询从表中检索所有数据。使用\
  \ `UPDATE` 查询更改列中的字段。在 `UPDATE` 查询中添加 `WHERE` 关键字以识别要更改的特定行。`SET` 关键字用于 `UPDATE`\
  \ 查询以更改一个或多个字段。使用 `DELETE` 查询删除表中的所有行。在 `DELETE` 查询中添加 `WHERE` 关键字以识别要删除的特定行。所有表应指定一个包含\
  \ `PRIMARY KEY` 的列。通过在 `SELECT` 查询中指定逗号分隔的列列表检索多列数据。通过在 `SELECT` 查询中添加 `WHERE` 关键字检索特定行。`WHERE`\
  \ 子句可以指定跟在 `IN` 关键字逗号分隔的可选比较值列表。在 `IN` 关键字之前添加 `NOT` 关键字可以返回不匹配列表中任何值的行的数据。`ORDER\
  \ BY` 子句可以指定排序列，并使用 `ASC` 和 `DESC` 关键字指定如何排序检索到的数据。MySQL 拥有与 PHP 类似的比较运算符。内置的 MySQL\
  \ `NOW()` 函数提供时间戳，内置的 `SHA2()` 函数安全地存储密码。\n\n# 7 连接数据库\n\n本章介绍如何在 PHP 脚本中连接 MySQL\
  \ 数据库并执行 SQL 查询。\n\n- 连接\n- 执行查询\n- 检索结果\n- 应用更改\n- 计数记录\n- 更新记录\n- 验证结果\n- 确保安全\n\
  - 错误处理\n\n## 连接\n\n连接到 MySQL 服务器的标准脚本在第 1 章配置开发环境时描述过，此处重复以供解释：\n\n```php\n<?php\n\
  $dbc = mysqli_connect( *‘host’ , ‘user’ , ‘password’ , ‘database’ )\nOR die ( mysqli_connect_error()\
  \ ) ;\nmysqli_set_charset( $dbc , ‘utf8’ ) ;\n```\n\n\n\n\n\n脚本定义了一个名为 `dbc`（数据库连接）的\
  \ PHP 变量，其值赋值为内置函数 `mysqli_connect()` 的返回值。该调用需要四个参数来指定 MySQL 用户详情和要连接的数据库。当调用成功时，`mysqli_connect()`\
  \ 函数返回一个代表与 MySQL 服务器连接的“对象”。\n\n成功调用 `mysqli_connect()` 返回的对象非常重要，因为它在其他与 MySQL\
  \ 服务器通信的 PHP 函数调用中被用作参数传递。例如，在上面的脚本中，它必须作为 `mysqli_set_charset()` 函数调用的第一个参数以标识该连接。\n\
  \n当 `mysqli_connect()` 函数调用失败时，脚本将跳转到调用 `die()` 函数的备选分支。这等于调用 `exit()` 来立即终止脚本。可选地，`die()`\
  \ 函数可以接受字符串参数，该字符串将在脚本停止时打印出来。在这种情况下，字符串消息是由 `mysqli_connect_error()` 函数返回的，用于描述连接失败的原因。\n\
  \n由于连接脚本包含敏感的用户信息，因此不能将其放置在 Web 服务器 `/htdocs` 目录下的其他 PHP 脚本并列。`connect_db.php` 脚本应该位于\
  \ `/htdocs` 的父目录，在那里它无法被直接访问，但可以通过 `require` 语句与其他 PHP 脚本合并，如下所示：\n\n```php\n<?php\n\
  require ( '../connect_db.php’ ) ;\nif ( mysqli_ping( $dbc ) )\n{\n    echo ‘MySQL\
  \ Server ‘ . mysqli_get_server_info( $dbc ) . ‘ on ‘ . mysqli_get_host_info( $dbc\
  \ ) ;\n}\n```\n\n![image](img/pg120_2.jpg)\n\nrequire.php\n\n因此，Web 服务器目录结构中的文件应按所示的分级结构排列，这样当通过\
  \ HTTP 请求 `require.php` 脚本时，`connect_db.php` 脚本将从其父目录的位置引入，并建立到 MySQL 服务器的连接。\n\n\
  ![image](img/pg121_1.jpg)\n\n![image](img/pg121_2.jpg)\n\n![image](img/hot.jpg)\n\
  \n包含纯 PHP 代码的文件（如此处列出的两个文件）应省略文件末尾的 PHP `?>` 结束标签。这可以防止 PHP 结束标签后出现意外的空格或换行，这些可能会导致意外的影响。\n\
  \n![image](img/snake.jpg)\n\n在继续之前，确保你的连接脚本 `connect_db.php` 运行成功——在本书的其余部分都需要它来连接到\
  \ `site_db` MySQL 数据库。\n\n### 执行查询\n\n一旦你的 PHP 脚本建立了与 MySQL 服务器上指定数据库的连接，就可以使用 PHP\
  \ `mysqli_query()` 函数进行查询，其语法如下：\n\n```\nmysqli_query ( database-connection-object\
  \ , sql-query )\n```\n\n数据库连接对象是标准脚本在此处第 121 页 中赋值给变量（`$dbc`）的对象。通常，SQL 查询是一个赋值给另一个变量的字符串，该字符串可以作为函数的第二个参数使用。\n\
  \n当调用 `mysqli_query()` 函数时，调用成功则返回一个“结果集”或 TRUE 值，调用失败则返回 FALSE 值。将返回值赋值给变量可以测试查询的执行是成功还是失败。\n\
  \n可选地，你的脚本可以在查询执行后调用 `mysqli_close()` 来显式关闭连接。尽管这在脚本结束时会自动发生，但进行此调用被认为是一种良好的做法。\n\
  \n![image](img/pg122_1.jpg)\n\nquery.php\n\n![image](img/1v.jpg)创建一个 PHP 脚本，首先引入标准脚本以建立到\
  \ MySQL 服务器上数据库的连接\n\n```php\n<?php\nrequire ( ../connect_db.php ‘ ) ;\n```\n\n\
  ![image](img/2v.jpg)接下来，初始化一个带有 SQL 查询字符串的变量\n\n```php\n$q \\= ‘SHOW TABLES’ ;\n\
  ```\n\n![image](img/3v.jpg)现在，初始化另一个变量，这次是对 MySQL 服务器数据库的查询结果\n\n```php\n$r \\=\
  \ mysqli_query ( $dbc , $q ) ;\n```\n\n![image](img/4v.jpg)测试查询是否成功并显示适当的消息\n\n\
  ```php\nif ( $r )\n{ echo ‘<h1>Result Set Returned OK</h1>’ ; }\nelse\n{ echo ‘<p>’\
  \ . mysqli_error( $dbc ) . ‘</p> ; }\n```\n\n![image](img/5v.jpg)最后，关闭 MySQL 服务器数据库连接\n\
  \n```php\nmysqli_close ( $dbc ) ;\n```\n\n![image](img/6v.jpg)将 PHP 脚本保存在 Web 服务器的\
  \ `/htdocs` 目录下并命名为 `query.php`，然后通过 HTTP 打开它查看确认查询成功的消息\n\n![image](img/pg123_1.jpg)\n\
  \n![image](img/7v.jpg)现在，编辑 SQL 查询字符串使其出错\n\n```php\n$q \\= ‘SHOW TABLE’ ;\n```\n\
  \n![image](img/8v.jpg)再次保存编辑过的 PHP 脚本，然后再次通过 HTTP 打开它查看描述查询失败的消息\n\n![image](img/pg123_2.jpg)\n\
  \n![image](img/snake.jpg)\n\n仅包含纯 PHP 代码的文件（如此处列出的两个文件）应省略文件末尾的 PHP `?>` 结束标签。这可以防止\
  \ PHP 结束标签后出现意外的空格或换行，这些可能会导致意外的影响。\n\n![image](img/snake.jpg)\n\n在继续之前，确保你的连接脚本\
  \ `connect_db.php` 运行成功——在本书的其余部分都需要它来连接到 `site_db` MySQL 数据库。\n\n### 执行查询\n\n一旦你的\
  \ PHP 脚本建立了与 MySQL 服务器上指定数据库的连接，就可以使用 PHP `mysqli_query()` 函数进行查询，其语法如下：\n\n```\n\
  mysqli_query ( database-connection-object , sql-query )\n```\n\n数据库连接对象是标准脚本在此处第\
  \ 121 页 中赋值给变量（`$dbc`）的对象。通常，SQL 查询是一个赋值给另一个变量的字符串，该字符串可以作为函数的第二个参数使用。\n\n当调用 `mysqli_query()`\
  \ 函数时，调用成功则返回一个“结果集”或 TRUE 值，调用失败则返回 FALSE 值。将返回值赋值给变量可以测试查询的执行是成功还是失败。\n\n可选地，你的脚本可以在查询执行后调用\
  \ `mysqli_close()` 来显式关闭连接。尽管这在脚本结束时会自动发生，但进行此调用被认为是一种良好的做法。\n\n![image](img/pg122_1.jpg)\n\
