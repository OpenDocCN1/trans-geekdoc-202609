  \nSQL 查询可以使用 `ORDER BY` 子句根据指定的列名来对返回的数据进行排序。`ORDER BY` 子句的用法语法如下：\n\n`SELECT *\
  \ FROM *table-name* WHERE *column-name* = *value* ORDER BY *column-name*`\n\n通常情况下，`SELECT`\
  \ 查询的结果是升序排列的。`ORDER BY` 子句可以通过在排序列名后添加 `DESC`（降序）或 `ASC`（升序）来显式指定排序方向。\n\n以下 SQL\
  \ 示例展示了数值排序和字母排序的 `ORDER BY` 子句。\n\n![image](img/pg112_1.jpg)\n\n`order_by.sql`\n\
  \n![image](img/1bl.jpg)启动一个纯文本编辑器（如记事本），并创建一个查询来定义一个具有四列的表\n\n```\nCREATE TABLE\
