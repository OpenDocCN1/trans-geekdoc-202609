  \ . $row['name'] .\n            ' @ ' . $row['price'];\n        }\n    }\n    else\
  \ { \n        echo '<p>' . mysqli_error( $dbc ) . '</p>'; \n    }\n}\n```\n\n![image](img/3v.jpg)现在，调用该函数显示所有记录\n\
  \n```php\nshow_records( $dbc );\n```\n\n![image](img/4v.jpg)创建并执行另一个查询以向表中添加行\n\n\
