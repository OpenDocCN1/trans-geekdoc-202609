  \n[content]\n在处理用户输入的脚本中，当用户输入不适当的数据时，“触发”错误是非常用的。这通过使用 PHP 的 `trigger_error()`\
  \ 函数实现，该函数接受两个参数来指定错误消息和级别。由于此函数仅描述用户生成的错误，指定的错误级别必须是上表中的 `E_USER` 常量类型之一。\n\n![image](img/hot.jpg)\n\
  \nPHP 错误处理通过其配置文件开启，也可以通过调用 `ini_set( ‘display_errors’,1)` 手动开启。\n\n![image](img/pg137_1.jpg)\n\
  \nerror.php\n\n![image](img/1v.jpg)创建一个包含 PHP 脚本的 HTML 文档，该脚本开头指定一个自定义的错误处理函数\n\n\
  ```php\n<?php\nset_error_handler( ‘error_handler’ ) ;\n```\n\n![image](img/2v.jpg)接下来，添加自定义错误处理函数，以便在调用时向用户显示错误详情\n\
  \n```php\nfunction error_handler ( $level , $message , $file , $line )\n{\n    echo\
  \ “Error [$level] : $message <br>\n(Check line $line in $file )” ;\n}\n```\n\n![image](img/3v.jpg)现在，初始化一个变量，模拟用户输入值\n\
  \n```php\n$num = 500 ;\n```\n\n![image](img/4v.jpg)最后，设置触发器调用自定义错误处理函数\n\n```php\n\
  if ( $num > 100 )\n{ \n    trigger_error( ‘Number must be less than 100’ , E_USER_ERROR\
  \ ) ; \n}\n?>\n```\n\n![image](img/5v.jpg)将 PHP 脚本保存到 Web 服务器的 `/htdocs` 目录下并命名为\
  \ `error.php`，然后通过 HTTP 打开以查看由自定义错误处理函数生成的消息\n\n![image](img/pg137_2.jpg)\n\n![image](img/hot.jpg)\n\
  \n单独表达式错误可以通过在表达式前加上 `@` 错误控制运算符来抑制。因此，$num = @( 8 / 0 ) ; 会抑制默认的 `Division By Zero`\
  \ 错误消息。\n\n## 总结\n\n- PHP `mysqli_connect()` 函数将用户连接到指定的数据库并返回一个数据库连接对象。\n- 数据库连接对象被用作与其他数据库通信的其他\
  \ PHP 函数的参数。\n- PHP `mysqli_query()` 函数将 SQL 查询发送到 MySQL 服务器上连接的数据库。\n- 当调用 `mysqli_query()`\
  \ 函数时，成功时返回一个结果集或 `TRUE` 值，失败时返回 `FALSE` 值。\n- 可选，可以调用 `mysqli_close()` 来显式关闭数据库连接。\n\
  - SQL `SELECT` 查询返回一个包含记录行的结果集，可以使用 `while` 循环逐行读取这些行。\n- PHP `mysqli_fetch_array()`\
  \ 函数将结果集的每行作为关联数组或数字数组返回。\n- 可选，调用 `mysqli_free_result()` 可以显式释放结果集资源。\n- SQL `INSERT`、`UPDATE`、`DELETE`\
  \ 或 `ALTER` 查询在成功时仅返回 `TRUE` 值。\n- PHP `mysqli_num_rows()` 函数返回一个表示指定结果集中行数的整数。\n\
  - `mysqli_affected_rows()` 函数返回一个表示受 `INSERT`、`UPDATE` 或 `DELETE` 影响的行数的整数。\n- 按类型测试数据的\
  \ PHP 函数如果数据为特定类型，则返回 `TRUE`，否则返回 `FALSE`。\n- `mysqli_real_escape_string()` 函数转义字符串中的特殊字符，`strip_tags()`\
  \ 移除 HTML 标签。\n- `set_error_handler()` 函数指定自定义错误处理程序，`trigger_error()` 可生成错误。\n\n\
  8\n\n# 注册用户\n\n*本章演示了如何创建一个简单的注册程序和登录应用程序。*\n\n- 创建用户数据库\n- 提供注册页面\n- 处理注册\n- 提供登录页面\n\
  - 提供登录工具\n- 处理登录尝试\n- 确认登录成功\n- 总结\n\n## 创建用户数据库\n\n用户详情可以在用户首次注册访问时很有用地存储在 MySQL\
  \ 数据库表中，这样在随后的访问中，PHP 脚本就可以轻松检索这些详情进行比较。当用户输入的登录详情与数据库表中已存储的信息相匹配时，脚本可以允许访问网站。通常，包含用户详情的数据库表可能会以单独列的形式存储每个用户的用户\
  \ ID、名字、姓氏、电子邮件地址、密码和注册日期：\n\n| **列名：** | 内容类型: | 示例: |\n| --- | --- | --- |\n|\
  \ `user_id` | 数字 | 123 |\n| `first_name` | 文本 | Mike |\n| `last_name` | 文本 | McGrath\
  \ |\n| `email` | 文本 | mike@example.com |\n| `pass` | 文本 | m00nshine |\n| `reg_date`\
  \ | 日期/时间 | 2018-05-14 12:30:00 |\n\n\n\n\n当用户输入并提交表单后，PHP 脚本将显示消息提示用户任何验证错误，或显示注册成功的确认并提供指向登录页面的超链接。\n\
  \n![image](img/forget.jpg)\n\n页面的头部和页脚包含在 HTML 文档中通过 CSS 样式表进行简单样式化。\n\n![image](img/pg143_1.jpg)\n\
  \n### register.php\n\n![image](img/1b.jpg)启动一个纯文本编辑器，并编写设置页面标题和包含页面头部的 PHP 脚本\n\n\
  ```php\n<?php\n$page_title = ‘Register’ ;\ninclude ( ‘includes/header.html’ ) ;\n\
  ```\n\n![image](img/2b.jpg)现在，添加一个条件测试，只有在表单已提交时才执行其包含的语句\n\n```php\nif ($_SERVER['REQUEST_METHOD']\
  \ == ‘POST’ )\n{\n    # 在此处插入语句（步骤 3-10）。\n}\n?>\n```\n\n![image](img/3b.jpg)接下来，插入语句以打开数据库连接并初始化用于错误消息的数组\n\
  \n```php\nrequire ( '../connect_db.php’ ) ;\n$errors = array() ;\n```\n\n![image](img/4b.jpg)插入语句：如果姓字段为空，则存储错误消息，或者将其值存储在变量中\n\
  \n```php\nif ( empty($_POST['first_name'] ) )\n{ $errors[] = ‘Enter your first name.’\
  \ ; }\nelse\n{ $fn = mysqli_real_escape_string( $dbc, trim($_POST['first_name']\
  \ ) ) ; }\n```\n\n![image](img/5b.jpg)现在，插入语句：如果姓字段为空，则存储错误消息，或者将其值存储在变量中\n\n```php\n\
  if ( empty($_POST['last_name'] ) )\n{ $errors[] = ‘Enter your last name.’ ; }\n\
  else\n{ $ln = mysqli_real_escape_string( $dbc, trim($_POST['last_name'] ) ) ; }\n\
  ```\n\n![image](img/6b.jpg)插入语句：如果邮箱地址字段为空，则存储错误消息，或者将其值存储在变量中\n\n```php\nif ( empty($_POST['email']\
  \ ) )\n{ $errors[] = ‘Enter your email address.’ ; }\nelse\n{ $e = mysqli_real_escape_string(\
  \ $dbc, trim($_POST['email'] ) ) ; }\n```\n\n![image](img/forget.jpg)\n\n数据库连接变量\
  \ `$dbc` 由 `connect_db.php` 脚本初始化，`$_POST[]` 数组包含命名表单字段的值。\n\n![image](img/hot.jpg)\n\
  \n使用 `mysqli_real_escape_string()` 函数转义特殊字符，并使用 `trim()` 函数移除不需要的空格。\n\n![image](img/7b.jpg)接下来，插入语句：如果密码匹配，则将密码值存储在变量中；如果不匹配或第一个字段为空，则存储错误消息\n\
  \n```php\nif ( !empty($_POST['pass1'] ) )\n{\n    if ($_POST['pass1'] != $_POST['pass2']\
  \ )\n    { $errors[] = ‘Passwords do not match.’ ; }\n    else\n    { $p = mysqli_real_escape_string(\
  \ $dbc, trim($_POST['pass1'] ) ) ; }\n}\nelse { $errors[] = ‘Enter your password.’\
  \ ; }\n```\n\n![image](img/8b.jpg)插入语句：如果邮箱地址已经在“users”数据库表中注册过，则存储错误消息\n\n```php\n\
  if ( empty($errors) )\n{\n    $q = “SELECT user_id FROM users WHERE email='$e’”\
  \ ;\n    $r = mysqli_query ( $dbc , $q ) ;\n    if ( mysqli_num_rows( $r ) != 0\
  \ )\n    { $errors[] = ‘Email address already registered. <a href=”login.php”>Login</a’\
  \ ; }\n}\n```\n\n![image](img/9b.jpg)现在，插入语句将用户数据存入数据库表、注册成功时显示确认、关闭数据库连接、包含页脚并退出脚本\n\
  \n```php\nif ( empty($errors) )\n{\n    $q = “INSERT INTO users (first_name, last_name,\
  \ email, pass, reg_date) VALUES (‘$fn’, ‘$ln’, ‘$e’, SHA2(‘$p’, 256 ), NOW() )”\
  \ ;\n    $r = mysqli_query ( $dbc , $q ) ;\n    if ( $r )\n    {\n        echo ‘<h1>Registered!</h1><p>You\
  \ are now registered.</p><p><a href=”login.php”>Login</a></p> ;\n    }\n    mysqli_close(\
  \ $dbc ) ;\n    include ( ‘includes/footer.html’ ) ;\n}\n```\n\n\n\n\n\n## 提供登录页面\n\
  \n在完成用户注册过程（详见第 142-147 页介绍）后，你现在可以创建登录页面了。用户可以通过注册时提供的超链接或直接输入登录页面地址来访问该页面。\n\n\
  ![image](img/pg148_1.jpg)\n\n`login.php`\n\n![image](img/1b.jpg)启动一个纯文本编辑器，并开始编写\
  \ PHP 脚本，使用语句设置页面标题并包含页面页眉\n\n```php\n<?php\n$page_title = ‘Login’ ;\ninclude (\
  \ ‘includes/header.html’ ) ;\n```\n\n![image](img/2b.jpg)现在，添加一个条件测试，如果存在任何错误消息则显示它们，并在登录尝试失败时提供返回注册页面的超链接\n\
  \n```php\nif ( isset( $errors ) && !empty( $errors ) )\n{\n    echo ‘<p id=”err_msg>Oops!\
  \ There was a problem:<br>’ ;\n    foreach ( $errors as $msg )\n    {\n        echo\
  \ “ - $msg<br>” ;\n    }\n    echo ‘Please try again or\n<a href=”register.php”>Register</a></p>’\
  \ ;\n}\n?>\n```\n\n![image](img/3b.jpg)接下来，添加 HTML 表单，将用户登录详情提交给 PHP 脚本进行处理\n\n\
  ```html\n<h1>Login</h1>\n<form action=”login_action.php” method=”POST\">\n<p>\n\
  Email Address: <input type=”text” name=”email\">\n</p><p>\nPassword: <input type=”password”\
  \ name=”pass\">\n</p><p>\n<input type=”submit” value=”Login” >\n</p>\n</form>\n\
  ```\n\n![image](img/4b.jpg)添加最后一条脚本指令以包含页面页脚，然后将脚本保存到 Web 服务器的 `/htdocs` 目录中，命名为\
  \ `login.php`\n\n```php\n<?php include ( ‘includes/footer.html’ ) ; ?>\n```\n\n\
  ![image](img/forget.jpg)\n\n只有在表单提交且登录失败后，PHP 处理脚本程序才会设置 `$errors` 数组。\n\n![image](img/5b.jpg)点击注册页面上的超链接，或在浏览器地址栏输入位置\
  \ `http://localhost/login.php`，即可看到 Abyss 呈现登录页面\n\n![image](img/pg149_1.jpg)\n\n\
  当提交登录表单时，必须通过验证函数确保字段不为空，然后在“users”数据库表中查找到其输入值。\n\n如果找到了提交的值，则登录尝试成功，因此可以从“users”表中检索相应的用户\
  \ ID、名字和姓氏，并调用另一个函数在浏览器中加载首页（Home page）。\n\n如果未找到提交的值，则登录尝试失败，验证函数将简单设置一个描述性的错误消息。\n\
  \n这两个函数（验证表单字段的函数和加载新页面的函数）可以方便地在独立的 PHP 脚本中创建为登录“工具”，这样它们就可以从处理登录页面表单的脚本中轻松调用，并在用户导航到网站其他页面时被其他\
  \ PHP 脚本调用。\n\n![image](img/snake.jpg)\n\n在创建 PHP 处理脚本之前点击登录按钮，只会产生 HTTP 404 页面未找到错误。\n\
  \n![image](img/hot.jpg)\n\n如果这些函数对网站的多个页面都有用，可以在独立的 PHP 脚本中创建它们以实现模块化。\n\n## 提供登录工具\n\
  \n在完成用户登录表单（详见第 148-149 页）后，你现在可以创建登录工具，用于验证登录尝试并在需要时加载新页面。只需通过在工具中插入指向此脚本的 PHP\
  \ `require` 语句，即可轻松供网站上的其他页面使用。\n\n![image](img/pg150_1.jpg)\n\n`login_tools.php`\n\
  \n![image](img/1b.jpg)启动一个纯文本编辑器，并开始编写 PHP 脚本，包含一个函数块来加载作为参数指定的页面\n\n```php\n<?php\n\
  function load( $page = ‘login.php’ )\n{\n    # 在此处插入语句（步骤 2-4）。\n}\n```\n\n![image](img/2b.jpg)现在，在\
  \ `load` 函数块中，插入一条语句来构建一个包含协议、当前域名和目录的 URL 字符串\n\n```php\n$url = ‘http://’ . $_SERVER['HTTP_HOST’]\
  \ .\ndirname( $_SERVER['PHP_SELF'] ) ;\n```\n\n![image](img/3b.jpg)接下来，在 `load`\
  \ 函数块中，插入语句移除 URL 字符串中的任何末尾斜杠，然后追加正斜杠和指定的页面参数\n\n```php\n$url = rtrim( $url , ‘/’\
  \ ) ;\n$url .= ‘/’ . $page ;\n```\n\n![image](img/4b.jpg)最后，在 `load` 函数块中，插入语句来加载指定的页面然后退出脚本\n\
  \n```php\nheader( “Location: $url” ) ;\nexit() ;\n```\n\n![image](img/5b.jpg)添加一个函数块来验证用户登录详情是否正确，或提供错误消息\n\
  \n```php\nfunction validate( $dbc, $email = '', $pwd = '' )\n{\n    // 在此处插入语句（步骤\
  \ 6-10）。\n}\n```\n\n在 `validate` 函数块中，插入一个语句来初始化错误数组\n\n```php\n$errors = array();\n\
  ```\n\n![image](img/6b.jpg)如果未指定页面，则将 `load` 函数的名称赋予默认页面。\n\n`load` 函数的存在可能会给 URL\
  \ 字符串添加斜杠，因此在追加页面之前必须移除它们。\n\n![image](img/7b.jpg)接下来，如果 email 字段为空，插入语句来存储错误消息\n\
  \n```php\nif ( empty( $email ) )\n{\n    $errors[] = ‘Enter email address.’ ;\n\
  }\nelse\n$e = mysqli_escape_string($dbc, trim($email));\n```\n\n![image](img/8b.jpg)现在，如果密码\
  \ 字段为空，插入语句来存储错误消息\n\n```php\nif ( empty( $pwd ) )\n{\n    $errors[] = ‘Enter password.’\
  \ ;\n}\nelse\n$p = mysqli_escape_string($dbc, trim($pwd));\n```\n\n![image](img/9b.jpg)如果在数据库中找到\
  \ email 和密码，向调用者返回关联的用户 ID、姓氏\n\n```php\nif ( empty( $errors ) )\n{\n    $q = “SELECT\
  \ user_id, first_name, last_name\n    FROM users\n    WHERE email = ‘$e’\n    AND\
  \ pass = SHA2( ‘$p’, 256 ) ” ;\n    $r = mysqli_query( $dbc , $q ) ;\n    if ( mysqli_num_rows(\
  \ $r ) == 1 )\n    {\n        $row = mysqli_fetch_array ( $r , MYSQLI_ASSOC ) ;\n\
  \        return array( true , $row ) ;\n    }\n    else\n    { $errors[] = ‘Email\
  \ address and password not found.’ }\n}\n```\n\n![image](img/10b.jpg)最后，如果登录尝试失败，在\
  \ `validate` 函数中返回错误列表\n\n```php\nreturn array( false , $errors );\n```\n\n![image](img/11b.jpg)确保现在将此脚本保存到\
  \ Web 服务器的 `/htdocs` 目录中，命名为 `login_tools.php`\n\n![image](img/hot.jpg)\n\n为了稳定性，你应该使用\
  \ `mysqli_real_escape_string()` 函数转义任何意外字符。\n\n![image](img/snake.jpg)注册过程使用 MySQL\
  \ `SHA2()` 函数加密格式存储用户密码（请参阅此处第 116 页）——因此 SELECT 比较也必须使用该函数。\n\n## 处理登录尝试\n\n在完成登录表单和登录工具（详见第\
  \ 148-151 页）后，你现在可以创建 PHP 脚本来实际处理登录尝试。当登录尝试成功时，此脚本将从数据库检索的用户详情设置为会话数据——这样已登录用户在网站的其他页面之间导航时可以被轻松识别。\n\
  \n![image](img/pg152_1.jpg)\n\n`login_action.php`\n\n![image](img/1b.jpg)启动一个纯文本编辑器，并开始编写\
  \ PHP 脚本，包含一个测试块来检查登录表单是否已提交\n\n```php\n<?php\nif ( $_SERVER['REQUEST_METHOD'] ==\
  \ ‘POST’ )\n{\n    # 在此处插入语句（步骤 2-6）。\n}\n```\n\n\n\n\n\n![image](img/2b.jpg)现在，插入一条语句打开数据库连接\n\
  \n```php\nrequire ( ‘../connect_db.php’ ) ;\n```\n\n![image](img/3b.jpg)接下来，插入一条语句使登录工具可用\n\
  \n```php\nrequire ( ‘login_tools.php’ ) ;\n```\n\n![image](img/4b.jpg)插入一条语句确保登录成功，并获取关联的\
  \ ID、名和姓的用户详情\n\n```php\nlist ( $check , $data ) = validate ( $dbc , $_POST['email']\
  \ , $_POST['pass'] ) ;\n```\n\n![image](img/5b.jpg)现在，插入语句将用户详情设置为会话数据并加载首页，或者分配错误消息\n\
  \n```php\nif ( $check )\n{\n    session_start() ;\n    $_SESSION['user_id'] = $data['user_id']\
  \ ;\n    $_SESSION['first_name'] = $data['first_name'] ;\n    $_SESSION['last_name']\
  \ = $data['last_name'] ;\n    load ( ‘home.php’ ) ;\n}\nelse { $errors = $data ;\
  \ }\n```\n\n![image](img/6b.jpg)接下来，插入一条语句关闭数据库连接\n\n```php\nmysqli_close( $dbc\
  \ ) ;\n```\n\n![image](img/forget.jpg)\n\n你的 `validate()` 登录工具函数返回一个数组，其元素由 PHP\
  \ `list()` 函数赋值给单独变量。\n\n![image](img/hot.jpg)\n\n将用户详情存储为服务器端会话数据比存储为用户可以选择禁用的客户端“cookies”更优。\n\
  \n![image](img/7b.jpg)最后，在测试块之后，添加一条语句在登录失败时继续显示登录页\n\n```php\ninclude ( ‘login.php’\
  \ ) ;\n```\n\n![image](img/8b.jpg)将此脚本保存到 Web 服务器的 `/htdocs` 目录下并命名为 `login_action.php`，然后在浏览器地址栏中输入登录页位置\
  \ `http://localhost/login.php`，并尝试使用错误的用户详情登录\n\n![image](img/pg153_1.jpg)\n\n![image](img/pg153_2.jpg)\n\
  \n![image](img/snake.jpg)\n\n此登录表单不是“粘性”表单——因此表单提交后输入的用户详情不会保留。\n\n![image](img/hot.jpg)\n\
  \n`login_tools.php` 中的 `validate()` 函数设置了此处显示的错误消息——因此当被 `login_action.php` 中的 `include`\
  \ 语句加载时，它会被显示。\n\n## 确认登录成功\n\n在完成实际处理登录尝试的 PHP 脚本（详见第 152-153 页）后，你现在可以创建一个在登录成功时加载的首页。通常，这将包含超链接，允许用户在网站的其他页面之间导航。\n\
  \n![image](img/pg154_1.jpg)\n\n### home.php\n\n![image](img/1b.jpg)启动一个纯文本编辑器，并从允许访问会话数据的语句开始\
  \ PHP 脚本\n\n```php\n<?php\nsession_start() ;\n```\n\n![image](img/2b.jpg)现在，添加语句如果用户尚未登录，则将浏览器重定向到登录页\n\
  \n```php\nif ( !isset( $_SESSION['user_id']) )\n{\n    require ( ‘login_tools.php’\
  \ ) ;\n    load() ;\n}\n```\n\n![image](img/3b.jpg)接下来，添加语句设置页面标题并包含页面页眉\n\n```php\n\
  $page_title = ‘Home’ ;\ninclude ( ‘includes/header.html’ ) ;\n```\n\n![image](img/4b.jpg)添加一条语句确认具名用户已登录\n\
  \n```php\necho “<h1>HOME</h1>\n<p>You are now logged in,\n{ $_SESSION['first_name']\
  \ } { $_SESSION['last_name'] }\n</p>” ;\n```\n\n![image](img/5b.jpg)现在，添加语句创建指向此网站其他页面的超链接\n\
  \n```php\necho ‘<p>\n<a href=”forum.php”>Forum</a> |\n<a href=”shop.php”>Shop</a>\
  \ |\n<a href=”goodbye.php”>Logout</a>\n</p> ’ ;\n```\n\n![image](img/6b.jpg)添加最后一条语句包含页面页脚\n\
  \n```php\ninclude ( ‘includes/footer.html’ ) ;\n?>\n```\n\n![image](img/forget.jpg)\n\
  \n在完成登录过程在此期间会话变量会被设置之前，无法访问首页。\n\n![image](img/7b.jpg)将此脚本保存到 Web 服务器的 `/htdocs`\
  \ 目录下并命名为 `home.php`，然后在浏览器地址栏中输入登录页位置 `http://localhost/login.php`，并尝试使用正确的用户详情登录\n\
  \n![image](img/pg155_1.jpg)\n\n![image](img/pg155_2.jpg)\n\n![image](img/hot.jpg)\n\
  \n首页上的超链接将在本书接下来的两个章节中演示 PHP 论坛和电子商务。\n\n## 总结\n\n- 用户详情可以存储在 MySQL 数据库表中，以便后续访问网站时进行比较。\n\
  - MySQL 数据库表可能会存储 ID、电子邮件地址、密码和注册日期。\n- 典型的注册表单可能会请求用户的姓名、电子邮件地址，以及他们选择的密码。\n- 注册表单应通过\
  \ `POST` 方法提交，并指定 PHP 脚本的名称作为其操作。\n- 处理注册尝试的 PHP 脚本应首先确保所有字段数据都是有效的，并在失败时提供错误消息。\n\
  - 当所有注册数据有效时，处理注册尝试的 PHP 脚本可以将提交的数据存储在 MySQL 数据库表中。\n- 登录工具可以包含在单独的 PHP 脚本中，以便网站的其他页面可以使用。\n\
  - 当所有登录数据有效且在数据库中找到用户时，处理登录尝试的 PHP 脚本可以将用户详情设置为会话数据，以便用户在网站的其他页面之间导航时能被识别。\n\n#\
  \ 9 提供论坛\n\n***本章基于上一章的内容，演示如何创建一个简单的论坛应用程序。***\n\n## 创建论坛数据库\n\n用户消息可以通过 PHP 脚本存储在\
  \ MySQL 数据库表中，以便后续检索并显示在论坛页。通常，包含发布的用户消息的数据库表可能会存储帖子 ID、用户的名和姓、主题、消息本身以及发布日期：\n\n\
  | 列名: | 内容类型: | 示例: |\n| --- | --- | --- |\n| **post_id** | 数字 | 123 |\n| **first_name**\
  \ | 文本 | Mike |\n| **last_name** | 文本 | McGrath |\n| **subject** | 文本 | Ice Cream\
  \ |\n| **message** | 文本 | Delicious on a hot day. |\n| **post_date** | 日期/时间 | 2018-05-14\
  \ 12:30:00 |\n\n此数据库表的设计仅要求为存储文本的列指定 `VARCHAR` 或 `TEXT` 数据类型。帖子 ID 应该是正的（`UNSIGNED`）`INT`\
  \ 值，由表通过 `AUTO_INCREMENT` 自动分配，消息发布时间戳应存储为 `DATETIME` 值。所有这些项目对于向数据库发布消息都是必需的，因此每一列都必须具有\
  \ `NOT NULL` 规则。\n\n\n\n\n\n要将此设计生成为名为“forum”的 MySQL 数据库表，所需的 SQL 命令可以在 MySQL 命令行客户端的提示符处执行。或者，可以将\
  \ SQL 命令保存在 SQL 文件中，通过在 MySQL 命令行客户端提示符处输入 `SOURCE` 命令并接系统上 SQL 文件的路径来实现。\n\n![image](img/forget.jpg)\n\
  \nMySQL 数据库表只能由 root MySQL 用户或其他被授予完全访问权限的 MySQL 用户创建。\n\n![image](img/pg159_1.jpg)\n\
  \n`create_forum.sql`\n\n![image](img/1r.jpg)启动一个纯文本编辑器，并创建一个描述右侧所示表结构要求的 SQL 命令。\n\
  \n```sql\nCREATE TABLE IF NOT EXISTS forum (\npost_id INT UNSIGNED NOT NULL AUTO_INCREMENT\
  \ ,\nfirst_name VARCHAR(20) NOT NULL,\nlast_name VARCHAR(40) NOT NULL,\nsubject\
  \ VARCHAR(60) NOT NULL,\nmessage TEXT NOT NULL,\npost_date DATETIME NOT NULL,\n\
  PRIMARY KEY ( post_id ) ) ;\n```\n\n![image](img/2r.jpg)将文件保存到 `C:\\SQL` 文件夹中并命名为\
  \ `create_forum.sql`，然后启动 MySQL 命令行客户端并以具有完全访问权限的用户（如 root 用户）登录。\n\n![image](img/3r.jpg)接下来，执行命令使用已建立的数据库。\n\
  \n`USE site_db ;`\n\n![image](img/4r.jpg)现在，通过指定系统上 SQL 文件的路径来实现 SQL 命令。\n\n`SOURCE\
  \ C:\\SQL\\create_forum.sql`\n\n![image](img/5r.jpg)最后，执行命令确认表格式。\n\n`EXPLAIN forum\
  \ ;`\n\n![image](img/pg159_2.jpg)\n\n![image](img/hot.jpg)\n\nMySQL 的 `TEXT` 数据类型最多可容\
  \ 65,535 个字符。更大的消息可以使用 `MEDIUMTEXT` 和 `LONGTEXT` 数据类型容纳。\n\n## 提供论坛页面\n\n通常，显示已发布论坛消息的消息板页面可能对注册用户可用。提供此页面的\
  \ PHP 脚本可以通过测试会 数据来检查用户已注册，并在测试失败时重定向到登录页面。测试成功后，可以从 MySQL 论坛数据库表中检索之前发布的消息并在页面上显示，或者脚本也可以简单地提示当前没有消息。论坛消息可以显示页眉和页脚之间，并带有一个指向另一个页面的链接，当前用户可以在该页面发布新的论坛消息。\n\
  \n![image](img/pg160_1.jpg)\n\n`forum.php`\n\n![image](img/1r.jpg)启动一个纯文本编辑器，并使用允许访问会数据的语句开始\
  \ PHP 脚本。\n\n```php\n<?php\nsession_start() ;\n```\n\n![image](img/2r.jpg)现在，添加语句，如果用户尚未登录，将浏览器重定向到登录页面。\n\
  \n```php\nif ( !isset($_SESSION['user_id']) ) )\n{\n    require ( ‘login_tools.php’\
  \ ;\n    load() ;\n}\n```\n\n![image](img/3r.jpg)接下来，添加语句设置页面标题并包含页面页眉。\n\n```php\n\
  $page_title = ‘Forum’ ;\ninclude ( ‘includes/header.html’ ) ;\n```\n\n![image](img/4r.jpg)添加语句打开数据库连接。\n\
  \n```php\nrequire ( '../connect_db.php’ ) ;\n```\n\n![image](img/5r.jpg)现在，添加语句从数据库检索消息或提供默认消息。\n\
  \n```php\n$q = “SELECT * FROM forum” ;\n$r = mysqli_query( $dbc , $q ) ;\nif ( mysqli_num_rows(\
  \ $r ) > 0 )\n{\n    # 在此处插入语句（步骤 6）。\n}\nelse\n{ echo ‘<p>There are currently no\
  \ messages.</p>’ ; }\n```\n\n![image](img/forget.jpg)\n\n在完成登录过程之前，无法访问论坛页面，在在此期间会话变量将被设置。\n\
  \n![image](img/6r.jpg)接下来，插入语句，如果从数据库表中检索到任何消息，则编写一个显示所有消息的表格。\n\n```php\necho ‘<table><tr><th>Posted\
  \ By</th>\n<th>Subject</th><th id=”msg”>Message</th></tr>’;\nwhile ( $row = mysqli_fetch_array(\
  \ $r , MYSQLI_ASSOC ) )\n{\n    echo ‘<tr>\n<td>’.$row['first_name’].’ ‘.$row['last_name’].‘<br>’\n\
  .$row['post_date’].’</td>\n<td>’.$row['subject’].‘</td><td>’.$row['message’].‘</td>\n\
  </tr>’;\n}\necho ‘</table>’ ;\n```\n\n![image](img/7r.jpg)添加语句创建指向此网站其他页面的超链接，包括“发布消息”页面。\n\
