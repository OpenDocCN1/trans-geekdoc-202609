  \ MySQL 服务器数据库的查询结果\n\n```php\n$r \\= mysqli_query ( $dbc , $q ) ;\n```\n\n![image](img/4v.jpg)测试查询是否成功并显示适当的消息\n\
  \n```php\nif ( $r )\n{ echo ‘<h1>Result Set Returned OK</h1>’ ; }\nelse\n{ echo\
