  | --- | --- | --- |\n| code | INT | NOT NULL , |\n| name | VARCHAR(25) | NOT NULL\
  \ , |\n| quantity | INT | DEFAULT 1 NULL , |\n| price | DECIMAL(6,2) | NOT NULL\
  \ |\n) ;\n```\n\n![image](img/pg91_1.jpg)\n\nmodifiers.sql\n\n![image](img/2o.jpg)将文件保存到\
