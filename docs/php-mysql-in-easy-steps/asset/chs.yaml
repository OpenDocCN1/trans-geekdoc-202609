- "# PHP & MySQL 快速入门指南\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n## 安装 Abyss Web 服务器\n## 安装 PHP 引擎\n# 为 Abyss 配置 PHP\n## 嵌入 PHP 脚本\n# 安装 MySQL\
  \ 服务器\n## 使用 MySQL 客户端\n## 创建 MySQL 用户\n## 连接 PHP 与 MySQL\n## 总结\n\n## 介绍 PHP 与\
  \ MySQL\n最具吸引力的现代网站通过动态响应某些当前条件（如用户名、当天时间、最新博客、购物车内容等）来提供定制化的用户体验。这些动态网站中的许多都是使用\
  \ PHP 和 MySQL 创建的。\n\n![image](img/pg8_1.jpg)\n\n## 什么是 PHP？\nPHP 是一种广泛使用的通用型脚本语言，特别适用于\
  \ Web 开发，并可以嵌入到 HTML 中。它由程序员 Rasmus Lerdorf 创建，最初是一组维护其网站的脚本，并于 1995 年 6 月 8 日作为“个人主页工具（PHP\
  \ Tools）版本 1.0”发布。这些脚本在 1997 年的 2 版本中得到了扩展，名称在次年的 3 版本中变为一个递归缩写“PHP: Hypertext Preprocessor（超文本预处理器）”。2000\
  \ 年随着 PHP4 的发布，性能、可靠性和扩展性得到了提高，该版本由新的 Zend 引擎（一个虚拟机）驱动。当前版本 PHP5 由 Zend II 引擎驱动，由\
  \ PHP 组作为免费软件制作。今天，PHP 已安装在超过 2000 万个网站和 100 万台 Web 服务器上。\n\n![image](img/pg8_2.jpg)\n\
  \n## 什么是 MySQL？\nMySQL 是世界上最流行的数据库软件，用于管理存储的数据，被称为数据库管理软件（DBMS）或关系型数据库管理软件（RDBMS）。MySQL\
  \ 由 Michael Wildenius 和 David Axmark 于 1995 年创建。其名称（正式读作“My-SQL”，但通常读作“My Sequel”）是\
  \ Michael 的女儿的名字“My”与“SQL”（结构化查询语言）的组合。MySQL 最初由其创始人创立的 MySQL AB 公司生产，该公司在 2008\
  \ 年被太阳微系统收购，随后于 2010 年被 Oracle 收购。当前版本 MySQL 8.0 由 InnoDB 存储引擎驱动，MySQL 社区版版作为免费软件提供。今天，MySQL\
  \ 被用于一些访问频率最频繁的网站，包括 Google、维基百科、Facebook 和 Twitter。\n\n重要的是，PHP 和 MySQL 都是“服务端”技术——也就是说，它们驻留在\
  \ Web 服务器上。它们不是驻留在用户计算机上的“客户端”技术。因此，它们的魔力发生在“云端”。\n\n## 理解云端\n当用户在浏览器中请求查看网页时，浏览器会向\
  \ Web 服务器请求页面，并通过 HTTP 协议接收响应页面。如果网页包含 PHP 脚本，Web 服务器可能会先调用 PHP 引擎处理代码，并在需要时在发送响应到浏览器之前从\
  \ MySQL 数据库请求数据。\n\n![image](img/pg9_1.jpg)\n\n接下来的页面将描述如何在本地安装以下服务端技术，为数据驱动型网站创建开发环境：\n\
  * Web 服务器 – Abyss Web Server 免费个人版\n* PHP 引擎 – PHP 7.2\n* MySQL 服务器 – MySQL 社区版\
  \ 8.0\n\n![image](img/hot.jpg)\n\nHTTP（超文本传输协议）是通用通信标准，允许任何连接到任何 Web 服务器的计算机访问网络上的文件。书中的示例是用列出的软件创建和测试的，但对于其他版本可能需要修改。\n\
  \n## 安装 Abyss Web 服务器\nAbyss 是一款适用于 Windows、macOS/Mac X 和 Linux 操作系统的免费紧凑型服务器，可以在\
  \ `aprelium.com` 下载。尽管占用空间很小，但 Abyss 支持许多强大的功能，包括使用服务器端脚本生成动态内容——因此是 PHP 和 MySQL\
  \ 的理想伴侣。你可以在自己的电脑上安装 Abyss Web 服务器，为 PHP 和 MySQL 开发提供环境。\n\n![image](img/1b.jpg)\n\
  \n从 `aprelium.com/abyssws/download.php` 下载适用于你系统的 Abyss Web 服务器安装包。\n\n运行下载的可执行文件启动安装向导，然后点击\
  \ Next（下一步）按钮开始。\n\n![image](img/pg12_1.jpg)\n\n接下来，接受许可条款，然后点击 Next（下一步）按钮继续安装。\n\
  \n![image](img/pg12_2.jpg)\n\n关于安装 Abyss Web 服务器的进一步指导，可以在 `aprelium.com/abyssws/start.php`\
  \ 获取。\n\nWindows 版本的 Abyss 安装包是一个名为 `abws1.exe` 的可执行文件，运行它即可安装 Web 服务器。\n\n接受建议的路径\
  \ `C:\\Abyss Web Server`，然后选择将 Abyss 安装为 Windows 服务。\n\n下一步，选择你偏好的语言，然后输入以后访问 Abyss\
  \ 服务器所需的用户名和密码。\n\n现在，使用选择的用户名和密码登录，查看 Abyss 控制台确认服务器状态为 Running（运行）。\n\n最后，在浏览器地址栏中输入\
  \ `http://localhost`，然后按回车键查看由 Abyss Web 服务器提供的默认欢迎页面。\n\n如果你选择 Manual（手动）选项，Abyss\
  \ 标志将不会出现在系统托盘中以便快速启动/停止和访问服务器控制台。相反，可以通过浏览器访问 `http://localhost:9999` 控制台。\n\n\
  在 Abyss 控制台中，点击 Configure（配置）按钮然后点击 General（常规）图标，查看默认 HTTP 端口为 80，默认 Documents\
  \ Path（你的网页所在路径）为 `/htdocs`。\n\n## 安装 PHP 引擎\nPHP 解释器“引擎”用于网页中实现 PHP 脚本，适用于 Windows、macOS/Mac\
  \ X 和 Linux 操作系统，可在 `php.net` 免费下载。\n\n关于 PHP 安装的进一步指导可以在 `php.net/manual/en/install.php`\
  \ 获取。\n\n此外，从 `aprelium.com` 提供了适用于 Windows Abyss Web 服务器的预配置包，推荐用于快速安装。\n\n从 `aprelium.com/downloads`\
  \ 下载适用于你系统的 PHP 安装包。\n\n运行下载的可执行文件启动安装向导，然后点击 Next（下一步）按钮开始。\n\n接下来，接受许可条款，然后点击\
  \ Next（下一步）按钮继续安装。\n\n如果从 `php.net` 为 Windows 安装 PHP，请确保选择 VC6 Thread Safe 版本——因为它需要的\
  \ Windows 依赖较少。\n\n接受建议的路径 `C:\\Program Files\\PHP7`，然后点击 Install（安装）按钮继续。\n\n最后，安装完成后点击\
  \ Finish（完成）按钮关闭安装向导。\n\n在为 Abyss Web 服务器配置 PHP 时需要 PHP 的安装位置——请记录目标文件夹。\n\n\n\n\
  \n安装 PHP 后，Web 服务器尚无法执行 PHP 脚本，除非对其进行配置以识别这些脚本并找到 PHP 解释器引擎——所有说明如第 14-15 页 所示。\n\
  \n## 为 PHP 配置 Abyss\n\n必须配置 Abyss Web 服务器以识别 PHP 脚本，并在遇到它们时使用 PHP 解释器。这可以通过 Abyss\
  \ 服务器控制台实现：将 `.php` 文件扩展名关联为 PHP 脚本，并指定系统上 PHP 引擎的位置来解释它们。\n\n![image](img/pg14_1.jpg)\n\
  \n关于 Abyss Web 服务器配置的更多指导，可以在在线访问：**[aprelium.com/abyssws/start.html](http://www.aprelium.com/abyssws/start.html)**。\n\
  \n![image](img/1b.jpg)在浏览器地址栏中输入 `http://localhost:9999`（或点击系统托盘中的 Abyss 图标）启动 Abyss\
  \ 服务器控制台，然后点击 `Configure` 按钮打开配置页面。\n\n![image](img/pg14_2.jpg)\n\n![image](img/2b.jpg)接下来，点击\
  \ ![image](img/pg14_3.jpg)Scripting Parameters 图标打开 Scripting Parameters 页面进行编辑。\n\
  \n![image](img/3b.jpg)确保勾选 `Enable Scripts Execution` 复选框，然后点击 Interpreters 表格中的\
  \ `Add` 按钮打开 Interpreters-Add 页面。\n\n![image](img/4b.jpg)现在，将 `Interface` 设置为“FastCGI”，将\
  \ `Interpreter` 设置为系统上 PHP 解释器 (`php-cgi.exe`) 的路径，并 `Add` 文件扩展名 `.php` 然后点击 `OK`。\n\
  \n![image](img/pg14_4.jpg)\n\n![image](img/hot.jpg)\n\n`localhost` 域名是 IP 地址 `127.0.0.1`\
  \ 的别名——因此 Abyss Web 服务器控制台也可以通过 `http://127.0.0.1:9999` 访问。\n\n![image](img/5b.jpg)在控制窗口中点击\
  \ `OK`，然后点击 `Restart` 按钮将更改应用于 Abyss 配置。\n\n![image](img/pg15_1.jpg)\n\n现在 Abyss\
  \ Web 服务器应已在您的系统中运行，并正确配置为识别具有 `.php` 文件扩展名的文档应由 PHP 引擎解释。现在可以通过创建一个简单的 PHP 脚本由\
  \ Abyss 为您的 浏览器提供服务来测试配置。\n\n![image](img/pg15_2.jpg)\n\n`phpinfo.php`\n\n![image](img/6b.jpg)打开一个纯文本编辑器并准确输入以下脚本：\n\
  \n```php\n<?php phpinfo() ?>\n```\n\n![image](img/7b.jpg)将脚本保存为 `phpinfo.php`，位于\
  \ Abyss 文档路径目录中，通常位于 `C:\\Abyss Web Server\\htdocs`。\n\n![image](img/8b.jpg)在浏览器地址栏中准确输入位置\
  \ `http://localhost/phpinfo.php`，查看 Abyss 提供的包含您的 PHP 版本信息的网页。\n\n![image](img/pg15_3.jpg)\n\
  \n![image](img/forget.jpg)\n\nPHP 脚本对大小写敏感，因此您必须仅使用小写字母复制列出的脚本。\n\n![image](img/snake.jpg)\n\
  \n文档只有在 Web 服务器使用 HTTP 协议提供服务时才能被 PHP 引擎解释。您不能直接在浏览器中打开 PHP 文件。请始终使用位置 `http://localhost/`。\n\
  \n## 嵌入 PHP 脚本\n\nPHP 脚本可以嵌入 HTML 文档中——这意味着 PHP 和 HTML 代码可以和谐地存在于同一个文件中。所有嵌入的 PHP\
  \ 代码必须包含在 `<?php` 和 `?>` 标签内，以便 PHP 引擎能够识别并进行解释。通常，PHP 代码会将内容写入 HTML 文档的 body 部分，然后发送到\
  \ 浏览器。\n\n![image](img/pg16_1.jpg)\n\n`hello.php`\n\n![image](img/1b.jpg)启动纯文本编辑器并创建一个带有空\
  \ body 部分的有效基础 HTML5 文档：\n\n```html\n<!DOCTYPE HTML>\n<html lang=\"en\">\n<head><meta\
  \ charset=\"UTF-8\">\n<title>Getting Started With PHP</title>\n</head>\n<body>\n\
  </body>\n</html>\n```\n\n```php\n<?php\necho \"Hello World!\";\n?>\n```\n\n\n\n\
  记下你选择的 root 用户密码、用户名和用户密码——你将经常需要它们。\n\n![image](img/hot.jpg)\n\n在继续之前，确保 MySQL\
  \ 服务器配置成功完成。如有必要，请重复安装过程。\n\n## 使用 MySQL 客户端\n\n在将 MySQL 服务器安装为 Windows 服务后（详情请参见第\
  \ 18-19 页），你可以通过随服务器包一起安装的 MySQL 命令行客户端与数据库进行通信。启动后，它会首先要求你输入在安装期间选择的 root 用户密码。密码验证后，MySQL\
  \ 命令行客户端将显示 `mysql>` 命令提示符，你可以在其中创建和操作数据库。\n\n![image](img/1b.jpg)从已添加到开始菜单的 MySQL\
  \ 组启动 MySQL 命令行客户端，然后输入安装时选择的 root 密码\n\n![image](img/pg20_1.jpg)\n\n![image](img/2b.jpg)在\
  \ `mysql>` 提示符下，准确输入此命令以创建一个名为“site\\_db”的新数据库\n\n```\nCREATE DATABASE IF NOT EXISTS\
  \ site\\_db ;\n```\n\n![image](img/3b.jpg)现在，准确输入另一条命令来显示你的 MySQL 服务器上当前的所有数据库\n\
  \n```\nSHOW DATABASES ;\n```\n\n![image](img/pg20_2.jpg)\n\n![image](img/hot.jpg)\n\
  \nMySQL 命令行客户端也可以通过执行命令 `mysql -u root -p` 从常规命令提示符启动（前提是 `mysql` 已添加到你的系统 Path\
  \ 中），或者在其 `/bin` 目录内启动。\n\n![image](img/snake.jpg)\n\n所有 MySQL 命令都以 `;` 分号结束。\n\n\
  ![image](img/forget.jpg)\n\n安装会创建一些默认数据库，例如“sys”，但你的“site\\_db”数据库将是本书中使用的数据库。\n\
  \n## 创建 MySQL 用户\n\n虽然 MySQL root 用户允许对 MySQL 服务器上的数据库具有完全控制权，但为了数据库的最佳安全性，显然不建议允许其他用户拥有这种自由。因此，root\
  \ 用户可以创建具有特定“权限”的用户，用以控制他们在 MySQL 服务器上可以执行的操作。\n\nroot 用户可以在 MySQL 命令行客户端中通过执行一个识别唯一用户的子句来创建用户，如下所示：\n\
  \n```\nCREATE USER IF NOT EXISTS ‘username’@’hostname’*\nIDENTIFIED WITH mysql\\\
  _native\\_password BY ‘password’* ;\n```\n\nroot 用户随后可以执行一个子句，为特定用户指定特定数据库允许的权限，如下所示：\n\
  \n```\nGRANT *privileges* ON database.\\* TO ‘username’@‘hostname’* ;\n```\n\n权限以逗号分隔列表的形式指定，用户在访问指定数据库时可以使用这些关键字。例如，`SELECT`、`INSERT`\
  \ 和 `UPDATE` 等基本权限。\n\n![image](img/1b.jpg)以 root 用户身份登录 MySQL 命令行客户端，然后准确输入此子句来创建用户\n\
  \n```\nCREATE USER IF NOT EXISTS ‘mike’@’locahost’\nIDENTIFIED WITH mysql\\_native\\\
  _password BY ‘easysteps’ ;\n```\n\n![image](img/2b.jpg)接下来，允许访问“site\\_db”数据库的权限\n\
  \n```\nGRANT SELECT, INSERT, UPDATE ON site\\_db.\\*\nTO ‘mike’@‘localhost’ ;\n\
  ```\n\n![image](img/3b.jpg)现在，执行一个子句来确认此用户的权限\n\n```\nSHOW GRANTS FOR ‘mike’@’localhost’\
  \ ;\n```\n\n![image](img/pg21_1.jpg)\n\n![image](img/snake.jpg)\n\nMySQL 是大小写敏感的且要求语法精确——你必须确保使用与列出的正确的空格和大小写。例如，不要在定义用户名和主机的\
  \ @ 字符周围留空格。\n\n![image](img/new.jpg)\n\nMySQL 8 引入了 `caching\\_sha2\\_password`\
  \ 认证，但仍可以使用早期的 `mysql\\_native\\_password` 认证来指定未加密密码。\n\n## 连接 PHP 与 MySQL\n\n\
  在 PHP 中可以使用标准脚本尝试连接 MySQL 数据库，该脚本描述了四个连接参数：主机、用户名、密码和数据库名。如果失败，脚本将提供描述性消息；如果成功，它将指定在与数据库服务器之间发送数据时使用的字符集：\n\
  \n```php\n$dbc = mysqli\\_connect ( ‘host’, ‘user’, ‘password’, ‘database’ )\nOR\
  \ die ( mysqli\\_connect\\_error() ) ;\nmysqli\\_set\\_charset( $dbc, ‘charset’\
  \ ) ;\n```\n\n在此阶段你不需要详细了解脚本如何工作，但要意识到它包含敏感信息。出于这个原因，它不应该像其他 PHP 脚本那样放在 Web 服务器的\
  \ `/htdocs` 目录（那里内容可能被访问），而应该安全地放置在 `/htdocs` 的父目录——例如，放在 `C:/Abyss Web Server`\
  \ 目录，而不是 `C:/Abyss Web Server/htdocs` 目录。\n\n任何 PHP 脚本都可以通过“require”语句指定另一个脚本的路径来引入另一个\
  \ PHP 脚本。这一功能可以很好地用于引入连接脚本而不暴露其敏感信息。\n\n![image](img/pg22_1.jpg)\n\nconnect\\_db.php\n\
  \n![image](img/1b.jpg)启动纯文本编辑器，并创建一个描述之前页面参数的连接脚本\n\n```php\n<?php\n# 连接到 ‘localhost’\n\
  ## 用于用户 ‘mike’\n## 使用密码 ‘easysteps’ 连接数据库 ‘site_db’\n$dbc = mysqli\\_connect ( ‘host’,\
  \ ‘user’, ‘password’, ‘database’ )\nOR die ( mysqli\\_connect\\_error() ) ;\n##\
  \ 设置字符集。\nmysqli\\_set\\_charset( $dbc, ‘charset’ ) ;\n```\n\n![image](img/2b.jpg)将该文件保存在\
  \ Web 服务器的 `/htdocs` 的父目录中，命名为 connect\\_db.php\n\n![image](img/3b.jpg)\n\nrequire.php\n\
  \n![image](img/4b.jpg)现在，编写一个引入连接脚本的脚本\n\n```php\n<?php\n## 引入连接脚本。\nrequire (../connect_db.php\
  \ ;\n```\n\n![image](img/5b.jpg)将脚本保存在 Web 服务器的 `/htdocs` 目录中，命名为 require.php，然后在浏览器中打开它以查看连接详情\n\
  \n![image](img/6b.jpg)接下来，通过添加显示指令来完成此脚本\n\n```php\n## 显示 MySQL 版本和主机。\nif( mysqli_ping(\
  \ $dbc ) )\n{ echo ‘MySQL Server ‘ . mysqli_get_server_info( $dbc ).\n’connected\
  \ on ‘ . mysqli_get_host_info( $dbc ) ; }\n```\n\n![image](img/pg23_1)临时修改 connect\\\
  _db.php 将数据库更改为不存在的名称，然后保存文件并在浏览器中刷新页面以查看错误\n\n![image](img/pg23_2)\n\n![image](img/pg23_3)最后，通过将数据库名称改\
  \ site\\_db 来修正 connect\\_db.php 脚本，然后保存文件并刷新页面看到再次成功\n\n恭喜，你现在已成功配置了用于开发的 Abyss\
  \ Web Server、PHP 引擎和 MySQL 服务器。\n\n![image](img/forget.jpg)\n\n你现在不需要理解这些脚本如何工作——它们仅仅确保你可以用\
  \ PHP 连接 MySQL。但你以后可以参考它们，看看你 PHP 知识的进展。\n\n## 总结\n\n•PHP 是一种脚本语言，特别适用于 Web 开发，因为它可以嵌入\
  \ HTML 中。\n\n•MySQL 是一种关系型数据库管理软件（RDBMS），可以为网站提供后端数据存储。\n\n•PHP 和 MySQL 都是服务器端技术，从云端向浏览器交付数据驱动的网站。\n\
  \n•通过安装 Web 服务器、PHP 引擎和 MySQL 服务器可以创建一个本地开发环境。\n\n•Web 服务器必须配置为识别脚本，以便将其重定向到 PHP\
  \ 引擎进行解释。\n\n\n\n\n*   所有嵌入的 PHP 代码必须包含在 `<?php` 和 `?>` 标签中，以便 PHP 引擎能够识别。\n*  \
  \ 包含 PHP 脚本的文档最好使用流行的 UTF-8 格式进行编码。\n*   MySQL Server 可以安装在 Windows 系统上作为后台服务运行，以便它始终随时可用。\n\
  *   MySQL 命令行客户端随服务器包一起安装，可以创建和操作数据库。\n*   安装 MySQL 时选择的 root 用户密码可用于启动 MySQL 命令行客户端。\n\
  *   在 PHP 中，可以使用标准脚本尝试连接 MySQL 数据库，该脚本描述了 `Host`、`Username`、`Password` 和数据库名称等连接参数。\n\
  *   任何 PHP 脚本都可以通过 `require` 语句并指定另一个脚本的路径来包含另一个 PHP 脚本。\n\n# 2 执行操作\n\n本章演示了如何使用\
  \ PHP 运算符来存储和处理数据。\n\n* 创建变量\n* 管理字符串\n* 生成数组\n* 排序数组\n* 描述维度\n* 进行算术运算\n* 比较值\n\
  * 评估逻辑\n* 定义常量\n* 总结\n\n## 创建变量\n\n“变量”是 PHP 脚本中一个命名的容器，可以在其中存储数据值。存储的值可以使用变量名进行引用，并随着脚本的执行而更改（变化）。脚本作者可以为变量选择任何名称，只要它遵循以下三个命名规范：\n\
  \n*   名称必须以 `$` 美元符号开始——例如 `$name`。\n*   名称可以由字母、数字和下划线字符组成，但不能包含空格——例如 `$subtotal_1`。\n\
  *   `$` 符号后的第一个字符必须是字母或下划线字符——不能是数字。\n\n注意，PHP 中的变量名是区分大小写的，因此 `$name`、`$Name` 和\
  \ `$NAME` 是三个相互独立的变量。\n\nPHP 变量是“弱类型”的，这意味着它们可以包含任何类型的数据，与某些语言中的“强类型”变量不同（在那些语言中创建变量时必须指定数据类型）。因此，PHP\
  \ 变量可以很方便地包含整数、浮点数、文本字符串、布尔值 `TRUE` 或 `FALSE`、或者一个对象，或者一个 `NULL` 空值。\n\n在 PHP 脚本中，只需声明变量名称即可创建变量。然后可以使用\
  \ `=` 赋值运算符指定其值来为其分配初始值（初始化）。该语句以及 PHP 中的所有语句都必须以分号结束，如下：\n\n```php\n$body_temp\
  \ = 98.6 ;\n```\n\n然后可以通过引用变量名来显示变量中包含的值，如下所示：\n\n```php\necho $body_temp ;\n```\n\
  \n非常有用的是，可以通过将字符串和变量名括在双引号中，将变量的值作为混合字符串的一部分显示：\n\n```php\necho “Body temperature\
  \ is $body_temp degrees Fahrenheit” ;\n```\n\n双引号确保 PHP 将评估整个字符串并将命名的变量替换为其存储的值。如果字符串被括在单引号中，此功能将不起作用！\n\
  \n![image](img/snake.jpg)\n\n不要混淆双引号和单引号的作用。记住，PHP 只对括在双引号内的混合字符串进行变量替换。\n\n![image](img/1r.jpg)创建一个有效的\
  \ HTML 文档，如第 16 页的此处列出的那个，然后向 body 部分插入 PHP 标签\n\n```php\n<?php\n### 插入在此处的语句。\n\
  ?>\n```\n\n![image](img/pg27_1.jpg)\n\nvariable.php\n\n![image](img/2r.jpg)现在，在\
  \ PHP 标签之间插入一条语句来创建并初始化一个变量\n\n```php\n$body_temp = 98.6 ;\n```\n\n![image](img/3r.jpg)接下来，插入一条语句单独显示变量值\n\
  \n```php\necho $body_temp ;\n```\n\n![image](img/4r.jpg)然后，插入一条语句显示在混合字符串中替换的变量值——在双引号中赋值\n\
  \n```php\necho “<p>Body temperature is $body_temp degrees Fahrenheit ” ;\n```\n\n\
  ![image](img/5r.jpg)插入一条语句为变量分配新值\n\n```php\n$body_temp = 37.0 ;\n```\n\n![image](img/6r.jpg)最后，插入一条语句显示在混合字符串中替换的新变量值\n\
  \n```php\necho “( $body_temp degrees Celsius )</p>” ;\n```\n\n![image](img/7r.jpg)将文档保存到网络浏览器的\
  \ `/htdocs` 目录下并命名为 `variable.php`，然后通过 HTTP 访问页面以查看变量的值\n\n![image](img/pg27_2.jpg)\n\
  \n![image](img/hot.jpg)\n\n注意，在脚本主体中创建的变量（如示例所示）可以在整个 PHP 脚本中“全局”地访问。\n\n![image](img/forget.jpg)\n\
  \nPHP 语言中的每个语句都必须以分号结束——就像每个语句一样。\n\n## 管理字符串\n\n文本“字符串”可以像数值一样存储在变量中，但赋值必须用引号括字符串。单引号和双引号都可以用于此目的。\n\
  \n```php\n$title = “Sumertime Blues ;\n$title = ‘Sumertime Blues’\n```\n\n如果你希望存储一个包含引号的字符串，可以在引号前加上\
  \ `\\` 反斜杠字符来“转义”它们，或者使用另一种类型的引号。例如：\n\n```php\n$song_title = “the \\\"Sumertime\\\
  \" aria by Gerswin” ;\n$song_title = ‘the “Sumertime” aria by Gerswin’ ;\n```\n\n\
  使用双引号的这种技术更易读，并在书中推荐这种方法。\n\n可以通过将混合字符串括在双引号中将其显示为混合字符串的一部分，如下：\n\n```php\necho\
  \ “Many regard $song_title as a classic” ;\n```\n\n可以使用 `.` 连接连接字符串，如下：\n\n```php\n\
  $hi = ‘Hello’ ;\n$bye = ‘Goodbye’ ;\n$song_title = $hi . $bye ; # ‘HelloGoodbye’\n\
  ```\n\n此外，在连接字符串时可以很好地插入空格和标点，因此上面的标题赋值可以修改为包含逗号和空格：\n\n```php\n$song_title = $hi\
  \ . ‘‘ . $bye ; # ‘Hello, Goodbye’\n```\n\n![image](img/forget.jpg)\n\n变量名不能包含空格——但下划线字符经常用于替代。\n\
  \n![image](img/1r.jpg)创建一个有效的 HTML 文档，如第 16 页的此处列出的那个，然后向 body 部分插入 PHP 标签\n\n```php\n\
  <?php\n### 插入在此处的语句。\n?>\n```\n\n![image](img/pg29_1.jpg)\n\nstring.php\n\n![image](img/2r.jpg)现在，在\
  \ PHP 标签之间插入两条语句来创建并初始化两个变量\n\n```php\n$phrase = ‘The truth is rarely pure’ ;\n\
  $author = ‘Oscar Wilde’ ;\n```\n\n![image](img/3r.jpg)接下来，插入一条语句单独显示变量值\n\n```php\n\
  echo $phrase ;\n```\n\n![image](img/4r.jpg)然后，插入一条语句显示在混合字符串中替换的变量值——在双引号中赋值\n\n\
  ```php\necho “<p>It is often said that <q>$phrase</q> </p>” ;\n```\n\n![image](img/5r.jpg)插入一条语句将字符串连接到变量\n\
  \n\n\n\n\n```php\n$phrase = $phrase . ‘ and never simple’ ;\n```\n\n![image](img/6r.jpg)最后，插入一个语句来显示在混合字符串中替换的当前变量值\n\
  \n```php\necho “<p><q>$phrase</q><cite>$author</cite></p>” ;\n```\n\n![image](img/7r.jpg)将文档保存到网络浏览器的\
  \ `/htdocs` 目录并命名为 `string.php`，然后通过 HTTP 打开该页面，查看变量值的显示情况\n\n![image](img/pg29_2.jpg)\n\
  \n![image](img/hot.jpg)\n\n你也可以使用简写连接赋值运算符 `.=` 来连接两个字符串——这样 `$a = $a . $b` 就可以简单写成\
  \ `$a .= $b`。\n\n![image](img/hot.jpg)\n\n为你的变量采用一致的命名风格——例如全小写的 `$my_var` 或“驼峰命名法”\
  \ `$myVar`。\n\n## 创建数组\n\n数组变量可以在顺序的数组“元素”中存储多个数据项，这些元素从零开始编号（“索引”）。因此，第一个数组值存储在编号为零的元素中。可以使用变量名后跟方括号中的索引数字来引用单个数组元素值。例如，`$months[0]`\
  \ 引用存储在第一个元素中的值，`$months[1]` 引用存储在第二个元素中的值，依此类推。\n\n可以通过创建多个向连续元素赋值的语句来创建变量数组，或者通过使用单个语句使用\
  \ PHP 的 `array()` 函数来填充元素：\n\n```php\n$months[] = ‘January’ ;\n$months[] = ‘February’\
  \ ;\n$months[] = ‘March’ ;\n```\n\n```php\n$months = array( ‘January’ , ‘February’\
  \ , ‘March’ ) ;\n```\n\n这两种方法都会创建一个数组，其中每个元素中存储的值可以使用其索引数字来引用，例如 `$months[0]`。\n\
  \n在创建数组时，你可以可选地为每个元素指定一个键名（key），用于引用该元素的值：\n\n```php\n$months['jan'] = ‘January’\
  \ ;\n$months['feb'] = ‘February’ ;\n$months['mar'] = ‘March’ ;\n```\n\n```php\n\
  $months = array( ‘jan’ => ‘January’ , ‘feb’ => ‘February’ , ‘mar’ => ‘March’ ) ;\n\
  ```\n\n这两种方法都会创建一个数组，其中每个元素中存储的值可以使用其键名来引用，例如 `$months['jan']`。\n\n可以使用 `foreach`\
  \ 循环访问数组的所有元素，依次引用每个元素的值并将其赋值给变量：\n\n```php\nforeach( $months as $value )\n{\n \
  \   # 在每次迭代中使用当前的 $value。\n}\n```\n\n也可以在循环的每次迭代中通过以下方式访问键：\n\n```php\nforeach(\
  \ $months as $key => $value )\n{\n    # 在每次迭代中使用当前的 $key 和 $value。\n}\n```\n\n![image](img/forget.jpg)\n\
  \n方括号表示“元素”，因此在使用 `array()` 函数进行赋值时，变量名后不需要方括号——只有在访问元素时才需要。\n\n![image](img/snake.jpg)\n\
  \n如果你指定了两次键名，第二个值将覆盖该元素中的第一个值。\n\n![image](img/1r.jpg)创建一个有效的 HTML 文档，如此处第 16 页列出的文档，然后在\
  \ body 部分插入 PHP 标签\n\n```php\n<?php\n### 在此处插入的语句。\n?>\n```\n\n![image](img/pg31_1.jpg)\n\
  \narray.php\n\n![image](img/2r.jpg)现在，在 PHP 标签之间插入一个语句创建并初始化一个带有值的变量数组\n\n```php\n\
  $days = array( ‘Monday’ , ‘Tuesday’ , ‘Wednesday’ ) ;\n```\n\n![image](img/3r.jpg)接下来，插入一个语句，以项目符号列表的形式显示所有数组元素中的值\n\
  \n```php\nforeach( $days as $value ) { echo “&bull; $value “ ; }\n```\n\n![image](img/4r.jpg)然后，插入一个语句创建并初始化一个包含键和值的变量数组\n\
  \n```php\n$months = array( ‘jan’ => ‘January’ ,\n‘feb’ => ‘February’ , ‘mar’ =>\
  \ ‘March’ ) ;\n```\n\n![image](img/5r.jpg)最后，插入语句以定义列表的形式显示所有元素中的键和值\n\n```php\n\
  echo ‘<dl>’ ;\nforeach( $months as $key => $value )\n{ echo “<dt>$key<dd>$value”\
  \ ; }\necho ‘</dl>’ ;\n```\n\n![image](img/6r.jpg)将文档保存到网络浏览器的 `/htdocs` 目录并命名为\
  \ `array.php`，然后通过 HTTP 打开该页面，查看变量数组元素值的显示情况\n\n![image](img/pg31_2.jpg)\n\n![image](img/hot.jpg)\n\
  \n你可以将第一个元素的键设置为 1，这样索引将从 1 而不是 0 开始，使用 `$months = array( 1 => ‘January’ , ‘February’\
  \ , March’);`\n\n![image](img/hot.jpg)\n\n你可以使用 PHP 的 `range()` 函数轻松创建包含顺序数字或字母的数组。例如：\n\
  \n```php\n$six = range( 1 , 6 ) ;\n```\n\n```php\n$a = range( ‘a’ , ‘z’ )\n```\n\
  \n### 数组排序\n\nPHP 提供了两个实排序函数：`sort()` 和 `rsort()`。这些函数根据值进行排序并丢弃键。例如：\n\n```php\n\
  $fruits = array( ‘a’ => ‘apple’ , ‘b’ => ‘banana’ , ‘c’ => ‘cherry’ ) ;\nsort( $fruits\
  \ );\n```\n\n执行 `sort()` 之后，数组变为：\n\n```php\n$fruits = array( 0 => ‘apple’ , 1 =>\
  \ ‘banana’ , 2 => ‘cherry’ ) ;\n```\n\n如果你想降序排序数组，可以使用 `rsort()`。该函数也按值排序但会丢弃键：\n\
  \n```php\nrsort( $fruits );\n```\n\n数组变为：\n\n```php\n$fruits = array( 0 => ‘cherry’\
  \ , 1 => ‘banana’ , 2 => ‘apple’ ) ;\n```\n\n如果你想保留原始键，可以使用 `ksort()` 和 `krsort()`。`ksort()`\
  \ 按键升序排序数组：\n\n```php\nksort( $fruits );\n```\n\n键将被保留。\n\n如果你想按键降序排序数组，可以使用 `krsort()`：\n\
  \n```php\nkrsort( $fruits );\n```\n\n如果你想按值排序但保留键，可以使用 `asort()` 和 `arsort()`。`asort()`\
  \ 按值升序排序并保留键：\n\n```php\nasort( $fruits );\n```\n\n键将被保留。\n\n如果你想按值降序排序但保留键，可以使用\
  \ `arsort()`：\n\n```php\narsort( $fruits );\n```\n\n键将被保留。\n\n\n\n\n\n![image](img/forget.jpg)\n\
  \n在键（key）重要的情况下，请勿使用 `sort()` 或 `rsort()` 函数。\n\n### 描述维度\n\n数组元素的编号更准确的说法是“数组索引”（array\
  \ index），由于元素编号从零开始，所以有时被称为“零基索引”。使用单个索引创建的数组是一维数组，其元素出现在单行中：\n\n![image](img/pg34_1.jpg)\n\
  \n| 元素内容... || **A** || **B** || **C** || **D** || **E** |\n| --- | --- | --- |\
  \ --- | --- | --- |\n| 索引数字... || [0] || [1] || [2] || [3] || [4] |\n\n数组也可以有多个索引——用于表示多个维度。使用两个索引创建的数组是二维数组，其元素出现在多行中：\n\
  \n| 第一个索引 || [0] || **A** || **B** || **C** || **D** || **E** |\n| --- | --- | ---\
  \ | --- | --- | --- |\n| 第二个索引 || [1] || **F** || **G** || **H** || **I** || **J**\
  \ |\n| | [0] || [1] || [2] || [3] || [4] |\n\n在多维数组中，每个元素的值通过指定每个索引的数字来引用。例如，对于上面的二维数组，`[1]\
  \ [2]` 处的元素包含字母 `H`。\n\n二维数组用于存储基于网的信息，例如 XY 坐标。创建一个具有三个索引的三维数组将允许存储 XYZ 坐标。\n\n\
  在 PHP 中创建多维数组只需是创建一个外部数组，其元素本身也是数组。与往常一样，你可以选择性地为每个元素指定一个键名——在这种情况下，用于表示每个内部数组。然后可以使用键名和内部索引数字来引用单独的值：\n\
  \n`$matrix['Letter'][0]`\n\n然而，当在字符串中使用带引号键的数组变量时，必须始终将其括在花括号内：\n\n`echo “Element\
  \ value is {$matrix['Letter'][0]} ” ;`\n\n可以使用 `foreach` 循环通过遍历数组来访问多维数组中的所有内部数组。然后可以使用嵌套的\
  \ `foreach` 循环依次引用每个元素。\n\n![image](img/snake.jpg)\n\n超过两个索引的多维数组可能会产生难以阅读的源代码，并可能导致错误。\n\
  \n![image](img/1r.jpg)创建一个有效的 HTML 文档，如此处第 16 页 所示的那样，然后在 body 部分插入 PHP 标签：\n\n\
  ```php\n<?php\n### 在此处插入语句。\n?>\n```\n\n![image](img/pg35_1.jpg)\n\nmatrix.php\n\
  \n![image](img/2r.jpg)现在，在 PHP 标签之间插入一条语句，创建并初始化两个普通变量数组和一个带键名的二维数组：\n\n`$letters\
  \ = array( ‘A’ , ‘B’ , ‘C’ ) ;`\n`$numbers = array( 1 , 2 , 3 ) ;`\n`$matrix = array(\
  \ ‘Letter’ => $letters , ‘Number’ => $numbers ) ;`\n\n![image](img/3r.jpg)接下来，插入一条语句来显示存储的单个值：\n\
  \n`echo “<p>Start : {$matrix['Letter'][0]} </p>” ;`\n\n![image](img/4r.jpg)最后，插入语句将所有元素中的键和值以两个无序列表的形式显示：\n\
  \n```php\nforeach( $matrix as $array => $list )\n{\n    echo ‘<ul’ ;\n    foreach(\
  \ $list as $key => $value )\n    { \n        echo “<li>$array [ $key ] = $value”\
  \ ; \n    }\n    echo ‘</ul>’ ;\n}\n```\n\n![image](img/5r.jpg)将文档保存到 浏览器的 `/htdocs`\
  \ 目录中作为 `matrix.php`，然后通过 HTTP 打开页面以查看变量数组值的显示：\n\n![image](img/pg35_2.jpg)\n\n\
  ![image](img/hot.jpg)\n\n多维数组比你想象的要常见。例如，允许对相同名称输入进行多次选择的 HTML 表单是以多维数组的形式提交的。\n\
  \n![image](img/forget.jpg)\n\n使用引号键的数组变量在包含字符串字符串时必须括在花括号内。\n\n### 算术运算\n\nPHP 脚本中常用的算术运算符下表所示，以及它们执行的操作：\n\
  \n| 运算符: | 操作: |\n| --- | --- |\n| `+` | 加法 |\n| `-` | 减法 |\n| `*` | 乘法 |\n| `/`\
  \ | 除法 |\n| `%` | 取模 |\n| `++` | 递增 |\n| `--` | 递减 |\n\n加、减、乘、除法运算符的作用如你所预期的那样工作。然而，当使用多个运算符时，必须对表达式进行分组以保持清晰度：\n\
  \n`a = b * c -d % e / f ; # 这不清晰.`\n`a = ( b * c ) - ( ( d % e ) / f ) ; # 这清晰得多.`\n\
  \n\n\n\n\n`==` 等于运算符会比较两个操作数，如果两者的数值值相等，则返回一个布尔值 `TRUE` 结果，否则返回 `FALSE`。字符和字符串也会根据它们的\
  \ ASCII 代码值进行数值比较。相反，`!=` 不等运算符在两个操作数不相等时返回 `TRUE`，否则返回 `FALSE`。\n\n`>` “大于”运算符比较两个操作数，如果第一个操作数的值大于第二个操作数，则返回\
  \ `TRUE`；如果它的值等于或小于另一个值，则返回 `FALSE`。`<` “小于”运算符执行相同的比较，但如果第一个操作数的值小于第二个操作数，则返回 `TRUE`，否则返回\
  \ `FALSE`。在 `>` “大于”或 `<` “小于”运算符后添加 `=` 运算符，可以使其在两个操作数完全相等时也返回 `TRUE`。\n\n`?:`\
  \ 三元运算符评估一个表达式以得到 `TRUE` 或 `FALSE` 的布尔值，然后根据评估结果执行两个条语句中的一条。可以使用此语法将适当的返回值赋值给变量：\n\
  \n`$var = ( *expression*) ? *if-TRUE-return-this* : *if-FALSE-return-this* ;`\n\n\
  ![image](img/hot.jpg)\n\n相等和不等运算符用于测试两个变量的状态，以便在 PHP 脚本中执行条件分支。\n\n![image](img/1r.jpg)创建一个有效的\
  \ HTML 文档，如此处第 16 页列出的那样，然后在 body 部分插入 PHP 标签\n\n```php\n<?php\n\n### 在此处插入语句。\n\
  \n?>\n```\n\n![image](img/pg39_1.jpg)\n\ncomparison.php\n\n![image](img/2r.jpg)现在，在\
  \ PHP 标签之间插入语句创建并初始化五个变量\n\n`$zero = 0 ; $nil = 0 ; $one = 1 ; $upr = ‘A’ ; $lwr\
  \ = ‘a’ ;`\n\n![image](img/3r.jpg)接下来，插入语句显示相等比较\n\n`$result = ( $zero == $nil )\
  \ ? ‘TRUE’ : ‘FALSE’`\n\n`echo “0 == 0 is $result <br>” ;`\n\n`$result = ( $zero\
  \ == $one ) ? ‘TRUE’ : ‘FALSE’ ;`\n\n`echo “0 == 1 is : $result <br>” ;`\n\n`$result\
  \ = ( $upr == $lwr ) ? ‘TRUE’ : ‘FALSE’ ;`\n\n`echo “A == a is $result <br>” ;`\n\
  \n`$result = ( $upr != $lwr ) ? ‘TRUE’ : ‘FALSE’ ;`\n\n`echo “A != a is $result\
  \ <hr>” ;`\n\n![image](img/4r.jpg)最后，插入语句显示大于比较\n\n`$result = ( $one > $nil ) ?\
  \ ‘TRUE’ : ‘FALSE’ ;`\n\n`echo “1 > 0 is $result <br>” ;`\n\n`$result = ( $zero\
  \ >= $nil ) ? ‘TRUE’ : ‘FALSE’ ;`\n\n`echo “0 >= 0 is $result <br>” ;`\n\n`$result\
  \ = ( $one <= $nil ) ? ‘TRUE’ : ‘FALSE’ ;`\n\n`echo “1 <= 0 is $result <br>” ;`\n\
  \n![image](img/5r.jpg)将文档保存在网络浏览器的 `/htdocs` 目录并为 `comparison.php`，然后通过 HTTP 访问页面以查看显示的结果\n\
  \n![image](img/pg39_2.jpg)\n\n![image](img/hot.jpg)\n\n在 PHP 语言中，布尔值 `TRUE` 在数值上用\
  \ 1 表示。\n\n![image](img/hot.jpg)\n\n大写 ‘A’ 的 ASCII 代码值为 65，小写 ‘a’ 的值为 97 —— 所以它们的比较结果为\
  \ `FALSE`。\n\n### 逻辑评估\n\nPHP 中常用的逻辑运算符如下表所示：\n\n| 运算符: 操作: |\n| --- | --- |\n|\
  \ `&&` | 逻辑与 |\n| `AND` | 逻辑与（&& 的替代形式）| |\n| `||` | 逻辑或 |\n| `OR` | 逻辑或（|| 的替代形式）|\
  \ |\n| `!` | 逻辑非 |\n\n逻辑运算符用于具有 `TRUE` 或 `FALSE` 布尔值的操作数，或者可以转换为 `TRUE` 或 `FALSE`\
  \ 的表达式。\n\n`&&` 与运算符评估两个操作数，只有当两个操作数均为 `TRUE` 时才返回 `TRUE`；否则，它返回 `FALSE`。这用于条件分支，通过测试两个条件来决定\
  \ PHP 脚本的方向。如果两个条件都满足，程序将进入某个方向，否则将进入另一个方向。\n\n与需要两个操作数均为 `TRUE` 的 `&&` 与运算符不同，`||`\
  \ 或运算符评估两个操作数，如果其中一个操作数为 `TRUE`，则返回 `TRUE`。如果两个操作数都不是 `TRUE`，则 `||` 或运算符将返回 `FALSE`。这在\
  \ PHP 脚本中用于满足两个测试条件之一时执行某些操作。\n\n第三种逻辑 `!` 非运算符是一个元运算符 —— 用于单个操作数之前。它返回给定操作数的反值，因此如果变量为\
  \ `TRUE` 则为 `FALSE`。`!` 非运算符在 PHP 脚本中像开关一样切换值。\n\n“布尔”一词指的是由乔治·布尔（George Boole，1815-1864）开发的系统。\n\
  \nPHP 还有一个 `XOR`（**异或**）运算符，如果它的操作数中有一个 `TRUE`，则返回 `TRUE`，但如果两个操作数均为 `TRUE`，则返回\
  \ `FALSE`。\n\n注意 `FALSE && FALSE` 的评估返回 `FALSE` —— 这证明了“错错不为对”的格言。\n\n### 定义常量\n\
  \n当脚本需要一个永远 way 的固定数据值时，将其存储在 PHP “常量”中而不是变量中。常量是 PHP 脚本中的命命名容器，可以在其中存储数据值，并通过常量名称进行引用。与变量不同，在脚本执行过程中存储的值无法更改。\n\
  \nPHP 常量的创建方式与变量不同。相反，你必须使用 `define()` 函数来指定常量的名称及其将包含的值，语法如下：\n\n`define('NAME',\
  \ value) ;`\n\n\n\n\n常量只能包含字母数字值（字符串、整数和浮点数），因此它们不能包含 `TRUE` 或 `FALSE` 的布尔值，也不能表示对象或\
  \ `NULL` 空值。\n\n虽然常量值可以像变量值一样被访问（使用其名称来引用它们包含的值），但常量不能包含在用于混合字符串中——因为 PHP 解释器无法将常量名与普通的大写文本区分开来。例如：\n\
  \n```php\ndefine( ‘USER’ , ‘Mike’ ) ;\n```\n\n```php\necho “Hello USER” ; # 显示:\
  \ Hello USER\n```\n\n因此，常量值必须单独引用：\n\n```php\necho ‘Hello ‘ ;\n\necho USER ;\n```\n\
  \n或者通过将引用的值连接到字符串中，如下：\n\n```php\necho ‘Hello ‘ . USER ;\n```\n\n脚本作者定义的常量可以像 PHP\
  \ 内置的预定义常量一样使用，例如 `PHP_VERSION` 和 `PHP_OS`，它们描述版本和服务器操作系统。\n\n![image](img/hot.jpg)\n\
  \n在创建变量时，务必考虑其值是否会改变——如果不会，你应该创建一个常量。例如：\n\n```php\ndefine( ‘PI’ , 3.14 ) ;\n```\n\
  \n![image](img/1r.jpg)创建一个有效的 HTML 文档，如此处第 16 页列列的那样，然后向 body 部分插入 PHP 标签\n\n```php\n\
  <?php\n### 在此处插入语句。\n?>\n```\n\n![image](img/pg43_1.jpg)\n\nconstant.php\n\n![image](img/2r.jpg)现在，在\
  \ PHP 标签之间插入一条语句来创建并初始化一个常量\n\n```php\ndefine( ‘USER’ , ‘Mike’ ) ;\n```\n\n![image](img/3r.jpg)接下来，插入一条语句在连接的字符串中显示常量值\n\
  \n```php\necho ‘<p>Hello ‘ . USER . ‘</p>’ ;\n```\n\n![image](img/4r.jpg)插入一条语句在连接的字符串中显示\
  \ PHP 版本的预定义常量值\n\n```php\necho ‘<p>You are using PHP version ‘ . PHP_VERSION ;\n\
  ```\n\n![image](img/5r.jpg)最后，插入一条语句在字符串中显示主机操作系统的预定义常量值\n\n```php\necho ‘ running\
  \ on ‘ . PHP_OS . ‘</p>’ ;\n```\n\n![image](img/6r.jpg)将文档保存到 浏览器的 `/htdocs` 目录并作为\
  \ `constant.php`，然后通过 HTTP 打开页面以查看显示的结果\n\n![image](img/pg43_2.jpg)\n\n![image](img/snake.jpg)\n\
  \n你不能将常量包含在混合字符串中，不能更改其值或以美元符号开头其名称。\n\n![image](img/forget.jpg)\n\n你应该始终对常量名使用大写，以便在代码中将其与变量区分开。\n\
  \n## 总结\n\n- 在 PHP 中，变量是一个命名的容器，可以在其中存储更改的数据值，而常量是一个命名的容器，可以在其中存储固定的数据值。\n- 存储在变量或常量中的值可以使用其名称引用。\n\
  - 变量名必须以 `$` 美元符号开头，可以由字母、数字和下划线组成，且 `$` 后的第一个字符只能是字母或下划线。\n- 常量名没有 `$` 前缀，且全大写。\n\
  - 变量使用 `=` 赋值运算符初始化，而常量使用 `define()` 函数初始化。\n- 变量的值可以通过仅将字符串和变量名括在双引号中来作为混合字符串的一部分显示。\n\
  - 字符串可以使用单引号或双引号括起来，内部引号可以使用反斜杠进行转义。\n- 字符串值可以使用 `.` 点连接运算符连接成一个单一字符串。\n- 数组变量可以在顺序的数组元素中存储多个数据项，这些元素默认情况下数字从零开始编号。\n\
  - 可选，可以为每个数组元素指定键名。\n- `foreach` 循环可以访问数组中的每个元素。\n- `implode()` 和 `explode()` 函数通过添加或删除指定的分隔符在字符串和数组之间转换。\n\
  - 数组可以根据值或键按字母数字顺序排序。\n- 多维数组简单来说就是元素为数组的数组。\n- PHP 拥有执行算术（`+ - * / % ++ --`）、比较（`==\
  \ != > < >= <= ?:`）和逻辑（`&& || !`）操作的运算符。\n\n# 3 控制进度\n\n*本章演示了如何编写 PHP 语句来评估表达式，以确定脚本应该如何进行。*\n\
  \n- 分支选择\n- 切换分支\n- 执行循环\n- 当为真时循环\n- 退出循环\n- 创建函数\n- 传递参数\n- 返回值\n- 总结\n\n## 分支选择\n\
  \n`if` 关键字用于执行基本的条件测试，该测试评估给定表达式的布尔值 `TRUE` 或 `FALSE`。评估之后的大括号内的语句仅在表达式被发现为 `TRUE`\
  \ 时才会执行。`if` 语句的形式如下：\n\n```php\nif ( *test-expression* ) { *statements-when-true*\n\
  ```\n\n当测试为 `TRUE` 时，可以有多个语句，但必须以分号结束。\n\n可以使用逻辑 `&&` 运算符测试多个表达式，以确保当两个表达式都被发现为\
  \ `TRUE` 时执行语句：\n\n```php\nif ( ( *test-expression* ) && ( *test-expression* ) )\n\
  { *statements-when-true* }\n```\n\n通过附加 `else` 语句来扩展 `if` 语句，当表达式评估为 `FALSE` 时执行大括号内的语句：\n\
  \n```php\nif ( *test-expression* )\n{ *statements-when-true* }\nelse\n{ *statements-when-false*\
  \ }\n```\n\n也可以通过添加 `elseif` 语句评估备选表达式，当备选表达式发现为 `TRUE` 时执行大括号内的语句。其语法如下：\n\n```php\n\
  if ( *test-expression* )\n{ *statements-when-true* }\nelseif ( *test-expression*\
  \ )\n{ *statements }\nelse\n{ *statements-when-all-false* }\n```\n\n这是一种基础的编程技术，根据评估结果为脚本提供不同的方向，被称为“条件分支”。\n\
  \n![image](img/hot.jpg)\n\n当要执行的代码只是单个语句时，可以省略大括号。\n\n![image](img/hot.jpg)\n\n\
  `elseif` 关键字也可以写成两个单词 `else if`。\n\n![image](img/pg47_1.jpg)\n\nifelse.php\n\n![image](img/1g)开始一个\
  \ PHP 脚本，仅当测试表达式被发现为 `TRUE` 时输出结果：\n\n```php\n<?php\nif ( 4 > 2 ) { echo ‘<p>Yes,\
  \ 4 is greater than 2 <br>’ ; }\n```\n\n![image](img/2g)接下来，添加一条语句，仅当两个测试表达式都被发现为\
  \ `TRUE` 时输出结果：\n\n```php\nif ( ( 4 > 2 ) && ( 8 > 4 ) )\n{ echo ‘4 is greater than\
  \ 2 AND 8 is greater than 4<br>’ ; }\n```\n\n![image](img/3g)现在，添加一条语句，当测试表达式被发现为\
  \ `TRUE` 或 `FALSE` 时输出结果：\n\n```php\nif ( 4 > 8 )\n{ echo ‘4 is greater than 8 <br>’\
  \ ; }\nelse\n{ echo ‘4 is less than 8 <br>’ ; }\n```\n\n![image](img/4g)\n\n\n\n\
  \n```php\n{ echo ‘This test is True </p> ; }\n\nelseif ( 8 \\> 4 )\n\n{ echo ‘Alternative\
  \ test is True </p>’ ; }\n\nelse\n\n{ echo ‘Both tests are False </p>’ ; ?>\n```\n\
  \n![image](img/5g.jpg)将文档保存到网络浏览器的 `/htdocs` 目录并命名为 `ifelse.php`，然后通过 HTTP 打开页面以查看条件分支显示的结果。\n\
  \n![image](img/pg47_2.jpg)\n\n![image](img/hot.jpg)\n\n你可以嵌套条件 `if` 测试（一个嵌套在另一个内部），使得内部块中的语句只有在两个测试都被确定为\
  \ `TRUE` 时才会执行。\n\n## 切换分支\n\n当测试表达式仅评估一个条件时，通过多个 `if-elseif-else` 语句执行的条件分支通常可以使用\
  \ `switch` 语句更高效执行。\n\n`switch` 语句的工作方式不同寻常。它接受一个给定的值作为参数，然后尝试从多个 `case` 语句中匹配该值。当找到匹配时，执行的代码包含在每个\
  \ `case` 语句中。\n\n在每个 `case` 语句结束时使用 `break` 关键字语句是非常重要的，这样 `switch` 语句在找到匹配后就会退出而不再继续寻找匹配——除非这是刻意的要求。\n\
  \n可选地，`case` 语句列表后面可以跟跟一个最后的 `default` 语句，用于指定在任何 `case` 语句中都未找到匹配时要执行的代码。因此，`switch`\
  \ 语句的语法通常如下：\n\n```php\nswitch ( *test-value* )\n{\ncase *match-value : statements-to-execute-when-matched*\
  \ ; break ;\ncase *match-value : statements-to-execute-when-matched* ; break ;\n\
  case *match-value : statements-to-execute-when-matched* ; break ;\ndefault : *statements-to-execute-when-no-match-found\
  \ ;*\n}\n```\n\n`switch` 语句可以有很多许多 `case` 语句，但它的两个 `case` 语句不能尝试匹配相同的值。\n\n当多个 `match-values`\
  \ 需要执行相同的语句时，只需要在最后一个 `case` 语句中包含要执行的语句和退出 `switch` 语句块的 `break` 语句。例如，为 `match-values`\
  \ 为 0、1 和 2 的输出相同的消息：\n\n```php\nswitch ( $number )\n{\ncase 0 :\ncase 1 :\ncase\
  \ 2 : echo ‘Less than 3’ ; break ;\ncase 3 : echo ‘Exactly 3’ ; break ;\ndefault\
  \ : echo ‘Greater than 3 or less than zero’ ;\n}\n```\n\n![image](img/hot.jpg)\n\
  \n包含 `default` 语句始终是一个好主意——即使它只是在 `switch` 语句失败时输出错误消息。\n\n![image](img/forget.jpg)\n\
  \n`default` 语句不需要出现在 `switch` 块的末尾，但将其放在那里是有逻辑的，因为那里不需要 `break` 语句。\n\n![image](img/pg49_1.jpg)\n\
  \n`switch.php`\n\n![image](img/1g.jpg)使用创建和初始化两个带有整数和字符值的变量语句开始 PHP 脚本\n\n```php\n\
  $number \\= 2 ; $letter \\= ‘B’ ;\n```\n\n![image](img/2g.jpg)接下来，添加一个尝试匹配整数值的 `switch`\
  \ 语句\n\n```php\nswitch ( $number )\n{\ncase 1 : echo ‘Number is One<br>’ ; break\
  \ ;\ncase 2 : echo ‘Number is Two<br>’ ; break ;\ncase 3 : echo ‘Number is Three<br>’\
  \ ; break ;\ndefault : echo ‘Number is Unrecognized<br>’ ;\n}\n```\n\n![image](img/3g.jpg)现在，添加一个尝试匹配字符值的\
  \ `switch` 语句\n\n```php\nswitch ( $letter )\n{\ncase ‘A’ : echo ‘Letter is A<br>’\
  \ ; break ;\ncase ‘B’ : echo ‘Letter is B<br>’ ; break ;\ncase ‘C’ : echo ‘Letter\
  \ is C<br>’ ; break ;\ndefault : echo ‘Letter is Unrecognized<br>’ ;\n}\n```\n\n\
  ![image](img/4g.jpg)最后，添加一个 `switch` 语句尝试匹配多个整数值\n\n```php\nswitch ( $number )\n\
  {\ncase 0 : case 1 : case 2 : echo ‘Less than 3<br>’ ; break ;\ndefault : echo ‘3\
  \ or more, or less than zero’ ;\n}\n```\n\n![image](img/5g.jpg)将文档保存到网络浏览器的 `/htdocs`\
  \ 目录并命名为 `switch.php`，然后通过 HTTP 打开页面以查看条件分支显示的结果。\n\n![image](img/pg49_2.jpg)\n\n\
  ![image](img/hot.jpg)\n\n在 `switch` 语句中，`case` 关键字、`match-value` 和冒号字符被视为一个唯一的“标签”。\n\
  \n## 执行循环\n\n循环是脚本中自动重复的代码。循环内所有语句的完整完整执行被称为一次“迭代”或“一通过”。循环的长度由循环内部制作的条件测试控制。只要测试的表达式被确定为\
  \ `TRUE`，循环将继续——直到测试的表达式被确定为 `FALSE`，此时循环结束。\n\n在 PHP 中，有以下四种用于测试的循环结构：\n\n- `for`\
  \ 循环——在测试表达式被确定为 `TRUE` 时执行指定的循环次数。\n- `while` 循环——只有在循环开始时制作的测试为 `TRUE` 时才执行。\n\
  - `do while` 循环——只有在循环结束时制作的测试为 `TRUE` 时才执行。\n- `foreach` 循环——遍历数组的每个元素[见第 30 页]。\n\
  \n也许有趣的循环结构是 `for` 循环，它通常具有以下语法：\n\n```php\nfor (initializer ; test-expression ;\
  \ incrementer* )\n{ *statements-to-execute* }\n```\n\n`initializer` 用于设置计数器的起始值，传统上命名为“i”。在循环的每次迭代中\
  \ `test-expression` 被评估，只要该表达式为 `TRUE`，循环就会继续。当 `test-expression` 变为 `FALSE` 时，循环结束。每次迭代计数器递增。循环可以嵌套，一个在另一个内部，以便在外部循环的每次迭代中执行所有迭代。\n\
  \n![image](img/pg51_1.jpg)\n\n`forloop.php`\n\n![image](img/1g.jpg)输出循环计数器值的 for\
  \ 循环开始 PHP 脚本\n\n```php\nfor ( $i \\= 1 ; $i < 4 ; $i++ )\n{\necho `<dt>Outer loop\
  \ iteration $i” ;\n### 在此处插入嵌套循环\n}\n```\n\n![image](img/2g.jpg)将文档保存到网络浏览器的 `/htdocs`\
  \ 目录并命名为 `forloop.php`，然后通过 HTTP 打开页面以查看循环计数器值\n\n![image](img/3g.jpg)现在，插入一个嵌套的\
  \ for 循环并在每次迭代输出其计数器值\n\n```php\nfor ( $j \\= 1 ; $j < 4 ; $j++ )\n{\necho `<dd>Inner\
  \ loop iteration $j” ;\n}\n```\n\n![image](img/4g.jpg)再次保存文档，然后通过 HTTP 打开页面查看两个循环计数器值\n\
  \n![image](img/pg51_2.jpg)\n\n![image](img/hot.jpg)\n\n`for` 循环计数器也可以递减——通过在每次迭代中使用\
  \ `i--` 代替 `i++`。\n\n### 当真循环\n\n`while` 循环是上例中 `for` 循环的替代方案。`while` 循环同样需要 `initializer`、`test-expression`\
  \ 和 `incrementer`，但这些并不像 `for` 循环那样整齐地列在一对括号内。相反，`initializer` 必须出现在循环块之前，`test-expression`\
  \ 必须出现在 `while` 关键字后的括号内，随后是包含递增器和每次迭代执行的语句的大括号：\n\n```php\n***initializer***\n\
  while ( *test-expression* )\n{ *statements-to-be-executed ; incrementer* }\n```\n\
  \n`do while` 循环提供了上述语法的细微变化，将 `do` 关键字放在循环块之前并将 `while` 语句移动到循环块之后：\n\n```php\n\
  ***initializer***\ndo { *statements-to-be-executed ; incrementer* }\nwhile ( *test-expression*\
  \ ) ;\n```\n\n\n\n\n`while` 循环和 `do while` 循环都会持续迭代，直到测试表达式的结果为 `FALSE`（假），此时循环将退出。因此，循环体必须包含在某个时刻改变测试表达式评估结果的代码——否则将创建一个导致系统锁定的死循环。\n\
  \n`while` 循环和 `do while` 循环之间的显著区别在于，如果测试表达式在第一次求值时为 `FALSE`，`while` 循环将不会执行任何迭代。相比之下，`do\
  \ while` 循环至少会执行一次，因为它的语句是在评估之前执行的。如果这是你需要的，那么 `do while` 循环显然是最佳选择；否则在 `for` 循环和\
  \ `while` 循环之间的选择很大程度上取决于个人喜好。经验法则建议 `for` 循环最适合执行指定次数的迭代，而 `while` 循环适合迭代直到满足特定条件。\n\
  \n循环是数组的完美搭档，因为每次迭代都可以轻松地读取或写入连续的数组元素。\n\n![image](img/snake.jpg)\n\n确保循环结构中的测试表达式会在某时刻变为\
  \ `FALSE`，以避免创建永不结束的死循环。\n\n![image](img/hot.jpg)\n\n你将在本书后面部分发现如何使用 PHP `while`\
  \ 循环从 MySQL 数据库中检索记录。\n\n![image](img/pg53_1.jpg)\n\nwhileloop.php\n\n![image](img/1g.jpg)用创建一个数组的语句开始\
  \ PHP 脚本\n\n```php\n$numbers = array( 10 , 20 , 30 ) ;\n```\n\n![image](img/2g.jpg)接下来，添加一个\
  \ `while` 循环输出每个数组元素的值\n\n```php\necho ‘<dt>While Loop : ’ ;\n$i = 0 ;\nwhile (\
  \ $i < 3 )\n{\necho “<dd>Element $i = $numbers[$i] ” ;\n$i++ ;\n}\n```\n\n![image](img/3g.jpg)现在，添加一个\
  \ `do while` 循环输出每个数组元素的值\n\n```php\necho ‘<dt>Do While Loop : ’ ;\n$i = 0 ;\ndo\n\
  {\necho “<dd>Element $i = $numbers[$i] ” ;\n$i++ ;\n}\nwhile ( $i < 3 ) ;\n```\n\
  \n![image](img/4g.jpg)将文档保存在网页浏览器的 `/htdocs` 目录下并命名为 `whileloop.php`，然后通过 HTTP 打开页面，查看数组元素的值是否相同地显示\n\
  \n![image](img/pg53_2.jpg)\n\n![image](img/forget.jpg)\n\n将此测试表达式中的值改为零，以便两个循环中的\
  \ `while ( $i = 0 )` 仅执行 `do while` 循环的第一次迭代。\n\n### 退出循环\n\n`break` 关键字可以在满足指定条件时提前终止循环。`break`\
  \ 语句位于循环语句块内部，前面有一个测试表达式。当测试返回 `TRUE`（真）时，循环立即结束，程序继续执行下一个任务。例如，在嵌套内部循环中，它会进入下一次迭代。\n\
  \n![image](img/pg54_1.jpg)\n\nbreakcontinue.php\n\n![image](img/1g.jpg)用一个执行三次迭代的\
  \ `for` 循环开始 PHP 脚本\n\n```php\nfor ( $i = 1 ; $i < 4 ; $i++ )\n{\n### 插入的嵌套循环（步骤\
  \ 2）。\n}\n```\n\n![image](img/2g.jpg)接下来，插入一个同样执行三次迭代的嵌套 `for` 循环\n\n```php\nfor\
  \ ( $j= 1 ; $j < 4 ; $j++ )\n{\n### 插入的语句（步骤 5 & 6）。\n}\n```\n\n![image](img/3g.jpg)现在，插入一条在每次迭代时输出两个循环计数值的语句\n\
  \n```php\necho “Running i = $i and j = $j” ;\n```\n\n![image](img/4g.jpg)将文档保存在网页浏览器的\
  \ `/htdocs` 目录下并命名为 `breakcontinue.php`，然后通过 HTTP 打开页面，查看循环计数器的值\n\n![image](img/pg54_2.jpg)\n\
  \n![image](img/5g.jpg)接下来，在内部循环的最开始插入此 `break` 语句，以跳出内部循环——然后保存文档并查看更改\n\n```php\n\
  if ( $i == 2 && $j == 1 )\n{\necho “Breaks inner loop when i = $i and j = $j” ;\n\
  break ;\n}\n```\n\n![image](img/pg55_1.jpg)\n\n`continue` 关键字可以在满足指定条件时跳过循环的单次迭代。`continue`\
  \ 语句位于循环块内部，前面有一个测试表达式。当测试返回 `TRUE` 时，该迭代结束。\n\n![image](img/6g.jpg)现在，在内部循环开头插入此\
  \ `continue` 语句以跳过第一次迭代——然后保存文档并查看更改\n\n```php\nif ( $i == 1 && $j == 1 )\n{\necho\
  \ “Continues inner loop when i = $i and j = $j” ;\ncontinue ;\n}\n```\n\n![image](img/pg55_2.jpg)\n\
  \n![image](img/forget.jpg)在这里，`break` 语句当外部循环尝试运行时会停止内部循环的所有迭代。\n\n![image](img/forget.jpg)在这里，`continue`\
  \ 语句当外部循环尝试运行时将跳过内部循环的第一次迭代。\n\n### 创建函数\n\nPHP 提供了许多可以通过名称调用的内置函数，如第 32 页所示的数组函数。此外，你可以创建自定义函数来执行特定操作。这允许\
  \ PHP 脚本模块化，以便理解和维护。\n\n自定义函数名可以包含字母、数字和下划线字符，但必须以字母或下划线开头。与变量名一样，函数名对大小写敏感，因此 `cube()`、`Cube()`\
  \ 和 `CUBE()` 是独立的。\n\n在 PHP 脚本中创建函数只需通过 `function` 关键字指定名称，后跟括号和大括号，包含调用该函数时要执行的语句：\n\
  \n```php\nfunction function_name()\n{\n    statements-to-executed\n}\n```\n\n创建自定义函数时，理解变量访问性如何受其“作用域”限制很重要：\n\
  \n- 函数外部的变量具有全局作用域，但在函数内部无法访问。\n- 函数内部创建的变量具有“局部”作用域，因此仅在该函数块内有效。\n\n由于函数内部创建的变量无法外部访问，其名称可以与函数外部或另一个函数块内的变量重名而不产生冲突。这允许全局变量包含与同名局部变量不同的值。\n\
  \n函数内部创建的变量的作用域可以通过在声明前加上 `global` 关键字来更改，使其全局可用——但这是一种糟糕的做法并应避免。\n\n避免使用 `global`\
  \ 关键字更改局部变量的作用域，以维护代码的完整性。\n\n![image](img/snake.jpg)\n\n![image](img/pg57_1.jpg)\n\
  \nfunction.php\n\n![image](img/1g.jpg)用创建一个初始化全局变量的语句开始 PHP 脚本\n\n```php\n$result\
  \ = 5 + 5 ;\n```\n\n![image](img/2g.jpg)接下来，添加一个函数创建一个同名的局部变量并输出其值\n\n```php\nfunction\
  \ square()\n{\n$result = 5 * 5 ;\necho “Local Square Result = $result<br>” ;\n}\n\
  ```\n\n![image](img/3g.jpg)现在，再次添加另一个函数创建一个同名的局部变量并输出其值\n\n```php\nfunction cube()\n\
  {\n$result = 5 * 5 * 5 ;\necho “Local Cube Result = $result<br>” ;\n}\n```\n\n![image](img/4g.jpg)最后，添加语句输出全局变量的值并调用两个自定义函数\n\
  \n\n\n\n\n```php\necho “Global Sum Result = $result<br>” ;\n```\n\n```php\nsquare()\
  \ ;\n```\n\n```php\ncube() ;\n```\n\n![image](img/5g.jpg)将文档保存在网络浏览器的 /htdocs 目录中并命名为\
  \ function.php，然后通过 HTTP 打开该页面以查看同名变量值的显示。\n\n![image](img/pg57_2.jpg)\n\n![image](img/forget.jpg)同名的变量在不同作用域内声明时不会发生冲突——它们之间相互不可见。\n\
  \n### 传递参数\n\n数据可以作为“参数”（也称为“形参”）传递给自定义函数，这与你向某些内置 PHP 函数传递参数的方式相同。例如，`sort()` 函数将要排序的数组作为其参数传入。\n\
  \n可以创建带有任意数量参数的函数，但当调用函数时，必须为每个参数提供数据以避免错误。\n\n创建一个包含参数的函数，方法是在函数名后的括号内包含一个用逗号分隔的参数变量列表，如下所示：\n\
  \n```php\nfunction function_name ($arg_1 , $arg_2 , $arg_3)\n{\n    statements-to-be-executed\n\
  }\n```\n\n参数名称必须遵循与其它 PHP 变量相同的命名规范，并且理想情况下应该具有意义，以表示它们将传递的数据性质。参数数据必须按照正确的顺序在调用时传递，然后可以在该函数内部的语句中使用：\n\
  \n```php\nfunction print_name($first_name , $last_name)\n{\n    echo “Name is $first_name\
  \ $last_name “ ;\n}\n\nprint_name (‘Mickey’ , ‘Mouse’ ; # Name is Mickey Mouse\n\
  ```\n\n函数调用可以传递字面量（如上述示例中的字符串），也可以传递普通变量——变量反过来会将它们的值提供给函数。例如：\n\n```php\n$forename\
  \ = ‘Donald’ ;\n$surname = ‘Duck’ ;\nprint_name($forename , $surname) ; # Name is\
  \ Donald Duck\n```\n\n参数变量具有局部作用域，因此仅在创建它们的函数内部是可的。这意味着在许多函数中可以使用相同的参数名称，而不会与彼此或普通变量名发生冲突。\n\
  \n![image](img/forget.jpg)\n\n参数必须在函数声明中指定，并由调用者以逗号分隔的列表传递。\n\n![image](img/pg59_1.jpg)\n\
  \nargument.php\n\n![image](img/1g.jpg)使用语句创建并初始化全局变量开始 PHP 脚本\n\n```php\n$number\
  \ = 5 ;\n```\n\n![image](img/2g.jpg)接下来，添加一个带有一个参数的函数，在计算中使用它的值并输出其结果\n\n```php\n\
  function square($number)\n{\n    $result = $number * $number ;\n    echo “$number\
  \ Squared = $result<br>” ;\n}\n```\n\n![image](img/3g.jpg)现在，添加另一个带有一个参数的函数，在计算中使用它的值并输出其结果\n\
  \n```php\nfunction cube($number)\n{\n    $result = $number * $number * $number ;\n\
  \    echo “$number Cubed = $result<br> ; ;\n}\n```\n\n![image](img/4g.jpg)最后，添加语句来调用函数并并传递字面量参数和变量参数\n\
  \n```php\nsquare(3) ;\ncube(4) ;\nsquare($number) ;\ncube($number) ;\n```\n\n![image](img/5g.jpg)将文档保存在网络浏览器的\
  \ /htdocs 目录中并命名为 argument.php，然后通过 HTTP 打开该页面以查看结果显示。\n\n![image](img/pg59_2.jpg)\n\
  \n![image](img/hot.jpg)你可以对参数和普通变量使用相同的名称。\n\n### 返回值\n\n函数在调用时可以传递值，也可以通过 `return`\
  \ 关键字返回值。通常由调用者决定返回值的函数可以使用 `return` 语句：\n\n| 参数 | 描述 | 示例： |\n| --- | --- | ---\
  \ |\n| Y | 数字 | 18 |\n| y | 数字 | 14 |\n| n | 数字 | 5 |\n| m | 数字 | 05 |\n| F | 星期名称\
  \ | 二月 |\n| M | 星期名称 | 二月 |\n| d | 星期数字 | 04 |\n| S | 星期数字 | 24 |\n| l | 星期名称 |\
  \ 周一 |\n| D | 星期数字 | 周一 |\n| H | 小时 | 14 |\n| i | 分钟 | 45 |\n| s | 秒 | 30 |\n\n\
  自定义函数在调用时也可以返回值，只需在语句中使用 `return` 关键字。这些是 `date()` 的某些用法，通过 `return` 语句来实现。\n\n\
  `date()` 函数通常可以通过 `switch` 语句来执行，以返回特定的值。\n\n![image](img/61.jpg)return.php\n\n\n\
  \n\n\n# 处理提交的数据\n## 创建固定表单\n## 包裹表单\n### 附加链接数据\n### 移动位置\n## 总结\n\n## 执行操作\n\n\
  处理来自网页上 HTML 表单提交的数据也许是 PHP 脚本执行的最基础任务之一。\n\nHTML `<form>` 标签的 `action` 属性用于指定将处理（“处理”）表单数据的\
  \ PHP 脚本。此外，`<form>` 标签的 `method` 属性用于指定如何将数据发送到脚本——通常通过 `POST` 方法。因此，HTML 表单标签和属性看起来可能如下所示：\n\
  \n```html\n<form action=\"script.php\" method=\"POST\">\n```\n\nPHP 提供了一个特殊的“超全局”`$_POST`\
  \ 数组变量，在其中存储通过 `POST` 方法提交的表单数据。它会创建一个与提交的表单元素名称相同的数组元素，并存储它们包含的值。例如，使用此表单元素：\n\n\
  ```html\n<input type=\"text\" name=\"email\">\n```\n\n在提交表单时，PHP 将创建一个名为 `$_POST['email']`\
  \ 的数组元素，其中包含用户在该表单输入框中输入的值。\n\n为了方便识别，可以为与表单元素同名的 PHP 变量赋值存储在相应 `$_POST` 数组元素中的值。这些值随后就可以在由\
  \ action 处理脚本创建的响应页面中显示。\n\n![image](img/1p.jpg)创建一个包含表单的 HTML 文档，其中包含三个用于数据提交的文本输入字段\n\
  \n```html\n<form action=\"action_handler.php\" method=\"POST\">\n<dl>\n  <dt>姓名:</dt>\n\
  \  <dd><input type=\"text\" name=\"name\"></dd>\n  <dt>邮箱地址:</dt>\n  <dd><input\
  \ type=\"text\" name=\"mail\"></dd>\n  <dt>评论:</dt>\n  <dd><textarea rows=\"5\"\
  \ cols=\"20\" name=\"comment\"></textarea></dd>\n</dl>\n<p><input type=\"submit\"\
  ></p>\n</form>\n```\n\n![image](img/pg70_1.jpg)\n\naction.php\n\n![image](img/2p.jpg)现在，将文档保存到网页浏览器的\
  \ `/htdocs` 目录中，命名为 `action.php`\n\n![image](img/snake.jpg)\n\nPHP 是区分大小写的，因此大小写必须与描述完全一致——例如，`$_POST['EMail']`\
  \ 或 `$_Post['email']` 是错误的。\n\n![image](img/3p.jpg)接下来，创建一个包含脚本的 HTML 文档，该脚本将表单值赋值给同名的\
  \ PHP 变量以便输出\n\n```php\n<?php\n$name = $_POST['name'];\n$mail = $_POST['mail'];\n\
  $comment = $_POST['comment'];\necho \"<p>感谢你的评论 $name ...</p>\";\necho \"<p><i>$comment</p></p>\"\
  ;\necho \"<p>我们将回复到 $mail</p>\";\n?>\n```\n\n![image](img/pg70_1.jpg)action_handler.php\n\
  \n![image](img/4p.jpg)将文档保存到网页浏览器的 `/htdocs` 目录中，命名为 `action_handler.php`，然后通过 HTTP\
  \ 打开 `action.php` 并提交一些数据，查看它们在 PHP 脚本生成的响应页面中的显示\n\n![image](img/pg65_2.jpg)![image](img/pg65_3.jpg)![image](img/hot.jpg)\n\
  \n表单提交方法可以是 `GET` 或 `POST`。`GET` 方法将 `name=value` 键对添加到 URL 中，但主要用于请求信息——例如检索数据库记录。`POST`\
  \ 方法可以提交更多数据，由于数据没有附加到 URL，因此更安全，并且主要用于需要执行的操作——例如更新数据库记录。因此，对于大多数示例首选 `POST` 方法。\n\
  \n## 检查值\n\nPHP 可以使用内置的 `isset()` 函数轻松确保用户已在表单字段中输入数据。该函数接受变量名作为参数，并且仅当该变量为 `NULL`\
  \ 时返回 `TRUE`——从而确保变量已“设置”了某些值。除非用户输入了值，否则空表单字段将为 `NULL`。\n\n可以使用 `isset()` 函数进行条件测试，以指示哪些表单字段留空，或者为完成的字段提供一个响应页面。\n\
  \n![image](img/1p.jpg)创建一个包含表单的 HTML 文档，其中包含三个单选按钮，提供单个数据提交字段\n\n```html\n<form\
  \ action=\"isset_handler.php\" method=\"POST\">\n<fieldset>\n  <legend>PHP 是什么种语言?</legend>\n\
  \  <input type=\"radio\" name=\"definition\" value=\"Scripting\">\n  <input type=\"\
  radio\" name=\"definition\" value=\"Markup\">\n  <input type=\"radio\" name=\"definition\"\
  \ value=\"Programming\">\n</fieldset>\n<p><input type=\"submit\"></p>\n</form>\n\
  ```\n\n![image](img/pg70_1.jpg)isset.php\n\n![image](img/2p.jpg)现在，将文档保存到网页浏览器的\
  \ `/htdocs` 目录中，命名为 `isset.php`\n\n![image](img/pg70_1.jpg)isset_handler.php\n\n\
  ![image](img/3p.jpg)接下来，创建一个包含 PHP 脚本的 HTML 文档，用提交的值初始化变量——如果没有提交值则初始化为 `NULL`\n\
  \n```php\n<?php\nif (isset($_POST['definition'])) {\n    $definition = $_POST['definition'];\n\
  } else {\n    $definition = NULL;\n}\n### 在此处插入响应语句\n?>\n```\n\n![image](img/4p.jpg)最后，根据变量的值输出相应的响应\n\
  \n```php\nif ($definition != NULL) {\n    if ($definition != 'Scripting') {\n  \
  \      echo \"$definition 是错误的\";\n    } else {\n        echo \"$definition 是正确的\"\
  ;\n    }\n} else {\n    echo '你必须选择一个';\n}\n```\n\n![image](img/5p.jpg)将文档保存到网页浏览器的\
  \ `/htdocs` 目录，命名为 `isset_handler.php`，然后通过 HTTP 打开 `isset.php` 并提交表单查看响应\n\n![image](img/pg67_1.jpg)![image](img/pg67_2.jpg)![image](img/pg67_3.jpg)![image](img/hot.jpg)\n\
  \n技术上，测试条件是否为 `TRUE` 比测试其是否更高效\n\n## 验证表单数据\n\n由于用户可能会无意中提交空字段或格式错误的数据，因此 PHP 脚本确保必填字段已填写且提交的数据有效是非常关重要的。\n\
  \n要确保用户在文本字段中输入了内容，PHP 提供了 `empty()` 函数，它接受变量参数，如果该值为空字符串、零、`NULL` 或 `FALSE` 则返回\
  \ `TRUE`。\n\n要确保用户输入的是数字格式的数据，PHP 提供了 `is_numeric()` 函数，它接受变量参数，并且仅当该值为数字时返回 `TRUE`。\n\
  \n更具体的数据验证可以使用 PHP 的 `preg_match()` 函数，它接受一个“正则表达式”参数和一个用于搜索模式的变量参数。这通常用于确保邮箱地址符合预期格式。\n\
  \n![image](img/1p.jpg)创建一个包含表单的 HTML 文档，其中包含两个数据提交的文本字段\n\n```html\n<form action=\"\
  valid_handler.php\" method=\"POST\">\n<fieldset>\n  <legend>输入数量和邮箱地址</legend>\n\
  \  <p>数量：<input type=\"text\" name=\"quantity\"></p>\n  <p>邮箱地址：<input type=\"text\"\
  \ name=\"email\"></p>\n</fieldset>\n<p><input type=\"submit\"></p>\n</form>\n```\n\
  \n![image](img/pg68_1.jpg)valid.php\n\n![image](img/2p.jpg)现在，将文档保存到网页浏览器的 `/htdocs`\
