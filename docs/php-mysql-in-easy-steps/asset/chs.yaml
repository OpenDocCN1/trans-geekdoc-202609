  \ “Magnifica” , 500.00 ) ,\n( “Magimix” , “Nespresso” , 300.00 ) ,\n( “Cuisart”\
  \ , “Espresso” , 280.00 ) ;\n```\n\n![image](img/3bl.jpg)现在，添加一个查询显示此表中的一行\n\n```\n\
  SELECT * FROM coffee_machines WHERE id= 3 ;\n```\n\n![image](img/4bl.jpg)添加一个查询显示两个特定的行\n\
  \n```\nSELECT * FROM coffee_machines WHERE make IN (“Krups” , “Gaggia” )\n```\n\n\
