  \n通常情况下，需要使用 `UPDATE` 查询来更改特定行中特定列所包含的数据。可以通过在 `UPDATE` 查询中添加 `WHERE` 关键字来匹配指定列中的值，从而识别该行。特定\
  \ `UPDATE` 查询的语法如下：\n\n```sql\nUPDATE table-name\nSET column-name = value WHERE\
  \ column-name = value ;\n```\n\n单个 `UPDATE` 查询也可以通过在 `SET` 关键字后创建以逗号分隔的多个 `column-name\
  \ = value` 语句，来更改特定行的多个列值。\n\n如果 `WHERE` 关键字识别出多行具有相同指定值的行，它们都将用新值更新——这可能会导致意外的数据丢失。因此，通过其\
  \ `PRIMARY KEY` 值来识别行更为安全，因为该值保证是唯一的，因此不会意外更新多行。\n\n![image](img/pg102_1.jpg)\n\n\
