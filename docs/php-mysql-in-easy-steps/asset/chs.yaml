  \n### 包围表单\n\nPHP 有用地允许将多个文件合并在一起以创建一个单个网页。这意味着动态表单可以被静态页眉和页脚内容包围，这些内容可以被重复使用以创建网站内的其他页面。\n\
  \n`include()` 函数接受另一个文件的 URL 作为参数，将其合并到网页中。通常，包含的静态内容文件是 HTML 文件，并位于 Web 服务器 `/htdocs`\
  \ 目录下的“includes”文件夹中。\n\nPHP 还提供了一个 `require()` 函数，它的工作方式与 `include()` 函数一样，用于在网页中包含其他文件，但它们有细微的差别。当\
  \ `include()` 函数失败时（因为找不到指定的文件），系统会向浏览器发送一个警告，但脚本将继续运行。当 `require()` 函数失败时，会打印错误但脚本将停止。通常，`include()`\
  \ 函数包含 HTML 文件，而 `require()` 函数包含动态 PHP 脚本。这一点是，包含多个文件的网页标题可以由 PHP 动态编写，从而为原本静态的页眉内容提供灵活性。\n\
  \n![image](img/1p.jpg)\n\n创建一个包含静态页眉内容和写入页面标题的 PHP 代码的 HTML 文档\n\n```html\n<!DOCTYPE\
  \ HTML>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<title><?php echo\
  \ $page_title ; ?></title>\n<link rel=\"stylesheet\" href=\"includes/style.css\"\
  >\n</head>\n<body>\n<header><h1>Page Header</h1></header>\n```\n![image](img/pg76_1.jpg)\n\
  \n现在，创建一个包含页脚内容的 HTML 文档\n\n```html\n<footer><p>Page Footer</p></footer>\n</body>\n\
  </html>\n```\n![image](img/pg76_2.jpg) \n\n接下来，在你的 Web 服务器的 `/htdocs` 目录中创建一个名为“includes”的文件夹，并将上述文档分别保存为其中的\
  \ `header.html` 和 `footer.html`。\n\n![image](img/4p.jpg)\n\n创建一个 CSS 样式表来展示页眉和页脚内容（以及用于展示后续示例中某些方面的规则）\n\
  \n```css\nheader > h1 { border-bottom: 1px dashed black; font-style: italic; font-size:\
  \ x-large; }\nfooter > p { border-top: 1px dashed black; font-style: italic; }\n\
  table { border-spacing: 5px; width: 530px; }\nth { color: #FFF; background: #000;\
  \ text-align: left; }\ntd { border-bottom: 1px solid black; padding: 3px; background:\
  \ #F0F0F0; text-align: left; vertical-align:top; }\np#err_msg { color: #00; font-weight:\
  \ bold; }\n```\n![image](img/pg77_1.jpg)\n\n将样式表保存到你创建的 `/includes` 文件夹中，与 HTML\
  \ 页眉和页脚文件一起。\n\n![image](img/5p.jpg)\n\n最后，创建一个 PHP 脚本，设置网页标题并用页眉和页脚内容包围表单\n\n```php\n\
  $page_title = 'PHP Include';\ninclude ( 'includes/header.html' )\necho '<form action=\"\
  include.php\" method=\"POST\">\n<p>Name: <input type=\"text\" name=\"name\"></p>\n\
  <p>Email: <input type=\"text\" name=\"email\"></p>\n<p><input type=\"submit\"></p></form>'\
  \ ;\ninclude ( 'includes/footer.html' ) ;\n```\n![image](img/pg77_2.jpg)\n\n将 PHP\
  \ 脚本保存到 Web 浏览器的 `/htdocs` 目录并命名为 `include.php`，然后通过 HTTP 打开以查看设置的标题和被静态内容包围的表单。\n\
  \n![image](img/pg77_3.jpg)\n![image](img/hot.jpg)\n\n你可以使用浏览器的“查看源代码”功能查看整个内容是否已有效地合并到单个网页中。\n\
  \n### 附加链接数据\n\nPHP 预定义的“超级全局”变量，例如存储页面请求方法的 `$_SERVER` 数组变量，以及跨页面存储用户数据的 `$_SESSION`\
  \ 数组变量，在用户退出之前，在任何脚本的作用域内都是可用的。\n\n当 HTML 表单使用 POST 方法提交数据时，`$_POST` 数组存储提交表单值的命名元素。因此，名为“city”的提交值可以通过\
  \ `$_POST['city']` 访问。\n\n同样，当使用 GET 方法提交数据时，`$_GET` 数组存储值的命名元素。因此，名为“id”的提交值可以通过\
  \ `$_GET['id']` 访问。这通常通过在 HTML 超链接的 URL 中附加 name=value 对来向脚本提交数据，如下：\n\n```html\n\
  <a href=\"www.example.com/script.php?id=1\">\n```\n\n接收超链接数据的脚本随后可以使用传递的值来确定响应。\n\
  \n创建一个包含 PHP 脚本的 HTML 文档，该脚本在 `$_GET` 数组中寻找名为“id”的元素\n\n```php\nif ( isset($_GET['id'])\
  \ )\n{\n    # Handler statements to be inserted here.\n}\n```\n![image](img/pg78_1.jpg)\n\
  \n接下来，插入语句将传递的值赋值给同名的 PHP 变量\n\n```php\n$id = $_GET['id'] ;\n```\n![image](img/3p.jpg)\n\
  \n现在，插入语句根据传递的值输出相应的响应\n\n```php\nswitch( $id )\n{\n    case 1 : echo 'Cow selected<hr>'\
  \ ; break;\n    case 2 : echo 'Dog selected<hr>' ; break;\n    case 3 : echo 'Goat\
  \ selected<hr>' ; break;\n}\n```\n![image](img/hot.jpg)\n\n`$_SESSION` 超级全局将在下一个示例中用于存储用户详情。\n\
  \n最后，添加语句显示带有附加值的链接\n\n```php\necho '<h1>Select a buddy</h1>' ;\necho ' <p><a href=\"\
  link.php?id=1\">Cow</a> |' ;\necho ' <a href=\"link.php?id=2\">Dog</a> | ' ;\necho\
  \ ' <a href=\"link.php?id=3\">Goat</a></p>' ;\n```\n![image](img/5p.jpg)\n\n将 PHP\
  \ 脚本保存到 Web 浏览器的 `/htdocs` 目录并命名为 `link.php`，然后通过 HTTP 打开并点击链接以查看传递的值的响应。\n\n\n\n\
  \n\n![image](img/pg79_2.jpg)\n\n![image](img/snake.jpg)\n\nPHP 还提供了一个 `$_REQUEST`\
  \ 超全局变量，它包含了 `$_POST` 和 `$_GET` 数组的所有内容。这意味着可以使用 `$_REQUEST['city']` 来访问 `$_POST['city']`\
  \ 对应的内容，但应该避免这样做。相反，请始终根据提交类型使用特定的数组。\n\n![image](img/forget.jpg)\n\n注意，传递的 name=value\
  \ 对在浏览器的地址栏中是可见的。\n\n### 移动位置\n\nPHP 提供了一个 `header()` 函数，它接受一个参数来指定要发送到 浏览器的原始 HTTP\
  \ “头部”（header）。头部在 Web 服务器发送任何其他数据之前就已发送，并且通常对用户不可见。最有用的是，PHP 的 `header()` 函数可以设置“Location”头部将浏览器重定向到新页面，使用此语法：\n\
  \n`header( 'Location: *www.example.com/page.php*' ) ;`\n\n在移动到新页面时，可以通过先将数据存储在特殊的\
  \ PHP 超全局变量 `$_SESSION` 数组中来保留用户数据。然而，在脚本调用 `session_start()` 函数之前，该变量并不会自动可用。变量值可以存储在\
  \ `$_SESSION` 数组的同名元素中，这样它们在网站的其他页面上可用，直到用户退出或在脚本中调用 `session_destroy()` 函数。\n\n\
  ![image](img/1p.jpg)创建一个包含 PHP 脚本的 HTML 文档，该脚本在 `$_POST` 数组中查找名为“id”的元素\n\n```php\n\
  if ( isset ( $_POST['id'] ) )\n{\n    $id = $_POST['id'] ;\n    # 在此此处插入处理语句。\n\
  }\n```\n\n![image](img/pg80_1.jpg)\n\nheader.php\n\n![image](img/2p.jpg)接下来，插入处理语句以将匹配的\
  \ id 值存储在 `$_SESSION` 数组元素中并重定向浏览器——或者为任何其他 id 值显示消息\n\n```php\nif( $id== 123 )\n\
  {\n    session_start() ;\n    $_SESSION['id'] = $id ;\n    header( 'Location: location.php'\
  \ ) ;\n    exit() ;\n}\nelse { echo “<p>$id is an incorrect ID!</p>” ; }\n```\n\n\
