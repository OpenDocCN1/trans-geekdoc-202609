  \n## 处理提交\n\n到为止的示例使用了 POST 方法提交数据，也可以使用 GET 方法。使用 GET 时，数据将作为查询字符串附加到 URL 中。这对于非敏感数据（例如搜索查询）非常有用。可以使用\
