    # Regular paper


    # Frequency reconfigurable wideband rectangular dielectric resonator antenna for
    sub-6 GHz applications with machine learning optimization


    Jayant Kumar Rai, Pinku Ranjan *, Rakesh Chowdhury


    Department of Electrical and Electronics Engineering, ABV- Indian Institute of
    Information Technology and Management, Gwalior, M.P., India


    ## ARTICLE INFO


    Keywords:

    - Dielectric Resonator Antenna (DRA)

    - Frequency Reconfigurable Antenna

    - Machine Learning (ML)

    - 5G


    ## ABSTRACT


    This work presents frequency reconfigurable Wideband Rectangular Dielectric Resonator
    Antenna (RDRA) using a Machine Learning (ML) approach for 5G (Sub-6 GHz) applications.
    The concept of ML is integrated with reconfigurable DRA for the first time. A
    novel approach has been proposed to obtain wideband and frequency reconfigurability.
    Frequency reconfigurability is achieved electronically (PIN diode switches) and
    operates in four different configurations, offering a maximum of 76.84 % wide
    tuning range. Hybrid structure and higher order mode $TE_{111}$ and $TE_{211}$
    modes excitation is responsible for wideband operation. The Extreme Gradient Boosting
    (XGB) ML algorithm provides more than 90 % accuracy in all configurations for
    $S_{11}$ prediction.


    ## 1. Introduction


    The idea of frequency reconfigurable antennas has been developed to make possible
    dynamic changes in the operating frequency without modifying the physical construction
    of the antenna. These antennas can adapt their operating frequency to changing
    system requirements or extend multiple frequency bands. Frequency reconfigurable
    antennas are essential in the 5G environment for addressing next-generation wireless
    devices changing requirements and difficulties. Multiple technologies, including
    cellular, Wi-Fi, Bluetooth, and IoT, are used concurrently in the Sub-6 GHz band.
    A single antenna may cover several frequencies due to a frequency-reconfigurable
    antenna, and it can provide an effective spectrum utilization. They improve spectrum
    utilization, compatibility, multiband capabilities, and cost-effectiveness, all
    of these are beneficial for wireless communication [1]. An advanced antenna technology
    known as a Dielectric Resonator Antenna (DRA) offers several desirable characteristics,
    such as excellent radiation efficiency, significant gain, and variable multi-mode
    capabilities. Due to these characteristics, the DRA is an excellent choice for
    antenna designs that need frequency flexibility and reconfigurability in applications.
    Additionally, there are several feeding mechanisms available in a DRA such as
    a coaxial probe, microstrip feeding, aperture coupled, and coplanar waveguides
    (CPW), and it may exist in several forms (rectangular, cylindrical, deformed shape,
    etc.). Dielectric resonators (DRs) show resonance behaviours at particular frequencies,
    and the resonant frequency may be tuned by varying the size of the DR. The ability
    to be tuned allows DRA to operate within a certain frequency band. Also, DRs have
    large bandwidths, enabling them to support various frequency bands over a broad
    frequency range. Frequency-reconfigurable antennas built on DRs can cover a large
    bandwidth range of frequencies, making them adaptable to various wireless communication
    protocols and applications. The small form factor of DRA allows for integration
    into space-limited devices without sacrificing performance. A compact wideband
    antenna with enhanced flexibility and performance may be developed by including
    frequency reconfigurability into DRAs. Traditional DRAs have demonstrated potential
    because of their excellent radiation efficiency, and compatibility with integrated
    circuits [2–6, 22–23].


    To design frequency reconfigurable DRA, various studies were conducted, such as
    in [9], with chip capacitors or varactors, a rectangular differentially fed DRA
    was created, which provides narrow band tuning. One of the described configurations
    has a wide tuning range but adds complexity by combining three PIN diodes with
    a rectangular DRA that operates in six of the nine states [10]. In [11], Low tuning
    range and additional complexity are provided by a rectangular DRA powered by CPW
    that uses two PIN diodes to transition from narrowband to wideband operation.
    In [12], by combining a three-rectangular DRA with two PIN Diodes of more complexity,
    dual-band frequency-reconfigurability in one or both ON states is generated. In
    [13], four rectangular DRAs with three integrated PIN diodes provide a single
    band frequency reconfigurability, but only in two or more ON states. In [12] and
    [13], complexity increases due to the number of elements and biasing lines. In
    [14], a frequency agile hybrid DRA with two PIN diodes creates a reconfigurable
    circularly polarized wave across a certain frequency range; however, it has a
    limited tuning range. The comparison between the proposed antenna with previous
    works is shown in Table 1.


    | Ref. | Antenna | Substrate Size (mm²) | Tuning Method | Wideband % | Tuning
    Range (TR) % | Gain (dBi) | Machine Learning (ML) | Complexity |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | [7] | Fluidic DRA | – | Changing the liquid volume | No | 42.3 | 6.76 | No |
    Complex |

    | [8] | DRA with the air gap | – | Movement of the slug | No | 24.7 | 4.9 | No
    | Complex |

    | [9] | Differential Fed DRA | – | Varactor/ Capacitor PIN/ | No | 10.9/ 30.6
    | 3 | No | Simple |

    | [10] | DRA | 150 × 100 | Varactor PIN/ | No | 91/55 | 2.7 | No | Complex |

    | [11] | DRA | 50 × 57 | PIN (2) | No | – | 3.52 | No | Complex |

    | [12] | DRA | 45 × 33 | PIN (2) | No | 38.6 | 3.02 | No | Complex |

    | [13] | DRA | 36 × 20 | PIN (3) | No | 37.8 | 1.69 | No | Complex |

    | [14] | Hybrid DRA | – | PIN (2) | No | 23.35 | 2.74 | No | Simple |

    | This Work | Hybrid DRA | 50 × 40 | PIN (2) | Yes | 76.84 | 4 | Yes | Simple
    |


    This paper presents the design, analysis, and experimental results of the proposed
    very simple frequency reconfigurable DRA with a wide band, large tuning Range,
    and low cost for Sub-6 GHz applications with ML algorithms for the first time.
    The antenna exploits dual-mode resonances to achieve wideband coverage while maintaining
    a compact form factor, making it suitable for deployment in space-constrained
    environments. The attractive features of the proposed antenna are as follows:
    (see Table 2).


    | S1 | S2 | Configuration |

    | :---: | :---: | :--- |

    | 0 | 0 | OFF-OFF |

    | 0 | 1 | OFF-ON |

    | 1 | 0 | ON-OFF |

    | 1 | 1 | ON-ON |


    - Simple configuration.

    - Wide band Reconfigurability: TE111 and TE211 modes.

    - Antenna’s tuning range (TR) is 76.84 %.

    - Antenna’s total spectrum: 91.08 %.

    - Different ML algorithms have been used to optimize the antenna for the first
    time in which Extreme Gradient Boosting (XGB) algorithm achieved the highest R2
    score.


    This paper is organized as follows: Section 2 provides an overview of the design
    methodology and optimization techniques employed in developing the proposed design,
    the numerical analysis, and simulation results in frequency reconfigurable antennas
    and their applications in Sub-6 GHz bands. Section 3 is followed by the proposed
    antenna using ML optimization. Finally, Section 4 concludes the paper with a summary
    of the findings and directions for future research.


    ## 2. Antenna configuration and analysis


    ### 2.1. Configuration


    The proposed antenna configuration and its corresponding design parameters are
    shown in Fig. 1. It includes RDRA, Microstrip Feed, PIN diode, and a 50 × 40 mm²
    substrate with a partial ground plane printed on the bottom side. The truncated
    rectangular is printed on the FR4 epoxy substrate (εr = 4.4, and tanδ = 0.02)
    and thickness of the substrate is HS = 1.6 mm. The RDRA is made of Alumina (Al2O3)
    has a relative permittivity of εr = 9.8 and tanδ = 0.02. The length (RL), width
    (RW), and height (RH) of RDRA are 16, 16, and 8 mm, respectively. The other dimension
    details can be found in Figure 1. The equivalent circuit of a PIN diode (BAR50-02
    V) in both the ON and OFF states is shown in Fig. 1. The fabricated proposed antenna
    is shown in Fig. 2. Two dc bias circuits regulate the ON and OFF operation of
    two PIN diodes utilizing two dc+ signals (Red Wire) and two GND signals (Black
    Wire), as shown in Fig. 2. A common ground can be used to combine the GND signals
    of several PIN diodes, which reduces the complexity of the control circuit (the
    PIN diode bias circuit).


    ### 2.2. Mathematical modelling


    The antenna being proposed in this study is a hybrid antenna, which combines different
    features to enhance its performance. The resonant frequency of this antenna is
    determined by the presence of two dielectric layers: Epoxy FR4 (4.4) and Alumina
    (Al2O3). The effective height Heff and the effective permittivity εreff are crucial
    parameters that characterize the behaviour of the proposed antenna. According
    to [16], The effective height (Heff), and effective permittivity (εreff) is given
    by Eqs. (1) and (2):


    H_eff = H + H_S


    ε_reff = H_eff / (H/ε_RDRA + H_S/ε_sub)


    According to [3] the transcendental equation is used to calculate the fundamental
    TE111 mode’s resonance frequency


    k . tan(k * d / 2) = √((εreff - 1)k0² - kz²)


    Where, kx, ky, and kz are wave numbers, they satisfy the following equation


    kx² + ky² + kz² = (εreff)k0²


    Where, kx = π/b and ky = π/b


    According to [1], reconfigurable antenna parameters Tuning Range (TR) and Total
    Spectrum (TS) is given by Eqs. (5) and (6):


    TR(%) = 2 × ((fol - fal) / (fon + fol)) × 100


    Where, fol = Lower resonating frequency and foh = Higher resonating frequency


    TS(%) = 2 × ((fmax - fmin) / (fmax + fmin)) × 100

