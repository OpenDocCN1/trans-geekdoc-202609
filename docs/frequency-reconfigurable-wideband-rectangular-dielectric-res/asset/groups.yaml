    ## 2.3. 演化设计步骤


    拟议天线的不同设计步骤及其对应的 S11 如图 3 所示。初始步骤，步骤 1：在衬底顶部设计矩形贴片天线。它产生一个单频段，工作频率为 2.52 (2.24–3.01)
    GHz。

    步骤 2：在矩形环内创建 T 形结构。它产生一个单频段，工作频率为 2.21 (2.09–2.29) GHz，带宽和阻抗匹配得到改善。

    步骤 3：截断矩形的边缘。它产生三个频段，工作频率分别为 2.24 (2.13–2.35) GHz、3.2 (2.91–4.06) GHz 和 5.47 (4.99–6.14)
    GHz，带宽和阻抗匹配得到改善。

    步骤 4：在 T 形结构顶部创建一个环。它也产生三个频段：2.1 (2.05–2.16) GHz、3.01 (2.68–4.03) GHz 和 5.47 (4.95–5.98)
    GHz。

    步骤 5：在贴片上放置 RDRA。它实现了双频段（窄带和宽带）运行，频率分别为 2.63 GHz (2.31–3.16) GHz 和 4.91 (4.56–6.11)
    GHz，带宽和阻抗匹配得到改善。


