    ## 3. 通过机器学习算法进行优化


    采用机器学习方法优化天线设计参数。利用天线参数，可通过 ML 预测 S11。本文采用了五种 ML 方法：极端梯度提升 (XGB)、K 近邻 (KNN)、决策树
    (DT)、随机森林 (RF) 和人工神经网络 (ANN)。选择这些 ML 算法是因为它们可以对非线性数据进行回归。HFSS 软件产生的数据为非线性数据 [17–21]。


    ### 3.1. 天线中 ML 算法的方法论


    天线设计过程中 ML 算法的应用如图 10 所示。图示展示了一个流程图，全面概述了整个过程。该流程图可通过以下顺序步骤描述：步骤 1：使用电磁 (EM) 仿真器进行天线设计的初始阶段并创建数据集。通过系统地改变天线几何结构来开发数据集。在本工作中，通过改变
    RDRA 的长度、宽度和高度以及馈线的馈电宽度来生成数据集。记录一个或多个频率下的 S11 输出。步骤 2：ML 算法的训练使用了大约 80% 的数据集。这使得算法能够识别并学习数据中的模式。步骤
    3：随后，将训练好的 ML 技术应用于剩余 20% 的数据集以评估其性能。如果测试结果令人满意，则该方法进入下一阶段。但是，如果测试结果不令人满意，则程序返回步骤
    1 以重建数据集。


