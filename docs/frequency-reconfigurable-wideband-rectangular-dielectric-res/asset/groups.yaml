    ## 4. 结论


    所提出的天线设计集成了两个 PIN 二极管开关，使其能够在多个频段上发挥功能。该天线设计针对宽频带和窄频带进行了优化，采用了不同的开关配置。因此，天线实现了
    4 dB 的增益。所提出天线的 TR 和 TS 分别为 76.84% 和 91.08%。关于机器学习算法性能，XGB 算法在 OFF-OFF、OFF-ON、ON-OFF
    和 ON-ON 配置中分别达到最高 R² 分数 96%、91.5%、94.6% 和 99.8%，证明了其在准确预测天线行为方面的有效性。数值、仿真和测量结果之间达成了良好的一致性。所提出的天线可用于
    Sub 6 GHz 应用。


