    \ $S_{11}$ prediction.\n\n# 1. Introduction\n\nThe idea of frequency reconfigurable\
    \ antennas has been developed to make possible dynamic changes in the operating\
    \ frequency without modifying the physical construction of the antenna. These\
    \ antennas can adapt their operating frequency to changing system requirements\
    \ or extend multiple frequency bands. Frequency reconfigurable antennas are essential\
    \ in the 5G environment for addressing next-generation wireless devices changing\
    \ requirements and difficulties. Multiple technologies, including cellular, Wi-Fi,\
    \ Bluetooth, and IoT, are used concurrently in the Sub-6 GHz band. A single antenna\
    \ may cover several frequencies due to a frequency-reconfigurable antenna, and\
    \ it can provide an effective spectrum utilization. They improve spectrum utilization,\
    \ compatibility, multiband capabilities, and cost-effectiveness, all of these\
    \ are beneficial for wireless communication [1]. An advanced antenna technology\
    \ known as a Dielectric Resonator Antenna (DRA) offers several desirable characteristics,\
    \ such as excellent radiation efficiency, significant gain, and variable multi-mode\
    \ capabilities. Due to these characteristics, the DRA is an excellent choice for\
    \ antenna designs that need frequency flexibility and reconfigurability in applications.\
    \ Additionally, there are several feeding mechanisms available in a DRA such as\
    \ a coaxial probe, microstrip feeding, aperture coupled, and co-planner waveguides\
    \ (CPW), and it may exist in several forms (rectangular, cylindrical, deformed\
    \ shape, etc.). Dielectric resonators (DRs) show resonance behaviours at particular\
    \ frequencies, and the resonant frequency may be tuned by varying the size of\
    \ the DR. The ability to be tuned\n\nallows DRA to operate within a certain frequency\
    \ band. Also, DRs have large bandwidths, enabling them to support various frequency\
    \ bands over a broad frequency range. Frequency-reconfigurable antennas built\
    \ on DRs can cover a large bandwidth range of frequencies, making them adaptable\
    \ to various wireless communication protocols and applications. The small form\
    \ factor of DRA allows for integration into space-limited devices without sacrificing\
    \ performance. A compact wideband antenna with enhanced flexibility and performance\
    \ may be developed by including frequency reconfigurability into DRAs. Traditional\
