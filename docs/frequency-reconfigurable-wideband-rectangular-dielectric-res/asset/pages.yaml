    # 2.3. Evolutionary design steps


    The different design steps of the proposed antenna and its corresponding S11 are
    shown in Fig. 3. Initially, in Step-1: designed rectangular patch antenna on the
    top of the substrate. It gives a single band with an operating frequency of 2.52
    (2.24–3.01) GHz.

    Step-2: create a T shape inside the rectangle ring. It gives a single band with
    a operating frequency of 2.21 (2.09–2.29) GHz with improved bandwidth and impedance
    matching.

    Step-3: truncated the edges of rectangle. It gives three bands with an operating
    frequency of 2.24 (2.13–2.35) GHz, 3.2(2.91–4.06) GHz and 5.47 (4.99–6.14) GHz
    with improved bandwidth and impedance matching.

    Step-4: create a ring on the top of the T shape. It also gives three bands 2.1
    (2.05–2.16) GHz, 3.01 (2.68–4.03) GHz, and 5.47 (4.95–5.98) GHz.

    Step-5: placed the RDRA on the patch. It gives the dual-band (narrow and wideband)
    operation of 2.63 GHz (2.31–3.16) GHz and 4.91 (4.56–6.11) GHz with improved bandwidth
    and impedance matching.


    Due to better matching between the feeding and DRA it provides more than 29 %
    impedance bandwidth as compared to the patch.


    In the last step-6: The PIN Diodes switches is inserted in the edges of truncated
    rectangular patch. The corresponding S11 plots of different switching states,
    are shown in Figs. 4 and 5, with improved bandwidth and impedance matching.


