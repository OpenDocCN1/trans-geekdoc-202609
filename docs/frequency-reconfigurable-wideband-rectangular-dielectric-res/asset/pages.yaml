    # 4. Conclusion


    The proposed antenna design integrates two PIN diode switches, enabling its functionality
    across multiple frequency bands. The antenna design has been optimized for wide
    and narrow frequency bands, employing different switching configurations. As a
    result, the antenna achieves a gain of 4 dB. The TR and TS of the proposed antenna
    is 76.84 % and 91.08 % respectively. Regarding ML algorithm performance, the XGB
    algorithm attains the highest R² score 96 %, 91.5 %, 94.6 % and 99.8 % in OFF-OFF,
    OFF-ON, ON-OFF and ON-ON configuration respectively and demonstrating its effectiveness
    in accurately predicting the antenna behaviour. Good agreement was found among
    the numerical, simulated, and measured results. The proposed antenna can be used
    for Sub 6 GHz application.


