- pgno: 70
  md: '# Bakong


    Bakong is the first Central Bank Digital Currency (CBDC) launched by The National
    Bank of Cambodia. This was co-developed by Japanese fintech firm SORAMITSU and
    launched on Oct 28, 2020. Bakong supports transactions in riel and dollars and
    it has its own mobile app for transactions.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Bear Trap


    A bear trap starts with a group of traders selling a large number of cryptos.
    This makes other traders sell since they suspect a price correction. This causes
    the price to fall further. That''s when the bear trap is released when the earlier
    sellers buy back the crypto at a lower price. Bear traps can happen over hours
    or days.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# Bear Whale


    A person in Crypto market who places a huge quantity to sell at a discount to
    market price, which pushes market prices to lower levels. This event has occurred
    in Bitcoin in the year 2014 where an individual known as Bearwhale lost faith
    in Bitcoin and transferred 30,000 coins to Bitstamp and placed a sell limit order
    at USD 300 per coin while market price was USD 350.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Besu


    Hyperledger Besu is an Ethereum client designed to be enterprise-friendly for
    both public and private permissioned Blockchain use cases. It can also be operated
    on test networks such as Rinkeby, Ropsten, and Görli. Hyperledger Besu includes
    several consensus algorithms including Proof of Work (PoW) and Proof of Authority
    (IBFT, IBFT 2.0, Etherhash, and Clique). Its comprehensive permissioning schemes
    are designed specifically for use in a consortium environment.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# BFT (Byzantine Fault Tolerance)


    BFT is the property of a system that is able to resist the class of failures derived
    from the Byzantine Generals'' Problem. This means that a BFT system is able to
    continue operating even if some of the nodes in Blockchain network fail or act
    maliciously. It is used as one of the consensus mechanisms in Blockchain networks
    to protect Blockchains from manipulation by rogue nodes or unknown actors. Practical
    Byzantine Fault Tolerance was introduced by Miguel Castro and Barbara Liskov at
    MIT Laboratory and used by Blockchain protocols – Hyperledger, Stellar and Ripple.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# Binance


    Binance is a cryptocurrency exchange that provides a platform for trading various
    cryptocurrencies. As of January 2018, Binance was the largest cryptocurrency exchange
    in the world in terms of trading volume. Binance was founded by Changpeng Zhao,
    a developer who had previously created high frequency trading software. Binance
    has also launched two cryptos developed internally – Binance Coin (BNB) with a
    market cap of over USD 50 billion and Binance Smart Chain (BSC). BNB can be used
    to pay exchange fees on Binance for various transactions.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# BIP (Bitcoin Improvement Proposal)


    It is a standard for proposing changes to Bitcoin protocol. They include consensus
    related critical changes like soft fork and hard fork protocol upgrades, bitcoin
    software implementations such as modifications pertaining to backing up seed formats
