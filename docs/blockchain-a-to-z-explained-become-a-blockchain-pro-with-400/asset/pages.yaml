- pgno: 10
  md: '# Preface


    Blockchain is catching the attention of masses all over the world, thanks to the
    spotlight on Bitcoin – the first successful commercial implementation of Blockchain.
    Adoption of Blockchain both for Public use and Enterprise use is growing by leaps
    and bounds.


    While there are many resources that are available in the form of books, online
    courses and certification programs that equip one to understand Blockchain and
    use cases, there are very limited resources to explain key terms and lexicon used
    in Blockchain. Hence, we made the bold effort to scan the history of Blockchain,
    trace evolution of Blockchain, mine for terms that are used both frequently and
    rarely and explain them clearly.


    Our efforts have resulted in collating over 400 terms, yes you have read it correctly;
    and explaining them in simple and lucid manner.


    We expect this book to be a comprehensive compendium of Blockchain terms and evolve
    into a valuable resource for everyone, be it – Students, Academicians, Researchers,
    Practitioners, Crypto enthusiasts, who are interested in learning and mastering
    Blockchain.


    To the best of our knowledge, other re-sources that are available either online
    or offline, cover and explain at best 30 to 50 terms.'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'In essence, our book provides 10x value compared to those resources.


    This book also acknowledges and explains key contributors to Blockchain, top-20
    cryptocurrencies and leading Blockchain protocols. No wonder, we feel that readers
    of this book will graduate from Blockchain Dummies to Blockchain Pros by assimilating
    all the terms listed in this book, from A to Z!!


    We promise that this book will continue to be a valuable resource over the years
    through inclusion of new jargons and terms as they appear on the horizon and covering
    them in subsequent editions.


    Happy reading and sharing!!!'
  merge: -1
  img_proc: true
