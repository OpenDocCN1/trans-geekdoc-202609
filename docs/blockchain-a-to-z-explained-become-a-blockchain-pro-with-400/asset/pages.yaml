  md: '# Fault Tolerance @ types


    Fault tolerance refers to the ability of a system (computer, network, cloud cluster,
    etc.) to continue operating without interruption when one or more of its components
    fail, thus affecting Reliability, Availability & Security.


    Crash faults happen due to failure of the hardware, software and network due to
    system and electricity failure etc., while Byzantine faults happen due to unauthorized
    access and malicious nodes.


    Byzantine Fault Tolerance in a cryptocurrency is the feature of reaching an agreement
    or consensus about particular blocks when some nodes fail to respond or give out
    malicious values to misguide the network.


    Crash fault tolerance (CFT) is one level of resiliency, where the system can still
    correctly reach consensus if components fail. Byzantine fault tolerance (BFT)
    is more complex and deals with systems that may have malicious actors.


    Practical Byzantine Fault Tolerance is a consensus algorithm introduced in the
    late 90s by Barbara Liskov and Miguel Castro. pBFT was designed to work efficiently
    in asynchronous (no upper bound on when the response to the request will be received)
    systems. It is optimized for low overhead time.'
  merge: -1
  img_proc: true
