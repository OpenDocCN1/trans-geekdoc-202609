- pgno: 51
  md: '# Address


    In Blockchain world, an address would typically be a hashed version of the “public
    key", which will be referred to by an individual or a platform, in order to transfer
    any cryptocurrency to a wallet. It is a combination of unique numbers and letters
    and a wallet works similar to an email address. Its like a bank account for cryptocurrency
    asset. In a public blockchain, address can also be used to perform analytics on
    a wallet as it is sufficient to trace assets in the wallet. In Bitcoin world,
    different address formats are used. Eg: P2PKH (addresses start with number 1)
    - 1BvBMSEYstWetqTFn5Au4m4GFg7xJjaNVN2.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# AES (Advanced Encryption Standard)


    Also known by its original name Rijndael, Advanced Encryption Standard was developed
    by two Belgian cryptographers Vincent Rijmen and Joan Daemen. It is based on a
    design principle known as substitution - permutation network, made popular in
    2001. Development started in 1997 when the need for alternate to Digital Encryption
    Standard (DES) was felt as DES was beginning to become vulnerable to brute force
    attacks. It is used in Software and Hardware globally to protect sensitive data
    in areas of government computer security, cybersecurity and electronic data protection.
    3 different versions are available AES 128, AES 192 and AES 256. 128, 192 and
    256 represent the key length that is used to encrypt and decrypt information.
    AES 128 uses 128 bit key length.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Air Drop


    Air Drop is a popular marketing campaign or technique used in Initial Coin Offerings
    (ICOs) whereby a certain allotment of the native cryptocurrency (tokens) is set
    aside for free distribution and given to contributors and the community in general.
    This is mostly done to increase awareness, create early value for tokens as recipients
    will begin to trade their airdropped tokens. It also promotes participation in
    ICOs, Blockchain network or enhance activities on the platform. Cryptocurrency
    start-ups have traditionally airdropped tokens to the wallet holders on Bitcoin
    and Ethereum networks. Uniswap (UNI) airdrop is believed to be one of the most
    lucrative airdrops in recent times.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Air Gapping


    When an individual or an entity is highly concerned about the security of any
    sensitive data or valuable asset held digitally like tokens and cryptocurrencies,
    they typically ensure physical separation of their devices from unsecure networks.
    This helps prevent likely cyberattacks that originate from unsecured networks
    or unauthorized access.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# Alan Turing


    Regarded as the Father of Modern Computer Science, Alan Mathison Turing''s work
    led to the origin of Turing completeness. In the Blockchain world, Turing completeness
    means that the protocol is able to use its code base to perform any task as long
    as it has correct instructions, enough time and processing power. In essence,
    it allows writing programming loops. Turing completeness became prominent when
    Ethereum claimed it is Turing complete while Bitcoin is not. In reality, Bitcoin
    is Turing complete. Turing completeness helps to protect the data to avoid possible
    information thefts, enhances security of the system from hackers and offers safe
    transaction system.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# Alt Coins / Alt Tokens/ Alternate Coins


    They represent all cryptocurrencies other than Bitcoin. There are various attributes
    that differentiate alternate coins from Bitcoin such as Consensus mechanism, Smart
    Contracts, Low price volatility or no volatility at all. There are more than 10,000
    alternate coins trading in over 350 exchanges globally'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# Anti-Fragile


    An anti-fragile asset performs better when there is risk and uncertainty, and
    gains strength from adverse events. This concept was created by the famous author
    Nasim Nicholas Taleb. He said that “some things benefit from shocks; they thrive
    and grow when exposed to volatility, randomness, disorder, and stresses and love
    adventure, risk and uncertainty”. A classic example is Bitcoin (BTC), it has become
    stronger with every price hit it has suffered over the years.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# API (Application Programming Interface)


    An Application Programming Interface allows any system to fetch from or push data
    to a third-party system. Prevalence of APIs has opened multiple possibilities
    across segments. In Banking, Open API Banking has resulted in creation of many
    innovative products & services by Fintechs and Banks leading to improved customer
    engagement, enhanced transaction security and increased convenience.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# Ashdraked


    Ashdraking is a complete loss of a crypto investor’s capital as a result of shorting
    Bitcoin where the aim is to sell Bitcoin at a higher price and buy it back at
    lower price. The term is named after “Lord Ashdrake”, a pseudonym Romanian Bitcoin
    trader who used to short Bitcoin - betting that its value would decline. Initially
    he made large profits as Bitcoin declined in 2014 - 2015. Then he shorted Bitcoin
    at $300 expecting prices to drop. On the contrary, Bitcoin prices went upto $600
    in a few weeks and he lost lots of money.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# ASIC (Application Specific Integrated Circuit)


    An Application Specific Integrated Circuit is particularly built for a specific
    computational use rather than being general-purpose. These have become very popular
    and are used in mining cryptocurrencies as mining on personal computers is difficult.
    They are more efficient than General Processing Units (GPUs). Once a cryptocurrency
    specific ASIC is released, mining without ASIC is usually unprofitable.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# Asymmetric Keys


    Asymmetric keys is the use of of two distinct or separate public and private keys
    (keys are different and not same as is the case with Symmetric keys). Public key
    is used for encryption and this can be decrypted only by a private key. Public
    and Private keys are mathematically connected with each other and their relationship
    differs from one algorithm to another. These keys in cryptocurrencies ensure that
    transaction sources are legitimate and hackers cannot steal the funds. In Bitcoin,
    the wallet address is a hashed version of the corresponding public key. It proves
    the ownership of address to receive funds / tokens / coins.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# ATH (All Time High)


    All Time High for a cryptocurrency or any stock price is the maximum price that
    the asset has reached as on current date. For Eg, Bitcoin reached an ATH of USD
    19,783 in 2017 and then an ATH of USD 61,712 in March, 2021.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# ATL (All Time Low)


    All Time Low is the lowest price of a cryptocurrency or any stock till date. This
    is used as a measure to understand the performance of an asset and the relative
    changes in the price.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# Atomic Swaps


    An atomic swap is when two cryptocurrencies can be traded amongst each other i.e.
    converted from one into another without the intervention of a third-party platform
    or exchange. They are made wallet to wallet in a fully person to person manner.
    They are called atomic as it results in either successful completion of swap and
    each trader receives the other’s funds or nothing happens with both traders keeping
    their respective funds. Tier Nolan who accomplished this in 2013 is widely considered
    as inventor of atomic swaps. The first atomic swap was established between Bitcoin
    and Litecoin.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# ABCI (Application Blockchain Interface)


    The purpose of ABCI (Application Blockchain Interface) is to provide a clean interface
    between any finite, deterministic state transition machine on one computer and
    the mechanics of a blockchain-based replication engine across multiple computers
    also known as consensus engine.'
  merge: -1
  img_proc: true
