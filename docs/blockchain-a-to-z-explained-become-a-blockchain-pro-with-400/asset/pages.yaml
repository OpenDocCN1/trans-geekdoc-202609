  md: '# Consensus Mechanisms


    The mechanism by which members come to an agreement about the authenticity of
    a transaction is referred to as the ‘Consensus Mechanism.’ Consensus formation
    ensures the involvement of multiple validators in a systematic and predetermined
    manner, ensuring decentralization and objectivity of decision making. It ensures
    implementation of the key features of the Blockchain platform like increased trust,
    immutability of the transactions, and maintenance of integrity of the platform.
    It is the soul of the Blockchain platform and will help members in reaching right
    decisions at all times. Sanctity of Blockchain applications depends on the strength
    and reliability of consensus mechanism used by it. Bitcoin and the earlier version
    of the public Ethereum client follows ‘Proof-of-Work (POW)’ Consensus mechanisms
    where miners or validators compete with each other and burn valuable resources
    like computing power and enormous amounts of electricity to guess the right Nonce
    (number used only once) and create a targeted hash to win the race to create a
    block. Ethereum platform will soon shift to a ‘Proof of Stake (POS)’ based consensus,
    which involves negligible energy consumption. Some new-generation public platforms
    use variations of ‘PO’ and ‘POS’-based consensus algorithms like PoET (Proof of
    Elapsed Time) and DPOS (Delegated Proof of Stake) to minimize resource utilization
    and wastage. Enterprise Blockchains like Hyperledger and others use energy-efficient
