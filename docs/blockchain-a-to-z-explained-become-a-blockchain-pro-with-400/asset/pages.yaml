  md: '# BAAS (Blockchain As A Service)


    BAAS is the third-party creation and management of cloud based networks for companies
    in the business of building blockchain applications. These third-party services
    are a relatively new development in the growing field of blockchain technology.


    IBM, AWS, Azure, Oracle, SAP, Alibaba, Stezy, Zeeve, Settlemint, Chainstack are
    some of the leading Blockchain as a Service Providers across the world.'
