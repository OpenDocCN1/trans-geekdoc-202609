- pgno: 351
  md: '# Proof_of_work


    Proof of work (PoW) is a decentralized consensus mechanism used to secure cryptocurrencies
    like Bitcoin, Ethereum and others. It is used for validating transactions and
    mining new tokens or coins. It is based on the premise that there are set of values
    which are difficult to produce but easy to verify. Miners club group of transactions
    into a block and try to mine. To mine the block, hard mathematical problem called
    ‘Proof of Work’ has to be solved. The solution lies in finding a number lower
    than the hash of the block, which is also known as target hash. Lower the target
    is, higher the difficulty to generate a block. Miners continue testing various
    values known as Nonces using compute power till the right value is found to solve
    the problem. Miner who solves the problem successfully gets the Block reward and
    adds the block to the network and broadcasts that block has been mined. Once the
    problem has been solved others can verify it easily based on Proof of Work algorithm.
    SHA 256, Scrypt and SHA-3 are some of the well-known algorithms powering Proof
    of Work.'
  merge: -1
  img_proc: true
