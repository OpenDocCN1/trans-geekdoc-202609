  md: '# Cryptography


    Cryptography, or cryptology, is the practice and study of techniques for secure
    communication by obscuring adversaries and malicious hackers. It is the process
    of converting ordinary/plain text to an un-intelligible format by using algorithms,
    in such a way that the intended parties can understand the same by applying corresponding
    decryption method. It is believed that Cryptography was used for correspondence
    by Spartans as early as 400 BC where they used a cipher device called Scytale
    for secret communication history can be classified into three phases. Phase 1
    – Upto World War 1 where ciphers were limited to few pages or few manual devices.
    After World War 1, mechanization of ciphers and cryptography began using telephone
    and telegraph devices resulting in Phase 2. There was also switch from electro-mechanical
    devices to electronics during this phase with the advent of Data Encryption Standards
    (DES) and Advanced Encryption Standards (AES). Phase 3 has commenced in the last
    two decades of Century with appearance of digital signatures and hashing algorithms.'
