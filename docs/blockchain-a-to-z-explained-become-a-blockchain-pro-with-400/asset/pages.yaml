  md: '# B_money


    B-money was one of the earliest cryptocurrencies, which was never launched officially.
    B-money endeaved to provide many of the same services and features (anonymous,
    distributed cash system) that cryptocurrencies of today provide. It was invented
    by Wei Dai. He is a member of Cypherpunks and co proposed VMAC message authentication
