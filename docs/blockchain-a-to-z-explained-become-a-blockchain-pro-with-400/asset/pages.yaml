- pgno: 44
  md: '# Prologue


    Professor Lisa Short


    DUniv., Grad. Cert Sc., Bch TQD, Dip. TQA Sys, Adv. Dip. OHS, BA (Economics, Geol.,
    Fin. Mgt.) Dip. Ed.


    Founder, P&L Digital Edge Ltd [UK] and Mind Shifting


    The speed of digital change is so great that we now have ‘revolutions’ that take
    less time than a generation. Blockchain is a foundational technology of the Fourth
    Industrial Revolution that has jettisoned us into Society 5.0 and onto a vigorous
    transformation curve that for some sectors is forty faster than it was a year
    ago. It is heralded along with Intelligence and the Internet of Everything as
    shifting simple networks based on how we connect and transfer information to smart
    networks that have the capacity to transfer value. It isn''t just about speed
    and efficiency; it is about changing behaviour, redefining, and redesigning the
    way we conduct business and are enabled to live our lives.


    Blockchain is about valorising trust. Created in the aftermath of the 2008 global
    financial and trust crisis, it has become the building block of a brave new world
    where we have replaced the fundamental sense of governance and assurance with
    a technology, to be honest, many don''t understand. Blockchain technology'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'is an enabler and becomes an engine of inclusion that supports our economic
    and social systems including climate change and inequity. It can provide an identity
    to greater than 2 billion people who cannot participate in financial systems.
    In doing so it converts fragmented communities, to educated, financially included
    ‘thinkers and doers’ who can transform nations and support their future.


    If people don’t understand blockchain they can’t participate in its ability to
    empower and enable us. Thus, it is incumbent upon influencers, industry leaders,
    educators, and credible experts, like me and the authors of this book who''ve
    got the knowledge that converges experience, pragmatism, developmental know-how
    to share our wisdom in such a way that adoption becomes ubiquitous.


    Wisdom is not devoid of curiosity, effort, lifelong learning, and the joy of seeing
    the benefits of technology develop. I was not born a digital native. I can remember
    buying that first computer for my children in the 1990s, turning it on and seeing
    that green flashing ‘dash’ of a DOS based computing system and thinking this is
    grand, now what do I do? To be honest, I had absolutely no idea. Everyone I knew
    was in the same boat, so we muddled through together. The continued to learn,
    through trial and error and even floundered our way through dial up internet,
    floppy drives, disc drives, USBs, and CDs. Apples became computers not a piece
    of fruit, phones turned from bricks to essential pocket-sized accessories and
    laptops became something that empowered life away from a desk.'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'Not so many years ago I remember reaching out to a colleague to ask them “What
    on earth blockchain?”. It was the era of the Initial Coin Offerings (ICOs) and
    there was lots of technical banter on social media and developer networks. There
    was a vast and seemingly never-ending lexicon of new terms, words and processes
    that made me feel like I was in a Kafkaesque nightmare experiencing my worst ever
    episode of impostor syndrome as I was back in that place of having absolutely
    no idea. Ruminations about the potential of Blockchain were overshadowed by the
    hype of failed ICOs and the cryptocurrency explosion. It wasn''t the gracious
    introduction of such an amazing technology and created a great deal of confusion,
    misinformation, and misunderstanding.


    I had a resource that was a simple explainer of any name, term, acronym (and there
    are hundreds of them) and processes it would made my journey much easier. This
    book does just that. It is not just a listed reference text, it represents an
    ontology of the author’s priceless years of experience and learning and collaboration
    in the industry so that a clear contextual understanding of blockchain can be
    obtained in one place. If someone can understand the language, they will know
    the questions to ask to be included.


    Rajesh Dhuddu is recognised globally as making blockchain relevant for the common
    person. Sriniv Mahakali is focused on enabling easy adoption of blockchain across
    the world. Together their experience, thought leadership and technical prowess
    are the reason our paths initially crossed. But it is the impact of their project
    delivery on society and the multidisciplinary approach they'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'take which led me to know that this A to Z of blockchain is a lexicon that
    would be as pragmatic as they are and a resource that every business, decision
    maker, student, parent, leader, educator, and journalist should include as a ‘must
    have’. I am resolute until the hype and misinformation is corrected, and terminology
    understood that the vertical rise in enlightenment cannot occur. Education and
    access to credible resources are the front door key to blockchain adoption.


    Less than 3% of senior academics, government decision makers and board members
    have science and technology expertise and there is only a fraction of those with
    knowledge of blockchain. To quote the French Minister of Economy Bruno Le Maire
    ‘all I know is that most people talking about blockchain, know nothing about blockchain!”.
    Never true word was uttered. This book offers them, and all small to medium enterprises
    who constitute 99% of the global economy a coalescence of a simple explanations
    of everything from a POET to a whale to eliminate the arcane language in the industry
