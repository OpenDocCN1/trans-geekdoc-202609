    AKS is an open-source fully managed container orchestration service available
    on the Microsoft Azure public cloud that can be used to deploy, scale and manage
    Docker containers and container-based applications in a cluster environment. It
    helps in setting up and managing containerized applications in seconds and was
    released on 8th March 2019.'
