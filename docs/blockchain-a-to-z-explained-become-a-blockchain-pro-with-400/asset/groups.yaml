    \ images, audio, and documentation. In today’s world, it is widely used to refer\
    \ to cryptocurrencies that are decentralized and run on a network that is distributed\
    \ across a large number of computers.\n\n# Digital Signature\n\nIt validates the\
    \ authenticity and integrity of a message, software or digital document using\
    \ mathematical techniques. It solves the problem of tampering or impersonation\
    \ in digital communications using Asymmetric cryptography as RSA based on public\
    \ key cryptography. Digital Signatures use security features and methods such\
    \ as Checksum, Certificate Authority (CA) validation, and Trust Service Provider\
    \ (TSP) Validation.\n\n# Distributed Ledger\n\nA distributed ledger is a shared\
    \ database containing digital data that is synchronized at regular intervals even\
    \ though it is geographically spread across multiple sites, countries, or institutions.\
    \ It doesn't have a central administrator and allows for public witnesses or consent.\
    \ It can be either Permissioned or Permissionless ledgers.\n"
  mdcn: '


    # DDoS攻击（分布式拒绝服务攻击）


    分布式网络攻击通常被称为分布式拒绝服务（DDoS）攻击。这类攻击利用了任何网络资源（如支持公司网站的基础设施）特定的容量限制。DDoS 攻击会向受攻击的网络资源发送多个请求——其目的是超过网站处理多个请求的能力，并防止网站正常运行。为了防止瘫痪网络基础设施的
    DDoS 攻击，特别是那些基于中心化原则架构的网络，人们正在考虑基于分布式账本技术的去中心化基础设施，以防止单点故障。


    # DES（数字加密标准）


    数据加密标准是一种用于数字数据加密的对称密钥算法。该算法于20 世纪 70 年代初在 IBM 开发，基于 Horst Feistel 早期的设计。在国家标准局（NBS）邀请为保护敏感非机密电子政府数据提交候选方案后，该算法被提交。1976
    年，在与国家安全局（NSA）协商后，NBS 选取了一个略微修改的版本，并于 1977 年作为美国的官方联邦信息处理标准（FIPS）发布。原始 DES 的 56
    位密钥大小在开发时是足够的。为了防止由于计算能力的增加而对 DES 成功的暴力破解攻击，三重 DES（TDES）应而生，它对每个数据块应用三次 DES 算法。2002
    年 5 月，高级加密标准（AES）取代了 DES。


    # De-Fi（去中心化金融）


    去中心化金融（通常称为 DeFi）是一种基于区块链的金融形式，它不依赖经纪商、交易所或银行等中央金融机构来提供传统的金融工具，而是利用区块链上的智能合约（最常见的是以坊）。Maker、Uniswap
    和 Compound 是一些领先的 DeFi 服务提供商。


    # 去中心化


    在区块链中，去中心化是指控制权和决策权从中心化实体（个人、组织或其群体）转移到分布式网络。它促进了信任的数字化，即信任包含在分布式网络中而不是中心化节点或实体中。它提供了一个信任的环境，促进了数据对账，减少了故障点并最大化地实现了资源分布。


    # 委托权益证明（DPoS）


    它与权益证明相似，因为区块链的区块验证者需要对待验证的交易投资或质押加密货币。这些验证者通过各种代币持有者的投票选出，票数与其持仓量成正比。


    # Degen


    指参与拉高出货（pumping and dumping）计划的加密货币项目。通常，毫无价值的垃圾代币在各种通信渠道和论坛中被炒作，随后被 Degens（投机者）抛弃。Tendies、YFI
    和 Yam 已被视为 Degen 项目。


    # DevOps


    DevOps 是 Patrick Debois 在 2009 年创造的术语，是敏捷软件开发的补充性实践集，在过去，开发团队和运营团队保持分离和孤立状态。它的目标是从项目开始初就将这两个团队结合起来，缩短系统开发生命周期并提供高质量软件的持续交付。这取代了瀑布式软件开发模型。


    # DEX（去中心化交易所）


    加密资金和余额由用户维护。DEX 没有任何托管。它利用软件工具、开放区块链和互联网促进双方之间的交易。DEX 是自治的，由算法和智能合约运行。有 Dydx、Uniswap、Bancor
    和 BisQ。


    # 钻石手（Diamond Hands）


    它代表了尽管价格下跌仍坚持持有加密货币的投资者的坚持性。


    # DIDs（数字标识符）


    DIDs 是一种去中心化身份，允许任何个人、组织或事物使用加密基础进行识别。它们消除了对中央管理系统的需求，并由世界维网联盟（W3C）推广。


    # DIEM


    Diem 是 Facebook, Inc. 提出的基于许可区块链的支付系统。它与美元锚定，以前被称为 Libra。


    # 难度


    难度是一个调节矿工向区块链添加新区块所需时间的的数字。在比特币中，它决定了寻找特定目标以下哈值的难度等级。难度每 10 分钟根据所需时间调整一次。


    # Digi 货币


    DigiCash 由电子货币先驱 David Chaum 于 1989 年创立，是最早的电子货币公司之一。DigiCash 使用加密协议通过盲签名技术使交易匿名化。因此，银行或政府将无法追踪在线进行的个人支付。难怪
    David Chaum 是最著名且领先的密码客（Cypherpunks）人物之一。


    # 数字资产


    数字资产的定义是“存在于二进制数据中的任何自包含的、唯一标识的且具有价值或使用能力的物体”。当该术语在 90 年代中期出现时，数字资产是视频、图像、音频和文档等物品。在当今世界，它被广泛用于指去中心化的、运行在跨大量计算机的网络上的加密货币。


    # 数字签名


    它使用数学技术验证消息、软件或数字文档的真实性和完整性。它使用基于公钥加密的 RSA 非对称加密解决了数字通信中的篡改或冒充问题。数字签名使用校验和、证书机构（CA）验证以及信任服务提供商（TSP）验证等安全特性和方法。


    # 分布式账本


    分布式账本是一个包含数字数据的共享数据库，尽管地理分布在多个站点、国家或机构，但也会定期进行同步。它没有中央管理员，并允许公共见证或共识。它可以是许可账本或非许可账本。


    '
