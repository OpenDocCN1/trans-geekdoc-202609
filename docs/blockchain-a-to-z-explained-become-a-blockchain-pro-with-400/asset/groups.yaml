    # Orphan Block


    Orphan blocks, often referred to as stale blocks, are blocks that are not accepted
    into the blockchain network due to a time lag in the acceptance of such block
    into the blockchain. These also refers to blocks that are submitted to a node
    without its entire ancestry (previous Blocks), hence they cannot be validated.
    Miners don’t get rewarded or incentivized for these Orphan Blocks.'
  - '[PAGE 331]


