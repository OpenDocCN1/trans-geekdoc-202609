  - '[PAGE 348]


    # Proof_of_Authority


    Proof of Authority (PoA) is a reputation-based consensus algorithm that introduces
    a practical and efficient solution for blockchain networks, especially the private
    ones. The term was proposed in 2017 by Ethereum co-founder and former CTO Gavin
    Wood. Rights to generate new blocks are given to nodes that have proven their
    authority; authority is obtained through clearing preliminary authentication.
    Benefits of PoA include –


    No need for high performance hardware


    High transaction rates


    New blocks generation time or intervals are predictable


    IOTW Blockchain uses PoA consensus algorithm.'
  - '[PAGE 349]


    # Proof of Burn


    Proof-of-Burn (PoB) is a blockchain consensus mechanism that requires minimal
    energy consumption compared to proof-of-work (PoW). In this mechanism, miners
    burn coins by sending them to addresses from which coins cannot be retrieved instead
    of investing in expensive computers to mine. This burning provides miners a privilege
    to mine based on random selection process. Slimcoin and Third Generation Coin
    (TGCoin) use Proof of Burn consensus mechanism.'
  - '[PAGE 350]


    # Proof of Stake


    A consensus mechanism used to achieve distributed consensus. In case of Ethereum,
    it requires users to put on stake their Ether to become a validator. Validators
    are chosen randomly to create blocks and are responsible for checking and confirming
    blocks they do not create. This confirmation or validation is like attestation.
    Validators obtain rewards for proposing new blocks that are good and not malicious
    and lose their stake in-case they attest malicious blocks. Proof of Stake consensus
    mechanism is better than Proof of Work in energy utilization and providing higher
    immunity to centralization. Owing to energy efficiencies, cryptos using Proof
    of Stake are also knowns as green cryptos like Cardano, Polkadot, Neo and Cosmos.'
  - '[PAGE 351]


    # Proof_of_work


    Proof of work (PoW) is a decentralized consensus mechanism used to secure cryptocurrencies
    like Bitcoin, Ethereum and others. It is used for validating transactions and
    mining new tokens or coins. It is based on the premise that there are set of values
    which are difficult to produce but easy to verify. Miners club group of transactions
    into a block and try to mine. To mine the block, hard mathematical problem called
    ‘Proof of Work’ has to be solved. The solution lies in finding a number lower
    than the hash of the block, which is also known as target hash. Lower the target
    is, higher the difficulty to generate a block. Miners continue testing various
    values known as Nonces using compute power till the right value is found to solve
    the problem. Miner who solves the problem successfully gets the Block reward and
    adds the block to the network and broadcasts that block has been mined. Once the
    problem has been solved others can verify it easily based on Proof of Work algorithm.
    SHA 256, Scrypt and SHA-3 are some of the well-known algorithms powering Proof
    of Work.'
  - '[PAGE 352]


    # Protocol


    Protocols are basic sets of rules governing sharing of data between computers.
    For Cryptocurrencies, they establish guidelines pertaining to structure of the
    blockchain, consensus mechanisms and distributed database that allows digital
    money to be securely exchanged in the network and over the internet.'
  - '[PAGE 353]


    # Public Blockchain


    A public blockchain is also known as Permissionless Blockchain. Anyone can join
    the Blockchain network and information is available in a public domain. Due to
    its permissionless nature, any party can view, read, and write data on the blockchain
    and such data is accessible to all. No particular participant or a node in the
    network has full control over the data contained in a public blockchain. Bitcoin
    and Ethereum are good examples of Public Blockchain.'
  - '[PAGE 354]


    # Public Keys


    A public key is a large numerical value that is used to encrypt data or information.
    This key can be generated by a software program but in practice is usually provided
    by a trusted, designated authority known as certification authority. The messages
    encrypted by public keys can be deciphered using a private key which is held by
    recipient of information and the key is known only to them. Every public key matches
    with only one private key.'
  - '[PAGE 355]


    # Pyethereum


    Pyethereum is the Python core library of the Ethereum project. In other words,
    it refers to implementation of Ethereum Virtual Machine using Python programming
    language. It was written by Vitalik Buterin'
  - '[PAGE 356]


    # Python


    Invented by Guido van Rossum in the year 1991. It is a high-level object oriented
    programming language with dynamic semantics. It has gained popularity and wide
    adoption owing to simple programming syntax, English like commands and readability
    of its code. It is widely used for web development, machine learning, artificial
    intelligence and mobile application development. Latest version of Python is version
    3.9 released in October 2020. Python allows developers to create Blockchain using
    only minimal lines of code and also comes with several free packages that make
    Blockchain code more efficient.'
  - '[PAGE 357]


    # PaaS (Platform as a Service)


    It''s a business arrangement or model where users of PaaS need not install in-house
    hardware and software to develop or operate applications. The PaaS provider delivers
    software and hardware tools to users over the internet using cloud computing technology.
    Users will pay based on their usage – “Pay as you Go” pricing model. PaaS is delivered
    through public, private or hybrid cloud platforms. Various types of PaaS include
    Open PaaS, Mobile PaaS, Hybrid PaaS, Private PaaS and Public PaaS. Google, Red
    Hat, Oracle, IBM, Amazon Web Services (AWS) and Microsoft are leading PaaS providers.'
  - '[PAGE 358]


    # Pump and dump


    It refers to buyers accumulating cryptocurrencies or tokens with an intention
    to manipulate the pricing upwards by creating bullish sentiments and spreading
    wrong information, leading to price inflation (pumping) and then selling them
    all at once which causes prices to crash (dumping).'
  - '[PAGE 359]


    PGP (Pretty Good Privacy)


    Developed by Phil Zimmermann in 1991 as free email security program, Pretty Good
    Privacy is an encryption program used for signing, encrypting and decrypting texts,
    e-mails, files, directories and whole disk partitions. PGP uses International
    Data Encryption Algorithm (IDEA) invented by Xuejia Lai and James Massey in 1991,
    which is the private key protocol and uses RSA as public key encryption system.
    It uses both Public and Private cryptosystem to increase the security and privacy
    of data and e-mail communications.


    PGP survived law suits from NSA and US Government in its early days as it helped
    people and enterprises to secure their communications and insulate them from trapdoors
    that would have existed in secure communications equipment so that messages could
    be decrypted and read by the Government.'
  - '[PAGE 360]


