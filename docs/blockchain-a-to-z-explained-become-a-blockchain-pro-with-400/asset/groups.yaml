    ## 单点故障 (Single_Point_of_Failure)


    这是系统中的错误配置、弱点或缺陷，会导致系统停止运行。它也可能是由于恶意攻击引起的，例如拒绝服务（DoS）或分布式拒绝服务（DDoS）攻击。中心化系统往往容易产生单点故障。像区块链这样的分布式和去中心化系统可以不受此类故障的影响。


    ## 单一事实来源 (Single Source of Truth)


    单一事实来源是将组织内部多个运营或业务系统中的数据、信息聚合到单一位置、账本或系统中的做法。在区块链中，单一事实来源意味着网络中的每个节点都包含相同的数据。这导致信息在网络其他成员不知的情况下无法被更改，从而实现了不可篡改性。基本上是一个防错且防篡改的记录系统。


    ## 削罚机制 (Slashing Condition)


    削罚是内置在权益证明（PoS）区块链协议中的一种机制，旨在惩罚验证者的错误行为，例如持续离线、双签和委托。惩罚措施包括减少质押、抑制未来奖励以及剔除节点。因此，削罚的设计是为了激励节点安全、可用性和网络参与。以太坊
    2.0、Celo、Cosmos、ICON 和 Polkadot 都对离线、委托和双签设有各种削罚惩罚。


    ## 智能合约 (Smart Contracts)


    智能合约由 Nick Szabo 在 1994 年首次提出，它们是存储在区块链上的程序，在满足预设条件时运行。它们被用于自动执行协议，使所有参与者都能知结果并遵守结果，而无需任何时间损失或中介参与来强制执行。以太坊是世界上最流行的智能合约平台，它使用
    Solidity 编写智能合约并运行在以太坊虚拟机（EVM）上。


    ## 软分 (Soft Fork)


    当区块链协议的更改向后兼容且用户只需升级软件时就会发生软分。这类似于升级手机、平板电脑或智能手表的操作系统以修复漏洞并更新安全功能。软分后，将只有一个区块链，不像硬分会导致区块链分裂为两个。以太坊的
    Metropolis 就是软分的一个良好例子。


    ## Solidity


    它由 Gavin Wood 提出，由 Christian Reitwiessner、Alex Beregszaszi 以及几位前以太坊核心贡献者开发。Solidity
    受 C++、JavaScript 和 Python 的影响，设计用于与以太坊虚拟机交互。本质上，它是以太坊网络的基础，允许开发者创建自己的去中心化应用（dApps）。dApps
    可以运行智能合约，根据预定义的条件完成传输资金、交换份额或移动任何有价值物品的活动。


    ## Sovrin


    Sovrin 会成立于 2016 年，是一个私营的国际非营利组织，旨在治理 Sovrin 身份网络。Sovrin 网络是一个公共的、许可的分布式账本，专为保护互联网上的身份而构建，其中个人应该在没有管理机构干预的情况下拥有并控制自己的身份，因此被称为自主主权身份（SSI）。Sovrin
    会提供以信誉的方式运行 SSI 网络所需的轻量级治理。


    ## SPV 客户端（简单支付验证，Simple Payment Verification）


    这是一项在 Satoshi Nakamoto 的论文中首次描述的技术。它允许轻量级客户端在不下载整个区块链的情况下验证交易是否包含在比特币区块链中。它通常用于运行在智能手机上的比特币钱包应用，通过使用特殊的
    SPV 节点作为应用程序与矿工节点之间的中介。


    ## SQL（结构化查询语言）


    SQL 最初由 IBM 研究人员于 20 世纪 70 年代开发，是一种用于数据库存储、查询和检索数据的标准语言。它用于创建、删除、获取和修改数据库行。


    ## SSI（自主主权身份，Self Sovereign Identity）


    SSI 是一种身份验证和认证模型，其前提是个人应该拥有并控制自己的身份。它为用户提供了安全性和灵活性，使他们能够在意图分享时才分享信息。它免于管理机构或中心化/联邦身份提供者的干预，并基于“无人拥有，但每个人都有访问权”的概念。它消除了收集已经在其他地方收集过的文档的需求。验证者仅获得用户授权共享的信息，此类信息通过加密方式在分布式账本上共享，从而防止被修改。Evernym
    和 Sovrin 是从事 SSI 的知名公司。


    ## 稳定币 (Stable Coins)


    稳定币是价值锚钩到参考其资产或货币市场价值的加密货币。稳定币可能挂钩美元等货币，也可能挂钩黄金等商品价格。最流行的稳定币有 Tether、Diem、USD
    coin、Dai 和 PAX。与其他加密货币不同，它们通常提供价格稳定性，因此非常受不喜欢价格过度波动的投资者和用户的欢迎。


    ## 过期区块 (Stale Block)


    这些区块也被称为孤儿区块（Orphan blocks），它们被成功挖掘但未包含在当前最佳区块中。这发生在添加到非最长链中时。在比特币区块链中，只有最长链胜并推动区块链向前。


    ## 状态 (State)


    状态反映了区块链上所有提交的交易。这基本上是一个键值存储，随着交易和链码的执行而更新。为此，使用了 LevelDB 或 CouchDB。


    ## 状态通道 (State Channel)


    通道是一种私有的区块链覆盖层，允许数据隔离和机密性。通过状态通道，用户在链外直接进行交易。它们通过减少节点在处理和存储交易时的负载，有助于提高公共区块链的吞吐量。它们还预计降低以太坊网络的使用，因为用户只在开启和关闭通道时支付交易费用（也称为
    gas），而不为交易本身付费。


    ## 静态节点 (Static Nodes)


    它们代表一组预配置的受信节点。在 Hyperledger Besu 中，静态节点不受某些限制，例如最大对等数量和远程连接限制。静态节点还被用作寻找对等节点的替代方法。


    ## Stellar


    Stellar 是一个由分布式账本技术（DLT）驱动的支付协议。Stellar 使创建、发送和交易所有形式的货币（美元、披索、比特币和其他货币）的数字表示成为可能。它的设计使得世界上所有的金融系统可以在单个网络上协同工作。Lumen
    是 Stellar 的原生货币，在 Stellar 网络成立时创建了 1000 亿个 Lumen。


    ## 管家 (Steward)


    用于 Sovrin 网络，促进互联网上自主主权身份（SSI）的使用。Sovrin 管家是通过运行验证者节点来运营网络的组织，这些节点负责在 Sovrin 账本上进行读写操作。这些受信任的志愿者捐赠时间、资源和计算力来运行和维护网络，同时遵守
    Sovrin 治理框架的要求。目前有来自6个大洲13个国家的50 名管家。


    ## 自杀合约 (Suicide contract)


    自杀合约是一种带有安全回退选项的合约，可以通过所有者或受信任地址将其“杀掉”。这通常用于紧急情况，例如由于钱包或账户受到攻击或功能运行错误导致资金被抽取时。


    '
