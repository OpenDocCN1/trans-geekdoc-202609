    # Cosmos


    Cosmos is a decentralized network of independent parallel blockchains, each powered
    by Byzantine Fault Tolerance (BFT) consensus algorithms like Tendermint consensus,
    allowing the Blockchains in its ecosystem to scale and interoperate with each
    other.


    Cosmos has two types of blockchains: Zones and Hubs. Zones are regular Blockchains,
    while Hubs are Blockchains that connect zones with one another. The Cosmos Hub,
    is a public, Proof-of-Stake (PoS) Blockchain whose native asset or cryptocurrency
    is Atom. More than 210 Atoms are in circulation.'
