  md: '

    ## Miners


    A miner is a node in a Blockchain network that collects transactions and organizes
    them into blocks. Whenever transactions are made, all network nodes receive them
    and verify their validity. Then, miner nodes gather these transactions from the
    memory pool and begin assembling them into a block after validation. In Bitcoin
    network, miners receive two kinds of rewards – New Bitcoins (for finding new Bitcoin
    blocks, solving mathematical problems successfully to obtain private keys pertaining
    to the blocks so that blocks can be confirmed and transactions can be written
    into them) and Transaction fees (for validating transactions so that Bitcoin involved
    in the transaction can be spent).


    ## Mining


    Cryptocurrency mining is the process in which transactions between users are verified
    and added to the blockchain public ledger. The process of mining is also responsible
    for introducing new coins into the existing circulating supply, by solving complex
    mathematical problems with the help of computers’ processing power. It is one
    of the key elements that allow cryptocurrencies to work as a peer-to-peer decentralized
    network, without the need for a third-party central authority.


    ## Mining Difficulty


    Mining difficulty is a relative measure of the amount of computer resources required
    for mining, Eg: fresh bitcoin. It either increases or diminishes roughly every
    2,016 blocks in Bitcoin. If previous 2016 blocks were mined easily, the mining
    difficulty increases for next 2016 blocks and vice versa. In Ethereum, difficulty
    is measured based on how many hashes or miners are involved in finding a valid
    solution to solve next Ethereum Block. As more miners or hashing power is added
    to the network, difficulty will increase automatically ensuring new blocks are
    not added to the network quickly.


    ## Mining Pool


    In cryptocurrency mining, a mining pool is the pooling of computer resources or
    compute power by miners, who share their processing power over a network, to solve
    mathematical problems to find new blocks. They split rewards equally, according
    to the amount of compute power and work they contributed to finding and solving
    new blocks. Slush Pool (1.25 million BTC mined), ViaBTC, AntPool and BTC.com are
    some of the leading Bitcoin mining pools in the world. SparkPool, Ethpool, Nanopool
    and Dwarfpool are some of the leading Ethereum Mining pools.


    ## Mint


    Bitcoin.com has launched Mint, a free platform that empowers anyone to create
    tokens quickly and easily. Combined with other pro-token products by Bitcoin.com,
    Mint is expected to drive blockchain adoption, as it fuels the development of
    a vast new token ecosystem. Mint is being upgraded to Pitco 2.0.


    ## Mist


    Mist is an all-in-one software to manage all assets and contracts of an individual
    in Ethereum Blockchain. Mist can browse DApps, manage contracts, manage Ether
    and other digital assets. It acts like a window to the Blockchain network and
    accesses different applications and services provided in the network. It also
    supports Whisper (decentralized communication protocol) and Swarm (decentralized
    storage platform).


    ## Morden


    Ethereum version 0.9 was launched under the name Olympic in early 2015. It was
    the first Public Testnet. By mid 2015, Olympic became deprecated and was replaced
    by Morden. Later, Frontier official Ethereum version 1 was launched as public
    main network in 2015 and was forked to Homestead in 2016. Morden was equivalent
    to Frontier from a test net perspective. It became deprecated in late 2016 and
    was replaced by Ropsten.


    ## Multisig (Multi-signature)


    Multi-signature (Multisig) refers to using multiple keys to authorize a blockchain
    transaction, rather than a single signature from one key. It avoids a single-point
    of failure, making it substantially more difficult for the wallet to be compromised.
    So, a multisig wallet can be programmed in such a way that a transaction can be
    authorized if atleast 2 out of 3 keys are used. Electrum, Armory and BitGo are
    examples of Multisig wallets.


    ## NAT (Network Address Translation)


    NAT translates the IP addresses of computers, registered or unregistered, in a
    local network to a single IP address. This address is often used by the router
    that connects computers to Internet. The router can be connected to a DSL modem,
    Cable modem, T1 line, or even a Dial-up modem. Blockchain is empowering Smart
    NAT management scheme to overcome limitations that exist in vertical model. With
    Blockchain implementation for NAT, every peer will agree on necessary parameters
    required to manage complicated NAT and Mobility management procedures.


    ## Neo bank


    A neobank is a kind of digital bank without any branches. Rather than being physically
    present at a specific location, neobanking is entirely online. Neobanks are also
    called as fintech firms that provide digital and mobile-first financial solutions
    payments and money transfers, money lending and more. Chime, Monzo, Revolut, N26
    and Klarna are some of the top Neo Banks globally.


    ## Network Value Model


    In Blockchain network, every participant has to have their own value but the network
    itself should be setup to facilitate it. So, the value model is based on principle
    to create value for 1) everyone funding the network 2) everyone who needs this
    network and 3) everyone using the network regularly. Usually, we see a major company
    building a permissioned or permissionless blockchain network, but it''s really
    the vendors using it who drive the adoption and usage of such blockchain network.
    Hence, the value has to be created for all parties and should be done in the design
    phase of the prototype or the minimum viable product (MVP) or network stage. If
    its not accomplished during MVP stage, it should certainly be done in the Go-To-Market
    stage while scaling from MVP stage to ecosystem production state.


    ## Nexledger


    Nexledger is an open-source hybrid, private-permissioned blockchain platform developed
    by Samsung SDS. Nexledger is a full-features platform with a core that integrates
    a range of components such as monitoring tools, external linkages, application
    programming interfaces and a structured DevOps environment. It comes in versions
    that are compatible with Ethereum (Nexledger E) and Hyperledger Fabric (Nexledger
    F). It has two offerings – Nexledger Universal that provides API libraries to
    integrate multitude Blockchain consensus algorithms and Nexledger Accelerator
    that helps in increasing Transaction Per Second (TPS) up to 15 times.


    ## NFT (Non Fungible Token)


    A non-fungible token (NFT) is a unit of data on Blockchain digital ledger, where
    each NFT can represent a unique digital item; hence they are not interchangeable.
    NFTs can represent digital files such as art, audio, videos, items in video games,
    virtual assets and other forms of creative work. The NFTs can be bought on an
    NFT marketplace. NFTs have led to a significant growth in Digital Collectibles
    also referred to as Crypto collectibles. Cryptokitties, Cypherpunk, Topstops are
    some of the leading NFTs. They are sold on various market places – NBA Top Shot
    (Basket Ball), Sorare (Soccer), Decentral Land (Virtual Real Estate), Axie Infinity
    (Video Games).


    ## NGMI (Not Going to Make It):


    Its a crypto slang used to indicate that a crypto trader or investor is going
    to miss a huge profit in a particular trade. It is also used as a name for a meme
    crypto, where in a person selling a NGMI token will not be allowed to buy back.


    ## Nick Szabo


    Nick Szabo is a computer scientist and cryptographer known for his research in
    digital contracts and digital currency. He graduated from the University of Washington
    in 1989 with a degree in computer science and received a law degree from George
    Washington University Law School. The phrase and concept of smart contracts was
    developed by Szabo. He proposed Bit Gold in 1998 – one of the initial efforts
    aimed at creating decentralized virtual currencies. Bit Gold principles resemble
    Bitcoin closely in terms of time stamped Blocks that are stored in title registry
    and created using Proof of Work (PoW).

