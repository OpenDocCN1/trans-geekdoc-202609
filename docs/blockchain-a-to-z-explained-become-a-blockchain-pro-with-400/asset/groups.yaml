    # Channels


    In Hyperledger Fabric, there can be multiple ledgers and each ledger is referred
    to as a Channel. They help to promote Data Privacy by enabling private communications
    between various members. They can be dynamically created and reconfigured. Parties
    transacting in a Channel should be authenticated to that particular Channel to
