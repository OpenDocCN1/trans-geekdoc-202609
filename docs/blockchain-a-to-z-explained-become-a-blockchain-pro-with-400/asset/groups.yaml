    区块链是一种推动者，并成为包容性的引擎，支持着我们的经济和社会系统，包括气候变化和不平等问题。它可以为超过 20 亿无法参与金融体系的人提供身份。通过这种方式，它将碎片化的社区转化为受过教育的、金融包容的“思考者和行动者”，他们能够改变国家并支持他们的未来。


    如果人们不理解区块链，就无法利用它赋能和助力我们的能力。因此，影响力人物、行业领袖、教育者以及像我及本书作者这样拥有相关知识的信誉良好的专家，有责任分享我们汇聚了经验、务实和开发诀窍的智慧，以这种方式让技术的普及变得无处不在。


    智慧并不缺乏好奇心、努力、终身学习以及看到技术发展带来收益的快乐。我并非天生的数字原生。我还记得 20 世纪 90 年代为孩子们买了第一台电脑，打开电源看到
    DOS 计算机系统上闪烁的绿色“破折号”，心里在想：这太棒了，现在我该怎么办呢？老实说，我完全不知道。我认识的每个人都在同一条船上，所以我们一起摸索着前进。我们不断学习，通过反复尝试，甚至在拨号上网、软盘驱动器、光驱驱动器、USB
    和 CD 中挣扎前行。苹果变成了电脑而不是一种水果，手机从砖头变成了必不可少的口袋尺寸配件，笔记本电脑变成了一种离开办公桌也能赋能生活的工具。


    就在几年前，我记得联系一位同事问道：“区块链到底是什么？”那是初次代币发行（ICO）的时代，社交媒体和开发者网络上有大量的技术闲谈。有一系列庞大且似乎永无止境的新术语表、词汇和流程，让我感觉自己仿佛置身于卡夫卡式的噩梦中，经历着我经历以来最严重的冒充者综合征，因为我又回到了那种完全一窍如的境地。对区块链潜力的沉思被失败的
    ICO 炒作和加密货币的爆发所掩盖。这并不是这种神奇技术的优雅引入，反而造成了大量的困惑、误导信息和误解。


    我曾拥有一份资源，可以对任何名称、术语、缩写（那里有数百个）和流程进行简单解释，这让我的旅程变得容易得多。本书正是做到这一点。它不仅仅是一份列表参考文本，它代表了作者在行业内多年宝贵的经验、学习和协作的本体论，使得可以在一个地方获得对区块链的清晰语境理解。如果有人能理解这种语言，他们就会知道通过问什么问题来让自己融入其中。


    Rajesh Dhuddu 全球因使区块链对普通人产生意义而闻名。Sriniv Mahakali 专注于在全球范围内实现区块链的轻松采用。他们的经验、思想领导力和技术实力正是我们道路最初交汇的原因。但正是他们项目交付对社会的影响以及他们所采取的跨学科方法，让我意识到这本从
    A 到 Z 的区块链是一本像他们一样务实的词汇表，是每个企业、决策者、学生、家长、领导者、教育者和记者都应该列为“必备”的资源。我坚信，只有在炒作和误导信息被纠正、术语被理解之前，启蒙的垂直增长是无法发生的。教育和获取信誉资源是通往区块链的大门钥匙。


    不到 3% 的高级学者、政府决策者和董事会成员拥有科学技术知识，而其中了解区块链的人寥寥无几。引用法国经济部长布鲁诺·勒马尔（Bruno Le Maire）的话：“我只知道大多数谈论区块链的人对区块链一无所知！”这从未说过过的真话。这本书为他们以及所有占全球经济
    99% 的中小企业提供了一系列简单的解释，涵盖了从 POET 到“鲸户”（whale）的所有内容，以消除行业中那些甚至让我们最优秀的人感到困惑的奥涩语言。


    这本书是一本重要的参考书，因为区块链术语可能变得过度复杂且极其深奥；这将成为导航这一基础性技术兴奋前沿的障碍，在这一领域中，我们可以嵌入创新的想法和解决方案，创建一个以人类为中心的智能社会。区块链不仅是一种技术，它是一种哲学，如果你希望未来的系统为你服务，每个人都需要了解它可能影响的系统性变化以及它可以颠覆的行业。


    Lisa Short 教授因在区块链、加密资产和教育技术（EdTech）方面的工作被公认为全球前 150 位思想领袖以及全球最受关注的前 50 位领导者和影响力人物，她是数字技术生态系统的驱动力。


    他是一位著名的密码朋克（Cypherpunk）、密码学家，因发明 Hashcash 而广受认可，Hashcash 是一种用于识别和控制垃圾邮件的协议。他在
    1997 年提出了 Hashcash，比特币的发明者中本（Satoshi Nakamoto）利用它开发了工作量证明（PoW）共识协议。PoW 在比特币网络中作为挖掘算法的一部分被使用。他也被认为是中本联系的开发比特币协议的前两人之一。Adam
    Back 目前是 Blockstream 的首席执行官，这是他在 2014 年共同创立的公司。Blockstream 专注于构建基于比特币的加密金融基础设施。


    # 地址


    在区块链世界中，地址通常是“公钥”的哈希版本，个人或平台将引用它来向钱包转移任何加密货币。它是唯一数字和字母的组合，钱包的工作原理类似于电子邮件地址。它就像加密货币的银行账户。在公共区块链中，地址还可以用于对钱包进行分析。在比特币世界中使用了不同的地址格式。例如：P2PKH（以
    1 开头）- 1BvBMSEYstqTFn5Aum4GFg7xjaN2


    # AES (高级加密标准)


    高级加密标准也以其原始名称 Rijndael 命名，由两位密码学家 Vincent Rijmen 和 Joan Daemen 开发。它基于一种名为置换置乱网络的设计原理，该原理在
    2001 年流行起来。开发始于 1997 年，当时人们认为需要数字加密标准（DES）的替代品，因为 DES 开始容易受到暴力攻击。它被全球软件和硬件使用，用于保护政府计算机安全、网络安全和电子数据保护领域的敏感数据。AES
    有三个版本：AES 128、AES 192 和 AES 256。128、192 和 256 代表用于加密和解密信息的密钥长度。AES 128 使用 128
    位密钥长度。


    # 空投 (Air Drop)


    空投是一种流行的营销活动或技术，用于初次代币发行（ICO），其中一部分原生加密货币（代币）被预留用于免费发放，并分给贡献者和整个社区。这主要是为了提高知名度，为代币创造早期价值，因为接收者将开始交易他们的空投代币。它还促进了对
    ICO、区块链网络或平台增强活动的参与。加密货币初创公司传统上向比特币和以太坊网络的钱包持有者空投代币。Uniswap (UNI) 空投被认为是近期最获丰的空投之一。


    # 物理隔绝 (Air Gapping)


    当个人或实体高度关注数字化的敏感数据或价值资产（如代币和加密货币）的安全时，他们通常会确保其设备与不安全的网络物理隔离。这有助于防止源自不安全网络或未经授权访问的网络攻击。

    '
