    # Libra (Now, Diem)


    Libra a.k.a., Diem, is a cryptocurrency created by Facebook and intended to be
    used as a simple, low-fee medium of exchange around the world. It is backed by
    a basket of assets, which include major currencies and government debt securities
    that provide pricing stability. Hence it is a stable coin. Diem has 26 members
    that include financial firms, non-profits and Facebook''s digital wallet company
    Novi.'
  - '[PAGE 278]


    # Light Client


    Light clients, also known as partial nodes or lightweight clients, are crucial
    elements in blockchain ecosystems. They help users access and interact with a
    blockchain in a secure and decentralized manner without having to sync the full
    blockchain. They are based on light nodes that download only block headers to
    establish authenticity of transactions. They are served by full nodes when connected
    with entire Blockchain network.'
  - '[PAGE 279]


    # Light Node


    Lightweight nodes verify transactions using a method called simplified payment
    verification (SPV). SPV allows a node to verify if a transaction has been included
    in a block, without having to download entire blockchain. With SPV, full nodes
    serve lightweight nodes by allowing them to connect and transmit their transactions
    to the network and will notify them when a transaction affects them. A lightweight
    node needs to download only the headers of all blocks on the blockchain, which
    means that its download and storage requirements are significantly less intensive
    compared to a full node.'
  - '[PAGE 280]


    # Lightning_Network


    The Lightning Network is a layer 2 payment protocol that operates on top of a
    blockchain-based cryptocurrency. It is intended to enable fast transactions amongst
    participating nodes and has been proposed as a solution to address bitcoin scalability
    problem. Transactions between parties will be executed off the Blockchain i.e.
    as off-chain transactions. It will reduce transaction processing times and associated
    costs. Thaddeus Dryja and Joseph Poon formulated Bitcoin Lightning Network in
    2015.'
