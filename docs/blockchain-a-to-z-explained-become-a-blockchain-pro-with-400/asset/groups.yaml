    # Foreword


    C.P. Gurnani


    MD & CEO, Tech Mahindra


    Blockchain, undoubtedly, is the technology that has caught every CEO''s attention
    globally. No other emerging technology has stirred such a massive and disruptive
    interest than Blockchain has been able to garner in recent years. Be it on account
    of Bitcoin, the first commercial application of Blockchain technology, or its
    innate immense potential to transform numerous business processes and services
    that touch our daily lives.


    In the Cryptocurrency world, Blockchain has not only spawned the Bitcoin network
    but also nurtured myriad cryptocurrencies like Ethereum, Ripple, Litecoin, and
    several others that are changing the world, as we speak. Blockchain has also triggered
    the advent of fundamentally new applications and business models such as Non Fungible
    Tokens (NFTs) which ushered in a new trend of Crypto or Digital collectibles.


    In the world of Enterprise applications, Blockchain has demonstrated its potential
    to transform:


    - Supply Chains by making them anti-fragile,

    - Payments and International Money Remittances through Stablecoins and Central
    Bank Digital Currencies

    - Trade Finance by empowering networks to perform automated & immutable invoice
    discounting

    - Digital Identities by securing them via Self Sovereign Identities and;

    - Media & Entertainment industry by configuring self-executing Contracts & Rights
    Management.


    In Government to Citizens services, Blockchain has demonstrated significant potential
    to promote much required transparency in Benefits Administration, Title Management
    and even in Elections & Voting management.


