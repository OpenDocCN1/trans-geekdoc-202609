    # Quartz


    Quartz is a startup incubated by TCS, and provides foundational technology, tools
    and business components for creating distributed ledger through their offering
    The Smart Ledgers. It comprises Quartz Smart Solutions – set of business solutions
    for various industries, Quartz Devkit – smart contracts development kits, Quartz
    Gateway – helps in easy integration of existing applications with Blockchain networks
    and Quartz Command Center – helps in monitoring entire ecosystem.'
  - '[PAGE 362]


    # Quantum Computing


    Quantum computing is the use of quantum phenomenon such as superposition and entanglement
    to perform computations at a much faster rate compared to classical computers
    that we use today. Computers that perform quantum computations are known as quantum
    computers. The most widely used Quantum computer model is the quantum circuit,
    based on the quantum bit, or “qubit”, which is somewhat analogous to the bit in
    classical computation. A qubit can be in a quantum state, or in a superposition
    of the 1 and 0 states. When it is measured, however, it is always 0 or 1; the
    probability of either outcome depends on the qubit''s quantum state immediately
    prior to measurement. Quantum computing movement began in 1998 when Isaac Chuang,
    Neil Gershenfeld and Mark Kubinec created the first quantum computer with 2 Qubits.
    IBM Q, Google Sycamore and Intel Tangle Lake are well known Quantum computers
    with close to greater than 50 Qubits. D-wave has Quantum computers with greater
    than 128 Qubits but based on Quantum Annealing. Quantum computers are expected
    to transform medicine by increasing drug discovery speeds, transform communications
    and artificial intelligence. In Blockchain world, they are expected to impact
    the cryptographic principles that power Blockchains.'
