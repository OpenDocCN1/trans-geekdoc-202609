  mdcn: '


    # CBDC (央行数字货币)


    CBDC 是许多国家中央银行正在尝试的新型货币。它可以是区块链上现有法币货币的数字形式。这与加密货币不同，因为它由中央政府控制。它将是一种稳定币，其价值与发行国/发行央行的本国货币挂钩。它可以是仅限在央行和商业银行之间进行交换交易的**批发型
    CBDC**，也可以是面向普通消费者和公民的**零售型 CBDC**；即人们将其用于日常购买或活动的货币。推广 CBDC 的目的是实现金融包容、打击犯罪、防止非法活动并降低经济中货币分发的成本。中国、柬埔寨、瑞典、巴哈马和和瑞士正在积极试点和测试
    CBDC。


    # CDN (内容分发网络)


    CDN（内容分发网络）是一个高度分布的服务器平台，通过缩短服务器与用户之间的物理距离来减少加载网页内容时的延迟。这有助于全球用户查看相同的高质量内容，而无需等待缓慢的网页或应用加载。Cloudflare、Fastly、Microsoft
    Azure CDN 和 Google Cloud CDN 是一些领先的 CDN 商。


    # CeFi (中心化金融)


    区块链中的 CeFi 指中介的参与，以促进各持有者之间加密资产的交换。他们代表加密货币所有者进行操作。然而，这引发了中介违规操作或黑客攻击导致损失的风险，因此充当了单点故障。其替代方案是
    DeFi 或去中心化金融，它通过去中心化交易所实现，消除了对中介的需求，因此也消除了与之相关的风险。


    # Cellio


    Cellio 是 Linux 基金会（The Linux Foundation）的一个工具包，本质上是一种为区块链生态系统开发的按需“服务型”部署模型。Cellio
    提供了一种可以在包括虚拟机在内的各种平台上运行的多租户服务。本质上，它减少了创建、管理和使用区块链所需的努力。


    # CEX (中心化交易所)


    中心化交易所是第三方交易平台，功能类似于传统的经纪商或股票市场，代表用户进行加密资产交易。CEX 维护其私钥的托管。Kraken、Gemini 和 Robinhood
    是一些中心化交易所。


    # Chaincode (链码)


    Chaincode 是 Go 或 Java 等支持的语言之一编写的代码，运行在网络之上。它包含了与应用程序与共享账本交互相关的业务逻辑。例如：它通过软件开发包（SDK）或命令行界面（CLI）进行安装和实例化。


    # Chainlink


    Chainlink 是一个去中心化的节点网络，将链外数据提供给链上智能合约。Chainlink 聚合来自所选预言机（oracles）的所有数据，并对其验证/对对以确保准确表示。Chainlink
    在区块链上是一个经过验证的用例。


    # Channels (通道)


    在 Hyperledger Fabric 中，可以存在多个账本，每个账本被称为一个通道（Channel）。它们通过允许各种成员之间进行私有通信来促进数据隐私。它们可以动态创建和重新配置。在通道中交易的双方应该经过该特定通道的验证，以确保外部人员无法访问通信。例如：在供应链中，客户与供应商
    A 之间有一个通道，客户与供应商 B 之间有一个独立的通道。这确保了供应商 A 和 B 进行私下交易，且无法访问对方的通道。


    # Checksum (校验和)


    校验和通常设计用于检测小块数据中的意外错误。它允许用户检查数据或信息是否与预期一致。例如：在比特币中，地址包含校验和，因此可以检查其是否输入正确。这允许用户避免将比特币发送到格式错误的地址。它们通过
    SHA256 算法对数据进行两次哈希处理，结果的前4 个字节作为校验和。


    # CIA Triad (CIA 三要素)


    CIA 三要素代表机密性（Confidentiality）、信息安全（Information Security）和可用性（Availability），这是任何旨在以安全方式运行的系统的三个基本原则。区块链实现被认为基于
    CIA 三要素原则增强了底层系统的韧性。这三要素经过多年形成，不属于任何单一的。


    # Cipher (密码)


    密码是一种加密算法，应用于明文将其转换为密文（密文是加密算法生成的不可读输出）。它们也被用于将密文还原为明文。密钥用于完成这种转换。有 7 种不同的密码——凯撒密码、单字母替换、同音替换、多字母替换、多表替换、Playfair
    密码和 Hill 密码。


    # Cipher (密文)


    密文是明文的加密输出，是密码算法操作的结果。当密文通过相应的解密算法时，可以揭示其所代表的实际明文。


    # Clique (集群)


    Clique 是一种跨客户端的权威证明（PoA）共识协议。它模仿了以太主网的设计，因此可以以极小的努力添加到任何客户端中。在 PoA 中，铸造的区块被认为由受信签名者签名，因此是工作量证明（PoW）共识机制的一种更简单且更高效的替代方案。Hyperledger
    Besu 使用 Clique 共识协议。


    # Coinbase (币基交易)


    Coinbase 交易是区块中的第一个交易，由矿工创建并使用。它用于收集他们工作的区块奖励。矿工收集的其他任何交易费用也会在此交易中发送。


    # Coinbase Exchange (Coinbase 交易所)


    成立于 2012 年，是一家完全监管并获得许可的加密货币交易所。它最初仅允许比特币比特币，随后开始添加符合其去中心化标准的其他加密货币。它支持 100 个国家的
    5000 万用户，服务价值超过 2000 亿美元的资产。


    # Coin Desk


    CoinDesk 是一家于 2013 年 5 月启动的专门介绍比特币和数字货币的新网站。该网站由 Shakil Khan 创立，他也是比特币支付处理器 Bitpay
    的投资者，随后被数字货币集团（Digital Currency Group）收购。


    # Cold Wallet (冷钱包)


    冷钱包是储存在硬件设备上或打印在纸张上的离线钱包，存储用户的地址和私钥，并与计算机中的兼容软件配合工作。由于冷钱包不连接互联网，因此被认为比运行在连接互联网的设备或门户上的“热钱包”安全得多。Ledger
    Nano、Trezor 和 KeepKey 是最流行的冷钱包。

