    ## CA in Blockchain (Certification Authority)


    In Blockchain systems, the Central Authority''s server guarantees the uniqueness
    of the addresses of participating entities by issuing them certificates recognized
    in the respective systems. It employs Certificate Authority to achieve this purpose.
    In cryptography, a Certificate Authority or Certification Authority is an entity
    that issues digital certificates. These certificates certify the ownership of
