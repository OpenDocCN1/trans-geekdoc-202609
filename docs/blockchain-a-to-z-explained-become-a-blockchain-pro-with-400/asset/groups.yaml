    500 members from 3PLs / 4PLs, Air Freight, Logistics, Maritime and other service
    providers associated with the transportation industry in over 25 countries, that
    collectively generate over $1 trillion in revenue annually.'
  - '[PAGE 79]


    # Bitcoin


    Its world''s first Decentralized Peer to Peer Electronic Cash System introduced
    by leveraging Blockchain, Distributed Ledger Technology. It was first presented
    to the world through a White Paper titled “A Peer to Peer Electronic Cash System”
    by Satoshi Nakamoto in the year 2008. It solved the problem of double counting
    that was prevalent with currencies issued through computers which is not the case
    with Fiat money (currency issued by Central Banks) where Central Bank as intermediary
    prevents double counting through serial numbers on currency notes. Bitcoin was
    invented to protect small and medium sized merchants from fraud and chargebacks
    pertaining to e-commerce transactions and promote peer to peer micro-transactions
    with low processing fees. It''s a truly decentralized network where no single
    party owns or controls Bitcoin and every one can contribute. It''s the first commercial
    implementation of Blockchain.'
  - '[PAGE 80]


    # Bitcoin Core


    It is the software that powers Bitcoin and developed in C++ by Gavin Andresen.
    He took up the role of lead developer after Satoshi Nakamoto stopped corresponding
    in 2010. Included in the software is a secure digital wallet that can be used
    to store and transact Bitcoins. Bitcoin Core helps to keep Bitcoin decentralized
    and identifies the chain that contains valid transactions.'
  - '[PAGE 81]


    # Bitcoin Cash (BCH)


    Bitcoin cash is a fork of Bitcoin. It is a spin-off or altcoin and was created
    on August 1, 2017 to accommodate larger block sizes so that more transactions
    can be allowed into a single block. It was spun off as the some of the Bitcoin
    developers didn''t agree on increasing the original Bitcoin network capacity.
    As a result, the Bitcoin network became slow and expensive. BCH network now supports
    up to 32 MB blocks. Fork was created at Bitcoin block 478558. Like Bitcoin, BCH
    supply is capped at 21 million units. BCH offers faster transactions, a network
    without congestion and low transaction fees.'
  - '[PAGE 82]


    # Bitcoin Faucet


    A site run by Gavin Andresen to make Bitcoin popular. The visitors to the website
    had to complete a captcha to earn 5 Bitcoins. This was done with an intention
    to ensure that Bitcoin reached a wide audience who could make use of it. 19,700
    Bitcoins were distributed free of cost through this faucet till the time it was
    closed in the year 2012. There were other free Bitcoin faucets such as FreeBitcoin.in,
    Cointiply and Faucethub.'
  - '[PAGE 83]


    # Bitcoin Gold (BTG)


    BTG is a hard fork of Bitcoin created on October 24, 2017 at block height 491407.
    BTG is a cryptocurrency with Bitcoin fundamentals, mined on common Graphic Processing
    Units (GPUs) instead of specialty ASICs. ASICs tend to monopolize mining to a
    few big players, but GPU mining means anyone can mine again restoring decentralization
    and independence.'
  - '[PAGE 84]


    Bitcoin.org is a community funded project. It was originally registered by Satoshi
    Nakamoto and Martti Malmi. From 2011 to 2013 this was used to release new versions
    of Bitcoin software now called Bitcoin core. Today it is an independent open-source
    project with worldwide contributors. It helps people to understand accurate descriptions
    of Bitcoin properties, potential uses and limitations. It also maintains transparency
    with regards to events that impact Bitcoin network and improve its worldwide accessibility.'
  - '[PAGE 85]


    # Block


    Blocks are files where blockchain transactions are recorded permanently. Block
    is like a page of a ledger or record book. Each time a block is completed, it
    gives way to the next block in the blockchain. Blocks can also be created based
    on predefined time intervals like one block is created every 10 minutes in Bitcoin.
    A block is thus a permanent store of records which, once written, cannot be altered
    or removed. Current block height in Bitcoin is 676570. Blocks can be of different
    sizes varying from 1 MB to 8 MB.'
  - '[PAGE 86]


    A block cipher encrypts data in specific sized blocks unlike stream ciphers where
    encryption is bit by bit. Most popular block ciphers are Digital Encryption Standard
    (DES), 3DES and Advanced Encryption Standard (AES). AES encrypts 128 bit blocks
    with a key of predetermined length: 128, 192, or 256 bits.'
  - '[PAGE 87]


    # Block Explorer


    Block explorer is a blockchain search engine that allows anyone to search details
    about any blockchain transaction. A block explorer is an online tool to view all
    the transactions that have taken place on the blockchain, the current network
    hash rate, transaction growth as well as the activity on the blockchain addresses
    and other useful information. Bitcoin Explorer and Etherscan are good examples
    of Block Explorers for Bitcoin and Ethereum respectively.'
  - '[PAGE 88]


    # Block Header


    A block header is used to identify a particular block on an entire blockchain
    and is hashed repeatedly to create proof of work for mining rewards. A blockchain
    consists of a series of various blocks that are used to store information related
    to transactions that occur on a blockchain network. Constituents of Block Header
    are: Timestamp (4 bytes), Version Number (4 bytes), Merkle Root (32 bytes), Difficulty
    Target (4 bytes), Nonce (4 bytes), Previous Block Hash (32 bytes).'
  - '[PAGE 89]


    # Block Height


    Block height represents the number of blocks that were confirmed in the entire
    history of a particular blockchain network - from the genesis block (or block
    zero) until the most recent one. Unlike the genesis block, all other blocks contain
    a reference (hash) to the block that preceded it, and the block height is the
    number of each block in that sequence. The block height of the genesis block is
    #0, and the block height of the first block mined is #1. At the time of writing
    this description, Block Height of Ethereum is 12,657,904.'
  - '[PAGE 90]


    # Block Propagation


    The process of sharing Block with the network after it is mined is called Block
    Propagation. It involves an information sharing process where one miner sends
    the Block to peers who share it with few more until Block reaches the entire network.
    The average time taken for the new block to reach majority of nodes in the network
    is referred to as Block Propagation Time.'
