    ## Single_Point_of_Failure


    It is a malconfiguration, weakness or a flaw in a system that causes it to come
    to a grinding halt and stop working. It can also be due to malicious attacks such
    as Denial of Service (DoS) or Distributed Denial of Service (DDoS) attacks. Centralized
    systems are often prone to single point of failure. Distributed and decentralized
    systems like Blockchain are insulated from such failures.


    ## Single Source of Truth


    A single source of truth is the practice of aggregating data, information from
    many operating or business systems within an organization into a single location,
    ledger or system. In blockchain, a single source of truth means every node that
    is in the network contains same data. This results in a situation where information
    cannot be altered without the knowledge of others on the network, leading to immutability.
    Basically error proof and tamper proof system of records.


    ## Slashing Condition


    Slashing is a mechanism built into proof of stake blockchain protocol to discourage
    validators'' misbehavior such as persistent downtime, double signing and delegation.
    Punishments include reduction in stakes and suppression of future rewards and
    ejection. Slashing is thus designed to incentivize node security, availability,
    and network participation. Ethereum 2.0, Celo, Cosmos, ICON and Polkadot have
    various slashing penalties for downtime, delegation and double signing.


    ## Smart Contracts


    Smart contracts, first proposed by Nick Szabo in 1994, are simply programs stored
    on a blockchain that run when predetermined conditions are met. They are used
    to automate execution of agreements so that all participants are aware of outcomes
    and abide by them; without any time loss or intermediaries'' involvement to enforce
    outcomes. Ethereum is world''s most popular smart contracts platform that uses
    Solidity for writing smart contracts that run on Ethereum Virtual Machine.


    ## Soft Fork


    Soft fork occurs when changes to Blockchain protocols are backward compatible
    and users only need to upgrade their software. Its pretty much like upgrading
    operating system of a smart phone, tablet or a smart watch to fix bugs and update
    security features. Post the soft fork, there will be only one Blockchain unlike
    Hard fork where Blockchain splits into two. Metropolis in Ethereum is a good example
    of soft fork.


    ## Solidity


    It was proposed by Gavin Wood and developed by Christian Reitwiessner, Alex Beregszaszi
    and several former Ethereum core contributors. Solidity was shaped by C++, Javascript
    and Python, designed to interact with Ethereum Virtual Machine. In essence, it
    is the base of the Ethereum Network and enables developers to create their own
    decentralized applications (dApps). dApps can run smart contracts to accomplish
    activities like transmitting money, exchanging shares or moving anything of value
    based on predefined conditions.


    ## Sovrin


    Sovrin Foundation, established in the year 2016, is a private-sector, international
    non-profit that was established to govern the Sovrin Identity Network. The Sovrin
    Network is a public, permissioned distributed ledger purpose built for protecting
    identities on internet wherein individuals should own and control their identities
    without the intervention of administrative authorities, hence known as Self Sovereign
    Identity (SSI). Sovrin Foundation provides lightweight governance that is needed
    to operate SSI network in a trustworthy manner.


    ## SPV Client (Simple Payment Verification)


    It is a technique that has been first described in Satoshi Nakamoto’s paper. It
    allows a lightweight client to verify that a transaction is included in the Bitcoin
    blockchain, without downloading entire blockchain. It is often used in Bitcoin
    wallet apps running on smart phones, by using special SPV nodes that act as an
    intermediary between the app and a mining node.


    ## SQL (Structured Query Language)


    First developed by IBM researchers in 1970s, SQL is a standard language used for
    storing, querying and retrieving data in databases. It is used for database creation,
    deletion, fetching and modifying rows.


    ## SSI (Self Sovereign Identity)


    SSI is an identity verification and authentication model that is based on the
    premise that individuals should own and control their identities. It provides
    security and flexibility to users, empowering them to share their information
    only when they intend to do so. It is free from interventions exercised by administrative
    authorities or centralized- or federated-identity providers and acts on the concept
    that no one owns but that everyone has access. It eliminates the need for collecting
    documents that have already been collected somewhere else. Validators get only
    that information that users have authorized to share and such information is cryptographically
    shared on distributed ledger which prevents modification. Evernym and Sovrin are
