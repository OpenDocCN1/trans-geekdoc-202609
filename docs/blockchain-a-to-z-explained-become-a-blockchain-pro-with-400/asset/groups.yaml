  md: "\n# DDoS Attacks (Distributed Denial of Service attacks)\n\nDistributed Network\
    \ Attacks are often referred to as Distributed Denial of Service (DDoS) attacks.\
    \ This type of attack takes advantage of the specific capacity limits that apply\
    \ to any network resources – such as the infrastructure that enables a company's\
    \ website. The DDoS attack will send multiple requests to the attacked web resource\
    \ – with the aim of exceeding the website's capacity to handle multiple requests\
    \ and prevent the website from functioning correctly. To preempt DDoS attacks\
    \ crippling network infrastructure particular those that are architected on centralized\
    \ infrastructure principles, decentralized infrastructures based on Distributed\
    \ Ledger Technology are being considered to prevent single point of failure.\n\
    \n# DES (Digital Encryption Standard)\n\nThe Data Encryption Standard is a symmetric-key\
    \ algorithm for the encryption of digital data. Developed in the early 1970s at\
    \ IBM and based on an earlier design by Horst Feistel, the algorithm was submitted\
    \ to the National Bureau of Standards (NBS) following the agency's invitation\
    \ to propose a candidate for the protection of sensitive, unclassified electronic\
    \ government data. In 1976, after consultation with the National Security Agency\
    \ (NSA), the NBS selected a slightly modified version which was published as an\
    \ official Federal Information Processing Standard (FIPS) for the United States\
    \ in 1977. The original DES' key size of 56 bits was sufficient when it was developed.\
    \ To prevent successful brute force attacks on DES owing to increasing computational\
    \ power, Triple DES (TDES) came into existence which applies DES algorithm three\
    \ times to each data block. In May 2002, Advanced Encryption Standard (AES) replaced\
    \ DES.\n\n# De-Fi (Decentralized finance)\n\nDecentralized finance (commonly referred\
    \ to as DeFi) is a blockchain-based form of finance that does not rely on central\
    \ financial intermediaries such as brokerages, exchanges, or banks to offer traditional\
    \ financial instruments, and instead utilizes smart contracts on blockchains,\
    \ the most common being Ethereum. Maker, Uniswap and Compound are some of the\
    \ leading DeFi services providers.\n\n# Decentralisation\n\nIn blockchain, decentralization\
    \ refers to the transfer of control and decision-making from a centralized entity\
    \ (individual, organization, or group thereof) to a distributed network. It facilitates\
    \ Digitization of Trust where trust is contained in a distributed network rather\
    \ than in a centralized party or entity. It provides trustless environment, promotes\
    \ data reconciliation, minimizes points of failures and maximizes resource distribution.\n\
    \n# Delegated Proof of Stake (DPoS)\n\nIts similar to Proof of Stake since the\
    \ validators of blocks in Blockchain are required to invest or stake cryptocurrencies\
    \ on transactions to be validated. These validators are selected via voting by\
    \ various token holders where votes are proportional to their stakes.\n\n# Degen\n\
    \nRefers to cryptocurrency projects that are involved in pumping and dumping schemes.\
    \ Usually, worthless and junk tokens are hyped up in various communications channels\
    \ and forums and they are abandoned later through Degens. Tendies, YFI and Yam\
    \ have been considered as Degen projects.\n\n# DevOps\n\nDevOps, a term coined\
    \ in 2009 by Patrick Debois, is a complementary set of practices to Agile software\
    \ development where development and operations teams remained separated and siloed.\
    \ It aims to shorten the systems development life cycle and provide continuous\
    \ delivery with high software quality by bringing these two teams together right\
    \ from starting of the project. This replaced the Waterfall Software development\
    \ model.\n\n# DEX (Decentralized exchange)\n\nCrypto funds and balances are maintained\
    \ by the users. DEX doesn't have any custody. It promotes transactions between\
    \ two parties using software tools, open blockchains, and internet. DEX is autonomous\
    \ and run by algorithms and smart contracts. There are Dydx, Uniswap, Bancor and\
    \ BisQ.\n\n# Diamond Hands\n\nIt represents the persistence of investors who hold\
    \ onto cryptocurrencies despite price drops.\n\n# DIDs (Digital Identifiers)\n\
    \nDIDs are a type of decentralized identity that enables any person, organization,\
    \ or thing to be identified using cryptographic basis. They obviate the need for\
    \ central administrative systems and are being promoted by World Web Consortium\
    \ (W3C).\n\n# DIEM\n\nDiem is a permissioned blockchain-based payment system proposed\
    \ by Facebook, Inc. It is pegged at USD and was formerly known as Libra.\n\n#\
    \ Difficulty\n\nDifficulty is a number that regulates how long it takes for miners\
    \ to add new blocks to the blockchain. In Bitcoin, it determines the difficulty\
    \ level to find a hash below a particular target. Difficulty is adjusted every\
    \ 10 minutes based on the time taken. \n\n# Digi Cash\n\nFounded by electronic\
    \ currency pioneer David Chaum in 1989, DigiCash was one of the earliest electronic\
    \ money companies. DigiCash used cryptographic protocols to make transactions\
    \ anonymous through Blind Signature Technology. As a result Bank or Government\
    \ would be unable to trace personal payments conducted online. No wonder, David\
