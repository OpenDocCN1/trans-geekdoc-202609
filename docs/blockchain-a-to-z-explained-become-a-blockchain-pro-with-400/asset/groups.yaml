  mdcn: '


    ## 矿工


    矿工是区块链网络中的一种节点，负责收集交易并将它们组织成区块。每当交易发生时，所有网络节点都会接收这些交易并验证其有效性。然后，矿工节点从内存池中收集这些交易，并在验证后开始将它们组装成区块。在比特币网络中，矿工获得两种奖励——新比特币（用于发现新的比特币区块，通过成功解决数学问题以获得与区块相关的私钥，从而确认区块并将交易写入其中）和交易手续费（用于验证交易，以便交易中涉及的比特币可以被花费）。


    ## 挖矿


    加密货币挖矿是验证用户之间交易并将其添加到区块链公共账的过程。挖矿过程还负责通过计算机的处理能力解决复杂的数学问题，将新代币引入现有的流通量中。它是允许加密货币作为点对点中心化网络运行的关键要素之一，不需要第三方中央机构。


    ## 挖矿难度


    挖矿难度是衡量挖矿所需计算机资源量的相对指标，例如：新鲜比特币。在比特币网络中，难度大约每 2,016 个区块增加或减少一次。如果之前的 2,016 个区块被挖得很容易，那么下一个
    2,016 个区块的挖矿难度就会增加，反之亦然。在以太坊中，难度是根据寻找下一个以太坊区块有效解决方案所需的哈希次数或矿工数量来量的。随着更多矿工或算力加入网络，难度会自动增加，以确保新区块不会快速添加到网络。


    ## 矿池


    在加密货币挖矿中，矿池是矿工对计算机资源或算力的聚合，他们在网络上共享处理能力来解决数学问题以寻找新区块。他们根据自己为发现和解决新区块贡献的算力和工作量平均分配奖励。Slush
    Pool（已挖出 125 万个 BTC）、ViaBTC、AntPool 和 BTC.com 是世界上一些领先的比特币矿池。SparkPool、Ethpool、Nanopool
    和 Dwarfpool 是一些领先的以太坊矿池。


    ## Mint


    Bitcoin.com 推出了 Mint，这是一个免费平台，让任何人都能快速轻松地创建代币。与 Bitcoin.com 的其他专业代币产品相结合，Mint
    预计推动区块链的采用，因为它为庞大的新代币生态系统的发展提供了燃料。Mint 正在升级到 Pitco 2.0。


    ## Mist


    Mist 是一款全功能软件，用于管理个人在以太坊区块链上的所有资产和合约。Mist 可以浏览 DApps、管理合约、管理 Ether 以及其他数字资产。它像通往区块链网络的窗口，访问网络中提供的不同应用程序和服务。它还支持
    Whisper（去中心化通信协议）和 Swarm（去中心化存储平台）。


    ## Morden


    以太坊 0.9 版本以 Olympic 的命名于 2015 年初发布。第一个公共测试网。到 2015 年年中，Olympic 被废弃并被 Morden 取代。随后，Frontier
    以太坊官方版本 1 于 2015 年作为公共主网发布，并在 2016 年分叉到 Homestead。从测试网的角度来看，Morden 等同于 Frontier。它在
    2016 年底废弃并被 Ropsten 取代。


    ## Multisig (多重签名)


    多重签名（Multisig）是指使用多个密钥来授权区块链交易，而不是来自一个密钥的单一签名。它避免了单点故障，使得钱包被破解的难度大大增加。因此，多重签名钱包可以程序化：当使用
    3 个密钥中的至少 2 个时即可授权交易。Electrum、Armory 和 BitGo 是多重签名钱包的示例。


    ## NAT (网络地址翻译)


    NAT 将本地网络中注册或未注册的计算机 IP 地址翻译为单个 IP 地址。该地址通常由连接计算机到互联网的路由器使用。路由器可以连接到 DSL 调制解调器、电缆调制、T1
    线路，甚至是拨号调制。区块链正在赋予智能 NAT 管理方案，以克服垂直模型中存在的限制。通过区块链实现 NAT，每个节点将对管理复杂的 NAT 和移动管理程序所需的必要参数达成共识。


    ## 数字银行


    数字银行是一种没有任何分支的数字银行。数字银行并非物理存在于特定地点，而是完全在线的。数字银行也被提供数字和移动优先金融解决方案、支付和转账、贷款等的金融科技公司。Chime、Monzo、Revolut、N26
    和 Klarna 是全球领先的数字银行。


    ## 网络价值模型


    在区块链网络中，每个参与者都应该拥有价值，但网络本身应该设计为促进这种价值的产生。因此，价值模型基于以下原则：为 1) 为网络提供资金的人、2) 需要该网络的人以及
    3) 经常使用网络的人创造价值。通常，我们看到一家大公司构建许可链或无许可的区块链网络，但真正驱动此类区块链网络采用和使用的实际上是使用它的供应商。因此，价值必须为所有方创造，并应该在原型设计阶段、最小可行性产品（MVP）阶段或网络阶段完成。如果在
    MVP 阶段未完成，则应在进入市场阶段（即从 MVP 阶段扩展到生态系统生产状态的过程中）完成。


    ## Nexledger


    Nexledger 是由三星 SDS 开发的开源混合、私有许可区块链平台。Nexledger 是一个全功能平台，其核心集成了监控工具、外部链接、应用程序编程接口和结构化的
    DevOps 环境等组件。它提供兼容以太坊 (Nexledger E) 和 Hyperledger Fabric (Nexledger F) 版本。它提供两种产品：提供
    API 库以集成多种区块链共识算法的 Nexledger Universal，以及帮助将每秒交易数 (TPS) 提高 15 倍的 Nexledger Accelerator。


    ## NFT (非同质化代币)


    非同质化代币 (NFT) 是区块链数字账本上的一个数据单元，每个 NFT 可以代表一个独特的数字项目；因此它们是不可互换的。NFT 可以代表数字文件，如艺术、音频、视频、视频游戏物品、虚拟资产和其他创意作品。可以在
    NFT 交易场购买 NFT。NFT 导致了数字收藏（也称为加密收藏品）的增长。Cryptokitties、Cypherpunk、Topstops 是一些领先的
    NFT。它们在各个市场上出售——NBA Top Shot（篮球）、Sorare（足球）、Decentral Land（虚拟房地产）、Axie Infinity（视频游戏）。


    ## NGMI (没戏了)：


    这是一种加密货币俚语，用于指示加密货币交易员或投资者将在某次交易中错失巨额利润。它也被用作一种模因币的名字，卖出 NGMI 代币的人将不允许买回。


    '
