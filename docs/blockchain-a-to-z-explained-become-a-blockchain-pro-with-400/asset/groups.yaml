  - '[PAGE 213]


    # Game Theory


    Originally developed by Mathematician John von Neumann and Economist Oskar Morgenstern,
    the Game Theory includes study of mathematical models that govern strategic interaction
    between various decision makers and helps in determining most likely outcomes
    in a situation that involves known payouts or quantifiable consequences. Basically,
    its a studyy of why and how people make decisions. It has been applied in Bitcoin
    network, by promoting good behavior through incentivizing miners to use their
    computing power to secure the network and intentionally making mining difficult
    and expensive for malicious actors. It helps in decision making by promoting consensus
    through Proof of Work. In Ethereum’s proposed Proof of Stake, game theory has
    been used to not only reward good behavior but also punish bad actors. Combining
    punishments and rewards strengthens protocol security.'
  - '[PAGE 214]


    # Gas


    Gas refers to the fee or pricing value, required to successfully conduct a transaction
    or execute a contract on the Ethereum blockchain platform. In essence, it measures
    computational effort required to run operations on Ethereum network. Gas fees
    are paid in Ethereum''s native currency Ether and are denominated in Gwei. Each
    Gwei is One-billionth of Ether.'
  - '[PAGE 215]


    # Gas Limit


    The term Gas Limit refers to the maximum price a cryptocurrency user is willing
    to pay while sending a transaction, or performing a smart contract function on
    Ethereum blockchain. Average Ethereum block has a gas limit of 1.5 million Gas.'
  - '[PAGE 216]


    # Gas Price


    A general reference to the approximate transaction fees to be paid on Ethereum
    Blockchain. It is measured in Gwei and is determined by an auction-type mechanism,
    where miners look for highest fees attached to a transaction, process them first
    and then process transactions from there-on in descending order.'
  - '[PAGE 217]


    # Gas Price Oracle


    It is a tool that helps users to make a prediction on Gas price that needs to
    be made in order to make a transaction confirmed within a certain time or number
    of Blocks in Ethereum. It makes predictions by looking at previous blocks utilization
    and gas limits. It helps users to interpret that paying lower gas prices may result
    in transactions not being selected by miners for validation within required time
    and helps them to modify gas prices accordingly.'
  - '[PAGE 218]


    # Genesis Block


    Genesis Block is the name of the first block of blockchain ever mined. The Genesis
    Block forms the foundation of entire blockchain transaction system and is the
    prototype for all other blocks in the blockchain. The Genesis Block for Bitcoin
    was created in January, 2009 that had a reward of 50 Bitcoins. Ethereum''s genesis
    block was mined into existence in July, 2015'
  - '[PAGE 219]


    # Geth


    Geth (Go Ethereum) is a command line interface for running Ethereum nodes implemented
    in Go Language. Using Geth, one can join Ethereum network, transfer ether between
    accounts, mine ethers and interact with smart contracts. It creates software that
    runs on the Ethereum Virtual Machine.'
  - '[PAGE 220]


    # Ghost (Greedy_Heaviest Observed Subtree)


    GHOST originally was a protocol modification, a chain selection rule, that makes
    use of blocks that are off the main chain to obtain a more secure and scalable
    system. It adopts orphan blocks — the valid blocks that did not make it to the
    main chain, as uncle blocks so that work from these blocks is included on the
    main chain. This prevents the attacker to overtake the mainchain. It is more relevant
    and applicable in Blockchains where time taken to create new blocks is quite less.
    Eg: In Ethereum, block time is 10 to 20 seconds while in Bitcoin it is 10 minutes.
    Hence, in Ethereum the chances of orphan blocks or stale blocks are very high.
    Instead of ignoring these blocks, Ghost protocol considers them while determining
    the longest chain to ensure network security and prevent centralization.'
  - '[PAGE 221]


