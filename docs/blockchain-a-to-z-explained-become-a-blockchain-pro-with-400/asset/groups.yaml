    is based on crypto''s price change and speed of this change.


    # Rugging / Rugpull


    This occurs when developers abandon a cryptocurrency or blockchain project and
    escape with investors’ funds. Many rugpulls occurred on Decentralized Exchanges
    (DEXs) as DEXs allow easy listing of tokens without any prior due diligence. Rugging
    also refers to liquidity being removed from liquidity pools. To prevent rugging,
    projects have implemented measures to commit liquidity through locking contracts
    and token burn related to liquidity pools. DeFi100 coin creators have rug pulled
    close to USD 32 million. SushiSwap has also suffered from rugging.

    '
  mdcn: '


    # Quorum


    Quorum 最初由摩根大创建，现由 Censys 监督，是一个开源区块链协议，通过修改 Geth 客户端从以太坊分叉而来。它专为私有区块链网络而设计。当只有一个成员拥有所有节点，或者在多个成员各拥有网络部分部分的联盟链区块链网络时，可以使用
    Quorum 协议。它正在改变贸易金融、供应链金融、商业银行支付、机构交易、债务发行、贷款市场、保险、医疗保健和数字身份等领域的用例。


    # Quilt


    Hyperledger Quilt 是商业区块链工具之一，旨在通过实现跨账本协议（ILP）促进账本系统之间的互操作性。ILP 是一种用于在分布式和非分布式账本之间转移价值的支付协议。它促进了物联网公司钱包、金融机构账本和不同供应链系统之间的分布式原子交易（用于验证交易的数据移动）。Everis、日本数据数据
    NTT Data 和 Ripple 是该领域的先驱开发者。


    # R3


    R3 由 David E Rutter 和 Todd McDonald 于 2014 年创立，是一家企业软件公司，正通过企业级区块链技术引领数字化转型。R3
    的解决方案为金融服务行业以及其他垂直领域提供了信任，在这些领域企业或公司之间的协作和交易一直存在信任赤字。R3 专门构建的企业级区块链平台 Corda 正在将公司依赖的流程和系统数字化，以便通过贸易金融、保险、银行和资本市场中的区块链网络进行相互连接和交易。有超过
    350 家机构正在部署、维护并构建 R3 的产品。R3 还开发了 Conclave —— 一种机计算平台，用于增强企业应用中的隐私性，多个用户可以安全地共享和分析数据。


    # Rabbit MQ


    RabbitMQ 属于 VMware，是一种开源消息中间件软件，其功能包括：1. 支持涵盖多种消息协议的异步消息传递、消息队列和到队列的灵活路由；2. 帮助使用
    Java、.NET、PHP、Python、Javascript 等语言开发跨语言消息通信；3. 带有分布式部署；4. 适用于企业级和云就绪。RabbitMQ
    最初使用高级消息队列协议（AMQP）实现，后来扩展到支持流文本面向消息协议（STOMP）、MQ 遥测传输协议等协议。


    # React JS


    由 Jordan Walke 在 2011 年于 Facebook 工作期间创建，主要用于构建 Web 应用程序并处理 Web 和移动应用的视图层。它允许开发者创建无需刷新页面即可更改数据的大型
    Web 应用，并支持服务器端。在区块链领域，它被广泛用于开发加密货币仪表板和构建以太坊去中心化应用（dApps）。


    # RxJS


    JavaScript 响应扩展（RxJS）是一个用于转换、组合和查询异步数据流或回调代码的 JavaScript 库。RxJS 既可以在浏览器中使用，也可以在服务器端使用。


    # REKT


    REKT 是网络俚语“wrecked”（毁坏）的缩写，意为严重损毁或彻底摧毁完蛋。在加密货币世界，REKT 指那些因错误交易或投资遭受巨大财务损失的人。它也被用来指代价值流水的数字资产。


    # Relayer


    Relayer（中继器）是一种允许托管 ox 订单簿的实体，订单中充满了许多来自不同以太坊地址的单独签名订单。对于订单履行，通过部署的 ox 智能合约在以太坊区块链上进行直接结算。托管和促进订单的费用以
    ZRX 代币收取。


    # Reputation


    声誉（Reputation）被用作增加区块链整体可信度的激励机制，其中矿工或验证者会在区块具有最高信任值时促使将其添加到区块链中。作者对节点行为不作任何假设，因此恶意行为可能会破坏所需的共识。


    # Rest API


    REST API 由计算机科学家 Roy Fielding 创建，是一种遵循 REST 架构风格限制的应用程序编程接口，并允许与 RESTful Web 服务进行交互。API
    是一组用于构建和集成应用程序软件的定义和协议。REST API 也称为 RESTful API。它的创建初衷是建立一种标准，允许世界上任何地方的两个服务器进行通信和数据交换。


    # Rinkeby


    Rinkeby 是一个以太坊测试网。测试网通常供开发者在应用程序或软件部署到生产环境或主网之前进行测试。测试网上持有的加密货币不包含任何价值。Rinkeby
    测试网与以太坊主网不同，它是权威证明（PoA）网络，而不是像以太坊主网这样的工作证明（PoW）网络。Rinkeby 的平均区块时间为 15 秒，平均网络算力为每秒
    0.1 Hexa hashes。


    # Ripple


    Ripple 由 Chris Larsen 和 Jed McCaleb 于 2012 年创立，最初被称为 Opencoin，在 2015 年更名为 Ripple
    Labs。Ripple Labs 创建 Ripple 是作为一个实时全额结算系统、货币交换网络和汇款网络。它基于分布式开源协议构建，支持代表法币、加密货币、商品或其他价值单位的代币。XRP
    是原生货币。其 RippleNet 托管了银行、金融机构和汇款提供商等支付供应商，他们使用 Ripple 解决方案以更低的成本和更高的速度在全球范围内转账。


    # RPC (远程过程调用)


    认为 Bruce Jay Nelson 在 1981 年创造了 RPC 术语。它有助于构建基于客户端-服务器的分布式应用程序，其架构基于本地过程调用，其中被调用的过程可能与调用过程不在同一个环境或网络中。在区块链网络中，RPC
    提供了更直接的连接，由客户端发起并向区块链节点发送消息。用户可以通过 RPC 接口查询区块链相关信息（如区块高度、区块、节点连接）并发送交易请求。


    # Ropsten


    Ropsten 是一个 2016 年启动的工作证明测试网，由于旧测试网存在多个问题，它类似于当前的以太坊区块链。Ropsten 以太坊（也称为以太坊测试网）正如其名是一个运行与以太坊相同协议的测试网络，用于部署到主网（Mainnet）之前的测试目的。Ropsten
    在 2016 年 2 月遭到攻击，Ropsten 地址被大量自动生成的故障交易所淹没。它在 2017 年 3 月通过开发者重写 Ropsten 区块链得以复活。


    # RSI (相对强弱指数)


    它是技术分析中使用的一种重要指标，通过近期价格变化的量子，来确定股票和其他资产的超卖或超买状态。RSI 数值 70 及以上表示超买或价值过高，可能意味着趋势调整和价格下调。RSI
    读数 30 表示价值过低。在加密货币中，RSI 指标基于加密货币的价格变化及其变化速度。


    # Rugging / Rugpull


    拉地毯（跑路）是指开发者抛弃加密货币或区块链项目并带着投资者资金逃离的情况。许多跑路事件发生在去中心化交易所（DEX）上，因为 DEX 允许在不进行任何事先尽职调查的情况下轻松列出代币。拉地毯也指从流动性池中移除流动性。为了防止跑路，项目实施了通过锁定合约和流动性池相关的代币销毁等措施。DeFi100
    代币的创建者曾过接近 3200 万美元的跑路。SushiSwap 也遭受过跑路。


    '
