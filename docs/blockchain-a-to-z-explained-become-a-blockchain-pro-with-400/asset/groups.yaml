    # CBDC (Central Bank Digital Currency)


    CBDC is a new type of currency that central banks of many countries are experimenting
    with. This can be a digital form of current fiat currency in Blockchain. This
    is different from cryptocurrency because it is controlled by the central government.
    It will be a stable coin whose value will be linked to national currency of the
    issuing Country / issuing Central Bank. It can be either Wholesale CBDC that is
    exchanged and traded only between Central Banks and Private Banks or Retail CBDC
    that is meant for ordinary consumers and citizens; people who will use it for
    their daily purchases or activities. CBDCs are being promoted with the intent
    to accomplish Financial Inclusion, Combat Crime, Prevent Illicit activities and
    Reduce the cost of distributing money in economy. China, Cambodia, Sweden, The
    Bahamas and Switzerland are actively piloting and testing CBDCs.'
  - '[PAGE 112]


    # CDN (Content Delivery Network)


    A CDN (Content Delivery Network) is a highly-distributed platform of servers that
    helps minimize delays in loading web page content by reducing the physical distance
    between the server and the user. This helps users around the world view the same
    high-quality content without slow webpages or app pages loading times. Cloudflare,
    Fastly, Microsoft Azure CDN and Google Cloud CDN are some of the leading CDN providers.'
  - '[PAGE 113]


    # CeFi (Centralized Finance)


    CeFi in Blockchain refers to the participation of intermediaries to facilitate
    crypto-asset exchange transactions between the respective holders. They act on
    behalf of the owners of the cryptocurrencies or the tokens by facilitating a number
    of different types of transactions. However, this induces a risk of malpractices
    by these intermediaries or hacks of holders systems leading to loss, thus acting
    like a Single Point of Failure. An alternative to this is the DeFi or Decentralized
    Finance that is facilitated by Decentralized exchanges, that eliminate the need
    of intermediaries, hence corresponding risks associated with them are also eliminated.
    However, Decentralized exchanges cannot offer a number of benefits offered by
    the Centralized exchanges like fiat conversion and Cross chain exchanges.'
  - '[PAGE 114]


    # Cello


    Cello is a Blockchain module toolkit from The Linux Foundation. It is essentially
    an on-demand “as-a-service” deployment model developed for the Blockchain ecosystem.
    Cello provides a multi-tenant chain service that can work on top of multiple infrastructures,
    including container platforms and virtual machines. In essence, it reduces the
    effort required for creating, managing and using Blockchains.'
  - '[PAGE 115]


    # CEX (Centralized Exchange)


    Centralized exchanges are third-party trading platforms that function like traditional
    brokerage or stock markets, acting on behalf of their users for trading crypto-currencies
    and assets. CEXs maintain customers’ or end users’ crypto funds, balances and
    possess custody of their private keys. Some centralized exchanges have shut down
    owing to death of their promoters or promoters fleeing resulting in loss of users’
    crypto assets. Kraken, Gemini and Robinhood are some well-known Centralized Exchanges.'
  - '[PAGE 116]


    # Chain Code


    Chaincode is a piece of code that is written in one of the supported languages
    such as Go or Java and runs on top of the Blockchain. It contains business logic
    pertaining to applications interaction with the ledger and runs in a secured Docker
    container isolated from peers that endorse transactions. For eg: It is installed
    and instantiated through a Software Development Kit (SDK) or Command Line Interface
    (CLI) onto a network of Hyperledger Fabric peer nodes, enabling interaction with
    that network’s shared ledger.'
  - '[PAGE 117]


    # Chain_Link


    Chainlink is a decentralized network of nodes that provide data and information
    from off-blockchain sources to on-blockchain smart contracts via oracles. The
    Chainlink aggregating contract collates all data from chosen oracles and validates
    and/or reconciles it, for accurate representation. Crop insurance on Blockchain
    is a proven use case of using Chain Link for decentralized oracle nodes that source
    weather data from multiple sources to self-execute claims through smart contracts.'
  - '[PAGE 118]


    # Channels


    In Hyperledger Fabric, there can be multiple ledgers and each ledger is referred
    to as a Channel. They help to promote Data Privacy by enabling private communications
    between various network members. They can be dynamically created and reconfigured.
    Parties transacting in a Channel should be authenticated to that particular Channel
    to ensure that external parties don''t gain access to the communication. For eg:
    In a Supply Chain Blockchain, there will be a channel between the Customer and
    Supplier A and a separate Channel between Customer and Supplier B. This ensures
    that suppliers A and B transact privately and separately with the same Customer
    and don''t have access to each other''s channel.'
  - '[PAGE 119]


    # Checksum


    A checksum is generally designed to detect accidental errors in small blocks of
    data. It allows the user to check if piece of data or information is the same
    as expected. For eg: In Bitcoin, addresses include checksum so they can be checked
    to see if they have been typed correctly. This allows users to avoid sending Bitcoin
    to poorly formed addresses. They are created by hashing data through SHA 256 algorithm
    twice, the first 4 bytes of the result is taken as Checksum. 1 byte will be equal
    to to two characters.'
  - '[PAGE 120]


    # CIA Triad


    CIA triad stands for Confidentiality, Information Security and Availability, the
    three fundamental tenets that stand as the goal of any system designed to perform
    in a secure manner. Blockchain implementation is deemed to enhance the resilience
    of the underlying systems and implementation based on CIA triad tenets. This triad
    has been formed over the years and doesn’t belong to a single creator.'
  - '[PAGE 121]


