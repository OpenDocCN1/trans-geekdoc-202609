    ## ERC_721 (以太坊提案建议_721)


    ERC721 代币通常被称为非同质化代币（NFT），允许开发者对任何任意数据、数字资产或数字收藏品进行代币化，从而扩展了以太坊区块链上可以表示为代币的设计空间。它们由
    William Entriken、Dieter Shirley、Jacob Evans 和 Nastassia Sachs 于 2018 年 1 月提出。


    ## 托管 (Escrow)


    托管是一种法律安排，由第三方临时持有大额资金或财产，直到特定条件的达成。托管服务现在于区块链领域发挥着重要作用。在分配用于支付这些债务的签名资金的帮助下，托管可以始终支付义务或债务。托管的主要责任是作为中立第三方在不同的交易中发放资金或文件。BTC
    Asia、IBC Group、Bitrated 和 Global Escrow 都是知名的比特币托管服务提供商。


    ## Eth (Ether)


    以太是比特币之后最流行的加密货币。它是驱动以太坊应用的货币，并且是去中心化的。除了作为可交易的加密货币外，它还通过支付交易费用（称为 Gas）和计算服务来驱动以太坊网络。由于它是可编程的，开发者以多种方式使用它。它可以用于实时发送和资金、交换代币、赚取利和获取稳定币。事实上，以太正在为基于去中心化金融（DeFi）概念的更智能金融平台铺平道路。


    ## Etherbase (基础地址)


    Etherbase 也称为 coinbase，是以太坊账户的公钥，矿工需要它接收被称为以太币的挖矿奖励。


    ## Etherhash (哈希)


    Etherhash 是一个钱包创建平台，允许用户仅通过密码即可创建钱包。用户可以通过创建安全密码创建匿名钱包。用户需要将密码存储在安全的地方，因为任何访问密码的人都可以从钱包中提取资金。平台使用
    Etherhash 创建密码的哈希值并使用智能合约存储它们。用户只能向以“0x”开头的存款哈希存款 ETH。提现后，密码和存款哈希将被删除，出于安全考虑，它们无法重用。新的存款和提现需要创建新账户。


    ## Ethereum (以太坊)


    它是一个引入了智能合约功能的开源区块链。其原生货币被称为 Ether。《比特币杂志》的创始人 Vitalik Buterin 于 2013 年提出了以太坊。Joseph
    Lubin、Gavin Wood 和 Jeffrey Wilcke 于 2014 年以以太坊联合人的身份加入。它经历了名为 Frontier、Ice Age、Homestead、Spurious
    Dragon、Istanbul 等许多协议升级。以太坊推动了区块链世界的许多创新，包括山寨币、首次代币发行（ICO）、智能合约、以太坊虚拟机（EVM）、去中心化金融（DeFi）和非同质化代币。以太是仅次于比特币的价值加密货币。


    ## Ethereum_(J)


    Ethereum(J) 是以太坊协议的纯 Java 实现。它以库的形式提供，可以嵌入到任何 Java/Scala 项目中，并对以太坊协议和子服务提供全面支持。Ethereum(J)
    最初由 Roman Mandeleil 开发。


    ## EVM (以太坊虚拟机)


    以太坊的功能更像一个分布式状态机，而不是分布式账本。除了所有账户和余额外，以太坊还有这种机器状态。数据结构可以根据预定义的规则从区块到区块发生变化，这些规则也可以执行机器代码。以太坊网络中的每个节点都运行一个
    EVM 实例。EVM 定义了管理从区块到区块状态变化的规则。它允许开发者使用名为 Solidity 的特殊语言创建去中心化应用（DApps）。


    ## Exchange (交易所)


    这是一个数字市场，买家和卖家可以用货币或其他加密货币交换加密货币。它通常是一个在线平台并充当中间人。目前有超过 10000 种加密货币在 375 多个交易所交易，总市值达
    2 万亿美元。


    ## EXMO


    EXMO 是一家英国加密货币交易所。EXMO 估计有 180 万用户，支持 8 种法币货币（USD、EUR、GBP、RUB、PLN、UAH、KZT、TRY）、SEPA、SWIFT、借记信用卡。EXMO
    交易所注册于伦敦，在伦敦、莫斯科和基辅设有办事处，拥有 150 多人的项目团队。


    ## Explorer (区块浏览器)


    Explorer 是一种专门为开发用户驱动的 Web 应用设计的区块链模块。它可以用于查看、部署、调用/查询区块、网络信息、交易数据、链码和其他存储在区块链账本中的相关数据。Blockchain.com、Blockcypher、Tokenview
    和 Tradeblock 是优秀的区块链区块浏览器。


    ## Fast sync (快速同步)


    Fast sync 通过避免下载整个区块链并一次处理一个链接来帮助节点层级的同步。它通过仅下载区块并检查验证者的 Merkle 树帮助与链更快同步。许多区块链协议都提供
    Fast Sync 节点。


    ## Faucet (水龙头)


    加密货币世界中的“水龙头”是一个网站，它通过用户完成某些微小任务来发放少量的原生加密货币，或者在测试网（测试网络）上发放固定数量的原生加密货币，用于在部署到主网（主网络）之前测试智能合约和
    dApps。Cointiply、Bonus Bitcoin 和 Bchain Poker 是知名的比特币水龙头。


    ## Fault Tolerance @ types (容错 @ 类型)


    容错性是指系统（计算机、网络、云集群等）在一个或多个组件故障时继续不中断地运行的能力，从而影响可靠性、可用性和安全性。


    崩溃故障（Crash faults）由于硬件、软件和网络故障由于系统和电力故障等引起，而拜斯庭故障（Byzantine faults）是由于未经授权的访问和恶意行为引起的。


    加密货币中的拜斯庭容错（Byzantine Fault Tolerance）是在某些节点故障或提供恶意值以误导网络时对特定区块达成协议或共识的特性。


    崩溃容错（CFT）是一种恢复性水平，即当组件故障时系统仍能正确达成共识。拜斯庭容错（BFT）更为复杂，处理可能存在恶意攻击者的系统。


    实用拜斯庭容错（Practical Byzantine Fault Tolerance）是由 Barbara Liskov 和 Miguel Castro
    在 90 年代后期提出的共识算法。pBFT 设计用于在异步系统（对请求响应的时间没有上限）中高效运行。它针对低开销时间进行了优化。


    异步拜斯庭容错（ABFT）是拜斯庭容错共识算法的属性，允许网络中的诚实节点公平安全地达成一组交易的时间和顺序。


    ## Federated Identity (联邦身份)


    联邦身份是一方在区块链网络上用于访问多个服务的单一身份。它涉及使用单一密钥（数字或生物识别）登录组织内部或多个组织的系统。通过使用联邦身份，服务提供商可以跟踪其服务的使用情况，而身份所有者可以追踪其在网络中的使用情况。这有助于提供透明度、身份控制并防止滥用或未经授权的访问。


    ## Fiat Currency (法币)


    当国家政府或中央银行发行国家性货币时，这种货币被称为法币。法币可能没有黄金、银、石油等支撑，其价值更多基于公民对发行此类货币的中央机构的信任。美元、印度卢比、加元和日元都是法币的示例。


    '
