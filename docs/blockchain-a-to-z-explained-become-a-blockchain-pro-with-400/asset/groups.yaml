    # Address


    In Blockchain world, an address would typically be a hashed version of the “public
    key", which will be referred to by an individual or a platform, in order to transfer
    any cryptocurrency to a wallet. It is a combination of unique numbers and letters
    and a wallet works similar to an email address. Its like a bank account for cryptocurrency.
    In a public blockchain, address can also be used to perform analytics on a wallet.
    In Bitcoin world, different address formats are used. Eg: P2PKH (addresses start
    with 1) - 1BvBMSEYstqTFn5Aum4GFg7xjaN2


    # AES (Advanced Encryption Standard)


    Also known by its original name Rijndael, Advanced Encryption Standard was developed
    by two cryptographers Vincent Rijmen and Joan Daemen. It is based on a design
    principle known as substitution permutation network, made popular in 2001. Development
    started in 1997 when the need for alternate to Digital Encryption Standard (DES)
    was felt as DES was beginning to become vulnerable to brute force attacks. It
    is used in Software and Hardware globally to protect sensitive data in areas of
    government computer security, cybersecurity and electronic data protection. 3
    different versions are available AES 128, AES 192 and AES 256. 128, 192 and 256
