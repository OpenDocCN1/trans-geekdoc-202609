    # 勾谋 (Collusion)


    勾谋是指两个或多个双方之间通常具有欺骗性的协议或秘密合作，通过限制自由公平竞争来共同行动扭曲市场力量。与协作（Collaboration）不同，勾谋会导致市场中出现不健康和欺诈的行为，从而破坏市场平衡。在密码学中，勾谋问题决定了一组用户是否可以通过勾谋，在协议执行后提取出设计上对他们隐藏的信息。


    # 编译器 (Compiler)


    在计算中，编译器是一种计算机程序，它将高级编程语言（也称为源语言）翻译成低级语言，以创建目标计算机可以理解的可执行程序。在以太坊中，Solidity 充编译编译的角色。在
    Hyperledger 中，Fabric 编译器可以将代码发布到 Fabric Store，使其能够下载和使用。


    机计算是一种先进的网络安全范式，用于加密和保护处理过程中的使用数据，从而创建一个高度安全的计算环境。它允许加密数据在内存中进行处理，并降低其暴露给系统其他部分的风险。它是通过硬件支持的过程实现的，创建一个可信执行环境，将受保护的数据或应用程序与操作系统隔离开。Intel
    推出了一项名为软件防护扩展（Intel SGX）的服务，有助于将敏感数据与其他特权部分隔离开，特别是在多租户云环境中。Linux 基金会正在推动机密计算联盟。R3
    启动了一个名为 Conclave 的机密计算平台。


    # Conclave


    由 R3 启动的独立平台，利用 Intel 软件防护扩展（Intel SGX）来解决此类业务场景：即在公司联盟中需要共享数据，但某个个人或公司不应看到其他人的信息。它有助于建立可信服务，能够检测欺诈并降低成本，同时数据所有者可以控制数据的如何共享和处理。


    # 确认 (Confirmation)


    区块链中的确认意味着交易已通过网络处理，通过了系统中编写的共识过程，因此有资格被添加到由相应节点（即交易的一方）维护的账本中。一旦确认，交易被认为几乎是不可逆的且具有防篡改性。使用
    Blockcypher 或 Blockchain.com 浏览器，用户可以将交易 ID 粘贴到相应浏览器的搜索字段中，查看该交易已获得的确认次数。在比特币的设计中，交易在经过平均
    10 分钟后将收到至少 1 次确认。


    # 共识机制 (Consensus Mechanisms)


    成员之间就交易真实性达成一致的机制被称为“共识机制”。共识的形成确保了多个验证者以系统化和预定的方式参与，确保了决策的去中心化和客观性。它确保了区块链平台关键特征的实现，如增加信任、交易的不可篡改性以及维护平台的完整性。它是区块链平台的灵魂，将帮助成员随时做出正确的决策。区块链应用程序的神圣性取决于其所用共识机制的强度和可靠性。比特币和早期版本的公共以太坊客户端遵循“工作量证明（POW）”共识机制，矿工或验证者之间相互竞争，通过消耗计算能力和大量电力等宝贵资源来猜测正确的
    Nonce（仅使用一次的数字）并创建目标哈希值，以赢得创建区块的竞赛。以太坊平台很快将转向基于“权益证明（POS）”的共识，这涉及的能量消耗可以忽略不计。一些新一代公共平台使用基于“PO”和“POS”共识算法的变体，如
    PoET（时间时间证明）和 DPOS（委托权益证明），以最大限地减少资源利用和浪费。企业级区块链（如 Hyperledger 等其他）使用节能算法，如“权威证明”（POA）、实用拜斯庭容错算法（PBFT）、“点对点”（N2N）及其变体来达成确定性共识。共识机制的目标是确保所有参与者拥有分布式数据库文件的相同副本。


    # ConsenSys


    ConsenSys 是 Joseph Lubin 于 2014 年创立的专注于以太坊的软件公司。它提供下一代应用程序和现代金融基础设施以访问去中心化网络。他们的产品体系由
    Infura、Quorum、Truffle、Codefi、MetaMask 和 Diligence组成，为数百万用户服务，支持全球以太坊生态系统参与者的数十亿区块链查询，并处理数十亿美元的数字资产。


    联盟是由两个或多个个人、公司、组织或政府组成的协会，其目的是参与共同活动或汇集资源以实现共同目标。区块链联盟由生态系统中的一组玩家组成，共同目标是利用技术实现生态系统的共同利益，通过在商业环境中建立更高层次的信任、降低成本、提高生产力并让客户满意。为了深入理解这一主题，人们可以参考由
    Srinivas Mahankali（本书合著者）和 Varun Singhi 著，Murthy Chitlur（本书评审员）评审的书籍《BLOCKCHAIN
    CONSORTIUMS – A Comprehensive Handbook: Analyzing the Business Model of the Future》。


    容器技术诞生于1979年的 Unix Version 7 和 Chroot 系统。它在2000年代初随着 Linux VServer 和 Docker 的引入而兴起，导致了该技术的广泛采用。2017年
    Kubernetes —— 一种容器编排技术的引入进一步增强了动力。容器是标准的软件单元，封装了代码及其所有依赖项，以便应用程序从一个计算环境快速可靠地运行到另一个环境。Docker
    容器镜是一个轻量、独立、可执行的软件包，包含了运行应用程序所需的一切：代码、运行时、系统工具、系统库和设置。


    当 Docker 容器在 Docker Engine 上运行时，容器镜像会在运行时变为容器。容器化软件适用于 Linux 和 Windows 应用程序，无论底层基础设施如何，容器化软件的运行始终相同。容器将软件从环境中隔离，并确保尽管在开发和测试环境之间存在差异，它也能统一运行。


    # 合同 (Contract)


    合同是具有法律约束力的协议，受法律强制执行，通常以书面形式记录，在至少双方之间签署，定义并管理协议各方的权利和义务。在区块链生态系统中，合同以应用程序的形式编码并在不可篡改且防篡改的账本上触发。这些应用程序被称为智能合约、链码、流等，并且通过法院批准实体的公证等法律约束性证明来确保可执行性。


    # Corda


    Corda 是一个开源项目，由 R3（一家企业软件公司）推动，基于分布式账本技术，旨在让企业在可信环境中相互交互。其意图是交付下一代区块链平台，解决隐私、可扩展性和安全性问题，成为金融服务和其他领域的首选
    DLT 平台。Corda 的智能合约技术允许互操作的业务网络在严格的隐私保护下直接进行价值交易。Corda 不是批量批准并在在区块中确认交易，而是实时确认并提交每笔交易。已有超过
    350 家机构部署了 Corda。


    '
