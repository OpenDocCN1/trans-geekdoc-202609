    ## Stable Coins


    Stable coins are cryptocurrencies whose value is pegged to market value of assets
    or currencies that reference them. Stable coins may be pegged to a currency like
    the U.S. dollar or to a commodity’s price such as gold. Most popular stable coins
    are Tether, Diem, USD coin, Dai, PAX. They generally provide pricing stability
    unlike other cryptocurrencies, hence they are very popular with investors and
    users who don''t like excessive volatility in prices.


    ## Stale Block


    These blocks are also known as Orphan blocks which are successfully mined but
    are not included on the current best block. This occurs when blocks are added
    to the chain that is not the longest. In Bitcoin blockchain, only the longest
    chain wins and takes the blockchain forward.


    ## State


    State reflects all committed transactions on the blockchain. This is basically
    a key-value store which is updated as a result of transactions and chaincode execution.
    For this purpose, either LevelDB or CouchDB is used.


    ## State Channel


    A channel is a private blockchain overlay which allows for data isolation and
    confidentiality. Using state channels, users transact with each other directly
    off the chain. They help in increasing the throughput of Public blockchains as
    they reduce the load for nodes while processing and storing transactions. They
    are also expected to reduce the cost of using Ethereum network as users pay transaction
    fees (also known as gas) only while opening and closing channels and not for the
    transaction.


    ## Static Nodes


    They represent set of trusted nodes that are preconfigured. In Hyperledger Besu,
    static nodes are exempt from certain limitations like maximum peer and remote
    connection limits. Static nodes are also used as an alternate method to find peers.


    ## Stellar


    Stellar is Distributed Ledger Technology (DLT) powered Payments protocol. Stellar
    makes it possible to create, send and trade digital representations of all forms
    of money—dollars, pesos, bitcoin and other currencies. It''s designed in a way
    that all of world''s financial systems can work together on a single network.
    Lumen is the native currency of Stellar, 100 billion Lumens were created during
    inception of Stellar Network.


    ## Steward


    Used in Sovrin Network that promotes usage of Self Sovereign Identity (SSI) on
    internet. Sovrin Stewards are organizations that operate the network by running
    validator nodes which write to and read the Sovrin ledger. These trusted volunteers
    donate time, resources, and computing power to operate and maintain the network
    while agreeing to abide by the requirements of the Sovrin Governance Framework.
