    # Zero Confirmation Transaction


    Zero confirmation transaction is a transaction which occurs but is not yet confirmed
    by the miners. This means the transaction that has not yet been recorded and verified
    on the blockchain. The first confirmation comes when a block records the data.


    # ZK Snark (Zero-knowledge succinct non-interactive argument of


    A zk-SNARK is a cryptographic proof that allows one party to prove it possesses
    certain information without revealing that information. It was introduced by Bitansky
    et al. This proof is made possible using a secret key created before the transaction
    takes place. “Succinct” zero-knowledge proofs can be verified within a few milliseconds,
    with a proof length of only a few hundred bytes even for programs that are very
    large. Zcash is the first cryptocurrency in the world to use ZK Snark to encrypt
    the transactions. Till 2021, 82 cryptocurrencies have adopted Zero Knowledge Proof
    or other private technology to encrypt transactions.


    # ZK-STARK (Zero-knowledge Scalable Transparent Argument of Knowledge)


    Created by Eli Ben Sasson, these are quantum proof unlike ZK-SNARK. They are more
