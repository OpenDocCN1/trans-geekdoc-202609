    Cross Industry Standard Process for Data Mining (CRISP-DM) refers to the standards
    used by Data mining experts while dealing with data across organisations, systems
    and platforms. Blockchain is an inter-enterprise platform and the data is recorded
    in Blockchain ledgers. As this data is deemed to be a high quality input for Data
    Analysis, it is important to strictly adhere to the CRISP-DM, an open standard
    process that incorporates many open standard processes.'
