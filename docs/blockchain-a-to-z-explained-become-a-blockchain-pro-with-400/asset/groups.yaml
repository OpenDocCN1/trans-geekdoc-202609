  - '[PAGE 334]


    # P2P (Peer to Peer)


    Peer-to-peer is a decentralized interaction where in two individuals interact
    directly with each other without any intermediary or 3rd party in between. P2P
    computing or networking is a distributed application architecture that distributes
    or divides tasks or workloads between different personal computers also known
    as peers. P2P network shares processing power, network bandwidth and storage space.
    A Blockchain network operates using a P2P network which runs the protocol and
    maintains identical copies of ledgers with recorded transactions.'
  - '[PAGE 335]


    # Pancake Swap


    It is a decentralized exchange built on Binance Smart Chain and enables users
    to trade cryptocurrencies without any intermediary. It is powered by automated
    Smart contracts and taps into user generated liquidity pools.'
  - '[PAGE 336]


    # Parity


    Parity is an open-source software solution written in Rust programming language.
    It offers an alternative to Geth Ethereum client and allows individuals to run
    nodes on public Ethereum network, or any other blockchain network that uses Ethereum.
    Parity offers Miners, Node operators, and Exchanges, benefits like fast synchronization
    and maximum uptime.'
  - '[PAGE 337]


    # PDOs (Private Data Objects)


    Used in Hyperledger implementations, Private Data Objects (PDO) enables sharing
    of data and facilitates coordination amongst parties that do not trust one another.
    Interaction is facilitated through smart contracts that are enforced through execution
    in Trusted Execution Environment (TEE). PDOs perform contract execution and storage
    off the Blockchain. Only the hash representing the Blockchain state is stored
    on the distributed ledger. PDOs help in implementing privacy preserving distributed
    ledgers.'
  - '[PAGE 338]


    # Pegging


    Linking cryptocurrencies value to fiat currencies, gold or other commodities is
    known as pegged. This provides pricing stability to cryptocurrencies that are
    linked and insulates them from significant changes in value. Such linked cryptocurrencies
    are also known as Stablecoins. True USD (TUSD), Tether (USDT), Paxos Standard
    (PAX) are pegged with United States Dollar.'
  - '[PAGE 339]


    # Permissioned Blockchain


    A Blockchain requiring permission or prior approval before using it is known as
    Permissioned Blockchain. It is also known as Private or Enterprise Blockchain
    where Blockchain is hosted by a company or an enterprise or an industry body,
    technically referred to as Central Authority that authorizes others to join the
    Blockchain as trusted validators. Hyperledger Fabric, Corda and Quorum are examples
    of Permissioned Blockchains.'
  - '[PAGE 340]


    # Permissionless Blockchain


    Permissionless blockchains are blockchains that require no prior permission to
    join or use them. They are also known as public blockchains. They digitize trust
    and eliminate the need for intermediaries who otherwise are required to mediate
    transactions or foster trust in them. Bitcoin and Ethereum are examples of Permissionless
    Blockchains.'
  - '[PAGE 341]


    # PKI (Public_Key_Infructure)


    PKI made its first appearance in 1990s to administer and manage encryption keys
    through digital certificates. These digital certificates confirm the identity
    of people, devices or applications that own private keys and corresponding public
    keys. This ensures that people who are sending information through encryption
    gain required confidence that desired recipients of such information are actually
    the ones who will receive and read it. Anyone else who is not the intended recipient,
    will not have the ability to intercept and interpret such information. PKI assigns
    identities to keys so that senders and receivers of information can accurately
    verify one another. Verisign, Gemalto, GlobalSign, WISekey, ENIGMA and eMudra
    are leading PKI providers in the world.'
  - '[PAGE 342]


    # Plasma


    Created by Vitalik Buterin, Co-Founder of Ethereum, Plasma refers to a framework
    that allows creation of child blockchains that use the main Ethereum chain for
    arbitration and creating trust. It uses smart contracts and verification to offload
    transactions from the main Ethereum chain into a side chain. These side chains
    or plasma chains enable fast and lower cost transactions and their validation
    is preserved on the main Ethereum chain. In essence, Plasma will help Ethereum
    Blockchain handle much larger transactions and speed, thereby addressing the performance
    challenges.'
  - '[PAGE 343]


    # PoET (Proof_of_Elapsed_Time)


    PoET is a blockchain network consensus mechanism algorithm, used frequently on
    permission blockchain networks. It is based on Intel''s CPUs called SGX – Software
    Guard Extensions. It prevents high resource utilization and high energy consumption
    and keeps the process more efficient by following a fair lottery system. The algorithm
    uses a randomly generated elapsed time to select the node that will win the new
    block. Miners generally go to sleep and don''t participate in mining while waiting
    for their turn. Hence it facilitates energy efficient mining.'
  - '[PAGE 344]


    # Polkadot


    Polkadot is a heterogeneous multi-chain interchange possessing a translation architecture
    that enables customized side-chains to connect with public blockchains. It allows
    data and tokens to be transferred across Blockchains thereby facilitating cross-chain
    registries and computations. Polkadot''s first token sale closed on October 27,
    2017 raising a total of 485,331 ETH. Gavin Wood, Thiel Fellow Robert Habermeier
    and Peter Czaban are the co-founders of Polkadot. Gavin Wood was previously the
    Chief Technology Officer and is co-founder of the Ethereum Project. It is also
    a flagship project by Web3 Foundation to build a fully functional and decentralized
    web.'
  - '[PAGE 345]


    # Private Blockchain


    A private blockchain is an invitation-only blockchain. The blockchain is governed
    by a single entity. The participating parties require permission to read, write,
    or audit the blockchain. The blockchain can have multiple layers of data access
    to keep certain pieces of data confidential. Also known as Permissioned Blockchain.'
  - '[PAGE 346]


    # Private Keys


    A private key, also known as a secret key, is a variable in cryptography that
    is used with an algorithm to encrypt and decrypt messages or information. Secret
    keys are only shared with the key''s generator, making it highly secure. Private
    keys play an important role in symmetric cryptography, asymmetric cryptography
    and cryptocurrencies.'
  - '[PAGE 347]


    # Proof_of_Activity_(PoA)


    Decred, a well known cryptocurrency, uses Proof-of-activity which is a hybrid
    consensus algorithm. PoA is a combination of two other blockchain consensus algorithms:
    Proof-of-Work (PoW) and Proof-of-Stake (PoS). It is used to ensure that all transactions
    occurring on the blockchain are genuine and that all miners arrive at a consensus.
    Blocks that are mined do not contain transactions; they contain only header information
    and mining reward addresses. Network fees or rewards are shared between miners
    who find the blocks and validators who sign the blocks.'
