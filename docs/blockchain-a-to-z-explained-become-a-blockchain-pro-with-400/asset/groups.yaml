  mdcn: '


    ## 区块奖励 (Block Reward)


    区块奖励是矿工在成功验证最新区块时获得的一种加密货币奖励。区块奖励由两部分组成：区块补贴和交易费。区块补贴由新生成的代币组成，占区块奖励的大部分。另一部分由包含在区块中的所有交易所支付的费用组成。在比特币中，目前每挖出一个有效区块的奖励为
    6.25 BTC。然而，这个数字每 4 年或每挖出 210,000 个区块就会改变并减半。


    ## 区块时间戳 (Block timestamp)


    每个区块都包含一个基于 Unix 时间的时间戳。时间戳有助于追踪区块哈希的变化，并使恶意者难以操纵区块链。每个时间戳在其哈希中还包含了上一个时间戳，从而形成链结构并强化早期的区块。


    ## 区块链 (Blockchain)


    区块链是一种共享、不可更改的账本，促进了业务网络中记录交易和跟踪资产的过程。通过在网络内部互不熟悉的双方之间以信任的方式对几乎任何价值资产进行安全的跟踪、追溯和交易，区块链技术极大地降低了风险并削了所有参与者的成本。


    它是一种记录信息的系统，使得黑客攻击或欺欺变得困难。它本质上是存储在区块中的交易记录，这些区块在整个网络中复制或分布。因此，只有在获得网络每个参与者对更改的同意后，更改才会提交到账本上。因此，区块链中的记录是防篡改的。区块链也被分布式账本技术（DLT）。公链、私链和混合链是不同类型的区块链。比特币、以太坊和狗狗币是公链，Hyperledger
    Corda 是私链，企业以太坊联盟（EE）和 TradeLens 是混合链。


    ## 区块时间 (Blocktime)


    它是在区块链中创建下一个区块所需的时间。在比特币中，为 10 分钟。区块时间随不同的区块链协议而异。在以太坊中，平均区块时间为 13.30 秒，并且多年一直在上升。


    ## 启动节点 (Bootnode)


    启动节点用于区块链的安装、运行配置和更新管理。它还用作普通节点来扩展其他节点或发现它们。它有助于发现对等节点。


    ## 赏金 (Bounty)


    一种用于代币首次发售（ICO）的营销策略，为参与活动与 ICO 相关的各种活动（特别是推广活动）提供激励。ICO 完成后，可以使用赏金计划从外部开发人员处获取项目代码的反馈，或作为在媒体渠道推广
    ICO 或项目的奖励。


    ## BTC


    用于指代比特币（Bitcoin）的短代码。


    ## BTC 托管 (BTC Escrow)


    比特币或加密货币交易中参与者之间的中介机构。当一个人决定通过支付比特币来购买某些商品或服务时，他/她会将这些比特币发送到托管服务处，比特币将保存在系统中，直到卖家提供商品或服务。一旦交易完成，存储在托管系统中的比特币将自动发送给卖家。


    ## BTD (抄底 - Buy the Dip)


    加密货币交易者使用的俚语，指在某种特定加密货币价格下跌或处于下降趋势时买入该货币。


    ## 漏洞赏金 (Bug Bounty)


    这是一项倡议，识别并报告程序、代码和应用程序漏洞的个人将获得奖励。它有助于在漏洞变成安全问题之前发现它们。英特、Facebook、思科、苹果、Dropbox
    等公司已成功运行了此类计划。支付金额从几百美元到数千美元不等。币安作为全球领先的加密货币交易所之一，每个发现的漏洞提供 200 美元至 10,000 美元的奖励，最高奖励为
    100,000 美元。


    ## Burrow


    Hyperledger Burrow 是一个许可的以太坊智能合约区块链节点，专注于简单性、速度和开发者人体工程。它支持基于以太坊虚拟机（EVM）和 Web
    Assembly（WASM）的智能合约，并通过 Tendermint 算法使用拜占斯庭容错（BFT）共识。特性包括支持权益证明、链上治理、Javascript
    客户端库等许多。


    ## 比特币披萨日 (Bitcoin Pizza Day)


    5 月 22 日被称为比特币披萨日。2010 年，来自美国佛罗里达州的开发者 Laszlo Hanyecz 用比特币从 Papa Johns 购买了两个大披萨，并出价
    10,000 BTC，这在当时相当于 30 美元。考虑到目前的比特币价格，这笔交易在今天价值 5.8 亿美元。


    ## CA (中央机构 - Central Authority)


    组织、机构或一组人中任何系统中的中央机构，被指定在系统的实施和运行中发挥关键的促进作用。中央机构承担旨在保护系统成员和用户的活动责任。政府和监管机构、IT
    管理员和中央银行是“中央机构”的一些例子，它们是开展大型业务的支点。


    ## 区块链中的 CA (证书机构 - Certification Authority)


    在区块链系统中，中央机构服务器通过颁发在各自系统中受认可的证书来保证参与实体地址的唯一性。它利用证书机构来实现这一目的。在密码学中，证书机构或认证机构是发行数字证书的实体。这些证书证明了命名主体对公钥的所有权。除了用户注册外，CA
    还管理在区块链上进行的交易以及不同用户之间的传输层安全（TLS）连接。


    ## CAP 定理 (CAP Theorem)


    一致性（所有客户端对数据的视图统一且一致）、可用性（在节点故障时保持持续性能和运行时间）和分区容错性（尽管节点分区，数据保持准确性和完整性）是分布式系统的一些关键特性。根据
    CAP 定理，任何分布式系统/数据库在任何时候只能在上述三个属性中提供 2 个，选择提供 C&A、A&P 或 P&C。例如，比特币、以太坊等无许可区块链选择了提供可用性和分区容错，而牺牲了即时一致性，从而提供了数据的“最终一致性”。


    ## 卡尔达 (Cardano)


    Cardano 是一个加密货币网络和开源项目，旨在运行用于智能合约的公共区块链平台。Cardano 的内部加密货币被称为 Ada。该项目的开发由位于瑞士苏格的
    Cardano 基金负责和监督。它由以太坊和 BitShares 的创始人 Charles Hoskinson 于 2017 年推出。


    ## Caliba


    Caliba 是 Facebook 的区块链部门。它将允许 Facebook 向其用户开启数字支付。Caliba 团队正在为 Facebook 的应用程序构建数字钱包，该钱包最终将持有
    Diem（原 Libra）数字货币，但 Facebook 不控制该货币。目前尚清楚 Facebook 是否正在积极推进该项目。


    ## Caliper


    Hyperledger Caliper 是由 Linux 基金会托管的一个区块链工具。它利用一组预定义的用例来计算特定区块链实现的性能。Caliper 还可以生成有关性能因素的报告，包括资源利用率、交易延迟和每秒交易数（TPS）。


    ## Casper


    Casper 网络是第一个基于 Casper CBC 规范构建的活跃权益证明区块链。Casper 的设计旨在加速企业和开发者现在对区块链技术的采用，并在未来演进以满足用户需求。它培养了核心的
    Web3 原则，允许任何人通过各种应用程序参与区块链，而无需将其个人数据变现。


    '
