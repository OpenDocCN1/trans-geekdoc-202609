  mdcn: '


    ## 维里克·布特林


    Vitalik Buterin 是以太坊的联合创始人兼创造。他在2011年作为《比特币杂志》联合创始人的身份进入加密货币世界。他在2014年与 Gavin
    Wood 一起发了太坊。他还因慈善事业而闻名，向各种机构和基金会捐赠了价值超过15 亿美元的加密货币。


    ## W3C (万维网联盟)


    W3C 成立于1994年，由万维网发明者蒂姆·伯纳斯-李领导，致力于开发万维网标准。这些开放标准供所有人访问，以便 Web 能够作为一个“单一网络”运行，并推动人类的创新。W3C
    致力于促进以下设计原则：1. 全民性 Web（无论硬件、软件、母语、身体或心理能力如何，所有人都能受益）和2. 万物皆 Web（通过手机、智能手机、自助终端、交互式语音响应系统等访问
    Web）。


    ## 钱包


    钱包是一种允许加密货币用户存储和检索数字资产的应用程序。五种主要的加密货币钱包包括移动钱包、桌面钱包、纸质钱包、硬件钱包和在线钱包。


    ## Web3.js


    它指的是一组库，允许用户使用 HTTP、WebSocket 协议或 JSON 远程过程调用 (RPC) 与本地或远程以太坊节点交互。它由以太坊基金会创建，便于获取用户账户、发送交易以及与智能合约进行交互。


    ## 信任网 (Web_of_Trust)


    信任网是用于 PGP（优佳隐私）的一个概念。它最初由 Phil Zimmerman、GnuPG (GNU Privacy Guard) 以及其他 OpenPGP
    兼容系统创建，用于建立公钥与其所有者之间关系的真实性。它以去中心化的方式使用信任模型，被认为是依赖中心权威的公密钥基础设施 (PKI) 中心化信任模型的良好替代方案。


    ## Web3


    Web3 可以被称为互联网后端的革命，而 Web2 是前端革命。它是一组由区块链引导的协议集，旨在重新设计互联网后端的连接方式，将互联网逻辑与计算机逻辑相结合。它赋予用户控制自己数据的能力，并创建了一个原生结算层。它为互联网带来了被遗忘和删除的权利。


    ## 大卫维


    Wei Dai 是一位计算机工程师和著名的密码朋克，因对密码学和加密货币的贡献而闻名。他是 Terra Sciences 的程序员，也是微软加密货币研究小组的成员。他开发了
    Crypto++ 密码库，创建了 b-money 加密货币系统，并共同提出了 VMAC 消息认证算法。他还通过识别加密块链模式（CBC）中的漏洞为 SSH2
    漏洞的发现做出了贡献。


    ## Wei


    Wei 是以太（以太坊网络使用的加密货币币）的最小单位。一个 wei 是一个以太的十亿分之一。Wei 以计算机工程师大卫维命名，他因对密码学和加密货币领域的贡献而闻名。


    ## 巨鲸 (Whale)


    巨鲸指的是持有大量比特币的个人或实体。凭借持有大量的加密货币，他们具有操纵货币价格和估值的潜力。Barry Silbert、Tim Draper、Michael
    Novogratz、Tyler & Cameron Winklevoss 都是著名的比特币巨鲸。


    ## 什么时候买兰基 (When Lambo)


    这是一个用来代表加密货币成功的俚语。当一个新的加密货币或代币被发布时，人们会问“When Lambo”，以表示币价何时能足够买一辆兰基尼。


    ## 私语 (Whisper)


    Whisper 是以太坊 P2P 协议栈的一部分，允许用户通过区块链运行的网络进行消息传递。它是一个纯基于身份的消息传递系统，提供简单的底层 API，且不基于或不受底层硬件属性和特征的影响。


    ## 世界状态 (World State)


    世界状态是一个键值存储，随着交易和链码执行而更新。它是 Hyperledger Fabric 账本的一个组件。它代表链交易日志中所有键的最新值。每当键的值改变时，世界状态就会发生变化。


    ## 包装比特币 (Wrapped Bitcoin)


    包装比特币 (WBTC) 是一种 ERC-20 代币，代表以太坊区块链上的比特币 (BTC)。WBTC 促进了与以太坊钱包、dApps 和智能合约的集成。本质上，包装比特币允许比特币持有者在以太坊将其币代币化，并由等数量的
    WBTC 代币匹配。


    ## 包装币 (Wrapped Coins)


    它们代表其他加密货币的代币化版本，并解决了两个不同区块链之间互操作性的限制。包装币存在于最初用于发行它们的区块链上。例如：包装比特币和包装以太。包装币有助于增加中心化和去中心化交易所的流动性。


    ## WASM (Web Assembly)


    Web Assembly 是一种基于栈的虚拟机的二进制指令格式。Wasm 被设计为编程语言的可移植编译目标，能够在 Web 端上部署客户端和服务器应用程序。


    ## XRP


    XRP 是由 Jed McCaleb、Arthur Britto 和 David Schwartz 构建用于支付的数字资产。它是 XRP (Ripple)
    账本上的原生数字资产。Ripple 从2012 年开始出售 XRP。它的意图是允许金融机构以极低的费用和等待时间转移资金。它一直被定位为通过主要金融机构之间的结算层，作为
    SWIFT 的替代方案。


    ## YAC (Yet Another Consensus)


    这是一种基于模块化架构和简单实现基础的新颖且行的实用拜斯庭容错共识算法，被称为 Yet Another Consensus。它已在 Hyperledger
    Iroha 区块链平台中实现，有助于实现低延迟和极高的交易吞吐量。


    ## YAML (Yet Another Markup Language)


    YAML 最初由 Clark Evans 在2001年提出，是一种标记和数据序列化语言，诞生于2001年。YAML 是 JSON 的替代方案，以自然、易读且简洁的方式格式化数据。它不是真正意义上的编程语言。YAML
    文件存储信息，不包含操作和决策。它发布于 HTML、XML 和 SGML 等各种标记语言盛行的时代。后来，YAML 被重新定义为 YAML Aint Markup
    Language（YAML 可不是标记语言）。


    ## 收益耕矿 (Yield Farming)


    任何通过部署加密资产来产生最大回报的努力被称为收益耕矿。它开启了新的价格套利机会，并涉及通过 DeFi 协议出借加密资产或资金以获得固定或浮动收益。


    ## YFI (Yearn Finance)


    它是进入以太坊生态系统中一系列收益生成产品的门户。它与所有 DeFi 投资途径接轨，如借贷聚合、收益生成和保险。它有一种原生代币称为 YFI 币。


    Zcash 是世界上第一个通过 zk SNARKS 使用零知识证明 (ZKP) 的加密货币，为其用户提供了增强的隐私保护。它不会让每笔交易细节公开，而大多数其他加密货币都是这样。Zcash
    基于比特币的代码库。2013年，约翰霍普金斯大学的 Matthew Green、Ian Miers 和 Christina Garman提出了 Zerocoin，这是比特币的一个提议隐私扩展。Alessandro
    Chiesa、Eli Ben Sasson、Eram Tromer & Madars Virza 后来加入了创始团队。2015年成立了 Zero Coin
    Electronic Company，致力于研究和交付提议的隐私扩展。Zcash Foundation 于2017年成立。Zcash 与比特币有许多相似之处，例如2100万单位的固定总量。

    '
