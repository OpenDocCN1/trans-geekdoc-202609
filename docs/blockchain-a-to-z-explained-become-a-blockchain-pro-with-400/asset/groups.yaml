    is equal to 1 bitcoin (BTC). This unit is usually more convenient for pricing
    tips, goods and services. It is also known as Micro bitcoin. However, smallest
    unit of Bitcoin is Satoshi and 100 Satoshis make 1 Bit.'
  - '[PAGE 78]


    # BITA (Blockchain in Transport Alliance)


