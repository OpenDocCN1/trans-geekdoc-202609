    can spin up a new instance of blockchain on the environment within seconds. Additionally,
    end-users can exchange values on the ledger according to rules identified by the
    administrator of Blockchain. It is most suited for issuance and management of
    Digital Assets, also supports Land titles ownership and management, Music licensing,
    Gifts cards and Loyalty points.'
