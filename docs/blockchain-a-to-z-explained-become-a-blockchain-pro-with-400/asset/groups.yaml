    ## PaaS (Platform as a Service)


    It''s a business arrangement or model where users of PaaS need not install in-house
    hardware and software to develop or operate applications. The PaaS provider delivers
    software and hardware tools to users over the internet using cloud computing technology.
    Users will pay based on their usage – “Pay as you Go” pricing model. PaaS is delivered
    through public, private or hybrid cloud platforms. Various types of PaaS include
    Open PaaS, Mobile PaaS, Hybrid PaaS, Private PaaS and Public PaaS. Google, Red
    Hat, Oracle, IBM, Amazon Web Services (AWS) and Microsoft are leading PaaS providers.


    ## Pump and dump


    It refers to buyers accumulating cryptocurrencies or tokens with an intention
    to manipulate the pricing upwards by creating bullish sentiments and spreading
    wrong information, leading to price inflation (pumping) and then selling them
    all at once which causes prices to crash (dumping).


    ## PGP (Pretty Good Privacy)


    Developed by Phil Zimmermann in 1991 as free email security program, Pretty Good
    Privacy is an encryption program used for signing, encrypting and decrypting texts,
    e-mails, files, directories and whole disk partitions. PGP uses International
    Data Encryption Algorithm (IDEA) invented by Xuejia Lai and James Massey in 1991,
    which is the private key protocol and uses RSA as public key encryption system.
    It uses both Public and Private cryptosystem to increase the security and privacy
    of data and e-mail communications.


    PGP survived law suits from NSA and US Government in its early days as it helped
    people and enterprises to secure their communications and insulate them from trapdoors
    that would have existed in secure communications equipment so that messages could
    be decrypted and read by the Government.


    ## Quartz


    Quartz is a startup incubated by TCS, and provides foundational technology, tools
    and business components for creating distributed ledger through their offering
    The Smart Ledgers. It comprises Quartz Smart Solutions – set of business solutions
    for various industries, Quartz Devkit – smart contracts development kits, Quartz
    Gateway – helps in easy integration of existing applications with Blockchain networks
    and Quartz Command Center – helps in monitoring entire ecosystem.


    ## Quantum Computing


    Quantum computing is the use of quantum phenomenon such as superposition and entanglement
    to perform computations at a much faster rate compared to classical computers
    that we use today. Computers that perform quantum computations are known as quantum
    computers. The most widely used Quantum computer model is the quantum circuit,
    based on the quantum bit, or “qubit”, which is somewhat analogous to the bit in
    classical computation. A qubit can be in a quantum state, or in a superposition
    of the 1 and 0 states. When it is measured, however, it is always 0 or 1; the
    probability of either outcome depends on the qubit''s quantum state immediately
    prior to measurement. Quantum computing movement began in 1998 when Isaac Chuang,
    Neil Gershenfeld and Mark Kubinec created the first quantum computer with 2 Qubits.
    IBM Q, Google Sycamore and Intel Tangle Lake are well known Quantum computers
    with close to greater than 50 Qubits. D-wave has Quantum computers with greater
    than 128 Qubits but based on Quantum Annealing. Quantum computers are expected
    to transform medicine by increasing drug discovery speeds, transform communications
    and artificial intelligence. In Blockchain world, they are expected to impact
    the cryptographic principles that power Blockchains.

    '
  mdcn: '


    ## 权威证明 (Proof of Authority)


    权威证明（PoA）是一种基于信誉的共识算法，为区块链网络（特别是私有链）提供了一种实用且高效的解决方案。该术由以太坊创始人、前 CTO Gavin Wood
    于 2017 年提出。生成新区块的权利赋予已证明其权威性的节点；权威通过通过初步身份验证获得。PoA 的优点包括：


    - 无需高性能硬件

    - 高交易率

    - 新区块的生成时间或间隔可预测


    IOTW 区块链使用了 PoA 共识算法。


    ## 燃烧证明 (Proof of Burn)


    燃烧证明（PoB）是一种区块链共识机制，与工作证明（PoW）相比，它的能耗极低。在这种机制中，矿工通过将币发送到无法取出的地址来“燃烧”，而不是投资昂贵的计算机来挖矿。这种燃烧为矿工提供了基于随机选择过程的矿特权。Slimcoin
    和第三代币（TGCoin）使用了燃烧证明共识机制。


    ## 权益证明 (Proof of Stake)


    一种用于实现分布式共识的共识机制。以以太坊为例，它要求用户质押以太坊（Ether）成为验证者。验证者被随机选择以创建区块，并负责检查和确认他们未创建的区块。这种确认或验证类似于证明（attestation）。验证者因提议良好且无恶意的区块获得奖励，如果证明了恶意区块，则会失去其质押。权益证明共识机制在能源利用和提供更高抗中心化免疫力方面优于工作证明。由于能源效率高，使用权益证明的加密货币被称为“绿色加密货币”，如
    Cardano、Polkadot、Neo 和 Cosmos。


    ## 工作证明 (Proof of work)


    工作证明（PoW）是一种去中心化的共识机制，用于保护比特币、以太坊等加密货币的安全。它被用于验证交易和挖掘新的代币或货币。它的前提是：存在一组难以产生但易于验证的值。矿工将一组交易组合成一个区块并尝试进行挖掘。要挖掘该区块，必须解决一个名为“工作证明”的复杂数学问题。解决方案在于找到一个小于区块哈希值（也称为目标哈希）的数字。目标值越低，生成区块的难度越大。矿工利用计算能力不断测试被称为“随机数”（Nonces）的各种值，直到找到正确的值来解决问题。成功解决问题的矿工将获得区块奖励，并将区块添加到网络中，广播该区块已被挖掘。一旦问题被解决，其他人就可以根据工作证明算法轻松地验证。SHA
    256、Scrypt 和 SHA-3 是支持工作证明的一些知名算法。


    ## 协议 (Protocol)


    协议是管理计算机之间数据共享的基本规则集。对于加密货币，它们建立了关于区块链结构、共识机制和分布式数据库的指南，允许数字货币在网络和互联网上安全地交换。


    ## 公有链 (Public Blockchain)


    公有链也称为无许可区块链。任何人都可以加入区块链网络，且信息在公共领域可用。由于其无许可的性质，任何方都可以查看、读取和写入区块链上的数据，且此类数据对所有人可见。网络中的没有任何特定参与者或节点对公有链包含的数据具有完全控制权。比特币和以太坊是公有链的示例。


    ## 公钥 (Public Keys)


    公钥是一个用于加密数据或信息的大型数值。该密钥由软件程序生成，但在实践中通常由被称为认证机构的受信指定机构提供。


    用公钥加密的消息可以使用信息接收者持有的私钥进行解密，该密钥仅他们已知。每个公钥仅对应一个私钥。


    ## Pyethereum


    Pyethereum 是以太坊项目的 Python 核心库。换句话说，它是使用 Python 编程语言实现的以太坊虚拟机（EVM）。它由 Vitalik Buterin
    编写。


    ## Python


    由 Guido van Rossum 于 1991 年发明。是一种具有动态语义的高级面向对象编程语言。由于简单的编程语法、类英语命令和代码的可读性，它受欢迎并广泛采用。它被广泛用于
    Web 开发、机器学习、人工智能和移动应用程序开发。Python 的最新版本是 2020 年 10 月发布的 3.9 版本。Python 允许开发者仅用极少的代码创建区块链，并带有多个免费包，使区块链代码更高效。


    ## PaaS (平台即服务)


    这是一种业务安排或模型，PaaS 用户无需安装内部硬件和软件即可开发或运行应用程序。PaaS 提供商通过云计算技术通过互联网向用户交付软件和硬件工具。用户根据使用情况付费——采用“按需付费”（Pay
    as you Go）定价模型。PaaS 通过公共、私有或混合云平台交付。各种类型的 PaaS 包括开放 PaaS、移动 PaaS、混合 PaaS、私有 PaaS
    和公共 PaaS。Google、Red Hat、Oracle、IBM、Amazon Web Services (AWS) 和 Microsoft 是领先的
    PaaS 提供商。


    ## 拉高抛售 (Pump and dump)


    指的是买家积累加密货币或代币，旨在通过制造看涨情绪和传播错误信息来操纵价格上涨，导致价格通胀（拉高），然后一次性全部出售导致价格崩溃（抛售）。


    ## PGP (良好的隐私)


    Pretty Good Privacy 由 Phil Zimmermann 于 1991 年开发，作为免费电子邮件安全程序，是一种用于签名、加密和解密文本、电子邮件、文件、目录和整个磁盘分区的加密程序。PGP
    使用赖雪家和 James Massey 于 1991 年发明的国际数据加密算法（IDEA），这是私钥协议，并使用 RSA 作为公钥加密系统。它同时使用公钥和私钥加密系统来增加数据和电子邮件通信的安全性和隐私。


    PGP 在早期生存了来自 NSA 和美国政府的诉讼，因为它帮助个人和企业保护其通信，并防止受保护通信设备中可能被政府解密和读取的后门攻击。


    ## Quartz


    Quartz 是 TCS 孵化的初创公司，通过其产品 Smart Ledgers 为分布式账本提供基础技术、工具和业务组件。它包含 Quartz Smart
    Solutions——各行业的业务解决方案、Quartz Devkit——智能合约开发工具包、Quartz Gateway——帮助现有应用程序集成到区块链网络以及
    Quartz Command Center——帮助监控整个生态系统。


    ## 量子计算 (Quantum Computing)


    量子计算利用叠加和纠缠等量子现象进行比我们使用的经典计算机快得多的计算。执行量子计算的计算机被称为量子计算机。最常用的量子计算机模型是量子电路，基于量子比特（qubit），它类似于经典计算中的比特。量子比特可以处于量子状态，也可以处于
    1 和 0 状态的叠加中。然而，在进行测量时，它总是 0 或 1；任何结果的概率取决于测量之前的量子比特状态。量子计算运动始于 1998 年，Isaac Chuang、Neil
    Gershenfeld 和 Mark Kubinec 创建了第一个具有 2 个比特的量子计算机。IBM Q、Google Sycamore 和 Intel
    Tangle Lake 是著名的接近或超过 50 个比特的量子计算机。D-wave 拥有超过 128 个比特的量子计算机，但基于量子退火。量子计算预计将通过加速药物发现来改变医学，改变通信和人工智能。在区块链世界，它们预计将影响区块链的加密原理。


    '
