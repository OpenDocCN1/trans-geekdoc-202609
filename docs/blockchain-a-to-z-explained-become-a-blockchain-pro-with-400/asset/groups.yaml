  mdcn: '


    # Libra (现为 Diem)


    Libra（又名 Diem）是由 Facebook 创建的一种加密货币，旨在作为全球范围内简单、低手续费的交易媒介。它由一组资产支持，其中包括主要货币和政府债务证券，这些资产提供了定价稳定性。因此，它是一种稳定币。Diem
    拥有 26 个成员，包括金融公司、非营利组织和 Facebook 的数字钱包公司 Novi。


    # Light Client (Light Client)


    轻量客户端（也称为部分节点或轻量级客户端）是区块链生态系统中关键元素。它们帮助用户以安全去中心化的方式访问并与区块链交互，无需同步整个区块链。它们基于轻节点，只下载区块头以建立交易的真实性。当与整个区块链网络连接时，它们由全节点提供服务。


    # Light Node (Light Node)


    轻量级节点使用称为简化支付验证（SPV）的方法验证交易。SPV 允许节点在无需下载整个区块链的情况下验证交易是否已包含在区块中。通过 SPV，全节点通过允许轻量级节点连接并将交易传输到网络来提供服务，并在交易影响它们时通知它们。轻量级节点只需要下载区块链上所有区块的头部，这意味着它的下载和存储需求相对于全节点要低得多。


    # Lightning_Network (闪电网络)


    闪电网络是一种运行在基于区块链的加密货币之上的二层支付协议。它旨在实现参与节点之间的快速交易，并被提议作为解决比特币扩展性问题的解决方案。双方之间的交易将在区块链之外执行，即作为链下交易。这将减少交易处理时间和相关成本。Thaddeus
    Dryja 和 Joseph Poon 在于 2015 年制定了比特币闪电网络。


    # Linux Foundation (Linux 基金)


    Linux 基金总部位于美国旧金山，是一个成立于 2000 年的非营利技术财团，它是开源开发实验室和自由标准小组合并的，旨在使 Linux 标准化、支持其增长并促进其商业化采用。它促进开放或开源技术的采用。115
    亿行代码、235,000 多名开发者和 19,000 多家贡献公司构成了 Linux 会的权力和全球影响。Cloud Foundry、Delta Lake、Drone
    Code、Hyperledger Blockchain、Node.js 和 Open Chain 都是 Linux 基金保护下的知名项目。


    # Lite Coin (加密币)


    Litecoin (LTC 或 ₺) 是一种点对点的加密货币和 MIT/X11 许可下发布的开源软件项目。Litecoin 是比特币的早期分支或山寨币，于
    2011 年 10 月启动。Litecoin 由 Charlie Lee 在 2011 年 10 月 7 日通过 GitHub 上的开源客户端发布，他是一名
    Google 员工，后来成为 Coinbase 的工程总监。Litecoin 网络于 2011 年 10 月 13 日上线。它从 Bitcoin Core
    客户端分叉，并使用了比特币中的新算法 Scrypt SHA-256。


    # Liquidity_mining (流动性挖矿)


    流动性挖矿（或收益农）是 DeFi 的一项功能，允许人们在去中心化交易所（DEX）或 dApp 上存入（或“质押”）加密货币或代币以获得奖励。它被 Uniswap
    和 Compound 等 DEX 普及。交易通过流动性池内的代币交换进行。用户每次交易，用户将支付某些费用。自动做市商（AMM）收集费用并将其作为奖励授予流动性提供者。#
    Liquidity_pools (流动性池)


    流动性池是 DEX 的一项功能，允许人们在没有任何中间人的情况下进行相互交易。


    # Main_Net (主网)


    主网是一个术语，用于描述区块链协议完全开发并部署为活动网络，与测试网（Testnet）不同。主网上的加密货币交易正在广播、验证并记录在分布式账本技术上。主网是执行将数字货币从发送者传输到接收者功能的区块链。它还被视为项目的最终结果以及对各自区块链项目白皮书中所承诺的履行。


    # Market Cap (市值)


    市值（Market capitalization）是以美元金额或任何其他适用法币表示的公司的总市场价值。由于它代表了公司的市场价值，它是根据其加密货币的当前市场价格和流通中的发行发行总数计算的。Coinmarketcap.com
    跟踪几乎 5000 种加密货币的市值，以及 24 小时和 7 天的价格变化及其流通供应量。


    # Merkle Tree (默克尔树)


    默克尔树（也称为哈希树）是一种安全高效地加密大量数据的数据结构。它被表示为哈希树，其中每个叶节点都标记有数据块的加密哈希值，每个非叶节点都标记有其子节点标签的加密哈希值。哈希树是哈希列表和哈希链的推广，允许对大量数据进行验证。它们提供了对大量数据的安全高效验证。


    # Merkle Patricia Tree (默克尔帕特里亚树)


    Merkle Patricia 树（或称 Merkle Patricia Trie）是默克尔树的变体，由以太坊用于优化存储大量数据，包括保存状态的能力。Merkle
    Patricia 树旨在提供一种加密认证的数据结构，可用于存储所有的（键，值）绑定。它结合了 Patricia 树和默克尔树的特点。


    Patricia 树 是一种数据结构，也称为前缀树、基数树或字典树，通常用于实现路由表和用于路由器等低规格机器的系统。


    # Merkle Root (默克尔根)


    它是区块中包含的所有交易的哈希值的哈希。它是区块头的一部分。通过仅下载小的区块头和默克尔树，就可以建立交易已被区块链网络接受。无需下载整个区块链即可建立交易的有效性。


    # MetaMask (小狐)


    MetaMask 是由 Consensys 开发的软件加密货币钱包，用于与以太坊区块链交互。它有 Chrome、Firefox 和 Brave 的浏览器扩展，且仅支持以和
    ERC20。它不支持比特币交易。它允许用户通过普通网站执行以太坊交易。


    # Metropolis (大都会)


    Metropolis 是以太坊四个阶段中的第三阶段，位于 Frontier 和 Homestead 之后。它具有许多有趣的功能，例如：


    - ZK-Snarks（零知识非交互知识证明），允许验证者在不显式暴露信息的情况下建立主张的真实性。即它基于零知识证明。

    - 权益证明的早期实施

    - 智能合约的灵活性和健壮性

    - 账户抽象


    # Micro chain (微链)


    微链是侧链的一种变体，允许链上的资产传输到另一个区块链。实际上，资产并没有从一条链传输到另一个链。它们在原始链上锁定并在目标链上创建。它们还将共识规则和智能合约逻辑从一条链扩展到另一链。侧链与父链强耦合，并作为父链共识规则的完整验证者。


    # Micropayment (微支付)


    微支付是一种小额交易，通常在线上进行，可以小到一分分之一。取决于支付系统，“微支付”可以定义为任何小于 1.00 美元、5.00 美元或更多的交易大小。区块链技术让在线即时微支付的想法从死寂中复活，并提供了一种让这些小支付可行的新方法。区块链消除了高昂的交易费用使微支付成功。这已通过基于
    MakerDAO Dai 稳定币构建的会议币 BuffiDai 充分证明。它证明所有交易的处理成本仅为 0.20 美元，相比之下，如果商家接受信用卡支付，将产生
    2400 美元的成本。


    '
