  - '[PAGE 177]


    # EEA (Ethereum Enterprise Alliance)


    The Ethereum Enterprise Alliance (EEA) is a member-led industry organization whose
    objective is to drive the use of Ethereum blockchain technology as an open-standard
    to empower enterprises. It was launched in February 2017. The EEA''s mission is
    to deliver an open, standards-based architecture and specification to accelerate
    the adoption of Enterprise Ethereum. Its members include several organizations
    across the globe. Founding members and rotating board include Accenture, Banco
    Santander, BlockApps, BNY Mellon, CME Group, ConsensSys, IC3, Intel, JP Morgan,
    Microsoft and Nuco.'
  - '[PAGE 178]


    # EIP (Ethereum Improvement Proposals)


    EIP is an acronym for Ethereum Improvement Proposal, just as BIP is an acronym
    for Bitcoin Investment Proposal. The EIPs set the technical standards (protocol
    specifications, contract standards, client APIs etc.) for Ethereum blockchain.
    Martin Becze, Vitalik Buterin and Gavin Wood were the original EIP editors from
    2015 to end of 2016.'
  - '[PAGE 179]


    # ECC (Elliptic Curve Cryptography)


    It is Public Key cryptography based on elliptic curves over finite fields and
    their algebraic structure. They are able to provide same cryptographic strength
    as RSA encryption but with much smaller key sizes.'
  - '[PAGE 180]


    # ECDSA (Elliptic Curve Digital Signature Algorithm)


    ECDSA is a digital signature algorithm that makes use of ECC to create the key
    pairs used in the signing and verification process of digital signatures. Because
    of its advantages compared to other public-key algorithms, it is commonly used
    in blockchain applications to sign transactions or events.'
  - '[PAGE 181]


    # Encryption


    Encryption is the process of securing information through cryptography. Plain
    text is converted into an alternative form known as Ciphertext. Only parties possessing
    the keys will be able to convert ciphertext back into plain text for decrypting
    and reading the information. AES, Triple DES, RSA (Rivest-Shamir-Adleman), Blowfish
    and ECC are some of the leading encryption technologies.'
  - '[PAGE 182]


    # Enterprise Blockchain


    It''s a Blockchain network usually implemented by corporates or companies to manage
    their business processes like corporate finance, treasury, trade finance, insurance,
    supply chain, contracts management, international money remittances and global
    payments. Enterprise Blockchains are permissioned blockchains in nature where
    partners, peers or suppliers who intend to join the Blockchain, need prior approval
    from the company that has hosted or commissioned the Blockchain. The company hosting
    the Blockchain doesn''t control the Blockchain as all parties once they are admitted
    have equal rights and control of the network. R3, Ethereum Enterprise Alliance,
    Hyperledger Foundation are some famous organizations who are working on development
    of Enterprise Blockchain.'
  - '[PAGE 183]


    # EOA (Externally Owned Accounts)


    Externally Owned Accounts are controlled by private keys. A person possessing
    the private key of the account will be able to send cryptos (Ether in case of
    Ethereum) and messages from the account. It doesn''t have any associated code
    unlike the Contract Accounts (CA) that are controlled by code. Transaction Validation
    involves checking the timestamp and nonce combination to establish validity, and
    the availability of sufficient fees for execution.'
  - '[PAGE 184]


    # EOS Blockchain


    Entrepreneurial Operating System, (EOS) is a blockchain-based decentralized operating
    system that is designed to create, host and support secure, decentralized autonomous
    applications (dApps) and smart contracts. It was designed to meet large scale
    decentralized applications and developed by Daniel Larimer and Brendan Blumer.
    It was released as open source software by the company Block.one which distributed
    one billion tokens based on its native currency EOS.'
  - '[PAGE 185]


    An epoch is the target time period for which a given group of Miners is elected
    to serve as the consensus group. It also defines period of time taken for pre-specified
    number of blocks to be confirmed on the chain. In Ethereum Blockchain for every
    30,000 blocks, a new piece of data (a DAG) is used for mining new blocks. Each
    new group of 30,000 blocks is known as an epoch.'
  - '[PAGE 186]


    # ERC 20 (Ethereum Request for Comments - 20)


    ERC 20 is defined as the standard protocol for issuing tokens on the Ethereum
    network. According to the official sources, the protocol governs the tokens on
    the Ethereum blockchain. The suffix “20” is used for the sole purpose of representing
    the unique proposal ID. Developers use the ERC20 token to develop their project.
    It is a way to tokenize their project and at the the same time offers them a way
    to raise funds for their respective projects. ERC 20 defines six different functions
    for benefit of other tokens within the Ethereum system and has led to the birth
    of several alternate tokens (Alt Tokens) or Alternate Coins.'
