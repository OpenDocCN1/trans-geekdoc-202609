    NFT in sports, developed Flow. It came into existence when NFTs like Cryptokitties
    were choking Ethereum circa 2017.'
  - '[PAGE 207]


    # FOMO


    Fear-Of-Missing-Out is a phenomenon defined by a network effect that comes into
    play when many people from the community start showing interest towards a new
    product, entity, or process, and that''s when other ‘prospective users’ in the
    network start feeling the need to get onto the bandwagon, before it''s too late.
    Many products throughout history have gained tremendous traction in terms of pricing
    or demand owing to FOMO which is purely based on emotions rather than underlying
    valuations. Sudden increase in cryptocurrency prices, or sudden interest in a
    particular cryptocurrency and surge in its price is usually on account of FOMO.
    Crypto FOMOs have resulted in as high as 350% premium on Bitcoins.'
  - '[PAGE 208]


    # Fork


    A fork in a blockchain network happens when any changes to the underlying protocol
    take place or fundamental aspects pertaining to cryptocurrency need to change.
    There are two kinds of forks – Soft fork and Hard fork. Soft fork occurs when
    the change is backward compatible, and users only need to upgrade their software.
    Hard fork takes place when the change is not backward compatible, and the users
    have to move to the new chain or else take the risk of not being able to mine
    any blocks further. Hard forks usually arise on account of disagreements in the
    community with respect to proposed changes and their implementation. Bitcoin Cash,
    Bitcoin Gold and Ethereum Classic are examples of cryptocurrencies that have appeared
    owing to Hard Forks.'
