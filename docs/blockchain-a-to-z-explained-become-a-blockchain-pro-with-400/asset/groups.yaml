  - '[PAGE 153]


    # DDoS Attacks (Distributed Denial_of Service attacks)


    Distributed Network Attacks are often referred to as Distributed Denial of Service
    (DDoS) attacks. This type of attack takes advantage of the specific capacity limits
    that apply to any network resources – such as the infrastructure that enables
    a company''s website. The DDoS attack will send multiple requests to the attacked
    web resource – with the aim of exceeding the website''s capacity to handle multiple
    requests and prevent the website from functioning correctly. To preempt DDoS attacks
    crippling network infrastructure particular those that are architected on centralized
    infrastructure principles, decentralized infrastructures based on Distributed
    Ledger Technology are being considered to prevent single point of failure.'
  - '[PAGE 154]


    # DES (Digital Encryption Standard)


    The Data Encryption Standard is a symmetric-key algorithm for the encryption of
    digital data. Developed in the early 1970s at IBM and based on an earlier design
    by Horst Feistel, the algorithm was submitted to the National Bureau of Standards
    (NBS) following the agency''s invitation to propose a candidate for the protection
    of sensitive, unclassified electronic government data. In 1976, after consultation
    with the National Security Agency (NSA), the NBS selected a slightly modified
    version which was published as an official Federal Information Processing Standard
    (FIPS) for the United States in 1977. The original DES'' key size of 56 bits was
    sufficient when it was developed. To prevent successful brute force attacks on
    DES owing to increasing computational power, Triple DES (TDES) came into existence
    which applies DES algorithm three times to each data block. In May 2002, Advanced
    Encryption Standard (AES) replaced DES.'
  - '[PAGE 155]


    # De-Fi (Decentralized finance)


    Decentralized finance (commonly referred to as DeFi) is a blockchain-based form
    of finance that does not rely on central financial intermediaries such as brokerages,
    exchanges, or banks to offer traditional financial instruments, and instead utilizes
    smart contracts on blockchains, the most common being Ethereum. Maker, Uniswap
    and Compound are some of the leading DeFi services providers.'
  - '[PAGE 156]


    # Decentralisation


    In blockchain, decentralization refers to the transfer of control and decision-making
    from a centralized entity (individual, organization, or group thereof) to a distributed
    network. It facilitates Digitization of Trust where trust is contained in a distributed
    network rather than in a centralized party or entity. It provides trustless environment,
    promotes data reconciliation, minimizes points of failures and maximizes resource
    distribution.'
  - '[PAGE 157]


    # Delegated Proof of Stake (DPoS)


    Its similar to Proof of Stake since the validators of blocks in Blockchain are
    required to invest or stake cryptocurrencies on transactions to be validated.
    These validators are selected via voting by various token holders where votes
    are proportional to their stakes.'
  - '[PAGE 158]


    # Degen


    Refers to cryptocurrency projects that are involved in pumping and dumping schemes.
    Usually, worthless and junk tokens are hyped up in various communications channels
    and forums and they are abandoned later through Degens. Tendies, YFI and Yam have
    been considered as Degen projects.'
  - '[PAGE 159]


    # DevOps


    DevOps, a term coined in 2009 by Patrick Debois, is a complementary set of practices
    to Agile software development where development and operations teams remained
    separated and siloed. It aims to shorten the systems development life cycle and
    provide continuous delivery with high software quality by bringing these two teams
    together right from starting of the project. This replaced the Waterfall Software
    development model.'
  - '[PAGE 160]


    # DEX (Decentralized exchange)


    Crypto funds and balances are maintained by the users. DEX doesn''t have any custody.
    It promotes transactions between two parties using software tools, open blockchains,
    and internet. DEX is autonomous and run by algorithms and smart contracts. There
    are more than 35 DEXs like Dydx, Uniswap, Bancor, Changelly and BisQ.'
  - '[PAGE 161]


    # Diamond Hands


    It represents cryptocurrency traders or investors who keep holding onto their
    respective cryptocurrencies even when their price or value drops. They believe
    that such price drop is only temporary and will be corrected eventually.'
  - '[PAGE 162]


    # DIDs (Digital Identifiers Documents)


    DIDs are a type of identifiers that enable a verifiable, decentralized digital
    identity. They are based on the Self-Sovereign Identity paradigm. A DID identifies
    any subject e.g., a person, organization, thing, data model, abstract entity,
    etc. They obviate the need for a central administrative system to manage and control
    the identifiers and use cryptographic basis to provide Decentralized identification.
    DIDs are being promoted by World Wide Web Consortium (W3C) to develop next generation
    Web.'
  - '[PAGE 163]


    # DIEM


    Diem is a permissioned blockchain-based payment system proposed by Facebook, Inc.
    The plan includes a private stablecoin implemented as a cryptocurrency, with Diem
    pegged at a USD and was formerly known as Libra. This yet to come to to existence.'
  - '[PAGE 164]


    # Difficulty


    Difficulty is a number that regulates how long it takes for miners to add new
    blocks to the blockchain. In Bitcoin, it determines the difficulty level to mine
    a Block which is basically finding a hash below a particular target. High difficulty
    will result in more compute power to mine the blocks. Difficulty is adjusted after
    every 2016 blocks are mined, based on the time taken to find preceding 2016 blocks.
    In Bitcoin, a new block is created every 10 minutes, hence 2016 blocks will take
    exactly two weeks to be mined. Difficulty will be reduced if the previous 2016
