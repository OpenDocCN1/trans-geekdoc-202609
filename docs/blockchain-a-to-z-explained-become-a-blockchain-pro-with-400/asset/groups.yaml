    # 作者简介


    ## Rajesh Dhuddu


    Rajesh 是哥伦比亚商学院和 Sri Sathya Sai 高等学习学院的校友，拥有 MBA 金融金奖。在“永恒帮助，永不伤害”的人生格言的驱动下，Rajesh
    指导了许多企业家、企业高管和 MBA 学生。


    Rajesh 被 Forbes、Lattice8o、Thinkers360 认为是全球区块链思想领袖之一，并被世界经济论坛 (WEF)、印度工业联合会 (CII)、国家软件和服务公司联合会
    (NASSCOM) 以及特伦甘纳纳邦邦政府等多个行业机构认可。他为全球多家跨国和跨区域公司主导了多个区块链平台和解决方案，包括与印度三家领先电信公司和印度电信监管局合作，实施了全球性的多云区块链以阻止垃圾电话和短信。


    Rajesh 领导着价值 52 亿美元的巨头 Tech Mahindra 的区块链与网络安全业务。他还负责指导一个由 1000 多名高成就的网络安全专家组成的团队，赋能美国、欧洲中东及非洲
    (EMEA)、亚太地区 (APJ) 和印度的全球客户，加强其企业级网络安全态势并构建高韧性的安全组织。他与全球首席信息安全官 (CISO)密切合作，建议他们利用技术和运营方面的最佳实践，涵盖云安全、网络安全、高级威胁管理、零信任、攻击性安全、网络风险量化和
    SASE。


    **Linkedin ID:** https://www.linkedin.com/in/rajeshdhuddu/


    **Twitter ID:** https://twitter.com/rajeshdhuddu


    ## Srinivas Mahankali


    **LinkedIn ID:** https://www.linkedin.com/in/srinivasindia/


    Srinivas 是马德拉斯印度理工学院 (IIT Madras) 和班加罗尔管理学院 (IIM Bangalore) 的校友，拥有 30 多年的行业经验，其中
    12 年在印度私人和 BSE 上市公司领导 IT 解决方案。作为由 NASSCOM 和印度政府支持的组织 NISG 首批领导区块链工作的员工之一，他在印度政府推广区块链方面发挥了积极作用。


    作为印度首个大学认证的区块链研究生课程的项目主任，Srinivas 指导了全球 500 多名学生。他撰写了 10 多本关于区块链和新兴技术的书籍，其中包括世界上本由人工智能机器人从英文翻译成中文的书籍《区块链：未竟的故事》(Blockchain-The
    Untold Story)。他还编写了《非 IT 专业人士的区块链》、《区块链与智慧城市》等书籍。


    # 致谢


    我们要感谢父母、家庭成员、同事和朋友，他们为我们提供了巨大的支持并激励我们创建这份优秀的资源。


    感谢所有的贡献者和评审员，他们投入了无数小时汇集各种术语并审查我们的解释。


    我们向 BPB 团队（ Manish Jain、Varun Jain、Nrip Jain 等）表示感谢，他们完全支持了本书的出版。


    我们已尽力列出了下方所有姓名。万一遗漏了任何人的名字，我们对此类遗漏表示歉意，这可能是无意的，或者是由于我们的记忆力。


    # 家庭成员


    Dr Padmanabhaiahia, D Paravatavardhani, DSK


    ## 行业同事


    Dr Padmanabhaiahia, D Paravatavardhani, DSK


    ## 贡献者与评审员


    IAS, Santosh Mishra, Ramadevi Lanka, Pankaj Diwan, Prasanna Lohar, Julian Gordon


    ## 社区贡献者


    作为本书在 LinkedIn 上预发布公告的一部分，我们开展了一项活动，让网络成员猜测我们尚未涵盖和解释的区块链术语


    # 前言


    得益于对比特币（区块链首次成功的商业实施）的关注，区块链正在吸引全球大众的注意力。区块链在公共和企业领域的应用正在飞速增长。


    虽然已有许多书籍、在线课程和认证计划形式的资源可以帮助人们理解区块链及其案例，但解释区块链关键术语和词汇的资源非常有限。因此，我们付出了巨大的努力，扫描区块链的历史，追踪区块链的演变，挖掘频繁和罕见使用的术语并对其进行清晰解释。


    我们的努力结果是汇集了 400 多个术语（是的，你没没错），并以简单易懂的方式对其进行解释。


    我们预计这本书是其他在线或线下资源的综合汇编，那些资源最多涵盖 30 到 50 个术语。


    从本质上说，我们的书提供了那些资源10 倍的价值。


    这本书还认可并解释了区块链的主要贡献者、前 20 大加密货币以及领先的区块链协议。难怪我们认为，本书读者通过吸收书中从 A 到 Z 列出的术语，将从区块链小白毕业为区块链专家。


    我们承诺，通过在后续版本中纳入在地平线上出现的新术语和名词，这本书在未来几年中将继续是一份宝贵的资源。


    祝阅读和分享愉快！！！


