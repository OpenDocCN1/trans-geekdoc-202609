    ## Vitalik Buterin


    Vitalik Buterin is the Co-founder and creator of Ethereum. He was initiated into
    the world of Cryptocurrencies as Co-Founder of Bitcoin Magazine in 2011. He launched
    Ethereum with Gavin Wood in 2014. He is also known for his philanthropy and donated
    over USD 1.5 billion worth of cryptos to various institutions and foundations.


    ## W3C (World Wide Web Consortium)


    Founded in 1994 and led by Tim Berners Lee, who invented World Wide Web, W3C is
    working on developing standards for World Wide Web. These Open Standards are accessible
    to all so that Web can function as One Web and drive innovation for Humanity.
    W3C works on design principles that promote: 1. Web for All (benefits available
    to all regardless of hardware, software, native language, physical or mental ability)
    and 2. Web on Everything (Web being accessed by mobile phones, smart phones, kiosks,
    interactive voice response systems and others).


    ## Wallet


    A wallet is an app that allows cryptocurrency users to store and retrieve their
    digital assets. The five main types of cryptocurrency wallets include mobile,
    desktop, paper, hardware, online and mobile wallets.


    ## Web3.js


    It refers to collection of libraries that allow users to interact with local or
    remote Ethereum node using HTTP, WebSocket protocols or JSON Remote Procedure
    Call (RPC). Created by Ethereum Foundation, it facilitates retrieving user accounts,
    sending transactions and interacting with smart contracts.


    ## Web_of_Trust


    A web of trust is a concept used in PGP (Pretty Good Privacy). Initially a concept
    created by Phil Zimmerman, GnuPG (GNU Privacy Guard), and other OpenPGP-compatible
    systems to establish the authenticity of binding between a public key and its
    owner. It uses trust model in a decentralized way and is positioned as good alternative
    to centralized trust model of Public Key Infrastructure (PKI) that is dependent
    on Central Authority.


    ## Web3


    Web3 can be mentioned as a revolution of Internet Backend while Web2 was a front-end
    revolution. It is a set of protocols led by blockchain, that intends to reinvent
    how Internet is wired in the backend, combining the logic of Internet with the
    logic of the computer. It empowers users to control their data and also create
    a native settlement layer. It brings in a right to forget and delete on the Internet.


    ## Wei Dai


    Wei Dai is a computer engineer and famous cypherpunk known for contributions to
    cryptography and cryptocurrencies. He was a programmer at Terra Sciences and part
    of Cryptocurrency Research Group at Microsoft. He developed the Crypto++ cryptographic
    library, created the b-money cryptocurrency system, and co-proposed the VMAC message
    authentication algorithm. He also contributed to SSH2 vulnerability discovery
    by identifying loopholes in Encryption Block Chaining.


    ## Wei


    Wei is the smallest denomination of ether, the cryptocurrency coin used on the
    Ethereum network. One wei is one quintillionth of an ether. Wei is named after
    the Computer Engineer Wei Dai who is known for his contributions to the world
    of Cryptography and Cryptocurrencies.


    ## Whale


    Whale refers to individuals or entities that hold large amounts of bitcoin. With
    their large cryptocurrency holdings, they have the potential to manipulate currency
    prices and valuations. Barry Silbert, Tim Draper, Michael Novogratz, Tyler & Cameron
    Winklevoss are some well-known Bitcoin whales


    ## When Lambo


    It''s a slang that is used to represent a cryptocurrency’s success. When a new
    crypto-coin or token is launched, this question ‘When Lambo’ is asked to denote
    the time at which the coin’s price will be worthy enough to buy the car Lamborghini.


    ## Whisper


    Whisper is a part of the Ethereum P2P protocol suite that allows for messaging
    between users via the same network that the blockchain runs on. It is a pure identity-based
    messaging system which provides a simple low-level API without being based upon
    or influenced by the low-level hardware attributes and characteristics.


    ## World State


    World State is a key-value store which is updated as a result of transactions
    and chaincode execution. It is a component of Hyperledger Fabric Ledger. It represents
    the latest values for all keys included in the chain transaction log. The world
    state will change every time the value of a key changes.


    ## Wrapped Bitcoin


    Wrapped Bitcoin (WBTC) is an ERC-20 token that represents Bitcoin (BTC) on Ethereum
    blockchain. Integration into the world of Ethereum wallets, dapps, and smart contracts
    is facilitated by WBTC. In essence, Wrapped Bitcoin allows Bitcoin holders to
    tokenize their coins on Ethereum and they are matched by equal number of WBTC
    tokens.


    ## Wrapped Coins


    They represent tokenized version of other cryptocurrencies and address limitations
    pertaining to interoperability between two different blockchains. Wrapped coins
    exist on Blockchains that were not used to issue them initially. Eg: Wrapped Bitcoin
    and Wrapped Ether. Wrapped coins help in increasing liquidity of centralized and
    decentralized exchanges.


    ## WASM (Web Assembly)


    Web Assembly is a binary instruction format for a stack-based virtual machine.
    Wasm is designed as a portable compilation target for programming languages, enabling
    deployment on the web for client and server applications.


    ## XRP


    XRP is a digital asset built for payments by Jed McCaleb, Arthur Britto and David
    Schwartz. It is the native digital asset on the XRP (Ripple) Ledger. Ripple began
    selling XRP in 2012. Its intent was to allow financial institutions to transfer
    money with negligible fees and wait time. Always positioned as a replacement for
    SWIFT by removing the settlement layer between major financial institutions.


    ## YAC (Yet Another Consensus)


    It''s a novel and viable Practical Byzantine Fault Tolerant consensus algorithm
    based on modular architecture and simple implementation basis called Yet Another
    Consensus. It has been implemented in Hyperledger Iroha Blockchain platform and
    has helped in achieving low latency and a very high transaction throughput for
    transactions.


    ## YAML (Yet Another Markup Language)


    YAML, first proposed by Clark Evans in 2001, is a Markup and Data serialization
    language that came into existence in 2001. YAML is an alternative to JSON that
    formats data in a natural, easy to read and concise manner. Its not a programming
    language in the true true sense. YAML files store information and doesn''t include
    actions and decisions. It was released in an era that had proliferation of various
    mark-up languages like HTML, XML and SGML. Later, YAML was recoined as YAML Aint
    Markup Language.


    ## Yield Farming


    Any effort to deploy crypto assets to generate maximum returns through them is
    called Yield Farming. It opens up new price arbitrages and also involves lending
    crypto assets or holdings through DeFi protocols to earn fixed or variable returns.


    ## YFI (Yearn Finance)


    It is a gateway to a range of yield generating products in the Ethereum ecosystem.
    It interfaces with all of DeFi investment avenues like lending aggregation, yield
    generation and insurance. It has a native coin called as YFI coin.


    Zcash is the first crypto currency in the world to use Zero Knowledge Proof (ZKP)
    through zk SNARKS and provide enhanced privacy to its users. It doesn’t make every
    transaction detail public, which is the case with most of other cryptocurrencies.
    Zcash is based on Bitcoin''s codebase. In 2013, Matthew Green, Ian Miers and Christina
    Garman from Johns Hopkins University came up with Zerocoin, a proposed privacy
    extension to Bitcoin. Alessandro Chiesa, Eli Ben Sasson, Eram Tromer & Madars
    Virza joined the founding team later. The Zero Coin Electronic Company was formed
    in 2015 to work on and deliver proposed privacy extensions. Zcash Foundation was
    launched in 2017. Zcash shares many similarities with Bitcoin such as a fixed
    total supply of 21 million units.

