    # 前言


    C.P. Gurnani


    Tech Mahindra 董事总经理兼首席执行官


    毫无疑问，区块链是全球每一位首席执行官都在关注的技术。没有其他新兴技术能像区块链在近年来引发的如此巨大且具有颠覆性的关注。这既是因为比特币（区块链技术的首个商业化应用），也是因为其在改变我们日常生活的众多业务流程和服务方面具有天生的巨大潜力。


    在加密货币世界，区块链不仅催生了比特币网络，还孕育了以太坊、Ripple、莱特币（Litecoin）等其他许多正在改变世界的加密货币。区块链还触发了根本性的新应用和业务模式的出现，例如非同质化代币（NFTs），它开启了加密货币或数字收藏品的新趋势。


    在企业级应用领域，区块链展示了其转型以下领域的潜力：


    - 供应链：使其具有反脆弱性；

    - 支付与国际汇款：通过稳定币和央行数字货币（CBDC）；

    - 贸易融资：赋能网络执行自动化且不可篡改的发票折扣贴现；

    - 数字身份：通过自主主权身份（Self Sovereign Identities）确保其安全；

    - 媒体与娱乐业：通过配置自执行的合约与权利管理。


    在政府对公民（G2C）服务中，区块链在促进福利管理、权属管理乃至选举与投票管理中急需的透明方面展现了巨大潜力。


    预见到这些变革性趋势，我们在 2018 年 5 月在 Rajesh 的卓越领导下，正式在公司启动了区块链业务部门。他是公司内部所有区块链事务的“首选专家”。


    我个人认为，Rajesh 拥有一种在混乱和不确定的情况下创造价值的独特特质。在区块链早期，技术的采纳尚不明朗，因为全球监管机构每个月都在支持或禁止加密货币，而且区块链当时仅涉及加密货币。尽管如此，Rajesh
    和他的团队能够带来一种愿景，为我们全球的客户寻找实用且有意义的应用。2019 年，TRAI UCC 规程是 Tech Mahindra 区块部门的一个决定性时刻。在一个充满该技术怀疑者和批评者的世界里，Rajesh
    不仅领导了自己的团队，还领导了印度电信生态系统中的技术和业务代表，建立了全球最大的多云区块链网络，以保护终端客户免受商业电话和短信的干扰。


    我很自豪地说，我们的区块链能力因通过研究和执行大型项目所创造的投资、领导力和知识产权而获得了全球认可。我最珍视的认可是 Tech Mahindra 入选“2021
    年福布斯全球50 强区块链公司”。其他认可还包括第六届年度 NASSCOM 技术奖和 Hyperledger 认证服务提供商标识。


    对于 Rajesh 来说，回馈社会与创造收入同样重要。我乐于投入他关于区块链技能开发和增强的想法。事实上，在他在 TechM 任职的前 180 天内，Rajesh
    就在印度多地举办了 8 多场 Hyperledger Fabric 和 Corda 课堂培训，吸引了 350 多名技术参与者。他还领导了与特伦甘纳邦政府合作的区块链区的建立与执行，用于区块链政策和初创生态系统的开发。


    看到他通过这本书继续他的旅程，贡献区块链知识知识，我感到非常高兴。我相信这是一本包含 400 多个术语和区块链词汇的独特作品，而且是全球首创。


    这本书不仅是 Rajesh Dhuddu 和合作者 Srinivas Mahankali 努力的结晶，来自我们区块链团队成员 Amey Rajput、Dhen
    Dhulla 和 Aman Malhotra 的积极投入和贡献。


    我对比 Rajesh 作为区块链领导者的押注取得了良好结果，我相信他及团队书中的工作对于所有渴望进阶学习并精通区块链的人来说，将是一次充实知识的读物。


    # 《区块链 A 到 Z 详解》的赞誉与评论


    对于想要学习区块链的人，或对于已经在行业内寻求扩展知识的人来说，这是一本必不可少的词汇表。Rajesh 和团队涵盖了从空投（Air Drops）到零知识证明（ZKPs）的所有内容。你很快就能向同事和朋友讲述熊鲸（Bear
    Whales）和区块奖励（Block Rewards）；狗狗（Doges）和去中心化身份（DIDs）；哈希（Hashing）和持币（HODLing）的故事……你懂意思的。如果有人在读这本书之前就
    100% 了解这些术语，请直接把他们推给我！


    Anthony Day, IBM 区块链合作伙伴


    区块链知识体系增长得非常快。每天都有新的进展、技术进步，当然还有新词汇的出现。为了跟上这一切，易于理解技术术语是至关重要的。事实上，我一直在寻找一本可以参考的书，就像过去美好时代的字典一样，能够清晰易懂地解释一切。我非常高兴，我对这种宝贵资源的寻找以这本书画上了句号。


    Tina Singh, 马德拉金融首席数字官


    区块链是数字化转型的重要驱动力。要充分理解其作用，理解其概念、最新进展和术语是必要的。这本书将帮助所有区块链学习者——无论学生还是专业人士——克服对区块链术语理解的匮，从而促进对该学科的良好学习和掌握。


    # Srinivas Pingali 博士 – 印度理工德达普尔管理学院 实践教授


    区块链处于第四次工业革命的前沿。然而，要理解“为什么”，首先必须理解“是什么”。理解“什么”很大程度上取决于对各种区块链词汇和术语的理解。这本书正是如此，以全面且引人入胜的方式解释了一切。通过从噪音中分离信号，Rajesh
    和 Srinivas 为读者提供了一个全面的参考工具，不仅让他们欣赏这项颠覆性技术的“构建块”，而且理解其意义和影响。


    Purushottam Kaushik – 世界经济论坛第四次工业革命中心，印度


    区块链是过去十年最具颠覆性的技术。然而，许多与区块链相关的概念仍然难以理解。有很多术语对于软件开发人员和 IT 专业人士来说可能是陌生或外星的。这本书为所有区块链术语提供了简单的解释。我深信这本书将使企业更广泛地采用区块链技术。对于任何兴趣了解更多区块链应用案例的人来说，这是必读的。


    Ted Kim, 三星 SDS 副总裁


    自2008年比特币作为第一个商业应用以来，区块链持续在各个行业和地区占据头条。这引入了新的区块链术语和复杂的词汇，并随着时间的推移不断增加。这本杰作将让你面面俱到。从学习“Bakong”到“熊鲸”，再到“原子交换（Atomic
    Swaps）”等许多内容，你禁会对用简单易学语言解释的术语和主题之详尽感到赞叹。我毫不相信这本词典会让读者在最短的时间内成为最聪明的区块链极客。


    确实，这本书将成为你获取所有“区块链”内容的权威来源。


    Rajesh Chandiramamani, Tech Mahindra 数字业务高级副总裁


    '
