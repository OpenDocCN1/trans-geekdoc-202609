    # 关于 A2Z 词汇表的进评论


    Lisa Short 教授


    DUniv., Grad. Cert Sc., Tch T&D, Dip. T&A Sys., Adv. Dip. OHS, BA（经济学、地理、财务管理）Dip.
    Ed.


    P&L Digital Edge Ltd [英国] 与 Mind Shifting 创始人


    数字化变革的速度如此之快，以至于我们现在的“革命”发生的时间比一个世代还要短。区块链是第四次工业革命的基础技术，它将我们推向社会 5.0，并进入了一条令人眩晕的转型曲线；对于某些行业来说，这种速度比一年前快了四十倍。它与人工智能和万物互联一起，标志着网络从基于我们连接和传输信息的简单网络，转变为具有价值传输能力的智能网络。这不仅关乎速度和效率，更关乎行为的改变，关乎重新定义和设计我们开展业务以及生活的方式。


    区块链关乎信任的价值化。它诞生于 2008 年全球金融和信任危机之后，已成为一个奇新世界的基石。在这个世界里，我们用一种坦率说许多人并不理解的技术，取代了我们基本的治理和保障感。但区块链技术是一种赋能手段，成为包容性的引擎，支持着包括气候变化和不平等在内的我们的经济和社会系统。它可以为超过
    20 亿无法参与金融体系的人提供身份。通过这种方式，它将碎片化的社区转化为受过教育、财务包性的“思考者和行动者”，他们可以改变国家并支持他们的未来。


    如果人们不理解区块链，就无法利用它赋能我们的能力，或许更重要的是，我们也无法赋能它。影响者、行业领袖、教育工作者以及像我及本书作者这样拥有信誉的专家——我们汇聚了经验、务实主义和开发诀窍的知识——负责以这种方式分享我们的智慧，使应用变得无处不在。


    智慧并非缺乏好奇心、努力、终身学习以及看到技术效益发展的喜悦。我并非天生的数字原生。我记得在 20 世纪 90 年代为孩子们买第一台电脑，打开电源看到基于
    DOS 的计算系统闪烁着绿色的“折号”，心想：这太棒了，现在我该怎么办？坦率地说，我完全没头绪。我认识的人都在同一个境地，所以我们一起在摸着石头过。重点是，我们确实做到了，并且不断学习，通过试错，甚至在拨号上网、软盘驱动器、光驱驱动器、USB
    盘和 CD 光中挣扎前行。苹果变成了电脑而不再是水果，从砖头变成了必不可少的口袋大小配件，笔记本电脑变成了离开办公桌也能赋能生活的工具。


    就在几年前，我记得曾联系一位同事问他们这玩意儿到底是什么。那是首次代币发行（ICOs）的时代，社交媒体和开发者网络上有大量的技术闲谈。那里存在着庞大且似乎无止尽的新术语词汇、单词和流程，这让我感觉自己正处在卡夫卡式的噩梦中，经历着我以来最糟糕的冒充者综合症，因为我又回到了那种完全一所不知的状态。对区块链潜力的沉思被失败的
    ICO 炒作和加密货币的爆发式增长所掩盖。这绝不是这项惊人技术应有的优雅介绍，它造成了大量的混乱、错误信息和误解。


    如果我能有一份资源，简单地解释任何名称、术语、缩写（其中有数百个）和流程，将会让我的旅程轻松得多。这本书正是这样做的。它不仅仅是一本清单式的参考书，它代表了作者在行业多年宝贵经验、学习和合作的本体论，使得可以在一个地方获得对区块链的清晰语境理解。如果有人能理解这种语言，他们就会知道如何提问以被纳入其中。


    Rajesh Dhuddu 被公认为让区块链对普通人产生了意义。Srinivas Mahankali 专注于在全球范围内实现区块链的易于采用。他们的经验、思想领导力和技术实力共同是我们道路最初交汇的原因。但正是他们项目交付对社会的影响以及这种跨学科的方法，让我意识到这本区块链
    A 到 Z 是一本像他们一样务实的词汇表，并且是一份**每位业务决策者、学生、家长、领袖、教育工作者和记者都应该视为“必备”的资源**。我坚信，在炒作和错误信息被纠正、术语被理解之前，启蒙水平的垂直增长是不可能发生的。教育和获取可靠资源是采纳区块链的大门钥匙。


    不到 3% 的高级学术人员、政府决策者和董事会成员拥有科技知识，而其中了解区块链的更是寥寥几。引用法国经济部长布鲁诺·勒马尔（Bruno Le Maire）的话：“我知道大多数谈论区块链的人对此一无所知。”没有比这更贴切的话了。这本书为他们，以及占全球经济
    99% 的所有中小企业提供了一个从 POET 到巨鲸（whale）等一切内容的简单解释汇总，以消除行业中即使是我们最优秀的人也会困惑的晦涩语言。


    《区块链 A 到 Z》是一本重要的参考书，因为区块链术语可能变得异常复杂且极其困难。这成为了导航这一基础技术兴奋前沿的障碍，在这一领域，我们可以嵌入创新的想法和解决方案，创建一个以人为本的智能社会。区块链不仅是一种技术，它更是一种哲学，如果你希望未来的系统为你服务，每个人都需要了解它可能影响的系统性变化以及它可以颠覆的行业。


    Lisa Short 教授因在区块链、加密资产和教育技术（EdTech）领域的工作被认为是全球前 150 位思想领袖以及全球前 50 位关注领袖和影响力人物之一，是数字技术生态系统的驱动力。


    # 勘误


    我们对 BPB Publications 的工作感到非常自豪，并遵循最佳实践确保内容的准确性，为订阅者提供愉悦的阅读体验。我们的读者是我们的镜子，我们利用他们的反馈来反映并改进出版过程中可能发生的人为错误（如果有）。为了让我们保持质量并帮助我们联系可能因任何不可见错误而遇到困难的读者，请通过以下邮箱与我们联系：


    errata@bpbonline.com


    BPB Publications 全体非常感谢您的支持、建议和反馈。


    您知道 BPB 提供了可用的 ePub 文件版本的电子书吗？您可以在 www.bpbonline.com 升级到电子书版本，作为纸质书客户，您有权获得电子书折扣。请联系
    business@bpbonline.com 了解更多详情。


    在 [此处] 处还可以阅读免费技术文章集，订阅一系列免费新闻邮件，并接收 BPB 书籍和电子书的专属折扣和优惠。


    # BPB 正在寻找像你这样的作者


    如果你有兴趣成为 BPB 的作者，请访问 www.bpbonline.com 并于今天申请。我们已与成千上万像你这样的开发者和技术专业人员合作，帮助他们与全球技术社区分享见解。你可以提交通用申请，申请我们正在招募作者的特定热点话题，或提交你自己的想法。


    本书的代码包也托管在 GitHub 上，以防代码有更新，它将在现有的 GitHub 仓库中更新。


    我们从丰富的书籍和视频目录中还有其他代码包可供选择。查看它们！


    # 盗版


    如果您在互联网上发现任何形式的我们作品的非法副本，如果您能向我们提供地址或网站名称，我们将不胜感激。请通过 business@bpbonline.com 联系我们并附上材料链接。


