    # Satoshi


    A Satoshi is the smallest unit of a bitcoin, equivalent to 100 millionth of a
    bitcoin. Bitcoins can be split into smaller units to facilitate smaller transactions
    or micro payments. It has been coined in the honor of Bitcoin’s founder - Satoshi
    Nakamoto.'
  - '[PAGE 382]


    # Satoshi Nakamoto


    Satoshi Nakamoto is the name used by the presumed pseudonym person or persons
    who developed world''s first decentralized cryptocurrency called Bitcoin using
    Blockchain or Distributed Ledger Technology. Satoshi Nakamoto authored the Bitcoin
    white paper called ''Peer-to-Peer Electronic Cash System'', created and deployed
    Bitcoin''s original implementation. As part of the implementation, Nakamoto also
    devised the first blockchain database and mined first Bitcoin. It is estimated
    that Satoshi Nakamoto possesses 1 million Bitcoins.'
  - '[PAGE 383]


    # Sawtooth


    Hyperledger Sawtooth is an open-source enterprise blockchain-as-a-service platform
    that can run customized smart contracts without the need to know the underlying
    design design of the core system. It uses Proof of Elapsed Time (PoET) consensus
    mechanism and allows smart contract development using Python, Javascript, Rust,
    Go & C++ languages. It can be deployed as Permissioned or Permissionless Blockchain.
    Intel, T Mobile, IBM and Amazon Web Services (AWS) are major users of Sawtooth.'
  - '[PAGE 384]


    # Schnorr


    A Schnorr signature is a digital signature produced by the Schnorr signature algorithm
    that was described by Claus Schnorr. It is a digital signature scheme known for
    its simplicity, whose security is based on the intractability of certain discrete
    logarithm problems. It is efficient and generates short signatures. It was covered
    by US patent, which expired in 2 years on Feb 2008. It is used to implement ‘Proof
    of Knowledge’'
  - '[PAGE 385]


    # Scrypt


    Created by Colin Percival, it''s a password based key deciphering interpretation
    algorithm. It was originally used to make large scale hardware attacks unviable.
    Authorized users need to perform only once while authentication, however a brute
    force attacker will need to perform the operation billion times within the given
    time interval making the attack unviable and unsuccessful. Scrypt algorithm has
    been designed in such a way that it uses large amount of memory unlike other password
    Key Derivation Functions (KDF) like PBKDF2. Many cryptocurrencies like Litecoin,
    Dogecoin, Viacoin and Gulden have adopted simplified version of Scrypt for Proof
    of Work based consensus in their respective protocols.'
  - '[PAGE 386]


    # SDK (Software Development Kit)


    A software development kit (SDK) represents set of tools and programs provided
    by vendors to help developers and build applications for various uses. SDKs are
    usually associated with mobile apps. Eg: Android tool kit is used to build Android
    apps and iOS SDK is used to build Apple apps. APIs, Integrated Development Environment,
    tools pertaining to building, running, testing and debugging are included in SDKs.
    There are over 1000 SDKs available to build Blockchain and Cryptocurrency applications.
    Eg: Hyperledger Fabric SDKs, Corda Token SDK and Cosmos Ethereum Virtual Machine
    SDK.'
  - '[PAGE 387]


    # SegWit (Segregated Witness)


    SegWit refers to process changes made in Bitcoin regarding storage of transaction
    data by increasing the Block size, it was accomplished by removing signature data
    from bitcoin transactions. When certain parts of a transaction are removed, it
    frees up space or capacity to add more transactions to the chain.


    It went live in August 2017 after being released in 2015. It also helped to fix
    tampering in Bitcoin transaction ids, that was possible earlier. SegWitX was a
    proposal to increase Bitcoin''s block size from 1 MB to 2MB. SegWitX developers
    wanted to hard fork the Bitcoin to carry out these changes but abandoned it, owing
    to lack of consensus.'
  - '[PAGE 388]


    # Self-Destruct


    It is a function provided on Ethereum network where self-destruct smart contract
    when triggered, destroys the contract. It is useful in cases of attacks, where
    self-destruct function removes smart contract from Ethereum and transfers Ether
    to the owner’s address. Majority of developers use self-destruct function to deploy
    an updated contract after destroying the old contract.'
  - '[PAGE 389]


    # Self-Executing


    Smart contracts are self-executing contracts. They contain terms and conditions
    of an agreement which are embedded into the software code and are replicated amongst
    peers in the Blockchain network.'
  - '[PAGE 390]


    # Serenity


    Ethereum 2.0 version is referred as Serenity. It is an upgrade of existing Ethereum
    on the main net. New features include implementation of sharding to facilitate
    replacement of Proof of Work (PoW) consensus with Proof of Stake (PoS), leading
    to an increase in transaction speeds. Serenity will be launched in three phases
    with third phase implementation to be completed by mid of the year 2022. Topaz,
    Rinkeby, Medella, Zinken are some of the test networks of Serenity.'
  - '[PAGE 391]


    # Serpent


    In encryption standards, Serpent refers to block cipher application that came
    second to Rijndael in Advanced Encryption Standard (AES) Contest. It was developed
    by Lars Knudsen, Ross Anderson and Eli Biham. Serpent has a block size of 128
    bits and supports key sizes of 128, 192 and 256 bits. In Blockchain world, Serpent,
    developed by Vitalik Buterin, refers to programming language that is used to write
    smart contracts in Ethereum. It is very similar to Python. It was deprecated as
    Vitalik believed that its technology has become outdated, hence has security concerns.'
  - '[PAGE 392]


    # SGX (Software Guard Extension)


    Intel introduced SGX in 2015 and it represents security set instructions baked
    into Intel''s x86 based Central Processing Units (CPUs). SGX facilitates better
    protection of user''s sensitive information by splitting computer''s memory into
    enclaves. Enclaves are private and predefined areas in memory. For Blockchain,
    SGX delivers enhanced privacy and security to protect the transactions and also
    helps in increasing consensus efficiency and throughput.'
  - '[PAGE 393]


    # SHA (Secure Hash Algorithm)


    Created by National Security Agency in 2001 for use in digital signatures. It
    is well adopted by Public Key Infrastructure market for digital signatures. It
    is widely used in security applications and protocols including TLS, SSL, PGP,
    SSH, IPsec, and S/MIME. SHA – 256 algorithms are used in blockchain to get a constant
    hash of 256 bits every time. This algorithm is also a part of encryption technology.'
  - '[PAGE 394]


    # Sharding


    Sharding is a database architecture technique that results in horizontal partitioning
    of data contained in a database. It is the practice of separating one table''s
    rows into multiple different tables, known as partitions. In Blockchain, sharding
    is used to increase transaction speed by splitting Blockchain into small sections
    called as Shards. Each Shard will have its own set of account balances and smart
    contracts. Each node will have only a part of data on the Blockchain and not entire
    information. Zilliqa is the first public blockchain to implement sharding.'
  - '[PAGE 395]


    # Shill


    A sh is a person who publicly helps or provides credibility to a person or an
    organization without disclosing that they have a close relationship with them.
    Shill in cryptocurrency refers to a person holding some cryptocurrency and trying
    to promote that particular coin or token brand to increase its price and sell
    their holdings to book profits. John McAfee is considered to be a well-known Shill
    in the cryptocurrency world.'
  - '[PAGE 396]


    # Side Chains


    Sidechain is a secondary blockchain connected to the main blockchain with a two-way
    peg for exchange of transactions from main chain to side chain and vice versa.
    They provide efficiency and scalability to mainchain. Sidechains may have their
    own consensus protocols, which may be completely different from the mainchain''s
    protocol. The two-way peg also enables interchangeability of assets from one blockchain
    to another securely at a predetermined rate.'
