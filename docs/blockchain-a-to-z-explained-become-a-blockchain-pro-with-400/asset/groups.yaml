    # 聪 (Satoshi)


    聪（Satoshi）是比特币的最小单位，相当于比特币的亿分之一。比特币可以被分成更小的单位，以便于小额交易或微支付。该术语是为了纪念比特币创始人——中本聪（Satoshi
    Nakamoto）而命名的。


    # 中本聪 (Satoshi Nakamoto)


    中本聪是假定使用区块链或分布式账本技术开发世界上首个去中心化加密货币——比特币的个人（或人员）所使用的化名。中本聪撰写了名为《点对点电子现金系统》的比特币白皮书，创建并部署了比特币的原始实现。作为实现的一部分，中本聪设计了第一个区块链数据库并挖了第一个比特币。据估计，中本聪拥有
    100 万枚比特币。


    # 锯齿 (Sawtooth)


    Hyperledger Sawtooth 是一个开源的企业级区块链即服务平台，可以在无需了解核心系统底层设计的情况下运行自定义的智能合约。它使用等待时间证明（PoET）共识机制，并允许使用
    Python、Javascript、Rust、Go 和 C++ 语言开发智能合约。它可以被部署为许可链或无许可链。Intel、T Mobile、IBM 和亚马逊云服务（AWS）都是
    Sawtooth 的主要用户。


    # 施诺 (Schnorr)


    Schnorr 签名是由 Claus Schnorr 描述的 Schnorr 算法生成的数字签名。它是一种以简单著称的数字签名方案，安全性基于某些离散对数问题的不可解决性。它非常高效且能生成短签名。它曾受美国专利保护，该专利已
    2008 年 2 月过期。它被用于实现“知识证明”（Proof of Knowledge）。


    # Scrypt


    Scrypt 由 Colin Percival 创建，是一种基于密码的密钥解密解释算法。它最初用于使大规模硬件攻击变得不可行。授权用户在验证时仅需执行一次操作，但暴力攻击者需要在给定时间间隔内执行数十亿次操作，使得攻击变得不可且失败。Scrypt
    算法的设计使其使用大量内存，这与 PBKDF2 等其他密码派生函数（KDF）不同。Litecoin、Dogecoin、Viacoin 和 Gulden 等许多加密货币在各自的协议中采用了简化版的
    Scrypt 作为基于工作证明的共识。


    # SDK (软件开发工具包)


    软件开发工具包（SDK）代表了供应商提供的工具和程序集，旨在帮助开发者为各种用途构建应用程序。SDK 通常与移动应用相关联。例如：Android 工具包用于构建
    Android 应用，iOS SDK 用于构建 Apple 应用。SDK 包含了与构建、运行、测试和调试相关的 API、集成开发环境（IDE）以及工具。有
    1000 多个 SDK 可用于区块链和加密货币应用程序。例如：Hyperledger Fabric SDK、Corda Token SDK 和 Cosmos
    以太坊虚拟机 SDK。


    # SegWit (分离见证)


    SegWit 指的是比特币在增加区块大小方面对交易数据存储所做的更改，这是通过从比特币交易中移除签名数据实现的。当交易的某些部分被移除时，它释放了空间或容量，以便在链中添加更多交易。


    它在 2015 年发布后于 2017 年 8 月上线。它还帮助修复了此前可能的比特币交易 ID 改改问题。SegWitX 是一项将比特币区块大小从 1MB
    增加到 2MB 的提案。SegWitX 开发者曾想硬分叉比特币来执行这些更改，但由于缺乏共识而放弃了该计划。


    # 自毁 (Self-Destruct)


    这是以太坊网络提供的一个函数，当自毁智能合约被触发时会销毁该合约。它在攻击情况下非常有用，自毁函数可以从以太坊中移除智能合约并将 Ether 转移到所有者的地址。大多数开发者使用自毁函数在销毁旧合约后部署更新后的合约。


    # 自执行 (Self-Executing)


    智能合约是自执行的合约。它们包含了协议的条款和条件，这些条款被嵌入到软件代码中，并在区块链网络的节点之间复制。


    # 宁静 (Serenity)


    以太坊 2.0 版本被称为 Serenity。它是主网上现有以太坊的升级。新功能包括实现分片，以便用权益益证明（PoS）共识取代工作量证明（PoW），从而提高交易速度。Serenity
    将分三个阶段启动，第三阶段实施将于 2022 年年中完成。Topaz、Rinkeby、Medella、Zinken 都是 Serenity 的一些测试网络。


    # 蛇 (Serpent)


    在加密标准中，Serpent 指的是在高级加密标准（AES）竞赛中位列于 Rijndael 之后的块密码应用。它由 Lars Knudsen、Ross Anderson
    和 Eli Biham 开发。Serpent 的块大小为 128 位，支持 128、192 和 256 位的密钥。在区块链世界，由 Vitalik Buterin
    开发的 Serpent 指用于在以太坊中编写智能合约的语言。它与 Python 非常相似。由于 Vitalik 认为其技术已过时并存在安全担忧，该语言已被废弃。


    # SGX (软件防护扩展)


    Intel 在 2015 年引入了 SGX，它代表内置在 Intel x86 架构中央处理器（CPU）中的安全指令集。SGX 通过将计算机内存划分为执行区（enclaves），更好地保护用户的敏感信息。执行区是内存中私有的预定义区域。对于区块链，SGX
    提供了增强的隐私安全性以保护交易，并有助于提高共识效率和吞吐量。


    # SHA (安全哈希算法)


    由国家安全局于 2001 年创建，用于数字签名。它被公密钥基础设施市场广泛数字签名。它广泛应用于包括 TLS、SSL、PGP、SSH、IPsec 和 S/MIME
    在内的安全应用程序和协议。SHA-256 算法用于区块链每次获取 256 位的恒哈哈。该算法也是加密技术的一部分。


    # 分片 (Sharding)


    分片是一种数据库架构技术，可对数据库包含的数据进行水平拆分。它是将一个表的行分成多个不同的表（称为分区）。在区块链中，分片通过将区块链分成称为分片（Shard）的部分来提高交易速度。每个分片都有自己的账户余额和智能合约。每个节点仅拥有区块链的部分数据而不是完整信息。Zilliqa
    是第一个实现分片的公共区块链。


    # 形象 (Shill)


    Shill 指公开帮助个人或组织提供信誉的人，而不披露他们与之有密切的关系。加密货币中的 Shill 是指持有某些加密货币并试图推广特定代币或代品牌以提高价格并卖出持仓获利的人。John
    McAfee 被认为是加密货币领域著名的 Shill。


    # 侧链 (Side Chains)


    侧链是与主链连接并具有双向锚的次级区块链，用于从主链到侧链以及反之的交易交换。它们为主链提供了效率和可扩展性。侧链可能有自己的共识协议，这些协议可能与主链协议完全不同。双向锚还允许资产按照预定汇率安全地从一个区块链交换到另一个。


    '
