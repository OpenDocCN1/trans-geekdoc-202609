    # 5.1 Manufacturing Blueprints: Essential Characteristics of Self-Describing Products
    and Production Processes


    Digital Twin in this chapter amalgamates artificial intelligence, machine learning,
    big data, and Internet of Things technologies that are essential for smart manufacturing.
    The core element is DT-KM. This is essentially a knowledge-centric model that
    combines products, services, components, and programs by composing and analyzing
    product/manufacturing data to create knowledge for data-driven and fact-based
    decision-making. The DT-KM programmable abstraction type is called the manufacturing
    blueprint type (or simply blueprint). They transform traditional products into
    self-describing products by storing, linking, combining, and analyzing data collected
    throughout the product life cycle. Blueprints rely on model engineering paradigm
    to manage and link product data and information, including content and context,
    product portfolios and product families, and manufacturing assets (people, plants,
    machinery, production line equipment), helping to meet the constraints and requirements
    (features, quality, performance, time, etc.) of the entire manufacturing ecosystem.


    This information can be faced in a broader operational context, forming the basis
    for generating “intelligence” and the steps to more factual data-driven decision-making.
    The DT-KM encapsulates supplier, product and production knowledge into five interleaved
    and extensible knowledge types, illustrated in Fig. 2. They support the three
    DT facets outlined in Sec. 3 as follows:


    **Product facet**—captures relevant direct and indirect information about products
    and services through the following blueprint types:


    *Supplier blueprint*: Defines the business and technical details of the partner
    company, such as production capacity details and production capabilities.'
