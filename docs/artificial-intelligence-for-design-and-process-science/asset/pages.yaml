  md: '# Creativity and AI


    Morteza Zangeneh Soroush, Md Sakib Ullah Sourav, and Yong Zeng


    **Abstract** The advancement of artificial intelligence (AI) has enabled researchers
    to apply this effective tool to several complex cognitive processes, one of which
    is creativity. Different applications such as creativity, human-AI co-creation,
    and team creativity enhancement are examples of AI applications to creativity.
    Although several studies have reported AI applications being effective in the
    field of creativity, there are major shortcomings and open questions from different
    aspects which should be addressed. In this chapter, we introduce these applications,
    then review recent studies, and finally open a discussion to point out the gaps
    and available research areas for future studies. We believe that the present chapter
    can shed light on AI-based creativity studies and boost researchers’ understanding
    of that.


    **Keywords** Creativity · Artificial intelligence · Creative ide · AI · Creativity
    assessment · Human-AI co-creation


    # # Introduction


    Creativity is a key aspect of human intelligence, is defined as the ability to
    develop useful, appropriate, and novel ideas [1]. Creativity is vital for human
    survival and is needed in various problem-solving and decision-making scenarios.
    It helps in finding innovative solutions and improving efficiency [2]. This indicates
    that creativity, as an inescapable part of our lives, is of great importance [3,
    4].


    Creativity has been explored in various fields such as design, business, and others.
    The papers by Zeng et al., [5] and Nguyen and Zeng [6] present mathematical and
    theoretical models for understanding the factors that lead to a creative design,
    using the atomic theory of design modeling (ATDM) and environment-based design
    (EBD). Gero et al. [7] explore the modeling of creativity


    > M. S. Soroush · M. S. U. Sourav · Y. Zeng (✉)

    Concordia University, Montreal, QC, Canada

    e-mail: yong.zeng@concordia.ca


    © The Author(s), under exclusive license to Springer Nature Switzerland AG 2025

    S. C. Suh (ed.), *Artificial Intelligence for Design and Process Science*,

    https://doi.org/10.1007/978-3-031-67886-8_3'
  merge: -1
  img_proc: true
- pgno: 48
  md: '30

    M. Z. Soroush et al.


    and knowledge-based creative design, underscoring the significance of computer-aided
    design in nurturing creativity. Badran [8] introduces an engineering creativity
    enterprise dream at amplifying creativity and innovation in engineering education.
    Boden [9] delves into computer-generated models of creativity, illuminating the
    potential of technology in comprehending and simulating creative processes. It
    underscores the importance of harnessing technological advancements and integrating
    creativity tools to foster innovation and cultivate creativity.


    Creativity outoubtedly stands as one of humanity''s most complex and advanced
    cognitive tasks [10–12], engaging both mental and physical abilities [6, 13].
    It operates as a recursive, complex, and nonlinear cognitive process, encompassing
    tasks like problem understanding, idea generation, and idea evolution [14–16].
    Despite numerous theoretical investigations, there are unexplored facets of creativity,
    including assessment methods and human-machine collaboration, which necessitate
    exploration [17, 18]. These uncharted research presents opportunities for advancement
    through the application of AI [19–22].


    The progress in artificial intelligence (AI) has empowered researchers to investigate
    processes like cognitive tasks, including creativity. AI tools have been developed
    into highly sophisticated instruments capable of surpassing programmed functionalities
    [23, 24]. This suggests that complex algorithms exhibit a form of "creativity.\Nonetheless,
    artificial creativity may diverge from human creativity across various domains.
    This suggests that exploring AI in creativity is of great importance.


    Although AI has extensive use and discussion across various disciplines, the application
    in the reality of creativity remains relatively understudied, leaving questions
    unanswered and prompting ongoing research. Some of these questions include the
    following:


    +   1. How can AI be leveraged to augment human creativity?

    2. How can AI effectively evaluate a creative product or solution?

    3. In what ways AI and humans collaborate in creativity tasks?

    4. Is there a potential for AI to surpass human creativity?


    These inquiries have been and continue to be focal points within the field of
    creativity. They serve as the driving force behind our exploration of AI’s applications
    in creativity. Several studies compare human and artificial creativity concerning
    several aspects [9, 19, 21–23, 25–27]. Our main aim in this chapter is to address
    the aforementioned questions to the fullest extent possible based on the existing
    literature.


    In this chapter, we explore AI applications in creativity going over several aspects
    such as (1) AI as a creative tool, (2) AI-human co-creation, (3) creativity assessment
    by AI tools, and (4) AI creativity versus human creativity. We also provide some
    information regarding creativity tests and assessments.'
  merge: -1
  img_proc: true
