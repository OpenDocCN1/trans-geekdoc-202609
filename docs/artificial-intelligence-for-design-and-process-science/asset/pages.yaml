  md: '# 5.2 Training Actor and Critic Models


    Actor and critic networks were trained in multiple stages as indicated before
    to evaluate whether reinforcement learning [33] can produce a policy that will
    optimize the network architecture for the UCI datasets.


    The networks were trained on nine UCI target problems with alternate individual
    pre-training of critic and actor the goal of evaluating the sufficiency of the
    used network structures and of stabilizing the initial value function estimate
    and consistent policy in order to avoid excessive trajectory generation.


    Once critic and actor have been pre-trained, they are trained together using the
    TD3 actor-critic approach [34]. Here trajectory data is constructed using the
    perturbed critic policy and used to augment a temporally decaying buffer. This
    buffer stores states, actions, rewards, and random sampling on the buffer is used
    to obtain sufficient training examples to allow the networks to converge. Rewards
    are predicted by passing next state to the accuracy model and computing the need
    for further target problem solving. The two critic networks are trained using
    a loss obtained from the Bellman Eq. (1) that provides separate losses for V(s)
    and As(a), and the critic network is updated by updating its weights in the better
    of the two critics (i.e., the one with the larger value). The actor is trained
    using policy gradient by propagating the gradient of the negative advantage as
    a loss back through the critic network.


    The actor-critic network was trained for 5000 episodes with a new step being generated
    and 300 samples trained per episode. Actions generated by the actor are displacement
    vectors in the two-dimensional embedding space represented as the sine and cosine
    of the direction and a length between 0 and 1 and are multiplied by a scaling
    factor of δ=0.005 to result in steps in the embedding space:


    ```

    next_state = state + δ * length * (cos(dir) / sin(dir))

    ```


    Fig 14 on the left shows the learned critic V(s) values, while the right shows
    the vector field representing the policy actions for a specific training target
    problem.


    ![](img/accb0e713daa15f4a51070565405380d_156_0.png)


    **Fig. 14** Critic value (left) and learned policy actions (right) over embeddings
    of legal and illegal networks'
