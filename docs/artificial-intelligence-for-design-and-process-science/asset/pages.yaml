  md: '# The Power of Smart Design: How Intelligence Shapes Custom Digital Products


    Michael P. Papazoglou, Bernd J. Krämer, and Amal Elegammal


    **Abstract** Smart manufacturing fundamentally transforms traditional manufacturing
    into the next generation of data- and knowledge-driven digital manufacturing.
    This chapter presents a proven digital twin-driven manufacturing approach called
    manufacturing blueprints. It includes a novel manufacturing knowledge model and
    a programming approach to rethink and redesign the whole product customization
    and development process. Manufacturing blueprints are a comprehensive digital
    twin approach that addresses the entire smart product life cycle, including product
    design, production, and performance aspects. Manufacturing blueprints promises
    to realize the vision of smart manufacturing by fully digitizing all physical
    assets and processes, connecting factory sites and plants to customize outputs,
    and allocating resources to provide a logical shift between the digital and physical
    realms of product customization.


