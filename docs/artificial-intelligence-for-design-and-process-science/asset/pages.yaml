  md: '# Creativity and AI


    provide the foundation for future AI-based research in this field. To explore
    these intricate considerations, we shall well begin with the definitions to understand
    the connections between creativity and design to better understand design creativity.
    As mentioned before, creativity is defined as the ability to develop useful, novel,
    and surprising ideas [10-12, 61]. Design aims at changing existing situations
    into desired ones [62]. Design is nonlinear and complex [63] and lies at the heart
    of creativity [64-67]. On the one hand, by definition, creativity is a measure
    of the process of design, either intentional or unconscious. On the other hand,
    it is important to note that not all existing ones are inherently creative; differing
    only in their specific context. Design creativity typically denotes a scenario
    where the resulting product implies creativity. Design creativity is inherently
    unpredictable; yet it may seem—yet it happens. It is noteworthy that different
    designers may provide various solutions to the same design problem, and even the
    same designer generate diverse solutions for the same problem over time [10].
    Creativity may spontaneously emerge even if one does not intend to create a creative
    design, whereas creative design just may not come out matter how hard one tries.
    Moreover, it is conceivable that a designer may lack creativity, while the product
    demonstrates creativity attributes, and conversely, a designer may exhibit creativity,
    while the resulting product does not [16]. Concerning what was covered in this
    chapter, future studies are recommended to focus on AI-powered design to creativity
    and design creativity. Although there exist several papers on “AI and creativity,”
    deep explorations are required to associate complex and abstract concepts of design
    creativity with AI-related ones. In addition, for the differences between creativity
    and design creativity, researchers should focus on AI-based design creativity
    studies as there are a relatively limited number of studies in the field.


    # Conclusion


    In conclusion, the exploration of AI in creativity is still in its early stages,
    and there is a need to adopt advanced and updated AI methods to further enrich
    this area of research. Although the literature indicates some applications of
    AI in creativity, other types of AI-powered research, such as machine-machine
    creativity, AI in teams, and machine-machine creativity, will soon emerge due
    to the advancement of AI methods. Generative neural networks, for example, have
    the potential to be employed in creativity and design creativity applications.
    In this chapter, we aimed to cover the most pivotal topics in the realm of AI
    applications in creativity and design creativity. We covered artificial creativity
    versus human creativity, creativity assessment using AI, human-AI co-creation,
    and AI in design creativity. The intricate considerations must be taken into account
    when applying AI to design creativity, as there are several nuanced differences
    between design, creativity, and design creativity. These differences should be
    explored further in future studies to'
