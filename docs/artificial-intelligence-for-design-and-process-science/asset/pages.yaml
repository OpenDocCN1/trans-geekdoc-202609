- pgno: 196
  md: '# Introducing Feature Selection Before Propositionalization


    The performance of the models is evaluated on traditional ML metrics [10] of RMSE,
    MSE, and MAE, in addition to a custom metric; "larger than 0," as the result (being
    a time prediction) must always be larger than 0. In addition, suitability of the
    resulting predictions is determined by comparing the predicted DvD (drilling rate
    across phases in an operation) against the actual DvD of an operation.


    # Results


    # 5.1 FSbP Features Reduced


    The FSbP process began with about 700 tables and 20,000 features per database.

    As seen in Table 2, DAHFR was able to identify the sparsest (completely unused
    features) and reduce the feature scope to 131 tables with 2967 features. Further
    DAHFR filtering leaves 37 tables with 707 features in scope.


    RFCM processed 125 distinct business reports and was used to identify and graph
    48 keywords (Table 3). These 48 RFCM keywords were linked to 50 database tables.


    Twenty-four keywords from RFCM were keywords related to "duration" or were neighbors
    to duration keywords (at this time, the Markov blanket was not used due to error).
    From these, 35 target tables were identified (Table 4). Further selection (based
    on DAHFR health table, keyword definition) reduces the number of tables for further
    examination to 22 tables of the initial 700 tables, a removal of 96.8% of tables
    from scope.


    Unfortunately, only one database was used instead of all five by the end of the
    project to simplify the project, although harmonization was mostly completed.


    # 5.2 Predictive Modeling Results


    The dataset had an average of 82.5 h, median of 29.7 h, mode of 2694 h, and std
    dev of 124 h. SKLearn models of Random Forest Regressor, Linear Regressor, and
    Multilayer Perceptron are trained from the model with various preprocessing steps,
    resulting in the top-ranking models as shown in Table 5. The best model''s accuracy
    distribution is shown in Fig. 2 while Fig. 3 shows a result where multiple predicted
    phase durations are compared against actual phase durations over the duration
    of a project.


