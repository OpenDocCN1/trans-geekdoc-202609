    # ### 3.3.2 Creativity Assessment Studies


    The evolution of computational approaches to creativity assessment, by Guilford’s
    (1950) prediction to today''s AI-based methods, can be delineated into four distinct
    phases.


    In the first phase, the focus was on text-mining statistics derived from responses,
    including word length, count, and punctuation usage. The second phase was the
    application of latent semantic analysis to divergents, originality through semantic
    distance. The third phase witnessed a transition from latent semantic analysis
    to Global Vectors for Word Representation. This shift capitalized on superior
    corpus and neural network capabilities, offering a better approximation of human
    thought processes. Research indicated that this approach surpassed latent semantic
    analyses in predicting human ratings. In the fourth phase, there was a shift from
    unsupervised to supervised learning approaches. This leveraged large language
    modeling techniques to significantly enhance scoring accuracy [44].


    In a study [46], a creativity assessment system called AuDRA—an Automated Drawing
    Assessment format—was employed to extract visual creativity ratings, they trained
    AuDRA and tested its generalizability to untrained drawing sets, raters, and tasks.
    Using a collection of line drawings and drawings from simple drawing productions.
    This work employed four distinct datasets of rated drawings—totaling over 13,000
    drawing-rating pairs. While training the model to perform the abstract drawing
    task to optimize its predictive capacity for specific task. They opted to use
    ResNet [50] as the computer vision backbone for AuDRA [46].


    The model successfully learned to predict the creativity scores of human drawings.
    It was not trained on remarkably high accuracy.


    The model showed evidence of learning visual features of drawings, simply predicting
    their level of elaboration. Critically, AuDRA generalized to predict the creativity
    of sketches from entirely unpublished datasets of human ratings that were not
    used in the model. They found AuDRA scores to be highly correlated with human
    creativity ratings on the same drawing task. Importantly, correlations between
    AuDRA scores and human raters surpassed those drawings'' elaboration (i.e., ink
    on the page) and human creativity raters, suggesting that AuDRA is sensitive to
    features of drawings beyond a simple degree of complexity.


    AuDRA showed poorer performance on a drawing task it was not trained, pointing
    to a boundary condition of its predictive power. It is the first extensively trained
    and vetted demonstration that machine learning methods can be reliably used'
