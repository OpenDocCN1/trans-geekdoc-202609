    State-of-the-art review considering 50 relevant papers and 8 patents has been
    conducted in [6], which concludes that DT applications in the product design account
    for 18% of the literature, while 35% address the process design (mainly the execution
    phase while neglecting planning), and 47% address the monitoring process (possibly
    health monitoring).


    In contrast, DT approach proposed here provides a formal manufacturing knowledge
    model and an expressive meta-programming environment (see Sect. 2.3) for the seamless
    translation of validated product designs into efficient and optimized production
    plans. This approach can be extended to subsequent processes of the product life
    cycle, from production to monitoring, with rigorous solutions, and concrete IT
    implementations. However, these are beyond the scope of this article.


    # 2.2 Product Customization


    Product customization is the production of goods and services to meet the needs
    of individual customers with efficiency close to mass production. Critical to
    the successful implementation of a customization strategy is the concept of product
    architecture, which is the means to ensure the reuse of parts, assemblies, technologies,
    and knowledge to achieve both product customization and variability at the same
    time [10].


    Modularity and commonality in product design ensure customization to bring product
    costs lower to mass production. Both enable product differentiation/customization
    by commonality is primarily used to reduce lead times and benefiting from economies
    of scale. During the design phase, commonality is primarily used to reduce the
    effort required to create product variants [11]. Giovanni et al. [12] present
    an innovative approach to rationalize product diversity by associating each product
    variant with the profile of the customer most likely to be interested in.


    Tian et al. [13] argue that in the case of mass customization, by the strong similarities
    between mass customization products and their components, a parameterized approach
    can be used. Research studies relate to product customization are looking at knowledge
    models that represent the platform of a product family [14, 15]. The study in
    [14] presents a module-based integrated design scheme to support the creation
    of a product platform, product family generation, and customized assessment. Naguchi
    et al. [15] propose a knowledge model of product architecture design system that
    focuses on design repositories to reduce data redundancy and inconsistencies.


    The implementation of product customization in the literature focuses on capturing
    the direct information about the customization process that represents the solution
    space, including possible parameters of the product and its geometry and structure.
    However, equally important information that is not directly used to'
