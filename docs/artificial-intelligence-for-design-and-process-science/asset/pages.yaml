  md: 'Unfortunately, LLMs have been shown to exploit spurious associations and dataset
    biases as "shortcuts," achieving inflated scores on NLU benchmarks while lacking
    reliability and generalization on out-of-distribution samples. Recent works have
    shown that LLMs tend to learn shortcuts based on statistical cues to make predictions,
    e.g., the word "not" [8], keywords [9, 10], and cues related to language variations
    [11]. This behavior, also known as shortcut learning, leads the model to learn
    non-generalizable decision rules that do not perform well on out-of-distribution
    data [10, 12] but continues to give state-of-the-art results on independent and
    identically identified (IID) samples. Thus, PLM performance gains on NLU benchmarks
    do not necessarily portray improvement in semantic and reasoning capabilities
    of language models.


    This chapter delineates the challenges in enhancing NLU capabilities within pre-trained
    language models amidst the presence of shortcut learning. We survey recent research
    on quantifying and mitigating shortcut learning and their implications for language
    understanding in language models. Finally, we suggest potential research directions
    and guidelines that can help develop robust and reliable models.


    # 2 What Is Shortcut Learning?


    Shortcut learning refers to the phenomenon where models rely on superficial cues
    in the training data to make predictions instead of learning the semantics to
    perform an NLU task. This overreliance on specific features or biases results
    in poor generalization in out-of-distribution settings. Identifying shortcut learning
    in language models is an ongoing research area, with recent works utilizing model
    attention, dataset statistics, and human-annotated samples to identify spurious
    correlations [10, 13].


    General-purpose neural language models have demonstrated incidental patterns present
    in natural language text, owing to the diverse linguistic cues embedded in their
    training corpora [8, 11]. While research assured the robustness of LLMs in out-of-distribution
    and cross-domain generalization [14], recent studies have revealed that both LLMs
    and their fine-tuned versions on specific keyword-based shortcuts for classification
    [10]. In an examination of fact classifiers, it was shown that claim-only models
    achieved comparable performance to evidence-aware models. This phenomenon was
    due to the former model''s reliance on idiosyncrasies within the claims, which
    did not incorporate evidence in their predictions [15]. Empirical analyses of
    LLMs highlight their dependence on spurious unigram and bigram cues to enhance
    natural language inference (NLI) task performance [8], as well as the utilization
    of syntactic heuristics for NLI tasks [16].'
