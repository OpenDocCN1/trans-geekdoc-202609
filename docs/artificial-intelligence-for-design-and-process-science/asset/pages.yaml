    # 4 Discussion


    Creativity spans various disciplines and intersects with numerous fields. With
    the advancement of AI and computational machines, AI has found applications in
    various creativity studies. While much of the research has focused on creativity
    assessment, human-AI co-creativity, and the comparison between artificial and
    human creativity, there is a notable gap in exploring other aspects, such as simulating
    creativity using AI based on neurophysiological findings.


    Existing literature predominantly enhances generic or artistic forms of creativity.
    However, there is a pressing need for further investigation into the challenges
    and limitations of machine learning and deep generative models, particularly in
    domains like design creativity, constraint handling, and simultaneous modeling
    of function and functional performance.


    While many studies have primarily targeted tasks like AUT and TTCT, there is a
    lack of exploration in other creativity tasks. Although most studies suggest that
    AI outperforms human creativity levels in AUT and TTCT, it is crucial to consider
    additional factors like validity, appropriateness, and usefulness to comprehensively
    compare human and AI creativity.


    In this domain, various AI methods and models have been employed, yet there is
    room for exploration and comparison with other AI methods. Choosing the appropriate
    AI tailored to specific creativity applications is essential, considering each
    method''s unique capabilities and potential limitations. Future researchers should
    prioritize understanding AI methods, with workshops on prompt engineering being
    particularly beneficial.


    Moreover, the social and psychological implications of AI application in creativity
    warrant attention. Future studies should investigate how AI impacts students''
    problem-identification capacity, convergent thinking, and long-term creativity
    when integrated into educational settings.


    We would like to shed light on the aspect that has been less discussed in the
    literature. While several studies have applied AI or explored it in the realm
    of creativity, there are just a few studies that addressed the considerations
    of AI applications in design creativity. Investigating design creativity presents
    significant challenges due to its multifaceted nature, involving nonlinear cognitive
    processes and various tasks such as divergent and convergent thinking, perception,
    and memory retrieval.


    Considering the points mentioned above, AI can be employed to investigate or model
    the intricate processes of design creativity. However, there is a necessity to
    understand the differences between creativity, design, and design creativity'
