    electromagnetic spectrum is a well-known example, encompassing a continuous range
    of energy frequencies (low energy) to ultrahigh frequencies such as x-rays and
    gamma rays [2]. As shown in Fig. 4, visible light occupies a small portion of
    the electromagnetic spectrum. Although it is not possible to show that the longest
    wavelength is the size of the universe, and the shortest electromagnetic wavelength
    size is equal to the Planck length $\approx1.61199(97) \times 10^{-35}$ m.'
