- pgno: 199
  md: '# Phase Average Duration and RMSE Errors


    ![](img/accb0e713daa15f4a51070565405380d_199_0.png)


    Fig. 2 Model accuracy by phase type


    In the end, the FSbP’s performance is determined by the performance of produced
    predictive models. To this end, the predictive model does not necessarily show
    the FSbP’s performance due to the long pipeline of data transformations that happen
    between FSbP and predictive modeling during which introduction of errors or noise
    could occur.


    For example, during data compilation, data undergoes aggregation such as summations,
    averaging, etc. while also handling missing values, new data may be be created
    by transforming existing data.


    Then for the preprocessing steps, missing data imputation and conventional feature
    selection processes further modify the information before the dataset finally
    arrives for training.


    Returning to reviewing FSbP’s performance based on the resulting predictive models,
    the predictive model was able to produce believable DvDs (Fig. 3). Although the
    model seems to have high RMSE, it may be attributed to the nature of the labels
    themselves, which are mostly close to 0 with many outliers with high values, which
    must also be identified.


    Therefore, FSbP was able to reduce the scope of features while producing a relevant
    predictive model.'
