    Y. Chen et al.


    analytical and creative problem-solving framework that engages a person to ideate,
    prototype, and evaluate solutions iteratively. Students were also instructed on
    a risk/benefit analysis to evaluate their plans of AI4SG in their communities
    [32]. For advanced options, student teams have created prototypes based on the
    hands-on AI they learned in Module 2. Students presented their solutions, complete
    with a risk/benefit analysis, in front of gamified ''investors''—external industry
    or community guests who served as judges for the student presentations. The AI4SG
    project guided students in developing AI solutions for community issues, emphasizing
    the value of their diverse backgrounds for innovation. Through a simulated ''social
    entrepreneurship'' experience, students presented their ideas to external judges,
    enhancing their sense of social citizenship and leadership. Furthermore, the project
    incorporated the SDGs, encouraging students to align their AI solutions with these
    goals. This fostered global citizenship and responsibility among students, positioning
    the AI4SG project as a tool for not just teaching AI but also promoting sustainable
    development and social good.


    # # 4 AI4SG Implementation


    Our project aimed to implement AI4SG modules by engaging undergraduate students
    in practical projects across a range of disciplines and institutions, promoting
    AI learning, community engagement and inclusiveness. Adopting an interdisciplinary
    approach, we recognized the necessity of drawing upon multiple disciplines due
    to AI''s broad applications across all industries and the complex nature of social
    problems. Consequently, the teaching modules developed in the project''s initial
    phase were deployed across various disciplines to meet the diverse needs of undergraduate
    students at different academic levels. Lower division students were introduced
    to AI concepts, applications, and innovation, while upper division students gained
    hands-on experience by creating prototypes, preparing them for AI-related careers
    and potential startups.


    We emphasized an interdisciplinary approach throughout the project. Before starting
    Module 1, students engaged with existing projects completed by their peers, as
    demonstrated in studies [30, 31, 33], to understand the context for community-engaged
    projects. This step aimed to enhance students'' appreciation for the value of
    their work. Before Module 2, we facilitated exchanges between students from different
    disciplines and campuses (SJSU, CSUB, CPP), fostering an appreciation for disciplinary,
    cultural, and regional diversity. Following Module 3, students showed their AI-powered
    social innovation projects in a workshop across the three campuses, further enhancing
    their understanding of the projects'' utility value.


    The project''s commitment to diversity was evident in its execution across the
    three diverse CSU campuses. We engaged students from both upper and lower academic
    divisions, encouraging teamwork to explore AI solutions to social'
