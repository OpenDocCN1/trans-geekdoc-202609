    of an attribute-value representation in a single table [2].


    The process of propositionalization is used to transform relational data into
    propositionalized data and may include steps as the joining of tables via their
    relationship and aggregation or other preprocessing techniques.


    When performing KDD on previously collected oil drilling data [3], this transformation
    process is not feasible if performed on the entire sets of data, which is multi-sourced
    (requiring harmonization), and sparse [4] (each source containing about 700 tables
    and 20,000 columns/features), and sparse [5]. Because that the transformation
