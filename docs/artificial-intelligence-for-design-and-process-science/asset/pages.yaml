    # 7 Conclusion


    We have discussed the concept of FSbP in which feature selection is done on relational
    data before could be propositionalized into propositional datasets, of which regular
    feature selectors are only compatible with propositional datasets.


    We have described a methodology for FSbP that uses DAHFR and RFCM that use database
    spans and systems reports to produce “database domain” and “business domain” knowledge,
    respectively, to guide the targeted selection process.


    FSbP was used during the KDD of an oil drilling database and removed 96.8% of
    the tables from the scope of study and compilation while producing believable
    models as a result.


