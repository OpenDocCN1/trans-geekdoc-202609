  md: '# AI for Social Good Education Through a Culturally Responsive Pedagogy


    For the upper division, students progressed beyond ideation to actually implement
    and deploy prototypes addressing social issues of their choice.


    In Fall 2022 and Spring 2023, the project reached 514 undergraduate students across
    13 classes on the three campuses. These students represented a wide array of majors,
    including Management Information Systems, Finance, Business Analytics, Accounting
    Information Systems, Entrepreneurship, General Business, Marketing, International
    Business, Management, Psychology, Economics, Criminology, Advertising, Kinesiology,
    Mechanical Engineering, Computer Science, Computer Engineering, History, Anthropology,
    Geology, Urban and Regional Planning, Electrical Engineering, Landscape Architecture,
    Environmental Biology, Agribusiness, and Food Management. This diverse participation
    underscored the project''s comprehensive reach and impact on promoting interdisciplinary
    AI education and community engagement.


    # # Findings


    In Fall 2022, we conducted individual interviews with three students at the beginning
    and end of the semester to pilot the interview questions and to determine any
    initial themes that emerged from the focus groups next semester. During Spring
    2023, the research team decided that focus groups would be the main data source
    for the qualitative data collection to ensure that the qualitative data was rich
    and robust, given the diversity of the student-participant pools. Thirteen students
    participated in the beginning-of-semester focus group and nineteen students in
    the end-of-semester focus group. To maintain independence and impartiality, the
    interview and focus group studies were developed by a co-author from a different
    institution who had no direct involvement in the courses integrating AI4SG modules.
    This section presents three preliminary findings from our qualitative interview
    and focus group studies [34].


    Developing an Interest and Curiosity in AI Technology Results indicate that students
    develop an interest in the potential application and development of AI technology
    over the course of the semester. Most students appear to take the courses because
    they are “required” for their major across all three institutions; during interviews
    at the start of the semester, few students discussed being personally interested
    in the content of the courses.


    However, by the end of the semester, findings indicate that students develop a
    clearer understanding of the uses of AI, the impact that AI has on people’s lives,
    and the potential AI helps to improve people’s lives (including for communities
    of Color), and, overall, more students are interested in integrating AI into their
    future careers or are open to the possibility, should one arise. For example,
    one student who is unsure if AI would be used in their future career states that
    “if my future company do have that [opportunity], I would love to be a part of
    those organizations that actually take time” to help bring computer science,'
  merge: -1
  img_proc: true
- pgno: 26
  md: '8


    Y. Chen et al.


    AI, and other technology to others, such as children and marginalized neighborhoods.
    The code project sparked an interest in these students to share the benefits of
    AI technology with those who may not have access otherwise.


    By the end of the course, students are able to discuss the limits of AI, including
    various ethical dilemmas that AI technology may present in the future as further
    developments are made. One student brings up the fact that “the people are actually
    developing the technology will have their biases,” while another student states
    that the potential for future developers working in AI have “a lot of power and
    with lot of responsibility.” Many students agree that AI technology needs to be
    monitored because it can “definitely be used for good, but it can also be used
    for very bad things.” Through the process of completing the project, including
    the group work (see finding #2) and the emphasis on community (see finding #3),
    students now understand there are both scientific implications and humanistic
    implications when developing AI technology.


    # Appreciation for Project-Based Learning Initial students find that the modules
    used in the courses at the three institutions are type of learning experiences
    students desire, as expressed in the interviews. For example, when asked what
    advice they would give instructors on how to make course content more relevant
    to their lived experiences, at the beginning of the course, the majority of focus
    group students begin the semester wanting as many opportunities as possible to
    apply the course in contextualized situations.


    During focus groups at the end of the semester, students across all courses refer
    to the “AI for Social Good” project in the present course as an example of what
    other STEM-related courses should use as a summative assessment.


    > “Project-based learning (PBL) is a type of inquiry-based learning students with
    opportunities to construct knowledge through real-world questions, problems, and
    practices [35] to create meaningful learning experiences [36] that include peer
    social interactions and the sharing of knowledge and understanding with others.
    With a PBL assessment, the students discuss aspects of the “AI for Social Good”
    project they enjoyed, including collaborating with their peers, applying their
    personal knowledge and expertise, and demonstrating their content through an authentic
    context. When talking about the advantages of collaboration, one student explains
    that “a huge advantage of working in a group is that you’re able to get perspectives
    from many different places, demonstrating their understanding of how effective
    group-based learning is compared to the traditional, passive learning found in
    lecture-based courses. Another student even calls the present course “an outlier”
    STEM courses tend to focus more on a technical understanding, or it’s very just
    ‘get it done,’ instead of having human factor to it,” which, they feel, their
    course did take into consideration in relation to the course content, completing
    the PBL assessment with their peers, and designing the final product with other
    communities in mind.'
