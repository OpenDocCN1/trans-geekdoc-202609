  md: '# AI for Social Good Education Through a Culturally Responsive Pedagogy


    We designed modules that (1) encourages students to choose topics that they care
    about—sustainability, (2) offer appropriate levels that students feel competent
    to work on, and (3) empowers students to create concrete solutions relevant and
    beneficial for their communities and future careers. Therefore, “AI for Good”
    is deployed as a student-team project with three modules [28–31]:


    +   - Module 1: identifying sustainability challenges in students’ communities

    - Module 2: learning AI concepts and applications through hands-on labs and study
    cases

    - Module 3: learning AI innovation by proposing or creating, in teams, AI-powered
    solutions to address the social issues and discussing the benefits and risks


    In Module 1: Social Problem, students were provided with material on the Sustainable
    Development Goals (SDGs) and local applications of the SDGs for initial ideation
    of possible topics of study. Additional material was provided on how to identify
    a social issue and connect it to the SDGs. Students formed teams and identified
    relevant social issues in their community through observation, taking photos,
    and interacting with the community. This allowed students to connect the content
    to their lived experiences, motivating them by choosing challenges that mattered
    to them. This also helped students establish an intrinsic value to learn skills
    to address problems relevant to them and.


    In Module 2: AI Labs, students were provided with AI “toolkits” to learn the concepts
    and applications of AI. The purpose of providing these toolkits was to facilitate
    ideation on how they might use AI to address the social issue identified in Module
    1. The project curated demonstrations (demos) of them from leading AI companies
    (e.g., IBM, Google). These AI applications covered machine learning, conversational
    agents, visual recognition, speech to text, text to speech, sentiment analysis,
    etc. This module encouraged students to learn AI concepts by using the provided
    demos and to summarize the functions and functions of these AI applications. For
    advanced students, practiced in hands-on labs using an adapted version of AI platforms
    and tutorials to meet students’ levels. The project team compared alternative
    platforms that best served project and student needs (i.e., Google, Microsoft).
    Subsequently, students were provided with short cases in which companies and organizations
    used AI to create innovative solutions. Studying the technical and application
    aspects of AI helped them connect what they learned about AI to the problems in
    their communities. We expected that using cutting-edge technologies and application
    cases that matched students’ capabilities allowed students to increase the attentuation
    value in learning.


    Finally, in Module 3: AI-Powered Innovation, students worked with their teams
    as simulated “AI-powered solutions for pressing social issues in their communities.
    Identifying a social issue in Module 1 and learned about AI toolkits in Module
    2, student teams integrated these modules and learned how AI applications could
    be utilized to address their chosen topics. Students were guided through brainstorming
    based on a simplified design thinking framework,'
