    # Model-Driven Product Engineering


    The complexity of the manufacturing ecosystem shows that advanced model-driven
    engineering (MDE) approaches have the potential to be used in manufacturing to
    simplify the product design and development processes and drive productivity gains
    [4, 5]. Model-based engineering provides a simultaneous, collaborative design
    process that allows users to identify and define requirements, model solution
    architectures, validate and share ideas among various stakeholders with different
    views, and enable them to trade-off between features and costs. The MDE approach
    provides a means of linking different engineering processes through artifacts
    and abstractions that meet the requirements of industry acceptance and enable
    analytic methods. The Systems Modeling Language (SysML) is a popular choice among
    MDE practitioners. However, its informal semantics make it poorly suited to rigorous
    analysis.


    To realize the digital twin and digital thread concepts, the conventional MDE
    approach needs to be specialized and extended to satisfy the requirements of smart
    manufacturing. In Fig. 1, we illustrate an advanced model-driven engineering approach—the-Driven
    Manufacturing (MDM) approach. It supports digital thread and twin principles and
    enables a concurrent and collaborative product customization process. The MDM
    in Fig. 1 contains three layers that enable analysis


    ![](img/accb0e713daa15f4a51070565405380d_116_0.png)


    **Fig. 1** Model-driven manufacturing activity hierarchy and levels for smart
    manufacturing and digital Twins'
