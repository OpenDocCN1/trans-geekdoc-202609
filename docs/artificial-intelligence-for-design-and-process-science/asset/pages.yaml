  md: '# Two Creativity Tests: AUT and TTCT


    The Alternate Uses Task (AUT) and the Torrance Test of Creative Thinking (TTCT)
    are represented in the following sections. These creativity tests have been widely
    employed in the literature as they are well-documented, structured, and straightforward.
    These tests have also been used in the field of AI and creativity as benchmarks.


    # 2.1 Alternate Uses Task


    The Alternate Uses Task (AUT), pioneered by J.P. Guilford in 1967 [28], is a prominent
    psychological assessment tool utilized to gauge divergents from participants based
    on specified criteria as outlined by Torrance. Similarly, the figural component,
    TTCT-Figure, also exists in two versions, featuring tasks involving drawing creation,
    completion of unfinished drawings, and development of new drawings from parallel
    lines. For example, participants may be asked to creatively finish a partially
    drawn image, with evaluations based on predetermined criteria [14, 35].'
