    # 2 Related Work


    Chatbots are powered by AI are a big help to education [6]. These interactive
    agents provide prompt answers and are great resources for both educators and students.
    AI chatbots are beneficial to education because they can help with a variety of
    tasks, provide prompt feedback, and tailor personalized instructions. Research
    and development, teaching, administration, assessment, and advisory are among
    the areas where chatbot technology is being used in a rapid fashion in education
    [7]. It is noteworthy that the majority of chatbot applications are in teaching
    and learning domain (66%), the remainder going to development (19%), administration
    (5%), evaluation (6%), and advisory (4) [6]. These highlight how chatbots can
    effectively change how education is delivered and made accessible.


    The studies of chatbots reported in [8–10] to help establish a solid foundation
    for the understanding of key concepts, design principles, historical context,
