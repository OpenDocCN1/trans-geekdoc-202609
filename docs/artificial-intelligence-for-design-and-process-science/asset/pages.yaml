  md: '# # Compound Noun Phrase Similarity in Bidirectional Transformer Language Models


    Rey A. Gonzalez and Julia Rayz


    Abstract The evolution of language models, particularly transformer-based architectures
    like BERT and Sentence-BERT, has significantly impacted natural language processing
    (NLP), introducing advancements in text analysis, translation, and content generation.
    These models excel in understanding subtle nuances of language, including multi-word
    expressions (MWEs) like compound nouns, which are known for their complex semantic
    properties. Our research investigates the ability of transformer encoder models
    to discern and interpret the distinct meanings of propositional compound nouns.
    By conducting a systematic comparison of similarity scores across compound nouns
    and exploring the effects of modifier and head-noun manipulation, we uncover insights
    into the models'' capabilities to comprehend the semantic depth of these expressions.
    Our findings suggest that transformer encoders can capture the nuances of compound
    nouns. Our work highlights the potential of these models to advance our understanding
    and processing of natural language, promising significant improvements in search
    technologies and the broader domain of NLP.


    **Keywords** NLU · Compound nouns · Noun phrases · Transformer models · Semantic
    similarity


    # ## Introduction


    The development of language models has markedly influenced the domain of natural
    language processing (NLP), introducing advancements in areas such as text analysis,
    translation, and content generation. Transformer-based architectures, such as
    BERT (Bidirectional Encoder Representations from Transformers) and Sentence-BERT
    (sBERT), are demonstrating success in text similarity measurement capabilities
    [1, 2]. These models are characterized by their bidirectional training strategy,
    which'
  merge: -1
