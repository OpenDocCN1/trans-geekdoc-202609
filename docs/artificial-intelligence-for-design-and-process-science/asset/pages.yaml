    # 6 Dissemination


    To maximize the impact of the AI4SG project, we devised a strategic dissemination
    plan aimed at broadening the project''s scope beyond our immediate academic and
    geographic confines. Central to this strategy was a project website, designed
    to showcase the "AI for Social Good" projects undertaken by students across CSU
    campuses, available at https://www.aifsocialgood.org/. This site not only highlights
    the innovative solutions that students have developed to address societal challenges
    through AI but also serve to inspire educators, stakeholders, and investors about
    the potential of AI for social improvement.


    Further amplifying our outreach, we organized a virtual symposium in collaboration
    with the CSU Chancellor''s Office and STEM-NET, designed to foster disciplinary
    and cross-institutional dialogues about AI''s role in societal transformation.
    The First Annual AI for Social Good Innovation Symposium brought students, faculty,
    industry partners, and community stakeholders, facilitating a rich exchange of
    ideas and highlighting career opportunities in the field of AI. It attracted about
    150 attendances in May 2023. Through these initiatives, our dissemination effort
    not only showcased the practical outcomes of the AI4SG project but also established
    a foundation for ongoing collaboration and innovation in the application of AI
    for Social Good.


    # 7 Conclusion


    In this study, we introduced the AI for Social Good (AI4SG) project, which aims
    to offer an innovative educational pedagogy to impart AI knowledge to undergraduate
    students from diverse academic disciplines, with a focus on societal betterment.
    Students were instructed to generate a multifaceted understanding of AI applications
    through case studies, practical hands-on labs, and the prototyping of AI-driven
    solutions for local societal challenges. The AI4SG curriculum was implemented
    among three universities between Fall 2022 and Spring 2023 semesters, encompassing
    514 students from three distinct disciplines. Students have increased interest
    and interests in learning AI and a stronger inclination toward AI-related careers.
    They also appreciated the project-based approach to address important social issues
    in their own community. Finally, students found it enriching to transcend the
    traditional classroom boundaries, taking'
