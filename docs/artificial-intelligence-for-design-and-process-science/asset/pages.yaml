  md: '# Learning Shortcuts: On the Misleading Promise of NLU in Language Models


    Geetanjali Bihani and Julia Rayz


    Abstract The advent of large language models (LLMs) has enabled significant performance
    gains in natural language processing. However, recent studies have found that
    LLMs often resort to shortcuts when performing tasks, creating an illusion of
    enhanced performance while lacking generalizability in their decision rules. This
    phenomenon induces challenges in accurately assessing natural language understanding
    in LLMs. Our chapter provides a concise survey of relevant research in this area
    and puts forth a perspective on the implications of shortcut learning in the evaluation
    of language models, specifically for natural language understanding (NLU) tasks.
    This chapter urges more research to be put toward deepening our comprehension
    of shortcut learning, contributing to the development of more robust language
    models, and raising the standards of NLU evaluation in real-world scenarios.


