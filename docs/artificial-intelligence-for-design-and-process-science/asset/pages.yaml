    # 6 Discussion


    The key objective of feature selection is to reduce the number of features while
    retaining features most relevant to the prediction objective.


    One factor to be aware of during FSBp is that removal of features at this stage
    (KDD FS) will be more interested in extracting accurate models from their given
    dataset data scientists (post-propositionalization) rather than searching back,
    researching, and recompiling data.


    Because of this, the FSBp must focus on removing only the least relevant features,
    and not on finding the most related features.


    With in mind, despite the lax threshold for selection, FSB has removed 96.8% of
    tables from the scope for data compilation and data mining.


    FSBp proves crucial for the data scientist because it allows the scientist to
    focus efforts on relevant features during data compilation where otherwise examination
    or compilation of the entire database would require the immediate understanding
    of the database and the multi-disciplinary expert knowledge, which contributes
    to the 700 tables and 20,000 columns AND the understanding of data entry practices
    and semantics for each individual database.'
