  md: 'Learning Shortcuts: On the Misleading Promise of NLU in Language Models


    # 2.1 Identifying Shortcuts


    Research dedicated to automatically identifying and mitigating spurious cues in
    training and fine-tuning data has been proposed in recent years [13, 17, 18].
    The understanding of shortcut learning behaviors in LLMs has been recently extended
    by leveraging the long-tailed phenomenon [9]. This work observed that LLMs tend
    to focus on the head of the word distribution, neglecting the poorly learned tail
    of the distribution. Furthermore, their findings indicate that shortcuts are predominantly
    learned in the early training iterations, impeding potential learning enhancements
    in later iterations.


    While most works do not differentiate between spurious and genuine tokens, [19]
    addresses this distinction by employing an attention-guided approach to detect
    and alleviate shortcut learning. This mechanism identifies both model and dataset
    biases, utilizing human attention as a supervisory signal to compel the model
    to allocate more attention to “relevant” tokens. This approach enhances robustness
    to out-of-distribution data and maintains performance on IID data.


    # 3 Implications on NLU Evaluation


    # 3.1 Examining the Impacts


    Inflated NLU Performance Scores The performance gains of pre-trained language
    models on NLU tasks have been the subject of extensive scrutiny within the natural
    language processing domain. In several recent works, the performance of BERT-like
    models is shown to be entirely attributable to the exploitation of statistical
    cues. We demonstrated that BERT uses the word “not” as a shortcut in several NLU
    tasks, and the removal of such cues leads to a significant drop in model performance,
    plummeting from near baseline to a score [8]. Similarly, a drop of over 20% in
    BERT-based NLU performance was observed when evaluated on out-of-distribution
    datasets [9]. Another study showed that PLM accuracy scores are inflated by 20%
    by many samples containing high levels of superficial information [20].


    Moreover, [16] established that training and evaluating models using standard
    natural language inference (NLI) datasets such as MNLI [21] results in models
    relying on heuristics. When assessed on a curated dataset lacking shortcut, performance
    dropped below chance performance for examples without heuristics. This highlights
    that NLU models may not learn the correct rules for inference. Similarly, [15]
    shows that even with a complete vocabulary overlap, the performance of fact verification
    models declines by 20% when employing distinct language—while maintaining consistent
    claim and evidence relations (support or refute). [19] also revealed a substantial
    decline of 40%–60% in BERT-based model performance on NLI and fact'
