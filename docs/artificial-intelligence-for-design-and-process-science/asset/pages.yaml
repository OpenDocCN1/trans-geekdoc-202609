  md: '# The Philosophy of Intelligentism and Its Implications on...


    # 3.2 Telopolarity


    Telopolarity includes the possible effects of utilizing both human and artificial
    intelligence. It addresses both the positive and negative effects of these intelligence
    interactions, as well as the difficulties in determining the consequences for
    personal and social life that come along with the greater use of AI in the equation.


    Heidegger''s perspective highlights how technology drives us to view things through
    the lens of predictability and attainability by putting human-technology interaction
    in the spotlight. It fosters an endless thirst for advancement by making the world
    flexible to our planning, arrangements, and manipulations [27]. However, when
    the human mind struggles with the pervasiveness of technology, such a worldview
    may obscure the necessity for introspection and other strategies. ANT breeds this
    discussion to take into account how non-human actors, may influence the potential
    results of technological advancement. All participants in a system are interrelated,
    according to ANT, which presents telolarity as a complex interaction between human
    and non-human components. However, we may neglect the behavior or autonomy of
    sophisticated AI systems because its main attention is on network connections.


    The entire impact of technological breakthroughs, particularly those involving
    AI-based devices, is frequently not until after they have gained popular use.
    At that point, technology has typically been thoroughly ingrained in our society
    norms, making its removal or correction extremely difficult. This emphasizes the
    necessity of thoughtful, anticipatory reflection on the possible effects of new
    technologies before they are incorporated into society. Heidegger suggests the
    concept of Besinnung, which translates as “sensibility,” to counteract the pervasive
    impact of technology [28]. We are better prepared to handle the intricacies of
    technological breakthroughs, thanks to our increased understanding of their ramifications
    and means. We may call the meditative that technology encourages us by encouraging
    sensitivity, which keeps us up to the world around us.


    Although Heidegger''s method and ANT have virtues of their own, they are insufficient
    for foretelling the effects of artificial intelligence, particularly in circumstances
    when AI becomes self-sustaining and acts independently of human considerations.
    Heidegger''s theory, which mainly concentrates on how people interact with technology,
    not fully account for the autonomous behavior of artificial intelligence. Similar
    to ANT, sophisticated AI systems'' emergent behavior or potential autonomy may
    be overlooked by ANT''s focused on networked interactions. Currently, self-creating
    capabilities are not present in AI systems. The current status of AI is a product
    of human design, reliance on human oversight, adherence to human legal systems,
    and human-based ethical considerations. The code, data, and algorithms that humans
    used to create the AI systems ultimately dictate how they behave, even in a hypothetical
    situation in AI develops autonomy. It means that the parameters that were used
    to develop the model can interact with other'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'machines in a way that makes them all completely opaque to humans, at the very
    least. This creates a dangerous precedent.


    In conclusion, Heidegger and ANT provide fascinating perspectives on the effects
    of technological development, but they might fall short of capturing the complexities
    of future machine intelligence. A contemplative mentality and sensibility are
    encouraged by teleolarity, which draws on these viewpoints, in order to appropriately
    navigate the rapidly evolving technology ecosystem. This method emphasizes how
    crucial it is to balance the benefits of technology against unanticipated negative
    effects on society and the individual. It also recommends pondering the possible
    results of giving robots more autonomy and anticipatorily assessing the results
    before releasing them into the real world.


    # 3.3 Virtodynamica


    Virtodynamica is an additional philosophical school having strong roots in the
    larger Intelligenticism movement. It provides a profound lens through which to
    consider the moral implications and foundations that are inextricably linked to
    the development of machines, particularly strengthened AI models. This idea emphasizes
    the critical necessity for ongoing reflection on the ethical bounds of AI and
    the necessary safeguards to ensure adherence to these limits. Virtodynamica emphasizes
