  md: '# # The Philosophy of Intelligentism and Its Implications on Potential Future
    Directions for IS Research and Practice


    Francis Joseph Costello and Kung Chang Lee


    In light of recent impressive developments in AI and the proliferation of large
    language models, this chapter proposes the novel philosophical concept of “Intelligentism”
    as a response to these developments. With a new lens through which to observe
    and navigate the ever-shifting landscape of AI, it aims to reevaluate our proposed
    novel philosophical notion named “intellectualism” in light of these revolutionary
    advancements. In this sense, we propose and define the Intelligentism consists
    of four philosophical components such as anthroposia, telolarity, virtuedynamics,
    and temporal fusion. Then, this study delves into the effects of AI’s widespread
    adoption, specifically as they pertain to IS/IT study. It provides the IS field
    with a novel philosophical perspective on the topic. A conceptual framework that
    accounts for the unique challenges and issues of deploying and supervising intelligent
    devices that communicate with humans is also addressed in the study. Intelligentism
    will serve as the jumping-off point for our philosophical exploration.


    **Keywords** Intelligentism · Anthroposia · Telolarity · Virtuedynamics · Temporal
    fusion


    # ## 1 Introduction


    Artificial intelligence (AI) has advanced in ways that are nothing short of astounding.
    [1, 2], especially with the rise of large language model (LLM) AI. Technology
    and society have undergone a dramatic change as a result of these innovations,
    posing complex problems with unique solutions that call into question preexisting
    philosophical paradigms [3]. We suggest an innovative philosophical known as Intelligentism
    in order to understand and effectively respond to the complexity brought about
    by this technological revolution. With a new lens to view and negotiate the quickly
    changing environment of AI, this chapter seeks to rethink intellectualism in the
    light of these profound breakthroughs in intelligent machines.'
