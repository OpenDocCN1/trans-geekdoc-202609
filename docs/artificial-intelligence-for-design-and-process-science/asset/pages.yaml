  md: 'to smart manufacturing by collecting, harnessing, and leveraging design, manufacturing,
    services, IoT, and sensor data.


    MDM is an approach that moves away from drawing and other definition tools, such
    as natural language descriptions [28] and 3D models, and moves to interactive
    3D models. MDM converts the 3D models through model transformation into modular
    manufacturing operations, digital manufacturing processes, and digital threads
    that are ultimately realized using additive manufacturing techniques or on the
    factory floor. Model transformation takes as input the model corresponding to
    the previous level in the MDM hierarchy and transforms it into the equivalent
    model of the level immediately below in the MDM hierarchy.


    # Product Ideation and Design (PID) MDM enables product engineers and customers
    to imagine, think, and act on (complex) product development projects. The PID
    layer of the MDM architecture is essentially a series of sessions that represent
    a formalized part of the product design phase. Different stakeholders, including
    designers, developers, engineers, and customers, come to share their visions,
    insights, and ideas.


    Product ideas take this information and apply it to the design and customization
    of specific products at the product-agnostic manufacturing model level. At this
    level, 3D-CAD models interactively capture and visualize all relevant information
    in real time for production and quality planning, controlling production processes,
    work orders generation, and coordination of related processes. In previous R&D
    efforts, we have designed and implemented a novel approach to reach this level
    that is formally grounded in the DT blueprints detailed in Sec. 5, through the
    3D interactive product-oriented configuration management (PoCL), [3, 29].


    # Platform-Independent Manufacturing Model (PIM) At this level, DT controls digital
    activities, processes, and recipes to create the first product of interest. PIM
    is rooted in the ISA98 Manufacturing Operations Management level, which provides
    resources, equipment, personnel, and energy to transform digitized raw material
    and component descriptions, quality checks, production flows, and production schedules
    into products. It carries the activities to adapt to a product.


    Therefore, it includes the management of information about schedules, uses, skills,
    definitions, history, and the current status of all resources (suppliers, equipment,
    and materials) and related to the manufacturing facility. The data collected with
    the product design at the PIM level can be used to drive the manufacturing flow
    and provide PIM with an abundance of information that will drive production innovation.
    PIM combines this data collected from resources and other processes to provide
    a more complete real-time view of all manufacturing plants, production lines,
    and increasingly supply chains. Combined with the analytical power of digital
    tools, these increasingly rich datasets offer opportunities for innovation that
    brought advantages and benefits.


    The digital threads derived in this layer are then used to create a fully functional
    prototype using additive manufacturing (AM) techniques or to instruct machines
    and robots on the shop floor to carry out product manufacturing functions. AM
    produces higher-performance designs than traditional manufacturing'
