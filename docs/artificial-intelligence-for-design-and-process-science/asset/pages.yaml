  md: '# AI for Social Good Education Through a Culturally Responsive Pedagogy


    Developing Community Inside and Outside the Classroom A final theme is how students
    discuss the importance of “community” both inside and outside the classroom. At
    the beginning of the course, when discussing a hypothetical scenario of a student
    of Color who is struggling to feel included in a STEM course, the topic of “community”
    is constantly brought up. Some students speak about they experienced before finding
    their on campus; others mention their family and friends from home who support
    them emotionally and help them to persist through difficulties in school.


    During focus groups at the end of the semester, students still stood hold the
    same views on the importance of community when unpacking another scenario with
    the hypothetical student of Color. The student’s expressed disappointment with
    the hypothetical classmates in the scenario who are described as “unsupportive”
    or “mean.” Several students contrast the scenario to their own positive group
    experiences during the “AI for Social Good” project; students characterize their
    learning environments as “welcoming,” with one student feeling “very lucky and
    fortunate to have such a diverse class of people to work over the semester. Another
    student talked about how this project instructor created a pretty strong bond
    within the class, revealing the class community that was created through the efforts
    of the instructors, the learning that linked course content to community, and
    the process of collaborating with peers. Likewise, several share their ideas for
    the group project are based on their own lived experiences (e.g., struggling with
    basic needs, searching for affordable textbooks) and were taken up by their group
    for the final project.


    Worth noting is that students do not mention the role of communities locally to
    campus during focus groups at the start of the course; but, by the end of the
    course (Spring 2023 focus groups), students include the role of local communities
    in their learning and future careers. For example, when asked what advice they
    would give instructors to make the courses more relevant to their lived experiences,
    students suggest instructors integrating more opportunities to integrate the local
    community, such as interviewing community members and working with local community
    organizations to understand their needs and to improve the social good of the
    local community more directly.


    Additionally, when asked to rank the importance of the course content to either
    their future careers, their daily lives, or improving the lives of communities
    of Color, by the end of the semester, students prioritize themselves and, prioritize
    improving the lives of communities of Color. One student uses the class project
    as an example of improving the social good for others (or themselves), stating:
    “a great example of this [priority] was just in the class. A lot of [group] projects
    were based on learning communities of Color, whether it is gaining access or knowledge
    about food, bridging a gap between education, between different levels of income
    … and I think it could be utilized in helping communities of Color.” By leveraging
    their experiences within their own communities alongside content knowledge and
    skills, initial findings indicate that through project, students begin building
    connections with the self, others, and the greater good—something lacking in'
