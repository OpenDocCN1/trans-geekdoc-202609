  md: 'A periodic function $f(t)$ with $w_0 = 1$ can be represented by complex (exponential)
    form of the Fourier series where:


    ```

    $f(t) = \sum_{k=-\infty}^{\infty} c_k e^{ikt} \quad (4)$

    ```


    with $|c_k e^{ikt}| = |c_k|$. The Fourier series of a uniform polygon is given
    as:


    ```

    $f_n(t) = \sum_{k=1}^{n} \frac{e^{ikt}}{k^2} \quad (5)$

    ```


    where $k = q + n\ell$ with $\ell = -p \dots p$ and $\ell \in [-p, p]$.nThe following
    parameters are defined to represent the polygon with the Fourier series: $q \in
    Z^*$ corresponds to the jump step value of uniform polygon; $n \in Z^*$ corresponds
    to the number of vertices of the uniform polygon; $\ell \in Z^*$ determines the
    summation interval $[-p, p]$, in which the Fourier series will be calculated;
    $N \in Z^*$ is the sampling factor for the numerical algorithms and it determines
    the number of samples $t \in [t_0, 2\pi + t]$.

    Including all of the parameters of the algorithm, the new equation is:


    ```

    $u(\ell, t) = \frac{e^{i(q+n\ell)t}}{(q+n\ell)^2} \quad (6)$

    ```


    where $t_r = t_0, t_1, \dots, t_{N-1} = (2\pi + t_0)$ and $\ell = -p, \dots -p+1,
    \dots,1,0, \dots, p-1, p$. Since the resulting Fourier series calculation is the
    sum of each Fourier term at time $t_0$, we can rewrite the equation for $u(\ell,
    t)$ as:


    ```

    $u(\ell, t) = \sum_{\ell=-p}^{p} \frac{e^{i(q+n\ell)t}}{(q+n\ell)^2} \quad (7)$

    ```


    By observing the quantum numbers in Table 1 and the parameters of our equation,
    we produced our new equation (Eq. 8).

    After replacing $n, p,$ and $\ell$ parameters [7] in (Eq. 8) with principal quantum
    number $n$, azimuthal quantum number $\ell$, and magnetic quantum number $m_l$,
    respectively, our for Fourier series becomes:


    ```

    $u''_l(t) = \sum_{m_l=-\ell}^{\ell} \frac{e^{i(q+lm_l)t}}{(q/n+lm_l)^2} \quad
    (8)$

    ```


    An obvious interpretation of this equation would suggest that it represents a
    subshell depending on the value of $\ell$. Note that each matrix component corresponds'
