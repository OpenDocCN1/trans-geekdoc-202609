  md: '# A Communication Dynamics Representation of Electron Energy of S-Orbitals
    in Hydrogen-Like Atoms


    Lurong Pan, Frank M. Skidmore, Serkan Guldal, and Murat M. Tanik


    **Abstract** This paper delves into the inherent role of energy within the proposed
    theoretical framework, communication dynamics, which draws inspiration from Shannon''s
    communication theory. Beginning with the foundational understanding of atoms as
    quintessential carriers of energy, especially evident in electron orbital structures,
    we explore the centrality of energy in varying computational models, from classical
    mechanics to quantum mechanics. A pivotal observation reveals the confluence of
    information and energy, suggesting that in many systems, particularly in quantum
    realms, information transfer necessitates energy interactions. Further, we probe
    the energy implications within particle-wave duality, inducing dual manifestations
    for entities. By emphasizing energy''s universality, we argue for its role as
    a bridge in the multi-scale model of communication dynamics with diverse scientific
    fields. We posit that for the holistic success of this new framework, a coherent
    understanding and representation of energy across multiple scales and domains
    is imperative.


    **Keywords** Communication theory · Communication dynamics · Quantum mechanics


    L. Pan

    Innocence Inc, Middletown, DE, USA

    Integrated Systems Center, University of Alabama at Birmingham, Birmingham, AL,
    USA

    F. M. Skidmore

