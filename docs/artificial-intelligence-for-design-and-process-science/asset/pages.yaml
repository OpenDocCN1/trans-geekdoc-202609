    # 3.1 Digital Twins Facets


    To achieve digital product customization, DTs allow product designers to model
    multiple permutations and a holistic view of all aspects of a digital product.
    They streamline the process of customer demands and implement usage data that
    will increase customization options across three facets:


    **Product facet (for efficient design/customization of products)**—Allows manufacturers
    to analyze how a product works under different design conditions, making the necessary
    adjustments in designing the digital counterpart, and ensure that the physical
    product performs as designed. Digital twin product facets allow to test product
    variations before physically prototyping the product.


    **Production facet (for improved production planning and production)**—Helps to
    verify how the manufacturing process will run before production on the shop floor.
    It simulates the process using the product facet and analyzes the digital thread
    throughout a variety of conditions and what-if scenarios. A digital thread is
    a single seamlessly connected chain of data captured throughout the life cycle
    of a single product, designed, modeled, manufactured, used, and delivered from
    the initial design concept to the finished product. Creating a digital twin replicates
    the entire manufacturing process. This allows manufacturers to find process errors
    without affecting the production volume of the manufacturing plant.


    **Performance facet (for improved quality and performance of products and production)**—Supports
    the collection and analysis of data on the usage and effectiveness of digital
    products and production processes, providing actionable insights for informed
    decision-making and continuous optimization of both product and process aspects.
    The performance facet gathers real-time data from operational products and the
    production line, enabling manufacturers to identify opportunities to improve the
    product or production process.'
