    # 4.2 Out-of-Distribution Generalization


    Mitigating the impact of shortcuts becomes particularly challenging when LLMs
    are assessed on out-distribution datasets. The reliance on heuristics in NLI models,
    particularly when trained and evaluated on standard N datasets like MNLI [21],
    poses a challenge to achieving robust inference capabilities. This is highlighted
    by a significant drop in performance when assessed on curated datasets lacking
    such heuristics, portraying difficulty in achieving generalization beyond the
    training distribution. Strategies and datasets need to be devised for the existing
    variety of NLU tasks, to enhance model robustness and adaptability to diverse
    data distributions.


    **A way forward** To enhance the overall generalization of language models on
    out-distribution datasets, it is crucial to formulate effective strategies and
    curate datasets specifically designed for this purpose. This necessitates a focused
    effort on defining robust inference capabilities, facilitating generalization
