    # 4.3 TD3-Based Actor-Critic


    For RL, a TD3 based learner is used, as indicated in Fig. 3, utilizes delayed
    actor updates, and advantage values, two critic networks with a common target,
    and action noise regularization.


    +   1. Actor Model: The augmented embedding state also feeds to the “actor” model
    to learn the policy. Shown as the rightmost output in Fig. 4, the “actor network”
    provides the policy to optimize a target network. It computes the policy $(\pi)$
    used to select the next step (action “a”) in the embedding space to obtain the
    embedding of the new, modified network.


    +   2. Critic Model: The “critic” model evaluates actions by the actor in the
    context of the augmented embedding state and learns the utility to output state
    values, $V(s)$, and advantage $A(s,a)=Q(s,a)-V(s)$. Internally, this critic maintains
    two value function estimates for both utility functions and a common target network
    that achieves an action update and function smoothing. The actor critic component,
    the reward function is derived as the actual (for online learning) or predicted
    (for planning) improvement of the performance prediction of the “accuracy” model,
    leading to policy trajectories as shown in Fig. 8.


    To train the actor and critic components, the system generates new embedding space
    trajectories, which serve as training data together with the reward extracted
    from the network’s performance predictions. As the policy changes over time, it
    is essential that old trajectories are discounted and ones generated continuously.'
