  md: '# Demystifying Computer Science: A Sentence Transformers and…


    # 49


    ![](img/accb0e713daa15f4a51070565405380d_66_0.png)


    Fig. 1 Data collection process


    The training process is executed over 100 epochs, during which the model learns
    to map input questions to their corresponding tags effectively. The training pipeline
    is optimized to run on either CPU or GPU. The model''s performance is continuously
    monitored, and training is halted if no improvement is observed over a set patience
    threshold. Upon successful completion of training, the model''s state, architecture
    details, and associated metadata (input and output sizes, tags, etc.) are stored
    in a "model.pth" file.


    # 3.2 Integration of Transformative Encoding and Neural Network


    The chatbot collects input from users and utilizes the sentence transformer, specifically
    the "all-MiniLM-L6-v2" model to encode the input sentences into a 384-dimensional
    vector. This model undergoes several key steps to process the input and generate
    meaningful representations:


    +   (a) Word embedding: The first step involves converting input words into numerical
    vectors. This process is known as word embedding and helps the model represent
    words in a format suitable for mathematical operations.

    (b) Positional encoding: To capture the sequential relationships in a sentence,
    positional encoding is introduced. Since traditional embeddings don''t convey
    word order information, positional encoding adds positional information to the
    word vectors. This ensures that the model understands the sequential structure
    of the input.'
