  md: '# Demystifying Computer Science: A Sentence Transformers and Neural Networks-Powered
    Chatbot


    Sang C. Suh and Swetha Reddy Pathuri


    **Abstract** A significant challenge faced by many students and parents is the
    lack of clear information about the diverse range of available courses and career
    paths in the ever-evolving landscape of higher education. This informational gap
    often results in students making uninformed choices, leading to academic struggles
    and disappointment for both students and their parents. Particularly in the field
    of computer science, where numerous bright majors and rewarding careers exist,
    students lack awareness of the available opportunities and how to learn the process.
    Recognizing the pivotal role of emerging technologies, this paper introduces an
    AI-driven chatbot called CSACbot (Computer Science as Career bot) developed using
    neural networks, transformers, and PyTorch. This chatbot serves as an innovative
    solution to provide comprehensive information about the field of computer science,
    guiding students and parents in making informed decisions about courses, majors,
    and potential careers. By efficiently and accurately addressing user queries,
    this AI-driven chatbot aims to bridge the information gap, empowering students
    to embark on successful academic journeys in computer science.


    **Keywords** Educational chatbot · Generative AI · Sentence transformers · Computer
    science education


    # # Introduction


    In the rapidly evolving landscape of AI applications in academia, various studies
    have explored the integration of AI tools to enhance different aspects of education.
    The growing workload and expansion of academic programs in universities create
    stress for academic staff. To address this, an AI-based chatbot using the K-Nearest
    Neighbor (K-NN) method was introduced to assist with tasks typically handled by
    academic officers [1]. The evaluation based on user responses indicates that'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# 46 S. C. Suh and S. R. Pathuri


    significantly improve efficiency in providing academic information. In the COVID
    pandemic situation, many youngsters feel restless and dissatisfied to syllabus
    incompletion. To address this issue, a student friendly AI-powered chatbot called
    EOT and the Learning Management System (LMS) were developed to provide students
    with the resources they need on any topic they are interested in and resolve their
    problems [2]. Generative artificial intelligence (GAI) tools can in general help
    manage and create innovative business methods. Companies like Microsoft, Google,
    and Facebook are investing in the development of these tools. Research with 100
    students and 100 professors suggests that the use of use positively influences
    GAI adoption emphasizing the increasing importance of incorporating generative
    AI in various aspects of life including academics [3]. Challenges of recommending
    suitable educational resources in the field of E-Learning necessitated a new recommendation
    approach that utilizes AI techniques to provide real-time responses to learner
    queries and offers a relevant set of suggestions tailored to their specific needs
    in the context of E-Learning [4].


    A key aspect of an effective chatbot''s functionality lies in its ability to understand
    and interpret user intent from its classes a task commonly known as intent classification.
    Intent classification involves user utterances into predefined categories, each
    representing a distinct goal [5]. Successful intent classification provides the
    basis for generating relevant, contextualized responses, enhancing the user experience.
    Traditionally, intent classification was achieved using rule-based systems or
    feature engineering approaches, which often struggled to capture the complexities
    of natural language and are also time-consuming.


    The emergence of pre-trained models, such as all_MiniLM_L6_v2, which is one of
    the models has revolutionized NLP tasks, including intent classification. These
    models pre-trained on large quantities of text data that have an inherent understanding
    of linguistic structures and contextual indexes. Their application to intent classification
    offers the potential to improve accuracy, adapt to diverse domains, and reduce
    reliance on hand-crafted features.


    In the dynamic landscape of higher education, students and parents often face
    challenges in navigating the multitude of available courses and career paths.
    The lack of clear information leads to uninformed choices contributing to academic
    struggles and disappointment. This research paper addresses this by introducing
    an innovative solution—an AI-driven chatbot specifically designed to provide comprehensive
    insights into the field of computer science. The primary purpose of this chatbot
    is to serve students and parents with accurate and efficient information about
    available courses, majors, and potential careers in computer science. By leveraging
    advanced technologies such as neural networks, sentence transformers, and PyTorch,
    the chatbot aims to bridge the informational gap and guide users towards well-informed
    decisions, ultimately enhancing the success and satisfaction of students in their
    academic journeys.


    Through the integration of neural networks, sentence transformers, and PyTorch,
    the AI-driven chatbot boasts a robust foundation for effectively addressing user
    queries. These technologies enable the chatbot to understand and respond'
