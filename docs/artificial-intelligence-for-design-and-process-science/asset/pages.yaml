    \ of the features are in groups of irregular time series.\n\n# 3 Literature Review\n\
    \nMachine learning algorithms rely on data to train models that can predict outcomes.\
    \ However, not all data is equally relevant to the target objective. The inclusion\
    \ of irrelevant or redundant features can negatively impact a model’s accuracy,\
    \ training time, ability to generalize, and model running time. A feature selection\
    \ process is used to remove such features from the dataset before the training\
    \ begins or as part of the training process [1].\n\n# 3.1 Categories of Feature\
    \ Selection Strategies\n\nFeature selection strategies are chosen based on assumed\
    \ relationship or nature of the features. Well-established feature selection techniques\
    \ assume a “flat feature” where features are assumed to be unrelated to one another.\
    \ Other techniques account for inter-feature relationships, assuming either streaming\
    \ features or structured features [4]. \n\nIn this chapter, we will briefly explain\
    \ flat and structured features as they are relevant to guiding our strategies\
    \ and their limitations.\n\nFlat features are features that are assumed to be\
    \ independent. Feature selection processes for features are grouped into three\
    \ categories, which are filter methods, wrapper methods, and embedded methods.\n\
    \nFilter methods ranks and evaluates features based on a certain criterion. Examples\
    \ of scores used for filter methods include the Filter Score, which evaluates\
    \ a feature based on its variance with respect to class values, based on information\
    \ gain and mutual information and information gain, and Relief and ReliefF, which\
    \ uses calculated distances of nearest features (feature-wise) of instances between\
    \ identical and different classes.\n\nFilter-methods are simple to execute but\
    \ does not guarantee an optimal feature set-FS.\n\nThe second category, wrapper\
    \ methods, iterates through possible subsets of features from the initial training\
    \ set and measures their suitability by measuring the performance of training\
    \ models created from the feature sets, selecting the best feature set to be used\
    \ for the final training.\n\nFeature sets selected by wrapper techniques are computationally\
    \ expensive because it must both search the feature space and train models with\
    \ each feature iteration. For datasets with a lot of features, wrapper techniques\
    \ and search algorithms must be implemented to explore the feature space."
