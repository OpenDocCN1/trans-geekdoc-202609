- pgno: 9
  md: '# Introductory Address


    Dear Members of the Society for Design and Process Science and colleagues:


    I''d like to share some thoughts I''ve had recently about the importance of imagination
    and wished thinking in the creative process. They seem relevant to your theme
    of Convergence, and to share in its spirit.


    In recent years, there have been several spectacular success stories in machine
    learning. Checkers, chess, and now the deep and ancient game Go have been conquered,
    in the sense that computers are now the best players. What does it teach us?


    Perhaps ironically, one big takeaway is the value of a quintessentially human
    characteristic: imagination. At first conclusion might sound strange. Do computers
    really have imagination? But, on deeper reflection, it''s compelling. To choose
    their moves, the computers spin out and examine many alternative possibilities,
    before settling on the most promising. And what is imagination, the ability to
    consider what is, but might not be?


    Many creative people, including many physicists, have testified to the value of
    imagination in their work. In one of their most famous quotes, Albert Einstein
    said: “Imagination is more important than knowledge. Knowledge is limited. Imagination
    encircles the world.


    The great quantum physicist Paul Dirac, when asked how he made his epochal discoveries,
    replied: “I like to play about with equations, just looking for beautiful mathematical
    relations which maybe dont have any physical meaning at all. Sometimes they do."


    And Richard Feynman said: “The game I play is a very interesting one. The straightjacket,
    he goes on to explain, is if your goal is to discover new things about physical
    reality, you have to respect known facts, accumulated over centuries of research.


    Perhaps the most impressive testimonial to scientific imagination from James Clerk
    Maxwell, the leading theoretician of electromagnetism, in his tribute to Michael
    Faraday, its leading experimenter. The self-taught Faraday had to rely on his
    visual imagination, because his mathematical training was sketchy. This led him'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# xii


    # Introductory Address


    to new ways of thinking, Maxwell described: Faraday, in his mind''s eye, saw lines
    of force traversing all space where the mathematicians saw centers of force attracting
    at a distance: Faraday saw a medium where they saw nothing but distance; Faraday
    sought the seat of the phenomena in real actions going on a medium.


    Later, Maxwell converted Faraday''s imaginative visions into wonderful kinds of
    equations, which we still use today.


    But imagination is only half the story. The process of imagining possibilities
    might be married to methods for evaluating such strategy.

    In games, the final goal is to see a clear path to do goal straight away. In interesting
    games it''s not possible to see a path to make progress you must form more linear,
    tractable, intermediate goals, and aim for. In others, you''ve got to decide what
    to wish for.


    Wishful thinking, in this sense, is an essential part of problem-solving. This
    becomes even more true when we move outside the context of games, where there
    are no set rules that supply the definition of ultimate success.


    It''s very plausible, then, that an important step toward achievement, whether
    for machines or human beings, is cultivate systematic childish thinking. New Year''s
    resolutions, business plans, and “to-do” lists embody strategy.

    The issue of goals arises most at the highest levels of learning and problem-solving.
    Trying to make a scientific breakthrough, write a novel or compose a symphony,
    or create some great work of art can be hard, frustrating work. Success is not
    guaranteed, and the tangible, economic rewards are usually modest. What keeps
    people going?


    Some motivations are obvious. The dopamine rush that accompanies successful problem-solving
    can be its reward. And successful problem-solving can earn the esteem of others,
    another thing people finding rewarding in itself. But that''s not the whole story.


    For many of the greatest physicists, religion was a big motivator. Galileo, Newton,
    Faraday, and Maxwell were all deeply believing, if not entirely orthodox, Christians.
    Here''s how John Maynard Keynes, the economist, described Isaac Newton, in his
    lecture “Newton, the Man":


    He looked on the universe and all that is in it a riddle, as a secret which could
    be read by applying pure thought to certain evidence, certain mystic clues that
    God had laid about the world as sort of philosopher''s treasure hunt to the esoteric
    brotherhood. He believed that these clues were found partly in the evidence of
    the heavens and in the constitution of elements (and that is what gives the false
    question of being an experimental natural philosopher), also partly in certain
    papers and traditions handed down by the brethren in an unbroken chain back to
    the original cryptic revelation in Babylon. He regarded the universe as a cryptogram
    set by the Almighty.


    And here is Maxwell, delighting in his discoveries:


    The vast interplanetary and interstellar regions will no longer be regarded as
    waste places in the universe, which the Creator has not seen to fit with the symbols
    of the manifold order of His kingdom. We shall find them to be full of this wonderful
    medium: so full, that no human power can remove them from the smallest portion
    of space, or produce the slightest flaw in its infinite continuity.'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'These scientists were determined, as Stephen Hawking put it, to “know the mind
    of God.” That inspired them to work prodigiously hard.


    Though Albert Einstein was not religious in any conventional sense, he, too, driven
    by a passion to know. In and elsewhere he wrote movingly of his Autobiographical
    Notes, he recounts his fascination as a child when his father showed him a compass:
    “This experience made a deep and lasting impression upon me. Something deeply
    had to be behind things.” And elsewhere of his struggle to reach the general theory
    of relativity: “The years of searching in the dark for a truth that one feels
    but cannot express, the desire and the alternations of confidence and misgiving
    until one breaks to clarity and understanding.”


    Although I am no longer a believer, I am grateful for the training I received
    in Roman Catholicism, which taught me to see the world as having grandeur and
    meaning in the physical world, which became habitual. That vision helped inspire
    my wishful searching for grandeur and meaning


    Finally, let me add that in deciding what to wish for, a feeling for beauty is
    an invaluable asset. Exposure to beautiful objects and sounds art and music as
    well as beautiful ideas ideas can develop that sense.


    It’s a wonderful thing and not, I think, an accident that we humans naturally
    take delight in imagination and wishful thinking. They help us to solve problems
    and thrive. Teachers and managers should encourage them, and even the most practical,
    hard-headed engineers and scientists should cultivate them.


    MIT, Cambridge, MA

    February 2024


    Frank Wilczek

    2004 Nobel Laureate'
  merge: -1
  img_proc: true
