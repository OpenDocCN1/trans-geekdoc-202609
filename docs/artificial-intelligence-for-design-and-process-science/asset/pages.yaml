    # Literature Review


    The ability to capture, integrate, and process heterogeneous manufacturing data
    is central to supporting the tenets of smart manufacturing discussed in this chapter:
    digital twins, customizable products, and meta-programming languages for manufacturing
    environments.


    # 2.1 Digital Twins


    Grieves first introduced the concept of DTs back in 2003 [2]; however, the rapid
    development of DT-enabling technologies, including simulation, data acquisition,
    communication sensors, visualization, cloud computing, and big analytics, have
    only recently emerged. These triggered the transformation of the DT from being
    a concept to its application and development in various fields [6].


    With the growing attention to the concept and development of DTs, several analytical
    and state-of-the-art articles have been published recently [6–9]. The study in
    [7] provides a categorical literature review of DT in manufacturing, distinguishing
    between Digital Models (DM), Digital Shadow (SD), and DTs. DM is defined as a
    digital representation of an existing or physical object that does not use automated
    data exchange between physical and digital objects. SD is another automated one-way
    data flow between the state of an existing physical object and a digital object.
    The students then concluded that the literature focusing on the highest-level
    development in the form of DT is rare and compared to DM and DS. The work presented
    in this article aims to fill this gap.


    The authors in [9] present the challenges and revolutionary technologies for the
    Internet of Things (IoT), artificial intelligence (AI), and DT in the domains
    of manufacturing, healthcare, and smart cities. They define DT as a simple bidirectional
    integration of data between physical and virtual machines. In a parallel context,
    the research in [8] investigates the correlation and differences between cyber-physical'
