- pgno: 144
  md: '# 3.1 Embedding Space


    Network architecture optimization needs to represent the space of applicable networks,
    and if using RL, an action space of network modifications. To efficiently represent
    the set of networks for a deep learning system, like Luo [18], we map a network
    description language into an embedding space using an encoder-decoder component.
    This lower-dimensional latent embedding also defines a continuous action space
    as displacement vectors in the embedding space. The embedding vector, augmented
    with a feature vector encoding the problem for which the network architecture
    is to be optimized, provides the states for the RL problem, while displacements
    in the embedding space provide the RL learner''s action space.


    One problem with such a derived embedding space is that it can fracture the space
    of legal network embeddings into disconnected regions.


    While this does not affect local optimization using gradient ascent as in [18],
    it makes RL policies for optimization more difficult as they need to cross regions
    of the embedding space that do not validate network architectures. To address
    this and condense the space of legal networks, a Siamese neural network (SNN)
    [b31] is used here in the encoder structure to organize the embedding space into
    coherent legal network regions.


    # 3.2 Reinforcement Learning


    RL [25] is used here as it allows to learn from quantitative feedback and thus
    addresses the problem in network architecture optimization that optimal network
    embedding configurations for the target problems generally are not known. Utilizing
    the network embedding space, RL operates here by executing actions in embedding
    space to modify the network architecture and observing resulting reward in the
    form of changes in actual or predicted network performance. Based on this, a value
    function is estimated, and a policy learns optimizes the rewards. Figure 1 shows
    this basic operation of the RL learning agent.


    +   1. Value function: The Q-Value estimates performance as the expected utility
    of the learning agent in state when performing action a and thereafter following
    policy (π). This value function not only considers immediate reward feedback,
    r(s,a) but takes into account future payoffs.


    ```

    $Q_x(s,a) = \sum_{s''} P_{ss''}^a r(s,a) + \gamma \sum_{a''} \pi(a''|s'')Q_x(s'',a'')$

    ```


    The Bellman equation \cite{b14} provides the basis for performance estimation
    estimation and policy learning.'
  merge: -1
  img_proc: true
