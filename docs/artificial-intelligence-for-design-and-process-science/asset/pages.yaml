    # 6 Conclusions


    Finding network architecture is essential for the success of deep learning systems.
    This chapter presents a novel deep learning framework that uses reinforcement-learning
    to learn a network architecture policy that transfers across target problems the
    world without needing for significant retraining.


    The proposed approach optimizes networks in a learned embedding space constructed
    using an autoencoder and Siamese network. Using this and a performance predictor,
    an actor-critic RL component is trained, which uses the embedding vector as network
    representation as well as specific features to learn a policy for network architecture
    optimization over the continuous action space of embedding spaces. Initial experiments
    using classification datasets from the UCI repository show that the proposed system
    is able to successfully learn an embedding space as well as a policy that derives
    network architectures are close to optimal even for not-before-seen test problems.'
