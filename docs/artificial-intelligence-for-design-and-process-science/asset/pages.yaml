    # 4.2 Accuracy Model


    As accuracy prediction is problem specific, the accuracy model’s input is comprised
    of the concatenation of the embedding and a “problem description” feature vector.
    Using this, it predicts a performance measure for the network for the target problem
    as well as whether the embedding space corresponds to a legal architecture. It
    serves to help organize the embedding space and to generate simulated rewards
    in order to minimize the amount of network training. The example layered architecture
    used in the experiments later is shown in Fig. 7.


    During the first training phase encoder-decoder and accuracy models are trained
    together using a loss function that includes reconstruction loss as MSE, embedding
    consistency loss from the Siamese network, as well as accuracy prediction and
    legal network identification losses.'
