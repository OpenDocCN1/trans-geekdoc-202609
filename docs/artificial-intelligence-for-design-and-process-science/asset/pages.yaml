    # # Introduction


    Large language models (LLMs) have become the convention in the field of natural
    language processing in recent years. The preference for LLMs can be attributed
    to their performance gains in a wide variety of NLU tasks, including question
    answering, textual entailment, sentiment analysis, and commonsense reasoning [1–3].
    As LLMs scale up, their performance gains not only compete with but also exceed
    human performance on language understanding benchmarks [4, 5]. Whether such performance
    gains are meaningful depends on the quality of the evaluation metrics and the
    relevance of benchmarking schemes [6, 7].'
