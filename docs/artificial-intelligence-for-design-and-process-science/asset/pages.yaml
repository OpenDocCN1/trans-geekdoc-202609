  md: '# The Philosophy of Intelligenticism and Its Implications on...


    conflicts in outcomes (telopolarity); Greek telo, meaning “end” or “goal”), and
    moral concerns about the potential consequences of machine advancement (virtuamancia);
    Latin virtu, meaning “virtue”; Greek dynamis, meaning “power” or “force”), and
    the role of temporal elements (temporal fusion); Latin tempus, meaning “time”.
    The likelihood that these computers surpass human intelligence rises as they continue
    to develop at an unprecedented rate [10, 11]. These viewpoints analyze the philosophical
    ramifications and future interactions between humans and intelligent beings. By
    tackling this subject from a philosophical angle, we intend to draw attention
    to the pressure to consider how intelligent robots will fit into our future society
    [12].


    Intellectualism is a school of thought that emphasizes rational thought, and human
    intelligence. Notable thinkers like Socrates, Plato, and Kant, who highlighted
    the value of human reason and knowledge in comprehending and influencing the universe,
    have an influence on it. The “transcendental idealism” approach, which Kant popularized,
    sees human mind as an active maker of knowledge rather than a passive receiver.
    To understand, navigating the environment using created models, or “Erkenntnis”,
    is what Kant defines as intellectualism [13].


    In reaction to the rapid development of intelligent robots, a new philosophical
    idea known as Intelligenticism has developed. It provides a new viewpoint for
    navigating the shifting terrain of AI. By considering the place of AI-powered
    robots in our intellectual framework, this idea goes beyond the confines of conventional
    human-centric intellectualism. Intelligenticism pushes us to develop a thorough
    grasp of these complex systems while exercising caution when giving computers
    the ability to make decisions. It highlights how crucial it is to strike a balance
    between AI’s potential and human intelligence. It also emphasizes the need to
    reconsider how we perceive intelligence, its role in society, and the moral ramifications
    of empowering artificial intelligence. In essence, Intelligenticism expands the
    definition of intellectualism to take into account the function and significance
    of AI in our philosophical framework.


    Due to the widespread use of AI and its increasing dominance in information and
    communication technologies (ICT), the IS discipline is in a unique position to
    adopt the concepts discussed in this [1, 2, 12]. We believe that this study will
    serve as a springboard for a deeper and more reflective investigation of the function
    of AI and the complex relationships that will influence humankind’s destiny. We
    intend to advance a future in which people and machines coexist peacefully by
    incorporating Intelligenticism into the IS field as a starting philosophical framework
    to help traverse the fast-evolving world of AI powered by contemporary AI.'
