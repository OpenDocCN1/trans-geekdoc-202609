- pgno: 142
  md: '# Introduction


    Deep neural networks have become a versatile tool for a range of problems [1]
    with successes in many challenging applications, such as speech recognition [2],
    image recognition [3, 4], and machine translation [5–7]. Along with this success
    is a paradigm shift from feature designing to architecture designing, e.g., from
    SIFT [8] and HOG [9] to AlexNet [4], VGGNet [10], GoogleNet [11], and ResNet [12].
    However, the performance of these systems tends to be highly sensitive to the
    specific network architecture and the available dataset. Although the effort of
    many tools requires expertise and time. Even simple choices as the architecture
    hyperparameters for multilayer perceptrons (MLP), i.e., the number of hidden layers
    and units, are complex decisions with significant impact on performance on specific
    dataset [13]. This difficulty of designing architecture emphasizes the need for
    Automatic Neural Architecture (ANA) design [14].


    Despite the fact ANA design has been a topic of research for many years, current
    approaches tend to suffer from limitations in terms of their ability to address
    larger network architecture spaces [15, 16] or to transfer problems within a domain
    without requiring complete re-training on the new target problem [17–19]. The
    former is usually due to the use of a discrete,specific set of network transformations
    that can be used during optimization, while the latter stems from the use of a
    local architecture search procedure that relies on frequent re-evaluation and
    retraining during the local optimization process.


    The goal in this chapter is to develop a more general framework that uses reinforcement
    learning with a flexible architecture modification action space that allows to
    represent a broader domain through architecture embedding and that facilitates
    planning through a performance prediction [20] component to learn a transferable
    policy for architecture optimization. Initial experiments in this chapter show
    that the framework, trained on a set of classification problems, can successfully
    learn a policy that results in an optimized architecture on a new problem without
    need for retraining.


    # Related Work


    Different aspects of the Automatic Neural Architecture (ANA) modelling procedure
    have been studied, except to the practice of repetitive trial and error, which
    is time-consuming and produces uncertain results [17]. Reinforcement learning
    (RL) has been effectively used to learn a policy to incrementally build neural
    network classifiers for a specific problem'
  merge: -1
