    # Overconfidence in LLM Decisions Examining model performance extends beyond accuracy
    metrics. Recent works also include a scrutiny of confidence scores for incorrect
    predictions. [19] demonstrated models to produce overconfident predictions for
    data samples with shortcut or trigger patterns, irrespective of the ground truth.
    This mismatch between model confidence and actual accuracy leads to the phenomenon
    known as miscalibration, impacting the reliability of models in real-world applications.
    Ideally, a well-calibrated model assigns high probabilities to correct and low
    probabilities to incorrect decisions, aligning predicted probabilities with observed
    events.


    The rising deployment of neural network architectures in high-risk real-world
    scenarios has prompted extensive research into calibration [14, 22, 23]. Evaluations
    of neural network reliability indicate that their confidence predictions are often
    poorly calibrated and overconfident [24, 25]. Recent studies have extended these
    findings to pre-trained language models and that fine-tuning exacerbates miscalibration
    [26–29]. This is attributed to the excessive parameterization of the models, leading
    to overfitting on the training data. The attention garnered by pre-trained language
    models from strings to exhibit confidence during training, regardless of prediction
    accuracy [30]. However, these models showcase calibration deterioration in out-of-domain
    scenarios [27]. Notably, smaller models demonstrate improved calibration on in-domain
    data, while larger models exhibit better calibration on out-of-domain data [31].
    These findings underscore the current inadequacies of pre-trained language models
    in terms of confidence calibration and reliability in decision-making.


    # 3.2 Improving NLU amid Shortcut Learning


    The current paradigm in natural language understanding and evaluation in LLMs
    revolves around alleviating shortcut learning to prevent inflated NLU task scores.
    Strategies such as ensemble learning and adversarial datasets are employed to
    diminish the impact of shortcuts, followed by the assessment of NLU task performance.
    More robust evaluations extend to measuring model generalization by assessing
    performance on out-of-distribution datasets


    Data-Centric Approaches Recent approaches to enhance model robustness and mitigate
    the impact of spurious cues involve the creation of datasets curated examples
    that reduce model reliance on shortcuts during task learning. Incorporating adversarial
    data points during both training and evaluation, such as mirroring linguistic
    artifacts around labels, has also been shown to diminish the impact of spurious
    cues on model learning [8, 15]. [15] demonstrated a notable decrease in model
    performance when assessed on an adversarial test set,'
