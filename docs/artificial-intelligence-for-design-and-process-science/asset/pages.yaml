    # 4.3 Impact of Shortcut Removal


    Understanding the magnitude of the impact of shortcut removal on LLM performance
    is a crucial challenge. The decline in LLM performance in the absence of a handful
    of shortcuts underscores the need for a nuanced understanding of the consequences
    of shortcut mitigation strategies.


    Du el. [9] also showed that model training exacerbates learning of superficial
    cues due to incentivizing training loss, which rapidly reduces when the model
    focuses on the head of word distribution, containing many shortcut features instead
    of the tail. It is reiterated in [20], i.e., since the majority of training examples
    are not representative of the real-world data distribution (including the challenge
    data), minimizing the average training loss is not a legitimate objective. They
    solve this problem by modifying loss for known dataset biases but maintain that
    it is a challenge for unknown dataset biases and cases with incomplete taskspecific
    knowledge.


    A way forward We need more works that toward measuring the impact of shortcut
    removal on LLM performance on NLU tasks. While most prior utilize out-of-distribution
    accuracy, the types of datasets and the hardness of samples need to be systematized
    and defined to understand how different distribution shifts impact model behaviors.


    # 4.4 The Caveats of Incentivizing Training Loss


    Understanding the impact of model training on the learning of superficial cues
    is crucial in the realm of natural language processing. Recent research demonstrated
    that model training exacerbates the learning of superficial cues [9, 20] because
    the optimization process incentivizes the reduction of training loss, which rapidly
    decreases when the model prioritizes the head of word distribution, rich in shortcut
    features. Consequently, minimizing the average training loss may not be a legitimate
    objective. To address this issue, prior works propose modifying the loss function
    for known dataset biases. However, dealing with unknown dataset biases and cases
    with incomplete task-specific knowledge remains a challenge.


    A way forward There is an imperative need for the reevaluation of the incentives
    linked to training loss reduction in LLMs. We must delve into alternative training
    and post-processing strategies that prioritize the acquisition of meaningful linguistic
    patterns, rather than the incorporation of shortcut features. This involves a
    fundamental shift in training objectives to better align with the actual distribution
    of real-world data. To ensure the reliability and accuracy of LLMs across diverse
    language tasks, it is important to investigate the interplay between model generalization
    and calibration. This exploration will contribute to the development'
