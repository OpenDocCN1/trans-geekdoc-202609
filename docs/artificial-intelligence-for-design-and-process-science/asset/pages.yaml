  md: 'links his conception of technology as a medium for revelation to nuanced view
    of intelligence.


    Heidegger clarifies the dangers of “calculative thinking,” a paradigm he believes
    is intimately linked to technology, in parallel. This type of thinking, which
    is driven by numbers and efficiency, may undercut intellect or understanding on
    a deeper level. It allows us to adopt a dominant role as ‘earth’s lords,’ but
    it hides the essence that makes this possible: our alignment with specific conception
    of being [23]. Heidegger elaborates on this by criticizing modern propensity for
    a subject/object framework, which is pervasive in the context of technology. He
    claims that humans do not create the reveal of things, this viewpoint contradicts
    intelligence. Instead, we discover that we are participating in and executing
    traditions that are not of our making [24].


    In conclusion, Heidegger’s philosophy exposes a complex relationship between his
    conception of intelligence and his beliefs regarding today. Both are viewed as
    ways to reveal the world and comprehend our place in it. Heidegger cautions readers
    against obsessively using technology to the point where they lose sight of this
    higher degree of intellect. This emphasizes the significance of having a balanced
    viewpoint, embracing benefits of technology while making sure it does not surpass
    our deeper understanding of life and the universe. It appears that these cautions
    have been forgotten in the arms race being played by big tech recent advancements
    in AI, needing a new, contemporary perspective on how to handle this warning from
    Heidegger.


    # 3 Intelligencism


    We find ourselves confronted with a significant philosophical dilemma in a time
    when technological advancement is rising and machine intelligence teeters on the
    verge of surpassing human capability. From this chasm, the idea of “Intelligencism”
    emerges, reflecting the philosophical underpinings of notable philosophers like
    Socrates, Kant, Hegel, and Heidegger. It illustrates how our society is becoming
    more dependent on intelligent machines while struggling with a loss of understanding
    of these systems. The increasing complexity of intelligent robots creates a paradox
    that our development carries run the risk of losing human autonomy as we go further
    into this unexplored region. This paradox necessitates a thorough revaluation
    of our notions of intelligence, their social functions, and the moral implications
    of handing decision-making to machines. We suggest using ANT to investigate the
    complexities of Intelligencism in order to address this complicated problem [8,
    25]. According to this viewpoint, both humans and non-human things, such as smart
    robots, are participants in a complex network that interact and share one another
    in a changing ecosystem. Human and AI coexist in a complicated and dynamic interdependence
    where each influences and interacts with the other. Although this dynamic has
    enormous potential for development and advancement, we must exercise caution giving'
