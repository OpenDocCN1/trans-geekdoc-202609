- pgno: 20
  md: '# Introduction


    Advances in new technologies, including artificial intelligence (AI), have fueled
    the Fourth Industrial Revolution affecting the way people live, work, and relate
    to one another. As part of its 2030 Agenda for Sustainable Development, the United
    Nations, in 2015 set the 17 Sustainable Development Goals (SDGs) (e.g., reduce
    inequality, provide affordable and clean energy, improve health and education)
    which were a call for action in a global partnership in AI innovation and education
    for social good [1]. These goals align with the mission of the California State
    Universities (CSUs), with 21 of campuses being Hispanic-Serving Institutions (HSIs).
    Faculty and researchers from the CSU system have been exploring how AI can be
    used for social good by addressing societal challenges, improving people''s lives.
    This raises two questions for educators: (1) How can undergraduate students learn
    AI so they are equipped with the necessary skills for the future workforce and
    become tomorrow''s citizens and leaders? (2) How can student engagement and learning
    in AI be increased to reduce the equity gap in AI education?


    The AI For Social (AI4SG) project aims to bring AI education by developing and
    studying the efficacy of innovative learning practices and resources for AI for
    social good. We have developed three learning modules for students to (1) identify
    social issues that align with the SDGs in their community (e.g., poverty, hunger,
    quality education), (2) learn AI through hands-on labs and business applications,
    and (3) create AI-powered solutions to address social issues they have identified.
    Students are expected to simulate AI learning in their communities and contribute
    to their communities. Students then use the modules to engage in an interdisciplinary
    approach, facilitating AI learning for social good in management information systems,
    geography, and computer science at three CSU HSIs (San Jose State University (SJSU),
    Cal Poly Pomona (CPP), and CSU San Bernardino (CSUSB).


    # Related Work


    # Culturally Responsive, Relevant, and Sustaining Pedagogy (CRRSP)


    Culturally Responsive, Relevant, and Sustaining Pedagogy (CRRSP) is a student-centered
    teaching framework, drawing upon decades’ work of research [2–6], that recognizes
    and affirms students'' racial, linguistic, and cultural identities to develop
    their agency, encourage academic rigor and critical thinking skills, uplift marginalized
    voices, and empower students to become agents of change through a strong development
    of their sociopolitical or cultural consciousness. CRRSP recognizes and responds
    to students’ identities and needs by using cultures, experiences, and'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# AI for Social Good Education Through a Culturally Responsive Pedagogy


    narratives of culturally diverse students as resources for their own learning
    and the teaching of peers [7]. Teaching that recognizes the cultural characteristics,
    experiences, and perspectives of culturally diverse students affirm the cultural
    knowledge and skills that their communities offer the classroom [3]. CRISP realizes
    that student learning is impacted by factors that go beyond the classroom [3,
    7]; integrating students'' communities of Color''s knowledge and skills into classroom
    learning normalizes the knowledge and skills of Color, enriches classroom learning,
    and promotes a curriculum that is accessible and relevant to all students [5],
    thereby increasing students'' social, cultural, and academic engagement [8–11].


    CRISP does not replace rigor with inclusion or vice versa; rather, it empowers
    students intellectually, "socially, emotionally, and politically" [5] (p. 159).
    Because CRISP integrates community and diverse academic knowledge of society,
    others, and themselves [5, 7, 12]. A culturally affirming instructor mandates
    practices that systematically foster success and empower students to answer critical
    questions [2, 13]. Through the development of student agency, CRISP builds students''
    critical literacies to connect their lives/examples of oppression in curricula,
    institutions, and disciplines [14].


    In contrast CRISP''s concern with connecting students'' identities, cultures,
    and communities to the classroom, past research has missed the lack of diversity
    in particular fields, including computer science (CS). CS has historically been
    inaccessible to marginalized groups, women, and students from working communities
    [15]. Work has been done to take a culturally affirming approach to CS education
    by examining and diversifying what are produced, how courses are taught, and how
    to deepen student participation [16, 17]. From this work, culturally responsive
    computing (CRC) has emerged on the principles of CRISP to challenge the status
    quo in computing [18, 19].


    CRC promotes equity in STEM by rooting the curriculum in a social critique lens
    [19, 20] to leverage the linguistic assets of the local community and students
    [21, 22]. Through CRC, students engage and challenge political, economic, and
    social issues, addressing oppressive conditions they have experienced. CRC has
    five tenets that support a culturally responsive environment: (1) every student
    is capable of digital innovation; (2) the learning context must support the use
    of technology; (3) learning should be about one''s self along various sociocultural
    lines that allow for technical innovation; (4) technology should be a vehicle
    for students to reflect and demonstrate understanding of their intersection identities;
    and (5) standards for technological success must consider who creates, for whom,
    and to what end, rather than that ensures socially and culturally irrelevant [19].
    In sum, CRC''s goals are similar to those of CRISP: to create an educational (computing)
    environment that values student/family/community expertise, provide opportunities
    for collaboration with local community organizations and community experts, and
    to focus not'
  merge: -1
  img_proc: true
- pgno: 22
  md: '4


    Y. Chen et al.


    only on the content (i.e., tool design) but also on the design and implementation
    of CRC curricula [22].


    Past examples of CRC demonstrate the connection it has to CRSP. Examples include
    girls using digital technology to educate their local community about relevant,
    but stigmatized, social issues (e.g. pregnancy) [23], using “social GIS” to explore
    social justice issues with science and mapping tools [24], using computational
    skills to share Indigenous knowledge and language [20], and with young women to
    develop a Zambian Women’ Rights mobile app [25]. Past research has established
    that when students are encouraged to embody their identities, cultures, and communities
    into STEM learning and computing, students’ motivation is enhanced, which has
    the power to increase student agency and STEM participation [10, 26]. Teaching
    through a CRC lens creates opportunities to align the goals of students and community
    members through a collaboration that leverages “community assets” that are relevant
    to the students and their lived realities [22] (p. 5) while promoting equity in
    CS [27].


    # 3 AI4SG Curriculum Design


    We designed AI learning modules called “AI for Social Good (AI4SG)” to educate
    undergraduates from STEM and non-STEM backgrounds. These instructional modules
    are a result of interdisciplinary work from the research team and are based on
    CRC and targeting sustainability as an application case [20]. CRC is particularly
    suitable for interdisciplinary, community-based, and inclusive AI due to its five
    tenets: (1) all students are capable of digital innovation, with varying levels
    of learning support and application; (2) the learning contexts support transformational
    use of technology, modules will be designed to address relevant social issues
    in students’ communities; (3) learning should be about one’s self along intersecting
    sociocultural lines that allow for technical innovation, modules are interdisciplinary
    and the exchange of cultural values will be incentivized; (4) technology should
    be vehicle in which students reflect and demonstrate understanding of their intersectional
    identities, modules will be designed for students to express and bring their full
    self into the practice and community; (5) barometers for technological progress
    should consider who creates, for whom, and to what rather than endures culturally
    and irrelevant curriculum, modules will emphasize the importance of social good,
    community, and ethics in AI, allowing students to contribute to their communities
    as they learn AI. In addition to CRC, the project also incorporated sustainability,
    particularly the Nations’ Sustainable Development Goals (SDGs), into the AI4SG
    modules. This integration aims to educate students about the role of AI in achieving
    these global goals and encourage them to consider sustainability in their AI projects
    as a case for social good.'
