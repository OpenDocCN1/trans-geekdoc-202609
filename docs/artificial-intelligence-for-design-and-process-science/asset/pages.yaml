  md: '# Compound Noun Phrase Similarity in Bidirectional Transformer Language Models


    # 3.1 Generating Compound Noun Phrases and Analysis of Uncommon Phrases


    Our research methodology was designed to focus on generating and analyzing compound
    noun phrases, delving into the nuances of semantic relationships within these
    phrases. We began by selecting a set of base nouns related to culinary items,
    specifically drink, salad, smoothie, chicken, and duck. These were chosen to cover
    a diverse range of food categories, ensuring a comprehensive examination of semantic
    interactions. To modify these nouns, we chose a variety of modifier nouns, starting
    with those that were closely related (e.g., edible fruits such as kiwi, strawberry,
    orange, apple) and then expanding to include modifiers with a broader semantic
    scope to explore a wide semantic field, from modifiers with direct relevance (e.g.,
    orange with apple) to systematically varying the semantic scope between the base
    nouns and their modifiers, we enabled a detailed exploration and interpretation
    of how semantic proximity and diversity influence the formation of compound noun
    phrases.


    In the analysis phase, we excluded noun phrases deemed extremely uncommon, as
    apple chicken, apple duck, chocolate salad, green chicken, green duck, kiwi chicken,
    kiwi duck, strawberry chicken, and strawberry duck, to maintain a focus on more
    commonly encountered combinations. However, we chose to include chocolate chicken
    and chocolate duck to evaluate their capabilities. In order to evaluate the models''
    capability to grasp nuanced semantic changes from modifier substitution, we measured
    the cosine similarities between compound noun phrases and their semantic similarity
    within compound noun phrases, enhancing our insights into the modified versions.
    Through this methodology, we aim to offer an exploration of semantic similarity,
    the cognitive processing of language and the potential of transformer encoder
    models in capturing complex semantic relationships.


    # 4 Results and Discussion


    In this study, we examined the effects of modifications on noun phrases, specifically
    focusing on two types of phrases as $N_1$ and $N_2$, to test many hypotheses.
    Our analysis uncovered that modifications made to the first noun typically resulted
    in a greater degree of similarity compared to changes made to the second noun
    in the noun phrase, which lends support to our first hypothesis. This trend is
    demonstrated in various contexts, as shown in Fig. 1.'
