  md: '# 4.3 RFCM


    Second, we perform Report Feature Correlation Matrix (RFCM), which converts reports
    generated from the database''s data to create a feature graph (graph structure)
    that contains correlation data between features to represent business knowledge.
    With permission to access the reporting module of the system that uses the database,
    we explore the reporting module and record on a per-report basis and record properties
    and keywords related to the report. The keywords are grouped according to where
    they are found in the report generation process, e.g., scope of report, group
    by parameters, and report attributes. These keywords are refined by searching
    online resources, and then a graph is made based on how often the keywords are
    found together. The graph structure is used to estimate the Markov blanket [7]
    of a target label based on its keyword.


    # 4.4 Relating DAFHR to RFCM


    Third, we relate DAFHR to RFCM by linking the “database domain” and “business
    domain,” respectively, using the knowledge gained from the keyword search. The
    keywords are linked to tables on the tables’ names or their column names.


    # 4.5 Feature Selection


    Finally, we perform the selection process by selecting the target label concept
    in the RFCM/business domain and selecting the related relevant data in DAFHR/database
    domain.


    # 4.6 Data Mining and Evaluation


    After FSbP is performed, the data undergoes further selection and combined propositionalization
    and harmonization. For propositionalization and harmonization, a standard set
    of definitions is made for selected features from the five databases including
    the label, which is the oil-drilling phase duration.


    As part of the data mining step, several preprocessing methods are used to determine
    the most effective methods.


    The dataset is split 70/30 for training operations (randomly selected with identical
    seed values) and testing operations, and training is done with a tenfold cross
    validation, also splitting by operations instead of phases. This is because one
    oil drilling operation involves several phases that are pre-determined.'
