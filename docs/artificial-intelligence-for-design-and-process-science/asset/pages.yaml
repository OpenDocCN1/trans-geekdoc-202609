    # 2.3 Product Models, Data Exchange Standards, and Meta-programming Languages


    Product model and data exchange standards that can be used in conjunction with
    product engineering include the ISO-10303 and the MTConnect standards. The ISO10303
    standard (www.steeptools.com) describes how digital product information is represented
    and exchanged, enabling companies to unify all product associated with individuals
    throughout their life cycle. The MTConnect standard (www.mtconnect.org) defines
    a semantic vocabulary for manufacturing plants to provide structured contextual
    data without their proprietary format. It is clear that product engineering and
    digital twins require more expressive constructs than those offered by the product
    model and data exchange standards examined above. Much effort has been put into
    the development of ontology approaches such as AutomationML (www.automationml.org).
    It is an open, neutral, XML-based data exchange format that allows the transfer
    of design data from production systems.


    Other efforts have focused on enhancing the complexity of automated systems by
    proposing programmable logic controllers (PLCs) and domain-specific languages
    (DSLs) [17] for model-driven development of automated processes [18]. DSLs raise
    the level of abstraction beyond programming by specifying the solution directly
    in terms of domain concepts. A typical example is the Systems Modeling Language
    (SysML) [19]. SysML captures functional and nonfunctional requirements, mapping
    abstract features to factory machine operations, and generates code for the appropriate
    runtime environment. In addition, an orchestration engine has been developed to
    accommodate the adaptation of automated systems in operation and the physical
    changes in the environment [20]. However, until now, little has been placed on
    developing appropriate abstraction mechanisms to bridge the components of the
    digital and physical worlds.


    Significant efforts are reported in [21], where the authors introduced the idea
    of digital twin derived from a product version creates assembly plans and synthesizes
    the resources in a manufacturing cell.


    To avoid problems as those mentioned above, meta-programming languages can be
    used [22]. A meta-programming language invokes a program that'
