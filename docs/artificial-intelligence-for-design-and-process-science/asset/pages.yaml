- pgno: 4
  md: '# Foreword


    It is indeed a great pleasure to write a foreword for this book dedicated to Professor
    Murat Tanik and Professor Bernd Kraemer, my two great friends. This book, the
    result of a one-day workshop in Hawaii in January 2024, touches upon a variety
    of topics yet consistently highlights three crucial concepts: artificial intelligence
    (AI), transdisciplinary thinking, and human responsibility. The convergence of
    these concepts creates a prime solution space for solving the truly tough economic,
    environmental, and social planetary problems.


    The leveraged power of transdisciplinary thinking, when supported and augmented
    by AI, increases the likelihood that humanity will develop solutions to the numerous
    existential crises currently looming. A deep commitment to human responsibility
    can guide the development of those solutions along moral and ethical pathways.


    # The Proper Use of AI


    With massive processing power, continuous learning, and access to large datasets,
    AI can elevate rather than replace humans in problem-solving and decision-making.
    In arenas where human judgment and ethical considerations are paramount, with
    healthcare and public policy, AI enhancement can prevent problems such as cognitive
    bias and decision fatigue. AI should remain in a supportive role bounded by ethical
    guardrails, which involves creating and using AI systems that are fair, transparent,
    and accountable. This includes considerations like avoiding bias in AI algorithms,
    ensuring AI decisions are explainable, and respecting user privacy.'
  merge: -1
  img_proc: true
- pgno: 5
  md: '# The Importance of Transdisciplinary Thinking


    Transdisciplinary approaches involve a rich interplay of technology and diverse
    fields of expertise, such as computer science, biology, economics, and social
    sciences. Collaborative environments where specialists from different disciplines
    work together can lead to innovative solutions that do not emerge within the silos
    of individual disciplines. AI can process and analyze the vast amounts of data
    that such collaborations generate, identifying patterns and insights that are
    not obvious. This broad integrated perspective helps in developing more robust,
    adaptable, and effective solutions.


    # Human Responsibility


    While much attention is focused on developing ethical AI, human responsibility
    has far more significant implications. The blunt fact is that we have become an
    irresponsible society on a global level. Perverse societal incentives drive deeply
    damaging acts, such as the burning of the Amazonian rainforest or dumping of toxic
    waste in the poorest parts of the ocean by multinational companies. In many countries,
    consumers carefully sort recyclables, only to have these plastics burned or dumped
    into the ocean, which has contributed to the formation of the Great Pacific Garbage
    Patch, a vast area of floating debris twice as large as the state of Texas.


    The previous examples highlight that today''s tough problems do not fall under
    the jurisdiction of any single country or region, which makes them the responsibility
    of all humanity. As these problems are complex and subject to dramatic changes
    over time, a solution space that also changes, in response to conditions, is ideal.
    For instance, on a small scale the Kapiʻolani Medical Center for Women & Children
    in Honolulu, Hawaii, is a responsive solution space. Care teams are transdisciplinary,
    composed of members from various specialties and areas of expertise, and combining
    conventional medical treatments with alternative therapies. The medical center
    is supported by cutting-edge technology and equipment, and both the teams and
    technology can be upgraded over time in response to need.


    Reviewing this book has been a truly rewarding experience. I wholeheartedly recommend
    it to anyone eager to tackle the societal problems of today and tomorrow!


    Ukiah, CA, USA

    May 2024


    Raymond Yeh

    Chairman, SDPS Advisory Board'
  merge: -1
  img_proc: true
- pgno: 6
  md: '# Preface


    The rapid development of generative AI will have a significant impact on the design
    processes of emerging intelligent systems. Debates surrounding these topics of
    current interest must focus on collaborative human-AI decision-making, human-computer
    interaction, and the related improvements to design and process science. This
    collection of selected papers provides a focused overview of what role AI plays
    in the future of design and process of system development with making it more
    relevant and beneficial for our society. It covers such as large language models,
    generative AI. Intelligences, communication dynamics representation, feature selection,
    smart design, and social goodness and demonstrates the general applicability of
    AI to various problems in transdisciplinary domains.


    Yu Chen, Heather Macias, Gabriel Granco, Yunfei Hou, and Frank A. Gomez discuss
    how AI will impact education and open opportunities to educate the next generation
    of students from various disciplines to be capable of practical AI skills while
    having the awareness and confidence to innovatively contribute to their communities.
    They present a special project called AI for Social Good (AI4SG) is illustrated
    by deploying the special curriculum among 54 undergraduate students in management
    information systems, geography, and computer science at three universities and
    evidenced by the report showing increased level of interest and curiosity in learning
    among the students, appreciation for project-based learning, and development of
    learning space within and beyond the classroom.


    Lorong Pan, Frank M. Skidmore, Serkan Guldal, and Murat M. Tanik bring into light
    another aspect of communication dynamics by proposing a new theoretical framework
    and delving into the inherent role of energy within the proposed framework. This
    draws inspiration from Shannon’s communication theory and explores the centrality
    of energy in varying computational models, from classical mechanics to quantum
    mechanics. In it, the confluence of information and energy revealed that information
    transfer necessitates energy interactions.'
  merge: -1
  img_proc: true
- pgno: 7
  md: 'Morteza Zangeneh Sorous, M. Sakib Ullah Sourav, and Yong Zeng present the concept
    of creativity supported by AI as an effective tool to complex cognitive processes.
    Creativity assessment, human-AI co-creation, and team creativity enhancement are
    presented as examples of AI applications to creativity with shortcomings and open
    questions.


    Sang Suh and Swetha Reddy Pathuri introduce an interactive chatbot CSACbot (Computer
    Science as Career bot) developed using neural networks, sentence transformers,
    and PyTorch. This chatbot as an innovative solution to provide comprehensive information
    about the field of computer science, guiding students and parents in making decisions
    about courses, majors, and potential careers. The CSACbot aims to bridge the information
    gap, empowering students to embark on successful academic journeys in computer
    science.


    Christiane Chaves Gattaz, Guait Gabrinho, Joaquim Roberto Campos, Oscar Ivan Palma
    Pacheco, and Quymá S Viana introduce an AI framework for a Business-Centric Living
    Laboratory (BVLL), leveraging Semantic Modeling for Data Analytics, emphasizing
    the contextual nature of data analysis, and recognizing the impact of technologies
    such as machine learning and natural language processing in unlocking business
    potential sustainability. The PRIMETHOD methodology is presented with P3Tech Architecture
    showing how AI revolutionizes process management, value realization, and operational
    excellence in line with ESG and SDG principles.


    Michael P. Papazoglou, Bernd J. Kramer, and Amal Elgalmal present a proven digital
    twin-driven manufacturing approach—called blueprints. This includes a novel manufacturing
    knowledge model and a programming approach to rethink and redesign the whole product
    customization and development process. Manufacturing blueprints promise to realize
    the vision of smart manufacturing by fully digitizing physical assets and processes,
    connecting factory sites and plants to customize outputs, and allocating resources
    to provide a logical shift between the digital and physical realms of product
    customization.


    Ray A. Gonzalez and Julia Rayz investigate the ability of transformer encoder
    models to discern and interpret the distinct meanings of compound nouns, crucial
    for tasks such as uncover insights into the models'' capabilities to comprehend
    the semantic depth of these expressions by using a systematic comparison of similarity
    scores among compound nouns and exploring the effects of modifier and head-noun
    manipulation. They highlight the potential of these models to advance our understanding
    and processing of natural language, promising significant improvements in search
    technologies and the broader domain of NLP.


    Raghav Vadhera and Manfred Huber propose a network optimization policy on an abstract
    problem and architecture embedding which those transfers across problems and thus
    permitting the optimization of networks for new problems without excessive additional
    training in a reinforcement learning framework.


    Geetanj Bihani and Julia Rayz provide a concise survey of relevant research on
    large language models (LLMs) resorting to shortcuts when performing tasks, creating
    an illusion of enhanced performance while lacking generalizability in their'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'decision rules, and presenting challenges in accurately assessing natural language
    understanding in LLMs. They urge more research efforts to be put toward deepening
    the comprehension of shortcut learning, contributing to the development of more
    robust language models, and raising the standards of NLU evaluation in real-world
    scenarios.


    Francis Joseph Costello and Kung Chang Lee propose the novel philosophical concept
    of "Intelligisticism" as a response to the recent impressive developments in AI
    and the proliferation of large language models. They propose and define that Intelligisticism
    consist of four philosophical components such as Anthposia, Telolarity, Virtodynamica,
    and Temporal Bifurcation, delving into the effects of AI''s widespread adoption,
    as they pertain to IS/IT study. A conceptual framework that accounts for the unique
    challenges and issues of deploying and supervising intelligent devices that communicate
    with humans is also addressed in the study.


    Clement Ting, Patrick Then, and Man Lau introduce an automated Feature Selection
    before Propositionalization (FSbP) and compare its characteristics with traditional
    feature selection techniques. They provide a use case for FSbP in KDD for oil
    drilling data, where FSbP is vital for timely project completion, discussing the
    implementation of FSbP algorithms for the oil drilling use case, areas for improvement,
    and limitations of FSbP.


    Overall, this book is a source of inspiration for everyone in the academia and
    research sectors working on the vision of creating a strong, fruitful, and creative
    community of design and process science for social good through evolving and generative
    AI.


    Commerce, TX, USA

    May 2024


    Sang C. Suh'
