- pgno: 192
  md: '# Introducing Feature Selection Before Propositionalization


    In exchange for computation complexity, wrapper techniques provide better predictive
    accuracy estimates than filter models.


    The third category is embedded models, in which the feature selection process
    is embedded as part of the training algorithm, as opposed to being a step in the
    preprocessing stage of machine learning.


    Structured feature selection assumes that the feature space contains features
    that may be dependent on one another. FS strategy depends on the assumed structure,
    either group structure, tree structure, or graph structure.


    J. Tang et al. (2014) [1] provides examples for structured feature selection for
    cases where the group structure has already been inferred. These examples are
    modifications of the embedded method, lasso regularization. Lasso regularization
    generates weights as part of the model optimization process, and feature selection
    is performed naturally when coefficients of features are set at 0 or close to
    0.


    Modifications are based on the structure of the features, which are group structures,
    tree structures, or graph structures.


    When a group structure is assumed, features are put into groups, and feature selection
    is based on the group''s performance instead of an individual feature''s performance.


    Tree structure assumes that features are hierarchical in nature with several levels
    of parent and child nodes, with features at the bottom layer. Nodes are examined
    for feature selection, in which case underperforming nodes and their underlying
    features are discarded.


    Graph structures imply directionless relationships between features, in which
    case the weights of the lasso features are adjusted during selection based on
    related features in the graph.


    T. Gao et al. (2015) [7] treated graph feature selection as a search problem to
    find a target Markov blanket by determining inter-feature relationships, the features
    and creates a Bayesian network determining which may be simplified to "Parent,"
    "Child," "Spouse," and "Descendants." Compared to graph structures, a Bayesian
    network is simply a graph structure with directional relationship.


    Gao et al. noted that the Markov blanket of a target feature, which contains its
    spouses, parents, and child, will contain the minimum number of features within
    the feature space, which also gives the maximum mutual information required for
    a classifier model.


