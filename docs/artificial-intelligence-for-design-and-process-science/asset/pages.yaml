  md: '# AI for Social Good Education Through a Culturally Responsive Pedagogy


    Yu Chen, Heather Macias, Gabriel Granco, Yunfei Hou, and Frank A. Gomez


    **Abstract** The advances of artificial intelligence (AI) have impacted and opened
    opportunities for almost every industry. Meanwhile, it also holds potential to
    address pressing societal issues such as traffic, climate change, and poverty.
    It is crucial to educate the next generation of students from various disciplines
    to be capable of practical AI skills while having the awareness and confidence
    to innovatively contribute to their communities. We introduce the AI for Social
    Good (AI4SG) project that aims to teach AI through the lens of social good to
    students of multiple disciplines. We deployed the AI4SG curriculum among 514 undergraduate
    students in management information systems, geography, and computer science at
    three universities. Students reported increased level of interest and curiosity
    in learning AI, appreciated project-based learning, and developed learning space
    within and beyond their classroom.


    **Keywords** Artificial intelligence · Education · Social good · Interdisciplinary
    education · AI for Social Good · Undergraduate education · STEM education culturally
    responsive pedagogy


    Y. Chen ✉✉

    San Jose State University, San Jose, CA, USA

    e-mail: yu.chen@sju.edu


    H. Macias

    California State University, Long Beach, CA, USA

    e-mail: heather.macias@csulb.edu


    G. Granco

    Cal Poly Pomona, Pomona, CA, USA

    e-mail: ggranco@cpp.edu


    Y. Hou

    California State University, San Bernardino, CA, USA

    e-mail: yunfei.hou@csusb.edu


    F. A. Gomez

    California State University, Office of the Chancellor, Long Beach, CA, USA

    e-mail: fgomez@calstate.edu'
