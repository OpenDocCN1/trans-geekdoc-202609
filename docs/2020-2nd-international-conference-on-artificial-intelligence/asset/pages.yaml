    development of clean energy is essential. As a new type of renewable energy, solar
    energy is an ideal renewable energy due to its high utilization rate compared
    to other energy sources. Photovoltaic power generation is the process of photoelectric
    effect, using solar cells to convert solar energy into electrical energy [2].
    With its increasing popularity, solar energy, as a new form with much potential
    in the world, has become one of the main sources of clean energy in recent years
    [3]. Photovoltaic cells are the core part which has the effect of converting solar
    energy into electricity. However, the conversion efficiency of photovoltaic cells
    is still limited by the complex characteristics of the devices. Solar energy has
    become a hot research and development field of new energy with advantages of harmless,
    huge, and long-term. The high production cost and low efficiency limit its capability
