    # Design of Simulation Model and Research on Output Characteristics of Solar Cells
    Based on Deep Learning


    Dong Zhong*, Dayang Fang*


    *Shanwei Polytechnic, Shanwei, Guangdong, 516600, Guilin University of Technology,
    Guilin, 541004, China

    *scientificai@163.com


    **Abstract—** With increasingly prominent problems of energy and environment,
    solar energy is a new form with the greatest development potential in the world.
    As a new type of renewable energy, solar energy because of its high intensity
    surpasses other energy sources. Solar photovoltaic generation is a direct form
    of power generation that uses photons to convert light into electrical energy.
    In the actual situation, light intensity is not stable, and solar cells (SPCs)
    are affected by other factors, so it is necessary to model the characteristics
    of photovoltaic array to realize the dynamic simulation of photovoltaic power
    generation. In this paper, design the simulation model of solar cells based on
    deep learning, analyze the output characteristics of solar cells. Increasing solar
    radiation, temperature, series resistance and diode reverse correction can improve
    the performance of photovoltaic cells, and increasing open voltage and short circuit
    current helps to improve its output power and efficiency.


    **Keywords—** Photovoltaic power generation, Solar cells, Output characteristics,
    Simulation


