    # 2020年第22届人工智能与先进制造国际会议 (AIAM)


    # 基于深度学习的太阳能电池模型设计及其输出特性研究


    董忠*，方阳*


    *山威职业学院，广东山威，516600，桂林理工大学，桂林，541004，中国

    *scientificai@163.com


    **摘要—** 随着能源和环境问题的日益凸显，太阳能已成为世界上开发潜力最大的新形式。作为一种新型可再生能源，太阳能因其高强度而超过了其他能源。光伏发电是一种利用光子将光能电能的直接发电形式。在实际情况下，光强度是不稳定的，太阳能电池（SPCs）受到其他因素的影响，因此对对光伏阵列的特性进行建模以实现光伏发电的动态仿真。本文设计了基于深度学习的太阳能电池仿真模型，分析了太阳能电池的输出特性。增加太阳辐射、温度、串联电阻和二极管反向修正可以提高光伏电池的性能，增大开路电压和短路电流有助于提高其输出功率和效率。


    **关键词—** 光伏发电，太阳能电池，输出特性，仿真


    ## I. 引言


    随着对能源和环境问题日益日益关注，清洁能源的发展至关重要。作为一种新型可再生能源，太阳能与其他能源相比具有很高的利用率，是理想的可再生能源。光伏发电是光电效应的过程，即利用太阳能电池将太阳能转换为电能
    [2]。随着其日益普及，太阳能作为世界上具有巨大潜力的新形式，在近年来已成为清洁能源的主要来源之一 [3]。太阳光伏电池是具有将太阳能转换为电的核心部件。然而，光伏电池的转换效率仍受限于器件复杂的特性。太阳能已成为具有无害、巨大和长期等优势的新能源研发热点领域。高生产成本和低效率限制了其能力
    [4]。


    由于光伏电池成本高且实际实验困难，仿真已成为研究该领域的主要方法 [5]。在实际情况下，光强度是不稳定的，太阳能电池容易受到其他因素的影响，因此对对光伏阵列的特性进行建模以实现光伏发电的动态仿真
    [6]。


    由于太阳能电池的发电效率受光强度和环境温度的影响，将建立一个太阳能电池模型来研究光强度和环境特的影响 [7]。太阳能是一种利用太阳能板将太阳能转换为电能的直接发电形式。太阳能电池表面有一层薄金属层和芯片。金属与薄片另一侧之间将产生一个恒值，这就是太阳能电池的特性。由于其许多优势，太阳能已成为该领域的热点。光伏发电领域的研究具有广泛意义。基于人脑分析的深度学习形成了更高级的特征，改进了对底层数据的学习，提高了识别和分类能力
    [8]。本文介绍了太阳光伏电池的原理，设计了基于深度学习的太阳能电池仿真模型，并分析了太阳能电池的输出特性。


    ## II. 太阳能光伏电池模型


    太阳能电池是利用半导体材料的光电效应的光伏转换器件，是光伏发电中最小的功率单元和元件。其特性是指电输出 [9]。考虑到天气条件对太阳能电池输出的影响可能远低于平均值，有必要确保光伏阵列的设计和储电池的设计在各种条件下协同工作
    [11]。为了评估 SPC 的发电性能，有必要定量地分析表征其发电能力的一些特性参数及其影响因素。辐照度的高敏感性，辐照强度是影响太阳能电池发电最重要的因素。其次，辐照度的测量应对不同频率的光具有均匀性，以便最真实准确地反映环境中阳光照射在太阳能电池上的影响。


