    # I. INTRODUCTION


    Augmented Reality (AR), a technology that seamlessly integrates the real world
    and the virtual world, enables users to interact with virtual reality. Nowadays,
    it has swiftly gained much to master virtual reality, image processing [1] and
    pattern recognition techniques.


    With the development of increasingly complicated image processing and computer
    vision, the applications of human-computer interactive system have become more
    and more. In 2002, Jin Tsukimoto in Tokyo developed a method of mapping the position
    of real-world objects with the assistance of an infrared generator, which emitted
    a layer of infrared light to the projection plane [2]. When the users'' body or
    object blocked the infrared light, the image was captured by the


