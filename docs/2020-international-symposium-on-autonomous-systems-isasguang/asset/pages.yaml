    **Abstract**—With the rapid development of projection technology, the design of
    projection interactive systems with different scenarios has made progress. Humans
    are no longer satisfied with the traditional way of interacting with computers
    through devices, but are able to obtain a more natural and free mode of interaction.
    Thus, an arrow game projection interactive system is based on deep learning game
    scheme involving various kinds of interfaces developed by Unity3D in order to
    improve user experience. Secondly, a method of mapping the arrow in in the real
    world to the corresponding position of game scene is achieved. Third, recognition
    is recognized by the target detection algorithm YOLOv3. The finally results demonstrate
    that the proposed interactive system has good real-time performance and high robustness.

    **Index Terms**—object detection, convolutional neural network, Unity3D, interactive
    system


