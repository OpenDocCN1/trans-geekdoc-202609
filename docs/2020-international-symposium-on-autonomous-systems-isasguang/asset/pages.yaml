    \ is based on deep convolutional neural networks. The network predicts the position\
    \ from the entire image at once, and the target position is predicted by the bounding\
    \ boxes. It predicts the confidence that the bounding box contains object, and\
    \ the probability that the target belongs to a category.\n\nYOLO3 selects 5 layers\
    \ of 52 neurons(-as a fully connected layer), which has a large number of residual\
    \ hidden layers. To avoid the gradient explosion problem, pooling of convolutional\
    \ layers helps prevent information loss during training.\n\nFor the output, YOLO3\
    \ produces features of three scales, which detect different sizes of target. The\
    \ relatively small and large receptive field of the feature map is used to detect\
