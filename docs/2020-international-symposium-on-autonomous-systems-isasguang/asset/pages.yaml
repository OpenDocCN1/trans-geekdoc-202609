    collision response function is used for the purpose of defining actions when arrow
    hits the target projection plane. Thirdly, a bar is is utilized to adjust the
    difficulty of game by increasing or decreasing the response area. Finally, gain
    arrow coordinates from text in a certain period, generate a virtual arrow in Unity3D
    software and similar the next flight trajectory. The game scenarios are shown
