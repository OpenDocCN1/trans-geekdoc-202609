    # II. DESIGN OF AR PROJECTION INTERACTIVE SYSTEM BASED ON DEEP LEARNING


    In our passage the hardware composition of the arrow game interactive system on
    deep learning consists of a projector, an USB camera and a PC. The projector that
    connects to the PC projects the scene onto the walls. The camera by USB interface
    captures images in real time, which will be sent to the PC for image processing
    and targeting. What''s more, the projector and camera are facing in the same direction.
    The entire structural design of the system is shown in Fig. 1.


    ![](img/3e0c467946d9c60efd092f9af7a7da3c_1_0.png)


    Fig. 1. The structural design of the interactive system.


    Because users'' experience is an important evaluation standard of the human-computer
    system, several kinds of game scenes such as shooting target, forest shooting,
    snow shooting snowman and mountain shooting shooting, are developed by Unity3D,
    a 3D game development engine. So the real flying and vivid objects in 3D scenarios
    all create an immersive experience for the users. In some degree, these unique
    animations can enhance


    the work of our pass is to develop an arrow game scene including varieties of
    interfaces by Unity3D; to achieve arrow position mapping to the corresponding
    position of game scene based on Hough detection [10] and homotopy transformation
    [11]; to collect and label plenty of data in different interfaces; to realize
    recognition using the improved object detection algorithm based YOLOv3; to train
    and validate target recognition network based on deep learning.


    # III. ALGORITHMS OF THE SYSTEM REALIZATION


