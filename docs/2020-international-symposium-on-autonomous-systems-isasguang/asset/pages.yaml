    # V. ANALYSIS FOR THE SYSTEM


    # A. System Performance Test


    The Precision-Recall curve, an evaluation index of the target object, is precision
    and recall that vary well both when the parameters are high changing the confidence.
    Precision is defined to discover only the relevant targets:


    ```

    $Precision = \frac{TP}{TP + FP}$ (8)

    ```


    where TP is the relevant targets that should be true, and FP is the relevant targets
    that are false. Recall is defined to discover the well relevant targets:


    ```

    $Recall = \frac{TP}{TP + FN}$ (9)

    ```


    where FN is the irrelevant targets that are wrong. The experimental Precision-Recall
    curve about object detection is shown in Fig. 4.


    ![](img/3e0c467946d9c60efd092f9af7a7da3c_3_0.png)


    Data in Table I demonstrates that the system spends most of the time consuming
    and detecting the recall precisely. And total time consuming of system realization
    for each frame is 125ms, which guarantees that the system performs well in real-time
    response.


    # B. System Running and Analysis


    The only rule of arrow game projection interactive system is to hit the position
    where you want to. When shooting game target scene, the objects will ring to shoot.
    If you miss the target, you get zero score; while 20 for for the outermost ring
    and 100 for the innermost ring. The other game scenes will monitor or swing, it
    will disappear. Moreover, if the position of arrow is located, the Unity3D system
    will produce a virtual arrow and simulate the next trajectory to create an immersive
    feeling. The procedure of arrow game projection interactive system is shown in
    Fig. 5.


    From Fig. 5, user is able to interact with the projection scene by clicking the
    arrow, raising and shooting the projection plane as if you were really at the
    shooting scene. Experiments show that our arrow game interactive system runs well
    in real time for experience no how the environments change.


