    # C. Implementation Details


    We achieve the implementation of our model using tensor framework and Unity3D
    engine. The parameters of the backbone are trained by darknet-53. All images are
    resized to 416. The proposed model is trained by Adam optimizer. The batch size
    is 32, for trade off between speed and convergence. The primary learning rate
    is $10^{-4}$.


