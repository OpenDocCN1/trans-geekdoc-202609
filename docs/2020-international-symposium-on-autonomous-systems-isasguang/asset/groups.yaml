    ## B. Arrow Position Mapping to the Coordinating Game Scene Position


    Due to projection error, the projection image is not exactly the same as (x, y)
    on PC screen displays. In Fig. 3, ABCD represents the projection on the projection
    plane and point O represents the arrow position; A, B, C, D are the corresponding
    positions of A, B, C, D mean the four vectors of PC screen respectively. Moreover,
    W is the height and H width of the resolution of PC monitor. O means the position
    of the mouse pointer. O(x, y) is mapped to O(x'',y'') in the interactive system
    to control the arrow position in the software.


    After mapping, we can get:


    ```

    $x'' = h_1x + h_2y + h_3$

    y'' = h_4x + h_5y + h_6$

    y'''' = h_7x + h_8y + h_9\quad\quad\quad\quad\quad(4)$

    ```


    That is to say, one point corresponds to two locations. So at least four points
    are needed to calculate the homotopy. Then a method of mapping the arrows'' position
    in the corresponding image to the game scene is achieved.


    ## C. Target Recognition Algorithm Based on YOLO3


    The R-CNN algorithm [12] introduced by Girshick in 2015 is to introduce CNN in
    the field of target detection, and its performance has been confirmed by many
    researchers to be better than traditional detection methods. After R-CNN, many
    excellent object detection algorithm based on convolutional neural networks have
    emerged, such as SPNet [14], Fast R-CNN [16], YOLO [17], SSD [18] etc. These algorithms
    belong to classes, object detection algorithm according to regions and convolutional
    neural networks.


    In our way, we employ YOLO3, which is based on deep convolutional neural networks.
    The network predicts the position from the entire image at once, and the target
    position is predicted by the bounding boxes. It predicts the confidence that the
    bounding box contains object, and the probability that the target belongs to a
    category.


    YOLO3 selects 5 layers of 52 neurons (-as a fully connected layer), which has
    a large number of residual hidden layers. To avoid the gradient explosion problem,
    pooling of convolutional layers helps prevent information loss during training.


    For the output, YOLO3 produces features of three scales, which detect different
    sizes of target. The relatively small and large receptive field of the feature
    map is used to detect small-sized and large-sized targets.


    ![](img/3e0c467946d9c60efd092f9af7a7da3c_2_0.png)


    First, points A, B, C, D should be detected automatically using line detection
    algorithm. A straight line is represented by the following equation:


    ```

    $y = kx + b\quad\quad\quad(1)$

    ```


    where k is the straight slope, and b is the intercept. (x, y) is the point in
    the x-y space.


    At the same time, a point on the plane can also be defined by distance-angle,
    where $\theta$ is the angle between a straight line from point (x, y) to origin,
    and $\theta$ is the original and the half angle of the x-axis.


    ```

    $p = x\cos(\theta) + y\sin(\theta)\quad\quad\quad(2)$

    ```


    In the new-distance space, the image becomes a curve. If there are many points
    in x-space that intersect at one point in p-space, then this intersection is the
    straight line we want to detect. We can get four straight AB, BC, CD, and AD to
    find their intersection A, B, C, D.


    Secondly, the homotopy of a plane is described as the projection of one plane
    to another. We use homotopy to realize image correction. Assume that the homogeneous
    coordinates of the corresponding points in images are (x, y) and (x'', y''), and
    the homotopy matrix H is defined as:


    ```

    $H = \begin{bmatrix} m_1 & m_2 & m_3 \\ m_4 & m_5 & m_6 \\ m_7 & m_8 & 1 \end{bmatrix}\quad\quad\quad(3)$

    ```


    where the parameters define each degree of freedom of the plane transformation.


