    由于投影误差，投影图像与 PC 屏幕显示上的 (x, y) 并不完全相同。在图 3 中，ABCD 代表投影平面上的投影，点 O 代表箭头位置；A, B, C,
    D 分别代表 PC 屏幕上 A、B、C、D 四个向量的对应位置。此外，W 是 PC 显示器分辨率的高度，H 是宽度。O 代表鼠标指针的位置。O(x, y)
    被映射到交互系统中的 O(x'',y'')，以控制软件中的箭头位置。


    映射后，我们可以得到：


    ```

    $x'' = h_1x + h_2y + h_3$

    y'' = h_4x + h_5y + h_6$

    y'''' = h_7x + h_8y + h_9\quad\quad\quad\quad\quad(4)$

    ```


    也就是说，一个点对应两个位置。因此，至少需要四个点来计算相似性变换。然后实现了将对应图像中的箭头位置映射到游戏场景的方法。


    ## C. 基于 YOLO3 的目标识别算法


    Girshick 在 2015 年引入的 R-CNN 算法 [12] 将 CNN 引入目标检测领域，其性能已被许多研究人员证实优传统的检测方法。在 R-CNN
    之后，出现了许多基于卷积神经网络的优秀目标检测算法，例如 SPNet [14]、Fast R-CNN [16]、YOLO [17]、SSD [18] 等。这些算法属于基于区域和卷积神经网络的目标检测算法。


    在我们的方法中，采用了基于深度卷积神经网络的 YOLO3。网络从整幅图像中预测位置，并通过边界框（bounding boxes）预测目标位置。它预测边界框包含对象的置信度，以及目标属于某一类别的概率。


    YOLO3 选择了 5 层 52 个神经元（作为全连接层），它具有大量的残差隐藏层。为了避免梯度爆炸问题，卷积层的池化有助于防止训练期间的信息丢失。


    输出方面，YOLO3 生成三个尺度的特征，用于检测不同尺寸的目标。特征图较小和较大的感受野分别用于检测小型和大目标。


    ![](img/3e0c467946d9c60efd092f9af7a7da3c_2_0.png)


    首先，应该使用直线检测算法自动检测点 A、B、C、D。直线由以下方程表示：


    ```

    $y = kx + b\quad\quad\quad(1)$

    ```


    其中 k 是直线的斜率，b 是截距。(x, y) 是 x-y 空间中的点。


    同时，平面上的点也可以通过距离-角度来定义，其中 $\theta$ 是从点 (x, y) 到原点的直线与角，$\theta$ 是 x 轴的原始角和半角。


    ```

    $p = x\cos(\theta) + y\sin(\theta)\quad\quad\quad(2)$

    ```


    在新距离空间中，图像变成了一条曲线。如果 x 空间中的许多点在 p 空间中相交于一点，那么这个交点就是我们要检测的直线。我们可以得到四条直线 AB、BC、CD
    和 AD，以找到它们的交点 A、B、C、D。


    其次，平面的相似性变换被描述为从一个平面到另一个平面的投影。我们使用相似性变换来实现图像校正。假设图像中对应点的齐次坐标为 (x, y) 和 (x'', y'')，相似性变换矩阵
    H 定义为：


    ```

    $H = \begin{bmatrix} h_1 & h_2 & h_3 \\ h_4 & h_5 & h_6 \\ h_7 & h_8 & h_9 \end{bmatrix}\quad\quad\quad(3)$

    ```


