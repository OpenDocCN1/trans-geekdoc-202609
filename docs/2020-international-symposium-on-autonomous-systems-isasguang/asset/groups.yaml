    # 基于深度学习的箭射游戏投影交互系统的设计与实现


    徐联浩

    华南理工大学自动化科学与技术学院

    中国广州

    aulianhaoxu@mail.scut.com


    李波

    建建建设投资集团有限公司

    中国厦门门

    784946993@qq.com


    谢伟

    华南理工大学自动化科学与技术学院

    中国广州

    weixie@scut.com


    张浪文

    华南理工大学自动化科学与技术学院

    中国广州

    aulwzhang@scut.com


    **摘要**—随着投影技术的快速发展，不同场景的投影交互系统设计已取得足进展。人类已不再满足于通过设备与计算机交互的传统方式，而是能够获得更自然、更自由的交互模式。因此，开发了一种基于深度学习游戏方案、涉及由
    Unity3D 开发的各种接口的箭射游戏投影交互系统，以提升用户体验。其次，实现了现实世界中的箭到游戏场景对应位置的映射。第三，通过 YOLOv3 目标检测算法进行识别。最终结果表明，所提出的交互系统具有良好的实时性能和高鲁棒性。

    **索引词**—目标检测，卷积神经网络，Unity3D，交互系统


    相机产生的亮斑使其能够找到目标的精确位置。然而，由于自然光中存在红外线，系统极受到环境光的严重干扰，系统在使用过程中必须隔绝自然光，且精度也受到投影平面平整度的影响。2004年，Kimura
    提出了一种投影仪光着色的有效方法，该方法会影响手势的捕捉[3]。用户需要在手指上贴上对应颜色的贴纸，然后通过阈值分割算法和滤波定位，最后利用模板识别算法通过检测指定的贴纸来确定手指的位置。这种方法在某些情况下具有很高的识别率，但由于辅助设备给用户体验带来了不便，且易出错，并存在场景颜色必须与贴纸颜色不同的局限性。2013年，意大利的
    Hiroki Goto 创建了一种交互系统，该系统基于帧方法和肤色方法检测并识别手势，其中该方法通过学习手势频率来消除复杂背景的影响[4]。他提出了一种基于
    HSV 和 YCbCr 空间手部颜色聚类的手势分割方法，以将手从复杂的背景中分离出来。Duan 提出了投影键盘交互系统[5]。Firiottu 开发了一种基于可变形表面的游戏投影交互系统[6]。Raskar
    提出了用于增强真实对象的着色层[7]。


    # I. 引言


    增强现实（AR）是一种无缝集成现实世界与虚拟世界的科技，使用户能够与虚拟现实进行交互。如今，它已快速掌握了虚拟现实、图像处理[1]和模式识别技术。


    随着日益复杂的图像处理和计算机视觉的发展，人机交互系统的应用变得越来越多。2002年，东京的 Jin Tsukimoto 开发了一种借助红外发生器映射现实世界物体位置的方法，该发生器发射一层红外光到投影平面[2]。当用户的身体或物体阻挡红外光时，图像会被相机捕捉


    在[2]中，相机-投影交互系统应隔绝环境光即可使用，大大改善了操作条件。然而，在[3]和[4]中，识别精度在很大程度上受到目标与背景差异的影响。此外，考虑到物体识别，[3]中的手指必须贴上特定颜色的贴纸，这极大地影响了用户体验。在上述其他研究，一个新的游戏交互系统包含三个部分：1)
    设计了一种将捕捉图像中箭的位置映射到游戏场景对应位置的方法，用于在游戏和场景中显示模拟箭，包括2) 通过 Unity3D[8] 开发了包含各种接口的任何游戏场景，以实现游戏玩法、动画和玩家体验为目的；3)
    使用基于 YOLOv3[9] 的目标检测算法实现物体识别，以解决投影背景和整体光线的限制。


    提升了用户对投影交互系统的兴趣和满意度。此外，为了获得用户的极大兴趣和投影效果，最重要的一步是识别相机捕捉的每一帧的准确性并快速计算目标位置。针对自然光和投影平面平整度等环境影响，了一种基于
    YOLOv3 的改进物体识别算法。通过在前方贴箭，可以进行一段时间的追踪，并在箭击中时拍照。然后通过目标位置的交互交付，帮助连接现实世界与虚拟世界。投影位置应映射到游戏场景的对应位置。


    # II. 基于深度学习的 AR 投影交互系统设计


    在本文中，深度学习的箭射游戏交互系统的硬件组成包括投影仪、一个 USB 摄像头和一台电脑。连接到电脑的投影仪将场景投影到墙上。摄像头通过 USB 接口实时捕捉图像，并发送到电脑进行图像处理和定位。此外，投影仪和摄像头面向同一个方向。系统的整个结构设计如图
    1 所示。


    ![](img/3e0c467946d9c60efd092f9af7a7da3c_1_0.png)


    图 1. 交互系统的结构设计。


    由于用户体验是人机系统的重要评价标准，通过 Unity3D（一种 3D 游戏开发引擎）开发了诸如目标、森林射击、雪地雪人和山等游戏场景。3D 场景中真实的飞行和生动的物体为用户创造了沉浸式体验。在某种程度上，这些独特的动画可以增强本文的工作：通过
    Unity3D 开发包含各种接口的箭射游戏场景；基于霍夫检测[10]和同胚变换[11]实现箭位置到游戏场景对应位置的映射；在不同接口中收集并标记大量数据；使用基于
    YOLOv3 的改进物体检测算法实现识别；基于深度学习训练并验证目标识别网络。


    # III. 系统实现的算法


    # A. Unity3D 上的多样化游戏场景


    首先，为了定义不同类型的游戏场景，如雪地、森林、山地、草地、猴子和五种组成的箭靶。其次，使用碰撞响应函数定义箭击中目标投影平面时的动作。第三，利用进度条通过增加或减少响应区域来调整游戏难度。最后，从一段时间内的文本中获取箭的坐标，在
    Unity3D 软件中生成虚拟箭并模拟下一次飞行轨迹。游戏场景如图 2 所示。


    ![](img/3e0c467946d9c60efd092f9af7a7da3c_1_1.png)


    图 2. 游戏接口，如射击雪人（左上）、森林射击（右上）、山地射击（左下）和草地射击目标（右下）。

