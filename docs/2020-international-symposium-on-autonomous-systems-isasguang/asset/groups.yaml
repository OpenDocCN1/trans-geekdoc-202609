    ![](img/3e0c467946d9c60efd092f9af7a7da3c_4_0.png)


    由Unity3D生成的生动场景旨在提高兴趣和体验。第二种方法是基于直线检测和线性插值对游戏场景的位置进行映射。


    与那些基于嵌入生成器或特定辅助设备的相比，我们的投影消除了设备的束缚并增强了交互智能。此外，得益于目标检测深度学习算法，我们解决了人机交互系统易受环境影响以及受投影平面平度影响的问题。


