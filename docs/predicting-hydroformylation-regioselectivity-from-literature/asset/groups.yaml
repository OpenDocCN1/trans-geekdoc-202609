    - 4. Cole, J., Wang, J., Jaskola, T., Green, W., and Jensen, K. (2017). Prediction
    of organic reactions using machine learning. Science, 356, aaa764. https://doi.org/10.1126/science.aaa764

    - 5. Wang, H., Chen, Y., Yu, H., Qi, M., Xia, D., Liu, Y., Lu, B., Gao, R., Wang,
    Y., and Mao, S. (2024). Generalized machine learning models of terminal hydroformylation
    for regioselectivity. Chem. Catal., 4, 10179. https://doi.org/10.1016/j.cccat.2024.10179

    - 6. Pedrosrosa, F., Varqueaux, G., Gramfort, A., Michel, V., Thion, B., Gisel,
