    # Chem Catalysis


    # CellPress


    Preview


    # Predicting hydroformylation regioselectivity from literature data machine learning


    Shai Chen¹ and Robert Police²*


    In this issue of *Chem Catalysis*, Mao et al. develop machine learning models
    that predict terminal alkene regioselectivity in catalytic hydroformylation, showing
    that high temperature, low pressure and low metal concentration favor linear products.
    These models enable high-throughput screening, potentially advancing innovations
    in this most olefins, oct-1-ene and styrene. The general-olefin models are created
    by using all data for a single model, as opposed to the specialized models where
    data are split by olefin. Unlike the general-like model, the specialized gradient
    boosting models for oct-1-ene and styrene achieve useful performance with R² of
    0.850 and 0.789, respectively, outperforming the general-olefin model significantly
    for these substrates.


    ![](img/4b2aa915a163b752e3c571e656a6cb7d_0_0.png)


    Hydroformylation of olefins (HPOs) is a chemical transformation that converts
    olefins, carbon monoxide, and molecular hydrogen into linear or branched aldehydes
    (Figure 1). It is one of the most large-scale homogeneous-catalyzed transformations
    in the chemical industry and is a prototype of a highly atomic-economic conversion.
    In the 1970s, rhodium complexes were discovered both the most effective and chemolective
    hydroformylation catalysts. Later, other catalysts based on cobalt, ruthenium,
    iridium, palladium and platinum were developed as alternatives.²


    The full representation used in this case is 4 dimensional and encompasses descriptors
    for the olefin, reaction metal catalyst, solvent, and reaction conditions. The
    researchers applied principal component analysis to reduce the dimensionality
    of the reaction representation and improve the robustness of the supervised ML
    models. When reduced to eight dimensions, prediction performance was best for
    olefins. When only oct-1-ene was used as a substrate, reducing the representation
    to four dimensions showed the highest prediction accuracy. In contrast to the
    oct-1-ene-specific model, reducing the representation to 15 dimensions maximized
    prediction for the styrene-specific model.


    Recently, machine learning (ML) has emerged as a transformative tool in organic
    synthesis and chemical engineering. This development has led to breakthroughs
    in guiding synthesis, optimizing reactions, and discovering new pathways.³ One
    of the ML approaches is supervised learning, which aims to learn the relationship
    between a set of inputs and outputs and to predict the outcome of unseen chemical
    reactions. In general, constructing robust and accurate supervised models hinges
    on the use of high-quality chemical databases, and the selection of appropriate
    representations, and the choice of ML algorithms.


    The first trained models to predict the outcome of all olefins in their database,
    which used the general-olefin model, and analyzed them found that these models
    could not distinguish between olefins as various olefins were clustered and, consequently,
    the performance was not good enough. Specifically, the researchers proposed specialized
    models for the


    The researchers were also interested in understanding the most important features
    of the models. The shapley explanations (SHAP) were applied to the models constructed,
    and the corresponding results were averaged over the three models with the best
    predictive performance. This approach revealed that, in the general-olefin model,
    low bite values are associated with low L/B ratios, consistent with previous literature.
    Additionally, containing electron-substituted alkenes tend to form branched products.
    In terms of reaction conditions, high temperatures are conducive to induce L/B
    ratios. For specific to oct-1, longer reaction times generally increase the probability
    of L/B. In addition, low pressure favors the occurrence of β-hydrogen elimination,
    which reduces the selectivity of branched products and styrene-products. SHAP
    analysis revealed a novelty in the importance of the conditions to the substrates
    and for the styrene-specific model. Lower catalyst concentrations can accelerate
    β-hydrogen elimination, forming less branched products. The oct-1-specific and
    the styrene-specific models show that higher catalyst concentrations, pressure,
    and lower L/B values were present in the general-olefin model. Additionally, while
    the researchers used descriptors to differentiate between catalysts and solvents,
    the best-performing ML models do not generalize to rare substrates, as the data
    was biased toward common chemical species. Overall, this study by Mao and coworkers
    presented a comprehensive framework for terminal hydroformylation regioselectivity.


    > ¹Institute of Chemistry, Groningen, Germany

    ²Correspondence: r.police@uio.no

    https://doi.org/10.1016/j.chemchem.2024.101111


    Chem Catalysis 4 (101111), September 2024 | Elsevier © 2024

