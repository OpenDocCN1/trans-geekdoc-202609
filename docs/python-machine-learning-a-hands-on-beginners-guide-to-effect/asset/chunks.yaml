    # 使用感知机进行问题表示


    该示例集将用于判断一个人是否会决定观看某电影，这基于图所示的先验数据和输入。图中提供的输入数据既有正值 (+) 也有负值 (-)。实际值代表了这个人看过的电影。我们将使用这些数据来观察感知机学习算法是如何估计数据集中的权重的。为了简单起见和直观可视化，我们将使用
    2 维表示法。


    ## 使用感知机学习算法


    这里的主要目标是识别一个可以分离正值(+) 输入与负值(-) 输入的向量，例如示例中使用的向量 `(w)`。我们将使用下述算法。


    第一步是使用任何其他向量调整向量 `(w)`。初始化后，我们重新陈述数据集中的示例，在本例中，指标为 `P`、`U` 和 `N`。这些示例代表了正向和负向的标准。在进入替换阶段时，输入
    `x`（随机选择的向量）对应值 `P`，在 `w` 中确定的点积应表述为零 (0) 或大于零。实际值本身并不重要，因为感知机只会给出“是”或“否”的答案。在另一种情况下，当向量
    `x` 对应值 `N` 时，计算出的点积结果为零 (0)。


    上述语句可以用 `while` 循环中的一个 `IF` 情况表示为：


    从这些表示中可以推导出两种结果：

    - 第一种结果是当向量 `x` 对应 `P` 值，且两个向量 `(w, x)` 的点积小于零 (`w.x < 0`)。

    - 第二种结果是当向量 `x` 对应值 `N` 时，且两个向量 `(w, x)` 的点积大于零 (`w.x>0`)。


    注意，我们必须更新已初始 `w` 值。在其他情况下，我们不应该扰动 `w` 的值，因为上述两个结果与感知机规则冲突。对于第一种结果，我们将汇总 `w` 和
    `x`；对于第二种结果，我们将从 `w` 中减去 `x` 值。


    ## 评估上述更新规则的可行性


    感知机的基本规则帮助我们确定向量 `x` 对应值 `P`。因此；任务的剩余部分是使方程变为 `w.x > 0`。该方程也可以解释为：当向量 `x` 对应 `P`
    时，两个向量 `(w, x)` 之间的角度应该小于 90 度。


    为什么会有这种推论？两个向量 `(w,x)` 之间角度的余弦等于这两个向量的点积。因此，该角度应该小于 90 度。


    从上述解释中我们得到，只要 `w` 与给定特征向量形成的角度小于 90 度，我们不需要知道向量 `w`。在这种情况下，向量必须是一个正值。相反，向量 `w`
    与具有负值的特征向量形成的角度应该大于 90 度。其表示如下所示。


    此时，我们可以放心地说，在 `x` 对应值 `P` 的给定情况下，向量 `x` 和 `w` 之间的角度应该是一个小于 90 的值。同样，我们可以得出结论，在向量
    `x` 对应值 `N` 的给定条件下，向量 `w` 和 `x` 之间的角度应该是一个大于 90 度。


    接下来，我们来看为什么更新是有效的。下图给出了关于为什么更新有效的解释。这种评估可能有点跳跃，但整体框架是一目了然的。


    对于向量 `x` 对应 `P` 的情况，我们必须加上向量 `x` 和 `w` 的值。相加提高了 `(alpha)` 余弦函数的值。这意味着 `alpha`
    的值减小（即两个向量之间的角度）。下图显示了我们如何学习向量 `w`，使其与真实物体形成小于 90 度的角度，并与负值物体形成大于 90 度的角度。


    ## 收敛性证明


    目前还没有精确的解释能让人相信所研究的向量最终会收敛。这是由于不同数据集内部不断变化的条件。尽管看起来可能存在向量无法收敛的情况，但事实是该算法证明会在某一点收敛。许多类型的研究已经了这些模式并推出了这些证明。在
    YouTube 和其他平台上可以找到演示这些内容的视频。


    ## 结论


    在本章中，我看了感知机算法，定义了它，并进一步说明了它是如何工作的。在此过程中，我们在学习感知机学习算法之前，刷新了你们对线性代数必要组件的记忆。这种循序渐进的演示旨在引导学习者理解并可视化机器学习的概念，特别是感知机。我希望在本章结束时，你已经获得了入门的洞察和知识。建议阅读额外的学习材料。


    ## 局限性与预防措施


    在系统的训练阶段，应该帮助感知机算法通过适应数据进行学习。这是为了确保预测准确并排除错误。输入向量的呈现应该反映一个尽职的过程。这确保了感知机与指标匹配，并且系统在发生错误时可以自我纠正，因为它只需要回到提供的输入向量即可。


    '
