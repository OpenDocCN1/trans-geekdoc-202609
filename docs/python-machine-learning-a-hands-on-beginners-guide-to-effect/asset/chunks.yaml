    The rules under association allow the user to institute associations in the midst
    of data objects inside big databases. As the name suggests, the technique seeks
    to discover unique relations between variables contained in large databases. For
    instance, shoppers could be grouped based on their search and purchase histories.


    ### Applications of Unsupervised Machine Learning


    Unsupervised ML is based on data and its attributes, and Therefore, we can conclude
    that it is data-driven. The results from a task are controlled by the nature in
    which the data is formatted. Some of the common areas that rely on unsupervised
    learning include but are not limited to:


    *   **Buying Habits**: It is not surprising to find your purchasing habits stored
    in a database somewhere. The information could be used by marketers to group clients
    into similar shopping segments so that they can reach out to them easily. The
    clustering is easy to do under unsupervised learning algorithms.

    *   **Recommender Systems**: If you are a Netflix or YouTube user you might have
    encountered a video recommendation severally. Often times these systems are contained
    in the unsupervised domain. The system knows the watch history of its users. The
    model uses the history to identify relationships between users who enjoy watching
    videos of certain genres, length, etc, and prompt them with a suggestion of related
    videos that they may not have watched.

    *   **Identification of Fraudulent transactions**: Anomaly detection is the technique
    used in discovery of abnormal data points. The algorithm picks out any unusual
    points within the data set, hence sending an alarm.


    ### Supervised Vs. Unsupervised ML Techniques


    Data specialists employ an array of machine algorithms in their discovery operations.
    Below are some insights on the classification of supervised and unsupervised learning
    techniques, which will help you to judge when to use either of the techniques.


    | Parameters | Supervised machine learning | Unsupervised machine learning |

    | :--- | :--- | :--- |

    | Data usage | Employs training data to study the link between the input and output.
    | Does not use output data. |

    | Accuracy of the outcome | Highly accurate reliable. | Less accurate and Therefore,
    not trustworthy |

    | Input data | Labeled data is used in training the algorithms. | Algorithms are
    used against unlabeled data. |

    | Number of classes | Known number of classes. | Unknown number of classes. |

    | Major drawback | Classification of big data. | Failure to get precise information
    concerning output and data sorting due to use of labeled and unknown data. |

    | Real time learning | Learning takes place offline. | Learning happens in real
    time. |

    | Process | Both input and output variables are given. | Only the input data is
    given. |

    | Computational complexity | Relatively simple; less complex. | Complex in terms
    of computation. |


    Deciding to employ a supervised or unsupervised machine learning algorithm classically
    depends on your data volume and structure. Essentially, a well-formed data science
    plan will employ both algorithm types to come up with predictive data models.
    Now, these models are more advanced and help the stakeholders in decision-making
    across a variety of business hold ups.


