    # 第 9 章：K 近邻算法 (KNN) ![](img/rsrcYU.jpg)


    K 近邻算法是分类和回归问题中最简单且最常用的学习算法。这种类型非常直观且易于掌握。对于所解决的谜题，结果的价值基于邻居值的选择。其目的是通过遵循其 K 个最近邻来对最常见的类别进行分类。KNN
    有时也用于回归，其中输出值是根据最连续的值预测的。输出值可以是整个类别（k 个最近邻）的平均值或中位数。在回归和分类问题中，与 `k` 对应并用于训练的输入值通常位于特征空间中。所得到的结果取决于使用
    KNN 的机器学习类型，即分类或回归。


    简单来说，KNN 算法可以定义为通过将对象归类到其接近的组来对其分类。该方法考虑了集合中的特征和数据点。对于算法函数，过程将尝试通过观察相同状态下对象 `X`
    附近的端点，来寻找对象 `X` 所属于的组。结果通过确定大多数特征所在的位置来建立。例如，如果一个对象的大部分点落在组 `Y` 中，则对象 `X` 被归类为组
    `Y`。这种识别项目 `X` 所属组的方法用于分类。它的工作方式类似于对邻居进行多票投票，然后将该项目分配到其 `k` 个最近邻大多数所落的组中。当评估完成且
    `k` 的值为 `1` 时，则该对象被归类为该类。


    KNN 有时被称为“懒惰学习器”，因为它的计算值需要时间。KNN 基于估计，数学分析通常被留到分类的最后一步。在回归和分类问题中，单个单元应被设定为一类的平均值。这是为了确保该单元中最近的邻居对指标的贡献比远离该类的邻居更多。例如，一个良好的模型会在
    `1/x` 处设置一个值，其中 `x` 是最近邻居之间的距离。对于分类问题，邻居是从在特征和其他参数方面具有已知值的单元中选择的。尽管在 K 近邻理论中进行的训练较少，但该组可以被视为训练数据集。


    k 临邻算法的一个显著特征是其对数据集组件和组成的敏感性。可用于 k 近邻算法的训练数据示例是带标签的向量，通常应用于具有许多维的特征空间。算法通过隔离训练数据集中的特征向量和带标签类别来学习。在对象分类的过程中，`k`
    的值通常是常数，并由系统用户设置。在此过程中，一个没有标签的向量（用于测试数据）通过查看在整个训练集中频繁出现且距离该向量最近的标签被分配一个组。训练数据集也称为
    `k` 样本。对于连续变量，欧几里距离是解决范围相关问题的常用参数。对于不连续（也称为离散）变量，则使用不同的设置来解决问题。通过引入其他研究距离空间元素的独特算法，可以增强最近邻算法的性能。


