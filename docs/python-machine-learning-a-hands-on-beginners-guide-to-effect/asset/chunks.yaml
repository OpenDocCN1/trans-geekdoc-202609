    \ model dealing with proportional odds. \n\nHowever, this system only does modeling\
    \ and not performing classifications since it is not a classifier. Therefore,\
    \ it will only convert input into an output.\n\n## Applications of Logistic Regression\n\
    \nFollowing this, let us discuss the applications of logistic regression in a\
