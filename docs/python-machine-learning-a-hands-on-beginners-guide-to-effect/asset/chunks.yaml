    # 第一章：引论：机器学习的历史概述 ![](img/rsrc48.jpg)


    机器学习于 1959 年进入视野，这是在美国先驱者的帮助下实现的。亚瑟·萨缪尔（Arthur Samuel）花费大量时间在计算机游戏上，他提出了“机器学习”这一初始术语。在此期间，机器学习成为科学努力不可或的一部分。后来，随着对人工智能的需求增长，它得到了普及。许多人，尤其是研究人员，对此产生了浓厚兴趣，以至于部署机器学习来获取某些数据。此时，研究人员别无选择，只能尽一切利用可用手段来获得所需的结果。他们最终使用了
    `perceptors`（感知器），尽管后来这被视为线性模型的应用。尽管如此，他们仍在此部署了概率推理，特别是在医疗诊断的自动化方面。幸运的是，这种自动化技术似乎效果更好，从而改进了他们在医疗领域的工作。然而，逻辑性的增加以及依赖知识的方法导致了机器学习与人工智能之间的技术战。在这一关折点，你发现概率系统无法按照预期执行其任务。因此，他们在实践和理论上都遇到了一些问题性问题，特别是在数据表示甚至数据获取方面。随着人工智能陷入巨大的停滞，工业界没有任何办法来解决他们的工作量和繁重任务。结果，机器学习开始繁荣。那是在
    20 世纪 90 年代。它改变了自己的目标或任务，从实现被认为是人工的智能转向主要从实际角度解决问题。它的重点发生了转移。在此过程中，符号方法停止了。它吸收了概率论和统计模型的使用。机器学习后来受益于数字化信息和便捷的互联网分发。因此，互联网分发创建了一种可传输的模式，许多科学家可以利用它来获取机器学习。记住，随着人工智能部分的“死亡”，机器学习成为了每个行业的不可或的一部分。在此过程中，许多科学家和几个机构都无法忽视它。随着许多人将其投入各种数据预测中，它的使用频率也增加了。


    ## 机器学习的进化视角


    机器学习经历了几个阶段才达到今天的地位。这些步骤以技术的改进和自然问题的解决为标志。此外，输出预测的准确性水平也不断提高。然而，这仍然低于科学家和大多数机构的要求。此外，解决和获取数据的速度变得更易管理，但输出数据中只有极少数不准确的情况。正因为如此，改进机器学习特征的冲动应运而生。因此，这一切导致了进化的最终诞生。


    ### 第一阶段是西洋跳棋游戏与机器学习


    在这里，亚瑟·萨缪尔发明了一个计算机程序，可以用来玩西洋跳棋。他引入了 `alpha-beta pruning` 以适应设备内较少的内存。这种知识可以预测在西洋跳棋游戏中的哪些获胜机会。最后，这导致了
    `minimax algorithm`（极大极小算法）。后来，他根据自己的设计改进了他的机器。


    ### 进化的下一个阶段是感知器


    弗兰克·罗森布拉特（Frank Rosenblatt）提出了这个模型。它是机器学习和脑细胞模型的结合。值得注意的是，脑细胞模型是唐纳德·赫布（Donald
    Hebb）的工作。曾工作于康奈尔航空工程学院（Cornell Aeronautical）实验室的弗兰克，在工业界缺乏解决某些统计数据和分析方法时提出了这种
    `Perceptron`（感知器）。他计划完成他的工作，即 `Perceptron` 是一台机器而不是任何程序。`Perceptron` 使用 `Mark
    1 perceptron`（1 号感知器）进行图像识别。结果，软件和机器的传输变得更加容易。据他所，这是最成功的机器。此外，尽管这是成功的，但某些方面缺乏解决方案。也就是说，该设备无法识别视觉模式。结果，许多科学家和计算机程序员转向另一项研究。然而，他们的斗争一直持续到
    20 世纪 90 年代，在那里他们成功地实现了能够解决问题的算法。此外，这种方法导致了 `The Nearest Neighbor`（最近邻算法）。


    在他的工作中，马尔塞洛发现可以轻松地识别模式。这种算法的主要目标是规划路线。这种方法是有益的，销售人员可以利用它进入城市。尽管这很有帮助，但在某些情况下它无法处理。结果，这导致了多层模型的诞生。


    多层模型在 20 世纪 60 年进入视野，并改进了神经网络。这增加了 `Perceptron` 的处理能力，促进了 `backpropagation`（反向传播）的发展。`backpropagation`
    的主要任务是解决系统中的错误。这种方法通过反向传播错误使得解决问题不再困难。它现在被应用于许多行业。值得注意的是，这种系统出现于 20 世纪 70 年。`backpropagation`
    导致了 `Neural Network`（神经网络）。在这里，这种机器可以解决 `Perceptron` 无法解决的复杂任务。它涉及将输入数据转换为输出信息。这里的工作是复杂的，人类可能会发现困难。在
    20 世纪 70 年代和 80 年代的部分时期，逻辑方法停止了。人工智能开始使用逻辑方法来解决其任务。再次，他们放弃了某些研究，例如神经网络。最后，两者之间产生了分裂。那就是机器学习和人工智能的分离。后来，在重组后，机器学习挣扎了近十年。


    '
- fmt: "\n# Chapter 2: Types Of Machine Learning ![](rsrc5E.jpg\n\nIn a world soaked\
    \ in artificial intelligence, it is interesting to understand machine learning\
    \ in depth. This is a concept that allows an algorithm to perform specific tasks\
    \ without relying on any explicit instructions. Instead, the machine relies on\
    \ inference and patterns such that the user feeds data to a generic algorithm\
    \ rather than writing the code. In response, the machine constructs the logic\
    \ based on the input data. Usually, the accuracy of the prediction made by the\
    \ algorithm is evaluated and the algorithm only gets deployed when the precision\
    \ is acceptable. \n\n## Types of Machine Learning\n\nThere are three broad categories\
    \ of machine learning. We will discuss each of them in detail below.\n\n### 1.\
    \ Supervised Learning\n\nThis paradigm happens to be the most popular, probably\
    \ because it is easy to comprehend and execute. Here, the algorithm creates a\
    \ mathematical concept from a labeled dataset, i.e a dataset containing both the\
    \ input and output parameters. This dataset acts as a trainer to the model. Taking\
    \ an example, we may decide to use the algorithm to determine whether a particular\
    \ image contains a certain object. In this case, the dataset would comprise images\
    \ with and without the input (that object), with every image having the output\
    \ designating whether or not it contains the particular object. The algorithm\
    \ is likely to predict any answer; whether right or wrong. However, after several\
    \ attempts it gets trained on picking only the images containing the said object.\
    \ Once it gets totally trained, the algorithm starts making right predictions\
    \ even when new data is input. A perfect example of a supervised learning model\
    \ is a support vector machine. On the diagram below, the support vector machine\
    \ divides data into sections separated by a linear boundary. You realize the boundary\
    \ separates the white circles from the black. ![C:\\Users\\USER\\Desktop\\support\
    \ vector machine.png](rsrc5W.jpg)\n\n#### Types of Supervised Learning\n\n*  \
    \ **Classification**: These algorithms are used in instances where the outputs\
    \ are limited to discrete values. In the case of filtering emails for example,\
    \ an incoming mail would be classified as the input, whereas the output would\
    \ be the folder name.\n*   **Regression**: This is the algorithm under which the\
    \ output has a continuous value, which means they many pick on any value within\
    \ a given range. Perfect examples include; temperature, wind speed, price of a\
    \ commodity etc.\n\n![](rsrc68.jpg)\n\nSupervised machine learning is exhibited\
    \ in many common applications, some of which we have discussed below.\n\n*   **Advertisement\
    \ Status**: Most of the ads that you encounter when browsing the internet are\
    \ positioned there because a supervised learning algorithm vouched for their clickability\
    \ and popularity.\n*   **Face Recognition**: This one is quite common on Facebook.\
    \ It is very likely that your face has been used in a supervised algorithm that\
    \ is trained to recognize it. When Facebook is suggesting a tag you must have\
    \ noted that the system guesses the persons on the photo, which is a supervised\
    \ process.\n*   **Spam Classification**: The spam filter that you find on your\
    \ modern email system is a supervised learning concept. Apart from preemptively\
    \ filtering spiteful emails, the system also allows the user to provide new labels\
    \ and express their preference. See the illustration on the figure below. ![C:\\\
    Users\\USER\\Desktop\\spam classification.jpg](rsrc6J.jpg)\n\n### 2. Unsupervised\
    \ Learning\n\nAs the name suggests, unsupervised machine learning is the exact\
    \ opposite of supervised learning. The model finds structures in the data and\
    \ also learns through observation. When given a dataset, the model automatically\
    \ finds relationships and creates clusters. The paradigm cannot add labels to\
    \ the created cluster, but it does the creation perfectly. This means that if\
    \ we have a set of apples and oranges, the model will separate the apples from\
    \ the oranges. Now, suppose we had more than two sets, say we present images of\
    \ grapes, oranges, and apples. As explained above, whenever new data is input,\
    \ the model adds it to one of the already clusters as shown in the figure below.\
    \ ![](rsrc6Z.jpg)\n\nLet us take another classical example for better understanding.\
    \ Think of a little baby and his family dog. He very well identifies its features.\
    \ When a family friend brings along another dog to try play with the baby, the\
    \ baby will identify that as a dog even without anyone them. They will easily\
    \ classify it because it has features. This falls under unsupervised learning\
    \ because you classify the input data without being taught. If it were supervised\
    \ learning, the family friend would have to tell the baby it’s a dog.\n\n####\
    \ Types of Unsupervised Learning\n\n*   **Clustering**: This concept identifies\
    \ a pattern in an assortment of unclassified data. Clustering algorithms categorize\
    \ any natural groups in the data. The user is also at liberty to adjust the number\
    \ of cluster they want their algorithms to identify.\n    *   **Exclusive (partitioning)**:\
    \ Under this type, classification of data is done such that one data can only\
    \ belong to a single only. `K-means` serves as a perfect example. own    *   **Agglomerative**:\
    \ This is the technique where every data is in itself a group. The number of clusters\
    \ is reduced by the iterative mergers between the two closest groups. An example\
    \ is the hierarchical clustering.\n    *   **Overlapping**: Under this technique,\
    \ data is associated with a suitable association value. Fuzzy sets are used in\
    \ grouping data and each point could fit into two or more groups with different\
    \ membership degrees. `Fuzzy C-Means` is a suitable example under this type.\n\
    *   **Association**: This concept creates clusters using probability distribution.\
    \ See the example below given some keywords\n    *   `Men’s pants`\n    *   `Ladies’\
    \ pants`\n    *   `Men’s wallets`\n    *   `Ladies’ wallets`\n\nThe given keywords\
