    # 第 4 章：Python 机器学习的核心库


    如今许多开发者在数据分析中倾向于使用 `python`。`python` 不仅应用于数据分析，还应用于统计技术。科学家们（尤其是那些处理数据的科学家）也倾向于在数据集成中使用
    `python`。这涉及到 Web 应用与其他环境产出的集成。`python` 的特性帮助科学家们将其应用于机器学习。这些特性的示例包括：语法一致、灵活高效，甚至可以缩短开发时间。它还具有开发复杂模型的能力，并拥有有助于预测的引擎。因此，`python`
    拥有一系列非常广泛的库。记住，库是指用不同语言编写的一系列程序和各种函数。因此，一个健壮的库可以处理更复杂的任务，而且这无需重复编写几行代码。值得注意的是，机器学习主要依赖于数学，即数学优化、概率元素以及统计数据。因此，`python`
    凭借丰富的知识，可以在无需过多干预的情况下执行复杂任务。以下是目前常用的核心库示例。


    ## Scikit – Learn


    `Scikit-learn` 是机器学习领域最好且最流行的库之一。它具有支持学习算法的能力，特别是无监督和监督学习算法。`Scikit-learn` 的示例包括：


    * `k-means`

    * `决策树`

    * `线性和逻辑回归`

    * `聚类`


    这类库包含来自 `NumPy` 和 `SciPy` 的主要组件。`Scikit-learn` 能够添加对机器学习以及与数据挖掘相关的任务有用的算法集。也就是说，它可以帮助分类、聚类甚至回归分析。该库还可以高效地完成其他任务。一个很好的例子包括集成方法、特征选择，以及数据转换。值得理解的是，如果先驱者或专家能够实现算法中复杂精深的部分，他们就可以很容易地应用此工具。


    ## TensorFlow


    `TensorFlow` 是一种涉及深度学习的算法形式。它们并非总是必须的，但它们的一个优点是当操作得当时，能够给出正确的结果。它还能让你在 `CPU` 或
    `GPU` 上运行数据。也就是说，你可以在 `python` 程序中编写数据，编译然后在中央处理器上运行。因此，这让你的分析工作变得非常轻松。此外，没有必要将这些信息用
    `C++` 或 `CUDA` 等其他层级编写。`TensorFlow` 使用节点，特别是多层节点。这些节点在系统中执行多项任务，包括使用人工神经网络、训练，甚至设置大量数据集。诸如
    Google 等多个搜索引擎都依赖于这类库。其其中一个主要应用是目标识别。同样，它也能帮助处理语音识别的不同应用程序。


    ## Theano


    `Theano` 也是 `python` 库的重要组成部分。它在这里的关键任务是帮助任何与数值计算相关的内容。我们将其与 `NumPy` 联系起来。它还扮演着其他角色，例如：


    * 数学表达式的定义

    * 数据优化


    '
