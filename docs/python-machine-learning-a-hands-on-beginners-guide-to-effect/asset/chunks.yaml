    \ the prediction outcome here such as the age of the candidate, sex, the incomes\
    \ of both the candidate and voters, state of residence of both, and more so total\
    \ number of votes in the last elections.\n\nLogistic regression is also applied\
    \ in various medical fields. It is applied in epidemiology. Here, the analysis\
    \ is used to identify all those risk factors that may eventually result in diseases.\
    \ As a result, precautions and other preventive measures may be put into place.\
    \ Its knowledge is usable in the `Trauma and Injury Severity Score(TRISS)` where\
    \ predictions of mortality, especially in injured patients, are done. We have\
