  trans: "\n\n# 第 5 章：回归分析（线性回归与逻辑回归）\n\n全球范围内多个行业都在苦苦寻找最佳方法来获取正确的数据或信息，以最终使他们能够解决面临的预测问题。一些银行已经遭受了损失，特别是在其信贷部门，因为他们无法正确预测违约者的信誉度。在健康领域，你会发现许多人因为规划不当和风险管理不而失去了生命，这是缺乏建模工具来进行更直接的预测所导致的。我们还有其他部门，例如天气预报，农民没有获得关于降雨发生情况的建议，导致了更大的损失。另一个领域涉及房主对抵押贷款的支付。由于所有这些原因，全世界的人都在疯狂寻找处理组织预测角色的最佳方法。\n\
    \n后来，这一切催生了所谓的**回归分析**（regression analysis）。因此，回归分析是指使用变量进行预测分析的统计处理过程。在此过程中，它有助于识别变量之间的关系。这种分析包含自变量和因变量。换句话说，回归分析有助于理解在保持其他自变量不变的情况下，其中一个自变量对因变量的影响。在大多数情况下，回归分析将尽力预测条件期望，特别是依赖变量的期望。\n\
    \n回归分析应用于天气预报和预测等多个领域。在这里，它帮助预测特定时期内降雨的结果。它也适用于医学等领域，用于预测疾病的概率。回归分析包括：线性回归、逻辑回归、多项式回归、逐步回归、岭回归、Lasso\
    \ 回归和弹性网回归。总而言之，本章将只探讨最常用的回归分析，例如线性回归和逻辑回归。需要注意的是，`ElasticNet` 回它是 `Lasso` 和 `Ridge`\
    \ 回归的结合。\n\n## 逻辑回归\n\n逻辑回归包含逻辑模型、逻辑函数、统计模型等。因此，许多组织在日常活动中应用逻辑回归，这些活动主要由数据预测和分析组成。你可以进行这种回归分析，特别是当因变量是二元的时。即它是二分类的。与其他类型的回归分析一样，逻辑回归完全应用于任何处理预测的分析中。在这种情况下，它的首要功能是描述数据。此外，逻辑回归可用于解释或说明二元变量（因变量）与其他变量（自变量）之间的某种关系。\
    \ \n\n在某些情况下，这种回归可能看起来难以解释，但通过 `Intellectus Statistics` 等逻辑工具的帮助，你可以轻松地进行数据分析。逻辑回归知识可以在逻辑模型的帮助下轻松应用于统计学中。在这种情况下，逻辑模型的主要功能实际上是通过概率得出某些预测或类别的正确结果。例如，概率在只需要预测既有事件结果的领域效果最好。这些事件包括：健康或疾病、胜利或失败、生存或死亡，甚至在你对测试进行分析时，某人失败或通过。\n\
    \n尽管如此，在这个模型中，你将能够主要通过概率来微调你的结果。在图像的情况下，你可以扩展模型以涵盖各种类别。你将能够检测分析中的图像是狮子还是猫，等等。在这种情况下，图像中的单个变量的概率将在\
    \ 0 到 1 之间。然而，这里的总和应该等于 1。\n\n因此，逻辑回归是指一种基础统计模型，无论存在什么样的复杂性，它都更多地利用可用的逻辑函数。逻辑回归是回归分析的一部分，在许多情况下，它被应用于估计模型参数的各种分析中。记住，逻辑模型类似于二元回归。该模型包含一个包含两个可能值的因变量。这些值可以表示为\
    \ `通过/失败`、`生存/死亡`、`好/坏` 等。你需要注意的是，指示变量实际上表示这些可能的值，并且始终为 0 和 1。\n\n在这个逻辑模型中，值为\
    \ 1 的 `odds`（几率）代表一个线性组合。在此过程中，该组合具有多个完全独立的变量。此外，在回归分析中，自变量可以分别形成二元变量，有时是连续变量。对于二元变量，必须存在两个类，并且必须通过指示变量编码。然而，连续变量代表真实值。在回归分析中，如前所述，这些值的\
    \ `odds` 总在 0 到 1 之间变化。在这种分析中，`log-odds`（对数几率）将通过 `logistic` 函数转换为概率。`Odds` 以\
    \ `logit` 计算，这也是 `probit` 模型的衍生物，使用不同的函数将 `log-odds` 转换为概率。\n\n`probit` 模型是一个类似模型的示例，它包含\
    \ `sigmoid` 函数。总而言之，你会发现逻辑模型由于其定义的属性或特征而是最受青的。逻辑模型的一个特征是它能够乘乘地增加每个自变量的尺度。作为结果，如果所有依赖因变量都是二元的，它将泛化\
    \ `odd ratio`（几率比）。同样需要注意的是，当涉及到因变量时有扩展，例如二分类逻辑。这些扩展包括：\n- `multinomial logistic\
    \ regression`（多分类逻辑回归）：适用于分类输出，特别是具有多个值以上。\n- `ordinal logistic regression`（序数逻辑回归）：处理大量的类别。这里一个很好的例子是处理比例几率的序数逻辑模型。\n\
    \n然而，该系统只进行建模而不执行分类，因为它不是分类器。因此，它只会将输入转换为输出。\n\n## 逻辑回归的应用\n\n接下来，让我们讨论逻辑回归现在现实情况中的应用。逻辑回归应用于由气象学家组成的气象站和其他气象站。这里的算法被用于预测下雨的概率。这一信息至关重要，因为它有助于农业、运输等许多部门。可以高效地规划播种时间，并采取正确的安排。这种分析也应用于某些风险管理系统，例如信贷控制。在这里，分析将预测账户持人在付款时是否为违约者。尽管如此，回归分析将根据之前的记录预测某人可以获得的确切金额。这始终使许多组织能够正常运行，因为它们在风险管理方面可以控制一切。所有账户在附加之前都经过了关键分析。\n\
    \n逻辑回归也应用于政治领域，特别是在选举期间。在这里，它根据候选人的优势和所使用的资源给出每位候选人获胜或失败的概率。再次，这种回归分析能够预测可能不投票的人数以及最终将投票的人以及投票给哪个特定的候选人。\n\
    \n"
- fmt: "\n# Chapter 6: The Perceptron ![](rsrcT1.jpg)\n\nThis chapter is set to look\
    \ at the perceptron learning algorithm, which was first applied and propose by\
    \ Minsky. This chapter offers explicit coverage of perceptron as an algorithm\
    \ rather than the model. I would advise my readers to find reference material\
    \ for the same topic in my book `MACHINE LEARNING FOR BEGINNERS`. In the book,\
    \ the coverage of this topic is limited in scope. However, in this one, I offer\
    \ an in-depth analysis of perceptron based on the content, structure, and applicability.\n\
    \n## Defining Perceptron\n\nA perceptron is a layer of the neural network that\
    \ is capable of doing the following: Configuring arithmetic values to the core\
    \ of the data pool and estimating the sum of the positive return to the value\
    \ of `1` for positive (+) outcomes. In a different point of view, a perceptron\
    \ can also be considered as a model for computation that draws a boundary (a line\
    \ in two-dimensional cases) to isolate two classes in a given space. Initially,\
    \ the weights and the bias which represents the classification hyperplane is usually\
    \ unknown. In this case, unsystematic weights and bias are allocated to the model.\
    \ The random assignment leads to misclassification of points.\n\n## The Perceptron\
    \ Trick\n\nThe objective of the perception trick is decreasing the amount of misclassified\
    \ points. The reduction can be made by sliding the line over the space. In other\
    \ words, it is altering the expression of the hyperplane. For all the wrongly\
    \ categorized points, we adjust the weights and prejudice to move the hyperplane\
    \ closer to the points that are improperly classified. After some time, the algorithm\
    \ will rectify the problem to classify the points correctly.\n\nHowever, in this\
    \ chapter, I choose to look at the perceptron differently. The approach taken\
    \ is to identify perceptron in the context of the machine learning algorithm.\
    \ Here, the perceptron is defined as an algorithm that predicts whether a given\
    \ feature belongs to a specific class or not. From this angle, the algorithm is\
    \ considered a binary classifier that is used for supervised machine learning.\
    \ In most cases, the feature to be studied is always represented by a number with\
    \ both magnitude and direction. As a classifier, the perceptron is used for linear\
    \ classification and representation of data in graphical forms. The graphical\
    \ representation model can take either two-dimension or the multi-dimension way.\
    \ The perceptron identifies a feature, weighs its sum, and give an outcome of\
    \ value that is `1` if the weighted summation is higher than the result from other\
    \ function.\n\nThe equation supports this statement in the image below ![](rsrcTF.jpg)When\
    \ the equation edge is substituted (second equation in the image above) and made\
    \ to be constant with the weight of a given parameter, the equation in the image\
    \ below is arrived at. ![](rsrcTM.jpg)A single unit of a perceptron algorithm\
    \ can be used to perform a divisible linear equation. The only group works by\
    \ weighting or assigning a weight to both Boolean and positive metrics, with a\
    \ corresponding partiality.\n\n## Using a Perceptron to Perform an OR Function\
    \ ![](rsrcTU.jpg)\n\nIn the image above, conditions have been defined in line\
    \ with the OR function. Such terms are meant to meet the optimum model, which\
    \ requires the summation of weighted data to be zero (`0`) or more than it, for\
    \ a given outcome of value one (`1`). The summations of the weights have been\
    \ done a straight line that separates the positive (+) values from negative (-)\
    \ values established. The Minsky proposal set out the standards of learning the\
    \ features by the use of sample data. The proposed models have been described\
    \ below.\n\n## Basic Components of Linear Algebra\n\n### Vector\nThe vector value\
    \ can represent a lot of things. The vector value can represent a lot of things\
    \ depending on the type of data. Thus, there is more than one way of describing\
    \ a vector. It may be a line with an arrow being the head and the other point\
    \ without an arrow as the origin. \n\n### Representing a Vector\nA vector can\
    \ be expressed in a two-dimension and three-dimension, depending on the choice\
    \ of the user. Below is a two-dimensionally described vector (the first image)\
    \ and a 3-D one (the second image). ![](. \n\n### Calculating the Dot Product\
    \ of Two Vectors\nGiven two vectors `(n+1, w)` and `(n+1, x)`, their dot product\
    \ is calculated using the formula below. For substitution of value, the formula\
    \ I written in a matrix form ![](rsrcUK.jpg)From the equation, the vectors `/w/`\
    \ and `/x/` are represented by a line with an arrow. The dimension of the vectors\
    \ is the `(n+1)` value. The outcome of the computation represents the dot product\
    \ of `/w/` and `/x/`. This result shows the extent to which a single vector goes\
    \ to the direction of the other vector. A perceptron creates a line that separates\
    \ the positive value from the negative ones. For the function in our example,\
    \ this is represented as `w. x = o`.\n\n### The Angle Between Two Vectors\nThe\
    \ dot product mentioned above can be calculated using a different method. However,\
    \ certain conditions must be met:\n\n1. The angle between the vectors must be\
    \ known.\n2. The magnitude of the vectors must be known.\n\nWhen conditions are\
    \ met, the computation of the dot product is done by substituting in the formula\
    \ in the image below ![](rsrcV3.jpg)The reverse method can be used to determine\
    \ the angle between the two vectors. This can be done by first identifying the\
    \ vector, getting its magnitude and the dot product. The image below can guide\
    \ in the substitution of values into the equation ![](rsrcV9.jpg)\n"
