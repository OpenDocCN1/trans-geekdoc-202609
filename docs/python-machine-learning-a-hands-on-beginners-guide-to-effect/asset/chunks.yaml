- fmt: "\n# Chapter 8: Decision Trees ![](rsrcY2.jpg)\n\nA decision tree is a decision-support\
    \ tool with a tree that utilizes tree-like graphs to explain concepts. It uses\
    \ utility, resources costs, and event outcomes. It is suitable for showing algorithms\
    \ with only conditional control statements. In a decision tree, every internal\
    \ note symbolizes a test on the attribute while the branch stands for the results\
    \ of the test. Leaf nodes represent class labels and the distance from the root\
    \ to the leaf signify the classification rules.\n\nDecision trees are helpful\
    \ in learning algorithms and are widely used. Moreover, tree-based learning algorithms\
    \ are popular learning methods. Some of the reasons why decision trees are common\
    \ are because they empower predictive models with straightforward interpretation\
    \ and efficiency. They are also accurate, stable, and reliable. They are also\
    \ ideal for linear mapping models, unlike other tools. Decision trees solve all\
    \ kind of challenges and never disappoint. Many people attest to the fact that\
    \ this decision-support tool has helped them overcome problems and reach the helm.\n\
    \nDecision tree algorithms are known as `Classification and Regression Trees (CART)`.\
    \ It is useful for tackling data science challenges. In a decision tree, the term\
    \ `Root Node` stands for the entire population, which is divided further into\
    \ homogenous groups. When sub-nodes are split further, they are referred to as\
    \ decision nodes. Splitting is the act of dividing nodes into sub-nodes. Pruning\
    \ refers to the process of removing sub-nodes of decision nodes. \n\nDecision\
    \ trees are made in such a way that they fit easily in programmatic structures.\
    \ They are laid out to categorize issues when they arise. People can use decision\
    \ trees to know the species of plants. There are many assumptions people make\
    \ when creating decision trees. Many people consider the entire training set as\
    \ a root in the beginning. Records are divided based on attribute values. Most\
    \ people prefer feature values to be categorical. Below is an example of a decision\
    \ tree. ![Image result for a decision tree](rsrcY7.jpg)\n\n## Applications of\
    \ Decision Trees\n\nDecision trees are used for several reasons. Data miners use\
    \ decision trees to analyze data. It is also commonly used in machine learning\
    \ and similar activities. For example, decision trees can be used to evaluate\
    \ opportunities for brand expansion using historical sales data. It can also be\
    \ used to determine possible customers using demographic data. Many companies\
    \ use decision trees to evaluate their performance in the market and determine\
    \ their buyers. This allows them to adjust their marketing tactics to suit the\
    \ target customers. It also informs them of problematic areas and how to approach\
    \ buyers. Knowing possible buyers enables a firm to limit its advertising budget.\
    \ Most of the time, companies spend a lot of money creating adverts without knowing\
    \ where to target. They end up with more losses than profits. They are not able\
    \ to recover even when a product makes massive sales.\n\nDecision trees are also\
    \ used to predict the possibility of a default borrower using the predictive model.\
    \ One of the reasons why companies go bankrupt is because of default borrowers.\
    \ Some people do not keep their word when it comes to returning borrowed money.\
    \ To evade such individuals, companies can use predictive models obtained from\
    \ historical data to know such people. Doing this saves both time and operations\
    \ of the company.\n\nDecision trees are also used in operations research to know\
    \ a strategy that has a high chance of meeting set targets. There is no need in\
    \ doing a research without knowing its end goal. A decision tree helps in performing\
    \ decision analysis and makes work easy for researchers. Many industries have\
    \ used decision trees to interpret data, including engineering, financial, energy,\
    \ education, and business. People who were using other tools and techniques to\
    \ analyze data have switched to decision tree because of its benefits.\n\n## Advantages\
    \ and Characteristics\n\nDecision trees have numerous advantages that make them\
    \ worthwhile. They are easy to understand. There are several tools that are used\
    \ to solve problems, but most of them are hectic and need skills. On the contrary,\
    \ decision trees are simple and do not require a lot of attention to understand.\
    \ Even people without analytical knowledge can use decision tree. It is not a\
    \ must to have statistical knowledge to understand decision tree. The graphical\
    \ representations used are simple, and users can relate to. Moreover, they have\
    \ a simple hypothesis that users can relate to.\n\nDecision trees are effective\
    \ in data exploration. They are useful in identifying the best variable and links\
    \ between variables. For the longest, people used variables that did not yield\
    \ results. Researchers were frustrated because they could not explore fully, decision\
    \ trees changed the narrative. Now researchers can explore data with ease. Moreover,\
    \ they can create new variables to predict target variables. Compared to other\
    \ modeling techniques, decision tree is not influenced by missing values or outliers.\
    \ It is also a non-parametric method which means they have no assumptions about\
    \ the classifier structure. \n\n## Challenges and Optimization\n\nDespite its\
    \ benefits, decision tree has disadvantages that users should keep in mind. In\
    \ some cases, tree learners might create trees that do not generate expected results.\
    \ The case of creating a complex tree is known as overfitting, and many people\
    \ fall under this category. To solve this problem, users set constraints on model\
    \ parameters. Another challenge with decision tree is the fact that it does not\
    \ fit continuous variables. If you are working with a numerical variable, you\
    \ stand a high chance of losing information. Moreover, decision tree tends to\
    \ be unstable in case the tree is altered. A slight variable can result in a completely\
    \ different thing.\n\nThere are greedy algorithms which do not return if users\
    \ use the tree. Decision trees do an excellent job in determining variables but\
    \ require careful mitigation to avoid errors. There is no guarantee of a good\
    \ outcome and the user must constantly monitor it to interpret performance. At\
    \ the bottom of decision tree lies terminal nodes. Terminal nodes are bottom because\
    \ decision trees are drawn upside down. Classification trees and regression trees\
    \ have similarities and differences. Both work in a similar way where dependent\
    \ variables are continuous. On the contrary, classification trees are employed\
    \ whenever dependent variables are categorical. Both trees are known to divide\
    \ the predictor space into separate regions. They also take a greedy approach\
    \ and continue until the criteria stipulated by the user are met. The splitting\
    \ process contributes to full trees. However, a possibility that the grown tree\
    \ might overfit data, this is where pruning comes in. Deciding to split a tree\
    \ affects its performance. It can derail or improve accuracy based on how it is\
    \ done. The decision criteria vary depending on whether it is regression trees\
    \ or classification trees. Several algorithms are used when deciding whether to\
    \ split a decision tree into sub-nodes. The target variable affects the purity\
    \ of the node. After splitting the node on variables, decision trees pick the\
    \ one with more homogenous sub-nodes.\n\nA tree has several uses in real life\
    \ and it turns out it is also applicable in machine learning. It can be used to\
    \ represent decisions virtually in decision analysis. The question that runs people’\
    \ minds is how an algorithm can be represented by a tree. Similar to how a real-life\
    \ tree has many parts, decision trees also have several parts which perform different\
    \ functions. It is essential to understand all the parts in a decision tree and\
    \ their role. While the dataset has more features, we cannot overlook the simplicity\
    \ of a decision tree. For someone to grow a tree, he/she must decide the features\
    \ to use and conditions that are favorable for splitting. The person also needs\
    \ to know when to stop. Trimming the tree is important because it grows habitually.\
    \ You also need to be patient when creating a decision tree. Similar to how a\
    \ real-life tree takes time to grow and goes through the pruning process, you\
    \ must be patient when creating a decision tree. Rushing the process may cause\
    \ overfitting, so it is better to take time and do a good job.\n\nThere are various\
    \ techniques used for splitting, including recursive binary splitting, where all\
    \ features are taken into account. A cost function is used to test split points.\
    \ Many people do not know when to stop splitting a tree. Overdoing it can cause\
    \ more problems than expected, and it is important to stop at the right time.\
    \ Huge trees lead to overfitting; one way of avoiding this is setting a minimum\
    \ number of training input for every leaf. Some people are skeptical about this\
    \ strategy, but it works for many. Users need to find methods that work and stick\
    \ to them. What works for one may not do the same for another user.\n\nDecision\
    \ trees use algorithms such as `Gini Index` and `Chi-Square` to determine the\
    \ most homogenous nodes. `Gini Index` states that if one picks two items from\
    \ a sample randomly, they must be in the same class and the probability of this\
    \ happening is 1. The value of homogeneity increases with a high value of `Gini`.\
    \ `CART` utilizes `Gini Index` technique to create binary splits. `Chi-Square`\
    \ is another algorithm used by decision trees to calculate variables. It is used\
    \ to determine statistical significance between the parent node and sub-nodes.\
    \ It is measured by the value of squares of standard differences between expected\
    \ and observed frequencies. You can derive `Chi-Square` for each node by calculating\
    \ the deviation for both success and failure. The good news is that impure nodes\
    \ need less information to describe and vice versa. Some steps can be taken to\
    \ avoid over-fitting to improve efficiency of decision trees.\n"
