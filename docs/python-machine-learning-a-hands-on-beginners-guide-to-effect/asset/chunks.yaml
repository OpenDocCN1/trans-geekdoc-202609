- fmt: "\n# 1. K-means\n`K-means`, being an unsupervised algorithm, works by collecting\
    \ data in groups to form a `k` number of clusters.\n\n# 2. K nearest neighbor\n\
    Being a supervised algorithm, works by producing new data using the metrics in\
    \ the learning data. `KNN` does this to assign points according to the `k` value,\
    \ which represents the nearest point of data. Despite the difference in scope\
    \ and functions, both the `k nearest neighbor` algorithm and the `k means` algorithm\
    \ work by considering distance within the dataset.\n\n## Limitation of the K Nearest\
    \ Neighbor Algorithm\nA significant limitation of the classification method of\
    \ `k nearest neighbor` is the existence of bias among the classes. If the distribution\
    \ of elements in the class is twisted, the majority of items within the unit will\
    \ tilt the metrics to their side. For instance, the dominant feature within the\
    \ feature space will attract the estimating to their points because they are found\
    \ almost everywhere within the unit.\n\nHowever, such bias can be alleviated in\
    \ many ways. The most common method of overcoming prejudice is by setting an average\
    \ metric point in the class. The balance is found when the distance between the\
    \ `k nearest neighbor` is considerably weighted.\n\nSolving the problem of bias\
    \ in regression requires a different approach. A unit of the `k nearest neighbors`\
    \ is crossed by an average weight value that is inversely proportional to the\
    \ distance between the two points in the group. This is the distance from the\
    \ `nearest neighbor` to the test point. An additional method to be used can be\
    \ the generalization of the data representing each class. A case in point is representative\
    \ nodes in the `self-organizing map`, which represent the core point of the dataset.\
    \ The central location is, Therefore, regardless of the distribution of elements\
    \ in the class.\n\n## Advantages of K Nearest Neighbors\nBeing the easiest and\
    \ the simplest of all machine learning algorithms, the `k nearest neighbor`’s\
    \ algorithm boasts of many positives. The `k nearest neighbor` is also referred\
    \ to as the lazy learner. This name comes from the fact that the algorithm does\
    \ not learn anything during the training period. However, it gains on occasions\
    \ where it is required to perform a task. The lack of training period can be seen\
    \ as a win on its side.\n\nThe algorithm stores sets of learning data and uses\
    \ it when it is required to make predictions. The process ensures that the `KNN`\
    \ algorithm is the fastest among the machine learning algorithms, which need training.\
    \ Additional sets of data can be induced in the `k-nearest neighbor` flawlessly\
    \ without altering the prediction accuracy. This is supported by the fact that\
    \ it does not require training. The `k nearest neighbor` algorithm only requires\
    \ two metrics to function. The two parameters are the `k factor` and the `distance\
    \ function`. This makes the algorithm simple and easy to device.\n\n## Disadvantages\
    \ of K nearest neighbor\nThe algorithm cannot be effective when handling large\
    \ amounts of data. Large sets of data present a wide range between points, which\
    \ make the algorithm ineffective. As seen in the paragraph above, the algorithm\
    \ cannot work with large dimensions. When the distribution of data is broad, the\
    \ estimation of the distance between the nearest points becomes a challenge. `K\
    \ nearest neighbor` algorithm is susceptible to noise and other irregularities\
    \ in data. For effectiveness, manual methods are incorporated to remove outliers\
    \ and induce values that are not in the system. The algorithm usually requires\
    \ regular feature scaling.\n\n# Chapter 10: Random Forest Algorithms with Python\
    \ \nThis type of algorithm is the most available and common in recent years. There\
    \ are several factors that you need to comprehend this type of algorithm. The\
    \ main objective of this algorithm is to help with the regression and classification\
    \ computations using the raw natural data. \n\nWhen you talk of a `random forest`,\
    \ you refer to a collection of learning methods with multiple `decision trees`.\
    \ `Random forest` improves outcome by calculating the average of trees.\n\n##\
    \ Decision Trees\nThey refer to `decision trees` which mainly deal with binary\
    \ rules. They are applicable to continuous data like regression and also classification.\n\
    \n## Examples of Random Forest\nExamples of models include `logistic regression`,\
    \ `naïve Bayes`, and `support vector machines`. In most cases, it works best where\
    \ `decision trees` are entirely sampled and distributed equally to the forest.\
    \ \n\nYou can also say that `random forest` is a form of classifier comprising\
    \ a group of trees have been arranged structurally. From the layman's language,\
    \ you can deduce that `random forests` consist of a collection of tree predictors\
    \ which have been independently sampled. Therefore, you can also refer to it as\
    \ ‘forest of trees.’\n\n### Merits of Random Forest\n- It is certainly applicable\
    \ to both regression problems and classification.\n- It helps in reducing overfitting,\
    \ especially within the `trees`. All these are possible through performing averaging.\n\
    - It is the most accurate algorithm since it will only give a wrong prediction\
    \ if, at all, more than half of the data used are wrong.\n- It is good to note\
    \ that this machine learning algorithm entirely relies on `ensemble learning`.\n\
    \n### Demerits of Random Forests\n- It has an annoying and overlapping trend of\
    \ overfitting on some sets of data, especially the ones with regression tasks\
    \ and also the noisy classification.\n"
