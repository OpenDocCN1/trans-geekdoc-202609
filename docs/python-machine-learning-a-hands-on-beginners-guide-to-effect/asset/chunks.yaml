    * It''s a costly and highly complex algorithm as compared to other algorithms
    such as decision tree algorithm.

    * Its training takes long since it comprises a large combination of decision trees.


    Decision tree and random forests algorithms have different roles in data computations
    and outcome predictions. Again, the two have a specific time of implementation.
    That’s, the exact time you can eventually apply them in real life. Below illustrations
    give us enough explanations on when to use these two aspects of data prediction
    algorithms.


    ### When do we apply the decision tree


    * You can use the decision tree when you prefer the simplicity of your model with
    many explainable attributes.

    * You can also use this method, especially when you want your model to be non-parametric.

    * You can also apply this when you are not worrying any form of multicollinearity
    or something to do with regularization or feature selection.


    ### When do we apply random forest


    * When you require good data prediction accuracy even though you don''t worry
    about model interpretations.

    * When you are looking for accuracy while using a validation data set.


    ### How to Perform the Random Forest Algorithm


    The illustrations below show a clear step by step guideline on how to accomplish
    this kind of algorithm.


    1. You can start by picking a random number like say `X` from the random records
    within the sets of data.

    2. Try as much as possible to come up with a decision tree, basing your computations
    on `X` records.

    3. You can now choose the number you require especially the number of trees. Then,
    you can repeat these steps that''s step 1 and 2.

    4. For example, if you are solving a regression problem, dealing with a new record,
    every individual tree in those particular forests will have an output value of
    `Y`. In this case, you can quickly get the final value by computing the average
    of all the predictions.

    5. Also, if it is a classification problem, the predictions narrow to an individual
    tree that''s, every tree takes part in categorical predictions which comprise
    of new recordings. Eventually, the category with the majority votes will have
    the power to handle the new records.


    ### Feature Selection Methods in Random Forest


    Random forests boast of being popular within the technological world. The main
    attributes towards this are their robustness, accuracy and also you can use them
    more easily. It provides two strict methods that you can employ in your feature
    selection, as shown in the illustrations below.


    #### Mean Decrease Impurity


    Random forests comprise of various decision trees. Each node in that decision
    trees represents a situation of only one single feature. The primary function
    of this node here is to split those datasets into two equal parts in that same
    set will have similar values at the end. All these happen at the optimal level
    condition which you can refer to as impurity. However, in classification, you
    can call it Gini impunity or instead information gain, which is also entropy.
    In most cases, you can call it variance in regression. Therefore, when having
    some sorts of tree training, you can eventually compute the amount reduced by
    each feature on the impunity, which is weighted. In the case of a forest, you
    can calculate the decreased impurity by getting their average and later on ranking
    them using the same measure. However, in this method, there are things of great
    importance to keep in your mind. The first one is that when you compute more categories,
    the chances of getting biased is high. The next thing to keep in mind is that
    it treats all the correlated features equally, but when you take one as a predictor,
    then the importance of the rest reduces. This is because one feature reduces the
    impurities of the other features.


    #### Mean Decrease Accuracy


    This category involves getting the accuracy of impacts features by measuring them
    directly. The main objective here is to detect the level of reduction inaccuracy
    caused by the permutation, especially within the accuracy model.


    ### Summary


    Random forests form a large part in the methods used to solve day to day problems
    and tasks using a computer. They are high in terms of feature ranking since you
    can easily apply them. It is also good to note that Random Forest minimal engineering
    techniques towards its feature. Also, it doesn''t need much care of its parameter
    tuning. As a result, you will realize that there is an exposure of mean decrease
    impurity, especially on these libraries. However, all these have serious problems,
    especially when you are dealing with data interpretation. In that, in correlated
    features, chances of getting low scores with stronger features are high. Due to
    this, you end up affected by issues of biasedness towards variables comprising
    of several categories. Nevertheless, you can keep all these critical issues in
    your mind and use this method on your data. It is also good to note that sometimes,
    the predicted outcome might have some errors and less accurate. However, there
    are several ways we can always use to improve our outcome. The first one involves
    fine-tuning of the used parameters within the algorithm. In this case, the vital
    parameters include the split features, the tree depth and also the total number
    of the trees.

