    # 第 3 章：Python 在机器学习中的应用 ![](img/rsrcDT.jpg)


    机器学习及相关技术（如人工智能，AI）是现在和未来的核心技术。在一个日益趋向于更个性化设备和具有改进及技术功能的机器的世界里，科技公司和创新者正处于全力运转状态，研究、开发和测试未来的创新技术。这些技术旨在彻底改变人类体验，同时也巩固机器（尤其是计算机）作为人类生活所有领域主要驱动力的地位。


    虽然这些公司和个人表面上致力于满足不断变化的人类需求，从而提升用户体验，但他们也在寻求开发能够增加其利润的技术。这些新技术不仅利用海量数据来执行人工无法完成的复杂过程，而且具有更高的准确性和效率。它们还可以分析数据模式以进行预测，并提前为问题提供解决方案。从本质上，机器学习和人工智能的基础是将过去几十年中的许多科幻小说变为现实。


    然而，人工智能技术也带来了一个劣势，即需要收集和分析大量数据以处理这些复杂过程。此外，将科幻变为变为现实还需要编程、创意、概念化、构思和分析方面的技能储备。但最重要的是，它需要一种易于理解且灵活易用的正确编程语言。作为一名为改变人类体验的下一个变革性技术编写算法的程序员，你最不需要被困于一种缺乏活性且无法处理数据复杂性的编程语言。这很容易导致机器程序或应用程序编码中出现错误。


    代码错误可能会给开发者带来尴尬的局面，2016 年涉及微软聊天框的案例就是一个例子：该聊天框发生故障，转而向千禧一代发送歧视女性的信息，而不是预期的快乐和积极的主题信息。全球领先的在线零售商亚马逊在
    2014 年也遭受了声誉损害，当时其为人才招聘设计的 AI 机器变成了一个歧视性工具，专门针对女性申请者。这些只是涉及少数知名科技巨头的案例，它们的机器学习和人工智能算法由于编程问题而表现异常。


    ## Python 与人工智能及机器学习（ML）训练


    如果没有正确的编程语言，要训练计算机像人类一样学习和预测能力，而无需持续的特定基于过程的编程，这是一项艰巨的任务。通过消除对显式编程的需求，程序开发人员需要向计算机提供正确的训练数据，计算机将将其作为参考点，就像一个供其学习的图书馆。这是传统编程与非传统编程项目（如`IA`或机器学习）之间的主要区别点之一。


    使用训练数据，程序员能够使用大量代码行来开发软件，为机器创建所需的算法。然而，此类复杂项目需要精通统计学和数学优化以获得最佳结果：一个没有编码错误的算法，以避免导致机器故障的错误。此外，程序员还应该理解概率的概念，以确保开发的算法能够进行预测，而这是具备
    AI 能力的机器的主要功能之一。


    为了便于执行此类复杂的编程任务，由软件工程大师 Guido van Rossum（范·洛姆）构想的编程语言`Python`配备了各种库或模块。这些模块在程序员编写代码时非常有用，因为它们包含了已经写好的内置代码。程序员可以使用这些预先编写的代码作为他们为特定项目编写的算法的骨干。有了现有的代码，程序员就可以快速启动并开发基于人工智能的技术所需的更复杂的算法。这是因为编程语言模块自带的代码具有支持基本功能的条目。它们还作为下一组编码操作的发射平台，从而消除了从头开始任何编程项目的需求。


    Python 广泛的库生态系统包括：`Scikit-learn`、`Seaborn`、`NumPy` 和 `Pandas`。其他的包括 `Keras` 和
    `SciPy`。这些库集在人工智能和机器学习算法开发过程中针对不同任务进行了专门化。例如，`Seaborn`模块主要用于涉及机器学习训练数据可视化的编码任务。这包括为了绘制统计模式而对数据进行探索。机器从这些模式利用其
    AI 来预测场景。


    另一方面，`Pandas`由于其功能多变性，显然是使用`Python`语言的程序员中最受欢迎的库集。该模块适用于所有形式的与编码相关的数据分析。作为一种面向对象的语言，`Python`在编码期间严重依赖对这些数据的分析和解释，以开发机器可以从中学习并利用这些知识进行预测的算法。这就是为什么
    `SciPy` 和 `NumPy` 是最重要的 `Python` 库。


    '
