  raw: "Chapter 2: Types Of Machine Learning ![](rsrc5E.jpg)In a world soaked in artificial\
    \ intelligence, it is interesting to understand machine learning in depth. This\
    \ is a concept that allows an algorithm to perform specific tasks without relying\
    \ on any explicit instructions. Instead, the machine relies on inference and patterns\
    \ such that the user feeds data to a generic algorithm rather than writing the\
    \ code. In response, the machine constructs the logic based on the input data.\
    \ Usually, the accuracy of the prediction made by the algorithm is evaluated and\
    \ the algorithm only gets deployed when the precision is acceptable. Types of\
    \ Machine Learning There are three broad categories of machine learning. We will\
    \ discuss each of them in detail below. \n\n1.  Supervised Learning \n\nThis paradigm\
    \ happens to be the most popular, probably because it is easy to comprehend and\
    \ execute. Here, the algorithm creates a mathematical concept from a labeled dataset,\
    \ i.e a dataset containing both the input and output parameters. This dataset\
    \ acts as a trainer to the model. Taking an example, we may decide to use the\
    \ algorithm to determine whether a particular image contains a certain object.\
    \ In this case, the dataset would comprise images with and without the input (that\
    \ object), with every image having the output designating whether or not it contains\
    \ the particular object. The algorithm is likely to predict any answer; whether\
    \ right or wrong. However, after several attempts it gets trained on picking only\
    \ the images containing the said object. Once it gets totally trained, the algorithm\
    \ starts making right predictions even when new data is input. A perfect example\
    \ of a supervised learning model is a support vector machine. On the diagram below,\
    \ the support vector machine divides data into sections separated by a linear\
    \ boundary. You realize the boundary separates the white circles from the black.\
    \ ![C:\\\\Users\\\\USER\\\\Desktop\\\\support vector machine.png](rsrc5W.jpg)Types\
    \ of Supervised Learning \n\n*   Classification : These algorithms are used in\
    \ instances where the outputs are limited to discrete values. In the case of filtering\
    \ emails for example, an incoming mail would be classified as the input, whereas\
    \ the output would be the folder name. \n\n*   Regression : This is the algorithm\
    \ under which the output has a continuous value, which means they many pick on\
    \ any value within a given range. Perfect examples include; temperature, wind\
    \ speed, price of a commodity etc. \n\n![](rsrc68.jpg)Supervised machine learning\
    \ is exhibited in many common applications, some of which we have discussed below.\
    \ ➢        Advertisement Status : Most of the ads that you encounter when browsing\
    \ the internet are positioned there because a supervised learning algorithm vouched\
    \ for their clickability and popularity. ➢        Face Recognition : This one\
    \ is quite common on Facebook. It is very likely that your face has been used\
    \ in a supervised algorithm that is trained to recognize it. When Facebook is\
    \ suggesting a tag you must have noted that the system guesses the persons on\
    \ the photo, which is a supervised process. ➢        Spam Classification : The\
    \ spam filter that you find on your modern email system is a supervised learning\
    \ concept. Apart from preemptively filtering spiteful emails, the system also\
    \ allows the user to provide new labels and express their preference. See the\
    \ illustration on the figure below. ![C:\\\\Users\\\\USER\\\\Desktop\\\\spam classification.jpg](rsrc6J.jpg)\n\
    \n2.  Unsupervised Learning \n\nAs the name suggests, unsupervised machine learning\
    \ is the exact opposite of supervised learning. The model finds structures in\
    \ the data and also learns through observation. When given a dataset, the model\
    \ automatically finds relationships and patterns by creating clusters in the dataset.\
    \ The paradigm cannot add labels to the created cluster, but it does the creation\
    \ perfectly. This means that if we have a set of apples and oranges, the model\
    \ will separate the apples from the oranges, but will not say that this is a set\
    \ of oranges or apples. Now, suppose we had more than two sets, say we present\
    \ images of grapes, oranges, and apples. As explained above, the model, based\
    \ on some relationships and patterns, will create clusters and separate the datasets\
    \ into those clusters. Whenever new data is input, the model adds it to one of\
    \ the already built clusters as shown in the figure below. You realize the output\
    \ is grouped perfectly even without addition of labels. ![](rsrc6Z.jpg)Let us\
    \ take another classical example for better understanding. Think of a little baby\
    \ and his family dog. He very well identifies its features. When a family friend\
    \ brings along another dog to try play with the baby, the baby will identify that\
    \ as a dog even without anyone telling them. They will easily classify it because\
    \ it has the features like two eyes, ears, walks on four, among other details.\
    \ This falls under unsupervised learning because you classify the input data without\
    \ being taught. If it were supervised learning, the family friend would have to\
    \ tell the baby that it’s a dog. Types of Unsupervised Learning \n\n*   Clustering:\
    \ This concept identifies a pattern in an assortment of unclassified data. Clustering\
    \ algorithms categorize any existing natural groups in the data. The user is also\
    \ at liberty to adjust the number of cluster they want their algorithms to identify.\
    \ Under clustering there are more types that you can utilize; \n\n❖         Exclusive\
    \ (partitioning) Under this type, classification of data is done such that one\
    \ data can only belong to a single only. K-means serves as a perfect example.\
    \ ❖         Agglomerative This is the technique where every data is in itself\
    \ a group. The number of clusters is reduced by the iterative mergers between\
    \ the two closest groups. An example is the hierarchical clustering. ❖        \
    \ Overlapping Under this technique, data is associated with a suitable association\
    \ value. Fuzzy sets are used in grouping data and each point could fit into two\
    \ or more groups with different membership degrees. Fuzzy C-Means is a suitable\
    \ example under this type. ❖         Probabilistic This concept creates clusters\
    \ using probability distribution. See the example below given some keywords; \n\
    \n*   “Men’s pants” \n\n*   “Ladies’ pants” \n\n*   “Men’s wallets” \n\n*   “Ladies’\
    \ wallets” \n\nThe given keywords could be grouped into two; “pants” and “wallets”\
    \ or “Men” and “Ladies”. \n\n*   Association "
