    * 与决策树算法等算法相比，这是一种高成本且极其复杂的算法。

    * 它的训练耗时很长，因为它包含了大量的决策树组合。


    决策树和随机森林算法在数据计算和结果预测中扮演着不同的角色。此外，这两种都有特定的实现时间，即你最终在现实生活中应用它们的确切时。下面的插图为我们解释了何时使用这两种数据预测算法的方面。


    ### 何时应用决策树


    * 当你倾向于使用具有许多可解释属性的简单模型时，可以使用决策树。

    * 你也可以使用这种方法，特别是当你希望模型是非参数化的时。

    * 当你不担心任何形式的多重共线性，或者与正则化或特征选择有关的问题时，也可以应用这种方法。


    ### 何时应用随机森林


    * 当你需要良好的数据预测准确性，即使你不在乎模型的解释性时。

    * 当你在使用验证集寻找准确性时。


    ### 如何执行随机森林算法


    下面的插图展示了如何完成此类算法的清晰分步指南。


    1. 你可以开始从数据集的随机记录中选取一个随机数，例如 `X`。

    2. 尽可能根据你的 `X` 记录尝试计算出一棵决策树。

    3. 你现在可以选择你需要的数量，特别是树的数量。然后，你可以重复这些步骤（即步骤 1 和步骤 2）。

    4. 例如，如果你正在解决回归问题并处理一条新记录，这些特定森林中的每棵树都将有一个输出值 `Y`。在这种情况下，你可以通过计算所有预测的平均值来快速获得最终值。

    5. 同样，如果是分类问题，预测将缩小到单棵树，即每棵树都参与对新记录的分类预测。最终，获得多数票的类别将具有处理新记录的权限。


    ### 随机森林中的特征选择方法


    随机森林在技术领域非常受欢迎。这的主要属性是它们的稳健性、准确性，而且你可以更方便地使用它们。它提供了两种可以在特征选择中使用的严格方法，如下插图所示。


    #### 不纯度平均减少 (Mean Decrease Impurity)


    随机森林由各种决策树组成。这些决策树中的每个节点代表一个单一特征的情况。这里节点的主要功能是将数据集分成两个部分，使得同一组在末尾具有相似的值。所有这些发生在最优水平条件下，你可以将其称为不纯度。然而，在分类中，你可以将其称为
    Gini 不纯度或信息增益（后者也是熵）。在大多数情况下，在回归中你可以将其称为方差。因此，在进行某种树训练时，你最终可以计算每个特征对加权不纯度减少的量。在森林的情况下，你可以通过获取平均值来计算减少的不纯度，稍后使用相同的标准对其进行排名。然而，在这种方法中，有一些非常重要的点需要牢记心中。第一点当计算更多类别时，产生偏差的概率很高。需要记住的一点是它等对待所有相关特征，当你将其中一个作为预测器时，其他特征的重要性就会降低。这是因为一个特征减少了其他特征的不纯度。


    #### 准确率平均减少 (Mean Decrease Accuracy)


    这一类涉及通过直接测量获取影响特征的准确性。这里的主要目标是检测置换引起的不准确性减少水平，特别是在准确性模型内部。


    ### 总结


    随机森林在利用计算机解决日常问题和任务的方法中占很大比例。它们在特征排序方面表现优秀，因为你可以轻松应用它们。同样要注意，随机森林对其特征的最小工程技术要求较低。此外，它不需要过多的参数调优。结果，你会发现不纯度平均减少的暴露，特别是在这些库中。然而，所有这些都存在严重问题，特别是当你处理数据解释时。这时，在相关特征中，强特征获得低得分的概率很高。由于由于，你最终会受到包含多个类别变量偏差问题的影响。尽管如此，你可以将所有关键问题留存在心中，并在你的数据上使用这种方法。同样值得注意的是，有时预测结果可能会出现错误且准确性不高。然而，我们始终可以使用几种方法来改进结果。第一种方法涉及对算法内部使用的参数进行微调。在这种情况下，关键参数包括分裂特征、树深度以及树的总数。


    '
