    # 1. K-means

    `K-means` 是一种无监督算法，通过将数据分组以形成 `k` 个聚类来工作。


    # 2. K 最近邻 (K nearest neighbor)

    作为一种监督算法，它通过使用学习数据中的指标来产生新数据。`KNN` 通过根据 `k` 值来分配点，其中 `k` 值代表最近的数据点。尽管在范围和功能上存在，但
    `k nearest neighbor` 算法和 `k means` 算法都是通过考虑数据集内部的距离工作的。


    ## K 最近邻算法的局限性

    `k nearest neighbor` 分类方法的一个显著局限是类别之间存在偏差。如果类别内元素的分布是扭曲的，那么单元内的大多数项将使指标向它们的一倾斜。例如，特征空间内的主导特征将吸引估计值到这些点，因为这些点在单元内几乎无处不在。


    然而，这种偏差可以通过许多方法缓解。克服偏见的最常见方法是在类中设置一个平均指标点。当 `k nearest neighbor` 之间的距离被大幅度加权时，就能找到平衡。


    解决回归中的偏差问题需要不同的方法。`k nearest neighbors` 的单元通过一个平均权重值交叉，该权重与组内两点之间的距离成反比。这是从 `nearest
    neighbor` 到测试点的距离。可以使用的另一种额外方法是代表每个类的数据进行泛化。一个例子是 `self-organizing map` 中的代表节点，它们代表了数据集的核心点。因此，无论类内元素的分布如何，它们都处于中心位置。


    ## K 最近邻的优点

    作为所有机器学习算法中最简单、直接的一种，`k nearest neighbor` 算法具有许多优点。`k nearest neighbor` 也被称为懒惰学习者。这个名字来源于该算法在训练期间不学习任何东西。然而，在需要执行任务时，它会有优势。缺乏训练期可以看作是其的一种优势。


    该算法存储一组学习数据并在需要预测时使用它们。这一过程确保了 `KNN` 算法在所有需要训练的机器学习算法中是最快的。在 `k-nearest neighbor`
    中可以完美地引入额外的数据集，而不会改变预测准确性。这一点得到了不需要训练这一事实的支持。`k nearest neighbor` 算法只需要两个指标即可运行。这两个参数是
    `k factor` 和 `distance function`。这使得算法简单且易于设计。


    ## K 最近邻的缺点

    该算法在处理大量数据时可能无效。大型数据集点与点之间存在巨大的范围，导致算法失效。如上段所示，算法无法在高维数据上工作。当数据分布很广时，估计最近点之间的距离变成了一个挑战。`K
    nearest neighbor` 算法容易受到数据中噪声和其他不规则的影响。为了提高有效性，引入了人工方法来消除离群值并引入系统中不存在的值。该算法通常需要进行特征缩放。


    # 第 10 章：基于 Python 的随机森林算法

    这种算法是近年来可用且最常见的。有几个因素你需要理解这种算法。该算法的主要目标是帮助使用原始自然数据进行回归和分类计算。


    当你谈到 `random forest` 时，你指的是包含多个 `decision trees` 的学习方法集合。`Random forest` 通过计算树的平均值来改进结果。


    ## 决策树

    它们指的是 `decision trees`，主要处理二值规则。它们适用于回归等连续数据，也适用于分类。


    ## 随机森林示例

    模型示例包括 `logistic regression`、`naïve Bayes` 和 `support vector machines`。在大多数情况下，当
    `decision trees` 被完全采样并均匀分布到森林时，它的效果最好。


    你也可以说 `random forest` 是一种由一组结构化排列树组成的分类器。从外行的语言来说，你可以推断出 `random forests` 由一组独立采样的树的预测器组成。因此，你也可以将其称为“树的森林”。


    ### 随机森林的优点

    - 它显然适用于回归问题和分类。

    - 它有助于减少过拟合，特别是在 `trees` 内部。这些都是通过执行平均化来实现。

    - 它是最准确的算法，因为只有当使用的数据中超过一半是错误的时，它才会给出错误的预测。

    - 值得注意的是，这种机器学习算法完全依赖于 `ensemble learning`。


    ### 随机森林的缺点

    - 它在某些数据集上具有令人讨厌的且重叠的过拟合趋势，特别是带有回归任务和噪声分类任务的数据集。


    '
