    \ midst of data objects inside big databases. As the name suggests, the technique\
    \ seeks to discover unique relations between variables contained in large databases.\
    \ For instance, shoppers could be grouped based on their search and purchase histories.\
    \ Applications of Unsupervised Machine Learning Unsupervised ML is based on data\
    \ and its attributes, and Therefore, we can conclude that it is data-driven. The\
    \ results from a task are controlled by the nature in which the data is formatted.\
    \ Some of the common areas that rely on unsupervised learning include but are\
    \ not limited to; ➢        Buying Habits: It is not surprising to find your purchasing\
    \ habits stored in a database somewhere. The information could be used by marketers\
    \ to group clients into similar shopping segments so that they can reach out to\
    \ them easily. The clustering is easy to do under unsupervised learning algorithms.\
    \ ➢        Recommender Systems: If you are a Netflix or YouTube user you might\
    \ have encountered a video recommendation severally. Often times these systems\
    \ are contained in the unsupervised domain. The system knows the watch history\
    \ of its users. The model uses the history to identify relationships between users\
    \ who enjoy watching videos of certain genres, length, etc, and prompt them with\
    \ a suggestion of related videos that they may not have watched. ➢        Identification\
    \ of Fraudulent transactions: Anomaly detection is the technique used in discovery\
    \ of abnormal data points. The algorithm picks out any unusual points within the\
    \ data set, hence sending an alarm. Supervised Vs. Unsupervised ML Techniques\
    \ Data specialists employ an array of machine algorithms in their discovery operations.\
    \ Below are some insights on the classification of supervised and unsupervised\
    \ learning techniques, which will help you to judge when to use either of the\
    \ techniques. \n\n| Parameters  || Supervised machine learning  || Unsupervised\
    \ machine learning  |\n\n| --- | --- | --- |\n\n| Data usage  || Employs training\
    \ data to study the link between the input and output.  || Does not use output\
    \ data.  |\n\n| Accuracy of the outcome  || Highly accurate reliable.  || Less\
    \ accurate and Therefore, not trustworthy  |\n\n| Input data  || Labeled data\
    \ is used in training the algorithms.  || Algorithms are used against unlabeled\
    \ data.  |\n\n| Number of classes  || Known number of classes.  || Unknown number\
    \ of classes.  |\n\n| Major drawback  || Classification of big data.  || Failure\
    \ to get precise information concerning output and data sorting due to use of\
    \ labeled and unknown data.  |\n\n| Real time learning  || Learning takes place\
    \ offline.  || Learning happens in real time.  |\n\n| Process  || Both input and\
    \ output variables are given.  || Only the input data is given.  |\n\n| Computational\
    \ complexity  || Relatively simple; less complex.  || Complex in terms of computation.\
    \  |\n\nDeciding to employ a supervised or unsupervised machine learning algorithm\
    \ classically depends on your data volume and structure. Essentially, a well-formed\
    \ data science plan will employ both algorithm types to come up with predictive\
    \ data models. Now, these models are more advanced and help the stakeholders in\
    \ decision-making across a variety of business hold ups. \n\n3.  Reinforcement\
    \ Learning \n\nThis is a neural network learning technique that trains machine\
    \ learning concepts how to make a progression of decisions. The agent is trained\
    \ how to attain their objective in an indecisive, potentially complex environment.\
    \ In this technique, an artificial intelligence engages into a game-like situation\
    \ and the computer tries to solve the problem using trial and error method. For\
    \ the programmer to get the machine to do what they want, the artificial intelligence\
    \ gets penalized or rewarded for the actions performed. The idea is to fully exploit\
    \ the total reward. Usually there is a reward policy in form of game rules, but\
    \ the designer does not give any hints on how the model should solve the puzzle.\
    \ The model starts from completely random trials and advances to sophisticated\
    \ approaches and even superhuman skills. In the process, this technique leverages\
    \ the full power of search, hence qualifying to be the most effectual in hinting\
    \ machine’s creativity. As opposed to humans, artificial intelligence can employ\
    \ a reinforcement algorithm to collect experience from thousands parallel gameplays\
    \ as long as it is run on an adequately powerful computer infrastructure. Let\
    \ us look at a practical example that will perfectly illustrate the reinforcement\
    \ learning technique. However, before then we need to understand some terms that\
    \ we will use in the illustration. \n\n*   Agent: This is an implicit entity that\
    \ seeks to gain a reward by performing actions in an environment. \n\n*   Environment\
    \ (e): A situation that an agent must face. \n\n*   Reward (R): An instant response\
    \ given to an agent on performing a specific action. \n\n*   State (s): The current\
    \ scenario returned by the environment. \n\n*   Policy ( π ): An approach employed\
    \ by the agent to determine their next action based on the prevailing state. \n\
    \n*   Value (V): The projected long-term return, which is discounted comparing\
    \ with the short-lived reward. \n\n*   Value Function: This one stipulates the\
    \ total reward, i.e, the value of a state. \n\n*   Model based methods: Handles\
    \ the reinforcement learning-based problems that apply model-based techniques.\
    \ \n\n*   Model of the environment: It imitates the behavior of the environment,\
    \ helping you draw conclusions regarding environment behavior. \n\n*   Action\
    \ value / Q value (Q): This is not very different from value. In fact, the only\
    \ variation is that this one takes an extra parameter as a current action. \n\n\
    Illustration Think of trying to teach your dog some new tricks. This dog does\
    \ not understand human language so you need to devise a strategy that will help\
    \ you achieve your goal. You will initiate a situation and observe the various\
    \ reactions by your dog. If the dog responds in the desired way, you give him\
    \ some beef. You will realize that every time you expose the dog to a similar\
    \ condition, they will tend to respond with greater enthusiasm hoping to get a\
    \ reward (the beef). It means that the positive experiences inspire the responses\
    \ your dog gives. As well, there are the negative experiences that teach the dog\
    \ what not to do because should they do it, then they will certainly miss their\
    \ share of beef. In the given paradigm, your dog is an agent exposed to the environment.\
    \ You may decide to have your situation as requiring your sitting dog to walk\
    \ when you utter a particular word. This agent responds by performing an action\
    \ where they transition from one state to another, like transitioning from sitting\
    \ to walking. In this case, the policy is a process of choosing an action given\
    \ a state with the expectation of better results. After transitioning, the agent\
    \ may get a penalty or a reward in response. Reinforcement Learning Algorithms\
    \ There are three techniques in implementation of a reinforcement learning algorithm.\
    \ \n\n1.  Value-based: here, the agent is anticipating a long-term return of the\
    \ prevailing states under policy and so you ought to maximize the value function.\
    \ \n\n2.  Policy-based: under this RL scheme you endeavor to find a policy such\
    \ that the action executed in each state leads to maximal reward in the future.\
    \ \n\nPolicy-based method is further classified into deterministic, where the\
    \ policy produces the same action for any state, and stochastic, where every action\
