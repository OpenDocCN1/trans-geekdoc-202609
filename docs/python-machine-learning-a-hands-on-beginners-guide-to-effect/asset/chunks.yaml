- fmt: "\n# Chapter 3: Use of Python in Machine Learning ![](rsrcDT.jpg)\n\nMachine\
    \ learning and associated technologies such as artificial intelligence (AI) are\
    \ the technologies for the present and future. In a world that is increasingly\
    \ aggregated towards more personalized gadgets and machines with improved and\
    \ technical functionalities, tech companies and innovators are on the overdrive,\
    \ researching, developing and testing the innovative technologies of the future.\
    \ These technologies are aimed at revolutionizing the human experience while also\
    \ cementing the place of machines especially computers as the primary drivers\
    \ of all spheres of human life. \n\nWhile seemingly dedicated to meeting the ever-changing\
    \ human demand technology and hence, user experience, these companies and individuals\
    \ are also seeking to develop technologies that can increase their bottom line.\
    \ These new technologies not only use huge of data to execute complex processes\
    \ that cannot be accomplished manually, they are also come with increased accuracy\
    \ and efficiency. They can also analyze data patterns to make predictions and\
    \ come with solutions to problems beforehand. Essentially, machine learning and\
    \ AI are premised on turning the numerous scientific fictions of the past decades\
    \ into reality. \n\nHowever, AI technology comes with the added disadvantage of\
    \ collecting and analyzing large volume of data to process in order to execute\
    \ these complex processes. Additionally, bringing science fiction to life also\
    \ require skill sets in programming, creativity, conceptualization, ideation,\
    \ and analysis. But most importantly, it requires the right programming language\
    \ that is easier to understand and flexible to work with. The last thing you need\
    \ as a programmer writing the algorithms for the next game changer technology\
    \ that would transform human experiences is being stack with a programming language\
    \ that is inflexible and incapable of handling data complexity. This can easily\
    \ lead to error in the coding of the machine’s program or applications. \n\nA\
    \ code error can lead to embarrassing situations for developers as exemplified\
    \ in the 2016 case involving Microsoft’s chat box which malfunctioned and resorted\
    \ to communicating misogynistic messages to the millennials instead of the intended\
    \ happy and positive themed messages. Amazon, the world’s leading online retailer\
    \ also suffered a reputational damage in 2014 when its AI machine designed for\
    \ talent recruitment turned in a discriminative tool that singled out female applicants.\
    \ These are just a few cases involving well-established tech giants whose Machine\
    \ Learning and AI algorithms were erratic due programming issues. \n\n## Python\
    \ and AI and ML Training\n\nTraining a computer to possess human-like ability\
    \ of learning and making predictions without continuous specific process-based\
    \ programming can be daunting task without the right programming language. By\
    \ eliminating the need for explicit programming, a program developer would then\
    \ need to feed the computer the right training data what the computer will use\
    \ as a point of reference, more like a library to learn from. This is one of the\
    \ primary points of departures between traditional and non-traditional programming\
    \ projects such as `IA` or machine learning.\n\nUsing the training data, a programmer\
    \ will be able to develop a software using numerous lines of codes to create the\
    \ desired algorithms for the machine. However, such complex project require a\
    \ mastery of statistics and mathematical optimization to achieve the best result:\
    \ an algorithm free of coding errors which can lead to machine malfunctioning.\
    \ Additionally, a programmer should also understand the concept of probability\
    \ to ensure that the developed algorithms are capable of making predictions which\
    \ one of the primary functional capabilities of machines equipped with AI capabilities.\
    \ \n\nTo facilitate the execution of such complex programming tasks, `Python`,\
    \ a programming language conceived by the software engineering guru Guido van\
    \ Rossum, is equipped with various libraries or modules. These modules come in\
    \ handy for programmers when coding as they have inbuilt code pieces that are\
    \ already written. Programmers can use these pre-written codes as the backbone\
    \ of the algorithms they are aiming to write for a specific project. With a pre-existing\
    \ code, a programmer has the jumpstart to develop even complex algorithms that\
    \ artificial intelligence-based technologies require. This is because the codes\
    \ that comes with the programming language modules have level items that support\
    \ basic functionalities. They also act as launch pads for the next set of coding\
    \ actions thereby eliminating the need for starting afresh any programming project.\
    \ \n\nPython’s extensive library ecosystem includes: `Scikit-learn`, `Seaborn`,\
    \ `NumPy`, and `Pandas`. Others include `Keras` and `SciPy`. These sets of library\
    \ are specialized for different tasks during the development of algorithms for\
    \ AI and machine learning. For example, `Seaborn` module is primarily used for\
    \ coding tasks involving visualization of training data to be used in machine\
    \ learning. This includes exploration of data with the view of plotting statistical\
    \ patterns. It is from these patterns that machines use their AI to project scenarios.\
    \ \n\nOn the other hand, `Pandas` is readily the most popular set of library among\
    \ programmers using `Python` language because of its functional versatility. The\
    \ module is suitable for all forms of coding-related data analysis. As an object-oriented\
    \ language, `Python` relies heavily on analysis and interpretation of these data\
    \ during coding to develop algorithms that the machine can learn from and use\
    \ the knowledge to make predictions. This is why `SciPy` and `NumPy` are the most\
    \ important `Python` libraries.\n```\n"
