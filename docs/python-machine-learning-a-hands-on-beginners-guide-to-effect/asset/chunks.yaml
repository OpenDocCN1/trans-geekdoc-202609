    # `pandas` 在现实场景中的应用将使能够能够以下操作：


    - 你可以快速删除某些列，甚至添加 `Dataframe` 中发现的某些文本

    - 它将帮助你进行数据转换

    - `Pandas` 可以让你确保获取到错位或缺失的数据

    - 它具有强大的能力，特别是在根据功能对其他程序进行分组方面


    ## Matplotlib

    这是另一种复杂且实用的数据分析技术，有助于数据可视化。它的主要目标是根据各种输入为行业提供其所处位置的建议。当你无法与不同的利益相关者分享你的生产目标时，你会发现你的生产目标是毫无意义的。为了实现这一点，`Matplotlib`
    在所需的计算分析类型方面大大用用场。


    因此，它是每个科学家（尤其是处理数据的人员）都青睐的唯一 `python` 库。这种库在图形和图像方面外观良好。更重要的是，许多人倾向于使用它来创建各种用于数据分析的图表。然而，随着新的先进库涌入行业，技术世界已经完全改变。它还非常灵活，正因如此，你能够创建出可能需要的几张图表。只需几条命令即可完成此操作。在这个
    `python` 库中，你可以创建各种不同的图形、各种图表、多个直方图，甚至是散点图。你也可以使用相同的原理制作非笛卡尔图表。


    图解说明 ![](img/rsrcMC.jpg)


    上面的图表突出了某公司三年内的总体生产情况。它具体演示了 `Matplotlib` 在数据分析中的用法。通过观察图表，你会发现与另外两年相比，该年的产量较高。此外，公司在水果生产方面表现良好，因为它在第
    1 年和第 2 年处于领先，并在第 3 年持平。


    从图中你可以看出，由于使用了这个库，你的演示、表示甚至分析工作变得更加简单。这个 `python` 库最终将使你能够创作出良好的图形图像、准确的数据等等。通过这个
    `python` 库的帮助，你将能够记录下产量高的年份，从而处于保持高生产力季节的位置。值得注意的是，该库可以导出图形，并将这些图形转换为 `PDF`、`GIF`
    等。


    总之，该库可以轻松地完成以下任务。它们包括：

    - 折线图的形成

    - 散点图的绘制

    - 创建漂亮的条形图和构建直方图

    - 行业内各种饼图的应用

    - 数据分析和计算的茎状方案制定

    - 处于跟踪等高线图的位置

    - 频谱的使用，最后

    - 矢量图的创建


    ## Seaborn

    `Seaborn` 也是 `python` 类别中流行的库之一。它在这里的主要目标是帮助可视化。需要注意的是，该库的基础借用自 `Matplotlib`。由于其层次更高，它能够生成各种图表，例如热图的制作、小提琴图的处理，以及帮助生成时间序列图。


    图解插图 ![](img/rsrcMY.jpg)


    上面的折线图清楚地显示了公司使用的不同机器的性能。根据上面的图表，你最终可以推断并得出公司可以继续使用哪些机器以获得最大产量。在大多数情况下，通过 `seaborn`
    库帮助的这种评估方法将使你能够预测不同输入的准确能力。此外，这些信息实际上可以为未来购买更多机器的情况提供参考。`Seaborn` 库还具有检测公司其他变量输入性能的能力。例如，公司内的工人人数可以根据其相应的工作率轻松识别。##
    NumPy

    这是一个非常广泛使用的 `python` 库。它的特征使其能够执行多维数组处理。此外，它有助于矩阵处理。然而，这些只有在大量数学函数的帮助下才是可能的。需要注意的是，这个
    `python` 库在解决科学领域内最重要的计算方面非常有用。


    此外，`NumPy` 也适用于线性代数、行业内使用的随机数能力推导，特别是傅里叶变换。`NumPy` 也被其他高级 `python` 库（如 `TensorFlow`）用于
    `Tensors` 操作。简而言之，`NumPy` 主要用于计算和数据存储。你也可以将数据导出或加载到 `Python`，因为它具有那些能够执行这些功能的特征。值得注意的是，这个
    `python` 库也被称为数值 `python`。


    ## SciPy

    这是我们当今行业中最常用的库之一。它的特点是包含不同的模块，这些模块适用于数据分析的优化领域。它在积分、线性代数和其他形式的数学统计中起着重要作用。


    在许多情况下，它在图像处理中起着至关重要的作用。图像处理是日常活动中广泛应用的过程。Photoshop 等案例都是 `SciPy` 的例子。此外，许多组织在图像处理中偏于使用
    `SciPy`，特别是用于演示的图片。例如，野生动物可以使用不同的颜色描述一只猫。


    ![](img/rsrc7.jpg)

    上面的第一张图片是一只猫的图像![](img/rsrcNC.jpg)

    上面指的是第二张图片，它经过了处理![](img/rNH.jpg)

    下面是一只符合你喜好的猫的图像。


    ## Keras

    `Keras` 也是 `python` 库的一部分，特别是在机器学习领域。值得注意的是，`Keras` 具有在其他库上运行的能力，特别是 `TensorFlow`
    甚至 `Theano`。此外，它似乎可以在 `GPU` 和 `CPU` 上运行。对于大多数 `python` 编程初学者来说，`Keras` 提供了一条通往理解的安全路径。他们将能够设计网络甚至构建它。


    ## PyTorch

    `PyTorch` 是另一个易于使用但开源的 `python` 库。由于其名称，它在工具方面拥有广泛的选择。它也适用于我们有计算机视觉领域。计算机视觉和视觉显示在几种类型的研究中起着至关重要的作用。此外，它有助于自然语言的处理。更重要的是，`PyTorch`
    具有承担开发人员技术任务的能力，即使用计算进行巨大的计算和数据分析。它还可以帮助创建主要用于计算目的图表。由于它是一个开源的 `python` 库，它可以在其他库（如
    `Tensors`）上工作或执行任务。结合 `Tensors` `GPU`，其加速性将增加。


    ## Scrapy

    `Scrapy` 是另一个用于创建爬虫程序的库。那是爬虫机器人等。爬虫机器人经常有助于数据检索目的，也适用于网络使用的 URL 的形成。从从开始，它是为了协助数据采集。然而，它经历了多次演变，并导致了其通用用途的扩展。因此，`scrapy`
    库在我们目前的主要任务是作为通用爬虫。


    ## Statsmodels

    `Statsmodels` 是一个旨在使用多种统计计算和数据断言方法探索数据的库。它具有许多功能，如结果统计甚至特征功能。它可以通过各种模型的帮助来承担这一角色，例如线性回归、多元估计和涉及时间序列的分析。此外，其他模型（如离散选择）也适用于此处。


