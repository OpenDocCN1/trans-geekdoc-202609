    # Chapter 9 : K-Nearest Neighbors (KNN) ![](rsrcYU.jpg)


    The K-Nearest Neighbors is the simplest and the most used learning algorithms
    in classification and regression problems. This type is straightforward and easy
    to master. The value of a result for the solved puzzle is based on the selection
    made by the neighboring values. The purpose of this is to classify the most common
    class, following its K-nearest neighbors. KNN is sometimes used in a regression
    where the value of output is predicted as per the most continuous value. The output
    value can be a mean or median of the entire class (k-nearest neighbors). In both
    regression and classification problems, the value input that corresponds to `k`
    and is used for training is usually found in the feature space. The desired result
    depends on the type of machine learning for which KNN has been used, that is to
    say, either classification or regression.


    In simple terms, the KNN algorithm can be defined as one that classifies objects
    by putting them to the group they are close to. The method takes into account
    the features and data points in a set. For the algorithmic function, the process
    will try to find out a group in which object `X` belongs to by looking at the
    ends near object `X` in the same state. A result is founded by determining where
    the majority features lie. For example, if most of the points of an object fall
    in group `Y`, then object `X` is classified in group `Y`. This method of identifying
    a group in which item `X` belongs is used in classification. It works in the same
    way as a plural vote for the neighbors, and then the item is allocated a group
    in which the majority of its `k` nearest neighbors fall in. When the evaluation
    is done, and the value of `k` comes out as `1`, then the object is classified
    in that same class.


    KNN is sometimes referred to the lazy learner because it takes time to compute
    values. KNN is based on estimations, and the mathematical analysis is usually
    left pending up to the last step of classification. In both regression and classification
    problems, a single unit should be set as the average of a class. This is to ensure
    that the closest neighbor in that unit contributes to the metric more than the
    neighbors that lie far from the class. For instance, a good model will set a value
    at `1/x`, where the `x` is the distance between the nearest neighbors. For classification
    problems, the neighbors are chosen from units with a known value in terms of features
    and other parameters. The group can be considered as training datasets even though
    less training is done in the K nearest neighbor theory.


    A distinctive characteristic of the k nearest algorithm is its sensitivity to
    the components and the composition of a dataset. An example of training data that
    can be used for k nearest neighbor algorithm is a labeled vector, usually applied
    in feature space that has many dimensions. The algorithms learn by isolating feature
    vectors and the labeled classes in the training dataset. In the process of classifying
    objects, the value of `k` is usually constant and set by the user of the system.
    In the process, a vector without a label (used a testing data) is assigned a group
    by looking at the labels that frequently appear throughout the training set and
    is the closest to the vector. The training data set is also called the `k` sample.
    For a continuous variable, the Euclidean distance is the commonly used parameter
    for solving range related problems. For variables that are not continuous, also
    referred to as separate, a different setting is used to solve the problem. The
    performance of the nearest algorithm can be enhanced by the incorporation of other
    unique algorithms to study the elements that define the distance space.


