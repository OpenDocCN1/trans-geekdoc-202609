- fmt: "\n# Problem Representation Using the Perceptron\n\nThe set example is going\
    \ to be used to determine if a person will settle on a movie, basing on previous\
    \ data and inputs that are indicated on the diagram. The input data provided in\
    \ this diagram have both real (+) and negative values (-). The actual values represent\
    \ the movies watched by the person in question. We will use the data to see how\
    \ the perceptron learning algorithm estimates weight in a dataset. For simplicity\
    \ and clear visualization, we are going to use a 2-D representation.\n\n## Using\
    \ the Perceptron Learning Algorithm\n\nThe main objective here is identifying\
    \ the vector that can separate the real (+) from the negative (-) inputs, say\
    \ vector `(w)`, as used in the example. We will use the set algorithm below.\n\
    \nThe first step is adjusting the vector `(w)` with any other vector. After the\
    \ initialization, we restate the examples provided in the dataset, in this instance,\
    \ the metrics are `P`, `U`, and `N`. the examples represent both real and negative\
    \ standards. Proceeding the substitution phase, an input `x` (randomly picked\
    \ vector) corresponds to the value `P`, the dot product to be determined in `w`,\
    \ `x` should be stated as a value that is either equal to zero (0) or greater\
    \ than zero. The actual value is not actually, outstanding since the perceptron\
    \ will only give a yes or no answer. In another instance, when vector `x` corresponds\
    \ to the value `N`, the calculated dot product gives a zero (0) outcome.\n\nThe\
    \ statements above can be represented in one `IF` situation in a `while` loop\
    \ as;\n\nThe deduction from these representations can give two outcomes:\n- The\
    \ first outcome is when vector `x` corresponds to the `P`-value, and the dot product\
    \ of the two vectors `(w, x)` is less than zero (`w.x < 0`).\n- The second outcome\
    \ is found when the vector `x` corresponds to the value of `N`, and the dot product\
    \ of the two vectors `(w, x)` is more significant than zero (`w.x>0`). \n\nNote\
    \ that we have to update the `w` value that has been initialized. In other cases,\
    \ we are not supposed to mess the value of `w`, since the two outcomes above are\
    \ in contradiction with the perceptron rule. For the first outcome, we will summate\
    \ `w` and `x` whereas for the secondary outcome we will deduct the value of `x`\
    \ from `w`.\n\n## Assessing the Viability of the Update Rule Above\n\nThe basic\
    \ rule of perceptron has helped us to determine that vector `x` corresponds to\
    \ the value `P`. Therefore; the remaining part of the task is making the equation\
    \ to be `w.x > 0`. The equation can also be interpreted to mean that when vector\
    \ `x` corresponds to `P`, then the angle between the two vectors `(w, x)` is supposed\
    \ to be less than ninety degrees.\n\nWhy this inference? The cosine of the angle\
    \ between the two vectors `(w,x)` is the same as the dot product of the two vectors.\
    \ Thereby, that angle should be less than ninety degrees.\n\nFrom the above interpretation,\
    \ we get that we don’t have to know the vector `w` given that it makes an angle\
    \ that is less than ninety degrees with a given feature vector. In this case,\
    \ the vector must be a positive value. On the other hand, vector `w` should make\
    \ an angle that is greater than ninety degrees with a feature vector that has\
    \ a negative value. This represented, as shown below.\n\nAt this point, we can\
    \ comfortably say that the angle between vectors `x` and `w` should be a value\
    \ less than ninety, for the given case that `x` corresponds to the value of `P`.\
    \ In the same way, we can conclude that the angle made between vectors `w` and\
    \ `x` should be a value that is more than ninety degrees for a given condition\
    \ that the vector `x` corresponds to the value of `N`.\n\nMoving forward, we take\
    \ a look at why the update worked. The diagram below presents the explanation\
    \ as to why the upgrade works. The valuation may be a bit way-out, but the general\
    \ picture is seen.\n\nFor the case that vector `x` corresponds to `P`, we will\
    \ have to add the values of vectors `x` and `w`. the addition raises the cosine\
    \ of `(alpha)` function. This also means that the value of `alpha` is reduced\
    \ (which is the angle between two vectors). The diagram below indicates how we\
    \ can learn the vector `w`, which meets with a real object to make an angle that\
    \ is less than ninety degrees and an angle greater than ninety degrees with negative-value\
    \ objects.\n\n## Proof of Convergence\n\nThere is no precise explanation to make\
    \ people believe that the vector studied will converge in the end. This is due\
    \ to the varying conditions within different sets of data. Even though it looks\
    \ that there might be cases where the vector fails to converge, the truth is that\
    \ the algorithm is proven to converge at some point. Many types of research have\
    \ studied the patterns and deduced these proofs. Videos demonstrating this can\
    \ be found in YouTube and other platforms.\n\n## Conclusion\n\nIn this chapter,\
    \ I have taken a look at the perceptron algorithm, defined it, and went on to\
    \ illustrate how it works. In doing so, I have refreshed your minds on the necessary\
    \ components of linear algebra before proceeding to study the perceptron learning\
    \ algorithm. This step by step presentation is meant to guide learners in understanding\
    \ and visualizing the concept of machine learning, taking note of the perceptron.\
    \ It is my wish that by the end of the chapter, you have gained insight and knowledge\
    \ to get you started. Additional materials of study are recommended.\n\n## Limitations\
    \ and Precautionary Measures\n\nIn the training phase of the system, the perceptron\
    \ algorithm should be helped to learn from acclimating data. This is to ensure\
    \ that the prediction is accurate and errors barred. The presentation of input\
    \ vector should reflect a due-diligent process. This ensures that the perceptron\
    \ is set at par with the metrics and that the system can self-correct in case\
    \ of errors as it just goes back to the provided input vector.\n\nThe recommendation\
    \ here is to ensure that any problem that needs solving through linear separation\
    \ has solved a based on the process. Another method to induce learning to the\
    \ algorithm is by the use of functioning train. This method set up networks within\
    \ the algorithm and then produces input vectors to the perceptron. Afterward,\
    \ the setup can correct the system depending on the number of errors to be fixed.\
    \ Unfortunately, this method is faced by the uncertainty of convergence. There\
    \ are no precise ways that can lead to convergence in the perceptron. For this\
    \ reason, it is not advisable to use the function train method in training perceptron.\n"
