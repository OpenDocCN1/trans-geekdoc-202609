    # 第 8 章：决策树 ![](img/rsrcY2.jpg)


    决策树是一种决策支持工具，它利用树状图来解释概念。它考虑了效用、资源成本和事件结果。决策树非常适用于展示仅包含条件控制语句的算法。在决策树中，每个内部节点代表对属性的测试，而分支则代表测试的结果。叶节点代表类别标签，从根节点到叶子节点的距离则代表了分类规则。


    决策树在学习算法中非常有帮助并且被广泛使用。此外，基于树的学习算法是流行的学习方法。决策树之所以常见，原因之一是因为它们为预测模型提供了直观的解释性和效率。它们同样准确、稳定且可靠。与其他工具不同，决策树也是线性映射模型的理想选择。决策树可以解决各种挑战，且从不让人失望。许多人都证实了，这种决策支持工具帮助他们克服了问题并取得了顶尖成就。


    决策树算法被称为`分类与回归树 (CART)`。它对于应对数据科学挑战非常有用。在决策树中，`Root Node`（根节点）代表整个总体，它被进一步划分为同质组。当子节点被进一步拆分时，它们被称为决策节点。分裂（Splitting）是将节点分为子节点的行为。剪枝（Pruning）指的是移除决策节点子节点的过程。


    决策树的设计方式使其很容易融入程序化结构中。它们的布局是为了在问题出现时进行分类。人们可以使用决策树来识别植物的物种。在创建决策树时，人们会有许多假设。许多人最初会将整个训练集视为根。记录根据属性值进行划分。大多数人倾向于特征值是类别的。以下是一个决策树的示例![决策树图像结果](img/rsrcY7.jpg)


    ## 决策树的应用


    决策树被用于几个领域有很多原因。数据挖掘者使用决策树来分析数据。它也常用于机器学习及类似的活动。例如，可以使用决策树利用历史销售数据来评估品牌扩张的机会。它还可以利用人口统计数据来确定潜在客户。许多公司使用决策树来评估它们在市场上的表现并确定买家。这使他们能够调整营销策略以适应目标客户。它还能告诉他们问题所在区域以及如何接触买家。了解潜在买家使公司能够限制广告预算。大多数情况下，公司花费大量资金创建广告，却不知道目标投向哪里。他们最终的损失多于利润。即使产品销售额巨大，他们也无法扭亏。


    决策树还用于通过预测模型预测借款人违约的可能性。公司破产的原因之一就是违约借款人。有些人在归还借款时并不遵守承诺。为了规避这些人，公司可以使用从历史数据中获得的预测模型来识别此类人员。这样做节省了公司的时间和运营成本。


    决策树还用于运筹学，以确定一种有高概率达到设定目标的策略。在不知道最终目标的情况下进行研究是没有意义的。决策树有助于进行决策分析并使研究人员的工作变得简单。许多行业已使用决策树来解释数据，包括工程、金融、能源、教育和商业。使用其他工具和技术分析数据的人们已经由于其优势而转向了决策树。


    ## 优点与特点


    决策树具有许多优点，使其物有所值。它们易于理解。虽然有很多工具可以解决问题，但大多数工具非常复杂且需要技能。相反，决策树非常简单，不需要投入太多精力就能理解。即使是没有分析知识的人也可以使用决策树。理解决策树并不具备统计学知识。所使用的图形表示法简单，用户可以产生共鸣。此外，它们有一个用户可以认同的简单假设。


    决策树在数据探索方面非常有效。它们在识别最佳变量和变量之间的联系方面非常有用。由于其优势，决策树有助于决策分析并使研究人员的工作变得轻松。许多行业已使用决策树来解释数据，包括工程、金融、能源、教育和商业。使用其他工具和技术分析数据的人们已经由于其优势而转向了决策树。*（注：此处部分内容与前文有逻辑重重复，已按指令进行完整翻译）*


