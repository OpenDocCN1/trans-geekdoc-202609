    This is an event triggered by specific behavior. It positively influences the
    action taken by the agent. This happens through enhancing the frequency and strength
    of the behavior. This method helps you to capitalize on performance and sustain
    change for a longer period. Even so, you have to be careful as over-reinforcement
    may cause state over-optimization and impinge on the results.


    ## 2. Negative


    It involves strengthening behavior prompted by a negative condition which should
    have been dodged or stopped. Although it helps define the least stand performance,
    this method provides adequate to meet up the minimum behavior, which is a drawback.


    ### Applications of RL in Real Life

    - Data processing and machine learning.

    - Planning of business strategy.

    - Robotics for industrial computerization.

    - Aircraft and robot motion management.

    - Helps in creation of customized training systems for students.


    ## Summary


    - Data used in unsupervised learning is labeled and unknown, and Therefore, you
    cannot get accurate information concerning data sorting.

    - When moving from image to image you will have varied information because the
    spectral properties of classes are also likely to change over time.

    - Unsupervised machine learning locates all unknown types of unidentified patterns
    in the data.

    - The user has to dedicate time to label and interpret the classes which follow
    a particular classification.

    - The major downside of unsupervised learning is the failure to get accurate information
    in regard to data sorting.

    - Reinforcement learning is a machine learning method with three algorithms; 1)
    value-based, 2) policy-based and 3) model based.

    - The two types of reinforcement learning are 1) positive and 2) negative.

    - `RL` should not be used for problem-solving when you have adequate data.

    - The major `RL` method drawback is that learning speed may be affected by parameters.

