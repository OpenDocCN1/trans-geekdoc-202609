    # 引言


    我们生活在一个技术已成为每天首要关注事项的世界。全球范围内许多行业和组织都在尽一切努力，以提高其生产效率。正因为这一点以及其他原因，他们决定在行业内采用新技术。诸如
    `Machine Learning`（机器学习）的引入、机器的使用、无人机的部署等新技术应运而生。


    然而，多年来，从数据输入和信息输出来看生产率仍然很低。基于此，他们寻找那种能够让他们利用当时拥有的 `features variables`（特征变量）来预测结果的机器。请记住，在执行特定任务之前就能知晓组织内某项任务的结果，这种能力激励了他们。


    遗憾的是，数据预测中使用的某些方法被证明是错误的，只有少数方法给出了预期的结果。在某个时期，他们的数据缺乏足够的准确性，有些模模糊不清，而另一些则无法读取和解读。由于所有这些原因，许多科学家涌向互联网和技术图书馆，试图提出切实行的解决方案来解决当前行业在处理工作负载的困境。


    因此，你需要理解或掌握为什么 `Machine Learning` 是解决其劳动力部门许多紧迫问题最方便的方法。在某些情况下，人类仅以手动方式处理公司账目的数学概念。然而，这是极不方便的，因为许多组织或行业涉及人类无法完成的海量工作负载。疲劳以及缺乏执行每个预测任务所需的知识的情况变得泛滥。


    因此，被充分部署的 `Machine Learning` 指使用简单的 `algorithms`（算法）和一些 `statistical models`（统计模型）解决某些特定任务的情况。`Machine
    Learning` 主要依赖推理和某些模式。对某些人来说，这是人工智能，而另一些人的信念则基于具有样本数据的数学模型，他们后来将这些称为“训练数据”。由于这种机器可以使用可用数据在组织内部做出某些决策，这一过程变得更加易管理。


    后来，组织利用 `machine learning` 中的 `algorithms` 来满足公司的需求。目前，`computer vision`（计算机视觉）甚至与邮件过滤相关的问题都使用了
    `machine learning` 中的 `algorithms`。结果，许多组织意识到工作效率的提高，并最终实现了高产出。


    许多研究表明，`machine learning` 与某些统计学有关，特别是来自计算机的统计，即计算统计学。然而，值得注意的是，它仅关注使用计算机做出急需的决策和预测。`machine
    learning` 的某些方面使其能够相应执行其功能。例如包括 `mathematical optimization`（数学优化），它仅涉及应用领域、理论使用，甚至让
    `machine learning` 运行得更好的不同方法。另一个方面是 `data mining`（数据挖掘）。许多研究表明，`data mining`
    与领域研究有关，主要在 `machine learning` 内部。它的主要目标是帮助分析数据。在大多数情况下，许多企业采用 `machine learning`
    用于预测分析。


    '
- fmt: '

    # Chapter 1: Introduction: A Historical Overview of Machine Learning ![](rsrc48.jpg)


    Machine Learning came into limelight in 1959, and this happened with the help
    of American pioneers. Arthur Samuel, who spent much of his time in computer gaming,
    came up with the initial term of machine learning. During this time, machine learning
    became part and parcel of scientific endeavour. Later on, it widespread as the
    need for artificial intelligence grew. Many people, especially the researchers,
    got much interest in it to the extent of deploying machine learning in getting
    some data. At this point, the researchers had no option but to fully implement
    all the means at their disposal to get the required results. They ended up using
    `perceptors` even though this was later seen as an application of linear models.
    Still, on this, they also deployed the probabilistic reasoning, especially in
    the automation of the medical diagnosis. Fortunately, this automated technique
    seemed to work better, thus improving their work in medical sectors. However,
    issues with increased logical and an approach which depended much on knowledge
    caused a technological war between the Machine Learning and AI. In this juncture,
    you realize that the probabilistic system could not perform it''s tasking as intended.
    That''s, they had problematic issues about practical and theoretical, especially
    when it came to data representation and even acquisitions. As the AI came into
    a great halt, the industry was left with nothing to solve their workload and heavy
    tasks. As a result, machine learning started flourishing again. That''s, in the
    1990s. It then changed its objective or goal from achieving intelligence deemed
    to be artificial to tackling problems mainly from practical nature. Its focus
    shifted. In that, the symbolic approaches came to cease. It acquired the probability
    theory and use of statistical models. Machine learning, later on, benefited from
    the digitized information and the easy way of internet distribution. Therefore,
    internet distribution created a transferable mode through which many scientists
    could use to get the machine learning. Remember, with the partial death of the
    AI, and Machine Learning became part and parcel of every industry. In that, many
    scientists and several organizations could not afford to miss it. Its usage increased
    as many people involved it in all kinds of data predictions.


    ## The Evolutionary Perspective of Machine Learning


    Machine learning passed through several stages to reach where it is today. The
    steps marked with improved technology and natural problem solving. In addition
    to this, the level of accuracy in output predictions increases. However, this
    was still below what the scientists and most organizations required. Also, the
    rate of solving and acquiring data became much more manageable but with few cases
    of inaccuracy within the output data. It is because of this that the urge to improve
    on the features of machine learning came to be. Therefore, all these lead to the
    ultimate birth of evolution.


    ### The first stage was a game of checkers and machine learning


    Here, Arthur Samuel came up with a computer program which he could use to play
    checkers. He induced `alpha-beta pruning` to cater for the less memory within
    the gadget. This knowledge could predict which chances of winning in the game
    of checkers. In the end, this resulted in a `minimax algorithm`. He, later on,
    went with his designation to improve his machine.


    ### The next phase of evolution was the Perceptron


    Frank Rosenblatt came up with this model. It was a combination of machine learning
    and brain cells model. It is good to note that brain cell model was the work of
    Donald Hebb. Frank, who used to work in the laboratory of Cornell Aeronautical,
    came up with this `Perceptron` at a time when industries were lacking ways to
    solve some statistical data and analysis. He planned to do his work, that''s,
    `Perceptron` a machine and not anything to do with a program. `Perceptron` uses
    `Mark 1 perceptron` for recognition of the image. As a result, the transferring
    of the software and the machine became even more accessible. According to him,
    this was the most successful machine. Also, though this was successful, some aspects
    lacked solutions. That''s, the device was unable to recognize visual patterns.
    As a result, many scientists and computers programmers went into another research.
    However, their struggle continues until the 1990s where they managed to come up
    with another problem-solving machine. Therefore, the continued research led to
    the birth of another algorithm called `The Nearest Neighbor`.


    In his work, Marcello Pelillo realized that he could easily recognize the patterns.
    Another main objective of this algorithm was to map routes. The usage of this
    program was beneficial as salespersons could use it to enter into different cities.
    They also used it to find the best efficient way during their day to day travel.
    Even though this discovery was helpful, there are some situations that it failed
    to tackle. As a result, it was leading to the ultimate birth of multilayers.


    Multilayers came into limelight in the 1960s and went ahead to improve that research
    of neural network. The double usage of layers increased the processing power of
    `Perceptron`, thus making it more efficient. Again, the introduction of multilayers
    led to the development of `backpropagation`. The main task of `backpropagation`
    was to solve any errors within the system. It used a principle of spreading these
    errors backward so that solving them may not be difficult. It is now being applied
    in many sectors of industry such as a neural network. It is also good to note
    that this system came to be in 1970s. `Backpropagation` led to the development
    of the `Artificial Neural Network`. Here, this machine could solve more complex
    tasks that `Perceptron` couldn''t. It involves the usage of input data which transformed
    into output information. The jobs here are complex, and human beings could find
    them difficult. In the 1970s and some parts of 1980s, algorithms came to cease.
    Artificial intelligence started using logical approaches in solving its tasks.
    Again, there was an abandonment of some research, such as a neural network. In
    the end, a schism evolved between the two large bodies. That''s machine learning
    and artificial intelligence leading to their separation. Later on, the machine
    learning struggled for almost ten years after its reorganization. Here, its goals
    moved from artificial intelligence training to provisions of services. Again,
    its focus led to the development of probability theories and some elements of
    statistics. The flourishing of machine learning came to being in the 1990s, where
    it was able to concentrate on the neural network. However, internet growth played
    a significant role in the success of this. The next evolution involves boosting
    and boosting reduced bias within the data used. It deployed the use of machine
    learning algorithm where the transformation of weak learners into strong learners
    occurs. In his finding, he deduced that a set of weak learners could make one
    stronger learner. Machine learning has undergone many evolutions. Examples of
    these evolutions may include speech recognition and much more. Therefore, it is
    also good to note the benefits of the machine in our daily lives.


    * It helps in analyzing data, especially sales data, within the industry.

    * It promotes mobile personalization

    * It helps in detecting fraud

    * It helps in making a recommendation about a specific product.

    * It leads to proper learning management.

    * It promotes dynamic pricing, thus increasing flexibility in pricing.

    * It also helps in the processing of natural language. That''s, you can speak
    with humans.

    '
