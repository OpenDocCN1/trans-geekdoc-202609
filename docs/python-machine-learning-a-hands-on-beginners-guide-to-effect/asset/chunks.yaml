    # Chapter 4: Essential Libraries For ML In Python


    Many developers nowadays prefer the usage of `python` in their data analysis.
    `python` is not only applied in data analysis but also statistical techniques.
    Scientists, especially the ones dealing with data, also prefer using `python`
    in data integration. That''s the integration of Webb apps and other environment
    productions. The features of `python` have helped scientists to use it in machine
    learning. Examples of these qualities include consistent syntax, being flexible
    and even having a shorter time in development. It also has that ability to develop
    sophisticated models and has engines that could help in predictions. As a result,
    `python` boasts of having a series or set of very extensive libraries. Remember,
    libraries refer to a series of routines and sorts of functions with different
    languages. Therefore, a robust library can lead to tackling of more complex tasks.
    However, this is possible without writing several code lines again. It is good
    to note that machine learning relies majorly on mathematics. That''s mathematical
    optimization, elements of probability and also statistical data. Therefore, `python`
    comes in with a rich knowledge of performing complex tasks without much involvement.
    The following are examples of essential libraries being used in our present.


    ## Scikit – Learn


    `Scikit-learn` is one of the best and a trendy library in machine learning. It
    has that ability to supporting learning algorithms, especially the unsupervised
    and supervised ones. Examples of `Scikit-learn` include the following:


    * `k-means`

    * `decision trees`

    * `linear and logistic regressions`

    * `clustering`


    This kind of library has major components from `NumPy` and `SciPy`. `Scikit-learn`
    has the power to add algorithms sets which are useful in machine learning and
    also tasks related to data mining. That''s, it helps in classification, clustering,
    and even regression analysis. There are also other tasks that this library can
    efficiently deliver. A good example includes ensemble methods, feature selection,
    and more so, data transformation. It is good to understand that the pioneers or
    experts can easily apply this if at all, they can be able to implement the complex
    and sophisticated parts of the algorithms.


    ## TensorFlow


    `TensorFlow` is a form of algorithm which involves deep learning. They are not
    always necessary, but one good thing about them is their ability to give out correct
    results when done right. It will also enable you to run your data in a `CPU` or
    `GPU`. That''s, you can write data in the `python` program, compile it then run
    it on your central processing unit. Therefore, this gives you an easy time in
    performing your analysis. Again, there is no need for having these pieces of information
    written at `C++` or instead of other levels such as `CUDA`. `TensorFlow` uses
    nodes, especially the multi-layered ones. The nodes perform several tasks within
    the system, which include employing networks such as artificial neutral, training,
    and even set up a high volume of datasets. Several search engines such as Google
    depend on this type of library. One main application of this is the identification
    of objects. Again, it helps in different Apps which deal with the recognition
    of voice.


    ## Theano


    `Theano` too forms a significant part of `python` library. Its vital tasks here
    are to help with anything related to numerical computation. We can also relate
    it to `NumPy`. It plays other roles such as:


    * Definition of mathematical expressions

    * Optimization of data

    '
