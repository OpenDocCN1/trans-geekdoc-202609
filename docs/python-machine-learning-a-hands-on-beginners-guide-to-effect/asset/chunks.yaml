- fmt: "\n# Chapter 5: Regression Analysis (Linear Regression and Logistic Regression)\n\
    \nSeveral industries across the globe are struggling with the best way to come\
    \ up with the correct data or information that will eventually enable them to\
    \ solve their incurring prediction problems. Several banks have made some losses,\
    \ especially within their credit section as they could not correctly predict the\
    \ trustfulness of the defaulters. In the health sector, you realize many have\
    \ lost their lives because of poor planning and risk management, which come as\
    \ a result of the lack of modeling to tool for more straightforward prediction.\
    \ We also have other sectors such as weather forecasting where farmers were not\
    \ advised on the occurrence of rain, as a result leading to more losses. Another\
    \ area involved the payment of mortgage by homeowners. Due to all these, everyone\
    \ across the universe went on a rampage looking for the best possible way to handle\
    \ the prediction roles of the organizations. \n\nLater on, all these gave birth\
    \ to what is termed as regression analysis. Therefore, regression analysis refers\
    \ to statistical processes for prediction analysis using variables. In that, it\
    \ helps in identifying the variables-relationships. This analysis consists of\
    \ both independent and dependent variables. In other words, regression analysis\
    \ aids in understanding the effect of one independent variable on the dependent\
    \ variable when other independent variables are kept constant. In most cases,\
    \ regression analysis will try hard to predict the conditional expectation, especially\
    \ of the variable which is dependent. \n\nRegression analysis is applied in several\
    \ areas such as weather forecasting and prediction. Here, it helps predict the\
    \ outcome of the rain within a specific period. It is also applicable in other\
    \ fields such as medical sectors for predicting chances of diseases. Regression\
    \ analysis comprises of the following: linear regression, logistic regression,\
    \ polynomial, stepwise, ridge, lasso, and elastic net regression. All in all,\
    \ this chapter will only tackle the most widely used regression analysis, such\
    \ as linear regression and logistic regression. It is good to note that `ElasticNet`\
    \ regression is a combination of the `Lasso` and `Ridge` regression.\n\n## Logistic\
    \ Regression\n\nLogistic regression comprises of logistic model, logistic function,\
    \ statistics model, and much more. Therefore, many organizations apply logistic\
    \ regression in their day to day activities which mainly composed of data predictions\
    \ and analysis. You can always conduct this regression analysis, especially when\
    \ the dependent variable is binary. That's dichotomous. Just like other types\
    \ of regression analyses, logistic regression is entirely applied in any analysis\
    \ dealing with prediction. Its primary function, in this case, is to describe\
    \ data. Also, logistic regression can be used to explain or illustrate the kind\
    \ of relationship between the binary variable, which is dependent and the rest\
    \ variables which are independent. \n\nIn some occasion, this regression might\
    \ look challenging to interpret, but by the help of the logistic tools such as\
    \ `Intellectus Statistics`, you can easily undertake your data analysis. Logistic\
    \ regression knowledge can be easily applied in statistics by the help of the\
    \ logistic model. In this case, the primary function of the logistic model is\
    \ actually to come up with the correct results of certain predictions or class\
    \ by the help of probability. For example, probability works best in areas where\
    \ you are only required to predict the outcome of the existing events. These events\
    \ include: healthy or sick, win or lose, alive or dead, or even in places where\
    \ you are making your analysis about the test where someone either fails or pass.\
    \ \n\nStill, in this model, you will be able to fine-tune your result primarily\
    \ through probability. In the case of an image, you will be able to extend your\
    \ model to cover up various classes. You will be able to detect whether the image\
    \ in your analysis is for a lion or a cat, and so on. In this case, the individual\
    \ variable within the image will have their probability between 0 and 1. However,\
    \ the sum here should be adding to one. \n\nTherefore, logistic regression refers\
    \ to a basic statistical model which makes greater use of the available logistic\
    \ function regardless of complexity that might exist. Logistic regression is part\
    \ parcel of regression analysis, and on many occasions, it is applied in various\
    \ analyses where model parameters are estimated. Remember, the logistic model\
    \ is like a form of binary regression. This model consists of a dependent variable\
    \ which includes two possible values. These values can be represented as `pass/fail`,\
    \ `alive/dead`, `good/bad`, and much more. You need to note that the indicator\
    \ variable actually denotes these possible values and always have 0 and 1. \n\n\
    Within this logistic model, the `odds` for the values of 1 represents a linear\
