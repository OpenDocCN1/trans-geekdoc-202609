  trans: "\n\n# 第 2 章：机器学习的类型 ![](img/rsrc5E.jpg\n\n在一个沉浸在人工智能的世界里，深入理解机器学习是很有趣的。这一概念允许算法在不依赖任何显式指令的情况下执行特定任务。相反，机器依赖于推理和模式，用户将数据输入通用算法，而不是编写代码。作为回应，机器根据输入数据构建逻辑。通常，会对算法所预测的准确性进行评估，只有当精度达到接受水平时，算法才会被部署。\n\
    \n## 机器学习的类型\n\n机器学习大三大类。我们将在下文中详细讨论每一种。\n\n### 1. 监督学习\n\n这种范式事实是最流行的，可能因为它易于理解和执行。在这里，算法从标记数据集（即同时包含输入参数和输出参数的数据集）中创建一个数学概念。该数据集充当了模型的训练器。例如，我们可能决定使用算法来判断特定图像是否包含某个物体。在这种情况下，数据集将由包含和不包含输入（该物体）的图像组成，每张图像都有一个指定其是否包含特定对象的输出。算法可能会预测任何答案，无论对错。然而，在多次尝试后，它学会了只挑选包含所述物体的图像。一旦完全训练完成，即使输入新数据，算法也会开始做出正确的预测。监督学习模型的完美例子是支持向量机。在下面的图中，支持向量机将数据划分为由线性边界的区域。你会发现边界将白色圆圈与黑色分开了![C:\\\
    Users\\USER\\Desktop\\support vector machine.png](rsrc5W.jpg)\n\n#### 监督学习的类型\n\
    \n*   **分类 (Classification)**：这些算法用于输出限制为离散值的情况。例如，在过滤邮件时，收到的邮件被归类为输入，而输出则是文件夹名称。\n\
    *   **回归 (Regression)**：这是输出具有连续值的算法，这意味着它们可以在给定范围内的任何值上选取。完美的例子包括：温度、风速、商品价格等。\n\
    \n![](img/rsrc68.jpg)\n\n监督机器学习体现在许多常见应用中，我们已经在下文中讨论了其中一些应用。\n\n*   **广告状态**：你在浏览互联网时遇到的大多数广告之所以出现在那里，是因为有一个监督学习算法为它们的点击率和受欢迎程度提供了背书。\n\
    *   **人脸识别**：这在 Facebook 上非常常见。你的脸很可能被用于一个训练以识别它的的监督算法中。当 Facebook 建议一个标签时，你可能注意到系统在猜测照片中的人物身份，这是一个监督过程。\n\
    *   **垃圾邮件分类**：你在现代邮件系统中找到的垃圾邮件过滤器是一个监督学习概念。除了预先过滤恶意邮件外，该系统还允许用户提供新标签并表达他们的偏好。请参见下图中的插图![C:\\\
    Users\\USER\\Desktop\\spam classification.jpg](img/rsrc6J.jpg)\n\n### 2. 无监督学习\n\
    \n正如其名所示，无监督机器学习与监督学习完全相反。模型在数据中寻找结构，并通过观察进行学习。当给出一个数据集时，模型会自动寻找相关关系并创建聚类。该范式无法为创建的簇添加标签，但它能完美地完成创建工作。这意味着如果我们有一组苹果和橙子，模型会将苹果和橙子分开。现在，假设我们有两组以上，比如我们展示葡萄、橙子和苹果的图像。如上所述，每当输入新数据时，模型都会将其添加到已有的簇之一，如图所示![](img/rsrc6Z.jpg)\n\
    \n让我们通过另一个经典例子来更好地理解。想象一个小婴儿和他的家庭狗。他能很好地识别狗的特征。当一位朋友带着另一只狗来和婴儿一起玩时，婴儿即使没有人教也能识别出那是狗。他们会轻松地对其进行分类，因为它具有特征。这属于无监督学习，因为你在没有被教导的情况下对输入进行分类。如果是监督学习，朋友就必须告诉婴儿那是只狗。\n\
    \n#### 无监督学习的类型\n\n*   **聚类 (Clustering)**：这一概念在未分类的数据中识别模式。聚类算法对数据中的自然分组进行分类。用户也可以自由调整他们算法识别的簇数量。\n\
    \    *   **排斥式/划分式 (Exclusive / partitioning)**：在此类型下，对数据的分类使得一个数据只能属于一个簇。`K-means`\
    \ 是一个完美的例子。\n    *   **凝聚式 (Agglomerative)**：这种技术中每个数据本身就是一个组。通过两个最接近组之间的迭代合并来减少簇的数量。一个例子是层次聚类。\n\
    \    *   **重叠式 (Overlapping)**：在这种技术下，数据与合适的关联值相关。使用模糊集对数据分组，每个点都可以以不同的隶属度属于两个或多个组。`Fuzzy\
    \ C-Means` 是此类类型下的合适例子。\n*   **关联 (Association)**：这一概念使用概率分布创建簇。参见下文给出的某些关键词示例\n\
    \    *   `男士裤`\n    *   `女士裤`\n    *   `男士钱包`\n    *   `女士钱包`\n\n给出的关键词可以分为两组；`裤`和`钱包`，或者`男士`和`女士`。\n\
    \n"
