    # 第 7 章：Python 编程实用平台 ![](img/rsrcXH.jpg)


    Python 被移植到多个平台以实现安全访问。多年来，这些平台不断改进，变得日益复杂且针对用户专业化。实用的 Python 平台包括 `AIX`、`ISO`、`OS`、`VMS`
    和 `PH-UX`。其他 Python 编程平台还有 `Cygwin`、`Java`、`FreeBSD`、`Java`、`OpenBSD`、`Solaris`
    和 `Windows`。`AIX` 可以免费下载 Python `3` 和 `2` 版本。机器学习是人工智能不可或缺的一部分，有助于企业从运行预测和数据中发现信息。数据科学家编写机器学习算法来帮助用户学习数据趋势。此外，它还用于进行基础分析之外的预测。其他用于简单分析的工具无法进行预测，从而增加了工作难度。因此，使用这些平台进行
    Python 编程可以让工作变得简单。


    Python 是一种用于编写机器学习算法的编程语言。由于它的适用性和简单性，许多人在使用。此外，用 Python 编写的包帮助数据科学家进行数据可视化、模型构建、数据分析和特征提取。`AIX`
    用户可以自由使用机器学习包进行数据挖掘、科学计算和数据分析。因为这些包是基于 Python 的，用户必须在他们的 `AIX` 系统上安装最新版本的 Python。他们可以使用
    `YUM` 安装 `AIX`。最好使用 `YUM`，因为它是最简单的方法。此外，它是安装开源 `RPM` 包最快的方法，因为使用它不需要技能。你可以从 `AIX`
    工具箱仓库下载 `YUM` 并将其安装在 `AIX` 上。这个过程的优点是会默认安装 `Python2`。请确保在安装 `YUM` 后更新所有包。


    要安装机器学习包，用户需要特定的开源包。这些包括 `blas`、`lapack`、`gcc`、`xz`、`python3` 和 `zeromq`。完成机器学习包的安装还需要额外的设置。用户需要增加资源限制以确保成功安装。还应该增加数据限制和栈限制。


    有几个 Web 应用程序允许用户编写代码进行统计分析和分析。`Jupyter Notebook` 就是其中之一，而且表现出色。为了方便安装过程，`AIX`
    用户应该使用 `Jupyter Notebook` 编写数据分析模型。要安装 `Jupyter Notebook`，用户应该运行此命令：


    ```bash

    python3 -m pip install jupyter

    ```


    如果你的文件夹中没有它，请运行此命令：


    ```bash

    jupyter notebook -generate-config

    ```


    Python 机器学习工具在数据科学家中非常流行。此外，`AIX` 用户希望在 `AIX` 上拥有这些包以帮助他们编写 AI 应用。AI 应用要求很高，而这些平台让人们更容易审视问题。


    `Linux` 在极客和程序员中很常见。这个操作系统对所有人（包括学生）来说都是非常棒的。大多数人不知道的是，`Linux` 也优秀。


