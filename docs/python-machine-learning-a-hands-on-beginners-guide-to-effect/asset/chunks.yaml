    # 第 6 章：感知机 ![](img/rsrcT1.jpg)


    本章将探讨感知机算法，该算法最早由 Minsky 提出并应用。本章将感知机作为一种**算法**而非模型进行显式介绍。我建议读者在我的书籍 `MACHINE
    LEARNING FOR BEGINNERS` 中查找同一主题的参考资料。在那书中，该主题的涵盖范围有限。但在本本书中，我将根据内容、结构和适用性对感知机进行深度分析。


    ## 定义感知机


    感知机是神经网络中的一层，能够执行以下操作：为数据池的核心配置算术值，并对于正向 (+) 结果，将正回报之和估计为值为 `1` 的。从另一个角度来看，感知机也可以被视为一种计算模型，它在给定空间中画出一条边界（在二维情况下为一条直线）来隔离两个类别。最初，代表分类超平面的权重和偏置（bias）通常是未知的。在这种情况下，模型被分配了非系统化的权重和偏置。随机分配会导致点的分类错误。


    ## 感知机技巧 (The Perceptron Trick)


    感知机技巧的目标是减少分类错误的点数量。这种减少可以通过在空间上移动直线来实现。换句话说，它是在改变超平面的表达式。对于所有分类错误的点，我们调整权重和偏置，以使超平面更靠近那些分类不当的点。经过一段时间，算法将纠正问题并正确分类这些点。


    然而，在本章中，我选择以不同的方式看待感知机。采用的方法是在机器学习算法的上下文中识别感知机。在这里，感知机被定义为一种预测给定特征是否属于特定类的算法。从这个角度来看，该算法被认为是用于监督学习的二分类器。在大多数情况下，所研究的特征始终由一个具有大小和方向的数字表示。作为分类器，感知机用于线性分类和以图形形式表示数据。图形表示模型可以采用二维或多维的方式。感知机识别一个特征，加权其总和，如果加权总和高于其他函数的结果，则给出值为
    `1` 的结果。


    图像中的方程支持了这一表述 ![](img/rsrcTF.jpg) 当代入方程边边（上方图像中的第二个方程）并使其与给定参数的权重保持为常数时，就得到了图像中的方程
    ![](img/rsrcTM.jpg) 感知机算法的单个单元可以执行可分的线性方程。唯一一组工作通过对布尔和正向指标进行加权或分配权重，并具有相应的偏向。


    ## 使用感知机执行或 函数 ![](img/rsrcTU.jpg)


    在上述图像中，条件根据或 函数定义。这些术语旨在满足优化模型，即对于给定的值为一 (`1`) 的输出，需要加权数据的总和为零 (`0`) 或大于它。权重的和已经形成了一条直线，该直线将正
    (+) 值与负 (-) 值隔离开。Minsky 的提设定了通过样本数据学习特征的标准。所提出的模型描述如下。


    ## 线性代数的基本组件


    ### 向量

    向量值可以代表很多东西。取决于数据的类型，向量值可以代表很多。因此，描述向量的方法不止。它可能是一条带有箭头的线，另一个没有箭头的点作为原点。


    ### 表示向量

    向量可以用二维或三维表示，取决于用户的选择。下面是二维描述的向量（第一幅图像）和一个三维向量（第二幅图像）。![](img/.


    ### 计算两个向量的点积

    给定两个向量 `(n+1, w)` 和 `(n+1, x)`，它们的点积使用下面的公式计算。对于值的代入，我以矩阵形式编写的公式 ![](img/rsrcUK.jpg)
    从方程，向量 `/w/` 和 `/x/` 由带箭头的线表示。向量的维度是 `(n+1)` 值。计算结果表示 `/w/` 和 `/x/` 的点积。此结果显示了单个向量在另一个向量方向上的程度。感知机创建了一条分离正值与负值的线。对于我们示例中的函数，这表示为
    `w. x = o`。


    ### 两向量之间的角度

    上述点积可以使用不同的方法计算。然而，必须满足某些条件：


    1. 向量之间的角度必须已知。

    2. 向量的大小必须已知。


    当满足条件时，通过代入下方图像中的公式 ![](img/rsrcV3.jpg) 完成点积计算。可以使用反向方法确定两个向量之间的角度。这可以通过首先识别向量、获取其大小和点积来实现。下面的图像可以指导将值代入方程
    ![](img/rsrcV9.jpg)


