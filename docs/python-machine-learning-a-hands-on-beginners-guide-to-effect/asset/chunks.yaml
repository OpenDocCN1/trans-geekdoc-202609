    # Introduction


    We are living in a world where technology has become a primary preoccupation every
    day. Many industries and organizations across the universe are trying what they
    can so that they end up improving their production. It is because of this and
    other reasons that they decided to employ new techniques within the industries.
    New technologies, such as the introduction of `Machine Learning`, usage of robots,
    deploying of drones among others came into being.


    However, for many years, the rate of production in terms of data input and information
    output was still low. Going by this, they would look for that type of machine
    that could enable them to predict their outcome using the `features variables`
    that they had by then. Remember, being in a position to know the result of a specific
    task within the organization even before they could perform a particular task
    motivated them.


    Sadly, some types of methods used in data prediction proved to be wrong while
    few gave out the expected results. At one point, their data lacked enough accuracy,
    and some were vague, while others you could not read and interpret. Due to all
    these, many scientists thronged the internet and technological libraries so that
    they could come up with something tangible to solve the current predicament of
    solving the workload within the industries.


    Therefore, you need to understand or comprehend why `Machine Learning` was the
    most convenient way to solve many burning issues within their labor sectors. There
    are several cases where human beings were only dealing with the mathematical concept
    of the companies'' accounts in a manual way. However, this was inconvenient since
    many organization or industries involved huge workload that could not be done
    by human beings. Cases of tiredness and lack of enough knowledge to perform every
    task of prediction became rampant.


    Therefore, `Machine Learning` which was fully deployed refers to a situation where
    some specific tasks were solved using simple `algorithms` and some `statistical
    models`. `Machine Learning` relies mostly on the inference and some patterns.
    To some, this is artificial intelligence while others based their belief on the
    mathematical models that had sample data which they later refer to as "training
    data." The process became more manageable as this machine could make some decisions
    within the organization using the data available.


    Later on, the organization used the `algorithms` from `machine learning` to cater
    to the needs of the company. Up-to-date, `computer vision`, and even issues to
    do with email filtering uses `algorithms` from `machine learning`. As a result,
    several organizations had to realize the improved work rate, which led to high
    output at the end.


    Many studies show that `machine learning` relates to some sorts of statistics,
    especially those from the computer. That''s computational statistics. However,
    it is good to note that this focuses only on using computers to make much--needed
    decisions and predictions. Some aspects of `machine learning` enable it to perform
    its function accordingly. Examples of these are `mathematical optimization` which
    only involves application domains, uses of theory, and even different methods
    that make the `machine learning` work better. Another aspect is `data mining`.
    Many studies show that `data mining` relates to field study work, mainly within
    `machine learning`. Its main objective is to help in the analysis of data. In
    most cases, many businesses employ `machine learning` for predictive analytics
    purposes.

    '
