    # Chapter 11: Perceptron Algorithm ![](rsrc13H.jpg)


    In this chapter, I have taken a look at the perceptron algorithm, defined it,
    and went on to illustrate how it works. In so doing, I have refreshed your minds
    on the necessary components of linear algebra before proceeding to study the perceptron
    learning algorithm. This step by step presentation is meant to guide learners
    in understanding and visualizing the concept of machine learning, taking note
    of the perceptron. It is my wish that by the end of the chapter, you have gained
    insight and knowledge to get you started. Additional materials of study are recommended.


    ## Limitations and Precautionary Measures


    In the training phase of the system, the perceptron algorithm should be helped
    to learn from acclimating data. This is to ensure that the prediction is accurate
    and errors barred. The presentation of input vector should reflect a due-diligent
    process. This ensures that the perceptron is set at par with the metrics and that
    the system can self-correct in case of errors as it just goes back to the provided
    input vector.


    The recommendation here is to ensure that any problem that needs solving through
    a linear separation has solved a set go based on the learning process. Another
    method to induce learning to the algorithm is by the use of a functioning train.
    This method set up networks within the algorithm and then produces input vectors
    to the perceptron. Afterward, the setup can correct the system depending on the
    number of errors to be fixed. Unfortunately, this method is faced by the uncertainty
    of convergence. There are no precise ways that can lead to convergence in the
    perceptron. For this reason, it is not advisable to use the `train` method in
    training perceptron.


    Despite the hype surrounding the use of perceptron learning algorithms, they do
    not fall short of limitations. The first limitation is that the output result
    in a perceptron network can only assume either a zero (0) or one (1) value. There
    are no in-between values. This can be seen as a biased outcome or an inaccurate
    one because sometimes we expect other values. The second drawback of the perceptron
    is that it can only be used to solve problems that require linear distinction.
    This implies that perceptron is only capable of working out issues that involve
    vectors that can be separated by a vertical plane. If a straight line cannot separate
    the vectors, then learning them becomes a hutch for the perceptron network. It
    is, however, worth noting that experts have proof to show that for linear separable
    quantities, perceptron learning algorithms can solve them in no time.


    Perceptron may portray limitations. However, it is fair to note that a combination
    of networks (having numerous perceptron) can be applied in complex problem-solving.
    For instance, say we have a unit of four problems to solve (four-vectors) by separating
    them with a straight line. In the process that we have two perceptrons in the
    network, it will create a two-dimension boundary that splits the vectors into
    four different groups.


    ## Conclusion


    An algorithm is a system that gives solutions and answers to question on a step
    by step basis. In computer science, algorithms provide results to search questions,
    offers recommendations on contents in accordance with the history of the user.
    Additionally, algorithms pool a large set of data to detect sequences and make
    forecasts about the habits of the user. Algorithms can also be used to underpin
    prevailing partialities, particularly on digital media. For instance, double-tapping
    an online editorial that an acquaintance displayed on Instagram, which portrays
    political opinion, would show the Instagram algorithm that you have an interest
    in the political opinion posted.


    In the forthcoming, Instagram may set up your feeds to include the. As discussed
    above, machine learning algorithms have become a significant part of our interactions
    both in the social media. And to answer the question of "can algorithms be agonistic?"
    It is crucial to take a look at past instances where algorithms have been considered
    to be combative. A good example was the when ML algorithms of Reddit provided
    a platform for most upvoted articles to be on top of search results thus promoting
    the spread of fake news at the time of the Boston Bombing in 2013. As a result,
    a missing student, Sunil Tripathi, was mistakenly accused of carrying out the
    attacks.


    Nowadays, almost all technical skills are influenced by the transformational model
    brought forth by the introduction of machine learning. This fact does not change
    the truth that the essential natural and human resources are limited. Therefore,
    the incorporation on intelligent machines in social activities should be done
    with precautionary measures taken to alleviate any potential risk. Progressive
    procedures of machine learning may be useful in guiding the industrial processes
    towards an ideal way out. The methods, however, should not be programmed to find
    solutions to the same optimization problems in the same ways. A torrent of new
    sets of data and information is necessary to help this course.


    In the same spirit, developers and users of the software with algorithms of neural
    network should continue the innovative processes and research to find the ideal
    fit for every problem. This book is structured to guide my readers, among them
    with the necessary knowledge of python machine learning and relevant algorithms.
    It is hence essential to find additional sources to enhance the skills already
    acquired from this book. For beginners, I recommend the use of my book, `MACHINE
    LEARNING FOR BEGINNERS`, in first coming to terms with machine learning before
    advancing to this copy. I hope this book has been useful and thank you all for
    taking a walk with me.

