    # II. PIPELINE MODEL AND FEATURE EXTRACTION


    # A. System Description and Problem Statement

    in this paper, datasets from Suntran Energy Logistics Corporation are used to
    train and test the proposed algorithm. The data were obtained through online monitoring
    of data from the Supervisory Control and Data Acquisition (SCADA) system. In these
    datasets, flow rates for upstream and downstream are provided, as well as pressure
    at the two nodes and the three middle nodes. In the proposed method, the flow
    difference and pressure from the upstream sensor are used


    happens, due to fluid loss in the pipeline, the outlet rate is less than the inlet
    rate, which causes an imbalance between inlet and outlet flow rates.

    on the other hand, pipeline transient conditions, pressure and flow rate can increase
    or decrease, due to operational changes made by the pipeline control center. This
    operator can cause difficulty in the detection of transient. For instance, when
    there is a transient condition in the pipeline, the pressure decreases, which
    is the first characteristic of a transient. For example, a step-up (increase in
    flow rate), in the pipeline, the flow difference increases, which has the same
    trend as a leakage. Nevertheless, there are signatures to separate a leakage from
    transient condition. For example, the step-down case, the flow rate decreases,
    which is different from the leak signature. The second transient condition, the
    pressure and flow rate increases, which is from leakage. Therefore, the flow difference
    and pressure signals are required to distinguish leak from transient conditions
    (Fig. 1 shows both process: step-up, step-down, and leakage for the flow rate
    and pressure).


    In order to apply the machine learning algorithm, time-series data are transformed
    into feature vectors over time-windows. A time-window length, $L$, is set to define
    the interval between time-windows:


    ```

    $TW(i) = [x(i-L+1), \dots, x(i)]$

    ```


    where $TW(i)$ is the vector containing indexes of data of the $i^{th}$ time-window
    and $s$ is the number of samples by which the time-window moves from one index
    to the next. The leak detection is to provide a label for each time-window using
    the feature extractor from data of the time-window. This can be modeled by the
    following function:


    ```

    $y(i) = f(TW(i))$

    ```


    where $y(i)$ is the predicted label of $TW(i)$. There are three important conditions
    in the oil and gas pipeline: (steady-state), transient and leakage. These are
    the possible labels for the leak detection output:


    # B. Pipeline Leak Signature


    Pipeline leakage has significant characteristics as “leak signatures” in pipelines
    with fluid loss, the equilibrium rate in pressure and flow rate change. The first
