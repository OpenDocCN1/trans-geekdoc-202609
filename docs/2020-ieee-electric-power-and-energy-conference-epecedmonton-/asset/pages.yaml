    # V. CONCLUSION


    In this paper, we proposed a leak detection algorithm using signature based feature
    vectors and deep classification method. The algorithm was implemented on an industrial
    dataset in one month and the efficiency of the method was compared to two existing
    methods. The result showed that the proposed algorithm with ANN has the highest
    F1 score in comparison with all three machine learning methods. Further, by


