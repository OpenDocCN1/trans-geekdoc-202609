    \ Stage 1\n\nTABLE I: Comparison of performance machine learning tools for Stage\
    \ 1 detection\n\n| Machine Learning Methods | FAR (%) | DR (%) | F1 |\n|---|---|---|-|\n\
    | Linear Regression | 0.08% | 90.6% | 0.9444 |\n| SVM | 0.25% | 92.1% | 0.9482\
    \ |\n| ANN | 0.16% | 91.39% | 0.9485 |\n\nFor the 5th time window, when the average\
    \ flow is negative ($X_1(k) < 0$), the abnormality is labeled as step-down (transition)\
    \ $y(k) = 2$. In the case of a positive average flow, it can either be normal\
    \ or raised (step-up). If $X_2(k)$ exceeds a pre-set threshold $\\lambda > 0$,\
    \ the time-window is labeled as stabilizing ($y(k) = 2$). If the flow increases\
    \ three times in a row, it is raised. The threshold $\\lambda$ can be set to three\
    \ the standard deviation of $X_k$ under normal conditions. If the pressure increases\
    \ three times more than normal conditions, it is considered as a process of recovery.\n\
    \n**2) Removal Based on Leak-Size:** When a time-window is labeled as leakage,\
    \ an alert is raised in size. This data may be labeled as $LE(k) = 1$ due to the\
    \ noise, fluctuation in values, and the estimation of the leak size is affected\
    \ by the effect of temporarily noise. The leak size for the $k^{th}$ time window\
    \ is obtained using the flow rate difference in $L(k^{th})$ for a sequence of\
    \ alerts starting from $k_0^{th}$:\n\n```\n$LE(k) = \\frac{d}{j-i_0} \\sum(V(j)\
    \ - V(i_0))$$\n```\n\nwhere $i_0$ is the start index of the $k^{th}$ time-window,\
    \ $j$ is the last index of the last time-window and it is raised. In this step,\
    \ if the leak size of a time-window exceeds a pre-specified tolerance $\\gamma$,\
    \ an alert is raised; otherwise, the alert is rejected.\n\nThe overall scheme\
    \ for the second stage of detection is summarized in Algorithm 1.\n\n# IV. PERFORMANCE\
