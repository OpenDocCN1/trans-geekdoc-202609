    # III. Proposed Algorithm


    In this section, a data-based method is introduced to detect and classify transient
    conditions from pressure and flow rate signals. The detection scheme is shown
    in Fig. 2, which has three main stages: pre-processing, Stage 1, detection and
    Stage 2. During pre-processing, the data is divided into time-windows. The features
    are extracted from data of these time-windows and are normalized. In this method,
    an ANN is used to classify the normal class ($y = 0$) from the leak event and
    transient conditions. In the detection stage, the method is used to detect transient
    conditions via a low difference between the flow rate and pressure change and
    a leak-size restriction. This stage helps to remove false alarms by transient
    and noisy time-windows. In the following subsections, we explain the three components
    in detail:'
