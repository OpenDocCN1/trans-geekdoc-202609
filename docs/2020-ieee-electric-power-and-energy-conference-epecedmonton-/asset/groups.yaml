    ## II. PIPELINE MODEL AND FEATURE EXTRACTION


    ### A. System Description and Problem Statement

    In this paper, datasets from Suncor Energy Logistics are used to train and test
    the data obtained through the Supervisory Control and Data Acquisition (SCADA)
    system. The flow rate and pressure inside the pipeline change when there is a
    leakage, which causes an imbalance between inlet and outlet flow rates. The leakage
    detection is prone to high false alarms caused by operational (transient) or noisy
    data. These false alarms can overwhelm operators during monitoring. In this method,
    the flow rate and pressure variation are used to extract the features. The modified
    neural network is sensitive to the small change and effect of every characteristic
    is used to normalize the feature vectors. In the first stage of the, a trained
    deep-learning-based classifier is used to classify the normal and abnormal (or
    transient) conditions. The second stage, leakage and transient are separated using
    simple logic. In addition, leak size and restriction are used to remove false
    alarms caused by noises and disturbances. The proposed method is tested using
    real industry data and to have a high F1 score and a low alarm rate. The result
    shows that the proposed method leads to a better performance in comparison to
    two methods in the literature. The rest of this paper is structured as follows.
    Section II describes the problem formulation and leak signature. Section III proposes
    the scheme including pre-processing, classification using artificial neural networks
    (ANN).


    The point analysis method shows the statistical properties of the before and after
    leakage conditions [7]. The drawback of this method is the triggering of false
    alarms during transient conditions. A novel method based on Kandovich detection
