  mdcn: "\n\n# 2020 IEEE 电力与能源会议 (EPEC)\n\n![](img/2b334e8c817fc860dd71e02094b44f66_2_0.png)\n\
    \n图 2：两阶段检测算法。\n\n## A. 数据预处理\n\n在检测阶段之前，流量差和压力数据通过了几个步骤进行预处理。首先，对大小为 L 且长度为 s\
    \ 的滑动时间窗口进行处理，并将数据分组为一系列序列以提高鲁棒性。然后，对于每个时间窗口获取一个特征向量。为了使这些特征具有共同的尺度，我们对特征向量进行了归一化。\n\
    \n- 1) 特征：如第二节所述，第一个节点和最后一个节点之间流量差的下降和增加是管道泄漏的关键特征。本工作使用了以下两个特征：\n\n    - 流量差均值，记为\
    \ $X(i)$：对于第 k 个窗口，入口和出口节点之间流量差的均值基于：\n\n    $$X_i(k) = \\frac{1}{L} \\sum (V_i(k)\
    \ - \\hat{V}_i(k))$$\n\n    其中 $k_j$ 是第 k 个时间窗口，$L$ 是时间窗口的长度。\n\n    - 压力差均值，记为\
    \ $Y(i)$：第 k 个时间窗口的压力差均值获取如下：\n\n    $$Y_i(k) = \\frac{1}{L} \\sum (P(k) - P(k))$$\n\
    \n    其中 $P(k)$ 是第 k 个窗口上游传感器的测量压力。\n\n    - 2) 改进超正切估计：用于神经网络分类的改进正正切估计。该方法的主要优势是对离群值具有鲁棒性。对于对于\
    \ $i = 1, 2$ 的归一化特征向量 $X^{(i)}$，该估计器产生如下表达式的归一化数据：\n\n    $$X^{(i)}(k) = \\tanh(\\\
    frac{0.01(X(k) - \\mu_i)}{\\sigma_i})$$\n\n    其中 $X^{(i)}(k)$ 是 $X(k)$ 的归一化值，$\\\
    mu_i$ 和 $\\sigma_i$ 分别是变量得分的均值和标准差 [11]。在该方法中，我们通过稳态样本分别计算均值和标准差，并将它们用于归一化，从而增强了鲁棒性。\n\
    \n## B. 第一阶段检测\n\n第一阶段检测是区分正常和异常（泄漏或瞬态）情况。在此阶段，使用预处理过的训练数据训练人工神经网络（ANN），并以对管道进行分类。ANN\
    \ 由归一化特征组成，正常（状态条件）标记为“异常”，如果瞬态和泄漏情况均被视为异常并标记为“1” 。\n\n在我们的设计中，各层使用 'relu' 函数，最后一层使用时间窗口差异的概率。因此，输出产生第\
    \ k 个时间窗口的概率 $y_i(k)$。为了进行分类，使用 $y_i(k)$ 设置阈值函数 $\\alpha$ 来标记每个时间窗口。分类随 $\\alpha$\
    \ 的不同值而变化。\n\n## C. 第二阶段检测\n\n在第二阶段检测中，我们将瞬态和泄漏情况隔离开。此外，我们使用预设尺寸来减少误报。这里我们使用两种策略通过操作变化（瞬态情况）消除误报。\n\
    \n- 1) 利用流量变化和压力变化的符号区分情况：根据我们在第二节的讨论，流量差的增加和压力下降是泄漏情况的主要特征。然而，泄漏结构也将压力变化归一化为稳态。相反，压力在管道关闭等瞬态期间会变化。因此，使用以下基于流量变化和压力变化符号的逻辑来区分泄漏和瞬态情况。\n\
    \n### 算法 1 检测\n\n```\n对于时间窗口 k 标记为 y(k) = 1\n  if X1(k) < 0 则\n    y(k) = 2; 下降\n\
    \  else\n    if X1(k) >= 0 and X2(k) > lambda 则\n      y(k) = 2; 上升\n    else\n\
    \      报警 = 1;\n      if LE(k) >= gamma 则\n        y(k) = 1;\n      else\n   \
    \     y(k) = 0; 正常\n  end\nend\n```\n\n![](img/2b334e8c817fc860dd71e02094b44f66_3_0.png)\n\
    \n图 3：所提方法和第一阶段的 DR-FAR 曲线。表 I：第一阶段机器学习工具的比较\n\n| 机器学习方法 | FAR (%) | DR (%) |\
    \ F1 |\n|---|---|---|---|\n| 线性回归 | 0.08% | 90.6% | 0.9444 |\n| SVM | 0.25% |\
    \ 92.1% | 0.9482 |\n| ANN | 0.16% | 91.39% | 0.9485 |\n\n对于第 k 个时间窗口，当平均流量为负时（$X_1(k)\
    \ < 0$），异常标记为下降（瞬态）$y(k) = 2$。在正流量的情况下，可能是正常（上升）。如果 $X_2(k)$ 超过预设阈值 $\\lambda\
    \ > 0$，时间窗口标记为稳定（$y(k) = 2$）。如果流量连续增加三次，则报警。阈值 $\\lambda$ 可以设置为正常情况下 $X_k$ 的标准差。如果压力比正常增加三倍，则视为过程恢复。\n\
    \n- 2) 基于泄漏尺寸的：当时间窗口被标记为泄漏时，触发报警。由于值的波动，此数据可能标记为 $LE(k) = 1$，泄漏尺寸估计受噪声影响。第 k 个时间窗口的泄漏尺寸使用从\
    \ $k_0$ 开始的报警流量差获得：\n\n$$LE(k) = \\frac{1}{j-i_0} \\sum(V(j) - V(i_0))$$\n\n其中\
    \ $i_0$ 是第 k 个时间窗口的起始索引，$j$ 是最后一个时间窗口的索引并触发报警。在此步骤中，如果时间窗口的泄漏尺寸超过指定的容差 $\\gamma$，则报警；否则拒绝报警。第二阶段检测的整体方案总结在算法\
    \ 1 中。\n\n## IV. 性能验证\n\n### A. 真实工业数据设置\n\n在本节中，使用三汇公司的真实工业数据对所提检测进行测试。为了比较第一阶段机器学习工具的性能，表\
    \ I 显示了 ANN 和两种流行的机器学习方法的 FAR、DR 和 F1 分，这些参数通过 k 折交叉验证调整。所有方法的泄漏尺寸检测均设置为零，$\\\
    alpha$ 设为 0.5。可以观察到 ANN 具有最佳整体性能。线性回归的误报较少。然而，其 DR 低于其他方法。ANN 分类器具有最高的 F1 分。\n\
    \n### II. 所提方法的泄漏尺寸容差敏感性\n\n| $\\lambda (m^3)$ | FAR (%) | DR (%) | F1 |\n|---|---|---|---|\n\
    | 0 | 0.16% | 91.30% | 0.9484 |\n| 1 | 0.16% | 90.73% | 0.9448 |\n| 2 | 0.08%\
    \ | 88.74% | 0.9371 |\n| 3 | 0.05% | 86.75% | .91 |\n\n表 II：所提方法的泄漏尺寸容差敏感性\n\n\
    表 II 显示，随着泄漏尺寸的增加，算法变得更加保守。因此，它无法检测某些泄漏，检测率也会下降。如表 II 所示，当 $\\lambda = 0$ 时，算法实现了最高的\
    \ DR 和 FAR。通过增加 $\\lambda$，误报率降低，当 $\\lambda = 0.3$ 时获得 DR，检测率为合理的 75.1 F1 分。\n\
    \n图 4 显示了所提方法与使用各种方法的线性方法的 DR 比较。从图 3 可以看出，低 FAR 下，所提方法的 DR 显著高于线性方法。对于 FAR $\\\
    ge 10\\%$ 的情况，线性方法的 DR 略高。\n\n![](img/2b334e8c817fc860dd71e02094b44f66_4_0.png)\n\
    \n图 4：小泄漏场景下检测延迟对比 FAR 的。\n\n![](img/2b334e8c817fc860dd71e02094b44f66_4_1.png)\n\
    \n图 5：小泄漏场景下检测延迟对比 FAR 的。\n\n## V. 结论\n\n在本文中我们我们了一种使用深度特征的方法。结果显示 ANN 具有最佳性能。随着泄漏尺寸的增加，算法变得更加保守。该方法在工业应用中是有效的。\n\
