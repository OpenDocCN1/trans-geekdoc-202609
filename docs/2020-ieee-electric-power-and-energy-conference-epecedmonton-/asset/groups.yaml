    or decrease, due to operational changes made by the pipeline control center. This
    operator can cause difficulty in the detection of transient. For instance, when
    there is a transient condition in the pipeline, the pressure decreases, which
    is the first characteristic of a transient. For example, a step-up (increase in
    flow rate), in the pipeline, the flow difference increases, which has the same
