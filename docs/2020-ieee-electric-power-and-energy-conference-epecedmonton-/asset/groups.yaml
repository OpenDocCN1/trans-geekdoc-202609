    ![](img/2b334e8c817fc860dd71e02094b44f66_2_0.png)


    Fig. 2: The two-stage detection algorithm.


    # A. Data Pre-processing


    The flow difference and pressure data are pre-processed through several steps
    before the detection stages. First, a sliding time window with size L and mean
    lengths s are processed, and the data is grouped into a sequence of leads to go
    robust. Then, for each time-window, a feature vector is obtained. In order to
    have a common scale for these features, we normalize the feature vectors.


    +   1) Features: As discussed in Section II, a drop and increase in flow rate
    difference between the first and last nodes are key features of a leak in pipelines.
    The following two features are used in this work:


    +   * Mean of volume flow rate difference denoted as $X(i)$: For the k-th window,
    the mean of the volume flow difference between inlet and outlet nodes is based
    on


    $$X_i(k) = \frac{1}{L} \sum (V_i(k) - \hat{V}_i(k))$


    where $k_j$ is the $k$-th time-window and $L$ is the length of the time-window.


    +   * Mean of pressure difference denoted as $Y(i)$: The mean of pressure difference
    for the k-th time-window is obtained as follows:


    $$Y_i(k) = \frac{1}{L} \sum (P(k) - P(k))$


    where $P(k)$ is the measured pressure for the k-th window at the upstream sensor.


    +   2) Modified Hyper-Tangent Estimation: Modified tangent estimation to perform
    classification for neural networks. The main advantage of this method is robustness
    to outliers. The normalized feature vectors $X^{(i)}$ for $i = 1, 2$. This estimator
    yields normalized data with the following expression:


    $$X^{(i)}(k) = \tanh(\frac{0.01(X(k) - \mu_i)}{\sigma_i})$


    where $X^{(i)}(k)$ is the normalized value of $X(k)$ by $\mu_i$ and $\sigma_i$
    are the mean and standard deviation of the scores


    of the variable respectively [11]. In this method, we compute the mean and standard
    deviation respectively through steady-condition samples and use them in the normalization,
    which leads to go robustness.


    # B. Stage 1 Detection


    The first stage of detection is to differentiate normal and abnormal (leak or
    transient) conditions. In this stage, an ANN is trained using pre-processed training
    data and leads to classify pipelines. The ANN is composed of normalized features,
    the normal (state-condition) is labeled as ''abnormal'', if both transient and
    leak conditions are considered as an abnormal and as ''1''.


    In our design, the layers use the ''relu'' function and the last layer uses the
    probability of difference in time-windows. Thus, the output yields the probability
    of $y_i(k)$ in the $k$-th time-window. In order to perform classification, a threshold
    function, $\alpha$, is set using $y_i(k)$ to label each time-window. The classification
    results vary over different values of $\alpha$.


    # C. Stage 2 Detection


    In the second stage of detection, we separate transient and leak conditions. In
    addition, we reduce false alarms using a pre-set size threshold. Here we use two
    strategies to remove false alarms by operational changes (transient conditions).


    +   1) Distinguishing Conditions Using Signs of Flow Change and Pressure Change:
    From our discussion in Section II, an increase in flow rate difference and pressure
    drop are the most major characteristics of leak conditions. However, the leak
    structure also normalizes the variation in pressure becomes similar to steady-state.
    On the contrary, the pressure always varies during transient conditions such as
    pipeline shutdown or flow steps. Therefore, the following logic-based on the signs
    of the flow change and pressure change is used to distinguish leak and transient
    conditions.'
