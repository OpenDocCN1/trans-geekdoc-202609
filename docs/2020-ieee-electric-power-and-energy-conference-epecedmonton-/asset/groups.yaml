    # 一基于深度学习的管道泄漏与瞬态状态检测方法


    Iman Anmani, Yindi Jing, Tongwen Chen, Amin Colin, and Gordon Meyerer

    阿尔伯塔大学电气与计算机工程系，加拿大埃德蒙顿，AB T6G 2V4

    Suncor Energy Logistics Corporation


    由于管道是运输碳烃气体和流体的媒介，泄漏检测至关重要。本文介绍了一种新型双阶段方法来处理多种泄漏和瞬态工况。在该方法中，第一阶段使用改进的微分神经网络对流量和压力泄漏估计器的双曲特性进行归一化，以提取特征向量的特征。第二阶段，使用机器学习对正常和异常时间窗口进行分类。此外，使用预泄漏尺寸容差来触发报警，以检测泄漏窗口。实验结果表明，与基准方法和
    Kandovich 检测方法相比，该方法具有更高的检测性能和更少的误报。


    点分析法显示了泄漏前后工况的统计学特性 [7]。该方法的缺点是在瞬态工况下会触发误报。文献 [4] 提出了一种基于 Kandovich 检测 (KD) 的新方法，结果证明该方法对压力和流量的变化非常敏感；管道建模也可以通过预测值与测量值之间的差异来检测泄漏。然而，该方法计算量大，且缺乏灵活性。


    索引词——泄漏检测，数据分析，信号处理，深度机器学习


    # I. 引言


    管道在输送如燃料、气体和其他化学品等碳烃产品中至关重要；然而，泄漏是由老化、腐蚀和第三方损坏引起的，这些问题非常严峻。泄漏对环境构成了严重风险，人员安全也至关重要。目前已经提出了许多用于监控管道的方法，通常可分为四类：非技术方法、基于硬件的方法、基于软件的方法。在这类方法中，非技术方法和基于硬件的方法通常不作为管道监控成本效益解决方案的主要策略。


    基于软件的方法利用流量、压力、温度等参数的流量测量值来监控在线数据的差异 [5]。线路报警基于进出口流量的差。这种方法易于实现；然而，阈值的调节在误报和检测之间取得平衡可能具有挑战性。


    近年来，还提出了一些利用先进处理工具的方法。它们考虑提取压力和流量中的泄漏数据，以区分正常和泄漏工况。这些方法使用了基于马尔可夫的方法、小波和统计特征 [9]
    以及相关系数来提取特征，并使用长短期记忆 (LSTM)。由于操作（瞬态）或噪声数据，泄漏检测容易产生高误报。这些误报在监控期间可能会让操作员应接不暇。


    本文中，针对消除准确泄漏检测等条件引起的误报，我们提出了一种双阶段深度学习检测方法，用于处理流量法管道中的正常（状态）、瞬态和泄漏工况。该方法利用流量差和压力变化来提取特征。改进的神经网络对微小变化敏感，且每个特征的效果被用于对特征向量进行归一化。在第一阶段，使用训练过的基于深度学习的分类器对正常和异常（或瞬态）状态进行分类。第二阶段，使用简单逻辑分离泄漏和瞬态。此外，使用泄漏尺寸和限制来消除由噪声和干扰引起的误报。所提方法使用真实工业数据进行了测试，具有较高的
    F1 分数和较低的报警率。结果表明，与文献中的两种方法相比，所提方法具有更好的性能。本文的其余部分结构如下：第二部分描述了问题描述和泄漏特征。第三部分提出了包括预处理、使用人工神经网络
    (ANN) 进行分类在内的方案。


    这项工作得到了加拿大自然科学工程基金 (NSERC) 的支持。


    978-1-6281-4469-2/20:$35.00 ©2020 IEEE


    # 2020 IEEE 电力与能源会议 (EPEC)


    ## II. 管道模型与特征提取


    ### A. 系统描述与问题描述

    本文使用了 Suncor Energy 的数据集来训练和测试通过监控控制与数据采集 (SCADA) 系统获得的数据。当泄漏时，管道内部的流量和压力发生变化，导致进出口流量不平衡。泄漏检测容易由于操作（瞬态）或噪声数据产生高误报。这些误报在监控期间可能会让操作员应接不暇。在该方法中，利用流量和压力变化提取特征。改进的神经网络对微小变化敏感，且每个特征的效果被用于对特征向量进行归一化。在第一阶段，使用训练过的基于深度学习的分类器对正常和异常（或瞬态）状态进行分类。第二阶段，使用简单逻辑分离泄漏和瞬态。此外，使用泄漏尺寸和限制来消除由噪声和干扰引起的误报。所提方法使用真实工业数据进行了测试，具有较高的
    F1 分数和较低的报警率。结果表明，与文献中的两种方法相比，所提方法具有更好的性能。本文的其余部分结构如下：第二部分描述了问题描述和泄漏特征。第三部分提出了包括预处理、使用人工神经网络
    (ANN) 进行分类在内的方案。


    点分析法显示了泄漏前后工况的统计学特性 [7]。该方法的缺点是在瞬态工况下会触发误报。文献 [4] 提出了一种基于 Kandovich 检测 (KD) 的新方法，结果证明该方法对压力和流量的变化非常敏感；管道建模也可以通过预测值与测量值之间的差异来检测泄漏。然而，该方法计算量大，且缺乏灵活性。


    当泄漏时，管道内部的流量和压力发生变化，导致进出口流量不平衡。泄漏检测容易由于操作（瞬态）或噪声数据产生高误报。这些误报在监控期间可能会让操作员应接不暇。


    为了应用机器学习算法，将时间序列数据转换为特征向量。设置时间窗口长度 $L$ 来定义窗口之间的间隔：


    $TW(i) = [x(i-L+1), \dots, x(i)]$


    其中 $TW(i)$ 是包含第 $i$ 个时间窗口索引的向量，$s$ 是时间窗口移动到下一个窗口的移动样本数。这可以通过以下函数建模：


    $y(i) = f(TW(i))$


    其中 $y(i)$ 是 $TW(i)$ 的预测标签。


    ### B. 泄漏特征

    管道泄漏在具有流体流失的管道中具有显著的“泄漏特征”，即压力和流量的平衡率。第一种特征是所有测量节点的压力下降。这种行为基于质量守恒定律，即流体在从端节点退出之前一直留在管道内
    [5]。在稳态下，只要流体密度和管道截面积沿管道保持不变，管道内部进出口流量就是平衡的。


    ## III. 所提算法


    在本节中，介绍了一种基于数据的方法用于从压力和流量信号中检测并分类瞬态状态。检测方案如图 2 所示，包含三个主要阶段：预处理、第一阶段检测和第二阶段。在预处理期间，将数据划分为时间窗口。从这些时间窗口的数据中提取特征并进行归一化。在该方法中，使用人工神经网络将正常类
    ($y = 0$) 与泄漏事件和瞬态状态区分来。在检测阶段，该方法通过流量与压力变化之间的小差异以及泄漏限制来检测瞬态状态。该阶段有助于消除瞬态和噪声时间窗口引起的误报。在接下来的小节中，我们将详细说明这三个组件：


