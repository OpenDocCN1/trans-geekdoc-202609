    # A Two-Stage Deep-Learning Based Detection Method for Pipeline Leakage and Transient
    Conditions


    Iman Anmani, Yindi Jing, Tongwen Chen, Amin Colin, and Gordon Meyerer

    Department of Electrical and Computer Engineering, University of Alberta, Edmonton,
    AB, Canada T6G 2V4

    Suncor Energy Logistics Corporation


    Leakage detection is of great importance as pipelines are the means of transporting
    hydrocarbon gases and fluids. In this paper, a novel two-stage method is introduced
    to handle multiple, leakage and transient conditions. In this method, the hyperbolic-characteristics
    from the flow and pressure leakage targeting estimator are normalized with the
    modified differential neural network is used in the first stage to extract the
    features with the feature vectors. In the second stage, machine learning is used
    to classify the normal and abnormal time-windows. In addition, a pre-leak-size
    tolerance is used to trigger alarms for detect leakage-windows. The results are
    shown to have higher detection performance and less false alarms with comparison
    to the baseline and Kandovich detection method.


    The point analysis method shows the statistical properties of the before and after
    leakage conditions [7]. The drawback of this method is the triggering of false
    alarms during transient conditions. A novel method based on Kandovich detection
    (KD) was proposed in [4], which was shown to be sensitive to changes in pressure
    and flow pipeline modeling can also be used to detect leakage as the difference
    between the predicted values and measurement. This method, however, is computationally
    intensive and lacks the flexibility of the method.


    Index Terms—leakage detection, data analytics, signal processing, deep machine
    learning


    # I. INTRODUCTION


    PIPELINES are vital in transporting hydrocarbon products such as fuels, gas, and
    other chemicals; however, leakage is caused by age, corrosion, and third-party
    damages, which are highly critical. Leakage poses severe risks to the environment,
    and human safety are of great importance. Many methods have been proposed to monitor
    pipelines, which generally fall into four categories: non-technical methods, hardware-based,
    software-based methods. Among these three methods, non-technical and hardware-based
    methods are not typically used as the main strategy for pipeline monitoring cost-effective
    solutions.


    Software-based methods use flow measurements such as flow rate, pressure, temperature
    and other parameters to monitor discrepancies in online data [5]. The line alarm
    is based on the difference between inlet and outlet flow difference. This method
    is easily implemented; however, the threshold tuning can be challenging to a trade-off
    between false alarms and detection.


    In recent years, a few methods utilize advanced processing tools have also been
    proposed. They consider extraction of leakage data in the pressure and flow rate
    to signify between normal and leakage conditions. Markov-based method, wavelet
    and statistical features [9], and correlation coefficient to extract features
    long short-term memory (LSTM) are used to extract features in these methods. The
    leakage detection is prone to high false alarms due to operational (transient)
    or noisy data. These false alarms can overwhelm operators during monitoring.


    In this paper, targeting to eliminate false alarms caused by conditions such as
    accurate leakage detection, we propose a two-stage deep-learning detection method
    to handle normal (state), transient), and leakage conditions in pipelines with
    flow method. This utilizes the method of flow rate difference and pressure variation
    to extract the features. The modified neural network is sensitive to the small
    change and effect of every characteristic is used to normalize the feature vectors.
    In the first stage of the, a trained deep-learning-based classifier is used to
    classify the normal and abnormal (or transient) conditions. The second stage,
    leakage and transient are separated using simple logic. In addition, leak size
    and restriction are used to remove false alarms caused by noises and disturbances.
    The proposed method is tested using real industry data and to have a high F1 score
    and a low alarm rate. The result shows that the proposed method leads to a better
    performance in comparison to two methods in the literature. The rest of this paper
    is structured as follows. Section II describes the problem formulation and leak
    signature. Section III proposes the scheme including pre-processing, classification
    using artificial neural networks (ANN).


    This work was supported by NSERC of Canada.


