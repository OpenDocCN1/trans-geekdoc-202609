    # ## 2.2 Image collection and preprocessing


    Rice canopy images were collected in 2021 and 2022 using a camera with six 1/2.9-inch
    CMOS image sensors installed on a UAV (P4 Multispectral, DJI Technology, Co.,
    Ltd., China). The UAV flights were performed at an altitude of 10 m above the
    plots at a speed of 1 m/s under sunny and windless conditions in the morning of
    local time (8:00-11:30). Flights were conducted at the tillering stage (TS), early-panicle
    initiation stage (EPIS) and the intermediate stage (INS) of the rice growth period.
    The original images were spliced with orthophoto maps by Dajiang Zhitu software
    (v3.4, DJI Technology Co., Ltd., China). Six images, each 26372*15284 pixels in
    size, were collected at each stage.


    Due to the inclination of the stitched original images, the Hough line detection
    method (Ballard 1981) was used for slant correction. To avoid the color differences
    caused by different illumination conditions, the gray world method (Kwok et al.
    2011) was used to correct the coloration of the original images. To obtain the
    image of each plot, a mask was created for each plot and the image of each plot
    was cut from the original images. To increase the sample size, each plot image
    was divided into 12 square plot images, each 512*512 pixels, so 216 square plot
    images were obtained from each N and K treatment in each rice growth stage. We
    obtained 10368 original sub-images and randomly divided the rice sample dataset
    for 2021 into 80% for training the models and 20% for testing the models. In order
    to further test the generalization ability of the models, on a different farmland
    with the same soil properties and fertilization treatments, we collected rice
    canopy images in the three growth periods of TS, INS and EPIS in 2022 according
    to the same operational methods of 2021. The new dataset for 2022 was used to
    test the model trained on the dataset for 2021.


    To improve the robustness and generalization ability of the model, the number
    of training images was extended to 500 images in each treatment by data enhancement
    methods of left and right mirror, image 90° rotation and adding Gaussian noise.
    Since our model was trained on time-series images, noise was randomly added to
    the images, and other data enhancement operations were performed on all images
    in the training set. Finally, a total of 24000 training samples were obtained.
    Figure 3 shows examples of the time-series images of HHZ rice in 16 different
    N and K dosage treatments at three different rice growth stages. These examples
    show that rice with'
