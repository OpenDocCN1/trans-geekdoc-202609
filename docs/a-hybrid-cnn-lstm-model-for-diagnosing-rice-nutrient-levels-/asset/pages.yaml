    # 3.3 Model generalization ability


    To test the generalization ability of our proposed model, the model was trained
    on the 2021 dataset and evaluated using the 2022 dataset. The results showed that
    the accuracy and precision of HHZ were both above 81.00%, and the accuracy and
    precision of XS were both above 82.00% (Table 5). These results mean that the
    model has an excellent generalization ability. In the complex paddy environments,
    our advanced framework is able to extract the rice population structure, leaf
    morphology, and its dynamic changes from processed images to accurately diagnose
    the plant nutritional levels. All these procedures are automatically performed
    by deep learning without any human intervention, which provides great convenience
    for the intelligent monitoring of rice nutritional levels.


