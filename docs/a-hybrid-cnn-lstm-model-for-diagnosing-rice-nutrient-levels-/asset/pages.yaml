- pgno: 13
  md: 'continued to keep the rice growing until maturity without dynamic fertilization.
    This allowed us to form rice populations with different yields, which is basically
    consistent with the study of Wang et al. (2013) in which different N fertilizers
    caused rice populations with different yields. The early nutrient levels of rice
    will affect the rice yield in the future. The diagnosis of rice nutrient levels
    at EPIS is a simple way to realize the fine management of panicle fertilizer applications.
    In the future, we will focus on the relationships of rice early nutrient levels,
    fertilization amount and yield prediction.


    # 5 Conclusion


    In this study, a dynamic model of deep learning based on ResNet101 combined with
    the SE module and LSTM (ResNet101-SE-LSTM) was proposed to explore the feasibility
    of using rice canopy images collected by UAV to identify nutrient levels in 2021
    and 2022. Seven convolutional neural networks were trained to identify the N and
    K nutrient levels. The results showed that the ResNet101-SE model can effectively
    extract image features from the spatial and temporal domains for the recognition
    of rice nutrient levels. This study also shows the importance of adding time domain
    extraction to a single dynamic model for diagnosing nutrition levels. In our experiment,
    the ResNet101-SE-LSTM model achieved the highest overall accuracies of 85.88%
    and 88.38% for HHZ and XS134, respectively, in 2021. Our model also showed relatively
    good generalization ability, with the overall accuracies of 81.25% and 82.50%
    for HHZ and XS134, respectively, in 2022. Compared with traditional methods involving
    the destructive detection of rice nutritional status, our method provides a way
    to identify the rice nutrient levels in EPIS, which can provide field workers
    with real-time data and references during rice fertilization in order to increase
    rice yields.


