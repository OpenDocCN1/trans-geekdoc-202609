    # 4.2 The crop growth status responses to N and K treatments


    The status of growth in a crop can originate from abiotic/biotic factors in artificial
    and/or

    circumstantial pathways. Among these factors, N and K are the two dominant nutrients
    affecting

    the crop plant growth on the rice paddy. The N benefits tillering production and
    panicle

    development at the vegetative and reproductive stages, respectively, which helps
    to improve the

    amount, the size, and the weight of the panicle, and results in a high yield at
    maturity (Liu et al.

    2021). In addition, N and K are also critical for leaf photosynthesis (Coskun
    et al. 2017), and have

    direct or indirect relationships with canopy size, color, and shape (Che et al.
    2016). As the N and K

    are extensively involved in various physiological metabolism processes of plants,
    it is difficult to

    distinguish the growth status using one or two indicators. Therefore, an integrated
    diagnosis with

    various physiological traits might be a promising way to evaluate the crop growth
    status at key

    growth stages. In the current study, the SVM and random forest models were used
    to evaluate the

    crop growth status caused by N and K treatments based on the artificially determined
    crop

    physiological traits, and the SVM model had 86.00% and 81.00% recognition accuracies
    in HHZ

    and XS134, respectively. However, it should be noted that the collection of physiological
    traits was

    time-consuming, laborious and involved destructive sampling, which is not suitable
    for production

    applications.


    In recent decades, reports on N/K fertilizer application have mainly focused on
    testing the

    amount and/or types of fertilizer at key growth stages by evaluating the final
