    # 2 Materials and methods


    Figure 1 shows the flowchart of our experiments. The rice canopy images collected
    by an

    RGB camera installed in the UAV were used to train different models for rice early
    nutrition

    diagnosis. At the same time, the rice physiological data were collected to train
    two machine

    learning models for diagnosing rice nutrient levels. Finally, these models were
    compared to verify

    the performance of the hybrid CNN-LSTM model.


    # 2.1 Experiment design


    The experiments were carried out in the rice field (30°04′N ,119°55′E) of the
    China National

    Rice Research Institute (CNRRI) in Hangzhou, Zhejiang Province, China, in 2021
    and 2022. The

    physicochemical properties of soil were as follows: soil alkaline hydrolyzable
    nitrogen content

    115.37 mg kg-1, available phosphorus (P) 14.20 mg kg-1, available potassium 140.19
    mg kg-1,

    organic matter content 30.48 g kg-1, cation exchange capacity 18.37 mg kg-1 and
    pH 5.83. An

    overview of the experimental fields is shown in Fig. 2.


    The two tested rice cultivars were Huanghuazhan (HHZ, a variety of conventional
    indica rice)

    and Xiushui (XS134, a variety of conventional japonica rice). The rice planting
    method adopted a

    split-split-plot randomized block design, with rice varieties as the main plot,
    N fertilizer level as the

    split plot, and K fertilizer levels as subplots; so the two varieties of rice
    were treated with 16

    combinations of four different N and K dosages (Table 1). Three replicate blocks
    were set up to

    form 96 plots. In both experiments, N fertilizer was applied once 2-3 days before
    transplanting and

    once during the rice tillering stage, with a dosage ratio of 5:3, and K fertilizer
    was applied once 2-3

    days before transplanting. P fertilizer was applied at a dosage of 97.5 kg P2O5/ha
    to all blocks.

    Each block was separated by ridges covered with PVC film to prevent the N and
    K from leaching'
