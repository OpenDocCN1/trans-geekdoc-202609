  md: 'responses to different levels of N/K treatment were progressive and the symptoms
    were difficult to distinguish at a time when the differences among the treatment
    levels were small, which has resulted in few quantitative fertilization studies
    based on the actual nutrient levels before PI (Li et al. 2017; Wang et al. 2021).
    On the other hand, the application of N and K fertilizers would affect rice growth
    in both spatial (canopy morphological changes) and temporal (i.e., tillering/LAI
    dynamic) modes. The N and K contents affect rice growth and respond to rice phenotype.
    In this study, a spatiotemporal convolutional network model was developed to diagnose
    the crop growth status resulting from different N and K treatments before PIS.
    The results show that the effect of the ResNet101-SE-LSTM model is consistent
    with that of the SVM model based on rice physiological traits. The results can
    help to improve the accuracy of topdressing fertilizer application at panicle
    initiation.


    # ## 4.3 Relationship between crop nutrient levels and yield prediction


    The traditional yield prediction models of crops usually adopt the data fitting
    method using environmental factors and crop growth factors (Gonzalez-Sanchez et
    al. 2014; Khaki and Wang 2019; Yao et al. 2020). Environmental factors include
    soil type, light and CO2. Crop growth factors include the crop growth and development
    rate. In recent years, remote sensing technology combined with spectroscopy has
    been used to predict crop yields in practical environments. For example, Latwal
    et al. (2019) used agrometeorological regression models, empirical models based
    on remote sensing indices, and semi-physical models to estimate crop yields for
    rapeseed and mustard at the district level. Kang et al. (2021) analyzed six vegetation
    indices based on multi-spectral images of UAVs and used them to develop regression
    models for predicting rice yield and protein content. Panda et al. (2010) used
    a BP neural network (BPNN) modeling method to verify the effectiveness of four
    spectral vegetation indices (NDVI, green vegetation index (GVI), soil adjusted
    vegetation index (SAVI) and vertical vegetation index (PVI))in corn crop yield
    prediction.


    Most of these studies are primarily based on the numerical regression of existing
    factors for yield fitting. The main factors include the N and K absorption content
    of rice at the current stage, as N and K play significant roles in crop health
    and development (Vitosuek et al. 2009; Hou et al. 2019). At the same time, the
    environmental factors and cost require a prudent application of N and K (Chlingaryan
    et al. 2018). Therefore, it is challenging to establish a dynamic model of the
    topdressing amount and yield variation with reference to the nutrient level in
    order to achieve optimal N and K management. We classified the different nutrient
    levels of rice at EPIS and'
