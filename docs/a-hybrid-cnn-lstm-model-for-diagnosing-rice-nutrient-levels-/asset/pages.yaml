    # 4 Discussion


    # 4.1 Nutrient diagnosis based on the analysis of single time point and muti-temporal
    crop images


    Recent nutrient diagnosis studies on single time point crop images by convolutional
    neural networks have made some progress (Condori et al. 2017; Tran et al. 2019;
    Wu et al. 2020; Xiong et al. 2020; Yao et al. 2021). For example, Wu et al. (2020)
    collected the color images and five-channel multispectral data at a specific time
    and trained models for the identification of corn nutrient status. The results
    showed that the identification accuracies based on color images and multispectral
    data were 84.7% and 90.5%, respectively, which could quickly provide the nutrient
    status of corn crops without destroying the crop plants. Tran et al. (2019) proposed
    a method that applies the statistical method of ensemble averaging to the Inception-ResNet
    v2 and autoencoder models, achieving 91% accuracy in the nutritional diagnosis
    of tomato plant growth images under greenhouse conditions.


    All the above studies focused on a single key time node during crop growth, and
    the selection of the key time node is easily obtained through research experience
    or on-site visual observations. However, the symptoms caused by different types
    of nutrient deficiency may be similar at different growth stages of the crop,
    and the nutrient deficiency symptoms in crop plants may not be evident at the
    selected time node (Vitosuek et al. 2009). In fact, the phenotypes caused by nutrient
    stress can appear in crops throughout the whole growth dynamic period, so phenotype
    analysis should consider time series data. Although neural networks have shown
    good performance in diagnosing crop nutrient deficiency, their combination with
    time series analysis models, such as LSTM, will be more consistent with the facts.
    LSTM has been applied in processing time series datasets, such as emotion recognition
    (Son 2017) and disease prediction (Dua et al. 2020). Besides, in laboratory conditions,
    Taghavi Namin et al. (2018) studied plant growth and dynamic information through
    LSTM, and used these characteristics as important differential phenotypes for
    the nutritional classification of Arabidopsis thaliana, achieving classification
    accuracy of 93%. This is the first time'
