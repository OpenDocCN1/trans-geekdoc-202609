    ## A hybrid CNN-LSTM model for diagnosing rice nutrient levels at the rice panicle
    initiation stage


    LIAO Fu-bing1, FENG Xiang-qian2, 3, LI Zi-qiu1, WANG Dan-ying2, XU Chun-mei2,
    CHU Guang2, MA Heng-yu2, YAO Qing1, CHEN Song2#


    1 School of Computer Science and Technology, Zhejiang Sci-Tech University, Hangzhou
    310018, P.R.China


    2 China National Rice Research Institute, Chinese Academy of Agricultural Sciences,
    Hangzhou 310006, P.R.China


    3 School of Agriculture, Yangtze University, Jingzhou 434025, P.R.China


    ### Abstract


    Nitrogen (N) and potassium (K) are two key mineral nutrient elements involved
    in rice growth. Accurate diagnosis of N and K status is very important for the
    rational application of fertilizers at a specific rice growth stage. Therefore,
    we propose a hybrid model for diagnosing rice nutrient levels at the early panicle
    initiation stage (EPIS), which combines a convolutional neural network (CNN) with
    an attention mechanism and a long short-term memory network (LSTM). The model
    was validated on a large set of sequential images collected by an unmanned aerial
    vehicle (UAV) from rice canopies at different growth stages during a two-year
    experiment. Compared with VGG16, AlexNet, GoogleNet, DenseNet, and InceptionV3,
    ResNet101 combined with LSTM obtained the highest average accuracy of 83.81% on
    the dataset of Huanghuazhan (HHZ, an indica cultivar). When tested on the datasets
    of HHZ and Xiu-shui 134 (XS134, a japonica rice variety) in 2021, the ResNet101-LSTM
    model enhanced with the Squeeze-and-Excitation (SE) block achieved the highest
    accuracies of 85.38% and 88.38%, respectively. Through the cross-dataset method,
    the average accuracies on the HHZ and XS134 datasets tested in 2022 were 81.25%
    and 82.50%, respectively, showing a good generalization. Our proposed model works
    with the dynamic information of different rice growth stages and can efficiently
    diagnose different rice nutrient status levels at EPIS, which are helpful for
    making practical decisions regarding rational fertilization treatments at the
    panicle initiation stage.


    Keywords: dynamic model of deep learning, UAV, rice panicle initiation, nutrient
    level diagnosis, image classification.


    ### 1 Introduction


    Nitrogen (N) and potassium (K) are not only the key nutritional factors affecting
    rice photosynthesis, population growth and grain production, but they are also
    the key factors determining rice yields and food security (Vitousek et al. 2009;
    Hou et al. 2019). Therefore, it is of great significance to accurately judge the
    N and K requirements of rice and rationally optimize field fertilization in order
    to achieve high-quality and high-yield rice. Panicle initiation (PI) is a period
    of rapid growth and development of the rice young panicles. During this period,
    the rational application of panicle fertilizer is very critical, and the N and
    K nutrients in fertilizer can be effectively absorbed to increase the number of
    spikelets per panicle and the panicle size, which increases rice yields (Liu et
    al. 2021). At present, the methods for diagnosing rice nutrient requirements mainly
    involve appearance diagnosis, chemical diagnosis and modern nutrient diagnosis.
    The appearance diagnosis method mainly relies on technicians with long-term diagnostic
    experience to visually observe the colors, shapes and growth rates of rice stems
    and leaves (Chen and Wang 2014; Sun et al. 2018). It is subjective, which can
    easily lead to misdiagnosis of the rice nutritional status. Chemical diagnosis
    methods mainly measure the critical concentrations of nitrogen in different plant
    organs by chemical analysis methods, including total nitrogen diagnosis and nitrate
    diagnosis (Zhang et al. 2022). But these methods have the problems of destructive
    sampling and complicated analytical operations, so they are difficult to popularize
    and apply to nutrient level diagnosis on a large scale. Modern nutrient level
    diagnosis methods mainly include the chlorophyll measurement method and the hyperspectral
    remote sensing method. Relevant studies have shown that the nitrogen content of
    rice leaves has a positive correlation with the chlorophyll content, and the Soil
    and Plant Analyzer Development (SPAD) value has a linear correlation with chlorophyll,
    which makes this method useful for nitrogen diagnosis in field crops (Ghosh et
    al. 2020). Although this method is widely used in nitrogen nutrient diagnosis
    (Peng et al. 2010; Ali et al. 2015; Ling et al. 2017; Baral et al. 2021), it still
    has some disadvantages. For example, the SPAD value is greatly affected by light,
    so multiple measurements are needed to effectively reduce the variability, and
    it is not suitable for large-scale farmland testing. The hyperspectral remote
    sensing method mainly analyzes the spectral differences of the target objects.
    The spectral reflection features of plant canopies are affected by many factors,
    such as the water content of plant leaves, the geometric structure of the plant
    canopy and the soil coverage (Wang et al. 2018; Zheng et al. 2019), which greatly
    limits the reliability and accessibility of using remote sensors for crop nitrogen
    diagnosis. Therefore, the current application of panicle fertilizer in production
    mainly depends on the experience and diagnostic knowledge of agricultural experts
    and technicians. With the aging of the agricultural population in recent years,
    there is an urgent need to develop an intelligent, efficient, nondestructive and
    easy method for diagnosing nutrient requirements during rice plant growth.


    With the rapid development of digital image processing and artificial intelligence,
    many studies have focused on the diagnostic methods of crop nutrient status based
    on images. These methods can be divided into the traditional image pattern recognition
    methods and deep learning methods. The crop symptoms in response to the lack of
    nutrient elements are recognized by traditional classification models based on
    various image features, which mainly include morphological features (Chen and
    Wang 2014; Sun et al. 2018), texture features (Wood et al. 2012), color features
    (Sun et al. 2018) and local features (Gu et al. 2012; Li et al. 2015). The steps
    in traditional pattern recognition methods usually involve first removing the
    background, then manually designing the image features, and finally training the
    classifier. Generally, a high accuracy rate can be obtained on the test set. However,
    the biodiversity and complex backgrounds in field situations cause the traditional
    pattern recognition methods to show weak robustness and poor generalization ability.
    With the excellent performance of convolutional neural network (CNN) in large-scale
    image recognition (Li S X et al. 2022; Sun G J et al. 2022), nutrient deficiency
    identification methods based on CNN in maize (Condori et al. 2017; Wu et al. 2020),
    soybean (Xiong et al. 2020), tomato (Tran et al. 2019) and rice (Yao et al. 2021)
    have shown excellent recognition results. However, the nutrient diagnosis of crops
    in these studies is usually based on sets of images collected at a single time
    point. In fact, the responses of crops to nutrient deficiency occur throughout
    the long growth period of crops. Thus far, many scholars have conducted some studies
    on the time series data of crops such as corn and wheat, and the results have
    shown that the fusion of time-series data significantly improves the accuracy
    of yield estimations (Lin et al. 2020; Li Q et al. 2022; Sun Z Z et al. 2022).


    The nutrient level of the rice canopy is related to the population structure,
    leaf morphology, tiller distribution, other physiological traits and their dynamic
    changes (Vitousek et al. 2009). Due to the complexity of plant structures and
    nutrient-stress symptoms at the different development stages of rice, the real-time
    features of crop population growth combined with their dynamic changes should
    be considered in order to accurately monitor the rice population nutrient status.
    In a two-year experiment, we first established rice populations at different nutrient
    levels, and then used UAV to take time series images, in order to build a population
    of images. Then, CNN was used to extract the high-dimensional features from the
    image, and this was combined with LSTM to enhance the feature correlations in
    the time dimension. This approach was able to improve the accuracy of nutrient
    level diagnosis in the early panicle initiation stage, which is of great significance
    for realizing the refined management of panicle fertilization and increasing production
    and income.


    ### 2 Materials and methods


    Figure 1 shows the flowchart of our experiments. The rice canopy images collected
    by an RGB camera installed in the UAV were used to train different models for
    rice early nutrition diagnosis. At the same time, the rice physiological data
    were collected to train two machine learning models for diagnosing rice nutrient
    levels. Finally, these models were compared to verify the performance of the hybrid
    CNN-LSTM model.


    ### 2.1 Experiment design


    The experiments were carried out in the rice field (30°04′N, 119°55′E) of the
    China National Rice Research Institute (CNRRI) in Hangzhou, Zhejiang Province,
    China, in 2021 and 2022. The physicochemical properties of soil were as follows:
    soil alkaline hydrolyzable nitrogen content 115.37 mg kg-1, available phosphorus
    (P) 14.20 mg kg-1, available potassium 140.19 mg kg-1, organic matter content
