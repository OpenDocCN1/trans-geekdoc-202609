    LSTMs被用于研究植物的时序特性和动态信息，展示了其在植物营养状态分类方面的潜力。在本研究中，通过比较单点时间数据集和时间序列数据集的结果，发现对于不同品种的水稻，时间序列数据集的分类性能普遍优于单点时间数据集（表
    4）。这一改进表明，时序信息提取在分析植物营养分类方面具有巨大潜力，这与 Taghavi Namin 等人（2018）得出的结论基本一致。


    ### 4.2 作物生长状态对 N 和 K 处理的响应


    作物的生长状态可能源于人为和/或环境途径中的非生物/生物因素。在这些因素中，N 和 K 是影响水稻田作物生长的两种主导营养元素。N 分别有益于营养生长期和生殖生长期的分蘖产量和穗部发育，这有助于提高穗的数量、大小和重量，并在成熟期获得高产量（Liu
    等人，2021）。此外，N 和 K 对叶片光合作用也至关重要（Coskun 等人，2017），并且与冠层大小、颜色和形状存在直接或间接关系（Che 等人，2016）。由于
    N 和 K 广泛参与植物的各种生理代谢过程，使用一两个指标很难区分生长状态。因此，结合各种生理特征进行综合诊断可能是评估关键生长阶段作物生长状态的一种有前途的方法。在本研究中，利用人为确定的作物生理特征，采用
    SVM 和随机森林模型来评估 N 和 K 处理引起的作物生长状态，SVM 模型在 HHZ 和 XS134 上的识别准确率分别为 86.00% 和 81.00%。然而，应注意的是，生理特征的采集耗时、费力且涉及破坏性取样，不适合生产应用。


    在最近几十年，关于 N/K 肥料施用的报告主要集中在通过评估最终产量来测试关键生长阶段的肥料用量和/或类型（Ma 等人，2019；Huang 等人，2021），这不仅耗时费力，还依赖于环境条件和品种。因此，需要一种简单的水稻营养状态诊断技术用于追肥施用。报告表明，EPIS
    时期追肥的时机对提高源体量有重大影响（Ma 等人，2019）。然而，由于 N 和 K 对作物生长和产量表现的定量影响，植物生长状态对不同 N/K 处理水平的响应是渐进的，当处理水平之间的差异较小时，症状难以区分，这导致基于
    PI 前实际养分水平的定量施肥研究很少（Li 等人，2017；Wang 等人，2021）。另一方面，N 和 K 肥料的施用将以空间（冠层形态变化）和时间（即分蘖/LAI
    动态）两种方式影响水稻生长。N 和 K 含量影响水稻生长并响应水稻表型。在本研究中，开发了一种时空卷积网络模型，用于诊断 PIS 前不同 N 和 K 处理引起的作物生长状态。结果表明，ResNet101-SE-LSTM
    模型的效果与基于水稻生理特征的 SVM 模型一致。结果有助于提高穗初期追肥施用的准确性。


    ### 4.3 作物营养水平与产量预测的关系


    作物的传统产量预测模型通常采用使用环境因子和作物生长因子的数据拟合方法（Gonzalez-Sanchez 等人，2014；Khaki 和 Wang，2019；Yao
    等人，2020）。环境因子包括土壤类型、光照和 CO2。作物生长因子包括作物生长和发育速率。近年来，遥感技术结合光谱学已被用于在实际环境中预测作物产量。例如，Latwal
    等人（2019）使用农业气象回归模型、基于遥感指数的经验模型和半物理模型来估算区级油菜和芥菜的作物产量。Kang 等人（2021）分析了基于无人机多光谱影像的六种植被指数，并利用它们开发用于预测水稻产量和蛋白质含量的回归模型。Panda
    等人（2010）使用 BP 神经网络（BPNN）建模方法，验证了四种光谱植被指数（NDVI、绿色植被指数（GVI）、土壤调整植被指数（SAVI）和垂直植被指数（PVI））在玉米作物产量预测中的有效性。


    这些研究中的大多数主要基于现有因子的数值回归进行产量拟合。主要因子包括当前阶段水稻的 N 和 K 吸收含量，因为 N 和 K 在作物健康和发育中起着重要作用（Vitousek
    等人，2009；Hou 等人，2019）。同时，环境因子和成本要求审慎施用 N 和 K（Chlingaryan 等人，2018）。因此，建立参考养分水平的追肥量和产量变化动态模型以实现最佳
    N 和 K 管理具有挑战性。我们对 EPIS 时期水稻的不同养分水平进行了分类，并在不进行动态施肥的情况下继续让水稻生长至成熟期。这使我们能够形成产量不同的水稻种群，这与
    Wang 等人（2013）的研究基本一致，该研究中不同 N 肥料导致了产量不同的水稻种群。水稻早期养分水平将影响未来的水稻产量。EPIS 时期水稻养分水平的诊断是实现穗肥精细管理的一种简单方法。未来，我们将关注水稻早期养分水平、施肥量和产量预测之间的关系。


    ## 5 结论


    本研究提出了一种基于 ResNet101 结合 SE 模块和 LSTM（ResNet101-SE-LSTM）的深度学习动态模型，以探讨使用无人机采集的水稻冠层图像在
    2021 年和 2022 年识别养分水平的可行性。训练了七个卷积神经网络来识别 N 和 K 养分水平。结果表明，ResNet101-SE 模型可以有效地从空间和时域提取图像特征，用于水稻养分水平的识别。本研究还表明，在单一动态模型中加入时域提取对诊断营养水平非常重要。在我们的实验中，ResNet101-SE-LSTM
    模型在 2021 年分别为 HHZ 和 XS134 实现了最高的总体准确率 85.88% 和 88.38%。我们的模型还表现出较好的泛化能力，2022 年分别为
    HHZ 和 XS134 达到了 81.25% 和 82.50% 的总体准确率。与涉及水稻营养状态破坏性检测的传统方法相比，我们的方法提供了一种在 EPIS
    识别水稻养分水平的方法，可在水稻施肥期间为田间工作者提供实时数据和参考，以提高水稻产量。


    ## 致谢


    本作品得到中国国家重点研发计划（2022YFD2300700）、中国国家稻研究院－CNRRI 国家重点实验室开放课题（20210403）以及浙江“万名人才”计划科技创新领军人才项目（2020R52035）的支持。


    ## 利益冲突声明


    作者声明不存在利益冲突。


