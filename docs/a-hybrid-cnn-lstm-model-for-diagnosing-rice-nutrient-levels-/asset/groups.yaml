    ## 2.2 图像采集与预处理


    2021年和2022年，使用安装在无人机（P4 Multispectral，大疆创新科技有限公司，中国）上的配备六颗1/2.9英寸CMOS图像传感器的相机采集了稻穗冠层图像。无人机在当地时间上午（8:00-11:30）晴朗无风的条件下，以1
    m/s的速度在试验区上空10 m的高度执行飞行任务。飞行在稻穗分蘖期（TS）、早期穗分化期（EPIS）和中间期（INS）进行。原始图像使用大疆智图软件（v3.4，大疆创新科技有限公司，中国）与正射影像图进行拼接。每个阶段采集了六张图像，每张图像大小为26372*15284像素。


    由于拼接后的原始图像存在倾斜，采用Hough直线检测方法（Ballard 1981）进行倾斜校正。为避免不同光照条件引起的颜色差异，采用灰世界方法（Kwok
    et al. 2011）校正原始图像的色彩。为获取每个试验区的图像，为每个试验区创建了掩膜，并从原始图像中裁剪出每个试验区的图像。为增加样本量，每个试验区图像被分割为12张方形试验区图像，每张512*512像素，因此从每个N和K处理在每个稻穗生长阶段获得了216张方形试验区图像。我们获得了10368张原始子图像，并将2021年的稻穗样本数据集随机分为80%用于模型训练、20%用于模型测试。为进一步测试模型的泛化能力，在土壤性质和施肥处理相同的不同农田上，按照2021年的相同操作方法，采集了2022年TS、INS和EPIS三个生长期的稻穗冠层图像。2022年的新数据集用于测试在2021年数据集上训练的模型。


    为提高模型的鲁棒性和泛化能力，通过左右镜像、图像90°旋转和添加高斯噪声等数据增强方法，将每个处理的训练图像数量扩展至500张。由于我们的模型在时序图像上训练，噪声被随机添加到图像中，其他数据增强操作在训练集的所有图像上执行。最终，总共获得了24000个训练样本。图3展示了16种不同N和K剂量处理在三个不同稻穗生长阶段的HHZ稻穗时序图像示例。这些示例表明，不同营养水平的稻穗在同一生长阶段的视觉差异有限且相似度高（图3）。其中，N2K0、N2K1、N2K2和N2K3在TS时差异不明显，但在从TS到EPIS的整个稻穗生长过程中存在差异。


    ## 2.3 稻穗生理指标测定


    无人机采集不同稻穗生长阶段的图像后，从每个试验区采集稻穗样品。人工测量株高并数穗数。然后将样品分离为绿色叶片、枯叶片以及茎秆加叶鞘，并在80°C烘箱中干燥72小时以上，以测定各组织器官的干重。叶面积指数（LAI）使用叶面积仪（LI-3000A，LICOR，美国内布拉斯加州林肯）测定，比叶重（SLA）计算为绿色叶面积与其干重之比。植物组织中N和K浓度使用湿消解后的凯氏定氮法（Goyal
    et al. 2022）测定，N和K累积量表示为浓度与其干物质重量的乘积。


    ## 2.4 稻穗营养诊断模型


    稻穗生长是一个动态过程，不同生长阶段稻穗的N和K表型不同。为实时准确诊断稻穗的营养水平，提出了一种基于深度学习方法的营养诊断模型CNN-LSTM，用于提取稻穗冠层图像的时空特征。涉及的LSTM是一种特殊的递归神经网络（RNN），可以学习序列数据中时间步之间的短期和长期依赖关系（Hochreiter
    and Schmidhuber, 1997）。LSTM的输入由单元状态C t-1、隐藏状态ht-1和输入向量xt组成，输出由单元状态Ct和隐藏状态ht组成，主要由输入门（i）、遗忘门（f）、候选门（g）和输出门（o）控制。LSTM样本单元图如图4所示。


    目前，典型的CNN识别模型包括AlexNet（Krizhevsky et al. 2012）、VGG16（Simonyan and Zisserman 2015）、GoogleNet（Szegedy
    et al. 2015）、DenseNet（Huang et al. 2017）、inception v3（Szegedy et al. 2015）和ResNet101（He
    et al. 2016）。在本研究中，使用了这六种不同的CNN模型进行特征提取。所有这些网络都应用了Imagenet公开数据集（Weiss et al. 2016）上的预训练模型以加速训练。最终，最佳模型（ResNet101）被用作本研究中提取特征的基本模型。然后，将SENet通道注意力机制添加到ResNet101模型中，以增强关键特征的提取。SENet的本质是利用相关特征图学习权重分布，然后将训练得到的权重应用于原始特征图进行加权求和，从而进一步提高网络获取局部有效信息的能力。


    ResNet101-SE-LSTM网络框架如图4所示。首先，将神经网络模型ResNet101与挤压-激励（SE）模块结合，以从时序图像中提取特征。为避免有用特征的丢失，模型跳过了最后的全连接层，然后通过reshape层直接将特征转换为特征向量，以重新生成适合LSTM输入的特征矩阵。LSTM的每个单元输入（大小：m*n）是包含每个时间步的稻穗冠层图像的一组特征向量，其中m是每个时间步的图像总数，包括TS、INS和EPIS，n是神经网络提取的特征向量。在图4中，i是输入模型框架的时间步，等于2或3。实际上，由于该框架的灵活性，时间步可以根据实际需求和模型输出反馈进行调整。其次，通过端到端可训练的类架构，LSTM模型使用反向传播算法进行反复迭代，并将交叉熵用作模型训练的损失函数。LSTM的超参数如表3所示。最后，最后一个LSTM单元的隐藏层ht对序列数据的关键信息进行编码。我们通过全连接层转换生成的输出向量，并将其长度转换为类别数。然后使用softmax层对稻穗营养水平进行分类，其神经元数量与类别数相同。


