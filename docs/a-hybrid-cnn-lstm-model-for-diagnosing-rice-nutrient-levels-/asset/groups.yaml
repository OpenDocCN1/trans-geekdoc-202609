    ## 一种用于在水稻幼穗分化期诊断水稻营养水平的混合CNN-LSTM模型


    LIAO Fu-bing1, FENG Xiang-qian2, 3, LI Zi-qiu1, WANG Dan-ying2, XU Chun-mei2,
    CHU Guang2, MA Heng-yu2, YAO Qing1, CHEN Song2#


    1 School of Computer Science and Technology, Zhejiang Sci-Tech University, Hangzhou
    310018, P.R.China


    2 China National Rice Research Institute, Chinese Academy of Agricultural Sciences,
    Hangzhou 310006, P.R.China


    3 School of Agriculture, Yangtze University, Jingzhou 434025, P.R.China


    ### 摘要


    氮（N）和钾（K）是水稻生长中涉及的两种关键矿质营养元素。在特定水稻生长阶段合理施用肥料，对准确诊断N和K状态至关重要。因此，我们提出了一种用于在早期幼穗分化期（EPIS）诊断水稻营养水平的混合模型，该模型将卷积神经网络（CNN）与注意力机制以及长短期记忆网络（LSTM）相结合。该模型在两年试验期间，由无人机（UAV）从不同生长阶段的水稻冠层收集的一组大型序列图像上进行了验证。与VGG16、AlexNet、GoogleNet、DenseNet和InceptionV3相比，ResNet101与LSTM相结合在黄华占（HHZ，一种籼稻品种）数据集上获得了最高平均准确率83.81%。在2021年对HHZ和秀水134（XS134，一种粳稻品种）数据集进行测试时，增强了挤压与激励（SE）模块的ResNet101-LSTM模型分别达到了最高准确率85.38%和88.38%。通过跨数据集方法，2022年对HHZ和XS134数据集的测试平均准确率分别为81.25%和82.50%，显示出良好的泛化性。我们提出的模型利用不同水稻生长阶段的动态信息，能够高效诊断EPIS时期不同水稻营养状态水平，这有助于在幼穗分化期做出关于合理施肥方案的实际决策。


    关键词：深度学习动态模型，无人机，水稻幼穗分化期，营养水平诊断，图像分类。


    ### 1 引言


    氮（N）和钾（K）不仅是影响水稻光合作用、种群生长和谷物生产的关键营养因素，也是决定水稻产量和粮食安全的关键因素（Vitousek et al. 2009；Hou
    et al. 2019）。因此，准确判断水稻对N和K的需求并合理优化田间施肥，以实现优质高产水稻，具有重要意义。幼穗分化期（PI）是水稻幼穗快速生长和发育的时期。在此期间，合理施用穗肥非常关键，肥料中的N和K养分可以被有效吸收，以增加每穗小花数和穗大小，从而增加水稻产量（Liu
    et al. 2021）。目前，诊断水稻营养需求的方法主要包括外观诊断、化学诊断和现代营养诊断。外观诊断方法主要依赖具有长期诊断经验的技术人员，通过目视观察水稻茎叶的颜色、形状和生长速率（Chen
    and Wang 2014；Sun et al. 2018）。该方法具有主观性，容易导致水稻营养状态误诊。化学诊断方法主要通过化学分析方法测定不同植物器官中氮的临界浓度，包括全氮诊断和硝酸盐诊断（Zhang
    et al. 2022）。但这些方法存在破坏性取样和分析操作复杂的问题，因此难以推广和应用于大规模的营养水平诊断。现代营养水平诊断方法主要包括叶绿素测定法和高光谱遥感法。相关研究表明，水稻叶片氮含量与叶绿素含量呈正相关，土壤和植物分析开发（SPAD）值与叶绿素呈线性相关，这使得该方法在田间作物氮诊断中有用（Ghosh
    et al. 2020）。尽管该方法广泛用于氮营养诊断（Peng et al. 2010；Ali et al. 2015；Ling et al. 2017；Baral
    et al. 2021），但它仍有一些缺点。例如，SPAD值受光照影响很大，因此需要多次测量才能有效减少变异性，且不适合大规模农田检测。高光谱遥感方法主要分析目标对象的光谱差异。植物冠层的光谱反射特征受许多因素影响，如植物叶片含水量、植物冠层几何结构和土壤覆盖度（Wang
    et al. 2018；Zheng et al. 2019），这大大限制了使用遥感传感器进行作物氮诊断的可靠性和可及性。因此，生产中目前施用穗肥主要依赖农业专家和技术人员的经验和诊断知识。近年来，随着农业人口老龄化，急需开发一种智能、高效、无损且简便的方法，用于诊断水稻生长期间的营养需求。


    随着数字图像处理和人工智能的快速发展，许多研究都集中在基于图像的作物营养状态诊断方法上。这些方法可分为传统图像模式识别方法和深度学习方法。基于各种图像特征的传统分类模型识别作物对营养元素缺乏的反应症状，这些特征主要包括形态特征（Chen
    and Wang 2014；Sun et al. 2018）、纹理特征（Wood et al. 2012）、颜色特征（Sun et al. 2018）和局部特征（Gu
    et al. 2012；Li et al. 2015）。传统模式识别方法的步骤通常包括首先去除背景，然后手动设计图像特征，最后训练分类器。通常，在测试集上可以获得较高的准确率。然而，田间情况中的生物多样性和复杂背景导致传统模式识别方法表现出较差的鲁棒性和泛化能力。卷积神经网络（CNN）在大规模图像识别中的出色性能（Li
    S X et al. 2022；Sun G J et al. 2022），使得基于CNN的玉米（Condori et al. 2017；Wu et al.
    2020）、大豆（Xiong et al. 2020）、番茄（Tran et al. 2019）和水稻（Yao et al. 2021）营养缺乏识别方法取得了出色的识别结果。然而，这些研究中的作物营养诊断通常基于在单一时间点收集的图像集。实际上，作物对营养缺乏的反应发生在作物漫长的生长期内。迄今，许多学者对玉米和小麦等作物的时间序列数据进行了一些研究，结果表明，时间序列数据的融合显著提高了产量估算的准确性（Lin
    et al. 2020；Li Q et al. 2022；Sun Z Z et al. 2022）。


    水稻冠层的营养水平与种群结构、叶片形态、分蘖分布、其他生理特征及其动态变化相关（Vitousek et al. 2009）。由于水稻不同发育阶段植物结构和营养胁迫症状的复杂性，为了准确监测水稻种群营养状态，应考虑作物种群生长的实时特征及其动态变化。在两年试验中，我们首先建立了不同营养水平的水稻种群，然后使用无人机拍摄时间序列图像，以构建图像种群。然后，使用CNN从图像中提取高维特征，并将其与LSTM相结合，以增强时间维度中的特征相关性。该方法能够提高早期幼穗分化期营养水平诊断的准确性，这对于实现穗肥精细管理和增产增收具有重要意义。


    ### 2 材料与方法


    图1展示了我们实验的流程图。由安装在无人机上的RGB相机收集的水稻冠层图像用于训练不同模型，用于水稻早期营养诊断。同时，收集了水稻生理数据以训练两个用于诊断水稻营养水平的机器学习模型。最后，比较了这些模型以验证混合CNN-LSTM模型的性能。


    ### 2.1 实验设计


    实验于2021年和2022年在中国浙江省杭州市中国农业科学院国家水稻研究所（CNRRI）的水稻田（30°04′N, 119°55′E）进行。土壤理化性质如下：土壤碱解氮含量115.37
    mg kg-1，速效磷（P）14.20 mg kg-1，速效钾140.19 mg kg-1，有机质含量30.48 g kg-1，阳离子交换容量18.37 mg
    kg-1，pH 5.83。实验田概况见图2。


    两个测试水稻品种为黄华占（HHZ，一种常规籼稻品种）和秀水（XS134，一种常规粳稻品种）。水稻种植方法采用分割分割区随机区组设计，以水稻品种为主区，N肥水平为分区，K肥水平为子分区；因此，两个水稻品种分别接受了四种不同N和K剂量的16种组合处理（Table
    1）。设置了三个重复区组，形成96个小区。在两次试验中，N肥分别在移栽前2-3天施用一次和水稻分蘖期施用一次，剂量比例为5:3，K肥在移栽前2-3天施用一次。所有区组施用P肥，剂量为97.5
    kg P2O5/ha。每个区组均由覆盖PVC薄膜的埂分隔，以防止N和K淋失。


