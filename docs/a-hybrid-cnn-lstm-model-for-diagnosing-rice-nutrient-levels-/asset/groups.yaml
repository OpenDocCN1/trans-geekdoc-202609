    # ## 2.4 Rice nutrient diagnosis model


    Rice growth is a dynamic process, and the N and K phenotypes of rice plants in
    different growth stages are different. To accurately diagnose the nutrient level
    of rice in real-time, a nutrient diagnostic model CNN-LSTM based on the deep learning
    method was proposed to extract the temporal and spatial features of the rice canopy
    images. The LSTM involved is a special recursive neural network (RNN) that can
    learn the short-term and long-term dependencies between time steps in sequential
    data (Hochreiter and Schmidhuber, 1997). The input of LSTM is composed of a cell
    state C t-1, a hidden state ht-1 and input vector xt, and the output is composed
    of a cell state Ct and a hidden state ht, which are mainly controlled by the input
    gate (i), forgetting gate (f), candidate gate (g) and output gate (o). A sample
    unit diagram of the LSTM is shown in Fig. 4.


    Currently, the typical CNN identification models include AlexNet (Krizhevsky et
    al. 2012), VGG16 (Simonyan and Zisserman 2015), GoogleNet (Szegedy et al. 2015),
    DenseNet (Huang et al. 2017), inception v3 (Szegedy et al. 2015), and ResNet101(He
    et al. 2016). In this study, these six different CNN models were used for feature
    extraction. All of these networks applied the pretrained models on the Imagenet
    public dataset (Weiss et al. 2016) to speed up the training. Finally, the best
    model (ResNet101) was used as the basic model for extracting the features in this'
  - '[PAGE 6]


    study. Then the SENet channel attention mechanism was added to the ResNet101 model
    to enhance the extraction of key features. The essence of SENet is to use the
    relevant feature maps to learn the weight distribution, and then the trained weights
    are applied to the original feature maps for weighted summation, thereby further
    improving the ability of the network to obtain local effective information.


    The network framework of ResNet101-SE-LSTM is shown in Fig. 4. Firstly, the neural
    network model ResNet101 was combined with the Squeeze-and-Excitation (SE) module
    to extract features from the time serial images. In order to avoid the loss of
    useful features, the model skipped the last fully connected layer, and then directly
    transformed the features into feature vectors through the reshape layer to regenerate
    a feature matrix suitable for the LSTM inputs. Each cell input for LSTM (size:
    m*n) is a group of feature vectors of the rice canopy images containing each time
    step, where m is the total number of images at each time step, including TS, INS
    and EPIS, and n is the feature vectors extracted by the neural network. In Fig.
    4, i is the time step of the input model framework, which equals 2 or 3. In fact,
    due to the flexibility of this framework, the time step can be adjusted according
    to the actual needs and model output feedback. Secondly, through the end-to-end
    trainable class architecture, the LSTM model uses the back-propagation algorithm
    to iterate repeatedly, and it uses the cross entropy as the loss function for
    model training. The hyperparameters of the LSTM are shown in Table 3. Finally,
    the hidden layer ht of the last LSTM cell unit encodes the key information of
    the sequential data. We converted the generated output vector through a full connection
    layer, and its length was converted into the number of classes. Then the softmax
    layer was used to classify the rice nutrient level and its neuron number is the
    same as the number of classes.


    # 2.5 Model training


    All models were run on a PC with a CPU which has an AMD Ryzen 5 3600 6-Core Processor
    3.60GHz. The computer was equipped with 3 GeForce GTX 1080Ti. Its operating system
    was Linux 16.04 and its host memory was 32.00 GB.


    During the training process, the weights of the pretrained model were fine-tuned,
    the model was trained with 16 sets of small-batch sample data on three GPUs simultaneously
    by multi-threading, and stochastic gradient descent was selected as the optimization
    strategy. The detailed configuration parameters of ResNet101-SE-LSTM are shown
    in Table 2.


