    The two tested rice cultivars were Huanghuazhan (HHZ, a variety of conventional
    indica rice) and Xiushui (XS134, a variety of conventional japonica rice). The
    rice planting method adopted a split-split-plot randomized block design, with
    rice varieties as the main plot, N fertilizer level as the split plot, and K fertilizer
    levels as subplots; so the two varieties of rice were treated with 16 combinations
    of four different N and K dosages (Table 1). Three replicate blocks were set up
    to form 96 plots. In both experiments, N fertilizer was applied once 2-3 days
    before transplanting and once during the rice tillering stage, with a dosage ratio
    of 5:3, and K fertilizer was applied once 2-3 days before transplanting. P fertilizer
    was applied at a dosage of 97.5 kg P2O5/ha to all blocks. Each block was separated
    by ridges covered with PVC film to prevent the N and K from leaching

