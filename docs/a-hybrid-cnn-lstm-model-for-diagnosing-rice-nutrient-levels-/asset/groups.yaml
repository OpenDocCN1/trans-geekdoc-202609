    为评估 ResNet101-SE-LSTM 模型的识别效果，我们采用准确率（Acc）、精确率（Pre）、召回率（Rec）和 F1 分数（F1）作为衡量模型性能的评价指标。Acc、Pre、Rec
    和 F1 的计算方法如公式 (1-4) 所示。


    $Acc = \frac{TP + TN}{TP + FP + FN + TN}$ (1)


    $P_{re} = \frac{TP}{TP + FP}$ (2)


    $R_{ec} = \frac{TP}{TP + FN}$ (3)


    $F_1 = \frac{2P_{re}R_{ec}}{P_{re} + R_{ec}}$ (4)


    其中 TP 表示正样本被预测为正样本，FN 表示正样本被预测为负样本，FP 表示负样本被预测为正样本，TN 表示负样本被预测为负样本。


    ### 2.7 基于水稻生理特征的机器识别方法


    为区分不同 N 和 K 相互作用的发育差异，我们采集了经典植物生理特征数据，并使用 Monte Carlo 采样器（Metropolis 和 Ulam 1949）扩展了测试数据。这些生理特征包括干物质重量、植物组织（叶片、茎秆和叶鞘、穗）中
    N 和 K 含量及积累、全地上部生物量、比叶重、绿叶重、叶面积指数、植株高度和分蘖数。我们训练了两种机器学习模型，即支持向量机（SVM）和随机森林，用于诊断
    N 和 K 处理相互作用下的水稻营养水平。将结果与 CNN-LSTM 的诊断结果进行比较，以间接评估 CNN-LSTM 模型的可行性。


    ## 3 结果


    ### 3.1 不同模型的识别结果


    七种特征提取网络，即 VGG16、AlexNet、GoogLeNet、DenseNet、inceptionV3、ResNet101 和 ResNet101-SE，与
    LSTM 模型相结合，用于诊断 EPIS 时期 HHZ 的 N 和 K 营养水平。诊断结果如表 3 和图 5 所示。AlexNet 在 16 种营养水平诊断中表现最差，准确率为
    73.94%，其曲线下面积（AUC）最低，为 0.76。ResNet101 表现相对较好，准确率为 83.81%，相应的 AUC 为 0.90。在 ResNet101
    基础上添加基于通道域的 SE 模块后，ResNet101-SE 的精确率和召回率分别提高了 4.94% 和 2.45%，AUC 提高到 0.93，在所有测试的
    CNN 特征网络中表现最佳。因此，采用 ResNet101-SE 提取水稻特征。


    ### 3.2 含或不含时间序列的模型


    为评估时序和非时序模型的诊断效果，我们在不同生长阶段的两个水稻品种上测试了 ResNet101-SE 和 ResNet101-SE-LSTM 模型。诊断结果如表
    4 所示。ResNet101-SE 在 TS 时期诊断 N 和 K 水平时的准确率、精确率和召回率均低于 60%。当使用 ResNet101-SE 诊断 EPIS
    时期的 N 和 K 水平时，这些评估数值提高到 70% 以上。ResNet101-SE-LSTM 模型在诊断 INS 和 EPIS 时期的 N 和 K 水平时表现良好。在诊断
    HHZ 和 XS134 品种 INS 时期的 N 和 K 水平时，ResNet101-SE-LSTM 模型的准确率比同期非时序模型高出 10% 以上，且该模型在
    EPIS 时期诊断两个水稻品种 N 和 K 水平的 F1 分数均超过 85%，这表明将 ResNet101 模型与长短期记忆模型相结合有助于提高模型识别能力。


    植物在不同生长阶段对营养胁迫的反应不同，其表型特征具有动态性。因此，单一生长阶段无法反映植物的整体生长状态。此外，确定营养水平诊断的最佳生长阶段或为不同生长阶段开发单独模型是一项艰巨的任务，并且未必能为施肥决策提供可靠结果。传统深度学习分类器仅提取当前阶段的信息，无法学习不同生长阶段水稻数据之间的依赖关系，导致预测能力较低（表
    4）。另一方面，LSTM 是一种由自循环单元组成的循环神经网络，允许信息在内部传输，因此更适合处理多时序数据。


    为 HHZ 和 XS134 生成了 ResNet101-SE-LSTM 的混淆矩阵，以证明我们提出的框架可以区分不同的营养水平（见图 6）。ResNet101-SE-LSTM
    在常规 *indica*（指示型）稻（HHZ）（图 6-A）和常规 *japonica*（粳型）稻（XS134）（图 6-B）中均表现出优异性能，能够有效诊断不同
    N 和 K 相互作用处理后的 16 种营养水平。在 HHZ 测试中，N0K0、N0K1、N0K2 和 N0K3 存在一定的相互误判，其准确率分别为 72.00%、80.00%、84.00%
    和 86.00%。在 XS134 测试中，N1K0、N1K1、N1K2 和 N1K3 存在一定的误判，其准确率分别为 76.00%、80.00%、84.00%
    和 88.00%。在这些组合中，N1K0 和 N1K1 的误判最为严重，但大多数误分类发生在同一 N 水平下的不同 K 处理之间。总之，N 对水稻综合生长的影响显著高于
    K。


    ### 3.3 模型泛化能力


    为测试我们提出模型的泛化能力，该模型在 2021 年数据集上训练，并使用 2022 年数据集进行评估。结果表明，HHZ 的准确率和精确率均高于 81.00%，XS
    的准确率和精确率均高于 82.00%（表 5）。这些结果表明该模型具有优异的泛化能力。在复杂的水田环境中，我们的先进框架能够从处理后的图像中提取水稻群体结构、叶片形态及其动态变化，以准确诊断植物营养水平。所有这些过程均由深度学习自动完成，无需任何人工干预，为水稻营养水平的智能监测提供了极大便利。


    ### 3.4 机器学习与深度学习模型的比较


    为进一步探讨深度特征对水稻营养水平诊断的贡献，我们基于水稻生理数据训练了 SVM 和随机森林模型，对 EPIS 时期的水稻营养水平进行分类和识别。表 6 显示了这两种模型在识别两个水稻品种营养水平方面的结果。SVM
    模型的准确率通常高于随机森林模型，HHZ 和 XS134 的识别准确率分别达到 86.00% 和 81.00%。同时，我们提出的模型在 HHZ 中的准确率和精确率分别为
    85.88% 和 86.12%，在 XS134 中分别为 88.38% 和 88.70%（表 4）。这些结果表明，ResNet101-SE-LSTM 模型的营养水平诊断效果与基于水稻生理特征的
    SVM 模型一致，但需牢记，机器学习方法需要许多繁琐的操作和破坏性取样，而我们的方法可以大幅降低人工成本。


    ## 4 讨论


    ### 4.1 基于单时间点和多时序作物图像分析的营养诊断


    卷积神经网络对单时间点作物图像进行营养诊断的近期研究已取得一些进展（Condori 等，2017；Tran 等，2019；Wu 等，2020；Xiong 等，2020；Yao
    等，2021）。例如，Wu 等人（2020）在特定时间采集了彩色图像和五通道多光谱数据，并训练模型识别玉米营养状态。结果表明，基于彩色图像和多光谱数据的识别准确率分别为
    84.7% 和 90.5%，能够在不破坏玉米植株的情况下快速提供玉米作物的营养状态。Tran 等人（2019）提出了一种方法，将统计集成平均法应用于 Inception-ResNet
    v2 和自编码器模型，在温室条件下实现了番茄植株生长图像营养诊断 91% 的准确率。


    上述所有研究均关注作物生长期间的单一关键时间节点，关键时间节点的选择容易通过研究经验或现场视觉观察获得。然而，不同类型的营养缺乏症状在作物不同生长阶段可能相似，且作物植株的营养缺乏症状在所选时间节点可能并不明显（Vitosuek
    等，2009）。事实上，营养胁迫引起的表型可在作物整个生长动态期间出现，因此表型分析应考虑时间序列数据。尽管神经网络在诊断作物营养缺乏方面表现良好，但其与时间序列分析模型（如
    LSTM）相结合将更符合实际。LSTM 已应用于处理时间序列数据集，如情绪识别（Son，2017）和疾病预测（Dua 等，2020）。此外，在实验室条件下，Taghavi
    Namin 等人（2018）通过 LSTM 研究了植物生长和动态信息，并将这些特征作为拟南芥营养分类的重要差异表型，实现了 93% 的分类准确率。这是第一次


