    After the images for the different rice growth stages were collected by the UAV,
    rice plants were sampled from each plot. The plant height was measured and tiller
    number was counted manually. Then the samples were separated into green leaf blades,
    dead leaf blades and culms plus leaf sheaths, and the samples were oven-dried
    at 80°C for more than 72 hours before the dry weights of the constituent organs
    were determined. The leaf area index (LAI) was measured with a leaf area meter
