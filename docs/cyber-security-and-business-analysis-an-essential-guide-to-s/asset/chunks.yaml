- raw: 'A narrative about a farmer on a windy sea coast underscored the importance
    of preparedness, proactive planning and a well-defined incident management and
    business continuity strategy. The story demonstrated that incidents are inevitable,
    just like the winds, and organisations should focus on learning from incidents
    and improving their cyber security posture to emerge stronger.


    CHAPTER 9 SUMMARY


    [Chapter 9](#22_ch09.xhtml) focused on the cyber security business case and cyber
    security policy within the broader Business Analysis and Cyber Security Framework,
    serving as guardians of cyber resilience for organisations.


    The chapter began by describing the importance of a ‘good’ business case that
    effectively answers the question ‘What’s in it for the decision-maker?’


    The cyber security business case was highlighted as a strategic blueprint for
    cyber security investments. Business analyst support in crafting a compelling
    business case was discussed, along with the six foundational principles proposed
    by Christian Hyatt for engaging executive decision-makers and insights from Daniel
    Desruisseaux’s blog on the challenges of creating a cyber security business case,
    defining the three critical elements for financial analysis.


    The chapter drew parallels between negotiation skills and a toddler’s protective
    stance, showcasing the importance of effective negotiation when presenting cyber
    security business cases to decision-makers. Negotiation was portrayed not just
    as a communication tool but a complex skill involving effective communication,
    active listening, understanding the interests of all parties involved and a strategic
    approach to conveying the significance of cyber security investments.


    Transitioning from the business case, the chapter focused on formulating cyber
    security policies. These policies were described as guiding principles shaping
    an organisation’s approach to security. Standard components found in many cyber
    security policies were outlined, and the role of business analysts in supporting
    the development, implementation and adherence to these policies was summarised.


    The chapter concluded by reinforcing the dual nature of the cyber security business
    case and policy, which are capable of standing alone or seamlessly integrating
    into the overall framework. It highlighted the symbiotic relationship between
    strategic planning and operational implementation, offering you flexibility in
    choosing your entry point based on strategic decision-making or tactical implementation
    needs.


    BRINGING IT ALL TOGETHER


    The elements of this framework are versatile, allowing for their adaptable deployment,
    whether as individual components tailored to an organisation’s and project’s unique
    requirements or collectively to construct secure and resilient systems. Incorporating
    cyber security components not only furnishes a foundational backdrop but also
    provides guidance on how business analysts can effectively contribute to each
    element.


    **Figure 10.1 Business Analysis and Cyber Security Framework with ethics** (Copyright:
    I-Perceptions Consulting Ltd)


    ![](images/Fig10-1.jpg)


    Like the foundational mindset, ethics serve as the cornerstone in shaping the
    application and integration of these components, without which no other facets
    of the framework can effectively operate or be precisely executed ([Figure 10.1](#23_ch10.xhtml#fig10-1)).
    Ethics intertwine with each facet like an invisible thread, directing not just
    the technicalities but also fostering the framework that upholds principles and
    values, paving the way for conscientious and responsible practices within business
    analysis and cyber security.


    WHAT ARE ETHICS?


    Ethics refer to the branch of philosophy that deals with the principles of morality
    and the concept of right and wrong. It involves the study and application of values,
    principles and guidelines that govern human behaviour in various contexts.^([5](#23_ch10.xhtml#fn_5))


    Ethical considerations guide individuals and groups in making decisions and taking
    actions that are morally sound, fair and socially responsible. Ethical standards
    provide a framework for responsible conduct and ensure that choices align with
    accepted principles of fairness, integrity and respect for others. Ethical behaviour
    involves a conscious effort to consider the impact of one’s actions on individuals
    and society as a whole.


    Ethical ignorance is not a bliss


    In a world increasingly shaped by complex moral dilemmas and intricate decision-making,
    the significance of ethical awareness cannot be overstated. Ethical ignorance
    cannot be a bliss, turning a blind eye to ethical considerations is not a pathway
    to take. Instead, it emphasises the imperative of acknowledging, understanding
    and actively addressing ethical dimensions.


    As mentioned in [Chapter 3](#16_ch03.xhtml), the Facebook ‘Like’ button was initially
    intended to share positivity. However, the social impacts span much more broadly,
    and researchers are uncovering the psychological effects that social media interactions
    can have on well-being.


    Jan Fox, in his article ‘An unlikeable truth’ (Fox, 2018), raises concerns about
    psychological manipulation and emotional exploitation. The deliberate design to
    make these features addictive, likened to ‘behavioural cocaine’, raises ethical
    questions about the responsibility of social media platforms in shaping user behaviours
    for their benefit. The potential for addiction, stress-inducing behaviours and
    the impact on mental health, especially among younger generations, highlights
    ethical considerations related to user well-being and the duty of platforms to
    prioritise user welfare over engagement metrics.


    The ease with which these buttons facilitate emotional expression may contribute
    to a culture where users prioritise quick, emotional reactions over thoughtful
    engagement. Ethical concerns arise as these platforms influence attitudes, perceptions
    and societal norms, potentially contributing to the spread of misinformation.


    Furthermore, the psychological impact of seeking social validation through likes
    and reactions prompts ethical discussions about the platform’s role in manipulating
    users’ emotional states for prolonged engagement. Emphasising emotional responses
    over reasoned discourse may lead to ethical lapses in critical thinking, accountability
    and responsible information-sharing.


    Ethical concerns


    Both Albert Einstein and J. Robert Oppenheimer, key figures in the development
    of the atomic bomb during the Second World War, expressed regret and ethical concerns
    regarding their involvement in the project. Einstein, while not directly part
    of the Manhattan Project, regretted signing a letter urging President Roosevelt
    to pursue atomic research and later expressed remorse for the bombings of Hiroshima
    and Nagasaki (Philipson, 2024). Oppenheimer, the project’s scientific director,
    grappled with the ethical implications of creating a weapon with devastating consequences,
    and, after witnessing the destructive power of the bomb, famously quoted the Bhagavad
    Gita, ‘Now, I become Death, the destroyer of worlds’, conveying the weight of
    his ethical dilemma (Nolan, 2023).


    Their regret underscores the deep ethical considerations associated with scientific
    advancements, especially those with destructive potential. The complex feelings
    of both Einstein and Oppenheimer emphasise that ethical considerations cannot
    be ignored or compromised in the pursuit of scientific progress. Their experiences
    serve as a cautionary tale, highlighting the lasting moral responsibility that
    accompanies decisions with far-reaching consequences. The ethical dimensions of
    scientific endeavours must be carefully weighed and acknowledged to prevent unforeseen
    harm and ensure the responsible use of knowledge and technology.


    CODE OF CONDUCT'
