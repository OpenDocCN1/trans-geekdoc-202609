- raw: 'Due to incomplete analysis, the required due diligence for the machine’s security,
    implementation and usage is not ensured. As a result, the solution to install
    the new fancy machine to ease farmers’ lives fails, and once again the root cause
    remains unresolved.


    The scenarios presented above provide valuable opportunities for introspection,
    encouraging us to revisit our past projects or situations where desired outcomes
    weren’t met. It prompts us to consider what factors might have led to this shortfall.
    Did we accept the problem at face value without delving deeper into its underlying
    causes? Was there an assumption that someone else bore the responsibility? Reflecting
    on these questions offers insights into areas for improvement and enables us to
    refine our problem-solving approaches for the future.


    A business analyst is responsible for delivering a complete analysis to resolve
    the problem successfully.


    ![Icon: Head with gears facing left.](images/icon1.jpg)


    REFLECTION TIME


    Take a moment, ponder and write down:


    • What were the reasons and assumptions that may have contributed to falling short
    or led to not achieving the desired end goal in any of your projects?


    CLARITY ON ROLE AND RESPONSIBILITY DEFINITIONS


    Continuing to explore the essence of business analysis further, it is essential
    to explore the definitions of role and responsibility in an organisational context.
    There are several titles for business analyst roles and the responsibilities vary
    within those roles, just like no two projects are usually the same or similar,
    even within the same domain or organisation.


    A role is essentially a label assigned to a position, outlining a set of expected
    activities. On the other hand, responsibility entails taking ownership of executing
    those activities successfully, meeting expectations. While a role is more of a
    static designation, responsibility is dynamic, an experience of fulfilling those
    duties successfully. The manifestation of a role relies solely on action, and
    it’s the execution of these actions that defines one’s responsibility.


    It is imperative to understand this distinction because business analysis is a
    responsibility. It requires all human faculties to be involved. It is not a monotonous
    and mundane activity, but a conscious undertaking. One has to bring physical,
    mental and emotional faculties to perform business analysis to deliver a complete
    analysis. Every business analyst must have this clarity regardless of their role
    and title.


    WHAT DOES YOUR PROFESSION MEAN TO YOU?


    What I have found for myself is that business analysis is more than a definition.
    Along with the acquired skills, techniques and tools from a business analyst toolkit
    to solve a problem, I reflect on the problem that I am addressing, and most times
    I have found the solution options emerging from within.


    A role can be manifested only through action. And how that action is performed
    determines ‘responsibility’.


    Along with the tangible work that business analysts deliver, I find this profession
    teases one’s curiosity and the desire to learn something new on every project.
    The new learning and experience bring inner satisfaction for the change made towards
    something new and creating a positive impact towards the end goal.


    In her Facebook post ‘Hobby, Job, Career, Vocation’, Elizabeth Gilbert brings
    clarity to these four terms, which are often used interchangeably with different
    connotations. They are four different words and mean four different things (Gilbert,
    2016).


    On hobby


    A hobby is something that is done for pleasure. The most important thing is that
    the stakes with a hobby are low, and the hobby rarely affects those around the
    individual. It’s just done for the joy of that thing. It’s not required, but nice
    to have.


    On job


    According to Elizabeth, at least for most people, you must have a job to pay the
    bills in the materialistic world. The great thing about a job is that it doesn’t
    have to be excellent. It doesn’t have to fulfil you. It doesn’t have to be joyful.
    It just has to pay. It is the exchange of your services for money.


    On career


    Elizabeth explains that a career is a job you are passionate about and love. A
    career is something you are willing to make sacrifices for. You are willing to
    work extra hours. You are willing to put your life on hold for this thing because
    you believe in the mission of your career. You should love your career or not
    have one.


    On vocation


    She elaborates on vocation as a calling, a divine invitation. A vocation is the
    voice of the universe in your ear saying, ‘We want you to do this thing, use your
    talents and gifts and make this thing.’


    She further cites that the term vocation originates from Latin – a calling to
    be called. A vocation is the highest possible pursuit you can do. A career could
    end, but a vocation need not. So what does business analysis mean to you?


    ![Icon: Head with gears facing right.](images/icon.jpg)


    REFLECTION TIME


    Take a moment, ponder and write down:


    • What is business analysis for you? Is it a job, career or vocation?


    • Is it a conscious, informed decision to be an analyst?


    • Why do you want to be an analyst?


    PERSPECTIVES ON BUSINESS ANALYSIS ACTIVITIES


    Delving deeper into unravelling the essence of business analysis, cultivating
    the right perspective and attitude is absolutely paramount. Do you know the story
    of the three bricklayers?


    In his book, *What Can A Man Believe?*, Bruce Barton (1927), cites this story.
    After the great fire set London ablaze, the world-famous architect Christopher
    Wren was commissioned to rebuild St Paul’s cathedral. The parable states that
    Christopher witnessed three bricklayers with three different attitudes while building
    the cathedral.


    He went to the first bricklayer and asked: ‘What are you doing?’ The bricklayer
    grumpily responded: ‘I am a bricklayer. I lay bricks, working hard to feed my
    family.’


    He then went to the second bricklayer and asked the same question. The second
    bricklayer answered: ‘I am a builder. I am building a wall.’


    When the same question was put to the third bricklayer, he beamed with a big smile
    and passion for what he was doing. He enthusiastically replied: ‘I am a cathedral
    builder. I am helping Christopher Wren to build this great cathedral.’


    The same activity but whole different mindsets. The perspectives in this parable
    are insightful to everyone, especially business analysts. Business analysts cannot
    perform like the first or the second bricklayer. The work demands them to be no
    less than the third bricklayer.


    RIGHT PLACE? RIGHT REASON? RIGHT ATTITUDE?


    Are you in the right place, for the right reasons and with the right attitude.
    I have asked several people from generations different from my own about their
    reason for choosing their careers. In most cases, I received a similar response:
    to support their family, build their dream, buy their expensive toy and so on.
    Only a few responded for the love of that work.


    That handful of people chose their profession out of sheer passion for the work,
    driven by the desire to make a difference. While we all have personal lives to
    nurture, dreams to pursue and joys to relish without guilt, it’s essential to
    ensure that the work occupying most of our day receives the attention it warrants.
    Neglecting this can compromise the quality of our output. Regardless of the nature
    of one’s job, clarity regarding the responsibilities attached to it is vital for
    successful execution, just like the third bricklayer.


    Now, whether you’ve deliberately pursued the path of a business analyst or stumbled
    into the role by chance, it’s crucial to reflect on your journey. Regardless of
    how you arrived here, dedicating your full attention to the role is paramount.'
