  fmt: '

    When you undertake a certain task or make a choice, you are also accepting the
    associated responsibilities and challenges that come with it.


    While technological advancements bring efficiency and convenience, they concurrently
    expose businesses to the risks of cyber threats. Organisations must recognise
    that safeguarding their enterprise against cyber threats is an integral part of
    the business endeavour in the digital age.


    ## Storytime: Where to tap


    One day a large factory came to a standstill when one of its boilers failed to
    work. Despite the efforts of the best engineers and mechanics, they couldn’t figure
    out a solution to fix it. Exhausting all the options, the management called an
    old, retired boilermaker who was known for his exceptional skills and experience.


    The old boilermaker arrived, intently listened to the problem, asked a few questions,
    looked at the troubled boiler, listened to it and then pulled out a small hammer
    from his toolbox. He tapped a specific spot on the boiler gently and, as he did
    that, to everyone’s amazement the boiler started working perfectly again.


    The old man then handed over an invoice of £1000 to the management. The management
    was outraged and perplexed at the invoice amount, as it had taken less than 15
    minutes to fix it and all the boilerman did was tap with a hammer, and they requested
    an itemised bill. The boilermaker provided the details, which read:


    • Tapping with a hammer: £10.

    • Knowing where to tap: £990.


    Many years back I heard this story (and the different versions); it was used to
    emphasise the experience and the know-how of business analysts, which is more
    important than the skill itself. It’s a classic tale used to illustrate the importance
    of experience, expertise and intuition in problem-solving.


    The old boilermaker didn’t spend hours, as he relied on his years of experience
    to pinpoint the exact spot that needed attention. In business analysis, too, a
    skilled analyst with experience can swiftly identify issues or inefficiencies
    within business processes, systems or strategies.


    They leverage their intuition and expertise to understand the complexities of
    a business, foresee potential challenges, identify strategic opportunities and
    propose effective solutions more efficiently, drawing from their knowledge of
    industry best practices and understanding of the specific business context.


    It is practical wisdom, the ability to apply knowledge and experience judiciously,
    adapting analytical techniques to the specific needs and challenges of a given
    situation.


    ## RIGHT TOOLS FOR THE RIGHT JOB


    Business analysis has a myriad of tools and techniques, and using the right tool
    to address the right problem or the given situation is equally crucial for the
    success of the initiative.


    The IIBA’s BABOK v3 lists more than 50 techniques, and the third edition of the
    book *Business Analysis Techniques*, by James Cadle, Debra Paul, Jonathan Hunsley,
    Adrian Reed, David Beckham and Paul Turner (Cadle et al., 2021), lists 123 techniques.


    Nevertheless, each technique brings its unique focus, strengths and weaknesses,
    and the effectiveness of these tools is intricately tied to the organisational
    context, the specific project phase and the business analyst’s individual experience
    and comfort level.


    The art of business analysis lies not only in understanding the diverse toolbox
    but also in the judicious selection of the most fitting tool or even parts of
    different techniques to make a new technique that may suit a specific situation
    for addressing the specific nuances of a given problem. Therefore, the adept business
    analyst is empowered to tailor their approach, recognising that the optimal choice
    of technique is a dynamic decision influenced by the intricacies of each unique
    circumstance.


    While different project development methodologies can have variations in their
    phases, for the purpose of highlighting the techniques, the phases are broadly
    categorised into strategy analysis, design, development and testing phases. The
    following sections of this chapter provide an overview of the phases, outlining
    typical business analysis activities and a technique that is commonly used with
    cyber security extension.


    ## Strategy analysis phase


    The strategy analysis phase of a project lays the foundation in defining the overall
    direction of the project by understanding the context, setting objectives, defining
    the scope and establishing a strategic plan for successful project delivery.


    Business analysts understand the context of the organisation and the problem being
    addressed by learning about the current state of the organisation, its processes
    and the challenges. They identify and analyse stakeholders who have an impact
    on or interest in the project by assessing their needs, expectations and concerns.


    ### Cyber security extension


    Integrating cyber security considerations into the strategy analysis ensures that
    the project is aware and prepared with strategies to protect its data assets and
    systems. Realising the need for protection of those valuable assets helps in prioritising
    cyber security efforts.


    While business analysts may not be cyber security experts, they can play a crucial
    role in facilitating communication and collaboration between different stakeholders,
    including the cyber security, governance and business teams. They can support
    in:


    • Identifying critical data assets and systems that need protection.

    • Including cyber security stakeholders, during identifying and analysing overall
    project stakeholders.

    • Performing a cyber security risk assessment with the cyber security team to
    identify potential cyber security risks and help to understand the cyber security
    landscape. While cyber security experts may lead the technical aspects of the
    cyber security risk assessments, business analysts can contribute by bridging
    the gap between technical and business perspectives.

    • Helping to identify the strategies for relevant cyber security regulations and
    compliance, as applicable.

    • Collaborating with business and security stakeholders in embedding security
    considerations into the project’s objectives and goals to ensure that cyber security
    is an integral part of the project’s strategic planning.

    • Ensuring the cyber security requirements identified based on the risks and categorisations,
    such as confidentiality, integrity and availability, are integrated into project
    specifications.

    • Developing appropriate risk treatments to protect against identified risks,
    such as access controls, encryption, auditing, network security measures, etc.


    ### Tools and techniques


    A few common techniques used during strategy analysis are Porter’s Five Forces,
    PESTLE, STEEPLE, CATWOE, SWOT, VMOST and others. A couple of these techniques
    are elaborated below along with cyber security extension.


    #### PESTLE


    PESTLE analysis is built upon PEST analysis, a strategic tool for understanding
    market growth or decline, business position, potential and direction for operations.
    PEST was developed by J. Aguilar in 1967 as an environmental framework to scan
    the political, economic, social and technological categories that may affect strategy.
    The variant with ‘legal’ and ‘environmental’ factors, PESTLE, is one of the most
    common business analysis frameworks. It provides a structured approach for evaluating
    external factors impacting an organisation’s performance and decision-making.
    By systematically analysing these factors, organisations gain a holistic view
    of the external environment, can shape their operating environment and adapt strategically
    to changes in the business environment.


    • **Political factors** may include regulatory frameworks, tax policies, trade
    tariffs, political ideologies and political stability. Organisations need to assess
    the impact of political factors to consider the changes that may affect operations
    and the business environment.

    '
