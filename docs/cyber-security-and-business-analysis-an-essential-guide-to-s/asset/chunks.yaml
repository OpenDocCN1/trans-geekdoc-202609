  trans: "\n- 与网络安全利益相关者共同促进需求评审，就影响网络安全需求的功能性需求和非功能性需求达成共识。\n- 建立变更控制流程，包括对网络安全需求的影响评估。\n\
    \n## 策略分析\n策略分析知识领域提供指导，以确保业务分析工作支持组织的整体战略方向。\n如 BABOK v3 所列，策略分析知识领域包括分析当前状态、定义未来状态、评估风险和定义变更策略任务。将网络安全与组织目标保持一致对于保护数据资产和敏感信息至关重要。\n\
    \n### 网络安全扩展\n#### 先决条件\n理解组织整体业务战略中的网络安全目标、网络安全态势、关注点、风险、当前措施、漏洞和威胁态势。认识到网络安全事件对业务需求和组织可能产生的潜在影响。\n\
    \n#### 活动\n- 在评估当前状态时考虑网络安全因素，例如安全态势、能力和漏洞。\n- 在当前业务流程和系统上促进风险评估，并考虑安全因素。\n- 评估在当前业务流程和系统中实施的现有网络安全控制措施的有效性。\n\
    - 在未来状态的整体业务目标和目标中定义网络安全目标和目标。\n- 识别并评估与拟议业务变更和向未来状态过渡相关的网络安全风险。\n- 定义变更策略时考虑网络安全因素，例如韧性和组织文化。\n\
    \n## 需求分析和设计定义\n需求分析和设计定义知识领域侧重于分析需求和设计解决方案所涉及的流程和活动，通过将业务需求转化为可实施的明确解决方案。\n如\
    \ BABOK v3 所述，需求分析和设计定义知识领域包括规范和建模需求、验证需求、确认需求、定义需求架构、定义解决方案选项、分析潜在价值和推荐解决方案。网络安全扩展确保解决方案满足业务需求并纳入抵御网络威胁的措施。\n\
    \n### 网络安全扩展\n#### 先决条件\n理解组织整体业务战略中的网络安全目标、网络安全态势、关注点、风险、当前措施、漏洞和威胁态势。认识到网络安全事件对业务需求和组织可能产生的潜在影响。\n\
    \n#### 活动\n- 创建包含业务流程中网络安全控制的视觉模型。\n- 在整体功能需求中创建详细的网络安全需求。\n- 创建误用案例以及用例。\n- 将“坏”行为者作为用户角色的一部分创建。\n\
    - 创建易受攻击的场景以及正常和替代场景。\n- 确保网络安全假设和约束是整体项目假设和约束的一部分，并传达给利益相关者，包括网络安全。\n- 验证网络安全需求是否符合相关法规和标准。\n\
    - 由相关网络安全利益相关者确认网络安全需求，以确保需求将导致具有韧性的解决方案。\n- 记录网络安全设计决策背后的理由以及所有评估过的选项。\n- 识别并记录过渡流程的任何临时网络安全需求以及解决方案的安全过渡。\n\
    - 定义管理网络安全事件的角色和职责。\n- 记录与组织安全政策一致的事件检测和响应机制。\n- 记录分析并应对新兴网络威胁的流程。\n- 将网络安全纳入持续的分析和设计流程，并在整个开发生命周期中促进功能团队与网络安全专家之间的持续协作。\n\
    \n## 解决方案评估\n解决方案评估知识领域侧重于评估和验证解决方案提供的性能和价值所涉及的流程和活动，以确保已实施的解决方案满足业务需求并为利益相关者提供预期价值和已识别的收益。\n\
    如 BABOK v3 所述，解决方案评估知识领域包括衡量解决方案性能、分析性能指标、评估解决方案局限性、评估企业局限性并推荐提高解决方案价值的行动。网络安全扩展确保评估流程考虑网络安全措施，识别潜在安全风险并验证解决方案有效缓解这些风险。\n\
    \n### 网络安全扩展\n#### 先决条件\n理解组织整体业务战略中的网络安全目标、网络安全态势、关注点、风险、当前措施、漏洞和威胁态势。认识到网络安全事件对业务需求和组织可能产生的潜在影响。\n\
    \n#### 活动\n- 支持安全和技术团队根据安全目标定义网络安全绩效指标和指标。\n- 分析安全事件、漏洞和威胁检测的数据。\n- 支持数据分析团队识别网络安全事件或弱点。\n\
    - 与网络安全利益相关者合作解释安全绩效指标。\n- 使用统计分析从网络安全绩效数据中得出见解，以识别趋势、模式和改进领域。\n- 与网络安全利益相关者合作以：\n\
    \  - 评估系统弱点以及已识别漏洞对解决方案整体安全性的影响；\n  - 考虑威胁态势的变化和新兴网络威胁；\n  - 评估企业级网络安全措施可能对解决方案持续安全性的影响；\n\
    \  - 基于对网络安全局限性和漏洞的分析制定建议；\n  - 优先考虑并实施建议的行动；\n  - 记录拟议变更对解决方案的预期影响；\n  - 收集有关安全措施感知有效性的反馈，以将实现的网络安全收益与安全目标中概述的预期收益进行比较；\n\
    \  - 分析网络安全控制和对策的投资回报率（ROI）。\n- 监控用户对既定安全政策和程序的遵守情况，并识别网络安全最佳实践采用的障碍。\n- 建立定期监控网络安全绩效指标的流程。\n\
    - 分析历史数据以识别安全事件中的趋势或模式，以便就增强网络安全态势做出明智决策。\n- 与网络安全利益相关者合作评估网络安全控制处理日益增加的网络威胁的能力以评估可扩展性。\n"
