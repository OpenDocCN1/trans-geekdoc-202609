- raw: 'Conversely, a cyber security business case takes a targeted approach to address
    and mitigate the specific risks associated with the digital landscape. It extensively
    explores the protection of digital assets, the prevention of security incidents
    and the overall enhancement of the organisation’s security posture. It explicitly
    outlines the costs of implementing cyber security measures, covering expenses
    related to security software, hardware, training programmes and cyber security
    personnel. It emphasises compliance with cyber security regulations, acknowledging
    the legal requirements and potential financial and reputational risks.


    Beyond the tangible costs, the cyber security business case recognises the intangible
    aspects such as brand reputation and customer trust as paramount considerations.
    It spotlights the importance of employee training and awareness campaigns to fortify
    the organisation’s resilience against cyber threats, recognising their intangible
    value to overall cyber security posture.


    Business analyst support


    As consistently mentioned in previous chapters, here again, business analysts
    can support cyber security business cases without being cyber security experts
    by collaborating with security, governance and IT teams. They act as a communication
    bridge, translating complex technical details into understandable language making
    the business case accessible to decision-makers without deep technical knowledge.
    While eliciting requirements, they can ensure that the proposed cyber security
    measures align with organisational needs.


    Business analysts can contribute to risk identification workshops, providing valuable
    input to the risk assessment section of the business case. They also stay informed
    about industry regulations, assisting in aligning proposed cyber security measures
    with regulatory requirements and articulating compliance benefits in the business
    case. By collaborating with financial experts, business analysts can contribute
    to cost–benefit analyses, offering insights into potential benefits related to
    risk reduction, incident prevention and long-term cost savings.


    In addition to their role as liaisons between technical and non-technical stakeholders,
    business analysts can actively contribute to the implementation plan by providing
    insights into dependencies and constraints, ensuring a realistic approach to deploying
    cyber security initiatives.


    In essence, business analysts can help the development of cyber security business
    cases by leveraging their analytical and facilitation skills to align proposed
    measures with organisational objectives.


    EFFECTIVE BUSINESS CASES


    In his article ‘The Business Case: How to Construct a Compelling Argument for
    Security Initiatives’ (2020), Christian Hyatt proposes the six foundational principles
    for effectively engaging executive decision-makers.


    1. **Start with the bottom-line up front (BLUF):** Begin with a concise definition
    of the problem, a clear request from leadership and expected positive business
    outcomes. The BLUF should include an executive problem statement, a clear request
    to leadership and expected benefits.


    2. **Clearly articulate ‘why we need this’:** Define the current programme’s shortcomings
    and the desired future state to explain the necessity of the proposed solution.
    Quantify the problem without blame and provide evidence for assertions in a detailed
    appendix.


    3. **Build a cost–benefit analysis that leaves no doubt:** Develop a cost–benefit
    analysis to validate the request. Summarise costs, outline benefits in terms of
    cost savings or risk management and clearly articulate the ROI. If applicable,
    align the analysis with the organisation’s formal capital project request process.


    4. **Include an appendix with additional detail that anticipates questions:**
    The business case should have an appendix providing detailed supporting information,
    anticipating potential questions from executives. Include researched sources’
    comprehensive details, and acknowledge any downsides to prove the authenticity
    of the business case.


    5. **Validate assumptions and socialise the business case before presentation:**
    Continually validate assumptions by seeking input from other business leaders
    and collaborating with internal stakeholders throughout the process. Socialise
    the business case to build advocates and prevent surprises during formal presentations.


    6. **Move decision-making forward when momentum stalls:** If faced with non-decision
    or hesitation, ask for additional details required for a decision and identify
    factors outside your visibility. Get a commitment on the next steps and follow
    up regularly to prevent deprioritisation (Hyatt, 2020).


    Hyatt asserts that a compelling business case serves several essential functions.
    First, it is a genuine evaluation of a security initiative’s business value, including
    determining if the investment cannot be sufficiently justified. It validates alignment
    with business goals and real problem-solving. The business case must clearly communicate
    and drive timely decision-making on the proposal for non-technical leaders.


    In addition, he also states that the business case is not about politicking for
    personal interests or relying on cyber security fear mongering if underlying business
    merits are lacking. Leaders must ethically serve the organisation’s best interests
    with intellectual honesty – even willingness to disqualify their own proposals
    if inadequate business justification exists. Validation of value and return on
    investment takes priority over self-interest or taking advantage of leadership
    knowledge gaps.


    The business case is not about politicking for personal interests or relying on
    cyber security fear mongering if underlying business merits are lacking.


    Validation of value and return on investment takes priority over self-interest
    or taking advantage of leadership knowledge gaps.


    CHALLENGES WITH CYBER SECURITY BUSINESS CASES


    Business outcomes


    Business outcomes in a business case are articulated through business benefits
    and value. They provide a comprehensive lens through which the success and impact
    of a project can be assessed.


    **Benefits** represent the tangible and measurable improvements a proposed initiative
    is expected to deliver, offering a clear picture of the positive changes in specific
    metrics or outcomes. Benefits can be intangible, too; for example, reduction in
    a risk of reputational damage is intangible and can’t be measured but is still
    a significant benefit.


    **Value** transcends the numerically quantifiable range, encapsulating the broader
    worth and significance of the initiative.


    The complexity arises from the need to identify and quantify tangible outcomes
    (benefits) and capture the broader and often intangible aspects that contribute
    to the overall value of the proposed initiative. However, the complexity in articulating
    benefits and value is heightened in a cyber security business case. Unlike conventional
    business cases, cyber security initiatives often involve intangible security aspects,
    such as risk mitigation, reputation protection and avoiding potential financial
    losses due to cyber threats. These intangibles are challenging to quantify precisely,
    yet they constitute a critical part of the overall value proposition.


    Additionally, conveying the urgency of cyber security measures and the potentially
    catastrophic consequences of neglecting them adds an extra layer of complexity.
    Thus, the cyber security business case demands a delicate balance of tangible
    and intangible elements, requiring a nuanced approach to effectively communicate
    the multifaceted value it brings to the organisation.


    Below are some of these complexities, among others:'
