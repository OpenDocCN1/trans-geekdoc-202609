    ## 6 WHEN YOU PICK UP ONE END OF THE STICK, YOU ALSO PICK UP THE OTHER


    Here’s what you’ll learn from this chapter:


    • Shifting left.


    • Value and protection – the two ends of the stick.


    • Knowing where to tap.


    • Right tools for the right job.


    ‘Shift left’ within the context of cyber security embodies the proactive approach
    of embedding security measures and protocols earlier in the software development
    and IT operations life cycle. This strategic move aims to tackle security vulnerabilities
    and risks at their nascent stages, well before deployment. By doing so, it effectively
    minimises the probability of security breaches and minimises their potential impact.


    In order to address security vulnerabilities and risks at the earlier stages it
    is imperative that cyber security is part of those discussions and is baked alongside
    all other deliverables thoughout the project life cycle.


    This chapter aims to address this by providing pointers to bring relevant cyber
    security conversations to the table at every stage of the project. Every organisational
    context is different and every project is different, hence there is no one-solution-fits-all
    approach to cyber security or security in general. Therefore the pointers provided
    in this chapter should be taken as guidelines to help trigger the security mindset
    and involve security expertise – asking the right questions and at the right time,
    shifting cyber security to the left and not as an afterthought.


    VALUE AND PROTECTION – THE TWO ENDS OF THE STICK


    By now, it is clearly established that anything of value needs to be protected.
    When you pick up one end of the stick, you also pick up the other end. This is
    a metaphorical way of conveying that actions or decisions often come with both
    positive and negative consequences or responsibilities. It suggests that, when
    you undertake a certain task or make a choice, you are also accepting the associated
    responsibilities and challenges that come with it. In essence, it underscores
    the idea that many situations involve a dual nature, and one must be aware of
    the entire scope of an action or decision, not just the immediate benefits or
    advantages. It encourages a holistic and mindful approach to decision-making,
    considering both sides of the metaphorical ‘stick’ before committing to a course
    of action.'
