- raw: 'The negative or reactive approach to security violation, the threat-based
    approach has these three types:


    • **Unauthorised information release** – protecting the confidentiality.


    • **Unauthorised information modification** – protecting the integrity.


    • **Unauthorised denial of use** – protecting the availability.


    While the positive or preventive approach aims to reduce the likelihood of security
    incidents, the negative or detective approach helps to identify and respond to
    incidents that may occur despite preventative measures. A well-balanced information
    security programme incorporates elements of both approaches to provide robust
    protection and incident response capabilities.


    Parkerian Hexad^([1](#16_ch03.xhtml#fn_1))


    The Parkerian Hexad, introduced by Donn B. Parker in 1998, is a framework that
    extends the traditional CIA Triad (confidentiality, integrity and availability)
    to include three additional principles for a more comprehensive model ([Figure
    3.4](#16_ch03.xhtml#fig3-4)). The six principles of the Parkerian Hexad are:


    **Figure 3.4 The CIA Triad and Parkerian Hexad** (Copyright: I-Perceptions Consulting
    Ltd)


    ![](images/Fig3-4.jpg)


    • **Confidentiality** – protecting information from unauthorised access.


    • **Possession** – extends the confidentiality to include who owns and controls
    the data.


    • **Integrity** – protecting information from unauthorised modification.


    • **Authenticity** – extends the integrity in assuring that the source of information
    is authentic and can be verified.


    • **Availability** – protecting information from unauthorised denial of use.


    • **Utility** – extends the availability in ensuring that information remains
    functioning and serving the intended purpose and is not inaccessible.


    ADDITIONAL SECURITY GOALS


    In addition to the CIA Triad and Parkerian Hexad, other security goals contribute
    to a comprehensive and well-rounded approach to information security. These additional
    security goals complement and contribute to a holistic and effective information
    security strategy depending on the organisational context. Some of these, and
    not an exhaustive list, include:


    • **Privacy** – to protect individuals’ personal information (PI) or PII and ensure
    that it is handled appropriately and in compliance with privacy regulations. Data
    anonymisation, encryption and access controls contribute to privacy goals.


    • **Compliance** – to ensure that organisations adhere to relevant law and regulatory
    requirements and industry standards governing the protection of information and
    data, such as compliance with data protection laws, financial regulations and
    industry-specific security standards.


    • **Accountability** – to hold individuals or entities accountable for their actions
    by logging in with their credentials, maintaining an audit log for their actions
    and tracking their activities.


    • **Reliability** – to build dependable systems, networks and robust infrastructure
    to reduce the risk of service interruptions and ensure continuous access to critical
    resources. Reliability is at the periphery regarding security goals and, in most
    cases, delivered within the broader context of availability. Reliability contributes
    to availability by emphasising the consistency and dependability of systems and
    services.


    • **Incident management** – to implement agreed and documented processes and procedures
    for managing and mitigating security incidents. This could encompass pre-empting,
    preparing, responding, reporting, managing and learning from security incidents.


    • **Business continuity plan (BCP)** – the goal of a BCP is to minimise downtime
    and recover quickly from disasters while keeping critical operations going. Disasters
    could include natural, cyber attacks, equipment failures or other unforeseen events.
    A BCP outlines the strategies and procedures to ensure that critical operations
    can continue during and after a disruptive incident.


    Von Solms’s 12 dimensions of information security


    In addition to the security goals, Von Solms’s 12 dimensions of information security
    will help to further widen the information security perspective.


    In addition to his paper titled ‘Information Security’, published in 2001, Professor
    Rossouw Von Solms, a notable figure in the field of information security, made
    significant contributions to the understanding of information security.


    He identifies 12 dimensions of information security that provide a comprehensive
    framework for understanding the various aspects and concerns related to information
    security. The 12 dimensions of information security, as outlined by Von Solms,
    are:


    1. Security policy and strategy – this dimension involves the development of security
    policies and strategies that guide an organisation’s approach to information security.


    2. Information security management – encompasses the overall management of information
    security efforts within an organisation, including the establishment of an information
    security management system (ISMS).


    3. Security organisation – is the structure and organisation of the security function,
    including roles and responsibilities for managing and enforcing security policies.


    4. Asset classification and control – is identifying, classifying and controlling
    access to sensitive information assets within the organisation.


    5. Personnel security – addresses the human factor in security, including background
    checks, training and awareness programmes for employees.


    6. Physical and environmental security – is protecting information systems and
    data by securing physical facilities such as data centres and offices.


    7. Access control – is managing and controlling access to information systems
    and data to prevent unauthorised access.


    8. Systems development and maintenance – is ensuring that security considerations
    are integrated into the entire software development and system maintenance life
    cycle.


    9. Business continuity management – is planning for the continuation of business
    operations in the event of a disruption or disaster, with a focus on information
    security.


    10. Compliance – is ensuring that the organisation complies with relevant laws,
    regulations and standards related to information security.


    11. Incident management – is establishing procedures for detecting, responding
    to and recovering from security incidents and breaches.


    12. Security metrics and information security governance – is measuring the effectiveness
    of security controls, monitoring security performance and establishing a governance
    structure for information security (Von Solms, 2000).


    According to Von Solms, the above dimensions provide a comprehensive framework
    for addressing various aspects of information security to develop a more holistic
    and effective approach to protecting information assets and managing security
    risks.


    Abhishek Narain Singh and M.P. Gupta, in their research article, ‘Information
    Security Management Practices: Case Studies from India’, note that the evolution
    of the information security discipline, as discussed by Von Solms, has developed
    in waves (Singh and Gupta, 2017).


    The first wave was the ‘technical wave’. As the name suggests, it revolved around
    technology to manage information security – the 1980s mainframe era with built-in
    security features such as user-IDs, passwords and access control lists.


    From then to the mid-1990s, with the internet and distributed computing, organisations’
    boundaries becoming blurred led to the second wave, which is the ‘management wave’
    – getting the attention of the senior management, realising the importance of
    information security and thereby introducing security policy and training programmes.'
