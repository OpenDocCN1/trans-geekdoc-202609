- raw: '• **Dynamic threat landscape:** The cyber security landscape is dynamic and
    ever-evolving, making it challenging to accurately predict all potential threats
    and their corresponding impacts. This uncertainty makes it difficult to provide
    precise estimates of the benefits associated with cyber security measures.


    • **Strategic alignment:** Demonstrating how cyber security initiatives align
    with broader organisational strategies and contribute to achieving business objectives
    adds another layer of complexity. Balancing the strategic value of cyber security
    with its immediate, tangible benefits requires a nuanced approach. Cyber security’s
    long-term, overarching strategic value must be considered, along with addressing
    the immediate, tangible benefits that stakeholders, especially decision-makers,
    can understand and appreciate. The long-term factors are enhanced resilience against
    evolving cyber threats, protection of brand reputation and the establishment of
    a robust security posture, while the immediate quantifiable advantages include
    compliance with regulatory standards and safeguarding sensitive data, among others.


    • **Organisational perception:** Convincing stakeholders of the value of cyber
    security measures might be challenging if there’s a perception that these initiatives
    primarily involve costs without clear returns. Overcoming this perception requires
    effectively communicating the long-term value and risk mitigation aspects of cyber
    security.


    • **Complexity and intangibility:** Cyber security outcomes often involve intangible
    elements, such as enhanced resilience against cyber threats or improved data security,
    and the value of these might not be immediately quantifiable in traditional terms.


    • **Difficulty in quantification:** While some cyber security benefits can be
    quantified, such as potential cost savings from avoiding a data breach, others
    are challenging to express in monetary terms. The prevention of reputational damage,
    protection of intellectual property or the assurance of regulatory compliance
    may contribute significant value but are intricate to measure precisely.


    • **Value fluidity:** The dynamic nature of the cyber security landscape, coupled
    with evolving organisational needs and external factors, may influence the perceived
    value. Several factors can contribute to this fluidity, such as emerging threat
    landscape, technological advancements, shifts in the regulatory landscape, transformations
    in the IT infrastructure, etc.


    Continual monitoring, risk assessments and periodic reviews of the cyber security
    strategy are crucial to ensuring that the identified value remains aligned with
    the organisation’s evolving needs and the ever-changing cyber security landscape.
    Regular updates to the business case may be necessary to reflect these changes
    and maintain the relevance and effectiveness of cyber security measures.


    The cyber security business case: an arduous challenge


    Daniel Desruisseaux’s two-part blog, ‘The Cyber Security Business Case: An Arduous
    Challenge’ (2017), states that a typical cyber security business case comprises
    three key elements for financial analysis. First, an estimate of the revenue or
    cost savings a proposed project may generate. Second, the costs to implement the
    project. Third, a formula to calculate the net financial value of the project
    for comparison across potential investments. This allows companies to allocate
    a portion of their limited funds to the proposals projected to serve the company’s
    interests best. Although specific to a domain, it provides an insight into the
    details.


    Creating such a business case for cyber security investments is uniquely challenging.
    Determining the costs requires creating a comprehensive security plan that audits
    the current infrastructure, policies and training to identify needed upgrades
    to reach target security levels. This complex plan has an expensive price tag
    and details the required capital expenditures for security devices, architecture
    changes, etc.


    Estimating the financial benefits of a cyber security project proves even more
    difficult. Quantifying the likelihood and cost impact of prevented cyber attacks
    targeting industrial control systems is arduous, given the lack of publicly available
    data. The network breaches could lead to downtime, intellectual property theft,
    ransom demands or reputation loss – all costly and complex to reliably calculate.


    Experts recommend gathering better financial data by funding a thorough security
    plan focused first on higher risks. Consult peers, vendors and industry events
    to estimate attack likelihood and potential impact costs for vulnerabilities highlighted
    in the plan. However, most cyber security projects still gain approvals even with
    imprecise financial projections because companies recognise the existential downside
    risks outweigh the uncertainty. They see more value in risk mitigation than in
    an elusive detailed cost–benefit analysis (Desruisseaux, 2017).


    THE ART OF NEGOTIATION


    The art of negotiation is a complex and dynamic skill that involves the ability
    to reach mutually beneficial agreements through communication, persuasion and
    adapting accordingly. It is a multifaceted skill involving effective communication,
    active listening and a keen understanding of one’s interests and those of the
    other parties involved.


    Building positive relationships, understanding underlying interests and demonstrating
    emotional intelligence are crucial. Problem-solving skills, patience and perseverance
    contribute to navigating challenges while maintaining a win–win mindset and fostering
    collaboration and ethical considerations to uphold integrity.


    Mastering this skill is an ongoing process that combines interpersonal skills,
    strategic thinking and adaptability to create positive outcomes in various scenarios,
    and that requires reflection, adaptation and a commitment to improvement.


    Business analysts, often acting as mediators between various stakeholders, need
    to employ negotiation skills to reconcile conflicting interests and drive consensus.
    The ability to understand the underlying needs and concerns of different parties,
    coupled with active listening and effective communication, enables business analysts
    to craft solutions that satisfy diverse requirements. Negotiation becomes even
    more crucial when dealing with cyber security business cases. In this context,
    the negotiation process goes beyond aligning business goals and involves convincing
    decision-makers about the imperative nature of cyber security investments.


    Furthermore, the art of negotiation extends to communicating the value proposition
    of cyber security initiatives in terms that resonate with diverse stakeholders.
    Whether emphasising regulatory compliance, safeguarding customer trust or protecting
    brand reputation, effective negotiation skills are indispensable for gaining support
    and resources for cyber security endeavours.


    ![Icon: Head with gears facing left.](images/icon1.jpg)


    REFLECTION TIME


    Take a moment, ponder and write down:


    • Evaluate your current methods for aligning cyber security initiatives with broader
    business objectives. How can you strengthen this alignment to position security
    measures as strategic enablers rather than isolated necessities?


    The negotiator


    My younger son was a handful when he was a little boy. Emulating his elder brother
    all the time, he preferred watching TV programmes for five-year-olds instead of
    baby programmes such as *Teletubbies*. He never wanted me to hold his hand when
    walking, convinced that being a big boy like his brother meant he could manage
    independently. To address this, I explained that I needed his help navigating
    crowded streets so we wouldn’t accidentally bump into people. That worked like
    magic, and from that day, whenever we stepped out, he would look out for his mum
    like a capable big boy.'
