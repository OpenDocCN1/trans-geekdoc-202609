- raw: '**The BCS Code of Conduct**^([6](#23_ch10.xhtml#fn_6)) serves as a foundational
    document outlining the ethical principles and professional standards expected
    of members within BCS, The Chartered Insititute for IT (The British Computer Society).
    It is designed to ensure that professionals in the field of computing uphold the
    highest standards of integrity, competence and accountability in their work.


    By adhering to the four fundamental principles, ‘Professional Integrity’, ‘Competence
    and Professional Development’, ‘ Duty to the Public Interest’ and ‘Professional
    Responsibility’, members of BCS uphold the highest standards in their professional
    practice, thereby promoting trust, integrity and professionalism within the computing
    profession (BCS, 2024).


    **The IIBA Code of Ethical Conduct and Professional Standards**^([7](#23_ch10.xhtml#fn_7))
    is a mandatory set of guidelines applicable to pursuing or holding certifications
    in business analysis and responsibilities to the profession, client and the public.
    It seeks to establish a foundation for ethical business analysis practices, emphasising
    integrity, professionalism and responsible conduct across various dimensions of
    the profession.


    ETHICS IN CYBER SECURITY


    In *The Ethics of Cybersecurity* (Loi and Christen, 2020), Michele Loi and Markus
    Christen provide a comprehensive examination of various ethical frameworks applicable
    to cyber security. It begins with an exploration of two principal frameworks:
    **the principlist approach**, which is significant in cyber security research
    and outlined in the *Menlo Report* (Dittrich and Kenneally, 2011), and **the rights-based
    principle**, especially pertinent within EU law. Both frameworks grapple with
    the inherent probabilistic nature of harms and benefits associated with cyber
    security, necessitating considering risk and probability.


    Loi and Christen delve into the ethics of risk, discussing consequentialist approaches,
    which is an ethical theory that judges the morality of actions based on their
    outcomes or consequences rather than the intrinsic nature of the actions themselves.


    Utilitarianism is a consequentialist ethical theory that evaluates the moral worth
    of actions based on the principle of maximising overall happiness or well-being.
    By applying utilitarian principles in the design and development of electric vehicles,
    manufacturers aim to create products that provide the greatest overall benefit
    to society, considering factors such as environmental impact, affordability, safety
    and convenience.


    The development of antivirus software is another example that demonstrates utilitarianism
    in product development by prioritising the maximisation of overall utility or
    benefit for society through the protection of users, minimisation of harm and
    promotion of trust in combating cybercrime.


    Maximin consequentialism is a variation of consequentialist ethical theory focusing
    on minimising the worst possible outcome or maximising the well-being of the least
    advantaged. By applying maximin consequentialism, automobile manufacturers prioritise
    the development and implementation of safety features such as airbags, seat belts
    and crumple zones that provide the greatest protection in worst-case scenarios.
    Even if these safety features may not enhance the overall driving experience or
    performance of the vehicle, they are considered essential for minimising the maximum
    possible harm in the event of an accident.


    Another example is the end-to-end encryption that ensures messages sent between
    users are encrypted on the sender’s device and can only be decrypted by the intended
    recipient, thereby protecting the confidentiality and integrity of the communication.
    While implementing end-to-end encryption may introduce additional complexity and
    computational overhead, it significantly reduces the risk of unauthorised interception
    or surveillance of sensitive communications, particularly in high-risk environments
    such as those involving political dissidents or journalists.


    Deontological ethics is the theory focusing on the inherent nature of actions
    rather than the consequences they produce. It provides a framework for evaluating
    the morality of actions based on principles of duty, rights and justice, rather
    than solely on their outcomes. Deontological ethical theory could be applied in
    adherence to strict safety standards in the manufacturing of children’s toys by
    investing in high-quality materials, rigorous testing procedures and safety certifications
    to ensure that their toys meet or exceed regulatory safety standards.


    By incorporating end-to-end encryption into messaging applications, organisations
    uphold deontological principles such as respecting users’ autonomy, protecting
    their confidential communications and safeguarding their privacy rights, even
    in the face of potential challenges such as limitations on data analysis or surveillance.


    Loi and Christen also examine the ‘contextual integrity’ approach of Helen Nissenbaum,
    a framework for understanding privacy in the digital age. They then recommend
    a general methodology for the ethical assessment of cyber security technology
    by extending Nissenbaum’s framework to encompass a broader range of social norms
    and expectations related to human interactions within a practice affected by cyber
    security.


    This extended framework includes steps to evaluate prevailing contexts, information
    attributes, changes in societal norms brought by cyber security measures and their
    alignment with socially valuable goals and core values and rights.


    Relevance to business analysis


    Business analysts often deal with sensitive information and collaborate with various
    stakeholders. Upholding ethical standards involves ensuring transparency in communication,
    respecting confidentiality and building trust with stakeholders. This is crucial
    for maintaining positive relationships and fostering a trustworthy business environment.
    With the increasing reliance on data, business analysts must adhere to regulations,
    respect individual privacy rights and implement measures to safeguard sensitive
    information during the analysis process.


    Ethical business analysis emphasises the importance of providing accurate and
    complete information to stakeholders. Business analysts must ensure that decision-makers
    have the necessary data and insights to make informed choices. This aligns with
    ethical principles such as integrity and honesty. It also involves navigating
    potential conflicts of interest and ensuring fairness in decision-making. Business
    analysts should approach their work with impartiality, avoiding bias and considering
    the impact of recommendations on all stakeholders equitably.


    In the era of digital transformation, business analysts often work with advanced
    technologies. Ethical business analysis involves ensuring the responsible and
    ethical use of technology, considering the potential social, economic and environmental
    impacts of technological solutions.


    Ethical business analysis extends beyond immediate stakeholders to consider broader
    societal and environmental impacts. Business analysts should be mindful of the
    moral implications of business decisions on communities, the environment and society.


    Tech ethics


    Raina Kumra, in her ‘Tech Ethics: Avoiding Unintended Consequences’ training (Kumra,
    2020), introduces the ‘Wheel of Misfortune’, identifying eight emerging risks
    crucial for understanding and addressing ethical concerns in technology. Acknowledging
    the personal responsibility of creators and consumers, she urges envisioning future
    scenarios and assessing potential risks. These risk categories, developed in collaboration
    with the Institute for the Future, encompass truth, addiction, economic disparities,
    algorithmic biases, surveillance, data control, trust and criminal actors.'
