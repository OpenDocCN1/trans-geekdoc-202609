  trans: '

    组织正专注于仅仅推出产品并利用快速胜利，这是一种有限的游戏，因此每个产品都有短暂且有限的生命周期。


    市场上存在许多存在漏洞的产品——从灯泡、安防摄像头、鱼缸、电水壶和恒温器到医疗产品。 根据 Cynerio 研究报告（Lauver, 2022）显示，医院遭受的勒索攻击增加了
    123%，勒索软件成本接近 210 亿美元，该报告研究了医院中联网医疗设备安全的当前前景。 一次勒索软件攻击导致医院出现中断，进而导致一名新生儿死亡（Zacharakos,
    2023）。


    选择胜利还是满足，赢得战争还是输掉战斗，作为有限玩家还是作为无限玩家享受过程，这是一场持续的斗争。 在组织和社会中，追求即时满足或为快速胜利走捷径已成为一种被接受的做法，但实际上，生活是一场马拉松，而不是短跑。


    ## 扩张即未来


    Gartner 的研究提出了 2023 年的四个新兴技术和趋势。其中两个涉及网络安全。 “智能世界”——物理和数字体验的融合——以及个人数据收集的“透明度和隐私”（Nguyen,
    2023）。


    McKinsey Digital 表示，人工智能、机器学习、机器人和其他技术的进步使变革速度加快了十倍，他们估计到 2025 年将有 500 亿台设备连接到工业物联网（IIoT）。
    他们强调技术素养已成为每个角色的核心，企业需要准备好应对技术创新的速度和普及（Van Kuiken, 2022）。


    网络安全是每个人的责任。 然而，正如常说的一样，“每个人的责任就是没有人的责任”。


    ## 商务分析师能做什么？


    商务分析师可以（或应该）做什么？ 或者这个问题超出了商务分析的范围？ 关键问题是：谁对网络安全负责？ 这是一个难以回答的问题。


    想象一下，一位顾客走进商店，因地面湿滑而意外摔倒，或因障碍物而绊倒。 在这种情况下，你认为谁对事故负责？ 是清洁工、员工、保安、店长、高层管理等吗？ 在你的家中，谁负责确保门窗或贵重物品的安全？
    现在你对这个话题有了更广阔的视角，请花点时间思考这个问题。 谁对网络安全负责？ 答案或许是，每个人都对网络安全负有责任。 然而，正如常说的一样，“每个人的责任就是没有人的责任”。


    商务分析师非常适合接过接力棒，提出困难但至关重要的问题，并确保网络安全始终处于聚光灯下。 第 1 章强调了商务分析师在共同创建价值链中所承担的责任，而保护该价值链是其责任的内在组成部分。


    在我们讨论商务分析师能做什么之前，必须了解商务分析师角色与网络安全分析师角色之间的区别。 他们处于光谱的两端（图 2.2）。 他们都进行分析，但活跃在不同的领域。
    商务分析师专注于价值主张，而网络安全分析师则专注于保护与 IT 和网络空间相关的所有事物。


    **图 2.2 分析师光谱** (Copyright: I-Perceptions Consulting Ltd)


    ![](img/Fig2-2.jpg)


    商务分析师不必是网络安全专家，而应将分析范围扩展到整体安全。 他们可以根据每个项目的需要与网络安全专家合作，就像他们咨询业务主题专家（SMEs）以深入了解业务一样。
    为此，他们需要具备必要的专业知识，以识别项目交付过程中的安全需求并相应地联系 SMEs（图 2.3）。


    已得到充分证实，安全不能是项目的事后考虑或最后的修补，而必须从项目启动开始就融入解决方案中（图 2.4）。


    **图 2.3 商务分析师网络安全知识概述** (Copyright: I-Perceptions Consulting Ltd)


    ![](img/Fig2-3.jpg)


    **图 2.4 整体分析** (Copyright: I-Perceptions Consulting Ltd)


    ![](img/Fig2-4.jpg)


    ## 关键问题


    • 本章你的主要学习要点是什么？

    • 你将实施的一个教训是什么？

    • 你如何总结你对网络安全的观点？


    # 3 觉醒之旅从这里开始


    本章你将学到以下内容：


    • 网络安全的定义。

    • 商务分析和网络安全框架简介。

    • 如何处理安全问题。

    • 安全目标——CIA 三要素。

    • 安全违规。

    • 额外的安全目标。

    • 业务收益和影响——同一枚硬币的两面。


    ### 什么是网络？


    “网络”一词通常用于指代互联网、数字或虚拟世界，并与与互联网、数字或虚拟世界相关的任何事物连用。 该术语源自希腊语 ‘*kybereo*’，意为引导、操控或控制。
    它在 1948 年变得流行，当时美国数学家 Norbert Wiener 创造了“控制论”一词——使用技术控制和与系统通信的科学研究（Dawkins, 2022）。
    从这个术语中衍生出一系列派生词，用来描述与互联网有关的一切，例如网络安全、网络空间、网络犯罪等。


    ### 什么是安全？


    国家标准与技术研究所将安全定义为“免受危险或威胁的状态” ([`csrc.nist.gov/glossary`](https://csrc.nist.gov/glossary))。
    只有当某物对某人在特定时间具有价值或非常重要时，它才可能处于危险之中或受到威胁。 因此，安全等于为有价值的财产提供的对其所有威胁的保护。


    **安全 = 对价值的保护以对抗威胁**


    在这个等式中，“安全”被等同于在“危险”或“威胁”**存在**下将“保护”**应用**于“价值”的**行动**。 这个等式突出了两个深刻的见解：


    1. 必须采取**行动**来保护有价值的东西。 系统或流程不会自行防御，必须采取行动来保护它们。

    2. 该**行动**只有在危险或威胁被**识别**时才能采取。 当我们不知道对其的危险或威胁时，就无法保护某物。


    **安全 = 对价值的保护以对抗威胁**


    ### 商务分析和网络安全框架


    为了有效应用这一公式，在项目生命周期的每个阶段识别风险、威胁和漏洞的结构化和系统化方法至关重要。 除了本书提供的网络安全知识外，商务分析师还需要一个框架，以便在项目生命周期阶段中无缝地将网络安全分析整合到日常商务分析活动中。


    商务分析和网络安全框架（© 2024 I-Perceptions Consulting Ltd）使商务分析师能够在项目开发阶段全面扩展其分析，以包括网络安全方面。
    本章为框架的开发和建立基本原则奠定了基础，后续章节将逐步阐述该框架，融合商务分析和网络安全要素。

