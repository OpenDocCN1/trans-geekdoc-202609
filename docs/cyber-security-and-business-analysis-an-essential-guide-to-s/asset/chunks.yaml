    surprises’. Business analysts were positioned as instrumental in supporting the
    identification of these surprises and influencing strategic decisions.


    The chapter also addressed bias in risk perception, acknowledging the impact of
    cognitive biases on decision-making. Barriers to effective risk management were
    highlighted, emphasising the need for cultural changes and improved communication.
