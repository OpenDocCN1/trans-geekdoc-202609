- raw: 'Clarity and comprehensiveness of policy documentation are critical for the
    successful implementation of cyber security measures. Business analysts can leverage
    their documentation skills to create policies that are accessible and understandable
    to both technical and non-technical stakeholders. Well-documented policies enhance
    transparency, making it easier for all stakeholders to comprehend and adhere to
    security guidelines.


    From understanding business needs to active involvement in risk assessments and
    effective communication, business analysts can contribute to fortifying an organisation’s
    security posture through a solid cyber security policy.


    ![Icon: Head with gears facing left.](images/icon1.jpg)


    REFLECTION TIME


    Take a moment, ponder and write down:


    • Reflect on your current understanding of cyber security policy and the implications
    for your organisation. What steps would you like to take to better support policy
    development and implementation?


    SUMMARY


    This chapter focused on the two components, cyber security business case and cyber
    security policy, within the broader framework, which are capable of standing alone
    or seamlessly integrating with the overall structure.


    They reinforce the symbiotic relationship between strategic planning and operational
    implementation. The cyber security business case sets the stage for understanding
    why cyber security investments are crucial while aligning with organisational
    objectives, and the cyber security policy provides the necessary guidelines to
    implement these strategies effectively.


    This dual nature allows you to choose your entry point, making the framework adaptable
    to your learning needs. Whether you are focused on strategic decision-making or
    the tactical implementation of cyber security measures, this chapter and the integrated
    framework offer a comprehensive and flexible resource for understanding and navigating
    the complex landscape of cyber security management.


    TAKEAWAY QUESTIONS


    • What are your key learning points in this chapter?


    • What is the one lesson that you’ll implement?


    • How do you aim to contribute towards keeping the cyber security policy active
    and to include cyber elements in the business cases?


    ## 10 THE INNER COMPASS


    Here’s what you’ll learn from this chapter:


    • Bringing it all together.


    • What ethics are.


    • Ethical ignorance and concerns.


    • The IIBA Code of Ethical Conduct.


    • Ethics in cyber security.


    • Sustaining the inner compass.


    This final chapter delves into the critical aspect of ethics within the Business
    Analysis and Cyber Security Framework. Just as mindset serves as the foundation,
    ethics are equally essential. Without ethical considerations, the entire framework
    will be ineffective. Before delving into this crucial aspect, here is a recap
    of the whole framework.


    CHAPTER 1 SUMMARY


    [Chapter 1](#14_ch01.xhtml) explored the fundamentals of business analysis and
    the pivotal role of a business analyst. The exploration began with a clear understanding
    of business analysis and a nuanced exploration of the business analyst’s identity,
    followed by the practical aspects of analysis in action, understanding solution
    options and the far-reaching impacts of incomplete analysis through real-world
    scenarios.


    The chapter emphasised the weight of responsibility that comes with the role of
    a business analyst, underlining the significance of clarity in role and responsibility
    definitions. It challenged you to reflect on the profound meaning the profession
    holds, and encouraged a thoughtful examination of perspectives on various business
    analysis activities.


    Finally, it focused on the importance of clarity in understanding the responsibilities
    of one’s role, drawing parallels with the anecdote of the third bricklayer. It
    encouraged self-reflection, questioning whether you are in the role intentionally
    or by happenstance, emphasising the need to dedicate your full attention to the
    responsibilities of the position. It highlighted the undocumented trust between
    a business analyst and a client, which is built by consistently delivering thorough
    analysis and positioning yourself as a trusted advisor who provides stakeholders
    with the necessary facts and perspectives for informed decision-making.


    The chapter concluded with a thought-provoking question: as a trusted advisor,
    can a business analyst exclude cyber security from their analysis, by assuming
    that technical teams handle all cyber security-related requirements? Asserting
    that non-functional requirements alone do not encompass all cyber security requirements,
    this chapter set the stage for further exploration.


    CHAPTER 2 SUMMARY


    [Chapter 2](#15_ch02.xhtml) explored the varied perceptions of cyber security
    and its significance in different professional roles. The narrative transitioned
    to a personal experience involving a low-priority enhancement project, revealing
    the critical risk overlooked by the organisation. This incident catalysed the
    journey into cyber security.


    The chapter then delved into real-world incidents, such as those involving HMRC
    and TalkTalk, to spotlight the consequences of cyber security lapses, taking a
    step back to consider the evolving technological landscape and the potential vulnerabilities
    arising from global interconnected systems.


    Exploring the analogy of finite and infinite games, inspired by Simon Sinek’s
    insights, the chapter highlighted the clash between short-term gains and long-term
    sustainability. The narrative expanded to address the role of business analysts
    in the cyber security domain, while acknowledging that business analysts need
    not be cyber security experts. The chapter emphasised the importance of integrating
    security into project inception and holistically expanding the analyst’s scope
    to include cyber security. The necessity for foundational cyber security knowledge
    among business analysts was underscored, setting the stage for further exploration
    in subsequent chapters.


    CHAPTER 3 SUMMARY


    [Chapter 3](#16_ch03.xhtml) introduced the Business Analysis and Cyber Security
    Framework, designed to empower business analysts in incorporating cyber security
    aspects throughout project development phases. The chapter explored key concepts
    within the Business Analysis and Cyber Security Framework, beginning with the
    elucidation of the term ‘cyber’, commonly associated with the internet, digital
    or the virtual world. Security, defined as ‘the state of being free from danger
    or threat’, was presented as protection for a valued possession against potential
    threats.


    As the framework’s first building block, the ‘security mindset’ aimed to equip
    business analysts with the awareness and approach necessary to navigate the ever-changing
    landscape of social trends and business needs. Recognising the inevitability of
    technological and procedural changes, the chapter stressed the importance of assessing
    unintended impacts alongside intended ones when proposing solution options.


    The security mindset, presented as a valuable tool in a business analyst’s arsenal,
    was highlighted for its role in discovering unintended impacts and ensuring a
    holistic approach to addressing evolving business requirements.


    CHAPTER 4 SUMMARY


    [Chapter 4](#17_ch04.xhtml) delved into one of the two key pillars, ‘risk analysis’
    within the Business Analysis and Cyber Security Framework. The exploration commenced
    by unravelling the significance of risk within the context of cyber security and
    unfolded with an in-depth exploration of risk management processes, shedding light
    on the integral role of business analysts in this domain.


    The narrative extended into a thought-provoking story about a mousetrap from Manoj
    Vasudevan. Through this narrative, the chapter emphasised the universal responsibility
    for security and the necessity for leaders to anticipate and prepare for risks
    rather than react in panic.'
