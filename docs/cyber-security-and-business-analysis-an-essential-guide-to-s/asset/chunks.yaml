    # 数据管理洞察


    ## 数据作为新货币


    在他的文章《数据是新货币。不要让它从指缝溜走》中，Peter Daisyme 强调了数据在数字时代作为主要货币的至高重要性，超越了其他技术发展。他强调了数据在企业中角色的演变，强调了暗数据中未被挖掘的潜力。虽然承认了对高层数据的普遍关注，他的文章主张采取更全面的方法，强调从一开始就正确处理数据的必要性。包括识别、组织和分析在内的稳健的数据策略至关重要。文章建议利用技术，例如数据可观测性应用，将非结构化数据转化为整个组织中的有价值洞察。培养数据驱动文化被视为至关重要，文章最后概述了公司利用数据作为未来货币力量的步骤，强调承诺、技术采用和以增长为导向的组织文化（Daisyme,
    2023）。


    根据 Alice Nunwick 的文章《分析师称数据将在人工智能时代成为新货币》（Nunwick, 2023），在一次行业更新中，GlobalData 首席分析师
    Natasha Rybak 断言数据将在人工智能时代成为新货币，强调高质量数据集对有效 AI 工具的关键作用。Rybak 认为，旨在最大化其数据价值的企业必须在数据精炼和展示方面做出大量投资，需要大量时间、无阻碍的访问以及遵守法律要求。


    Rybak 深入探讨了 Meta、Walmart 和 Sky 等大型企业所拥有个人数据的法律问题和用例。Sky UK 和 Walmart 都利用个人和行为数据来个性化客户体验。例如，Sky
    UK 的 Search Behaviour 工具能够根据位置和年龄等指标进行精确的受众定位。然而，Rybak 指出潜在的法律挑战，引用了 Meta 因个性化广告而与挪威数据保护机构最近的麻烦。Rybak
    将数据比作实施 AI 的企业中的“未经雕琢的钻石”，这一观点得到了其他人的呼应。国际竞争网络主席 Andreas Bundt 警告称，由于其庞大的数据持有量，AI
    可能会强化“Big Tech”主导地位，可能对较小的 AI 初创公司造成不利影响。旨在利用 AI 的企业必须认识到其数据的价值并应对其使用相关的法律考虑。


    这些文章强调了数据在当代数字环境中的关键作用。Peter Daisyme 的文章将数据作为主要货币重点突出，强调从一开始就正确处理数据的需要采取全面方法，重点关注稳健的数据策略、技术采用以及培养数据驱动的组织文化。Alice
    Nunwick 的文章讨论了数据将在人工智能时代成为新货币，强调高质量数据集对有效 AI 工具的重要性。两篇文章的共同点是对数据作为有价值资产的认可，以及企业需要在不断发展的技术环境中战略性地管理、精炼和保护它们的需要。


    通过业务分析师的视角，其核心在于认识到数据在当今数字环境中的关键作用。最终，与数据和治理团队密切合作的业务分析师应把握数据的中心性，采用整体管理方法，保持对法律影响的关注，并将数据视为对业务韧性至关重要的战略资产。


    ## 数据风险框架


    Sarah Telford 和 Stefaan G. Verhulst 在其文章《理解数据风险的框架》（Telford and Verhulst, 2016）中介绍了评估和管理组织内数据风险的全面框架，该框架是在与哈佛人道主义倡议合作下开发的。该框架为组织提供了在整个数据生命周期内应对和减轻数据风险的结构化方法。


    该框架指导组织通过系统流程，首先进行评估，审查数据生成和共享的背景，包括预期收益和潜在威胁。后续步骤涉及进行详细的数据清单，涵盖存储位置和可访问性。识别潜在风险和危害，例如数据关联或泄露，使员工为各种情况做好准备。框架以实施对策结束，包括制定数据处理政策、实施访问控制以及为员工提供负责任的数据使用培训。对于业务分析师而言，这一系统且全面的框架提供了在组织整个数据生命周期内应对和减轻数据风险的宝贵工具，与其在不断发展的技术环境中战略性地管理、精炼和保护数据的角色相一致。


    ## 大数据灾难


    由 Sean Martin McDonald 在开放社会基金会、福特基金会和媒体民主基金支持下进行的研究，题为《埃博拉：大数据灾难》（McDonald, 2016），探讨了大数据，特别是呼叫详细记录（CDR）数据在人道主义危机中的使用，例如西非的埃博拉疫情。该研究强调了数字人道主义协调的挑战，特别是关于隐私问题及其对人权的影响。McDonald
    关注与隐私和财产相关的法律框架，质疑 CDR 的无监管使用，并强调将数据科学应用于国际发展方面的潜在机遇和风险。该论文提出了关于信息获取、数据共享限制以及在公共利益背景下隐私侵犯比例性的重要法律问题。它强调了围绕紧急响应中数据建模的实验性质进行批判性对话的必要性，以保护人权。该研究为像互联网与社会中心这样的组织提供了宝贵的视角，主张批判性地审视大数据对人权和可持续发展的影响。


    从业务分析师的角度来看，该研究展示了在紧急情况下使用大型数据集的挑战和机遇，提供了关于数据使用的法律框架和隐私考虑的见解。它强调了与人道主义技术实验相关的伦理问题及其对隐私的影响，这对于参与数据驱动项目的业务分析师至关重要。分析使用
    CDR 而未获用户同意相关的风险为从事风险评估和管理的业务分析师提供了信息，特别是在公共卫生或危机响应等领域。了解大数据对人权和可持续发展的影响对于社会责任感的商业实践至关重要，拓宽了分析师对数据使用伦理维度的视角。最后，文章呼吁对紧急响应中数据建模的实验性质进行批判性讨论，敦促业务分析师在其组织内参与关于负责任数据使用及其对人权的潜在影响的对话。


    本质上，这些新兴数据趋势强调了组织采用战略性、伦理性和全面的数据管理方法的必要性。理解并应对与数据相关的挑战和机遇可以成为业务分析师在不断发展的数字环境中角色的重要方面。


    ## 摘要

