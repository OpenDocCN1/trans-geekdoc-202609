    ![Cover: Book titled Cyber security and business analysis, an essential guide
    to secure and robust systems. By Bindu Channaveerappa, with B C S logo at the
    bottom left corner, with image of owls is shown.](images/cover.jpg)


    This book brings to life what cyber security means to business analysts and how
    they should consider this topic in their work. The framework developed throughout
    the book is simple to understand and offers a comprehensive guide. The book contains
    lots of practical advice which is brought to life with relatable and enjoyable
    anecdotes. This is a must for any business analyst wishing to learn more and grow
    their understanding and appreciation of cyber security.


    ***Victoria Banner BA, BSc, CBAP****, Business Architect, Royal London Group*


    Cyber security can be a dry subject. Bindu Channaveerappa has achieved the remarkable
    feat of making it not only interesting but entertaining, by seeing and explaining
    the wider business context in her own unique style.


    ***Nick de Voil MBCS, CITP, CBAP, CCA****, Director, De Voil Consulting, past
    president of IIBA UK, author of ‘User Experience Foundations’*


    *Cyber Security and Business Analysis* is both scary and reassuring – scary because
    I learned so many ways that things can and do go horribly wrong, but also very
    reassuring in the way that Bindu provides practical ways to protect organisations
    through cyber security via business analysis. Reassuring too are Bindu’s stories
    and metaphors peppered throughout the book, drawing on her deep experience and
    bringing light and life to what might otherwise be a challenging topic.


    ***Dr Penny Pullan****, Editor of ‘Business Analysis and Leadership’ and Consultant
    at Making Projects Work Ltd*


    Bindu convincingly raises awareness about the pivotal role BA professionals must
    play in making cyber security a first-class concern. Her highly approachable book
    gets you started by building on what you already know and by providing the tools
    and stories to engage your stakeholders. I have no doubt that Bindu’s book will
    become the de facto starting point for cyber security for many business analysis
    professionals.


    ***Filip Hendrickx****, Founder and Innovating BA, altershape.eu*


    A great book that truly connects the business analysis role to cyber security,
    the BABOK, and provides a framework and tools for business analysts to use to
    assess and evaluate how to ensure cyber security is part of their work and at
    what level.


    ***Angela Wick****, BA-Cube Founder, LinkedIn Learning Instructor*


    This is a vital primer for business analyst seeing to protect organisations from
    the ever-increasing risk of cyber attacks.


    ***Kevin Brennan****, Professor at George Brown College and Business Architect*


    Bindu has delivered a much-needed book that finally puts business analysts at
    the centre of the efforts to solve the complex cyber security challenges faced
    by modern enterprises.


    ***Mark Cross****, Principal Business Analyst, Envista Consulting Ltd*


    Bindu masterfully engages us with a storytelling and metaphors approach that resonates
    deeply, fostering significant shifts in our mindset. This book is an essential
    resource for integrating crucial cyber security awareness within business analysis
    practices. It serves as a definitive guide that can transform the situation for
    organisations at risk by providing the knowledge needed to address current cyber
    security challenges effectively.


    ***Fabricio Laguna****, Senior Advisor for the President and CEO of the International
    Institute of Business Analysis*


    *Cyber Security and Business Analysis* is an essential read for any business analyst
    looking to understand the often dense and seemingly uninviting world of cyber
    security. This book expertly demonstrates how the business analyst role can aid
    in the cyber security process and is often instrumental in ensuring the success
    of cyber security initiatives in a business. If you are just starting to work
    with cyber security or have been working with cyber security for years, this book
    will have something to offer you.


    ***Martin Pendlebury****, Young Business Analysts*


    Every piece of knowledge has to be fundamental, and that is precisely what *Cyber
    Security and Business Analysis* provides the reader. The cyber security framework
    presented in this book allows every business analyst to acquire the right security
    mindset and understand how security intertwines with business analysis’s core
    concepts, knowledge areas and tasks. Practical and exceptional!


    ***Iurii Gomon****, Founder, The Passionate Business Analyst*


    I highly recommend this book to all business analysts. In particular, it frames
    cyber security in terms of business analysis so that as BAs we can easily and
    efficiently include it as part of our usual approach to requirements, discovery
    and elicitation, etc. Cyber security has very few champions outside of technical
    roles and BAs are uniquely placed to add value to this vital element of a business
    – this book really empowers us to be those champions.


    ***Richard Harrison****, Principal Consultant, Herd Consulting*


    *Cyber Security and Business Analysis* is an empowering read, packed with actionable
    knowledge. Whether you’re a seasoned professional or simply starting your cyber
    security journey, this book is invaluable!


    ***Kudzai Muchenje****, Business Analyst, SanlamAllianz*


    **BCS, THE CHARTERED INSTITUTE FOR IT**


    BCS, The Chartered Institute for IT, is committed to making IT good for society.
    We use the power of our network to bring about positive, tangible change. We champion
    the global IT profession and the interests of individuals, engaged in that profession,
    for the benefit of all.


    Exchanging IT expertise and knowledge


    The Institute fosters links between experts from industry, academia and business
    to promote new thinking, education and knowledge sharing.


    Supporting practitioners


    Through continuing professional development and a series of respected IT qualifications,
    the Institute seeks to promote professional practice tuned to the demands of business.
    It provides practical support and information services to its members and volunteer
    communities around the world.


    Setting standards and frameworks


    The Institute collaborates with government, industry and relevant bodies to establish
    good working practices, codes of conduct, skills frameworks and common standards.
    It also offers a range of consultancy services to employers to help them adopt
    best practice.


    Become a member


    Over 70,000 people including students, teachers, professionals and practitioners
    enjoy the benefits of BCS membership. These include access to an international
    community, invitations to a roster of local and national events, career development
    tools and a quarterly thought-leadership magazine. Visit [www.bcs.org](http://www.bcs.org)
    to find out more.


    Further information


    BCS, The Chartered Institute for IT,


    3 Newbridge Square,


    Swindon, SN1 1BY, United Kingdom.


    T +44 (0) 1793 417 417


    (Monday to Friday, 09:00 to 17:00 UK time)


    **[www.bcs.org/contact](http://www.bcs.org/contact)**


    **[http://shop.bcs.org/](http://shop.bcs.org/)**


    **[publishing@bcs.uk](mailto:publishing@bcs.uk)**


    **[www.bcs.org/qualifications-and-certifications/certifications-for-professionals/](http://www.bcs.org/qualifications-and-certifications/certifications-for-professionals/)**


    ![Logo: B C S, the chartered institute for I T.](images/bup.jpg)


    © BCS Learning and Development Ltd 2024


    The right of Bindu Channaveerappa to be identified as author of this work has
    been asserted by them in accordance with sections 77 and 78 of the Copyright,
    Designs and Patents Act 1988.'
