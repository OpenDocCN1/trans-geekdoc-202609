    SUMMARY


    This chapter delved into three critical components: people and personas, incident
    management, and business continuity. It underscored the significance of human
    factors by illustrating real-life incidents and social experiments, acknowledging
    the inevitability of human errors. The chapter also introduced a list of cybersecurity-related
    personas to ensure alignment between cybersecurity strategies, technologies and
    the diverse needs of end users.


    Moreover, it emphasised the role of business analysts in developing misuse cases
    to anticipate how threat actors might intentionally compromise or misuse systems,
    thereby translating threat scenarios into actionable security user stories.


    Transitioning to incident management and business continuity, the chapter employed
    the analogy of bamboo to illustrate the process of building business resilience.
    It stressed the importance of responding gracefully and seamlessly to incidents,
    akin to the flexibility of bamboo in the face of adverse conditions.


    Concluding with the metaphor of a farmer battling harsh winds, the chapter emphasised
    the inevitability of threats in the digital landscape. It urged organisations
    to acknowledge this reality, prepare proactively and emerge stronger by learning
    from incidents to enhance their cyber security posture.


    TAKEAWAY QUESTIONS


    • What are your key learning points in this chapter?


    • What is the one lesson that you’ll implement?


    • How do you keep employees informed about evolving threats?


    ## 9 THE GUARDIANS


    Here’s what you’ll learn from this chapter:


    • A ‘good’ business case.


    • Cyber security business case.


    • Challenges with cyber security business case.


    • Business outcomes.


    • Art of negotiation.


    • Cyber security policy.


    • Components of cyber security policy.


    This chapter will focus on ‘security policy’ and ‘business case’ aspects of the
    Business Analysis and Cyber Security Framework ([Figure 9.1](#22_ch09.xhtml#fig9-1)).


    **Figure 9.1 Business Analysis and Cyber Security Framework with security policy
    and business case** (Copyright: I-Perceptions Consulting Ltd)


    ![](images/Fig9-1.jpg)


    The cyber security business case and the cyber security policy can act as the
    guardians of cyber resilience by collectively shaping and fortifying an organisation’s
    ability to withstand and recover from cyber threats. The cyber security business
    case, when meticulously crafted, serves as the strategic blueprint for cyber security
    investments. The cyber security policy plays a crucial role in setting the guidelines,
    standards and procedures that govern cyber security practices within the organisation.
    It establishes a framework for secure operations, defining the rules for data
    protection, access controls, incident response and other critical aspects of cyber
    security.


    As guardians, they both provide a structured, strategic and proactive approach
    to cyber security through their combined efforts by fortifying the organisation’s
    defences, enabling it to navigate the complex and ever-changing landscape of cyber
    threats with resilience and agility.


    A ‘GOOD’ BUSINESS CASE


    In my early days as a business analyst, I received valuable advice emphasising
    that a truly ‘good’ business case should eloquently answer the pivotal question:
    ‘What’s in it for the decision-maker?’ This guidance underscored the importance
    of crafting a compelling case that clearly outlines the specific benefits and
    advantages the decision-maker stands to gain by approving the proposed project
    or initiative. This perspective prioritises aligning the project with the approver’s
    interests and objectives and recognises the significance of tailoring the narrative
    to resonate with their individual motivations and goals. After all, the organisation’s
    goals are intricately woven into the fabric of individual motivations and aspirations.


    Securing approval for a business case presents numerous challenges, often rooted
    in factors such as unclear objectives, insufficient data and unrealistic expectations.
    In addition, incomplete data and analysis can undermine the credibility of the
    business case, causing hesitation among approvers.


    Furthermore, intangible aspects often involve elements that are challenging to
    quantify or measure directly in financial terms. These can include factors such
    as brand reputation, employee morale, customer satisfaction and organisational
    culture. While these aspects are crucial for overall business success, decision-makers
    may encounter several challenges when evaluating and prioritising them within
    a business case.


    CYBER SECURITY BUSINESS CASE


    Like a standard business case, a typical cyber security business case encompasses
    essential components crucial for justifying and implementing robust security measures
    within an organisation.


    The executive summary and introduction serve as the gateway, briefly presenting
    the current cyber security landscape, organisational vulnerabilities and the proposed
    initiatives. It strategically outlines the objectives and scope, aligning cyber
    security efforts with broader organisational goals. By defining clear outcomes
    and specifying the focus areas, stakeholders comprehensively understand the business
    case’s strategic relevance.


    Further components include a meticulous risk assessment and consideration of legal
    and regulatory compliance, emphasising identifying and mitigating potential threats.


    The costs and budgeting section provides a transparent breakdown of financial
    requirements, enabling decision-makers to assess the feasibility of the proposed
    cyber security enhancements.


    Articulating the anticipated return on investment and benefits reinforces the
    business case’s value proposition, emphasising the positive impact on incident
    reduction, cost savings and organisational reputation. The implementation plan
    and timeline provide a practical roadmap detailing phased deployment strategies
    and key milestones for effective integration.


    The level of understanding of cyber security among business leaders varies, and
    it is essential to tailor communication to bridge potential gaps in knowledge.
    While some leaders may possess a strong grasp of cyber security concepts, others
    might find the technical intricacies challenging. Effective communication becomes
    paramount to securing approval for a cyber security business case. Presenting
    cyber security aspects in a clear, non-technical manner, emphasising the strategic
    relevance and potential business impacts, is crucial.


    Demonstrating how cyber security aligns with overarching business objectives contributes
    to risk management and provides a clear return on investment, enhancing the likelihood
    of approval.


    Presenting real-world case studies and leveraging external cyber security expertise
    further aid in conveying the importance of cyber security measures. Ultimately,
    aligning the narrative with business leaders’ priorities ensures a more informed
    decision-making process and fosters support for cyber security initiatives.


    A conventional business case essentially presents a comprehensive overview of
    a proposed project or initiative. This involves outlining anticipated benefits,
    projecting return on investment and ensuring alignment with the organisation’s
    broader strategic objectives.'
