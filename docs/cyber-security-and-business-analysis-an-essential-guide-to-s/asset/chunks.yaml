- raw: 'Oxygen, the essential element that enables cellular respiration and energy
    production, is analogous to the fundamental role that data plays in fuelling the
    processes and functions of various facets of our daily existence.


    Just as oxygen is integral to the functioning of individual cells, data are essential
    for the operation of various sectors, including finance, healthcare, education
    and commerce. Financial transactions, for instance, are analogous to the respiratory
    exchange at the cellular level. Each transaction represents a flow of data that
    sustains the economic health of the system. Similarly, once recorded in physical
    diaries or photo albums, our memories are now digitised, forming an intricate
    network of personal data that defines our identity and shapes our experiences.


    The analogy extends to the interconnectedness of systems. The respiratory system
    collaborates with other systems to maintain equilibrium in the human body. Likewise,
    data are interwoven into the fabric of our society, interacting with technological,
    economic and social systems to create a complex and interdependent network.


    Much like oxygen, which is vital but requires careful regulation to prevent imbalance
    or toxicity, data must be managed responsibly. Privacy, security and ethical use
    arises, mirroring the importance of maintaining a delicate balance in the body’s
    oxygen levels.


    Data, like the circulatory system, must have mechanisms to protect against contamination
    or infection and require vigilant protection. In the same way that the body’s
    immune system guards against threats, robust cyber security measures and ethical
    data management practices are essential shields for safeguarding data. The analogy
    can also be extended to highlight the importance of maintaining the balance. Just
    as an imbalance in the body’s blood composition can lead to health issues, any
    compromise in the security or ethical use of data can result in adverse consequences.


    In order to harness the power of data for innovation and progress, it becomes
    necessary to recognise their vulnerability and implement stringent measures to
    ensure the reliability and safety of our digital lifeblood.


    TOO MUCH DATA


    Michalis Zinieris, in his insightful article titled ‘Data: A Small Four-Letter
    Word Which Has Grown Exponentially to Such a Big Value’ (Zinieris, n.d.), projects
    a staggering estimate that our global data volume is poised to reach 175 zettabytes
    by 2025. To put this colossal figure into perspective, imagine a stack of Blu-ray
    discs extending to the moon 23 times over. Astonishingly, this is merely the nascent
    stage of data proliferation. Earlier, it was humans who predominantly contributed
    to the generation of data. However, the landscape has radically shifted, with
    machines and sensors generating an unprecedented volume of data, primarily propelled
    by the exponential growth of IoT. This surge in data production poses a formidable
