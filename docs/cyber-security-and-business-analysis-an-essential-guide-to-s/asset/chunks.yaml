- raw: '**Availability** bias is the dependence on information where individuals heavily
    depend on information that is easily accessible or comes to mind readily when
    assessing risks or making decisions. However, by assembling a group of challengers
    with diverse perspectives and backgrounds, this bias can be effectively mitigated.


    **Anchoring** is relying too heavily on a single piece of information offered,
    which is referred to as an ‘anchor’ when assessing a risk or making a decision.
    Redoing the assessment with new reference data and examining the likely outcomes
    to be accurate helps to lessen anchoring bias.


    **Hindsight** is the influence of previous experiences predicting the outcome,
    and the suggestion to avoid this is to capture as much data as possible and construct
    counterfactuals.


    **Groupthink** is the inclination within a group to prioritise consensus over
    critical analysis, often motivated by a desire to avoid conflict. This can lead
    to flawed outcomes that are unanimously agreed upon, even if more preferable and
    plausible alternatives exist but are not unanimously accepted. Creating diverse
    and balanced groups can help counteract the biases inherent in groupthink.


    **Overconfidence** occurs when individuals or groups exhibit excessive confidence
    in their judgements, often leading them to overestimate the likelihood of certain
    events happening or not happening. Employing techniques such as downward counterfactuals
    (imagine scenarios in which outcomes are worse than what actually occurred) and
    premortems (a technique used to anticipate potential failures or problems before
    they occur) can help to mitigate this tendency.


    BARRIERS TO EFFECTIVE RISK MANAGEMENT


    The final aspect to consider for effective risk management is risk barriers. Identifying
    and addressing the barriers is crucial to fostering a proactive and resilient
    approach to uncertainties. Overcoming these challenges often involves a combination
    of cultural changes, improved communication and the allocation of adequate resources
    to support comprehensive risk management practices.


    Below are some common barriers, although not an exhaustive list:


    • Lack of awareness – not recognising the potential impact of risks or underestimating
    the need for a proactive risk management strategy.


    • Communication gaps – lack of clear communication channels results in stakeholders
    not being aware of the identified risks and the corresponding mitigation strategies.


    • Risk-averse culture – organisations resistant to change can impede effective
    risk management.


    • Short-term focus – organisations focused on short-term gains may prioritise
    immediate objectives over long-term risk management strategies.


    • Inadequate information – insufficient or outdated information can result in
    inaccurate risk identification and evaluation, compromising the effectiveness
    of risk management efforts.


    • Overly complex risk management process – risk management processes that are
    too intricate may not be effectively integrated into everyday decision-making
    processes.


    ![Icon: Head with gears facing left.](images/icon1.jpg)


    REFLECTION TIME


    Take a moment, ponder and write down:


    • Can you identify three risks that you would want to assess for risk bias?


    • What are the risk barriers that you are dealing within your organisation?


    • Has your perception towards risk changed? If yes, how has it shifted?


    AI IN RISK MANAGEMENT


    Before concluding this chapter, here is a peek into harnessing AI to further boost
    the risk management process. AI can significantly enhance risk management by providing
    advanced analytics, automation and predictive capabilities.


    AI can perform data analysis with vast amounts of data from various sources to
    identify potential risks and patterns that may not be apparent through traditional
    methods, and can automatically detect anomalies and outliers that may indicate
    emerging risks.


    With predictive analysis using historical data, AI can help to forecast future
    risks and their potential impact, assess the likelihood and severity of risks
    and enable you to prioritise and act on the most critical issues.


    One way AI can be used is to analyse transactional data for fraud detection using
    machine learning (ML) models to analyse transactional data in real time, identifying
    patterns associated with fraudulent activities.


    AI can analyse user behaviour and network activities to detect unusual patterns,
    and provide behavioural analytics that may indicate a cyber security threat. It
    helps in early identification and response to potential cyber risks.


    Robotic process automation (RPA) can streamline routine risk management tasks,
    allowing human resources to focus on more complex analysis and decision-making,
    which improves efficiency and reduces the risk of manual errors in repetitive
    tasks.


    AI can perform scenario analysis by creating simulation models to assess the potential
    impact of various events on the organisation to help them understand the consequences
    of different risk scenarios.


    Real-time monitoring of data streams can alert organisations to potential risks
    and enable them to respond proactively. Combining AI’s analytical capabilities
    with human insights can create a more robust and effective risk management process.


    SUMMARY


    This chapter covered various facets of risk management, distinguishing between
    conscious and unconscious risks and emphasising the importance of recognising
    both through the Mousetrap Way story.


    The definition of risk with emphasis on pre-emptive action, followed by an exploration
    of the risk management process, a cornerstone for maintaining cyber resilience,
    is highlighted as a critical component that requires proactive measures and adaptive
    strategies in response to evolving cyber threats.


    The concept of predictable surprises and the experts’ recommendations underscored
    the significance of foresight in risk management, while discussions on bias in
    risk shed light on how cognitive biases can influence decision-making and highlighted
    some common barriers to effective risk management. The chapter concluded by touching
    on the role of AI in risk management, showcasing its potential to enhance and
    streamline processes for more efficient risk mitigation.


    TAKEAWAY QUESTIONS


    • What are your key learning points in this chapter?


    • What is the one lesson that you’ll implement?


    • How do you summarise your perspectives on an effective risk management process?


