    ## 7 SECURING THE CROWN JEWELS


    Here’s what you’ll learn from this chapter:


    • Data – the lifeblood of modern society.


    • Too much data.


    • Data security vs cyber security.


    • The data states.


    • Approach to data security.


    • Emerging data trends to monitor.


    We have broadened the framework in previous chapters, where the foundational mindset
    and the two pillars of risk analysis and business analysis were established. In
    this chapter, our focus shifts towards the ‘data security’ domain, emphasising
    the imperative of safeguarding the ‘crown jewels’ ([Figure 7.1](#20_ch07.xhtml#fig7-1)).


    **Figure 7.1 Business Analysis and Cyber Security Framework with data security**
    (Copyright: I-Perceptions Consulting Ltd)


    ![](images/Fig7-1.jpg)


    DATA – THE LIFEBLOOD OF MODERN SOCIETY


    When I heard the statement ‘data is the non-depletable oxygen’ (Thoughtspot, 2023)
    from Geraldine Wong, chief data officer (CDO) of GXS Bank, it got me thinking.
    From the words we read, the images we see and the conversations we have, to the
    tactile experiences of touch, everything has seamlessly transformed into data.
    The very fabric of our existence, once confined to the tangible and ephemeral,
    is now intricately intertwined with the intangible threads of information. Each
    interaction, visual, auditory or tactile, leaves a digital footprint, contributing
    to the vast landscape of data that shape our contemporary reality. In this all-encompassing
    data ecosystem, the omnipresence of data has our expressions, observations and
    sensory perceptions converge into a mosaic of information, illustrating the profound
    and inescapable presence of data in every facet of today’s interconnected world.


    Much like oxygen is indispensable for sustaining life in the human body, data
    serve as the lifeblood of our modern, interconnected society. Oxygen, the essential
    element that enables cellular respiration and energy production, is analogous
    to the fundamental role that data play in fuelling the processes and functions
    of various facets of our daily existence.


    In the human body, oxygen is distributed through the bloodstream to every organ,
    ensuring vitality. Similarly, data permeate every aspect of our contemporary lives,
    encompassing financial transactions, personal interactions, work-related activities
    and memories.


    See the respiratory system as a metaphor for the data infrastructure. The respiratory
    system extracts oxygen from the air and expels carbon dioxide, facilitating the
    exchange of gases vital for life. Likewise, our data systems extract valuable
    insights from the vast data storehouses of information, creating a dynamic exchange
    that powers decision-making, innovation and societal development.


    DATA IS THE NON-DEPLETABLE OXYGEN'
