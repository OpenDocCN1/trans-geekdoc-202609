- raw: '• **The tech-savvy professional** – represents users with a strong understanding
    of technology. They may have specific security needs related to their profession
    and prefer advanced security features. For example, an IT consultant who works
    in the IT industry possesses advanced technical knowledge and has specific security
    needs related to consulting services.


    • **The remote worker** – represents individuals who frequently work outside traditional
    office settings, highlighting unique cyber security considerations for this group.
    For example, a remote marketing executive who executes marketing campaigns and
    works remotely requires secure access to company systems from various locations.
    With the rise of remote work, this could be necessary for any individual in the
    organisation.


    • **The busy executive** – represents executives who often have distinct security
    concerns due to their access to sensitive information. This persona helps tailor
    security measures to meet their specific needs and priorities. For example, the
    chief executive officer (CEO) who leads the organisation has access to sensitive
    strategic information and requires robust security measures due to the executive
    role.


    These role examples help to illustrate how personas can be tailored to specific
    professions, reflecting diverse responsibilities and security considerations within
    an organisation. Each persona represents a distinct user type, allowing cyber
    security strategies to address the unique challenges and requirements associated
    with different roles.


    In addition, it is vital to be aware of the personas that could unintentionally
    pose cyber security risks, such as:


    • **The unintentional insider threat** has access to sensitive data but might
    accidentally expose it through improper handling, sharing or storage practices.


    • **The bring-your-own-device** (**BYOD**) **user** who uses personal devices
    for work potentially introduces security risks if these devices are not properly
    secured or monitored.


    • **The social sharer** who shares work-related information on social media without
    realising the potential impact on cyber security and inadvertently leaks sensitive
    details.


    • **The forgetful employee** who may forget the password and write it down, visible
    to everyone, or forget to update passwords or follow secure password practices.


    • **The uninformed executive** who is unaware of the latest cyber security threats
    and best practices and may unintentionally make decisions that compromise security.


    The above personas highlight individuals who, without malicious intent, can inadvertently
    compromise cyber security. However, there could be those with malicious intent
    that the organisation must defend against, so understanding their motivations
    and methods is crucial for developing effective cyber security measures:


    • **The insider threat** is an employee with access privileges intentionally seeking
    to harm the organisation, possibly for personal gain or revenge.


    • **The external hacker** is a cybercriminal, an external threat actor attempting
    to breach the organisation’s systems for financial gain, data theft or other malicious
    purposes.


    • **The nation-state actor** is an operative backed by a nation-state engaging
    in cyber espionage or sabotage for political, economic or military motives.


    • **The script kiddie** is an amateur hacker without deep technical understanding
    using pre-written scripts or tools to exploit vulnerabilities to create chaos
    or simply engage in malicious activities for fun or to seek a thrill.


    • **The cyber extortionist** is a ransomware operator who initiates attacks to
    encrypt or block access to data, demanding payment in exchange for restoring access.


    • **The malicious dark web user** is an illicit marketplace participant who engages
    in the trade of stolen data, exploits or cybercrime services on the dark web.
    The dark web is a part of the internet that is intentionally hidden and inaccessible
    through standard web browsers and requires specific software and configurations
    to access, and it is intentionally designed to provide anonymity to users.


    • **The hacktivist** is an activist hacker who hacks systems to promote a social
    or political agenda, often through defacement or disruption.


    • **The cyber mercenary** is a freelance hacker hired to perform cyber attacks
    on behalf of individuals, organisations or even nation-states.


    Business analysts often create personas as part of their analysis, which are detailed
    representations of fictional characters, each embodying a specific user type or
    stakeholder group. These personas help business analysts to understand the diverse
    needs, goals and behaviours of the end users or stakeholders involved in a project.
    By creating personas, business analysts can ensure that the developed solutions
    align with the expectations and requirements of the target audience.


    In the context of cyber security, personas can be extended to include security-related
    characteristics. Business analysts can define the security personas listed above
    to represent different user roles and their associated security requirements,
    behaviours and potential threats.


    By incorporating security personas into their analysis, business analysts contribute
    to a more comprehensive understanding of the system’s security requirements. This,
    in turn, helps in developing solutions that not only meet functional expectations
    but also address security concerns effectively. Personas serve as valuable tools
    for communication and collaboration among cross-functional teams, ensuring a shared
    understanding of user needs and security considerations throughout the project
    life cycle.


    Mitigating cyber security risks involves addressing both inside and external threat
    actors with tailored access-control measures, such as authorisation and authentication
    protocols, coupled with vigilant monitoring of employee activities through auditing.
    Nurturing a security-conscious culture is equally essential and achievable through
    comprehensive training programmes that educate employees on security protocols.


    These measures collectively help organisations to safeguard against potential
    threats posed by employees, whether intentional or unintentional, thereby fortifying
    their cyber security defences.


    Moreover, effective people management extends to incident response, ensuring organisations
    maintain clear communication channels, well-defined roles and a trained workforce
    capable of swift and effective responses to security incidents – an aspect detailed
    later in this chapter.


    MISUSE CASES


    Along with the personas, business analysts can develop misuse cases in parallel
    with use cases. Misuse cases focus on how threat actors could intentionally compromise
    or misuse the system. While business analysts may not possess deep technical expertise,
    they can actively engage in addressing cyber security concerns through collaboration,
    communication and leveraging available resources. They can extract valuable insights
    into how threat actors might intentionally compromise or misuse the system. Collaborative
    efforts with security professionals enable business analysts to capture misuse
    scenarios that may not be immediately apparent during traditional requirements
    gathering. For instance, a misuse case in an online banking system could be an
    attacker attempting to perform unauthorised transactions by exploiting weak authentication
    mechanisms.


    Business analysts can translate threat scenarios into security user stories. For
    example, in a healthcare application, a security user story might involve encrypting
    sensitive patient data to prevent unauthorised access by malicious insiders. In
    translating technical details into business requirements, they can ensure alignment
    with organisational objectives.'
