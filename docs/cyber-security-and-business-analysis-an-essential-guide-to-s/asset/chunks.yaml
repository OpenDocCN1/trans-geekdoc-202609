- raw: 'Growing up, he consistently used negotiation to get his way. Determined and
    persistent, he would engage in discussions to persuade and negotiate. As a mother,
    I had to adapt, seeking alternative and creative strategies to handle various
    situations. Regardless, one constant was our commitment to discussing and understanding
    each other’s concerns and engaging in negotiation to arrive at mutually agreeable
    solutions. Even now, as a teenager, this approach is continued, as the toys are
    different, but the need remains.


    Drawing parallels from this personal anecdote, the toddler’s understanding of
    the need to secure something, exemplified by his protective stance towards his
    mum, mirrors the importance of negotiation skills in reference to cyber security
    business cases. These skills are pivotal in articulating perspectives effectively
    to decision-makers. It involves comprehending their viewpoints, presenting details
    in a language accessible to them and accentuating the tangible benefits encapsulated
    in the critical question ‘What’s in it for them?’ This analogy demonstrates how
    negotiation is not just a communication tool but a strategic approach to convey
    the significance of cyber security investments in a language that resonates with
    decision-makers, ultimately ensuring mutual understanding and support.


    CYBER SECURITY POLICY


    Transitioning from the business case, this section focuses on formulating cyber
    security policies – the guiding principles that shape an organisation’s approach
    to security.


    Creating and writing a cyber security policy typically involves collaboration
    among various stakeholders within an organisation. The responsibility may fall
    under the purview of the chief information security officer (CISO) or a dedicated
    cyber security team. However, the process often requires input from IT professionals,
    legal experts, compliance officers and other relevant departments.


    The cyber security policy outlines guidelines and measures to safeguard an organisation’s
    information systems and data from potential threats, ensuring information confidentiality,
    integrity and availability. The policy must align with industry regulations, legal
    requirements and the specific needs of the organisation. Therefore, a cross-functional
    team with expertise in cyber security, legal compliance and IT governance is usually
    involved in drafting and maintaining the cyber security policy.


    COMPONENTS OF A CYBER SECURITY POLICY


    A comprehensive cyber security policy typically consists of aspects from [Figure
    2.3](#15_ch02.xhtml#fig2-3), ‘Overview of cyber security knowledge for business
    analysts’, in [Chapter 2](#15_ch02.xhtml). While the specific elements may vary
    based on the organisation’s size, industry and regulatory requirements, the following
    are standard components found in many cyber security policies:


    • Introduction and purpose:


    ■ Overview of the policy’s purpose and importance.


    ■ Explanation of the organisation’s commitment to cyber security.


    • Scope:


    ■ Clearly defines the scope of the policy, specifying which systems, data and
    personnel are covered.


    • Policy governance:


    ■ Identification of responsible parties, such as the CISO or relevant security
    team.


    ■ Roles and responsibilities of key stakeholders in implementing and enforcing
    the policy.


    • Information classification and handling:


    ■ Guidelines for classifying information based on sensitivity.


    ■ Procedures for handling, storing and transmitting different classifications
    of information.


    • Access controls:


    ■ User authentication and authorisation procedures.


    ■ Principle of least privilege to limit access based on job roles.


    • Data encryption:


    ■ Policies related to encrypting data in transit and at rest to protect confidentiality.


    • Incident response and reporting:


    ■ Procedures for reporting security incidents.


    ■ Steps to be taken during and after a security incident, including communication
    protocols.


    • Security awareness and training:


    ■ Requirements for ongoing cyber security training and awareness programmes for
    employees.


    • Physical security:


    ■ Guidelines for securing physical access to facilities and equipment housing
    sensitive information.


    • Network security:


    ■ Best practices for securing network infrastructure.


    • Endpoint security:


    ■ Policies related to securing end-user devices, such as laptops, desktops and
    mobile devices.


    • Patch management:


    ■ Procedures for keeping software, operating systems and applications up-to-date
    with the latest security patches.


    • Vulnerability management:


    ■ Guidelines for identifying, assessing and mitigating vulnerabilities in systems
    and software.


    • Third-party security:


    ■ Security requirements for third-party vendors and partners with access to the
    organisation’s systems or data.


    • Compliance and legal requirements:


    ■ Ensures the policy aligns with relevant industry regulations, standards and
    legal requirements.


    • Audit and monitoring:


    ■ Policies related to ongoing monitoring of security controls and regular audits
    to ensure compliance.


    • Employee responsibilities and code of conduct:


    ■ Expectations of employees regarding their role in maintaining cyber security.


    ■ Code of conduct related to information security.


    • Remote work and BYOD:


    ■ Guidelines for securing remote work environments and personal devices used for
    work.


    • Business continuity and disaster recovery:


    ■ Procedures for ensuring business continuity and recovering from cyber security
    incidents.


    • Documented exceptions and waivers:


    ■ Process for documenting and justifying exceptions to security policies


    The key components ensure that the policy is not just regulatory checkboxes but
    a living document that fosters a culture of security resilience.


    Business analyst support


    Business analysts can play a crucial role in supporting the development, implementation
    and adherence to cyber security policies within an organisation.


    They can be instrumental in translating technical security requirements into solutions
    that align with the broader business objectives. They serve as a crucial link
    between the technical intricacies of cyber security and the overarching goals
    of the organisation. Business analysts can ensure that the cyber security policy
    addresses threats and is tailored to meet the specific needs and strategic direction
    of the business.


    One of the key strengths of business analysts lies in their proficiency in eliciting
    and documenting requirements. In the context of cyber security policies, business
    analysts can collaborate closely with stakeholders to identify and articulate
    specific security needs to help create a foundation for policies that are effective
    in enhancing security posture and well-aligned with the organisational context.


    Active participation in risk assessments is another vital role that business analysts
    can play in the cyber security domain. By collaborating with security experts,
    business analysts can contribute to identifying and evaluating potential risks
    and threats. This involvement ensures that cyber security policies are grounded
    in a thorough understanding of the risks faced by the organisation, allowing for
    a more targeted and effective security strategy.


    Effective communication is a hallmark of business analysts, and this skill is
    particularly valuable when bridging the communication gap between technical security
    teams and business stakeholders. Business analysts facilitate meaningful discussions,
    ensuring that the importance of cyber security policies is communicated clearly.
    By engaging stakeholders in the cyber security dialogue, business analysts contribute
    to a collective understanding of the security landscape and foster a culture of
    security awareness.'
