- raw: 'Kumra proposes a comprehensive checklist to build ethical products considering
    present and future vulnerabilities. Sample questions include addressing bias in
    training data, ensuring understandable terms of service, preparing for data breaches
    and mitigating the spread of misinformation. Customising the checklist involves
    collaborative efforts within the team, identifying relevant questions and incorporating
    them into product design requirements. Accountability is emphasised by assigning
    individuals to run and review the checklist, ensuring a continuous ethical approach,
    even in minor feature updates.


    In the unregulated tech industry, where self-regulation is pivotal, every team
    member’s commitment to ethics becomes crucial. Raina Kumra highlights the need
    for ongoing vigilance and ethical considerations across the organisation, underlining
    the role of self-regulation until formal regulations are established.


    Through a business analysis lens


    Kumra’s proposed checklist becomes a practical guide for business analysts, offering
    questions to assess the ethical implications of their work. This checklist includes
    considerations for data bias, user comprehension, data breach preparedness and
    content integrity. Collaborative customisation allows teams to adapt the checklist
    to their specific projects, reinforcing accountability and ethical implementation.


    The framework’s call for self-regulation resonates with business analysts, emphasising
    the need to uphold ethical standards in the absence of industry-wide regulations.
    This highlights the significance of incorporating ethical considerations in significant
    product launches and minor feature updates and enhancements.


    In conclusion, business analysts can be positioned as ethical gatekeepers in the
    tech industry, leveraging frameworks and checklists to embed ethical principles
    into their practices. This proactive approach aligns with industry best practices
    and prepares the tech sector for a future where moral considerations are paramount.


    Through a cyber security lens


    The risk categories, ranging from truth and addiction to surveillance and criminal
    actors, align with the multifaceted challenges faced in cyber security.


    Addressing biases in training data, ensuring transparent terms of service and
    preparing for data breaches are ethical imperatives and integral components of
    a robust cyber security strategy. The emphasis on accountability resonates strongly
    in the cyber security domain, where the consequences of lapses can be severe.


    Moreover, the collaborative nature of customising the checklist aligns with the
    interdisciplinary approach often required in cyber security efforts. Incorporating
    ethical considerations into product design, a theme highlighted by Kumra, is crucial
    to developing secure and responsible technological solutions.


    Security must go hand in hand with privacy and ethical use of data. It emphasises
    protecting data from external threats, ensuring security practices align with
    ethical considerations and respecting user privacy. This entails striking a balance
    between robust security measures and the responsible use of data, acknowledging
    that unchecked surveillance or data collection can infringe on individuals’ rights.


    Self-regulation and a commitment to ethics are foundational in cyber security
    practices in an unregulated tech landscape. The constant vigilance and proactive
    stance recommended by Kumra mirror the cyber security principle of staying ahead
    of evolving threats. Ethical considerations in data control, trust and privacy
    are central to maintaining the integrity and resilience of cyber security measures.


    SUSTAINING THE INNER COMPASS


    Being ethical is not just a moral imperative but an intrinsic characteristic embedded
    in the essence of being human. This inherent ethical dimension shapes human interactions,
    decisions and the pursuit of a harmonious existence. The intricate interplay of
    cognition, emotions and social dynamics contributes to the development of an internal
    value system that serves as a guiding force for individuals.


    At the cognitive level, humans possess the ability to reason, discern right from
    wrong and make moral judgements. This intellectual prowess forms the foundation
    of an internal ethical compass, guiding individuals through the complex terrain
    of ethical considerations. The capacity to reflect on the consequences of actions
    and align choices with moral principles is a distinctive feature of the human
    psyche.


    For business analysts, leveraging this internal value system can be a transformative
    and guiding force in their professional endeavours. The ethical compass within
    each analyst can serve as a reference point for making decisions that align with
    moral principles and societal expectations. Ethical considerations become an integral
    part of the analysis process, influencing choices related to data handling, and
    how stakeholders are engaged, dealing with privacy issues, data protection and
    digital integrity, and creating decision-making protocols that demand heightened
    ethical awareness. Understanding the moral implications of actions and decisions
    is a professional responsibility and an expression of your inherent humanity.


    An ethically informed internal value system guides analysts to navigate complex
    scenarios with integrity and transparency. It promotes responsible practices in
    analysis, ensuring that ethical considerations are not compromised for short-term
    gains. This internal ethical compass becomes a beacon, illuminating the path towards
    sustainable and socially responsible business practices.


    In conclusion, successfully implementing the Business Analysis and Cyber Security
    Framework is not just a technical achievement, but a testament to the organisation’s
    commitment to resilience, ethical conduct and future readiness. By intertwining
    these critical components, we create a robust shield that protects against the
    evolving landscape of cyber threats and fosters a culture of security, innovation
    and sustained success. The synergy of business analysis and cyber security, underpinned
    by the surrounding structure of mindset, ethics, risk and business analysis, propels
    the organisation towards a secure and ethical future.


    Storytime


    A final narrative, which gradually unfolded its depth over time, has made itself
    my enduring favourite, a timeless legend that I heard many years back. The tale
    possesses a unique ability to anchor me to the present moment, serves as a powerful
    reminder to perceive reality as it is and encourages me to explore situations
    from diverse perspectives. The resonance of this story continues to be a source
    of grounding and introspection, shaping my outlook on life with its profound wisdom.
    The narrative has been slightly adjusted to align with the context being discussed
    in this book.


    A wise monk resided in quiet contemplation in a secluded corner of the world,
    nestled amid serene landscapes. His days were spent in communion with nature,
    and he had a devoted disciple eager to absorb the wisdom that emanated from the
    monk’s tranquil existence.


    One day, the monk, sensing the need for solitude, announced to his disciple that
    he would temporarily leave their sanctuary. He entrusted the disciple with the
    responsibility of looking after their sacred abode in his absence. Intrigued and
    earnest, the disciple, inquisitive about the nature of his duty, approached the
    monk with a sincere question: ‘How can I fulfil this task entrusted to me?’


    With a serene gaze and a gentle smile, the monk uttered a single word – ‘awareness’.
    Perplexed but respectful, the disciple accepted this cryptic guidance and commenced
    his stewardship with a commitment to understand the depth behind the monk’s enigmatic
    counsel.'
