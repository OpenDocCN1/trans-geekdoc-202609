- raw: '• Failure to update a patch that apparently was available three-and-a-half
    years before the attack.


    • Failure to undertake proactive monitoring activities to discover vulnerabilities.


    • Failure to implement the defence for a common type of attack.


    Like HMRC and TalkTalk, many more reputable organisations have become the victims
    of cyber security breaches. They had security frameworks implemented or accredited
    to one or other security standards. They had their legal and regulatory teams
    who complied with the laws. They had a dedicated cyber security team in place
    and, despite all boxes ticked, they were not secured.


    Research has repeatedly shown that most cyber security incidents are due to a
    lack of awareness, and hence ‘people’ are the weakest link. The above incidents
    reinforce too that the underlying cause is the lack of awareness.


    Why is this the case? What are we missing here?


    TAKING A STEP BACK TO GAIN PERSPECTIVE


    Let’s take a step back to gain perspective on the root causes of this mammoth
    issue affecting everyone professionally and personally. Gaining a perspective
    on the background will help us to evaluate why a focus change towards cyber security
    is necessary.


    I started my career as a consultant analyst developer during the late 1990s. My
    job was to work with clients, understand their business requirements, design a
    database, build a system to meet their business needs, prepare manuals and train
    users to use the new application. I was doing all of these things on a standalone
    computer. All my code, executables, operating system and database, including the
    customer data, were in one physical system.


    **Figure 2.1 Technology expansion** (Copyright: I-Perceptions Consulting Ltd)


    ![](images/Fig2-1.jpg)


    The only vulnerability apart from securing the physical equipment was using a
    floppy disk, which was used to copy data in and out of the computer and could
    potentially corrupt the files if it contained a virus. Even if a virus corrupted
    a file, anti-virus software was available that could clean the data. This solution
    could be replicated on any other infected computers within the organisation. A
    single solution worked for all computers.


    Later, computers were connected as clients to servers, creating local and wide
    area networks. Today with the advent of the internet and other technological advancements,
    systems are distributed across the globe ([Figure 2.1](#15_ch02.xhtml#fig2-1)).
    For instance, customers can initiate a transaction in one location on a device
    and complete the same transaction in another place and at a different time.


    Across the spectrum of change


    Technology has advanced from wired to wireless to wearable. It is conceivable
    that technology may be implantable in the future. Imagine the potential weaknesses
    or vulnerabilities in a globally distributed system. What can go wrong in this
    new landscape? The list of potential vulnerabilities is seemingly endless.


    Disrupting and challenging the status quo and using technology creatively within
    the business ecosystem has become the default way of thinking for innovative organisations.
    In recent years, user experience enhancements have been made by pushing out system
    boundaries, making imagination the new boundary. The more technology expands,
    the more vulnerable the ecosystem gets, and the more security controls are required.


    The more technology expands, the more vulnerable the ecosystem gets, and the more
    security controls are required.


    In a truly interconnected world, there is no one solution to this cyber security
    challenge. Unlike the times when information was passed between systems by floppy
    disks and dial-up modems, vulnerabilities in this new landscape come with their
    own risks and impacts. There are additional legal and compliance requirements
    to adhere to, requiring different defence solutions, which could be technical
    and non-technical. Solutions now involve people management, process management,
    disaster recovery, business continuity and more.


    Throughout my journey as a business analyst, I’ve adapted to the progressing technology
    and changing business needs. As the businesses started to expand, a list of user
    or system requirements back then began to develop into NFRs and functional requirements
    (FRs). Historically, security was considered a type of NFR, usually restricted
    to roles and permissions. With the changing business and technology landscape
    and increased cyber security threats, this view on security is no longer sufficient.


    When we pick up one end of the stick, we also pick up the other.


    Along with technology comes cyber security.


    Today, robotics and artificial intelligence (AI) have become part of many people’s
    lives, with robotic dogs patrolling the parks or Alexa and Eilik (a mini-robot)
    on our desktops or as personal assistants for home. This is the beauty of technology.
    However, as the saying goes, when we pick up one end of the stick, we also pick
    up the other. Along with technology comes cyber security. The obvious question
    that arises is why organisations are missing this.


    WHAT GAME ARE THEY PLAYING?


    Simon Sinek, an author and motivational speaker, talks in his book, *The Infinite
    Game* (2019), about the finite and infinite games organisations play knowingly
    or unknowingly.


    Finite game


    A finite game is one where there will be known players, fixed rules and an agreed
    objective, where there is a set goal to achieve and, in the end, there will be
    winners and losers. This equation works just fine when there are at least two
    finite players.


    Infinite game


    In an infinite game, there’ll be unknown players, and the rules are changeable.
    The objective is to keep the game going, i.e. play to perpetuate the game. If
    one is tired of playing or wants to get out, they can, and another person will
    take over, continuing the game. This equation also works fine when there are two
    ‘infinite’ players.


    Problems arise when you put a finite player versus an infinite player because
    the finite player is playing to win, and the infinite player is playing to stay
    in the game. As a result, the finite player will get frustrated and find themselves
    in crisis.


    It’s the same in the game of business. By its very definition, the game of business
    is an infinite game. However, organisations play it as a finite game. ‘They don’t
    even know the game they’re in’, says Simon (2019).


    Every organisation aspires to be the best, but the question remains: best in what?
    Are their metrics clearly defined? Even if they are, they often revolve around
    competition, perpetually striving to outdo rivals. This can be seen where organisations
    just want to launch a product or service or secure prestigious awards for being
    the best organisation.


    Simon continues to note that one can’t make strategic decisions by studying the
    competition. One can only make tactical decisions by studying the competition.


    Organisations need to understand that they’re playing to stay in the game, and
    this understanding radically changes the kinds of decisions they make.


    The infinite player understands that sometimes you are ahead and sometimes behind.
    Sometimes your product is better, and sometimes it’s not. The goal isn’t to be
    the best every day. The goal isn’t to outdo your competition every day. The goal
    should be to stay in the game and experience the journey of playing and staying
    in the game.


    Being an infinite player, an organisation should focus on creating robust products
    by closing all the security loopholes and delivering better value to end users.
    That will keep the organisation going in the long run.


    A finite player is playing to win, and an infinite player is playing to stay in
    the game.


    Being an infinite player, an organisation should focus on improving its product,
    closing all the security loopholes, making them robust and delivering better value
    to end users. That will keep the organisation going in the long run.


    CYBER SECURITY IS MORE THAN JUST IT'
