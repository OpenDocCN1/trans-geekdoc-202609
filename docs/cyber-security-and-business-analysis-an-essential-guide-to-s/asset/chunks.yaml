    Yet, awareness alone was not enough. It was evident that the logical progression
    from awareness lay in implementation. Thus, I created a framework that business
    analysts could seamlessly integrate into their day-to-day practices to proactively
    address cyber security concerns at every stage of the business analysis life cycle.
    From risk assessment and mitigation to stakeholder engagement and requirements
    elicitation, the framework outlined herein provides a systematic approach for
    integrating cyber security into every facet of the business analysis process.


    Recognising the inherently theoretical nature of both business analysis and cyber
    security, I understand the importance of presenting the content in an engaging
    and accessible manner. Drawing from my role as a mother, where I have frequently
    used stories to convey important messages to my children, I employ a similar approach
    throughout this book. By weaving together anecdotes, real-life incidents and relatable
    stories, I aim to make the content easy to grasp and memorable for you. This storytelling
    technique bridges the gap between abstract concepts and practical application,
    fostering a deeper understanding of the material presented.


    As we embark on this journey together, let us recognise the imperativeness of
    cyber security in today’s digital age and embrace our role as trusted advisors
    to deliver complete analysis, which includes cyber security.


    ## Who should read this book?


    This is a business analysis book for business analysts and those who perform business
    analysis with or without the title. The term ‘business analyst’ in this book refers
    to anyone who uses business analysis skills, tools and techniques.


    A business analyst must be mindful of all the environments affecting their organisation,
    both the internal and external environments, along with the current and future
    landscapes of the business, while performing their analyses. One such aspect this
    book focuses on is cyber security. Cyber security was traditionally categorised
    as a non-functional requirement within business analysis. However, in today’s
    business landscape, technology has become the foundation for its operation. Hence,
    it is essential to cover this ground to the required depth. If not, the analysis
    is incomplete.


    A business analyst is a trusted advisor. Trust can be built and maintained only
    when complete truth is brought forth in the analysis, not just what the stakeholder
    wants to hear. As trusted advisors, business analysts must deliver a complete
    analysis by conducting a thorough investigation to enable informed decision-making.


    Hence, it is time to shift cyber security ‘left’ and strategise, design, code
    and test it holistically at every stage of the project life cycle. And this book
    aims to deliver pointers to enable you to do that.


    This book does not contain a definitive prescription, nor is it an academic textbook
    – and there cannot be one. Organisations can have numerous cyber security strategies,
    and they need to choose their solutions based on various parameters such as their
    sensitivity of data, their operations, risks, resources and so on.


    Several bodies of knowledge exist within the field of business analysis, each
    offering unique perspectives and resources for business analysis professionals.
    In this book, particular emphasis is placed on two primary bodies: BCS and IIBA.


    Through this book, I aim to equip you with the knowledge and tools necessary to
    navigate the complex landscape of cyber security, ultimately contributing to developing
    more secure and resilient systems. I hope you find it helpful and enjoyable and
    that it supports you in your day-to-day business analysis.


    My best wishes,


    Bindu Channaveerappa


