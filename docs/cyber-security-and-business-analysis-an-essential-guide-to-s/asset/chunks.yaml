- raw: 'A key takeaway highlighted the human tendency to ignore apparent risks, underscoring
    the importance of identifying and managing risks for effective security. Douglas
    Adams’s quote encapsulated the essence, emphasising that security is about managing
    risks and true security is achieved when all risks are identified and managed.


    The chapter proceeded to define risk and present an overview of the ISO 31000
    risk management process. Business analysts’ roles at various stages of the process
    were elucidated, emphasising their contribution to analysing impacts, facilitating
    communication and ensuring cyber resilience.


    Predictable surprises and existential risks were discussed in the context of acknowledging
    the unprecedented changes in social, economic and environmental landscapes. The
    chapter advocated a ‘premortem exercise’ to identify and prepare for ‘predictable
    surprises’. Business analysts were positioned as instrumental in supporting the
    identification of these surprises and influencing strategic decisions.


    The chapter also addressed bias in risk perception, acknowledging the impact of
    cognitive biases on decision-making. Barriers to effective risk management were
    highlighted, emphasising the need for cultural changes and improved communication.
    A glimpse into harnessing AI concluded the chapter, suggesting its potential to
    enhance risk management with advanced analytics, automation and predictive capabilities.


    CHAPTER 5 SUMMARY


    This chapter emphasised the role of common sense in business analysis, drawing
    parallels to James Madison’s notion that ‘Philosophy is common sense with big
    words’. Business analysis was portrayed as common sense with structure, highlighting
    its crucial position in various professions.


    Business analysts were depicted as leveraging different models and frameworks,
    each contributing unique strengths and weaknesses. Despite their diversity, these
    models converged at the compilation of requirements essential for addressing identified
    business needs. The structured and comprehensive approach provided by these models
    guide analysts through systematic explorations of the business environment.


    A story about ‘The Three Little Pigs’ illustrated three key lessons: understanding
    the objective’s intention, recognising the nature of threats and acknowledging
    the knowledge and effort required to build a suitable solution.


    The chapter delved into IIBA’s Business Analysis Knowledge Areas, listing knowledge
    areas and noting cyber security touchpoints. It reiterated that business analysts
    should call upon cyber security SMEs when needed.


    The chapter concluded with a checklist for the cyber security extended BACCM.


    CHAPTER 6 SUMMARY


    This chapter aimed to address the concept of ‘shift left’ by providing pointers
    to incorporate relevant cyber security discussions at every stage of the project.
    It emphasised that, due to organisational and project differences, there is no
    one-size-fits-all approach to cyber security, and the provided pointers should
    be considered as guidelines to trigger the security mindset and involve security
    expertise throughout the project life cycle.


    The metaphor ‘when you pick up one end of the stick, you also pick up the other’
