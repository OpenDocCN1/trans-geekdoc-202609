    business continuity.


    ## Extension to cyber security

    ### Prerequisites

    Understanding the cyber security objectives within the organisation’s overall
    business strategy, cyber security posture, concerns, risks, current measures,
    vulnerabilities and threat landscape. Recognising the potential impact of cyber
