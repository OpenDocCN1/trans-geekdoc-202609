- raw: '■ **Cyber security extension** – assessing the political landscape regarding
    cyber security regulations and legislation that may impact the organisation, such
    as changes related to data protection and privacy, can have a significant influence
    on strategic decisions.


    • **Economic factors** include inflation rates, exchange rates, interest rates,
    economic growth or recession, and overall economic stability. Organisations need
    to assess the economic factors to understand their potential impact on consumer
    behaviour, demand for products or services and financial stability.


    ■ **Cyber security extension** – considering economic factors related to cyber
    security budgeting and resource allocation. Recessions or uncertainties may affect
    the organisation’s ability to invest in expensive cyber security measures.


    • **Social factors** include demographics, cultural attitudes, lifestyle trends,
    consumer behaviour and social values. Understanding social factors helps organisations
    to tailor their products, services and marketing strategies to the preferences
    and expectations of their target audience.


    ■ **Cyber security extension** – evaluating the level of cyber security awareness
    and culture within the organisation and the broader society. Understanding how
    different demographic groups may have varying levels of cyber security awareness
    and behaviours helps with aligning cyber security communication styles accordingly.


    • **Technological factors** include innovation, automation, research and development,
    digital trends and the adoption of new technologies. Organisations need to stay
    abreast of technological changes to identify opportunities for improvement and
    assess potential disruptions in their industries.


    ■ **Cyber security extension** – expanding technology is the major risk for cyber
    security. Organisations must consider emerging cyber security technologies to
    enhance cyber security strategies and risk mitigations.


    • **Legal factors** include employment laws, industry-specific regulations, intellectual
    property laws and compliance requirements. Organisations must ensure that their
    practices align with legal standards to avoid legal challenges and ensure ethical
    operations.


    ■ **Cyber security extension** – adherence to cyber and data related legal standards
    is crucial for strategic planning. Organisations must examine legal factors related
    to data protection and privacy laws, compliance requirements and potential legal
    consequences of cyber security incidents.


    • **Environmental factors** include sustainability, climate change and environmental
    regulations. Organisations need to assess their environmental footprint and integrate
    environmental considerations into their strategic planning.


    ■ **Cyber security extension** – assessing cyber security in environmental factors
    involves understanding how sustainability, climate change and environmental regulations
    can impact an organisation’s security posture; evaluate the environmental footprint
    of security measures such as data centres and network devices; and develop resilience
    plans by considering potential climate-related incidents such as extreme weather
    events.


    VMOST


    Another analysis planning tool is VMOST. It provides a structured framework for
    organisations to align their vision, mission, objectives, strategies and tactics
    to achieve their goals (VMOST). It was developed by Rakesh Sondhi, a business
    consultant, in his book, *Total Strategy* (Sondhi, 2008). The detailed description
    of VMOST with examples can be found in the book *Business Analysis Techniques*
    (Cadle et al., 2021).


    • **Vision** is the overarching, aspirational statement that describes the organisation’s
    desired future state, outlines what the organisation aims to achieve and provides
    a sense of direction.


    ■ **Cyber security extension** – introducing a cyber security vision that aligns
    with the overall organisational vision, outlining the desired future state of
    cyber security and the security posture within the organisation.


    • **Mission** is a concise statement that articulates the organisation’s purpose,
    values and the core reasons for its existence, outlining what the organisation
    does to achieve the vision.


    ■ **Cyber security extension** – developing a concise statement that articulates
    the organisation’s commitment to cyber security, emphasising the protection of
    sensitive information and critical systems and maintaining the security posture.


    • **Objectives** are concrete, measurable goals derived from the mission and vision
    that the organisation aims to achieve within a specific timeframe, and serve as
    the benchmarks for evaluating the organisation’s performance and progress.


    ■ **Cyber security extension** – identifying cyber security objectives that are
    derived from the mission and vision to ensure that cyber security goals contribute
    to the organisation’s overall objectives.


    • **Strategies** are the high-level plans and approaches the organisation employs
    to achieve its objectives. They provide a roadmap for achieving the defined objectives
    by choosing the best courses of action.


    ■ **Cyber security extension** – ensuring that the chosen cyber security strategies
    align with the organisation’s overall strategic plans and contributing to the
    achievement of strategic objectives.


    • **Tactics** are the detailed, short-term practical steps, specific actions and
    activities to be undertaken to implement the chosen strategies. There can be multiple
    tactics to achieve an objective, or a tactic can contribute to one or more strategies,
    with metrics identified and monitored regularly to evaluate their effectiveness.


    ■ **Cyber security extension** – defining specific cyber security tactics and
    actions that support the chosen strategies, such as deploying security software
    and maintaining it with updated patches, conducting regular security audits, etc.


    Integrating cyber security within VMOST analysis ensures that the organisation
    is not only focused on achieving its vision and mission but also committed to
    safeguarding the security posture and the overall resilience against cyber threats.
    In addition, it highlights the embraced security culture with the organisation
    and emphasises that cyber security is considered as an integral part of the organisational
    landscape.


    Design phase


    Following the strategy analysis phase, the design phase activities encompass elaborating
    on the requirements and designing solutions. Business analysts collaborate with
    stakeholders to ensure that the designed solution aligns with the organisation’s
    needs by translating business and stakeholders’ requirements into detailed specifications
    through visual representations, as necessary, such as to-be process flows, data
    models, use cases, functional and non-functional requirements, user stories and
    acceptance criteria, among others. The nature of the representation may be a document
    (or set of documents), but can vary widely depending on the circumstances and
    requirement categories.


    In their book *Business Analysis* Debra Paul and James Cadle (2020) categorise
    requirements into the four types:


    • **General requirements** are the business constraints, business policies, business
    continuity, legal, branding, cultural and language-related requirements.


    • **Technical requirements** are the hardware, software, interface and internet-related
    requirements.


    • **Functional requirements** are the data entry, maintenance, procedural and
    retrieval requirements.


    • **Non-functional requirements** are the performance, security and access, backup
    and recovery, archiving and retention, robustness, availability, usability, accessibility
    and capacity and scalability requirements.


    BABOK v3 states that ‘a requirement is a usable representation of a need.’ Requirements
    focus on understanding what kind of value could be delivered if a requirement
    is fulfilled and categorises requirements into business, stakeholder, solution
    and transition requirements.'
