    ANALYSIS IN ACTION


    Once upon a time, in a faraway land, there lived a kind and noble king. One morning
    a farmer came to his court with a problem that his harvest was persistently reducing
    year after year. He was concerned that he might not have any crop at all in the
    coming years and desperately needed help.


    The king at once commanded one of his advisors to go and find out more about the
    problem and present the findings to solve the farmer’s problem.


    The advisor accompanied the farmer home to understand the situation and the problem
    in every detail. He asked the farmer several questions, such as:


    • When did the farmer first notice the reduction in the harvest?


    • What was the impact of this situation on his livelihood?


    • Were there any other farmers who had the same problem?


    • What remedies had they already tried?


    The advisor then walked around the farm, checking the crop, the soil and the water
    in the well. He also conversed with the farm workers, attentively listening and
    making notes. He met with the neighbouring farmers to check if they had a similar
    problem and to learn what they did to solve it. He undertook the research for
    several days, consulted a few experts as required and collated all the information.
    Finally, he completed his investigation, identified the root cause of the problem
    and documented the findings. The analysis was complete, and he formulated proposals
    for a few solution options based on the results.


    Solution options


    The underlying reason for the reduction in the crop was due to reduced water level
    and the soil drying. As a result, the yield was not being supplied with sufficient
    water. This situation persisted, drying the ground year after year. The advisor
    devised several solutions by collaborating with the experts to address the root
    cause of the problem and its effects.


    The first solution option was a quick, temporary fix that required the least investment
    of resources. It was to dig the well even deeper to obtain more water. However,
    there was a risk in this option. The neighbouring farmers had already tried this
    solution, and the results were inconsistent. Only a few wells replenished the
    water, and others didn’t. Therefore, this option could not guarantee to solve
    the problem and produce the desired outcome, but this risk was acceptable.


    The second solution option was to set up a mechanical infrastructure to pump water
    from the nearby lake into the farm. This option required more investment than
    the first and was not a quick fix. Due to the higher cost of setting up the infrastructure,
    this second option could be extended to the neighbouring farmers dealing with
    a similar situation, thereby sharing the installation and ongoing maintenance
    costs. However, this solution was also not a permanent fix and could not guarantee
    the desired outcome. Due to the drying up of the soil, the water levels in the
    lake, too, could further reduce over time. Additionally, the lake was a reservoir,
    and using the water immediately could create a deficit during droughts, giving
    rise to another crisis. Therefore, the current water usage in the lake would not
    be dependable, making this a high-risk option.


    The third solution option was a longer-term, efficient and permanent solution.
    It was to plant more trees around the farming land that would hold water and avoid
    drying up the soil in the future. This option could improve the soil quality and
    rejuvenate the wells and the other water bodies. It addressed the current problem
    and would enhance the harvests’ quality and quantity.


    The advisor submitted this report to the king. Then, with all the findings and
    the solution options, the king could decide on the best solution for the farmer’s
    problem.


    I told my son that, in this day and age, business analysts are like this advisor.
    They analyse the problem, research all the relevant facts, communicate and collaborate
    with the concerned teams, identify the root cause of the situation and propose
    solution options.


    As I said this, my son immediately remarked that a business analyst solves people’s
    problems, and that statement nailed it.


    In essence, business analysts are problem solvers. They tease out the problem
    situation to find suitable solutions to solve the problem. However, in this process,
    can a business analyst:


    • Miss out on analysing relevant pieces of information?


    • Ignore seeing the different perspectives?


    • Perform inadequate research?


    How would any of the above shortcomings affect the analysis and the findings?
    And why is it so important that a business analyst delivers a complete and correct
    analysis?


    IMPACTS OF INCORRECT AND INCOMPLETE ANALYSIS


    Let’s consider a few scenarios to illustrate the consequences of inaccurate and
    incomplete analysis in the above story. These scenarios demonstrate how flawed
    solutions can exacerbate existing problems or introduce new issues and risks.


    Scenario 1


    The problem is deteriorating harvest.


    **Analysis**


    Assuming the perceived problem as the real problem.


    **Potential solution option**


    Import crops or alternate food supplies from neighbouring states or countries.


    **Impacts**


    • How sustainable is it to import food supplies from neighbouring states or countries?


    • What will be the process requirements? Will it be simple or complicated?


    • Will the imported crop be the same or different?


    • If different, can the people accept the new diet?


    • Are there any side effects from the new diet we must prepare for?


    • What are the requirements for the new type of crop in terms of storage, climate,
    etc.?


    **Outcome**


    The perceived problem is being addressed rather than the root cause.


    Although this solution may solve the problem temporarily, it will only perpetuate
    more problems, incurring unnecessary investments, effort, money, resources, time
    and so on, and ultimately, it fails to address the underlying root cause of the
    situation.


    Scenario 2


    A new fancy machine will solve the problem and is the talk of the town. Everyone
    is raving about the new fancy machine easing farmers’ efforts.


    **Analysis**


    Assuming the efficacy of the fancy machine has been tested and verified to ease
    farmers’ lives, as everyone has the same understanding, including the farmers,
    workers, neighbouring villagers and the research data.


    **Potential solution option**


    Install the new fancy machine as quickly as possible to avoid missing the window
    for the forthcoming harvest.


    **Impacts**


    • It is reported that the machine requires regular maintenance for water leaks,
    which is expensive, and therefore:


    ■ How will the farmers afford the expensive maintenance cost?


    ■ How long will this be sustainable?


    ■ Why was this not discussed with the farmers earlier?


    • Farmers must undergo mandatory training to learn about machine technology, operations
    and maintenance, so dedicated time for this activity must be set aside.


    ■ Can the farmers allocate additional time for training?


    ■ If not, what will be the alternative?


    ■ Who else can operate the machine to avoid downtime?


    • The machine requires a customised infrastructure to secure the equipment and
    its usage.


    ■ Has the feasibility of the infrastructure been assessed?


    ■ If not, who is responsible for ensuring the machine’s security requirements?


    ■ Without proper security measures in place, anyone could gain access to the machine
    room and tamper with the equipment, potentially causing damage, even if it’s accidental.


    ■ Farm animals could also enter the machine room and damage the machine.


    ■ Some farm workers who have a personal feud with the farmer could damage the
    machine intentionally.


