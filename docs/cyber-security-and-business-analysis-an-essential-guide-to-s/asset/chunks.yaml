- raw: 'By engaging with cyber security experts, business analysts can understand
    threat scenarios and incorporate those scenarios in their impact analysis and
    help to prioritise countermeasures. For instance, in a smart home automation system,
    security experts might highlight a threat scenario where attackers exploit insecure
    IoT devices to gain control over home appliances.


    Through consistent collaboration with business, security and IT teams, business
    analysts can contribute to ensuring a more robust identification and mitigation
    of threat scenarios in use or misuse cases.


    ![Icon: Head with gears facing left.](images/icon1.jpg)


    REFLECTION TIME


    Take a moment, ponder and write down:


    • Can you recall instances from your own experience where human errors led to
    cyber security vulnerabilities or incidents within your personal life or in your
    organisation?


    • How confident are you in your organisation’s ability to manage cyber security
    risks associated with remote working?


    GRACEFULLY RESPONDING AND SEAMLESSLY TRANSITIONING


    The legend about bamboo I have heard is that when a seedling is planted, the first
    year seems uneventful despite providing the necessary sunlight, water and nutrients.
    Years two, three and four echo a similar quiet growth. However, the magic happens
    in the fifth year, when the sprig rapidly ascends, reaching an impressive height
    of 90 ft within five weeks (Sergeyev, 2021).


    Contrary to appearances, the initial four years are a crucial phase when bamboo
    invests its energy in downward growth. Unseen to the eye, it extends its roots
    deep into the ground, establishing a robust foundation that ultimately supports
    its towering stature. The bamboo’s ability to grow tall lies in its earlier focus
    on strengthening its roots below the surface.


    Another remarkable thing about bamboo is that it exhibits extraordinary strength,
    standing resilient against powerful winds that might topple other trees. It is
    a testament to its outstanding endurance, having survived even atom bombs and
    natural disasters (Gilmer, n.d.). In the face of forceful winds, bamboo displays
    a unique flexibility: it gracefully bends with the force of the wind and promptly
    returns upright once the wind subsides. This inherent resilience, strength and
    adaptability in the face of adversity makes bamboo a symbol of resilience (Sergeyev,
    2021).


    The dictionary meaning of resilience is the capacity to recover quickly from difficulties
    or the ability of a substance or object to spring back into shape. It’s the toughness
    and the elasticity.


    As the saying goes, you cannot direct the wind, but you can adjust your sails.
    In a similar vein, threats cannot be entirely avoided, yet they can be anticipated
    and mitigated through careful preparation and planning. Despite dedicated efforts
    involving controls, measures, process enhancements, training and technological
    support, it remains impractical to eliminate every risk and thwart every threat.
    However, with meticulous prior planning, organisations can effectively manage
    risks and threats. Resilience is paramount for organisations, and preparation
    is the bedrock of this resilience, allowing them to navigate the unpredictable
    waters of potential disruptions.


    Preparedness involves adeptly responding to the inevitable and gracefully managing
    incidents as they unfold. Seamlessly transitioning from the impact of a disaster
    to resuming regular business operations, all achieved through meticulous prior
    planning and preparation, defines the essence of business continuity.


    Preparedness involves adeptly responding to the inevitable and gracefully managing
    incidents as they unfold.


    INCIDENT MANAGEMENT


    Incident management is the structured process of identifying, responding to and
    resolving incidents or disruptions in an organisation’s operations. These incidents
    can range from cyber security breaches and IT system failures to natural disasters
    and other emergencies. The goal of incident management is to respond efficiently
    by minimising the impact of disruptions, restoring normal operations swiftly and
    learning from the incident to prevent future occurrences. The process typically
    involves **detection**, **reporting**, **assessment**, **classification**, **response**,
    **resolution** and **post-incident** analysis.


    Business analyst support


    While business analysts may not possess all the technical details related to cyber
    security or incident response, their ability to understand business processes,
    facilitate communication between different teams and focus on the business impact
    of incidents makes them valuable contributors to incident management planning
    and execution.


    Business analysts can employ various skills to contribute effectively, such as
    communication skills to articulate incident management processes clearly to technical
    and non-technical stakeholders. They can engage stakeholders from different departments
    to elicit incident response requirements, including understanding the critical
    business processes, dependencies and potential risks.


    They can harness their analytical skills by analysing incident data, identifying
    patterns and deriving insights for process improvement. Their facilitation skills
    are essential for discussions and tabletop exercises (simulated scenario-based
    training exercises that allow participants to review and discuss their organisation’s
    response procedures for various emergency situations or critical incidents in
    a low-stress environment) involving business and technical teams.


    Problem-solving skills are valuable in resolving business-related challenges during
    incidents, contributing to effective incident response. Additionally, strong documentation
    skills are necessary to create comprehensive documentation for incident management
    plans, procedures and post-incident reports.


    Business analysts’ expertise in various tools can support incident management
    planning and preparation activities. Collaboration tools such as Confluence or
    SharePoint help to create centralised repositories for incident management documentation
    and communication plans. Project management tools such as Jira or Azure Dev Ops
    aid in tracking and managing incident response tasks and timelines. Visualisation
    tools such as Lucidchart or Visio assist in creating process flowcharts and visual
    representations of incident management workflows. Training and learning platforms
    can be employed to develop and deliver training materials related to incident
    response.


    In addition, business analysts can apply different techniques to enhance incident
    management processes. SWOT analysis helps to assess the strengths and weaknesses
    of the current incident management process and identify improvement opportunities.
    Root cause analysis investigates incidents, identifies root causes and recommends
    corrective actions.


    Scenario planning allows for anticipation of potential incidents and developing
    response strategies through scenario-based planning. User stories and use cases
    effectively capture and document business requirements for incident response processes.
    Lessons-learned workshops facilitate discussions after incidents, gather feedback
    and identify areas for improvement.


    By using these skills, tools and techniques, business analysts can actively participate
    in incident management planning, execution and continuous improvement efforts.
    Their unique ability to bridge the gap between business needs and technical requirements
    can prove crucial in building the organisation’s resilience capabilities.


    BUSINESS CONTINUITY PLANNING


    BCP is a proactive approach that organisations adopt to ensure the continuation
    of critical business functions in the face of disruptive events such as natural
    disasters, existential threats, pandemics, cyber security incidents or any other
    emergencies. The goal of BCP is to minimise the impact of disruptions, maintain
    essential operations and swiftly recover to normality.'
