    What is business analysis?


    To grasp the essence of business analysis, let’s explore it in some of its flavours
    from its definition to its personal significance, encompassing different perspectives
    and the essential mindset it demands.


    Drawing from the knowledge base of the two primary bodies of knowledge, the opening
    chapter of Debra Paul and James Cadle’s fourth edition of *Business Analysis*
    (2020) delves into the fundamental question of what business analysis is – a discipline
    dedicated to ensuring organisational changes align with business needs, which
    has now evolved in guiding businesses in navigating through the complexities of
    the change life cycle.


    The International Institute of Business Analysis (IIBA) defines business analysis
    as: ‘the practice of enabling change in an enterprise by defining needs and recommending
    solutions that deliver value to stakeholders’. The crux of the definition is wrapped
    within the phrase ‘enabling change’.


    A change can be enabled only when its current and future states are clearly understood.


    The term ‘analysis’ (pl: analyses) is the process of breaking a complex topic
    or substance into smaller parts to understand it better ([https://en.wikipedia.org/wiki/Analysis](https://en.wikipedia.org/wiki/Analysis)).
    The word comes from the Ancient Greek ἀνάλυσις (analysis, ‘a breaking up’ or ‘an
    untying’; from ana ‘up, throughout’ and lysis ‘a loosening’).


    *Analysis – breaking complex business components into smaller parts to better
    understand the current state is an integral aspect of business analysis.*


    The inverse of analysis is synthesis. The future state can be envisioned by combining
    components in a different or new way to deliver the expected value.


    *Synthesis – putting the pieces back together again in a new or different whole
    is an essential aspect of business analysis.*


    The part of the definition of ‘recommending solutions that deliver value’, the
    expected outcome, is achieved by evaluation.


    *Evaluation – comparing the outcomes from breaking up and synthesis of business
    components by assessing their advantages and disadvantages relative to the goals
    and situations is a crucial aspect of business analysis.*


    The value proposition is to fulfil the expectations of the stakeholders by understanding
    their perspectives.


    *Perspectives – every stakeholder will have a perspective based on their organisational
    role, making perspectives a critical aspect of business analysis.*


    The four elements – analysis, synthesis, evaluation and perspectives – are foundational
    to understanding the core of business analysis ([Figure 1.1](#14_ch01.xhtml#fig1-1)).


