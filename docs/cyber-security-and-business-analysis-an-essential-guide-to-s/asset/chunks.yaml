- raw: 'As stated in BABOK v3, the Business Analysis Planning and Monitoring knowledge
    area includes planning the business analysis approach, planning stakeholder engagement,
    planning business analysis governance, planning business analysis information
    management and identifying business analysis performance improvements. The cyber
    security extension ensures that the business analysis plan incorporates cyber
    security measures, and that ongoing monitoring includes assessing the effectiveness
    of cyber security controls.


    Extension to cyber security


    ***Prerequisites*** Understanding the cyber security objectives within the organisation’s
    overall business strategy, cyber security posture, concerns, risks, current measures,
    vulnerabilities and threat landscape. Recognising the potential impact of cyber
    security incidents on the business needs and the organisation.


    ***Activities***


    • Supporting the identification and assessment of the cyber security risks associated
    with business analysis activities.


    • Integrating the cyber security considerations into the scope and objectives
    of the business analysis plan.


    • Planning for collaboration with cyber security stakeholders to ensure effective
    engagement and communication.


    • Establishing governance processes to address relevant cyber security considerations
    within business analysis activities, such as decision-making processes for cyber
    security-related information.


    • Managing cyber security-related information, specifically protocols for handling
    sensitive data.


    • Integrating cyber security information management into the overall information
    management plan.


    • Identifying cyber security-specific metrics and key performance indicators (KPIs)
    to align with the project and organisational security objectives.


    • Integrating cyber security metrics into the overall monitoring and reporting
    mechanism to ensure that business analysis activities contribute to cyber security
    objectives.


    • Integrating cyber security requirements traceability into the overall traceability
    plan.


    • Defining an approach for creating, organising and maintaining business analysis
    documentation, which includes cyber security-related information.


    • Helping to establish protocols for securing and handling sensitive cyber security
    documentation.


    • Integrating cyber security documentation into the overall documentation plan.


    • Defining review criteria and checklists that include cyber security considerations.


    • Establishing review processes to ensure relevant compliance with cyber security
    standards.


    Elicitation and collaboration


    The Elicitation and Collaboration knowledge area provides guidance and best practices
    to ensure business analysts gather relevant and accurate information from stakeholders
    and foster collaboration throughout the business analysis process.


    A successful elicitation and collaboration involves:


    • Stakeholder engagement, which is identifying, communicating and managing stakeholders
    throughout the business analysis process.


    • Collaboration, which is working together with stakeholders to achieve the business
    goals.


    • Elicitation, which is the process of drawing out information from stakeholders
    to understand their needs, expectations and concerns.


    As stated in BABOK v3, the Elicitation and Collaboration knowledge area includes
    preparing and planning for elicitation, conducting elicitation, confirming elicitation
    results, communicating the information and managing stakeholder collaboration.
    The cyber security extension ensures that the elicitation process accounts for
    security needs and adapts the elicitation and collaboration processes to include
    cyber security stakeholders.


    Extension to cyber security


    ***Prerequisites*** Understanding the cyber security objectives within the organisation’s
    overall business strategy, cyber security posture, concerns, risks, current measures,
    vulnerabilities and threat landscape. Recognising the potential impact of cyber
    security incidents on the business needs and the organisation.


    ***Activities***


    • Conducting a stakeholder analysis to identify cyber security-focused roles and
    responsibilities. Identifying and engaging with stakeholders from security teams
    who play crucial roles in cyber security, such as IT security professionals, data
    privacy officers and compliance officers.


    • Collaborating with the identified cyber security stakeholders to understand
    their specific needs and concerns.


    • Planning for eliciting information related to cyber security policies, regulatory
    requirements and specific security controls aligning with the overall business
    analysis plan.


    • Eliciting information related to cyber security risks, threats and vulnerabilities,
    and identifying requirements in collaboration with business and cyber security
    stakeholders.


    • Confirming that elicited information addresses identified cyber security risks
    and concerns.


    • Validating security requirements with cyber security stakeholders to confirm
    alignment with overall business requirements.


    • Creating models to represent the flow of sensitive information, encryption mechanisms
    and access controls.


    • Collaborating with stakeholders to prioritise cyber security decisions and implementations.


    • Documenting cyber security requirements that address identified risks and align
    with overall business requirements.


    • Documenting risk assessments, including identified threats, vulnerabilities
    and risk mitigation strategies.


    • Reflecting on past cyber security incidents to identify areas for improvement
    in elicitation and collaboration techniques.


    • Maintaining the confidentiality of information shared by stakeholders.


    Requirements life cycle management


    The Requirements Life Cycle Management knowledge area focuses on the processes
    and activities involved in managing requirements throughout the life cycle. It
    includes eliciting, documenting, analysing, prioritising and validating requirements,
    including tracking changes and ensuring the requirements align with the overall
    project and organisational goals.


    As stated in BABOK v3, the Requirements Life Cycle Management knowledge area includes
    tracing requirements, maintaining requirements, prioritising requirements, assessing
    requirements changes and approving requirements tasks. The cyber security extension
    ensures that cyber security requirements are identified, documented, validated
    and managed methodically and effectively to maintain the security posture for
    safeguarding sensitive information, maintaining the integrity of systems and ensuring
    business continuity.


    Extension to cyber security


    ***Prerequisites*** Understanding the cyber security objectives within the organisation’s
    overall business strategy, cyber security posture, concerns, risks, current measures,
    vulnerabilities and threat landscape. Recognising the potential impact of cyber
    security incidents on the business needs and the organisation.


    ***Activities***


    • Identifying cyber security requirements and explicitly documenting those as
    part of the overall requirements identification process.


    • Collaborating with cyber security experts to identify relevant security requirements
    within the business processes.


    • Documenting specific cyber security control requirements, such as encryption,
    access controls and authentication requirements, as part of the overall functional
    requirements.


    • Documenting specific regulatory and compliance requirements related to cyber
    security impacting the business processes or data as part of the overall functional
    requirements.


    • Developing a traceability matrix that links cyber security requirements to design
    elements, test cases and other project artefacts.


    • Managing changes and assessing the impact on cyber security controls.


    • Collaborating with cyber security stakeholders when prioritising requirements
    to ensure critical and high-impact security requirements are assigned the appropriate
    priority levels by the cyber security stakeholders.'
