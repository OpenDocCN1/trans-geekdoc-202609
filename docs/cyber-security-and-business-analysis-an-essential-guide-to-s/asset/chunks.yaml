- raw: 'Organisations are focusing on just putting their products out and capitalising
    on the quick wins, which is a finite game, and so each product has a short and
    finite life span.


    Many products are out in the market with vulnerabilities – from light bulbs, security
    cameras, fish tanks, kettles and thermostats to healthcare products. Ransom attacks
    on hospitals have increased to 123 per cent and nearly $21 billion in ransomware
    cost, according to the Cynerio research report (Lauver, 2022), which examine the
    current outlook of connected medical device security in hospitals. A ransomware
    attack caused disruptions in a hospital that led to a newborn’s death (Zacharakos,
    2023).


    Choosing victory or fulfilment, winning the war or losing the battle, being a
    finite player or enjoying the process as an infinite player is a constant battle.
    It becomes an accepted practice to lean towards instant gratification or take
    a shortcut for a quick win within organisations and society, but in reality, life
    is a marathon and not a sprint.


    EXPANSION IS THE FUTURE


    Research from Gartner brought forth four emerging technologies and trends for
    2023. Two of the four concern cyber security. The ‘smart world’ – a fusion of
    physical and digital experiences – and the ‘transparency and privacy’ of personal
    data collection (Nguyen, 2023).


    McKinsey Digital state that advances in AI, machine learning, robotics and other
    technologies have increased the pace of change tenfold, and they estimate that
    50 billion devices will be connected to the industrial internet of things (IIoT)
    by 2025. They highlight that tech literacy becomes core to every role, and businesses
    need to be ready to cope with the pace and proliferation of technological innovations
    (Van Kuiken, 2022).


    Cyber security is everyone’s responsibility. Yet, as has often been said, ‘everyone’s
    responsibility is nobody’s responsibility’.


    WHAT CAN BUSINESS ANALYSTS DO?


    What can (or should) business analysts do? Or does the problem exceed the scope
    of business analysis? The key question is: Who is responsible for cyber security?
    A tricky one to answer.


    Imagine a customer walking into a shop, accidentally falling due to a slippery
    surface or stumbling due to an obstruction. In this situation, who do you think
    is responsible for the accident? Is it the cleaner, staff, security guard, store
    manager, senior management, etc.? Who in your home is responsible for securing
    the doors, windows or valuables? Now that you have gained a broader perspective
    on the topic, take a moment to ponder this question. Who is responsible for cyber
    security? The answer, perhaps, is that everyone has a responsibility towards cyber
    security. Yet, as has often been said, ‘everyone’s responsibility is nobody’s
    responsibility’.


    Business analysts are well-placed to pick up the baton, step up to ask difficult
    yet crucial questions and ensure that cyber security is kept firmly in the spotlight.
    [Chapter 1](#14_ch01.xhtml) highlighted the responsibilities that come with the
    role of a business analyst in co-creating the value chain, and protection of that
    value chain is an intrinsic part of the responsibility.


    Before we address the question of what business analysts can do, it is imperative
    to understand the difference between the role of a business analyst and the role
    of a cyber security analyst. They both are at different ends of a spectrum ([Figure
    2.2](#15_ch02.xhtml#fig2-2)). They both perform analysis, but play in different
    playgrounds. Business analysts focus on the value proposition, and cyber security
    analysts focus on securing everything relating to IT and cyberspace.


    **Figure 2.2 Analysts spectrum** (Copyright: I-Perceptions Consulting Ltd)


    ![](images/Fig2-2.jpg)


    Business analysts need not be cyber security experts, but instead extend the scope
    of their analysis to include security holistically. They can collaborate with
    cyber security specialists as needed for each project, much like they consult
    with business subject matter experts (SMEs) to gain deeper insights into the business.
    And to do that, they need to have the required foundational knowledge to identify
    the security requirements across the project delivery and reach out to the SMEs
    accordingly ([Figure 2.3](#15_ch02.xhtml#fig2-3)).


    It is well-established that security cannot be an afterthought or a patch at the
    end of the project and must be baked into the solution, starting from project
    inception ([Figure 2.4](#15_ch02.xhtml#fig2-4)).


    **Figure 2.3 Overview of cyber security knowledge for business analysts** (Copyright:
    I-Perceptions Consulting Ltd)


    ![](images/Fig2-3.jpg)


    **Figure 2.4 Holistic analysis** (Copyright: I-Perceptions Consulting Ltd)


    ![](images/Fig2-4.jpg)


    TAKEAWAY QUESTIONS


    • What are your key learning points in this chapter?


    • What is the one lesson that you’ll implement?


    • How do you summarise your perspectives on cyber security?


    ## 3 THE AWAKENING JOURNEY STARTS HERE


    Here’s what you’ll learn from this chapter:


    • Definition of cyber security.


    • Introduction to the Business Analysis and Cyber Security Framework.


    • How to approach security.


    • Security objectives – the CIA Triad.


    • Security violations.


    • Additional security goals.


    • Business benefits and impacts – two sides of the same coin.


    WHAT IS CYBER?


    The term ‘cyber’ is commonly used to refer to the internet, digital or the virtual
    world and is suffixed with anything related to the internet, digital or the virtual
    world. The term originated from the Greek word ‘*kybereo*’, which means to guide,
    steer or control. It gained popularity in 1948 when the American mathematician
    Norbert Wiener coined ‘cybernetics’ – the scientific study of controlling and
    communicating with systems using technology (Dawkins, 2022). From this term emerged
    a series of derivatives to describe everything related to the internet, such as
    cyber security, cyberspace, cybercrime, etc.


    WHAT IS SECURITY?


    The National Institute of Standards and Technology defines security as ‘the state
    of being free from danger or threat’ ([https://csrc.nist.gov/glossary](https://csrc.nist.gov/glossary)).
    A ‘thing’ can be in danger or have a threat only if it is valuable or of great
    worth to someone at that given time. Therefore, security is equal to the protection
    provided to a valued possession against all its threats.


    **Security = Protection of Value against the Threats**


    In this equation, ‘Security’ is equated to the **action** of ‘Protection’ **applied**
    to ‘Value’ in the **presence** of ‘Danger’ or ‘Threat’. This equation highlights
    two profound insights:


    1. An **action** is to be taken to protect something of value. Systems or processes
    do not defend themselves, and action must be taken to protect them.


    2. That action can only be taken when the dangers or threats are **recognised**.
    We cannot protect something when we do not know the dangers or threats against
    it.


    Security = Protection of Value against the Threats


    THE BUSINESS ANALYSIS AND CYBER SECURITY FRAMEWORK


    To effectively apply this formula, a structured and systematic approach for identifying
    risks, threats and vulnerabilities throughout each stage of the project life cycle
    is fundamental. Along with the cyber security knowledge provided within this book,
    business analysts will need a framework to seamlessly integrate cyber security
    analysis into their day-to-day business analysis activities while navigating the
    project life stages.


    The Business Analysis and Cyber Security Framework (© 2024 I-Perceptions Consulting
    Ltd) enables business analysts to holistically extend their analysis to include
    cyber security aspects across the project development phases. This chapter lays
    the groundwork for the framework’s development and establishing essential principles,
    and subsequent chapters will progressively elaborate on this framework, incorporating
    both business analysis and cyber security elements.'
