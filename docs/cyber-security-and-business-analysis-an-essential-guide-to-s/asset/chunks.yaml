    Finally, they can influence fostering a culture of continuous improvement to ensure
    that security measures within the processes are regularly reviewed and updated
    based on changes in the business environment and emerging threats.


    ![Icon: Head with gears facing left.](images/icon1.jpg)


    ## REFLECTION TIME


    Take a moment, ponder and write down:


    - How is your organisation protecting customer data, and are there ways to make
    it even more secure to comply with data protection rules?

    - Have you looked into getting valuable insights from all your data, including
    untapped information, that could improve your decision-making?


    ## EMERGING DATA TRENDS TO MONITOR


    Before concluding this chapter, let’s explore a few noteworthy data trends that
    are especially pertinent for business analysts closely collaborating with data,
    governance and security teams.


    ### Data are the new currency

