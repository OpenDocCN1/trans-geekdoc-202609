- raw: 'There exists an undocumented trust between a doctor and their patient, as
    well as an undocumented faith in the doctor’s diagnosis. Similarly, between a
    business analyst and their client, there’s an unspoken trust in the analysis to
    furnish all essential facts and perspectives, facilitating stakeholders to make
    informed decisions. This trust can only be established and upheld through consistently
    delivering comprehensive analyses. Consequently, business analysts emerge as trusted
    advisors for their clients.


    There is an undocumented trust between a business analyst and their client to
    deliver a complete analysis to enable informed decision-making.


    Concluding the first chapter, I am leaving with you a question to ponder: as a
    trusted advisor, can a business analyst exclude cyber security from their analysis,
    with the assumption that the technical or cyber security teams are responsible
    for all cyber-security-related requirements? No, the non-functional requirements
    do not cover all cyber security requirements, and we’ll see why in the next chapter.


    TAKEAWAY QUESTIONS


    • What are your key learning points in this chapter?


    • What is the one lesson that you will implement?


    • How do you summarise your perspectives on business analysis?


    ## 2 BEGINNING OF THE CYBER SECURITY SAGA


    Here’s what you’ll learn from this chapter:


    • What cyber security means to you.


    • How real this is.


    • Taking a step back to gain perspective.


    • What game they are playing.


    • Cyber security is about more than just IT.


    • Expansion is the future.


    • What business analysts can do.


    WHAT DOES CYBER SECURITY MEAN TO YOU?


    What comes to your mind when you see or hear the word cyber security? For example,
    a compliance team member might say ‘it’s about the compliance of cyber security
    laws, like privacy’; somebody working in an IT team might say ‘it’s about securing
    the network or firewalls’; a system architect may say ‘it’s about securing the
    data and systems’; and most business teams would say ‘it’s technical in nature,
    and hence the IT or the cyber security team is responsible’. If you were a business
    analyst, what would you say? No, it’s not just a part of or limited to non-functional
    requirements. What comes to your mind when you see or hear the word cyber security?


    ![Icon: Head with gears facing left.](images/icon1.jpg)


    REFLECTION TIME


    Before you continue reading further, take a moment to ponder:


    • What does cyber security mean to you?


    Backstory


    A few years back, I would have said the same as the business teams: cyber security
    is the responsibility of the IT or the security teams, and I do not have to bother
    about it. Security was limited to non-functional requirements (NFRs) – e.g. who
    needs to access the system and at what levels – until a personal experience fundamentally
    changed my perspective on cyber security.


    I was working on a customer subscription product, and the data available for the
    subscription were the organisation’s intellectual property. I was assigned to
    work on an enhancement that was at the bottom of the team’s backlog. Note that
    the change was not seen as a business priority, which is why it was at the bottom
    of the backlog.


    It was brought to my attention that the business and technical teams had already
    devised a solution for that problem, but it was not yet implemented because there
    were other items on the backlog that had a higher priority. As a diligent business
    analyst, I delved into the problem to assess if the initial solution was still
    viable. This involved understanding the root cause, which prompted discussions
    with the business, development and operations teams. To my dismay, the analysis
    revealed a shocking truth: the root cause of the problem was a recurring data
    breach, which had gone unnoticed despite multiple occurrences. Operational reports
    showed discrepancies attributed to heavy data downloads, yet no action had been
    taken.


    Contemplating the potential ramifications, I couldn’t help but imagine the catastrophic
    impact if all the data had been freely available on the internet. Not only would
    it have compromised the organisation’s customers, but it also posed a grave threat
    to the organisation’s reputation. Such a breach could even have endangered the
    organisation’s very existence.


    This revelation underscored the criticality of the issue, which the organisation
    had categorised as a low-priority and low-risk backlog item. It was this realisation
    that ignited my journey to delve deeper into cyber security.


    HOW REAL IS THIS?


    Cyber attacks were the fifth top-rated risk in 2020 across public and private
    sectors, globally increased by 125% in 2021, compared to 2020, and continue to
    be on the rise. From internet of things (IoT) cyber attacks alone, the number
    of attacks is expected to double by 2025 (AAG, 2024). Additionally, World Economic
    Forum’s 2020 Global Risk Report states that the rate of detection (or prosecution)
    was as low as 0.05 per cent in the USA (McLean, 2024).


    Let me share another couple of high-profile incidents to gain a deeper perspective.


    HMRC


    One notable incident reportedly took place in HMRC’s Child Benefit department
    in 2007. It was reported that all the child benefit data (including personal details
    of the children who were getting the benefit and their parents’ personal and bank
    details) were copied onto password-protected but unencrypted compact discs (CDs)
    and posted to the National Audit Office through an unsecured and untracked channel
    (BBC, 2007). Some say that the CDs reached their destination, and some say they
    were lost in transit, but nobody knows for sure. There are different versions
    of this incident, but I want to bring your attention to some potential causes
    for this breach:


    • Failure to separate the crucial/sensitive data.


    • Failure to encrypt the data.


    • Failure for not conveying the data in a secure and trackable way.


    • Failure to have an appropriate process for handling these data.


    Reports from the time suggest that the person who copied the data and posted the
    CDs was unaware of the risks and was only following the instructions given by
    their seniors. This incident took place in 2007, and clearly we don’t use CDs
    to transfer data anymore. We have made a lot of progress in terms of technology
    and ring-fenced data with legal regulations, yet this problem continues to rise.
    Have we made any progress in the true sense? Let’s look at the second incident
    that occurred nearly a decade later.


    TalkTalk


    TalkTalk is an internet data provider. In 2009, TalkTalk acquired another company
    called Tiscali. As part of the acquisition, it appears that, along with the systems,
    Tiscali’s system vulnerabilities were onboarded too. Later, in 2015, TalkTalk’s
    database was compromised multiple times, and customers’ personal and financial
    data were exposed (BBC).


    In essence, TalkTalk suffered a significant and sustained cyber attack, and apparently
    only responded when it received an email demanding ransom. It is said that they
    didn’t monitor their internal operational reports, which were apparently showing
    discrepancies. In the beginning, TalkTalk suspected that up to four million customers’
    data were compromised, and reports from the time suggest that it took several
    months for TalkTalk to understand the magnitude of the breach. Later on, the Information
    Commissioner’s Office (ICO) confirmed that the attack saw the personal details
    of 156,959 customers accessed, including the bank account number and sort code
    of 15,656 customers. As a result, TalkTalk incurred damages of up to £40 million,
    lost 101,000 customers and the ICO imposed a £400,000 fine. The shocking fact
    was that the Metropolitan Police confirmed the arrest of a teenager and a 20-year-old
    in connection with this breach. Once again, here I would like to bring your attention
    to the following potential causes for the failure:


    • Failure to remove the vulnerable webpages.'
