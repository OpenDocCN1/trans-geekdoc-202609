- raw: '• **Business requirements** are the high-level needs, goals and outcomes describing
    the overall purpose and objectives of a project.


    • **Stakeholder requirements** represent the viewpoints of stakeholders, individuals
    or groups who have an interest in the outcome of the project by capturing their
    needs, expectations and concerns.


    • **Solution requirements** provide details on how the project will fulfil the
    business needs and are further divided into two sub-categories:


    ■ **Functional requirements** detail what the solution should do in terms of specific
    functionalities, capabilities and behaviours that the system, product or service
    must possess.


    ■ **Non-functional requirements** specify qualities, characteristics and conditions
    for the solution to remain effective, such as performance, usability, scalability
    and other system attributes.


    • **Transition requirements** facilitate transition from the current state to
    the future state. They are temporary in nature and are not needed when completed.


    Cyber security extension


    Business analysts can support in:


    • Defining business requirements related to the protection of critical assets,
    compliance related to cyber security regulations and identifying the relevant
    business goals and objectives for cyber security measures.


    • Identifying stakeholders who have a vested interest in the security of the system
    and their specific requirements by capturing their expectations and concerns related
    to cyber security.


    • Specifying solution requirements for security features and functionalities that
    contribute to the overall system resilience by implementing controls, access management,
    encrypting the data, privacy and other security measures.


    • Detailing functional requirements related to cyber security features, such as
    authentication, authorisation, intrusion detection and secure data processing.


    • Incorporating non-functional requirements specific to cyber security, such as
    performance under security load, response times for security incidents and aspects
    such as system availability, reliability and scalability in the context of cyber
    security.


    • Specifying data requirements related to the protection of sensitive information
    to ensure the secure handling of data by using encryption, access control and
    other data integrity requirements and defining metrics for measuring the effectiveness
    of security controls.


    • Explicitly stating assumptions related to cyber security, such as the assumed
    level of security awareness among users, the trustworthiness of third-party components
    or the effectiveness of security controls.


    Development phase


    The predominant activities for business analysts during the development phase
    are to: collaborate with stakeholders to address questions or concerns raised
    during development, work closely with the development team to clarify any ambiguities
    in the requirements and change control management by setting up a process for
    managing changes and ensuring that changes are evaluated, impact assessed, prioritised,
    approved, controlled and methodically implemented.


    Business analysts can collaborate with system architects and developers to illustrate
    how end users will interact with the system through use cases and user stories
    and ensure that those use cases are technically feasible and align with the overall
    system architecture. They also assist in prioritising requirements based on business
    value and technical feasibility.


    Cyber security extension


    During the development phase, which inherently leans towards technical intricacies,
    supporting system architects and developers can pose a challenge for business
    analysts who lack technical expertise. Nonetheless, business analysts without
    a technical background can play a crucial role by posing a strategic set of questions
    to ensure that cyber security considerations are integrated in the architecture
    and the code.


    Some key questions, and not an exhaustive list, are:


    • Are there security measures integrated into the architecture to protect against
    potential threats and vulnerabilities?


    • How is the overall system architecture designed to ensure the confidentiality,
    integrity and availability of sensitive data?


    • How are sensitive data identified and classified within the system architecture?


    • What encryption mechanisms and access controls are in place to protect data
    both in transit and at rest?


    • How are user authentication and authorisation managed in the system architecture?


    • Are there measures in place to prevent unauthorised access to critical system
    components?


    • Are there security considerations addressed when integrating third-party components
    or services into the system architecture?


    • Are there measures taken to ensure the security of application programming interfaces
    (APIs) and external interfaces?


    • How is the system architecture designed to facilitate a timely and effective
    response to security incidents?


    • What are the key components of the incident response plan within the architecture?


    • How does the system architecture align with relevant cyber security regulations
    and compliance standards?


    • What documentation is available to demonstrate adherence to industry-specific
    security requirements?


    • Are there secure coding practices incorporated into the development process?


    • Are developers trained on best practices for preventing common security vulnerabilities?


    • How is user authentication implemented, and what methods are used to ensure
    strong password security?


    • How are authorisation checks enforced to control user access rights?


    • Are there processes in place to regularly update and patch dependencies?


    • How are security considerations incorporated into the code review process?


    • Is there a focus on identifying and addressing security-related code vulnerabilities?


    • What resources and training opportunities are available to developers to stay
    updated on evolving cyber security threats and best practices?


    • How is knowledge sharing encouraged within the development team to enhance overall
    security awareness?


    By posing these questions, business analysts can facilitate a dialogue that ensures
    cyber security considerations are addressed at both the architectural and implementation
    levels of the project. This collaboration enables the creation of more secure
    and resilient systems.


    Testing phase


    While testing is not the primary focus of the business analyst’s role, they do
    play a significant role in ensuring the quality and effectiveness of the solutions
    they help to design and implement. The involvement of a business analyst in testing
    activities varies depending on the organisation, project and specific phase of
    the project life cycle.


    With reference to testing, the BABOK v3 typically addresses aspects related to
    the verification and validation of solutions during the requirements and implementation
    phases. It also outlines knowledge areas that are particularly relevant to testing,
    such as:


    • **Requirements analysis and design definition:** BABOK v3 emphasises the importance
    of validating requirements and designs to ensure that they meet stakeholder needs.
    Testing is a key activity within this knowledge area to verify that the specified
    requirements and designs are accurate and aligned with business objectives.


    • **Solution evaluation:** This knowledge area involves assessing the performance
    of implemented solutions. Testing plays a crucial role in this phase to confirm
    that the solution functions as intended and satisfies the specified requirements.
    It includes both formal testing processes and user acceptance testing.'
