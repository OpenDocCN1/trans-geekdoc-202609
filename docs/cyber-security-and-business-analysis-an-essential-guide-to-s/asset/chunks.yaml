    ## 作者


    **Bindu Channaveerappa** 是一名业务分析顾问，对业务分析的一切充满热情。认识到网络安全分析的迫切需求，Bindu 热情倡导将网络安全整合到主流业务分析实践中，并在该领域做出了重要贡献。她共同撰写了国际业务分析协会（IIBA®）的网络安全认证（CCA）课程大纲，并为
    CCA 和认证业务分析专业人员（CBAP）认证塑造了考试题目，为 IIBA 标准和 IIBA 数字资产的发展做出了贡献。


    Bindu 在国际会议和在线平台上分享业务分析和网络安全的见解。


    在她的职业追求之外，Bindu 担任 IIBA 欧洲、中东和非洲地区总监，并曾担任 IIBA 英国分会的董事之一。此外，Bindu 还将时间奉献给 Brahma
    Kumaris 世界精神大学，倡导一种促进全球范围内整体人类福祉的精神生活方式。


    ## 前言


    确保组织资产安全，特别是数据和其他机密信息的安全，多年来一直是人们关注的问题。随着对这些资产的在线访问增加以及技术环境复杂性的提升，这一需求已变得势在必行。然而，在追求技术措施的过程中，诸如理解网络安全背景、进行详细调查和分析、以及确定应对网络安全威胁的相关行动等关键活动往往被忽视。此外，这些关键分析活动需要广泛的知识和技能。


    关于网络安全及其保护组织免受威胁的必要性，已有大量论述。太多的关注仅集中在特定的在线威胁上，回避了更广泛的环境和维度，在这些环境和维度中，其他安全威胁可能被利用且也需要采取行动。在不了解特定组织背景和需要保护的资产性质的情况下就急于采用保护性解决方案，可能导致行动无关、过度或不足。


    *Cyber Security and Business Analysis* 将业务分析置于成功的网络安全战略的核心。它解释了业务分析是确保组织能够识别、分析和防范网络安全威胁的关键学科。所提供的指导倡导采用整体方法，并使不同类型的资产、所面临威胁的性质以及所需的安全级别保持一致。业务分析师运用分析性思维，专注于理解问题的根本原因、质疑假设并挖掘详细需求。他们理解非功能性需求的重要性以及需要对其进行详细分析，而不仅仅是
    superficial 地浏览。没有这种深度，可能实施不当甚至不足的安全措施，从而使资产面临风险。

