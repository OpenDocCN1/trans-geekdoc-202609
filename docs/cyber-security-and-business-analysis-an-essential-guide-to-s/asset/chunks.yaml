    ## SUSTAINING THE INNER COMPASS

    Being ethical is not just a moral imperative but an intrinsic characteristic embedded
    in the essence of being human. This inherent ethical dimension shapes human interactions,
    decisions and the pursuit of a harmonious existence. The intricate interplay of
    cognition, emotions and social dynamics contributes to the development of an internal
