    # 序言


    Bindu Channaveerappa 多年来一直在网络安全领域进行研究并应用相关技术和框架，并且作为一名执业业务分析师，她深知访问、安全和保护需求可能被忽视或分析不充分。在本书中，她提供了丰富的框架、参考资料和技术，每一项都支持业务分析师为其组织提供最重要服务之一。她强调风险评估的重要性，以及在评估风险时避免偏见的必要性，以确保网络安全政策和应对措施的相关性和适用性。她还确保突出人的因素，阐明理解不仅是协作利益相关者，而且是意图损害组织及其资产的网络恶意行为者的动机的重要性。关键的是，她指出了网络安全战略的财务影响，建议包含业务案例要素，以阐明财务影响并确保提出网络安全建议的理由。


    业务分析和网络安全框架以及本书中分享的技术非常需要扩展业务分析工具包，帮助业务分析师确保其组织获得最相关的建议，并使组织领导者能够就网络安全保护做出明智的决策。本书为所有致力于保护组织免受网络威胁、确保组织资产免受滥用、损害或破坏、并构建安全稳健系统的业务变革和
    IT 专业人员提供了宝贵的指导。


    **Dr Debra Paul**


    首席执行官 AssistKD


    ## 致谢


    本书若没有众多个人和业务分析社区的不可思议的支持和鼓励就不可能实现。


    首先，我要向 Janice McNamara 表示最深切的感谢，她在我自己之前就看到了我在这本书方面的潜力，并在我心中种下了最终成长为这个项目的种子。您对我的信任一直是指引我的明灯，我永远感激您的远见和鼓励。


    我还要感谢在写作过程中提供宝贵反馈的敬业审阅者。Aubrey Kudzai Muchenje 和 Martin Pendlebury——你们的见解和建议对塑造最终手稿至关重要，我感谢你们的时间和努力。


    我衷心感谢所有为本书提供支持的声音的人：Adrian Reed, Angela Wick, Fabricio Laguna, Filip Hendrickx,
    Kevin Brennan, Aubrey Kudzai Muchenje, Iurii Gomon, Mark Cross, Martin Pendlebury,
    Nick de Voil, Dr Penny Pullan, Richard Harrison 和 Victoria Banner。你们的言语和支持增加了显著的价值和可信度。Debra
    Paul，感谢您宝贵的反馈、信任和认可。


    特别感谢 Heather Wood 在我最意想不到的时候联系我谈论撰写这本书，并在整个旅程中给予我坚定不移的支持。您的耐心、理解和鼓励对于将这个项目完成至关重要。我还要感谢
    Ian Borthwick、Florence Leroy 和 Sharon Nickels 的出版专业知识。


    最后，感谢 Brahma Kumaris 精神组织，他们在我的人生旅程中给予了巨大的帮助，用我一路收集到的无价智慧丰富了我的生活。正是我现在将这份见解和经验的财富注入到这一倡议的核心。


    感谢大家成为这段旅程的一部分。你们的鼓励和热情一直是这一倡议的持续动力源泉。


