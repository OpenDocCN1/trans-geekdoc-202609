- raw: '• **Underlying competencies:** The underlying competencies section of the
    BABOK v3 includes skills and knowledge related to communication, analytical thinking
    and solution assessment and validation. These competencies are essential for effective
    testing processes, including communication with stakeholders and the ability to
    analyse and validate the correctness of implemented solutions.


    • **Techniques:** Finally, the BABOK v3 introduces various techniques that can
    be applied during the testing process, such as acceptance and evaluation criteria,
    and validation. These techniques guide business analysts in ensuring that the
    delivered solutions meet the defined criteria and address business needs.


    Business analysts, as per the BABOK v3, should collaborate with other stakeholders,
    including testing professionals, to ensure the quality and effectiveness of the
    solutions being delivered. The goal is to validate that the solutions meet the
    defined requirements and contribute to achieving the desired business outcomes.


    Cyber security extension


    Business analysts can support in:


    • Performing requirements validation by collaborating with cyber security experts
    to validate that security requirements are adequately reflected in the overall
    requirements. Ensure that security controls, data protection measures and compliance
    requirements are explicitly addressed.


    • Testing planning by working closely with cyber security teams to incorporate
    specific security testing objectives, such as penetration testing, vulnerability
    assessments and compliance checks, into the overall test plan.


    • Supporting test case design by collaborating with cyber security experts to
    identify and design test cases specifically focused on security aspects. This
    includes testing for confidentiality, integrity, availability and resilience of
    the system.


    • Performing user acceptance testing (UAT) by working with end users to validate
    that security features and controls align with their expectations. Educate users
    on cyber security best practices and gather feedback on the user experience with
    security measures.


    • Supporting defect management activities by helping to prioritise and communicate
    cyber security-related defects, emphasising the potential impact on data security,
    compliance and overall system integrity.


    • Documenting by collaborating with the cyber security team on the test results
    and findings. Also, support the documenting of security controls, configurations
    and any adjustments made during the testing phase.


    By incorporating these cyber security considerations into testing activities,
    business analysts can contribute to building a secure and resilient system that
    not only meets business requirements but also aligns with the organisation’s cyber
    security objectives. This collaborative approach helps to identify and address
    security vulnerabilities earlier, thereby shifting the cyber security considerations
    left in the development life cycle.


    SUMMARY


    The concept of ‘shifting left’ in cyber security took centre stage in this chapter,
    emphasising the strategic integration of security considerations and controls
    at the early stages of the software development and IT operations life cycle.
    The primary goal is to proactively address security vulnerabilities and risks,
    minimising the likelihood of security issues and mitigating their potential impact
    during later stages.


    The chapter underscores the imperative nature of making cyber security an integral
    part of discussions throughout the entire project life cycle. By advocating for
    the incorporation of cyber security alongside all other project deliverables,
    you are setting the stage for a proactive and holistic approach to security. Recognising
    the unique context of each organisation and project, it emphasises that there
    is no one-size-fits-all solution to cyber security, or security in general.


    To address security vulnerabilities at the earliest stages, this chapter has provided
    practical pointers aimed at bringing pertinent cyber security conversations to
    the table during every phase of the project. These pointers serve as guidelines,
    encouraging a security mindset and the involvement of security expertise at crucial
    junctures. The overarching aim for a business analyst is asking the right questions
    at the right time, ensuring that cyber security is not an afterthought but an
    integral part of the project’s DNA.


