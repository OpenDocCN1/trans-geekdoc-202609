- raw: 'In his article ‘Data is the New Currency. Don’t Let It Slip Through Your Fingers’,
    Peter Daisyme underscores data’s paramount importance as the primary currency
    in the digital age, surpassing other technological developments. He highlights
    the evolution of data’s role in businesses, emphasising the untapped potential
    within dark data. While acknowledging the prevalent focus on high-level data,
    his article advocates for a more comprehensive approach, stressing the need to
    handle data correctly from the start. A robust data strategy, including identification,
    organisation and analysis, is essential. The article recommends leveraging technology,
    such as data observability applications, to transform unstructured data into valuable
    insights throughout the organisation. Cultivating a data-driven culture is seen
    as crucial, and the article concludes by outlining steps for companies to harness
    the power of data as the currency of the future, emphasising commitment, technology
    adoption and growth-oriented organisational culture (Daisyme, 2023).


    As per Alice Nunwick’s article, ‘Data to Become New Currency in the Age of AI,
    Says Analyst’ (Nunwick, 2023), in an industry update, GlobalData principal analyst
    Natasha Rybak asserts that data will be the new currency in the age of AI, emphasising
    the pivotal role of high-quality datasets for effective AI tools. Rybak contends
    that businesses aiming to maximise their data’s value must make substantial investments
    in refining and displaying data, requiring significant time, unimpeded access
    and adherence to legal requirements.


    Rybak delves into legal issues and use cases surrounding personal data owned by
    major businesses such as Meta, Walmart and Sky. Both Sky UK and Walmart utilise
    personal and behavioural data to personalise customer experiences. Sky UK’s Search
    Behaviour tool, for example, enables precise audience targeting based on metrics
    such as location and age. However, Rybak notes potential legal challenges, citing
    Meta’s recent troubles with Norway’s data protection agency over personalised
    advertisements. Rybak compares data to ‘diamonds in the rough’ for businesses
    implementing AI, a sentiment echoed by others. International Competition Network
    chair Andreas Bundt warns that AI could reinforce ‘Big Tech’ dominance due to
    their extensive data holdings, potentially disadvantaging smaller AI startups.
    Businesses aiming to leverage AI must recognise the value of their data and navigate
    the legal considerations associated with their use.


    These articles emphasise the critical role of data in the contemporary digital
    landscape. Peter Daisyme’s piece spotlights data as the primary currency, stressing
    the need for a comprehensive approach to handling it correctly from the beginning,
    focusing on a robust data strategy, technology adoption and fostering a data-driven
    organisational culture. Alice Nunwick’s article discusses how data will be the
    new currency in the age of AI, emphasising the importance of high-quality datasets
    for effective AI tools. The common thread in both articles is the recognition
    of data as valuable assets and the need for businesses to strategically manage,
    refine and protect them in the evolving technological landscape.


    Through a business analyst’s lens, the crux lies in recognising the pivotal role
    of data in today’s digital landscape. Ultimately, a business analyst working closely
    with data and governance teams should grasp the centrality of data, embrace a
    holistic approach to their management, stay attuned to legal implications and
    view data as a strategic asset vital for business resilience.


    A data risk framework


    Sarah Telford and Stefaan G. Verhulst, in their article ‘A Framework For Understanding
    Data Risk’ (Telford and Verhulst, 2016), introduce a comprehensive framework for
    assessing and managing data risk within organisations, developed in collaboration
    with the Harvard Humanitarian Initiative. This framework provides a structured
    approach for organisations to navigate and mitigate data risks throughout the
    entire data life cycle.


    This framework guides organisations through a systematic process, starting with
    an assessment that scrutinises the context of data generation and sharing, including
    anticipated benefits and potential threats. The subsequent step involves conducting
    a detailed data inventory covering storage locations and accessibility. Identifying
    potential risks and harms, such as data correlation or breaches, prepares staff
    for various scenarios. The framework concludes with implementing countermeasures,
    including developing data handling policies, implementing access controls and
    providing staff training on responsible data use. For business analysts, this
    systematic and thorough framework offers a valuable tool to navigate and mitigate
    data risks throughout the entire data life cycle in organisations, aligning with
    their role in strategically managing, refining and protecting data in the evolving
    technological landscape.


    The Big Data disaster


    The study conducted by Sean Martin McDonald with support from the Open Society
    Foundation, Ford Foundation and Media Democracy Fund, titled ‘Ebola: A Big Data
    Disaster’ (McDonald, 2016), explores the use of Big Data, specifically call detail
    record (CDR) data, in humanitarian crises such as the Ebola outbreak in West Africa.
    The research emphasises the challenges of digital humanitarian coordination, particularly
    regarding privacy concerns and the impact on human rights. McDonald focuses on
    legal frameworks related to privacy and property, questioning the unregulated
    use of CDRs and highlighting the potential opportunities and risks of applying
    data science to international development. The paper raises important legal questions
    about information access, data sharing limitations and privacy invasion proportionality
    in the context of the public good. It emphasises the need for critical dialogue
    around the experimental nature of data modelling in emergency responses to safeguard
    human rights. The study offers a valuable perspective for organisations like the
    Centre for Internet and Society, advocating for critically examining Big Data’s
    implications for human rights and sustainable development.


    From a business analyst’s perspective, the study demonstrates the challenges and
    opportunities in employing large datasets during emergencies, providing insights
    into the legal frameworks and privacy considerations surrounding data use. It
    emphasises ethical concerns related to experimenting with humanitarian technologies
    and their impact on privacy, which is crucial for business analysts involved in
    data-driven projects. The analysis of risks associated with using CDRs without
    user consent informs business analysts engaged in risk assessment and management,
    particularly in fields such as public health or crisis response. Understanding
    the implications of Big Data on human rights and sustainable development is essential
    for socially responsible business practices, broadening the analyst’s perspective
    on the ethical dimensions of data usage. Lastly, the article calls for critical
    discussions on the experimental nature of data modelling in emergency responses,
    urging business analysts to engage in conversations around responsible data use
    and its potential impact on human rights within their organisations.


    In essence, these emerging data trends accentuate the imperative for organisations
    to adopt strategic, ethical and comprehensive approaches to data management. Understanding
    and navigating the challenges and opportunities associated with data can become
    vital aspects of a business analyst’s role in the evolving digital landscape.


