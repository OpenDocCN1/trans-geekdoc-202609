- raw: 'Business analysts can facilitate workshops and discussions to identify and
    document risks, including information security risks, across all the systems and
    processes in the organisation. They also can conduct stakeholder analysis to identify
    and understand the perspectives, interests and potential risks associated with
    different stakeholders, which helps to anticipate and address stakeholder-related
    risks. Business analysts, in collaboration with the security and IT teams, can
    identify and document assets, vulnerabilities, threats and potential impacts in
    a risk register, using analytical techniques such as SWOT (strengths, weaknesses,
    opportunities, threats) and PESTLE (political, economic, sociological, technological,
    legal and environmental) analysis to uncover potential threats and opportunities.


    Risk analysis


    The identified risks undergo analysis based on the criticality of the assets involved.
    This analysis aims to determine both the frequency and probability of the threat
    manifesting and the potential extent or magnitude of the impact if the threat
    were to materialise. These risks are then categorised either qualitatively or
    quantitatively. Finally, the overall business impact is assessed, which involves
    factors including financial and operational, and non-tangible impacts such as
    reputational or impacting an individual’s life, livelihood, society or ecosystem.


    Business analyst support


    Business analysts can play a crucial role in collaborating with stakeholders to
    assess and analyse identified risks, evaluating their likelihood, impact and overall
    business implications. They are adept at performing both qualitative and quantitative
    analyses to determine the level of risk exposure. They can support stakeholders
    in prioritising the risks based on their potential impact on project objectives.
    By offering valuable insights, they help stakeholders to make informed decisions
    to strategically manage the most critical and high-impact risks.


    Risk evaluation


    The third step of the assessment is risk evaluation, a process of making informed
    decisions regarding risk treatment and response strategies. It involves determining
    the significance of the analysed risks and prioritising them based on their potential
    impact on achieving the business or project objectives.


    Business analyst support


    Business analysts can support prioritising the risks based on their potential
    impact on business or project objectives and in the decision-making process to
    manage the most critical risks.


    They can develop risk mitigation plans by suggesting alternative approaches, proposing
    changes to project scope, schedule or resources, identifying dependencies and
    assessing the feasibility of risk mitigation decisions and strategies.


    Risk treatment


    As illustrated above, the risk treatment process is the next phase in the ISO
    31000 risk management process. It involves strategies and activities to manage
    the risks following their effective assessment. Risk treatment aims to reduce
    the likelihood or impact of the risks to levels acceptable to the organisation
    and aligned with its risk appetite. A risk treatment is identified, which could
    be to accept the risk, avoid it, reduce it or modify it, and share or transfer
    the risk depending on the nature and context within the organisation.


    **Risk acceptance** is consciously and objectively accepting the risks, doing
    nothing about them now and responding if they manifest. It is acknowledging that
    a certain level of risk is acceptable. For example, making a decision not to invest
    in additional security measures for a low-impact system that does not store sensitive
    information.


    **Risk avoidance** entirely prevents a particular risk by avoiding or withdrawing
    from activities, situations or circumstances that could cause that risk to manifest.
    For example, avoiding using a vulnerable system or piece of software no longer
    supported by the vendor or when the costs of implementing the treatment exceed
    the benefits.


    **Risk reduction** is a strategy to reduce the likelihood or impact of a risk
    by bringing the risk level down to a more acceptable level, known as the residual
    risk. Risk reduction helps organisations strategically balance managing risks
    and achieving their objectives. For example, security controls and measures implemented,
    such as encryption, authentication firewalls, etc., reduce the likelihood and
    impact of a cyber security incident.


    **Risk sharing** is sharing the responsibility of the risk with other parties,
    such as insurers or suppliers. The strategy is to distribute the risk among different
    entities to mitigate or lessen the financial load on the organisation. Risk sharing
    or transfer can be partially or fully outsourced. For example, outsourcing either
    a part of or complete payment processing capabilities or obtaining cyber security
    insurance to transfer the financial consequences of a data breach to an insurance
    provider mitigates the impact on the organisation’s financial resources.


    Business analyst support


    Business analysts can conduct a cost–benefit analysis to assess the effectiveness
    and feasibility of risk reduction measures by evaluating the costs associated
    with implementing risk reduction strategies against the potential benefits in
    terms of risk reduction.


    They can assist in prioritising the identified risk treatment options based on
    their alignment with organisational objectives and identify resource constraints
    and the potential trade-offs between different treatment strategies.


    They can assess the effects of risk treatments on current business processes or
    the introduction of new processes, as well as anticipate the potential ripple
    effects on project scope, timelines, budgets and deliverables.


    Business analysts can support project managers in creating detailed risk treatment
    plans that outline the actions, responsibilities, timelines and resources required
    to implement the selected risk treatment strategies. They then need to update
    the requirements catalogue and other relevant project documentation to ensure
    the changes are implemented within the processes and systems.


    They can liaise between technical and non-technical stakeholders to achieve a
    shared understanding of risks and their management strategies, and facilitate
    communication and decision-making.


    Monitoring and review


    Risks are not static. The likelihood and impact constantly fluctuate, depending
    on the organisation’s internal and external environment. Hence, regular monitoring
    is necessary to detect changes at an early stage and maintain the overall risk
    posture. Monitoring and reviewing ensures that the organisation remains adaptive
    and responsive to changes, with continuous improvement based on review feedback.


    Business analyst support


    Business analysts can support the establishment of mechanisms for continually
    monitoring the identified risks and the effectiveness of risk treatment plans.
    They can support in developing reporting mechanisms that provide insights to decision-makers
    and support ongoing improvement.


    They can collaborate with stakeholders to define key performance metrics and indicators
    related to risk management processes, and facilitate the design of dashboards
    or reporting mechanisms.


    They can also support monitoring of the status of identified risks throughout
    the project life cycle, assist in tracking the effectiveness of risk mitigation
    strategies and provide regular updates to stakeholders and project teams. Reporting
    on risk status helps in maintaining awareness and facilitating timely decision-making.


    Communication and consultation'
