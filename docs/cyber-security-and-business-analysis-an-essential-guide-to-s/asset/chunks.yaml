- raw: '• Facilitating requirements reviews with cyber security stakeholders to gain
    consensus on functional and non-functional requirements impacting cyber security
    requirements.


    • Establishing a change control process, including impact assessment on cyber
    security requirements.


    Strategy analysis


    The Strategy Analysis knowledge area provides guidance to ensure that business
    analysis efforts support the overall strategic direction of the organisation.


    As listed in BABOK v3, the Strategy Analysis knowledge area includes analysing
    the current state, defining the future state, assessing the risk and defining
    change strategy tasks. Aligning cyber security with organisational goals is essential
    for protecting data assets and sensitive information.


    Extension to cyber security


    ***Prerequisites*** Understanding the cyber security objectives within the organisation’s
    overall business strategy, cyber security posture, concerns, risks, current measures,
    vulnerabilities and threat landscape. Recognising the potential impact of cyber
    security incidents on the business needs and the organisation.


    ***Activities***


    • Assessing the current state with cyber security considerations such as security
    posture, capabilities and vulnerabilities.


    • Facilitating risk assessments on current business processes and systems with
    security considerations.


    • Evaluating the effectiveness of existing cyber security controls implemented
    within the current business processes and systems.


    • Defining cyber security goals and objectives within the overall business goals
    and objectives for the future state.


    • Identifying and assessing cyber security risks associated with the proposed
    business changes and the transition to the future state.


    • Defining change strategy with cyber security considerations such as resilience
    and organisation culture.


    Requirements analysis and design definition


    The Requirements Analysis and Design Definition knowledge area focuses on the
    processes and activities involved in analysing requirements and designing a solution
    by translating the business needs into a well-defined solution that can be implemented.


    As stated in BABOK v3, the Requirements Analysis and Design Definition knowledge
    area includes specifying and modelling requirements, verifying requirements, validating
    requirements, defining requirements architecture, defining solution options, analysing
    potential value and recommending solutions. The cyber security extension ensures
    that the solution meets business needs and incorporates measures to protect against
    cyber threats.


    Extension to cyber security


    ***Prerequisites*** Understanding the cyber security objectives within the organisation’s
    overall business strategy, cyber security posture, concerns, risks, current measures,
    vulnerabilities and threat landscape. Recognising the potential impact of cyber
    security incidents on the business needs and the organisation.


    ***Activities***


    • Creating visual models that include cyber security controls within the business
    process.


    • Creating detailed cyber security requirements within overall functional requirements.


    • Creating misuse cases along with use cases.


    • Creating ‘bad’ actors as part of user personas.


    • Creating vulnerable scenarios along with happy and alternate scenarios.


    • Ensuring that cyber security assumptions and constraints are part of overall
    project assumptions and constraints and communicated to stakeholders, including
    cyber security.


    • Verifying that the cyber security requirements are adhering to the relevant
    regulations and standards.


    • Validating cyber security requirements by the relevant cyber security stakeholders
    to ensure that the requirements will lead to a resilient solution.


    • Documenting the rationale behind cyber security design decisions along with
    all evaluated options.


    • Identifying and documenting any temporary cyber security requirements for transitional
    processes and secure transition of the solution.


    • Defining roles and responsibilities for managing a cyber security incident.


    • Documenting incident detection and response mechanisms that align with the organisational
    security policies.


    • Documenting processes for analysing and responding to emerging cyber threats.


    • Incorporating cyber security into the ongoing analysis and design processes,
    and fostering continual collaboration between functional teams and cyber security
    experts throughout the development life cycle.


    Solution evaluation


    The Solution Evaluation knowledge area focuses on the processes and activities
    involved in assessing and validating the performance and value delivered by a
    solution to ensure that the implemented solution meets the business needs and
    provides the expected value and identified benefits to stakeholders.


    As stated in BABOK v3, the Solution Evaluation knowledge area includes measuring
    solution performance, analysing performance measures, assessing solution limitations,
    assessing enterprise limitations and recommending actions to increase solution
    value. The cyber security extension ensures that the evaluation process accounts
    for cyber security measures, identifies potential security risks and verifies
    that the solution effectively mitigates those risks.


    Extension to cyber security


    ***Prerequisites*** Understanding the cyber security objectives within the organisation’s
    overall business strategy, cyber security posture, concerns, risks, current measures,
    vulnerabilities and threat landscape. Recognising the potential impact of cyber
    security incidents on the business needs and the organisation.


    ***Activities***


    • Supporting the security and technical teams in defining cyber security performance
    indicators and metrics based on security objectives.


    • Analysing data on security incidents, vulnerabilities and threat detection.


    • Supporting data analysis teams to identify cyber security incidents or weaknesses.


    • Collaborating with cyber security stakeholders to interpret security performance
    metrics.


    • Using statistical analysis to draw insights from cyber security performance
    data to identify trends, patterns and areas of improvement.


    • Collaborating with cyber security stakeholders to:


    ■ assess system weaknesses and impacts of the identified vulnerabilities on the
    solution’s overall security;


    ■ consider changes in the threat landscape and emerging cyber threats;


    ■ assess how enterprise-level cyber security measures may impact the solution’s
    ongoing security;


    ■ develop recommendations based on the analysis of cyber security limitations
    and vulnerabilities;


    ■ prioritise and implement recommended actions;


    ■ document the expected impact of the proposed changes on the solution;


    ■ collect feedback regarding the perceived effectiveness of security measures
    to compare the achieved cyber security benefits with the expected benefits outlined
    in the security objectives;


    ■ analyse the return on investment (ROI) for cyber security controls and countermeasures.


    • Monitoring user compliance with established security policies and procedures,
    and identifying barriers to cyber security best practice adoption.


    • Establishing a process for regular monitoring of cyber security performance
    indicators.


    • Analysing historical data to identify trends or patterns in security incidents
    to enable informed decisions on enhancing the cyber security posture.


    • Collaborating with cyber security stakeholders to evaluate the ability of cyber
    security controls to handle increased cyber threats to assess scalability.'
