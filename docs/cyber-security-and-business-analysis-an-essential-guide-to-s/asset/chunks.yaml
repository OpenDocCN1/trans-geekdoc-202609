    unaware of the risks they were taking and eventually lost their houses and their
    lives. The third pig knew the threats and built a house that would protect him
    against those threats, and so was protected.


    Business analysis frameworks provide a systematic and disciplined approach to
    address the business need, with knowledge, competencies, techniques and tools
    to identify, define and propose suitable solutions, like the strong brick house.


    While there are various business analysis frameworks as mentioned above, this
    chapter addresses the IIBA knowledge areas, highlighting the cyber security extensions.
    IIBA’s *Business Analysis Body of Knowledge* (2015) (BABOK v3) provides a comprehensive
    guide and framework for the practice of business analysis. It provides a set of
    knowledge areas, tasks, techniques and competencies essential for business analysis.


    As per BABOK v3, knowledge areas are a collection of logically related tasks that
    describe a specific business analysis area. The diagram in [Figure 5.1](#18_ch05.xhtml#fig5-1)
    displays the knowledge areas and the relationships between them.


    ## IIBA’S BUSINESS ANALYSIS KNOWLEDGE AREAS


    The next part of this chapter lists the knowledge areas, and notes the cyber security
    touchpoints. Remember, [Chapter 2](#15_ch02.xhtml) established that business analysts
    can call upon cyber security SMEs as and when the project dictates. The key to
    recognising if any of the project aspects require cyber security SMEs is set out
    in [Figure 2.3](#15_ch02.xhtml#fig2-3), ‘Overview of cyber security knowledge
    for business analysts’, so ensure those SMEs are involved to support the analysis
    accordingly.


    **Figure 5.1 IIBA knowledge areas** (Copyright: International Institute of Business
    Analysis)


    ![](images/Fig5-1.jpg)


    ### Business analysis planning and monitoring


    The Business Analysis Planning and Monitoring knowledge area provides guidance
    on how to effectively plan and manage business analysis activities throughout
    a project or initiative to ensure that business analysis efforts are aligned with
    the overall project objectives and that the business analyst has a clear plan
    to execute their tasks.

