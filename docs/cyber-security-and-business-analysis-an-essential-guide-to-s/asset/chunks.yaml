- raw: 'When the Crown Jewels need to be transported, a highly orchestrated and secure
    operation is executed, reflecting the concept of ‘data in transit’. The jewels
    are carefully moved from the Tower of London to Buckingham Palace, drawing parallels
    with the need for secure data transmission between locations. In this scenario,
    armoured vehicles and meticulous planning represent the equivalent of encrypted
    data transfer protocols and secure networks used to move sensitive data. The careful
    movement of the Crown Jewels parallels the need for secure data transmission protocols
    when moving sensitive information between locations.


    Data in use (worn by the royals)


    The pinnacle of the analogy involves the ‘data in use’ phase, when the Crown Jewels
    are worn by the royals during ceremonial events. Analogously, organisations must
    ensure robust security measures are in place when sensitive data are actively
    used, such as during strategic decision-making, critical business processes or
    when sharing with suppliers and third parties. This includes secure access controls,
    encryption during processing and constant monitoring to prevent unauthorised access
    – equivalent to the vigilance exercised when the royals wear the jewels. The ceremonial
    use of the Crown Jewels by the royals draws parallels to securing data actively
    used in business operations, requiring stringent access controls and encryption
    during processing.


    APPROACH TO DATA SECURITY


    Now that the scope of data security and cyber security is established, the approach
    to security will remain the same as cyber security, which is identifying the risks
    with a security mindset.


    In the previous chapters, we discussed how business analysts can extend their
    analysis to support security and technical teams in addressing cyber security
    needs. Similarly, below are some of the ways business analysts can collaborate
    with stakeholders to support data security activities:


    • **Requirements elicitation** – business analysts can work closely with business
    and security stakeholders to elicit and document data security requirements. This
    involves understanding business processes, identifying sensitive data and determining
    security needs.


    • **Risk analysis and assessment** – business analysts can support security and
    data teams by conducting risk analysis and assessments related to data security.
    This includes identifying potential risks to data assets, assessing their impact
    and proposing mitigation strategies.


    • **Data classification** – business analysts can collaborate with stakeholders
    to classify data based on sensitivity and criticality. Establishing a data classification
    framework helps to prioritise security measures.


    • **Privacy impact assessments (PIAs)** – business analysts can assist data teams
    in conducting PIAs to evaluate the potential impact of projects on privacy and
    data protection, ensuring compliance with relevant regulations.


    • **Policy and procedure development** – business analysts can work with relevant
    governance teams to develop and document data security policies and procedures.
    This involves translating security requirements into actionable guidelines.


    • **Data flow diagrams** – business analysts who work in technical teams (can
    also be called systems analysts) can support data and technical teams by creating
    data flow diagrams to illustrate how data move within the organisation. This visual
    representation helps to identify potential security vulnerabilities and points
    of control.


    • **Incident response planning** – business analysts can contribute to the development
    of incident response plans by defining procedures for detecting, reporting and
    responding to security incidents related to data breaches.


    • **Security awareness training** – business analysts can participate in creating
    and delivering security awareness training for teams handling sensitive data.
    This ensures that everyone is aware of their role in maintaining data security.


    • **Continuous improvement** – business analysts can engage in continuous improvements
    by analysing security incidents, lessons learned and feedback, and propose enhancements
    to security measures based on evolving threats and technology changes.


    While business analysts may not possess exhaustive knowledge of data security
    requirements, given that it falls within the domain of security teams, their analytical
    skills, effective communication abilities and understanding of business operations
    allow them to cultivate collaboration between business, governance, IT and security
    teams. As a bridge between stakeholders, business analysts can play a pivotal
    role in ensuring that data security considerations are seamlessly integrated into
    business processes and systems, enhancing the organisation’s overall security
    posture.


    Securing the flows


    Securing a process flow against cyber security threats and risks, including safeguarding
    data (at rest, in transit and in use), requires a collaborative and multidisciplinary
    approach that involves understanding the process, implementing security controls
    and ensuring compliance. While business analysts may not be cyber security experts,
    they can play a crucial role in securing the process flows.


    Business analysts can collaborate with stakeholders to identify critical assets
    and sensitive data within the processes and facilitate risk assessments to evaluate
    potential threats. They can also actively participate in classifying data based
    on sensitivity and defining appropriate handling procedures, addressing data at
    rest, in transit and in use.


    Business analysts can contribute to securing data transmission by understanding
    and documenting how data are communicated between different components of the
    process flow. Collaborating with IT and security teams, business analysts can
    contribute to implementing access controls, emphasising role-based access and
    the principle of least privilege for data in use.


    Furthermore, business analysts can contribute to incident response planning, documenting
    procedures for responding to cyber security incidents and defining roles and responsibilities
    for a coordinated response.


    Finally, they can influence fostering a culture of continuous improvement to ensure
    that security measures within the processes are regularly reviewed and updated
    based on changes in the business environment and emerging threats.


    ![Icon: Head with gears facing left.](images/icon1.jpg)


    REFLECTION TIME


    Take a moment, ponder and write down:


    • How is your organisation protecting customer data, and are there ways to make
    it even more secure to comply with data protection rules?


    • Have you looked into getting valuable insights from all your data, including
    untapped information, that could improve your decision-making?


    EMERGING DATA TRENDS TO MONITOR


    Before concluding this chapter, let’s explore a few noteworthy data trends that
    are especially pertinent for business analysts closely collaborating with data,
    governance and security teams.


    Data are the new currency'
