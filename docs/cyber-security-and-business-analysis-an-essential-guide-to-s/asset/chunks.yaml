    ## PREFACE


    Why this book?


    In today’s digital age, the imperative of cyber security has never been more pronounced.
    With the pervasive integration of technology in every aspect of our lives, the
    need to safeguard sensitive information and digital assets has become paramount.


    I’ve navigated through many projects and initiatives, each presenting its unique
    challenges and opportunities. Yet, it was a singular event – a cyber incident
    – that served as a pivotal moment in my career, catalysing a profound realisation
    of the critical role cyber security plays in organisational resilience and success.


    Though seemingly minor at first glance, the incident revealed that the organisation
    was ill-prepared to confront escalating cyber threats. Despite my efforts to raise
    awareness and advocate for proactive cyber security measures, the gravity of the
    situation went largely unrecognised by senior management. It was a wake-up call,
    a stark reminder of the potential loss and devastation that could have ensued
    had the incident escalated unchecked.


    Fuelled by a sense of urgency and determination, I embarked on a journey of discovery
    and studied security management. With this newfound knowledge, I sought to bridge
    the gap between traditional business analysis and cyber security. I found the
    role of business analysts pivotal in supporting the development and maintenance
    of secure and robust systems.


    This newfound passion led me to collaborate as a co-author on the IIBA Cybersecurity
    Certification and to take this message to the business analysis communities at
    conferences worldwide, advocating for the holistic integration of cyber security
    within their analysis practices.'
