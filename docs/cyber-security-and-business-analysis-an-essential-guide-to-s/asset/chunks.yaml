- raw: 'In the vein of former president of the United States James Madison’s insight
    that philosophy is common sense with big words, I am inclined to believe that
    business analysis is common sense with structure. Every time I attend a business
    analysis training session, a profound realisation dawns that everything learned
    seems inherently logical, akin to common sense. Yet, I had to attend the training
    to realise and be reminded. Much as the imperative nature of cyber security or
    security at large is an integral aspect of everyone’s responsibility, this, too,
    requires periodic acknowledgement and reinforcement to recalibrate our cognitive
    constructions. The elusive nature of common sense, a treasure not universally
    abundant, emerges as an invaluable asset across all professions, accentuating
    its pivotal role within the realm of business analysis.


    Philosophy is common sense with big words.


    Business analysis is common sense with structure.


    The multifaceted landscape of business analysis demands an amalgamation of skills,
    techniques, tools and methodologies, all orchestrated to foster a disciplined
    and structured practice. Professional business analysts undergo training, acquiring
    specialised skills that empower them to effectively navigate the intricate terrain
    of analysing business needs. In essence, common sense, elevated to a structured
    plane, becomes the blueprint for effective business analysis.


    THE SECOND PILLAR


    Business analysts leverage many different models and frameworks including, but
    not limited to, the Ansoff Matrix, Debra Paul’s Business Analysis Service Framework
    (BASF), Porter’s Five Forces Model, IIBA’s knowledge areas, Boston Consulting
    Group’s Growth Share Matrix, PESTLE and SWOT analysis. Each of these models brings
    its unique focus areas, accompanied by distinctive strengths and weaknesses. Nevertheless,
    as the analysis unfolds, a common destination emerges, which is the shaping up
    of requirements essential for addressing the identified business needs. These
    diverse models and frameworks offer a structured and comprehensive approach to
    the intricate landscape of business analysis, guiding analysts through a systematic
    exploration of the business environment and the needs leading up to the solutions.


    Storytime: The Three Little Pigs


    This is one of the stories I read in my early school years, only to realise the
    meaning of the fable later in adulthood. The importance of checking the intention
    before an initiative, to check what is being built, will serve the intended purpose,
    is a critical factor especially within the business analysis context. The story
    has been slightly modified here to deliver the intended message.


    Once upon a time, there were three little pigs. It was time for them to leave
    their home, make their way in the world and build houses for themselves. Their
    mother had guided and taught them well, and before they left she reminded them
    always to work hard and think before acting. The first little pig was lazy, chose
    the easier option to get by and paid too little heed to her advice. The second
    little pig tried to make sense of the advice but lost interest and gave up. The
    third little pig was wise and always was keen to take his mother’s advice.


    So, the three little pigs set off. They met a man carrying a bundle of straw,
    and the first little pig, without much thinking, bought the straw to build his
    house. The other two were not convinced and continued on their journey. Then they
    met a man carrying a bundle of sticks, and the second pig thought sticks were
    stronger than straw, so he bought the sticks to build his house. But the third
    little pig still wasn’t convinced. He needed a stronger house to remain protected
    and continued on his journey. He met a man with a cartload of bricks. He thought
    this was what he needed to build a strong house and bought the bricks from the
    man.


    All the three pigs now had their own houses.


    A few days later, a hungry wolf came along and wanted to eat the pigs. He knocked
    on the straw house door and asked the first pig to let him in. When he wasn’t
    let in, he blew the house down. The next day, the wolf returned, knocked on the
    stick house door and asked the second pig to let him in. When he wasn’t let in,
    he blew again and the stick house went down. The following day, the wolf came
    back, knocked on the brick house door and asked the third pig to let him in. When
    he wasn’t let in, he blew and nothing happened. He blew repeatedly, and still
    nothing happened to the house. So the wolf decided to enter the house through
    the chimney. As he was walking on the roof, the wise pig put a cauldron on the
    stove and started to boil the water. The wolf, who was trying to get in through
    the chimney, now had no chance as he would be scalded, and so he ran away for
    his life. The third pig, who had built a strong house, was safe.


    The story brings out three important lessons, among others:


    1. The need to clearly understand the intention behind the objective. Although
    the aim was to build a house, the intention was to be protected against dangers.


    2. The need to clearly understand the dangers. Unless the nature of the threats
    is known, a suitable solution cannot be built.


    3. It takes knowledge and effort to build the required solution.


    The first pig wasn’t prepared to put in the effort and went for the easy option,
    and the second pig didn’t know how to make the right choice, so they were both
    unaware of the risks they were taking and eventually lost their houses and their
    lives. The third pig knew the threats and built a house that would protect him
    against those threats, and so was protected.


    Business analysis frameworks provide a systematic and disciplined approach to
    address the business need, with knowledge, competencies, techniques and tools
    to identify, define and propose suitable solutions, like the strong brick house.


    While there are various business analysis frameworks as mentioned above, this
    chapter addresses the IIBA knowledge areas, highlighting the cyber security extensions.
    IIBA’s *Business Analysis Body of Knowledge* (2015) (BABOK v3) provides a comprehensive
    guide and framework for the practice of business analysis. It provides a set of
    knowledge areas, tasks, techniques and competencies essential for business analysis.


    As per BABOK v3, knowledge areas are a collection of logically related tasks that
    describe a specific business analysis area. The diagram in [Figure 5.1](#18_ch05.xhtml#fig5-1)
    displays the knowledge areas and the relationships between them.


    IIBA’S BUSINESS ANALYSIS KNOWLEDGE AREAS


    The next part of this chapter lists the knowledge areas, and notes the cyber security
    touchpoints. Remember, [Chapter 2](#15_ch02.xhtml) established that business analysts
    can call upon cyber security SMEs as and when the project dictates. The key to
    recognising if any of the project aspects require cyber security SMEs is set out
    in [Figure 2.3](#15_ch02.xhtml#fig2-3), ‘Overview of cyber security knowledge
    for business analysts’, so ensure those SMEs are involved to support the analysis
    accordingly.


    **Figure 5.1 IIBA knowledge areas** (Copyright: International Institute of Business
    Analysis)


    ![](images/Fig5-1.jpg)


    Business analysis planning and monitoring


    The Business Analysis Planning and Monitoring knowledge area provides guidance
    on how to effectively plan and manage business analysis activities throughout
    a project or initiative to ensure that business analysis efforts are aligned with
    the overall project objectives and that the business analyst has a clear plan
    to execute their tasks.'
