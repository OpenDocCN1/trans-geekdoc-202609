- raw: 'The first and second waves gave rise to the third wave, the ‘institutional
    wave’, focusing on the best practices and standardisation of information security
    management such as BS 7799 (from British Standards) and ISO/IEC 17799 (from the
    joint technical committee of the International Organization for Standardization
    and International Electrotechnical Commission).


    Following this was the ‘governance wave’, emphasising corporate governance responsibilities
    such as security objectives and strategies, organisational structure, risk management
    and regulatory and compliance enforcement for managing information security.


    Von Solms also debates the next wave (2000), called the ‘commodity wave’, where
    information security is like any other commodity and no longer an issue. However,
    he challenges himself to whether this wave could be a reality when information
    security is no longer on the radar due to the human dimension.


    Elucidating CIA


    Before proceeding to the final sections of this chapter, let’s explore a selection
    of examples (though not exhaustive) that illustrate how data confidentiality (unauthorised
    information release), integrity (unauthorised information modification) and availability
    (unauthorised denial of use) can be compromised. These examples provide a glimpse
    into the width and depth of information security violations, which will in turn
    help strengthen the security mindset.


    Data breaches


    An attacker gains unauthorised access to a company’s database containing customers’
    personal and sensitive information, such as names, addresses, credit card details
    and so on, causing loss of customer trust, financial loss, legal consequences
    and damage to reputation.


    Phishing attacks


    An attacker tricks individuals into revealing sensitive information, such as usernames
    and passwords, by posing as a trustworthy entity, causing unauthorised access
    to accounts, potential data breaches and compromised personal and sensitive information.


    Data interception and eavesdropping


    An attacker intercepts communication, such as phone calls or network traffic,
    and data in transit, such as unencrypted communication over a network, to access
    confidential information, causing compromised personal and sensitive conversations
    and resulting in exposure to classified information, legal consequences and damage
    to reputation. The following chapters provide more details on data in transit
    and at rest.


    USB dropping


    An attacker leaves infected USB drives in public places, hoping that someone will
    plug them into a computer and thereby unknowingly spread malware, compromise data
    and create unauthorised access to systems, resulting in data breaches, compromised
    personal sensitive information and disruption.


    Brute force attacks


    An attacker attempts to gain unauthorised access to an account or system by systematically
    trying all possible passwords, causing compromised confidentiality and resulting
    in data breaches, financial loss, legal consequences and damage to reputation.


    Data tampering


    An attacker gains unauthorised access to a database and tampers with the financial
    records, such as transactions, amounts or balances, causing incorrect information
    in the database and leading to loss of customer trust, financial loss, legal consequences
    and damage to reputation.


    Document tampering


    An attacker alters important documents, such as contracts or legal agreements,
    and manipulates terms and conditions, which causes legal disputes, financial losses
    and damage to reputation.


    Code or file tampering


    An attacker injects malicious code into software, systems or applications, leading
    to unauthorised modifications in the system or application behaviour that create
    compromised system behaviour and result in data breaches.


    Website tampering


    An attacker gains access to a website and replaces the original content with their
    own, often defamatory content, creating damage to reputation and potential legal
    consequences.


    Database injection or tampering


    An attacker injects malicious SQL commands to manipulate or extract data from
    a database, causing unauthorised access to sensitive information, data breaches,
    legal consequences and damage to reputation.


    Supply chain attacks


    An attacker compromises the integrity of software or hardware during the manufacturing
    or distribution process, causing compromised systems behaviour and resulting in
    data breaches, legal consequences and damage to reputation.


    Insider threats


    An employee with authorised access intentionally or unintentionally tampers with
    data, causing a data breach and resulting in financial loss, loss of customer
    trust, legal consequences and damage to reputation.


    Ransomware attacks


    An attacker demands ransom for decryption keys by encrypting files using malware,
    causing loss of access to organisation data, prolonged systems downtime, performance
    degradation or complete system failure resulting in disruption of operations,
    financial loss, breach of sensitive information, legal consequences and damage
    to reputation.


    Social engineering attacks


    An attacker manipulates individuals into making unauthorised changes to systems,
    causing loss of access to organisation data and resulting in financial loss, breach
    of sensitive information, legal consequences and damage to reputation.


    Distributed denial of service (DDoS) attacks


    An attacker floods a system, network or website with traffic, overwhelming its
    capacity and causing a temporary or prolonged outage, causing disruption of services,
    loss of revenue and damage to reputation.


    Physical theft and infrastructure attack


    An attacker steals physical devices, such as computers, laptops and external drives,
    containing personal and sensitive information, or attacks the underlying infrastructure,
    such as data centres or cloud providers, impacting service availability and causing
    loss of classified information that results in data breaches, financial loss and
    damage to reputation.


    Unfortunate attacks and natural disasters


    An attacker triggers unfortunate events such as wars, natural disasters or accidents,
    or makes intended actions that cause power failures, thereby affecting the availability
    of systems and services and causing systems’ downtime and disruption of services.


    BUSINESS BENEFITS AND IMPACTS – TWO SIDES OF THE SAME COIN


    While the dimensions and security goals mentioned above primarily concern cyber
    security analysts ([Figure 2.2](#15_ch02.xhtml#fig2-2)), having an understanding
    of them can also benefit business analysts when collaborating with security and
    IT teams.


    [Chapters 1](#14_ch01.xhtml) and [2](#15_ch02.xhtml) emphasised the significance
    of conducting comprehensive analyses. A key outcome of such thorough analysis
    is not only identifying the benefits generated by a proposed value but also recognising
    the impacts these benefits would yield – both positive and negative, intended
    and unintended.


    While the focus is often on creating desired and intended benefits, it’s crucial
    to acknowledge that impacts can sometimes be unintended. For instance, the integration
    of smart home devices promises enhanced convenience and automation for inhabitants
    (Laughlin, 2021). However, without adequate security measures, the unintended
    negative impact could involve malicious actors gaining unauthorised access to
    personal information, leading to data breaches. Another example is the Facebook
    ‘Like’ button feature, originally intended to share positivity. However, the social
    ramifications extend beyond this intention, with researchers uncovering broader
    psychological effects of social media interactions, particularly among teenagers
    (Eranti and Lonkila, 2015).


    With the rapid pace of technology landscape expansion surpassing expectations,
    it’s crucial that impact assessments not only focus on today’s landscape but also
    strive to evaluate impacts across the breadth and depth of this expansion.


    Seeing both the eye and everything around it'
