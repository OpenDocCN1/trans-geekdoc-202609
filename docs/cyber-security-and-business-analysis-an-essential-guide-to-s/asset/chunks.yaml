    \ to check if they had a similar problem and to learn what they did to solve it.\
    \ He undertook the research for several days, consulted a few experts as required\
    \ and collated all the information. Finally, he completed his investigation, identified\
    \ the root cause of the problem and documented the findings. The analysis was\
    \ complete, and he formulated proposals for a few solution options based on the\
    \ results.\n\n### Solution options\n\nThe underlying reason for the reduction\
    \ in the crop was due to reduced water level and the soil drying. As a result,\
    \ the yield was not being supplied with sufficient water. This situation persisted,\
    \ drying the ground year after year. The advisor devised several solutions by\
    \ collaborating with the experts to address the root cause of the problem and\
    \ its effects.\n\nThe first solution option was a quick, temporary fix that required\
    \ the least investment of resources. It was to dig the well even deeper to obtain\
    \ more water. However, there was a risk in this option. The neighbouring farmers\
    \ had already tried this solution, and the results were inconsistent. Only a few\
    \ wells replenished the water, and others didn’t. Therefore, this option could\
    \ not guarantee to solve the problem and produce the desired outcome, but this\
    \ risk was acceptable.\n\nThe second solution option was to set up a mechanical\
    \ infrastructure to pump water from the nearby lake into the farm. This option\
    \ required more investment than the first and was not a quick fix. Due to the\
    \ higher cost of setting up the infrastructure, this second option could be extended\
    \ to the neighbouring farmers dealing with a similar situation, thereby sharing\
    \ the installation and ongoing maintenance costs. However, this solution was also\
    \ not a permanent fix and could not guarantee the desired outcome. Due to the\
    \ drying up of the soil, the water levels in the lake, too, could further reduce\
    \ over time. Additionally, the lake was a reservoir, and using the water immediately\
    \ could create a deficit during droughts, giving rise to another crisis. Therefore,\
    \ the current water usage in the lake would not be dependable, making this a high-risk\
    \ option.\n\nThe third solution option was a longer-term, efficient and permanent\
    \ solution. It was to plant more trees around the farming land that would hold\
    \ water and avoid drying up the soil in the future. This option could improve\
    \ the soil quality and rejuvenate the wells and the other water bodies. It addressed\
    \ the current problem and would enhance the harvests’ quality and quantity.\n\n\
    The advisor submitted this report to the king. Then, with all the findings and\
    \ the solution options, the king could decide on the best solution for the farmer’s\
    \ problem.\n\nI told my son that, in this day and age, business analysts are like\
    \ this advisor. They analyse the problem, research all the relevant facts, communicate\
    \ and collaborate with the concerned teams, identify the root cause of the situation\
    \ and propose solution options.\n\nAs I said this, my son immediately remarked\
    \ that a business analyst solves people’s problems, and that statement nailed\
    \ it.\n\nIn essence, business analysts are problem solvers. They tease out the\
    \ problem situation to find suitable solutions to solve the problem. However,\
    \ in this process, can a business analyst:\n- Miss out on analysing relevant pieces\
    \ of information?\n- Ignore seeing the different perspectives?\n- Perform inadequate\
    \ research?\n\nHow would any of the above shortcomings affect the analysis and\
    \ the findings? And why is it so important that a business analyst delivers a\
    \ complete and correct analysis?\n\n## IMPACTS OF INCORRECT AND INCOMPLETE ANALYSIS\n\
    \nLet’s consider a few scenarios to illustrate the consequences of inaccurate\
    \ and incomplete analysis in the above story. These scenarios demonstrate how\
    \ flawed solutions can exacerbate existing problems or introduce new issues and\
    \ risks.\n\n### Scenario 1\n\nThe problem is deteriorating harvest.\n\n**Analysis**\n\
    Assuming the perceived problem as the real problem.\n\n**Potential solution option**\n\
    Import crops or alternate food supplies from neighbouring states or countries.\n\
    \n**Impacts**\n- How sustainable is it to import food supplies from neighbouring\
    \ states or countries?\n- What will be the process requirements? Will it be simple\
    \ or complicated?\n- Will the imported crop be the same or different?\n- If different,\
    \ can the people accept the new diet?\n- Are there any side effects from the new\
    \ diet we must prepare for?\n- What are the requirements for the new type of crop\
    \ in terms of storage, climate, etc.?\n\n**Outcome**\nThe perceived problem is\
    \ being addressed rather than the root cause.\n\nAlthough this solution may solve\
    \ the problem temporarily, it will only perpetuate more problems, incurring unnecessary\
    \ investments, effort, money, resources, time and so on, and ultimately, it fails\
    \ to address the underlying root cause of the situation.\n\n### Scenario 2\n\n\
    A new fancy machine will solve the problem and is the talk of the town. Everyone\
    \ is raving about the new fancy machine easing farmers’ efforts.\n\n**Analysis**\n\
    Assuming the efficacy of the fancy machine has been tested and verified to ease\
    \ farmers’ lives, as everyone has the same understanding, including the farmers,\
    \ workers, neighbouring villagers and the research data.\n\n**Potential solution\
    \ option**\nInstall the new fancy machine as quickly as possible to avoid missing\
    \ the window for the forthcoming harvest.\n\n**Impacts**\n- It is reported that\
    \ the machine requires regular maintenance for water leaks, which is expensive,\
    \ and therefore:\n  - How will the farmers afford the expensive maintenance cost?\n\
    \  - How long will this be sustainable?\n  - Why was this not discussed with the\
    \ farmers earlier?\n- Farmers must undergo mandatory training to learn about machine\
    \ technology, operations and maintenance, so dedicated time for this activity\
    \ must be set aside.\n  - Can the farmers allocate additional time for training?\n\
    \  - If not, what will be the alternative?\n  - Who else can operate the machine\
    \ to avoid downtime?\n- The machine requires a customised infrastructure to secure\
    \ the equipment and its usage.\n  - Has the feasibility of the infrastructure\
    \ been assessed?\n  - If not, who is responsible for ensuring the machine’s security\
    \ requirements?\n  - Without proper security measures in place, anyone could gain\
    \ access to the machine room and tamper with the equipment, potentially causing\
    \ damage, even if it’s accidental.\n  - Farm animals could also enter the machine\
    \ room and damage the machine.\n  - Some farm workers who have a personal feud\
    \ with the farmer could damage the machine intentionally.\n\n**Outcome**\n"
  trans: "\n# 图 1.1 商业分析的核心理解 (版权所有：I-Perceptions Consulting Ltd)\n\n![](img/Fig1-1.jpg)\n\
    \n## 行动中的分析\n\n从前，在遥远的土地上，住着一位仁慈而高贵的国王。有一天早晨，一位农民来到他的宫廷，问题是他的收成年年持续减少。他担心今后几年可能完全没有收成，急需帮助。\n\
    \n国王立即命令其中一位顾问去进一步了解问题并汇报调查结果，以解决农民的问题。\n\n顾问陪同农民回家，以详细了解情况和问题。他向农民提出了几个问题，例如：\n\
    - 农民第一次注意到收成减少是什么时候？\n- 这种情况对他的生计有何影响？\n- 是否有其他农民也有同样的问题？\n- 他们已经尝试过哪些补救措施？\n\n\
    顾问随后在农场周围走动，检查作物、土壤和井水。他还与农场工人交谈，认真倾听并做笔记。他会见了邻近的农民，检查他们是否也有类似问题，并了解他们是如何解决的。他进行了数天的研究，根据需要咨询了几位专家并汇总了所有信息。最后，他完成了调查，确定了问题的根本原因并记录了调查结果。分析完成，他根据结果提出了几种解决方案的建议。\n\
    \n### 解决方案选项\n\n作物减产的根本原因是水位下降和土壤干旱。因此，产量得不到充足的水供应。这种情况持续存在，年复一年地使地面干涸。顾问通过与专家合作制定了几种解决方案，以解决问题的根本原因及其影响。\n\
    \n第一个解决方案是一个快速、临时的修复方案，需要的资源投入最少。即把井挖得更深以获取更多水。然而，这个方案存在风险。邻近的农民已经尝试过这种解决方案，结果不一致。只有少数几口井补充了水，其他井没有。因此，这个方案不能保证解决问题并产生预期结果，但这种风险是可以接受的。\n\
    \n第二个解决方案是在农场建立机械基础设施，从附近的湖泊抽水到农场。这个方案比第一个需要更多的投资，也不是快速修复。由于建立基础设施的成本更高，这个第二个方案可以扩展到面临类似情况的邻近农民，从而分摊安装和持续维护成本。然而，这个解决方案也不是永久性的修复，也不能保证预期结果。由于土壤干涸，湖泊的水位也可能随时间进一步下降。此外，湖泊是一个水库，立即使用水可能会在干旱期间造成缺水，引发另一场危机。因此，湖泊目前的水使用量不可靠，使其成为高风险方案。\n\
    \n第三个解决方案是一个长期、高效且永久的解决方案。即在农田周围种植更多树木，以蓄水并避免未来土壤干涸。这个方案可以改善土壤质量并恢复井和其他水体的活力。它解决了当前问题，并将提高收成的质量和数量。\n\
    \n顾问将这份报告提交给了国王。然后，在所有调查结果和解决方案的基础上，国王可以为农民的问题决定最佳解决方案。\n\n我告诉我儿子，在当今时代，商业分析师就像这位顾问。他们分析问题，研究所有相关事实，与相关团队沟通和协作，确定情况的根本原因并提出解决方案。\n\
    \n当我这么说时，我儿子立刻评论说商业分析师解决人们的问题，这个说法一针见血。\n\n本质上，商业分析师是问题解决者。他们剖析问题情况以找到合适的解决方案来解决问题。然而，在这个过程中，商业分析师会：\n\
    - 遗漏对相关信息的分析？\n- 忽视不同视角？\n- 进行不充分的研究？\n\n上述任何不足会如何影响分析和调查结果？为什么商业分析师提供完整且正确的分析如此重要？\n\
    \n## 不正确和不完整分析的影响\n\n让我们考虑几个场景来说明上述故事中不准确和不完整分析的后果。这些场景展示了有缺陷的解决方案如何加剧现有问题或引入新的问题和风险。\n\
    \n### 场景 1\n\n收成恶化的问题。\n\n**分析**\n将感知到的問題视为真实问题。\n\n**潜在解决方案选项**\n从邻近州或国家进口农作物或替代食品供应。\n\
    \n**影响**\n- 从邻近州或国家进口食品供应是否可持续？\n- 流程要求会是什么？会简单还是复杂？\n- 进口的农作物是相同还是不同？\n- 如果不同，人们能否接受新的饮食？\n\
    - 我们是否需要为新的饮食的任何副作用做好准备？\n- 就储存、气候等方面而言，新类型农作物的要求是什么？\n\n**结果**\n解决的是感知到的問題而非根本原因。\n\
    \n虽然这个解决方案可能暂时解决问题，但它只会延续更多问题，造成不必要的投资、努力、金钱、资源、时间等等，最终未能解决情况的根本原因。\n\n### 场景\
    \ 2\n\n一台新奇的机器将解决问题，并且是全城的热门话题。每个人都在热议这台新奇机器如何减轻农民的劳动。\n\n**分析**\n假设这台新奇机器的功效已被测试和验证，可以改善农民的生活，因为每个人都有相同的理解，包括农民、工人、邻近村民和研究数据。\n\
    \n**潜在解决方案选项**\n尽快安装这台新奇机器，以免错过即将到来的收成窗口。\n\n**影响**\n- 据报道，该机器需要定期维护以防止漏水，这很昂贵，因此：\n\
    \  - 农民将如何承担昂贵的维护费用？\n  - 这能持续多久？\n  - 为什么之前没有与农民讨论这个问题？\n- 农民必须接受强制性培训以学习机器技术、操作和维护，因此必须为此活动安排专门时间。\n\
    \  - 农民能否为培训分配额外时间？\n  - 如果不能，替代方案是什么？\n  - 谁 else 可以操作机器以避免停机？\n- 该机器需要定制的基础设施来确保设备及其使用安全。\n\
    \  - 是否已评估基础设施的可行性？\n  - 如果没有，谁负责确保机器的安全要求？\n  - 如果没有适当的安全措施，任何人都可以进入机器房并篡改设备，可能造成损坏，即使是无意的。\n\
    \  - 农场动物也可能进入机器房并损坏机器。\n  - 一些与农民有个人恩怨的农场工人可能会故意损坏机器。\n\n**结果**\n\n"
