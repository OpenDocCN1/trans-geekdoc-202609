    This chapter provided an exploration of the business analysis component that represents
    the second pillar within the Business Analysis and Cyber Security Framework. Through
    the integration of cyber security extensions into IIBA’s knowledge areas and BACCM,
    the chapter listed cyber security activities to align with business analysis activities.
    It underscored the imperative collaboration with cyber security stakeholders,
    emphasising the need to adeptly identify and seamlessly integrate cyber security
    considerations into the overall business analysis process.


    As we navigate forward, subsequent chapters will progressively delve into the
    remaining components of the Business Analysis and Cyber Security Framework.


