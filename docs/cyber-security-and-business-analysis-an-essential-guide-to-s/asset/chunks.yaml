  trans: '

    医生与患者之间存在一种未言明的信任，以及对医生诊断的未言明信仰。同样地，业务分析师与其客户之间，也存在一种默契的信任，即分析能够提供所有必要的事实和视角，帮助利益相关者做出明智决策。这种信任只能通过持续提供全面的分析来建立和维护。因此，业务分析师成为客户值得信赖的顾问。


    存在一种未言明的信任，即业务分析师与其客户之间需要提供完整的分析以实现知情决策。


    结束第一章，我留下一个供你思考的问题：作为值得信赖的顾问，业务分析师能否在分析中排除网络安全，假设技术或网络安全团队负责所有与网络安全相关的需求？不，非功能性需求并不涵盖所有网络安全需求，我们将在下一章看到原因。


    ## 带走的问题


    • 本章你的关键学习点是什么？

    • 你将实施的唯一教训是什么？

    • 你如何总结你对业务分析的观点？


    ## 2 网络安全传奇的开端


    本章你将学到：


    • 网络安全对你意味着什么。

    • 这有多真实。

    • 退一步以获得视角。

    • 他们在玩什么游戏。

    • 网络安全不仅仅是 IT。

    • 扩张是未来。

    • 业务分析师可以做什么。


    ### 网络安全对你意味着什么？


    当你看到或听到“网络安全”这个词时，你会想到什么？例如，合规团队成员可能会说“这是关于网络安全法律的合规性，比如隐私”；在 IT 团队工作的人可能会说“这是关于保护网络或防火墙”；系统架构师可能会说“这是关于保护数据和系统”；而大多数业务团队会说“这是技术性的，因此
    IT 或网络安全团队负责”。如果你是一名业务分析师，你会怎么说？不，它不仅仅是或仅限于非功能性需求的一部分。当你看到或听到“网络安全”这个词时，你会想到什么？


    ![图标：头部齿轮向左。](img/icon1.jpg)


    ### 反思时间


    在继续阅读之前，请花点时间思考：


    • 网络安全对你意味着什么？


    ### 背景故事


    几年前，我会和业务团队说同样的话：网络安全是 IT 或安全团队的责任，我不必操心。安全仅限于非功能性需求（NFRs）——例如谁需要访问系统以及访问级别——直到一次个人经历从根本上改变了我对网络安全的看法。


    我当时正在从事一个客户订阅产品，订阅可用数据是组织的知识产权。我被分配去做一个位于团队待办事项列表底部的增强功能。注意，该变更并未被视为业务优先事项，这就是为什么它排在待办事项列表底部的原因。


    有人提醒我，业务和技术团队已经为该问题设计了解决方案，但尚未实施，因为待办事项列表中有更高优先级的项目。作为一名勤勉的业务分析师，我深入研究该问题以评估初始解决方案是否仍然可行。这涉及了解根本原因，从而引发了与业务、开发和运营团队的讨论。令我沮丧的是，分析揭示了一个令人震惊的真相：问题的根本原因是反复发生的数据泄露，尽管多次发生却未被察觉。运营报告显示出因大量数据下载而产生的差异，但并未采取任何行动。


    思考潜在的后果，我不禁想象如果所有数据都自由地在互联网上可用的灾难性影响。它不仅会损害组织的客户，还会对组织的声誉构成严重威胁。这样的泄露甚至可能危及组织的生存。


    这一发现凸显了该问题的关键性，而组织却将其归类为低优先级和低风险的待办事项。正是在这一认识下，我开始深入探索网络安全的旅程。


    ### 这有多真实？


    网络攻击在 2020 年是公共和私营部门全球排名第五的风险，2021 年全球较 2020 年增长 125%，并持续上升。仅物联网（IoT）网络攻击，攻击数量预计到
    2025 年将翻一番（AAG，2024）。此外，世界经济论坛 2020 年全球风险报告指出，美国的检测（或起诉）率低至 0.05%（McLean，2024）。


    让我分享另外几个高调事件以获得更深入的视角。


    #### HMRC


    据报道，一起值得注意的事件发生在 2007 年 HMRC 的儿童福利部门。据报道，所有儿童福利数据（包括领取福利的儿童的个人详细信息及其父母的个人和银行详细信息）被复制到密码保护但未加密的紧凑光盘（CD）上，并通过不安全且无法追踪的渠道邮寄给国家审计办公室（BBC，2007）。有人说
    CD 到达了目的地，有人说它们在运输途中丢失，但没有人确切知道。此事件有不同版本，但我想请你注意此次泄露的一些潜在原因：


    • 未能分离关键/敏感数据。

    • 未能加密数据。

    • 未能以安全且可追踪的方式传输数据。

    • 未能制定适当的处理这些数据流程。


    当时的报道表明，复制数据并邮寄 CD 的人并不了解风险，只是按照上级给出的指示行事。此事件发生在 2007 年，显然我们现在不再使用 CD 传输数据。我们在技术方面取得了很大进展，并通过法律法规对数据进行隔离，但这个问题仍在上升。我们在真正意义上取得了任何进展吗？让我们看看近十年后发生的第二起事件。


    #### TalkTalk


    TalkTalk 是一家互联网数据提供商。2009 年，TalkTalk 收购了另一家名为 Tiscali 的公司。收购的一部分似乎是，除了系统外，Tiscali
    的系统漏洞也被引入。后来，在 2015 年，TalkTalk 的数据库多次被入侵，客户的个人和财务数据被泄露（BBC）。


    从本质上讲，TalkTalk 遭受了重大且持续的网络攻击，据称只有在收到勒索邮件时才做出回应。据说他们没有监控内部运营报告，而报告显然显示出差异。起初，TalkTalk
    怀疑多达四百万客户的数据被泄露，当时的报道表明，TalkTalk 花了几个月时间才了解泄露的程度。后来，信息专员办公室（ICO）确认，攻击导致 156,959
    名客户的个人详细信息被访问，包括 15,656 名客户的银行账号和排序代码。因此，TalkTalk 遭受高达 4000 万英镑的损失，流失 101,000
    名客户，ICO 处以 40 万英镑罚款。令人震惊的事实是，伦敦警察厅证实与此次泄露有关的逮捕了一名青少年和一名 20 岁的人。再次，我想请你注意以下导致失败的潜在原因：


    • 未能移除易受攻击的网页。

    '
