- raw: 'Finally, effective communication and consultation are critical components
    of a successful risk management framework, promoting transparency and a shared
    understanding of the organisation’s overall risk posture. It helps to ensure that
    the organisation benefits from the collective knowledge and insights. It also
    contributes to building a risk-aware culture, fostering trust among stakeholders
    and creating an environment to see risk management as a shared responsibility.


    Business analyst support


    Business analysts can collaborate with stakeholders to develop a communication
    plan for risk management. They can assist in defining communication objectives,
    identifying key messages, determining appropriate communication channels, and
    establishing a timeline for communication activities.


    They can assist in preparing clear and concise documentation related to the organisation’s
    risk management framework, processes and outcomes.


    Business analysts can design and implement effective feedback mechanisms to elicit
    risk-related information by creating surveys, conducting interviews and facilitating
    workshops to capture stakeholder insights and concerns.


    Business analysts can play a key role in ensuring the successful implementation
    of a risk management initiative. They can contribute to creating a risk-aware
    culture within the organisation with their ability to bridge technical and business
    perspectives, facilitate discussions and promote effective communication among
    stakeholders and decision-makers.


    They can analyse data related to risk assessments, incidents and risk treatment
    plans. Business analysts can identify trends, patterns and areas of concern, and
    generate comprehensive reports for decision-makers. They can help to select, implement
    and optimise tools that streamline the monitoring and reporting of risk-related
    data. Using business analysis techniques to identify root causes, business analysts
    can help to assess the effectiveness of risk treatments and recommend improvements.


    Business analysis can also collaborate with internal and external audit teams
    to facilitate audits of risk management processes and assist in preparing documentation,
    responding to audit findings and implementing corrective actions. They can also
    help to design scenarios, support testing activities and analyse results to identify
    areas for improvement, among others.


    In addition, *Information Risk Management* (Sutton, 2021) is a comprehensive guide
    that can help business analysts to gain deeper insights into comprehending and
    mitigating various risks associated with information.


    MAINTAINING CYBER RESILIENCE


    A well-established risk management process is foundational to achieving cyber
    resilience. Cyber resilience is the ability of an organisation to holistically
    prepare to respond and recover from cyber threats, cyber attacks, data breaches,
    system failures and other security incidents. A robust risk management process
    is instrumental to maintaining cyber resilience in an organisation. The risk management
    process provides the framework for identifying, assessing, mitigating and monitoring
    risks – critical components of a comprehensive cyber resilience strategy.


    OTHER RISK PERSPECTIVES


    With a good understanding of an effective risk management process, it is essential
    to understand some do’s and don’ts.


    Although it had become a common practice in some organisations to ignore the low-likelihood
    risks, especially those with high-impact, existential risks, the Covid pandemic
    and recent wars have reminded us that however low the likelihood or probability
    of the existential risks could be, **they are never zero**. These events are a
    wake-up call to recognise the social, economic and environmental changes taking
    place at the fastest pace ever recorded in the history of humankind.


    While high-consequence, low-likelihood risks cannot be ignored, preparing for
    every probable risk is impossible, expensive and impractical. Therefore, organisations
    must develop strategies to help them prioritise and prepare for those high-impact
    risks relevant to their organisational context. However, the challenge is developing
    the strategy, especially when the future is unknown.


    In their article, ‘The disaster you could have stopped: preparing for extraordinary
    risk’, McKinsey’s Fritz Nauck, Ophelia Usher and Leigh Weiss, recommend conducting
    a ‘premortem exercise’, a technique risk decision-makers can employ to identify
    which ‘predictable surprises’ would have severe consequences for their organisation
    (Nauck et al., 2020). ‘Predictable surprises’ is the phrase Michael Watkins and
    Max Bazerman coined in their *Harvard Business Review* article (Watkins and Bazerman,
    2003). They are those high-impact and low-probability risks affecting the organisation’s
    value proposition to which the organisations need to respond when manifested.


    Furthermore, in a podcast episode from McKinsey’s *Inside the Strategy Room* (Aufreiter
    et al., 2022), Nora Aufreiter, Celia Huber and Ophelia Usher bring a board perspective
    to the board’s role in ensuring readiness for existential risks by suggesting
    these activities:


    • The first is identifying the ‘predictable surprises’ and defining pre-emptive
    actions.


    • The second is to look at risks through the lens of scenarios. Creating well-planned
    and laid-out scenarios of the predictable surprises would provide insight into
    the impacts. A scenario can have multiple risks hitting it simultaneously, and
    those multiple stories help to open up the imagination and aid decision-making.
    The crux is in building imaginative scenarios backed up with data from market
    forecasts, expert opinions and world economic forum reports on how the organisation
    would be affected if those risks were to manifest in the short and long term.
    Thinking ahead on the mitigations and being prepared is the name of the game.


    • The third step is to prepare a well-balanced business resilience plan focusing
    on all dimensions, including financial, operational, technical, resources, reputation
    and business models. Prioritise the scenarios, allocate budget and resources to
    those and create processes for managing incidents and business continuity based
    on the risk appetite.


    • The fourth step is being mindful and tactical to harness potential opportunities
    by creating business models to take advantage of and invest in them when those
    scenarios manifest. A classic example is Amazon helping third parties build e-commerce
    sites, leading to Amazon Web Services (AWS). According to AAG IT, AWS has around
    30 per cent of the cloud-computing market share (Griffiths, 2024).


    Business analyst support


    Business analysts, with their hard and soft skills, can offer support in identifying
    the predictable surprises. They can facilitate creating the scenarios to help
    illustrate the impacts of these predictable surprises on the organisation, employees,
    customers, suppliers, society or the ecosystem. Business analysts can influence
    the organisation by collaborating with the decision-makers at the strategic level
    and emphasising the organisation’s overall resiliency. The investments that organisations
    make to protect their value propositions or potential opportunities can mean the
    difference between survival and extinction.


    The investments that organisations make to protect their value propositions or
    potential opportunities can mean the difference between survival and extinction.


    BIAS IN RISK


    Human beings are the product of their upbringing and environments, resulting in
    cognitive bias, which plays a significant role in perceiving, interpreting and
    responding to risk, leading to errors in judgement and decision-making. Therefore,
    awareness of risk bias is another crucial aspect to foster for a more objective
    and accurate assessment of risks.


    The Institute of Risk Management (IRM) has developed a short guide^([4](#17_ch04.xhtml#fn_4))
    to combat bias in risk management, as listed below:'
