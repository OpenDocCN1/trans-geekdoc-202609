    • Collaborating with cyber security experts to identify relevant security requirements
    within the business processes.

    • Documenting specific cyber security control requirements, such as encryption,
    access controls and authentication requirements, as part of the overall functional
    requirements.

    • Documenting specific regulatory and compliance requirements related to cyber
