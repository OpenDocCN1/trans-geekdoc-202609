- raw: 'My gran told me this story when I was a child, and it has stayed with me.
    Although it didn’t make much sense then, I remember it every time I perform an
    analysis.


    This story is of Prince Arjuna, a renowned warrior celebrated for his exceptional
    bravery and mastery of archery in the Indian epic *Mahabharata*. As one of the
    five Pandava princes, Arjuna’s prowess was legendary. One day their revered teacher,
    Dronacharya, instructed all the royal princes in the art of archery. Placing a
    wooden bird atop a tree branch, he tasked each student with aiming their arrows
    at the bird. Before releasing their arrows, Dronacharya queried each student about
    their focus. Responses varied: one saw the bird perched on the branch, another
    noticed the tree and yet another observed the tree along with the towering mountain
    behind it. However, when it was Arjuna’s turn, he calmly asserted that he solely
    fixed his gaze upon the bird’s eye, disregarding all else. True to his unwavering
    focus, Arjuna’s arrow found its mark, striking the bird’s eye with unmatched precision.


    The story highlights the importance of maintaining unwavering focus on the goal
    – a lesson that resonates deeply with me. However, in my role as a business analyst,
    I must strike a delicate balance between meticulous attention to detail and a
    holistic view of the larger picture. Analysing individual changes while considering
    their ramifications on the entire system is a cornerstone of my work. My work
    requires me to navigate through intricate layers of complexity, zooming in to
    the minutiae while maintaining a bird’s eye view, including the impacts (both
    positive and negative) at the forefront of my mind. I therefore need to look at
    the bird’s eye, the bird and all the factors around that could potentially cause
    harm or be a threat in the scenario ([Figure 3.5](#16_ch03.xhtml#fig3-5)).


    **Figure 3.5 Circle of impact** (Copyright: I-Perceptions Consulting Ltd)


    ![](images/Fig3-5.jpg)


    Recognising the importance of impact assessment, I have formulated a consistent
    approach that I employ each time to thoroughly evaluate both the benefits and
    impacts. This method entails scrutinising the effects of the business change not
    only on the product, but also on all interconnected systems within the technical
    and business landscape of the organisation. Moreover, it involves assessing the
    potential external impacts, extending beyond the organisational boundaries to
    encompass its ramifications on society and the broader ecosystem.


    SUMMARY


    Responding to the ever-changing social trends and business needs, frequent alterations
    and enhancements to technology and business processes is the need of the hour.
    Business analysts empowered with the security mindset, along with the security
    approaches, are well-positioned to meticulously weigh both the intended and unintended
    impacts of these changes. With these additional resources in their toolbox, they
    can effectively integrate cyber and information security considerations into their
    analyses, ensuring a comprehensive assessment and delivery of complete analyses.
    Subsequent chapters will delve deeper into the framework, techniques, and tools
    essential for this purpose.


    TAKEAWAY QUESTIONS


    • What are your key learning points in this chapter?


    • What is the one lesson that you’ll implement?


    • How do you summarise your perspectives on security approaches?


    [1](#16_ch03.xhtml#fn-1) [https://en.wikipedia.org/wiki/Parkerian\_Hexad](https://en.wikipedia.org/wiki/Parkerian_Hexad)


    ## 4 WHERE IS THE TRAP?


    Here’s what you’ll learn from this chapter:


    • The first pillar – risk analysis.


    • Risk is the central part of cyber security.


    • Definition of risk.


    • Approaches to risk management.


    • Cyber resilience and risk management.


    • Business analysis support to the risk management process.


    • Other risk perspectives.


    • Bias in risk.


    • Barriers to effective risk management.


    • AI in risk management.


    THE TWO PILLARS


    The previous chapter introduced the Business Analysis and Cyber Security Framework,
    emphasising the importance of establishing a foundational security mindset. In
    this chapter, we delve into the first of the framework’s two key pillars: ‘risk
    analysis’ and ‘business analysis’ ([Figure 4.1](#17_ch04.xhtml#fig4-1)).


    This chapter offers an in-depth examination of the risk analysis and management
    process, with a particular focus on business analysis touchpoints. The exploration
    aims to provide a holistic understanding, enabling you to identify biases and
    overcome barriers to facilitate effective risk management and decision-making.


    The second pillar, business analysis, will be explored in the next chapter. It
    will highlight cyber security touchpoints across various phases of project delivery,
    ultimately contributing to the development of more secure and resilient systems
    and applications.


    CONSCIOUS AND UNCONSCIOUS RISKS


    Every day, whether we realise it or not, we make informal judgements on risks
    in our lives. From crossing a road to driving, using a phone or even sleeping,
    we encounter situations where risk is a factor. Yes, even while sleeping, as there’s
    no guarantee that everyone who sleeps will wake up the next day. Some risks we
    consciously take, while others we may not even be aware of or are unavoidable.


    **Figure 4.1 Business Analysis and Cyber Security Framework with the two pillars**
    (Copyright: I-Perceptions Consulting Ltd)


    ![](images/Fig4-1.jpg)


    However, this informal approach to risk management doesn’t suffice in an organisational
    context. When it comes to organisational risks, a formal risk management approach
    is essential to deal with organisational risks by making **risk the central part
    of cyber security**.


    As in the previous chapters, this one, too, leans into a story to drive the key
    message. This story is from the book *Mastering Leadership the Mousetrap Way*
    by Manoj Vasudevan (2016).


    The mousetrap


    Once upon a time there lived a poor farmer. He lived in a small house with his
    wife. He had a small farm with a chicken, a goat and a cow. But there was another
    unwanted guest, a mouse. So, the farmer bought a mousetrap to get rid of his unwanted
    guest.


    Seeing the mousetrap in the house, the mouse was alarmed and he ran out, panicking,
    to the farm to find help. He saw the chicken on the farm and asked for help as
    a mousetrap was in the house. The chicken, who was happily engrossed in pecking
    grains, stopped, looked at the mouse and said, ‘I understand that this is a grave
    concern for you, but it is not my problem.’


    Hearing this, the mouse was disappointed and continued to find help elsewhere.
    He saw the goat cheerfully running around the farm and asked for help. The goat
    stopped running at once, feeling sorry for the mouse, and said, ‘Oh, it must be
    terrible for you, and I am sorry to hear your troubles, but it is not my problem.’


    The mouse was terrified as he couldn’t find help, but he didn’t lose hope and
    persisted. He saw the merrily engrossed cow munching grass and asked her for help
    as a mousetrap was in the house. The cow opened her eyes, looked at the mouse,
    thought for a moment and said, ‘Have you ever heard of a cow trapped in the mousetrap?
    I am sorry, but don’t get me involved in your troubles. It is not my problem.’


    The mouse, horrified and lost as he couldn’t find help, went back to the house
    weeping, and retired for the day.


    Before I continue this story, I encourage you to pause for a moment and identify
    all the risks inherent in this situation. These risks may pertain to any or all
    of the characters involved, and you’re free to make assumptions as you see fit.
    I urge you not to overlook this crucial step – engaging in this reflective exercise
    will enable you to perceive risks from a different perspective. This reflective
    exercise will help you to see what is and is not visible, and you’ll be glad you
    did it.


    ![Icon: Head with gears facing left.](images/icon1.jpg)


    REFLECTION TIME


    Take a moment, ponder and write down:'
