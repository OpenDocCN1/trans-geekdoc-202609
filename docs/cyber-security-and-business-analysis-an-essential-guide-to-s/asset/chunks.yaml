- raw: 'Like the IIBA’s knowledge areas, there are several other frameworks, such
    as the Business Analysis Service Framework, PMI-PBA (Project Management Institute
    – Professional in Business Analysis), that business analysts can use, or a prescribed
    set of business analysis tasks from SFIA6, Vongsavanh and Campbell, etc. The choice
    of framework depends on the organisational context, business needs and nature
    of the projects being undertaken. Business analysts may therefore use a combination
    of frameworks and methodologies to adapt to different projects and situations.


    I have found that most frameworks and business analysis tasks lean towards a set
    of common elements, such as a need or problem to solve, a solution that solves
    the problem, stakeholders who are impacted and so on. IIBA’s Business Analysis
    Core Concept Model (BACCM) summarises the common elements and is a versatile tool
    to use on its own or with other frameworks and knowledge areas. The diagram in
    [Figure 5.2](#18_ch05.xhtml#fig5-2) exhibits the BACCM and the relationships between
    the elements.


    **Figure 5.2 IIBA BACCM** (Copyright: International Institute of Business Analysis.
    All rights reserved)


    ![](images/Fig5-2.jpg)


    IIBA’S BUSINESS ANALYSIS CORE CONCEPT MODEL


    The IIBA BACCM checklist is a ‘value-added applied knowledge’ resource available
    on the IIBA Knowledge Hub, and [Table 5.1](#18_ch05.xhtml#tab5-1) is the cyber
    security extension in line with the IIBA BACCM checklist, which can be used either
    on its own or with other frameworks or business analysis tasks to assess cyber
    security impacts as part of the analysis.


    **Table 5.1 IIBA BACCM checklist cyber security extension**


    | **IIBA’s Business Analysis Core Concept** || **Cyber security-related questions
    to consider** |


    | --- | --- |


    | **Stakeholders** refers to an individual or group or organisation that have
    an interest in the decisions, operations or performance of a company or project
    and will have a relationship to the change, the need or the solution. || Are the
    cyber security stakeholders involved?Do the cyber security stakeholders have specific
    cyber security needs or requirements?Do the stakeholders need to be authorised
    or authenticated?Do the cyber security stakeholders have concerns about the change?
    |


    | **Context** refers to the circumstances, conditions or settings that surround
    and give meaning to an event, an idea, a statement or a concept that influence
    or are influenced by and provide a rationale for the change. || Does the context
    involve the organisation’s crown jewels?Will the limitations compromise or impact
    cyber security?What is the risk if it is not protected?Does the organisation’s
    culture, behaviours and attitude towards cyber security compromise the security
    posture? |


    | **Need** refers to the gap between the current state of the organisation and
    its desired state representing a problem or opportunity that the business aims
    to address. || Does the need include or impact cyber security?Does the problem
    include or impact cyber security?Does the opportunity impact cyber security?If
    the needs are conflicting, do they impact cyber security?Does the prioritisation
    compromise or impact cyber security?What is the risk if not actioned? |


    | **Solution** refers to a means or method of solving a problem or addressing
    a need identified within an organisation. || Does the solution raise any cyber
    security risks?If yes, how does the solution need to be protected?What level of
    protection is ideally suited for the solution? |


    | **Change** refers to the process, act or instance of making modifications to
    business processes, policies, information systems, organisational structures or
    any other aspects of the business environment to address specific needs, solve
    problems or exploit opportunities. || Does the change raise any cyber security
    risks?Does the change impact any existing cyber security posture?Will the improvement
    need additional cyber security or governance requirements to be considered?Will
    the change strategy impact security objectives?What is the risk if not actioned?If
    the answer is yes to any of the above questions, then cyber security stakeholders
    must be consulted accordingly. |


    | **Value** refers to the benefits or improvements realised by an organisation
    through the implementation of changes or solutions. || Does the potential value
    need to be protected, considering value can be tangible or intangible?How is the
    value perceived by the cyber security stakeholders?Are there any cyber security
    risk factors that impact the value?Are there any security-related metrics to assess
    the value of the solution? |


