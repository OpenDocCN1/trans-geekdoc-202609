    data as the lifeblood of modern society. It navigated through key facets such
    as the distinction between data security and cyber security. The chapter elucidated
    the significance of understanding the three data states for crafting effective
    data security strategies tailored to specific situations. It explored strategies
    to ensure the safe passage of data throughout their life cycle, considering the
    various touchpoints and potential vulnerabilities within the flow.


    Showcasing the dynamic nature of the data landscape, the chapter discussed emerging
    data trends to monitor, offering diverse perspectives on the contemporary challenges
    and opportunities associated with managing and securing data.


    The next chapter further advances the construction of the Business Analysis and
    Cyber Security Framework, delving into the next dimension: people and personas.


    TAKEAWAY QUESTIONS


    • What are your key learning points in this chapter?


    • What is the one lesson that you’ll implement?


    • How do you summarise your perspectives on data security?


    ## 8 MASQUERADES


    Here’s what you’ll learn from this chapter:


    • People management.


    • Personas.


    • Misuse cases.


    • Incident management.


    • Business continuity plan.


    • Components of the business continuity plan.


    THE WEAK LINK


    We established in the previous chapters that people are the weakest link, and
    managing them is pivotal in cyber security. Human errors, unintentional or deliberate,
    contribute to a substantial portion of cyber security breaches.


    As reported by the BBC, Egor Igorevich Kriuchkov, a Russian man in the USA, pleaded
    guilty to attempting to extort money from Tesla by plotting a ransomware attack
    on the company’s battery plant in Nevada. Kriuchkov, acting on behalf of criminals,
    allegedly offered an employee $1 million to carry out the attack and steal company
    secrets (BBC, 2021). The FBI and Tesla thwarted the planned attack, and Kriuchkov
    faced up to 10 months in prison after pleading guilty. He mentioned the Russian
    government’s awareness of the plot, but there are no allegations of ties to the
    Kremlin.


    This incident highlights the significance of employee awareness and collaboration
    in preventing cyber threats. In this case, the Tesla employee targeted by the
    extortion attempt played a crucial role by reporting the plot to the company and
    cooperating with the FBI. This underscores the importance of having well-informed
    and vigilant employees as a part of effective people management in cyber security
    to recognise and mitigate potential threats.


    As cited in an article in *Infosecurity Magazine*, a social experiment conducted
    by the IT industry association CompTIA revealed alarming insights into security
    awareness (Seals, 2015). Between August and October 2015, 200 unbranded USB sticks
    were strategically placed in high-traffic public spaces across major US cities.
    Shockingly, 18 per cent of those who found the USB drives plugged them into their
    devices, opened the text files, clicked on unique links or emailed the listed
    address, potentially exposing their devices and information to cyber security
    risks. Millennials were found to be more susceptible, with 40 per cent likely
    to pick up a USB stick, compared to 22 per cent of Gen X and 9 per cent of Baby
    Boomers (Seals, 2015). Again, the experiment underscores the need for increased
    security awareness, proactive IT security measures and ongoing training for employees
    to mitigate cyber security risks. CompTIA emphasised the crucial role that vendors
    can play in educating clients, implementing security solutions and fostering a
    culture of cyber security within organisations. The survey also highlighted concerns
    about poor password protection, use of public Wi-Fi networks and inadequate cyber
    security training practices among employees, emphasising the need for continuous
    and comprehensive security initiatives.


    Although an effective people management strategy involves comprehensive training
    programmes to educate employees on security protocols, identify potential threats
    and instil best practices, human errors cannot be avoided.


    HUMAN ERRORS


    Human errors generally refer to mistakes, oversights or unintended actions made
    by individuals that deviate from the intended course of action or expectations.
    These errors can occur in various aspects of life and work, leading to undesired
    outcomes. Some examples of human errors include forgetfulness, lapses in attention,
    misinterpretation of information, misjudgement and failure to follow established
    procedures. Human errors are inherent to human nature and various factors contribute
    to their occurrence, including cognitive limitations, environmental conditions
    and situational complexities. Humans may make mistakes due to factors such as
    fatigue, stress, distraction or simply the complexity of certain tasks. However,
    in domains such as healthcare, aviation or cyber security, the consequences of
    human errors can range from minor inconveniences to severe incidents.


    While efforts can be made to reduce the likelihood and impact of errors through
    training, process improvements and technological aids, achieving 100 per cent
    avoidance of human error is practically impossible. There will always be some
    residual risk associated with human error.


    Therefore, acknowledging the inevitability of human errors is crucial for developing
    resilient systems that can detect, recover from and adapt to unexpected situations.
    Organisations can then implement strategies to mitigate the impact of human errors,
    such as redundancy in critical systems, error-proofing processes and fostering
    a culture of continuous improvement and learning.


    Understanding human errors is crucial for designing systems and processes that
    account for the inherent fallibility of individuals and aim to minimise the likelihood
    and impact of such mistakes.


    Additionally, identifying personas based on cyber awareness aids in designing
    user-friendly security measures, considering the diverse ways individuals interact
    with technology and perceive security practices.


    PERSONAS


    Advancing the Business Analysis and Cyber Security Framework ([Figure 8.1](#21_ch08.xhtml#fig8-1)),
    this section will delve into the dimension of ‘people and personas’, and we will
    explore the ‘incident management’ and ‘business continuity’ dimensions of the
    framework later in the chapter.


    **Figure 8.1 Business Analysis and Cyber Security Framework with people and personas,
    incident management and business continuity** (Copyright: I-Perceptions Consulting
    Ltd)


    ![](images/Fig8-1.jpg)


    Technique 61 in the third edition of *Business Analysis Techniques* (Cadle et
    al., 2021), meticulously outlines the process of crafting user personas with examples.
    Developing personas involves gathering insights through user interviews, surveys
    and observations and creating detailed character profiles that encapsulate each
    user type’s typical traits, goals and challenges. These personas serve as valuable
    tools for human-centred design, ensuring that cyber security strategies and technologies
    align with the diverse needs of end users. Some of the cyber security personas
    can include:


    • **The cautious user** – represents individuals who are generally aware of cyber
    security risks. They follow best practices, update software promptly and use strong,
    unique passwords. For example, an accountant or finance team member who manages
    financial records and transactions emphasises the importance of securing sensitive
    financial data.


    • **The unaware user** – represents users who may lack awareness of potential
    threats. They may engage in risky online behaviour, such as clicking on suspicious
    links, and require additional education. For example, an administrative assistant
    who handles routine administrative tasks may have limited awareness of cyber security
    risks.'
