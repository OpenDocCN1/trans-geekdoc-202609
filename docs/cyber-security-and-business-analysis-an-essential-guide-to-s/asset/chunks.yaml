- raw: '**Mindset** is the first building block of the framework, the foundation of
    the framework. A mindset is a mental attitude or perspective based on one’s belief
    systems, which is the amalgamation of one’s upbringing and environment. While
    [Chapter 1](#14_ch01.xhtml) delved into business analysis perspectives and mindset,
    this chapter establishes the groundwork for embracing the security mindset.


    What does security mindset mean?


    A **security mindset** is having an additional lens to perceive everything from
    a security viewpoint, a heightened awareness to see the value of the asset, its
    threats and the required protection. As with common sense being one of the basic
    constructs within the realm of consciousness yet a rare commodity, so the security
    mindset is a critical aspect of security that can be easily missed. A security
    mindset is like any other muscle that needs to be developed and regularly maintained.


    A mindset is a mental attitude or perspective based on one’s belief systems, which
    is the amalgamation of one’s upbringing and environment.


    A security mindset is having an additional lens to perceive everything from a
    security viewpoint, a heightened awareness to see the value of the asset, its
    threats and the required protection.


    Let’s look at an example to understand this better. If I were to ask you how you
    would secure your bike, you might probably say it would be like the first image
    in [Figure 3.1](#16_ch03.xhtml#fig3-1), and may also say that this is how everyone
    locks their bikes. However, if I ask you if the bike is protected, we know the
    obvious. This is the difference between doing things without and with a security
    mindset.


    **Figure 3.1 Bike parked and stolen** (Copyright: I-Perceptions Consulting Ltd)


    ![](images/Fig3-1.jpg)


    Similarly, many reputable organisations have become the victims of cyber security
    breaches. They had ticked all the security obligations; they had security frameworks
    implemented or accredited to one or other security standards; they had their legal
    and regulatory teams who complied with the laws; they had a dedicated cyber security
    team in place – yet, despite all the boxes ticked, they were not secured. A security
    mindset proves that security is much more than just implementing controls. Research
    proves that most cyber security incidents are due to people and process vulnerabilities,
    leading to the root cause of not being aware of the security mindset.


    As the saying goes, the centre of a storm is often the calmest spot. Similarly,
    for business analysts, embracing both the business analysis mindset (discussed
    in [Chapter 1](#14_ch01.xhtml)) and the security mindset is akin to finding that
    tranquil center. It provides them with clarity on what requires safeguarding and
    the level of security it necessitates.


    ![Icon: Head with gears facing left.](images/icon1.jpg)


    REFLECTION TIME


    Take a moment, ponder and write down:


    • Can you identify something that is of value? An asset being secured without
    a security mindset? Now, with the shift in your understanding, how would you approach
    securing that asset?


    My recommendation is to reflect on a personal and an organisation asset, as it
    helps strengthen the security mindset. Do not skip this exercise as the more you
    engage it, the more robust your mindset becomes.


    DEFINITION OF CYBER SECURITY


    To understand the definition of cyber security, let’s first understand the different
    avatars (as I call it) that cyber security projects manifest. As business or system
    analysts, we will have worked on security projects but without a security mindset.


    Many of us have experience working on projects involving the implementation of
    technical or process controls, such as user authentication through passwords for
    accessing products or applications, the enforcement of multi-layered authorisations
    for critical functionalities, or the maintenance of role-based access to processes
    and systems. However, it’s essential to reflect: was there a comprehensive grasp
    of the security requirements or was role-based access merely regarded as another
    feature the product offered, like the bike analogy mentioned earlier?


    Was there a clear alignment with the security objectives outlined in your organisation’s
    security policy regarding activities such as encrypting personally identifiable
    information (PII) data, securing networks and firewalls, establishing secure communication
    channels between gateways, or engaging in compliance projects to meet legal and
    regulatory obligations regarding data security? Or did the implementation lack
    cohesion with these objectives, assuming that the security and IT teams will ensure
    this alignment ([Figure 3.2](#16_ch03.xhtml#fig3-2))?


    **Figure 3.2 Cyber security activities** (Copyright: I-Perceptions Consulting
    Ltd)


    ![](images/Fig3-2.jpg)


    Were we truly aware of what we were protecting or did it merely seem like another
    project task? When faced with legal compliance obligations, did we invest the
    necessary effort to fully grasp the underlying rationale or did compliance become
    just another checkbox to tick off? Moreover, why do certain data sets hold more
    significance than others and what drives organisations’ varying needs for data
    purging? These inquiries prompt reflection within the organisational context,
    urging us to comprehend the journey of information assets as they traverse through
    various systems and processes, undergoing transformation along the way.


    Only with a holistic view will we be able to summarise the definition of cyber
    security, which is ‘the protection of systems, networks, applications, processes,
    people-systems interactions and data within the cyberspace’ (CISCO, 2024).


    Cyber security is the protection of systems, networks, applications, processes,
    people–systems interactions and data within the cyberspace.


    HOW TO APPROACH SECURITY


    There are two approaches to achieving security ([Figure 3.3](#16_ch03.xhtml#fig3-3)),
    although both achieve the same goal of protecting an asset but from two opposite
    perspectives.


    **Figure 3.3 Security approaches** (Copyright: I-Perceptions Consulting Ltd)


    ![](images/Fig3-3.jpg)


    The positive approach, also known as the preventive or objective-based approach,
    is the ability to proactively resist or eliminate threats to an asset. This objective-based
    (protecting the asset) approach is where an asset is protected because of its
    value and the objectives identified to preserve its integrity, such as role-based
    access control to sensitive information and systems, authentication and authorisations.
    It is, therefore, the maintenance of the identified objectives for an asset.


    The negative approach, also known as the detective approach or threat-based approach,
    is defined as the ability to resist specific identified threats to an asset. The
    threat-based (losing the asset) approach is where the risks and threats are identified
    to eliminate, and emphasise security monitoring of systems, networks and user
    behaviour for anomalies. It is, therefore, the ability to mitigate the identified
    threats for an asset.


    Both approaches are essential for a well-balanced security strategy, in which
    the proactive approach aims to reduce the likelihood of incidents, and the reactive
    approach helps to identify and respond to incidents.


    A well-balanced information security programme incorporates elements of both approaches
    to provide robust protection and a stable security strategy, in which the proactive
    approach aims to reduce the likelihood of incidents, and the reactive approach
    helps to identify and respond to incidents.


    Security objectives – the CIA Triad


    The positive or objective-based approach is to achieve the security goals below,
    known as the CIA Triad:


    • **Confidentiality** – prevention of unauthorised information release.


    • **Integrity** – prevention of unauthorised information modification.


    • **Availability** – prevention of unauthorised denial of use.


    Security violations'
