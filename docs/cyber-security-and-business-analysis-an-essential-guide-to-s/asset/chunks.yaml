    ## AUTHOR


    **Bindu Channaveerappa** is a business analysis consultant who is passionate about
    all things business analysis. Recognising the imperative need for cyber security
    analysis, Bindu passionately advocates for integrating cyber security into mainstream
    business analysis practices, and has made significant contributions to the field.
    She co-authored the Cybersecurity Certification (CCA) curriculum for the International
    Institute of Business Analysis (IIBA®) and has shaped exam questions for the CCA
    and Certified Business Analysis Professional (CBAP) certification, contributing
    to the development of IIBA standards and IIBA digital assets.


    Bindu shares insights on business analysis and cyber security at international
    conferences and online platforms.


    Along with her professional endeavours, Bindu serves as the IIBA Regional Director
    for Europe, the Middle East and Africa and has served the IIBA UK chapter as one
    of the directors. In addition, Bindu dedicates time to the Brahma Kumaris World
    Spiritual University, advocating for a spiritual lifestyle that fosters holistic
    human well-being on an international scale.


    ## FOREWORD


    The need to ensure the security of organisational assets, in particular data and
    other confidential information, has been a concern for many years. With the rise
    in online access to these assets and the increasing complexity of the technological
    landscape, this need has become an imperative. However, key activities such as
    understanding the context for cyber security, conducting detailed investigation
    and analysis, and determining relevant actions to address cyber security threats,
    are often overlooked in the pursuit of technical measures. Also, these key analysis
    activities require extensive knowledge and skill.


    Much has been written about cyber security and the need to arm organisations against
    the threats posed. Too often the focus is solely on specific online threats, avoiding
    the broader environment and dimensions where other security threats may be exploited
    and where actions are also required. Leaping to protective solutions without understanding
    the specific organisational context and the nature of the assets that require
    protection, can result in actions that are irrelevant, excessive or insufficient.


    *Cyber Security and Business Analysis* places business analysis at the heart of
    a successful cyber security strategy. It explains that business analysis is a
    key discipline in ensuring organisations are able to identify, analyse and protect
    against cyber security threats. The guidance provided advocates that a holistic
    approach is adopted and that the different types of assets, the nature of the
    threats posed and the required levels of security need to be aligned. Business
    analysts deploy an analytical mindset, focusing on understanding the root causes
    of concerns, questioning assumptions and uncovering detailed requirements. They
    understand the importance of non-functional requirements and the need to analyse
    them in detail, not just skimming them superficially. Without this depth, inappropriate
    or even inadequate security measures may be implemented and assets put at risk.'
