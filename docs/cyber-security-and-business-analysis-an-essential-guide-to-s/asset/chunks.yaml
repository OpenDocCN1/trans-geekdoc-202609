- raw: '• What are the risks in this situation affecting any or all of the characters?
    Make assumptions as you see fit.


    When everyone was asleep that night, there was absolute silence in the house.
    Then there was a loud noise from the mousetrap in the kitchen. Hearing this, the
    farmer’s wife jumped out of bed and rushed to the kitchen. It was dark, and she
    couldn’t contain her excitement. She stooped down to check the mouse trapped in
    the mousetrap, and to her astonishment it was a snake and not the mouse. The snake,
    in rage, bit her and she yelled in pain, waking up the farmer, who rushed to the
    kitchen and switched on the light. The farmer was dismayed to see his wife’s dreadful
    situation and quickly did whatever he could to provide medical assistance. But
    the damage was already done.


    His wife became terribly ill, and the doctor suggested he feed his wife chicken
    broth to help her recover, so the chicken had to go. Hearing about the wife’s
    illness, their friends and family visited them, and now the farmer had to feed
    his guests, so the goat had to go as well.


    His wife showed no sign of recovering and in a couple of days she passed away.
    The farmer not only had to bear the costs of her illness, but now, with the funeral
    costs, he had no other option other than to sell the cow, so the cow also had
    to go.


    Losing his beloved wife, the farmer lost the will to live and he went into depression.
    In a few months, he too passed away. And the new boss of the house was the mouse
    (Vasudevan, 2016).


    Did you foresee this ending to the story and were you able to identify any risks
    that materialised? Now take another moment to reflect on the story and the risks
    you identified earlier. Assess how accurately you gauged the threats to the characters.
    Has the story made you look more deeply and broadly into the situation?


    Again, do not skip this process, as the exercise will deepen your learning to
    hone the skill of identifying both obvious and unobvious risks.


    ![Icon: Head with gears facing right.](images/icon.jpg)


    REFLECTION TIME


    Take a moment, ponder and write down:


    • How do you perceive risks after reading the story?


    • Has it created a shift in seeing the obvious and the unobvious?


    Among many key lessons from the story, the top three messages to drive home within
    the context of cyber security or security in general are:


    • Security affects everyone, and therefore it is everyone’s responsibility.


    • A threat to an individual or a team in an organisation is a threat to the whole
    organisation, sooner or later.


    • Leaders in organisations need to be prepared and not react in a panic. They
    need to anticipate the risks and be ready to respond accordingly.


    However, it is a human tendency to overlook obvious risks, often assuming they
    won’t materialise or, if they do, that they won’t affect them personally. Hence,
    they are unprepared when these risks do materialise and that hits hard.


    A quote widely attributed to Douglas Adams^([2](#17_ch04.xhtml#fn_2)) brilliantly
    sums it up: ‘The major difference between a thing that might go wrong and a thing
    that cannot possibly go wrong is that, when a thing that cannot possibly go wrong
    goes wrong, it usually turns out to be impossible to get at or repair.’


    In this clever quote by Douglas Adams, he highlights the idea that things we assume
    won’t break become irreparable once they do. In organisations too, when risks
    go unforeseen and subsequently manifest, the resulting damage is irreversible.


    Although risk might appear simple, it gets complex in situations involving various
    moving parameters. The parameters get trickier as the situation changes, resulting
    in a confusing, endless loop.


    But organisations today increasingly rely upon complex information systems and
    therefore a formal and structured approach becomes imperative, with risk emerging
    as a central concept in information security management.


    Security is all about managing risks. We can call something secure only when all
    its risks are managed. And we can manage something only when it is identified.
    When a security breach or an incident is analysed, the root cause, in most cases,
    will directly or indirectly highlight mismanagement and overlooked risks, making
    ‘identifying risks’ critical because we don’t know what we don’t know, or, quoting
    Gary Cohn, vice Chairman of IBM:^([3](#17_ch04.xhtml#fn_3))


    ‘If you don’t invest in risk management, it doesn’t matter what business you’re
    in, it’s a risky business.’


    DEFINITION OF RISK


    Risk identification requires curiosity and an open mind to ask many ‘why’ questions,
    one of the business analyst’s essential activities, and that is when the things
    that can go wrong are identified.


    The definition of risk by [Businessdictionary.com](http://Businessdictionary.com)
    is apt. Risk is ‘a probability or threat of damage, injury, liability, loss or
    any other negative occurrence that is caused by external or internal vulnerabilities,
    and that may be avoided through preemptive action.’ The definition not only defines
    risk but also highlights pre-emptive action. Pre-emptive thinking is a skill that
    requires training to see the visible and that which is not yet visible.


    RISK MANAGEMENT PROCESS


    It is now established that risks are the core of security management. The next
    part of this chapter briefly spotlights the process, along with risk bias and
    barriers, that the organisation should be mindful of when designing an effective
    risk management process.


    The risk management process is not a one-time affair, but a cyclic process applicable
    to any risk in general.


    The diagram in [Figure 4.2](#17_ch04.xhtml#fig4-2) illustrates the ISO 31000 approach
    to enterprise risk management. ISO standards are a set of international standards
    developed by the International Organization for Standardization. ISO is an independent,
    non-governmental international organisation that develops and publishes standards
    to ensure the quality, safety and efficiency of products, services and systems
    across various industries.


    **Figure 4.2 Risk management process** (Copyright: I-Perceptions Consulting Ltd)


    ![](images/Fig4-2.jpg)


    An overview of the ISO 31000 risk management process is presented below, with
    guidance on the business analyst’s role at every stage.


    Establishing the context


    In business analysis, it is imperative that a context or scope is set, and here,
    too, a context or scope is the first step in the risk management process. It encompasses
    identifying assets (physical or information) and assigning an owner to each asset
    as the initial step. The owner will be responsible for dealing with this risk
    when it materialises by making the necessary decisions and taking the necessary
    actions. They are also responsible for the maintenance and security of the asset.


    Business analyst support


    Business analysts can support this by analysing the organisation’s business context,
    objectives and the external and internal environments and identifying the information
    security needs in collaboration with the security and IT stakeholders. The analysis
    also includes understanding the organisation’s structure, processes, information
    assets and regulatory obligations. They can help to identify the risks when the
    context is clearly understood.


    Risk assessment


    As illustrated in [Figure 4.2](#17_ch04.xhtml#fig4-2), risk assessment consists
    of three activities:


    • risk identification;


    • risk analysis;


    • risk evaluation.


    Risk identification


    Risk identification aims to determine what could go wrong and to what extent the
    potential damage or loss could impact the organisation. It is about identifying
    and listing all the threats and vulnerabilities and their sources.


    Business analyst support'
