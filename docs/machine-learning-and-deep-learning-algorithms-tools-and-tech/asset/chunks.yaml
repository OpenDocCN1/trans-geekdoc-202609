    ## 5. 修改数据格式


    你的数据是以原始美国格式存储的吗？


    也许你可以使用另一种格式来加速数据堆栈。一个很好的例子可能是 `GRIB`、`NetCDF` 或 `HDF`。


    处理后的信息随后用于训练一个朴素数学分类器，并确定了预测准确性的明显区别。


    ## 6. 流数据或渐进式加载


    所有数据都有机会拟合吗？


    为了有效利用，需要在内存中进行 `stream data`。


    这可能需要 `Keras` 以节省内存的方式处理数据。例如，`Keras` 库为云服务上的数据提供了此组件。


    ## 7. 关系型数据库的使用


    关系数据库通常是存储和获取自定义数据集的标准范围。内部，圆中的数据可以被渐进地堆栈，并可以使用普通查询 (`SQL`) 进行。


    `Postgres` 或 `MySQL` 等免费开源信息设备被用于编程语言和机器学习设备。此外，你还可以使用一种轻量级的方法，例如 `SQLite`。


    ## 8. 大数据利用平台


    在较少的情况下，你会获得丰富的信息数据平台。在这个平台上，大数据通过数据集进行处理，允许信息转换和主要的机器学习算法。


