    前馈系统的特定形式包含了拟合（`fitnet`）和模式识别（`patternnet`）系统。与前馈组织的不同在于级联前馈系统（`cascadeforwardnet`），它在每一层的贡献以及从每一层到后续每一层之间具有额外的关联。


    ### 前馈神经网络


    #### 程序

    ```mat

    >> [x,t] = simplefit_dataset;

    net = feedforwardnet (10) ;

    net = train(net,x,t) ;

    view(net)

    y = net (x) ;

    perf = perform(net,y,t)


    perf = 6.5740e-06

    ```


    #### 输出

    ![](img/159.jpg)


    ### 创建并训练级联网络


    #### 程序

    ```mat

    >> [x,t] = simplefit_dataset;

    net = cascadeforwardnet (10) ;

    net = train(net,x,t) ;

    view(net)

    y = net (x) ;

    perf = perform(net,y,t)


    perf = 4.3175e-06

    ```


    #### 输出

    你可以看到信息和输出的大小均为 1。


    #### 利用准备好的系统评估目标。

    ```mat

    >> y = net (x);

    ```

    评估准备好的系统的执行情况。默认的执行标准是均方误差。

    ```mat

    perf = perform (net, y, t)

    perf = 1.4639e-04

    ```

    容量拟合系统的默认准备计算方法是 Levenberg-Marquardt（`trainlm`）。利用贝叶斯正则化准备计算方法并分析执行结果。


    #### 程序

    ```mat

    >>net = fitnet(10,’trainbr’) ;

    net = train(net,x,t) ;

    y = net (x) ;

    perf = perform(net,y,t)


    perf = 2.0386e-10

    ```


    #### 输出

    ![](img/161.jpg)![](img/162.jpg)


    贝叶斯正则化准备计算在评估目标估计值方面增强了系统的执行性能。


    # 第 7 章：深度学习简介


    ## 7.1 深度学习概述

    深度学习是人工智能的一个一个概念，类似于人工编程的大脑神经网络，这种网络最终具有自我编码的能力。Hinton 和 Yan-LeCun 在 20 世纪 80
    年代提出了深度学习，他们讨论了多层神经网络。人工智能背后的独特指示是让计算机像人类大脑一样智能地行为和思考。


    ## 7.2 深度学习的工作原理

    深度学习分类主要分为两个阶段或步骤工作。初始过程是训练，随后是推理。深度学习使用神经网络来模拟动物智能。训练神经网络需要大型数据集。在神经网络中，它包含三种类型的神经元层：输入层、隐藏层和输出层。神经元之间的连接与权重相关，决定了输入值的重要性。神经元在数据上施加激活函数以“标准化”从神经元产生的输出。训练神经网络需要大型数据集。通过遍历数据集并比较输出会产生代价函数，用指示人工智能与真实输出之间的偏差。每次迭代后都会使用梯度下降法处理数据集，它通过正确调整神经元之间的权重来降低代价函数。深度学习基于神经网络，但与神经网络的不同之处在于，它们是根据人类神经网络设计的算法集，并被程序化为工作方式类似于人脑。


    ### 7.2.1 深度学习与机器学习有何不同？

    机器学习学习程序员教给它的内容，并根据目前学到的进一步做出自己的决策；然而，深度学习将算法分层结构化以创建一个可以自主决策并最终创建自己的代码的神经网络。它同时支持监督学习和无监督学习，但在现阶段，机器学习没有深度学习成功。


    ### 7.2.2 深度学习与 AI（人工智能）有不同吗？

    深度学习是人工智能的一部分，处理整个神经概念并轻松解决复杂问题，如上文所述，它是通过编程人工模拟大脑，因此能够非常准确和高效地执行任务。（注：原文此处逻辑有重复）。


    ### 7.2.3 什么是深度学习框架？

    在很大程度上支持深度学习并被 Facebook、Google、Twitter 等许多公司广泛使用的深度学习计算框架是 Lua。


    ### 7.2.4 深度学习的维度有哪些？

    深度学习使用两种类型的维度：向量和矩阵。这两个维度在深度学习中通常称为张量（Tensors），向量是一维的，矩阵是二维的，这些存在于机器学习（未来的智能大脑）和深度学习中。


    ## 7.3 深度学习的用途和功能

    深度学习侧重于模仿人类大脑思考、处理数据和创建模式的过程，以便将其用于决策。它是像人类大脑一样人工设计的。


    ## 7.4 哪些编程语言用于（设计）深度学习？

    根据许多调查和研究，常用的 AI 开发编程语言有 Python、R、Lisp、Prolog、Java 等。在这些语言中，Python 在深度学习开发的领域应用最广泛。基于许多算法和技术，深度学习通过编程语言实现。在
    Python 编程语言中使用了 numpy、pybrain 等。


    ## 7.5 深度学习的意义和重要性

    深度学习允许由多个处理层组成的程序模型发现多级抽象的信息表示。这些方法极大改进了语音识别、视觉感知、目标检测以及药物发现和遗传学等许多其他领域的进展。


