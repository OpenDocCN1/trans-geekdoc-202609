    \n![](img/183.jpg)\n\n## 数据分组和统计计算\n\n此描述展示了 `.mat` 格式的患者信息，这些信息被记录为数据。它展示了平均体重和记录的人数，然后将其转换为所有患者数据的应力读数。此外，结果结果根据表中的值进行绘图。\n\
    \n### 患者数据\n\n通过数据采样从 100 名患者收集数据。\n\n```matlab\n>> load patients\n```\n\n将自评估状况转换为分类数组\n\
