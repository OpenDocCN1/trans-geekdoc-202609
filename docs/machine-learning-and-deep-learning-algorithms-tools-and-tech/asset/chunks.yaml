    许多创新技术从机器学习中涌现，包括基于网络的社交网络（标记、照片和社交因素）。此外，光学字符识别 (OCR) 促进了移动图像的转换。源自机器学习的通用技术允许根据用户喜好生成电视节目。为了帮助消费者，探索自动驾驶汽车以确定机器信息因素。机器学习领域是人工智能的一个子集。机器学习通过使用有效的信息结构将数据拟合到模型中，以便个人理解。\n\
    \n## 1.1 机器学习基础\n\n机器学习已经存在，每一个实例都是用于数据分类的机器学习类型。\n\n### 定义\n\n“一个计算机程序被认为对于某些任务\
    \ T 从经验 E 中学习，如果它的性能 P 随着经验 E 的增加而提高。”\n\n![](img/11a.jpg)\n\n## 1.2 机器学习类型\n\n\
    机器学习有两种：\n\n*   监督学习\n*   无监督学习\n\n### 监督学习\n\n机器学习算法具有通过机器利用的主要功能。在监督方法中，我们能够通过输入变量\
    \ `X` 获取输出变量 `Y`。\n\n```\nY = f(X)\n```\n\n这里的主要目标是为新定义的输入数据映射函数近似到输出变量 `Y`。监督学习通过通过监督训练数据集获得。我们已经知道了正确答案；当机器达到所需的性能时，学习过程将停止。\n\
    \n监督学习也适用于分类和回归。让我们更详细地理解分类和回归：\n\n*   **分类**：对于此类别，输出变量被分类为疾病、无疾病、蓝色或红色。\n* \
