  trans: "\n前馈监督神经网络是最主要的且最核心的学习算法之一。它们也被称为深度网络、多层感知器（`MLP`）或简单的神经网络，因此这里展示了具有单个隐藏层的原始设计。每个神经元都通过某些权重与另一个神经元相关联。\n\
    \n![](img/169.jpg)\n\n## 7.14 激活函数\n\n激活函数可以是加权输入之和到神经元输出的映射。它被称为激活/传输函数，因为它决定了神经元激活的起始以及信号的强度。\n\
    \n从数学角度上看，它的定义为：\n\n`Υ = Σ(weight * input) + bias`\n\n在几个激活函数中，我们主要利用 `relu`、`tanh`\
    \ 和 `solfPlus`。\n\n这里给出了激活函数的表：\n\n![](img/170.jpg)\n\n### 7.14.1 反向传播\n\n网络的预测值与预期输出进行比较，并使用函数计算误差。然后，该误差逐层向传回整个网络，因此，权重根据它们对误差的贡献值进行更新。这个巧妙的数学方法被称为反向传播公式。该方法对于你训练知识中的所有示例都是通用的。网络遍历整个训练数据集的一次变化被称为\
    \ `epoch`（周期）。网络也可以经过数十、数百或数千个周期的训练。\n\n![](img/171.jpg)\n\n### 7.14.2 代价函数与梯度下降\n\
    \n代价函数是衡量神经网络对于给定的训练输入及其预期输出表现“好坏”的标准。它还依赖于权重和偏置等属性。\n\n代价函数是单值的，而不是向量，因为它评估的是神经网络的整体性能。利用梯度下降改进公式，权重在每个周期更新一次。\n\
    \n兼容的代价函数：\n\n从数学角度上看，\n\n误差平方和 (`SSE`)\n\n![](img/eq-2.jpg)\n\n权重更新的大小和方向通过沿着代价梯度的相反方向一步来计算。\n\
    \n![](img/eq-3.jpg)\n\n其中，`Δw` 是一个包含每个权重常量 `w` 更新值的向量，其计算方式如下：\n\n![](img/eq-4.jpg)\n\
    \n从图上看，考虑具有单个常数的代价函数：\n\n我们计算梯度下降，直到误差达到最小，每一步都由斜率（梯度）的数值决定。\n\n![](img/172.jpg)\n\
    \n## 7.15 多层感知器（前向传播）\n\n这类网络由多层神经元组成，通常以极强的前馈方式相互连接（向正前方移动）。一层中的每个神经元都与下一层的神经元直接连接。在某些应用中，这些网络的单元使用\
    \ `sigmoid` 或 `ReLU`（修正线性激活）函数作为激活函数。\n\n现在，考虑一个给定账户和家庭成员输入来搜索交易数量的任务。为了解决这个问题，我们希望从构建一个前向传播神经网络开始。我们的输入层是家庭成员和账户的数量，隐藏层只有一个，因此输出层是交易的数量。\n\
    \n如图所示，从输入层到隐藏层的权重输入为家庭成员数量的一对和账户数量三个。\n\n现在通过以下步骤利用前向传播计算隐藏层 `(i, j)` 和输出层 `(k)`\
    \ 的值。\n\n过程\n\n*   乘加法。\n*   点积 (`inputs * weights` )。\n*   一次处理一个信息进行前向传播。\n\
    *   输出是该信息的预测值。\n\n![](img/173.jpg)\n\n`i` 的值可以从输入值计算出来，因此，权重与连接的神经元相比。\n\n`i\
    \ = (2 * 1) + (3 * 1)`\n`→ i = 5`\n\n`同样，`\n\n`j = (2 * -1) + (3 * 1)`\n`→ j =\
    \ 1`\n\n`k = (5 * 2) + (1 * -1)`\n`→ k = 9`\n\n![](img/174.jpg)\n\n在 Python 中求解多层感知器：\n\
    \n```python\nimport numpy as np\n\nprint(\"输入输入层的两个值\")\nprint('a =')\na = int(input())\n\
    print('b =')\nb = int(input())\n\ninput_data = np.array([a, b])\nweights = {\n\
    \    'node_0': np.array([1, 1]),\n    'node_1': np.array([-1, 1]),\n    'output_node':\
    \ np.array([2, -1])\n}\n\nnode_0_value = (input_data * weights['node_0']).sum()\n\
    # 2 * 1 + 3 * 1 = 5\nprint('node 0_hidden: {}'.format(node_0_value))\n\nnode_1_value\
    \ = (input_data * weights['node_1']).sum()\n# 2 * -1 + 3 * 1 = 1\nprint('node\
    \ 1_hidden: {}'.format(node_1_value))\n\nhidden_layer_values = np.array([node_0_value,\
    \ node_1_value])\noutput_layer = (hidden_layer_values * weights['output_node']).sum()\n\
    # 5 * 2 + 1 * -1 = 9\nprint(\"output layer : {}\".format(output_layer))\n```\n\
    \n## 7.16 使用激活函数\n\n为了让神经网络获得预测能力，我们希望在隐藏层使用激活函数。它通常用于捕非非线性。\n\n对于修正激活函数（`ReLU`）：\n\
    \n```python\nimport numpy as np\n\nprint(\"输入输入层的两个值\")\nprint('a =')\na = int(input())\n\
    print('b =')\nb = int(input())\n\ninput_data = np.array([a, b])\n\ndef relu(input):\n\
    \    # 修正线性激活\n    output = max(input, 0)\n    return output\n\nweights = {\n\
    \    'node_0': np.array([2, 4]),\n    'node_1': np.array([4, -5]),\n    'output_node':\
    \ np.array([2, 7])\n}\n\nnode_0_input = (input_data * weights['node_0']).sum()\n\
    node_0_output = relu(node_0_input)\n\nnode_1_input = (input_data * weights['node_1']).sum()\n\
    node_1_output = relu(node_1_input)\n\nhidden_layer_outputs = np.array([node_0_output,\
    \ node_1_output])\nmodel_output = (hidden_layer_outputs * weights['output_node']).sum()\n\
    \nprint(model output)\n```\n\n![](img/176.jpg)\n"
