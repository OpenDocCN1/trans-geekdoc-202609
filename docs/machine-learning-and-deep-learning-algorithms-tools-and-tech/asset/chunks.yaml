    通常，深度学习公式需要很长时间来训练。这可能是因为极深的深度学习公式中包含大量参数，导致训练时间比通常更长。最先进的深度学习公式 `ResNet` 从头开始需要两周才能完全训练。相比之下，机器学习花费的时间相对很少，从几秒到几小时不等。这种情况在测试时是完全反转的。在检查时，深度学习公式的运行速度非常快。这与同样属于机器学习算法一类的
    `k-nearest neighbors` 可以对比，随着信息规模的增大，检查时间将会增加。这适用于所有的机器学习算法，因为许多算法的测试时间也很短。


    # 7.11.4 可解释性


    最后，但同样不容忽视，我们将可解释性作为机器学习和深度学习比较的一个元素。这个问题是深度学习在投入业务使用之前被反复考虑十倍的主要原因。


    举个例子，假设我们倾向于使用深度学习对作文进行机器驱动评估。它在评估方面的表现非常出色，接近人类水平。然而，存在一个问题：它没有揭示为什么给出那个分数。因此从数学角度来说，你会确定深度神经网络的节点被激活了，但我们往往无法理解这些神经元到底在模拟什么模型，以及这些层神经元共同在做什么。因此，我们往往无法解释结果。


    另一方面，像 `call trees` 这样的机器学习算法提供了清晰的规则，解释了为什么选择它、它了什么，因此，解释其背后的推理要简单得多。因此，像 `call
    trees` 和 `linear/logistic regression` 等算法主要在业务中用于可解释性。


    # 7.12 TensorFlow


    Python 深度学习库 `TensorFlow` 简介。


    `TensorFlow` 是由 Google 免费提供的用于快速数值计算的 Python 库。`TensorFlow`库用于深度学习。


    # 7.12.1 什么是 TensorFlow


    `TensorFlow` 是一个用于快速数值计算的开源库。它由 Google 开发并维护，并在 Apache 等几个开源许可下免费提供。该 `API` 主要用于
    Python 编程语言，但也可以访问基础的 `C++ API`。与其他旨在作为深度学习部分的数值库（如 `Theano`）不同，`TensorFlow` 旨在用于研究、开发和工业级框架。它可以在单处理器框架、GPU
    甚至手机和许多台机器的大规模框架上运行。


    # 7.12.2 安装 TensorFlow 的步骤


    从链接 [`www.tensorflow.org/versions/r0.8/get_started/os_setup.html`](https://www.tensorflow.org/versions/r0.8/get_started/os_setup.html)
    下载 `TensorFlow`，`TensorFlow` 网站提供了传输和安装说明。


    `TensorFlow` 示例


    计算是在有向图结构中通过信息流和操作来定义的。


    **节点：** 节点执行计算，并有零或多个输入和输出。在节点之间移动的信息被称为 `tensors`。


    **边：** 节点之间的连接代表信息的流。


    **操作：** 在每个节点上执行的函数。


    使用 `TensorFlow` 进行计算


    # 7.12.3 使用 TensorFlow 进行线性回归


    `TensorFlow` 可以是机器学习的工具，但它包含了许多功能层。在 `TensorFlow` 中，我们有 `W`（权重）和 `b`（偏置）。公式为 `y
    = Wx + b`，其中 `x` 是输入数据，`y` 是预期输出。


    # 7.13 人工神经网络


    深度学习背后的主要概念是它应该从大脑中汲灵感。`neural networks` 由 `neurons` 层组成，单个神经元并不并不智能。但当它们相互移动后就变得智能了。


    # 7.13.1 神经元


    `neural networks` 的基本构建模块是人工 `neurons`，它们具有激活函数的简单单元。这些神经元分布在网络中的许多层中。


    # 7.13.2 人工神经网络如何工作？


    深度学习由基于相似结构的人工神经网络组成。当知识通过这个人工网格传输时，每一层都会处理信息的侧面，过滤特征，并产生最终输出。


    **输入层：** 该层由神经元组成，它们除了接收输入并传递给相反层之外什么都不做。输入层中的层数应当能够适应数据集中的属性。


    **输出层：** 输出层是预期的特征，它本质上取决于你正在构建的模型类型。


    **隐藏层：** 输入和输出层之间是支持模型类型的隐藏层。隐藏层包含大量的神经元。隐藏层中的神经元在传递输入之前对输入进行变换；因为网络经过了训练，权重会更新得更具预测性。


    # 7.13.3 神经元权重


    权重检查两个神经元之间关联的强度或振幅，如果你熟悉简单回归，你会发现我们对输入的依赖就像我们在方程中使用的系数一样。权重通常初始化为微小的随机值，例如零到一之间的随机值。


    # 7.13.4 前馈深度网络


    前馈监督神经网络是最基础且最复杂的深度学习算法之一。它们也被称为深度网络、多层感知器 (`MLP`) 或简单的神经网络，因此图中展示了带隐藏层的原始设计。每个神经细胞都通过某些权重与另一个神经细胞相关联。

