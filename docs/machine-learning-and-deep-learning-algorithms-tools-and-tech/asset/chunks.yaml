  trans: "\n\n大数据和深度学习是数据科学的两个热点。海量信息已成为基础，因为每个开放机构和个人都在收集大量特定数据，这些数据可能包含有关国家洞察、数字安全、勒索识别、广告和医学逻辑等问题的支持数据。谷歌和微软等公司正在对海量数据进行业务分析和决策，影响着现在和未来的创新。深度学习算法通过分层学习技术，从数据描述中提取异常状态和复杂的推理。复杂的推理在给定层级被学习，并通过层链中前一层创建的较不复杂的表示得到增强。深度学习的一个关键优势是能够对大量无标记数据进行分析和学习，使其成为数据基本上无标记且无序的大规模机器学习分析的重要工具。在深度学习研究中，我们倾向于研究深度学习如何用于解决大数据分析中的某些重要问题，以及从海量数据中提取复杂示例、语义分类、标签学习、快速数据检索和优化分类任务。我们还倾向于研究深度学习研究中一些需要进一步探索的部分，以应对大数据分析提出的特定挑战，此外还有数据泄露、高维数据、量化模型和迁移计算。我们倾向于通过激发一些问题来展示未来重要工作的经验，并处理数据检查标准、空间调整显示、获取支持性学习过程标准、新兴语言分类、半监督学习和动态学习。\n\
    \n“深度学习可能是一种明确合理的机器学习技术，它通过学习将世界表示为嵌套的概念层次结构来实现稳定性和灵活性，其中每个概念根据较简单的概念定义，许多抽象表示是根据不那么抽象的计算出来的。”\n\
    \n# 7.6 深度学习未来能做什么？\n\n深度学习是一个能让计算机像人类一样甚至更智能的巨头。未来，许多应用程序每天都在开发并发布到市场，由于其在工作中的准确性和效率以及对工作的奉献受到人类社会的喜爱，随着它执行工作并表现得更好，它变得日益完美。如今已经有了自动游戏、图像捕捉生成、角色文本生成、自动图像上色等。\n\
    \n一些深度学习架构如深度神经网络和循环神经网络已应用于多个领域，包括计算机视觉、语音音频识别、自然语言处理（构成了人类与大脑通信之间的桥梁）。在大量数据收集下，它负责社交网络过滤、机器翻译、生物信息学、药物设计和医学图像分析，这在医学和生物图像分析、材料检测以及在所有平台运行的棋类程序方面取得了新的研究进展。它们通过反复执行相同的过程，在该任务中变得完美，并产生了与人类专业人士相似在某些情况下甚至更伟的结果，而且在超越自身在该领域的完美之前，不会停止执行该过程。\n\
