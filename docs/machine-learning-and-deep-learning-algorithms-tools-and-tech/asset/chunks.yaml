    \ `Accuracy`（准确率），突出显示百分比值。\n    ![](img/29.jpg)\n\n5.  在历史列表中选择所需的模型以提供图表。在下一阶段，请参考\
    \ `Classifier Training Manual`（分类器训练手册）和 `Model classification`（模型分类）。\n6.  对于数据集，你需要通过点击\
    \ `All` 提供模型分类器。\n    ![](img/30.jpg)\n\n## 3.8.2 手动分类器训练\n\n在需要研究单个模型类型的情况下，或者在你确定需要哪种分类器的情况下，你可以逐个准备分类器，或者准备一个同类型的集合。\n\
    \n1.  选择分类器：在 `CLASSIFICATION LEARNER` 选项卡中，在 `Model Type` 部分，点击一个分类器进行编写。要查看所有可用的分类器选项，点击\
    \ `Model Type` 部分右侧角的螺钉以展开分类器列表。`Model Type` 库中的选项在初始阶段提供了各种设置。\n    查看每个分类器的描述，切换到感兴趣的点：\n\
    \    ![](img/31.jpg)\n\n2.  有关每个选项的更多信息，请参见 `Choose Classifier Options`（选择分类器选项）。\n\
    \n## 3.8.3 并行分类器训练\n\n"
