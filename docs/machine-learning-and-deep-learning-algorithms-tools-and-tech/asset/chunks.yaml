    stairs, or lying down. We require the input data for training classification model
    to identify these activities. Since our goal is classification, we’ll be applying
    supervised learning.


    The trained model (or classifier) will be integrated into an application to help
    users track their activity levels throughout the day. To achieve this, we’ll perform
    the following steps:


    **Step 1 – Load the Data**


    To load data from the accelerometer and gyroscope we do the following:


    1.  Sit down holding the phone, log data from the phone and store it in a text
    file labeled `Sitting`.


    2.  Stand up holding the phone, log data from the phone and store it in another
    text file labeled `Standing`.


    3.  Repeat the steps until we have data for each activity we want to classify.
    We store the labeled datasets in a text file. Flat file formats such as text or
    CSV are easy to work with and makes it straightforward to import data.


    Machine learning calculations are not sufficiently shrewd to differentiate amongst
    clamor and profitable data. Before utilizing the information for preparing, we
    have to ensure it’s spotless and finished.


    **Step 2 – Preprocess the Data**


    In MATLAB, we need to transfer and import data for plotting labeled dataset. Pre-processing
    of data can be presented as follows:


    1.  Look for outliers (data points that lie outside the rest of the data). We
    must decide whether the outliers can be ignored or they indicate a phenomenon
    that the model should account for. In our example, they can safely be ignored
    (it turns out that we moved unintentionally while recording the data).


    2.  Check for missing values (perhaps we lost data because the connection dropped
    during recording). We could simply ignore the missing values, but this will minimize
    the dataset. Alternatively, we could substitute approximations for the missing
    values by interpolating or using comparable data from another sample.


    3.  Remove gravitational effects from the accelerometer data so that our algorithm
    will focus on the movement of the subject, not the movement of mobile. In simple
    filter of highpass there will be biquad process.


    4.  Divide the data into two sets. We save a part of the data for testing (the
    test set) and use the rest (the training set) to build models. This is referred
    to as holdout and is a useful cross validation technique.


    **Step 3 – Derive the Features**


    Deriving features (also known as feature engineering or feature extraction) of
    machine learning is an important constraint.


    It turns raw data into information that a machine learning algorithm can use.
    For the activity tracker, we want to extract features that capture the frequency
    content of the accelerometer data. These features will help the algorithm distinguish
    between walking (low frequency) and running (high frequency). We create a new
    table that includes the selected features.


    # [1.4.1 Steps the Machine Learning Workflow using a Health Monitoring](#toc.xhtml#s1_4_1a)


    Feature selection factors are used for the following features:


    *   Machine learning algorithm accuracy enhancement


    *   High-dimensional boost model performance enhancement


    *   Interpret ability model improvement


    *   Prevention of over fitting


    The feature count could derive is limited only by your imagination. However, there
    are a lot of techniques commonly used for different types of data.


    | Data type || Feature selection task || Techniques |


    | --- | --- | --- |


    | Sensor data || Extract signal properties from raw sensor data to create higher-level
    information || **Peak analysis**—perform an fft and identify dominant frequencies.**Pulse
    and transition metrics**—derive signal characteristics such as rise time, fall
    time, and settling time.**Spectral measurements**—plot signal power, bandwidth,
    mean frequency, and median frequency. |


    | Image and video data || Extract features such as edge locations, resolution,
    and color || **Bag of visual words**—create a histogram of local image features,
    such as edges, corners, and blobs.**Histogram of Oriented Gradients** (**HOG**)—create
    a histogram of local gradient directions.**Minimum eigenvalue algorithm**—detect
    corner locations in images.**Edge detection**—identify points where the degree
    of brightness changes sharply. |


    | Transactional data || Calculate derived values that enhance the information
    in the data || **Timestamp decomposition**—break timestamps down into components
    such as day and month.**Aggregate value calculation**—create higher-level features
    such as the total number of times a particular event occurred. |


    **Stage 4 – Build and Train the Model**


    We begin with a fundamental choice tree. When fabricating a model, it’s a smart
    thought to begin with something basic; it will be quicker to run and less demanding
    to translate.


    ![](images/7.jpg)


    To perceive how well it performs, we plot the disarray framework, a table that
    looks at the characterizations made by the model with the real class names that
    we made in stage 1.


    ![](images/8.jpg)


    The disarray framework demonstrates that our model is experiencing difficulty
    recognizing strolling and running. Perhaps a choice tree doesn’t work for this
    kind of information. We’ll attempt a couple of various calculations.


    We begin with **K-nearest neighbors** (**KNN**), a basic calculation that stores
    all the preparation information, thinks about new indicates the preparation information,
    and returns the most regular class of the K-nearest focuses. That gives us 98%
    exactness contrasted with 94.1% for the basic choice tree. The perplexity grid
    looks better:


    ![](images/9.jpg)


    KNNs take a lot of memory to run, since they require all the preparation information
    to make an expectation. We attempt a direct discriminant display; however, that
    doesn’t enhance the outcomes. At last, we attempt a multiclass bolster vector
    machine (SVM). The SVM does—we now get 99% precision.


    ![](images/9a.jpg)


    We accomplished our objective by emphasizing on the model and attempting distinctive
    calculations. In the event that our classifier still couldn’t dependably separate
    amongst strolling and running, we’d investigate approaches to enhance the model.


    **Stage 5 – Improve the Model**


    # Disentangle


    To begin with, we search for chances to decrease the quantity of highlights. Well
    known element decrease strategies include:


    *   **Correlation network**: Demonstrates the connection between factors, with
    the goal that factors (or highlights) that are not exceedingly related can be
    evacuated.


    *   **Principal segment investigation (PCA)**: Disposes off excess by finding
    a blend of highlights that catches key qualifications between the first highlights
    and brings out solid examples in the dataset.


    *   **Sequential component diminishment**: Lessens includes iteratively on the
    model until there is no change in execution.


    *   Pruning branches from a choice tree


    *   Removing students from a gathering


    # Include Complexity


    In the event that our model can’t separate strolling from running since it is
    over-summing up, we need to discover approaches to make it all the more tweaked.
    To do this, we can do the following:


    *   **Use display blend**: Combine numerous, less difficult models into a bigger
    model that is better ready to speak to the patterns in the information than any
    of the less complex models could without anyone else.'
