    ## 3.1 监督学习


    ### 监督学习的工作流与算法


    ### 什么是监督学习？


    机器学习是一种以最小易感性预测结果视图的模型。正如多功能计算能够区分信息中的设计一样，计算机也会从感知中进行“学习”。当面对更多感知结果时，计算机会提高其预测执行能力。


    机器学习为计算提供了一种信息安排，用于产生信息和模型训练，从而对数据数据做出合理的响应。


    ![](img/22.jpg)


    监督学习可以分为两种不同的方法：分类和回归。


    在分类中，信息类的目标被分配（或标记）为特定的有限信息感知排序。在这种情况下，响应包含因子信息。应用包括垃圾邮件、商业建议框架以及图像与语音识别。预测患者在一年内是否表现出至少一点良性攻击是一个分类问题，可能的类别为真或假。分组算法通常估计响应估值。尽管如此，很少有算法适用于普通信息类型（函数
    `fitcecoc`）。


    在回归分析中，目标是为感知预测连续的估计值。为此，响应因子为真实数字。这里的应用包括评估成本、能源消耗或发病率。


    监督学习采用以下步骤：


    * 数据准备

    * 选择合适的算法

    * 模型拟合

    * 选择验证方法

    * 选择拟合和更新的满足条件


    # 准备数据


    所有监督学习策略都始于一个信息矩阵，通常标记为 `d` 作为 `X` 或指示器。处理 `X` 中包含 `NaN` 值的部分。通常，与机器学习算法监督计算相关的工具箱会处理
    `NaN` 值，通过忽略或删除带有 `NaN` 信息的列。


    要为响应数据 `Y` 使用不同的信息写入，每个组件代表 `Y`，其中关联列的响应为 `X`。带有缺失信息的 `Y` 感知计数减少。


    在回归值中，`Y` 需要是数值向量，其组件数量与 `X` 列的数量相同。


    在分类中，`Y` 基于以下信息组成。


    | 数据类型 | 缺失值值 |

    | --- | --- |

    | 数值 | `NaN` |

    | 类别 | `<undefined>` |

    | 字符数组 | 空格组成的行 |

    | 字符向量单元数组 | , , |

    | 逻辑向量 | (无法表示) |


    # 模型拟合


    用于拟合的模型函数基于算法选择。


    | 分类树 | `Fitctree` |

    | --- | --- |

    | 回归树 | `Fitrtree` |

    | 判别分析 | `Fitcdiscr` |

    | *k*-最近邻 | `Fitcknn` |

    | 朴素贝叶斯 | `Fitcnb` |

    | 支持向量机 (SVM) | `Fitcsvm` |

    | 回归 SVM | `Fitrsvm` |

    | 多分类模型或其他分类器 | `Fitcecoc` |

    | 分类集成 | `Fitc ensemble` |

    | 回归集成 | `fitr ensemble` |

    | 并行的分类树或回归树（例如，随机森林 [1]） | `Tree Bagger` |


    # 验证方法选择


    在模型验证中，使用了三种基本技术来检查后续拟合模型的准确性，如下所示：


    查看重替换误差。例如，参见：


    * 分类树重替换误差

    * 用于交叉验证的回归树

    * 集成分类器的质量


    示例：判别分析分类器的重替换误差


    分类树重替换误差


    1. 使用以下函数加载 MATLAB 中相关的 Fisher 鸢尾花数据。

    ```

    >> load fisheriris

    ```

    2. 使用默认构建的分类树对加载的所有数据进行训练。

    ```

    >> Mdl = fitctree (mead, species);

    ```

    3. 检查重替换误差。

    ```

    >> resuberror = resubLoss (Mdl)

    resuberror = 0.0200

    ```


    # 交叉验证回归树


    此示例演示了如何根据小型汽车数据查看预测里程回归树的重替换和交叉验证精度。加载此数据集是为了将加速、位移、扭矩和重量作为 MPG 的指标。


    ```

    >> load carsmall

    X = [Acceleration Displacement Horsepower Weight];

    ```

    回归树通过观测值增长。


    ```

    >> rtree = fitrtree (X, MPG);

    >> resuberror = resubLoss (rtree)

    ```

    计算样本内误差。

    ```

    resuberror = 4.7188

    ```

    估计交叉验证 MSE。

    ```

    >> rng ''default'';

    cvrtree = crossval (rttree);

    cvloss = kfoldLoss (cvrtree)

    cvloss = 23.8065

    ```


    # 算法选择


    算法的特征在不同方面有所不同，说明如下：


    * 数据训练速度

    * 内存利用

    * 新数据的准确性

    ** 透明度或可解释性，

    * 揭示了算法易于理解的

    * 使用拟合模型进行预测


    ## 3.2 监督机器学习


