  trans: "\n朴素贝叶斯模型期望特征在类别中具有多元离散性，但用于生成特征的指示器是独立的。该系统遵循一套完整的能力列表，最终目标是使特征成为多项计数的排列。\n\
    \n要准备一个朴素贝叶斯模型，请在命令行界面中使用 `fitcnb`。准备完成后，可以预测标记或评估模型的后验概率和信息预测模型。\n\n朴素贝叶斯分类器设计用于每个类别内部的指示器互不独立的情况，尽管在这一独立假设并不成立时，它通常也能运行良好。它分两个阶段对数据进行分组：\n\
    \n1.  **训练阶段**：使用训练数据，策略评估似然估计的参数，假设指标在每个类别内是条件独立的。\n2.  **预测阶段**：在隐藏的测试数据中，策略计算每个类别的对应的后验概率示例。策略随后根据最大的后验概率将测试数据归为相应的类。\n\
    \n类别条件独立性假设极大地改进了训练过程，并独立地估计每个指标与类别相关的一维密度。虽然类别条件独立性指标并不总是成立，但事实证明这种假设通常运行良好。这种指标的类别独立性假设使得朴素贝叶斯分类器能够利用最少的训练数据通过许多不同的分类器评估出精确类别所需的参数。这使得对于包含许多指标的数据集特别有效。\n\
    \n### 支持的分布\n\n朴素贝叶斯配置的训练过程依赖于估计 `P(X|Y)`，其中预测 `X` 属于类别 `Y`。朴素贝叶斯模型 `Classification\
    \ NaiveBayes` 和训练函数 `fitcnb` 支持典型的（高斯）、分段、多项和多元多项指示器条件分布。要确定指标的分布，请使用与 `fitcnb`\
    \ 参数匹配的 `DistributionNames`。你可以通过提供与分布名称相关的字符向量为所有指标指定一种分布类型；或者通过提供长度为 `D` 的字符向量单元格数组为指标指定不同的分布，其中\
    \ `D` 是指标的数量（即 `X` 的段数）。\n\n#### 正态（高斯）分布\n\n“正态”分布（使用‘normal’确定）具有普通方差类的适当参数。每个指标表现出一个典型分布，朴素贝叶斯分类器通过处理数据类生成的均值和标准差，评估每个类别中不同的正态属性。\n\
    \n#### 核分布\n\n‘核’分布（使用‹kernel›确定）适用于一致属性分布。固体假设，例如正态分布，并且可以使用指标可能偏斜或出现模式的情况。对于你显示部分分布的每个指标，朴素贝叶斯分类器会根据该类别的训练数据为每个类计算不同的部分密度估计。当然，该部分是分类器的一部分，它为类和指标自然地选择宽度。产品支持为每个指标确定不同的部分以及为每个指标或类确定不同的宽度。\n\
    \n#### 多元多项分布\n\n多元多项分布（指定‘mvmn’）清晰地表示指标的感知。使用多元多项指示器开发朴素贝叶斯分类器如所示。标记为 0、1 或 2\
    \ 的示例感知指向目标示例。\n\n1.  特定的类别代表整个指标的感知。例如，特定的类别（或指标电级）可能包含晴、雨、雪和阴云。\n2.  对于感知，将命名\
    \ 0 的感知与命名 1 和 2 的感知隔离开，将 1 与 2 隔离开。\n3.  对于每个类别，使用总观测数的特征化拟合一个多项模型。例如，对于命名为 0\
    \ 的观测，评估的概率 `psunny = (命名为 0 的数量)/(总观测检查 0)` 等同于类别和响应名称。\n\n类别条件的多项不规则因子包含一个多项任意变量。它包含一些直接来自分类器的独特属性。\n\
    \n*   每个指标在朴素贝叶斯分类器中显示为多项分布。\n*   为每个指标记录不同的配置特定指标电级。\n*   在每个类别中计算不同的配置概率指标。\n\
    \n在编程底层将许多指标显示为多项。对于给定情况，指标是估计中的唯一事件。对此类指标进行离散化是很好的做法。\n\n#### 多项分布\n\n多项分布（使用\
    \ `DistributionNames`,’mn’确定）适用于给定类别时每个观测都是多项任意变量的情况。也就是说，指标数据 `X` 的感知或行 `j` 代表\
    \ `D` 个类别，其中 `xjd` 是在 `nj` 次独立试验中分类（即预测器）`d` 发生的次数。拟合一个朴素贝叶斯分类器的方法概述如下：\n\n1.\
    \  对于每个类别，给定其类别的指标拟合一个多项分布。我们这样做通过：\n    1.  在所有感知上聚合加权的分类检查。此外，产品实现了额外的平滑处理。\n\
    \    2.  利用总计的分类检查估计每个类别内部 `D` 个类别概率。这些分类概率构成了多项分布的似然参数。\n2.  让另一个感知具有总计数 m。此时，朴素贝叶斯分类器：\n\
    \    1.  将每个每个多项分布的聚合检查参数设置为 `m`。\n    2.  对于每个类别，使用评估的多项分布计算类别的后验概率。\n    3.\
    \  通过与最高的后验概率比较将感知预测到该类。\n\n考虑假设的令牌显示，其中有一个包包含不同类型和大小的各种令牌。每个指标代表所处理的特定类型的令牌；感知是从袋中对令牌进行\
    \ `n` 次独立抽取（即有放回抽样），信息是一个计数检查向量，其中元素 `d` 是令牌 `d` 出现的情况。\n"
