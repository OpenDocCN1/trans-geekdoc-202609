    \n*   `Linear regression` 用于解决回归问题\n*   `Random forest` 用于解决回归和分类问题\n*   `Support\
    \ vector machines` 用于解决分类问题\n\n### 无监督学习\n\n如果数据仅输入数据 `X` 而没有与输入变量对应的任何输出变量，那么它属于无监督机器学习算法。\n\
    \n无监督学习的主要目标是具有底层结构的数据分布，以便更好地理解数据。这种数据处理被称为无监督学习，因为它没有正确答案或老师。\n\n# 方法\n"
