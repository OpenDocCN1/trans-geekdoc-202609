    PC 文档。

    - **清洗**：学习是指消除或处理缺失信息。同样，可能存在不完整且无法传达你预期数据的案例，你可能需要处理这些问题。这些示例可能被剔除。此外，某些特征中可能包含敏感信息，这些属性可能被匿名化或与数据完全分离。

