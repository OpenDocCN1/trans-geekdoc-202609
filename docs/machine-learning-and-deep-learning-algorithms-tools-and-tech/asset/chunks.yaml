  trans: "\n\n一个在 MATLAB 中执行单变量逻辑回归的简单示例\n\n# 3.9.3.1 线性回归\n\n当给定某些变量 `X` 和对应的结果 `Y`\
    \ 时，线性回归是我们用于寻找或猜测 `X` 与 `Y` 之间关系的方法。如果 `X` 仅包含一维变量，则线性回归可以用下面的图表示，我们都非常熟悉。\n\n\
    ![](img/56.jpg)\n\n每当有人提到线性回归时，他们最可能是在说“如果你的朋友想卖房子……”。根据上述所有点，我们可以使用线性回归来猜测房屋面积与房价之间的关系。\n\
    \n此外，当我们的 `X` 是多维的（特别是超过 2 维时），通过图表来表示问题的概率会降低，但问题仍然与 1 维问题相似，只是需要猜测 `θ0 + X1θ1\
    \ + X2θ2 + … + Xjθj = Y` 中的 `θ` 值，其中 `j` 是 `X` 的维度。\n\n# 3.9.3.2 SVM\n\n## 用于二分类的支持向量机\n\
    \n### 理解支持向量机\n- 可分数据\n- 不可分数据\n- 带核的非线性变换\n- 可分数据\n\n当你的信息精确分为两类时，你可以利用支持向量机（`SVM`）。`SVM`\
    \ 通过寻找最佳超平面对信息进行分组，将一类的所有信息点与另一类的点隔离开。`SVM` 的最佳超平面意味着两类之间具有最大间隔（margin）。边缘意味着平行于超平面且没有内部信息点的截面的最大宽度。\n\
    \n信息中的支持向量表示最近的隔离超平面；这些向量关注分界边界。附图显示了这些定义，其中 `+` 表示第 1 类信息点，– 表示第 -1 类信息点。\n\n\
    ![](img/57.jpg)\n\n### 使用支持向量机\n\n同样，对于任何受控的学习模型，你首先准备一个支持向量机，然后交叉验证该分类器。使用准备好的机器来表征（预测）新信息。同样，为了获得理想的预测准确性，你可以利用不同的\
    \ `SVM` 组件能力并调整这些组件的参数。\n\n### 准备 SVM 分类器\n\n利用 `fitcsvm` 准备并交叉验证一个 `SVM` 分类器\n\
    \n![](img/57a.jpg)\n\n### 程序\n\n```matlab\n% 在单位圆内均匀分布 100 个点\n% 为了做到这一点，生成一个均匀随机变量的平方根作为半径\
    \ r，\n% 在 (0, ) 内均匀生成一个角度 t，\n% 并将点放在 (r cos( t ), r sin( t ))\n\nrng(1) ; % 为了可复现性\n\
    r = sqrt(rand(100,1)) ; % 半径\nt = 2*pi*rand(100,1) ; % 角度\ndatal = [r.*cos(t),\
    \ r.*sin(t)] ; % 点\n% 在环形内均匀分布 100 个点。\n% 半径再次与平方根成比例，\n% 这次是 1 到 4 均匀分布的平方根。\n\
    r2 = sqrt(3*rand(100, 1)=1); % 点\n\n% 绘制点，并绘制半径为 1 和 2 的圆进行比较。\nfigure;\nplot\
    \ (data1(;,1),data1(:,2),’r.’,’MarkerSize’,15)\nhold on\nplot (data2(;,1),data2(:,2),’r.’,’MarkerSize’,15)\n\
    ezpolar(@(x)1) ;ezpolar(@(x)2);\naxis equal\nhold off\n```\n\n#### 输出\n![](img/58.jpg)\n\
    \n### 程序\n\n```matlab\n% 将数据放入一个矩阵中，并创建一个分类向量。\ndata3 = [data1;data2] ;\ntheclass\
    \ = ones(200,1) ;\ntheclass(1;100) = -1;\n% 使用 KernelFunction 设置为 ‘rbf’ 且 BoxConstraint\
    \ 设置为 Inf\n 训练一个 SVM 分类器。绘制决策边界并标记支持向量。\nc1 = fitcsvm(data3,theclass, ‘KernelFunction’,\
    \ ‘rbf’ , . . .\n‘BoxConstraint’,Inf,’ClassNames’,[-1,1] ) ;\n% 在网格上预测得分\nd =\
    \ 0.02;\n[x1Grid,x2Grid] = meshgrid(min(data3(:,1)):d:max(data3(:,1) ) , . . .\n\
    min(data3(:,2) ) :d:max(data3(:,2) ) ) ;\nxGrid = [x1Grid( : ) ,x2Grid( : ) ]\
    \ ;|\n[~,scores] = predict (c1,xGrid) ;\n% 绘制数据和决策边界\nfigure;\nh(1:2) = gscatter(data3(:,1),\
    \ data3(:,2),theclass=’rb’,’.’) ;\nhold on\nezpolar (2(x)1) ;\nh(3) = plot(data3(c1.IsSupportVector,1),data3(c1.IsSupportVector,2),’ko’);\n\
    contour (x1Grid,x2Grid,reshape(scores(:,2),size(x1Grid)),[0 0], ‘k’ ;\nlegend\
    \ (h,{‘-1’,+1’}) ;\naxis equal\nhold off\n```\n\n#### 输出\n![](img/59.jpg)\n\n\
    ### 程序\n\n```matlab\nc12 = fitcsvm(data3,theclass,KernelFunction,’rbf’)\n[~,scores]\
    \ = predict (c12,xGrid)\nfigure;\nh(1:2) = gscatter(data3(:,1), data3(:,2),theclass=’rb’,’.’)\
    \ ;\nhold on\nezpolar (2(x)1) ;\nh(3) = plot(data3(c12.IsSupportVector,1),data3(c12.IsSupportVector,2),’ko’);\n\
    contour (x1Grid,x2Grid,reshape(scores(:,2),size(x1Grid)),[0 0], ‘k’ ;\nlegend\
    \ (h,{‘-1’,+1’}) ;\naxis equal\nhold off\n```\n\n"
