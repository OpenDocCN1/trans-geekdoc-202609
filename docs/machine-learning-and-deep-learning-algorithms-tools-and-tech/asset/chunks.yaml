    ## 6.2 使用前馈网络进行分类


    使用自组织映射神经网络聚类


    自组织特征映射（SOFM）用于描述显示累积数据空间的输入向量。通过自处理中的差异化中心层，通过邻居神经元执行对相邻区域数据空间控制控制。因此，自组织网络的映射提供了一种更广泛的（如强制层一样）拓扑结构来学习输入向量。


    SOFM 层神经元首先根据网络的物理位置进行排序。其他 MATLAB 函数如 `gridtop`、`randtop` 或 `hextop` 会在六角形、网格或互连网络中协调神经元。通过工作神经元的分类，在不同情况下评估离散。神经元离散通过
    `boxdist`、`mandist`、`dist` 和 `linkdist` 函数进行评估。为了清晰理解神经元，离散在具有特定距离限制的拓扑中描述。在此，神经元之间的距离通过
    `gridtop`、`hextop` 和 `randtop` 函数计算；距离函数给出 `dist`、`linkdist`、`mandist` 和 `boxdist`。


    在这里，自处理组件感知一个胜出神经元 `i*`，使用参与层的一个模糊框架。然而，与神经元数量相比，特定的邻域 `Ni*(d)` 神经元距离是使用通过柯霍运行评估的神经元计算的。基于此，所有神经元值通过
    `i` ∊ `Ni*` 进行调整。


