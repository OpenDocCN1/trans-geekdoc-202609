    Science at Aryabhatt Engineering College and Research center, Ajmer and also visiting
    faculty in Government University MDS Ajmer. He has total Academic teaching experience
    of more than eight years with more than 50 publications in reputed National and
    International Journals. He has edited five books with `Wiley`, `Taylor & Francis`
