    每一个开放操作都以参考页格式记录。


    ## 显示格式示例


    在这些两个或三个不同操作实例中，以及通过双部分 `x` 向量的操作传递的输出，不同程度的说明如下：


    当前格式设置检查：


    ![](img/225.jpg)


    之前将值设为 `x` 并以 5 位缩放定点显示：


    ![](img/226.jpg)


    将格式设为 5 位浮点数：


    ![](img/227.jpg)


    将格式设为 15 位缩放定点：


    ![](img/228.jpg)


    在小整数比例格式下，需要设置“理性”输出：


    ![](img/229.jpg)


    在十六进制格式下，将整数值设置为 `x` 并使用 16 进制显示：


    ![](img/230.jpg)


    ## 数值设置格式程序


    如果需要修改程序中的某些值而非数值，请通过向变量添加类似函数来获取原理关联。策略路径将利用此处出现的函数重新建立设置：


    ![](img/231.jpg)


    ## 合并整数类型


    ### 概述


    如果你连接特定的数字系统（例如，在 16 位中区分无符号值或 8 位整数）。通常在 MATLAB 中，由典型函数组成的所有结构都是分段的。MATLAB 生成系统设置为所需数据类型最左侧的数据截面。例如，带有三个
    16 位向量检查整数的接口延迟结果：


    ![](img/232.jpg)


    ### 合并整数大小示例


    在如上述的整数链接通知后，连接相应的两个数字然后切换它们的请求。结果取决于整数连接时的请求。最左侧写入决定了向量组件的信息组成：


    ![](img/233.jpg)


    主要操作重新建立了 16 位整数向量。整数返回 8 位向量计数。在此元素中，值通过函数 `int16(5000)` 被设置为 127，这是 8 位检查整数的最大驱动力。


    类似的原则也适用于垂直连接：


    ![](img/234.jpg)


    #### 注意


    你可以利用 `intmax` 和 `intmin` 函数找到任何 MATLAB 整数写入的最大或最小属性。`realmax` 和 `realmin` 函数用于浮点数。


    ### 有符号与无符号组合


    目前类似的操作标记整数的有符号和无符号。同样，最左侧组件决定了后续网络中所有组件的信息写入：


    ![](img/235.jpg)


    MATLAB 在评估每个元素之前将其连接到一个合并簇。因此，随后的声明评估为 8 位有符号数（等于值 50），并与之前的 8 位无符号整数（即在此值中被设为零作为无符号值而非
    50）合并为两个组件。在第二个组件中，保留的值与无符号 `int8` 类型相反：


    ![](img/236.jpg)


    ## 合并整数和非整数数据


    如果你连接数字与双精度、单精度或逻辑类，所有组件都有后续的网格，其信息类型为最左侧整数。MATLAB 在评估每个元素之前将其连接到一个合并簇。因此，随后的声明评估为
    8 位有符号数（等于值 50），并与之前的 8 位无符号整数（即在此值中被设为零作为无符号值而非 50）合并为两个组件。


    ### 空矩阵


    如果你连接数字与双精度、单精度或逻辑类，所有组件都有后续的网格，其信息类型为最左侧整数。MATLAB 在评估每个元素之前将其连接到一个合并簇。如果你构建了一个空矩阵：


    ![](img/237.jpg)


    ### 拼接示例


    如果你连接数字与双精度、单精度或逻辑类，所有组件都有后续的网格，其信息类型为最左侧整数。MATLAB 在评估每个元素之前将其连接到一个合并簇。如果你构建了一个空矩阵：


    ![](img/238.jpg)


    ### 单精度与双精度组合


    如果你连接数字与双精度、单精度或逻辑类，所有组件都有后续的网格，其信息类型为最左侧整数。MATLAB 在评估每个元素之前将其连接到一个合并簇。如果你构建了一个空矩阵：


    ![](img/239.jpg)


    ### 双精度与整数组合


    如果你连接数字与双精度、单精度或逻辑类，所有组件都有后续的网格，其信息类型为最左侧整数。MATLAB 在评估每个元素之前将其连接到一个合并簇。如果你构建了一个空矩阵：


    ![](img/240.jpg)


    ### 双精度与字符组合


    如果你连接数字与双精度、单精度或逻辑类，所有组件都有后续的网格，其信息类型为最左侧整数。MATLAB 在评估每个元素之前将其连接到一个合并簇。如果你构建了一个空矩阵：


    ![](img/241.jpg)


    ### 双精度与逻辑组合


    如果你连接数字与双精度、单精度或逻辑类，所有组件都有后续的网格，其信息类型为最左侧整数。MATLAB 在评估每个元素之前将其连接到一个合并簇。如果你构建了一个空矩阵：


    ![](img/242.jpg)


