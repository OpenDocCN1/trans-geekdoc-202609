    # 第 6 章


    # 创建神经网络


    ## 6.1 自组织映射及其在获取 K-聚类中的应用


    尽管“自组织映射（Self-Organizing Map）”这一表达可能与多种不同的方法相关，但我们应该将其作为柯霍南自组织映射（SOM）的等义词，亦也称为柯霍南神经网络。SOM
    的基本思想是将信息设计映射到 n 维神经元或单元矩阵上。该网络塑造了所谓的输出空间，而不是信息设计所处的信息空间。这种映射试图保护拓扑关系，即信息空间中邻近的设计将映射到输出空间中邻近的单元，反之亦然。为了实现简单的表示，输出空间通常是一维或二维的。


    SOM 的核心准备计算可以描述为在执行区域操作 `h` 之后进行的，其中 `h` 通常是具有（在输出空间中）距离不同单元间通信的胜出单元的能力。在准备过程中，该能力的范围通常会减小，因此每个单元都会变得其邻居的影响更加疏远。必须注意的是，SOM
    的多次执行会将此范围减小到 1，这意味着即使在准备的最后阶段，每个单元也会影响其最近的邻居，而不同的用法允许此参数减少到零。


    SOM 可以作为广泛课程的一部分，即使在聚类任务中。在本文中，我们假设每个 SOM 单元都是一个聚类中心，因此一个 k 单元 SOM 将执行类似于 k-均值的函数。必须注意的是，当
    SOM 中工作区域的范围测量为 0 时，SOM 和 k-均值计算是完全不可区分的。


    自组织映射


    自组织映射


