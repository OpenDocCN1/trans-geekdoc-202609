  trans: "\n我们在监督机器学习问题的确定性方面取得了巨大进展。这进一步意味着我们需要大量的信息来创建我们的图像分类器或销售预测器。算法反复通过信息来寻找模式。\n\
    \n但，这并不是人类大脑的学习方式。个体的大脑在理解某个主题时，并不需要通过多次浏览相似图像的指导来获取大量知识。它可能只需要几个引导点，来引导自己对底层模式进行学习。显然，我们在当前的机器学习方法中往往忽略了这一点。\n\
    \n以分类为例，让我们比较这 3 种方法是如何进行实践的：\n\n*   **监督分类**：算法规则通过学习个人在整个指导过程中输入的标签，来为网页形式分配标签。\n\
    *   **无监督聚类**：算法规则识别网页之间固有的相似性，将它们归到不同的组中。\n*   **半监督分类**：利用已标记知识帮助识别知识中包含哪些特定的网页类别组以及它们可能是什么。然后将在未标记的知识上训练算法规则，以勾勒这些网页类别的边界，甚至可以建立某些现有人工输入标签中不存在的新网页类型。\n\
    \n# 3.5 强化学习\n\n## 引言\n\n全球科学家面临的最基本问题之一一直是——如何发现一种全新的技能？”。感知|认知|掌握解决方案的意愿是显而易见的——如果我们能够理解这一点，我们就能改变人类，去尝试做我们以前从未想过的事情。或者，我们能够训练机器来尝试执行许多“人类”任务并实现真正的计算。\n\
    \n虽然我们往往对这个高级问题没有完整的答案，但有很多事情是明确的。无论能力如何，我们往往首先通过与环境交互来学习。无论是在学习开车还是婴儿学习跑步，训练都依赖于与环境的交互。从交互中学习是所有学习和智能理论的根本底层结构。\n\
    \n人类能够解决从低级运动控制到高级级认知任务的广泛问题。我们的最终目标是开发具有 `DeepMind` 的人工智能体，以实现与人类类似的通用性能。像人类一样，我们的学习智能体能够成功实现长期奖励的策略。在这种情况下，仅依靠奖励和惩罚的试错法被称为`强化学习`（`RL`）。\n\
    \n# 3.6 机器学习中的一些重要考虑\n\n![](img/27.jpg)\n\n# 3.7 训练与验证\n\n## 通过交叉验证模型改进预测的评估和性能\n\
    \n交叉验证评估系统用于评估机器学习在未准备或完成的数据集执行时间预测值。在这里，为了测试信息执行了适当的子集使用和数据集计算。由于交叉验证未使用大部分信息来构建模型，因此它是在准备模型过程中避免过拟合的一种通用**技术。\n\
    \n交叉验证将原始数据集随机划分为`training set`（训练集）和`testing set`（测试集）。在监督数据集中，训练被用于准备。\n\n涉及交叉验证的技巧包括：\n\
    \n*   **K-折 (K-fold)**：将原始数据集划分为 `k` 份。每份都被用作一次测试集，而剩余的 `k-1` 份用于训练。\n*   **留出\
    \ (Holdout)**：将数据集分为两个部分：训练集和测试集。\n*   **重复 (Repeated)**：使用数据的不同随机拆分多次重复 K-折过程。\n\
    *   **分层 (Stratified)**：确保每个折中每个目标类别的样本比例与整个集合一致。\n*   **蒙特卡洛 (Monte Carlo)**：对数据进行随机采样以创建训练集和测试集。\n\
    \n交叉验证可以并行进行以加速过程。\n\n# 3.8 方法分类\n\n## 3.8.1 自动分类器的训练\n\n分类器学习器被用于为各种模型自动训练数据。为了获得有效的性能，探索了模型选择。\n\
