  trans: "\n为了显示你的树对新信息的预测准确性有所提高，请对树进行交叉验证（cross approve）。当然，交叉验证会将训练数据随机拆分为 10 个部分。它会训练\
    \ 10 棵新树，每棵树使用其中 9 部分的信息。随后，它会查看每棵新树在构建该树时排除的信息上的预测准确性。这种技术为后续树的预测准确性提供了一个良好的衡量，因为它在新信息上测试了这些树。\n\
    \n## 交叉验证回归树\n\n本例演示了如何检查基于 `carsmall` 数据预测里程数的回归树的重替换误差和交叉验证准确性。\n\n加载 `carsmall`\
    \ 数据集。考虑加速度、位移、马功率和重量作为 MPG 的指标。\n\n### 程序\n\n```\n>> load carsmall\nX = [Acceleration\
    \ Displacement Horsepower Weight] ;\n使用所有观测值生长回归树。\n>>rtree = fitrtree(X,MPG);\n\
    ```\n\n计算样本内误差。\n\n```\n>>resuberror = resubLoss(rtree)\nresuberror =\n     4.7188\n\
    ```\n\n回归树的重替换误差是均方误差。后续估计表明，该树的正常预测误差约为 4.7 的平方根，或略大于 2。\n\n衡量交叉验证 MSE。\n\n###\
    \ 程序\n\n```\n>>rng ‘default’ ;\ncvrtree = crossval (rtree) ;\ncvloss = kfoldLoss(cvrtree)\n\
    cvloss =\n     23.8065\n```\n\n交叉验证误差约为 25，这意味着该树在新信息上的普通预测误差约为 5。这表明交叉验证误差通常高于基础的重替换误差。\n\
    \n## 一些随机的用法\n\n使用 `size` 获取对象的大小。可以取一个可选参数来指定维度（如果不指定，它返回一个包含所有维度大小的数组）。\n\n\
    ![](img/256.jpg)\n\n### 主要用于“向量化”内容\n\n我们经常需要处理大量信息，通常这些信息以真实向量的形式给出。如果不是，我们可以根据需要对其进行处理……（正在执行高亮提取）\n\
    \n利用网络来存储信息是有帮助的，例如通过按段堆叠向量：\n\n![](img/257.jpg)\n\n## 访问单元数组中的数据\n\n此示例演示了如何读写单元数组中的数据。\n\
    \n创建一个包含文本和数值数据的 2x3 单元数组。\n\n### 程序\n\n```\n>> C = { ‘one’, ‘two’, ‘three’ ;\n\
    1, 2, 3}\nC =\n     'one'  'two'  'three'\n     [ 1]  [ 2] [ 3]\n```\n\n有两种方法可以引用单元数组的组件。使用圆括号\
    \ `()` 包裹文件来引用单元集——例如，描述簇的子集。使用大括号 `{}` 包裹列表来引用单个单元内部的内容、数字或其他信息。\n\n### 使用圆括号\
    \ `()` 进行单元索引\n\n### 程序\n\n```\n>> C (1, 1:3) = {‘first’, ‘second’, ‘third’ }\n\
    C =\n     'first' 'second' 'third'\n     [ 1] [  2] [ 3]\n```\n\n如果数组数组中的单元包含数值数据，你可以使用\
    \ `cell2mat` 函数将单元转换为数值数组。`numericCells` 是一个 1x3 的单元数组，但 `numericVector` 是一个双精度类型的\
    \ 1x3 数组。\n\n### 程序\n\n```matlab\n>>numericCells = C (2, 1:3)\nnumericCells =\n\
    \     [1] [2] [3]\n>>numericVector = cell2mat (numericCells)\nnumericVector =\n\
    \             1  2  3\n>>\n```\n\n### 使用大括号 `{}` 进行内容索引\n\n通过大括号索引访问单元的内容——即单元内的数字、文本或其他数据。例如，要访问\
    \ `C` 最后一个单元的内容，请使用大括号。\n\n```matlab\n>>last = C{2,3}\nlast =\n     3\n```\n\n\
    你可以使用大括号索引来替换单元的内容。\n\n```matlab\n>>C{2,3} = 300\nC =\n     'first' 'second' 'third'\n\
    \     [ 1] [  2] [ 300]\n```\n\n你可以通过大括号排序来获取多个单元的内容。MATLAB 将单元的内容还原为用逗号分隔的列表。由于每个单元可以包含不同类型的信息，你无法将此列表分配给单个变量。`cell11`、`cell12`、……`cell23`\
    \ 是可以赋值给单元 (1,1) 到 (2,3) 内容的变量。\n\n```matlab\ncell11 = C{1,1}\ncell12 = C{1,2}\n\
    cell13 = C{1,3}\ncell21 = C{2,1}\ncell22 = C{2,2}\ncell23 = C{2,3}\n```\n\n如果每个单元包含相同类型，你可以从单元数组创建一个数组：\n\
    \n```matlab\nnums = [C{1,1}, C{1,2}, C{1,3}; C{2,1}, C{2,2}, C{2,3}]\n```\n"
