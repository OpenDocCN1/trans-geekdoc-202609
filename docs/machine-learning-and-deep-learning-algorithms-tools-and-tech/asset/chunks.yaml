    # 4.7 处理机器学习大型数据文件的七种方法


    ## 1. 分配更多内存


    你有七种方法可以处理机器学习的大型信息文件：


    ## 2. 内存分配部分


    机器学习或库可能会受到默认内存设计的限制。在这种情况下，检查你是否有能力重新调整你的设备或库以划分出大量的内存。


