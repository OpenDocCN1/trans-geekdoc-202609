    \nWhile the history of technology development by mankind can be considered in\
    \ terms of thousands of years, the real development of technology has occurred\
    \ only during the last hundred years.\n\n**What is Artificial Intelligence?**\n\
    \nOne of the key features that distinguish us, humans, from everything else in\
    \ the world is intelligence. This capacity to understand, practice knowledge and\
    \ strengthening skills has played vital role in our evolution and developing human\
    \ civilization. It is believe that the advancement in technology can create super\
    \ intelligence that can threaten human existence\n\n**What Is Machine Learning?**\n\
    \nThis is a book about Machine Learning with MATLAB, which immediately begs the\
    \ question: what is *Machine Learning*? It’s a surprisingly hard definition to\
    \ nail down, especially given how ubiquitous the term has become. Vocal critics\
    \ have differently released the term as unnecessary label or a simple buzzword\
    \ that only occurred to salt resumes and hold on to the eye of enthusiastic tech\
    \ recruiters\n\nData scientist has been called “the most important job of the\
    \ 21^(st) century,” presumably by someone who has never visited a fire station.\n\
    \nAnd developing field and it can’t take a great extent of detecting to find analyst\
    \ breathlessly fore sighting that over the next 10 years, we will need billions\
    \ and billions of more data scientists than we currently have. An aim is to help\
    \ and develop the data science by learning algorithm skills and the desire is\
    \ to develop statistical modeling and the mathematics that is the core of Machine\
    \ Learning and the goal is to help you to get comfortable with the mathematics\
    \ and statistics that are at the core of data science.\n\nThe best way to learn\
    \ Machine Learning is by Learning Algorithms on things. By reading this book you\
    \ will get good understanding of the way the Algorithm has been used for various\
    \ applications. You will get good understanding of Machine Learning using Matlab\
    \ and some part like deep learning has been touched with Python approach to get\
    \ the students and readers a good comparative analysis about classification and\
    \ prediction and data visualizations. In the book the content part has been organized\
    \ in such a way that a graduate and post graduate student can get fundamentals\
    \ of machine learning along with ample of examples to get conceptualize the theories\
    \ of different machine learning algorithms. This book has focused right from machine\
    \ learning basic theories along with pattern recognition, visualization of data,\
    \ brief introduction in Deep learning and applications of tensor flow as well.\n\
    \n*   As the real-time application of machine learning is endless but the basics\
    \ concepts and algorithms are discussed by us using MATLAB language so that from\
    \ graduate students to researchers can get benefited with this.\n\n*   The book\
    \ focused on MATLAB code for algorithm implementations rather than mathematical\
    \ formula.\n\n*   The book has discussed machine learning workflow for health\
    \ monitoring.\n\n*   The neural network domain has been touched and implementation\
    \ in Matlab with explicit explanation of code and results\n\n*   This book has\
    \ ability to realize the students that machine learning is easy and interesting.\n\
    \n# [Foreward](#toc.xhtml#frw)\n\n**Who should read this book**\n\nThe book is\
    \ basically meant for graduate and research students who find the algorithms of\
    \ machine learning difficult for implementations. We have touched all basic algorithms\
    \ of machine learning in detail with the practical approach. Primarily beginners\
    \ can find this book more effective as the chapters are subdivided into such a\
    \ way they will find the building and implementing algorithms in MATLAB is interesting\
    \ and easy at the same time.\n\n**Why we wrote this book**\n\nThe writers for\
    \ this book teamed up from research and academic research domain, so we take care\
    \ of things that the text and flow of chapter’s content are easy enough for the\
    \ beginners.\n\nReadership (who’s the target audience?):\n\nThere are numerous\
    \ books on machine learning and AI. In any case, every one of them is implied\
    \ for graduate students or research today, applying machine learning does not\
    \ require a Ph.D. Nonetheless, there are a couple of assets out there that completely\
    \ cover all the essential parts of actualizing machine learning by and by, without\
    \ expecting you to take advanced of math courses. We believe this book will help\
    \ individuals who need to apply machine learning without studying upon years of\
    \ analytics, calculus math, and probability hypothesis. We are focusing on the\
    \ engineering students who find difficulties while solving different machine learning\
    \ algorithms in MATLAB.\n\nMachine learning is most sought to research field and\
    \ is an integral part of many research projects today including commercial applications,\
    \ and academic research as well. The machine learning domain starts from finding\
    \ friends on social networking sites to medical diagnosis and even for satellite\
    \ processing. In this book, we have made an honest effort to make the concepts\
    \ of machine learning easy and also give basics programs in MATLAB right from\
    \ the installation part. As the real-time application of machine learning is endless\
    \ but the basics concepts and algorithms are discussed by us using MATLAB language\
    \ so that from graduate students to researchers can get benefited with this.\n\
    \n**What you will learn:**\n\n*   Machine learning in MATLAB\n\n*   The Algorithms\
    \ of machine learning with MATLAB code\n\n*   Deriving and access data in MATLAB\
    \ then preprocessing and preparation of data\n\n*   Machine learning workflow\
    \ for health monitoring\n\n*   Neural network domain implementation in MATLAB\
    \ with explicit explanation of code and results.\n\n# [Acknowledgment](#toc.xhtml#ack)"
