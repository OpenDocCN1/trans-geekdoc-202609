    \ classification and regression require time series prediction and recommendation\
    \ respectively. The most popular supervised machine learning algorithms are:\n\
    \n*   `Linear regression` to solve regression problems\n*   `Random forest` to\
    \ solve regression and classification problems\n*   `Support vector machines`\
    \ to solve classification problems\n\n### Unsupervised Learning\n\nIf the data\
    \ only consists of input data `X` without any output variables corresponding to\
    \ the input variables, then it belongs to unsupervised machine learning algorithm.\n\
    \nThe primary goal of unsupervised learning is data distribution with underlying\
    \ structure for more understanding of data. This kind of data processing is known\
    \ as unsupervised learning since it does not have the correct answers or a teacher.\n\
    \n# Approaches\n"
