  trans: '

    让我们来看一个监督学习的例子。我们有关于对某特定电影意见的数据，即一个人是否“喜欢”或“不喜欢”某部电影。这些数据是通过顺序访谈获得的，根据收集到的数据，我们可以预测该电影是否会“热门”或“不热门”。


    # 原始数据


    ![](img/23.jpg)


    上面的图片涉及我访问过的餐厅数量。在这张图中，访问过的餐厅标记为红圈，未访问的餐厅用蓝圈表示。


    现在，我有两个用绿色标记的待访问选项 A 和 B，你能预测我会选择哪一个吗？可以，你可以简单地用一条线将红圈和蓝圈数据分为两部分。为了更清楚地理解，请看下面的图片：


    # 监督学习结果


    ![](img/24.jpg)


    这非常简单，你可以很有把握地说，我会访问餐厅 B 比访问 A 多。这就是监督机器学习方法所进行的过程。


    # 3.3 无监督机器学习


    如果数据只包含输入数据（`X`），而没有与这些输入变量对应的输出变量，那么它属于无监督机器学习算法。


    无监督学习的主要目标是发现具有底层结构的数据分布，以便更好地理解数据。


    这种数据处理方式被称为无监督学习，因为它像监督学习一样，没有正确答案和老师来进行学习。在无监督学习中，算法被留给自己去发现数据中的结构和交叉点。


    与监督学习类似，无监督学习也归类为关联和聚类问题。


    * **聚类**：聚类问题是为了发现具有固有分组的数据，例如客户群的购买行为。

    * **关联**：带有关联规则的学习问题是为了发现数据大部分部分的规则，例如倾向于购买变量产品 `X` 的人也倾向于购买变量 `Y`。


    无监督算法学习的少数例子是：


    * 聚类问题通过开发 `k-means` 来解决。

    * 为了解决关联规则学习问题，开发了 `Apriori` 算法。


    # 无监督具有输入


    假设一名出租车司机有接受或拒绝订单的选项。在这种情况下，在图中绘制的蓝圈表示已接受的订单。


    # 无监督学习的原始数据


    ![](img/25.jpg)


    现在，出租车司机在 A 地和 B 地有两个订单；你能告诉他会选择哪一个吗？为了预测接受聚类，我们看到如如下所示，司机在左下角区域接受的订单更多。


    # 无监督学习


    ![](img/26.jpg)


    监督机器学习和无监督机器学习算法之间的主要区别如下：


    * 在监督机器学习中，算法数据集使用带有标签的数据进行训练，标签是由工程师或数据科学家添加的，以便他们理解重要特征。

    * 在无监督机器学习中，算法训练数据集是未标记的，以便根据其固有的数据模式检测特征重要性。


    # 3.4 半监督学习


    当有大量的输入数据（`X`）和较少的标记数据（`Y`）可用时，它就属于半监督学习算法。这种学习介于监督学习和无监督学习之间。这种学习最典型的例子是存档图像；其中只有少数图像被标记了狗、猫等标签。


    现实世界的许多机器学习问题属于这一领域。结果，这可能是高昂的或耗时的知识标注，需要专家领域的访问。而未标记的知识存储数据是廉价且简单的。


    通过无监督学习技术，可以学习输入变量的结构以获取并学习输入变量内部的结构。


    此外，监督学习的应用为未标记知识提供了更好的预测，将检索到的监督学习算法规则作为教练式知识模型，用于预测新的、未见过的知识。


    # 3.4.1 理解半监督学习


    **半监督学习**（**SSL**）属于过去几个月来流行的的人工智能（AI）之一。像 Google 这样的公司正在开发与构建半监督学习应用相关的工具和框架。Google
    Expander 可能是反映半监督学习应用进展的一个很好的工具。


    从概念上说，半监督学习将位于无监督和监督学习模型之间。半监督学习模型的缺点始于一系列标记信息，此外还有标签似乎并不广为人知的知识点。半监督学习模型是将未标记知识的利用分类到标记信息集中。


    半监督学习算法在标记和未标记知识的混合上进行训练。这出于许多原因非常有帮助。首先，为监督学习标注大量信息的方法通常耗时极长且成本高昂。什么是“大量”？过度的标注会对模型施加人类偏见。这意味着结合各种未标记的知识，教学方法实际上往往能增强最终模型的准确性，同时减少了构建模型所需的时间和价值。


    半监督学习在网页分类、语音识别或基因测序等情况下可能是双赢的。总之，在这些情况下，数据科学家将获得海量的未标记知识，但将监督信息真实分配到任何一个上可能是一项无法完成的任务。


    一些 AI 从业者将半监督学习看作带有更多信息的监督学习的一种。最后，半监督学习模型的目标是看起来与监督模型相同：即为选定的输入文件集预测目标值。或者，AI
    社区的不同部门将半监督学习看作带有约束的无监督学习的一种。你可以选择你喜欢的思想流派。


    ## 世界中的半监督学习


    半监督学习模型已广泛应用于各种行业的各种情况。让我们探索几个最著名的例子：


    * **语音分析**：语音分析可以是半监督学习模型价值的经典例子。标记音频文件通常是一项极其密集的工作，需要大量的人力资源。应用 `SSL` 技术将极大地促进改进语音分析模型。

    * **蛋白质序列分类**：推断蛋白质的功能通常需要人类的干预。

    * **网络内容分类**：组织从数十亿网页内容获得的数据可以推进 AI 的完全不同领域。遗憾的是，该任务通常需要人工干预来对内容进行分类。

