    languages are Python, R, Lisp, Prolog, Java, and so on. In these languages, Python
    is most widely used in many fields of development of deep learning. Based on many
    algorithms and techniques, deep learning is programmed in the programming languages.
    In Python programming language, numpy, pybrain, and so on are used.


    ## 7.5 Meaning and importance of Deep Learning

    Deep learning permits procedure models that are composed of multiple process layers
    to find out representations of information with multiple levels of abstraction.
    These ways have dramatically improved the progression in speech recognition, visual
    perception, object detection, and plenty of alternative domains like drug discovery
    and genetics. Deep learning discovers tortuous structure in giant knowledge sets
    by exploiting the back-propagation formula to point. However, a machine ought
    to modify its internal parameters that are accustomed cypher the illustration
    in every layer from the illustration within the previous layer. Deep neural network
    plays a conventional role in different fields especially audio, speech, and video.
    For text and speech process lightweight sequential knowledge is performed.

