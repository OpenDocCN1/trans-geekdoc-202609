    `Mr Praveen Singh Rathore`，他在我的每一次斗争和所有成功中都始终守在我身边。此外，我想向我亲爱的妻子 `Mrs. Anita Kanwar`
    表感谢，在没有人回答我问题的时候，她总是给予支持。我还要感谢我可爱的儿子 `Raghavendra Singh Rathore`，让我变得比我想象的任何都要强大、更好、更充实。这本书是我长期以来的梦想，如果没有这些优秀人的支持和爱（尽管我没有给他们足够的时间和关注），这个梦想无法变为现实。感谢所有的朋友，特别是
