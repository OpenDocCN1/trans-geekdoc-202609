    虽然某些算法（如 `SVM`、`K-nearest neighbors` 和岭回归）需要对选项进行归一化，但直觉上，我们将主成分分析（`PCA`）视为一旦标准化至关重要的主要范例。在
    PCA 中，我们倾向于关注能够最大化方差的部分。如果一个元素（例如人类身高）与另一个元素（例如体重）相互不同，由于它们各自的单位（米与千公斤），如果这些选项似乎没有经过缩放，PCA
    可能会确认方差最大的方向更密切地对应于“体重”轴。作为一种对比，1 米的高度变化被认为比 1 公斤的体重变化重要得多，这通常显然是错误的。


