  trans: "\n假设你需要将缺失值视为你信息集合的一个主要方面，但将它们与信息中的其余部分隔离开。一些 MATLAB 功能允许你控制缺失值的情况以便进行额外处理。例如，利用\
    \ `sort` 函数的‘Missing Placement’选项将 `NaN` 移动到一个完整的数字处。\n\n![](img/178.jpg)\n\n\
    ## 查找、替换和忽略缺失数据\n\n尽管我们没有在 MATLAB 中刻意地创建缺失数据值，但它们仍然携带了某种信息。如果你不知道信息中的缺失值，这将导致计算或数据分析出现问题。\n\
    \n例如，当你无意中绘制一个包含 `NaN` 值的向量时，`NaN` 不显示在图上，因为基于 `NaN` 的 `plot` 函数通常关注剩余的图形，这可能是不准确的。\n\
    \n### 程序\n\n```matlab\n>>nanData = [1:9 NaN];\nplot(1:10,nanData)\n```\n\n###\
    \ 输出\n\n![](img/179.jpg)\n\n你可能处理的是正常信息，但结果仍为 `NaN`。在这种情况下，提前识别包含 `NaN` 的信息函数并在作为正常信息数据处理之前忽略或删除它们会更有用。\n\
    \n![](img/180.jpg)\n\n### 程序\n\n```matlab\n>>meanData = mean(nanData)\nmeanData\
    \ =\nNaN\n```\n\n在信息中查找 `NaN` 的方法是使用 `ismissing` 函数，它会返回一个逻辑矩阵，显示任何 `NaN` 值的区域。\n\
    \n### 程序\n\n```matlab\nTFdatetime = ismissing(xDatetime)\nTFdatetime = 1x5 logical\
    \ array\n   1 0 0 0 0\n```\n\n假设你正在处理一个包含许多数据记录的表格或时间表。你可以通过一次调用用极少的时间发现大部分缺失值。\n\
    \n![](img/181.jpg)[](images/181a.jpg)\n\n缺失值可能代表用于处理或分析的无效信息。使用 `fillmissing`\
