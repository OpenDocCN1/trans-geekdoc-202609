    # [1.1 Basics of Machine Learning](#toc.xhtml#s1_1a)


    Machine learning has been around for a long time now and every single social media
    client, have at some point in time been customers of machine learning innovation.
    One of the basic illustrations is confront acknowledgment programming, which is
    the ability to distinguish whether a computerized photo incorporates a given individual.


    # Definition


    “A computer program is said to learn from experience E with respect to some class
    of tasks T and performance measure P, if its performance at tasks in T, as measured
    by P, improves with experience E.”


    ![](images/11a.jpg)


    # [1.2 Machine Learning Types](#toc.xhtml#s1_2a)


    Machine learning is of two types:


    *   Supervised learning


    *   Un-supervised learning


    # Supervised Learning


    Machine learning algorithm has a major functionality of utilization of learning
    techniques through machines. In supervised approach, we are able to get the output
    variable data (Y) through the input variable (X) for learning mapping function.


    *Y = f(X)*


    The primary objective here is to map function approximation for newly defined
    input data (X) and for output data prediction variables (Y) for a given data.


    Supervised learning is obtained through training a dataset which is similar to
    the learning process via supervision of a teacher. We are already aware of the
    correct answer, through iterative prediction of training the data and rectify
    the process through teaching. In this learning, we will be stopped when desired
    acceptable performance is achieved in the machine.


    Even supervised learning is subject to classification and regression as major
    problems for performance measurement. Let’s now understand classification and
    regression in more detail:


    *   **Classification**: For this particular problem category, the output variable
    is classified as disease, no disease, blue, or red.


    *   **Regression**: When the output variable is obtained as a real value, regression
    problem will occur. For example: weight or dollars.


    A few problems that are built with classification and regression require time
    series prediction and recommendation respectively. The most popular supervised
    machine learning algorithms are stated with problem solutions:


    *   Linear regression to solve regression problems


    *   Random forest to solve regression and classification problems


    *   Support vector machines to solve classification problems


    # Unsupervised Learning


    If the data only consists of input data (X) without any output variables corresponding
    to the input variables, then, it belongs to unsupervised machine learning algorithm.


    The primary goal of unsupervised learning is data distribution with underlying
    structure for more understanding of data.


    This kind of data processing is known as unsupervised learning since it does not
    have the correct answers or a teacher for learning as in the case of supervised
    learning. In this, unsupervised learning algorithms are left in own devices for
    discovering and structure intersecting in the data.


    Similar to supervised learning unsupervised learning are also grouped as association
    and clustering problems, let’s understand what these are:


    *   **Clustering**: Clustering problem arises for discovering data with inherent
    groups similar to purchasing behavior of customer groups.


    *   **Association**: Learning problem with association rule is to discover rules
    for data at a larger portion just like people tend to buy the variable product
    X and also buy variable Y.


    A few examples for unsupervised learning algorithm are:


    *   Clustering problem is resolved with the development of k-means


    *   To resolve association rule learning problem Apriori algorithm is developed


