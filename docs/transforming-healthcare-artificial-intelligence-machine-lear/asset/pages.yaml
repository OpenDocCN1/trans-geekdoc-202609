  md: '# About the editors


    K. Srinivasan received his Bachelor’s degree in Electronics and Communication
    Engineering from VLB Janakiammal College of Engineering and Technology, Coimbatore,
    and his ME in Process Control and Instrumentation Engineering from Annamalai University,
    Chidambaram, in 1996 and 2004, respectively. He obtained his PhD from Anna University,
    Chennai, in 2012, from the Faculty of Electrical Engineering. He has 22 years
    of experience in the field of Electronics, Communication, Instrumentation, and
    Image & video processing. Currently, ten research scholars are pursuing research
    in these fields under his guidance.


    He has published a number of technical papers in refereed International journals
    and Conferences among which 38 are indexed in SCOPUS and 24 in the Web of Science
    (WoS). He received Best Paper Awards in an IEEE-sponsored international conference
    held in Singapore, 2016, and at Amity University, Dubai, in December 2017. He
    has published a book “Digital image processing and Transducers and Measurements”.
    He has been granted 3 patents in the areas of Electronics, Sensors, and Bio-Energy.


    He received Rs. 72,53,219/- for research and consultancy activities from various
    funding agencies such as TNSC, AICTE, and IEEE Headquarters, New York, as well
    as industries like Bimetal Pvt. Ltd., and T-Stanes Company, Coimbatore. He also
    received Rs. 23,80,625/- for conducting Conferences, Workshops, and Seminars from
    various funding agencies such as TNSC, AICTE, ICMR, IEEE, ISTE, ISOI, CSIR, DRDO,
    and NI.


    He received the Best Award for his excellence in teaching and research from the
    Nehru Group of Institutions, Coimbatore, in the academic year 2016–2017, and was
    honored with the Best Head of the Department award by IIT Madras, Chennai, in
    September 2017.


    Jude Hamlet received his BE in E from Bharatharthi University in 2002, his ME
    degree in Communication Systems from Anna University in 2006, and his PhD from
    Karunanya University, in 2013. His research areas include computational intelligence
    and image processing. He has authored more than 150 research papers in reputed
    SCIE-indexed International Journals'
