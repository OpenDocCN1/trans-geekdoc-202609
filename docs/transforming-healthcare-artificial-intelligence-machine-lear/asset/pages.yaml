    to the femur. Because it can withstand loads from rotation and anterior translation,
    it is regarded as a crucial component of the knee joint [4]. The ACL is inserted
    into the tibia''s intercondylar eminence and blends with the anterior horn of
    the medial meniscus. It originates from the posteromedial corner of the medial
    portion of the lateral femoral condyle and the intercondylar notch. The ACL travels
    from the femur to the tibia, traverses anterior, medially, and then distally over
    the joint. An essential component in ensuring knee joint stability is the ACL.
    Its main function is to maintain the front translation. It also helps to avoid
    extreme motions and oppose rotation. It does this by spiraling slightly outward,
    or lateral, on itself. It is made of 90% type I collagen and 10% type III collagen.
    ACL has a length of 27–38mm and a band of 10–12mm. The area of the cross-section
    is around 44mm square. It depicts the shape of a bowtie or hourglass. The ACL
    is an important component of the knee joint that opposes valgus angle, internal
    rotational stresses, and anterior- tibial translation.'
