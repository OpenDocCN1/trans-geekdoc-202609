  md: '# Chapter 2


    # Application of artificial intelligence to tele-healthcare system


    Vijayachitra Senniappan


    # 2.1 ARTIFICIAL INTELLIGENCE


    Artificial intelligence (AI) is the artificial mimicking of human intelligence
    by simulation of various processes owned by human beings but with the help of
    machines (computers). To mention human processes, the learning, reasoning, and
    auto-correction are some of the major processes. If it needs to carry out more
    number of processes that are difficult for human reasoning, it is suggested to
    go with AI in order to make them happen.


    The purpose of AI is to develop a system that can able to do analysis with the
    given dataset by comparison or testing and to obtain efficient decisions. These
    decisions are more likely to be implemented or adopted across the industries of
    healthcare environment.


    If experts provide valuable insights, expertise and recommendations, and future
    predictions, AI-based tools will help individuals to obtain intelligent decisions
    and good outcomes with a reduced risk of errors.


    In general, artificial intelligence, or simply AI, is originated from the roots
    of computer science, and it uses advanced technologies, which will enable the
    processing unit to perform various tasks or challenges with intelligence [1].
    Some of the tasks are listed as follows:


    +   * Perception

    * Understanding and transformation of languages

    * Data analysis

    * Human reasoning

    * Understanding from the previous experience


    AI is functioning with combination of more number of data with high processing
    speed and also intelligent computational algorithms to have automatic learning
    from certain data features or patterns. Some special programmes can work from
    the past learning by analyzing complex natural data and improving their performance
    without any human intervention. In general, AI is carried out by simulating human
    intelligence by using computers and various computational algorithms.'
