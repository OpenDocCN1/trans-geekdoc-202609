    field, the rapid delivery of medical supplies, real-time monitoring of patient
    health in hard-to-reach areas, and timely emergency response are critical issues
    that can be significantly improved with the deployment of AloT-enabled drones
    (Chen & Liu, 2022; Martinez & Lopez, 2022; Hall & King, 2022).


    # 6.2 LITERATURE REVIEW OF DRONE TECHNOLOGIES


    Drones, or unmanned aerial vehicles (UAVs), have evolved into essential tools
    across diverse sectors due to their capacity to perform operations that would
    otherwise be hazardous, costly, or impractical for humans (Davis & Evans, 2021;
    Johnson & Smith, 2020). Equipped with advanced features such as GPS, high-resolution
    imaging systems, and intelligent sensors, they enable applications in aerial mapping,
    precision agriculture, logistics, surveillance, and environmental monitoring (Anderson
    & White, 2024; O’Connor & Murphy, 2020). The convergence of these hardware and
    software innovations has significantly enhanced the capabilities and reliability
    of modern drones.


    # 6.2.1 Key developments in flight control systems


    Significant advancements in flight control systems, including autopilot algorithms
    and stabilization mechanisms, have enhanced both accuracy and operational reliability
    (Kumar & Singh, 2024; Evans & Harris, 2024). Improvements in battery technology
    and propulsion systems have extended flight durations and increased payload capacities
    (Edwards & Harris, 2020; Nguyen & Tran, 2021). Meanwhile, communication upgrades
    up to 5G integration and long-range RF systems have improved control precision
    and real-time data transfer capabilities (Garcia & Martinez, 2023; Iqbal & Khan,
    2021). Navigation technologies now integrate GPS, inertial measurement units (IMUs),
    and vision-based systems to support autonomous flight and advanced obstacle avoidance
    (Zhang & Li, 2024; Johnson & Smith, 2024).'
