  md: '# Segmentation of ACL tear using meta-heuristic optimization


    One feature that CNN architectures frequently use is max pooling. A pooling layer''s
    primary goal is to “accumulate” characteristics from maps created by superimposing
    a filter over an image. Formally, it serves the purpose of gradually shrinking
    the size of the representation to minimize the amount of network calculations
    and parameters. Max pooling is the most used type of pooling. A portion of the
    max pooling is to mitigate overfitting by offering an abstracted version of the
    representation. Furthermore, it offers fundamental translation invariance to the
    internal representation and lowers the cost of computing by lowering the number
    of parameters to learn. Introducing a max filter on non-overlapping sub-regions
    of the original representation is how max pooling is carried out. Pooling windows
    were used by AlexNet; they were by 3 in size and had a stride of 2 between each
    window. The top-1 mistake rate was decreased by 0.4% and the top-5 error rate
    by 0.3%, respectively, as a result of Max Pooling’s overlapping nature.


    AlexNet shows that deep CNNs can be substantially faster than saturating activation
    functions like Tanh or Sigmoid. With the use of ReLUUs, AlexNet may reach a training
    error rate of 25%, as seen in the graph below (solid curve). By displaying different
    versions of the same image to the Neural Net, overfitting can be prevented. It
    also helps to generate more data and forces the Neural Net to commit the key characteristics
    to memory. With dropout, a neuron is eliminated from the neural network with a
    chance of 0.5. A neuron that contributes nothing to the propagation in each direction.
    As demonstrated in the illustration below, a different Neural Network design processes
