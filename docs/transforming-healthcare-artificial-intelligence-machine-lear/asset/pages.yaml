- pgno: 17
  md: '# Chapter I


    # Role of AI and ML in lung disease detection based on lung sound analysis using
    deep learning algorithms


    Nivaashini Mathappan and Priya Lakshmipathy


    # I.1 INTRODUCTION


    World Health Statistics [1] estimated 6.86 million deaths in 2023, making it the
    third highest cause. Acute lower respiratory tract infections, COPD, asthma, occupational
    lung illness, and others affect beliefs [2]. The lack of healthcare workers is
    increasing COVID-19-related pneumonia. Obstructive pulmonary disease, which is
    easy to diagnose, may worsen it. COPD patients with COVID-19 perform poorly. COPD
    was common in ICUs and killed 65% of critically ill patients [3]. major causes
    of death following COVID-19 are pneumonia and asthma. Thus, early pulmonary sickness
    identification is attracting focus [4,5]. Preventing epidemics and lung diseases
    requires early identification. Early diagnosis and treatment respiratory infection
    complications [6].


    Experts identify lung disorders by X-rays, stethoscopes, and CT. Lung auscultation
    uses stethoscopes to hear breathing [7]. Auscultation detections lung diseases
    inexpensively and non-invasively. The auscultation revealed normal and typical
    breathing sounds. Unusual noises may indicate illness. Sensory sensitivity is
    800Hz and insensitivity is 100–200Hz. Airway blocks cause wheezing. COPD and asthma
    detect 400Hz breathing. Timing and tone make rattles. Bubbles burst most often
    between 60 and 2,000Hz. Examples include ILD, bronchiectasis, and pneumonia [8,9].
    stethoscope frequency, patient state, environment, and physician experience impact
    lung auscultation [10]. While stethoscopes take up respiratory sounds between
    100 and 2000Hz, people only hear between 1000 and 2000 Hz [11]. Poor breath sounds
    might misdiagnose and complicate symptom monitoring [12]. Auscultation may reveal
    abnormal noises; thus, doctors must know. Complex patterns of breathing make abnormal
    breathing hard to see. Multiple solutions are difficult [13,14].


    Computerized techniques and lung recording advances are enhancing lung sound diagnostic
    accuracy and objectivity. Computer-based lung sound analysis uses graphical representations,
    data, noise suppression, and'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# 2 Transforming Healthcare


    lung sound behavior analysis to evaluate more thoroughly [15]. Machine learning
    (ML) and deep learning (DL) reduce subjectivity from lung sound auscultation,
    processing, and storage, improving computer-based diagnosis.


    The results are accurate, unbiased, and quantitative [16,17,18,19]. Automatic
    research findings are kept for later study [20]. Characterizing lung sounds is
    challenging due to overlapping feature distributions [21]. Without lesion data,
    deep neural networks can learn from enormous lung sounds and spectrogram datasets.
