  md: '# 92 Transforming Healthcare


    # 4.5.3.3 Machine learning in predictive modeling


    The application of ML for health-related predictions has grown significantly in
    the last few years. ML models are excellent at digesting massive datasets, finding
    patterns, and producing precise predictions. ML algorithms are trained on datasets
    containing a range of indicators related to malnutrition, stunting, and obesity,
    including anthropometric measurements (e.g., height, weight, and BMI), clinical
    information, socioeconomic factors, and even environmental influences (e.g., access
    to clean water and sanitation). Based on the patterns they find in the data, these
    algorithms then learn to categorize kids into various groups, such as low risk
    for stunting or high risk for malnutrition.


    Several popular ML models are employed in studies on prediction health, such as:


    +   **Decision Trees:** Because decision trees handle both numerical and categorical
    data and are simple to read, they are a common tool for predicting malnutrition.
    In order for these models to function, choices (like whether a child is malnourished)
    are divided into a set of inquiries depending on several factors (age, weight,
    height, and socioeconomic status).


    +   **Random Forests:** Random forests, often utilized in health prediction models,
    are an extension of decision trees. To increase accuracy, they function by merging
    the predictions made by several decision trees. When working with huge datasets
    containing numerous variables, as is frequently the case in research predicting
    malnutrition, random forests are quite helpful.


    Logistic regression is a statistical method commonly used to determine the probability
    of an event, such as whether or not a child would be underweight. When the result
    is binary (e.g., malnourished vs. not malnourished), it works very well. Another
    approach that works for classification is support vector machines (SVM). One example
    of a task that SVM is useful for determining if a child is in danger of stunting
    or not. The way it operates is by determining which hyperplane best divides data
    points from various classes. Traditional methods are not the only way that ML
    may be applied to predict malnutrition.


