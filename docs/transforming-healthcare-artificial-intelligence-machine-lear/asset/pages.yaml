    # 7.1 INTRODUCTION


    An increase in blood glucose levels is the cause of diabetes. Long-term persistence
    of this anomaly will lead to irreparable damage to the blood vessels. Diabetes
    also increases the risk of renal failure, eyesight loss, bleeding gums, lower
    limb amputation, foot sores, and nerve damage. Patients with diabetes have an
    increased risk of heart attack and stroke. Diabetic Nephropathy, which affects
    the kidneys, Diabetic Neuropathy, and Diabetic Retinopathy (DR), which affects
    the retina, are the names given to these disorders on the areas of the body that
    are impacted by an increase in blood glucose levels [1,2].


    Treating a disease under early predictions is most efficacious in healthcare.
    Among different health problems, eye ailments are expanding nowadays, and numerous
    individuals are affected by visual deficiency. So, it is more advisable for the
    diabetic patients to make periodic eye checks, monitoring the functions of retina
    regularly. optical coherence tomography (OCT), fundus fluorescence angiography
