    allow a business to provide end-to-end service in 90 minutes. It showcases automation
    across the infrastructure layers and demonstrates how it can be directly or indirectly
    automated, working with environments composed of bare metal edge scenarios.


    # 8.2.6 Dasmo: A Scalable Approach to Network Slices Management and Orchestration


