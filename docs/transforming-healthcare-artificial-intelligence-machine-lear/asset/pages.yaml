- pgno: 157
  md: '# A deep learning-based diabetic retinopathy detection model


    The bottleneck, also known as latent space, is a lower-dimensional representation
    of the input data that is created by the encoder. Next, using the compressed input
    data, the decoder attempts to recreate the original data. Selecting and sending
    the most crucial characteristics to the decoder is the responsibility of the bottleneck
    layer. In order to reduce the reconstruction error, the network weights are adjusted
    during Autoencoder training by comparing the original input data to the rebuilt
    data. The structure of a CAE is shown in Figure 7.2.


    # 7.3.1.1 Encoder


    The input data is compressed by the network''s encoder before being sent to the
    bottleneck layer. Despite being substantially smaller than original input, the
    compressed knowledge representation retains most of its properties. This portion
    of the network is made up of convolutional blocks that are followed by pooling
    layers, which further aid in the creation of a compressed representation of the
    data. An ideal encoder should provide a smaller but identical output to the input.
    To replicate it, the encoder must be sensitive to the input but not excessively
    sensitive. Oversensitivity would cause the model to overfit the data by remembering
    the inputs.


    # 7.3.1.2 Bottleneck layer


    The most crucial layer of an autoencoder is the bottleneck. The compressed knowledge
    that is sent to the decoder is stored in this module. By letting only the most
    crucial portions of the compressed representation get through to the decoder,
    the bottleneck limits the flow of information.

    By this, the input data is guaranteed to have the most amount of information retrieved
    from it and the most beneficial connections discovered. This architectural feature
    also serves as a safeguard against overfitting by preventing the network from
    directly remembering the input data. A network''s compressed representation of
    an input dataset is known as its latent space.

    This latent space is difficult to immediately see and typically holds hundreds
    of dimensions. More intricate neural networks are often termed as "black boxes"
    since their hidden regions are so difficult to see. Latent space in a CAE corresponds
    to better data representation. The weights of the network layers are encoded in
    this enormous matrix of tensors that make up the space structure.


    # 7.3.1.3 Decoder


    It is the Decomponent that attends to recreate an image based on its latent features.
    From the Bott layer, the decoder will get the compressed information, and then
    it uses upsampling and convolutions to reconstruct original image. To measure
    the network''s performance, the Decoder''s output is compared to the ground truth.'
