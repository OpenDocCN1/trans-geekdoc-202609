  md: '# 6.2.2 Human-machine interaction (HMI) plays a crucial role in ensuring that


    Human–Machine Interaction (HMI) ensures drones are accessible and operable even
    by users with limited technical training (Foster & Gray, 2023; Harris & Wilson,
    2021). Effective HMI design allows operators to focus on mission objectives while
    minimizing the complexity of manual control.


    # 6.2.3 Aspects of HMI in drones


    Modern drones incorporate intuitive graphical user interfaces (GUIs) and mobile
    applications that streamline mission planning (Lee & Park, 2023; Quinn & Reed,
    2023). Control methods range from remote controllers to smartphone-based systems
    and even voice-command interfaces (Walker & Harris, 2022; Young & Evans, 2020).
    Real-time feedback—delivered visually, audibly, or through haptic responses—enhances
    situational awareness and safety (Patel & Shah, 2024; Bennett & Turner, 2022).
    Increased levels of automation reduce the demand for manual intervention, enabling
    semi- or fully autonomous operations (Kumar & Singh, 2024; Evans & Harris, 2024).


    # 6.2.4 AI and IoT in agriculture


    In precision agriculture, AI and IoT technologies have revolutionized farm management
    by improving efficiency and sustainability (Anderson & White, 2020; Iqbal & Khan,
    2021). UAVs equipped with multispectral or hyperspectral cameras can assess crop
    health, detect nutrient deficiencies, and identify pests at early stages (Fisher
    & Green, 2024; Udin & Ahmed, 2024). Soil sensors integrated with drone platforms
    enable precise irrigation and fertilization scheduling (Lee & Park, 2023; Zhang
    & Li, 2024). AI-driven image analytics support yield forecasting, pest identification,
    and predictive crop management (Patel & Shah, 2024; Kumar & Singh, 2024).


    # 6.2.5 AI and IoT in medical applications


    In healthcare, AIo-enabled drones have demonstrated the potential to overcome
    accessibility challenges in remote and underserved areas (Chen & Liu, 2022; Martínez
    & Lopez, 2022). These systems are used for rapid delivery of medical supplies,
    remote patient health monitoring, telemedicine consultations, and time-critical
    emergency responses (Baker & Carter, 2023; Rivera & Gomez, 2022). By combining
    real-time sensor data with AI-based decision-making, medical teams can respond
    more quickly and effectively (Hall & King, 2022; Lopez & Garcia, 2022).'
