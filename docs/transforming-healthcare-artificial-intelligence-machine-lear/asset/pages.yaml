  md: '# 5.2 RELATED WORKS


    Xue et al. developed a fully automated approach featuring a DL model for ACL tissue
    segmentation (ACL-DNet) and a classifier for ligament status sensitivity (ACL-SNet)
    [11]. The efficacy of the method was calculated by metrics like sensitivity, specificity,
    and area under the curve (AUC), comparing it to a group of three orthopedists
