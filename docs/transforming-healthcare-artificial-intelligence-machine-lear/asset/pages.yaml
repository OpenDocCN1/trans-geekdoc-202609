    # 1.6 CONCLUSION AND FUTURE WORK


    CNN and GRU were utilized to create a simple, resource-efficient hybrid model
    that diagnoses lung diseases from sound waves. The method works well in experiments.
    The astonishing results have two key factors. Deconstructing the signal using
    DCT reveals unique and essential MFCC properties that distinguish lung sounds.
    Second, hybrid deep-learning affects results. CNNs find important input patterns,
    whereas GRUs use time-dependent information. The proposed method identified ICBH
    (2017) dataset respiratory sounds using MFCC features. The best ML and DL model
    by Accuracy, Precision, Recall, and F1-Score is the DL model with 97% lung disease
    classification accuracy and 93% lung sound classification accuracy. The training
    enhanced lung disease and sound classification over individual classification.
    This study may help the doctor diagnose and urgently treat lung problems.


    Further research may include:


    +   1. Growing and diversifying the patient collection. The hybrid DL model''s
    capacity to diagnose lung diseases from sound data across graphic groups increase.

    2. Studying COVID-19, TB, and lung cancer outside the six groups. Complete screening
    may change patient care.

    3. Creating a web or mobile app for input lung sounds for remote monitor analysis.
    This might make low-resource respiratory health monitoring cheaper and easier.

    4. Hardware-enabled intelligent stethoscopes automate analysis. The doctor, patient,
    and caretaker interaction may improved treatment. Real-time analysis detects and
    monitors lung disease. Healthcare institutions may use multimodal systems.'
