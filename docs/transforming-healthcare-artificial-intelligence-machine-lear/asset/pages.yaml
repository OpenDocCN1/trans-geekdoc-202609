    Transformer encoders are employed to gather the intricate attributes and data
    dependencies in the input image after tokenization. The transformer encoders are
    stacked together in the transformer encoder layer. Each transformer encoder layer
    comprises normalization layers, multi-head attention layer, multi-layer perceptron,
    and the residual connection. The detailed transformer architecture is shown in
    Figure 11.5. Normalization layer frames the input image to be stable before propagating
    through the multi-head attention and multi-layer perceptron.


