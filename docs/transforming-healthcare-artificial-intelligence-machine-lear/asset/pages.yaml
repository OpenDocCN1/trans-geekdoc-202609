  md: "# 8.4 PROPOSED NOVEL MATHEMATICAL MODELS\n\n# 8.4.1 KPI details and definition\n\
    \nThe KPI details and its definition are mentioned in Table 8.2, as given below:\n\
    \n# 8.4.2 Mathematical relationship between KPIs\n\nThe KPIs interact in complex\
    \ ways. For instance:\n\n+   - Latency (L) inversely affects throughput ($T_t$)\
    \ and traffic capacity ($T_c$).\n- Reliability (R) is directly related to packet\
    \ loss rate and impacts QoS adherence (Q).\n- Resource Utilization (U) impacts\
    \ availability (A) and fault tolerance ($F_t$).\nTo model these interactions,\
    \ we can define the following relations:\n- Latency-Throughput Relation:\n\n```\n\
    $L = \frac{C}{T_b} + J$\n```\n\nWhere C is the constant dependent on network infrastructure.\n\
