    +   * Precision: Precision is determined by dividing the number of predicted positive
    samples by the percentage of correctly identified samples.


    ```

    $Precision = \frac{Tp}{Tp+Fp} \quad (18.53)$

    ```


    +   * Recall: Recall is the percentage of all correctly classified positive samples
    that are correctly identified. It''s described as:


    ```

    $Recall = \frac{Tp}{Tp+Fr} \quad (18.54)$

    ```


    +   * F1-score: The F1-score or F-score are other names for this metric. A weighted
    average of the accuracy and recall results in the F1-score. The best number is
    1, while the lowest is 0. In determining the F1-score, recall and accuracy contribute
    equally, which is described as:


    ```

    $F-Score2 = \frac{Precision \times Recall}{Precision + Recall} \quad (18.55)$

    ```


    where Tp, Tn, Fp, and Fn are the true positive, true negative, false positive,
    and false negative, respectively.


