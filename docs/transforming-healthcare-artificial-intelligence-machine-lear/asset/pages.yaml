    \n```\n$U = \frac{1}{A}$\n```\n\n| KPI details | KPI definition |\n|---|---|\n\
    | Latency (L) | Roundtable delay, one-way latency |\n| Throughput/Bandwidth ($T_b$)\
    \ | Data transfer rate |\n| Reliability (R) | Packet loss rate, error rates |\n\
    | Availability (A) | Network uptime |\n| Resource utilization (U) | CPU, memory,\
