  img_proc: true
- pgno: 182
  md: '# 8.4.5.1 GA workflow


    +   1. **Initialization**: Randomly initialize a population of chromosomes (slices).

    2. **Selection**: Select the best chromosomes based on fitness values using techniques
    like Gaussian, Poisson, and Erlang distribution for optimized allocation for each
    specific use cases.

    3. **Crossover**: Perform crossover (e.g., single-point or multi-point crossover)
    to create new offspring chromosomes by combining genes from parent chromosomes.

    4. **Mutation**: Introduce small random changes (mutations) to genes to explore
    new solutions.

    5. **Iteration**: Repeat selection, crossover, and mutation over multiple generations
    until a stopping criterion (e.g., convergence or maximum number of generations)
    is met.


    # 8.4.5.2 Mutation rate


    Mutation helps to maintain diversity and avoid local optima. Mutation rate controls
    the probability of altering a gene:


    $P_{mutation} = \mu$ \quad (8.7)$


    # 8.4.6 Erlang distribution (latency and queueing)


    Latency in Network Slices: The Erlang distribution models latency through multiple
    hops or stages in a network slice. Each stage (such as packet forwarding or processing)
    contributes to the overall delay. This helps in optimizing the number of hops
    and service rates for different slices, ensuring that latency remains within the
    bounds defined by the QoS Agreement for each slice:


    $f_l(x;k,\lambda) = \frac{\lambda^k x^{k-1} e^{-\lambda x}}{(k-1)!}$ \quad (8.8)$


    where $\lambda$ is the rate of service (packets per second), $k$ is the number
    of stages (hops), and $x$ is the latency (time in seconds).


    +   **Total Latency**: For each slice, the expected latency $L_{slice}$ is the
    sum of the latencies across all hops:


    $L_{slice} = \sum_{i=1}^n L_i = \sum_{i=1}^n \frac{k_i}{\lambda_i}$ \quad (8.9)$'
