    # 1.4.3 Feature extraction


    MFCC detects cepstral coefficients from lung sounds using many methods. Start
    with a pre-emphasis filter to increase high frequencies. To limit spectral leakage,
    we split the signal into small frames and multiply by a window function. The Fast
    Fourier Transform converts time to frequency. Each frame''s power spectrum is
    filtered through Mel-scale-aligned filters. Filter bank energies are normalized
    to approximate human loudness. The Discrete Cosine Transform (DCT) decorrelates
    coefficients and extracts the most important information. The final MFCC coefficients
    are selected and stored in a feature matrix as lower-order DCT coefficients (cepstral
    coefficients).


    # 1.4.4 Sound and disease classification


    CNN and GRU networks form the new hybrid deep-learning model for categorization,
    as shown in Figure 1.6. The CNN network helps to identify signal patterns. GRU
    employs fewer parameters and effectively leverages pattern-long temporal relationships,
    unlike LSTMs. CNN has two pairs of convolution, max-pooling, and dropout layers.
    The 64-hidden unit GRU network uses a fully connected layer with five neurons
    for five classes. The softmax layer converts the fully connected layer output
    into class probabilities.


