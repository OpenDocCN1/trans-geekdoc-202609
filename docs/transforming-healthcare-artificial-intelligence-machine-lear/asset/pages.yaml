    # 4.4 SYMPOMS OF MALNUTRITION


    Child malnutrition presents a range of symptoms, depending on the type and severity.
    In acute malnutrition, or wasting, children may appear extremely thin with visible
    bones and muscle. Chronic malnutrition, also known as stunting, manifests in poor
    growth, resulting in children being significantly shorter for their age (Figure
    4.2).


    Common signs of malnutrition include fatigue, irritability, and lack of energy.
    Affected children may have dry skin, brittle hair, or hair loss. In severe cases,
    swelling of the feet or face (edema) can occur, in cases of kwashiorkor, a severe
    form of protein deficiency. Other symptoms include frequent infections, as malnutrition
    weakens the immune system, making children more susceptible to illnesses. Poor
    concentration, delayed developmental milestones, and cognitive impairments are
    also common in children with long-term malnutrition, potentially impacting their
    learning'
