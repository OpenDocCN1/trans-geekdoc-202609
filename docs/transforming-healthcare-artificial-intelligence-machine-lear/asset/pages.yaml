    ```

    Accuracy = \frac{True Positive + True negative}{True Positive + False Negative
    + True Negative + False Positive} (1.3)

    ```


    ```

    F1 score = \frac{2 * Precision * Recall}{Precision + Recall} (1.4)

    ```


