    Kalman Filtering is a mathematical technique used for real-time tracking and noise
    reduction. It is employed to enhance tracking accuracy by smoothing out the detected
    keypoint positions and reducing noise. Kalman filters predict the future positions
    of keypoints by their past movements, ensuring stable and reliable tracking despite
    potential fluctuations. The integration of ml5.js for classification and Kalman
    filtering for tracking ensures each detected pose is consistently and accurately
    classified. p5.js is used to render the tracking results on the canvas, providing
    users with visual feedback and real-time updates.


