  md: "168 Transforming Healthcare\n\n# 8.4.8.1 Optimization\n\nThe optimization for\
    \ the GA-RL combo is\n\n```\n$$\\Minimize \\sum_{i=1}^{n} w_i \\cdot \\text{KPI}_i\
    \ \\text{(Slice Configuration)} - R(t) \\quad (8.13)$\n```\n\n$W_i$ is the weight\
    \ assigned to each KPI (importance level), KPI, is the predicted KPI value using\
