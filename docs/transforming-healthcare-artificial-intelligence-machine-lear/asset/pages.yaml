    # 2.2 TELEMEDICINE


    The purpose of telemedicine is to provide access to clinical services in remote
    places in real time through two-way communication between the patient, help seeker,
    and expert doctors or medical physicians utilizing digital audio/video means.
    In healthcare systems, telemedicine is considered as an innovation, and it is
    helpful for people who need medical assistance from rural places where it is difficult
    to visit hospitals for diagnosis and medical treatment. Via telemedicine, anyone
    can access the available healthcare services digitally and get solutions and recommendations
    for their physical and mental problems [2–4].'
