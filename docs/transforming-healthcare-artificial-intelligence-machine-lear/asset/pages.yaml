- pgno: 53
  md: '# Application of AI for tele-healthcare system 37


    providing healthcare services in remote places. The basic principle behind healthcare
    is ''Store-and-Forward'' mechanism, which means the symptoms of the patients have
    been observed with suitable elements; the data have been stored first, packed
    with data encryption for protection purpose, and finally forwarded to the destination
    where the physician or healthcare professionals are acessible. Then, further medication
    in terms of medicines or treatment is to be suggested by them to the patients.
    There are various means of treatment, which are followed. Some of them are:


    +   i. Tele-triage:

    It involves screening patients in remote places to assess the patient''s health
    condition and the care required.

    ii. Teleconsultation:

    It provides interaction on one-to-one basis between the patient and other healthcare
    professionals.

    iii. Tele-diagnosis:

    In the case of tele-diagnosis, symptoms and conditions are observed by patients
    and the same have been transmitted. After examining the information, it is directed
    to consult with suitable experts for further follow-up and treatment.

    iv. Tele-monitoring:

    In the case of people who need continuous monitoring of their health conditions,
    the process involves acquiring physiological parameters and forwarding them to
    physician or healthcare professionals for further diagnosis and recovery. This
    overall monitoring is said to be tele-monitoring.

    Tele-monitoring is otherwise called as remote line patient monitoring, which consists
    of data transmission, data registration, data processing of human body parameters,
    and further medical treatment or therapeutic to be suggested via digital communication
    mode.

    Patients'' physiological parameters have been acquired by using the necessary
    integrated sensors up wired or wireless devices, wearable or implantable sensors.
    This allows for continuous monitoring of patients'' health conditions in the case
    of chronic diseases based on the needs of patients.


    # 2.3.1 Societal benefits


    The process of telehealth can be achieved by integrating various sensors, which
    are wired of wireless/implantable type. It is possible to provide continuous monitoring
    and support for the management of chronic diseases like breast cancer/blood cancer/lung
    cancer, stroke, cardiovascular attack, etc., as per the requirement of the patients.
    When it is embedded with AI algorithms, it is easy for disease surveillance and
    also early diagnosis. Data acquisition and retrieval with the utilization of GPS
    tracking facilities'
