- pgno: 291
  md: 'i. **Input Layer:** Here, the input images could be varied in size, yet, it
    is standardized to fixed measurements like 257×257 or 353×353 pixels to fill up
    the network structure. The input is shown in RGB with three color channels. This
    resizes the input reliably in all samples without deteriorating spatial resolution
    requirements for pose estimation.


    ii. **Backbone Network:** The backbone of PoseNet is based on MobileNet. MobileNet
    is a highly efficient and lightweight CNN for low-resource environments, such
    as mobile and edge devices. The encoder of PoseNet is made up of several layers
    of depthwise convolutions, followed by batch normalization and ReLU activations.
    Depthwise separable convolutions dramatically reduced the complexity of the model
    while preserving critical spatial features, leading to high-level feature maps
    from the input images.


    iii. **Head Keypoints:** This is an output layer that predicts the locations of
    keypoints in an image. The output is represented as heatmaps, which are essentially
    probability distributions over the possible locations of keypoint. These heatmaps
    are directly derived from high-level feature maps produced by the backbone network.
    This is called heatmap regression, where the network connects offsets for every
    keypoint to refine their location. By regressing these offsets, the model''s accuracy
    is well established at the pixel level, hence improving the precision of keypoints
    by a notable margin.


    iv. **Output Layer:** The final output layer renders the predicted coordinates
    for each keypoint with an associated confidence score. The coordinates are the
    x and y locations for the keypoint in the image, while the confidence score is
    the keypoint likelihood of being found in that location.


    v. **Post-Processing:** Applications of Non-Maximum Suppression (NMS) are made
    to eliminate the redundant keypoints and overlapping detections. NMS suppresses
    the lower-confidence detections and retains only the highest-probability set of
    keypoints related to each person detected in the image. This filter will ensure
    that the final keypoint predictions are not only non-redundant as well.


