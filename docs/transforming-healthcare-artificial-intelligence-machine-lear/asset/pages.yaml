  md: '# Chapter 8


    # # Building network slice for healthcare equipment over 5G services


    Selvaganesh Muniyappan, Sakthi Kumar Saravanan, and Sabarisan Konur Mani


    # ## 8.1 INTRODUCTION


    In recent years, the healthcare industry has been experiencing a digital revolution,
    with the advent of advanced technologies driving significant improvements in patient
    care, operational efficiency, and data management. Among these technologies, 5G,
    the fifth generation of wireless communication networks, stands out as a game-changer,
    offering unprecedented capabilities in terms of speed, latency, and connectivity.
    The integration of 5G technology into healthcare systems presents a unique opportunity
    to enhance the performance and connectivity of critical medical devices, thereby
    enabling a new era of smart healthcare. This chapter delves into the design and
    implementation of a 5G-based system tailored specifically to the needs of various
    simulated healthcare devices data and its characteristics. By leveraging advanced
    network orchestration techniques, including Network Slicing and dynamic resource
    allocation, this system is designed to meet the diverse and demanding requirements
    of medical devices such as MRI machines and CT scanners.


    # ## 8.2 LITERATURE REVIEW


    # ### 8.2.1 Intelligent resource orchestration in 5G edge infrastructures


    One of the foundational works in this domain is the study by Moreno-Vozmediano
    et al. (2024), which underscores the increasing importance of edge infrastructures
    in 5G environments. The authors introduce an integer linear programming model
    to optimize virtual machine (VM) placement, considering factors like server usage
    minimization, load balancing, and latency reduction.'
  merge: -1
  img_proc: true
