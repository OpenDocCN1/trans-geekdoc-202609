    # 10.4 RESULTS


    Here, I proposed a SS technique based on DL. In CR systems, the suggested architecture
    enhances the management of spectrum resources for secondary users. The suggested
    approach used the raw data signal without any prior knowledge of the PU signal,
    including noise density. Generally, the suggested SS technique consists of online
    detection and offline training.


    The stages followed in this experimentation are as follows:


    At first, this strategy proposes a DNN that is learned by utilizing data gathered
    during the primary and secondary user sensing procedure.


    Second, in the online detection process, the well-trained DNN receives fresh information
    every time it is received, using which data and probabilities are obtained. The
    presence or absence of the PU was preceded by those probability. Third, in the
    offline training phase, SS is conceptualized as a binary hypothesis testing scenario.
    Similarly, the proposed deep learning model approach is approached as a binary
    classification problem.


    CR devices are proposed as a solution to the spectrum scarcity problem in radio
    frequency environments, aiming to optimize overall spectrum utilization. However,
    SS in CR systems, particularly in high-performance and energy-efficient systems
    (SS-CRS), poses challenges. SS performance often decreases with longer SS times.
    This inefficiency impacts the efficiency of secondary users (SUs) who must allocate
    significant time and resources to SS tasks that do not directly contribute to
    data transmission.


