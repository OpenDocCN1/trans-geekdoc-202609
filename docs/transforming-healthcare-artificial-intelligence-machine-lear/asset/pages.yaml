  md: '# Application of AI for tele-healthcare system


    # 2.4.1.2 Body blood pressure (BP)


    Blood pressure (BP) is the force of blood against the body''s blood vessel walls
    as blood flows through the circulatory system of the human body. BP rises or lowers
    throughout the day, and this variation is based on our activities. But we need
    to know the reason for any fluctuations or abnormalities (High BP/Low BP) that
    tell us the health conditions. Generally, BP varies based on eating habits, stress
    levels, or physical tasks. To maintain normal BP levels, it is advised to go for
    a disciplined lifestyle and proper medication by physicians.


    Measurement of blood pressure is represented by two numbers such as systolic pressure
    (top number) and diastolic pressure (bottom number). Systolic pressure is the
    pressure in the arteries when the heart beats, whereas the diastolic pressure
    is the pressure when the heart rests between beats. Table 2.2 shows different
    values of systolic and diastolic pressure for different BP levels.


    As the physician''s advice, normal BP readings are below 120/80 mmHg (Systolic)
    and above 90/60mmHg (Diastolic). If the BP readings are outside the mentioned
    range of values, it indicates high BP (also called hypertension) or low BP (also
    called hypotension). Even though both values are important, systolic pressure
    is more important since it causes the heart to function harder than normal functioning.
    Arteries extend the left ventricle of the heart, and lead to stroke and cardiac
    arrest. When it further elevated, it comes into contact with blood vessels and
    disturbs oxygen flow. It will further lead to eye blindness and kidney failure


    Table 2.3 shows the categories of high blood pressure along with their corresponding
    systolic and diastolic Values.


