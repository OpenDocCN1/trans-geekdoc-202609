  md: '# 13.2.4 Pose correction and feedback mechanism


    The final phase of the YogAI project involves managing the practice timer based
    on the detected poses, with distinct requirements for each mode: Learn Mode and
    Practice Mode. In Learn Mode, users must hold each pose for a duration of 10 seconds
    while referring to images. The system continuously monitors the user''s alignment
    using the pose data. If misalignment is detected, the timer momentarily pauses
    to allow the user to correct their posture. If misalignment persists for an extended
    period, the timer resets, giving the user additional time to adjust their pose
    before resuming. This feedback mechanism ensures that users achieve and maintain
    correct posture.


    In Practice Mode, users are required to hold each pose for a longer duration of
    30 seconds without reference images. The system monitors pose accuracy and pauses
    the timer if incorrect. If the incorrect pose continues for a prolonged duration,
    the timer resets to ensure the user can achieve the correct form. Both modes use
    p5.js for managing the visual display of the timer and feedback messages, providing
    an interactive and user-friendly experience. ml5.js plays a crucial role in real-time
    pose classification and feedback, helping users maintain proper form and enhance
    their yoga practice.


    # 13.2.5 PoseNet


    PoseNet is a computer vision model designed to estimate human poses by detecting
    body points, including limbs from images or video. It identifies 17 keypoints,
    such as the nose, eyes, shoulders, elbows, and knees, and constructs a skeletal
    framework of the person''s posture. This model operates in real time, making it
    well-suited for applications that require continuous tracking of body movements.


    In the proposed model, PoseNet is utilized through ml5.js to achieve real-time
    pose detection from a live feed captured by a webcam. It continuously monitors
    the user''s body keypoints, providing coordinates for skeleton visualization and
    pose assessment. This data is processed by a custom neural network to classify
    the pose, allowing the system to identify yoga postures like “Mountain,” “Tree,”
    or “Warrior II.” PoseNet’s ability to deliver real-time feedback helps users adjust
    their poses by comparing their current posture with the ideal alignment, thereby
    enhancing their yoga practice [12].


    # 13.2.6 Architecture overview


    PoseNet is the name of a CNN model designed to carry forward human pose estimation
    in real time, with deep learning techniques to extract body keypoints. The architecture
    of the model can be outlined as follows:'
