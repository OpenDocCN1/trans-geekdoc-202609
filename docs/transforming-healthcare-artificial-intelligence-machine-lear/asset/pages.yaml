    # 7.4 PROPOSED COMBINED CAE AND CNN FRAMEWORK


    In our proposed framework, we have combined CAE and CNN models. In our framework,
    the CAEs are used for


    +   * Image Denoising: By learning to rebuild the original picture from its noisy
    counterpart, CAEs are used to remove noise from images. In order to train the
    network to rebuild the clean picture from its noisy counterpart, pairs of clean
    and noisy images are used. The model may be used to denoise any fresh image after
    it has been trained.

    * Dimensionality Reduction: With CAEs, an image''s dimensionality may be decreased
    without sacrificing any of its key characteristics. This may help lower the amount
    of storage and processing power needed to process photos. A sizable picture dataset
    may be utilized for training the model, which can be used further to extract characteristics
    from fresh photos.

    * Reconstruction: Images that are missing, blurry, partially or completely corrupted
    can be restored using CAEs. This is due to the model''s ability to extract characteristics
    that are resistant to these kinds of distortions and yet allow for the reconstruction
    of a recognizable image.


    The classification procedure is carried out by CNN using the features that were
    extracted from the CAE. Figure 7.4 shows the structure of our proposed CAE and
    CNN model. The CAE extracts features and reduces data. It reduces the amount of
    data while keeping all the important elements. An image dataset is compressed
    using consecutive convolutions. The lowest feasible dataset representation, known
    as the Bottleneck layer, receives the output next.


