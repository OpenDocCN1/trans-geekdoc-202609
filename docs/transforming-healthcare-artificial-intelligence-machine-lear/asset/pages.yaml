  md: '# Building network slice for healthcare equipment over 5G services


    # 8.4.3 GA-RL hybrid workflow


    # 8.4.3.1 GA and RL phase


    The GA runs over a population of slice configurations, optimizing based on the
    KPI fitness function. Each configuration is assessed using the KPI probability
    distribution to favor solutions likely to meet KPI targets. Once an optimal configuration
    is found, the RL agent adjusts the slice parameters to environmental changes to
    maximize long-term KPI adherence.


    The proposed model is a hybrid optimization and adaptive control framework that
    combines GA with RL. The core objective is to maximize adherence to KPI targets
    across all slices, ensuring efficient network utilization, high QoS, and minimal
    service disruptions.


    # 8.4.4 Chromosome representation


    In GA, a chromosome represents a candidate solution for network slicing. For each
    slice (e.g., eMBB, uLLRC, or mMTC), the chromosome encodes the configuration of
    KPI parameters. Each slice chromosome can be represented as a general fitness
    function can be defined as:


    $Chromosome_i = [L_i, T_{b,i}, R_i, A_i, U_i, M_i, S_i, S_{li}, J_{ci}, Q_i, D_{ri},
    F_{li}] \quad$ (8.4)


    +   $L_i$ is the latency and $T_{b,i}$ is the throughput for slice $i$.


    # 8.4.5 Fitness function


    The fitness function evaluates how well a chromosome meets the KPI targets.


    $Fitness_i = \sum_{k=1}^n w_k \cdot f_k(X_i) \quad$ (8.5)


    The fitness function evaluates how well a chromosome meets the KPI targets, where
    $X_i$ is the vector of KPI values for slice $i$; $W_k$ is the weight of KPI based
    on its importance; and $f_k(X_i)$ is the penalty function for each KPI, which
    can be calculated as the deviation of each KPI from its target:


    $f_k(X_i) = |KPI_k - Target_k| \quad$ (8.6)


    The objective is to minimize Fitness, meaning that the best meets the KPIs is
    the optimal solution.'
