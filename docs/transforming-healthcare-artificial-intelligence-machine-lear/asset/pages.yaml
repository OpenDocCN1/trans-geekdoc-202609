    An intense network may have more than 100 layers, yet they all fall into three
    categories fundamental to all CNNs. Convolutional (conv) layers make the CNN''s
    main structural element. To identify different patterns, a range of filters known
    as convolutional kernels go across an input image by pixel. Lung edges are among
    the fundamental structures that are frequently extracted by early layers. Further
    layers reveal more complex contents, including nodes or unusual structures. The
    numerous output images that the kernels generate are feature maps.


    Pooling layers are inserted before and after convolutional layers to process feature
    maps and lower the amount of CPU resources required to process the image. Fully
    connected (FC) layers generate the final output (classification) by combining
    the information from the preceding layers. When all is said and done, even the
    most complex CNN models may be considered two-component systems made up of blocks
    for classification and feature extraction. The convolution and pooling find features.
    FC layers are used to determine the probability that an input image is a member
    of a specific class. The structure of convolutional network is depicted in Figure
