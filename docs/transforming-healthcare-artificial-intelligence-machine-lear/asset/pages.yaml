    the huge distinction in the surface of the image. Multi-head attention improves
    the learning by going through numerous attributes of the image to draw out the
    required relevant information for object classification. Residual connections
    are to prevent the problem of vanishing gradient. It captures the variation between
    the input image and the proceeding layers to acquire knowledge on attribute relevance
    in the image.


