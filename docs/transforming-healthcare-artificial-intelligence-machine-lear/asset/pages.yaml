    # 2.4.1.3 Blood oxygen saturation (SpO2) by pulse oximeter


    A pulse oximeter is an instrument used for self-monitoring of blood oxygen saturation
    (SpO2), respiration rate, and pulse rate. The process of pulse oximetry is carried
    out in a sitting position with the person''s hand kept at heart level. Index finger
    or middle finger is the choice for doing pulse oximetry. The pulse oximeter holds
    the finger (not too tightly or not loosely) for about 30–60 seconds. Wait until
    you have the highest stable reading of SpO2. It is possible to have inaccurate
    values due to the following factors:


    +   i. Finger shaking

    ii. Low battery

    iii. Irregular waves

    iv. Fluctuations in readings

    vv. Frequent movement of fingers or meter

    vi. Change in lying position of hand

    vii. Shivering of hand

    viii. Chillness or sweating in hand.


    With the pulse oximeter, pulse rate can be measured and ranges from 60 to 110
    beats per minute (bpm). Pulse rate can be high for people with anxiety'
