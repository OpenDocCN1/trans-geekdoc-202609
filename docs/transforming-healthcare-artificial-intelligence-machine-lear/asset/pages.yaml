    4. R-wave

    5. S-wave.


    Figure 2.8 shows the illustration of a typical ECG waveform along with its components.

    Various intervals from the ECG waveform are used for diagnosis of various diseases:


    +   1. RR-Interval: It is used to identify the period of an ECG signal and it
    denotes the time interval between two adjacent R-waves. If it is identified as
    irregular, it is an indication of heart disease as arrhythmia.

    2. PR-Interval: It measures the time interval between the starting of P-wave and
    that of the QRS-complex. It is an indication of the time for the impulse to reach
    the ventricles from the sinus node.

    3. QT-Interval: It represents the time interval between the beginning of a Q-wave
    and the end of a T-wave. If the interval gets exceeded from the normal value,
    there is an increased possibility of cardiac death.


