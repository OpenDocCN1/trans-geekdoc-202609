    在机器的周期中，微命令（Micro command）是一种通过控制线向执行路径发送各种控制的控制单元。机器指令的功能通过一系列微码（microcode）来实现。机器指令完成的操作被划分为微码，由处理器进行解释和执行。复杂的指令通常被解码为一系列简化的微指令
    [9]。每个机制都是通过随机访问存储器（RAM）来获取的。然而，指令具有某些功能，而更新微码提供了调试的可能性。


    在之前的论文 [54] 中，我们的实验测试通过改进算法减少了搜索空间，并极大地提高了 Sandsifter 的效率和准确性。它在 I7-4770、I7-4820C、Xeon-E3、I126-M、C-50、Nano
    U 和 KIH2680 等处理器上进行了测试。OFID 直到 2020 年才被发现为 FreeCTH。OF18 指令由 Intel 于 2018 年引入。微码处理器与
    VIA 的名称以及未文档指令的数量相似，某些 x86 指令在其他处理器中并不存在。这些相关的漏洞应该在研究人员之间共享。


    通过观察对未文档指令的测试，发现大多数处理器包含大量的未文档指令，这些指令的特定执行情况是未知的。例如，在 2018 年 Blackumas 中，研究人员在后门中发现了一个未文档指令。可以使用此指令将权限提升到用户级。该漏洞暴露了数千万设备的控制权。


    2014 年，陈大明 [32] 表明在 x86 处理器上，拥有恶意的微码可能会实现恶意软件结构或更改指令。虽然未文档指令需要权限，但其功能是在处理器组件中实现的。这很容易——


    2007 年，Koppe Philipp [33] 分析了未文档的 x86 处理器。他们重置了 AMD KX 和 K8 系列的互斥锁结构以及微码更新。他们发现了
    05 JS 指令用于隐藏恶意加载，最终在驱动程序中提取了微码木马，以获取微钩的激活并利用其移除控制。


    2008 年，King 在开源 CPU 中实现了隐藏后门，并揭示了其相对于其他产品的优势 [29]。另一项研究分析了如何向后门添加更多模式，以及不受操作系统安全策略限制的后门
    [2020]。Dufoil Loi 提出了一种基于修改的虚拟机内置 CPU 的验证方法，用于处理器的后门安全。它证明了处理器后门的存在将给系统带来巨大收益。


    如果未文档功能存在问题，用户将选择通过提供更新（errata）来修复安全问题并防止漏洞的发生。尽管更新机制的具体细节尚未披露，但存在通过逆向分析的风险，这会影响处理器的性能。一旦发生这一过程，该机制只能通过加密检查来防止劫持。


    如果攻击者添加了隐藏指令和某些后门，软件很难检测。对未文档指令的研究是预防威胁的重要基础。


    ## III. 安全措施


    ### D. 未文档指令与后门


    未文档指令的限制关系未由制造商发布，因此由于资源有限，指令研究具有挑战性。目前，安全测试基于微码的权限房屋控制 [94]。然而，由于 CPU 的复杂性和集成性，源代码和测试数据并不容易收集，非微码平台的研究人员很难进行安全测试。


    通常情况下，指令设计、优化和更新程序的问题会定期发布错误补丁来修复安全问题。为了防止漏洞的出现，研究人员设计了安全机制进行保护。本文介绍了安全措施的分类，并详细讨论了补丁缓解措施和硬件技术。


    ### A. 补丁缓解措施


    使用微码补丁是漏洞的通用方法。它允许通过注入未文档微码来突破目标，实现间接分支执行 (IBRS) [36]、单分支预测器和间接分支预测器 (IBPB)。陈
    [7] 显示了这些补丁的有效性，并发现预测是有效的。RSA 等加密对于获取密钥防止侧道攻击至关重要。目前的 AMD 处理器使用强大的加密算法来保护微码更新机制，有助于缓解安全威胁。


    Christopher Dumas [26] 将 CPU 指令测试深度融合，通过自动指令的逆向分析发现了未文档的变化。张志提出了 CPU 安全基准测试 [27]，他们开发的工具比
    Sandsifter 更好，并且可以在 arm 等其他架构下运行。Baires 是 Sandsifter 之后的 64 位硬件指令集适配器。它被设计为在没有任何操作系统的情况下命令行运行
    [35]。然而，这些都是可能的，并不能保证加密数据是安全的，从而无法防止漏洞被利用。


    ## IV. 展望


    近年来，CPU 安全一直是研究人员关注的焦点。然而，由于分析难度大，CPU 安全的研究较少。随着技术的发展，CPU 漏洞不断增加，指令安全也逐渐受到关注。许多研究人员也在尝试修复指令的错误问题。本文显示未来
    CPU 指令的发展分为三个部分：


    虽然通过微码更新修复某些错误是可能的，但并非完全有效，且硬件补丁只能在漏洞发生后回滚。漏洞的损失可以通过微码更新有效减少，性能还需要额外的检查。

