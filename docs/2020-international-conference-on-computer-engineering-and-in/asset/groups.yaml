    目前，对CPU安全的研究是碎片化的，存在更多的问题和不同的限制。工业界和学术界目前正试图定义针对这些问题的有效措施，而现有的措施针对单一漏洞。通过对异常指令、Meltdown、Spectre等漏洞的分析，本文证明了指令安全是处理器安全的核心问题。指令安全包括硬件保护以防止违反所述的安全，使其不被用于产生异常问题，也不会被劫持和篡改以泄露信息，并确保CPU的正常执行。CPU的操作基础取决于指令集架构。指令安全影响CPU和整个系统的安全。我们的工作侧重于从指令描述和执行的角度进行分析，总结了关键发现，如违反描述、执行优化、更新机制、未定义指令和后门，并衡量了安全影响。寄存器、地址模式、内存架构、意外处理和执行IO。ISA是处理器设计的规范，对应ISA的实现可以在不同的微架构中实施，不同的实现可能会导致CPU性能和成本的差异。如果CPU违反了ISA的设计标准，根据制造商提供的建立描述，在执行指令时可能会失败。CPU制造商可能会通过寄存器泄露敏感数据。根据2007年至2019年的错误集，根据CPU的工作机制，将其分为以下六类：


