    At present, research on CPU security is fragmented, with more problems and different
    constraints. The industry and academia are now trying to define effective measures
    against these problems, and existing measures are aimed at a single vulnerability.
    Through the analysis of vulnerabilities, such as abnormal instruction, Meltdown,
    Spectre and so on, this paper demonstrates that instruction security is the core
    problem of processor security. Instruction security includes hardware protection
    to violate the stated security, will not be used to generate abnormal problems,
    nor be hijacked and tampered with to leak information and the normal execution
    of CPU. The operation basis of CPUs depends on the instruction set architecture.
    Instruction security affects the security of the CPU and the whole system. Our
    work focuses on the analysis of the perspective of the established description
    and execution of instructions, summarizes key findings such as violation description,
    execution optimization, updating mechanism, undocumented instruction and backdoor,
    and measures the security impact of various hardware protection techniques.


