    # B. The aspect of optimized execution


    In order to improve the efficiency of instruction execution, modern processors
    basically adopt the out-of-order execution and branch prediction technology. The
    out-of-order execution technology is an optimization technique that allows all
    execution units of the CPU core to be used as exhaustively as possible when the
    execution unit is occupied, as a result of the instruction follows the schema,
    the instruction can be reordered without effects, differences in timing can be
    learned.


    Branch prediction technology make CPU various mechanisms to produce the results
    of branches or dependencies. The CPU will continue to execute along the predicted
    path. For example, Branch Prediction Unit (BPU) is to predict the next instruction
    branch, and Branch Target Buffers (BTB) to record useful information for prediction
    [23]. With proper prediction, CPU can use precomputed results from the


    reorder buffer, improving the overall performance. However, if the prediction
    is incorrect, CPU needs to perform a rollback to the last correct state. It is
    easy for sensitive information to be leaked.


    In 2018, the Google Project Zero team announced the Meltdown [5]. This vulnerability
    affects almost all processors except Intel processors. When Meltdown appeared,
    the Google Project Zero team announced the Spectre [6]. This vulnerability affects
    all modern processors, which are more extensive than Meltdown. By using optimization
    technology, the side channel can read all the information in memory, which can
    cause leak of sensitive information, and it can also threaten cloud protection
    through virtualization technology.


    Most of the side channel attacks are based on the speculative execution mechanism
    and branch prediction mechanism. As shown in Table 2, if combined with other factors,
    it can cause serious harm [77][51][52], and vulnerabilities will always exist
    and can be predicted for specific vulnerabilities. Therefore, the security of
    the processor is usually affected by the utilization of instruction optimization
    technology.


