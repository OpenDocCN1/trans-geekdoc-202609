    # ### III. SECURITY MEASURES


    # D. Undocumented instruction and backdoor


    The limited relating of undocumented instructions is not published by manufacturers,
    so instruction research is challenging because of the limited resources. Currently,
    security testing is based on the permission house of microcode [94]. However,
    source code and test data are not easily collected because of the complexity and
    integration of the CPU, it is difficult for researchers from non-microcode platforms
