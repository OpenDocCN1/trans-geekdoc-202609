    # A. Search and analysis of undocumented instruction sets


    There will be some instructions in the CPU for debugging, disregarding instructions
    and test constructions without documentation documents. The processor will be
    seriously affected if there is an instruction like these. C3 CPU God mode, [28]
    of undocumented instruction [29], trojan made with microcode [33] can cause of
    hardware-level vulnerabilities, searching and analyzing undocumented instructions
    will be the focus of CPU instruction security.


    # B. Hardware protection techniques


    Hardware-level defense is essential to ensure the safety of processor, but due
    to the technical limitations and considering the balance of performance, there
    is no perfect security of the hardware. Level introduced by extension of cache
    architecture (CAT) will help isolate critical areas and limiting capacity by securing
    software data distribution to specific locations of the last-level.


    # B. Semantic ambiguity of instructions


    Although the manufacturers have open documents for instruction interpretation,
    the core of the research is whether the semantics of the instruction is consistent
    with the document. Professor Wei of Tsinghua University found that the real instruction
    is different from implementation problems, the results of some instructions are
    inconsistent with the expectation, resulting in processor timeout and lock. Some
    security mechanisms can detect hidden vulnerabilities, such as hardware such as
    Dias and Specs. However, software can find more complex problems, and hardware
    requires more efforts. How to study and more efficiently the instruction analysis
    and error is the focus of the following.


    Also, protection can be achieved by combining other hardware protection techniques.
    Intel TSX is designed to allow the application to execute fine-grained help, detect
    malicious behavior and restore [42] roll back the system state in case of failure
    [23]. Even TSX is not a trusted area and can also be used to prevent attacks for
    cloud services [44][45][46], and effectively protect cloud services.


    # C. Recovery of CPU internal mechanism


    The analysis of instructions is inseparable from the recovery of internal mechanism
    of CPU. For example, MDS [71][152] is detected through the reverse CPU internal
    cache storage, building with instruction logic architecture branch to predict.
    But few manufacturers have detected the internal structure and design, with current
    of non-manufacturers security searching and analyzing is an important direction
    of future research.


    At present, virtualization technology, trusted computing and other system security
    protection technologies are widely used, but they still have shortcomings. However,
    virtualization uses privileged hypervisor to isolate multiple software that may
    affect the whole system; the trusted platform module cannot ensure the security
    of running. In 2013, Intel introduced Software Group Extension (SGX) security
    set extension to add some memory access control techniques to protect applications
    from higher-privilege area. In recent years, SGX has been applied to protect creating
    trusted environments, and so on. Nevertheless, the processor with SGX will still
    be vulnerable, and the protection method is still a long way to go.


    Professor Wei of Tsinghua University has dynamic check and control technology
    for CPU security [47]. To prevent CPU from being attacked by hardware trojan,
    microcode update and hardware vulnerability, the instruction level CPU model and
    hardware behavior security assertion are used to control the processor.


    # V. CONCLUSIONS


