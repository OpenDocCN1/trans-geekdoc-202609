    # II. Instruction SECURITY PROBLEM ANALYSIS


    The CPU is the hardware unit for processing and execution program. The therefore,
    design, optimization and execution of the instruction set of the CPU and are related
    to the security of the entire system. This section describes the working mechanism
    of the CPU and the execution and process of instructions. The current instruction
    security issues from the aspects of instruction design, optimization, updating
    mechanism and potential threats.


