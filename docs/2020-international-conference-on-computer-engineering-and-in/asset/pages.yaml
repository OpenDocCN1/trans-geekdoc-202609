    **Abstract—**research on abnormal instruction, Midtown, Spectre, undocumented
    instruction and on the processor lately claim that security is one of the few
    processor security. This paper analyzes the extension standard, optimization technology
    and the relationship between instruction and microarchitecture security problems
    including instruction description, vulnerability of optimization technique, hijacking
    updating, undocumented instruction. Then, the mitigating hardware and software
    measures for the instruction problems are explained. Finally, it concludes that
    the research on undocumented instruction, semantic ambiguity of undocumented instruction
    and recovery mechanism are the trends of future security research.


    Key words: CPU; instruction; vulnerability


    # I. INTRODUCTION


    As shown in 1971, Intel introduced the world''s first microprocessor 4004, marking
    the birth of the CPU. To the emergence of the first microprocessor with superscalar
    architecture pipeline, and in 1994 formally introduced out-of-order execution
    branch prediction what has been used by processors, the performance has been greatly
    improved. To improve performance and meet the increasing demands of software and
    systems, modern processors introduce many issues such as hyperthreading, virtualization,
    instruction set extension and more requirements.


    ![](img/4a743204a52bd06086f2ff545a78ce07_0_0.png)


    The booming of CPU also brought many security problems. As shown in 2002, FVD/
    bug caused errors in floating-point division on the processor in 1994, and a number
    of problems were revealed [1]. In 1997, the FPU abnormal instruction in the Pentium
    processor caused data errors. Rift, the possibility of Ring -3 root exploit at
    Blackhat in 2009 [2]. In 2014, the Transactional Extensions (TSX) has affected
    the normal operation of the system; in 2015, the Memory Store vulnerability combined
    with the inherent flaw of the system management could raise the privilege from


    the Ring 0 to the Ring-level 3. In 2017, in Midtown and Spectre allowed unauthorized
    code execution [4]. even though ever manufactured, and there were numerous variants,
    such as Foreshadow and Meltdown (MDS) series, which made the information of operation
    on the device risk to be leaked [5][6][7][8]. These security problems seriously
    jeopardize network security, critical infrastructure and security information
    in important industries, and have caused huge losses.'
