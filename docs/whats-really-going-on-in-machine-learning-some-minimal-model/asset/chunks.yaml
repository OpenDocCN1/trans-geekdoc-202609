    ![](image_rsrc114.jpg)![](image_rsrc115.jpg)


    但在神经网络训练中到底发生了什么？实际上，我们是在寻找一种方法，将一个函数（至少近似地）“编译”进一个具有特定数量（实值）参数的神经网络中。在本例中，我们恰好使用了约
    100 个参数。


    但如果我们使用不同数量的参数，或以不同方式设置神经网络架构，会发生什么？以下是几个示例，表明对于我们试图生成的函数，我们迄今为止使用的网络几乎是能起作用的最小网络：


    ![](image_rsrc116.jpg)


    顺便说一下，如果我们将激活函数从 ReLU ![](image_rsrc117.jpg) 改为更平滑的 ELU ![](image_rsrc118.jpg)，会发生什么：


    ![](image_rsrc119.jpg)


    稍后我们将讨论在离散系统中进行机器学习会发生什么。为了预演这一点，很有意思的是看看如果我们获取一个上述类型的神经网络，并将其权重（和偏置）在离散层级上“量化”，会发生什么：


    ![](image_rsrc11A.jpg)


    结果表明（正如近期大规模神经网络的经验也显示的那样），神经网络的基本“运作”并不需要精确的实数，即使数字至少在一定程度上是离散的，它依然能生存——这也由作为离散度
