    # 规则数组、元胞自动机与神经网络


    规则数组和普通元胞自动机有一个共同特征：每个单元的值仅取决于前一步相邻单元的值。但在神经网络中，标准做法是给定节点的值取决于前一层大量节点的值。之所以在神经网络中这很直接，是因为来自前序节点的（加权的，或许还经过其他变换的）值被认为仅通过简单的数值加法来组合——而加法（作为
    n 元且结合的运算）可以接受任意数量的“输入”。然而，在元胞自动机（或布尔函数）中，输入的数量总是确定的，由函数的结构决定。在最直接的情况下，输入仅来自最近邻单元。但并没有要求必须这样工作——例如，我们可以选取任意“局部模板”来为函数引入输入。该模板可以在每个位置和每一步都相同，也可以在不同位置从某个集合中不同地选取——实际上这给我们提供了“模板数组”以及规则数组。


    ## 全连接离散网络


    那么，像我们在最早的神经网络示例中那样，拥有一个全连接网络又如何呢？要建立其离散类比，我们首先需要某种离散的 n 元结合“累加器”函数来取代数值加法的位置。为此我们可以选择
    `And`、`Or`、`Xor`——或 `Majority` 这样的函数。如果我们不想在给定层的每个节点最终得到相同的值，我们需要为每个连接建立某种权重的类比——这可以通过对流经每个连接的值应用
    `Identity` 或 `Not`（即翻转或不翻转）来实现。


    下面是此类网络的一个示例，经过训练可计算我们上面讨论的函数：


    ![](img/image_rsrc15D.jpg)


    这里只有两种连接：翻转和不翻转。而在每个节点，我们计算的是多数函数——如果其输入的多数为 1 则给出值 1，否则为 0。使用我们之前采用的“独热编码”表示输入和输出，以下是该网络评估该函数的几个示例：


    ![](img/image_rsrc15E.jpg)


    这仅使用了 1000 步应用于连接类型的单点突变进行训练。损失系统性地下降——但连接类型的配置即便在达到零损失时（即函数已完全学会后）看起来仍相当随机：


    ![](img/image_rsrc15F.jpg)


    在我们刚才所做的过程中，我们假设所有连接持续存在，尽管它们的类型（或有效符号）可以改变。但我们也可以考虑一种网络，其中连接在训练过程中可能被归零——从而实际上不再存在。


    ## 规则数组自编码


    我们在这里用机器学习做的许多工作，都集中在试图学习 `x → f[x]` 形式的变换。但机器学习的另一个典型应用是自编码——实际上是学习如何压缩代表某组示例的数据。同样，也可以使用规则数组来完成此类任务，学习通过一系列单点突变来实现。


    作为起点，考虑训练一个规则数组（元胞自动机规则 4 和 146）以原样复现任意宽度的黑色单元块。人们可能会认为这很容易。但并非如此，因为实际上初始数据不可避免地在规则数组内部被“粉碎”，并必须在最后重新组合。但是，是的，仍然可以训练规则数组至少大致做到这一点——尽管我们找到的能做到这一点的规则数组再次看起来相当随机：


    ![](img/image_rsrc15H.jpg)


    但要建立一个非平凡的自编码器，让我们设想在中间逐渐“挤压”数组，创建一个越来越窄的“瓶颈”，数据必须通过它流动。在瓶颈处，我们实际上拥有了原始数据的压缩版本。我们发现，至少直到某个瓶颈宽度，可以创建规则数组——且具有合理的概率——能作为原始数据的成功自编码器：


    ![](img/image_rsrc15J.jpg)


    ## 最小 Transformer 模型


    LLM 的成功凸显了机器学习在序列延续中的应用——以及 Transformer 为此的有效性。但正如其他神经网络一样，实践中使用的 Transformer
    形式通常非常复杂。但能否找到一个最小模型，仍能捕捉“Transformer 的本质”？


    假设我们有一个想要延续的序列，如：


    ![](img/image_rsrc15K.jpg)


    我们想用向量编码每个可能的值，如


    ![](img/image_rsrc15M.jpg)


    这样，例如，我们的原始序列被编码为：


    ![](img/image_rsrc15N.jpg)


    然后我们有一个“头”，它读取一块连续的向量，挑选特定的值并将成对值送入 `And` 和 `Xor` 函数，以得到一个布尔值向量：


    ![](img/image_rsrc15P.jpg)


    最终，这个头将沿着我们的序列“滑动”，通过“预测”序列中的下一个元素是什么。但我们必须以某种方式从布尔值向量过渡到序列元素（的概率）。我们潜在地可能仅用规则数组做到这一点。但为了我们这里的目的，我们将使用一个全连接单层
    `Identity`+`Not` 网络，其中在每个输出节点，我们只需找到送达该节点的值的数量之和——并将其视为通过 `softmax` 确定相应元素的概率：


    ![](img/image_rsrc15R.jpg)


    在这种情况下，具有最大值的元素是 5，因此在“零温度”下，这将是我们对下一个元素的“最佳预测”。


    要训练这个完整系统，我们只需对所有内容进行一系列随机点突变，保留那些不增加损失的突变（损失基本上是预测的下一个值与实际下一个值之间的差异，或更精确地说是“分类交叉熵”）。以下是典型此类训练中损失的进展情况：


    ![](img/image_rsrc15S.jpg)


    训练结束时，以下是我们最小 Transformer 的组件：


    ![](img/image_rsrc15T.jpg)


    首先是序列中不同可能元素的编码。然后是头，这里展示了其应用于原始序列首个元素编码的情况。最后是一个单层离散网络，它接收来自头的输出，并推断不同元素作为下一个元素出现的相对概率。在这种情况下，下一个元素的最高概率预测是元素
    6。


    要进行类似 LLM 的操作，我们从某个初始“提示”开始，即一个适合头宽度（“上下文窗口”）的初始序列。然后我们逐步应用我们的最小 Transformer，例如在每一步将下一个元素设为预测概率最高的那个（即在“零温度”下操作）。在此设置下，“预测强度”的集合显示为灰色，“最佳预测”显示为红色：


    ![](img/image_rsrc15U.jpg)


    '
