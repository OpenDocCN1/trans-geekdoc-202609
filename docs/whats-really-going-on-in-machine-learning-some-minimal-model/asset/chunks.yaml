- raw: 'And so, yes, not only are all (even) Boolean functions representable in terms
    of And+Xor rule arrays, they’re also learnable in this form, just by adaptive
    evolution with single-point mutations.


    In what we did above, we were looking at how machine learning works with our rule
    arrays in specific cases like for the ![](image_rsrc14W.jpg)function. But now
    we’ve got a case where we can explicitly enumerate all possible functions, at
    least of a given class. And in a sense what we’re seeing is evidence that machine
    learning tends to be very broad—and capable at least in principle of learning
    pretty much any function.


    Of course, there can be specific restrictions. Like the And+Xor rule arrays we’re
    using here can’t represent (“odd”) functions where ![](image_rsrc14X.jpg). (The
    [Nand](https://reference.wolfram.com/language/ref/Nand.html)+[First](https://reference.wolfram.com/language/ref/First.html)
    rule arrays we discussed above nevertheless can.) But in general it seems to be
    a reflection of the [Principle of Computational Equivalence](https://www.wolframscience.com/nks/chap-12--the-principle-of-computational-equivalence/)
    that pretty much any setup is capable of representing any function—and also adaptively
    “learning” it.


    By the way, it’s a lot easier to discuss questions about representing or learning
    “any function” when one’s dealing with discrete (countable) functions—because
    one can expect to either be able to “exactly get” a given function, or not. But
    for continuous functions, it’s more complicated, because one’s pretty much inevitably
    dealing with approximations (unless one can use symbolic forms, which are basically
    discrete). So, for example, while we can say (as we did above) that (ReLU) neural
    nets can represent any piecewise-linear function, in general we’ll only be able
    to imagine successively approaching an arbitrary function, much like when you
    progressively add more terms in a simple Fourier series:


    ![](image_rsrc14Y.jpg)


    Looking back at our results for discrete rule arrays, one notable observation
    that is that while we can successfully reproduce all these different Boolean functions,
    the actual rule array configurations that achieve this tend to look quite messy.
    And indeed it’s much the same as we’ve seen throughout: machine learning can find
    solutions, but they’re not “structured solutions”; they’re in effect just solutions
    that “happen to work”.


    Are there more structured ways of representing Boolean functions with rule arrays?
    Here are the two possible minimum-size And+Xor rule arrays that represent rule
    30:


    ![](image_rsrc14Z.jpg)


    At the next-larger size there are more possibilities for rule 30:


    ![](image_rsrc150.jpg)


    And there are also rule arrays that can represent rule 110:


    ![](image_rsrc151.jpg)


    But in none of these cases is there obvious structure that allows us to immediately
    see how these computations work, or what function is being computed. But what
    if we try to explicitly construct—effectively by standard engineering methods—a
    rule array that computes a particular function? We can start by taking something
    like the function for rule 30 and writing it in terms of And and Xor (i.e. in
    [ANF, or “algebraic normal form”](https://reference.wolfram.com/language/ref/BooleanConvert.html)):


    ![](image_rsrc152.jpg)


    We can imagine implementing this using an “evaluation graph”:


    ![](image_rsrc153.jpg)


    But now it’s easy to turn this into a rule array (and, yes, we haven’t gone all
    the way and arranged to copy inputs, etc.):


    ![](image_rsrc154.jpg)


    “Evaluating” this rule array for different inputs, we can see that it indeed gives
    rule 30:


    ![](image_rsrc155.jpg)


    Doing the same thing for rule 110, the And+Xor expression is


    ![](image_rsrc156.jpg)


    the evaluation graph is


    ![](image_rsrc157.jpg)


    and the rule array is:


    ![](image_rsrc158.jpg)


    And at least with the evaluation graph as a guide, we can readily “see what’s
    happening” here. But the rule array we’re using is considerably larger than our
    minimal solutions above—or even than the solutions we found by adaptive evolution.


    It’s a typical situation that one sees in many other kinds of systems (like for
    example [sorting networks](https://www.wolframscience.com/nks/notes-12-8--sorting-networks/)):
    it’s possible to have a “constructed solution” that has clear structure and regularity
    and is “understandable”. But minimal solutions—or ones found by adaptive evolution—tend
    to be much smaller. But they almost always look in many ways random, and aren’t
    readily understandable or interpretable.


    So far, we’ve been looking at rule arrays that compute specific functions. But
    in getting a sense of what rule arrays can do, we can consider rule arrays that
    are “[programmable](https://www.wolframscience.com/nks/chap-11--the-notion-of-computation/)”,
    in that their input specifies what function they should compute. So here, for
    example, is an And+Xor rule array—found by adaptive evolution—that takes the “bit
    pattern” of any (even) Boolean function as input on the left, then applies that
    Boolean function to the inputs on the right:


    ![](image_rsrc159.jpg)


    And with this same rule array we can now compute any possible (even) Boolean function.
    So here, for example, it’s evaluating [Or](https://reference.wolfram.com/language/ref/And.html):


    ![](image_rsrc15A.jpg)


    ## Other Kinds of Models and Setups


    Our general goal here has been to set up models that capture the most essential
    features of neural nets and machine learning—but that are simple enough in their
    structure that we can readily “look inside” and get a sense of what they are doing.
    Mostly we’ve concentrated on rule arrays as a way to provide a minimal analog
    of standard “perceptron-style” feed-forward neural nets. But what about other
    architectures and setups?


    In effect, our rule arrays are “spacetime-inhomogeneous” generalizations of cellular
    automata—in which adaptive evolution determines which rule (say from a finite
    set) should be used at every (spatial) position and every (time) step. A different
    idealization (that in fact we already used in [one section above](#c5C.xhtml))
    is to have an ordinary homogeneous cellular automaton—but with a single “global
    rule” determined by adaptive evolution. Rule arrays are the analog of feed-forward
    networks in which a given rule in the rule array is in effect used only once as
    data “flows through” the system. Ordinary homogeneous cellular automata are like
    recurrent networks in which a single stream of data is in effect subjected over
    and over again to the same rule.


    There are various interpolations between these cases. For example, we can imagine
    a “layered rule array” in which the rules at different steps can be different,
    but those on a given step are all the same. Such a system can be viewed as an
    idealization of a convolutional neural net in which a given layer applies the
    same kernel to elements at all positions, but different layers can apply different
    kernels.


    A layered rule array can’t encode as much information as a general rule array.
    But it’s still able to show machine-learning-style phenomena. And here, for example,
    is adaptive evolution for a layered And+Xor rule array progressively solving the
    problem of generating a pattern that lives for exactly 30 steps:


    ![](image_rsrc15B.jpg)


    One could also imagine “vertically layered” rule arrays, in which different rules
    are used at different positions, but any given position keeps running the same
    rule forever. However, at least for the kinds of problems we’ve considered here,
    it doesn’t seem sufficient to just be able to pick the positions at which different
    rules are run. One seems to either need to change rules at different (time) steps,
    or one needs to be able to adaptively evolve the underlying rules themselves.'
