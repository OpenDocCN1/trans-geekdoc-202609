- raw: 'Running this even far beyond our original training data, we see that we get
    a “prediction” of a continued sine wave:


    ![](image_rsrc15V.jpg)


    As we might expect, the fact that our minimal transformer can make such a plausible
    prediction relies on the simplicity of our sine curve. If we use “more complicated”
    training data, such as the “mathematically defined” (![](image_rsrc15W.jpg)) blue
    curve in


    ![](image_rsrc15X.jpg)


    the result of training and running a minimal transformer is now:


    ![](image_rsrc15Y.jpg)![](image_rsrc15Z.jpg)


    And, not surprisingly, it can’t “figure out the computation” to correctly continue
    the curve. By the way, different training runs will involve different sequences
    of mutations, and will yield different predictions (often with periodic “hallucinations”):


    ![](image_rsrc160.jpg)


    In looking at “perceptron-style” neural nets we wound up using rule arrays—or,
    in effect, spacetime-inhomogeneous cellular automata—as our minimal models. Here
    we’ve ended up with a slightly more complicated minimal model for transformer
    neural nets. But if we were to simplify it further, we would end up not with something
    like a cellular automaton but instead with something like a [tag system](https://www.wolframscience.com/nks/p93--tag-systems/),
    in which one has a sequence of elements, and at each step removes a block from
    the beginning, and—depending on its form—adds a certain block at the end, as in:


    ![](image_rsrc161.jpg)


    And, yes, such systems [can generate extremely complex behavior](https://writings.stephenwolfram.com/2021/03/after-100-years-can-we-finally-crack-posts-problem-of-tag-a-story-of-computational-irreducibility-and-more/)—reinforcing
    the idea (that we have repeatedly seen here) that machine learning works by selecting
    complexity that aligns with goals that have been set.


    And along these lines, one can consider all sorts of different computational systems
    as foundations for machine learning. Here we’ve been looking at cellular-automaton-like
    and tag-system-like examples. But for example our [Physics Project](https://www.wolframphysics.org/)
    has shown us the power and flexibility of systems based on [hypergraph rewriting](https://www.wolframphysics.org/technical-introduction/basic-form-of-models/).
    And from what we’ve seen here, it seems very plausible that something like hypergraph
    rewriting can serve as a yet more powerful and flexible substrate for machine
    learning.


    ## So in the End, What’s Really Going On in Machine Learning?


    There are, I think, several quite striking conclusions from what we’ve been able
    to do here. The first is just that models much simpler than traditional neural
    nets seem capable of capturing the essential features of machine learning—and
    indeed these models may well be the basis for a new generation of practical machine
    learning.


    But from a scientific point of view, one of the things that’s important about
    these models is that they are simple enough in structure that it’s immediately
    possible to produce visualizations of what they’re doing inside. And studying
    these visualizations, the most immediately striking feature is how complicated
    they look.


    It could have been that machine learning would somehow “crack systems”, and find
    simple representations for what they do. But that doesn’t seem to be what’s going
    on at all. Instead what seems to be happening is that machine learning is in a
    sense just “hitching a ride” on the [general richness of the computational universe](https://www.wolframscience.com/nks/chap-3--the-world-of-simple-programs/).
    It’s not “specifically building up behavior one needs”; rather what it’s doing
    is to harness behavior that’s “already out there” in the computational universe.


    The fact that this could possibly work relies on the crucial—and at first unexpected—fact
    that in the computational universe even very simple programs can ubiquitously
    produce all sorts of complex behavior. And the point then is that this behavior
    has enough richness and diversity that it’s possible to find instances of it that
    align with machine learning objectives one’s defined. In some sense what machine
    learning is doing is to “mine” the computational universe for programs that do
    what one wants.


    It’s not that machine learning nails a specific precise program. Rather, it’s
    that in typical successful applications of machine learning there are lots of
    programs that “do more or less the right thing”. If what one’s trying to do involves
    something computationally irreducible, machine learning won’t typically be able
    to “get well enough aligned” to correctly “get through all the steps” of the irreducible
    computation. But it seems that [many “human-like tasks”](https://writings.stephenwolfram.com/2023/02/what-is-chatgpt-doing-and-why-does-it-work/#models-for-human-like-tasks)
    that are the particular focus of modern machine learning can successfully be done.


    And by the way, one can expect that with the minimal models explored here, it
    becomes more feasible to get a real characterization of what kinds of objectives
    can successfully be achieved by machine learning, and what cannot. Critical to
    the operation of machine learning is not only that there exist programs that can
    do particular kinds of things, but also that they can realistically be found by
    adaptive evolution processes.


    In what we’ve done here we’ve often used what’s essentially the very simplest
    possible process for adaptive evolution: a sequence of point mutations. And what
    we’ve discovered is that even this is usually sufficient to lead us to satisfactory
    machine learning solutions. It could be that our paths of adaptive evolution would
    always be getting stuck—and not reaching any solution. But the fact that this
    doesn’t happen seems [crucially connected to the computational irreducibility](https://writings.stephenwolfram.com/2024/05/why-does-biological-evolution-work-a-minimal-model-for-biological-evolution-and-other-adaptive-processes/#the-fitness-landscape)
    that’s ubiquitous in the systems we’re studying, and that leads to effective randomness
    that with overwhelming probability will “give us a way out” of anywhere we got
    stuck.


    In some sense computational irreducibility “levels the playing field” for different
    processes of adaptive evolution, and lets even simple ones be successful. Something
    similar seems to happen for the whole framework we’re using. Any of a wide class
    of systems seem capable of successful machine learning, even if they don’t have
    the detailed structure of traditional neural nets. We can see this as a typical
    reflection of the [Principle of Computational Equivalence](https://www.wolframscience.com/nks/chap-12--the-principle-of-computational-equivalence/):
    that even though systems may differ in their details, they are ultimately all
    equivalent in the computations they can do.


    The phenomenon of computational irreducibility leads to a fundamental tradeoff,
    of [particular importance in thinking about things like AI](https://writings.stephenwolfram.com/2023/03/will-ais-take-all-our-jobs-and-end-human-history-or-not-well-its-complicated/).
    If we want to be able to know in advance—and broadly guarantee—what a system is
    going to do or be able to do, we have to set the system up to be computationally
    reducible. But if we want the system to be able to make the richest use of computation,
    it’ll inevitably be capable of computationally irreducible behavior. And it’s
    the same story with machine learning. If we want machine learning to be able to
    do the best it can, and perhaps give us the impression of “achieving magic”, then
    we have to allow it to show computational irreducibility. And if we want machine
    learning to be “understandable” it has to be computationally reducible, and not
    able to access the full power of computation.'
