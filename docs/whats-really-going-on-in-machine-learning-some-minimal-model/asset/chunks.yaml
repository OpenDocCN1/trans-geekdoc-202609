  trans: '

    但随后，几个月前，作为[一项旨在理解科学所做之事与 AI 所做之事之间关系的努力](https://writings.stephenwolfram.com/2024/03/can-ai-solve-science/)的一部分，我尝试了一种[“一次性实验”](https://writings.stephenwolfram.com/2024/03/can-ai-solve-science/#exploring-spaces-of-systems)——令我非常惊讶的是，它似乎成功捕捉到了[使生物进化成为可能的本质](https://writings.stephenwolfram.com/2024/05/why-does-biological-evolution-work-a-minimal-model-for-biological-evolution-and-other-adaptive-processes/)。但其他适应性进化——特别是机器学习——又该如何呢？所需的模型与[我
    1985 年研究的内容](https://content.wolfram.com/sw-publications/2020/07/approaches-complexity-engineering.pdf)有着令人尴尬的相似性。但现在我有了新的直觉——并且多亏了
    [Wolfram Language](https://www.wolfram.com/language/)，拥有了强大得多的工具。这里呈现的成果正是我在此方面努力的结果。


    当然，这只是个开始。但我非常激动，能够看到我认为是机器学习基础科学开端的东西。已经有了明确的实际应用方向（不必说，我计划深入探索这些方向）。并且有迹象表明，我们或许最终能够理解机器学习的“魔力”究竟为何——以及在何时——奏效。


    ## 致谢


    感谢 [Wolfram Institute](https://www.wolframinstitute.org/) 的 Richard Assar 提供的大量帮助。还要感谢
    Brad Klee、Tianyi Gu、Nik Murzin 和 Max Niederman 提供的具体成果，感谢 [Symbolica](https://www.symbolica.ai/)
    的 George Morgan 及其他人员的早期关注，以及感谢 Kovas Boguta 多年前建议将机器学习与《新科学》中的思想联系起来。


    '
