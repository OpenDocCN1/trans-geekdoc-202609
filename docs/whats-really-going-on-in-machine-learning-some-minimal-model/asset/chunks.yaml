- raw: 'And here is a table of “Boolean derivatives” for all 2-input Boolean functions:


    ![](image_rsrc147.jpg)


    And indeed there’s a whole “Boolean calculus” one can set up for these kinds of
    derivatives. And in particular, there’s a direct analog of the chain rule:


    ![](image_rsrc148.jpg)


    where [Xnor](http://reference.wolfram.com/language/ref/Xnor.html)\[x,y\] is effectively
    the equality test x == y:


    ![](image_rsrc149.jpg)


    But, OK, how do we use this to create our change maps? In our simple cellular
    automaton case, we can think of our change map as representing how a [change in
    an output cell “propagates back”](https://www.wolframscience.com/nks/p604--cryptography-and-cryptanalysis/)
    to previous cells. But if we just try to apply our discrete calculus rules we
    run into a problem: different “chain rule chains” can imply different changes
    in the value of the same cell. In the continuous case this path dependence doesn’t
    happen because of the way infinitesimals work. But in the discrete case it does.
    And ultimately we’re doing a kind of backtracking that can really be represented
    faithfully only as a multiway system. (Though if we just want probabilities, for
    example, we can consider [averaging over branches of the multiway system](https://www.wolframphysics.org/bulletins/2021/02/multiway-turing-machines/)—and
    the change maps we showed above are effectively the result of thresholding over
    the multiway system.)


    But despite the appearance of such difficulties in the “simple” cellular automaton
    case, such methods typically seem to work better in our original, more complicated
    rule array case. There’s a bunch of subtlety associated with the fact that we’re
    finding derivatives not only with respect to the values in the rule array, but
    also with respect to the choice of rules (which are the analog of weights in the
    continuous case).


    Let’s consider the And+Xor rule array:


    ![](image_rsrc14A.jpg)


    Our loss is the number of cells whose values disagree with the row shown at the
    bottom. Now we can construct a change map for this rule array both in a direct
    “forward” way, and “backwards” using our discrete derivative methods (where we
    effectively resolve the small amount of “multiway behavior” by always picking
    “majority” values):


    ![](image_rsrc14B.jpg)


    The results are similar, though in this case not exactly the same. Here are a
    few other examples:


    ![](image_rsrc14C.jpg)


    And, yes, in detail there are essentially always local differences between the
    results from the forward and backward methods. But the backward method—like in
    the case of backpropagation in ordinary neural nets—can be implemented much more
    efficiently. And for purposes of practical machine learning it’s actually likely
    to be perfectly satisfactory—especially given that the forward method is itself
    only providing an approximation to the question of which mutations are best to
    do.


    And as an example, here are the results of the forward and backward methods for
    the problem of learning the function f\[x\] = ![](image_rsrc14D.jpg), for the
    “breakthrough” configurations that we showed above:


    ![](image_rsrc14E.jpg)


    ## What Can Be Learned?


    We’ve now shown quite a few examples of machine learning in action. But a fundamental
    question we haven’t yet addressed is what kind of thing can actually be learned
    by machine learning. And even before we get to this, there’s another question:
    given a particular underlying type of system, what kinds of functions can it even
    represent?


    As a first example consider a minimal neural net of the form (essentially a single-layer
    perceptron):


    ![](image_rsrc14F.jpg)


    With ReLU (AKA [Ramp](http://reference.wolfram.com/language/ref/Ramp.html)) as
    the activation function and the first set of weights all taken to be 1, the function
    computed by such a neural net has the form:


    ![](image_rsrc14G.jpg)


    With enough weights and biases this form can represent any piecewise linear function—essentially
    just by moving around ramps using biases, and scaling them using weights. So for
    example consider the function:


    ![](image_rsrc14H.jpg)


    This is the function computed by the neural net above—and here’s how it’s built
    up by adding in successive ramps associated with the individual intermediate nodes
    (neurons):


    ![](image_rsrc14J.jpg)


    (It’s similarly possible to get all smooth functions from activation functions
    like ELU, etc.)


    Things get slightly more complicated if we try to represent functions with more
    than one argument. With a single intermediate layer we can only get “piecewise
    (hyper)planar” functions (i.e. functions that change direction only at linear
    “fault lines”):


    ![](image_rsrc14K.jpg)


    But already with a total of two intermediate layers—and sufficiently many nodes
    in each of these layers—we can generate any piecewise function of any number of
    arguments.


    If we limit the number of nodes, then roughly we limit the number of boundaries
    between different linear regions in the values of the functions. But as we increase
    the number of layers with a given number of nodes, we basically increase the number
    of sides that polygonal regions within the function values can have:


    ![](image_rsrc14M.jpg)


    So what happens with the mesh nets that we discussed earlier? Here are a few random
    examples, showing results very similar to shallow, fully connected networks with
    a comparable total number of nodes:


    ![](image_rsrc14N.jpg)


    OK, so how about our fully discrete rule arrays? What functions can they represent?
    We already saw part of the answer earlier when we generated rule arrays to represent
    various Boolean functions. It turns out that there is a fairly efficient procedure
    based on [Boolean satisfiability](https://reference.wolfram.com/language/ref/SatisfiabilityInstances.html)
    for explicitly finding rule arrays that can represent a given function—or determine
    that no rule array (say of a given size) can do this.


    Using this procedure, we can find minimal And+Xor rule arrays that represent all
    (“even”) 3-input Boolean functions (i.e. r = 1 cellular automaton rules):


    ![](image_rsrc14P.jpg)


    It’s always possible to specify any n\-input Boolean function by an array of 2n
    bits, as in:


    ![](image_rsrc14R.jpg)


    But we see from the pictures above that when we “compile” Boolean functions into
    And+Xor rule arrays, they can take different numbers of bits (i.e. different numbers
    of elements in the rule array). (In effect, the “algorithmic information content”
    of the function varies with the “language” we’re using to represent them.) And,
    for example, in the n \= 3 case shown here, the distribution of minimal rule array
    sizes is:


    ![](image_rsrc14S.jpg)


    There are some functions that are difficult to represent as And+Xor rule arrays
    (and seem to require 15 rule elements)—and others that are easier. And this is
    similar to what happens if we represent Boolean functions as Boolean expressions
    (say in conjunctive normal form) and [count the total number of (unary and binary)
    operations used](https://www.wolframscience.com/nks/notes-10-11--boolean-formula-sizes/):


    ![](image_rsrc14T.jpg)


    OK, so we know that there is in principle an And+Xor rule array that will compute
    any (even) Boolean function. But now we can ask whether an adaptive evolution
    process can actually find such a rule array—say with a sequence of single-point
    mutations. Well, if we do such adaptive evolution—with a loss that counts the
    number of “wrong outputs” for, say, rule 254—then here’s a sequence of successive
    breakthrough configurations that can be produced:


    ![](image_rsrc14U.jpg)


    The results aren’t as compact as the minimal solution above. But it seems to always
    be possible to find at least some And+Xor rule array that “solves the problem”
    just by using adaptive evolution with single-point mutations.


    Here are results for some other Boolean functions:


    ![](image_rsrc14V.jpg)'
