- raw: 'So how is the neural net ultimately put together? How are these values that
    we’re plotting determined? We’re using the [standard setup for a fully connected
    multilayer network](https://writings.stephenwolfram.com/2023/02/what-is-chatgpt-doing-and-why-does-it-work/#neural-nets).
    Each node (“neuron”) on each layer is connected to all nodes on the layer above—and
    values “flow” down from one layer to the next, being multiplied by the (positive
    or negative) “weight” (indicated by color in our pictures) associated with the
    connection through which they flow. The value of a given neuron is found by totaling
    up all its (weighted) inputs from the layer before, adding a “bias” value for
    that neuron, and then applying to the result a certain (nonlinear) “[activation
    function](https://reference.wolfram.com/language/ref/ElementwiseLayer.html)” (here
    ReLU or [Ramp](http://reference.wolfram.com/language/ref/Ramp.html)\[z\], i.e.
    [If](http://reference.wolfram.com/language/ref/If.html)\[z < 0, 0, z\]).


    What overall function a given neural net will compute is determined by the collection
    of weights and biases that appear in the neural net (along with its overall connection
    architecture, and the activation function it’s using). The idea of machine learning
    is to find weights and biases that produce a particular function by adaptively
    “learning” from examples of that function. Typically we might start from a random
    collection of weights, then successively tweak weights and biases to [“train”
    the neural net](https://reference.wolfram.com/language/ref/NetTrain.html) to reproduce
    the function:


    ![](image_rsrc111.jpg)


    We can get a sense of how this progresses (and, yes, it’s complicated) by plotting
    successive changes in individual weights over the course of the training process
    (the spikes near the end come from “neutral changes” that don’t affect the overall
    behavior):


    ![](image_rsrc112.jpg)


    The overall objective in the training is progressively to decrease [the “loss”](https://reference.wolfram.com/language/ref/LossFunction.html)—the
    average (squared) difference between true values of f\[x\] and those generated
    by the neural net. The evolution of the loss defines a “learning curve” for the
    neural net, with the downward glitches corresponding to points where the neural
    net in effect “made a breakthrough” in being able to represent the function better:


    ![](image_rsrc113.jpg)


    It’s important to note that typically there’s randomness injected into neural
    net training. So if one runs the training multiple times, one will get different
    networks—and different learning curves—every time:


    ![](image_rsrc114.jpg)![](image_rsrc115.jpg)


    But what’s really going on in neural net training? Effectively we’re finding a
    way to “compile” a function (at least to some approximation) into a neural net
    with a certain number of (real-valued) parameters. And in the example here we
    happen to be using about 100 parameters.


    But what happens if we use a different number of parameters, or set up the architecture
    of our neural net differently? Here are a few examples, indicating that for the
    function we’re trying to generate, the network we’ve been using so far is pretty
    much the smallest that will work:


    ![](image_rsrc116.jpg)


    And, by the way, here’s what happens if we change our activation function from
    ReLU ![](image_rsrc117.jpg)to the smoother ELU ![](image_rsrc118.jpg):


    ![](image_rsrc119.jpg)


    Later we’ll talk about what happens when we do machine learning with discrete
    systems. And in anticipation of that, it’s interesting to see what happens if
    we take a neural net of the kind we’ve discussed here, and “quantize” its weights
    (and biases) in discrete levels:


    ![](image_rsrc11A.jpg)


    The result is that (as recent experience with large-scale neural nets has also
    shown) the basic “operation” of the neural net does not require precise real numbers,
    but survives even when the numbers are at least somewhat discrete—as this 3D rendering
    as a function of the discreteness level δ also indicates:


    ![](image_rsrc11B.jpg)


    ## Simplifying the Topology: Mesh Neural Nets


    So far we’ve been discussing very traditional neural nets. But to do machine learning,
    do we really need systems that have all those details? For example, do we really
    need every neuron on each layer to get an input from every neuron on the previous
    layer? What happens if instead every neuron just gets input from at most two others—say
    with the neurons effectively laid out in a simple mesh? Quite surprisingly, it
    turns out that such a network is still perfectly able to generate a function like
    the one we’ve been using as an example:


    ![](image_rsrc11C.jpg)


    And one advantage of such a “mesh neural net” is that—like a cellular automaton—its
    “internal behavior” can readily be visualized in a rather direct way. So, for
    example, here are visualizations of “how the mesh net generates its output”, stepping
    through different input values x:


    ![](image_rsrc11D.jpg)


    And, yes, even though we can visualize it, it’s still hard to understand “what’s
    going on inside”. Looking at the intermediate values of each individual node in
    the network as a function of x doesn’t help much, though we can “see something
    happening” at places where our function f\[x\] has jumps:


    ![](image_rsrc11E.jpg)


    So how do we train a mesh neural net? Basically we can use the same procedure
    as for a fully connected network of the kind we saw above (ReLU activation functions
    don’t seem to work well for mesh nets, so we’re using ELU here):


    ![](image_rsrc11F.jpg)


    Here’s the evolution of differences in each individual weight during the training
    process:


    ![](image_rsrc11G.jpg)


    And here are results for different random seeds:


    ![](image_rsrc11H.jpg)![](image_rsrc11J.jpg)


    At the size we’re using, our mesh neural nets have about the same number of connections
    (and thus weights) as our main example of a fully connected network above. And
    we see that if we try to reduce the size of our mesh neural net, it doesn’t do
    well at reproducing our function:


    ![](image_rsrc11K.jpg)


    ## Making Everything Discrete: A Biological Evolution Analog


    Mesh neural nets simplify the topology of neural net connections. But, somewhat
    surprisingly at first, it seems as if we can go much further in simplifying the
    systems we’re using—and still successfully do versions of machine learning. And
    in particular we’ll find that we can make our systems completely discrete.


    The typical methodology of neural net training involves progressively tweaking
    real-valued parameters, usually using methods based on calculus, and on finding
    derivatives. And one might imagine that any successful adaptive process would
    ultimately have to rely on being able to make arbitrarily small changes, of the
    kind that are possible with real-valued parameters.


    But in [studying simple idealizations of biological evolution](https://writings.stephenwolfram.com/2024/05/why-does-biological-evolution-work-a-minimal-model-for-biological-evolution-and-other-adaptive-processes/)
    I recently found striking examples where this isn’t the case—and where completely
    discrete systems seemed able to capture the essence of what’s going on.


    As an example consider a (3-color) cellular automaton. The rule is shown on the
    left, and the behavior one generates by repeatedly applying that rule (starting
    from a single-cell initial condition) is shown on the right:


    ![](image_rsrc11M.jpg)'
  fmt: '

    神经网络究竟是如何组装的？我们绘制的这些数值是如何确定的？我们采用的是[标准的全连接多层网络设置](https://writings.stephenwolfram.com/2023/02/what-is-chatgpt-doing-and-why-does-it-work/#neural-nets)。每一层的每个节点（“神经元”）都与上一层的所有节点相连——数值从一层“流向”下一层，在流经连接时乘以该连接关联的（正或负）“权重”（在图中用颜色表示）。给定神经元的值是通过汇总其来自上一层的所有（加权）输入、加上该神经元的“偏置”值，然后对结果应用特定的（非线性）“[激活函数](https://reference.wolfram.com/language/ref/ElementwiseLayer.html)”（此处为
    ReLU 或 [Ramp](http://reference.wolfram.com/language/ref/Ramp.html)\[z\]，即 [If](http://reference.wolfram.com/language/ref/If.html)\[z
    < 0, 0, z\]）来求得的。


    给定神经网络将计算的整体函数，取决于网络中出现的权重和偏置的集合（以及其整体连接架构和所用的激活函数）。机器学习的思路是通过从该函数的示例中自适应地“学习”，来寻找能产生特定函数的权重和偏置。通常我们可能从随机的权重集合开始，然后逐步调整权重和偏置以[“训练”神经网络](https://reference.wolfram.com/language/ref/NetTrain.html)复现该函数：


    ![](image_rsrc111.jpg)


    我们可以通过绘制训练过程中单个权重的连续变化来了解这一过程是如何进行的（是的，这很复杂；末尾附近的尖峰来自不影响整体行为的“中性变化”）：


    ![](image_rsrc112.jpg)


    训练的总体目标是逐步降低[“损失”](https://reference.wolfram.com/language/ref/LossFunction.html)——即真实值
    `f[x]` 与神经网络生成值之间的平均（平方）差。损失的演变定义了神经网络的“学习曲线”，其中的向下故障对应于神经网络实际上“取得突破”、能够更好地表征函数的时刻：


    ![](image_rsrc113.jpg)


