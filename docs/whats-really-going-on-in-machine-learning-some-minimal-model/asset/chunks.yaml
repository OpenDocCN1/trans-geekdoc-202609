    # What’s Really Going On in Machine Learning? Some Minimal Models


    **Stephen Wolfram**


    ---


    ## The Mystery of Machine Learning


    It’s surprising how little is known about the foundations of machine learning.
    Yes, from an engineering point of view, an immense amount has been figured out
    about how to build neural nets that do all kinds of impressive and [sometimes
    almost magical things](https://writings.stephenwolfram.com/2023/02/what-is-chatgpt-doing-and-why-does-it-work/).
    But at a fundamental level we still don’t really know why neural nets “work”—and
    we don’t have any kind of “scientific big picture” of what’s going on inside them.


    The basic structure of neural networks can be pretty simple. But by the time they’re
    trained up with all their weights, etc. it’s been hard to tell what’s going on—or
    even to get any good visualization of it. And indeed it’s far from clear even
    what aspects of the whole setup are actually essential, and what are just “details”
    that have perhaps been “grandfathered” all the way from when computational neural
    nets were first invented in the 1940s.


    Well, what I’m going to try to do here is to get “underneath” this—and to “strip
    things down” as much as possible. I’m going to explore some very minimal models—that,
    among other things, are more directly amenable to visualization. At the outset,
    I wasn’t at all sure that these minimal models would be able to reproduce any
    of the kinds of things we see in machine learning. But, rather surprisingly, it
    seems they can.


    And the simplicity of their construction makes it much easier to “see inside them”—and
    to get more of a sense of what essential phenomena actually underlie machine learning.
    One might have imagined that even though the training of a machine learning system
    might be circuitous, somehow in the end the system would do what it does through
    some kind of identifiable and “explainable” mechanism. But we’ll see that in fact
    that’s typically not at all what happens.


    Instead it looks much more as if the training manages to home in on some quite
    wild computation that “just happens to achieve the right results”. Machine learning,
    it seems, isn’t building structured mechanisms; rather, it’s basically just sampling
    from the typical complexity one sees in the computational universe, picking out
    pieces whose behavior turns out to overlap what’s needed. And in a sense, therefore,
    the possibility of machine learning is ultimately yet another consequence of the
    phenomenon of [computational irreducibility](https://www.wolframscience.com/nks/chap-12--the-principle-of-computational-equivalence#sect-12-6--computational-irreducibility).


    Why is that? Well, it’s only because of computational irreducibility that there’s
    all that richness in the computational universe. And, more than that, it’s because
    of computational irreducibility that things end up being effectively random enough
    that the adaptive process of training a machine learning system can reach success
    without getting stuck.


    But the presence of computational irreducibility also has another important implication:
    that even though we can expect to find limited pockets of computational reducibility,
    we can’t expect a “general narrative explanation” of what a machine learning system
    does. In other words, there won’t be a traditional (say, mathematical) “general
    science” of machine learning (or, for that matter, probably also neuroscience).
    Instead, the story will be much closer to the fundamentally computational “[new
    kind of science](https://www.wolframscience.com/nks/)” that I’ve explored for
    so long, and that has brought us our [Physics Project](https://www.wolframphysics.org/)
    and [the ruliad](https://writings.stephenwolfram.com/2021/11/the-concept-of-the-ruliad/).


    In many ways, the problem of machine learning is a version of the [general problem
    of adaptive evolution](https://writings.stephenwolfram.com/2024/05/why-does-biological-evolution-work-a-minimal-model-for-biological-evolution-and-other-adaptive-processes/),
    as encountered [for example in biology](https://writings.stephenwolfram.com/2024/05/why-does-biological-evolution-work-a-minimal-model-for-biological-evolution-and-other-adaptive-processes/).
    In biology we typically imagine that we want to adaptively optimize some overall
    “fitness” of a system; in machine learning we typically try to adaptively “train”
    a system to make it align with certain goals or behaviors, most often defined
    by examples. (And, yes, in practice this is often done by trying to minimize a
    quantity normally called the “loss”.)


    And while in biology there’s a general sense that “things arise through evolution”,
    quite how this works has always been rather mysterious. But (rather to my surprise)
    I recently [found a very simple model](https://writings.stephenwolfram.com/2024/05/why-does-biological-evolution-work-a-minimal-model-for-biological-evolution-and-other-adaptive-processes/)
    that seems to do well at capturing at least some of the most essential features
    of biological evolution. And while the model isn’t the same as what we’ll explore
    here for machine learning, it has some definite similarities. And in the end we’ll
    find that the core phenomena of machine learning and of biological evolution appear
    to be remarkably aligned—and both fundamentally connected to the phenomenon of
    computational irreducibility.


    Most of what I’ll do here focuses on foundational, theoretical questions. But
    in understanding more about what’s really going on in machine learning—and what’s
    essential and what’s not—we’ll also be able to begin to see how in practice machine
    learning might be done differently, potentially with more efficiency and more
    generality.


    ## Traditional Neural Nets


    To begin the process of understanding the essence of machine learning, let’s start
    from a very traditional—and familiar—example: a [fully connected (“multilayer
    perceptron”) neural net](https://writings.stephenwolfram.com/2023/02/what-is-chatgpt-doing-and-why-does-it-work/#machine-learning-and-the-training-of-neural-nets)
    that’s been trained to compute a certain function `f[x]`:


    ![](image_rsrc10X.jpg)


    If one gives a value `x` as input at the top, then after “rippling through the
    layers of the network” one gets a value at the bottom that (almost exactly) corresponds
    to our function `f[x]`:


    ![](image_rsrc10Y.jpg)


    Scanning through different inputs `x`, we see different patterns of intermediate
    values inside the network:


    ![](image_rsrc10Z.jpg)


    And here’s (on a linear and log scale) how each of these intermediate values changes
    with `x`. And, yes, the way the final value (highlighted here) emerges looks very
    complicated:


    ![](image_rsrc110.jpg)

    '
