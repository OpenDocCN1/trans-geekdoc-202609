    不仅所有（偶）布尔函数都可以用 And+Xor 规则数组表示，而且它们在这种形式下也是可学习的，仅通过带有单点突变的自适应进化即可实现。


    在上述过程中，我们探讨了机器学习如何在特定情况下（如 ![](image_rsrc14W.jpg) 函数）与规则数组配合工作。但现在我们遇到了一种可以显式枚举给定类别中所有可能函数的情况。从某种意义上说，我们看到的证据表明机器学习往往具有很强的普适性——至少在原则上能够学习几乎任何函数。


    当然，可能存在特定的限制。例如，此处使用的 And+Xor 规则数组无法表示 ![](image_rsrc14X.jpg) 的（“奇”）函数。（我们上面讨论的
    [Nand](https://reference.wolfram.com/language/ref/Nand.html)+[First](https://reference.wolfram.com/language/ref/First.html)
    规则数组则可以。）但总的来说，这似乎反映了[计算等价原理](https://www.wolframscience.com/nks/chap-12--the-principle-of-computational-equivalence/)，即几乎任何设置都能表示任何函数——并且也能自适应地“学习”它。


    顺便说一句，当处理离散（可数）函数时，讨论表示或学习“任意函数”的问题要容易得多——因为人们可以预期要么能“精确得到”给定函数，要么不能。但对于连续函数，情况更复杂，因为人们几乎不可避免地要处理近似值（除非能使用符号形式，而符号形式本质上是离散的）。因此，例如，虽然我们可以说（如上所述）（ReLU）神经网络可以表示任何分段线性函数，但通常我们只能想象逐步逼近任意函数，这很像在简单傅里叶级数中逐步添加更多项：


    ![](image_rsrc14Y.jpg)


    回顾我们对离散规则数组的结果，一个显著的观察是：虽然我们可以成功复现所有这些不同的布尔函数，但实现这一点的实际规则数组配置往往看起来相当混乱。确实，这与我们始终看到的情况非常相似：机器学习可以找到解决方案，但它们不是“结构化的解决方案”；实际上它们只是“碰巧奏效”的解决方案。


    是否有更结构化的方法用规则数组表示布尔函数？以下是表示规则 30 的两个可能的最小尺寸 And+Xor 规则数组：


    ![](image_rsrc14Z.jpg)


    在下一个更大的尺寸下，规则 30 有更多可能性：


    ![](image_rsrc150.jpg)


    也存在可以表示规则 110 的规则数组：


    ![](image_rsrc151.jpg)


    但在所有这些情况下，都没有明显的结构让我们能立即看出这些计算是如何工作的，或者正在计算什么函数。但如果我们尝试显式构建——实际上通过标准工程方法——一个计算特定函数的规则数组会怎样？我们可以从获取类似规则
    30 的函数开始，并用 And 和 Xor 来表示它（即用 [ANF，或“代数标准形式”](https://reference.wolfram.com/language/ref/BooleanConvert.html)）：


    ![](image_rsrc152.jpg)


    我们可以想象使用“求值图”来实现这一点：


    ![](image_rsrc153.jpg)


    但现在将其转换为规则数组很容易（是的，我们还没有完全安排好复制输入等）：


    ![](image_rsrc154.jpg)


    对不同输入“求值”这个规则数组，我们可以看到它确实给出了规则 30：


    ![](image_rsrc155.jpg)


