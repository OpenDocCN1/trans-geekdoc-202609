- raw: 'In doing machine learning in practice, the goal is typically to find some
    collection of weights, etc. that successfully solve a particular problem. But
    in general there will be many such collections of weights, etc. With typical continuous
    weights and random training steps it’s very difficult to see what the whole “ensemble”
    of possibilities is. But in our discrete rule array systems, this becomes more
    feasible.


    Consider a tiny 2×2 rule array with two possible rules. We can [make a graph whose
    edges represent all possible “point mutations”](https://writings.stephenwolfram.com/2024/05/why-does-biological-evolution-work-a-minimal-model-for-biological-evolution-and-other-adaptive-processes/#the-multiway-graph-of-all-possible-mutation-histories)
    that can occur in this rule array:


    ![](image_rsrc131.jpg)


    In our adaptive evolution process, we’re always moving around a graph like this.
    But typically most “moves” will end up in states that are rejected because they
    increase whatever loss we’ve defined.


    Consider the problem of generating an And+Xor rule array in which we end with
    lifetime-4 patterns. Defining the loss as how far we are from this lifetime, we
    can draw a graph that shows all possible adaptive evolution paths that always
    progressively decrease the loss:


    ![](image_rsrc132.jpg)


    The result is a multiway graph of the type we’ve now seen in a [great many kinds
    of situations](https://writings.stephenwolfram.com/2023/11/aggregation-and-tiling-as-multicomputational-processes/)—notably
    our [recent study of biological evolution](https://writings.stephenwolfram.com/2024/05/why-does-biological-evolution-work-a-minimal-model-for-biological-evolution-and-other-adaptive-processes/#the-multiway-graph-of-all-possible-mutation-histories).


    And although this particular example is quite trivial, the idea in general is
    that different parts of such a graph represent “different strategies” for solving
    a problem. And—in direct analogy to our [Physics Project](https://www.wolframphysics.org/)
    and [our studies of things like game graphs](https://writings.stephenwolfram.com/2022/06/games-and-puzzles-as-multicomputational-systems/)—one
    can imagine such strategies being laid out in a “[branchial space](https://www.wolframphysics.org/technical-introduction/the-updating-process-for-string-substitution-systems/the-concept-of-branchial-graphs/)”
    defined by common ancestry of configurations in the multiway graph.


    And one can expect that while in some cases the branchial graph will be fairly
    uniform, in other cases it will have quite separated pieces—that represent fundamentally
    different strategies. Of course, the fact that underlying strategies may be different
    doesn’t mean that the overall behavior or performance of the system will be noticeably
    different. And indeed one expects that in most cases computational irreducibility
    will lead to enough effective randomness that there’ll be no discernable difference.


    But in any case, here’s an example starting with a rule array that contains both
    And and Xor—where we observe distinct branches of adaptive evolution that lead
    to different solutions to the problem of finding a configuration with a lifetime
    of exactly 4:


    ![](image_rsrc133.jpg)


    ## Optimizing the Learning Process


    How should one actually do the learning in machine learning? In practical work
    with traditional neural nets, learning is normally done using systematic algorithmic
    methods like backpropagation. But so far, all we’ve done here is something much
    simpler: we’ve “learned” by successively making random point mutations, and keeping
    only ones that don’t lead us further from our goal. And, yes, it’s interesting
    that such a procedure can work at all—and ([as we’ve discussed elsewhere](https://writings.stephenwolfram.com/2024/05/why-does-biological-evolution-work-a-minimal-model-for-biological-evolution-and-other-adaptive-processes/))
    this is presumably very relevant to understanding phenomena like biological evolution.
    But, as we’ll see, there are more efficient (and probably much more efficient)
    methods of doing machine learning, even for the kinds of discrete systems we’re
    studying.


    Let’s start by looking again at our earlier example of finding an And+Xor rule
    array that gives a “lifetime” of exactly 30. At each step in our adaptive (“learning”)
    process we make a single-point mutation (changing a single rule in the rule array),
    keeping the mutation if it doesn’t take us further from our goal. The mutations
    gradually accumulate—every so often reaching a rule array that gives a lifetime
    closer to 30. Just as above, here’s a plot of the lifetime achieved by successive
    mutations—with the “internal” red dots corresponding to rejected mutations:


    ![](image_rsrc134.jpg)


    We see a series of “plateaus” at which mutations are accumulating but not changing
    the overall lifetime. And between these we see occasional “breakthroughs” where
    the lifetime jumps. Here are the actual rule array configurations for these breakthroughs,
    with mutations since the last breakthrough highlighted:


    ![](image_rsrc135.jpg)


    But in the end the process here is quite wasteful; in this example, we make a
    total of 1705 mutations, but only 780 of them actually contribute to generating
    the final rule array; all the others are discarded along the way.


    So how can we do better? One strategy is to try to figure out at each step which
    mutation is “most likely to make a difference”. And one way to do this is to try
    every possible mutation in turn at every step (as in multiway evolution)—and see
    what effect each of them has on the ultimate lifetime. From this we can construct
    a “change map” in which we give the change of lifetime associated with a mutation
    at every particular cell. The results will be different for every configuration
    of rule array, i.e. at every step in the adaptive evolution. But for example here’s
    what they are for the particular “breakthrough” configurations shown above (elements
    in regions that are colored gray won’t affect the result if they are changed;
    ones colored red will have a positive effect (with more intense red being more
    positive), and ones colored blue a negative one:


    ![](image_rsrc136.jpg)


    Let’s say we start from a random rule array, then repeatedly construct the change
    map and apply the mutation that it implies gives the most positive change—in effect
    at each step following the “path of steepest descent” to get to the lifetime we
    want (i.e. reduce the loss). Then the sequence of “breakthrough” configurations
    we get is:


    ![](image_rsrc137.jpg)


    And this in effect corresponds to a slightly more direct “path to a solution”
    than our sequence of pure single-point mutations.


    By the way, the particular problem of reaching a certain lifetime has a simple
    enough structure that this “steepest descent” method—when started from a simple
    uniform rule array—finds a very “mechanical” (if slow) path to a solution:


    ![](image_rsrc138.jpg)


    What about the problem of learning f\[x\] = ![](image_rsrc139.jpg)? Once again
    we can make a change map based on the loss we define. Here are the results for
    a sequence of “breakthrough” configurations. The gray regions are ones where changes
    will be “neutral”, so that there’s still exploration that can be done without
    affecting the loss. The red regions are ones that are in effect “locked in” and
    where any changes would be deleterious in terms of loss:


    ![](image_rsrc13A.jpg)'
