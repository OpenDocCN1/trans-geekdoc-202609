- raw: 'But then, a few months ago, as part of an [effort to understand the relation
    between what science does and what AI does](https://writings.stephenwolfram.com/2024/03/can-ai-solve-science/),
    I tried a kind of [“throwaway experiment”](https://writings.stephenwolfram.com/2024/03/can-ai-solve-science/#exploring-spaces-of-systems)—which,
    to my considerable surprise, seemed to successfully capture some of the essence
    of what [makes biological evolution possible](https://writings.stephenwolfram.com/2024/05/why-does-biological-evolution-work-a-minimal-model-for-biological-evolution-and-other-adaptive-processes/).
    But what about other adaptive evolution—and in particular, machine learning? The
    models that seemed to be needed were embarrassingly close to [what I’d studied
    in 1985](https://content.wolfram.com/sw-publications/2020/07/approaches-complexity-engineering.pdf).
    But now I had a new intuition—and, thanks to [Wolfram Language](https://www.wolfram.com/language/),
    vastly better tools. And the result has been my effort here.


    Of course this is only a beginning. But I’m excited to be able to see what I consider
    to be the beginnings of foundational science around machine learning. Already
    there are clear directions for practical applications (which, needless to say,
    I plan to explore). And there are signs that perhaps we may finally be able to
    understand just why—and when—the “magic” of machine learning works.


    ## Thanks


    Thanks to Richard Assar of the [Wolfram Institute](https://www.wolframinstitute.org/)
    for extensive help. Thanks also to Brad Klee, Tianyi Gu, Nik Murzin and Max Niederman
    for specific results, to George Morgan and others at [Symbolica](https://www.symbolica.ai/)
    for their early interest, and to Kovas Boguta for suggesting many years ago to
    link machine learning to the ideas in A New Kind of Science.'
