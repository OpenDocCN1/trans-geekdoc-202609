- raw: 'The rule has the property that the pattern it generates (from a single-cell
    initial condition) survives for exactly 40 steps, and then dies out (i.e. every
    cell becomes white). And the important point is that this rule can be found by
    a discrete adaptive process. The idea is to start, say, from a null rule, and
    then at each step to randomly change a single outcome out of the 27 in the rule
    (i.e. make a “single-point mutation” in the rule). Most such changes will cause
    the “lifetime” of the pattern to get further from our target of 40—and these we
    discard. But gradually we can build up “beneficial mutations”


    ![](image_rsrc11N.jpg)


    that through “progressive adaptation” eventually get to our original lifetime-40
    rule:


    ![](image_rsrc11P.jpg)


    We can make a plot of all the attempts we made that eventually let us reach lifetime
    40—and we can think of this progressive “fitness” curve as being directly analogous
    to the loss curves in machine learning that we saw before:


    ![](image_rsrc11R.jpg)


    If we make different sequences of random mutations, we’ll get different paths
    of adaptive evolution, and different “solutions” for rules that have lifetime
    40:


    ![](image_rsrc11S.jpg)


    Two things are immediately notable about these. First, that they essentially all
    seem to be “using different ideas” to reach their goal (presumably analogous to
    the phenomenon of different branches in the tree of life). And second, that none
    of them seem to be using a clear “mechanical procedure” (of the kind we might
    construct through traditional engineering) to reach their goal. Instead, they
    seem to be finding “natural” complicated behavior that just “happens” to achieve
    the goal.


    It’s nontrivial, of course, that this behavior can achieve a goal like the one
    we’ve set here, as well as that simple selection based on random point mutations
    can successfully reach the necessary behavior. But [as I discussed in connection
    with biological evolution](https://writings.stephenwolfram.com/2024/05/why-does-biological-evolution-work-a-minimal-model-for-biological-evolution-and-other-adaptive-processes/),
    this is ultimately a story of [computational irreducibility](https://www.wolframscience.com/nks/chap-12--the-principle-of-computational-equivalence#sect-12-6--computational-irreducibility)—particularly
    in generating diversity both in behavior, and in the paths necessary to reach
    it.


    But, OK, so how does this model of adaptive evolution relate to systems like neural
    nets? In the standard language of neural nets, our model is like a discrete analog
    of a recurrent convolutional network. It’s “convolutional” because at any given
    step the same rule is applied—locally—throughout an array of elements. It’s “recurrent”
    because in effect data is repeatedly “passed through” the same rule. The kinds
    of procedures (like “backpropagation”) typically used to train traditional neural
    nets wouldn’t be able to train such a system. But it turns out that—essentially
    as a consequence of computational irreducibility—the very simple method of successive
    random mutation can be successful.


    ## Machine Learning in Discrete Rule Arrays


    Let’s say we want to set up a system like a neural net—or at least a mesh neural
    net—but we want it to be completely discrete. (And I mean “born discrete”, not
    just discretized from an existing continuous system.) How can we do this? One
    approach (that, as it happens, [I first considered in the mid-1980s](https://content.wolfram.com/sw-publications/2020/07/approaches-complexity-engineering.pdf)—but
    never seriously explored) is to make what we can call a “rule array”. Like in
    a cellular automaton there’s an array of cells. But instead of these cells always
    being updated according to the same rule, each cell at each place in the cellular
    automaton analog of “spacetime” can make a different choice of what rule it will
    use. (And although it’s a fairly extreme idealization, we can potentially imagine
    that these different rules represent a discrete analog of different local choices
    of weights in a mesh neural net.)


    As a first example, let’s consider a rule array in which there are two possible
    choices of rules: k \= 2, r \= 1 [cellular automaton rules 4 and 146](https://www.wolframscience.com/nks/chap-3--the-world-of-simple-programs#sect-3-2--more-cellular-automata)
    (which are respectively [class 2 and class 3](https://www.wolframscience.com/nks/chap-6--starting-from-randomness#sect-6-2--four-classes-of-behavior)):


    ![](image_rsrc11T.jpg)


    A particular rule array is defined by which of these rules is going to be used
    at each (“spacetime”) position in the array. Here are a few examples. In all cases
    we’re starting from the same single-cell initial condition. But in each case the
    rule array has a different arrangement of rule choices—with cells “running” rule
    4 being given a ![](image_rsrc11U.jpg)background, and those running rule 146 a
    ![](image_rsrc11V.jpg)one:


    ![](image_rsrc11W.jpg)


    We can see that different choices of rule array can yield very different behaviors.
    But (in the spirit of machine learning) can we in effect “invert this”, and find
    a rule array that will give some particular behavior we want?


    A simple approach is to do the direct analog of what we did in our minimal modeling
    of biological evolution: progressively make random “single-point mutations”—here
    “flipping” the identity of just one rule in the rule array—and then keeping only
    those mutations that don’t make things worse.


    As our sample objective, let’s ask to find a rule array that makes the pattern
    generated from a single cell using that rule array “survive” for exactly 50 steps.
    At first it might not be obvious that we’d be able to find such a rule array.
    But in fact our simple adaptive procedure easily manages to do this:


    ![](image_rsrc11X.jpg)


    As the dots here indicate, many mutations don’t lead to longer lifetimes. But
    every so often, the adaptive process has a “breakthrough” that increases the lifetime—eventually
    reaching 50:


    ![](image_rsrc11Y.jpg)


    Just as in our model of biological evolution, different random sequences of mutations
    lead to different “solutions”, here to the problem of “living for exactly 50 steps”:


    ![](image_rsrc11Z.jpg)


    Some of these are in effect “simple solutions” that require only a few mutations.
    But most—like most of our examples in biological evolution—seem more as if they
    just “happen to work”, effectively by tapping into just the right, fairly complex
    behavior.


    Is there a sharp distinction between these cases? Looking at the collection of
    “fitness” (AKA “learning”) curves for the examples above, it doesn’t seem so:


    ![](image_rsrc120.jpg)


    It’s not too difficult to see how to “construct a simple solution” just by strategically
    placing a single instance of the second rule in the rule array:


    ![](image_rsrc121.jpg)


    But the point is that adaptive evolution by repeated mutation normally won’t “discover”
    this simple solution. And what’s significant is that the adaptive evolution can
    nevertheless still successfully find some solution—even though it’s not one that’s
    “understandable” like this.


    The cellular automaton rules we’ve been using so far take 3 inputs. But it turns
    out that we can make things even simpler by just putting ordinary [2-input Boolean
    functions](https://www.wolframscience.com/nks/p806--implications-for-mathematics-and-its-foundations/)
    into our rule array. For example, we can make a rule array from [And](https://reference.wolfram.com/language/ref/And.html)
    and [Xor](https://reference.wolfram.com/language/ref/Xor.html) functions ([r =
    1/2 rules 8 and 6](https://www.wolframscience.com/nks/p806--implications-for-mathematics-and-its-foundations/)):


    ![](image_rsrc122.jpg)


    Different And+Xor (![](image_rsrc123.jpg)\+ ![](image_rsrc124.jpg)) rule arrays
    show different behavior:


    ![](image_rsrc125.jpg)'
  fmt: '

    The rule has the property that the pattern it generates (from a single-cell initial
    condition) survives for exactly 40 steps, and then dies out (i.e. every cell becomes
    white). And the important point is that this rule can be found by a discrete adaptive
    process. The idea is to start, say, from a null rule, and then at each step to
    randomly change a single outcome out of the 27 in the rule (i.e. make a “single-point
    mutation” in the rule). Most such changes will cause the “lifetime” of the pattern
    to get further from our target of 40—and these we discard. But gradually we can
    build up “beneficial mutations”


    ![](image_rsrc11N.jpg)


    that through “progressive adaptation” eventually get to our original lifetime-40
    rule:


    ![](image_rsrc11P.jpg)


    We can make a plot of all the attempts we made that eventually let us reach lifetime
    40—and we can think of this progressive “fitness” curve as being directly analogous
    to the loss curves in machine learning that we saw before:


    ![](image_rsrc11R.jpg)


    If we make different sequences of random mutations, we’ll get different paths
    of adaptive evolution, and different “solutions” for rules that have lifetime
    40:


    ![](image_rsrc11S.jpg)


    Two things are immediately notable about these. First, that they essentially all
    seem to be “using different ideas” to reach their goal (presumably analogous to
    the phenomenon of different branches in the tree of life). And second, that none
    of them seem to be using a clear “mechanical procedure” (of the kind we might
    construct through traditional engineering) to reach their goal. Instead, they
    seem to be finding “natural” complicated behavior that just “happens” to achieve
    the goal.


    It’s nontrivial, of course, that this behavior can achieve a goal like the one
    we’ve set here, as well as that simple selection based on random point mutations
    can successfully reach the necessary behavior. But [as I discussed in connection
    with biological evolution](https://writings.stephenwolfram.com/2024/05/why-does-biological-evolution-work-a-minimal-model-for-biological-evolution-and-other-adaptive-processes/),
    this is ultimately a story of [computational irreducibility](https://www.wolframscience.com/nks/chap-12--the-principle-of-computational-equivalence#sect-12-6--computational-irreducibility)—particularly
    in generating diversity both in behavior, and in the paths necessary to reach
    it.


    But, OK, so how does this model of adaptive evolution relate to systems like neural
    nets? In the standard language of neural nets, our model is like a discrete analog
    of a recurrent convolutional network. It’s “convolutional” because at any given
    step the same rule is applied—locally—throughout an array of elements. It’s “recurrent”
    because in effect data is repeatedly “passed through” the same rule. The kinds
    of procedures (like “backpropagation”) typically used to train traditional neural
    nets wouldn’t be able to train such a system. But it turns out that—essentially
    as a consequence of computational irreducibility—the very simple method of successive
    random mutation can be successful.


    ## Machine Learning in Discrete Rule Arrays


    Let’s say we want to set up a system like a neural net—or at least a mesh neural
    net—but we want it to be completely discrete. (And I mean “born discrete”, not
    just discretized from an existing continuous system.) How can we do this? One
    approach (that, as it happens, [I first considered in the mid-1980s](https://content.wolfram.com/sw-publications/2020/07/approaches-complexity-engineering.pdf)—but
    never seriously explored) is to make what we can call a “rule array”. Like in
    a cellular automaton there’s an array of cells. But instead of these cells always
    being updated according to the same rule, each cell at each place in the cellular
    automaton analog of “spacetime” can make a different choice of what rule it will
    use. (And although it’s a fairly extreme idealization, we can potentially imagine
    that these different rules represent a discrete analog of different local choices
    of weights in a mesh neural net.)


    As a first example, let’s consider a rule array in which there are two possible
    choices of rules: `k = 2, r = 1` [cellular automaton rules 4 and 146](https://www.wolframscience.com/nks/chap-3--the-world-of-simple-programs#sect-3-2--more-cellular-automata)
    (which are respectively [class 2 and class 3](https://www.wolframscience.com/nks/chap-6--starting-from-randomness#sect-6-2--four-classes-of-behavior)):


    ![](image_rsrc11T.jpg)


    A particular rule array is defined by which of these rules is going to be used
    at each (“spacetime”) position in the array. Here are a few examples. In all cases
    we’re starting from the same single-cell initial condition. But in each case the
    rule array has a different arrangement of rule choices—with cells “running” rule
    4 being given a ![](image_rsrc11U.jpg)background, and those running rule 146 a
    ![](image_rsrc11V.jpg)one:


    ![](image_rsrc11W.jpg)


    We can see that different choices of rule array can yield very different behaviors.
    But (in the spirit of machine learning) can we in effect “invert this”, and find
    a rule array that will give some particular behavior we want?


    A simple approach is to do the direct analog of what we did in our minimal modeling
    of biological evolution: progressively make random “single-point mutations”—here
    “flipping” the identity of just one rule in the rule array—and then keeping only
    those mutations that don’t make things worse.


    As our sample objective, let’s ask to find a rule array that makes the pattern
    generated from a single cell using that rule array “survive” for exactly 50 steps.
    At first it might not be obvious that we’d be able to find such a rule array.
    But in fact our simple adaptive procedure easily manages to do this:


    ![](image_rsrc11X.jpg)


    As the dots here indicate, many mutations don’t lead to longer lifetimes. But
    every so often, the adaptive process has a “breakthrough” that increases the lifetime—eventually
    reaching 50:


    ![](image_rsrc11Y.jpg)


    Just as in our model of biological evolution, different random sequences of mutations
    lead to different “solutions”, here to the problem of “living for exactly 50 steps”:


    ![](image_rsrc11Z.jpg)


    Some of these are in effect “simple solutions” that require only a few mutations.
    But most—like most of our examples in biological evolution—seem more as if they
    just “happen to work”, effectively by tapping into just the right, fairly complex
    behavior.


    Is there a sharp distinction between these cases? Looking at the collection of
    “fitness” (AKA “learning”) curves for the examples above, it doesn’t seem so:


    ![](image_rsrc120.jpg)


    It’s not too difficult to see how to “construct a simple solution” just by strategically
    placing a single instance of the second rule in the rule array:


    ![](image_rsrc121.jpg)


    But the point is that adaptive evolution by repeated mutation normally won’t “discover”
    this simple solution. And what’s significant is that the adaptive evolution can
    nevertheless still successfully find some solution—even though it’s not one that’s
    “understandable” like this.


    The cellular automaton rules we’ve been using so far take 3 inputs. But it turns
    out that we can make things even simpler by just putting ordinary [2-input Boolean
    functions](https://www.wolframscience.com/nks/p806--implications-for-mathematics-and-its-foundations/)
    into our rule array. For example, we can make a rule array from [And](https://reference.wolfram.com/language/ref/And.html)
    and [Xor](https://reference.wolfram.com/language/ref/Xor.html) functions ([r =
    1/2 rules 8 and 6](https://www.wolframscience.com/nks/p806--implications-for-mathematics-and-its-foundations/)):


    ![](image_rsrc122.jpg)


    Different `And`+`Xor` (![](image_rsrc123.jpg)\+ ![](image_rsrc124.jpg)) rule arrays
    show different behavior:


    ![](image_rsrc125.jpg)

