    如果我们遵循“最速下降路径”，总是根据变化图做出最佳改变，会发生什么？结果实际上相当不令人满意。从几乎任何初始条件开始，系统都会迅速陷入停滞，永远找不到任何令人满意的解决方案。实际上，确定性地遵循最速下降路径似乎将我们引向了一个无法逃脱的“局部极小值”。那么，仅查看变化图我们错过了什么？我们构建的变化图有一个局限性：它分别评估每个可能的单个突变的效果。它不处理一次多个突变的情况——如果要找到“通往成功的最快路径”并避免陷入停滞，一般情况下这可能是必要的。


    但即使在构建变化图时，也已经存在一个问题。因为至少直接计算它的方法扩展性相当差。在一个 `n×n` 的规则数组中，我们必须检查翻转约 `n²` 个值的效果，并且对于每一个值，我们都必须运行整个系统——总共需要约
    `n⁴` 次操作。并且必须在学习过程的每一步单独执行此操作。


    那么传统神经网络如何避免这种低效？答案在某种程度上涉及一个数学技巧。而且至少按通常的表述，它完全基于神经网络中权重和值的连续性——这使我们能够使用微积分中的方法。


    假设我们有一个这样的神经网络


    ![](image_rsrc13B.jpg)


    它计算某个特定函数 `f[x]`：


    ![](image_rsrc13C.jpg)


    我们可以询问当我们改变网络中的每个权重时，该函数如何变化：


    ![](image_rsrc13D.jpg)


    实际上，这给了我们类似于上述“变化图”的东西。但有一个重要区别。因为权重是连续的，我们可以考虑对它们的无穷小变化。然后我们可以问诸如“当我们对特定权重 `wi`
    进行无穷小变化时，`f[x]` 如何变化？”——或者等价地，“`f` 关于 `wi` 在点 `x` 处的偏导数是多少？”但现在我们可以利用无穷小变化的一个关键特征：它们总是可以被认为只是“线性相加”（本质上是因为
    `ε²` 总是可以忽略不计，相比于 `ε`）。换句话说，我们可以通过给出其在权重空间中的“方向”来总结任何无穷小变化，即一个向量，说明每个权重应（无穷小地）改变多少。因此，如果我们想尽可能快地（无穷小地）改变
    `f[x]`，我们应该沿着由所有 `f` 关于权重的导数定义的最速下降方向前进。


    在机器学习中，我们通常试图实际上设置权重，使我们生成的 `f[x]` 形式成功最小化我们定义的任何损失。我们通过在“权重空间”中增量“移动”来做到这一点——在每一步计算最速下降方向以知道下一步去哪里。（在实践中，有各种技巧，如“ADAM”，试图优化执行此操作的方式。）


    但我们如何高效地计算 `f` 关于每个权重的偏导数？是的，我们可以做类似于生成上述图片的类比，分别针对每个权重。但事实证明，微积分中的一个标准结果给了我们一个效率高得多的过程，实际上“最大程度地重用”已经完成的计算部分。


    一切始于嵌套（即复合）函数导数的教科书级链式法则：


