- raw: 'The idea that the brain is fundamentally made of connected nerve cells was
    considered in the latter part of the nineteenth century, and took hold in the
    first decades of the twentieth century—with the [formalized concept of a neural
    net](https://www.wolframscience.com/nks/notes-10-12--history-of-ideas-about-thinking/)
    that operates in a computational way emerging in full form in the work of Warren
    McCulloch and Walter Pitts in 1943. By the late 1950s there were hardware implementations
    of neural nets (typically for image processing) in the form of “perceptrons”.
    But despite early enthusiasm, practical results were mixed, and at the end of
    the 1960s it was announced that simple cases amenable to mathematical analysis
    had been “solved”—leading to a general belief that “neural nets couldn’t do anything
    interesting”.


    Ever since the 1940s there had been a trickle of general analyses of neural nets,
    particularly using methods from physics. But typically these analyses ended up
    with things like continuum approximations—that could say little about the information-processing
    aspects of neural nets. Meanwhile, there was an ongoing undercurrent of belief
    that somehow neural networks would both explain and reproduce how the brain works—but
    no methods seemed to exist to say quite how. Then at the beginning of the 1980s
    there was a resurgence of interest in neural networks, coming from several directions.
    Some of what was done concentrated on very practical efforts to get neural nets
    to do particular “human-like” tasks. But some was more theoretical, typically
    using methods from statistical physics or dynamical systems.


    Before long, however, the buzz died down, and for several decades only a few groups
    were left working with neural nets. Then in 2011 came a surprise breakthrough
    in using neural nets for image analysis. It was an important practical advance.
    But it was driven by technological ideas and development—not any significant new
    theoretical analysis or framework.


    And this was also the pattern for almost all of what followed. People spent great
    effort to come up with neural net systems that worked—and [all sorts of folklore](https://writings.stephenwolfram.com/2023/02/what-is-chatgpt-doing-and-why-does-it-work/#the-practice-and-lore-of-neural-net-training)
    grew up about how this should best be done. But there wasn’t really even an attempt
    at an underlying theory; this was a domain of engineering practice, not basic
    science.


    And it was in this tradition that [ChatGPT burst onto the scene](https://writings.stephenwolfram.com/2023/02/what-is-chatgpt-doing-and-why-does-it-work/)
    in late 2022. Almost everything about LLMs seemed to be complicated. Yes, there
    were empirically some large-scale regularities (like scaling laws). And I quickly
    suspected that the success of LLMs was a [strong hint of general regularities
    in human language](https://writings.stephenwolfram.com/2023/02/what-is-chatgpt-doing-and-why-does-it-work/#what-really-lets-chatgpt-work)
    that hadn’t been clearly identified before. But beyond a few outlier examples,
    almost nothing about “what’s going on inside LLMs” has seemed easy to decode.
    And efforts to put “strong guardrails” on the operation of the system—in effect
    so as to make it in some way “predictable” or “understandable”—typically seem
    to substantially decrease its power (a point that now makes sense in the context
    of computational irreducibility).


    My own interaction with machine learning and neural nets [began in 1980](https://writings.stephenwolfram.com/2015/05/wolfram-language-artificial-intelligence-the-image-identification-project/#personal-backstory)
    when I was developing my [SMP symbolic computation system](https://writings.stephenwolfram.com/2013/06/there-was-a-time-before-mathematica/),
    and wondering whether it might be possible to generalize the symbolic pattern-matching
    foundations of the system to some kind of “fuzzy pattern matching” that would
    be closer to human thinking. I was aware of neural nets but thought of them as
    semi-realistic models of brains, not for example as potential sources of algorithms
    of the kind I imagined might “solve” fuzzy matching.


    And it was partly as a result of trying to understand the essence of systems like
    neural nets that [in 1981 I came up with](https://www.wolframscience.com/nks/p17--the-personal-story-of-the-science-in-this-book/)
    what I later learned could be thought of as one-dimensional cellular automata.
    Soon I was deeply involved in studying cellular automata and developing a new
    intuition about how complex behavior could arise even from simple rules. But when
    I learned about recent efforts to make idealized models of neural nets using ideas
    from statistical mechanics, I was at least curious enough to set up simulations
    to try to understand more about these models.


    But what I did wasn’t a success. I could neither get the models to do anything
    of significant practical interest—nor did I manage to derive any good theoretical
    understanding of them. I kept wondering, though, what relationship there might
    be between cellular automata that “just run”, and systems like neural nets that
    can also “learn”. And in fact [in 1985 I tried to make a minimal cellular-automaton-based
    model](https://content.wolfram.com/sw-publications/2020/07/approaches-complexity-engineering.pdf)
    to explore this. It was what I’m now calling a “vertically layered rule array”.
    And while in many ways I was already asking the right questions, this was an unfortunate
    specific choice of system—and my experiments on it didn’t reveal the kinds of
    phenomena we’re now seeing.


    Years went by. I wrote a [section on “Human Thinking”](https://www.wolframscience.com/nks/chap-10--processes-of-perception-and-analysis/#sect-10-12--human-thinking)
    in [A New Kind of Science](https://www.wolframscience.com/nks/), that discussed
    the possibility of simple foundational rules for the essence of thinking, and
    even included a minimal discrete analog of a neural net. At the time, though,
    I didn’t develop these ideas. By 2017, though, 15 years after the book was published—and
    knowing about the breakthroughs in deep learning—I had begun to [think more concretely
    about neural nets as getting their power](https://writings.stephenwolfram.com/2017/05/a-new-kind-of-science-a-15-year-view/#machine-learning-and-the-neural-net-renaissance)
    by sampling programs from across the computational universe. But still I didn’t
    see quite how this would work.


    Meanwhile, there was a new intuition emerging from practical experience with machine
    learning: that if you “bashed” almost any system “hard enough”, it would learn.
    Did that mean that perhaps one didn’t need all the details of neural networks
    to successfully do machine learning? And could one perhaps make a system whose
    structure was simple enough that its operation would for example be accessible
    to visualization? I particularly wondered about this when I was writing [an exposition
    of ChatGPT and LLMs in early 2023](https://writings.stephenwolfram.com/2023/02/what-is-chatgpt-doing-and-why-does-it-work/).
    And I kept talking about “LLM science”, but didn’t have much of a chance to work
    on it.'
