    # 布尔导数与变化图谱


    下面是所有 2 输入布尔函数的“布尔导数”表：


    ![](img/image_rsrc147.jpg)


    确实可以为这类导数建立一整套“布尔微积分”。特别是，存在链式法则的直接类比：


    ![](img/image_rsrc148.jpg)


    其中 `Xnor[x,y]` 实际上是相等性测试 `x == y`：


    ![](img/image_rsrc149.jpg)


    但是，我们如何利用它来创建变化图谱呢？在我们简单的元胞自动机案例中，可以将变化图谱视为表示[输出单元的变化如何“反向传播”](https://www.wolframscience.com/nks/p604--cryptography-and-cryptanalysis/)到先前单元的过程。但如果我们直接尝试应用离散微积分规则，就会遇到一个问题：不同的“链式法则链”可能暗示同一单元值的不同变化。在连续情况下，由于无穷小量的工作方式，不会出现这种路径依赖性。但在离散情况下却会出现。归根结底，我们正在进行一种回溯，它只能忠实地表示为一个多路系统。（不过如果我们只想要概率，例如，可以考虑[对多路系统的分支进行平均](https://www.wolframphysics.org/bulletins/2021/02/multiway-turing-machines/)——我们上面展示的变化图谱实际上是对多路系统进行阈值处理的结果。）


    尽管在“简单”的元胞自动机案例中出现了此类困难，但这类方法在我们最初更复杂的规则数组案例中通常似乎效果更好。这里存在许多微妙之处，源于我们不仅是针对规则数组中的值求导数，也是针对规则的选择求导数（后者是连续情况下权重的类比）。


    让我们考虑 And+Xor 规则数组：


    ![](img/image_rsrc14A.jpg)


    我们的损失是底部所示行中值不匹配的单元格数量。现在我们可以为该规则数组以直接的“前向”方式和使用离散导数方法的“反向”方式构建变化图谱（其中我们通过始终选取“多数派”值来有效地解决少量的“多路行为”）：


    ![](img/image_rsrc14B.jpg)


    结果相似，尽管在本例中并不完全相同。这里还有其他几个例子：


    ![](img/image_rsrc14C.jpg)


    确实，细节上前向和反向方法的结果本质上总是存在局部差异。但反向方法——就像普通神经网络中的反向传播一样——可以更高效地实现。对于实际机器学习目的，它实际上很可能完全令人满意——特别是考虑到前向方法本身也只是在近似哪些突变最好这一问题。


    作为一个例子，下面是针对学习函数 `f[x] = ![](img/image_rsrc14D.jpg)` 这一问题，前向和反向方法针对我们上面展示的“突破性”配置所得的结果：


    ![](img/image_rsrc14E.jpg)


    ## 什么可以被学习？


    我们现在已经展示了不少机器学习实际运作的例子。但还有一个基本问题尚未解决：机器学习究竟能学习什么样的东西。甚至在此之前，还有另一个问题：给定特定类型的底层系统，它到底能表示什么样的函数？


    作为第一个例子，考虑一种最小神经网络，其形式为（本质上是单层感知机）：


    ![](img/image_rsrc14F.jpg)


    以 ReLU（即 `Ramp`）作为激活函数，并令第一组权重全为 1，此类神经网络计算的函数形式为：


    ![](img/image_rsrc14G.jpg)


    有了足够的权重和偏置，这种形式可以表示任意分段线性函数——本质上就是通过偏移移动斜坡，并通过权重缩放它们。例如考虑函数：


    ![](img/image_rsrc14H.jpg)


    这是上述神经网络计算的函数——下面展示了它是如何通过加入与各个中间节点（神经元）关联的连续斜坡构建起来的：


    ![](img/image_rsrc14J.jpg)


    （同样可以从 ELU 等激活函数获得所有光滑函数。）


    如果我们尝试表示多参数函数，情况会变得稍微复杂一些。仅用单个中间层，我们只能得到“分段（超）平面”函数（即仅在线性“断层线”处改变方向的函数）：


    ![](img/image_rsrc14K.jpg)


    但只要有两个中间层——且每层有足够多的节点——我们就能生成任意参数的任意分段函数。


    如果限制节点数量，大致上就是限制函数值中不同线性区域之间边界的数量。但随着在给定节点数下增加层数，我们基本上增加了函数值内多边形区域的边数：


    ![](img/image_rsrc14M.jpg)


    那么我们之前讨论的网格网络（mesh nets）表现如何呢？这里有几个随机例子，显示的结果与具有可比较总节点数的浅层全连接网络非常相似：


    ![](img/image_rsrc14N.jpg)


    好的，那我们的全离散规则数组呢？它们能表示什么函数？我们之前在生成规则数组以表示各种布尔函数时已经看到了部分答案。事实证明，存在一个基于 `SatisfiabilityInstances`
    的相当高效的过程，可用于显式寻找能表示给定函数的规则数组——或确定不存在能做到这一点的规则数组（例如给定大小的）。


    利用这个过程，我们可以找到表示所有（“偶”）3 输入布尔函数（即 `r = 1` 元胞自动机规则）的最小 And+Xor 规则数组：


    ![](img/image_rsrc14P.jpg)


    总是可以用一个 `2^n` 位的数组来指定任意 `n` 输入布尔函数，如下所示：


    ![](img/image_rsrc14R.jpg)


    但从上图可以看出，当我们将布尔函数“编译”为 And+Xor 规则数组时，它们所需的位数可能不同（即规则数组中的元素数量不同）。（实际上，函数的“算法信息含量”随我们用来表示它们的“语言”而变化。）例如，在所示的
    `n = 3` 情况下，最小规则数组大小的分布为：


    ![](img/image_rsrc14S.jpg)


    有些函数难以表示为 And+Xor 规则数组（似乎需要 15 个规则元素）——而另一些则较容易。这类似于将布尔函数表示为布尔表达式（例如合取范式）并[统计所用（一元和二元）操作的总数](https://www.wolframscience.com/nks/notes-10-11--boolean-formula-sizes/)时发生的情况：


    ![](img/image_rsrc14T.jpg)


    好的，原则上我们知道存在一个能计算任意（偶）布尔函数的 And+Xor 规则数组。但现在我们可以问：自适应演化过程能否真正找到这样的规则数组——比如说通过一系列单点突变？如果我们进行这种自适应演化——损失函数计算例如规则
    254 的“错误输出”数量——则可以产生如下一系列连续的突破性配置：


    ![](img/image_rsrc14U.jpg)


    结果不如上述最小解紧凑。但似乎总能通过带单点突变的自适应演化，至少找到某个能“解决问题”的 And+Xor 规则数组。


    下面是其他一些布尔函数的结果：


    ![](img/image_rsrc14V.jpg)


