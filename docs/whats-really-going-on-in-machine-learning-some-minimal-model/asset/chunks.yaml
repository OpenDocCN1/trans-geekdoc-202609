    # Rule Arrays, Cellular Automata, and Neural Networks


    Rule arrays and ordinary cellular automata share the feature that the value of
    each cell depends only on the values of neighboring cells on the step before.
    But in neural nets it’s standard for the value at a given node to depend on the
    values of lots of nodes on the layer before. And what makes this straightforward
    in neural nets is that (weighted, and perhaps otherwise transformed) values from
    previous nodes are taken to be combined just by simple numerical addition—and
    addition (being n\-ary and associative) can take any number of “inputs”. In a
    cellular automaton (or Boolean function), however, there’s always a definite number
