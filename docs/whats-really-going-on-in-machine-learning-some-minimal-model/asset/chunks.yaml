- raw: 'So what happens in this case if we follow the “path of steepest descent”,
    always making the change that would be best according to the change map? Well,
    the results are actually quite unsatisfactory. From almost any initial condition
    the system quickly gets stuck, and never finds any satisfactory solution. In effect
    it seems that deterministically following the path of steepest descent leads us
    to a “local minimum” from which we cannot escape. So what are we missing in just
    looking at the change map? Well, the change map as we’ve constructed it has the
    limitation that it’s separately assessing the effect of each possible individual
    mutation. It doesn’t deal with multiple mutations at a time—which could well be
    needed in general if one’s going to find the “fastest path to success”, and avoid
    getting stuck.


    But even in constructing the change map there’s already a problem. Because at
    least the direct way of computing it scales quite poorly. In an n×n rule array
    we have to check the effect of flipping about n2 values, and for each one we have
    to run the whole system—taking altogether about n4 operations. And one has to
    do this separately for each step in the learning process.


    So how do traditional neural nets avoid this kind of inefficiency? The answer
    in a sense involves a mathematical trick. And at least as it’s usually presented
    it’s all based on the continuous nature of the weights and values in neural nets—which
    allow us to use methods from calculus.


    Let’s say we have a neural net like this


    ![](image_rsrc13B.jpg)


    that computes some particular function f\[x\]:


    ![](image_rsrc13C.jpg)


    We can ask how this function changes as we change each of the weights in the network:


    ![](image_rsrc13D.jpg)


    And in effect this gives us something like our “change map” above. But there’s
    an important difference. Because the weights are continuous, we can think about
    infinitesimal changes to them. And then we can ask questions like “How does f\[x\]
    change when we make an infinitesimal change to a particular weight wi?”—or equivalently,
    “What is the partial derivative of f with respect to wi at the point x?” But now
    we get to use a key feature of infinitesimal changes: that they can always be
    thought of as just “adding linearly” (essentially because ε2 can always be ignored
    compared to ε). Or, in other words, we can summarize any infinitesimal change
    just by giving its “direction” in weight space, i.e. a vector that says how much
    of each weight should be (infinitesimally) changed. So if we want to change f\[x\]
    (infinitesimally) as quickly as possible, we should go in the direction of steepest
    descent defined by all the derivatives of f with respect to the weights.


    In machine learning, we’re typically trying in effect to set the weights so that
    the form of f\[x\] we generate successfully minimizes whatever loss we’ve defined.
    And we do this by incrementally “moving in weight space”—at every step computing
    the direction of steepest descent to know where to go next. (In practice, there
    are all sorts of tricks like “ADAM” that try to optimize the way to do this.)


    But how do we efficiently compute the partial derivative of f with respect to
    each of the weights? Yes, we could do the analog of generating pictures like the
    ones above, separately for each of the weights. But it turns out that a standard
    result from calculus gives us a vastly more efficient procedure that in effect
    “maximally reuses” parts of the computation that have already been done.


    It all starts with the textbook chain rule for the derivative of nested (i.e.
    composed) functions:


    ![](image_rsrc13E.jpg)![](image_rsrc13F.jpg)![](image_rsrc13G.jpg)


    This basically says that the (infinitesimal) change in the value of the “whole
    chain” d\[c\[b\[a\[x\]\]\]\] can be computed as a product of (infinitesimal) changes
    associated with each of the “links” in the chain. But the key observation is then
    that when we get to the computation of the change at a certain point in the chain,
    we’ve already had to do a lot of the computation we need—and so long as we stored
    those results, we always have only an incremental computation to perform.


    So how does this apply to neural nets? Well, each layer in a neural net is in
    effect doing a function composition. So, for example, our d\[c\[b\[a\[x\]\]\]\]
    is like a trivial neural net:


    ![](image_rsrc13H.jpg)


    But what about the weights, which, after all, are what we are trying to find the
    effect of changing? Well, we could include them explicitly in the function we’re
    computing:


    ![](image_rsrc13J.jpg)


    And then we could in principle symbolically compute the derivatives with respect
    to these weights:


    ![](image_rsrc13K.jpg)


    For our network above


    ![](image_rsrc13M.jpg)


    the corresponding expression (ignoring biases) is


    ![](image_rsrc13N.jpg)


    where ϕ denotes our activation function. Once again we’re dealing with nested
    functions, and once again—though it’s a bit more intricate in this case—the computation
    of derivatives can be done by incrementally evaluating terms in the chain rule
    and in effect using the standard neural net method of “backpropagation”.


    So what about the discrete case? Are there similar methods we can use there? We
    won’t discuss this in detail here, but we’ll give some indications of what’s likely
    to be involved.


    As a potentially simpler case, let’s consider ordinary cellular automata. The
    analog of our change map asks how the value of a particular “output” cell is affected
    by changes in other cells—or in effect what the “partial derivative” of the output
    value is with respect to changes in values of other cells.


    For example, consider the highlighted “output” cell in this cellular automaton
    evolution:


    ![](image_rsrc13P.jpg)


    Now we can look at each cell in this array, and make a change map based on seeing
    whether flipping the value of just that cell (and then running the cellular automaton
    forwards from that point) would change the value of the output cell:


    ![](image_rsrc13R.jpg)


    The form of the change map is different if we look at different “output cells”:


    ![](image_rsrc13S.jpg)


    Here, by the way, are some larger change maps for this and a couple of other cellular
    automaton rules:


    ![](image_rsrc13T.jpg)


    But is there a way to construct such change maps incrementally? One might have
    thought that there would immediately be at least for [cellular automata that (unlike
    the cases here) are fundamentally reversible](https://www.wolframscience.com/nks/chap-9--fundamental-physics#sect-9-2--the-notion-of-reversibility).
    But actually such reversibility doesn’t seem to help much—because although it
    allows us to “backtrack” whole states of the cellular automaton, it doesn’t allow
    us to trace the separate effects of individual cells.


    So how about using discrete analogs of derivatives and the chain rule? Let’s for
    example call the function computed by one step in rule 30 cellular automaton evolution
    w\[x, y, z\]. We can think of the “partial derivative” of this function with respect
    to x at the point x as representing whether the output of w changes when x is
    flipped starting from the value given:


    ![](image_rsrc13U.jpg)


    (Note that “no change” is indicated as [False](http://reference.wolfram.com/language/ref/False.html)
    or ![](image_rsrc13V.jpg), while a change is indicated as [True](http://reference.wolfram.com/language/ref/True.html)
    or ![](image_rsrc13W.jpg). And, yes, one can either explicitly compute the rule
    outcomes here, and then deduce from them the functional form, or one can use symbolic
    rules to directly deduce the functional form.)


    One can compute a discrete analog of a derivative for any Boolean function. For
    example, we have


    ![](image_rsrc13X.jpg)![](image_rsrc13Y.jpg)


    and


    ![](image_rsrc13Z.jpg)


    which we can write as:


    ![](image_rsrc140.jpg)


    We also have:


    ![](image_rsrc141.jpg)![](image_rsrc142.jpg)![](image_rsrc143.jpg)![](image_rsrc144.jpg)![](image_rsrc145.jpg)![](image_rsrc146.jpg)'
