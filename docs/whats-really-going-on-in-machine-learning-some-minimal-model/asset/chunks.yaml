    # 多路突变图


    但是，例如，是否存在能够计算 16 种可能的（2 输入）函数中任意一种的 And+Xor 规则数组？我们无法用 ![](img/image_rsrc126.jpg)
    得到 `Not` 或其他 8 个函数——但事实证明，我们可以用 ![](img/image_rsrc127.jpg) 得到所有 8 个函数（此处假设额外输入为
    ![](img/image_rsrc128.jpg)）：


    ![](img/image_rsrc129.jpg)


    事实上，我们也可以为所有其他“偶”布尔函数设置 And+Xor 规则数组。例如，这里是 3 输入规则 30 和规则 110 布尔函数的规则数组：


    ![](img/image_rsrc12A.jpg)


    值得评论的是，建立此类规则数组的能力与我们所用底层规则的[函数完备性](https://www.wolframscience.com/nks/p807--implications-for-mathematics-and-its-foundations/)有关——尽管这并不完全是一回事。函数完备性是关于建立任意公式，这实际上可以允许中间结果之间的长程连接。在这里，所有信息都必须显式地流经数组。但例如
    `Nand`（r = 1/2 规则 7，![](img/image_rsrc12B.jpg)）的函数完备性允许它在与 `First`（r = 1/2 规则
    12，![](img/image_rsrc12C.jpg)）结合时生成所有布尔函数，尽管有时所需的规则数组相当大：


    ![](img/image_rsrc12D.jpg)


    好的，但如果我们尝试使用我们的自适应进化过程——比如说解决寻找一个恰好存活 30 步的模式的问题——会发生什么？这是 And+Xor 规则数组的一个结果：


    ![](img/image_rsrc12E.jpg)


    这是其他“解”的示例（在本例中，没有一个看起来特别“机械化”或“构造化”）：


    ![](img/image_rsrc12F.jpg)


    但学习我们最初的 `f[x] = ![](img/image_rsrc12G.jpg)` 函数呢？首先，我们必须决定如何在离散规则数组系统中表示数字 `x`
    和 `f[x]`。一种方法是简单地用黑色单元的位置来表示（“独热编码”）。因此，例如，在这种情况下，初始黑色单元位于对应 `x = –1.1` 左右的位置。然后，通过规则数组后的结果是在对应
    `f[x] = 1.0` 位置处的一个黑色单元：


    ![](img/image_rsrc12H.jpg)


    现在的问题是，我们能否找到一个规则数组，根据我们想要的映射 `x ![](img/image_rsrc12J.jpg) f[x]` 成功地将初始单元位置映射到最终单元位置。好吧，这里有一个至少能接近实现这一点的例子（注意数组被视为循环的）：


    ![](img/image_rsrc12K.jpg)


    我们是怎么找到这个的？我们只是用了一个简单的自适应进化过程。直接类比机器学习中通常的做法，我们设置了“训练示例”，这里的形式为：


    ![](img/image_rsrc12M.jpg)


    然后我们在规则数组中反复进行单点突变，保留那些使所有训练示例的总差异不增加的突变。经过 50,000 次突变后，得到了上述最终结果。


    我们可以通过展示更接近目标的中间结果序列（而不是仅仅不再远离目标的结果）来了解“我们是如何到达那里的”：


    ![](img/image_rsrc12N.jpg)


    以下是相应的规则数组，在每种情况下都高亮显示了发生变化的元素（并展示了数组中 `f[0]` 的计算）：


    ![](img/image_rsrc12P.jpg)


    不同的随机突变序列将导致不同的规则数组。但根据此处定义的设置，生成的规则数组几乎总能成功准确计算 `f[x]`。这里有几个例子——我们专门展示 `f[0]`
    的计算：


    ![](img/image_rsrc12R.jpg)


    再次，一个重要的结论是，我们在发生的事情中没有看到“可识别的机制”。相反，看起来更像是我们得到的规则数组只是“恰好”在做我们想要的计算。它们的行为很复杂，但不知何故我们设法“利用它”来计算我们的
    `f[x]`。


    但这种计算有多稳健？典型机器学习的一个关键特征是它可以从特定的给定示例中“泛化”。如何刻画这种泛化从来都不清楚（什么时候一张穿狗装的猫的图片开始[被识别为狗的图片](https://writings.stephenwolfram.com/2015/05/wolfram-language-artificial-intelligence-the-image-identification-project/)？）。但是——至少当我们谈论分类任务时——我们可以用通向对应我们类别的吸引子的[吸引域](https://www.wolframscience.com/nks/p624--human-thinking/)来思考正在发生的事情。


    不过，在我们这里探索的这种离散系统中，分析起来要容易得多。例如，我们可以轻松枚举所有训练输入（即所有仅包含单个黑色单元的初始状态），然后查看这些输入导致任何给定单元变为黑色的频率：


    ![](img/image_rsrc12S.jpg)


    顺便说一下，这是该图在训练期间连续“突破”时的情况：


    ![](img/image_rsrc12T.jpg)


    但所有可能的输入呢，包括那些不只包含单个黑色单元的输入？好吧，我们可以枚举所有这些输入，并计算数组中每个单元变为黑色的总体频率：


    ![](img/image_rsrc12U.jpg)


    正如我们所预期的，结果比仅使用训练输入得到的结果要“模糊”得多。但训练数据中出现的 `f[x]` 的离散值仍有强烈的痕迹。如果我们绘制给定最终单元变为黑色的总体概率，我们会看到在对应于
    `f[x]` 取值 0 和 1 的位置处有峰值：


    ![](img/image_rsrc12V.jpg)


    但因为我们的系统是离散的，我们可以显式地查看发生的结果：


    ![](img/image_rsrc12W.jpg)


    最常见的总体是“无意义”的全白状态——这基本上发生在来自输入的计算“永远到达不了”输出时。但接下来最常见的结果确切地对应于 `f[x] = 0` 和 `f[x]
    = 1`。之后是“叠加”结果，其中 `f[x]` 实际上“既是 0 又是 1”。


    但是，好吧，那么什么初始状态“在……的吸引域中”（即将演化为）这里的各种结果？上图最后一列中相当平坦的图表表明，黑色单元的总体密度几乎不提供关于特定初始状态将演化到哪个吸引子的信息。


    这意味着我们必须查看初始条件中单元的具体配置。作为一个例子，从初始条件开始：


    ![](img/image_rsrc12X.jpg)


    它演化为：


    ![](img/image_rsrc12Y.jpg)


    现在我们可以问，如果我们看一系列略有不同的初始条件会发生什么。这里我们用黑白显示仍演化为原始“吸引子”状态的初始条件，用粉色显示演化为其他某个状态的初始条件：


    ![](img/image_rsrc12Z.jpg)


    内部实际上发生了什么？这里有几个例子，高亮显示了因改变初始条件而导致值发生变化的单元：


    ![](img/image_rsrc130.jpg)


    正如机器学习中的典型情况，似乎没有对吸引域形式的简单刻画。但现在我们对其原因有了一种感觉：这是计算不可约性的另一个后果。计算不可约性给了我们有效的随机性，使我们能够通过自适应进化找到有用的结果，但它也导致变化产生看似随机且不可预测的效果。（顺便值得一提的是，我们可以通过在训练数据中专门包含注入了“噪声”的示例，大幅提高吸引域的稳健性。）


    ## 多路突变图


