- raw: 'At the outset, though, it’s not obvious whether machine learning actually
    has to access such power. It could be that there are computationally reducible
    ways to solve the kinds of problems we want to use machine learning to solve.
    But what we’ve discovered here is that even in solving very simple problems, the
    adaptive evolution process that’s at the heart of machine learning will end up
    sampling—and using—what we can expect to be computationally irreducible processes.


    Like biological evolution, machine learning is fundamentally about finding things
    that work—without the constraint of “understandability” that’s forced on us when
    we as humans explicitly engineer things step by step. Could one imagine constraining
    machine learning to make things understandable? To do so would effectively prevent
    machine learning from having access to the power of computationally irreducible
    processes, and from the evidence here it seems unlikely that with this constraint
    the kind of successes we’ve seen in machine learning would be possible.


    So what does this mean for the “science of machine learning”? One might have hoped
    that one would be able to “look inside” machine learning systems and get detailed
    narrative explanations for what’s going on; that in effect one would be able to
    “explain the mechanism” for everything. But what we’ve seen here suggests that
    in general nothing like this will work. All one will be able to say is that somewhere
    out there in the computational universe there’s some (typically computationally
    irreducible) process that “happens” to be aligned with what we want.


    Yes, we can make general statements—strongly based on computational irreducibility—about
    things like the findability of such processes, say by adaptive evolution. But
    if we ask “How in detail does the system work?”, there won’t be much of an answer
    to that. Of course we can trace all its computational steps and see that it behaves
    in a certain way. But we can’t expect what amounts to a “global human-level explanation”
    of what it’s doing. Rather, we’ll basically just be reduced to looking at some
    computationally irreducible process and observing that it “happens to work”—and
    we won’t have a high-level explanation of “why”.


    But there is one important loophole to all this. Within any computationally irreducible
    system, there are always inevitably pockets of computational reducibility. And—as
    I’ve [discussed at length particularly in connection with our Physics Project](https://writings.stephenwolfram.com/2023/12/observer-theory/)—it’s
    these pockets of computational reducibility that allow computationally bounded
    observers like us to identify things like “laws of nature” from which we can build
    “human-level narratives”.


    So what about machine learning? What pockets of computational reducibility show
    up there, from which we might build “human-level scientific laws”? Much as with
    the emergence of “simple continuum behavior” from computationally irreducible
    processes happening at the level of molecules in a gas or ultimate discrete elements
    of space, we can expect that at least certain computationally reducible features
    will be more obvious when one’s dealing with larger numbers of components. And
    indeed in sufficiently large machine learning systems, it’s routine to see smooth
    curves and apparent regularity when one’s looking at the kind of aggregated behavior
    that’s probed by things like training curves.


    But the question about pockets of reducibility is always whether they end up being
    aligned with things we consider interesting or useful. Yes, it could be that machine
    learning systems would exhibit some kind of collective (“EEG-like”) behavior.
    But what’s not clear is whether this behavior will tell us anything about the
    actual “information processing” (or whatever) that’s going on in the system. And
    if there is to be a “science of machine learning” what we have to hope for is
    that we can find in machine learning systems pockets of computational reducibility
    that are aligned with things we can measure, and care about.


    So given what we’ve been able to explore here about the foundations of machine
    learning, what can we say about the [ultimate power of machine learning systems](https://writings.stephenwolfram.com/2024/03/can-ai-solve-science/)?
    A key observation has been that machine learning works by “piggybacking” on computational
    irreducibility—and in effect by finding “natural pieces of computational irreducibility”
    that happen to fit with the objectives one has. But what if those objectives involve
    computational irreducibility—as they often do when one’s dealing with a process
    that’s been successfully formalized in computational terms (as in math, exact
    science, computational X, etc.)? Well, it’s not enough that our machine learning
    system “uses some piece of computational irreducibility inside”. To achieve a
    particular computationally irreducible objective, the system would have to do
    something closely aligned with that actual, specific objective.


    It has to be said, however, that by laying bare more of the essence of machine
    learning here, it becomes easier to at least define the issues of merging typical
    “formal computation” with machine learning. Traditionally there’s been a tradeoff
    between the computational power of a system and its trainability. And indeed in
    terms of what we’ve seen here this seems to reflect the sense that “larger chunks
    of computational irreducibility” are more difficult to fit into something one’s
    incrementally building up by a process of adaptive evolution.


    So how should we ultimately think of machine learning? In effect its power comes
    from leveraging the “natural resource” of computational irreducibility. But when
    it uses computational irreducibility it does so by “foraging” pieces that happen
    to advance its objectives. Imagine one’s building a wall. One possibility is to
    fashion bricks of a particular shape that one knows will fit together. But another
    is just to look at stones one sees lying around, then to build the wall by fitting
    these together as best one can.


    And if one then asks “Why does the wall have such-and-such a pattern?” the answer
    will end up being basically “Because that’s what one gets from the stones that
    happened to be lying around”. There’s no overarching theory to it in itself; it’s
    just a reflection of the resources that were out there. Or, in the case of machine
    learning, one can expect that what one sees will be to a large extent a reflection
    of the raw characteristics of computational irreducibility. In other words, the
    foundations of machine learning are as much as anything rooted in the [science
    of ruliology](https://writings.stephenwolfram.com/2021/09/charting-a-course-for-complexity-metamodeling-ruliology-and-more/#the-pure-basic-science-of-ruliology).
    And it’s in large measure to that science we should look in our efforts to understand
    more about “what’s really going on” in machine learning, and quite possibly also
    in neuroscience.


    ## Historical & Personal Notes


    In some ways it seems like a quirk of intellectual history that the kinds of foundational
    questions I’ve been discussing here weren’t already addressed long ago—and in
    some ways it seems like an inexorable consequence of the only rather recent development
    of certain intuitions and tools.'
  fmt: '

    # 机器学习的基础：计算不可约性与鲁里奥洛吉


    起初，机器学习是否真的必须利用计算不可约性的力量并不显而易见。可能存在计算可约的方法来解决我们想用机器学习解决的问题。但我们在这里发现，即使在解决非常简单的问题时，作为机器学习核心的自适应进化过程，最终也会采样并利用我们预期为计算不可约的过程。


    与生物进化一样，机器学习本质上是在寻找行之有效的事物——不受人类在显式逐步工程化事物时所面临的“可理解性”约束。人们能否设想约束机器学习使其产生可理解的结果？这样做将有效地阻止机器学习访问计算不可约过程的力量，而从这里的证据来看，在这种约束下，我们在机器学习中看到的成功似乎不太可能实现。


    ## 对“机器学习科学”的意义


    人们或许希望能“深入”机器学习系统内部，获得关于正在发生什么的详细叙事解释；实际上，人们希望能“解释一切背后的机制”。但我们在这里看到的表明，一般来说，这行不通。我们只能说，在计算宇宙的某处，存在某种（通常是计算不可约的）过程，“碰巧”与我们想要的目标一致。


    是的，我们可以做出一般性陈述——强烈基于计算不可约性——关于此类过程的可发现性，例如通过自适应进化。但如果我们问“系统究竟是如何详细工作的？”，将不会有太多答案。当然，我们可以追踪其所有计算步骤，看到它以某种方式表现。但我们不能指望获得相当于“全局人类级解释”来说明它在做什么。相反，我们基本上只能观察某个计算不可约过程，并注意到它“碰巧有效”——而我们不会有关于“为什么”的高层解释。


    ## 可约性的口袋：一个重要的漏洞


    但这一切有一个重要的漏洞。在任何计算不可约系统中，总不可避免地存在计算可约的“口袋”。正如我在[与物理学项目相关的大量讨论中所述](https://writings.stephenwolfram.com/2023/12/observer-theory/)，正是这些计算可约的口袋，使得像我们这样计算有限的观察者能够识别出“自然定律”等事物，并以此构建“人类级叙事”。


    那么机器学习呢？那里出现了哪些计算可约的口袋，我们可能从中构建“人类级科学定律”？正如从气体分子层面或空间终极离散元素层面发生的计算不可约过程中涌现出“简单连续行为”一样，我们可以预期，当处理大量组件时，至少某些计算可约特征会更加明显。确实，在足够大的机器学习系统中，当观察训练曲线等探测聚合行为时，看到平滑曲线和表观规律性是常态。


    但关于可约性口袋的问题始终是：它们最终是否与我们认为有趣或有用的事物对齐。是的，机器学习系统可能会表现出某种集体（“类脑电图”）行为。但不清楚的是，这种行为是否能告诉我们系统中实际发生的“信息处理”（或其他）的任何情况。如果要有“机器学习科学”，我们必须希望能在机器学习系统中找到与我们可测量且关心的事物对齐的计算可约口袋。


    ## 机器学习系统的终极力量


    鉴于我们在这里探讨的机器学习基础，我们能对[机器学习系统的终极力量](https://writings.stephenwolfram.com/2024/03/can-ai-solve-science/)说些什么？一个关键观察是，机器学习通过“搭便车”利用计算不可约性发挥作用——实际上是通过寻找“碰巧”符合目标的“自然计算不可约片段”。但如果这些目标本身涉及计算不可约性——正如在用计算术语成功形式化的过程中（如数学、精确科学、计算
    X 等）常见的那样——会怎样？仅靠机器学习系统“在内部使用某些计算不可约片段”是不够的。要实现特定的计算不可约目标，系统必须做与该实际、特定目标紧密对齐的事情。


    不过必须承认，通过在这里揭示机器学习更多的本质，至少更容易定义将典型“形式计算”与机器学习融合的问题。传统上，系统的计算能力与其可训练性之间存在权衡。确实，从我们在这里看到的情况来看，这似乎反映了这样一种感觉：“更大块的计算不可约性”更难通过自适应进化的增量构建过程塞入其中。


    ## 如何终极看待机器学习


    实际上，机器学习的力量来自于利用计算不可约性这一“自然资源”。但当它使用计算不可约性时，是通过“觅食”碰巧推进其目标的片段来实现的。想象一下在砌墙。一种可能是塑造特定形状的砖块，知道它们能拼合。另一种则是看看周围躺着的石头，然后尽力把这些石头拼凑起来砌墙。


    如果接着问“为什么墙会有这种图案？”，答案基本上会是“因为这就是碰巧躺在那里的石头能拼出的样子”。这本身没有总括性的理论；它只是可用资源的反映。在机器学习的情况下，人们可以预期，所看到的很大程度上将反映计算不可约性的原始特征。换句话说，机器学习的基础在很大程度上植根于[鲁里奥洛吉科学](https://writings.stephenwolfram.com/2021/09/charting-a-course-for-complexity-metamodeling-ruliology-and-more/#the-pure-basic-science-of-ruliology)。在我们努力理解机器学习中“真正发生了什么”，以及很可能在神经科学中理解更多时，我们很大程度上应该求助于这门科学。


    ## 历史与个人注记


    从某种意义上说，智力史上的某种偶然导致我在这里讨论的基础性问题很久以前没有得到解决；从另一种意义上说，这似乎是某些直觉和工具直到最近才发展起来的必然结果。

    '
