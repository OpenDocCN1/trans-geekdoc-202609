- raw: 'Rule arrays and ordinary cellular automata share the feature that the value
    of each cell depends only on the values of neighboring cells on the step before.
    But in neural nets it’s standard for the value at a given node to depend on the
    values of lots of nodes on the layer before. And what makes this straightforward
    in neural nets is that (weighted, and perhaps otherwise transformed) values from
    previous nodes are taken to be combined just by simple numerical addition—and
    addition (being n\-ary and associative) can take any number of “inputs”. In a
    cellular automaton (or Boolean function), however, there’s always a definite number
    of inputs, determined by the structure of the function. In the most straightforward
    case, the inputs come only from nearest-neighboring cells. But there’s no requirement
    that this is how things need to work—and for example we can pick any “local template”
    to bring in the inputs for our function. This template could either be the same
    at every position and every step, or it could be picked from a certain set differently
    at different positions—in effect giving us “template arrays” as well as rule arrays.


    So what about having a fully connected network, as we did in our very first neural
    net examples above? To set up a discrete analog of this we first need some kind
    of discrete n\-ary associative “accumulator” function to fill the place of numerical
    addition. And for this [we could pick a function like](https://www.wolframscience.com/nks/notes-12-9--properties-of-logical-primitives/)
    [And](http://reference.wolfram.com/language/ref/And.html), [Or](http://reference.wolfram.com/language/ref/Or.html),
    [Xor](http://reference.wolfram.com/language/ref/Xor.html)—or [Majority](http://reference.wolfram.com/language/ref/Majority.html).
    And if we’re not just going to end up with the same value at each node on a given
    layer, we need to set up some analog of a weight associated with each connection—which
    we can achieve by applying either [Identity](http://reference.wolfram.com/language/ref/Identity.html)
    or [Not](http://reference.wolfram.com/language/ref/Not.html) (i.e. flip or not)
    to the value flowing through each connection.


    Here’s an example of a network of this type, trained to compute the ![](image_rsrc15C.jpg)function
    we discussed above:


    ![](image_rsrc15D.jpg)


    There are just two kinds of connections here: flip and not. And at each node we’re
    computing the majority function—giving value 1 if the majority of its inputs are
    1, and 0 otherwise. With the “one-hot encoding” of input and output that we used
    before, here are a few examples of how this network evaluates our function:


    ![](image_rsrc15E.jpg)


    This was trained just using 1000 steps of single-point mutation applied to the
    connection types. The loss systematically goes down—but the configuration of the
    connection types continues to look quite random even as it achieves zero loss
    (i.e. even after the function has been completely learned):


    ![](image_rsrc15F.jpg)


    In what we’ve just done we assume that all connections continue to be present,
    though their types (or effectively signs) can change. But we can also consider
    a network where connections can end up being zeroed out during training—so that
    they are effectively no longer present.


    Much of what we’ve done here with machine learning has centered around trying
    to learn transformations of the form x ![](image_rsrc15G.jpg)f\[x\]. But another
    typical application of machine learning is autoencoding—or in effect learning
    how to compress data representing a certain set of examples. And once again it’s
    possible to do such a task using rule arrays, with learning achieved by a series
    of single-point mutations.


    As a starting point, consider training a rule array (of cellular automaton rules
    4 and 146) to reproduce unchanged a block of black cells of any width. One might
    have thought this would be trivial. But it’s not, because in effect the initial
    data inevitably gets “ground up” inside the rule array, and has to be reconstituted
    at the end. But, yes, it’s nevertheless possible to train a rule array to at least
    roughly do this—even though once again the rule arrays we find that manage to
    do this look quite random:


    ![](image_rsrc15H.jpg)


    But to set up a nontrivial autoencoder let’s imagine that we progressively “squeeze”
    the array in the middle, creating an increasingly narrow “bottleneck” through
    which the data has to flow. At the bottleneck we effectively have a compressed
    version of the original data. And we find that at least down to some width of
    bottleneck, it’s possible to create rule arrays that—with reasonable probability—can
    act as successful autoencoders of the original data:


    ![](image_rsrc15J.jpg)


    The success of LLMs has highlighted the use of machine learning for sequence continuation—and
    the effectiveness of transformers for this. But just as with other neural nets,
    the forms of transformers that are used in practice are typically very complicated.
    But can one find a minimal model that nevertheless captures the “essence of transformers”?


    Let’s say that we have a sequence that we want to continue, like:


    ![](image_rsrc15K.jpg)


    We want to encode each possible value by a vector, as in


    ![](image_rsrc15M.jpg)


    so that, for example, our original sequence is encoded as:


    ![](image_rsrc15N.jpg)


    Then we have a “head” that reads a block of consecutive vectors, picking off certain
    values and feeding pairs of them into And and Xor functions, to get a vector of
    Boolean values:


    ![](image_rsrc15P.jpg)


    Ultimately this head is going to “slide” along our sequence, “predicting” what
    the next element in the sequence will be. But somehow we have to go from our vector
    of Boolean values to (probabilities of) sequence elements. Potentially we might
    be able to do this just with a rule array. But for our purposes here we’ll use
    a fully connected single-layer [Identity](https://reference.wolfram.com/language/ref/Identity.html)+[Not](https://reference.wolfram.com/language/ref/Not.html)
    network in which at each output node we just find the sum of the number of values
    that come to it—and treat this as determining (through a [softmax](https://reference.wolfram.com/language/ref/SoftmaxLayer.html))
    the probability of the corresponding element:


    ![](image_rsrc15R.jpg)


    In this case, the element with the maximum value is 5, so at “zero temperature”
    this would be our “best prediction” for the next element.


    To train this whole system we just make a sequence of random point mutations to
    everything, keeping mutations that don’t increase the loss (where the loss is
    basically the difference between predicted next values and actual next values,
    or, more precisely, the “[categorical cross-entropy](https://reference.wolfram.com/language/ref/CrossEntropyLossLayer.html)”).
    Here’s how this loss progresses in a typical such training:


    ![](image_rsrc15S.jpg)


    At the end of this training, here are the components of our minimal transformer:


    ![](image_rsrc15T.jpg)


    First come the encodings of the different possible elements in the sequence. Then
    there’s the head, here shown applied to the encoding of the first elements of
    the original sequence. Finally there’s a single-layer discrete network that takes
    the output from the head, and deduces relative probabilities for different elements
    to come next. In this case the highest-probability prediction for the next element
    is that it should be element 6.


    To do the analog of an LLM we start from some initial “prompt”, i.e. an initial
    sequence that fits within the width (“context window”) of the head. Then we progressively
    apply our minimal transformer, for example at each step taking the next element
    to be the one with the highest predicted probability (i.e. operating “at zero
    temperature”). With this setup the collection of “prediction strengths” is shown
    in gray, with the “best prediction” shown in red:


    ![](image_rsrc15U.jpg)'
