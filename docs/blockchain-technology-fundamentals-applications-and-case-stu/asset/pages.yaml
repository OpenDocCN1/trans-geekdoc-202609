    # 2.1 INTRODUCTION


    Blockchain can be defined as a chain of the block that contains processed data.
    A blockchain is a ledger or a record of a transaction. It can be thought of as
    a chain or records stored in the form of blocks which are controlled by no single
    authority. Blockchain first appeared in Nakamoto''s bitcoin paper, which explains
    a new decentralized cryptocurrency algorithm is used to solve traditional distributed
    database synchronized consensus problems. It is an integrated solution and an
    unsettling innovation.


    The blockchain records can be viewed as a log of ordered transactions. The blockchain
    technology is mainly used for secure transfer of items like property, contracts,
    etc. Here, a third-party intermediary like a bank or the government is not required.
    It is the backbone of the very famous cryptocurrency in the world – the bitcoin.
    In blockchain, a user can see every data, and she can control all his or her information
    and transactions. Our beloved prime minister, Mr. Modi, strongly believes that
    the blockchain concept will find new solutions in the agricultural sector. Transparent
    agriculture will be made with the help of real-time blockchain data.


    Blockchains require data to be monitored in a digital manner. Since blockchain
    technology adopts new concepts, it has to cope up with existing technologies.
    Data authentication cryptographic algorithms are used in blockchain (Figure 2.1).


