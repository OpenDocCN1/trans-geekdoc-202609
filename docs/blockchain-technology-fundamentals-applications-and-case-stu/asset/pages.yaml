    Lemma 1:


    “I” is the information that is legitimate and authentic.


    Proof:


    Let I_a be the information that is both authentic and legitimate.

    As a first step, decompose the information (I_al) into authentic information (I_a)
    and legitimate information (I_l):


    ```

    I_al = I_a + I_l

    ```


    To Prove:


    Case 1: Information is authentic (I_a):


    ```

    I_a = (I_a × I_o) + I_i

    ```


    where

    I_i is the nonrepudiation of information

    I_o is the identity of the originator

    I_a is the integrity of information


    Case 2: Information is legitimate (I_l) or I is I_i:


    I = I_i

    whereas I = P(d): processed form of data:


    ```

    sum_{i=0}^n I = I_0 + I_1 + I_2 + ... + I_n, n ≥ 0

