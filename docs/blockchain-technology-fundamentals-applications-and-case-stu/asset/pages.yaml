    # Definition 2: Multiple Information Network


    To find out semantic meaning and to get different insights of pattern identification
    of the information network, it is necessary to define multiple information network
    as it a new way of seeing HIN.


    Assume information network as a graph. Let $G_1$ and $G_2$ be the multiple information
    networks. Both graphs $G_1$ and $G_2$ are said to be isomorphic to each other,
    if there exists a one correspondence, i.e., $V: V(G_1) \rightarrow V(G_2)$ such
    that for each pair $x, y$ of vertices of $G_1$, $X, Y$ in $G_2$ if and only if
    $F(x).F(Y) \in e(G_2)$ [31].


    In other words, $G_1$ and $G_2$ are said to be isomorphic to each other if there
    is a mapping from one set of vertices to another set of vertices, which preserves
    or maintains adjacency property. Such a mapping can be called an isomorphism,
    and it is not possible to find out in a single graph that is here a single information
    network [20]. Thus, we need two or more information networks to find out whether
    they are equal or not [23].


    # Definition 3: HIN


    Consider there “n” data objects, which can be denoted as $x_1=\{x_{i1},x_{i2},x_{i3},...,x_{im1}\},x_n=\{x_{n1},x_{n2},x_{n3},...,x_{nn}\}$;
    then HIN can be defined as a graph $G=(N, E, W)$, where $N=\cup\{x_i\\}$, where
    $E$ is the collection of edges or otherwise associated links between nodes or
    connection between any data objects in the network; and $W$ is the set of weighted
    values between the data objects connection [15,16,17]. If $n=1$, the rank of the
    graph reduces, which can be called as homogeneous information network [18,19].


