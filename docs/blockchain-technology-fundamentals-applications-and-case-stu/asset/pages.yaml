    The information can be verified at any point in time there are no chances of corruption
    or deletion in the distributed ledgers. Any unauthorized transactions will be
    rejected automatically. Algorithms as AES would provide symmetric cryptography
    for confidentiality, and hash functions can be used to verify the integrity of
    communication. All these would make the smart infrastructures robust (Table 4.1).


    The next section discusses a simple architecture that explains about the converged
    blockchain IoT.


    # 4.12.4 Blockchain IoT ARCHITECTURE


    Figure 45 explains how IoT and blockchain, two different technologies, can be
    converged for different applications. IoT refers to a loosely coupled system of
    multiple heterogeneous and homogeneous devices that can sense, process, and network.
    As explained earlier, a fundamental problem with current IoT systems is their
    architecture, with a centralized-server model managed by a central authority.
    This makes it susceptible to a single point of failure. Blockchain addresses this
    problem by decentralizing decision making to a consensus-based shared network
    of devices.


    The blockchain can be deployed in three domains:


    +   1. Public: bitcoin and Ethereum come under this category. Each and every node
    can send or read transactions without requiring any permission. Consensus is open
    to the public.

    2. Consortium area: It comes under partial permission. The permission to read
    or send may be made public or be provided only to few authorized nodes.

    3. Private: Only the organization to whom the network of blockchain can write
    transaction to.


    The privacy of transaction history in the shared ledger for a network of IoT devices
    cannot be easily granted on public blockchains, because transaction pattern analysis
    can be applied to make inferences about the identities of users or devices behind'
