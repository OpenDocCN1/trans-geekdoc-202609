  md: '# 10.5.2 INFORMATION CLASSIFICATION


    The information gathered from various sources cannot be used directly for communication.
    This is because of the time taken for identifying the right information that is
    to be retrieved from the database. Classification of information enables easier
    retrieval and utilization of information. As with the existing information systems,
    there is less effort taken on filtering and streamlining the information that
    is to be communicated. The DIGBI classifies the information gathered on the domain/departments
    in the organization. It does not group the information and map it to a single
    domain appropriate domains based on their utilization. For example, if the information
    generated by the marketing department, then the same information may be useful
    for sales as well as accounting department. This task of information classification
    eliminates the problems in communicating information among various departments.
    In case of information to be prioritized or in case of confidential information,
    it may be grouped under a separate class and may be used by the concerned individuals.


    In this system, let us assume that X represents the information gathered, D represents
    the department, i represents the number of information, and j represents the department
    ID. The gathered information about the organization considered de departments
    is represented as Xi and the information gathered from various departments is
    represented Dj. Initially the gathered information is classified based on the
    department ID and having higher priority to be communicated are being obtained.


    # 10.5.3 INFORMATION TAGGING


    The classified information may be further segregated based on various parameters,
    depending on the communication and utilization in the organization. Parameters
    may be chosen dynamically as well. As the information may even be obtained from
    social networks to understand the customers trends, parameters may also be varied
    dynamically. Consider, for example, the parameters chosen are the origin, and
    value of information. Every information will have an origin, i.e., the department
    from which the information has been generated, the purpose for generation, the
    concerned person who was responsible for the generation of the information, etc.;
    similarly, every information will have its own value, depending on where the information
    can be utilized. This parameter is crucial as this describes the sensitivity of
    information. The validity of information refers to how long the information will
    be valid. Similar to this, other parameters may be chosen, depending on the need.
    Dynamic parameters may also be chosen. The chosen parameters are tagged on the
    information and kept ready for preprocessing. The task of tagging aids in the
    elimination of information silo by identifying unwanted information.


