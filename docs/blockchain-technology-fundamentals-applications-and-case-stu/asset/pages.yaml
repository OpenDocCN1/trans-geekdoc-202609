  md: '# Blockchain: Review of Protocols & Standards


    # 2.3 CONSENSUS ALGORITHMS IN BLOCKCHAIN


    A consensus algorithm is a common agreement between all the peers in the blockchain
    network. Here, trust between all the nodes in a blockchain is achieved. The blockchain
    consensus protocol is responsible for controlling and coordinating the operations
    of all nodes in the consensus process.


    # 2.3.1 VARIOUS CONSENSUS ALGORITHMS


    # 2.3.1.1 Proof of Work (PoW)


    In blockchain, new blocks enter an existing chain by PoW consensus algorithm,
    which is used to confirm transactions and add new blocks to the chain. Information
    is shared among users using digital tokens. Bitcoin uses this PoW consensus algorithm.
    It is also adopted by Ethereum, else. (Figure 2.3).


    # 2.3.1.2 Proof of Stake (PoS)


    PoW is not scalable, so many projects replace PoW with PoS. Ethereum has moved
    to PoS consensus. PoS is a virtual agreement between the blockchain users. It
    validates blocks in the blockchain.


    # 2.3.1.3 Delegated Proof of Stake (DPoS)


    To avoid scalability issues, DPoS is proposed. DPoS is designed for ensuring security
    transaction by voting and election process. It avoids malicious users. It is a
    fast, sustainable, and low power-consuming algorithm. This algorithm constructs
    stake methods for blockchain users.


    # 2.3.1.4 Practical Byzantine Fault Tolerance (PBFT)


    PBFT provides a practical Byzantine state machine which can even work in failures
    (Figure 2.4).

    FT includes request, pre-prepare, prepare, commit, and reply phases. PBFT shows
    low algorithm complexity and complex practicality in distributed systems (Castro
    and Liskov, 1999) since it can achieve distributed consensus without carrying
    out complex mathematical computations (like in PoW). The transactions do not require
    multiple confirmations after they are finalized and agreed upon. PBFT suffered
    from communication overhead. Stellar is an advancement of PBFT (Zhang and Lee,
    2019).


