    # 5.1 INTRODUCTION


    Blockchain technology (BT) is mainly designed to solve various problems in almost
    every sector. Blockchain can be defined as a decentralized incorruptible digital
    ledger. This emerging technology has a promise to transmit securely any digital
    form of data or coins between stakeholders. It is basically used when there is
    a presence of multiple stakeholders and ensure the transparency and integrity
    of data in the network. The information related to every transaction of such distributed
    network is shared and made available to all nodes in a secured manner.

    The advantage of such an emerging technology is easy retrieval of requested information
    through distributed network.


    In the Era of Information and Communication Technology (ICT) and Internet of Things
    (IoT), their usage in the healthcare sector has a promising challenge for researchers.
    Many researchers have already started the exploration of BT toward healthcare
    domain. Nowadays, the major challenges faced in healthcare domain are security,
    interoperability, privacy, sharing, authentication, and policy aspects. Hence,
    it is essential to define an efficient, unique, sustainable, and standardized
    information model for the same.


    # 5.2 BACKGROUND


    Here, discuss about the various research challenges and their current state of
    research in healthcare domain related to BT. There are numerous business models,
    and medical applications are defined in healthcare industry, which vary from country
    to country. There are some specific healthcare applications that have massive
    opportunities and benefits of replacing the existing IT infrastructure by BT.
    Dave et al. define three different ways through which BT brings transformation
    into healthcare technology. The first option is to build blockchain-based electronic
    records to generate a patient''s database, which will be accessible to every department
    of healthcare [1]. The second option is to find a novel solution in supply chain
    management using blockchain to ensure smooth and safe transition of products.
    The third option is to deploy blockchain concepts in the genomic market for secure
    sharing of billions of data. The main advantage of integrating blockchain in healthcare
    is solve inefficiencies that exist in the current system. Moreover, blockchains
    give a promising change to healthcare, which acts as a key catalyst for healthier
    communities.'
