  md: '# INTRODUCTION


    # 9.1 BLOCKCHAIN


    # 9.1.1 BLOCKCHAIN


    Blockchain is a decentralized computation and information sharing shared platform
    that enables multiple authoritative domains that do not trust each other to cope,
    coordinate, and collaborate in a rational decision-making process. In a typical
    blockchain architecture, every node (the system/computer of each part) maintains
    a local copy of the global datasheet. The system ensures consistency among the
    local copies by ensuring that (i) the local copies at every node are identical
    and (ii) the local copies are always based on the global information.


    The local information stored on each part''s computer is called a public ledger,
    which can be considered as a database available with everyone, containing the
    historical data that can be used for futures computations. The public ledger stores
    all the global transactions that are synchronized. For example, consider four
    parties named Anna, Ben, Dav, and Emma who are involved in distributed banking.
    They have Rs. 5,000 in each of their accounts, and all four have a public ledger
    at their local systems. Now, consider the following transactions:


    +   1. Anna sends Rs. 2,000 to Ben – accepted and updated in everyone''s ledger

    2. Ben sends Rs. 4,000 to Dav – accepted and updated in everyone''s ledger

    3. Anna sends Rs. 4,000 to Emma – transaction rejected by remaining three and
    is not successful


    The sample led of Anna, Ben, Dav, and Emma after the above transactions are shown
    in Figure 9.1.


    Here, the first two transactions are successful; they were verified and accepted
    by all the parties. But the third transaction, Anna → Emma: Rs. 4,000 was not
    successful. When Anna broadcasts her request, other parties check the balance
    in her account by checking transactions committed in their public ledger. From
    they learn that Anna does not have the required balance for the transaction. Hence,
    all the other parties reject the third transaction mentioned above, and this transaction
    is not recorded in their public ledger.


    | Anna: Rs. 5,000 | Ben: Rs. 5,000 | Dav: Rs. 5,000 | Emma: Rs. 5,000 |

    |---|---|---|---|

    | Anna → Ben: Rs. 2,000 | Anna → Ben: Rs. 2,000 | Anna → Ben: Rs. 2,000 | Anna
    → Ben: Rs. 2,000 |

    | Ben → Dav: Rs. 4,000 | Ben → Dav: Rs. 4,000 | Ben → Dav: Rs. 4,000 | Ben → Dav:
    Rs. 4,000 |

    | Anna | | | |

    | Dav | Ben | Emma |


    FIGURE 9.1 Sample public ledgers of the parties involved.'
