- pgno: 29
  md: '# Blockchain: Review of Protocols & Standards


    # 2.1.1 KEY ELEMENTS OF BLOCKCHAIN TECHNOLOGIES


    The blockchain technology is composed of six key elements. They are discussed
    in the following sections.


    # 2.1.1.1 Decentralized


    The basic feature of blockchain is that data can be inserted and accessed on any
    node distributedly.


    # 2.1.1.2 Transparent


    The recorded data in a blockchain system is transparent to all the nodes.


    # 2.1.1.3 Open Source


    Most blockchain systems are open to all, accessible by all users.


    # 2.1.1.4 Autonomy


    Every node on the blockchain system can transfer or update data safely; the idea
    is to have trust from single person to the whole system, and no one can mediate
    it (Rokibul et al., 2010).


    # 2.1.1.5 Immutable


    The data entered in the system cannot be changed.


    # 2.1.1.6 Anonymity


    Data transaction can be anonymous in blockchain technologies.


    # 2.1.1.7 Tamper-Proof


    The data entered into the blockchain is tamper-proof.


    # 2.1.1.8 User Empower


    In the blockchain, a user can see every data, and he or she can control all his
    her information and transactions.


    # 2.1.1.9 Peer-to-Peer Network


    Blockchain uses decentralized peer-to-peer protocol in which each peer has the
    same capabilities.


    # 2.1.1.10 Blocks


    In blockchain, a number of blocks are connected to each other in a proper and
    linear sequential order. Data used for transactions get stored in files called
    blocks. Every block has a hash of the previous block (Figure 2.2).


    # 2.1.2 TYPES OF BLOCKCHAIN


    There are three basic types of blockchains: public blockchain, consortium blockchain,
    and private blockchain (Buterin, 2015).'
