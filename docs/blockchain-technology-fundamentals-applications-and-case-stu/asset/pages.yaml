    # 4.12.2 Supply Chain Management


    Supply chain management is a complicated domain where several stakeholders participate
    from different places of their business. Collaboration between raw material suppliers,
    product manufacturers, logistics companies, shipments, retailers, and customers
    is crucial to ensure the transparency of supply chain life. To prevent losses
    and delays, the data collected from all stages, starting when the order is dispatched
    until the end-of-life of the product, is significant. Getting visibility of the
    location and condition of shipments is a primary factor that decides the effectiveness
    of supply chains and the revenue of the companies. However, it has been immensely
    challenging to get all these data on time to make the business profitable and
    to reduce the losses.


    The contracts and rules exchanged among the different parties are the essential
    components of supply chain services. Once the shipping is started, parts such
    as shipping agencies, custom officials, carriers, and other entities take part
    in the execution. At each level, set of acknowledgments, messages, and receipts
    are exchanged. This long chain of data is well suited for making use of blockchain
    to register all the transactions in between to ensure reliable, data-driven smooth
    process. The distributed ledger will be verified by the customers, logistics providers,
    and government authorities anytime to obtain reliable information and to have
    better control over the entire supply chain and logistics domain.'
