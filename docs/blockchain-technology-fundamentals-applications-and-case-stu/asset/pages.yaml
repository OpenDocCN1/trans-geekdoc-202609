    # 8.3.1 BITCOIN PROTOCOL


    # 8.3.1.1 What Is Bitcoin?


    A decentralized peer-to-peer electronic/virtual cash payment system is the bitcoin.
    Bitcoin is the first popular cryptocurrency and a global payment system. Satoshi
    Nakamoto created bitcoin in the year 2008. The technology used for the transaction
    process of bitcoin is blockchain. As discussed earlier, blockchain has been adopted
    in various industries for the transaction of cryptocurrency. At the end of September
    2019, the size of the bitcoin blockchain is around 242.39 GB [6].


    # 8.3.1.2 Why Bitcoin?


    Clashes with a third party – bank in the traditional system – creates crisis in
    a transaction. The high transaction cost in the traditional system reduces transactions,
    because the third party charges high transaction fee and other charges. The next
    issue of the traditional system is security. The traditional system is easily
    hacked by hackers, which creates a privacy problem. Nakamoto focused on the above
    issues and created a secure payment system that is based on the decentralized
    peer-to-peer system with cryptographic features.'
