    graphical user interface, the interaction between the user and the device is achieved.


    +   2. Connectivity: Connectivity plays a vital role in IoT by connecting objects
    together. It is considered an essential part in IoT because object-level interactions
    lead to collective intelligence. It provides network accessibility and compatibility
    in things. By this connectivity, the networking of smart devices and applications
    will create new market opportunities for the IoT.


    +   3. Dynamic nature: The activity of IoT is to collect data from its environment;
    this is achieved with the dynamic changes that take place around the devices.
    The state of these devices changes dynamically, for example, sleeping to waking
    up and vice versa, connected and/or disconnected as well as the context of devices,
    including location, temperature, and speed. In addition to the state of the device,
    the number of devices also changes dynamically with person, place, and time.


    +   4. Enormous scale: The number of devices to be managed and communicated with
    each other will be much larger than the devices connected to the Internet. The
    management of data generated from these devices and their interpretation for application
    purposes becomes more critical. Gartner (2015) confirms the enormous scale of
    IoT in the estimated report, where it stated that 5.5 million new things get connected
    every day and 6.4 billion connected things will be in world in 2016, which is
    up by 30% from 2015. The report also forecasts that the number of connected devices
    will reach 20.8 billion by 2020.


    +   5. Sensing: Sensors play a major role in measuring or detecting any changes
    in the environment. It provides the means of developing capabilities to represent
    a clear understanding of the physical world and its people.


    +   6. Heterogeneity: Heterogeneity in IoT is one of the key characteristics.
    Interactions between devices in IoT have different hardware and service platforms,
    and they also communicate with different networks. So, it''s the duty of IoT architecture
    to support direct network connectivity between heterogeneous networks. Interoperability,
    information transparency, technical assistance, and decentralized decisions are
    considered to be heterogeneous things designed in IoT based on their environment.


    +   7. Security: IoT devices are naturally vulnerable to security threats. As
    we gain efficiencies, novel experiences, and other benefits from the IoT, it would
    be a mistake to forget about security concerns with it. There are high levels
    of transparency and privacy issues with IoT. It is important to secure the endpoints,
    the networks, and the data that are transferred across all means, creating a security
    paradigm.'
