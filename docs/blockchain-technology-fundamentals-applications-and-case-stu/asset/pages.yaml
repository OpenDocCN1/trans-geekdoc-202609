    # 10.9 CONCLUSION


    Information silo has witnessed a gradual rise in several organizations with the
    evolution of digital information. The management and handling of such information
    is a complex task for the employees in the organization. Communication, being
    the base in any organization for its smooth functioning, demands information to
    be on move all the time. Such information movement is affected by several factors
    such as unwanted information being shared, essential information not being shared
    among the departments due to various management reasons, highly competitive environments
    leading to malpractices in information handling, etc. The most alarming and rising
    problem in corporate sector is the challenge in ensuring nonrepudiation of information.
    The proposed work aims to handle information silo and ensure nonpermutation of
    information using the popular blockchain technology. Information that flows in
    the organization is identified and corresponding blocks are created based on the
    communication link. The decentralized consensus process ensures nonrepudiation
    of information and other techniques used in blockchain ensuring tamper-proof information.
    The creation of blocks ensures that information makes it appropriate appropriate
    selection for its inclusion in the block of a blockchain contributes to the elimination
    of information silo to a greater extent. The vast application of the blockchain
    technology to various domains is the major strength of the proposed system, making
    it efficient in handling the information silo problem. The results with goodness
    of fit test clearly that the application of block information system to an organization
    will be efficient compared to the various other information handling systems.
    The complete automation of the proposed block information system may be achieved
    with the help of artificial intelligence, which may be a future enhancement to
    the proposed information system.


