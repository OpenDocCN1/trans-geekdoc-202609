    tools are provided to ensure integrity, blockchain helps. The validity of each
    block in the blockchain is checked by the hash value of each block, and the hash
    value of each block relies on hash value of preceding blocks. Therefore, it only
    guarantees the integrity of a new block, but also applies the integrity test to
    all existing blocks. The integrity checking of the blockchain-based IoT systems
    also performs the same process.


