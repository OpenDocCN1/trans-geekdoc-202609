  md: 'Generally, the centralized and decentralized systems depend on the control:
    single point of control or multiple point of control [11]. But the distributed
    systems deal with the location variation, where parts of the system are located
    in different physical locations.


    # 4.10.1.4 Identity and Access Management


    Identity and access management of blockchain improves the IoT security. IoT devices
    are commonly using private blockchains to store [7] cryptographic hashes of IoT
    devices state and configuration. This permanent record is used to validate the
    authenticity of the devices. Thus, the blockchain can provide defence against
    IP address forgery attacks and IP spoofing attacks as protects from fake signatures.


    # 4.10.1.5 Resilient and Reliable Transaction


    IoT devices in blockchain store ledger copies on their memories accumulate all
    transactions. Each device holds the ledger, the sharing of information adds additional
    processing, storage, and power consumption to achieve better resiliency among
    the devices. Blockchain blocks are immutable; when included in IoT devices, they
    improve the traceability and accountability of the sensor devices and assure the
    proper message delivery.


    # 4.10.1.6 Security


    The blockchain is a distributed ledger in which each block is fingerprinted and
    stamped to maintain its uniqueness. If one block content is changed, the fingerprint
    is changed and the block is no longer considered as same block, and each block
    stores the hash of the previous block as well. It also ensures the security among
    the blocks by avoiding a changed block to be part of the chain.


    # 4.10.2 COMPARISON OF BLOCKCHAIN AND IoT


    The two major technologies that can be merged to promote their advantages in various
    applications have some dissimilarity. IoT is a centralized technology, whereas
    the blockchain is decentralized and distributed [12]. Resources are constrained
    in IoT but resource consumption is more in blockchain. Latency time is low in
    IoT but it is more in blockchain mining due to the distributed ledgers. IoT involves
    large number of devices, whereas the blockchain scalability is poor. IoT consumes
    limited bandwidth and resources as contains the smaller devices, but blockchain
    consumes more bandwidth. The main difference that is also highlighted is the better
    security of blockchain technology than IoT.


    # 4.10.3 APPLICATIONS OF BLOCKCHAIN IN IoT


    Though IoT in its singularity has many applications, blockchain technology is
    enhancing the power of IoT. Blockchain IoT is applicable for governments, smart
    monitoring, healthcare, commercial applications, agriculture, and communication
    systems. Here we highlight some of the applications of blockchain IoT.'
