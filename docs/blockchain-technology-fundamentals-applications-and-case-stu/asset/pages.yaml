    notes or other forms of patient medical data. The DLT in healthcare guarantees
    security and privacy of healthcare data. Based on the survey report in Ref. [7],
    nearly 189,945,874 healthcare records were either lost or stolen during 2009–2018.


    Stakeholders play an eminent role in healthcare sector. The Figure 5.2 describes
    the major stakeholders involved in the healthcare domain. They are patients (in
    patient and out patient), healthcare providers (hospitals, healthcare centers,
    doctors, clinicians, lab technician, etc.), data analysts, and claim or insurance
    providers. For detailed analysis and proper diagnosis of health records, coordination
