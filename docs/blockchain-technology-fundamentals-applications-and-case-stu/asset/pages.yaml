    # 9.1.2.8 Batch-Key Cipher (BKC)


    Batch-key cipher with fixed-key encryption for garbled circuit construction makes
    encryption calls once per block of gates and achieves 36% improvement in efficiency
    in terms of execution time of protocol, without compromising the security requirements.
    Universal gates on garbled circuit construction (Innocent et al., 2019a) are built
    on the Fastest framework (Innocent et al.), which is explained in the next section.
    Both BKC and universal gates together have been proved to be secure and speedup
    the garbling time by 66%.


    Researchers are constantly working on improving time complexity and communication
    complexity of secure computation protocols as decentralized application can be
    implemented with secure computation. Even though secure computation in a computation
    is a tedious task, as they have to be constantly checked for adversaries, and
    only the honest parties have to be successful in computation of the reality, for
    the required functionality. To ensure honesty of the parties involved in computation,
    block-chain concept is the best choice, and hence combining both the technologies
    will be a win-win situation for both. Blockchain will ensure that only the honest
    parties are part of computation, and secure computation ensures privacy of sensitive
    data. The next section gives a short description of research on blockchain with
    secure computation to achieve blockchain with privacy.


    # 9.1.3 Research ON BLOCKCHAIN WITH SECURE COMPUTATION


    In 2015, the Enigma platform (Zykind et al., 2015) made its first attempt to combine
