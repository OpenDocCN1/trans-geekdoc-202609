  md: '# 8.1 INTRODUCTION


    The following are the major problems with bank transactions:


    +   - The technical issues

    - The account might be hacked

    - Exceeded transfer limits

    - High transfer charges


    The above problems can be solved by cryptocurrency.

    Before we start with the introduction of blockchain, it is very important to understand
    the difference between two major terms: bitcoin and blockchain.

    **Bitcoin:** It is a cryptocurrency that is established globally to store values
    and was started in 2009[1–3].

    **Blockchain:** It is a backbone technology adapted by the digital cryptocurrency
    for secured transactions. Blockchain technology was commercially implemented first
    by bitcoin. Blockchain was introduced in 2008[1–3].

    Blockchain provides a decentralized architecture on a peer-to-peer network. It
    is a ledger of transaction shared among multiple peers on a distributed environment
    to avoid security faults. All peers participate in the transaction and inspect
    the whole process instead of using a single user control that ensures authentication
    and avoids any hacker to mislead the transaction with the help of public key cryptography
    and the hash function [1,3].

    In recent years, blockchain has been adapted in varies fields such as medical,
    financial, government, and many more [4].


    # 8.2 BLOCKCHAIN BASICS


    Let us understand the basic elements of blockchain, which is illustrated in Figure
