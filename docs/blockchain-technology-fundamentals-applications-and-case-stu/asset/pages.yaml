- pgno: 7
  md: '# Preface


    The purpose of this edited book is to present the detailed exploration of adaption
    and implementation of blockchain technologies in the real-world business applications.
    Blockchain is getting momentum in all the sectors that transact in huge numbers
    every day. This book covers all the aspects of the blockchain with complete 360-degree
    view spectrum, and it can be used at basic and intermediary levels by computer
    science postgraduate students, researchers, and practitioners. It presents the
    rapid advances made in the existing business model by applying the blockchain
    techniques.


    Chapter 1 surveys on blockchain and Internet of Things. This chapter focuses on
    traditional design of a blockchain, smart energy, smart city, smart green house,
    data protection, transportation, and industry IoT with detailed architecture.
    This chapter concludes with discussion on benefits of blockchain.


    Chapter 2 reviews protocols and standards of blockchain. It deals with key elements
    of blockchain technologies, important features of blockchain protocols, consensus
    algorithms in blockchain, importance of standards, and finally blockchain standards
    framework.


    Chapter 3 discusses blockchain technology. It provides an insight into architecture,
    use cases, and its application with industrial IoT and Big Data. This chapter
    deals with architectures for blockchain implementation, followed by cases for
    blockchain implementation, IoT, and artificial intelligence.


    Chapter 4 covers IoT and blockchain. This chapter discusses the working principle
    of IoT with its characteristics, applications, and its pros and cons. It deals
    with the blockchain–IoT convergence and its prominent applications as well as
    challenges.


    Chapter 5 deals with research issues and solution in blockchain healthcare applications.
    Various research challenges and its solutions in healthcare sector have been discussed.
    It focuses mainly on the necessity of designing a secure healthcare model for
    medical data exchange between various participants. It explores the emerging applications
    in decentralized ledger technology that addresses the need of health data to be
    authenticated, distributed, and immutable.


    Chapter 6 covers improving security on blockchain and its integration with IoT.
    New technologies using cryptographic blockchain algorithms are suggested by the
    researchers to improve security of miners and participants. This chapter focuses
    on cryptographic algorithms needed to secure BIOT, delegated and authenticated
    consensus algorithms for different types of blockchain, secure designing of cryptographic
    digital ledger and revocation ledger, public/private cryptographic algorithms,
    hashing algorithms, fault-tolerance systems, and new access control.


    Chapter 7 deals with blockchain-based digital health record model for health information
    exchanges. It discusses the importance of blockchain-based health care system
    that integrates patients with personal data, electronic health data, hospitals,
    physicians, insurance companies, and drug industry to improve health record'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# Preface


    management, enhance insurance claim process, and accelerate clinical/biomedical
    research.


    Chapter 8 discusses bitcoin features, bitcoin transactions, bitcoin mining, and
    the merits of using bitcoin. The features, transactions, and merits of other protocols
    such as Ethereum, Ripple, and Litecoin are also explained.


    Chapter 9 focuses on FGUGChain framework, which is a novel method to incorporate
    privacy in blockchain with the help of secure computation. The fundamentals of
    blockchain, secure computation, and the research directions on blockchain are
    explained.


    Chapter 10 deals with blockchain technology for the removal of information silo
    by building an information network. The concept of digital block information systems
    is explained and the experimental results show that the proposed work removes
    information silo as well as ensures nonrepudiation of information.


    Chapter 11 explains the application of blockchain in various fields such as food
    supply chain management, digital India, securing Electronic Health Records, and
    maintaining the Know Your Customer (KYC) data.


    Chapter 12 discusses the applicability of blockchain in cryptocurrency. It details
    features and type of cryptocurrency as well as processing of transactions using
    blockchain.


    Chapter 13 explains the blockchain through 5G technology, in combination with
    the IoT (Internet of things) and IIoT (Industrial Internet of things). Innumerable
    applications of blockchain in the field of modern Industrial sciences are also
    discussed.'
