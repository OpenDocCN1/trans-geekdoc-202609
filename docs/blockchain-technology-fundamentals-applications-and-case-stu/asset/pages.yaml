  md: '# Blockchain and Internet of Things: A Survey


    inserted in the current blocks, it will generate a distinct hash value. This will
    lead to a descent effect for the successive blocks as well as the hash values.
    The consensus algorithm will drop the unwanted blocks in the blockchain. Consensus
    algorithm is very important for security purpose because the attacks will destroy,
    replicate, and modify the blocks in the blockchain. If the attack owns 50% of
    the blocks in a-chain, it can administer the full blockchain.


    # 1.2 INTERNET OF THINGS BASED ON BLOCKCHAIN


    # 1.2.1 SMART ENERGY


    Smart energy is transfer between prosumers and energy sellers. A smart meter will
    monitor the energy absorbed and sold for some period of time. Prosumer, smart
    meter, and merchant broadcast the information to the blockchain. Prosumer communicates
    with other others using a public/private encryption key. It also uses this to
    manage a secure or secured communication with the blockchain. There are four important
    entities: sellers, bidders, smart meters, and smart contracts. The seller will
    start selling the energy by bargaining and advertising. Prosumer is used to purchase
    from many sources. Smart meter will record the energy spent at that particular
    period to check whether it is secure or not. Smart contract performs the operation
    and payment task. The working process is shown in Figure 1.2 [10].


    The following are important actions of the smart energy process based on blockchain:


    +   1. Smart contract installed in the blockchain

    2. Seller bargains and advertises about the available energy

    3. Powerful prosumer keeps track on the blockchain and acknowledges with bids

    4. Smart contract uses the Vickrey auction to find out the winner and gives prize

    5. The energy is given to prosumer with majority


    ![](img/5197498995d15589ead293656bce20db_17_0.png)


    FIGURE 1.2 Blockchain of smart energy.'
