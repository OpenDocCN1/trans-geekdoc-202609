  md: '# Major Protocols of Blockchain


    ![](img/5197498995d15589ead293656bce20db_135_0.png)


    FIGURE 8.2 Various network models. (a) Centralized network, (b) decentralized
    network, and (c) distributed network.


    # 8.2.1 PEER-TO-PEER NETWORK (P2P)


    This network is distributive in nature and is in a decentralized manner. There
    is no concept of centralized service, instead all the nodes are linked with each
    other to make the transaction or data transfer (Figure 8.2) [5].


    # 8.2.2 DISTRIBUTED LEDGER SYSTEM


    In the distributed ledger system, all nodes keep a copy of the data record instead
    like a centralized system where the single centralized node keeps the data record.
    All nodes participate in the data transfer or transaction, for which all nodes
    carry the updated copies of the ledger or the data record in the blockchain network.
    All the participating nodes of the transaction will have the same copy of the
    data record and the record of each other node. As everyone has updated the copy
    of the data record, no one can manipulate/falsify the transaction.


    # 8.2.3 KEY CRYPTOGRAPHY


    During the transaction in a blockchain, the confidentiality, authentication, and
    integrity are provided with the help of an asymmetric key cryptography. In asymmetric
    key cryptography, two keys are used: the private key, which is used to encrypt
    the data/transaction that is available with the intended user to do the transaction,
    and the public key, which is distributed over all the participants using the elliptic
    curve Diffie–Hellman–Merkle and is used to decrypt the data/transaction. The combination
    of private and public key ensures the data security.'
  merge: -1
  img_proc: true
