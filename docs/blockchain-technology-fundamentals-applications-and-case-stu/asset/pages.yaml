    # ## 1.1 INTRODUCTION


    Blockchain is the most emerging technology that has come to be known from the
    statements “magic behind Bitcoin” [1], “Design the next OS for our society” [2],
    and “interrupt everything” [3]. The main goal of blockchain technology is to stop
    the communication through a mediator and give proper rights to the legitimate
    user [4]. Usually, society trusts the mediators for the transfer of capital. The
    mediators protect the authentication of the users and record and validate the
    transfer details. The mediators are banks and governments. Blockchain technology
    performs the task of replacing the mediators with the help of composite cryptography
    architecture, thus replacing the mediators like banks and governments. Figure
    1.1 shows the traditional design of a blockchain.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Blockchain Technology


    ![](img/5197498995d15589ead293656bce20db_16_0.png)


    **FIGURE 1.1** Traditional design of a blockchain.


    According to computational concept, a blockchain is considered as a data structure,
    where data are stored inside blocks. Each block is linked with another block in
    a sequential order. Blockchain is similar to the linked list concept; each element
    is linked using a pointer. Each block includes a payload and a header. Header
    has information related to its length, content, 32 bit SHA256, i.e., the hash
    value of the preceding block. Payload usually stores the away details. The hash
    value of a block depends on the preceding block. Transaction verification and
    validation form into blocks, and storing data in a distributed ledger is the main
    goal of a blockchain. Distributed harmony algorithm is used by the blockchain
    to find how and when to include a set of transactions in the file.


    All the new blocks can be added to the blockchain if the bulk of the network nodes
    agrees to its inclusions, i.e., only if the users agree. Each network node holds
    a local blockchain copy. It transmits over the network when a new block reaches
    consensus. Numerous persistent copies can be created; if most of the nodes have
    similar copies of the blockchain, it is considered more safe and loyal. Consensus
    process is a major task, because if a node is added to a blockchain, it must be
    validated and verified to check whether it is a legal transaction. It is also
    necessary to check whether the added transaction is integrated with each other.
    All new transactions are included in the blockchain, so verification of transactions
    is the main task. If there is no consensus process, then there is a possibility
    of various faults [5].


    The most important and the first consensus process is POW (Proof of Work), which
    is handled by bitcoin. Miners (miners) of the cryptocurrencies adopt this mechanism.
    POW (mining) will fix complicated analytical puzzles by using more computing power.
    There are two ways to solve complicated puzzles: the first takes more time to
    determine the correct answer, and the second is simply giving the answer. The
    first one is costlier, because solving puzzles faster than usual requires further
    calculating ability. While creating the blocks, it is initialized and created
    fast. If it is so, then it is easy to solve the puzzle. If the blocks were created
    faster with no care, then it is very difficult to solve the puzzle [6]. We often
    add new blocks in the blockchain. While adding, it is necessary to attain consensus
    so that it utilizes the computing power to solve the analytical puzzle. It needs
    enormous quantity of energy and computing resources [7].


    To overcome all these problems, the other consensus mechanism like proof of stake
    (PoS) and proof of importance (POI) are considered [8,9]. In Figure 1.1, the new
    hash value relies on the preceding hash value in a block. So, if any new block
    is'
