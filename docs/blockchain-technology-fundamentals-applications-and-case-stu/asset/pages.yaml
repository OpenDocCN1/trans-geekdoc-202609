  md: '# Blockchain Technology


    ![](img/5197498995d15589ead293656bce20db_136_0.png)


    FIGURE 8.3 Hashing techniques.


    # 8.2.4 HASHING


    It is a method of nonreversible encryption used in blockchain to improve the transaction
    security. Hashing converts the variable length data into fixed length data as
    output using the secure hash algorithm SHA 256 (SHA 256) (Figure 8.3).


    # 8.2.5 PROOF OF WORK


    The proof of work from each node of the decentralized peer-to-peer network performs
    the transaction. All the participants are supposed to do complex computations
    to validate themselves as a valid participant. The computational power of the
    legitimate participant to be greater than the hacker computational power to make
    a legal transaction. The Sybil attack and the doubling problems that discussed
    in the later part are removed with the help of proof of work.


    The proof of work contains a complex mathematical cryptographic calculation that
    is identical to Adam Back''s hash scan [7]. The proof of work scan is a special
    value called nonce (number only used once), which is a number added to the hashed
    value in the target will set the number of zero bits. The hash with many zero
    bits will set the required number of zero bits. The output hash contains zeros
    in the beginning, which should be less than that of the target. The proof of work
    is verified by incrementing the nonce to achieve the target number of zeros bits
    in the starting of the hash generated by the corresponding block. Once the computation
    is completed, it cannot be changed. If the hacker tries to change the computation,
    the verification will be done by all the other blocks involved in the transaction
    since all wishes to change a different hash value than the hacked value. If the
    hacker wishes to change the block, he or she should have a very high computational
    power to change the hash value in all the blocks that participate in the transaction
    (Figure 8.4).


    # 8.3 BLOCKCHAIN PROTOCOLS


    Blockchain is growing and popular technology. After the growth and spread of bitcoin
    protocol, many other protocols have been designed for various applications in
    different domains. In this chapter, the major protocols are explained with the
    features, the transaction method, and the advantages and the disadvantages. The
    major protocols are illustrated in Figure 8.5.'
