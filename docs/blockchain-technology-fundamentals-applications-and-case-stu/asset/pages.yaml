    # 9.2 FGUGCHAIN FRAMEWORK – A BLOCKCHAIN WITH PRIVACY


    The FGUGCHAIN framework introduced by Innocent and Prakash (2019) is described
    in detail in this section. FGUGCHAIN (FastGarble Gates Chain) comprises of online
    phase and off-line phase to achieve blockchain with privacy and faster computation
    using an efficient marbled circuit. The FGUGChain architecture is shown in Figure
    9.3, and the components are explained in the following sections.


    # 9.2.1 ONLINE PHASE


    The online phase or the on-chain consensus of FGUGChain does the lightweight blockchain
    operations. The process is carried out in a manner that the original data are
    never exposed to the parties involved in the transaction, as well data is not
    stored on nodes. The major components in online phase are smart contract metadata,
    computation function of the application, and the blockchain nodes.


    # 9.2.1.1 Smart Contract Metadata


    Smart contract is the set of promises or the business logic between the parties
    involved in transactions. Smart contract is a software that runs on the public
    ledger to encode assets and has transaction instructions for modifying assets.
