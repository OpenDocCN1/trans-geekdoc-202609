- pgno: 111
  md: '# Improving Security on Blockchain


    +   1. Decentralization: BC stores data across the network in a decentralized
    public. BC eliminates the vulnerability of a single point of failure. It uses
    public ledger in a decentralized manner. The main advantage of BC is that it eliminates
    the requirement of a third party as well


    +   2. Independence: BC uses mechanisms wherein individual entity can control
    the BC. To exchange the information in the network, BC follows consensus of the
    majority of the nodes that guarantee reliability and consistency without necessitating
    any third-party forms [6].


    +   3. Transparency: In BC ledger systems, fraudulent transactions cannot be included.
    It maintains a top level of transparency whenever data are to be updated or erased.
    It is validated and authenticated by the miners in the network [11].


    +   4. Security: A unique cryptographically authenticated signature and consensus
    mechanism provides security to each node in the network validates each block.
    Public key cryptographic algorithm is used by the user to make a digital signature
    of their transaction. So, the signature becomes unacceptable if any information
    is modified in the centralized network.


    +   5. Shared verification: Every transaction is verified and added by miners
    in the BC, which revokes the necessity of a third party in a BC network.


    +   6. Anonymity: BC uses a changeable key (PK) to sign each transaction, and
    a public key cryptography for authenticating users and controlling access, which
    provides anonymity.


    +   7. Privacy: BC systems offer peer-to-peer privacy and security in decentralized
    networks. For example, Ethereum have heightened the privacy by BC technology.


    # 6.4 WORKING PROCEDURE


    +   1. Broadcasting transaction: Every transaction requested by the user is encrypted
    using PKs and then broadcasted to the peer networks in the BC.


    +   2. Validation of Transaction: Public key cryptographic algorithms can be used
    to validate the transactions with authentication of the supplicant node.


    +   3. Block validation: Every block in the network is validated by executing
    consensus algorithms such as proof of work (PoW), proof of stake (PoS), or proof
    of concept in the network.


    +   4. Appending to BC: A validated block is included in the BC in a stable and
    irreversible way.


