    security and simulation-based security for the gambling game and also show that
    simulation-based security always implies indistinguishability-based security.


    # 9.1.2.6 Simple Circuit Description (SCD), AES-NI


    The JustGarble system developed by Bellare et al. (2013) based on DKC cipher with
    fixed-key AES makes a call to a fixed permutation – for gate evaluation. It also
    introduces a simple representation of garbled circuit, named as array. Here, as
    the gates are represented as arrays in a topological order, the need for communication
    between gates as objects is scraped, making the system lightweight, efficient,
    and cost-effective. The use of embedded AES makes new instructions speed up the
    process. JustGarble requires only one AES call per gate for evaluation. It stands
    as a benchmark for further optimizations on garbled circuit construction using
    Boolean gates and acts as the base for comparison of new optimizations/frameworks.


    # 9.1.2.7 Other Optimizations


    Some other known optimizations/techniques to improve bit and time complexities
    as follows:


    +   - FlexOR (Kolesnikov et al., 2014)


    The flexible garbling of XOR gates allows to have 0–2 ciphertexts for the XOR
    gate. It also combines the AND gate optimizations with free-XOR.


    +   - Half Gates (Zahur et al., 2015)


    It is designed for privacy-free setting. It produces only two ciphertexts per
    AND gate and is compatible with the free-XOR technique.


    +   - Garbling Gadgets (Ball et al., 2016)


    It is designed to work on Boolean and arithmetic circuits. When used for Boolean
    circuits, it generates n+1 ciphertexts instead of 2n ciphertexts for the corresponding
    n inputs. Ball et al. have also theoretically claimed that a single AND gate can
    be garbled to a single ciphertext.


    +   - Reusable Garbled Circuit


    Reusability of garbled circuit construction with input and circuit privacy is
    proposed by Wang (2016). They have also proposed a reusable garbled circuit with
    input privacy and circuit privacy, and proved the security using indistinguishability-based
    security scheme. In 2017, they have introduced reusable garbled circuit construction
    with fully homomorphic encryption (Wang et al., 2017) and claims of constant communication
    complexity.


    +   - Size-Zero Garbled Circuits'
