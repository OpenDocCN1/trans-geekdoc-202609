    # 10.3 BASIC CONCEPTS AND DEFINITIONS


    This section introduces basic concepts related to HIN and compares HIN with other
    allied concepts with examples.


    # 10.3.1 BASIC DEFINITIONS


    An information network can be a generalization of any real world or system that
    comprises people, smart gadgets like mobile phones, two or more computer systems,
    methods, and functions, and frameworks that are organized to collect, process,
    and propagate data. It can be formally defined as follows:


    # Definition 1: Information Network


    It is defined as a directed graph or digraph G = (N, E) consisting of the set
    of N-nodes and E-edges, which are ordered pairs of elements of nodes, where nodes
    and edges are respectively called as objects and links.


    There will be a large number of objects and their links between various objects.
    Hence, a set of objects and their associated links can be represented in a simpler
    way as follows:


    Object Set: O

    Associated Links: L


    Then its mapping function can be described as:


    ```

    $\Phi : N \rightarrow O(Object-type Mapping Function)$

    $\Psi : E \rightarrow L(Link-type Mapping Function)

    ```


    Every object (o) in the set set (O) will belong to its own object set,

    O = {$o_1, o_2, o_3, o_n$}\ni.e. $\Phi(o) \in O$'
