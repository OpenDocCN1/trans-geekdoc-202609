    # 6.1 INTRODUCTION


    Blockchain (BC) is a secured information sharing platform that used distributed
    technology. Each distributed node is connected together to form a BC. All nodes
    are connected to one another with immutable time stamp treated as an open digital
    ledger. Distributed nodes are linked to one another in a linear order and form
    a BC data structure. Each linked node has pointer reference to refer to the next
    block in a BC network. Immutability, decentralization, security, increased capacity,
    and anonymity are characteristics of BC technology (Figure 6.1).


    Each block in BC has two parts: a header and a data payload. The header stores
    the information of each chain length and content; transaction details are stored
    in the payload. Hash value (32-bit SHA256) is calculated to give information about
    the previous block.


    # 6.1.1 BC INTERNET OF THINGS


    Internet of Things (IoT) connects machines from home or office on a different
    domain through Internet to collect and control the element to perform some task.


