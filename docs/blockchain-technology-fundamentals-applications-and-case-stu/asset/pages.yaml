  md: '# 7.1.3 SECURITY AND FRAUD DETECTION IN BLOCKCHAIN TECHNOLOGY


    Transfer of digital currency is different from transfer of patient personal data.
    Massive amount of personal health data are formed through hundreds and thousands
    of visits. It would be cumbersome for clinicians to search the entire chain and
    access specific data in a timely manner. Blockchain technology uses numeric public
    keys to protect data of each and every individual [14,15]. It is impossible to
    hack or attack data in the blockchain-driven health system. They cannot find whose
    data it was or operate the data as they can operate like traditional DBDMS. Likewise,
    in a blockchain health system, a physician cannot have access rights to all patient
    records. This sophisticated and intuitive technology addresses all issues that
    could be an alternative for all current health issues.


