    change by the hacker in the tree will get reflected in the blockchain [12]. Once
    the transaction is complete and the verification of the block is done, all hashes
    in the tree are discarded by the other than the root hash that gets added in the
    block header. Bitcoin established a simplified payment verification (SPV) system,
    which uses the copy of the block header instead of the full transaction history
    [9,10].


    **Bitcoin mining:** the creator of block initiates the first transaction by generating
