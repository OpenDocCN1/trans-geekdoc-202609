    # 4.10.1. Economy


    The inclusion of blockchain in IoT makes the system more economical. IoT has centralized
    architecture with high-end servers, processors, and multiples of protocols, which
    incur higher overhead and maintenance costs. Since the blockchain is distributed
    in nature, the architecture cost is considerably low, which in turn benefits the
    IoT.


    # 4.10.1.2 Transaction Speed


    Blockchain has easy access of the blocks in a secured, reliable way, which can
    enable the automated exchange of data. IoT data access is sped up with the blockchain
    because the third-party acceleration for the transactions is eliminated.


    # 4.10.1.3 Decentralization


    IoT, as discussed earlier, is a centralized technology that has its own drawbacks
    of overall cost, maintenance, and single point of failure. But the inclusion of
    blockchain in IoT makes a decentralized system where the failures and errors in
    the transactions are not propagated. Figure 4.14 depicts the centralized (Figure
    4.14a), decentralized (Figure 4.14b), and distributed (Figure 4.14c) network skeletons.


