    Researchers are constantly working on improving the efficiency of blockchain by
    improving the throughput and scalability, and also working on adding privacy in
    order to use it for a wide range of applications. As an attempt to include privacy,
    permissioned blockchains are introduced, sacrificing the decentralized nature
    of blockchain. Ethereum, Ripple, and Hyperledger are a few to name. The private
