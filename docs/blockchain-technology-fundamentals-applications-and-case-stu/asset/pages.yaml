    # 2.2 BLOCKCHAIN PROTOCOL


    A blockchain protocol is a prevalent term used for agreements. These agreements
    are used for transaction validation within a blockchain network. Consensus protocol
    forms the basics of blockchain. It clearly specifies the working of blockchain.
    Usually, blockchain works on predefined rules which are agreed upon by all the
    participating nodes in the network. These rules include the following:


    +   * Rules for governing and validating transactions

    * An algorithm that defines the mechanism for all participating nodes to interact
    with each other

    * Application programming interface.


    The rules that govern a blockchain network are referred to as blockchain protocols.
    They are essentially the common communication rules that the network plays.


    # 2.2.1 IMPORTANT FEATURES OF A BLOCKCHAIN PROTOCOL


    +   * Distributed ledgers: Distributed ledgers are a collection of database records.

    * Smart contracts: For transactions, embedded script can be used in the blockchain.

    * Consensus algorithm: An algorithm that defines the way consensus will be reached
    on the network to verify the transactions.

    * Coins: Every blockchain protocol needs a digital asset to keep the network running.
    These are also used as incentives for the people who participate in the network.
    This entails the presence of digital assets such as coins and tokens. The two
    terms are often used interchangeably in the concept of blockchain but there is
    a difference between the two. Coins are defined at the lowest level by the protocol
    itself. Coins are the native digital asset of a blockchain network. For instance,
    bitcoin protocol''s native currency is bitcoin.

    * Tokens: Tokens are the digital assets that are defined at a higher level not
    by the protocol but by smart contracts. For instance, the Ethereum protocol has
    a native coin Ether.'
  merge: -1
