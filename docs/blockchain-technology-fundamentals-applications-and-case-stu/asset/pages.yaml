    in transactions. Even though another layer of privacy is ensured in blockchains
    by the help of private transactions, it moves towards a central entity as verification
    of transactions and controls are in the hands of the owner of the private blockchain.


    To achieve privacy of data in blockchain, preserving its decentralization nature,
    another breakthrough in theoretical computer science, namely, Secure Computation,
    is used along blockchain.


    # 9.1.2 SECURE COMPUTATION


    Secure computation


    Consider a set of parties who do not trust each other, nor the channels by which
    they communicate. Still, the parties will correctly compute some common function
    of their local inputs while keeping their local data as private as possible.'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'In other words, "combining information while protecting it as much as possible
    is termed as secure computation". When the number of parties involved in computation
    are only two, then it is called as Secure Two-Party Computation or simply as Two-Party
    Computation, denoted as 2PC.


    When the number of parties involved are three or more, to compute a common function
    without revealing their private data, it is termed as Secure Multiparty Computation,
    or as Multiparty Computation by MPC. Election can be considered as an example
    of multiparty computation; voters want their votes (and their identity) be kept,
    and at the same time it has to be counted. Another example is conducting a study
    of new disease without revealing the individual test reports of patients or their
    identities. The baseline is, computation has to be done on private data without
    exposing them, and the outcome should only reveal the desired output, and whatever
    minimal information leaked by it. A day-to-day life problems ranging from as coin
    tossing and mutual agreement to complex applications such as e-voting, electronic
    auctions, private data retrieval, analysis of sensitive information to conduct
    research on without exposing them, preserving biometric identification, private
    editing in cloud, can be solved by secure computation.


    Secure computation protocols are classified into four dimensions depending on
    the circuit model, network model, and adversary model (Patra, 2015). Regardless
    of the density, the first step in any secure computation protocol is the construction
    of Garbled Circuit (GC). Since the mathematical expression underlying any distributed
    problem can be represented either as a Boolean circuit or as arithmetic circuit
    over a finite field, the choice of circuit model depends on the function to be
    computed. Nonlinear operations such as comparison, greater than, less than, etc.
    are represented in Boolean circuits.


    Garbled circuit construction on computational setting with underlying Boolean
    circuits with two-input one-output-gates are described in Lindell and Pinkas (2009).
    In this classical circuit construction, two random value bit-strings corresponding
    to 0 and 1 bit inputs are assigned to each of the inputs. These random values/keys
    are encrypted according to the gate type. Encryption is carried out twice; and
    on the values obtained, simple permutation is applied to form the garbled table
    entries, resulting in garbled circuit of the required functionality (Innocent
    and Seta, 2014a; 2014b). Yao''s garbled circuit construction for a single gate
    is given in Appendix 9.1.


    Yao''s design uses double encryption per wire (Lindell and Pinkas, 2009), which
    increases the computation time. As the size of circuit increases, complexity also
    increases, resulting in impractical protocols. To overcome this bottleneck, improvement
    in efficiency is needed, which clearly indicates the need for optimization in
    garbled circuit design. The following are well-known major optimizations on garbled
    circuit design.


    # 9.1.2.1 Point-and-Permute Technique


    After the garbled circuit is generated and sent to the evaluator, evaluation takes
    place in order to find the required output. The correct row to be decrypted has
    to'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# FGUGChain: Blockchain Application Framework 143


    identified with some mechanism in order to maintain correctness and avoid unnecessary
    decryption of all the rows during evaluation. It is achieved with the help of
    point-and-permute technique (Naor et al., 1999), which provides a pointer to the
    row to be evaluated. The color added during garbling of gates provides a pointer
    to the row, which has to be decrypted during evaluation, to maintain correctness.


    # 9.1.2.2 Free-XOR Technique


    One of the best optimizations in garbled circuit construction with Boolean circuits
    is the free-XOR technique (Kolesnikov and Schneider, 2008). This skips the complex
    encryption/decryption cycles whenever a XOR gate is encountered. The output of
    XOR gate is scrambled, it does $\oplus$ operation on the inputs, which is a basic
    encryption; however, complex encryptions are avoided for XOR gates. The working
    is as follows: three or more XOR gates are converted into two input XOR gates,
    and free-XOR is carried out. Considering $X_0^a, X_0^b$ as the input values of
    XOR gates considering $(0,0)$, the output is obtained as $X_{out} = X_0^a \oplus
    X_0^b \oplus R$, where R is a globally used random value on protocol. They proved
    simulation-based security of their protocol and showed that the simulator output
    is indistinguishable from the original protocol output.


    # 9.1.2.3 Garbled Row Reduction


    According to the Garbled Row Reduction technique (GRR) (Pinkas et al., 2009),
    the size of GC is substantially reduced concerning the number of table entries.
    In this technique, one garbled value is defined as a function of two input values.
    It replaces the consideration of the two garbled gates defined randomly as part
    of the output wires. The garbled gate of the there need not store the value corresponding
    to the output, and, during evaluation phase, without storing the garbled gate
    the corresponding garbled output can be computed. Even though they claim that
    GRR and free-XOR are noncompatible, they are able to show improvement in efficiency,
    as one-fourth of the message to be communicated is reduced, which results in improved
    communication complexity as well as a marginal value in computation complexity.


    # 9.1.2.4 Topological Sorting of Gates


    Might Be Evil (Huang et al., 2011) showed how topological sorting of gates can
    be used and circuit generation can be pipelined without storing the entire garbled
    circuit. It also introduced oblivious extension along with the usage of point-and-permute,
    garbled row reduction, and free-XOR optimizations.


    # 9.1.2.5 Dual-Key Cipher


    Bellare et al. (2012) changed the view of GC as for secure computation protocol
    design to make a cryptographic goal. Dual-key cipher (DKC) introduced by them
    for faster construction of garbled circuits using Boolean gates makes only one
    complex encryption per wire, and reduces the computation time drastically. They
    call the garbled circuit constructionに対し scheme, and as a separate graphical it
    needs optimization. They prove indistinguishability-based notion of'
