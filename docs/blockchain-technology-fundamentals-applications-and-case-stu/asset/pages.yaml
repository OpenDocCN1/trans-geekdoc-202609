  md: '# Ripple Protocol Consensus Algorithm (RPCA)


    RPCA is executed periodically by all the nodes to sustain the agreement and accuracy
    of the Ripple network. When the agreement is reached, the ledger currently working
    with it is the last closed ledger once is closed. This ensures that the consensus
    is successful and the network does not contain any fork [27,28].

    RPCA executes the following steps in each round and the steps are next


    +   - Primarily, all prior valid transactions are identified by the server before
    it begins with the consensus round and are available in a public list called as
    "candidate set".

    - The next step of the server is to merge all the candidate sets on its Unique
    Node list and vote on the genuineness of all Ripple transactions.

    - A minimum percentage of "Yes" votes are considered for all the transactions
    to pass to the next round. The transactions that fail to get "Yes" are either
    added in the candidate list to be utilized for the next ledger or be discarded.

    - The last stage is to consider the Server''s Unique Node vote on the transaction;
    the expected percentage of vote is 80% and the transactions are accepted and added
    to the ledger once the requirement is fulfilled and the ledger is closed, which
    becomes the last closed ledger.


    # Advantages of Ripple


