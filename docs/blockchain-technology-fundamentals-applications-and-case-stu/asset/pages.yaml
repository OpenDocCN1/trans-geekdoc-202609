  md: '# 8.3.1.3 Features of Bitcoin


    The following are the features of bitcoin:


    +   - Decentralized peer-to-peer digital network for the payment transaction.

    - No involvement of third party, results in the removal of third party trust verification.

    - The security process used is irreversible, which protects the online transaction
    from hackers.

    - The timestamp system used by the bitcoin guarantees the sequential order of
    the transaction.


    # 8.3.1.4 Transactions


    Nakamoto proposed a bitcoin with a P2P decentralized architecture with a time
    stamp server that makes the order of the transaction in a proper way [9,10]. A
    cryptocurrency is a chain of digital signatures, and each transaction is a set
    of digitally signed hash value of the descended transaction and the public key
    of the next block. The purpose of private and public key combination is to provide
    an asymmetric key cryptography. The private key is used by the initiator of the
    transaction to encrypt the transaction, and the public key is used by all participants
    to decrypt and verify the transaction (Figure 8.6).


    The state of the transaction defined in the bitcoin is called the status of all
    the existing bitcoin outstanding. The output of each transaction is the new state
    and is defined in the state transition function. The state transition is accepted
    only when the sender of the transaction has enough bitcoins to complete the transaction,
    else the system generates an error. Each transaction is a set of input and output
    that is uniquely identified by its hash value. The output of each transaction
    can be used only once as the next transaction input in the whole blockchain process
    [10,11].


