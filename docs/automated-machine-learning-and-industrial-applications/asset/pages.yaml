  md: '# Automated Machine Learning Model in Secure Data Transmission in Sustainable
    Healthcare Sensor Network Using Quantum Blockchain Architecture


    Kaavya Kanagaraj¹, A. Sheryl Oliver¹, Kavitha V.P.², S. Magesh³ and R. Manikandan⁴*


    ¹Department of Computational Intelligence, School of Computing, College of Engineering
    and Technology, SRM Institute of Science and Technology, Chennai, Tamil Nadu,
    India

    ²Department of ECE, SRM Institute of Science and Technology, Vadapalani, Tamil
    Nadu, India

    ³Department of Computer Science and Engineering, Dr. M.G.R. Educational and Research
    Institute, Chennai, India

    ⁴School of Computing, SASTRA Deemed University, Thanjavur, Tamil Nadu, India


    # Abstract


    Body sensor network (BSN), a monitoring system utilized in a healthcare setting
    based on Internet of Things (IoT) technology, consists of wearable or implanted
    devices. Due to the limited battery capacity and energy supply for sensors in
    BSN, extending the service cycle of the network is a significant challenge. Increasing
    energy efficiency and energy collection is essential for the network to remain
    sustainable. Operators are looking to automate network diagnosis and management
    using machine learning (ML) to operate complex optical communication networks
    cost effectively. This research proposes a novel, sustainable, network-secure
    data transmission technique based on automated machine learning (AutoML). Here,
    the healthcare network monitoring uses a Reinforcement Bayesian Regressive Vector
    Machine. The secure data transmission uses quantum blockchain automated transfer
    machine graph learning. The experimental analysis of throughput, scalability,
    packet delivery ratio, and data integrity is carried out.


    *Corresponding author: srmanimt75@gmail.com'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'New functionalities are needed to enable cognitive, autonomous management of
    optical network security to achieve these goals.


    **Keywords:** Optical network, secure data transmission, AutoML,

    network monitoring, machine graph learning


    # 2.1 Introduction


    Information and communication technology (ICT)-based health surveillance systems
    connect people and infrastructure to improve overall quality of life. In addition
    to supporting the fundamental requirements of health monitoring systems, industrial
    stability, sustainable development, quick accessibility, and access to dependable
    medical care are targets that are reached by mandating and appropriately transmitting
    data from dedicated networks [1]. Wireless body area networks (WBANs), which scientists
    and researchers have developed, are made up of tiny sensors with wireless communication
    capabilities that can be put inside patients’ bodies. The devices continuously
    gather biological signals from patients in hospitals and quarantine facilities
    using various sensors and then transmit the data collected to the local analysis
    unit (LPU). To improve health warnings so that healthcare practitioners can quickly
    respond by taking preventative measures when they see patients’ falling health
    conditions or any emergency, LPUs should be robust and capable of processing health
    data in real time. LPU data may also be transferred to distant databases (DB)
    for long-term study and preservation [2]. WBANs have several advantages, including
