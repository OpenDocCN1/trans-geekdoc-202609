    # 6.1 Introduction


    Nowadays, customer relationship management is explicitly driven by emerging technologies.
    Companies developing and using Customer Relationship Management (CRM) are dependent
    on technology that penetrates the mind of the customer to know what they think
    about their products. Technologies, such as predictive modeling, deep learning,
    augmented reality, and machine learning, play a vital role in developing many
    applications related to decision support in CRM systems. It is further extended
    to assessing customer''s needs, analyzing them, and offering products they are
    likely to purchase. Artificial intelligence is helping companies, like Google,
    Amazon, Flipkart, Facebook, and many more, to know customer reviews comprehensively,
    analyze customer needs and demands, and provide a better customer experience,
    which automatically increases sales and production for the companies. On a daily
    basis, every minute, billions of data are generated by every customer and marketer
    in public forums in the form of tweets, posts, comments, pictures, and videos.
    These are treated as customer reviews, online purchase reviews, and online activities.
    Corporates are mining this database to offer products based on customer interests
    and likeliness.


    The rise of web application has transformed the internet from primarily an information
    source to a platform where opinions hold greater significance. In this digital
    landscape, whether it is a product featured in an'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'online store or a post on a preferred social network, users can comment on
    or rate virtually every piece of information. Surveys indicate that a significant
    majority of internet users conduct research on products before making a purchase.
    Specifically, within the realm of tourism, consumer product reviews play a vital
    role in influencing purchase decisions. The utilization of available opinions
    is not only exciting for companies but also holds value for users.


    # ## 6.1.1 Opinion Mining or Sentiment Analysis


    Social network competes against exceedingly a significant position in the daily
    lives of nearly everyone providing an environment for individuals to denote or
    convey their conception and sentiments regarding by-products on e-commerce websites.
    This expression is commonly referred to as an opinion or reviews [1]. Its goal
    is to ascertain the writer’s mood or the speaker’s attitude, which can lean either
    positively or negatively toward the product. The emotions, whether favorable or
    unfavorable, articulated by individuals are termed sentiment.


    There are several challenges because an opinion word may seem positive in one
    situation but becomes negative in another. Another challenge is that people may
    not provide the proper or exact words related to their opinion. In addition, confusion
    arises when both positive and negative comments are present in one single review,
    which is understandable for humans but very complicated for machines to process
    [2]. Therefore, the process involves the use of Natural Language Processing, text
    analysis, and computational linguistics to recognize and derive instinctive direction
    from the reference material. Text categorization can be done using ML or DL techniques.


    # ## 6.1.2 Machine Learning Approaches


    Numerous approaches were available for the classification and prediction of opinions.
    Two of the most prominent methods employed in opinion mining and prediction include
    ML and lexicon-based approach. An alternative technique that turned out to be
    extensively used is hybrid approach, which optimizes the results by collaborating
    lexicon based and ML approach. With the primary goal of assisting in strategic
    planning and business decision making, the machine learning approach is based
    on text analysis and classification. To do this, pre-processing of the text is
    necessary. Then, it involves training a model using data enabling subsequent predictions
    on new and unlabeled datasets. The following two methods are main learning approaches
    that are shown in Figure 6.1.'
