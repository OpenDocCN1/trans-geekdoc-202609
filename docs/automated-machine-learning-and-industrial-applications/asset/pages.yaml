    # 6. Model Evaluation


    Model evaluation is vital in Neural Architecture Search (NAS) for AutoML, as it
    measures the model''s routine on training and test datasets. This procedure can
    be complex and resource intensive. Advanced methods, like ENAS and DARTS+[66],
    aid to speed up evaluation but may affect accuracy.


    +   A. Weight Sharing: This method reduces computational costs by allocating parameters
    among dissimilar models. For example, FairNAS [67] and Single-Path NAS [68] use
    weight sharing to cut exploration costs significantly.


    ![](img/5510bd7390ed7002b5774fe8c2be9eff_315_0.png)


