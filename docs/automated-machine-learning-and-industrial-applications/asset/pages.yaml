- pgno: 316
  md: 'B. Early Stopping: This regularization method stops overfitting by halting
    training when performance stops improving. Techniques like DARTS+ and MiLeNAS
    [69] use early stopping to hasten the search process and decrease costs. Figure
    14.4 describes the early stopping method in an overfitting or underfitting graph.


    # 14.3 AutoML Components


    AutoML approaches can also be categorized into three main components as follows:


    # 1. Search Space


    The search space in machine learning describes all design choices, including learning
    algorithms and their hyperparameters. Hyperparameters can be categorical (e.g.,
    kernel types for SVMs) or numerical (e.g., learning rates). The combined procedure
    selection and hyperparameter (CASH) problem treats algorithm choice as a hyperparameter
    and is tackled using hyperparameter optimization (HPO) techniques.


    Categorical Hyperparameters: These take discrete values without any inherent order,
    like different kernel types in SVMs [70].


    Numerical Hyperparameters: These are defined over a numeric range, such as learning
    rates or kernel widths [71].


    Conditional Hyperparameters: Some hyperparameters depend on others. For example,
    kernel width is relevant only for kernels.


    Hyperparameter optimization techniques handle these differently. For instance,
    log transformation can be applied to numerical hyperparameters to emphasize smaller
    values. Techniques, like weight sharing reduce computational costs, while early
    stopping prevents overfitting by halting training when performance plateaus [72].


    # 2. Search Strategy


    In AutoML, search strategy or algorithm refers to exploring the search space to
    find the best machine learning models and hyperparameters. The following are some
    common search strategies: i) Grid Search, ii) Random Search, iii) Bayesian Optimization,
    iv) Evolutionary Algorithms, v) Reinforcement Learning, and vi) Gradient-Based
    Optimization [73].


    These strategies aim to automate and optimize the procedure of selecting and tuning
    machine learning models making high-performance models more reachable.'
  merge: -1
  img_proc: true
- pgno: 317
  md: '# 3. Performance Evaluation


    In AutoML, performance evaluation refers to the procedures used to assess the
    efficiency of the models generated during the automated machine learning process.
    This step is vital for determining which models attain best on a given dataset.
    The following are the key features of performance evaluation in AutoML:


    Evaluation Metrics: Metrics, such as accuracy, F1 score, precision, recall [74],
    and area under the ROC curve (AUC), are typically used to evaluate classification
    models. For regression models, metrics, like mean absolute error (MAE), mean squared
    error (MSE), and R-squared, are used.


    Cross-Validation: This technique includes splitting the dataset into numerous
    folds and training the model on diverse subsets while validating on the outstanding
    data. It guarantees that the model works consistently across various data splits.


    Holdout Validation: A part of the dataset is set aside as a validation set, and
    the model is skilled on the outstanding data. The performance of the validation
    set is meant to assess the model [75].


    Learning Curves: These plots uncover problems, such as overfitting or underfitting,
    by displaying the model''s progress over time on the training and validation sets
    [76].


    Hyperparameter Tuning: Finding the best model settings involves evaluating several
    hyperparameter setups via performance evaluation.


    Model Comparison: AutoML systems often generate multiple models, and performance
    evaluation helps compare these representations to select the best one.


    # 14.4 Application


    The application of AutoML is gaining prominence, particularly among researchers
    and business professionals. Despite its diverse use cases, its impact extends
    broadly. Some of the applications are described below.


    **Democratizing AI:** A wider range of people without extensive technical knowledge
    may now utilize AI by having complicated processes, like model selection, feature
    engineering, and hyperparameter tweaking, automated. Anyone can now create machine
    learning models without having to be an expert in data science, from researchers
    to small enterprises.'
