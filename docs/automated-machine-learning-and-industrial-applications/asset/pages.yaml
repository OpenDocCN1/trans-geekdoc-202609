    detect the subjectivity of the user text. If there is no subjectivity, it indicates
    that the user text is not suitable for analysis as it does not contain any sentiment.


    # 7.3.2 Trilateral Modifier Utilization


    Modifiers are adverbs that change the strength of words. Not all adverbs amplify
    the result of the related adjective; some adverbs dampen it to a sensible extent.
    Modifiers either strengthen or lessen the sentimental strength of the opinion
    word. These are employed as modifying components in several sorts of speech. Their
    principal purpose is to accentuate a changeable trait in the element to which
    they apply.


    Modifiers are interesting possibilities for identifying sentiment strength on
    a more detailed scale. The proposed methodology categorizes the'
