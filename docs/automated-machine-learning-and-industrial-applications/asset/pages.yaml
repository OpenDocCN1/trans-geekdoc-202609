- pgno: 138
  md: 'AutoKeras, named AutoCRM, simplifies the creation of neural network architecture
    models with optimized parameters.


    AutoModel combines model selection and optimized hyper-parameters to form the
    text classifier AutoKeras model. The search space is nothing but the model selection
    with corresponding parameters such as Max_trial, Overwrite, Objective, Tuner,
    Multilabel, Directory, Project_Name. etc.


    +   **Max_trials**

    +   Max_trials is a parameter that determines the upper limit on the number of
    distinct neural network architectures the system will evaluate in its quest to
    discover the optimal model. This parameter signifies the maximum count of unique
    combinations of hyper-parameters and architectures with techniques such Bayesian
    optimization, Random Search, etc. AutoKeras will perform up to the max_trial number.
    This search involves various combinations of layers, operations, and hyper-parameters
    to build and train different neural network architectures. Each trial corresponds
    to a different candidate model with a specific set of hyper-parameters such as
    block_type, classification head, dropout, optimizer, and learning rate. After
    reaching the maximum count, AutoKeras stops the search and returns the best model
    found during the trials.


    +   **Overwrite**

    +   It determines a true or false condition: whether to discard any previous results
    and start a new search process or to resume the search from where it left off.


    +   **Objective**

    +   The foremost goal of this parameter is to perceive the architecture that performs
    the best according to the specified objective metric. For text classification,
    it includes Val_accuracy and Val_Loss. The model is created with Val_accuracy,
    which is to strengthen the accuracy of the tasks.


    +   **Tuner**

    +   The model will be searched with various tuners, and the best model with a
    tuner will be selected for the classification. The AutoCRM model is created by
    choosing Bayesian optimization, random search; Hyperband or Grid search based
    on the computational resources and desired level of exploration in a hyper-parameter
    space.'
