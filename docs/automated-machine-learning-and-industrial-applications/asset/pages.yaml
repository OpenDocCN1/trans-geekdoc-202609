- pgno: 28
  md: '# 1. Automated Feature Engineering


    A data feature contains a segment of input data for a machine learning model,
    and feature engineering takes the transformative process wherein a data scientist
    finds new information from existing data. This process looks out as a crucial
    value-adding phase in a machine learning workflow, with the quality of features
    distinguishing between a model of performance and one that excels. These mathematically
    changed raw data form the core of the machine learning process. Automated feature
    engineering (AFE) is the consistent exploration of reasonable feature combinations
    in a mechanized, as opposed to manual.


    Manual feature engineering, often compared to modern-day experiment, comes with
    a significant time cost—constructing a single feature can take hours, and the
    absolute number of features required for even a simple accuracy score, let alone
    a production-level baseline, can reach into the hundreds [17]. By automating the
    exploration of the feature space, AutoML dramatically minimizes the time a data
    science team spends on this process, from days to mere minutes.


    The benefits of automated feature engineering spread beyond time savings for data
    scientists. The generated features are inherently interpretable. In regulated
    industries, like healthcare or finance, interpretability is vital, as it reduces
    barriers to AI adoption. Moreover, the simplicity of these features enhances the
    application and actionability of high-quality models for data scientists. Automatically
    generated features also have the potential to determine new key performance indicators
    (KPIs) for an organization to monitor and act upon. Following feature engineering,
    data scientists progress to optimize their models through planned feature selection.


    # 2. Automated Hyper Optimization


    Hyperparameters in machine learning algorithms can be compared to devices for
    fine-tuning model performance, where even small adjustments can have a substantial
    impact. In small-scale data science modeling, hyperparameters can be manually
    established and optimized through trial and error.


    However, for deep learning applications, the number of hyperparameters rises exponentially
    increasing the feasibility of manual optimization within a reasonable timeframe
    for a data science team. Automated hyperparameter optimization (HPO) improves
    this challenge by permitting teams to explore and optimize across the full hyperparameter
    space in an automated manner allowing them to focus on iterating and experimenting
    with features and models [18].


    Automating the machine learning process also allows data scientists to shift their
    focus from the “how” of model creation to the “why.” With huge'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'amounts of available data and numerous questions to address, analytics teams
    can now concentrate on defining which aspects of the model to optimize for. For
    instance, they can address classic problems like minimizing false negatives in
    medical testing.


    # 3. Neural Architecture Search (NAS)


    The most complicated and time-consuming method of deep learning is in structuring
    the neural architecture. Data science officials invest reasonable time in choosing
    appropriate sections and learning rates by mostly focusing on weights in models,
    especially proven in language models. Neural Architecture Search (NAS), stated
    as “making use of neural nets for designing neural nets,” reaches out as a major
    candidate for automation in the arena of machine learning.


    NAS explores by finding architectures to learn, with the result determined by
    the metric against which every architecture is measured. Many algorithms can be
    used in a neural architecture group [19]. For example, if the required number
    of architectures is less, random options for testing can be done. Gradient-based
    approaches, transforming the discrete search space into a continuous illustration,
    have proven very effective. Alternatively, data science officials may practice
    with traditional algorithms, where architectures are measured and changes are
    slowly applied, developing more successful child architectures while reducing
    unsuccessful ones.


    While neural architecture searches are a significant component of AutoML, using
    the democratization of AI, they frequently come with a considerable carbon footprint.
    An examination of these compromises is still pending, and an ongoing study in
    NAS methods is exploring optimization for environmental costs.


    # The Journey of Automated ML in the Industry


    The workflow of the machine learning segments are automated by AutoML using some
    set of methods and practices. The tools used for automated ML focus on automating
    many stages of a typical machine learning pipeline to make the process easier
    for non-experts to create machine learning models. This pipelining removes the
    repeated tasks and creates seasoned machine learning engineers for building the
    models faster [20].


    Artificial Intelligence highly creates an impact in fields like education, healthcare,
    agriculture, industry, and environmental challenges. However, many areas still
    face challenges in deploying machine learning models effectively due to time,
    resources, talent, and trust. There was a huge requirement for human expertise
    in traditional machine-learning processes. Before starting to work with machine
    learning algorithms, the company seeks data'
