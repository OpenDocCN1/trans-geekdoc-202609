  md: 'Modern agricultural techniques are depending more and more on artificial intelligence-based
    systems that can identify a variety of disorders [18]. In the past decade, various
    conventional ML models have been introduced for the identification and categorization
    of plant diseases. Rumpf et al. employed Support Vector Machine (SVM) to explore
    the initial identification and categorization of illnesses in sugar beet using
    spectral plant guides [19]. Al-Hiary et al. employed a segmentation approach by
    utilizing k-means clustering on preprocessed features to identify and differentiate
    five distinct diseases in plant leaves. Following texture and color-based extraction
    of features, Artificial Neural Networks (ANN) were then used to classify those
    regions [20]. Revathi and Hemalatha suggested a technique to identify six distinct
    disease kinds that are present on cotton leaves. They propose an approach that
    uses Particle Swarm Optimization to choose characteristics from a feature vector
    that includes color, texture, and edge-based features acquired through image processing.
    The disease is subsequently classified using a Cross Information Gain Deep Forward
    Neural Network [21].


    Mokhtar et al. conducted an investigation employing the Support Vector Machine
    (SVM) technique to detect and identify two distinct viruses, which cause disease
    and exhibit symptoms on tomato leaves [22]. In a separate study, Pantazi et al.
    utilized features extracted from the Local Binary Pattern method to identify three
    different vine leaf diseases through the Support Vector Machine (SVM) approach
    [23]. In a different study, Johannes et al. suggested using Naive Bayes classification
    system and image processing-based candidate hotspot detection for mobile-based
    initial stage diagnosis of three distinct wheat diseases. They tested their suggested
    approach in a real-world field setting using cellphones [24]. To automate the
    identification of plant diseases, Chen et al. have recently introduced a novel
    model known as the GMDH (Group Method of Data Handling) logistic algorithm [25].
    Categorizing using machine learning involves a demanding process known as feature
    extraction, which directly influences the nature of classification.


    DL architectures, which use methods to analyze raw data without the necessity
    for custom features, represent a performance breakthrough. This is made feasible
    by the enhanced capabilities and speeds of Central Processing Units (CPUs) with
    Graphical Processing Units (GPUs) [26]. Deep neural network styles, which have
    numerous layers and neurons for processing information, achieve exceptionally
    well at handling difficult tasks, like voice and image recognition, while handling
    massive amounts of data with ease. DL methods are frequently used in medical applications
    to identify and classify diseases from medical images [27]. However, a review'
