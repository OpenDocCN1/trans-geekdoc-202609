  md: '# Open-Source Tools in Automated Machine Learning


    # Abstract


    Explainable AI (XAI) is the current trend set that has a potential to allow the
    user to understand the prediction made by machine learning and deep learning models.
    The nature of transparency and accountability of XAI impose and attract the researchers
    and industries to adopt a responsible technological model for AI development.
    XAI has the potential to comprehend how the machine learning and deep learning
    models produce results in what basis the classification and prediction result
    is obtained. The interpretation of the results is made easy using XAI by overcoming
    the drawbacks of AI that is considered as a “black box” model. This chapter discuss
    the various open source tools in Automated Machine Learning.


    Keywords: AutoML, open-source tools, XAI, AutoGluon, Auto-Sklearn, clinical outcomes,
    deep learning


    # Introduction


    There are many advantages of AI-based decision making models that led to a specific
    outcome in which XAI interprets the results and gives a clear understanding about
    a decision-making process in an efficient way. With XAI, industries can gain knowledge
    about the decision making of an AI-enabled system to improve user experience and
    satisfaction. XAI is also used to enhance the business process by improving the
    model’s performance. Stakeholders can understand and gain insights into the underlying
    model’s behavior, compare model predictions, identify risks, and optimize


    *Corresponding author: ksanthi@vit.ac.in'
