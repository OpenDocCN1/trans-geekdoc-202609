  md: '# 4.3.2 Normalization and Scaling


    A vital step in making an Auto ML-based tool for agricultural disease prediction
    [14] is data preprocessing, which intends to improve the input dataset and make
    it suitable for effective machine learning model training. As it was stated by
    authors [14], data cleaning is an important step that removes unnecessary or redundant
    information and fills any gaps in the data by imputation or elimination. The consistency
    of the image can be restored through proper image scaling and normalization that
    provide uniform pixel values and resolutions across images. By exposing the dataset
    to a variety of changes, data augmentation techniques, like rotation and flipping,
    improve model generalization. To avoid biases during training, which can be caused
    by oversampling or under-sampling strategies [15], classes must be balanced. To
    ensure model compatibility, label encoding converts categorical labels into numerical
    representations. The dataset is then further split into training and testing subsets
    for assessment. Whenever there is a need for refinement, feature scaling is implemented
    once outliers are located and represented by the system. Eventually, a comprehensive
    quality check verifies the preprocessed dataset integrity by providing the foundation
    for developing a reliable and accurate model that can successfully predict agricultural
    illnesses.


    # 4.3.3 Feature Extraction and Classification


    The fundamental step in image processing is feature extraction that aims to extract
    relevant information from images for different computer vision applications. As
    the image analysis tasks needs to substantiate crucial traits, patterns, and other
    inherent details of the image, it requires some standard extraction procedures
    such as object recognition, picture classification, and segmentation. Some of
    the standard procedures for extraction are measures of pixel intensity, picture
    translation to other color schemes, and pixel distributions represented by appropriate
    histograms.


    # 4.3.4 Spectral Image Analysis


    Spectral analysis for plant leaf disease prediction involves the use of various
    types of sensors that detect and measure the electromagnetic radiation emitted
    or reflected by plant leaves. The following are some of the most commonly used
    sensors in spectral analysis:'
