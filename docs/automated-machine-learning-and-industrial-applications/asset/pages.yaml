  md: 'The development and improvement of imaging technologies widely used in the
    identification and recognition of plant diseases was accelerated by recent developments
    in sensor-based techniques. In an effort to predict and ideally identify plant
    diseases early on, investigators examined a variety of modelling approaches, including
    artificial neural networks (ANN), SVM, extreme learning machine (ELM) classifiers,
    and DL, among others. Typically, the input for these prediction models consists
    of photos of sick plant leaves.


    Unquestionably, crop plant diseases represent a serious risk to agricultural productivity
