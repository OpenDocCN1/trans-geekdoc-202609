    # 6.4.1 Comparative Analysis: AutoML vs ML


    The same dataset is employed in supervised ML techniques such as NB, SVM, and
    LR. Here, data pre-processing was done as specified in the above steps, i.e.,
    tokenization, stopword removing, stemming, or lemmatization. Feature engineering
    will be done with Term Frequency-Inverse Document Frequency (TF-IDF). TF-IDF is
    recurrently applied in text mining and retrieval of information. This is employed
    toward rearranging the set of unprocessed textual information into a matrix of
    TF-IDF attributes. This transformer takes an accumulation of textual data as input
    and produces a distributed matrix illustration of the documents based on their
    TF-IDF scores.


    After the feature engineering process, the dataset is divided into simple train/test
    sets for learning and evaluation. The model is fitted with the data using the
    corresponding classification algorithm. Then, the model is fine-tuned with the
    optimizing hyper-parameters. This step involves manual process of experimenting
    with different parameter values to improve the model performance. Therefore, this
    optimization tuning will continue until it reaches the best model through iteration.


    The AutoCRM Keras model is compared with traditional ML algorithms connected with
    performance measurements. The accuracy and precision rates are obtained by training
    the prototype with various parameters and finding the resultant one with the best-optimized
    hyper-parameters. This process is done by manually applying various parameters
