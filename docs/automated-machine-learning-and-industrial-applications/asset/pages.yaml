    regarding the application of highly innovative deep learning designs in the detection
    of plant leaf diseases. In particular, there will always be a need for effective
    models that can be trained quickly without compromising performance and with fewer
    parameters. Specifically, there will always be a demand for effectual models with
    fewer parameters that can be trained rapidly without sacrificing performance.
    The primary objective of the proposed E-ENet is outlined below:


    +   1) Input image is received from the PlantVillage dataset.

    +   2) The localization and retrieval of diseased plant leaves is implemented
    by the Region Proposal Network version 2 (RPNv2) algorithm.

    +   3) The diseased region of the leaves is segmented by the Chan–Vese Level II
    algorithm.

    +   4) Finally, the disease of the plant leaves is classified by the E-ENet model.


    # ## 10.2 Literature Review


    Feature extraction, disease recognition, and diseased leaf image segmentation
    are the three main areas of current research on plant disease recognition'
