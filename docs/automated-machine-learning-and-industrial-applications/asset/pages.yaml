    # Architecture of AutoML


    In recent trends, deep learning has started wide application across diverse fields
    choosing amazing success in addressing complex AI problems [13]. Its implementation
    stands within areas, such as image classification, object detection, and language
    modeling, where it has brought attractive results.


    The revolution moment occurred in 2012 when AlexNet outshined in the ImageNet
    Large Scale Visual Recognition Challenge (ILSVRC) processing traditional methods.
    However, more complex and deeper neural networks were introduced with models,
    like ResNet-50, featuring 50 layers and approximately 25.6 million parameters
    [1]. The architecture consists of steps with varying filter sizes, beginning with
    64 filters in the initial stage and completing with 1,024 filters in the fifth
    stage. Each stage contains residual blocks, each of which contains two 3 × 3 convolutional
    layers and a crosscut connection.


    The intensifying costs connected with model development have given a chance to
    a novel concept called the automation of the complete machine learning (ML) pipeline.
    Referred to as automated machine learning (AutoML), this approach improves the
    burden of development costs [14]. In modern times, AutoML systems can integrate
    many techniques making a straightforward and user-friendly end-to-end ML pipeline
    system. Our focus is to create a way of personalized AutoML methods directing
    to the development of the most comfortable AI system.


    The AutoML workflow covers many stages like feature engineering, data preparation,
    model generation, and model evaluation as shown in Figure 1.2. The process of
    model processing can be divided into search space exploration and optimization
    methods. The basic design principles of ML models are consistent within the search
    space and divided into two types as follows: traditional ML models and neural
    architectures. For classification, optimization techniques can be classified into
    hyperparameter optimization (HPO) and architecture optimization (AO) [15]. HPO
    aims to optimize parameters related to training, such as learning rate and batch
    size, while AO aims to enhance parameters linked with the model itself. For example,
    the optimization of the number of layers in neural architectures'
