  md: '# Predictive Maintenance in Industrial Settings: Video Analytics at the Edge
    with AutoML


    Madala Guru Brahmam and Vijay Anand R.*

    School of Computer Science Engineering and Information Systems,

    Vellore Institute of Technology, Vellore, India


    # Abstract


    In industrial environments, the need for predictive maintenance has never been
    more critical for both safety and operational efficiency. Traditional methods
    often involve labor-intensive, manual inspections that are not only costly but
    also less effective in timely fault detection. This chapter explores the amalgamation
    of video analytics, edge computing, and automated machine learning (AutoML) in
    industrial settings to revolutionize predictive maintenance strategies. The proposed
    framework aims to automate and enhance the real-time monitoring and analytics
    of machinery, thereby proactively identifying potential issues before they escalate
    into failures. By deploying edge computing devices equipped with video cameras
    and autoML algorithms, we achieve localized, real-time data processing reducing
    latency and bandwidth usage. Algorithms, such as auto-Sklearn, TPOT, and H2O’s
    autoML, are leveraged to automate the machine learning process, thereby allowing
    the system to adapt and improve over temporal instance sets. The preliminary results
    suggest a significant reduction in unplanned downtime by up to 30% and an increase
    in the accuracy of fault detection by approximately 20% compared to traditional
    monitoring methods. Moreover, the utilization of autoML minimizes the need for
    specialized machine learning expertise making the solution scalable and cost effective.
    The impact of this work has the potential to be transformative for industries
    reliant on heavy machinery, reducing maintenance costs and enhancing operational
    efficiency, while also contributing to safer working conditions. This innovative
    approach represents a paradigm shift in predictive maintenance


    *Corresponding author: vijayanand.r@vit.ac.in'
