    emulation of human intellect in machines enabling them to replicate human thought
    processes and behaviors like problem solving and learning; within this domain,
    machine learning plays a crucial role allowing systems to recognize, comprehend,
    and analyze patterns in data. In the advanced realm of computer science, artificial
    intelligence stands as a major focal point for research and development. Due to
    its robust application in problems that are primarily beyond the capabilities
    of traditional computing structures and humans, as well as its rapid technological
    advancements, this technology is becoming increasingly prevalent rapidly [1].


    Despite the availability of much improved technology, farmers still face many
