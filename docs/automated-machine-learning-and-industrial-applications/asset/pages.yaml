- pgno: 102
  md: 'where P, A, and R are the precision, accuracy, and recall for identification
    of faults. The performance metric for a model mi on the validation set V is given
    via Equation 5.4:


    P(Mi, V) = \frac{1}{V} \sum L(Mi(x), y) \quad (5.4)


    where L is a loss function, x is the input data, and y is the true label. The
    model with the highest performance metric is selected. Once a model is selected,
    the next step is hyperparameter optimization. This process can be formulated as
    a minimization problem where the goal is to find the optimal set of hyperparameters
    \(\theta *\) that minimizes the validation loss, which is represented via Equation
    5.5:


    \(\theta ** = argmin(\theta \in \Theta) [Lval(M(x; \theta), y)] \quad (5.5)\)


    where \(\Theta\) is the hyperparameter space, and Lval is the validation loss
    function. After this, Bayesian optimization is employed for hyperparameter tuning
    due to its efficiency in high-dimensional spaces. The objective is to find the
    hyperparameters that maximize the model''s performance metric. This is achieved
    by modeling the performance metric P as a Gaussian process, which is represented
    via Equation 5.6:


    P(Mi; \theta) \sim GP(\mu(\theta), k(\theta, \theta'')) \quad (5.6)


    where \(\mu\) is the mean function, and k is the covariance function of the Gaussian
    process. The acquisition function A (such as expected improvement) is then used
    to select the next set of hyperparameters to evaluate. Based on this, cross validation
    is used to evaluate the selected model''s performance. For a k-fold cross validation,
    the dataset D is split into k equal parts. The model is trained on k - 1 parts
    and validated on the remaining part. This process is repeated k times, and the
    average performance across all folds is computed via Equation 5.7:


    CV(Mi; \theta **) = k1\sum j = 1kP(Mi; Dtrain(j), Dval(j); \theta **) \quad (5.7)


    where Dtrain(j) and Dval(j) are the training and validation sets for the j-th
    fold, respectively.'
