  md: '# 13.2 Current Day Usage of AI


    The healthcare sector is currently utilizing artificial intelligence (AI) and
    related technologies, which are spreading throughout society and business. Numerous
    facets of patient care as well as administrative procedures used by payers, pharmaceutical
    companies, and healthcare providers may change as a result of these technologies.


    AI has already been shown in numerous tests to be either as effective as humans
    or even more so in medical tasks like illness diagnosis. Radiologists can already
    identify potentially harmful cancers using algorithms, and they may also advise
    researchers on how to create cohorts for costly clinical studies. But before AI
    completely replaces people in medical processes, a number of years will pass.
    In this section, we take a look at some of the current day practices making use
    of AI to make it more efficient.


    # 13.2.1 Deep Learning and Neural Networks


    There is no lack of medical data. Each year, a hospital or clinic generates a
    vast amount of data from tests conducted on patients as well as forms filled and
    operations conducted. Now, if you consider a country or even just a city with
    the amount of data present, a model can be trained to accurately predict, for
    example, based on past data, which particular treatment would be more effective
    for a patient. This has potential to outperform human expertise since the model
    trained would have access to a much larger repository of data than any single
    hospital/clinic could have.


    Neural networks have been used since the past 60 years for mapping inputs to outputs
    and make predictions for new data given to it. They function analogous to how
    the neurons work in the brain where we have different layers in our model with
    separate activation functions, which help process the data bit by bit until we
    get our desired output.


