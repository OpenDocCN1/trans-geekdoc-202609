    # ### 6.1.4 Automated Machine Learning (AutoML)


    ML is a branch of AI that offers a system geared toward learning automatically.
    As a result, ML has become a rapidly evolving field of application and research
    that is updated in a daily manner. Currently, AutoML is one of the most prominent
    and focused fields of machine learning. It holds the potential to significantly
    increase productivity for data scientists, ML engineers, and researchers in the
    field by minimizing recurrent functions with an ML pipeline [3].


    The term AutoML refers to a collection of methods for automatically determining
    the best model for the available dataset. Traditional machine learning algorithms
    needed multiple steps to create a model such as data preparation; pre-processing;
    algorithm selection, learning, and evaluation; parameter tuning; and prediction.


    It leads to complexity due to the lack of sufficient learning involved in implementing
    the machine learning model. Additionally, generating and comparing multiple models
    to choose the optimal one typically demands substantial domain expertise as shown
    in Figure 6.3. AutoML aims to


    ![](img/5510bd7390ed7002b5774fe8c2be9eff_121_0.png)


    Figure 6.3 Automated machine learning process.'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'alleviate these complexities, i.e., to automate the procedural development
    of an entire machine learning pipeline with minimal human involvement. There are
    two main steps in AutoML, they are as follows:


    +   1. How to search for a new model

    +   2. How to derive its optimal performance in an efficient way.


    Despite the availability of numerous services of AutoML in the cloud environment,
    there are three factors that hinder the users during the implementation phase.
    First, utilizing cloud platform services comes at a cost making it potentially
    unaffordable for individuals seeking to employ AutoML techniques. Second, cloud-based
    AutoML often demands intricate configurations involving docker containers and
    Kubernetes posing challenges for individuals without an extensive background in
    computer science. Third, AutoML service providers are commonly described as being
    “Honest but curious,” leading to concerns and uncertainties about the security
    and privacy of user data” [5]. An accessible solution to these challenges would
    be an open-source software that can be easily downloaded and executed locally,
    thereby making AutoML available to a broader audience. In addressing this, AutoKeras
    was implemented.


    # 6.1.4.1 AutoML Core Goals


    The core goals of AutoML include the following [6]:


