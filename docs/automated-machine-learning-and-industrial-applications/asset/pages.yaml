  md: '# The Competence of Customer Support Team for Sentiment Analysis in Chatbots
    Using AutoML


    G. Pradeep* and M. Devi Sri Nandhini†


    School of Computing, SASTRA Deemed University, Thirumalaisamudram, Thanjavur,
    Tamil Nadu, India


    # Abstract


    As a consequence of the rapid expansion of social networks, such as consumer review
    networks, discussion forms, blogging and publishing networks, and other such Internet-based
    networks, the volume of comments and evaluations about day-to-day activities has
    increased tremendously. Sentiment analysis is a significant research area that
    serves as a powerful and efficient technique capable of analyzing such reviews
    and comments to gather valuable insights regarding the various aspects of a product
    or service. Businesses, governing bodies, and individuals may all benefit from
    public sentiment by gathering data and making decisions based on it.


    One of the interesting fields where sentiment analysis finds application is evaluating
    customer’s interactions with chatbots. With an effort to enhance customer service
    and reduce corporate expenses, AI chatbots have been designed for customer support.
    The practice of understanding a customer’s tone of voice and words while communicating
    with a chatbot—whether they are happy, sad, fearful, or angry—is known as chatbot
    sentiment analysis. Just because a customer interacted with a chatbot does not
    mean they will ignore or forget a bad experience.


    Customers seek assistance in resolving issues they may be having with the item
