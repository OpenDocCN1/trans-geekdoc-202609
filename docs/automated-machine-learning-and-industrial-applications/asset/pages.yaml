  md: '# AutoML-Driven Deep Learning for Fake Currency Recognition


    T. Bhaskar1* and E. Gangadevi2


    1Computer Engineering, Sanjivani College of Engineering, Kopargaon, India

    2Loyola College, Chennai, India


    # Abstract


    False copies of genuine items are referred to as counterfeits. The financial industry
    is still quite vulnerable to counterfeit money. There are numerous detection techniques,
    but since there are now free picture manipulation programmers, it has become a
    significant problem in the banking industry. Finding those key regions for evaluation
    is the first task because there are many important regions that are represented
    by currencies. Classifiers can determine if the extracted features are real or
    not. Without classifiers, we may compare the segmented currency image to the region
    of the original note. Yet, that is insufficient to determine the authenticity
    of the specific paper currency image. If we segment the crucial areas, the alignment
    and edges might not match; therefore, phone money note images might be mistaken
    for the real thing. To obtain better results, the classifiers will process the
    extracted features.


    The method for currency recognition using image processing is suggested in this
    chapter. Three elements, color, size, and texture, are utilized in the recognition
    process with this technique. This technology makes it simpler to check the value
    of paper currency at anytime and anyplace, and it uses the CNN (Convolutional
    Neural Network. The integration of AutoML not only accelerates the expansion process
    but also optimizes the performance of the deep learning models making the system
    flexible to various currencies and counterfeit systems. This chapter experimented
    with this approach on all Indian religious groups. The characteristics of paper
    money are crucial in this recognition.


    Keywords: Image processing, AutoML, convolutional neural network (CNN), feature
    extraction, denomination


    *Corresponding author: senthilkumar.n@vit.ac.in'
  merge: -1
  img_proc: true
- pgno: 253
  md: '# 11.1 Introduction


    Due to fraudulent bills being sold in the market and widespread illiteracy, every
    nation today struggles to recognize its own currency. For this reason, automatic
    currency recognition systems are essential. In such a system, accuracy and speed
    are the two most crucial elements. Moreover, accuracy is more crucial than speed.
    By examining the salient characteristics, a currency recognizer recognizes the
    currency and determines the denomination. Researchers suggested a wide range of
    strategies. A handful of them use internal properties, while others use physical
    properties (width, length, texture and color). Every issue in the software industry
    has an answer. Such software solutions allow us to save time and energy. One technique
    that used image processing to identify cash notes existed in the early 1990s.
    Unfortunately, this technique does not consider the authentication of the notes.
    An image input was required for such a system before it begins to do various duties
    on its behalf.


    The banking industry has seen significant technological improvement, which has
    led to the advent of self-servicing to make transactions easy and customer friendly.
    Some banks also bring brand-new recognition procedures, such as cash deposit by
    the user themselves through devices without going to the specific bank. In this
    situation, a currency recognizer is needed to inspect the money and handle it
    in accordance with the denominations.


    A system based on CNN (Convolution Neural Network) technology is suggested in
    this work. Different modules are used to identify the currency depending on the
    structural perspective of the currency notes. The VGG16 model was created to train
    the specified system and provide improved accuracy.


    # 11.2 Literature Review


    Principal Features for Indian Currency Recognition [1] was taken as the motivation
    for this study. In this work, a method for recognizing cash using properties,
    such as the center numeral, latent image, RBI stamp, form, and micro letter, is
    proposed. A training data set is provided to prepare training models. For the
    recognition of paper currency, PCA analysis is explained.


    Currency Recognition using Machine Learning [2] technique helps to identify the
    images accurately. The method for cash recognition using image processing is suggested
    in this paper. This method is based on the following three unique characteristics:
    color, size and texture. The method'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'presented in this paper can be used to determine many different national currencies.
    Only fiat currencies from India will be considered for implementation purposes.
    This technology makes it easy to check the value of money anytime and anywhere,
    and it uses CNN (Convolution Neural Network). Every denomination of Indian currency
    was used in our testing, and the algorithm was able to identify with 95% accuracy.
    To improve the technique''s accuracy, a classification model was created incorporating
    all of the previously listed parameters. Features of paper money are crucial to
    this recognition.


    Currency recognition using image processing [3] deals with identifying images
    with respect to size, color, and texture. In this research, a machine learning
    system that can detect foreign currencies with a high degree of accuracy was provided.
    The suggested procedure may be used to figure out where a banknote came from,
    what denomination it is, and how much it is worth. The method relies on the fact
    that different banknotes from the same country vary in size, color, and text placement
    to determine the denomination value. This study considered the denominations of
    20 as the most popular currencies. Our system can rapidly and precisely locate
    test notes.


    Fake currency detection using an image processing algorithm and machine learning
    algorithm [4] helps detect currency using suitable algorithms. The question of
    identifying whether the provided sample currency is fake is covered in this research.
    Traditional techniques and strategies exist for identifying counterfeit currency
    based on features including color, width, and serial numbers. In this era of cutting-edge
    technology and sophisticated computational approaches, which offer 99.9% accuracy
    for false identification of currency, a number of machine learning strategies
    are proposed. Beyond algorithms, there are other techniques for detection and
    identification, including note-specific photo filtering and properties like color,
    shape, and paper width [5]. According to this research, image processing should
    come first, then K-Nearest Neighbors to detect fake currency. Due to its excellent
    accuracy for small data sets, KNN is a promising option for use in computer vision
    jobs. Utilizing sophisticated computational and mathematical methodologies, for
    the purpose of authenticating banknotes, this collection contains detailed information
    about the entities and traits often associated with cash. Machine learning [9,
    10] and image processing are used in the processing and extraction of data to
    achieve the desired results and levels of accuracy.


    As previously mentioned, many different systems have been put out in various articles
    [6–8], although one may infer from their findings that none of the solutions suggested
    are entirely effective and that it is useless to'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'consider just one parameter while solving this problem. Hence, this chapter
    suggests a method that considers a variety of features to comprehend the differences
    between each note. Our approach is intended to be easily scalable and to produce
    accurate results.


    # 11.2.1 Scope


    The proposed system can be extended toward coin detection and also for fake currency
    recognition. Second, implementation of this work will enable the detection of
    money automatically near toll plazas. This will reduce the waiting time of vehicles
    at the toll plazas. Stolen vehicles can also be identified with the help of the
    presence of an RFID tag in the vehicle. Third, because robots are increasingly
    being used in place of people in the workplace, it is important that all robots
    are able to distinguish between different currencies. Fourth, this system can
    be further implemented for foreign currencies like Dollars, Euros, Tanka, etc.,
    i.e., the denomination of other countries other than India can be added and also
    compared between them.


    # 11.2.2 Objectives


    The main objectives of this application are as follows:


    +   1. To recognize currency notes automatically by image processing with the
    help of mobile application.

    +   2. To perform image processing on inserted image and match with a trained
    data set.

    +   3. To develop an AutoML-driven deep learning that gives a faster and more
    accurate output when compared to the other techniques.

    +   4. Finding clearly distinguishable components during feature extraction and
    then classifying the money to help in detection and identification is essential.


    # 11.3 Proposed System


    The system below consists of four main modules. They are as stated in the breakdown
    structure of the system below, which describes the working of every module in
    the system.'
