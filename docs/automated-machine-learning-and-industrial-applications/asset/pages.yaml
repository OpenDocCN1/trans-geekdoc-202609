- pgno: 105
  md: 'The genetic programming in TPOT includes operations, such as selection, crossover,
    and mutation, applied to the population of pipelines. The selection operation
    is based on a pipeline''s fitness, which is a function of its performance and
    is estimated via Equation 5.14;


    ```

    Fitness(Pi) = f(CV(Pi)) = \frac{P + A + R}{3} (5.14)

    ```


    Crossover and mutation operations are applied to generate new pipelines. For instance,
    in crossover, parts of two pipelines are combined, and in mutation, a part of
    a pipeline is randomly altered, which assists in adding new solutions. Each pipeline
    is evaluated using a k-fold cross-validation scheme, where the mean score across
    all folds is calculated via Equation 5.15:


    ```

    CV(Pi) = \frac{1}{k}\Sigma Score(Pi, Dj) (5.15)

    ```


    where Dj is the j-th fold of the data samples. After these updates, H2O autoML
    automates the process of training and tuning various models, including deep learning,
    ensemble methods, and gradient-boosting machines. The system evaluates a set of
    models m = {M1,M2,...,Mn} and selects the top-performing models based on validation
    metrics, which are represented via Equation 5.16:


    ```

    M * = { Mi | Rank(CV(Mi)) <= k } (5.16)

    ```


    where Rank is the ranking function based on cross-validation performance CV, and
    k is the number of top models to select. H2O uses stacked ensembles to combine
    the predictions of individual models. The ensemble prediction y'' for an input
    x is a weighted sum of predictions from individual models, and is represented
    via Equation 5.17:


    ```

    y''(x) = \Sigma wi \cdot Mi(x) (5.17)

    ```


    where wi is the weight assigned to model mi''s predictions. H2O utilizes randomized
    grid search and Bayesian optimization for hyperparameter tuning process. For Bayesian
    optimization, the selection of hyperparameters \theta is guided by an acquisition
    function A based on a Gaussian process model, which is represented via Equation
    5.18:'
