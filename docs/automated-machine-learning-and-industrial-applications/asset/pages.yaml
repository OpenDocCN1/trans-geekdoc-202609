    # **AutoML in Data Science**


    AutoML refers to the structure guidelines and techniques to automate any or all
    of the steps in the machine intelligence process. It offers easily accessible
    components and tools to expedite and improve the machine process of learning.
    Understanding the machine learning pipeline is helpful before utilizing AutoML.


    Data scientists might concentrate on more difficult jobs using AutoML for automating
    time-consuming testing, sparing them some of their burden and responsibility.
    It also ensures enhanced efficiency and usability in traditional predictive modeling
    frameworks [8].


    Although data science is an extensive field, a data scientist involves several
    kinds of skills that are not completely represented by a single tool or software.
    The domain requires an exhaustive knowledge of the topic as well as the recognition
    and formalization of the problem in a specific way to discuss alternative solutions.
    Information from the real world is usually noisy and unstructured. It includes
    errors in spelling, mismatched labeling, missing values, replication, inconsistent
    units, and abnormalities. The data must be adequately prepared and treated before
    any mathematical calculations are carried out on it.


    The AutoML techniques that have been examined, so far, have limitations to certain
    challenges such as classification and regression. It is not strong enough to handle
    unsupervised machine learning techniques. The objective of AutoML is to support
    data scientists in their roles, not to replace them. It is a good option for creating
    models and enabling people who are not experts to engage with machine learning.
    However, compared to data scientists, AutoML is unable to express business problems
    or use domain expertise for extracting useful features from the data.'
