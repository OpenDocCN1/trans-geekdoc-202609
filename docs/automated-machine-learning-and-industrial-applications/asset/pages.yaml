    marked boundary box and the predicted boundary box. The sigmoid function is chosen
    as the appropriate loss function for binary classification tasks within the neural
    network. Represented by four-dimensional variables (x, y, w, h), a single boundary
    box is characterized by (P_x, P_y, P_w, P_h) as the given boundary box, (G_x,
    G_y, G_w, G_h) as the target boundary box, and (G''_x1, G''_y1, G''_w1, G''_h1)
    as the predicted boundary box. The primary objective is'
