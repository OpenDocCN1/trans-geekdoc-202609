    # 9.6 Types of AutoML Approaches


    # 9.6.1 Fully Automated


    In AutoML solutions that are fully automated, the complete machine learning pipeline,
    encompassing data pretreatment and model deployment, is executed without the need
    for user involvement.


    # 9.6.2 Human-in-the-Loop


    The concept of “Human-in-the-Loop” Automatic Machine Learning (AutoML) solutions
    incorporate a certain level of user engagement enabling domain experts to offer
    input or tailor certain elements of the machine learning procedure.


    # 9.6.3 Model Assisted


    The idea of model-assisted AutoML involves the incorporation of human experience
    with automated methodologies to advance the performance of models or tackle specific
    problems encountered in the machine learning pipeline.


