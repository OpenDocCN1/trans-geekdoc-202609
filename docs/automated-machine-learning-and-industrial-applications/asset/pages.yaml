  md: '# Financial Risk Prediction with Banking Monitoring for Cyber Security Analysis
    Using Automated Machine Learning


    K. Rajkumar¹, Prassanna Jayachandran², Kannan Chakrapani¹, S. Magesh³ and R. Manikandan¹*


    ¹School of Computing, SASTRA Deemed University, Thanjavur, Tamil Nadu, India ²School
    of Computer Science and Engineering (SCOPE), Vellore Institute of Technology,
    Chennai, India ³Department of Computer Science and Engineering, Dr. M.G.R Educational
    and Research Institute, Chennai, India


    # Abstract


    Science and technological advancements encourage ongoing improvements in consumer
    finance, but they also introduce some financial credit hazards. Financial credit
    risk is getting harder and harder to manage, especially with the ongoing expansion
    of Internet banking. This highlights the need for the creation and assessment
    of a unique, all-encompassing machine learning approach that incorporates the
    study of missing data and predictor evaluation into the distress prediction process.
    This research proposes a novel technique in financial risk prediction with banking
    monitoring for cyber security detection using federated learning and automated
    machine learning. Here, users’ banking is analyzed for cyber security detection
    using Gaussian Encoder Belief Network (GEBN). Financial credit risk analysis is
    using metaheuristic autoregressive kernel principal swarm optimization model (MAPSO).
    The experimental analysis evaluates accuracy, mean average precision, recall,
    F-measure, and normalized error. Data from specific examples are used to analyze
    the model’s performance. The findings imply that the suggested model-based data
    mining technique may extract hidden information from the data while optimizing
    input variables.'
