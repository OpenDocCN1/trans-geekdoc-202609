  md: '# 10.1.1 Obstacles in the Agricultural Sector


    # 10.1.1.1 Soil Erosion


    The natural method of soil erosion occurs when water or wind carry soil particles
    from one location to another. Farmers face severe issues when this occurs on a
    large scale. Many factors contribute to soil erosion, such as excessive soil tillage
    that degrades the soil''s condition and reduces water retention. The top soil
    layers are swiftly removed during flooding. To use less water in irrigation, protecting
    soil from wind and water erosion with mulch and crop covers, and limiting livestock
    grazing excessively, are all ways to avert soil erosion.


    # 10.1.1.2 Absence of High-Quality Seeds


    To increase the production of crops, farmers must use high-quality seeds. Achieving
    steady growth in agricultural output is also dependent on it. The distribution
    of superior seeds holds equal significance to that of seed production. Most farmers,
    especially marginal and small farmers, usually cannot afford seeds of good quality
    because of their prohibitively expensive prices.


    # 10.1.1.3 Lack of Contemporary Farming Machinery


    The absence of proper farm equipment is one of the biggest issues farmers face,
    and it can make it difficult for them to adjust to the demands of contemporary
    farming methods. Farmers can have major improvements in their lives when they
    are trained to use the equipment. It is crucial to use the aforementioned equipment.


    # 10.1.2 Challenges of AI in Agriculture


    Many believe that AI is unrelated for farming tasks and only applies to the digital
    world. In general, this assumption stems to an insufficient amount of knowledge
    about AI tools. The general public, particularly those in non-tech fields, is
    not well informed about artificial intelligence (AI), which is causing the agricultural
    industry to adopt AI more slowly. Despite numerous progressions in agriculture
    during its long history, various farmers are still more familiar with using conventional
    systems.'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'Furthermore, suppliers often do a poor job of outlining the benefits of novel
    technologies as well as their applications. Tech firms face a significant task
    in educating the public about the application of AI in agriculture. Despite the
    clear benefits of AI for sustainable farming, there is a need to inform farmers
    about its practical advantages and encourage its adoption in the agricultural
    sector. However, there are still certain obstacles to be addressed.


    # 10.1.3 Existing Plant Disease Identification Methods


    Stunted growth from plant diseases can have a negative impact on yields [3–5].
    Worldwide, an estimated $20 billion or more is lost economically each year [6–8].
    Because of regional variations that could make accurate identification more challenging,
    multiple circumstances present the greatest challenge to researchers [9, 10].
    Traditional techniques often rely on experts, knowledge, and manuals [11], but
    they tend to be expensive, labor intensive, and time consuming. Moreover, they
    face challenges in accurately identifying objects [12]. For this reason, it appears
    that identifying plant diseases quickly and accurately is crucial for the sake
    of agriculture’s economy and ecology. Web technologies have advanced quickly,
    especially the availability of multimodality data from a diversity of sensors,
    such as sensor networks with the Internet of Things [13]. To tackle the issues
    mentioned earlier, this study introduces an innovative plant leaf identification
    model based on DL. The model employs an integrated deep learning algorithm to
    execute image segmentation, identification, and leaf retrieval seamlessly within
    its functionality. The first task is retrieving leaves, but in this complicated
    atmosphere, numerous considerations, like soil and illumination, make accurate
    identification difficult [14].


    Achieving sustainable and efficient agriculture, while preventing unnecessary
    waste of resources, hinges on the initial stage and accurate diagnosis of plant
    diseases. Certain plant diseases lack obvious symptoms, so it is necessary to
    employ sophisticated analytical techniques in cases of such diseases. Nonetheless,
    most of the plant diseases exhibit outward signs, and the currently recognized
    method involves having a skilled plant pathologist visually inspect infected plant
    leaves to identify the disease [15, 16]. Expert and intelligent systems that can
    reliably and independently identify plant diseases provide agriculturalists with
    substantial benefits and are a great help in managing crop health. However, applying
    such a scheme with an easy-to-use smartphone application is also a commendable
    accomplishment for farmers lacking access to agronomic and phytopathological assistance
    facilities [17].'
