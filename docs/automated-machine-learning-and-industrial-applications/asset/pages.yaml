    autoregressive kernel principal swarm optimization model (MAPSO). This research
    suggests a deep learning-based prediction and assessment technique for financial
    market investment analysis. RMB, euro, yen, Canadian, Australian, pound, and Swiss
    franc are the seven major international exchange rate markets from which this
    study examined historical data from to estimate exchange rates. The extraction
    procedure is capable of handling input text that has varying lengths. After extraction,
    it is possible to efficiently filter out false information from financial communications,
    which speeds up the subsequent categorization. After extracting the abstracts,
    sentiment classification is carried out using the GRU model by extracted abstracts.
    The proposed technique in this research is validated through a financial message
    dataset from a financial social network.


    The proposed method''s efficacy may also be demonstrated using abstract extraction
    and GRU strategies. The recognition rate has improved by 2.87% in compared to
    the method of not extracting abstracts. Data restrictions prevent all or hidden
    debt threats from being incorporated into the early warning signal method, which
    is the cause of the shortfall. The methodology for assessing government debt risk
    undergoes further refinement and optimization considering the disclosure of illicit
    concealed debt data from audits and the official calculations about hidden social
    security debt figures.


