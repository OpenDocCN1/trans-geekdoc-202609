    # 7.3 Methodology for Chatbot Sentiment Analysis


    The planned methodology for chatbot sentiment analysis involves three phases:
    subjectivity detection, trilateral modifier utilization, and chat-bot sentiment
    polarity detection. The first phase is subjectivity detection, which finds the
    subjective information from the user inquiry. The second phase searches for the
    presence of modifiers, if any, in the user inquiry, and the third phase aims at
    finding the actual sentiment expressed by the user on a fine-grained scale.'
