  md: 'AutoML research has recently made important strides in both academics and industry
    leading to a flow in research actions. Academic advancements include systems like
    Auto-sklearn [7], AutoKeras [8], and TPOT [9]. Inspired by these, industrial platforms,
    such as Google Cloud AutoML [10], Oracle AutoML [11], and Amazon SageMaker Autopilot
    [12], have been developed for large-scale use. These systems enable the creation
    of high-performance machine learning models and pipelines with minimal user effort.


    This study offers a thorough indication of the methodologies employed in AutoML
    research to assist novice researchers and practitioners. It covers state-of-the-art
    AutoML schemes for both ML and deep neural networks and future research directions.
    This study is divided into three primary subtasks by the survey: feature engineering,
    data augmentation, and pre-processing. Our review covers all areas of AutoML methods
    beyond only NAS techniques, whereas others focus on the comparison of AutoML with
    other methods. This chapter gives a brief introduction to AutoML techniques, based
    on the State-of-the-Art (SoTA) pipeline. It also categorized the AutoML approaches
    into three components: (i) search space, (ii) search approach, and (iii) performance
    assessment. The primary goal is to provide beginners with a comprehensive introduction
    to the arena of automatic machine learning (AutoML). The remaining segments are
    organized in the following ways: Section 14.2 outlines the fundamental steps of
    AutoML system and pipeline structures. In Section 14.3, we describe the AutoML
    technology and framework in another component. Then, Section 14.4 gives some idea
    about the AutoML applications. Section 14.5 delves into potential future trajectories,
    while Section 14.6 brings the entire paper to a close.


    # 14.2 Flow of AutoML


    The machine learning process generally follows these steps: data collection, data
    preparation and data augmentation, feature engineering, model selection, and model
    evaluation. Traditional machine learning methods necessitate performing each of
    these stages manually and independently. Figure 14.1 describes the steps involved
    in generating a pipeline of any AutoML system.


    +   1. Automated Data Collection

    +   Data collection is a complex task. Issues with data correctness, consistency,
    and quality frequently come up during the merging of datasets'
