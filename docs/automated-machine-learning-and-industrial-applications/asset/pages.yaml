  md: '# 7.3.1 AutoML-Based Exploratory Data Analysis and Subjectivity Detection


    AutoML can target various steps in machine learning, such as data preparation,
    feature engineering, model selection, hyperparameter optimization, etc. Among
    these stages of a machine learning process, in this chapter, we have applied AutoML
    in the form of AutoNLP for the data preparation stage. As the initial step, exploratory
    data analysis is carried out using AutoNLP, which is based on the concepts of
    AutoML. The text involved in the discussion between the user and the chatbot is
    subjected to pre-processing. In pre-processing, the text is converted to a suitable
    form that is ready for sentiment analysis. This involves case conversion (converting
    all upper case to lower case), removal of stop words (removing words that do not
    have any significant contribution in the analysis, such as “is”, “a”, etc.), tokenization
    (splitting the text into separate units or words), and stemming (bringing the
    words to their root forms; for example, words such as “walking” and “walked” are
    stemmed to the root form “walk”).


    After carrying out these pre-processing tasks, the text is input to the subjectivity
    detection module, where the parts-of-speech (PoS) tagging technique is applied
    to tag each word of the text with its appropriate grammatical counterpart. For
    example, consider the text, “I am under severe stress.” The TextInspector tool
    available at the url [31] is used to perform the PoS tagging and get summary statistics.
    Figure 7.2 shows the editor wherein the input text is typed. The statistical summary
    for the given text is auto-generated by the tool, as shown in Figure 7.3. The
    summary involves various parameters such as sentence count, token count, average
    sentence length, type-token ratio, etc. The PoS tags for the given text input
    are shown in Figure 7.4.


    ![](img/5510bd7390ed7002b5774fe8c2be9eff_167_0.png)


    Figure 7.2 Text input for PoS tagging.'
