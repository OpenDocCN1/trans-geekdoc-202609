    from different sources and must be resolved. To make sure the data is useful,
    it must be processed, and unnecessary information must be removed. Considering
    the rate of datasets, a great number of open datasets are now available. In the
    initial stages of machine learning research, the MNIST [13] dataset of handwritten
    digits was formed. Over time, larger and more varied datasets, such as CIFAR-10,
    CIFAR-100 [14], COCO [15] ImageNet [16], and many have been developed for use
    in Neural Architecture Search (NAS) due to their wide accessibility and applicability
    to numerous tasks. However, classifying the right dataset for a specific scheme
    remains a significant test. To address this, several methods have been planned,
    including data searching, data filtering, data labeling, and data mixture.


    # 2. Automated Data Preparation and Preprocessing


    Data cleaning is a vital phase of data preparation and preprocessing to ensure
    data accuracy, consistency, and reliability. It involves techniques, like error
    detection, duplicate removal, normalization, and lost value imputation [17]. Traditional
    methods, such as Potter’s Wheel [18] and IntelliClean [19], require human skill
    and are time consuming. Automated tools, like Katara [20], Boost-Clean [21], and
    AlphaClean [22], streamline the process. Katara uses rule-based and machine-learning
    approaches, while Boost-Clean detects and repairs errors before model training.
    AlphaClean generates data-cleaning pipelines and learns from user feedback. Dynamic
    data cleaning is crucial for handling continuously generated data. Ilyas et al.
    [23] proposed a framework for continuous monitoring and cleaning, including a
    data quality model, executor, generator of cleaning plan, and feedback loop.'
