- pgno: 312
  md: 'A. Feature Selection: Feature selection involves choosing relevant features
    from a larger pool to enhance model performance, reduce complexity, and improve
    interpretability [39]. It minimizes noise, overfitting, and the dimensionality
    leading to better generalization and predictive capabilities. For large datasets,
    it also saves computing resources and training time. In AutoML, feature selection
    is automated using various algorithms like filter approaches, wrapper methods,
    and embedded methods [40]. AutoML''s iterative procedure refines the feature subset
    to advance model performance, reducing overfitting and enhancing predictive power.
    The number of repetitions and stopping criteria depend on computational resources,
    time constraints, and desired model performance.


    B. Feature Extraction: Feature extraction transforms raw data into expressive
    features for machine learning [41]. It reduces data dimensionality while preserving
    essential information improving model performance and computational efficiency.
    Techniques, like SIFT and HOG, are used for images, autoencoders, TF-IDF for text,
    and FFT and wavelet transform for signals [42]. AutoML platforms automate feature
    extraction using methods such as wavelet transforms and dimensionality-reduction
    algorithms (e.g., PCA, LDA) [43]. This automation identifies significant patterns,
    reduces redundancy, and enhances feature representation allowing users to focus
    on analyzing features and understanding data patterns.


    # 5. Model Selection


    Model selection is crucial in NAS and is divided into search space and architecture
    optimization.


    A. Search Space: In AutoML, the search space aids to locate optimal architectures,
    minimize complexity, and boost search competence. It defines the possible architectures
    that can be represented. Common NAS search spaces include the following:


    +   - Cell Based: Uses basic building blocks [44, 45].

    +   - Entire Structured: Considers the whole network structure [46].

    +   - Hierarchical: Organizes patterns across different levels [47, 48].

    +   - Morphism Based: Focuses on transformations [49, 50].'
  merge: -1
  img_proc: true
- pgno: 313
  md: 'For large datasets, hierarchical search spaces often perform better. Hierarchical
    genetic representation systems use modular designs to create complex topologies.
    They start with a flat architecture and build hierarchical structures with multiple
    levels.


    Hierarchical Neural Architecture Search (HNAS) includes cell- and network-level
    search spaces. It uses normal cells to manage model capacity and up-sampling cells
    to enhance resolution. Mobile NAS (MNAS) [51] introduces a factorized hierarchy
    for CNN models independently searching processes and connections within each group.
    Global Local Image Transformer (GLiT) optimizes the supply of global and local
    sub-modules within each block [52].


    B. Architecture Optimization: Architecture optimization in deep learning includes
    selecting the best neural network architecture for a precise dataset [53]. This
    process requires modifying features like learning rate and weights to improve
    precision and reduce loss [54]. Common optimization algorithms include the following:


    +   a) Evolutionary Algorithm: Evolutionary Algorithms (EA) mimic natural selection
    using reproduction, mutation, recombination, and selection. It optimizes solutions
    starting with random solutions and evaluates them using a fitness function [55].
    Genetic Algorithms (GA), a type of EA, use a population of solutions and three
    main operators: selection (based on fitness), mutation (random changes), and crossover
    (exchanging segments) [56]. Key parameters, like neuron count and learning rate,
    must be carefully set [57].


    +   b) Reinforcement Learning: Reinforcement learning (RL) is an ML field where
    an agent acquires and adapts through interactions in an unfamiliar situation [58].
    The agent obtains rewards or penalties created on its activities guiding its learning
    in a trial-and-error manner. In RL, the agent perceives the situation, selects
    actions, and receives feedback. The main components are reward, action, and state.
    The agent''s aim is to learn an action strategy that exploits the reward, represented
    by the following equation:


    $$\Sigma_{i=0}^{\infty} \gamma^i Q_{t+i}, (0 < \gamma \le 1)$$ (14.1)'
