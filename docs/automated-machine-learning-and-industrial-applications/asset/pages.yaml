    # 8.1 Introduction


    Protecting computer programming from intrusions, unauthorized access, alterations,
    and destruction is a component of cyber security practice. An intrusion detection
    system (IDS), antivirus software, and a firewall should typically be part of every
    cybersecurity system. The IDS is crucial since it helps spot any undesired and
    unwelcome changes to the system [1]. Two main types of intruders are those who
    enter from the inside and those who enter from the outside. However, the following
    elements can be utilized to distinguish between different types of cyber analytics:
    i) Irregularities or signatures and ii) founded on odd encryptions according to
    the hybrid nature.


    Artificial intelligence (AI) methods are increasingly employed in the financial
    sector in asset management, trading methods, credit underwriting, and blockchain-based
    finance [2] due to readily available data and reasonably priced computing power.
    Machine learning (ML) methods use extensive data to learn from historical data
    automatically and prior performance to enhance prediction and performance without
    human programming. AI in finance is anticipated to give financial organizations
    a competitive edge by boosting productivity, reducing expenses, and enhancing
    QoS and the products they offer clients. Therefore, by offering better and more
    customized products, providing data insights to inform investment strategies,
    and potentially enhancing financial inclusion by enabling assessment of client
    creditworthiness with little to no credit history, these competitive advantages
    can help financial consumers [3]. Finance-related AI applications may also amplify
    or raise financial and non-financial risks raising concerns about potential investor
    and consumer protection laws.


    The incompatibility of AI model processes with internal governance and financial
    supervisory frameworks and potential for pro-cyclicality and systemic risk in
    markets could jeopardize a policy-neutral approach to regulation. Given the intricacy
    of the methodologies used, their dynamic adaptability, and their degree of autonomy,
    implementing such approaches could enhance these vulnerabilities even if many
    possible hazards linked with AI in finance are not sure of this invention [4].
    Management must take on more risks to increase revenues for the bank’s investors.
