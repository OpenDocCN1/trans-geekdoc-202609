    modifiers into three groups (Enhancers, Emphasizers, and Reducers) based on the
    extent to which they are capable of amplifying the associated sentiment. Enhancers
    increase the strength of the sentiment expressed to the fullest extent, denoting
    the exciting point on the scale. For example, “I am totally impressed with your
    response”, where “totally” is an enhancer-type modifier that strengthens the degree
    of positivity to the completest extent.


    Emphasizers are the modifiers that increase the strength of the associated sentiment,
    but to a certain level, but not to the fullest level as that of enhancers. Consider
    the user inquiry, “I’m very happy with your answer.” Here, “very” acts as an emphaziser,
    which increases the positivity of the sentiment expressed by the user toward a
    chatbot.


    Reducers are the adverbs that decrease the strength of the sentiment present in
    the dialog. For example, consider the user query, “I have a mild headache now.”
    The term “mild” turns as a reducer that decreases the strength of the sentiment.
    The trilateral categorization of modifiers is shown in Figure 7.5.


    # 7.3.3 Sentiment Polarity Detection


    In the proposed methodology, sentiment polarity is detected by using a nonary
    scale proposed in ref. [23]. In the existing works on sentiment polarity [18–21],
    a binary or ternary classification is accomplished either (positive, negative)
    or (positive, negative, neutral). By using the trilateral modifiers, it is still
    possible to detect the sentiment polarity accurately so that the chatbot can get
    the real tone behind the user text and can act accordingly.


    For example, consider the user text to the Siri Chatbot: “I am completely depressed.”
    From the text, it can be clearly understood that the user is in an extreme case
    of depression, depressed to a higher extent, which is revealed by the presence
    of the enhance-type modifier “completely.” So, by giving'
