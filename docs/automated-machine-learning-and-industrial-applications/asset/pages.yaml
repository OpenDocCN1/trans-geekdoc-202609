    # 10.4.2 Segmentation of Leaf Image


    The model applies an advanced method that builds upon previous steps, the Chan–Vese
    Level II algorithm, to image segmentation in complex environments. By initializing
    the zero level set, minimizing the energy function, and iteratively computing
    leaf profiles, this algorithm skillfully segments images of diseased plant leaves.
    Unlike surface evolution, which uses an explicit control speed (F), the Chan–Vese
    Level II algorithm makes use of the level set to create an energy function that
    fully captures the region.


    The contour length is raised to aid in the energy function''s merging. The energy
    function is defined as the minimum sum of variances between the gray values within
    and outside the contour in the image. To account for a closed curve in the image,
    the energy function formulation is as follows:


    ```

    E = \mu Length(C_1) + Y1 \int\int_{c1} |u(x, y) - u_1|^2 dxdy + Y2 \int\int_{c2}
    |u(x, y) - u_2|^2 dxdy  (10.11)

    ```


    The image''s gray values are represented by u(x, y), the average gray values in
    the contour are represented by u1, the average gray values outside the contour
    are represented by u2, and the image''s gray values are represented by c1 and
    c2. Next, the following are the provided formulas:


    ```

    F1 = Y1 \int\int_{c1} |u(x, y) - u_1|^2 dxdy  (10.12)

    ```


    ```

    F2 = Y2 \int\int_{c2} |u(x, y) - u_2|^2 dxdy  (10.13)

    ```


    When F1 ≈ 0 and F2 ≈ 0, the computing ends. Level set technique is applied to
    rectify Equation 10.11 and zero level set is employed to display contour lines.
    Dirac''s function and Heaviside''s function are introduced as follows:'
