- pgno: 83
  md: '+   - Hyperspectral sensors: These sensors measure the reflectance of light
    across a wide range of wavelengths from the visible to the near-infrared spectrum
    that provides high-resolution spectral data, which can be used to identify detailed
    changes in leaf pigmentation and structure.

    +   - Multispectral sensors: These sensors measure the reflectance of light at
    specific wavelengths, typically in the visible and near-infrared spectrum, providing
    lower-resolution spectral data but at a higher spatial resolution.

    +   - Fluorescence sensors: These sensors measure the fluorescence emitted by
    plant leaves when exposed to light providing information about the photosynthetic
    activity and health of the plant.

    +   - Thermal sensors: These sensors measure the infrared radiation emitted by
    plant leaves, providing information about the temperature and water stress of
    the plant.


    The sensors work by emitting light or radiation onto the plant leaves and measuring
    the amount of energy reflected or emitted back. The spectral signature of the
    reflected or emitted energy can then be analyzed to identify specific wavelengths
    or patterns associated with different plant diseases or stress conditions.


    Spectral analysis using these sensors can provide accurate and non-invasive methods
    for detecting plant leaf diseases and monitoring plant health enabling early intervention
    and management to prevent crop losses.


