    proper weight to the presence of modifiers, it is possible for the chatbot to
    come to a proper level of understanding of the user’s situation and thereby provide
    an appropriate response. If the modifiers are not given due weight, then it may
    lead to an improper understanding of the real tone behind the user text. The nonary
    scale developed in the proposed methodology is presented in Figure 7.6.


    The nonary scale has been framed by the association of three types of modifiers
    with the adjectives or verbs of positivity or negativity. For instance, when an
    enhancer-type adverb accompanies an adjective or verb of positivity, the polarity
    of the sentiment is classified as extremely strong positive. Similarly, if the
    same modifier is associated with an adjective or verb of negativity, the polarity
    of the sentiment is classified as extremely strong negative.


