    is how estimating process works:


    $$S(r) = fe^{-r/l} - e^{-r}.$$


    Here, social attractiveness strength and scale are denoted by the letters f and
    l, respectively, while the social value of its existence is denoted by the letter
    r. Second, the Gi and Ai formulas are as follows:


    $$G_i = -ge_y^v,$$


    $$A_i = ue_{w*}$$'
