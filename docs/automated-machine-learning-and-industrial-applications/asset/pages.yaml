    growth of various AI methods is enabling innovative solutions to complex challenges.
    To address the issues facing agriculture today, a number of approaches have been
    put forth, such as database integration and decision support systems [2]. The
    proximity of artificial intelligence (AI) and agriculture, while initially unconventional,
    has gained relevance in recent times. Despite agriculture being a cornerstone
