    # Abstract


    The cornerstone of successful and precise prevention of plant disease in complex
    environments lies in the accurate identification of the specific disease affecting
    the plants. Advances in decision support, intelligent analysis, and planning are
    made possible by the digitization and data-driven detection of plant diseases
    brought about by the quick development of smart farming. This research introduces
    a mathematical model for diagnosing and recognizing plant diseases using deep
    learning, aiming to improve training efficiency, accuracy, and applicability.
    The leaves are first identified and located in complex situations using the region
    proposal network version 2 (RPNv2) algorithm. Next, the Chan–Vese Level-II (LCV)
    method is applied to retrieve the symptom features from images that were segmented
    based on the RPNv2 algorithm’s results. Proposing the use of Extended-EfficientNet
    (E-ENet) deep learning architecture, this study suggests its application in plant
    leaf disease classification, with an evaluation of its effectiveness compared
    to other current deep learning models. Models were skilled using data from PlantVillage.
    Training datasets comprising 55,448 and 61,486 images, respectively, were used
    to train all the models. The E-ENet architecture outperformed existing models
    in the


    *Corresponding author: sathyabalaji33@gmail.com'
