  md: 'Background Noise Mixing: Adding background noise to the audio. Frequency Masking:
    Masking certain frequencies in the audio.


    # D. Tabular Data


    Techniques of data augmentation for tabular data are not the same as those for
    text or image augmentation. By enhancing the variety of training data, these approaches
    and technologies seek to advance model performance, which ultimately results in
    improved generalization. Some commonly used steps are as follows:


    +   - Noise Addition: Adding random noise to numerical features.

    +   - Data Shifting: Slightly shifting values of numerical features.

    +   - SMOTE: Generating synthetic samples for minority classes [32].

    +   - Random Missing Values: Introducing and then imputing missing values.

    +   - Feature Mixing: Combining features from different rows to create new synthetic
    rows.

    +   - Autoencoders: Using Denoising Autoencoders (DAE) [33] to reconstruct data
    with added noise.

    +   - Data Synthesis: Generating new data points using models like GANs [34].


    Automated tools like Katara, Boost-Clean, and AlphaClean streamline DA. AutoAugment
    uses reinforcement learning to automate DA policy search but is resource intensive.


    # 4. Automated Feature Engineering


    Feature engineering is a vital phase in the ML pipeline altering raw data into
    a plan appropriate for algorithms. It includes creating new features, selecting
    relevant ones, and modifying existing features to enhance model performance [35].
    AutoML platforms automate this process exploring various feature engineering strategies
    [36] and optimizing the feature space. To identify the best-performing model,
    they experiment with various algorithmic combinations, feature engineering strategies,
    and preprocessing procedures, utilizing Bayesian optimization [37, 38] or evolutionary
    algorithms.'
