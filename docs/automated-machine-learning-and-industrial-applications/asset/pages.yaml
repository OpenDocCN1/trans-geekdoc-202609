    # Abstract


    Automated Customer Relationship Management system is designed to analyze customer-related
    data such as call notes or service requests. Its primary objective is to enable
    organizations to gain a comprehensive understanding of customer issues, respond
    promptly to service concerns, and strategically plan process enhancements. Through
    the utilization of this system, organizations cannot just promptly address immediate
    concerns but also proactively identify and implement long-term improvements contributing
    to magnifient customer gratification and well-organized functional processes.
    The article shifts its focus to the broader realm of organizational management
    as a whole to emphasize how crucial it is to mine the continuous stream of service
    demand flows into and within the business. Therefore, they can point out matters
    of substantial concern to their customers and monitor issues evolving every time
    from groups of customers, classes of products, or other proportions and recommend
    solutions for problems that persist. These insights lead to text analytic process
    with AutoML-driven-based self-learning system in contrast to rule-based techniques.
    This research article delves into the world of opinion mining or sentiment analysis,
    particularly in text classification tasks, and explores the potential of an Automated
    Machine Learning (AutoML) tool to enhance the process. The study showcases AutoKeras
    as a catalyst for


    *Corresponding author: vrajee2008@gmail.com'
