- pgno: 305
  md: '# # Democratizing Machine Learning: The Rise of Automated Machine Learning
    (AutoML)


    **Debarati Dutta and Priya G.***


    School of Computer Science and Engineering, VIT University, Vellore, Tamil Nadu,
    India


    # ## Abstract


    The current paradigm of artificial intelligence (AI) is centered on developing
    algorithms that acquire extraordinary outcomes by learning directly from data,
    particularly in supervised deep learning. This has streamlined the machine learning
    systems by systematizing much of the learning process. In many different areas
    of our everyday life, machine learning (ML) is essential. However, developing
    effective ML applications typically requires skilled data scientists and subject
    matter specialists. Using automated machine learning (AutoML), domain experts
    may develop machine learning features without requiring extensive statistics or
    machine learning training. The area of AutoML is expanding quickly, with the goal
    of automating machine learning model development. By reducing tedious steps in
    the machine learning process—from selecting and fine-tuning algorithms to preparing
    data—it seeks to increase efficiency and productivity. This article outlines a
    review of AutoML methods and provides detailed explanations. It provides an indication
    of AutoML’s history and current state of this revolutionary technology. It starts
    by outlining the notion of AutoML, outlining the fundamental stages of every machine
    learning method, specifying the issues it aims to solve, and outlining the three
    main mechanisms of AutoML techniques. AutoML’s versatility and ongoing development
    applications and future scopes are also highlighted here. Overall, this comprehensive
    overview serves as an invaluable tool for machine learning scholars and practitioners,
    laying the groundwork for future advancements in AutoML.


    *Corresponding author: gpriya@vit.ac.in'
  merge: -1
  img_proc: true
- pgno: 306
  md: '**Keywords:** AutoML, AutoML components, data augmentation, feature engineering


    # ## 14.1 Introduction


    Machine learning (ML), has revolutionized various fields such as image classification,
    disease diagnosis, language translation, weather forecasting, and many more. The
    breakthrough act of AlexNet [1] in the 2012 ImageNet challenge led to the development
    of deeper networks like ResNet-50 [2], which has 50 layers and 25.6 million parameters.
    However, its success deeply depends on specialists who plan complex machine learning
    pipelines, including data preprocessors and training methods. Choosing the right
    mechanisms and optimizing their hyperparameters is an inspiring task that requires
    experience, experimentation, and resources. This challenge has driven the rise
    of Automated Machine Learning (AutoML), which intends to streamline and automate
    the creation of high-performance pipelines [3]. Current AutoML systems mainly
    target automated model building, which involves selecting the pipeline structure,
    its stages, and its hyperparameters.


    When automating data science, four essential procedures are often taken into consideration
    as follows: 1. Collection and exploration of data. 2. Data engineering to clean
    and eliminate outliers from a dataset, data augmentation, and feature engineering
    to make it for feeding into a machine learning pipeline. 3. Choosing a model-building
    algorithm. 4. Hyperparameter optimization. 5. Training the model. 6. Data exploitation
    for decision-making. Among them, the main goal of modern AutoML systems is automatic
    model creation for an exact dataset.


    John Rice proposed the algorithm selection problem in 1976 placing the groundwork
    for present AutoML systems [4]. In the 1990s, commercial keys started offering
    automatic hyperparameter optimization (HPO) via grid search. By 1995, versions
    of grid search using a greedy best-first approach occurred. The true potential
    of AutoML was understood with the introduction of the algorithm selection and
    optimization (CASH) problem. The formation of Auto-WEKA, by Thornton et al., in
    2013 [5], efficiently illustrated this by using this idea to select models from
    a search space of conventional ML methods and related hyperparameters. Neural
    architecture search (NAS), a field whose emphasis on autonomously creating a particular
    type of machine learning model—neural networks—has also received a lot of maintenance
    in recent AutoML research [6].'
  merge: -1
  img_proc: true
