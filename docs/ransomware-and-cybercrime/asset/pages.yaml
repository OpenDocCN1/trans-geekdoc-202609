  img_proc: true
- pgno: 116
  md: 'course get much worse, such as when SolarWinds lost command and control due
    to a domain being hijacked and taken over. We often hear of people saying their
    Not Secure website doesn’t store data or capture information. It may have 40 cookies,
    however, and capture your unique IP and other details. It is NEVER OK for a live
    website to maintain a mismatched, misconfigured, or expired SSL. It shows and
    indeed confirms carelessness and lack of security control and management. Such
    websites are the staple diet and targets of cybercriminals, who happily attack
    200,000 websites a day.


    You will have heard the question I am sure, ‘Who polices the police?’ and understand
    its meaning. In the world of security, egos can typically be rather large, and
    as such, when security experts are found to have overlooked or ignored basic security
    connected to the Internet, it is usually at that point the old ‘there is nothing
    on it, nothing to see we know and are moving domains’ and so on is heard. You
    will never hear a security expert, certainly not publicly, say, ‘Oh bummer, we
    forgot that; it is my fault that we have been infiltrated due to my incompetence
    and neglect of our Internet security’. So, it came as something of a shock when
    we started researching a number of cyber security organisations to find they were
    themselves guilty of being insecure, some with the cardinal sin of having homepages
    displaying the Not Secure text in the address bar. The two following examples
    show why discipline is unbelievably lacking in major security organisations and,
    in these two examples, backed by the US government.


    MITRE CWE is a community-developed list of software and hardware weakness types.
    It serves as a common language, a measuring stick for security tools, and a baseline
    for weakness identification, mitigation, and prevention efforts. MITRE CWE list
    the most prolific and dangerous vulnerabilities and weaknesses and are the go-to
    guys for all things security. MITRE CWE are supported by the DHS (Department of
    Homeland Security) and CISA and managed by the HSSEDI (Homeland Security Systems
    Engineering and Development Institute). MITRE CWE are unequivocally globally recognised
    as thought leaders in the security sector.


    Imagine our surprise when on 11 March 2020 we discovered and wrote to MITRE CWE
    to confirm that they were maintaining a visibly Not Secure homepage. This situation
    had serious repercussions for the domain, its content, and its connections both
    up- and'
