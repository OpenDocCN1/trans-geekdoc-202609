- pgno: 17
  md: '# # STUXNET TO SUNBURST AND RANSOMWARE DEVELOPMENT


    My previous book, *Stuxnet to Sunburst, 20 Years of Digital Exploitation and Cyberwarfare*,
    took the reader on a journey and looked at numerous specific cyberattacks and
    the first use of digital code for warfare in the form of Stuxnet. Stuxnet used
    digital certificates laced with malicious code (Stuxnet). It went in depth about
    many attacks and concluded with the similarities of the SolarWinds breach that
    started in early 2020 and surfaced in December 2020, affecting thousands of clients
    including the US government. What made this ironic is SolarWinds is an American
    company that develops software to help manage clients’ networks, infosec, and
    infrastructure. As a well-known and highly utilised US government supplier, SolarWinds
    could not have been better placed to be breached and cause maximum infiltration,
    disruption, and unfettered access. What made it a double whammy, in many ways,
    was the fact that once Domain Administration Access had been achieved via a hijacking
    a legacy, insecure sub-domain, the adversaries laced SolarWinds’ own digital certificates,
    which were distributed and used to update customers’ versions, with Sunburst,
    the name given to the code. Furthermore, the delay of 13 days from update acceptance,
    often without any intervention, was an identical timeframe as used in Stuxnet
    was set before Sunburst was activated. Is that just a coincidence with Stuxnet’s
    own 13-day delay from infiltration? We think not.


    Both Stuxnet and Sunburst were cyberattacks with a specific purpose. The first
    was to destabilise, slow down, or even halt the Iranian nuclear program, the second
    to cause major disruption and infiltrate the US government, including the Treasury.
    This can only be a bad thing as the United States, indeed all organisations and
    governments, do not have proper controls or know what their enterprise contains;
    chances are they contain much more now, along with data exfiltration.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'Over the last few years, organised crime has watched, and learned, from how
    simply, and anonymously similar attacks can be utilised as part of their overall
    illegal business plans. In fact, they are so easy that digital cyberattacks have
    overtaken and surpassed all other forms of crime and are so successful as organised
    crime, they are in fact much better organised than the people charged with ensuring
    security. It is also not unreasonable to confirm that the good guys have to secure
    100% and the bad guys find a single access point. This situation was further exacerbated
    by revelations in 2013 by Edward Snowden and others who confirmed the access points
    and tools used to infiltrate organisations and governments to gain digital access
    and exfiltrate information and data. The harvesting of this data gave control
    and power; however, once it fell into the wrong hands, the birth and early iterations
    of Ransomware were spawned, and the global market and economy would change forever…


    What is Ransomware? In the simplest of terms, Ransomware is the name given to
    a type of Malware from crypto virology that typically threatens to publish the
    victims’ data or block access to it unless a ransom is paid. As we know, a person
    being held hostage and not released until a ransom is paid is highly illegal.
    In the digital world, it is seemingly tolerated, even accepted, which is why organisations
    like Darkside, who hit Colonial recently, have received an estimated $90 million
    over the last several months…


    Ransomware has evolved over the last few years, even more so over the last year
    or so, and now it typically means cybercriminals exfiltrate data to then demonstrate
    to the victim the data is in their possession and to prove they have been able
    to remove it. They offer to sell it back at a premium, and so the next attack
    commences. Let us look at this closer, as it is an area that even some of the
    biggest and best leaders in security don’t fully understand. In or around 2013/2014,
    Google and others wanted to move from the weak HTTP (Hypertext Transfer Protocol)
    to HTTPS to ensure better and stronger security for website visitors. The S part
    of HTTPS effectively stood for security and meant all data would be encrypted
    as opposed to being kept in plaintext form. Plaintext form is text as you are
    reading here, hopefully easily understood for everyone. You will be familiar with
    various emails and communication Apps such as Whatsapp, Signal, and so on. These
    have all been designed with the same purpose in mind,'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'to ensure messages are encrypted and enable only decryption by the recipient,
    or that was at least their desired business plan at the outset.


    What Google possibly never realised is that not everyone would adopt this great
    new security position, and what took years to agree on, design, and develop for
    global increased security would in fact make it even easier to identify organisations
    that were not using the new variant of HTTPS and, as such, were maintaining data
    in plaintext form. It would become a cybercriminal’s staple diet to go to organisations
    who maintained HTTP and enable easy access, plaintext data enabling them to encrypt
    it and demand a ransom for the decryption capability properly. Google confirmed
    they would share details of those that ignored the upgraded HTTPS by showing a
    Not Secure text in the address bar. The list of organisations that have fallen
    foul of such oversight or negligence reads like a who’s who of governments, Fortune
    500, and FTSE 100 companies.


    It gets worse. The HTTPS element refers to the digital certificate validity; that
    is, does have the correct certificate and is valid. It matches the domain and
    is it of the correct type. What it does not tell you is whether the domain is
    configured correctly or has other security vulnerabilities that are exploitable.
    Does it use a hosting provider, shared services, DNS (Domain Name System) or CDN
    (Content Delivery Network) third party content, and so on?


    The self-inflicted challenge is rarely understood, and that shamelessly includes
    Captains of Industry and far too many Chief Security Information Officers. This
    is enough cause for concern, as although maintaining a Not Secure domain confirms
    a total lack of Internet security controls and management, it also highlights
    a lack of internal security by default. Furthermore, it also confirms that domains
    are being published, often using third-party content, hosting providers with shared
    responsibilities, or servers using older code written in HTTP which relegates
    the entire site to being Not Secure. Unauthenticated, lacking data integrity,
    and data often in plaintext: it is easy to see why 200,000 websites of the 1.2
    billion each day are targeted and attacked and why successful attacks are costing
    the global economy $billions, ever $trillions annually.


    In the last 12–24 months, my associates all around the world have been sending
    me details of local Ransomware attacks. From Health-care in Australia, New Zealand,
    the United States, Ireland, the United'
