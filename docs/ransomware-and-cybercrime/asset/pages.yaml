    There are few trailblazers and even fewer innovators in the world. Most people
    follow suit, replicate, or simply copy. Cyber criminals rarely, if ever, innovate.
    They simply emulate and copy what they have learned from others, and sadly, the
    majority of cyberattacks use the tried and tested methods previously used by our
    governments and agencies to digitally eavesdrop on the rest of the world. The
    techniques and methods are identical; the end game plan and goal might be a tad
    different, I reiterate, right.


    Throughout the world, there are millions of small and medium-sized companies,
    hundreds of thousands of larger companies, hundreds of governments, and thousands
    of suppliers within the cyber security business. However, they are simply not
    working congruently together in the best way to combat common cyber threats—but
    they could be and certainly should be. SMEs (Small and Medium-Sized Enterprises)
    find it difficult to purchase cyber security due to cost and/or lack of expertise
    and therefore currently run the gauntlet by playing an incredibly dangerous game
    of chance. The very same SMEs make up part of the supply chain ecosystem and supply
    the bigger companies who in turn pay their workers, and both collectively pay
