- pgno: 48
  md: 'In real terms, the Cyber Insurance sector is still in its infancy. Yet the
    sector is making some huge, extremely influential decisions that are having an
    incredible impact. Sadly, mistakes are also being made. Let me explain. Insurance
    Actuaries are scrambling and desperate for data and metrics within the cyber world
    to base their models of probability on within this immature new market. Furthermore,
    because of the lack of cyber security knowledge, from a defensive and indeed offensive
    standpoint, as well as what maintaining good basic cyber security really looks
    like and means, they are themselves made prime targets with little to no defence,
    as CNA and others have found out to their great cost.


    Last weekend, AXA made a statement that they would no longer guarantee Ransomware
    settlements as part of a cyber insurance policy. Our research in which we continuously
    look at majors such as AXA had their Internet security rated very poor, and within
    a week of making their bold statement, AXA were made the victim of a Ransomware
    cyberattack; just like CNA and others, their Internet connectivity is acting like
    beacons, easily identifiable for cyber gangs to identify, see where the vulnerabilities
    are, and launch attacks.


    Let us look more closely at CNA: unquestionably a major Insurance company and
    yet so easily breached whilst at the same time lacking basic security, as can
    be seen by the Not Secure text on their address bar. As of today, I can confirm
    the homepage, www.cna.com, is now secure; however, other subdomains of CNA’s remain
    insecure. CNA remain vulnerable and exposed to being further exploited. To confirm,
    CNA are as vulnerable today as the day they were initially breached and, through
    a lack of knowledge, incorrectly believe they are secure by virtue of their homepage,
    whereas in truth, all of their Internet-facing domains and subdomains are still
    insecure and further exploitable. Not to mention what infiltration and Plants
    may have occurred for later use.


    Another major concern has been inadvertently created whereby many organisations,
    as part of their cyber strategy, purchase cyber insurance only to incorrectly
    consider the policy a ‘get out of jail free card’ and by default, sometimes even
    by design, overlook or even ignore the basics, as they unquestionably should not.
    All too often, insuring parties complete policy document forms with little more
    than a tick box, subjective exercise to evaluate a policy and premium.'
