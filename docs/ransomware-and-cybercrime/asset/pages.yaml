- pgno: 118
  md: 'Finally, as cyber experts, we all know that domain hijacking, as happened to
    SolarWinds is made all the easier when organisations do not have control or management
    of what may be a disparate set of domains and subdomains, even launching new sites
    often go published with misconfigured or mismatched certificates which renders
    the domain as Not Secure. Such a position can enable domain hijacking as mentioned,
    domain takeover (www.avsvmcloud(.)com) Man in the Middle Attacks, DDOS, lack of
    domain authentication, data being maintained in plaintext (major factor for Ransomware
    increase) and ultimately, C2 (command and control). Domain Admin Access is a real
    live threat enabling an adversary to gain privileges and full access as we have
    recently witnessed.


    There is a reason cybercrime has created the world’s third largest economy by
    virtue of revenues, and that growth can be directly attributed to insecure Internet
    access, lax basic security, and lack of adoption of HTTPS from HTTP since 2018.The
    likelihood of continued attacks and this being a CWE are extremely high, in fact,
    it can be considered as a certainty.


    Finally, and rather embarrassingly, cwe.mitre.org itself is falling foul of all
    the above CWE’s by virtue of not having a valid TLS cert in place currently which
    confirms the entire contents of my mail. Privacy laws such as UKDPA, DPA, GDPR
    and similar are not being met and immaterial of what data is, or is not being
    maintained, the fact an IP address is captured on a Not Secure domain constitutes
    PII data.


    I look forward to hearing from you in due course.


    I received a polite note sometime later suggesting we were not right, as an SSL
