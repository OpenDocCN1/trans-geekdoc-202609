  md: '# 6

    BA, EASYJET, AND THE TRAVEL INDUSTRY


    Long before COVID-19 was even thought about, well at least to the majority of
    the world’s population, back in August 2018, customers of British Airways were
    merrily booking their flights to far-flung and exotic places. It was not until
    sometime later that they realised 1) they were going nowhere, and 2) they had
    booked flights on a Shadow website due to a series of basic security oversights
    at BA.


    Due to BA’s lack of Internet security controls and management, cyber criminals
    ‘stood up’ a spoof website called BAWays.com that was in essence a carbon copy
    of BA’s own website. It emulated all the functions and allowed bookings and, importantly,
    the collection of PII data and payment. To cut a long story short, BA were found
    guilty by the ICO of negligence to secure and protect their customers data due
    to said basic security failings. The ICO originally levied a fine of £183 million
    which, due to the economic challenges and COVID-19, was greatly reduced to £20
    million. BA then initially borrowed £500 million increasing to some £2 billion
    from the government backed by the British taxpayer. It is still unclear if BA
    have actually paid the reduced fine. The ICO said at the time: ‘When organisations
    make poor decisions around people’s personal data, that can have a real impact
    on people’s lives. The law now gives us the tools to encourage businesses to make
    better decisions about data, including investing in up-to-date security’ (Elizabeth
    Denham, Commissioner ICO). BA were fined 1% of the money they borrowed, sounds
    about right…


    The original fine was calculated on the GDPR regulations of enabling a fine up
    to 4% of BA’s annual revenues; however, as the fine levied from the time of the
    incident was over two years, that was frowned upon by Industry experts. The ICO
    said it ‘meant business’ and is not letting struggling companies off the hook
    for their data protection failures.'
