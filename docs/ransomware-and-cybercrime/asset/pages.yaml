- pgno: 23
  md: '# ² Not Secure, F and 0...


    We have over a hundred domains, we run bug scanning daily and fully appreciate
    the critical security issues and requirements of domains and security. We know
    some are literally holding pages with little to no data, we also know the top
    two dozen or so that we control and manage.


    > (CISO of a US $billion cyber security firm 20 May 2021. after numerous cyberattacks,
    including SolarWinds)


    So, I asked my vulnerabilities and research team to have a look. Within an hour,
    they sent me a dozen insecure domains belonging to the company. Even worse, Not
    Secure Login domains, domains with mismatching Transport Layer Security (TLS)
