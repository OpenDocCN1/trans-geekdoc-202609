  md: '# COLONIAL PIPELINE

    AND CI COMPANIES


    Over 6/7 May 2021, Colonial Pipeline, an American oil pipeline system that originates
    in Houston, Texas, and carries gasoline and jet fuel mainly to the Southeastern
    United States, suffered a Ransomware cyberattack. The attack did not impact the
    network that managed the pipeline and infrastructure, but the accounting for sales
    and invoicing. For a period of around a week, the pipeline was closed as gas stations
    ran out of fuel, which sparked something of a panic-buying situation. With reports
    of two-thirds of stations closed due to lack of fuel, it would not have taken
    much more to see a real panic and run-on fuel, or even criminal activity to source
    fuel.


    On the evening of 6 May 2021, we undertook immediate research on www.colpipe.com
    Colonial’s homepages, and discovered the usual array of F and 0 Ratings of domain
    security and several totally Not Secure domains. You will read this time after
    time throughout this book, when there are such Ratings of F and 0, it alerts cyber
    criminals that organisations are exposed, vulnerable, and easily exploited. Colonial
    had been, and remain, guilty of maintaining insecure domains, making themselves
    a target and then easily exploitable. The attack was neither sophisticated, nor
    were they originally a target; they encouraged that position by their own negligence.
    According to the *Wall Street Journal*, Colonial Pipeline Co.’s CEO, Joseph Blount,
    said that he authorised the payment of a $4.4 million ransom to DarkSide, the
    Ransomware attackers.


    Colonial had apparently been trying to recruit security leadership for several
    weeks and had, and potentially still have, very limited security capability and
    knowledge. Given our research and findings, that may well be the case; however,
    having leadership and huge teams of security experts with massive budgets certainly
    does not mean that security is a given. As you will undoubtedly be shocked to
    see as you'
