    the MPDC; CNA, the Insurance Giant; then AXA get breached and all are running
    F- and 0-rated Internet security, someone, somewhere needs to wake up and realise
    this is a fundamental issue, and that issue is Internet security, or the lack
    thereof.


    We have spelled this out so many times and will continue to do so: criminals need
    to gain digital access to your enterprise, your network. If they cannot, they
    cannot attack you; that is a basic premise. Think of it like American football,
    you cannot score a Touchdown if you do not have possession. Cybercriminals equally
    cannot launch attacks unless they have access.


    By connecting to the Internet, you have much to gain; connect insecurely, however,
    and you have everything to lose.


    Finally, in response to the Head of Strategy at CISA, I confirmed: give us the
    autonomy and support we need, and we will drive the change required to stop the
    self-inflicted siege of cyberattacks the world is currently suffering, or we will
