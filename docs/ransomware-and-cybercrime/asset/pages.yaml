- pgno: 98
  md: 'As mentioned, at this point, we cannot confirm how long Air India have maintained
    their Insecure position or when the error was made; it may date back to 2018.
    However, what we can confirm is this, let us call it an oversight (lawyers would
    call it gross negligence), has made them a prime target. By being Not Secure,
    the domain lacks authentication, and the data can lack integrity and be altered
    and also can be exfiltrated, manipulated, and abused; furthermore, it could also
    be captured as plain text, the staple diet of all cyber criminals and Ransomware
    attackers. Cyber criminals are in many ways just like regular people inasmuch
    that they want an easy life. To date, of all the hundreds and hundreds of breached
    organisations we have researched, not one, not a single company, has had an A
    Rating of their security facing and connected to the Internet. Every single one,
    without exception, has had a Rating of F and just a handful a D. Cyber criminals
    use OSINT as part of their reconnaissance to identify exposed, vulnerable, and
    exploitable companies, and from experience, they find such positions at the majority
    of companies due to inaccurate or non-existent security postures. This must change
    for cyberattacks to reduce.


    The faux pas, if you will, is their domains, which can be easily and frequently
    unknowingly infiltrated by using numerous methods and the exfiltration of plain
    text data, again easily. The plain text data is then encrypted and ransom demanded
    before the attackers (hopefully) hand over the decryption keys. There are no guarantees
    here, of course, as we are talking criminals. Organised criminals are far better
    organised than most teams and individuals tasked with providing security and only
    need to find a single exploitable insecure position.


    Ransomware attacks are, in the main, not sophisticated, or unique. Since the autumn
