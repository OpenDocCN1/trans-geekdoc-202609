    # Is America’s Critical National Infrastructure Prepared for the Ongoing Ransomware
    Siege, and What Can They Do to Avoid It?


    The date is 30 December 2023, and this week, the US electric grid has been hit
    by two more devastating cyberattacks. Ransomware demands for a total of $200 million
    have been received as the grid is crippled for the fourth day in a row and several
    million people on the West Coast remain without power. The knock-on effect to
    stores, banks, communications, food storage, water treatment, and so on is mounting.
    Customers are outraged, as the public has demonstrated and attacked the homes
    of Executives of the Electric companies, with angry groups tearing down gates,
    walls, and defences. Sadly, sixteen people have died in one demonstration that
    got out of hand when law enforcement failed to manage the angry crowd, which resulted
    in crossfire, confusion, and a rampage. Investigations have started on the cause
    of these deaths; however probable stampeding by over fifty thousand angry customers
    is suspected to be the cause.'
