- pgno: 28
  md: 'Digital and Zero Trust are a reality. One only has to see the number of cyber
    and Ransomware attacks and fines for privacy negligence. Put simply, digital trust
    and regulators are at best an irritation, and the losers are, as always, the public.
    WARNING: sooner or later people will vote with their feet…


    In 2014, Google and other Internet Service Providers (ISPs) said enough is enough
    and decided to try and make the Internet safer and more secure. That statement
    and decision alone confirm that it was not, and, sadly, still is not. The strategy
    was formulated and sought to move from the traditional HTTP to HTTPS, the S standing
    for Secure. The decision saw the move from unencrypted data in transit to encrypted
    traffic. The plan was unquestionably a step in the right direction but had several
    failings. The first failing was the migration to HTTPS required full adoption;
    it took until 2018 to actually gain worthwhile support and adoption. Finally,
    in 2018, companies and organisations that did not adopt HTTPS would be publicly
    shamed by their websites displaying the *Not Secure* text in the address bar instead
    of a padlock. This would become known as a shaming of companies that were not
    taking their security or the security of their customers or potential customers
    seriously. Sadly, although the situation has improved, the 1000-plus companies
    that we have researched and that suffered cyber or Ransomware attacks all maintained
    sub optimal and insecure websites, many still do. … There is no coincidence.


    The challenge with this is if we look at cyber and Ransomware attacks and consider
    what that attack is looking for, we can see how unencrypted (plaintext) data is
    an unrivalled appeal to cybercriminals bolstered by more stringent and stricter
    Privacy Laws, and losses have often covered by ignorant cyber insurance providers.
    Plaintext data, once exfiltrated, often because it is being sent using HTTP, is
    easily captured and then used to hold a victim to ransom due to having Personally
    Identifiable Information. In 2018, when address bars displayed Not Secure, it
    also signalled and confirmed unencrypted data traffic. What was intended to make
    the world more secure was in fact used to identify those that were weak and exploitable.
    In addition,'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'here in 2021, a full three years later, those organisations are also confirming
    they are not controlling or managing their website, server, and web interfaces
    when displaying a Not Secure text, and cybercriminals swarm like sharks around
    a kill. Not adopting HTTPS is a very poor, unwise, and lax position for any company
    to maintain, and for three years, the entire world has been informed of such poor
    practice when seeing the Not Secure text. It is a situation that, if those in
    charge of the business knew of it, they would certainly not ignore. It impacts
    every user and customer both up and downstream. Yet far too many so-called security
    experts overlook, ignore, and neglect such positions but are all too willing to
    state they spent $millions on security and declare they are secure to the Board
    and Executives who know no better.


    To understand the move from HTTP to HTTPS, let’s list the key terms:


    +   - **HTTP (Hypertext Transfer Protocol)**—The foundation of online communication
    (how information is sent from a server to a browser).

    +   - **HTTPS (Hypertext Transfer Protocol Secure)**—HTTP improved and with an
    encrypted layer of security (S).

    +   - **Encryption**—Encoding information so it’s only accessible by authorised
    parties and not plaintext, the latter being the staple diet of cybercriminals.

    +   - **SSL (Secure Sockets Layer)**—Technology protocol that creates encrypted
    communication links between servers and browsers.

    +   - **SSL Certificate**—Data files that encrypt digital information and activate
    secure connections when installed on web servers.

    +   - **DNS (Domain Name System)**—Directory of domain names that are translated
    to IP addresses.


    Google and other ISPs cited three distinct reasons to move from HTTP to HTTPS.
    They wanted to have the websites and owners matched and authenticated; to ensure
    the data had integrity'
