    # CASE STUDY 1


    # HTTP to HTTPS addition


    Today we hear much about Digital Trust and even Zero Trust (ZT). Both have become
    fashionable terms. In truth, they are critical; however, few companies appreciate
    their real meaning, and digital and zero trust are often little more than terms
    and yardsticks to obtain larger budgets, which far too many continue spending
    unwisely and squander and which make little, to no real security difference. Today
    all companies MUST consider the trust they provide their customers; however, major
    organisations and governments are falling short of basic, fundamental security.
    There is a long way to go until such positions such as'
