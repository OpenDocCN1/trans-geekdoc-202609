    negligence. I would urge the Civil Aviation Authority to launch investigations
    into the lack of security as well as the wider Aviation Authorities. They may
    wish to address their own also, as their homepage has serious security vulnerabilities.


    What is deeply disturbing is: at what point will an Executive Order or the NCSC
