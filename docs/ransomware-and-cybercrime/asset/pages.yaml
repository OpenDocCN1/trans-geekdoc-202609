    New Clothes to such an extent that cyber security firms and so-called security
    experts are guilty of not following good guidelines or best practice. Indeed,
    today, there is an article by *Infosecurity* magazine with the headline *Global
    CISOs Are Undermining Cyber-Hygiene Efforts* after a poll by Constella Intelligence.
    It revealed widespread poor security practices across the target group of over
    100 Global CISOs, which is in keeping with our own research and findings. You
