  md: '# MITRE CWE AND RANSOM TASK FORCE


    Internet security is not easy. We know and acknowledge that; however, we need
    to ensure websites are secure, as cybercriminals only need a single access point
    or a single vulnerability to exploit, and they know where to look and how to find
    them. More importantly, they also know how to exploit them. One of the cardinal
    sins in my opinion is a domain (a homepage) that is Not Secure due to security
    negligence, it is simply unforgivable and relying on an obsolete or invalid SSL.
    It may be mismatched, which is not unusual: by being issued to a different name,
    the domain www.example.com could be www.example1.com, meaning the domain would
    be Not Secure due to the mismatched cert. It could be expired if it were issued
    one year and 5 days ago and valid for a year but ran out 5 days ago, this would
    also make the domain Not Secure. We have witnessed SSL certificates stay expired
    for years and not be picked up. One such company who made Atomic Bombs for the
    DOD and DHS in the United States maintained a Not Secure domain for several years
    until they finally listened to us after several emails.


    It is blatantly clear that not only companies, but also far too many security
    professionals simply do not understand what an insecure domain means, but also
    casual visitors and users do not realise the critical importance of ensuring they
    are on secure domains. When the Not Secure text is in the address bar instead
    of a padlock, which has been in place since Google and others enforced it in 2018,
    it means a domain that displays Not Secure. There is no trickery, it is in fact
    exactly that, NOT SECURE; it warns cyber attackers might be trying to steal PII
    data, credit card details, and so on. Yet day after day, literally millions of
    insecure websites are visited and PII data is captured for nefarious purposes,
    more times than not without any knowledge of what has happened. Think of it as
    Digital Identity Theft. It can of'
