  md: 'security at their websites, and a holy grail is a website that uses obsolete
    SSL certificates, rendering the site exposed, vulnerable, and exploitable. What
    is more, as we have previously mentioned, the domain can be subject to domain
    hijacking and takeover, and ultimately an assailant can take C2, as was the case
