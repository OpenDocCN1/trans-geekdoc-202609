- pgno: 117
  md: 'downstream, let alone a rather embarrassing and ironic situation. Furthermore,
    back to my earlier comment, ‘Who is policing the police?’ A copy of my first letter
    follows:


    Dear MITRE CWE Community.


    We have been working across numerous sectors and will be utilising various MITRE
    CWE’s that the community list for digital certificates such as the following:


    +   - CWE 287 Improper Authentication

    +   - CWE 296 Improper Certificate’s Chain of Trust

    +   - CWE 298 Improper Validation of Certificate Expiration

    +   - CWE 599 Missing Validation of Certificate

    +   - CWE 322 Key Exchange without Entity Authentication


    Furthermore, in the last week, Microsoft have issued CVE2021–26855 that uses insecure
    Port 443 to launch attacks and when it finds such an instance, due to an obsolete
    or misconfigured TLS/SSL certificates, enables the launch of Server-Side Forgery
    (SRRF) attacks sending arbitrary HTTP requests and authentication to the server.
    If HTTPS were being used, such attacks would not be successful.


    Given our findings and experience, from the White House to the US Treasury, from
    SolarWinds to the Vatican, all have been found to be falling foul of the lack
    of control and management of Internet security and PKI. We believe a substantial
    number of organisations are initially targeted by virtue of technology readily
    available to identify Not Secure domains and then to launch easy attacks due to
    the organisation’s insecure position. Often such attacks are not even known about
    until the breach manifests itself.


    We developed an AI technology and business model to provide daily assurance and
    monthly reporting which can also support audits, cyber insurance score carding
    for both initial policies and potentially claims and also for good basic cyber
    hygiene. With 200k attacks per day and cyber criminals launching attacks from
    thousands of miles away, their targets are vulnerable and with weak Internet connections.
    Unfortunately, as we read all the time, offensive capability is right up there,
    defensive is sadly not.'
