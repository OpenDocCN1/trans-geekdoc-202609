- pgno: 104
  md: 'form of Social Engineering cybercrime. Phishing campaigns (Spear Phishing)
    can certainly compromise system integrity. The attack uses misdirection as assailants
    look to gain email access and take over an email account pretending to be someone
    they are not. By way of an example, the FBI in the fall of 2021 suffered a cyberattack.
    Due to an Insecure subdomain and server, the server, more than likely an MX was
    taken over. One hundred thousand FBI emails were sent out to unsuspecting recipients.
    The FBI themselves did not send the emails, however, FBI servers were used to
    send legitimate FBI emails as if they had. Phishing attacks can be used as part
    of a larger attack and use deception to encourage sharing information or to make
    payments urgently to avoid further issues. Avoidance of Phishing attacks can be
    down to internal organisations’ training and diligence, however, insecure Domain
    Name Systems can be used to gain backdoor access and take over servers as was,
    we believe, the case above. There are several Phishing solutions on the market;
    some work well, some not so much. In this area, being vigilant is the very best
    method, and urgent requests for immediate payments from superiors are best checked
    thoroughly before being made. They have, however, caught many major organisations
    out, paying $millions to new customers/clients.


    # Third-Party Code


    Most websites utilise content from third parties. It is the website owner’s responsibility
    to ensure all third-party code used to make up their all singing, all dancing
    website is in fact secure. By way of example, last year The Canadian government
    suffered a hack which included their Tax Offices. We were asked to help via one
    of our colleagues in the region who had a relationship with some of the senior
    government officials. When we started researching, it was not too long before
    we discovered that the flag that was being used by all this government’s websites
    was written in code that put the government websites in a highly vulnerable position;
    no one had checked that, and insecure government websites had been published and
    were being maintained as Not Secure. Unfortunately, the Canadian government had
    already been breached and, in typical fashion, only bothered to check after the
    event. The root cause of the breach was down to third-party code that caused the
    entire domain to be exposed, vulnerable, and exploitable.'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'To mitigate the risk of third-party code making websites insecure, website
    owners/developers and Infosec leads must ensure all plugins are up to date and
    plugins such as WordPress (a well-known weakness and vulnerability) as well as
    others are also up to date.


    # Zero Day Attacks


    ZDAs (Zero Day Attacks) are used mainly by well-funded or financed Nation State
    cyber groups. They take their name from the fact they are a new, unknown attack
    vector and capability, and therefore there are Zero Days (ZD or 0 days) of experience
    to combat the attack. It is effectively a new software vulnerability that has
    not yet been encountered or remediated. Attackers can gain information and intelligence
    and discover loopholes before updates are made public to address them. Often patches
    and updates are months behind the curve of a ZD, and as such, the ZD can be exploited
    for some period before anyone is the wiser. ZDs, once known about, are the catalyst
    for the updates and patches. There is a very buoyant Black Market for cyber criminals
    and governments to stockpile Zero Day Exploits (which can cost six or even seven
    figures) to gain a digital advantage. It is virtually impossible to be proactive
    and prevent ZDAs, apart from good cyber hygiene; however, it is critical to address,
    update, and upgrade software as soon as it is made available.


    # Cookies


    Cookies in the first instance can be harmless and were originally used to ensure
    the user experience was smooth and did not require repetitive logins and data
    repetition. However, cyber criminals can also use cookies for many nefarious activities
    such as making a website appear to be unavailable to users, or insert a cookie
    for data capture. When returning to a website, users are sent a cookie back to
    the web browser. A cybercriminal can alter that cookie in many ways and plant
    cookies as they wish, especially if there is a security issue. If the number of
    cookies is exceeded, a website can become unavailable until the cookies are deleted.
    The law on the use of cookies is constantly a bone of contention, and cookies
    are used by companies to track web browsing history and activity. It is always
    best to opt out of cookies when given'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'the option. It is possible, although a pain for those just wanting a website
    service, to see exactly what the cookies are used for, and there are, as I mention,
    calls to limit the tracking and activity of users as part of a wider privacy drive.
    On some sites, it has become annoyingly complex to opt out of cookies and to trawl
    through that option as opposed to ‘Accept All’. This is nothing more than a marketing
    ploy and should, wherever possible, be avoided. All websites want footfall and
    business conversion in whatever form of metrics that are used. Legislation is
    slow to respond; however, by boycotting websites because of the intrusion, it
    will drive behavioural changes.


    More recently CSP has been added to bolster website security. A CSP is a HTTP
    header that enables operators to have more control over where resources on their
    site can be loaded from. The use of a CSP is the best way to prevent XSS (see
    previously). It is acknowledged that it is not as easy to retrofit a CSP; however,
    CSP has become mandatory for all new websites and highly recommended for all high-profile
    and high-traffic websites. The other major benefit of using a CSP is it disables
    the use of unsafe JavaScript and inline JavaScript, meaning improperly escaped
    user inputs can generate code that is interpreted as JavaScript. Using a CSP is
    the single most effective method to eliminate XSS attacks against a site.


    We know that websites can also be used for Watering Hole and Drive By attacks
    as well as domain hijacking and takeover (Solar-Winds). We also appreciate that
    it is a full-time task to ensure that websites are secure. The changes to security
    for websites come thick and fast but nowhere near as fast as attacks. With an
    estimated 200,000 website attacks a day, it has never been more important, or
    critical to have proper controls and management in place. Companies’ domains can
    certainly be key to their online presence and success; they can also be used as
    part of an overall attack and infiltration strategy. $billion companies such as
    SolarWinds can and do fall victim to attacks that commence as an attack on an
    insecure domain that are using obsolete SSL’s and then become a domain hijacking
    due to being insecure, unmanaged, and uncontrolled. In the case of SolarWinds,
    that attack led to Domain Admin Access (the keys to the kingdom), and tens of
    thousands of companies never once stopped to ask if the SolarWinds digital certificate
    updates were trustworthy; they simply downloaded them, totally unaware of the
    malicious Sunburst code that had been'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'planted within their code. We would also suggest no due diligence was requested
    or insisted upon even by government departments.


    The Internet is indeed an incredible tool for marketing, sales, product launches,
    communication and much more; however, it can and will bite hard and often does
    if left to its own, insecure devices. It will put companies out of business and,
    as mentioned previously, is creating the word’s single largest shift in economic
    terms, with over $6 trillion in 2021 being the cost and losses to cybercrime annually,
    predicted to top $10 trillion by 2025.


    Many have said (including Ginni Rometty, the former CEO of IBM) that cyberattacks
    are the single largest threat to Companies and our economic future, and yet why
    are so many great, experienced experts twiddling their thumbs and so many Captains
    of Industry, as we have mentioned, happily ignoring evidence and the facts? As
    one senior MOD official said to me, the costs in terms of $ and lives is simply
    not large enough yet to get the attention that it urgently requires.


    Maybe we need a central bank or financial regulator to be the victim of a hack.
    From our research, that will not be too far away…'
