    domains. This fact alone is costing the world, most of all the United States,
    $trillions annually.


    I read with interest yesterday that Microsoft are automating HTTPS to their Edge
    Browser for secure browsing. The release, part of their Microsoft 365 roadmap,
    was announced in April this year and should start being rolled out in July. It
    is certainly a step in the right direction. As you will recall, Google migrated
    from HTTP to HTTPS in 2018 after several years of pontification; however, that
    adoption was not unilateral. This action should make hundreds of thousands of
    websites more secure; however, my concern is that a tad like Cyber Insurance,
    it might encourage people to be lazy and continue ignoring their security, expecting
    it to be automated by others. Websites will still massively be more secure by
    having controlled and managed security such as HSTS, cookie policies, and third-party
    scripts. Yes, Man-in-The-Middle attacks could and should be reduced; however,
    a holistic approach to security must be adhered to, reinforced, and carried out
    with discipline and assurance if we are ever to see noteworthy reductions in cyber-
    and Ransomware attacks.


    In a previous chapter, we touched on avoiding the apocalypse, and that term is
    not to scare or frighten anyone; it is a call to arms for governments, people
    who may have previously had ulterior motives, to unite and to finally wake up
    to the avoidable but critical disaster and'
