    CNA Ransomware Attack and Cyber Insurance


    Commercial Insurance provider CNA Hardy were victims of a so-called sophisticated
    Ransomware attack on 21 March 2021 which impacted its operations, including emails
    and the network. Following the attack, the firm issued a statement regarding the
    online (a.k.a. Internet-connected) attack on its website. The website, its homepage,
    was sporting the Not Secure text on the address bar as well as others, and some
    quick research showed CNA’s security Rating as F and 0. In fact having just checked,
    today, 21 May, the Rating has barely moved eight weeks later and sits at F and
    10/100.


    CNA commented that they immediately engaged a team of third-party forensic experts
    to investigate and determine the full scope of the incident. Rather a concern
    is why, then, two months later, are they still insecurely connected to the Internet
    where the original attack commenced? In fairness, that may be a tad harsh (however,
    not really), as last year’s easyJet’s breach 1 January 2020 saw a similar deployment
    of security experts and the NCSC before making the attack public in April 2020.
    We informed easyJet, along with their single largest shareholder and founder Stelios,
    that they were maintaining insecure domains along with sub optimal Not Secure
    domains that we believed where the root cause of the breach. For months and even
    to this day, easyJet.com are maintaining insecure domains with an F and 0 Rating
    over 12 months after going public and 16 months since they were breached. The
    Class Action Lawsuit for the massive 9 million customers who had their PII data
    exfiltrated is being pitched at £2000 per claimant, that is, a total of £18 billion.
    Our research and findings may find us working as expert witnesses and to evidence
    the gross negligence of basic security which clearly continues to this day.


    Back in 2019, I was a guest at a major Cyber Insurance meeting in London’s Mansion
    House hosted by AXA and Accenture. Both'
