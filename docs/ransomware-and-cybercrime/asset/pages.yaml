- pgno: 21
  md: 'continues and indeed increases. As Paul Nakasone said to the Senate Committee,
    ‘Our adversaries do not fear us’. Given our frequent research and findings, candy
    from a baby spring to mind.


    In addition, when organisations supported by the DOD, DHS, RTF, MITRE CWE, and
    thousands of others happily maintain sub optimal security, they have not only
    made themselves a target but an easily exploitable one. We often advise clients
    when such situations occur, even though it may be uncomfortable: was the attack
    down to someone being complacent or complicit? Bitcoin and other digital currencies
    coupled with Blockchains enable a degree of anonymity and one simply cannot be
    sure who the good, and who the bad guys really are. Security is truly a choice,
    as is smoking, drinking, or being reckless. Domain security is critical and overlooked
    systematically and ignored across sector after sector. Ransomware and cyberattacks
    are a self-fulfilling prophecy. Ransomware is rarely sophisticated, as it is always
    termed to mask incompetence and complacency. It is time to call it as it is before
    it is simply too late.


    There are two distinct ways to decrease the chances of being the victim of a cyberattack
    and Ransomware. The first is simply unthinkable in today’s digital world, and
    that is to disconnect everything from the Internet and go back to pen, paper,
    and speaking directly with each other. Or making sure the organisation controls
    and manages Internet-facing and connected security. Ask yourself: why do most
    agencies take this area seriously and, in the main, have security at this critical
    area covered? They know all too well that this is the first access point from
    an adversary thousands of miles away; that thin cable with a connection will punish
    anyone who neglects their domain/server security. We explored several governments
    cyberattacks in the previous book due to insecurity, and we will look at several
    Ransomware attacks in this book, and by the end of it, you will be shocked, in
    disbelief, and possibly a tad paranoid about just what our governments initiated
    and are doing to prevent this downward spiral and trajectory they started 20 years
    ago…'
