- pgno: 101
  md: '# Most Common Website Vulnerabilities and Attacks


    With the massive uptake of digital marketing and explosion of websites over the
    last decade or so, it is fair to say some, far too many in fact, fall through
    the security gaps and become insecure. That is not an excuse; it is sadly a fact.
    Take NASA, for example. The last time we looked, they had over 20,000 domains—yes,
    that is not a typo: over 20,000. Less than 5% are active, the rest are legacy,
    and many have security issues. Furthermore, when we tracked the upward curve in
    website numbers and laid over the data for increased cybercrime costs, the curve
    was virtually identical. It should come as no surprise, then, that websites are
    among the very first place cyber criminals look to gain access for their illegal
    and nefarious cybercrime activities. This should no longer come as a surprise.


    We covered the difference between SSL test ratings and full domain security ratings;
    however, we thought in this chapter, we would list some of the most common issues
    that, when not managed well, lead to exploitable vulnerabilities. Some are more
    serious than others; however, this list is a strong starting point. Knowing that
    cyber criminals are always looking for easy, insecure targets would suggest that
    if the basics are done, and done well, a company that demonstrates good basic
    security will certainly not be the first in line to fall victim to a breach. As
    previously mentioned, we have yet to research a breached company with an A-rated
    website. This is not a coincidence.


    Let us try to keep this as straightforward as possible and not too technical.
    I will leave that to others; however, the following list covers many of the most
    widely used attack methods and makes up some of the metrics that we scan for to
    provide an overall security rating.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# Cross-Site Scripting


    XSS (Cross-Site Scripting) attacks are one of the most, if not the most, common
    attacks, accounting for around 40% of all attacks. XSS attacks are not overly
    sophisticated however frequently used by many cyber attackers, typically using
    scripts that others have developed and that are readily available on the Dark
    Web Cross-Site Scripting targets users of websites instead of the website application
    itself. Code is inserted into vulnerable (insecure) websites and then executed
    by the unsuspecting visitors. The code can compromise the users’ accounts, activate
    Trojans, or modify the website’s content to trick users into providing additional
    information and PII data. The best way to defend against XSS is use a WAF (Web
    Application Firewall). A WAF acts as a filter that can identify and block malicious
    requests to a website. X-XSS has become the No. 3 most used exploit in the OWASP
    Top Ten.


    # Injection Attacks


    Another high-risk factor for websites is SQL injection, listed by the OWASP (Open
    Web Application Security Project) as a major, top ten attack threat. This injection
    attack method directly targets and attacks the website and the server’s database.
    The attacker inserts a piece of code which can discover and uncover data and user
    inputs. It enables modification and can compromise the application. Protecting
    a website against such attacks typically comes down to how well the code has been
    written and how well it is secured. A workflow authentication is also a worthwhile
    option.


    # Man-in-the-Middle Attacks


    MiTM attacks are frequently used when websites have not encrypted their data and
    the data is in plain text. This is very commonly used for Ransomware attacks,
    enabling plain text to be exfiltrated, encrypted, and then sold back to the victim
    along with decryption keys. Attackers target vulnerable websites looking for easily
    available PII data, either data at rest or in transit. When the data is not encrypted,
    it can be read as easily as the text in this sentence and usually breaches all
    privacy regulations, especially if it captures PII data. One of the best'
