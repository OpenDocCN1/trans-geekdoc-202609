- pgno: 56
  md: 'Quick research today confirms that British Airways have clearly not learnt
    much from the breach and have seemingly taken absolutely no action whatsoever
    so far as improving their security, which in turn means no additional security
    measures for their customers. With a Rating of an F and a score of 0 out of 100
    yesterday, it is fair to say BA’s homepage, and their customers, could not be
    more vulnerable or exploitable. Maybe if we were to use the Cyber Analysis Rating,
    as previously suggested, further fines could be levied unless the firm complies
    with basic security measures. If you have several illegal issues with your car,
    you cannot barter for a ‘collective’ deal; equally, if you got stopped several
    months later with the same issues, would you expect leniency because you had paid
    a fine? Of course not, so why are BA and hundreds, if not thousands of, other
    companies addressing breaches and fines as a cost of doing business but ignoring
    making any improvements? That is simply madness.


    We decided to look at other Airlines to see if this was a one-off oversight or
    if lacking security were as systemic as it is in other sectors. In April 2020,
    easyJet, with support from the NCSC, announced easyJet had been breached three
    months earlier in January; however, they decided they would delay informing the
    public. Personally Identifiable Information data of some nine million customers
    was stolen, making it a substantial attack. It was also termed the usual ‘sophisticated
    attack.’ We researched easyJet extensively and found a plethora of insecure domains
    and F- and F-rated homepages. Furthermore, when easyJet made the public announcement,
    just like Travelex did, the website on which they made the public apology and
    update was a Not Secure domain. You could not make this up. There in black and
    white was the text Not Secure in front of easyJet. The certificate was invalid,
    and they were now letting the entire world know; however, what it confirmed is
    that they themselves were ignorant of domain management and security, as was their
    audience. It took us weeks and weeks to even get them to listen.


    The screenshots we took, and hold confirmed basic security was not in place during
    the initial breach. That rendered the easyJet domains Not Secure, exposed, vulnerable,
    and easily exploited. Many of these screenshots have not altered, and many easyJet
    domains remain woefully insecure. But hey, oversight and errors can occur, right?
    So today when we look at the easyJet homepage, it is all good, right? Well, sadly,
    no, it is not. With the same Rating, F, and score, 0, as BA,'
