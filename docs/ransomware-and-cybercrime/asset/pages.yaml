  md: '# 17


    US STATE ATTACKS AND THE CONTINUED OVERSIGHT OF SECURITY


    In this chapter, we are going to look at some of the US states that have recently
    been victims of Ransomware attacks. We will be listing several, along with overviews,
    and conclude with each of their current digital security positions where they
    are connected to the Internet today, post breach.


    Tulsa, Oklahoma, is the second-largest city in the state and the forty-seventh
    largest city in the United States. The population is just over 400,000. The Tulsa
    metropolitan area has a population close to 1 million. Originally, Tulsa was founded
    as a strong energy sector; however, more laterally Tulsa has more diversified
    sectors, including, finance, aviation, telecommunications, and technology. Tulsa
    has two major universities and for most of the 20th century had the nickname Oil
    Capital of the World. Tulsa has been and is still considered a key city.


    Several weeks ago, Tulsa was hit by a Ransomware attack which saw many of their
    computer systems shut down, and officials warned the city that systems would be
    down for three to four weeks. This meant normal, everyday interaction with the
    state would be dramatically affected, all the way to residents paying bills, compounding
    the City’s financial challenges and tasks further. The attack over a weekend affected
    the city government’s network and brought down official websites. The attack is
    currently being handled by the city’s IT team, who have managed to restore some
    of the city’s websites. Many are still not secure, however. This is amazing, as
    insecure websites and domain connections are more than likely the root cause of
    the initial infiltration, as most breaches are. G.T. Bynum, the Mayor of Tulsa,
    said this week that the city would not pay a ransom demand but is focused on restoring
    their systems.'
