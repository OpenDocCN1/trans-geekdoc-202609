  md: '# # 20

    ## Blackbaud, Cyberattacks, and Class Action Lawsuits


    Blackbaud is a Cloud provider that serves charity, not-for-profit, foundation,
    education, and healthcare organisations predominantly. Blackbaud’s flagship is
    a fundraising SQL product called Raisers Edge. It lists its services as fundraising,
    website management (we will look at this further in the chapter), CRM, analytics,
    financial management, and education administration. Blackbaud was founded in 1981
    by Anthony Bakker and is headquartered in Daniel Island, Charleston, South Carolina.


    In 1994, Blackbaud converted its software offerings from DOS to Windows 95. That
    decision saw sales increase from $19 million to $25 million in 1996. During this
    time, Blackbaud was acquiring numerous DOS competitors within the sector, including
    ACOMs, PINOLE, and Master Software, the last acquisition doubled Blackbaud’s customer
    base. Blackbaud started adding resellers to the business in 1998 and completed
    its IPO in 2004. With a flurry of activity and ex-Cap Gemini and Microsoft senior
    executives taking the helm, Blackbaud looked to be in great shape with a successful
    business model and satisfied customers in a niche marketplace. Acquisitions continued,
    and in 2014, Blackbaud acquired MicroEdge for $160 million and a year later, in
    2017, completed the acquisition of JustGiving for £95 million. In 2018, the acquisitions
    continued with the purchase of Reeher for $40 million, and in 2019, they acquired
    YourCase, a SaaS (Software as a Service) provider.


    In May 2020, Blackbaud were the victims of a cyberattack. Initially, Blackbaud
    played down the effects from the attack; however, customer data was stolen, and
    Blackbaud decided it was easier to pay the ransom demand. Interestingly, although
    Blackbaud is a publicly'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'traded company listed on the NASDAQ exchange and has a market cap of $2.7 billion
    due to revenues of just under $1 billion and would have to complete a Form 8-K
    with the SEC should it want to include the ransom paid in their financials, a
    Blackbaud spokesperson at the time said they would not be filing an 8-K form.


    The cyberattack was far reaching, and quite possibly the full extent is still
    being discovered. However, what we do know is the customers affected by their
    breach had knock-on consequential implications and adversities, including over
    20 universities and dozens of charities across the United States, United Kingdom,
    and Canada. Even our own Bletchley Park succumbed to a consequential attack and
    at the time said the costs might be so extensive and prohibitive they would have
    to close the home of British Intelligence and the home of Alan Turing and the
    Enigma team due to Blackbaud’s cyberattack.


    As with all these events, it is critical that liabilities be addressed, and with
    over 120 organisations adversely affected, such events and closures could take
    many years to finally settle. A question that we embarked upon immediately following
    the breach at Blackbaud was announced was: Were Blackbaud securely connected to
    the Internet? As a company, and as mentioned in the first paragraph previously,
    Blackbaud sold their services, and among these was website management. No matter
    whom you talk to, on, or off the record, at the NCSC, NSA, CIA, or any technology
    intelligence-based agency, website security is critical. The most we got the NSA
    to publish earlier this year was their paper based on our continued campaign concerning
    how Obsolete TLS digital certificates could cause vulnerabilities and exposures
    that could be exploited, and although the NSA published it, the content and intent
    were very much one of our initiatives. It could equally have been one of our documents
    and echoed everything we had stated for years.


    We undertook research on Blackbaud’s Internet-facing security, and, although shocking,
    we are no longer shocked, as we have sadly come to expect security incompetence
    and negligence. Blackbaud’s homepage was scanned on 25 November 2019 and showed
    F and 0 security Ratings. It was scanned again on 19 July and showed security
    Ratings of D− and 25. It was further scanned on 21 August 2020 and showed security
    Ratings of F and 20. Leading up to and including the period in which Blackbaud
    had been targeted and breached, they maintained insecure Internet connectivity
    with the worst possible'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'security Ratings, which means several insecure positions were being maintained.
    Interestingly, after the breach and once someone alerted them to their position—it
    could have been one of our emails to their CEO Michael Gianoni—Blackbaud improved
    their Internet security and by 30 December had improved their Internet security
    Rating to a C and 55 and improved it even further, when tested recently on 1 May
    2021, to a B and 75. It currently sits at a C and 55. This research and findings
    demonstrate two things: first, Internet security fluctuates, sometimes quite dramatically,
    and second, Blackbaud were breached during their poorest Internet security scores.
    ... We are not on the inside; however, such research and findings are not an exception;
    they are the norm. In fact, I would go so far as to say that we have never researched
    any organisation that was breached that had an A+ Rating with a 100 score. Without
    exception, they have all been an F and low score or sometimes a Rating of a D
    with 25 score due to Cross-Site Scripting, lack of HSTS, or similar. There can
    be any one of a dozen or more reasons, and cyber criminals need just one.


    Now it is time for the Legal guys to start dissecting the sequence of events and
    try to apportion blame, and hopefully not just have the victim, though usually
    found guilty of being reckless, at fault, lacking duty of care, and negligent,
    for lessons to be learned. Unfortunately, sometimes the awful taste of the medicine
    is required for a patient to truly benefit. Sadly, this is rarely the case in
