    month, they could have gained access to pretty much whatever they wanted. It would
    not be too much to consider a spate of consequential hacks on ExaGrid’s customers
    due to the data being retained. Such an attack could be like the recent Ransomware
    attack on CNA, the US Cyber Insurer, who also paid and have an ongoing Internet
