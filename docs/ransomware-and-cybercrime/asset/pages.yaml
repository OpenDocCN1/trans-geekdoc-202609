  md: '# Air India Ransomware Faux Pas


    Over the weekend of 22 and 23 May 2021, India''s flagship carrier, Air India,
    announced that it had been targeted and become a subsequent victim of the earlier
    data breach and hack at aviation information services provider SITA. Its disclosure
    came five weeks after it was first notified of the situation. This, we believe
    may or may not be true; however, our research team was straight on the case to
    research the breach and discover the facts. A new statement from the airline also
    confirmed that the personal data of around 4.5 million of its customers had been
    leaked in the March 2021 breach that SITA had previously confirmed. I am unsure
    if Air India were or were not breached due to the SITA breach and were looking
    to apportion blame and culpability; however, as the old saying goes, if you are
    going to throw stones, best not live in a glass house.


    This cyberattack and Ransomware breach followed a spate of other similar Ransomware
    attacks in the Aviation Industry. We had previously researched and covered several
    previously (see earlier chapter on the Travel Industry), and those breaches included
    British Airways, easyJet, Star Alliance, and Malaysian Airways. What we discovered,
    unsurprisingly, was the patterns were nearly identical, and all could be put down
    to each of the companies’ sub optimal controls and management of Internet-facing
    and connected domains (websites), as we have also shared previously. Unbelievably,
    many have failed to subsequently address or remediate this, even after being breached,
    which is simply preposterous and renders them vulnerable to being attacked again
    and should be considered complicit by their complacency. To put this into context,
    take BA, easyJet, and many others, for that matter. They have renewed and possibly
    upgraded many of their devices, servers, laptops, and so on; however, no sooner
    are they turned on and connected, than they can become compromised due to the
    insecure overall position and'
