    of $2.6 million was paid in Bitcoin to the Conti Gang, who then released the decryption
    key.


    ExaGrid’s homepage states: ‘Fastest Backups, Fastest Recoveries. Industry’s Best
    Ransomware Recovery. Unparalleled, Cost-effective Scale-out’. What it does not
    state is: We are wide open to being infiltrated and attacked with Ransomware,
    as our Internet security Rating and score are F and 0...'
