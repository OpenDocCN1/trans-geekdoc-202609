    and leadership must comply with good basic security and fit-for-purpose Internet
    connections, and yet from having conducted research, I would suggest over 75%
    of organisations have insecure positions. Of 1.2 billion websites, that is quite
    a target audience for cyber criminals to profit from…


    As always, we are no strangers to looking at the bigger picture and were requested
