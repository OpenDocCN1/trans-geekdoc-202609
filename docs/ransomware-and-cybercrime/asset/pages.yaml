    improved or enhanced, and the losses written down and written off. If one were
    cynical, one could easily think this is a clever way to withdraw funds without
    any recourse and ultimately, the government and taxpayer pick up the tab.


    Sadly, very few organisations seemingly really understand security or the root
    causes for being infiltrated in the first place. The Internet is always the best
    place to check first for security issues, as time after time, such suboptimal
    issues lead to being exposed, vulnerable, and exploited. It still amazes us that
    companies such as global leaders, regulators, and even governments do not understand
    the implications of being insecure at their public-facing and Internet connections
    or do not want to. The NSA and GCHQ perfected domain admin infiltration over twenty
    years ago, although clearly it was not in their interest to highlight the vulnerabilities.
