    is always an option; however, you cannot outsource accountability or responsibility.
    The legal boys will simply start with their Class Action Lawsuits and tie up organisations
    and people with more time and associated costs.


    We are fast approaching the middle of 2021, and the GDP for the entire world has
    been dramatically reduced, that is, apart from one country, China. It is widely
    known and accepted that China wants to become the Number 1 Economic power from
    their current Number 2 position. It is also widely known and accepted that 80%
    of all cyberattacks are against US companies, governments, CNIs, and so on as
    the United States is more reliant upon digital devices and the Internet. It is
    no coincidence that website proliferation is directly tracked and matched by the
    proliferation of cyberattacks and $losses over the last decade. When laid over
    each other, the upward curve is near identical.


    So, the choice is ours. We can either continue floundering in the wake of attack
    after attack and being busy fools or make sure we are secure facing and connected
    to the Internet to prevent easy infiltration. Websites and the Internet were designed
    to aid our daily lives, communications, and business. Sadly, due to the massive
    focus, originally by the CIA, National Security Agency (NSA), and Government Communications
    Headquarters (GCHQ), of mass digital data collection and also, over the last decade
