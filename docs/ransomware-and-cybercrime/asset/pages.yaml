- pgno: 147
  md: 'It would not be unreasonable to say that today, a few short decades after the
    original scepticism, the entire world relies upon computing and PCs. Countries,
    taxes, purchases, infrastructure, banks, governments—literally without exception,
    every single thing we do, and use relies on computers. The Computing Industry
    is one of the largest sectors in the world today and accounts for many of the
    world’s richest companies. Could you think of a world without computers today?
    Of course not, as they touch our lives every day. We will dive into that further
    at the end of this chapter.


    When the first taxis came into being in the early 1900s, anyone could become a
    taxi driver, such as ex-convicts and people with questionable habits and traits.
    It was not until 1907, when Harry N. Allen, a 30-year-old businessman, was charged
    $5 for a three-quarter mile ride in Manhattan (nearly $150 today), that he decided
    to buy a fleet of 65 French Darracq taxi cabs all in red and hired drivers for
    them to create the world’s first taxi fleet. At that time, only the well-heeled
    could afford taxis; however, Allen’s new taxis ceased opaque charging to make
    taxis more affordable. When the taxi medallion system was rolled out in New York
    in 1937, the local government began regulating taxis and their drivers. In New
    York alone (pre COVID-19), around 400,000 taxi journeys are made, which is twice
    the number of Uber and Lyft journeys combined. Taxis and shared rides (pooled
    and fractional ownership) have revolutionised local travel, and that is before
    we start the next journey of electric, semi- and fully autonomous vehicles. Such
    situations rely on technology and innovation, and currently there are major challenges
    ensuring control without digital intervention. Single-use digital certification
    and a Zero Trust Architectures are a must and yet are nowhere near possible due
    to the issues we have addressed previously with PKI and the issuance, control,
    and management of digital certificates.


    This subject of vaccinations is very current. A smallpox outbreak in the 1870s
    led to a call for a vaccination program. A group of anti-vaccinationists (anti-vaxxers
    now) campaigned heavily against such a program. Nothing particularly new; however,
    the main bone of contention was the law stating immunisation was required. It
    was argued that personal hygiene and bodily control would provide the freedom
    of choice to enable opting out of state-mandated vaccinations. In a Boston court
    in the early 1870s, an anti-vaxxer fought the law through'
