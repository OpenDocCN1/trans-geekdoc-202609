    and the breach has caused a week of disruption. Gas stations and fuel lines have
    run dry, and a huge number of people on the East Coast are angry and want answers.
    The situation may only have been minimised by the restrictive travel and effects
    of COVID-19. Fuel prices have escalated, and Colonial have been found not to have
    any security worthy of note, let alone good security or good security resources.
    This position enabled and indeed facilitated Remote Access, and in turn, that
