    went on the hunt for vulnerabilities. It was not long before we found several
    JBS Foods homepages rated with F and 0 ratings. The website, connected to all
    international domains, would and easily could have been used to laterally move
    around other parts of the network just as SolarWinds and Colonial suffered, and
