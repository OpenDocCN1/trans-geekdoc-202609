  md: '# 9


    # # ENSURING THE SECURITY

    # OF INSECURITY


    In this chapter, we look at the direct correlation between Internet-facing security
    and breaches. We have researched many hundreds of breached organisations, actually
    over 1000, often several times a day. The one thing they all have in common across
    these disparate and often totally unrelated organisations, on different continents
    and in different time zones, is they all have sub optimal Internet-facing and
    connected domains. We are not talking a slight variance, either. Our research
    and findings show a 100% result of hacked organisations typically have security
    Ratings of F and often a 0. Sometimes it might be an F and 5 or 10. We have never,
    let me repeat that, we have never found a company with an A+ Rating and 100 score
    that has been a victim of a breach. One could call it coincidence, or one could
    call the target group unlucky; however, as mentioned, this is not a high percentage
    or ratio: it is 100%. Every single organisation from SolarWinds to Donald J. Trump
    has been maintaining sub optimal domains and, on many occasions, domains with
    obsolete SSL certificates. As I have mentioned before, this means the certificate
    has expired, or there is a configuration error rendering the site Not Secure,
    and being Not Secure, means the authentication and data of the site can lack integrity
    and data may be being transferred in plaintext form, that is to say, not encrypted.
    It does not take a rocket scientist, professor, or even a cybercriminal to know
    that plaintext data is a Ransomware criminal’s main goal to exfiltrate. Once exfiltrated,
    they can then encrypt it, and only they have the decryption tool. I would go as
    far to say such situations are at the very top of the list for cybercriminals
    intent on extortion via Ransomware attacks.


    Over the last two years, our findings have seen us assisting the FBI when we discovered
    a Korean DNS in the central voting system, presenting reports to the Senate Intelligence
    Committee re the SolarWinds'
