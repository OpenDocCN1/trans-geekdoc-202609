    As in the case of Wald, the CNI company was barely able to look at and manage
    the certificates they believed they knew they had, let alone the millions they
    had no idea of. This position was much better understood by the US and UK governments,
    and they knew without any hesitation that organisations, including governments,
    would have no idea at all if a few more digital certificates were added with the
    ability to send data back via the Internet to the Mothership. You can easily see
    how this method or blueprint of infiltration, certificate insertion and plants,
    and then exfiltrating data, could and would be used by cyber criminals once they
    understood and gained the same tools, the same techniques that had designed and
