  md: 'identified this as not so much a math problem but a problem of survivorship
    bias, and once you understand this concept, you start seeing it everywhere. Survivorship
    bias tells a lot of distorted and incomplete stories, and looking for the ‘missing
    bullet holes’, as Wald did, can save you from making bad decisions based on inaccurate
    and incomplete information.


    Cryptography and cyber security are very similar to the Wald story, as most people
    focus on the certificates and keys, they think they know they have (known knowns)
    and even then, in the majority of cases, struggle to manage them; however, it
    is not just the certificates and keys that you can see and know about that will
    cause chaos, service outages, and cyberattacks, harming a company. Just as in
    the story of Abraham Wald and survivorship bias. It’s the ones that you do not
    know about, cannot see, and do not allocate or allow for (unknown unknowns) that
    will ultimately cause failure.


    A fact few know, however, is how many certificates a standard laptop might have,
    for example. How many digital certificates might be used, or indeed planted or
    misused on a gold-standard device? We have scanned more laptops with Whitethorn
    than I care to remember, and the number always surprises everyone. The number
    of digital certificates on a typical laptop range between 200,000 and 250,000
    certificates, with around 20,000–30,000 unique certificates. When we researched
    and tested a Critical National Infrastructure organisation last year, we discovered
    a total of 15 million certificates across a controlled group of devices. Revoked,
    expired, sanctioned, weak, and expired certificates and those with Admin Access
    from regions and countries that could simply take C2 due to the privileges they
    held and with excessive validity periods would mean such C2 could be taken over
    many decades.


    On a global cyber security firm’s laptop in a controlled environment in Germany,
    with their country lead and PKI expert, we discovered some 287,000 certificates
    with the usual array and plethora of issues and several Chinese certificates with
    999-year validity with full admin access and control. We urged action after assisting
    their PKI expert and several partners within the group up off the flaw. They decided
    to leave it and, as they do not use Whitethorn, one can only guess they are in
    the same position. . . . The same company, the world’s reputedly'
