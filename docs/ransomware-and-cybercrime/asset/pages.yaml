    In the 1960s, GCHQ started work on securing communications (think encryption and
    decryption) that would become known as PKI (Public Key Infrastructure) and would
    go on to be further developed by eminent professionals such as Ralph Merkel, who
    in 1978 developed PKI. PKI would go on to become globally adopted in the 1990s
    as a secure mechanism to guarantee digital communication and authentication of
    the user, and the device. PKI used a framework that relied upon digital certificates
    and encrypted (digital) keys. You will be familiar with mobile phone Apps such
    as WhatsApp (now Facebook), Signal, and possibly less well-known Apps such as
    Wire. The aim of all these Apps was to utilise Encryption and Decryption so that
    communication, just as PKI set out to achieve, was indeed encrypted between users,
    and only those with the permission of both parties could read each other’s messages,
    documents, and so on. The exact timing of the NSA’s and GCHQ’s decision to roll
    PKI out globally and to ensure it had their own ‘plants’ is unknown; however,
    it is suspected it was quite possibly instant and part of the overall strategy.
    What better way to gain intelligence on one’s adversaries and allies alike, when
    they thought everything was encrypted, safe, and secure? As mentioned previously,
    the US government went so far to gain total and global capability in this area
    that they secretly bought and owned two of the world’s leading Encryption organisations,
    namely Crypto AG and Omnisec. Both companies were Swiss companies, who during
    world wars were supposed to be neutral; however, when this information was confirmed
    in 2020, it certainly was a huge embarrassment to the Swiss government and totally
    undermined their neutrality.


