- pgno: 97
  md: 'The second screenshot we took, also on the morning of 24 May, showed Air India''s
    website, their homepage, as Not Secure in the address bar. When we looked further,
    it did not even confirm a certificate at all. It did, however, confirm 45 cookies
    were being used to improve the customer experience. A customer can go onto their
    Not Secure website and book, pay, and plan flights whilst being totally insecure
    due to another misconfiguration.


    The last screenshot we took was of the overall security Rating of Air India''s
    Internet-facing connected position. The Ratings of F and 0 correctly confirmed
    that there are indeed serious security issues that need addressing. To confirm,
    we screenshot and timestamp everything for any legal disputes or when companies
    take our Actionable Intelligence that we try to assist them with and then totally
    ignore us. It allows us to demonstrate their positions pre and post being informed.
    It is also useful should any Class Action Lawsuits take place later to evidence
    their position at the time of the breach. When we looked even further at Air India''s
    position, we discovered that a new RSA 2048-bit Digicert certificate was placed
    on the domain on 9 April 2021 at 01:00 CET which was valid until 11 May 2022 at
    00:59 CET. It was at this point we discovered the real error, a totally human
    error of their server setup and configuration. We cannot retrospectively confirm
    how long this insecure position had been set; however, we can hypothesise that
    with the Google change of HTTP to HTTPS in 2018, the problem may have been as
    old as 3 years. No one noticed or bothered to check, not even when renewing certificates
    for their homepage, which is nothing short of gross incompetence and negligence
    when it comes to security.


    Whomever at Air India is responsible for their Internet Security and/or PKI had
    misconfigured the server. The server rightly supports HTTPS; however, is configured
    to redirect to HTTP, a complete error or was it complicit? In car terms, this
    is as if a modern car with excellent tyre technology had been fitted with cross-ply
    tyres from 1950. If you Google HTTPS, you will see this became the standard back
    in 2018, and any domain/server using the insecure HTTP would be displayed as Not
    Secure. It may also show the following warning: ‘Your connection to this site
    is not secure. You should not enter any sensitive information on this site (for
    example, passwords or credit cards) because it could be stolen by attackers’ …'
