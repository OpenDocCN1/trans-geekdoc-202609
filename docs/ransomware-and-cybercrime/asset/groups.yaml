  - '[PAGE 133]


    significant city in Knox County in Tennessee. Knoxville is the third-largest city
    in the East Tennessee Grand Division, behind Nashville and Memphis. The first
    settlers in Knoxville were in 1786, and the arrival of the railroad in 1855 led
    to an economic boom. The Civil War bitterly divided the region. Following the
    war, Knoxville grew rapidly as a major wholesaling and manufacturing centre. In
    1982, Knoxville hosted the World’s Fair, which helped reinvigorate the city. The
    University of Tennessee is based in Knoxville, as is Tennessee’s supreme court.


    According to Knox News, Knoxville received a demand of $393,137 to enable them
    to retrieve their data from the attackers; however, they refused to pay. The attackers
    had attacked Knoxville with DoppelPaymer Ransomware, which had infiltrated, exfiltrated,
    and then encrypted the data. This has become the default sequence of events in
    Ransomware attacks. Kristen Farley, the city’s communications director, said that
    the groups the city hired to investigate the 11 June attack had completed their
    work and had identified the compromised accounts and planned to mail several hundred
    letters to the affected parties. Knox News went on to explain that cyberattacks
    on local governments are not uncommon. They can begin when an employee opens a
    bogus email that appears legitimate and enters a username and password, allowing
    cybercriminals access to the computer system. Knox are correct to an extent; however,
    all of this, including a Phishing email campaign, is certainly easier and more
    acceptable if a server via an insecure website is first accessed and utilised
    making the Phishing emails look like internal emails as happened to the FBI towards
    the end of 2021. In fact, total Domain Admin Access can be obtained via this route,
    as in last December’s SolarWinds cyberattack that affected some 18,000 companies.
    Breaches can be like an incredibly long line of stacked dominoes: push one over
    and you can sit back and watch the rest fall…


