    having it manipulated? When a company such as UKTech, UK Finance, and Critical
    National Infrastructure/nuclear power organisations ignore our Actionable Intelligence
    with evidence of insecurity, Chinese and Russian infiltration because GCHQ suggested
    it did not matter, something is seriously wrong. For the avoidance of all doubt,
