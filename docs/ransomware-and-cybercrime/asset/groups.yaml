    header that enables operators to have more control over where resources on their
    site can be loaded from. The use of a CSP is the best way to prevent XSS (see
    previously). It is acknowledged that it is not as easy to retrofit a CSP; however,
    CSP has become mandatory for all new websites and highly recommended for all high-profile
    and high-traffic websites. The other major benefit of using a CSP is it disables
    the use of unsafe JavaScript and inline JavaScript, meaning improperly escaped
    user inputs can generate code that is interpreted as JavaScript. Using a CSP is
    the single most effective method to eliminate XSS attacks against a site.


