    cyber resilience and basic security in place? Such a situation would ensure Best
    Practice and enable benchmarking of fit-for-purpose security along with evidence
    demonstrating what ‘good’ actually looks like? Customers take cyber cover in their
    attempt to provide additional risk mitigation; they do not expect a breach to
    originate via their cyber insurance provider, and yet the CNA breach is proving
    just that…


    The world’s leading Insurers collectively underwrite policies that could be liable
    to settled claims totalling $billions and ensure the stabilisation, post breach,
    of thousands of employees. Is it not therefore imperative that all parties, the
    Insurer, and the Insured, adopt and are able to demonstrate the very strongest
    and most resilient cyber posture and maintain such a position throughout the lifespan
    of the policy? Sadly, this is not the case, in fact, it is rarely ever the case.


    There is much controversy currently over Insurers enabling and settling payments
    on claims against Ransomware attacks. Earlier this year, the former head of the
    NCSC, Ciaran Martin, said, ‘Insurers paying ransomware demands were fuelling cybercrime’.
    I agree with Mr Martin; however, I do not agree with the lack of NCSC and Insurer
    action within this and other sectors. Writing a cautionary note to be included
    in one’s handbook is hardly taking all-out action. It certainly is not taking
    the urgently required proactive stance on cyber-attack prevention or the greatly
    needed increase in security posture. Don’t forget, the NCSC are in all UK companies
    that suffer breaches, yet months later, the company still display woeful Internet
    security, hardly thought leadership and progress…


    In real terms, the Cyber Insurance sector is still in its infancy. Yet the sector
    is making some huge, extremely influential decisions that are having an incredible
    impact. Sadly, mistakes are also being made. Let me explain. Insurance Actuaries
    are scrambling and desperate for data and metrics within the cyber world to base
    their models of probability on within this immature new market. Furthermore, because
    of the lack of cyber security knowledge, from a defensive and indeed offensive
    standpoint, as well as what maintaining good basic cyber security really looks
    like and means, they are themselves made prime targets with little to no defence,
    as CNA and others have found out to their great cost.


    Last weekend, AXA made a statement that they would no longer guarantee Ransomware
    settlements as part of a cyber insurance policy. Our research in which we continuously
    look at majors such as AXA had their Internet security rated very poor, and within
    a week of making their bold statement, AXA were made the victim of a Ransomware
    cyberattack; just like CNA and others, their Internet connectivity is acting like
    beacons, easily identifiable for cyber gangs to identify, see where the vulnerabilities
    are, and launch attacks.


    Let us look more closely at CNA: unquestionably a major Insurance company and
    yet so easily breached whilst at the same time lacking basic security, as can
    be seen by the Not Secure text on their address bar. As of today, I can confirm
    the homepage, www.cna.com, is now secure; however, other subdomains of CNA’s remain
    insecure. CNA remain vulnerable and exposed to being further exploited. To confirm,
    CNA are as vulnerable today as the day they were initially breached and, through
    a lack of knowledge, incorrectly believe they are secure by virtue of their homepage,
    whereas in truth, all of their Internet-facing domains and subdomains are still
    insecure and further exploitable. Not to mention what infiltration and plants
    may have occurred for later use.


    Another major concern has been inadvertently created whereby many organisations,
    as part of their cyber strategy, purchase cyber insurance only to incorrectly
    consider the policy a ‘get out of jail free card’ and by default, sometimes even
    by design, overlook or even ignore the basics, as they unquestionably should not.
    All too often, insuring parties complete policy document forms with little more
    than a tick-box, subjective exercise to evaluate a policy and premium.


    A much simpler and better way. Just as the world’s Financial Markets depend upon
    Credit Rating Agencies, why do the insurance and other markets not have a reliable
    Secure Rating facility? Such a solution would enable evidence-based policies,
    vastly improved security postures, and a reduction in attacks. We have designed
    and offered such a solution that would provide a unique insight and capability,
    plus vastly improved knowledge and understanding.


    Why might any individual or company not want to know the security posture and
    Rating of a company they were looking to do business with? It does not matter
    if it is a multi-$billion M&A deal, an IPO, or a cyber insurance policy for $50
    million. If you do not have a clearly evidenced security posture, it may not be
    too long before you wish you had. Insurers could, for the first time, provide
    much of the lacking expertise and basic security by design instead of playing
    a ‘numbers game’.


    If we have learned anything from the recent SolarWinds breach, the Microsoft breach
    CVE-2021-26855, or indeed the breach at CNA, it is that they all suffered initial
    access that was related to, and because of, insecure SSL/TLS digital certificates
    and websites. All the examples in our research and reports show this. Such situations,
    with the right tools and capability, are in the public domain and yet continually
    overlooked, ignored, and left to chance. Insurance companies need to become more
    security savvy; currently, this is clearly not the case.


    Lloyd’s of London, simply known as Lloyd’s, is the world’s leading insurance and
    reinsurance marketplace. Lloyd’s was set up in 1686 by Edward Lloyd. As of 2019,
    Lloyd’s has 80 syndicates managed by 54 agencies that collectively wrote £35.9
    billion of gross premiums. Unlike most of its competitors in the Industry, Lloyd’s
    is not an insurance company; rather, Lloyd’s is a corporate body governed by the
    Lloyd’s Act of 1871 and subsequent Acts of Parliament. Lloyd’s in many ways is
    considered the ‘voice’ of all global insurance and a leader within the new world
    of Cyber Insurance. Sadly, Lloyd’s themselves are as guilty as those already mentioned
    in the Insurance market when it comes to security, as evidenced by maintaining
    suboptimal, highly vulnerable, and easily exploitable websites with a Rating of
    F and a score of 0. One only must consider last year’s Blackbaud or SolarWinds
    breaches to understand a single breach can force thousands of subsequent breaches.

