    # IT IS NOT SETTING GOALS TOO HIGH, BUT SETTING THEM TOO LOW AND ACHIEVING THEM


    We constantly hear the statement that everyone should be prepared to have their
    data compromised, stolen, and abused, and that is from our own governments. The
    title of this chapter is very apt. It is also a sad fact that our own governments
    have gladly abused the position to infiltrate organisations and other governments
    due to their targets lack of knowledge and ability to ensure Internet-secure positions.
    It is also questionable as to why, even though it is a conflict of interest, the
    US, UK, and other governments have not educated the masses in Internet security,
    they are finally and we have been told by many, the sharing of information has
    all the hallmarks, and fingerprints of our efforts and work.


    Over the last weekend, we decided to research some of the biggest names in the
    industry to see exactly how seriously they take Internet security and that of
    their clients. The two primary organisations are the Centre of Internet Security,
    cिसecurity.org, and the Information Systems Audit and Control Association.


    On the website of cिसecurity.org, it states:


    > > The Centre for Internet Security, Inc. (CIS®) makes the connected world a
    safer place for people, businesses, and governments through our core competencies
    of collaboration and innovation.


    > > We are a community-driven nonprofit, responsible for the CIS Controls® and
    CIS Benchmarks™, globally recognized best practices for securing IT systems and
    data. We lead a global community of IT professionals to continuously evolve these
    standards and provide products and services to proactively safeguard against emerging
    threats. Our CIS'
  - '[PAGE 166]


    Hardened Images® provide secure, on-demand, scalable computing environments in
    the cloud.


    CIS is home to the Multi-State Information Sharing and Analysis Centre® (MS-ISAC®),
    the trusted resource for cyber threat prevention, protection, response, and recovery
    for U.S. State, Local, Tribal, and Territorial government entities, and the Elections
    Infrastructure Information Sharing and Analysis Centre® (EI-ISAC®), which supports
    the rapidly changing cybersecurity needs of U.S. elections offices.


    CIS state that their vision is to lead the global community to secure our ever-changing
    connected world and that their mission:


    > is to make the connected world a safer place by developing, validating, and
    promoting timely best practice solutions that help people, businesses, and governments
    protect themselves against pervasive cyber threats.


    It is very encouraging and comforting to read, and indeed believe, there is this
    major body, supported by US governments and major corporations, advising and leading
    best practices within the often confusing and insecure world that is the Internet.
    Given their position, status, and gravitas, one would naturally assume, without
    being too assumptive, that cybersecurity.org would undoubtedly be securely connected
    to the Internet. Sadly, and rather embarrassingly they are not. We researched
    and wrote to CIS yesterday and sent a copy to the CISA confirming CIS had a security
    Rating of F and a score of 0. In other words, their Rating and score could not
    be worse. The Rating for CIS in June 2016 was healthy B and 70; then that September,
    it slipped to a D and 30, and then finally in August 2020, it went all the way
    down to a Rating of F and a score of 0. This Rating and score are a direct result
    of lacking HSTS headers, redirection issues, third-party content, insecure coding
    issues, and X-Content and XSS issues. To reconfirm, the Rating of F and score
    of 0 are the worst possible Rating and score for Internet security, and this is
    the Centre for Internet Security, depended upon by thousands of organisations
    and governments, no doubt with a vast amount of client data.


    We wrote to the CIS Chief Technology Officer and provide screenshots of our research
    and findings and are awaiting a response.


    We then looked at ISACA. ISACA stands for Information Systems Audit and Control
    Administration. On their website, it states the following:'
