    此外，谁去检查、又有能力检查，在密钥库的二进制深处是否被巧妙地植入了几个 SSL 证书？那些最初使得——甚至可以说助长了——渗透的数字访问门户，往往对下一次攻击大开方便之门。安全并未得到改进或加强，损失则被减记和核销。如果一个人持愤世嫉俗的态度，很容易认为这是一种巧妙的手段，可以在没有任何追索的情况下提取资金，而最终由政府与纳税人买单。


    遗憾的是，似乎很少有组织真正理解安全，或者理解最初被渗透的根本原因。互联网始终是首先检查安全问题的最佳场所，因为一次又一次，这类欠佳的问题导致系统暴露、易受攻击且被利用。令我们仍然感到惊讶的是，诸如全球领先企业、监管机构甚至政府这样的组织，并不理解它们面向公众和互联网的连接不安全所带来的影响，或者说不愿去理解。NSA
    和 GCHQ 在二十多年前就完善了域管理员渗透技术，尽管很明显，暴露这些漏洞并不符合它们的利益。即便到今天，凭借协助两国政府的亲身经历，他们也只是勉强接受了我们的研究和发现，其中包括中央投票系统、国家网络安全中心（NCSC）自身不安全的域、联邦调查局（FBI）以及唐宁街
    10 号。


    去年秋天，uhnj.org（新泽西大学医院）正处于包括 COVID-19 在内的多重危机之中，并成为了勒索软件攻击的受害者。他们确实失职了，忽视了问题，甚至因维护欠佳且不安全的域而犯有基本安全疏忽的过错，其中包括一个最严重的错误：他们的主页依赖过时的
    TLS 证书。因此，他们的主页缺乏身份验证和数据完整性，完全暴露在众多已知攻击之下，包括劫持、水坑攻击、路过式下载、访问、代码注入，当然还有明文数据——这正是勒索软件犯罪分子的主要目标。即使在被告知后，该主页似乎仍然“自豪地”显示着“不安全”字样，并且持续了好几个月。


    我们多次致信总裁兼首席执行官谢里夫·埃尔纳哈勒（Shereef Elnahal）。谢里夫是一位备受尊敬、似乎很受欢迎的人，也是其领域的专家。我们在六个月内敦促他处理过时的
    TLS 问题。我们甚至在他 LinkedIn 文章下添加评论以引起他的注意；但毫无效果，直到今天，UHNJ 的主页仍然令人难以置信地保持“不安全”状态，使该组织、患者的
    PII 数据以及上下游关联第三方暴露在风险之中。维持这种状态不仅仅是疏忽；简直就是严重无能，并且是该行业乃至整个国家整体不安全状况的一个主要促成因素。地址栏中的“不安全”字样，人们到底哪一点不明白？


    2020 年 5 月，我们提醒阿拉斯加州注意其不安全状况。阿拉斯加是五十个州中的第一个（我们着手处理的州），尽管我们知道按字母顺序排列，阿拉巴马州排第一，但我的一位挚友鲍勃住在阿拉斯加，所以有意从那里开始。研究之后发现了非常令人担忧的结果，包括
    27 个 CVE，其中一些是严重的，一些甚至可以追溯到 2011 年。我们多次向阿拉斯加政府发送电子邮件和信件。每一条消息都未被回应和忽视，尽管他们在前一年曾遭遇过
    PII 数据泄露。2020 年 12 月 4 日，阿拉斯加宣布了另一次泄露，而我们的研究再次显示，该州各域存在持续的系统性整改缺失和不安全状况。本周，阿拉斯加在两年内第三次遭到入侵。我们的研究显示，阿拉斯加法院系统的主页再次因过时的
    TLS 而保持“不安全”状态。数百万甚至数十亿美元花费在资源、建筑和基础设施上，然而互联网安全却被严重忽视和持续无视；这应该被定为刑事犯罪……


    简而言之，勒索软件是最简单的网络攻击之一，很少被吹嘘为“复杂”，因为公司很容易被网络罪犯识别为具有易于利用的漏洞和明文数据。这类攻击可能只需数小时就能启动运行……保险公司也帮不上忙。许多保险公司根本不知道良好的网络安全是什么样的，也不知道需要什么来防止攻击。事实上，许多保险公司——包括一些世界最大的保险公司，如伦敦劳合社、怡安、Willis、CNA、苏黎世等——自身也完全有可能被入侵。只需看看
    CNA，它最近就因域安全欠佳而遭受攻击；还有 AXA，上周遭到入侵，讽刺的是，就在它宣布不再将支付勒索软件赎金作为保单的一部分提供担保之后，接着就被——你猜到了——勒索赎金的网络罪犯入侵了……这种情节编都编不出来。而当
    AXA 和伦敦劳合社的首席执行官及全球首席信息安全官否认其不安全状况的证据时，也就不足为奇了。我以为保险公司应该减轻客户的风险，而不是增加他们的风险，然而
    CNA 和 AXA 的入侵事件却让它们的客户更加脆弱，包括在确认保单细节和勒索软件赎金索赔门槛方面……


    坦率地说，许多公司、保险公司和政府毫无疑问正在充当自己最大的敌人。知识和纪律的缺乏正让一家又一家公司栽跟头。我们所提倡的大部分内容就是良好的基本安全卫生。无视这一点——正如阿拉斯加州、CNA、UHNJ
    以及成千上万继续无视问题、行事疏忽的机构那样——正让他们和全球经济付出高昂代价。他们将遭受多次攻击和入侵，直到最终要么倒闭，要么开始确保互联网、面向公众和连接的安全。就这么简单。


    正如史蒂夫·乔布斯所说，雇用聪明人然后告诉他们该做什么是毫无意义的。与此非常相似的是，当你目睹一次又一次的入侵以及同样不安全状况的持续时，如果你雇用了更聪明或更有经验的人，请停下来倾听：按你拥有它们的比例使用你的耳朵和嘴巴——多听少说。同样，当你收到漏洞警报时，仅仅因为你当时可能没有请求或付费购买这些可操作情报，绝不意味着其有效性就不那么重要。先检查，再修复。我们还主张对这种情报给予奖励，就像你肯定会为漏洞支付赏金一样。作为专业披露的一部分，你为什么要反驳或否认可能防止一场造成数亿美元损失的大规模入侵的可操作情报呢？


    昨天，一位来自某家十亿美元网络安全公司的全球首席信息安全官对我说：“我们每天扫描，我们有这个和那个能力，我不相信你能给我们展示什么，但我愿意听一听。”数小时内，我们就发现了十几个完全不安全的域，使该公司处于与
    SolarWinds 被入侵之前相同的境地。考虑到其政府客户的高度敏感数据和连接，我们随后被无视，这似乎是一种个人声誉和自负的情形，而且至今仍然不安全。


    勒索软件和网络攻击是可以大幅减少的；然而，我们都需要共同努力，使互联网和互联网连接变得安全。为了每一家公司、每一个组织、每一个政府和每一个人。没有什么地方比与互联网相连之处更重要的了……


