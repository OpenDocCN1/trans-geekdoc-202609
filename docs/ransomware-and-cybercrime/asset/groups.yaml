    I will leave that to others; however, the following list covers many of the most
    widely used attack methods and makes up some of the metrics that we scan for to
    provide an overall security rating.


    ## Cross-Site Scripting


    XSS (Cross-Site Scripting) attacks are one of the most, if not the most, common
    attacks, accounting for around 40% of all attacks. XSS attacks are not overly
    sophisticated however frequently used by many cyber attackers, typically using
    scripts that others have developed and that are readily available on the Dark
    Web. Cross-Site Scripting targets users of websites instead of the website application
    itself. Code is inserted into vulnerable (insecure) websites and then executed
    by the unsuspecting visitors. The code can compromise the users’ accounts, activate
    Trojans, or modify the website’s content to trick users into providing additional
    information and PII data. The best way to defend against XSS is use a WAF (Web
    Application Firewall). A WAF acts as a filter that can identify and block malicious
    requests to a website. XSS has become the No. 3 most used exploit in the OWASP
    Top Ten.


    ## Injection Attacks


    Another high-risk factor for websites is SQL injection, listed by the OWASP (Open
    Web Application Security Project) as a major, top ten attack threat. This injection
    attack method directly targets and attacks the website and the server’s database.
    The attacker inserts a piece of code which can discover and uncover data and user
    inputs. It enables modification and can compromise the application. Protecting
    a website against such attacks typically comes down to how well the code has been
    written and how well it is secured. A workflow authentication is also a worthwhile
    option.


