  mdcn: '

    长话短说，在 MITRE CWE 处理了我们向他们指出、而他们却毫不知情且因此完全暴露的安全错误之后，我们要求 MITRE CWE 分配一个新的 CWE，以便为这一常见漏洞和威胁提供信息；然而，一旦我们协助了他们，他们就好像从地球上消失了一样，从此再无音讯。在我们救了他们一命之后，这样的做法似乎有点粗鲁且不合情理。也许他们有什么不可告人的秘密？我们本以为被认可为该领域的思想领袖是一项突破；然而，MITRE
    CWE 想要的只是摆脱我们，并且希望我们不再被提及。我随后发了几封邮件，均未得到回复。


    第二个让我们真正震惊、也让我们极为失望的组织是安全与技术研究所（Institute for Security and Technology, IST）。该所在美国政府的支持下成立了勒索软件工作组（Ransomware
    Task Force, RTF），表面上看非常出色。我们全力投入，开始与他们的团队进行讨论，分享了我们的专业知识、技能、经验，以及我们希望通过解决互联网安全态势的监管空白来提供帮助的愿望。当时，我们受到了欢迎；然而，这种局面很快就改变了。RTF
    与 Palo Alto、Rapid7、Microsoft、Resilience Cyber 和 Cyber Threat Alliance 等机构合作。RTF
    发布了一个全面的勒索软件应对框架。他们的网站写道：“安全与技术研究所（IST）与来自行业、政府、执法部门、民间社会和国际组织的广泛专家联盟（即参与勒索软件工作组的专家）合作，发布了一个全面的勒索软件应对框架”。2020
    年 4 月 29 日的发布会得到了广泛支持，我很高兴出席。让我略感担忧的是，人们几乎口头和书面都承认勒索软件攻击已成常态，因此重点放在了通过保险、谈判技巧等方式来缓解风险，而真正提到预防的内容却少之又少，几乎为零。这在当时看来似乎很疯狂，但随着我们开始研究其中涉及的一些公司（包括主办方
    IST），这一情况变得更加令人担忧。


    5 月 2 日的周末，我与 IST 的 CEO 取得联系，分享了我们在首届 RTF 活动中涉及的多家公司的互联网安全评级截图，并指出包括 IST 自身在内，多家参会公司的互联网连接安全结果非常糟糕。评级为
    F 和 0，这不仅使他们成为网络攻击和勒索软件攻击的首要目标，而且这样的状况无疑会让他们给出的建议受到质疑，也不会给任何看到这些信息的人带来信心；更不用说，如果一个勒索软件团伙发现了他们暴露、脆弱且可利用的处境，并且他们在保持不安全状态的同时遭到渗透，后果将不堪设想。就在两周前，AXA
    宣布不再同意在网络安全保单中支付赎金；而一周后，他们就遭到了勒索软件攻击……


    我将截图和情报分享给了 IST 的 CEO 以及几位与会者。我原本期待收到感谢邮件，诸如“我们不知道”、“我们会查看、处理并相应修复”、“非常感谢您指出这些‘疏漏’”之类，但什么也没有：被赋予思想领袖使命、负责对抗勒索软件的
    RTF 团队成员，没有一个人作出回应。有些人甚至在 LinkedIn 上取消了关注，并忽略了后续邮件。除了预防勒索软件，RTF 还能想要实现什么？然后我恍然大悟。鉴于
    NCSC 与 RTF 合作的事实，也许他们影响了 RTF，使其像 2020 年对待 FBI 那样，忽视和忽略我们的发现。或许我们能够发现这些暴露的漏洞这一事实让他们如此担忧，以至于他们想方设法地忽视、劝阻或否认其相关性？还记得
    2020 年，我们让 NCSC 报告一份经过编辑的互联网安全报告，NCSC 技术总监 Ian Levy 博士表示他会对此感到担忧，尤其是过时的 SSL，并且他希望调查大量的
    CVE 和其他问题。就在那时，我确认那是一个 NCSC 子域名，而且也许他们的扫描能力和工具 Webchecker 显然不够格。Ian Levy 博士也同样忽略了我上一章分享的关于英格兰银行和
    FCA 的情报。考虑到绝大多数网络攻击、知识产权盗窃和勒索软件攻击都利用了不安全的域名，我们必须提出一个问题：政府究竟为什么不希望阻止攻击、实现显然尚未系统性达成的安全？NCSC
    的互联网安全评级为强劲的 B+ 和 80/100；它之所以没有达到 A+ 和 100，只是因为它没有内容安全策略（Content Security Policy）。自
    2017 年以来，NCSC 一直保持 B 或 B+ 评级，而 2017 年时它还是 D 和 35/100，那时 HTTPS 尚未广泛采用。为什么 NCSC
    希望自己拥有强劲的互联网安全评级，却对别人的评级不予理会？当违规事件发生时，我们常常会使用一个词，随着我们变得更加愤世嫉俗，这个词就是“自满”或“同谋”。


    鉴于我们对全球领先机构的研究和发现，如 MITRE CWE、英格兰银行、FCA、劳合社（Lloyd’s）、怡安（Aon）、韦莱（Willis）、CNA、Colonial、印度航空（Air
    India）、英国航空（BA），以及数百家、可能数千家其他公司要么遭到入侵，要么保持不安全状态（而且往往是在知情的情况下），人们必须追问：他们难道都是因为无知、缺乏知识和能力不足而无视事实、维持不安全状态吗？网络犯罪分子是否比好人（包括
    NCSC、美国国防部、国土安全部和 GCHQ）更聪明，还是他们得到了帮助？嗯，也许确实如此，毫无疑问，他们在很多场合都被轻易地、不受约束地授予了网络访问权限，包括
    SolarWinds 之类的公司。或者，也许有一个不同的计划，它并不包括阻止任何网络攻击或勒索软件入侵。有一件事是肯定的：在某些圈子里，对“不安全的安全”的接纳方式，似乎让人感觉非常不快……


    ## 关键国家基础设施：一个国家的崩溃


    美国，乃至整个世界的关键国家基础设施，是否已为持续进行的勒索软件围攻做好准备？他们又能做些什么来避免呢？让我们回到今天，2021 年 5 月 13 日。本周，我们目睹了
    Colonial Pipeline 网络攻击，这次入侵造成了一周的混乱。加油站和燃料管线已经枯竭，东海岸的大量民众感到愤怒，要求得到答案。情况可能只是由于
    COVID-19 的旅行限制和影响而得以减轻。燃料价格已经上涨，而 Colonial 被发现根本没有任何值得一提的安全措施，更不用说良好的安全或安全资源了。这种状况使得远程访问成为可能，甚至助长了远程访问；反过来，这种远程访问又助长了入侵。本周
    Colonial 的总损失，包括向 DarkSide 支付的 1100 万美元（不同来源现在认为是 440 万美元；但也有其他来源认为是 3000 万美元）勒索赎金，总成本可能超过
    1 亿美元。Colonial 的整体安全评级为 F 和 0，这表明了一个令人担忧的、普遍且系统性的状况：Colonial 面向互联网的安全评级 F 和 0
    已经是最差的了，而在这个评级背后，是大量不安全、易于利用且“不安全（Not Secure）”的状况。


    除了作为关键基础设施（CI）之外，这与更广泛的关键国家基础设施（CNI）和电网有什么关系？上一段来自未来、日期为 2023 年 12 月 30 日的场景正在迅速逼近。作为能源行业委托我们开展的研究项目的一部分，研究结果清楚地表明，除非电网和
    CNI 公司在其计划中增加并大力加强安全措施，否则他们实际上会成为这些持续攻击的受害者，并承担由此带来的一切后果。我们被要求研究和报告安全态势和评级。

