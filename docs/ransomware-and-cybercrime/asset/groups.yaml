    holy grail is a website that uses obsolete SSL certificates, rendering the site
    exposed, vulnerable, and exploitable. What is more, as we have previously mentioned,
    the domain can be subject to domain hijacking and takeover, and ultimately an
    assailant can take C2, as was the case with SolarWinds. As we now know, the SolarWinds
    breach is one of the world’s largest single breaches, which consequentially affected
    some 18,000 customers, including the US government and US Treasury. What we also
    know is SolarWinds have, simply unbelievably, maintained their F and 0 Internet
    insecure connections, which again must fall into the category of only a fool learning
    from neither. Rather disturbingly and incredibly concerning is the fact that Colonial,
    SolarWinds, ExaGrid and numerous government departments and backed organisations
    such as the Ransomware Task Force, CNSS, the US Treasury, and a huge raft of others
    all are not maintaining secure positions, and all clearly lack strong controls
    or management of their Internet-connected domains. This fact alone is costing
    the world, most of all the United States, $trillions annually.


    I read with interest yesterday that Microsoft are automating HTTPS to their Edge
    Browser for secure browsing. The release, part of their Microsoft 365 roadmap,
    was announced in April this year and should start being rolled out in July. It
    is certainly a step in the right direction. As you will recall, Google migrated
    from HTTP to HTTPS in 2018 after several years of pontification; however, that
    adoption was not unilateral. This action should make hundreds of thousands of
    websites more secure; however, my concern is that a tad like Cyber Insurance,
    it might encourage people to be lazy and continue ignoring their security, expecting
    it to be automated by others. Websites will still massively be more secure by
    having controlled and managed security such as HSTS, cookie policies, and third-party
    scripts. Yes, Man-in-The-Middle attacks could and should be reduced; however,
    a holistic approach to security must be adhered to, reinforced, and carried out
    with discipline and assurance if we are ever to see noteworthy reductions in cyber-
    and Ransomware attacks.


    In a previous chapter, we touched on avoiding the apocalypse, and that term is
    not to scare or frighten anyone; it is a call to arms for governments, people
    who may have previously had ulterior motives, to unite and to finally wake up
    to the avoidable but critical disaster and slippery slope we have already created
    for ourselves, one that is also being greased.


    Imagine if our Energy, our food supply chain, our water, our fuel, our banks,
    and our governments were all simultaneously attacked. No power, dwindling food
    supplies, no fresh water, and banks shut down due to cyberattacks. Just imagine
    what carnage, what an uprising such a situation would create. This is no Spielberg
    movie (although I am happy to discuss), it is a current reality. What is more,
    it is happening in a town, a city, a state, government, food supplier, trucking
    company, CI, and water treatment plant near you right now. Our entire infrastructure
    is falling victim to cyberattacks, and our governments are seemingly helpless
    to do anything about it. Anarchy is just around the corner, and unless President
    Biden and his Senators wake up from their slumber and stockpiles of cash and start
    realising what they are staring down the barrel of, life as we know it will cease
    within the next decade, and the deprivation, anarchy, and criminal mob culture
    will take over vast swathes of the world; nobody will be safe, and, from digital
    innovation to digital domination within three decades, we will see the world’s
    largest ever economic shift and freefall into the hands of cyber criminals.


    All-out results call for all-out action, and that is simply not the case, as the
    war on words continues along with the blame game instead of people, governments,
    companies, and security professionals doing their jobs properly, and that is to
    secure their Internet connections instead of facilitating crime. We have shared
    our vision and thought leadership with CISA and the UK government, and sadly,
    their heads are so far somewhere they really ought not be, it is clearly masking
    their ability to see. It is the world’s worst-kept secret that the challenges
    we face today were spawned by the NSA’s and GCHQ’s methods and tools, particularly
    post-9/11. Even though I am personally angry about their manipulation, lies, and
    deception, we are, as they say, where we are. Now we need to urgently address
    the challenges head on and deal with them not so they can be manipulated further
    but so we can get the world, our world, and the world of our children back on
    track and maintain a lawful and harmonious place to live.

