  - '[PAGE 60]


    United States that also fell ‘victim’ to Ransomware attacks. Atlanta, Baltimore,
    Denver, Knoxville, New Orleans, and Alaska for a third time all fell victim to
    cyberattacks, and all have incurred massive costs in addition to ransom payments.
    In July 2019, the US Conference of Mayors unanimously passed a resolution calling
    on local officials to stop paying Ransomware demands to cybercriminal gangs who
    were infiltrating and taking over their Networks. However, despite that resolution,
    many Cities have paid huge ransom demands after being faced with the extortion
    or exposure of highly sensitive and important data and after being threatened
    with the data being made inaccessible or publicly available. Addressing the symptoms
    rather than the cause seems to be a favourite pastime.


    We researched many of the States, Tulsa being the most recent, and found a plethora
    of outdated technical systems, countless CVEs, along with insecure domains connected
    to the Internet. Even if we spent weeks forensically pinpointing the access point,
    that would be seriously hampered by the sheer number of accessible and easily
    infiltrated access points. So bad is the Network and Internet-connected security
    of local governments that the easily accessible entry points would make the task
    near impossible. Furthermore, Tulsa is far from a one-off; it is a systemic issue
    and national tale of insecurity across many States and includes the US government
    itself. It was only a few months ago that we notified the White House and the
    then-President of the United States, Donald J. Trump, that both had insecure domains.
    Donald Trump had several, in fact, as part of his digital re-election campaign
    and was collecting donations (and PII Data) on totally Not Secure domains. This
    was poor form and broke numerous Privacy laws and regulations on the collection
    of said PII data. Both positions and numerous insecure domains still exist. Hardly
    surprising, some of Donald J. Trump’s domains suffered cyberattacks, taking the
    domains offline for a day.


    Websites are simply not a fit and forget; they need controls and constant management,
    or they will bite, and bite hard. In most cases, from Amazon through to the White
    House, from a SolarWinds to Blackbaud or Codecov, organisations get online and
    simply take a flyer; they rarely ensure their websites are secure, even sometimes
    from the word go. Certainly, the majority of legacy websites are overlooked, forgotten,
    neglected, or ignored. Then hacked.'
