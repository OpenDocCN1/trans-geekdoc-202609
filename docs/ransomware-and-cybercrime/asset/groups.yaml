  - '[PAGE 164]


    when healthcare attacks, which have become widespread lately, are deployed. We
    empathise with each company that becomes a victim of a Ransomware attack and wish
    the governments would take such attacks and disruptions more seriously. Executive
    Orders and throwing $billions at friends and family cyber security companies that
    are not themselves secure and expecting a different outcome is nothing short of
    insanity. What is urgently and critically required is to acknowledge the access
    that is being used and manipulated, that is, the Internet connections, and then
    to address them. Our suggestion is to say, like drivers on our roads, if you are
    unsafe or insecure and threaten other motorists, you will not be allowed on the
    roads. The Internet is our digital highway and requires much better controls.
    Is it so farfetched that a company like SolarWinds, for example, needs to be protected
    from itself and if the search engine companies, instead of saying Not Secure on
    the address bar, just stopped all search capability and access, surely that would
    protect SolarWinds and all their clients? We would certainly see a behavioural
    change, as the Internet is seen by many as the lifeblood of their businesses,
    and they would certainly focus on their security if it meant they could no longer
    trade or have a digital presence; something to think about for sure.


    In the first half of 2020, some 8 billion people’s PII data was compromised, the
    equivalent of every human on the planet. Add digital identity theft, illegal personal
    loans, debts, and even worse, organised crime making claims for years due to data
    theft, and you can count the $billions and $billions. There is a saying in show
    business: ‘You ain’t seen nothing yet’, and my fear is we are entering that phase
    in the cyberworld. Cybercriminals act like farmers and take what the crop they
    can yield and nurture it, and then come back for the next harvest to make sure
    it is sustainable; the challenge is we are not securing it with a similar defensive
    strategy. Our research across multiple sectors, governments, education, military,
    healthcare, and others demonstrates a systemic lack of basic security. There is
    a reason the NCSC have a B+ Rating and 80 score but are content for, say, Mersey
    Rail, easyJet, or Travelex to maintain an F Rating and 0 score (all breached).
    The question this chapter leaves the reader with is this: Why do the NSA, NCSC,
    GCHQ, and US and UK governments not enforce a regime of security connected to
    the Internet? If anyone has a different answer to the one we have, please do not
    hesitate to email me.'
