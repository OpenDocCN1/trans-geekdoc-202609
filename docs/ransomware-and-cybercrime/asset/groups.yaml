    security along with ISACA’s reputation. I received a reply to the information
    and was told that she would pass it on. It was then that I received the following
    message: ‘Well if you’re trying to sell something to ISACA don’t start with a
    board member’. It was at that point I responded, on a Bank Holiday Monday: ‘Tracey,
    please feel free to totally ignore my effort to share a major concern with you.
    It is no skin off my nose, as I have alerted you as a professional reaching out
    to a contact. If ISACA choose to ignore, that is perfectly fine. Warmest regards,
    Andy’. This morning I have received a further email stating, ‘Your marketing effort
    is hardly positive, Mr Jenkins’. I am unsure why this board member cannot get
    my name right (it is Jenk[in]son) or thinks I am on a marketing campaign. To put
    this into perspective, ISACA have the same woefully inadequate security Rating
    as every company we have researched post breach over the last two years, including
    SolarWinds, numerous states, Bose, Canada Post, the Canadian government, the Brazilian
    government, and hundreds and hundreds of others.


    In 2015/2016, Special Agent Adrian Hawkins tried for over six months to notify
    the OPM (Office of Personnel Management) that they were being breached, and no
    one batted an eyelid; it was only after a meeting, 1.2 mile away from the FBI
    offices that Special Agent Hawkins worked at, that the infiltration was taken
    seriously. During this breach, it is accepted that every serviceman and woman’s
    details had been exfiltrated, including all the PII data of current and previous
    security-cleared personnel and their families.


    I was also contacted over the weekend by the Head of Strategy at CISA, like the
    CIA but add an S, like the way Google added an S in 2018 to HTTP(S) for security.
    I was asked if I could help them, ‘attract the best people’, to which I replied,
    I fear you do not want the best people; you just want people who dance to your
    tune. I received a reply stating the requirement was to: ‘Maintain status while
    promoting an internal body to reinforce groupthink is the MO. I need people like
    you to get the word out and attract candidates who can change CISA for the good’.


    I emailed several reports on our research across all 50 US states in the lead-up
    to the US Presidential election which showed a systemic failing of basic security
    at each state, Delaware being the worst, with another report on education and
    a final one on healthcare.'
