    # So, What Has This to Do with Ransomware?


    Let us consider why companies are targeted with Ransomware attacks in the first
    place. The first thing to understand is that many attacks by adversaries are against
    companies unknown to them, never visited or communicated with, yet because of
    the fact they have insecure Internet connectivity, they are flagged. The process
    of elimination of whom and whom not to attack may vary; however, size of organisation,
    accounts and reach into partners, and/or governments may play a part in selecting
    those who are more than likely to pay quickly and who can afford it. What is not
    lost is how the attacks are being focussed more and more on larger companies who
    simply cannot afford to have their technology systems down or production ceased
    such as Colonial Pipeline (more on them later) and Sony. Ransomware demands have
    dramatically increased to now be tens of $millions and paid. The criminals know
    that every day out of production for, say, a Colonial will have massive cost implications,
    and two-thirds of gas companies running out of fuel also adversely stimulates
    the masses to demand action...


    Ransomware is simply a case of criminal activity in the digital realm and world
    that preys on the insecure to gain access (infiltrate), and then exfiltrate plaintext
    data (unencrypted due to not being secure). Then share said captured data with
    their victims, then encrypt it and sell it back, with a ransom payment demanded
    for the decryption key. CNIs, Health Care operators, and transport organisations,
    even governments—immaterial of one’s personal views, it is all too easy to pay
    Ransomware to cover one’s errors and negligence. What is then frequently and totally
    overlooked is the root cause. The insecure domains and positions that made the
    organisation a target and easily exploited in the first place are further ignored
    and overlooked. ransom is paid, and the insecurity remains ready for the next
    attack. Insecure intelligence is even sold on.


    The victim gets their prized data back (hopefully) and vows never to get caught
    out again, really... $millions out of pocket to be back where they were originally
    and to stand still. Sadly, it does not end there. Much of the data may be compromised,
    and there are no guarantees that the data is not marked, or some kept for the
    next attack. It is reckoned only 8% of data in such cases is returned and not
    compromised.'
