    Wright Brothers made headlines for the world’s first-ever manned flight that lasted
    12 seconds. In the First World War, Ferdinand Foch stated in 1911 that airplanes
    were interesting but only as scientific toys; they had no military value. In 1919,
    Foch had changed his tune and stated that the Curtiss seaplane that had crossed
    the Atlantic Ocean from Newfoundland to Portugal was the future and that wars
    were won with the proven success of the military planes. The Second World War
    was fought extensively in the air, the Battle of Britain made into films, and
    the stunning Spitfire applauded globally for playing a vital part of bringing
    the Second World War to an end.


    Today, COVID-19 aside, hundreds of thousands of airplanes transport billions of
    people around the world and enrich their lives. The Travel Industry was revolutionised
    by the advent of passenger planes, and the industry not only provides work for
    millions of people, it also generates revenues in the hundreds of $billions—a
    far cry from a 12-second flight that two brothers committed their life’s work
    to all those years ago.


    In the 1750s, Jonas Hanway, a British man, was seen using a new device called
    an umbrella that he had acquired in France. The lighter version, a lady’s parasol,
    had been used for some time and accepted; however, Jonas was seen to bring the
    whole gender issue into question and rotten vegetables and rubbish were hurled
    at him whilst he attempted to stay dry (well, it was the United Kingdom). It was
    decades before the gender gap issue diminished and the much-needed ‘brolly’ was
    accepted for both genders to benefit from.


    A big one is personal computers. In a 1996 book called *Women and Computers*,
    it was stated that women were afflicted with ‘Computer-phobia’, a panoply of conditions
    that reflected the fear of touching or damaging a computer. It went further and
    cited a fear and aversion to touching, damaging, discussing, or becoming proficient
    with a PC. The book concluded that women were fearful of becoming addicted to
    a PC, who would ever have thought it. The term ‘computerphobia’ had sprung up
    in many publications of the day, including *The Atlantic*. PCs were seen and treated
    with a certain degree of pessimism and considered something of a chore to learn
    and master, now few things are ever undertaken without one.'
