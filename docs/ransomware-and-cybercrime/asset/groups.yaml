  - '[PAGE 55]


    # 6

    BA, EASYJET, AND THE TRAVEL INDUSTRY


    Long before COVID-19 was even thought about, well at least to the majority of
    the world’s population, back in August 2018, customers of British Airways were
    merrily booking their flights to far-flung and exotic places. It was not until
    sometime later that they realised 1) they were going nowhere, and 2) they had
    booked flights on a Shadow website due to a series of basic security oversights
    at BA.


    Due to BA’s lack of Internet security controls and management, cyber criminals
    ‘stood up’ a spoof website called BAWays.com that was in essence a carbon copy
    of BA’s own website. It emulated all the functions and allowed bookings and, importantly,
    the collection of PII data and payment. To cut a long story short, BA were found
    guilty by the ICO of negligence to secure and protect their customers data due
    to said basic security failings. The ICO originally levied a fine of £183 million
    which, due to the economic challenges and COVID-19, was greatly reduced to £20
    million. BA then initially borrowed £500 million increasing to some £2 billion
    from the government backed by the British taxpayer. It is still unclear if BA
    have actually paid the reduced fine. The ICO said at the time: ‘When organisations
    make poor decisions around people’s personal data, that can have a real impact
    on people’s lives. The law now gives us the tools to encourage businesses to make
    better decisions about data, including investing in up-to-date security’ (Elizabeth
    Denham, Commissioner ICO). BA were fined 1% of the money they borrowed, sounds
    about right…


    The original fine was calculated on the GDPR regulations of enabling a fine up
    to 4% of BA’s annual revenues; however, as the fine levied from the time of the
    incident was over two years, that was frowned upon by Industry experts. The ICO
    said it ‘meant business’ and is not letting struggling companies off the hook
    for their data protection failures.'
  - '[PAGE 56]


    Quick research today confirms that British Airways have clearly not learnt much
    from the breach and have seemingly taken absolutely no action whatsoever so far
    as improving their security, which in turn means no additional security measures
    for their customers. With a Rating of an F and a score of 0 out of 100 yesterday,
    it is fair to say BA’s homepage, and their customers, could not be more vulnerable
    or exploitable. Maybe if we were to use the Cyber Analysis Rating, as previously
    suggested, further fines could be levied unless the firm complies with basic security
    measures. If you have several illegal issues with your car, you cannot barter
    for a ‘collective’ deal; equally, if you got stopped several months later with
    the same issues, would you expect leniency because you had paid a fine? Of course
    not, so why are BA and hundreds, if not thousands of, other companies addressing
    breaches and fines as a cost of doing business but ignoring making any improvements?
    That is simply madness.


    We decided to look at other Airlines to see if this was a one-off oversight or
    if lacking security were as systemic as it is in other sectors. In April 2020,
    easyJet, with support from the NCSC, announced easyJet had been breached three
    months earlier in January; however, they decided they would delay informing the
    public. Personally Identifiable Information data of some nine million customers
    was stolen, making it a substantial attack. It was also termed the usual ‘sophisticated
    attack.’ We researched easyJet extensively and found a plethora of insecure domains
    and F- and F-rated homepages. Furthermore, when easyJet made the public announcement,
    just like Travelex did, the website on which they made the public apology and
    update was a Not Secure domain. You could not make this up. There in black and
    white was the text Not Secure in front of easyJet. The certificate was invalid,
    and they were now letting the entire world know; however, what it confirmed is
    that they themselves were ignorant of domain management and security, as was their
    audience. It took us weeks and weeks to even get them to listen.


    The screenshots we took, and hold confirmed basic security was not in place during
    the initial breach. That rendered the easyJet domains Not Secure, exposed, vulnerable,
    and easily exploited. Many of these screenshots have not altered, and many easyJet
    domains remain woefully insecure. But hey, oversight and errors can occur, right?
    So today when we look at the easyJet homepage, it is all good, right? Well, sadly,
    no, it is not. With the same Rating, F, and score, 0, as BA,'
  md: '

    Last year we ‘assisted’ Hiscox who, like most Insurers, seemingly did not have
    the governance, control, or management of their Internet-facing domains when,
    rather embarrassingly and rather ironically, we alerted them to the fact their
    Cyber Insurance website was Not Secure: its TLS certificate was invalid. Few people
    relish being technically challenged, or their errors being pointed out, this situation
    was no exception. After what bizarrely became a rather heated debate, the CISO
    and CEO finally relented and made their cyber and data insurance site secure by
    placing a valid certificate on the domain. There was barely a thank you; possibly
    they preferred the alternative. Their security position to date is still far from
    ideal.


    All the while organisations, especially Insurance companies, that provide cyber
    cover continue to overlook, ignore, or are complacent with their Internet-facing
    and connected security, cyberattacks, losses, and even companies ceasing to trade
    will exponentially increase. In 2021, cybercrime will become equivalent to the
    world’s third-largest economy, with total estimated costs and losses of $6–7 trillion
    (circa 10% of the world’s entire GDP). By 2025, that figure is estimated to surpass
    $10 trillion.


    The insurance market has a vital part to play. By seemingly supporting and dare
    I say inadvertently encouraging inadequate basic security, it is fuelling a potential
    for even greater losses. It is time to insist on the equivalent of ‘5 lever latches,
    window locks’ and alarms before it is simply too late. Being complicit by being
    complacent is sadly all too frequent a position, as our reports continually evidence.


    Finally, ask yourself this simple question, no matter if you are in the Insurance
    sector or not. If you drove your car whilst drunk, without papers, with four illegal
    tyres, and recklessly, or if you left your property for a year, with the windows
    and doors left wide open and all your valuable possessions on the table in full
    view, if you were then in an accident or were robbed, would you expect an insurance
    claim and settlement? Of course not; so why do organisations (including Insurers
    themselves) demonstrate such a poor stance on basic security measures year after
    year and then have the gall to call attacks ‘sophisticated’ when they were nothing
    more than opportunistic with regard to exploitable vulnerabilities? What is more,
    these cyberattack opportunities have led carpeted runways and being served up
    on silver platters…


    Security Ratings will cause a marked reduction and huge difference in day-to-day
    security. To decrease cyberattacks and losses, changes must be driven, even enforced.
    Sadly, I am unsure what, if any, real changes governments and agencies really
    want or are prepared to sacrifice.


    As of today, 21 May, it has been reported by Bloomberg that CNA paid $40 million
    two weeks after the initial cyberattack and that data had been exfiltrated. This
    meant plaintext data, the staple diet of all cyber criminals, was removed and
    then encrypted. As in a typical Ransomware fashion, the decryption key is what
    ransoms are paid for to obtain. Previous research we had undertaken during the
    original attack was checked late last night, and CNA are maintaining their insecure
    Internet connectivity and Not Secure domains due to obsolete SSL certificates.


    ‘The fact the original cyberattack was not classed as a Ransomware attack, then
    was, with a small ransom payment, and now the disclosure of the $40 million calls
    into question exactly what is being said. The Colonial ransom payment has been
    claimed to be $4.4 million by the company; however, sources have alluded to the
    $30-million demand being met.


    The question remains: at what point do the NSA, GCHQ, FBI, NCSC, and United States
    and United Kingdom governments finally do something other than play charades with
    these attacks? Forget the fact they have been guilty of Internet abuse and manipulation
    for mass data collection and harvesting for over two decades; they hold the key
    to confirming that lacking Internet security is the main cause, the root cause,
    for $trillions of losses due to cybercrime. What motive could they possibly have
    to continue playing this down, or do they have a patent on the word ‘sophisticated’?


    ![](img/addbbc8c42e40e3fdcd2f05ac8162dd1_54_0.png)


    Taylor & Francis


    Taylor & Francis Group


    http://taylorandfrancis.com


    ## 6 BA, EASYJET, AND THE TRAVEL INDUSTRY


    Long before COVID-19 was even thought about, well at least to the majority of
    the world’s population, back in August 2018, customers of British Airways were
    merrily booking their flights to far-flung and exotic places. It was not until
    sometime later that they realised 1) they were going nowhere, and 2) they had
    booked flights on a Shadow website due to a series of basic security oversights
    at BA.


    Due to BA’s lack of Internet security controls and management, cyber criminals
    ‘stood up’ a spoof website called BAWays.com that was in essence a carbon copy
    of BA’s own website. It emulated all the functions and allowed bookings and, importantly,
    the collection of PII data and payment. To cut a long story short, BA were found
    guilty by the ICO of negligence to secure and protect their customers data due
    to said basic security failings. The ICO originally levied a fine of £183 million
    which, due to the economic challenges and COVID-19, was greatly reduced to £20
    million. BA then initially borrowed £500 million increasing to some £2 billion
    from the government backed by the British taxpayer. It is still unclear if BA
    have actually paid the reduced fine. The ICO said at the time: ‘When organisations
    make poor decisions around people’s personal data, that can have a real impact
    on people’s lives. The law now gives us the tools to encourage businesses to make
    better decisions about data, including investing in up-to-date security’ (Elizabeth
    Denham, Commissioner ICO). BA were fined 1% of the money they borrowed, sounds
    about right…


    The original fine was calculated on the GDPR regulations of enabling a fine up
    to 4% of BA’s annual revenues; however, as the fine levied from the time of the
    incident was over two years, that was frowned upon by Industry experts. The ICO
    said it ‘meant business’ and is not letting struggling companies off the hook
    for their data protection failures.


    Quick research today confirms that British Airways have clearly not learnt much
    from the breach and have seemingly taken absolutely no action whatsoever so far
    as improving their security, which in turn means no additional security measures
    for their customers. With a Rating of an F and a score of 0 out of 100 yesterday,
    it is fair to say BA’s homepage, and their customers, could not be more vulnerable
    or exploitable. Maybe if we were to use the Cyber Analysis Rating, as previously
    suggested, further fines could be levied unless the firm complies with basic security
    measures. If you have several illegal issues with your car, you cannot barter
    for a ‘collective’ deal; equally, if you got stopped several months later with
    the same issues, would you expect leniency because you had paid a fine? Of course
    not, so why are BA and hundreds, if not thousands of, other companies addressing
    breaches and fines as a cost of doing business but ignoring making any improvements?
    That is simply madness.


    We decided to look at other Airlines to see if this was a one-off oversight or
    if lacking security were as systemic as it is in other sectors. In April 2020,
    easyJet, with support from the NCSC, announced easyJet had been breached three
    months earlier in January; however, they decided they would delay informing the
    public. Personally Identifiable Information data of some nine million customers
    was stolen, making it a substantial attack. It was also termed the usual ‘sophisticated
    attack.’ We researched easyJet extensively and found a plethora of insecure domains
    and F- and F-rated homepages. Furthermore, when easyJet made the public announcement,
    just like Travelex did, the website on which they made the public apology and
    update was a Not Secure domain. You could not make this up. There in black and
    white was the text Not Secure in front of easyJet. The certificate was invalid,
    and they were now letting the entire world know; however, what it confirmed is
    that they themselves were ignorant of domain management and security, as was their
    audience. It took us weeks and weeks to even get them to listen.


    The screenshots we took, and hold confirmed basic security was not in place during
    the initial breach. That rendered the easyJet domains Not Secure, exposed, vulnerable,
    and easily exploited. Many of these screenshots have not altered, and many easyJet
    domains remain woefully insecure. But hey, oversight and errors can occur, right?
    So today when we look at the easyJet homepage, it is all good, right? Well, sadly,
    no, it is not. With the same Rating, F, and score, 0, as BA,

