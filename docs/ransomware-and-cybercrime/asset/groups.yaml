    Midcontinent Independent System Operator, Inc.（中大陆独立系统运营商），原名 Midwest Independent
    Transmission System Operator, Inc.（中西部独立输电系统运营商），是一家独立系统运营商和区域输电组织，提供开放接入输电服务，并监测美国中西部、加拿大马尼托巴省以及美国南部地区（包括阿肯色州、密西西比州和路易斯安那州的大部分地区）的高压输电系统。MISO
    还运营着全球最大的实时能源市场之一。


    德克萨斯电力可靠性委员会（Electric Reliability Council of Texas, Inc.）是一家美国组织，负责运营德克萨斯州的电网——德克萨斯互联电网，为超过2500万德克萨斯客户供电，占该州电力负荷的90%。ERCOT
    是美国第一家独立系统运营商，也是北美九个 ISO 之一。ERCOT 与德克萨斯可靠性实体（Texas Reliability Entity）合作，后者是北美电力可靠性公司（North
    American Electric Reliability Corporation）旗下的八个区域实体之一，这些实体协同提高大电网的可靠性。


    西南电力库（Southwest Power Pool）负责管理美国中部的电网和批发电市场。作为区域输电组织，这家非营利公司受美国联邦能源监管委员会（Federal
    Energy Regulatory Commission）的委托，确保可靠的电力供应、足够的输电基础设施和具有竞争力的批发电价。西南电力库及其多元化的成员


    他们并不在乎会造成多大混乱；事实上，混乱越大越好，因为这会增加赎金更快支付的可能性。


    Colonial Pipeline 遭受网络攻击后，出于几个原因决定关闭输油管道，其中之一是由于系统瘫痪，他们不确定如何开具发票。这显然是一个警钟，希望已经唤醒了某些沉睡且极不安全的“歌利亚”。每个组织现在都必须认真对待安全；不这样做无异于自满和同谋。购买网络保险并不能成为免罪金牌，因为网络保险提供商变得越来越精明；如果像
    Colonial 那样安全疏忽、连基础安全措施都没有，他们可能会——而且无疑应该——拒绝任何赔付。


    前文描述的情况令人担忧，表明这一样本群体完全缺乏基本安全。如果网络犯罪分子发现了同样的情报，我严重怀疑攻击已经在进行中。……向你的董事会提出这个问题：现在到底什么时候才是解决安全问题的好时机？无论过去发生了什么，安全是每家公司的责任，时间紧迫。针对网站和服务器的此类攻击每天高达20万次。玩俄罗斯轮盘赌（无意双关）不应成为一项可选游戏。……法律正在改变。几乎一切都可以外包——网站开发、网站托管、技术管理等等——但没有人能外包责任和担当。


    想象一下：一家网络保险提供商由于自身在互联网上不安全而被渗透，进而因其自身的不安全状态而被访问并遭入侵，这难道很难想象吗？不同之处在于，犯罪分子现在掌握了内部情报，了解其安全水平和已签订的协议，并据此提出要求，进而获取客户的
    PII 数据等等。当然不难想象，而且这种情况已经在 CNA 发生。CNA 今年早些时候因不安全而被入侵，其互联网安全评级为 F 和 0。截至本文写作时（2021年5月26日），我可以确认
    Colonial 的互联网连接安全评级仍然是完全不合格的 F 和 0，而 CNA 则从 F 和 0 略有改善至 D 和 30。在这两种情况下，现实是两者都完全暴露于进一步的渗透和入侵之下，而这甚至还没有考虑恶意植入物是否以类似
    SolarWinds 事件的方式被植入——这种植入物在系统内潜伏操纵了九个多月才被偶然发现。


    坦白说，除非我们开始采取适当的安全措施，而不是仅仅嘴上说说，或者用一层遮羞布来购买保障，而非采用强健、恰当的安全措施——顺便说一句，这只需要纪律和专业知识——否则大家还不如直接认输。我担心许多人已经认输了。我在想，那些“允许”如此基本的安全措施被忽视和忽略的人，要过多久才会被发现实际上是为了经济利益，并为下一波重大入侵推波助澜。我们面对的是罪犯；他们不在乎成千上万，甚至数十万、数百万人的生命。他们有自己的动机——经济、宗教或其他什么——他们会不惜一切代价实现目标，包括贿赂、腐败，甚至夺人性命。


    这到底有哪一点不被理解，常常是我们深思熟虑的问题，然后我们又得知了更多勒索软件攻击……


    ## 美国17个州遭攻击与持续的安全疏忽


    在本章中，我们将探讨近期成为勒索软件攻击受害者的美国部分州。我们将列出几个州并进行概述，最后给出它们在遭受入侵后当前接入互联网的数字安全状况。


    俄克拉荷马州塔尔萨市是该州第二大城市，也是美国第四十七大城市。人口刚刚超过40万。塔尔萨都会区人口接近100万。最初，塔尔萨是作为强大的能源产业中心而建立的；但近年来，塔尔萨的产业更加多元化，包括金融、航空、电信和技术。塔尔萨拥有两所主要大学，并且在20世纪大部分时间里享有“世界石油之都”的绰号。塔尔萨一直并且仍然被视为一座关键城市。


    几周前，塔尔萨遭受了一次勒索软件攻击，导致许多计算机系统关闭，官员警告市民系统将中断三到四周。这意味着与该市日常的正常互动将受到严重影响，甚至居民支付账单也会受阻，进一步加剧了该市的财政困难和任务。这次攻击发生在一个周末，影响了市政府网络，并导致官方网站瘫痪。攻击目前由该市
    IT 团队处理，他们已经恢复了一些市政府网站。然而，许多网站仍然不安全。这令人震惊，因为不安全的网站和域名连接很可能是最初渗透的根本原因，大多数入侵都是如此。塔尔萨市长
    G.T. Bynum 本周表示，该市不会支付赎金，而是专注于恢复系统。


    亚特兰大是佐治亚州的首府。它是美国第三十七大城市，人口超过50万。亚特兰大是亚特兰大都会区的文化和经济中心。亚特兰大最初是州政府资助的一条重要铁路的终点站，其名称来源于西部与大西洋铁路（Western
    and Atlantic Railroad）的当地车站。内战期间，在威廉·T·谢尔曼将军的“向大海进军”中，亚特兰大几乎被烧为平地。亚特兰大将永远与马丁·路德·金和民权运动联系在一起。


    2018年7月，亚特兰大成为名为 SamSam 的勒索软件攻击的受害者，该攻击针对市政计算机系统和网络，对市政府几乎所有部门造成了严重破坏。几个月后，时任新任首席信息官的
    Gary Brantley 表示，他们仍在从当时针对美国目标最引人注目的网络攻击之一中恢复；哎呀，真是此一时彼一时。亚特兰大表示没有支付赎金，但据该市官员称，他们花费了270万美元来恢复和更换受影响的系统。Brantley
    先生已不在市政府任职。


    阿拉斯加无疑是美国面积最大的州。举个例子，德克萨斯州、加利福尼亚州和蒙大拿州加在一起都可以放进阿拉斯加。它是美国人口第三少的州。至少一半人口居住在安克雷奇都会区。在欧洲人到来之前，阿拉斯加已经有各种原住民生活了数千年。该州被认为是经白令陆桥定居北美的重要入口。1867年，美国政府以720万美元从俄罗斯手中买下阿拉斯加，相当于1.33亿美元，即每英亩0.02美元。1959年1月3日，阿拉斯加正式成为美国第49个州。


    在我们于2020年春季对美国50个州进行的互联网安全最初研究中，我们从阿拉斯加开始，发现其面向互联网和联网的安全存在一些非常令人担忧的问题，问题如此严重，以至于我们进一步向其发送了一份报告。报告显示，其主页不安全，服务器上至少有27个
    CVE（常见漏洞和暴露），其中许多允许通过已知常见漏洞进行远程访问。阿拉斯加在2019年1月刚刚遭受过一次网络攻击，而且显然，其中一些 CVE 可以追溯到2011年，这些漏洞一直且持续被忽视和忽略，连同

    '
