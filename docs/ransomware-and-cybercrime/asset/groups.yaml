  - '[PAGE 131]


    with being insecure at their Internet connections via their domains and subdomains.


    The research we undertook lasted several months leading up to the 2020 US Presidential
    elections, during which time there was additional funding made available for all
    states in their attempt to prevent digital meddling, as happened in the 2016 elections.
    From the research and findings across all 50 states, not one was secure. I suspect
    and suggest that funding may not have been well used. In December 2020 following
    the elections, Alaska were victims of another cyberattack that caused further
    chaos, and only several weeks ago. That makes three attacks within two years and
    must be causing severe challenges to the state, its budgets and overall morale.
    Sadly, Alaska is seemingly lacking leadership and capability, as over the same
    period of all three attacks, their Internet connectivity has been, and remains,
    insecure.


    Baltimore was designated as an independent city by the Constitution of Maryland
    in 1851 and today is the largest independent city in the United States. The population
    of Baltimore is just under 3 million, which makes it the twenty-first largest
    metropolitan area in the country. Baltimore is situated 40 miles northeast of
    Washington, DC, making it a principal city in the Washington-Baltimore CSA (Combined
    Statistical Area), with a total combined population of nearly 10 million. The
    Port of Baltimore was established in 1706 to support the tobacco trade, and shortly
    thereafter, in 1729, the town of Baltimore was officially established.


    In May 2019, Baltimore suffered a cyberattack in the form of a RobinHood Ransomware
    attack. Baltimore became the second US city to fall victim to this Ransomware
    attack behind Greenville, North Carolina. All services, apart from essential services,
    were taken offline as a precautionary measure whilst the ransom demand for $76,280
    to release the decryption keys was being considered. The attack had a severe negative
    effect on the government and the real estate market, as property transfers and
    purchases were left in limbo, unable to complete. It was proven that Baltimore
    was insecure and susceptible to such attacks due to its IT practices and the fact
    that the IT Manager was not allocated funds to purchase cyber insurance, nothing
    to do with not delivering basic security of course. The attack was compared to
    the earlier attack on Atlanta (see previously) for obvious reasons; however, the
    root cause was still being overlooked.'
