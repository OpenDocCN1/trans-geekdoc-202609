    MiTM attacks are frequently used when websites have not encrypted their data and
    the data is in plain text. This is very commonly used for Ransomware attacks,
    enabling plain text to be exfiltrated, encrypted, and then sold back to the victim
    along with decryption keys. Attackers target vulnerable websites looking for easily
    available PII data, either data at rest or in transit. When the data is not encrypted,
