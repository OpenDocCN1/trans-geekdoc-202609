  - '[PAGE 136]


    Until agencies and governments change their position and continue to nullify and
    ignore the critical importance of Internet security, cyberattacks and Ransomware
    attacks will continue unabated. The frequency and scale of attacks will simply
    continue to increase. A year and a half ago, at the beginning of 2020, when we
    found Travelex, who had been hacked, were running obsolete SSL on their homepage
    that led to the identification of their insecure position and then infiltration,
    I would receive one, maybe two, breach alerts every few days; now I get two to
    three every day. It is already too late for many, as is the fact that due to negligence
    of security, every adult, and more who are resident in the United States, most
    probably have had their PII data illegally taken, many several times. This includes
    all military and agency staff, partly due to the OPM breach in 2015 and continuous,
    ongoing daily assaults globally, with, as mentioned, around 80% against the United
    States.


    Oversight, negligence, complacency or even complicit behaviour, it is hard to
    say which caused the position we are in today; however, what we do know is unless
    governments start driving an urgent, planet-scale change, with the likes of Ransomware
    Task Forces, cyber security groups and companies, government, agencies, and all
    organisations actually taking their own security and that of others where they
    are connected to the Internet via their websites seriously, you might as well
    start looking for a deserted island to live on, as the world is currently in freefall
    due to cybercrime. Forget the fact our governments originally designed and developed
    the methods and techniques being used against us daily; they now need to stand
    and be counted instead of making false accusations of sophisticated and state-backed
    attacks. The position they have created will and already possibly is affecting
    every person in the world, and they must ultimately be held to account; two wrongs
    will never make a right. … As President Ronald Reagan said, ‘The scariest words
    in the English language are; I’m from the government, and I’m here to help’.'
  - '[PAGE 137]


    # CONFLICTS OF INTEREST


    ‘Cyberattacks do not cost enough in terms of financially or loss of lives’ a Leading
    Security expert from the Ministry of Defence said to me in a meeting in 2019,
    and sadly, he was right. He also confirmed that the MOD desperately required our
    services, as they had no idea whatsoever what devices they had, let alone the
    sheer billions of digital certificates they had across those devices and the network.
    He was also very familiar with the ‘use’ of digital certificates by GCHQ and their
    US counterparts over the years, which had played a role but were as much a liability
    now as they were useful. He then introduced me to Fujitsu, as the ‘contracts’
    worth hundreds of £millions would need to go through them.


    The Academy of the MOD suffered a cyberattack in the spring of 2021 and research
    proved their, and Fujitsu’s basic security was woeful at best, along with Serco’s
    who ultimately took the blame for the intrusion.


    A meeting was set up with Fujitsu’s MOD technical and security team, and several
    PoCs (Proofs of Concept) were agreed and were to be set up. Discussions on costs
    took place, and Fujitsu confirmed they wanted PoCs for free. Knowing the potential
    ‘size of the prize’, we agreed with restrictions and awaited dates. It was at
    this point Fujitsu went AWOL. Totally off the radar, did not respond, as they
    had previously, to emails and calls. Fujitsu and effectively the MOD had firmly
    closed their doors without any PoC even though they fully comprehended the capability
    and uniqueness of our technology. Fujitsu are currently facing widespread calls
    for accountability for their role in the long-term debacle of their software Horizon
    and the glitches that caused the wrong criminal cases to be brought against 900
    Post Masters. Horizon cost the government some £1 billion, was flawed from its
    conception, and created the UK’s worst miscarriage of justice. All Post Office
    Masters have been subsequently vindicated; however, it has taken over 25 years,
    many have died and many been made bankrupt'
  - '[PAGE 138]


    and had their lives negatively impacted due to Horizons and Fujitsu’s failings.
    The Post Office, the UK government, and Fujitsu have yet to apologise, and all
    those incorrectly convicted now have the additional challenge to seek compensation—a
    very dark day in the history of the UK government’s handling and procurement capabilities
    along with highly questionable Law practices.


    I can only speculate at this point; however, the reality is although Whitethorn
    as a technology is unrivalled and had originally been developed to discover ‘Stuxnet’-style
    compromised digital certificates within a NATO military installation following
    a cyberattack and breach. The breach resulted in highly sensitive data being made
    available on the Dark Web (the only reason a breach was identified). Although
    the unique capabilities of our technology were appreciated; however, I believe
    the powers that be also realised that the technology would undoubtedly uncover,
    and disclose, the plethora of ‘Plants’ the agencies and governments had themselves
    and indeed had placed elsewhere, given that we found Flying Pig GCHQ digital certificates
    within one of the Big 4 Accounting firms whilst undertaking a PoC. It would also
    show the incredible level and lack of controls at the government providers as
    well as the MOD and government. Best sweep it away and deny the problem.


    Let us not be naïve. It is well known that many, indeed all, major organisations
    have people that are known as DHs (‘Double Hatters’). A DH does their day job;
    they also ensure intelligence is fed back to the Mothership. In the United Kingdom,
    that is GCHQ and in the United States the NSA or similar. In most cases, the companies
    are fully aware and accommodate such positions for their own benefit and, again,
    for certain sanctions and government contracts. It certainly does not mean security
    is improved in any way, shape, or form; however, the agencies may have a different
    view. Nonetheless, when dealing with security in major organisations, do not be
    fooled into thinking the CSO/CISO make decisions; they will often seek sanction
    from the Mothership when push comes to shove and especially when it comes to unprecedented
    capabilities and visibility within a network. Remember, since 9/11, the agencies
    wanted to achieve digital dominance and control and stopped at nothing to achieve
    it and achieve it they did. Make no mistake, when I finish writing this chapter,
    along with all the others, if I emailed it on a regular email, it can easily and
    will be intercepted, and long before this book is published,'
  - '[PAGE 139]


    certain people in certain government organisations would have had the chance to
    read it…


    Digital data mass collection was fully disclosed several years ago and was possibly
    rated as one of the world’s worst-kept secrets. It is no coincidence most tech
    giants are US based or that most emails and communication are routed one way or
    another via the United States. That is all well and good; however, as I have said,
    and confirmed repeatedly, the same methods of mass data capture and mass data
    collection methods, along with harvesting capability have formed what is now known
    as Cyberattacks and Ransomware. It has yet to be proven exactly who are the cybercriminals
    really are; however, given the lack of defensive capabilities, it often feels
    like own goals are being scored across many sectors and on many occasions.


    When the US government recently set up and gave $111 million to a university to
    educate the US manufacturing sector how to better protect themselves and yet the
    university is totally open to a cyberattack due to using obsolete SSL digital
    certificate and has a security Rating of F, one has to question exactly what the
    manufacturing sector is going to learn…


    Equally, as we touched on in a previous chapter, the newly formed Ransomware Task
    Force, backed by the DHS and supported by the NCSC, and yet five of the six, including
    the RTF body themselves, are maintaining F-Rated Internet-connected domains along
    with woeful security. One must question the leadership and messages being educated
    and passed onto more unsuspecting and unknowing companies. The phrase ‘blind leading
    the blind’ springs to mind. Is this mass and gross incompetence or mass facilitation?
    It is easy to be confused and find major issues with the current lack of security.
    When we emailed information and shared screenshots of the positions to these organisations
    showing their insecure positions, the response was from being ignored to being
    disconnected on LinkedIn after reviewing the information and doing nothing to
    remediate their position. ‘Do as we say, not as we do’ is alive and kicking.


    Recently Mersey Rail in the UK was the latest of a group of travel and rail organisations
    to be subjected to a cyberattack and breach. As soon as the news broke, we researched,
    and as usual, found a raft of security failings and the normal F and 0-Rated Internet-connected
    domains. We notified them immediately, along with their CEO. We'
