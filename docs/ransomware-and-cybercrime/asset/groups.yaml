    \ 避免世界末日 — 161\n- 第24章 如果聪明人从自己的错误中学习，智者从他人的错误中学习，那么既不从自己的错误中学习，也不借鉴他人错误的人，该称之为什么？\
    \ — 167\n- 索引 — 173\n\n## 前言\n\n我叫弗拉达斯·莱昂纳斯博士，是托伦斯大学的兼职教授，拥有超过45年的技术经验和超过20年的网络安全经验。我常常感到担忧甚至沮丧，因为人们对网络安全缺乏理解和认识，也因此缺乏保护企业甚至政府机构的行动；我以自己的方式大声疾呼，希望能传达我的观点。\n\
    \n大约两年前，我认识了作者安迪·詹金森，并立即认同他的立场、他所主张的理念，以及他努力简化信息并揭示疏漏的方式。安迪无疑是一位思想领袖，不仅言辞激烈、大声疾呼，而且据我所见，他身体力行，无人能及。\n\
    \n我非常高兴审阅了安迪的第一本书《从震网到太阳风》，即便以我多年的经验，书中仍有大量我此前并不知晓、却深有共鸣的信息。当安迪邀请我为他的第二本书《勒索软件与网络犯罪》撰写前言时，我欣然应允。\n\
    \n这个主题，正如现实本身，正在我们周围不断上演——从快餐连锁店到核弹头供应商，后果极其严重。然而每一天，这些事件看起来都像昨天的旧闻，似乎所有这一切都被人们不以为然。正如安迪所说，究竟怎样才能让世界及其领导人从睡梦中醒来？我不确定；但\
    \ 2021 年网络攻击和勒索软件攻击的预估总成本及损失将达到 6 万亿美元，相当于世界第三大经济体！领导者们必须觉醒，否则就真的为时已晚了！\n\n现在是\
    \ 2021 年，很难找到没有听说过勒索软件的人，因为勒索软件攻击的数量正呈指数级增长。但你对这些攻击了解多少呢？\n\n你刚刚打开这本书，它不仅全面收录了勒索软件攻击及其历史，而且内容要深刻得多。\n\
    \n这是一组案例研究，展示了勒索软件攻击的演变，并深刻剖析了许多董事会、首席执行官（CEO）和首席信息安全官（CISO）的傲慢与疏忽（我是否该说“犯罪性疏忽”？）。他们早已被告知其互联网处境脆弱，却仍不采取任何修复措施。什么都没有做！即便在已经遭受入侵后，他们仍被明确告知系统中残留的漏洞，依然无动于衷！\n\
    \n这些漏洞多年来已被各机构通过攻击性行动加以利用和武器化，如今它们已成为网络罪犯和国家行为体最优先的攻击面。这些漏洞是什么？首先——未受保护（未管理、已废弃但仍然活跃）的域名和子域名、过期证书以及使用\
    \ HTTP（而非 HTTPS）协议。它们修复起来非常容易，却仍然敞开着大门，任由恶意团体利用。\n\n书中的材料（包括一些非常有趣的邮件往来示例）清楚地表明，某些负责国家安全的机构不愿放弃其攻击性能力，因而回避向整个行业提供充分建议，尤其是回避向国家关键基础设施（CNI）从业者提供建议。\n\
    \n不幸的是，许多 CEO 和 CISO 仍然主要考虑终端防护，而其他敞开的大门却仍在其视野之外，尽管这些大门极其危险！尤其是当我们谈论 CNI 时。IT\
    \ 与 OT 的融合已经表明，通过上述攻击面发起的对 IT 的攻击可以横向移动至 OT，带来深远的后果。除非董事会、CEO 和 CISO 开始采取\n\n"
