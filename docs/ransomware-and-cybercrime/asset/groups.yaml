    # ² Not Secure, F and 0...


    We have over a hundred domains, we run bug scanning daily and fully appreciate
    the critical security issues and requirements of domains and security. We know
    some are literally holding pages with little to no data, we also know the top
    two dozen or so that we control and manage.


    > (CISO of a US $billion cyber security firm 20 May 2021. after numerous cyberattacks,
    including SolarWinds)


    So, I asked my vulnerabilities and research team to have a look. Within an hour,
    they sent me a dozen insecure domains belonging to the company. Even worse, Not
    Secure Login domains, domains with mismatching Transport Layer Security (TLS)
    certificates, TLS that had expired, and misconfigured domains.


    As a matter of professional courtesy, I sent two screen shots to the CISO at 23:00
    hrs my time in the United Kingdom to show them the findings. To the first, they
    responded, ‘Thanks for that, luckily that is only a client demo site’, implying
    it had no data or security exposure. On the second, a company videoconferencing
    Not Secure domain used by hundreds of the company’s staff constantly and totally
    open to a Man-in-the-Middle Attack, no comment was made…


    We hear dozens of excuses or reasons maintaining Not Secure domains is an OK thing;
    it is simply not. Any domain with a company on it that has been allowed to fall
    into a situation of relying upon obsolete TLS certificates at the absolute best
    demonstrates to anyone looking that the company lacks Internet security controls
    and management. What is also overlooked is the fact that cyber criminals are scanning
    the Internet looking for F and 0 rated websites to add to their target list and
    launch attacks on. Put simply, a Not Secure website says a lot about a company’s
    overall security position and capability. If it is insecurely connected to the
    Internet, chances are it is not much better on the inside. Equally, as the SolarWinds
    breach clearly showed'
