    by its member utilities. The primary stated mission of CAISO is to ‘operate the
    grid reliably and efficiently, provide fair and open transmission access, promote
    environmental stewardship, and facilitate effective markets and promote infrastructure
    development’. The CAISO is one of the largest ISOs in the world, delivering 300
    million megawatt-hours of electricity each year and managing about 80% of California’s
    electric flow.


