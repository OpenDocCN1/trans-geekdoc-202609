    # If a Clever Person Learns from Their Mistakes and a Wise Person Learns from
    the Mistakes of Others, What Is a Person Who Learns from Neither Known As?


    On 15 May 2020, I emailed Thomas, an executive of ExaGrid, and shared a screenshot
    showing ExaGrid’s Internet security Rating. I concluded with the line: ‘Thomas,
    ExaGrid’s Internet security needs checking as the attached indicates’. To which
    Thomas responded, ‘Hi Andy, I am not sure I’m following, would you like to expand?’
    I went back to Thomas on the same day and said, ‘Hi Thomas, as I say, I would
    suggest your security team check the Internet security connectivity as a Rating
    of F and 0 is the worst possible security Rating. If they are unable to discover
    these issues, let me know and we would be happy to engage and assist, regards,
    Andy’. I did not hear back from Thomas.


    We have just learned that ExaGrid, quite likely unknown to Thomas, were targeted
    and became victims of a Ransomware attack by the Conti Gang, who claimed to have
    infiltrated ExaGrid’s network for a period of a month. After negotiating, a figure
    of $2.6 million was paid in Bitcoin to the Conti Gang, who then released the decryption
    key.


    ExaGrid’s homepage states: ‘Fastest Backups, Fastest Recoveries. Industry’s Best
    Ransomware Recovery. Unparalleled, Cost-effective Scale-out’. What it does not
    state is: We are wide open to being infiltrated and attacked with Ransomware,
    as our Internet security Rating and score are F and 0...'
  - '[PAGE 184]


    The cyber criminals got straight to the point, and said: ‘As you already know,
    we infiltrated your network and stayed in it for more than a month (enough to
    study all of your documentation), encrypted your file servers and SQL servers,
    and downloaded all important information with a total weight of more than 800
    GB’.


    The negotiations commenced, and a figure was agreed on and paid, which then released
    the decryption key, and then ExaGrid lost it. Rather embarrassingly, ExaGrid had
    to go back to the cyber criminals and ask for a second decryption key. You really
    could not make this stuff up. ExaGrid have an impressive client list, a list that
    one could consider highly sensitive due to their work with various agencies and
    governments: General Dynamics, Northrop Grumman, Accenture, Boeing, Cap Gemini,
    and so on. Interestingly, there are inevitably several that have been breached
    themselves by the same Internet security negligence, such as Bose recently. I
    am positive that all these critical, government suppliers should unequivocally
    be undertaking due diligence on their third-party supply chains and data storage
    providers such as ExaGrid; however, that simply has not been the case. What is
    clear here is that ExaGrid and all their clients and customers took limited to
    no due diligence and if the Conti Ransomware Gang were in their systems for a
    month, they could have gained access to pretty much whatever they wanted. It would
    not be too much to consider a spate of consequential hacks on ExaGrid’s customers
    due to the data being retained. Such an attack could be like the recent Ransomware
    attack on CNA, the US Cyber Insurer, who also paid and have an ongoing Internet
    security Rating of F and 0. The criminals exfiltrated data on CNA’s customers
    on levels of policy and Ransomware cover so they could launch attacks with the
    least resistance, knowing full well the Insurer would settle the claim. Besides,
    if CNA could be a victim of one of these so-called and awfully intrusive ‘sophisticated’
    attacks, so could their clients. The fact is none of these attacks are ever sophisticated;
    they are opportunistic and prey on the weak, vulnerable, and ignorant. By neglecting
    the Internet connection and security of websites, their insecure position acts
    like a beacon for easy infiltration and exfiltration of plaintext data. They then
    can extract, encrypt, and sell back their encrypted data with a decryption key.
    For cyber criminals, it is a simple process such that they can eat, sleep, rinse,
    and repeat and leave a trail of devastation and losses. One thing I know for sure
    is if I were any of the clients of ExaGrid,'
