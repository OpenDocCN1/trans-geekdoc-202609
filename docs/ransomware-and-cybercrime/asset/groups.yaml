    ## Most Common Website Vulnerabilities and Attacks


    With the massive uptake of digital marketing and explosion of websites over the
    last decade or so, it is fair to say some, far too many in fact, fall through
    the security gaps and become insecure. That is not an excuse; it is sadly a fact.
    Take NASA, for example. The last time we looked, they had over 20,000 domains—yes,
    that is not a typo: over 20,000. Less than 5% are active, the rest are legacy,
    and many have security issues. Furthermore, when we tracked the upward curve in
    website numbers and laid over the data for increased cybercrime costs, the curve
    was virtually identical. It should come as no surprise, then, that websites are
    among the very first place cyber criminals look to gain access for their illegal
    and nefarious cybercrime activities. This should no longer come as a surprise.


    We covered the difference between SSL test ratings and full domain security ratings;
