    and sadly, as Colonial remain F and 0 rated for their Internet security, as well
    as now knowing what, at the PKI level, has gone on or been planted during the
    infiltration, I would suggest Colonial, along with many, many other companies
    caught napping and continuing to be negligent of their own security, will be breached
