  mdcn: '

    我向几个相关组织发了邮件，包括交通部（Department of Transport），巧合的是，他们今天刚刚回复了我三周前（2021年5月4日）发送的原始邮件。回复如下：


    ![](img/addbbc8c42e40e3fdcd2f05ac8162dd1_140_0.png)


    听着，这个问题可向 NCSC、GCHQ、NSA、CIA、FBI、易捷航空或专业网络安全咨询公司开放。有多少百万英镑被花在追逐虚假安全上而浪费掉，而近一年半以来，易捷航空完全处于不安全状态，并持续违反所有隐私法律？如果你今天上网预订易捷航空的航班，很可能他们的数字平台和域名的安全状况与去年
    1 月（当时正是通过这些平台和域名遭到入侵）完全一样。我会严重质疑易捷航空对隐私法律的遵守情况。这些发现推动了我们对该行业进行更广泛的研究，结果证明许多其他类似公司也处于非常相似（如果不是完全相同）的不安全状况。那么，为什么
    NCSC（其互联网安全评级为 B+，80/100，并且完全理解互联网安全如何被操纵、滥用和利用——事实上，他们与 NSA 一起为这类战术“著书立说”）不在企业遭入侵之前或之后建议他们确保其互联网安全呢？


    局势和答案都非常清楚。美国和英国政府及机构为在后冷战时代的新数字领域获取大规模数据情报和渗透而使用并完善的那些战术，被认为过于方便，能提供太多情报，因此他们不希望任何人关上数字大门，甚至不希望提醒那些毫无戒心的组织或高管注意他们过去的把戏。可以将其类比于大型烟草公司在德国科学家
    20 世纪 20 年代的发现以及英国 20 世纪 50 年代进一步确凿证据之后，数十年来一直否认吸烟致癌的事实。该行业在公开场合和法律斗争中都以否认的方式对抗真相。有趣的是，自
    1965 年以来，发达国家的消费率要么见顶，要么下降；然而，在发展中国家，消费率仍在攀升。几乎所有人都承认并知道吸烟有害健康；然而，数以亿计的聪明人忽视了大量确认危险的迹象，仍然吸烟。此外，如今世界各地的政府都乐于接受这些收入和税收，尽管知道代价将是更高的医疗保健费用和预期寿命的缩短。政府往往看重短期收益，而忽视长期挑战；这正是已经发生的情况——无论是有意还是无意，我们不清楚——美英政府和机构在操纵数字世界和互联网方面如此行事，反正这将是别人的问题。


    我们现在采取行动是否太晚了？我认为，这些机构正在整理灰色西装里的领带，挺起胸膛，希望威慑理论能保住他们的屁股。他们咄咄逼人的战术以及他们拥有和制造的既得利益冲突，正处在一个十字路口。勒索软件攻击每天在政府、医疗、商业、教育等领域发生多次——几乎每一次攻击都使用的是我们政府设计、开发和完善的战术。他们不愿说出真相，而是将其归咎于国家支持的网络犯罪分子的复杂攻击，然后被请来监督局势。交通部（DfT）之前的信函结尾如下：


    > 我们将继续与业界和合作伙伴（NCSC）合作，以提高交通领域的网络安全韧性，并利用我们所有可用的手段。希望这能在一定程度上解决您的担忧。


    遗憾的是，这完全无助于解决任何担忧，也无法修复这家公司、易捷航空或任何其他我国政府被请去协助的组织所处的可悲不安全状况。这是否是政府对重大网络违规行为的掩盖，以及政府继续访问数亿家公司？还记得国防部（MOD）的评论：“网络攻击在财务或生命损失方面代价不够高。”
    好吧，这一切都在改变，正如我们每天所目睹的那样……


    多年来，有人尝试载人飞行，结果造成了死亡。1903 年，莱特兄弟因完成了世界上首次持续 12 秒的载人飞行而登上头条。第一次世界大战期间，费迪南德·福煦在
    1911 年曾表示，飞机很有趣，但只是科学玩具；它们没有军事价值。1919 年，福煦改变了论调，称从纽芬兰飞越大西洋到葡萄牙的柯蒂斯水上飞机代表着未来，而战争正是凭借军用飞机已被证实的成功而获胜的。第二次世界大战在空战中广泛展开，不列颠之战被拍成电影，令人惊叹的“喷火”战斗机因在结束第二次世界大战中发挥了重要作用而受到全球赞誉。


    如今，撇开新冠疫情不谈，数十万架飞机将数十亿人运送到世界各地，丰富了他们的生活。客运飞机的出现彻底改变了旅游业，该行业不仅为数百万人提供了工作，还创造了数千亿美元的收入——与多年以前两兄弟倾尽毕生心血完成的
    12 秒飞行相比，真是天壤之别。


    18 世纪 50 年代，英国人乔纳斯·汉威被人看到使用一种他在法国购得的新装置——雨伞。较轻的版本，即女士阳伞，已经被使用了一段时间并被接受；然而，乔纳斯却把整个性别问题带入了争议之中，当他想保持干爽时，人们向他投掷腐烂的蔬菜和垃圾（嗯，这就是英国）。几十年后，性别差距问题才逐渐减弱，急需的“雨伞”才被接受，让男女双方都能受益。


    个人电脑是一个重要例子。在 1996 年出版的 *《女性与电脑》* 一书中，声称女性患有“电脑恐惧症”，这是一系列反映对触摸或损坏电脑的恐惧的病症。书中进一步提到，女性对触摸、损坏、讨论或熟练使用个人电脑存在恐惧和厌恶。该书得出结论，女性害怕对个人电脑上瘾——谁能想到呢。“电脑恐惧症”一词出现在当时许多出版物中，包括
    *《大西洋月刊》*。个人电脑在当时被视为带有一定悲观色彩的事物，被认为是学习和掌握起来很麻烦的事情；而现在，几乎没有多少事能离开电脑完成。


    可以毫不夸张地说，在当初的怀疑之后短短几十年后的今天，整个世界都依赖于计算和个人电脑。国家、税收、购物、基础设施、银行、政府——实际上无一例外，我们所做和使用的每一件事都依赖计算机。计算行业是当今世界上规模最大的行业之一，并在全球最富有的公司中占据很大比例。你能想象今天一个没有电脑的世界吗？当然不能，因为它们每天都在触及我们的生活。我们将在本章结尾进一步深入探讨这一点。


    20 世纪初，第一批出租车出现时，任何人都可以成为出租车司机，比如有前科的人以及习惯和品性可疑的人。直到 1907 年，30 岁的商人哈里·N·艾伦在曼哈顿乘坐四分之三英里被收取
    5 美元（相当于今天的近 150 美元），他才决定购买一支由 65 辆法国 Darracq 出租车组成的全红车队，并雇佣司机，打造了世界上第一支出租车队。当时，只有富裕阶层才坐得起出租车；然而，艾伦的新出租车停止了不透明收费，使出租车更加实惠。1937
    年，纽约推出出租车牌照制度，地方政府开始对出租车及其司机进行监管。仅在纽约市（新冠疫情前），每天就有约 40 万次出租车出行，是 Uber 和 Lyft 出行次数总和的两倍。出租车和共享出行（拼车和份额所有权）彻底改变了本地交通，而这还只是在我们开启电动、半自动和全自动驾驶汽车的下一个旅程之前。这类情况依赖于技术和创新，而目前在不进行数字干预的情况下确保控制面临重大挑战。一次性数字证书和零信任架构是必须的，但鉴于我们之前讨论过的
    PKI 以及数字证书的颁发、控制和管理问题，它们还远不可能实现。


    疫苗这个话题非常贴近当下。19 世纪 70 年代的天花疫情爆发，引发了对疫苗接种计划的呼吁。一群反对疫苗接种者（现在的反疫苗人士）大力反对这一计划。这并不特别新鲜；然而，主要的争论点在于法律规定必须接种免疫疫苗。他们辩称，个人卫生和身体自控将提供选择自由，从而可以选择退出国家强制要求的疫苗接种。19
    世纪 70 年代早期，在波士顿的一家法院，一名反疫苗者与这项法律斗争到底……

