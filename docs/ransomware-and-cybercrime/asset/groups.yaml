    1月2日，他们接到了通知。我们只能猜测，他们是不是在主页保持“不安全”状态的同时完成了上市；然而，在这种情况下，一如既往，他们是在向网络罪犯发送警报——这些罪犯不断寻找着可供攻击的“F”和“O”，而
    Travelex 完全符合这种*作案手法*。几个月后，由于 Covid-19 导致的全球性封锁，这次入侵事件进一步恶化；Travelex 在以30亿美元上市仅11个月后，便在普华永道的主持下进入破产管理程序。Travelex
    又勉强支撑了几个月，最终在2020年12月以1美元的可观价格被出售……这是一个18个月内从繁荣到网络崩溃的故事。


    网络攻击或勒索软件入侵不再被视为麻烦或不便。它能够也将会击垮数十亿英镑的企业，正如 Travelex 所证明的那样。我们不断听到高管和董事会说他们不懂网络安全问题，也不知道该做什么。我坦诚地建议他们开始学习，而且要快。此外，那些所谓的专家——比如伦敦劳合社的例子——依赖“专业知识”的人，真的需要承认他们并非无所不知；而且，忽视基本要领，他们正在将自己、企业、股东和合作伙伴置于完全不必要的风险之中。这些风险可能导致他们的公司倒闭……


    ## 案例研究1


    ### 从 HTTP 到 HTTPS 的增补


    如今，我们听到很多关于数字信任甚至零信任（ZT）的说法。两者都已成为时髦词汇。事实上，它们至关重要；然而，很少有公司真正理解其含义，数字信任和零信任往往不过是获取更多预算的术语和衡量标尺，太多公司继续不明智地花费和挥霍这些预算，而这些预算对真实安全几乎起不到什么作用，甚至毫无作用。如今，所有公司都必须考虑它们为客户提供的信任；然而，大型组织和政府却连基本、根本的安全都做不到。要让数字信任和零信任这样的状态成为现实，还有很长的路要走。只需看看网络攻击、勒索软件攻击以及因隐私疏忽而被罚款的数量就知道了。简而言之，数字信任和监管者充其量只是令人恼火，而受害者一如既往是公众。警告：人们迟早会用脚投票……


    2014年，谷歌和其他互联网服务提供商（ISP）表示“受够了”，决定尝试让互联网更安全、更可靠。仅这一声明和决定本身就足以证明，过去的互联网并不安全，可悲的是，现在仍然不安全。该战略制定并力求从传统
    HTTP 转向 HTTPS，其中 S 代表安全。这一决定意味着从传输中未加密的数据转向加密流量。该计划无疑是朝着正确方向迈出的一步，但也有几个缺陷。第一个缺陷是，迁移到
    HTTPS 需要全面采用；直到2018年，才真正获得了有价值的支持和采用。最终，在2018年，未采用 HTTPS 的公司和组织将受到公开羞辱，其网站会在地址栏中显示*不安全*文本，而不是挂锁图标。这后来被称为对不认真对待自身安全或客户及潜在客户安全的公司的羞辱。可悲的是，尽管情况有所改善，我们研究过的1000多家遭受网络攻击或勒索软件攻击的公司，其网站都处于次优且不安全的状态，许多至今仍如此。……这绝非巧合。


    这一挑战在于，如果我们审视网络攻击和勒索软件攻击，并思考这种攻击在寻找什么，我们就会看到，未加密（明文）数据对网络罪犯具有无与伦比的吸引力，而更严格、更严厉的隐私法律又助长了这种吸引力，而且损失往往被无知的网络保险提供商掩盖。明文数据一旦被窃取（通常是因为使用
    HTTP 发送），很容易被捕获，然后由于其中包含个人身份信息而被用来要挟受害者支付赎金。2018年，当地址栏显示“不安全”时，也表明并确认了未加密的数据流量。原本旨在让世界更安全的措施，实际上却被用来识别那些脆弱且可利用的网站。此外，在2021年的今天，整整三年过去了，那些显示“不安全”文本的组织也证明了他们没有控制或管理自己的网站、服务器和
    Web 界面，而网络罪犯则像鲨鱼一样围着猎物打转。不采用 HTTPS 对任何公司来说都是一个非常糟糕、不明智且松懈的做法；三年来，全世界在看到“不安全”文本时都已得知这种不良做法。如果企业负责人知道这种情况，他们绝对不会忽视。它影响着上游和下游的每一个用户和客户。然而，太多所谓的“安全专家”忽视、无视和忽略这些情况，却急于声称他们在安全上花费了数百万美元，并向不懂行的董事会和高管宣称自己是安全的。


    为了理解从 HTTP 到 HTTPS 的转变，让我们列出关键术语：


    - **HTTP（超文本传输协议）**——在线通信的基础（信息如何从服务器发送到浏览器）。

    - **HTTPS（超文本传输安全协议）**——改进的 HTTP，并带有一个加密安全层（S）。

    - **加密**——对信息进行编码，使其只能由授权方访问，而不是明文；后者是网络犯罪分子的“主食”。

    - **SSL（安全套接层）**——在服务器和浏览器之间创建加密通信链路的技术协议。

    - **SSL 证书**——数字数据文件，安装在 Web 服务器上时可加密数字信息并激活安全连接。

    - **DNS（域名系统）**——域名目录，可转换为 IP 地址。


    谷歌和其他 ISP 列举了从 HTTP 转向 HTTPS 的三个不同理由。他们希望网站与所有者匹配并经过认证；确保数据具有完整性


    ## 那么，这与勒索软件有什么关系呢？


    让我们首先思考，为什么公司一开始会成为勒索软件攻击的目标。首先要了解的是，对手的许多攻击针对的是他们不熟悉、从未访问过或从未沟通过的公司，但由于这些公司存在不安全的互联网连接，它们被标记了。决定攻击谁、不攻击谁的筛选过程可能各不相同；然而，组织的规模、账户以及与合作伙伴和/或政府的接触范围，都可能在挑选那些更有可能迅速支付且有能力支付赎金的目标时发挥作用。同样不可忽视的是，攻击正越来越多地集中在那些无法承受技术系统停机或生产停工的大型公司身上，例如
    Colonial Pipeline（稍后会详细介绍）和索尼。勒索软件的要价已急剧上升，如今达到数千万美元，并且确已支付。犯罪分子知道，像 Colonial
    这样的公司每停产一天都会带来巨大的成本影响，而三分之二的天然气公司耗尽燃料，也会激起大众要求采取行动……


    勒索软件只是数字领域和世界中的一种犯罪活动，它利用不安全的环境获取访问权限（渗透），然后窃取明文数据（因不安全而未加密的数据）。接着与受害者分享所捕获的数据，再对其加密并“卖回”给受害者，要求支付赎金以获得解密密钥。CNI（关键国家基础设施）、医疗保健运营商和运输组织，甚至政府——无论个人观点如何，人们太容易通过支付勒索赎金来掩盖自己的错误和疏忽。随后经常被完全忽视的是根本原因。那些一开始就让组织成为目标并易于被利用的不安全域名和状况，进一步被忽视和忽略。赎金支付了，不安全状态依然存在，随时准备迎接下一次攻击。不安全的信息甚至会被转卖。


    受害者（但愿）拿回了他们珍视的数据，并发誓再也不会上当，真的……自掏腰包数百万美元，结果只是回到原来的位置、停滞不前。遗憾的是，事情并没有就此结束。大部分数据可能已被泄露，而且无法保证数据没有被标记，或者没有一部分被保留以用于下一次攻击。据估计，在这种情况下，只有8%的数据能够归还且未受损害。

