  mdcn: "\n认真对待面向互联网的安全问题，并解决那些显而易见的漏洞。在这场战争中，没有人能够幸免——无论是麦当劳、大型保险公司、美国核弹药的供应商，还是中小企业，尤其是在勒索软件即服务（Ransomware-as-a-Service，如\
    \ REvil）迅速普及、多个网络犯罪团伙之间出现“职责分工”的当今环境下。\n\n近年来，所谓数字化转型的大量涌现（以及敏捷方法的大规模普及），再加上新冠疫情带来的后果（例如居家办公），显著增加了企业暴露于互联网的程度，进而也增加了遭受网络攻击的风险。\n\
    \n我觉得有必要对作者再多说几句。安迪·詹金森（Andy Jenkinson）是一位备受尊敬的专业人士，在业内广为人知。他是CIP集团的首席执行官，专注于风险、合规、网络安全和PKI领域。在过去几年的在线合作中，我亲眼见证了他不知疲倦地向人们传播知识、帮助各类组织走出困境。我也多次目睹各种阻力，但这些都没有阻止安迪的努力。安迪是一位广受欢迎的演讲者，曾在众多会议和活动中发表演讲。他还著有另一本出色的书《从震网到太阳风：数字利用与网络战争的20年》（Stuxnet\
    \ to Sunburst. 20 Years of Digital Exploitation and Cyber Warfare），我也强烈推荐这本书。\n\
    \n谁应该读这本书？在我看来，董事长、董事会成员、首席执行官（CEO）和首席信息安全官（CISO），以及负责运营安全的人士，都应该一读。任何对网络安全感兴趣的人也会喜欢阅读这本书（当然也可能会被吓到）。总而言之——我强烈向所有对这一领域感兴趣的广大读者推荐这本书！\n\
    \n**弗拉达斯·莱昂纳斯博士**  \n*多伦斯大学兼职教授*\n\n## 前言\n\n生存下来的不是最强大的物种，而是最适应变化的物种。在勒索软件和网络犯罪的世界里，我们正目睹对手在力量和灵活性方面发生前所未有的转变。数字世界乃至整个世界的弱点和脆弱性，正被那些本应用于确认安全性的数字工具暴露无遗。OSINT（开源情报）技术（通常免费）正被用来识别那些暴露在外、缺乏控制、管理和安全性、可被利用的域名和子域名。纵观历史，为攻击能力设计和开发并用于战争的工具，同样也可以用于防御。\n\
    \n可以公正地说，目前形势几乎肯定对我们不利；然而，我们作为专业人士、也作为人类，几乎没做什么来改变这一局面，而且还继续无视眼前的事实。其结果是，勒索软件和网络攻击的规模已达到难以跟踪的程度，更不用说以真正的热情去对抗了。此外，由于长期缺乏域名安全，即使在入侵发生之后，即使在根本原因已经确定之后，所有改善本已欠佳且不安全处境的尝试都是徒劳的。一旦新设备、笔记本电脑、服务器等接入网络，它们就可能立即遭到入侵。\n\
    \n在近乎集体恐慌、每天都有入侵事件被证实的背景下，由于新冠疫情，许多公司、体育赛事以及导致大规模聚集的活动都被叫停。然而，这也制造并加剧了本已极其不安全的处境，并带来了许多重大机遇和挑战，尤其是远程访问，它让当今本已不安全的处境雪上加霜。\n\
    \n随着员工有机会在家中和远程场所办公，通过不安全的连接上网，并收到大量关于如何应对新冠疫情的欺骗性恶意邮件，其中许多邮件在不知不觉中携带了恶意软件代码（木马），并得以对更多企业进行深度访问。德国政府曾在两周内被一个假冒仿冒网站骗走高达1亿欧元——该网站收集资料并冒领新冠疫情财政补助——而德国政府在不知情的情况下，将资金支付给了网络罪犯，而不是真正的申请者和需要财政支持的人。\n\
    \n损失还在不断增加。去年，Travelex的所有者Finablr——2019年5月以约30亿美元的估值完成首次公开募股——于2019年12月遭到入侵，仅仅几个月后的2020年4月，便被置于普华永道（PWC）的破产管理之下，随后在2020年12月以1美元的价格被出售。这个令人震惊的故事应当成为一个响亮的警钟，让人警醒可能会发生什么，以及发生得有多快。我怀疑没有任何风险管理能够预测到这种情况，而且我怀疑很多投资者都有大量资金需要核销……英国航空（BA）在发生涉及近50万条数据的泄露事件、并被信息专员办公室（ICO）处以1.28亿英镑初始罚款后，也宣布进行重大调整以避免倒闭。\n\
    \n我们知道，市值达数十亿美元的公司，其相关成本将占收入的大约70%。许多其他公司在新冠疫情之后的一段时间内将以巨额赤字运营；许多公司干脆停业。\n\n在与网络安全保险行业的讨论和后续研究中，有一点变得非常明显：保险公司似乎对自己的处境相当满意；然而，在最近两个月里，CNA和AXA都遭受了入侵，凸显出它们自身的不安全处境。CNA最终支付了4000万美元的赎金。这两家机构似乎都满足于无视并继续维持这种不安全的处境。然而，它们真的看不懂商业算术吗？网络安全保险市场预计将增长到超过2000亿美元；然而，与2021年预计总损失6万亿美元、到2025年预计超过10万亿美元相比，这两个数字之间存在巨大而明显的鸿沟。\n\
    \n例如，A公司有10亿美元的收入。在这10亿美元中，35%将用于支付员工薪酬（3.5亿美元）。另有25%将用于支付管理费用、建筑物和一般日常成本（2.5亿美元）。再有10%需要用于支付技术、安全和潜在损失。暂且把资本充足率放在一边，那么在缴税之前，还剩下总共30%，就A公司而言，即3亿美元。\n\
    \n现在假设A公司是一家网络安全保险承保商，总收入为10亿美元。如果总索赔额一旦超过前述30%，即3亿美元，那么他们就是在亏损经营。我们不要忘记，他们做生意的目的是盈利，而且必须能够证明自己具备应对此类情况的资本充足能力。这当然是一个非常微妙的平衡，而且可能是法国安盛（AXA）在自身遭到勒索软件入侵前一周确认将不再“保证”向客户支付勒索软件赎金的主要原因……\n\
    \n无论从哪个角度看，也无论有多少公司会“分担”年度累计损失，许多公司都将根本无法承受这些损失，只能做以下两件事之一。领导者要么为公司的衰亡做好准备，要么主动更好地做好防范，避免遭到攻击和承受巨额损失。对于国家关键基础设施、医疗保健和金融服务而言，不应该有选择的余地；然而，人们对真正的安全仍然十分无知，甚至还在打“貌似合理的否认”这张牌。\n\
    \n公司有两种类型，领导者也有两种类型：一种希望在中期到长期有所作为，另一种只想拿到年度奖金，然后在适当的时候走人。在这两个方面，你都能在许多公司中看清谁是哪一种。\n\
    \n可以说，除非你知道或能看到自己试图保护的是什么，否则你还不如蒙着眼睛上战场，而且没有合适的工具来保护自己，甚至保护企业。\n"
