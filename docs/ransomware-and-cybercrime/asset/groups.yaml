    take to make the world and its leaders to wake up from their slumber, I am unsure,
    however 2021 will see Cyber and Ransomware attacks amounting to a total estimated
    cost, and loss, of $6 trillion making it equivalent to the world’s third largest
    economy! Leaders need to awaken before it is simply too late!


    It is 2021 and it is hard to find a person who hasn’t heard about Ransomware,
    as the number of Ransomware attacks is growing exponentially. But how much do
    you know about these attacks?


    The book that you have just opened contains not only a comprehensive collection
    of Ransomware attacks and their history. It goes much deeper.


    It is a collection of study cases that illustrates evolution of Ransomware attacks
    and also offers deep insights in arrogance and negligence (should I say criminal
    negligence?) of numerous Boards, CEOs and CISOs that have been warned about their
    vulnerable Internet positions and still done nothing to fix it. Nothing! Even
    when they have been shown vulnerabilities remaining after the breaches that they
    have already suffered from!


    These vulnerabilities have been explored and weaponized over the years through
    offensive efforts by various agencies and by now they have become the very first
    attack surfaces for cyber criminals and nation actors. What are these vulnerabilities?
    Firstly – unprotected (not managed, abandoned, but still active) domains and subdomains,
    expired certificates and use of HTTP (but not HTTPS). They are so easy to fix,
    but they still stay wide open for exploitation by evil-minded groups.


    Material in the book (and it includes some very interesting examples of mail trails)
    clearly illustrates that certain entities in charge of national security are not
    willing to let go of their offensive capabilities and thus are shying away from
    providing adequate advice to the industry in general and especially to CNI players.


    Unfortunately, a lot of CEOs and CISOs still think mainly in terms of end-point
    protection, while other open doors still stay outside their vision field, though
    these open doors are extremely dangerous! Especially, when we are talking about
    CNI. Convergence between IT and OT has already shown that attack on IT via the
    above-mentioned attack surfaces can laterally move onto OT bringing far reaching
