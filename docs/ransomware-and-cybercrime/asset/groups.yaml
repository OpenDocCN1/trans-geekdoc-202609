    If, and quite possibly when, their tactics, tools, and methods that they had developed
    and used globally to exploit weaknesses and vulnerabilities worldwide fell into
    their (our) adversaries’ hands.


    The Senators and governments signed Bill after Bill, and $billion after $billion.
    Bush also signed off on Stuxnet (Olympic Games), and when Obama became President,
    he continued sanctioning the first digital offensive weapon with Biden at his
    side. The vast sums of money spent by US and UK governments are simply unbelievable,
    third world debt figures. The creation of thousands and thousands of jobs, many
    filled by contractors through companies that worked ‘favourably’ with the governments,
    witnessed the single biggest increase in labour rates for technical resources,
    and of course, most companies were owned by ex-colleagues, and with the promise
    of a Non-Executive Director role or similar upon later retirement, the wheels
    were suitably oiled and greased. I suspect what started costing $500 ended up
    costing the US government $2000 and often much more. The ‘margin’ was used for
    said greasing.


    Roll this out over 20 years and with a ratio of 100 to 1 of people working in
    cyber offensive versus cyber defensive, it quickly became the default position
    that Corporate US became overweight, bloated, and simply lazy. More importantly,
    it also became insecure. Sure, they rode the wave of the digital world, but no
    one told them, or anyone else for that matter, that they had to take responsibility
    to make sure it was also secure. Do not forget, the US government were delighted
    that corporations had little to no idea of how to make sure they were secure,
    as they could exploit their Insecure positions, and undoubtedly did. Add the fact
    that the numerous Telco companies, social media, and tech giants, in the main,
    were happy to be ‘awarded’ major government contracts in return for a backdoor
    here or there—who would ever know? This position gave the NSA and GCHQ literally
    access to every IP address, device, and person who ever used any form of technology.
    They had achieved some amazing capabilities but never thought enough about protecting
    or securing that position. Even in their own backyard, in the event that enemies
    could use the same position against them, or us.


    I can neither confirm, nor deny if someone somewhere within the governments one
    day realised the incredible oversight and faux pas they had made. However, when
    they finally realised, after maybe the first $1 trillion in cybercrime losses,
    I suspect they pulled out some earlier Deterrence theory papers and declared there
    was no need to worry, as they could play that hand. They could say that they could
    do more damage with their cyber firepower; it would work the same as it did with
    their nuclear program and The Fat Man. Sadly, they were wrong, as we witness every
    day. As the Senators’ committee was told by Paul Nakasone last year, ‘Our adversaries
    are not afraid or scared of us’, and this is very much the case. The situation
    is further compounded by the fact that, over the last twenty years, CEOs, CISOs
    and Executives simply do not understand what an insecure website means and were
    rarely, if ever, encouraged to find out. How could one of their own websites that
    they use to sell items or have a digital presence ever be used against them? Such
    a suggestion is surely just poppycock. Furthermore, governments are still hiding
    behind the fact they exploited the digital world and do not want to own up to
    it. Just look at Crypto AG and OMNISEC, two of the world’s largest and most prolific
    Encryption machine manufacturers who supplied no less than 120 governments. It
    was only last year that it became known that these Swiss, so-called independent
    companies were both finally announced as being owned by the CIA, the US government.
    Both companies manufactured all their Encryption machinery with US government
    backdoors built in. Even US allies used these machines whilst, unknown to them,
    the United States were able to simply decrypt their messages and listen in. I
    cannot comment on the legal position of such clandestine and underhand activities;
    however, if there were a Cyber Geneva Convention, I am sure this would most certainly
    not comply.


    So back to Deterrence Theory: many experts have applied the theoretical framework
    of deterrence theory to cyberspace as cyber deterrence. While both typical warfare
    and cyberwarfare share some characteristics, such as the offensive advantage,
    given the difficulty and costs of defence, significant differences exist.


    The emergence of deterrence theory in the military dates to the 1920s/30s when
    the first flight bombers were considered unstoppable by defensive measures. Then,
    strategists thought that large-scale attacks on one’s cities could only be prevented
    if the other side feared (were deterred) counterattacks of similar or even greater
    magnitude. The first nuclear bombs demonstrated a similar offensive advantage—an
    error of judgement, let alone an incredibly costly one. We are witnessing that
    sheer scale, power, and capability in cyberspace is shifting all theories on previous
    warfare. The ‘underdogs’ can actually win due to the inadequate and poor-defensibility
    position being maintained. David and Goliath is no longer a fairy tale, but reality.


    Additionally, deterrence is now much broader and deeper than before. It is under
    incredible pressure due to technical, cultural, and political viewpoints and operates
    in a far more intricate and elaborate environment, including Space and Cyberspace.
    The goal of developing and evidencing empirical theory on deterrence remains on
    every level incomplete, and whilst deterrence theory remains a fascinating area,
    it cannot, nor should it, be relied upon.


    Being candid for a moment, when people, including security leaders, cannot distinguish
    between a Secure and Not Secure website and do not understand the dire implications
    and consequences, it is impossible to see this ending any other way than badly.
    There are clearly several economies running concurrently: the global economy that
    we see and that gets reported; The black-market economy that includes drugs, extortion,
    human trafficking, and cybercrime; and then the grey economy that is run by, well…
    some from each of these. One can only guess, these are fuelling, and dare I say
    actively encouraging security incompetence and negligence but encouraging the
    need and spending. One must question the logic and motive.


    In the world of motor racing, where I fortunately enjoyed great success with Aston
    Martin, we have a saying; ‘How do you make a small fortune from motor racing?
    You start with a large one’. In the cyber world, that large fortune is the global
    economy and taxpayers. The small fortune is being made by ‘favoured and selected’
    cyber providers and Venture Capitalists. It is a totally unacceptable model and
    playing into the hands of the few, taking from the masses.


    When Critical National Infrastructure organisations such as Energy, Water, and
    so on are knowingly left in total shambles and with inadequate, lacking, and reckless
    insecurity and defence with government and regulator knowledge and acceptance,
    one must ask: is everyone really complacent, or are some being complicit?


    > As Albert Einstein said, ‘If I were silent, I’d be guilty of Complicity’.


    ## 9 Ensuring the Security of Insecurity


    In this chapter, we look at the direct correlation between Internet-facing security
    and breaches. We have researched many hundreds of breached organisations, actually
    over 1000, often several times a day. The one thing they all have in common across
    these disparate and often totally unrelated organisations, on different continents
    and in different time zones, is they all have sub optimal Internet-facing and
    connected domains. We are not talking a slight variance, either. Our research
    and findings show a 100% result of hacked organisations typically have security
    Ratings of F and often a 0. Sometimes it might be an F and 5 or 10. We have never,
    let me repeat that, we have never found a company with an A+ Rating and 100 score
    that has been a victim of a breach. One could call it coincidence, or one could
    call the target group unlucky; however, as mentioned, this is not a high percentage
    or ratio: it is 100%. Every single organisation from SolarWinds to Donald J. Trump
    has been maintaining sub optimal domains and, on many occasions, domains with
    obsolete SSL certificates. As I have mentioned before, this means the certificate
    has expired, or there is a configuration error rendering the site Not Secure,
    and being Not Secure, means the authentication and data of the site can lack integrity
    and data may be being transferred in plaintext form, that is to say, not encrypted.
    It does not take a rocket scientist, professor, or even a cybercriminal to know
    that plaintext data is a Ransomware criminal’s main goal to exfiltrate. Once exfiltrated,
    they can then encrypt it, and only they have the decryption tool. I would go as
    far to say such situations are at the very top of the list for cybercriminals
    intent on extortion via Ransomware attacks.


    Over the last two years, our findings have seen us assisting the FBI when we discovered
    a Korean DNS in the central voting system, presenting reports to the Senate Intelligence
