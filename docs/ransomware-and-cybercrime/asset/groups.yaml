    # Zero Day Attacks


    ZDAs (Zero Day Attacks) are used mainly by well-funded or financed Nation State
    cyber groups. They take their name from the fact they are a new, unknown attack
    vector and capability, and therefore there are Zero Days (ZD or 0 days) of experience
    to combat the attack. It is effectively a new software vulnerability that has
    not yet been encountered or remediated. Attackers can gain information and intelligence
    and discover loopholes before updates are made public to address them. Often patches
    and updates are months behind the curve of a ZD, and as such, the ZD can be exploited
