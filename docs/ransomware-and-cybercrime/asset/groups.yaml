  mdcn: "\n\n![](img/addbbc8c42e40e3fdcd2f05ac8162dd1_0_0.png)\n\n## 勒索软件与网络犯罪\n\n\
    安德鲁·詹金森\n\nCRC Press\nTaylor & Francis Group\n\n## 勒索软件与网络犯罪\n\n2001年5月，被誉为“教父”并掌管美国各机构网络攻击能力的吉姆·戈斯勒说：“要么情报界（IC）成长并适应，要么互联网会把我们生吞活剥。”戈斯勒先生是在他退休时发表这番讲话的，而几个月后就发生了9/11恐怖袭击。他或许没有意识到，他和他的数万名美国情报界网络攻击特工所创造并开启的，究竟是催化剂，还是海啸。\n\
    \n在过去二十年里，戈斯勒先生及其互联网键盘战士大军所创造的东西，成了每一个匿名、无名、由国家资助或个人行事的网络罪犯竞相效仿的作案手法，用以对付一群毫无防备、防护薄弱且无知的高管和安全专业人士——他们对美英机构以安全为名主导的互联网渗透和武器化隐秘手段几乎一无所知。\n\
    \n本书涵盖了许多网络攻击和勒索软件攻击及事件，包括我们如何发展到大规模数字化应用的地步，尤其是在全球封锁和新冠疫情大流行期间；还包括在线消费——网络犯罪造成的经济损失将是在线消费金额的两倍。\n\
    \n这些攻击几乎无法归因，而且即便情报界自身也遭到网络攻击，他们当然都会把这些攻击归咎于“高精尖”攻击。我们正目睹我们的整个生活方式、经济乃至自由遭到侵蚀。情报界有很多责任需要承担，并且毫无疑问地造成了我们目前所处的灾难性局面。他们目前几乎拿不出任何对策。我们需要——不，我们必须要求——改变。这种改变必须从确保互联网及其所有连接的安全性开始，使其不再允许情报界和网络罪犯轻松访问和窃取数据。\n\
