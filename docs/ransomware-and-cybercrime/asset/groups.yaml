    那个选项。虽然对于那些只想要网站服务的人来说，要确切了解这些 cookie 的用途确实很麻烦，但正如我所提到的，在更广泛的隐私保护运动中，有人呼吁限制对用户的追踪和活动记录。在一些网站上，退出
    cookie 以及仔细翻找那个选项（而不是直接点击“全部接受”）已经变得烦人地复杂。这不过是营销伎俩，应尽可能避免。所有网站都希望获得客流量和业务转化，无论采用何种衡量指标。立法反应迟缓；然而，通过抵制那些具有侵入性的网站，将推动行为改变。


    最近，CSP 被引入以加强网站安全。CSP 是一种 HTTP 标头，使运营者能够更好地控制其网站资源的加载来源。使用 CSP 是预防 XSS（见前文）的最佳方式。众所周知，为现有网站追溯添加
    CSP 并不容易；然而，CSP 已成为所有新网站的强制要求，并被强烈推荐用于所有高知名度、高流量的网站。使用 CSP 的另一个主要好处是，它会禁用不安全的
    JavaScript 和内联 JavaScript，这意味着转义不当的用户输入可能会生成被解释为 JavaScript 的代码。使用 CSP 是消除针对网站的
    XSS 攻击的唯一最有效方法。


    我们知道，网站还可能被用于“水坑攻击”和“路过式下载”攻击，以及域名劫持和接管（如 SolarWinds 事件）。我们也明白，确保网站安全是一项全职任务。网站安全方面的变化层出不穷，但远不及攻击变化的速度。据估计，每天发生约
    20 万次网站攻击，因此，建立适当的控制和管理措施从未像现在这样重要或关键。公司的域名无疑是其在线存在和成功的关键；它们也可能被用作整体攻击和渗透策略的一部分。像
    SolarWinds 这样的数十亿美元规模的公司，确实可能沦为攻击的受害者——攻击始于对使用过时 SSL 的不安全域名的攻击，随后因该域名不安全、缺乏管理和控制而演变为域名劫持。就
    SolarWinds 而言，那次攻击导致了域管理员访问权限（即“王国之钥”），数以万计的公司从未停下来询问 SolarWinds 的数字证书更新是否可信；它们只是直接下载，完全没有意识到其代码中被植入的恶意
    Sunburst 代码。我们还要指出，即使是政府部门，也从未要求或坚持进行任何尽职调查。


    互联网确实是营销、销售、产品发布、通信等方面的惊人工具；然而，如果任由其处于不安全的放任状态，它可能会而且必然会带来严重反噬，而且往往确实如此。它将使公司破产，并且如前所述，正在创造全球单一最大规模的经济转变，2021
    年网络犯罪造成的年度成本和损失超过 6 万亿美元，预计到 2025 年将超过 10 万亿美元。


    许多人（包括 IBM 前首席执行官金妮·罗梅蒂）都曾表示，网络攻击是对公司和我们经济未来的单一最大威胁，然而，为什么有这么多优秀且经验丰富的专家在无所事事，而这么多行业领袖（如我们之前提到的）却在兴高采烈地无视证据和事实？正如一位国防部高级官员对我说的那样，在美元和生命方面的代价还没有大到足以引起其迫切需要的关注。


    也许我们需要一家中央银行或金融监管机构成为黑客攻击的受害者。根据我们的研究，这一天不会太远了……


    经济环境’。这样的命令必须在 28 天内获得议会的支持和拥护。该银行于 2011 年 6 月召开了首届金融政策委员会，作为宏观审慎监管机构，负责监督英国金融部门的监管。


    英格兰银行行长安德鲁·贝利在 2020 年 3 月 16 日被任命为现任职务之前，一直担任 FCA（金融行为监管局）的首席执行官，该机构此前名为金融服务管理局。在此之前，贝利先生曾担任英格兰银行副行长，这与他早年在银行担任首席出纳员（2004
    年 1 月至 2011 年 4 月）的时期相去甚远。


    在 2007 年底至 2011 年的金融危机期间，贝利先生负责该银行的特别行动，以解决银行业内部的挑战。2013 年 4 月 1 日，贝利先生成为审慎监管局的首席执行官，成为英格兰银行首位负责审慎监管的副行长。


    不过，这其实比它应有的样子更令人困惑；不妨将英格兰银行、审慎监管局和金融行为监管局视为在金融服务（包括保险）的所有领域协同运作。将这个集团视为不仅在英国，而且在全球的监管和银行业界具有极大影响力，并非不合理。


    2020 年 4 月 24 日，我们联系了英格兰银行的几位联系人，因为我们的研究提醒我们，该银行“忽略”了其主页上的数字证书续期。众所周知，这是一个巨大且有些尴尬的错误，并会引发各种安全问题，包括使该银行暴露、脆弱，且易受网络攻击。我们与该银行几位高级联系人交换了电子邮件，并附上了一张带有时间戳的
    SSL Labs 截图，显示没有证书。这份情报既非主观也非带有偏见；它是事实，而且就互联网连接和安全性而言，糟糕得不能再糟糕了。我们还将同样的信息分享给了
    NCSC 的伊恩·利维博士，确认该情报实际上来自我们自己的中央银行，但没有收到任何回复。


    一周过去了，我给主要联系人发了一封后续邮件，他随后确认自己因病休假，正在康复中。当然，我尽可能地表示了同情，但事实是，中央银行暴露在攻击之下。我敦促确认，但没有得到任何一方的感谢，只是偷偷摸摸地修复，并希望没人会注意到。我们使用带有时间戳的截图作为这一重大错误的证据。此外，正如我最后一封邮件所确认的，还有其他类似问题未得到解决，这些问题正以与劳合社（我已多次告知）几乎相同的方式制造其他重大漏洞。说得更直白些：当我们第一次提醒英格兰银行其问题时，其整体安全评级为
    F 和 0 分。在他们处理了我们提醒的 SSL 问题后，评级也仅变为 D 和 35/100，对于一家央行来说，这很难称得上是一流——该行缺少 HTTP 严格传输安全（HSTS）标头，虽然会重定向到
    HTTPS，但首先是重定向到另一个 HTTP，并且容易受到跨站脚本和中间人（MiTM）攻击。无论 bankofengland.co.uk 网站背后保存或不保存什么数据，这种疏忽无异于安全上的无能和失职。


    对英格兰银行的研究是一项涵盖金融服务、中央银行和监管机构的更大研究论文和调查的一部分。作为这项研究的一部分，金融行为监管局也被纳入其中。


    FCA 是一个独立于英国政府运作的金融监管机构，通过向金融服务行业成员收取费用来获得资金。FCA 监管向消费者提供服务的金融公司，并负责维护英国金融市场的诚信。FCA
    成立于 2013 年 4 月 1 日，前身是 FSA。FCA、审慎监管局和英格兰银行有着内在联系，密切合作以确保货币政策、金融稳定和监管得到维护。缺少任何一方，金融服务市场都可能直接崩溃并陷入自由落体状态。


    4 月 15 日，我联系了 FCA 的一位高级风险与技术专家，她友好地回复了。我分享了我的担忧，以及 FCA 的互联网相关安全评级为 F 和 10/100
    的事实，并担心如果网络犯罪分子发现了这些不安全的环节，他们可能会对监管机构发动一次成功且很可能不被察觉的攻击。我得到了她的 FCA 邮箱地址，然后通过电子邮件发送了截图和进一步信息。她向我表示感谢，并告诉我他们会在内部讨论。我还得到了他们
    whistle@fca.org.uk 网站的电话号码和邮箱地址。我进一步

