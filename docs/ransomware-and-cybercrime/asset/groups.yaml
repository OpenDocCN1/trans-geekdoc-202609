    # # STUXNET TO SUNBURST AND RANSOMWARE DEVELOPMENT


    My previous book, *Stuxnet to Sunburst, 20 Years of Digital Exploitation and Cyberwarfare*,
    took the reader on a journey and looked at numerous specific cyberattacks and
    the first use of digital code for warfare in the form of Stuxnet. Stuxnet used
    digital certificates laced with malicious code (Stuxnet). It went in depth about
    many attacks and concluded with the similarities of the SolarWinds breach that
    started in early 2020 and surfaced in December 2020, affecting thousands of clients
    including the US government. What made this ironic is SolarWinds is an American
    company that develops software to help manage clients’ networks, infosec, and
    infrastructure. As a well-known and highly utilised US government supplier, SolarWinds
    could not have been better placed to be breached and cause maximum infiltration,
    disruption, and unfettered access. What made it a double whammy, in many ways,
    was the fact that once Domain Administration Access had been achieved via a hijacking
    a legacy, insecure sub-domain, the adversaries laced SolarWinds’ own digital certificates,
    which were distributed and used to update customers’ versions, with Sunburst,
    the name given to the code. Furthermore, the delay of 13 days from update acceptance,
    often without any intervention, was an identical timeframe as used in Stuxnet
    was set before Sunburst was activated. Is that just a coincidence with Stuxnet’s
    own 13-day delay from infiltration? We think not.


    Both Stuxnet and Sunburst were cyberattacks with a specific purpose. The first
    was to destabilise, slow down, or even halt the Iranian nuclear program, the second
    to cause major disruption and infiltrate the US government, including the Treasury.
    This can only be a bad thing as the United States, indeed all organisations and
    governments, do not have proper controls or know what their enterprise contains;
    chances are they contain much more now, along with data exfiltration.'
