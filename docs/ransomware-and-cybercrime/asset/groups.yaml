    with security. Even when we ‘gifted’ the information and concerns to the NYC Mayor’s
    office, Department for Transport, and MTA, they did nothing and then a while later
    became victims to a cyberattack. US legislators and legal professionals need to
    hold those responsible to account; sadly, far too much playing the victim card
    and calling the cyber insurance provider playing the victim is being accepted.
    Nothing will change until a planet-scale change of attitude takes place.


    In addition, this week, the Steamship Authority became the latest victims to suffer
    an attack. On their website, they were taking their communication capability seriously
    by notifying the public of the sequence of events. However, their communication
    capability is clearly far greater than their security ability, as, like many before
    them, they have limited to no clue why they were victims of a cyberattack. A quick
    look at their address bar yesterday showed there, bold as brass, they are telling
    the world they are a travel company and know nothing at all about Internet security,
    and there it is, confirming the fact, a Not Secure text. In the security world,
    this is basic security at its lowest. It not only makes them a target, but it
    is a near guarantee they will be infiltrated, disrupted, and hit with a ransom
    demand. Just like the recent cyber assault in Florida of 145 schools being shut
    down by a seventeen-year-old pupil, almost by mistake, these attacks will keep
    coming thick and fast, and most certainly do not need state backing. All these
    organisations and schools are maintaining F-Rated security for their domains and
    are open to being easily identified and exploited. It is a Ransomware and cyber
    criminals’ sweet shop: fill your bags, as nobody is bothering to look; but, my
    goodness, everyone is happy to blame everyone else for their own negligence and
    incompetence.


    Corporate America is like a sitting duck and will continue to be so until Internet
    security is 1) acknowledged and 2) prioritised. We have previously greatly assisted
