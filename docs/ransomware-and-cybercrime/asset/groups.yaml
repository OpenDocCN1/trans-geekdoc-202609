    JBS Foods face an immediate halt at many of their facilities and thousands of
    chilled carcasses from the cattle slaughtered the day before the attack. It is
    not the physical task of boning the carcasses; it is the record keeping which
    will now have to be manual. It is believed that the slower, manual process will
    affect shipping documentation, labelling, inventorying, and records without computer
    systems. As such, the resultant boxed meat is more than likely to serve the local
    market. Coles, the supermarket giant that is supplied extensively by JBS Foods,
    has already looked at other suppliers. The knock-on effects from such a cyberattack
    will be incredibly difficult to calculate.


    Within minutes, literally, of hearing of the JBS Foods Cyberattack, our research
    went on the hunt for vulnerabilities. It was not long before we found several
    JBS Foods homepages rated with F and 0 ratings. The website, connected to all
    international domains, would and easily could have been used to laterally move
    around other parts of the network just as SolarWinds and Colonial suffered, and
    it is no coincidence that both SolarWinds and Colonial had, and still have, Internet
    security Ratings of F and 0. Now either incompetence and negligence are of monumental,
    biblical proportions or being facilitated. As I constantly ask the question, complacent
    or complicit? We know, as should everyone, most certainly in security or IT, the
    Internet was weaponised many years ago; it allows all computing functions around
    the world, and it can act like a two-way valve unless you control and manage the
    one-way valve that is called security. Information and data should not be available
    to anyone wanting to look or be taken by anyone willing to break the law and exfiltrate
    it.


    Senator Mike Rounds said on 25 May, just five days earlier, that there were major
    issues with beef packers controlling prices. He said, ‘Consumers are paying way
    too much for beef at the grocery store. Meanwhile, our independent cattle producers—who
    we rely on to feed the world—are going broke’. Between the consumer and the'
  - '[PAGE 179]


    producer sit four large beef packing companies that control over 80% of the processing
    market. These four packers seemingly can control prices at their will, and thus
    have realised significant profits, while both the US beef consumers and independent
    cattle producers pay the price. Mike Rounds went on to say, ‘The time has come
    to fix this. We are launching a bipartisan, nationwide effort to defend our consumers
    and cattlemen. We have announced that we will be sending a letter to the Department
    of Justice asking them to examine whether the control the meatpackers have of
    the beef processing market violates US antitrust laws. We are asking members of
    Congress—House Senate, Republican and Democrat—to support this effort’. Within
    a week JBS Foods suffered a cyberattack. I am sure it is just a coincidence; however,
    many do not believe in such things.


    The institution that is McDonalds may be adversely affected should the situation
    not be remediated quickly, and a long time veteran red meat processor told Beef
    Central that prices were expected to see a slight rise depending upon the duration
    of JBS’s outage. He also said ‘Nobody could have foreseen this coming, but it
    represents a problem of incredible proportions for the company’. To be candid,
    the red meat processors, along with the JBS Foods Executive team, are not in the
    field of IT security, or it would have been very easy to foresee this event and
    many more occurring. There is a major consideration for shorting a company, an
    organisation that remains insecure, as that price will certainly be affected if
    and when they suffer a cyberattack. Look at the last chapter: when a company has
    a general erosion of their security position connected to the Internet, immaterial
    of whether it was by design or default (complacent or complicit), that company
    is going to be infiltrated, and all our research shows that it will be when the
    company has declining and insecure Internet security. This is an interesting theory
    and one that we have tested hundreds of times. One must only consider supply and
    demand, prices, and behaviour during the weeklong Colonial cyberattack to realise
    the repercussions of such events.


    No matter what company you are with or what sector you work in, car manufacturing,
    accounting, legal, banking, insurance, Critical National Infrastructure, water,
    food, energy, or a plethora of others, like it or not, you are also effectively
    a technology company. That has implications from years ago: sending a fax that
    became an email,'
