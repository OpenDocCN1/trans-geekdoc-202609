  - '[PAGE 64]


    and exploitable, surely is gross negligence and complicit? With all the expertise
    and advice from these ‘Trusted’ organisations, leaders, and experts surely cannot
    be anything other than by design?


    On 11 May 2021, a Ransomware group known as Babuk leaked internal files from the
    Washington Police Department (MPDC) from a cyberattack and ransom demand in late
    April the month before. The data released included PII data of both officers and
    criminals, and their Social Security numbers, credit history, addresses, and contact
    details. In addition, the leaked documents included polygraph tests, social media
    posts, employment history, financial liabilities, and copies of officers’ driving
    licences. Negotiations had broken down between Babuk and the MPDC. Being a Law
    Enforcement Department, it was decided paying a Ransomware demand was not befitting
    the organisation, which is perfectly correct, especially knowing that any ransoms
    paid would fuel further criminal activities; the term ‘Own Goal’ springs to mind.
    The FBI were quoted at the time as saying: ‘We do not support paying any ransom
    as payment does not guarantee any organisation would receive their data back’.
    It would also be seen as encouraging adversaries to target more victims and increase
    overall cyberattacks and Ransomware. The FBI suffered their own digital intrusion
    in November 2021 when 100,000 FBI emails were sent to unsuspecting recipients.
    The emails certainly came from the FBI servers, just not sent by anyone in the
    FBI. The FBI had lost Command and Control of their own servers (Mail Exchange
    (MX)) due to maintaining Insecure subdomains that were hacked.


    Once again, we launched our own research and investigation into the MPDC’s Internet
    security and immediately found a sub optimal Rating of F and 0 (very nearly the
    title of this book: F0) and alerted the department accordingly. At the same time,
    we wanted to understand why such a situation had been allowed to manifest itself
    and why they lacked the ongoing control and management that any Law Enforcement
    Department should have. Why would the MPDC leave their departmental doors open,
    systems logged in, and unrestricted total free and unrestricted access? Of course,
    they should not, yet that is exactly what they had done via their easily exploited
    insecure Internet connections. We wanted to research and look further. We added
    other major Law Enforcement Departments'
  - '[PAGE 65]


    including the NYPD, LAPD, Chicago, Philadelphia, Houston, Cook County, LA County,
    Pennsylvania, and Dallas Law Enforcement Departmental domains. All, apart from
    Chicago, who scored a D+ and 40/100, still far from an A Rating, had woeful Ratings
    of F. … That meant all these Law Enforcement Departments had the same, totally
    exposed, vulnerable, and exploitable position as the already breached Washington
    Police Department, America’s Federal Capital Department. Be afraid, be very afraid.
    In December 2021, the Police UK Police National Computer (PNC) was hacked and
    the data of 13 million UK people, mainly criminals or certainly within the criminal
    system. The hack was blamed on an earlier attack at NDItech, a UK technology company
    who boast they look after a large percentage of the PNC. In October 2021, they
    had themselves been hacked due to suboptimal basic security and Police UK pointed
    the finger at them. When we supplied reports to the Chief Commissioner and the
    Home Secretary after being requested as experts to look at the City of London
    Police’s website security, they had closed some down, the reports were so damning
    that we were marginalised, ostracised, and ignored. These reports will be made
    public soon.


    The above situations are incredibly damning and must be a major concern for every
    US Senator, Mayor, Police Officer, and indeed Citizen. For the country’s Capital
    Police Department to be so easily attacked and data exfiltrated shows just how
    poor security is and, given our research, must act as a warning of things to come.
    When Law Enforcement, Country Courts, the US government, and even the US Treasury
    can be breached, it shows the systemic failing of the government and each department
    to secure their data and enable day-to-day business to be conducted. As I have
    mentioned before, the Biden Administration have this week announced a further
    $500 million to be allocated to cybercrime; however, one cannot help but wonder
    who the criminals really are. One thing for sure, when, and if the dust settles
    and the grey suits start legal proceedings and Class Action Lawsuits for gross
    negligence against these organisations, the Cyber companies with their backing
    and orders from the US government, mostly led by ex-Agency staff and many invested
    in by Thoma Bravo and others, will more than likely continue banking vast sums
    of monies but frequently failing to offer any additional security. In fact, many'
  - '[PAGE 66]


    are increasing the exposure of their clients. Thoma Bravo are major investors
    in several very high-profile Cyber Companies that all have been breached in the
    last two years. Am I cynical? Not by nature. Am I trusting? I certainly was until
    the last several years. Am I disappointed with the government and their Intelligence
    Agencies? I am, unequivocally disgusted.


    When I was ‘selected’ and invited to be the CEO of Cybersec Innovation Partners,
    I thought, no problem, we take on the bad guys; I have broad shoulders, am smart
    and very streetwise. I never thought for one minute that the so-called good guys
    would soon thereafter want to literally blindfold me and metaphorically tie my
    hands behind my back. I did not stop to think for a moment that when we discovered
    Russian and Chinese presence and infiltration in UK-based Critical National Infrastructure
    along with a plethora of revoked, expired, illegal, and sanctioned digital certificates,
    they would tell the Board to ignore the findings as if they had never happened.
