  - '[PAGE 11]


    # Preface


    It is not the strongest that survive—it is those who are the most adaptable. In
    the world of Ransomware and cybercrime, we are witnessing an unprecedented shift
    in terms of both power and flexibility by our adversaries. The digital world and
    consequently the entire world’s weaknesses and vulnerabilities are being laid
    bare by the very same digital tools designed to confirm security. OSINT (Open-Source
    Intelligence) technology, often free, is being used to identify exposed and exploitable
    domains and subdomains that lack controls, management, and security. Throughout
    history, what was designed and developed for offensive capability and used in
    warfare could also be used for defensive capability.


    It is fair to say the odds are most certainly stacked against us currently; however,
    we, as a profession and as a race, are doing very little to change this position
    and continuing to ignore the facts right in front of us. The result of this is
    Ransomware and cyberattacks on a level that is a challenge to keep track of, let
    alone fight against with any real gusto. Furthermore, because of that continued
    lack of domain security, even post-breach and even after the root cause has been
    identified, all attempts to improve the already sub optimal and insecure position
    are futile. As soon as new devices, laptops, servers, and so on are connected,
    they can be immediately compromised.'
  - '[PAGE 12]


    With near mass hysteria and daily breaches being confirmed, many companies, sporting
    events and situations that resulted in mass gatherings were stopped because of
    the COVID-19 pandemic. However, that also created and added to an already woefully
    insecure position and presented many major opportunities and challenges, not least
    of which was Remote Access that exacerbated today’s already insecure positions.


    With the opportunity of staff working from home and remote locations, connecting
    via unsecured connections and receiving many spoof, malicious emails confirming
    what to do re COVID-19 and so on, many of those messages were unknowingly carrying
    Malware code (Trojans) and gaining deep-rooted access to more enterprises. The
    German government was caught out to the tune of 100 million Euro in a two-week
    period by a spoof, copycat website that collated then claimed COVID-19 financial
    support and the German Government, unknowingly obliged paying the monies to cyber
    criminals instead of real claimants and people that required financial support.


    The losses just keep increasing. Last year Travelex owner Finablr, which had its
    Initial Public Offering (IPO) in May 2019 for around $3 billion, suffered a breach
    in December 2019, just months later, were placed in Administration under Price
    Waterhouse Coopers (PWC) in April 2020 and then sold for $1 in December 2020.
    This shocking tale should serve as a major alarm bell (Klaxons) of just what can
    happen, and how quickly. I suspect no Risk Management could never predict such
    a situation, and also I suspect a lot of Investors had plenty to write off...
    British Airways (BA) also announced major changes to avoid collapse following
    their data breach of nearly 0.5 million and an original ICO (Information Commissioner’s
    Office) fine of £128 million.


    We know company’s worth $billions will have associated costs with revenues of
    around 70%. Many other companies will be trading with massive deficits for some
    period following COVID-19; many will simply cease trading.


    In discussions and following research within the cyber insurance sector, it became
    very apparent that Insurers are seemingly quite happy with their lot; however,
    in the last two months both CNA and AXA have suffered breaches, highlighting their
    own insecure positions. CNA went on to pay $40 million in ransom. These Insecure
    positions both organisations seem to be content to ignore and continue'
  - '[PAGE 13]


    to maintain. However, can they really fail to understand the math of business?
    The cyber-insurance market is predicted to increase to over $200 billion; however,
    when laid over the total of predicted losses of $6 trillion in 2021 and predicted
    to surpass $10 trillion by 2025, there is a clear, massive gulf between the two
    figures.


    For example, Company A has revenues of $1 billion. From that $1 billion, 35% will
    be used to pay staff ($350 million). A further 25% will pay overhead, buildings,
    and general day-to-day costs ($250 million). A further 10% will be needed to be
    used to pay for technology, security, and potential losses. Leaving capital adequacy
    aside for one minute, that leaves a total of 30% or, in the case of Company A,
    $300 million before any taxes.


    Now consider Company A is a cyber insurance underwriter and they have total revenues
    of $1 billion. If total claims ever exceed the aforementioned 30%, that is, $300
    million, they are trading at a loss. Let us not forget they are in business to
    make a profit and must be able to prove capital adequacy for such situations that
    might arise. It is quite a fine balance for sure and may be a major reason for
    AXA in France confirming they will no longer ‘guarantee’ customers that they will
    meet Ransomware settlements a week before being breached themselves by Ransomware…


    Any way you look at it and regardless of how many companies will ‘share’ the annual
    accumulated losses, many companies will simply be unable to survive these losses
    and can do one of two things. Leaders can either prepare for their company’s demise
    or proactively better prepare to prevent being attacked and the substantial losses.
    When it comes to Critical National Infrastructure, Healthcare, and Financial Services,
    there should not be an option; however, there is still so much ignorance of real
    security, and even the plausible deniability card is still played.


    There are two types of companies, just as there are two types of leaders: those
    that want to make a difference in the medium to long term and those that want
    to make an annual bonus and take their leave at the appropriate time. You can
    see which is which on both counts and in many companies.


    It is fair to say that unless you know or can see what you are trying to protect,
    you might just as well be at war wearing a blindfold and without the right tools
    to protect yourself or indeed the business.'
