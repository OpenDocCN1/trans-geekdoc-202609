    suffered a cyberattack. Due to an Insecure subdomain and server, the server, more
    than likely an MX was taken over. One hundred thousand FBI emails were sent out
    to unsuspecting recipients. The FBI themselves did not send the emails, however,
    FBI servers were used to send legitimate FBI emails as if they had. Phishing attacks
    can be used as part of a larger attack and use deception to encourage sharing
    information or to make payments urgently to avoid further issues. Avoidance of
    Phishing attacks can be down to internal organisations’ training and diligence,
    however, insecure Domain Name Systems can be used to gain backdoor access and
    take over servers as was, we believe, the case above. There are several Phishing
