  mdcn: '

    关于安全问题。即使我们曾将相关信息和担忧“赠送”给了纽约市长办公室、交通局和MTA，他们也毫无作为，随后不久便沦为网络攻击的受害者。美国的立法者和法律专业人士需要追究责任人的责任；遗憾的是，如今有太多人喜欢打受害者牌，而且把责任推给网络安全保险提供商、自己扮受害者的做法竟被广为接受。除非全球范围内的态度发生根本转变，否则一切都不会改变。


    此外，本周，轮船管理局（Steamship Authority）成为最新遭受攻击的受害者。他们在网站上认真对待自己的沟通能力，向公众通报了事件经过。然而，他们的沟通能力显然远强于其安全能力，因为与之前的许多受害者一样，他们对自己为何成为网络攻击受害者几乎一无所知。昨天快速看一眼他们的地址栏就会发现，他们公然向全世界宣告自己是一家旅游公司，对互联网安全一无所知，而地址栏中赫然显示着“Not
    Secure”（不安全）字样，这恰恰证实了这一点。在安全领域，这是最低级别的基础安全。这不仅使他们成为攻击目标，而且几乎可以保证他们会遭到渗透、破坏和勒索赎金。就像最近佛罗里达州一名十七岁学生几乎无意间导致145所学校因网络攻击而关闭一样，这类攻击会持续密集地袭来，而且绝对不需要国家支持。所有这些组织和学校的域名都保持着F级（不及格）安全评级，很容易被识别和利用。这里是勒索软件和网络罪犯的糖果店：尽管没人理会，你尽管往袋子里装；但天哪，每个人都乐于将自己的疏忽和无能归咎于他人。


    美国企业界就像一只坐以待毙的鸭子，在互联网安全得到1)承认和2)优先处理之前，这种情况将持续下去。我们此前曾大力协助MITRE CWE、NCSC、FBI、CISA以及众多其他机构。互联网安全必须切合实际并成为主流，否则美国企业界和世界其他地方将继续遭受损失。


    本周晚些时候，我们收到确认，Scripps Healthcare宣布他们支付了勒索赎金。快速调查证实，Scripps过去和现在都保持着欠佳的互联网安全状况。他们的F级和0分评级与安全登记记录一样糟糕。F可以代表失败（FAIL）；也可以代表别的东西。如果你正在维护、存储、共享或接收PII数据，并且需要确保这些数据的安全，那么如果你的安全评级是F，你极有可能会被……了。


    看到MTA这样的组织成为网络攻击的受害者，我们并不感到高兴。说“我们警告过你”对任何人都没有帮助，然而，我们确实在六个月前就警告过。……当心缝隙。


    遗憾的是，由于Colonial的互联网安全评级仍然是F和0，而且我们现在知道了在PKI层面，渗透期间发生了什么或被植入了什么，我认为Colonial以及许多其他被打得措手不及并继续忽视自身安全的公司，将不止一次、可能多次遭到入侵。除非他们最终采取必要行动来解决和纠正这种不安全状况，否则一切都不会改变。


    JBS Foods的许多工厂面临立即停工，攻击前一天宰杀的牛只留下的数千头冷冻胴体也面临困境。问题不在于给胴体去骨的实际工作，而在于现在必须手工完成的记录工作。据信，这种更慢的手工流程将影响没有计算机系统的装运单据、标签、库存和记录。因此，最终装箱的肉类很可能只能供应本地市场。大量由JBS
    Foods供货的超市巨头Coles已经在寻找其他供应商。此类网络攻击带来的连锁反应将极难估量。


    在听到JBS Foods遭受网络攻击的消息后，我们的研究几乎在几分钟之内就展开了漏洞搜寻。不久，我们就发现JBS Foods的多个主页被评为F级和0分。该网站与所有国际域名相连，本可以（也很容易）被用来在网络其他部分横向移动，就像SolarWinds和Colonial所遭遇的那样；SolarWinds和Colonial过去和现在的互联网安全评级都是F和0，这绝非巧合。现在，要么是无能和疏忽已经到了极其巨大、骇人听闻的地步，要么就是有人在助长这种情况。正如我经常问的那样：是自满还是同谋？我们知道（每个人都应该知道，尤其是在安全或IT领域），互联网多年前就被武器化了；它支撑着全世界所有的计算功能，除非你控制并管理好那扇名为“安全”的单向阀，否则它就像一个双向阀。信息和数据不应让任何想看的人都能看到，也不应让任何愿意违法窃取的人拿走。


    参议员迈克·朗兹在仅仅五天前的5月25日表示，牛肉加工商存在操控价格的重大问题。他说：“消费者在杂货店为牛肉付出了过高的价格。与此同时，我们赖以养活世界的独立养牛户却濒临破产。”在消费者和生产者之间，有四家大型牛肉加工公司控制着超过80%的加工市场。这四家加工商似乎可以随意控制价格，从而获得了可观的利润，而美国牛肉消费者和独立养牛户则为此买单。迈克·朗兹接着说：“现在是时候解决这个问题了。我们正在发起一项两党合作的全国性行动，来保护我们的消费者和养牛户。我们已经宣布，将向司法部致信，要求他们调查肉类加工商对牛肉加工市场的控制是否违反美国反垄断法。我们正在请求国会成员——众议院、参议院、共和党人和民主党人——支持这一努力。”不到一周，JBS
    Foods就遭受了网络攻击。我相信这只是一个巧合；然而，很多人并不相信这类事情。


    麦当劳这一品牌如果局面不能迅速得到补救，也可能受到不利影响。一位长期从事红肉加工的资深业内人士告诉Beef Central，预计价格会小幅上涨，具体取决于JBS停运的持续时间。他还说：“没有人能预见到这一切会发生，但对该公司来说，这是一个极其巨大的问题。”坦白说，红肉加工商和JBS
    Foods的高管团队并不从事IT安全领域，否则很容易预见到这一事件以及更多类似事件的发生。做空一家仍然不安全的公司有一个重要考量：一旦他们遭受网络攻击，其股价必然会受到影响。请看上一章：当一家公司的互联网相关安全状况整体恶化时，无论这是有意为之还是默认如此（自满还是同谋），该公司都将遭到渗透，而我们所有的研究都表明，这种情况会发生在该公司互联网安全评级不断下降且不安全的时候。这是一个有趣的理论，我们已经测试了数百次。只需想想Colonial遭受为期一周的网络攻击期间的供需、价格和行为，就能意识到此类事件的后果。


    无论你就职于哪家公司，无论你在哪个行业工作——汽车制造、会计、法律、银行、保险、国家关键基础设施、水务、食品、能源，还是其他众多行业——不管你喜不喜欢，你实际上也是一家科技公司。这一点从多年前就有所体现：发送一封从传真演变而来的电子邮件，

