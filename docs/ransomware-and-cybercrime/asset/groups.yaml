    当如今已广泛蔓延的医疗保健攻击被部署时，我们对每家成为勒索软件攻击受害者的公司深表同情，并希望各国政府能更认真地对待此类攻击和破坏。发布行政命令，向那些自身并不安全的朋友和家人的网络安全公司扔出数十亿美元，却期待不同的结果，这简直是愚蠢至极。当务之急是承认那些被利用和操纵的访问途径，即互联网连接，然后加以解决。我们的建议是，就像公路上的司机一样，如果你不安全、不可靠，并威胁到其他驾车者，你就不允许上路。互联网是我们的数字高速公路，需要更好的管控。比如，像
    SolarWinds 这样的公司需要被保护免受自身之害，这难道真的很离谱吗？如果搜索引擎公司不再只是在地址栏显示“不安全”（Not Secure），而是直接停止所有搜索功能和访问权限，那肯定能保护
    SolarWinds 及其所有客户吧？我们肯定会看到行为上的改变，因为互联网被许多人视为其业务的生命线，如果他们知道自己无法再交易或拥有数字存在，他们肯定会在安全上集中精力；这绝对值得深思。


    2020 年上半年，约有 80 亿人的个人身份信息（PII）数据遭到泄露，相当于地球上每一个人。再加上数字身份盗窃、非法个人贷款、债务，甚至更糟的是，有组织犯罪因数据窃取而持续多年索赔，你能数出数十亿又数十亿美元。演艺界有句名言：“好戏还在后头”，而我担心我们正在进入网络世界的这个阶段。网络罪犯像农民一样行事，收割能产出的庄稼并加以培育，然后再回来进行下一轮收割，以确保可持续性；问题是我们没有用类似的防御策略来保障安全。我们跨多个领域（政府、教育、军事、医疗保健等）的研究表明，基础安全普遍缺失。国家网络安全中心（NCSC）拥有
    B+ 评级和 80 分，却满足于让比如说 Mersey Rail、easyJet 或 Travelex 保持 F 评级和 0 分（全部已被攻破），这并非没有原因。本章留给读者的问题是：为什么美国国家安全局（NSA）、NCSC、英国政府通信总部（GCHQ）以及美国和英国政府不强制执行一套与互联网连接相关的安全机制？如果任何人有与我们不同的答案，请随时给我发电子邮件。


    ## 不是因为目标定得太高，而是定得太低并且实现了


    我们经常听到这样的话：每个人都应该准备好自己的数据被泄露、窃取和滥用，而这话竟出自我们自己的政府之口。本章标题非常贴切。还有一个可悲的事实是，我们自己的政府由于攻击目标缺乏知识和能力来确保互联网安全的位置，很高兴地滥用职权渗透其他组织和政府。同样值得质疑的是，尽管存在利益冲突，美国、英国和其他政府为何没有对大众进行互联网安全教育——他们终于这么做了，而且我们被很多人告知，信息共享的方式带有我们工作和努力的痕迹和指纹。


    上周末，我们决定研究一些业内最知名的机构，看看他们究竟有多重视互联网安全及其客户的安全。两个主要组织是互联网安全中心（cisecurity.org）和信息系统审计与控制协会（ISACA）。


    cisecurity.org 的网站上写道：


    > 互联网安全中心（CIS®）通过我们在协作和创新方面的核心竞争力，让互联世界对个人、企业和政府更加安全。

    >

    > 我们是一个由社区驱动的非营利组织，负责制定 CIS Controls® 和 CIS Benchmarks™，这些是全球公认的保护 IT 系统和数据安全的最佳实践。我们领导着一支由
    IT 专业人员组成的全球社区，持续改进这些标准，并提供产品和服务以主动防御新兴威胁。我们的 CIS Hardened Images® 在云端提供安全、按需、可扩展的计算环境。


    CIS 是多州信息共享与分析中心®（MS-ISAC®）的所在地，该中心是美国州、地方、部落和领地政府实体在网络威胁预防、保护、响应和恢复方面的可信资源；同时，选举基础设施信息共享与分析中心®（EI-ISAC®）也设在这里，支持美国选举办公室快速变化的网络安全需求。


    CIS 表示，他们的愿景是引领全球社区，保护我们不断变化的互联世界，他们的使命是：


    > 通过开发、验证和推广及时的最佳实践解决方案，帮助个人、企业和政府抵御无处不在的网络威胁，让互联世界变得更加安全。


    读到这些并确实相信有这样一个由美国政府和大公司支持的主要机构，在常常令人困惑和不安全的互联网世界中提供建议并引领最佳实践，是非常令人鼓舞和欣慰的。鉴于他们的地位、身份和影响力，人们自然会认为——不必过于臆断——cisecurity.org
    无疑会安全地连接到互联网。可悲且相当尴尬的是，他们并没有。我们昨天研究了 CIS 并给他们写了信，同时抄送了一份给 CISA，确认 CIS 的安全评级为 F，得分为
    0。换句话说，他们的评级和得分已不能更差了。2016 年 6 月，CIS 的评级还是健康的 B 和 70 分；随后在当年 9 月，跌至 D 和 30 分；最后在
    2020 年 8 月，一路跌到 F 评级和 0 分。这一评级和得分是缺乏 HSTS 头、重定向问题、第三方内容、不安全的编码问题以及 X-Content 和
    XSS 问题直接导致的结果。再次确认，F 评级和 0 分是互联网安全方面最差的评级和得分，而这正是互联网安全中心，成千上万的组织和政府所依赖的，毫无疑问还掌握着海量客户数据。


    我们写信给 CIS 首席技术官，并附上了我们研究和发现的截图，正在等待回复。


    然后我们看了 ISACA。ISACA 代表信息系统审计与控制协会。他们的网站上写道：


    > 安全以及 ISACA 的声誉。


    我收到了关于这些信息的回复，并被告知她会转达。就在这时，我收到了以下消息：“好吧，如果你想向 ISACA 推销东西，别从董事会成员开始。”当时我（在一个银行假日星期一）回复道：“Tracey，请随意完全忽略我与你分享重大关切的努力。这对我无所谓，因为我是以专业人士的身份联系你并发出提醒。如果
    ISACA 选择无视，那完全没问题。致以最诚挚的问候，Andy。”今天上午，我又收到一封电子邮件，上面写着：“你的营销努力可不太积极，Jenkins 先生。”我不明白为什么这位董事会成员总能把我的名字搞错（我姓
    Jenkinson），或者认为我在搞营销活动。把这一点放在大背景下看，ISACA 的糟糕安全评级与我们过去两年研究的所有被攻破后的公司完全一样，包括 SolarWinds、许多州、Bose、加拿大邮政、加拿大政府、巴西政府，以及其他数百家机构。


    2015/2016 年，特工 Adrian Hawkins 花了六个多月试图通知美国人事管理办公室（OPM）他们正遭到入侵，但没人理会；直到在离 Hawkins
    特工工作的 FBI 办公室 1.2 英里外的一次会议之后，这次入侵才被认真对待。在这次入侵期间，公认的事实是，每一位军人和女性军人的详细信息都被窃取了，包括所有现役和既往通过安全审查人员及其家人的
    PII 数据。


    上周末，CISA 的战略主管也联系了我（就像 CIA 多了一个 S，就像 Google 在 2018 年为安全在 HTTP(S) 中加了一个 S 一样）。她问我是否能帮他们“吸引最优秀的人才”，我回答说，我担心你们并不想要最优秀的人才，你们只想要听命于你们的人。我收到的回复称，要求是：“在维持现状的同时推动内部机构强化群体思维，这是行动方式。我需要像你这样的人来传播这个消息，吸引那些能让
    CISA 变得更好的候选人。”


    在美国总统大选前夕，我通过电子邮件发送了多份关于我们对全美 50 个州研究的报告，这些报告显示每个州都存在系统性的基础安全缺失，特拉华州最为严重；另外还有一份关于教育的报告，以及一份关于医疗保健的报告。

