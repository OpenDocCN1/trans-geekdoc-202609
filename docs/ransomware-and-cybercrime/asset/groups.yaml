    easyJet are not addressing or improving the protection of the company or, more
    importantly, their customers, and the current vulnerabilities can easily be further
    exploited. Surely this is just an unfortunate coincidence: the wider Industry
    has witnessed these lessons and have learnt from them; I hear you cry?


    We have been asked to act as expert witnesses in several cases to evidence security
    failings and provide hard evidence of the same. As a Security professional, it
    grates on me that so-called security experts simply do not do what they know or
    should know and then overlook, forget, or ignore the basics. I have been known
    to say on many occasions that it is far simpler to prove security negligence than
    it is to get a company to listen to sound advice and take basic security measures.
    It makes no sense whatsoever to leave such exposure. Once again, it begs the question,
    complacent or complicit? Security professionals should not compromise the basics;
    if they are asked to ignore the basics or leave the business exposed, they should
    be strong enough and confident enough, let alone experienced enough, to refrain
    from doing so and ensure the basics are done. Any failure to do so is a mark on
    their ability and character.


    In the first week of March 2021, just several weeks ago, SITA (Star Alliance)
    suffered a cyberattack which affected numerous other airlines. Again, this attack
    was also termed Sophisticated, which is for two main reasons:


    - it sounds a lot better than ‘we left the digital doors wide open and totally
    ignored basic security’, and

    - Insurance companies and Regulators seem to be more lenient when the term ‘Sophisticated’
    is used.


    … You will never hear the following no matter how true it is: ‘We were negligent
    and complacent; we simply did not do our jobs properly’.


    The Travel Industry in the United Kingdom in 2019 saw 93.1 million visits overseas,
    meaning 93.1 million people completed PII data forms and trusted the travel providers
    to ensure that data was secure. Many countries and companies are totally reliant
    upon tourism; however, like the row of dominos or the house built of cards, they
    can tumble one by one or all at once. The Travel Industry, like Healthcare, MNOs
    (Mobile Network Operators), and many others, simply do not have anywhere near
    enough focus, or skill so far as security is concerned and yet are targeted day
    in day out and maintain insecure positions. It is simply inevitable that breaches
    will occur.


    We then looked at Malaysia Air, who were breached in March 2010 and remained totally
    exposed until June 2019. With our recent research and findings, we would suggest
    they still are very much exposed. You may notice a common theme of F Ratings and
    0 scores for airlines’ Internet-facing homepages. These are the websites tens
    if not hundreds of millions of customers land on that are clearly frequently targeted
    successfully to launch attacks such as Shadow sites, water hole attacks, man in
    the middle, or even domain takeover. What is clear is that the companies themselves
    are guilty of not taking security seriously, and all the time the taxpayers bail
    them out: so, what? The fine from the ICO was ultimately pathetic and set the
    trend for what we witness constantly, which is systemic insecure positions, rendering
    the airlines insecure and breaching all data privacy acts. I am hopeful the Class
    Action Lawsuits will hold these organisations to account and responsible for their
    negligence. I would urge the Civil Aviation Authority to launch investigations
    into the lack of security as well as the wider Aviation Authorities. They may
    wish to address their own also, as their homepage has serious security vulnerabilities.


    What is deeply disturbing is: at what point will an Executive Order or the NCSC
    stop the charade and start encouraging companies to realise the critical importance
    of taking security of their Internet connectivity seriously, as opposed to simply
    having it manipulated? When a company such as UKTech, UK Finance, and Critical
    National Infrastructure/nuclear power organisations ignore our Actionable Intelligence
    with evidence of insecurity, Chinese and Russian infiltration because GCHQ suggested
    it did not matter, something is seriously wrong. For the avoidance of all doubt,
    our goal, that is, as an individual and as an organisation, is to make companies
    more secure and to address the grossly overlooked insecurity of thousands of companies,
    companies that are being breached day after day. I guess the NSA’s and GCHQ’s
    goals must differ from ours; there certainly seems to be a major disparity.


    Maybe taxpayers need to lend more money to the airlines and spend more on the
    agencies so they can address security…


    United States that also fell ‘victim’ to Ransomware attacks. Atlanta, Baltimore,
    Denver, Knoxville, New Orleans, and Alaska for a third time all fell victim to
    cyberattacks, and all have incurred massive costs in addition to ransom payments.
    In July 2019, the US Conference of Mayors unanimously passed a resolution calling
    on local officials to stop paying Ransomware demands to cybercriminal gangs who
    were infiltrating and taking over their Networks. However, despite that resolution,
    many Cities have paid huge ransom demands after being faced with the extortion
    or exposure of highly sensitive and important data and after being threatened
    with the data being made inaccessible or publicly available. Addressing the symptoms
    rather than the cause seems to be a favourite pastime.


    We researched many of the States, Tulsa being the most recent, and found a plethora
    of outdated technical systems, countless CVEs, along with insecure domains connected
    to the Internet. Even if we spent weeks forensically pinpointing the access point,
    that would be seriously hampered by the sheer number of accessible and easily
    infiltrated access points. So bad is the Network and Internet-connected security
    of local governments that the easily accessible entry points would make the task
    near impossible. Furthermore, Tulsa is far from a one-off; it is a systemic issue
    and national tale of insecurity across many States and includes the US government
    itself. It was only a few months ago that we notified the White House and the
    then-President of the United States, Donald J. Trump, that both had insecure domains.
    Donald Trump had several, in fact, as part of his digital re-election campaign
    and was collecting donations (and PII Data) on totally Not Secure domains. This
    was poor form and broke numerous Privacy laws and regulations on the collection
    of said PII data. Both positions and numerous insecure domains still exist. Hardly
    surprising, some of Donald J. Trump’s domains suffered cyberattacks, taking the
    domains offline for a day.


    Websites are simply not a fit and forget; they need controls and constant management,
    or they will bite, and bite hard. In most cases, from Amazon through to the White
    House, from a SolarWinds to Blackbaud or Codecov, organisations get online and
    simply take a flyer; they rarely ensure their websites are secure, even sometimes
