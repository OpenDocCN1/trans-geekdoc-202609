    and economic future.


    In late 2019, New Orleans were hit by a Ransomware attack that followed a similar
    attack on the state of Louisiana. Mayor LaToya Cantrell declared a state of emergency.
    The attack started on Friday 13 December 2019. All systems were shut down under
    the city’s NOLA Cyber Security defence program, as literally all government employees
    were told to unplug their devices and disconnect from the Wi-Fi. It was confirmed
    that the city’s cameras were still recording, so incident footage could be used
    if required. Fire and police departments were able to respond to phone calls.
    Only weeks prior to this attack, the FBI had alerted local governments, states,
    and cities of increased cyberattack activity, especially against healthcare, commerce,
    and transportation. There had been two major breaches in the United States within
    the transportation sector. This attack followed an earlier attack in November
    against the state of Louisiana. On 23 August 2020, government agencies were taken
    offline by a cyberattack in the state of Texas. Without question, US municipalities
    were in the firing line and being targeted. Of course, it is easy to believe what
    the motive may be; however, the obvious root cause is constantly being overlooked
    time after time. Because of that oversight, the root cause remains vulnerable,
    exposed, and exploitable after $millions, quite possibly hundreds of $millions
    have been wasted, and it is not easy to understand why.


    Unequivocally, Ransomware gangs are now more brazen than ever, along with increasing
