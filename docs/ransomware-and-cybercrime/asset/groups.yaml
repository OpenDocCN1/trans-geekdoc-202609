    这种情况仍在延续，甚至愈演愈烈。正如保罗·中曾根（Paul Nakasone）在参议院委员会上所言：“我们的对手并不惧怕我们。”鉴于我们频繁的研究和发现，“从婴儿手里抢糖果”这句话不禁浮现在脑海中。


    此外，当那些由美国国防部（DOD）、国土安全部（DHS）、RTF、MITRE CWE 以及成千上万其他机构支持的组织，心安理得地维持着欠佳的安全状况时，它们不仅让自己成为攻击目标，而且是一个极易被利用的目标。当这种情况出现时，我们经常建议客户——尽管这可能令人不适——要追问：这次攻击究竟是因为某人自满，还是有人同谋？比特币和其他数字货币与区块链相结合，提供了一定程度的匿名性，人们根本无法确定谁才是好人，谁又是真正的坏人。安全确实是一种选择，就像吸烟、酗酒或鲁莽行事一样。域名安全至关重要，却被系统性地忽视，在一个又一个行业中被忽略。勒索软件和网络攻击是一种自我实现的预言。勒索软件很少是复杂高明的，却总是被这样描述，以掩盖无能和自满。现在是时候直言不讳了，否则就真的太迟了。


    有两种截然不同的方法可以降低成为网络攻击和勒索软件受害者的几率。第一种在当今的数字世界中简直不可想象，那就是把所有设备都从互联网上断开，回到纸笔时代，直接面对面交流。另一种则是确保组织控制并管理面向互联网及相连的安全。问问自己：为什么大多数机构都认真对待这一领域，并基本覆盖了这一关键领域的安全？它们太清楚不过了，这是远在千里之外的对手的第一个入口；那根细细的网线连接会惩罚任何忽视其域名/服务器安全的人。我们在上一本书中探讨了几起由于不安全而导致的政府网络攻击，而在本书中，我们还将审视几起勒索软件攻击。读到最后，你将会震惊、难以置信，甚至可能对我们政府20年前发起并一直在做的、旨在阻止这种下滑螺旋和轨迹的事情感到些许偏执……


    ## 不安全，F 和 0...


    > （某家十亿美元级网络安全公司的首席信息安全官，2021年5月20日，在经历了包括 SolarWinds 在内的多次网络攻击之后所言）


    于是，我让我的漏洞研究团队去检查了一下。不到一个小时，他们就给我发来了属于该公司的十几个不安全域名。更糟糕的是，还有不安全的登录域名、传输层安全（TLS）证书不匹配的域名、TLS
    已过期的域名，以及配置错误的域名。


    出于职业礼貌，我在英国时间 23:00 给这位首席信息安全官发了两张截图，向他们展示这些发现。对于第一张，他们回复说：“谢谢，幸好那只是一个客户演示站点”，言下之意是它不涉及数据或安全风险。对于第二张，那是一个公司视频会议用的不安全域名，数百名公司员工经常使用，而且完全暴露在中间人攻击之下，但他们没有发表任何评论……


    我们听到过很多借口或理由，试图说明维持不安全域名没什么大不了；但事实绝非如此。任何属于公司的域名，如果被放任自流，依赖过时的 TLS 证书，往好里说，也是在向所有查看的人表明该公司缺乏互联网安全控制和管理能力。同样被忽视的是，网络犯罪分子正在扫描互联网，寻找评级为
    F 和 0 的网站，将其加入目标列表并发起攻击。简而言之，一个不安全的网站能说明一家公司的整体安全状况和能力。如果它连互联网接入都是不安全的，那么内部安全也好不到哪里去。同样，正如
    SolarWinds 事件清楚地告诉世人的那样，通过一次域名劫持和接管，再加上一些横向移动，就可以将 Sunburst 恶意代码植入数字证书，进而入侵数千家公司。……
    不清楚人们到底是不理解“数字门户大开”的哪一部分，还是不知道如何保护它；然而，我们的研究在全球领先的保险公司（包括网络保险公司）、金融服务监管机构、中央银行，甚至我们自己的
    GCHQ 和 NCSC，以及唐宁街10号都发现了同样的情况。


    让我们暂时考虑一下实体场所。假设是同一家公司，就是前面提到的那家网络安全公司，拥有的是实体场所而不是域名。他们会不会同样只确保其中二十几个场所安全上锁、装好警报器？或者他们会说自己只锁了二十几个？当然，他们会把所有的场所都锁好。然而，当涉及他们的数字化在线、24×7
    全天候域名时，似乎就无所谓了。这种糟糕的观念和自满情绪，正是网络攻击不断发生且未受挑战的原因。


    在每个网站的地址栏中，你都会看到 www.example.com。在它前面，你会看到一个挂锁图标，确认 TLS 证书有效，并且使用了最新的 HTTPS 协议。如果不是这样，则会显示“不安全”的文字。更复杂的是，即使显示了挂锁，也不意味着该域名是安全可靠的；它只是确认了证书的有效性。这种混淆甚至延伸到许多安全专业人士身上。让我进一步解释。我们最近通知了许多组织其整体不安全的状态，包括全球保险业领导者劳合社（Lloyd''s
    of London）。他们的首席执行官和首席信息安全官反驳说，他们使用 SSL Labs 进行过扫描，扫描发现证书有效并给出了 A+ 评级。他们不理解或不明白，一个完整域名和托管该域名的服务器是不同的，因此轻视了
    F 和 0 评级，即便我们向他们展示了与其安全相关、导致其不安全的重大关切、异常和问题（包括 cookie、代码注入、子资源影响（通常是覆盖整个网站的代码）、跨站脚本等）的证据。这两位聪明人，以及更多人，仅仅依赖于组成域名的不到
    5% 的组件，就自以为已经安全了，而显然他们当时并不安全，现在也依然不安全……我们总是说，没有


    当人们表达了对在线填写所有文件却得不到任何支持的愤怒和担忧时，真相才浮出水面。大约一半的企业主曾在那个仿冒网站上填写了他们的详细信息和索赔申请。这些数据被网络犯罪分子获取，然后被重新发送到真正的网站，只改动了一处——银行账户信息。据当时估计，在几周时间里，约有
    1 亿欧元被错误地支付给了那些利用真实个人数据提出虚假索赔的网络犯罪分子。


    这个故事绝非孤例。我们曾撰文提到梵蒂冈去年夏天遭遇入侵后其不安全的主页，以及由于 COVID-19，教会和梵蒂冈的所有信徒——即 13 亿天主教徒——在大流行期间被迫转向线上。这包括让他们了解最新信息、支持他们的信仰，当然还有捐款。梵蒂冈也落入了成千上万、甚至数百万组织都会落入的陷阱，即忽视或无视其域名的关键安全。我们研究了梵蒂冈，不仅其主页依赖过时的
    SSL 证书，而且总共 85 个网站中有 82 个也是如此。这意味着其中许多网站完全暴露、高度脆弱、极易被利用。这也意味着，由于包含个人身份信息（PII），其行为违反了《通用数据保护条例》（GDPR）的规定。由于违反
    GDPR，梵蒂冈可能被处以高达其年收入 4% 的罚款。事实上，在之前提到的情形中，德国政府也可能面临同样处罚。


    类似的情况也发生在几年前英国航空（British Airways）遭受入侵时。当时，一个非法重定向网站捕获了数据，卖掉了近 50 万张假机票——BAWays.com
    被恶意搭建了六天，英航对此毫不知情。英航最初因这次入侵被罚款 1.28 亿英镑，随后由于市场状况和 COVID-19，信息专员办公室（ICO）将其大幅削减至
    2000 万英镑。英航后来从英国政府借款 5 亿英镑。


    然后是 Travelex，由 FINABLR 所有。Travelex 于 2019 年 5 月在伦敦证券交易所上市，市值约 30 亿美元，盛极一时。12 月
    31 日，Travelex 成为勒索软件攻击的受害者。到 1 月中旬，据报道 Travelex 向勒索软件团伙支付了 500 万英镑，两周后，他们处理了其主页所依赖的过时
    TLS 证书，而这个证书正是我们……

