    will do so much more to accept being victims of ransomware; negotiate with cybercriminals;
    and make payment, often in $millions, than listen to logic and consider evidence
    even when provided free of charge. Furthermore, it is bordering on sheer arrogance
    and rudeness for organisations such as MTA, NYC, and Ritchie Torres to take the
    actionable intelligence and either take no action, as in the case of Ritchie Torres,
    or just ignore, as well as NYC and MTA, without any gratitude, acknowledgement,
    or further communication…


    > Dear Ben

    >

    > I hope you are well, and can I just say that although I am not an out-and-out
    political person, I am very sorry to see the absolute nonsense the US is currently
    going through.

    >

    > Interestingly, this week the NSA have followed our lead and taken our research
    and findings on board to release their information on obsolete TLS protocol configuration,
    we are very flattered.

    >

    > So, one of the domains that we would like to highlight is www.bt.mta.info that
    is running a Not Secure domain and has done for several months. Also, interesting
    domain hijacking, made possible due to insecure domains, was the initial infiltration
    point of December’s catastrophic SolarWinds breach, in other words the same as
    the domain we are informing you of.

    >

    > We would urge a full research and audit of all NYC domains and would be delighted
    to assist.

    >

    > Regards,

    >

    > Andy

    >

    > PS the attachment of SEPTA and STM is attached, and they were both breached
    in 2020 and both had Not Secure domains.


    Several weeks passed, and almost out of the blue, a security team member from
    MTA contacted me to ask if I could share the security ‘gaps’ they had missed and
    would I be OK to take a call. Several people were copied in the email, and to
    suit their team, the call was set up for 12 February at 22:00 UK time. I believe
    twelve, possibly as many as fourteen, people from the IT and Security team from
    MTA were on the call. We discussed our research and shared information with them
    on several of the MTA domains that were using obsolete SSL certificates, were
    misconfigured, or were using mismatched certificates which rendered the website
    Not Secure, exposed, and highly vulnerable. The situation unequivocally made MTA
    exposed, vulnerable, and easily exploitable. A lady called Valerie played the
    lead role to a great extent from the MTA side and requested further information
    in an email the following day. I duly obliged and forwarded further information
    on the same day. MTA then went silent. I followed up via email on 16 February
    and then 23 February. Not a word, not even confirmation of the intelligence shared,
    a big fat zero. Until confirmation this week of a cyberattack, several months
    after I started alerting them to their insecure and highly vulnerable position,
    which they chose to ignore. Our research post breach today, 5 June, shows new.mta.info
    is running an F Rating for Internet security several weeks post their breach.
    I emailed Ben and Valerie separately to share my displeasure with the sequence
    of events and the fact MTA are still insecure; you guessed it, nothing…


    This week’s coverage by literally every US major paper is the typical, pumped-up
    chests being pounded and blaming Russia, China, and anyone and everyone else for
    these so-called ‘sophisticated’ attacks. It is a futile, useless blame game being
    played out before your very eyes. Today I have just written the following open
    letter to Ms Anne Neuberger, the Deputy National Security Advisor for Cyber and
    Emerging Technology, on LinkedIn for 600 million people to see:

    '
  mdcn: '

    我引述了那些在保持次优安全状态的情况下遭到入侵，并在支付赎金后仍维持不安全状态的组织的问题。克莱姆森大学获得了1.11亿美元，用于向美国制造业传授网络犯罪预防知识，而在此期间，该大学的首页因无效的SSL证书而显示“不安全”。天知道克莱姆森要教什么；肯定不是基本的互联网安全，这一点是肯定的。


    当像CNSS这样的政府组织允许域名因过时的SSL证书而变得“不安全”，以及随之而来的安全隐患；当MPDC、保险巨头CNA、然后是AXA遭到入侵，且所有这些组织的互联网安全评级都是F级和0级时，某个地方的某个人需要清醒过来，认识到这是一个根本性问题，而这个问题就是互联网安全，或者说缺乏互联网安全。


    我们已经多次阐明这一点，并将继续这样做：犯罪分子需要获得对您的企业、您的网络的数字访问权。如果他们无法获得，就无法攻击您；这是一个基本前提。就像美式橄榄球一样：如果没有控球权，就无法达阵得分。网络犯罪分子同样无法发动攻击，除非他们拥有访问权限。


    通过连接互联网，您可以获益良多；然而，如果不安全地连接，您将失去一切。


    最后，在回应CISA战略主管时，我确认：给予我们所需的自主权和支持，我们将推动必要的变革，以阻止世界目前正在遭受的自找的网络攻击围困，否则我们将奋斗至死。我希望最后一点不会被从字面上理解……


    ## 案例研究2——注意差距


    6月4日，全美主流媒体都在报道针对纽约和马萨诸塞州交通系统的最新网络攻击事件，这加剧了周三对美国企业和基本服务所受威胁的担忧。此前，黑客在本周早些时候劫持了全球最大的肉类加工商（JBS
    Foods）并勒索赎金。然而，对本周因各种错误原因登上头条的每一家组织的研究表明，它们一如既往地拥有糟糕透顶的次优互联网连接安全。那么，为什么即使提供了可操作的情报，也没有人倾听或采取行动？媒体和政府不断将责任归咎于俄罗斯和中国；然而，组织自身也有过错，因为它们持续地、系统性地未能管好自己的事务，在这种情况下，就是基本的安全问题。这样想吧：如果你拥有一辆华丽的1962年款捷豹E-Type敞篷车，把它停在高犯罪率地区的显眼位置，钥匙插在点火开关上，然后离开一天，更不用说365天了，你还会指望它第二天还在那里吗？我的论点已经成立，然而SolarWinds、Colonial、JBS
    Foods、MTA以及成千上万的其他组织每天都在这样做，不是用一辆捷豹E-Type敞篷车，而是用它们的整个组织。这甚至不难，因为事情被弄得如此简单。


    大约六个月前，也就是2020年11月，我亲自致信纽约市长办公室，告知并提醒他们我们在纽约的研究发现以及纽约大量次优网站的问题。我们说的不是这里或那里的一个小问题；我们说的是完全暴露、脆弱且极易被利用的互联网连接域名，这些域名如果被发现并成为攻击目标，可能会让纽约陷入瘫痪。这不是电影场景；这是现实。我们做了最坏的打算，但也抱有最好的希望。我们万万没想到，六个月后，MTA确实成为了网络攻击的受害者。大约八周后，也就是1月8日，我们收到了纽约市副首席网络安全官Ben发来的以下电子邮件。


    > Andy，

    >

    > 感谢您就纽约市网站安全问题联系市长办公室。您的来信最近已转交信息技术与电信部（DoITT）处理，因此，首先请允许我为市政府延迟回复您的信息表示歉意。

    >

    > 当然，DoITT的信息安全团队与您一样关注纽约市网站的安全，我们感谢您的反馈。如果您在我们的环境中发现了具体漏洞，如果您能提供具体细节以便我们进行充分修复，我们将不胜感激。请放心，您发现的任何问题都将提请我的管理层注意，我们将尽一切努力妥善处理。

    >

    > 再次感谢您的关心，并感谢您抽出时间将这一重要事项提请市长注意。

    >

    > 期待您的回复。

    >

    > 此致，

    >

    > Ben

    >

    > Ben Fernandes，CISSP、CISM、CISA、CRISC、CGEIT

    >

    > 副首席信息安全官

    >

    > 纽约市信息技术与电信部


    我知道我们都很忙；然而，考虑到Ben的职位、我们提供的证据，以及我们在2020年总统大选前协助FBI并在中央投票系统中发现了一个韩国DNS的事实，人们可能会认为稍微快一点的回应或许更为恰当。我想他确实为延迟回复道了歉；但美国在同一时期因网络犯罪而遭受的数百亿美元的相关成本和损失似乎并不令人担忧。我每天都非常忙碌，每天工作14到16个小时，而我在同一天几分钟内就回复了Ben。我的回复包含了进一步的信息，以及类似交通运营商的例子，即STM和SEPTA，它们都曾是网络攻击的受害者，一个在美国，一个在加拿大。SEPTA和STM在入侵前后都存在着与许多纽约官方网站（包括MTA）相同的次优域名状况。我还补充了一个事实，即我们最近与Ritchie
    Torres的办公室分享了类似信息，因为他一直在大力倡导建立纽约中央网络中心，而他自己却因维护一个次优且不安全的网站而藐视隐私法，并使该组织成为网络犯罪分子的目标。可悲的是，政府办公室和公司宁愿做更多的事情来接受成为勒索软件的受害者；与网络犯罪分子谈判；并支付通常数百万美元的赎金，也不愿听取逻辑和考虑证据，即使这些证据是免费提供的。此外，像MTA、纽约市和Ritchie
    Torres这样的组织，在获得可操作情报后，要么不采取任何行动（如Ritchie Torres的情况），要么直接无视（如纽约市和MTA），没有任何感激、承认或进一步的沟通，这近乎于纯粹的傲慢和无礼……


    > 亲爱的Ben，

    >

    > 希望您一切安好。我只想说，虽然我不是一个彻头彻尾的政治人物，但我非常遗憾看到美国目前正在经历的这些荒谬之事。

    >

    > 有趣的是，本周NSA已经效仿我们，采纳了我们的研究和发现，发布了关于过时TLS协议配置的信息，我们感到非常荣幸。

    >

    > 因此，我们想重点指出的一个域名是www.bt.mta.info，它一直显示“不安全”域名，并且已经持续了好几个月。此外，由于不安全域名而导致的域名劫持，正是12月灾难性的SolarWinds入侵事件的初始渗透点，换句话说，与我们告知您的这个域名相同。

    >

    > 我们敦促对纽约市所有域名进行全面研究和审计，并很乐意提供协助。

    >

    > 此致，

    >

    > Andy

    >

    > 附言：SEPTA和STM的附件已附上，它们都在2020年被入侵，并且都拥有“不安全”域名。


    几个星期过去了，几乎出乎意料地，MTA的一名安全团队成员联系了我，问我是否可以分享他们错过的安全“漏洞”，以及我是否愿意接听电话。邮件中抄送了几个人，为了配合他们的团队，电话安排在2月12日英国时间22:00。我相信MTA的IT和安全团队有12人，可能多达14人参加了电话会议。我们讨论了我们的研究，并与他们分享了关于MTA多个域名的信息，这些域名使用了过时的SSL证书、配置错误或使用了不匹配的证书，导致网站显示“不安全”、暴露且高度脆弱。这种情况明确地使MTA暴露、脆弱且易于被利用。一位名叫Valerie的女士在很大程度上主导了MTA方面的对话，并在第二天的一封电子邮件中要求提供更多信息。我欣然应允，并在同一天转发了进一步的信息。然后MTA就沉默了。我在2月16日和2月23日通过电子邮件进行了跟进。一个字也没有，甚至没有确认所分享的情报，完全为零。直到本周确认发生网络攻击，距离我开始提醒他们其不安全且高度脆弱的处境（他们选择无视）已经过去了好几个月。我们在入侵后的今天（6月5日）进行的研究显示，new.mta.info在其被入侵数周后，互联网安全评级仍为F级。我分别给Ben和Valerie发了电子邮件，表达了我对这一系列事件以及MTA仍然不安全这一事实的不满；你猜怎么着，毫无回应……


    本周美国各大报纸的报道都是典型的捶胸顿足，将所谓的“复杂”攻击归咎于俄罗斯、中国以及其他所有人。这是一场在你眼前上演的徒劳无益的指责游戏。今天，我刚刚在LinkedIn上给网络与新兴技术副国家安全顾问Anne
    Neuberger女士写了一封公开信，供6亿人观看：

