  - '[PAGE 52]


    Last year we ‘assisted’ Hiscox who, like most Insurers, seemingly did not have
    the governance, control, or management of their Internet-facing domains when,
    rather embarrassingly and rather ironically, we alerted them to the fact their
    Cyber Insurance website was Not Secure: its TLS certificate was invalid. Few people
    relish being technically challenged, or their errors being pointed out, this situation
    was no exception. After what bizarrely became a rather heated debate, the CISO
    and CEO finally relented and made their cyber and data insurance site secure by
    placing a valid certificate on the domain. There was barely a thank you; possibly
    they preferred the alternative. Their security position to date is still far from
    ideal.


    All the while organisations, especially Insurance companies, that provide cyber
    cover continue to overlook, ignore, or are complacent with their Internet-facing
    and connected security, cyberattacks, losses, and even companies ceasing to trade
    will exponentially increase. In 2021, cybercrime will become equivalent to the
    world’s third-largest economy, with total estimated costs and losses of $6–7 trillion
    (circa 10% of the world’s entire GDP). By 2025, that figure is estimated to surpass
    $10 trillion.


    The insurance market has a vital part to play. By seemingly supporting and dare
    I say inadvertently encouraging inadequate basic security, it is fuelling a potential
    for even greater losses. It is time to insist on the equivalent of ‘5 lever latches,
    window locks’ and alarms before it is simply too late. Being complicit by being
    complacent is sadly all too frequent a position, as our reports continually evidence.


    Finally, ask yourself this simple question, no matter if you are in the Insurance
    sector or not. If you drove your car whilst drunk, without papers, with four illegal
    tyres, and recklessly, or if you left your property for a year, with the windows
    and doors left wide open and all your valuable possessions on the table in full
    view, if you were then in an accident or were robbed, would you expect an insurance
    claim and settlement? Of course not; so why do organisations (including Insurers
    themselves) demonstrate such a poor stance on basic security measures year after
    year and then have the gall to call attacks ‘sophisticated’ when they were nothing
    more than opportunistic with regard to exploitable vulnerabilities? What is more,
    these cyberattack opportunities have led carpeted runways and being served up
    on silver platters…'
  - '[PAGE 53]


    Security Ratings will cause a marked reduction and huge difference in day-to-day
    security. To decrease cyberattacks and losses, changes must be driven, even enforced.
    Sadly, I am unsure what, if any, real changes governments and agencies really
    want or are prepared to sacrifice.


    As of today, 21 May, it has been reported by Bloomberg that CNA paid $40 million
    two weeks after the initial cyberattack and that data had been exfiltrated. This
    meant plaintext data, the staple diet of all cyber criminals, was removed and
    then encrypted. As in a typical Ransomware fashion, the decryption key is what
    ransoms are paid for to obtain. Previous research we had undertaken during the
    original attack was checked late last night, and CNA are maintaining their insecure
    Internet connectivity and Not Secure domains due to obsolete SSL certificates.


    ‘The fact the original cyberattack was not classed as a Ransomware attack, then
    was, with a small ransom payment, and now the disclosure of the $40 million calls
    into question exactly what is being said. The Colonial ransom payment has been
    claimed to be $4.4 million by the company; however, sources have alluded to the
    $30-million demand being met.


    The question remains: at what point do the NSA, GCHQ, FBI, NCSC, and United States
    and United Kingdom governments finally do something other than play charades with
    these attacks? Forget the fact they have been guilty of Internet abuse and manipulation
    for mass data collection and harvesting for over two decades; they hold the key
    to confirming that lacking Internet security is the main cause, the root cause,
    for $trillions of losses due to cybercrime. What motive could they possibly have
    to continue playing this down, or do they have a patent on the word ‘sophisticated’?'
