    而且这种可被利用的现状，肯定是重大过失和同谋吧？这些“可信赖”的组织、领导人和专家拥有所有专业知识和建议，难道还能不是故意为之吗？


    2021年5月11日，一个名为Babuk的勒索软件组织从4月底的网络攻击和赎金要求中泄露了华盛顿警察局（MPDC）的内部文件。泄露的数据包括警官和罪犯的个人身份信息，以及他们的社会安全号码、信用记录、地址和联系方式。此外，泄露的文件还包括测谎记录、社交媒体帖子、工作经历、财务负债以及警官驾照的复印件。Babuk与MPDC之间的谈判已经破裂。作为一个执法部门，他们决定支付赎金要求不合适——这完全正确，尤其是知道任何支付的赎金都会助长进一步的犯罪活动；我脑海中浮现出“乌龙球”这个词。当时联邦调查局（FBI）的言论被引用：“我们不支持支付任何赎金，因为支付并不能保证任何组织能够取回他们的数据。”这也会被视为鼓励对手针对更多受害者，并增加整体网络攻击和勒索软件攻击。FBI在2021年11月也遭受了自己的数字入侵，当时有10万封FBI电子邮件被发送给毫无防备的收件人。这些邮件确实来自FBI的服务器，只是不是FBI中任何人发送的。FBI因维护被黑客入侵的不安全子域名，而失去了对自己服务器的指挥与控制（邮件交换（MX））。


    我们再次对MPDC的互联网安全展开了自己的研究和调查，立即发现其评级为F和0（几乎就是这本书的书名：F0），并据此向该部门发出了警告。与此同时，我们想了解为什么这种情况被允许出现，以及为什么他们缺乏任何执法部门都应有的持续控制和管理。为什么MPDC会把他们部门的大门敞开、系统保持登录状态，并提供不受限制的完全自由和无限制访问？当然，他们不应该这样做，然而这恰恰就是他们通过容易被利用的不安全互联网连接所做的事情。我们想进一步研究和调查。我们还将其他主要执法部门纳入研究，包括纽约警察局（NYPD）、洛杉矶警察局（LAPD）、芝加哥、费城、休斯顿、库克县、洛杉矶县、宾夕法尼亚州和达拉斯的执法部门域名。除了芝加哥（得分为D+和40/100，仍远未达到A级）之外，所有部门的评级都是糟糕的F。……这意味着所有这些执法部门都处于与已经被入侵的华盛顿警察局——美国联邦首都的警察部门——同样完全暴露、脆弱且可被利用的境地。害怕吧，非常害怕。


    2021年12月，英国警察国家计算机系统（PNC）被黑客入侵，1300万英国人的数据泄露，这些人主要是罪犯，或至少处于刑事系统中。这次黑客攻击被归咎于早前对NDItech的攻击，这是一家英国科技公司，号称负责管理PNC的很大一部分。2021年10月，他们自己也因基础安全欠佳而被黑客入侵，英国警方将矛头指向了他们。当我们作为专家受邀检查伦敦金融城警察局的网站安全并向首席专员和内政大臣提交报告时，他们已经关闭了一些系统，这些报告极具破坏性，以至于我们被边缘化、排斥和忽视。这些报告很快就会公开。


    上述情况极其令人震惊，必定是美国每一位参议员、市长、警察甚至公民都高度关注的问题。该国首都警察局如此轻易地被攻击和数据外泄，足以说明其安全状况有多糟糕，并且鉴于我们的研究，这必然是对未来情况的警告。当执法部门、县法院、美国政府甚至美国财政部都能被攻破时，这表明政府及其各部门在保护数据安全和开展日常业务方面存在系统性失败。正如我之前提到的，拜登政府本周宣布再拨款5亿美元用于打击网络犯罪；然而，人们不禁要问，真正的罪犯究竟是谁。有一件事是肯定的：等到尘埃落定，穿灰色西装的律师们开始以重大过失为由对这些机构提起法律诉讼和集体诉讼时，那些有美国政府支持和订单的网络安全公司——大多由前情报机构人员领导，其中许多有Thoma
    Bravo等公司投资——很可能会继续赚取巨额资金，但往往无法提供任何额外的安全保障。事实上，许多公司正在增加客户的风险敞口。Thoma Bravo是几家非常知名的网络安全公司的主要投资者，而这些公司在过去两年中都被入侵过。我愤世嫉俗吗？我天性并非如此。我轻信他人吗？至少在几年前，我确实如此。我对政府及其情报机构失望吗？我毫不含糊地说，我感到厌恶。


    当我被“选中”并受邀担任Cybersec Innovation Partners的首席执行官时，我想，没问题，我们要对抗坏人；我肩膀宽厚，聪明且深谙世事。我从未想过，那些所谓的“好人”很快就会实实在在地蒙住我的眼睛，并象征性地把我的双手反绑在背后。我也没有停下来想过，当我们发现俄罗斯和中国在英国关键国家基础设施中的存在和渗透，以及大量被撤销、过期、非法和受制裁的数字证书时，他们会告诉董事会无视这些发现，就好像这一切从未发生过。同样，我也从未想到，当我们受委托并受邀出席专家小组，向那些向GCHQ汇报并由其资助的政府机构展示我们独特的工作、研究以及我们的发现时，我们会在最后一刻被叫停，只因他们害怕触及这些问题、揭露他们之前的活动和所作所为。


    同样的问题如今深植于网络安全世界的DNA中，那就是障眼法、误导和谎言。凭借大量的支持和证据，我们展示了我们为何陷入这种烂摊子；我们也可以毫不含糊地展示各机构过去和现在仍在扮演的角色，这就是为什么我们在每一个机会上都受到限制，而“双帽客”们试图破坏我们的研究和发现。在*《从震网到太阳风》*中，我与NCSC分享了谈话记录。显而易见的是，尽管我们的研究和发现证明了不安全域名与网络入侵之间存在直接的相关性和因果关系，但这些证据一直被淡化甚至被否定。


    本章第一段提出了一个假设性问题：如果互联网遭到攻击并中断一段时间，损害和代价会是什么？今天早些时候，Vladas Leonis博士给我发来一篇文章。Leonis博士昨天同意为本书撰写前言，对此我非常感激，也确信他会写得非常出色，我真心非常感谢。Leonis博士（真正的正派人物之一）也是第一个阅读我上一本书初稿的人，我要公开表达我永恒的感谢，感谢他的洞见、补充，以及他对书中内容可能被进一步公开的担忧。今天早上Leonis博士把那篇文章和前面那个问题一起发给我时，我用一句简单的话回复：有趣的问题；不过，如果互联网中断一天，那实际上也会让所有网络犯罪停止……


    ## 8 威慑理论与五眼联盟的失态


    从20年前因数字敲诈（网络犯罪）而损失的数千万美元，到如今数十亿美元的支出和数万亿美元的损失，可以肯定地说，无论谁掌舵——布什、奥巴马、特朗普，还是现在的拜登——他们在安全和信息安全领域的领导几乎没有起到什么作用，最终反而产生了不利影响，可以说是在为网络犯罪和勒索软件火上浇油。随着加密货币的出现和便利，犯罪分子可以保持相当匿名，并规避敲诈勒索和洗钱监管。这样想来，对某些人来说，这确实是一种绝佳的商业模式。正如老鹰乐队那首著名歌曲所唱：“她是累了，还是只是变懒了？”这句话概括了美国的主要处境，尽管网络攻击和勒索软件是全球性现象和问题，但美国目前遭受了约80%的攻击，因为他们是最大的用户，并且拥有许多最大、最易被利用的目标。


    在9/11恐怖袭击之后，美国政府被裹挟着批准了数十亿美元的支出，以实现全球数字主导权——这主要还是美国，其次是英国。当然，五眼联盟也加入了；然而，他们更多只是“客串”角色。在NSA和GCHQ之间，他们发现并抓住了彻底主导数字世界的机会，捕获所有数据，对其进行收割、使用、出售，并随心所欲地处置，常常懒得去寻求任何许可或批准。双子塔袭击中超过3000人的死亡，加上日益加剧的全球动荡，为他们提供了动机。他们获得越来越多的资金，通过开发数百种渗透技术，来发展PRISM和其他数百种数据捕获与数字入侵能力。有一件事他们从未停下来思考，甚至从未考虑过，当然也没有预见到，那就是他们可能做什么

