    `pack()`，因为在我看来，它更清楚地描述了动作，因为我们正在将值打包到容器中。


    最后，当我们想要将函数应用到容器中存储的值时，我们将使用一个名为 `map()` 的方法，它相当于 Haskell 的 `bind()`。


