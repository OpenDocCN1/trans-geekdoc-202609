    \ function against the carried value as we saw in the `array_map()` section. One\
    \ nifty feature of this pipeline implementation is support for subsequent parameters\
    \ to be sent through with a function specification by supplying an array.\n\n\
    **Listing 6.4**\n\n```\n\n```\n\nA typical usage of this function might look something\
    \ like the following, where a series of string manipulation functions are called\
