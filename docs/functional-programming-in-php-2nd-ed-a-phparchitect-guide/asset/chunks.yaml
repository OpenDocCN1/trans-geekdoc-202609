    \n# 7 实现理论\n\n> “你希望能够为函数编写一个契约，例如：‘你给我大于零的参数，我会给你一个小于零的结果。’”\n\n> \n\n> —Simon\
    \ Peyton Jones（计算机科学家，@simonpj0）\n\n## 7.1 IP 地址限制\n\n与引入新主题时的惯例一样，第一个示例将在解决的问题和实现的代码方面都保持简单。虽然代码可能永远不会投入生产，但它确实提供了一个良好的起点。阻止不在\
    \ IP 地址白名单中的用户访问可以用多种方式在 PHP 中实现。本示例将采用尽可能用最少代码量在 PHP 中实现的方法，据我所知。\n\n我们需要一个 IPv4\
    \ 地址来表示网站用户的地址，用于以下示例。为了使代码更容易适应 Web 服务器环境而非命令行，最简单的方法是将 `$_SERVER['REMOTE_ADDR']`\
    \ 覆盖为我们选择的静态 IP 地址。在通过 Web 服务器运行此代码以检查实际用户 IP 地址时，只需删除此行：\n\n```\n\n```\n\n首先，必须定义\
    \ IP 地址白名单，以便有可检查的内容：\n\n```\n\n```\n\n验证 IP 地址非常简单，可以使用 `array_filter()`。回调函数将检查用户的\
    \ IP 地址是否与白名单中的任何地址匹配。\n\n`array_filter()` 将针对 IP 地址白名单执行，因此函数应接受一个 IP 地址作为参数，如下所示：\n\
    \n```\n\n```\n\n最后，代码对 `array_filter()` 的结果应用一个简短的三元条件。这意味着如果列表为空，则没有匹配项，用户应被拒绝访问，目前通过简单的\
    \ `die()` 实现。如果数组包含内容，则存在匹配项，用户应被允许继续，因此代码在这里什么也不做并继续执行。\n\n能够验证部分 IP 地址不是很不错吗？\n\
