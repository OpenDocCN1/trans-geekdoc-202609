- raw: "There is no golden rule recommending functional-style programming in certain\
    \ situations or object-oriented programming in others. Functional programming\
    \ is not a framework or design pattern, but a Turing complete programming methodology.\
    \ To this end, as you familiarize yourself with functional programming, you will\
    \ develop an innate sense of when a particular methodology is best employed to\
    \ solve a problem. It is worth noting this will be different for each programming\
    \ language and working in functional programming versus object-oriented programming\
    \ in Scala is very different compared to the same in PHP.\n\nIn the PHP world,\
    \ due to the bias towards object-oriented programming, functional programming\
    \ is mostly used for list (array) processing, but it does not stop us from exploring\
    \ more complex functional constructs as you will see further on.\n\n## 2.6 The\
    \ Benefits of Functional Programming\n\nSo how does removing features from your\
    \ imperative language help you?\n\nWith the ever increasing popularity of functional\
    \ programming, it is important to keep pace. Insights gleaned from your exploration\
    \ of functional code can be applied in object-oriented programming as well.\n\n\
    One regularly quoted rule states the increase in the legibility of a program improves\
    \ as the level of abstraction rises by virtue of the succinct code it encourages.\
    \ It is also often said a side effect of these attributes is an increase in productivity\
    \ with less typing and no global state to construct in your mind, helping to free\
    \ your time for the more difficult problems.\n\nTesting your code becomes much\
    \ easier because all values are final, which means you do not have to contend\
    \ with side effects. There is no particular order to maintain or global state\
    \ which needs to be put into place. All you need to do is pass in the correct\
    \ arguments, and you will always get the same result.\n\nThis concept is often\
    \ described as referential transparency, which basically means you can replace\
    \ any function call with the value it returns, and the resulting algorithm will\
    \ remain the same. Therefore, instead of `range()`, we could use a static array\
    \ and still get the same result:\n\n```\n\n```\n\nSubstituting static values into\
    \ the imperative example would be impossible (don’t contort yourselves proving\
    \ me wrong!), and this is where programming in a functional-style really shines.\
    \ Each function, given the same input, will always return the same value.\n\n\
    It should not be underestimated how much easier these functions are to test than\
    \ their state-filled counterparts. There is less time wasted mocking global state\
    \ and when a test fails, it will always fail. This makes it far easier to debug\
    \ any test. Reproducing the bug does not require long chains of actions to surface\
    \ due to the functional program’s avoidance of any global state and adoption of\
    \ encapsulation for its components. If a function is not returning the correct\
    \ values, then it is always incorrect.\n\nWhile it is not usually an issue with\
    \ PHP, functional programs help to prevent race conditions between threads or\
    \ processes. Maintaining a functional style allows you to program these types\
    \ of applications with confidence (well, almost!). The importance of parallel\
    \ processing continues to grow with the advancement of computer hardware.\n\n\
    Computers are gaining more and more power by increasing the number of cores the\
    \ central processing units contain. If your software is to take advantage of this\
    \ power, then you will need to account for simultaneous processing.\n\nThis is\
    \ where functional programming’s abandonment of assignment statements really helps\
    \ to protect you from process locking or attempting to update the same locations\
    \ in memory. It also serves to make the order of execution irrelevant, as without\
    \ state to update, a function will always return the same value. It is when you\
    \ allow state to creep into code that breaking jobs off into parallel processes\
    \ falters.\n\nAdditional benefits of functional programming which do not generally\
    \ apply to PHP—so we won’t discuss them here—are hot code deployment and machine\
    \ optimization of code.\n\n## 2.7 Functional Basics\n\nDespite PHP being inherently\
    \ imperative, it can support a basic functional style of programming. To make\
    \ it easier to learn, it is best to eschew some aspects of the language to emulate\
    \ a purer functional one.\n\n*   Avoid changing state—even within a function.\n\
    \n*   Attempt to keep functions to one line or as short as possible.\n\n*   Break\
    \ problems down to their smallest units and turn these into reusable functions.\n\
    \n*   Remove control statements from your code.\n\n*   As it is worth repeating;\
    \ avoid state and do not use variable assignments!\n\nYou want to essentially\
    \ create a little black box function which will always return the same value when\
    \ given the correct arguments.\n\nPHP has a number of language features to help\
    \ form the basis of programming in this style. Probably the most useful is the\
    \ lambda function, which makes it easier to deal with code passing functions around\
    \ as variables. Additionally, language functions such as `array_map()` and `array_reduce()`\
    \ are very useful for applying functions to lists of values.\n\nThere are no immutable\
    \ value types or statically-typed variables in PHP so it is up to your implementation\
    \ to protect your functional code from changing state.\n\nAs you begin to work\
    \ in a functional way, you will need access to more primitives for the more complex\
    \ operations you will encounter. Luckily, the path has been previously trodden,\
    \ and there are a number of libraries we will cover later.\n\n* * *\n\n1.  [Simon\
    \ Peyton Jones—Haskell is useless](http://youtu.be/iSmkqocn0oQ?t=1m23s)[↩](#ch005.xhtml#fnref1)\n\
    \n2.  [Erik Meijer: Functional Programming](http://youtu.be/z0N1aZ6SnBk?t=16m44s)[↩](#ch005.xhtml#fnref2)\n\
    \n3.  [Scala School](https://twitter.github.io/scala_school/)[↩](#ch005.xhtml#fnref3)\n\
    \n# 3 Language Features\n\n> “Recursion is the GOTO of functional programming.”\n\
    \n> \n\n> —Erik Meijer (Computer Scientist, @headinthebox)\n\nDespite PHP’s reputation\
    \ for being a little lack luster in stringent programming environments, it is\
    \ reasonably well featured. Most of its power came in versions 5.3 and above,\
    \ but since PHP 5 it has been headed in a good direction. Notice I said “good”\
    \ and not “the right” direction! As version 5 has progressed there has been a\
    \ number of new features added to the language that have also greatly eased development\
    \ with PHP.\n\nWhile it is true a lot of these features could have been implemented\
    \ in more optimal ways to support functional style programming, they none the\
    \ less exist. Outside of their varied shortcomings they actually provide a viable\
    \ basis for functional programming in PHP itself.\n\nThis is one of the more important\
    \ things to realize early on; although the base capability is there, you do not\
    \ get any high level niceties. If you want more power and convenience, you will\
    \ have to write the code to facilitate this yourself (or co-opt a library). Sometimes\
    \ this might be as simple as wrapping a function call and other times you might\
    \ find yourself writing a library or two.\n\nThis is both the fun and currently\
    \ the difficulty with PHP. If you have an idea where to start, then being productive\
    \ in functional style PHP is relatively easy. If not, then you could easily find\
    \ yourself bogged down in high level library creation.\n\nThat is the purpose\
    \ of this book; to give you shortcuts to the best bits of the language and the\
    \ third-party libraries to make functional programming in PHP more enjoyable and\
    \ even fun! To begin with we will simply go through the relevant base of features\
    \ of PHP itself.\n\nThese range from the basics of types and function definitions\
    \ through to more involved operations, such as map and reduce. Along the way we\
    \ will touch upon recursion, closures, and lambda functions."
