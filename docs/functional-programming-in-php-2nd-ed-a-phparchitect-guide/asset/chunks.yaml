    ### Higher Order Functions


    The term, higher order function, refers to functions which either accept another
    function as an argument or those returning a function as a value. Of course the
    same name applies to functions that do both as well. When a function accepts another
    function as a parameter like the venerable `spl_autoload_register()` it becomes
    a higher order function. You can create your own functions which accept other
    functions as parameters too.


    This is most often used in PHP when you want to call a function against items
    in a list or to filter results as a predicate.


    While this may be the norm you can pass the function for any purpose. Going back
    to the case of `spl_autoload_register()`, it is used as a sort of lazy loading
    and a simple function to define a reusable instruction set. By lazy loading I
    mean the code in the callback will not be executed unless it is required explicitly
    to answer an autoloading request. Additionally, if an earlier registered function
    matches, then this code will never run—a good thing!


    Back to the original point and looking at an example of a function which accepts
    another function as an argument. We will start with a simple apply function which
    will accept a value and a function. Given these ingredients our apply function
    will execute the supplied function against the value parameter.


