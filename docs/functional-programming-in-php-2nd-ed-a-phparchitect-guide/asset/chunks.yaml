    就像在命令式示例中一样，当没有可用行时，这段代码将输出“Name: Unknown”。如果有记录，它将显示“Name: Marion (verified)”。在这种情况下使用单子的优势在于，它可以与其他函数应用链式调用，添加验证标签的代码可以轻松在其他地方重用，而且代码可以说更易读、更易于编写。


