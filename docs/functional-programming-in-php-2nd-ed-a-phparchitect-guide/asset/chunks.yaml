  trans: '


    # Frege’s Basic Law V 和 Russell’s 悖论


    Frege’s Basic Law V 描述了一种集合逻辑，使得定义成员关系变得容易。不幸的是，对于 Frege 来说，它也允许 Bertrand Russell
    发现一个不一致性。著名的 Russell’s 悖论，它阐述了一个自指集合：“那些 x 使得 x 不是 x 的成员的事物的集合。”这个绕口令会产生一个集合，它既不是自身的成员，又是自身的成员。这一发现让
    Frege 愣住了，并让他为这个问题苦苦挣扎，使用薄弱的论点和权宜之计。


    # 维也纳学派和逻辑实证主义


    尽管如此，逻辑学家们继续致力于构建一个能够描述整个世界的系统。在哲学界，这导致了极具影响力的维也纳学派的形成。聚集的成员们讨论将陈述句划分为近乎两个类别。一方面，他们包括那些无法观察到的陈述句，另一方面则是那些可以观察到的陈述句。任何形而上学的东西都是无意义的，被视为逻辑错误而被拒绝，或归结为可以通过科学调查证明的经验陈述句。形而上学陈述句的一个例子是“所有艺术都是无意义的”——它既不能被证明为真，也不能被证明为假。


    在此期间，他们雇佣了一名学生来监督讨论，通过中断导致形而上学话语的对话来进行监督。起初，他们会大喊“Metaphysik”，但正如 Rudolph Carnap
    后来转述的那样，他们很快将其缩短为仅仅“M”。随着讨论的进一步进行，“他喊了那么多次‘M’，我们都听烦了，所以当我们说一些合理的话时，就改为‘no-M’。”换句话说，大多数讨论都会导致形而上学的讨论。这使
    Carnap 意识到可能存在许多逻辑，而不仅仅是一种普适逻辑。


    # Hilbert’s Program


    大约在同一时期，一位名叫 David Hilbert 的杰出德国数学家在数学界也设定了类似的目标。在 20 世纪 20 年代末，他热衷于通过证明一切都可以用数理逻辑来描述来解决
    Entscheidungs Problem。Hilbert 确信一切都可以归结为真或假。


    # Gödel’s 不完备性定理


    有些出名的是，在 1930 年，维也纳学派的一名学生 Kurt Gödel 提出了他的完备性定理，这有助于加强 Hilbert 的假设。然而，这并没有持续多久，因为第二天
    Gödel 也讨论了他的第一个不完备性定理，这动摇了 Hilbert 主张的根基。现在普遍认为 Hilbert 的同僚是错误的，并且存在一些逻辑无法解决或描述的问题。


    那么，Gödel 是如何搅乱局面的呢？`This statement is not provable.` 简单！


    如果该陈述句可以被证明，那么它就是假的，但它声称自己不能被证明，所以它必须是真的。这个陈述句无法被判定，因为它同时既是真又是假。你可能以前听过一个类似的陈述句，叫做说谎者悖论。这比
    Gödel 早至少 2000 年，有些来源表明其根源可以追溯到公元前 600 年至公元前 400 年。“一个人说他在撒谎。他说的是真是假？”随着时间的推移，这被简化为“这句话是假的”，与
    Gödel 不完备性定理的基础非常相似。不过，这是一个外行的简化，因为 Gödel 证明了这是所有逻辑中的一个悖论。


    他使用自己设计的逻辑表达式系统，通过两个定理证明了这一点。这在现代人看来可能是最容易理解的悖论，但当时 Gödel 正处于逻辑学的前沿。为了进一步证明 Entscheidungs
    Problem 的不可判定性，有必要定义有效计算。这导致了一些系统被同时构思出来。


    # Lambda 演算和函数式编程


    在 1932 年，第一个系统由 Alonzo Church 以 Lambda 演算的形式提出。他看到了他新定义的潜力，并写道：


    > “There may, indeed be other applications of the system than its use as a logic.”


    鉴于 Lambda 演算后来成为函数式编程的基础，可以说他肯定是对的。使用 Lambda 演算作为基础，Church 能够提出一个没有有效可计算答案的问题。同样，简单性令人惊叹；给定一个
    Lambda 表达式，确定它是否会无限循环。这是做不到的！


    Gödel 在大约同一时间正在研究他自己的递归函数逻辑系统。虽然它可能看起来不像 Gödel 的形式化，但递归是函数式编程的核心组成部分。


    与此同时，Alan Turing 接触到了 Gödel 的不可判定性问题，并且——正如 Gödel 一样——他得出结论：要研究 Entscheidungs
    Problem，就必须定义一个有效可计算性的系统。他设计了图灵机，它可以计算所有自然上被认为可计算的数字。我的意思是，人类可以用铅笔和纸计算的数字。


    这使得 Turing 和 Alonzo Church 能够表明 Lambda 表达式和图灵机在功能上是等价的。与 Church 合作，Turing 后来创建了第一个计算
    Lambda 表达式的程序。他们于 1937 年共同撰写了一篇论文，称为 Church-Turing Thesis，表明两种技术是等价的且同样合理。Turing
    甚至进一步说：“Church’s calculus…allows \[Turing\] ‘Machines’ which generate computable
    functions to be replaced by the more convenient λ-definitions.” 基于此，我们可以说 Turing
    偏爱函数式编程！你可能会说这是一个武断的推断，但他确实对那些形式化产生了好感。


    # 类型 Lambda 演算和组合子逻辑


    在 20 世纪 40 年代，Alonzo Church 正在撰写一篇关于类型 Lambda 演算及其形式证明的论文。独立地，Turing 也在研究一个类似的证明，但未发表，尽管这很好地表明他看到了这些技术的潜力。


    值得注意的是，世界收到了不少于四种描述有效计算的技术：Alonzo Church 的 Lambda 演算、Alan Turing 的图灵机、Kurt Gödel
    的递归函数，以及迄今未讨论过的 Haskell Curry 的组合子逻辑。这并非巧合，而仅仅是条件成熟，使得这样一组形式化得以产生。


    准备性的基础工作已经完成，逻辑世界已准备好迎接新的想法和发现。这解释了为什么这些发现在时间上如此接近，即使他们不知道其他人也在研究相同的想法。


    回到 Haskell 的组合子逻辑及其函数组合形式化。原始函数被组合以创建更强大的结构；这是一个你将在函数式编程中看到的原则。发表于 1927 年，它比 Turing
    等人的其他形式化早了若干年。


    # Moses Schönfinkel 和柯里化


    关于谁是第一个提出证明的人存在一些争论，可能是一位名叫 Moses Schönfinkel 的俄罗斯人。这也影响了函数式编程技术柯里化的名称，有些人建议应该称为
    Schönfinkelization 以承认他更早的发现。不幸的是，Schönfinkel 的故事是一个悲伤的故事。除了这篇论文之外，关于他的工作知之甚少。他是
    Hilbert 小组的成员，并在他们的帮助下于 1924 年发表了这篇论文。几年后，他从 Göttingen 回到俄罗斯，1927 年有报道称他患有精神疾病并被关进疗养院。具体时间不详，但在
    1942 年的某个时候，他作为一个穷人去世了。


    他所有的论文都被邻居烧掉取暖了，所以永远不会知道他正在研究什么。


    '
