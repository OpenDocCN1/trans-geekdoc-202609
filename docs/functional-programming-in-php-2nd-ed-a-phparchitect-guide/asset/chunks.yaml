  trans: "\n\n就像在 PHP 5.6 中一样，可以使用可变参数和展开运算符来大大提高此类代码的可读性。\n\n在我们之前的示例中，我们使用了 `func_get_args()`\
    \ 来获取参数数组。这个函数不幸的是，无论你是否已经将参数分配给了参数变量，它都会返回所有参数。这导致在之前的示例代码中使用 `array_slice()`\
    \ 来删除第一个参数。\n\n可变参数使这个过程变得更加容易和简单，只需对函数参数进行轻微的语法调整。函数的最后一个参数可以前缀三个连续的点。这指示 PHP\
    \ 将所有后续参数作为数组传递给你的可变参数变量。\n\n```\n\n```\n\n我们可以用一组参数调用此函数，以查看可变参数的行为。\n\n```\n\
    \n```\n\n当 `sum3()` 执行时，PHP 会将第一个参数（`1`）分配给 `$a`，将第二个参数（`2`）分配给 `$b`。所有后续参数（3\
    \ 到 10）将分配给可变参数 `$xs`。这个变量由前面的三个点 `...$xs` 指定为可变参数。\n\n> 你可能会好奇我为什么将变量命名为 `xs`——好吧，这是一种\
    \ Haskell 风格的约定，用于表示变量包含 `x` 的列表。就像自然英语一样，‘s’ 表示它是复数或多个。\n\n> \n\n> 所以 `xs` 是类型为\
    \ `x` 的值的集合，其中 `x` 可以是 `int`、`float` 等。\n\n当然，这个示例没有实际应用，因为你通常会舍弃 `$a` 和 `$b`\
    \ 变量，直接在 `array_sum()` 中使用可变参数。\n\n如前所述，展开运算符是可变参数的宝贵对应物。也称为解包运算符，它获取一个数组并将其内容转换为函数的参数列表。语法很容易记住，因为它与我们之前考察的可变参数相同。\n\
    \n此功能可以在以下函数调用中显示，其中 PHP 本质上将提供的数组 `$args` 转换为针对先前定义的 `sum()` 函数的参数。\n\n```\n\n\
    ```\n\n回到 `log_and_call()` 示例，可以使用可变参数和参数解包来重写它。\n\n```\n\n```\n\n这段代码要短得多，因此读起来更快、更容易。由于展开运算符只收集未分配的参数，我们可以避免对\
    \ `$arguments` 数组进行切片。更不用说删除了两个不再必要的函数调用。\n\nPHP 5.6 中添加的展开或参数解包语法允许将数组转换为函数参数。这个数组不一定需要来自可变参数或\
    \ `get_args()`，也可以是你自己构建的数组。可变参数可以用于将传递给函数的参数作为数组捕获。它会拾取任何尚未分配给命名函数参数变量的参数。\n\n\
    ### Lambda λ\n\nLambda 函数只是基本 PHP 函数概念的扩展。本质上，lambda 是一个可以像变量一样处理的函数——它是一个没有正式标识符的函数。我的意思是，函数在定义时没有被赋予名称。这种特性通常被称为一等函数，这意味着它们可以作为参数传递给其他函数，从函数返回并赋值给变量，或者放置在更复杂的数据结构中。\n\
    \n这些函数通常被称为 lambda (λ) 函数或匿名函数，两者可以互换使用。为了说明在 PHP 中这看起来如何，我们将重新使用之前的加一函数。\n\n\
    ```\n\n```\n\n虽然这会编译，但它实际上不会做任何事情，因为我们无法调用该函数。通常，lambda 函数会被赋值给变量，或者直接作为参数传递给另一个函数。\n\
    \n当赋值给变量时，加一函数可以像标准 PHP 函数一样被调用，尽管该变量受标准 PHP 作用域规则的约束。与命名函数不同，赋值给变量的 lambda 函数不会立即在其他函数或类方法中可用。\n\
    \n```\n\n```\n\n标准命名函数与赋值给变量的 lambda 之间的关键区别在于，现在它可以被传递、赋值给另一个变量，甚至可以通过对 `$add_one`\
    \ 调用 `unset()` 来销毁。\n\n```\n\n```\n\n换句话说，可以将函数就像 PHP 中的任何其他变量一样对待。所有这些特性都导致了高阶函数的创建，这将在下一节中讨论。\n\
    \n如果你有 JavaScript 经验，那么这种模式也会非常熟悉。\n\n```\n\n```\n\n在 PHP 中，你可能遇到过用于惰性加载的 lambda\
    \ 函数，例如在框架的路由系统中。另一个例子可以在备受尊敬的 `spl_autoload_register()` 中找到，它将函数作为其第一个参数：\n\n\
    ```\n\n```\n\n如你所见，它们可以被赋值给变量，但同样，它们可以直接定义在接收函数的参数中（在此例中为 `spl_autoload_register()`）：\n\
    \n```\n\n```\n\n匿名函数也称为 lambda 函数，它们带有正式名称或标识符进行声明。它们可以被赋值给变量，作为参数传递，或从函数返回。PHP\
    \ 会限制你做的一件事是序列化匿名函数，因为这会触发解析错误。借助 Jeremy Lindblom 的 SuperClosure 库，至少有一种方法可以绕过这一点。\n\
    \n在 Alonzo Church 的论文中正式化，lambda 函数是 lambda 演算的基础。它们也支撑着本书中我们将看到的所有函数式编程。在没有一等函数支持的语言中，函数式编程并不容易实现。\n\
    \n请原谅我的夸张，但几乎每一段曾经编写过的函数式代码都使用了 lambda 函数，它们是你工具箱中重要的构建块，在继续之前应该掌握它们。\n\n### Closures\n\
    \n闭包是任何函数式语言的重要特性，并被认为非常有用，以至于许多命令式语言现在也支持它们的使用。PHP 也不例外，PHP 5.3 引入了对闭包的支持。\n\n\
    闭包是 lambda 函数形式主义的逻辑扩展，通过向函数添加上下文概念，因为它们可以用于将代码和数据作为一个包来传输。可以说，闭包在函数式编程中扮演的角色类似于对象在面向对象编程中扮演的角色。事实上，在\
    \ PHP 中创建闭包实际上返回内部 PHP `Closure` 类的一个实例。\n\n更具体地说，上下文是在定义函数时附加到函数上的信息。这些信息可以是\
    \ PHP 变量，例如数组、lambda 函数、标量或对象。这是由 PHP 中的 `use` 关键字实现的，它将变量从当前作用域拉入函数，而无需将它们作为参数传递给函数——`use\
    \ ($add_value)`。\n\n```\n\n```\n\n需要注意的是，传递给闭包的值是在定义时设置的。这与全局变量不同，全局变量可以在任何地方更改，并会影响以后引用它的所有代码。如果在全局变量被更改后再次调用操作全局变量的函数，它将返回不同的值。\n\
    \n```\n\n```\n\n如果我们用闭包来做这个，那么值将在定义闭包时固定。\n\n```\n\n```\n\n这简洁地证明了对分配给 `$my_global_var`\
    \ 的值的后续更改不会影响封装在闭包中的值。这种作用域是 PHP 的全局变量和常量与其闭包之间最明显的区别。\n\n"
