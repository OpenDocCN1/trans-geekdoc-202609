    # 1 简介


    > “我对陷入如此惊人的泥沼与麻烦\[…\]深感沮丧”


    > ——Ada Lovelace（数学家，1815–1852）与 Charles Babbage（创造了第一台可编程计算机概念，1791–1871）讨论可变性时所说


    在过去大约二十年的时间里，函数式编程一直呈现出缓慢而稳定的增长。这导致许多语言采用了函数式特性，包括备受诟病的 PHP。随着计算机硬件和语言支持的改进，开始学习函数式编程的基础知识至关重要。虽然以这种风格编程确实需要改变思维方式，但你会发现，对它的某些理解也会对你的面向对象代码产生积极影响。


    让我们开始探索 PHP 语言的函数式特性之旅。


    ## 1.1 前提条件


    你必须能够访问 PHP 5.4 或更高版本，并且对目标机器拥有命令行访问权限将非常有帮助。撰写时，我使用的是基于 Debian 的机器，推荐使用类似的 POSIX
    计算机，但并非强制要求。


    学习过程中，你能做的最好的事情之一是在机器上安装一个不错的 REPL，因为它会让你在跟随示例操作时更容易进行代码实验。REPL 代表读取-求值-打印循环，基本上是一种最常用于命令行的编程环境。它允许你轻松尝试算法，而无需编辑器甚至无需文件来存放代码。在其中输入代码，按下回车，你的代码就会被执行，结果会打印在屏幕上。


    外面有很多不错的 REPL，我曾成功使用过 `PsySH`。


    如果你不想在机器上安装 REPL，可以使用在线服务 `3V4L`。


    随着我们深入探讨 PHP 中的函数式编程，我会推荐有用的 PHP 库和扩展。这些库和扩展要么通过 `Composer` 安装。


    不用说，本书并非面向初级 PHP 开发者，并假设你具备一些面向对象编程经验。话虽如此，当然，这本入门指南尽可能温和，代表了 PHP 函数式编程的初学者指南。


    ## 1.2 要求


    ### PHP


    * `PHP 5.4+`（某些库可能需要更高版本）


    ### 其他软件：


    * 依赖管理：`Composer`


    * 扩展/库：`functional-php`


    * 库：`React/Partial`


    * 库：`nicmart/Functionals`


    ## 1.3 旧版 PHP 用户


    当然可以使用 PHP 5.3.2 或更高版本编写函数式代码并阅读本书的大部分内容——本书第一版实际上就是使用与 5.3.2 兼容的 PHP 编写的。不过，你可能需要对代码做一些调整，以确保你不会访问所安装
    PHP 版本中不存在的功能。


    短数组语法几乎无疑是你会遇到的第一个语法差异，幸运的是，它在旧版 PHP 上的适应非常简单。短数组语法如下示例所示：


    ```


    ```


    在低于 5.4 版本的 PHP 中实现时，它将简单地转换为以下代码：


    ```


    ```


    ## 1.4 安装


    本书的某些章节要求你在继续使用提供的示例之前安装额外的软件。这相对容易，但这里还是有必要进行一些介绍。在这些额外的实用工具中，有些是运行时环境，另一些是库和扩展。


    库是使用 PHP 用户空间代码编写的，运行速度往往较慢，但 PHP 开发者更容易参与贡献和维护。它们通常是可以使用原生 PHP 代码调用和 require
    语句实现的代码包。我们将使用 `Composer` 来大大简化安装这些代码包所需的步骤。


    在性能和安装难度方面，下一步是 PHP 扩展。通常，这些扩展来自 PECL 扩展仓库，尽管任何人也可以在 PECL 结构之外自行发布扩展。从 PECL 网站选择的扩展通常更有可能在被批准列出之前，经过
    PHP 核心开发者的代码审查。


    最后，我们还有与 PHP 相关的其他运行时环境；在本书中，我们将坚持使用 Facebook 实现的 HipHop Virtual Machine，简称 `HHVM`。这个运行时环境不仅通过即时编译带来了比原生
    PHP 更好的性能，还通过 Hack 语言扩展了 PHP，以提供一系列有用的功能。


    如所讨论，这些额外的软件大部分相对容易安装，因此对于这组说明，我将假设你正在使用，或可以访问基于 Debian 的 Linux 安装。一个带有最新版 Ubuntu
    的 Vagrant 盒子也可以轻松满足此要求。


    ### PHP 库


    使用 `Composer` 取代了日渐老化的 `PEAR` 仓库，安装 PHP 库从未如此简单。这带来了诸如可以列出包并随时发布等好处。相反，也有缺点，例如糟糕的包会与好的包一起被列出。此外，`PEAR`
    有一个包需要遵循的代码风格指南；而使用 `Composer` 则允许任何风格。话虽如此，许多库已自愿采用了 `PSR-1`。


    你通常可以简单下载包的 tarball 并将其解压到目录中，然后手动使用 `require` 语句引入文件。不过，这种做法不被鼓励，应优先使用 `Composer`
    提供的自动化功能。


    `Composer` 是一个 PHP phar 存档，你可以通过互联网使用两条命令轻松安装。


    ```


    ```


    现在你可以通过命令行在机器上的任何地方访问 `Composer`，只需输入 `composer` 即可。


    要创建一个新的 `Composer` 支持的项目，你可以调用 `composer init`，它将运行一个向导来配置你的第一个 `composer.json`
    文件。完成后，你可以通过直接编辑 `composer.json` 文件或使用命令行界面，轻松为你的应用程序指定依赖项。


    ```


    ```


    这里 `vendor` 是供应商命名空间，例如 `symfony`、`treffynnon` 或 `j4mie`，而 `package` 是包命名空间，例如
    `silex`、`paris` 或 `idiorm`。冒号后，你可以指定希望使用的库版本，或你的项目实现的版本。


    或者，如果你不知道感兴趣的包的名称，可以通过不带任何参数调用 `composer require` 以交互方式搜索它。


    一旦你的 `Composer` 文件中指定了所有要求，你可以将其提交到版本控制中，然后在任何希望运行项目的地方，只需调用 `composer install`，`composer`
    就会自动安装你指定的所有依赖项。


    除了这些依赖管理功能外，`Composer` 还使从其中自动加载项目变得容易。你只需要在项目的核心/引导文件顶部包含一个 require 语句即可。


    ```


