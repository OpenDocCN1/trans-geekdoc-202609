- raw: "With this very simple example out of the way we can move onto a more useful\
    \ pipeline that can operate on a list of values below. It first maps over the\
    \ list of data and then passes it into `pipeline()` defined earlier.\n\n```\n\
    function pipeline_list($functions, $list_data) {\n   return array_map(function($data)\
    \ use ($functions) {\n      return call_user_func_array(\n         'pipeline',\n\
    \         array_merge([$data], $functions)\n      );\n   }, $list_data);\n}\n\
    ```\n\nWhen given a list of string values the `pipeline_list()` function can iterate\
    \ over them and execute the list of functions in Listing 6.5.\n\n**Listing 6.5**\n\
    \n```\n\n```\n\nIf you need a simple way of applying a series of functions to\
    \ a value or a list of values then a pipeline could be a good way of keeping your\
    \ code a little neater. It’s easier to see a list of functions in the order they\
    \ will be applied rather than reading a series of consecutive functions from the\
    \ inside out as well.\n\n## 6.7 Pattern Matching\n\nA feature of many functional\
    \ programming languages is the ability to pattern match input and produce different\
    \ outcomes based upon that. In some ways it could be thought of as a more powerful\
    \ `switch` statement in PHP. The parser will start with the top match and work\
    \ its way down until it finds the first pattern that matches.\n\nPHP does not\
    \ ship with a feature like this by default so we will have to implement one ourselves,\
    \ which is actually easier than it might seem. It will have some shortcomings\
    \ and it certainly won’t be as pretty or powerful as those you get to use in Scala\
    \ or Haskell, but they are useful and that is why they are important to this book.\n\
    \nTo make the process of understanding this easier, we will start with how a pattern\
    \ will look and then move onto the actual implementation details later. The first\
    \ thing that is important to a pattern is the value it will operate on. We will\
    \ set this as the first function argument. In addition, we also need to specify\
    \ the patterns this value should be tested against and—should it match—what the\
    \ outcome or action should be.\n\nKeeping the pattern syntax simple and clean\
    \ is difficult in PHP, but array notation gives us a nice look with `=>` that\
    \ could be analogous to `then`. This gives the definition meaning; if `matched`\
    \ `=>` `do this`.\n\n```\n\n```\n\nThe pattern in the example above is relatively\
    \ simple—the value to operate on is an instance of `stdClass()`, which is passed\
    \ in as the first argument to `pattern`. The second argument is the list of patterns\
    \ to test it against.\n\nAs it works through the patterns, the parser will execute\
    \ each test (the array keys) against the value (`stdClass`). Where the test returns\
    \ `true`, the value of the matching element in the array in the array will be\
    \ returned or executed if it is a `callable`. Make sure that you put the more\
    \ specific patterns first in the list of patterns passed to the function.\n\n\
    In this case it will run through the following assessment process under the covers:\n\
    \n1.  `is_string(stdClass)`—evaluates to false as `stdClass` is an object\n\n\
    2.  `is_a(stdClass, 'stdClass')`—evaluates to `true` and assessment is halted\n\
    \n3.  returns the string `it is a stdClass`\n\nWere it not to have matched against\
    \ the first two then it would of moved onto the default `_` pattern, which matches\
    \ anything. This is the same character as used by both Scala and Haskell in their\
    \ pattern matching syntax to indicate a default.\n\nNow you have seen example\
    \ and understand how it is supposed to work. We need to actually implement the\
    \ `pattern()` function.\n\n```\n\n```\n\nAs previously discussed, the pattern\
    \ function accepts the value to operate against first and as its second argument\
    \ it will accept and array of patterns. These should be given in a format where\
    \ the array key is the pattern or test and the array value is the desired output\
    \ or a `callable` that will return the desired output.\n\nWorking through the\
    \ supplied pattern list in order the function will apply the pattern or test to\
    \ the supplied value (`$data`) and where it matches it will return the specified\
    \ result.\n\nGiven our requirements for pattern matching there are a few tests\
    \ we will need to support in the `pattern_exec_test()` function and order is important\
    \ here too. Where the given pattern is a string containing:\n\n| Pattern || Matches\
    \ || Test performed |\n\n| --- | --- | --- |\n\n| `_` || Any value || Any value\
    \ is accepted so we just return true to short circuit the matching process. Use\
    \ this to specify a default match. |\n\n| --- | --- | --- |\n\n| `stdClass`, `MyNamespace\\\
    ExampleClass`, `MyNamespace\\ExampleInterface`, etc. || Against a class or interface\
    \ name || Checks `$data` is an object and if so whether it matches the specified\
    \ class or interface (eg. `ExampleInterface`) using PHP’s `is_a()` function. |\n\
    \n| `is_string`, `is_bool`, etc or an anonymous function or closure || Any callable\
    \ || If the pattern is considered a `callable` by PHP then call it against the\
    \ supplied value (`$data`). Note that `$data` is passed as the first and only\
    \ argument to the `callable` so you will need to use partial function application\
    \ to use functions that do not meet this requirement. As an example a pattern\
    \ of `is_string` would become a function call of `is_string($data)`. |\n\n| `a\
    \ string` || Compares as string || A simple `===` equality check between the supplied\
    \ value (`$data`) and a string literal. For example `'a string' === $data`. |\n\
    \nTo match these rules of assessment we will need a simple function like:\n\n\
    ```\n\n```\n\nHopefully, this is easy to understand and interpret using the table\
    \ shown earlier.\n\nFinally we get to the `pattern_exec_result()` function, which\
    \ is called when a pattern is matched. This function will be given either a string\
    \ or a `callable` as it’s first parameter and the original specified value (`$data`)\
    \ as its second argument. If it is a `callable` then it will apply the `callable`\
    \ to `$data` and return the result. Otherwise it will simple return the result\
    \ as it was supplied.\n\n```\n\n```\n\nThis provides simple pattern matching,\
    \ but it is also inherently naive and there are a few rough edges given the input\
    \ must be a string. As a simple example of one of these, imagine if you wanted\
    \ to test against a string literal of `is_string` or `_`—you cannot because they\
    \ are special values (a `callable` and a special value to `pattern()` respectively).\
    \ Of course you can solve these issues in a few ways, but in the interests of\
    \ keeping these examples simple and clearly communicating the principles, it is\
    \ left to you, dear reader, to do so.\n\nEven with these limitations, it is possible\
    \ to write some shorter and potentially clearer code using this method. To help\
    \ understand how this might be done, we will finish up with a couple of worked\
    \ examples where `pattern()` is put to some use.\n\nFirst, a string matcher that\
    \ transforms the value by applying `ucfirst()` to the specified value (`functional\
    \ php`).\n\n```\n\n```\n\nThe following example demonstrates the default properties\
    \ of the special `_` string.\n\n```\n\n```\n\nGiven that a `DateTimeImmutable()`\
    \ will not match `stdClass` or an `is_string()` test then it will fall back to\
    \ the default `_`.\n\nYou can use the `pattern()` function to test the type of\
    \ a supplied value and then apply transformations to it or return a static value.\
    \ This gives you a simple and clean interface for performing these kinds of operations\
    \ with out polluting your code with `if-else` hell or switch statements.\n\n##\
    \ 6.8 Functors\n\nWe have already seen PHP’s functors using the `__invoke()` method\
    \ in a class, but as we also discovered, this is merely an object function and\
    \ not a true functor. To understand what constitutes a functor, we must delve\
    \ a little deeper into the theory. Simple values can have a function applied to\
    \ them with little fuss:\n\n```\n\n```"
