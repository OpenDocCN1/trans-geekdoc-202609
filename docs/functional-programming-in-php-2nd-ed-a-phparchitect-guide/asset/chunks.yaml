- raw: "So far, we have covered what is known as direct recursion—where a function\
    \ calls itself to create the loop. For example, if function `x()` calls `x()`\
    \ itself, then it is direct recursion.\n\nYou can also implement indirect recursion\
    \ (sometimes known as mutual recursion by extension) to produce a loop by creating\
    \ a function, which later calls the original function again. This is where function\
    \ `x()` calls function `y()`, which subsequently calls `x()` again, and the loop\
    \ repeats itself from there.\n\n### Recursive Lambdas\n\nOn the face of it lambdas\
    \ do not appear to be able to call themselves, but depending on the version of\
    \ PHP you are running there are a few relatively simple ways of doing it.\n\n\
    The most obvious way is to pass the variable; a lambda is assigned to into itself\
    \ with the `use` keyword. Seems simple and you have probably already thought of\
    \ using it this way, but having tried it you may well be disappointed by a nondescript\
    \ PHP error.\n\nSurprisingly, the variable must actually be passed by reference\
    \ for the operation to have any chance of succeeding. This is because at the point\
    \ the variable is fed into the lambda it has not been defined (the lambda that\
    \ is) and its value, therefore, is still `null`. When the variable is passed by\
    \ reference it does not matter its value is `null` because it will be updated\
    \ with a reference to the lambda function once the parser finishes executing its\
    \ definition.\n\n```\n\n```\n\nWhile passing by reference avoids the issue, it\
    \ also breaks the standard definition of an anonymous function. If you were to\
    \ later modify a variable passed by reference, it would change inside the lambda\
    \ too. This is counter intuitive as this is not how lambdas work by default and\
    \ you are also allowing global mutable state into your application.\n\nIf you\
    \ have used a function object then it gets even easier as `$this` is there to\
    \ help you make the recursive calls without any by-reference nastiness. The next\
    \ code sample is solving the same problem as the previous code example, but with\
    \ a function object instead.\n\n```\n\n```\n\nWhile the code is longer in this\
    \ case, it does remove the rather horrible after taste left behind by the shared\
    \ mutable state introduced by the `use` keyword.\n\nThe need to recurse a lambda\
    \ crops up rarely in my experience and there are generally other options, but\
    \ when you need it these tricks can really help.\n\n### Don’t Blow the Stack\n\
    \nRecursive loops are powerful, but there are a few things to be mindful of when\
    \ implementing them in your code. If you fail to include an exit condition, or\
    \ if you choose one that is overly broad, you run the risk of unexpected behavior.\
    \ Usually, this manifests itself as a stack overflow exception.\n\nThe compiler\
    \ will keep looping until something stops it, so if you or the time out protections\
    \ do not stop it, the final limitation is the machine’s physical resources. In\
    \ this case, it will most likely be the memory limitations that you come up against\
    \ first.\n\nBear in mind all calls, parameters, and variable assignments in a\
    \ recursive call have an impact on the amount of memory consumed. For example,\
    \ your process will run out of memory more quickly when you have debugging code\
    \ inside of it!\n\n## 3.5 Map, Reduce, and Filter\n\nMap/reduce provides a simple\
    \ way to create elegant code solutions to complex list processing operations,\
    \ and it has proven useful for high-availability, large-scale processing. You\
    \ may have heard of Hadoop, CouchDB, and similar NoSQL solutions implementing\
    \ map/reduce—not to mention Google’s indexing algorithm. Using `array_map()` and\
    \ `array_reduce()`, it is also possible to exploit these techniques with PHP.\n\
    \n### Map\n\nMap iterates over a set of data to produce a new list of values by\
    \ applying a function to each item in the list. Most `for` and `foreach` loops\
    \ can easily be replaced with a call to `array_map()`. The key difference is it\
    \ separates the computational function from the loop itself.\n\nOf course, this\
    \ easily lends itself to code re-use where you may need to apply the same operation\
    \ to a list in a different context.\n\nOn the other hand, in PHP at least, it\
    \ is slightly slower to use `array_map()` than employing `foreach`, but unless\
    \ you are the kind of developer to fret over micro-optimizations, the difference\
    \ is negligible.\n\n```\n\n```\n\nAn interesting thought for you now—the list\
    \ could contain functions and not just primitive values. You could use `array_map()`\
    \ to execute all the functions contained in an array and return all their values,\
    \ for example.\n\n### Reduce\n\nReduce, on the other hand, loops over a list to\
    \ collapse or combine the values therein into one final value by applying the\
    \ same processing function to each value in the list. This operation is sometimes\
    \ known as a fold function, and the PHP `array_reduce()` function can be considered\
    \ analogous to a left fold.\n\nIn the following reduce example, you can see it\
    \ operates on a list of integers and adds each element to a total. This is an\
    \ iterative process which works upon one element in the array at a time.\n\n```\n\
    \n```\n\n### In Tandem\n\nOf course, these two techniques can be combined to great\
    \ effect. If you were to have a set containing a list of documents, you could\
    \ use a mapping function to iterate through each one and calculate its file size\
    \ on disk. In addition, it would be great to know the total file size so you could\
    \ use a reduce function to iterate over the file sizes and sum them up, reusing\
    \ the `sum()` function created above.\n\n```\n\n```\n\nHere you have seen `array_reduce()`\
    \ directly working upon the array result returned by `array_map()`. It is a very\
    \ simple example, but you can use these two operations to easily work through\
    \ lists, large or small.\n\nYou may have noticed a highly irritating fact about\
    \ PHP’s implementation of these two little functions—they don’t maintain the same\
    \ parameter order! Reduce accepts the collection (or array) first and then the\
    \ callback function, whereas map is the opposite way around.\n\n### Gimme the\
    \ Keys!\n\nThe difficulty with both map and reduce in PHP is there is no access\
    \ to the array key. The only real way to remedy this is to write your own implementation.\
    \ There is another function which is very similar to map called `array_walk()`.\
    \ While this does supply the key, it also mutates the array it is working on—yuck!\n\
    \nSo the logical response is to wrap `array_walk()` in a custom function we will\
    \ call `map2()`. This function ensures a copy of the array is fed to `array_walk()`\
    \ so the state of the array passed into it is not mutated as calling `array_walk()`\
    \ directly would.\n\nAs PHP passes arrays by value and not reference the copy\
    \ of the array is automatically created for us simply by wrapping `array_walk()`\
    \ in another function. This should mean that `map2()` is actually a very simple\
    \ enhancement to create.\n\nWell not so fast, the code below includes a closure\
    \ which performs two extra actions. The first item of business is to fix the order\
    \ the key and value are injected into the `map2()` callback function. On top of\
    \ this, it handles the translation of the `return` clause in `map2()`s to an `array_walk()`\
    \ value assignment via reference.\n\n```\n\n```\n\nThis makes the callback function\
    \ behave much more like an `array_map()` callback and in a more functional way.\
    \ You could also use recursion to solve this problem:\n\n```\n\n```\n\nAnother\
    \ recursive method making use of a tracking/carry variable to maintain the state\
    \ is implemented above. Note that all three methods are functionally equivalent\
    \ and produce the same result when given the same values as arguments.\n\n**Listing\
    \ 3.12**\n\n```\n\n```\n\nThese functions can then be used much like `array_map()`\
    \ to apply a function to each item in an array, but the `$func` will be passed\
    \ both the key and the value.\n\n```\n\n```\n\nIf you call `var_dump($out)` you\
    \ see:\n\n```\narray(3) {\n  'one' =>\n  string(9) \"one: PAIL\"\n  'two' =>\n\
    \  string(11) \"two: BUCKET\"\n  'three' =>\n  string(10) \"three: HOD\"\n}\n\
    ```"
