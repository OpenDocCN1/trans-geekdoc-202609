- raw: "As of PHP 7 a new RFC was merged into the core of the language to offer scalar\
    \ type hinting. This is a big step in the right direction for the language so\
    \ it was fantastic news when it survived the RFC voting process overcoming significant\
    \ opposition. PHP developers have been waiting for such a feature to arrive for\
    \ many years and despite previous attempts, it has never made it into the language\
    \ before.\n\nThis new feature set covers the types `int`, `float`, `string` and\
    \ `bool` allowing them to be used in the same way as we have seen classes, interfaces,\
    \ `array`, and `callable` used already. A half implemented core language feature\
    \ has finally moved towards completion.\n\nIn addition to these type hints it\
    \ is also possible to indicate that you want strict type checking. If activated,\
    \ the parser will throw an `E_RECOVERABLE_ERROR` when incorrect types are passed\
    \ in as parameters to the function. As you would expect I recommend you always\
    \ develop with strict types enabled to assist you in a creating more robust code.\
    \ It can be activated by simply including the following at the top of your file:\n\
    \n```\n\n```\n\nAll function calls in that file will now be treated in a strict\
    \ manner.\n\nBy default, all PHP files are parsed in weak typed checking mode\
    \ so you will have to declare this atop every file. Perhaps a macro in your IDE\
    \ on new file creation to automatically add this declaration would keep you from\
    \ forgetting to add this vital ingredient.\n\nWith the declaration in place the\
    \ PHP parser will help you maintain your code by alerting you to type mismatches\
    \ and violations. This flies in the face of PHP’s traditional approach of automatically\
    \ coalescing all values to the correct type where possible. While this does take\
    \ a “run at all costs” approach, it means poorly written code will still work\
    \ allowing simple bugs to go undetected.\n\nA function may be declared with type\
    \ hints against its parameters to cause the PHP parser to check the type of the\
    \ value passed to the function. In strict mode, an error will be thrown if the\
    \ types do not match. In the more permissive mode, the PHP engine will cast the\
    \ arguments to the desired types. In previous versions of PHP you would have had\
    \ to do this yourself using `gettype` or similar.\n\n```\n\n```\n\nIt is trivially\
    \ easy to accidentally reverse the parameters of a function when calling it, so\
    \ this simple parser error checking helps to catch it. Obviously if both parameters\
    \ are of the same type then this will not help you! You can see the sort of bug\
    \ this will help you to avoid though.\n\n### Return Type Declarations\n\nAlso\
    \ in PHP 7 another RFC was merged called return type declarations, which compliments\
    \ the scalar type hints RFC excellently. It allows you to declare the type that\
    \ should be returned from a function. The parser does not require a type to be\
    \ defined on a function return value, but much like the strict declaration in\
    \ scalar type hints I would suggest it is good practice to do so.\n\nTo specify\
    \ a return type you simply add a colon after the closing parenthesis of the function\
    \ and then include the expected type keyword such as `int` or `array`.\n\nYou\
    \ can also declare classes or interfaces you have written yourself as return types\
    \ much like you can with function arguments.\n\n```\n\n```\n\nIt is not currently\
    \ possible to have multiple return types for a function. This means you cannot\
    \ say, return an `int` on success or `null` on failure for example—it must be\
    \ one or the other. Again, much like with the scalar type hints if there is a\
    \ type mismatch then an `E_RECOVERABLE_ERROR` will be triggered.\n\nThis brings\
    \ more powerful type checking to PHP along with a reduction in bugs. It also makes\
    \ the code easier to reason about and assemble in your mind when you come back\
    \ to it. Finally, IDE’s and other tools can be smarter when inspecting the code\
    \ you write.\n\nWhere possible, ensure you declare strict mode for type hints\
    \ and make sure you include a return type declaration. This will help to make\
    \ sure you enjoy the benefits of these PHP 7 features. There are some limitations\
    \ too, but if you are writing good code then you shouldn’t run into them. Use\
    \ it for its strengths and you will be a happier developer than yesterday.\n\n\
    In Listing 10.1 I have included a few examples of how this can be used to great\
    \ effect.\n\n**Listing 10.1**\n\n```\n\n```\n\nSome of the silly errors caught\
    \ by the parser in Listing 10.1 are easy to miss and cause programs to malfunction\
    \ unexpectedly. Enabling type hinting and adding return type declarations can\
    \ help to ensure this does not happen.\n\nAs mentioned previously there are a\
    \ host of other improvements to the language and the Zend runtime itself. These\
    \ include new features and, frankly amazing performance enhancements. There are\
    \ so many reasons to upgrade; hopefully it will be deployed to PAAS and hosts\
    \ around the world quickly as this is, of course, the best release yet.\n\n###\
    \ Namespace Group Syntax\n\nWith PHP 7 the namespace syntax has been expanded\
    \ to include group `use` statements that greatly reduce the amount of typing required.\
    \ It comes into play when you want to specify multiple namespaces you want to\
    \ use from the same parent namespace.\n\nTo make this simpler let us assume we\
    \ have a namespace `\\Treffynnon\\FunctionalPhp` and underneath that the following\
    \ classes:\n\n1.  `Html`\n\n2.  `Date`\n\n3.  `Blog`\n\n4.  `ShoppingList`\n\n\
    Rendering a blog post requires the first, second, and third classes, but not the\
    \ last. We would use group statements to pull in just those items we want:\n\n\
    ```\n\n```\n\nWhile this feature will inevitably have limited use it is handy\
    \ to know of and could save you some effort when dealing with PHP’s clumsy namespace\
    \ syntax.\n\n### Closure Calls\n\nIn PHP 7 closure behavior in the language has\
    \ been augmented with bind at call time execution. As mentioned earlier PHP 5\
    \ has the `bind` and `bindTo` methods, but they must be called before execution.\
    \ This can create unnecessary lines of code the new `call` method dispenses with\
    \ in favor of binding the closure to the class at call time.\n\n```\n\n```\n\n\
    The previous example provides a neater and simpler method of calling closures\
    \ in a bound state.\n\n## 10.5 Further into the Future\n\nWhile it is difficult\
    \ to tell what will be accepted into future versions of PHP beyond that of the\
    \ RFCs which have completed votes against them, there has been some discussion\
    \ on the PHP internals list\n\nNikita Popov has provided a patch\n\n```\n\n```\n\
    \nIt would also be possible to filter records to return only records which have\
    \ the registration number of `DG44-001`:\n\n```\n\n```\n\nThe final advantage\
    \ is the ability for the system to work on nested `foreach` statements like so\
    \ (example taken directly from Nikita’s introductory email) reproduced in Listing\
    \ 10.2.\n\n**Listing 10.2**\n\n```\n\n```\n\nAs you can see, this is a powerful\
    \ feature that would make operating on arrays in PHP far easier, and given their\
    \ succinct nature coupled with a stateless operation, they would make a good addition\
    \ to the functional programming toolkit.\n\nAs PHP moves into the future, it looks\
    \ like the new versions will add more features and functions which should help\
    \ to make functional programming a solid reality in PHP.\n\n* * *\n\n1.  [Callable\
    \ Type](http://php.net/language.types.callable)[↩](#ch013.xhtml#fnref1)\n\n2.\
    \  [class member access using `__invoke()` in php5.4](https://bugs.php.net/bug.php?id=63253)[↩](#ch013.xhtml#fnref2)\n\
    \n3.  [Variadics RFC](https://wiki.php.net/rfc/variadic)[↩](#ch013.xhtml#fnref3)\n\
    \n4.  [\\[PHP-DEV\\] List comprehensions and generator expressions for PHP](http://markmail.org/thread/uvendztpe2rrwiif)[↩](#ch013.xhtml#fnref4)\n\
    \n5.  [addListComprehensions Branch](https://github.com/nikic/php-src/tree/addListComprehensions)[↩](#ch013.xhtml#fnref5)\n\
    \n# 11 Conclusion\n\n> “Functional programming is ‘just another tool’ in the sense\
    \ that being honest is a technique in addition to just making things up.”\n\n\
    > \n\n> —Rúnar Bjarnason (Functional programmer, @runarorama)"
  fmt: "\n# PHP 7 新特性概述\n\nAs of PHP 7 a new RFC was merged into the core of the language\
    \ to offer scalar type hinting. This is a big step in the right direction for\
    \ the language so it was fantastic news when it survived the RFC voting process\
    \ overcoming significant opposition. PHP developers have been waiting for such\
    \ a feature to arrive for many years and despite previous attempts, it has never\
    \ made it into the language before.\n\nThis new feature set covers the types `int`,\
    \ `float`, `string` and `bool` allowing them to be used in the same way as we\
    \ have seen classes, interfaces, `array`, and `callable` used already. A half\
    \ implemented core language feature has finally moved towards completion.\n\n\
    In addition to these type hints it is also possible to indicate that you want\
    \ strict type checking. If activated, the parser will throw an `E_RECOVERABLE_ERROR`\
    \ when incorrect types are passed in as parameters to the function. As you would\
    \ expect I recommend you always develop with strict types enabled to assist you\
    \ in a creating more robust code. It can be activated by simply including the\
    \ following at the top of your file:\n\n```\ndeclare(strict_types=1);\n```\n\n\
    All function calls in that file will now be treated in a strict manner.\n\nBy\
    \ default, all PHP files are parsed in weak typed checking mode so you will have\
    \ to declare this atop every file. Perhaps a macro in your IDE on new file creation\
    \ to automatically add this declaration would keep you from forgetting to add\
    \ this vital ingredient.\n\nWith the declaration in place the PHP parser will\
    \ help you maintain your code by alerting you to type mismatches and violations.\
    \ This flies in the face of PHP’s traditional approach of automatically coalescing\
    \ all values to the correct type where possible. While this does take a “run at\
    \ all costs” approach, it means poorly written code will still work allowing simple\
    \ bugs to go undetected.\n\nA function may be declared with type hints against\
    \ its parameters to cause the PHP parser to check the type of the value passed\
    \ to the function. In strict mode, an error will be thrown if the types do not\
    \ match. In the more permissive mode, the PHP engine will cast the arguments to\
    \ the desired types. In previous versions of PHP you would have had to do this\
    \ yourself using `gettype` or similar.\n\n```\nfunction add(int $a, int $b): int\
    \ {\n    return $a + $b;\n}\n```\n\nIt is trivially easy to accidentally reverse\
    \ the parameters of a function when calling it, so this simple parser error checking\
    \ helps to catch it. Obviously if both parameters are of the same type then this\
    \ will not help you! You can see the sort of bug this will help you to avoid though.\n\
    \n## Return Type Declarations\n\nAlso in PHP 7 another RFC was merged called return\
    \ type declarations, which compliments the scalar type hints RFC excellently.\
    \ It allows you to declare the type that should be returned from a function. The\
    \ parser does not require a type to be defined on a function return value, but\
    \ much like the strict declaration in scalar type hints I would suggest it is\
    \ good practice to do so.\n\nTo specify a return type you simply add a colon after\
    \ the closing parenthesis of the function and then include the expected type keyword\
    \ such as `int` or `array`.\n\nYou can also declare classes or interfaces you\
    \ have written yourself as return types much like you can with function arguments.\n\
    \n```\nfunction getUser(): User {\n    // ...\n}\n```\n\nIt is not currently possible\
    \ to have multiple return types for a function. This means you cannot say, return\
    \ an `int` on success or `null` on failure for example—it must be one or the other.\
    \ Again, much like with the scalar type hints if there is a type mismatch then\
    \ an `E_RECOVERABLE_ERROR` will be triggered.\n\nThis brings more powerful type\
    \ checking to PHP along with a reduction in bugs. It also makes the code easier\
    \ to reason about and assemble in your mind when you come back to it. Finally,\
    \ IDE’s and other tools can be smarter when inspecting the code you write.\n\n\
    Where possible, ensure you declare strict mode for type hints and make sure you\
    \ include a return type declaration. This will help to make sure you enjoy the\
    \ benefits of these PHP 7 features. There are some limitations too, but if you\
    \ are writing good code then you shouldn’t run into them. Use it for its strengths\
    \ and you will be a happier developer than yesterday.\n\nIn Listing 10.1 I have\
    \ included a few examples of how this can be used to great effect.\n\n**Listing\
    \ 10.1**\n\n```\ndeclare(strict_types=1);\n\nfunction add(int $a, int $b): int\
    \ {\n    return $a + $b;\n}\n\necho add(1, 2);\n```\n\nSome of the silly errors\
    \ caught by the parser in Listing 10.1 are easy to miss and cause programs to\
    \ malfunction unexpectedly. Enabling type hinting and adding return type declarations\
    \ can help to ensure this does not happen.\n\nAs mentioned previously there are\
    \ a host of other improvements to the language and the Zend runtime itself. These\
    \ include new features and, frankly amazing performance enhancements. There are\
    \ so many reasons to upgrade; hopefully it will be deployed to PAAS and hosts\
    \ around the world quickly as this is, of course, the best release yet.\n\n##\
    \ Namespace Group Syntax\n\nWith PHP 7 the namespace syntax has been expanded\
    \ to include group `use` statements that greatly reduce the amount of typing required.\
    \ It comes into play when you want to specify multiple namespaces you want to\
    \ use from the same parent namespace.\n\nTo make this simpler let us assume we\
    \ have a namespace `\\Treffynnon\\FunctionalPhp` and underneath that the following\
    \ classes:\n\n1. `Html`\n2. `Date`\n3. `Blog`\n4. `ShoppingList`\n\nRendering\
    \ a blog post requires the first, second, and third classes, but not the last.\
    \ We would use group statements to pull in just those items we want:\n\n```\n\
    use \\Treffynnon\\FunctionalPhp\\{Html, Date, Blog};\n```\n\nWhile this feature\
    \ will inevitably have limited use it is handy to know of and could save you some\
    \ effort when dealing with PHP’s clumsy namespace syntax.\n\n## Closure Calls\n\
    \nIn PHP 7 closure behavior in the language has been augmented with bind at call\
    \ time execution. As mentioned earlier PHP 5 has the `bind` and `bindTo` methods,\
    \ but they must be called before execution. This can create unnecessary lines\
    \ of code the new `call` method dispenses with in favor of binding the closure\
    \ to the class at call time.\n\n```\n$closure = function() {\n    return $this->value;\n\
    };\n$closure->call($object);\n```\n\nThe previous example provides a neater and\
    \ simpler method of calling closures in a bound state.\n\n## 10.5 Further into\
    \ the Future\n\nWhile it is difficult to tell what will be accepted into future\
    \ versions of PHP beyond that of the RFCs which have completed votes against them,\
    \ there has been some discussion on the PHP internals list\n\nNikita Popov has\
    \ provided a patch\n\n```\nfunction example(array $data): array {\n    return\
    \ array_map(fn($item) => $item * 2, $data);\n}\n```\n\nIt would also be possible\
    \ to filter records to return only records which have the registration number\
    \ of `DG44-001`:\n\n```\n$records = array_filter($records, fn($record) => $record->reg\
    \ === 'DG44-001');\n```\n\nThe final advantage is the ability for the system to\
    \ work on nested `foreach` statements like so (example taken directly from Nikita’s\
    \ introductory email) reproduced in Listing 10.2.\n\n**Listing 10.2**\n\n```\n\
    foreach ($data as $row) {\n    foreach ($row as $cell) {\n        // process $cell\n\
    \    }\n}\n```\n\nAs you can see, this is a powerful feature that would make operating\
    \ on arrays in PHP far easier, and given their succinct nature coupled with a\
    \ stateless operation, they would make a good addition to the functional programming\
    \ toolkit.\n\nAs PHP moves into the future, it looks like the new versions will\
    \ add more features and functions which should help to make functional programming\
    \ a solid reality in PHP.\n\n* * *\n\n1. [Callable Type](http://php.net/language.types.callable)[↩](#ch013.xhtml#fnref1)\n\
    2. [class member access using `__invoke()` in php5.4](https://bugs.php.net/bug.php?id=63253)[↩](#ch013.xhtml#fnref2)\n\
    3. [Variadics RFC](https://wiki.php.net/rfc/variadic)[↩](#ch013.xhtml#fnref3)\n\
    4. [[PHP-DEV] List comprehensions and generator expressions for PHP](http://markmail.org/thread/uvendztpe2rrwiif)[↩](#ch013.xhtml#fnref4)\n\
    5. [addListComprehensions Branch](https://github.com/nikic/php-src/tree/addListComprehensions)[↩](#ch013.xhtml#fnref5)\n\
    \n# 11 Conclusion\n\n> “Functional programming is ‘just another tool’ in the sense\
    \ that being honest is a technique in addition to just making things up.”\n\n\
    >\n\n> —Rúnar Bjarnason (Functional programmer, @runarorama)\n"
  trans: "\n\n# PHP 7 新特性概述\n\n从 PHP 7 开始，一项新的 RFC 被合并到语言核心中，以提供标量类型提示。这是语言朝着正确方向迈出的一大步，因此当它在\
    \ RFC 投票过程中克服重大反对意见并通过时，这是个绝佳的消息。PHP 开发者们多年来一直在等待这样一个功能的到来，尽管之前有过尝试，但它从未进入过语言。\n\
    \n这个新功能集涵盖了 `int`、`float`、`string` 和 `bool` 类型，允许它们像我们已经看到的类、接口、`array` 和 `callable`\
    \ 一样使用。一个半实现的核心语言功能终于走向了完成。\n\n除了这些类型提示之外，还可以指示你希望进行严格类型检查。如果激活，当错误的类型作为参数传递给函数时，解析器会抛出\
    \ `E_RECOVERABLE_ERROR`。正如你所期望的那样，我建议你始终在启用严格类型的情况下进行开发，以帮助你创建更健壮的代码。它可以通过在文件顶部简单地包含以下内容来激活：\n\
    \n```\ndeclare(strict_types=1);\n```\n\n该文件中的所有函数调用现在都将以严格方式处理。\n\n默认情况下，所有 PHP\
    \ 文件都以弱类型检查模式解析，因此你需要在每个文件顶部声明这一点。也许在你的 IDE 中为新文件创建一个宏，以自动添加此声明，可以防止你忘记添加这个至关重要的要素。\n\
    \n有了声明，PHP 解析器将通过提醒你类型不匹配和违规情况来帮助你维护代码。这与 PHP 传统的尽可能自动将所有值合并为正确类型的方法背道而驰。虽然这确实采取了“不惜一切代价运行”的方法，但这意味着编写不良的代码仍然可以工作，允许简单的错误不被发现。\n\
    \n可以在函数的参数上声明类型提示，以导致 PHP 解析器检查传递给函数的值的类型。在严格模式下，如果类型不匹配，将抛出错误。在更宽松的模式下，PHP 引擎将参数转换为所需的类型。在\
    \ PHP 的早期版本中，你必须使用 `gettype` 或类似工具自己完成此操作。\n\n```\nfunction add(int $a, int $b):\
    \ int {\n    return $a + $b;\n}\n```\n\n在调用函数时不小心颠倒参数是非常容易的，因此这种简单的解析器错误检查有助于捕捉它。显然，如果两个参数都是相同的类型，这将无法帮助你！不过，你可以看到这将帮助你避免的那种错误。\n\
    \n## 返回类型声明\n\n在 PHP 7 中，另一个名为返回类型声明的 RFC 也被合并，它与标量类型提示 RFC 完美互补。它允许你声明函数应该返回的类型。解析器不要求函数返回值上定义类型，但就像标量类型提示中的严格声明一样，我建议这样做是良好的做法。\n\
    \n要指定返回类型，只需在函数的右括号后添加一个冒号，然后包含预期的类型关键字，例如 `int` 或 `array`。\n\n你还可以声明你自己编写的类或接口作为返回类型，就像你可以对函数参数所做的那样。\n\
    \n```\nfunction getUser(): User {\n    // ...\n}\n```\n\n目前不可能为函数指定多个返回类型。这意味着你不能说，成功时返回\
    \ `int`，失败时返回 `null`，例如——必须二选一。同样，就像标量类型提示一样，如果存在类型不匹配，将触发 `E_RECOVERABLE_ERROR`。\n\
    \n这为 PHP 带来了更强大的类型检查，并减少了错误。它还使代码在你再次查看时更容易理解和在脑中组装。最后，IDE 和其他工具在检查你编写的代码时可以更智能。\n\
    \n尽可能确保为类型提示声明严格模式，并确保包含返回类型声明。这将有助于确保你享受这些 PHP 7 功能带来的好处。也有一些限制，但如果你编写良好的代码，就不应该遇到它们。发挥其优势，你将比昨天更快乐的开发者。\n\
    \n在清单 10.1 中，我包含了一些示例，说明如何很好地使用此功能。\n\n**清单 10.1**\n\n```\ndeclare(strict_types=1);\n\
    \nfunction add(int $a, int $b): int {\n    return $a + $b;\n}\n\necho add(1, 2);\n\
    ```\n\n清单 10.1 中解析器捕获的一些愚蠢错误很容易被忽略，并导致程序意外故障。启用类型提示并添加返回类型声明可以帮助确保这种情况不发生。\n\n\
    如前所述，语言本身和 Zend 运行时本身有许多其他改进。这些包括新功能和，坦诚地说，令人惊叹的性能增强。有这么多理由升级；希望它能尽快部署到全球的 PAAS\
    \ 和主机上，因为这当然是迄今为止最好的版本。\n\n## 命名空间组语法\n\n在 PHP 7 中，命名空间语法已扩展，包括组 `use` 语句，这大大减少了所需的输入量。当你想要指定要从同一父命名空间使用的多个命名空间时，它就派上用场了。\n\
    \n为了简单起见，让我们假设我们有一个命名空间 `\\Treffynnon\\FunctionalPhp`，其下有以下类：\n\n1. `Html`\n2.\
    \ `Date`\n3. `Blog`\n4. `ShoppingList`\n\n渲染博客文章需要前三个类，但不需要最后一个。我们将使用组语句来拉入我们想要的那些项目：\n\
    \n```\nuse \\Treffynnon\\FunctionalPhp\\{Html, Date, Blog};\n```\n\n虽然这个功能不可避免地用途有限，但了解它很方便，在处理\
    \ PHP 笨拙的命名空间语法时可能会为你节省一些精力。\n\n## 闭包调用\n\n在 PHP 7 中，语言中的闭包行为已通过在调用时绑定执行得到增强。如前所述，PHP\
    \ 5 有 `bind` 和 `bindTo` 方法，但它们必须在执行前调用。这可能会创建不必要的代码行，新的 `call` 方法则取消了这些行，转而支持在调用时将闭包绑定到类。\n\
    \n```\n$closure = function() {\n    return $this->value;\n};\n$closure->call($object);\n\
    ```\n\n前面的示例提供了一种更整洁、更简单的方法来以绑定状态调用闭包。\n\n## 10.5 展望未来\n\n虽然很难说除了已完成投票的 RFC 之外，什么会被接受到未来的\
    \ PHP 版本中，但 PHP 内部列表上有一些讨论。\n\nNikita Popov 提供了一个补丁：\n\n```\nfunction example(array\
    \ $data): array {\n    return array_map(fn($item) => $item * 2, $data);\n}\n```\n\
    \n也可以过滤记录，只返回注册号为 `DG44-001` 的记录：\n\n```\n$records = array_filter($records, fn($record)\
    \ => $record->reg === 'DG44-001');\n```\n\n最终优势是系统能够处理嵌套的 `foreach` 语句，如下所示（示例直接取自\
    \ Nikita 的介绍性电子邮件），并在清单 10.2 中复现。\n\n**清单 10.2**\n\n```\nforeach ($data as $row)\
    \ {\n    foreach ($row as $cell) {\n        // process $cell\n    }\n}\n```\n\n\
    如你所见，这是一个强大的功能，将使在 PHP 中操作数组变得容易得多，并且鉴于其简洁性和无状态操作，它们将成为函数式编程工具包的一个良好补充。\n\n随着\
    \ PHP 迈向未来，新版本似乎将添加更多功能和函数，这应该有助于使函数式编程在 PHP 中成为坚实的现实。\n\n* * *\n\n1. [可调用类型](http://php.net/language.types.callable)↩\n\
    2. [在 php5.4 中使用 `__invoke()` 访问类成员](https://bugs.php.net/bug.php?id=63253)↩\n\
    3. [可变参数 RFC](https://wiki.php.net/rfc/variadic)↩\n4. [[PHP-DEV] PHP 的列表推导式和生成器表达式](http://markmail.org/thread/uvendztpe2rrwiif)↩\n\
    5. [addListComprehensions 分支](https://github.com/nikic/php-src/tree/addListComprehensions)↩\n\
    \n# 11 结论\n\n> “函数式编程只是‘另一种工具’，就像诚实是一种技巧，而不仅仅是编造东西一样。”\n\n>\n\n> —Rúnar Bjarnason（函数式程序员，@runarorama）\n\
    \n"
