    \ React/Partial 库。在以下示例中，我们将 `str_replace(' ', '-', $str)` 放入一个只有一个参数的偏函数中，以便它可以在管道中链式调用。\n\
    \n```\n\n```\n\n现在，我们有一组参数顺序正确的函数，可以应用于提供的数据。下一步是生成一个管道函数，它将遍历函数列表，每次将它们应用于提供的数据片段。\n\
