    \  }, $list_data);\n}\n```\n\n当给定一组字符串值时，`pipeline_list()` 函数可以对其进行迭代并执行清单 6.5\
    \ 中的函数列表。\n\n**清单 6.5**\n\n```\n\n```\n\n如果你需要一种简单的方法将一系列函数应用于某个值或一组值，那么管道可能是保持代码整洁的好方法。看到函数列表并按其应用顺序排列，比从内到外阅读一系列连续的函数要容易得多。\n\
    \n## 6.7 模式匹配\n\n许多函数式编程语言的一个特性是能够对输入进行模式匹配，并根据匹配结果产生不同的输出。在某些方面，它可以被视为 PHP 中更强大的\
    \ `switch` 语句。解析器将从顶部匹配项开始，逐步向下，直到找到第一个匹配的模式。\n\nPHP 默认不自带这样的功能，因此我们需要自己实现一个，这实际上比看起来要容易。它会有一些局限性，当然不会像你在\
    \ Scala 或 Haskell 中使用的那样漂亮或强大，但它们很有用，这就是为什么它们对本书很重要。\n\n为了使理解过程更容易，我们将先介绍模式的外观，然后再进入实际的实现细节。模式中首先要注意的是它将操作的值。我们将其设置为第一个函数参数。此外，我们还需要指定该值应针对哪些模式进行测试，以及——如果匹配——结果或操作应该是什么。\n\
    \n在 PHP 中保持模式语法简单且整洁很困难，但数组表示法配合 `=>` 提供了不错的外观，它可以类比于 `then`。这赋予了定义意义；如果 `matched`\
    \ `=>` `执行此操作`。\n\n```\n\n```\n\n上面示例中的模式相对简单——要操作的值是 `stdClass()` 的实例，它作为第一个参数传递给\
    \ `pattern`。第二个参数是用于测试的模式列表。\n\n在遍历模式时，解析器将针对值（`stdClass`）执行每个测试（数组键）。当测试返回 `true`\
    \ 时，数组中匹配元素的值将被返回，或者如果它是 `callable`，则会被执行。确保将更具体的模式放在传递给函数的模式列表的最前面。\n\n在这种情况下，它将在内部运行以下评估过程：\n\
    \n1.  `is_string(stdClass)`——计算结果为 false，因为 `stdClass` 是一个对象\n\n2.  `is_a(stdClass,\
    \ 'stdClass')`——计算结果为 `true`，评估停止\n\n3.  返回字符串 `it is a stdClass`\n\n如果它没有匹配前两个模式，那么它将转到默认的\
    \ `_` 模式，该模式匹配任何值。这个字符与 Scala 和 Haskell 在其模式匹配语法中用于表示默认情况的字符相同。\n\n现在你已经看到了示例并了解其工作原理。我们需要实际实现\
    \ `pattern()` 函数。\n\n```\n\n```\n\n如前所述，模式函数首先接受要操作的值，第二个参数接受一个模式数组。这些模式应采用以下格式：数组键是模式或测试，数组值是所需输出，或者是返回所需输出的\
    \ `callable`。\n\n按顺序遍历提供的模式列表时，函数将模式或测试应用于提供的值（`$data`），如果匹配，则返回指定的结果。\n\n鉴于我们对模式匹配的要求，`pattern_exec_test()`\
    \ 函数需要支持几种测试，顺序同样很重要。当给定的模式是一个字符串，包含：\n\n| 模式 || 匹配 || 执行的测试 |\n\n| --- | ---\
    \ | --- |\n\n| `_` || 任何值 || 接受任何值，因此我们直接返回 true 以短路匹配过程。使用此项指定默认匹配。 |\n\n| ---\
    \ | --- | --- |\n\n| `stdClass`、`MyNamespace\\ExampleClass`、`MyNamespace\\ExampleInterface`\
    \ 等 || 针对类或接口名称 || 检查 `$data` 是否为对象，如果是，则使用 PHP 的 `is_a()` 函数检查其是否匹配指定的类或接口（例如\
    \ `ExampleInterface`）。 |\n\n| `is_string`、`is_bool` 等，或匿名函数或闭包 || 任何可调用项 || 如果模式被\
    \ PHP 视为 `callable`，则针对提供的值（`$data`）调用它。请注意，`$data` 作为第一个且唯一的参数传递给 `callable`，因此如果要使用不满足此要求的函数，需要使用部分函数应用。例如，模式\
    \ `is_string` 将变成函数调用 `is_string($data)`。 |\n\n| `a string` || 作为字符串比较 || 提供的值（`$data`）与字符串字面量之间的简单\
    \ `===` 相等性检查。例如 `'a string' === $data`。 |\n\n为了匹配这些评估规则，我们需要一个类似下面的简单函数：\n\n\
    ```\n\n```\n\n希望使用前面显示的表格，这很容易理解和解释。\n\n最后，我们来到了 `pattern_exec_result()` 函数，当模式匹配时会调用该函数。该函数的第一个参数将是字符串或\
    \ `callable`，第二个参数是原始指定的值（`$data`）。如果它是 `callable`，则将 `callable` 应用于 `$data` 并返回结果。否则，它将简单地按原样返回结果。\n\
    \n```\n\n```\n\n这提供了简单的模式匹配，但它本质上比较天真，并且由于输入必须是字符串，存在一些粗糙之处。举个简单的例子，假设你想测试字符串字面量\
    \ `is_string` 或 `_`——你不能，因为它们是特殊值（一个 `callable` 和 `pattern()` 的特殊值）。当然，你可以用几种方法解决这些问题，但为了保持示例简单并清晰地传达原理，这留给你，亲爱的读者，去处理。\n\
    \n尽管有这些限制，使用这种方法仍然可以编写一些更短且可能更清晰的代码。为了帮助理解如何实现这一点，我们将以几个实际示例结束，其中 `pattern()`\
    \ 被用于实际场景。\n\n首先，一个字符串匹配器，通过对指定值（functional php）应用 `ucfirst()` 来转换该值。\n\n```\n\
    \n```\n\n以下示例演示了特殊字符串 `_` 的默认属性。\n\n```\n\n```\n\n鉴于 `DateTimeImmutable()` 不会匹配\
    \ `stdClass` 或 `is_string()` 测试，它将回退到默认的 `_`。\n\n你可以使用 `pattern()` 函数来测试提供的值的类型，然后对其应用转换或返回静态值。这为执行此类操作提供了一个简单且整洁的接口，而不会用\
    \ `if-else` 地狱或 switch 语句污染你的代码。\n\n## 6.8 函子\n\n我们已经在类的 `__invoke()` 方法中见过 PHP\
    \ 的函子，但正如我们所发现的，这仅仅是一个对象函数，而不是真正的函子。要了解什么构成函子，我们必须更深入地探讨理论。简单值可以很容易地应用函数：\n\n\
