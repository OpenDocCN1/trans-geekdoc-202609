    ![](Images/cover.jpg)


    # Functional Programming with PHP


    ## Dedication


    For Marion, Damien, and Ariana.


    Ngiyakuthanda! Ngiyabonga ntombenhle!


    ## About the Author


    Simon Holywell is a Senior Software Engineer at Aurion in Brisbane, Australia
    (`http://aurion.com`) and is passionate about web application development and
    motorcycles. His first public project was written with `PHP 3`, and since then,
    he has worked with every version of `PHP` and dabbled in `Python`, `Scala`, `C`,
    `JavaScript`, and more. He is also the author of `SQLStyle.guide` and the `ssdeep`
    extensions for `PHP`’s `PECL`, Facebook’s `HipHop Virtual Machine (HHVM)`, and
    `MySQL`.


    Blog: `https://www.simonholywell.com`


    Twitter: `@Treffynnon`—`http://twitter.com/Treffynnon`


    ## Acknowledgements


    > “Functional programming has become more and more popular in recent years because
    it promotes code that’s safe, concise, and elegant.”


    >


    > —Martin Odersky (Computer scientist and Scala programming language, `@odersky`)


    Many very supportive people were involved in the production of this book, and
    I would like to thank them for their keen insights and guidance. They helped me
    to take it from an idea to a fully-fledged book.


    In particular, I would like to thank Beth Tucker Long who has been instrumental
    in bringing you this book right from the earliest of stages.


    I also appreciate those who helped me formulate ideas and reviewed early drafts—especially
    Craig Bendell and Jamie Matthews.


    To technical reviewers Oscar Merida and Koen van Urk, layout and diagram wrangler
    Kevin Bruce, Eli White, and Lori Ann Pannier for their contributions.


    ### 0.1 Cover Design


    I worked through the concept for the front cover of the book and Kevin Bruce interpreted
    it into the clean design you see. Just what does it mean though?


    For sometime now `PHP` has been associated with an elephant emblem. First designed
    by Vincent Pontier (a designer from France) it has been used by many to signify
    the `PHP` programming language. Some of the more well known uses are as plush
    toys and as the logo of the long standing `PHP Classes` site


    Whilst a friend walked Vincent through the possibilities of `PHP` in late 1998
    he doodled with the letters `PHP` on a piece of paper. Turning the paper sideways
    he noticed that the letters sort of formed a stylised outline of an elephant.
    Squint your eyes and you can probably see it too.


    He would later create a clay model as a basis for the plush toys and gave them
    the name elephpant (note the extra `P` in the middle). For more information on
    the creation of the elephpants you should see the interview Khayrattee Wasseem
    conducted with Vincent on his site `7php.com`


    To demonstrate this book’s functional underpinnings the elephant is included inside
    parenthesis. The opening and closing parenthesis are shorthand for a function.


    So in reality the cover image is a functional elephant.


    If the existence of a plush toy piqued your interest then you can buy them directly
    from the original designer

    '
