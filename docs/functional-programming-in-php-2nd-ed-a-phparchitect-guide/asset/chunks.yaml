  trans: "\n\n查看第一个 `then()` 块，你可以看到它接受三个回调函数。第一个在 promise 成功解析时被调用。当 promise 无法解析时，第二个函数会被调用。进度更新会触发第三个也是最后一个回调函数。从这些函数中的任何一个返回值，都会导致该值作为输入参数传递给下一个\
    \ `then()` 块中的相应函数。\n\n如你在随后的 `then()` 块中所见，回调函数是可选的。第二和第三个 `then()` 块仅定义了成功回调。这些回调函数的工作原理非常简单，我不会再赘述。\n\
    \n要将其付诸实践，我们需要一个简单的事件循环，与之前一样，`React/event-loop` 完美满足这一需求。\n\n```\n\n```\n\n这会创建一个新的事件循环，通过将\
    \ promise 绑定到文件句柄来添加一个读取流，最后运行循环。执行时，我们编写的代码会打印一系列更新（实时），随后打印合并为一个长结果字符串的所有结果。\n\
    \n这是对 promise 的一个不错的介绍，但如果我跳过 `React/Promise` 提供的更强大的组合功能，那就太不负责任了。为了介绍 reduce\
    \ 操作，我们需要在事件循环之前定义另一个延迟 promise。\n\n不过，首先我们必须打开一个新的文件资源句柄，并将其设置为非阻塞流。\n\n```\n\
    \n```\n\n第二个延迟 promise 本质上与第一个相同，只是引用被更改为包含 ‘2nd’。\n\n**Listing 8.6**\n\n```\n\
    \n```\n\n要合并两个 promise，我们将使用 reduce 操作，通过实现 `When::reduce()`，它将 `deferred` 数组作为第一个参数。第二个参数是一个回调函数，用于执行合并逻辑并返回包装结果的新延迟\
    \ promise。\n\n然后你可以将 `then()` 函数块应用于这个延迟 promise，以访问最终结果。\n\n**Listing 8.7**\n\
    \n```\n\n```\n\n第一个 `then()` 块简单地 `elog()` 合并的结果，并将结果返回以供下一个 `then()` 块使用。最后一个\
    \ `then()` 块打印出 reduce 操作结果的 MD5 哈希值。\n\n要执行此代码，你需要再次将其绑定到事件循环中的延迟 promise，如：\n\
    \n```\n\n```\n\n运行此代码时，你会从第一个和第二个 `deferred` 的每次读取中得到一条调试日志。每个 deferred 然后会打印其结果。\n\
    \n最后，`When::reduce()` 会打印第一个和第二个 deferred 的组合，以及结果的 MD5 哈希值。你可以对延迟 promise 列表执行许多其他操作，这些操作包括：`map()`、`some()`、`any()`、`all()`\
    \ 等。每个操作允许你根据延迟 promise 的结果做出不同的决策。虽然很有趣，但超出了我们在此讨论的范围，不过你可以轻松地使用 `reduce()` 示例作为基础来探索该库的其余功能。有关更多信息，请参阅\
    \ GitHub 上的项目文档。\n\nPromise 是组织回调函数并防止其失控的一种非常方便的方法。有一些方便的代码片段可以更轻松地在 PHP 代码中处理异步操作。PHP\
    \ 不以事件驱动或异步操作而闻名。大多数标准库调用不是以这种方式运行的——解析器会按顺序处理任务直到完成。借助一些库的帮助，可以以优雅的方式将这种能力带到\
    \ PHP 中。\n\nPromise 提供了一种帮助缓解事件驱动编程可能带来的回调地狱的方法。\n\n## 8.6 Wrap Up the Show\n\n\
    事件驱动编程在 PHP 中不仅是可能的，而且得益于反应器模式和 ReactPHP，它很容易实现。虽然事件驱动编程可能导致回调地狱，正如我们所见，有许多库和模式可以采用以避免这一点。很像函数式编程，我们在此审查的许多事件驱动编程都是实验性的。它很有趣，但很少用于生产环境。\n\
    \n在 Node.js（`ReactPHP` 以前称为 NodePHP）和 Python 的 Twisted 中，至少有两个更流行的替代方案。这两者在生产环境中的使用时间都远比\
    \ PHP 的事件库长。这可以归因于 PHP 专注于 Web 服务器的短期运行进程。当然，可以使用 `PHPDaemon` 等库将其作为守护进程运行。\n\n\
    所有这些结合起来，使其成为 PHP 编程中一个非常小众的领域，但正如 Igor Wiedler（`ReactPHP` 的创建者）所说：“他们能拥有的，我们都能偷来！”\n\
