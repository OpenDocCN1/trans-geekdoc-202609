- raw: "It is worth pointing out that this is not an officially recognised emblem\
    \ of PHP and indeed Postgresql use the pachyderm for their own logo albeit designed\
    \ from a different angle. There have been numerous discussions about adopting\
    \ the elephpant with Rasmus Lerdof having liked the idea in the past according\
    \ to online gossip. It once even featured on the php.net logo download page.\n\
    \n* * *\n\n1.  [PHP Classes](http://www.phpclasses.org)[↩](#ch003.xhtml#fnref1)\n\
    \n2.  [7php.com](http://7php.com/elephpant/)[↩](#ch003.xhtml#fnref2)\n\n3.  [Adopt\
    \ your elephpant](http://elephant-php.com)[↩](#ch003.xhtml#fnref3)\n\n# 1 Introduction\n\
    \n> “I am in much dismay at having got into so amazing a quagmire & botheration\\\
    […\\]”\n\n> \n\n> —Ada Lovelace (Mathematician, 1815–1852) discussing mutability\
    \ with Charles Babbage (created first concept of a programmable computer, 1791–1871)\n\
    \nOver the course of the past twenty years or so, functional programming has seen\
    \ a slow and steady growth. This has led to many languages adopting functional\
    \ aspects, including the much-maligned PHP. As computer hardware and language\
    \ support improves, it is important to begin learning the basics of functional\
    \ programming. While it is true programming in this style requires a change in\
    \ thinking, you will find some understanding of it has a positive impact on your\
    \ object-oriented code as well.\n\nLet us begin our journey through the functional\
    \ aspects of the PHP language.\n\n## 1.1 Prerequisites\n\nYou must have access\
    \ to PHP version 5.4 or greater and command line access to the machine in question\
    \ is incredibly beneficial. When writing, I used a Debian-based machine, and a\
    \ similar POSIX computer is recommended, although not required.\n\nOne of the\
    \ best things you can do while learning is to install a decent REPL on your machine\
    \ as it will make it much easier to experiment with code as you follow along.\
    \ REPL stands for read-eval-print loop, and it’s basically a programming environment\
    \ most commonly used on the command line. It allows you to try out algorithms\
    \ easily without the need for an editor or even files to contain your code. Type\
    \ code into it, hit return, and your code is executed with the result printed\
    \ on screen.\n\nThere are a number of good REPLs out there, and I have had success\
    \ with PsySH\n\nIf you do not wish to install a REPL on your machine, you could\
    \ use the online service 3V4L\n\nAs we progress through more functional programming\
    \ in PHP, I will suggest useful PHP libraries and extensions. These are either\
    \ installed via Composer \n\nIt goes without saying this book is not aimed at\
    \ beginner PHP developers and some object-oriented experience is assumed. Having\
    \ said that, of course, this is as gentle of an introduction as possible and represents\
    \ a beginner guide to functional programming in PHP.\n\n## 1.2 Requirements\n\n\
    ### PHP\n\n*   PHP 5.4+ (for some libraries, a later version might be required)\n\
    \n### Other Software:\n\n*   Dependency management: Composer\n\n*   Extension/Library:\
    \ functional-php\n\n*   Library: React/Partial\n\n*   Library: nicmart/Functionals\n\
    \n## 1.3 For Users of Older PHP Versions\n\nIt is certainly possible to write\
    \ functional code and work through most of this book while using PHP 5.3.2 or\
    \ greater—the first edition of this book was in fact written in PHP compatible\
    \ with 5.3.2. There are a few things you may have to adapt in your code though,\
    \ to ensure you don’t access features that do not exist in the version of PHP\
    \ you have installed.\n\nShort array syntax will almost undoubtedly be the first\
    \ syntax difference you will come across and fortunately it is very easy to adapt\
    \ for usage on older versions of PHP. Short array syntax looks like the following\
    \ sample:\n\n```\n\n```\n\nImplemented in PHP versions less than 5.4 it would\
    \ simply be converted to the following code:\n\n```\n\n```\n\n## 1.4 Installing\n\
    \nSome of the chapters in this book will require you to install additional software\
    \ before you can continue with the samples provided. This is reasonably easy although\
    \ it does warrant some coverage here. Of these additional utilities some will\
    \ be runtimes, others libraries and extensions.\n\nLibraries are written using\
    \ PHP userland code and tend to be slower to run, but easier for PHP developers\
    \ to contribute to and maintain. They are generally packages of code that can\
    \ be implemented using native PHP code calls and require statements. We will make\
    \ use of Composer to greatly simplify the installation steps required to install\
    \ these bundles of code.\n\nThe next step up in terms of performance and difficulty\
    \ of installation is a PHP extension. Generally, these are sourced from the PECL\
    \ repository of extensions although anyone can release an extension outside of\
    \ the PECL structure themselves too. Extensions chosen from the PECL site are\
    \ generally more likely to have had a code review from a PHP core developer prior\
    \ to its approval for listing.\n\nFinally we have other runtimes that are related\
    \ to PHP; in this book we will stick to Facebook implemented HipHop Virtual Machine\
    \ or HHVM for short. Not only does this runtime bring improved performance over\
    \ native PHP through just in time compilation, but also extends PHP through the\
    \ Hack language to provide an array of useful features.\n\nAs discussed, most\
    \ of these additional pieces of software are relatively easy to install so for\
    \ this set of instructions I am going to assume you are using, or have access\
    \ to a Debian based Linux installation. A Vagrant box with a recent edition of\
    \ Ubuntu on it would easily satisfy this requirement.\n\n### PHP Libraries\n\n\
    Installing libraries with PHP has never been easier with Composer replacing the\
    \ now ageing PEAR repositories. This brings with it benefits like the ability\
    \ to list a package and release it whenever you please. Conversely, there are\
    \ disadvantages such as bad packages being listed beside good ones. Also PEAR\
    \ had a code style guide packages needed to adhere to; any style is permissible\
    \ with Composer. Having said that, many libraries have voluntarily adopted PSR-1\n\
    \nYou have the usual option of simply downloading a tarball of the package and\
    \ extracting it to a directory, then manually pulling the files in with require\
    \ statements. This, though, is discouraged in favor of the automation Composer\
    \ provides.\n\nComposer is a PHP phar archive you can easily install from the\
    \ internet with two commands.\n\n```\n\n```\n\nYou can now access Composer from\
    \ anywhere on your machine via command line by simply entering `composer`.\n\n\
    To create a new Composer backed project you can call `composer init` and it will\
    \ run through a wizard to configure your first `composer.json` file. Once this\
    \ is complete it is possible to easily specify dependencies for your application\
    \ by either editing the `composer.json` file directly or using the command line\
    \ interface.\n\n```\n\n```\n\nThis is where `vendor` is the vendor namespace such\
    \ as `symfony`, `treffynnon`, or `j4mie` and `package` is the package namespace\
    \ such as `silex`, `paris`, or `idiorm`. After the colon you can specify a version\
    \ of the library you wish to use or your project implements.\n\nAlternatively\
    \ if you do not know the name of the package you are interested in, you can search\
    \ for it in an interactive fashion by calling `composer require` without any parameters.\n\
    \nOnce your Composer file has all your requirements specified within it, you can\
    \ commit it into source control and then anywhere you wish to run the project\
    \ you can simply call `composer install` to have composer automatically install\
    \ all your specified dependencies.\n\nIn addition to these dependency management\
    \ features Composer also makes it easy to autoload the projects specified from\
    \ within it. All you need to do is include one requirement statement to the top\
    \ of your project’s core/bootstrap file.\n\n```\n\n```"
