    现在可以在命令行中使用 `php server.php` 启动服务器。你现在可以在 `http://127.0.0.1:7355` 上访问服务器，并将收到一个简单的纯文本响应
    `Sakubona, unjani?`。


    该库是对可以使用 PHP 中的 `stream_*()` 函数编写的代码的高级抽象，但如果你安装了 `libevent` 或 `libev`，它将使用它们的
    C 实现作为更快的后端。我们在这里定义的 HTTP 服务器可以用纯 PHP 代码编写：


