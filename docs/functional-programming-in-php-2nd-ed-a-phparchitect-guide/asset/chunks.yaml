    它比 `fmap()` 复杂得多，正如你所料，因此我将逐步讲解以描述发生了什么。


    首先，它获取自己的函数名并将其存储在变量中以供后续使用。它还会获取传递给函数的所有参数，除了第一个参数。这里有个好消息，`amap()` 可以将多个 `Applicative`
    应用到参数上！你只需要将一个 `Applicatives` 数组作为第一个参数传递给 `amap()`，它就会处理其余的事情。这就是为什么你可以看到它在间接调用自身之前，使用
