    at the time Gödel was at the cutting edge of logic. To further prove the undecideability
    of the Entschiedungs Problem it was necessary to define effective computing. This
    lead to a number of systems being devised at once.


    # Lambda Calculus and Functional Programming


    In 1932, the first system was proposed by Alonzo Church in the form of the lambda
    calculus. He saw the potential in his new definition and wrote:


    > “There may, indeed be other applications of the system than its use as a logic.”


    Given that lambda calculus would go on to be the foundation for functional programming
    it is certainly fair to say he was right. Using lambda calculus as a base Church
    was able to put forward a problem without an effectively calculable answer. Again,
    the simplicity is striking; given a lambda expression, determine if it will loop
    forever. It can’t be done!


    Gödel was working on his own system of logic around the same time of recursive
    functions. While it may not look the same as Gödel’s formalisms, recursion is
    a core component of functional programming.


    Also at this time Alan Turing was introduced to Gödel’s undecideability problem
    and—just as Gödel—he came to the conclusion: to work on the Entschiedungs Problem
    you must define a system of effective calculability. He devised the Turing Machine
    which could calculate all the numbers naturally considered computable. By this
