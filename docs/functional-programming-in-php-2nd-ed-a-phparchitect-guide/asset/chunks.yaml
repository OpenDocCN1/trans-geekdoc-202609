- raw: 'This involved picking the top few PHP projects on GitHub with a good test
    suite. They then run these tests against their HHVM builds to see where they fail.
    Having identified areas where support is lacking they work through the failed
    tests until they are solved. The idea is to achieve parity with PHP to make the
    runtime easier to adopt for existing projects and PHP shops.


    This desire to match PHP even led the Facebook crew to create the beginnings of
    a language specification. This is simply a document detailing what the language
    should do and its required core library. After preparing it they then open sourced
    it for the PHP team to maintain.


    This highlights one aspect of PHP that differentiates it from many other languages
    such as Python or Ruby. Instead of having a specification to work from when the
    PHP runtime was written they (well, OK, just Rasmus in the very beginning) simply
    implemented features. I imagine this is because it was quicker, easier, and presumably
    no one thought other implementations of the language (such as HHVM) would be written.
    Well, fast forward a number of years and we have HHVM, Zephir, HippyVM and Quercus
    (on the Java Virtual Machine or JVM).


    This is a new thing for PHP to have such a high profile alternative, but in the
    case of Python it is something they are used to and even demand. There the language
    is implemented as IronPython (.NET), Jython (JVM) and CPython (C) giving more
    diverse options to the developer. The Zend Engine for PHP on the other hand, can
    be considered the de facto reference implementation of the language and any other
    runtime would have to emulate its quirks.


    Back to the Hack language itself though it can be considered an extension of the
    PHP language in its own right. That said, it contains some very useful features
    which enrich the base of PHP dramatically. Oh, and Hack is written in OCaml—a
    functional (amongst other paradigms) programming language.


    ## 5.1 Types


    One of the weakest parts of PHP 5, in my opinion, is the type system and Hack
    goes a long way to address this with its extensions to the type system. In PHP
    there is very little to allow the creation of types unless you want to box values
    in wrapping classes—an arduous task.


    In Hack however, you can use type aliases to create new types which can then be
    referenced throughout your code. This better support greatly eases the laborious
    task of code maintenance. It also makes it easier to reason about the code you
    produce as you are writing new features in an application.


    First, though, let us step back to the basics and review the core in-built types
    Hack provides. These are the same types as PHP defines itself for the most part.One
    key difference though is scalar types (int, string, etc) can be hinted in function
    arguments. On top of this, the return type can also be defined allowing you to
    reason further about the code and the parser to report on type mismatches. As
    discussed previously this helps to eliminate a whole class of bugs.


    While PHP does have types they are not easily hinted and variables can change
    type at any time. This makes it difficult to write code which expects a certain
    type to operate on. Prior to PHP 7, you could either use some kind of type testing
    switch statement or cast to the type you expect hoping the value still makes sense.
    This is an asset to PHP as it makes the language freer and therefore easier to
    learn. When you want to write abstracted code though it becomes a hindrance.


    This is where Hack lang’s type system can help. It is possible to avoid declaring
    types as Hack will infer the type from the value you are assigning. If an integer
    is assigned at declaration, then the resulting type of the variable will automatically
    be `int`. This behavior is much the same as PHP until it comes to type hinting.


    A function could be defined as accepting only an integer for its first parameter
    as follows, which also states it will return an `int`.


    ```


    ```


    Here you can see the parameter `$a` has been specified as an integer. By default,
    Hack will attempt to cast any non-`int` values to integers before passing the
    value into the function. This can lead to some unexpected behavior.


    You can set how strict you want the Hack parser to be by placing a comment after
    the opening `<?hh` tag. This allows you to run various code at various levels
    of strictness, which is not a good thing. This can lead to confusion and it is
    annoying to have to add the comment all the time. On the flip side it makes it
    possible to drop down to a less strict mode if necessary.


    To be able to call PHP code from Hack you must not use `strict` mode in the calling
    file for example. This is because strict requires code to have types defined and
    be written in Hack lang. Other reasons this can be handy is if there is a problem
    with Hack’s type checker or when calling incorrectly typed code. Strict is the
    most stringent of all the modes and it is the one I recommend coding to. It requires
    all code to be correctly annotated with types or it will fail to parse the code.
    As all code requires types, it is not possible to call non-Hack code from this
    mode. In addition, it is no longer permissible to directly construct arrays as
    they must have a type. The recommended way around this is to use a collection
    instead.


    The default mode for Hack is `partial` and it is quite a bit more relaxed. You
    can call non-Hack code and leave methods untyped. Essentially you can write plain
    PHP in this mode.


    A third level can be found in `decl` which I would not recommend using from a
    Hack project unless it cannot be avoided. It is a weird mishmash the Hack manual
    identifies could cause bugs—if no other mode is working for you though, it might
    be worth a try.


    These modes affect the behavior of the parser and how strictly the type signatures
    are adhered to. My suggestion is you always work in the strictest mode possible.


    To test the type signatures and constraints declared in your code from the command
    line you can create a simple new Hack project simply by creating a new folder
    and placing an empty file called `.hhconfig` inside it. Now include your Hack
    files in this directory as you work on the project and when you are ready to test
    execute `hh_client` from the same location via a terminal.


    Also note Hack will not allow top level code in files it is to type check with
    the only exception granted for `require` and `require_once` keywords. All other
    code which would normally live at the top level should be included in a function
    called `main()`. An example of this in action can be found in Listing 5.2 found
    later in this chapter.


    The types themselves are reasonably similar to PHP except you can use them everywhere.
    If you remember with PHP 5, you are not able to hint scalar function arguments.
    In Hack you have the following types just like in PHP:


    | Type || Description |


    | --- | --- |


    | Boolean || `true` or `false` |


    | --- | --- |


    | integer || Whole numbers (including negative numbers) |


    | float || floating point numbers (decimals) |


    | double || Alias of `float` |


    | string || Textual information |


    | array || Ordered map or key/value list |


    | object || Instance of a class |


    | resource || a reference to an external resource such as a file handle |


    | `NULL` || represents a variable with no value |


    | callable || As of PHP 5.4 a variable to can be treated as a function |


    On top of these basic types, Hack defines collection types that facilitate data
    collections and lists in a less generic way than PHP’s all-purpose array. These
    include:


    | Collection || Description |


    | --- | --- |


    | `Vector` || an ordered list collection |


    | --- | --- |


    | `ImmVector` || as `Vector`, but immutable (unchangeable after initial assignment)
    |


    | `Map` || an ordered dictionary style collection |


    | `ImmMap` || as `Map`, but immutable |


    | `Set` || list collection that stores unique values |


    | `ImmSet` || as `Set`, but immutable |'
