    \n5.  [`PHP Simple Daemon`](http://github.com/shaneharter/PHP-Daemon)↩\n\n# 9\
    \ Hazards of Functional Programming in PHP\n\n> “‘I am not going to exploit functional\
    \ programming because my coworkers would complain’ is such a gross and cynical\
    \ thing to believe.”\n\n> \n\n> –Tony Morris (Functional programmer, @dibblego)\n\
    \nPHP 不是函数式语言，因此，我们要克服的不仅仅是缺乏语法糖。或者更可能在 PHP 的情况下，是绕过并将就着用！作为一种语言，PHP 没有演变到支持我们所需的函数使用方式，并且有意选择将开发资源集中在改进语言的面向对象能力上。我并非在批评这一点；鉴于资源有限，专注于将产生最大影响的方面很重要。迎合少数\
    \ PHP 开发者而忽略大多数人，将阻碍该语言的持续普及，并使当前用户感到被剥夺权利。\n\n说了这么多，当然，当你使用的语言无法满足你希望用它实现的代码时，这很令人沮丧。“使用更合适的语言，”你完全有理由喊道！我会反驳说，有大量开发者在\
    \ PHP 中极其高效，并可能希望以函数式风格使用这些技能。更实际地说，有我们这些人出于各种原因必须使用 PHP，例如它是唯一的部署平台、与旧代码库集成，或者是雇主的要求。\n\
    \n所有这些意味着你需要考虑如何在 PHP 中管理你的函数式项目。首先，你将如何布局文件并创建用于代码共享的函数式“包”？\n\n不幸的是，PHP 目前没有自动加载函数的机制，并且从围绕两个相关\
    \ PHP RFC 的讨论来看\n\n这使你有几个选择：\n\n1.  在所有请求的所有文件中 require/include。 \n\n2.  将函数设置为类文件中的静态方法，然后可以像\
    \ `Underscore.php` 一样自动加载 \n\n3.  使用我的简单函数，这些函数使命名空间 `use` 语句的行为更像导入子句。虽然它解决了问题，但从本质上讲，这是一个完全的\
    \ hack，由于使用 PHP Tokenizer 对文件进行双重解析，它不可避免地会减慢你的代码速度 \n\n    这不是一个阻塞问题，但很烦人，而且值得提及。如果你打算实现一些基本的函数式风格，那么这不太重要，但如果你想共享或重用整个函数库，那么你就面临这三个可怕的选择。\n\
    \n"
