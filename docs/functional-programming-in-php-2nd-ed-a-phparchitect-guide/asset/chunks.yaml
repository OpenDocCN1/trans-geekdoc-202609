    \n# 7 Implementing the Theory\n\n> “You’d like to be able to write a contract\
    \ for a function like: ’you give me arguments that are bigger than zero and I\
    \ will give you a result that is smaller than zero.”\n\n> \n\n> —Simon Peyton\
    \ Jones (Computer scientist, @simonpj0)\n\n## 7.1 IP Address Restriction\n\nAs\
    \ is customary when introducing a new topic, the first example will be kept simple\
    \ both in terms of the problem it is solving and the code which is implemented.\
    \ While the code may never make it into production, it does provide a good starting\
    \ point. Blocking access to users who do not appear in an IP address white list\
    \ can be done in a number of ways with PHP. This example will take the approach\
    \ of encoding it in the shortest amount of code possible in PHP, to my knowledge.\n\
    \nWe need an IP v4 address to represent the address of the website user for the\
    \ following examples. To make the code more easily adaptable to a web server environment\
    \ as opposed to the command line the simplest way of doing this is to override\
    \ `$_SERVER['REMOTE_ADDR']` with a static IP address of our choosing. Simply remove\
    \ this line when running this code via web server to check the actual user’s IP\
    \ address:\n\n```\n\n```\n\nTo begin with the white list of IP addresses must\
    \ be defined to have something to check against:\n\n```\n\n```\n\nVerifying the\
    \ IP addresses is quite simple by making use of `array_filter()`. The callback\
    \ function will check if the users IP address matches any of those in the white\
    \ list.\n\nArray filter will be executed against the IP address white list so\
    \ the function should accept on IP address as an argument, as in:\n\n```\n\n```\n\
    \nFinally the code applies a short ternary conditional to the result of the `array_filter()`.\
    \ This means if the list is empty then there was no match and the user should\
    \ be denied access which is currently implemented with a simple `die()`. If the\
    \ array contains something, then there was a match and the user should be allowed\
    \ to continue so here the code simply does nothing and continues.\n\nWouldn’t\
    \ it be nice to be able to verify against partial IP addresses too?"
