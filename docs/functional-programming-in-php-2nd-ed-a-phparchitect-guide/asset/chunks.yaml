    \ `((a, b, c) -> d)` 变成了 `(a -> b -> c -> d)`。\n\n> \n\n> 相比于偏函数应用，这种方法有什么优势？你可以在运行时和函数链的任何阶段形成许多偏函数。而偏函数应用则在声明时就定义了函数的“偏函数性”。\n\
