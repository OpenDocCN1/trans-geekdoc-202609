  trans: '


    > 值得注意的是，Erlang 并非 Ericsson Language 的缩写，而是以一位名叫 Erlang 的计算机科学家命名的。尽管如此，它确实相当出色地服务于双重目的。


    自诞生以来，Erlang 已被众多行业领域的知名公司所采用。Erlang 最著名的近期用途之一是作为 CouchDB NoSQL 服务器的基础语言。该存储系统使用
    map 和 reduce 语句来提取正确的信息——这点的意义在后面会变得更加清晰。嗯，至少在函数式编程方面是这样！


    在 Erlang 以实用目的设计的同时，另一种函数式语言正处于起步阶段。Haskell 由委员会设计，从一开始就是开源的，后来成为或许最著名的纯函数式语言。然而，起初它甚至无法输出任何内容——它是一个纯粹而稳固的封闭系统。


    这反映了它最初作为实验和教育工具的起源。由于输入/输出（IO）本质上是有状态的，他们努力解决如何保护代码免受外部影响的问题。你希望能够以一种不引入有状态操作的方式访问数据库或磁盘上的文本文件等信息。


    如果你了解电子学，这可以被简化地类比为放大电路。你需要一个电源来增强信号，但重要的是电源不能向信号引入噪声。两者仅有表面上的相似之处，所以不要深究！


    Haskell 如今为开源世界乃至银行业的项目提供支持。你可能听说过的一些项目包括 Pandoc 和 xmonad。它仍然相对较小，许多公司更倾向于坚持使用熟悉的工具和方法论。


    这为 2004 年 Scala 编程语言的诞生奠定了基础，Scala 同时运行在 Java 和 .NET 运行时上。它使得函数式语言可以在现有基础设施中使用。.NET
    版本于 2012 年停止，语言开发转而专注于 JVM（Java 虚拟机）。虽然这些基础加速了语言的开发和采用，但也带来了代价。这两个平台都不是为托管函数式语言而设计的。这导致了一些困难和不足，但在本书的语境下，这些不值得进一步讨论。


    与 Haskell 不同，Scala 语言并非纯函数式，可以在其中编写非常优雅的面向对象代码。这是它的另一个吸引力；一种熟悉的方法论被优雅地执行。由于它也运行在
    JVM 上，可以直接从 Scala 代码中使用 Java 包。


    有人可能会认为 Scala 比 Haskell 更时髦，Twitter、LinkedIn、Foursquare 和 The Guardian 等公司都在其核心产品中使用
    Scala。不过这非常主观！Twitter 为新工程师编写了多个入门指南，这些指南可作为方便的学习资源。


    随着这些语言的发展，兴趣水平有所增加。这至少部分可以归因于对并行进程的需求增加，以利用多核和节点架构。函数式代码缓解了命令式代码可能遇到的共享可变状态问题。随着架构变得越来越复杂以处理增加的负载，这使得函数式编程越来越有吸引力。


    最近转向函数式代码的人很容易通过 MOOC 在线学习，有许多涉及 Haskell 和 Scala 的课程。这些课程可以作为这些语言的良好入门，特别是 Scala
    有许多为语言学习者编写的优秀书籍。


    函数式编程的历史与数学和逻辑学的发现不可分割地交织在一起。正是基于这些进步，编程和计算本身才得以创建。虽然函数式风格的程序仍不如其充满状态的对照物流行，但采用率似乎在稳步增加。


    ## 2.3 其他函数式实现


    可能被视为实现函数式构造的语言范围非常广泛。就纯函数式语言而言，Haskell 可能是最著名的。中间位置是像 Scala 和 Clojure 这样的语言，它们既包含命令式风格也包含函数式风格。


    然后在更远的边缘，有像我们深受喜爱却常被诟病的 PHP 这样的语言，它正在慢慢获得函数式编程的基本要素。


    为了对比，这里是 Haskell 中相同的 `sum` 示例，它简单如下：


    ```

    ```


    如你所见，语法使得用最少的字符清晰地表达程序变得非常容易。


    ## 2.4 商业用途


    经常被引用的函数式方法的好处之一是用于构建领域特定语言（DSL）。大多数语言中的函数式构造成功地减少了解析语言时所需的低级工作量，因为内置类型处理和模式匹配使得可以用更少的代码行编写快速且复杂的解析器。


    这的优势在于它大大减轻了维护工作，并使代码更容易理解。


    一个著名的商业示例可以在巴克莱银行（Barclays Bank）的异国交易功能性支付框架（Functional Payout Framework）中找到。它使用
    Haskell 编写，为数学家定义了一个 DSL 以创建交易应用程序。紧凑且灵活的函数式实现使团队能够更有效、更快速地响应用户对新功能的请求。项目开始时团队有一些担忧，其中最重要的是需要与用
    C 等语言编写的其他旧系统进行接口。这不仅用 Haskell 轻松完成，而且结果是一个好处，因为它防止了组件之间的紧密耦合。


    或许最著名的函数式编程商业用途是爱立信（Ericsson）开发 Erlang 语言，它专门设计用于通过高级符号语言提高生产力。由于电信对可靠性和并发性的严格要求，爱立信排除了当时的各种函数式语言，LISP
    和 Prolog 是领跑者。


    Erlang 此后已被许多商业用户采用，并为许多关键任务硬件提供支持。它可能是商业采用和在其目标领域持续使用方面最大的成功故事。


    一个更近期的例子来自 Twitter，它正在使用 Scala 处理其社交服务的许多关键功能。虽然 Scala 不是纯函数式语言（它也支持面向对象），但它当然具备这样做的能力。你每天在
    Twitter 上使用的一些功能由 Scala 提供支持，包括用户关系存储、按姓名或兴趣搜索用户，以及 Twitter 提供的“关注谁”模糊建议。Scala
    中函数式编程允许的抽象也意味着它被用于许多其他领域，例如流式 API、Kestrel 排队机制和他们的地理系统。


    ## 2.5 函数式编程最适合做什么？


    正如你将看到的，任何可以命令式完成的事情也可以使用函数式方法论完成。尽管每种方法论都有其优势，你可以将它们视为切蛋糕的另一种方式。


    '
