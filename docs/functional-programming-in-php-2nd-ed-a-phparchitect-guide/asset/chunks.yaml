- raw: 'This book has introduced you to some functional programming techniques you
    can use in your PHP projects today. While this serves as a good primer in a language
    you know, I would suggest if you wish to take things further, you should begin
    looking at other languages such as Haskell, Scala, or Clojure. I find it easier
    to learn new concepts in a language I am very familiar with, so this has been
    directed at similar individuals.


    In my own projects, I do use some functional methodologies, but those I have released
    with open source licenses have so far all been written in object-oriented PHP.
    This reflects the PHP preference for imperative code over functional programming.
    It is also true of my commercial code, although I hope in the future, these techniques
    will become more widely understood. We need more functional efforts to be released
    as open source, more discussions to be had, more speakers to present, and of course,
    more blog and magazine articles to be written.


    That is not to say there are not any open source projects out there making use
    of functional constructs in their code. A few examples I am aware of are ReactPHP
    (event-driven framework), Bullet (self-described functional web framework), Slim
    (micro-framework), and Pimple (dependency injection container)–although none of
    them (to my knowledge) make use of the more complex functional techniques and
    generally will include the odd lambda or closure here and there. I am sure there
    are many other projects also using similar code—if you know of an interesting
    one I have missed, let me know.


    If you wish to get involved in the development of functional programming in PHP,
    the best places to start are the main PHP internals mailing list and the RFCs


