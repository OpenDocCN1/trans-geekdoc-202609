    让我们回顾一下 applicative 法则，并尝试根据它们验证我们的实现。我只尝试证明其中两个法则，因为下面的另外两个在 PHP 中模拟起来比较困难和复杂。


    ```

    pure (.) <*> u <*> v <*> w = u <*> (v <*> w)

    u <*> pure y = pure ($ y) <*> u

