    ![](img/cover.jpg)


    # 使用 PHP 进行函数式编程


    ## 献词


    献给 Marion、Damien 和 Ariana。


    Ngiyakuthanda! Ngiyabonga ntombenhle!


    ## 关于作者


    Simon Holywell 是澳大利亚布里斯班 Aurion 公司的高级软件工程师（`http://aurion.com`），热衷于 Web 应用程序开发和摩托车。他的第一个公开项目是用
    `PHP 3` 编写的，从那以后，他使用过每个版本的 `PHP`，并涉猎了 `Python`、`Scala`、`C`、`JavaScript` 等。他还是
    `SQLStyle.guide` 和 `PHP` 的 `PECL`、`Facebook` 的 `HipHop Virtual Machine (HHVM)`
    以及 `MySQL` 的 `ssdeep` 扩展的作者。


    Blog: `https://www.simonholywell.com`


    Twitter: `@Treffynnon`—`http://twitter.com/Treffynnon`


    ## 致谢


    > “近年来，函数式编程变得越来越流行，因为它促进了安全、简洁且优雅的代码。”


    >


    > —Martin Odersky（计算机科学家和 Scala 编程语言，`@odersky`）


    许多非常支持的人参与了本书的制作，我要感谢他们敏锐的见解和指导。他们帮助我将本书从一个想法发展成一本完整的书。


    特别是，我要感谢 Beth Tucker Long，她从最早期阶段起就在推动本书面世方面发挥了关键作用。


    我也感谢那些帮助我构思想法并审阅早期草稿的人——特别是 Craig Bendell 和 Jamie Matthews。


    感谢技术审稿人 Oscar Merida 和 Koen van Urk、排版和图表处理人员 Kevin Bruce、Eli White 和 Lori Ann
    Pannier 的贡献。


    ### 0.1 封面设计


    我构思了本书封面的概念，Kevin Bruce 将其诠释为你所看到的简洁设计。不过，这究竟意味着什么呢？


    有一段时间以来，`PHP` 一直与大象徽章相关联。这个徽章最初由 Vincent Pontier（一位来自法国的设计师）设计，许多人用它来表示 `PHP`
    编程语言。一些更著名的用途包括毛绒玩具和长期运营的 `PHP Classes` 网站的标志。


    1998 年底，一位朋友向 Vincent 介绍 `PHP` 的可能性时，他在一张纸上涂鸦了字母 `PHP`。将纸张侧放后，他注意到这些字母大致形成了大象的风格化轮廓。眯起眼睛，你可能也能看到它。


    他后来制作了一个黏土模型作为毛绒玩具的基础，并给它们取名为 elephpant（注意中间多了一个 `P`）。有关 elephpant 制作的更多信息，你应该查看
    Khayrattee Wasseem 在他的网站 `7php.com` 上与 Vincent 进行的采访。


    为了展示本书的函数式基础，大象被放在括号内。开括号和闭括号是函数的简写。


    因此，实际上封面图像是一只函数式大象。


    如果毛绒玩具引起了你的兴趣，你可以直接从原设计师处购买它们。


    '
