    \ mode possible.\n\nTo test the type signatures and constraints declared in your\
    \ code from the command line you can create a simple new Hack project simply by\
    \ creating a new folder and placing an empty file called `.hhconfig` inside it.\
    \ Now include your Hack files in this directory as you work on the project and\
    \ when you are ready to test execute `hh_client` from the same location via a\
    \ terminal.\n\nAlso note Hack will not allow top level code in files it is to\
    \ type check with the only exception granted for `require` and `require_once`\
    \ keywords. All other code which would normally live at the top level should be\
    \ included in a function called `main()`. An example of this in action can be\
    \ found in Listing 5.2 found later in this chapter.\n\nThe types themselves are\
    \ reasonably similar to PHP except you can use them everywhere. If you remember\
    \ with PHP 5, you are not able to hint scalar function arguments. In Hack you\
    \ have the following types just like in PHP:\n\n| Type | Description |\n| ---\
    \ | --- |\n| Boolean | `true` or `false` |\n| integer | Whole numbers (including\
    \ negative numbers) |\n| float | floating point numbers (decimals) |\n| double\
    \ | Alias of `float` |\n| string | Textual information |\n| array | Ordered map\
    \ or key/value list |\n| object | Instance of a class |\n| resource | a reference\
    \ to an external resource such as a file handle |\n| `NULL` | represents a variable\
    \ with no value |\n| callable | As of PHP 5.4 a variable to can be treated as\
    \ a function |\n\nOn top of these basic types, Hack defines collection types that\
    \ facilitate data collections and lists in a less generic way than PHP’s all-purpose\
    \ array. These include:\n\n| Collection | Description |\n| --- | --- |\n| `Vector`\
    \ | an ordered list collection |\n| `ImmVector` | as `Vector`, but immutable (unchangeable\
    \ after initial assignment) |\n| `Map` | an ordered dictionary style collection\
    \ |\n| `ImmMap` | as `Map`, but immutable |\n| `Set` | list collection that stores\
    \ unique values |\n| `ImmSet` | as `Set`, but immutable |\n"
  trans: "\n\n这涉及到在 GitHub 上挑选几个测试套件完善的顶级 PHP 项目。然后他们将这些测试针对自己的 HHVM 构建版本运行，以查看哪些测试失败。在确定支持不足的领域后，他们逐一解决失败的测试，直到问题全部解决。其理念是与\
    \ PHP 保持一致，以便于现有项目和 PHP 团队更容易采用该运行时。\n\n这种与 PHP 保持一致的愿望甚至促使 Facebook 团队开始制定语言规范。这只是一份详细说明语言应具备的功能及其所需核心库的文档。准备好后，他们将其开源，由\
    \ PHP 团队进行维护。\n\n这凸显了 PHP 与许多其他语言（如 Python 或 Ruby）的一个不同之处。在编写 PHP 运行时时，他们（好吧，好吧，最初只有\
    \ Rasmus）并没有一个规范可供参考，而是直接实现功能。我想这是因为这样更快、更容易，而且大概没人想到会有其他语言实现（例如 HHVM）被编写出来。好吧，时隔多年后，我们现在有了\
    \ HHVM、Zephir、HippyVM 和 Quercus（运行在 Java 虚拟机或 JVM 上）。\n\n对于 PHP 来说，拥有如此高知名度的替代品是一件新鲜事，但在\
    \ Python 方面，这是他们习惯甚至要求的事情。在那里，该语言被实现为 IronPython（.NET）、Jython（JVM）和 CPython（C），为开发者提供了更多样化的选择。相比之下，PHP\
    \ 的 Zend Engine 可以被视为该语言的事实参考实现，任何其他运行时都需要模拟其特性。\n\n回到 Hack 语言本身，它可以被视为 PHP 语言的一种扩展。话虽如此，它包含一些非常有用的功能，极大地丰富了\
    \ PHP 的基础。哦，Hack 是用 OCaml 编写的——一种函数式（以及其他范式）编程语言。\n\n## 5.1 类型\n\n在我看来，PHP 5 最薄弱的部分之一是类型系统，而\
    \ Hack 通过其对类型系统的扩展，在很大程度上解决了这个问题。在 PHP 中，除非你想将值封装在包装类中——这是一项艰巨的任务，否则几乎没有什么可以用来创建类型。\n\
    \n然而在 Hack 中，你可以使用类型别名来创建新类型，然后在代码中引用。这种更好的支持大大减轻了代码维护的繁琐工作。它还使你在编写应用程序新功能时，更容易推理你所编写的代码。\n\
    \n不过，首先让我们回到基础，回顾 Hack 提供的核心内置类型。这些类型大部分与 PHP 定义的相同。一个关键区别是，标量类型（`int`、`string`\
    \ 等）可以在函数参数中进行类型提示。除此之外，还可以定义返回类型，使你能够进一步推理代码，并让解析器报告类型不匹配。如前所述，这有助于消除一整类错误。\n\
    \n虽然 PHP 确实有类型，但它们不容易进行类型提示，且变量可以随时更改类型。这使得编写期望某种类型来操作的代码变得困难。在 PHP 7 之前，你可以使用某种类型测试的\
    \ switch 语句，或者强制转换为你期望的类型，希望值仍然有意义。这对 PHP 来说是一种优势，因为它使语言更加自由，因此更容易学习。但是，当你想要编写抽象代码时，这就会成为一种障碍。\n\
    \n这就是 Hack 语言的类型系统可以提供帮助的地方。可以不声明类型，因为 Hack 会根据你正在赋予的值推断类型。如果在声明时赋予一个整数，那么变量的结果类型将自动为\
    \ `int`。这种行为与 PHP 非常相似，直到涉及类型提示时才有所不同。\n\n一个函数可以定义为仅接受整数作为其第一个参数，如下所示，这也声明它将返回一个\
    \ `int`。\n\n```\nfunction foo(int $a): int {\n    return $a;\n}\n```\n\n在这里，你可以看到参数\
    \ `$a` 已被指定为整数。默认情况下，Hack 会尝试在将值传递给函数之前将任何非 `int` 值转换为整数。这可能会导致一些意外的行为。\n\n你可以通过在开头\
    \ `<?hh` 标签后放置注释来设置 Hack 解析器的严格程度。这允许你在不同严格级别下运行各种代码，这并不是一件好事。这可能会导致混淆，并且每次都要添加注释很烦人。另一方面，如果有必要，它使你可以降级到不那么严格的模式。\n\
    \n例如，要从 Hack 调用 PHP 代码，调用文件中不能使用 `strict` 模式。这是因为 strict 要求代码必须定义类型并用 Hack 语言编写。其他这可能很有用的原因是\
    \ Hack 的类型检查器出现问题，或者调用类型不正确的代码时。Strict 是所有模式中最严格的一种，也是我推荐编码的模式。它要求所有代码都必须正确标注类型，否则将无法解析代码。由于所有代码都需要类型，因此无法在此模式下调用非\
    \ Hack 代码。此外，不再允许直接构造数组，因为它们必须具有类型。推荐的解决方法是改用集合。\n\nHack 的默认模式是 `partial`，它要宽松得多。你可以调用非\
    \ Hack 代码，并让方法保持未类型化。基本上，你可以在此模式下编写普通的 PHP 代码。\n\n第三个级别可以在 `decl` 中找到，除非万不得已，否则我不建议在\
    \ Hack 项目中使用它。Hack 手册将其识别为一种奇怪的混合体，可能会导致错误——如果没有其他模式对你有效，不过，它可能值得一试。\n\n这些模式影响解析器的行为以及类型签名被严格遵守的程度。我的建议是，你始终尽可能在最严格的模式下工作。\n\
    \n要从命令行测试代码中声明的类型签名和约束，你可以简单地创建一个新文件夹并在其中放置一个名为 `.hhconfig` 的空文件，从而创建一个新的 Hack\
    \ 项目。现在，在项目开发过程中将 Hack 文件包含在此目录中，当你准备好测试时，在终端中从同一位置执行 `hh_client`。\n\n还要注意，Hack\
    \ 不允许在其要进行类型检查的文件中存在顶级代码，唯一的例外是 `require` 和 `require_once` 关键字。所有其他通常位于顶级的代码都应包含在名为\
    \ `main()` 的函数中。这一做法的示例可以在本章后面出现的清单 5.2 中找到。\n\n这些类型本身与 PHP 相当相似，只是你可以在任何地方使用它们。如果你还记得，在\
    \ PHP 5 中，你无法提示标量函数参数。在 Hack 中，你拥有与 PHP 相同的以下类型：\n\n| 类型 | 描述 |\n| --- | --- |\n\
    | Boolean | `true` 或 `false` |\n| integer | 整数（包括负数） |\n| float | 浮点数（小数） |\n\
    | double | `float` 的别名 |\n| string | 文本信息 |\n| array | 有序映射或键/值列表 |\n| object\
    \ | 类的实例 |\n| resource | 对外部资源（如文件句柄）的引用 |\n| `NULL` | 表示没有值的变量 |\n| callable\
    \ | 自 PHP 5.4 起，可被视为函数的变量 |\n\n在这些基本类型之上，Hack 定义了集合类型，以比 PHP 万能数组更不通用的方式促进数据集合和列表。这些包括：\n\
    \n| 集合 | 描述 |\n| --- | --- |\n| `Vector` | 有序列表集合 |\n| `ImmVector` | 与 `Vector`\
    \ 相同，但不可变（初始赋值后不可更改） |\n| `Map` | 有序字典样式集合 |\n| `ImmMap` | 与 `Map` 相同，但不可变 |\n\
    | `Set` | 存储唯一值的列表集合 |\n| `ImmSet` | 与 `Set` 相同，但不可变 |\n\n"
