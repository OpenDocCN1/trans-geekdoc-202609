  trans: "\n\n使用纯 PHP 函数时，为其添加一些调试信息以用于日志记录会很有用。由于我们处于纯函数内部，不得尝试设置状态或引起任何副作用，例如直接向屏幕打印内容。所有函数都应将其输出作为返回值传递。你需要一种构造来为函数增加灵活性——即\
    \ `Writer` 单子。\n\n`Writer` 单子允许你向屏幕、磁盘、内存等写入内容，同时保持方法链和通用接口。为了演示这一点，我们至少需要两个可以应用于\
    \ `Writer` 单子的简单函数。\n\n我们的第一个函数是一个简单的方法，用于从字符串中剔除非字母字符：\n\n```\n\n```\n\n让我们将此函数应用于实际值，以便看到它的运行效果：\n\
    \n```\n\n```\n\n为了补充此功能，下面的第二个函数将提供的字符串转换为 base 64 编码。\n\n```\n\n```\n\n这两个函数接受相同数量的参数并返回相同的值类型，这使得它们无需进一步修改即可组合。一个函数的返回值可以直接作为参数传递给另一个函数。为了演示这种能力，我们必须使用之前定义的\
    \ `compose()` 函数。\n\n```\n\n```\n\n如你所见，返回值符合预期——与你直接调用 `echo $base64($strip($str))`\
    \ 的结果相同。假设我们暂时不知道这一点，并且好奇哪个函数先被应用于 `$str`。为了验证我们的假设，我们可以使用日志来确定函数的调用顺序。\n\n在 PHP\
    \ 中，你通常首先要做的是在每个函数中添加向屏幕打印消息的语句，但如前所述，这属于作弊行为，会破坏纯函数！对于本示例，你应将该知识从脑中抹去。我们将改为将日志字符串作为函数的返回值，请参见清单\
    \ 6.12。\n\n**清单 6.12**\n\n```\n\n```\n\n现在我们已经设置好日志，可以再次组合函数并尝试相同的字符串操作。\n\n```\n\
    \n```\n\n不幸的是，日志记录破坏了函数组合并触发了 PHP 错误。\n\n```\nPHP Warning:  base64_encode() expects\
    \ parameter 1 to be\n   string, array given\n```\n\n我们的函数只接受一个字符串参数，而现在我们试图将一个数组塞入其中。这是\
    \ PHP 的预期行为，但不是我们想要的。\n\n你可能立即会想到绕过这个麻烦的方法。至少有一种方法涉及修改第二个函数（`$base64`）以接受数组作为其第一个参数，但这将改变函数的签名。这也意味着你将无法以相反顺序组合函数。\n\
    \n你可能考虑的下一个选项是编写一个包装函数，在内部调用两个函数并合并结果。这可行，但不够灵活——再想想未来可能需要反转组合或其他复用方法的需求。\n\n\
    相反，让我们编写一个专门用于处理这些函数签名的高阶组合函数。它将接受我们之前创建的两个字符串函数作为参数，并返回一个组合函数。\n\n**清单 6.13**\n\
    \n```\n\n```\n\n不过，还可以进一步改进，即将我们的函数转换或提升为可互操作的调试函数，而不是每次编写自定义组合函数。\n\n本质上，原始函数的函数签名为：\n\
