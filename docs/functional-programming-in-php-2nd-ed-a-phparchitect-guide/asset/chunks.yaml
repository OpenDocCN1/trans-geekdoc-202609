    # 8 Event Driven Programming


    > “If people do not believe that mathematics is simple, it is only because they
    do not realize how complicated life is.”


    > —John von Neumann (Mathematician and Physicist, 1903–1957)


    One well-established use of functional-style code is in event-driven programming.
    If you have written JavaScript code before, you will likely have previous experience
    with this paradigm. Functions such as `setInterval()` and `onClick()` are just
    two such examples which make use of an event-driven approach in JavaScript. This
    is not a method of working PHP easily supports out of the box, but thankfully,
    there a few extensions and libraries out there to help.


    The functional approach of removing and avoiding state is a major advantage when
    dealing with asynchronous code. Of course, it would also be much more difficult
    to create such programs if simple functional constructs—such as lambdas and closures—were
    not available to handle callback duties.


    In the PECL repository, there are a number of extensions intended to provide PHP
    with non-blocking I/O functionality such as libevent, eio, event, and ev. In terms
    of libraries, there is ReactPHP (you might recognize this name from the partial
    function application section) and a few other less well known options. For the
    purposes of demonstration, we will use ReactPHP


    ## 8.1 ReactPHP Installation


    Installation is incredibly simple with the help of Composer. After [installing
    Composer](#ch004.xhtml#php-libraries), in a fresh directory, you can run:


    ```


    ```


    Composer will install the ReactPHP components for use in your project.


    ## 8.2 Getting Started


    Just like with earlier examples of Composer installed libraries, you need to add
    the vendor autoloading to your file (`server.php`) first.


    ```


    ```


    Then, we can get on with the business of setting up a simple web server, which—at
    its heart—is a long running PHP process. When a request is made to the server,
    this bubbles up as an event and triggers the actioning callback. If you have previous
    experience with NodeJS, then this pattern will be very familiar to you.


    First, we will define a simple request-handling function that just returns a string.


    ```


    ```


    Next up is the actual web server itself, and the necessary event loop to turn
    it into a long-running process:


    ```


    ```


    Finally, we must bind the request handler (`$rh`) to the server (`$http`), set
    a socket for the server to listen to, and set the event loop in motion.


    ```


    ```


    The server can now be started on the command line with `php server.php`. You can
    now access the server on `http://127.0.0.1:7355`, and you will receive a simple
    plain-text response of `Sakubona, unjani?`.


    The library is a high-level abstraction above code which can be written in PHP
    with the `stream_*()` functions, but if you install `libevent` or `libev`, then
    it will use their C implementations as faster back ends. The HTTP server we have
    defined here could be written with pure PHP code:


    ```


    ```


    It is important to note ReactPHP has added a number of logical higher-level abstractions
    and an event loop into the mix, whereas this pure PHP example is as bare bones
    as it gets, so they are not completely interchangeable examples.


    ## 8.3 Add Some Logging


    As fantastic as it is to get a response from our HTTP server in a web browser,
    it would be nice if we could also log each and every request for the purposes
    of debugging. The trouble is we have a nice pure function used to handle the response
    to an HTTP request, and we do not want to place another concern (logging) into
    such a tidy function. We can make use of a closure to combine the calls to our
    functions.


    First up is the logging function, which just writes the request method (`GET`,
    `POST`, etc.) and the request path (`/`, `/page-name`) to a log file called `access_log`.


    ```


    ```


    We can also make a minor change to the definition of the request handler (`$rh`)
    so it only takes the one parameter (`$response`) it actually needs:


    ```


    ```


    To map the functions, we will wrap them up in a handy closure so they can be called
    subsequently to each other:


    ```


    ```


    Finally, update the request handler binding line to match:


    ```


    ```


    If you now execute this code by visiting `http://127.0.0.1:7355` in your browser,
    you will be presented with the same message, but your log file will contain something
    like:


    ```

    GET: /

    GET: /favicon.ico

    ```


    The second request is the web browser being hopeful and trying to find a favicon
    on our server. Of course, there isn’t one on our server, but without logging,
    we would never have known the server was being hit twice on each request.


    ## 8.4 Introduce a Monad


    So far, we have set up a simple web server with a small amount of functional code.
    Next up, we have an urgent demand for our server to process user requests. Now
    of course, the following code is not really written with production in mind and
    serves more as a jumping off point and example of monad usage.


    Since you have already seen the `Maybe` monad, we will take that idea and extend
    it a little bit by combining it with a list monad. This will provide predictable
    access to the `GET` parameters which are passed in the request to our little ReactPHP
    web server. For the sake of transparency, this monad will be named `QueryList`.
    As you may predict, it will be a container for the query string array.


    Like the last container monad, we must extend `Monad`, define the basic constructor
    and class property to act as our container. Also in this case, the `pack()` function
    is very simple as it accepts an array and returns the same array wrapped up in
    a new `QueryList` container—the default monadic behavior of `Monad`.


    **Listing 8.1**


    ```


    ```


    Again, the `map()` method is really quite simple in the case of this monad, but
    we have created a new `flatMap()` method to augments its functionality. It takes
    the contained array and simply uses `array_map()` to apply a function to each
    value in the array before returning the resulting array wrapped up into a new
    instance of `QueryList`.


    With the basic monad functions out of the way, it is time to discuss the problem-specific
    methods. The first of these is the `isNothing()` method, which we saw in the `Maybe`
    monad. For our `QueryList` monad, we must make a couple of modifications to facilitate
    the checks which are required. The code must know if the whole container is empty
    or—if supplied—if a particular index in the container is nothing.


    As you can see, this is done through the use of a ternary to determine if an index
    has been supplied and a simple, in-place Boolean checks against the existence
    in/of the container. This method, much like in the `Maybe` example, will be used
    later internally, but it can also be useful publicly as well.


    To be able to obtain a value from the container, we must add a `get` method in
    Listing 8.1, much like in the `Maybe` monad. There is, of course, one very slight
    change to handle obtaining a particular index from the contained array if the
    optional `$index` parameter is supplied.


    To make our access more robust, we will also create a simple little `getOrElse()`
    method, which will give us access to an index or the whole array. If the requested
    aspect of the container `isNothing()`, then it will return the supplied default
    value instead. Again, this is of course, a very similar method to the similarly
    named function in the `Maybe` monad.

