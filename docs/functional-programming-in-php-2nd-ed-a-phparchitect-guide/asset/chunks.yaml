    # Frege’s Basic Law V and Russell’s Paradox


    Frege’s Basic Law V described a set logic which made defining membership easy.
    Unfortunately for Frege, it also allowed Bertrand Russell to find an inconsistency.
    Famously known as Russell’s Paradox, it relayed a self-referential set: “the set
    of things x that such that x is not a member of x.” This tongue twister would
    produce a set that was simultaneously not a member and a member of itself. This
    discovery stumped Frege and left him floundering with weak arguments and workarounds
    for the issue.


    # The Vienna Circle and Logical Positivism


    Despite this, logicians continued to work towards a system that would describe
    the entire world. In the world of philosophy this leads to the formation of the
    hugely influential Vienna circle. The assembled members would discuss the division
    of statements into near enough two categories. On one side they would include
    statements which could not be observed, and on the other those that could be.
    Anything metaphysical is meaningless and rejected as a logical mistake or reduced
    to empirical statements that could be proven by scientific investigation. An example
    of a metaphysical statement would be “all art is pointless”–it can neither be
    proven true nor false.


    During this period they employed a student to oversee the discussions by halting
    conversations leading to metaphysical discourse. Initially they would yell “Metaphysik”,
    but as Rudolph Carnap would later relay they swiftly shortened it to just “M”.
    As discussion progressed further, “he was shouting ‘M’ so much we got sick of
    it so it was changed to ‘no-M’ whenever we said something legitimate.” In other
    words, most discussions lead to a metaphysical discussion. This brought Carnap
    to the realization there could be many logics, and not just one universal logic.


    # Hilbert’s Program


    Around the same time, an eminent German mathematician named David Hilbert was
    setting out with a similar goal in the world of mathematics. In the late 1920’s
    he was passionate about solving the Entscheidungs Problem by proving everything
    can be described by mathematical logic. Hilbert was certain everything could be
    reduced to either true or false.


    # Gödel’s Incompleteness Theorems


    Somewhat famously, in 1930 a student of the Vienna Circle, Kurt Gödel, delivered
    his completeness theorem which helped to bolster Hilbert’s hypothesis. This, however,
    was short lived when the very next day Gödel also discussed his first incompleteness
    theorem, which undermined the very foundations of Hilbert’s assertions. It is
    now universally recognized the Hilbert cohorts were incorrect and there are some
    problems logic cannot solve or describe.


    So, how did Gödel upset the apple cart? `This statement is not provable.` Simple!


    If the statement can be proven then it is false, but it states it cannot be proven
    so it must be true. This statement cannot be decided because it is both true and
    false at the same time. You’ve probably heard of a similar statement before called
    The Liar Paradox. This predates Gödel by at least 2,000 years with some sources
    suggesting roots in 600BC to 400BC. “A man says that he is lying. Is what he says
    true or false?” Over time this has been distilled down to “this sentence is false”
    and is remarkably similar to the basis of Gödel’s incompleteness theorem. This
    though, is a layman’s simplification as Gödel proved this was a paradox in all
    logic.


    He proved this to be the case across two theorems using a logic expression system
