- raw: ": A programming language which runs on the Java Virtual Machine and supports\
    \ both functional and object oriented. \n\n**scalar**\n\n: A category of base\
    \ types containing one value such as `int` and `string`. \n\n**ternary operator**\n\
    \n: A short form conditional statement which allows for an operation based on\
    \ a true or false response. \n\n**type**\n\n: The category a value belongs to.\
    \ `10` is a type of integer, for example. \n\n**type definition**\n\n: A specification\
    \ of a value’s type (int, string, etc.) in code. \n\n**type hinting**\n\n: Specification\
    \ of a type in locations where a variable is passed in. \n\n**`use`**\n\n: Either\
    \ a call to include a specific namespace, to include a PHP trait, or an indication\
    \ the closure wants to pull in variables from the parent scope at the point of\
    \ definition. \n\n**UTF-8**\n\n: A unicode/multibyte character standard/table.\
    \ \n\n**UTF-8 ellipsis**\n\n: `…` \n\n**vim**\n\n: A text editor suitable for\
    \ command line interfaces or terminals. Typically available on most Linux distributions,\
    \ but available for Windows too! \n\n**weak typing**\n\n: Types are transient\
    \ and the compiler/parser does not care and may at runtime convert between types\
    \ based on an inferred meaning. \n\n**Windows**\n\n: A Microsoft operating system.\
    \ If you are using it and following this book install Vagrant and run Ubuntu in\
    \ a virtual machine to save yourself pain. \n\n**xdebug**\n\n: The go to extension\
    \ in PHP land for interactive debugging and code profiling. \n\n# Credits\n\n\
