    在 PHP 中处理 null 值可能很棘手，但借助这些模式，你可以减轻那些否则会中断你的代码或需要流程控制语句和防御性编程的错误。


    ## 6.4 组合


    将函数组合起来创建可重用且更复杂的函数通常很有帮助。每个函数的返回值被传递给下一个函数，最后一个函数的结果是最终返回的值。在数学和计算机科学中，这个过程被称为组合。


