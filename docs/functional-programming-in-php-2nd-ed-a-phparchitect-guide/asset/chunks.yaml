    ## 6.3 Handling Your NULLS


    There are a number of functions in PHP—and I am sure many more in the legacy userland
    code you work on—returning `NULL` when no record can be found, for example. When
    you then call the function, you cannot be sure if it will return a record as you
    expect or a null value, which violates the principle a function should always
    return the same type so it can be handled in the same way.


    We have previously implemented PHP’s `array_reduce()` function, and it serves
    again as a great example. When it is fed an empty array, it will return `NULL`.
    Imagine the result of our reduce operation were to be passed into a function expecting
    to receive an integer, then it would trigger an error from PHP’s parser. There
    are a few ways to handle these null values and protect your code from unforeseen
    errors.


    In the case of `array_reduce()`, you can simply set an initial value as the third
    parameter to the function. This initial value will be returned if the input array
    is empty. Otherwise, it will be used as the base value to add each reduce operation
    to.


    If you do not have control over the code you are calling or you are implementing
    a function that doesn’t allow for a default return value, then you can make use
    of the following two techniques.


    The first is a very simple solution using the implicit return value property of
    PHP’s ternary operator. This works by leaving the second expression in the ternary
    operation empty like so:


    ```


    ```


    This code will assign the return value of `get_record()` to `$var` unless it is
    null in which case it will assign the empty array specified as the third expression
    of the ternary in the example.


    A new arrival in PHP 7 is the `null` coalescence infix operator. Unlike the short
    ternary we examined earlier it will perform the `isset` operation for you. Effectively,
    the new syntax offers an easy way of saying “if isset and not empty return the
    value of this variable”. This is known as an issetor operation where the value
    is returned if it is set or it calls the next operator.


    ```


    ```


    It is also possible to chain the operation with many calls to get the first item
    returning a non-`null` value.


    ```


    ```


    You can also do this with function calls instead of variables just as easily.


    ```


    ```


    This is a handy short syntax for dealing with nulls in PHP 7. A good enough reason
    to upgrade to PHP 7 in its own right!


    Now I must address a minor matter I glossed over for brevity’s sake in the previous
    descriptions. It is not only a return value of `NULL` that will trigger a replacement.
    PHP also considers the following values to evaluate to false:


    *   false, of course


    *   an integer set to 0


    *   a float of 0.0


    *   an empty string or the string value “0”


    *   arrays containing no elements


    *   SimpleXML objects created from empty tags


    *   values of `NULL`


    What if you only want to replace `NULL` values? Unfortunately, you are out of
    luck with the native PHP offerings, but Johannes Schmitt has written the php-option
    library


    Fortunately, it allows you to be more specific about when to supply a replacement
    value, such as in the next example which only replaces a value of `NULL` or an
    integer.


    ```


    ```


    If you only want to protect code from null values, then you can use the `fromValue()`
    static method instead:


    ```


    ```


    There is another advantage of this library; you can chain calls to `orElse()`
    so the code may try multiple alternatives to resolve the null return value.


    ```


    ```


    The code above simulates talking to a set of records available via a third-party
    API. If it can’t find a cached record, then it will attempt to pull it across
    from the API. Were that to also fail, then it will create a new record and return
    it instead. As you can see, these techniques can be employed to assist us in our
    goal of avoiding flow control and assignment statements like those in the imperative
    example provided in Listing 6.2 for comparison.


    **Listing 6.2**


    ```


    ```


    Furthermore, if the code you are talking to requires you to instantiate objects,
    then you can employ lazy loading via php-option’s `getOrCall()` method to stop
    PHP from creating the instance until it is actually required.


    ```


    ```


    Dealing with null values in PHP can be tricky, but with the help of these patterns,
    you can mitigate the errors which would otherwise interrupt your code or require
    flow control statements and defensive programming.


