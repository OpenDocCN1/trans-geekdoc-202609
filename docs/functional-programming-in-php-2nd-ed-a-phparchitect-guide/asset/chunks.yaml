    Using `bind` is very similar except it is a static method so you must pass the
    closure into it allowing for shorter code. We can rewrite the previous example
    using `bind` in the following manner:


    ```


    ```


    Defining the closure right inside the call to `bind` allows us to forgo assigning
    it to an interim variable such as `$echo_greeting` in the previous code sample.


    Unlike when using `__invoke()` inside a class it is also possible to bind more
    than one closure to the instances scope. Conversely, using a functor allows you
    to make use of PHP’s namespace aliasing.


    ```


    ```


    This is a small secondary benefit and PHP 5.6 merged a patch to facilitate aliasing
    standard functions using PHP’s namespace syntax too.


    There are at least two downfalls of function objects however and the first of
    which is most annoying. You cannot currently call the function inline without
    creating the instance first like so:


    ```


    ```


    Hopefully, something along the lines of the following code will be added to PHP
    to facilitate the easier access style of doing:


    ```


    ```


    Additionally function objects can be frowned upon as they are not self-documenting.
    Every `__invoke()` API can be different making predictable use difficult. In my
    research most IDEs are not able to give parameter hints for the function objects
    either.


    It should be noted this functionality is not actually a functor as defined by
    category theory and a more accurate computing-based term would be a function object.
    In category theory, a functor is a mapping between two categories where the structure
    of the category being mapped is preserved.


    Having said that, the term functor is used to describe a number of differing techniques
    across languages, and PHP is siding with C++ in this respect.


    ## 3.3 Namespacing


    PHP acquired namespaces in version 5.3 and they have almost universally replaced
    the older PEAR style of namespacing (underscores replaced directory separators
    so `/Vendor/MyClass.php` became `Vendor_MyClass`). While the syntax is much maligned
    by many (and for good reason) it is great to finally have namespaced code in PHP.
    Now most projects only use object oriented code, so it is little known functions
    can also be namespaced.


    It is pretty much the same syntax as you will find on classes where the top of
    the file declares a namespace and this namespace is then applied to the whole
    class container as described in Listing 3.9.


    ### Listing 3.9


    ```


    ```


    Functions, on the other hand, have no bounding container to group them like the
    methods do in Listing 3.2 with their wrapping class (`MyNamespacedClass`). This
    is where namespaces can actually be used to wrap our functions directly.


    The namespace clause can be used with wrapping braces around the functionality
    that should be namespaced with Listing 3.3.


    ### Listing 3.10


    ```


    ```


    Again, calling these functions is much like instantiating a namespaced class or
    calling methods within it. You simply include a `use` statement to indicate the
    namespace you wish to pull in.


    ```


    ```


    This is a simple way of writing functional code which will not complain when you
    define two functions with the same name. Unfortunately, that is all it can do
    and if you were hoping for autoloading, then you will be understandably upset.
    There are ways around this, but they are not very nice and unrelated to namespacing
    so they exist in the [*Hazards of Functional Programming in PHP chapter*](#ch012.xhtml#hazards).


    ## 3.4 Recursion


    ### Basics


    To eliminate flow control statements such as `for`, `foreach`, and `while` in
    your programs, you can create loops using recursion. This is a process of repeatedly
    calling a function from within itself until a predetermined cut-off is reached.


    A very common use of recursion in web programming revolves around printing site
    menu structures from content management systems, and it is also a good fit for
    working through file system directory trees.


    ```


    ```


    In the example above, the function recursively calls itself until it reaches the
    end of the array. Along the way, it joins each element of the array together.


    On each iteration, the code first determines if the requested array index exists,
    and if it does, then it recursively calls itself (`concat()`), adds one to the
    index `$index`, and concatenates the current array element onto the end of the
    string `$result`. When it hits the end of the array, it will return the value
    of `$result`, and the recursion will end.


    You would never actually concatenate a string in this way, but it serves as a
    simple illustration of performing actions without variable assignment statements
    in tandem with recursive “looping”.


    ### Tail Call Recursion


    Most recursive functions in PHP are written without tail call recursion, but it
    can be superior in some cases.


    Recursion causes the compiler to wait for a result from the called function before
    it can return a result of its own. On the other hand, tail call recursion allows
    the compiler to make optimizations to increase speed and reduce resource usage.
    Unfortunately, PHP does not take advantage of this, but it is still a good technique
    to master as in some cases, it can make the code clearer.


    A simple example to show the two different styles with the more common recursive
    form first:


    ```


    ```


    The parser will have to process all the recursive calls to `recursive_sum()` before
    it can finally add the result to `$x`. Tail call recursion implementing the same
    functionality would look like the following function:


    ```


    ```


    `tail_sum()` does not have the same problem as each iteration performs the calculation
    directly in line.


    Unfortunately, as previously mentioned, PHP—much like Python—does not take advantage
    of the performance opportunities tail call recursion provides.


    ### Mutual Recursion

