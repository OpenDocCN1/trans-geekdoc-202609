  trans: "\n\n有了它——一个为手头工作量身定制的自定义单子。如你所知，它是建立在 `Maybe` 单子的基础之上的，并针对列表处理特定功能进行了轻微增强。这使我们能够轻松地将\
    \ `GET` 查询项封装在一个健壮的容器中，以便于进行通用访问。不仅如此——它还提供了一种非常方便的方式来对内部列表应用函数。为此，让我们现在定义一个简单的\
    \ lambda 来包装 `htmlspecialchars()`。\n\n```\n\n```\n\n为了在 PHP 5.3 中支持 UTF-8，同时为\
    \ PHP 5.4 设置正确的文档类型标志，我们必须包含一些简单的版本检查逻辑。这意味着我们最终得到了一个非常基本的包装函数，现在可以将其应用/映射到我们的\
    \ `QueryList` 单子上。\n\n然而，在做之前，我们必须定义 ReactPHP 服务器，它将向我们提供其 `GET` 参数。就像上次一样，我们需要实现一个带有以下内容的事件处理程序：\n\
    \n```\n\n```\n\n目前，这接收请求，提取查询参数，并将它们打包到一个 `QueryList` 单子中。然后我们将 `$html_escape()`\
    \ 映射到数组中的每个值，这会经过 `htmlspecialchars()` 的应用。代码随后提取一个特定的索引并将其作为响应打印出来。\n\n当然，在设置\
    \ ReactPHP 的事件循环并绑定事件处理程序 `$eh()` 之前，这些都无法运行。\n\n```\n\n```\n\n完成后，你可以像之前一样在命令行上启动服务器，并访问\
    \ `http://127.0.0.1:7355?foo=bar` 来查看 `bar` 打印到你的网页上。为了看到 `$html_escape()` lambda\
    \ 的实际效果，我们需要传入一些 URL 编码的特殊字符，而不是 `bar`：\n\n```\nhttp://127.0.0.1:7355?foo=%3Cbang%3E\n\
    ```\n\n这将以正确的 HTML 编码方式将结果（`<bang>`）打印到屏幕上。\n\n现在你已经看到了一些事件驱动编程，并使用单子来避免痛苦的列表交互，但拐角处隐藏着什么？回调地狱！如果你以前以事件驱动的方式编写过代码，你可能已经遇到了深度嵌套回调函数导致代码难以阅读的问题。有一些模式可以用来避免这个问题，将在下一节中介绍。\n\
    \n## 8.5 回调驯服\n\n事件驱动编程，如果任其发展，很快就会进入被称为 `callback hell` 的阶段。不幸的是，下一级必然是死亡或重大重构，如下面这个高度刻意的代码所示。\n\
    \n**Listing 8.2**\n\n```\n\n```\n\n你可以从一开始就通过在编写的代码中采用一些预定义的模式来避免这种情况。为了让这笔交易更甜蜜，有一些简单但强大的库，使实现这些模式变得更容易。这使你能够专注于你的代码，将问题抽象化。\n\
    \n我们将回顾两个采用不同方法解决该问题的库。它们都是更大的 ReactPHP 项目的一部分，尽管它们是两个不同 JavaScript 库的仿真。\n\n\
    ### Async\n\n先从两个库中较简单的一个开始，Async，它是 async.js 中思想的 PHP 实现。它通过允许你将回调定义为列表而不是相互嵌套来简化回调。与之前一样，当你在之前尝试\
    \ ReactPHP Web 服务器的同一目录中使用 Composer 时，安装相对简单：\n\n```\n\n```\n\n你可以并行调用函数，也可以作为瀑布调用。通过使用并行实现，你实际上是将相同的调用传递给一组函数，并按返回顺序而不是定义顺序组合它们的结果。这在项目文档中的这个示例（Listing\
    \ 8.3）中得到了清晰的演示。\n\n**Listing 8.3**\n\n```\n\n```\n\n瀑布模型不同，因为它会将前一个函数的返回值作为参数传递给下一个函数。这样，函数按定义顺序返回它们的结果。Listing\
    \ 8.4 同样取自 React/Async 项目的文档。\n\n**Listing 8.4**\n\n```\n\n```\n\n这里你有两种简单的方法来驯服狂野的回调函数，但我承诺过更多！下一个库是\
    \ CommonJS 中发现的功能子集的实现。\n\n### Promises\n\n这种模式被称为 promise，它更复杂，而且更强大。一段代码可以承诺在其异步操作（称为\
    \ deferred）完成后返回某个值。我们不想延迟执行，所以我们信守承诺，接受一个占位符。这个占位符，或者说 promise，可以在函数之间传递，直到需要结果才能继续执行。在数据库写入的情况下，你可以将其放入异步操作中，并监视结果以显示通知或尝试重新保存。\n\
    \nReact/Promise 还使管理许多操作的处理成为可能。我们在这里只讨论其功能的一个小子集，尽管该项目的 GitHub 页面上有更多文档。\n\n\
    首先，我们需要使用 Composer 安装 React/Promise，安装说明与之前指定的相同。\n\n```\n\n```\n\n首先，我们将创建一个名为\
    \ `elog()` 的简单日志函数，它是 `echo log` 的缩写。它将接受一个标题、一个正文，以及一个打印或返回格式化日志的选项。\n\n```\n\
    \n```\n\n接下来是一个简单的 PHP 函数对象，它将处理从 Unix 随机源 `/dev/urandom` 读取流。为了明显起见，我们将这个类称为\
    \ `ReadStream`。\n\n```\n\n```\n\n> `/dev/urandom` 是 POSIX 系统上的非阻塞随机二进制信息源。它与 `/dev/random`\
    \ 类似，但加密安全性较低，因为它重用内部熵池来生成伪随机位。这种重用使其潜在安全性较低，但对于我们的目的来说，它足够好。\n\n> \n\n> 如果你在\
    \ Windows 机器上跟随操作，那么没有简单的 `/dev/random` 等价物——或者 `/dev/urandom` 也是如此——你可以简单地使用一个大文本文件作为以下示例的源。\n\
    \n你有一个带有两个属性的简单类，以便稍后使用，所以让我们添加一个静态方法来绑定一个解析器（promise 库的跟踪组件）并返回 `ReadStream`\
    \ 的新实例。\n\n```\n\n```\n\n解析器是使用类方法设置的，如你在前面的代码块中所见，所以让我们定义它：\n\n```\n\n```\n\n\
    要添加到 `ReadStream` 函数对象的最终方法是魔术 `__invoke()` 函数。\n\n```\n\n```\n\n为了分解其操作，我们将从函数的第一行开始。它从文件流中读取\
    \ 16 个字节，然后使用 base 64 对其进行编码。这给了我们从随机源读取的二进制数据的字符串表示。\n\n然后将其添加到 `data` 类属性中，以便在对该函数对象的异步调用之间保持一些状态。随着每行随机数据的处理，代码在\
    \ promise 上调用 `progress()` 来记录异步代码的状态。最后，如果我们有超过一千个字符的随机信息，我们将 promise 标记为已完成。\n\
    \n要获取随机流，我们必须先获取一个文件资源句柄并将其设置为非阻塞流。\n\n```\n\n```\n\n到目前为止，代码几乎还没有触及 React/Promise\
    \ 提供的功能，但这即将改变！这一切始于声明一个新的延迟 promise 和一组回调来处理来自 promise 的解析器的结果。\n\n**Listing\
    \ 8.5**\n\n```\n\n```\n\n当 promise 中继事件（例如其进度被更新或最终被解析）时，`then()` 方法会按顺序调用。让我们先关注后者，因为我们看到第一个\
    \ `then()` 块返回的结果被传递作为第二个块的输入。\n\n"
