    \n# 5 HHVM 的 Hack\n\n> “从未与任何人进行过数学对话，因为我的领域里没有其他人。”\n\n> \n\n> —Alonzo Church（数学家和逻辑学家，1903–1995）\n\
    \nFacebook 多年来一直在使用 PHP，但随着网站会员数量的增长，加载时间也随之增加。为了加快 PHP 速度，他们编写了一个仅供内部使用的转译器，可将\
