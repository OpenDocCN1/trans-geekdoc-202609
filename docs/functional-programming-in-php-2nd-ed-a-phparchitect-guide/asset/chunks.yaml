    into one super `Applicative`. In the second case, we are applying the function
    wrapped in `Applicative` (`$this->function` in the example) to an array of supplied
    parameters. The next step is to define the `amap()` function itself so we can
    actually begin using the `Applicative` type class.


    **Listing 6.8**


