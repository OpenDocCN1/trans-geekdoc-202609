    ### Function Objects


    It is possible to treat a class instance as a function in PHP by calling any object
    implementing the `__invoke()` magic method as a function. This process is commonly
    known in the PHP world as a functor. In effect, the class instance becomes a closure
    when called in this way.


    **Listing 3.6**


    ```


    ```


    There are a number of reasons you might consider implementing your functions in
    this way, but the major advantages are that a closure becomes much easier to reuse
    and affords the ability to be more specific when type hinting. Of course, one
    limitation is a class can only have one function called in this manner. You can
    also access the class context, allowing for complex algorithms to be wrapped up
    into a neat package.


    When the magic method is invoked it has the same scope as any class method meaning
    it can access any of the state contained in the object. In the case of the `SumFunctor`
    it would be possible to call another method to perform the calculation.


