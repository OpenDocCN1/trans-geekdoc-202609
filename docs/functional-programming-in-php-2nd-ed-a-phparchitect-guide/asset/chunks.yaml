    ## 6.3 处理你的 NULL 值


    PHP 中有许多函数——我相信你所处理的旧版用户代码中有更多——在找不到记录时会返回 `NULL`，例如。当你调用该函数时，你无法确定它是否会返回你期望的记录或一个
    null 值，这违反了函数应始终返回相同类型以便以相同方式处理的原则。


    我们之前实现了 PHP 的 `array_reduce()` 函数，它再次作为一个很好的示例。当它接收到一个空数组时，会返回 `NULL`。想象一下，如果我们的缩减操作结果被传递给一个期望接收整数的函数，那么将触发
    PHP 解析器的错误。有几种方法可以处理这些 null 值并保护你的代码免受意外错误的影响。


    在 `array_reduce()` 的情况下，你可以简单地将初始值作为第三个参数传递给函数。如果输入数组为空，则返回此初始值。否则，它将被用作每个缩减操作添加的基础值。


    如果你无法控制正在调用的代码，或者你正在实现一个不允许默认返回值的函数，那么你可以使用以下两种技术。


    第一种是利用 PHP 三元运算符的隐式返回值属性的一个非常简单的解决方案。这通过将三元运算中的第二个表达式留空来实现，如下所示：


    ```


    ```


    这段代码将把 `get_record()` 的返回值赋给 `$var`，除非它是 null，在这种情况下，它将把示例中三元运算第三个表达式指定的空数组赋给
    `$var`。


    PHP 7 的新功能是 `null` 合并中缀运算符。与我们之前考察的短三元运算不同，它会为你执行 `isset` 操作。实际上，新语法提供了一种简单的方式来表达“如果已设置且不为空，则返回此变量的值”。这被称为
    issetor 操作，如果值已设置则返回该值，否则调用下一个运算符。


    ```


    ```


    也可以通过多次调用来链式操作，以获取第一个返回非 `null` 值的项目。


    ```


    ```


    你也可以像使用变量一样轻松地对函数调用这样做。


    ```


