- raw: "> “…about programming using mathematical functions. Whenever you supply it\
    \ with the same argument it returns the same result. Every time I execute it,\
    \ it will give me the same result.”\n\nThis description of functional programming\
    \ will make more sense once you have had more exposure to functions as it alludes\
    \ to referential transparency which is addressed deeper in the book, after discussing\
    \ the base concepts.\n\nSo just how do you get anything done in a functional style?\
    \ Surely, without assignment statements nothing is possible? How do you pass values\
    \ around in your programs?\n\nThe answer is incredibly simple; values can be passed\
    \ from function to function as arguments and return values. Extending this idea\
    \ further, we can have functions that return functions or accept functions as\
    \ parameters. The more you think about it, the more powerful it becomes.\n\nThese\
    \ combinations of functions express the program’s intent succinctly and cleanly.\
    \ The immutable constructs help to ensure side effects cannot work their way into\
    \ a functional program. Here I am referring to the avoidance of variable assignments,\
    \ which is the fundamental basis of imperative languages.\n\nHumble functions\
    \ are far more useful and powerful than most object-oriented PHP programmers give\
    \ them credit for.\n\n## 2.1 Let’s See Some Code\n\nTo wipe that look of incredulity\
    \ from your face; here is a simple imperative example which sums all the integers\
    \ from one to ten:\n\n```\n\n```\n\nVersus a more functional style using PHP’s\
    \ `range()` and `array_sum()` functions to generate an array from 1 to 10 and\
    \ sum all of its values:\n\n```\n\n```\n\nHere we have hit upon a key concept\
    \ and benefit of functional programming. Instead of detailing the steps required\
    \ to sum the numbers, we have merely described the result we want when given a\
    \ set of values.\n\nWe have also managed to avoid the use of state-tracking variables\
    \ (`$sum` in the imperative example) and automatically divided the units of work\
    \ up into reusable functions. If we need a `range()` elsewhere, we can easily\
    \ reuse the same code.\n\nConversely in the imperative example, we are required\
    \ to do all the leg work such as looping and maintaining state using variable\
    \ assignments. Perhaps this could be considered somewhat like writing a recipe,\
    \ where the constants are your ingredients list and the loop is equivalent to\
    \ the step-by-step directions.\n\nContinuing the food-based analogy, we might\
    \ suggest the functional example is more akin to ordering a meal at a restaurant\
    \ where you simply pick from a menu. Although, like a good pizzeria, you can always\
    \ add more toppings yourself!\n\nAs you can probably see, functional programming\
    \ and well-designed, object-oriented code can be very similar in that they both\
    \ aspire to encapsulate and break down units of work into smaller reusable chunks.\n\
    \n## 2.2 History\n\nThe history of functional programming and indeed computing,\
    \ in general, is entirely dependent on the work completed in the fields of mathematics\
    \ and logic. It is possible to trace back the collective accumulation of knowledge\
    \ in these areas to some of the earliest recorded philosophers and mathematicians.\n\
    \nTo mention both Socrates and Aristotle is not out of place when considering\
    \ their contributions to the understanding of logic. That is to say, the roots\
    \ of computing extend way back beyond 400BC. Some time later in mid-200BC Archimedes\
    \ would write some of the very earliest beginnings of calculus, which were later\
    \ discovered in a codex known as the Archimedes Palimpsest. It had been overwritten\
    \ with religious text in the 13th century and therefore lost to humanity. Luckily\
    \ most of it has been recovered through the use of various imaging equipment including\
    \ X-Rays, but much too late to inform the calculus visionaries we will meet next.\n\
    \nFrom a functional point of view however, it begins to get interesting in 1666\
    \ and 1675 when both Isaac Newton and Gottfried Leibniz (respectively) documented\
    \ the earliest formalisms of calculus. This mathematical discovery was the foundation\
    \ of all functional thinking and an important part of computational history in\
    \ general.\n\nSupposedly, unbeknownst to either man, they had both been working\
    \ on their papers at the same time. Purely by coincidence, they arrived at similar\
    \ conclusions at a similar time. In reality, it is more likely the theoretical\
    \ groundwork had already been laid by prior minds and the conditions were right\
    \ for someone to make the next logical step forward.\n\nNever the less some controversy\
    \ surrounds this part of history as Newton had been working on calculus, but did\
    \ not publish anything until 1693. Leibniz, on the other hand, published in 1684\
    \ and was most likely aware of Newton’s earlier work as they were both members\
    \ of the Royal Society in London.\n\nWhen asked to formally determine who had\
    \ invented calculus the Society stated that while Leibniz had been first to publish,\
    \ Newton had created it. Disturbingly, Newton was president of the Royal Society\
    \ in London at the time, and therefore would have had influence over its final\
    \ decision. Later, the Society would make claims of plagiarism against Leibniz,\
    \ further tarnishing his name and would eventually cement his relegation to the\
    \ annals of history.\n\nDespite this, his impact upon mathematics and calculus\
    \ is clear. Leibniz’s notation for calculus is still in use today and he would\
    \ later go on to produce a calculation machine. This machine was based upon the\
    \ binary ideas from ancient China. This would prove to be the basis of modern\
    \ computing as we know it.\n\n> **The Story of George Boole**\n\n> \n\n> George\
    \ Boole was an English mathematician and logician who gave his name to Boolean\
    \ logic. Born into a working class family he was not the typical child prodigy\
    \ of his era. He taught himself mathematics and logic by spending extended periods\
    \ in a reference library. Later on, he would become the first professor of mathematics\
    \ at Queens College, Cork in Ireland. This is where he would meet his wife Mary\
    \ Everest (a niece of George Everest whom Mt. Everest is named after). Interestingly\
    \ while the mountain is pronounced Ever-est, their family name was actually pronounced\
    \ as Eve-rest.\n\n> \n\n> It was at this same institution Boole caught a cold\
    \ that would lead to his eventual death. While walking to give a lecture, he was\
    \ saturated by a heavy rain storm. After giving the lecture in wet clothes he\
    \ became ill and was cared for by his wife. Unfortunately, she subscribed to a\
    \ theory, common at the time, that cause is cure. To this end, she threw buckets\
    \ of cold water over him as he lay stricken in bed. The theory held that if it\
    \ was cold water that caused the illness, then more of the same would cure it.\
    \ His condition worsened and on the 8th of December 1864 he died. A highly illogical\
    \ end to befall a seminal logician!\n\n> \n\n> While not a direct contributor\
    \ to the history of functional programming he did influence the progress of logic\
    \ and worked extensively on Boolean algebra. He did teach himself calculus, but\
    \ it was not his primary area of study.\n\n> \n\n> The Boolean algebra he devised\
    \ was used to layout logical arguments and ascertain an answer or outcome. The\
    \ idea was to create a language applicable to any logical statement, to determine\
    \ the validity of that statement. This supported further discoveries in logic\
    \ and mathematics.\n\nIn the interim, no major breakthroughs were found in the\
    \ field of calculus. Logicians were hard at work though, formulating systems and\
    \ proofs to describe the world.\n\nGottlob Frege would go on to further develop\
    \ calculus by defining the first predicate calculus. Some of the developments\
    \ he worked on are still in use to this day. His main concern though was to prove\
    \ mathematics could be completely described by logic. Unfortunately for him, this\
    \ turned out to be false."
