    \ in a reference library. Later on, he would become the first professor of mathematics\
    \ at Queens College, Cork in Ireland. This is where he would meet his wife Mary\
    \ Everest (a niece of George Everest whom Mt. Everest is named after). Interestingly\
    \ while the mountain is pronounced Ever-est, their family name was actually pronounced\
    \ as Eve-rest.\n\n> \n\n> It was at this same institution Boole caught a cold\
    \ that would lead to his eventual death. While walking to give a lecture, he was\
    \ saturated by a heavy rain storm. After giving the lecture in wet clothes he\
    \ became ill and was cared for by his wife. Unfortunately, she subscribed to a\
    \ theory, common at the time, that cause is cure. To this end, she threw buckets\
    \ of cold water over him as he lay stricken in bed. The theory held that if it\
    \ was cold water that caused the illness, then more of the same would cure it.\
    \ His condition worsened and on the 8th of December 1864 he died. A highly illogical\
    \ end to befall a seminal logician!\n\n> \n\n> While not a direct contributor\
    \ to the history of functional programming he did influence the progress of logic\
    \ and worked extensively on Boolean algebra. He did teach himself calculus, but\
    \ it was not his primary area of study.\n\n> \n\n> The Boolean algebra he devised\
    \ was used to layout logical arguments and ascertain an answer or outcome. The\
    \ idea was to create a language applicable to any logical statement, to determine\
    \ the validity of that statement. This supported further discoveries in logic\
    \ and mathematics.\n\nIn the interim, no major breakthroughs were found in the\
    \ field of calculus. Logicians were hard at work though, formulating systems and\
    \ proofs to describe the world.\n\nGottlob Frege would go on to further develop\
    \ calculus by defining the first predicate calculus. Some of the developments\
    \ he worked on are still in use to this day. His main concern though was to prove\
    \ mathematics could be completely described by logic. Unfortunately for him, this\
    \ turned out to be false.\n"
  trans: "\n\n> “…about programming using mathematical functions. Whenever you supply\
    \ it with the same argument it returns the same result. Every time I execute it,\
    \ it will give me the same result.”\n\n这段关于函数式编程的描述，在你对函数有更多了解后会更容易理解，因为它暗示了引用透明性，这一概念将在本书讨论基础概念后进一步阐述。\n\
    \n那么，你究竟如何以函数式风格完成任务呢？难道没有赋值语句就什么都做不了吗？你如何在程序中传递值？\n\n答案非常简单；值可以作为参数和返回值在函数之间传递。进一步延伸这个想法，我们可以拥有返回函数或将函数作为参数的函数。你越是思考，它就越强大。\n\
    \n这些函数组合简洁而清晰地表达了程序的意图。不可变结构有助于确保副作用无法渗入函数式程序。这里我指的是避免变量赋值，这是命令式语言的基本基础。\n\n谦卑的函数比大多数面向对象的\
    \ PHP 程序员所承认的要有用和强大得多。\n\n## 2.1 Let’s See Some Code\n\n为了消除你脸上难以置信的表情；这里有一个简单的命令式示例，用于求一到十的所有整数之和：\n\
    \n```\n```\n\n与使用 PHP 的 `range()` 和 `array_sum()` 函数生成 1 到 10 的数组并求和的更函数式风格相比：\n\
    \n```\n```\n\n这里我们触及了函数式编程的一个关键概念和优势。我们没有详细说明求和所需的步骤，而是仅仅描述了给定一组值时我们想要的结果。\n\n\
    我们还设法避免了使用状态跟踪变量（命令式示例中的 `$sum`），并自动将工作单元划分为可重用的函数。如果我们在其他地方需要 `range()`，可以轻松重用相同的代码。\n\
    \n相反，在命令式示例中，我们需要完成所有繁重的工作，例如使用变量赋值进行循环和维护状态。这或许可以被视为类似于写食谱，其中常量是你的食材清单，循环相当于逐步说明。\n\
    \n延续这个基于食物的类比，我们可以说函数式示例更像是在餐厅点餐，你只需从菜单中选择。当然，就像一家好的披萨店，你也可以随时自己添加更多配料！\n\n正如你可能看到的，函数式编程和设计良好的面向对象代码可以非常相似，因为它们都旨在封装并将工作单元分解为更小的可重用块。\n\
    \n## 2.2 History\n\n函数式编程以及计算机领域的历史，完全取决于数学和逻辑领域完成的工作。可以将这些领域的知识积累追溯到一些最早的记录哲学家和数学家。\n\
    \n提到苏格拉底和亚里士多德并不为过，考虑到他们对逻辑理解的贡献。也就是说，计算机的根源远远延伸至公元前 400 年之前。大约在公元前 200 年中期，阿基米德撰写了微积分的最早开端之一，这些内容后来在被称为《阿基米德抄写本》的手抄本中被发现。它在\
    \ 13 世纪被宗教文本覆盖，因此对人类来说失传了。幸运的是，大部分内容已通过各种成像设备（包括 X 射线）恢复，但为时已晚，无法为我们将要遇到的微积分先驱们提供参考。\n\
    \n然而，从函数式角度来看，事情在 1666 年和 1675 年开始变得有趣，当时艾萨克·牛顿和戈特弗里德·莱布尼茨（分别）记录了微积分的最早形式化。这一数学发现是所有函数式思维的基础，也是计算机历史的重要组成部分。\n\
    \n据说，两人互不知情，却同时在撰写他们的论文。纯属巧合，他们在相似的时间得出了相似的结论。实际上，更可能是之前的思想家已经奠定了理论基础，条件已经成熟，让某人能够迈出下一个逻辑步伐。\n\
    \n尽管如此，这段历史仍存在一些争议，因为牛顿一直在研究微积分，但直到 1693 年才发表任何内容。另一方面，莱布尼茨于 1684 年发表，并且很可能知道牛顿较早的工作，因为他们都是伦敦皇家学会的成员。\n\
    \n当被要求正式确定谁发明了微积分时，皇家学会表示，虽然莱布尼茨是第一个发表的人，但牛顿创造了它。令人不安的是，牛顿当时是伦敦皇家学会的主席，因此对最终决定有影响力。后来，学会指控莱布尼茨剽窃，进一步玷污了他的名声，并最终将他贬低到历史的尘埃中。\n\
    \n尽管如此，他对数学和微积分的影响是显而易见的。莱布尼茨的微积分记号至今仍在使用，他后来还制造了一台计算机。这台机器基于来自古代中国的二进制理念。这被证明是我们所知的现代计算机的基础。\n\
    \n> **乔治·布尔的故事**\n\n> \n\n> 乔治·布尔是一位英国数学家和逻辑学家，布尔逻辑以他的名字命名。他出生于工人阶级家庭，并非他那个时代典型的神童。他通过在参考图书馆长时间学习，自学了数学和逻辑。后来，他成为爱尔兰科克女王学院的第一位数学教授。在那里，他遇到了他的妻子玛丽·埃弗雷斯特（乔治·埃弗雷斯特的侄女，珠穆朗玛峰以他命名）。有趣的是，虽然这座山发音为\
    \ Ever-est，但他们的家族姓氏实际上发音为 Eve-rest。\n\n> \n\n> 正是在这所同一机构，布尔感冒了，最终导致了他的死亡。当他走去讲课时，被一场大雨淋湿。穿着湿衣服讲完课后，他生病了，由他的妻子照顾。不幸的是，她信奉一种当时普遍的理论，即“病因即治疗”。为此，当他卧病在床时，她往他身上泼冷水。该理论认为，如果冷水导致了疾病，那么更多的冷水就会治愈它。他的病情恶化，并于\
    \ 1864 年 12 月 8 日去世。一位开创性逻辑学家遭遇如此不合逻辑的结局！\n\n> \n\n> 虽然他不是函数式编程历史的直接贡献者，但他确实影响了逻辑的进步，并广泛研究了布尔代数。他自学了微积分，但这并非他主要的研究领域。\n\
    \n> \n\n> 他创立的布尔代数用于阐述逻辑论证并确定答案或结果。其理念是创造一种适用于任何逻辑陈述的语言，以确定该陈述的有效性。这支持了逻辑和数学的进一步发现。\n\
    \n在此期间，微积分领域没有发现重大突破。逻辑学家们仍在努力工作，制定系统和证明来描述世界。\n\n戈特洛布·弗雷格通过定义第一阶谓词演算进一步发展了微积分。他研究的一些发展至今仍在使用。然而，他的主要关注点是证明数学可以完全由逻辑描述。不幸的是，这被证明是错误的。\n\
    \n"
