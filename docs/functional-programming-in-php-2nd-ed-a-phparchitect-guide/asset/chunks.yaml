    Unknown”, but if a name is found, then it should append the label “(verified)”
    to the person’s name, rendering “Name: Marion (verified)”. It becomes very tiresome
    to always check the return values of each call to a resource which may or may
    not exist, and it is much easier to always assume it does. In Haskell, this is
    known as the `Maybe` monad, and we will simulate it here in PHP.


