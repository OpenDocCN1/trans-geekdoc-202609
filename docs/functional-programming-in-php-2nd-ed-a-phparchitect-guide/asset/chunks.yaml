    \ types operators. In the case of a new type based upon an integer this would\
    \ mean you would then have access to the arithmetic operators such as `+`, `*`,\
    \ `/` and `-` amongst others. Unlike `newtype` you now actually have a usable\
    \ type!\n\n**Listing 5.2**\n\n```\n// in `types.php`\nnewtype PostId as int =\
    \ int;\n\nfunction getPostId(int $id): PostId {\n   return $id;\n}\n\n// in `blog_post.php`\n\
    function validateId(PostId $id): bool {\n   return ($id > 1);\n}\n\nfunction main():\
    \ void {\n   $id = getPostId(10);\n   validateId($id); // true\n}\n```\n\nThere\
    \ are a few items of note in Listing 5.2 beginning with the use of a function\
    \ (`getPostId()`) to obtain a value of type `PostId` from an `int`. The function\
    \ accepts an `int`, but its return type is specified as `PostId` and this is enough\
    \ to convince Hack any integer value passed through it is now a `PostId`.\n\n\
    In the `validateId()` function a comparison operator is used to check that the\
    \ `PostId` is greater than one. This comparison operator would not work without\
    \ the `as` keyword section in the original `newtype` definition.\n\nThis is also\
    \ the first time we have seen the `main()` function in use with Hack. This is\
    \ the default function the type checker bootstrap process will call when the project\
    \ is built. Any top level code should go into this function or the Hack type checker\
    \ will throw an error stating only `require` requests are allowable at the top\
    \ level. Note a new type of `void` has been specified as the return type of this\
    \ function as well. This means no value will be returned by the function in question.\n\
    \nNow let’s break something! The type checker will get upset if you try to treat\
    \ a Boolean return value as a `PostId` as shown below. It will not allow you to\
    \ effectively convert a Boolean value to a `PostId` (an `int` underneath).\n\n\
    Now we have a type which is usable with operators, but cannot be treated as its\
    \ underlying type when type checking. This prevents an `integer` value from incorrectly\
    \ being evaluated as a `PostId`.\n\n### Generics\n\nHack also allows the definition\
    \ of generics which allow you to approach your work in a way previously impossible\
    \ with PHP. You can define a data agnostic handling class which will be typed\
    \ via inference at the point it is used—much like the `Vector` we reviewed earlier.\n"
  trans: "\n\n| `Pair` || 索引集合，用于存储两个值 |\n\n这些类型处理我们处理列表的常见方式，但它们减轻了我们像在 PHP 中那样实现它们的负担。要创建一个新集合，你可以定义类似这样的内容：\n\
    \n```\n$vector = Vector {1, 2};\n$vector->add(3);\n// Vector(1, 2, 3)\n```\n\n\
    为了兼容性，你仍然可以像在 PHP 中一样使用数组，但也可以使其更具体。数组的类型可以根据其值和键/索引来定义。\n\n键和值的定义很简单：\n\n```\n\
    array<int, string>\n```\n\n其中数组具有整数键，值为字符串，如果你只想指定值的类型而不指定键，请使用：\n\n```\narray<string>\n\
    ```\n\n这允许解析器对数组进行类型检查，并防止列表变成一堆杂乱的值。当你操作列表时，你希望能够以尽可能少的困难以相同的方式处理所有值。通过像这样指定类型签名，你可以确保始终获得字符串（或你指定的类型）。\n\
    \n```\nclass HackArray {\n   public array<int, string> $array = [\n      1 =>\
    \ 'ibizo',\n      2 => 'umuntu',\n      3 => 'inja',\n   ];\n}\n```\n\n如果你希望拥有一个不可变数组，Hack\
    \ 通过使用 `tuple` 使其成为可能，它可以定义为：\n\n```\n$t = tuple(1, 2, 3);\n$sum = array_sum($t);\
    \ // 6\n```\n\n作为一种不可变类型，一旦 `tuple` 被定义，它就不能被更改，如果这样做会导致错误。\n\n这些数组作为简单的集合或更多面向自定义应用程序的集合类的基础。如果你需要一个像\
    \ `Set` 这样的集合，最好使用 Hack 提供的 `Set` 集合，而不是编写自己的。这有两个原因，主要都是出于效率考虑；它是任何 Hack 程序员都能轻松识别的结构，并且作为语言的一部分，它默认经过优化。\n\
    \n除了集合和数组，Hack 还定义了其他有用的类型，例如 `Enum`、`Generic`、`Shape`。在 `Enum` 的情况下，你可以定义一个枚举类型，它只允许在定义中指定的值被赋给任何变量。这在清单\
    \ 5.1 中被演示为博客文章发布状态。\n\n**清单 5.1**\n\n```\nenum BlogPostState: int {\n   Published\
    \ = 1;\n   Queued = 0;\n   Draft = -1;\n}\n\nclass BlogPost {\n   public BlogPostState\
    \ $state = BlogPostState::Published;\n   public function getState(): BlogPostState\
    \ {\n      return $this->state;\n   }\n}\n```\n\n`Enum` 类型有许多用途，当布尔值不够用时，它为你提供了一种非常简单的存储机制。\n\
    \n稍微不那么令人兴奋的是，为函数参数添加了 `nullable` 类型提示，形式是在参数前加上问号（`?`）。这允许你在定义函数时指示哪些参数可以接受 `null`\
    \ 值。通常，它在函数式代码中不会大量出现，因为它允许在应用程序期望确定类型的地方传入 `null`。\n\n```\nfunction spit(?string\
    \ $rhyme) {\n   return (string) $rhyme;\n}\n```\n\n你现在可以用 `null` 作为参数调用 `spit()`\
    \ 函数，而不是指定的 `string`，它会毫无怨言地解析这一点。\n\n```\n$r1 = spit('Ibizo');\n$r2 = spit(null);\n\
    ```\n\n### 类型别名\n\nHack 允许开发者将内部类型别名为新的、更具体的名称，这些名称可用于在处理函数参数和注解时进行更准确的类型检查。有时这非常有用，尤其是在处理字符串时。字符串是什么？嗯，它们可能是日期、URL、ISBN、电话号码或其他结构化字符串，给它们定义类型会很有帮助，这样它们就可以被略有不同地处理。\n\
    \n```\ntype PhoneNumber = string;\n```\n\n一旦类型被别名，它就可以在正常的类型提示场景中使用，例如函数参数和返回类型。\n\
    \n```\n$phoneNumber = '+44.790 000 0000';\nfunction removePhoneNumberFormatting(PhoneNumber\
    \ $pn) {\n   return str_replace(\n      ['+', '.', ' '], \n      ['00', '', ''],\n\
    \      $pn\n   );\n}\n$dialable = removePhoneNumberFormatting($phoneNumber);\n\
    ```\n\n这就是 Hack 所称的类型别名，但它还支持不透明类型别名，这是一种比我们已经看到的别名更受保护的版本。它隐藏了底层类型的含义，这意味着在严格模式下，对于上面的电话号码，它将无法作为\
    \ `string` 进行操作。\n\n一个小注意事项是，在声明 `newtype` 的文件中，你可以像使用底层类型一样使用该类型/值。在字符串的情况下，你可以在源文件中将其连接，但在任何其他使用该类型的文件中，你将无法这样做。如果你有一个名为\
    \ `types.php` 的文件使用 `newtype` 关键字声明别名，随后有一个 `blog_post.php` 文件像下面的示例中那样使用该类型，你将无法在\
    \ `blog_post.php` 中像操作字符串一样操作 URL slug。\n\n我还没有找到 `newtype` 关键字的用途，因为我一直希望能访问底层实现，而且它似乎类似于在编写库类代码时使用\
    \ `private` 方法。它使代码更难以使用，并且在大多数情况下几乎没有或没有好处。直到你将其与 `as` 关键字结合使用；现在你拥有了一个纯粹的 `newtype`\
    \ 本应具备的东西！一种不能被类型检查为其底层类型，但可以与底层类型的运算符一起使用的新类型。在基于整数的新类型的情况下，这意味着你将能够访问算术运算符，例如\
    \ `+`、`*`、`/` 和 `-` 等。与 `newtype` 不同，你现在实际上拥有一个可用的类型！\n\n**清单 5.2**\n\n```\n//\
    \ in `types.php`\nnewtype PostId as int = int;\n\nfunction getPostId(int $id):\
    \ PostId {\n   return $id;\n}\n\n// in `blog_post.php`\nfunction validateId(PostId\
    \ $id): bool {\n   return ($id > 1);\n}\n\nfunction main(): void {\n   $id = getPostId(10);\n\
    \   validateId($id); // true\n}\n```\n\n清单 5.2 中有几个值得注意的地方，首先是使用函数（`getPostId()`）从\
    \ `int` 获取 `PostId` 类型的值。该函数接受一个 `int`，但其返回类型指定为 `PostId`，这足以让 Hack 相信任何通过它传递的整数值现在都是\
    \ `PostId`。\n\n在 `validateId()` 函数中，使用比较运算符来检查 `PostId` 是否大于一。如果没有原始 `newtype`\
    \ 定义中的 `as` 关键字部分，这个比较运算符将无法工作。\n\n这也是我们第一次看到 `main()` 函数在 Hack 中的使用。这是类型检查器引导过程在构建项目时会调用的默认函数。任何顶级代码都应该放入此函数中，否则\
    \ Hack 类型检查器会抛出错误，指出顶级只允许 `require` 请求。请注意，此函数的返回类型也指定了新的 `void` 类型。这意味着该函数不会返回任何值。\n\
    \n现在让我们搞点破坏！如果你尝试将布尔返回值视为 `PostId`，类型检查器会不高兴，如下所示。它不会允许你有效地将布尔值转换为 `PostId`（底层是\
    \ `int`）。\n\n现在我们有一个可以与运算符一起使用的类型，但在类型检查时不能将其视为其底层类型。这防止 `integer` 值被错误地评估为 `PostId`。\n\
    \n### 泛型\n\nHack 还允许定义泛型，这使你能够以 PHP 之前不可能的方式处理工作。你可以定义一个与数据无关的处理类，它将在使用点通过推断进行类型化——这与我们之前审查的\
    \ `Vector` 非常相似。\n\n"
