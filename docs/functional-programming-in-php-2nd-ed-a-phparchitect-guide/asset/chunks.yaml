  trans: "\n\n在编写任何代码之前，规划 API 完成后的样子是很有帮助的。一种简单的方法是列出你打算创建的命名空间。对于 HTML，这可能看起来像下面这样的命名空间列表：\n\
    \n*   `\\FpPhp\\Utils`\n\n*   `\\FpPhp\\Html\\Html4`\n\n*   `\\FpPhp\\Html\\Html5`\n\
    \n然后，在每个命名空间下列出可能需要的函数会更容易。在当前示例中，这可能看起来像下面这样的按命名空间分组的函数列表：\n\n*   `\\FpPhp\\\
    Utils` \n\n    *   `ensure_array`\n\n*   `\\FpPhp\\Html\\Html4` \n\n    *   `div`\n\
    \n    *   `a`\n\n*   `\\FpPhp\\Html\\Html5` \n\n    *   `section`\n\n    *   `aside`\n\
    \n虽然不可避免地还有更多函数可以添加到列表中，但为了简洁起见，这里只包含示例中要实现的函数。\n\n我通常在代码中绘制这些功能草图，定义命名空间并在其下方包含函数存根。这样，它们很容易移动，并且在实现时部分工作已经完成。与此同时，我也开始为添加到命名空间中的函数编写单元测试。这使我能够在开发过程中轻松确保函数产生我期望的结果，并且额外的好处是重构可能更容易。\n\
    \n首先，我们将创建 `Utils` 命名空间，它将包含我们可能希望重用或与生成 HTML 无关的函数。\n\n**Listing 7.2**\n\n```\n\
    \n```\n\n对于这个特定的项目，我们只需要一个简单的函数，给定一个值，确保它是一个数组，如果不是，则将其包装在数组中：`ensure_array()`。\n\
    \n下一个命名空间将是 `Html4`，它在我们的领域特定语言中实现了 `div` 和 `a` 标签。\n\n**Listing 7.3**\n\n```\n\
    \n```\n\n如 Listing 7.3 所示，它实际上使用了另一个命名空间 `\\FpPhp\\Html`，并为 `div()` 和 `a()` 函数调用其中的方法。这个底层命名空间将包含\
    \ `Html4` 和 `Html5` 在生成各自标签时会使用的函数。标签函数本身（`a()` 和 `div()`）实际上非常简单，所有工作都交给了 `\\\
    FpPhp\\Html` 中的函数库。\n\n下一步是创建那个底层的函数库——哦，还有一个用于保存 HTML 标签属性值的类（`Attribute`）。首先，我们将实现\
    \ `\\FpPhp\\Html` 命名空间，以便我们可以开始向其中添加函数：\n\n```\n\n```\n\n到命名空间中，我们将首先添加一个简单的类，作为\
    \ HTML 属性（`class`、`href`、`style` 等）的容器。在这里使用类是必要的，因为我们希望以后能够针对属性值进行类型检查，并且它是预处理和存储结构化数据的一种不错的方式。\n\
    \n**Listing 7.4**\n\n```\n\n```\n\n构造函数是向结构中添加数据的唯一方式，这实际上创建了一个不可变结构，这意味着我们可以拦截值。我们需要值是一个数组，因此我们使用\
    \ Listing 7.2 中的 `Utils\\ensure_array()` 函数，这样任何标量值都将被转换为数组元素。\n\n为每个属性创建一个新的\
    \ `Attribute` 实例并不算太麻烦，但像任何优秀的程序员一样，我们很懒，所以我们将添加一个名为 `attr()` 的函数。这个函数将充当工厂，并简化创建新\
    \ `Attribute` 实例的过程。\n\n```\n\n```\n\n传入名称和值（标量或数组）将返回一个包含该信息的新 `Attribute` 类实例。使用这组代码创建新属性就这些了。接下来，我们将定义创建新标签并将其关联的\
    \ `Attribute`s 处理为 HTML 就绪字符串的函数。`tag()` 函数将生成一个新标签，它是一个很好的起点。\n\n**Listing 7.5**\n\
    \n```\n\n```\n\n当提供类型（`section`、`div` 等）和一些内容时，`tag()` 函数将生成一个 HTML 标签。所以如果你用\
    \ `div` 作为类型和 `sawubona` 作为内容调用它，它将发出 `<div>sawubona</div>`。它真的很简单，这个函数使得通过将名称作为类型传入（例如\
    \ `div`、`section` 或 `a`）来创建任何类型的 HTML 标签变得容易。\n\n那属性数组呢？这就是处理 `Attribute` 实例变得有点复杂的地方，我们将此工作交给另一个函数\
    \ `attrs_to_html()`，以将问题分解为更专注的函数。这是以更严格的函数式风格编程的便利功能之一，因为它自动让你拥有更多可重用的函数。\n\n\
    **Listing 7.6**\n\n```\n\n```\n\n在 Listing 7.7 中，`attrs_to_html()` 被定义为一个接受单个数组作为输入的函数，该数组应包含\
    \ `Attribute` 的实例。如果数组不为空，它将使用 `array_map()` 对数组中的每个值执行一个函数，然后将输出压缩为一个空格分隔的字符串。当\
    \ `$attrs` 为空时，`attrs_to_html()` 函数将简单地返回一个空字符串以示同情。现在，进入下一个函数 `attr_to_html()`，它由\
    \ `attrs_to_html()` 针对每个 `Attribute` 实例调用。\n\n**Listing 7.7**\n\n```\n\n```\n\n\
    实际上，`attr_to_html()` 是另一个中间函数，在压缩属性值列表（在 `class` HTML 属性的情况下，这些将是我们希望应用于标签的各种类；`col6\
    \ panel-padding round-border` 可能是输出示例）之后，将工作交给另一个名为 `render_attr()` 的函数。这个压缩后的列表和属性名称（`class`）将被传递给\
    \ `render_attr()` 以转换为 HTML 属性。\n\n**Listing 7.8**\n\n```\n\n```\n\n这又是一个相当简单的函数，但有几个方面值得指出。我们必须显式检查\
    \ `null`、`false` 和空字符串，是因为某些属性可能具有 `0` 的值，因此我们不能简单地像你最初可能期望的那样评估 `return ($value)?:`。假设传入的值为空，那么它将被添加而没有值，这适用于\
    \ HTML 表单输入上的 `disabled`、`selected` 或 `checked` 等属性。\n\n如果传递了实际值，那么它首先会被发送到 `esc_html()`，然后呈现为带引号的\
    \ HTML 属性。使用之前的示例，它将返回 `class=\"col6 panel-padding round-border\"`。`esc_html()`（Listing\
    \ 7.9）是 PHP 核心 `htmlspecialchars()` 函数的一个非常简单的包装器，因此可以毫不费力地以可重用的方式设置所有适当的标志。\n\
    \n**Listing 7.9**\n\n```\n\n```\n\n这就是 `FpPhp\\Html` 命名空间的全部内容。在转到 `FpPhp\\Html\\\
    Html5` 命名空间之前，我们可能应该先测试代码以确保其正常工作。\n\n**Listing 7.10**\n\n```\n\n```\n\n正如 Listing\
    \ 7.10 中的 `div` 示例所示，使用这个简单的 DSL 生成 HTML 相对容易。通过包装 `tag()` 函数，你可以快速向语言中添加新的 HTML\
    \ 标签，并通过相同的通用接口使用它们。\n\n那么，我们来为前面提到的 HTML5 命名空间添加一些更多方法吧。\n\n**Listing 7.11**\n\
    \n```\n\n```\n\n与之前的 HTML4 示例类似，Listing 7.11 只是向 DSL 中添加了两个新标签，以便你可以创建 `section`\
    \ 和 `aside` 标签。在任一命名空间中实现 `script`、`nav` 或 `main` 标签都微不足道。我认为引入新功能的最简单方法是编写一个单元测试——对于本书，我一直在使用\
    \ Sebastian Bergmann 的 PHPUnit\n\n作为最后一个示例，我们将使用现在可以在 `HTML4` 和 `HTML5` 命名空间中使用的领域特定语言函数来创建一段嵌套\
    \ HTML 的简短片段。Listing 7.12 创建了一段非常简单的 HTML，描述了旁边带有导航栏的文章。\n\n**Listing 7.12**\n\
    \n```\n\n```\n\n"
