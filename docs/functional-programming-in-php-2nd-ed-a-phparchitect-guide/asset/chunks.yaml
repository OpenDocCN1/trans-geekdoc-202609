    ## 6.10 Monads


    进一步延伸这个想法，你就接近了 monads 的概念。在理解函子和 applicatives 的基础上，你应该能更容易地掌握 monad 的内部操作，所以如果你还没有很好地掌握这些概念，我建议你在继续之前先回顾一下。


    Monads 可能是一个难以接近的概念，而相关的三个法则只会加深围绕它们的误解。为了平滑学习曲线，我将放弃形式主义，专注于结果。这可能不是纯函数式代码，但目的是让你走上理解
    monads 的道路。首先，让我们来谈谈那个显而易见的问题。使用 monad 最常被引用的原因是你可以维护状态，但这只是一个好处。它们还提供了一种可重复的方式来使用那些一开始彼此不兼容的函数。


    与纯函数式语言相比，Monads 在 PHP 中未必那么有用。在 PHP 中，有其他方法可以处理 monads 解决的问题，并且语言提供了更好的支持。然而，仅仅因为它不一定直接转化为现实世界的用例，并不意味着不应该使用熟悉的编程语言来探索和学习它。一个有些隐藏的秘密是，任何具有闭包和匿名函数的语言都可以产生
    monads！


    介绍 monads 的目的是，希望构建模拟，帮助你理解函数式语言中的类似概念，如果你希望探索它们的话。谁知道呢，你甚至可能在某个 PHP 项目中发现它们真的很有用。


    在免责声明说完之后，让我们深入探讨并回顾定义 monad 的核心原则。有三个普遍的数学法则，但我们稍后再讨论，因为它们使概念更难掌握。Monad 是一种设计模式，其中函数在接收包装值时返回包装值，这听起来就像我们已经看到的函子或
    applicatives，但当然有一两个诀窍。


    函子或 applicative 会通过将函数应用结果重新打包到相同的上下文中来返回结果，而没有这样的规则来约束我们的新朋友 monad。它可以接受一个返回不同上下文的函数并将其驯服。它不仅会应用这个函数，而且构造的
    monadic 特性还会帮助将函数链式应用到包装值上。


    Monads 实际上并不操作容器中的任何值，这是你要求它应用的函数的工作。就像 applicative 一样，它只知道如何应用提供的函数，但并不实际知道或定义任何变异逻辑。


    为了简单起见，在 PHP 中构建任何 monad 时，我们必须牢记以下准则。Monad 维护一个容器——我们之前已经看到的容器示例是我们定义的 `Just`
