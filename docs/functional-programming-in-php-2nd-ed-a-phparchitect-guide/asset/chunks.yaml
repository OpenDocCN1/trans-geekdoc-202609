    ```


    This is just the beginning of what is possible with this aspect of higher order
    functions and functional programming in general.


    You have probably already encountered frameworks such as Silex, Bullet, and Slim
    that use lambda functions to handle the route/request process. These are anonymous
    functions in the wild being passed into higher order functions within the framework.


    The other important property exhibited by higher order functions is the ability
    to return a function as a value and this allows for the creation of complex expressions
    (even more so with the help of closures). Keeping to simple functions and lambda
    functions it is possible to create a function which returns another function as
    a value.


