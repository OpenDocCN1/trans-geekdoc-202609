    # 8 事件驱动编程


    > “如果人们不相信数学很简单，那只是因为他们没有意识到生活有多么复杂。”


    > ——约翰·冯·诺依曼（数学家和物理学家，1903–1957）


    函数式代码的一个广泛应用场景是事件驱动编程。如果你之前编写过 JavaScript 代码，很可能已经有过这种编程范式的经验。`setInterval()`
    和 `onClick()` 等函数只是两个在 JavaScript 中采用事件驱动方法的示例。PHP 原生并不轻易支持这种工作方式，但幸运的是，有一些扩展和库可以提供帮助。


    函数式方法中移除和避免状态的特性，在处理异步代码时是一个主要优势。当然，如果没有 lambda 和闭包等简单的函数式构造来处理回调职责，创建此类程序也会困难得多。


    在 PECL 仓库中，有许多扩展旨在为 PHP 提供非阻塞 I/O 功能，例如 libevent、eio、event 和 ev。就库而言，有 ReactPHP（你可能从部分函数应用部分认出这个名字）以及一些其他不太知名的选项。为了演示目的，我们将使用
    ReactPHP。


    ## 8.1 ReactPHP 安装


    借助 Composer，安装非常简单。在 安装 Composer 之后，在一个新目录中，你可以运行：


    ```


    ```


