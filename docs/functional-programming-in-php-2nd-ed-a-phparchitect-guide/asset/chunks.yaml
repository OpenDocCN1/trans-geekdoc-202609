    \ 部分看到的那样。这种管道实现的一个巧妙功能是支持通过提供数组，将后续参数与函数规范一起传递。\n\n**清单 6.4**\n\n```\n\n```\n\
    \n这个函数的典型用法可能如下所示，其中一系列字符串操作函数按顺序针对字符串值进行调用。\n\n```\n\n```\n\n你会注意到 `substr()`\
    \ 的引用是作为数组传递的——这允许你将后续参数传递给函数。`substr()` 的第一个参数将始终是提供给 `pipeline()` 调用的第一个参数，而数组中指定的其他参数将构成\
