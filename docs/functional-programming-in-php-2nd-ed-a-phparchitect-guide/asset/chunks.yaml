    将很快定义），那么单子只是返回自身而不应用提供的函数。如果容器中有真实值，则将应用该函数，并将新值包装在 `Maybe` 上下文中返回。


    `isNothing()` 方法本身只是检查包含的值是否为 null，并根据其状态返回一个布尔值。


    一旦你定义了 `getOrElse()` 方法，`Maybe` 就会变得更加有趣，因为它允许你在容器为空时返回默认值，或者在有值时返回包含的值。为了说明此功能的实际运作，这里是使用
    `Maybe` 单子而不是命令式 `if else` 实现的命令式示例。


