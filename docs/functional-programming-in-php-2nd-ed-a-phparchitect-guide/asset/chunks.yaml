- raw: "Before writing any code it is helpful to plan how the API will look once it\
    \ is completed. A simple way of doing this is to list out the namespaces you intend\
    \ to create. For HTML this could look something like the following list of namespaces:\n\
    \n*   `\\FpPhp\\Utils`\n\n*   `\\FpPhp\\Html\\Html4`\n\n*   `\\FpPhp\\Html\\Html5`\n\
    \nThen, beneath each namespace it becomes easier to list out the functions which\
    \ might be needed. In the case of the current example, this might look something\
    \ like the following namespace grouped list of functions:\n\n*   `\\FpPhp\\Utils`\
    \ \n\n    *   `ensure_array`\n\n*   `\\FpPhp\\Html\\Html4` \n\n    *   `div`\n\
    \n    *   `a`\n\n*   `\\FpPhp\\Html\\Html5` \n\n    *   `section`\n\n    *   `aside`\n\
    \nWhile there are inevitably more functions which could be added to the list,\
    \ for the sake of brevity only those to be implemented in the example are included\
    \ here.\n\nI normally do these sketches of functionality in code where I define\
    \ the namespace and include function stubs underneath them. This way, they are\
    \ easy to move around and some of the work is already completed when it comes\
    \ to implementation. Alongside this I also begin producing unit tests for the\
    \ functions I am adding to the namespaces. This allows me to easily ensure the\
    \ functions are producing the results I expect as I develop and it has the added\
    \ benefit that refactors can be easier.\n\nTo begin we will create the `Utils`\
    \ namespace which will contain functions we might like to reuse or that are not\
    \ specifically to do with producing HTML.\n\n**Listing 7.2**\n\n```\n\n```\n\n\
    For this particular project we only require a simple function that given a value\
    \ will ensure it is an array and wrap it in an array if it is not: `ensure_array()`.\n\
    \nThe next namespace will be `Html4`, which implements the tags `div` and `a`\
    \ in our domain specific language.\n\n**Listing 7.3**\n\n```\n\n```\n\nAs you\
    \ can see in Listing 7.3 it actually uses another namespace `\\FpPhp\\Html` and\
    \ calls methods within it for both the `div()` and `a()` functions. This underlying\
    \ namespace will contain functions which `Html4` and `Html5` will make use of\
    \ when producing their respective tags. The tag functions themselves (`a()` and\
    \ `div()`) are actually very simple and all work is passed off to the library\
    \ of functions in `\\FpPhp\\Html`.\n\nThe next step is to create that underlying\
    \ library of functions—oh, and one class to hold the values of HTML tag attributes\
    \ (`Attribute`). First, we will implement the `\\FpPhp\\Html` namespace so we\
    \ can begin to add functions to it:\n\n```\n\n```\n\nInto the namespace we will\
    \ first add a simple class to act as the container for an HTML attribute (`class`,\
    \ `href`, `style`, etc.). It is necessary to use a class here as we want to type\
    \ check against attribute values later on and it serves as a nice way of preprocessing\
    \ and storing the structured data.\n\n**Listing 7.4**\n\n```\n\n```\n\nThe constructor\
    \ is the only way of adding data into the structure which effectively creates\
    \ an immutable structure and it means we can intercept the value. We need the\
    \ value to be an array so we use the `Utils\\ensure_array()` function from Listing\
    \ 7.2 so any scalar value will be converted into an array element.\n\nCreating\
    \ a new `Attribute` instance for each attribute is not all that arduous, but like\
    \ any good programmer we are lazy so we will add a function called `attr()`. This\
    \ function will act as a factory and ease the process of creating new `Attribute`\
    \ instances.\n\n```\n\n```\n\nPassing in a name and a value (scalar or array)\
    \ will return you a new instance of the `Attribute` class containing that information.\
    \ That’s it for the creation of new attributes with this set of code for the domain\
    \ specific language. Next up we will define the functions which create a new tag\
    \ and process its associated `Attribute`s into an HTML ready string. The `tag()`\
    \ function will generate a new tag and it is as good a starting point as anywhere.\n\
    \n**Listing 7.5**\n\n```\n\n```\n\nWhen supplied a type (`section`, `div`, etc.)\
    \ and some content, the `tag()` function will produce an HTML tag. So if you were\
    \ to call it with a type of `div` and `sawubona` as the content it would emit\
    \ `<div>sawubona</div>`. It’s really very simple and this one function makes it\
    \ easy to create a HTML tag of any type by passing the name in as the type such\
    \ as `div`, `section` or `a`.\n\nWhat of the attributes array though? This is\
    \ where it gets a little more complicated with the processing of the instances\
    \ of `Attribute` and we pass this off to another function `attrs_to_html()` to\
    \ break the problem down into more focused functions. This is one of the handy\
    \ features of programming in a stricter functional style as it automatically leaves\
    \ you with more repurposable functions.\n\n**Listing 7.6**\n\n```\n\n```\n\nIn\
    \ Listing 7.7 `attrs_to_html()` is defined as a function which accepts a single\
    \ array as input, which should contain instances of `Attribute`. If the array\
    \ is not empty, then it will use `array_map()` to execute a function against each\
    \ value in the array before imploding the output into a space delimited string.\
    \ Where `$attrs` is empty the `attrs_to_html()` function will simply return an\
    \ empty string in sympathy. Now, onto the next function `attr_to_html()`, which\
    \ is called against each instance of `Attribute` by `attrs_to_html()`.\n\n**Listing\
    \ 7.7**\n\n```\n\n```\n\nIn reality, `attr_to_html()` is another intermediary\
    \ function which passes the work off to another function called `render_attr()`\
    \ after imploding the list of attribute values (in the case of `class` HTML attribute\
    \ these would be the various classes we wish to apply to the tag; `col6 panel-padding\
    \ round-border` might be the output for example). This imploded list and the attribute\
    \ name (`class`) would be passed onto `render_attr()` to be converted into an\
    \ HTML attribute.\n\n**Listing 7.8**\n\n```\n\n```\n\nAgain this is a pretty simple\
    \ function, but there are a couple of aspects worth pointing out. The reason we\
    \ must explicitly check for `null`, `false` and an empty string is because some\
    \ attributes may have a value of `0` so we cannot simply evaluate `return ($value)\
    \ ?:` as you might initially expect. Supposing the value passed in is empty then\
    \ it will be added without a value which suits something like `disabled`, `selected`\
    \ or `checked` on HTML form inputs.\n\nWere there to be an actual value passed\
    \ through, then it would first be sent to `esc_html()` and then rendered as a\
    \ quoted HTML attribute. Using the examples from before it would emit `class=\"\
    col6 panel-padding round-border\"` as its return value. The `esc_html()` (Listing\
    \ 7.9) is a very simple wrapper around PHPs core `htmlspecialchars()` function\
    \ so all the appropriate flags can be set without fuss in a re-usable fashion.\n\
    \n**Listing 7.9**\n\n```\n\n```\n\nAnd that is it for the `FpPhp\\Html` namespace.\
    \ Before moving onto the `FpPhp\\Html\\Html5` namespace we should probably test\
    \ the code to make sure it works.\n\n**Listing 7.10**\n\n```\n\n```\n\nAs the\
    \ `div` example in Listing 7.10 shows, it is relatively easy to use this naive\
    \ DSL to produce HTML. By wrapping the `tag()` function you can quickly add new\
    \ HTML tags to the language and make use of them through the same universal interface.\n\
    \nTo that end, how about we add some more methods for the HTML5 namespace mentioned\
    \ earlier.\n\n**Listing 7.11**\n\n```\n\n```\n\nMuch like the HTML4 examples before\
    \ it, Listing 7.11 simply adds two new tags to the DSL so you can create `section`\
    \ and `aside` tags. It would be trivial to implement a `script`, `nav` or `main`\
    \ tag in either of the namespaces. I find the easiest way to introduce new functionality\
    \ is to write a unit test along with it—for this book I have been using Sebastian\
    \ Bergmann’s PHPUnit\n\nAs a final example we shall create a short snippet of\
    \ nested HTML using the domain specific language functions we now have available\
    \ to use in both the `HTML4` and `HTML5` namespaces. Listing 7.12 creates a very\
    \ simple snippet of HTML the describes an article with some navigation beside\
    \ it.\n\n**Listing 7.12**\n\n```\n\n```"
