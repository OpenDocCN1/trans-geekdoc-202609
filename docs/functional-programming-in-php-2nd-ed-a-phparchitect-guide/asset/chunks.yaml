- raw: "It works as expected, but what if this value were stored in a context? To\
    \ make it easier to picture this, imagine a context acts much like having a value\
    \ wrapped up inside a box. This context will affect the result of any function\
    \ called against the value it contains. Of course, our function `x()` does not\
    \ expect anything but a simple numeric value, and if the value has been bound\
    \ up into a context, it can no longer be directly applied in the same manner.\n\
    \nTo facilitate this, you will need a universal way of calling functions against\
    \ these bound values. In Haskell, this is the job of a function called `fmap`,\
    \ but in PHP, you must write your own code to emulate the functionality.\n\nBelow\
    \ is a very simple PHP functor that matches the code we saw earlier.\n\n```\n\n\
    ```\n\nTo add a context to the input value, we need to declare a simple type class,\
    \ which will wrap up the value in a box (see Figure 6.1):\n\n```\n\n```\n\n![Figure\
    \ 6.1: Wrapping the Value in Just](Images/file0.png)\n\nFigure 6.1: Wrapping the\
    \ Value in Just\n\nIf we now try to apply the PHP functor to this wrapped value,\
    \ we will witness an almighty crunch resulting in a PHP notice:\n\n```\n\n```\n\
    \nTo fix this, we must create an emulation of Haskell’s `fmap()` function in PHP\
    \ (see Figure 6.2), which is actually quite simple:\n\n```\n\n```\n\n![Figure\
    \ 6.2: Applying a Function to a Just](Images/file1.png)\n\nFigure 6.2: Applying\
    \ a Function to a Just\n\nThe beauty of `fmap()` is that it knows how to unpack\
    \ the value from its context before applying a function to it.\n\nSo far so good.\
    \ However, functors should also return a wrapped value back (Figure 6.2) so we\
    \ need to modify `fmap()` slightly:\n\n```\n\n```\n\nSo far, the code we have\
    \ seen is not exactly universal as I had promised—just try applying `fmap()` to\
    \ a list of values! To make it easier for `fmap()`, we must define some more data\
    \ types and specify how `fmap()` is to be applied to each one. To start with,\
    \ we will create an interface our type classes will implement:\n\n```\n\n```\n\
    \nDefining the interface makes it possible to type check using PHP’s `instanceOf`,\
    \ and to make it easier on yourself, define an abstract class (Listing 6.6) for\
    \ the type classes to extend.\n\n**Listing 6.6**\n\n```\n\n```\n\n> You may be\
    \ wondering why I have defined both an abstract class and an interface. This is\
    \ a personal preference for a couple of reasons, stemming from the fact I firmly\
    \ believe only interfaces should be used to form contracts and type hints. This\
    \ allows anyone to replace the abstract with one of their own and just implement\
    \ the interface, so your code will still work. The second and most useful part\
    \ of this is PHP can implement many interfaces, but it can only extend one class.\
    \ By not forcing an implementer to extend your abstract, they may inherit from\
    \ any class they desire.\n\n> \n\n> This is the reason interfaces exist to my\
    \ mind and attempting to replace them with abstract classes instead could lead\
    \ to hampered interoperability. Users of any library will thank you if you follow\
    \ this pattern, even though it may feel like you are repeating yourself at the\
    \ time.\n\nAs you can see, this is really quite a simple container class which\
    \ stores a value in `$container`. Next up, we can improve upon the earlier `Just`\
    \ type class with:\n\n```\n\n```\n\nThis is the first time we are using `__invoke()`\
    \ to control how `fmap()` applies a function to the wrapped value. In the case\
    \ of `Just`, it simply calls the supplied function against the wrapped value and\
    \ returns a new instance of `Just` containing the result. To support this style,\
    \ we must also make a few more changes to our `fmap()` function.\n\n```\n\n```\n\
    \nTo stop illegal usage of this function, it will throw an exception if the value\
    \ passed to it does not implement the `FunctorInterface` we created previously.\
    \ It then simply calls the functor and passes in the function to be applied. This\
    \ is where the `__invoke()` method in the `Just` type class steps in and performs\
    \ the actual function application against the wrapped value and returns a new\
    \ instance of `Just` containing the results.\n\nBelow is an example that puts\
    \ our new `fmap()` and `Just` functionality to the test.\n\n```\n\n```\n\nAt this\
    \ point, it makes sense to review the two laws governing what a functor must do\
    \ and how it must appear to surrounding code. The first functor law ensures the\
    \ `fmap()` function itself does not change the returned value, for only `$x()`\
    \ in our example is allowed to work on the contained value. This can be written\
    \ in a formulaic manner as `fmap id = id`, which will make more sense when addressed\
    \ in the example code further on. You can think of `fmap()` as an impartial facilitator\
    \ which, while it is incredibly important, should have no effect on the final\
    \ output.\n\nIt is also stated in the second law, composing two functions—and\
    \ subsequently mapping the resulting function over a functor—should be the same\
    \ as first mapping one function over the function and then mapping the second\
    \ one. This can be written as `fmap(f . g) = fmap f . fmap g`, and it is essentially\
    \ a protection against `fmap()` altering the return value.\n\nLet’s test the `Just`\
    \ functor against these laws to prove its status as a functor, starting with the\
    \ first law in:\n\n```\n\n```\n\nIt is immediately clear we have achieved a pass\
    \ against the first law. Next, the second law can also be proven for `Just`:\n\
    \n```\n\n```\n\nOnce again, you can see the second law holds as well, and we can\
    \ congratulate ourselves on having created our first functor. However, we have\
    \ used more code to reach the same result—why would that ever be useful?\n\nNext,\
    \ we define the class `Nothing`, a friendly data type representation of an empty\
    \ or null value to prove we can benefit from our new universal style.\n\n```\n\
    \n```\n\nI know it was a bit of a letdown, but wait, there’s more! What if we\
    \ want to work on those lists mentioned earlier?\n\n```\n\n```\n\nHere, the `Collection`\
    \ class represents a wrapped list or array, and the `__invoke()` defined within\
    \ knows how to apply a function to each item in the list. Now you can see the\
    \ power of abstracting out some of the functionality:\n\n```\n\n```\n\nYou will\
    \ have noticed a useful function on the `Functor` abstract class called `get()`,\
    \ and we can use it now to extract the actual value back out of the context.\n\
    \n```\n\n```\n\nFunctors are an excellent way of applying functions to esoteric\
    \ data structures. In the case of the PHP examples we defined earlier, all you\
    \ have to do is lift the structure in question to become a functor. Once the structure\
    \ is *functor-ized*, you can apply structure-agnostic functions to the contained\
    \ data and the functor will handle pulling the correct value out of the structure.\n\
    \n## 6.9 Applicatives\n\nNow that we have mastered the ins and outs of functors,\
    \ we can move onto a slightly more complex type called an applicative. Whereas\
    \ functors applied a function to a wrapped value, applicatives apply a wrapped\
    \ function to a wrapped value. It may sound pretty crazy, but it’s actually relatively\
    \ simple.\n\nSimilar to the functors, we will need to write some code to unpack\
    \ the wrapped function before we can apply it to the value. There is, of course,\
    \ no special PHP syntax to handle this, so we will need some boilerplate handling\
    \ code to have the same effect. Once again, let us begin by implementing an interface\
    \ for applicatives:\n\n```\n\n```\n\nAlso, we need the beginnings of our `Applicative`\
    \ type class, which is essentially a nice simple container for the function we\
    \ wish to wrap up.\n\n**Listing 6.7**\n\n```\n\n```\n\nThe `__invoke()` method\
    \ in `Applicative` class gives `Applicative` the equivalent of `fmap()`, called\
    \ `amap()` allowing it to apply its wrapped function to the supplied values. You\
    \ might have missed that unlike functors, applicatives can handle functions which\
    \ expect multiple parameters!\n\nSo here you can see the contortions that are\
    \ required to support composition of applicatives and multiple parameters in PHP,\
    \ but take a moment to read through it, and it should start to make sense."
