- raw: "> It is also worth noting Erlang is not short for Ericsson Language, but rather\
    \ it is named after a computer scientist named Erlang. Although, it does serve\
    \ the dual purpose quite admirably.\n\nSince its creation Erlang has been used\
    \ by numerous household names in a number of industry sectors. One of the most\
    \ well-known recent uses of Erlang is as the base language for the CouchDB NoSQL\
    \ server. This storage system uses map and reduce statements to make it possible\
    \ to extricate the correct information—the significance of this will become clearer\
    \ later. Well, at least in relation to functional programming anyway!\n\nAt around\
    \ the same time as Erlang was being designed with a practical purpose in mind,\
    \ another functional language was in it’s infancy. Designed by committee and open\
    \ source at its outset, Haskell has gone on to become arguably the most well-known\
    \ pure functional language. In the beginning however it was not event able to\
    \ output anything—it was a pure and solid state box.\n\nThis reflects its beginnings\
    \ as an experiment and an educational tool. As IO (input/output) is inherently\
    \ stateful they grappled with the problem of defending their code from outside\
    \ influences. You want to be able to access information such as a database or\
    \ a text file on disk in such a way that it does not introduce stateful operations.\n\
    \nIf you have a knowledge of electronics then this could be considered similar\
    \ to amplification circuits, in a simplified way. You need a power source to boost\
    \ the signal, but it is important no noise be introduced from the power source\
    \ to the signal. There really is only a passing resemblance so don’t delve too\
    \ deeply in!\n\nHaskell now powers projects in the open source world and even\
    \ in banking. A couple of projects you might have heard of include Pandoc and\
    \ xmonad. It is still relatively small with many companies preferring to stick\
    \ with familiar tools and methodologies.\n\nThis set the scene for the creation\
    \ of the Scala programming language in 2004 on both the Java and .NET runtimes.\
    \ It allowed a functional language to be used in existing infrastructures. The\
    \ .NET version ceased in 2012 with language development becoming focused on the\
    \ JVM (Java Virtual Machine). While these underpinnings sped up the development\
    \ and adoption of the language, they did come with a cost. Neither platform was\
    \ designed to host a functional language. This has led to some difficulties and\
    \ shortcomings, but nothing warranting further discussion in the context of this\
    \ book.\n\nUnlike Haskell, the Scala language is not purely functional and it\
    \ is possible to write very elegant object oriented code in it. This is another\
    \ one of its attractions; a familiar methodology neatly executed. As it also runs\
    \ on the JVM, it is possible to use Java packages from Scala code directly.\n\n\
    It could be argued Scala is more trendy than Haskell with companies such as Twitter,\
    \ LinkedIn, Foursquare, and The Guardian making use of Scala in their core product\
    \ offerings. Again this is very subjective! Twitter has written a number of onboarding\
    \ guides for new engineers which serve as handy learning resources \n\nAs these\
    \ languages have evolved, the level of interest has increased. This can, at least\
    \ partially, be attributed to the increased need for parallel processes to harness\
    \ multi core and node architectures. Functional code eases the shared mutable\
    \ state problem imperative code can suffer from. This has made it increasingly\
    \ attractive as architectures become more and more complicated to handle increased\
    \ load.\n\nMore recent converts to functional code could easily have learned online\
    \ from a MOOC with a number of courses touching on Haskell and Scala. These can\
    \ serve as good introductions to those languages and Scala in particular has a\
    \ number of good books written for learners of the language.\n\nThe history of\
    \ functional programming is irrevocably intertwined with discoveries in mathematics\
    \ and logic. Off the back of those advancements programming and computing itself\
    \ were created. While functional style programs are still not as popular as their\
    \ state filled counterparts, adoption appears to be steadily increasing.\n\n##\
    \ 2.3 Other Functional Implementations\n\nThe spectrum of languages that might\
    \ consider themselves as implementing functional constructs is quite broad. In\
    \ terms of pure functional languages, Haskell is possibly the most well-known.\
    \ Somewhere in the middle are languages like Scala and Clojure which contain both\
    \ imperative as well as functional styles.\n\nThen much further out on the fringes,\
    \ there are languages like our beloved and oft-vilified PHP, which has slowly\
    \ been acquiring the basic ingredients for functional programming.\n\nFor the\
    \ sake of contrast, here is the same `sum` example in Haskell, which is as simple\
    \ as:\n\n```\n\n```\n\nAs you can see, the syntax makes it very easy to clearly\
    \ express the program in a minimal number of characters.\n\n## 2.4 Commercial\
    \ Uses\n\nOne often cited benefit for a functional approach is in the construction\
    \ of domain specific languages (DSLs). The functional constructs in most languages\
    \ successfully reduce the amount of low-level work required when parsing a language\
    \ as built-in type handling and pattern matching enable fast and complex parsers\
    \ to be written in fewer lines of code.\n\nThe advantage of this is it greatly\
    \ eases maintenance chores and makes the code simpler to understand.\n\nA well-known\
    \ commercial example of this can be found in the Functional Payout Framework for\
    \ exotic trades at Barclays Bank. Written in Haskell, it defines a DSL for mathematicians\
    \ to create trading applications upon. The compact and flexible functional implementations\
    \ allow the team to react more effectively and quickly to user requests for new\
    \ features. There were some concerns for the team at the outset of the project,\
    \ chief among which was the need to interface with other legacy systems written\
    \ in languages such as C. Not only was this easily completed with Haskell, but\
    \ it worked out to be a bonus as it prevented tight coupling of the components.\n\
    \nProbably the most well-known commercial use of functional programming is the\
    \ inception of the Erlang language at Ericsson, which was specifically designed\
    \ to improve productivity through a high-level symbolic language. Due to the stringent\
    \ reliability and concurrency demands of telecommunications, Ericsson ruled out\
    \ the array of functional languages at the time with LISP and Prolog being the\
    \ front runners.\n\nErlang has since been adopted by many commercial users and\
    \ powers numerous mission critical pieces of hardware. It’s probably the biggest\
    \ success story in terms of commercial adoption and continued use in its target\
    \ domain.\n\nA more recent example comes from Twitter, which is using Scala to\
    \ handle a number of key features for their social service. While Scala is not\
    \ a purely functional language (it has object-oriented support as well), it is\
    \ certainly well equipped to do so. Some of the features you use every day on\
    \ Twitter are powered by Scala, including the store of user relationships, searching\
    \ for users by name or interests, and the “who to follow” fuzzy suggestions Twitter\
    \ provides. The abstractions allowed by functional programming in Scala have also\
    \ meant it is being used in many other areas as well, such as the streaming API,\
    \ the Kestrel queuing mechanism, and their geo systems.\n\n## 2.5 What is Functional\
    \ Programming Best for?\n\nAs you will see, anything which can be done imperatively\
    \ can also be completed using functional methodologies. Although each methodology\
    \ has its advantages you can view them as simply another way of slicing the cake."
