  trans: "\n\n它按预期工作，但如果这个值存储在上下文中会怎样呢？为了更容易想象这一点，想象一个上下文就像是将一个值包装在一个盒子里。这个上下文将影响对其包含的值调用的任何函数的结果。当然，我们的函数\
