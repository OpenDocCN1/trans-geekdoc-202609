    \n*   Clojure—[http://www.clojure.org](http://www.clojure.org)\n\n*   Common LISP—[http://http://common-lisp.net](http://http://common-lisp.net)\n\
    \n*   OCaml—[http://ocaml.org](http://ocaml.org)\n\n## 12.4 Online Courses (MOOC)\n\
    \n*   Introduction to Functional Programming with Erik Meijer—[https://www.edx.org/course/introduction-functional-programming-delftx-fp101x-0](https://www.edx.org/course/introduction-functional-programming-delftx-fp101x-0)\n\
    \n*   Functional Programming Principles in Scala with Martin Odersky (creator\
    \ of the Scala programming language)—[https://www.coursera.org/course/progfun](https://www.coursera.org/course/progfun)\n\
    \n*   Principles of Reactive Programming with Martin Odersky, Erik Meijer and\
    \ Roland Kuhn—[https://www.coursera.org/course/reactive](https://www.coursera.org/course/reactive)\n\
    \n# Glossary\n\n> “The calculus was the first achievement of modern mathematics\
    \ and it is difficult to overestimate its importance.”\n\n> \n\n> —John von Neumann\
    \ (Mathematician and Physicist, 1903–1957)\n\n**`??`**\n\n: See *null coalescence*.\
    \ \n\n**`?:`**\n\n: See *ternary operator*. \n\n**anonymous function**\n\n: Ssee\
    \ *lambda*. \n\n**API**\n\n: Application Programming Interface which can be either\
    \ external or internally facing. \n\n**argument**\n\n: A value passed to a subroutine.\
    \ In PHP functions this is passed between the parentheses of the function. Also\
    \ known interchangeably as a parameter. \n\n`function x($argument)`\n\n**blocking**\n\
    \n: A call which halts the progress of the overall application until it completes.\
    \ \n\n**CLI**\n\n: Command Line Interface which allows usage via a terminal. \n\
    \n**closure**\n\n: An *anonymous function* which can carry context. \n\n**collection**\n\
    \n: Please see *list*. \n\n**curly braces**\n\n: `{}` \n\n**Curry**\n\n: Both\
    \ a man (Haskell Curry) and a technique where all function arguments become functions\
    \ themselves. \n\n**deterministic**\n\n: Processes that are deterministic always\
    \ return the same result repeatedly. \n\n**dot**\n\n: `.` \n\n**DoxyGen**\n\n\
    : Generate API documentation from inline code comments. \n\n**DSL**\n\n: Domain\
    \ Specific Language. Languages designed and built to solve problems in a specific\
    \ domain such as share trading or fluid dynamics. \n\n**Erlang**\n\n: A functional\
    \ programming language created in Ericsson Labs. \n\n**F#**\n\n: A functional\
    \ programming language written on top of the .NET framework. \n\n**first class\
    \ functions**\n\n: Languages exhibiting the characteristic have functions which\
    \ can be treated as any other variable allowing them to be passed around by and\
    \ into other functions. \n\n**function**\n\n: A subroutine which optionally accepts\
    \ arguments and/or returns a value. \n\n**function object**\n\n: An object which\
    \ can be called as a function. \n\n**functional-php**\n\n: A PHP library and extension\
    \ providing functional primitives to PHP. \n\n**full stop**\n\n: . \n\n**generator**\n\
    \n: Language construct allowing for memory efficient processing of lists. \n\n\
    **Hack**\n\n: An extension of the PHP language with its own runtime HHVM. \n\n\
    **Haskell**\n\n: A functional programming language; pretty much universally, the\
    \ most popular pure functional language. \n\n**IDE**\n\n: Integrated Development\
    \ Environment. A comprehensive editor containing an internal debugger and runtime\
    \ environment. \n\n**immutable**\n\n: A data structure (variable, object, etc.)\
    \ which cannot be changed once the initial value is set. \n\n**infinite recursion**\n\
    \n: When a recursive call has no bounding condition to terminate the loop. \n\n\
    **infix operator**\n\n: An operator (usual a symbol) which can be placed between\
    \ two arguments. For example, `$a ?? $b` where `??` is the infix operator. \n\n\
    **IO**\n\n: Input/Output. Generally refers to reading from and writing to disk.\
    \ \n\n**`iter`**\n\n: Library to work with PHP’s various collections agnostically\
    \ with generators. \n\n**keyword**\n\n: A word with special significance in a\
    \ programming language as it may direct control or indicate usage of certain feature.\
    \ \n\n**lambda**\n\n: An anonymous function (one without a defined name). \n\n\
    **λ**\n\n: See *lambda*. \n\n**list**\n\n: Any data type containing a list of\
    \ values. May or may not additionally include a key for each value. \n\n**monad**\n\
    \n: A design pattern with a universal interface. \n\n**namespace**\n\n: A virtual\
    \ grouping of subroutines under a shared name. Allows subroutines with the same\
    \ name to co-exist under different namespaces. \n\n**Netbeans**\n\n: A JVM based\
    \ IDE which among other languages supports PHP natively. \n\n**`null`**\n\n: A\
    \ value meaning no value and should be avoided (an oxymoron). \n\n**null coalescence**\n\
    \n: A PHP operator which can be placed between two variables and will return the\
    \ first non-null value. \n\n**OCaml**\n\n: A multi-paradigm programming language\
    \ allowing functional and object oriented styles of programming. Hack lang is\
    \ written in it. \n\n**PAAS**\n\n: Platform As A Service is a system which includes\
    \ scalable hosting and some sort of assistance with the development workflow such\
    \ as pushing changes live via git. \n\n**parameter**\n\n: See *argument*. \n\n\
    **parentheses**\n\n: `()` \n\n**partial function application**\n\n: A technique\
    \ where a function’s arguments are supplied as defaults by a wrapping function.\
    \ Generally, one argument is left as a placeholder which will be substituted at\
    \ call time. This is very handy when using `array_map()` and `substr()` together,\
    \ for example. \n\n**PEAR**\n\n: An early PHP library management program and repository.\
    \ Nowadays superceded in use by Composer and Packagist. \n\n**PECL**\n\n: PHP\
    \ extension management program and repository. \n\n**period**\n\n: `.` \n\n**PHP\
    \ extension**\n\n: These are compilable extensions to PHP written in C. The biggest\
    \ advantage over a library is outright speed and the ability to implement C APIs.\
    \ \n\n**PHP library**\n\n: Userland PHP code which can be bolted into a project\
    \ to add ready-made functionality. \n\n**PHPDoc**\n\n: A popular method of inline\
    \ code documentation which can be automatically built to an API manual. \n\n**PHPSH**\n\
    \n: Facebook’s PHP REPL. \n\n**pipelines**\n\n: A list of functions to be mapped\
    \ against one or more values. \n\n**POSIX**\n\n: A computer which can interpret\
    \ the POSIX instruction set. The two most popular are Linux and Mac OS X. \n\n\
    **psyPHP**\n\n: A REPL amongst other things. \n\n**pure**\n\n: Difficult to define,\
    \ but generally, a function which is referentially transparent. \n\n**React/Partial**\n\
    \n: A userland library which provides partial function application to PHP projects.\
    \ \n\n**recursion**\n\n: When a function calls itself either directly or indirectly.\
    \ For an example, see *see recursion*. \n\n**referential transparency**\n\n: A\
    \ function is referentially transparent when you can substitute its input for\
    \ direct values and obtain the same result. \n\n**REPL**\n\n: Read Eval Print\
    \ Loop. A tool for developers to interactively evaluate code in easily, also referred\
    \ to as a *language shell*. \n\n**return type**\n\n: The type of the value a function\
    \ will emit. \n\n**RFC**\n\n: Request for Comments. In PHP, an RFC must be prepared\
    \ to accompany any proposed language change or addition. It is then either voted\
    \ in or out by those with voting karma. \n\n**runtime**\n\n: A system for converting\
    \ language bytecode into machine runnable instructions. For PHP there are a few\
    \ including HHVM, Zend (de facto standard) and Quercus. \n\n**Scala**"
