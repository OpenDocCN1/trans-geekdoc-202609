  trans: '


    二战期间，艾伦·图灵（Alan Turing）曾驻扎在布莱切利公园（Bletchley Park），与英国最优秀的一批人才一起破解恩尼格玛密码机（Enigma
    code），这一历史广为人知。恩尼格玛密码的首次突破发生在 1940 年，当时使用的是所谓的“绿色密钥”（Green Key），后来德国空军（Luftwaffe）的“红色密钥”（Red
    key）也被破解。近期电影《模仿游戏》（The Imitation Game）由本尼迪克特·康伯巴奇（Benedict Cumberbatch）饰演图灵，详细讲述了这段历史。


    纳粹很快开始使用一种名为“格海姆施雷伯”（Geheimschreiber，意为“秘密书写机”）的新设备进行更高级的加密。图灵致力于破解“图尼”（Tunny，即英国对该秘密书写机的代号），并于
    1942 年发明了一种名为“图灵里”（Turingery）的技术。大规模实施图灵里的经验，启发了汤米·弗劳尔斯（Tommy Flowers）和马克斯·纽曼（Max
    Newman）团队设计出第一台可编程电子计算机。


    这台计算机被称为“巨像”（Colossus computer），与你现在阅读本书所用的设备截然不同。它使用热离子阀（thermionic valves，如今除昂贵的
    Hi-Fi 设备和专业吉他放大器外已很少使用）来执行布尔运算，而今天这些运算通常由晶体管完成。这些阀门控制着一系列继电器和步进电机，使其成为一台非常活跃且具有物理存在感的机器——你肯定能听到它运转的声音！


    现代机器完全不同，当今的计算由分立的固态电子元件驱动。在许多现代机器中，唯一的活动部件是冷却风扇，以及你可能通过 USB 插入的某些外围设备。固态硬盘取代了硬盘驱动器，光驱也将可移动数据的任务让给了内存棒或云存储，使得现代机器几乎完全无声。


    一台可运行的巨像复原机可以在英国布莱切利公园的国家计算机博物馆（The National Museum of Computing）看到。原机及其蓝图均已被销毁，相关信息在
    20 世纪 70 年代之前一直保密。


    因此，尽管图灵的工作无疑提供了帮助，但说他直接参与该项目仍有牵强之处。他当时正在研发一套安全电话系统，用于对语音进行加密，代号为“迪莉拉”（Delilah）。遗憾的是，该系统缺乏远距离通信能力，且未在二战期间完成。这使图灵重返计算机领域，他撰写了第一篇关于存储程序计算机的深入论文，险些抢在约翰·冯·诺依曼（John
    Von Neumann）的草案之前发表——后者的草案当时正在向出版方流转。回顾起来，冯·诺依曼草案中的许多想法实际上被认为是图灵的。


    此外，图灵还曾致力于人工智能问题。在他看来，问题不在于机器是否可能智能，而在于何时会实现。为了确定这一里程碑何时到来，图灵设计了一项简单的测试（对人类来说简单，但对机器未必），即如今著名的“图灵测试”（The
    Turing Test）。如果机器能以与人类无法区分的方式与人类受众交流，则可被视为智能。虽然这听起来很简单，但值得注意的是，言语和复杂的交流在地球上是人类独有的。即使是学会了手语的灵长类动物，也从未向饲养员提出过一个问题，这或许源于认知的局限，或者仅仅是因为语言极难掌握。


    近期有声称某计算机程序已通过图灵测试。这很像汽车制造商的油耗宣称，实际使用效果并不总是与实验室结果一致。该测试是在一套旨在“作弊”的条件下完成的。


    不幸的是，图灵的卓越才智及其对战争的贡献，未能保护他免受迫害。在 20 世纪 50 年代的英国，同性恋行为是非法的。图灵向警方提及其家中入室盗窃案可能与其男友的一位同伙有关后，很快被捕。案件开庭时，他被判有罪，面临监禁或接受化学阉割的有条件减刑。图灵选择了医疗干预，而他的男友则获得了七个月缓刑，或许是因为他比图灵年轻。


    尽管其家人对此有争议，但普遍认为图灵于 1954 年通过在每日食用的苹果中下毒氰化物而自杀。有人指出，他设置的一个金电镀实验可能产生了致命剂量的氰化物。另一种解释是，他这样做是为了保护母亲，并让她有合理的否认其子自杀的可能性。图灵在计算机界的遗产广为人知，随着电影《模仿游戏》的上映，其事迹最近也被推广给了更广泛的受众。在此之前，2009
    年曾开展大规模运动，要求英国政府就对图灵的待遇道歉。2013 年，他获得了死后赦免。


    功能性计算的下一次重大进步发生在 1958 年，当时约翰·麦卡锡（John McCarthy）基于阿隆佐·丘奇（Alonzo Church）的 λ 演算（lambda
    calculus）开发了 LISP 编程语言。该语言名称源于“列表处理”（list processing）一词的谐音，这很合理，因为该语言高度依赖列表。


    有趣的是，LISP 随后成为人工智能社区的事实上的标准。麦卡锡利用阿隆佐·丘奇的思想研究人工智能，而图灵在去世前想必也曾思考过这些理念。


    许多编程语言以及计算机科学领域，都有很多值得感谢 LISP 的地方。它以动态类型、数据树结构、条件语句、递归和高阶函数的形式带来了新思想。其他语言可能包含大致相似的功能，但从未以如此统一的方式实现。


    LISP 因其 S 表达式（S-expressions）而一眼可辨，这些表达式看起来像列表。它们写成列表形式，函数名排在第一位，参数用空格分隔依次排列。多年来，涌现了许多
    LISP 变体，其中今日最著名的有 Common Lisp、Scheme 和 Clojure。


    如果你有兴趣尝试编写自己的编程语言，一个起点是开发一个属于自己的 LISP。网上有许多资源可用于使用 C、Python 和 C++ 创建 LISP 解释器。在
    PHP 世界中，相关工作有限，项目包括 Mathias Verraes 的 Lambdalicious、Igor Wiedler 的 Lisphp，以及 Tamreen
    Kahn 用 PHP 编写的 Pharen 交叉编译器。


    随着时间的推移，函数式编程领域鲜有进展。现有语言大多仍局限于学术界，用户群相对较小。如前所述，人工智能社区确实使用 LISP 以函数式风格进行工作。


    除此之外，你需要快进到电信行业开始寻找容错系统的时期。毕竟，他们不能让客户的电话、寻呼机和消息中断或未送达。爱立信电话公司（Ericsson telephone
    company）牵头推动了电信领域函数式编程的早期发展。在他们的实验室中，他们研发了一种旨在缓解该行业所面临问题的语言，其中正常运行时间和可靠性最为重要。


    基于这些在 20 世纪 80 年代中期的研究，Erlang 编程语言诞生了。它基于 Prolog，最初是用该语言本身实现的，后来为爱立信的所有基础设施提供动力。然而，随着
    Erlang 成为专有语言，爱立信在 20 世纪 90 年代末决定停止使用自己的语言！1998 年，其语言团队的关键成员离职后（无疑是出于抗议），爱立信将
    Erlang 开源，使其得以在内部再次使用。


