    需要注意的是，ReactPHP 添加了一些逻辑上的高级抽象和一个事件循环，而这个纯 PHP 示例则尽可能精简，因此它们并非完全可互换的示例。


    ## 8.3 添加日志记录


    在 Web 浏览器中从我们的 HTTP 服务器获得响应固然很棒，但如果能记录每一个请求以用于调试，那就更好了。问题是，我们有一个用于处理 HTTP 请求响应的漂亮纯函数，不想将另一个关注点（日志记录）放入如此整洁的函数中。我们可以使用闭包来组合对我们函数的调用。


    首先是日志函数，它只将请求方法（`GET`、`POST` 等）和请求路径（`/`、`/page-name`）写入名为 `access_log` 的日志文件。


    ```


    ```


    我们还可以对请求处理程序（`$rh`）的定义进行微小更改，使其只接收它实际需要的一个参数（`$response`）：


    ```


    ```


    为了映射函数，我们将它们包装在一个方便的闭包中，以便它们可以随后相互调用：


    ```


    ```


    最后，更新请求处理程序绑定行以匹配：


    ```


    ```


    如果你现在通过在浏览器中访问 `http://127.0.0.1:7355` 来执行此代码，你将看到相同的消息，但你的日志文件将包含类似以下的内容：


    ```

    GET: /

    GET: /favicon.ico

    ```


    第二个请求是 Web 浏览器抱着试试看的心态，试图在我们的服务器上找到 favicon。当然，我们的服务器上没有 favicon，但如果没有日志记录，我们永远不会知道每个请求都会被服务器访问两次。


    ## 8.4 引入单子


    到目前为止，我们已经使用少量函数式代码设置了一个简单的 Web 服务器。接下来，我们有紧急需求让服务器处理用户请求。当然，以下代码并非真正为生产环境编写，而更多是作为单子用法的起点和示例。


    既然你已经见过 `Maybe` 单子，我们将采用这个想法，并通过将其与列表单子结合来稍作扩展。这将为传递到我们小型 ReactPHP Web 服务器请求中的
    `GET` 参数提供可预测的访问。为了透明起见，这个单子将被命名为 `QueryList`。如你所料，它将是查询字符串数组的容器。


    与上一个容器单子一样，我们必须扩展 `Monad`，定义基本构造函数和类属性以充当我们的容器。同样，`pack()` 函数非常简单，它接受一个数组并将其包装在一个新的
    `QueryList` 容器中返回——这是 `Monad` 的默认单子行为。


    **Listing 8.1**


    ```


    ```


    同样，在这个单子的情况下，`map()` 方法非常简单，但我们创建了一个新的 `flatMap()` 方法来增强其功能。它获取包含的数组，并简单地使用 `array_map()`
    在将结果数组包装到新的 `QueryList` 实例中返回之前，对数组中的每个值应用一个函数。


    在处理完基本单子函数后，是时候讨论特定于问题的方法了。其中第一个是 `isNothing()` 方法，我们在 `Maybe` 单子中见过它。对于我们的 `QueryList`
    单子，我们必须做一些修改以便于进行所需的检查。代码需要知道整个容器是否为空，或者——如果提供了——容器中的特定索引是否为空。


    如你所见，这是通过使用三元运算符来确定是否提供了索引，并针对容器中是否存在进行简单的原位布尔检查来完成的。这个方法，就像在 `Maybe` 示例中一样，将在内部稍后使用，但它也可以公开使用。


    为了能够从容器中获取值，我们必须在 Listing 8.1 中添加一个 `get` 方法，就像在 `Maybe` 单子中一样。当然，有一个非常细微的更改，以处理在提供可选
    `$index` 参数时从包含的数组中获取特定索引。


    为了使我们的访问更加健壮，我们还将创建一个简单的 `getOrElse()` 方法，它将让我们访问索引或整个数组。如果容器的请求部分 `isNothing()`，那么它将返回提供的默认值。同样，这当然是一个与
    `Maybe` 单子中同名函数非常相似的方法。


