    \n# 术语表\n\n> “微积分是现代数学的第一项成就，其重要性无论如何强调都不为过。”\n\n> \n\n> —约翰·冯·诺依曼（数学家和物理学家，1903–1957）\n\
    \n**`??`**\n\n: 参见 `null coalescence`。 \n\n**`?:`**\n\n: 参见 `ternary operator`。\
    \ \n\n**`anonymous function`**\n\n: 参见 `lambda`。 \n\n**`API`**\n\n: 应用程序编程接口，可以是面向外部的，也可以是面向内部的。\
    \ \n\n**`argument`**\n\n: 传递给子程序的值。在 PHP 函数中，该值在函数的括号之间传递。也可与 parameter 互换使用。\
    \ \n\n`function x($argument)`\n\n**`blocking`**\n\n: 在完成之前会停止整个应用程序进度的调用。 \n\n\
    **`CLI`**\n\n: 命令行界面，允许通过终端使用。 \n\n**`closure`**\n\n: 可以携带上下文的 `anonymous function`。\
    \ \n\n**`collection`**\n\n: 请参见 `list`。 \n\n**`curly braces`**\n\n: `{}` \n\n\
    **`Curry`**\n\n: 既指一个人（Haskell Curry），也指一种技术，其中所有函数参数都变成函数本身。 \n\n**`deterministic`**\n\
    \n: 确定性进程始终重复返回相同的结果。 \n\n**`dot`**\n\n: `.` \n\n**`DoxyGen`**\n\n: 从内联代码注释生成\
    \ API 文档。 \n\n**`DSL`**\n\n: 领域特定语言。为解决特定领域（如股票交易或流体动力学）中的问题而设计和构建的语言。 \n\n**`Erlang`**\n\
    \n: 在 Ericsson Labs 创建的函数式编程语言。 \n\n**`F#`**\n\n: 基于 .NET 框架编写的函数式编程语言。 \n\n**`first\
    \ class functions`**\n\n: 具有该特征的语言中，函数可以像任何其他变量一样处理，允许它们被传递给其他函数或传入其他函数。 \n\n\
    **`function`**\n\n: 可选接受参数和/或返回值的子程序。 \n\n**`function object`**\n\n: 可以作为函数调用的对象。\
    \ \n\n**`functional-php`**\n\n: 为 PHP 提供函数式原语的 PHP 库和扩展。 \n\n**`full stop`**\n\
    \n: . \n\n**`generator`**\n\n: 允许内存高效处理列表的语言结构。 \n\n**`Hack`**\n\n: PHP 语言的扩展，具有自己的运行时\
    \ `HHVM`。 \n\n**`Haskell`**\n\n: 函数式编程语言；几乎普遍认为是最流行的纯函数式语言。 \n\n**`IDE`**\n\n\
    : 集成开发环境。包含内部调试器和运行时环境的综合编辑器。 \n\n**`immutable`**\n\n: 一旦设置初始值后就无法更改的数据结构（变量、对象等）。\
    \ \n\n**`infinite recursion`**\n\n: 当递归调用没有终止循环的边界条件时。 \n\n**`infix operator`**\n\
    \n: 可以放置在两个参数之间的运算符（通常是符号）。例如，`$a ?? $b`，其中 `??` 是中缀运算符。 \n\n**`IO`**\n\n: 输入/输出。通常指从磁盘读取和写入磁盘。\
    \ \n\n**`iter`**\n\n: 用于使用生成器以不可知方式处理 PHP 各种集合的库。 \n\n**`keyword`**\n\n: 编程语言中具有特殊意义的单词，因为它可能指导控制或指示某些功能的使用。\
    \ \n\n**`lambda`**\n\n: 匿名函数（没有定义名称的函数）。 \n\n**`λ`**\n\n: 参见 `lambda`。 \n\n**`list`**\n\
    \n: 包含值列表的任何数据类型。可能或可能不为每个值额外包含键。 \n\n**`monad`**\n\n: 具有通用接口的设计模式。 \n\n**`namespace`**\n\
    \n: 在共享名称下对子程序进行的虚拟分组。允许同名子程序在不同命名空间下共存。 \n\n**`Netbeans`**\n\n: 基于 JVM 的 IDE，除其他语言外还原生支持\
    \ PHP。 \n\n**`null`**\n\n: 表示无值的值，应避免使用（一个矛盾修辞法）。 \n\n**`null coalescence`**\n\
    \n: PHP 运算符，可以放置在两个变量之间，并返回第一个非空值。 \n\n**`OCaml`**\n\n: 允许函数式和面向对象编程风格的多范式编程语言。Hack\
    \ lang 是用它编写的。 \n\n**`PAAS`**\n\n: 平台即服务，是一个包括可扩展托管和某种开发工作流协助（例如通过 git 推送更改上线）的系统。\
    \ \n\n**`parameter`**\n\n: 参见 `argument`。 \n\n**`parentheses`**\n\n: `()` \n\n\
    **`partial function application`**\n\n: 一种技术，其中函数的参数由包装函数作为默认值提供。通常，一个参数留作占位符，将在调用时替换。例如，在同时使用\
    \ `array_map()` 和 `substr()` 时，这非常方便。 \n\n**`PEAR`**\n\n: 早期的 PHP 库管理程序和存储库。如今已被\
    \ Composer 和 Packagist 取代。 \n\n**`PECL`**\n\n: PHP 扩展管理程序和存储库。 \n\n**`period`**\n\
    \n: `.` \n\n**`PHP extension`**\n\n: 这些是用 C 编写的可编译 PHP 扩展。相对于库的最大优势是速度极快以及实现 C\
    \ API 的能力。 \n\n**`PHP library`**\n\n: 可插入项目以添加现成功能的用户空间 PHP 代码。 \n\n**`PHPDoc`**\n\
    \n: 一种流行的内联代码文档方法，可以自动构建为 API 手册。 \n\n**`PHPSH`**\n\n: Facebook 的 PHP REPL。 \n\
    \n**`pipelines`**\n\n: 要映射到一个或多个值的函数列表。 \n\n**`POSIX`**\n\n: 可以解释 POSIX 指令集的计算机。最流行的两个是\
    \ Linux 和 Mac OS X。 \n\n**`psyPHP`**\n\n: 一个 REPL 等。 \n\n**`pure`**\n\n: 难以定义，但通常，指具有引用透明性的函数。\
    \ \n\n**`React/Partial`**\n\n: 一个用户空间库，为 PHP 项目提供部分函数应用。 \n\n**`recursion`**\n\
    \n: 函数直接或间接调用自身。例如，参见 `see recursion`。 \n\n**`referential transparency`**\n\n\
    : 当可以用直接值替换函数的输入并获得相同结果时，该函数具有引用透明性。 \n\n**`REPL`**\n\n: 读取-求值-打印循环。开发人员用于轻松交互式评估代码的工具，也称为\
    \ `language shell`。 \n\n**`return type`**\n\n: 函数将发出的值的类型。 \n\n**`RFC`**\n\n:\
    \ 征求意见稿。在 PHP 中，任何拟议的语言更改或添加都必须准备 RFC。然后由拥有投票权的人投票通过或否决。 \n\n**`runtime`**\n\n\
    : 将语言字节码转换为机器可执行指令的系统。对于 PHP，有 HHVM、Zend（事实标准）和 Quercus 等几种。 \n\n**`Scala`**\n\
    \n"
