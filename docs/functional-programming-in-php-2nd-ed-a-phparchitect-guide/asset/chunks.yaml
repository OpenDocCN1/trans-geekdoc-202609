  trans: "\n\n: 一种在 Java 虚拟机上运行，并同时支持函数式和面向对象编程的编程语言。\n\n**scalar**\n\n: 包含单个值的基础类型类别，例如\
    \ `int` 和 `string`。\n\n**ternary operator**\n\n: 一种简短的条件语句，允许基于真或假的响应执行操作。\n\n\
    **type**\n\n: 值所属的类别。例如，`10` 是整数类型。\n\n**type definition**\n\n: 代码中对值类型（int、string\
    \ 等）的规范说明。\n\n**type hinting**\n\n: 在传递变量的位置指定类型。\n\n**`use`**\n\n: 可以是包含特定命名空间的调用，包含\
    \ PHP trait 的调用，或者指示闭包在定义时从父作用域中提取变量。\n\n**UTF-8**\n\n: 一种 Unicode/多字节字符标准/表。\n\
    \n**UTF-8 ellipsis**\n\n: `…`\n\n**vim**\n\n: 一种适用于命令行界面或终端的文本编辑器。大多数 Linux 发行版通常都自带，但\
    \ Windows 也可用！\n\n**weak typing**\n\n: 类型是暂时的，编译器/解析器不关心，并且可能在运行时根据推断的含义在类型之间进行转换。\n\
    \n**Windows**\n\n: 微软的操作系统。如果你正在使用它并阅读本书，请安装 Vagrant 并在虚拟机中运行 Ubuntu，以免自己受罪。\n\
    \n**xdebug**\n\n: PHP 领域用于交互式调试和代码性能分析的首选扩展。\n\n# Credits\n\n### Functional Programming\
