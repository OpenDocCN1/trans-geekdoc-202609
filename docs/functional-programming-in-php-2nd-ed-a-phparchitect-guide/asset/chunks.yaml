    \ exception that makes this a generator.\n\nNote the `yield` keyword inside the\
    \ for loop—the only real deviation from any array based range function you may\
    \ write. Now we have our two base functions we can call them together to see how\
    \ they work.\n\n```\necho sum2(range2(1, 10));\n// 55\n```\n\nA more complex and\
    \ useful example of a generator is one which makes file reading more efficient.\
    \ This can be used to work on large files without reaching memory limits or exceeding\
    \ an execution timeout.\n\nThe beauty of using a generator in this way is you\
    \ create a more abstract interface for operating on a file. The consuming code\
    \ does not need to even know its operating on a file; it just knows it has an\
    \ iterator it needs to work through. This means you could use the functions from\
    \ your library you have written to work with arrays all without changing their\
    \ implementation to handle file transformations.\n\nThis could also be achieved\
    \ with PHP’s `file()` function which reads an entire file as an array, but it\
    \ would not suit large files as it would have memory consumption implications.\n\
    \n* * *\n\n1.  [PHP SuperClosure—Version 2](https://github.com/jeremeamia/super_closure)[↩](#ch006.xhtml#fnref1)\n\
    \n2.  Cyclic Redundancy Checksum polynomial of 32-bit lengths[↩](#ch006.xhtml#fnref2)\n\
    \n3.  MD5 Message-Digest Algorithm[↩](#ch006.xhtml#fnref3)\n\n4.  US Secure Hash\
    \ Algorithm 1[↩](#ch006.xhtml#fnref4)\n\n5.  US Secure Hash Algorithm 2[↩](#ch006.xhtml#fnref5)\n\
    \n6.  [PHP Generators](http://php.net/language.generators)[↩](#ch006.xhtml#fnref6)\n\
    \n# 4 Helpful Libraries\n\n> “We can only see a short distance ahead, but we can\
    \ see plenty there that needs to be done.”\n\n> \n\n> —Alan Turing (Mathematician\
    \ and Computer Scientist, 1912–1954)\n\nNow that you have seen some techniques\
    \ for manipulating data in a functional way, you are probably wondering which\
    \ primitives and higher order functions PHP has to offer in the default installation.\
    \ Unfortunately, the answer is not many, although this constantly changing as\
    \ the language evolves. To help fill this void, Lars Strojny has created a PECL\
    \ extension called functional-php\n\nMany, if not all, of the functions are inspired\
    \ by implementations of functional primitives in other languages such as JavaScript\
    \ and Scala. Unfortunately, at this stage there is no implementation of any sorting\
    \ functionality in the extension or library, but it is on the road map for the\
    \ project.\n\nNot only does functional-php have handy primitives, but it also\
    \ unifies the interface for operating on lists. All functions have the same order\
    \ of parameters, so no more hassle remembering whether it is the collection or\
    \ callback which comes first! Another very handy feature is in addition to arrays,\
    \ its functions can operate on any object that implements PHP’s `Traversable`\
    \ interface.\n\nIt is important to try to keep the API consistent with your own\
    \ code and when importing other functional libraries to facilitate easier future\
    \ maintenance.\n\nAdditionally, there is the Underscore.php\n\nAs previously mentioned\
    \ in the partial function application section, React/Partial\n\n## 4.1 Library\
    \ Installation\n\nThe main library used throughout the following code samples\
    \ is functional-php, and it can either be installed as a PHP/PECL extension or\
    \ as a userland PHP library. If you have the option, then I would suggest the\
    \ extension route, but if you can’t build or install extensions on your server,\
    \ then you can use the library. For initial playing around, you may find it easier\
    \ to opt for the library route as well. If you are following along on a Windows\
    \ machine, then install it as a library.\n"
  trans: "\n\n也可以通过使用闭包来处理键的要求，使用 `array_reduce()` 实现相同的操作。我们可以遍历键，然后稍后使用 `$fx` 中的键获取值。\n\
    \n### Flat Map\n\n在处理列表映射时，我们通常希望应用一个返回数组的函数。但我们想要的最终结果只是一个简单的一维数组，而不是默认返回的二维数组。\n\
    \n让我们先看一个问题示例，这样你就能轻松看出这种情况可能在你的代码中出现的地方。\n\n我们实际上希望返回一个简单的一维列表，而这正是我们的朋友 `flat_map()`\
    \ 发挥作用的地方。\n\n在 PHP 中，`flat_map()` 可以使用 `array_reduce()` 来定义，以将每个函数应用的结果合并到第一维。值得注意的是，`flat_map()`\
    \ 不会扁平化所有维度——只是将第二维扁平化到第一维——所以如果你有一个深度嵌套的数组，它不会影响较低的维度。如果你需要这样做，请在使用 `array_map()`\
    \ 应用函数后，使用 `flatten()`（本书后面定义）来减少嵌套。\n\nFlat map 是函数式编程中非常常见的操作，大多数语言都有专门的 flat\
    \ map 函数来帮助你解决这个问题。在 PHP 中用相当简单的一组代码就能复制相同的功能，这非常方便。\n\n### Filter\n\n借助过滤，你可以通过对列表中的每个项目应用一个称为谓词的回调函数，从一组值中返回结果集。谓词将返回布尔值\
    \ false 以移除记录，或返回 true 以保留列表项在结果集中。虽然这听起来可能有点复杂，但在实践中，它使清理列表变得轻而易举。\n\n在前面的示例中，我们正在对一组简单的整数应用过滤回调。回调本身检查提供的数字是否能被\
    \ 2 整除，这是检测值是偶数还是奇数的简单方法。\n\n然后使用 `array_filter()` 遍历整数数组并对其中的每个值应用回调。这将返回一个新数组，其中仅包含偶数，在此示例中为\
    \ 2 和 4。\n\n## 3.6 Memoization\n\n结果缓存过程可以通过返回预处理好的数据集来帮助加速昂贵的操作。从缓存中获取值允许应用程序跳过缓慢运行的代码，同时仍然返回正确的结果。PHP\
    \ 的 memoization 的秘诀是 `static` 关键字，它有效地将变量绑定到内存中的资源。每当资源在同一 PHP 进程中更新时，新值将在下次调用函数时被调用。\n\
    \n可以通过使用 functional-php 库的 `F\\memoize()` 函数来简化此操作（后面将更深入地讨论）：\n\n```\nuse Functional\
    \ as F;\n\n$callback_function = function($arg) {\n   return get_some_really_expensive_data($arg);\n\
    };\n$result = F\\memoize($callback_function, array('php'));\n```\n\n一个很好的示例是缓存大型文档的哈希解析，或限制对广泛重用函数的数据库调用。\n\
    \n## 3.7 Generators\n\n在处理大型数据集时，将整个数据集加载到内存中（例如作为数组）是低效的。为了缓解这一过程，PHP 添加了生成器语法。\n\
    \n如果我们查看本书中运行的求和示例，我们可以编写自己的 `array_sum()` 版本，该版本接受生成器而不是数组。该函数将遍历生成器中包含的值并将它们全部相加。\n\
    \n你会立即注意到这里似乎没有什么特别之处，你是正确的。这只是一个 `foreach` 循环，将每个值（`$i`）添加到 `$total` 变量中。你可以将数组传递给此函数，它也能同样工作。关键在于\
    \ `$values` 如何被填充，而不是如何被消费。\n\n为了生成一些值，有必要编写一个范围函数，该函数生成生成器而不是数组。这个函数也会非常熟悉，只有一个简单的例外使其成为生成器。\n\
    \n注意 for 循环内的 `yield` 关键字——这是与你可能编写的任何基于数组的范围函数的唯一真正偏差。现在我们有了两个基础函数，可以一起调用它们来看看它们如何工作。\n\
    \n```\necho sum2(range2(1, 10));\n// 55\n```\n\n生成器更复杂且更有用的示例是使文件读取更高效的示例。这可以用于处理大文件而不会达到内存限制或超过执行超时。\n\
    \n以这种方式使用生成器的好处是，你为操作文件创建了一个更抽象的接口。消费代码甚至不需要知道它正在操作文件；它只知道它有一个需要遍历的迭代器。这意味着你可以使用你编写的用于处理数组的库函数，而无需更改其实现来处理文件转换。\n\
    \n这也可以通过 PHP 的 `file()` 函数实现，该函数将整个文件读取为数组，但它不适合大文件，因为它会有内存消耗影响。\n\n* * *\n\n\
    1.  [PHP SuperClosure—Version 2](https://github.com/jeremeamia/super_closure)↩\n\
    \n2.  32 位长度的循环冗余校验多项式↩\n\n3.  MD5 消息摘要算法↩\n\n4.  US 安全哈希算法 1↩\n\n5.  US 安全哈希算法\
    \ 2↩\n\n6.  [PHP Generators](http://php.net/language.generators)↩\n\n# 4 Helpful\
    \ Libraries\n\n> “We can only see a short distance ahead, but we can see plenty\
    \ there that needs to be done.”\n\n> \n\n> —Alan Turing (Mathematician and Computer\
    \ Scientist, 1912–1954)\n\n现在你已经了解了一些以函数式方式操作数据的技术，你可能想知道 PHP 在默认安装中提供哪些原语和高阶函数。不幸的是，答案是不多，尽管随着语言的发展，这在不断变化。为了帮助填补这一空白，Lars\
    \ Strojny 创建了一个名为 functional-php 的 PECL 扩展。\n\n许多，如果不是全部的话，函数都受到其他语言（如 JavaScript\
    \ 和 Scala）中函数式原语实现的启发。不幸的是，在这个阶段，扩展或库中没有任何排序功能的实现，但它在项目路线图上。\n\nfunctional-php\
    \ 不仅有方便的原语，还统一了操作列表的接口。所有函数都有相同的参数顺序，因此不再需要费心记忆是集合还是回调在前面！另一个非常方便的功能是，除了数组之外，其函数可以操作任何实现\
    \ PHP `Traversable` 接口的对象。\n\n重要的是，要尽量保持 API 与你自己的代码一致，并在导入其他函数式库时保持一致，以便于未来的维护。\n\
    \n此外，还有 Underscore.php\n\n如前面部分提到的部分函数应用，React/Partial\n\n## 4.1 Library Installation\n\
    \n以下代码示例中使用的主要库是 functional-php，它可以作为 PHP/PECL 扩展安装，也可以作为用户空间 PHP 库安装。如果你有选择，我建议选择扩展路线，但如果你无法在服务器上构建或安装扩展，则可以使用库。对于初步尝试，你可能会发现选择库路线也更容易。如果你在\
    \ Windows 机器上操作，请将其作为库安装。\n\n"
