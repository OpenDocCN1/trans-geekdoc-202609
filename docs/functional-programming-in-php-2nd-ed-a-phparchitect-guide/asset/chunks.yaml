    \n# 2 What is Functional Programming?\n\n> “Programming where your entire program\
    \ is a single referentially transparent expression composed of other referentially\
    \ transparent expressions. No side effects. No mutability. No global mutable state.”\n\
    \n> \n\n> —Rúnar Bjarnason (Functional programmer, @runarorama)\n\nIt is difficult\
    \ to categorically define functional programming as all functional languages vary,\
    \ and there is not a universally agreed upon specification. Couple that with the\
    \ fact there are varying opinions amongst programmers as to what makes a functional\
    \ language, and you have a conundrum. To confuse matters further, many languages\
    \ have functional elements or primitives defined in them.\n\nWhile perilous, I\
    \ will make an attempt at a very simplified explanation of a core tenet. Programming\
    \ in a functional way is essentially coding without any assignment of values.\
    \ There, I said it! Of course, there’s a lot more to it, but this is the most\
    \ simplistic—and also the most mind blowing—statement for those of us from an\
    \ imperative programming background like PHP.\n\nThis is a very simplified allusion\
    \ to the functional approach of removing state from your programs and emphasizing\
    \ purity. It is, of course, also an incendiary challenge to your current programming\
    \ practices. As your understanding of functional programming grows you will begin\
    \ to understand more encompassing descriptions of what constitutes a functional\
    \ piece of code.\n\nTo begin with, it is important to define what imperative programming\
    \ means so there is a good base to build upon. Imperative programming is often\
    \ thought of as the diametric opposite of functional programming allowing us to\
    \ eliminate it from the description of what functional programming actually is.\
    \ It is a style where the programmer tells the computer step by step exactly what\
    \ it should do to complete a computation or program.\n\nYou may think this just\
    \ applies to procedural PHP (code that does not make use of PHP’s object oriented\
    \ constructs and functions), but you would be wrong. Simon Peyton Jones of Haskell\
    \ fame describes imperative programming as\n\n> “…a sequence of steps. Every line\
    \ says do this, then do this, do this. When you call a method often there are\
    \ no results \\[returned\\]…because the sole reason for calling it is to have\
    \ an effect on the world. To change the state of something.”\n\nHe points out\
    \ a very noteworthy property of imperative programming—there are hidden changes\
    \ to state. This means if you call a method in an imperative program you cannot\
    \ be sure if it will just compute the result given your arguments or whether it\
    \ will also adjust the state of the programming. As functional programming seeks\
    \ to be pure, these changes in state must be eliminated.\n\nA number of people\
    \ describe functional programming based on this property of no changes to state.\
    \ One such person is Erik Meijer who has a love of Haskell and has worked on the\
    \ C# programming language, among others. He describes functional programming as\
    \ being"
