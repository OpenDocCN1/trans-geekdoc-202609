- raw: "If you have chosen to install it as a library rather than an extension, please\
    \ skip to the “Other PHP Libraries” section heading below.\n\n### functional-php\n\
    \nThe functional-php extension must be built from source as the PECL releases\
    \ are old and missing the latest features. The first thing to do is to download\
    \ a ZIP file of the source from GitHub\n\n```\n\n```\n\nOnce the extension is\
    \ built using any of the aforementioned methods, you will also need to enable\
    \ it in the `php.ini` file by adding the line:\n\n```\n\n```\n\nIt should be noted\
    \ here if you are using this extension with a website rather than on the PHP CLI,\
    \ then you will need to restart your web server for the new PHP configuration\
    \ to take effect.\n\n> **Note:** You should remove the functional-php line from\
    \ the `composer.json` requirements described in the next section before installing\
    \ the dependencies if you have already installed functional-php via the extension\
    \ method described above. If you fail to do this, the userland PHP library version\
    \ will still be installed, though it will be ignored harmlessly in deference to\
    \ the PHP extension.\n\n### Other PHP Libraries\n\nWith the exception of functional-php,\
    \ all the aforementioned libraries are supplied as userland PHP code allowing\
    \ them to be installed via the usual methods such as downloading a tarball. However,\
    \ with the help of the Composer dependency management system and the Packagist\
    \ repository, you can make the process much simpler.\n\nTo get started, you will\
    \ need to install Composer per the instructions in [*PHP Libraries* in Chapter\
    \ 1](#ch004.xhtml#php-libraries).\n\n```\n\n```\n\nAlso in the base folder of\
    \ the application, you should define a JSON object in the `composer.json` file\
    \ to configure the dependencies of your project. To make this process quicker\
    \ and easier, see Listing 4.1 which contains the full `composer.json` requirements\
    \ file for all the aforementioned libraries. Should you not wish to install a\
    \ library, you can simply remove it from the list. For more information on the\
    \ requirements file format, please see the Composer documentation\n\n**Listing\
    \ 4.1**\n\n```\n\n```\n\nOnce you have decided which libraries to install, and\
    \ have amended your `composer.json` file appropriately, you can install them with\
    \ a single command:\n\n```\n\n```\n\nShould a project you depend upon be updated\
    \ with changes at a later date, you can simply call update with:\n\n```\n\n```\n\
    \nNow, in your project’s bootstrap or index file, you can include all of the Composer/Packagist\
    \ supplied dependencies by simply adding this line of PHP code:\n\n```\n\n```\n\
    \nIf you are using version control (and you should be), then you will want to\
    \ remember to ignore/exclude `composer.phar`, and the `vendor` directory before\
    \ committing.\n\n## 4.2 The iter Library\n\nGenerators and iterators are very\
    \ handy features of PHP, but like most of the features we have studied there are\
    \ some rough edges. The userland `iter` library helps to make their usage simpler\
    \ and cleaner. The library can be installed as a dependency with composer much\
    \ like the other libraries we have reviewed here. The main benefit it provides\
    \ is a set of functions which can be universally applied to all PHP iterables,\
    \ arrays, traversables, and aggregates. These include implementations of map,\
    \ reduce, and range which we have seen previously. The exception here is they\
    \ can be applied everywhere and to all PHP collections.\n\nTo make the code more\
    \ efficient all access is completed via generators which allows the library to\
    \ be lazy. By this I mean it will only actually complete the work when, and only\
    \ when, it is needed for the continued execution of the program. This is the opposite\
    \ of eager loading where as much work is done up front as possible, even if the\
    \ result may not actually be used in this context.\n\nSo you get the benefit of\
    \ a better API and improved overall performance. To keep it simple we will start\
    \ with an example we have seen a few times already: summing up a range of integers.\n\
    \n```\n\n```\n\nIt can also be used in more complicated functional code with good\
    \ results. If you have to deal with an array of items and you cannot be sure they\
    \ are all of the same type then the `iter\\takeWhile` function can really help.\n\
    \n```\n\n```\n\nThis library is a very handy replacement for many of PHP’s list/iterable\
    \ access functions. Alongside functional-php it can create a very useful toolkit\
    \ of primitives.\n\nAs this library is based upon generators the iterables are\
    \ not currently rewindable by default. To work around this the library has in-built\
    \ support for iterator conversion to rewindables.\n\n```\n\n```\n\nGenerators\
    \ from the `iter` library are already bestowed with a rewindable variant under\
    \ the `iter\\rewindable` namespace. Any function such as map, reduce, etc. from\
    \ the `iter` library can be called this way for rewindable functionality.\n\n\
    ```\n\n```\n\nThe functions this library provides are very useful when dealing\
    \ with lists in PHP 5.5 and above where generators are supported. They are predictable\
    \ with the callback function always coming first where applicable. It is a very\
    \ well thought out library which replaces core PHP functions with a much neater\
    \ interface.\n\nWhere possible I would recommend you add it as a dependency to\
    \ all your applications be they functional or not. Then simply take a list of\
    \ any type and apply your will to it just as we would wish PHP’s in-built functions\
    \ to do.\n\n* * *\n\n1.  [functional-php](https://github.com/lstrojny/functional-php)[↩](#ch007.xhtml#fnref1)\n\
    \n2.  [Underscore.php](http://brianhaveri.github.com/Underscore.php/)[↩](#ch007.xhtml#fnref2)\n\
    \n3.  [nicmart/Functionals](https://github.com/nicmart/Functionals)[↩](#ch007.xhtml#fnref3)\n\
    \n4.  [React/Partial](https://github.com/reactphp/partial)[↩](#ch007.xhtml#fnref4)\n\
    \n5.  [Functional PHP ZIP file](https://github.com/lstrojny/functional-php/archive/master.zip)[↩](#ch007.xhtml#fnref5)\n\
    \n6.  [Composer documentation](http://getcomposer.org/doc/)[↩](#ch007.xhtml#fnref6)\n\
    \n# 5 HHVM’s Hack\n\n> “Never had any mathematical conversations with anybody\
    \ because there was nobody else in my field.”\n\n> \n\n> —Alonzo Church (Mathematician\
    \ and Logician, 1903–1995)\n\nFacebook has been using PHP for years, but as the\
    \ site’s membership grew so did its load times. In a bid to speed up PHP they\
    \ wrote an internal-use-only transpiler that could convert a small subset of PHP\
    \ to a C program. This resulted in much faster load times, but was cumbersome\
    \ to use and required specialist internal knowledge to run correctly. As time\
    \ wore on this became less and less viable and the code started to take longer\
    \ to compile. Eventually a new project was started which would go on to be called\
    \ HipHop Virtual Machine or HHVM for short. It is a just-in-time parser which\
    \ creates an efficient cached representation of your program as it is executed.\
    \ To obtain the best performance this cache must be warmed by running the target\
    \ code a number of times to allow HHVM to get the most optimal picture of your\
    \ code. It is worth noting the JIT aspect does not enhance performance on the\
    \ command line as a new cache is used on every invocation.\n\nAlongside this new\
    \ and faster runtime Facebook also needed a few features to be added to the language.\
    \ This has grown to become the Hack language. The languages are essentially the\
    \ same with Hack being a fork of PHP, albeit on its own runtime.\n\nTo notify\
    \ the compiler you are using Hack instead of PHP you simply use `<?hh` as the\
    \ opening tag instead of `<?php`. HHVM will see this tag and then parse the code\
    \ as Hack instead of straight PHP. Inside these tags you can perform operations\
    \ just like you would with PHP, but benefit from improved JITing as you refactor\
    \ the code slowly to Hack. There are some things PHP supports which HHVM has deliberately\
    \ omitted as their actual implementations is in the wilds of PHP are limited.\
    \ To ensure they achieve a reasonable parity, Facebook has chosen a number of\
    \ open source projects to compile unit tests against."
  fmt: "\n如果你选择将其作为库而非扩展安装，请跳转至下方的“其他 PHP 库”标题部分。\n\n### functional-php\n\nfunctional-php\
    \ 扩展必须从源码构建，因为 PECL 版本已过时且缺少最新功能。首先，请从 GitHub 下载源码 ZIP 文件。\n\n扩展使用上述任一方法构建完成后，还需要在\
    \ `php.ini` 文件中添加以下行来启用它：\n\n需要注意的是，如果你是将此扩展用于网站而非 PHP CLI，则需要重启 Web 服务器，以便新的\
    \ PHP 配置生效。\n\n> **Note:** 如果你已通过上述扩展方法安装了 functional-php，则应在安装依赖项前从 `composer.json`\
    \ 要求中移除 functional-php 行（如下一节所述）。若不这样做，用户空间 PHP 库版本仍会被安装，尽管会无害地被忽略，以便让 PHP 扩展优先。\n\
    \n### 其他 PHP 库\n\n除了 functional-php 之外，上述所有库均以用户空间 PHP 代码形式提供，可通过常规方法（如下载 tarball）安装。不过，借助\
    \ Composer 依赖管理系统和 Packagist 仓库，你可以让此过程更加简单。\n\n要开始，你需要按照第 1 章 [*PHP 库*](#ch004.xhtml#php-libraries)中的说明安装\
    \ Composer。\n\n在应用程序的基础文件夹中，你应在 `composer.json` 文件中定义一个 JSON 对象以配置项目依赖项。为加快并简化此过程，请参阅清单\
    \ 4.1，其中包含上述所有库的完整 `composer.json` 要求文件。若你不希望安装某个库，只需从列表中移除即可。有关要求文件格式的更多信息，请参阅\
    \ Composer 文档。\n\n**Listing 4.1**\n\n决定要安装哪些库，并适当修改 `composer.json` 文件后，你可以使用单个命令安装它们：\n\
    \n若你依赖的项目在稍后日期进行了更新，你可以简单地调用 update：\n\n现在，在项目的引导或索引文件中，你可以通过添加以下 PHP 代码行来包含所有\
    \ Composer/Packagist 提供的依赖项：\n\n如果你使用版本控制（你应该使用），则在提交前请记得忽略/排除 `composer.phar`\
    \ 和 `vendor` 目录。\n\n## 4.2 The iter 库\n\n生成器和迭代器是 PHP 的非常实用的功能，但与我们研究的大多数功能一样，也存在一些粗糙之处。用户空间\
    \ `iter` 库有助于使其使用更简单、更清晰。该库可以像我们在此处审查的其他库一样，作为依赖项通过 composer 安装。它提供的主要好处是一组可以普遍应用于所有\
    \ PHP 可迭代对象、数组、可遍历对象和聚合的函数。这些包括我们之前见过的 map、reduce 和 range 的实现。这里的例外是，它们可以应用于所有\
    \ PHP 集合的各处。\n\n为了使代码更高效，所有访问均通过生成器完成，这使得库可以惰性执行。我的意思是，只有在程序继续执行时需要时，它才会实际完成工作。这与急加载相反，急加载会尽可能提前完成尽可能多的工作，即使结果在此上下文中可能根本不会被使用。\n\
    \n因此，你可以获得更好的 API 和更好的整体性能。为保持简单，我们将从一个已经见过几次的示例开始：对一系列整数求和。\n\n它也可以在更复杂的函数式代码中取得良好效果。如果你必须处理一个项目数组，且无法确定它们是否都是相同类型，那么\
    \ `iter\\takeWhile` 函数可以提供很大帮助。\n\n这个库是 PHP 的许多列表/可迭代访问函数的非常实用的替代品。与 functional-php\
    \ 一起，它可以创建一套非常有用的原语工具包。\n\n由于该库基于生成器，可迭代对象默认当前不可回绕。为解决此问题，该库内置了将迭代器转换为可回绕对象的支持。\n\
    \n来自 `iter` 库的生成器已赋予 `iter\\rewindable` 命名空间下的可回绕变体。`iter` 库中的任何函数（如 map、reduce\
