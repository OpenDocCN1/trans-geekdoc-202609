    \ PHP。省略 `use` 子句的需求是语法简化的另一种简单方式。在维护方面，字符数更少通常是件好事，因为需要阅读的内容更少，因此在脑中构建的心智负担也更小。我们在脑中创建的这个执行映射具有较高的认知负荷，这些表达式有助于降低它。\n\
    \n就像其他被 PHP 采用的 Hack 特性一样，看到针对带有隐式作用域的 lambda 表达式的 RFC 将是件好事。鉴于此类特性会改变语言，遗憾的是，它似乎不太可能通过投票阶段。\n\
    \n## 5.3 特殊（魔法）属性\n\nHack 中没有 PHP 的这些特殊关键字的等价物，它们为类带来了专门的功能。它们以类似于 PHP 的 `__toString()`\
    \ 或 `__construct()` 方法的方式为类添加自定义魔法，但以注解的形式存在。\n\n你可以使用特殊的 `<<__Memoize>>` 属性轻松缓存函数结果，该属性可以添加到函数和类方法中。在以下代码中，你可以看到对返回唯一字符串的函数的两次调用，当\
    \ memoize 属性直接添加到函数定义上方时，会产生相同的结果——通常 `$a` 和 `$b` 会不同。\n\n```\n<<__Memoize>>\n\
    function getUniqueString(): string {\n   return uniqid();\n}\n$a = getUniqueString();\n\
    $b = getUniqueString();\n$c = ($a === $b); // true\n```\n\n这是一个非常简单的注解，可以添加到任何方法或函数上方，立即赋予其记忆化属性，而无需自己完成任何实现。不过，关于你可以使用此注解传递给函数或方法的参数，有几点需要注意。只能传递以下类型作为参数：`null`、`bool`、`int`、`float`、`string`、`IMemoizeParam`\
    \ 的实现以及包含上述任何类型的数组。除此之外，参数不能按引用传递，而应在函数的括号内定义，而不是通过 varargs 访问。\n\n较不有趣的 `<<__Override>>`\
    \ 和 `<<__ConsistentConstruct>>` 属性与 Hack 中的类定义相关。第一个在任何类方法之前立即实现，其目的是确保类与其父类之间的一致性。如果父类不包含相同方法的具体实现，则会触发错误。这使得当你尝试将某个方法从父类中重构出来时，可以知道子类重写了特定方法。\n\
    \n如果 `<<__ConsistentConstruct>>` 添加到类定义上方，则它会告诉 Hack 解析器检查所有扩展它的类是否使用兼容的 `__construct()`\
    \ 方法定义。有时这可能不太有用，你可能希望通过在 `__construct()` 方法上方添加 `<<UNSAFE_Construct>>` 来防止它应用于你正在编写的子类。Hack\
    \ 将忽略它，并依赖于编写它的程序员已经考虑到了一致性！\n\n如果你想一起使用这些特殊属性，可以用逗号将它们分隔开，形成尖括号之间的列表，如下所示：\n\n\
    ```\n\n```\n\n## 5.4 结论\n\nHack 提供了一些不错的额外功能和一些改进的语法，相对于 PHP——这比运行更快的 PHP 脚本更能激励人们使用\
