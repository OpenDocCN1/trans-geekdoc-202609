- raw: "When working with pure PHP functions, it can be useful to add some debugging\
    \ information to them for logging purposes. As we are inside a pure function,\
    \ we must not attempt to set state or cause any side effects such as printing\
    \ directly to screen. All of our functions should pass their output as return\
    \ values. You need a construct to add flexibility to your functions—the `Writer`\
    \ monad.\n\nThe `Writer` monad allows you to write out to screen, disk, memory,\
    \ etc. while also maintaining the method chain and common interface. To show this\
    \ in action, we will need at least two simple functions we can apply to the `Writer`\
    \ monad.\n\nOur first function is a simple method, stripping non-alpha characters\
    \ from a string:\n\n```\n\n```\n\nLet us apply this function to an actual value\
    \ so we can see it in action:\n\n```\n\n```\n\nTo compliment this functionality,\
    \ the second function below will convert the supplied string to base 64.\n\n```\n\
    \n```\n\nBoth of these functions take the same number of arguments and return\
    \ the same value type, which makes them composable functions without further modification.\
    \ The return value of one function can be passed directly into the other as an\
    \ argument. To demonstrate this ability, we must use the `compose()` function\
    \ we defined earlier.\n\n```\n\n```\n\nAs you can see, the return value is as\
    \ expected—the same as if you had called `echo $base64($strip($str))`. Suppose\
    \ for a moment we did not know that, and we were curious to know which function\
    \ was being applied to `$str` first. To prove our hypothesis, we can use logging\
    \ to determine the call order of the functions.\n\nThe first thing you would normally\
    \ do in PHP is to add statements printing out a message to screen from each function,\
    \ but as I mentioned before, that is cheating and breaks pure functions! For this\
    \ example, you are to wipe that knowledge from your mind. We will add logging\
    \ strings as return values from the functions instead, see Listing 6.12.\n\n**Listing\
    \ 6.12**\n\n```\n\n```\n\nNow that we have logging in place, we can compose the\
    \ functions again and try the same string manipulations again.\n\n```\n\n```\n\
    \nUnfortunately, the logging has broken our function composition and triggers\
    \ a PHP error.\n\n```\nPHP Warning:  base64_encode() expects parameter 1 to be\n\
    \   string, array given\n```\n\nOur functions only accept one string parameter,\
    \ and we are now trying to stuff an array into one of them. This is what you expect\
    \ PHP to do, but it is not what we want.\n\nImmediately, you are probably thinking\
    \ of ways to work around this annoyance. At least one method revolves around modifying\
    \ the second function (`$base64`) to accept an array as its first parameter, but\
    \ this would change the function’s signature. It would also mean you would not\
    \ be able to compose the functions in reverse order.\n\nThe next option you are\
    \ probably thinking about is to write a wrapping function calling both functions\
    \ internally and combining the results. It will work, but it is not as flexible\
    \ as it could be—think again of the possible need to reverse the composition in\
    \ the future or other methods of reuse.\n\nInstead, let’s write a higher order\
    \ compose function specifically for handling these function signatures. It will\
    \ accept the two string functions we created earlier as arguments and return a\
    \ composed function.\n\n**Listing 6.13**\n\n```\n\n```\n\nThis can be improved\
    \ still further, however, by converting or lifting our functions to interoperable\
    \ debug functions rather than writing custom composing functions.\n\nEssentially,\
    \ the function signature of the original function was:\n\n```\nf:String = String\n\
    ```\n\nWith our most recent modifications, we have created:\n\n```\nf:String =\
    \ [String, String]\n```\n\nHowever, we want to convert them so the signature changes\
    \ to:\n\n```\nf:[String, String] = [String, String]\n```\n\nIn this way, it is\
    \ possible to use the universal `compose()` function rather than some custom logic\
    \ each time to compose individual cases.\n\nThis is where we introduce the naming\
    \ conventions we used in the `Only` and `Maybe` monads we have already seen. The\
    \ first order of business is lifting the value passed into each function so it\
    \ is an array. By default, the log is set to an empty string.\n\n**Listing 6.14**\n\
    \n```\n\n```\n\nLifting the functions to accept an array as a parameter and then\
    \ applying it is the job of the `map()` method. Now let’s see our latest monad\
    \ in action by wrapping our string in a new `Writer` monad.\n\n```\n\n```\n\n\
    To use our monad, we need to apply a function to it, so let’s start with `$strip()`\
    \ again:\n\n```\n\n```\n\nFinally for the pièce de résistance, we can chain our\
    \ call to `$base64()` onto the result from `$strip()`:\n\n```\n\n```\n\nAs you\
    \ can clearly see from the results, we now have a `Writer` monad containing exactly\
    \ the same values we achieved via our custom composition function (`$compose_log()`).\
    \ From here, you have the tools to create new monads for various other pieces\
    \ of functionality. My suggestion is the `Reader` and `State` monads are probably\
    \ the next most useful, so I would recommend starting there.\n\n* * *\n\n1.  [php-option](https://github.com/schmittjoh/php-option)[↩](#ch009.xhtml#fnref1)\n\
