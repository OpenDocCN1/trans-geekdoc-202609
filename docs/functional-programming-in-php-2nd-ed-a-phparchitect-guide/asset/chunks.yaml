    \ 和其他 PHP 语言函数的功能。这些功能只是以与 PHP 相同的方式和语法实现的。\n\n当然，我也略过了 Hack 的其他一些功能，你可能会在面向对象代码中发现它们很有用，或者觉得在这里包含它们太过绕道。这些功能在\
    \ Hack 手册以及各种 Facebook 博客文章中都有很好的文档记录，如果你希望深入了解该语言，可以参考这些资料。\n\n# 6 模式\n\n> “Monads\
    \ 是引导你走上幸福之路的返回类型。”\n\n> \n\n> –Erik Meijer（计算机科学家，@headinthebox）\n\n在函数式编程中，存在重复的模式，就像任何其他编程风格一样。这实际上是不熟悉函数式编程的程序员感兴趣的主要来源，因为它带来了简洁的代码。\n\
    \n软件模式通常被认为是以普遍可识别和理解的方式完成类似任务的最佳实践。就像面向对象编程一样，函数式代码也有许多你会经常看到的模式。这些模式有助于创建更具可组合性的函数，从而允许在各种问题领域中更大程度地重用。不仅如此，它们还可以帮助使你的\
