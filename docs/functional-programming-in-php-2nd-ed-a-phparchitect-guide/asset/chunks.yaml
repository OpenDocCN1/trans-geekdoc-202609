    \ 也有柯里化的概念，但我更喜欢 nicmart/Functionals 的实现。这里提到的库的详细信息将在后面更深入地介绍。\n\n> \n\n> 从这个函数式方法的名称中无法得出任何技术原因或特殊含义，但你可能想知道“柯里化”一词到底来自哪里。嗯，它与同名的美味食物毫无关系——尽管每次你对函数进行柯里化时，你可能会感到饥饿。只有我吗？我怀疑！\n\
