    Additional caveats include not being able to simply import one function from a
    namespace or alias which function in your `use` statement. You could potentially
    work around the former by putting each function into its own namespace. You could
    then use the narrower namespace to pull in just the one function.


    There is a miserable trade-off, though, as it will make calling the function a
    more verbose procedure. If you import the parent namespace, for instance, you
    would need to specify the child namespace before each function call:


    ```


    ```


    However, it would allow you to pull in just one function like so:


    ```


    ```


    Handling immutable data is complicated by the fact PHP does not support it natively,
    and it is the functional developer’s responsibility to ensure they do not introduce
    state changes into the code themselves. There have been a few attempts to enforce
    immutable data in PHP, but none of them are particularly satisfactory and all
    of them require class-based trickery such as Mikko Koppanen’s `php-immutable`
    extension.


    You are now in the uncharted wilds of PHP and pushing the boundaries of what is
    possible all the time. Things will be sub-optimal at times or just down right
    impossible, so you will need to use your judgement as to when these techniques
    are best employed—if at all—in your projects.


    Another minor issue is other PHP developers may struggle to understand your code
    and curse your name!


    * * *


