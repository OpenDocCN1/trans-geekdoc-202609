    # ## II. LITERATURE


    We have reviewed 15 most related and latest papers in machine learning to predict
    heart disease research, and deeply analyze these papers using the common components
    and features they used. In the following, we divided commonly components into
    nine aspects based on experiments used. At the step input, we analysis on dataset
    and sensor devices, and the processed signal feature, feature extraction, and
    classification as well as many methods. At the output result, we analyzed time
    and energy cost.


    # ### A. Mainly dataset and data


    Most of the current research in this field is based on online data analysis, and
    a small number of researchers use the data collected by testing them to the methods
    they proposed [6], [11]. Most papers can be divided into two types, one is collecting
    from [13], [14] and the other from MIT-BIH [9], [15], [16]. UCI dataset contains
    303 records each has 7 features. For instance, blood pressure, blood sugar, age,
    etc. However only 14 patients in heart disease dataset are used in research.


