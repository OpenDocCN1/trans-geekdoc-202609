    # VI. FUTURE AND CONCLUSION


    In the future, we will base on the Saadatnij[19] proposed long-term recurrent
    neural networks was the and try to reduce the local ECG data to achieve acceptable
    levels of accuracy. The framework will be equipped and furnished with wearable
    present devices. For the monitoring, a smart smartwatch, [360 Rico [94] will be
    the wearable smartwatch, a smart-MTM Limited Electronic Device [7]. Furthermore,
    referring to the state of art in heart disease prediction area, the later researchers
    can use the ECG signal as the dataset for prediction and reduce the budget cost.
    However, we still need to use the 7-3 ratio to do more exams for prediction and
    analysis of the data collected by IoT devices to ensure the proposed system can
    handle the large volume of data in 24 hours.


