    # C. Signal and data preproc.


    For an ECG signal, the details are in the 0.5Hz-100Hz frequency range and the
    relevant information is in the frequency range of 0.5Hz-40Hz for the analysis
    of heart data [3]. In order to eliminate the noise collected by sensors, pre-processing
    of the data is necessary. In this process, bandpass filter [4], [5], [8], [9]
    and median filter [11] are widely used. However, Gjki chose to add a built-in
    filter to the digital device. For example, Moresanga, Saadatnejad [9], Wang [15],
    Tekeste [16] used the Daubechies wavelet technique to remove the noise and compress
    the signal.


    For pre-processing physical features of type is mostly collected from the UCI
    dataset one which relies on regression data imputation for the missing attributes
    [6], [12]. Another method is delete attributes which have missing values [13].


    # D. Feature extraction and algorithms.


    After eliminating the noise, the ECG can become a noisy-free data, that some of
    the previous segment contains the segment ECG data. [4]. Lai will segment the
    segment into seconds or different lengths, segments, and Wang [15] choose to segment
    by heart beat. Each heart beats contains R, P, S and T waves, which provides enough
    information for analysis ECG data. [11]. Each heart beat has a fixed duration
    which contains 0.25 seconds before the R and 0.5 seconds after the R. Each segment
    is identified by R peak detection algorithm, [19], and [20] QRS detection, [11].
    Pan-Tom algorithms [9], [15] are popular used. For physical attribute extraction,
    one-hot method is used for categorical features [12] and a combination of new
    features [21].


    # F. Classification method


    In this paper, we use a machine learning technique to predict and diagnose heart
    disease. Machine learning has many algorithms. For support vector machine [4],
    Neural network [6], [15], Random forest (RF) and Convolutional Neural (CNN) algorithms
    are also used for classification of heart disease and can achieve acceptable accuracy
    rates for different patients.


    Random forest can classify the random data and the features to each node to form
    multiple decision trees [9]. The advantage of random forest is that it needs not
    to extract the features, can automatically discriminate the features. However,
    when the data is extremely noisy, the random forest classifier will be prone to
    overfitting. Furthermore, the latest researches in order to achieve higher accuracy,
    combine RF with other techniques, and may have achieved better performance. [14]
    combined Random selection with RF, [15] used the factor analysis of mixed data
    with the RF algorithm is commonly used in the UCI dataset, which contains many
    different features.


    A convolutional network contains three layers: convolution layer, pooling layer,
    and fully connected layer [24]. The ECG data can learn extract features automatically.
    However, there is no need to process the extraction step for the ECG signal. Although,
    Wang [15] used an improved CNN algorithm for heart disease classification, which
    uses three layers and achieved high accuracy. Khan [6] combined the CNN with the
    adaptive elimination algorithm, improving the weight and achieved 96.0% accuracy.
    It is worth noting that Khan [6] used the data collected by sensors devices which
    is real-time. CNN is popular to use in imaging data type. Therefore, for the classification
    of ECG data in the MI-BI dataset, the effect of CNN may perform better than other
    machine learning methods.


