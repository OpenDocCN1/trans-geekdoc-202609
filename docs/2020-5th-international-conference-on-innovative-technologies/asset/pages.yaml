    # ## I. INTRODUCTION


    Nowadays, the machine learning technique is widely used in many areas. For instance,
    using a pre-trained machine model to predict of signals in the heart domain, heart
    disease is the top one reason caused death around the world, about 35 million
    people die due to heart disease each [1]. In the development of IoT and wearable
    devices, it has provided a foundation for the integration of IoT and healthcare
    industry [2]. For members, the most important thing is whether the model can predict
    that they have heart disease for the first time or advise them. However, machine
    learning can only analyze the data and predict whether the patient has heart disease.
    Therefore, we need IoT sensors to continuously monitor heart signals and the major
    data is the patient ECG signal [3], [4] and the blood pressure frequency[6]. Researchers
    can use the ECG [7] and [8] as an important signal to diagnose disease.

    This paper is mainly focused on finding the gaps in current research and improving
    the machine learning prediction accuracy rate. The machine learning technique
    has different types of methods. For instance, Random forest, k-nearest neighbour,
