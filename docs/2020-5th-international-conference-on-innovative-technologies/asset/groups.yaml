    基于小波的马尔可夫模型实现了最佳的心脏病预测。Saadatnij[19] 也取得了良好的性能，准确率高于 95.2%，但低于 Sangath[3]。此外，Saadatnij[19]
    仅需 31 秒就实现了显著改进。Wang [85] 和 Barra [9] 的长短期循环神经网络是 Saadatnij [19] 处理 2.5 分钟个人心电图（ECG）数据时使用的方法。


    误差小于 1%，达到了生命疾病预测的高度可接受范围。然而，大多数先前的研究人员侧重于提高准确率以及调节速度和功耗，而他们的模型通过物联网技术实现了可接受的准确率范围。


    由于超过一半的入选患者选择使用 ECG 信号来诊断心脏受损情况，所提的系统使用可穿戴设备收集 ECG 信号。此外，大多数研究人员选择将机器学习部署在云服务器上。在对现有技术进行全面分析后，在云端部署模型是高效的。


    ## VI. 未来与结论


    在未来，我们将基于 Saadatnij[19] 提出的长短期循环神经网络，并尝试减少本地 ECG 数据以达到可接受的准确率水平。该框架将配备和完善可穿戴的设备。对于监控，智能手表（[360
    Rico [94]）将作为可穿戴智能手表，即一种智能 MTM 受限电子设备 [7]。此外，参考心脏病预测领域的最先进技术，后来的研究人员可以使用 ECG 信号作为预测的数据集并降低成本。然而，我们仍然需要使用
    7-3 比例对物联网设备收集的数据进行更多检查，以进行预测和分析，确保所提系统能够处理 24 小时内的大量数据。


    在本文中，我们首先回顾了 30 篇最新的期刊论文，然后我们使用可穿戴物联网设备收集的 24 小时数据进行评估和分析结果，并使用移动电脑和智能手机上的蓝牙和
    WiFi，然后由智能手机将数据传输到云服务器，并使用应用于部署在云端的机器学习方法来诊断疾病。通过统计分析，我们确认当前所提的研究模型和技术能够实现高达 90%
    的心脏病预测准确率，许多模型甚至可以达到小于 1% 的误差率


