    # 基于物联网技术的机器学习心脏病监测与预测


    Qingyun He*, Angelika Maag*, Amr Elchoui*

    澳大利亚，悉尼，Study Group Australia

    美国，福布斯商业与技术学院


    daisyhe815@gmail.com, maag@studygroup.com, elchoui@ashford.edu


    **— 摘要 —** 现代人类引起的主要疾病是心脏病，这种疾病往往隐藏且无症状，导致了许多死亡。随着医疗行业物联网（IoT）技术的发展，为临床人员提供远程预测和监测心脏病的技术支持是目前最相关的，且需要更多论文来发现该领域的缺点并填补空白。此外，本文已通过使用不同类型的机器学习算法对心脏病进行预测和诊断，比较了所提方法与心脏病监测的最佳框架。从数据集来看，从物联网传感器收集的数据比从其他地方收集的数据更困难，因为物联网数据集中包含更多噪声，且数据值缺失在这一问题中构成了挑战。因此，为了缩小研究差距，找到监测和预测心电图（ECG）信号的最佳方法，同时达到可接受的准确率。


