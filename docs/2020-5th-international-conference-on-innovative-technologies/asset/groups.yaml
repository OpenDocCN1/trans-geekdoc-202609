    **关键词 —** 机器学习、心脏病、物联网 (IoT)、预测与监测。


    ## I. 引言


    如今，机器学习技术已广泛应用于许多领域。例如，使用预训练机器模型来预测心脏领域的信号，心脏病是全球范围内的第一死因，每年有约3500万人死于心脏病 [1]。在物联网和可穿戴设备的发展中，为物联网与医疗行业的融合提供了基础
    [2]。对于成员来说，最重要的是模型是否能够首次预测他们患有心脏病或向他们提供建议。然而，机器学习只能分析数据并预测患者是否患有心脏病。因此，我们需要物联网传感器持续监测心脏信号，主要数据是患者的心电图（ECG）信号
    [3], [4] 以及血压频率 [6]。研究人员可以使用心电图 [7] 和 [8] 作为诊断疾病的重要信号。


    本文主要关注寻找当前研究的空白并提高机器学习的预测准确率。机器学习技术有不同类型的方法。例如，随机森林、k-近邻、决策树、支持向量，


