    ### B. 数据传感器设备


    传感器设备作为物联网上信号采集和通信的终端起着至关重要的作用 [17]。对于心脏预测，主要信号是我们需要收集血压并仅使用2.5分钟的患者心电图记录以达到可接受的准确率。减少时间在整个系统的运行中有了显著改进。


