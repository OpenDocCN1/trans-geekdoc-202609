    *   `Admin Dashboard`: 一个用于管理员管理图书列表、跟踪销售并与用户反馈交互的独立界面。


    ![](img/image-0-3.jpg) 图 1.3 GitforGits 书店应用程序的功能 构建书店应用程序不仅仅是关于最终产品；重要的是过程。以下是你在构建书店
    Web 应用程序过程中将学到的内容：


    *   了解 Go 如何构建 Web 应用程序，从组织文件和文件夹到模块化代码以实现可扩展性。


    *   与数据库交互以存储和检索数据，使用 Go 的数据库包和第三方 ORM。你将掌握 CRUD 操作、迁移和高级查询。


    *   处理用户会话、Cookie，并确保交互过程中的数据持久性。


    *   利用 Go 的模板引擎创建基于数据变化的动态网页。


    *   处理用户输入、验证，并确保数据完整性。


    *   实现中间件以执行日志记录、身份验证和错误处理等任务。了解 HTTP 处理程序在路由请求中的深度。


    *   使用 Go 的并发模型高效处理同时的用户请求。


    *   为应用程序编写测试，调试问题，并确保代码可靠性。


    *   使应用程序上线，了解云托管、容器化，并确保应用程序能够随用户需求进行扩展。


    书店应用程序不仅仅是另一个项目；它是数百万人每天交互的真实世界 Web 应用程序的体现。通过构建它，你不仅理解设计决策、工具选择和架构考量背后的“如何”，还理解其“为什么”。书店应用程序的每个功能都经过精心选择，旨在引入新概念或加深对现有概念的理解。你不是在孤立中学习
    Go Web 开发；你是在更广泛的 Web 开发环境中理解它。


    ## Go RESTful 服务


    可以通过从 REST 的基本原则和 Go 编程语言的独特能力来审视，从而全面理解 Go 中的 RESTful 服务。REST 是由 Dr. Roy Fielding
    提出的一种架构风格，是“Representational State Transfer”的缩写。与标准不同，它是一套用于开发可扩展且易于维护的 Web 服务的指导原则。这些指导原则通常使用
    HTTP 实现。


    ### REST 的关键原则


    REST 方法论基于若干基本原则。它强调无状态性，这意味着客户端发送到服务器的每个请求都必须包含服务器处理所需的所有信息，而不依赖于任何已存储的会话状态。这种方法与
    Go 的设计一致，Go 偏好简单直接。REST 中使用的客户端-服务器架构鼓励关注点分离。客户端负责用户界面和体验，而服务器负责数据以及后端发生的操作。在管理应用程序的各种组件时，这种分离类似于
    Go 采用的模块化方法。可缓存性是另一个原则，它规定 RESTful 响应应明确标记为可缓存或不可缓存。这将提高性能，这也是 Go 由于其编译和高效特性所努力实现的目标。Go
    创建可扩展且可维护系统的能力，让人联想到 REST 中使用的分层系统。在这个系统中，客户端与最终服务器或中间件交互，而无需区分它们。统一接口原则通过使交互可预测和标准化来简化架构。这与
    Go 简单的语法以及其对接口和方法的方法类似。


    ### 使用 Go 实现 RESTful 服务


    其标准库，特别是 `net/http` 包，极大地促进了 RESTful 服务的开发。开发人员通常使用 `http.HandleFunc()` 方法或第三方路由器来定义端点，并将
    GET、POST、PUT 和 DELETE 等 HTTP 方法与这些端点关联。该包使开发人员能够做到这一点。在 REST 中，URI 用于标识资源，Go 强大的
    URL 解析功能对此非常有用。 ![](img/image-0-4.jpg) 图 1.4 在 Go 中实现 RESTful 服务 发送到 Go 服务器的每个请求都应携带所有必要数据，因为
    REST 是一种无状态协议。Go 是需要通信格式灵活性的 RESTful 服务的绝佳选择，因为它能够处理 HTTP 请求和响应，并通过 `encoding/json`
    等包支持 JSON 和 XML。此外，RESTful 服务高度依赖 Go 的错误处理，这使开发人员能够提供有用的错误消息和合适的 HTTP 状态码。Go 的显式错误处理与
    REST 对清晰传达问题的要求非常契合。


    ### Go 在 RESTful 开发中的优势


    Go 具有许多特性，使其成为开发 RESTful 服务的绝佳选择。对于高流量服务，其作为编译语言的性能至关重要。Go 对并发的原生支持使其能够高效地处理多个同时请求，这是
    RESTful 服务中经常出现的场景。标准库的稳健性减少了对外部包的依赖。强类型和对 JSON 的支持是保证 Go 中数据完整性的两个特性。此外，该语言对中间件的支持使日志记录和身份验证等额外功能成为可能。Go
    的 RESTful 服务的安全性至关重要。开发人员可以利用 Go 对 HTTPS 的支持、使用 JSON Web 令牌进行身份验证，以及利用包来防止 CSRF
    等攻击。Go 对输入的清理和验证的方法对于防范 SQL 注入等威胁绝对必要。随着开发人员构建书店应用程序，他们将利用 Go 提供的功能来创建 RESTful
    路由。这将确保书籍不仅被列出，而且根据 Web 服务设计的最有效原则进行交互。


