  trans: "\n\n# 构建我的第一个 Web 服务器\n\n开始开发 Web 服务器（尤其是一款最终将发展成为全面 BookStore 应用程序的服务器）所带来的感觉令人兴奋。起初，重点在于建立基础、理解复杂性，并实现那个“Hello,\
    \ World！”时刻——或者，在我们的例子中，就是“Hello GitforGits BookStore！”\n\n## 初始化项目\n\n每个伟大的应用程序都始于一个结构化的工作区。在深入代码之前，为\
    \ BookStore 项目建立一个目录。使用你的终端或命令行：\n\n```\nmkdir gitforgits-bookstore\ncd gitforgits-bookstore\n\
    ```\n\n接下来，初始化一个 Go 模块来管理依赖项：\n\n```\ngo mod init gitforgits-bookstore\n```\n\n\
    此命令创建一个 `go.mod` 文件，该文件将在我们添加依赖项时列出并管理所有项目依赖项。\n\n## 构建基本服务器\n\n一旦工作区准备就绪，我们将开始构建一个基本服务器。首先，创建一个新文件并将其命名为\
    \ `main.go`。进入项目目录。在这个文件中，将存储服务器的主要逻辑。\n\n在 `main.go` 中，首先导入必要的包：\n\n```go\npackage\
    \ main\n\nimport (\n\t\"fmt\"\n\t\"net/http\"\n)\n```\n\n`net/http` 包提供了构建 HTTP\
    \ 服务器和客户端的功能，而 `fmt` 将用于格式化我们的输出。\n\n现在，定义 `main` 函数并设置服务器：\n\n```go\nfunc main()\
    \ {\n\thttp.HandleFunc(\"/\", homeHandler)\n\thttp.ListenAndServe(\":8080\", nil)\n\
    }\n```\n\n接下来，采取了两个关键步骤：\n\n1. `http.HandleFunc(\"/\", homeHandler)`：此行将根 URL（“/”）映射到名为\
    \ `homeHandler` 的函数，我们将很快定义该函数。\n2. `http.ListenAndServe(\":8080\", nil)`：这指示应用程序在端口\
    \ 8080 上启动 HTTP 服务器。\n\n接下来，我们将定义 `homeHandler` 函数：\n\n```go\nfunc homeHandler(w\
    \ http.ResponseWriter, r *http.Request) {\n\tfmt.Fprintf(w, \"Hello GitforGits\
    \ BookStore!\")\n}\n```\n\n此函数接受两个参数：`http.ResponseWriter` 和 `*http.Request`。`http.ResponseWriter`\
    \ 是一个接口，允许将响应发送回客户端，而 `*http.Request` 提供有关传入请求的信息。\n\n## 运行服务器\n\n要体验第一个服务器的神奇之处，请在终端中导航到项目目录并运行：\n\
    \n```\ngo run main.go\n```\n\n如果一切按计划进行，服务器将开始在端口 8080 上监听。通过在 Web 浏览器中访问 `http://localhost:8080`，问候语“Hello\
    \ GitforGits BookStore!”应该会热情地欢迎你。\n\n尽管这个初始服务器看起来可能很简单，但它将作为构建整个 BookStore 应用程序的基础。目录结构已经建立，基于\
    \ Go 的服务器的基本流程已经理解，我们已经熟悉了处理程序等基本概念。后续章节和部分将深入探讨，介绍动态内容呈现、复杂路由和数据库连接。这些将建立在已经奠定的基础之上。\n\
    \n## 摘要\n\n在本章中，我们开始了为名为“GitforGits BookStore”的项目构建 Go Web 服务器的基本过程。读者了解了创建专用目录和初始化\
    \ Go 模块以实现高效依赖管理的重要性，从建立有组织的工作区开始。这样做是为了确保每个人都在同一页面上。通过迈出这一步，它确保开发环境干净且结构良好，使随着项目的增长，添加依赖项和管理它们的过程更加高效。\n\
    \n通过对代码的检查，本章解释了使用 Go 中的 `net/http` 包建立基本 HTTP 服务器所涉及的基本操作。本章向读者介绍了 `http.HandleFunc`\
    \ 函数，这是一个重要的工具，用于将特定 URL 与相应的处理程序函数链接起来。通过掌握这些基础知识，你正在为项目后期阶段的更复杂路由和请求处理奠定基础。\n\
    \n此外，还介绍了 `http.ListenAndServe` 函数，它举例说明了如何指示 Go 应用程序在特定端口上启动 HTTP 服务器，准备好处理来自客户端的传入请求。通过演示处理程序函数如何管理传入的\
    \ Web 请求并生成适当的响应，本章还强调了处理程序函数及其组织的重要性。`homeHandler` 函数作为如何使用 `http.ResponseWriter`\
    \ 和 `*http.Request` 参数的示例。这些基本元素使开发人员既能向客户端传输数据，也能检索有关传入请求的信息。\n\n读者能够通过执行 `go\
    \ run` 命令运行服务器，并在 Web 浏览器上观察问候语“Hello GitforGits BookStore!”，从而看到他们努力的结果。这使得抽象知识转化为具体成果。\n\
    \n在整个本章中，主要重点放在构建基本服务器上；然而，目标是了解使用 Go 进行 Web 开发的基本原理。在项目开发实践中，所介绍的技能和概念将被回顾、详细阐述，并融入到更复杂的功能中。这将确保学习体验既全面又引人入胜。\n\
    \n# 第 2 章：构建 Go Web 应用程序\n\n## 探索 Go 模块\n\n模块代表了 Go 编程语言依赖管理的下一个进化步骤。在引入模块之前，Go\
    \ 生态系统依赖于 `GOPATH` 工作区，所有源代码及其伴随的依赖项都共存于其中。尽管该结构是功能性的，但在版本控制和项目隔离方面面临困难。\n\nGo\
    \ 模块首次在 Go 1.11 版本中引入，作为解决这些挑战的方案出现。它们彻底改变了依赖项的处理方式，使其更简单、更直观，并且与 `GOPATH` 分离。\n\
    \n## Go 模块的本质\n\n从本质上讲，Go 模块是存储在带有根目录下 `go.mod` 文件的文件树中的 Go 包集合。这个文件是模块的清单，详细说明了其模块路径（即其导入路径前缀）及其依赖项要求。\n\
    \n模块提供了几个引人注目的优势：\n\n* 模块本质上支持版本控制。开发人员可以指定希望使用的依赖项版本，Go 确保在构建过程中始终一致地使用该确切版本。\n\
    * 使用模块，项目是隔离的。单体 `GOPATH` 的时代已经一去不复返。开发人员现在可以处理具有不同依赖项的多个项目而不会发生冲突。\n* 随 `go.mod`\
    \ 文件一起提供的 `go.sum` 文件确保使用的模块正是开发人员所期望的。它包含模块内容的加密校验和，提供了额外的安全性和一致性层。\n* 模块可以位于任何地方，而不仅仅是\
    \ `GOPATH` 或版本控制系统中。它们可以驻留在本地文件系统、网络服务器上，甚至可以通过代理服务器获取。\n\n"
