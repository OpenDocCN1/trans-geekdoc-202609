  fmt: "\n# Error Handling in Go\n\nMistakes can happen in any web app, no matter\
    \ how well-designed or complicated it is. How these apps deal with these kinds\
    \ of surprises greatly influences how users view and interact with them. The 404\
    \ (Not Found) and 500 (Internal Server Error) statuses are two of the most common\
    \ types of errors encountered in web applications. The 404 error typically occurs\
    \ when a user attempts to access a page or resource that does not exist, possibly\
    \ as a result of a mistyped URL or a broken link, whereas the 500 error is a more\
    \ general server-side error indicating that something has gone wrong on the website's\
    \ server. Both of these errors, if not handled correctly, can result in user frustration\
    \ and a loss of user trust. Web developers can significantly improve the user\
    \ experience by addressing these errors in a user-friendly manner, such as through\
    \ custom error pages that maintain the site's look and feel, provide clear and\
    \ helpful information, and offer links to guide users back to active parts of\
    \ the site. These custom error pages not only mitigate the negative impact of\
    \ an error, but also provide an opportunity to reinforce the website's branding\
    \ and potentially even delight users in what would otherwise be a frustrating\
    \ moment. This approach to error handling is critical in maintaining user engagement\
    \ and trust, ensuring that even when things go wrong, the user's experience remains\
    \ positive and seamless.\n\n## 404 Not Found Error\n\nA 404 error occurs when\
    \ a user requests a resource (like a web page or an API endpoint) that the server\
    \ can't locate. For GitforGits Bookstore, this might happen if someone tries accessing\
    \ a book that doesn't exist. Out of the box, `gorilla/mux` offers default error\
    \ responses. However, to provide a tailored experience, you can set a custom 404\
    \ handler.\n\n```go\nfunc CustomNotFoundHandler(w http.ResponseWriter, r *http.Request)\
    \ {\n    w.WriteHeader(http.StatusNotFound)\n    w.Write([]byte(\"Oh no, the book\
    \ you're seeking seems to be in another shelf! Please try searching again or explore\
    \ our vast collection.\"))\n}\n\nr := mux.NewRouter()\nr.NotFoundHandler = http.HandlerFunc(CustomNotFoundHandler)\n\
    ```\n\nIn this configuration, any non-existent route accessed will invoke `CustomNotFoundHandler`,\
    \ giving users a friendly message rather than a stark error.\n\n## 500 Internal\
    \ Server Error\n\nA 500 error suggests something went amiss on the server. While\
    \ reasons vary, from server misconfigurations to application bugs, addressing\
    \ this error with clarity is crucial. For GitforGits, it ensures users aren't\
    \ left in the dark when the application encounters internal hiccups. Handling\
    \ 500 errors gracefully involves catching panics (unhandled errors that cause\
    \ the Go application to crash) and responding with a user-friendly message.\n\n\
    ```go\nfunc InternalServerErrorHandler(w http.ResponseWriter, r *http.Request)\
    \ {\n    if r := recover(); r != nil {\n        w.WriteHeader(http.StatusInternalServerError)\n\
    \        w.Write([]byte(\"Oops! Our store seems to have encountered an issue.\
    \ We're on it. Please revisit in a bit.\"))\n    }\n}\n\nr := mux.NewRouter()\n\
    r.Use(func(h http.Handler) http.Handler {\n    return http.HandlerFunc(func(w\
    \ http.ResponseWriter, r *http.Request) {\n        defer InternalServerErrorHandler(w,\
    \ r)\n        h.ServeHTTP(w, r)\n    })\n})\n```\n\nUsing a middleware, the `InternalServerErrorHandler`\
    \ captures any panics during request processing and serves a tailored error response.\n\
    \nThe distinction between a good and great web application often lies in error\
    \ handling. For GitforGits Bookstore, addressing 404 and 500 errors with grace\
    \ and clarity ensures users always feel valued, even amidst technical glitches.\
    \ Custom error messages infused with the bookstore's personality ensure users\
    \ stay engaged, fostering loyalty.\n\n# Rate Limiting and Request Throttling\n\
    \n## Overview\n\nWeb applications, like the GitforGits Bookstore, must be able\
    \ to handle the huge number of requests that come in every millisecond. This is\
    \ where rate limiting comes in: it's a mechanism that limits the number of requests\
    \ a user or IP can make to a server within a given time frame. Rate limiting ensures\
    \ fair usage, protects against DDoS attacks, and maintains a high quality of service\
    \ for all users by imposing these \"speed limits.\"\n\nRequest throttling is a\
    \ more nuanced technique that is frequently used interchangeably with rate limiting.\
    \ While rate limiting limits the number of requests, throttling regulates the\
    \ rate at which they are made. Consider the GitforGits Bookstore's server to be\
    \ a librarian; if she is bombarded with multiple book queries at once, she will\
    \ become overwhelmed. Throttling ensures that she answers each query methodically,\
    \ ensuring that no question goes unanswered.\n\nFor GitforGits Bookstore, these\
    \ mechanisms are pivotal for several reasons:\n\n* Resource Management: Ensures\
    \ server resources aren't overwhelmed by sudden traffic surges.\n* Security: Curtails\
    \ potential threats by restricting malicious or excessively frequent requests.\n\
    * Fair Usage: Ensures all users have equitable access to the bookstore's resources.\n\
    \n## Rate Limiting for GitforGits Bookstore\n\nOne popular Go middleware for rate\
    \ limiting is `golang.org/x/time/rate`. This package provides token bucket-based\
    \ rate limiting.\n\nInstalling the necessary package:\n\n```bash\ngo get golang.org/x/time/rate\n\
    ```\n\nConsider setting a limit of 5 requests per minute for each user.\n\n```go\n\
    package main\n\nimport (\n    \"golang.org/x/time/rate\"\n    \"net/http\"\n \
    \   \"time\"\n)\n\nvar limiter = rate.NewLimiter(5, 1)\n\nfunc RateLimit(next\
    \ http.Handler) http.Handler {\n    return http.HandlerFunc(func(w http.ResponseWriter,\
    \ r *http.Request) {\n        if !limiter.Allow() {\n            http.Error(w,\
    \ \"Too many requests\", http.StatusTooManyRequests)\n            return\n   \
    \     }\n        next.ServeHTTP(w, r)\n    })\n}\n```\n\nThis middleware can be\
    \ applied globally or to specific routes, ensuring those routes adhere to the\
    \ specified rate limits. For throttling, middleware can be created to introduce\
    \ deliberate delays, ensuring a steady request processing pace.\n\n```go\nfunc\
    \ RequestThrottle(next http.Handler) http.Handler {\n    return http.HandlerFunc(func(w\
    \ http.ResponseWriter, r *http.Request) {\n        time.Sleep(200 * time.Millisecond)\
    \ // Introduce a 200ms delay for every request\n        next.ServeHTTP(w, r)\n\
    \    })\n}\n```\n\nThis approach guarantees the server never gets overwhelmed,\
    \ even during traffic spikes.\n\nIntegrating these mechanisms with `gorilla/mux`\
    \ and the GitforGits Bookstore is straightforward as shown below:\n\n```go\nr\
    \ := mux.NewRouter()\nr.Use(RateLimit, RequestThrottle)\nr.HandleFunc(\"/books\"\
    , BookListHandler)\nr.HandleFunc(\"/book/{id:[0-9]+}\", BookDetailHandler)\n```\n\
    \nOnce these middlewares are added, all bookstore routes will have global rate\
    \ limiting and request throttling.\n\nRequest throttling and rate limiting guard\
    \ the vast web as millions of readers pour into GitforGits Bookstore. They make\
    \ sure the online bookstore's system is stable, quick to respond, and powerful.\n"
  trans: "\n\n# Go 中的错误处理\n\n无论 Web 应用设计得多么精良或复杂，错误都可能发生。应用如何处理这类意外情况，极大地影响用户对其的看法和交互方式。404（未找到）和\
    \ 500（内部服务器错误）状态码是 Web 应用中最常见的两种错误类型。404 错误通常发生在用户尝试访问不存在的页面或资源时，可能是由于 URL 输入错误或链接失效所致；而\
    \ 500 错误则是一种更通用的服务器端错误，表明网站服务器出了问题。如果处理不当，这两种错误都可能导致用户沮丧并丧失对网站的信任。Web 开发者可以通过以用户友好的方式处理这些错误（例如，通过保持网站外观和感觉、提供清晰有用的信息，并提供引导用户返回网站活跃部分的链接的自定义错误页面）来显著改善用户体验。这些自定义错误页面不仅能减轻错误的负面影响，还能提供强化网站品牌的机会，甚至可能在本应令人沮丧的时刻让用户感到愉悦。这种错误处理方法对于保持用户参与度和信任至关重要，确保即使事情出错，用户体验依然积极且顺畅。\n\
    \n## 404 未找到错误\n\n当用户请求服务器无法定位的资源（如网页或 API 端点）时，会发生 404 错误。对于 GitforGits 书店，如果有人尝试访问不存在的书籍，就可能发生这种情况。开箱即用，`gorilla/mux`\
    \ 提供默认错误响应。但是，为了提供定制化体验，你可以设置自定义 404 处理程序。\n\n```go\nfunc CustomNotFoundHandler(w\
    \ http.ResponseWriter, r *http.Request) {\n    w.WriteHeader(http.StatusNotFound)\n\
    \    w.Write([]byte(\"Oh no, the book you're seeking seems to be in another shelf!\
    \ Please try searching again or explore our vast collection.\"))\n}\n\nr := mux.NewRouter()\n\
    r.NotFoundHandler = http.HandlerFunc(CustomNotFoundHandler)\n```\n\n在此配置中，访问任何不存在的路由都会调用\
    \ `CustomNotFoundHandler`，向用户提供友好的消息，而不是生硬的错误。\n\n## 500 内部服务器错误\n\n500 错误表明服务器出了问题。原因各异，从服务器配置错误到应用程序错误不等，但以清晰的方式处理此错误至关重要。对于\
    \ GitforGits，这可以确保当应用程序遇到内部故障时，用户不会被蒙在鼓里。优雅地处理 500 错误涉及捕获 panic（会导致 Go 应用程序崩溃的未处理错误），并以用户友好的消息进行响应。\n\
    \n```go\nfunc InternalServerErrorHandler(w http.ResponseWriter, r *http.Request)\
    \ {\n    if r := recover(); r != nil {\n        w.WriteHeader(http.StatusInternalServerError)\n\
    \        w.Write([]byte(\"Oops! Our store seems to have encountered an issue.\
    \ We're on it. Please revisit in a bit.\"))\n    }\n}\n\nr := mux.NewRouter()\n\
    r.Use(func(h http.Handler) http.Handler {\n    return http.HandlerFunc(func(w\
    \ http.ResponseWriter, r *http.Request) {\n        defer InternalServerErrorHandler(w,\
    \ r)\n        h.ServeHTTP(w, r)\n    })\n})\n```\n\n使用中间件，`InternalServerErrorHandler`\
    \ 在请求处理过程中捕获任何 panic，并提供定制的错误响应。\n\n优秀 Web 应用与卓越 Web 应用的区别往往在于错误处理。对于 GitforGits\
    \ 书店，以优雅和清晰的方式处理 404 和 500 错误，可以确保用户即使在技术故障中也始终感到被重视。融入书店个性的自定义错误消息能确保用户保持参与度，培养忠诚度。\n\
    \n# 速率限制和请求限流\n\n## 概述\n\n像 GitforGits 书店这样的 Web 应用，必须能够处理每毫秒涌入的大量请求。这时就需要速率限制：这是一种机制，用于限制用户或\
    \ IP 在给定时间内可以向服务器发出的请求数量。通过施加这些“速度限制”，速率限制确保公平使用，防止 DDoS 攻击，并为所有用户保持高质量的服务。\n\n\
    请求限流是一种更微妙的技术，常与速率限制混用。虽然速率限制限制请求数量，但限流调节请求发出的速率。可以将 GitforGits 书店的服务器想象成一位图书管理员；如果她一次被多个图书查询淹没，她会不知所措。限流确保她有条不紊地回答每个查询，确保没有问题得不到解答。\n\
    \n对于 GitforGits 书店，这些机制至关重要，原因有以下几点：\n\n* 资源管理：确保服务器资源不会因突发流量激增而不堪重负。\n* 安全性：通过限制恶意或过于频繁的请求来遏制潜在威胁。\n\
    * 公平使用：确保所有用户都能公平地访问书店的资源。\n\n## GitforGits 书店的速率限制\n\n一个流行的 Go 速率限制中间件是 `golang.org/x/time/rate`。该包提供基于令牌桶的速率限制。\n\
    \n安装必要的包：\n\n```bash\ngo get golang.org/x/time/rate\n```\n\n考虑为每个用户设置每分钟 5 次请求的限制。\n\
    \n```go\npackage main\n\nimport (\n    \"golang.org/x/time/rate\"\n    \"net/http\"\
    \n    \"time\"\n)\n\nvar limiter = rate.NewLimiter(5, 1)\n\nfunc RateLimit(next\
    \ http.Handler) http.Handler {\n    return http.HandlerFunc(func(w http.ResponseWriter,\
    \ r *http.Request) {\n        if !limiter.Allow() {\n            http.Error(w,\
    \ \"Too many requests\", http.StatusTooManyRequests)\n            return\n   \
    \     }\n        next.ServeHTTP(w, r)\n    })\n}\n```\n\n此中间件可以全局应用，也可以应用于特定路由，确保这些路由遵守指定的速率限制。对于限流，可以创建中间件引入故意延迟，确保请求处理速度稳定。\n\
    \n```go\nfunc RequestThrottle(next http.Handler) http.Handler {\n    return http.HandlerFunc(func(w\
    \ http.ResponseWriter, r *http.Request) {\n        time.Sleep(200 * time.Millisecond)\
    \ // Introduce a 200ms delay for every request\n        next.ServeHTTP(w, r)\n\
    \    })\n}\n```\n\n这种方法保证服务器永远不会不堪重负，即使在流量高峰期间也是如此。\n\n将这些机制与 `gorilla/mux` 和\
    \ GitforGits 书店集成非常简单，如下所示：\n\n```go\nr := mux.NewRouter()\nr.Use(RateLimit, RequestThrottle)\n\
    r.HandleFunc(\"/books\", BookListHandler)\nr.HandleFunc(\"/book/{id:[0-9]+}\"\
    , BookDetailHandler)\n```\n\n添加这些中间件后，所有书店路由都将具有全局速率限制和请求限流。\n\n当数百万读者涌入 GitforGits\
    \ 书店时，请求限流和速率限制守护着广阔的网络。它们确保在线书店的系统稳定、响应迅速且强大。\n\n"
