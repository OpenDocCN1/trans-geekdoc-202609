- raw: "Performing CRUD Operations Creating Book To usher a new book into the GitforGits\
    \ Bookstore, you'd need an endpoint that supports the creation of book records.\
    \  Using the POST method ensures data submission for a fresh book. func CreateBookHandler(w\
    \ http.ResponseWriter, r \\*http.Request) {     var newBook Book     decoder :=\
    \ json.NewDecoder(r.Body)     err := decoder.Decode(&newBook)     if err != nil\
    \ {         http.Error(w, \"Invalid book data\", http.StatusBadRequest)       \
    \  return     }     BookstoreDB.Create(&newBook)     w.WriteHeader(http.StatusCreated)\
    \     json.NewEncoder(w).Encode(newBook) } Once integrated, posting JSON book\
    \ data to this endpoint would result in a new book record.  Essential fields like\
    \ title, author, and genre can be part of the submitted data. Reading Book Details\
    \ Read operations allow users to fetch details about a book.  It's akin to picking\
    \ a book from a shelf and examining its cover, blurb, and author. func GetBookHandler(w\
    \ http.ResponseWriter, r \\*http.Request) {     vars := mux.Vars(r)     bookID\
    \ := vars\\[\"id\"\\]     var fetchedBook Book     if err := BookstoreDB.First(&fetchedBook,\
    \ bookID).Error; err != nil {         http.Error(w, \"Book not found\", http.StatusNotFound)\
    \         return     }     json.NewEncoder(w).Encode(fetchedBook) } Given a book\
    \ ID, this handler retrieves and displays the respective book's details. Updating\
    \ Book Books might undergo updates, whether it's a revised edition or updated\
    \ metadata.  The PUT method caters to these modifications. func UpdateBookHandler(w\
    \ http.ResponseWriter, r \\*http.Request) {     vars := mux.Vars(r)     bookID\
    \ := vars\\[\"id\"\\]     var updatedBook Book     if err := BookstoreDB.First(&updatedBook,\
    \ bookID).Error; err != nil {         http.Error(w, \"Book not found\", http.StatusNotFound)\
    \         return     }     decoder := json.NewDecoder(r.Body)     err := decoder.Decode(&updatedBook)\
    \     if err != nil {         http.Error(w, \"Invalid data\", http.StatusBadRequest)\
    \         return     }     BookstoreDB.Save(&updatedBook)     w.WriteHeader(http.StatusOK)\
    \     json.NewEncoder(w).Encode(updatedBook) } By submitting updated book data,\
    \ the specified book record undergoes a transformation, mirroring the revised\
    \ details. Deleting Book Whether it's out of stock or removed from listings, books\
    \ sometimes need to be deleted from the store's database. func DeleteBookHandler(w\
    \ http.ResponseWriter, r \\*http.Request) {     vars := mux.Vars(r)     bookID\
    \ := vars\\[\"id\"\\]     var bookToDelete Book     if err := BookstoreDB.First(&bookToDelete,\
    \ bookID).Error; err != nil {         http.Error(w, \"Book not found\", http.StatusNotFound)\
    \         return     }     BookstoreDB.Delete(&bookToDelete)     w.WriteHeader(http.StatusNoContent)\
    \ } Invoking this endpoint with a book ID ensures the respective book's removal\
    \ from the database. Now that these CRUD operations are in place, the digital\
    \ framework of the GitforGits Bookstore becomes very versatile.  These handlers\
    \ direct the lifecycle of each book as readers peruse the virtual aisles, from\
    \ its initial upload to any updates that may be installed and finally removed.\
    \  In reality, these CRUD endpoints are the lifeblood of the bookshop, not just\
    \ lines of code.  They make sure the store is always changing, direct user journeys,\
    \ and dictate interactions. \n\nSummary This chapter went into great detail about\
    \ one of the most important parts of making web apps: handling HTTP requests and\
    \ routing them effectively.  First, we gave an overview of HTTP.  Next, we learned\
    \ about the basic idea behind the request-response model, which is what the World\
    \ Wide Web is built on.  This foundation made it a lot easier to understand the\
    \ beauty and complexity of web interactions, especially in the context of a web-based\
    \ platform like the GitforGits Bookstore. After getting a basic understanding\
    \ of these ideas, we moved on to using handlers and handler functions by putting\
    \ the net/http package into action.  As the handlers for different web requests,\
    \ these entities are very important in Go-based web applications.  In the case\
    \ of the bookstore application, the role of the application is to be a careful\
    \ shopkeeper, carefully taking in customer requests (web requests) and getting\
    \ the right book (web resource) in response.  Routes are also the complicated\
    \ paths that make these interactions possible.  The bookstore was able to handle\
    \ a wide range of book-related queries quickly and easily by using dynamic URL\
    \ parameters. The routing abilities were greatly improved when we used the Gorilla/Mux\
    \ library.  This strong library, which has features like middleware support and\
    \ regex-based route matching, has made it possible to add advanced features to\
    \ web applications.  After that, we learned in depth about rate limiting and request\
    \ throttling, two important tools for making sure servers work at their best and\
    \ resources are used efficiently.  These techniques watch over the GitforGits\
    \ Bookstore, making sure that everyone has equal access and keeping people safe\
    \ from possible dangers. In the end, the chapter ended with an explanation of\
    \ CRUD operations, which are basic parts of any data-based application.  We learned\
    \ how to create, access, change, and delete book records by putting what we learned\
    \ into practice.  This made the GitforGits Bookstore a dynamic and interactive\
    \ platform.  This functional part brought the bookstore back to life and helped\
    \ it grow and change to meet the needs of its customers who were interested in\
    \ literature.  By using the lessons in this chapter, the GitforGits Bookstore's\
    \ digital infrastructure has been improved and made more flexible, which has led\
    \ to great experiences for users. \n\nChapter 4: Templating and Rendering Content "
  fmt: "\n# Performing CRUD Operations\n\n## Creating Book\n\nTo usher a new book\
    \ into the GitforGits Bookstore, you'd need an endpoint that supports the creation\
    \ of book records. Using the `POST` method ensures data submission for a fresh\
    \ book.\n\n```go\nfunc CreateBookHandler(w http.ResponseWriter, r *http.Request)\
    \ {\n    var newBook Book\n    decoder := json.NewDecoder(r.Body)\n    err :=\
    \ decoder.Decode(&newBook)\n    if err != nil {\n        http.Error(w, \"Invalid\
    \ book data\", http.StatusBadRequest)\n        return\n    }\n    BookstoreDB.Create(&newBook)\n\
    \    w.WriteHeader(http.StatusCreated)\n    json.NewEncoder(w).Encode(newBook)\n\
    }\n```\n\nOnce integrated, posting JSON book data to this endpoint would result\
    \ in a new book record. Essential fields like `title`, `author`, and `genre` can\
    \ be part of the submitted data.\n\n## Reading Book Details\n\nRead operations\
    \ allow users to fetch details about a book. It's akin to picking a book from\
    \ a shelf and examining its cover, blurb, and author.\n\n```go\nfunc GetBookHandler(w\
    \ http.ResponseWriter, r *http.Request) {\n    vars := mux.Vars(r)\n    bookID\
    \ := vars[\"id\"]\n    var fetchedBook Book\n    if err := BookstoreDB.First(&fetchedBook,\
    \ bookID).Error; err != nil {\n        http.Error(w, \"Book not found\", http.StatusNotFound)\n\
    \        return\n    }\n    json.NewEncoder(w).Encode(fetchedBook)\n}\n```\n\n\
    Given a book ID, this handler retrieves and displays the respective book's details.\n\
    \n## Updating Book\n\nBooks might undergo updates, whether it's a revised edition\
    \ or updated metadata. The `PUT` method caters to these modifications.\n\n```go\n\
    func UpdateBookHandler(w http.ResponseWriter, r *http.Request) {\n    vars :=\
    \ mux.Vars(r)\n    bookID := vars[\"id\"]\n    var updatedBook Book\n    if err\
    \ := BookstoreDB.First(&updatedBook, bookID).Error; err != nil {\n        http.Error(w,\
    \ \"Book not found\", http.StatusNotFound)\n        return\n    }\n    decoder\
    \ := json.NewDecoder(r.Body)\n    err := decoder.Decode(&updatedBook)\n    if\
    \ err != nil {\n        http.Error(w, \"Invalid data\", http.StatusBadRequest)\n\
    \        return\n    }\n    BookstoreDB.Save(&updatedBook)\n    w.WriteHeader(http.StatusOK)\n\
    \    json.NewEncoder(w).Encode(updatedBook)\n}\n```\n\nBy submitting updated book\
    \ data, the specified book record undergoes a transformation, mirroring the revised\
    \ details.\n\n## Deleting Book\n\nWhether it's out of stock or removed from listings,\
    \ books sometimes need to be deleted from the store's database.\n\n```go\nfunc\
    \ DeleteBookHandler(w http.ResponseWriter, r *http.Request) {\n    vars := mux.Vars(r)\n\
    \    bookID := vars[\"id\"]\n    var bookToDelete Book\n    if err := BookstoreDB.First(&bookToDelete,\
    \ bookID).Error; err != nil {\n        http.Error(w, \"Book not found\", http.StatusNotFound)\n\
    \        return\n    }\n    BookstoreDB.Delete(&bookToDelete)\n    w.WriteHeader(http.StatusNoContent)\n\
    }\n```\n\nInvoking this endpoint with a book ID ensures the respective book's\
    \ removal from the database.\n\nNow that these CRUD operations are in place, the\
    \ digital framework of the GitforGits Bookstore becomes very versatile. These\
    \ handlers direct the lifecycle of each book as readers peruse the virtual aisles,\
    \ from its initial upload to any updates that may be installed and finally removed.\
    \ In reality, these CRUD endpoints are the lifeblood of the bookshop, not just\
    \ lines of code. They make sure the store is always changing, direct user journeys,\
    \ and dictate interactions.\n\n## Summary\n\nThis chapter went into great detail\
    \ about one of the most important parts of making web apps: handling HTTP requests\
    \ and routing them effectively. First, we gave an overview of HTTP. Next, we learned\
    \ about the basic idea behind the request-response model, which is what the World\
    \ Wide Web is built on. This foundation made it a lot easier to understand the\
    \ beauty and complexity of web interactions, especially in the context of a web-based\
    \ platform like the GitforGits Bookstore.\n\nAfter getting a basic understanding\
    \ of these ideas, we moved on to using handlers and handler functions by putting\
    \ the `net/http` package into action. As the handlers for different web requests,\
    \ these entities are very important in Go-based web applications. In the case\
    \ of the bookstore application, the role of the application is to be a careful\
    \ shopkeeper, carefully taking in customer requests (web requests) and getting\
    \ the right book (web resource) in response. Routes are also the complicated paths\
    \ that make these interactions possible. The bookstore was able to handle a wide\
    \ range of book-related queries quickly and easily by using dynamic URL parameters.\n\
    \nThe routing abilities were greatly improved when we used the `Gorilla/Mux` library.\
    \ This strong library, which has features like middleware support and regex-based\
    \ route matching, has made it possible to add advanced features to web applications.\
    \ After that, we learned in depth about rate limiting and request throttling,\
    \ two important tools for making sure servers work at their best and resources\
    \ are used efficiently. These techniques watch over the GitforGits Bookstore,\
    \ making sure that everyone has equal access and keeping people safe from possible\
    \ dangers.\n\nIn the end, the chapter ended with an explanation of CRUD operations,\
    \ which are basic parts of any data-based application. We learned how to create,\
    \ access, change, and delete book records by putting what we learned into practice.\
    \ This made the GitforGits Bookstore a dynamic and interactive platform. This\
    \ functional part brought the bookstore back to life and helped it grow and change\
    \ to meet the needs of its customers who were interested in literature. By using\
    \ the lessons in this chapter, the GitforGits Bookstore's digital infrastructure\
    \ has been improved and made more flexible, which has led to great experiences\
    \ for users.\n\n# Chapter 4: Templating and Rendering Content\n"
  trans: "\n\n# 执行 CRUD 操作\n\n## 创建图书\n\n要将一本新书引入 GitforGits 书店，你需要一个支持创建图书记录的端点。使用\
    \ `POST` 方法可确保提交新图书的数据。\n\n```go\nfunc CreateBookHandler(w http.ResponseWriter,\
    \ r *http.Request) {\n    var newBook Book\n    decoder := json.NewDecoder(r.Body)\n\
    \    err := decoder.Decode(&newBook)\n    if err != nil {\n        http.Error(w,\
    \ \"Invalid book data\", http.StatusBadRequest)\n        return\n    }\n    BookstoreDB.Create(&newBook)\n\
    \    w.WriteHeader(http.StatusCreated)\n    json.NewEncoder(w).Encode(newBook)\n\
    }\n```\n\n集成后，向此端点发布 JSON 图书数据将生成一条新的图书记录。`title`、`author` 和 `genre` 等必要字段可以包含在提交的数据中。\n\
    \n## 读取图书详情\n\n读取操作允许用户获取图书的详细信息。这就像从书架上拿起一本书，查看其封面、简介和作者。\n\n```go\nfunc GetBookHandler(w\
    \ http.ResponseWriter, r *http.Request) {\n    vars := mux.Vars(r)\n    bookID\
    \ := vars[\"id\"]\n    var fetchedBook Book\n    if err := BookstoreDB.First(&fetchedBook,\
    \ bookID).Error; err != nil {\n        http.Error(w, \"Book not found\", http.StatusNotFound)\n\
    \        return\n    }\n    json.NewEncoder(w).Encode(fetchedBook)\n}\n```\n\n\
    给定图书 ID，此处理程序将检索并显示相应图书的详细信息。\n\n## 更新图书\n\n图书可能会进行更新，无论是修订版还是更新的元数据。`PUT` 方法满足这些修改需求。\n\
    \n```go\nfunc UpdateBookHandler(w http.ResponseWriter, r *http.Request) {\n  \
    \  vars := mux.Vars(r)\n    bookID := vars[\"id\"]\n    var updatedBook Book\n\
    \    if err := BookstoreDB.First(&updatedBook, bookID).Error; err != nil {\n \
    \       http.Error(w, \"Book not found\", http.StatusNotFound)\n        return\n\
    \    }\n    decoder := json.NewDecoder(r.Body)\n    err := decoder.Decode(&updatedBook)\n\
    \    if err != nil {\n        http.Error(w, \"Invalid data\", http.StatusBadRequest)\n\
    \        return\n    }\n    BookstoreDB.Save(&updatedBook)\n    w.WriteHeader(http.StatusOK)\n\
    \    json.NewEncoder(w).Encode(updatedBook)\n}\n```\n\n通过提交更新的图书数据，指定的图书记录将发生转变，反映修订后的详细信息。\n\
    \n## 删除图书\n\n无论是缺货还是从列表中移除，图书有时需要从商店数据库中删除。\n\n```go\nfunc DeleteBookHandler(w\
    \ http.ResponseWriter, r *http.Request) {\n    vars := mux.Vars(r)\n    bookID\
    \ := vars[\"id\"]\n    var bookToDelete Book\n    if err := BookstoreDB.First(&bookToDelete,\
    \ bookID).Error; err != nil {\n        http.Error(w, \"Book not found\", http.StatusNotFound)\n\
    \        return\n    }\n    BookstoreDB.Delete(&bookToDelete)\n    w.WriteHeader(http.StatusNoContent)\n\
    }\n```\n\n使用图书 ID 调用此端点可确保相应图书从数据库中删除。\n\n现在这些 CRUD 操作已就位，GitforGits 书店的数字框架变得非常灵活。这些处理程序引导每本书的生命周期，随着读者浏览虚拟过道，从最初上传到可能安装的任何更新，最后到移除。实际上，这些\
    \ CRUD 端点是书店的生命线，而不仅仅是几行代码。它们确保商店始终在变化，引导用户旅程，并决定交互方式。\n\n## 摘要\n\n本章详细介绍了构建 Web\
    \ 应用程序最重要的部分之一：处理 HTTP 请求并有效地对其进行路由。首先，我们概述了 HTTP。接下来，我们了解了请求-响应模型的基本理念，这是万维网的基础。这一基础使得理解\
    \ Web 交互的美妙与复杂性变得容易得多，尤其是在像 GitforGits 书店这样的基于 Web 的平台上。\n\n在对这些概念有了基本了解之后，我们继续使用\
    \ `net/http` 包来使用处理程序和处理程序函数。作为不同 Web 请求的处理程序，这些实体在基于 Go 的 Web 应用程序中非常重要。在书店应用程序中，应用程序的角色是一位细心的店主，仔细接收客户请求（Web\
    \ 请求）并返回正确的图书（Web 资源）。路由也是使这些交互成为可能的复杂路径。书店能够通过使用动态 URL 参数快速而轻松地处理各种图书相关查询。\n\n\
    当我们使用 `Gorilla/Mux` 库时，路由能力得到了极大的提升。这个功能强大的库（具有中间件支持和基于正则表达式的路由匹配等功能）使得在 Web 应用程序中添加高级功能成为可能。之后，我们深入学习了速率限制和请求限流，这两个重要工具可确保服务器发挥最佳性能并高效利用资源。这些技术守护着\
    \ GitforGits 书店，确保每个人都能平等访问，并保护人们免受潜在威胁。\n\n最后，本章以对 CRUD 操作的解释结束，CRUD 操作是任何数据驱动型应用程序的基本组成部分。我们学习了如何通过实践所学知识来创建、访问、更改和删除图书记录。这使\
    \ GitforGits 书店成为一个动态且交互式的平台。这一功能部分让书店重获生机，并帮助其成长和变化，以满足对文学感兴趣的客户的需求。通过使用本章的经验，GitforGits\
    \ 书店的数字基础设施得到了改进，变得更加灵活，从而为用户带来了出色的体验。\n\n# 第 4 章：模板和渲染内容\n\n"
