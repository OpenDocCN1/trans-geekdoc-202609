    # 过渡到模块


    在 Go 中引入模块标志着从传统的 GOPATH 工作流程发生重大转变，提供了一种更加简化和直观的依赖管理方法。这种转变对于希望现代化工作流程、简化包管理并提高构建可重复性的开发人员尤其有利。


    对于开始新项目的开发人员来说，采用模块非常简单。启动新模块从一个简单的命令开始：`go mod init <module-name>`。此命令在项目目录中创建一个新的
    `go.mod` 文件。该文件是模块的关键，因为它跟踪项目的依赖项。`<module-name>` 通常是将发布模块的仓库位置，但对于内部或未发布的模块可以是任何字符串。


    过渡到模块不仅限于新项目。现有代码库也可以以最小的摩擦适应这种新系统。当在不包含 `go.mod` 文件且位于 GOPATH 之外的项目中执行 `go build`
    或 `go test` 等 Go 工具时，Go 会自动开始迁移过程。这种自动化迁移是一项基石功能，旨在减少传统上与依赖管理相关的复杂性。在此迁移期间，Go
    分析现有代码和依赖项，创建 `go.mod` 文件以及 `go.sum` 文件。`go.sum` 文件在确保依赖项的完整性方面起着至关重要的作用，通过存储其预期的加密校验和。


    # 使用模块进行依赖管理


    应用程序的开发在很大程度上依赖于有效的依赖管理，而 Go 模块（Go Modules）作为内置的依赖管理工具，正是在这方面大放异彩。Go 模块提供了一种简化且直观的方法来管理项目依赖项，这对于应用程序的开发至关重要。Go
    项目使用模块添加新依赖项的过程如此简单，这充分体现了 Go 对简单性和效率的承诺。


    当开发人员导入项目中尚未包含的包时，构建命令（`go build` 或 `go test`）会导致 Go 自动查找、下载并将该依赖项添加到 `go.mod`
    文件中。这发生在执行构建命令时。之后，该文件充当清单，提供项目中使用的每个依赖项的特定版本的信息。这种自动添加有助于减少所需的手动监督量，并保证所有必要的依赖项都明确声明。


    在开发人员需要获取特定版本模块的场景中，`go get` 命令变得不可或缺：`go get <module-path>@<version>`。此命令允许对所使用的依赖项版本进行精确控制。例如，如果已知某个特定版本的库与项目配合使用效果最好，则可以明确指定。此命令更新
    `go.mod` 文件以反映指定的版本，确保不同开发环境之间的一致性。


    ## go mod tidy


    这个强大的命令会清理 `go.mod` 及其伴随的 `go.sum` 文件，后者为每个依赖项维护一个校验和。它删除项目中不再使用的依赖项的引用，使 `go.mod`
    文件真实反映项目的当前状态。


    # 了解模块代理


    模块代理在 Go 中的主要功能是充当 Go 项目和源仓库之间的中介。这一角色由模块代理执行。如果 Go 项目请求一个模块，代理将从其源（可能是 GitHub
    等网站）检索并存储该模块。对同一模块的后续请求将从代理的缓存中提供，这大大减少了检索模块所需的时间。


    使用模块代理可以加快模块检索速度，这是使用此类代理的最显著优势之一。由于模块被缓存，因此无需在各种项目或构建中反复下载同一模块，从而减少了构建过程所需的时间。对于
    GitforGits Bookstore 等大型项目（可能涉及多个依赖项）来说，这一点尤其有用。


    使用模块代理的另一个显著优势是增强了可靠性。Go 项目通常将其依赖项托管在互联网各处的各种源代码控制系统上。为了提供稳定性和连续性，模块代理确保即使原始源被删除或不可用，缓存的版本仍然可访问。


    对于在 GitforGits Bookstore 等 Go 项目上工作的开发人员来说，理解和利用模块代理的强大功能是高效且安全的软件开发的关键方面。在现代
    Go 开发工作流程中，模块代理是必须使用的基本工具，无论是使用默认的 Go 代理还是建立自定义代理。


    # 标准 Go 目录结构


    与许多其他编程语言不同，Go 不严格强制特定的目录结构。另一方面，多年来，社区已就许多惯例达成共识，这些惯例提高了代码的可读性，使工具更易于使用，并简化了维护。


    在引入模块之前，GOPATH 工作区（存储所有 Go 项目的目录）是 Go 开发人员的主要资源。该工作区有三个主要子目录：`src` 包含源文件；`pkg`
    包含包对象；`bin` 包含编译后的二进制文件。之后，各个项目将存储在以其域名命名的目录中，这些目录位于 `src` 目录内。例如：`src/github.com/gitforgits/bookstore`。


    使用模块后，GOPATH 工作区变得不那么严格，这是一项重大改进。项目可以位于 GOPATH 之外，目录结构变得更加灵活。尽管如此，仍有一些惯例继续存在：


    * `Cmd` 目录：包含应用程序命令。每个应用程序都应位于以其名称命名的目录中，并且每个应用程序目录应有一个主文件。

    * `Pkg` 目录：存放项目中多个应用程序使用但不对外公开的库和包。

    * `Api` 目录：用于 API 定义和协议文件。

    * `Web` 或 `Ui` 目录：包含 Web 资源、模板和前端相关内容。

    * `Scripts` 目录：存放用于各种目的（如构建或部署）的脚本。


    # 设计目录结构


    以组织良好的目录结构开始，是开发 GitforGits Bookstore 等全面应用程序的重要步骤。这种结构不仅有助于更好地管理和理解代码，还符合 Go
    的最佳实践，使任何开发人员都能更轻松地浏览项目并为其做出贡献。


    ## 根目录要点


    GitforGits Bookstore 的根目录将托管几个关键文件：


    * `README.md`：提供项目文档和概述。

