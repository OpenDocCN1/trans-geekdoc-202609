    go get `github.com/pilu/fresh` When you use these packages in your code and build
    your application, they will be automatically added to the `go.mod` file. This
    is something you should keep in mind when working with Go Modules.


    ## IDE 和代码编辑器


    考虑使用专为 Go 设计的集成开发环境（IDE）或文本编辑器，以提升编码体验的质量。首选选项包括：


    1. 安装 Go 扩展后，Visual Studio Code（`VS Code`）提供了全面的 Go 开发体验。该扩展包含代码导航、IntelliSense
    和调试等功能。

    2. 作为专用的 Go 集成开发环境（`IDE`），JetBrains 的 `GoLand` 提供了强大的编码、测试和调试功能。


    要设置 VS Code，请从 [官方网站](https://code.visualstudio.com/Download) 下载 `.deb` 或 `.rpm`
    包并安装。启动 VS Code 后，搜索由 Google 开发的 Go 扩展并安装。


    安装好 Go、配置好工作区、下载好必要的库并安装好代码编辑器后，你就可以深入使用 Go 进行 Web 开发了。Linux 环境特别适合 Go 开发，因为它既提供了灵活性，又具备强大的功能。这里提到的工具和库只是冰山一角。尽管初始设置可能看起来很繁琐，但这实际上是一次性的努力，为顺利且高效的编码之旅铺平了道路。


    ## net/http 包


    ### net/http 概述


    Go 的 `net/http` 包是其 Web 开发能力的核心。作为标准库的一部分，该包提供了大量功能，从设置服务器和处理 HTTP 请求的基础知识，到 Cookie、重定向和文件上传等更复杂的方面。`net/http`
    的真正魅力在于其简洁性，它抽象了 HTTP 协议的复杂性，同时允许开发者专注于应用程序逻辑。


    ![](img/image-0-2.jpg)

    图 1.2 net/http 包概览


    ### HTTP 服务器和客户端


    `net/http` 既能充当 HTTP 客户端，又能设置 HTTP 服务器，这是该编程语言的核心能力。使用 `ListenAndServe` 函数，开发者可以快速启动服务器。该函数开始监听特定端口上的传入
    HTTP 请求。在服务器配置方面，Go 最显著的特点之一是其易用性，这使得快速开发和部署成为可能。


    为了便于向 Web 上的其他服务器发出外出请求，该包为开发者提供了 `Get` 和 `Post` 等函数，这些函数在应用程序的客户端可用。Go 致力于提供全面的
    Web 开发体验，这一点体现在它将客户端和服务器功能整合到一个包中。


    ### 处理程序和 HandlerFuncs


    理解处理程序是使用 `net/http` 软件的重要组成部分。在 Go 中，处理程序是任何遵循 `http.Handler` 接口的对象。该接口要求一个签名为
    `ServeHTTP(http.ResponseWriter, *http.Request)` 的方法。Go 的处理程序必须具有此签名。得益于这种设计，开发者可以创建针对其应用程序特定需求定制的自定义处理程序，这允许极大的灵活性。


    `*http.Request` 类负责封装有关传入请求的所有信息，而 `http.ResponseWriter` 类在将响应发送回客户端的过程中起着重要作用。Go
    编程语言提供了一个名为 `http.HandlerFunc` 的便捷适配器，它使常规函数能够充当 HTTP 处理程序。这简化了实现处理程序的过程，使体验更加流畅。


    ### 路由请求


    虽然基本服务器创建很简单，但现实世界中的应用程序通常需要复杂的路由机制。尽管 `net/http` 不提供类似某些第三方包的广泛路由器，但它提供了一个名为
    `http.ServeMux` 的多路复用器。该多路复用器可以根据 URL 模式将请求路由到特定的处理程序。对于具有动态 URL 模式的复杂应用程序，开发者通常会转向
    Gorilla Mux 等第三方路由器。但是，对于更简单的应用程序，`http.ServeMux` 就足够了。


    ### 数据请求和响应


    与传入请求进行深度交互并构建响应构成了 Web 开发的重要部分。`net/http` 包为此提供了全面的工具。例如，`http.Request` 类型包含用于解析查询参数、提取表单数据和读取请求正文的方法。在响应方面，`http.ResponseWriter`
    便于设置标头、写入响应数据和配置状态代码。


    ### 使用 net/http


    现在，将重点转向将 `net/http` 集成到开发环境中。由于 `net/http` 是 Go 标准库的一部分，不需要像第三方包那样进行单独的安装过程。一旦在机器上设置好
    Go，`net/http` 包即可使用。


    要在 Go 应用程序中使用它：


    * 在 Go 文件开头添加导入语句：`import "net/http"`。

    * 导入后，您可以利用 `net/http` 包中的任何功能。无论是使用 `http.ListenAndServe` 启动服务器，还是使用 `http.Get`
    构建 HTTP 客户端请求。

    * 深入研究官方 Go 网站上提供的丰富文档，或直接通过 `godoc` 命令访问。这将提供关于 `net/http` 提供的众多功能的见解。


    Go 中的 `net/http` 包不仅仅是一个库；相反，它是使用 Go 编程语言开发复杂 Web 应用程序的门户。由于其对简洁性和功能性的强调，它使开发者能够构建和管理
    Web 服务器，灵活地处理请求和响应，并创建可以容纳简单和复杂应用程序要求的路由机制。因此，它体现了 Go 使强大的 Web 开发变得可访问和可管理的哲学，这也是
    Go 越来越成为 Web 开发的热门选择的原因之一。


    ## 介绍书店 Web 应用程序


    书籍的世界广阔无垠，涵盖了数千年的人类知识和创造力。在这个数字时代，获取书籍已从实体访问转变为在线搜索和购买。我们的项目“书店 Web 应用程序”旨在反映这种数字化转型。该应用程序将作为一个在线平台，用户可以在其中浏览、搜索、评论和购买书籍。虽然它可能看起来只是另一个
    Web 应用程序，但从零开始构建它将让您沉浸在大量围绕 Go 编程语言的 Web 开发概念、工具和最佳实践中。


    我们的书店应用程序不会仅仅是一个静态网站。它将是交互式的、动态的且以用户为中心。一些核心功能将包括：


    * 用户身份验证：用户将注册、登录并维护个人资料，确保个性化体验。

    * 书籍列表：一个广泛的目录，显示带有封面图片、描述、作者和定价的书籍。

    * 搜索和过滤：一个强大的搜索机制来定位特定书籍，并辅以类型、作者和评分等过滤器。

    * 购物车：用户可以将书籍添加到购物车，查看购物车内容，并继续购买。

    * 评论和评分：购买后，用户可以留下评论和评分，培育社区驱动的推荐系统。


    '
