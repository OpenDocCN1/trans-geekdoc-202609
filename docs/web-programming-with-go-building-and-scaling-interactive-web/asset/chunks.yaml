- raw: 'Parallelism vs.  Concurrency Unveiling Parallelism The need to do more with
    less time is fundamental to contemporary computational systems.  Taking advantage
    of the multi-core architectures found in modern CPUs, parallelism allows for the
    simultaneous execution of multiple tasks or processes.  Each lane on a multi-lane
    highway stands in for a core, and the cars zipping along them stand in for processes
    running in parallel.  In contrast, on a single-lane road, vehicles will have to
    wait in line and, no matter how fast they go, will not be able to match the throughput
    of a multi-lane highway. Contrarily to parallelism, which emphasizes doing many
    things simultaneously, concurrency emphasizes managing many things simultaneously.  Simultaneous
    execution is not always implied by concurrency.  Rather, it is concerned with
    the non-blocking coordination of individual jobs.  To continue with our road analogy,
    concurrency would be like a single lane of traffic where vehicles are continuously
    entering and exiting, moving forward and stopping at signals, but constantly checking
    to make sure there are no delays. Think about two possible situations.  One is
    that the store experiences an influx of thousands of users during a flash sale.  Not
    all of these requests need to be processed at once, but the system should handle
    them all so no user has to wait too long.  In this context, concurrency really
    excels.  A seamless user experience is guaranteed by the efficient management
    of each request, which is a Goroutine. Now the second situation is that the bookshop
    decides to make book recommendations after looking at each customer''s 100 most
    recent purchases.  If done sequentially, analyzing these purchases for thousands
    of users would take a lot of time.  But if the system splits the work among numerous
    CPU cores and runs them all at once, the job finishes a lot quicker.  Right here
    we see parallelism at work. Sample Program: Book Recommendation Function To illustrate,
    we shall consider a book recommendation function: func analyzePurchases(user User)
    \[\]BookRecommendations {     // Code to analyze user’s purchases and return recommendations
    } Using concurrency (with Goroutines) for managing many user requests: users :=
    fetchUsers() for \_, user := range users {     go analyzePurchases(user) // Goroutines
    handle multiple users concurrently } But, for true parallelism, one might use
    Go''s parallelism feature in testing: import "testing" func BenchmarkRecommendations(b
    \*testing.B) {     users := fetchSampleUsersForBenchmarking()     b.RunParallel(func(pb
    \*testing.PB) {         for pb.Next() {             for \_, user := range users
    {                 analyzePurchases(user) // Run in parallel across multiple cores   
             }         }     }) } While both parallelism and concurrency aim to optimize
    the system''s performance, their approach and use-cases can differ. Do''s and
    Don''ts Do Understand Concurrency vs Parallelism Start by understanding the distinction
    between concurrency and parallelism.  While they are often used interchangeably,
    they address different aspects of computation.  As we previously learned, concurrency
    is about managing multiple tasks at once—it doesn''t necessarily mean things happen
    at the same time.  Parallelism, however, is about doing multiple things at the
    same time, leveraging multiple CPU cores.  In the context of GitforGits, concurrency
    will primarily help handle user requests efficiently.  While parallelism can speed
    up heavy computational tasks, the bookstore''s primary challenge is handling numerous
    user interactions, making concurrency the tool of choice. Don''t Neglect Data
    Races A common pitfall in concurrent programming is the data race, where two goroutines
    access the same variable concurrently, and at least one of the accesses is a write.  This
    can lead to unpredictable results and hard-to-diagnose bugs.  When multiple parts
    of your application, say different goroutines, try to read and write to shared
    resources, ensure synchronization mechanisms like sync.Mutex are in place to prevent
    simultaneous access. Do Use Goroutines Sparingly Goroutines are lightweight and
    efficient, but that doesn''t mean they should be spawned recklessly.  Every goroutine
    consumes resources.  If GitforGits were to start a new goroutine for every minor
    task, it could lead to resource exhaustion.  It''s essential to strike a balance.  Use
    goroutines for tasks that genuinely benefit from concurrent execution, like handling
    independent user requests or performing non-blocking operations. Don''t Forget
    to Handle Goroutine Panics In Go, a panic is a runtime error.  If unhandled, a
    panic in a goroutine can bring down the entire application.  Implementing defer-recover
    mechanisms can help catch and handle panics, ensuring that even if one goroutine
    encounters an issue, the entire application remains stable.  In the bookstore
    context, if a goroutine handling a user request encounters a problem, it shouldn''t
    affect other users'' experiences. Do Limit the Number of Goroutines While goroutines
    are lightweight, there''s still overhead.  Spawning thousands or millions without
    control could lead to performance issues or even crash the system.  Using tools
    like buffered channels or worker pools can help control the number of concurrently
    executing goroutines.  For GitforGits, this might mean limiting the number of
    simultaneous book searches or user logins, ensuring the system remains responsive
    even under heavy load. Don''t Ignore Proper Shutdown Procedures When the application
    needs to shut down, perhaps for an update or due to some issue, it should do so
    gracefully.  This means ensuring all running goroutines have completed their tasks.  By
    implementing a graceful shutdown procedure, you ensure that no user requests are
    abruptly terminated, providing a smooth user experience. Do Always Test Concurrency
    It''s easy to introduce errors when dealing with concurrency.  Therefore, always
    test concurrent parts of the application rigorously.  Using Go''s in-built testing
    tools can help simulate different scenarios and ensure the system behaves as expected.  For
    GitforGits, this could involve simulating numerous simultaneous book purchases
    or user registrations, ensuring the system can handle the load without errors.
    Concurrency, when used judiciously, can significantly enhance the performance
    of GitforGits Bookstore.  However, with its power comes responsibility.  Adhering
    to these do''s and don''ts can ensure that the system is both efficient and robust,
    offering users a seamless and speedy experience. '
  fmt: "\n# Parallelism vs. Concurrency\n\n## Unveiling Parallelism\n\nThe need to\
    \ do more with less time is fundamental to contemporary computational systems.\
    \ Taking advantage of the multi-core architectures found in modern CPUs, parallelism\
    \ allows for the simultaneous execution of multiple tasks or processes. Each lane\
    \ on a multi-lane highway stands in for a core, and the cars zipping along them\
    \ stand in for processes running in parallel. In contrast, on a single-lane road,\
    \ vehicles will have to wait in line and, no matter how fast they go, will not\
    \ be able to match the throughput of a multi-lane highway.\n\nContrarily to parallelism,\
    \ which emphasizes doing many things simultaneously, concurrency emphasizes managing\
    \ many things simultaneously. Simultaneous execution is not always implied by\
    \ concurrency. Rather, it is concerned with the non-blocking coordination of individual\
    \ jobs. To continue with our road analogy, concurrency would be like a single\
    \ lane of traffic where vehicles are continuously entering and exiting, moving\
    \ forward and stopping at signals, but constantly checking to make sure there\
    \ are no delays.\n\nThink about two possible situations. One is that the store\
    \ experiences an influx of thousands of users during a flash sale. Not all of\
    \ these requests need to be processed at once, but the system should handle them\
    \ all so no user has to wait too long. In this context, concurrency really excels.\
    \ A seamless user experience is guaranteed by the efficient management of each\
    \ request, which is a `Goroutine`.\n\nNow the second situation is that the bookshop\
    \ decides to make book recommendations after looking at each customer's 100 most\
    \ recent purchases. If done sequentially, analyzing these purchases for thousands\
    \ of users would take a lot of time. But if the system splits the work among numerous\
    \ CPU cores and runs them all at once, the job finishes a lot quicker. Right here\
    \ we see parallelism at work.\n\n## Sample Program: Book Recommendation Function\n\
    \nTo illustrate, we shall consider a book recommendation function:\n\n```go\n\
    func analyzePurchases(user User) []BookRecommendations {\n    // Code to analyze\
    \ user’s purchases and return recommendations\n}\n```\n\nUsing concurrency (with\
    \ Goroutines) for managing many user requests:\n\n```go\nusers := fetchUsers()\n\
    for _, user := range users {\n    go analyzePurchases(user) // Goroutines handle\
    \ multiple users concurrently\n}\n```\n\nBut, for true parallelism, one might\
    \ use Go's parallelism feature in testing:\n\n```go\nimport \"testing\"\n\nfunc\
    \ BenchmarkRecommendations(b *testing.B) {\n    users := fetchSampleUsersForBenchmarking()\n\
    \    b.RunParallel(func(pb *testing.PB) {\n        for pb.Next() {\n         \
    \   for _, user := range users {\n                analyzePurchases(user) // Run\
    \ in parallel across multiple cores\n            }\n        }\n    })\n}\n```\n\
    \nWhile both parallelism and concurrency aim to optimize the system's performance,\
    \ their approach and use-cases can differ.\n\n## Do's and Don'ts\n\n### Do Understand\
    \ Concurrency vs Parallelism\n\nStart by understanding the distinction between\
    \ concurrency and parallelism. While they are often used interchangeably, they\
    \ address different aspects of computation. As we previously learned, concurrency\
    \ is about managing multiple tasks at once—it doesn't necessarily mean things\
    \ happen at the same time. Parallelism, however, is about doing multiple things\
    \ at the same time, leveraging multiple CPU cores. In the context of GitforGits,\
    \ concurrency will primarily help handle user requests efficiently. While parallelism\
    \ can speed up heavy computational tasks, the bookstore's primary challenge is\
    \ handling numerous user interactions, making concurrency the tool of choice.\n\
    \n### Don't Neglect Data Races\n\nA common pitfall in concurrent programming is\
    \ the data race, where two goroutines access the same variable concurrently, and\
    \ at least one of the accesses is a write. This can lead to unpredictable results\
    \ and hard-to-diagnose bugs. When multiple parts of your application, say different\
    \ goroutines, try to read and write to shared resources, ensure synchronization\
    \ mechanisms like `sync.Mutex` are in place to prevent simultaneous access.\n\n\
    ### Do Use Goroutines Sparingly\n\nGoroutines are lightweight and efficient, but\
    \ that doesn't mean they should be spawned recklessly. Every goroutine consumes\
    \ resources. If GitforGits were to start a new goroutine for every minor task,\
    \ it could lead to resource exhaustion. It's essential to strike a balance. Use\
    \ goroutines for tasks that genuinely benefit from concurrent execution, like\
    \ handling independent user requests or performing non-blocking operations.\n\n\
    ### Don't Forget to Handle Goroutine Panics\n\nIn Go, a panic is a runtime error.\
    \ If unhandled, a panic in a goroutine can bring down the entire application.\
    \ Implementing defer-recover mechanisms can help catch and handle panics, ensuring\
    \ that even if one goroutine encounters an issue, the entire application remains\
    \ stable. In the bookstore context, if a goroutine handling a user request encounters\
    \ a problem, it shouldn't affect other users' experiences.\n\n### Do Limit the\
    \ Number of Goroutines\n\nWhile goroutines are lightweight, there's still overhead.\
    \ Spawning thousands or millions without control could lead to performance issues\
    \ or even crash the system. Using tools like buffered channels or worker pools\
    \ can help control the number of concurrently executing goroutines. For GitforGits,\
    \ this might mean limiting the number of simultaneous book searches or user logins,\
    \ ensuring the system remains responsive even under heavy load.\n\n### Don't Ignore\
    \ Proper Shutdown Procedures\n\nWhen the application needs to shut down, perhaps\
    \ for an update or due to some issue, it should do so gracefully. This means ensuring\
    \ all running goroutines have completed their tasks. By implementing a graceful\
    \ shutdown procedure, you ensure that no user requests are abruptly terminated,\
    \ providing a smooth user experience.\n\n### Do Always Test Concurrency\n\nIt's\
    \ easy to introduce errors when dealing with concurrency. Therefore, always test\
    \ concurrent parts of the application rigorously. Using Go's in-built testing\
    \ tools can help simulate different scenarios and ensure the system behaves as\
    \ expected. For GitforGits, this could involve simulating numerous simultaneous\
    \ book purchases or user registrations, ensuring the system can handle the load\
    \ without errors.\n\nConcurrency, when used judiciously, can significantly enhance\
    \ the performance of GitforGits Bookstore. However, with its power comes responsibility.\
    \ Adhering to these do's and don'ts can ensure that the system is both efficient\
    \ and robust, offering users a seamless and speedy experience.\n"
  trans: "\n\n# 并行性与并发性\n\n## 揭秘并行性\n\n在更短时间内完成更多工作是当代计算系统的基本需求。利用现代 CPU 中常见的多核架构，并行性允许同时执行多个任务或进程。多车道高速公路上的每条车道代表一个核心，疾驰在其上的汽车代表并行运行的进程。相比之下，在单车道路上，车辆必须排队等待，无论行驶速度多快，都无法达到多车道高速公路的吞吐量。\n\
    \n与强调同时做许多事情的并行性不同，并发性强调同时管理许多事情。并发性并不总是意味着同时执行。相反，它关注的是单个任务的非阻塞协调。继续用道路类比，并发性就像单车道交通，车辆不断进出，向前行驶并在信号灯处停车，但始终检查以确保没有延误。\n\
    \n考虑两种可能的情况。一种是商店在闪购期间涌入数千名用户。并非所有这些请求都需要一次性处理，但系统应该处理所有请求，以免任何用户等待太久。在这种情况下，并发性表现出色。对每个请求的高效管理保证了无缝的用户体验，每个请求都是一个\
    \ `Goroutine`。\n\n第二种情况是，书店决定在查看每位客户最近 100 次购买记录后进行图书推荐。如果按顺序进行，为数千名用户分析这些购买记录将花费大量时间。但如果系统将工作分配给多个\
    \ CPU 核心并同时运行，工作将快得多完成。在这里，我们看到了并行性的作用。\n\n## 示例程序：图书推荐功能\n\n为了说明，我们将考虑一个图书推荐函数：\n\
    \n```go\nfunc analyzePurchases(user User) []BookRecommendations {\n    // Code\
    \ to analyze user’s purchases and return recommendations\n}\n```\n\n使用并发（带 Goroutines）来管理许多用户请求：\n\
    \n```go\nusers := fetchUsers()\nfor _, user := range users {\n    go analyzePurchases(user)\
    \ // Goroutines handle multiple users concurrently\n}\n```\n\n但是，为了实现真正的并行性，可以使用\
    \ Go 的测试并行性功能：\n\n```go\nimport \"testing\"\n\nfunc BenchmarkRecommendations(b\
    \ *testing.B) {\n    users := fetchSampleUsersForBenchmarking()\n    b.RunParallel(func(pb\
    \ *testing.PB) {\n        for pb.Next() {\n            for _, user := range users\
    \ {\n                analyzePurchases(user) // Run in parallel across multiple\
    \ cores\n            }\n        }\n    })\n}\n```\n\n虽然并行性和并发性都旨在优化系统性能，但其方法和用例可能有所不同。\n\
    \n## 做与不做\n\n### 了解并发与并行性的区别\n\n首先了解并发和并行性的区别。虽然它们经常被混用，但它们解决的是计算的不同方面。如前所述，并发是关于同时管理多个任务——这不一定意味着事情同时发生。然而，并行性是关于同时做多件事，利用多个\
    \ CPU 核心。在 GitforGits 的上下文中，并发将主要帮助高效处理用户请求。虽然并行性可以加速重型计算任务，但书店的主要挑战是处理大量用户交互，因此并发是首选工具。\n\
    \n### 不要忽视数据竞争\n\n并发编程中常见的陷阱是数据竞争，即两个 goroutine 同时访问同一个变量，并且至少有一次访问是写操作。这可能导致不可预测的结果和难以诊断的错误。当应用程序的多个部分（例如不同的\
    \ goroutine）尝试读取和写入共享资源时，请确保使用 `sync.Mutex` 等同步机制来防止同时访问。\n\n### 适度使用 Goroutines\n\
    \nGoroutine 轻量且高效，但这并不意味着应该随意创建。每个 goroutine 都会消耗资源。如果 GitforGits 为每个微小任务都启动一个新\
    \ goroutine，可能会导致资源耗尽。必须取得平衡。对真正受益于并发执行的任务使用 goroutine，例如处理独立的用户请求或执行非阻塞操作。\n\n\
    ### 不要忘记处理 Goroutine Panic\n\n在 Go 中，panic 是运行时错误。如果未处理，goroutine 中的 panic 可能会使整个应用程序崩溃。实现\
    \ defer-recover 机制可以帮助捕获和处理 panic，确保即使一个 goroutine 遇到问题，整个应用程序仍然保持稳定。在书店场景中，如果处理用户请求的\
    \ goroutine 遇到问题，不应影响其他用户的体验。\n\n### 限制 Goroutine 的数量\n\n虽然 goroutine 轻量，但仍有开销。不加控制地创建成千上万甚至数百万个\
    \ goroutine 可能会导致性能问题，甚至使系统崩溃。使用带缓冲的通道或工作池等工具可以帮助控制并发执行的 goroutine 数量。对于 GitforGits，这可能意味着限制同时进行的图书搜索或用户登录数量，确保系统在高负载下仍能保持响应。\n\
    \n### 不要忽视正确的关闭程序\n\n当应用程序需要关闭时（例如为了更新或由于某些问题），应优雅地关闭。这意味着确保所有运行中的 goroutine 都已完成任务。通过实现优雅关闭程序，可以确保没有用户请求被突然终止，从而提供流畅的用户体验。\n\
    \n### 始终测试并发性\n\n在处理并发性时，很容易引入错误。因此，始终要严格测试应用程序的并发部分。使用 Go 内置的测试工具可以帮助模拟不同场景，确保系统按预期运行。对于\
    \ GitforGits，这可能涉及模拟大量同时进行的图书购买或用户注册，确保系统能够在不出错的情况下处理负载。\n\n明智地使用并发性可以显著提升 GitforGits\
    \ 书店的性能。然而，权力越大，责任越大。遵循这些做与不做，可以确保系统既高效又稳健，为用户提供无缝且快速的体验。\n\n"
