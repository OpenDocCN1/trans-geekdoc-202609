- raw: "Nested Templates in Action Essentially, think of nested templates as building\
    \ blocks, each fitting seamlessly within another, forming a coherent and structured\
    \ whole.  For GitforGits Bookstore, the utility of nested templates becomes apparent\
    \ when considering the array of different sections that make up the site - headers,\
    \ footers, sidebars, main content, and more.  Each of these sections can be a\
    \ standalone template, and when constructing a full page, these templates can\
    \ be nested within a primary template.  This modular approach ensures ease of\
    \ updates, consistency across pages, and a unified design language. Constructing\
    \ the Framework We shall begin by crafting a base template for the bookstore.\
    \  This foundational template can have placeholders for nested templates, ensuring\
    \ flexibility in content rendering. {{define \"base\"}} <html> <head>     <title>GitforGits\
    \ Bookstore</title> </head> <body>     {{template \"header\" .}}     {{template\
    \ \"content\" .}}     {{template \"footer\" .}} </body> </html> {{end}} In the\
    \ above snippet, \"header\", \"content\", and \"footer\" are the named placeholders\
    \ where nested templates can be inserted. Carving the Header The header, often\
    \ consistent across the website, can be carved into a separate template.  It might\
    \ contain the bookstore’s logo, navigation links, and perhaps a search bar. {{define\
    \ \"header\"}} <div class=\"header\">     <img src=\"logo.png\" alt=\"GitforGits\
    \ Logo\">     <ul class=\"navigation\">         <li>Home</li>         <li>Bestsellers</li>\
    \         <li>Genres</li>     </ul> </div> {{end}} Crafting the Content The \"\
    content\" placeholder is where the versatility of nested templates truly shines.\
    \  Depending on the page—be it a list of bestsellers, an author's biography, or\
    \ a book review—the content template can be dynamically swapped. {{define \"booklist\"\
    }} <div class=\"book-list\">     {{range .Books}}         <div class=\"book\"\
    >             <h2>{{.Title}}</h2>             <p>By {{.Author}}</p>         </div>\
    \     {{end}} </div> {{end}} Sealing the Footer The footer, like the header, remains\
    \ relatively consistent, housing information like contact details, terms of service,\
    \ and social media links. {{define \"footer\"}} <div class=\"footer\">     <p>Contact\
    \ us at contact@gitforgits.com</p>     <ul class=\"social-media\">         <li>Facebook</li>\
    \         <li>Twitter</li>     </ul> </div> {{end}} To construct a complete webpage,\
    \ these nested templates can be rendered within the base template.  Using Go's\
    \ template execution functions, specific content templates (like \"booklist\"\
    ) can be injected into the base, forming a complete, structured webpage. \n\n\
    Design Main Page Layout The main page of any website is akin to a storefront.\
    \  For GitforGits Bookstore, it's the virtual entrance, inviting users to explore\
    \ the vast literary treasures within.  It should not only showcase the variety\
    \ but also offer a glimpse into special features, like bestsellers, new arrivals,\
    \ and user reviews.  This is where design meets functionality, ensuring a compelling\
    \ and seamless browsing experience. Structuring Base Layout To get started, try\
    \ visualizing the components that make up the main page's structure.  Imagine\
    \ the layout of a website that includes a prominent header that contains links\
    \ to navigation, a dynamic content area that displays books, and a footer that\
    \ contains essential information about the website.  Each of these components\
    \ can be crafted as a separate template, which enables modular design and reusability\
    \ of the product. {{define \"base\"}} <html> <head>     <title>GitforGits Bookstore:\
    \ Home</title> </head> <body>     {{template \"header\" .}}     {{template \"\
    mainContent\" .}}     {{template \"footer\" .}} </body> </html> {{end}} Designing\
    \ Header The header should be both visually appealing and functionally efficient.\
    \  It needs to house the brand logo, primary navigation links, and potentially\
    \ a search bar for users to find specific titles. {{define \"header\"}} <div class=\"\
    header\">     <img src=\"logo.png\" alt=\"GitforGits Logo\">     <ul class=\"\
    navigation\">         <li>Home</li>         <li>Bestsellers</li>         <li>New\
    \ Arrivals</li>         <li>Genres</li>     </ul>     <div class=\"search\"> \
    \        <input type=\"text\" placeholder=\"Search for books...\">         <button>Search</button>\
    \     </div> </div> {{end}} Building Dynamic Content Area The primary section\
    \ of the main page is where the magic happens.  Books can be categorized into\
    \ different sections like 'Featured', 'Bestsellers', or 'User Recommendations'.\
    \  For each category, a loop can iterate through a list of books, displaying them\
    \ dynamically. {{define \"mainContent\"}} <div class=\"content\">     <section\
    \ class=\"featured\">         <h2>Featured Books</h2>         {{range .FeaturedBooks}}\
    \             <div class=\"book\">                 <img src=\"{{.ImageURL}}\"\
    \ alt=\"{{.Title}}\">                 <h3>{{.Title}}</h3>                 <p>By\
    \ {{.Author}}</p>             </div>         {{end}}     </section>     <section\
    \ class=\"bestsellers\">         <h2>Bestsellers</h2>         {{range .BestsellingBooks}}\
    \             <div class=\"book\">                 <img src=\"{{.ImageURL}}\"\
    \ alt=\"{{.Title}}\">                 <h3>{{.Title}}</h3>                 <p>By\
    \ {{.Author}}</p>             </div>         {{end}}     </section>     <section\
    \ class=\"recommendations\">         <h2>User Recommendations</h2>         {{range\
    \ .UserRecommended}}             <div class=\"book\">                 <img src=\"\
    {{.ImageURL}}\" alt=\"{{.Title}}\">                 <h3>{{.Title}}</h3>       \
    \          <p>By {{.Author}}</p>             </div>         {{end}}     </section>\
    \ </div> {{end}} Outlining Holistic Footer The footer rounds off the main page\
    \ by providing essential links, contact information, and social media connectivity.\
    \  It ensures users have access to necessary resources, irrespective of where\
    \ they are on the page. {{define \"footer\"}} <div class=\"footer\">     <ul>\
    \         <li>About Us</li>         <li>Contact</li>         <li>Terms of Service</li>\
    \     </ul>     <div class=\"social-icons\">         <img src=\"facebook-icon.png\"\
    >         <img src=\"twitter-icon.png\">     </div>     <p>&copy; 2023 GitforGits\
    \ Bookstore</p> </div> {{end}} This modular approach ensures each section gets\
    \ the attention it deserves.  From the welcoming embrace of the header to the\
    \ diverse literary showcase in the main content, down to the resource-rich footer,\
    \ every pixel is meticulously crafted. "
  fmt: "\n# Nested Templates in Action\n\nEssentially, think of nested templates as\
    \ building blocks, each fitting seamlessly within another, forming a coherent\
    \ and structured whole. For GitforGits Bookstore, the utility of nested templates\
    \ becomes apparent when considering the array of different sections that make\
    \ up the site - headers, footers, sidebars, main content, and more. Each of these\
    \ sections can be a standalone template, and when constructing a full page, these\
    \ templates can be nested within a primary template. This modular approach ensures\
    \ ease of updates, consistency across pages, and a unified design language.\n\n\
    ## Constructing the Framework\n\nWe shall begin by crafting a base template for\
    \ the bookstore. This foundational template can have placeholders for nested templates,\
    \ ensuring flexibility in content rendering.\n\n```\n{{define \"base\"}}\n<html>\n\
    <head>\n    <title>GitforGits Bookstore</title>\n</head>\n<body>\n    {{template\
    \ \"header\" .}}\n    {{template \"content\" .}}\n    {{template \"footer\" .}}\n\
    </body>\n</html>\n{{end}}\n```\n\nIn the above snippet, `\"header\"`, `\"content\"\
    `, and `\"footer\"` are the named placeholders where nested templates can be inserted.\n\
    \n## Carving the Header\n\nThe header, often consistent across the website, can\
    \ be carved into a separate template. It might contain the bookstore’s logo, navigation\
    \ links, and perhaps a search bar.\n\n```\n{{define \"header\"}}\n<div class=\"\
    header\">\n    <img src=\"logo.png\" alt=\"GitforGits Logo\">\n    <ul class=\"\
    navigation\">\n        <li>Home</li>\n        <li>Bestsellers</li>\n        <li>Genres</li>\n\
    \    </ul>\n</div>\n{{end}}\n```\n\n## Crafting the Content\n\nThe `\"content\"\
    ` placeholder is where the versatility of nested templates truly shines. Depending\
    \ on the page—be it a list of bestsellers, an author's biography, or a book review—the\
    \ content template can be dynamically swapped.\n\n```\n{{define \"booklist\"}}\n\
    <div class=\"book-list\">\n    {{range .Books}}\n    <div class=\"book\">\n  \
    \      <h2>{{.Title}}</h2>\n        <p>By {{.Author}}</p>\n    </div>\n    {{end}}\n\
    </div>\n{{end}}\n```\n\n## Sealing the Footer\n\nThe footer, like the header,\
    \ remains relatively consistent, housing information like contact details, terms\
    \ of service, and social media links.\n\n```\n{{define \"footer\"}}\n<div class=\"\
    footer\">\n    <p>Contact us at contact@gitforgits.com</p>\n    <ul class=\"social-media\"\
    >\n        <li>Facebook</li>\n        <li>Twitter</li>\n    </ul>\n</div>\n{{end}}\n\
    ```\n\nTo construct a complete webpage, these nested templates can be rendered\
    \ within the base template. Using Go's template execution functions, specific\
    \ content templates (like `\"booklist\"`) can be injected into the base, forming\
    \ a complete, structured webpage.\n\n# Design Main Page Layout\n\nThe main page\
    \ of any website is akin to a storefront. For GitforGits Bookstore, it's the virtual\
    \ entrance, inviting users to explore the vast literary treasures within. It should\
    \ not only showcase the variety but also offer a glimpse into special features,\
    \ like bestsellers, new arrivals, and user reviews. This is where design meets\
    \ functionality, ensuring a compelling and seamless browsing experience.\n\n##\
    \ Structuring Base Layout\n\nTo get started, try visualizing the components that\
    \ make up the main page's structure. Imagine the layout of a website that includes\
    \ a prominent header that contains links to navigation, a dynamic content area\
    \ that displays books, and a footer that contains essential information about\
    \ the website. Each of these components can be crafted as a separate template,\
    \ which enables modular design and reusability of the product.\n\n```\n{{define\
    \ \"base\"}}\n<html>\n<head>\n    <title>GitforGits Bookstore: Home</title>\n\
    </head>\n<body>\n    {{template \"header\" .}}\n    {{template \"mainContent\"\
    \ .}}\n    {{template \"footer\" .}}\n</body>\n</html>\n{{end}}\n```\n\n## Designing\
    \ Header\n\nThe header should be both visually appealing and functionally efficient.\
    \ It needs to house the brand logo, primary navigation links, and potentially\
    \ a search bar for users to find specific titles.\n\n```\n{{define \"header\"\
    }}\n<div class=\"header\">\n    <img src=\"logo.png\" alt=\"GitforGits Logo\"\
    >\n    <ul class=\"navigation\">\n        <li>Home</li>\n        <li>Bestsellers</li>\n\
    \        <li>New Arrivals</li>\n        <li>Genres</li>\n    </ul>\n    <div class=\"\
    search\">\n        <input type=\"text\" placeholder=\"Search for books...\">\n\
    \        <button>Search</button>\n    </div>\n</div>\n{{end}}\n```\n\n## Building\
    \ Dynamic Content Area\n\nThe primary section of the main page is where the magic\
    \ happens. Books can be categorized into different sections like 'Featured', 'Bestsellers',\
    \ or 'User Recommendations'. For each category, a loop can iterate through a list\
    \ of books, displaying them dynamically.\n\n```\n{{define \"mainContent\"}}\n\
    <div class=\"content\">\n    <section class=\"featured\">\n        <h2>Featured\
    \ Books</h2>\n        {{range .FeaturedBooks}}\n        <div class=\"book\">\n\
    \            <img src=\"{{.ImageURL}}\" alt=\"{{.Title}}\">\n            <h3>{{.Title}}</h3>\n\
    \            <p>By {{.Author}}</p>\n        </div>\n        {{end}}\n    </section>\n\
    \    <section class=\"bestsellers\">\n        <h2>Bestsellers</h2>\n        {{range\
    \ .BestsellingBooks}}\n        <div class=\"book\">\n            <img src=\"{{.ImageURL}}\"\
    \ alt=\"{{.Title}}\">\n            <h3>{{.Title}}</h3>\n            <p>By {{.Author}}</p>\n\
    \        </div>\n        {{end}}\n    </section>\n    <section class=\"recommendations\"\
    >\n        <h2>User Recommendations</h2>\n        {{range .UserRecommended}}\n\
    \        <div class=\"book\">\n            <img src=\"{{.ImageURL}}\" alt=\"{{.Title}}\"\
    >\n            <h3>{{.Title}}</h3>\n            <p>By {{.Author}}</p>\n      \
    \  </div>\n        {{end}}\n    </section>\n</div>\n{{end}}\n```\n\n## Outlining\
    \ Holistic Footer\n\nThe footer rounds off the main page by providing essential\
    \ links, contact information, and social media connectivity. It ensures users\
    \ have access to necessary resources, irrespective of where they are on the page.\n\
    \n```\n{{define \"footer\"}}\n<div class=\"footer\">\n    <ul>\n        <li>About\
    \ Us</li>\n        <li>Contact</li>\n        <li>Terms of Service</li>\n    </ul>\n\
    \    <div class=\"social-icons\">\n        <img src=\"facebook-icon.png\">\n \
    \       <img src=\"twitter-icon.png\">\n    </div>\n    <p>&copy; 2023 GitforGits\
    \ Bookstore</p>\n</div>\n{{end}}\n```\n\nThis modular approach ensures each section\
    \ gets the attention it deserves. From the welcoming embrace of the header to\
    \ the diverse literary showcase in the main content, down to the resource-rich\
    \ footer, every pixel is meticulously crafted.\n"
  trans: "\n\n# 嵌套模板实战\n\n本质上，可以将嵌套模板视为构建模块，每个模块都能无缝嵌套于另一个之中，形成一个连贯且结构化的整体。对于 GitforGits\
    \ 书店而言，嵌套模板的实用性在考虑构成网站的各个不同部分时显而易见——例如页眉、页脚、侧边栏、主内容等。这些部分中的每一个都可以是一个独立的模板，而在构建完整页面时，这些模板可以嵌套在主模板中。这种模块化方法确保了更新的便捷性、页面间的一致性以及统一的设计语言。\n\
    \n## 构建框架\n\n我们将首先为书店创建一个基础模板。这个基础模板可以包含嵌套模板的占位符，以确保内容渲染的灵活性。\n\n```\n{{define\
    \ \"base\"}}\n<html>\n<head>\n    <title>GitforGits Bookstore</title>\n</head>\n\
    <body>\n    {{template \"header\" .}}\n    {{template \"content\" .}}\n    {{template\
    \ \"footer\" .}}\n</body>\n</html>\n{{end}}\n```\n\n在上面的代码片段中，`\"header\"`、`\"\
    content\"` 和 `\"footer\"` 是可以插入嵌套模板的命名占位符。\n\n## 创建页眉\n\n页眉通常在整个网站中保持一致，可以将其单独制作成一个模板。它可能包含书店的标志、导航链接，或许还有一个搜索栏。\n\
    \n```\n{{define \"header\"}}\n<div class=\"header\">\n    <img src=\"logo.png\"\
    \ alt=\"GitforGits Logo\">\n    <ul class=\"navigation\">\n        <li>Home</li>\n\
    \        <li>Bestsellers</li>\n        <li>Genres</li>\n    </ul>\n</div>\n{{end}}\n\
    ```\n\n## 制作内容\n\n`\"content\"` 占位符正是嵌套模板灵活性真正闪耀的地方。根据页面不同——无论是畅销书列表、作者传记还是书评——内容模板都可以动态替换。\n\
    \n```\n{{define \"booklist\"}}\n<div class=\"book-list\">\n    {{range .Books}}\n\
    \    <div class=\"book\">\n        <h2>{{.Title}}</h2>\n        <p>By {{.Author}}</p>\n\
    \    </div>\n    {{end}}\n</div>\n{{end}}\n```\n\n## 封装页脚\n\n页脚与页眉类似，保持相对一致，包含联系方式、服务条款和社交媒体链接等信息。\n\
    \n```\n{{define \"footer\"}}\n<div class=\"footer\">\n    <p>Contact us at contact@gitforgits.com</p>\n\
    \    <ul class=\"social-media\">\n        <li>Facebook</li>\n        <li>Twitter</li>\n\
    \    </ul>\n</div>\n{{end}}\n```\n\n要构建完整网页，这些嵌套模板可以在基础模板中渲染。使用 Go 的模板执行函数，可以将特定的内容模板（如\
    \ `\"booklist\"`）注入到基础模板中，从而形成一个完整且结构化的网页。\n\n# 设计主页面布局\n\n任何网站的主页面都类似于橱窗。对于 GitforGits\
    \ 书店来说，它是虚拟入口，邀请用户探索其中丰富的文学宝藏。它不仅应展示多样性，还应让用户一窥特色功能，例如畅销书、新书上架和用户评论。这就是设计与功能相结合的地方，确保引人入胜且流畅的浏览体验。\n\
    \n## 构建基础布局\n\n要开始，请尝试可视化构成主页面结构的组件。想象一个网站布局，包含一个带有导航链接的显著页眉、一个显示书籍的动态内容区域，以及一个包含网站基本信息的页脚。这些组件中的每一个都可以作为单独的模板来制作，从而实现产品的模块化设计和可重用性。\n\
    \n```\n{{define \"base\"}}\n<html>\n<head>\n    <title>GitforGits Bookstore: Home</title>\n\
    </head>\n<body>\n    {{template \"header\" .}}\n    {{template \"mainContent\"\
    \ .}}\n    {{template \"footer\" .}}\n</body>\n</html>\n{{end}}\n```\n\n## 设计页眉\n\
    \n页眉既要视觉吸引人，又要功能高效。它需要容纳品牌标志、主要导航链接，以及可能用于用户查找特定书名的搜索栏。\n\n```\n{{define \"header\"\
    }}\n<div class=\"header\">\n    <img src=\"logo.png\" alt=\"GitforGits Logo\"\
    >\n    <ul class=\"navigation\">\n        <li>Home</li>\n        <li>Bestsellers</li>\n\
    \        <li>New Arrivals</li>\n        <li>Genres</li>\n    </ul>\n    <div class=\"\
    search\">\n        <input type=\"text\" placeholder=\"Search for books...\">\n\
    \        <button>Search</button>\n    </div>\n</div>\n{{end}}\n```\n\n## 构建动态内容区域\n\
    \n主页面的主要部分就是奇迹发生的地方。书籍可以分为不同的部分，例如“精选”、“畅销书”或“用户推荐”。对于每个类别，可以使用循环遍历书籍列表，动态显示它们。\n\
    \n```\n{{define \"mainContent\"}}\n<div class=\"content\">\n    <section class=\"\
    featured\">\n        <h2>Featured Books</h2>\n        {{range .FeaturedBooks}}\n\
    \        <div class=\"book\">\n            <img src=\"{{.ImageURL}}\" alt=\"{{.Title}}\"\
    >\n            <h3>{{.Title}}</h3>\n            <p>By {{.Author}}</p>\n      \
    \  </div>\n        {{end}}\n    </section>\n    <section class=\"bestsellers\"\
    >\n        <h2>Bestsellers</h2>\n        {{range .BestsellingBooks}}\n       \
    \ <div class=\"book\">\n            <img src=\"{{.ImageURL}}\" alt=\"{{.Title}}\"\
    >\n            <h3>{{.Title}}</h3>\n            <p>By {{.Author}}</p>\n      \
    \  </div>\n        {{end}}\n    </section>\n    <section class=\"recommendations\"\
    >\n        <h2>User Recommendations</h2>\n        {{range .UserRecommended}}\n\
    \        <div class=\"book\">\n            <img src=\"{{.ImageURL}}\" alt=\"{{.Title}}\"\
    >\n            <h3>{{.Title}}</h3>\n            <p>By {{.Author}}</p>\n      \
    \  </div>\n        {{end}}\n    </section>\n</div>\n{{end}}\n```\n\n## 勾勒完整页脚\n\
    \n页脚通过提供基本链接、联系信息和社交媒体连接来完成主页面。它确保用户无论身处页面何处，都能访问必要的资源。\n\n```\n{{define \"footer\"\
    }}\n<div class=\"footer\">\n    <ul>\n        <li>About Us</li>\n        <li>Contact</li>\n\
    \        <li>Terms of Service</li>\n    </ul>\n    <div class=\"social-icons\"\
    >\n        <img src=\"facebook-icon.png\">\n        <img src=\"twitter-icon.png\"\
    >\n    </div>\n    <p>&copy; 2023 GitforGits Bookstore</p>\n</div>\n{{end}}\n\
    ```\n\n这种模块化方法确保每个部分都能得到应有的关注。从页眉的欢迎拥抱，到主内容中多样的文学展示，再到资源丰富的页脚，每个像素都经过精心打磨。\n\n"
