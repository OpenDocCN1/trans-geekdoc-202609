    \ the Go programming language, the process of copying all of your external dependencies\
    \ into your project directory is referred to as \"vendoring.\"  Prior to the introduction\
    \ of Go Modules, the recommended method for achieving reproducible builds was\
    \ to use vendoring.  When using vendoring, the external packages that are associated\
    \ with the project are typically kept in a directory within the project that is\
    \ labelled /vendor.  The packages in the /vendor directory are given higher priority\
    \ by Go during the application's construction process than those in the global\
    \ GOPATH directory.  ![](image/image-0-6.jpg) Fig 2.2 Vendoring in Go Benefits\
    \ of Vendoring \n\n*   Your project is isolated from system-wide packages, ensuring\
    \ that updates or removals in the global space don't affect your project. \n\n\
    *   Since all dependencies are local, you can build your project without internet\
    \ access. \n\n*   Your dependencies won't change unless you explicitly decide\
    \ to update them, leading to reproducible builds. "
