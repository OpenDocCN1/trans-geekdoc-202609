- raw: "Handling Forms and User Inputs A web application's capacity to receive and\
    \ process user inputs is fundamental to its interactive nature.  In order to facilitate\
    \ this interaction, forms serve as bridges that enable users to submit data. \
    \ This data can be used for a variety of purposes, including registering for an\
    \ account, providing feedback, or placing an order.  It is anticipated that forms\
    \ will play a significant part in the process of capturing user preferences, orders,\
    \ and reviews for the GitforGits Bookstore. Laying Groundwork Web forms are primarily\
    \ created using the HTML <form> element.  Within this, various input elements,\
    \ such as text fields (<input>), checkboxes, radio buttons, and dropdown lists,\
    \ capture data.  The data entered into these fields gets sent to the server when\
    \ the form is submitted. Consider a user registration form for the bookstore.\
    \  Such a form would capture essential details like username, email, password,\
    \ and perhaps, user preferences.  Given below is how it might look: <form action=\"\
    /register\" method=\"post\">     <label for=\"username\">Username:</label>   \
    \  <input type=\"text\" id=\"username\" name=\"username\">     <label for=\"email\"\
    >Email:</label>     <input type=\"email\" id=\"email\" name=\"email\">     <label\
    \ for=\"password\">Password:</label>     <input type=\"password\" id=\"password\"\
    \ name=\"password\">     <input type=\"submit\" value=\"Register\"> </form> Dropdowns,\
    \ Radios, and Checkboxes Beyond simple text inputs, forms can contain elements\
    \ that allow users to make selections.  Suppose the GitforGits Bookstore offers\
    \ a feature for users to set preferences regarding genres they're interested in.\
    \  Dropdowns, radios, and checkboxes would be apt choices. <label for=\"favGenre\"\
    >Favorite Genre:</label> <select id=\"favGenre\" name=\"favGenre\">     <option\
    \ value=\"fiction\">Fiction</option>     <option value=\"non-fiction\">Non-Fiction</option>\
    \     <option value=\"sci-fi\">Science Fiction</option> </select> <label>Preferred\
    \ Authors:</label> <input type=\"checkbox\" id=\"author1\" name=\"author1\" value=\"\
    Author One\"> <label for=\"author1\">Author One</label> <input type=\"checkbox\"\
    \ id=\"author2\" name=\"author2\" value=\"Author Two\"> <label for=\"author2\"\
    >Author Two</label> Validation Ensuring that users provide valid input is paramount.\
    \  HTML5 offers built-in validation features like required fields and pattern\
    \ matching.  For instance, the email input type will check for a valid email format.\
    \  Adding a required attribute will ensure that a field is not left empty. <input\
    \ type=\"email\" id=\"email\" name=\"email\" required> Processing Form Data Once\
    \ a form is submitted, the server needs to process the input data.  With Go, the\
    \ net/http package makes this task straightforward.  The Request object contains\
    \ form data which can be easily parsed and processed. Now, once the registration\
    \ form is submitted, the server can extract the form data using: username := r.FormValue(\"\
    username\") email := r.FormValue(\"email\") password := r.FormValue(\"password\"\
    ) The addition of forms to GitforGits Bookstore enhances its interactivity and\
    \ user-centric approach.  It is guaranteed that the user will always feel heard,\
    \ that their preferences will be honored, and that their data will be secure thanks\
    \ to the dialogue that is initiated through forms and is supported by the processing\
    \ power of Go. \n\nTemplate Caching Overview Imagine going to GitforGits and finding\
    \ that the store's layout is completely rearranged with each page you turn to.\
    \  Infuriating, don't you think?  A phenomenon that is analogous to this one occurs\
    \ in modern web applications due to the fact that templates are parsed and loaded\
    \ from scratch for each and every user request.  Not only does it result in a\
    \ waste of computational resources, but it also causes lag, which in turn reduces\
    \ the quality of the user experience.  For the purposes of this learnings, template\
    \ caching is comparable to the process of establishing a stable floor plan in\
    \ a physical store, which guarantees uniformity and facilitates quick navigation\
    \ for each and every customer. A straightforward explanation of template caching\
    \ is that it involves storing pre-parsed templates in memory.  This makes them\
    \ readily available for subsequent requests without the need for reparsing, which\
    \ is an overhead.  The response times of the server are significantly improved\
    \ by this mechanism, which guarantees that the end user will receive content in\
    \ a timely manner. Go's Template Package Go's html/template package is adept at\
    \ parsing and storing templates.  Typically, when rendering a response, one might\
    \ use template.ParseFiles() or template.ParseGlob() on-the-fly.  While effective,\
    \ it's computationally intensive if repeated for every request.  Instead of parsing\
    \ templates within handler functions, the parsing can be performed at application\
    \ startup.  By doing so, a cache of parsed templates is created, held in memory,\
    \ and readily available for use. var templateCache = template.New(\"\").Delims(\"\
    {{\", \"}}\") func LoadTemplates() {     templates, err := templateCache.ParseGlob(\"\
    ./templates/\\*.gohtml\")     if err != nil {         log.Fatal(err)     }   \
    \  templateCache = templates } In this snippet, the LoadTemplates function populates\
    \ the global templateCache with parsed templates.  By invoking this function at\
    \ application start, the parsed templates become readily accessible throughout\
    \ the application's lifecycle. Deploying Cached Templates With the cache in place,\
    \ rendering a response becomes a streamlined process.  Suppose a user accesses\
    \ a book listing on GitforGits: func BookListHandler(w http.ResponseWriter, r\
    \ \\*http.Request) {     books := fetchBooks()     err := templateCache.ExecuteTemplate(w,\
    \ \"booklist.gohtml\", books)     if err != nil {         http.Error(w, \"Internal\
    \ Server Error\", http.StatusInternalServerError)     } } In the BookListHandler,\
    \ instead of parsing the template anew, the handler directly taps into the templateCache,\
    \ swiftly serving the request using the pre-parsed \"booklist.gohtml\" template.\
    \ The outcomes of template caching are multi-fold: \n\n*   By eliminating the\
    \ overhead of parsing, response times get a significant boost. \n\n*   Reducing\
    \ redundant operations ensures efficient CPU utilization. \n\n*   Using a centralized\
    \ cache prevents potential inconsistencies that might arise from parsing templates\
    \ in various parts of an application. \n\nHowever, while caching enhances production\
    \ performance, during the development phase, it might obscure changes made to\
    \ templates since the cache retains the initially parsed versions.  Developers\
    \ must refresh the cache to visualize updates. "
  fmt: "\n# Handling Forms and User Inputs\n\nA web application's capacity to receive\
    \ and process user inputs is fundamental to its interactive nature. In order to\
    \ facilitate this interaction, forms serve as bridges that enable users to submit\
    \ data. This data can be used for a variety of purposes, including registering\
    \ for an account, providing feedback, or placing an order. It is anticipated that\
    \ forms will play a significant part in the process of capturing user preferences,\
    \ orders, and reviews for the GitforGits Bookstore.\n\n## Laying Groundwork\n\n\
    Web forms are primarily created using the HTML `<form>` element. Within this,\
    \ various input elements, such as text fields (`<input>`), checkboxes, radio buttons,\
    \ and dropdown lists, capture data. The data entered into these fields gets sent\
    \ to the server when the form is submitted.\n\nConsider a user registration form\
    \ for the bookstore. Such a form would capture essential details like username,\
    \ email, password, and perhaps, user preferences. Given below is how it might\
    \ look:\n\n```html\n<form action=\"/register\" method=\"post\">\n    <label for=\"\
    username\">Username:</label>\n    <input type=\"text\" id=\"username\" name=\"\
    username\">\n    <label for=\"email\">Email:</label>\n    <input type=\"email\"\
    \ id=\"email\" name=\"email\">\n    <label for=\"password\">Password:</label>\n\
    \    <input type=\"password\" id=\"password\" name=\"password\">\n    <input type=\"\
    submit\" value=\"Register\">\n</form>\n```\n\n## Dropdowns, Radios, and Checkboxes\n\
    \nBeyond simple text inputs, forms can contain elements that allow users to make\
    \ selections. Suppose the GitforGits Bookstore offers a feature for users to set\
    \ preferences regarding genres they're interested in. Dropdowns, radios, and checkboxes\
    \ would be apt choices.\n\n```html\n<label for=\"favGenre\">Favorite Genre:</label>\n\
    <select id=\"favGenre\" name=\"favGenre\">\n    <option value=\"fiction\">Fiction</option>\n\
    \    <option value=\"non-fiction\">Non-Fiction</option>\n    <option value=\"\
    sci-fi\">Science Fiction</option>\n</select>\n<label>Preferred Authors:</label>\n\
    <input type=\"checkbox\" id=\"author1\" name=\"author1\" value=\"Author One\"\
    >\n<label for=\"author1\">Author One</label>\n<input type=\"checkbox\" id=\"author2\"\
    \ name=\"author2\" value=\"Author Two\">\n<label for=\"author2\">Author Two</label>\n\
    ```\n\n## Validation\n\nEnsuring that users provide valid input is paramount.\
    \ HTML5 offers built-in validation features like required fields and pattern matching.\
    \ For instance, the email input type will check for a valid email format. Adding\
    \ a `required` attribute will ensure that a field is not left empty.\n\n```html\n\
    <input type=\"email\" id=\"email\" name=\"email\" required>\n```\n\n## Processing\
    \ Form Data\n\nOnce a form is submitted, the server needs to process the input\
    \ data. With Go, the `net/http` package makes this task straightforward. The `Request`\
    \ object contains form data which can be easily parsed and processed.\n\nNow,\
    \ once the registration form is submitted, the server can extract the form data\
    \ using:\n\n```go\nusername := r.FormValue(\"username\")\nemail := r.FormValue(\"\
    email\")\npassword := r.FormValue(\"password\")\n```\n\nThe addition of forms\
    \ to GitforGits Bookstore enhances its interactivity and user-centric approach.\
    \ It is guaranteed that the user will always feel heard, that their preferences\
    \ will be honored, and that their data will be secure thanks to the dialogue that\
    \ is initiated through forms and is supported by the processing power of Go.\n\
    \n# Template Caching\n\n## Overview\n\nImagine going to GitforGits and finding\
    \ that the store's layout is completely rearranged with each page you turn to.\
    \ Infuriating, don't you think? A phenomenon that is analogous to this one occurs\
    \ in modern web applications due to the fact that templates are parsed and loaded\
    \ from scratch for each and every user request. Not only does it result in a waste\
    \ of computational resources, but it also causes lag, which in turn reduces the\
    \ quality of the user experience. For the purposes of this learnings, template\
    \ caching is comparable to the process of establishing a stable floor plan in\
    \ a physical store, which guarantees uniformity and facilitates quick navigation\
    \ for each and every customer.\n\nA straightforward explanation of template caching\
    \ is that it involves storing pre-parsed templates in memory. This makes them\
    \ readily available for subsequent requests without the need for reparsing, which\
    \ is an overhead. The response times of the server are significantly improved\
    \ by this mechanism, which guarantees that the end user will receive content in\
    \ a timely manner.\n\n## Go's Template Package\n\nGo's `html/template` package\
    \ is adept at parsing and storing templates. Typically, when rendering a response,\
    \ one might use `template.ParseFiles()` or `template.ParseGlob()` on-the-fly.\
    \ While effective, it's computationally intensive if repeated for every request.\
    \ Instead of parsing templates within handler functions, the parsing can be performed\
    \ at application startup. By doing so, a cache of parsed templates is created,\
    \ held in memory, and readily available for use.\n\n```go\nvar templateCache =\
    \ template.New(\"\").Delims(\"{{\", \"}}\")\nfunc LoadTemplates() {\n    templates,\
    \ err := templateCache.ParseGlob(\"./templates/*.gohtml\")\n    if err != nil\
    \ {\n        log.Fatal(err)\n    }\n    templateCache = templates\n}\n```\n\n\
    In this snippet, the `LoadTemplates` function populates the global `templateCache`\
    \ with parsed templates. By invoking this function at application start, the parsed\
    \ templates become readily accessible throughout the application's lifecycle.\n\
    \n## Deploying Cached Templates\n\nWith the cache in place, rendering a response\
    \ becomes a streamlined process. Suppose a user accesses a book listing on GitforGits:\n\
    \n```go\nfunc BookListHandler(w http.ResponseWriter, r *http.Request) {\n    books\
    \ := fetchBooks()\n    err := templateCache.ExecuteTemplate(w, \"booklist.gohtml\"\
    , books)\n    if err != nil {\n        http.Error(w, \"Internal Server Error\"\
    , http.StatusInternalServerError)\n    }\n}\n```\n\nIn the `BookListHandler`,\
    \ instead of parsing the template anew, the handler directly taps into the `templateCache`,\
    \ swiftly serving the request using the pre-parsed `\"booklist.gohtml\"` template.\n\
    \nThe outcomes of template caching are multi-fold:\n\n* By eliminating the overhead\
    \ of parsing, response times get a significant boost.\n* Reducing redundant operations\
    \ ensures efficient CPU utilization.\n* Using a centralized cache prevents potential\
    \ inconsistencies that might arise from parsing templates in various parts of\
    \ an application.\n\nHowever, while caching enhances production performance, during\
    \ the development phase, it might obscure changes made to templates since the\
    \ cache retains the initially parsed versions. Developers must refresh the cache\
    \ to visualize updates.\n"
  trans: "\n\n# 处理表单和用户输入\n\nWeb 应用程序接收和处理用户输入的能力是其交互性的基础。为了促进这种交互，表单充当了桥梁，使用户能够提交数据。这些数据可用于各种目的，包括注册帐户、提供反馈或下订单。预计表单将在\
    \ GitforGits 书店捕获用户偏好、订单和评论的过程中发挥重要作用。\n\n## 奠定基础\n\nWeb 表单主要使用 HTML `<form>`\
    \ 元素创建。在此元素中，各种输入元素，例如文本字段（`<input>`）、复选框、单选按钮和下拉列表，用于捕获数据。当表单提交时，这些字段中输入的数据将发送到服务器。\n\
    \n考虑书店的用户注册表单。此类表单将捕获用户名、电子邮件、密码以及可能的用户偏好等基本详细信息。以下是它可能的样子：\n\n```html\n<form\
    \ action=\"/register\" method=\"post\">\n    <label for=\"username\">Username:</label>\n\
    \    <input type=\"text\" id=\"username\" name=\"username\">\n    <label for=\"\
    email\">Email:</label>\n    <input type=\"email\" id=\"email\" name=\"email\"\
    >\n    <label for=\"password\">Password:</label>\n    <input type=\"password\"\
    \ id=\"password\" name=\"password\">\n    <input type=\"submit\" value=\"Register\"\
    >\n</form>\n```\n\n## 下拉列表、单选按钮和复选框\n\n除了简单的文本输入外，表单还可以包含允许用户进行选择的元素。假设 GitforGits\
    \ 书店提供一项功能，让用户设置他们感兴趣的类型偏好。下拉列表、单选按钮和复选框将是合适的选择。\n\n```html\n<label for=\"favGenre\"\
    >Favorite Genre:</label>\n<select id=\"favGenre\" name=\"favGenre\">\n    <option\
    \ value=\"fiction\">Fiction</option>\n    <option value=\"non-fiction\">Non-Fiction</option>\n\
    \    <option value=\"sci-fi\">Science Fiction</option>\n</select>\n<label>Preferred\
    \ Authors:</label>\n<input type=\"checkbox\" id=\"author1\" name=\"author1\" value=\"\
    Author One\">\n<label for=\"author1\">Author One</label>\n<input type=\"checkbox\"\
    \ id=\"author2\" name=\"author2\" value=\"Author Two\">\n<label for=\"author2\"\
    >Author Two</label>\n```\n\n## 验证\n\n确保用户提供有效输入至关重要。HTML5 提供了内置验证功能，例如必填字段和模式匹配。例如，电子邮件输入类型将检查有效的电子邮件格式。添加\
    \ `required` 属性将确保字段不为空。\n\n```html\n<input type=\"email\" id=\"email\" name=\"\
    email\" required>\n```\n\n## 处理表单数据\n\n一旦表单提交，服务器需要处理输入数据。使用 Go，`net/http` 包使这项任务变得简单。`Request`\
    \ 对象包含表单数据，可以轻松解析和处理。\n\n现在，一旦注册表单提交，服务器可以使用以下方式提取表单数据：\n\n```go\nusername :=\
    \ r.FormValue(\"username\")\nemail := r.FormValue(\"email\")\npassword := r.FormValue(\"\
    password\")\n```\n\n向 GitforGits 书店添加表单增强了其交互性和以用户为中心的方法。可以保证，用户始终会感到被倾听，他们的偏好将得到尊重，并且他们的数据将是安全的，这要归功于通过表单发起的对话，并由\
    \ Go 的处理能力支持。\n\n# 模板缓存\n\n## 概述\n\n想象一下，你去 GitforGits，发现每翻一页，商店的布局就完全重新排列一次。你觉得恼火，不是吗？现代\
    \ Web 应用程序中也会发生类似的现象，因为模板是针对每个用户请求从头开始解析和加载的。这不仅会浪费计算资源，还会导致滞后，从而降低用户体验质量。就本学习而言，模板缓存可比作在实体店中建立稳定的平面布局，它保证了统一性，并方便每位客户快速导航。\n\
    \n模板缓存的简单解释是，它涉及将预解析的模板存储在内存中。这使得它们可以随时用于后续请求，而无需重新解析，而重新解析是一种开销。这种机制显著提高了服务器的响应时间，并保证最终用户能够及时收到内容。\n\
    \n## Go 的模板包\n\nGo 的 `html/template` 包擅长解析和存储模板。通常，在渲染响应时，人们可能会使用 `template.ParseFiles()`\
    \ 或 `template.ParseGlob()` 即时解析。虽然有效，但如果对每个请求都重复此操作，则计算密集。与其在处理程序函数中解析模板，不如在应用程序启动时执行解析。这样做，会创建一个已解析模板的缓存，将其保存在内存中，并随时可供使用。\n\
    \n```go\nvar templateCache = template.New(\"\").Delims(\"{{\", \"}}\")\nfunc LoadTemplates()\
    \ {\n    templates, err := templateCache.ParseGlob(\"./templates/*.gohtml\")\n\
    \    if err != nil {\n        log.Fatal(err)\n    }\n    templateCache = templates\n\
    }\n```\n\n在此代码片段中，`LoadTemplates` 函数将已解析的模板填充到全局 `templateCache` 中。通过在应用程序启动时调用此函数，已解析的模板将在整个应用程序生命周期内随时可用。\n\
    \n## 部署缓存的模板\n\n有了缓存，渲染响应就变成了一个精简的过程。假设用户访问 GitforGits 上的图书列表：\n\n```go\nfunc\
    \ BookListHandler(w http.ResponseWriter, r *http.Request) {\n    books := fetchBooks()\n\
    \    err := templateCache.ExecuteTemplate(w, \"booklist.gohtml\", books)\n   \
    \ if err != nil {\n        http.Error(w, \"Internal Server Error\", http.StatusInternalServerError)\n\
    \    }\n}\n```\n\n在 `BookListHandler` 中，处理程序不是重新解析模板，而是直接调用 `templateCache`，使用预解析的\
    \ `\"booklist.gohtml\"` 模板快速处理请求。\n\n模板缓存的结果是多方面的：\n\n* 通过消除解析开销，响应时间得到显著提升。\n\
    * 减少冗余操作可确保高效的 CPU 利用率。\n* 使用集中式缓存可防止因在应用程序的各个部分解析模板而可能出现的不一致性。\n\n但是，虽然缓存增强了生产性能，但在开发阶段，它可能会掩盖对模板所做的更改，因为缓存保留了最初解析的版本。开发人员必须刷新缓存才能查看更新。\n\
    \n"
