- raw: "Summary In this chapter, we have focused on how to make the most of concurrency,\
    \ with a specific focus on the GitforGits Bookstore.  The ability to efficiently\
    \ handle numerous tasks, regardless of their timing, is known as concurrency.\
    \  This means handling various user interactions, such as perusing books and making\
    \ purchases, and making sure they all work smoothly no matter how many users are\
    \ using it at the same time. Knowing how concurrency differs from parallelism\
    \ has been crucial.  There is a difference between the two, despite the fact that\
    \ they both seek to maximize efficiency.  Concurrency is great for handling a\
    \ variety of user requests because it is great at handling multiple tasks at once.\
    \  The major emphasis here is not on parallelism, but taking advantage of multi-core\
    \ CPU architectures to run numerous tasks simultaneously is.  To guarantee that\
    \ user interactions are timely and seamless, GitforGits places a premium on concurrency.\
    \ There was a lot of learning about how to put concurrency into practice, specifically\
    \ about using goroutines.  Be careful when using gouroutines, even though they\
    \ are lightweight.  Overconsumption can cause resources to be exhausted.  Data\
    \ races happen when numerous processes try to access the same shared resource\
    \ at the same time; to prevent them, it is crucial to use suitable synchronization\
    \ techniques like sync.Mutex.  When runtime errors happen inside goroutines, there\
    \ must be error-handling mechanisms like defer-recovery to handle them.  The entire\
    \ application will not be compromised in the event that one routine fails.  Additionally,\
    \ it was emphasized that thorough concurrency testing, allowing active goroutines\
    \ to finish their tasks, and performing proper system shutdowns are essential\
    \ practices. Request management is a top priority for the GitforGits Bookstore.\
    \  In order to accomplish this, this chapter outlined the various approaches and\
    \ methods that could be employed in conjunction with concurrency.  In order to\
    \ keep the system running smoothly for the bookshop, it has been necessary to\
    \ learn both the basics and dive into more complex subjects like goroutines, synchronization,\
    \ error handling, and testing. \n\nChapter 7: Sessions, Authentication, and Authorization\
    \ \n\nUser Sessions Overview User experience is of the utmost importance in web\
    \ applications, and it frequently determines whether a platform is successful\
    \ or unsuccessful.  The application of the concept of sessions is essential to\
    \ the delivery of a streamlined and individualized user experience.  Sessions\
    \ are not only essential for ensuring that user interactions remain consistent,\
    \ but they also represent a temporary and interactive exchange of information\
    \ between the user and the application under consideration.  When it comes to\
    \ web applications such as the GitforGits Bookstore, sessions are the most important\
    \ factor in ensuring that users have a consistent experience regardless of whether\
    \ they are navigating through different pages or returning after a break. Think\
    \ about a user who is looking through the GitforGits Bookstore.  During the time\
    \ that they are browsing, searching for books, adding items to their shopping\
    \ cart, and reading reviews, sessions play an important part in maintaining the\
    \ continuity of this interaction.  In the absence of sessions, the navigation\
    \ of each page would result in a loss of context, which would make the user's\
    \ experience more disjointed and frustrating.  Sessions are an effective means\
    \ of bridging this gap.  In the context of GitforGits, sessions make it possible\
    \ to store essential user data, such as the contents of a user's shopping cart,\
    \ their search history, and any personalized settings or recommendations they\
    \ may have made.  This helps to ensure that the user's shopping experience is\
    \ smooth and uninterrupted. Sessions are useful for more than just ensuring continuity;\
    \ they also play an important role in the process of personalizing the user experience.\
    \  Internet users in the modern era have come to anticipate a personalized experience\
    \ whenever they visit online platforms.  There are many different ways that personalization\
    \ can be implemented in a bookstore setting, including making book recommendations\
    \ based on previous purchases and viewing history, as well as sending out personal\
    \ greetings.  During sessions, the GitforGits Bookstore is able to store and retrieve\
    \ data that is specific to each individual customer.  This makes it possible for\
    \ each customer to have a shopping experience that is both personalized and interesting.\
    \ The significance of sessions, on the other hand, is not restricted to the user\
    \ experience alone; they are also extremely important for the purposes of security.\
    \  Consider, for example, the system of user authentication.  It is both impractical\
    \ and insecure for users to have to re-enter their credentials each time they\
    \ access a new page on the GitforGits platform after they have already had the\
    \ opportunity to log in.  Sessions are able to address this issue by preserving\
    \ the authenticated state of the user, which enables seamless navigation under\
    \ their profile after they have successfully logged in.  Because of this convenience,\
    \ secure session management is extremely important, as any breach in security\
    \ could result in vulnerabilities such as unauthorized access or data breaches.\
    \ For GitforGits, the management of an increasing number of concurrent sessions\
    \ presents a formidable challenge as the user base continues to grow through its\
    \ expansion.  When it comes to session management, the scalability and efficiency\
    \ of the system become extremely important factors.  To accomplish this, it is\
    \ necessary to make strategic decisions regarding the storage of session data,\
    \ whether it be in-memory, databases, or distributed systems, and to devise methods\
    \ for ensuring that data access is both quick and free of bottlenecks.  The objective\
    \ is to make certain that the performance and dependability of session handling\
    \ mechanisms do not suffer as a result of an increase in the number of users,\
    \ but rather scale proportionately to meet the growing demand.  For our Bookstore,\
    \ mastering this aspect is not merely an enhancement; rather, it is a necessity.\
    \  This is because it guarantees that users will have a safe, personalized, and\
    \ uninterrupted browsing experience, regardless of the growth and scale of the\
    \ platform. \n\nStore Session Data Session Storage Options Multiple options are\
    \ available to choose from when it comes to the storage of session data.  Generally\
    \ speaking, session data can be stored on the client-side, the server-side, or\
    \ in external storage systems such as databases or caching systems.  Every single\
    \ approach comes with its own set of benefits and difficulties. Client-Side Session\
    \ Storage Client-side storage involves keeping session data on the user's device,\
    \ typically within cookies.  This method is straightforward and doesn't require\
    \ any server-side storage resources.  However, it poses some challenges: \n\n\
    *   Limited Storage: Browsers restrict the amount of data that can be stored in\
    \ cookies. This limitation can be problematic for the GitforGits Bookstore if\
    \ there's a need to store large session data. \n\n*   Security Concerns: Client-side\
    \ storage can be vulnerable to attacks. Therefore, sensitive data should never\
    \ be stored on the client side without proper encryption. \n\nFor example, you\
    \ can set a cookie with session data like this: http.SetCookie(w, &http.Cookie{\
    \     Name:    \"session\\_token\",     Value:   \"some\\_token\\_value\",   \
    \  Expires: time.Now().Add(72 \\* time.Hour), }) Server-Side Session Storage Storing\
    \ session data on the server offers more flexibility and security.  The client\
    \ is typically given a unique session ID, which is then used to fetch the session\
    \ data from the server.  This method is scalable and can handle larger data sets. "
  fmt: "\n# Summary\n\n在本章中，我们重点介绍了如何充分利用并发，具体关注 GitforGits 书店。高效处理大量任务（无论其时机如何）的能力称为并发。这意味着处理各种用户交互，例如浏览书籍和进行购买，并确保无论同时有多少用户在使用，它们都能顺畅运行。了解并发与并行之间的区别至关重要。尽管两者都旨在最大化效率，但两者之间存在差异。并发非常适合处理各种用户请求，因为它擅长同时处理多个任务。这里的重点并非并行，而是利用多核\
    \ CPU 架构同时运行大量任务。为了保证用户交互及时且无缝，GitforGits 非常重视并发。关于如何将并发付诸实践，特别是关于使用 goroutines，有很多需要学习的地方。使用\
    \ goroutines 时要小心，尽管它们很轻量。过度使用可能导致资源耗尽。当多个进程同时尝试访问同一共享资源时，就会发生数据竞争；为了防止这种情况，使用适当的同步技术（如\
    \ `sync.Mutex`）至关重要。当 goroutine 内部发生运行时错误时，必须有像 defer-recovery 这样的错误处理机制来处理它们。即使一个\
    \ routine 失败，整个应用程序也不会受到影响。此外，还强调了彻底的并发测试、允许活动 goroutine 完成任务以及执行适当的系统关闭是必不可少的做法。请求管理是\
    \ GitforGits 书店的首要任务。为了实现这一点，本章概述了可以与并发结合使用的各种方法和技术。为了保持书店系统的顺畅运行，学习基础知识并深入研究\
    \ goroutine、同步、错误处理和测试等更复杂的主题是必要的。\n\n# Chapter 7: Sessions, Authentication, and\
    \ Authorization\n\n## User Sessions Overview\n\n在 Web 应用程序中，用户体验至关重要，并且经常决定一个平台是否成功。会话概念的应用对于提供流畅且个性化的用户体验至关重要。会话不仅对于确保用户交互保持一致至关重要，而且还代表了用户与应用程序之间临时且交互式的信息交换。对于\
    \ GitforGits 书店等 Web 应用程序，会话是确保用户无论是在不同页面之间导航还是在休息后返回，都能获得一致体验的最重要因素。想象一下，一个正在浏览\
    \ GitforGits 书店的用户。在浏览、搜索书籍、将商品添加到购物车和阅读评论期间，会话在维持这种交互的连续性方面发挥着重要作用。如果没有会话，每个页面的导航都会导致上下文丢失，使用户的体验变得支离破碎且令人沮丧。会话是弥补这一差距的有效手段。在\
    \ GitforGits 的上下文中，会话使得存储基本用户数据成为可能，例如用户购物车的内容、搜索历史记录以及他们可能设置的任何个性化设置或推荐。这有助于确保用户的购物体验顺畅且不间断。会话不仅用于确保连续性，而且在个性化用户体验方面也发挥着重要作用。现代互联网用户在访问在线平台时已经开始期待个性化体验。在书店环境中，可以通过多种方式实现个性化，包括根据之前的购买和浏览记录推荐书籍，以及发送个性化问候。在会话期间，GitforGits\
    \ 书店能够存储和检索特定于每个客户的数据。这使得每个客户都能拥有既个性化又有趣的购物体验。另一方面，会话的重要性不仅限于用户体验，它们对于安全目的也至关重要。例如，考虑用户身份验证系统。用户在\
    \ GitforGits 平台上登录后，每次访问新页面都必须重新输入凭据，这既不切实际也不安全。会话可以通过保留用户的身份验证状态来解决这个问题，使用户在成功登录后能够在其个人资料下无缝导航。由于这种便利性，安全的会话管理至关重要，因为任何安全漏洞都可能导致未经授权的访问或数据泄露等漏洞。对于\
    \ GitforGits 来说，随着用户基数的不断增长，管理日益增加的并发会话数量是一项艰巨的挑战。在会话管理方面，系统的可扩展性和效率变得极其重要。为了实现这一点，有必要就会话数据的存储（无论是内存、数据库还是分布式系统）做出战略决策，并制定方法来确保数据访问既快速又无瓶颈。目标是确保会话处理机制的性能和可靠性不会随着用户数量的增加而下降，而是按比例扩展以满足不断增长的需求。对于我们的书店来说，掌握这一方面不仅仅是一种增强，而是一种必需。这是因为它保证了用户无论平台如何增长和扩展，都能拥有安全、个性化且不间断的浏览体验。\n\
    \n## Store Session Data\n\n### Session Storage Options\n\n在存储会话数据时，有多种选项可供选择。一般来说，会话数据可以存储在客户端、服务器端或外部存储系统（如数据库或缓存系统）中。每种方法都有其自身的优点和挑战。\n\
    \n#### Client-Side Session Storage\n\n客户端存储涉及将会话数据保存在用户的设备上，通常在 cookie 中。这种方法很简单，不需要任何服务器端存储资源。但是，它带来了一些挑战：\n\
    \n*   **Limited Storage**: 浏览器限制了可以存储在 cookie 中的数据量。如果 GitforGits 书店需要存储大量会话数据，这种限制可能会带来问题。\n\
    *   **Security Concerns**: 客户端存储可能容易受到攻击。因此，在没有适当加密的情况下，绝不应在客户端存储敏感数据。\n\n例如，您可以像这样设置带有会话数据的\
    \ cookie：\n\n```\nhttp.SetCookie(w, &http.Cookie{  \n    Name:   \"session_token\"\
    ,  \n    Value:  \"some_token_value\",  \n    Expires: time.Now().Add(72 * time.Hour),\
    \ \n})\n```\n\n#### Server-Side Session Storage\n\n在服务器上存储会话数据提供了更多的灵活性和安全性。客户端通常会获得一个唯一的会话\
    \ ID，然后用于从服务器获取会话数据。这种方法具有可扩展性，可以处理更大的数据集。\n"
