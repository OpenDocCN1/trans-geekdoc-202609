- raw: "Implement User Authentication Every web application that stores user-specific\
    \ data or functionalities is required to have an authentication mechanism in place.\
    \  Through the use of user authentication, GitforGits Bookstore is able to provide\
    \ customers with a personalized shopping experience, as well as maintain user\
    \ profiles and keep track of previous purchases.  In addition to improving the\
    \ user experience, it also strengthens the security of our application by ensuring\
    \ that only authorized users are able to access particular functionalities or\
    \ data. Setting up Database Our bookstore application must store user credentials\
    \ in a database.  However, for security reasons, it's not advisable to store plain-text\
    \ passwords.  Instead, we will store a hashed version.  When a user tries to log\
    \ in, the system hashes the entered password and compares it with the stored hash.\
    \ type User struct {     ID       int     Username string     Password string\
    \ // This will store the hashed password } Registering New User When a new user\
    \ signs up, their entered password should be hashed before storage.  Go offers\
    \ the bcrypt library for this purpose, which is renowned for its security robustness.\
    \ import \"golang.org/x/crypto/bcrypt\" func RegisterUser(username, password string)\
    \ error {     hashedPassword, err := bcrypt.GenerateFromPassword(\\[\\]byte(password),\
    \ bcrypt.DefaultCost)     if err != nil {         return err     }     // Store\
    \ the user with the hashed password in the database. } Logging In an Existing\
    \ User During login, the user provides their credentials.  The system then retrieves\
    \ the hashed password associated with the entered username from the database,\
    \ hashes the provided password, and compares the two.  If they match, the user\
    \ is authenticated. func LoginUser(username, enteredPassword string) bool {    \
    \ // Retrieve the hashed password from the database based on the username    \
    \ storedHashedPassword := // retrieve from database     err := bcrypt.CompareHashAndPassword(storedHashedPassword,\
    \ \\[\\]byte(enteredPassword))     if err != nil {         return false // authentication\
    \ failed     }     return true // authentication successful } Managing User Sessions\
    \ Once the user is authenticated, the application needs to maintain that state\
    \ so that the user doesn't have to re-authenticate with every request.  This is\
    \ achieved using sessions.  After successful authentication, a session token is\
    \ generated and sent to the user as a cookie.  This token is then used to verify\
    \ the user's identity on subsequent requests. Logging Out User Logging out essentially\
    \ means invalidating the user's session.  To accomplish this, the session token\
    \ is deleted from both the server and the client-side. func LogoutUser(sessionToken\
    \ string) {     // Remove the session token from server storage     // Send a\
    \ response to the client to delete the session cookie } \n\nProtect and Secure\
    \ User Passwords In the early days of the World Wide Web, it was not unusual for\
    \ applications to store user passwords in databases in plain text format.  An\
    \ extremely high level of security risk is posed by this approach, which is analogous\
    \ to leaving the doors of user accounts wide open.  Within the context of an application\
    \ such as the GitforGits Bookstore, the protection of user passwords is just as\
    \ important as the protection of the books themselves.  It is possible that any\
    \ breach that exposes plain-text passwords could have severe consequences, putting\
    \ the trust of users and the integrity of applications at risk. Hashing Hashing\
    \ plays a crucial role in password security.  It involves transforming a password\
    \ into a fixed-size sequence of bytes, usually a lengthy string of numbers and\
    \ letters.  This process is one-way; while you can generate a hash from the original\
    \ password, it’s computationally infeasible to revert a hash back to its original\
    \ form.  Thus, when a user logs in, the application hashes the entered password\
    \ and compares this hash against the one stored in the database.  If they match,\
    \ the user is granted access. Given below is a simple example using Go’s bcrypt\
    \ package: import \"golang.org/x/crypto/bcrypt\" hashedPassword, err := bcrypt.GenerateFromPassword(\\\
    [\\]byte(plainPassword), bcrypt.DefaultCost) Salting However, hashing alone has\
    \ vulnerabilities.  Attackers can use precomputed tables (rainbow tables) to crack\
    \ hashes.  Salting addresses this issue.  It involves adding a unique random sequence\
    \ of characters (salt) to each password before hashing.  Consequently, even identical\
    \ passwords will produce different hashes. func hashPasswordWithSalt(plainPassword,\
    \ salt string) (string, error) {     combinedPassword := salt + plainPassword\
    \     hashedPassword, err := bcrypt.GenerateFromPassword(\\[\\]byte(combinedPassword),\
    \ bcrypt.DefaultCost)     return string(hashedPassword), err } Pepper While a\
    \ salt is stored with the hash, a pepper adds another layer of security.  It’s\
    \ a secret value mixed into every password before hashing, stored separately from\
    \ the database, potentially offline.  Thus, even if an attacker gains database\
    \ access, without the pepper, they can’t accurately recreate hashes. Implementing\
    \ a pepper involves adding it to the password-salting process: const pepper =\
    \ \"your-secret-pepper\" func hashPasswordWithSaltAndPepper(plainPassword, salt\
    \ string) (string, error) {     combinedPassword := salt + plainPassword + pepper\
    \     hashedPassword, err := bcrypt.GenerateFromPassword(\\[\\]byte(combinedPassword),\
    \ bcrypt.DefaultCost)     return string(hashedPassword), err } Iterations Brute\
    \ force attacks involve trying every possible combination until the right password\
    \ is found.  To render these attacks impractical, we use iterative hashing.  By\
    \ hashing the password thousands, or even millions of times, we significantly\
    \ slow down the verification process.  This minimal delay is imperceptible to\
    \ users but makes brute-forcing infeasible for attackers. Up-to-date Algorithms\
    \ Cryptographic methods evolve.  What’s considered secure today might be vulnerable\
    \ tomorrow.  It's crucial to stay updated with current cryptographic standards\
    \ and be ready to migrate to stronger algorithms.  Libraries like bcrypt automatically\
    \ handle many complexities, but developers must be vigilant and proactive. Beyond\
    \ these methods, follow general security guidelines.  Use HTTPS to ensure passwords\
    \ aren't intercepted during transmission.  Implement security headers to protect\
    \ against attacks like Cross-site Scripting (XSS), which could be used to steal\
    \ passwords.  Regularly audit your code and dependencies for vulnerabilities. "
  fmt: "\n# Implement User Authentication\n\nEvery web application that stores user-specific\
    \ data or functionalities is required to have an authentication mechanism in place.\
    \ Through the use of user authentication, GitforGits Bookstore is able to provide\
    \ customers with a personalized shopping experience, as well as maintain user\
    \ profiles and keep track of previous purchases. In addition to improving the\
    \ user experience, it also strengthens the security of our application by ensuring\
    \ that only authorized users are able to access particular functionalities or\
    \ data.\n\n## Setting up Database\n\nOur bookstore application must store user\
    \ credentials in a database. However, for security reasons, it's not advisable\
    \ to store plain-text passwords. Instead, we will store a hashed version. When\
    \ a user tries to log in, the system hashes the entered password and compares\
    \ it with the stored hash.\n\n```go\ntype User struct {\n    ID       int\n  \
    \  Username string\n    Password string // This will store the hashed password\n\
    }\n```\n\n## Registering New User\n\nWhen a new user signs up, their entered password\
    \ should be hashed before storage. Go offers the `bcrypt` library for this purpose,\
    \ which is renowned for its security robustness.\n\n```go\nimport \"golang.org/x/crypto/bcrypt\"\
    \n\nfunc RegisterUser(username, password string) error {\n    hashedPassword,\
    \ err := bcrypt.GenerateFromPassword([]byte(password), bcrypt.DefaultCost)\n \
    \   if err != nil {\n        return err\n    }\n    // Store the user with the\
    \ hashed password in the database.\n}\n```\n\n## Logging In an Existing User\n\
    \nDuring login, the user provides their credentials. The system then retrieves\
    \ the hashed password associated with the entered username from the database,\
    \ hashes the provided password, and compares the two. If they match, the user\
    \ is authenticated.\n\n```go\nfunc LoginUser(username, enteredPassword string)\
    \ bool {\n    // Retrieve the hashed password from the database based on the username\n\
    \    storedHashedPassword := // retrieve from database\n    err := bcrypt.CompareHashAndPassword(storedHashedPassword,\
    \ []byte(enteredPassword))\n    if err != nil {\n        return false // authentication\
    \ failed\n    }\n    return true // authentication successful\n}\n```\n\n## Managing\
    \ User Sessions\n\nOnce the user is authenticated, the application needs to maintain\
    \ that state so that the user doesn't have to re-authenticate with every request.\
    \ This is achieved using sessions. After successful authentication, a session\
    \ token is generated and sent to the user as a cookie. This token is then used\
    \ to verify the user's identity on subsequent requests.\n\n## Logging Out User\n\
    \nLogging out essentially means invalidating the user's session. To accomplish\
    \ this, the session token is deleted from both the server and the client-side.\n\
    \n```go\nfunc LogoutUser(sessionToken string) {\n    // Remove the session token\
    \ from server storage\n    // Send a response to the client to delete the session\
    \ cookie\n}\n```\n\n# Protect and Secure User Passwords\n\nIn the early days of\
    \ the World Wide Web, it was not unusual for applications to store user passwords\
    \ in databases in plain text format. An extremely high level of security risk\
    \ is posed by this approach, which is analogous to leaving the doors of user accounts\
    \ wide open. Within the context of an application such as the GitforGits Bookstore,\
    \ the protection of user passwords is just as important as the protection of the\
    \ books themselves. It is possible that any breach that exposes plain-text passwords\
    \ could have severe consequences, putting the trust of users and the integrity\
    \ of applications at risk.\n\n## Hashing\n\nHashing plays a crucial role in password\
    \ security. It involves transforming a password into a fixed-size sequence of\
    \ bytes, usually a lengthy string of numbers and letters. This process is one-way;\
    \ while you can generate a hash from the original password, it’s computationally\
    \ infeasible to revert a hash back to its original form. Thus, when a user logs\
    \ in, the application hashes the entered password and compares this hash against\
    \ the one stored in the database. If they match, the user is granted access.\n\
    \nGiven below is a simple example using Go’s `bcrypt` package:\n\n```go\nimport\
    \ \"golang.org/x/crypto/bcrypt\"\n\nhashedPassword, err := bcrypt.GenerateFromPassword([]byte(plainPassword),\
    \ bcrypt.DefaultCost)\n```\n\n## Salting\n\nHowever, hashing alone has vulnerabilities.\
    \ Attackers can use precomputed tables (rainbow tables) to crack hashes. Salting\
    \ addresses this issue. It involves adding a unique random sequence of characters\
    \ (salt) to each password before hashing. Consequently, even identical passwords\
    \ will produce different hashes.\n\n```go\nfunc hashPasswordWithSalt(plainPassword,\
    \ salt string) (string, error) {\n    combinedPassword := salt + plainPassword\n\
    \    hashedPassword, err := bcrypt.GenerateFromPassword([]byte(combinedPassword),\
    \ bcrypt.DefaultCost)\n    return string(hashedPassword), err\n}\n```\n\n## Pepper\n\
    \nWhile a salt is stored with the hash, a pepper adds another layer of security.\
    \ It’s a secret value mixed into every password before hashing, stored separately\
    \ from the database, potentially offline. Thus, even if an attacker gains database\
    \ access, without the pepper, they can’t accurately recreate hashes.\n\nImplementing\
    \ a pepper involves adding it to the password-salting process:\n\n```go\nconst\
    \ pepper = \"your-secret-pepper\"\n\nfunc hashPasswordWithSaltAndPepper(plainPassword,\
    \ salt string) (string, error) {\n    combinedPassword := salt + plainPassword\
    \ + pepper\n    hashedPassword, err := bcrypt.GenerateFromPassword([]byte(combinedPassword),\
    \ bcrypt.DefaultCost)\n    return string(hashedPassword), err\n}\n```\n\n## Iterations\n\
    \nBrute force attacks involve trying every possible combination until the right\
    \ password is found. To render these attacks impractical, we use iterative hashing.\
    \ By hashing the password thousands, or even millions of times, we significantly\
    \ slow down the verification process. This minimal delay is imperceptible to users\
    \ but makes brute-forcing infeasible for attackers.\n\n## Up-to-date Algorithms\n\
    \nCryptographic methods evolve. What’s considered secure today might be vulnerable\
    \ tomorrow. It's crucial to stay updated with current cryptographic standards\
    \ and be ready to migrate to stronger algorithms. Libraries like `bcrypt` automatically\
    \ handle many complexities, but developers must be vigilant and proactive.\n\n\
    Beyond these methods, follow general security guidelines. Use HTTPS to ensure\
    \ passwords aren't intercepted during transmission. Implement security headers\
    \ to protect against attacks like Cross-site Scripting (XSS), which could be used\
    \ to steal passwords. Regularly audit your code and dependencies for vulnerabilities.\n"
  trans: "\n\n# 实现用户身份验证\n\n每个存储用户特定数据或功能的 Web 应用程序都需要配备身份验证机制。通过使用用户身份验证，GitforGits\
    \ Bookstore 能够为客户提供个性化的购物体验，以及维护用户配置文件并跟踪之前的购买记录。除了改善用户体验之外，它还通过确保只有授权用户才能访问特定功能或数据来增强我们应用程序的安全性。\n\
    \n## 设置数据库\n\n我们的书店应用程序必须在数据库中存储用户凭据。但是，出于安全考虑，不建议存储明文密码。相反，我们将存储哈希版本。当用户尝试登录时，系统会对输入的密码进行哈希处理，并将其与存储的哈希值进行比较。\n\
    \n```go\ntype User struct {\n    ID       int\n    Username string\n    Password\
    \ string // This will store the hashed password\n}\n```\n\n## 注册新用户\n\n当新用户注册时，其输入的密码应在存储前进行哈希处理。Go\
    \ 提供了 `bcrypt` 库用于此目的，该库以其安全性强健而闻名。\n\n```go\nimport \"golang.org/x/crypto/bcrypt\"\
    \n\nfunc RegisterUser(username, password string) error {\n    hashedPassword,\
    \ err := bcrypt.GenerateFromPassword([]byte(password), bcrypt.DefaultCost)\n \
    \   if err != nil {\n        return err\n    }\n    // Store the user with the\
    \ hashed password in the database.\n}\n```\n\n## 登录现有用户\n\n在登录期间，用户提供其凭据。系统随后从数据库中检索与输入的用户名关联的哈希密码，对提供的密码进行哈希处理，并比较两者。如果它们匹配，则用户已通过身份验证。\n\
    \n```go\nfunc LoginUser(username, enteredPassword string) bool {\n    // Retrieve\
    \ the hashed password from the database based on the username\n    storedHashedPassword\
    \ := // retrieve from database\n    err := bcrypt.CompareHashAndPassword(storedHashedPassword,\
    \ []byte(enteredPassword))\n    if err != nil {\n        return false // authentication\
    \ failed\n    }\n    return true // authentication successful\n}\n```\n\n## 管理用户会话\n\
    \n一旦用户通过身份验证，应用程序需要维护该状态，以便用户不必在每次请求时重新进行身份验证。这是通过会话实现的。在成功身份验证后，会生成一个会话令牌并作为\
    \ Cookie 发送给用户。然后使用该令牌来验证后续请求中用户的身份。\n\n## 注销用户\n\n注销基本上意味着使用户的会话失效。要完成此操作，会话令牌将从服务器和客户端中删除。\n\
    \n```go\nfunc LogoutUser(sessionToken string) {\n    // Remove the session token\
    \ from server storage\n    // Send a response to the client to delete the session\
    \ cookie\n}\n```\n\n# 保护和保障用户密码安全\n\n在万维网的早期，应用程序将用户密码以明文格式存储在数据库中并不罕见。这种方法带来了极高的安全风险，类似于将用户账户的大门敞开。在\
    \ GitforGits Bookstore 这样的应用程序中，保护用户密码与保护书籍本身同样重要。任何暴露明文密码的泄露都可能带来严重后果，使用户信任和应用程序完整性面临风险。\n\
    \n## 哈希处理\n\n哈希处理在密码安全中起着至关重要的作用。它涉及将密码转换为固定大小的字节序列，通常是一长串数字和字母。这个过程是单向的；虽然你可以从原始密码生成哈希值，但在计算上无法将哈希值还原为原始形式。因此，当用户登录时，应用程序会对输入的密码进行哈希处理，并将此哈希值与数据库中存储的哈希值进行比较。如果它们匹配，则授予用户访问权限。\n\
    \n下面是使用 Go 的 `bcrypt` 包的简单示例：\n\n```go\nimport \"golang.org/x/crypto/bcrypt\"\n\
    \nhashedPassword, err := bcrypt.GenerateFromPassword([]byte(plainPassword), bcrypt.DefaultCost)\n\
    ```\n\n## 加盐\n\n然而，仅靠哈希处理存在漏洞。攻击者可以使用预计算表（彩虹表）来破解哈希值。加盐解决了这个问题。它涉及在哈希处理之前为每个密码添加一个唯一的随机字符序列（盐）。因此，即使是相同的密码也会产生不同的哈希值。\n\
    \n```go\nfunc hashPasswordWithSalt(plainPassword, salt string) (string, error)\
    \ {\n    combinedPassword := salt + plainPassword\n    hashedPassword, err :=\
    \ bcrypt.GenerateFromPassword([]byte(combinedPassword), bcrypt.DefaultCost)\n\
    \    return string(hashedPassword), err\n}\n```\n\n## 双盐\n\n虽然盐是与哈希值一起存储的，但双盐增加了另一层安全性。它是一个在哈希处理前混合到每个密码中的秘密值，与数据库分开存储，可能离线存储。因此，即使攻击者获得数据库访问权限，没有双盐，他们也无法准确重建哈希值。\n\
    \n实现双盐涉及将其添加到密码加盐过程中：\n\n```go\nconst pepper = \"your-secret-pepper\"\n\nfunc\
    \ hashPasswordWithSaltAndPepper(plainPassword, salt string) (string, error) {\n\
    \    combinedPassword := salt + plainPassword + pepper\n    hashedPassword, err\
    \ := bcrypt.GenerateFromPassword([]byte(combinedPassword), bcrypt.DefaultCost)\n\
    \    return string(hashedPassword), err\n}\n```\n\n## 迭代\n\n暴力攻击涉及尝试每一种可能的组合，直到找到正确的密码。为了使这些攻击不切实际，我们使用迭代哈希处理。通过对密码进行数千甚至数百万次哈希处理，我们显著减慢了验证过程。这种微小的延迟对用户来说是不可察觉的，但对攻击者来说使得暴力破解不可行。\n\
    \n## 最新算法\n\n加密方法在不断发展。今天被认为是安全的方法明天可能会变得脆弱。及时了解当前的加密标准并准备好迁移到更强大的算法至关重要。像 `bcrypt`\
    \ 这样的库会自动处理许多复杂性，但开发人员必须保持警惕和主动。\n\n除了这些方法之外，请遵循一般安全准则。使用 HTTPS 确保密码在传输过程中不会被截获。实施安全标头以防止跨站点脚本（XSS）等攻击，这些攻击可能被用来窃取密码。定期审计代码和依赖项中的漏洞。\n\
    \n"
