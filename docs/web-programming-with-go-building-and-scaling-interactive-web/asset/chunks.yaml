- raw: "*   Decoupling of Components: DI is able to significantly reduce the tight\
    \ coupling that exists between the various components of an application, which\
    \ results in decoupling of those components. Instead of relying on concrete implementations\
    \ of their dependencies, components are specifically designed to depend on abstractions,\
    \ also known as interfaces. Using this abstraction, components become more interchangeable\
    \ and adaptable to changes in the environment. \n\n*   Enhancement of Testability:\
    \ The ease with which DI can be tested is one of the most notable advantages of\
    \ this development methodology. By injecting dependencies, it is possible to easily\
    \ replace actual implementations with mock objects or stubs. This is made available\
    \ by injecting dependencies. Having this isolation makes it possible to conduct\
    \ unit tests that are more focused, allowing the focus to be on the logic of the\
    \ component rather than its dependencies. \n\n*   Flexibility and Maintainability:\
    \ With DI, the configuration of components is externalized from the components\
    \ themselves, which allows for greater flexibility and maintainability. Because\
    \ of this separation, any modifications that are made to the configuration or\
    \ the implementation of a dependency do not require any changes to be made to\
    \ the component that is the recipient of those modifications. Applications end\
    \ up becoming more adaptable and less difficult to maintain as a consequence of\
    \ this. \n\n*   Lifecycle Management: Containers that manage the lifecycle of\
    \ dependencies are frequently used to facilitate a distributed infrastructure\
    \ (DI). In order to maximize the utilization of resources and the management of\
    \ those resources, these containers determine when to create new instances or\
    \ reuse existing ones. The automated management of lifecycles is especially useful\
    \ in complex applications, where the manual management of object lifecycles can\
    \ be prone to errors and can be a burdensome process. \n\n*   Scalability and\
    \ Integration: As applications expand, DI makes it simpler to incorporate new\
    \ components or services into the software development process. Increasing the\
    \ size of the application or integrating services provided by third parties becomes\
    \ easier to manage when components are not tightly coupled to one another. \n\n\
    *   Consistency and Standardization: DI encourages a consistent and standardized\
    \ approach to managing dependencies across an application, which makes it possible\
    \ to achieve greater consistency and standardization. The application of this\
    \ uniformity is advantageous, particularly in large teams, because it establishes\
    \ a distinct pattern for developers to adhere to. \n\nImplementing Dependency\
    \ Injection Utilizing DI in Go doesn't necessarily require complex frameworks.\
    \  Go's interfaces and the language's composability make DI simpler and straightforward.\
    \ Consider a simple example relating to our bookstore: type BookRepository interface\
    \ {     GetByID(id int) (\\*Book, error) } type SQLBookRepository struct {   \
    \  db \\*sql.DB } func (s \\*SQLBookRepository) GetByID(id int) (\\*Book, error)\
    \ {     // Implementation using SQL database } type BookService struct {     repo\
    \ BookRepository } func NewBookService(r BookRepository) \\*BookService {     return\
    \ &BookService{repo: r} } func main() {     db := //... initialization of the\
    \ database     sqlRepo := &SQLBookRepository{db: db}     bookService := NewBookService(sqlRepo)\
    \     // Use the bookService } In the above code snippet: \n\n*   BookRepository\
    \ is an interface that any book-related data source must implement. \n\n*   SQLBookRepository\
    \ is a concrete implementation using an SQL database. \n\n*   BookService contains\
    \ business logic related to books, with its data source (or repository) injected.\
    \ \n\n*   The main function showcases DI in action. We initialize the SQL repository\
    \ and inject it into the BookService. \n\nHealth Check Endpoints URLs that have\
    \ been specifically designed for use within a web application and that return\
    \ the status of the system are known as health check endpoints.  These endpoints,\
    \ when accessed, provide a quick snapshot of the system's health, indicating whether\
    \ or not all of the components and dependencies are functioning as expected. Setting\
    \ up Health Check Endpoints Basic Health Check A rudimentary health check merely\
    \ indicates if the service is running.  It doesn't verify if all dependencies\
    \ (like databases or external services) are operational but provides a quick way\
    \ to ascertain if the application instance is responsive. func (a \\*App) healthCheckHandler(w\
    \ http.ResponseWriter, r \\*http.Request) {     w.WriteHeader(http.StatusOK) \
    \    w.Write(\\[\\]byte(\"OK\")) } // During route initialization: a.Router.HandleFunc(\"\
    /healthcheck\", a.healthCheckHandler).Methods(\"GET\") When accessing /healthcheck,\
    \ the service will respond with a 200 OK status and the message \"OK\". Advanced\
    \ Health Check Besides verifying the service's status, a more thorough health\
    \ check also verifies its dependencies.  This could mean checking the health of\
    \ the database, ensuring connectivity to external services, or even determining\
    \ the status of internal caches for GitforGits Bookstore. func (a \\*App) detailedHealthCheckHandler(w\
    \ http.ResponseWriter, r \\*http.Request) {     // Check database health     if\
    \ err := a.DB.Ping(); err != nil {         w.WriteHeader(http.StatusInternalServerError)\
    \         w.Write(\\[\\]byte(\"Database Unreachable\"))         return     }    \
    \ // Additional checks (external services, cache systems, etc.) can be added here\
    \     w.WriteHeader(http.StatusOK)     w.Write(\\[\\]byte(\"OK\")) } // During\
    \ route initialization: a.Router.HandleFunc(\"/detailed-healthcheck\", a.detailedHealthCheckHandler).Methods(\"\
    GET\") Accessing or performing a detailed-health check provides a set of validations.\
    \  If any check fails, it returns an error message indicating the problematic\
    \ component.  While health checks are valuable, exposing detailed system information\
    \ can be a security concern.  It's wise to secure detailed health check endpoints,\
    \ ensuring only authorized personnel or systems can access them. These above endpoints\
    \ offer a proactive mechanism to detect issues, potentially even before they impact\
    \ users, ensuring that the digital bookstore provides a seamless, uninterrupted\
    \ experience to its audience. "
  fmt: "\n# 依赖注入（DI）的优势\n\n## 组件解耦\n依赖注入（DI）能够显著降低应用程序各组件之间的紧密耦合，从而实现组件的解耦。组件不再依赖其依赖项的具体实现，而是专门设计为依赖于抽象（即接口）。利用这种抽象，组件变得更加可互换，并能适应环境的变化。\n\
    \n## 测试性增强\nDI 可测试性高是这种开发方法最显著的优势之一。通过注入依赖，可以轻松地使用模拟对象或存根替换实际实现。这种隔离使得可以进行更专注的单元测试，将重点放在组件的逻辑上，而不是其依赖项上。\n\
    \n## 灵活性与可维护性\n使用 DI 时，组件的配置从组件本身外部化，从而提供了更大的灵活性和可维护性。由于这种分离，对依赖项的配置或实现所做的任何修改都不需要对接收这些修改的组件进行任何更改。因此，应用程序变得更加适应性强，也更容易维护。\n\
    \n## 生命周期管理\n管理依赖项生命周期的容器常用于促进分布式基础设施（DI）。这些容器确定何时创建新实例或重用现有实例，以最大限度地利用资源并管理这些资源。自动化的生命周期管理在复杂应用程序中尤其有用，因为手动管理对象生命周期容易出错，并且是一个繁琐的过程。\n\
    \n## 可扩展性与集成\n随着应用程序的扩展，DI 使得将新组件或服务纳入软件开发过程变得更加简单。当组件之间不紧密耦合时，增加应用程序的规模或集成第三方提供的服务变得更容易管理。\n\
    \n## 一致性与标准化\nDI 鼓励在整个应用程序中管理依赖项的一致且标准化的方法，从而实现更大的一致性和标准化。这种统一性的应用尤其有利于大型团队，因为它为开发人员建立了明确的遵循模式。\n\
    \n# 在 Go 中实现依赖注入\n\n在 Go 中使用 DI 不一定需要复杂的框架。Go 的接口和语言的组合性使 DI 变得简单直接。考虑一个与我们的书店相关的简单示例：\n\
    \n```go\ntype BookRepository interface {\n    GetByID(id int) (*Book, error)\n\
    }\ntype SQLBookRepository struct {\n    db *sql.DB\n}\nfunc (s *SQLBookRepository)\
    \ GetByID(id int) (*Book, error) {\n    // Implementation using SQL database\n\
    }\ntype BookService struct {\n    repo BookRepository\n}\nfunc NewBookService(r\
    \ BookRepository) *BookService {\n    return &BookService{repo: r}\n}\nfunc main()\
    \ {\n    db := //... initialization of the database\n    sqlRepo := &SQLBookRepository{db:\
    \ db}\n    bookService := NewBookService(sqlRepo)\n    // Use the bookService\n\
    }\n```\n\n在上述代码片段中：\n\n* `BookRepository` 是任何与书籍相关的数据源必须实现的接口。\n* `SQLBookRepository`\
    \ 是使用 SQL 数据库的具体实现。\n* `BookService` 包含与书籍相关的业务逻辑，其数据源（或存储库）被注入。\n* `main` 函数展示了\
    \ DI 的实际应用。我们初始化 SQL 存储库并将其注入到 `BookService` 中。\n\n# 健康检查端点\n\n专为 Web 应用程序设计并返回系统状态的\
    \ URL 称为健康检查端点。访问这些端点时，它们会提供系统健康状况的快照，指示所有组件和依赖项是否按预期运行。\n\n## 设置健康检查端点\n\n###\
    \ 基础健康检查\n基础健康检查仅指示服务是否正在运行。它不验证所有依赖项（如数据库或外部服务）是否正常运行，但提供了一种快速的方法来确定应用程序实例是否响应。\n\
    \n```go\nfunc (a *App) healthCheckHandler(w http.ResponseWriter, r *http.Request)\
    \ {\n    w.WriteHeader(http.StatusOK)\n    w.Write([]byte(\"OK\"))\n}\n// During\
    \ route initialization:\na.Router.HandleFunc(\"/healthcheck\", a.healthCheckHandler).Methods(\"\
    GET\")\n```\n\n访问 `/healthcheck` 时，服务将响应 200 OK 状态和消息 \"OK\"。\n\n### 高级健康检查\n\
    除了验证服务的状态外，更彻底的健康检查还会验证其依赖项。这可能意味着检查数据库的健康状况，确保与外部服务的连接，甚至确定 GitforGits 书店内部缓存的状态。\n\
    \n```go\nfunc (a *App) detailedHealthCheckHandler(w http.ResponseWriter, r *http.Request)\
    \ {\n    // Check database health\n    if err := a.DB.Ping(); err != nil {\n \
    \       w.WriteHeader(http.StatusInternalServerError)\n        w.Write([]byte(\"\
    Database Unreachable\"))\n        return\n    }\n    // Additional checks (external\
    \ services, cache systems, etc.) can be added here\n    w.WriteHeader(http.StatusOK)\n\
    \    w.Write([]byte(\"OK\"))\n}\n// During route initialization:\na.Router.HandleFunc(\"\
    /detailed-healthcheck\", a.detailedHealthCheckHandler).Methods(\"GET\")\n```\n\
    \n访问或执行详细健康检查将提供一组验证。如果任何检查失败，它将返回一条指示有问题组件的错误消息。虽然健康棋很有价值，但暴露详细的系统信息可能是一个安全问题。明智的做法是保护详细的健康检查端点，确保只有授权人员或系统可以访问它们。\n\
    \n上述端点提供了一种主动机制来检测问题，甚至可能在问题影响用户之前检测到，确保数字书店为其受众提供无缝、不间断的体验。\n"
  trans: "\n\n# 依赖注入（DI）的优势\n\n## 组件解耦\n依赖注入（DI）能够显著降低应用程序各组件之间的紧密耦合，从而实现组件的解耦。组件不再依赖其依赖项的具体实现，而是专门设计为依赖于抽象（即接口）。利用这种抽象，组件变得更加可互换，并能适应环境的变化。\n\
    \n## 测试性增强\nDI 可测试性高是这种开发方法最显著的优势之一。通过注入依赖，可以轻松地使用模拟对象或存根替换实际实现。这种隔离使得可以进行更专注的单元测试，将重点放在组件的逻辑上，而不是其依赖项上。\n\
    \n## 灵活性与可维护性\n使用 DI 时，组件的配置从组件本身外部化，从而提供了更大的灵活性和可维护性。由于这种分离，对依赖项的配置或实现所做的任何修改都不需要对接收这些修改的组件进行任何更改。因此，应用程序变得更加适应性强，也更容易维护。\n\
    \n## 生命周期管理\n管理依赖项生命周期的容器常用于促进分布式基础设施（DI）。这些容器确定何时创建新实例或重用现有实例，以最大限度地利用资源并管理这些资源。自动化的生命周期管理在复杂应用程序中尤其有用，因为手动管理对象生命周期容易出错，并且是一个繁琐的过程。\n\
    \n## 可扩展性与集成\n随着应用程序的扩展，DI 使得将新组件或服务纳入软件开发过程变得更加简单。当组件之间不紧密耦合时，增加应用程序的规模或集成第三方提供的服务变得更容易管理。\n\
    \n## 一致性与标准化\nDI 鼓励在整个应用程序中管理依赖项的一致且标准化的方法，从而实现更大的一致性和标准化。这种统一性的应用尤其有利于大型团队，因为它为开发人员建立了明确的遵循模式。\n\
    \n# 在 Go 中实现依赖注入\n\n在 Go 中使用 DI 不一定需要复杂的框架。Go 的接口和语言的组合性使 DI 变得简单直接。考虑一个与我们的书店相关的简单示例：\n\
    \n```go\ntype BookRepository interface {\n    GetByID(id int) (*Book, error)\n\
    }\ntype SQLBookRepository struct {\n    db *sql.DB\n}\nfunc (s *SQLBookRepository)\
    \ GetByID(id int) (*Book, error) {\n    // Implementation using SQL database\n\
    }\ntype BookService struct {\n    repo BookRepository\n}\nfunc NewBookService(r\
    \ BookRepository) *BookService {\n    return &BookService{repo: r}\n}\nfunc main()\
    \ {\n    db := //... initialization of the database\n    sqlRepo := &SQLBookRepository{db:\
    \ db}\n    bookService := NewBookService(sqlRepo)\n    // Use the bookService\n\
    }\n```\n\n在上述代码片段中：\n\n* `BookRepository` 是任何与书籍相关的数据源必须实现的接口。\n* `SQLBookRepository`\
    \ 是使用 SQL 数据库的具体实现。\n* `BookService` 包含与书籍相关的业务逻辑，其数据源（或存储库）被注入。\n* `main` 函数展示了\
    \ DI 的实际应用。我们初始化 SQL 存储库并将其注入到 `BookService` 中。\n\n# 健康检查端点\n\n专为 Web 应用程序设计并返回系统状态的\
    \ URL 称为健康检查端点。访问这些端点时，它们会提供系统健康状况的快照，指示所有组件和依赖项是否按预期运行。\n\n## 设置健康检查端点\n\n###\
    \ 基础健康检查\n基础健康检查仅指示服务是否正在运行。它不验证所有依赖项（如数据库或外部服务）是否正常运行，但提供了一种快速的方法来确定应用程序实例是否响应。\n\
    \n```go\nfunc (a *App) healthCheckHandler(w http.ResponseWriter, r *http.Request)\
    \ {\n    w.WriteHeader(http.StatusOK)\n    w.Write([]byte(\"OK\"))\n}\n// During\
    \ route initialization:\na.Router.HandleFunc(\"/healthcheck\", a.healthCheckHandler).Methods(\"\
    GET\")\n```\n\n访问 `/healthcheck` 时，服务将响应 200 OK 状态和消息 \"OK\"。\n\n### 高级健康检查\n\
    除了验证服务的状态外，更彻底的健康检查还会验证其依赖项。这可能意味着检查数据库的健康状况，确保与外部服务的连接，甚至确定 GitforGits 书店内部缓存的状态。\n\
    \n```go\nfunc (a *App) detailedHealthCheckHandler(w http.ResponseWriter, r *http.Request)\
    \ {\n    // Check database health\n    if err := a.DB.Ping(); err != nil {\n \
    \       w.WriteHeader(http.StatusInternalServerError)\n        w.Write([]byte(\"\
    Database Unreachable\"))\n        return\n    }\n    // Additional checks (external\
    \ services, cache systems, etc.) can be added here\n    w.WriteHeader(http.StatusOK)\n\
    \    w.Write([]byte(\"OK\"))\n}\n// During route initialization:\na.Router.HandleFunc(\"\
    /detailed-healthcheck\", a.detailedHealthCheckHandler).Methods(\"GET\")\n```\n\
    \n访问或执行详细健康检查将提供一组验证。如果任何检查失败，它将返回一条指示有问题组件的错误消息。虽然健康检查很有价值，但暴露详细的系统信息可能是一个安全问题。明智的做法是保护详细的健康检查端点，确保只有授权人员或系统可以访问它们。\n\
    \n上述端点提供了一种主动机制来检测问题，甚至可能在问题影响用户之前检测到，确保数字书店为其受众提供无缝、不间断的体验。\n\n"
