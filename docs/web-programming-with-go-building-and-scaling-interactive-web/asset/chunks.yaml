    # Traditional Vendoring and Go Modules


    Traditional vendoring has been replaced by a new approach within the Go community.
    An integrated mechanism for dependency management is provided by Go Modules, which
    eliminates the requirement for a vendor directory in an explicit manner. Go Modules,
    on the other hand, offer an opt-in vendoring mode that allows the `/vendor` directory
    to be populated by the `go mod vendor` command. This mode is designed for those
    individuals who continue to favor vendoring due to the benefits it offers.


    ## Implementing Package Management


    ### Initiating Go Modules

    If not done already, you then initiate Go Modules for the project. This creates
    the `go.mod` and `go.sum` files, tracking the project''s dependencies.


    ```

    go mod init gitforgits-bookstore

    ```


    ### Adding Dependencies

    As you code and import new packages, Go will automatically add them to the `go.mod`
    file. For manual addition:


    ```

    go get <package-name>@<version>

    ```


    This fetches the desired package version and adds it to the `go.mod` file.


    ### Updating and Removing

    Go makes it easy to update packages to newer versions or remove unused ones. To
    update:


    ```

    go get -u <package-name>

    ```


    To remove unused packages:


    ```

    go mod tidy

    ```


    ### Vendoring with Go Modules

    When it comes to those who are inclined towards vendoring, even with Go Modules
    in place, the process is straightforward. When you have finished managing your
    dependencies, simply run:


    ```

    go mod vendor

    ```


    This populates the `/vendor` directory with the project''s dependencies, ensuring
    builds use these vendored packages.


    ### Maintaining and Reviewing

    Periodically, it''s wise to review and update the dependencies. This not only
    fetches updates with potential new features but also ensures security by patching
    any vulnerabilities in the used packages.


    Go''s dependency management landscape has become more streamlined and efficient,
    particularly since the introduction of modules. This is especially true in that
    context. For the GitforGits Bookstore Web App, the focus continues to be on ensuring
    consistency, reproducibility, and isolation. This is true regardless of whether
    pure Go Modules are selected or whether the app is integrated with vendoring.


    # Model-View-Controller (MVC) in Go


    ## Understanding MVC

    The MVC paradigm is an architectural pattern that has stood the test of time,
    becoming a cornerstone for web applications across numerous programming languages.
    Its essence lies in compartmentalizing an application into three interconnected
    components:


    1. **Model**: Represents the data structure and business logic. In essence, the
    model is the backbone, housing the rules, data, and the logic to update or process
    this data.

    2. **View**: Focuses on the presentation layer. It''s what the end-users interact
    with - the UI. Views display data from the model to the user and send user commands
    to the controller.

    3. **Controller**: Acts as an intermediary between the Model and View. It takes
    user input from the view, processes it (with potential updates to the model),
    and returns the output display to the view.


    While Go isn''t strictly an MVC framework like Ruby on Rails for Ruby or Django
    for Python, its flexibility allows developers to architect web applications in
    the MVC style. The Go standard library, especially the `net/http` package, combined
    with several third-party packages, offers a comprehensive toolkit to implement
    an MVC pattern.


    ## Benefits of MVC


    * **Separation of Concerns**: By decoupling data handling, user interface, and
    control flow, the MVC pattern ensures that each component of the GitforGits Bookstore
    remains independent. This separation is conducive to parallel development, unit
    testing, and scalability.

    * **Modularity**: As the GitforGits Bookstore grows, adding features or making
    changes becomes less daunting. If, for instance, the way books are fetched changes,
    modifications are localized to the Model, without altering the View or Controller.

    * **Reusability**: Components, especially views and models, can be reused across
    different parts of the application. For example, a book model can be used in various
    contexts – search, recommendations, user history – without duplication.

    * **Maintenance**: A well-structured MVC application simplifies maintenance. With
    clear boundaries between components, locating issues, updating features, or refactoring
    becomes more straightforward.


    ![](image/image-0-7.jpg)

    Fig 2.3 MVC Architecture in Go


    ## Applying MVC to GitforGits Bookstore

    The heart of our application, the model, would include data structures related
    to books, users, orders, and reviews. Residing within `pkg/models`, they would
    interact with the database, ensuring data consistency, validation, and business
    logic. For example, the `book.go` file might contain the book struct, methods
    to retrieve books, add new books, or modify existing ones.


    The view, focusing on user interaction, would be implemented within `web/templates`.
    Using Go''s `template` package, these templates would render dynamic content.
    A `booklist.html` might display available books, while `userdashboard.html` presents
    a user''s order history and recommendations. These templates, combined with static
    assets in `web/static`, construct the visual layer of the Bookstore.


    Controllers, potentially residing within `internal/handlers`, handle HTTP requests,
    bridging the Model and View. For instance, `bookHandler.go` might process user
    requests related to books – fetching a list of books, retrieving a specific book''s
    details, or processing a new book review. These controllers take user input, interact
    with the model, and provide data to the views for rendering.


    The power of MVC lies in the interplay between its components. For GitforGits
    Bookstore, when a user browses a list of books, the flow is as follows:


    * User sends a request, which the controller handles.

    * The controller interacts with the model, fetching a list of books.

    * The model retrieves the data and sends it back to the controller.

    * The controller then provides this data to the view.

    * The view renders a page displaying the list of books to the user.


    ![](image/image-0-8.jpg)

    Fig 2.4 Application Flow


    By compartmentalizing responsibilities, MVC provides a logical roadmap for development
    and also ensures the application remains scalable, maintainable, and robust.


    # Programming Main Application Object


    ## Defining Application Object Structure

    The central hub, also known as the orchestrator, is the primary application object
    in web development. It is responsible for bringing together various application
    settings, including routes, handlers, middleware, and other components. This particular
    object serves as the fulcrum for the GitforGits Bookstore Web App. Its purpose
    is to guarantee that when a user interacts with our service, everything else operates
    without any problems. The life cycle of our application is managed by this object,
    which also handles incoming requests and decides how responses should be crafted
    and sent back to the user.


    In order to properly conceptualize the structure of our application object, it
    is essential to do so before beginning to write code. The following should be
    contained within this object:


    * **Routes**: Clear paths that map to various functionalities like viewing a book,
    creating a user account, or placing an order.

    * **Middleware**: Functions or utilities executed before hitting our main handlers—such
    as logging requests or verifying user authentication.

    * **Configuration**: Settings vital for our application, possibly loaded from
    a configuration file or environment variables.

    * **Database Connections**: Active connections to our data store, facilitating
    data fetches, updates, and deletions.

