  \ 用节能高速感测放大器的设计与分析\n\nVishal Yadav^(²⁹)\n\n电子工程系，VBS Purvanchal University，Jaunpur，U.P.，印度\n\
  \n#### 摘要\n\n本研究描述了不同类型感测放大器的比较分析。电压模式感测放大器 (`VMSA`) 和电流感测放大器 (`CSA`) 是静态随机存取存储器\
  \ (`SRAM`) 中广泛使用的两种放大器类型。由于混合感测放大器同时使用电流和电压感测，并采用低功耗技术，因此优于传统的电流或电压感测放大器。本研究论文的第一个目标是构建采用多阈值电压互补金属氧化物半导体\
  \ (`MTCMOS`) 的混合模式感测放大器，第二个目标是比较设计并确定哪一种在功耗和速度方面表现更好。感测放大器是互补金属氧化物半导体 (`CMOS`) 存储器中最关键的电路之一，在降低整体感测电压和延迟方面发挥着重要作用。电压模式传感放大器检测位线和位线反相线上的电压差。感测放大器广泛用于存储器以提高存储器读/写操作的速度。感测放大器的性能主要影响存储器访问时间和整体功耗。简单的分析表明，使用仅电流模式而非电压模式信号传输以及可变阈值\
  \ CMOS (`VTCMOS`)、`MTCMOS` 或 Gated `V[dd]` 低功耗技术，可以实现速度提升。该技术的意义在于使用低电阻电流电路来降低长互连线上的阻抗水平和电压摆幅。给出了不同感测放大器的延迟和功耗耗散的仿真结果。\n\
  \n**关键词：** 感测放大器，电压 SA，`MTCMOS`，`VTCMOS`，电流 SA，交叉耦合 SA，锁存型 SA，混合模式 SA，延迟，功耗耗散\n\n\
  ## 1. 引言\n\n基于 `SRAM` 的缓存存储器是超大规模集成 (`VLSI`) 芯片设计中最关键的组件。存储器和外围电路的性能可能会不利地影响整个系统的速度和功耗。读操作延迟是\
  \ `SRAM` 设计中最关键的因素。在锁存现象发生后，电流流动会自动停止。因此，电流感测放大器不会产生静态功耗耗散 [1]。因此，检测和锁存操作的延迟也与功耗耗散相关。由于存储器芯片占据了芯片表面积的\
  \ 90%，因此片上缓存存储器内的功耗已成为存储器芯片整体功耗的非常重要的部分 [2]。`SRAM` IC 中使用的基本感测放大器是 `CMOS` 交叉耦合反相器。输入和输出线同时工作。因此存在较高的时延和功耗耗散。由于输入阻抗高，该误差在锁存型感测放大器中被消除\
  \ [3]。根据输入信号的类型，感测放大器分为电压和电流感测放大器两类。电压感测放大器需要在检测电压差并将其放大到全摆幅范围之前在位线上产生电压变化。然而，随着技术的进步，决策跨度增加，电压摆幅降低到微米或亚微米水平。电流感测放大器放大来自位线或数据线的最低差分信号并以\
  \ `CMOS` 逻辑电平输出。\n\n小输入阻抗使其成为减少 `SRAM` 感测延迟和功耗耗散的最常用方法之一 [4]。本文包括对所有不同类型的电流和电压感测放大器的比较研究。\n\
  \n本文的新颖之处在于它解释了为什么在各自的感测放大器中会产生延迟和功耗耗散。本文研究了在不同电源电压下运行的多个感测放大器的功耗耗散 [5]。本研究分析了各种感测放大器设计的延迟和功耗耗散。上述讨论的布局如下。\n\
  \n电路原理图的设计以及各种类型感测放大器的实现和分析在 第 2 节 中介绍 [6]。第 3 节 在展示各种工作模式的同时分析了感测放大器的延迟和整体功耗耗散结果。本文在\
  \ 第 5 节 中得出结论。\n\n## 2. 感测放大器的设计\n\n\n\n\n\n读电路中最关键或必不可少的组件之一是感测放大器。其主要任务是将表示存储在\
  \ SRAM 存储单元中的数据（0 或 1）的位线上的微小电压差放大到可观的电压电平。因此，从 SRAM 存储单元外部观察到的数据应被正确分析。感测放大器根据其接收到的输入信号类型分为电压模式和电流模式感测放大器\
  \ \\[7\\]。\n\n### 2.1. 电压模式感测放大\n\n电压感测放大器将存储器单元读取期间位线上发生的微小电压摆幅放大，以驱动 CMOS 数字逻辑。交叉耦合锁存型感测放大器是最简单的电压感测放大器\
  \ \\[8\\]。\n\n#### 2.1.1 交叉耦合 CMOS 反相器锁存型感测放大器\n\nFigure 29.1 中的感测放大器由两个 CMOS 交叉耦合反相器组成。在瞬态域工作时，CMOS\
  \ 反相器具有极高的增益 \\[9\\]。为了作为感测放大器发挥作用，锁存器需要通过使位线相等而处于亚稳态位置。由于位线电容在读操作期间放电，因此在位线上产生了电压差。当存在显著的电压差时，感测放大器的\
  \ `SE` 信号通过 `SE` 引脚被使能。交叉耦合锁存对根据输入电压的类型移动到其稳定功能点之一。交叉耦合锁存感测放大器的输入和输出位于同一节点 \\[10\\\
  ]。位线电容连接到交叉耦合反相器的输入引脚。\n\n![Figure 29.1: Cross couple sense amplifier.](img/fig29_1_C.jpg)\n\
  \nFigure 29.1: Cross couple sense amplifier.\n\n位线之间应有足够的电压差以产生正确的输出。为了正确识别 SRAM\
  \ 存储单元中的数据，这使得位线能够放电直到产生显著的电压差。因此，做出正确决策需要很长时间 \\[11\\]。应使用传输门或解耦电阻保持输入和输出线分离，以避免决策延迟过长。由于输入差分级的输入阻抗很高，因此通过采用如图\
  \ Figure 29.2 所示的差分电路消除了此问题。\n\n![Figure 29.2: Latch type voltage SA.](img/fig29_2_C.jpg)\n\
  \nFigure 29.2: Latch type voltage SA.\n\n#### 2.1.2 锁存型感测放大器\n\n锁存型感测放大器具有高阻抗输入信号和强正反馈。顺序连接的锁存器由流经两个独立差分输入晶体管\
  \ `NM2` 和 `NM3` 的电流控制。锁存器是锁存感测放大器的一个重要组成部分，必须在读取操作之前处于亚稳态 \\[12\\]。晶体管 `PM4`、`PM6`、`NM1`\
  \ 和 `NM0` 包含高增益正反馈感测放大器。晶体管 `NM2` 和 `NM3` 作为差分放大器工作。感测放大器由晶体管 `NM4` 激活。锁存电路的延迟由\
  \ `NM5` 和 `PM2` 的使用控制。在感测模式下，`SE` 信号被拉高以打开 `NM4` 晶体管，进而驱动晶体管 `NM2` 和 `NM3` 作为共源差分放大器工作，之后将位线预充电至\
  \ `V[dd]`。晶体管 `PM3`、`PM6`、`NM1` 和 `NM0` 将极小的电压差放大到输出引脚的全摆幅 \\[13\\]。差分放大器检测并放大位线之间作为输入提供给其输入引脚的极小电压差。输入级采用差分放大器，输出级提供强正反馈，从而提高了锁存型\
  \ SA 的性能。锁存操作完成后关闭 SA，使其内部不再有电流流动。\n\n### 2.2. 电流感测放大器\n\n电流感测放大器仅对输入电流的微小差异进行轻微放大。\n\
  \n随着技术的进步，现代感测技术更适合高速、低功耗和大容量存储器。\n\n#### 2.2.1 基本电流感测放大器\n\nFigure 29.3 显示了电流感测放大器的基本电路。它由\
  \ 3 个 P 沟道金属-氧化物-半导体（`PMOS`）晶体管和 4 个 N 沟道金属-氧化物-半导体（`NMOS`）晶体管组成。\n\n![Figure 29.3:\
  \ :Basic current SA.](img/fig29_3_C.jpg)\n\nFigure 29.3: :Basic current SA.\n\n\
  通过打开感测 `SE` 信号来打开感测放大器。然后，电流通过 `PMOS` 晶体管从位线流向接近地电位的相应数据线。使用低电阻连接器在位线和 `V[dd]` 之间保持稳定的连接。位线电压保持恒定以获得固有的均衡作用\
  \ \\[15\\]。\n\n晶体管 `PM0` 和 `NM2` 的栅源电压、尺寸和饱和区都相等。晶体管 `PM3` 和 `NM3` 的饱和状态之间也存在相似性。假设有\
  \ `I` 电流流经 SRAM 单元。当感测放大器打开时，电流流经其两侧，这些电流可能相差 `I`。因此，需要进行电流感测。\n\n基本电流感测放大器的输出由流经数据线的不同或不同的电流或节点\
  \ `A` 和 `B` 处的差分电压构成，可在第二级中进行放大 \\[16\\]。\n\n### 2.3. 混合模式感测放大器\n\nFigure 29.4 显示了混合类型的感测放大器。它是电压和电流感测放大器的组合。Figure\
  \ 29.4 显示输入电流来自位线电容，输出电压取自交叉耦合反相器 \\[17\\]。\n\n![Figure 29.4: Hybrid SA.](img/fig29_4_C.jpg)\n\
  \nFigure 29.4: Hybrid SA.\n\n混合模式感测放大器由 12 个 `PMOS` 和 6 个 `NMOS` 组成。晶体管 `PM0` 和\
  \ `PM1` 用于将位线连接到 `Vdd`。晶体管 `PM6` 和 `PM4` 作为简单开关用于将位线连接到延迟线。`PMOS` `PM3` 和 `PM5`\
  \ 以及 `NMOS` `NM0` 和 `NM1` 构成交叉耦合锁存器，即正型反馈放大器。这用于将数据线上的微小电压差放大到全 CMOS 电压电平。`PM12`\
  \ 和 `NM9` 用作 `MTCMOS` 以减小延迟并降低功耗 \\[18\\]。在读操作之前，通过各自引脚的预预充电电路将位线和数据线保持在 `V[dd]`。在预充电期间，将\
  \ `SE` 置低以防止静态电流流经感测放大器到地。此时使 `EQ` 均衡信号置低并使节点 `A` 和 `B` 的电压相等。然后在读操作期间，使 `CS` 信号置低\
  \ `CSB` 信号置高一段时间以将位线电压传输到相应的数据线。交叉耦合感测放大器放大微小电压差并给出全电压摆幅。在单元 1 中存储时，位线和数据线保持在 `V[dd]`。将有一股非常小的放电电流流经相应的位线。而在单元\
  \ 0 中存储时，放电电流将从位线和数据线流向低于 `V[dd]` 的电压。\n\n## 3. 方法\n\n### 3.1. Mtcmos\n\n\n\n\n\n\
  为了优化延迟和功耗，`MTCMOS`（多阈值 CMOS）技术采用具有各种阈值电压的晶体管。低 `V[t]` 晶体管切换更快但静态功耗泄漏更多。然而，高 `V[t]`\
  \ 晶体管切换更慢，同时降低静态功耗泄漏 [19]。通过使用精心设计的电路，`MTCMOS` 设计策略可以在不产生后果的情况下优化功耗和延迟。睡眠晶体管的使用是\
  \ `MTCMOS` 泄漏功耗降低最流行的方法 [20]。睡眠晶体管用于构建为逻辑供电的虚拟电源线。\n\n### 3.2. 门控 V[dd]\n\n该方法提供了一种控制机制，当\
  \ `SRAM` 单元未使用时，可以禁用供电电压（`V[dd]`），从而防止任何漏电流。这显著降低了泄漏功耗 [21]。为了实现该控制机制，在 `SRAM` 单元的供电（`V[dd]`）或接地通道中添加了高阈值电压（高\
  \ `V[t]`）晶体管，而所有其他晶体管均被建模为低 `V[t]` 晶体管。因为它们比高 `V[t]` 晶体管翻转更快，所以使用低 `V[t]` 晶体管。结果\
  \ `SRAM` 单元运行速度很快。该设置优化了功耗和延迟 [22]。Figure 29.5 显示了感应放大器输出原理图。信号正确感应后，进行各种延迟和功耗耗散分析。预充电位线和输出线后，感应放大器产生位线足够大电压差所需的时间被视为延迟\
  \ [23]。\n\n![Figure 29.5: Output of basic SA.](img/fig29_5_C.jpg)\n\nFigure 29.5:\
  \ Output of basic SA.\n\n延迟包括放电和锁存类型延迟。放电延迟取决于位线电容。供电电压变化主要影响锁存延迟 [24]。Figures 29.6\
  \ 和 29.7 显示了用于 `SRAM` IC 的各种类型感应放大器的延迟和功耗耗散。\n\n![Figure 29.6: Delay calculation\
  \ of various types of SA.](img/fig29_6_C.jpg)\n\nFigure 29.6: Delay calculation\
  \ of various types of SA.\n\n![Figure 29.7: Power dissipation of various types of\
  \ SA.](img/fig29_7_C.jpg)\n\nFigure 29.7: Power dissipation of various types of\
  \ SA.\n\n## 4. Result and Discussion\n\n取 `C[DL]` = 1pF，`C[PL]` = 1pF 和 `C[Load]`\
  \ = 100pF 比较混合模式 SA 与不同类型电流和电压感应放大器的延迟和功耗耗散。延迟和功耗耗散如 Table 29.1 和 Figures 29.6、29.7\
  \ 所示，显示了本人论文工作的比较分析。\n\nTable 29.1: Delay and power dissipation\n\n| Types of SA\
  \  || Delay (ns) || Total power dissipation (mW) || Work |\n| --- | --- | --- |\
  \ --- |\n| Bit-line capacitance delay (ns) || Total power dissipation (mW) |\n|\
  \ Cross coupled CMOS inv. SA || 1.9880 || 0.804 || 1.4513 || 0.562 |\n| --- | ---\
  \ | --- | --- | --- |\n| Latch type voltage SA || 1.241 || 0.947 || 0.90593 || 0.662\
  \ |\n| Basic current SA || 0.2305 || 0.953 || 0.2305 || 0.953 |\n| Hybrid mode SA\
  \ || 0.1436 || 0.386 || 0.1048 || 0.270 |\n\n在 Table 29.1 中总结了四种类型感应放大器的延迟和总功耗耗散。\n\
  \n在混合模式 SA 中，总功耗耗散与交叉耦合反相器 SA、锁存型电压 SA、基本电流 SA 相比分别降低了约 55%、60% 和 90%。同样，在混合模式 SA\
  \ 中，总延迟与交叉耦合反相器 SA、锁存型电压 SA、基本电流 SA 相比分别减少了约 98.8%、84.43% 和 52%。\n\n## 5. Conclusions\n\
  \n感应放大器是 `SRAM` 存储器的非常重要的元件。其性能影响决策延迟以及存储器中的总功耗耗散。结果表明混合模式感应放大器具有更低的延迟和较低的功耗耗散。Figure\
  \ 29.6 显示 `delay_1` [1] 而 `delay_2` 显示了设计的原理图结果。具有 `MTCMOS` 的混合模式感应放大器相对于其他感应放大器具有更快的速度和更低的功耗耗散。在交叉耦合感应放大器中，由于输入和输出引脚相同，因此放电需要更长时间。\n\
