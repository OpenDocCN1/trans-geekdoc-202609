  \ Kumar Singh**\n\n**Tanveer J. Siddiqui**\n\n# 1 Intelligent Hybrid Tourist Recommendations:\
  \ Unifying Data Analysis and Machine Learning\n\n*Nayma Khan*^(¹)\n\n### Abstract\n\
  \n本文介绍了一种新颖的混合旅游推荐系统，该系统集成了 K 近邻（`KNN`）、卷积神经网络（`CNN`）和决策树算法，并使用统计产品与服务解决方案（`SPSS`）软件。系统通过纳入用户偏好的多个维度解决了传统推荐系统的局限性。用于分析的综合数据集包括套餐名称、评论、评分、城市和月份信息。通过在\
  \ `SPSS` 中进行的探索性数据分析和描述性统计，提取了有关旅行者偏好的宝贵见解。混合系统结合了 `KNN` 用于识别相似用户、`CNN` 用于评论的情感分析以及决策树用于基于偏好和情境因素的用户画像。通过考虑用户评分、评论、城市和月份信息，系统生成与个人偏好和情境因素高度一致的个性化推荐。本研究有助于推荐系统的进步，使旅行社和用户均受益。所提出的混合方法展示了在\
  \ `SPSS` 内集成多样化算法的潜力，从而提高了推荐准确性。未来的研究可以探索纳入额外的算法和数据源，以进一步增强系统的性能。\n\n**Keywords:**\
  \ Hybrid recommendation system, K-nearest neighbor (`KNN`), algorithm convolutional\
  \ neural network (`CNN`), algorithm decision tree, algorithm intelligent system\
  \ data analysis.\n\n### 1. Introduction\n\n\n\n\n\n旅游业正在经历指数级增长，为游客提供了大量的出行选择 [19]。然而，这种选择的\
  \ abundance 往往导致游客在寻求个性化且合适的目的地和套餐时出现决策挑战。为解决这一问题，智能推荐系统已成为宝贵的工具，帮助游客做出明智的旅行决策。本研究论文重点关注一种混合游客推荐系统的开发，利用统计学社会科学软件包（SPSS）的能力，该软件以智能数据分析而闻名。\n\
  \n本研究的主要目标是设计一种混合推荐系统，将多种算法融合在一起 [15]，包括 K-最近邻（KNN）、卷积神经网络（CNN）和决策树。通过集成这些算法 [7,\
  \ 8]，系统旨在提供更准确、更个性化的推荐，以满足游客多样化的偏好和需求。\n\n所提出的系统利用包含套餐名称、评论、评分、城市和月份等关键信息的数据集 [14]。该数据集作为在\
  \ SPSS 环境中进行智能数据分析和建模的基础。通过严格的探索性数据分析和描述性统计，有价值的旅行者偏好和模式洞察被提取出来 [11]。混合系统利用 KNN\
  \ 进行用户相似性分析，利用 CNN 进行评论的情感分析 [22]，并利用决策树根据偏好和其他相关因素进行用户画像 [9]。\n\n本研究采用 SPSS 进行全面的数据处理、模型学习和模型验证。SPSS\
  \ 提供了一套广泛的统计和分析工具，并辅以强大的可视化功能，使研究人员能够生成有意义的洞察，并使用各种图表和图形直观地表示结果。\n\n通过构建利用 SPSS\
  \ 的混合推荐系统，本研究为智能游客推荐系统的进步做出了贡献。系统的有效性通过细致的模型验证进行评估 [16]，确保提供准确且个性化的推荐，针对个人偏好和情境因素量身定制\
  \ [10]。本研究的发现对旅行社具有重大的实际意义，使其能够为客户提供有针对性和令人满意的旅行体验。\n\n总之，本研究论文提出了一种混合游客推荐系统，将 KNN、CNN\
  \ 和决策树算法融合在一起，利用 SPSS 的强大功能。本研究强调了智能数据分析的重要性，并突出了 SPSS 在开发复杂的推荐系统中的实用性。后续章节将详细阐述方法、实验设置、结果和讨论，提供对系统性能及其对旅游业影响的全面理解。\n\
  \n### 2. 文献综述\n\n根据我们对所有趋势和技术的分析和评估，游客推荐系统的首要目标是减少冷启动问题 [24]，并在一定程度上提高推荐算法的预测准确性。众多技术评估的结果如下：\n\
  \n* 推荐系统中经常采用的方法之一是协同过滤 [13]。数据稀疏性是影响协同过滤预测效果的主要因素 [1, 2]。协同过滤系统也受到“新用户”问题的影响。所有预测必须在插入新评分后立即更新。\n\
  * 作者 Fengsheng 和 Zheng [3] 还谈到了为旅行推荐系统收集用户数据、交互日志、旅游景点数据和情境数据 [20] 的情况。\n* Haymontee\
  \ Khan 提出的旅游推荐系统（TRS）[4] 是混合的，因为它结合了三种推荐系统协同过滤（CF）、基于内容的过滤（CB）和人口统计过滤（DF），使用两种混合技术，即加权和切换方法。建议的解决方案解决了每种推荐方法的缺点\
  \ [12]，同时获得了每种方法的优点 [5]。\n* Jyotirmoy Gope [7] 提到一个项目，旨在将大数据和人工智能（AI）结合起来创建智能工具\
  \ [18]，以定位并推荐最合适的旅行优惠、监控和分析意见，并估计旅行需求。\n* 创建和集成一个符合众多标准且不需要先验知识的实时旅行建议系统 [6]。\n\n\
  ### 3. 拟议框架\n\n在本研究工作中，提出了一种个性化的混合过滤方法，用于游客推荐系统，使用三种算法：决策树、KNN 和 CNN。人口统计详细信息如套餐名称、评论、评分、城市和月份在注册时通过旅游网站收集\
  \ [23]。这些详细信息进一步用于根据用户需求过滤信息的过程。\n\n#### 3.1. 拟议混合游客推荐系统的架构\n\n拟议混合游客推荐系统的架构如图 Figure\
  \ 1.1 所示，给出了系统的整体工作流程。为了实现混合游客推荐系统，执行了以下步骤：\n\n![Figure 1.1: Proposed model of hybrid\
  \ recommendation system using various algorithms.](img/fig1_1_B.jpg)\n\nFigure 1.1:\
  \ Proposed model of hybrid recommendation system using various algorithms.\n\n1.\
  \ **数据收集：** 从各种来源收集了包含套餐名称、评论、评分、城市和月份信息的数据集。\n2. **数据预处理：** 对数据集进行清洗和预处理，以处理缺失值、删除重复项并标准化数据格式。\n\
  3. **探索性数据分析：** 采用描述性统计和数据可视化技术，以深入了解游客偏好、评分分布以及不同月份的旅行模式。\n4. **模型训练和验证：** 使用数据集训练模型，并使用适当的评估指标进行验证，以确保其准确性和性能。\n\
