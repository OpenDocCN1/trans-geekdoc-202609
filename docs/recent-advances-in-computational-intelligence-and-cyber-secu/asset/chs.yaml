  \ Location on the body of several commercially available wearable devices able to\
  \ perform pulse oximetry \\[13\\].](`images/fig5_7_C.jpg`)\n\nFigure 5.7: Location\
  \ on the body of several commercially available wearable devices able to perform\
  \ pulse oximetry \\[13\\].\n\n#### 3.4 Robotics\n\nSoft robots: Interactive and\
  \ movable robotic devices towards the environment can be created using SMAs designed\
