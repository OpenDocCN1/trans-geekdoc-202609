  \n# 4 人工智能和机器学习在工业中的应用：综述\n\nDipti Rai^4\n\n计算机科学与工程系，工程学院与技术学院，勒克瑙大学，印度北方邦\n\n\
  #### 摘要\n\n制造业的世界日新月异。研究人员专注于开发新思路，并以有助于使我们的工作更轻松、更快、更高效的方式制造事物。本研究论文全面回顾了计算机，特别是人工智能（AI）和机器学习（ML），在实现这一目标方面，尤其是在我们所称的工业\
  \ 4.0 中发挥的重要作用。为了理解这一点，作者查阅了许多数据库，如 SCOPUS 和 Web Science，以及专门的计算机程序，以帮助我们彻底研究这些信息。其核心是，AI\
  \ 和 ML 是一组复杂的算法和技术，解决预测、分组和分类方面的问题。ML 和 AI 的智能使用具有巨大前景。因此，该领域的研究极具价值。主要关注点是 AI 技术的实际应用及其在众多企业和社会中的整合。本文列出并探讨了\
  \ ML 和 AI 的工业用途。本文还描述了 AI 和 ML 的研究领域，这些领域将通过使用 AI 和 ML 应用为工业问题提供更好的解决方案。这项研究扩展了我们对计算机技术如何改变生产环境的认识。\n\
  \n**关键词：** 人工智能，机器学习，AI & ML 的应用，制造，分类\n\n## 1. 引言\n\n本研究是一篇研究兼综述论文。撰写本文的主要目标是考察机器学习（ML）和人工智能（AI）在不同行业中的使用情况。我们正在比较它们目前的使用方式、以前的使用方式，以及未来可能的发展。我们正在审视产品的整个生命周期，从它只是一个想法开始，到设计、生产、分销，甚至在客户使用时。论文的全部内容是关于行业在开始使用\
  \ AI 和 ML 之前的情况，使用这些工具后发生了什么变化，以及未来这些行业在 AI 和 ML 方面的预期。AI 和 ML 的格局不断演变，并在各个领域中日益关键，尤其是在信息系统（IS）研究中。AI\
  \ 常常被赞誉为市场融合后最近和最基本的进展之一，在当代讨论中占据突出地位。然而，在许多情况下，它与 ML 可互换使用，造成潜在的混淆和不精确。这种术语重叠不仅在实践中显而易见，例如\
  \ Facebook 首席执行官等知名人物的言论，也在学术文献中跨越不同的理论和应用导向的贡献中显而易见。AI 和 ML 术语周围的这种模糊性可能导致误解，阻碍研究和实践。这种区分在信息系统研究等跨学科领域尤其关键。本研究旨在阐明\
  \ AI 和 ML 在工业中的使用，特别强调 AI 在各种行业类型中的功能。本文的贡献是双重的：首先，我们确定 ML 和 AI 在不同层面上在行业中的不同角色。其次，我们认识到在有\
  \ AI 和无 AI 的部门中存在的问题。\n\n### 1.1. 人工智能\n\nAI 是一个动态领域，其根源在于创造能够复制过去仅限于人类的任务的机器智能的追求。它于\
  \ 1956 年在达特茅斯研讨会上首次提出“人工智能”一词时开始了其旅程。多年来，AI 的发展涵盖了多个不同的领域，包括计算机科学和编程到神经科学、机器人学、语言学、哲学和未来学\
  \ [1]。AI 的核心在于赋予机器常识推理能力的挑战——使计算机像人类一样轻松地理解日常事件。该领域处理传统算法难以解决的复杂、非线性和组合复杂问题，如规划、调度、图像理解等。为克服这些挑战，AI\
  \ 利用符号知识和启发式策略，通常称为“经验法则”。AI 研究大致分为两个基本支柱：知识表示和基于搜索的问题求解。知识表示涉及将人类知识翻译成计算机可以一致解释的格式。它旨在创建标准化的知识表示，使智能系统行为成为可能。这通常涉及将信息结构化为具有字段的数据库记录，旨在向机器可理解的语义化短语发展。第二支柱、基于搜索的问题求解，围绕着在广泛的解决方案空间中导航以找到最佳结果。\n\
  \n实用的 AI 解决方案需要更智能的搜索技术，将众多替代方案减少到可管理的水平。复杂的搜索架构，例如分层搜索系统，将问题求解过程分为预分析、搜索和后分析，逐步细化计划。总而言之，AI\
  \ 是一个跨学科领域，起源于 20 世纪中期，专注于创造能够模仿人类任务的机器智能。它努力使计算机像人类一样推理，解决非线性、复杂的问题。\n\n\n\n\n\n\
  ### 1.2. 机器学习\n\nSimon 将学习定义为“通过在时间中探索新信息而产生的行为变化和增强的过程”。当机器执行此定义中的“学习”时，就称为 ML。术语增强是指在\
  \ AI 过程中基于现有经验和样本创建最佳解决方案（Sırmaçek, 2007）。\n\n从数据中教会计算机学习的科学（和艺术）被称为 ML。对于更广泛的定义，请参阅此：被称为\
  \ \\[machine learning\\] 的研究分支使得计算机无需显式编程即可学习。1959 年，Arthur Samuel——此外，还有一个更偏向工程的定义。如果计算机程序在经历\
  \ E 之后在任务 T 上的表现 P 得到提升，则称其已从经验中学习到。这涉及某些任务 T 和某些性能度量 E。——Tom Mitchell, 1997。\n\n\
  ### 1.3. 应用机器学习：为什么？\n\n考虑一下你将如何用传统编程方法创建一个垃圾邮件过滤器。首先，你会检查垃圾邮件的典型外观。也许你已经看到某些术语或表达诸如“4U”、“credit\
  \ card”、“free”和“amazing”经常出现在主题中。也许你还会进一步看到电子邮件文本、发件人姓名等中的额外趋势。其次，你将为你看到的每个模式开发检测算法，如果你的程序识别出许多模式，它就会将电子邮件标记为垃圾邮件。最后，试用你的软件并不断返回到阶段\
  \ 1 和 2，直到它功能足够。\n\n考虑到问题的复杂性，你的程序很可能会变成一个冗长、复杂的规则集合，很难维护。然而，基于 ML 算法的垃圾邮件过滤器通过在垃圾邮件样本中相对于正常邮件出现情况寻找重复的词模式，自动学习哪些词和短语是垃圾邮件的有效预测因子（Figure\
  \ 4.1）。该程序很可能更容易维护、更短且更准确 \\[2\\]。\n\n![Figure 4.1: Machine learning approach.](img/fig4_1_C.jpg)\n\
  \nFigure 4.1: Machine learning approach.\n\n此外，如果垃圾邮件发送者发现所有包含该短语的电子邮件都被阻止，他们可能会开始用“For\
  \ U”代替“4U”。有必要升级一个使用传统编程方法来标记标有“For U”的电子邮件的自动防护。如果你设法让垃圾邮件过滤器失效，垃圾邮件发送者总会需要创建新的准则。然而，一个利用\
  \ ML 方法的垃圾邮件过滤器检测到术语“For U”已在用户识别的垃圾邮件中变得非常常见。这使得过滤器可以开始过滤消息而无需你的干预（Figure 4.2）。\n\
  \n![Figure 4.2: Adapting to change automatically.](img/fig4_2_C.jpg)\n\nFigure 4.2:\
  \ Adapting to change automatically.\n\n机器学习还可用于解决传统方法过于复杂或缺乏成熟解决方案的问题。在语音识别领域，假设你想从小处着手，创建一个可以区分“one”和“two”的程序。有人可能会硬编码一个检测高音声音强度的算法，并用它来区分一和二，因为单词“two”以高音声音（“T”）开头。当数百万人用数十种语言在嘈杂环境中说出成千上万个单词时，这种方法将不起作用。最好的答案是开发一个能够自行学习的算法，给定每个单词的海量样本录音（至少目前如此）。\n\
  \n最后，ML 可以帮助人们学习（Figure 4.3）：虽然这对某些算法来说可能具有挑战性，但可以评估 ML 算法以发现它们学到了什么。例如，一旦垃圾邮件过滤器在足够多的垃圾邮件上训练完成，就可以快速检查它以提供它认为是最好的垃圾邮件预测词和词组合的列表。这有时会揭示新的趋势或意想不到的相关性，从而对情况有更深入的理解。利用\
  \ ML 技术可以促进在大量数据中发现以前未识别的模式。我们称之为“数据挖掘”。\n\n![Figure 4.3: Machine learning can help\
  \ humans learn.](img/fig4_3_C.jpg)\n\nFigure 4.3: Machine learning can help humans\
  \ learn.\n\n### 2. AI 与 ML 技术的分类\n\nAI 涵盖了模仿或复制人类思维过程和行为的硬件和软件系统。基于系统相对于人类的“智能水平”\
  \ \\[3\\]，AI 被分类为强或弱。强 AI \\[2, 3\\] 也被称为通用 AI。现有的实际应用依赖于弱或软 AI，它展示了处理特定问题同时满足合理质量标准的能力。AI，无论是通用还是关键，都是研究的主题。AI\
  \ 涵盖了众多重要的科学领域，包括 ML、自然语言理解（NLP）、文本和语音生成、计算机视觉、机器人、规划和专家系统。AI 的各个领域如图所示。相当一部分 AI\
  \ 应用建立在 ML 技术之上，后者实现了 AI 的基本概念。ML 被应用于提高语音识别和语音中情绪识别等领域的成果 \\[4\\]。广泛的 ML 技术被用于经济规划和生产流程管理。ML\
  \ 是一种有效的数据分析工具，可以整合到各种专家系统中。目前，机器人研究主要集中在 ML 上 \\[10\\]。\n\n机器学习被广泛用于解决科学和应用中的问题。例如，考虑\
  \ ML 技术有多么适合，以及深度理解的前景对于解决化学问题有多么令人兴奋。众多领域，包括天文学、农业、计算生物学、市政管理、医学成像和天文学，都是 ML 应用可用的市场示例\
  \ \\[5–7\\]。另一个被积极使用的说法是 ML，它是当前自然语言理解研究的基石。\n\nML 方法根据其预期用途和学习方法进行分类。这些领域包括深度学习（DL）、强化学习（RL）、半监督教育（SSL）、聚类分析、降维、监督学习（SL）和无监督学习（UL）。无监督学习（UL）技术的目标是根据每个项目的特征自动将未标记的对象集合划分为单独或重叠的组。UL\
  \ 的目的是发现数据中的潜在模式、异常和差异。回归和分类被用于监督学习（SL）策略来解决问题。当有限的特定定义对象的子集被可能无限数量的事物包围时，会出现某些问题。当对象基于有限的整数集合，即所谓的类别编号进行标记时，就会发生分类问题。分类算法的工作是将指定数字中的一个分配给新发现的未标记对象。回归问题由包含实数的标签表示，包括整数和小数。在这些情况下，算法使用先前标记的项目来预测未标记对象的绝对数字。预测任务和数据缺口填充也由这种问题解决方案处理。\n\
  \n\n\n\n\n#### 深度学习技术\n\n深度学习（DL）技术通过采用具有众多隐藏层和专门架构设计的神经网络，来挖掘数据数组中的隐藏特征。在 DL 的背景下，迁移学习（TF）概念经常被研究。迁移学习的目的是通过从相关域转移知识来改进“来自一个域的学习者”。机器学习模型可分为经典和当代两类（Figure\
  \ 4.4）。经典 SL 模型包括但不限于以下种类：`k-NN`、逻辑回归、决策树（`DT`）、支持向量机（`SVM`）、前馈人工神经网络（`ANN`）。主成分分析和\
  \ k-means 是传统无监督学习方法的例子（`PCA`）。\n\n![Figure 4.4: Classic and modern ML models.](img/fig4_4_B.jpg)\n\
  \nFigure 4.4: Classic and modern ML models.\n\n#### 当代无监督学习\n\n当代无监督学习（UL）技术的例子如下：`ISOMAP`，或等距映射，线性嵌入技术（`LLE`），使用\
  \ T 分布的随机邻域嵌入（`t-SNE`），核的主成分分析（`KPCA`），多维缩放（`MDS`）。\n\n#### 当代监督学习和深度学习\n\n这些包括集成技术如\
  \ boosting 和随机森林，以及 DL 架构如长短期记忆（`LSTM`）、卷积神经网络（`CNN`）、循环神经网络（`RNN`），以及在当代监督学习（SL）、半监督学习（SSL）、强化学习\
  \ [8]（`RL`）和 DL 模型方面更多的内容。AI 子领域中发展最快的领域是 DL。深度学习是一组利用深度神经网络的技术，其中包含两个或更多隐藏层。这些深度架构的主要优势在于它们能够从头到尾处理任务。因为网络可以自行学习如何将图像或信号向量连接到目标变量，所以这种方法减少了必须对数据进行预处理的数量。通过选择关键特征，网络显著减轻了研究者任务的难度和复杂性。但这些优势在有足够量的训练数据\
  \ [9]并且选择了合适的神经网络设计时变得最为明显。在众多不同的架构设计中，有三种基本架构类型，从中形成了许多修改后的模型（见 Figure 4.5）。\n\n\
  ![Figure 4.5: Deep networks.](img/fig4_5_B.jpg)\n\nFigure 4.5: Deep networks.\n\n\
  #### 前馈和循环网络\n\n前馈神经网络（`FFNN`）在现实世界场景中被广泛用于解决分类和回归相关问题。循环神经网络能够处理持续时间不同的序列。当信号 `x(t)`\
  \ 在时间 `t` 接收时，它们补充网络的内部状态。下一个信号 `x(t+1)` 被整合以创建最终输出 `yˆ`，该输出取决于整个信号序列。网络的输出可以构成一个类别\
  \ designation 或一系列信号，用符号 `yˆ`、`yˆ h1i`、`yˆ h2i`、...、`yˆ h Tyi` 表示。根据它们生成和接收的序列类型，可以从循环网络中区分出四个主要类别。可以将\
  \ `FFNN` 视为一种一对一的 RNN 架构，如 Figure 4.6 所示。\n\n![Figure 4.6: Recurrent neural networks.](img/fig4_6_B.jpg)\n\
  \nFigure 4.6: Recurrent neural networks.\n\n一对多架构用于相对较短的输入序列导致更长的数据或信号序列的情况。例如，它可以用于文本生成和音乐生成过程中指定故事的主题或音乐作品的风格。分类任务是多对一架构的应用之一。情感分析就是一个例子，根据文本被认为的情感强度对其进行分类。这种分类是使用单个词和词组合创建的（例如，中性、负面、正面）。另一个用途是命名实体识别，例如专有名词、星期几、月份、地点、日期等。另一个用于\
  \ DNA 分析以确定基因值的元素是核苷酸序列。\n\n多对多架构用于语音识别和机器翻译。RNN 催生了生成对抗网络、生成预训练变换器（`GPT`）、语言模型嵌入（`ELMO`）、来自变换器的双向编码器表示（`BERT`）和\
  \ `LSTM` 模型。这些模型因其在 NL 处理相关问题上的有效性而被广泛接受。`CNNs` 使识别给定数据中的复杂模式成为可能。不管这些模式位于输入信号向量中的何处，它们始终保持不变。这些模式可以由垂直或水平线以及照片中发现的其他区分元素组成。\n\
  \n#### 卷积神经网络\n\n在网络训练期间，卷积滤波器的神经元权重被创建和调整。卷积技术被纳入以管理训练过程的计算复杂性。在图像处理任务中，`CNNs`\
  \  regularly 优于人类。这种深度神经网络设计受 `LeNet` 模型的启发，该模型是第一个使用池化、卷积滤波器和全连接神经网络（`FC`）进行图像分类的模型。该网络包含超过\
  \ 60,000 个网络参数，由两层全连接网络和四层卷积层组成。\n\n`AlexNet` 代表了通过扩展网络规模并加入最大池化实现的实际架构的进步。该网络的权重大约是\
  \ `LeNet` 的 100 倍。`VGGnet` 是另一个具有统一组件的庞大架构。`GoogleNet` 围绕 inception 模块设计，该模块便于使用具有不同大小的并行路径的卷积滤波器，确保检测不寻常特征。`ResNet`\
  \ 具有 152 层，利用残差模块来对抗梯度消失问题。卷积滤波器在单次识别和识别中被证明非常有效，如 `Yolo` 模型和图像分割任务所示，以及单元模型中所示。计算机视觉的最新发展与采用自注意力机制密切相关，通常称为变换器架构。当前应用此方法的模型在特定对象分类任务中取得了最先进的结果。值得注意的模型包括\
  \ Florence、Swin Transformer V2 和 DINO。\n\n#### 图神经网络\n\n图神经网络（`GNNs`）是 ML 中快速扩展的领域，特别旨在用于基于图的推理。得益于\
  \ `GNNs`，卷积神经网络更广泛且更适用于图结构数据。它们在结构化环境中是独特的，例如知识图谱、社交网络、分子和物理系统中的显式图结构。尽管如此，`GNNs`\
  \ 也可在非结构化环境中使用，在这些环境中需要创建特定于任务的图；例如，你可以为文本制作词图，或为图片制作场景图。`GNNs` 具有灵活性，可用于解决图分类、链接预测和节点分类相关问题。众多\
  \ `GNN` 变体，包括图循环网络（`GRN`）、图注意力网络（`GAT`）和图卷积网络（`GCN`），在文本分类、图像分类、物理、化学、图挖掘等多种 DL\
  \ 任务中表现出色 [11]。\n\n\n\n\n\nAI 和 ML 技术的分类提供了对其能力的清晰理解。基于 RNN 和 CNN 的深度学习方法目前正处于激烈发展之中。它们通常解决识别、推荐、NLP、数据处理、跟踪、个性化和学习方面的挑战。AI\
  \ 的潜力延伸至不确定数据的分析，通常结合模糊逻辑、路线集和基于可能性的理论。此外，AI 的可能性涵盖各个领域，在医学、农业、教育、社会环境、家庭环境和艺术方面具有重要应用。AI\
  \ 的作用与工业 4.0 的趋势密切交织，AI 技术构成了许多应用的骨干，特别是在安全、网络安全、物联网以及基于无监督方法的数据分析方面。\n\n### 3.\
  \ 制造业中的问题\n\n有几个令人信服的理由说明 AI 在制造业中如此重要 [12]。让我们来看几个重要问题：\n1. 专业知识匮乏：许多制造组织面临着保留即将退休专家的知识的挑战。这些知识很有价值，组织希望在丢失之前将其捕获。此外，他们还旨在将这种专业知识普及开来。该问题普遍存在于工艺规划、机械诊断、规划和设计工程项目等任务中。\n\
  2. 决策复杂性：制造中的决策可能变得高度复杂，主要是当存在众多选项时。这些选择可能涉及产品设计或生产计划。该问题在柔性制造系统中加剧，随着工厂车间适应性的增强，导致更多替代方案和决策。在极其严格的制造环境中做出此类决策可能已足够具有挑战性，而随着灵活性增强，这些决策的挑战也会升级。产品设计复杂性也导致决策复杂性增加\
  \ [13]。\n3. 信息复杂性：“无纸化工作场所”或“无纸化行业”的概念随着将工厂车间信息在线化的努力而获得关注。然而，这一转变带来了新的挑战：将互联网信息减少到仅对特定决策者必要的信息。向数字格式的过渡并不一定保证信息易于获取。对数据进行智能化、按个人需求提炼为可消化格式是一个尚未完全解决的复杂问题。\n\
  4. 决策及时性：除了决策复杂性不断增长外，做出这些决策可用的时间也在减少。定制化技术进步等降低了机器设置时间，要求更快、更智能的决策系统。问题是如何构建能够在更紧的时间范围内处理增加的决策复杂性的系统。\n\
  5. 协调：制造设计与制造、分销和现场服务密不可分。如果设计未考虑下游流程，可能导致更高的制造成本并可能降低产品质量。这增加了将计划与所有后续行动同步的难度。\n\
  \n这些问题共同影响制造过程的质量和生产率。这促使人们思考 AI 如何提供有价值的解决方案来应对这些挑战。AI 具有创建智能系统的能力，能够捕获数据、处理和提炼专家知识、辅助决策、管理复杂信息、及时做出决策，并在制造\
  \ [15] 的各个方面促进协调。因此，AI 是一种具有显著惠及制造业潜力的技术 [27]。\n\n### 4. 利用人工智能的制造业洞察\n\n最近的调查揭示了\
  \ AI 在解决制造挑战方面的广泛利用。这些调查结果显示 AI 在整个时间段内作用的显著发展。在 1960 年代和 1970 年代，制造业对 AI 的关注度不足。到\
  \ 1980 年代，情况发生了巨大变化，约有 68 个 AI 系统处于研究阶段，38 个处于开发阶段，9 个正在进行现场测试，14 个已投入生产使用。这约占正在积极研究的系统的四分之一，来自约\
  \ 125 个系统的反馈 [14]。\n\n截至 2023 年 1 月，全球处于各种开发和部署阶段的 AI 系统接近 42 亿，展示了 AI 技术在制造业中的使用日益增加，预计到\
  \ 2024 年将达到 84 亿。调查结果还强调了广泛的共识，即 AI 将对制造业产生实质性影响。关键问题仍然是：这种影响将在何处最为明显？在接下来的部分中，我们将通过研究生产过程各个阶段的影响区域来深入探讨这一主题。\n\
  \n### 5. 人工智能在设计中的见解\n\n设计包括制定产品规范，接下来是实际设计，随后是其验证。同时，执行了多项管理活动，并将最先进的 AI 技术应用于增强每个阶段。在当今环境中，产品规范通常通过\
  \ NL 描述传达。对于商业产品，这些描述可能跨越几章，而军用产品通常需要包含数万页的文件。审查基本需求以确保其全面性和连贯性仍然至关重要。在收集和评估规范方面，AI\
  \ 已取得显著进展。例如，像 XSEL 这样的系统 exemplify 了 AI 与收集客户产品规范集成的应用。XSEL 采用使用 NL 的界面来获取客户目标，有效分析客户需求，并与客户互动以构建其需求的全面实例。重要的是，该结构正在积极使用中。尽管如此，值得注意的是，对规范进行彻底分析、识别不一致性和差距仍然是一项艰巨的任务，代表着一个持续发展的领域。一旦获得规范并验证其准确性和连贯性，设计阶段即可开始。设计被广泛认为是生产程序中最复杂和最具创造性的方面之一。它不仅需要教育基础，还需要丰富的经验。因此，它仍然是一个知识密集型工作，依赖于分析性和启发性知识，使\
  \ AI 技术高度相关 [16]。\n\n\n\n\n\n在设计领域，识别出若干类别。第一类是“选择”，产品可从现有库存中挑选，通过将功能需求映射到现有产品线的特性上。像\
  \ `XSEL` 这样的系统，例如，就擅长将产品特性与用户功能需求进行匹配并识别最佳项目。“配置”代表一种稍微更复杂的设计类型。为了制造成品，必须组装半成品组件。目前有几种有效的配置方法在使用。例如，`VT`\
  \ 配置电梯系统，而 `XCON/R1` 配置计算机系统；两者均在现实环境中使用。这些技术比人工配置器更准确、更高效，表现出卓越的性能。第三种设计是“外推”。该方法涉及修改现有产品以满足特定客户要求。例如，像\
  \ `ALADIN` 这样的技术可以采用铝合金规格并修改现有合金的成分和热机械加工，以生成符合客户规格的新合金 [30]。\n\n“发现”代表设计中最具挑战性的类别。它类似于配置，但涉及从基本组件，如晶体管和电阻器开始，并将它们组合起来构建功能系统。像\
  \ `ALADIN`、`EURISCO` 和 `Talia` 这样的系统已有效地利用 AI 技术来解决发现问题，从基本组件创建复杂的可行设计。验证在设计完成后使用，以确保设计按预期工作。最受欢迎的策略是仿真，它应用先进技术，如机械部件的有限元分析和电子的电路仿真。特别是，AI\
  \ 验证寻求模仿人类验证技术 [17]，其中人们可以分析设计的结构并推断功能，而几乎不需要仿真帮助。尽管 `CORA` 系统在验证电力线路保护的继电保护系统的可靠性方面至关重要，但\
  \ `CONSTRAINTS` 和其他类似系统已显示出在确定电子电路操作方面的卓越技能。此外，AI 技术在工程项目管理中的应用正在增长。例如，`CALLISTO`\
  \ 系统的主要目标是处理与产品构思和设计相关的任务。它使用专业知识来加快活动管理，并使用知识表示来捕获动态对象和活动。AI 不断发展和重塑这些流程，提高其效能和效率。\n\
  \n### 6. 人工智能在生产计划中的见解\n\n产品定义和产品设计是此阶段的输入。它包括预测客户需求、管理生产过程、设置设施布局、概述维护协议以及协助员工培训。所有这些任务都通过\
  \ AI 积极优化 [18]。需求预测是一个从传统技术显著脱离的领域。研究基于规则的方法来模拟市场行为的研究人员正在营销组织中工作。通过更深入地了解特定消费者需求，这些创新解决方案超越了仅基于历史数据进行预测的标准技术。例如，`ROME`\
  \ 系统通过评估资源计划来解决预测问题。与 `VISICALCTM` 类似，它作为智能系统运行，可以理解自然语言输入。系统自动检查数据以确定是否达到生产目标，如果没有，则找出根本原因。\n\
  \n正在研究几种用于工艺规划的系统。例如，`ESP` 可用于规划钣金制造，而 `XPSE`，即 `GARI` 系统的扩展，用于规划三维机械部件的制造。这些基于规则的解决方案提高了规划过程的效率。传统方法在工艺编程方面对电子应用有益，从而实现自动化。然而，工艺编程对于机械操作，如化油器装配，仍然构成障碍。利用\
  \ AI 解决此问题仍在研究中，尤其是在电源装配方面。工艺编程工作还包括选择辅助资源，包括用于机械加工过程的切削液 [20]。诸如 `GREASE` 的系统正在进行现场测试，旨在为不同类型的机械加工过程选择合适的切削液\
  \ [28]。\n\n### 7. 人工智能在生产中的见解\n\n生产包括大量重要的制造过程组件。它包括产品检验、过程维护、生产单元控制、车间规划、排程和管理。排程作为组合问题的复杂性经常超过人工排程员的能力。AI\
  \ 在解决排程冲突方面已被证明非常有益。例如，`Isis` 系统使用约束导向搜索策略来安排车间。通过约束导向搜索，使用限制来降低组合复杂性，从而生成满足某些要求同时在其他方面允许灵活性的排程。`IMACS`\
  \ 从流程车间排程 [23] 的角度提供了对排程管理的不同观点。它的基础是墨菲定律，即凡是可能出错的事情，终将出错。`IMACS` 不依赖于严格遵守排程，而是预见异常并强调其识别和补救。\n\
  \n像日立的 `SCD` 系统和 `TRANSCELL` 这样的系统在单元层面采用相同的偏差导向方法。这些基于规则的系统对变化做出即时响应，确定接下来必须完成什么，并在受到干扰时迅速改变方向。基于规则和基于模型的方法均用于产品检验领域，以识别印刷电路板和计算机的问题。例如，`IDa`\
  \ 系统旨在测试完成的计算机，而 `IPWB~S` 专注于检查印刷布线板内层并识别生产过程缺陷。截至最新更新，AI 技术在这些领域继续进步，更加注重对偏差的实时适应以及增强检验技术以确保产品质量和制造效率\
  \ [24]。\n\n### 8. 利用人工智能进行现场服务和分销的见解\n\n\n\n\n\n#### 分销与现场服务\n\n分销和现场服务是产品制造后生命周期中的最后阶段。组织设计是分销的第一步；它涉及在哪里制造、生产多少、库存持有多少以及如何运送的决策。其他关键的分销任务包括订单录入、安排产品安装，以及在客户现场识别和修复问题。这些职业中的每一个都需要\
  \ AI。网络 `INET` 模拟组织结构，模拟其流程，并使用基于知识的仿真方法自主评估结果。决策过程借助这些仿真得到优化。`XSEL` \\[19\\] 进一步用于销售订单输入。`XSEL`\
  \ 的结果随后被输入到分销框架中，例如 `ILOG`，它决定订单的采购来源、装配地点以及最有效的运输方式。这些系统结合基于规则的方法来获取和利用熟练知识，并采用启发式搜索来提高解决方案质量。AI\
  \ 驱动的应用也彻底改变了安装规划。`XSITE` 系统用于确定计算机在客户现场的最佳位置和功能。\n\n最后，诊断和维修产品在 AI 领域获得了大量关注。`PDS`\
  \ 系统，也称为 `GENAID`，能够诊断从传感器到发电机和蒸汽涡轮机的问题。该系统已投入生产使用超过一年。`PDS` 提出了一个独特挑战，因为它必须应对传感器输入，而传感器输入可能比其监控的过程更快地恶化。在这种环境中进行诊断涉及区分不准确的传感器数据和实际过程故障，使问题变得更加复杂。虽然\
  \ `DOC` 专注于检测与计算机相关的问题，`CATS` 专注于柴油机车诊断，而 `ACE` 是一个专门设计用于诊断电话电缆中电缆故障的系统。基于规则的概念，这些系统利用上下文感知和启发式方法提供精确的诊断。模型化推理，即反映产品的物理结构和运行原理，在当前\
  \ AI 研究环境中可能变得更加重要。这种方法探索化学、物理和热力学等领域，以提高诊断能力。例如，`DART` 系统利用计算机的结构和功能特征来诊断它们。AI\
  \ 在这些领域不断进步，为优化分销流程、增强安装并提供更精确有效的产品诊断和维护服务提供了改进的能力 \\[21\\]。\n\n### 9. 人工智能在制造中的未来趋势\n\
  \n在前面的章节中，我们涵盖了生产过程的每个阶段，包括设计、规划、制造、分销和现场服务，并指出了 AI 的具体用途。有一个问题浮现在我脑海中：AI 在制造的未来中将扮演什么角色？\n\
  \n为了回应这一查询，我们必须以系统的方法来处理生产过程。需要考虑的两个重要视角是：\n\n1. 战略视角 – “设计融合”：根据战略视角，产品的设计应得到优化，以改善后续发生的活动。在产品设计过程中，这一被称为“设计融合”的理念旨在使用并反映现场服务、生产、分销和规划的集成知识。通过这样做，我们可以确保下游流程从一开始就得到优化。\n\
  \n2. 战术视角 – “按需开门”：战术视角集中于公司内部现有商品的流动 \\[22\\]。它提供了如何以及在哪里更快地接收商品的解决方案，以及如果商品现在不可用该怎么办。在产品设计方式不再可用的情况下，“按需开门”研究逆向工程技术。通过采用更全面的战略和战术方法来处理现有产品并将新设计引入公司，我们可以找到进一步优化和改进\
  \ AI 在现场使用的途径。\n\n简而言之，全面、系统化的方法将塑造 AI 在制造中的潜力。这种技术考虑完整的产品生命周期，并利用 AI 来改进某些阶段以及整体制造过程。这种全面的视角为制造带来更高的效率、创新和改善成果提供了可能性\
  \ \\[25\\]。\n\n### 10. 机器学习的应用\n\n在前面的部分中，我们深入探讨了人工智能 AI & ML 的分类以及 AI 的应用领域。在本节中，我们将探索\
  \ ML 方法的当代格局及其在我们日常生活中的普遍存在。机器学习的应用显著增加，消除了它仅保留用于广泛研究工作的观念。以下是各个领域值得注意的研究和应用：\n\n\
  #### 教育\n\n机器学习已成为一个关键的教育工具，主要提升学生的表现和成功。尽管近年来有众多教育举措，但实现期望的学术成功水平仍然是一个具有挑战性的努力\
  \ \\[31\\]。\n\n这一挑战受到许多因素的影响，使得很难辨别哪些因素具有最显著的影响。作为回应，研究人员已采用 ML 模型并取得了令人鼓舞的结果，利用调查数据预测学生的学业成功。\n\
  \n同样，ML 算法已被用于评估高等教育学生的能力。在 2007 年在帕穆卡莱大学进行的一项研究中，研究人员识别出在数学课程中可能挣扎的学生。调查显示，大学入学考试成绩（数学、科学、土耳其语）和高中毕业成绩等多个变量在预测数学成功方面发挥了关键作用。该研究使用了\
  \ 289 名学生的训练数据和 145 名学生的测试数据，结果准确估计了 86% 成功通过数学课程的学生 \\[26\\]。\n\n机器学习在教育领域继续找到实际应用，彻底改变了教学和学习的各个方面。\n\
  \n#### 自然语言处理\n\n旨在研究和分析自然语言的结构。可以进行许多 NLP 应用，如书面文本的自动翻译、问答机器、文本自动摘要，以及理解语音和命令。\n\
  \n#### 图像处理\n\n在此方法中，旨在处理和改善记录的图像。图像处理器使用的一些应用领域如下：安全系统、人脸检测、医学（用于诊断患病组织和器官）、军事（用于处理水下和卫星图像）、运动检测、物体检测，以及汽车、航空和生产，在故障发生前检测故障、生产自主车辆。\n\
  \n\n\n\n\n计算生物学：DNA 测序、寻找肿瘤和药物发现。零售 – 为个人定制货架分析、推荐引擎、物料和库存估算以及采购 – 需求趋势。健康：通过分析患者数据提供预警和诊断、疾病定义以及医疗保健分析。金融：信用控制和风险评估，以及算法交易。气象学\
  \ – 通过传感器进行天气预报。人力资源：从众多申请者中挑选最成功的候选人。能源 – 计算建筑设计的采暖和制冷负荷：电力使用分析与智能网络管理 \\[31\\\
  ]。\n\n### 11. 人工智能与机器学习的局限性与困难\n\n具有人工智能技术的系统需要熟练的专业人员，而此类经验丰富且合格专业人员的短缺或缺乏为市场带来了重大挑战。人工智能技术需要在机器学习、数据科学和软件工程方面具备专业知识。这些专业人员的需求超过供给，导致人才短缺，这可能减缓人工智能的开发、实施和创新。此外，这种短缺会限制人工智能解决方案在各个行业中的可扩展性\
  \ \\[29\\] 和有效性。因此，熟练专业人员的短缺被认为是对市场扩张构成挑战 \\[2\\]（表 4.1 和 4.2）。\n\n表 4.1：人工智能内部问题\n\
  \n| 人工智能技术内部问题  |\n| --- |\n| *数据* || *学习过程* || *结果* || *技术* |\n| 收集数据和进行初步处理的挑战\
  \ || 学习过程缓慢 || 透明度和可解释性问题 || 当前解决方案的不稳定性源于机器学习及其对背景噪声的依赖 |\n| --- | --- | --- |\
  \ --- |\n| 需要大量数据 || 需要巨大的处理能力 ||  || 当前机器学习模型单任务组件和受限关联性 |\n| 缺乏标注数据和繁琐的标注数据录入\
  \ || 缺乏复杂的图像处理工具 ||  || 需要为独特数据和应用场景创建新的机器学习模型 |\n| 数据安全、“偏见”和隐私 ||  ||  || 工业人工智能和机器学习应用需要网络基础设施\
  \ |\n\n表 4.2：人工智能外部问题\n\n| *人工智能技术外部问题* |\n| --- |\n| 组织 || 人员 || 经济 || 社会 |\n|\
  \ 缺乏人工智能采用计划 || 抗拒新技术和变革 || 人工智能解决方案的昂贵性质 || 工作替代和流失 |\n| --- | --- | --- | ---\
  \ |\n| 功能碎片化使以整合方式应用人工智能变得困难 || 合格人员短缺 || 为现实世界实施做准备不足 || 采用和信任 |\n| 缺乏对人工智能进步和领导力的投入\
  \ ||  || 财富差距和不平等 || 伦理 8c 道德问题 |\n| 技术基础设施不足 ||  || 新兴国家的经济 || 监管政策和法律问题 |\n\n\
  ### 12. 结论\n\n在所呈现的不同章节中，我们探讨了不断发展的 人工智能（AI） 格局及其核心组成部分机器学习（ML）。这些讨论阐明了 ML 与 AI\
  \ 之间的联系、它们的分类、实际应用，以及它们在不同领域所带来的障碍和可能性。我们深入研究了机器学习在各个领域的广泛应用，从教育到医疗保健和农业。这些例证展示了\
  \ ML & AI 的变革潜力，其作用不仅限于流程优化，还涵盖创造性问题解决。很明显，ML 不仅限于一个行业，而是已扩展到我们生活的许多方面。它还让我们了解了制造业以及人工智能如何影响生产过程的各个阶段。人工智能不仅在自动化任务，还在增强决策和优化运营。然而，仍然必须谨慎行事，因为对人工智能缺乏透彻的知识和理解可能会导致实施问题。总之，人工智能和机器学习的未来正由技术的持续发展和数据日益可获得性塑造，带来了机遇和挑战。为了充分利用这一潜力，我们必须谨慎对待这些技术，并力求更好地理解其能力和局限性。随着人工智能和机器学习的不断发展，它们有可能彻底改变行业、重新定义工作角色，并在我们的日常生活中产生深远影响。因此，我们必须适应这一不断变化的格局，利用人工智能和机器学习的能力推动创新，同时也承认并解决它们带来的挑战。\n\
