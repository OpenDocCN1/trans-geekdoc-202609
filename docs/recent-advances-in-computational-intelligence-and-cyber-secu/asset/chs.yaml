  |  ||  || 7.3–8 ||  |\n\n## 3. 参数分析\n\n为了使天线最优，选择 `Fw`、`Lg` 和 `W4` 进行研究。对于不同的 `Fw`\
  \ 值，图 25.4 显示了回波损耗。当馈电线宽度（`Fw`）设置为 2.9 mm 时，上 WiMAX 频段和 C 频段频率相比于一些期望频率略微向较低频率偏移。这意味着天线在这些频段的谐振频率略低于预期。因此，可能存在一些阻抗失配，这可能导致更高的回波损耗（源反射的信号较弱）和这些频率下天线效率降低。另一方面，当馈电线宽度（`Fw`）增加到\
  \ 3.1 mm 时，天线表现出低回波损耗。这意味着天线与期望频率匹配更好，从而改善信号传输和接收特性。阻抗匹配可能对这些频率最佳，导致信号反射最小。然而，当\
  \ `Fw` 精确设置为 3 mm 时，天线显示出最佳的整体性能。它不仅提供良好的回波损耗，还提供适当的阻抗匹配。\n\n![图 25.4 Fw 参数的分析。](img/fig25_4_C.jpg)\n\
  \n图 25.4 Fw 参数的分析。\n\n\n\n\n\nFigure 25.5 显示了不同 `Lg` 值下的回波损耗。`Lg` 本质上是指地平面的长度。`Lg`\
  \ 在 7 到 9 mm 之间变化。`Lg` 为 8 mm 的天线在回波损耗良好且具有适当的阻抗匹配方面取得了最佳结果。\n\n![Figure 25.5 Analysis\
  \ of Lg's parameters.](img/fig25_5_C.jpg)\n\n图 25.5 Lg 参数分析。\n\n在 Figure 25.6 中，展示了寄生元件宽度\
  \ `W4` 的参数分析。寄生元件位于基板底部。分析评估了 `W4` 的不同值及其对天线性能的影响。然而，当 `W4` 设置为 6 mm 或 8 mm 时，天线表现出较低的回波损耗。这意味着这些特定宽度会导致更好的阻抗匹配以及\
  \ WiMAX 频段更好的信号传输和接收特性。此外，当 `W4` 设置为 6 mm 或 8 mm 时，WiMAX 频段的上部频段和 C 频段频率会向较低频率移动。这意味着当使用\
  \ `W4` 值为 6 mm 或 8 mm 时，天线在这些频段的谐振频率略低。考虑到天线的整体性能和特性，确定寄生元件 `W4` 的最佳宽度固定为 7 mm。这种选择可能是基于在实现低回波损耗、适当阻抗匹配以及\
  \ WiMAX 频段和 C 频段所需的频率覆盖之间取得平衡。\n\n![Figure 25.6 Analysis of W4's parameters.](img/fig25_6_C.jpg)\n\
  \n图 25.6 W4 参数分析。\n\n### 4. 结果与讨论\n\n使用 `HFSS` 软件仿真的所提出天线设计表现出三个不同的频段，谐振频率分别为 3.5、5.5\
  \ 和 7.7 GHz。这些频率的回波损耗分别为 -37、−22 和 −25 dB，表明具有良好的阻抗匹配和最小的功率反射。\n\n为了进一步深入了解天线的性能，在\
  \ 3.5、5.5 和 7.7 GHz 的谐振频率下电流分布分别示于 Figures 25.7、25.8 和 25.9。这些图描绘了每个频率下电流在天线结构上的分布。通过检查电流分布，可以观察到高和低电流密度区域，这有助于理解天线在不同频率下的辐射能量方式。\n\
  \n![Figure 25.7 Dispersion of current at 3.5 GHz.](img/fig25_7_C.jpg)\n\n图 25.7\
  \ 3.5 GHz 时的电流分散。\n\n![Figure 25.8 Dispersion of current at 5.5 GHz.](img/fig25_8_C.jpg)\n\
  \n图 25.8 5.5 GHz 时的电流分散。\n\n![Figure 25.9 Dispersion of current at 7.7 GHz.](img/fig25_9_C.jpg)\n\
  \n图 25.9 7.7 GHz 时的电流分散。\n\n此外，天线的辐射方向图是评估其性能的关键因素。Figures 25.10、25.11 和 25.12 显示了天线在\
  \ Phi = 0°（E 面）和 Phi = 90°（H 面）下频率分别为 3.5、5.5 和 7.7 GHz 的辐射方向图。E 面是指垂直于天线轴的平面，而\
  \ H 面是包含天线轴的平面。对于 3.5 GHz 频段，所提出的天线在 E 面表现出全向辐射方向图，表明它在该平面内向各个方向辐射相等。然而，在 H 面，辐射方向图呈二维，表明天线在该平面内更有效地朝特定方向辐射。相比之下，对于\
  \ 5.5 和 7.7 GHz 频段，天线在 E 面和 H 面均在所需方向上表现出良好的辐射特性。这意味着天线设计为在这些频率下朝特定方向高效辐射能量，这对于需要聚焦或定向辐射的应用是理想的。\n\
  \n![Figure 25.10 Frequency=3.5 GHz.](img/fig25_10_C.jpg)\n\n图 25.10 频率=3.5 GHz。\n\
  \n![Figure 25.11 Frequency=5.5 GHz.](img/fig25_11_C.jpg)\n\n图 25.11 频率=5.5 GHz。\n\
  \n![Figure 25.12 Frequency=7.7 GHz.](img/fig25_12_C.jpg)\n\n图 25.12 频率=7.7 GHz。\n\
  \nFigure 25.13，提供了天线的顶视图和底视图，描绘了制作的天线。Figure 25.14 显示了使用仿真软件 `HFSS` 获得的测量结果与仿真结果之间的对比。两种结果的良好兼容性证明了所建议天线的实用性。\n\
  \n![Figure 25.13 Top and bottom view of fabricated antenna.](img/fig25_13_C.jpg)\n\
  \n图 25.13 制作天线的顶视图和底视图。\n\n![Figure 25.14 Fabricated and simulated result.](img/fig25_14_C.jpg)\n\
  \n图 25.14 制作与仿真结果。\n\n### 5. 结论\n\n提出了一种用于 WiMAX 和 C 频段应用的小型化单极子三频天线。该天线设计为在三个频段工作：3.1–4\
  \ GHz、5.3–5.8 GHz 和 7.3–8 GHz。所提出的天线具有非常紧凑的尺寸 20 × 26 × 1.6 mm³。使用 `HFSS` 软件对天线进行仿真结果证明了其有效性。天线在\
  \ 3.5、5.5 和 7.7 GHz 表现出谐振频率，对应于所需的频段。回波损耗值分别测量为 −37、−22 和 −25 dB（`S11`<–10 dB）。天线还为三个频率范围提供了足够的带宽，分别为\
  \ 900 MHz、500 MHz 和 700 MHz。基于本文中提出的仿真结果和详细设计，可以得出结论，所提出的天线能够实现 C 频段和 WiMAX 应用的三频操作。该天线的紧凑尺寸使其适合集成到各种无线通信设备中，而实现的带宽和回波损耗值确保了在预期频率范围内高效可靠的性能。\n\
