  \ actuator \\[15\\].\n\n![Figure 5.8(c):  Cable actuators \\[16\\].](`images/fig5_8_C.jpg`)\n\
  \nFigure 5.8(c):  Cable actuators \\[16\\].\n\n![Figure 5.8(d): : Dielectric elastomer\
  \ actuator \\[17\\].](`images/fig5_8_C.jpg`)\n\nFigure 5.8(d): : Dielectric elastomer\
  \ actuator \\[17\\].\n\nAs a result, innovative and fresh use of robots can be made\
  \ across different sectors including healthcare, manufacturing and at the times\
  \ of disaster relief.\n\nExoskeletons: SMAs also have the power to create exoskeletons\
  \ for assisting individual with disabilities and uplift the capabilities of healthy\
  \ patients \\[18\\].\n\nBiomimetic robots: Robots mimicking the movements and capabilities\
  \ of biological creatures fall under this category and for developing the same SMAs\
