  \ Figure 30.3、Figure 30.4 和 Figure 30.5 所示的 `SMC` 实验结果相比振荡非常大。\n\n### 3.4. Jetson\
  \ board for control signal computation\n\n目前作者正在使用 `Jetson` 开发套件与实时间歇反应器执行先进控制算法。需要使用电流-电压转换器和电压-电流转换器对传感器和执行器的信号进行适当的信号调理。`Jetson`\
  \ 板没有模数转换器 (`ADC`)，因此需要使用额外的 `ADC` 来接口传感器和执行器信号。先进控制算法使用 `Python` 代码开发。`GPIO` 引脚需要为传感器和执行器信号接口进行配置。使用此\
  \ `Jetson` 的优势将增加控制信号的计算时间，以处理具有硬约束的高度非线性控制算法，并与间歇反应器接口 (Figure 30.6)。\n\n![Figure\
  \ 30.6: Jetson developer kit for control algorithm execution in advanced process\
  \ control lab, MIT, Manipal for batch reactor.](img/fig30_6_C.jpg)\n\nFigure 30.6:\
  \ Jetson developer kit for control algorithm execution in advanced process control\
  \ lab, MIT, Manipal for batch reactor.\n\n## 4. Conclusions\n\n在本文中，使用间歇反应器的非线性模型方程设计了一类\
  \ `SMC`。三种不同类型的控制器在实验装置上对温度进行了仿真和验证。实验结果表明，基于 `PI` 滑模面的 `SMC` 具有最小的被控变量作用，这意味着用于温度跟踪的冷却水量最少。另一方面，如果我们看跟踪误差，基本\
  \ `SMC` 有帮助，但在这种情况下没有获得最优控制信号。因此，基于跟踪误差或需要最优控制信号来决定控制算法的选择。\n\n## 5. Acknowledgement\n\
