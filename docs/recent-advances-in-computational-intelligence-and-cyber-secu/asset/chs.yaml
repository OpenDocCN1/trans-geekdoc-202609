  \nRohit Sharma^(³⁶)\n\n#### 摘要\n\n在当今技术时代，生物医学成像技术在诊断关键疾病方面观察到快速变化和增长。腹部疾病在各年龄段人群中普遍存在。其中一种非常常见的疾病——胆囊结石，也可通过超声、CT\
  \ 扫描（腹部）和内镜超声等多种医学影像方法进行诊断，这些方法被临床医生非常有效地使用。智能计算方法已被证明对于快速准确的疾病诊断非常有帮助和有效，与医疗专家通过人工诊断方法相比，这对于在最短时间内以更高准确性准确诊断疾病非常有帮助。在本综述中，我们讨论了用于检测和分类胆囊结石的几种智能计算方法的性能。\n\
  \n**关键词：** 胆囊，智能计算，机器学习，深度学习\n\n## 1. 引言\n\n利用人工智能（AI）的系统已被用于提高医疗保健的功效和交付 \\[1,\
  \ 2\\]。其中许多代表了处理能力和神经网络的多年进步，神经网络是深度学习（DL）的基础，是科学的胜利。AI 诊断工具可以检测的疾病之一是视网膜疾病，但必须谨慎创建。工业界和学术界对基于\
  \ AI 的医学图像识别技术越来越关注 \\[3, 4 and 5\\]。尽管少数 AI 诊断方法与胆结石的检测相关，但少数已纳入临床实践。\n\n现代世界正在经历技术和文明的快速发展。人们的生活质量和生活水平显著提高，这是社会进步的积极因素。但并非只有积极的事情随之而来；例如，多种疾病可能会紧随其后。由于当今人们没有足够重视遵循饮食指南和保持良好卫生，消化系统疾病的可能性正在增加。胆囊和胆道系统疾病，特别是胆囊和胆道结石疾病，属于这些消化系统疾病\
  \ \\[6, 7\\]。\n\n相关研究统计表明，中国成人人群中胆结石和胆囊疾病的发病率约为 10%。患有此类疾病的患者更有可能同时患有胆囊结石和胆总管结石，概率在\
  \ 12%至 15%之间 \\[8\\]。因此，已经开展了许多临床应用，为胆总管结石和胆囊结石患者提供更实用和高效的治疗选择。内镜技术最初用于胆囊结石的治疗性治疗，得益于众多专业人员和研究人员的持续努力，如今已广泛应用于临床医学\
  \ \\[9\\]。\n\n## 2. 文献检索方法\n\n本文综述的框架基于出版年份、文章相关性、数据集收集方法、结果、所用技术和文章索引等参数。本文包含过去八年的论文，特别是关于胆结石诊断的论文，并提及上述参数。上述参数被归类为纳入标准，满足满意纳入参数的文章被考虑进行进一步分析。表\
  \ 36.1 解释了纳入和排除标准。\n\n表 36.1：纳入和排除标准\n\n| 参数 || 纳入标准 || 排除标准 |\n| --- | --- | ---\
  \ |\n| 出版年份 || 从 2015 年起 || 2015 年前 |\n| --- | --- | --- |\n| 文章相关性 || 独特文章 || 重复文章\
  \ |\n| 数据集收集 || 真实 || 本地收集 |\n| 技术 || 机器学习和深度学习 || 其他 |\n| 结果 || 准确率 >90% || 准确率\
  \ <90% |\n| 文章索引 || 科学引文索引和 Scopus || 其他 |\n\n从 表 36.1 中，符合纳入标准参数的文章被引用以供进一步分析，否则不被考虑纳入我们的分析。在本研究中，我们提出了一项系统文献综述，并讨论了之前研究的益处、所用技术和局限性，并指出了未来工作中需要开展的研究空白。\n\
  \n### 2.1. 数据提取方法\n\n\n\n\n\n在本节中，我们将讨论在此文献综述和分析中考虑的各种研究文章的选择。它可以被视为 Table 36.1\
  \ 的图形表示，但它包含了本次评审过程的整体文献检索策略。\n\n### 2.2. 智能计算在医学影像中的作用\n\n在本节中，我们讨论了 `AI` 和 `ML`\
  \ 方法的作用，并根据其性能、数据集收集以及为实现结果而应用的技术对其进行了概述。本节基本上提供了先前针对利用智能计算方法诊断胆结石的研究的概览。`DL` 算法可以帮助分析师进行疾病的早期检测、治疗和识别，因此可以为医学诊断提供有效的方法。事实上，`DL`\
  \ 算法可以直接处理并自动学习从大量原始收集数据中获得的中级和高级别抽象特征，其中高级别抽象特征是通过将它们与低级别特征结合起来定义的，以达到可接受的准确度水平，并最终执行自动\
  \ UI 分析任务，如分类、器官分割和对象检测 [10, 11 and 12] (Figure 36.1)。\n\n![Figure 36.1: Data extraction\
  \ methodology.](img/fig36_1_C.jpg)\n\nFigure 36.1: Data extraction methodology.\n\
  \n提出了一种用于在 Android 驱动的移动设备上检测胆结石的 `AI` 诊断系统。为此，我们首先从中国山东省第三医院收集一组胆结石 CT 图像。然后，我们使用一种称为直方图均衡化的技术对这些\
  \ CT 图像进行预处理。因此，获得了一个轻量级 `CNN` 用于提取胆结石特征并识别胆结石 [13]。\n\n尽管主观解释是一个局限性，但内镜超声 (`EUS`)\
  \ 是诊断胆囊息肉样病变 (`GB`) 的最准确的诊断模式。基于 `DL` 的 `AI` 算法正在开发中。我们使用 `EUS` 图像评估了 `AI` 在区分息肉样病变方面的诊断性能\
  \ [14]。\n\n为了为胆结石患者提供更安全、更高效的治疗选择，正在进行一项研究，以调查基于 `CNN` 分割算法的视觉传感技术辅助十二指肠镜检查在诊断和治疗胆结石中的应用效果\
  \ [15]。研究对象为 2016 年 1 月至 2021 年 4 月在我院入院的 188 名胆总管结石和胆结石患者。所有患者根据是否愿意在治疗期间使用 `AI`\
  \ 辅助视觉传感技术，被分为两组：`AI` 组和常规组 [16]。\n\n模糊 C 均值聚类 (`FCM`)、蛇形算法用于该胆结石检测方法中提取特征。边缘图与\
  \ `Sobel` 算子一起使用，以增强胆囊轮廓分割过程。随后进行基于模板的修改，采用凹陷去除算法 [17]。\n\n即使 `AI` 在医学图像分析中的性能似乎受损，开发算法的可解释性和可靠性概念也是必要的，因为它们处理的是健康辅助系统。通过对\
  \ `MRCP` 图像中发现的各种软组织进行分组，我们能够通过本研究开发的可解释方法来表述它们。应用 Tree Seed Algorithm (`TSA`)，一种受自然启发的基于深度神经网络的优化算法，得到了一个理想的学习机器，即使在低对比度\
  \ `MRCP` 图像中也能精确聚类 [18]。\n\n构建了一个 `CNN` 模型，该模型使用扫描的灰度和纹理特征对脂肪肝的超声图像进行排序和识别。准确率为\
  \ 90%，特异性为 92%，敏感性高于 81% [19]。在另一项研究中，使用 `ML` 方法，[20] 研究了胆囊中的胆结石和胆管。在另一项研究中，设计并测试了基于\
  \ `DL` 的决策支持系统 (`DL-DSS`) 在 `US` 上对 `GB` 多发性息肉进行鉴别诊断的实用性。我们回顾性收集了 535 名患者并将其分为两组：开发组\
  \ (n = 437) 和测试组 (n = 98)。迁移学习用于创建二元分类 `CNN` 模型 [21]。\n\n研究人员想知道 `CNN` 是否能够区分 `GBC`\
  \ 和良性胆囊疾病，因此附近肝实质的信息可能会提高其性能 [22]。胆囊癌 (`GBC`) 是一种致命疾病。由于良性胆囊病变可能具有相似的影像学特征，因此诊断\
  \ `GBC` 困难。本研究的目的是创建和评估一种用于在腹部超声 (`US`) 中自动诊断 `GBC` 的 `DL` 模型，并将其诊断性能与放射科医生的诊断性能进行比较\
  \ [23]。为了使用不同的 `EUS` 特征表征肿瘤性 `GB` 息肉并与一般背景回声比较，该研究显示息肉核心中有各种形状、略微低回声区域 [24, 25]。\n\
  \n## 3. 讨论\n\n如前所述，智能计算技术在胆囊疾病的诊断和分类中发挥了至关重要的作用，具有准确性和快速响应时间。各种 `DL` 技术被应用于从各种资源收集的数据集之上，其结果被评估\
  \ [13, 14, 15 and 16]。在 Table 36.2 中很明显，各种研究中存在数据集不平衡和因果性问题 [17, 18, 19, 20 and\
  \ 21]，这些问题通过应用受自然启发的优化算法而减少，并获得了训练开销更小的更好解决方案 [18, 19, 20 and 21]。观察到在先前的研究中，训练开销问题通过使用智能优化技术最小化，而数据集不平衡通过使用智能预处理技术减少，同时在每种方法中都应用了传统的预处理和分割，以提高\
  \ `DL` 以及机器学习模型的学习能力。为了进一步减少训练开销并实现更高的准确性，需要一个适用于不同和异构数据集的通用模型，该模型可能能够使用不同的临床数据集预测其他疾病。这可以通过集成特征选择算法并结合补充训练和学习模型来实现。\n\
