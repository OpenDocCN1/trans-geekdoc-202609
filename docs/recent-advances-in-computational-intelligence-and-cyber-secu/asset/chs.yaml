  \ 24.3、Figure 24.4 和 Figure 24.5）。\n\n![Figure 24.3 Confusion matrix of model 1\
  \ and model 2.](img/fig24_3_C.jpg)\n\nFigure 24.3 Confusion matrix of model 1 and\
  \ model 2.\n\n![Figure 24.4 ROC curve of model 1 and model 2.](img/fig24_4_C.jpg)\n\
