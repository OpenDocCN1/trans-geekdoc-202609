  \ RGB 颜色并且找到了具有完全相同 RGB 的图像，则对这些获取的图像执行下一个身体姿势代码。其工作是找出具有完全相同身体姿势的图像。如果找到匹配项，则会在用户屏幕上显示该图像。如果找不到具有完全相同身体姿势的图像，则我们将无法获得有效输出，并且它将开始执行下一个子系统。\n\
