  \ Trans. Nanotechnol., 20, 562-566。\n\n# 30 实验室规模间歇反应器中非线性控制器类别的验证：滑模控制器\n\nKrupa\
  \ Narwekar^(³⁰)\n\n### Abstract\n\n本文旨在实现滑模控制器（`SMCs`），这是一种具有高计算强度的非线性控制器。此外，诸如模型预测控制器（`MPC`）、非线性模型预测控制器（`NMPC`）等各种非线性控制器的实现涉及带约束的在线优化。因此，在物理系统上的验证对在线数据的计算能力存在限制。本文作者通过使用\
  \ Jetson 开发套件配合信号调理和模数转换器（`ADC`）来连接物理传感器和执行器信号，解决了高强度计算问题。以高度非线性的间歇反应器为案例研究。由于其放热反应伴随化学进料以及非稳态特性。本间歇反应器实验研究中的不确定性被视为输入冷水的变化，该冷水在反应器夹套中循环以带走额外热量。`SMCs`\
  \ 对添加到系统动态中的额外不确定性更具鲁棒性和敏感性。本文中作者考虑了 Prajwal 等人 [1, 2] 为实验间歇反应器开发的非线性模型方程。为丙烯酰胺聚合反应开发了最优温度曲线，并将其用作闭环仿真和验证的参考轨迹。冷却剂流量是通过环形线圈循环的操纵变量，反应器温度是过程变量。本文作者提出了四种类型的\
  \ `SMC` 以抑制反应器温度与参考轨迹的振荡。实验结果表明，带 `PI` 滑模面的 `SMC` 给出最小控制信号，且反应器温度在一段时间内比其他类型的 `SMC`\
  \ 更能跟踪轨迹。实现具有约束的高级控制器如 `NMPC` 的主要瓶颈是优化器的计算时间。使用 Jetson 板实现高级计算技术的尝试正在进行中。\n\n**关键词：**\
  \ 滑模控制器，间歇反应器，Jetson nano 板，轨迹跟踪\n\n### 1. Introduction\n\n间歇反应器本质上是一个高度非线性过程，原因有多种，例如放热反应、反应常数的指数项以及反应器中发生的聚合反应类型。在这种类型的间歇过程中，没有连续的进料流入或连续流出，它是一次性充料并在整个批次过程时间内保持相同进料量。产品仅在批次过程结束时间后才取出进行分析。外部扰动会影响间歇反应器的操作。例如，冷却剂流量温度随时间的变化。它会影响夹套温度（`T[j]`）的变化以及影响反应器温度（`T[r]`）。上述情况可通过查看系统动态中给出的间歇反应器的非线性微分方程来理解。此外，在间歇反应器中生物柴油生产的案例研究中，存在进料组分浓度可能变化的高度可能性\
  \ Urmila 和 Pahola [3]。这将由于从不同供应商采购大豆油而发生。这种不确定性可能会影响最终产品质量。\n\n间歇反应器问题可分为以下两点 (i)\
  \ 最优温度轨迹形成 (ii) 具有温度轨迹的间歇反应器闭环操作以实现最终产品形成。本文中，为实验室规模间歇反应器由 Prajwal 等人 [1, 2] 形成的丙烯酰胺聚合最优温度曲线被视为闭环验证的参考。滑模控制器（`SMC`）是在存在不确定性的情况下实现任何闭环操作的鲁棒控制器之一。本文中，三种不同类型的\
  \ `SMCs` 在实验室规模间歇反应器上得到验证。\n\n文献综述部分介绍了过去在各种实验工作和仿真中进行的间歇反应器曲线形成、建模方面和闭环操作的广泛文献。三种不同类型的\
  \ `SMC` 已针对温度轨迹跟踪进行仿真，进一步所有 `SMC` 均在中试装置间歇反应器上实现并获得了令人满意的轨迹跟踪。\n\n此外，使用 Jetson 板用于下载使用\
  \ `Python` 代码开发的控制算法，以提高计算能力方面的速度，因为我们使用在线优化器来制定控制信号。\n\n## 2. Literature Survey\n\
  \n对间歇反应器的简要调查可分为以下几个方面：a) 最优温度曲线形成 b) 间歇反应器的数学建模 c) 轨迹跟踪的控制器设计 d) 在实验室规模间歇反应器上验证控制策略\
  \ e) 产品质量分析。\n\n### 2.1. Optimal temperature profile\n\n同行文献对中试装置间歇反应器的调查分为两个主要领域，首先是化学工程，另一个是控制领域。化学工程研究人员致力于为特定产品在指定批次时间内从间歇操作中获得的最优温度曲线形成。Palanki\
  \ 等人 [4] 基于庞特里亚金原理和哈密顿量最小化开展了基于神经网络的终点优化工作。Arun Senthil 和 Sundaramoorthy [5] 基于庞特里亚金最小值原理使用反向积分提出了曲线形成。Urmila\
  \ 和 Pohola [3] 针对甘油三酯浓度存在不确定性与否的生物柴油生产进行了最优曲线的大量研究，使用哈密顿原理求解最优曲线。\n\n### 2.2. Modeling\
  \ of batch reactor\n\n\n\n\n\n实验室规模间歇反应器的建模可以基于 a) 数据驱动建模 b) 第一性原理建模 c) 混合建模。间歇反应器由固体容器制成，采用\
  \ 316SS 以避免各种化学反应过程中的腐蚀。它还具有用于轨迹跟踪的整体加热和冷却系统。关于建模，一般而言加热器电流将保持恒定，而冷却剂流量将作为操纵信号变化以记录开环反应温度。为了正确捕捉反应动力学，必须用实际用于闭环操作的化学进料对间歇反应器进行充电。\n\
  \n数据驱动建模涵盖线性建模和非线性建模。自回归递归外生模型（`ARX`）使用收集的输入和输出数据，通过定义输入和输出阶数来形成输出方程。如果考虑输入和输出之间的互相关以及定义的输入-输出阶数和误差项，则会得到\
  \ Billing 等人提出的非线性自回归递归外生（`NARX`）建模 \\[6\\]。对于数据驱动建模，不一定需要对所考虑的系统有透彻的了解。\n\n对于第一性原理建模，必须确切了解所研究系统的动态才能精确建模。如果存在模型失配，闭环性能验证将变差。为了克服这一点，可以使用来自物理间歇反应器系统的已知参数数据，并再次使用数据驱动方法进行参数估计，误差残差可确保模型参数的准确性。Figure\
  \ 30.1 显示了实验室规模的间歇反应器，Figure 30.2 说明了其用于控制器验证的示意图。\n\n![Figure 30.1: Experimental\
  \ setup of batch reactor in advanced process control lab, ICE Dept., MIT, Manipal\
  \ \\[1, 2\\].](images/fig30_1_C.jpg)\n\nFigure 30.1: Experimental setup of batch\
  \ reactor in advanced process control lab, ICE Dept., MIT, Manipal \\[1, 2\\].\n\
  \n![Figure 30.2: Schematic diagram of the batch reactor experimental setup.](img/fig30_2_C.jpg)\n\
  \nFigure 30.2: Schematic diagram of the batch reactor experimental setup.\n\n###\
  \ 2.3. 控制器设计\n\n控制领域研究人员在闭环中为所提出的控制算法模拟使用任意随机非线性曲线。在实验室规模间歇反应器上验证控制算法时，必须使用实际化学进料以产生放热反应，因此温度曲线形成以及终端时间至关重要。对传统控制器如比例积分（`PI`）及其分类的验证将导致控制信号的急剧变化。因此，非线性控制算法如基于非线性模型的控制（`NMBC`）、非线性模型预测控制（`NMPC`）\\\
  [6\\]、`SMC` \\[8, 9, 10 and 11\\] 等更适用于间歇反应器轨迹跟踪问题\n\n## 3. 滑模控制器\n\n非线性系统受扰动和不确定性的影响很大。为了控制非线性系统，需要设计鲁棒控制器。模型化控制器对参数不确定性和扰动不敏感，即为\
  \ `SMC`。\n\n在控制系统中，`SMC` 是一种非线性控制方法，通过施加不连续控制信号（或更严格地说，集值控制信号）改变非线性系统的动态，迫使系统沿着系统正常行为的横截面“滑动”。切换控制律迫使状态位于稳定的滑动面上。一旦位于该滑动面上，状态对扰动和不确定性变得不敏感。`SMC`\
  \ 应用的原因如下：\n\n*   它是一种非线性控制器\n*   它对参数不确定性不敏感\n*   一旦状态位于滑动面上，它就是鲁棒控制器\n\n在本工作中，考虑间歇反应器系统。冷却水入口温度控制问题中的扰动可能会影响间歇过程。\n\
  \n考虑间歇反应器的动态方程\n\n系统方程 \\[1\\]\n\n$$\\\\begin{array}{l} {\\\\frac{d\\\\lbrack I\\\
  \\rbrack}{dt} = - A\\_{d}\\\\lbrack I\\\\rbrack e^{( - E\\_{d}/R(T\\_{r} + 273.15)}}\
  \ \\\\\\\\ {\\\\frac{d\\\\lbrack M\\\\rbrack}{dt} = - A\\_{d}\\\\left\\\\lbrack\
  \ I \\\\right\\\\rbrack^{\\\\varepsilon}e^{( - E\\_{d}/R(T\\_{r} + 273.15)}} \\\\\
  \\\\ {m\\_{r}C\\_{pr}\\\\frac{dT\\_{r}}{dt} = R\\_{p}V( - \\\\Delta H\\_{p}) - UA(T\\\
  _{r} - T\\_{J}) + Q\\_{b} + Q\\_{s} - Q\\_{loss~}} \\\\\\\\ {m\\_{r}C\\_{pr}\\\\\
  frac{dT\\_{J}}{dt} = UA(T\\_{r} - T\\_{i}) - F\\_{C}C\\_{pc}(T\\_{j} - T\\_{c})}\
  \ \\\\\\\\ \\\\end{array}$$  \n\n由于反应器问题是跟踪问题，让我们选择滑动面为误差方程\n\n(1)\n\n*s* = *T*[*d*] − *T*[*j*]\n\
  \n为了到达滑动面\n\n(2)\n\n$$\\\\overset{˙}{s} = 0$$\n\n对 (1) 求导\n\n(3)\n\n$$\\\\overset{˙}{s}\
  \ = {\\\\overset{˙}{T}}\\_{d} - {\\\\overset{˙}{T}}\\_{j}$$\n\n将 (2) 代入间歇反应器方程\n\
  \n(4)\n\n$$\\\\begin{array}{l} {\\\\overset{˙}{s} = {\\\\overset{˙}{T}}\\_{d} -\
