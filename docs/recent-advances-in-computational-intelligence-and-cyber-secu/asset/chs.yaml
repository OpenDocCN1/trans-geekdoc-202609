  \ Singh^(¹⁰)\n\n#### 摘要\n\n本文提出了一个工作模型，用于利用数据科学和机器学习（ML）检测互联网服务提供商（ISP）网络流量中真实和伪造的域名系统（DNS）流量。当任何主机访问网络进行\
  \ DNS 查询或邮件交换记录时。基于源端口、目的端口、源地址和目的地址，我们使用各种端口镜像技术在一定时间内从路由器端口记录净流量。采用了一种模式，使用每个记录的\
  \ DNS 请求数量及其响应。两种机器学习模式 K-最近邻（KNN）、朴素贝叶斯（NB）用于分类目的，并进一步用于预测和分析数据中的行为。我们使用预测来对准确率和训练时间作为性能指标进行分类，以找出哪种算法比另一种更准确。用于训练和测试算法的数据集包含多种恶意和真实端口以进行分类。\n\
  \n**关键词：** DNS, 端口镜像, 净流量, K-最近邻（KNN）, 朴素贝叶斯（NB）\n\n\n\n\n## 1. 引言\n\n每个互联网服务提供商（ISPs）都有自己的\
  \ DNS 服务器，为客户端提供名称解析和反向查询服务。DNS 服务器使用端口 `53` 的用户数据报协议（`UDP`）和传输控制协议（`TCP`）来执行其活动。作为\
  \ DNS 请求，目标端口为 `53`，源端口为 `1023` 以上的任意端口；对于 DNS 响应，源端口为 `53`，目标端口为 `1023` 以上的任意端口。当两个\
  \ DNS 服务器传输其区域文件时，源端口和目标端口均为端口 `53`（`TCP`）。\n\n互联网呈指数级增长，这对所有系统和网络管理员实现信息安全目标——保密性、完整性和可用性——来说是一个巨大的挑战。这就是为什么需要持续的网络监控、分类和安全分析。入侵检测系统（`IDS`）和入侵防御系统（`IPS`）要么基于内容，要么基于行为，无法防御各种攻击\
  \ [1, 2, 3 和 4]。\n\n如今，大多数研究人员使用网络流流量来减轻或对抗各种类型的攻击和恶意流量。网络流记录包含可用于各种目的的各种信息，其中一个重要目的是对网络进行安全分析。我们捕获了为期\
  \ 1 个月的时间段的网络流数据。然后应用数据可视化从数据集中获得某些模式。在应用机器学习（`ML`）模型后，比较了 K-最近邻（`KNN`）和朴素贝叶斯（`NB`）机器学习分类器之间的单独性能以找出准确率\
  \ [5, 6, 7 和 8]。\n\n## 2. 问题陈述\n\n为了识别针对 DNS 服务的良性和恶意流量，以提高服务质量、安全性和效率，我们必须分析网络中的模式。流量量、流量类型、流量的源和目标等。\n\
  \n我们的重点是使用数据科学和各种 ML 语言开发一个工作模型，以可视化、分析和预测网络中的流量类型以及这些流量对 ISP 网络的影响。\n\n作为对潜在危险的保险政策。利用一系列供应商提供了一层额外的保护，这是其好处之一。这导致网络具有增强的保护级别，因为可能能够通过由一个供应商提供的由于已知故障而提供的<|message|>安全设备的攻击将无法通过由其他供应商提供的\
  \ security 设备。\n\n## 3. 工作流程\n\n我们的工作模型分为三个主要部分——数据收集（网络流）、数据采样和数据分类（Figure 10.1）。\n\
  \n![Figure 10.1: Flow diagram.](img/fig10_1_C.jpg)\n\nFigure 10.1: Flow diagram.\n\
  \n## 4. 用于存储网络流数据（捕获记录）的数据库\n\n这里我们有源地址、目标地址、源端口、目标端口和时间戳的详细信息。我们将这些详细信息存储在 `.csv`\
