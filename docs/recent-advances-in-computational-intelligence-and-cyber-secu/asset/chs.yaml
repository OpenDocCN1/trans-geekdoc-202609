  \ 稳定性条件，*k* > 0\n\n至此证明完成。\n\nFigure 30.3 显示了反应器温度跟踪，冷却剂流量随之振荡变化。目标是减少间歇反应器过程中控制信号的振荡以节省能量。\n\
