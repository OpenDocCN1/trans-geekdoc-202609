  \nHarish Chandra Verma^([³³)] \n\nICAR, Central Institute for Subtropical Horticulture,\
  \ Lucknow, India\n\n### Abstract\n\n芒果 (*MangiferaIndica L*.) 是世界上最重要的商业水果作物之一。芒果的许多疾病，包括叶斑病，会严重降低该作物的果实产量和质量。及时准确地诊断这些病害对于有效的病害管理至关重要。在这项工作中，我们提出了一种在\
  \ Matlab 中开发的快速自动软件，用于通过数字图像分析准确评估芒果叶斑病。 我们的方法利用计算机视觉技术，能够准确评估病害严重程度。 该软件使用图像处理技术分析叶片图像，以提供有关严重程度的定量信息。我们的研究结果表明，所建议的软件是有效和高效的，使其成为量化芒果病害引起的叶片损伤的有用工具。本研究描述了一种通过数字图像分析精确量化芒果树叶斑病的新方法。大多数植物病害可以通过视觉诊断和评估。它们可以影响植物的不同区域并具有各种不同的症状。为了处理芒果叶片的高分辨率图像，提取相关特征并精确估计叶斑病的严重程度，建议的软件应用程序利用了先进的计算机视觉算法。在这项工作中，我们在\
  \ Matlab 中开发了易于使用的软件，用于快速量化芒果植物中的叶斑病。本研究有助于为芒果种植者/研究人员包括学生开发一个强大的软件工具，以监测和管理叶斑病，从而提高芒果作物的产量和质量。\n\
  \n**关键词：** Damage, mango, diseases, leaf spot, quantification, software\n\n### 1.\
  \ Introduction\n\n植物病害对粮食安全构成严重威胁，并对农业作物产量产生显著负面影响。如果能及早发现，植物病害对农业生产力的降低影响会减小 [1]。农民需要专家持续监测，这可能非常昂贵且耗时\
  \ [2]。作者 Revathy 和 Hemalatha [3] 重点关注使用叶片纹理来检测植物叶片病害。大多数病害严重程度评估都是通过目视进行的，特别是针对单个叶片或植物。这种方法通常会高估果园草中斑点叶片面积的百分比，当感染面积最低时最高，通常比实际面积大两到三倍\
  \ [4]。另一种方法是使用测叶仪评估，即从绘制的投影纸复制品的重量中确定受损叶片面积。然而，这种方法耗时且劳动密集。与目视评分相比，基于图像的程序在进行定量测量时通常更客观、更准确且可重复\
  \ [5, 6]。在测量咖啡叶锈病严重程度时 [7] 发现图像分析技术比目视判断和测叶仪评估更准确。根据 Smith [8]，先进的图像编辑程序可以精确简单地量化受损区域，因为它可以轻松显示选定区域中的像素数量及其颜色指数。同样，诸如植物高度、植物宽度和冠层覆盖面积等方法也可用于评估植物生长\
  \ [9]。通过当前工作中的简单图像分析过程，我们还能够快速确定叶斑面积与总叶面积的比率。许多研究已探讨利用气象数据建立病害预测模型以帮助安排杀菌剂喷洒，因为病害感染和进展在很大程度上取决于环境条件\
  \ [10, 11 和 12]。\n\n\n\n\n\n芒果树叶斑病主要由几种真菌引起。这些病害在芒果叶片上表现为可识别的圆形至不规则病斑，经常带有坏死中心和周围的黄色晕圈。这些病害的严重程度范围从轻微的美容损伤到严重的落叶，这可能会影响树的整体健康并降低果实质量和产量。传统上评估芒果园叶斑病严重程度的方法主要依赖于病理学家主观的、耗时且劳动密集的目视检查。由于这些限制，及时和精确的病害定量变得更加困难。可持续和有效农业技术需求的不断增长，激发了创建和使用当代技术来克服这些限制。\
  \ 其中，计算机图像分析已显示出作为快速和自动量化作物损害的方法的潜力。需要一些人工输入但部分过程由计算机执行的方法称为半自动。使用现有的图像处理软件包来分析图像并提取所需信息是其中最受欢迎的半自动技术之一。其中一些软件包是：`SigmaScan\
  \ Pro` [13, 14]、`Assess` [15, 16]、`Matrox Image Analyzer` [17] 和 `JLGenias` [18]，有些是免费软件，如\
  \ `Scion Image Software` [19]，有些是开源的，如 `ImageJ` [20]。\n\n由于图像分析具有许多优点，包括其高速度和高精度，使用个人计算机的高分辨率数字图像分析最近在农业科学中变得更加流行。根长和根尖、工厂化植物的植物生长、离体植物的植物生长\
  \ [21]、玉米的根表面积 [22]、洋葱 [23]、根长和根尖，都已使用此方法进行估计。但将图像分析应用于植物研究存在显著缺点。具有蜡质表面的咖啡叶产生的叶表面图像极其反射，可能会降低某些健康组织与腐蚀组织之间的对比度，以及反射的健康组织与背景之间的对比度\
  \ [7]。叶斑一直是国内和商业管理中的一个重要问题。快速准确评估叶斑严重程度是阐明其过程的第一步。鉴于叶斑以不规则的、圆形或细长的、各种大小的黄色斑点为特征，使用目视评估方法量化叶斑极其乏味，在使用叶斑照片的纸质复制品时也非常具有挑战性。在本文中，我们创建了一个基于图像分析技术的软件工具，使我们能够快速准确地测量叶斑。\n\
  \n## 2. 材料与方法\n\n### 2.1 数据收集\n\n受各种叶斑病影响的芒果叶片，包括白粉病、壳二孢枯萎病、炭疽病、红锈病、叶瘤病和细菌性叶枯病，均采集自\
  \ Rehmankhera 的 ICAR-CISH 芒果农场。对于此实验，使用了从植物上切下的完全展开的叶片。叶片通过连接到计算机的平板扫描仪数字化并扫描，图像分辨率为\
  \ 300 dpi，格式为 tiff (Figure 33.1)。\n\n![Figure 33.1: Sample of the digitized mango\
  \ sample leaves damaged by LS diseases.](img/fig33_1_C.jpg)\n\nFigure 33.1: Sample\
  \ of the digitized mango sample leaves damaged by LS diseases.\n\n### 2.2 图像预处理\n\
  \n收集的图像经过预处理以增强其质量和一致性。此预处理包括图像锐化、调整大小、降噪和颜色归一化，以确保图像间准确的病害检测。\n\n### 2.3 病害严重程度量化\n\
  \n一旦病害病斑被检测到，软件通过计算受病斑影响的叶片面积百分比来量化病害严重程度，该百分比除以 10 后产生严重程度评分，范围从 0（健康）到 9（完全受损）。\n\
  \n### 2.4 叶斑严重程度量化的<|message|>\n\n采用图像预处理技术来增强图像清晰度并去除噪声。随后，从图像中提取一组稳健的与病害相关的特征，涵盖纹理属性。方法如下：\n\
  \n1. 将 `RGB` 图像转换为灰度图像。\n2. 使用合适的算法检测叶片边缘，例如，此处 `Canny` 边缘检测是合适的。\n3. 将扫描图像转换为二值图像，对其应用形态学图像处理并分割感兴趣区域，这将产生二值图像。此分割图像现在将是黑白图像，其中白色像素代表“图像”，黑色像素代表“背景”。\n\
  4. 统计白色像素的数量，即 ON 像素的数量，并使用以下公式将其转换为面积以进行 ON 像素到面积的转换（cm）：\n5. `Leaf/damaged area\
  \ (cm ) = No. of pixels*(2.54) /(DPI)`\n\n随机选择了芒果品种 Dashehari 树的患病芒果叶片。此后，叶片被扫描并转换为\
  \ 300 dpi 的 tiff 格式数字图像 (Figure 33.1)。扫描时，叶片尽可能保持平坦，以避免因叶片弯曲导致的面积测量误差。\n\n### 2.5\
  \ 叶斑严重程度量化算法的开发\n\n开发了计算叶斑病害造成的损害严重程度的算法 (Figure 33.2)，如下所示：\n\n![Figure 33.2: Infected\
