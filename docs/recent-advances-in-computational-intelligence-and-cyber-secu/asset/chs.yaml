  #### 摘要\n\n在本次研究中，提出了一种使用介电常数为 4.4、尺寸为 30 × 30 mm 的 1.6 mm FR-4 基板的可重构双频段天线。PIN\
  \ 二极管作为开关被集成在馈电线上以重构天线。所提出的天线已使用 Computer Simulation Technology (CST) studio suite\
  \ 2022 进行仿真。当天线处于关闭状态时，天线在 3.73 GHz 谐振，最大增益为 2.1 dBi；当处于开启状态时，在 10.01 GHz 谐振，最大增益为\
  \ 3.51 dBi。对于 WiMAX、C 波段和 X 波段应用而言，它是有用的。\n\n**关键词：** 双频段，可重构贴片天线，槽，WiMAX，X 波段\n\
  \n## 1. 引言\n\n\n\n\n\n可重构天线通常被广泛使用，以满足现代通信系统的需求。可重构天线可以实现诸如频率和辐射方向图等特征的受控动态修改。存在多种重构技术，包括改变频率、极化以及辐射方向图的能力。文献\
  \ \\[9\\] 中描述了一种尺寸为 40 × 40 mm 的双频天线。为了将该天线用于 WLAN 和 WiMAX 频段，可添加 PIN 二极管和电容器。建议在无线应用的多频带缝隙天线中使用\
  \ PIN 二极管来实现频率重构 \\[2\\]。这是一款四频带天线，对于较小的 WiMAX、GNSS 和 WLAN 应用效果良好。采用 FR-4 基板的可重构天线\
  \ \\[7\\] 已使用 PIN 二极管进行研究，用于 WLAN 和 WiMAX 应用，工作频率为 2.4 GHz、3.5 GHz、5.25 GHz 和 5.8\
  \ GHz。还报道了该领域的其他可重构微带贴片天线设计，包括具有六个频带的 \\[6\\] 可重构贴片天线，以及用于 Wi-Fi 和 5G 应用的 \\[4\\\
