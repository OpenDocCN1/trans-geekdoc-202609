  \ Learn. EDGE Comput., 169–185. Academic Press. ISBN 9780128240540, [`doi.org/10.1016/B978-0-12-824054-0.00001-0`](https://doi.org/10.1016/B978-0-12-824054-0.00001-0)。\n\
  \n# 5 形状记忆合金与人工智能\n\nKedarnath Chaudhary^5\n\n#### 摘要\n\n形状记忆合金（`SMAs`）是一种智能材料，当其被变形时，可以恢复到原始形状。当\
  \ `SMA` 加热或冷却时，会发生特殊的相变，这就解释了这种能力。`SMAs` 可用于多个行业，包括航空航天、汽车、医疗、机器学习（`ML`）等。人工智能（`AI`）有潜力彻底改变广泛的行业。新型材料的设计已在利用\
  \ `AI` 来增强其特性。例如，`AI` 正被用于构建新型、更有效的 `SMAs`。本文将探讨利用 `AI` 创建新型 `SMAs` 的最新进展。本文将介绍用于创建具有增强特性的\
  \ `SMAs` 的各种 `AI` 设计方法。本文还将介绍 `AI` 设计的 `SMAs` 在各个行业中的潜在应用。\n\n**关键词：** 人工智能，计算资源，物理储层计算机，机器学习，形状记忆合金\n\
  \n## 1. 引言\n\n形状记忆合金（`SMAs`）是一类智能材料，具有从变形中恢复并恢复到原始形状的能力 [1]。`SMA` 只有在以特定方式加热或冷却时才会发生这种转变。`SMAs`\
  \ 通常由两种或多种金属组成，其发生的相变是可逆的马氏体相变 [1, 2 and 3]。\n\n人工智能（`AI`）是一个快速发展的领域，有潜力彻底改变包括新型材料设计在内的众多行业。例如，`AI`\
  \ 正被用于构建新型、更有效的 `SMAs`。\n\n`AI` 可用于通过发现具有增强特性的新合金成分来创建新型 `SMAs`。人工智能用于筛选数百万种不同的合金成分，并确定最有可能具有所需特性的成分。这最终将减少新型\
  \ `SMA` 合金创建的时间和成本。\n\n`AI` 还可以通过改进其制造工艺来设计新型 `SMAs`。`AI` 可以生产出具有更可靠特性和更少缺陷的 `SMAs`。这从而提高了\
  \ `SMAs` 的功能和可靠性。\n\n`AI` 也正被用于创建新型 `SMA` 控制策略。传统 `SMA` 作动器通常由温度控制。然而，现在可以创建新的控制策略，使\
  \ `SMAs` 能够更精确、更有效地进行控制。这将使 `SMAs` 在机器人技术和医疗技术等领域找到新的应用。\n\n自传感形状记忆合金作动器被用作物理储层计算机用于计算目的。这种机器学习（`ML`）技术利用物理系统的动力学进行计算，比循环神经网络更快、更高效。该作动器预测在不同驱动信号下作动器末端执行器的轨迹，展示了其可重构性和同时工作的能力\
  \ [4]。\n\n\n\n\n\n设计具有增强性能的新型材料是人工智能在材料研究中的主要应用之一。所需特性是通过筛选数百万种候选材料组成来确定的。这种方法可以大大减少创造新材料所需的时间和费用。\n\
  \n研究还发现，人工智能已被用于例如创建在高温下性能更佳、强度和耐腐蚀性更高的新型合金。因此，创造用于催化剂和储能的新材料。\n\n制造过程中的工艺优化是人工智能在材料科学中的另一个应用，在此之下可以创造全新的生产方法，从而生产出性能更可靠、缺陷更少的材料。这确实增强了材料的功能性和可靠性。\n\
  \n例如，人工智能还被用于简化半导体、电池和太阳能电池的制造工艺。然后将其应用于创新 3D 打印增材制造工艺的创建。\n\n总体而言，人工智能有能力彻底改变材料的开发和应用方式。研究人员现在可以通过利用人工智能来简化生产程序、加速新型材料的发现以及设计新材料，从而设计出具有改进特性和性能的新材料。这导致了材料在航空航天、汽车、能源和医疗等多个行业中的新颖和创造性应用。\n\
  \n尽管人工智能仍是一个新兴的研究领域，但它有可能彻底改变材料的开发和应用方式。随着技术的进步，我们可以期待人工智能在材料研究中出现更多突破性和创新性的应用。\n\
  \n## 2. 具有改进性能的 SMA 的 AI 设计\n\nAI 设计是创建具有增强特性的 SMA 的一种可能新方法。它可以通过减少基于试错的测试需求来大大加快新\
  \ SMA 的创建。它还可以用于创建具有增强特性并针对特定用途定制的全新 SMA（参见 Figures 5.1a 和 5.1b）。这可以导致成本降低和 SMA\
  \ 在各种应用中的性能改善。\n\n![Figure 5.1(a): The methodological process followed to conceptualize\
  \ the proposed review \\[5\\].](images/fig5_1a_C.jpg)\n\n图 5.1(a)：概念化所提综述所遵循的方法论过程\
  \ \\[5\\]。\n\n![Figure 5.1(b): KETs (key enabling technologies) and review framework\
  \ \\[5\\].](images/fig5_1b_C.jpg)\n\n图 5.1(b)：KETs（关键使能技术）和综述框架 \\[5\\]。\n\n使用 AI\
  \ 设计 SMA 通常包括以下步骤：\n\n1. 数据收集：SMA 的实验产生了大量数据集。该数据集应提供 SMA 的成分、微观结构和特性的详细信息。\n2.\
  \ 数据预处理：数据的预处理确保其处于 AI 模型可用的格式。导致对数据进行缩放和清洗并消除错误。\n3. AI 模型开发：可以基于单个 SMA 的微观结构和成分创建\
  \ AI 模型来预测其性能。可以使用深度学习、ML 等方法来利用这一点。\n4. 性能预测：AI 模型用于预测新 SMA 的所需性能。\n5. 预测性能的验证可以在合成新\
  \ SMA 后通过特定测量进行。\n6. 在成功进行 AI 验证后，新的 SMA 就可以设计出具有广泛改进性能。举例来说，可以使用基于 AI 的公式生产 SMA\
  \ 的新记忆效应、弹性和强度性能 \\[5\\]。\n\n基于 AI 的设计公式可以对许多新创建的 SMA 应用产生革命性影响。\n\n## 3. SMA 的应用\n\
  \nAI 创建的 SMA 有能力革新机器人、航空航天、汽车和医疗等行业。下面列出了一些由 AI 创建的 SMA 的实例及其相关图示：\n\n#### 3.1 航空航天\n\
  \n智能飞机机翼：由 AI 设计的 SMA 机翼可用于小型飞机，飞行时可改变形状，确实提高了性能和燃油效率 \\[6\\]。\n\n主动除冰技术/系统：研究人员还建议\
  \ AI 创建的 SMA 可用于为飞机创建除冰系统，该系统可在不使用任何机械或化学装置的情况下融化机翼和其他表面上的冰。\n\n耐用且轻量级的飞机部件/零件：由\
  \ AI 设计的 SMA 将用于制造轻量且坚固的零件，如起落架和作动器（参见 Figure 5.2）。\n\n![Figure 5.2: Overall distribution\
  \ of composite materials used in Boing 787 aircraft \\[7\\].](images/fig5_2_C.jpg)\n\
  \n图 5.2：Boing 787 飞机中使用的复合材料整体分布 \\[7\\]。\n\n#### 3.2 汽车\n\n主动悬架系统：由 AI 创建的 SMA\
  \ 可用于为汽车创建主动悬架系统，从而增强操控性和乘坐舒适性。\n\nAI 设计的 SMA 增强了车辆的乘坐质量和操控性，使其在崎岖道路上行驶时更加舒适和安全，如\
  \ Figure 5.3 所示。\n\n![Figure 5.3: A model of active suspension system \\[8\\].](images/fig5_3_B.jpg)\n\
  \n图 5.3：主动悬架系统模型 \\[8\\]。\n\n可变形状车身面板：AI 设计的 SMA 可用于为汽车创建可变形状车身面板，从而提高燃油效率和空气动力学性能，如\
  \ Figure 5.4 所示。\n\n![Figure 5.4: (a) Basic 3D model, (b) 3D print of interlinked\
  \ panels, (c, d) fabricated shape-changing displays examples \\[9\\].](images/fig5_4_C.jpg)\n\
  \n图 5.4：(a) 基本 3D 模型，(b) 互联面板的 3D 打印，(c, d) 制造的形状变化显示示例 \\[9\\]。\n\n由 AI 创建的 SMA\
  \ 可用于为汽车创建可变形状车身面板，从而提高空气动力学性能和燃油效率。这可能会大幅降低燃料成本和排放 \\[9\\]。\n\n智能安全气囊：由 AI 创建的\
  \ SMA 可用于创建智能安全气囊，在碰撞发生时能够更快地展开并最大限度地降低受伤风险（Figure 5.5）。\n\n![Figure 5.5: Wearable\
  \ airbag design layout, head air bag pulling strap position (in left) and the detailed\
