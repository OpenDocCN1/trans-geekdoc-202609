  _{d} - \\\\left( U\\_{A}\\\\left( {T\\_{r} - T\\_{j} - \\\\frac{FC\\_{p}c\\\\left(\
  \ {T\\_{j} - T\\_{c)}} \\\\right)}{m\\_{j}C\\_{pj}}} \\\\right) + kpk\\_{i}\\\\\
  left( {T\\_{d} - T\\_{i}} \\\\right) = - k \\\\middle| s \\\\middle| {}\\_{\\\\\
  alpha}{sgn}(s) \\\\right.} \\\\right.} \\\\\\\\ \\\\left. - k \\\\middle| s \\\\\
  middle| {}\\_{\\\\alpha}{sgn}(s) = kp{\\\\overset{˙}{T}}\\_{d} - \\\\frac{kpU\\\
  _{A}\\\\left( {T\\_{r} - T\\_{i}} \\\\right)}{m\\_{j}C\\_{pj}} - \\\\frac{k\\_{p}FC\\\
  _{pc}\\\\left( {T\\_{j} - T\\_{c}} \\\\right)}{m\\_{j}C\\_{pj}} + kpk\\_{i}\\\\\
  left( {T\\_{d} - T\\_{j}} \\\\right) \\\\right. \\\\\\\\ \\\\left. \\\\frac{k\\\
  _{p}FC\\_{pc}\\\\left( {T\\_{j} - T\\_{c}} \\\\right)}{m\\_{j}C\\_{pj}} = kp{\\\\\
