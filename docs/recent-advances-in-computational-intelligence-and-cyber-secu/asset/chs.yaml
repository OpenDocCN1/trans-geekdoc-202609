  \n# 6 基于智能计算方法的心律失常诊断系统性文献综述\n\nNeha Goyal^6\n\n#### 摘要\n\n在当今时代，由于压力、焦虑和抑郁参与到人类的日常生活中，人们的生活方式变得更加复杂。在这种情况下，心脏疾病在年轻人以及老年人中迅速增长。还观察到心脏疾病非常关键和敏感，包括危及生命的可能性。因此，在所需时间内检测和预防此类心脏紊乱对于恢复至关重要。由于预测和预防心脏紊乱的研究已大量开展，心律失常也是大量人群中主要发生的一种疾病。心电图（ECG）是诊断心律失常问题的廉价且最佳的方式，每天在医院和病理中心收集到的数据量巨大。之前已开发出各种自动化模型，使用各种机器学习（ML）和深度学习方法来检测心律失常。在这项工作中，基于其性能对近期开发的自动化模型进行了综述，基于一些特定参数，如部署的数据集、输入数据的变化、应用的应用、方法以及开发模型获得的结果。还提到了所综述论文的局限性以及其未来改进的范围。\n\
  \n**关键词：** 智能计算，心律失常，ECG，机器学习\n\n## 1. 引言\n\n心律失常通常被认为是人类心跳不规律的问题，对生命威胁和遗漏事件非常关键。存在各种类型的心律失常，具有一些特定的识别和特征，因此对心律失常的各种类别进行分类和区分变得非常有帮助。一般来说，心律失常的检测是通过将其分为两个类别来进行的，其中第一个是由心跳单一不规律的问题诊断的，因此称为形态学心律失常。第二阶段的心律失常是根据心跳多次不规律的特征进行诊断的，因此被认为是有节奏的心律失常问题。\n\
  \n基本上，如果个体患有形态学或有节奏的心律失常，心跳波形会观察到一些变化和改变。问题的检测和诊断是通过心电图（ECG）以及超声心动图（ECHO）进行的。心律失常问题直接与心脏瓣膜问题相关，导致心率不规律。\n\
  \nECG 是心脏病学中评估患者心脏状况的成熟工具。ECG 代表心电图，是心脏收缩活动的电表示，可以通过患者肢体或胸部的体表电极方便地记录。在医学领域，ECG\
  \ 是最知名和最广泛使用的生物信号之一。在一分钟的记录中计算 R 波峰的数量（Figure 1）是计算心脏每分钟心跳（bpm）节奏的简单方法。更重要的是，心血管疾病和紊乱会影响\
  \ ECG 波形的节奏和形态。\n\n![Figure 6.1: Steps of learning system.](img/fig6_1_C.jpg)\n\n\
  Figure 6.1: Steps of learning system.\n\n心电图描记是 ECG。它可以告诉你关于你的心脏节奏和速度。异常的心电图描记可以表明各种疾病，除了心律异常。快速心跳（心动过速）、缓慢心跳（心动过缓）、心脏阻塞和不规则心跳都是心律失常的例子（心房颤动）。它还可以揭示有关心脏腔室扩大和心脏肌肉异常的信息。超声心动图是通过超声扫描获得的心脏结构和功能活动的动态图像。它显示了心脏泵血活动以及心脏腔室直径的精确信息。因此，它们是确定心力衰竭严重程度的有用测试。超声心动图还可以告诉你心脏瓣膜的工作情况。因此，一般来说，由于其低成本和时间消耗特征，以及能够更准确地确定心悸不规律的能力，ECG\
  \ 被认为更适合且更舒适地检测心律失常。\n\n寻找和分类心律失常对人类来说可能极其困难，因为有必要评估由 Holter 监测仪在数小时甚至数天内获得的 ECG\
  \ 读数的每个心跳。此外，由于疲劳，在处理 ECG 记录期间存在人为错误的风险。使用计算工具进行自动分类是一个选择。\n\n从 ECG 信号中检测心律失常的完整自动方法可以分为四个部分（Figure\
  \ 6.1）：ECG 信号预处理；心跳分割；特征提取；和学习/分类。在四个过程中每一步都采取措施，最终目标是确定心跳类型。这样的分类系统的前两个步骤（ECG 信号预处理和心跳分割）已被广泛研究\
  \ [2–6]。预处理程序直接影响最终结果，因此应仔细选择。在 QRS 检测的情况下，心跳分割阶段的结果几乎是完美的。然而，在与分类相关的步骤（特征提取和学习算法）中仍有探索和改进的空间。尽管\
  \ ECG 描记问题仍然开放，但对于此处调查的文献中的方法来说，它并不是很有用。\n\n\n\n\n\n鉴于其作为全球男女主要死因的历史 \\[1\\]，心脏病受到了大量关注。已经发现了多种危险因素，如高脂血症、高血压和肥胖，所有这些都与心脏病有关，包括吸烟习惯。通过识别这些危险因素，可以预测和预防心脏病。在最初阶段，必须识别出隐藏在非结构化临床信息中的风险变量。过去几年发表了许多研究，其重点是识别这些风险变量，并由此形成了公开可用的工具，如临床观察检查和知识提取系统，这是一种可以从各种来源提取信息的开源工具。\n\
  \n其他疾病，例如糖尿病，经常与心脏病相关联，它们具有一些明显的共同特征，如肥胖和吸烟状况，以及一些药物，如美托洛尔，都是需要考虑的因素。在本次调查的所有目的中，每一个都被视为心脏病的危险因素。\n\
  \n识别所有心脏病危险因素的最大困难在于，它们在临床文本中以多种类别出现。2014 年，国家生物信息整合中心 i2b2 在临床自然语言处理 NLP 挑战中宣布了风险因素识别赛道，以深入研究所有心脏病危险因素的识别。目标是找到有关心脏病风险的医学相关信息，并在纵向患者医疗记录的集合中追踪其演变。在受到启发后，创建了一个混合管道系统，该系统包括机器学习和基于规则的技术。\n\
  \n## 2. 背景\n\n有几种类型的心律失常，每种都与可用于识别和分类的模式相关联。心律失常分为两种类型。第一类包括形态学心律失常，即由单一不规则心跳引起的心律失常。本综述重点关注正常心跳的分类以及构成该类别的个体。这些心跳的形态或波频率会发生变化，心电图检查可以检测到所有这些变化。由于有时需要分析心电图记录中的每个心跳，因此心律失常的识别和分类对于人类来说可能是一项耗时的工作。\n\
  \n我们根据深度学习和机器学习的心律失常检测，在本文中选择了几篇研究文章进行综述。所选文章来自各种数据库，如 PubMed、Embase 和 Google Scholar\
  \ 只是其中几个可用的数据库。本综述仅包括 2014 年 1 月 12 日至 2021 年 12 月 30 日之间发表的同行评审出版物，预印本被排除。仅通过筛选标题、关键词和摘要来选择心律失常检测的深度学习出版物，在删除重复记录和非英语论文后。最后，选择了\
  \ 15 篇论文用于本次综述。\n\n## 3. 动机\n\n通过回顾文献，你可以发现当前知识体系中的空白。你可以发现仍需解决的问题或需要进一步工作的领域。通过专注于这些未开发的领域，这可以指导你自己的研究。它有助于比较和基准测试心律失常检测中使用的不同方法和方法。这可以帮助你确定哪些方法更有效、更准确或更适合特定应用。了解文献可以帮助选择心律失常检测的最佳智能计算策略。你可以从早期研究的成败中学习，以选择适合你自己的工作的适当技术和算法。\n\
  \n## 4. 文献检索方法\n\n选择了多个学术研究数据库，以汇编本次综述中 2010 年 1 月至 2022 年 9 月期间发表的相关出版物。PubMed、IEEE\
  \ Xplore、Springer、ScienceDirect 和 ResearchGate 是这些开源数据库的名称。IEEE Xplore 和 PubMed\
  \ 分别是生物科学和工程领域的前两大数据库 \\[7\\]。作为顶级研究出版商之一，Springer 为各个学科的文献提供了多种来源。ScienceDirect\
  \ 也被用于其众多和不同的同行评审期刊和出版物。作为活跃用户最多的学术社交网络，ResearchGate 提供了大量免费文章的访问权限 \\[8\\]。\n\n\
  使用了以下程序来收集数据源：\n1. 有针对性的互联网搜索。\n2. 根据相关性水平对来源进行分组。\n3. 根据 Table 6.1 中列出的纳入标准，选择了研究。\n\
  \nTable 6.1: Inclusion criteria for literature search\n\n| 参数 || 描述 |\n| --- | ---\
  \ |\n| 时长 || 2010–2022 |\n| --- | --- |\n| 文章类型 || 期刊和会议 |\n| 研究领域 || 智能计算和生物医学\
  \ |\n| 性能指标 || 准确率、灵敏度和特异性 |\n\n### 4.1 研究选择\n\n所选研究的范围包括以下情况：\n1. 研究任何类型心律失常的分类。\n\
  2. 过去 12 年内关于心律失常诊断的研究。\n3. 专注于不受其他心血管疾病影响的心律失常诊断的研究，可以准确指出这种异常发生的程度和条件，从而确定精确的诊断和预后。\n\
  \n### 4.2 文章选择方案\n\n在此，基于一些重要参数，如关键词搜索、摘要排序、重复删除和基于纳入标准的删除，表示了研究文章的选择和拒绝示意图。 Figure\
  \ 6.2 显示了文献检索和研究选择策略的整体进展。\n\n![Figure 6.2: Study selection approach.](img/fig6_2_C.jpg)\n\
  \nFigure 6.2: Study selection approach.\n\n在此方案中，我们最初搜索了 350 篇与生物医学智能计算相关的文章，然后我们删除了与红斑检测无关的文章。一些文章因重复识别而被删除，然后我们专注于仅选择完全符合纳入标准的文章。因此，最终选择了\
  \ 40 篇文章来执行系统文献综述过程。\n\n心律失常分类的不同方法：\n\n2015 年开发了一种用于检测心脏病危险因素的自动化模型，该模型基于糖尿病、高血压、高血压等各种疾病之间的关系及其对心脏风险的影响。此模型的数据集来自\
  \ I2V2 挑战组织者，并将其组织为与它们的指标或特征相关的三个不同标签（基于短语、基于逻辑和基于话语）。在这项研究中，数据使用注释指南进行预处理，并根据上述三个标签提取其特征。然后应用\
  \ SSVM，使用 SVMhmm、libshort text 6 实现 SVM，并使用 CRF suite 实现 CRF。此外，使用训练集上的 10 倍交叉验证部署并升级了所有分类器的参数，并获得了\
  \ 92.68，而 I2B2 挑战组织者已经获得了 92.76 的准确率。所开发的模型不适用于冠状动脉疾病 CAD、肥胖状况和吸烟状况等疾病 \\[1\\]。\n\
  \n\n\n\n\n另一项工作描述了一种基于堆叠去噪自编码器的自动可穿戴心电图（`ECG`）分类和监测系统（`SDAE`）。为了收集 `ECG` 数据，我们采用了配备无线传感器和\
  \ `Bluetooth 4.2` 的可穿戴设备来将数据传输到计算机。自动心律失常分类系统随后对这些 `ECG` 数据进行分类。具有稀疏约束的 `SDAE` 用于学习\
  \ `ECG` 特征表示。为了对 `ECG` 波形进行分类，采用了 `SoftMax` 回归。主动学习在微调阶段用于提高性能 [2]。\n\n#### 4.3\
  \ ECG 信号采集\n\n在一项研究中介绍了织物电极在胸大肌上的合适贴附方式，以及磁性接口确保织物电极与硬件平台之间的连接。使用了生物传感器平台来评估 `ECG`\
  \ 信号，使用 ADI `ECG` 模拟前端（`ADAS1001`）和 `STM32` 微控制器来实现数据处理、打包和重新传输到 `Bluetooth 4.2`\
  \ 智能终端。为了进一步降低功耗，实施了转换效率为 95% 的 `LDO` `DC-DC` 调节器。设计了一组数字滤波器来限制对 `ECG` 信号的广泛声音影响，因为它微弱且容易被大量噪声扭曲\
  \ [2]。\n\n数据库中包含来自 47 名患者的 48 条半小时的动态 `ECG` 记录。每条记录由两导联组成。45 条记录的第一导联使用改良肢体导联 II（`MLII`），其余使用改良导联\
  \ V5。第二导联为心外膜导联（前 40 条记录为 `V1`，其余为 `V2`、`V4` 或 `V5`）。从一组来自混合患者群体的四千条动态 `ECG` 影像中随机挑选了\
  \ 23 条记录的数据库；另外 25 份副本也是从同一组中随机挑选的，以包含较少见但临床上重要的心律失常 [3]。\n\n`MIT-BIH` 心律失常数据库是一个基于网络的数据库，由超过\
  \ 4000 条长期心电图（`ECG`）霍尔特记录组成。患者负责超过 60% 的记录。整个数据库包含从该组中随机挑选的 23 条记录（编号 100–124，部分编号缺失），以及从该组中挑选的\
  \ 25 条记录（编号 100–124，部分编号缺失）。几乎 200–234，部分编号缺失）是从同一组中挑选的，以代表一系列罕见但临床上重要的疾病。每条记录的采样频率为\
  \ 360 Hz，包含两个导联（从胸部不同角度记录的两个信号）。仅提取每条记录的一分钟长段，得到总共六条记录（3 条用于训练，3 条用于测试），每条包含 21,600\
  \ 个样本，约 60–80 个波形，具体取决于心率和类别（正常、`rbbb` 或起搏） [4]。\n\n数据库（称为 Long-term ST）包含来自 80\
  \ 名人类志愿者的 86 条长 `ECG` 记录，选用来展示多种 ST 段异常，例如缺血性 ST 事件、与轴相关的非缺血性 ST 事件、延迟 ST 水平漂移事件，以及结合这些现象的事件\
  \ [5]。\n\n#### 4.4 ECG 信号预处理\n\n数据预处理包括波形滤波和去噪。使用宽度为 200 ms 的中值，消除所有 `ECG` 信号，包括\
  \ P 波和 `QRS` 波群。滤波器。宽度为 600 ms 的中值去除 T 波滤波器。将原始信号从所得信号中减去以获得基线校正的 `ECG` 信号将被返回 [2]。\n\
  \n`MIT-BIH` 心律失常数据库的数据使用 0.1–100 Hz 的带通技术进行滤波，并在每秒 360 个样本的速率下数字化。使用了两种阶段的中值滤波方法来减少这些信号的基线漂移\
  \ [3]。\n\n尽管 `MIT-BIH` 数据库中的 `ECG` 数据不太可能像直接从患者采集的 `ECG` 数据那样具有大量干扰噪声，但它仍然包含一些需要处理的噪声以优化系统的未来阶段。因此，信号预处理阶段集中于消除\
  \ `ECG` 记录中的噪声，均值去除首先用于从 `ECG` 信号中去除直流噪声。不需要的直流分量被去除，并且信号基线幅度被推至零电平，通过从每个采样点减去 `ECG`\
  \ 记录均值来实现 [4]。\n\n为了降低低频噪声，`ECG` 信号通过截止频率为 20 Hz 的低通滤波器处理。基线漂移也通过运行截止频率为 0.3 Hz\
  \ 的高通滤波器来降低。使用 50 Hz 陷波滤波器来降低电源干扰噪声。最后，使用 `Pan-Tompkins` 方法 [23] 来准确地从 `ECG` 数据的\
  \ R 波峰中提取 `QRS` 波群 [5]。\n\n#### 4.5 特征提取\n\n平均 `RR` 和平均 `HR` 是最明显的特征。一些特征，如 `SDNN`、`SDSD`、`RMSSD`\
  \ 和 `PNN50`，是表征 `RR` 间期变异性的统计特征，而另一些特征，如 `TINN` 和 `HRV` 三角指数，则是几何特征 [5]。\n\n在查看\
  \ `ECG` 数据时，很明显，清晰定义每个类别（正常、`rbbb` 和起搏）的特征位于 `R-T` 间期之间。还很明显，每个类别的每个成员在此间期表现出相同的模式。在这种情况下，在每个\
  \ `R-peak` 之后检索 200 个采样点并作为输入馈送到迁移的基于深度学习的特征提取器（大约该数量的样本对应于采样频率为 360 Hz 的 `R-T`\
  \ 间期）。然后删除 `ECG` 波形的剩余部分 [4]。\n\n使用专门为本研究创建的基于网络的 `ECG` 注释工具对 `ECG` 信号的 30 秒记录进行注释。由经过心律失常识别强化培训并通过心血管认证国际组织的电生理认证考试的认证心电图技术人员执行标签注释。在他们开始工作之前，技术人员被给予了如何使用界面的说明。条带中的所有搏动均从起始到结束进行标记，导致输入\
  \ `ECG` 数据的完全分割。为每个心律转换制定了具体指南，以促进不同注释者之间的标记一致性 [8]。\n\n总共计算了 79 个特征，所有这些特征都在提供的软件文档中进行了详细说明。特征集中有三个主要分组：\n\
  \nRhythm features: `RR` 序列的统计参数，例如极限、中位数或中位数绝对偏差；心率变异性方面，例如 `PNN5`、`PNN10`、`PNN50`\
  \ 和 `PNN100` 测量；以及有关心律解释的信息，例如每种心律假设的中位持续时间 [9]。\n\nMorphological features: 这包括在传导抽象层面上对观察的持续时间、幅度和频率谱的数据，例如\
  \ P 波和 T 波、`QRS` 波群、`PR` 和 `QT` 间期，以及 TP 段。\n\nSignal quality features: 这些用于确定指示传导异常的形态学特征的重要性，例如宽\
  \ `QRS` 波群或长 `PR` 间期。\n\n\n\n\n\n时域、频域和非线性动态参数被用于区分冠状动脉疾病（CAD）患者和非 CAD 患者，根据 [10]。研究使用基于自回归（`AR`）建模的方法来产生功率谱密度以进行频域特征测量；`AR`\
  \ 谱是心率变异性（HRV）分析中最普遍的方法，该方法可分解为离散的谱分量 [10]。`AR` 模型更为复杂，其谱分解包括负分量的可能性。随后，作者使用了统计和几何属性，如\
  \ `SD`、`RMSSD` 和 `HRV` 三角指数来进行时域计算。\n\n##### 4.6 分类\n\n基于可迁移深度学习特征提取的 ECG 心律失常检测方法比非深度学习策略有了显著的提升，\n\
  \n此外，使用从 `AlexNet` 的深度全卷积层（第 6 层和第 7 层）提取特征的网络所获得的结果表明，经过在大规模标注数据集上训练的深度卷积神经网络的深层足以通用，可被迁移并用于\
  \ ECG 心律失常分类任务 [4]。\n\n数据集由 23 名健康志愿者和 23 名 CAD 患者的心电图信号组成。他们均在时域和频域进行了评估。由于生物信号是非线性的，因此采用了非线性方法来确定\
  \ ECG 的非线性方面。\n\n共有 9 个时域特征、24 个频域特征（`FFT` 和 `AR` 技术均有）和 12 个非线性域特征。更多维度意味着更多的时间、金钱和不必要的复杂性；此外，一些特征在\
  \ CAD 和非 CAD 受试者之间无法区分。\n\n因此，为了降低问题维度和计算复杂度，使用 `PCA` 方法剔除了不可区分的特征。作为输入，使用了从所述方法中得出的\
  \ 45 个特征 [5]。\n\n建议的系统使用四折交叉验证方法进行评估。数据集中有四个子集，随机大小相等。需要指出的是，我们的数据集因此包含 200 个阳性样本和\
  \ 200 个阴性样本。每个子组各有 50 个阳性样本和 50 个阴性样本。实验重复了四次，每次得到不同的结果。每次使用其中一个子集作为测试集。剩余的集合用作训练集。平均精度\
  \ – 本例中使用局部二值模式（`LBP`）和方向梯度直方图（`HOG`）。在此关注特定特征（例如强度，`LBP` 和 `HOG`），以及特征组合（`I+LBP`、`LBP+HOG`\
  \ 等） [6]。\n\n该方法使用 `RNNs` 的集成来联合识别时序模式。在分段 ECG 记录中，形态学模式，任何长度均可接受。具体而言，我们的策略实现了平均。\n\
  \n在 PhysioNet 的私有测试集 CinC Challenge 2017 上 `F1` 分数为 0.79（n = 3, 658）（n = 3, 658）（n\
  \ = 3, 658）（n = 3, 658）（n = 3, 658）（n = 3, 65）。正常心律、房颤和房颤样心律的评分为 0.90、0.79 和 0.68，此外还有其他心律失常等。我们的技术除了具有最先进的性能外，还保持了高度的安全性\
  \ [6, 7]。\n\n在心跳上使用软注意力机制提高了可解释性。我们本着开放研究的精神这样做。\n\nPhysioNet 2017 开放将提供我们心律分类算法的实现\
  \ [7]。\n\n在测试集上评估了心电医生的表现。请记住，测试集中的每条记录都包含来自三名心电医生的群体 ground truth 标签，以及来自另一组六名心电医生的个人标签。取所有个人心电医生\
  \ `F1` 分数的平均值，并使用群体标签作为 ground truth 注释来评估每个类别的心电医生表现 [8]。\n\n## 5. 讨论\n\n在 表 6.2\
  \ 中，我们讨论了特征提取技术以及使用特定方法获得的结果。似乎智能计算过程在检测心律失常方面发挥了重要作用，与手动诊断相比具有适当的准确性。在 2022 年，Ullah\
  \ 等人，\\[39\\] 获得了超过 99.35% 的准确率，Gao 等人，[24] 在 2019 年获得了 99.25% 的准确率。这表明在实现更好准确性方面取得了持续的进展，并且使用了各种降维技术来降低计算开销，并仅使用负责的特征实现更好的结果。\n\
