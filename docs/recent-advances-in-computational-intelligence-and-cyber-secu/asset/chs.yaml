  \ 160–168.\n\n# 22 基于模型测试实现安全软件开发的高效安全与工作流\n\nSandhya Satyarthi^(²²)\n\nDepartment\
  \ of Information Technology, Babasaheb Bhimrao Ambedkar University, Lucknow, India\n\
  \n### Abstract\n\n软件测试过程是影响应用程序整体性能的重要方面，对软件系统的整个生命周期至关重要。开发过程中的安全性发挥着关键作用，成败取决于安全实践。在敏捷开发方面，持续集成和改进贯穿软件开发的始终。模型化测试（MBT）是当今测试自动化的关键组成部分，构成了软件测试演进的一部分。与传统测试方法相比，MBT\
  \ 可更迅速、更经济、更成功地管理和完成测试任务。本文将讨论 MBT 中的安全挑战以及在安全敏捷软件开发中 MBT 改进工作流。\n\n**关键词：** 模型化测试（MBT），SSD（安全软件开发），SDLC（软件开发生命周期），敏捷软件开发（ASD）\n\
  \n### 1. Introduction\n\n安全性始终是开发过程中的主要关注点，我们认为测试是最受关注的领域之一，因为它有助于在安全软件开发中识别和消除风险。测试安全关键系统至关重要，因为故障或失效可能对人员、财产或环境造成严重伤害。创建能够检测潜在缺陷的测试用例是一项重要的测试任务。模型化测试（MBT）通过使用被评估系统及其/或其环境的模型来创建测试工件。为了发现、评估和表征\
  \ MBT 在软件安全方面的最新进展，本文将介绍一项系统映射研究 [1, 3]。尽管 MBT 已在采用敏捷方法论的组织中使用，但人们也在研究 MBT 如何在这些环境中成功应用。安全测试是一种广泛使用的技术，通过检测漏洞并确保安全功能来确定和增强软件安全性\
  \ [2]。当今软件系统的可用性导致了采用适当的测试策略以进行有效和高效的安全测试的需求日益增长。因此，研究人员通过对实际安全测试技术的概述来评估和改进流程将大有裨益，而从业人员也可以自行应用和传播这些技术。MBT\
  \ 是一种创新的软件测试方法，它将测试自动化的主要目标从执行测试扩展到通过基于模型自动创建测试来进行测试设计 [4, 5 and 6]。除了熟悉适当的工具外，新方法还要求培养新的技能，例如测试建模专业知识。MBT\
  \ 通过首先构建被测系统的模型，以系统化和有序的方式生成测试用例。由于 MBT 使用模型来定义系统的行为，因此可以实现对被测系统的全面覆盖 [7]。由于更容易访问边缘情况，因此可以对更广泛的输入和条件进行测试。通过对系统建模，可以在开发之前或开发早期阶段发现和纠正任何问题和不一致性\
  \ [8, 9]。在创建软件时，敏捷团队通常需要适应不断变化的需求。MBT 可以帮助实现敏捷开发所需的灵活性。当相关模型发生更改时，可以根据更新后的模型生成测试用例\
  \ [10, 12]。通过将模型与需求联系起来并从模型中开发测试用例，团队可以通过确保测试工作充分满足既定需求来提高透明度和可验证性。这项工作有助于找出 MBT\
  \ 中需要关注的挑战。之后设计了一个框架来帮助安全软件开发。\n\n研究方法，如 Figure 22.1 所示，解释了如何构建安全软件开发的框架并识别现有文献中的差距。\n\
  \n![Figure 22.1: Research method description.](img/fig22_1_C.jpg)\n\nFigure 22.1:\
  \ Research method description.\n\n预计该框架将帮助软件开发团队识别关键的软件安全问题，并了解构建安全 Scrum 敏捷软件所需的安全工件。\n\
  \n本文其余部分的结构如下。第二部分，我们讨论了促使我们开始研究的因素以及导致研究空白的初步研究。MBT 集成到敏捷软件开发中，如 section 2 中所述。在\
  \ section 3 中，我们将讨论 MBT 中的各种挑战和问题。在 section 4 中，讨论了工作流，该工作流有助于 MBT 解决并改进前一节中讨论的挑战。\
  \ Section 5 讨论了研究结果并提供了总结和进一步研究的建议。\n\n## 2. Literature Review\n\n2004 年，使用战斗制导系统的主要案例研究进行了一项实验，创建了在各种结构覆盖标准下提供覆盖的精简测试套件，并跟踪了这些测试套件在定位故障方面的成功率。我们的研究结果表明，基于规范的测试套件的大小可以大幅减少，并且精简测试套件发现故障的能力会受到负面影响。在本研究中，我们介绍了我们的实验，检查了研究结果，并讨论了基于正式规范的测试可能受到的影响\
  \ [11]。\n\n2011 年，Mark Utting 等人概述了 MBT 流程以及涵盖 MBT 方法论基本要素的分类法。其目的是帮助对特定 MBT 工具中采用的方法进行分类，并了解此类方法的特征、相似性和差异\
  \ [13]。\n\n\n\n\n\n在 2016 年，Mathaikutty 等人提出了该研究，旨在彻底审查 MBT 的最先进的实验性 SBT 应用，并描述现有文献的局限性以指导未来的研究。研究人员可以通过基于所提出分类法的系统审查现有文献来探索当前的研究工作并确定需要进一步研究的任何差距\
  \ [14]。\n\n在 2018 年，一项研究表明 MBT 可以为软件安全测试提供显著优势。辩论主要趋势和方法，解释挑战，并辩论这些发现。有许多潜在的解决方案，但需要更多的研究来开发一种值得信赖的基于模型的安全测试策略\
  \ [15]。\n\n在 2019 年，Tugkan Tuglular 等人引入了一种基于新型增量测试范式的 MBT 生成方法，用于使用 SPL 生产的产品。介绍特征事件序列图（FESGs），即事件序列图（ESGs）的扩展，它提供了定义和操作，以便在\
  \ SPL 中实现测试模型方面的共性和可变性。他们使用案例研究将他们的方法与隔离测试程序进行比较 [16]。\n\n研究表明 MBT 对开发具有巨大影响。随着敏捷的迭代和增量开发过程，人们认为\
  \ MBT 可以通过使用各种 MBT 技术而变得有用。在即将到来的 第 3 节 中，我们将讨论 MBT 中出现挑战和问题。在 第 4 节 中，讨论了一种流程的工作流，以使用\
  \ MBT 方法改进安全软件开发。在 第 5 节 中，讨论了研究的结论以及对各种开发策略的未来影响。\n\n### 3\\. 模型化测试中的挑战\n\n在使用敏捷方法在安全环境中进行\
  \ MBT 时可能会出现一些特殊困难。这些困难源于将安全测试顺利融入敏捷流程，同时关注迭代开发和快速发布的要求。以下是一些主要困难：\n\n1. **敏捷开发节奏：**\
  \ 敏捷开发以其快速的周转时间和频繁的迭代为特征。由于安全测试可能比开发周期花费更长，因此将以安全为重点的建模和测试集成到这种快节奏环境中可能很困难。\n\n\
  2. **技能差距：** 敏捷团队有时可能缺乏必要的安全知识。弥合技能差距并确保团队成员理解安全概念和程序可能很困难。\n\n3. **与敏捷工件的集成**：将安全模型、威胁分析和以安全为重点的测试用例与敏捷工件（如用户故事和冲刺计划）集成可能具有挑战性\
  \ [17]。必须确保安全考虑与其它功能需求同等重要。\n\n4. **安全义务：** 为了满足敏捷截止日期而匆忙进行安全评估可能会导致安全债务，从而将漏洞推迟到后续迭代。这可能是不太安全的应用程序的结果。\n\
  \n5. **持续反馈**：敏捷鼓励持续反馈，但安全测试可能会导致反馈过程滞后，特别是如果彻底的安全评估需要一些时间。\n\n6. **协作与沟通：** 有效的安全测试取决于安全专家、测试人员、开发人员和其他利益相关者之间的有效沟通和协作。确保安全发现得到认可并迅速处理可能具有挑战性\
  \ [18, 19]。\n\n7. **不断变化的威胁环境：** 漏洞和攻击路线不断发展，使得安全威胁环境具有动态性。敏捷安全实践必须迅速应对这些变化。\n\n\
  8. **遵守法规：** 为什么在敏捷环境中遵守法律标准，例如 GDPR 或 HIPAA，可能很困难。必须确保测试程序和安全模型符合这些规则。\n\n以下是我们讨论的一些挑战和问题，它们影响了整体开发过程。为了应对并顺利进行开发，使用测试以安全的方式进行开发，设计了一个工作流或框架，可以在下一节中讨论。\n\
  \n### 4\\. 提高模型化测试以实现安全软件开发的建议工作流\n\n一种称为“基于模型测试”的软件测试策略“model-based testing”（MBT）利用模型来创建和运行测试用例。这些模型充当被测系统功能和要求的表示，帮助测试人员系统地生成测试用例并确保测试覆盖率。\
  \ 图 22.2 描述了工作流，并且以下步骤通常包含在 MBT 流程中：\n\n![Figure 22.2: Workflow for improved MBT\
  \ in SSD.](img/fig22_2_C.jpg)\n\nFigure 22.2: Workflow for improved MBT in SSD.\n\
  \n1. **了解安全需求**：首先，确保您了解适用于项目的法律合规标准和安全需求。明确在您的情况下什么是安全的程序。\n\n2. **安全培训和意识：** 确保您的开发团队，包括作家、测试人员和其他重要人员，接受安全培训和意识计划。每个人都应了解常见安全威胁、最佳实践和安全编码规则。\n\
  \n3. **弄清安全模型并从一开始就构建安全：** 弄清适用于您工作的安全模型 [20]。威胁模型、攻击面模型、数据流模型、访问控制模型以及其他显示系统安全性如何的模型是一些示例。此外，从开发的非常开始就考虑安全问题，即在收集需求和规划架构时。除了实用的模型外，还要创建以安全为重点的模型以帮助测试。\n\
  \n4. **威胁建模和测试模型创建：** 使用威胁建模以有计划的方式找到可能的安全漏洞和威胁。这些模型可以帮助您计划安全测试并提出有用的测试用例。基于您的需求和安全模型制定测试模型\
  \ [21]。这些测试模型应包括安全场景、攻击方式以及在安全方面的预期结果。\n\n5. **协作工作以确保代码审查：** 鼓励开发、测试和安全团队进行交流和协作。确保安全问题和发现能够迅速共享，并使人们能够轻松地分享知识。除了常规代码审查外，还进行安全代码审查。使用您的安全模型来指导审查过程，以确保满足安全标准。\n\
  \n6. **静态分析和动态扫描**：使用静态代码分析工具和动态应用程序安全测试（DAST）工具来帮助您的 MBT。这些工具可以找到模型可能无法涵盖的模型中的漏洞。这些在彻底分析整个过程方面很有帮助。\n\
  \n\n\n\n\n#### 7. 具备持续培训和改进的事件响应计划制定\n制定一份事件响应计划，告知团队在项目构建过程中发生安全漏洞或发现漏洞时该怎么做 [22]。确保每个人都知道自己需要做什么也很重要，安全开发实践通过利用从安全事件和测试中获得的经验不断改进。提供持续培训并将评论作为工作方式的一部分。\n\
  \n#### 8. 第三方安全评估\n考虑获取第三方安全评估，例如渗透测试，以确保安全措施有效并发现可能遗漏的漏洞。\n\n#### 9. 合规性验证\n确保你的\
  \ `MBT` 方法能够证明其遵循所有安全规则和标准。记录并跟踪安全测试的结果 [23]。\n\n#### 10. 持续监控和基于风险的方法以确保安全工件的完成\n\
  确保生产应用程序不断被扫描安全风险和漏洞，以便在出现时修复 [24]。根据风险估计为安全测试设定优先级。关注最重要的部分和最危险的安全点。\n\n我们描述的工作流程由需求的分析和理解发起，安全培训和意识是理解所有安全方面的必要条件，然后在安全培训和分析的基础上找出最合适的模型，并使用威胁建模来找出可能的安全漏洞，然后制定测试用例\
  \ [25, 26]。\n\n在基于需求和安全模型制定测试用例后，需要鼓励协作工作以朝满足安全标准方向努力并启动代码审查。此外，还进行静态和动态分析以找出模型中的漏洞，这可以有效地分析整个模型。扫描后会制定事件响应计划，这有助于告知安全团队是否存在任何安全问题或漏洞。需要第三方评估来纠正安全措施是否有效，然后对\
  \ `MBT` 生成的测试用例进行合规性分析，以分析是否遵循了所有标准和指南。\n\n在此工作流程结束时，重要的是确保持续监控和在遵循基于风险的方法方面的改进，以操纵和更新与安全相关的一些关键领域。总体而言，需要从初始阶段到测试用例的最终生成对安全进行确认，这些测试用例可用于使用。\n\
  \n### 5. 结论\n\n`MBT` 在敏捷软件开发中增加了测试覆盖率，实现早期缺陷检测，有助于测试自动化，促进团队合作，使其能够适应变化，并使追踪和记录流程变得更简单。通过使用模型来指导测试工作，敏捷团队可以提高软件质量、反馈周期和利益相关者满意度。基于调查的问题，有必要专注于提供一个工作流程，有助于在各个阶段启动测试，并且通过逐阶段推进，有助于将安全实践纳入其中，以激发安全的软件开发流程。在未来的工作中，我们将尝试通过比较分析找出最佳的\
  \ `MBT` 技术并推动自动化测试用例生成。\n\n### 参考文献\n\n1. Höpfner, G., Jacobs, G., Zerwas, T., et\
