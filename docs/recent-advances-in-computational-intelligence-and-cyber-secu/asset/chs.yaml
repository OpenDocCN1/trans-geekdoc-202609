  \nFigure 37.13: Samples of Bosphorus dataset.\n\n## 3. Literature Review\n\n此前已提出了许多\
  \ `FER` 调查，例如 [16, 17, 18 and 19]。但没有一篇涵盖全部三种 `FER` 技术。本节提供了 `FER` 技术的文献综述，将其分为三类：基础、微表情和\
  \ 3D `FER`。\n\n### 3.1. Basic FER techniques\n\n由于现实世界情况下面部表情存在头部位置变化、光照、遮挡、显著的类内差异和类间相似性等不可控变量，精确识别人类面部表情是一项具有挑战性的任务。为解决这些障碍，Zhou\
  \ 等人 [20] 提出了一种新颖的技术，用于学习具有判别性的表情相关表征。\n\n在不规则光照或部分面部遮挡条件下，面部表情识别网络的性能明显变差。Zhu 等人\
  \ [21] 提出了一种基于局部空间特征、多尺度立体空间上下文特征和时序特征的系统。\n\n一种用于精确面部表情识别的新方法。它采用两阶段学习技术。设计并训练了一个全局通用子网络和两个任务特定子网络，以明确地从图像中分离出令人困扰的面部表情方面\
  \ [22]。\n\n深度判别关联学习作为一种强大的深度半监督网络，在面部表情识别中取得了惊人成果。为更好地利用面部深度信息和未标记数据，Jin 等人 [23]\
  \ 开发了一种方法。仿真表明，所提出的技术在性能上可与现有深度网络相媲美，并且对光照变化更具鲁棒性。\n\n理解人类行为、课堂评估、消费者反馈和教育都显著依赖于面部表情识别。设计了一种分层方法，可以系统地提高从核、网络和知识尺度获得的信息\
  \ [24]。它已采用扩张 inception 块来增强核尺度数据提取。\n\n由于不同表情之间细微差异以及域之间巨大差异，Li 等人 [25] 提出了一种新方法，用于在语义感知域自适应期间推导多级判别特征。\n\
  \n由于面部结构差异和文化特定的面部特征导致面部表情表示存在差异，跨文化面部识别具有挑战性。种族身份网络和种族身份网络被设计为协同工作，以学习种族身份感知的面部表情\
  \ [26]。\n\n由于分辨率降低导致判别特征丢失，将多个低质量面部图像分类到适当组别仍然是一个困难的过程。Nan 等人 [27] 描述了一种独特系统，该系统在保留高分辨率面部图像的同时降低了隐私泄露风险。\n\
  \n在移动互联网时代，对轻量级网络和实时性能的需求日益增加。为实现这一目标，[28] 提出了一种轻量级 `A-MobileNet` 模型。文献中还存在其他方法\
  \ [29, 30, 31 and 32]。\n\n### 3.2. Micro FER techniques\n\n由于微表情包含细微的面部变化，提取这些变化具有困难，微表情识别变得困难。最近提出了许多微表情识别技术，建议了多种表情共享特征算法。然而，它们并未指出导致性能不佳的确切判别特征。因此，Zhou\
  \ 等人 [33] 提出了一种用于微表情识别的特征细化方法，其中包括面向表情的特征学习和融合方法。其目标是从特定表情中提取突出且决定性的特征，并通过组合这些特征来预测表情。\n\
  \n面部微表情揭示了人们的真实感受，并用于早期月经疾病干预、智能监控和许多人机界面系统。然而，当前微表情数据集不足，这使得训练强分类器变得困难。为处理这种情况，Li\
  \ 等人 [34] 提出了一种强大的微表情识别技术来模拟微小面部肌肉运动。\n\n尽管计算机视觉技术取得了进步，但由于微表情持续时间短、强度低，微表情识别仍然具有挑战性。相比之下，它们为检测真实的情感体验提供了关键指标。提出了一种具有隐式深度特征增强的新型块划分卷积网络\
  \ [35]。它将每张图像划分为一组小块，然后对这些块应用卷积和池化操作。\n\n\n\n\n\n目前已有多种方法可以快速表示面部肌肉运动特征，包括几何分析。然而，由于情感的细微性，该学科中的准确识别仍然是一个挑战。为了解决这一问题，Buhari\
  \ 等人，\\[36\\] 提出了一种基于几何原理的革命性不可见情感增强技术。该算法还包含一个参数，用于调整放大程度以获得最佳效果。利用基于地标的面部图谱，对所提出的架构进行了评估。\n\
  \n尽管已经开发出各种有效的无监督域适应方法，但它们无法解决无监督方法的难题。为了解决这种困难的情况，Zhu 等人，\\[37\\] 提出了一种独特无监督域适应方法。\n\
  \n### 3.3. 3D FER 技术\n\n面部特征通常用于识别面部表情。然而，光照和位置的变化是此类识别系统的问题。提取互补面部图片中的表情相关元素，以解决光照和姿势变化以及定义低情感强度情感的外观特征\
  \ \\[38\\]。\n\nFu 等人，\\[39\\] 提出了一种用于 3D 面部表情识别的独特方法，使用嵌入式张量流形正则化。为了保留结构信息和相关性，利用\
  \ 2D 面部图像和 3D 面部形状模型构建 3D 张量。它在开发具有收敛分析和计算成本的块坐标下降技术以有效解决张量优化问题之前，先以驻定端点形式定义一阶最优性准则。通过\
  \ BU3DFE 和 Bosphorus 数据集上的数值结果证明了该方法的有效性。\n\n由于不同表情之间的细微区别以及域之间的大量分歧，Li 等人，\\[40\\\
  ] 提出了一种在语义感知域适应期间提取多级判别特征的新方法。此外，它还创建了一个互信息减少模块，通过同时细化域不变分量并去除域敏感分量来提供帮助。通过提供正确的伪目标标签，可以实现判别可迁移特征学习。此外，与仅依赖全局特征不同，它创建了一个多层特征提取模块，同时检索局部和全局特征。它包含精确的信息，可以区分不同表情之间的细微差异。这些模块以端到端的方式使用，以验证源信息是否正确转移。七个数据库上的广泛实验结果表明，该系统优于现有的基线。\n\
  \n## 4. 结论\n\n本研究的主要目标是提供 FER 最新进展的简要描述。在此，FER 技术已分为三类：基础、微表情和 3D FER 技术。为此提供了简要的文献综述。此外，我们还提供了与每个类别相关的<|message|>\
  \ 数据集的简要描述，以便读者了解现有文献以及数据集。该综述可以扩展到 ML、深度学习、迁移学习和其他学习技术。\n\n### 参考文献\n\n1. Nigam,\
