  \ tracking.\n\n$$F = \\\\left( - k\\\\overset{˙}{s} = - k \\\\middle| s \\\\middle|\
  \ {}\\_{\\\\infty}{sgn}(s) + \\\\frac{\\\\text{UA}\\\\left( {\\\\text{Tr} - \\\\\
  text{Tj}\\_{j}} \\\\right)}{\\\\text{mjCpj} - \\\\text{Td}\\_{\\\\text{j}}} \\\\\
  times \\\\frac{mj\\\\text{Cpj}}{\\\\text{Cpc}\\\\left( {T\\_{j} - Tc} \\\\right)}\
  \ \\\\right.$$\n\nFigure 30.4 的轨迹跟踪响应在整个轨迹跟踪过程中出现了轻微振荡，并且冷却剂流量消耗很高。这表明 `SMC` 控制算法需要修订以改善闭环响应。\n\
  \n### 3.3. PI sliding surface\n\n设计了切换控制律，其中滑模面被选为比例微分控制器，这消除了偏移并提供了良好的跟踪。由于间歇反应器的应用是跟踪温度，误差方程是滑模变量。幂次到达律被用作到达方程，以实现快速收敛。`PI`\
  \ 控制器的方程为\n\n`K = kpep + kpki∫epdt + P1(0)`\n\n因此选择误差 `ep = Td - Tj`\n\n代入 `PI`\
  \ 方程，滑模面如下\n\n$$\\\\overset{˙}{s} = kp\\\\left( {{\\\\overline{\\\\text{T}}}\\_{\\\
  \\text{d}} - {\\\\overset{˙}{\\\\text{T}}}\\_{\\\\text{j}}} \\\\right) + \\\\text{kpki}\\\
  \\left( {\\\\text{Td} - \\\\text{T}\\_{\\\\text{j}}} \\\\right)$$\n\n对滑模面求导，我们得到\n\
  \n$$\\\\overset{˙}{s} = kp(\\\\overset{˙}{T}d - \\\\overset{˙}{T}j) + kpki(Td -\
  \ Tj)$$\n\n为确保状态到达滑模面，等同于到达律方程\n\n$$\\\\begin{array}{l} \\\\left. \\\\overset{˙}{\\\
