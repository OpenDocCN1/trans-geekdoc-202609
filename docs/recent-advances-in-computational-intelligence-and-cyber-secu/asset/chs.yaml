  \ **G2** || **GS[L]** || **GS[W]** || **G** || **Lqw** || **Wqw** |\n| 7 || 1 ||\
  \ 4 || 4 || 13 || 1.5 || 0.25 || 4 || 1.5 |\n\n可用于设计和制造天线的有用天线方程为 [1]：贴片宽度 `W[p]`\
