  \ of model 1 and model 2.\n\n\n\n\n\n根据分析，`model 2` 相较于 `model 1` 表现更优，准确率为 87.9%。当使用卡方方法时，得到的值分别为\
  \ 0.79396、0.37、0.63036 和 0.53769，而 mRMR 模型得到的值为 0.76737、0.41、0.58886 和 0.47987。比较显示在\
  \ 图 24.6 中。随后两个训练好的模型均进行了测试并应用了贝叶斯优化。我们考虑了两个名为 `poi` 和 `jEdit` 的软件进行测试。这导致两个模型均超过\
  \ 80% 的准确率，这对于预测软件可维护性的任何模型来说都是积极的信号。两个不同的开源软件即 `jEdit` 和 `poi` 形成了 图 24.7，很明显 mRMR\
  \ 后接优化 SVM 比卡方后接优化 SVM 更好。我们的提案有效地使用预测变量，并且它们在每个模型中都被常用使用。结果还显示指标 `ce`、`lcom`、`lcom3`、`loc`\
  \ 和 `noc` 是面向对象软件可维护性预测的最重要特征。MRMR 和卡方对准确率影响很大，但 mRMR 产生的准确率比使用卡方方法构建的模型高出 87.9%，而后者产生的准确率为\
  \ 84.5%。\n\n![图 24.6 基于测试的模型 1 和模型 2 的比较。](img/fig24_6_C.jpg`)\n\n图 24.6 基于测试的模型\
  \ 1 和模型 2 的比较。\n\n![图 24.7 jEdit 软件和 poi 软件的准确度度量比较。](img/fig24_7_C.jpg`)\n\n图 24.7\
  \ jEdit 软件和 poi 软件的准确度度量比较。\n\n## 6. 结论\n\n使用 mRMR，找到了软件可维护性预测模型的最重要变量，并选择了以下变量：`dit`、`noc`、`rfc`、`lcom`、`Ce`、`npm`、`lcom3`、`loc`、`cam`\
  \ 和 `ic`；`noc`、`cbo`、`lcom`、`ca`、`Ce`、`dam`、`moa`、`lcom3`、`loc` 和 `amc`。mRMR 与优化\
  \ SVM 集成的方法的结果优于卡方后接优化 SVM。采用贝叶斯方法进行超参数微调，并使用高斯核函数进行预测模型优化。与当前可用的各种 SMP 研究相比，我们的方法具有更高的准确率。未来，我们还将致力于将\
  \ k-NN、决策树和神经网络与元启发式搜索优化算法集成，以创建更好的 SMP 模型。\n\n### 参考文献\n\n1. Malhotra, R. and Lata,\
