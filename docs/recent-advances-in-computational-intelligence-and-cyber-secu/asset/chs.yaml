  \ Adomavicius 和 Kwon 的先前研究 [4, 17]。稀疏性一直是许多协同过滤 `RSs` 的主要缺点，这会显著影响项目推荐的准确性。`CF`\
  \ 算法在评分数量较少时生成效率低下的推荐。`CF` 推荐算法需要足够数量的评分数据。聚类以及基于模糊规则的方法已在本次工作中用于解决此问题。聚类技术旨在提高推荐代理的效率\
  \ [4, 17]。*e 模糊逻辑方法被证明在解决 `CF` 基于推荐系统中的稀疏性问题方面是有效的 [2, 3, 21]。此外，Adomavicius 和 Kwon\
  \ 提出的 [4, 17] 技术在本次工作中用于建立用户相似性（见公式 (7)），之后将其作为基于模糊的相似性计算技术应用。*e 建议方法的部署实现了两个用户的平均相似度，根据\n\
  \n(7)\n\n$$\\\\sin\\\\left( {u,u^{\\\\prime}} \\\\right) = \\\\frac{1}{k + 1}{\\\
  \\sum\\\\limits\\_{c = 0}^{k}\\\\sin\\_{c}}\\\\left( {u,u^{\\\\prime}} \\\\right)$$\n\
  \n推荐系统最初在在线推荐阶段发现活跃或目标用户以及活跃或目标酒店。*e 评分预测以及推荐的任务在下一阶段进行。*e 第一个任务包括根据特定活跃用户确定的优先级预测与酒店列表相关联的评分的每种算法。在第二阶段，系统包括排名，为活跃用户列出尚未评分的项目列表，之后提供\
  \ Top-N 推荐，包括推荐列表中的前 N 家酒店。\n\n### 4. 结果与讨论\n\n统计数据代表了数据集中评分和月份的分布。\n\n#### 4.1.\
  \ 评分\n\n数据集包含 120 个观测值的评分。评分范围为 1 到 5。评分的频率和百分比细分如下：\n\n评分 1：15（12.5%），\n\n评分 2：21（17.5%），\n\
  \n评分 3：20（16.7%），\n\n评分 4：12（10.0%），\n\n评分 5：52（43.3%）\n\n#### 4.2. 月份\n\n数据集包含不同月份的数据。月份的频率和百分比细分如下：\n\
