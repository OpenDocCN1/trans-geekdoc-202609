  \ 3。图 25.3 显示了天线 1、天线 2 和天线 3 的回波损耗。天线 3 是所提出的天线。天线 1 在 3.3–4.5 GHz 谐振；它还在 3.8 GHz\
  \ 显示接近 -19dB 的回波损耗。在贴片上添加 2 条带状线并在贴片上切开后设计了新的天线，即天线 2，其工作在 2 个频段，即 3.3–4.3 GHz 和\
  \ 6.4–7.3 GHz，谐振频率为 3.7 和 6.9 GHz，且回波损耗较差，分别为 -23.27 和 -19.16dB。为了使天线实现三频，添加了带状线\
  \ 3，并在基板底部平行添加寄生元件，从而改善了天线的回波损耗。天线 3（最终天线）在 3 个频段工作，即 3.1–4 GHz、5.3–5.8 GHz 和 7.3–8\
  \ GHz，回波损耗良好，分别为 −37、−22 和 −25 dB，覆盖 WiMAX 3.5/5.5 GHz 和 C 频段 7.5 GHz。\n\n![图 25.2\
