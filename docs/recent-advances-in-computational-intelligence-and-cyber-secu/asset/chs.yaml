  \ \\[19\\].\n\nAI creates SMAs which are indeed used in variety of industries for\
  \ example: Consumer electronics, construction, and energy. Apart from the mentions\
  \ there are a lot of use cases of SMAs in the field of computer science and IT.\
  \ Below are a few illustrations:\n\nMicrofluidic devices: Devices which can manipulate\
  \ and control fluids at the micro level can be made using SMAs. Indeed creating\
