  \ 978–0–19–960291–9, 第 194 页。\n\n# 19 人工智能与机器学习：问题与方向\n\nShikha Gautam^(¹⁹)\n\n\
  工程学院与技术学院，计算机科学与工程系，勒克瑙大学，勒克瑙，印度\n\n#### 摘要\n\n随着数据、信息和技术的卓越发展；人工智能（AI）、机器学习（ML）和深度学习（DL）算法被用于改造每一个领域。目前\
  \ AI 和 ML 影响着所有有生命和无生命的事物。我们借助这一技术进步改善科学、技术、工程、研究、教学和管理。正如我们目前正处于第四次工业革命（工业 4.0），其特征是自动化程度提高和智能机器与智能工厂功能增强，经过良好处理的<|message|>\
  \ 数据有助于更有效地、更具生产力和效率地制造商品和服务，超越价值链管理。本文批判性地分析了关于 AI 和 ML 的当前和新颖文献，并讨论其对未来的可能性和影响。本文还讨论了该领域的问题和方向。本文回顾了本世纪发表的\
  \ AI 和 ML 研究论文，从 1999 年到 2023 年，以考虑工业 4.0 启动前后的研究。每篇重要的研究都经过了审查和分析，这些研究基于 AI 和 ML\
  \ 应用。最有趣的发现是，美国发表的研究数量最多，且在工业 4.0 诞生后研究兴趣显著增加。\n\n**关键词：** 人工智能，机器学习，综述，应用，工业 4.0，方向\n\
  \n## 1. 引言\n\nAI 的开端是在 1950–1956 年这一时间段，当时人们对 AI 的兴趣真正达到高潮。艾伦·图灵发表了他的研究“计算机机械与智能”，最终成为“图灵测试”，专家用它来衡量计算机智能。术语“人工智能”（AI）被创造并开始得到合理使用。在\
  \ 1950 年代之后几十年，机器学习（ML）的演进包括了许多值得注意的发展。\n\nMurphy \\[1\\] 的研究中可以找到一个很好的定义。他将 ML\
  \ 定义为一组方法，这些方法可以反复在数据中检测模式，然后利用发现的模式来计算未来数据或在不确定性中执行其他类型的决策。ML 可分为三大类：具体来说是有监督学习（SL）、无监督学习（UL）和强化学习（RL）。\n\
  \n1955 年，约翰·麦卡锡组织了关于“人工智能”的研讨会，这是该术语的首次使用，此后进入流行使用。此后 AI 成熟期（1957–1979）开始，1958 年约翰·麦卡锡撰写了列表处理（LISP），这是\
  \ AI 研究的第一个编程语言，至今仍在流行使用。\n\n\n\n\n\n### AI 开发时间线\n\n1959 年，Arthur Samuel 在一次演讲中谈到训练机器比编程它们的程序员更好地下棋时，开始了非常创新的研究“机器学习”。\n\
  \n此后在 1961 年，原型的工业机器人 `unimate` 开始在新泽西州通用汽车的装配线上运行，负责运输压铸壳体和焊接汽车零件（这被认为对人类更有害）。\n\
  \n1965 年，Edward Feigenbaum 和 Joshua Lederberg 发明了基础“专家系统”，这是一种特殊的 AI 程序，用于响应人类的思维和决策能力。\n\
  \n1966 年，Joseph Weizenbaum 构建了第一个“聊天机器人”（现为聊天机器人）`ELIZA`，这是一个应用自然语言处理（`NLP`）与人类交谈的人工心理治疗师。1968\
  \ 年，苏联数学家 Alexey Ivakhnenko 在期刊“Avtomatika”上推广了研究论文“数据处理群组方法”，该论文提出了一种新颖的 AI 方法，这将演变为我们现在所知的“深度学习（`DL`）”。\n\
  \n另一位应用数学家 James Lighthill 于 1973 年撰写了一份给英国科学委员会（`BSC`）的描述，强调发展并不像科学家所承诺的那样高尚，这导致英国政府对\
  \ AI 研究的援助和资金大幅减少。\n\nJames L. Adams 于 1961 年发明了“斯坦福小车”，这是最有用和最早的自主车辆示例之一。1979 年，它成功地在没有人工干预的情况下穿过一个布满椅子的房间。\n\
  \n1979 年，美国人工智能协会成立，该协会目前被称为人工智能促进协会（`AAAI`）。\n\n1980 年代的大部分时间里 AI 出现了快速增长和兴趣，这现在被称为“人工智能热潮”1980–1987\
  \ 年。这源于研究成功以及政府为维持研究人员而提供的额外资金。`DL` 技术和专家系统的应用变得更加被接受，两者都允许计算机从经验、错误中学习并做出独立决策。\n\
  \n1987 年，Alactrious Inc. 开始商业化。Alacrity 是原始的战略管理咨询系统，并遵循一个包含 3,000 多条规则的复合专家系统。\n\
  \n此后 AI 寒冬从 1987 年开始持续到 1993 年。正如 `AAAI` 所评估的那样，AI 寒冬开始了。该术语解释了一个用户、公众和私人对 AI 兴趣低迷的时间范围，这导致研究资金被削减，也导致了一些突破。政府和私人投资者都失去了对\
  \ AI 的兴趣并暂停了资金，因为成本增加而回报似乎减少。这次 AI 寒冬出现的原因是机制市场和专家系统的一些挫折，以及第五代项目的结束、预定计算计划的削减和专家系统部署的放缓。\n\
  \n此后 AI 代理（1993–2011）开始，由于 AI 寒冬期间缺乏资助，90 年代初在 AI 研究方面取得了一些显著进展，包括首个能够击败现任世界冠军国际象棋选手的\
  \ AI 系统的诞生。这一时代还通过 2000 年的初始 `Roomba` 和 Windows 计算机上首个商业可用的语音识别软件等创新，将 AI 引入日常生活。\n\
  \n2000 年，Cynthia Breazeal 教授设计了首个能够用面部复制人类情感的机器人，其中包括眼睛、耳朵、眉毛和嘴巴。它被称为 `Kismet`。2006\
  \ 年，许多公司如 Twitter、Facebook、Amazon 和 Netfix 开始将 AI 作为其用户体验（`UX`）、推广和广告算法的一部分使用。\n\
  \n2011 年，`NLP` 计算机程序用于回答问题名为 `Watson`（由 IBM 创建）在电视游戏中赢得了 Jeopardy，与两位前冠军对战。另一家 Apple\
  \ 发布了 `Siri`，最受欢迎的虚拟助手。\n\n现在“通用人工智能”（`AGI`）（2012-至今）仍在持续增长，这让我们看到了 AI 迄今为止的主要最新进展，直至当前的趋势和市场需求。我们见证了通用\
  \ AI 工具的涌入，例如虚拟助手、机器人、搜索引擎等等。这个时间段也普及了 AI、`DL`、`ML` 和大数据。\n\n2015 年 Elon Musk、Steve\
  \ Wozniak 和 Stephen Hawking（以及 3,000 多人）签署了一封致世界政府系统的公开信，禁止开发（和目前使用）用于战争的独立武器。2017\
  \ 年，Facebook 编程了两个基于 AI 的聊天机器人以交流并训练如何讨论，但随着它们来回交流，它们最终放弃了英语并发展出自己的语言，完全自主。\n\n\
  2020 年，OpenAI 在进行 `GPT-3` 的进步性 Beta 测试，这是一个最新模型，它基本上使用 `DL` 生成代码、程序、诗歌以及其他此类语言和书写任务。2021\
  \ 年，OpenAI 创建了 `DALL-E`，它可以练习和识别图像，足以创建准确的标题，并将 AI 的另一项应用扩展到理解视觉世界。\n\n现在，我们正处于工业\
  \ 4.0，脑海中可能有一个自然的下一个问题，那么 AI 接下来会怎样？好吧，我们只能完全预测机会和未来。然而，有许多最重要的专家讲座和谈话关于 AI 的光明未来，因此我们可以做出许多有根据的猜测和预测。Figure\
  \ 19.1 [2] 显示了由 `ML` 技术支持的 AI 的业务应用。\n\n![Figure 19.1: AI's business applications\
  \ supported by machine learning technologies.](img/fig19_1_C.jpg)\n\nFigure 19.1:\
  \ AI's business applications supported by machine learning technologies.\n\n我们可以想象看到更多不同规模的企业接受\
  \ AI，以及随着更多计算机化消除和创造同等数量的工作而导致人员的变化，如更多机器人、自动车辆等等。因此，我们可以看到 AI 和 `ML` 不仅在这些领域，而且在生活的其他所有领域都非常重要\
  \ [3]。\n\n## 2. 搜索方法\n\n第一次重大变化发生在 18 世纪的第一次工业革命（称为工业 1.0）期间，当时物品的生产基于基本流程和程序。也有很多发明被创造出来以开发产品。允许通过机器生产物品。这始于\
  \ 1760 年的英格兰，然后最终在 18 世纪末到达美国（`US`）。\n\n接下来，1871–1914 年期间制造业的重大变化被称为第二次工业革命（工业 2.0），它基于电报网络和广泛的铁路，允许更快地转移人员思想和想法。\n\
  \n第三次工业革命（工业 3.0）也称为数字革命，始于 20 世纪，在部分自动化、存储程序控制和计算机之间进行。\n\n目前所有人都与始于 2011 年的第四次工业革命有关（称为工业\
  \ 4.0），它是物理资产与高度发达的数字技术之间的结合，例如：AI、物联网（`IoT`）、机器人、自主车辆、无人机、3D 打印、云计算等等，它们相互连接，具有分析、通信和行动的可能性。采用工业\
  \ 4.0 的组织更具响应性、灵活性和智能性，这使其更能为数据驱动的决策做好准备 [4]。\n\n\n\n\n\nThe search methodology\
  \ approach uses mixes content analysis, bibliometric, and social network techniques.\
  \ In this paper, a state-of-the-art study was conducted using the Google Scholar.\
  \ For the time period from 1999 to 2023 was considered with the aim to recognize\
