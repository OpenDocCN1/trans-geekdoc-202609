  \ 算法表现最佳，并在数据集中给出了更好的输出。\n\n因此，我们可以说，通过将数据训练到不同测试用例大小的分类器中，可以理解数据集中的真实流量和恶意流量将一直存在，直到采取某些措施防止其进一步被利用。\n\
  \n## 7. Conclusions\n\n随着我们继续推进在本项目中所学到的所有内容，通过将数据科学和 ML 算法应用于实时数据集，我们得出结论，恶意流量的数量少于真实流量，这告诉我们网络和系统管理员制定的\
  \ ACL 和过滤规则工作正常，但也需要一些对策措施来降低威胁并增强网络安全。在我们在此模型中使用的众多算法中的两种中，`KNN` 在准确性和精确度方面都优于\
  \ `Naïve Bayes`，这表明 `KNN` 中的误报率更少，而在 Bowe 可以从数据集中看到恶意流量主要来自哪些源 IP 和端口，我们现在可以通过更新防火墙协议来调节流量速率。此模型可以进一步用于查找其他服务数据集的恶意和真实流量。\n\
