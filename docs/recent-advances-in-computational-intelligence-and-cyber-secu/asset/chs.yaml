  \ IQ 调制器（马赫-曾德尔调制器 – MZM）转换为发射光信号 [17]。\n\n### 2.2 光纤信道\n\n光纤信道是多段标准单模光纤（SSMF）。对于\
  \ SSMF，在每个跨距内，非线性薛定谔方程（NLSE）对损耗、色散（CD）和非线性效应进行建模，如下所示\n\n(6)\n\n```\n∂E(z,t)/∂z\
  \ = (D + N)E(z,t)\n```\n\n其中 `E` 是经过 `z` km 光纤距离后接收信号的复光包络。`D` 是线性部分，用于线性效应（CD 和衰减），`N`\
  \ 是非线性部分，其由下式给出\n\n(7)\n\n```\nD = -j/2 β_2 ∂²/∂t² - α/2\n```\n\n(8)\n\n```\nN =\
  \ jγ|E(z,t)|²\n```\n\n(9)\n\n```\nγ = 2π n_2 / (λ_c A_eff)\n```\n\n其中 `α` 是衰减因子，`β[2]`\
  \ 是群速度色散参数，`γ` 是非线性系数，`n[2]` 是非线性折射率系数，`λ[c]` 是中心波长，`A[eff]` 是有效芯面积 [18]。在每个跨距结束时，光信号由\
  \ EDFA 放大以补偿光纤损耗。\n\n**Algorithm 1:** Obtain J Indices Sequence From Input p[1]\
  \ Bits\n\n```\n1. Input: The binary sequence of p[1] bits, the number of subcarriers\
  \ n, the number of active subcarriers k\n2. Initialization: Convert p[1] bits into\
  \ a decimal number Z, jj ← n\n3. for i = k : = k 1 do\n4. repeat\n5. jj ← jj - 1\n\
  6. ComCoef ← C(jj, i)\n7. until ComCoef ≤ Z\n8. j[i] ← jj\n9. Z ← Z - ComCoef\n\
  10. end for\n11. return array j[i]\n```\n\n### 2.3 O-OFDM 索引调制方案：接收机\n\n在接收机中，经过光纤信道传输后接收到的光信号通过\
  \ 90° 光混合器由本地振荡器激光器转换为电信号。光信号与本地振荡器激光器发生干涉，该激光器通常在 90° 光混合器中具有与发射机激光器相同的频率。为了检测实部和虚部，输入信号在信号与本地振荡器激光器之间通过\
  \ 90° 相移，在一个分支中与本地振荡器激光器的实部混合，在另一个分支中与虚部混合。\n\n\n\n\n\n在光 OFDM-IM 接收机中，在移除 CP 并实现\
  \ FFT 操作之后，紧接着进行信道估计操作。为了能够在频域中均衡接收信号，估计信道频率响应非常重要。*X̂ [g]* (*i*) 是 FFT 操作后第 *g^(th)*\
  \ 个 OFDM 子块的接收向量，其由下式给出\n\n(10)\n\n*X̂**g* = *H**g**X**g* + *W**g*, *i* = 1, …, *n*\n\
  \n其中 *H[g]*(*i*) 和 *W[g]*(*i*) 分别表示第 *g^(th)* 个 OFDM 子块的第 *i^(th)* 个子载波上的信道频率响应和零均值复加性高斯白噪声\
  \ (AWGN)，其方差为 *N*[0]。用于信道估计的 PN 序列块适用于慢变的光纤光学信道，其由下式给出\n\n(11)\n\n$${\\\\hat{H}}\\\
  _{g}(i) = \\\\frac{{\\\\hat{X}}\\_{g}^{PN}(i)}{X\\_{g}^{PN}(i)},i = 1,\\\\ldots,n$$\n\
  \n其中 *X*̂ *[g]^(PN)* (*i*) a d n *X[g]^(PN)* (*i*) 分别是接收端和发送端第 *g^(th)* 个 OFDM 子块的第\
  \ *i^(th)* 个子载波上的 PN 序列信号。\n\nTable 27.1 总结了 *p*[1] 位序列与 *J* 个活动子载波索引之间的映射关系，对于\
  \ *n* = 4, *k* = 2 和 *p*[1] = 2。\n\n它需要检测活动子载波的索引以及相应的附加信息位。索引检测器用于从每个 OFDM 子块中检测活动子载波的索引。光\
  \ OFDM-IM 系统的最大似然 (ML) 检测器搜索所有子载波索引和星座点的组合，以便对每个 OFDM 子块的活动子载波索引和传输符号进行联合判决。每个比特的\
  \ ML 检测的搜索空间由 *O*(*C*(*n*, k) + *M^k*) 的阶给出。由于复杂度随着 *k* 值增加而呈指数增长，最优 ML 检测器具有较高的复杂度。为了实现接近最优的性能，提出了低复杂度的后验概率检测\
  \ (PPD) 方法 \\[8\\]。\n\n光 OFDM-IM 的 PPD 检测器通过考虑值是零或非零的情况，给出了频域信号后验概率的对数比 \\[9\\]。对于第\
  \ *g^(th)* 个 OFDM 子块，PPD 检测器给出对应索引 *i* 为活动状态的概率，其中 *i* = 1, 2, ..., *n*，由下式给出；\n\
  \n(12)\n\n$$\\\\lambda\\_{g}(i) = \\\\ln\\\\frac{{\\\\sum\\_{m = 1}^{M}P}\\\\left(\
  \ {X\\_{g}(i) = Q\\_{m} \\\\mid {\\\\hat{X}}\\_{g}(i)} \\\\right)}{P\\\\left( {X\\\
  _{g}(i) = 0 \\\\mid {\\\\hat{X}}\\_{g}(i)} \\\\right)},$$\n\n其中 *Q[j]* 是 *M*\\-ary\
  \ 信号星座的一个元素。λ[*g*] (*i*) 的值越大，对应 *i* 为活动子载波的概率越高。利用贝叶斯公式，式 (12) 可表示为\n\n(13)\n\n\
  $$\\\\lambda\\_{g}(i) = \\\\ln(k) - \\\\ln(n - k) + \\\\frac{\\\\left| {{\\\\hat{X}}\\\
  _{g}(i)} \\\\right|^{2}}{\\\\sigma\\_{k}^{2}} + \\\\ln\\\\left( {{\\\\sum\\\\limits\\\
  _{m = 1}^{M}\\\\exp}\\\\left( {- \\\\frac{1}{\\\\sigma\\_{k}^{2}}\\\\left| {{\\\\\
  hat{X}}\\_{g}(i) - H\\_{g}(i)Q\\_{m}} \\\\right|^{2}} \\\\right)} \\\\right)$$\n\
  \n在根据式 (13) 得到所有后验概率后，对于每个 OFDM 子块，接收机决定具有最大后验概率的 *k* 个活动索引 (*Ĵ*)。确定 *k* 个活动索引后，附加信息位和数据符号可以很容易地确定。\n\
  \n它从索引检测器获取活动索引序列，并对每个 OFDM 子块执行 *k*—组合系数的求和 (Algorithm-2)。计算出十进制数 *Ẑ* 后，可通过十进制到二进制转换器确定附加信息位。*k*\
  \ 个活动子载波上 *M* —ary 信号星座 (*Q*) 集合的传输符号估计为\n\n(14)\n\n*P̂**g*|[*i* = 1]^(*k*) = arg min[(*Q*[*m*] ∈ *Q*)]|*X̂**g*−*Ĥ**g**Q*[*m*]|²\n\
  \n## 3. 性能分析\n\n### 3.1 光谱效率\n\n光谱效率 (SE) 是 OFDM 系统中的一个重要性能参数。它定义为单位带宽 B 内可以实现的比特率。对于传统的光\
  \ OFDM 系统，SE 可以由下式给出\n\n(15)\n\n$$\\\\text{~Spectral~Efficiency~}\\_{\\\\text{O-OFDM~}}\
  \ = \\\\frac{N\\_{u}\\\\log\\_{2}M}{\\\\left( {T\\_{FFT} + T\\_{CP}} \\\\right)B}\\\
  \\text{,~}$$\n\n其中 *N[u]* 是光 OFDM 系统中用于数据传输的活动子载波数，且\n\n(16)\n\n$$\\\\text{SE}\\\
  _{\\\\text{O} - \\\\text{OFDM} - \\\\text{IM}} = \\\\frac{G\\\\left( {k\\\\log\\\
  _{2}M + \\\\log\\_{2}(C(n,k))} \\\\right)}{\\\\left( {T\\_{FFT} + T\\_{CP}} \\\\\
  right)B}$$\n\n| **Algorithm 2**: Obtain Decimal Number Ẑ from the Indices Sequence\
  \ Ĵ |\n| --- |\n| \n1. **Input:** The indices sequence Ĵ = {Ĵk, , … Ĵ1}, the\
  \ number of subcarriers n, the number of active subcarriers *k*\n2. Ẑ ← 0\n3. **for**\
  \ *i* = 1: k **do**\n4. ComCoef ← C (Ĵ[*i*], *i*)\n5. Ẑ ← Ẑ + ComCoef\n6. : **end\
  \ for**\n7. : **return Z**̂\n |\n\n考虑 *N[u]* = *N[FFT]* = 256 和 *N[CP]* = 16，光 OFDM\
  \ 系统可实现 0.9412 bits/s/Hz 的光谱效率值，采用 2-PSK 调制方案。然而，光 OFDM with IM 系统可实现 *n* = 4, *k*\
  \ = 2 时 0.9412 bits/s/Hz 的光谱效率值，以及 *n* = 4, *k* = 3 时 1.1765 bits/s/Hz 的光谱效率值，均采用\
  \ 2-PSK 调制方案。\n\n因此，在光 OFDM with IM 系统的情况下，对于所选的 *n* 和 *k* 值，光谱效率值可以高于光 OFDM 系统。因此，适当选择\
  \ *n* 和 *k* 值有助于增强光谱效率性能。在 Figure 27.2 中，光谱效率作为活动子载波 *k* 的函数，在各种 OFDM 子块水平下，对于 *M*\
  \ = 2, *N[FFT]* = 256, *N[CP]* = 16 以及 2-PSK 调制方案。从 Figure 27.2 可以观察到，当选择适当的活动子载波数时，光\
  \ OFDM with IM 系统可以提高光谱效率，优于简单的光 OFDM 系统。\n\n![Figure 27.2 SE of optical-OFDM with\
  \ IM system.](img/fig27_2_C.jpg)\n\nFigure 27.2 SE of optical-OFDM with IM system.\n\
  \nFigure 27.3 说明了光 OFDM with IM 可以在 2-PSK、4-PSK 和 16-QAM 调制方案下实现比光 OFDM 更好的 SE 性能。然而，对于更高阶调制方案，光\
  \ OFDM-IM 的 SE 无法与简单的光 OFDM 竞争。\n\n![Figure 27.3 SE in the Optical-OFDM system with\
  \ IM for different OFDM sub-block configurations.](img/fig27_3_C.jpg)\n\nFigure\
  \ 27.3 SE in the Optical-OFDM system with IM for different OFDM sub-block configurations.\n\
  \n光谱效率的最大化几乎等同于最大化每符号的比特数。二项式系数序列 *C*(*n*, *k*) 是一个对数凹序列。因此，可以在分析上检测使 *p* 比特最大化的活动子载波的最优值\
  \ \\[19\\]。于是，\n\n(17)\n\n*p* = *k*log[2]*M* + log2)\n\n考虑在式 (17) 中去掉 floor 函数，然后对\
  \ *p* 关于 *k* 求导可表示为\n\n(18)\n\n$$\\\\frac{dp}{dk} = \\\\log\\_{2}M + \\\\log\\_{2}\\\
  \\left( {\\\\Gamma\\_{n - k} - \\\\Gamma\\_{k}} \\\\right)$$\n\n(19)\n\n$$\\\\Gamma\\\
  _{k} = {\\\\sum\\\\limits\\_{i = 1}^{k}\\\\frac{1}{j}} = \\\\frac{1}{1} + \\\\frac{1}{2}\
  \ + \\\\frac{1}{3} + \\\\ldots + \\\\frac{1}{k}.$$\n\n其中 *k^(th)* 调和数 Г[*k*] 是前\
  \ k 个正整数倒数之和。由于极限 (Г[*k*] - log *k*) → γ 为欧拉-马歇罗尼常数，Г[*k*] 的近似值可表示为\n\n(20)\n\n\n\
  \n\n\n*Γ*[*k*] ≈ log *k* + *γ*\n\n通过将 `Γ[k]` 的近似值代入式 (18) 并使式 (18) 等于零，可得到活动子载波的最优数量\n\
  \n(21)\n\n$$k \\approx \\frac{MN_{FFT}}{G(M + 1)}.$$\n\n### 3.2 平均误码率\n\n在存在信道估计误差且使用失配\
  \ ML 检测器进行数据检测的情况下，条件对数似然错误概率 (CPEP) 可由 [9] 中的式 (22) 表示为\n\n(22)\n\n$$\\text{P}_{r}\\\
  left( X_{g}\\rightarrow{\\hat{X}}_{g} \\mid {\\hat{H}}_{g} \\right) = Q\\left( \\\
  frac{\\left( {X_{g} - {\\hat{X}}_{g}} \\right){\\hat{H}}_{g}{}^{2}}{\\sqrt{2\\sigma_{e}^{2}X_{g}^{H}\\\
  left( {X_{g} - {\\hat{X}}_{g}} \\right){\\hat{H}}_{g}{}^{2} + 2N_{0}\\left( {X_{g}\
  \ - {\\hat{X}}_{g}} \\right){\\hat{H}}_{g}{}^{2}}} \\right)$$\n\n其中 `σ²[e]` 为信道频率响应向量\
  \ `H[g]` 的估计误差方差，`(⋅)^(H)`、`⋅` 和 `Q(⋅)` 分别表示厄米转置、弗罗贝尼乌斯范数和高斯 *Q—*函数。\n\n(23)\n\n\
  $$\\begin{array}{l} {X_{g}^{H}\\left( {X_{g} - {\\hat{X}}_{g}} \\right){\\hat{H}}_{g}^{2}\
  \ = {\\sum\\limits_{i = 1}^{n}\\left| {X_{g}(i)} \\right|^{2}}\\left| {\\left( {X_{g}(i)\
  \ - {\\hat{X}}_{g}(i)} \\right){\\hat{H}}_{g}(i)} \\right|^{2}} \\\\ \\left. \\\
  Rightarrow X_{g}^{H}\\left( {X_{g} - {\\hat{X}}_{g}} \\right){\\hat{H}}_{g}{}^{2}\
  \ = \\frac{1}{n}X_{g}{}^{2}\\left( {X_{g} - {\\hat{X}}_{g}} \\right){\\hat{H}}_{g}{}^{2}\
  \ \\right. \\\\ \\end{array}$$\n\n因此，CPEP 可再次表示为\n\n(24)\n\n$$\\text{P}_{r}\\left(\
  \ X_{g}\\rightarrow{\\hat{X}}_{g} \\mid {\\hat{H}}_{g} \\right) = Q\\left( \\sqrt{\\\
  frac{\\left( {X_{g} - {\\hat{X}}_{g}} \\right){\\hat{H}}_{g}^{2}}{2\\sigma_{e}^{2}\\\
  left( X_{g} \\right)^{2}/n + 2N_{0}}} \\right)$$\n\n然后，无条件对数似然错误概率 (UPEP) 可通过\n\n\
  (25)\n\n$$\\text{P}_{r}\\left( X_{g}\\rightarrow{\\hat{X}}_{g} \\right) = E_{{\\\
  hat{H}}_{g}}\\left\\{ {Q\\left( \\sqrt{\\frac{\\left( {X_{g} - {\\hat{X}}_{g}} \\\
  right){\\hat{H}}_{g}^{2}}{2\\sigma_{e}^{2}\\left( X_{g} \\right)^{2}/n + 2N_{0}}}\
  \ \\right)} \\right\\}$$\n\n得到，其中 `E[Ĥ[g]]` {.} 表示关于估计信道频率响应的期望运算。为了获得 UPEP 的闭式表达式，可应用近似高斯\
  \ *Q—*函数。为了提高精度，[20] 中提出了近似高斯 *Q—*函数，给出为\n\n(26)\n\n*Q*(*x*) ≈ 0.168*e*^( − 0.87*x*²) + 0.144*e*^( − 0.525*x*²) + 0.002*e*^( − 0.603*x*²), *x* > 0\n\
  \n对近似 UPEP，将式 (26) 应用于式 (25)，\n\n(27)\n\n$$\\begin{array}{l} {\\text{P}_{r}\\left(\
  \ X_{g}\\rightarrow{\\hat{X}}_{g} \\right) = E_{{\\hat{H}}_{g}}\\left\\{ {0.168e^{-\
  \ 0.876q{({X_{g} - {\\hat{X}}_{g}})}{{\\hat{H}}_{g}^{2}}} \\right.} \\\\ \\left.\
  \ {+ 0.144e^{- 0.525q{({X_{g} - {\\hat{X}}_{g}})}{{\\hat{H}}_{g}{}^{2}} + 0.002e^{-\
  \ 0.603q{({X_{g} - {\\hat{X}}_{g}})}{{\\hat{H}}_{g}{}^{2}}} \\right\\} \\\\ \\end{array}$$\n\
  \n其中 `q` = *n*/(2*σ*[e]²(*X*[g])²/*n*+2*N*[0])。利用式 (27)，期望可根据 [9] 中的谱定理计算，且 UPEP\
  \ 上界可计算为\n\n(28)\n\n$$\\begin{array}{l} {\\text{P}_{r}\\left( X_{g}\\rightarrow{\\\
  hat{X}}_{g} \\right) \\approx \\frac{0.168}{\\det\\left( {\\mathbf{I}_{n} + 0.876q{\\\
  hat{K}}_{n}\\mathbf{A}} \\right)} + \\frac{0.144}{\\det\\left( {\\mathbf{I}_{n}\
  \ + 0.525q{\\hat{K}}_{n}\\mathbf{A}} \\right)}} \\\\ {+ \\frac{0.002}{\\det\\left(\
  \ {\\mathbf{I}_{n} + 0.603q{\\hat{K}}_{n}\\mathbf{A}} \\right)}.} \\\\ \\end{array}$$\n\
  \n其中 `I[n]` 表示 n 维单位矩阵 `K̂[n]` = `E{ Ĥ[g] Ĥ[g]^(H) }` = **K**[*n*] + *σ*[e]²**I**[*n*]\
  \ 然后，基于上述推导的 UPEP，可得到平均误码率 (ABER) 的上界，\n\n(29)\n\n`Ĥ[g]`， **K**[*n*] = `E{ H[g]\
  \ H[g]^(H) }` 和 **A** = (`X[g]`−`X̂[g]`)^(*H*)(`X[g]`−`X̂[g]`).\n\n其中 `e X[g] X[ĝ]`\
  \ 表示对应对数似然错误事件的误码数且 `nX[g]` = 2^(*p*) 为 `X[g]` 的可能实现数。\n\n### 4. 结果与讨论\n\n为了应对单模光纤中非线性带来的挑战，采用了光-OFDM-IM\
  \ 方案以实现高效的长距离光链路传输。如 Figure 27.1 所示，使用 `MATLAB` 构建了发射机和接收机仿真结构。块模型使用分裂步傅里叶方法 (SSFM)\
  \ 对非线性薛定谔方程 (NLSE) 进行求解。该仿真结构可用于减轻光纤通信系统中的色散效应和非线性等 impairments。仿真采用了 OFDM 帧的一致快速傅里叶变换\
  \ (FFT) 大小和恒定步长协议，遵循 SSFM 方法 [21]。\n\nTable 27.2 总结了光纤信道和 OFDM 系统的仿真属性。为了补偿载波频率偏移，除了拥有\
  \ 500 个独立信道外，还必须保持完美的系统同步。发射机利用伪随机二进制序列 (PRBS) 生成器生成数据位，并采用二进制相移键控 (PSK) 和 M 进制正交幅度调制\
  \ (QAM) 方案进行比特映射。\n\nTable 27.2 System simulation parameters\n\n| Parameter || Value\
  \ || Parameter || Value |\n| --- | --- | --- | --- |\n| CD parameter || 16 ps/nm/km\
  \ || Noise figure || 5dB |\n| --- | --- | --- | --- |\n| λ || 1550 nm || `NFFT`\
  \ || 256 |\n| γ || 1.32 (W.km)^(−1) || Cyclic prefix || 6.25% |\n| α || 0.2 dB/km\
  \ || Sampling rate || `f[s]` = 32*GS[a⁄s]* |\n| `L` || 100 km || Modulation || 4-PSK,\
  \ 16-QAM |\n| Fiber type || SSMF ||  ||  |\n\nFigures 27.4 和 27.5 对所提出的光-OFDM 与\
  \ IM 和传统光-OFDM 在不同发射功率值下 4-PSK 和 16-QAM 信号的平均 BER 性能进行了比较分析。这些图展示了链路距离和发射功率的综合影响。这很重要，因为根据\
  \ NLSE，光纤非线性的影响取决于瞬时信号功率和传输距离。为了仅评估光纤非线性的影响，假设激光器无相位噪声。\n\n![Figure 27.4 BER performance\
  \ under various launch powers for 4-PSK modulation after different transmission\
  \ distance.](img/fig27_4_C.jpg)\n\nFigure 27.4 BER performance under various launch\
  \ powers for 4-PSK modulation after different transmission distance.\n\n![Figure\
  \ 27.5 BER performance under different launch powers for 16-QAM modulation after\
  \ different transmission distance.](img/fig27_5_C.jpg)\n\nFigure 27.5 BER performance\
  \ under different launch powers for 16-QAM modulation after different transmission\
  \ distance.\n\n在低发射功率水平下，光纤信道可有效建模为受放大自发辐射 (ASE) 噪声影响的线性色散信道。然而，观察到在低发射功率条件下，所提出的光-OFDM\
  \ 与 IM 的性能劣于光-OFDM。这种差异源于所提出系统中因活动子载波索引恢复错误而产生的误码。\n\n\n\n\n\nBER 曲线上的最低点被称为最佳发射功率。该最佳发射功率会因传输距离、调制类型以及其他特定系统属性等因素而有所变化。最佳发射功率的较高范围表示光纤非线性影响变得显著的区域。在这种情况下，随着提高发射功率以实现远距离传输，光纤非线性变得越来越重要。这种非线性会在每个子载波的中心点周围引入随机色散，导致相邻子载波之间产生干扰。\n\
  \n在 图 27.4 和 27.5 中可以明显看出，所提出的具有 IM 的光学 OFDM 在中高发射功率值下优于传统的光学 OFDM，而在这些功率值下光纤非线性起着重要作用。BER\
  \ 性能的这种改善可归因于通过活动子载波索引传输的额外二进制比特，以及由于非活动子载波的存在和放置而对载波间干扰增强的抗干扰能力。本质上，具有 IM 的光学 OFDM\
  \ 有效地减轻了光纤非线性的影响并实现了稳健的长距离传输。\n\n### 5. 结论\n\n在研究中，设计了一种用于长距离传输的[content]\n\nBER\
  \ 曲线上的最低点被称为最佳发射功率。该最佳发射功率会因传输距离、调制类型以及其他特定系统属性等因素而有所变化。最佳发射功率的较高范围表示光纤非线性影响变得显著的区域。在这种情况下，随着提高发射功率以实现远距离传输，光纤非线性变得越来越重要。这种非线性会在每个子载波的中心点周围引入随机色散，导致相邻子载波之间产生干扰。\n\
  \n在 图 27.4 和 27.5 中可以明显看出，所提出的具有 IM 的光学 OFDM 在中高发射功率值下优于传统的光学 OFDM，而在这些功率值下光纤非线性起着重要作用。BER\
  \ 性能的这种改善可归因于通过活动子载波索引传输的额外二进制比特，以及由于非活动子载波的存在和放置而对载波间干扰增强的抗干扰能力。本质上，具有 IM 的光学 OFDM\
  \ 有效地减轻了光纤非线性的影响并实现了稳健的长距离传输。\n\n### 5. 结论\n\n在研究中，提出了一种用于长距离传输的光学 OFDM 系统，该系统结合了\
  \ IM。针对单模光纤，光学 OFDM 与 IM 在平均 BER 和 SE 之间提供了有价值的权衡。在该所提系统中，我们可以灵活调整活动子载波的数量，从而在保持令人满意的平均\
  \ BER 性能的同时实现所需的 SE。此外，光学 OFDM 在频谱效率方面表现出显著的提升。此外，还观察到所提出的具有 IM 的光学 OFDM 即使在两者具有相同频谱效率值的情况下也优于传统的光学\
  \ OFDM。\n\n### 参考文献\n\n1. Tang, T., Zou, X., Li, P., Pan, W., Luo, B., and Yan,\
