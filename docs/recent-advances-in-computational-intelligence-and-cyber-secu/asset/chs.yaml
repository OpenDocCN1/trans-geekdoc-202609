  \ inch-worm motion principle and are powered by SMA wires \\[20\\].\n\nSMAs actuators\
  \ in the devices are used in microchannels regulating fluid flows. As a result,\
  \ actuators are responsible to control the opening and closing of micro channels,\
  \ which allows controlled and precise fluid or drug delivery.\n\nSMA-based microfluidic\
