  \ 10: 1-292-02594-8.\n\n# 25 用于 WiMAX/C 波段无线应用的小型化单极三频矩形贴片天线\n\nPrakshep Kumar Rai^(²⁵)\n\
  \n电子与通信工程系，IET Dr.R.M.L.A 大学，阿约提亚，印度\n\n#### 摘要\n\n本文提出了一种用于 WiMAX 和 C 波段应用的微型单极三频天线。建议的天线尺寸非常紧凑，为\
  \ 20×26×1.6 mm³。建议天线的组成部分为矩形贴片、三个条带和一个寄生元件（放置在基板底部）。`FR4_epoxy` 基板用于天线的设计，用于在三个频段\
  \ 3.1–4 GHz、5.3–5.8 GHz 和 7.3–8 GHz 上工作，共振频率分别为 3.5、5.5 和 7.7 GHz，损耗为 -37、-22 和\
  \ -25 dB（`S11<–10 dB`），带宽分别为 900MHz、500 MHz 和 700 MHz。`HFSS` 软件用于模拟天线。本文展示了所提出天线的仿真结果和测量结果。\n\
  \n**关键词：** 单极天线，Wi-MAX，C 波段，HFSS，三频\n\n## 1. 引言\n\n\n\n\n\n当代可移动无线通信设备的需求日益增加，它可以将多种通信标准集成到单一系统中。由于空间有限，在此类设备中同时容纳两个或多个天线是困难的。“这表明现代天线除了实现双频或多频操作外，还需要具备其他任务，例如紧凑尺寸、简单结构以及易于与系统集成”\
  \ [1]。由于其简单、低剖面且价格低廉的独特品质，微带贴片天线非常受欢迎。它们与单片微波集成电路兼容且易于安装 [2]。全球微波接入互操作性（WiMAX）是一种非常流行的无线通信系统，最近受到了研究人员的大量关注，并已在移动设备中实现。天线应覆盖多个频段并能够提供一致的全向辐射模式，以增强性能并使天线在复杂多变的\
  \ WiMAX 环境中有用 [3]。此外，低频段（2500 至 2690 MHz）、中频段（3300 至 3700 MHz）和高频段（5250 至 5850 MHz）是\
  \ WiMAX 被分配的三个主要频段 [4]。文献中最近提出了许多用于 WiMAX 和超宽带（UWB）的多频带天线。例如，在 [5] 中，作者提出了一种用于 7.5\
  \ GHz 无线通信的矩形贴片天线，其回波损耗低，天线尺寸较大 32 × 28.1 mm²，且仅有一个频段。一种用于多频带应用的可携式共面波导（CPW）馈电天线在\
  \ [6] 中被提出，天线尺寸相当小但结构复杂。\n\n[7, 8, 9, 10, 11, 12, 13 和 14] 中也有多频带无线应用的设计。在参考文献 7、8、9\
  \ 和 10 中，尽管所建议的天线具有良好的品质但尺寸较大。\n\n因此，通过文献分析确定，构建天线以支持三频特性并具有更好的增益，这已作为本研究工作的目标。在本文中，我们的目标是设计一种小型化单极子三频矩形贴片天线，用于\
  \ WiMAX 和 C 频段应用。天线设计在地平面上结合了三条带状线和一个寄生元件以实现多频带特性。目标是覆盖 WiMAX 在 3.5 和 5.5 GHz 的频率，以及\
  \ C 频段在 7.5 GHz。使用高频结构仿真器（`HFSS`），研究了参数对阻抗带宽的影响。根据仿真结果，所提出的天线设计适用于 WiMAX 和 C 频段应用。这意味着天线在指定频率范围内表现出所需的性能特性，例如适当的阻抗匹配和辐射特性。\n\
  \n## 2. 天线结构和尺寸\n\n图 25.1 说明了所提出的三频 WiMAX/C 频段单极子天线的几何表示。所建议的天线由矩形贴片通过三条带状线和馈电线连接组成。它在基板底部具有带寄生元件的地平面。所建议的天线构建在相对介电常数为\
  \ 4.4 的 `FR-4_epoxy` 基板上，尺寸为 20 × 26 × 1.6 mm³。使用 FR-4 基板的优点是价格低廉且广泛可用。地平面的宽度和长度为\
  \ 20 × 8 mm²，寄生元件为 7 × 1 mm²。使用了 50Ω（3 × 12mm²）的馈电线来馈电天线。天线的全部尺寸列于 表 25.1。使用参数分析来在\
  \ `HFSS` 上设计和优化天线。\n\n![图 25.1 所提出的天线。](img/fig25_1_C.jpg)\n\n图 25.1 所提出的天线。\n\n\
