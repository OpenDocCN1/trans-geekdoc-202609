  \n# 7 使用广义自回归条件异方差模型预测共同基金波动性：来自印度共同基金的证据\n\nSanjay Kumar^⁷\n\n### Abstract\n\n\
  预测共同基金波动性是时间序列分析和预测中最令人兴奋的挑战。许多研究人员试图开发不同的预测模型，但由于存在许多影响准确性的外部参数，预测共同基金的波动性达到 100%的准确性是非常困难的。现在，随着快速计算平台的可用性，可以开发复杂的算法和框架，以提取、存储、处理和分析内容多样化的大量共同基金市场历史数据。在本文中，研究人员提出了\
  \ `GARCH` (`EGARCH`) 模型用于共同基金时间序列数据集的波动性预测。模型的性能和该模型中出现的误差是使用主要可用技术，通过实际值和预测值计算得出的。本文使用了印度共同基金数据集，并提出了一个可靠且更准确的预测框架，用于预测时间序列波动率值。实验结果表明，所提出的框架工作良好，并在印度共同基金市场为共同基金提供了优化的回报。\n\
  \n**关键词：** Volatility, framework, `GARCH`, mutual fund, forecasting\n\n### 1. Introduction\n\
  \n从统计学角度来看，波动性是市场或证券在给定时间段内年回报率的标准差，本质上是其价格上涨或下跌的速度。如果价格在短时间内迅速变动，达到新的高点和低点，则称其波动性高。如果价格上涨或下跌较慢或相对稳定，则称其波动性低。公司的未来增长，以及由此产生的股东利益，取决于许多内部和外部因素。投资信托（MF）经理从许多不同投资者处募集资金，然后根据其风险承受能力将这笔资金投资于许多不同的行业和类型的共同基金。基金经理将这笔资金投资于低风险到高风险的共同基金计划，并优化客户的投资组合。截至\
  \ 2022 年 5 月 31 日，投资于共同基金的资金约为 37.22 万亿卢比；这笔资金在过去 10 年中增长了四倍（印度共同基金协会，2022 年）。这意味着在十多年里增长了巨大的\
  \ 400%，显示出投资共同基金行业的巨大兴趣。这种最近的趋势表明，普通公众（个人投资者）正在根据需要大量投资于共同基金的各种计划。人们对中场感兴趣的一个原因是，大多数投资者希望获得更高的回报，但又不想直接投资于共同基金市场的风险。他们认为，通过顾问或任何投资公司投资共同基金市场资金更安全。投资共同基金行业的另一个兴趣原因是银行定期存款的利率较低。因此，客户正在寻找不同投资选择的替代方案，以最大程度地降低不确定性并提供合理的回报。一般来说，投资共同基金可以获得不错的利润，但也存在风险。一般投资者更喜欢投资\
  \ MF，因为他们认为投资的资金是安全的，因为专家基金经理在不同行业管理他们的资金以降低风险因素并增加利润。固定收益 MF（也称为债务基金）通常投资于提供本金保护但回报率低的抵押产品。同样，以股票为基础的中场是高风险、高回报的群体，他们的大部分资本用于购买上市公司的股票。混合\
  \ MF 和平衡 MF 是中等风险基金，其中整个资金被投资于无风险和安全的资产债券和高风险股票。\n\nCOVID-19 是一件计划外的事件，减缓了几乎所有类型公司的利润，但少数公司如制药公司和手套制造商在这种大流行期间是盈利的，因为他们产品的需求很大。即使是运作良好的商业部门公司也可能遭受财务损失、破产或欺诈，这可能导致共同基金价格急剧下跌。我们建议投资于属于同一业务领域的多个公司。对于许多零售投资者来说，跟踪不同行业的不同公司并保持多元化投资组合可能很困难。\n\
  \n## 2. Literature Review\n\n\n\n\n\n关于影响共同基金价格因素的不同研究主要集中于国家经济政策变化对共同基金市场的影响，以及基于行为金融视角的投资者行为对共同基金波动波动的影响。许多实验结果表明，`GARCH\
  \ (1, 1)`、`GARCH (1, 2)`、`GARCH (2, 1)` 已能在大多数情况下反映金融产品的价格波动。其中，`GARCH` 模型主要用于计算金融市场的波动性。Wang\
  \ et al. \\[1\\] 提出了用于时变现象建模的时间依赖核密度估计 (`TDKDE`)，其需要运行两个输入参数，称为 `bandwidth` 和 `discount`。对\
  \ `NASDQ` 股票收益的 `TDKDE` 参数估计的实际应用证实了该新技术的完美性能。Matsatsinis et al. \\[2\\] 提出了一种新的算法框架，该框架将推荐系统文献中的特征与多准则决策分析相结合，以缓解稀缺性和缺乏多维相关性度量的问题。这与协同过滤相结合，导致了两种组合推荐方法。Zheng\
  \ and Wang \\[3\\] 给出了多用途推荐的概述，然后使用案例研究，尤其是在多利益相关者和多任务推荐系统的领域。Yera et al. \\[4\\\
  ] 概述了模糊工具在推荐系统中的使用，确定了更一般的 re-search 主题，以及未来的研究以推动基于模糊的推荐系统的当前发展。Wang et al. \\\
  [5\\] 提出了一种具有情感分析的混合推荐系统，将在 Spark 平台上实现。Fayyaz et al. \\[6\\] 介绍了推荐系统研究现状，并指出了该领域在各种应用中的发展方向。本文概述了推荐系统的最新技术、其类型、挑战、局限性和商业应用。Chen\
  \ et al. \\[7\\] 使用均值漂移聚类算法来表征行为数据。然而，使用均值漂移聚类进行个性化推荐面临用户数据过大问题。将分组的用户行为转换为嵌入向量，并将不同长度的嵌入向量线性变换到相同的语义空间。它通过自感知层处理语义空间的向量并执行均值漂移聚类。实验表明，我们的方法可以降低用户贫困对复杂数据分布效应的复杂性，并提高个性化推荐的质量。Wang\
  \ et al. \\[8\\] 提出了一种利用众包构建分布式知识图谱的新方法。众包业务逻辑由基于区块链的智能合约实现，以确保透明性、完整性和可审计性。Das\
  \ et al. \\[9\\] 重点关注金融包容性对 Orissa 的影响，使用 K 近邻 (`KNN`) 分类，这是一种众所周知的机器学习算法。机器学习 (`ML`)\
  \ 已成为金融包容系统中的一种广泛使用的方法。我们使用了 `KNN` `ML` 方法分类算法来表征基于所述人群用户的推荐系统。Maji et al. \\[10\\\
  ] 提出了一个框架，首先将资本分配给每个部门，然后分配给每个部门并按公司投资。这是一种在不同股票之间分散的方法，以保持风险较低同时寻求更高回报，框架运行良好，与印度股市的一些基准和排名基金相比提供了良好的回报。Luef\
  \ et al. \\[11\\] 设计、实现和评估鼓励早期企业投资的系统。首先，我们对知名投资者进行定性和定量调查，研究他们的决策过程，并确定推荐系统需求。Sankar\
  \ \\[12\\] 讨论了由股票投资组合形成的网络是一个投资基金，可借助社会网络分析工具进行分析。Ji et al. \\[13\\] 引入了一种创新的股价预测模型，该模型结合了传统金融数据与使用深度学习技术社交媒体文本特征。Zhou\
  \ et al. \\[14\\] 开发了一种增强的推荐组件，用于准确推荐，以及增强的对话组件，可在响应正文中生成有用的关键字或实体。Yu and Li \\\
  [15\\] 应用 `GARCH` 和 `LSTM` 模型来预测股票指数波动。他们评估了四种不同类型的损失函数；研究表明，就预测准确性而言，`LSTM` 模型优于\
  \ `GARCH` 模型。Devi et al. \\[16\\] 建议使用数据挖掘工具和分析技术进行可量化的研究，以探索投资决策的新方法。Gu et al.\
  \ \\[17\\] 的讨论将粒子群优化 (`PSO`) 算法添加到径向基函数 (`BRF`) 神经网络中，并使 `PSO` 能够优化和改进 `RBFNN`，结合双方的优势。它总结了一套新的\
  \ `PSORBF` 安全基金绩效方法，用于优化神经网络的算法结构和工作流程。随着持续趋势，高点和低点在证券基金绩效期间的预测，新 `PSORBF` 对预测基金绩效具有出色的预测能力，其准确率明显高于传统的\
  \ Sheng。它改进了一种具有出色应用价值且值得发表的方法。Hou et al. \\[18\\] 提出了一种混合长短期记忆和深度神经网络 (`LSTMDNN`)\
  \ 模型，用于在时间序列预测任务中集成基本信息。Azis et al. \\[19\\] 提供了宝贵的见解，尤其是在汇率和通胀的背景下。然而，建议在疫情前进行相关比较，并考虑额外的宏观经济因素以进行全面分析。Gupta\
  \ and Chaudhary \\[20\\] 深入探讨了新闻事件对发达经济体和新兴经济体环境、社会和治理 (`ESG`) 以及市场指数的影响，采用 `EGARCH`\
  \ 模型进行分析。Hota et al. \\[21\\] 提出了一种结合大象繁殖优化 (`EHO`) 算法的 `ANN` 模型，用于预测印度两只共同基金在不同时间段的\
  \ NAV。Shah et al. \\[22\\] 指出，股市预测始终吸引着许多分析师和研究人员的关注。预测股价本身就是一个困难的问题，因为涉及的变量数量众多。然后我们重点关注股票分析和预测方面的一些研究成果。Majhi\
  \ et al. \\[23\\] 提出了合成混合模型，并使用六个不同的 NAV 数据在训练和测试阶段评估其性能。Maji and Mondal \\[24\\\
  ] 提出了一个框架，以在不同股票之间分散资本基金投资以获得更高回报但保持较低风险。Mamilla, R et al. \\[25\\] 提出了广义自回归条件异方差\
  \ (`GARCH`) 建模，以研究投资者风险并评估波动波动如何影响回报。Asiri et al. \\[26\\] 提出了一种 `TVP-VAR` 方法来探索与加密货币相关的不确定性指数与一系列金融资产的收益和波动变化之间的联系。Al-Nassar\
  \ \\[27\\] 建议了一种计量经济学模型，该模型考虑了结构性中断。在估计 `VAR` 非对称 `BEKK-GARCH` 模型后，我们计算投资组合权重和对冲比率，并检查它们如何影响风险管理。\n\
  \n\n\n\n\n## 3. 问题陈述\n\n创建投资组合以避免单一/少数股票投资风险具有挑战性，这需要投资于属于不同经济部门的多个共同基金。实时管理和分析大量共同基金也很困难。展望未来，我们需要一个框架来处理不同业务领域的多个共同基金，以降低风险因素并随着时间的推移增加利润。在这项工作中，我们提出了一个框架，供投资组合经理在共同基金中进行不同特定时间范围的投资，以最大化投资者的利润。在这里，评估在多个部门进行，以确保多样化的投资组合控制，从而降低交易者的风险。如前所述，交易者在投资其预算以获得更多利润时，同时存在许多不同的观点。股市尤其敏感，有各种因素直接或间接地与之相关，控制市场情绪（Gottschlich\
  \ and Hinz 2014）。问题可通过不同的统计策略和时间序列分析技术来解决，以从共同基金行业的投资中获得最大利益。我们的目标是提出一种分析方法来预测不同组织的比例价格，并在不同部门分配全部资本以获得更高的收入机会并降低最低风险。\n\
  \n## 4. 拟议模型\n\n开发模型以找到有利的方式帮助并预测公司的共同基金价格存在许多挑战。该模型背后的主要思想是 `GARCH`（广义自回归条件异方差）理论，其中可以衡量\
  \ MF 的波动性并计算未来回报。然而，实际上，由于多种内部和外部因素影响共同基金的每日价格，准确预测公司的 MF 回报价格非常困难。许多参数可能与共同基金市场下降和流动没有直接关系，但通过影响直接参与共同基金价格变化的参数而间接与共同基金市场相关。对特定部门或公司的坏消息和好消息严重影响\
  \ MF 回报价格。所开发的模型基于共同基金的历史回报价格，因为它反映了影响共同基金的所有事件和因素的影响。有几种统计技术；预测理论和模型被开发来帮助您做出正确的预测，例如标准差、线性回归、非线性回归、相关性和时间序列分析（Figure\
  \ 7.1）。\n\n![Figure 7.1: Block diagram of proposed model.](img/fig7_1_C.jpg)\n\n\
  Figure 7.1: Block diagram of proposed model.\n\n## 5. 拟议模型的数据\n\n在本文中，选择了 CIPLA\
  \ 公司的历史共同基金数据用于分析目的。考虑了 CIPLA 从 03-Jan-2011 到 09-Aug-2023 的历史共同基金数据，整个数据分为训练和测试段。2011\
  \ 年 1 月 3 日至 2022 年 8 月 6 日的数据用于训练目的，2022 年 8 月 7 日至 2023 年 8 月 6 日的数据用于测试目的。波动共同基金进行了比较和分析以预测模型的未来价格。\n\
  \n## 6. 研究方法\n\n### 6.1 使用 ARCH & GARCH 建模波动性\n\n1982 年，Robert Engle 开发了自回归条件异方差（`ARCH`）模型来预测经济时间序列数据中经常发现的随时间变化的可变性。为此，他获得了\
  \ 2003 年诺贝尔经济学奖。`ARCH` 模型估计当前误差或创新的方差。\n\n### 6.2 时间序列-ARCH\n\n设 `Z[t]` 为 N (0,\
  \ 1) 过程 `X[t]` 是 `ARCH(q)` 过程，如果它是平稳的并且如果它满足，对于所有 t 和某个严格正值过程 `σ[t]`，方程：\n\n(1)\n\
  \n`X[t] = σ[t]Z[t]`\n\n(2)\n\n```\n\\sigma^{2}\\text{t} = \\alpha_{0} + {\\sum_{i\
  \ = 1}^{q}{\\alpha_{\\text{i}}\\text{X}_{\\text{t} - \\text{i}}^{2}}}\n```\n\n其中\
  \ 0 和 i, I = 1, 2 …… q。\n\n`X[t]` 是时间序列回归模型中的误差项。\n\n### 6.3 时间序列-广义-ARCH 模型（GARCH）\n\
  \n在介绍 `GARCH` 之前，我们讨论指数加权移动平均（`EWMA`）模式，其由以下方程表示：\n\n(3)\n\n`σ[t]² = λσ[t−1]² +\
  \ (1−λ)X[t−1]²`\n\n其中 `λ` 是 0 和 1 之间的常数。\n\n`EWMA` 方法具有吸引人的特点，即需要存储的数据相对较少。\n\n\
  我们用 `σ²[t−1]` 代替，然后继续进行 m 步：\n\n(4)\n\n```\n\\sigma_{t}^{2} = (1 - \\lambda){\\\
  sum_{i = 1}^{m}{\\lambda^{i - 1}X_{t - 1}^{2} + \\lambda^{m}\\sigma_{t - m}^{2}}}\n\
  ```\n\n对于较大的 m，项 `λ^m σ²[t−m]` 足够小可以忽略，因此呈指数下降。\n\n时间序列-`GARCH` 过程是在广义 `ARCH` 过程的意义上，允许平方波动率\
  \ `σ²[t]` 依赖于先前的平方波动率，以及过程的先前平方值。\n\n设 `Z[t]` 为 N (0, 1)。过程 `X[t]` 是 `GARCH(p, q)`\
  \ 过程，如果它是平稳的并且如果它满足，对于所有 t 和某个严格正值过程 `σ[t]`，方程：\n\n(5)\n\n```\n\\sigma_{\\text{t}}^{2}\
  \ = \\alpha_{0} + {\\sum_{i = 1}^{q}{\\alpha_{\\text{i}}\\text{X}_{\\text{t} - \\\
  text{i}}^{2}}} + {\\sum_{j = 1}^{p}{\\beta_{\\text{i}}\\sigma_{\\text{t} - \\text{m}}^{2}}}\n\
  ```\n\n其中 `α[0] >0` 且 `α[i] ≥0`，I = 0, 1, 2 … q，`β[j] ≥ 0`，j=0, …., p。\n\n### 6.4\
  \ 增广 Dickey Fuller 检验（ADF 检验）\n\n`ADF` 检验是对时间序列样本中单位根的检验。`ADF` 检验用于检验数据是否平稳。\n\n\
  (6)\n\n`X[t] = α + β[t] + yX[t−1] + ∂[1]ΔX[t−1] + ∂[p]ΔX[t−p−1] + ε[t]`\n\n原假设：ƴ\
  \ = 0⇒`X[t]` 具有单位根。\n\n## 7. 数据的一般统计\n\n该表显示了均值、中位数、最大值、最小值、标准差、偏度、峰度和 Jarque-Bera\
  \ 检验的值。利用这些统计信息我们可以分析收集的历史数据的性质（Figure 7.2）。\n\n![Figure 7.2: General statistics\
  \ of data.](img/fig7_2_C.jpg)\n\nFigure 7.2: General statistics of data.\n\n`Hurst`\
  \ 指数用于检查序列是否均值回归、随机游走或趋势。这里 H< 0.5，所以时间序列是均值回归的。时间序列的自相关衡量时间序列的滞后值与其过去值之间的关系。偏自相关显示时间序列与后续时间间隔的滞后值之间的接近程度在数学上构成自相关（Figure\
  \ 7.3）。\n\n![Figure 7.3: Daily volatility of dataset (Cipla).](img/fig7_3_C.jpg)\n\
  \nFigure 7.3: Daily volatility of dataset (Cipla).\n\n## 8. 异方差性检验\n\n日常回归模型的重要假设之一是误差在整个样本中具有相同的方差。这也称为同方差模型。如果误差方差不一致，则数据被认为是异方差的。方程如下：\n\
  \n(7)\n\n```\nQ(q) = T(T + 2){\\sum_{i = 1}^{q}\\frac{r(i;e_{t}^{2})}{N - i}}\n\
  ```\n\n其中\n\n(8)\n\n```\nr(i;e_{\\hat{t}}^{2}) = \\frac{\\sum_{t = i + 1}^{T}(e_{t}^{2}\
  \ - \\sigma^{2})(e_{t - 1}^{2} - \\sigma^{2})}{\\sum_{t = 1}^{T}{(e_{t}^{2} - \\\
  sigma^{2})}^{2}}\n```\n\n非线性时间序列模型的 Portmanteau Q 检验，基于平方残差的 portmanteau 检验统计量用于检验序列的独立性。异方差性检验显示\
  \ arch 效应存在于数据集中，因为 P 值 < 0.05% 在 5% 置信区间，并且常数变量 C 在统计上也显著，因为 P 值小于 5% 水平。\n\n##\
  \ 9. 模型仿真测试\n\n\n\n\n\nSimulation of an ARCH (1) and GARCH (1, 1) time series done\
  \ respectively using a function `simulate_GARCH(n, omega, alpha, beta = 0)`. Recall\
  \ the difference between an ARCH (1) and a GARCH (1, 1) model is: besides an autoregressive\
  \ component of *α* multiplying lag-1 residual squared, a GARCH model includes a\
  \ moving average component of *β* multiplying lag-1 variance. The function will\
  \ simulate an ARCH/GARCH series based on `n` (number of simulations), `omega`, `alpha`,\
  \ and `beta` (0 by default). It will return simulated residuals and variances (Figure\
  \ 7.4).\n\n![Figure 7.4: Simulation test of data.](img/fig7_4_C.jpg)\n\nFigure 7.4:\
  \ Simulation test of data.\n\n## 10. Simulation Impact of Parameters on Model\n\n\
  For simulation purpose function `simulate_GARCH()` called and the impact of GARCH\
  \ model parameters on simulated results is analyzed. Specifically, we have simulated\
  \ two GARCH (1, 1) time series; they have the same `omega` and `alpha`, but different\
  \ `beta` as input. Recall in GARCH (1, 1), since *β* is the coefficient of lag-1\
  \ variance, if *α* is fixed, the larger the *β*, the longer the duration of the\
  \ impact. In other words, high or low volatility periods tend to persist. Pay attention\
  \ to the plotted results and see whether we can verify the *β* impact (Figures 7.5\
  \ and 7.6).\n\n![Figure 7.5: Simulation impact of (beta=0.2) on GARCH model.](img/fig7_5_C.jpg)\n\
  \nFigure 7.5: Simulation impact of (beta=0.2) on GARCH model.\n\n![Figure 7.6: Simulation\
  \ impact of (beta=0.6) on GARCH model.](img/fig7_6_C.jpg)\n\nFigure 7.6: Simulation\
  \ impact of (beta=0.6) on GARCH model.\n\n## 11. Forecast Evaluation\n\nAt 90% confidence\
  \ interval the performance of model is evaluated and different types of error is\
  \ calculated. The lower value of root means squared (RMS) proves the supremacy of\
  \ forecasting model. In proposed model the RMSE value is 0.018777 that is very low\
  \ so we can say that our model’s forecasting value is very close to actual value\
  \ and proves the accuracy of our model. The second error estimation parameter is\
  \ Thiel inequality coefficient is 0.900024 that is 0.90% shows the perfect fit between\
  \ actual open price and forecasting open price of the mutual fund. Third parameter\
  \ is bias proportion which is also proves the accuracy of model in our proposed\
  \ model. The value of error term is 0.000150 which shows the systematic error value\
  \ of bias proportion is very low also shows the accuracy of proposed model. Another\
  \ performance parameter mean absolute error also shows value 0.014534 and proves\
  \ the accuracy of our proposed model (Table 7.1, Figures 7.7 and 7.8).\n\nTable\
  \ 7.1 : Performance matrices of model\n\n| RMSE || Thiel inequality coefficient\
  \ || Bias proportion || Mean absolute Error |\n| --- | --- | --- | --- |\n| 0.018777\
  \ || 0.900024 || 0.000150 || 0.014534 |\n| --- | --- | --- | --- |\n\n![Figure 7.7:\
  \ Forecast evaluation of model.](img/fig7_7_C.jpg)\n\nFigure 7.7: Forecast evaluation\
  \ of model.\n\n![Figure 7.8: Forecast comparison graph.](img/fig7_8_C.jpg)\n\nFigure\
  \ 7.8: Forecast comparison graph.\n\n## 12. Conclusions\n\nThis paper uses GARCH\
  \ volatility models to analyze and predict conditional deviations. The proposed\
  \ methodology helps build a long-term robust portfolio by analyzing historical data\
  \ based on time-series analysis. The low RMSE value of 0.018777 indicates that the\
  \ GARCH model’s predictions are quite accurate, with minimal variance from the actual\
  \ data. This suggests that the model is effective in capturing the underlying patterns\
  \ of mutual fund volatility. The Thiel inequality coefficient of 0.900024 is close\
  \ to 1, implying a high degree of accuracy in the forecasts. This coefficient measures\
  \ the relative accuracy of predictions, and a value close to 1 suggests a strong\
  \ predictive capability of the GARCH model. The bias proportion of 0.000150 is indicative\
  \ of a negligible bias in the model’s predictions. This means that the GARCH model’s\
  \ forecasts are not systematically overestimating or underestimating the mutual\
  \ fund volatility, resulting in unbiased predictions. The MAE of 0.014534 further\
  \ supports the accuracy of the GARCH model. It represents the average absolute difference\
  \ between predicted and actual values. A low MAE indicates that the model’s forecasts\
  \ closely align with the observed data. Analytical outcomes show that it is an acceptable\
  \ model. The proposed model can be used by portfolio managers to compare the performance\
  \ of investment trusts over a considerable period of time. The experiment was conducted\
  \ using Indian mutual fund data, but it can also be applied to various mutual funds\
  \ around the world. It is also recommend for future researchers to investigate various\
  \ sectors mutual funds with external factors that badly affects the Indian mutual\
  \ fund market. Further improvements can be made to improve the accuracy of proposed\
  \ framework for analysis of other different factors that influence the volatility\
  \ of Indian mutual fund.\n\n### References\n\n1. Wang, X., Tsokos, C. P., and Saghafi,\
