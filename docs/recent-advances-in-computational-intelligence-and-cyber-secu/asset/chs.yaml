  ]。该天线在 WiMAX 的单频带和双频带中均可工作，其中包括 WLAN 和 Wi-Fi。已创建了两个单极天线 \\[10\\]，用于移动无线技术，包括 WiMAX、Wi-Fi\
  \ 和 WLAN 应用。这些天线的辐射元件由低成本 FR-4 基板上两个不同的几何形状构成。截断的金属铜接地用于提供可实现的最大辐射方向图和辐射效率。天线的规格包括\
  \ VSWR（1.5）、带宽（6–35%）、增益（1.7–3.4 dB）和辐射效率（85–90%），并且覆盖 2.45、3.50 和 5.20 GHz 的频率范围。演示了小型、低轮廓多频带可重构平面单极天线，可在单频带和双频带模式下工作\
  \ \\[8\\]。天线 1 在双频带模式下使用 WLAN 和 Wi-Fi。天线 2 具有两种不同的双频带模式，具体为（Wi-Fi 和 WLAN）和（WiMAX\
  \ 和 WLAN），取决于开关是打开还是关闭。已使用集总元件开关的紧凑型可重构单极天线 \\[5\\]，以在打开和关闭情况下在三个不同的频段工作。\n\n本研究提出了一种在底侧具有馈电线、在顶侧具有两个缝隙的可重构天线。为了实现频率重构，馈电线中使用\
  \ PIN 二极管作为开关。对于开关的打开和关闭状态，谐振频率分别为 10.01 GHz 和 3.73 GHz。\n\n## 2. 天线设计\n\n所提出天线的几何结构如图\
