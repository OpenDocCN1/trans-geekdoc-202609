  \n## 5. 数据集上的机器学习应用部分\n\n### 5.1 朴素贝叶斯（NB）\n\n朴素贝叶斯分类器是一组基于 `Bayes’ Theorem` 的分类算法。它不是单一算法，而是一系列算法，其中所有算法都共享一个共同原理，即即将被分类的每对特征彼此独立。它是一种简单但出人意料的强大的预测建模算法。该模型由两种可以直接从训练数据计算的概率组成：（1）每个类别的概率；以及（2）给定每个\
  \ x 值的每个类别的条件概率。一旦计算完成，概率模型就可以使用贝叶斯定理对新数据进行预测。NB 分类器专门为二元分类问题而设计。它非常容易构建，并且在处理海量数据时在许多情况下优于一些复杂的方法\
  \ [9]。\n\n### 5.2 K-最近邻（KNN）\n\n\n\n\n\nK-nearest neighbor 是 ML 中最基础却至关重要的分类算法之一。它属于监督学习领域，并在模式识别、数据挖掘和入侵检测中得到广泛应用。KNN\
  \ 算法非常简单且非常有效。KNN 的模型表示为整个训练数据集。对新数据点的预测是通过在整个训练集中搜索 K 个最相似的实例（邻居）并汇总这些 K 个实例的输出变量来完成的。关键在于如何确定数据实例之间的相似性\
  \ [10]。\n\n使用这两种算法，我们导入了 `sklearn` 库，通过将数据划分为测试用例和可训练数据来预测恶意流量和良性流量的发生情况，该数据用于预测结果。预测完成后，我们使用了\
  \ `sklearn` 库中的指标来确定使用模型对不同测试用例大小获得的结果的准确性。在 `KNN` 中，我们首先保持测试用例大小相同，通过改变预测中的邻居数量来获得最佳准确性。之后我们保持邻居数量相同而改变测试用例大小，以获得不同测试用例大小下的准确性。\n\
  \n在 `Naïve Bayes` 中，首先我们必须将输入形式更改为二进制以实现模型，然后我们只需更改测试用例大小即可获得不同的预测，我们用它来计算模型的准确性。\n\
  \n## 6. Results\n\n在我们将 `Naïve Bayes` 和 `KNN` 应用于数据集后，我们观察到 `KNN` 在预测数据方面比 `Naïve\
  \ Bayes` 更准确、更精确，关于改变测试用例大小 (Figure 10.8)。\n\nFigure 10.8 Table of accuracies w.r.t\
