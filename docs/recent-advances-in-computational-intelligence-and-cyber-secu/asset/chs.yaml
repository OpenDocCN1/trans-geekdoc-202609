  \ (Figure 33.4)。令其为图像 `Y`。\n\n![Figure 33.4: Threshold and filtered image 3.](img/fig33_4_C.jpg)\n\
  \nFigure 33.4: Threshold and filtered image 3.\n\n3. 填充二值图像的孔洞。\n4. 创建二值图像中物体的边界。\n\
