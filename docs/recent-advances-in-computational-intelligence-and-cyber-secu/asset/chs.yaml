  \ J. Fin. Stud., 11(3), 113。\n\n# 8 通过集成 SVM-GA 进行糖尿病分类与预测\n\nVishal Verma^(⁸)\n\
  \n### Abstract\n\n糖尿病是全球性的健康问题。据信，全球约有 4.22 亿人患有此病。当身体因缺乏胰岛素或无法正确使用胰岛素而无法调节血糖时就会发生。鉴于其慢性特性，及早识别糖尿病变得非常重要，以便在正确的时间进行治疗。机器学习（ML）已成为糖尿病预测的有价值工具，许多研究人员已采用\
  \ ML 技术进行准确预测。其中，支持向量机（SVM）是研究人员用于早期预测糖尿病的最流行、最广泛使用的算法之一。在本文中，研究人员提出了一种集成 SVM-遗传算法（GA）方法，并将其性能与多种\
  \ ML 方法进行了评估，例如 SVM、随机森林、K 近邻（KNN）、决策树（DT）、额外树分类器（ETC）、朴素贝叶斯（NB）、XG boost 和梯度提升。我们采用\
  \ PIMA 印第安人糖尿病数据集（PIDD）进行此比较分析。该研究结果表明，所提出的集成 SVM-GA 方法在准确率、精确率、召回率和曲线下面积（AUC）方面优于其他方法。\n\
  \n**关键词：** SVM，遗传算法，机器学习，糖尿病预测，医疗保健\n\n### 1. Introduction\n\n糖尿病是一种非传染性疾病，影响着世界上最多的人群。据世界卫生组织称，2019\
  \ 年约有 200 万人死于糖尿病[1]。糖尿病是一种慢性疾病，因为它还会影响多个身体器官并增加患其他慢性疾病如中风、心脏病发作和肾脏疾病的风险[2]。需要对患者进行定期监测和治疗以获得更好的治疗效果[3]。每个国家的政府都在其总国内生产总值（GDP）中花费了很大一部分用于医疗保健。政府和个人都将预算的相当大比例分配用于慢性病治疗[4]。人们主要有三种糖尿病类型：1\
  \ 型糖尿病（T1D）、2 型糖尿病（T2D）和妊娠糖尿病（GD）。在 T1D 中，胰腺无法产生胰岛素或产生非常少的胰岛素。在 T2D 中，身体无法正确使用胰岛素，且多见于\
  \ 45 岁以上人群，而 GD 多见于怀孕期间[5]。这一切都是由于恶劣的气候条件、人口、生活不卫生和错误的饮食习惯造成的。\n\n由于医疗保健行业的不断进步，已出现不同革命。互联网和电子健康记录（EHR）数据的易得性也在迅速增长。我们研究人员的孜孜不倦的努力在医疗保健领域展现出巨大潜力，包括利用各种基于\
  \ ML 的技术进行糖尿病的预测和分类[6]。分类模型可用于根据症状和生理特征对不同类型的糖尿病进行分类。有许多用于疾病分类和预测的基于 ML 的技术和算法。一些用于分类和预测的流行\
  \ ML 算法包括 SVM、NB、KNN、逻辑回归（LR）、DT 和随机森林（RF）。\n\n\n\n\n\n在糖尿病预测中，还有一些更重要的因素，如 `glucose`、`age`、`body\
  \ mass index (BMI)` 和 `family medical history` [7, 8]。利用 `ML` 的强大功能，很容易在大型数据集中识别出隐藏的模式和复杂的关系\
  \ [9]。`ML` 有助于减轻医疗从业者的工作负担 [10]。在本研究中，研究人员检查了多个参数，如 `accuracy`、`precision`、`recall`\
  \ 和 `AUC`，并对现有 `ML` 算法（`SVM`、`RF`、`KNN`、`DT`、`extra trees classifier (ETC)`、`NB`、`XG\
  \ boost` 和 `gradient boosting`）进行了性能比较。\n\n本文的结构如下 – 回顾糖尿病分类和预测的相关工作。概述研究材料和方法。全面分析结果，并最终与其他\
  \ `ML` 方法进行比较。按照方法，该部分讨论了主要发现，最后一个部分提供了结论和未来工作。\n\n## 2. 相关工作\n\n在本节中，研究人员深入探讨了用于糖尿病分类和预测的各种基于\
  \ `ML` 的技术的现有研究。尽管有大量研究致力于糖尿病预测，但问题仍然存在。为了阐明这一问题，我们在下面回顾了一些研究论文：\n\nWhig 等人 [11]\
  \ 提出了一种预测和分类糖尿病的新方法。作者使用 `Pycaret` 库来识别和分类糖尿病。Chauhan 等人 [12] 发表了一篇关于监督和无监督基于 `ML`\
  \ 的方法的综述论文。该综述强调了在糖尿病患者护理中使用的各种 `ML` 方法，并讨论了它们的优势和局限性。Ganie 等人 [13] 提出了一种用于预测 2\
  \ 型糖尿病 (`DM`) 的集成方法，利用生活方式指标。Injadat 等人 [14] 提出了一篇关于 `ML` 的全面综述，重点关注其在智能系统中的应用、挑战和机遇。该综述重点关注\
  \ `ML` 在各个领域的应用，包括医疗保健。Nibareke 等人 [15] 描述了航班延误分析、大数据以及用于糖尿病预测的各种 `ML` 模型。Pethunachiyar\
  \ [16] 提出了基于核的模型的 `SVM` 用于糖尿病患者的预测，并比较了几种核函数的性能。Chen 等人 [17] 提出了一种混合模型，利用 `DT` 和\
  \ `K-means` 的组合来预测 `T2D`。`DT` 用于分类，`K-means` 用于数据降维。研究人员将几种现有模型与所提出的模型进行了比较。他们发现，与其他现有模型相比，他们的混合模型表现更好。Wu\
  \ 等人 [18] 使用两个不同的数据集和数据挖掘技术，利用改进的 `K means` 和 `LR` 来准确预测糖尿病。Kumar 等人 [19] 提出了一项关于使用大数据分析预测糖尿病的不同\
  \ `ML` 算法性能的研究。比较分析表明 `RF` 实现了最高准确率。Nguyen 等人 [20] 描述了一种用于预测 `T2D` 发病率的深度学习方法，使用\
  \ `EHR` 数据。该研究在预测糖尿病方面实现了 0.85 的 `AUC`。Dahiwade 等人 [21] 研究了用于早期预测糖尿病的各种 `ML` 方法，他们发现\
  \ `DT` 算法在 `PIDD` 数据集上表现良好。Mujumdar 等人 [22] 使用大数据分析，有助于从庞大的数据集中发现趋势、隐藏模式和信息。并且他们还使用了一些其他外部因素以及常规因素来预测糖尿病。Tigga\
  \ 和 Garg [23] 在两个不同的数据集上应用了 `RF` 以及各种 `ML` 算法，并取得了令人印象深刻的 `RF` 结果。其中一个是 `PIDD` 数据集，另一个是基于在线和离线问卷的数据集。他们发现，适当的特征选择是实现更好预测的最重要方面。\n\
  \n这些研究共同强调了糖尿病预测中使用的各种方法和算法的多样性，强调了量身定制方法的需求以及不断追求更高准确性的需求。大多数研究都对多种 `ML` 方法的性能进行了比较，重点关注模型多样性而非单一模型的完美。相比之下，我们的研究集中于单一模型和最佳特征选择方法，以提高准确性和其他参数。本研究强调了算法选择和数据预处理对整体模型性能的重大影响。\n\
  \n## 3. 研究材料和方法\n\n本节讨论了本研究中使用到的资源、程序和方法。研究人员使用了来自可靠来源的数据集，确保了数据质量。进行了严格的数据预处理以确保准确性。精心选择了机器学习技术以实现预测准确性。子部分涵盖数据集、预处理、框架和评估方法。\n\
  \n### 3.1 数据集\n\n`PIDD` 数据集取自 `Kaggle` 仓库 [24]。所选数据集包含 768 条记录，由如 Table 1 所示的八个输入变量\
  \ `pregnancies` 以及一个输出变量组成。输出变量值为 `0` 和 `1`。值 `0` 表示无糖尿病的患者，`1` 表示患有糖尿病的患者。数据集的统计细节如\
  \ Table 8.1 所示。\n\nTable 8.1: Diabetes dataset description\n\n| S. No. || Parameter\
  \ || Description || Type |\n| --- | --- | --- | --- |\n| 1 || Pregnancies (Preg)\
  \ || Preg represents the number of times a woman has been pregnant || Integer |\n\
  | --- | --- | --- | --- |\n| 2 || Glucose (GLU) || GLU represents the plasma glucose\
  \ concentration of the patients || Integer |\n| 3 || Blood pressure (BP) || BP represents\
  \ the blood pressure (mm Hg) level of the patients || Integer |\n| 4 || Skin thickness\
  \ (ST) || ST represents the triceps skinfold thickness in millimeters || Integer\
  \ |\n| 5 || Insulin (INS) || INS represents the 2-hour serum insulin level measured\
  \ || Integer |\n| 6 || Body mass index (BMI) || BMI represents the individual is\
  \ normal weight, underweight, and overweight || Float |\n| 7 || Diabetes pedigree\
  \ function (DPF) || DPF values represent the genetic influence and a potentially\
  \ higher risk of diabetes || Float |\n| 8 || Age || Age represents the patient’s\
  \ age in years || Integer |\n| 9 || Outcome (OC) || OC represents the class variable\
  \ in 0 and 1 where 0 means an individual has no diabetes, and 1 refers to diabetes\
  \ || Binary |\n\n### 3.2 数据预处理\n\n数据预处理对于优化 `ML` 模型性能至关重要。初始步骤涉及数据归一化，将数据转换为线性格式（`min-max\
  \ normalization`，`[0, 1]` 范围）。随后，应用标签编码将因变量（`diabetes prediction`）转换为二进制值（`0` 或\
  \ `1`）。\n\n处理缺失值至关重要；我们的数据集中 `skin thickness` 缺失 227 个值，`insulin` 缺失 374 个，`blood\
  \ pressure` 缺失 35 个。为处理此问题，我们用相应特征的中位数填充缺失值，确保数据完整性。\n\n### 3.3 拟议框架\n\n研究人员专注于提高糖尿病检测的准确性。作者提出了一种基于混合\
  \ `ML` 的方法，即集成 `SVM-GA`。该过程从数据预处理和增强开始，然后将输入馈送到模型中。\n\n\n\n\n\nThe proposed method\
  \ is visualized in Figure 8.1 providing a simplified overview of the data processing\
  \ pipeline. It consists of key elements such as the PIMA dataset, pre-processing,\
  \ testing and training data, model fitting, integrated SVM-GA, and prediction.\n\
  \n![Figure 8.1: Proposed integrated SVM-GA method.](img/fig8_1_C.jpg)\n\nFigure\
  \ 8.1: Proposed integrated SVM-GA method.\n\nTo evaluate the method’s performance,\
  \ the dataset was split into 80:20 ratios, with 80% for model training and 20% for\
  \ testing. Implementation of the model was carried out using Google Collab, leveraging\
  \ resources available on the Kaggle repository. The PIDD dataset was accessed and\
  \ evaluated using scientific computing, data analysis, and visualization tools,\
  \ including `scikit-learn`, `pandas`, `NumPy`, and deep packages.\n\nThe following\
  \ various steps were implemented to execute:\n\n1. **Data collection:** Collect\
  \ the dataset from `Kaggle.com`.\n\n2. **Data pre-processing:** Clean and prepare\
  \ the dataset, addressing missing values, outliers, and normalization.\n\n3. **Dataset\
  \ splitting:** Divide the dataset into training and testing subsets.\n\n4. **Genetic\
  \ algorithm optimization:** Apply GA to optimize the SVM for improved accuracy.\n\
  \n5. **Model testing and prediction:** To assess the model, we utilized the final\
  \ 20% of the test data for prediction.\n\nThese steps constitute a systematic and\
  \ thorough process for developing, optimizing, and assessing a machine learning\
  \ model. Their purpose is to guarantee the model’s readiness, thorough testing,\
  \ and optimization for optimal accuracy and applicability.\n\n### 3.4 Proposed methodology\n\
  \nThe researchers introduce refined methodologies for diabetes prediction, enabling\
  \ healthcare professionals and researchers to make informed decisions and provide\
  \ targeted interventions for at-risk individuals. The following methodologies used\
  \ for the prediction of diabetes are provided in the below sections.\n\n#### 3.4.1\
  \ Support vector machine\n\nThe SVM is a collection of interconnected supervised\
  \ learning methods used in medical diagnosis for classification and regression.\
  \ It minimizes empirical classification error while maximizing geometric margin.\
  \ It is hence referred to as a maximum margin classifier. A set of assured risk\
  \ thresholds from statistical learning theory is the foundation of a widely used\
  \ method. These successfully handle non-linear classification by implicitly mapping\
  \ their inputs to an extent feature space via kernel technique. A kernel technique\
  \ is used to build the classifier without explicitly knowing the feature space [25].\
  \ An SVM model represents instances as points in space, enabling the largest practical\
  \ category gap to separate examples from different categories. For instance, given\
  \ a set of points belonging to one of two classes, an SVM can find a hyperplane\
  \ with the highest proportion of points from the same class on the same plane [26].\
  \ The distance between two parallel hyperplanes is optimized by the optimal separation\
  \ hyperplane (OSH), which can lessen the likelihood of misclassifying samples in\
  \ the test dataset. The SVM uses the equation that is given below equation.\n\n\
  (1)\n\n*f*(z) = *sign*(*w*^(*T*)*z* + *b*^(*t*))\n\nwhere *z* is the feature vector\
  \ that is entered, *w*^(*t*) is the weight vector illustrating the significance\
  \ of every attribute in the classification, *b*^(*t*) is the term of bias that changes\
  \ the decision boundary, and `sign` is a function of sign that converts +1 if the\
  \ input is favorable, and -1 if the input is unfavorable. The SVM algorithm finds\
  \ the optimal values of *w*^(*t*) and *b*^(*t*) that maximize the margin between\
  \ the two classes, which helps in making accurate predictions.\n\n#### 3.4.2 Genetic\
  \ algorithm equation\n\nAn optimization technique takes its cues from the principles\
  \ of genetics and natural selection. It is used to identify approximations of solutions\
  \ to optimization and search-related problems. The core idea behind a GA is to iteratively\
  \ evolve a population of alternative solutions in order to find the best solution\
  \ to a problem. Several of the fundamental equations used in GA include population,\
  \ fitness function, selection, crossover, mutation, and replacement [27]. To perform\
  \ GA, the following various steps are given below.\n\n1. Generate random sets of\
  \ 5 features to create the initial population of chromosomes (`C`).\n\n2. Assign\
  \ scores to `C` based on their predictive accuracy for emotional states using a\
  \ statistical model with the nearest centroid classifier.\n\n3. Select `C` with\
  \ scores meeting the fitness objective; otherwise, continue the process.\n\n4. Duplicate\
  \ `C` based on their performance in problem-solving, with higher-scoring `C` producing\
  \ more offspring.\n\n5. Perform crossover by recombining genetic material from replicated\
  \ parent `C`.\n\n6. Introduce new genes through mutations into the newly created\
  \ population of `C` from Step 5.\n\n7. Repeat stages 2–6 in cycles (generations)\
  \ until a solution is found.\n\nThe process of natural selection served as inspiration\
  \ for the development of GA. The equation used in GA is:\n\n(2)\n\n*fitness* = *f*(*x*)\n\
  \nwhere `fitness` is the fitness value of the individual, *f*(*x*) is the objective\
  \ function that measures the performance of the individual.\n\nThe objective of\
  \ GA is to identify the ideal values for the parameters that maximize the fitness\
  \ value. In the SVM-GA model, GA is utilized to optimize the SVM parameters, increasing\
  \ the model’s accuracy. The SVM-GA model can accurately categorize and predict diabetes\
  \ by combining.\n\n## 4. Result Analysis\n\nThe researchers found that the proposed\
  \ classifier method achieved favorable performance, with high precision, recall,\
  \ accuracy, and AUC values when using the PIDD dataset. The evaluation metrics included\
  \ true positive (`TP`), true negative (`TN`), false positive (`FP`), and false negative\
  \ (`FN`) to assess classifier performance.\n\n(3)\n\n$$Accuracy = \\frac{TP + TN}{TP\
  \ + TN + FP + FN}$$\n\n(4)\n\n$$Recall = \\frac{TP}{TP + FN}$$\n\n(5)\n\n$$Precision\
  \ = \\frac{TP}{TP + FP}$$\n\nAccuracy quantifies the model’s overall correct predictions,\
  \ while recall gauges the correct prediction of positive instances by the proposed\
  \ method. Precision assesses the accuracy of positive predictions correctly identified\
  \ as positive among all positive instances. The AUC evaluates a binary classification\
  \ model’s performance by calculating the area under the ROC curve. The AUC can be\
  \ calculated by integrating the ROC curve using a numerical integration method such\
  \ as the trapezoidal rule. These metrics are used to evaluate the performance of\
  \ the SVM-GA model on the PIDD dataset.\n\nFrom Table 8.2 confusion matrix, researchers\
  \ have calculated the following performance metrics:\n\nTable 8.2: Confusion matrix\
  \ of SVM-GA\n\n|  || True positive || True negative |\n| --- | --- | --- |\n| *Actual\
  \ positive* || 91 || 8 |\n| --- | --- | --- |\n| *Actual negative* || 23 || 32 |\n\
  \n> Accuracy = (91 + 32) / (91 + 32 + 8 + 23) = 79.87%\n\n> \n\n> Recall = 91 /\
  \ (91 + 23) = 79.82%\n\n> \n\n> Precision = 91 / (91 + 8) = 91.91%\n\n> \n\n> AUC\
  \ (area under the curve) = 84.53%\n\nThe SVM-GA model achieved an accuracy of 79.87%,\
  \ recall of 79.82%, precision of 91.91%, and AUC of 84.53%. These metrics indicate\
  \ that the model has good performance in predicting diabetes on the PIDD dataset.\n\
  \n### 4.5. Comparison\n\nIn this section, researchers compared the performance of\
  \ several ML algorithms, including SVM, RF, KNN, DT, NB, extra trees classifier,\
  \ XG boost, gradient boosting, and SVM-GA. They evaluated these algorithms based\
  \ on multiple metrics, including accuracy, precision, recall, and the area under\
  \ the ROC curve (AUC), as depicted in Figure 8.2.\n\n![Figure 8.2: Model comparison\
  \ based on different metrics.](img/fig8_2_C.jpg)\n\nFigure 8.2: Model comparison\
  \ based on different metrics.\n\n\n\n\n\n在 表 8.3 中，研究人员展示了每种 ML 方法的性能指标。这些数值来自我们的实验，已证明算法在解决给定问题方面的有效性。显而易见，集成的\
  \ `SVM-GA` 方法表现最佳，准确率、精确率和 AUC 分数均最高。\n\n表 8.3：模型比较\n\n| Model comparison | | Accuracy\
  \ (%) | | Precision (%) | | Recall (%) | | AUC score (%) |\n| --- | --- | --- |\
  \ --- | --- | --- | --- | --- |\n| SVM | | 75 | | 80 | | 80 | | 81 |\n| --- | ---\
  \ | --- | --- | --- | --- |\n| RF | | 72 | | 77 | | 78 | | 81 |\n| KNN | | 66 |\
  \ | 70 | | 75 | | 72 |\n| DT | | 74 | | 75 | | 83 | | 74 |\n| ETC | | 74 | | 80\
  \ | | 79 | | 80 |\n| NB | | 76 | | 79 | | 83 | | 83 |\n| XG boost | | 68 | | 70\
  \ | | 78 | | 77 |\n| Gradient boosting | | 74 | | 77 | | 81 | | 81 |\n| **SVM-GA**\
  \ | | **79.87** | | **91.91** | | 79.82 | | **84.53** |\n\n## 5. Discussion\n\n\
  实验研究采用了九种不同的 ML 算法，包括 `SVM`、`RF`、`KNN`、`DT`、`NB`、额外树分类器、XG boost、梯度提升以及新颖的 `SVM-GA`。研究使用了\
  \ PIDD 数据集作为所有分类器的共同基础。执行了全面的预处理步骤以消除数据集中的空值，确保数据完整性。\n\n为了稳健地评估模型性能，数据集已被细致地划分为两部分：80%\
  \ 的训练数据集和单独的 20% 测试数据集。各种 ML 算法已一致应用于同一数据集，研究人员专注于工程化特征以评估其预测能力。研究人员进行了彻底的评估，利用准确率、精确率、召回率和\
  \ AUC 等关键性能指标，对每种算法的有效性进行全面评估。本研究的重点发现表明，创新的集成 `SVM-GA` 方法优于传统算法，表现出明显更高的识别性能。具体而言，该框架实现了令人印象深刻的平均\
  \ AUC 84.53%，超过了传统算法的性能。\n\n### 6. Conclusions\n\n将提出的 `SVM-GA` 模型应用于 PIDD 数据集证明了其在以高准确率、精确率、召回率和\
  \ AUC 对糖尿病进行分类和预测方面的有效性，优于 `LR`、`DT` 等传统 ML 模型。这凸显了集成 SVM 和 GA 算法以获得更好结果的潜力。所提出的方法有望为医疗专业人员在糖尿病预测和识别高风险患者方面提供帮助，实现早期诊断和经济有效的治疗。需要注意的是，模型准确性取决于数据集质量、大小和超参数调优。这些发现还表明了在预测其他疾病方面的未来应用，并呼吁进一步的研究和算法探索，包括集成模型，以提高准确性。探索更广泛的医疗应用，完善模型，并研究替代算法和集成方法以提高预测准确性。\n\
