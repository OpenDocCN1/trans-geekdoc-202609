  \ 控制律需要修改以获得更好的控制信号。\n\n### 3.2. Power rate reaching law\n\n与经典的 `SMC` 相比，到达律如方程\
  \ 6 所示，如 Figure 30.4 所示存在大量抖振。通过引入 `α`，`0 ≤ α ≤ 1`，状态在非线性路径中到达滑模面，这增加了调节时间并减少了抖振。具有幂次到达律的控制律如方程所示。\n\
