  \ Chal. Inform. Sci. (RCIS), 1–2。\n\n# 23 面向网络攻击的增强型分层物联网架构用于物联网应用\n\nVinay Kumar\
  \ Sahu^(²³)\n\n### Abstract\n\n如今，物联网（IoT）正迅速成为全世界最受欢迎的技术之一，其中大量设备相互连接以使人类生活更可行、更舒适。物联网技术在各处发挥着重要作用。它是嵌入式计算、通信技术、传感器和执行器的融合。物联网的目标是随时随地赋予用户无缝能力。尽管有各种好处，物联网也需要高水平的安全性、身份验证、隐私和防攻击保护。过去的工作中已引入了各种物联网应用的安全机制和解决方案，但物联网在安全和隐私领域仍面临大量挑战。本文提出了一种改进的物联网架构，并对不同研究人员提出的各种架构方法进行了全面分析，从基础架构到商业级实现。具体而言，本文重点关注与物联网架构相关的物联网安全场景，并检查了物联网系统中存在的各种安全威胁和漏洞，如保密性、隐私、身份验证、完整性、访问控制等。作者通过讨论物联网架构中的隐私和安全问题及其对研究人员构成的挑战来总结工作。\n\
  \n**关键词：** Internet of Things (IoT), IoT infrastructure, sensors, actuators, IoT\
  \ security, IoT applications\n\n### 1. Introduction\n\n物联网（IoT）一词是两个词的组合：Internet\
  \ 和 Things。Internet 一词指的是互联；它涵盖的不仅是电子设备，还包括人类、动物等活物，以及家具、衣服等非生命物体，最后将这两个词用“of”连接起来就形成了物联网。进入新世纪以来，物联网作为众多应用中的技术迅速发展。智能设备通过无线和有线网络互联，实现实时处理、通信、计算和观察场景。实施物联网系统会带来各种安全和隐私问题，因为现有传统安全协议的性质并不适合新型物联网设备。物联网一词指的是智能设备高效地检测并汇聚来自世界各地的信息，然后通过互联网提供信息，以便对其进行处理并用于各种引人入胜的目的的基本思想。物联网是一组智能机器，它们与机器、物品、系统和基础架构协作并进行通信。迄今为止，人们使用各种不同的方法进行通信以保持联系，其中最流行的方式是互联网，因此我们可以说互联网是人群联系的手段。随着物联网的快速发展，它也面临着各种安全和隐私威胁。为了确保物联网安全，防御技术必须能够检测威胁并对攻击做出响应。\n\
  \n本工作的主要贡献如下：\n* 首先，我们检查了各种已发布的标准和物联网架构。\n* 其次我们对现有架构进行了批判性回顾。\n* 然后在批判性回顾之后我们提出了一个详细的物联网架构分层版本。\n\
  * 物联网环境中安全和隐私问题的全面风险分析。\n* 提出未来研究的方向。\n\n继续本文，我们将剩余部分整理如下，隐私和安全挑战领域的相关工作以及各种现有物联网架构可在\
  \ 第 2 节 中找到。对各种现有物联网架构的批判性回顾在 第 3 节 中构建。所提出物联网构造的简明构建在 第 4 节 中呈现。第 5 节 涉及物联网环境中揭示的可能隐私和安全挑战。第\
  \ 6 节 建议未来研究的方向以美化物联网环境。本文在 第 7 节 中以我们工作的总结结束。参考文献在第 8 节中列出。\n\n## 2. Related Work\n\
  \n\n\n\n\n### 物联网与安全概述\n\n互联网在信息传输中发挥着至关重要的作用。技术正从单纯的共享信息转向收集数据、分析数据，以及通过互联网远程监控和控制设备，这就产生了所谓的\
  \ `IoT`。 “物联网”这一术语最早由 Kavin Ashton 于 1999 年提出，当时研究人员正在使用射频识别 (`RFID`) 技术进行物品识别。Kavin\
  \ 说，“我可能是第一个说‘物联网’的人这一事实，并不赋予我控制他人如何使用这个短语的权利。但我的意思，现在仍然是这样：今天的计算机——因此也是互联网——在信息方面几乎完全依赖人类”。Kevin\
  \ 认为，人们由于时间、注意力和准确性有限，并不擅长从现实世界的事物中捕获数据。世界需要赋予计算机自行收集信息的能力，以便它们真正看到和听到世界，无论它是什么。随着互联网改变了世界，`IoT`\
  \ 也将具有同样的潜力 \\[1\\]。根据我们在 `IoT` 时代对架构、隐私、安全、机遇和对社会影响的研究愿景，我们理解到需要对该技术进行详细调查。\n\n\
  #### 架构安全挑战\n\n现有的架构解决方案和技术使 `IoT` 的基石很容易受到安全威胁。企业和消费者都将受到安全漏洞的影响，这就是为什么这项任务令人望而生畏。作者进行了一项连贯的文献综述，以图解\
  \ `IoT` 中的安全威胁，从而提供一个乐观的安全框架，以最大程度地降低与 `IoT` 相关的风险。根据研究人员，`IoT` 需要一个改进的安全标准，才能在工业互联网和未来工业\
  \ 4.0 中发挥主导作用 \\[2\\]。为了构建智能家居 `IoT` 应用，研究人员提出了一种轻量级授权栈，其中输入命令从云连接设备中继到最终用户的智能手机。所提出的架构基于用户设备，并旨在解决不可信云环境中的安全问题。对于未来研究，作者希望在\
  \ `RIoT` 操作系统上部署 `Kaa` `IoT` 应用，并将仿真设置扩展到 `RIoT` 虚拟网络，并增强现实场景中的测试练习 \\[3\\]。\n\n\
  #### 隐私、可靠性和技术障碍\n\n企业、政府和人们都可以在日常生活中从 `IoT` 中获得巨大益处。虽然 `IoT` 提供了极大的便利，但它也带来了几个重大的技术障碍。实施安全可靠的\
  \ `IoT` 应用对于 `IoT` 的长期成功至关重要。连接到互联网的监控设备和传感器设备跟踪人们的私人生活，同时将它们传输到云端。作者说明了与 `IoT`\
  \ 相关的关键安全问题、安全威胁、漏洞以及适用于各种 `IoT` 组件的对策。作者还讨论了轻量级密码学的重要性及其在 `IoT` 中的作用 \\[4\\]。作者简要讨论了\
  \ `IoT` 安全的技术方面。由于仅连接了两台设备就难以提供足够的保护。安全在这种情况下被视为最重要的因素。在当前情况下，数百万台设备已连接，数十亿个传感器存在，并且数量每天都在迅速增长。它们都预计具有可靠且安全的连接性。正因如此，`IoT`\
  \ 部署需要为公司和组织设计完善的安全架构。作者提出，从未经授权的访问中保护敏感信息将是 `IoT` 在今后研究中面临的最大挑战 \\[5\\]。\n\n####\
  \ 网络攻击与安全传输\n\n作者在印度背景下识别出各种类型的网络攻击，并通过实施广泛使用的匈牙利方法加强了已识别的攻击。作者引入了一种安全方法，以最大程度地减少网络上的损失。可以通过使用\
  \ N×N 矩阵对同一工作进行扩展，以确定划分的数量，这意味着每个部门的攻击数量应相等 \\[6\\]。利用众所周知的 Rivest、Shamir 和 Adleman\
  \ (`RSA`) 算法，作者提出了一种利用其 `MAC` 地址保护信息传输的系统。作者还通过面向对象编程语言对所提出的算法在各种设备的不同 `MAC` 地址上进行了评估。根据作者，还可以升级该算法以安全地传播音频、视频和文本内容\
  \ \\[7\\]。\n\n#### 智能家居与网络犯罪建模\n\n作者旨在构建一个无线智能家居安全系统，当检测到非法入侵时通过互联网发送通知，并在入侵发生时选择性地触发警报。类似的系统也可以使用相同的传感器纳入家庭自动化。研究人员在所提出系统中使用的微控制器采用\
  \ `TI-CC3200 Launchpad` 板，该板内置微控制器并嵌入 Wi-Fi 屏蔽，有助于管理所有家庭电器。此外，通过将语音通话功能纳入移动应用程序，可以使系统更加同步，用户可以更有效地操作其家庭电器\
  \ \\[8\\]。基于面向对象技术，作者提出了一种分析可能发生在分布式网络中的网络犯罪的模型，并提出了一个用于网络犯罪在线报案的 `UML` 模型。还可以加入各种方法，如优化和曲线拟合，以降低所研究问题中的风险因素\
  \ \\[9\\]。\n\n#### 云、雾计算与未来方向\n\n`IoT` 由于其独特的特性，如自组织、资源受限和通信邻近性，始终使用云来存储数据和计算。因此，静态数据带来了一系列不寻常的安全问题。作者进行了一项分析，以识别问题和云计算采用的方法，以确保\
  \ `IoT` 应用安全迁移到云计算。根据作者，在今后的研究中，还可以为已经建立的数百万台 `IoT` 小工具采用先进的识别技术 \\[10\\]。\n\n作者观察到，`IoT`\
  \ 系统由于其独特特征，包括协议和设备的异构性、对物理环境的依赖以及与人类的密切交互，而面临安全、可靠性和隐私问题方面的特殊挑战。其中一位作者还说明了当前研究挑战如何利用其他领域的安全、可靠性和隐私创新。Bagchi\
  \ 等人还建议未来将 `IoT` 设备以安全的方式集成到云基础设施中，将应用安全和软件开发中的功能问题分开，并建立安全边界 \\[11\\]。Jiang 等人介绍了雾计算和云计算的感知和特征，并说明了它们之间的协作和比较。探索了\
  \ `IoT` 在新型应用需求中遇到的关键挑战，例如网络带宽限制、低延迟、服务稳定性、设备的资源限制以及安全性和基于雾的技术。研究人员还讨论了雾计算融入 `IoT`\
  \ 系统后的研究方向和剩余挑战。此外，在智能交通和可感知机器人领域，基于 5G 的雾计算发挥着重要作用也被探索 \\[12\\]。\n\n\n\n\n\n智能家居系统和电器目前已存在，但它们基于较旧的技术，其用户界面范围有限，使得终端用户难以控制它们。现有的智能家居也引发了安全方面的担忧，因为它们可以被顺利入侵，这可能导致重大问题。所引入的智能家居系统旨在提供安全保障并简化终端用户对技术的适应\
  \ \\[13\\]。观察威胁并应对攻击应是物联网安全的目标。研究人员还旨在鼓励物联网的安全模式以降低影响用户的风险，并强调了关于传统和基于区块链的物联网安全问题方面仍未充分发展的几个分析领域\
  \ \\[14\\]。\n\n本文献综述主要关注现有的物联网参考架构以及物联网智能家居环境中的各种可能安全威胁。此外，它还说明了物联网在商业和社会上众多新兴动态应用，为人类福祉服务。\n\
  \n### 3\\. 物联网架构的批判性评述\n\n物联网平台极其重要，因为它有潜力彻底改变全球各地的各种实时应用。它整合了智能设备、传感器、执行器、RFID\
  \ 和互联网，以构建一个极其智能的系统。在物联网环境中，传感器通过有线或无线方式连接在异构网络上 \\[15\\]。\n\n在 Table 23.1 中概述了详尽的比较分析，涉及所采用的系统设计、方法、协议，以及各种可用物联网架构在功能、隐私和安全方面所面临的挑战。\n\
