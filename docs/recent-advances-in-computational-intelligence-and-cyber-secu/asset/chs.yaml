  \n## 5. Conclusions\n\nThe proposed antenna is of low profile and having compact\
  \ size. The total size of the antenna is 36 × 30 × 1.6 mm3 and provides the range\
  \ of frequencies from (1.4–1.8)/1.6 GHz, (2.1–3.5)/2.4 GHz, (5.4–6.3)/5.8 GHz, (7.0–7.3)/7.2\
  \ GHz and (9.2–11.6)/9.9 GHz suitable for GNSS, WiMAX, LTE, Wireless LAN, C- and\
  \ X-band applications. The simulated impedance bandwidth comes out to be 25%, 58%,\
  \ 16%, 4% and 24% and measured impedance bandwidth of 19%, 50%, 16%, 4% and 13%.\
  \ The gain at all five resonances are 2.8 dBi, 1.8 dBi, 3.7 dBi, 2.9 dBi and 5.4\
  \ dBi. The antenna also exhibits good radiation pattern. The antenna is simulated\
  \ on ANSYS HFSS with FR4 substrate.\n\n## 6. Acknowledgement\n\nThe authors are\
