  \ s \\\\middle| {}\\_{\\\\alpha}{sgn}(s) \\\\right. \\\\\\\\ \\\\end{array}$$\n\n\
  整理项后得到控制律如下：\n\n$$F = \\\\left( kp{\\\\overset{˙}{T}}\\_{d} - \\\\frac{kpU\\_{A}\\\
