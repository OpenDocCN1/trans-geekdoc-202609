  _{d} - T\\_{i}} \\\\right) + k \\\\middle| s \\\\middle| {}\\_{\\\\alpha}{sgn}(s)\
  \ \\\\right)\\\\left( \\\\frac{m\\_{j}C\\_{pj}}{k\\_{p}C\\_{pc}\\\\left( {T\\_{j}\
  \ - T\\_{c}} \\\\right)} \\\\right)$$\n\nFigure 30.5 显示了与之前另外两种 `SMC` 结果相比振荡减少的良好跟踪，之前的结果分别显示在\
  \ Figures 30.3 和 30.4 中。与其他两种 `SMC` 相比，冷却剂流量消耗也最优。\n\n![Figure 30.5: Experimental\
