  \ (1) 计算得到 `p[1]` = ⌊`log2)`⌋ = 2。`p[1]` 位首先转换为十进制数 `Z`。然后组合数系统在自然数 `Z` 与 `k`-组合之间提供一一映射。从算法\
  \ 1，我们可以找到给定数字 `Z` 的 `k`-组合。\n\n在从输入 `p[1]` 额外信息位获得 `J` 索引序列后，非活动子载波中的符号被设为零。在 Table\
