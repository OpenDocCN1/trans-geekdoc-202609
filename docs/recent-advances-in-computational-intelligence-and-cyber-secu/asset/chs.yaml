  \n# 24 使用可优化支持向量机增强软件可维护性预测\n\nRohit Yadav^(²⁴)\n\n### Abstract\n\n可维护性是任何软件系统中的关键阶段，它不仅仅是修复错误，更是为软件系统的长期成功进行战略规划。软件可维护性受多种因素影响，预测它的方法有很多，如指标提取、测试覆盖率、软件复杂度度量、机器学习\
  \ (`ML`) 模型、反检测模式和自然语言处理等。由于可维护性是一个复杂概念，有效预测它需要对广泛的软件属性和开发技术有透彻的理解。我们提出了基于特征选择-排序的可优化支持向量机\
  \ (`SVMs`)，并将其与特征选择排序算法结合应用。我们的方案在验证准确率方面表现更好，达到 87.9%。\n\n**关键词：** 支持向量机，可维护性，最小冗余-最大相关性，卡方检验\n\
  \n### 1. Introduction\n\n\n\n\n\n随着时间的推移，软件系统能够非常轻松高效地解决日常事件，它们变得越来越庞大和复杂。维护如此复杂的系统对软件专业人员来说变得越来越困难。由于维持现有系统占用了软件公司大部分资源，一些公司可能无法启动新项目。因此，在软件开发过程的早期，在设计阶段，软件可维护性预测\
  \ `SMP` 将重点放在创建和开发用于预测软件可维护性的预测模型上 \\[1\\]。提前选择更重要的参数可以提高 `SMP` 模型的预测准确性 \\[2\\\
  ]。高维记录中存在重复特征可能会对预测可维护性造成问题，因为这可能导致机器学习 `ML` 算法表现不佳。特征选择 `FS` 技术有效地克服了这一差距 \\[6,\
  \ 7\\]。这提供了在预算范围内按时交付的优秀软件产品，且可维护性非常高。本研究在学习 `SMP` 模型之前使用了一系列数据特征排序算法，以提高和有效性能，解决了参数选择在\
  \ `SMP` 中的重要性。本研究发现面向对象 `OO` 指标与软件可维护性之间存在强相关性，这些指标描述了程序的各个方面，包括继承、耦合和内聚。这使得研究变得重要，因为它通过确定影响软件可维护性甚于其他特性的特征来解决高效\
  \ `SMP` 模型的创建问题。通过适当的方式将资源分配给这些类，有助于提高软件产品的质量。我们的提案有助于：\n* 确定软件系统可维护性的根本点。\n* 评估并统计验证所创建的\
  \ `SMP` 模型的预测能力。\n* 评估多种基于特征选择的排序策略与支持向量机 `SVMs`。\n\n为了满足上述研究目标，我们创建了使用软件可维护性作为响应变量和\
  \ `OO` 指标作为预测变量的 `SMP` 模型。取自开源软件的五个数据集。我们借助特征选择算法选择的顶级关键参数来预测可维护性。然后使用混淆矩阵和接收器操作特征\
  \ `ROC` 曲线评估 `SMP` 模型。\n\n## 2. 相关工作\n\n2014 年，Wong 等人，\\[10\\] 提出了一种基于自动学习的 methodology，该方法使用实际平均维护工作量来训练可维护性预测器。Kumar\
  \ 等人于 2017 年讨论了各种维度中各种重要的特征选择相关性。这些数学函数有助于找到准确的 `SMP` 模型。Kumar 等人，\\[7\\] 提出了用于变更值预测的混合技术。2017\
  \ 年，Reddy 等人，\\[5\\] 使用了基于支持向量的回归、多层感知器、多线性回归和 `M5P` 回归树。Malhotra 等人，\\[8\\] 于 2020\
  \ 年提出了基于类相关组的维护性。数据采样和重采样是主要基础，用于更好的预测 \\[9\\]。此外，为处理不平衡数据集和预测软件可维护性，使用了安全水平——合成少数类过采样技术。2020\
  \ 年，Gupta 等人，\\[3\\] 提出了一个使用最小二乘的模型，并展示了它们的相关比较以获得更好的结果。他们还在 2020 年提出了增强随机森林方法 \\\
  [4\\] 来估计开源软件的可维护性。\n\n## 3. 研究方法\n\n识别参数是实现一致长期可维护性的非常重要的任务，其后是规范化。`SVM` 的优化方法在此发挥了重要作用。这里使用以下\
  \ Figure 24.1 显示了 `SVM` 的优化方法。\n\n![Figure 24.1 Optimization approach of SVM for\
  \ SMP.](img/fig24_1_C.jpg)\n\nFigure 24.1 Optimization approach of SVM for SMP.\n\
  \n针对 `SMP` 提出的分层步骤涉及参数识别、数据集规范化、涉及优化方法、训练、测试和比较分析，如 Figure 24.2 所示。它代表了本研究中用于分析\
  \ `SMP` 模型的 methodology。\n\n![Figure 24.2 Diagram of research methodology.](img/fig24_2_C.jpg)\n\
  \nFigure 24.2 Diagram of research methodology.\n\n### 3.1 数据集\n\n我们使用了以下基于 Java\
  \ 编程的数据集：\n* Ant: Ant 是一种命令行工具，用于自动化构建文件中表示的扩展点和目标中的任务。Ant 包含用于构建、测试、编译和运行 Java\
  \ 程序的多个任务。\n* Camel: 以企业集成模式为核心构建。Camel 是一个开源网络框架。\n* Ckjmml: 软件 ckjm 通过检查字节码和编译的\
  \ Java 程序来生成面向对象的指标，如 Chidamber 和 Kemerer。\n* Ivy: Ivy 是一个用于控制项目依赖关系（记录、监控、解析和汇总）的系统。\n\
  \n### 3.2 预测变量\n\n由于研究是针对用 Java 开发的 `OO` 系统进行的，我们在预测模型中使用 `OO` 指标作为预测变量。我们列出了源代码行数\
  \ `LOC`、类响应 `RFC`、继承树深度 `DIT`、每个类的加权方法数 `WMC`、聚合度量 `MOA`、类的子节点数 `NOC`、对象间耦合 `CBO`、继承耦合\
  \ `IC`、数据访问度量 `DAM`、功能抽象度量 `MFA`、公共方法数 `NPM`、外向耦合 `Ce`、内向耦合 `Ca`、类方法间耦合 `CBM`、平均方法复杂度\
  \ `AMC`、类方法间的内聚 `CAM`，以及 `LCOM3` 作为输入变量。`LCOM` 的变体称为 `LCOM3`（Table 24.1）。\n\nTable\
  \ 24.1 Description of predictors\n\n| Metric suit || Set of metric selected |\n\
  | --- | --- |\n| CKJM suit \\[11\\] || `CBO`, `NPM`, `RFC`, `LCOM`, `DIT`, `WMC`\
  \ |\n| --- | --- |\n| QMOOD suit \\[12\\] || `NPM`, `DAM`, `MOA`, `CAM`, `MFA` |\n\
  | Martins's metrics \\[13\\] || `Ca`, `Ce` |\n| Henderson-Sellers \\[14\\] || `LOC`,\
  \ `LCOM3`, `AMC`, `IC`, `CBM` |\n\n这些指标解释了 `OO` 系统的众多方面，包括耦合、内聚、大小、继承、组合和封装。`WMC`、`NPM`、`LOC`、`DAM`\
  \ 和 `AMC` 的指标都显示了类的大小。`IC`、`CBM`、`RFC`、`Ca`、`Ce` 和 `CBO` 度量用于量化耦合。`NOC`、`DIT` 和\
  \ `MFC` 用于识别继承的属性。类内聚指标包括 `LCOM`、`CAM` 和 `LCOM3`，而组合则由 `MOA` 衡量。这些选定的指标已在预测建模中进行了广泛研究。\n\
  \n### 3.3 响应变量\n\n我们的工作使用圈复杂度来确定可维护性，因为研究中使用圈复杂度来形成因变量，即每个软件类的可维护性值 `MV`。高和低分别代表最大和低可维护性。在圈复杂度中则相反。可维护性高意味着类的圈复杂度小于\
  \ 1，而可维护性低则指类的圈复杂度大于或等于 1。确定因变量所实现的逻辑如下。\n\n```\nif (CC<=1)\n{\nMV = 1;\n}\nElse\n\
  {\nMV = 0;\n}\n```\n\n\n\n\n\n在上述逻辑中，`CC` 表示圈复杂度，`MV` 表示可维护性指标。\n\n### 3.4 参数识别\n\
  \n由于并非每个指标值都有助于确定可维护性，因此采用两种方法对所有预测因子质量进行排序。特征选择函数选择可用组件的一个子集，而不是全部使用。特征选择实践有多个好处。除其他优点外，特征选择通过降低噪声来提高预测模型的分类准确性。甚至更易理解的特征也可用于识别和监控不同函数类型。\n\
  \n#### 3.4.1 mRMR\n\n一种称为 `mRMR` 的特征选择技术优先考虑彼此相关性差但与类（产品）相关性良好的属性。`mRMR` 背后的初始思想是，具有\
  \ *m* 个特征 *Xi* 的输出（特征集 *S*）与类 *C* 高度相关，需要进行分析。为了获得最大相关性，使用每个特征 *Xi* 与类 *C* 的相关性的平均值。随机生成变量\
  \ *X* 和 *Y* 之间的互信息在技术上可表示如下：\n\n(1)\n\n*M**I*(*X*, *Y*) = *x* ∈ *X* *y* ∈ *Y*, *p*(*x*, *y*)log *p*(*x*, *y*)*p*(*x*)*p*(*y*)\n\
  \n*S* 中变量相对于 *C* 的全局相关性度量为：\n\n(2)\n\n*V**I*(*S*)=1|*S*|*X**i*∈*S**M**I*(*C*,*X**i*)\n\
  \n这里 *MI* (*C*, *Xi*) 表示特征 *Xi* 与类 *C* 的互信息。`mRMR` 的第二个原则是，最小化属性间的重复使用应支持特征相对于分类器的最高相关性标准。如果仅提供相关信息，则在多媒体工具和应用程序中增强特征之间的依赖性是可能的。因此，必须添加最少的重复而不损害其有用性。使用以下公式获得最少的冗余特征：\n\
  \n(3)\n\n*W**I*(*S*)=1|*S*|2*X**i*,*X**j*∈*S**M**I*(*X*[*i*],*X*[*j*])\n\n这里，*MI*\
  \ (*Xi*, *Xj*) 是特征 *Xi* 与 *Xj* 的互信息。最小冗余最大相关性是结合上述两个条件的标准（`mRMR`）。为了获得合适的特征子集，最简单的方法是优化相关性和重复性，即：\n\
  \n(4)\n\nmax *ϕ*(*V**I*(*S*), *W**I*(*S*))\n\n#### 3.4.2 使用卡方检验的单变量特征排序\n\n卡方检验可用于检验两个事件的独立性\
  \ \\[7\\]，其中属性根据卡方统计量的类特定值进行优先排序。卡方值使用以下方程确定：\n\n(5)\n\n$$\\\\chi^{2} = {\\\\sum\\\
  \\frac{\\\\left( {O\\_{i} - E\\_{i}} \\\\right)^{2}}{E\\_{i}}}$$\n\n其中\n\n> *O[i]*\
  \ = 观察值，\n\n> \n\n> *E[i]* = 预期值。\n\nχ² 的高值表明原假设被否定。\n\n### 3.5 优化的 SVM\n\n相对于经典方法，更倾向于机器学习算法有效地调整学习参数，例如模型超参数。一种称为贝叶斯调优的超参数优化技术源自常见的机器学习技术，并确定模型的属性，或更准确地说，训练过程。创建一个目标的替代品，并尝试使用基于贝叶斯的技术来衡量该替代品中的不确定性。我们还使用高斯过程回归进行了分析。该参数优化过程同时使用高斯过程和贝叶斯概率理论。每个贝叶斯优化周期都需要选择一个最佳观测值。以下公式解释了这一点：\n\
  \n(6)\n\n*f*(*x*) ∼ *G**P*(*μ*(*x*),*k*(*x*,*x*^(\\*)))\n\n均值函数为 µ(*x*)，而核函数为 *k*(*x*,\
  \ *x*\\*)，高斯核函数形式如方程 (7) 所示。\n\n(7)\n\n$$k\\\\left( {x,x^{\\*}} \\\\right) = \\\\\
  exp\\\\left( {- \\\\frac{1}{2}\\\\left\\\\| {x - x^{\\*}} \\\\right\\\\|^{2}} \\\
  \\right)$$\n\n贝叶斯优化方法使用该过程获得的超参数值来替换当前值，以便有效生成新的模型。在本研究中，我们在 MATLAB 上执行了这项工作。\n\n\
  ## 4. 性能评估\n\n对于性能度量 ROC 曲线、曲线下面积（AUC）、混淆矩阵、RMSE、R²、MSE 和 MAE 在我们的研究中被使用。\n\n* \
  \  ROC 曲线是用于将分类为真和假的图形表示。ROC 提取软件系统的高或低可维护性。AUC 量化模型在不同阈值设置下区分高类和低类的能力。\n*   混淆矩阵处理实例作为高或低可维护性正确或错误预测的情况。\n\
  *   均方根误差（RMSE）是比较模型或预测器预测值与实际值的一种流行统计量。\n*   回归线的均方误差（MSE）表明其与一系列解的接近程度。它通过对点与回归线之间的距离进行平方来实现。平方是消除任何负信号所必需的。\n\
  *   均绝对误差（MAE）是描述相同现象的一对观测值之间误差的度量。\n\n## 5. 实验结果与讨论\n\n在对归一化数据集运行 `mRMR` 和卡方检验后，我们为每个特征获得了不同的排名。这些结果为建议的机器学习分类模型的进一步训练奠定了基础。Table\
