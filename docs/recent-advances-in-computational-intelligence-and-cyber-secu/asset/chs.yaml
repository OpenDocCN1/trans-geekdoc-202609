  %) = \\frac{\\left( {A - A_{1}} \\right) \\times 100}{A_{1}}\n$$\n\n### 2.6 软件开发\n\
  \n使用上述方法在 `Matlab®` 编程语言中开发了基于数字图像处理的计算机软件，并利用了非常强大的图像处理工具箱。它具有用户友好的功能，可提供图像分辨率作为输入，芒果种植者和研究人员使用起来非常容易。该程序正在使用更多案例进行验证和测试。\n\
  \n## 3. 结果与讨论\n\n### 3.1 获取清晰图像\n\n适当的照明是任何图像处理程序中最重要的一部分 [24]。获取高质量图像对于通过图像分析进行定量测量以及定性解释至关重要\
  \ [25]。受芒果不同叶斑病损害的叶片图像如图 Figure 33.1 所示。\n\n### 3.2 叶斑量化\n\n\n\n\n\n该软件使用 `Matlab`\
  \ 开发，采用形态学图像处理。可以看出，一般情况下病害造成的叶片受损区域的清晰度并不十分均匀/平滑，这可能会影响受损面积测量的准确性。因此，对软件进行了改进以提高受损区域的清晰度。\n\
  \n为测试目的，从芒果树 cv. Dashehari 的四面随机选取了 12 片受炭疽病、细菌性叶枯病、瘤病、红锈病、壳针孢叶枯病等影响的病叶。此后叶片被扫描并转换为\
  \ `tiff` 格式的数字图像，分辨率为 `300 dpi`。\n\n(2)\n\n$$RMSE = \\\\sqrt{\\\\frac{\\\\sum\\\\\
  limits\\_{i = 1}^{n}\\\\left( {x\\_{i} - y\\_{i}} \\\\right)^{2}}{n}}$$\n\n病叶由人工评定者/专家（植物病理学家）进行分级。然后将这些叶片应用于软件以找出\
  \ LS 病害造成的叶片受损程度。数据通过计算均方根误差（`RMSE`）来分析准确性，如“Eq. (1)”所示。准确性评估使用 Eq. (2) 计算 `RMSE`。其中，`x[i]`\
  \ 和 `y[i]` 分别为第 i^(th) 次评估的实测和计算的叶面积，`n` 为样本数。\n\n将结果进行比较以确定软件输出相对于人工评定者的准确程度。结果显示均方根误差（`RMSE`）值为\
  \ `0.054`。\n\n`RMSE` 值表明专家人工评定者评估的叶部受损与软件评估的结果之间存在相当好的吻合度。此外众所周知，人类评定者可能会受到环境、情绪、身体等各种条件的影响。因此，在这种情况下，可能无法始终获得相同的准确性。因此可以得出结论，软件评估的受损程度通常可能更一致。它可以补充专家，但不能取代专家。当使用数字叶图像在\
  \ Figure 33.1 中执行软件时，软件生成的结果显示在 Figure 33.5 中。\n\n![Figure 33.5: Chart showing the\
  \ comparison between the ratings of mango foliar damage caused by leaf spot diseases\
  \ by human expert vs. software.](img/fig33_5_C.jpg)\n\nFigure 33.5: Chart showing\
  \ the comparison between the ratings of mango foliar damage caused by leaf spot\
  \ diseases by human expert vs. software.\n\n### 3.3 Accuracy of foliar damage assessment\
  \ by software\n\n所提出的软件在病害检测方面达到了很高的准确性，在测试数据集上评估的 `RMSE` 值为 `0.054`。结果显示 `RMSE`\
  \ 值表明专家人工评定者评估的叶部受损与专家人工评定者评估的叶部受损之间存在相当好的吻合度。\n\n### 3.4 Speed and efficiency\n\
  \n软件快速处理图像，每张图像的平均处理时间不到 `4` 秒。这种快速分析使得能够及时评估大面积芒果园中的病害严重程度。\n\n## 4. Conclusions\n\
  \n在本工作中，我们提供了一种自动化的软件方法，使用数字图像分析快速、准确地评估由叶斑病引起的芒果叶部受损。利用开发的软件，可以以很高的准确性和效率量化芒果叶斑病严重程度。由于其快速性和在确定严重程度方面的优越准确性，它对研究人员和芒果种植者很有用。该程序通过提供有关病害严重程度的即时信息，可以帮助及早发现和治疗叶斑病感染，最终提高芒果作物产量。所开发的技术是可持续农业的重要工具，能够实时监测芒果农场的叶部病害。它还为未来利用物联网和遥感技术增强病害检测和治疗的研究奠定了基础。\n\
