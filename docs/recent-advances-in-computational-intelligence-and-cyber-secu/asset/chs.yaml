  times (Tr - Tj)/mjCpj - Td\\\\\\_ dot} \\\\\\\\ {F = \\\\left( {UA \\\\times (Tr\
  \ - Tj)/mjCpj - Td\\\\\\_ dot} \\\\right) \\\\times mjCpj/Cpc \\\\times (Tj - Tc)}\
  \ \\\\\\\\ \\\\end{array}$$\n\n滑动面模式控制律为\n\n(5)\n\n*u* = *u*[equi ] + *u*[dicontinuous ]\n\
  \n这里 *F* = *u[equi]*\n\n根据经典的 `SMC`，不连续控制为\n\n*u*[dicon ] =  − *k**s**g**n*(*s*)\n\
  \n*k* 是调参参数\n\n因此 `SMC` 的控制律为\n\n(6)\n\n*u* = (−*k**s**i**g**n*(*s*)+*U**A*×(*T**r*−*T**j*)/*m**j**C**p**j*−*T**d*[−]*d**o**t*) × *m**j**C**p**j*/*C**p**c* × (*T**j* − *T**c*)\n\
  \n### 3.1. 滑动面的稳定性\n\n为了收敛到平衡点，必须保证滑动面的稳定性。\n\n定理：对于方程给出的间歇反应器，控制律由 (6) 给出，可在扰动和不确定性存在的情况下保持反应器的期望温度。\n\
  \n证明：滑动面的稳定性使用直接 Lyapunov 函数证明，该函数为\n\n(7)\n\n$$V = \\\\frac{1}{2}s^{2}.$$\n\n根据\
  \ Lyapunov 稳定性定理，(7) 的一阶导数为\n\n(8)\n\n$$\\\\overset{˙}{V} = s\\\\overset{˙}{s} \\\
