  \nPratibha Sharma^([³⁷)]\n\n#### 摘要\n\n面部表情是个体情绪状态最可靠的指标。根据文献，过去已开发出众多面部表情识别技术。这些技术可实现基础、微表情和三维\
  \ 3D 表情的识别。虽然也已呈现了这些技术的若干综述，但其中没有一篇对基于基础、微表情和 3D 表情的面部表情识别技术进行全面分析。它们仅集中于其中一个领域。因此，本文对基础、微表情和\
  \ 3D 面部表情识别技术进行了简要概述。本综述的另一优势在于，我们对每种类型的现有数据集进行了简要说明。这些数据集已在各自的标题下提供，以便读者对这三个特定领域的技术以及数据集有清晰的认识。本综述同时考虑了机器学习\
  \ ML 以及深度学习。此外，仅考虑了最近的技术。\n\n**关键词：** 表情识别，面部特征，基础表情，3D 表情，微表情\n\n## 1. 引言\n\n在交流中，面部表情揭示了一个人的情绪状态。它们是表达情绪和描述一个人情绪行为的便捷方法\
  \ [1, 2]。面部表情识别 FER 在各个领域具有众多潜在应用。它不仅用于人机交互，还用于安全监控、生物力学应用、体育、游戏、教育、培训等。FER 通常包括三个步骤：面部特征的检测、提取和分类。\
  \ Figure 37.1 描绘了面部表情识别系统的总体架构。\n\n![Figure 37.1: General architecture of FER.](img/fig37_1_B.jpg)\n\
  \nFigure 37.1: General architecture of FER.\n\nFER 研究一直备受关注。已提出了多种机器学习 ML 方法，例如\
  \ Gabor 滤波器、主动外观模型、主动形状模型、局部二值模式 LBP、方向梯度直方图 HOG、主成分分析 PCA 等。\n\n与标准 ML 算法不同，深度学习方法无需人工干预即可提取面部特征。深度网络基于样本数据以独立方式对基本属性进行分类。多篇文章表明，深度学习系统在提取特征方面比传统\
  \ ML 方法更有效 [3]。\n\n在此背景下，本研究旨在以文献综述的形式回顾迄今为止取得的技术进展。本综述的主要贡献为：\n\n* 本文对与基础、微表情和\
  \ 3D 面部表情识别相关的技术进行了简要综述。\n* 我们同时考虑了 ML 和深度学习，这两者均存在于三种面部表情识别类型中。\n* 我们对基础、微表情和 3D\
  \ 表情数据集进行了简要说明。\n* 我们仅考虑了最近的技术，而非早于 2015 年的技术。\n\n剩余文章结构如下：Section 2 说明基础、微表情和 3D\
  \ FER 数据集，section 3 展示 FER 文献中的技术进展，section 4 为本研究的结论部分。\n\n## 2. FER 数据集\n\n本节对基础、微表情和\
  \ 3D FER 数据集进行了简要描述并附带示例图像。\n\n### 2.1. 基础 FER 数据集\n\n所有基础 FER 数据集均包含 6+1 种情绪：愤怒、厌恶、恐惧、快乐、悲伤、惊讶和中性。\n\
  \n1. **日本女性面部表情 JAFFE 数据集 [4]。** 该数据集中有 213 张 60 名日本参与者的灰度图片。每张图像大小为 256×256 像素。\
