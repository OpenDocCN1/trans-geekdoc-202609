  \ 118–122.\n\n# 13 人工智能应用在肾脏疾病诊断中的作用：系统综述\n\nAshish Nigam^(¹³)\n\n#### 摘要\n\n\n\n\
  \n\n全球范围内，对准确疾病诊断存在显著未满足的需求。患者群体疾病过程和潜在症状的复杂性在建立早期诊断工具和成功治疗方面造成了巨大障碍。机器学习（ML）作为人工智能（AI）的一个子领域，帮助研究人员、临床医生和患者克服其中一些问题。在这些系统综述中，AI\
  \ 的能力，包括 ML 方法，已被用于预测、诊断和治疗终末期肾病（EKD）。在此综述工作中纳入了通过 PubMed 检索的文章。因此，由于仅包含一个数据库，该研究被表征为“快速综述”。最普遍的目标是准确预测\
  \ EKD 诊断。本研究基本上包含算法泛化性，并且在不同人群的数据集上进行测试的情况很少被考虑。\n\n**关键词：** 肾脏疾病，人工智能，肾病（EKD），机器学习\n\
  \n## 1. 引言\n\n肾脏疾病，有时也称为肾病或肾脏病，是影响肾脏组成和运作的广泛疾病类别。肾脏过滤血液、排出废物并调节电解质平衡，这些都是维持身体内部环境的重要功能。许多情况，如感染、自身免疫性疾病、遗传和环境因素，都可能导致肾脏问题。普遍而言，终末期肾病（EKD）的病因与其他疾病症状不同。糖尿病、高血压和原发性肾小球肾炎是最常见的导致慢性肾病（CKD）并最终导致肾衰竭的主要疾病，占所有主要病因的\
  \ 70–90% [1, 2, 3, 4 and 5]。尽管这三个原因位居 EKD 病因榜首，但其他因素（如污染、感染和自身免疫性疾病）也在 CKD 病理生理中发挥作用\
  \ [6, 7, 8, 9 and 10]。同样，多种风险变量（例如年龄、性别、种族）和可改变的风险因素（例如收缩压和舒张压、蛋白尿）在 CKD 发展中发挥作用\
  \ [1, 2, 3 and 4]。肾脏作为过滤器，清除血液中的废物。它们还控制体液、矿物质和血压 [5]。肾脏产生激素，这些激素对于红细胞生成和骨骼健康是必需的。肾功能障碍也可能影响心脏和血管。影像学检查以及血液和尿液样本可用于评估肾功能。肾脏疾病的评估包括确定潜在病因以及将其分类为决定疾病如何处理的阶段\
  \ [10]。\n\n### 1.1. 肾脏疾病的类型\n\n终末期肾病 – 根据国家糖尿病、消化和肾脏疾病研究所，“意味着你的肾脏受损，无法像应有的那样过滤血液”。最常见的肾脏疾病类型是慢性肾病，这是一种进行性肾脏疾病，会随着时间推移而恶化。除了慢性肾病之外，还有多种肾脏疾病，其性质可能是慢性或急性。\n\
  \n1. **肾小球肾炎：** 这种肾脏疾病发生时，肾小球，即清除身体废物的微小过滤器，发生炎症或受损，停止正常工作。\n2. **免疫相关疾病：** 由自身免疫性疾病引起的肾脏疾病。自身免疫性疾病，如狼疮和类风湿性关节炎，发生时免疫系统攻击自身细胞。\n\
  3. **多囊肾病：** 这种遗传性疾病导致充满液体的囊肿在整个肾脏中形成，导致器官过度增大并丧失功能。多囊肾病是一种遗传性疾病，导致肾脏中形成充满液体的囊肿，损害其功能。它可能在成年期出现，导致高血压、腹部不适和肾脏增大。治疗重点在于症状管理和并发症，可能包括血压控制以及在严重情况下的透析或移植。\n\
  4. **肾癌：** 与身体任何其他器官一样，肾细胞的基因异常可导致恶性肿瘤。肾癌是美国十大癌症之一。肾癌，也称为肾脏癌，发生在肾脏中，肾脏是过滤血液和排出废物的重要器官。\n\
  \n最常见的类型是肾细胞癌。症状可能包括尿血、慢性疼痛和不明原因体重减轻。治疗范围从手术到靶向治疗，早发现可改善结果。对晚期病例的新疗法研究仍在继续，凸显了定期检查和提高认识的重要性。\n\
  \n除此之外，还存在多种罕见肾脏疾病，如 Alport 综合征、Goodpasture 综合征、Wegener 肉芽肿病等，这些疾病在人群中很少发现，但这些疾病非常关键且难以处理。如果你有患此病的风险或怀疑自己可能有症状，寻求医疗帮助至关重要。早期干预可以帮助延缓疾病进展并在更长时间内保持你的肾功能。\n\
  \n## 2. 背景\n\n肾脏疾病，特别是 CKD 和急性肾损伤（AKI），对全球健康有重大影响。这些疾病变得越来越普遍，这是由于人口老龄化、生活方式变化以及糖尿病和高血压等疾病患病率上升所致。肾脏疾病的传统诊断方法包括临床检查、实验室检查和医学影像。然而，这些程序可能耗时、昂贵且易受主观解释影响。早期和正确的诊断对于肾脏疾病的成功管理和治疗至关重要。人工智能（AI）应用在医学影像数据处理方面显示出特别有前景的结果，例如计算机断层扫描（CT）扫描、磁共振成像（MRI）和肾脏超声图像。机器学习（ML）算法可以训练以识别这些图像中的模式和异常，从而实现肾脏疾病的早期检测。AI\
  \ 系统也可用于预测分析，使医疗服务提供者能够预见个体患者的肾脏疾病可能性。这可以带来更有效的个性化治疗策略和干预措施，以预防或管理肾脏疾病。将 AI 技术与电子健康记录集成可实现对患者数据的全面研究。\n\
  \n总体而言，各种研究通过展示特定疾病数据集在某些特殊情况下获得的结果和准确性来显示其重要性，但当我们尝试将先前开发的模型应用于其他数据集和环境时，在这种情况下似乎非常无效，在本研究中我们试图找出此类研究空白，这些空白是已开发模型在全球范围内被采用的主要因素。只有\
  \ 2015 年 1 月 1 日至 2022 年 12 月 30 日期间发表的同行评审文章才被纳入本次评估，预印本被排除。通过筛选标题，仅选择了用于肾脏疾病检测的智能决策文章。\n\
  \n### 2.1. 动机\n\n\n\n\n\n回顾文献使我们能够识别现有知识库中的空白。我们可以识别出需要解决的问题或需要额外发展的领域。集中关注这些未探索的地方可能有助于指导我们自己的研究。它有助于比较和基准测试各种肾脏疾病检测方法和程序。这可能有助于我们确定哪些程序更有效、更精确或更适合特定目的。了解文献可以帮助选择最佳的智能计算解决方案用于心律失常识别。人工智能提供了改善诊断能力的机会，这可能导致更好的患者预后、降低医疗费用以及肾脏疾病治疗的改善。\n\
  \n### 2.2. 文献检索方案\n\n本综述采用了多个学术研究数据库来收集 2015 年 1 月至 2022 年 12 月期间发表的相关论文。这些公开可访问的数据库包括\
  \ PubMed、IEEE Xplore、Springer、ScienceDirect 和 ResearchGate。值得注意的是，IEEE Xplore 和\
  \ PubMed 分别是工程和生物科学领域的知名数据库 \\[7\\] (Table 13.1)。\n\nTable 13.1: Inclusion criteria\
  \ for literature search\n\n| Parameters || Description |\n| --- | --- |\n| Duration\
