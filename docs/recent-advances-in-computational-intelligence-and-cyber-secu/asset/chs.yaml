  \ of Electronics Engineering, VBS Purvanchal University, Jaunpur, U.P., India\n\n\
  ### Abstract\n\n本研究采用基于索引调制（IM）的光正交频分复用（O-OFDM）方案，在各种光纤非线性条件下提升平均误码率（BER）和频谱效率（SE）性能。在所提系统中，信息通过激活的子载波以及激活子载波的索引来承载，二者动态提升了在平均误码率（BER）方面的传输符号速率。与标准光-OFDM\
  \ 系统相比，当光纤非线性是显著因素时，通过改变光-OFDM 中 IM 的激活子载波数量，系统可提供增强的平均 BER 性能。仿真结果表明，在频谱效率值相同时，所提光-OFDM\
  \ with IM 系统的 BER 性能优于传统光-OFDM 系统。此外，采用 2-PSK、4-PSK 和 16-QAM 调制方案时，光-OFDM with IM\
  \ 系统的频谱效率优于传统光-OFDM 系统所能达到的频谱效率。\n\n**关键词：** Optical-OFDM, index-modulation, average\
  \ bit-error rate, spectral efficiency, active sub-carrier\n\n### 1. Introduction\n\
  \n光通信是射频（RF）通信的有力补充，尤其适用于无线光纤（RoF）等长距离传输。RoF 技术因其高带宽、覆盖范围广和基站简化等优势，已成为未来宽带无线接入网络的关键解决方案\
  \ [1]。此外，随着 5G 网络部署规模的扩大和工业互联网的创新发展，光网络正朝着更高速度、更大容量和更远覆盖演进 [2]。在当今环境下，相干光通信系统在通信领域发挥着关键作用，有助于提升频谱效率和容量\
  \ [3]。例如，相干光正交频分复用（CO-OFDM）具有补偿光信道效应简便和高频谱效率等独特优势。因此，CO-OFDM 系统已被提出作为长距离传输的可行解决方案\
  \ [4]。\n\n在 5G 及以后，特别是 6G 发展的背景下，业界已开展大量研究以确定通信最合适的波形。诸如基于滤波器的多载波（FBMC）[5]、窗函数 OFDM（W-OFDM）[6]、滤波\
  \ OFDM（F-OFDM）[7]和广义频分复用（GFDM）[8]等多种调制技术已被提出，以实现高频谱效率和低功耗。其中，正交频分复用（OFDM）已在 4G、5G\
  \ 和 Wi-Fi 等现代通信系统中得到广泛应用。OFDM 具有硬件实现高效和接收端单抽头均衡简单等显著优势。此外，OFDM 在无线和光通信系统中均得到广泛应用。\n\
  \n索引调制（IM）是一种源自空间调制概念的技术，通过相较于传统调制技术实现额外比特的传输，从而实现更优的频谱效率 [9]。IM 已在多种通信系统中得到广泛探索，包括多载波系统\
  \ [9]、MIMO 系统 [10]、分子通信 [11]、毫米波传输 [12]和可见光通信 [13]。\n\n最初由 Basar 等人提出，OFDM 索引调制（OFDM-IM）方案是一种开创性方法\
  \ [9]。OFDM-IM 不仅引入了与传统 OFDM 相比传递信息的新方法，还在频谱和能量效率方面具有独特优势 [14]。在 OFDM-IM 中，信息传输不仅通过用于承载星座符号的激活子载波进行，还通过这些激活子载波的索引进行，用于额外二进制信息的传输。因此，OFDM-IM\
  \ 在频谱效率和系统性能之间提供了一种灵活的权衡，可通过改变激活子载波的数量进行调整 [9]。\n\n在长距离链路中，需要更高的发射功率水平以延长传输距离。然而，长距离相干光\
  \ OFDM（CO-OFDM）在较高输入功率水平下会因光纤非线性产生显著失真，导致性能下降 [15]。为了利用 OFDM-IM 相对于传统 OFDM 的优势并提升频谱效率，可将\
  \ OFDM-IM 有效应用于相干光通信系统。\n\n光纤非线性会在 OFDM 中引起子载波间的非线性干扰，主要由相邻子载波引起。因此，本研究旨在在保持相同频谱效率的同时减少激活子载波的数量，以减轻光纤非线性的影响。IM\
  \ 是一种允许在 OFDM 中利用子载波索引传输额外信息比特的技术，在此过程中发挥关键作用。通过利用非激活子载波，IM 被引入以减少非线性干扰子载波的数量，从而在保持相干光\
  \ OFDM 系统相同频谱效率的同时改善误码率（BER）性能。\n\n\n\n\n\n仿真结果令人信服地证明，与传统的相干光 OFDM 相比，所提出的相干光 OFDM-IM\
  \ 可以提高频谱效率并提升 BER 性能，尤其是在考虑光纤非线性效应时。\n\n## 2. 光 OFDM-IM 模型\n\n### 2.1 O-OFDM 索引调制方案：发射机\n\
  \nFigure 27.1 说明了所提出的光-OFDM 索引调制（O-OFDM-IM）长距离光通信系统的框图。在 O-OFDM-IM 系统的发射机中，各种级别的信息位被输入以传输\
  \ OFDM 方案的每个符号。\n\n![Figure 27.1 Block model of optical-OFDM-IM long-haul link.](img/fig27_1_C.jpg)\n\
  \nFigure 27.1 Block model of optical-OFDM-IM long-haul link.\n\n最初，这些输入位被划分为 OFDM\
  \ 子块。如果我们用 `G` 表示 OFDM 子块的总数，每个单独的 OFDM 子块包含长度为 `n` 的子载波，其中 `n` = `N[FFT]` ⁄ `G`。这里，`N[FFT]`\
  \ 表示快速傅里叶变换的大小，并且 `p` (= `p[1]` + `p[2]`) 位被分配给长度为 `n` 的 OFDM 子块。映射过程不仅包括调制符号，还包括子载波索引。`k`\
  \ 个活动子载波的选择是通过基于传入 `p`-位序列的初始 `p[1]` 位的选择过程确定的，从而实现额外信息位的传输。额外信息位的数量可以表示如下：\n\n\
  (1)\n\n`p[1]` = `log2)`,\n\n其中符号 `[.]` 和 `C(.)` 分别表示向下取整运算和组合运算。\n\n对于每个 `g^(th)`\
  \ OFDM 子块，其中 `g` 范围为 1 到 `G`，从初始 `p`-位序列中提取的 `p[2]` 位被分配给 `M`-元信号星座，其中 `M` 为星座大小。此分配用于定义在\
  \ `k` 个活动子载波上传输的数据符号。剩余 `p[2]` 位的计数可以按如下方式计算：\n\n(2)\n\n`p[2]` = `k(log2)`,\n\n\
  该过程涉及将 `p[1]` 位发送到索引选择器，该选择器负责生成指定 `k` 个活动子载波的索引。此索引选择是使用组合方法执行的。组合数系统，次数为 `k`，与\
  \ `k` 个活动子载波索引的集合之间建立了一一映射关系 [9]。对于任意给定的 `n` 和 `k` 的值，范围为 `Z` = [0, `C(n, k)` +\
  \ 1] 的自然数 `Z` 可以由降序序列 `J` 唯一表示，记为 `J` = {`j[k]`, …., `j[1]` }, 其从集合中选择元素的方式如下：\n\
  \n(3)\n\n`Z` = `C(j[k],k)` + … + `C(j[2],2)` + `C(j[1],1)`\n\n其中 `j[k]` > … > `j[1]`\
  \ ≥ 0 且 `j[k]`, …, `j[1]` ∈ {0 , …, `n` - 1} [9]。从输入 `p[1]` 额外信息位得到的 `J` 索引序列可使用算法\
