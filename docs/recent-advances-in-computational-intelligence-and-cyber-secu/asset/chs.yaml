  \ 10.01 GHz (开启) (b) 3.73 GHz (关闭)。\n\n## 4. 结论\n\n本文分析并提出了一种双频可重构槽天线。利用放置在基板底面印刷馈电线中的\
  \ `PIN diode` 作为开关，实现了可重构性。所设计天线在开启和关闭状态下分别在 10.01 GHz 和 3.73 GHz 谐振，最大增益分别为 3.51\
  \ dBi 和 2.1 dBi。对于 WiMAX、C 波段和 X 波段应用，所建议的天线是合适的。\n\n### 参考文献\n\n1. Ali Shah, I.,\
