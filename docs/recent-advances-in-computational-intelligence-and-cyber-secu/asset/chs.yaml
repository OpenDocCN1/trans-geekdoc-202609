  . 拟议架构\n\n物联网架构由各种不同的智能事物组成，这些事物收集、处理、评估并相互交互。物联网网络具有不同级别的隐私和安全性，并且容易受到入侵。物联网包括多种网络类型，如无处不在的、分布式的、网格的和车载的。如\
  \ Figure 23.1 所示，物联网基础设施不仅包括传感器，还嵌入了各种新兴技术。近年来，行业开发了具有嵌入式智能的各种智能产品。\n\n![Figure\
  \ 23.1 IoT architecture.](img/fig23_1_C.jpg)\n\nFigure 23.1 IoT architecture.\n\n\
  主要而言，物联网架构由三个基本层组成，即感知层、网络层和应用层。通常，这种三层架构概述了物联网的基本架构，但不足以满足物联网的深层次和更精细的方面。为解决此问题，我们提出了一种新颖的物联网架构，该架构增加了四个层级并改进了三层架构。\n\
  \n\n\n\n\n因此，物联网的三层架构演变为七层架构，其中环境层负责可观测对象或需要关注事物的真实性，通信层负责物联网设备、网关和云之间数据的安全传输，接下来是服务层，该层监控设备并处理物联网设备生成的数据，最后是应用支持和管理层，该层在维护真实性的同时处理设备和用户的管理。\n\
  \n在对各种可用的物联网架构进行详尽比较后，本文提出的模型如图 Figure 23.2 所示，该模型已纳入物联网架构的所有重要方面。然而，该模型可以进一步探索，我们将在未来的研究中重点介绍。本文在\
  \ Figure 23.2 中提出的七层架构表示物联网架构的更先进的分层版本。\n\n![Figure 23.2 Layers of IoT architecture.](img/fig23_2_C.jpg)\n\
  \nFigure 23.2 Layers of IoT architecture.\n\n各层的简洁且技术性的解释如下：\n\n#### 1\\. Environment\
