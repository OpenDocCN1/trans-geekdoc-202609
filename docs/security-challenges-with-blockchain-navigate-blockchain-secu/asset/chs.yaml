  \n## 3. 公共链中的安全挑战\n\n## 引言\n\n公共链已作为一种突破性技术出现，提供了去中心化、透明且不可篡改的交易记录。然而，这些网络的安全性仍然是一个关键关注的问题。本章将深入探讨公共链面临的挑战，探索各种威胁和安全措施。\n\
  \n## 结构\n\n在本章中，我们将讨论以下内容：\n\n* 公共链概述\n* 公共链中的常见威胁\n* 公共链的安全措施\n* 公共链破解的案例研究\n\n\
  ### 公共链概述\n\n公共链采用加密技术和共识机制（例如工作量证明 `PoW` 或权益量证明 `PoS`）来维护数据完整性和用户身份备验证。尽管其具有固有的安全特性，但公共链仍然容易受到攻击。在本次探索中，我们将讨论安全机制概述以及常见威胁。\n\
  \n### 公共链中的常见威胁\n\n公共链中常见的安全威胁包括 51% 攻击，即恶意攻击者获得了网络超过 50% 的算力控制，使其能够操纵交易。女巫攻击涉及在网络中创建多个节点或账户以破坏其运行。钓鱼攻击和社会工程通过利用人类的脆弱性来欺骗用户暴露敏感信息。最后，智能合约漏洞可能被恶意攻击者利用，导致合约结果被盗取或操纵。\n\
  \n### 公共链的安全措施\n\n为了保护公共链，可以实施多种安全措施。这些包括稳健的共识机制（如委托权益证明 `DPoS` 和拜斯庭容错 `BFT`）、用于识别潜在威胁的网络监控和异常检测、针对智能合约和其他区块链相关软件的安全编码实践，以及通过用户教育来提高对潜在风险和最佳实践的意识。\n\
  \n### 公共链破解的案例研究\n\n著名的公共链泄露事件提供了宝贵的教训。2016 年的 DAO 黑客攻击中，黑客利用智能合约漏洞盗取了价值 5000 万美元的以太坊，凸显了彻底智能合约审计的重要性。2010\
  \ 年的比特币数值溢出事件强调了警惕监控和及时更新的重要性。2016 年的 Bitfinex 黑客攻击导致了 12 万个比特币的损失，强调了在交易所级建立稳健安全措施的必要性。最后，2018\
  \ 年的 Verge 51% 攻击展示了与知名度较低的加密货币相关的风险，以及稳健共识机制的重要性。\n\n![](img/Figure-3.1.jpg)\n\n\
  **图 3.1:** 公共链与私有链的对比（来源 - [`us.norton.com/blog/privacy/blockchain-security`](https://us.norton.com/blog/privacy/blockchain-security))\n\
  \n\n\n\n公有区块链的去中心化特性使其比中心化系统更安全，但也使其容易受到各种类型攻击的影响。例如，`51% 攻击` 是一组矿工控制了网络 50% 以上计算算力的攻击类型，它可以被用来控制区块链网络并操纵交易。公有区块链易受的其他攻击类型还包括女巫攻击、DDoS\
  \ 攻击和矿池攻击。\n\n为了确保公有区块链的安全性，组织和个人需要实施各种安全措施和最佳实践。这些包括：\n\n*   `使用安全钱包`：钱包是一种用于存储加密货币的数字存储设备。使用设计用于防止黑客攻击、恶意软件和网络钓鱼攻击的安全钱包至关重要。\n\
  *   `使用双重身份验证`：双重身份验证是一种要求用户在访问账户时提供两种形式身份识别的安全措施。使用双重身份验证对于防止区块链网络受到未经授权的访问至关重要。\n\
  *   `使用强密码`：强密码对于防止暴力破解至关重要。强密码至少应有 12 位长度，并包含大写字母、小写字母、数字和特殊字符。\n*   `使用多重签名交易`：多重签名交易要求多方在执行交易前对其进行签名。这种安全措施有助于防止未经授权的交易。\n\
  *   `定期更新软件`：定期更新用于访问区块链网络的软件至关重要。这些更新通常包含解决已知漏洞的安全补丁。\n*   `定期进行安全审计`：定期的安全审计可以帮助识别区块链网络中的安全漏洞和弱点。这些审计可以帮助组织和个人采取主动措施，防止网络攻击和数据泄露。\n\
  *   `实施加密`：加密是一种帮助保护数据免受未经授权访问的安全措施。对区块链网络上的所有交易和存储的数据实施加密至关重要。\n*   `使用去中心化交易所`：去中心化交易所设计用于在公有区块链上运行，并提供增强的安全功能，如多重签名交易和非托管交易。\n\
  \n公有区块链安全面临的挑战之一是并非所有区块链都一样。某些区块链（如 `Bitcoin` 和 `Ethereum`）由于其庞大且化的节点和矿工网络，具有高水平的安全性。然而，其他区块链由于网络较小或中心化，安全性可能较低，这使其更容易受到攻击。因此，对去中心化区块链进行定期安全审计非常重要，特别是对于那些新的或不太成熟的区块链。安全审计可以帮助评估区块链网络的安全水平和性能，并识别和解决任何潜在问题或风险。安全审计还可以帮助验证运行在区块链网络上的智能合约和协议的合规性和有效性。通过定期进行安全审计，组织和个人可以确保其去中心化区块链的安全可靠性。\n\
  \n对于使用公有区块链进行交易的组织和个人来说，公有区块链安全是一个关键关注的问题。公有区块链的开放性质使其受到各种攻击，包括 51% 攻击、女巫攻击和 DDoS\
  \ 攻击。为了确保公有区块链的安全性，组织和个人需要实施各种安全措施和最佳实践，包括使用安全钱包、双重身份验证、多重签名交易、定期软件更新、安全审计、加密和去中心化交易所。通过遵循这些最佳实践，组织和个人可以保护自己免受网络攻击和数据泄露，并确保其在公有区块链上交易的安全。\n\
  \n# 公有区块链常见的安全威胁\n\n公有区块链是去中心化网络，允许任何人在限制地参与网络并进行交易。虽然公有区块链提供了透明性、不可篡改性和去中心化等许多优势，但它们也容易受到可能损害网络及其用户安全的各种安全威胁的影响。\n\
  \n在本节中，我们将讨论公有区块链中一些常见的安全威胁：\n\n## 51% 攻击\n\n51% 攻击是对区块链网络的一种攻击类型，其中一组矿工或节点控制了网络\
  \ 50% 以上的计算力。通过这种控制，攻击者可以操纵交易、撤销交易，并防止新交易被添加到区块链中。51% 攻击也被称为多数攻击，它在较小的区块链中更为常见，因为在这些区块链中更容易获得多数计算力。\n\
  \n51% 攻击对区块链网络构成了重大的安全威胁，因为它允许攻击者控制网络并破坏其安全性。凭借操纵交易的能力，攻击者可以进行双重花费（double-spend），即两次花费相同的加密货币。在双重花费攻击中，攻击者可以发送交易来购买产品或服务，然后在交易被确认之前迅速撤销，从而让他们保留加密货币并免费获得产品或服务。\n\
  \n51% 攻击还可能导致区块链网络发生分叉（fork），即网络分裂为两个或多个分支，导致共识的丧。分叉可能会在用户之间引起困惑，并给投资者和交易者带来重大的财务损失。\n\
  \n为了防止 51% 攻击，区块链网络可以实施各种安全措施，例如多算法挖矿，这增加了攻击者控制网络的难度。网络还可以实施检查点（checkpoints），即区块链中预设的、网络验证交易的节点，这使得攻击者难以操纵交易。\n\
  \n### 女巫攻击\n\n女巫攻击是一种攻击类型，攻击者创建多个虚假身份或节点来控制网络。通过多个身份，攻击者可以操纵共识机制并控制网络。女巫攻击以书籍 `Sybil`\
  \ 命名，该书讲述了一个拥有多重人格的女性的故事。\n\n在女巫攻击中，攻击者创建多个虚假身份或节点并利用它们来淹没网络。通过控制大量节点，攻击者可以操纵共识机制，即区块链网络用于验证交易和创建新区块的过程。\n\
  \n女巫攻击对区块链网络构成了重大的安全威胁，因为它会损害网络安全用户的隐私。攻击者可以操纵交易并控制网络，这可能导致财务损失和对区块链信任的失去。\n\n为了防止女巫攻击，区块链网络可以实施各种安全措施，例如工作量证明（`proof-of-work`）、权益证明（`proof-of-stake`）或权威证明（`proof-of-authority`）共识机制。这些机制增加了攻击者创建多个身份和控制网络的难度。\n\
  \n## 分布式拒绝服务 (DDoS 攻击)\n\n\n\n\n分布式拒绝服务（DDoS）攻击是一种攻击类型，攻击者通过向网络发送`massive amount\
  \ of traffic`（大量流量）来使系统崩溃，导致合法用户无法访问。DDoS 攻击破坏网络并造成重大的经济损失。\n\n在 DDoS 攻击中，攻击者使用多个设备向网络发送大量流量，使合法用户难以访问网络。DDoS\
  \ 攻击可能导致网络崩溃，从而导致共识丧失和数据丢失。\n\n为了防止 DDoS 攻击，区块链网络可以实施各种安全措施，如防火墙、入侵检测系统和负载均衡器。这些措施可以帮助检测并拦截恶意流量，保护网络免受\
  \ DDoS 攻击的影响。\n\n## 智能合约漏洞\n\n智能合约是运行在区块链上的自动执行程序。智能合约容易受到代码错误的影响，攻击者可以利用这些错误盗取资金或造成其他类型的损害。\n\
  \n智能合约漏洞可能导致用户和投资者遭受巨大的经济损失，并对区块链网络构成重大的安全威胁。智能合约漏洞可能由于代码错误引起，例如缓冲区溢出、整数溢出和逻辑错误。\n\
  \n为了防止智能合约漏洞，区块链网络可以实施各种安全措施，例如形式化验证，这是验证智能合约代码正确性的过程。形式化验证可以帮助检测并消除智能合约中的漏洞，使网络更加安全。\n\
  \n## 钱包漏洞\n\n钱包是存储加密货币的数字存储设备。钱包容易受到黑客攻击、恶意软件和钓鱼攻击。攻击者可以盗取资金或访问存储在钱包中的敏感信息。\n\n\
  钱包漏洞可能导致用户和投资者遭受巨大的经济损失，并对区块链网络构成重大的安全威胁。钱包漏洞可能由于黑客攻击、恶意软件和钓鱼攻击引起。\n\n为了防止钱包漏洞，用户可以实施各种安全措施，例如使用硬件钱包，硬件钱包是存储访问加密货币所需的私钥的物理设备。硬件钱包比软件钱包更安全，因为它们不连接互联网，攻击者难以对其进行破解。\n\
  \n## 社会工程攻击\n\n社会工程攻击是一种攻击类型，攻击者操纵个人泄露敏感信息或执行损害网络安全的行为。这些攻击可被用于获取钱包、私钥和其他敏感信息。\n\
  \n社会工程攻击可能导致用户和投资者遭受巨大的经济损失，并对区块链网络构成重大的安全威胁。社会工程攻击可能由于钓鱼攻击引起，即攻击者向用户发送虚假的电子邮件或消息，要求其提供登录凭据或其他敏感信息。\n\
  \n为了防止社会工程攻击，用户可以实施各种安全措施，例如使用双重身份认证，这要求用户提供两种形式的标识来访问账户。双重身份认证增加了攻击者获取敏感信息的难度，保护网络免受社会工程攻击。\n\
  \n## 恶意软件\n\n恶意软件、病毒和勒索软件等可以感染节点和钱包，损害网络安全。恶意软件可以盗取资金、损坏数据并泄露用户的隐私。\n\n恶意软件是区块链网络面临的重大安全威胁，因为它可以损害网络安全及其用户的隐私。恶意软件可能由于黑客攻击、钓鱼攻击和其他类型的引起。\n\
  \n为了防止恶意软件，用户可以实施各种安全措施，例如使用杀毒软件，它可以检测并移除系统中的恶意软件。\n\n## 缺乏监管\n\n公共区块链不受任何政府或机构监管，这使其容易受到诈骗、欺诈和其他非法活动的影响。缺乏监管可能导致用户和投资者遭受巨大的经济损失，是对区块链网络重大的安全威胁。\n\
  \n为了应对缺乏监管的问题，区块链网络可以实施各种安全措施，例如实施了解客户（`KYC`）和反洗钱（`AML`）政策。`KYC` 和 `AML` 政策有助于防止网络上的非法活动。\n\
  \n# 公共区块链的安全措施\n\n组织和用户理解区块链网络的各种安全威胁并实施相应的安全措施以防范是至关重要的。定期的安全评估（如渗透测试和漏洞评估）也有助于发现并解决网络安全问题。\n\
  \n总而言之，区块链技术通过提供安全的交易和数据存储平台，具有改变各行业的潜力。然而，为了实现其全部潜力，确保网络安全并使其免受各种安全威胁至关重要。通过实施适当的安全措施并关注最新的安全趋势和威胁，组织和用户可以确保区块链网络的安全并利用其诸多优势。\n\
  \n确保基于区块链的的安全对于防止网络攻击和数据泄露非常重要。遵循构建安全区块链解决方案的最佳实践对于实现这一目标关键。在本节中，我们将讨论构建安全区块链解决方案的最佳实践以及区块链渗透测试流程。\n\
  \n## 构建安全区块链解决方案的最佳实践\n\n-   **在业务合约场景中定义并执行背书协议**\n\n    背书协议确保只有授权方才能参与网络。这确保了网络的完整性和安全性。\n\
  \n-   **启用身份访问管理（`IAM`）**\n\n    `IAM` 有助于管理用户访问和身份验证。通过实施 `IAM`，组织可以控制对敏感数据的访问并防止未经授权的访问。\n\
  \n-   **使用令牌（如 `OAUTH`、`OIDC` 和 `SAML2`）执行用户身份验证、校验和授权**\n\n    令牌有助于确保用户身份验证和授权的安全。通过使用合适的令牌，组织可以防止未经授权的访问并控制谁可以访问敏感数据。\n\
  \n-   **安全存储身份密钥**\n\n\n\n安全地存储身份密钥对于确保网络安全至关重要。通过使用安全存储方法，组织可以防止未经授权访问并防止数据泄露。\n\
  \n### 在执行适当业务逻辑后使用特权访问管理 (PAM) 解决方案保护区块链账目\n\n`PAM` 有助于确保只有授权的人员才能访问敏感数据。通过实施 `PAM`，组织可以控制对敏感数据的访问并防止未经授权访问。\n\
  \n### 使用 API 安全最佳实践保护基于 API 的交易\n\n`APIs` 是区块链解决方案的关键组成部分。通过使用 API 安全最佳实践，组织可以防止未经授权访问并防止数据泄露。\n\
  \n### 使用数据分类方法保护数据或用户信息\n\n数据分类有助于组织识别和保护敏感数据。通过使用数据分类方法，组织可以确保敏感数据受到保护并防止数据泄露。\n\
  \n### 敏感信息使用隐私保护技术\n\n隐私保护技术有助于保护敏感信息。通过使用隐私保护技术，组织可以确保敏感数据的机密性和完整性。\n\n### 内外部通信使用标准\
  \ TLS\n\n`TLS` 有助于保护网络节点之间的通信。通过使用标准的 `TLS`，组织可以防止数据泄露并防止未经授权访问。\n\n### 实施多因素身份验证\n\
  \n多因素身份验证为用户验证增加了一层安全。通过实施多因素身份验证，组织可以防止未经授权访问并防止数据泄露。\n\n### 保持强大的加密密钥管理\n\n加密密钥管理对于确保网络安全至关重要。通过保持强大的加密密钥管理，组织可以防止未经授权访问并防止数据泄露。\n\
  \n### 利用硬件安全模块 (HSM) 和安全信息事件管理 (SIEM)\n\n`HSM` 和 `SIEM` 有助于确保网络安全。通过利用 `HSM` 和 `SIEM`，组织可以防止数据泄露并防止未经授权访问。\n\
  \n### 定期漏洞评估与渗透测试 (VAPT)\n\n定期 `VAPT` 有助于组织识别并解决网络中的安全漏洞。通过定期 `VAPT`，组织可以防止数据泄露并防止未经授权访问。\n\
  \n### 修复安全漏洞保护区块链应用程序不受漏洞和数据泄露的影响\n\n修复安全漏洞有助于组织防止数据泄露并防止未经授权访问。通过修复安全漏洞，组织可以确保网络安全。\n\
  \n### 为您的区块链解决方案获取行业认可的安全认证\n\n获取行业认可的安全认证有助于组织确保网络安全。通过获得安全认证，组织可以展示他们对安全的承诺并防止数据泄露。\n\
  \n### 为解决方案强制执行合性和其他安全控制\n\n强制执行合性和其他安全控制有助于组织确保网络安全。通过建立明确的指南、实施适当的控制以及培养安全意识文化，组织可以为更安全、更可靠的区块链生态系统做出贡献。\n\
  \n# 区块链安全测试工具\n\n区块链技术席卷全球，随着区块链采用的增加，区块链应用程序的安全已成为个人和组织关注的问题。区块链安全测试是一个本质过程，有助于识别区块链应用程序中的漏洞和缺陷并确保其安全性。\n\
  \n市场上已有多种区块链安全测试工具，可以帮助组织识别其区块链应用程序中的安全漏洞和缺陷。在本节，我们将讨论一些最流行的工具：\n\n### swc-registry\n\
  智能合约漏洞注册 (`SWC-registry`) 是一个为每个漏洞提供测试用例的工具。\n\n### MythX\n`MythX` 是一个 API，为 Ethereum、`Quorum`、`Vechain`、`Tron`\
  \ 以及其他兼容 `EVM` 的区块链提供智能合约安全。\n\n### Echidna\n`Echidna` 是一个为以太坊智能合约的模糊测试/基于属性测试设计的\
  \ Haskell 程序。\n\n### Manticore\n`Manticore` 是一个用于智能合约和二进制文件分析的符号执行工具。\n\n### Oyente\n\
  `Oyente` 是一个智能合约安全的静态分析工具。\n\n### Securify 2.0\n`Securify 2.0` 是一个用于以太坊智能合约的开源扫描器。\n\
  \n### SmartCheck\n`SmartCheck` 是一个静态合约安全分析器，使用先进静态分析技术检测漏洞。\n\n### Octopus\n`Octopus`\
  \ 是用于 WebAssembly 模块和区块链智能合约的安全分析框架。\n\n### Surya\n`Surya` 是一个智能合约系统的实用工具，可提供识别潜在漏洞的报告。\n\
  \n### Solgraph\n`Solgraph` 生成 DOT 图，可视化 Solidity 合同的函数控制流，并突出显示潜在的安全漏洞。\n\n### Solidity\
  \ Security Blog\n`Solidity Security Blog` 提供了一份与加密相关的攻击、错误、漏洞和预防措施的完整列表。\n\n###\
  \ Awesome Buggy ERC20 Tokens\n`Awesome Buggy ERC20 Tokens` 是 ERC20 智能合约漏洞的集合，列出了受影响的代币。\n\
  \n\n\n\n## Ronin 桥接遭破解 - 6.12 亿美元\n\n2022 年 3 月 23 日，发生了今年最大的网络攻击。为 `Axie Infinity`\
  \ 构建的以太坊侧链 `Ronin Bridge` 被利用，导致损失了约 6.12 亿美元的加密货币。黑客获取了私钥，攻破了验证节点并批准了交易，从而从桥接中抽取了资金。美国财政部于\
  \ 4 月 14 日更新了其 `SDN` 名单，暗示 `Lazarus Group` 可能是此次攻击的责任者。`Ronin Bridge` 黑客事件是迄为止最大的加密货币利用事件。\n\
  \n## FTX 钱包遭破解 — 4.77 亿美元\n\n在 `FTX` 于 11 月 11 日至 12 日进行破产程序期间，未经授权的交易导致约 4.77 亿美元的加密货币被盗。`Sam\
  \ Bankman-Fried` 怀疑是某前员工或某前员工电脑上的恶意软件参与其中。到 12 月 27 日，美国司法部已对约 3.72 亿美元被盗资金的去向启动了调查。\n\
  \n`FTX` 钱包遭破解的根本原因是人为错误和安全实践不善的结合。根据 `Chainalysis` 的报告，黑客通过一个被攻破的员工邮箱账户访问了 `FTX`\
  \ 热钱包，该账户曾用于重置钱包供应商 `BitGo` 的密码。黑客随后利用钓鱼邮件和社交工程欺骗 `FTX` 员工批准了提币请求。报告还发现，`FTX` 未能建立充分的多因素身份验证、加密或监控系统来防止或检测此类泄露。\n\
  \n*   `FTX` 从此后实施了更严格的安全措施，例如更换密码、强制执行 `2FA` 以及使用硬件钱包进行冷存储。\n*   黑客通过各种混合器、去中心化交易所和场外交易经纪人（OTC）洗白了部分被盗资金，使其难以被追踪。\n\
  *   `FTX` 已为任何能导致资金追回或捕获作案者的信息提供 1,000 万美元的奖励。\n\n## Wormhole 桥接遭遭破解 — 3.21 亿美元\n\
  \n2 月 2 日，`Wormhole` 代币桥因其智能合约的漏洞遭受了 3.21 亿美元的攻击。攻击者能够在 `Solana` (`SOL`) 上铸造 120,000\
  \ 个无支持的 `wETH` 代币并将其兑换为 `ETH`。此次破解当时是 2022 年最大的攻击，位列全年第三。\n\n`Wormhole Bridge` 遭破解的根本原因是实现代币桥的智能合约存在代码错误。该错误允许攻击者绕过正常的验证过程，在\
  \ `Solana` 上铸造任意数量的 `wETH` 代币，而无需在以太坊上锁定任何 `ETH`。攻击者随后利用各种去中心化交易所将无支持的 `wETH` 兑换\
  \ `ETH`，抽空了流动性池并导致桥接破产。`Wormhole` 团队表示他们曾在内部审计过代码，但没有使用任何外部安全公司。他们还声称该漏洞是近期更新引入的，在桥接的原始版本并不存在。该团队已暂停桥接并正在制定恢复计划。\n\
  \n## Nomad 代币桥遭破解 — 1.9 亿美元\n\n8 月 2 日，多名攻击者利用 `Nomad` 代币桥（一个促进跨链交换的平台）盗走了 1.9 亿美元。智能合约漏洞导致了攻击发生，约\
  \ 88% 的参与者被识别为模仿者。白帽黑客成功追回了约 3,260 万美元的资金。\n\n`Nomad` 代币桥遭破解是因为安全远程密码 (`SRP`) 协议的实现缺陷，该协议用于身份用户并验证跨链交易。`SRP`\
  \ 协议要求双方对一个大质数和一个生成器达成一致，但 `Nomad` 桥使用了一个硬编码在智能合约中的固定且小的质数。\n\n\n\n\n\nDAO 的设计是完全自治的，没有中心机构或人工管理。相反，它依赖智能合约来管理其运营和投资。投资者可以使用他们的以太坊购买\
  \ DAO 代币，从而获得对投资提案进行投票的权利并分享利润。\n\n## 攻击\n\n2016 年 6 月，DAO 遭到了攻击，导致超过 360 万个以太坊被盗，当时价值约\
  \ 5000 万美元。攻击之所以能够是因为 DAO 的智能合约代码存在漏洞，该漏洞允许攻击者在没有适当授权的情况下反复从 DAO 提取以太坊。\n\n攻击者利用了代码中的一个缺陷，允许创建一个递归调用，这意味着攻击者可以在上一次交易完成之前反复向\
  \ DAO 请求资金。这使得攻击者在任何人察觉之前就积累了大量的以太坊。\n\n## 影响\n\nDAO 攻击对以太坊社区是一个沉重的打击，对以太坊的价值产生了重大影响。在攻击后的几天内，以太坊的价值下跌了超过\
  \ 30%，价格花费了几个月才完全恢复。\n\n这次攻击还导致了以太坊社区的分裂，一些成员主张通过硬分叉来扭转攻击并把被盗资金还给投资者。另一些人则认为这违反了去中心化和区块链不可篡改的原则，并且攻击仅仅是区块链社区学习过程的一部分。\n\
  \n## 后果\n\n在攻击之后，以太坊社区决定进行硬分叉，以扭转攻击并将被盗资金还给投资者。这导致了以太坊经典（Ethereum Classic）的诞生，这是一条独立的区块链，不包含硬分叉和对\
  \ DAO 攻击的逆转。\n\n硬分叉充满了争议，区块链社区的许多成员认为它违反了去中心化和区块链不可篡改的原则。然而，硬分叉最终成功了，被盗资金也归还给了投资者。\n\
  \n## 什么是硬分叉？\n\n硬分叉是区块链网络规则或协议的更改，会导致与之前的版本产生永久性的分歧。它要求所有节点升级到新版本，并导致两条互不承认对方交易的非兼容链。硬分叉可以由开发者、矿工或想要实现新功能、修复漏洞或解决争议的用户发起。\n\
  \n## 在以太坊硬分叉中发生了什么？\n\n以太坊硬分叉是对 DAO 攻击的响应，该攻击利用了 DAO 智能合约代码中的漏洞，DAO 是一个在众筹活动中募集了\
  \ 1.5 亿美元的去中心化自治组织。黑客通过创建一个反复调用 `withdraw` 函数的递归函数耗尽了约三分的资金。以太坊基金提出的硬分叉旨在通过更改攻击前的区块链状态来扭转攻击并将被盗资金还给投资者。然而，并非所有人都同意这一决定，一些节点拒绝升级到新版本。他们继续遵循原始链，该链被称为以太坊经典（Ethereum\
  \ Classic）。硬分叉在以太坊社区和网络内部造成了分裂，引发了关于区块链技术不可篡性和安全性的问题。\n\n## 经验教训\n\nDAO 攻击是区块链社区的一个重大醒警钟，它凸显了对更稳健的安全措施和智能合约审计的需求。以下是从\
  \ DAO 攻击中获得的一些关键教训：\n\n- **智能合约并非无一击**：DAO 攻击证明了即使是智能合约也可能存在漏洞。\n- **共识的重要性**：攻击导致了社区的分裂，强调了在去中心化系统中达成共识的挑战。\n\
  - **监管的必要性**：该事件强调了需要监管框架和安全措施来保护投资者。\n\n# Mt. Gox 攻击：加密货币行业的网络安全教训\n\nMt. Gox 攻击被认为是历史上最大的加密货币攻击之一。Mt.\
  \ Gox 是一家成立于 2010 年的日本比特币交易所，在鼎峰时期，处理了全球 70% 的比特币交易。然而，在 2014 年，该交易所申请破产，理由是损失了\
  \ 85 万个比特币。\n\n## 影响\n\nMt. Gox 攻击对加密货币行业产生了重大影响，引发了广泛的恐慌和对比特币信度的下降。攻击导致了 85 万个比特币的丢失，这占当时流通比特币总量的约\
  \ 7%。比特币的价格暴跌，其声誉也遭受了严重损害。\n\n## 后果\n\n攻击后，Mt. Gox 申请了破产，东京地区法院被任命监督该过程。法院任命了一名受托人监督剩余资产（包括比特币）分配给受影响的客户。2018\
  \ 年，受托人宣布所有债权人将以比特币偿还，该过程于 2019 年完成。\n\n## 经验教训\n\nMt. Gox 攻击促成了加密货币行业内更严格的监管和安全措施的发展，以防止未来的攻击。通过不断从此类事件中学习，我们可以构建一个更具韧性且更安全的生态系统。\n\
  \n\n\n\n\nGox 黑客事件为加密货币行业提供了几条宝贵的教训。首先，它强调了安全措施的重要性，以及交易所需要实施稳健的安全协议以保护客户资金的必要性。它还强调了在发生安全泄露时，与客户保持透明和开放沟通的必要性。\n\
  \n此外，Gox 黑客事件表明中心化可能是加密货币行业中的一个重大风险因素。在一个中心位置存储大量加密货币的交易所更容易受到攻击，因此该行业开发去中心化解决方案以降低这种风险至关重要。\n\
  \n从 Gox 黑客事件中学的另一个教训是独立审计和监管监督的重要性。交易所必须对其行为负责，并被要求遵守行业标准以保护其客户。\n\nGox 黑客事件是加密货币行业的一个分水岭，凸显了改进安全措施、透明度和独立监督的性。它促成了更严格的法规和安全协议的发展，使该行业对投资者来说变得更加安全。尽管这次攻击对行业来说是一次重大打击，但它最终导致了行业的演变，为更安全、更有韧性的未来铺平了道路。\n\
  \n# 结论\n\n公共区块链由于其独特的特性和固有的漏洞，面临着各种安全挑战。通过理解常见的威胁并实施适当的安全措施，可以维护公共区块链的完整性和安全性。本章不仅强调了对公共区块链安全采取主动措施的重要性，还强调了在面对新兴威胁时持续学习和适应的必要性。研究现实世界的案例可以为安全泄露的实际影响以及从中汲取的教训提供宝贵的见解，最终有助于开发更安全、更有韧性的公共区块链系统。\n\
  \n下一章将关注私有区块链面临的安全挑战，包括内部攻击等内部问题，以及网络破译等外部问题。它还讨论了可以防止这些威胁的安全方法。\n\n随着区块链技术的不断发展，私有区块链已成为希望在利用分布式账本技术的同时保持控制、隐私和效率的企业组织的流行选择。本章将介绍私有区块链，探讨其特征、优点和可能的应用场景。\n\
