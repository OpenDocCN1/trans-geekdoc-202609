  - '[PAGE 2]


    # Feature


    ![](img/2482c90108701badaa1b8e70cc147743_2_0.png)


    Bonobos in the Democratic Republic of the Congo combine calls into phrases in
    several ways.


    meanings that they can produce is “really far from what humans can do”, says Girard-Buttoz.
    Although it is tempting to draw comparisons between animal communication and human
    language, these systems might be fundamentally different, he notes. “Maybe you
    can have a very complex system, which has nothing to do with human language,”
    he says, “but is still able to communicate generatively, a lot of things, but
    in a different way, using different methods.”


    # Two-way understanding


    Many researchers studying animal communication turn to AI because of its ability
    to detect, identify and classify sounds. Robinson is developing a tool called
    NatureLM-audio. This large language model is trained on thousands of recordings
    of animal sounds, music, environmental noise and human speech from 13 public data
    sets that include text describing the audio. When presented with a new clip, it
    can answer prompts such as ‘how many birds are making sounds?’ or ‘list the common
    names of the species represented’. Robinson says that the model is intended as
    a research assistant that can do tasks that take a long time for humans, such
    as analysing patterns in large swathes of data.


    AI tools are also being used to analyse audio and environmental data, and identify
    which sounds are used in what contexts, which is key to understanding meaning.
    For example, AI systems have helped to discover that African


    savannah elephants (Loxodonta africana) and marmoset monkeys (Callithrix jacchus)
    name their peers10,11 using specific sounds.


    Similar tools could help scientists to study non-vocal forms of communication,
    including electromagnetic signals generated by electric fish, Robinson says, and
    chemical ones, such as pheromones. But, he adds, the potential value of AI depends
    on the species and the goal.


    AI tools excel for bird species with songs that don''t vary much and for which
    researchers have already collected a lot of data, says Dominique Potvin, a songbird
    researcher at the University of the Sunshine Coast in Sippy Downs, Australia,
    who uses AI to help her analyse birdsong recordings. Chickadee calls, for example,
    sound basically the same every time and can be identified easily and reliably
    by machines, she says. But for mimicking, such as the superb lyrebird (Menura
    novaehollandiae), or species with complex songs, including the brown thrasher
    (Toxostoma rufum), AI systems might not be as immediately useful.


    Neither Berthet nor Girard-Buttoz used AI tools in their studies, because the
    models struggle to isolate animal calls in noisy forests. Behavioural observations
    alongside audio recordings provide the necessary context for researchers who want
    to find out what the calls mean. AI tools also struggle to analyse video of animal
    movements in visually crowded forests.


    In the past few years, some researchers have turned to AI to generate sequences
    of animal sounds. That''s a key aim of Project CETI, which ultimately hopes to
    test its translations by playing sound sequences back to whales. Kentaro Abe,
    a neuroscientist who studies birdsong at Tohoku University in Sendai, Japan, has
    developed an AI tool called FinchGPT to look for evidence of grammar in the songs
    of Bengalese finches (Lonchura striata domestica). FinchGPT learnt from a collection
    of 32,000 songs recorded from three finches that had been converted to text, with


    each short sound pattern assigned a letter12. Abe''s team is testing the tool''s
    ability to predict the next sound pattern in a song sequence.


    Meanwhile, scientists at Google DeepMind in London, the Georgia Institute of Technology
    in Atlanta and the Wild Dolphin Project in North Palm Beach, Florida, have developed
    DolphinGemma. This AI model was trained to learn the structure of sounds and generate
    sound sequences that mimic those of Atlantic spotted dolphins (Stenella frontalis).


    Generating sequences of animal sounds is relatively simple. The bigger challenge
    is making the sequences meaningful. Although researchers say that such understanding
    is still a ways off, some have made interspecies communication a goal. The Collier
    Dolittle Challenge, for example, is offering a grand prize of US$500,000 in cash
    or $10 million in investments for AI-driven breakthroughs in two-way communication,
    along with yearly prizes.


    As with any experiment that plays sounds to animals, the potential effects on
    their natural behaviour need to be considered, researchers say. Playing songs
    to humpback whales (Megaptera novaeangliae), for example, which have a vocal culture
    transmitted socially across generations, could affect how they select mates for
    generations to come, Robinson says. Scientists at CETI and elsewhere are also
    considering the ethical and legal ramifications that might come with understanding
    animals.


    It''s not yet obvious whether the benefits of communicating with animals would
    outweigh the potential harms. “I''m not sure I want to be able to communicate
    with them,” says Berthet, nor is she convinced that they would want to communicate
    with us.


    Potvin says that other animals'' experiences of the world might be so fundamentally
    different from our own that two-way communication isn''t possible. “We aren''t
    a bird, so we have no idea what a bird listening to another bird is thinking,”
    she adds. But she sees value in trying to understand what animals are saying:
    “We do whatever we can, and there''s always going to be mystery.”


    Rachel Fieldhouse is a reporter for Nature in Sydney, Australia.


    +   1. Berthet, M., Surbeck, M. & Townsend, S. W. Science 388, 104–108 (2025).

    +   2. Arnon, I. et al. Science 387, 649–653 (2025).

    +   3. Suzuki, T. N., Wheatcroft, D. & Griesser, M. Nature Commun. 7, 10986 (2016).

    +   4. Leroux, M. et al. Nature Commun. 14, 2225 (2023).

    +   5. Girard-Buttoz, C. et al. Sci. Adv. 11, eadq2879 (2025).

    +   6. Sharma, P. et al. Nature Commun. 15, 3617 (2024).

    +   7. Beguš, G., Sproule, R. L., Leban, A., Silva, M. & Gero, S. Preprint at
    OSF https://doi.org/10.31219/osf.io/285cs (2023).

    +   8. Liao, D. A., Brecht, K. F., Johnston, M. & Nieder, A. Sci. Adv. 8, eabq3356
    (2022).

    +   9. Rutz, C. et al. Science 381, 152–155 (2023).

    +   10. Pardo, M. A. et al. Nature Ecol. Evol. 8, 1353–1364 (2024).

    +   11. Oren, G. et al. Science 385, 996–1003 (2024).

    +   12. Kobayashi, K. et al. Preprint at arXiv https://doi.org/10.48550/arXiv.2502.00344
    (2025).'
