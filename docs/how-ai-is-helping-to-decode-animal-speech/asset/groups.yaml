    ## AI 如何帮助解码动物语言


    Berthet 说：“我认为这是为了带来和平。”这项研究于四月报道，是过去几年中多个例子之一，凸显了非人类动物的声音交流可以多么复杂。在一些灵长类、鲸类和鸟类物种中，研究人员已经识别出长期以来被认为是人类语言定义特征的发声特征和模式。这些结果挑战了关于人类语言有何特殊之处——甚至“语言”应如何定义的观点。也许不出所料，许多科学家转向人工智能（AI）工具，以加快动物声音的检测和解释，并探究人类听众可能忽略的交流方面。“它正在做一些通过传统方式根本不可能实现的事情，”大卫·罗宾逊说道，他是地球物种项目（Earth
    Species Project）的人工智能研究员，该非营利组织位于加利福尼亚州伯克利，正在开发 AI 系统来解码动物王国中的交流。


    理解其他物种的复杂声音交流可能有助于人类与动物对话。作者：Rachel Fieldhouse


    在刚果民主共和国的雨林深处，Mélissa Berthet 发现倭黑猩猩正在做一件长期被认为是人类独有的事情。在 Berthet 观察这些灵长类动物的六个月里，它们以多种方式组合叫声，形成复杂的短语。例如，一起筑巢的倭黑猩猩（Pan
    paniscus）在表示“看我的”的咕噜声中加入了表示“我们来做这个”的尖叫声。Berthet 说，这实际上是一种表达“看我正在做什么，让我们一起做这一切”的方式，她在法国雷恩大学研究灵长类动物和语言学。在另一个案例中，表示“我想做这个”的咝声之后，跟随着表示“让我们待在一起”的口哨声。倭黑猩猩在敏感的社交场合中组合这两种叫声，


    随着研究的进展，人们越来越有兴趣使用 AI 工具不仅仅是窃听动物的言语，还可能与它们对话。


    ### 组合叫声


    研究动物交流的科学家提出了一些语言学家也会问的问题。语音是如何在物理上产生的（语音学）？声音是如何组合成有意义单位的（形态学）？什么规则决定了短语和句子的结构（句法）？


    直到大约十年前，研究人员仍认为只有人类使用语言学中称为“合成性”的特征。这是将有意义的词语、叫声或其他噪音组合成表达式，其意义源自其各部分的意义。


    但是，2016 年对日本山雀（Parus minor）的一项研究改变了科学家对合成性的看法。当鸟类听到“警报”叫声时，它们会寻找捕食者；在听到“招募”叫声后，它们会靠近声音来源。当它们按此顺序听到叫声时，会同时表现出这两种行为³。但当顺序颠倒时，它们不会这样做，这表明存在合成性：叫声的组合有其自身的意义。


    2023 年的一项研究进一步开展了这项工作。通过在野外向黑猩猩（Pan troglodytes）展示假蛇，科学家表明这些灵长类动物同样会将“警报”和“招募”发声组合成一种信息，促使其他个体聚集在呼叫者周围以应对威胁⁴。


    然而，人类长期以来是已知唯一以多种方式使用合成性的物种。例如，通过不同的词序来改变短语的意义，在词尾添加后缀以修改意义，以及创造隐喻和习语来产生比喻性表达。


    但是，Berthet 和她的同事的研究缓和了人类与其他动物之间的这种区别。他们记录了 30 只成年倭黑猩猩的 700 个叫声，发现这些动物以四种方式组合有限数量的叫声⁵。其中一种——尖叫-咕噜组合——作者认为具有“平凡”的合成性，因为单个叫声的意义仅仅是被组合在一起了。（例如，“红色的汽车”描述的是既是红色又是汽车的物体。）在其他三种情况下，一个叫声修改了另一个叫声，从而产生“非平凡”的合成性。（“糟糕的演员”描述的是演技不好的人，而不是既糟糕又是演员的人。）


    法国里昂神经科学研究中心的进化生物学家 Cédric Girard-Buttoz 及其同事在 5 月报道，黑猩猩也以多种方式组合有限数量的叫声⁶。对于某些发声，组合短语的意义无法从单个叫声的意义中确定，这与人类语言中的某些习语情况相同。例如，一种在地面休息时使用的鸣叫，随后是表示玩耍和社交联系的喘息声，促使黑猩猩爬树、筑巢并一起休息，尽管这两种叫声通常与爬树无关，Girard-Buttoz
    说。他补充说，以多种方式产生意义是语言的基石。


    鲸类也具有某些人类语言的显著特征。位于纽约市的非营利组织 Project CETI 的研究人员一直在追踪和记录加勒比海多米尼加岛海岸外的抹香鲸（Physeter
    macrocephalus），以编纂一份大规模的动作和声音数据集。通过寻找将鲸类声音与行为联系起来的模式，科学家希望能够翻译“鲸语”。


    CETI 语言学家 Gaspé Beguš 一直在训练生成式 AI 模型，以产生模仿抹香鲸发出的声音和声音序列。而人类是通过将空气送入喉咙的声带（以不同频率振动）来产生不同声音的，这些鲸类则是将空气送入


    > 关于我们是否会发现一套完整的语言，结论尚未定论。


    它们鼻腔中类似嘴唇的结构，该结构振动并产生咔嗒声。这些咔嗒声被分组为称为“编码”的单位。


    CETI 科学家去年报道，抹香鲸拥有自己的“语音字母表”，编码在节奏和韵律等特征上有所不同⁶。Beguš 及其同事此后发现，鲸类编码的差异方式类似于人类语言中的元音和双元音。人类语音中的元音基于舌头的位置和嘴唇的形状而有所不同，例如
    cheese 中的“ee”音与 hot 中的“o”音。双元音，或称滑元音，是通过在一个音节中组合两个元音而产生的，例如 pout 中的发音，当嘴唇和舌头移动时会导致频率变化。


    Beguš 的团队识别出两种具有独特声音模式的编码，研究人员将其称为 an-a-wel 和 i-o-vowel。他们还发现，这些元音以四种方式改变频率：可以上升，可以下降，可以先下降后上升，或者可以先上升后下降⁷。频率变化可能暗示存在双元音。


    ### 什么是语言


    动物交流的复杂性是否足以被视为语言，取决于一个人如何定义这个术语以及他们如何看待动物的思维方式。Beguš 说，存在两种主流观点。“一种世界观认为语言和复杂思维是内在相连的。”根据这一观点，复杂思维先于语言出现，而语言是外化思维的一种方式。如果是这样，除非动物能够进行复杂思维，否则它们就不能拥有语言。


    另一种观点认为，语言只是一种交流方式，如手势或面部表情，并不需要复杂思维。在这种情况下，动物无论是否具备复杂思维，都可能拥有语言。训练动物与人类交流的实验（例如与今年早些时候去世的倭黑猩猩
    Kanzi 的实验）曾暗示动物可能有能力拥有语言。但这是另一个问题，与它们是否在野外自主使用语言不同。


    “关于我们是否会发现一套完整的语言，结论尚未定论，”Robinson 说。


    首先，人类语言的某些方面在其他物种中尚未被发现。语言学家 Charles Hockett 创建的语言检查表中的 16 个特征中，有三个——位移性、生产性和双重性——在非人类动物中尚未被确认。


    位移性是指谈论抽象概念的能力，例如过去、未来或遥远的事物。这一特征在动物交流中尚未被令人信服地观察到，尽管在某些情况下有轶事证据，例如海豚呼叫多年前消失的其他海豚的名字，以及红毛猩猩（Pongo
    spp.）告诉其他个体该区域之前出现过捕食者，Berthet 说。


    生产性是指能够说出从未说过或听过的话，并被另一个个体理解。


    双重性描述的是由更小的有意义单位组成的有意义消息，而这些单位又由更小的、无意义的声音组成。虽然鲸类使用咔嗒声来创建更长的编码，但科学家尚未证明咔嗒声是无意义的而编码是有意义的。


    递归是另一种可能特有于人类语言的特征。这是指句子或短语相互嵌套，以创造更深层次的意义。通过训练乌鸦（Corvus corone）在触摸屏上按适当顺序啄击开括号和闭括号，德国图宾根大学研究声音交流和认知的
    Diana Liao 及其同事发现，这些动物在心理上具备递归能力⁸。“它们做得甚至比猕猴更好，与人类幼儿相当，”Liao 说。然而，尚不清楚乌鸦是否在它们的交流中使用递归。


    同样不清楚动物是否拥有定义声音交流结构的语法规则。而且，尽管已经证明灵长类动物可以混合搭配叫声来产生意义，但……的数量


