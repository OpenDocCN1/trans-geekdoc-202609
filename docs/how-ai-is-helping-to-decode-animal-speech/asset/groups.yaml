    ## 特稿


    ![](img/2482c90108701badaa1b8e70cc147743_2_0.png)


    刚果民主共和国的倭黑猩猩以多种方式将叫声组合成短语。


    它们能产生的含义“与人类所能做的相去甚远”，Girard-Buttoz表示。尽管将动物交流与人类语言进行比较很诱人，但他指出，这些系统可能在根本上有所不同。“也许你可以拥有一个非常复杂的系统，它与人类语言毫无关系，”他说，“但仍然能够以生成性的方式传达许多事情，只是方式不同，使用不同的方法。”


    ## 双向理解


    许多研究动物交流的研究人员转向AI，因为其能够检测、识别和分类声音。Robinson正在开发一款名为NatureLM-audio的工具。这个大型语言模型在13个公开数据集的数千段动物声音、音乐、环境噪音和人类语音录音上进行训练，这些数据集包含描述音频的文本。面对新的音频片段时，它可以回答诸如“有多少只鸟在发出声音？”或“列出所代表物种的通用名称”等提示。Robinson表示，该模型旨在作为研究助手，完成人类需要花费很长时间的任务，例如分析大量数据中的模式。


    AI工具也被用来分析音频和环境数据，并识别哪些声音在什么情境下使用，这对于理解含义至关重要。例如，AI系统帮助发现，非洲草原象（Loxodonta africana）和狨猴（Callithrix
    jacchus）使用特定声音为同伴命名 10, 11。


    Robinson表示，类似的工具可以帮助科学家研究非声音形式的交流，包括电鱼产生的电磁信号以及化学信号，如信息素。但他补充说，AI的潜在价值取决于物种和目标。


    澳大利亚悉尼下桑希恩海岸大学的鸣禽研究员Dominique Potvin表示，AI工具对于那些歌曲变化不大且研究人员已收集大量数据的鸟类物种效果出色，她利用AI来帮助分析鸟鸣录音。例如，山雀的叫声每次听起来基本都一样，机器可以轻松可靠地识别，她说。但对于模仿类鸟类，如优秀琴鸟（Menura
    novaehollandiae），或拥有复杂歌曲的物种，如棕拟鸫（Toxostoma rufum），AI系统可能不那么立即有用。


    Berthet和Girard-Buttoz在其研究中均未使用AI工具，因为模型难以在嘈杂的森林中分离动物叫声。行为观察结合音频录音为希望了解叫声含义的研究人员提供了必要的背景。AI工具在分析视觉拥挤的森林中动物运动的视频方面也面临困难。


    近年来，一些研究人员转向AI来生成动物声音序列。这是CETI项目的一个关键目标，该项目最终希望通过将声音序列播放给鲸鱼来测试其翻译。日本仙台东北大学的神经科学家Kentaro
    Abe研究鸟鸣，他开发了一款名为FinchGPT的AI工具，用于在Bengalese文鸟（Lonchura striata domestica）的歌曲中寻找语法证据。FinchGPT从三只雀鸟录制的32,000首歌曲集合中学习，这些歌曲已转换为文本，每个短声音模式被分配一个字母
    12。Abe的团队正在测试该工具预测歌曲序列中下一个声音模式的能力。


    与此同时，伦敦Google DeepMind、亚特兰大乔治亚理工学院和佛罗里达州北棕榈滩野生海豚项目的科学家们开发了DolphinGemma。这个AI模型经过训练，学习声音结构并生成模仿大西洋斑海豚（Stenella
    frontalis）声音的序列。


    生成动物声音序列相对简单。更大的挑战是使这些序列变得有意义。尽管研究人员表示这种理解还遥遥无期，但有些人已将种间沟通作为目标。例如，Collier Dolittle
    Challenge正在为AI驱动的双向沟通突破提供50万美元现金或1000万美元投资的大奖，以及年度奖项。


    研究人员表示，与任何向动物播放声音的实验一样，需要考虑对其自然行为的潜在影响。例如，Robinson表示，向座头鲸（Megaptera novaeangliae）播放歌曲可能会影响它们未来几代选择配偶的方式，座头鲸拥有跨代社会传递的声乐文化。CETI及其他地方的科学家们也在考虑理解动物可能带来的伦理和法律后果。


    与动物沟通的益处是否大于潜在危害尚不明显。“我不确定我是否想与它们沟通，”Berthet表示，她也不确定它们是否想与我们沟通。


    Potvin表示，其他动物对世界的体验可能与我们的体验在根本上不同，以至于双向沟通不可能。“我们不是鸟，所以不知道一只鸟在听另一只鸟时在想什么，”她补充道。但她认为尝试理解动物在说什么是有价值的：“我们会尽一切所能，但总会有谜团。”


    Rachel Fieldhouse是澳大利亚悉尼《自然》杂志的记者。


