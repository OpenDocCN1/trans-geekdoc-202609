    # III. Application Value of Data Encryption Technology in Computer Network Communication


    Digital encryption technology can effectively solve the problem of information
    leakage and the timely transmission of data. In the process of information transmission,
    computer network communication is the main way that people exchange information,
    its efficiency is relatively high, and it is widely used in the civil and military
    fields. In order to to ensure the security of data application, data encryption
    is necessary. The encryption technology is to use ciphertext mode setting to encrypt
    important information. After the information is encrypted, the receiver performs
    the information encryption decoding operation according to the decoding rules.
    To obtain real data information, the security of information can be greatly improved.
    If the information is leaked, there is no need to worry that the information content
    is obtained by others, because the decoding rules limit, so that others cannot
    crack the information content. Therefore, it can effectively improve the security
    of computer network system.


