    # 名义数据


    名义数据（也称为名义尺度）是一种用于标记变量而不提供任何定量值的数据类型。它是最简单的测量尺度形式。与有序数据不同，名义数据无法排序或度量。定性分类包括城市、姓名、州或任何分类数据等变量，这些变量具有与分类属性值相关联的数字表示。例如，表中的性别字段（`0
    = 不可用`、`1 = 男性`、`2 = 女性`）。这些标识符代表实际的属性值。名义数据类型不应应用任何数学运算。顺序无效。名义数据类型的集中趋势是众数。


    # 有序数据


    有序数据是可排序或可排名的；例如：`0 = 低`、`2 = 高`、`1 = 中`。对于有序数据，排序非常重要，其集中趋势是众数或中位数。


    # 等距数据


    项目也应进行测量，以量化并比较它们之间的差异。例如，以华氏度或摄氏度测量的温度。


    等距尺度是数值尺度，其中顺序和精确差异均有效。例如，60 度和 50 度之间的差异是可测量的 10 度，80 度和 70 度之间的差异也是 10 度。集中趋势可以用众数和中位数来衡量，标准差也可以计算。


    # 比率数据


    比率数据是指任何可测量、可排序、可排名且可应用于任何数学计算的数值数据。例如：身高、体重、持续时间、销售额和利润额。比率数据的集中趋势是众数、平均数、中位数、算术平均数，且可排序。请参见表
    2.1。


