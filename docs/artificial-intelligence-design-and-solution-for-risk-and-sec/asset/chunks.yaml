- raw: 'Nominal data (also known as nominal scale) is a type of data used to label
    variables without providing any quantitative value. It is the simplest form of
    a scale of measure. Unlike ordinal data, nominal data cannot be ordered or measured.
    Qualitative classifications include variables such as city, name, state, or any
    categorical data, which has a numerical representation tied to a categorical attribute
    value. For example, the gender field in a table (0 = Unavailable, 1 = Male, and
    2 = Female). These identifiers represent actual attribute values. Nominal data
    type should not be applied with any mathematical operations. The order is not
    a valid. The central tendency for nominal data type is mode.


    Ordinal Data


    Ordinal data are orderable or can be ranked; for example: 0 = low, 2 = high, and
    1 = medium. With ordinal data, the ordering is very important and central tendency
    to ordinal data is mode or median.


    Interval Data


    The items should also be measured to quantify and compare differences between
    them. For example, temperature as measured in Fahrenheit or Celsius.


    Interval scales are numeric scales where both the order and the exact differences
    are valid. For example, the difference between 60 and 50 degrees is a measurable
    10 degrees, as is the difference between 80 and 70 degrees. The central tendency
    can be measured by mode and median, and standard deviation can also be calculated.


    Ratio Data


    Ratio data are any numeric data that is measurable, orderable, can be ranked,
    and can be applied to any mathematical calculation. For example: height, weight,
    duration, sales amount, and profit amount. The central tendency for the ratio
    data is mode, mean, median, average, and orderable. See [Table 2.1](#02_Chapter_2.xhtml#ch2tab1).


    Table 2.1 Ratio data


    | Provides || Nominal || Ordinal || Interval || Ratio |


    | --- | --- | --- | --- | --- |


    | Order of value || No || Yes || Yes || Yes |


    | Frequency distribution (count) || Yes || Yes || Yes || Yes |


    | Mode || Yes || Yes || Yes || Yes |


    | Median || No || Yes || Yes || Yes |


    | Mean || No || No || Yes || Yes |


    | Quantify the difference || No || No || Yes || Yes |


    Data Exploration


    Data exploration analyzes data using visual exploration to understand the dataset
    and determine data characteristics such as size, amount of data, completeness
    of the data, correctness of the data, and the relationship between data elements
    (Alvarez-Ayllon 2018).


    Variable Identification


    Variable identification is the basis for any input (predicator) or output (target)
    to ML models. Variable identification determines what kind of variables can be
    used as a predicator or target.


    Univariate Analysis


    Univariate analysis is a statistical analysis that determines the variable or
    multiple variables involved. This analysis applies to categorical variables and
    features (qualitative) or numerical (quantitative) univariate data. Categorical
    univariate data consist of numbers such as height or weight.


    Typically, univariate is visualized using a frequency distribution table, bar
    chart, histograms, frequency polygons, and pie charts.


    1.  Continuous features


    2.  Categorical features


    Bivariate Analysis


    Bivariate analysis is the statistical analysis of two variables (attributes) and
    explores the relationship between two variables. Bivariate analysis determines
    the strength of the association between variables. This analysis examines the
    differences between two variables and the significance of the differences.


    Types of bivariate analysis include numerical versus numerical, categorical versus
    categorical, and numerical versus categorical. Bivariate analysis is illustrated
    through any one of the following visualizations.


    Scatter Plot


    A scatter plot explores two numerical values to provide a visual representation
    of the linear and nonlinear relationships.


    Linear correlation quantifies the strength of a linear relationship using the
    following formula.


    ![](images/Eq001.png)


    where x(dash) and y(dash) are the sample mean, and n is the number of samples.


    Correlation Plot


    Correlation plots are used to assess whether or not correlations are consistent
    across groups.


    1.  Two-way table


    2.  Stacked column chart


    Chi-Square Test


    Chi-square test is a statistical hypothesis test where the sampling distribution
    of the test statistic is a chi-squared distribution when the NULL hypothesis is
    true. The Pearson’s chi-square test is commonly used. The chi-square test is used
    to determine if a significant difference exists between the expected frequencies
    and the observed frequencies in one or more categories. The chi-square test gives
    P value.


    Chi-square formula:


    ![Image](images/Eq003.png)


    Z\-Test/T\-Test


    The Z\-test and T\-test are the same. It is a statistical evaluations of the averages
    of two groups and determines the differences and significance of the differences.


    ![Image](images/Eq002.png)


    ![Image](images/Eq004.jpg)


    Analysis of Variance (ANOVA)


    The ANOVA is a short form variance test that statistically measures the averages
    of more than two groups that are statistically different from each other. In simple
    terms, the test determines the statistically significant differences between the
    mean values of three or more independent groups.


    Feature Cleaning


    Feature cleaning is another name for data cleaning. Clean and quality data determine
    the success of a data project. Collecting quality data is the biggest challenge.


    Missing values


    Null values, spaces, or no value can be present in the data.


    Obvious Inconsistencies


    Inconsistent data problems arise when various information systems are collecting,
    processing, and updating data due to human or equipment reasons.


    Inconsistent data make it impossible to obtain correct information from the data
    and reduce data availability.


    Special Values


    The special values are specific to the respective dataset. For example, some default
    values for a date field are represented as “1900-01-01” for effective begin date
    and “2099-12-31” for effective end date.


    Outlier


    In statistics, an outlier is a data point that differs significantly from other
    observations (Huang et al., 2019). An outlier can cause serious problems in statistical
    analysis and feature cleaning.


    Feature Imputation:


    *   Hot deck


    *   Cold deck


    *   Mean substitution


    *   Regression


    Feature Engineering:


    *   Decompose


    *   Discretization


    *   Continuous features


    *   Categorical features


    *   Reframe numerical quantities


    *   Crossing


    Feature Selection:


    *   Correlation


    *   Dimensionality reduction


    *   Principal component analysis (PCA)


    *   Singular value decomposition (SVD)


    *   Importance


    *   Filter methods


    *   Wrapper methods


    *   Embedded methods


    Feature Encoding:


    *   Label encoding


    *   One hot encoding


    Feature Normalization:


    *   Rescaling


    *   Standardization


    *   Scaling to unit length


    Dataset Construction:


    *   Training dataset


    *   Test dataset


    *   Validation dataset


    *   Cross-validation


    ML Algorithm Mind Map


    See [Figure 2.7](#02_Chapter_2.xhtml#ch2fig7).


    ![Image](images/fig2.7.jpg)


    Figure 2.7 ML algorithm mind map


    ML Algorithms


    A ML algorithm is a method used to process data to extract patterns that can be
    applied in a new situation (Andriosopoulos et al. 2019). The goal is to apply
    a system to a specific input–output transformation task.


    ML and deep learning are embraced by ML algorithms. ML is a class of methods for
    automatically creating models from data. ML algorithms turn a dataset into a model,
    which is effective with supervised, unsupervised, classification, and regression
    algorithms.


    Typical examples are real-valued labels, which are the amount of rainfall or the
    height of a person. The first five algorithms are linear regression, logistic
    regression, classification and regression trees, Naïve Bayes, and k-nearest neighbors
    algorithm. These algorithms are examples of supervised learning.


    Classification'
