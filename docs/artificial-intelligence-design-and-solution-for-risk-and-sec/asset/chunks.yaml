- raw: 'The Bayesian network represents the causal probabilistic relationship among
    a set of random variables and their conditional dependencies. The network provides
    a compact representation of a joint probability distribution using a marked cyclic
    graph. By using a directed graphical model, Bayesian network describes random
    variables and conditional dependencies. For example, you can use a Bayesian network
    for a patient suffering from a disease.


    Decision Tree


    Decision tree analysis is a general, predictive modeling tool that has applications
    spanning several different areas. Decision trees are constructed using an algorithmic
    approach that identifies ways to split a dataset based on different conditions.
    It is one of the most widely used and practical methods for supervised learning.
    Decision trees are a nonparametric supervised learning method used for both classification
    and regression tasks. The goal is to create a model that predicts the value of
    a target variable by learning simple decision rules inferred from the data features.
    It is a tree-like graph with nodes representing the place to pick an attribute
    and ask a question. The edges represent the answers to the question, and the leaves
    represent the actual output or class label. It is used in nonlinear decision making
    with simple linear decision surface.


    Advantages:


    1.  Decision tree yield is extremely straightforward. It does not require any
    measurable learning to peruse and decipher decision trees. The graphical portrayal
    is natural and clients can undoubtedly relate their speculation.


    2.  Decision trees require less information cleaning contrasted with some other
    demonstrating systems. Decision trees are not strongly affected by exceptions
    and missing qualities.


    3.  Decision trees are viewed as a nonparametric technique. This implies that
    choice trees have no suspicions about the space appropriation and the classifier
