    ![Image](images/image_034_.jpg)


    Figure 2.14 ML use case map on how algorithms map to use cases


    Critical Measures:


    *   Net present value (NPV)


    *   ROI


    *   Internal rate of return (IRR)


    *   Payback period (PBP)


    *   Benefit–cost ratio (BCR)


    Critical Measures for Startups and Project Management


    NPV is a value in the form of a sum of money rather than a future value it would
    become when invested at compound interest. For example, $220 due in 12 months’
    time has a present value of $200 today if invested at an annual rate of 10 percent.


    ROI measures the gain or loss generated on an organization investment related
    to the amount invested. The ROI is usually expressed as a percentage and is used
    for personal financial decisions to compare a company’s profitability to different
    investments.


    The ROI formula is:


    ROI = (Net Profit/Cost of Investment) × 100


    The ROI calculation is flexible and has various uses. It can be used to calculate
    and compare potential investments or an investor could use it to calculate the
    return on a stock.


    The IRR is a metric used in capital budgeting to estimate profit of a potential
    investment. The IRR is a discount rate that makes the NPV of all cash flows from
    a project equal to zero. IRR calculations rely on the same formula as NPV does.


    NPV is the difference between the present value of cash inflows and the present
    value of cash outflows over a period. The NPV is used for capital budgeting and
    investment planning to analyze the profit of a projected investment or project.


    The PBP is the length of time required to pay back an investment. The payback
    period of a given investment or project can determine whether to undertake the
    position or project. If the payback is long, the project may not be desirable
    for the investment. The payback period does not consider the time value of money.
    Other formulas such as NPV, IRR, and discounted cash flow consider payback periods.


    The time value of money or present discounted value means the current value of
    money has more value than the future value due to its potential earning capacity.
    This core principle of finance maintains that provided money can earn interest;
    any amount of money is worth more the sooner it is received.


    The BCR is used as an indicator in cost–benefit analysis to determine the relationship
    between the relative costs and benefits of a proposed project. This is expressed
    in monetary or qualitative terms. If a project has a BCR greater than 1.0, the
    project is assumed to deliver a positive net present value to an investment.


    [CHAPTER 3](#contents.xhtml#c3)


    [Knowledge Base](#contents.xhtml#c3)


    Chapter Outline


    *   Define knowledge base for the artificial intelligence (AI) project


    *   Risk and security knowledge development


    *   Objectives of the risk and security knowledge base


    *   Identification of knowledge for risk and security


    *   Knowledge acquisition for risk and security


    *   Knowledge sharing


    Key Learning Points


    *   Learn and understand knowledge base


    *   Understand risk and security knowledge base development


    AI can be used repeatedly in applications with different needs. Human resources
    has been tough for organizations, and organizations have attempted to capture
    and use the human intelligence required for different roles. The captured knowledge
    and intelligence are stored in the knowledge base. Knowledge models can be built,
    trained, and used when necessary.


    Capturing human intelligence requires an integrated information system. The idea
    is to develop an integrated system that can provide the knowledge required by
    human experts. These integrated systems should be readily available and sharable.
    The integrated system should be used with strategic objectives in mind. This leads
    to the development of AI.


    AI solves important challenges based on the information stored in the knowledge
    base. Human experts have cyclical demands in their subject matter expertise. Similar
    approaches are applied to risk management and are explored with use cases.


    The knowledge base stores data, techniques, and algorithms that are used to drive
    the AI-integrated system. The integrated system will be introduced gradually in
    the approach. The objective of the AI-integrated system is to seek mitigation
    solutions to risk and security in corporate settings. The objectives will consider
    using business rules that consist of “what if” questions. This approach will use
    strategic rules and logic to determine possible mitigation solutions to risk and
    security using the stored data in the knowledge base. The AI-integrated system
    will impact setting knowledge objectives, identification of knowledge, knowledge
    acquisition, knowledge development, knowledge sharing, preservation of knowledge,
    fixing of knowledge, use of knowledge, evaluation of knowledge, and measurement
    of knowledge. Integration of AI case-based knowledge, representation of risk and
    security cases, identification of similarities, and connection are the building
    blocks of the knowledge base. Bizstats.ai uses the knowledge base to build AI-integrated
    systems from scratch.


    Risk and Security Knowledge Development


    The purpose of this section is to generate the risk and security knowledge required.
    This will include ideas, models, skills, processes, and system methods. Machine
    learning (ML) can have various forms. Pattern-based learning will be used when
    discussing ML and neural networks. This method provides appropriate knowledge
    from a large amount of risk and security data, enabling change of behavior of
    the captured data in the AI system.


    Objectives of the Risk and Security Knowledge Base


    Skills and knowledge will be developed using appropriate corporate objectives
    in the Bizstats.ai risk and security knowledge base.


    The objectives of the risk knowledge base are as follows:


    *   To capture the risks and associated risks from the data, process, people,
    Internet of Things (IoT), systems, and actions.


    *   To determine occurrence.


    *   To determine impact of risks.


    *   To determine risk priority.


    *   To allocate risk owner.


    *   To determine risk mitigation.


    *   To determine risk action.


    *   To risk continuously in real-time and determine corrective actions.


    The objectives of security knowledge base:


    *   To capture the threat and associated security risks from the data, process,
    people, IoT, systems, and actions.


    *   To determine threat occurrence.


    *   To determine impact of threats.


    *   To determine security threat priority.


    *   To allocate security owner.


    *   To determine security mitigation.


    *   To determine security action.


    *   To monitor security threat(s) continuously in real-time and determine corrective
    action.


    *   To recommend security training and efficient security process(s).


    Identification of Knowledge for Risk and Security'
