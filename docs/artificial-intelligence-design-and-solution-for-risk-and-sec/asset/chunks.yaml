  trans: "\n\n# 企业 AI 知识库：风险与安全\n\n企业环境将用于建模使 AI 能够良好运行所需的技能和知识。这将需要对风险和安全知识进行映射。将尽一切努力以一种能够正确检索数据的形式存储数据。该\
    \ AI 系统将允许访问收集到的数据。最终，系统应构建一个能够通过新的风险和安全数据进行扩展的企业知识库。AI 系统将防止任何信息丢失，保留信息，并保持风险和安全数据的最新状态。系统将自动具备构建知识库的能力，并且可以访问外部的额外信息。\n\
    \n## 风险与安全的知识获取\n\n风险和安全数据将通过正式和非正式渠道收集。这些数据将在内部和外部使用，并将赋予 AI 系统合适的能力。最终，这些数据将与统计算法和\
    \ ML 算法结合使用。\n\n## 知识共享\n\n风险与安全知识共享是知识管理周期中的关键环节。重要的是要认识到人员、技术和企业界都是这一阶段的一部分。AI\
    \ 知识共享解决方案由机器智能组成，能够通过实时连接利用实时应用程序编程接口从其他 AI 系统中学习。事实证明，发现特定领域（如风险与安全缓解）的趋势是有效的。AI\
    \ 已被高效应用的另一个领域是车辆制造业。人类无需经历重复使用数据的繁琐过程；计算机系统能高效地完成工作，而不会让人不堪重负。Bizstats.ai 拥有访问实时应用程序编程接口的权限，以解决知识共享问题。\n\
    \n# 第 4 章：根因分析与分析\n\n确定已识别风险的根因，以及将要使用的分析与分析方法。\n\n## 根因分析与分析详情\n\n每个已识别的风险将分配给风险责任人。\n\
    \n风险责任人必须彻底研究风险以进行根因分析，从而获得关于风险及其成因的详细知识。\n\n根因分析与分析需要完整的人工交互，以支持深入分析。\n\n## 风险缓解策略建议\n\
    \n### 风险缓解策略\n\n*   **假设并接受**\n    *   确认特定风险的存在，并做出审慎决定接受该风险，而不采取特殊措施进行控制。需要项目或项目组负责人的批准。\n\
    *   **规避**\n    *   调整项目需求或约束条件以消除或降低风险。这种调整可通过资金、进度计划或技术要求的变更来实现。\n*   **控制**\n\
    \    *   实施行动以最小化风险的影响或发生可能性。\n*   **转移**\n    *   将组织问责制、责任和权限重新分配给另一个愿意接受该风险的利益相关者。\n\
    *   **观察和监控**\n    *   监控环境变化，以了解其对风险性质和影响的作用。\n\n# 第 5 章：推荐引擎\n\n推荐引擎展示了如图 5.1\
    \ 所示的逻辑流程。推荐引擎为风险缓解和风险应急推荐策略。\n\n![Image](img/image_035_.jpg)\n\n**图 5.1** 推荐引擎\n\
    \n## 数据收集\n\n收集风险数据始于表 5.1、表 5.2、表 5.3 和 5.4 (Hahn 2018; Elswick 2016; Phillips\
    \ and Stawarski 2008) 所示的数据收集过程。\n\n### 表 5.1 风险数据集\n\n| 度量风险名称 | 风险类别 | 风险影响评分\
    \ | 风险发生概率 | 风险优先级评分 |\n| --- | --- | --- | --- | --- |\n| 销售额下降 | 财务/竞争风险 | 0.9\
    \ | 0.5 | 2 |\n| 库存周转率下降 | 库存风险 | 0.2 | 0.8 | 9 |\n| 库存减少 | 库存风险 | | | |\n| 销售额增加\
    \ | 库存风险 | | | |\n\n### 表 5.2 风险缓解策略数据集\n\n| 度量风险名称 | 风险缓解策略 | 采取缓解策略的次数 | 采取缓解策略的次数\
    \ / 度量风险发生的次数 |\n| --- | --- | --- | --- |\n| 销售额下降 | 鼓励客户增加在贵公司的支出 | 10 | 0.9\
    \ |\n| 库存周转率下降 | 修订业务策略 | 20 | 0.3 |\n| 库存减少 | 与供应商签订基于绩效的合同 | | |\n| 销售额增加 |\
    \ 改进预测模型 | | |\n\n### 表 5.3 交互矩阵\n\n| 风险缓解策略 | 缓解类型 |\n| --- | --- |\n| 开展新营销活动\
    \ | 规避 |\n| 增加库存 | 规避 |\n| 停止产品 | 控制 |\n| 获取新客户 | 获取 |\n| 保持现有客户满意 | 维持 |\n| 鼓励客户增加在贵公司的支出\
    \ | 增长 |\n| 挽回流失客户 | 夺回 |\n| 修订业务策略 | 控制 |\n| 与供应商签订基于绩效的合同 | 控制 |\n| 改进预测模型 |\
    \ 控制 |\n\n### 表 5.4 风险-安全策略\n\n| 风险/缓解策略 | 开展新营销活动 | 减少库存 | 修订业务策略 | 与供应商签订基于绩效的合同\
    \ | 改进预测模型 |\n| --- | --- | --- | --- | --- | --- |\n| 销售额下降 | 5 (采取此策略的次数) |\
    \ 0 | 2 | 0 | 1 |\n| 库存周转率下降 | 1 | 5 | 3 | 0 | 1 |\n| 库存减少 | 0 | 0 | 0 | 4 | 0\
    \ |\n| 销售额增加 | 0 | 0 | 0 | 0 | 5 |\n\n## 设计算法\n\n推荐引擎可以基于风险-风险相似性模型或缓解策略相似性模型进行设计。\n\
    \n### 确定推荐系统算法列表\n\n推荐系统中的机器学习 (ML) 算法：\n\n*   **基于内容的过滤方法**（项目属性的相似性）。\n*   **基于协同的过滤方法**（从交互中计算相似性，风险-风险或缓解策略相似性模型）：\n\
    \    *   K：最近邻。\n    *   矩阵分解：随机梯度下降。\n    *   矩阵分解：交替最小二乘法。\n    *   关联规则：Apriori\
    \ 算法（经常一起消费的项目在图中通过边相连）。\n    *   神经网络。\n*   **深度自编码器**——具有多个隐藏层和非线性，功能更强大但更难训练——可用于预处理项目属性，并结合基于内容和基于协同的方法。\n\
    *   **神经网络**基于项目和用户属性预测评分和交互。\n*   **深度神经网络**基于历史动作和内容预测下一步动作。\n*   **深度自编码器**：协同过滤。\n\
    *   **深度和宽度回归集成**以预测评分。\n*   **基于序列的推荐器**可通过传统 ML 模型实现。\n*   **门控循环单元** 或 **长短期记忆\
    \ (LSTM)** 循环神经网络。\n*   **深度卷积神经网络**。\n*   **前馈神经网络**将购买历史独热编码为输入，预测下一次购买产品的概率。\n\
    *   **两者结合**。\n*   **最终确定**。\n    *   使用基于协同的过滤方法训练模型。\n\n### 训练模型\n\n训练集（80%）和测试集（20%）。\n\
    \n测试集进一步划分为提交给系统的观察子集和用于评估系统的测试子集。\n\n### 评估模型\n\n*   评估方式类似于分类 ML 模型。\n*   均方根误差。\n\
    \n"
