  trans: "\n\n# 基于树的 Cubist 模型可用于开发一种称为“委员会”的集成分类器。\n\n委员会的概念类似于提升。这两个概念都通过调整权重按顺序开发一系列树；然而，最终预测是所有委员会成员预测的简单平均值，这一想法更接近装袋。\n\
    \n## 一条规则\n\n一条规则有时被称为十分之一规则。它是一条经验法则，用于确定在回归分析（生存分析中的比例风险模型和逻辑回归）期间可以估计多少预测参数，同时将过拟合的风险保持在较低水平。该规则规定，每\
    \ 10 个事件可以研究一个预测变量。\n\n## 零规则\n\n零规则是最简单的分类方法，它依赖于目标变量并忽略所有预测变量。零规则分类器预测多数类别（类）。例如，如果研究了\
    \ 300 名患者的样本，且研究期间有 20 名患者死亡，则十分之一规则意味着可以可靠地将两个预先指定的预测变量拟合到总数据中。同样，如果研究期间有 100\
    \ 名患者死亡，则可以可靠地拟合 10 个预先指定的预测变量。如果拟合更多，该规则意味着很可能发生过拟合，并且结果在训练数据之外将无法很好地预测。在变量众多的领域，1:10\
    \ 规则并不经常被违反，这降低了对报告结果的信心。\n\n## 重复增量剪枝以产生误差减少\n\n在机器学习中，重复增量剪枝以产生误差减少是由 William\
    \ W. Cohen 提出的一种命题规则学习器。\n\n## 贝叶斯\n\n贝叶斯算法涉及统计方法，这些方法基于实验和数据收集之前的经验或最佳猜测，分配概率、分布或参数（如总体均值）。贝叶斯算法在获得实验数据后应用贝叶斯定理来修正概率和分布。贝叶斯方法是指那些显式应用贝叶斯定理来解决分类和回归等问题的方法。\n\
    \n最流行的贝叶斯算法有：\n\n*   `Naive Bayes`\n*   `Gaussian Naive Bayes`\n*   `Multinomial\
    \ Naive Bayes`\n*   `Averaged one-dependence estimators`\n*   `Bayesian belief\
    \ network`\n*   `Bayesian network`\n\n`Bernoulli Naive Bayes` 是计算概率时使用的另一种模型。`Naive\
    \ Bayes` 模型易于构建。它没有复杂的迭代参数估计，这使其特别适用于超大数据集。\n\n`Naive Bayes` 分类器基于贝叶斯定理，并假设预测变量之间相互独立；换句话说，它假设某类中某特征的存在与任何其他特征无关，即使这些特征相互依赖或依赖于其他特征的存在。因此得名\
    \ `Naive Bayes`。请看公式：\n\n`Gaussian Naive Bayes` 用于基于二项分布数据的分类。\n\n*   `P(class|data)`\
    \ 是在给定预测变量（属性）的情况下类（目标）的后验概率。即在给定数据点的情况下，数据点属于任一类的概率。这是正在计算的值。\n*   `P(class)`\
    \ 是类的先验概率。这是我们的先验信念。\n*   `P(data|class)` 是在给定类的情况下预测变量的似然概率。这是高斯分布，因为这是正态分布。\n\
    *   `P(data)` 是预测变量的先验概率或边际似然。这在 `Naïve Bayes` 分类器中不计算。\n\n请参阅示例 图 2.9。\n\n![Image](img/ch2fig9.JPG)\n\
    \n图 2.9 分类示例\n\n请参阅下面的示例计算：\n\n步骤：\n\n1.  计算先验概率\n\n    `P(class) = 该类中的数据点数量\
    \ / 观测总数`\n\n    `P(yellow) = 10/17`\n\n    `P(green) = 7/17`\n\n2.  计算边际似然\n\n\
    \    `P(data) = 与观测相似的数据点数量 / 观测总数`\n\n    `P(?) = 4/17`\n\n    该值存在于检查两个概率中。\n\
    \n3.  计算似然\n\n    `P(data/class) = 该类中相似观测的数量 / 该类中的总点数。`\n\n    `P(?/yellow)=1/7`\n\
    \n    `P(?/green)=3/10`\n\n4.  每个类的后验概率\n\n5.  分类\n\n`P(class1/data)>P(class2/data)`\n\
    \n`P(green/?)>P(yellow/?)`\n\n![Image](img/Eq006.png)\n\n![Image](img/Eq007.png)\n\
    \n![Image](img/Eq008.png)\n\n较高的概率将被分配给该类别的类。计算显示概率为 75%，即绿色类。\n\n## 朴素贝叶斯\n\n\
    `Bernoulli Naive Bayes` 分类器假设所有特征均为二值，仅取两个值（例如，经过独热编码的名义分类特征）。它是一种监督机器学习算法，使用贝叶斯定理并假设特征在统计上是独立的。\n\
    \n## 朴素贝叶斯分类器\n\n`Naive Bayes` 分类器是一系列简单的概率分类器，通过应用贝叶斯定理并假设特征之间具有强（朴素）独立性而得出。`Naive\
    \ Bayes` 早在 1960 年代初就已出现；不过，当时使用的是不同的名称。它也曾在 1960 年代初用于文本检索领域。它是文本分类的一种流行基线方法，用于判断文档属于哪一类别（如垃圾邮件或合法邮件、体育或政治），以词频为特征。这是一种适用于风险和安全应用的好方法。当与支持向量机等更高级方法结合时，这种方法很流行。\n\
    \n值得注意的是，`Naive Bayes` 分类器具有高度可扩展性，且所需参数数量为学习问题中变量数量的若干倍。最大似然训练可以通过评估一个线性时间的闭式表达式来完成，而无需使用昂贵的迭代近似。`Naive\
    \ Bayes` 分类器模型广泛应用于统计学和计算机科学。\n\n## 平均单依赖估计器\n\n平均单依赖估计器是一种概率分类学习技术，被认为是最有效的 `Naive\
    \ Bayes` 算法。该技术通过平均所有依赖估计器来解决 `Naive Bayes` 的属性独立性假设问题。\n\n## 贝叶斯信念网络\n\n`贝叶斯信念网络`\
    \ 或 `贝叶斯网络` 是一种统计模型，用于描述不同随机变量之间的条件依赖关系。`贝叶斯网络` 是一种用于建模和推理不确定信念的工具。`贝叶斯网络` 由两部分组成：有向无环图形式的定性组件和条件概率形式的定量组件。\n\
    \n## 高斯朴素贝叶斯\n\n`Naive Bayes` 分类器技术基于贝叶斯定理，适用于输入维度较高的情况。该方法被称为“朴素”，因为它假设各属性值之间相互独立。`Naive\
    \ Bayes` 假设标签属性为二值、分类或名义型。如果输入变量为实值，则假设为高斯分布。如果数据的单变量分布为高斯或近高斯分布，该算法将表现更好。\n\n\
    ## 多项式朴素贝叶斯\n\n`Naive Bayes` 分类器是一个通用术语，指模型中每个特征的条件独立性。`Multinomial Naive Bayes`\
    \ 分类器是 `Naive Bayes` 分类器的一个特定实例，它对每个特征使用多项分布。多项式 `Naive Bayes` 用于 NLP 问题。`Naive\
    \ Bayes` 是一系列算法，它们应用贝叶斯定理并做出强烈的朴素假设，即每个特征都独立于其他特征，以预测给定样本的类别。\n\n## 贝叶斯网络\n\n"
