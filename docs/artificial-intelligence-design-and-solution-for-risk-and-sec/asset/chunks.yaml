- raw: 'Risks are involved in every action. It is a continuous problem to manually
    monitor the risks and mitigate large tasks (Rona-Tas et al., 2019). Solve this
    problem using ML and AI approaches.


    ML and AI for Security


    Security is a big problem for corporate and government organizations (McGraw et
    al., 2019). This problem can be solved using ML and AI approaches.


    Problem statements are defined very generically and may not focus on the correct
    problem statements. These statements can be divided into multiple problem statements;
    this process is illustrated in the AI solutions for risk and AI solutions for
    security chapters.


    Understand Existing and Current Business Architectures and Business Processes


    Ask the following questions when examining old and new business architectures:


    *   Who are the stakeholders, customers, users, and organizations?


    *   How should you define your vision, strategies, tactics, policies, rules, and
    regulations?


    *   What is the value stream through initiatives and projects and how is it measured?


    *   What capabilities are enabled and what proposals are made using gathered information?


    See [Figure 2.2](#02_Chapter_2.xhtml#ch2fig2).


    ![Image](images/ch2fig2.JPG)


    Figure 2.2 Business architecture process


    Business Architecture


    Business Process


    Business architecture is further broken down into the business process (Vaez-Alaei
    et al. 2018). The business process defines how the business operates, manages,
    and serves to meet the businesses’ objectives. Each organization may have unique
    business processes in the industry and functional areas. See [Figure 2.3](#02_Chapter_2.xhtml#ch2fig3).


    ![Image](images/ch2fig3.JPG)


    Figure 2.3 Typical business process


    Typically, chief executive officers are responsible for strategies, infrastructures,
    products, and services. Chief marketing officers are responsible for the marketing
    and sales domain. Chief operating officers are responsible for business operations.
    Nowadays, most organizations have introduced a new top management position called
    a chief data officer who manages data architecture, data design, data collection,
    data management, data processing, applying data science, ML, and AI. This role
    helps industries keep up with the latest technology transformations, such as moving
    to the Cloud infrastructure, ML, AI, and Internet of Things. In fact, all existing
    business processes are in the process of re-engineering and redefining to adopt
    technological transformations, including risk and security. All business functional
    areas and related business processes are at risk. This book illustrates how to
    automate business functional areas and related business processes using ML and
    AI.


    Look at the retail industry business process at a very high level. See [Figure
    2.4](#02_Chapter_2.xhtml#ch2fig4).


    ![Image](images/ch2fig4.JPG)


    Figure 2.4 Retail industry typical business processes


    Define Business Cases


    The business case must be defined for the problem statement (Haas et al. 2019).
    This process is illustrated for ML and AI using risk problem statements.


    Problem Statements:


    *   Risk is everywhere. Risks are involved in every action. It is a continuous
    problem to manually monitor risks and mitigate, especially in the case of huge
    tasks. The goal is to solve this huge problem by using ML and AI approaches.


    *   Security is a very big problem for corporate and government organizations
    and could be solved using ML and AI approaches.


    Identify Return on Investment (ROI) and Benefits:


    Organizations will save money on a daily basis by implementing ML and AI systems
    for risk and security. The human workforce will be free from manually identifying
    and mitigating risks and security. Approximate estimation of ROI would be at least
    $10,000, but this number depends on the size of the organization and the current
    time spent on the manual risk and security tasks. ML and AI also eliminate 24/7
    watchdog risk and security tasks.


    Strategic Alignment:


    Strategic alignment should align with business goals. The business goal of all
    organizations is to use the data to drive decisions and automation. The ML and
    AI implementation for risk and security aligns with the business goals.


    Investment: The investment would be minimal as it will be Software as a Service
    in the Cloud.


    Values:


    The organization will have peace of mind. The customers and partnering organizations
    will have more confidence.


    Efficiency:


    The organization’s operational processes and automation will be improved by 60
    times.


    Define Use Cases


    In this step, define or identify the use cases to be supported to a tangible outcome
    (Refactoring to Improve the Security Quality of Use Case Models 2019). Most of
    the ML and AI projects are diverted into research and development (R&D) projects,
    the reason being that use cases are identified up front. Use cases vary by industry
    and by business function, but some of them are listed below.


    Financial and banking industry:


    *   Prevention of credit loss and fraud.


    *   Avoidance of money laundering.


    *   Compliance with industry standards and government clauses.


    Retail industry:


    *   Avoidance of data breaches.


    *   Improve market share by competitive pricing.


    Determine the Goal


    The goal of ML and AI risk solutions is to capture all the risks items to identify,
    classify, and prioritize risks and gain prevention recommendations.


    The goal of the ML and AI security solutions is to prevent threats in real time.
    ML and AI security systems discover, detect, provide threat scores, threat protection,
    and prevention recommendations.


    Before going through each of the ML and AI project architecture and design steps,
    let us look at the typical data analytics project and its life cycle. Multiple
    streams of data analytics and life cycle projects may be needed to define the
    overall project architecture and design.


    Data Analytics and Life Cycle


    The data analytics life cycle is designed for large data problems and data science
    projects (Sahoo and Mohanty 2018). There are six phases, and the project work
    can occur in several phases simultaneously. The cycle is iterative to portray
    a real project. The work can return to previous phases as new information is uncovered.
    The data analytics life cycle consists of the following sequence of steps:


    Data analytics life cycle overview:


    1.  Phase 1: Discovery


    2.  Phase 2: Data preparation


    3.  Phase 3: Model planning


    4.  Phase 4: Model building


    5.  Phase 5: Communicate results


    6.  Phase 6: Operationalize


    The data scientist is the main analytics stakeholder. The data scientist provides
    analytic techniques and modeling. The other members are the team are as follows:


    1.  Business user: understands the domain area.


    2.  Project sponsor: provides high-level requirements and budgeting.


    3.  Project manager/agile/scrum master: ensures that objectives are met.


    4.  Data architect: provides business domain expertise based on deep understanding
    of the data.


    5.  Data engineer: provides technical skills, assists with data management and
    extraction, and supports analytic development areas.


    Here are the steps that go into the process. See [Figure 2.5](#02_Chapter_2.xhtml#ch2fig5).


    ![Image](images/ch2fig5.JPG)


    Figure 2.5 Data analytics life cycle


    Phase 1: Discovery


    The discovery phase follows this sequence of steps:


    1.  Learning the business domain


    2.  Resources


    3.  Framing the problem


    4.  Identifying key stakeholders


    5.  Interviewing the analytics sponsor


    6.  Developing initial hypotheses


    7.  Identifying potential data sources


    Phase 2: Data Preparation


    The following elements are included in the data preparation phase:


    1.  This phase includes steps to explore, preprocess, and condition the data.


    2.  This phase creates a healthy environment and analytics sandbox.


    3.  Data preparation tends to be the most labor-intensive step in the analytics
    life cycle.


    4.  At least 50 percent of the time for the tasks is spent in the data preparation
    phase.'
