    # Srini Centhala


    Srini Centhala is the founder and chief architect of Absolut-e Data Com (a data
    company) that had provided expert consulting services to Fortune 100 companies
    such AT&T, Directv, Experian, eBay, and UPS for more than 20 years. Srini is also
    the chief architect of BizStats Cloud Big Data AI Analytics platform. Srini has
    designed and developed pricing engines, statistical modeling, prediction modeling,
    recommendation engine, text mining, sentiment analysis, data source analysis,
    and data science activities.


    **Specialties:** Business process re-engineering, online business ideas, and concepts,
    business intelligence, technical architect/data architect/data modeler in the
    business data management system, project management, and undertaking full projects,
    end to end. Srini applies machine learning and artificial intelligence to business
    data.


    ![Image](images/Muthu_Shanmugam_Picture_BW.jpg)


    # Muthu Shanmugam


    Muthu Shanmugam is the chief technology officer at Absolut-e Data Com with more
    than 20 years of experience in all phases of the software development life cycle.
    Muthu holds a master of engineering from Anna University, India. He has worked
    with various enterprise organizations as a dynamic leader of software development
    teams. Currently, Muthu works on Bizstats.ai, a knowledge-base-powered business
    intelligence and analytics cloud designed for businesses with limited business
    intelligence resources. Key features include knowledge bases with numerous metrics
    and attributes for various industries, natural language processing-powered searches,
    dynamic reports, and dashboards. The company also features collaboration, which
    allows users to share reports and dashboards with their teams.


