    \nKey Learning Points\n\n*   Learn and understand introduction\n\nTarget Audience\n\
    \nThis book mainly focuses on how AI can be applied to risk and security management.\
    \ This book follows current trends of AI in the branch of natural language processing,\
    \ natural language question and answering systems of AI, conversational AI in\
    \ risk and security domains, AI supporting drones, AI Cybersecurity, Internet\
    \ of Things devices, and use cases.\n\nApplicable AI topics are targeted toward:\n\
    \n*   Corporate top executives, founders, chief technology officers, chief information\
    \ officers, chief data officers, chief security officers, chief risk officers,\
    \ data scientists, data architects, AI designers, AI engineers, project managers,\
    \ and consultants to understand how to manage risk and security using AI.\n\n\
    *   Students, teachers, and developers will find this book useful and practical.\
    \ It will provide an overview of many AI components and introduce how AI can be\
    \ used in large, medium, and small corporate environments.\n\n*   Anybody who\
    \ strives to understand how AI can be used for risk and security.\n\nWhat Do You\
    \ Get From the Book?\n\n*   Understand and learn how to apply AI to risk and security.\n\
    \n*   Design and apply knowledge-based AI solutions to solve risk and security\
    \ problems.\n\n*   Architecture and design of AI systems relies on the following:\
    \ \n\n    *   Subject matter experts: This means having a practical view of how\
    \ solutions can be used, not just developed. Case studies of risk and security\
    \ are used as examples in the book.\n\n    *   Appropriately applied mathematics\
    \ and algorithms are used in this book. Do not skip the mathematical equations\
    \ if you have the need to study them. AI relies heavily on mathematics.\n\n  \
    \  *   Applied physics and usage into hardware systems and futuristic approaches\
    \ from quantum computers to parallel processing of network of quantum computer\
    \ handlings. AI is still evolving. Give your full attention to new concepts and\
    \ applied creative ideas in the futuristic AI chapter.\n\n    *   Decision theory,\
    \ decision-making process, and the Markov decision process algorithm (Gupta and\
    \ Katarya 2018).\n\nWhat This Book Covers\n\nThis book introduces how AI is applied\
    \ to corporations; start-ups; and large, medium, and small companies to help automate\
    \ the tedious jobs of maintaining risk and security. Automation helps the working\
    \ environment of the organizations by applying AI and machine learning to aid\
    \ human experts.\n\n*   How does a company get true value from AI?\n\n*   What\
    \ are the business use cases for AI with visionary?\n\n*   How do I identify the\
    \ best business case for AI adoption and evaluate opportunities?\n\n*   Should\
    \ I build or buy an AI platform?\n\n*   How do I find and recruit top AI talent\
