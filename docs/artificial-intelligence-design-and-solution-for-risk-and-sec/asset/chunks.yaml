    # 20 世纪 90 年代不存在无人机，手机也不像现在这样容易获得且极具吸引力（Nassi 等人，2019 年）


    无人机可以被视为类似于手机。无人机拥有诸多能力，例如能在短时间内通过空中将物品运送至偏远地区。可运输的物品包括包裹递送和应急响应产品，以满足紧急和即时的需求。无人机能够飞行并检查不易到达的隐蔽场所。无人机可集成
    AI 功能，使其具备智能。


    ## 产生新的社会问题


    AI 是我们解决问题和提供新思维以造福人类能力的延伸。AI 有可能带来伟大的成果，包括以空前的速度推进发展。机器人与 AI 在业务运营中的融合，预示着基于
    AI 的产品和服务将引领消费和工业市场。消费和市场领域将因创新者和商业利益的不同而有所差异。AI 将面临挑战，例如网络安全问题。组织必须应对 AI 的负面影响，如隐私、安全和算法偏见方面的挑战。军队、空军和海军将致力于保护国家免受负面
    AI 创新的侵害。


    ## 投身商业与健康领域


    与消费者应用相关的 AI 和 ML 驱动算法可能会增加可信度。这种信心和信任将随着 AI 的持续存在而增强。这都是好事！


    当然，医生仍将存在以照顾患者；然而，医生的繁杂工作可以由 AI 完成。医生的知识和经验可以被捕获，并由 AI 系统不知疲倦地加以利用。医生将退休，而 AI
    系统将给予医生所需的休息以实现退休。AI 系统能够维护患者护理所需的最新创新、研究和经验。AI 可以访问并使用更大规模的患者数据集、治疗技术和药物进展。当机器为医生完成繁杂工作时，诊断结果将得到改善。


    ## 促进可持续发展


    AI 正在快速增长，并将影响每一个行业。更多的人在谈论 AI；AI 不再是一个新的流行语。AI 可以通过追踪城市居民的流动来提高城市的密度。


    ## 物理世界与数字世界的融合


    人们表达了希望计算机能更智能地与人类互动的需求。一个典型的例子是计算机指出发生的错误并自动做出反应以解决问题。另一种选择是通过与计算机对话来修复发生的问题。简而言之，计算机需要变得更聪明，而
    AI 可以实现这一点。


    ## AI 将使人类更聪明


    AI 和 ML 使用公式的趋势将持续下去，未来可能会涌现更多算法（Metcalf 等人，2019；Ford，2019）。数据量呈指数级增长将不足为奇。通过训练更智能的模型和知识模型，AI
    和 ML 将对未来行为和后续事件做出智能预测。金融环境中的人们可能会因 AI 和 ML 做出的决策而感到恐慌。重要的是模型经过适当训练，以继续作为对人类有用的工具而发展。


    ## 艺术家从 AI 中获得了什么？


    艺术家希望在 AI 中拥有利益相关地位，以使艺术家的工作更轻松、更有趣（Miller，2019）。艺术家将使用呈指数级涌现的众多算法。希望艺术家能利用 AI
    系统创作出赏心悦目、妙趣横生的美丽图像。艺术家可能担心他们的工作会被接管，从而使他们变得过时。这是一个可怕的念头；然而，艺术家可以利用 AI 系统在各个方面变得更有创造力。AI
    可以增强创作过程。在部署 AI 系统时，考量文明感、创造力和公平性至关重要。最终，使用艺术的行业可以利用 AI 提高生产力，同时尊重人类尊严和文化需求。


    ## 类人 AI


    在未来 5 到 10 年内，人们认为 AI 将开始展现类人智能，包括人类的认知能力（Joo 等人，2019）。计算机已经擅长重复性任务，但这不等同于拥有认知能力。通用人工智能（AGI）似乎正缓慢浮现。AI
    目前已用于 Uber 和电子邮件等技术中。Gmail 倾向于提供一些初步的电子邮件回复供用户在此基础上继续编写。


    AI 已被用于医院识别人类医生遗漏的患者疾病。这对患者是个鼓舞；然而，这一案例被归类为弱人工智能，并被称为 AGI。AGI 简单来说就是能够执行正常人类任务的机器。当前
    AI 的目标是开发一种机器，它必须证明自己具有智能，且能与人类区分开来。


    ## AI 预测调查


    2019 年人类水平人工智能联合多会议的参与者就未来 10 年 AI 进展的预测进行了一项调查（Strickland，2019）。调查结果显示，28%的受访者认为
    AGI 将在 20 年内出现。在 100%的受访者中，2%不认为人类将见证 AGI 的诞生。


    调查要求受访者指出 AI 影响最大的领域。结果显示如下：


    1. 医疗保健（46%）。

    2. 物流（47%）。

    3. 客户服务（38%）。

    4. 银行与金融（34%）。

    5. 农业、零售、软件开发和制造业（28%）。


    调查表明 AI 正呈指数级进步。


    2016 年进行的一项早期 AI 调查显示了不那么振奋人心的结果。调查问道：“还需要多少年 AI 才能达到高级机器智能？”高级机器智能被定义为无需辅助的机器能比人类工人更好、更廉价地完成任务。最终分析显示了达到
    AI 里程碑的 5%区间。具体结果表明，AI 机器最终将与人类智能具有竞争力。


    ## AI 的风险与安全影响


    AI 涉及两个极其重要的领域：就业和安全。AI 的增长归因于网络安全、司法（刑事和民事）以及劳动力市场模式。此外，职业易受自动化影响。


    ### AI 在风险与安全方面将如何发展？


    任何任务或项目都存在风险和安全问题。随着 AI 在未来被更多使用，这些问题将增加。AI 做决策的想法让一些人感到担忧；然而，通过培训和教育，人类将接受 AI
    在不同领域做决策的现实。


    以下是未来可能出现的一些预测性和虚构性想法。


    #### 金融行业领域


    我们可以进一步引入比特币等新技术。比特币能成为实际货币吗？这个问题引发了为保障所有人安全顾虑而进行的密集基础设施规划。与此相关的安全性和风险有助于防范黑客。


    一切都可能变成数字货币。拥有良好通信网络、并通过物联网（IoT）或连接设备访问云服务器环境的公司将管理金融业务。IoT 数据目前在商业世界中被大量收集。这为数据分析以及大数据工程师和团队有目的地处理收集到的数据创造了机会。


    #### 零售行业领域


    零售店可能不再需要人类；任何人都可以从任何商店拿取产品并直接通过比特币扣款。


    '
