- raw: "See [Figures 5.2](#05_Chapter_5.xhtml#ch5fig1), [5.3](#05_Chapter_5.xhtml#ch5fig3),\
    \ and [5.4](#05_Chapter_5.xhtml#ch5fig4).\n\n![Image](images/ch5fig2.JPG)\n\n\
    Figure 5.2 K-Nearest neighbors and association rules\n\n![Image](images/ch5fig3.JPG)\n\
    \nFigure 5.3 Model versus accuracy\n\n![Image](images/ch5fig4.JPG)\n\nFigure 5.4\
    \ Coverage versus recall: Recommendation engine evaluation\n\nIntroduce regularization\
    \ parameters to all algorithms to penalize recommendation of popular items.\n\n\
    *   Both recall and coverage should be maximized; recommender will be accurate\
    \ and give diverse recommendations for users to explore new content.\n\n*   Cold\
    \ starts do not have enough historical interactions (for item or user). Attribute\
    \ similarity (content-based similarity) may be used as collaborative filtering\
    \ methods that fail to generate recommendations.\n\n*   Cold start problems are\
    \ reduced when attribute similarity is taken into account. Encode attributes into\
    \ the binary vector and feeds it to recommender.\n\n*   Items clustered based\
    \ on their interaction similarity and attribute similarity are often aligned.\n\
    \nEvaluation Metrics for Recommendation Engines\n\n*   (a) Recall, (b) what proportion\
    \ of items that a user likes were actually recommended, and (c) the larger the\
    \ recall, the better the recommendations.\n\n*   (a) Precision, (b) out of all\
    \ the recommended items, how many did the user actually like?, and (c) the larger\
    \ the precision, the better the recommendations.\n\n*   (a) Root mean squared\
    \ error, (b) it measures the error in the predicted ratings, and (c) the smaller\
    \ the root mean squared error value, the better the recommendations.\n\n*   (a)\
    \ Ranking metrics and (b) considers the order of the products recommended: \n\n\
    \    *   (a) Mean reciprocal rank, (b) evaluates the list of recommendations,\
    \ and (c) the larger the mean reciprocal rank, the better the recommendations.\n\
    \n    *   (a) Mean average precision at cutoff k, and (b) the larger the mean\
    \ average precision, the more accurate the recommendations.\n\n    *   (a) Normalized\
    \ discounted cumulative gain, and (b) the higher the normalized discounted cumulative\
    \ gain, the better the recommendations.\n\nSee [Figures 5.5](#05_Chapter_5.xhtml#ch5fig5)\
    \ and [5.6](#05_Chapter_5.xhtml#ch5fig6).\n\n![Image](images/image_036_.jpg)\n\
    \nFigure 5.5 Confusion matrix\n\n![Image](images/ch5fig6.JPG)\n\nFigure 5.6 Evaluation\
    \ metrics for recommendation engines\n\n*   One algorithm is fine, but ensembles\
    \ are much more powerful.\n\n*   Balance exploration and exploitation because\
    \ exploring too much can lead to lower quality recommendation for some users,\
    \ whereas limited exploration can lead to suboptimal recommendations for all users.\n\
    \nModel Conclusion\n\nLSTM performed better than other algorithms for recommendation\
    \ engine.\n\nConclusion\n\nMany recommendation engines are available in the market.\n\
    \nReinforcement Learning (Q-Learning) for Recommendations\n\nReinforcement learning\
    \ has been shown to solve complex problems. Recently, reinforcement learning has\
    \ been used with great success in Google’s DeepMind Atari games (Sutton and Barto\
    \ 1998).\n\nUnderlying ML algorithms for Q-Learning do not have restrictions.\
    \ The model can be any regression algorithms; however, deep neural networks dominate\
    \ Q-Learning and reinforcement learning in general.\n\nOne key difference can\
    \ be noted when using logistic regression for instead of classification is the\
    \ data. In classification, the data are prelabeled with the correct class for\
    \ the model to predict. Reinforcement learning does not have prelabeled data.\
    \ Data are generated and these data have a reward signal that should be maximized.\n\
    \nThreat Response Recommendations\n\nSuppose a risk is observed and a list of\
    \ actions are taken. It is fed into the actor network, which decides what would\
    \ the next action should be.  It produces an ideal response embedding. It can\
    \ be compared with other response embeddings to find similarities. The best match\
    \ will be recommended for the risk.\n\nThe critic helps to judge the actor and\
    \ help it find out what is wrong.\n\nFor example, the recommender suggests an\
    \ action for a risk. The action was taken and receives an immediate reward of\
    \ $1,000; however, it may also happen that the action is undone in the future,\
    \ penalizing the company by $2,000. All future actions need to be taken into consideration.\
    \ See [Figure 5.7](#05_Chapter_5.xhtml#ch5fig7).\n\n![Image](images/image_037_.jpg)\n\
    \nFigure 5.7 Reinforcement learning algorithm generic process diagram\n\nThe network\
    \ consists of two layers: the actor and the critic. Each one resembles different\
    \ learning types. The actor learns policies (probabilities of which action to\
    \ choose next) and the critic is focused on rewards (Q-Learning).\n\nFirst, a\
    \ bunch of response embeddings are fed into the actor’s state representation module,\
    \ where they are encoded. Next, a decision is made in the form of a vector. The\
    \ action is combined with item embeddings and fed into the critic module, which\
    \ aims to estimate how good the reward is going to be.\n\nThe state module models\
    \ the complex dynamic risk-response interactions to pursue better recommendation\
    \ performance.\n\nFor a given risk, the network accounts for generating a response\
    \ is based on its states. The risk state denoted by the embeddings of its n latest\
    \ response taken is used as the input.\n\nCritic Network (Q-Learning) is used\
    \ to estimate how good the reward of the current state and action will be.\n\n\
    Four categories of features have been constructed: risk features, context features\
    \ as the state features of the environment, risk-response features, and response\
    \ features as the action features. The four features were input to the deep Q-network\
    \ to calculate the Q-value. A list of responses were chosen to recommend based\
    \ on the Q-value, and the user’s action on the response was included in the reward\
    \ the reinforcement learning agent received.\n\nRewards can be collected from\
    \ recommendation engines’ system log.\n\nRisk Contingency Recommendation\n\nRecommendation\
    \ engines are trained using the same steps as the threat response recommendation\
    \ engine. See [Table 5.5](#05_Chapter_5.xhtml#ch5tab5).\n\nTable 5.5 Risk contingency\
    \ dataset\n\n| Measure Risk Name || Risk Contingency Plan || \\# of Times Contingency\
    \ Plan Taken ||  # of Times Contingency Plan Taken/# of Times Measure Risk Occurred\
    \ |\n\n| --- | --- | --- | --- |\n\n| Sales amount decrease || Design new products\
    \ || 10 || 0.9 |\n\n| Inventory turnover decrease || Reduce price to boost sales\
    \ || 20 || 0.3 |\n\n| Inventory decrease || Create a list of alternative suppliers\
    \ for inventory items || 5 || 0.45 |\n\n| Sales amount increase || Fall back on\
    \ overstocked inventory items || 7 || 0.68 |\n\n[CHAPTER 6](#contents.xhtml#c6)\n\
    \n[Functional Domain](#contents.xhtml#c6)\n\nPurpose\n\nThis chapter describes\
    \ each of the main business functional areas of major risk and security for the\
    \ following business functional area:\n\n*   Sales and marketing (S&M) functional\
    \ area\n\n*   Customer relationship management (CRM) functional area\n\n*   Financial\
    \ management functional area\n\n*   Human resource functional area\n\n*   Manufacturing\
    \ functional area\n\n*   Operations management functional area\n\n*   Supply chain\
    \ management (SCM) functional area\n\n*   R&D functional area\n\n*   Artificial\
    \ intelligence (AI) and automation functional area\n\nS&M within the functional\
    \ area\n\n1.  Top risks in the area:\n\n    S&M is an important business functional\
    \ area for any business. S&M is the revenue generating functional area. Identifying\
    \ risk in this area takes higher priority before it hits the revenue and sales.\
    \ See the following reference:\n\n    [https://simplicable.com/new/marketing-risk](https://simplicable.com/new/marketing-risk)\n\
    \n2.  Security in the area:\n\nChief marketing officer’s top security threats\n\
    \n[https://cisoinsights.com/top-3-cyber-security-risks-every-chief-marketing-officer-care/](https://cisoinsights.com/top-3-cyber-security-risks-every-chief-marketing-officer-care/)\n\
    \nS&M Functional Area"
