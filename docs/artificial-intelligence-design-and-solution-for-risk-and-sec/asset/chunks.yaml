    # ML Algorithms


    A ML algorithm is a method used to process data to extract patterns that can be
    applied in a new situation (Andriosopoulos et al. 2019). The goal is to apply
    a system to a specific input–output transformation task.


    ML and deep learning are embraced by ML algorithms. ML is a class of methods for
    automatically creating models from data. ML algorithms turn a dataset into a model,
    which is effective with supervised, unsupervised, classification, and regression
    algorithms.


    Typical examples are real-valued labels, which are the amount of rainfall or the
    height of a person. The first five algorithms are linear regression, logistic
    regression, classification and regression trees, Naïve Bayes, and k-nearest neighbors
    algorithm. These algorithms are examples of supervised learning.


