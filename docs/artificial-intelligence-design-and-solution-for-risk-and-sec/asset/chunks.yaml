    # 作者简介


    ![Image](img/Archie_Picture_20191101_BW.jpg)


    Archie Addo 是一位顾问、教练、作家，以及项目和项目集经理。Archie 拥有计算机信息系统博士学位，专攻电子商务、密码学、专家系统和人工智能。Addo
    博士拥有约翰霍普金斯大学的执行数据科学认证和哈佛法学院的合同法证书。他是一名认证项目管理专业人士 (PMP)、认证 Scrum 大师和认证 Scrum 产品负责人。凭借在相互关联学科中超过
    20 年的经验，Archie 从事计算机科学、项目管理、采购、组织设计与开发、流程工程、质量管理和项目团队促进等工作。他曾担任软件开发经理、经理、顾问和高级项目经理等管理职位。


    Archie 是全球大会和印度大会项目管理协会 (PMI) 的主题专家评审员，也是 PMI 风险标准管理的贡献者。


    ![Image](img/SriniCenthala-picture-2020Feb11-1_BW.jpg)


