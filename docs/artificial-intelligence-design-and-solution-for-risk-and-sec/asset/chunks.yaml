- raw: 'S&M get involved with the operations and activities that promote and sell
    products and services. The strategy is to sell and distribute products or services.
    S&M includes research and development of pricing, research, development, distribution,
    customer service, sales, and communications. Typically, the sales department has
    an obligation to advise the marketing department with possible customers and focuses.


    The marketing department makes the decisions and the sales workforce uses the
    ideas to sell the products and services. An example could be software products.
    The sales workforce uses the ideas to sell the software packages. Both the marketing
    and sales jobs contribute information, ideas, and research to aid with marketing
    strategies and brainstorm approaches for various products and services that will
    lead to special promotions, sponsored events, and other ideas.


    The coordination between the marketing and sales departments can lead to risk
    and security issues. At all cost, organizations want to avoid those problems to
    increase sales and promotions.


    CRM Functional Area


    CRM is a tool used for contact and sales management. CRM enhances sales and promotes
    environmental relationships. CRM aids in coining strategic relationships and interactions
    with customers and potential customers. CRM promotes connection with customers,
    streamlines processes, and eventually improves an organization’s profitability.


    Important features of CRM:


    Contact management: CRM helps the organization better connect with customers.


    Mobility: CRM can access customer data and other important information on the
    customers.


    Analytics: CRM helps refine important actionable items that are defined by the
    organization.


    Customization: The CRM system is customizable to suit the organization in unique
    situations. A flexible CRM allows synchronization of operating systems that provide
    full control over the kind of data being used and updates and reevaluates the
    processes when required.


    Simplicity: CRM is simple to use. Employees using the system should embrace it
    to make it worthwhile. The CRM is easy to understand, intuitive to use, and straightforward
    in its reports.


    The aforementioned features are necessary in order to avoid risk and security
    issues.


    Other CRM risks are as follows:


    1.  Inappropriate CRM project assumptions that may cause confusion among stakeholders.


    2.  The project planning was ineffective and left out important parts of the requirements,
    leading to significant issues.


    3.  The data conversion is delayed due to problems with data conversion and incorrect
    data.


    4.  Incorrect processes are created in inappropriate business processes. Incorrect
    data added from another location creates confusion or unmatched datasets.


    5.  Failure to address challenges or risks in the system.


    6.  Lack of executive support that creates problems in the CRM project environment.


    7.  The organization perceived the CRM as a surplus application.


    8.  Inappropriate care of the CRM requirements by the workforce.


    9.  Users do not use the CRM system appropriately.


    10.  The risk is not being attended to appropriately.


    All identified risks must be mitigated appropriately to keep the environment safe.


    Financial Management Functional Area


    The financial management areas consist of strategy, marketing, finance, human
    resources, technology and equipment, and operations.


    The primary areas of business finance consist of the following:


    *   Corporate finance: This area covers the decisions an organization makes about
    financing.


    *   Investments: The corporation may decide to invest in assets. These assets
    may be short-term securities to long-term securities, such as stocks and bonds.


    *   Financial markets and institutions: The financial markets may include stock
    and bond markets, the primary and markets, and the money and capital between markets.
    Financial markets may include the stock market. Financial markets are used to
    transfer funds saver funds to fund users. Typically, savers are household and
    users tend to be businesses and the government.


    The three areas tend to overlap and tend to cover distinct aspects of finance.


    There are risks in financial management, such as an entity making an investment
    decision that exposes financial risks. The different types of risks in finance
    are credit risk (i.e., if an organization takes a loan and not able to pay back),
    liquidity risk, and equity risk (the third type of financial risk).


    Financial risks must be assessed completely to determine loss on an asset, loan,
    or investment. The rate of return needs to be determined and effort must be made
    for a particular investment to succeed.


    Human Resource Functional Area


    Human resources manage valuable resources for positions with other organizations.
    The human resources recruiter recruits new hires, maintains benefits and payroll,
    mediates conflict, and engages in training and development of new hires. Here
    are other functions of human resources:


    *   Employee and labor relations.


    *   Strategic management.


    *   Workforce planning and employment that includes recruitment and selection
    of opportunities.


    *   Human resource development of new hire employee training and development.


    *   Ensure that employees are managed well to cut labor costs.


    *   Protect employee rights and ensure that employees operate within the scope
    of the employer requirements and regulations.


    *   Total rewards for employee compensation and benefits.


    *   Policy formulation for the recruitment organization as well as the client
    organization.


    *   Ensure that risk management is done well.


    Human resources has two types of risks: production decrease and reduction of human
    resource. These risks must be mitigated by means of risk management. Typical mitigations
    are increasing productivity (i.e., strategic planning that minimizes the probability
    of financial losses) based on excellent leadership (i.e., trust, motivation, planning,
    delegation of authority, and the development of policies and procedures to document
    best practices), training (i.e., a systematic approach, patience, and an honest
    evaluation), communication, evaluation skills, motivation (i.e., motivate the
    employee), evaluation, and conflict resolution.


    Manufacturing Functional Area


    The following are some of the risks in the manufacturing functional area:


    *   Emerging markets can be unpredictable.


    *   The supply chain has the tendency to be delayed or disrupted for various reasons.


    *   Third-party vendors caused by a stakeholder who the manufacturing organization
    is doing business with.


    *   Information technology is a technology problem and can occur for various reasons.


    *   Staff management and succession planning can be a problem if not done well.


    *   Risk can set in and create disruption if the workforce in the manufacturing
    environment is not proactive.


    Here are additional risks in the manufacturing functional area:


    *   Data collection must be done well on the following items: information regarding
    inventory, supply, deliveries, quality, production, customer support, processing,
    and day-to-day management.


    *   Unexpected catastrophic equipment failures may cause dramatic delays.


    *   Data collected may be inaccurate.


    *   Possibility of slow onboarding and knowledge loss due to new employees becoming
    familiar with the work environment and functionalities.


    *   Working with machines and new processes can be overwhelming sometimes.


    All the risks and security issues can be mitigated appropriately.


