- raw: 'Gmail is an e-mail application by Google that uses ML techniques to determine
    if an e-mail received is a spam based on the sender, recipients, subject, and
    message body of the e-mail. Classification takes a set of data with known labels
    and labels new records based on that information.


    Further classification is a family of supervised ML algorithms that designate
    input as belonging to a predefined class.


    Some common use cases for classification include:


    1.  Credit card fraud detection.


    2.  E-mail spam detection.


    3.  Classification data are labeled, for example: spam and nonspam or fraud and
    nonfraud. ML assigns new data to a class.


    4.  Classification based on predetermined features.


    5.  Features the “if” questions.


    6.  The label answers the “if” questions, for example: if it walks, flies, and
    whistles like a bird, the label is “bird.”


    Clustering


    Clustering can be used for search results grouping, grouping of customers, anomaly
    detection, and text categorization.


    Google News uses a technique called clustering to group news articles into categories
    based on title and content. Clustering algorithms discover groupings that occur
    in collection of data. Clustering places objects into categories by analyzing
    similarities between inputs.


    Clustering uses unsupervised ML algorithms that do not have the outputs in advance:


    1.  Clustering uses the K-means algorithm to initialize all the coordinates to
    centroids.


    2.  With every pass of the algorithm, each point is assigned to its nearest centroid
    based on some distance metric, usually Euclidean distance.


    3.  The centroids are updated to be the “centers” of all the points assigned to
    it in that pass.


    4.  This process repeats until a minimum change in the centers occurs.


    K-means Clustering


    The K-means clustering algorithm is popular because it can be applied to relatively
    large sets of data. The user specifies the number of clusters to be found and
    the algorithm separates the data into spherical clusters by finding a set of cluster
    centers, assigning each observation to a cluster, and determining new cluster
    centers.


    The sample space is initially partitioned into K-clusters and the observations
    are randomly assigned to the clusters. For each sample, the distance from the
    observation to the centroid of the cluster should be calculated. If the sample
    is closest to its own cluster, leave it or select another cluster.


    Repeat steps 1 and 2 until no observations are moved from one cluster to another.
    When the clusters are stable, each sample is assigned a cluster, which results
    in the lowest possible distance to the centroid of the cluster.


    Collaborative Filtering


    Amazon uses a ML technique called collaborative filtering (commonly referred to
    as recommendation) to determine which products users will like based on their
    history and similarity to other users who bought similar products.


    Collaborative filtering algorithms recommend items based on preference information
    from many users. The goal of a collaborative filtering algorithm is (a) to take
    preferences data from users and (b) to create a model that can be used for recommendations
    or predictions.


    Random Forests


    Random forests or random decision forests are a collective learning method for
    classification, regression, and other tasks. These forests operate by constructing
    a multitude of decision trees at training time and outputting the mode of the
    classes (classification) or mean prediction (regression) of the individual trees.
    Random decision forests compensate for decision trees’ habit of overfitting their
    training set.


    Association Rules


    The association rules are the statements that show the probability of relationships
    between data items in large datasets in various types of databases. Association
    rule mining has several applications and is widely used to help discover sales
    correlations in transactional data or discover diagnoses in medical data. Other
    applications use associated rules in decision making.


    Regression


    Regression is used frequently in finance statistical measurements, investing,
    and other disciplines that attempt to determine the strength of the relationships
    between one dependent variable (usually denoted by Y) and a series of other changing
    variables (known as independent variables) (Liu et al. 2019).


    Typical regressions such as linear regression can be used to quantify the relative
    impacts of age, gender, and diet (the predictor variables) on height (the outcome
    variable). Linear regression is also known as multiple regression, multivariate
    regression, ordinary least squares, and regression. Regression techniques are
    used for predictive modeling and data mining tasks. On average, only two or three
    types of regression are commonly used.


    Linear Regression


    Linear regression is a ML algorithm based on supervised learning. Regression models
    target prediction values based on independent variables. This algorithm is mostly
    used to examine the relationship between variables and forecasting. Regression
    models differ based on the relationship between the dependent and independent
    variables and the number of independent variables being used.


    Linear regression predicts the value of a dependent variable (y) based on a given
    independent variable (x). This regression technique discovers the linear relationship
    between x\-input and y\-output.


    Linear regression is used in statistical calculations. In simple linear regression,
    a single independent variable is used to predict the value of a dependent variable.
    In multiple linear regression, two or more independent variables are used to predict
    the value of a dependent variable. The difference between the two is the number
    of independent variables.


    Linear regression can be used to model the relationship between two variables
    by fitting a linear equation to observed data. One variable is an explanatory
    variable, and the other is a dependent variable. For example, a modeler might
    want to relate the weights of individuals to their heights using a linear regression
    model.


    Before attempting to fit a linear model to observed data, a modeler should first
    determine if there is a relationship between the variables of interest. This does
    not necessarily mean that one variable causes the other (e.g., higher exam passing
    scores do not cause higher college grades); however, some significant association
    is present between the two variables. A scatterplot may be used to determine the
    strength of the relationship between two variables. If there appears to be no
    association between the proposed explanatory and dependent variables (i.e., if
    the scatterplot does not indicate an increasing or decreasing trends), fitting
    a linear regression model to the data will not provide a useful model. This means
    another approach, such a problem solution, should be used.


    A valuable numerical measure of association between two variables is the correlation
    coefficient, which is a value between −1 and 1, indicating the strength of the
    association of the observed data for the two variables. Let us demonstrate how
    it works out. A linear regression line has an equation of the form Y = a + bX,
    where X is the explanatory variable and Y is the dependent variable. The slope
    of the line is b, and a is the intercept (the value of y when x = 0).


    Logistic Regression


    Logistic regression is named for the function used at the core of the method:
    the logistic function. The logistic function is also called the sigmoid function.
    This function was developed by statisticians to describe properties of population
    growth in ecology. It is an S-shaped curve that can take any real-valued number
    and map it into a value between 0 and 1, but never exactly at those limits.


    Ordinary Least Square Regression (OLSR)'
