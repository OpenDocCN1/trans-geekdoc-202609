    ## 摘要


    各种风险、安全问题和灾难已在环境和企业界发生（Peters 2018; Gheuens et al. 2019）。若采用适当的方法，可利用缓解措施应对风险和安全事件。必须采取特定方法来缓解事态，并进一步推荐缓解策略。专家需要尽早识别相关风险和安全隐患，以保障局势并将影响降至最低。风险与安全管理在不确定性情况下发挥着重要作用。以下是一些与风险与安全管理相关的关键问题：如何在类似情况下尽早预测并处理这种情况？这些事件能否被历史性地记录？能否识别此类事件的模式？能否采集与事件相关的数据？这些数据能否用于预测未来事件？数据的相关性是否为重要因素？安全是否重要？如果数据被篡改会怎样？数据是如何被篡改的？如何保护和确保数据安全？安全是风险管理的驱动因素，并在数据中发挥着重要作用。


    各类风险与安全适用于不同的行业、业务职能、角色和职责。本书旨在通过建议定义、分析、监控、控制和缓解风险的方法，说明适用于各行业的顶级业务案例和用例（Morosan
    and DeFranco 2019; Aydos et al. 2019）。这种方法利用数据并采取纠正措施来缓解风险。此类分析耗时较长，因为人类无法快速分析海量数据。人们可以利用数据科学、数据分析和机器学习（`ML`）算法来加速这一过程。


    人工智能（`AI`）使机器能够通过持续学习新的输入数据集，从以往的人类经验中学习。数学算法的发展显著推动了 `ML` 的创建，并引发了当今的 `AI` 革命。


    在本书中，`AI` 将通过各种案例研究用于缓解风险，读者将能理解并从中受益。`AI` 在业务中产生了显著且卓有成效的结果。许多组织渴望理解并提升风险管理技能，以改善其应对风险的能力。


    由于数据量大、速度各异、种类繁多，风险与安全已变得无处不在。这些生活层面似乎正变得规模更大、频率更高，且往往伴随负面影响。人们可以利用不确定量的风险来强化自身地位。风险与安全的范围与广度在世界各地及各类项目中造成了巨大混乱。风险与安全管理在组织中至关重要，因为缺乏它，组织可能难以确立目标。实施战略最重要的原因是对财务损失的恐惧。本书聚焦于问题陈述及相应用例，并利用数据科学和
    `ML` 方法提出 `AI` 解决方案。


    在本书中，我们希望为众多组织面临的关键问题提供具体答案：这些风险和安全问题在哪里？可以采取什么措施降低其影响？`AI` 是风险与安全缓解答案的一部分吗？


    ## 关键词


    项目管理；建筑管理；项目群管理；技能发展；风险、安全；人工智能；分析；机器学习；缓解；绩效评估；数据科学和商业智能


    ## 目录


    - *致谢*

    - 第 1 章 简介

    - 第 2 章 人工智能/机器学习项目架构与设计

    - 第 3 章 知识库

    - 第 4 章 根因分析与研判

    - 第 5 章 推荐引擎

    - 第 6 章 职能领域

    - 第 7 章 面向未来的人工智能

    - 第 8 章 结论

    - *参考文献*

    - *作者简介*

    - *索引*


    ## 致谢


    我们在人工智能（`AI`）设计和风险与安全解决方案方面的专家们已遍布企业界，积累了知识和专长。`AI` 和风险研究者对我们的思维和本书内容产生了深远影响。随后，为众多企业客户提供服务极大地影响了本书素材的准备。


    感谢我们的父母，Godson Addo、Mary (Vanderpuije) Addo、Seetharaman Centhala、Thulasi Centhala、K.
    Shanmugam 和 S. Saroja，鼓励我们接受教育并在各自的工作领域勤奋耕耘。没有他们的支持，我们认为无法走到今天。


    我们要向家人表达谢意：Louvaine Addo、Mala Srini 和 Kavitha Muthu；Archie 和 Srini 的孩子们：Koushik
    Seethula、Shashank Seethula 和 Srima Seethula；以及 Muthu 的孩子们：Maanasa Muthu 和 Sarvesh
    Muthu，感谢他们对我们繁忙日程的共同包容。


