- raw: "The tree-based cubist model can be used to develop an ensemble classifier\
    \ using a scheme called “committees.” The concept of committees is similar to\
    \ boosting. Both concepts develop a series of trees sequentially with adjusted\
    \ weights; however, the final prediction is the simple average of predictions\
    \ from all committee members, which is an idea closer to bagging.\n\nOne Rule\n\
    \nOne rule is sometimes referred to as one in ten rule. It is a rule of thumb\
    \ for how many predictor parameters can be estimated during regression analysis\
    \ (proportional hazards models in survival analysis and logistic regression) while\
    \ keeping the risk of overfitting low. The rule states that one predictive variable\
    \ can be studied for every 10 events.\n\nZero Rule\n\nThe zero rule is the simplest\
    \ classification method that relies on the target and ignores all predictors.\
    \ The zero rule classifier predicts the majority category (class). For example,\
    \ if a sample of 300 patients are studied and 20 patients die during the study,\
    \ the one in ten rule implies that two prespecified predictors can be reliably\
    \ fitted to the total data. Similarly, if 100 patients die during the study, 10\
    \ prespecified predictors can be fitted reliably. If more are fitted, the rule\
    \ implies that overfitting is likely and the results will not predict well outside\
    \ the training data. The 1:10 rule is not often violated in fields with many variables,\
    \ which decreases the confidence in reported findings.\n\nRepeated Incremental\
    \ Pruning to Produce Error Reduction\n\nIn ML, repeated incremental pruning to\
    \ produce error reduction is a propositional rule learner proposed by William\
    \ W. Cohen.\n\nBayesian\n\nBayesian algorithms involve statistical methods that\
    \ assign probabilities, distributions, or parameters such as a population mean\
    \ based on experience or best guesses before experimentation and data collection.\
    \ Bayesian algorithms apply Bayes’ theorem to revise the probabilities and distributions\
    \ after obtaining experimental data. Bayesian methods are those that explicitly\
    \ apply Bayes’ theorem for problems such as classification and regression.\n\n\
    The most popular Bayesian algorithms are:\n\n*   Naive Bayes\n\n*   Gaussian Naive\
    \ Bayes\n\n*   Multinomial Naive Bayes\n\n*   Averaged one-dependence estimators\n\
    \n*   Bayesian belief network\n\n*   Bayesian network\n\nBernoulli Naive Bayes\
    \ is the other model used in calculating probabilities. A Naive Bayes model is\
    \ easy to build. It has no complicated iterative parameter estimation, which makes\
    \ it particularly useful for very large datasets.\n\nNaive Bayes classifier is\
    \ based on Bayes’ theorem with the independence assumptions between predictors;\
    \ in other words, it assumes that the presence of a feature in a class is unrelated\
    \ to any other features even if these features depend on each other or upon the\
    \ existence of the other features. Thus, the name Naive Bayes. See the formula:\n\
    \nGaussian Naive Bayes is used for classification based on the binomial distribution\
    \ data.\n\n*   P(class|data) is the posterior probability of class (target) given\
    \ predictor (attribute). The probability of a data point having either class,\
    \ given the data point. This is the value being calculated.\n\n*   P(class) is\
    \ the prior probability of class. This is our prior belief.\n\n*   P(data|class)\
    \ is the likelihood of the probability of predictor given class. This is Gaussian\
    \ because this is a normal distribution.\n\n*   P(data) is the prior probability\
    \ of predictor or marginal likelihood. This is not calculated in the Naïve Bayes\
    \ classifiers.\n\nSee example [Figure 2.9](#02_Chapter_2.xhtml#ch2fig9).\n\n![Image](images/ch2fig9.JPG)\n\
    \nFigure 2.9 Example classification\n\nSee example calculation below:\n\nSteps:\n\
    \n1.  Calculate Prior Probability\n\n    P(class) = Number of data points in the\
    \ class/total no. of observations\n\n    P(yellow) = 10/17\n\n    P(green) = 7/17\n\
    \n2.  Calculate Marginal Likelihood\n\n    P(data) = Number of data points similar\
    \ to observation/total no. of observations\n\n    P(?) = 4/17\n\n    The value\
    \ is present in checking both the probabilities.\n\n3.  Calculate Likelihood\n\
    \n    P(data/class) = Number of similar observations to the class/total no. of\
    \ points in the class.\n\n    P(?/yellow)=1/7\n\n    P(?/green)=3/10\n\n4.  Posterior\
    \ Probability for Each Class\n\n5.  Classification\n\nP(class1/data)>P(class2/data)\n\
    \nP(green/?)>P(yellow/?)\n\n![Image](images/Eq006.png)\n\n![Image](images/Eq007.png)\n\
    \n![Image](images/Eq008.png)\n\nThe higher probability will be assigned to the\
    \ class of the category. The calculation shows a 75 percent probability, which\
    \ is the green class.\n\nNaive Bayes\n\nThe Bernoulli Naive Bayes classifier assumes\
    \ that all the features are binary and take only two values (e.g., a nominal categorical\
    \ feature that has been one-hot encoded). It is a supervised ML algorithm that\
    \ uses the Bayes’ theorem and assumes that features are statistically independent.\n\
    \nNaïve Bayesian Classifier\n\nNaive Bayes classifiers are a family of simple\
    \ probabilistic classifiers derived by applying Bayes’ theorem with strong (naive)\
    \ independence assumptions between the features. Naive Bayes has been around since\
    \ early 1960; however, it used a different name. It was also used for the text\
    \ retrieval community in early 1960. It is a popular baseline method for text\
    \ categorizations and the problem of judging documents as belonging to one category\
    \ or the other (such as spam or legitimate, sports or politics) with word frequencies\
    \ as the features. This is a good method for risk and security application. This\
    \ method is popular when combined with more advanced methods such as support vector\
    \ machines.\n\nIt is important to note that Naive Bayes classifiers are highly\
    \ scalable and require several parameters in the number of variables in a learning\
    \ problem. Maximum likelihood training can be done by evaluating a closed-form\
    \ expression that takes linear time, rather than using expensive iterative approximation.\
    \ Naive Bayes classifier models are widely used in statistics and computer science.\n\
    \nAveraged One-Dependence Estimators\n\nThe averaged one-dependence estimators\
    \ is a probabilistic classification learning technique and is considered the most\
    \ effective Naive Bayes algorithm. This technique addresses the attribute independence\
    \ assumption of Naive Bayes by averaging all the dependence estimators.\n\nBayesian\
    \ Belief Network\n\nA Bayesian Belief Network or Bayesian Network is a statistical\
    \ model used to describe the conditional dependencies between different random\
    \ variables. A Bayesian network is a tool for modeling and reasoning with uncertain\
    \ beliefs. A Bayesian network consists of two parts: a qualitative component in\
    \ the form of a directed acyclic graph and a quantitative component in the form\
    \ with conditional probabilities.\n\nGaussian Naive Bayes\n\nThe Naive Bayes classifier\
    \ technique is based on the Bayesian theorem and is appropriate when the dimensionality\
    \ of the inputs is high. The approach is called “naïve” because it assumes the\
    \ independence between the various attribute values. Naive Bayes assumes label\
    \ attributes such as binary, categorical, or nominal. A Gaussian distribution\
    \ is assumed if the input variables are real valued. The algorithm will perform\
    \ better if the univariate distributions of your data are Gaussian or near-Gaussian.\n\
    \nMultinomial Naive Bayes\n\nThe Naive Bayes classifier is a general term, which\
    \ refers to conditional independence of each of the features in the model. A Multinomial\
    \ Naive Bayes classifier is a specific instance of a Naive Bayes classifier, which\
    \ uses a multinomial distribution for each of the features. The multinomial Naive\
    \ Bayes is used for NLP problems. Naive Bayes is a family of algorithms that applies\
    \ Bayes theorem with a strong, naive assumption that every feature is independent\
    \ of the others to predict the category of a given sample.\n\nBayesian Network"
