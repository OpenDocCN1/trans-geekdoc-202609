  trans: '


    # PLS 回归


    PLS 回归将预测变量简化为一组较小的不相关成分，并在这些成分上执行最小二乘回归，而不是在原始数据上。当预测变量高度共线时，PLS 回归非常有用。当预测变量多于观测值，且普通最小二乘回归产生高标准误系数或失效时，该技术非常理想。与多元回归不同，PLS
    不假设预测变量是固定的。这意味着预测变量可以包含测量误差，使得 PLS 在测量不确定性时更加稳健。


    # Sammon 映射


    Sammon 映射是一种算法，它通过在低维投影中保持高维空间中点间距离的结构，将高维空间映射到低维空间。它特别适合用于探索性数据分析。Sammon 映射由
    John W. Sammon 于 1969 年创建。它被认为是一种非线性方法，因为该映射不能表示为原始变量的线性组合，这使得 Sammon 映射难以用于分类应用。


    # 多维缩放


    多维缩放是一种可视化数据集中个体案例相似性水平的手段。该技术用于将一组 n 个对象或个体之间的成对距离信息，转化为映射到抽象笛卡尔空间中的 n 个点的配置。


    # 投影追踪


    投影追踪是一种统计技术，用于在多维数据中寻找最“有趣”的投影。通常，偏离正态分布程度越大的投影越有趣。


    # 主成分回归


    主成分回归是一种源自 `PCA` 的回归分析技术。它基于标准线性回归模型，考虑将结果（预测值）对一组协变量（也称为预测变量、解释变量或自变量）进行回归，并使用
    `PCA` 来估计模型中未知的回归系数。当两个或多个解释变量接近共线时，主成分回归有助于克服多重共线性问题。这在高维协变量设置中非常有用。通过适当选择主成分，`PCR`
    可以基于假设模型实现对结果的有效预测。


    # PLS 判别分析 (PLS-DA)


    `PLS-DA` 是一种适应性算法，可用于 `ML` 中的预测建模和描述性建模，以进行判别变量选择。许多用户尚未掌握构建有效且可靠的 `PLS-DA` 模型的精髓。当
    `Y` 为分类变量时，`PLS-DA` 是一种变体。`PLS` 用于寻找两个矩阵（`X` 和 `Y`）之间的基本关系。该技术是一种潜变量方法，用于对这两个空间中的协方差结构进行建模。


    # 混合判别分析


    混合判别分析是一种用于分析研究数据的技术，适用于标准或因变量为分类变量，而预测变量或自变量为区间性质的情况。判别分析是一个分类问题，其中已知两个或多个群组、聚类或总体，根据测量特征将一个或多个新观测值分类到已知总体之一中。


    # 二次判别分析 (QDA)


    用于名义标签和数值属性的 `QDA` 确定哪些变量能区分两个或多个自然发生的群组。该技术还确定变量是具有描述性目标还是预测性目标。在定性研究中使用时，`QDA`
    也可能指代定性数据分析。`QDA` 扩展用于四重判别归档。`QDA` 用于统计分类或作为 `ML` 中的二次分类器。


    # 正则化判别分析


    正则化判别分析是一种推广各种类条件高斯分类器的方法，包括线性判别分析、`QDA` 和高斯朴素贝叶斯。线性判别分析方法通过调整两个控制应用于估计协方差矩阵的正则化量的超参数，在这些模型之间提供了一个连续谱。线性判别分析是从肌电信号解码运动意图的最常用分类方法。


    # AI 和 ML 流程步骤


    AI 流程步骤如 图 2.10 所示。仔细遵循这些步骤以理解所需的流程非常重要 (Shrestha et al. 2019)。


    ![Image](img/ch2fig10.JPG)


    **图 2.10** AI 流程步骤


    ## 数据处理


    数据处理步骤用于任何数据项目。请参阅本章的数据处理部分。


    ## 模型


    模型步骤确定哪种模型适合 AI 和 ML 问题定义以及用例。适当使用选择方法对建模优先级和评估进行建模。


    请参阅 ML 算法章节。


    ## 成本函数


    成本函数有助于纠正和改变行为以最小化错误。成本函数衡量模型在估计预测值与实际值之间关系方面有多“错”。成本函数的目标是最小化预测值与实际值之间的差异。梯度下降优化算法常被使用。


    ## 损失函数


    损失函数评估算法模型使用给定数据进行预测的效果，并分析模型如何改进。如果损失函数返回较高的数值，则模型无效。如果损失函数被最小化，则模型正在改进。


    不同类型的损失函数包括均方误差、似然函数、对数损失和交叉熵损失。


    ## 调优


    调优是提高准确性并通过调整超参数、应用适当的正则化、避免过拟合和欠拟合、自助法、交叉验证和装袋法来调整模型的关键步骤。请参见 图 2.11。


    ![Image](img/ch2fig11.JPG)


    **图 2.11** ML 模型调优步骤


    此步骤的一大挑战是如何快速应用调优以提高准确性并减少损失。


    ## 优化


    优化是一个通过比较各种解决方案直到找到最优或满意解决方案而迭代执行的过程。在优化设计时，目标是最小化成本和损失，并最大化效率。


    更新模型参数（如权重和偏置值）并确定 `Gradient descent`、`Stochastic gradient descent` 或 `Adam` 可以提供更快的结果。


    优化算法有助于最小化或最大化目标函数（也称为误差函数）`E(x)`，它是一个依赖于模型内部可学习参数的数学函数，这些参数在从预测变量集（`X`）计算目标值（`Y`）时使用。优化还决定权重（`W`）和偏置（`b`）值的调整以及学习率的确定。一阶优化算法和二阶优化算法最常被使用。


    梯度下降是最重要的技术，也是训练和优化智能系统的基础。批量梯度下降计算整个数据集的梯度并仅执行一次更新。对于大型数据集，此过程可能非常缓慢。速度由学习率——η
    决定，并保证收敛到全局最小值而非局部最小值；而随机梯度下降对每个训练数据集执行一次更新。小批量梯度下降结合了两种技术的优点，对每个批次执行一次更新，每个批次包含
    n 个训练示例。


