    categorical, and numerical versus categorical. Bivariate analysis is illustrated
    through any one of the following visualizations.


    ## Scatter Plot


    A scatter plot explores two numerical values to provide a visual representation
    of the linear and nonlinear relationships.


    Linear correlation quantifies the strength of a linear relationship using the
    following formula.


    ```

    ![](images/Eq001.png)

    ```


    where `x(dash)` and `y(dash)` are the sample mean, and `n` is the number of samples.


    ## Correlation Plot


    Correlation plots are used to assess whether or not correlations are consistent
    across groups.


    1.  Two-way table

    2.  Stacked column chart


    ## Chi-Square Test


    Chi-square test is a statistical hypothesis test where the sampling distribution
    of the test statistic is a chi-squared distribution when the NULL hypothesis is
    true. The Pearson’s chi-square test is commonly used. The chi-square test is used
    to determine if a significant difference exists between the expected frequencies
    and the observed frequencies in one or more categories. The chi-square test gives
    P value.


    Chi-square formula:


    ```

    ![Image](images/Eq003.png)

    ```


    ## Z-Test/T-Test


    The Z-test and T-test are the same. It is a statistical evaluations of the averages
    of two groups and determines the differences and significance of the differences.


    ```

    ![Image](images/Eq002.png)

    ```


    ```

    ![Image](images/Eq004.jpg)

    ```


    ## Analysis of Variance (ANOVA)


    The ANOVA is a short form variance test that statistically measures the averages
    of more than two groups that are statistically different from each other. In simple
    terms, the test determines the statistically significant differences between the
    mean values of three or more independent groups.


    # Feature Cleaning


    Feature cleaning is another name for data cleaning. Clean and quality data determine
    the success of a data project. Collecting quality data is the biggest challenge.


    ## Missing values


    Null values, spaces, or no value can be present in the data.


    ## Obvious Inconsistencies


    Inconsistent data problems arise when various information systems are collecting,
    processing, and updating data due to human or equipment reasons.


    Inconsistent data make it impossible to obtain correct information from the data
    and reduce data availability.


    ## Special Values


    The special values are specific to the respective dataset. For example, some default
    values for a date field are represented as `“1900-01-01”` for effective begin
    date and `“2099-12-31”` for effective end date.


    ## Outlier


    In statistics, an outlier is a data point that differs significantly from other
    observations (Huang et al., 2019). An outlier can cause serious problems in statistical
    analysis and feature cleaning.


