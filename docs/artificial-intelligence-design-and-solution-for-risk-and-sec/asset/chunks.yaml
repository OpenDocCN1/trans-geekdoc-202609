    # Automatic Checkout and Future Living


    Automatic checkout would be used and make recommendations to the customer. Items
    would be available instantly through all connected devices. A person’s home fridge
    would maintain a minimum quantity that is instantly delivered to a person’s home
    based on the optimal quantity.


    Humans need to find a way to earn money, and Bitcoin should be available to use
    for payment. Humans may own multiple specialized devices to serve customer needs
    such as purified water, a robot to prepare personalized foods, or a robot doctor
    that provides health advice.


    ## Government Sector


    Some may wonder what will happen to tax collections. The government may adopt
    automatic dynamic taxes instead of a fixed income tax. This method would require
    a political mandate to pass through congress.


    ## Transportation Industry Sector


    Driverless cars, driverless trucks, and drones for carrying goods and delivering
    to customers are determined by the user or owner of the drone.


    Numerous risk and security issues will arise with the prediction provided earlier.
    Well-planned security and risk management will make this prediction feasible and
    humans will be able to enjoy the privileges that come with it.


    Risk and security experts should be available to carry out adequate strategies
    that are testable in respective environments.


