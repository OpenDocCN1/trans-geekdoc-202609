    # 每项行动都伴随风险


    手动监控风险并缓解大型任务是一个持续存在的问题（Rona-Tas 等，2019）。利用机器学习和人工智能方法解决这一问题。


    ## 面向安全的机器学习和人工智能


    安全是企业和政府组织面临的一个重大问题（McGraw 等，2019）。该问题可以利用机器学习和人工智能方法来解决。


    问题陈述的定义非常笼统，可能无法聚焦于正确的问题陈述。这些陈述可以细分为多个问题陈述；这一过程将在“面向风险的人工智能解决方案”和“面向安全的人工智能解决方案”章节中进行说明。


    ## 理解现有与当前的业务架构与业务流程


    在审视新旧业务架构时，请提出以下问题：


    *   利益相关者、客户、用户和组织是谁？

    *   应如何定义愿景、战略、战术、政策、规则和法规？

    *   通过计划和项目的价值流是什么？如何衡量？

    *   启用了哪些能力？利用收集的信息提出了哪些建议？


    请参见 图 2.2。


    ![Image](img/ch2fig2.JPG)


    **图 2.2 业务架构流程**


    ### 业务架构


    ### 业务流程


    业务架构进一步细分为业务流程（Vaez-Alaei 等，2018）。业务流程定义了企业如何运作、管理和服务以实现业务目标。每个组织在行业和职能领域可能拥有独特的业务流程。请参见
    图 2.3。


    ![Image](img/ch2fig3.JPG)


    **图 2.3 典型业务流程**


    通常，首席执行官负责战略、基础设施、产品和服务。首席营销官负责市场营销和销售领域。首席运营官负责业务运营。如今，大多数组织引入了一个名为首席数据官的新高层管理职位，负责管理数据架构、数据设计、数据收集、数据管理、数据处理、应用数据科学、机器学习和人工智能。该角色帮助行业跟上最新的技术变革，例如迁移到云基础设施、机器学习、人工智能和物联网。事实上，所有现有业务流程都在经历重组和重新定义，以采纳包括风险和安全在内的技术变革。所有业务职能领域及相关业务流程均面临风险。本书阐述了如何利用机器学习和人工智能实现业务职能领域及相关业务流程的自动化。


    从宏观层面审视零售行业的业务流程。请参见 图 2.4。


    ![Image](img/ch2fig4.JPG)


    **图 2.4 零售行业典型业务流程**


    ## 定义业务用例


    必须为问题陈述定义业务用例（Haas 等，2019）。该流程将通过机器学习和人工智能针对风险问题陈述进行说明。


    ### 问题陈述：


    *   风险无处不在。每项行动都伴随风险。手动监控风险并加以缓解是一个持续存在的问题，尤其是在大型任务的情况下。目标是利用机器学习和人工智能方法解决这一重大问题。

    *   安全是企业和政府组织面临的一个非常大的问题，可利用机器学习和人工智能方法加以解决。


    ### 确定投资回报率 (ROI) 和收益：


    组织通过实施面向风险和安全的机器学习和人工智能系统，将每天节省资金。人力劳动将从手动识别和缓解风险及安全工作中解放出来。ROI 的大致估算至少为 10,000
    美元，但该数字取决于组织规模以及当前在手动风险和安全任务上花费的时间。机器学习和人工智能还能消除 7×24 小时的风险和安全监控任务。


    ### 战略一致性：


    战略一致性应与业务目标保持一致。所有组织的业务目标都是利用数据驱动决策和自动化。面向风险和安全的机器学习和人工智能实施与业务目标保持一致。


    ### 投资：


    投资将很少，因为它将采用云端软件即服务模式。


    ### 价值：


    组织将获得安心。客户和合作伙伴组织将更有信心。


    ### 效率：


    组织的运营流程和自动化水平将提高 60 倍。


    ## 定义用例


    在此步骤中，定义或识别需支持以达成有形成果的用例（重构以提高用例模型的安全质量，2019）。大多数机器学习和人工智能项目被转向研发 (R&D) 项目，原因在于用例是在前期识别的。用例因行业和业务职能而异，但其中一些列举如下。


    ### 金融和银行业：


    *   预防信用损失和欺诈。

    *   避免洗钱。

    *   遵守行业标准和政府条款。


    ### 零售业：


    *   避免数据泄露。

    *   通过有竞争力的定价提高市场份额。


    ## 确定目标


    机器学习和人工智能风险解决方案的目标是捕获所有风险项目，以识别、分类和优先处理风险，并获得预防建议。


    机器学习和人工智能安全解决方案的目标是实时防范威胁。机器学习和人工智能安全系统可发现、检测、提供威胁评分、威胁防护和预防建议。


    在逐步了解每个机器学习和人工智能项目架构及设计步骤之前，让我们先看看典型的数据分析项目及其生命周期。可能需要多条数据分析和生命周期项目流来定义整体项目架构和设计。


    ## 数据分析与生命周期


    数据分析生命周期专为大数据问题和数据科学项目设计（Sahoo 和 Mohanty，2018）。共有六个阶段，项目工作可在多个阶段同时进行。该周期具有迭代性，以模拟真实项目。随着新信息的发掘，工作可返回到前期阶段。数据分析生命周期包含以下序列步骤：


    ### 数据分析生命周期概览：


    1.  第一阶段：发现

    2.  第二阶段：数据准备

    3.  第三阶段：模型规划

    4.  第四阶段：模型构建

    5.  第五阶段：结果沟通

    6.  第六阶段：运营化


    数据科学家是主要的分析利益相关者。数据科学家提供分析技术和建模。其他团队成员如下：


    1.  业务用户：了解领域知识。

    2.  项目发起人：提供高层需求和预算。

    3.  项目经理/敏捷教练/Scrum Master：确保目标达成。

    4.  数据架构师：基于对数据的深入理解，提供业务领域专业知识。

    5.  数据工程师：提供技术技能，协助数据管理和提取，支持分析开发领域。


    以下是流程包含的步骤。请参见 图 2.5。


    ![Image](img/ch2fig5.JPG)


    **图 2.5 数据分析生命周期**


    ### 第一阶段：发现


    发现阶段遵循以下步骤序列：


    1.  学习业务领域

    2.  资源

    3.  界定问题

    4.  识别关键利益相关者

    5.  面谈分析发起人

    6.  形成初步假设

    7.  识别潜在数据源


    ### 第二阶段：数据准备


    数据准备阶段包含以下要素：


    1.  此阶段包含探索、预处理和调理数据的步骤。

    2.  此阶段创建健康的环境和分析沙箱。

    3.  数据准备往往是分析生命周期中最耗费人力的步骤。

    4.  至少 50% 的任务时间花费在数据准备阶段。


