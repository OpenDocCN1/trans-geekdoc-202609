- raw: 'ML examples include medical diagnosis, image processing, prediction, classification,
    learning association, and regression. The intelligent systems built on ML algorithms
    have the capability to learn from experience or historical data. A large amount
    of data is recommended because it provides better insights.


    The ensemble is a method used in learning algorithms to construct a set of classifiers
    and to classify new data points by taking a weighted vote of their predictions.
    The original ensemble method is Bayesian averaging, but more recent algorithms
    include error-correcting output coding, bagging, and boosting. Bagging is a way
    to decrease the variance in the prediction by generating additional data using
    combinations with repetitions to produce multi-sets of the original data.


    Random Forest


    Random forest—sometimes referred to as a random decision forest—is a popular ensemble
    method and can be used to build predictive models for both classification and
    regression problems. Ensemble methods use multiple learning models to gain better
    predictive results. Random forest models create an entire forest of random, uncorrelated
    decision trees to arrive at the best possible answer.


    Gradient Boosting Machines


    Gradient boosting is one of the most powerful techniques for building predictive
    models.


    The boosting method converts weak learners into strong learners. Each new tree
    is a fit on a modified version of the original dataset. AdaBoost can be introduced
    for training purposes, beginning with the AdaBoost Algorithm. The weights are
    increased for observations after evaluating the first tree. Computation is done
    to determine classification errors from the second tree. A third tree helps predict
    the revised residuals. The final ensemble model is created after a specified number
    of iterations.


    Boosting


    Boosting is a ML ensemble meta-algorithm for reducing bias and variance in supervised
    learning. Boosting is a family of ML algorithms that converts weak learners to
    strong ones.


    Bootstrapped Aggregation (Bagging)


    The goal of an ensemble model is to bring a group of weak learners together to
    form a strong learner. Bagging is used when the goal is to reduce the variance
    of a decision tree. This creates several subsets of data from the sample dataset.


    AdaBoost


    AdaBoost—also referred to as adaptive boosting—is the first practical boosting
    algorithm proposed by Freund and Schapire in 1996. AdaBoost focuses on classification
    problems and aims to convert a set of weak classifiers into a strong one.


    Stacked Generalization (Blending)


    Stacked generalization is simply a general method of using a high-level model
    to combine lower level models to achieve greater predictive accuracy. The first
    step is to collect the output of each model into a new set of data.


    Gradient Boosted Regression Trees


    Gradient boosting is a ML technique used for regression and classification problems.
    This technique produces a prediction model in the form of an ensemble of weak
    prediction models, typically decision trees.


    Neural Networks


    A neural network is a series of algorithms that recognizes underlying relationships
    in a set of data using a process that imitates the way the human brain operates.
    Neural networks can adapt to changing input. The network generates the best possible
    result without needing to redesign the output criteria.


    Radial Basis Function Network


    A radial basis function network is a mathematical modeling, radial basis function
    network that uses radial basis functions as activation functions. The network’s
    output is a linear combination of radial basis functions of the inputs and neuron
    parameters.


    Perceptron


    Perceptron is a ML algorithm that provides classified outcomes for computing.
    It dates back to the 1950s and represents a fundamental example of how ML algorithms
    develop data.


    Backpropagation


    Backpropagation requires the derivatives of activation functions to be known at
    network design time. Backpropagation is commonly used by the gradient descent
    optimization algorithm to adjust the weight of neurons by calculating the gradient
    of the loss function.


    Hopfield Network


    The Hopfield network is a recurrent artificial neural network popularized by John
    Hopfield in 1982 but described earlier by Little in 1974. The Hopfield nets serve
    as content-addressable (“associative”) memory systems with binary threshold nodes.


    Regularization


    Regularization is a form of regression that constrains, regularizes, or shrinks
    the coefficient estimates toward zero. This technique discourages learning a more
    complex or flexible model to avoid the risk of overfitting. Regularization illustrates
    that models that overfit the data are complex models that often have too many
    parameters.


    Ridge Regression


    Ridge regression is a technique for analyzing multiple regression data that suffer
    from multicollinearity. When multicollinearity occurs, least squares estimates
    are unbiased but their variances are large. Multicollinearity (also known as collinearity)
    is a one-predictor variable in a multiple regression model that can be linearly
    predicted from others with a substantial degree of accuracy. Multicollinearity
    generally occurs when there are high correlations between two or more predictor
    variables. Examples of correlated predictor variables are a person’s height and
    weight, age and sales price of a car, years of education, and annual income.


    Least Absolute Shrinkage and Selection Operator (LASSO)


    LASSO is a regression analysis method that performs variable selection and regularization
    to enhance the prediction accuracy and interpretability of the statistical model
    it produces. The LASSO method was originally introduced in geophysics literature
    in 1986, and later independently rediscovered and popularized in 1996 by Robert
    Tibshirani, who used the term and provided further insights into the observed
    performance. The LASSO method was originally formulated for least squares models
    and later revealed a substantial amount about the behavior of the estimator and
    its relationship to ridge regression.


    Elastic Net


    The elastic net is a regularized regression method that linearly combines the
    L1 and L2 penalties of the LASSO and ridge methods. Elastic net regularization
    method includes both LASSO (L1) and Ridge (L2) regularization methods. Overfitting
    is the core idea behind ML algorithms; the goal is to build models that can find
    generalized trends within the data. Regularization is used to prevent overfitting
    the model to training data.


    Least Angle Regression


    Least angle regression is an algorithm for fitting linear regression models to
    high-dimensional data. This method was developed by Bradley Efron, Trevor Hastie,
    Iain Johnstone, and Robert Tibshirani. This statistical algorithm uses a linear
    combination of a subset of potential covariates to determine a response variable.
    The least angle regression algorithm produces an estimate of which variables to
    include, as well as their coefficients. Instead of giving a vector result, this
    estimate provides a curve that denotes the solution for each value of the L1 norm
    of the parameter vector. The algorithm is like forward stepwise regression, but
    instead of including variables at each step, the estimated parameters are increased
    in a direction equiangular to each one’s correlations with the residual.


    Rule System


    A rule system is often referred to as a rule-based system based on the use of
    “if-then-else” rule statements. The rules are simply patterning, and an inference
    engine is used to search for patterns in the rules that match patterns in the
    data. A matching rule captures a matching process. This process can be used to
    select and add matches to the rule to apply in the future.


