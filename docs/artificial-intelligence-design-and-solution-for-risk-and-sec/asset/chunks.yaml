  trans: "\n请参阅图 5.2、图 5.3 和 图 5.4。\n\n![Image](img/ch5fig2.JPG)\n\n图 5.2 K 近邻与关联规则\n\
    \n![Image](img/ch5fig3.JPG)\n\n图 5.3 模型与准确率\n\n![Image](img/ch5fig4.JPG)\n\n图\
    \ 5.4 覆盖率与召回率：推荐引擎评估\n\n向所有算法引入正则化参数，以惩罚热门商品的推荐。\n\n*   召回率和覆盖率都应最大化；推荐系统将准确无误，并为用户提供多样化推荐以探索新内容。\n\
    *   冷启动没有足够的历史交互（针对商品或用户）。当协同过滤方法无法生成推荐时，可使用属性相似度（基于内容的相似度）。\n*   考虑属性相似度时，冷启动问题会减少。将属性编码为二进制向量并输入推荐系统。\n\
    *   基于交互相似度和属性相似度聚类的商品通常是一致的。\n\n### 推荐引擎评估指标\n\n*   **(a) 召回率**，(b) 用户喜欢的商品中实际被推荐的比例，(c)\
    \ 召回率越大，推荐效果越好。\n*   **(a) 准确率**，(b) 在所有推荐商品中，用户实际喜欢多少？(c) 准确率越大，推荐效果越好。\n*  \
    \ **(a) 均方根误差**，(b) 它衡量预测评分中的误差，(c) 均方根误差值越小，推荐效果越好。\n*   **(a) 排序指标**和 (b) 考虑推荐商品的顺序：\n\
    \    *   **(a) 平均倒数排名**，(b) 评估推荐列表，(c) 平均倒数排名越大，推荐效果越好。\n    *   **(a) 截断 k 处的平均精度均值**，(b)\
    \ 平均精度均值越大，推荐越准确。\n    *   **(a) 归一化折扣累积增益**，(b) 归一化折扣累积增益越高，推荐效果越好。\n\n请参阅图 5.5\
    \ 和 图 5.6。\n\n![Image](img/image_036_.jpg)\n\n图 5.5 混淆矩阵\n\n![Image](img/ch5fig6.JPG)\n\
    \n图 5.6 推荐引擎评估指标\n\n*   单一算法尚可，但集成模型强大得多。\n*   平衡探索与利用，因为过度探索可能导致部分用户的推荐质量下降，而探索不足可能导致所有用户的推荐效果次优。\n\
    \n### 模型结论\n\nLSTM 在推荐引擎方面表现优于其他算法。\n\n### 结论\n\n市场上有许多可用的推荐引擎。\n\n### 用于推荐的强化学习（Q-Learning）\n\
    \n强化学习已被证明能解决复杂问题。最近，强化学习在 Google DeepMind 的 Atari 游戏中取得了巨大成功（Sutton and Barto\
    \ 1998）。\n\nQ-Learning 的底层 ML 算法没有限制。模型可以是任何回归算法；然而，深度神经网络主导了 Q-Learning 和强化学习。\n\
    \n使用逻辑回归代替分类时，一个关键区别在于数据。在分类中，数据预先标注了正确的类别供模型预测。强化学习没有预标注数据。数据是生成的，这些数据具有应最大化的奖励信号。\n\
    \n### 威胁响应推荐\n\n假设观察到一种风险并采取了一系列行动。将其输入行动者网络，由其决定下一步行动。它生成一个理想的响应嵌入。可将其与其他响应嵌入进行比较以寻找相似性。最佳匹配将被推荐用于该风险。\n\
    \n评论家有助于评判行动者并帮助其发现问题。\n\n例如，推荐系统为某风险建议一个行动。该行动被采取并获得 1000 美元的即时奖励；然而，未来也可能撤销该行动，导致公司损失\
    \ 2000 美元。必须考虑所有未来行动。请参阅图 5.7。\n\n![Image](img/image_037_.jpg)\n\n图 5.7 强化学习算法通用流程图\n\
    \n该网络包含两层：行动者和评论家。每一层类似于不同的学习类型。行动者学习策略（选择下一步行动的概率），评论家专注于奖励（Q-Learning）。\n\n\
    首先，一批响应嵌入被输入行动者的状态表示模块进行编码。接下来，以向量形式做出决策。将行动与项目嵌入结合并输入评论家模块，旨在估算奖励会有多好。\n\n状态模块对复杂的动态风险-响应交互建模，以追求更好的推荐性能。\n\
    \n对于给定风险，网络基于其状态生成响应。由其最近 n 次响应的嵌入表示的风险状态被用作输入。\n\n评论家网络（Q-Learning）用于估算当前状态和行动的奖励会有多好。\n\
    \n构建了四类特征：风险特征、作为环境状态特征的上下文特征、风险-响应特征，以及作为行动特征的响应特征。这四个特征被输入深度 Q 网络以计算 Q 值。根据\
    \ Q 值选择一系列响应进行推荐，用户对响应的行动包含在强化学习智能体接收到的奖励中。\n\n奖励可从推荐引擎的系统日志中收集。\n\n### 风险应急推荐\n\
    \n推荐引擎的训练步骤与威胁响应推荐引擎相同。请参阅表 5.5。\n\n表 5.5 风险应急数据集\n\n| 度量风险名称 | 风险应急计划 | 应急计划执行次数\
    \ | 应急计划执行次数/度量风险发生次数 |\n| --- | --- | --- | --- |\n| 销售额下降 | 设计新产品 | 10 | 0.9\
    \ |\n| 库存周转率下降 | 降价促销 | 20 | 0.3 |\n| 库存减少 | 为库存项目创建替代供应商清单 | 5 | 0.45 |\n| 销售额增加\
    \ | 依赖积压库存项目 | 7 | 0.68 |\n\n## 第 6 章：职能领域\n\n第 6 章\n\n### 目的\n\n本章描述以下业务职能领域中主要业务职能领域的主要风险和安全：\n\
    \n*   销售与市场 (S&M) 职能领域\n*   客户关系管理 (CRM) 职能领域\n*   财务管理职能领域\n*   人力资源职能领域\n* \
    \  制造职能领域\n*   运营管理职能领域\n*   供应链管理 (SCM) 职能领域\n*   研发 (R&D) 职能领域\n*   人工智能 (AI)\
    \ 和自动化职能领域\n\n### 职能领域内的 S&M\n\n#### 1. 该领域的主要风险：\n\nS&M 是任何企业的重要业务职能领域。S&M 是创收职能领域。在风险冲击营收和销售之前，识别该领域的风险优先级更高。请参阅以下参考资料：\n\
    \n[`simplicable.com/new/marketing-risk`](https://simplicable.com/new/marketing-risk)\n\
    \n#### 2. 该领域的安全：\n\n首席营销官面临的主要安全威胁\n\n[`cisoinsights.com/top-3-cyber-security-risks-every-chief-marketing-officer-care/`](https://cisoinsights.com/top-3-cyber-security-risks-every-chief-marketing-officer-care/)\n\
    \n### S&M 职能领域\n"
