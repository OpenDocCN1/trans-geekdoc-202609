- raw: 'Operations management ensures the timely outcome of raw material into finished
    products. It is safe to say that operations management is important when it comes
    to project management. In an organization, the business function is responsible
    for planning, organization, coordinating, and controlling the resources required
    to produce the organization’s services and products. High priorities ensure timely
    delivery of products and services.


    Operations management involves similar management for organizational sectors irrespective
    of the type or nature. The main idea is to properly cater to the resources such
    as labor, raw material, money, and other resources. Organizations will use available
    resources in the best possible way to achieve end goals and improve overall productivity.
    The organization tries to provide products to align with customer requirements.
    This strategy helps to market and sell the end products rapidly, resulting in
    enormous profits for the organization. Operations management manages sectors such
    as design, operations, and maintenance of the system used to produce goods.


    The operations management process cannot be underestimated and in-depth knowledge
    is required. A mishandled environment leads to risk and security issues that impact
    the organization’s growth and success.


    The risks of operations management include loss based on personnel, procedures,
    systems, and external events. Personnel-based risks include personnel who are
    not trained well and good employees leaving the organization. Operational risk
    and loss stems from preplanned detrimental activity, such as employees committing
    criminal offenses that could potentially harm the organization.


    Other risks and security issues are:


    *   Computer hacking.


    *   Risks coming from disastrous events such as hurricanes.


    *   Internal and external fraud.


    *   The workforce not adhering to internal policies.


    *   IT disruption from disabling cyberattacks, routine causes of human error,
    or failure of aging hardware.


    *   Data compromise such as cybertheft, unauthorized access, accidental disclosure,
    and employee negligence.


    *   Regulatory risk resulting from the evolving nature of regulatory attitudes
    to supervision.


    *   Theft and fraud are part and parcel of a risk manager’s job.


    *   Outsourcing remains one of the top operational risks for practitioners this
    year.


    *   The incorrect selling of financial products has been a constant concern for
    operations risk managers over the past decade.


    *   The financial industry’s struggle to attract, train, and retain the best and
    brightest in competition from other sectors such as technology.


    *   Organizational change is pointed out as a huge risk concern.


    *   Unauthorized trading resulting from rogue algorithms is noted as a risk.


    *   Model risks reflect the growing regulatory burdens placed on banks’ modeling
    and validation teams that show the potential cost of errors that occur in the
    banking sector.


    All risks and security issues must be well managed and mitigated accurately.


    SCM


    SCM includes the activities required to plan, control, and execute a product’s
    flow, from obtaining raw materials and production through distribution to the
    final customer (Samson 2010). SCM controls product quality, inventory levels,
    timing, and expenses. Other examples are farming, refining, design, manufacturing,
    packaging, and transportation.


    Retail organizations often get involved in SCM because product quality is controlled
    all the way to the end customer. See [Figure 6.1](#06_Chapter_6.xhtml#ch6fig1).


    ![Image](images/ch6fig1.JPG)


    Figure 6.1 SCM


    SCM has risks and needs that must be managed appropriately. The following are
    some basic types of supply chain risks:


    *   Financial risks.


    *   Any unforeseen event that disturbs the normal flow of goods and materials
    in a supply chain.


    *   Scope of schedule risks.


    *   Legal risks.


    *   Environmental risks.


    *   Sociopolitical (combining social and political factors) risks.


    *   Project organization risks.


    *   Human behavior risks.


    The risks in the supply chain must be managed using supply chain risk management
    (SCRM). The SCRM uses strategic steps to identify, assess, and mitigate the risks
    embedded in the supply chain process. It is necessary to manage all tiers of supply
    and risk objects (suppliers, locations, and ports). See [Figure 6.2](#06_Chapter_6.xhtml#ch6fig2).


    ![Image](images/ch6fig2.JPG)


    Figure 6.2 Supply chain risk management


    R&D


    R&D is the process where an organization searches for new knowledge to create
    new products, services, or systems (Hill et al. 2019). The goal is to make money
    for the organization. Pharmaceutical and technology organizations carry out R&D;
    however, other types of organizations also use R&D. Usually, R&D is basic or applied
    in order to acquire new knowledge.


    Here are some of the risks associated with R&D:


    *   There is no guarantee that the organization will make money from the R&D.


    *   The return on investment could be disappointing.


    *   The organization may not obtain the desired result.


    *   The risk of physical harm.


    R&D should be well planned and include a detailed risk management plan. The plan
    should contain contingency in terms of time, scheduling, and funds.


    AI and Automation Functional Area


    The goal of AI is to make a computer mimic human behavior and intelligence. Automation
    is a hardware or software capable of doing some things automatically. Automation
    may be based on AI.


    Some fear that in the future, AI, ML, and automation will replace 7 percent of
    jobs in the United States alone. AI and automation are forecasted to eliminate
    most routine tasks, freeing IT to think more strategically.


    Here are some of the risks of AI and automation:


    *   Any career with repetitive tasks is a candidate for automation.


    *   With bots in front lines, it will be increasingly difficult to justify spending
    money on IT support.


    Mitigation or preparation for the game changing:


    *   Do not resist automation; embrace it.


    *   Bots can answer common question and point users to frequently asked questions.


    *   Work on developing skills that will be in high demand in the future.


    *   Learn to bridge the gap between business and tech-speak; try to look at reality.


    *   Be valuable to a wide variety of people (mostly customers).


    *   Take advantage of leadership training opportunities to help your team.


    *   Be a team player and work with teams by collaborating, negotiating, and brainstorming
    to meet demands.


    [CHAPTER 7](#contents.xhtml#c7)


    [Futuristic Artificial Intelligence](#contents.xhtml#c7)


    Purpose


    *   This chapter looks at the future trends of artificial intelligence (AI), risk,
    and security in 5 to 10 years.


    *   The good, bad, and ugly side of AI and machine learning (ML).


    *   How risk and security relates to AI and ML.


    Chapter Outline


    *   Prediction of AI and ML and how they surpass human intelligence


    *   The negative side of AI to employment opportunities


    Key Learning Points


    *   Learn and understand AI and where it is heading with intelligence


    Possible Future


    What is the future of AI in 5 or 10 years?


    Currently, technology forecasters do not believe that human intelligence is likely
    to be surpassed (Yang and Yu 2019). Advances in AI will likely result in general
    reasoning systems and lack human cognitive limitations.


    Some believe that AI and ML algorithms will eventually behave like humans and
    do the things humans do today. Currently, AI and ML keep track of consumer habits
    and respond accurately on selling to human consumers. Technology can change the
    way humans interact with their immediate surroundings.


    We can ask ourselves questions today about the things that humans could not do
    10 years back. The same questions can be asked about what humans can accomplish.
    In short, there will be some improvements and accomplishments in our lives.


