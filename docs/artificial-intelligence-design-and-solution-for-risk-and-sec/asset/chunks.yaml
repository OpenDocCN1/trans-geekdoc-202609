    ## 关键指标


    *   净现值（`NPV`）

    *   `ROI`

    *   内部收益率（`IRR`）

    *   投资回收期（`PBP`）

    *   成本收益比（`BCR`）


    ## 初创企业和项目管理的关键指标


    `NPV` 是以一笔金钱总和的形式表示的价值，而不是按复利投资后会变成的未来价值。例如，如果按年利率 10% 投资，12 个月后到期的 220 美元，其现值为今天的
    200 美元。


    `ROI` 衡量组织投资产生的收益或损失与投资金额的关系。`ROI` 通常以百分比表示，用于个人财务决策，以比较公司盈利能力与不同投资的收益。


    `ROI` 公式为：


    ```

    ROI = (净利润/投资成本) × 100

    ```


    `ROI` 计算灵活且用途广泛。它可用于计算和比较潜在投资，投资者也可用它来计算股票回报。


    `IRR` 是资本预算中用于估算潜在投资利润的指标。`IRR` 是使项目所有现金流的 `NPV` 等于零的贴现率。`IRR` 计算依赖与 `NPV` 相同的公式。


    `NPV` 是一段时间内现金流入现值与现金流出现值之间的差额。`NPV` 用于资本预算和投资规划，以分析预期投资或项目的利润。


    `PBP` 是收回投资所需的时间长度。给定投资或项目的回收期可以决定是否承担该头寸或项目。如果回收期较长，该项目可能不适合投资。回收期不考虑资金的时间价值。其他公式（如
    `NPV`、`IRR` 和折现现金流）会考虑回收期。


    资金的时间价值或现值折现意味着，由于当前货币具有潜在的盈利能力，其价值高于未来价值。这一金融核心原则认为，只要钱能产生利息，任何金额的钱越早收到就越有价值。


    `BCR` 用作成本-收益分析中的指标，以确定拟议项目的相对成本与收益之间的关系。这以货币或定性术语表示。如果一个项目的 `BCR` 大于 1.0，则假定该项目将为投资带来正的净现值。


    # 第 3 章：知识库


    ## 章节大纲


    *   为人工智能（`AI`）项目定义知识库

    *   风险与安全知识开发

    *   风险与安全知识库的目标

    *   风险与安全知识的识别

    *   风险与安全知识的获取

    *   知识共享


    ## 关键学习点


    *   学习并理解知识库

    *   理解风险与安全知识库开发


    `AI` 可用于需求不同的应用程序中并反复使用。人力资源一直是组织的难题，组织一直试图获取并利用不同角色所需的人类智慧。获取的知识和智慧存储在知识库中。知识模型可在必要时构建、训练和使用。


    获取人类智慧需要一个集成信息系统。其理念是开发一个集成系统，能够提供人类专家所需的知识。这些集成系统应随时可用且可共享。集成系统的使用应着眼于战略目标。这促成了
    `AI` 的发展。


    `AI` 基于存储在知识库中的信息解决重要挑战。人类专家在其专业领域内有周期性的需求。类似的方法被应用于风险管理，并通过用例进行探索。


    知识库存储用于驱动 `AI` 集成系统的数据、技术和算法。集成系统将在该方法中逐步引入。`AI` 集成系统的目标是在企业环境中寻求风险与安全的缓解解决方案。目标将考虑使用由“如果……会怎样”问题组成的业务规则。这种方法将利用战略规则和逻辑，借助存储在知识库中的数据，确定风险与安全的可能缓解解决方案。`AI`
    集成系统将影响知识目标设定、知识识别、知识获取、知识开发、知识共享、知识保存、知识修正、知识使用、知识评估和知识度量。`AI` 基于案例的知识集成、风险与安全案例的表示、相似性识别和关联是知识库的基石。`Bizstats.ai`
    利用知识库从零开始构建 `AI` 集成系统。


    ## 风险与安全知识开发


    本节旨在生成所需的风险与安全知识。这将包括思想、模型、技能、流程和系统方法。机器学习（`ML`）可以有多种形式。在讨论 `ML` 和神经网络时将使用基于模式的学习。这种方法从大量风险与安全数据中提供适当的知识，使
    `AI` 系统中获取的数据行为发生改变。


    ## 风险与安全知识库的目标


    将使用 `Bizstats.ai` 风险与安全知识库中的适当企业目标来开发技能和知识。


    风险知识库的目标如下：


    *   从数据、流程、人员、物联网（`IoT`）、系统和行动中捕获风险及相关风险。

    *   确定发生概率。

    *   确定风险影响。

    *   确定风险优先级。

    *   分配风险责任人。

    *   确定风险缓解措施。

    *   确定风险应对行动。

    *   实时持续监控风险并确定纠正措施。


    安全知识库的目标：


    *   从数据、流程、人员、`IoT`、系统和行动中捕获威胁及相关安全风险。

    *   确定威胁发生概率。

    *   确定威胁影响。

    *   确定安全威胁优先级。

    *   分配安全责任人。

    *   确定安全缓解措施。

    *   确定安全应对行动。

    *   实时持续监控安全威胁并确定纠正措施。

    *   推荐安全培训和高效的安全流程。


    ## 风险与安全知识的识别


