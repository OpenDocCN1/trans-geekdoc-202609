    from a normal distribution are more interesting.


    # Principal Component Regression


    The principal component regression is a regression analysis technique that originated
    from `PCA`. It considers regressing the outcome (predictions) on a set of covariates
    (also known as predictors, explanatory variables, or independent variables) based
    on a standard linear regression model and uses `PCA` for estimating the unknown
    regression coefficients in the model. Principal component regression helps overcome
    the multicollinearity problem that arises when two or more of the explanatory
    variables are close to being collinear. This can be useful in settings with high-dimensional
    covariates. Through appropriate selection of the principal components, `PCR` can
    lead to the efficient prediction of the outcome based on the assumed model.


    # PLS Discriminant Analysis (PLS-DA)


    The `PLS-DA` is an adaptable algorithm that can be used for predictive and descriptive
    modeling for discriminative variable selection in `ML`. Many users have yet to
    grasp the essence of constructing a valid and reliable `PLS-DA` model. `PLS-DA`
    is a variant used when the `Y` is categorical. `PLS` is used to find the fundamental
    relations between two matrices (`X` and `Y`). This technique is a latent variable
    approach to modeling the covariance structures in these two spaces.


    # Mixture Discriminant Analysis


    The mixture discriminant analysis is a technique used to analyze the research
    data when the criterion or the dependent variable is categorical and when the
    predictor or the independent variable is an interval in nature. Discriminant analysis
    is a classification problem where two or more groups, clusters, or populations
    are known a priori, and one or more new observations are classified into one of
    the known populations based on the measured characteristics.


    # Quadratic Discriminant Analysis (QDA)


    The `QDA` for nominal labels and numerical attributes determines which variables
    discriminate between two or more naturally occurring groups. This technique also
    determines whether the variables have a descriptive or a predictive objective.
    The `QDA` may also refer to qualitative data analysis when used in qualitative
    research. The `QDA` extension is used for quadruple discriminant archives. `QDA`
    is used in statistical classification or used as a quadratic classifier in `ML`.


    # Regularized Discriminant Analysis


    Regularized discriminant analysis is a method that generalizes various class-conditional
    Gaussian classifiers, including linear discriminant analysis, `QDA`, and Gaussian
    Naive Bayes. The linear discriminant analysis method offers a continuum between
    these models by tuning two hyper-parameters that control the amount of regularization
    applied to the estimated covariance matrices. Linear discriminant analysis is
    the most commonly used classification method for movement intention decoding from
    myoelectric signals.


    # AI and ML Process Steps


    The AI process steps are shown in [Figure 2.10](#02_Chapter_2.xhtml#ch2fig10).
    It is important that you follow the steps carefully to understand the processes
    that are required (Shrestha et al. 2019).


    ![Image](images/ch2fig10.JPG)


    **Figure 2.10** AI process steps


    ## Data Processing


    The data processing step is used with any data projects. Please refer to the data
    processing section of this chapter.


    ## Model


    The model step determines which model fits for the AI and ML problem definitions
    as well as the use case. Use the selecting approach appropriately to model the
    prioritization and evaluation.


    Refer to the chapter on ML algorithms.


    ## Cost Function


    Cost function helps correct and change behavior to minimize mistakes. Cost function
    measures how wrong the model is in terms of its ability to estimate the relationship
    between predicted value versus actual value. The goal of the cost function is
    to minimize the differences between predicted versus actual. The gradient descent
    optimization algorithm is commonly used.


    ## Loss Function


    Loss function evaluates how well the algorithm models predict using the given
    data and analyzes how the model is improving. If the loss function returns a higher
    number, the model is ineffective. If the loss function is minimized, the model
    is improving.


    Different types of loss functions are mean squared error, likelihood functions,
    log loss, and cross entropy loss.


    ## Tuning


    Tuning is a crucial step to improve accuracy and adjust the model by tuning hyperparameters,
    applying proper regularization, avoiding overfitting and underfitting, bootstrapping,
    cross-validation, and bagging. See [Figure 2.11](#02_Chapter_2.xhtml#ch2fig11).


    ![Image](images/ch2fig11.JPG)


    **Figure 2.11** ML model tuning steps


    A major challenge in this step is how quickly tunings can be applied to improve
    accuracy and reduce the loss.


    ## Optimization


    An optimization is a procedure that is executed iteratively by comparing various
    solutions until an optimum or a satisfactory solution is found. When optimizing
    a design, the objective is to minimize the cost and loss and to maximize the efficiency.


    Updating model parameters such as weights and bias values and determining `Gradient
    descent`, `Stochastic gradient descent`, or `Adam` can provide faster results.


    Optimization algorithms help to minimize or maximize an objective function (also
    referred to as an Error function) `E(x)`, which is a mathematical function dependent
    on the model’s internal learnable parameters that are used when computing the
    target values (`Y`) from the set of predictors (`X`). Optimization also determines
    adjustments of weight (`W`) and bias (`b`) values and determines the learning
    rate. First-order optimization algorithms and second-order optimization algorithms
    are most commonly used.


    Gradient descent is the most important technique and the foundation of how to
    train and optimize intelligent system. The batch gradient descent calculates the
    gradient of the whole dataset and performs the update only once. This process
    can be very slow with large datasets. The speed is determined by the learning
    rate—η and is guaranteed to converge to global minimum rather than local minimum,
    whereas Stochastic gradient descent performs an update for each training dataset.
    Mini-batch gradient descent encompasses the best of both techniques and performs
    an update for every batch with n training examples in each batch.

