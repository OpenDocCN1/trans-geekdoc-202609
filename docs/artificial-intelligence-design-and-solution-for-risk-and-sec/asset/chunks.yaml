    # Srini Centhala


    Srini Centhala 是 Absolut-e Data Com（一家数据公司）的创始人兼首席架构师，该公司为 AT&T、Directv、Experian、eBay
    和 UPS 等财富 100 强企业提供了 20 多年的专家咨询服务。Srini 还是 BizStats Cloud 大数据 AI 分析平台的首席架构师。Srini
    设计并开发了定价引擎、统计建模、预测建模、推荐引擎、文本挖掘、情感分析、数据源分析和数据科学活动。


    **专长：** 业务流程重组、在线商业创意与概念、商业智能、业务数据管理系统中的技术架构师/数据架构师/数据建模师、项目管理，以及端到端的全项目承接。Srini
    将机器学习和人工智能应用于业务数据。


    ![Image](img/Muthu_Shanmugam_Picture_BW.jpg)


    # Muthu Shanmugam


    Muthu Shanmugam 是 Absolut-e Data Com 的首席技术官，拥有软件开发生命周期所有阶段 20 多年的经验。Muthu 拥有印度安娜大学的工程硕士学位。他曾作为软件开发团队的动态领导者与各类企业组织合作。目前，Muthu
    致力于 Bizstats.ai，这是一个由知识库驱动的商业智能和分析云，专为商业智能资源有限的企业设计。主要功能包括：包含各行业众多指标和属性的知识库、自然语言处理驱动的搜索、动态报表和仪表板。该公司还具备协作功能，允许用户与团队共享报表和仪表板。


