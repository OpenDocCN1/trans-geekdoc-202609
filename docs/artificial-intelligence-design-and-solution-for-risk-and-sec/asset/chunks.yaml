    \n### Data Conditioning\n\nThe data should be conditioned for several reasons,\
    \ such as cleaning data, normalizing datasets, and performing transformations.\
    \ This task is viewed as the step prior to data analysis, and the step might be\
    \ performed by the data owner, IT department, and database administrator. Data\
    \ scientists should be involved. It is a known fact that data science teams prefer\
    \ too much data rather than too little.\n\nHere are questions and observations\
    \ that must be addressed when analyzing the data, along with the chapters where\
    \ you can find further information on these topics.\n\n*   [Chapter 3](#03_Chapter_3.xhtml):\
    \ What are the data sources and target fields?\n*   [Chapter 4](#04_Chapter_4.xhtml):\
    \ How clean is the data?\n*   [Chapter 5](#05_Chapter_5.xhtml): How consistent\
    \ are the contents and files? Are there missing or inconsistent values?\n*   [Chapter\
    \ 6](#06_Chapter_6.xhtml): Assess the consistency of the data types (numeric,\
    \ alphanumeric)?\n*   [Chapter 7](#07_Chapter_7.xhtml): Review the contents to\
    \ ensure the data makes sense.\n*   [Chapter 8](#08_Chapter_8.xhtml): Look for\
    \ evidence of systematic error.\n\n### Survey and Visualize\n\nSpecific data visualization\
    \ tools may be used to gain an overview of the data (Wang et al. 2019). This process\
    \ starts with overview and on-demand zoom and filter details. This approach enables\
    \ the user to find areas of interest and zoom and filter to find more detailed\
    \ data.\n\nThe following questions and observations must be addressed when surveying\
    \ and visualizing data.\n\n*   [Chapter 1](#01_Chapter_1.xhtml): Review data to\
    \ ensure calculations are consistent.\n*   [Chapter 2](#02_Chapter_2.xhtml): Does\
    \ the data distribution stay consistent?\n*   [Chapter 3](#03_Chapter_3.xhtml):\
    \ Assess the details of the data, the range of values, and the level of aggregation\
    \ of the data.\n*   [Chapter 4](#04_Chapter_4.xhtml): Does the data represent\
    \ the population of interest?\n*   [Chapter 5](#05_Chapter_5.xhtml): Check time-related\
    \ variables: daily, weekly, monthly? Are these variables sufficient?\n*   [Chapter\
    \ 6](#06_Chapter_6.xhtml): Is the data standardized or normalized? Are the data\
    \ scales consistent?\n*   [Chapter 7](#07_Chapter_7.xhtml): In the case of geospatial\
    \ datasets, are state and country abbreviations consistent?\n\nTools for data\
    \ preparation are `Hadoop`, `Alpine Miner`, `OpenRefine`, `Data Wrangler`, and\
    \ `Google Cloud data preparation`.\n\n*   `Hadoop` can perform parallel consume\
    \ and analysis.\n*   `Alpine Miner` provides a graphical user interface for creating\
    \ analytic workflows.\n*   `OpenRefine` (formerly Google Refine) is a free, open-source\
    \ tool to use with messy data.\n*   `Data Wrangler` is an interactive tool for\
    \ data cleansing and transformation.\n*   `Google Cloud` provides data preparation.\n\
    \n## Phase 3: Data Modeling\n\nIn this phase, the following steps are conducted:\n\
    \n*   Determine the structure of the data to help determine the tools and analytic\
    \ techniques for the next phase (Palli et al. 2019).\n*   Determine the analytic\
    \ techniques that will enable the team to meet business objectives and accept\
    \ or reject the working hypotheses.\n*   Decide on a single model or a series\
    \ of techniques as part of a larger analytic workflow.\n*   Understand how similar\
    \ problems have been analyzed in the past.\n\n## Phase 4: Model Building\n\nThe\
    \ following tasks are considered in model building:\n\n1.  Execute the models\
    \ defined in Phase 3.\n2.  Develop datasets for training, testing, and production.\n\
    3.  Develop models on training data and test-on-test data.\n4.  Questions to consider:\n\
    \    1.  Does the model appear valid and accurate on the test data?\n    2.  Does\
    \ the model output and behavior make sense to the domain experts?\n    3.  Do\
    \ the parameter values make sense in the context of the domain?\n    4.  Will\
    \ the model sufficiently and accurately meet the goal?\n    5.  Can the model\
    \ avoid intolerable mistakes?\n    6.  Are more data or inputs needed?\n    7.\
    \  Will the type of model chosen support the run-time environment?\n    8.  Will\
    \ a different model be required to address the business problem?\n\nCommon model\
    \ building tools are: `R` and `PL/R`—`PL/R`, `Python`, `SQL`, `Octave`, `WEKA`,\
    \ `SAS`, `SPSS Modeler`, `MATLAB`, `Alpine Miner`, `STATISTICA`, and `MATHEMATICA`.\n\
    \n## Phase 5: Communication Results\n\nThe following steps should be followed\
    \ when communicating results:\n\n1.  Determine if the team succeeded or failed\
    \ in its objectives.\n2.  Determine if the results are statistically significant\
    \ and valid.\n3.  If the results are significant and valid, identify aspects of\
    \ the results that present relevant findings.\n4.  Determine if the results are\
    \ in line with the hypotheses.\n5.  Communicate the results and major insights\
    \ derived from the analysis.\n\n## Phase 6: Operationalize\n\nThe following occurs\
    \ in the operationalize phase:\n\n1.  The team communicates the benefits of the\
    \ project.\n2.  The team sets up a pilot project to deploy the work in a controlled\
    \ way.\n3.  Risks are managed and corrective action is taken by undertaking small\
    \ scope and pilot deployment before a wide-scale rollout.\n4.  During the pilot\
    \ project:\n    1.  The team may execute the algorithm more efficiently in the\
    \ database rather than with in-memory tools like `R`, especially with larger datasets.\n\
    \    2.  To test the model in a live setting, consider running the model in a\
    \ production environment for a discrete set of products or a single line of business.\n\
    \    3.  Monitor model accuracy and retrain the model if necessary.\n\nLet us\
    \ look at the ML algorithms mind map and define the terms and terminologies used\
    \ in the mind map.\n\n## ML Data Processing\n\nData processing is important in\
    \ any analytical project, data project, or ML and AI project. Most of the time\
    \ is spent in this step (Kotenko et al. 2019).\n\nSee [Figure 2.6](#02_Chapter_2.xhtml#ch2fig6).\n\
    \n![Image](images/fig2.6.jpg)\n\nFigure 2.6 ML and AI data processing map\n\n\
    Some of the statistics-related items are discussed here. If you want to know more\
    \ about the terms and terminologies, please reference a statistics book. [Figure\
    \ 2.6](#02_Chapter_2.xhtml#ch2fig6) explains the required steps needed to process\
    \ data and lists statistical experiments and measuring methods.\n\nThe first step\
    \ in the data processing is to determine the statistical data type or levels of\
    \ measurement by examining different techniques (Overgoor et al. 2019; Ohanian\
    \ 2019).\n\n### Nominal Data\n"
  trans: "\n\n## 5. 数据准备阶段\n\n数据准备阶段通常是最迭代的阶段，也是团队往往容易低估的阶段。\n\n数据准备阶段需要开发工作区。\n\n\
    准备工作区有益于以下原因：\n\n*   它创建了一个分析工作区。\n*   它允许团队探索数据，而不会干扰实时生产数据。\n*   一个准备好的工作区收集各种数据（广泛的方法）。\n\
    *   该工作区允许组织承担超越传统数据分析的雄心勃勃的项目。\n*   这一概念为数据科学团队和 IT 团体所接受。\n\n在工作区中，可根据团队情况执行提取、转换、加载和转换功能（提供预测行为分析的系统和方法\
    \ 2018）：\n\n提取、转换和加载用户可执行提取、转换和加载功能。\n\n在工作区中，提取、加载和转换过程保留原始数据，这对于检查很有用。\n\n**示例：**\
    \ 在金融机构的信用卡欺诈检测中，高风险交易可能在加载到数据库之前被随意过滤掉或转换。\n\n了解数据很重要，原因如下：\n\n1.  它在项目早期确定团队可用的数据。\n\
    2.  它凸显差距并识别当前不可用的数据。\n3.  它识别组织外部可能有用的数据。\n\n### 数据调理\n\n数据应进行调理，原因有多种，例如清洗数据、标准化数据集和执行转换。此任务被视为数据分析前的步骤，该步骤可能由数据所有者、IT\
    \ 部门和数据库管理员执行。数据科学家应参与其中。众所周知，数据科学团队宁愿要过多的数据，也不要过少的数据。\n\n以下是在分析数据时必须解决的问题和观察事项，以及您可以在其中找到更多相关信息的章节。\n\
    \n*   第 3 章：数据源和目标字段是什么？\n*   第 4 章：数据有多干净？\n*   第 5 章：内容和文件有多一致？是否有缺失或不一致的值？\n\
    *   第 6 章：评估数据类型（数字、字母数字）的一致性？\n*   第 7 章：审查内容以确保数据讲得通。\n*   第 8 章：寻找系统性错误的证据。\n\
    \n### 调查与可视化\n\n可使用特定的数据可视化工具来获取数据概览（Wang et al. 2019）。此过程从概览和按需缩放及筛选细节开始。这种方法使用户能够找到感兴趣的区域，并通过缩放和筛选来查找更详细的数据。\n\
    \n在调查和可视化数据时，必须解决以下问题和观察事项。\n\n*   第 1 章：审查数据以确保计算一致。\n*   第 2 章：数据分布是否保持一致？\n\
    *   第 3 章：评估数据的细节、值的范围和数据的聚合级别。\n*   第 4 章：数据是否代表了感兴趣的总体？\n*   第 5 章：检查时间相关变量：每日、每周、每月？这些变量是否足够？\n\
    *   第 6 章：数据是否标准化或归一化？数据刻度是否一致？\n*   第 7 章：在地理空间数据集的情况下，州和国家的缩写是否一致？\n\n数据准备工具包括\
    \ `Hadoop`、`Alpine Miner`、`OpenRefine`、`Data Wrangler` 和 `Google Cloud data preparation`。\n\
    \n*   `Hadoop` 可执行并行消费和分析。\n*   `Alpine Miner` 提供图形用户界面以创建分析工作流。\n*   `OpenRefine`（前身为\
    \ Google Refine）是一款免费的开源工具，用于处理混乱数据。\n*   `Data Wrangler` 是一款用于数据清洗和转换的交互式工具。\n\
    *   `Google Cloud` 提供数据准备功能。\n\n## 第 3 阶段：数据建模\n\n在本阶段，将执行以下步骤：\n\n*   确定数据结构，以帮助确定下一阶段的工具和分析技术（Palli\
    \ et al. 2019）。\n*   确定将使团队能够实现业务目标并接受或拒绝工作假设的分析技术。\n*   决定采用单一模型或一系列技术，作为更大分析工作流的一部分。\n\
    *   了解过去是如何分析类似问题的。\n\n## 第 4 阶段：模型构建\n\n模型构建中考虑以下任务：\n\n1.  执行第 3 阶段定义的模型。\n\
    2.  开发用于训练、测试和生产的数据集。\n3.  在训练数据上开发模型并在测试数据上测试。\n4.  需考虑的问题：\n    1.  模型在测试数据上看起来是否有效且准确？\n\
    \    2.  模型输出和行为对领域专家来说是否讲得通？\n    3.  参数值在领域背景下是否讲得通？\n    4.  模型是否能充分且准确地达到目标？\n\
    \    5.  模型能否避免不可容忍的错误？\n    6.  是否需要更多数据或输入？\n    7.  所选模型类型是否支持运行时环境？\n    8.\
    \  是否需要不同的模型来解决业务问题？\n\n常用的模型构建工具有：`R` 和 `PL/R`—`PL/R`、`Python`、`SQL`、`Octave`、`WEKA`、`SAS`、`SPSS\
    \ Modeler`、`MATLAB`、`Alpine Miner`、`STATISTICA` 和 `MATHEMATICA`。\n\n## 第 5 阶段：结果沟通\n\
    \n沟通结果时应遵循以下步骤：\n\n1.  确定团队在目标上是成功还是失败。\n2.  确定结果是否具有统计显著性和有效性。\n3.  如果结果显著且有效，确定呈现相关发现的结果方面。\n\
    4.  确定结果是否与假设一致。\n5.  沟通分析得出的结果和主要见解。\n\n## 第 6 阶段：运营化\n\n运营化阶段将发生以下情况：\n\n1.\
    \  团队沟通项目的收益。\n2.  团队建立试点项目，以受控方式部署工作。\n3.  在大规模推广前，通过开展小范围和试点部署来管理风险并采取纠正措施。\n\
    4.  在试点项目期间：\n    1.  团队可能在数据库中更高效地执行算法，而不是使用像 `R` 这样的内存工具，尤其是在处理较大数据集时。\n   \
    \ 2.  要在实时环境中测试模型，可考虑在生产环境中针对一组离散的产品或单条业务线运行模型。\n    3.  监控模型准确性，并在必要时重新训练模型。\n\
    \n让我们看看 ML 算法思维导图，并定义思维导图中使用的术语和术语。\n\n## ML 数据处理\n\n数据处理在任何分析项目、数据项目或 ML 和 AI\
    \ 项目中都很重要。大部分时间都花在这个步骤上（Kotenko et al. 2019）。\n\n请参阅 图 2.6。\n\n![Image](img/fig2.6.jpg)\n\
    \n图 2.6 ML 和 AI 数据处理图\n\n此处讨论了一些与统计相关的项目。如果您想了解更多关于术语和术语的信息，请参阅统计学书籍。图 2.6 解释了处理数据所需的步骤，并列出了统计实验和测量方法。\n\
    \n数据处理的第一步是通过检查不同技术来确定统计数据类型或测量水平（Overgoor et al. 2019; Ohanian 2019）。\n\n###\
    \ 名义数据\n\n"
