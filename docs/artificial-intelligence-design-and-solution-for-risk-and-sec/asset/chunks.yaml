- raw: 'The OLSR is a generalized linear modeling technique. It is used for estimating
    all unknown parameters involved in a linear regression model. This technique minimizes
    the sum of the squares of the difference between the observed variables and the
    explanatory variables. OLSR is one of the simplest methods of linear regression.
    The goal of OLSR is to closely fit a function with the data. It is carried out
    by minimizing the sum of squared errors from the data.


    Stepwise Regression


    Stepwise regression is a method of fitting regression models with predictive variables
    carried out by an automatic procedure. In each step, a variable is considered
    for addition or subtraction from the set of explanatory variables based on specified
    criterion.


    Let us examine an example of how the stepwise regression procedure works by considering
    a dataset that concerns the hardening of the cement. The goal in this example
    is to learn how the composition of the cement and the heat evolved during the
    hardening of the cement. Data were measured and recorded for 13 batches of cement:


    Response y: Heat evolved in calories during hardening of cement on a per gram
    basis.


    Predictor x1: Percent of tricalcium aluminate.


    Predictor x2: Percent of tricalcium silicate.


    Predictor x3: Percent of tetracalcium alumino ferrite.


    Predictor x4: Percent of dicalcium silicate.


    Subsequent steps will need to be taken to arrive at the solution.


    Multivariate Adaptive Regression Splines


    Multivariate adaptive regression splines is a form of regression analysis introduced
    by Jerome H. Friedman in 1991. It is a nonparametric regression technique and
    is an extension of linear models that automatically model nonlinearities and interactions
    between variables.


    Time Series Analysis


    Time series analysis develops models that best capture or describe an observed
    time series to understand the underlying causes. This field of study seeks the
    “why” behind a time series dataset. It is a sequence of well-defined data points
    measured at consistent time intervals over a period. This method is used to analyze
    time series data and extract meaningful statistics and characteristics about the
    data. This method requires one to make assumptions about the form of the data
    and decompose the time series into constitution components. The quality of a descriptive
    model is determined by how well the model describes all available data and how
    the model better informs the problem domain.


    Time series analysis consists of analyzing time series data to extract meaningful
    statistics and other characteristics of the data. It has the capability to forecast
    the use of a model to predict future values based on previously observed values.


    Text Analysis


    Text analysis is a method of communication used to describe and interpret the
    characteristics of a recorded or visual message. The purpose of textual analysis
    is to describe the content, structure, and functions of the messages embedded
    in texts.


    Prediction


    In simple terms, a prediction is a forecast. A prediction can be made with many
    things, such as a football match or the weather. In the word prediction, “pre”
    means before and diction is the act of commenting on something. This leads to
    a guess that may be based on evidence or facts.


    Simple steps to determine a prediction are:


    1.  Collect data using meaningful senses and use senses to make observations.


    2.  Search for patterns of behavior and or characteristics.


    3.  Develop statements about what the future observations will be.


    4.  Test the prediction and observe what happens.


    The best way to predict with ML is to approach the problem by hiding the uncertainty
    related to that prediction.


    Prediction intervals provide a way to quantify and communicate the uncertainty
    in a prediction. Confidence intervals can be used to quantify the uncertainty
    in the dataset population. The mean and standard deviation can be used as parameters
    for each of the prediction items in question.


    A prediction interval can be estimated analytically for simple models, but are
    more challenging for nonlinear ML models.


    Anomaly Detection


    Anatomy detection identifies unusual items, events, or observations that may be
    suspicious in a dataset; typically, the anomalies tend to be a problem. Anomalies
    can create security issues in an organization. Network issues have been associated
    with bursts of activities. The patterns do not add up to the common statistical
    definition of an outlier. This may create failure in unsupervised methods but
    can be aggregated appropriately to obtain expected results. The cluster analysis
    algorithm may be used to detect the microcluster pattern successfully. Anomaly
    techniques are broken into three categories: unsupervised anomaly detection, supervised
    anomaly detection, and semi-supervised anomaly detection.


    Deep Learning


    Deep learning is sometimes referred to as structured learning or hierarchical
    learning. Deep learning is part of ML methods based on artificial neural networks.
    The learning can be supervised, semi-supervised, or unsupervised.


    Neural Network Types


    There different neural networks are shown in [Figure 2.8](#02_Chapter_2.xhtml#ch2fig8).


    ![Image](images/fig2.8.jpg)


    Figure 2.8 Neural network types


    Deep Boltzmann Machine (DBM)


    The DBM is also called stochastic Hopfield network with hidden units. It is the
    first neural network capable of learning internal representations and can represent
    and solve difficult combinatoric problems. It is named after the Boltzmann distribution
    in statistical mechanics, which is used in their sampling function.


    The DBM has the following features:


    *   An unsupervised, probabilistic, generative model with entirely undirected
    connections between different layers.


    *   Contains visible units and multiple layers of hidden units.


    *   Like result-based management, no intralayer connection exists in DBM; connections
    only exist between units of the neighboring layers.


    *   A network of symmetrically connected stochastic binary units.


    *   DBM can be organized as a bipartite graph with odd layers on one side and
    even layers on the other.


    *   Units within the layers are independent of each other but are dependent on
    neighboring layers.


    *   Learning is made efficient with layer-by-layer pretraining.


    *   DBM is fine-tuned by backpropagation after learning the binary features in
    each layer.


    Deep Belief Network


    A deep belief network is a generative graphical model and is referred as a class
    of deep neural networks. The network is composed of multiple layers of latent
    variables with connections between the layers, but not between units in each layer.
    If trained on a set without supervision, a deep belief network can learn to probabilistically
    reconstruct its inputs and act as a feature detector. After this learning step,
    the network can be further trained with supervision to perform classification.


    Convolutional Neural Network


    The convolutional neural network is a type of artificial neural network used in
    image recognition and processing and is specifically designed to process pixel
    data. A neural network is a system of hardware or software patterned after the
    operation of neurons in the human brain. A convolutional neural network is a category
    of neural networks that are very effective in areas such as image recognition
    and classification.


    These networks are used in a variety of areas, including image and pattern recognition,
    speech recognition, natural language processing (NLP), and video analysis.


    Stacked Autoencoders


    A stacked autoencoder is a neural network that consists of multiple layers of
    light autoencoders where the outputs of each layer are wired to the inputs of
    the successive layer. The stacked autoencoder can be used for classification problems.


    Ensemble


    An ensemble is a type of supervised learning.'
