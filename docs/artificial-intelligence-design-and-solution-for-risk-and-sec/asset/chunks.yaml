  trans: "\n\n# 第 1 章：简介\n\n## 目标读者\n\n本书主要关注 AI 如何应用于风险与安全管理。本书遵循 AI 在自然语言处理分支、AI\
    \ 自然语言问答系统、风险与安全领域的对话式 AI、AI 支持无人机、AI 网络安全、物联网设备以及用例方面的当前趋势。\n\n适用的 AI 主题面向：\n\
    \n*   企业高管、创始人、首席技术官、首席信息官、首席数据官、首席安全官、首席风险官、数据科学家、数据架构师、AI 设计师、AI 工程师、项目经理和顾问，旨在帮助他们理解如何利用\
    \ AI 管理风险与安全。\n*   学生、教师和开发人员将发现本书实用且有用。它将概述许多 AI 组件，并介绍 AI 如何在大型、中型和小型企业环境中使用。\n\
    *   任何致力于理解 AI 如何用于风险与安全的人士。\n\n## 你将从本书获得什么？\n\n*   理解并学习如何将 AI 应用于风险与安全。\n*\
    \   设计并应用基于知识的 AI 解决方案以解决风险与安全问题。\n*   AI 系统的架构与设计依赖于以下要素：\n    *   **主题专家**：这意味着拥有解决方案如何被使用的实践视角，而不仅仅是如何被开发。书中以风险与安全的案例研究为例。\n\
    \    *   本书采用了**适当应用的数学与算法**。如果你有深入研究的需求，请勿跳过数学公式。AI 高度依赖数学。\n    *   **应用物理及其在硬件系统中的应用，以及从量子计算机到量子计算机网络并行处理的未来方法**。AI\
    \ 仍在不断演进。请全神贯注于未来 AI 章节中的新概念和应用创意。\n    *   **决策理论、决策制定过程和马尔可夫决策过程算法**（Gupta 和\
    \ Katarya，2018）。\n\n## 本书涵盖内容\n\n本书介绍了 AI 如何应用于企业、初创公司以及大、中、小型公司，以帮助自动化维护风险与安全的繁琐工作。通过应用\
    \ AI 和机器学习来辅助人类专家，自动化改善了组织的工作环境。\n\n*   公司如何从 AI 中获得真正的价值？\n*   具有远见的 AI 业务用例有哪些？\n\
    *   如何识别最佳的 AI 采用业务案例并评估机会？\n*   我应该自建还是购买 AI 平台？\n*   如何为企业寻找并招募顶尖 AI 人才？\n*\
    \   如何将 AI 引入业务以增加收入或降低成本？\n*   如何促进组织内部的 AI 采用？\n\n处理数据包括数据收集、数据准备、数据转换、数据安全、利用数据与组织的\
    \ AI 用例保持一致等更多内容。\n\n本书简介的思维导图见图 1.1。这为读者指明了本书涵盖的内容和章节组织。\n\n![Image](img/ch1fig1.JPG)\n\
    \n**图 1.1** 本书思维导图\n\n见图 1.2。这为读者指明了本书中涵盖哪些风险领域的 AI 解决方案。\n\n![Image](img/ch1fig2.JPG)\n\
    \n见图 1.3。这为读者指明了本书中涵盖哪些安全领域的 AI 解决方案。\n\n![Image](img/fig1.3.jpg)\n\n**图 1.3**\
    \ AI 安全解决方案思维导图\n\n## 章节安排\n\n*   人工智能（AI）项目架构与设计\n*   风险简介\n*   安全简介\n*   AI\
    \ 知识库简介\n*   AI、风险与安全的融合\n*   业务用例\n*   面向风险的 AI 解决方案\n*   面向安全的 AI 解决方案\n*  \
    \ 行业领域\n*   职能领域\n*   未来 AI\n\n## 结语\n\n## 参考文献\n\n---\n\n# 第 2 章：人工智能/机器学习项目架构与设计\n\
    \n## 章节大纲\n\n*   AI 和 ML 项目的架构与设计视角\n*   当前架构与未来架构的对比\n*   数据分析与生命周期\n*   数据处理步骤\n\
    *   未来的清洗与提取\n*   ML 算法\n\n## 关键学习点\n\n*   学习并理解如何开展 AI 和 ML 项目架构与设计\n\n## AI\
    \ 和 ML 项目架构与设计步骤\n\n*   定义问题陈述\n*   了解现有和当前的业务架构与业务流程\n*   定义业务案例和用例\n*   确定目标\n\
    *   AI 和 ML 应用于业务架构与业务流程\n    *   对问题、用例和业务流程进行泛化\n    *   重新定义整体流程\n    *   转化为\
    \ AI 和 ML 问题陈述\n*   定义 AI 和 ML 架构\n*   评估可用的 AI 和 ML 算法以确定架构\n*   设计整体 AI 和 ML\
    \ 解决方案\n*   设计数据架构和数据设计\n*   开发、训练、验证、改进和部署\n\n详细的架构与设计步骤见图 2.1 AI 和 ML 项目架构与设计流程。\n\
    \n![Image](img/ch2fig1.JPG)\n\n**图 2.1** AI 和 ML 项目架构与设计流程\n\n## 术语与术语表\n\n在统一建模语言中，参与者是由用户（利益相关者）或与主体交互的任何其他系统所扮演的角色。参与者与主体交互，例如，组织数据和操纵数据的资源。另一个例子是用例的主要参与者，即调用系统以提供其服务之一的利益相关者。\n\
    \n## 定义问题陈述\n\n问题陈述是基于相关需求，对待解决的问题或待改进的状况的描述（Jain 等，2018）。通常，当前问题陈述与流程或产品的期望目标陈述之间存在差距。\n\
    \n请参考五个 W（Who、What、When、Where 和 Why），结合过去、现在和未来状态，清晰地定义问题陈述。\n\n*   **Who（谁）**：定义问题或系统的参与者及涉及的流程。\n\
    *   **What（什么）**：定义问题及问题的目标。\n*   **When（何时）**：定义特定事件或动作发生的时间。\n*   **Where（何地）**：定义发生地点或预期发生地点。\n\
    *   **Why（为什么）**：定义为什么会发生、为什么发生了、或为什么将会发生。\n\n在此加入“How（如何）”，以清晰地理解问题。着眼大局，分析既往问题、当前问题和未来问题。定义问题将如何解决的期望状态。\n\
    \n## 问题陈述示例\n\n### 面向风险的 ML 和 AI\n\n"
