- raw: '5.  The data preparation phase is generally the most iterative and the phase
    that teams tend to underestimate.


    The data preparation stage requires development workspaces.


    Preparation of the workplace is beneficial for the following reasons:


    *   It creates an analytic workspace.


    *   It allows the team to explore data without interfering with live production
    data.


    *   A prepared workspace collects a variety of data (expansive approach).


    *   The workspace allows organizations to undertake ambitious projects beyond
    traditional data analysis.


    *   This concept is acceptable to data science teams and IT groups.


    In the workspace, the extract, transform, load, and transform functions may be
    performed based on the team (System and Method for Providing Predictive Behavioral
    Analytics 2018):


    The extract, transform, and load users may perform extract, transform, and load
    functions.


    In the workspace, the extract, load, and transform process preserves raw data,
    which can be useful for examination.


    Example: In a financial organizations’ credit card fraud detection, high-risk
    transactions may be carelessly filtered out or transformed before being loaded
    into the database.


    Learning about the data is important for the following reasons:


    1.  It determines the data available to the team early in the project.


    2.  It highlights gaps and identifies data not currently available.


    3.  It identifies data outside the organization that might be useful.


    Data Conditioning


    The data should be conditioned for several reasons, such as cleaning data, normalizing
    datasets, and performing transformations. This task is viewed as the step prior
    to data analysis, and the step might be performed by the data owner, IT department,
    and database administrator. Data scientists should be involved. It is a known
    fact that data science teams prefer too much data rather than too little.


    Here are questions and observations that must be addressed when analyzing the
    data, along with the chapters where you can find further information on these
    topics.


    [Chapter 3](#03_Chapter_3.xhtml): What are the data sources and target fields?


    [Chapter 4](#04_Chapter_4.xhtml): How clean is the data?


    [Chapter 5](#05_Chapter_5.xhtml): How consistent are the contents and files? Are
    there missing or inconsistent values?


    [Chapter 6](#06_Chapter_6.xhtml): Assess the consistency of the data types (numeric,
    alphanumeric)?


    [Chapter 7](#07_Chapter_7.xhtml): Review the contents to ensure the data makes
    sense.


    [Chapter 8](#08_Chapter_8.xhtml): Look for evidence of systematic error.


    Survey and Visualize


    Specific data visualization tools may be used to gain an overview of the data
    (Wang et al. 2019). This process starts with overview and on-demand zoom and filter
    details. This approach enables the user to find areas of interest and zoom and
    filter to find more detailed data.


    The following questions and observations must be addressed when surveying and
    visualizing data.


    [Chapter 1](#01_Chapter_1.xhtml): Review data to ensure calculations are consistent.


    [Chapter 2](#02_Chapter_2.xhtml): Does the data distribution stay consistent?


    [Chapter 3](#03_Chapter_3.xhtml): Assess the details of the data, the range of
    values, and the level of aggregation of the data.


    [Chapter 4](#04_Chapter_4.xhtml): Does the data represent the population of interest?


    [Chapter 5](#05_Chapter_5.xhtml): Check time-related variables: daily, weekly,
    monthly? Are these variables sufficient?


    [Chapter 6](#06_Chapter_6.xhtml): Is the data standardized or normalized? Are
    the data scales consistent?


    [Chapter 7](#07_Chapter_7.xhtml): In the case of geospatial datasets, are state
    and country abbreviations consistent?


    Tools for data preparation are Hadoop, Alpine Miner, OpenRefine, Data Wrangler,
    and Google Cloud data preparation.


    *   Hadoop can perform parallel consume and analysis.


    *   Alpine Miner provides a graphical user interface for creating analytic workflows.


    *   OpenRefine (formerly Google Refine) is a free, open-source tool to use with
    messy data.


    *   Data Wrangler is an interactive tool for data cleansing and transformation.


    *   Google Cloud provides data preparation.


    Phase 3: Data Modeling


    In this phase, the following steps are conducted:


    *   Determine the structure of the data to help determine the tools and analytic
    techniques for the next phase (Palli et al. 2019).


    *   Determine the analytic techniques that will enable the team to meet business
    objectives and accept or reject the working hypotheses.


    *   Decide on a single model or a series of techniques as part of a larger analytic
    workflow.


    *   Understand how similar problems have been analyzed in the past.


    Phase 4: Model Building


    The following tasks are considered in model building:


    1.  Execute the models defined in Phase 3.


    2.  Develop datasets for training, testing, and production.


    3.  Develop models on training data and test-on-test data.


    4.  Questions to consider:


    1.  Does the model appear valid and accurate on the test data?


    2.  Does the model output and behavior make sense to the domain experts?


    3.  Do the parameter values make sense in the context of the domain?


    4.  Will the model sufficiently and accurately meet the goal?


    5.  Can the model avoid intolerable mistakes?


    6.  Are more data or inputs needed?


    7.  Will the type of model chosen support the run-time environment?


    8.  Will a different model be required to address the business problem?


    Common model building tools are: R and PL/R—PL/R, Python, SQL, Octave, WEKA, SAS,
    SPSS Modeler, MATLAB, Alpine Miner, STATISTICA, and MATHEMATICA.


    Phase 5: Communication Results


    The following steps should be followed when communicating results:


    1.  Determine if the team succeeded or failed in its objectives.


    2.  Determine if the results are statistically significant and valid.


    3.  If the results are significant and valid, identify aspects of the results
    that present relevant findings.


    4.  Determine if the results are in line with the hypotheses.


    5.  Communicate the results and major insights derived from the analysis.


    Phase 6: Operationalize


    The following occurs in the operationalize phase:


    1.  The team communicates the benefits of the project.


    2.  The team sets up a pilot project to deploy the work in a controlled way.


    3.  Risks are managed and corrective action is taken by undertaking small scope
    and pilot deployment before a wide-scale rollout.


    4.  During the pilot project:


    1.  The team may execute the algorithm more efficiently in the database rather
    than with in-memory tools like R, especially with larger datasets.


    2.  To test the model in a live setting, consider running the model in a production
    environment for a discrete set of products or a single line of business.


    3.  Monitor model accuracy and retrain the model if necessary.


    Let us look at the ML algorithms mind map and define the terms and terminologies
    used in the mind map.


    ML Data Processing


    Data processing is important in any analytical project, data project, or ML and
    AI project. Most of the time is spent in this step (Kotenko et al. 2019).


    See [Figure 2.6](#02_Chapter_2.xhtml#ch2fig6).


    ![Image](images/fig2.6.jpg)


    Figure 2.6 ML and AI data processing map


    Some of the statistics-related items are discussed here. If you want to know more
    about the terms and terminologies, please reference a statistics book. [Figure
    2.6](#02_Chapter_2.xhtml#ch2fig6) explains the required steps needed to process
    data and lists statistical experiments and measuring methods.


    The first step in the data processing is to determine the statistical data type
    or levels of measurement by examining different techniques (Overgoor et al. 2019;
    Ohanian 2019).


