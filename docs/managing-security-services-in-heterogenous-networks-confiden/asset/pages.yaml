    The Internet of Things (IoT) happens to be one of the most promising technologies
    in recent research. Collecting data from multiple heterogeneous devices, as well
    as storage and analysis of the collected data, has applications in many domains
    such as healthcare, transportation, home automation, etc., drawing the attention
    of researchers from various domains. Even though data are collected from different
    heterogeneous devices, these data are stored in the cloud. In case of the cloud-enabled
    Internet of Things, it offers multitenancy as one of its characteristics. Simultaneously
    securing such data and offering a good access control policy over the cloud without
    compromising on user data and privacy is a challenging task. Access control policies
    provide an efficient access control mechanism for users to access data over the
    cloud. In this chapter, an extensive overview of existing access control policies
    proposed in the context of the cloud and IoT are discussed in detail. Also, the
    possibilities of future research directions are outlined.


    # 1.1 Introduction


    The IoT is state-of-the-art technology that not only requires the development
    of infrastructure and software but also the design and deployment of services
    capable of supporting multiple scalable, interoperable, and secure applications.
    In the process of designing the secure communication architecture for IoT data,
    many have realized that a common problem to be addressed is the security of the
    information, with an emphasis on access control policies so that data can be used
    effectively by a wide range of users based on their requirements.'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'In this chapter, we review and summarize recent trends and challenges in access
    control related to data in the cloud and IoT and discuss various models that support
    data accessibility, taking the IoT and cloud computing as reference examples of
    application domains.


    The Internet Society [31] describes the IoT as follows: “IoT refers to scenarios
    in which network connectivity and computing capability to extend it to objects,
    sensors and devices not normally considered computing devices, allowing these
    to generate exchange and utilize data with no human intervention”.


    Mattern and Floerkemeier [23] visualized IoT technology as “The Internet of Things
    represents a vision in which the Internet extends into the real world embracing
    everyday objects. Physical items are no longer disconnected from the virtual world,
    but can be controlled remotely and can act as physical access points to Internet
    services”.


    # 1.1.1 The Network of Things


    The National Institute of Standards and Technology (NIST) defines the following
    five primitives for the “Network of Things” that includes IoT as well [35]:


    +   1. Sensors that measure the physical parameters that are of interest such
    as temperature, humidity, pressure, weight, etc.

    +   2. Aggregators that convert the raw data into processed or aggregated data.

    +   3. Communication channel that allows data transmission among the entities
    involved.

    +   4. External utilities include external components required for the computation.

    +   5. Decision triggera are predicates that have true values used to initiate
    a command or action.


    The IoT may or may not utilize all the primitives defined for the Network of Things,
    dor example, a cyber physical system that can operate without the help of sensors.
    Another essential primitive component required for the IoT (not listed in the
    NIST primitives) is “smartness”. Research in IoT is evolving in multiple directions
    with the research progress in the IoT primitives and manufacture of energy-efficient,
    low-cost hardware communication devices [20]. However,'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'the heterogeneity of underlying devices and communication technologies, interoperability,
    and security requirements in different layers is a challenge for generic IoT solutions
    to be developed on a larger scale.


    Xu et al. [11] proposed a four-layered architecture for IoT comprising the following:


    +   1. Sensing Layer – Acts as an interface between the physical world and cyber
    world, sensing and collecting data with the help of sensors, cameras, radio frequency
    identification (RFID), etc.

    +   2. Networking Layer – Provides networking support for data transmission and
    collection and control applications.

    +   3. Service Layer – Acts as middleware to support business logic and service
    integration.

    +   4. Interface Layer – Provides an interface to seamlessly integrate the service
    layer with end users.


    # 1.2 The IoT Application Domain


    The IoT has applications in various domains. Figure 1.1 represents an overview
    of IoT application areas ranging from personal gadgets to industries.


    # 1.3 Cloud Computing


    The IoT infrastructure collects data and stores them over networked servers like
    the cloud. According to NIST, cloud computing [24] is defined as “a model for
    enabling ubiquitous, convenient, on-demand network access to a shared pool of
    configurable computing resources that can be rapidly provisioned and released
    with minimal management effort or service provider interaction”.


    Also, NIST suggests essential characteristics, deployment models, and service
    models for cloud computing [24].


    # 1.3.1 Essential Characteristics


    +   a. On-demand self service

    +   b. Broad network access

    +   c. Resource pooling'
