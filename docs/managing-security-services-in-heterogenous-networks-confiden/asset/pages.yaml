  md: 'energy. Mobile nodes are dynamic in nature, and also the energy-constrained
    and the destination node is equipped with a high energy resource than the participant
    nodes. The destination node is also located within the network region. The proposed
    work can be classified into three phases such as pre-processing (outlier selection)
    phase, clustering phase, trust computation phase, and routing phase. First, outliers
    are identified in this work based on the weights that are assigned, based on the
    node energy and distance. Here, outliers are not considered for further processing.
    Second, new clusters are formed based on the distance and energy. Third, the trust
    scores for all the nodes which are available in various clusters are calculated.
    Fourth, the routing process is performed based on the energy level and trust scores
    of the individual nodes in the network.


    # 2.4.1 Pre-processing


    In this section, a FRWDOA for distinguishing the outliers within the network is
    described. It uses the relative location of some extent with some assigned weight
    in step with its perceived importance and its neighbor within the feature set
    to work out the outlier of some extent with regard to all clusters. The overall
    definitions of weighted distance–based outlier detection as follows: Let f1, f2,
    ..., fk be the K-nearest neighbors of an object x with weights wt1, wt2, wt3,
    ..., wtk. The weighted distance of those k-nearest neighbors is outlined as wt1ds1,
    ws2ds2, ..., wtkdsk where ds1, ds2, ..., dsk are the conventional Minkowski distances
    d(x, si) = wt dsi. The typical weighted distance is calculated using victimization
    in (1).


    ```

    \frac{1}{k} * \left( \sum_{i=1}^k \frac{wt_i ds_i}{\sum wt_i} \right) \quad (1)

    ```


    # FRWDOA


    The fuzzy rules are framed using the energy level and distance of the nodes and
    are used for performing the training and testing process for identifying the outliers
    in the network.


    +   STEP 1: Assign the weighe to the nodes based on the energy level using fuzzy
    rules.'
