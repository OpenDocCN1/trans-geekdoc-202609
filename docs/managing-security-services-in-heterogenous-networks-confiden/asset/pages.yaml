    # 3.1 Introduction


    In mobile ad-hoc networks(MANETs), a node has to interact with unknown nodes in
    establishing the network. The applications are run successfully, if all the nodes
    are cooperative. Hence, the trust computation of each node is certainly an advantage
    in running applications effectively by eliminating untrustworthy nodes. Due to
    the severe resource constrains (like energy, computational power, bandwidth, and
    time) and dynamics (like topological changes, mobility, and channel conditions)
    of the network, creation of a secure environment by implementing complex encryption
    algorithms (hard security) is not a trivial task [8]. Alternatively, researchers
    have concentrated on soft security (trust) methods to separate malicious nodes
    by monitoring their activities.


    In MANET, usually a node switches to selfish mode when it is short of resources,
    and it may not cooperate in running neighbor applications. Due to malicious behavior,
    a node can weaken the network performance by dropping or tampering with packets.
    In this regard, authors [1,2] suggest taking into account a node’s ability (in
    terms of resources) and attitude in its trust estimation. Through the node trust
    computation, the quality of service (QoS) of the applications in the network can
    be improved [10,12].'
