    # Bluetooth vulnerabilities result in the following:


    +   - The unit key turns into public after its first use

    +   - Encryption keystream repetition

    +   - Paves way for eavesdropping

    +   - PIN management

    +   - Recurrent authentication attempts

    +   - Secure storage of link keys


    # Vulnerabilities in All Versions of Bluetooth


    Cope, P. et al. [47] points out that the following vulnerabilities are prevalent
    in all versions of Bluetooth:


    +   - Adversaries can view and hypothetically alter link keys if they are stored
    inappropriately.

    +   - The small key length of the encryption key makes them vulnerable to attackers.

    +   - The encryption keys can be as minor as 1 byte.

    +   - Lack of user authentication.

    +   - Only device authentication is included in the Bluetooth standard

    +   - A device can continue in discoverable/connectable mode for an unlimited
    period of time.


