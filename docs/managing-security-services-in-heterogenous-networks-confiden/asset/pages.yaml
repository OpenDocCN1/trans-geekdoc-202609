- pgno: 12
  md: 'The connected things ecosystem can utilize any of the previously mentioned
    cloud deployment and service models in combination to store data to form the Cloud-Enabled
    Internet of Things (CEIoT). In CEIoT, the cloud infrastructure is used as the
    medium of storage for the data sensed through IoT devices; many challenges arise
    due to this combination of IoT and cloud. The most common issue that needs to
    be ensured at both ends is security and privacy, as both the cloud and IoT deal
    with the storage and collection of data, respectively. In this chapter, we will
    emphasize one of the security features, access control, with respect to CEIoT,
    which validates the righteousness of the user in accessing stored data on the
    cloud. Throughout this chapter we have provided an overview of existing methods
    that make use of access control methods.


    # ## 1.4 Motivation


    The main motivation behind this chapter is the basic concept that heterogeneous
    data collected through sensing devices are stored on the cloud infrastructure
    and need the utmost care in terms of providing security and privacy of personal
    data [9,15,27,29,38]. The cloud being a multitenant and heterogeneous environment,
    it will be storing different types of data collected through various sources.
    Ensuring security to such data is of the utmost priority, as a simple breach can
    lead to discrepancies in business entities that trust the infrastructure as a
    medium of storage. CIA (confidentiality, integrity, and availability) traits are
    the essential components to ensure the security of data. These features are also
    important for providing proper access control, which determines information security
    [21,30,32,37].


    # ## 1.5 Preliminaries


    The primitives used in defining secure access control policies are discussed in
    this section.


    # ### 1.5.1 Role-Based Access Control


    Role-based access control (RBAC) methods have been predominantly used since the
    UNIX operating system days to specify permission to a specific set of users to
    access files [12]. With the'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'recent awareness and advances in the technology, many of the commercial applications
    or vendors have come up with their own access control policies suitable for their
    products or organizations. RBAC has evolved from mandatory access control (MAC)
    and discretionary access control (DAC).


    DAC refers to restricting or permitting access based on the group to which the
    initiator of the action belongs. For example, a user belonging to group A may
    or may not be given permission to access some set of files based on his or her
    membership in group A.


    MAC implementation requires specifying user permissions at the time of user creation
    itself. For example, a set of users in an organization is allowed to access the
    kernel of the operating system, whereas another set of users is strictly denied
    such access. MAC methods are widely used in defining multilevel security and military
    applications.


    RBAC methods define roles to users and vice versa. Many vendors and practitioners
    have proposed their own RBAC policies [33]. In order to standardize the RBAC model,
    Ferraiolo et al. [13] have proposed NIST standards for RBAC, with the RBAC reference
    model defining a collection of components. The RBAC model considers users, roles,
    permissions, operations, and objects as its elements.


    The following components are defined for the RBAC reference model [13]:


    +   1. Core RBAC – A minimalistic definition of RBAC with its elements consisting
    of users, roles, permissions, operations and objects, and their functionalities.
    It operates in a user-role review model wherein users are assigned to a specific
    role and roles are assigned to a specific user.


    +   2. Hierarchical RBAC – Defines role hierarchies and structuring roles in an
    organization. It can also define inheritance among roles.


    A further two types are defined in hierarchical RBAC:


    +   a. General Hierarchical RBAC – It supports hierarchical and multiple inherited
    permissions to a user.


    +   b. Limited Hierarchical RBAC – It supports limiting access to'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'users. An access structure such as trees or inverted trees can be used to define
    access permissions.


    # 3. Static Separation of Duty Relations


    +   a. Static Separation of Duty (SSD) – This will place constraints on the assignment
    of users to roles. It can be used to prevent assigning contradictory (or mutually
    exclusive) roles to a single user.


    +   b. Static Separation of Duty in the Presence of a Hierarchy – This is similar
    to SSD and can be used to assign permissions hierarchically in addition to direct
    assignment of permissions.


    +   4. Dynamic Separation of Duty Relations – This can be used to limit the number
    of permissions and roles to a user and timely revocation of permissions.


    Out of which implementation of core RBAC component ensures full-fledged RBAC implementations,
    based on requirements other components can be introduced on top of the core RBAC.
    For detailed efforts on the standardization of RBAC, refer to [13].


    # 1.5.2 Capability-Based Access Control


    In the capability-based access control (CapBAC) method, a user in need of a service
    will place a request (containing the user’s attribute, resource ID, etc.) to grant
    access permission [16,18]. The policy decision point (PDP) evaluates the request
    and compares it with the knowledge base it possess. If the request is accepted,
    then PDP will issue a capability token (in the form of a ticket or token) to grant
    permission to the requested resource. Upon receiving the capability, the user
    can directly request the resource provider to access the resource. It is similar
    to the Kerberos mechanism [25].


    CapBAC also guarantees the principle of least authority (PoLA) wherein a user
    will be enabled with the least access permissions he or she requires to complete
    a task and nothing more. In addition, the CapBAC method can outsource the authorization
    process, which was not present in the RBAC model. Also, the access policy logic
    can'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'be locally defined based on requirements in this model, or a context-aware
    access control policy can be defined.


    One of the drawbacks in both RBAC and CapBAC is a single point of failure. If
    a server or service authenticating user requests is down, the system will not
    be in a position to serve requests. Recently some distributed architectures have
    been proposed to overcome this drawback. RBAC is more generic in nature and can
    be adopted to any enterprise or communication setup that requires RBAC, whereas
    CapBAC mechanisms can be defined specific to applications.


    # 1.5.3 Attribute-Based Access Control


    Attribute-based access control (ABAC) is also called policy-based access control
    [19]. In ABAC, both subjects and objects will have attributes of their own in
    addition to action and environment. A subject possessing a set of attributes will
    request a central entity to give permission to access a particular object. The
    central entity will have policy definitions on “who can access what”. The central
    entity will evaluate subject requests with respect to object attributes and grant
    or reject access considering the action and environment.


    ABAC will have a central entity describing policies. Every time it is not required
    to define new policies for the individual subjects, only attributes belonging
    to a subject can be changed. This will enable the central entity to efficiently
    handle group dynamics, a core feature that is required for IoT applications.


    Even though the standards for ABAC are in a draft stage by NIST and other standards
    associations, the majority of ABAC models have the following components, as outlined
    by Servos and Osborn [34]:


    +   a. Subject

    +   b. Object

    +   c. Attributes

    +   d. Permissions

    +   e. Policies


    The core ABAC can be extended in many directions and environments. One of the
    well-researched and distinct areas of'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'research that has evolved out of ABAC is attribute-based encryption (ABE) with
    ciphertext policy ABE (CPABE) [5] and key policy ABE (KPABE) [14,36] types. As
    ABE techniques are beyond the scope of this chapter, a detailed description on
    the same can be found in.


    # ## 1.6 Access Control Methods in the CEIoT


    The CEIoT is one of the upcoming research areas that recently caught the attention
    of researchers in various domains such as IoT, cloud computing, and access control
    methods [2,10,26]. Many architectures have been proposed in the literature and
    practice for IoT even though there is no consensus among the architectures [28,30].
    In general, the proposed architectures consist of an object layer and application
    layer in addition to one or more middle layers. The object layer corresponds to
    physical devices (such as sensors, cameras, RFID tags, smart phones, etc.) from
    which data are collected. The application layer consists of services offered over
    data collected such as data access, analytics, decision support system, data trade,
    etc. [1,22]. The middle layer is composed of single or multiple layers that in
    turn comprise the network layer or similar supporting layers of communication
    for the IoT framework. Some architectures even have additional sublayers to the
    middle layers.


    Gubbi et al. [15] proposed the integration of cloud computing as one of the layers
    existing between the object layer and application layer in addition to other layers.
    However, these methods do not address access control methods. In this section,
    we review the schemes that satisfy CEIoT criteria. Even though the schemes proposed
    do not employ a cloud computing layer, they are reviewed as they offer CapBAC
    in the IoT, which can be extended to incorporate a cloud computing layer.


    # ### 1.6.1 The Cloud-Enabled Internet of Things


    Alshehri and Sandhu [2] proposed cloud-enabled access control methods for the
    IoT. As discussed in the previous section, in many of the IoT architectures only
    the object layer and'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'Application Layer

    Cloud Computing Layer

    Virtual Object Layer

    Object Layer


    Figure 1.2 Access control-oriented IoT architecture proposed by Alshehri and Sandhu.


    application layer were proposed initially, and later Gubbi et al. proposed a cloud
    computing layer to the IoT architecture to exploit the features of cloud computing.
    To enable access control in CEIoT, Alshehri and Sandhu proposed a four-layer architecture,
    as given in Figure. 1.2 and named it access control–oriented IoT (ACOIoT) architecture
    [2].


    Alshehri and Sandhu explained this architecture with the help of a multivalue
    switch case and other such multiple devices [2]. Access control logic will be
    present in the cloud computing layer, and they have adopted ABAC for access control.
    The cloud computing layer offers multitenancy and a different type of structured
    and unstructured data management support [17]. The object layer will consist of
    heterogeneous devices that collect data such as sensors, camera, smart phones
    (with multiple sensors), and actuators and present data to the upper layers, namely
    the virtual layer. The virtual layer consists of virtual objects that are mapped
    to object-layer devices. Virtual-layer objects can be defined as required. Virtual
    objects help to store the state or values associated with devices in the object
    layer. The virtual object layer is also used to communicate commands to the object
    layer from higher layers. Virtual objects can be defined either as one to one
    (one virtual object mapped to one device) or one to many (one virtual object mapped
    to many devices). ABAC in the ACOIoT architecture use case is demonstrated with
    a multivalue switch case. The PDP and policies will be stored in the cloud computing
    layer.


    Further, Alshehri and Sandhu [3] extended the architecture in [2] to access control
    in cars and propose operational models for virtual object (VO) communication.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '1.6.1.1 CEIoT for Wearable Devices Bhatti et al. [7] extended the architecture
    in [2] to wearable devices with an additional object abstraction layer (in between
    the object layer and virtual object layer) to efficiently implement access control
    policies with specifications on interlayer communication (specifying which layers
    are allowed to communicate and not allowed to communicate with each other). Wearable
    devices are personal devices, and providing access control in such a resource-constrained
    device environment is challenging.


    1.6.1.2 Authorization in the Cloud-Based IoT Bhatti et al. [6] also extended the
    architecture proposed in [2] to handle present-day authorization processes in
    an IoT scenario. Bhatti et al. [6] demonstrated an enhanced ACOIoT (EACOIoT) in
    implementing access policies. An additional object abstraction layer present in
    this model will handle authorization and privacy between the object layer and
    upper layers of the EACOIoT framework. An object abstraction layer consisting
    of gateway devices provides abstraction between devices in the object layer and
    virtual object layer. The EACOIoT framework is demonstrated with the help of smart
    home and smart university parking use cases.


    1.6.1.3 Amazon Web Services–Enabled IoT Bhatti et al. [8] extended this model
    to IoT devices connected to the Amazon Web Services (AWS) cloud and proposed ABAC
    for defining access control logic. They have considered a thermostat and light
    bulbs use case to demonstrate AWS IoT access control. This model is proposed even
    considering communication protocols such as MQTT. A virtual object associated
    with devices in the object layer is termed a “shadow” or “things shadow”.


    # 1.6.2 Capability-Based Access Control in the IoT


    Even though there is no direct work involving the cloud computing layer in CapBAC,
    the models proposed by Gusmeroli et al. [16] and Hernandez-Ramos et al. [18] in
    the IoT context are discussed in this'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'sectiona as these models can be directly extended to models involving the cloud
    computing layer.


    1.6.2.1 Centralized Capability-Based IoT Gusmeroli et al. [16] proposed a centralized
    capability-based access control in the IoT (CapBACIoT). To address the scalability
    and group dynamic drawbacks in RBAC and ABAC, Gusmeroli et al. [16] proposed the
    CapBAC model in the IoT. They have adopted this approach because CapBAC provides
    better delegation support, capability revocation (temporal revocation), and information
    granularity with a single PDP. They demonstrate this model with information and
    service access associated with car and housekeeping use cases. However, this approach
    has not outlined how access logic is defined separately for different devices,
    which is very much required in the case of IoT, as the access policy of one device
    may or may not be same as that of another device.


    1.6.2.2 Distributed Capability-Based IoT Hernandez-Ramos et al. [18] proposed
    a distributed approach for implementation of CapBAC in IoT. Distributed CapABC
    in the IoT architecture overcomes the drawbacks of a single PDP in the centralized
    CapBAC approach and proposed access logic independently from each of the end devices
    based on requirements. Hernandez-Ramos et al. [18] have even implemented the proposed
    scheme on a 32-bit RISC processor and demonstrated its sustainability in the IoT.
    Also, they have discussed end-to-end secure communication adopting elliptic curve
    cryptography (ECC).


    # 1.7 Future Scope


    The access control models defined here are restricted to one type of environment.
    On a large scale, there are lots of implementation setbacks that arise, many research
    challenges, and opportunity for future. As considered in this chapter, the state-of-the-art
    infrastructures like cloud and IoT need a higher level of security, being also
    robust at the ground level. Even the existing advanced access control policies
    lack in some properties that are essential, like improper multitenant architecture,
    standardization of the'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'overall policy architecture, effective collection of heterogeneous data, boosting
    the power and energy efficiency for the IoT infra-structure, Big Data collection,
    storage and maintenance, security and privacy of data, pricing and billing cloud
    storage, scalability and flexibility of the resources utilized, necessity for
    distributed and decentralized architectures, trustless authentication such as
    the application of smart contract for access control, avoidance of a central authority,
    anonymity of users, applying homomorphic encryption, and much more.


    # 1.8 Conclusion


    An overview of access control methods in the CEIoT, along with different access
    control models, were discussed in this chapter. Existing models, relevant reference
    sources, and possible research directions were also discussed. This chapter serves
    as a pointer to researchers interested in working in the area of access control
    in the CEIoT.'
  merge: -1
  img_proc: true
