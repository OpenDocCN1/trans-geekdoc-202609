  md: 'there is a significant volume of repetitive questions. One of the possible
    reasons for such repetition could be that as forums grow longer, patients and
    humanitarians do not have sufficient time or patience to read through all previous
    questions before posting their own question. The main challenge from this is to
    design and implement a system that gives questions by identifying a maximum of
    two or three existing questions which are most similar to it.


    So by observing all of these challenges with reference to healthcare data, we
