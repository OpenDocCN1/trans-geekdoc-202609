  md: 'LARS: A locally aware reputation system (LARS) is proposed in [21], which can
    address badmouthing and on-off attacks. At each node the knowledge collection
    component uses the watchdog mechanism in assessing neighbor node behaviour. Here
    in data transmission, a node sets the timer after sending data to the destination
    node. If the node does not receive any acknowledgement before timing out, it starts
    the probe by sending a special trace packet to find the malicious node along the
    route.


    # 3.4 Trust Management Using Soft Computing Methods in MANETs


    In MANETs, the applications run successfully only with the cooperation and coordination
    of all the nodes in the network. Usually, a node switches to selfish mode when
    short of resources and will not cooperate with other nodes. Some of the articles
    [3,5] proposed that the trust computing methods should consider a node attitude
    and ability (in terms of its available resources) in its trust estimation. These
    methods can improve the quality of service (QoS) of the applications, since each
    node''s resources (quality parameters) are taken into consideration in the trust
    computation. Some of the lightweight soft computing methods include the following:


    +   - Fuzzy logic

    +   - Fuzzy Petri nets

    +   - Bayesian conditional probability

    +   - Demsters Shafer theory

    +   - Trust matrices


    # 3.4.1 Trust Computation Using Fuzzy Logic


    In [6], a fuzzy-based QoS trust model is proposed, and it is explained in Figure
    3.3. Here the node ability and attitude are considered in the trust computation.
    Node ability is evaluated in terms of its QoS metrics like link expiry time (LET),
    bandwidth, and energy, whereas attitude is evaluated in terms of its reliability.
    Here the fuzzy logic is used to combine all these QoS metrics to derive a node
    trust value.'
