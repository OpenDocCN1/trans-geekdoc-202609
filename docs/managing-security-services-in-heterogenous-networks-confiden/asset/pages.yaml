    # 7.2.2 Approaches for Bluetooth Range Escalation


    The real time *LE-enabled project leaves the researchers in a Catch-22 when it
    is unable to cover adequate range.* The conundrum faced by the engineers can be
    flattened by four ways to extend the range of Bluetooth-enabled products. **The
    crucial point is to pick the secure approach.** The four approaches that are needed
    to outspread the range are:


    +   - Using the long-range feature (coded PHY) in Bluetooth 5

    +   - Amplifying the signal

    +   - Employing a repeater to relay the signal

    +   - Utilizing LE


    +   i. **Using the Long-Range Feature in Bluetooth 5** – LE Long Range/Coded PHY
    is a special capability of Bluetooth 5, which permits enlarged range by increasing
    the output power and by using bit expansion using Forward Error Correction (FEC)
    coding. It directs each bit in the data packet as coded 2- or 8-bits so as to
    offer more devices to receive transmissions at farther distances. Repetition increases
    the range.


    +   ii. **Amplifying the Signal** – This second approach increases the signal
    strength by increasing the power being channeled into the antenna to produce a
    stronger RF output. This “brute-force” method has some caveats like the limits
    fixed by the certification standards on how much power amplification can be exploited.
    Amplifying the signal consumes uses more battery than operating a device.


