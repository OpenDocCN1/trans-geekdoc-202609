    # 4.1 Consensus Mechanisms: An Introduction


    Consensus mechanisms allow a decentralized network to arrive at an agreement about
    the current network state [1]. In a centralized system or federal organization,
    all the decisions are taken by a single elected leader or a board of members,
    whereas in a decentralized network, a leader will not be available to take decision
    independently; instead, a group of systems/nodes are involved in the decision-making
    process. This process supports a decision, subject to the interest of all the
    people involved in the decision-making process, called a consensus. The mechanism
    used to achieve consensus in a distributed, decentralized network is defined as
    consensus mechanisms. These consensus mechanisms are the backbones of the heavily
    disruptive technology blockchain. In voting systems, the solution with the majority
    of votes wins; there is no weight for emotions or the welfare of the minority.
    In consensus systems, a decision is made for the benefit of the whole group scattered
    around the system, paving the way to create a more democratic and nondiscriminatory
    society. The famous implementation of blockchain is Bitcoin: a cryptocurrency
    implemented using the consensus mechanism. Behind any cryptocurrency in today''s
    world, there exists a consensus mechanism. Consensus protocols also ensure mutual
    agreement [2] is reached in the cryptocurrency and there is no double spending.


    # 4.2 Distributed Consensus Algorithms


    Distributed consensus algorithms are the algorithms designed for reaching consensus
    in a distributed environment. The reached consensus should be a satisfactory solution
    supported by every individual in the network, even though it is not their personal
    favorite solution. These algorithms make sure the next block/value added to the
    system is the one and only version of truth. This way we can define consensus
    as a vibrant way of reaching a general agreement and commonality of faith within
    the group. Figure 4.1 shows an illustration of a consensus'
