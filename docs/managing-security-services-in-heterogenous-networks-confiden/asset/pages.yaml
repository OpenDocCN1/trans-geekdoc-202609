    # 6.2.3 Challenges Related to IoT Security


    The following are the top ten challenges for IoT security:


    +   - Secure constrained devices

    +   - Authorize and authenticate devices

    +   - Manage device updates

    +   - Secure communication

    +   - Ensure data privacy and integrity

    +   - Secure web, mobile, and cloud applications

    +   - Ensure high availability

    +   - Detect vulnerabilities and incidents

    +   - Manage vulnerabilities

    +   - Predict and preempt security issues


    6.2.3.1 Secure Constrained Devices Many IoT devices have limited amounts of storage,
    memory, and processing capability, and they often need to be able to operate on
    lower power, for example, when running on batteries. Security approaches that
    rely heavily on encryption are not a good fit for these constrained devices, because
    they are not capable of performing complex encryption and decryption quickly enough
    to be able to transmit data securely in real time. These devices are often vulnerable
    to side-channel attacks, such as power analysis attacks, that can be used to reverse-engineer
    these algorithms. Instead, constrained devices typically only employ fast, lightweight
    encryption algorithms. Internet of Things (IoT) systems should make use of'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'multiple layers of defense, for example, segregating devices onto separate
    networks and using firewalls, to compensate for these device limitations.


    **6.2.3.2 Authorize and Authenticate Devices** With so many devices offering potential
    points of failure within an IoT system, device authentication and authorization
    is critical for securing IoT systems. Devices must establish their identity before
    they can access gateways and upstream services and apps. However, many IoT devices
    fall down when it comes to device authentication, for example, by using weak basic
    password authentication or using passwords unchanged from their default values.


    Adopting an IoT platform that provides security by default helps to resolve these
    issues, for example, by enabling two-factor authentication (2FA) and enforcing
    the use of strong passwords or certificates. IoT platforms also provide device
    authorization services used to determine which services, apps, or resources each
    device has access to throughout the system.


    **6.2.3.3 Manage Device Updates** Applying updates, including security patches,
    to firmware or software that runs on IoT devices and gateways presents a number
    of challenges. For example, you need to keep track of updates that are available
    to apply consistently across distributed environments with heterogeneous devices
    that communicate through a range of different networking protocols. Not all devices
    support over-the-air updates or updates without downtime, so devices might need
    to be physically accessed or temporarily pulled from production to apply updates.


    Also, updates might not be available for all devices, particularly older devices
    or those devices that are no longer supported by their manufacturer. Even when
    updates are available, the owners of a device might opt out of applying an update.
    As part of your device management, you need to keep track of the versions that
    are deployed on each device and which devices are candidates for retirement after
    updates are no longer available. Device manager systems often support pushing
    out updates automatically to devices, as well as managing rollbacks if the update
    process fails. They can also help to ensure that only legitimate updates are applied,
    for example, through the use of digital signing.'
  merge: -1
  img_proc: true
- pgno: 125
  md: '6.2.3.4 Secure Communication Once the devices themselves are secured, the next
    IoT security challenge is to ensure that communication across the network between
    devices and cloud services or apps is secure. Many IoT devices don’t encrypt messages
    before sending them over the network. However, best practice is to use transport
    encryption and to adopt standards like Transport Layer Secutiry (TLS). Using separate
    networks to isolate devices also helps with establishing secure, private communication
    so that data transmitted remain confidential.


    6.2.3.5 Ensure Data Privacy and Integrity It is also important that wherever the
    data end up after they have been transmitted across the network, they are stored
    and processed securely. Implementing data privacy includes redacting or anonymizing
    sensitive data before they are stored or using data separation to decouple personally
    identifiable information from IoT data payloads. Data that are no longer required
    should be disposed of securely, and if data are stored, maintaining compliance
    with legal and regulatory frameworks is also an important challenge. Ensuring
    data integrity may involve employing checksums or digital signatures to ensure
    data have not been modified. Blockchain, as a decentralized distributed ledger
    for IoT data, offers a scalable and resilient approach for ensuring the integrity
    of IoT data.


    6.2.3.6 Secure Web, Mobile, and Cloud Applications Web, mobile, and cloud apps
    and services are used to manage, access, and process IoT devices and data, so
    they must also be secured as part of a multi-layered approach to IoT security.


    When developing IoT applications, be sure to apply secure engineering practices
    to avoid vulnerabilities such as the OWASP Top Ten vulnerabilities. Just like
    devices, apps should also support secure authentication, both for the apps themselves
    and the users of the applications, by providing options such as 2FA and secure
    password recovery options.


    6.2.3.7 Ensure High Availability As we come to rely more on IoT within our day-to-day
    lives, IoT developers must consider the availability of IoT data and the web and
    mobile apps that rely on that data, as well as our access to the physical things
    managed by IoT'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'systems. The potential for disruption as a result of connectivity outages or
    device failures, or arising as a result of attacks like denial of service, is
    more than just an inconvenience.


    In some applications, the impact of the lack of availability could mean loss of
    revenue, damage to equipment, or even loss of life. For example, in connected
    cities, IoT infrastructure is responsible for essential services such as traffic
    control, and in healthcare, IoT devices include pacemakers and insulin pumps.
    To ensure high availability, IoT devices must be protected against cyber-attacks
    as well as physical tampering. IoT systems must include redundancy to eliminate
    single points of failure and should also be designed to be resilient and fault
    tolerant so that they can adapt and recover quickly when problems do arise.


    **6.2.3.8 Detect Vulnerabilities and Incidents** Despite best efforts, security
    vulnerabilities and breaches are inevitable. How do you know if your IoT system
    has been compromised? In large-scale IoT systems, the complexity of the system
    in terms of the number of devices connected and the variety of devices, apps,
    services, and communication protocols involved can make it difficult to identify
    when an incident has occurred. Strategies for detecting vulnerabilities and breaches
    include monitoring network communications and activity logs for anomalies, engaging
    in penetration testing and ethical hacking to expose vulnerabilities, and applying
    security intelligence and analytics to identify and notify when incidents occur.


    **6.2.3.9 Manage Vulnerabilities** The complexity of IoT systems also makes it
    challenging to assess the repercussions of vulnerability or the extent of a breach
    in order to manage its impact. Challenges include identifying which devices were
    affected, what data or services were accessed or compromised, and which users
