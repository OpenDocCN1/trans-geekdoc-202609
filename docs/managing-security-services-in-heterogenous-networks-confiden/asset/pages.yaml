  md: '# 2.1 Introduction


    The mobile ad-hoc network (MANET) is a wireless network which has a dynamic topology.
    Here, the nodes use peer-to-peer data transmission and multihop routes for communicating
    with each other in this network scenario. Moreover, there is no fixed infrastructure
    for data communication. The fixed infrastructure can be formed as a temporary
    static topology by forming a group (cluster) to communicate with all the neighbor
    nodes. This group-based communication is useful for providing better communication
    facility in many emerging scenarios such as battlefield communications, emergency
    operation, disaster relief, survival search, and sensor dust. But due to the dynamic
    topology and static topology changes of MANETs, designing secure and reliable
    routing protocols for those networks is a challenging process, especially in the
    large-scale network.


    In clustering, the cluster head collects the data from its members, aggregates
    it, and transmits the aggregated data to the sink through a single-hop or multihop
    manner. Multihop routing provides an opportunity for the nodes to bring the malicious
    activity to MANETs. Security is also an important issue in MANETs due to the presence
    of a malicious node in the transmission path. These malicious nodes may drop the
    packets or misdirect the messages in routes or replay all the active routing packets
    from a valid node to forge the valid node’s identity. Malicious nodes disrupt
    the network traffic by using the forged identity in routing. The trust evaluation
    process is an important task in the secure routing of MANETs. The trust scores
    are dynamically changed due to the occurrences of various attacks at different
    times in many paths. The trust score is the mathematical representation of the
    node’s attitude in comparison to an another node in the network.


    In this chapter, an intelligent weighted fuzzy cluster–based secure routing algorithm
    (IWFCSRA) is proposed ifor MANETs for enhancing the network lifetime and throughputs
    with security. Moreover, a fuzzy rule–based weighted distance–based outlier detection
    algorithm (FRWDOA) for distinguishing the outliers within the network is discussed.
    In this proposed work, new fuzzy rules have been generated with weights and used
    for forming clusters and also for calculating the trust scores, which are useful
    for making a final'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'decision regarding the routing process. Moreover, the final trust paths for
    the respective clusters have been finalized based on the trust scores, energy,
    and weighted fuzzy rules in MANETs.


    The remainder of this chapter is organized as follows: Section 2 provides the
    related works in the areas of secure routing protocols for MANETs. Section 3 describes
    in detail the proposed system architecture. Section 4 explains the details of
    the proposed model. Section 5 depicts the results obtained from this work and
    compares them with related work. Section 6 gives conclusions on this work and
    suggests some possible future works.


    # ## 2.2 Related Works


    In a wireless and ad-hoc network environment, secured and energy-efficient transmissions
    are needed to improve the network lifetime and throughput. Clustering is a well-known
    technique for improving the energy efficiency in computer networks. Many works
    have been carried out in clustering techniques and are in the literature [1,6,10].
    In multihop routing, secure transmission is very important. The malicious nodes
    in the route may attack the packets. So, many researchers have worked on secure
    routing and are in the literature [1,2,4]. Zhan et al. [5] proposed a trust-aware
    routing framework (TARF) to secure the WSNs from adversaries misdirecting the
    multihop routing. TARF provides a trustworthy and energy-efficient route that
    protects WSNs from the harmful attacks exploiting the replay of routing information.
    In the past, Thippeswamy et al. [6] proposed a secure trust-aware energy-efficient
    adaptive routing (STEAR) protocol for dynamic WSNs. STEAR effectively identifies
    the malicious nodes using a dynamic secret key, packet flow status, energy, and
    trust. However, considering the dynamic nature of attackers, it is necessary to
    work further to detect and prevent novel attacks.


    Duan et al. [7] proposed a trust-aware secure routing framework (TSRF) to resist
    various attacks. The authors proposed a specific trust computation and trust derivation
    schemes to deal with the attacks. Their protocol considers the trust metric as
    well as QoS requirements in the path selection. Gu et al. [8] designed a secure
    communication protocol for end-to-end communication in WSNs. In their protocol,
    the differentiated key predistribution methodology was used to'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'distribute the different number of keys to different sensors to enhance the
    resilience of certain links. Tang et al. [9] proposed a secure and efficient cost-aware
    secure routing (CASER) protocol to address the network optimization and security
    issues. However, a unique routing algorithm which considers energy and security
    based on trust is necessary to enhance the routing performance and security.


    Souza and Varaprasad [10] proposed a multipath routing protocol for WSN using
    a digital signature crypto system for transmitting the data packets in a secure
    manner. Ganesh and Amutha [11] proposed an efficient and secure routing protocol
    through SNR-based dynamic clustering mechanisms (ESRPSDC). In their work, the
    error recovery process has been considered during the intercluster routing, and
    security is also accomplished by isolating the malicious nodes by utilizing a
    sink-based routing example. Mahmoud et al. [12] proposed a new protocol that combines
    the payment and trust systems with a trust-based and energy-aware routing protocol.
    The payment system rewards the nodes that relay other packets, and the trust system
    evaluates the nodes’ competence and reliability in relaying packets in terms of
    multidimensional trust values. Their algorithm stimulates the nodes not only to
    relay packets but also maintains the route strength and report with sufficient
    battery power.


    Li et al. [13] designed a new routing scheme which provides efficient and fault-tolerant
    routing. In their work, an evaluation metric and path vacant ratio are used to
    assess and locate an arrangement of connection disjoint paths from all accessible
    paths. Moreover, they proposed two more algorithms, namely a congestion control
    algorithm and load-balancing algorithm. Their congestion control algorithm adjusts
    the load on multiple paths, and their threshold sharing algorithm splits the packets
    into multiple segments, which are delivered via multiple paths to the destination
    using the path vacant ratio in the network. Lee and Choi [14] proposed a secure
    alternate path routing in sensor network (SeRINS) that detects and isolates the
    compromised nodes which attempt to infuse conflicting routing information from
    the system by a neighbor report framework.


    Kuila and Jana [32] proposed a new optimized energy-efficient and cluster-based
    routing algorithm for effective wireless communication. They used a particle swarm
    optimization algorithm for effective optimization in this work. Mathapati et al.
    [31] introduced a new'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'cluster and energy-efficient reliable routing algorithm for effective communication
    in wireless networks. Rahman and Matin [30] developed an algorithm for improving
    the network lifetime. Younis and Fahmy [29] introduced a new approach called a
    hybrid, energy-efficient, distributed clustering algorithm for ad-hoc networks.
    Heinzelman et al. [28] proposed an energy-efficient routing protocol for effective
    communication. Villas et al. [26] proposed a lightweight and reliable routing
    technique for aggregating the in-network area in wireless networks. Attea Bara''a
    [25] introduced an energy-aware routing algorithm for dynamic grouping of wireless
    networks, which is useful for enhancing the communication process in the network.


    Balkis Hamdane et al. [17] explained about security methods based on trust modelling
    for securing the named date networks. The authors proposed a hierarchical identity-based
    cryptography for performing signature verification. Their model is providing better
    performance in terms of key management–based security. Selvi et al. [21] proposed
    a new fuzzy temporal approach for energy-efficient routing in WSN. Moreover in
    another work by Selvi et al. [21], the authors proposed a rule-based, delay-constrained,
    energy-efficient routing technique for wireless sensor networks. However, such
    approaches must be enhanced with security constraints in order to enhance the
    security of the routing process. Muthurajkumar et al. [23] proposed an intelligent
    secured and energy-efficient routing algorithm for MANETs. This work can be extended
    to both static and mobile sensor networks for providing secured and reliable routing
    process for WSNs. Idris Abubakar Umar et al. [20] proposed a new security model
    for performing intelligent secure routing in networks. In their work, the authors
    used a fuzzy logic–based trust model for handling uncertainty in the trust estimation
    process and to perform secure routing. In spite of the presence of all these algorithms,
    the routing performance is affected due to the attackers. Hence, a new trust and
    energy-aware secure routing protocol is proposed in this chapter.


