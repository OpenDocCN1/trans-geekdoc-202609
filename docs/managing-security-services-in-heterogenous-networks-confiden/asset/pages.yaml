  md: '+   2. Validity – All the transactions and blocks received by each node should
    be validated before broadcasting. Once all the transactions in the blocks are
    validated, along with the block as a whole, it should be appended to the blockchain.
    Invalid transactions or blocks will be discarded in this process.


    +   3. Longest-chain rule – In this consensus mechanism, any longest chain present
    in the network will be considered the valid chain. Any honest or nonfaulty node
    will build on top of the longest chain by appending the next valid block. The
    decision on where to append the next block will be reliant on the total amount
    of computation effort put on the longest chain.


    +   4. Mining process – The POW is the backbone of Nakamoto consensus, taking
    care of a valid block generation process. Each node trying to propose a block
    should find a nonce (a number used once) to be inserted into the block header.
    The difficulty in finding the nonce will be adjusted periodically to certify the
    average block generation speed remains constant within the network.


    Nakamoto consensus is apparently advantageous over the tradition consensus mechanism
    based on the following points:


    +   1. Nakamoto consensus is Byzantine fault tolerant, though most of the traditional
    consensuses are not.

    +   2. Any number of nodes can join or leave the network at any point of time,
    assuring open participation.

    +   3. The nodes in the network need not know all the participants in the network;
    still they will have a finite set of known peers.

    +   4. There is no communication overhead involved, unlike the traditional mechanisms.

    +   5. A leader election process is not required in Nakamoto consensus.


