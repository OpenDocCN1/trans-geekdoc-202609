    Outliers can be identified at the end of this pre-processing stage in this work.
    The outliers will not be considered for further processing here.


    # 2.4.2 Clustering


    This section explains in detail the cluster formation, cluster head selection,
    cluster maintenance, mobility, and clustering process.


    **2.4.2.1 Cluster Formation** Initially each node is assigned a random number
    for identifying it. It proclaims its identity number according to its distance
    between the neighbor nodes and builds a table which shows the relationship between
    the nodes in a network. Each participated node calculates its own weights based
    on node connectivity, energy level, mobility, and distance. Then each node weight
    is announced to their neighbors after finalizing the weight. The clusters are
    formed based on the weights, and the node that has the maximum weight acts as
    a cluster head.


    **2.4.2.2 Mobility** The mobility of the nodes which are available in the network
    is measured based on the movement from one place to another in the same topology
    of the network for a particular time period.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '2.4.2.3 Cluster Maintenance Cluster maintenance is needed when a node moves
    out of the range of its cluster head (CH), if a new node is added or the CH fails.
    Suppose a new node is added—it computes its weight. However, even if its weight
    is more than the weight of the CH, it does not immediately become the CH and instead
    chooses the current CH as its CH. This could reduce the overhead incurred, unnecessarily,
    every time during the selection of CH while adding a new node. If the CH fails,
    then the nodes attached to that CH recalculate their weights and select a new
    node as CH that has the maximum weight.


    2.4.2.4 Cluster-Head Selection The CH is selected based on the current energy
    level of the node and the mobility speed. These two factors are very important
    for choosing the CH, with consideration of the distance between this node and
    other neighbor nodes. Here, the node that is closer to the majority nodes with
    less mobility will be elected as a CH for the cluster.


    2.4.2.5 Trust Score Calculation The trust scores are calculated for all the participating
    nodes in the network. Here, direct, indirect, and reputation scores are considered
    for calculating the trust score of each node in the network. The direct trust
    score is calculated using the formula:


    ```

    DTS (t1, t2) = PS (t1, t2)/ACKR (t1, t2) (2)

    ```


    where PS indicates the number of packets sent and ACKR represents the number of
    acknowledgements received. Calculate the average direct trust score (AvgDTS) for
    the whole network by using equation 3.


    ```

    AvgDTS (t1, t2) = Sum (DTS <t1, t2>)/n (3)

    ```


    where n is the total number of participating nodes in the network at a particular
    time duration.


    The indirect trust scores (IDTS) are calculated for all the nodes in the network
    using the recommendation score received from neighbor nodes for the particular
    node.


    ```

    IDTS (t1, t2) = (RS1(t1, t2) + RS2(t1, t2) + .... + RSn (t1, t2))/n (4)

    ```'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'where RS indicates the recommendation score and n represents the number of
    recommendations received from neighbor nodes. The average IDTS is calculated for
    the network using equation 5.


    AvgIDTS (t1, t2) = (IDTS1 <t1, t2> + IDTS2 <t1, t2> + ......+ IDTS <t1, t2>)/n
    (5)


    where n indicate the total number of nodes available in the network.


    # 2.4.2.6 Rules


    In this work, IF...THEN rules are framed by using the direct trust, indirect trust,
    energy, and mobility for identifying the eligible node to participate in the routing
    process.


    +   **Rule 1:**

    +   If (DTSi (t1, t2) < AvgDTS) AND

    +   (DTSi (t1, t2) < AvgIDTS) AND

    +   (Mob (t1, t2) < AvgMob) AND

    +   (En (t1, t2) < AvgEn) Then

    +   Node is LOW & Not Eligible to participate in the routing process.


    +   **Rule 2:**

    +   If (DTSi (t1, t2) > AvgDTS) AND

    +   (IDTSi (t1, t2) > AvgIDTS) AND

    +   (Mob (t1, t2) < AvgMob) AND

    +   (En (t1, t2) < AvgEn) Then

    +   Node is LOW MEDIUM & Eligible to participate in the routing process.


    +   **Rule 3:**

    +   If (DTSi (t1, t2) > AvgDTS) AND

    +   (IDTSi (t1, t2) > AvgIDTS) AND

    +   (Mob (t1, t2) > AvgMob) AND

    +   (En (t1, t2) > AvgEn) Then

    +   Node is MEDIUM & Eligible to participate in the routing process.


    +   **Rule 4:**

    +   If (DTSi (t1, t2) > AvgDTS) AND

    +   (IDTSi (t1, t2) > AvgIDTS) AND

    +   (Mob (t1, t2) < AvgMob) AND

    +   (En (t1, t2) > AvgEn) Then'
