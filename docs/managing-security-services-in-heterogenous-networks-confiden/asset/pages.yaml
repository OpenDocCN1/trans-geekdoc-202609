    # 3.4.2 Trust Routing Using Fuzzy Petri-Nets in MANETs


    Here the routing process is discussed with the help of a dynamic fuzzy Petri-nets
    (DFPNs) model. In [11], the DFPN is discussed. In Figure 3.8, the DFPN is shown
    as the graph-related structure and the combination of places and transitions,
    where places are shown as circles and transitions are shown as bars. A directed
    arc connects the input place (\(P_j\)) to the output place (\(P_k\)), and each
    arc is associated with a transition (\(t_i\)). The input place consists of a token
    with some degree of trust (\(d_j\)) (DoT). Each transition is associated with
    two parameters like (\(\mu, \tau\)); a transition fires if \(\mu > \tau\) and
    the token is moved from the input place to output place with a new DoT (i.e. \(d_k\)).


    Here the degree of trust of place \(p_j\) is \(d_j\) i.e. \(\propto (p_j) = d_j\).
    After firing the transition \(t_i (\mu > \tau)\), the token is copied from place
    \(p_j\) to \(p_k\). Then the degree of truth for place \(p_k\) is evaluated as
    \(d_k = d_j \times w \times \mu\).


