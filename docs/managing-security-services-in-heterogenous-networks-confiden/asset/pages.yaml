    7.5.5.3.3 Encryption AES-CCM cryptography is used for encryption in Bluetooth
    LE. Encryption is achieved in the controller.


    **Signed Data** Bluetooth LE has the capability to transmit authenticated data
    over an unencrypted ATT carrier amid two devices with a reliable connection. The
    data is signed by a Connection Signature Resolving Key (CSRK), and the signature
    is appended after the Data PDU by the transmitting device. The receiving device
    confirms the signature and if the signature is proved the Data PDU is presumed
    to originate from the trusted source. The signature is made up of a Message Authentication
    Code created by the signing algorithm and a counter. The counter is used to guard
    against a replay attack and is increased on each signed Data PDU sent.


    7.5.5.3.4 Privacy Feature The Bluetooth device address keeps re-currently changing,
    and this diminishes the facility to track a Bluetooth LE device.


    **Variants of the privacy features** are (i) private addresses are determined
    and created by the host. (ii) Private addresses are determined and created by
    the controller without relating the host subsequently the host offers the controller
    device identity information. This encompasses the host when the resolving list
    in the controller cannot store all the device identity resolving keys essential
    for bonded devices.


    # **Modes of Privacy**


