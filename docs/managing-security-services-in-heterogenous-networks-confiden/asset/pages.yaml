    # 7.8 Bluetooth Vulnerability


    A vulnerability is a weakness in a system (computer or network) allowing unauthorized
    action [43,44]; in order to reach the desired result.


    Ivan Victor Krsul [45] shows that a vulnerability in software is a mistake that
    arises in diverse stages of development or use. This description ends up with
    three categories of vulnerabilities as follows:


    +   • Configuration vulnerability – This vulnerability arises from an error in
    the configuration of a system, such as partaking system accounts with default
    passwords, taking “world write” permission for new files, or having vulnerable
    services enabled [46].'
