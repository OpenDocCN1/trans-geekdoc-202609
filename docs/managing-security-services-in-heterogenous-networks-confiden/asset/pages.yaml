  md: '# 6.4.1.2 Vocabulary Gaps


    Having problems with matching variants in words like “X Rays,” “X-Ray,” and “X-Rays”
    and matching synonyms like “CT” or “X rays.” Apart from these problems we are
    facing one more in terms of knowledge gaps.


    # 6.4.1.3 Pseudo-feedback


    To overcome the noted vocabulary gap problem, we are using a pseudo-relevance
    feedback technique. Here the problem is “what if a very few of the top N is relevant”
    and also we didn’t have an idea about “which keywords to pick up.”


    # 6.4.2 Challenges in Image Data


    +   - Extracting informative features.

    +   - Selection of relevant features like sparse methods and dimensionality reducing
    techniques.

    +   - Integration of image data with the other data variables. A few examples
    include:

    +       - Early fusion in vector-based integration.

    +       - Intermediate fusion in multiple kernel learning.

    +       - Late fusion in ensembling results from individual modalities.


    # 6.5 Conclusion


    With the immense growth of healthcare data, the data analytics and Big Data [12,13]
    concepts are playing a major role in the biomedical sector. To produce more accurate
    results on the biomedical text and EHR data, we need to do pre-processing on it
    and to do some analytics for better treatment and in some cases to predict the
    severity of the disease. In the healthcare sector, data analytics can be divided
    into two types. The text mining and biomedical image analysis will come under
    the advanced data analytics, which provides some predictive model on the sample
    data. The basic data analytics techniques like regression and classification will
    produce the commonalities between multiple diseases and help to diagnose the causes.
    Finally, we are going to conclude that with the help of data analytics, concepts
    will get good results in predicting and diagnosing different diseases with lower
    cost and less time.'
