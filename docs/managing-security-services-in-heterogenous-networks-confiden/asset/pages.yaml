    # 7.10 Countermeasures


    The technology evolution and the evolution of attacks are going at the same speed.
    The efforts taken to develop countermeasures against all the weaknesses and the
    security holes of Bluetooth are still in their infancy. The weakest part of the
    Bluetooth technology comprises the pairing process in which it rests on the trusted
    relationships with other devices.


    To address the specific threats and vulnerabilities to Bluetooth network, countermeasures
    should be applied.


    +   - Educate Bluetooth-enabled device users with an appropriate level of knowledge,
    understanding, and awareness of proper security practices. For example, organizations
    should create an awareness-based education to its staff to improve their understanding
    and knowledge of Bluetooth.

    +   - Design and document the security policies that should be used by the organizations
    adopting Bluetooth technology and users of the Bluetooth-enabled devices should
    understand their responsibilities.


    *Security checklist with guiding principle and suggestions for forming and maintaining
    secure Bluetooth piconets:*


    +   - Ensure that an organizational wireless security policy is developed to addresses
    the Bluetooth technology.

    +   - Ensure that users of the Bluetooth technology are cognizant of their security-related
    responsibilities concerning Bluetooth use.'
