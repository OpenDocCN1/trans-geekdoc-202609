    the device filtering must be inactivated.


    Bluetooth offers four distinct connectivity and discoverability modes, which can
    be selected by the user of a Bluetooth device:


    +   i. Silent – Device monitors the Bluetooth traffic and does not accept any
    connections.


    +   i. Private (non-discoverable) – Device cannot be discovered and it doesn’t
    admit any connections if their address is known to the master.


    +   i. Public (discoverable) – Device can be discovered and will accept connections
    from prospective masters.


    +   i. LE (Low-Energy) Privacy – Device can deliver messages to other Bluetooth
    devices in connectionless mode.


