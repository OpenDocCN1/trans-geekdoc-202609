  md: 'In this chapter in Section 2, trust definitions, properties, prediction, aggregation,
    propagation, and computation methods are discussed in the MANET context. Different
    trust attacks in MANETs and their countermeasures are discussed in Section 3.
    In Section 4, soft computing methods in trust estimation are discussed like fuzzy
    logic, fuzzy petrinets, Bayesian conditional probability, Dempsters Shafer Theory
    (DST), and trust matrix operations.


    # 3.2 Trust in Mobile Ad-hoc Networks


    Trust is platform independent, and the principles of trust are even applicable
    to the communication network. In current research, trust is being considered as
    one of the design considerations in a networking protocol stack [4]. In the distributed
    environment of MANETs, maintenance of trust relations with other nodes can increase
    the network performance like scalability, dependability, and reliability. In this
    section, these concepts are discussed in the MANET context.


    # 3.2.1 Trust Definitions


    The term “trust” is defined in multiple ways, but the widely accepted two definitions
    are discussed here.


    In [14], the trust of a particular node is a subjective assessment by an agent/other
    peer node on the reliability and accuracy of information received from or traversing
    through that node in a given context.


    In [13], trust reflects the belief or confidence or expectations in terms of the
    honesty, integrity, ability, availability, and quality of service of a target
    node’s future activity/behavior. It also reflects the mutual relationships where
    a given node behaves in a trustworthy manner and maintains reliable communications
    only with nodes that are highly trusted by the given node.


    # 3.2.2 Trust Properties in MANETs


    In Figure 3.1, the trust properties are described from a MANET perspective, where
    the trust is shown as the combination of properties like asymmetry, subjectivity,
    context dependency, dynamicity, and transitivity.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '![](img/058011bdc8fc3d3d77199bfcbf721be0_48_0.png)


    Figure 3.1 Trust Properties in MANETs.


    *Trust is dynamic:* In MANETs, node behavior is not static; it changes based on
    conditions over time. Hence, the node’s trust is a variable factor. In [15], Adams
    et al. recommended a random variable to capture the trust changes instead of a
    discrete variable.


    *Trust is subjective:* In a network, a node can have different opinions on other
    nodes at different time intervals, where these trust changes are influenced by
    the network topology conditions.


    *Trust is asymmetric:* Usually ad-hoc networks are formed with the heterogeneous
    nodes, where nodes have different capabilities like computational power, memory,
    battery power, etc. Hence, the trust relation between two nodes is not symmetric.
    Generally, a node with good resources has good trust with its neighbors.


    *Trust is transitive:* A node can assess the trustworthiness of a target node
    through intermediate nodes using a trust transitivity rule. Let us consider three
    nodes (n<sub>i</sub>, n<sub>j</sub>, n<sub>k</sub>), where n<sub>j</sub> is the
    neighbor of both n<sub>i</sub> and n<sub>k</sub>, but n<sub>i</sub> and n<sub>k</sub>
    are not neighbors. Node n<sub>i</sub> takes the trust recommendation of n<sub>j</sub>
    to estimate the trustworthiness of n<sub>k</sub>.


    *Trust is context dependent:* In ad-hoc networks, trust is context dependent,
    i.e. a node has different trust opinions of the same node in different contexts.
    A node can trust another node in an energy context but cannot trust in a bandwidth
    context, for example.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# ### 3.2.3 Trust Propagation


    The computed trust values have to be shared among the nodes in the network, so
    that the trust recomputation works can be avoided for the same node. For this
    each node exchange trusts information with its neighbour nodes.


    # ### 3.2.4 Trust Aggregation


    Sometimes a node may receive multiple trust recommendations through multiple channels
    about the target node. But the assessor node has to combine these values to derive
    a single trust value. The aggregation functions play a major role in trust aggregation,
    where they can eliminate or suppress biased trust recommendations. Let a node
    receive multiple trust values from different sources like x1, x2, ..... xn, the
    aggregate function produces the single trust value.


    y = Aggre (x1, x2, ..... xn)


    # ### 3.2.5 Trust Prediction


    If a node cannot asses a target node trust value either directly or indirectly,
    it has to predict the trust value. A node can predict the trust value based on
    its present and past interactions with the target node.


    # ### 3.2.6 Trust Computation


    In ad-hoc networks, the trust can be computed in three different ways, i.e. direct,
    indirect, and hybrid trust computation. If the target node is in direct communication,
    then trust can be computed directly. For the nodes that are not in direct communications,
    indirect trust is computed. Hybrid is the combination of direct and indirect trust
    computations.


    # ### 3.2.6.1 Direct Trust Computation


    Usually in MANETs, a node can observes its neighbor nodes’ activities due to the
    broadcast nature of the wireless channel. Hence, a node can estimate its one-hop'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'neighbors’ trust values based on control and data packets it exchanged with
    them.


    In [16], the direct trust is evaluated using Equation (1).


    \(T = R_p \times W(R_p) + R_q \times W(R_q) + R_e \times W(R_e) + D \times W(D)\)


    (1)


    Here D, \(R_q\), \(R_p\), and \(R_e\) are misbehavior factors of data packets,
    route request, route reply, and route error packets, respectively, and are defined
    in Equation (2) as normalized values [0, 1].


    \(R_q = \frac{R_{qs} - R_{qf}}{R_{qs} + R_{qf}} \quad R_{es} = \frac{R_{es} -
    R_{ef}}{R_{es} + R_{ef}} \quad R_p = \frac{R_{ps} - R_{pf}}{R_{ps} + R_{pf}} \quad
