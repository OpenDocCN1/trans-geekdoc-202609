    +   4. Participatory – Active participation by the group is required for being
    successful.

    +   5. Agreement Seeking – Bring as much as agreement as possible from the individual
    nodes participating in the system.

    +   6. Democratic – Each and every vote cast by the individuals should have an
    equal weight.


    A consensus algorithm following the previously mentioned properties forms the
    primary root structure of the revolutionary technology'
