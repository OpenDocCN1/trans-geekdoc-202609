    # 3.3 Trust Distortion Attacks: A Taxonomy


    Various trust-based attacks are discussed here. Attacks over trust systems can
    cause of propagation of wrong trust information in the network and weaken the
    performance of trust computing methods.


    # 3.3.1 Trust Attacks in MANETs


    In Figure 3.2, trust attacks are primarily categorized as badmouthing and double-face
    attacks [4]. Badmouthing attacks are like liar and subversive. Double-face attacks
    are like position/user domain, detonator, and iterative attacks.


    # 3.3.1.1 Badmouthing Attacks


    In [17], badmouthing attacks are discussed, which are also called lying attacks.
    In a badmouthing attack,


    ![](img/058011bdc8fc3d3d77199bfcbf721be0_51_0.png)


    Figure 3.2 Trust Distortion Attacks.'
  - '[PAGE 52]


    the compromised nodes spread biased trust recommendations in the network, so that
    the evaluator node cannot estimate the target node trust value accurately. Here,
    the attacker can show the trustworthy node as a malicious node and vice versa
    by giving a false recommendation. Usually, the trust components that are dependent
    on recommendations face these problems. As shown in Figure 3.3, the liar attack
    is one where the attacker node always gives false recommendations to the assessor
    node.


    In a subversive attack, the attacker performs misbehavior like dropping or modifying
    packets and propagating false news.


    *3.3.1.2 Double-Face Attacks* In a double-face attack, the attacker cannot be
    identified by performing harmful activities at nonregular intervals [4]. The attacker
    can hide his identity by behaving good and bad at uneven time intervals. The double-face
    attacks are either on-off or conflicting behavior attacks based on if the threat
    impact is spatial or temporal.


    *On-off attack:* Here the attacker always maintains the trust value above the
    threshold level by doing malicious activities at unexpected time intervals. The
    attacker keeps moving between misbehavior (on) and normal (off) states to hide
    his identity. The on-off attacks are of two types, i.e. iterative attacks and
    detonator. In the iterative on-off attack, the attacker iteratively switches good
    and bad manners to mislead the observer node. In a detonator on-off attack, an
    attacker in a good manner can create trustworthiness over a certain period of
    time. After a period, the user can induce malicious activities and continuous
    in that state faithfully.


    *Conflicting behavior attack:* In this attack, an attacker node shows a different
    attitude in different positions in the network to remain undetected as a malicious
    node. Based on the targeted entity (i.e. user or group of users), these attacks
    are categorized as user domain and position domain attacks.


    *Position domain conflicting behavior attack:* An attacker node performs malicious
    activities in one position and relocates to a new position where it behaves as
    a normal node. So it remains as a good node in the new position. Usually these
    types of attacks can be addressed through the trust propagation throughout the
    network, so that all nodes come to know the past behavior of new joined nodes.'
  - '[PAGE 53]


    User domain conflicting behavior attack: An attacker always attacks only a targeted
    node or group of nodes and remains good with all other nodes. Hence, the victim
    node cannot get any help from other nodes to oppose the attacker. This situation
    may lead to isolating the victim node, since it is giving negative feedback about
    the attacker. These types of attacks can be addressed by taking the recommender
    node trust value into consideration.


    # 3.3.2 Trust-Distortion Resistant Trust Management Frameworks


    To overcome trust attacks like badmouthing and double-face, many trust management
    frameworks (TMFs) are proposed. Here some of them are discussed.


    # 3.3.2.1 TMFs Resistant to Double-Face Attacks


    The following TMFs are intended to address the double-face type of attacks. Bella:
    In [19], Bella et al. proposed the framework which works based on local trust
    information and trust recommendations. Each node collects local trust information
    of one-hop neighbors through the direct interactions using the knowledge collection
    component. The framework maintains the global reputation table (GRT) in each node
    to maintain the trust information of all nodes in the network.


    Almotiri: This is proposed in [20]. This TMF is designed to resist double-face
    attacks in MANETs. Here at each node the knowledge collection component records
    all successful and unsuccessful communications with one-hop neighbor nodes. Each
    node will get updated about multihop-away nodes’ trust information through the
    control packets (RREQ, RREP) in the routing process.


    # 3.3.2.2 TMFs Resistant to BadMouthing Attacks


    The following methods explain TMSs that resist the badmouthing attacks. OTMF:
    The objective trust management framework (OTMF) [22] is proposed in [30]. It can
    address both double-face and bad-mouthing attacks. Here both present and past
    behaviors of a node are considered to estimate its trust value, where present
    behaviors are given more weight than past behaviors. Additionally, the trust value
    of the recommender node is also considered.'
