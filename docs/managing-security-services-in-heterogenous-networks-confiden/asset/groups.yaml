    +   - **Vulnerabilities:** The NIST outlines several vulnerabilities like eavesdropping
    and attacks on the link keys, reusing the same keys and insecure storage of said
    keys, spoofing insecure devices to obtain keys from other devices they pair with,
    short PINs without the use of random number generators, sharing the key from a
    master device to other piconets, and usage of weak encryption algorithms, among
    others and some countermeasures.


    Users characterize the first layer of security in Bluetooth technology. It provides
    a very flexible security framework, which commands when to involve a user (e.g.
    to provide a PIN) and what actions the basic fundamental BT protocol layers follow
    to support the desired security check-ups


    +   1. Store security-related information on services and devices

    +   2. Answer access needs by protocol implementations or applications

    +   3. Impose authentication and/or encryption before linking to the application.

    +   4. Initiate or process input from the device user to set up trusted relations
    on device level.

    +   5. Initiate pairing and query PIN entry by the user. PIN entry might also
