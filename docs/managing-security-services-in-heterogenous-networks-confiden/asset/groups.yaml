    Fatma Taher 等人 [59] 讨论了已使用的分割形式。第一种是霍普菲尔德神经网络（HNN），随后一种是模糊 C-Means（FCM）聚类计算。研究发现，在所有情况下，HNN
    的分割结果均比 FCM 分组更准确、更可靠。HNN 在识别和分割细胞核及胞质区域方面占优。不过，FCM 在识别细胞核方面失败，反而只识别了其中一部分。尽管如此，FCM
    对强度变化不敏感，因为与 HNN 相比，FCM 在融合时的分割错误更大。然而，由于图像中灰度变化极大且图像相对复杂，导致分割结果不够精确，我们应用了基于标准的阈值分类器作为预处理步骤。该筛选保持分类器在处理受限质量变化问题以及识别细胞核和胞质区域方面占优，它可以涵盖所有废弃单元并确定最佳阈值范围。总体而言，阈值分类器达到了
    98% 的不错精度，灵敏度和特异度分别高达 83% 和 99%。HNN 将作为计算机辅助诊断（CAD）框架的基础，用于早期识别肺部疾病。今后，我们打算考虑贝叶斯决策假设来发现肺癌细胞，随后开发一种基于均值移动计算的模型，该模型结合了边缘识别和基于区域的方法，以提取图像中代表的均匀组织。


    Po-Ming Lee [60] 提出了情感与击键特征之间三种推测的关联，通过使用传统统计方法结合 ML 算法得到验证。本次调查发现的证据支持击键时长和惰性受唤醒度影响的推测，但未能证实键盘打字准确率与情感之间推测的关联（尽管效价和唤醒度的
    p 值均较小）。本次研究的发现预计有助于推动通过击键特征识别用户情感的技术发展，该技术可应用于不同应用场景。


    ## 5.3 拟议方法


    拟工作将密码身份验证与击键动态/生物特征相结合。除用户名和密码外，身份验证还需以下参数：


    - 1. 按键持续时间

    - 2. 按键飞行时间

    - 3. 退格键使用情况

    - 4. 整体输入时间


    存储模板后，登录时使用 k 近邻算法对输入模式进行分类。


    如图 5.1 所示，在输入凭据时，用户即可访问数据。如果用户无法使用凭据，则表示用户无效，或可能有其他人试图从用户处窃取信息以获取个人信息或其他重要信息。


    图 5.1 中通过分析按键按下/按住/释放事件的时序数据来提取击键特征。我们将利用三种基本特征：按下时间（亦称为持续时间）、按键间时间（亦称为飞行时间）以及检查流程的总耗时。按下时间是连续按键按下与释放之间的时间间隔，而按键间时间是释放一个键并按下下一个键之间的时长。在图
    5.2 中，该框架将在数据库中存储击键时间，对应于用户的其他凭据详细信息，如用户名和密码。登录阶段在用户需要访问系统时发生。


    ![](img/058011bdc8fc3d3d77199bfcbf721be0_110_0.png)


    图 5.1：基于数据挖掘的密码身份验证。


    ![](img/058011bdc8fc3d3d77199bfcbf721be0_111_0.png)


    图 5.2：阶段数据抽象。


    在讨论研究人员在击键特征方面采用的方法之前，图 5.3 中可见的特征已从输入数据中提取，如下所述。在输入时，计算机可以记录按键按下的时间（持续时间）、按键按下时长以及连续按键之间的惰性（例如，从一个键到下一个键所花费的时间）。按键释放与按下之间估计的时间称为飞行时间。因此，从原始数据中，可以分离出三种计时特征：按下到按下（PP）、释放到释放（RR）和释放到按下（RP）。


    ![](img/058011bdc8fc3d3d77199bfcbf721be0_111_1.png)


    图 5.3：提取后的归一化。


    如图 5.3 所示，在输入分类时，我们提出的算法会计算数据库中存储的真实值与登录客户端当前值之间的差异。此处，阈值被用于与时间进行比较。该阈值提高了结果的有效性。该值与登录客户端的当前时间进行比较，如果该值与阈值匹配，则该个人被接受或称为经过验证的客户端。该值将通过检查进行调整。使用此输出，计算
    FAR（错误接受率）和 FRR（错误拒绝率）值。


    其他计时数据（见图 5.4）代表输入一个单词、双字母组（两个字母）或三字母组（三个字母）所需的时间，同样可以提取。双字母组属于按下到按下分类。双字母组包含两次连续击键，而三字母组包含三次；此过程适用于任意数量的组合，从而形成
    n-字母组的按键持续时间和按键延迟。


    ![](img/058011bdc8fc3d3d77199bfcbf721be0_112_0.png)


    图 5.4：按键按下与释放的时间延迟。


    ## 5.4 结论


    击键特征作为潜在的生物特征框架已取得长足进步。击键动态研究正朝着新方向发展，重点放在触摸设备上。仍需大量工作才能开发出功能完善的生物特征应用，以考虑各种变化并准确预测客户端是否合法。作为廉价的生物特征，它相较于其他传统生物特征具有优势。此外，它作为知识验证（如密码）的附加安全层，使其效果更加显著。在本研究中，我们竭尽所能介绍击键动态，以便初涉此领域的专家能够自行开展有前景的研究。


