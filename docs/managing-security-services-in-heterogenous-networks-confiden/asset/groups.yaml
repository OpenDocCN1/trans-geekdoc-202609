    ## 7.6 Bluetooth 中的威胁


    威胁分类法旨在为所遇威胁提供参考点，同时提供混排、排列、修改和详细说明威胁定义的可能性。R. Brooks 等人 [17] 和 M. Wolf 等人 (2005)
    已尝试对攻击者进行画像和分类，并定义了攻击场景模型。我们在图 7.2 中复现了 [17] 提出的模型，该模型源自 CERT [18–20] 使用的攻击分类法，并已调整为汽车场景。此外，为了更深入了解攻击者，Verendel
    等人 [21,22] 考虑在车载网络中部署蜜罐，收集攻击数据，这与 [17] 中对攻击者所做的工作类似，其中定义了攻击场景模型。


    ## 7.7 Bluetooth 攻击分类


    所有安全利益相关方（从安全专家到安全新手用户）都需要一个易于理解的威胁分类法。Bluetooth 易于理解的威胁分类法对于其设计、开发和实现是必需的。


    ### 7.7.1 基于威胁的攻击分类


    - **拒绝服务攻击** – 电池耗尽、信号干扰、BlueSYN、Blueper、BlueJacking、vCard Blaster – _中等_：主要目的是通过饱和通信通道拒绝向目标提供资源

    - **模糊测试** – BluePass、Bluetooth Stack Smasher、BlueSmack、Tanya、BlueStab – _中等_：主要目的是提交非标准输入以获取不同结果

    - **恶意软件** – BlueBag、Caribe、CommWarrior - _中等_：主要目的是使用自复制形式的软件实施攻击

    - **中间人攻击** – BT-SSP-Printer-MITM、BlueSpoof、bthidproxy – _高_：主要目的是将设备放置在两个已连接设备之间。通过通道发送的所有信息都可供中间设备获取

    - **混淆攻击** – Baddr、hci config、Spooftooph – _低_：主要目的是隐藏攻击者身份

    - **范围扩展攻击** – BlueSniping、bluetoothone、Vera-NG – _低_：主要目的是扩展设备范围，以便从远处实施攻击

    - **嗅探攻击** – FTS4BT、Merlin、BlueSniff、HCIDump、Wireshark、kismet – _中等_：主要目的是捕获传输中的
    Bluetooth 流量

    - **监视攻击** – Blueprinting、bt_audit、redfang、War-nibbling、Bluefish、dptool、Bluescanner、BTScanner
    – _低_：主要目的是观察并收集有关设备及其位置的信息

    - **未经授权的直接数据访问** – Bloover、BlueBug、BlueSnarf、BlueSnarf ++、BTCrack、Car Whisperer、HeloMoto、btpinccrack
    – _高_：主要目的是以未经授权的方式收集私人信息。这非常严重，因为非常重要的信息可能会被窃取


