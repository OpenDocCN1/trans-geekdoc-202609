    ## 基于击键生物特征的密码身份验证


    舒布姆·苏德 和 M. 范妮莎


    维洛尔理工学院信息技术与工程学院，维洛尔-632014，泰米尔纳德邦，印度


    ### 目录


    - 5.1 引言 75

    - 5.2 相关工作 77

    - 5.3 提出的方法 104

    - 5.4 结论 107

    - 参考文献 108


    ### 5.1 引言


    身份验证是确认用户是否就是其声称的那个人的过程。它被用作区分合法或正当客户与冒充者的一种方法。基于密码的确认是最广泛使用的客户端验证组件。该策略利用特定于某个客户的用户名和密码提示。密码必须是独一无二、长、复杂且强的。一个人必须为不同的应用程序使用不同的密码。为各种应用程序使用相似的密码会使其持续易受攻击。强密码涉及任何由小写字母、大写字母、数字、唯一字符和图像组成的组合，长度为八个字符或更多。保持密码简单会使其易受攻击。知道某人的用户
    ID 和密码会使入侵者非常容易进入系统。在这个一切都数字化的技术时代，获取某人的密码并不困难。


    因此，即使有人知道你的密码，也需要一种方法来维持身份验证。


    所提工作为密码身份验证系统中的这一漏洞提供了解决方案。它利用个人的打字行为来重新识别用户。研究表明，每个人打字时都有某种模式；因此，可以用来区分用户。击键特征是指基于键盘打字的方式和节奏来识别或确认个人身份的计算机化技术。击键特征是一种行为生物识别；这意味着生物识别因素是“你所做的事”。


    用于击键特征的粗略估计是停留时间和飞行时间。


    - 1. 停留时间: 按键按下的时间长度

    - 2. 飞行时间: 释放按键和按下下一个按键之间的时间


    几组字符的打字节奏可能高度依赖于个人。本研究的重点是探讨客户端身份验证，利用密码击键特征作为多因素验证来防止非法客户端访问。该研究通过利用动态时间旅行进行相似度估计完成；验证框架在向客户介绍用于系统便捷度量表调查之前，使用数据集进行了测试。为了提高身份验证系统的性能，多种技术已与生物识别身份验证系统相结合，借助
    KNN 算法检查用户的模式以进行身份验证，这将允许您进入用户注册时保存的聚类区域，在此区域中，欧几里得距离公式将帮助您检查保存的聚类，并允许您访问页面或拒绝访问。用户已接受击键动力学，因为它成本低廉，仅需要一个键盘即可在访问应用程序之前对用户进行身份验证。动态框架在整个交互过程中持续观察客户端的击键，即使成功通过登录会议也是如此。这意味着，个人的打字模式在整个会议期间不断进行动态调查，以确保客户端的身份。


