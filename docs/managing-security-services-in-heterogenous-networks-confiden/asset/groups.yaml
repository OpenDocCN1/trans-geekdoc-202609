    ### 6.1 Introduction


    The healthcare industry historically generates a large amount of data driven by
    record keeping, compliance and regulatory requirements, and patient care. Most
    of the data used to be stored in hard copies: log forms, reports, and patient
    details. At present, the current trend is moving towards digitalization, where
    we are having a huge amount of data which focuses on the mandatory requirements
    and also the potential to improve the quality of healthcare data by reducing the
    cost. When you generate this kind of massive amount of data, this will hold all
    the ranges of medical and healthcare functions like disease surveillance, clinical
    decision support, and population health management. This massive amount of data
    will lead to form called “Big Data.”


    The concept of Big Data in healthcare is getting popular not only because of its
    volume but also because of the different types of data types and the speed at
    which it must be managed. In general, Big Data in healthcare consist of clinical
    data, patient data in electronic patient records (EPRs), machine generated, and
    sensor data. Healthcare organizations and other stakeholders in the healthcare
    delivery system might develop more carefully and insightful diagnoses and treatments,
    which would result in higher-quality care at lower costs and in better outcomes
    overall.


    ### 6.1.1 Introduction to Big Data Analytics in Healthcare


    Over the next few years, the volume of healthcare data is expected to grow dynamically.
    In addition to this, healthcare restitution models are changing drastically. Although
    profit is not a primary factor for healthcare organizations, it is highly important
    to acquire the available tools, infrastructure, and techniques to leverage Big
    Data effectively or else risk losing potentially millions of dollars in revenue
    and profits.


    Big Data “consist of a large volume of high velocity and volatile data that require
    advanced techniques and technologies to enable the capture, storage, distribution,
    management and analysis of the information” [3,19]. These properties all will
    be satisfied by the healthcare data, so we are using Big Data technology.


    ### 6.1.2 The V’s Directly Associated with Healthcare Data


    The data analytics associated with big data are described by the following characteristics
    like:


    - Volume

    - Velocity and

    - Variety


    And also the health-related data will be generated and accumulated continuously,
    which results in an incredible volume of data. The already generated volume of
    existing healthcare data consist of personal medical records, radiology images,
    clinical trial data submitted to the Food and Drug Administration (FDA) [3], human
    genetics and population data genomic sequences, etc., and also new types of Big
    Data such as 3D imaging, genomics, and biometric sensor readings, are also fueling
    this exponential growth of healthcare data analytics. The reason behind this growing
    complexity or abundance in healthcare data is because standard medical practice
    [4] is moving from relatively ad-hoc and subjective decision-making to evidence-based
    healthcare and more incentives to professionals/hospitals to use electronic health
    record (EHR) technology.


    ### 6.2 Data Sources Used for Healthcare Data Analytics


    Development of new technologies such as capturing devices, sensors, and mobile
    applications will also contribute a huge volume of data. At the same time, collection
    of genomic information has also become cheaper, patient social communications
    in digital forms are increasing, and more medical knowledge/discoveries are being
    accumulated.


    ### 6.2.1 Overall Goals of Big Data Analytics in Healthcare


    - Take advantage of the massive amounts of data and provide the right intervention
    to the right patient at the right time [6].

    - Provide personalized care to the patient at every instance.

    - Potentially benefit all the components of a healthcare system, which include
    provider, payer, patient, and management.

    - Introduce healthcare analysts and practitioners to the advancements in the computing
    field to effectively handle and make inferences from voluminous and heterogeneous
    health-care data.


    ### 6.2.2 Challenges in Healthcare Data Analytics


    The list of challenges with analyzing healthcare data [1] include the following:


    - Inferring knowledge from complex heterogeneous patient sources and leveraging
    the patient/data correlations in longitudinal records.

    - Understanding unstructured clinical notes in the right context.

    - Efficiently handling large volumes of medical imaging data and extracting potentially
    useful information and biomarkers.

    - Analyzing genomic data is a computationally intensive task, and combining with
    standard clinical data adds layers of complexity.

    - Capturing the patient’s behavioral data through several sensors: their various
    social interactions and communications.

    - Some of the online patient/caregiver support systems like CancerCompass and
    PatientsLikeMe allow patients and humanitarians to post health-related questions.
    In such situations, there is a significant volume of repetitive questions. One
    of the possible reasons for such repetition could be that as forums grow longer,
    patients and humanitarians do not have sufficient time or patience to read through
    all previous questions before posting their own question. The main challenge from
    this is to design and implement a system that gives questions by identifying a
    maximum of two or three existing questions which are most similar to it.


    So by observing all of these challenges with reference to healthcare data, we
    will get a conclusion that analyzing and giving the most suitable information
    is very important.


