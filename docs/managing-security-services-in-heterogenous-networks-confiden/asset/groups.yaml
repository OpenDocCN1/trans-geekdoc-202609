    ### (1.7.3) Blue-Bugging


    Blue-Bugging 攻击者可完全控制目标设备，并可随心所欲地执行任何操作。Blue-Bugging 是针对目标隐私的攻击，会导致目标遭受资源损坏和财务损失
    [25,35,36]。Blue-Bugging 攻击会与手机建立串行连接，从而访问所有包含的 AT 命令。它使用 GSM 手机中可用的 AT（地址转换）命令，在大约
    2 秒内，攻击者即可监控附近手机的通话，且入侵没有任何痕迹。


    ### (1.7.4) Blue-Jacking


    Blue-Jacking 是一种无害的攻击，用于游击营销以宣传产品或服务，其中会向目标设备发送文本消息、图片、音频片段、视频片段或电子名片。攻击者向目标蓝牙设备发送未经请求的消息，这实际上是垃圾邮件，并给目标带来骚扰
    [25,37–39]。它利用 OBEX 推送攻击漏洞，并在许多诺基亚、索尼和摩托罗拉手机上被报告。


    ### (1.7.5) Free Calling


    攻击者通过将耳机与蓝牙系统配对来定位所需的蓝牙设备，以进行免费移动通话。攻击者不仅窃听目标人员的通话，还让他们支付通话费用。


    ### (1.7.6) Car Whisperer


    在 Car Whisperer 攻击中，攻击者可以通过向汽车音响系统发送音频（例如虚假交通信息和错误的转向指令）来欺骗目标汽车，并窃听车内交谈人员的对话。


    ## (2) MISCELLANEOUS


    ### WAR NIBBLING


    使用配备高增益天线和特殊软件（如 Redfang）的笔记本电脑或 PC，对易受攻击的蓝牙手机进行测试和攻击。虽然攻击者保持静止，但“战争啃噬者”会四处移动，尽可能多地映射手机。有些人开车，有些人在咖啡馆之间移动，但结果是一样的——他们经常侵犯大量消费者的安全。


    ### (3) Worm attack [BlueBug], John Oats (2004); F-Secure Article on Lasco; Ford-Long
    Wong et al. (2005)


    蠕虫的自我复制特性用于从一个蓝牙设备传播到另一个蓝牙设备。激活后，蠕虫会自动搜索范围内的其他蓝牙设备，并将 .sis 文件传输到目标设备上。与木马文件一样，攻击者可以使用手机执行所有合法活动。


    ### BD_ADDR duplication attack


    在目标设备范围内放置一个漏洞，它会复制目标的 BD_ADDR。蓝牙设备地址（或 BD_ADDR）是由制造商分配给每个蓝牙设备的独占 48 位标识符。当任何蓝牙设备与目标设备建立连接时，目标设备或两台设备都会响应并相互阻塞。因此，这会导致合法设备被拒绝访问。如果
    piconet 主设备的 BD_ADDR 被复制，那么 piconet 内的所有信息都将通过主设备，此攻击变得非常有效。


    ### L2CAP Guaranteed Service attack


    攻击者从目标设备获得最大带宽/最高可能数据速率或最小/最低延迟性能，使得所有其他连接都被拒绝，吞吐量保留给攻击者。它还被用作**电池耗尽攻击**。攻击者的目的是探测账户、增加挑战、地位、刺激、财务收益、破坏等。攻击动作可以是认证、绕过、泛滥、修改、网络、探测、读取、扫描、欺骗等。此攻击动作/操作导致目标操作、访问权限增加、信息泄露、信息损坏、拒绝服务和资源窃取。


    ### Fuzzing


    模糊测试干扰包括将畸形或非标准数据传输到设备的蓝牙无线电，并观察设备如何响应。目标设备的响应因此攻击而变慢或停止，这是由于协议栈中的漏洞造成的 [40]。


    ### BlueBorne


    BlueBorne 攻击者利用大多数平台（Linux 设备、Android 设备、Amazon 和 Google 家居设备）上有缺陷的蓝牙实现，远程控制或提取数据
    [BlueBorne]。


    ### MultiBlue


    MultiBlue 驴狗实际上是一个蓝牙设备（4 GB 拇指驱动器），MultiBlue 应用程序用于向可发现的节点发送配对请求。目标设备会显示一个代码（预共享密钥），MultiBlue
    应用程序将其用作身份验证密钥。攻击者现在拥有访问权限和完全的节点控制权 [41]。


    ### Cabir worm


    Cabir 蠕虫是一种恶意软件，利用蓝牙技术搜寻可访问的蓝牙设备并将其发送给攻击者。用户必须手动接受蠕虫并安装恶意软件，以便感染手机。Mabir 蠕虫基本上是
    Cabir 蠕虫的一个变体，它使用蓝牙和多媒体消息服务（MMS）消息进行复制。


    ### HeloMoto


    HeloMoto 攻击是 BlueSnarf 攻击和 BlueBug 攻击的结合体，之所以得名，是因为它是在摩托罗拉手机上发现的。该攻击利用某些手机（如摩托罗拉设备）上“受信任设备”管理的错误实现。一旦攻击开始，攻击者会干扰传输过程，目标会将攻击者的手机列出，并将其存储在其设备中作为“受信任设备列表”中的受信任设备。进入该列表后，攻击者可以在无需验证的情况下链接到耳机配置文件。攻击者随后与目标手机关联并发出
    AT 命令 [42]（同 BlueBug）。


    ### BlueDump


    BlueDump 是诱导蓝牙设备“转储”其存储的链接密钥的行为，从而为密钥交换嗅探提供机会。在此攻击中，攻击者伪造其中一台设备的 BD_ADDR 地址并将其附加到另一台设备上。与此同时，攻击者没有链接密钥；当目标设备请求身份验证时，攻击者的设备将回复“HCI_Link_Key_Request_Negative_Reply”，在某些情况下，这会导致目标设备擦除其单独的链接密钥并进入配对模式。


    ### Bloatver


    Bloatver 是一种概念验证工具，旨在运行在启用 J2ME 的手机上，这些手机看起来相当连续。Bloatver 工具作为一种审计工具，用于检查手机和呼叫者手机是否存在漏洞，并使用
    BlueBug 攻击。之所以称其为 Bloatver（源自 Bluetooth Hoover），是因为该应用程序在手持设备上运行并提取信息。


    ### Bloatver II


    Bloatver II 是 Bloatver 应用程序的后续版本，是移动手机审计工具的新版本。Bloatver II 支持 BlueBug 攻击和 HeloMoto
    攻击（与 BlueBug 攻击非常接近）、BlueSnarf 以及通过 OBEX 发送畸形对象。


