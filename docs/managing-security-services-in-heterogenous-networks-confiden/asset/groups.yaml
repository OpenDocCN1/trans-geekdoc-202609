    ### 2.1 引言


    移动自组网（MANET）是一种具有动态拓扑的无线网络。在此网络场景中，节点使用点对点数据传输和多跳路由相互通信。此外，数据通信没有固定基础设施。固定基础设施可以通过形成一个组（簇）来与所有邻居节点通信，从而构成临时静态拓扑。这种基于组的通信在许多新兴场景中很有用，例如战场通信、紧急行动、灾害救援、生存搜索和传感器尘埃，可提供更好的通信设施。但由于
    MANET 的动态拓扑和静态拓扑变化，为这些网络设计安全可靠的路由协议是一个挑战性过程，尤其是在大规模网络中。


    在聚类中，簇头从其成员处收集数据，对其进行聚合，并以单跳或多跳方式将聚合后的数据传输到汇聚点。多跳路由为节点将恶意活动引入 MANET 提供了机会。由于传输路径中存在恶意节点，安全也是
    MANET 中的一个重要问题。这些恶意节点可能会丢弃数据包、在路由中误导消息，或重播来自合法节点的所有活动路由数据包以伪造合法节点的身份。恶意节点通过在路由中使用伪造的身份来破坏网络流量。信任评估过程是
    MANET 安全路由中的一项重要任务。由于许多路径上不同时间发生各种攻击，信任分数会动态变化。信任分数是节点相对于网络中另一个节点的态度的数学表示。


    本章为 MANET 提出了一种智能加权模糊聚类安全路由算法（IWFCSRA），旨在在提升网络生命周期和吞吐量的同时保障安全。此外，还讨论了一种基于模糊规则的加权距离离群点检测算法（FRWDOA），用于识别网络中的离群点。在此拟议工作中，已生成带权重的新模糊规则，并用于形成聚类和计算信任分数，这些信息对于就路由过程做出最终决定很有用。此外，相应聚类的最终信任路径已根据
    MANET 中的信任分数、能量和加权模糊规则最终确定。


    本章余部分组织如下：第 2 节介绍了 MANET 安全路由协议领域的相关工作。第 3 节详细描述了拟议的系统架构。第 4 节解释了拟议模型的细节。第 5 节展示了本工作获得的结果，并将其与相关工作进行比较。第
    6 节对本工作得出结论，并提出了一些可能的未来工作。


    ### 2.2 相关工作


