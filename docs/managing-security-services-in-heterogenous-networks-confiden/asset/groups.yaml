    ## 3.4.4 Trust Matrix Operations


    Trust matrix operations are used for propagating trust values in the network to
    avoid the risk of trust computational work of the same node.


    Here each node has the trust information, and it maintains the information in
    a matrix format of \( n \times n \) order (n represents the number of nodes in
    the network).


    \( N^T = \left( \begin{array}{ccccc} t_{11} & ... & t_{k1} & ... & t_{n1} \\ ...
    &  & ... &  & ... \\ t_{1k} & ... & t_{kk} & ... & t_{nk} \\ ... &  & ... &  &
    ... \\ t_{1n} & ... & t_{kn} & ... & t_{nn} \end{array} \right) \) (14)


    In Equation (14), \( t_{ij} \) means the node i trust value on node j. Using trust
    matrix operations, a node can calculate the trust value of a target node that
    is not in direct communication (by applying a trust transitive rule).


    Trust transitive rule:


    - i. \( t_{ij} \) : node i trust value on node j

    - ii. \( t_{jk} \) : node j trust value on node k

    - iii. Then node i trust value on node k is evaluated as \( t_{ik} = t_{ij} *
    t_{jk} \).


    Let \( t_i = [t_{i1}....t_{ik}....t_{in}] \) be the trust vector of node i; it
    can get updated iteratively by using Equation (15).


    \(\left( \begin{array}{c} t_{i1} \\ ... \\ t_{ik} \\ ... \\ t_{in} \end{array}
    \right)_{NEXT} = \left( \begin{array}{ccccc} t_{11} & ... & t_{k1} & ... & t_{N1}
    \\ ... &  & ... &  & ... \\ t_{1k} & ... & t_{kk} & ... & t_{Nk} \\ ... &  & ...
    &  & ... \\ t_{1n} & ... & t_{kn} & ... & t_{nn} \end{array} \right) \otimes \left(
    \begin{array}{c} t_{i1} \\ ... \\ t_{ik} \\ ... \\ t_{in} \end{array} \right)_{CURRENT}
    \) (15)


    In Equation 15, the value \( t_{ik} \) is evaluated as \( t_{ik} = max_{1 \le
    j \le n} \{t_{ij} \times t_{jk}\} \).


    Here node i can apply this formula iteratively to find the trust values of multi-hop
    away nodes like


    - \( t_i = (N^T)t_i \)

    - \( t_i = (N^T)^2t_i \)

    - \( \vdots \)

    - \( t_i = (N^T)^n t_i \)


