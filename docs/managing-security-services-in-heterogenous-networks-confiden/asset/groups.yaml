    ### BlueDump


    BlueDump is the act of instigating a Bluetooth device to “dump” its warehoused
    link key, thus providing a chance for key-exchange sniffing to occur. In this
    attack, the attacker spoofs the BD_ADDR address of one of the devices and attaches
    it to the other. In the meantime the attacker has no link key; when the target
    device appeals authentication, the attacker’s device will reply with an “HCI_Link_Key_Request_Negative_Reply,”
    which will, in some cases, cause the target device to erase its individual link
    key and go into pairing mode.


    ### Bloatver


    Bloatver is a proof-of-concept tool that is envisioned to run on J2ME-enabled
    cell phones that seem to be comparably continuous. Bloatver tool is as an audit
    tool to check if the phones and phones of callers are vulnerable and uses the
    BlueBug attack. This is called Bloatver (derived from Bluetooth Hoover) because
    the application runs on handheld devices and draws information.


    ### Bloatver II


    Bloatver II is the successor to the Bloatver application and is a new version
    of the mobile phone auditing tool. The Bloatver II supports the BlueBug attack
    and HeloMoto attack (which is quite close to the BlueBug attack), the BlueSnarf
    and the sending of malformed objects via OBEX.


