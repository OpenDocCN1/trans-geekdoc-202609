    Clayton Epp 等人 [31] 提出，感知情感的能力是构建智能计算机的重要部分。能够去除情境中情感成分的系统将拥有丰富的背景，从而做出关于如何与用户交互或调整系统响应的恰当决策。当前情感识别方法存在两个根本问题，限制了其适用性：它们可能具有侵入性，并且可能需要昂贵的设备。我们提出了一种方案，通过分析用户在标准键盘上打字的节奏来判定用户情感。为收集内部标记的数据，我们开展了一项实地研究，参与者的按键被收集，并使用体验取样法通过自我报告记录他们的状态。基于这些数据，我们提取了按键特征，并使用基于相关性的特征子集属性选择精简了特征集。我们为
    15 种状态构建了分类器。


    Romain Giot 等人 [32] 提出了另一个公开可用的按键元素数据集。该数据集由几组拥有不同登录名和密码的用户组成。我们认为这是目前最合理的可免费获取的按键元素数据集。我们在统计上证实了：

    - (a) 使用个人阈值计算的 EER 优于使用全局阈值计算的 EER（这解释了为什么大量按键元素研究采用这种技术）

    - (b) 使用登录名优于使用密码

    - (c) 在融合过程中使用所有特征可提升性能

    - (d) 密码的长度和熵会影响性能

    按键元素是一种有趣的方法；然而，在获取过程中需要严苛条件，以避免采集到不同的样本。这可能意味着需要对用户进行培训。由于其性能随时间显著下降，因此必须考虑时间波动，这将是该数据集的后续工作。


    Kevin Casey [33] 提出的一项研究表明，按键测量可以有助于构建更精确的及格/不及格分类器；重要的是，提供最佳预测精度的特征是程序复杂性。该特征是利用
    Jbara 和 Feitelson（2014）提出的系统获得的，其中压缩代码的长度被用作学生编写代码复杂性的替代指标。不过，这仅仅是对程序复杂性的猜测，因此改进该特征的未来工作可能会带来显著优势。虽然可以向分类器添加许多其他测量指标，但按键双键序列尤为有趣。具体来说，它们非常稳定。类型
    E 双键序列延迟从最初准确测量时起变化不大。与其他测量指标（例如学生编写项目的复杂性，通常会随学生学习而随时间增加）相比，它是完美的早期指标。双键序列延迟不仅是一个良好的早期指标，还比其他反映学生投入努力的测量指标（例如花在平台上的时间或整合的项目）提供了不同的贡献。双键序列延迟衡量的是学生能力中固有的某些东西，在特定情况下，是这些与学生努力相关的测量指标的重要补充。


    Brajesh Singh 等人 [34] 认定，内部人员攻击至今仍是最严重的问题。所提出的框架在应对此类内部威胁方面表现出更好的效果。同样，该框架在使用时不需要额外设备。


    Pin Shen The 等人 [35] 提出，过去三十年中大部分按键元素相关研究已在本文中进行了概述和分析。本文绝非按键元素领域所有研究工作的详尽索引；然而，它是根据写作时可用的资源以及我们所知的最佳情况收集而成的。本综述论文的目的是为研究人员提供参考，以便进一步探究他人的工作，识别有希望的研究方向以供后续研究。我们相信，这也将大幅降低入门门槛，尤其是对对按键元素感兴趣的初学者而言。


    S.J. Shepherd [36] 开发了一种基于打字节奏的持续验证编程系统，用于 IBM PC。该系统简单、易用，并可提供按键时长和间隔的精确测量。初步研究表明，该数据可用于识别和区分个人。该软件是独立模块，可以有效整合到先进的安全框架中。源代码对希望进一步探究的人员免费开放。


    Laura K. Allen 等人 [37] 开展了一项研究，利用与写作过程相关的多个方面来审视写作培训框架在教授关于学生情感状态的隐蔽评估方面的有效性。我们的最终目标是利用这些隐蔽评估来改进
    W-Pal 框架中的学生模型，从而向学生提供越来越个性化的反馈和指导。更广泛地说，本研究表明，个人差异、内容列表和在线写作度量（例如按键分析）可以作为迈向更具适应性的写作教育技术的一步。虽然这仅仅是一个初步步骤，且还有多项研究有待开展，但本研究奠定了坚实的基础，因为它展示了此类度量用于展现影响力的潜力。


    Terence Sim 等人 [38] 从可度量模式识别的角度出发，探索了双字母、三字母等的区分度。关于自由文本按键元素，我们表明传统的非特定词 n 图表不具备区分度。这证实了其他研究人员的发现。我们表明，相反，特定词
    n 图表表现好得多。我们还表明，对于某些序列，其独特的上下文会影响其计时。这促使我们设计了一种使用整个词作为特征的分类器。我们的分类器实现了与最先进的方法几乎相当的性能。


