    recent awareness and advances in the technology, many of the commercial applications
    or vendors have come up with their own access control policies suitable for their
    products or organizations. RBAC has evolved from mandatory access control (MAC)
    and discretionary access control (DAC).


    DAC refers to restricting or permitting access based on the group to which the
    initiator of the action belongs. For example, a user belonging to group A may
    or may not be given permission to access some set of files based on his or her
    membership in group A.


    MAC implementation requires specifying user permissions at the time of user creation
    itself. For example, a set of users in an organization is allowed to access the
    kernel of the operating system, whereas another set of users is strictly denied
    such access. MAC methods are widely used in defining multilevel security and military
    applications.


    RBAC methods define roles to users and vice versa. Many vendors and practitioners
    have proposed their own RBAC policies [33]. In order to standardize the RBAC model,
    Ferraiolo et al. [13] have proposed NIST standards for RBAC, with the RBAC reference
    model defining a collection of components. The RBAC model considers users, roles,
    permissions, operations, and objects as its elements.


    The following components are defined for the RBAC reference model [13]:


    +   1. Core RBAC – A minimalistic definition of RBAC with its elements consisting
    of users, roles, permissions, operations and objects, and their functionalities.
    It operates in a user-role review model wherein users are assigned to a specific
    role and roles are assigned to a specific user.


    +   2. Hierarchical RBAC – Defines role hierarchies and structuring roles in an
    organization. It can also define inheritance among roles.


    A further two types are defined in hierarchical RBAC:


    +   a. General Hierarchical RBAC – It supports hierarchical and multiple inherited
    permissions to a user.


    +   b. Limited Hierarchical RBAC – It supports limiting access to'
