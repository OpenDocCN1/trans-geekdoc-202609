    ## 3.1 引言


    在移动自组织网络（MANETs）中，节点在建立网络时必须与未知节点进行交互。如果所有节点都协作，应用程序将成功运行。因此，通过消除不可信任节点，每个节点的信任计算对于有效运行应用程序无疑是有利的。由于网络的严重资源约束（如能量、计算能力、带宽和时间）及动态性（如拓扑变化、移动性和信道条件），通过实施复杂加密算法（硬安全）来创建安全环境并非易事
    [8]。相反，研究人员专注于软安全（信任）方法，通过监控节点活动来区分恶意节点。


    在 MANET 中，当节点资源不足时，通常会切换到自私模式，并且可能不参与邻居应用程序的运行。由于恶意行为，节点可以通过丢弃或篡改数据包来削弱网络性能。就此而言，作者
    [1,2] 建议在信任估计中考虑节点的能力（就资源而言）和态度。通过节点信任计算，可以提高网络中应用程序的服务质量（QoS）[10,12]。


    在本章第 2 节中，讨论了 MANET 背景下的信任定义、属性、预测、聚合、传播和计算方法。第 3 节讨论了 MANET 中不同的信任攻击及其应对措施。第
    4 节讨论了信任估计中的软计算方法，如模糊逻辑、模糊 Petri 网、贝叶斯条件概率、Dempster-Shafer 理论（DST）和信任矩阵运算。


    ## 3.2 移动自组织网络中的信任


    信任与平台无关，信任原则甚至适用于通信网络。在当前研究中，信任被视为网络协议栈设计考虑因素之一 [4]。在 MANET 的分布式环境中，与其他节点维护信任关系可以提高网络性能，如可扩展性、可靠性和可信性。在本节中，这些概念在
    MANET 背景下进行讨论。


    ### 3.2.1 信任定义


    “信任”一词有多种定义，但这里讨论了两种广泛接受的定义。


    在 [14] 中，特定节点的信任是代理/其他对等节点在给定上下文中对从该节点接收或通过该节点传递的信息的可靠性和准确性的主观评估。


    在 [13] 中，信任反映了对目标节点未来活动/行为的诚实、正直、能力、可用性和服务质量方面的信念、信心或期望。它还反映了相互关系，即给定节点以可信方式行事，并仅与受该节点高度信任的节点保持可靠通信。


    ### 3.2.2 MANET 中的信任属性


    在图 3.1 中，从 MANET 角度描述了信任属性，信任表现为非对称性、主观性、上下文依赖性、动态性和传递性等属性的组合。


    ![](img/058011bdc8fc3d3d77199bfcbf721be0_48_0.png)


    图 3.1 MANET 中的信任属性。


    - **信任是动态的：** 在 MANET 中，节点行为不是静态的；它会随时间和条件的变化而变化。因此，节点的信任是一个可变因素。在 [15] 中，Adams
    等人建议使用随机变量来捕捉信任变化，而不是离散变量。


    - **信任是主观的：** 在网络中，节点在不同时间间隔内可能对其他节点持有不同看法，这些信任变化受网络拓扑条件的影响。


    - **信任是非对称的：** 通常自组织网络由异构节点组成，节点具有不同的能力，如计算能力、内存、电池电量等。因此，两个节点之间的信任关系不是对称的。一般来说，资源良好的节点与其邻居具有良好的信任。


    - **信任是传递的：** 节点可以通过中间节点利用信任传递规则来评估目标节点的可信度。考虑三个节点（n<sub>i</sub>, n<sub>j</sub>,
    n<sub>k</sub>），其中 n<sub>j</sub> 是 n<sub>i</sub> 和 n<sub>k</sub> 的邻居，但 n<sub>i</sub>
    和 n<sub>k</sub> 不是邻居。节点 n<sub>i</sub> 采用 n<sub>j</sub> 的信任推荐来估计 n<sub>k</sub>
    的可信度。


    - **信任是上下文相关的：** 在自组织网络中，信任依赖于上下文，即节点在不同的上下文中对同一节点持有不同的信任看法。例如，节点可以在能量上下文中信任另一个节点，但在带宽上下文中则不能信任。


