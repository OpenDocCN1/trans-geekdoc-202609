    100、200、300、400 和 500）进行了五项实验，以分析所提工作的安全级别。


    从图 2.8 可以观察到，与现有路由算法（如 AODV、AOTDV、CEESRA 和 EFCSRA）相比，所提 IWFCSRA 的性能较高。这归功于使用异常值检测、智能模糊规则、有效的信任机制，以及在路由过程的决策过程中考虑移动性和能量。所提基于簇的智能加权模糊安全路由算法采用端到端延迟、能耗、投递率和安全级别等多种性能指标进行评估。与现有工作在不同评估方法中的比较表明，所提工作的总体性能得到了显著提升。


