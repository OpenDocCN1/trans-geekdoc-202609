    creation is done in various versions. For *Personal Identification Number (PIN)/legacy
    pairing*, the link key is created when the user enters a PIN, while in *low energy
    devices*, the key is created by each device and is at no time is distributed.


    +   - **Authentication:** Bluetooth devices validate to prove their identity or
    for verification (claimant/verifier scheme) in a challenge-response style. The
    legacy devices are authenticated via a PIN/legacy pairing, while in innovative
    applications (like secure automotive applications), this occurs using a secure
    authentication using SSP and the P-256 Elliptic Curve.

    +   - **Encryption:** The NIST mentions that the AES-CMAC and P- 256 elliptic
    curve provides the utmost secure combination for high-security requirements (needed
    in the highest SL 4). Additionally, implementers will need to guarantee that only
