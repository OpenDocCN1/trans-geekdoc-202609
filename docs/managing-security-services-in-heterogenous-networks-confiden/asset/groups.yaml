    defuzzification, and fuzzy rule base) is discussed to compute the trust value.


    ## 3.4.1.1 Computation of QoS Parameters


    In [5], the computation of LET, energy, bandwidth, and reliability is discussed.


    Estimation of LET: The LET between two nodes is calculated based on their present
    locations, velocity, and moving direction. It is estimated using Equation (7).


    ```

    LET = \frac{-(ab + cd) + \sqrt{(a^2 + c^2)r^2 - (ad - cb)^2}}{(a^2 + c^2)} (7)

    ```


    Table 3.1 LET Notations


    | Item | Definition |

    |---|---|

    | a | v1 cos θ1 - v2 cos θ2 |

    | b | x1 - x2 |

    | c | v1 sin θ1 - v2 sin θ2 |

    | d | y1 - y2 |

    | (x1, y1) and (x2, y2) | are node locations |

    | v1 and v2 | are their velocities |

    | θ1 and θ2 | are their directions |


    Node energy calculation: Here, packet-forwarding energy is calculated in Equation
    (8). In forwarding a packet, a node has to receive and transmit to other nodes.
    Hence, it is the combination of receiving and transmitting energies.


    ```

    E_{total}(k) = E_{amp} \times k \times d^2 + 2 \times (E_{ele} \times k) (8)

    ```


    | Variable | Description |

    |---|---|

    | E_{ele} | is the transceiver energy |

    | E_{amp} | is the amplifier energy |

    | k | is the data size in bits |

    | d | is the radio coverage |


    Bandwidth calculation using TDMA: The time division multiple access (TDMA) is
    used in bandwidth calculation, where the link bandwidth between two nodes is calculated
    in terms of their common time slots [13]. In Equation (9), a node n_i can transmit
    data to neighbor node n_j in time slot s_t, if that time slot is not scheduled
    at any neighbor of n_i as a receiving slot.


    ```

    TS_i = {s_t \in S: s_t \notin TS_i, s_t \notin RS_i, s_t \notin \cup_{n_k \in
    NB_i} RS_k} (9)

    ```


    In Equation (10), a node n_i can receive data from neighbor node n_j in time slot
    s_t, if that time slot is not scheduled at any neighbor of n_j as a transmit slot.


    ```

    RS_i = {s_t \in S: s_t \notin TS_i, s_t \notin RS_i, s_t \notin \cup_{n_k \in
    NB_i} TS_k} (10)

    ```


    Node reliability: Node reliability is estimated based on the packet forwarding
    nature, and it is formulated in Eq. (10). If a node received y total number of
    packets and among them it forwarded x number of packets, then using Bayesian conditional
    probability [9], its reliability r is calculated as


    ```

    f(r, y/x) = \frac{P(x/r, y)f(r, y)}{\int_0^1 P(x/r, y)f(r, y)dr} (11)

    ```


