    # 7.3.2 Research Works and Gaps


    The research works and gaps discussed can be classified as follows:


    +   * The usage of DES and RSA for Bluetooth communication offers integrity and
    confidentiality, with the limitation that these protocols are too lengthy and
    will surge the communication delay.


    +   * The one user shared secret key which is used for pairing mechanism is not
    secure and hence use the concept of two shared secret parameters.


    +   * As the majority of vulnerabilities occur, it is easy to crack the Bluetooth
    address of devices. So, therefore use an alias of Bluetooth address for Bluetooth
    communication.


    +   * Markus Jakobsson and Susanne Vitzel (2008) project the different ways of
    generating link keys and initialization keys keeping major vulnerabilities in
    mind.


    +   * Jun-Zhao, Douglas Howie, and Antti and Jaakko Sauvol proposed several link
    key management, authentication and encryption schemes to make Bluetooth more secure
    and robust and proposed many countermeasures to handle security issues.


    +   * In 2010 Wuling et al. proposed that the present encryption and authentication
    algorithm are susceptible to MITM and pin cracking attacks. He recommended a hybrid
    system of DES and RSA. Since DES is symmetric and RSA is asymmetric, both together
    can provide confidentiality and integrity.


