    \  \n\n物联网（IoT）是近年研究中最具前景的技术之一。从多种异构设备收集数据，以及对收集到的数据进行存储和分析，在医疗保健、交通、家庭自动化等众多领域都有应用，吸引了各领域研究者的关注。尽管数据来自不同的异构设备，但这些数据均存储在云端。在云启用物联网中，多租户是其特征之一。同时保护此类数据并在云端提供良好的访问控制策略而不损害用户数据和隐私是一项挑战性任务。访问控制策略为用户提供了访问云端数据的高效访问控制机制。本章详细讨论了在云和物联网背景下提出的现有访问控制策略的广泛概述。同时，概述了未来研究方向的可能性。\
    \  \n\n### 1.1 引言  \n\n物联网是一项先进技术，不仅需要基础设施和软件的开发，还需要设计和部署能够支持多种可扩展、互操作且安全的应用程序的服务。在设计物联网数据的安全通信架构过程中，许多人意识到需要解决的共同问题是信息安全，重点是访问控制策略，以便各种用户可以根据其要求有效地使用数据。\
    \  \n\n本章回顾并总结了与云和物联网中的数据相关的访问控制的最新趋势和挑战，并讨论了支持数据可访问性的各种模型，以物联网和云计算作为应用领域的参考示例。\
    \  \n\n互联网协会 [31] 将物联网描述如下：“物联网是指将网络连接和计算能力扩展到通常不被视为计算设备的对象、传感器和设备的场景，使这些对象、传感器和设备能够在无需人工干预的情况下生成、交换和利用数据。”\
    \  \n\nMattern 和 Floerkemeier [23] 将物联网技术描述为：“物联网代表了一种愿景，即互联网延伸到现实世界，涵盖日常物品。实物不再与虚拟世界断开连接，而是可以远程控制，并可作为互联网服务的物理接入点。”\
    \  \n\n### 1.1.1 万物网络  \n\n美国国家标准与技术研究院 (NIST) 为“万物网络”（包含物联网）定义了以下五种原语 [35]： \
    \ \n\n- 测量感兴趣物理参数（如温度、湿度、压力、重量等）的传感器。  \n- 将原始数据转换为处理后或聚合数据的聚合器。  \n- 允许相关实体之间传输数据的通信信道。\
    \  \n- 外部实用程序包括计算所需的外部组件。  \n- 决策触发器是具有真值的谓词，用于启动命令或操作。  \n\n物联网可能使用也可能不使用万物网络中定义的所有原语，例如，无需传感器即可运行的网络物理系统。物联网所需的另一种基本原语组件（未列于\
    \ NIST 原语中）是“智能性”。随着物联网原语的研究进展以及节能、低成本硬件通信设备的制造 [20]，物联网研究正在多个方向上发展。然而，\n"
