    Farida Jaha 等人 [2] 提出了一种可为客户提供验证安全的可靠密码策略。然而，如果另一个人能够泄露密码，则没有密码策略能防止未经授权的客户访问。利用动态击键，冒充者攻击是徒劳的，因为动态打字是每个人的独特特征。经过大量探索，我们认为击键特征可以是可靠的验证安全工具。动态打字是一种允许组织安全使用自带设备（BYOD）的系统。它不需要额外投资。因此，组织正在享受
