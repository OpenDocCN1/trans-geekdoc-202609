    Webmail、在线测试和基本网站的监控。


    Santanu Chatterjee 等人 [5] 提出了一种基于切比舍夫混沌映射的轻量级多服务器身份验证方案。我们利用随机预言模型和 BAN 逻辑进行了正式安全分析，并使用广泛接受的
    AVISPA 工具复现了我们的方案以进行正式安全检查。结果表明，我们的方案在多服务器环境下能抵御已知的潜在攻击。此外，我们的方案满足与多服务器环境相关的已知实用性特点。我们的方案在登录、验证和密钥建立阶段不需要
    RC 的参与。因此，与其他现有方案相比，我们的方案更有效，并越来越适合实际应用，特别是对于便携式和电池供电设备。


    Puja Smriti 等人 [6] 提出，按键元素是一种社会生物识别策略，用于基于个人的输入节奏来验证或检查客户的身份。在本章中，我们提出了一种新策略，将个人电脑的按键信息与工作站的按键信息进行对应。获得的结果非常令人兴奋。未来，这种比较方法可以在不同类型的键盘上进行测试。可以加入更多特征以提高精度。此外，该方法还可以应用于移动电话。


    Michael J. Coakley 等人 [7] 的研究主要目的是分析从当前手机中提取的各种文本输入生物特征数据的确认性能。与现有机械键盘相比，传统的按键按下/释放计时获得了
    20% 的 EER。另一方面，触摸屏功能（4.0% EER）和仅包含转盘（4.3% EER）所取得的出色结果似乎为手机上的客户验证提供了一种令人信服的方法。该研究比较了两种不同的验证技术（RRS
    和 LOOCV），如预期，LOOCV 策略优于 RRS，但代价是更大的计算时间。在分析的两种距离度量中，曼哈顿距离在大多数试验中始终优于欧几里得距离，无论所使用的功能列表如何。有趣的是，传统的按键按下/释放（包括机械键盘上可用的那些）与触摸屏相比，提供了更弱的性能结果。除了外形因素之外，机械键盘上单个按键的手感与触摸屏虚拟键盘上平坦、有些危险的手感相比，培养了更稳定和可重复的按键元素。这是一个值得进一步研究的领域。


    Md Liatkat Ali 等人 [8] 指出，众多研究者并未关注 KD 框架准备和测试的计算成本。一个强健的 KD 框架应该具有响应性，特别是当应用程序需要持续连接时。已有一些针对自由或长文本输入的研究，但它们只使用英语作为主要通信语言。有必要考察其转换到不同语言的可行性。未来的研究还应更加强调配备大量传感器的手机。许多设备支持多点触摸屏、压力感应面板、加速度计和其他功能，所有这些都可以整合到
    KD 框架中。


    许多调查中的信息收集是在相对较短的时间内进行的。个人的输入行为可能会因年龄、健康或精力状态而改变。最近我们才看到一些致力于从输入行为中识别心理负担以及客户限制如何影响
    KD 框架性能的研究。最后，为 KD 验证创建基准数据集将是有前途的未来研究。KD 数据集应考虑输入设备、输入类型和输入长度等因素，以便能够根据这些标准评估
    KD 框架。未来的工作还应努力解释为什么特定策略能取得更好的性能。制定 KD 框架的标准化协议可能有助于使各项工作可比。KD 研究仍处于初级阶段，与其他生物识别框架相比，迄今为止开展的研究数量非常有限。尽管它具有成本低、简单、对客户无创伤、持续验证等优势，但与其他生物识别框架相比，其精度较低。


    Maria Habib Ja''far Alqatawna [9] 讨论了一项关于当前生物识别程序的研究。生物识别可以是物理性的（指纹、虹膜、掌纹、面部识别）和行为性的（按键元素、声音和步态）。此外，它还讨论了它们的优点、局限性以及生物识别绩效度量中使用的评估度量。同样，它概述了正在进行的生物识别多模态方案（生理的、社会的和混合的），包括其缺点和局限性。最后，它提出了一种静脉和按键元素的组合验证方案。


    Md. Asraful Haque [10] 讨论了一项研究，认为我们的策略非常直接，因为它依赖于事实的方法论，并取得了超过 93% 精度的有趣结果。我们相信，该方法将能有效克服许多常规密码安全组件无法攻克的攻击。然而，我们的方案中仍有一些潜在问题需要指出。首先，选择阈值没有数学依据，它仅是通过仔细调整结果选定的。其次，我们考虑了常规
    PC 键盘设备的按键元素特性。因此，虚拟键盘上的输入速度对同一用户可能有所不同。第三，注册过程对用户来说既耗时又令人疲惫。我们的分析不涉及这些情况。尽管如此，所提框架中有许多方面可以考虑用于进一步改进。提高框架性能的一种方法是随时间更新客户输入档案。改进结果的另一种方法是利用某种科学分析找到合理的限制。如果允许用户使用删除键来修改密码，错误率可以降低。未来的任何改变都应减少假阳性和假阴性错误。最近，手机、平板电脑和其他触摸屏设备的使用正在以惊人的速度普及。


    Sung-Shiou 等人 [11] 讨论了一项关于当前 PC 或移动通信框架的研究，该框架在很大程度上依赖于使用用户名/秘密密码验证策略来确保框架信息。最终，老式验证策略存在许多安全缺陷和便利性限制。今天，一种引人入胜的生物识别验证工具——按键元素，是著名的生物识别技术之一。本文扩展了动态按键概念，并提出了一种基于重量的动态按键方法，作为更安全、更易用的独特按键验证替代方案。在注册阶段捕获和分析额外的客户键码（键节奏和键压力）以及时间戳，将逐步提高验证程序的成功概率和安全性。此外，硬件和软件子系统模型的使用还证明了本文所提议验证方案的可行性和易用性。


