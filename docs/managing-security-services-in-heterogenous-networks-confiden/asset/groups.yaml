    ## 3.1 Introduction


    In mobile ad-hoc networks (MANETs), a node has to interact with unknown nodes
    in establishing the network. The applications are run successfully, if all the
    nodes are cooperative. Hence, the trust computation of each node is certainly
    an advantage in running applications effectively by eliminating untrustworthy
    nodes. Due to the severe resource constraints (like energy, computational power,
    bandwidth, and time) and dynamics (like topological changes, mobility, and channel
    conditions) of the network, creation of a secure environment by implementing complex
    encryption algorithms (hard security) is not a trivial task [8]. Alternatively,
    researchers have concentrated on soft security (trust) methods to separate malicious
    nodes by monitoring their activities.


    In MANET, usually a node switches to selfish mode when it is short of resources,
    and it may not cooperate in running neighbor applications. Due to malicious behavior,
    a node can weaken the network performance by dropping or tampering with packets.
    In this regard, authors [1,2] suggest taking into account a node’s ability (in
    terms of resources) and attitude in its trust estimation. Through the node trust
    computation, the quality of service (QoS) of the applications in the network can
    be improved [10,12].


    In this chapter in Section 2, trust definitions, properties, prediction, aggregation,
    propagation, and computation methods are discussed in the MANET context. Different
    trust attacks in MANETs and their countermeasures are discussed in Section 3.
    In Section 4, soft computing methods in trust estimation are discussed like fuzzy
    logic, fuzzy Petri nets, Bayesian conditional probability, Dempster-Shafer Theory
    (DST), and trust matrix operations.


    ## 3.2 Trust in Mobile Ad-hoc Networks


    Trust is platform independent, and the principles of trust are even applicable
    to the communication network. In current research, trust is being considered as
    one of the design considerations in a networking protocol stack [4]. In the distributed
    environment of MANETs, maintenance of trust relations with other nodes can increase
    the network performance like scalability, dependability, and reliability. In this
    section, these concepts are discussed in the MANET context.


    ### 3.2.1 Trust Definitions


    The term “trust” is defined in multiple ways, but the widely accepted two definitions
    are discussed here.


    In [14], the trust of a particular node is a subjective assessment by an agent/other
    peer node on the reliability and accuracy of information received from or traversing
    through that node in a given context.


    In [13], trust reflects the belief or confidence or expectations in terms of the
    honesty, integrity, ability, availability, and quality of service of a target
    node’s future activity/behavior. It also reflects the mutual relationships where
    a given node behaves in a trustworthy manner and maintains reliable communications
    only with nodes that are highly trusted by the given node.


    ### 3.2.2 Trust Properties in MANETs


    In Figure 3.1, the trust properties are described from a MANET perspective, where
    the trust is shown as the combination of properties like asymmetry, subjectivity,
    context dependency, dynamicity, and transitivity.


    ![](img/058011bdc8fc3d3d77199bfcbf721be0_48_0.png)


    Figure 3.1 Trust Properties in MANETs.


    - **Trust is dynamic:** In MANETs, node behavior is not static; it changes based
    on conditions over time. Hence, the node’s trust is a variable factor. In [15],
    Adams et al. recommended a random variable to capture the trust changes instead
    of a discrete variable.


    - **Trust is subjective:** In a network, a node can have different opinions on
    other nodes at different time intervals, where these trust changes are influenced
    by the network topology conditions.


    - **Trust is asymmetric:** Usually ad-hoc networks are formed with the heterogeneous
    nodes, where nodes have different capabilities like computational power, memory,
    battery power, etc. Hence, the trust relation between two nodes is not symmetric.
    Generally, a node with good resources has good trust with its neighbors.


    - **Trust is transitive:** A node can assess the trustworthiness of a target node
    through intermediate nodes using a trust transitivity rule. Let us consider three
    nodes (n<sub>i</sub>, n<sub>j</sub>, n<sub>k</sub>), where n<sub>j</sub> is the
    neighbor of both n<sub>i</sub> and n<sub>k</sub>, but n<sub>i</sub> and n<sub>k</sub>
    are not neighbors. Node n<sub>i</sub> takes the trust recommendation of n<sub>j</sub>
    to estimate the trustworthiness of n<sub>k</sub>.


    - **Trust is context dependent:** In ad-hoc networks, trust is context dependent,
    i.e. a node has different trust opinions of the same node in different contexts.
    A node can trust another node in an energy context but cannot trust in a bandwidth
    context, for example.


