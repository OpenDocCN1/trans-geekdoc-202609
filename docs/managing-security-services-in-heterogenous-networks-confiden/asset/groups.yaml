    Alshehri 和 Sandhu 借助多值开关案例及其他多种设备解释了该架构 [2]。访问控制逻辑将位于云计算层，并且他们已采用 ABAC 进行访问控制。云计算层提供多租户以及不同类型的结构化和非结构化数据管理支持
    [17]。对象层将由收集数据的异构设备组成，例如传感器、摄像头、智能手机（带多个传感器）和执行器，并将数据呈现给上层，即虚拟层。虚拟层由映射到对象层设备的虚拟对象组成。虚拟层对象可根据需要定义。虚拟对象有助于存储与对象层中设备相关的状态或值。虚拟对象层还用于从高层向对象层传递命令。虚拟对象可以定义为一对一（一个虚拟对象映射到一个设备）或一对多（一个虚拟对象映射到多个设备）。ACOIoT
    架构用例中的 ABAC 通过多值开关案例进行演示。PDP 和策略将存储在云计算层中。


    此外，Alshehri 和 Sandhu [3] 将 [2] 中的架构扩展到汽车访问控制，并为虚拟对象（VO）通信提出了操作模型。


    ### 1.6.1.1 可穿戴设备的 CEIoT


    Bhatti 等人 [7] 将 [2] 中的架构扩展到可穿戴设备，在对象层和虚拟对象层之间增加了一个对象抽象层，以高效实现访问控制策略，并规定了层间通信（指定哪些层允许通信，哪些层不允许相互通信）。可穿戴设备是个人设备，在这样资源受限的设备环境中提供访问控制具有挑战性。


    ### 1.6.1.2 基于云的 IoT 中的授权


    Bhatti 等人 [6] 还将 [2] 中提出的架构扩展到 IoT 场景中的当前授权流程。Bhatti 等人 [6] 演示了增强版 ACOIoT（EACOIoT）在实现访问策略方面的应用。该模型中存在的额外对象抽象层将处理
    EACOIoT 框架中对象层与上层之间的授权和隐私。由网关设备组成的对象抽象层在对象层设备和虚拟对象层之间提供抽象。EACOIoT 框架通过智能家居和智能大学停车场用例进行演示。


    ### 1.6.1.3 支持 Amazon Web Services 的 IoT


    Bhatti 等人 [8] 将此模型扩展到连接到 Amazon Web Services（AWS）云的 IoT 设备，并提出了 ABAC 来定义访问控制逻辑。他们考虑了恒温器和灯泡用例来演示
    AWS IoT 访问控制。该模型在提出时还考虑了 MQTT 等通信协议。与对象层中设备关联的虚拟对象被称为“影子”或“事物影子”。


    ### 1.6.2 IoT 中的基于能力的访问控制


    尽管 CapBAC 中没有直接涉及云计算层的工作，但本节将讨论 Gusmeroli 等人 [16] 和 Hernandez-Ramos 等人 [18] 在
    IoT 环境下提出的模型，因为这些模型可以直接扩展到涉及云计算层的模型。


    ### 1.6.2.1 集中式基于能力的 IoT


    Gusmeroli 等人 [16] 提出了 IoT 中的集中式基于能力的访问控制（CapBACIoT）。为了解决 RBAC 和 ABAC 中的可扩展性和组动态缺点，Gusmeroli
    等人 [16] 在 IoT 中提出了 CapBAC 模型。他们采用这种方法是因为 CapBAC 提供了更好的委托支持、能力吊销（临时吊销）以及带有单个 PDP
    的信息粒度。他们使用与汽车和家政用例相关的信息和服务访问来演示此模型。但是，此方法未概述如何为不同设备单独定义访问逻辑，这在 IoT 中非常必要，因为一个设备的访问策略可能与另一个设备相同，也可能不同。


    ### 1.6.2.2 分布式基于能力的 IoT


    Hernandez-Ramos 等人 [18] 提出了一种在 IoT 中实现 CapBAC 的分布式方法。IoT 架构中的分布式 CapBAC 克服了集中式
    CapBAC 方法中单个 PDP 的缺点，并根据要求独立于每个终端设备提出了访问逻辑。Hernandez-Ramos 等人 [18] 甚至在 32 位 RISC
    处理器上实现了所提方案，并展示了其在 IoT 中的可持续性。此外，他们还讨论了采用椭圆曲线密码学（ECC）的端到端安全通信。


    ## 1.7 未来展望


    此处定义的访问控制模型仅限于一种环境。在大规模应用中，会出现大量实施挫折，存在许多研究挑战和未来机遇。如本章所考虑的，云和 IoT 等最先进的基础设施需要更高级别的安全性，同时在基础层面也需要稳健。即使是现有的先进访问控制策略也缺乏某些必要属性，例如不恰当的多租户架构、标准化的


