    +   - Confidentiality – It guarantees only the authorized devices to access and
    analyze data and averts information negotiation caused by eavesdropping.

    +   - Message Integrity – It ensures that the message transferred between the
    two Bluetooth devices is intact without any alteration.

    +   - Pairing/Bonding – It ensures that one or more shared secret keys are generated
    and stored


    Note that Bluetooth does not provide security services like audit and non-repudiation.


    # 7.5.3 Bluetooth Security Modes


    The BT versions (up to 2.1) outlines four different security modes that a device
    can implement. In Bluetooth technology, a device can be in only one of the subsequent
    security modes at a time:


    **Security Mode 1 (Nonsecure)** – A non-secure mode. Authentication and encryption
    are sidestepped leaving this mode deprived of all security measures. Mode 1 is
    simply supported in BT 2.0 + EDR and earlier versions [16].


    **Security Mode 2 (Service-level Enforced)** – This is a service-level enforced
    security mode and is supported by all Bluetooth devices. Based on the notion of
    authorization, decision is taken as to grant access to specific devices or people,
    and this is controlled by the centralized security manager. Once when the physical
    link is established, security measures take place


    **Security Mode 3 (Link-level Enforced)** – This mode commands authentication
    and encryption for all links to and from the device. The physical link is established,
    even before the security measures take place. Security Mode 3 is only supported
    in Bluetooth 2.0 + EDR and earlier devices [16].


    **Security Mode 4 (Service-level Enforced)** – This mode is enforced on the service
    level, after the establishment of physical link. The pairing mechanism uses Elliptic
    Curve Diffie Hellman'
  - '[PAGE 159]


    (ECDH) techniques. Services sustained by Mode 4 must be classified as one of the
    following:


    +   - Authenticated Link Key required.

    +   - Unauthenticated Link Key required.

    +   - No security required.


    This is obligatory for communication among devices in compliance to Bluetooth
    2.1 + EDR or newer versions [16].


    # 7.5.4 Bluetooth Service Levels


    Security requirements for services protected by Security Mode 4 is classified
    as one of the following:


    +   - Level 4: Authenticated link key using Secure Connections required

    +   - Level 3: Authenticated link key required

    +   - Level 2: Unauthenticated link key required

    +   - Level 1: No security required

    +   - Level 0: No security required (only allowed for SDP)


    These five levels (SL 0, 1, 2, 3, and 4) address diverse protective technologies
    against cybersecurity threats, which consist of:


    +   - Man-in-the-Middle (MitM) threats

    +   - DDoS attacks

    +   - User interaction

    +   - Encryption strength


    SL 0 hosts no cybersecurity protections of any kind and is vulnerable to plainly
    every likely attack all the way to SL 4, which hosts all of the items noted earlier.
    These SLs are characterized in such a way to permit elasticity for implementers
    dependent on their requirements, particularly when using Secure Simple Pairing
    (SSP).


    The SP 800 121 document outlines a series of important security features and risk
    mitigation strategies. The key highlights include the following:


    +   - **Link Keys:** A secure authentication is the creation of a secret symmetric
    key (called as link key or long-term key) for Bluetooth applications. The NIST
    document specifies how the'
