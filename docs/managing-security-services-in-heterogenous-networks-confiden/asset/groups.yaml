    # 6.3.4.1 Predictive Modeling


    We are using three basic prediction models for healthcare data analysis [11]:


    +   - Regression

    +   - Classification

    +   - Patient similarity


    Regression and classification are the basic mathematical models to analyze the
    data, and patient similarity is a technique to find the customized distance metric
    for a specific clinical context. Let us consider a case study to describe the
    working procedure of “patient similarity.”


    # Case Study: On Heart Failure Onset Prediction


    Let us consider the EHR database with a list of patients and their disease information
    [7]. From this dataset try to find the similarity between different patients under
    the supervision of a doctor or medical practitioner, as depicted in Figure 6.6.


    In general, patient similarity, as shown in Figure 6.7, determines a customized
    distance metric for a specific clinical context.


    After analyzing and summarizing the EHR dataset with the help of “cTAKES: clinical
    Text Analysis and Knowledge Extraction System,” the resultant information is in
    the form of a similarity group, as shown in Figure 6.8.


