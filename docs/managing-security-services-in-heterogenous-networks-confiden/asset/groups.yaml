    # 7.1 Introduction


    The digital revolution has left the modern human society with many essential and
    unprecedented advances; which has led to the proliferation of smart devices, with
    more technology usage owing to miniaturization, advances in chip design, sensors
    and actuators at a very low cost. Going by the European Commission estimates that
    by 2020 there will be between 50 and 100 billion interconnected systems this will
    lead to an increase in high-quality urban mobility and improvised integration
    of better environment and living conditions, with excellent integration and management
    of resources with new communication technologies. These devices need an advanced
    technology to communicate among themselves like the wireless communication.


    The provisioning of advanced applications and services in smart cities is possible
    through the protocols for machine to machine (M2M) communication. The wireless
    technologies like Bluetooth Low Energy (BLE) or Near-Field Communication (NFC)
    have developed and matured greatly.


    # 7.1.1 Motivation


    The latest release of Bluetooth 5 comes not only with many novel features to fit
    itself into the disruptive technology monsters like cloud'
  - '[PAGE 145]


    computing, artificial intelligence, robotics and Internet of Things (IoT) but
    has also opened up the hornet''s nest of security concerns. Bluetooth SIG published
    the Bluetooth Core Specification Version 5.2 on January 6, 2020 . The Version
    5.2 specification adds new features like Enhanced Attribute Protocol (EATT), LE
    Audio, LE Isochronous Channels, and LE Power Control. EATT is an improved version
    of the Attribute Protocol (ATT). LE Audio consumes less battery life (runs on
    the Bluetooth Low Energy radio), uses a new LC3 codec, permits the protocol to
    carry sound, and adds features like one set of headphones connecting to multiple
    audio sources or multiple headphones connecting to one source [Clover, Juli 2020].
    It. BLE Audio will also add back for hearing aids [Android Open Source Project
    2020]. Among the other most notable new features, that are worthy of mention are
    data transmission up to 2 Mbps, communication up to 400 meters, and 800% in connection
    bandwidth.


    The increase in the data transmission bandwidth and increase in the link connection
    distance means that an attacker can access Bluetooth connections from even greater
    distances than before. The data transfer is at a fast (2 Mbps) speed, which means
    the attacker can get the required data before anyone realizes it.


    +   The contributions of this chapter are

    +   - A comprehensive review to detect and categorize major security threats in
    Bluetooth communication so that precautionary steps can be taken.

    +   - Present an outline of Bluetooth technology with an emphasis on its security,
    vulnerabilities, threats, and risk mitigation solutions.

    +   - Present a quick review of the Bluetooth security gaps.

    +   - Suggest techniques to mitigate the attacks.

    +   - Suggested measures to protect the Bluetooth communication.

    +   - A bird''s-eye view on the research status and future directions of Bluetooth
    security.


    Section 1 deals with technology and the motivation for this chapter. The remainder
    of this chapter is organized as follows. Section 2 describes the benefits of BT
    technology, its use in the various applications, and real-life examples of current
    Bluetooth exploits. Section 3 provides an overview of the literature review, along
    with the issues. Section 4 explains the advantages, overview of the Bluetooth'
  - '[PAGE 146]


    technology (core specification, connection types, classes, protocol stack of Bluetooth,
    security modes, BT security architecture and pairing. Section 5 presents the security
    architecture, features, services deployed, and its detailed design. Section 6
    reviews in detail the threats and its purpose related to BT. Section 7 explains
    the different types of BT attack classifications based on threats, which are based
    on the severity of attacks and methods of penetration or post attack. Section
    8 discusses the vulnerability and impact of approaches to escalate the range of
    Bluetooth and its categories (configuration vulnerability, design vulnerability,
    implementation vulnerability). Section 9 describes the risk mitigation techniques.
    Section 10 explains the countermeasures (security checklist with guiding principle
    and suggestions) that should be applied to overcome the attacks, threats, and
    vulnerabilities of BT. Section 11 concludes the chapter with an outline of BT.


    # 7.2 Rationale Behind The Study


    # 7.2.1 Efficacy of Bluetooth


    Bluetooth is used for low bandwidth applications like wireless networking between
    PCs, dial-up Internet access on personal computers or PDAs, real-time location
    systems (RTLS). Bluetooth devices can be used to predict (for instance, travel
    times and road congestion for motorists) and for safeguarding personal information
    from mobile phones. Mobile telephony, mice, portable printers, PC, organizers,
    audio helmets, assistive technologies, Hi-Fi systems, numerical cameras, remote
    banking payment, and car applications are a few applications of Bluetooth technology.
    The Bluetooth Smart Mesh technology is overriding the new markets as automotive,
    smart building, smart city, and smart home and industry automation. Bluetooth
    is used for smart keys, for sensitive encryption and authentication, and also
    just for connecting any medical devices to wireless infrastructure [1,2].


    Bluetooth is implemented for several different use cases such as indoor proximity
    systems [3], micro location [3], earthquake monitoring systems [4,5], and vehicle
    communication with mobile phones [6].'
