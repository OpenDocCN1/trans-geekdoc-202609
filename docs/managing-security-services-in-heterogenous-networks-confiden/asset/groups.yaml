    \n图 6.5 描绘了使用分类、回归和患者相似性分析医疗数据的过程。这些预测技术对海量数据进行建模，并有助于从资源中提取有用信息。让我们考虑一种简单的文本挖掘方法来分析数据，并将其应用于前面的架构。\n\
    \n**示例：** 在临床文本挖掘中，信息提取过程用于从文献中识别命名实体。现在，特征选择将提供关于疾病和症状的信息检索。最后，预测模型生成治疗方案。\n\n\
    现在观察临床文本与生物医学文本之间的区别。生物医学文本是书面的医学文献，而临床文本是临床医生在临床环境中撰写的。这种区别仅体现在“信息提取”阶段；其余程序对各种医疗数据来说都是常规的。\n\
    \n![](img/058011bdc8fc3d3d77199bfcbf721be0_137_1.png)\n\n图 6.5 大数据的数据分析流程。\n\n\
    ### 6.3.4.1 预测建模\n\n我们在医疗数据分析中使用三种基本预测模型 [11]：\n\n- 回归\n- 分类\n- 患者相似性\n\n回归和分类是分析数据的基本数学模型，而患者相似性是一种为特定临床环境寻找自定义距离度量的技术。让我们考虑一个案例研究来描述“患者相似性”的工作流程。\n\
    \n### 案例研究：心力衰竭发作预测\n\n让我们考虑带有患者列表及其疾病信息的 EHR 数据库 [7]。从这个数据集中，尝试在医生或医疗从业者的监督下找到不同患者之间的相似性，如图\
    \ 6.6 所示。\n\n一般来说，患者相似性（如图 6.7 所示）为特定临床环境确定自定义距离度量。\n\n在借助“cTAKES：临床文本分析与知识提取系统”分析和总结\
    \ EHR 数据集后，生成的信息以相似性组的形式呈现，如图 6.8 所示。\n\n![](img/058011bdc8fc3d3d77199bfcbf721be0_138_0.png)\n\
    \n图 6.6 EHR 中带有患者信息的示例数据集。\n\n![](img/058011bdc8fc3d3d77199bfcbf721be0_139_0.png)\n\
    \n图 6.7 患者相似性直觉（基于“i2b2 生物学与床旁整合信息学”数据集）。\n\n![](img/058011bdc8fc3d3d77199bfcbf721be0_139_1.png)\n\
    \n图 6.8 患者相似性组。\n\n高级医疗数据分析也可以借助以下方法进行：\n\n- 临床预测模型\n- 时序数据挖掘 [8]\n- 可视分析\n- 临床基因组数据集成\n\
    - 信息检索\n- 隐私保护的数据发布\n\n对于每种技术，数据分析中都有相应的方法论，这有助于改进结果。现在我们将转向医疗保健或生物医学健康数据中数据分析面临的挑战。\n\
    \n## 6.4.1 临床文本分析中的挑战\n\n### 6.4.1.1 查询加权\n\n与查询加权相关的问题是 [7] 查询太长，并非所有单词都有用，IDF\
    \ 不能反映重要性，语义将决定权重。\n\n### 6.4.1.2 词汇差距\n\n在匹配“X Rays”、“X-Ray”和“X-Rays”等单词变体以及匹配“CT”或“X\
    \ rays”等同义词时存在问题。除了这些问题，我们在知识差距方面还面临另一个问题。\n\n### 6.4.1.3 伪反馈\n\n为了克服上述词汇差距问题，我们使用伪相关反馈技术。这里的问题是“如果前\
    \ N 个中只有很少相关怎么办”，我们也不知道“应该选择哪些关键词”。\n\n### 6.4.2 图像数据中的挑战\n\n- 提取信息特征。\n- 选择相关特征，例如稀疏方法和降维技术。\n\
    - 将图像数据与其他数据变量集成。示例包括：\n  - 基于向量的集成中的早期融合。\n  - 多核学习中的中级融合。\n  - 单模态结果集成中的晚期融合。\n\
    \n## 6.5 结论\n\n随着医疗数据的巨大增长，数据分析和大数据 [12,13] 概念在生物医学领域发挥着重要作用。为了在生物医学文本和 EHR 数据上产生更准确的结果，我们需要对其进行预处理，并进行一些分析以实现更好的治疗，在某些情况下还可以预测疾病的严重程度。在医疗保健领域，数据分析可以分为两种类型。文本挖掘和生物医学图像分析属于高级数据分析，它在样本数据上提供一些预测模型。回归和分类等基本数据分析技术将产生多种疾病之间的共性，并帮助诊断病因。最后，我们得出结论：借助数据分析，可以在预测和诊断不同疾病方面取得良好效果，成本更低、时间更短。\n\
