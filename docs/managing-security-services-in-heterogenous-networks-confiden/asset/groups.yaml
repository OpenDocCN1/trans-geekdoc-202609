    目前，在按键要素的发展中正逐渐受到重视。由于上述方法在其他生物识别框架中已取得显著的识别率，这激励专家们探索将此系统应用于按键要素的可行性。


    Chandralekha Jadhav 等人 [14] 提出了一种模型，为基本框架提供开发级别的安全性，而安全性是其中一个重要问题。该模型不需要像其他生理生物识别框架那样任何额外设备，因此总成本非常低。我们利用五个参数构建了验证模型，使用该模型的框架分别能够实现
    1% 和 4% 的 FAR 和 FRR。由于 FAR 和 FRR 都描述错误识别，这些值应尽可能低。我们的模型实现了这些值的理想且足够的范围。消除错误接受率和错误拒绝率是一项艰巨的任务。因此，完全移除这些参数将是一项重要任务，需要在该项目即将发布的版本中及时处理。不准确性可能由打字节奏的变化引起，而这种变化可能由其他因素导致，例如受伤、疲劳、药物影响或分心。框架必须足够强大，以减少此类缺陷。另一个限制是，由于针对密码短语的定制、打字能力的提升、输入设备的变更以及其他环境因素，打字样本可能会发生变化。我们需要以巧妙的方式处理这些变化。同样，预计更多工作将聚焦于使该框架具有动态性。


    Made Indra Wira Pramana 等人 [15] 提出的按键要素验证技术总体上可能可用，该框架的客户 SUS 评分预计能达到 70 以上；然而，在该技术准备好应用之前，仍有更多工作需要开发。所示技术的
    FAR 为 39.9%，FRR 为 3.3%——这一结果需要更大的改进。该技术的 EER 为 17.6%，远高于数据集制作者的结果。较高的 EER 可能是由于客户不习惯数据集生成时定义的固定内容所致。尽管客户指出该策略可用，但仍需一些改进，以进一步扩大该技术的性能，从而恰当地将非法客户与真实客户区分开来。


    Jiaju Huang 等人 [16] 提出了 KDE 算法，该算法在 Bison、Clarkson 和 Torino 数据集上显示出可比的性能。总体而言，KDE
    实现了最可靠、最稳定的性能。它不仅在不同数据集上具有最可比的表现，而且在我们的非约束数据集（Clarkson II）上的性能下降最少。Genetti 和 Picardi
    算法在 Buffalo 数据集上表现较差，但在另外两个数据集上表现可比。SVM 算法在 Buffalo 数据集和 Clarkson I 上具有可比性能，但在
    Torino 上要差得多，因为它缺少计算所需的按键释放时间。我们可以推测，由于这三个数据集是在可比环境中收集的，它们具有可比性能。英语和意大利语之间的差异似乎在此过程中不起作用。另一方面，我们自己新的非约束数据集（Clarkson
    II）由成员在日常计算行为中打字组成，并包含来自各种活动的按键，以及例如游戏等活动产生的嘈杂按键。它对三种算法都产生了最糟糕的性能；然而，它更可能反映真实按键要素的实际情况。特征数量对按键要素验证至关重要，已证明使用的双字母越多，性能越好。然而，该方法使用的特征数量仍远少于
    KDE 和 Gunetti 与 Picardi 算法所使用的数量。因此，该算法的性能要差得多。具体而言，由于 Torino 数据集中没有按键释放时间，仅使用了三个所需特征中的一个。因此，我们看到其验证性能急剧下降。


    Chaitanya Dwivedi [17] 展示了一项基于按键要素的研究，与其他分类问题相比，其特点是必须牢记的明确细节。此类细节要求针对预处理和扩展采用非同寻常的技术。可以看出，基于按键的框架验证的可行性取决于令人满意的分类器选择、数据准备和分类器调优。该论文高效地处理了所有这些问题。


    此外，它提出了一种新型混合分类器，以应对当前按键要素基于的客户验证方法中存在的低精度和高 EER 等问题。未来工作可能包括在自由消息上执行按键要素分析。例如，鼠标移动和
    GUI 交互等参数，可被用作额外特征以提高分类器性能。


    Md Liakat Ali 等人 [18] 讨论了一项关于生成模型和判别模型的研究，这两类模型在生物识别应用中具有不同的优势和局限性。生成模型可以处理缺失或新颖的信息。判别模型在处理新信息时通常非常快，并且相较于生成模型具有更优的预测性能。为了兼顾生成模型和判别模型的优势，本研究提出了一种混合
    POHMM/SVM 模型。所提模型在客户验证中实现了比其他发表工作更低的等错误率，同时保持了静态验证的基准评估方法。未来工作将是将所提混合模型应用于基于自由消息的数据集，用于客户识别并验证原因。所提混合
    POHMM/SVM 模型由生成模型 POHMM 和判别模型 SVM 组成。在所提模型中，POHMM 充当特征提取器，SVM 充当分类器。这为所提混合模型提供了更大的稳固性，以便在基于短固定内容的数据集上实现更优的验证结果。由于
    POHMM/SVM 使用判别模型 SVM 进行分类，混合 POHMM/SVM 模型还预计能在自由消息数据集上实现持续验证的更好性能。因为本研究中 POHMM/SVM
    取得的性能是使用单一强密码（secret password）和非一致性验证实现的，按键要素可以轻松地从每个客户捕获大型数据集，以实现更高的验证性能。


    Jigyasa Handa 等人 [19] 提出，按键检查和鼠标要素在社交生物识别研究中发挥着重要作用。从上述所有数据中获得的信息，有助于深入了解这两种策略在安全领域和数字世界不同领域的未来应用。鼠标要素可以根据鼠标指针速度进一步标准化。按键检查提供了关于客户打字风格的信息，并可用作个人的独特身份。


    Debasis Giri 等人 [20] 提出了一种高效的通用验证协议，该协议已显示可在通用串行总线（USB）大容量存储设备（MSD）中对文档进行加密，从而实现安全且易用的“USB
    存储棒”。本文向当前生物识别安全计算领域的最佳实践贡献了一个新颖的想法，通过防范安全攻击并提升跨会话的设备便利性。此外，论文正式证明了所提协议能够抵御重要的安全缺陷。还与现有文献进行了性能对比，以证实所提方案的计算成本和通信成本远低于其他相关方案。总体效果表明，基于
    USB 的带有生物识别安全传感器的 MSD 可以实现，为客户提供关键的安全性和易用性。


    V. Chandrasekar [21] 尝试对按键要素的研究进行全面概述。这些方法根据特征（包括所使用的提取技术）进行了分类，并对其性能进行了研究。可以看出，绝大多数工作都使用按键时长、非活动时间和双字母作为特征，这些特征的组合使用会导致较低的
    FAR。与大多数其他生物识别验证方案相比，按键生物识别具有客户识别方面的优势。由于客户已经习惯于通过用户名和密码进行身份验证，因此大多数提议的按键生物识别策略都很简单。按键生物识别也展示了巨大的潜力，因为特征可以在不需要任何特殊设备的情况下收集。


    Jiyun Wu 等人 [22] 提出了一种基于按键行为的身份验证框架，该框架考虑了客户动作的变化。该框架在客户解锁手机时以特定方式收集五个特征（即：按键加速、压力、尺寸、时间和设备方向）。同样，它采取一系列措施来提高框架的精度，for


