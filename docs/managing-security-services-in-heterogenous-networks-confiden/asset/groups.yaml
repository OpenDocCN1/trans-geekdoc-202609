    (SDP)


    The **host controller interface (HCI)** in the Bluetooth specification also defines
    a command interface to the baseband controller, link manager, and entry to hardware
    status and control registers. Bluetooth devices use **four types of addresses**,
    namely, BD ADDR, LT ADDR, PM ADDR, and AR ADDR.


    # 7.5 Bluetooth Security Architecture


    # 7.5.1 Bluetooth Security Features


    The example shown in Table 7.4 depicts the Bluetooth security offered between
    the phone and the laptop, although IEEE 802.11 security guards the WLAN link between
    the laptop and the IEEE 802.11 access point (AP). Communications on the wired
    network are unprotected by Bluetooth or IEEE 802.11 security competences. In order
    to provide an end-to-end security usage of higher-layer security solutions atop
    the security features should be included in Bluetooth and IEEE 802.11. The Bluetooth
    Core security architecture possess several security mechanisms.'
