    ## 2.6 结论


    本章为 MANETs 提出了一种 IWFCSRA，旨在在保障安全的前提下提升网络寿命和吞吐量。此外，还提出了一种用于区分网络中异常值的 FRWDOA。在所提工作中，生成了带权重的新模糊规则，用于形成簇，并用于计算信任分数，这些信任分数有助于在路由过程中做出最终决策。此外，基于
    MANETs 中的信任分数、能量和加权模糊规则，最终确定了各簇的可信路径。本章所做实验表明，与现有算法相比，所提算法在吞吐量、延迟和数据包传输方面表现更好。所提安全路由算法的主要优势在于：基于真实节点改变簇的形成、提高恶意节点检测精度、移除恶意节点，以及改善路由性能。未来在此方向上的工作可能包括使用模糊逻辑进行信任分数评估，并在不确定性条件下改进路由决策过程。


