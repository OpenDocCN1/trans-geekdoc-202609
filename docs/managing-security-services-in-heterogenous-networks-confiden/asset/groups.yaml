    of interconnected devices until it reaches the intended recipients, via the LE
    devices themselves. LE deployments should exploit the Low Power Node feature (maximizes
    lifetime in sleep mode) in the mesh protocol, and the “Friend” mode (accountable
    for the active listening role that captures incoming messages, and checks with
