    Bluetooth 攻击基于渗透方法或对目标的攻击后影响进行分类。基于对目标的攻击后影响程度，攻击严重程度分为高、中、低。


    - **高严重程度攻击** 可完全控制目标，从内存或外部存储中窃取、修改或删除数据，并可能造成财务损失。_示例_ – 后门攻击、Blue-Bugging、Blue-Snarfing、Car
    Whisperer、免费通话、离线 PIN 恢复、PIN 破解攻击

