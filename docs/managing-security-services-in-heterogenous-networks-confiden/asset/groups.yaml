    # 4.2.1 Nakamoto Consensus (Proof of Work)


    A Nakamoto consensus can be defined as a probabilistic approach that is nondeterministic
    in nature. In this model every node need not agree on the same value; instead,
    they agree on the probability of the value being correct. This consensus mechanism
    is proved to have the following characteristics through its famous implementation
    Bitcoin:


    +   1. Byzantine fault tolerance – There is no leader election in this process;
    instead, the decision is dependent on the nodes solving the computational puzzle
    faster and getting a chance to propose its value.

    +   2. Incentive mechanism – When a node solves the puzzle and proposes a value
    agreed to by other nodes, an economic incentive is rewarded to the winner node.

    +   3. Sybil resistance – Rather than using the conventional PKI authentication
    scheme or any other scheme, a proof of work (POW) mechanism is involved in the
    consensus process, making sure the process is Sybil resistant.

    +   4. Gossip protocol – The peer-to-peer gossip protocol ensures messages are
    routed to all the nodes in the asynchronous network, assuming each node is connected
    to a subsection of nodes only.


    4.2.1.1 Protocol Design Nakamoto consensus is designed on the basis of the principle
    that all the nodes present in the Blockchain network run an identical protocol
    and manages their own copy of the decentralized ledger. This protocol depends
    on the fact that the majority of the nodes present in the network are honest or
    nonfaulty nodes.


    Important rules applied in the design of the protocol [5,6] are mentioned next:


    +   1. Message broadcasting rule – All the transactions, whether generated locally
    or received from other peer nodes within the network, should be broadcast to the
    identified peers in a timely manner without causing any delay. The same condition
    applies for broadcasting the blocks as well.'
