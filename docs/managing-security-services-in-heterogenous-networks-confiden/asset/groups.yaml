    - **Network privacy mode** – The device will only receive advertising packets
    from peer devices that hold private addresses. By default, network privacy mode
    is used when private addresses are determined and created by the controller.


    The host upholds a resolving list by joining and eliminating device identities.
    The host may offer the controller with a whole resolving list or a subset of the
    resolving list. A device identity entails the peer’s identity address and a local
    and peer’s IRK pair.


    The controller performs address resolution and the host needs to state to a peer
    device that is involved in the resolving list, it uses the peer’s device identity
    address.


    Incoming events from the controller to the host use the peer’s device identity,
    on condition that the peer’s device address has been resolved. If the controller
    cannot resolve the peer’s device identity address in an advertisement, it may
    pass the event to the host for resolution in the host.


    Device filtering is made possible when address resolution is achieved in the controller
    since the peer’s device identity address can be resolved preceding to inspecting
    if it is in the white list.


    When address resolution is completed in the host, the device uses more power and
    the device filtering must be inactivated.


    Bluetooth offers four distinct connectivity and discoverability modes, which can
    be selected by the user of a Bluetooth device:


    - Silent – Device monitors the Bluetooth traffic and does not accept any connections.

    - Private (non-discoverable) – Device cannot be discovered and it doesn’t admit
    any connections if their address is known to the master.

    - Public (discoverable) – Device can be discovered and will accept connections
    from prospective masters.

    - LE (Low-Energy) Privacy – Device can deliver messages to other Bluetooth devices
    in connectionless mode.


    The security level linked to each of these modes depends on the pairing operation.
    When two devices initiate a connection, a shared key is created and secured through
    a set of protocols or a single protocol designed to surge the security level of
    the process.

