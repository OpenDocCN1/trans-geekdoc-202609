    QoS 要求。Gu 等人 [8] 为 WSNs 中的端到端通信设计了一种安全通信协议。在他们的协议中，采用了分级密钥预分布方法，向不同的传感器分发不同数量的密钥，以增强某些链路的韧性。Tang
