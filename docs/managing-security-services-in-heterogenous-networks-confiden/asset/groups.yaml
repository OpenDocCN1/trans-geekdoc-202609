    IE 中最有前景的领域，尽管我们面临许多障碍。在 IE 和 RI 中，我们关注：


    - 共指识别和

    - 时序关系提取


    共指消解的作用是识别句子内或跨句子中指代同一实体的两个提及。目前的共指消解研究使用基于规则的机器学习和混合系统来识别名词短语，包括人称、代名词以及医学检验等概念。在此方法中，数据质量将决定系统的性能。


    时序关系提取也是信息提取过程中的一种方法；它关注研究方向，因为它用于识别并发症、患者预后预测和 ADE 检测。以前，时序关系也用于急诊科（ED）计算机断层扫描（CT）影像报告的摘要。除了
    NLP 之外，我们还在 EHR 数据中使用数据应用和集成机制，以在现实环境中利用并回顾性评估治疗效果、护理质量和成本。临床决策支持系统（CDSS）有助于在医疗大数据上进行多任务处理以快速决策。


