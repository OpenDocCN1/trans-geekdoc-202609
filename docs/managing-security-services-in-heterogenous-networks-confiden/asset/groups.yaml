  mdcn: "\n\n底层设备和通信技术的异构性、不同层级的互操作性及安全要求，是大规模开发通用物联网解决方案的挑战。\n\nXu et al. [11] 为物联网提出了一种四层架构，包含以下内容：\n\
    \n- 1. 感知层 – 作为物理世界与网络世界之间的接口，借助传感器、摄像头、射频识别 (RFID) 等，对数据进行感知和收集。\n- 2. 网络层 –\
    \ 为数据传输和集成以及控制应用提供网络支持。\n- 3. 服务层 – 作为中间件，支持业务逻辑和服务集成。\n- 4. 接口层 – 提供接口，以无缝集成服务层与最终用户。\n\
    \n## 1.2 物联网应用领域\n\n物联网在各个领域都有应用。图 1.1 展示了从个人小工具到工业的物联网应用领域概览。\n\n## 1.3 云计算\n\
    \n物联网基础设施收集数据，并将其存储在像云这样的联网服务器上。根据 NIST，云计算 [24] 被定义为“一种实现随处可及、便捷、按需的网络访问共享可配置计算资源池的模式，这些资源可以快速配置和释放，只需最小的管理努力或与服务提供商进行交互”。\n\
    \n此外，NIST 还针对云计算 [24] 提出了基本特性、部署模型和服务模型。\n\n### 1.3.1 基本特性\n\n- a. 按需自助服务\n- b.\
    \ 广泛的网络访问\n- c. 资源池化\n- d. 快速弹性\n- e. 计量服务\n\n![](img/058011bdc8fc3d3d77199bfcbf721be0_11_0.png)\n\
    \n图 1.1 各领域物联网应用。\n\n### 1.3.2 部署模型\n\n- a. 公共云\n- b. 私有云\n- c. 混合云\n- d. 社区云\n\
    \n### 1.3.3 服务模型\n\n- a. 软件即服务 (SaaS)\n- b. 平台即服务 (PaaS)\n- c. 基础设施即服务 (IaaS)\n\
    \n连接的事物生态系统可以利用之前提到的任何云部署和服务模型的组合来存储数据，从而形成云赋能物联网 (CEIoT)。在 CEIoT 中，云基础设施被用作通过物联网设备感知的数据的存储介质；由于物联网与云的这种结合，产生了许多挑战。两端都需要确保的最常见问题是安全与隐私，因为云和物联网分别处理数据的存储和收集。在本章中，我们将重点介绍针对\
    \ CEIoT 的安全功能之一——访问控制，用于验证用户访问云上存储数据的合法性。本章概述了现有的使用访问控制方法的方法。\n\n## 1.4 动机\n\n\
    本章的主要动机是：通过感知设备收集的异构数据存储在云基础设施上，在提供个人数据的安全性和隐私方面需要极大关注 [9,15,27,29,38]。由于云是一个多租户且异构的环境，它将存储通过各种来源收集的不同类型的数据。确保此类数据的安全性是最高优先级，因为简单的泄露可能导致将基础设施作为存储介质的业务实体出现差异。CIA\
    \ (机密性、完整性和可用性) 特性是确保数据安全性的必要组成部分。这些特性对于提供适当的访问控制也至关重要，访问控制决定了信息安全性 [21,30,32,37]。\n\
    \n## 1.5 预备知识\n\n本节讨论了定义安全访问控制策略所使用的原语。\n\n### 1.5.1 基于角色的访问控制\n\n基于角色的访问控制 (RBAC)\
    \ 方法自 UNIX 操作系统时代以来一直被广泛用于向特定用户组指定访问文件的权限 [12]。随着技术意识的提升和进步，许多商业应用程序或供应商提出了适合其产品或组织的自有访问控制策略。RBAC\
    \ 已从强制访问控制 (MAC) 和自主访问控制 (DAC) 演变而来。\n\nDAC 是指根据行动发起者所属的组来限制或允许访问。例如，属于组 A 的用户可能会根据其在组\
    \ A 中的成员身份被允许或不允许访问某些文件。\n\nMAC 实现要求在用户创建时本身即指定用户权限。例如，组织中的一组用户被允许访问操作系统的内核，而另一组用户则被严格禁止这种访问。MAC\
    \ 方法广泛用于定义多级安全和军事应用。\n\nRBAC 方法为用户定义角色，反之亦然。许多供应商和从业者提出了他们自己的 RBAC 策略 [33]。为了标准化\
    \ RBAC 模型，Ferraiolo et al. [13] 提出了 RBAC 的 NIST 标准，RBAC 参考模型定义了一组组件。RBAC 模型将用户、角色、权限、操作和对象视为其元素。\n\
