    # 3. Static Separation of Duty Relations


    +   a. Static Separation of Duty (SSD) – This will place constraints on the assignment
    of users to roles. It can be used to prevent assigning contradictory (or mutually
    exclusive) roles to a single user.


    +   b. Static Separation of Duty in the Presence of a Hierarchy – This is similar
    to SSD and can be used to assign permissions hierarchically in addition to direct
    assignment of permissions.


    +   4. Dynamic Separation of Duty Relations – This can be used to limit the number
    of permissions and roles to a user and timely revocation of permissions.


    Out of which implementation of core RBAC component ensures full-fledged RBAC implementations,
    based on requirements other components can be introduced on top of the core RBAC.
    For detailed efforts on the standardization of RBAC, refer to [13].


