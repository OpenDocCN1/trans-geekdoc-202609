    一般来说，预测模型是医疗数据分析中广泛使用的热门术语，适用于“数据可视化”。数据可视化对于解释研究结果至关重要，该技术有助于临床医生接受新方法。可视化监测也是一个广泛的概念，还包括药物监测、患者监测等。“访问控制”也是患者数据隐私研究中的新热门话题之一。从表
    6.1 中，我们必须特别提到一种称为自然语言处理（NLP）的技术，这是生物医学信息学中采用的核心技术之一。NLP 可用于分析包含非结构化格式出院摘要的大量数据。因此，使用
    NLP 等技术可以提取并结构化这些描述性信息。此过程可被视为许多 EHR 数据二次使用研究中的重要步骤。通过增加可计算数据的量，NLP 还可以帮助解决数据不完整的某些方面。


