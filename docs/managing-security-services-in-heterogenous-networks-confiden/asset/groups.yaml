    ## 6.3.1 ICD 代码在生成大型医疗数据中的作用


    ICD 是由世界卫生组织（WHO）维护的疾病、体征、症状和操作代码的分层术语。在美国，大多数人使用 ICD-9，而世界其他地区使用 ICD-10。此外，EMR
    的兴起导致观察性研究的传播，这些研究有助于以巨大数量检查术前期；这也是产生大数据的主要原因之一。Thomas 等人 [4] 的工作未能使毒血症代码无效，因为作者没有调查编码的准确性，而是随时间考察了它们的使用情况。因此，不清楚是什么导致了他们发现的差异，可能是脓毒症编码随时间变得更加准确。


    ## 6.3.2 分析 ICD 代码和 EHR 数据


    一般来说，Big Data 一词不受 MeSH（医学主题词）约束——它通过 MeSH 中的“自动数据处理”、“电子数据处理”、“数据挖掘”和“EHR”得以体现。然而，对此类数据进行一些分析非常重要。表
