    RBAC 和 CapBAC 的一个共同缺点是单点故障。如果负责验证用户请求的服务器或服务宕机，系统将无法处理请求。最近，一些分布式架构已被提出以克服这一缺点。RBAC
    具有更通用的性质，可采用于任何需要 RBAC 的企业或通信环境，而 CapBAC 机制则可针对特定应用定义。


    ### 1.5.3 基于属性的访问控制


    基于属性的访问控制（ABAC）也称为基于策略的访问控制 [19]。在 ABAC 中，主体和客体除了动作和环境外，还将拥有各自的属性。拥有一组属性的主体将向中央实体请求访问特定客体的权限。中央实体将拥有“谁可以访问什么”的策略定义。中央实体将根据客体属性评估主体请求，并考虑动作和环境来授予或拒绝访问。


    ABAC 将拥有一个描述策略的中央实体。每次都不必为单个主体定义新策略，只需更改属于主体的属性即可。这将使中央实体能够高效处理组动态，这是 IoT 应用所需的核心功能。


    尽管 NIST 和其他标准协会的 ABAC 标准仍处于草案阶段，但绝大多数 ABAC 模型都包含以下组件，如 Servos 和 Osborn [34] 所述：


    - a. 主体

    - b. 客体

    - c. 属性

    - d. 权限

    - e. 策略


    核心 ABAC 可向多个方向和环境扩展。从 ABAC 发展出来的一个研究较为深入且独特的研究领域是基于属性的加密（ABE），包括密文策略 ABE（CPABE）[5]
    和密钥策略 ABE（KPABE）[14,36] 类型。由于 ABE 技术超出了本章的范围，有关详细描述可在相关参考资料中找到。


    ## 1.6 CEIoT 中的访问控制方法


    CEIoT 是近年来吸引 IoT、云计算和访问控制方法等各领域研究人员关注的新兴研究领域之一 [2,10,26]。尽管架构之间尚无共识 [28,30]，但文献和实践中已为
    IoT 提出了许多架构。通常，所提架构包含一个对象层和一个应用层，以及一个或多个中间层。对象层对应物理设备（例如传感器、摄像头、RFID 标签、智能手机等），数据从这些设备中收集。应用层由基于收集的数据提供的服务组成，例如数据访问、分析、决策支持系统、数据交易等
    [1,22]。中间层由单个或多个层组成，这些层又包含 IoT 框架的网络层或类似的通信支持层。有些架构甚至在中间层中拥有额外的子层。


    Gubbi 等人 [15] 提出将云计算作为对象层和应用层之间的一个层进行集成，此外还有其他层。但是，这些方法未涉及访问控制方法。在本节中，我们将回顾满足
    CEIoT 标准的方案。尽管所提方案未采用云计算层，但仍予以回顾，因为它们在 IoT 中提供了 CapBAC，并可扩展以纳入云计算层。


