    [1,6,10]。在多跳路由中，安全传输非常重要。路由中的恶意节点可能会攻击数据包。因此，许多研究人员研究了安全路由，相关文献可见 [1,2,4]。Zhan
    等人 [5] 提出了一种感知信任的路由框架（TARF），以保护 WSNs 免受误导多跳路由的对手的攻击。TARF 提供了一条可信且节能的路由，保护 WSNs
    免受利用路由信息重播的有害攻击。过去，Thippeswamy 等人 [6] 为动态 WSNs 提出了一种安全感知信任节能自适应路由（STEAR）协议。STEAR
    使用动态密钥、数据包流状态、能量和信任有效识别恶意节点。然而，考虑到攻击者的动态特性，有必要进一步工作以检测和防止新型攻击。


