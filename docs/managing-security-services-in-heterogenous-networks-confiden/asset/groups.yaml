    are deployed on each device and which devices are candidates for retirement after
    updates are no longer available. Device manager systems often support pushing
    out updates automatically to devices, as well as managing rollbacks if the update
    process fails. They can also help to ensure that only legitimate updates are applied,
    for example, through the use of digital signing.


    ### 6.2.3.4 Secure Communication

    Once the devices themselves are secured, the next IoT security challenge is to
    ensure that communication across the network between devices and cloud services
    or apps is secure. Many IoT devices don’t encrypt messages before sending them
    over the network. However, best practice is to use transport encryption and to
    adopt standards like Transport Layer Security (TLS). Using separate networks to
    isolate devices also helps with establishing secure, private communication so
    that data transmitted remain confidential.


    ### 6.2.3.5 Ensure Data Privacy and Integrity

    It is also important that wherever the data end up after they have been transmitted
    across the network, they are stored and processed securely. Implementing data
    privacy includes redacting or anonymizing sensitive data before they are stored
    or using data separation to decouple personally identifiable information from
    IoT data payloads. Data that are no longer required should be disposed of securely,
    and if data are stored, maintaining compliance with legal and regulatory frameworks
    is also an important challenge. Ensuring data integrity may involve employing
    checksums or digital signatures to ensure data have not been modified. Blockchain,
    as a decentralized distributed ledger for IoT data, offers a scalable and resilient
    approach for ensuring the integrity of IoT data.


    ### 6.2.3.6 Secure Web, Mobile, and Cloud Applications

    Web, mobile, and cloud apps and services are used to manage, access, and process
    IoT devices and data, so they must also be secured as part of a multi-layered
    approach to IoT security.


    When developing IoT applications, be sure to apply secure engineering practices
    to avoid vulnerabilities such as the OWASP Top Ten vulnerabilities. Just like
    devices, apps should also support secure authentication, both for the apps themselves
    and the users of the applications, by providing options such as 2FA and secure
    password recovery options.


    ### 6.2.3.7 Ensure High Availability

    As we come to rely more on IoT within our day-to-day lives, IoT developers must
    consider the availability of IoT data and the web and mobile apps that rely on
    that data, as well as our access to the physical things managed by IoT systems.
    The potential for disruption as a result of connectivity outages or device failures,
    or arising as a result of attacks like denial of service, is more than just an
    inconvenience.


    In some applications, the impact of the lack of availability could mean loss of
    revenue, damage to equipment, or even loss of life. For example, in connected
    cities, IoT infrastructure is responsible for essential services such as traffic
    control, and in healthcare, IoT devices include pacemakers and insulin pumps.
    To ensure high availability, IoT devices must be protected against cyber-attacks
    as well as physical tampering. IoT systems must include redundancy to eliminate
    single points of failure and should also be designed to be resilient and fault
    tolerant so that they can adapt and recover quickly when problems do arise.


    ### 6.2.3.8 Detect Vulnerabilities and Incidents

    Despite best efforts, security vulnerabilities and breaches are inevitable. How
    do you know if your IoT system has been compromised? In large-scale IoT systems,
    the complexity of the system in terms of the number of devices connected and the
    variety of devices, apps, services, and communication protocols involved can make
    it difficult to identify when an incident has occurred. Strategies for detecting
    vulnerabilities and breaches include monitoring network communications and activity
    logs for anomalies, engaging in penetration testing and ethical hacking to expose
    vulnerabilities, and applying security intelligence and analytics to identify
    and notify when incidents occur.


    ### 6.2.3.9 Manage Vulnerabilities

    The complexity of IoT systems also makes it challenging to assess the repercussions
    of vulnerability or the extent of a breach in order to manage its impact. Challenges
    include identifying which devices were affected, what data or services were accessed
    or compromised, and which users were impacted, and then taking actions to resolve
    the situation. Device managers maintain a registry of devices, which can be used
    to temporarily disable or isolate affected devices until they can be patched.
    This feature is particularly important for key devices such as gateway devices
    in order to limit their potential to cause harm or disruption, for example, by
    flooding the system with fake data if they have been compromised. Actions can
    be applied automatically using a rules engine with rules based on vulnerability
    management policies.


    ### 6.2.3.10 Predict and Preempt Security Issues

    A longer-term IoT security challenge is to apply security intelligence not only
    for detecting and mitigating issues as they occur but also to predict and proactively
    protect against potential security threats. Threat modeling is one approach used
    to predict security issues. Other approaches include applying monitoring and analytics
    tools to correlate events and visualize unfolding threats in real time, as well
    as applying artificial intelligence (AI) to adaptively adjust security strategies
    applied based on the effectiveness of previous actions.


    ## 6.3 Methods for Using Healthcare Data Analytics


    Doing any kind of analysis will start with data collection. The data collection
    process in a healthcare system can present many problems. Particularly, effective
    integration and effective forms of various healthcare data over a period of time
    can answer many of the impending healthcare problems.


    General data collection and analysis can be diagrammatically represented, as shown
    in Figure 6.1. Here the admin is going to maintain all types of data, and they
    are only having the provision to access it from the sources. The EHR [2,20] database
    is going to act as our Big Data platform.


    The EHR data are the core part of data analytics. And this is also going to become
    the best data source to maintain the information about healthcare, as given in
    Figure 6.2. All EHRs are maintained on a timely basis to produce analytical information
    based on the statistical models; these can also be used in doing research on the
    existing healthcare data.


    In clinical terminology, the EHR data can be divided into two ways, namely,


    - Structured EHR data

    - Unstructured EHR data


    The structured EHR data will use the data elements that are documenting patient
    information using controlled vocabulary

