    **Bluetooth 协议** – Bluetooth 协议栈的设计和开发旨在允许各种通信应用程序使用 Bluetooth。通常，应用程序只会使用此协议栈的一个垂直切片。


    此处列出了 Bluetooth 协议层及其关联协议：


    - **已采用协议：** IrMC, OBEX, PPP, UDP/TCP/IP, vCal, vCard, WAE, WAP

    - **应用协议：** PPP, TCP/IP, OBEX, WAP, vCard, VCal, WAE

    - **Bluetooth 核心协议基带：** L2CAP, LMP, SDP

    - **接口协议/电缆替换协议：** RFCOMM

    - **电话控制协议/应用控制规范：** AT-commands, TCS Binary

    - **底层协议：** Baseband, L2CAP, LMP, 服务发现协议 (SDP)


    Bluetooth 规范中的**主机控制器接口 (HCI)** 还定义了向基带控制器、链路管理器以及硬件状态和控制寄存器的命令接口。Bluetooth 设备使用**四种地址类型**，即
    BD ADDR、LT ADDR、PM ADDR 和 AR ADDR。


    ## 7.5 Bluetooth 安全架构


    ### 7.5.1 Bluetooth 安全特性


    表 7.4 所示示例描述了手机与笔记本电脑之间提供的 Bluetooth 安全，尽管 IEEE 802.11 安全保护了笔记本电脑与 IEEE 802.11
    接入点 (AP) 之间的 WLAN 链路。有线网络上的通信不受 Bluetooth 或 IEEE 802.11 安全功能的保护。为了提供端到端安全，应在 Bluetooth
    和 IEEE 802.11 的安全特性之上包含更高层安全解决方案。Bluetooth 核心安全架构包含多种安全机制。


    | 安全特性 | 使用/基于 |

    |---|---|

    | BR/EDR 传统配对 | 基于 SAFER+ 的 E21 或 E22 算法 |

    | 设备身份验证 | 基于 SAFER+ 的 E1 算法 |

    | 加密 | 派生自 Massey-Rueppel 算法的 E0 算法 |

    | 消息完整性 | 未提供加密机制。虽然 CRC 可提供完整性保护，但不被视为提供加密完整性，因为它很容易被伪造 |

    | 安全简单配对 | FIPS 认证算法 (SHA-256、HMAC-SHA-256 和 P-192 椭圆曲线) 以及四种关联模型：Just Works、数值比较、比较、Passkey
    Entry 和 Out-Of-Band |

    | LE 传统配对 | AES-CCM 加密和四种关联模型：Just Works、数值比较、Passkey Entry 和 Out-Of-Band。它还提供签名数据和隐私功能。
    |

    | BR/EDR 物理传输上的安全连接促进安全简单配对 | P-256 椭圆曲线和设备身份验证以使用 FIPS 认证算法 (HMAC-SHA-256 和 AES-CTR)。安全连接还增强消息完整性
    (AES-CCM)。 |

    | LE 物理传输上的安全连接升级 LE 传统配对 | FIPS 认证算法 (AES-CMAC 和 P-256 椭圆曲线) 并使安全简单配对的数值比较关联模型可用于
    Bluetooth LE 物理传输。它还包含使用安全连接在任何物理传输上创建的密钥的机制，以免用户在另一物理传输上再次配对。 |


    ### 7.5.2 安全服务


    Bluetooth 安全模型包含五种独立的安全特性，即绑定、设备身份验证、加密、消息完整性和配对。


    - **身份验证** – 用于验证正在通信的设备的身份。但原生不提供用户身份验证。

    - 授权 – 确保设备获准使用服务，并允许控制资源。

    - 保密性 – 保证仅授权设备可以访问和分析数据，并防止因窃听造成的信息协商。

    - 消息完整性 – 确保两个 Bluetooth 设备之间传输的消息完整，未经任何更改。

    - 配对/绑定 – 确保生成并存储一个或多个共享密钥。


    请注意，Bluetooth 不提供审计和不可否认性等安全服务。


    ### 7.5.3 Bluetooth 安全模式


    Bluetooth 版本（最高 2.1）规定了设备可以实现的四种不同安全模式。在 Bluetooth 技术中，设备一次只能处于以下安全模式之一：


    **安全模式 1（非安全）** – 一种非安全模式。身份验证和加密被跳过，使该模式缺乏所有安全措施。模式 1 仅在 BT 2.0 + EDR 及更早版本中受支持
    [16]。


    **安全模式 2（服务级别强制）** – 这是一种服务级别强制安全模式，并受所有 Bluetooth 设备支持。基于授权概念，决定是否授予特定设备或人员访问权限，并由集中式安全管理器控制。一旦物理链路建立，安全措施即生效。


    **安全模式 3（链路级别强制）** – 该模式要求对设备的所有入站和出站链路进行身份验证和加密。物理链路在安全措施生效之前即建立。安全模式 3 仅在 Bluetooth
    2.0 + EDR 及更早设备中受支持 [16]。


    **安全模式 4（服务级别强制）** – 该模式在物理链路建立后，在服务级别强制实施。配对机制使用椭圆曲线 Diffie Hellman (ECDH) 技术。模式
    4 支持的服务必须分类为以下之一：


    - 需要经过身份验证的链路密钥。

    - 需要未经过身份验证的链路密钥。

    - 无需安全。


    这对于符合 Bluetooth 2.1 + EDR 或更新版本 [16] 的设备之间的通信是强制性的。


    ### 7.5.4 Bluetooth 服务级别


    安全模式 4 保护的服务的安全要求分类为以下之一：


    - 级别 4：需要使用安全连接的经过身份验证的链路密钥

    - 级别 3：需要经过身份验证的链路密钥

    - 级别 2：需要未经过身份验证的链路密钥

    - 级别 1：无需安全

    - 级别 0：无需安全（仅允许用于 SDP）


    这五个级别（SL 0、1、2、3 和 4）针对网络安全威胁涵盖了多种防护技术，包括：


    - 中间人 (MitM) 威胁

    - DDoS 攻击

    - 用户交互

    - 加密强度


    SL 0 不提供任何网络安全防护，易受几乎所有可能攻击的影响，一直到 SL 4，后者包含前面提到的所有项目。这些 SL 的设计旨在为实现者提供灵活性，具体取决于其要求，特别是在使用安全简单配对
    (SSP) 时。


    SP 800-121 文档概述了一系列重要的安全功能和风险缓解策略。重点包括以下内容：


    - **链路密钥：** 安全身份验证是为 Bluetooth 应用程序创建密钥对称密钥（称为链路密钥或长期密钥）。NIST 文档规定了在不同版本中如何进行创建。对于
    *个人识别号码 (PIN)/传统配对*，当用户输入 PIN 时会创建链路密钥，而在 *低能耗设备* 中，密钥由每个设备创建，并且永远不会分发。

    - **身份验证：** Bluetooth 设备通过质询-响应方式验证以证明其身份或进行验证（申述者/验证者方案）。旧设备通过 PIN/传统配对进行身份验证，而在创新应用（如安全汽车应用）中，这通过使用
    SSP 和 P-256 椭圆曲线的安全身份验证来实现。

    - **加密：** NIST 提到，AES-CMAC 和 P-256 椭圆曲线为高安全要求（最高 SL 4 所需）提供了最安全的组合。此外，实现者需要确保仅使用
    FIPS 认证算法，尤其是针对 BLE 规范。

    - **漏洞：** NIST 概述了多种漏洞，例如窃听、针对链路密钥的攻击、重复使用相同密钥以及对所述密钥的不安全存储、欺骗不安全设备以从其配对的其他设备获取密钥、不使用随机数生成器的短
    PIN、将主设备的密钥共享到其他 piconets 以及使用弱加密算法，以及其他一些对策。


    用户定义了 Bluetooth 技术中的第一层安全性。它提供了一个非常灵活的安全框架，规定何时涉及用户（例如提供 PIN）以及基本 BT 协议层遵循哪些操作以支持所需的安全检查。


    - 1. 在服务和设备上存储与安全相关的信息

    - 2. 通过协议实现或应用程序响应访问需求

    - 3. 在链接到应用程序之前强制执行身份验证和/或加密。

    - 4. 启动或处理设备用户的输入以在设备级别建立可信关系。

    - 5. 启动配对并查询用户的 PIN 输入。PIN 输入也可能由应用程序完成。


    '
