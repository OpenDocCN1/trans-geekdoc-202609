    # ## 2.2 Related Works


    In a wireless and ad-hoc network environment, secured and energy-efficient transmissions
    are needed to improve the network lifetime and throughput. Clustering is a well-known
    technique for improving the energy efficiency in computer networks. Many works
    have been carried out in clustering techniques and are in the literature [1,6,10].
