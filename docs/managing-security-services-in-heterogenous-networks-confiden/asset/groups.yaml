    physical devices (such as sensors, cameras, RFID tags, smart phones, etc.) from
    which data are collected. The application layer consists of services offered over
    data collected such as data access, analytics, decision support system, data trade,
    etc. [1,22]. The middle layer is composed of single or multiple layers that in
    turn comprise the network layer or similar supporting layers of communication
    for the IoT framework. Some architectures even have additional sublayers to the
    middle layers.


