    In MANETs, due to resource constraints and network dynamics, the implementation
    of complex security algorithms degrades network performance. In this work, this
    limitation is overcome with trust handling methods. Here node trust is evaluated
    by taking into consideration ability (resources) and attitude. A comprehensive
    discussion was provided on the trust attacks and their countermeasures. Different
    soft computing techniques (i.e. fuzzy logic, fuzzy Petri-nets, Dempster-Shafer
    theory, and trust matrix operations) are discussed for trust management in MANETs.


