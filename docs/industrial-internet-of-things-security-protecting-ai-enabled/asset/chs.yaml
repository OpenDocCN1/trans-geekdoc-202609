  \n图 9.2 制造业中的 AI 能力。\n\n随着企业对如何为 AI 定价有了更好的掌握，其在制造业中的主要应用开始脱颖而出。根据普华道的研究，其广泛实施的主要主要障碍之一是对投资回报率（ROI）缺乏清晰度。许多企业不仅缺乏执行大规模\
  \ AI 所需专业知识的人员，而且在收集和提供 AI 系统运行所需的数据方面存在困难。\n\n业务流程整体数字化的努力会对 AI 的采用产生重大影响。在 AI\
  \ 采用方面领先的公司也是那些对其基础业务数字化程度最深的公司。在《全球数字运营报告》中，普华道根据数字成熟度将企业分为“数字新手”、“数字追随者”、“数字创新者”或“数字冠军”。与\
  \ 10% 的数字新手相比，69% 的数字冠军已在其公司内使用 AI，或正计划使用。\n\n位于日本山之市的发那科（FANUC）工厂是通往未来工业的窗口。作为全球领先的工业机器人制造商之一，这些机器自己完成了所有工作，包括建造、检查和测试。发那科在开发其由\
