  \ 物联网的融合\n\n## 10.1 引言\n\n许多世界地区面临着应对快速老龄化、慢性疾病 [1–3]、疾病频发、恶劣环境、心理健康、水资源短缺以及污染等严峻挑战。尽管对医疗服务的日益增加，传统的医疗模式依然存在，患者只有在生病时才会去医院\
  \ 4]。\n\n时间限制、依从性监测、人口老化和城市化带来了巨大的障碍。物联网技术的引入改变了医疗领域，使提供医疗服务成为可能。医院传统上以医生为中心的方法，并没有让患者成为积极参与者\
  \ 5]。\n\n然而，物联网技术在主动监测患者健康以及通过物联网医疗设备（IoMT）向医疗人员提供实时数据方面证明至关重要 6,7]。\n\n### 10.1.1\
  \ 医疗物联网简介\n\nIoMT 是一种能够在医疗人员与服务器之间进行直接交互的医疗设备网络。通过收集、存储和处理数据为人类提供价值信息 8]。\n\n\n\n\
  \n\n随着 IoT 设备的引入，医疗健康领域发生了彻底变革。这些设备为医疗保健专业人员监测患者提供了许多机会，也让患者能够监测自己的健康。此外，可穿戴 IoT\
  \ 设备的可用性为医疗人员及其患者都带来了巨大的益处和挑战。\n\n#### 10.1.2.1 远程健康监测\n\n基于 IoT 驱动的远程患者监测是一种流行的医疗保健应用，它允许医疗专业人员从不在医疗机构的患者那里收集关键健康指标。该技术会自动收集心率、血压和温度等患者数据，消除了患者往返的，如图\
  \ 10.2 所示。一旦收集到患者数据，算法就会进行分析并建议治疗或产生报警。然而，数据安全和隐私在使用远程患者监测设备的一项重大挑战。通过适当的安全协议，医疗提供者可以放心地使用\
  \ IoT 设备来降低成本、提高护理标准并改善患者预后 [9–11]。\n\n![FIGURE 10.2 远程健康监测设备。](img/fig10_2.jpg)\n\
  \nFIGURE 10.2 远程健康监测设备。\n\n#### 10.1.2.2 血糖监测\n\n由于传统的手动血糖监测方法不便且不可靠，糖尿病管理具有很大的挑战性。IoT\
  \ 设备可以提供连续和自动监测，解决了这些挑战。然而，为血糖监测设计一种小型、低功耗的 IoT 设备面临着独特的挑战。克服这些挑战将彻底改变患者的血糖监测。随着技术的不断演进，IoT\
  \ 设备在糖尿病管理中发挥着日益关重要的作用，为患者提供有效管理健康所需的工具。很少有研究人员在不监测血糖的情况下使用软计算概念进行糖尿病管理 [3,12,13]。随着技术的发展，在训练模型时可能会更改记录的可能性\
  \ [7,14,15]。\n\n#### 10.1.2.3 心率监测\n\n由于周期性检查和有线监测设备的限制，医疗机构的患者的心率监测可能具有挑战性。然而，现代\
  \ IoT 设备在提供连续监测的同时，允许患者自由移动。尽管实现超精确结果面临挑战，但这些设备可以提供 90% 或更高的准确率 [9]。这些设备收集各种生理参数的数据，并将其传输给医疗提供者进行分析和干预，如图\
  \ 10.3 所示。\n\n![FIGURE 10.3 心率监测设备。](img/fig10_3.jpg)\n\nFIGURE 10.3 心率监测设备。\n\n\
  #### 10.1.2.4 手部卫生监测\n\nIoT 设备可以帮助医疗机构（尤其是医院）维持良好的手部卫生。这些设备提醒医疗保健人员和患者在进入病房之前消毒手，并提供有效的手部消毒方法说明。它们只是提醒，而不是实际洗手过程的替代品，如图\
  \ 10.4 所示，但研究表明它们可以将医院感染率降低 60% 以上 [9]。\n\n![FIGURE 10.4 手部卫生监测设备 [16]。](images/fig10_4.jpg)\n\
  \nFIGURE 10.4 手部卫生监测设备 [16]。\n\n#### 10.1.2.5 帕金森病监测\n\nIoT 传感器不断收集帕金森症状的数据，为医疗提供者提供重要的见解，以调整治疗并改善结果。患者可以使用非侵入性监测继续独立生活，允许他们在医院环境之外生活。IoT\
  \ 器的使用是帕金森病治疗的一项重大进展，在维持患者生活质量的同时提供了更个性化、更有效的护理。\n\n#### 10.1.2.6 可吞入式传感器\n\n可吞入式传感器使得从人体内部收集数据变得更加容易，而不需要插入摄像头或探针等侵入性技术。这些传感器可以收集相关信息，例如胃\
  \ pH 值和内部出血源。它们必须易于吞咽，并能够独立溶解或通过人体。目前许多机构正在开发此类可吞入式传感器。\n\n#### 10.1.2.7 连接式眼镜片\n\
  \n智能眼镜可以在不产生侵入的情况下收集健康数据。它们还具有利用你眼睛的微型相机。这项创新已导致 Google 等公司为连接式眼镜片申请专利。智能眼镜可以让你的眼睛成为数字交互的强大工具，无论是为了健康或其他目的。\n\
  \n#### 10.1.2.8 连接式吸入器\n\n如图 10.5 所示，IoT 连接吸入器可以通过监测发作频率和环境触发因素帮助管理哮喘或慢性阻塞性肺疾病（COPD）等呼吸道疾病。如果忘记吸入器或使用不当，它们还可以提醒患者，降低发作风险。这些吸入器为患者提供了宝贵的见解，并为医疗提供者提供了改善结果的数据。\n\
  \n![FIGURE 10.5 连接式吸入器。](img/fig10_5.jpg)\n\nFIGURE 10.5 连接式吸入器。\n\n#### 10.1.2.9\
  \ 机器人手术\n\nIoT 机器人用于人体以协助医生进行复杂手术，从而实现低侵入性手术和更快的恢复速度。这些设备必须是小型、可靠并能够解释体内复杂的状况，以便在手术期间做出明决策。它们在手术程序中的日益增加表明，小型机器人技术正在得到成功解决。\n\
  \n### 10.1.3 医疗物联网 (MIOT) 网络安全的需求与重要性\n\n\n\n\n然而，环境中任何未受保护的联网设备都可能构成了重大的安全风险。如果不加处理，这种风险可能会导致更严重的问题，例如患者的健康和安全\
  \ [17]。值得注意的是，IoT 和 MIoT 设备以难以保障安全著称，构成了严重的安全威胁。黑客非常重视医疗信息，这些信息对他们而言价值比信用卡号高十倍。因此，医院是网络攻击的首要目标。MIoT\
  \ 设备还可以为攻击者提供访问医院网络和窃取机密的后门。在某个案例中，黑客成功感染了血气分析仪（这对监测重症监护和手术患者至关重要），允许他们访问医院网络并窃取机密。即使采取了适当的预防措施，由于\
  \ MIoT 发送和接收高度个人化的数据，始终面临风险 [4]。遗憾的是，如今大多数系统的设计并非为了保护此类敏感信息。由于大多数 MIoT 设备在设计上缺乏安全保护，或者安全验证方法容易被有能力的攻击者破解，攻击者可以轻易地监听和拦截传入和流出的数据及信息，如图\
  \ 10.6 所示。每一级别的安全关注问题，包括设备、系统、网络、数据、访问、教育和治理，都需要经过检查和解决 [18]。受物联网的影响，医疗行业面临着更多的数据安全和责任风险。IoT\
  \ 引发了许多安全和隐私担忧，但由于这些设备是自动化的，风险更大。在获取网络访问后，黑客可以使用勒索软件锁定重要服务或加密文件，直到公司支付赎金。考虑到医疗行业对时间的高度敏感性，公司往往别无选择，支付赎金，并寄希望资金最终能追回。\n\
  \n![FIGURE 10.6 医疗健康泄露的核心原因。](img/fig10_6.jpg)\n\nFIGURE 10.6 医疗健康泄露的核心原因。\n\n###\
  \ 10.1.4 挑战\n\n为了提高 MIoT 生态系统的安全性，必须解决一些针对它的特定问题，因为这些问题可能会阻碍理想安全措施的发展。以下列表列出了 MIoT\
  \ 安全和隐私方面需要立即关注的主要问题。\n\n### 10.1.4.1 不安全网络\n\n大多数物联网（IoT）医疗设备主要依赖无线网络进行通信，如 `WI-FI`，因为它们方便、普及且廉价。然而，这些网络存在重大的安全漏洞，例如设备中默认安装的默认用户名和密码，以及弱的身份验证技术，这使得设备容易受到网络层攻击的影响，如中间人攻击、恶意软件攻击和\
  \ `WI-FI` 密码破解 [19,20]。IoT 医疗设备的尺寸、复杂程度和制造商各不相同。由于内部设计限制，大多数设备可能具有低速处理器、较小的内部内存和较短的存储容量。\n\
  \n由于大多数医疗 IoT 设备的资源有限，即使是基础的字典攻击也能轻易利用并攻破/破坏这些设备的访问控制，从而导致整个 MIoT 健康网络发生大规模泄露。因此，由于可用资源有限且设备制造商极其复杂，要开发出既能增强安全有效性又能最小化执行过程中资源消耗的安全解决方案是非常困难的\
  \ [5,19,20]。\n\n### 10.1.4.2 安全补丁与零日漏洞\n\n由于 MIoT 设备的固有广泛性和威胁演变的速度，零日漏洞极有可能被利用。这引发了人们对于在恶意攻击者尝试利用之前，提前对设备上的可能漏洞进行常规修复的疑问。相反，入侵者一直在寻找弱点或连接以进行利用。例如，最容易受到安全漏洞影响的是频繁出现在应用程序层的陈旧程序。同样，医疗系统和服务提供商很少为物理\
  \ MIoT 设备更新最新的固件，导致终端设备容易受到网络攻击的风险。因此，为了保持高可用性并避免零日攻击，医疗机构应定期更新 MIoT 应用和设备 [19]。\n\
  \n### 10.1.4.3 社会工程学\n\n由于社交媒体的巨大影响，患者（在此情况下）倾向于在 Facebook、Instagram 等网站上公开披露敏感数据。然而，网络犯罪分子将这些网站视为传播恶意软件的新途径。因此，用户应避免在电话中或这些网站上泄露个人信息\
  \ [19]。\n\n### 10.1.4.4 高移动性\n\nMIoT 中的许多设备通常是移动的。例如，如果患者佩戴着在线的心率监测器，它将向护理人员或云端传输信息。当用户在场时，它连接到工作网络；否则，它将连接到家庭网络。因此，开发一个考虑\
  \ IoT 高移动性的强大安全解决方案具有挑战性 [19,20]。\n\n## 10.2 讨论\n\n### 10.2.1 MIOT 中的网络攻击\n\n针对\
  \ MIoT 系统的网络攻击构成了重大风险，包括医疗服务的中断以及敏感数据的泄取。应对这些威胁对于维护医疗服务的完整性和安全至关重要。表 10.1 代表了各种类型的网络攻击及其影响。\n\
  \n### 10.2.1.1 窃听\n\n窃听攻击有两种：被动窃听和主动窃听 [4]。两者主要侧重于收集信息。这是攻击者发现的从传感器提取数据的简单方法之一。为了从硬件设备中有效收集数据，攻击者必须找到并拦截所需的硬件\
  \ [19]。例如，患者的生命体征可以在传输过程中被拦截。此类非法获得的信息可能被用于各种攻击。虽然加密可以解决这个问题，但并非总是可行，特别是在使用低功耗设备时（图\
  \ 10.7）。\n\n![FIGURE 10.7 MIOT 中的窃听攻击。](img/fig10_7.jpg)\n\nFIGURE 10.7 MIOT 中的窃听攻击。\n\
  \n### 10.2.1.2 使用反向工程的攻击\n\n通常，攻击者会从应用商店下载目标软件，并使用一系列工具在本地进行评估。反向社会工程学攻击也被称为对人的攻击\
  \ [4]。这使得攻击者能够通过伪装成修复医院医疗系统问题的的技术人员，获取系统访问权限并获取信息。此外，他可能利用它上传恶意软件或寻找安全漏洞。\n\n\n\n\
  \n### 10.2.1.3 伪装攻击\n\n伪装攻击试图通过伪装成网络身份或他人来获取对私有计算机数据的未经授权的访问。如果授权过程不够安全，它可能极易受到伪装攻击的影响\
  \ `[4]`。为了未经授权进入存储的机密健康数据，攻击者可以冒充成授权用户，并窃取用户终端设备（如智能手机）的登录凭据。黑客可以通过插入非法设备伪装成合法用户，以访问\
  \ `MIoT` 设备的服务；黑客也可以伪装成 `MIoT` 设备，为客户提供欺诈服务。第二种情况对医疗行业尤为危险，即 `MIoT` 设备为患者提供救命服务的场景。\n\
  \n**ZED 破坏攻击：** ZED Sabotage 攻击的开发人员针对 `ZigBee` 协议提出了一种新型危害方式，被称为`ZigBee 终端设备`攻击。此类攻击的主要目标是通过周期性信号唤醒\
  \ `ZED`，导致耗尽其电池，从而实施破坏 `[4]`。\n\n### 10.2.1.4 翻垃圾事件\n\n翻垃圾（Dumpster diving）是一种在垃圾中寻找个人信息和医疗记录的实践，这些信息随后可能被用于黑客攻击目的\
  \ `[4]`。这种攻击主要针对大型医疗机构或企业，主要通过发送看似来自可靠来源的虚假电子邮件来钓鱼受害者。在此类攻击期间恢复的任何医疗数据都包括员工姓名、处方药、患者记录以及丢在垃圾箱中的其他文档和文件。\n\
  \n### 10.2.1.5 流量分析攻击\n\n患者的隐私及其数据的机密性是此类攻击的主要目标。这是一个非常危险的攻击，通过拦截和分析网络流量模式来提取相关信息\
  \ `[19]`。这是因为 `MIoT` 设备的活动可能暴露足够的细节，让恶意对手能够蓄意损坏医疗设备 `[4]`。\n\n### 10.2.1.6 消息的修改与篡改\n\
  \n消息篡改攻击的基础是操纵客户端和服务器之间发送的参数，以更改应用数据，包括用户凭据和权限、价格和产品数量等 `[19]`。攻击者的意图是破坏传输消息的数据完整性。当黑客修改其收到的消息以实现自己的目标时，就会发生这种情况\
  \ `[4]`。因此，医疗专业人员可能会做出危及患者健康的不明智选择。\n\n### 10.2.1.7 使用恶意数据注入的攻击\n\n合法或具备系统身份验证能力的实体会发起此类攻击\
  \ `[4]`。因此，这会对 `MIoT` 系统产生危害影响，并可能通过向医院数据中心或临床医生发送虚假消息而导致悲剧性事故。这种攻击旨在向网络中注入虚假消息，以防止授权用户发送真实准确的消息\
  \ `[19]`。\n\n### 10.2.1.8 数据可用性攻击\n\n攻击者试图通过删除这些消息来干扰交换消息的数据可用性 `[4]`。当黑客为了个人利益操纵其收到的信号时，就会导致医院数据中心或医生失去有关患者健康状况的关键信息\
  \ `[21]`。\n\n### 10.2.1.9 拒绝服务 (DoS) 攻击\n\nDoS 攻击旨在破坏特定的医疗 IoMT 系统或设备，阻止护士和医生访问医疗数据信息，使患者无法获得必要的处方\
  \ `[19]`。服务的破坏和中断禁止了实时数据的传输和接收。DoS 攻击利用了应用程序接口 (`API`) 中的缺陷 `[4]`。\n\n### 10.2.1.10\
  \ 分布式拒绝服务 (DDoS) 攻击\n\n这些攻击可以从多个地点同时发起。当资源被大量请求淹没时，医疗系统的可用性可能会受到显著影响 `[21]`。\n\n\
  ### 10.2.1.11 跨站请求伪造攻击\n\n基于 RESTful `API` 的系统更容易受到此类攻击。终端用户被骗在不知情的情况下使用了存在漏洞的应用程序\
  \ `[19]`。如果 `IoT` Web 界面设置不当，就会受到攻击。\n\n### 10.2.1.12 预共享密钥攻击\n\n预共享密钥是此类攻击的基础，例如\
  \ `CoAP` 协议 `[4]`。偶尔，程序会使用这些硬编码的密钥。正因如此，如果攻击者设法获取库文件，就可以轻松获得访问。\n\n### 10.2.1.13\
  \ 中间人攻击\n\n这是最广泛的身份攻击之一；它在控制和监控双方通信的同时修改数据 `[19]`。这种攻击可以归类为被动或主动。被动攻击是指攻击者仅仅读取和拦截双方之间往返的消息\
  \ `[4]`。然而，如果攻击者能够在设备不知的情况下更改、操纵或添加发送的数据，则被认为是主动攻击。\n\n### 10.2.1.14 蓝牙攻击\n\n在这种攻击中，蓝牙设备容易受到多种攻击，其中严重的是蓝漏洞（bluebugging）`[4]`。攻击者可以利用旧设备固件的漏洞，在合法用户不知的情况下拦截通话、发送和接收消息并在设备上连接互联网。\n\
  \n### 10.2.1.15 彩虹表攻击\n\n这种攻击主要通过逆向工程和一种被称为“故障与尝试”的技术针对密码和哈希值 `[4]`。通常，是对密码和哈希值的表进行运行直到发现匹配项。然而，使用加盐（salt）密码可能是此类攻击的有效防御方法。\n\
  \n### 10.2.1.16 勒索软件攻击\n\n勒索软件没有得到足够的关注，这可能比传统的恶意软件危险得多。由于大多数 IoT 数据存储在云端而非单个设备上，传统的勒索软件模式根本不可行\
  \ `[4]`。IoT 勒索软件加密设备并向所有者索赎金以解锁设备 `[14,19]`。不幸的是，`MIoT` 设备是勒索软件频繁的目标。某些医疗设备（如起搏器和输液泵）被锁定，如果这些设备不能及时解锁，可能会导致灾难性的后果。\n\
  \n### 10.2.1.17 僵尸网络攻击\n\n\n\n\n\n这些攻击利用医疗物联网（MIoT）设备的漏洞，将其变成僵尸网络，通过命令与控制系统等待攻击者的指令，以发送虚假或不准确的患者数据。它们还可用于\
  \ DDoS 或 DoS 攻击，以攻痪整个医疗系统 [4]。事实上，许多此类攻击旨在泄露隐私信息，并将其用于非法目的或个人获利。\n\n### 10.2.1.18\
  \ 高级持续攻击\n\n高级持续威胁（APT）对许多企业构成了重大的安全风险。高级持续威胁是一种蓄意的网络攻击，黑客在获得对网络未经授权的访问后会长时间隐藏 [4]。攻击者使用高级持续威胁的目的是监控网络活动并窃取重要数据。要停止、识别或中和这类网络攻击极具挑战性。网络犯罪分子可能利用这些\
  \ MIoT 设备进入私网或业务网络。网络犯罪分子可以使用这种技术窃取隐私数据。\n\n#### 表 10.1 网络攻击类型及其影响及影响程度\n\n| 攻击类型\
  \ | 说明 | 影响 | 影响程度 |\n| --- | --- | --- | --- |\n| 窃听 [4] | 传感器是被动和主动窃听尝试的主要信息源。为了非法获取数据，他们拦截包括患者生命体征在内的硬件。即使对于低功耗设备，加密并非总是可行，但很有帮助。\
