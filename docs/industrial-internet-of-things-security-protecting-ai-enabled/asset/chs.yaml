  \n第一台批量生产的工业机器人手臂“Unimate”于 20 世纪 60 年代开始通用汽车的配线上工作，拿起热金属部件并将其放入冷却液；该公司展示了自那时起 AI\
  \ 在制造工艺应用中走了多远。尽管发那科在 AI 行业处于领先地位，但许多公司仍然无法在大范围内使用该技术。\n\n惊讶的是，在普华道 2018 年全球数字运营调查的\
  \ 1155 名制造业高管中，只有 9% 的人实际上使用过 AI 来增强运营决策。在研究其在制造业中的用途和优势之前，我们需要定义 AI，探索其潜力，并理解驱动其采用的动力。\n\
