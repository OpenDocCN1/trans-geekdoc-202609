  \ |\n| 专用 AI 芯片组 | 开发用于边缘计算应用的专用 AI 芯片组，提升性能。 |\n| 边缘到云编排 | 以协同的方式整合边缘和云端资源。 |\n\
  | 智能数据路由 | 根据需求在边缘和云端之间进行动态数据路由。 |\n\n与传输速率相关的挑战列在表 9.8 中。由于 6G 网络带来的低延迟通信也是 IIoT、AI\
  \ 和边缘应用的一项挑战。\n\nTABLE 9.8 IIoT、AI 和边缘应用的数据速率挑战\n\n| 6G 及未来的改进连接 || 描述 |\n| ---\
  \ | --- |\n| 超可靠低延迟通信 (URLLC) | 关注 6G 网络，为关键 IIoT 应用提供极低延迟和高可靠性。 |\n| 增强的数据速率 |\
  \ 6G 中更高的数据传输速度，以支持 IIoT 设备产生的指数级增长的数据。 |\n\n## 9.7 构建安全韧性工业未来的策略\n\n选择 IIoT 解决方案涉及对各个类别进行全面评估。在设备集成方面，评估其与新旧机器的兼容性至关重要，包括对多种协议的支持。分析能力（包括边缘分析和预测性分析）应被考虑到实时决策和早期故障检测。总成本的考虑包括开发时间、上市时间和价格结构，并重点关注即用解决方案和插件。安全方面涵盖了边缘级安全、数据安全和应用级安全，以确保连接安全和用户访问控制。行业地位的评估涉及评估\
  \ IIoT 解决方案提供者的成熟度、规模和合作伙伴生态系统，并通过第三方证书和客户证言等验证证明进行补充。这种全面的方法旨在解决选择稳健合适 IIoT 解决方案的关键因素，如表\
  \ 9.9 所示。\n\nTABLE 9.9 形成网络安全策略的 IIoT 考虑因素\n\n| 考虑因素类别 || 考虑点 |\n| --- | --- |\n\
  | **设备集成** || |\n\n\n\n\n\n*   **遗留系统**: 检查 IIoT 解决方案是否支持与旧机器或资产集成。\n*   **新机器**:\
  \ 确保与新机器的专有 SDK 和安全机制兼容。\n*   **协议支持**: 验证 IIoT 解决方案是否支持所需的队列消息和工业协议。\n\n### 分析\n\
  *   **边缘分析**: 评估 IIoT 解决方案是否能够在边缘侧进行实时处理，以实现低延迟决策。\n*   **预测性分析**: 评估解决方案提供预测性洞察的能力，以便及早故障。\n\
  *   **KPI 计算**: 检查 IIoT 解决方案是否提供开箱的 KPI 服务并允许对指标进行自定义。\n\n### 总拥有成本\n*   **开发时间**:\
  \ 考虑开箱即用功能和连接器的可用性，以便快速解决问题。\n*   **上市时间**: 评估市场中提供的现成解决方案和插件。\n*   **价格**: 检查不同的定价结构，包括按需付费、月度或年度订阅，并将维护和支持成本考虑在内。\n\
  \n### 安全\n*   **边缘级安全**: 确认 IIoT 解决方案是否为边缘分析提供安全的边缘连接。\n*   **数据安全**: 确保加密数据存储以及通过通信信道进行安全数据传输。\n\
  *   **应用级安全**: 验证解决方案是否支持安全的访问控制，以有效管理用户权限。\n\n### 行业地位\n*   **公司成熟度与规模**: 评估 IIoT\
  \ 解决方案提供者的行业地位、愿景和成熟度。\n*   **合作伙伴生态系统**: 考虑供应商合作伙伴生态系统的强度，以实现扩展和互操作性。\n*   **验证证明**:\
  \ 检查第三方验证、证书和客户证言，这些都是平台稳定性的性的指标。\n\n## 9.8 监管框架与伦理考量\n\n监管框架和伦理考量是技术进步和实施的关键要素，特别是在人工智能、数据隐私和物联网（IoT）等新兴领域。监管框架是政府或监管机构建立的指南和规则，旨在确保技术的负责任使用，防止对个人或社会产生风险。相反，伦理考量意味着对部署特定技术时涉及的道德影响和社会影响进行评估。\n\
  \n在 AI 领域，监管框架可能会解决透明度、问责、偏差缓解以及 AI 在决策过程中的负责任集成等问题。其中至关重要的是隐私法规，例如《通用数据保护条例》（GDPR），它规范了个人数据的收集、存储和处理。此外，AI\
  \ 中的伦理考量涵盖了与公平性、问责、透明度以及 AI 系统潜在社会经济影响相关的关注。\n\n在 IoT 领域，监管框架集中在数据保护、网络安全和互操作性标准等方面。IoT\
  \ 的伦理考量通常围绕着确保用户同意数据收集、保护用户隐私以及解决安全漏洞，以防止对连接设备的未经授权访问或误用。\n\n监管框架和伦理考量在塑造技术发展和部署的轨迹方面起着关键作用。它们提供了一种结构化的方法来保护个人权利并遵守法律标准。随着技术的演进，不断调整监管框架和伦理指南变得至关重要。\n\
  \n## 9.9 结论\n\n本章探讨了边缘计算、IIoT 和 AI 在改进决策方面的转型潜力，同时强调了安全等挑战。\n\n## 参考文献\n\n1.  M.\
