  \ 系统安全：现状综述与未来挑战”。IEEE Access 4 (2016): 1375–1384.\n29. Wu, Yulei, Hong-Ning Dai,\
  \ 和 Hao Wang. “工业 4.0 中安全可扩展 IIoT 关键基础设施的区块链与边缘计算融合”。IEEE Internet of Things Journal\
  \ 8.4 (2020): 2300–2317.\n30. Qiu, Tie, 等. “工业物联网中的边缘计算：架构、进展与挑战”。IEEE Communications\
  \ Surveys & Tutorials 22.4 (2020): 2462–2488.\n31. Hosen, ASM Sanwar, 等. “SPTM-EC：用于\
  \ IIoT 边缘计算的安全与隐私保护任务管理”。IEEE Transactions on Industrial Informatics 18.9 (2021):\
  \ 6330–6339.\n\n# 2 工业物联网安全架构与保护技术\n\nNeha Sharma 和 Pankaj Dhiman\n\nDOI: [10.1201/9781003466284-2](https://doi.org/10.1201/9781003466284-2)\n\
  \n## 2.1 引言\n\n物联网（IoT）包含了一个庞大且复杂的互联设备、机器和系统网络，所有设备都连接到互联网。这些设备经过专门设计，旨在通过自动化处理各种过程（包括但不限于调整照明、调节恒温器和确保入口点安全）来简化并增强日常任务。因此，它们带来了更高的效率、自动化性和无与伦比的便利性。\n\
  \n然而，物联网设备的安全漏洞源于它们在设计时往往仅采用了极少数的安全措施，从而使其暴露在广泛的潜在网络攻击之中。这些攻击从相对简单的未经授权访问设备，到更先进、复杂的能够控制整个网络的入侵不等。这些安全问题强调了实施稳健安全措施以保护物联网设备及其所属网络的重要性\
  \ [1,2]。\n\n由于工业网络架构的复杂且缺乏标准化，更新这些设备通常非常困难。许多物联网用户并没有意识到与其设备相关的安全风险，这些设备缺乏网络保护，且更容易受到网络攻击。\n\
  \n黑客可以利用 `Bashlite` 和 `Mirai` 等物联网设备中的安全漏洞，获取对敏感数据的未经授权访问权限，或完全控制设备。例如，他们可以使用这些设备发起\
  \ DDoS 攻击，从而瘫痪整个网络 [3,4]。用户必须了解这些风险并采取适当措施保护其设备和数据。为了保护物联网设备，用户应该遵循设备安全的最佳实践，例如启用双重身份验证、使用强密码并定期更新设备软件。使用安全网络并避免连接公共\
  \ Wi-Fi 热点也是关重要的 [5]。为了保护物联网设备和隐私数据，用户应该更改默认登录凭据、保持设备更新、限制数据共享并保护家庭网络。物联网设备的安全正成为一个日益关注的问题，专家建议采取某些措施来解决这些问题\
  \ [6,7]。这些包括更改默认密码、更新软件以及配置设备使用安全通信协议。\n\n最近的研究表明，工业物联网（IIoT）设备与任何设备一样，容易受到安全风险。这使得现有的\
  \ IIoT 面临安全泄露的风险，可能导致灾难性的后果。2014 年对某德国钢厂的攻击和 2015 年对乌克兰电力基础设施的攻击就是此类网络攻击的。。这些停电不仅影响了单一公司，还影响了客户、供应商甚至整个国家的关键基础设施\
  \ [8]。保护 IIoT 系统对于确保工业 4.0 的顺利运行至关重要。然而，在工业环境中实施安全措施可能面临挑战，因为工业设备的寿命比消费类设备长，并且需要后续的安全措施来确保其持续安全\
  \ [9,10]。此外，IIoT 网络的范围通常大于消费级物联网部署，使得部署安全的网络架构具有挑战性 [11]。IIoT 设备互连性不断增加的动态使得安全变得更具挑战性。\n\
  \n在工业 4.0 环境中部署 IIoT 设备时，全面了解消费物联网当前的安全缺陷至关重要。这种理解有助于解决已知的安全漏洞并开发适当的安全措施。然而，由于用途、部署以及独特的安全和隐私关注点的不同，消费物联网中使用的所有安全技术并不适用于工业领域\
  \ [12,13]。因此，有必要进行专门评估以识别 IIoT 和工业 4.0 中的安全问题和目标，并针对 IIoT 的特定特性开发安全技术。\n\n研究重点是开发\
  \ IIoT 系统面临的安全挑战，包括漏洞、风险和威胁。已经制定了一系列合适的应对措施，以解决 IIoT 实施带来的挑战，包括组件的长期寿命和对连接日益增长的需求\
  \ [14]。这些措施经过精心设计和专业开发，以确保 IIoT 在各种工业环境中的顺利高效部署。这些措施旨在确保 IIoT 系统从长期来看是安全、可靠且可持续的。这项工作将之前研究的安全技术整合了一份完整的\
  \ IIoT 安全综述。我们的研究旨在阐明 IIoT 系统的安全漏洞、风险和威胁。它有三个主要贡献：\n\n\n\n\n\n1. 我们研究了消费级物联网（IoT），并发现了工业级物联网（IIoT）的安全演变。这项研究帮助弥合了消费级\
  \ IoT 与 IIoT 系统之间的差距，并对 IIoT 特有的安全挑战提供了全面的视角。\n\n2. 我们识别了 IIoT 面临的安全挑战，这些挑战很大程度上受到安全和生产需求的驱动。我们的研究为\
  \ IIoT 面临的独特安全关注点提供了见解，并为开发符合这些关键目标的安全措施奠定了基础。\n\n3. 我们审查了改进 IIoT 安全性的现有研究和最佳实践，并分析了它们在\
  \ IIoT 环境中的适用性，评估了它们的安全益处。这项分析有助于识别应对 IIoT 独特安全挑战的最有效安全技术和最佳实践。\n\n本章分为若干节。第 2.2\
  \ 节提供了与消费级 IoT 相关的安全问题摘要。第 2.3 节突出了消费级 IoT 与 IIoT 安全相关问题之间的差异。第 2.4 节识别了 IIoT 面临的独特目标和挑战。第\
  \ 2.5 节介绍了关于保护 IIoT 的全面调查。此外，第 2.6 节](#chapter02.xhtml#h2_6)讨论了相关工作并对文章进行了总结。总体而言，这项研究为\
  \ IIoT 面临的独特安全挑战提供了宝贵的见解，并为开发定制的安全措施奠定了基础。\n\n## 2.2 物联网安全威胁\n\n针对 IoT 安全的研究已根据\
  \ IoT 架构识别了潜在威胁。研究人员对每一层提出的适当的防御建议。我们汇总了关于 IoT 安全攻击及应对措施的类似研究，并评估了它们对 IIoT 安全的影响。\n\
  \n### 2.2.1 攻击\n\nIoT 可能会受到三类攻击：感知层、网络层和应用层。图 2.1 展示了不同层以及每个层级的常见攻击。感知层连接了物理环境和\
  \ IoT 设备。对 IoT 硬件组件的物理攻击可能会破坏它们 [[15]]。网络层将 IoT 设备连接到互联网并可能成为目标。应用层是 IoT 应用程序的基础，但修改可能会引入漏洞。\n\
  \n![图 2.1 IoT 基准层包括攻击类型和防御。](img/fig2_1.jpg)\n\n图 2.1 IoT 基准层包括攻击类型和防御。\n\n拒绝服务（DoS）攻击可能发生在不同层。在感知层，它们通过过载其\
  \ CPU 来影响单个 IoT 设备。在网络层，它们会临时断开设备连接。由于可用性问题，许多依赖此项服务的工业过程在应用层受到负面影响。结论是，IoT 漏洞存在于每一层，应对这些挑战需要适当的安全措施（图\
  \ 2.2）。\n\n![图 2.2 IIoT（右）和消费级 IoT（左）的架构。对于大多数消费者而言，IoT 由使用云计算处理数据的各种设备组成。相反，对于\
  \ IIoT，云服务被添加到本地数据处理中，以增强工作流并提供新服务。](img/fig2_2.jpg)\n\n图 2.2 IIoT（右）和消费级 IoT（左）的架构。对于大多数消费者而言，IoT\
  \ 由使用云计算处理数据的各种设备组成。相反，对于 IIoT，云服务被添加到本地数据处理中，以增强工作流并提供新服务。\n\n### 2.2.2 计划\n\n\
  由于 IoT 系统极易恶意攻击和数据泄露的影响，必须实施各种应对措施来应对这些挑战。针对 IoT 安全协议分类已有多种分类法。IoT 安全协议根据密钥管理、用户/设备认证、访问控制和隐私保护进行分类。密钥管理确保了\
  \ IoT 系统中的安全通信和身份验证。然而，IoT 部署的异构性和扩展性增加了这一过程的复杂性 [16–18]]。与对称方案相比，公钥技术是一种可行选择，尽管它们可能需要更多的处理资源。公钥技术在设备之间创建安全的通信信道，这对于维护系统安全至关重要。\n\
  \n1. 认证对于证明用户和设备的身份是必须的。可以利用多种因素进行认证，例如设备的指纹。认证是防止未经授权的系统访问并确保只有授权用户才能访问数据的基础 [19]]。\n\
  \n2. 授权和访问控制对于限制用户和设备对必要资源和服务的访问至关重要 [20]]。可以使用访问控制列表（ACLs）来定义每个用户或设备可以访问的资源及其访问级别。\n\
  \n3. 隐私保护对于保护敏感的个人信息（如医疗记录）免受未经授权的访问是基础 [21]]。除了数据和通信加密外，安全多方计算保护了数据隐私。安全多方计算允许在不泄露敏感信息的情况下处理数据，确保隐私性和机密性\
  \ [22,23]]。\n\n### 2.2.3 考虑\n\n根据现有数据，虽然设备安全已得到充分研究，并实施了识别和减轻威胁的措施，但消费者和 IIoT 面临的安全挑战尚未被充分理解或解决\
  \ [24]]。关注个人需求的消费级 IoT 安全关注点与关注工业应用的 IIoT 安全关注点不同。开发者可以使用针对消费级 IoT 开发工具和方法，但必须考虑\
  \ IIoT 的独特安全需求。消费者和 IIoT 的使用和部署差异巨大，这影响了 IIoT 所需的安全关注点。\n\nIIoT 设备收集并传输财务数据、个人信息和知识产权等隐私数据。此外，这些设备通常安装在工厂和电厂等严苛环境中，容易受到物理攻击\
  \ [25,26]]。因此，理解 IIoT 安全和必要的保护机制至关重要。在报告的第 2.5 节中，我们将对确保 IIoT 设备安全的保护机制进行详细讨论。\n\
  \n## 2.3 从消费级 IoT 到 IIoT\n\n### 2.3.1 消费级 IoT 与 IIoT 的共同特征\n\nIoT 是一项连接物理设备和传感器与人类通信的技术。它包含两个部分：消费级\
  \ IoT 和 IIoT。消费级 IoT 旨在帮助人们完成日常任务，例如控制家电和监控个人健康。消费级 IoT 设备通常成本较低且易于使用。它们包括智能音箱、健身追踪器和家庭自动化系统\
  \ [27]]。\n\n\n\n\n工业物联网（IIoT）涉及涉及制造业、能源和运输等多个行业的安全及关键任务管理。IIoT 设备负责监控和控制物理过程及设备，例如管道、涡轮和车辆\
  \ [28]。IIoT 设备使用 `OT` 和 `IT` 创建用于监控和控制的 `M2M` 连接。消费级物联网和 IIoT 都受益于硬件和软件成本的降低，这导致了连接设备数量的增加。工业物联网设备通常昂贵且专业，但寿命可达\
  \ 30 年。相比之下，消费级设备通常只能使用 3 到 5 年。因此，IIoT 需要可扩展、可调节和改造的安全解决方案来保护敏感数据。安全解决方案必须适应不断变化的威胁，并符合行业标准和法规\
  \ [29,30]]。安全解决方案还必须与现有的 `IT` 基础设施集成，并提供实时监控，并在表 2.1 中进行描述。\n\n#### 表 2.1 (#chapter02.xhtml#b02tbl2_1)\
  \ 消费级 vs 工业物联网\n\n| 类别 | 特性 | 消费级物联网 | 工业物联网 |\n| --- | --- | --- | --- |\n| 应用\
  \ | 服务模型<br>关键性 | 以人为中心<br>不严苛 | 以机器为中心，任务关键型 |\n| 设备 | 每个家庭/工厂在寿命周期内的设备数量<br>硬件复杂度\
  \ | 低到中等<br>3 到 5 年<br>低 | 中到高<br>10 到 30 年<br>低到中等 |\n| 数据流量 | 数据量<br>数据机密性<br>流量类型<br>（无线）的使用\
  \ | 中等<br>以隐私为导向<br>周期性和事件驱动<br>非结构化，基于内容 | 高<br>以业务为导向<br>周期性<br>结构化，计划性 |\n\n\
  这两个领域产生大量数据，但 IIoT 主要侧重于感知、监控和控制任务，导致定期且确定性的数据流。这使得建立网络控制和检测入侵变得更加容易 [31]]。为了保持最高标准的专业和责任，工业部门必须采取一切必要措施来维护公司机密并保护高价值客户的敏感数据。同样，用户隐私保护在消费领域至关重要，必须以极其谨慎和勤勉的态度对待\
  \ [32]]。\n\n总之，虽然消费级物联网和 IIoT 有许多相似之处，但它们满足不同的需求和要求。因此，实施适当的安全措施以保护敏感数据并确保这些技术的顺畅运行至关重要。\n\
  \n### 2.3.2 总结\n\n物联网是一个巨大的设备网络，涵盖从消费级到工业设备。虽然消费级物联网设备和 IIoT 设备在某些技术上具有相似性，但在用途和实现方面存在显著差异。\n\
  \n一个关键区别是应用的关键性。IIoT 设备用于制造、运输、医疗和能源生产等关键应用，在这些领域中，故障或安全漏洞可能导致严重后果 [33]]。相比之下，消费级物联网设备用于家庭自动化、娱乐和健身追踪等非关键应用\
  \ [34]]。\n\n另一个关键区别是设备的预估寿命。IIoT 设备的设计寿命可达数年甚至十年，并且通常被集成到昂贵且复杂的系统中。相比之下，消费级物联网设备的寿命短得多，通常在几年后就会更换\
  \ [35]]。\n\n数据流量的周期性和确定性也是消费级设备和 IIoT 设备之间的重要区别。IIoT 设备需要更高水平的确定性，这意味着数据流量的周期必须保持一致\
  \ [36]]。相比之下，消费级物联网设备可以容忍数据流量周期性的某种波动。\n\n由于这些差异，IIoT 设备比消费级物联网设备更复杂且更具安全挑战。虽然消费级物联网设备的安全方法主要关注个体安全，但对于\
  \ IIoT 设备来说是不够的。IIoT 设备的安全必须考虑设备的互连性、其所服务应用的关键性以及其生成数据的可靠性 [37,38]]。\n\n因此，必须对 IIoT\
  \ 设备的安全措施进行完全重新评估。2.4 节 将深入探讨由这些差异引起的安全目标和挑战。\n\n## 2.4 IIoT 安全目标与挑战\n\nIIoT 现在已成为多个行业不可或的一部分，包括制造、医疗和运输。然而，随着连接性的增强，网络攻击风险也随之增加，这可能导致巨大的财务损失、索赔并威胁人员安全。为了确保\
  \ IIoT 的安全和生产力，识别潜在攻击者并建立优先考虑可用性和完整性的独特安全目标至关重要。保护 `IT` 基础设施免受数据窃取和工业间谍活动日益日益本质。在工业环境中实施\
  \ IIoT 安全目标面临巨大挑战，但必须予以防止入侵和破坏 [39,40]]。\n\n### 2.4.1 攻击者类型\n\n准确的攻击者模型对于保护 IIoT\
  \ 系统不受网络攻击是必要的。它们模拟了网络罪犯如何破坏安全，并帮助专家理解潜在风险 [41]]。这有助于组织符合法规标准，并制定有效的应对措施。与其他领域不同，IIoT\
  \ 需要一种真实且韧性的攻击者模型来考虑不受限制的攻击行为。Dolev-Yao 模型是一种用于分析计算机网络安全的理论构造 [42]]。它基于攻击者可以拦截 IIoT\
  \ 网络中所有通信。这意味着攻击者可以监听两个设备之间的任何消息，并在到达目标接收者之前更改其内容 [43]]。Dolev-Yao 模型常用于研究加密协议的安全，是设计和评估安全通信系统的重要工具。因此，该模型允许被动主动攻击。但注意的是，该模型假设攻击者无法破解\
  \ IIoT 安全中使用的加密技术 [44]]。\n\n此外，区分 IIoT 安全中的内部和外部攻击者至关重要。内部攻击者比外部攻击者更具能力，因为他们可以访问\
  \ IIoT 设备，这使他们能够发起更复杂的攻击 [45,46]]。另一方面，外部攻击者只能通过网络攻击 IIoT 设备。因此，需要一个健壮的攻击者模型，能够考虑到内部和外部攻击者，并帮助识别和缓解\
  \ IIoT 系统中的安全风险。\n\n### 2.4.2 挑战\n\nIIoT 是用于工业环境中执行特定功能的互连设备网络。确保 IIoT 设备的安全是一项复杂的任务，与确保消费级物联网设备有显著不同。有关\
  \ IIoT 设备的安全必须考虑多个因素 [47]]。\n\n\n\n\n工业物联网（IIoT）设备安全面临的主要挑战之一是组件的长期寿命。由于为工业设计的 IoT\
  \ 设备寿命比消费级设备长，因此在开发它们时，考虑应用和通信安全至关重要。部署后，还需要定期进行软件更新以维护安全性。然而，当先前部署的设备缺乏安全防护且升级过程复杂时，确保安全性可能具有挑战性。IIoT\
  \ 连接性的增强增加了安全风险，特别是当老旧的孤立组件连接到网络时`[48,49]`。\n\nIIoT 设备安全的另一个挑战是需要部署、配置和管理的资源受限设备数量不断增加。由于设备数量巨大，需要可扩展、自主的系统来运行、创建和配置安全措施`[50]`。这些系统必须设计用于管理许多设备的安全，这可能是一个重大的挑战。\n\
  \nIIoT 的主要优势是 IT（信息技术）、OT（运营技术）与互联网之间的关键通信，这使得工业生产更加高效且更具适应性。然而，根据功能划分和隔离设备变得越来越具有挑战性，限制了未经授权的访问。NIST\
  \ 建议的网络分可以保护工业控制系统（ICS）。它可以限制攻击造成的损害并防止未经授权的访问。在 IIoT 安全中考虑这种方法`[51]`。IIoT 收集大量数据，包括客户信息和公司秘密，这些数据必须保护不受未经授权的访问。在允许授权的\
  \ IIoT 服务访问处理和分析的同时，维护数据机密性是一项基本挑战`[52]`。\n\n上述问题强调了 IIoT 需要创新且定制化的安全技术。传统的消费级 IoT\
  \ 设备技术不适用于工业领域广泛的用途和部署。因此，在第 2.5 节中，我们提供了 IIoT 的安全方法并评估了它们在解决上述问题方面的有效性`[53]`。这些方法包括加密、身份验证、访问控制和入侵检测。实施多层安全方法对于保护\
  \ IIoT 设备免受各种威胁至关重要。\n\n## 2.5 IIoT 安全\n\n我们研究了 IIoT 的安全方案，以应对其重大的安全挑战并实现整体安全目标。我们的研究重点是技术如何工作。消费级\
  \ IoT 安全技术的原始开发导致了它们被应用于工业背景`[54]`。为了便于理解，我们根据与本节结构相对应的广义安全措施，对各种安全技术进行了仔细分类。我们更进了一步，在表\
  \ 2.2 中对每种策略的重大贡献提供了全面总结，并对我们的讨论进行了详细概述。为了帮助评估每种策略在解决第 2.4 节中概述挑战方面的有效性，我们根据其考虑程度对每种策略进行了评分，范围从未考虑到部分考虑再到完全考虑。此此，我们希望提供一份详尽且有价值的资源。\n\
  \n表 2.2 IIoT 安全比较\n\n| 安全措施 | 长寿命组件 | 大量设备 | 高连接性 | 关键流程 | 数据机密性 |\n| :--- | :---\
  \ | :--- | :--- | :--- | :--- |\n| 定制的加密和身份验证 | | | | | |\n| 补丁管理 | | | | | |\n\
  | 服务隔离和访问控制 | | | | | |\n| 网络监控和入侵检测 | | | | | |\n| 意识培训与评估 | | | | | |\n\n### 2.5.1\
  \ 定制化加密与身份验证\n\n加密对于 IIoT 的数据机密性和身份验证至关重要。资源受限的 IIoT 设备需要轻量级加密。然而，对称加密在密钥管理方面存在挑战，并会导致关键程序的延迟，这可能会抑制工业运营商使用加密`[55]`。\n\
  \n为了解决 IIoT 的安全问题，需要采用针对 IIoT 定制的加密和身份验证。提出的技术用于在工业环境中实现轻量级身份验证和加密，同时最小化延迟`[56]`。其中一种系统正如`[44]`的支持者所述，假设\
  \ IoT 通信主要与静态伙伴进行。因此，对称加密和身份验证可以使用自动化加密和数据身份验证模板部分预计算。对于资源受限设备，建议使用仅依赖哈希和异或（XOR）操作的身份验证技术来提供轻量级身份验证`[57]`。这些技术的优点计算高效且内存需求小。然而，这些技术要求设备配备安全元件，这对于旧设备可能并不可行`[58]`。\n\
  \n随着 IIoT 数据交换和云服务使用的增加，保护数据不受未经授权的访问至关重要。某些方法仅保护外部实体（如云服务）之间的通信`[59,60]`。其中一种系统`[61]`建立在`[62]`的基础上之上，并减少了约\
  \ 30% 的计算开销。\n\n### 2.5.2 补丁管理\n\n\n\n\n许多制造商日益关注物联网（IoT）设备的安全性和隐私问题，因为大多数设备未能提供安全更新，或者需要耗费大量的人工工作来安装补丁。这导致客户面临黑客可以利用的已知漏洞，凸显了及时对所有部署的\
  \ IoT 设备进行修复以确保工业物联网（IIoT）系统安全运行的重要性 [64,65]。这不仅缓解了漏洞，还降低了攻击风险。\n\n为了加强 IIoT 系统的安全性，企业必须改进其内部及时修复漏洞的方法，而制造商必须在设备的整个生命周期内定期发布安全补丁。这对于部署在工业环境中的设备尤为重要，因为它们可能无法易于进行手动更新\
  \ [66]。\n\n必须记住，工业系统的补丁过程通常在安装前需要漫长的测试阶段，以确保与现有配置的兼容性 [67]。NIST 建议进行回归测试以实现更安全、更高效的补丁管理。\n\
  \nIETF 提出了一种用于 IoT 设备自动固件更新的机制。该机制包括对涉及的实体、安全威胁、假设以及更新后的设备固件的安全端到端通信的标准化描述 [68]。这使得\
  \ IoT 设备易于适配，操作人员可以仅部署符合标准的设备。通过这种方式，所提的机制有助于提高 IoT 设备和网络的效率、安全性和安全性，使其更加可靠和易用。\n\
  \n目前有两种方法可以检测 IIoT 中的安全问题：检查空闲设备以及使用 IIoT 网络图分析漏洞。这些方法对于安全型和任务关键型活动具有重要价值，并可以作为检测当前安全问题及其对其他系统影响的良好起点\
  \ [69]。可以设计可行的解决方案，例如隔离受影响的设备以防止进一步损坏。\n\n### 2.5.3 入侵检测与网络监控\n\n实施入侵检测机制对于识别和防止可能导致重大损害的恶意行为已变得至关重要。然而，由于工业领域的主导性，在工业领域部署传统的\
  \ IT 网络入侵检测系统（IDSSs）面临挑战。\n\n为了加强 IIoT 系统的安全性，企业必须改进其内部及时修复漏洞的方法，而制造商必须在设备的整个生命周期内定期发布安全补丁。这对于部署在工业环境中的设备尤为重要，因为它们可能无法易于进行手动更新\
