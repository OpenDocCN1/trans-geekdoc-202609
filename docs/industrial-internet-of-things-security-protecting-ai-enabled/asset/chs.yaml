  \ 编程、机器人。 |\n\n这绝不是详尽的；然而，已有的信息足以形成初步概况，并作为进一步讨论的起点。\n\n图 9.2 显示了 AI 能力在工业组织中的现有应用。尽管该技术已存在于公司的所有主要领域，但\
