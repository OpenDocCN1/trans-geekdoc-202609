  \ 和边缘计算的应用。**\n\n## 9.2 人工智能在工业物联网中的作用\n\n《基于 AI 的物联网制造与工业工程系统》一文解释了工业工程和制造环境如何利用机器学习、认知计算和深度学习等\
  \ AI 方法来筛选 IoT 设备产生的海量数据。\n\n人工智能（AI）的作用正在迅速扩大。在 AI 的帮助下，我们的日常生活和工作将得到改善。工业工程师在使用\
  \ AI 简化流程方面可能获益匪浅。AI 的意义及其对工业工程师的潜在应用是这篇博客文章的主题。我们还将讨论 AI 如何以各种方式改进工程。\n\n通过广泛的文献检索，发现了几篇关于涉及制造中\
  \ AI 的论文。为了说明这一点，Slautterback 在白宫生产力计算机会议上发表的一篇论文概述了 2000 年的工业环境。根据这一描述，预计制造业在未来\
  \ 15 年内经历将比过去 75 年更大的变化，这主要归于过去 10 年产生的计算机辅助技术工具。\n\n用于生成式过程规划的软件、通过自动化实现的计算机辅助制造、质量质量控制软件生产调度、机器人/物料处理、计算机数值控制。\n\
  \n根据报告，AI 是连接所有这些技术的。以下是 Gevarter 列出的许多通用 AI 应用，它们都与制造有某种联系。\n\n故障排除和修复机器系统故障、运行复杂的系统和机械、管理（时间表、任务和报告）、设计（结构、工具、IDS\
  \ 和新想法）、基于视觉线索感知和引导（筛选、识别、验证、引导和监控）、科学技术（包括 AI 驱动的设计工具、化学和生物合成规划）、工业（包括限于计算机辅助检测、智能机器人、过程规划、智能机械和制造设施的物流管理）。[表\
