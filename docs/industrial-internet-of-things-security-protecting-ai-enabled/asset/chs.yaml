  \n# 6 工业物联网轻量级安全密钥认证方案\n\nM. Anoop, Ismail Keshta, Vrince Vimal, Mukesh Soni, and\
  \ Navruzbek Shavkatov\n\nDOI: `10.1201/9781003466284-6`\n\n## 6.1 引言\n\n近年来，基于组密钥协议的工业物联网\
  \ (IIoT) 技术 [1] 已广泛应用于制造业和金融等行业。其中，工业实体在生产、运输和使用过程中产生大量与物联网设备密切相关的数据。因此，构建一种轻量级、高效且高扩展性的安全组密钥认证方案，以确保不同实体之间通信的安全性，已成为学术界和工业界关注的热点。\n\
  \n\n\n\n\n自密钥协商的概念由作者 \\[2]首次提出以来，密钥协商的研究在学术界和工业界均蓬勃发展 \\[3\\]。作为密钥协商的一种特殊形式 \\\
  [4\\]，组密钥协商协议涉及组成员在通信过程中协商组 \\[5\\]会话密钥，以确保组成员之间安全高效的通信。然而，文献 \\[6\\]提出的密钥协商方案只能为双方生成密钥，且无法验证会话密钥持有者的身份信息。在面对中间人攻击时，该协议的安全性无法保障。因此，作者\
  \ \\[7\\]利用对称不完全块设计的设计，提出了一种基于块设计的组密钥协商算法，在某种程度上解决了组密钥协商面临的安全性薄弱和通信效率下的问题。为了进一步减少组密钥协商协议的通信开销，本文引入了不完全块设计的数学结构，并提出了一种结构化的组密钥协商模型，使参与成员的数量更加灵活，协议也更具扩展性。\n\
  \n1946 年，作者 \\[8]首次提出了配对操作的概念，通过将两个加法群元素映射到一个乘法群实现了同态隐藏，这在密码学领域被广泛应用。然而，执行在线配对操作消耗大量的计算资源，会在一定程度上影响用户体验。特别是当通信过程中存在大量低计算能力的传感器和执行器时，基于配对的协议并非最佳选择。因此，为了解决工业物联网（IIoT）中通信设备计算能力低和计算开销高的问题，本文提出了一种基于椭圆曲线\
  \ Qu-Vanstone (ECQV) 的认证协议 \\[9\\]，该协议不需要配对操作，从而有效解决了 IIoT 中低功耗设备计算开销高的问题。综之，本章提出的协议创新点如下：\n\
  \n- 为了减少计算开销，本文使用 ECQV 认证协议以避免执行配对操作。实验结果表明，该方案在计算开销方面具有显著优势，其计算复杂度为 $On\\sqrt{n}~m$，其中`n`是参与成员的数量（包括成员和志愿者），`m`代表有限域\
  \ `G`[`q`]`(`m*) 的扩展范围。\n\n- 为了增强协议的安全性，利用椭圆曲线判定 Diffie–Hellman（ECDDH）假设证明了所提协议的安全性。安全性分析表明，所有成员对组会话密钥的贡献相等，确保了\
  \ IIoT 中数据共享的安全性。\n\n- 为了减少协议的通信开销并提高其扩展性，本文利用非对称不完全块设计扩展了现有的组密钥协商协议。支持的成员数量从`q²`扩展到`q² + q + 1`。具体而言，本文构建了一种重构的非对称块设计结构，并将将非对称块应用于组密钥协商。通过这种非对称块设计，支持的成员总数扩展到了`q² + q + 1`，其中`q`是一个质数。\n\
  \n本章其余部分的安排如下：第 6.2 节 描述文献综述；第 6.3 节 包含基础概念和组动态；第 6.4 节 介绍了威胁和系统架构；第 6.5 节 详细说明了组织数据传输细节；第\
  \ 6.6 节 展示了如何建立协商；第 6.7 节 对协议安全性提供了形式化分析；第 6.8 节 提供了基于证据性能评估；第 6.9 节 给出了结果、意义和未来研究。\n\
  \n## 6.2 相关工作\n\n传统的组密钥协商。在 IIoT 环境中，随着在线协作需求的增加和共享平台的扩展，传统的二或三方密钥协商方案已无法满足实际需求，迫切需要提出新的密钥协商方案。作者\
  \ \\[10]首次设计了一种支持密钥协商的环形交互模型，并将协商者数量扩展到多方。然而，该协议只能抵抗被动攻击。作者 \\[11]提出了一种启发式安全性证明和一种基于二叉树的组密钥协商机制，以适应组用户不断变化的需求。之后，作者\
  \ \\[12]了一种基于三元树的组密钥协商技术。遗憾的是，即使在扩展了二叉树方案后，仍然无法确认成员的身份。作者 \\[13]提出了一种未认证的组密钥协商机制。该协议能够抵抗外部节点发起的欺骗攻击，并只需两轮通信即可完成跨组的信息交换。一个负面方面是，它无法处理恶意的内部攻击。\n\
  \n基于密码的组密钥协商系统由作者 \\[14]提出作为该问题的解决方案。尽管该协议可以验证用户身份，但通信轮数与参与成员数量之间存在线性关系。这种组密钥协商技术由作者\
  \ \\[15]于 2023 年发明，仅需一轮。\n\n通过该协议，用户无法否认其发送的消息，但当用户数量为`n`时，通信开销达到了  *O*(`n²`)。\n\
  \n\n\n\n\n轻量级安全密钥认证方案基于组合结构。为了进一步确保组数据共享的安全性，研究人员设计了一种高度轻量级的安全密钥认证方案协议。作者 \\[16\\\
  ]利用 `Latin squares` 的组合结构构建了基于 `Latin squares` 的组密钥协商协议。该方案将组合结构引入组密钥协商中，在某种程度上减少了通信开销。然而，由于通信轮数过高，导致通信效率较低。因此，作者\
  \ \\[17\\]通过引入 `block designs` 的数学结构提出了一种基于身份的密钥协商协议，以实现组密钥协商的实体认证。但该协议最多支持七个成员之间的通信，缺乏灵活性。随后，作者\
  \ \\[7\\]优化了 `block designs` 的数据结构，并提出了一种基于 `block designs` 的组密钥协商协议，其在包含志愿者的情况下支持最多\
  \ `n` 个成员之间的通信，并将通信开销压缩到 $~On\\sqrt{n}$。然而，由于该协议引入了 `Weil pairing` 操作，导致了过高的计算开销。\n\
  \n基于非配对操作技术的组密钥协商。作者 \\[18\\]为车载网络中的实时无线数据传输创建了一种车辆认证密钥协商方法。在长期密钥不泄露的情况下，该方法还能防止会话密钥受短期密钥泄露的影响。然而，当车辆和云服务器数量分别为\
  \ `n` 和 `m` 时，通信开销达到 `O(n*m)`。在 2022 年，作者 \\[19\\]提出了一种不需要配对的公钥组密钥协商协议，显著减少了配对操作带来的计算开销。然而，由于该协议使用广播通信，也增加了通信开销。\n\
  \n总结来说，现组密钥协商技术主要存在以下缺点：\n\n- 尽管传统的结构化组密钥协商可以将协议从两方或三方扩展到多方，但面临安全性低和通信轮数高的挑战。\n\
  - 尽管基于组合结构的组密钥协商可以有效减少通信轮数，但会产生高计算和通信开销，且扩展性较差。\n- 尽管基于非配对操作技术的组密钥协商计算开销较低，但面临通信开销大的问题。\n\
  \n## 6.3 背景知识\n\n本章首先介绍安全假设和涉及的加密操作；然后介绍 `ECQV` 轻量级安全密钥认证方案；最后对 `block designs`\
  \ 给出详细介绍。本文涉及的参数及其具体含义列于表 6.1 中。\n\n### 表 6.1 符号\n\n| 参数 | 含义 |\n| --- | --- |\n\
