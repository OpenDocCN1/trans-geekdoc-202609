  \ [69]。可以设计可行的解决方案，例如隔离受影响的设备以防止进一步损坏。\n\n### 2.5.3 入侵检测与网络监控\n\n实施入侵检测机制对于识别和防止可能导致重大损害的恶意行为已变得至关重要。然而，由于工业领域的主导性，在工业领域部署传统的\
  \ IT 网络入侵检测系统（IDSSs）面临挑战。\n\n（后续段落翻译遵循相同逻辑...）\n\n\n\n\n工业物联网（IIoT）的安全性是一个不断发展的研究领域，旨在研究工业过程对安全的影响。该领域涵盖了\
  \ IIoT 中安全（safety）与防护（security）之间的关系，这在在许多研究论文中得到了广泛探讨，例如 [81–82]。它认为，确保工业过程的安全需要实施充分的安全措施。然而，在某些情况下，安全措施可能会与安全措施相冲突。因此，正如论文建议的，必须从设计到维护的传统产品生命周期来识别\
  \ IIoT 的安全挑战 [83–84]。\n\n该方法强调了在产品生命周期的每个阶段评估困难和应对措施的重要性，以确保工业过程中获得最佳的安全性和防护。\n\n\
  ## 2.7 结论\n\nIIoT 安全至关重要，需要多样化的应对措施来防御潜在威胁。资源受限的设备和工业过程需要定制化的安全协议，而访问限制和监控等网络层安全技术对于维护安全环境至关重要。此外，通过员工意识和定期培训来应对内部威胁对于\
  \ IIoT 的安全也是必要的。\n\n在开发 IIoT 的同时，探索增强标准安全措施的新型技术是必要的。分布式账本技术和区块链能够在各种环境中实现去中心化的问责。智能合约是区块链的一种很有前景的应用，可用于工业环境中的访问控制。在考虑新代设备使用这些技术时，也需要考虑带有旧硬件的现有长期运行设备。\n\
  \n本关于 IIoT 安全的研究结构如下：第 2.2 节 总结了消费级 IoT 安全问题及应对措施。第 2.3 节 将消费级安全与 IIoT 安全 了对比，并在\
  \ 第 2.4 节 中强调了 IIoT 的安全目标和挑战。第 2.5 节 提供了关于如何保护 IIoT 的全面调查，而 第 2.6 节 讨论了相关研究。本章在\
  \ 第 2.7 节 结束。消费级 IoT 设备的设备和隐私问题在近年来得到了广泛研究，一种常用方法是根据 IoT 的体系层识别威胁，并对每一层实施适当的防御。这种方法也被用于关于\
  \ IoT 安全的攻击与应对措施的类似研究，并评估了它们对 IIoT 安全的影响。\n\n总之，本章探讨了在向工业 4.0 转型期间确保 IIoT 安全的方法。IIoT\
  \ 的安全挑战和目标与消费级 IoT 不同。为了应对这些挑战，需要各种应对措施，例如为资源受限的设备和关键工业过程定制安全协议，并实施如访问限制和监控等网络层安全技术。通过员工意识和定期培训来应对内部威胁也是至关重要的。\n\
  \n由于 IIoT 和工业 4.0 仍然处于较新阶段，需要更多研究在开发 IIoT 的同时增强标准安全措施。实现这一目标的方法是探索分布式账本技术和区块链（如智能合约），它们可以在各种情况下提供不可篡改的去中心化问责。然而，将这些技术用于新代设备时，也必须考虑当前长期运行设施的旧硬件。\n\
