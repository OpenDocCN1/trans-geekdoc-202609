  underset{\\begin{matrix} {1 \\\\leqslant F\\_{j}} \\\\\\\\ {1 \\\\leqslant i,j \\\
  \\leqslant q\\_{ih}^{2} + q\\_{i,} + 1} \\\\\\\\ \\\\end{matrix}}{{\\sum^{}}^{}{}^{}}\\\
  \\, M\\_{j,i}} & \\\\underset{\\begin{matrix} {i \\\\in F\\_{j}} \\\\\\\\ {1 \\\\\
  leqslant i,j \\\\leqslant q\\_{i}^{2} + q\\_{u,0} + 1} \\\\\\\\ {q\\_{i\\_{h}}^{2}\
  \ + q\\_{i\\_{h}} + 1} \\\\\\\\ \\\\end{matrix}}{{\\sum^{}}^{}{}^{}} & {\\\\underset{x\
