  \nPuja Das, Chitra Jain, Ansul, 和 Moutushi Singh\n\nDOI: [10.1201/9781003466284-1](https://doi.org/10.1201/9781003466284-11)\n\
  \n## 11.1 引言\n\n由于城市人口增长、交通流量增加、能源消耗需求上升以及健康、教育等其他领域的新规定，智慧城市的建设正变得日益困难。我们如何整合新的理念和技术（例如大规模数据、万物互联（`IoE`）和绿色连接），以确保新兴技术驱动智慧城市的发展？\n\
  \n智慧城市的发展基于海量信息技术，这对于行政和发展计划的正确制定和执行提供了关键保障。大规模数据解决方案的高标准是由智慧城市内部创新治理、智能交通、智能通信、智能医疗服务和其他设施的自然结合所设定的，而这些基础都基于自主和精确数据。创建一个或维护一个具有卓越性能、可靠性、多功能用途、防攻击保护和灾难恢复能力的广泛信息系统需要高昂的成本。此外，区块链技术可以解决中心化数据库的所有问题，包括其适应性和透明度的缺乏。未来智慧城市的问题将源于这两者的汇合，因为物联网（`IoT`）设备和普通公众每天产生海量数据\
  \ [1]。这些事实必须被吸收、思考并以安全、审慎的方式做出回应。在智能手机的边缘，`IoE`、区块链和机器智能相结合，提供了创新的城市共享经济解决方案，允许双方以完全分布的方式进行交互，无需第三方中间人。\n\
  \n能源互联网的目标是通过促进分散清洁能源的广泛连接，增加电力系统的适应性和效率。然而，在解决用户信誉建立、中心化信息维护和用户隐私披露的问题时，电力系统仍然存在某些技术缺陷\
  \ [2, 3]。电力部门的底层市场结构和公司结构（特别是电力行业）在能源互联网时代保持相对不变。除了是大量事实直接来源外，`IoE` 技术还是绿色互联网中的关键终端触角。随着\
  \ `IoE` 技术日益普及并融入到我们生活的方方面面，我们正在开启万物互联的新时代。这不仅是一次改变，更是人类社会一个令人兴奋的时代的黎明。这将为新事物带来机遇也带来挑战，包括身份识别、隐私泄露以及开发和维护设备的高成本\
  \ [4]。比特币的基础是被称为区块链的技术。它是一种以加密为基础的加密链创新。当区块链出现在比特币时，银行业是首批对此感兴趣的群体。随后，系统扩展到包含智能合约，使得区块链被应用于各个领域\
  \ [5]。\n\n### 表 11.1 缩写及其简洁简写\n\n| 符号 | 缩写 |\n| --- | --- |\n| `IoE` | Internet\
  \ of Everything |\n| `P2P` | Peer-to-peer |\n| `D2D` | Device to device |\n| `DNN`\
  \ | Deep Neural Network |\n| `OBCU` | On-board CheckUp |\n| `GPS` | |\n| `NBT` |\
  \ Naïve Bayes Theorem |\n| `CNN` | Convolutional Neural Network |\n| `MT` | Markel\
  \ Tree |\n\n\n\n\n\n区块链最初作为一种开放且不受限制的公共区块链账本出现，以 `BTC` 和 `ETH` 为代表。然而，从此以后出现了各种适配形式，以满足不同的需求和去中心化程度。这扩展了区块链的潜在应用，使其了了金融科技（Fintech）领域并延伸到各种组织。\n\
  \n区块链分类根据视图、对账本的修改访问、对验证和共识机制的参与程度以及分布范围等参数进行。\n\n在`公共区块链`中，记录对所有人可见，允许不受限制的查看。相反，在`私有区块链`中，查看或修改的权限仅限于少数参与者\
  \ [8]。\n\n在`监管账本`中，经认可的成员拥有记录交易和贡献共识机制的权限。相反，`无限制账本`允许任何人记录交易并参与决策过程。然而，`监管区块链`由单一实体监督。`联盟账本`是`监管区块链`的适配版本，包含了许多实体。在`联盟链`中，经过身份识别的参与者被授权记录交易，而这些参与者中的特定子类别可以验证交易并贡献协议过程。Table\
  \ 11.2 展示了不同类型现有共识算法的比较分析。\n\n#### 表 11.2](#chapter11.xhtml#b11tbl11_2) 各共识算法的比较分析\n\
  \n| 共识机制 | 特性 | 用例 | 优点 | 缺点 |\n| :--- | :--- | :--- | :--- | :--- |\n| `Proof of\
  \ Work (PoW)` | 需要矿工解决复杂的数学问题。 | `Bitcoin` 和 `Ethereum`。 | 通过计算确保安全性。 | 耗能。 |\n\
  | `Proof of Stake (PoS)` | 验证者根据持有的加密货币数量选择。 | `Cardano`、`Tezos`。 | 节能。 | 存在中心化风险。\
  \ |\n| `Delegated PoS (DPoS)` | 用户投票产生固定数量代表来验证区块。 | `EOS`、`TRON`。 | 高吞吐量。 | 依赖选出的代表。\
  \ |\n| `Practical Byzantine Fault Tolerance (PBFT)` | 网络参与者对系统的单一状态达成一致。 | `Hyperledger\
  \ Fabric`。 | 低延迟。 | 大规模网络扩展性有限。 |\n| `Proof of Authority (PoA)` | 验证者由中央机构批准。 |\
  \ `Quorum blockchain`。 | 高吞吐量。 | 中心化控制。 |\n| `Proof of Burn (PoB)` | 参与者展示“销毁”代币的证明使其不可用。\
  \ | `Slimcoin`。 | 无挖代币分配。 | 代币被永久销。 |\n| `Proof of Space (PoSpace)` | 参与者分配存储空间进行矿。\
  \ | `Chia Network`。 | 节能，利用存储空间。 | 存储空间中心化风险。 |\n| `Proof of Elapsed Time (PoET)`\
  \ | 参与者等待随机选择的时间。 | `Hyperledger Sawtooth`。 | 节能。 | 需要信任执行环境。 |\n\n选择合适的区块链框架取决于规划应用的特性及其定义的特征。需要考虑的关键要素包括：\n\
  \n*   **机密性 (Confidentiality)**：区块链背景下的机密性是指参与者在网络中保持的匿名程度。它涉及参与者的真实身份是否可以在链上被追溯。不同的区块链提供不同程度的匿名性\
  \ [9]。像 `Bitcoin` 这样的加密货币在公共区块链上提供完全的链上伪匿名。然而，私有区块链解决方案（如 `Hyperledger Fabric`）通常要求身份，特别是在企业环境中。\n\
  *   **可扩展性 (Scalability)**：不同区块链网络的可扩展性各异。使用 `Hyperledger Fabric` 作为平台可以容纳少数参与者。然而，`Ethereum`\
  \ 具有很好的扩展性。以 `TPS` 表示的效率也影响可扩展性。区块链网络的共识系统和验证新创建区块的方法与网络的持续性紧密相关。\n*   **贡献 (Contribution)**：如何成为网络成员？`Multichain`\
  \ 和 `Hyperledger` 是许可链系统的示例，它们需要用户事先同意才能加入网络。相反，公共和无许可的区块链系统允许任何人创建公/私钥对并加入网络。\n\
  *   **访问与机密性策略 (Contact and Confidentiality Strategy)**：账本框架的选择受参与方之间信息提取和透明度限制。各种区块链账本提供不同水平的机密性和透明度。许可链将账本访问限制为预注册并确认的参与者\
  \ [10]。相反，公共区块链账本允许所有人通过 `Block Explorer` 等资源观察交易网络。在开放访问的区块链账本中，通过在注册后生成公私钥组合来便利对去中心化账本的进入。\n\
  \n著名学者 Melanie Swan 将区块链分为三代：区块链技术经历了不同的阶段，通常被称为 1.0 阶段、2.0 和 3.0 阶段。初始阶段 `区块链 1.0`\
  \ 主要侧重于 `Bitcoins` 和其他加密货币的引入和利用。`区块链 2.0` 涵盖了更广泛的商业和推广活动，以及商业应用——例如涉及债务、保险公司、股票和智能合约的应用。`区块链\
  \ 3.0` 除了商业领域外，还影响管理、医疗、研究、文明和艺术创作，促进了去中心化和协作社区的发展 [10,11]。`Hashing`（哈希）、`timestamps`（时间戳）、`asymmetric\
  \ encryption`（非对称加密）、`Merkle trees (MTs)`（梅克尔树）、`proof of work`（工作量证明）和 `peer-to-peer\
  \ (P2P) networking`（点点网络）只是区块链结合的多种技术之一。尽管这些技术并非新鲜，但区块链巧妙地将它们融合了独特的系统设计和工作流程。特别是区块链通过安全地记录每一比特交易信息来确保一致性和网络信任。\n\
  \n### 11.1.2 HASH\n\n`Hashing functions`（哈希函数）通过使用 `hash algorithm`（哈希算法）将各种长度的输入转换为预定义的输出集，提供\
  \ `hash values`（哈希值）。`Hashing` 可用于抗冲突性和谜题友好性，这是加密安全至关重要的两个特性。通过使用 `asymmetric encryption`、`timestamps`、`MTs`\
  \ 和其他复杂的加密程序，这些高级方法对于提高安全措施至关重要。企业通过实施这些先进技术，可以确保敏感数据和信息的完整性免受潜在网络攻击的影响 [12]。\n\n\
  ### 11.1.3 ASYMMETRIC CRYPTOGRAPHY\n\n\n\n\n\n在这种方法中，需要两个不同的函数使用非对称加密对数据进行加解码。公钥和私钥即为密钥。在匹配私钥后，我们可能解析用公钥编码的数据，反之亦然。它保证了区块链符合所有权验证和安全标准。`RSA`、`DSE`、`椭圆曲线密码学\
  \ (ECC)` 以及其他算法都是标准算法。\n\n### 11.1.4 `TIMESTAMP`\n\n可以使用 `timestamp` 证明特定数据在给定时刻的存在。时间戳将被添加到区块中，以此类推。\n\
  \n### 11.1.5 `共识机制方法`\n\n共识机制是账本建立的一系列规则，用以确保一致性。根据业务需求，典型方法包括`委托权益证明` (`DPoS`)、`工作量证明`\
  \ (`PoW`) 和`拜尔庭容错` (`BFT`)。然而，`PoS` 更加节能，因为它取决于持仓量。尽管如此，它也带有更多的中心化担忧。在 `DPoS` 中，代表者通过投票产生，这允许由人员来验证交易。这种机制确保了区块链的安全以及数据的不可更改性。\n\
  \nTable 11.3) 区块链类型分析\n\n| 参数 | 公有 | 联盟 |\n| :--- | :--- | :--- |\n| **读取权限** |\
  \ 无 | 特定操作 |\n| **使用权限** | 高 | 高 |\n| **网络延迟** | 低 | 高 |\n| **吞吐量** | 低 | 高 |\n\
  | **主交易** | 无 | 特定操作 |\n| **写入权限** | 每一个节点 | 联盟 |\n| **创建权限** | 每一个节点 | 联盟 |\n|\
  \ **共识机制** | `PoW` | `BFT` |\n| **不可篡性** | 是 | 是 |\n| **示例** | `Bitcoin` | `Ethereum`\
  \ |\n\n### 11.1.6 `点对点系统`\n\n`P2P` 系统是区块链的基础，它允许数据交换-14。\n\n### 11.1.7 `链式结构与默克尔树`\n\
  \n`MT` 的分层结构被用于验证区块内的数据。通过利用 `SPV`，可以只复制区块的一部分，从而降低能量消耗。这种方法用于验证交易，而不需要整个区块链-13。\n\
