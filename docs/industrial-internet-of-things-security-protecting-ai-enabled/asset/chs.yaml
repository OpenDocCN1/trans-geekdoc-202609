  \ |\n\n## 10.2.2 医疗物联网 (MIOT) 的安全与隐私要求\n\n### 10.2.2.1 定位\n定位是确定每个无线设备在网络中位置的方法。为了确定传感器是否正确地放置在身体上，采用了前一种传感器定位技术。人体体传感器位置识别对于活动识别等应用至关重要。医疗系统和医疗设备经常在网络覆盖范围内外移动。必须实时实现一种检测网络传感器离开和返回时间变化的入侵检测方法。\n\
  \n### 10.2.2.2 MIoT 设备的认证\n设备认证机制应该能够创建安全的加密的交互，以确保数据的完整性和机密性。任何 MIoT 医疗系统必须包含设备认证，因为恶意设备可能会提供有关患者状况的虚假信息，从而严重损害患者的医疗决策。\n\
  \n### 10.2.2.3 机密性\n数据传输和医疗对话可能会被攻击者拦截。患者可能面临这种窃听技术带来的严重风险，因为黑客可能会利用获取的医疗信息进行多种非法活动。确保机密性可以防止未经授权的人员访问医疗数据并确保只有授权人员才能访问。\n\
  \n### 10.2.2.4 数据完整性\n在患者安全面临风险的情况下，攻击者可能会利用无线网络的广播功能来获取并更改患者数据，这可能会产生灾难性的后果。确保在传输或存储过程中，敌对无法尝试更改或篡改医疗数据。\n\
  \n### 10.2.2.5 数据可用性\n确保正确的数据必须供授权用户访问，以便正确的用户或节点能够及时、可靠地访问资源。在 MIoT 环境下，如果发生拒绝服务\
  \ (`DoS`) 攻击，医疗服务器和设备提供的相关用户需要的服务和数据将无法使用。由于数据丢失的风险，医疗应用程序必须始终可用，以确保用户和紧急服务的数据可用性。\n\
  \n### 10.2.2.6 抗攻击能力\nMIoT 系统必须具备足够的灵活性以适应节点故障，并防止单点故障。此外，在发生攻击时，设备或信息应受到基础安全方案的保护。\n\
  \n### 10.2.2.7 防篡改 MIoT 设备\nMIoT 设备的物理盗窃（尤其是环境传感器）可能会向黑客泄露安全信息。防篡改集成电路 (`TRICs`)\
  \ 可以防止外部人员在设备安装后破解设备上的代码，这应该是系统中包含的 MIoT 医疗设备的基本功能。\n\n### 10.2.2.8 数据可用性\n数据可用性确保数据仅供授权的个人可访问。\n\
  \n### 10.2.2.9 数据审计\n监控和分析对医疗记录的访问情况是识别和跟踪异常或可疑事件的标准程序，也是管理资源的关键方法。\n\n## 10.2.3\
  \ 针对 MIOT 攻击的解决方案\n\n### 10.2.3.1 访问控制\n访问控制概述了谁被访问 MIoT 设备和医疗数据，以及应该授予的访问权限。因此，它必须验证尝试访问数据的人员（例如使用密码或指纹）。为了确保最佳的安全隐私，需要为\
  \ IoT 医疗应用和设备建立良好的访问控制。然而，在物理安全（访问控制的另一个方面）方面，必要时应保护 MIoT 设备和医疗数据免受物理盗窃、意外、环境危险和破坏。还必须遵守所有的安全和隐私法规。\n\
  \n### 10.2.3.2 数据加密\n通过数据加密，数据在传输或存储时会得到保护。即使在极少数情况下攻击者进入了医疗传输或数据库介质，强数据加密也可能为他们读取私人健康信息带来困难。\n\
  \n### 10.2.3.3 数据审计\n在尝试识别安全泄露的起源时，审计非常有帮助，因为它们允许检查底层数据（例如系统警报、网络活动和用户访问）。然而，由于其扩展到了云端，医疗物联网网络无法完全信任。因此，为了能够检测整个云网络发生的扰动和异常，建立审计系统是必不可少的。\n\
  \n### 10.2.3.4 数据削减\n\n\n\n\n\n根据“数据最小化”概念，医疗物联网（MIoT）服务仅在绝对必要时才应收集个人健康信息（PHI），且存储信息的时间应仅限于实现用户请求的服务所需的时间。减少收集的个人患者数据总量是医疗保健行业最流行且有效的数据最小化策略之一。然而，这包括仅根据意图收集必要且相关的患者数据；删除或隐藏不再需要或过时的个人数据；以及进行定期评估以确保数据的相关性和充分性\
  \ [19]。\n\n## 10.2.3.5 资产清单设备\n\n组织无法看到的医疗资产就无法保护；因此，必须对所有组织资产进行完整的清单。必须频繁进行风险评估以检测可能的问题，因为许多物联网设备是在没有经过全面风险评估的情况下添加的。某些制造商提供了清单解决方案，可以在不干扰设备功能的情况下识别网络上的物联网设备\
  \ [19]。\n\n## 10.2.3.6 采用最佳实践\n\n改进和保护标准的 MIoT 环境需要遵循最佳实践，包括避免使用硬编码密码、部署防火墙和蜜罐来吸引并中和攻击者，以及加密敏感数据。然而，由于这些物联网设备和应用程序不断连接网络，通过使用入侵预防系统（IPS）、入侵检测系统（IDS）、SSL/TLS\
  \ 安全协议和超文本传输协议安全（HTTPS）通信机制维护网络安全至关重要。此外，在部署任何设备之前需要完成风险评估，以便在配置环境之前发现任何漏洞。软件和硬件也需要定期更新\
  \ [19]。\n\n## 10.2.3.7 增强意识\n\n持续的医人员培训对于提高患者的安全和健康至关重要，医疗领域的雇主通常应该意识到信息安全原则，以便为\
  \ MIoT 应用和患者隐私数据提供所需的安全和保护。员工教育应包括传授关于患者权利、隐私和数据安全的充分知识 [19,24]。\n\n## 10.2.3.8\
  \ 升级我们的软件\n\n确保操作系统和所有软件均已更新至最新。这些更新包含了必要的补丁，可以防止潜在窃窃利用利用先发现的软件漏洞。如果不应用必要的软件更新，犯罪分子仍然可以利用早期版本的缺陷。如果你选择忽略这些软件更新警报，网络安全只是你将失去的许多东西之一\
  \ [4]。\n\n## 10.2.4 MIoT 保护的未来方向\n\n总结，通过及时提供有效的服务，基于医疗物联网的创新促进了医疗机构效率的提高，并提供了大量的实用服务和应用程序，以提高医疗护理质量\
  \ [19]。我们概述了未来几年我们可以期待的医疗物联网安全的一些主要发展和趋势。\n\n### 10.2.4.1 区块链技术\n\n### 10.2.4.1.1\
  \ 基于区块链的去中心化安全\n\n使用区块链技术实现去中心化的安全架构，将安全协议分散在云系统和 MIoT 设备之间。由于区块链技术无法被篡改，勒索软件攻击更难损害整个系统并突破单个安全措施\
  \ [4,25,26]。\n\n### 10.2.4.1.2 用于安全交易的智能合约\n\n区块链上的智能合约可用于云系统与物联网设备之间的自动化交易。通过确保交易的真实性且不可篡改，这降低了满足勒索要求的可能性\
  \ [4]。\n\n### 10.2.4.1.3 基于区块链的身份管理\n\n需要集成区块链来安全地维护 MIoT 设备身份。由于每个设备的识别都记录在区块链上，非法设备无法被转换为机器人。区块链会针对任何更改设备识别的尝试发送通知\
  \ [25]。\n\n### 10.2.4.1.4 区块链联盟体\n\n在医疗领域建立区块链联盟，以制定 MIoT 网络安全标准 [4,26]。\n\n## 10.2.4.2\
  \ AI 驱动的异常检测\n\n提高医疗物联网网络安全的有效技术是由 AI 驱动的异常检测。机器学习算法能够检查数据并发现异常。如图 10.8](#chapter10.xhtml#f10_8)\
  \ 所示，MIoT 安全考虑了许多参数。以下是使用由 AI 驱动的异常检测的方法 [27]。\n\n![图 10.8 用于医疗安全的若干 AI 特性。](img/fig10_8.jpg)\n\
  \n图 10.8 用于医疗安全的若干 AI 特性。\n\n### 10.2.4.2.1 行为分析\n\n开发机器学习模型以理解医疗物联网设备的典型用法、数据传输速率通信模式。任何偏离这些模式的情况可能意味着安全风险。\n\
  \n### 10.2.4.2.2 持续学习\n\n建立持续学习机制，以便异常检测系统适应环境变化。这对于引入软件更新和新设备的动态医疗环境尤为重要。\n\n###\
  \ 10.2.4.2.3 攻击模式识别\n\n训练 AI 模型识别医疗领域中频繁出现的特定攻击模式。此类模式可能指向勒索软件、恶意软件或未经授权的访问。\n\n\
  ### 10.2.4.2.4 数据加密与异常检测\n\n将异常检测与数据加密相结合，确保在发现异常时被拦截的数据也是安全的且不可读的。\n\n## 10.2.4.3\
  \ 零信任安全模型\n\n通过对 MIoT 设备实施零信任访问控制，确保所有用户、设备和系统始终经过授权和验证。这降低了勒索软件扩散和意外访问的可能性。\n\n\
  ### 10.2.4.3.2 持续监控与分析\n\n在零信任框架中包含分析和持续监控。为了确保持续监控，这意味着实时分析 MIoT 网络行为以寻找高级持续威胁的迹象。\n\
  \n### 10.2.4.3.3 零信任权限管理\n\n通过实施零信任权限管理，利用最小权限原则限制访问权限。这减少了黑客获得 MIoT 系统持续访问权限的可能性。\n\
  \n### 10.2.4.3.4 持续安全审计\n\n\n\n\n\n遵循零信任模型，进行持续的安全审计。为了发现并修复安全漏洞，应定期评估网络、访问控制和 MIoT\
  \ 设备的安全态 [30]。\n\n### 10.3 结论\n\n在 MIoT 时代保障医疗健康的未来，强大的网络安全对于 MIoT 应用至关重要，因为它是改善医疗保健的关键。本文以一个行动号召结束。随着\
  \ MIoT 转型医疗行业，采取主动的网络安全措施变得至关重要。这不仅关乎数据安全，还涉及患者隐私保护、设备可靠性以及加强医疗系统的基础。得出的结论是一个简单的指令：拥抱并执行\
  \ MIoT 中的网络安全。MIoT 网络安全的成功对医疗保健的未来至关重要，结论呼吁以准确性、创造力和对安全且以患者为中心的护理持续关注，坚定地管理这一交汇点。\n\
  \n我们的研究还强调了 MIoT 生态系统和当代威胁环境的重要性。许多研究建议通过新的集成和增强来提高 MIoT 的安全性，但它们没有解决系统内部安全性不足的根本问题，这导致了安全和隐私方面的空白。我们意识到，为了使安全有效，它必须是集成的而非补丁式的。它必须是\
  \ MIoT 生态系统广泛使用的关键组件。尽管 MIoT 安全性引起了大量关注，但相关的标准和技术要求仍在制定中，尚未达到理想的成熟阶段。目前，大量研究人员正致力于创新、安全的\
  \ MIoT 解决方案，这些解决方案将提供广泛的有益的服务和服务应用，在增强医疗保健效率的同时，始终保护隐私和安全。这是由于近期对 MIoT 安全和隐私的需求。从长远来看，这将由区块链、人工智能、关键安全设计、嵌入式安全以及严格的法律法规整合驱动。总之，本研究对医疗物联网中的安全和隐私问题提供了全面的总结，并提供了可操作的应对措施和解决方案、重要挑战以及未来方向。\n\
