  \n工业物联网（IIoT）指的是工业环境环境中互连的传感器、仪表和自主设备网络，这些设备连接到互联网以用于数据收集和分析。该网络实现了生产数据的收集、分析和优化，从而提高了制造业和服务供应的效率并降低了成本。在装配线、物流和大规模分销等工业环境中，管理操作的设备和人员都是整个技术生态系统的一部分。\n\
  \n目前，能源、交通和工业部门了 IIoT 应用的大多数，2019 年的全球支出超过 3000 亿美元，预计到 2025 年这一数字将增加一倍。随着 IIoT\
  \ 的普及，预计未来会有更多的工业机器人（包括协作机器人、仓库和运输控制系统以及预测性维护系统）投入实施。\n\n面向消费的物联网（IoT）与其业务对应的工业物联网（IIoT）之间的重要区别在于，后者强调提高制造设施的安全性和生产力。智能家居技术（如虚拟助手、温度传感器和安全系统）以及个人健康监测可穿戴设备是消费解决方案的主要关注点。\n\
  \nIIoT 利用智能设备和实时分析，长期利用工业环境中“笨 Implementation”机器产生的数据。智能机器不仅能够实时捕和分析数据，还能比人类更好地交流关键信息，这是\
  \ IIoT 的动力原理。这使得企业能够做出更快、更准确的选择。\n\n通过连接的传感器和执行器尽早发现效率低下和问题，企业可以节省金钱。这项技术也有助于业务分析。特别是在工业领域，IIoT\
  \ 可以提高供应链效率、可追溯性、可持续性和质量控制。许多工业过程依赖于 IIoT，包括资产监控、能源管理、预测性维护和改进现场服务。在[表 9.1]中，我们可以看到将\
  \ AI 与 IIoT 以及边缘计算相结合对人类福祉的潜在好处。\n\n### 表 9.1 边缘计算、IIoT 和 AI 的优势\n\n| 方面 || 益处 |\n\
