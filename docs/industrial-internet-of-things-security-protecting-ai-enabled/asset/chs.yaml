  \ 15.7 万亿美元。AI 大部分货币优势将来自以下来源：\n\n![FIGURE 9.3 使用 AI、边缘计算和 IIoT（工业物联网）后质量、效率、个性化和节省时间的预期增长。](img/fig9_3.jpg)\n\
  \n图 9.3 使用 AI、边缘计算和 IIoT 后质量、生产力、个性化和节省时间的预期增长。\n\n*   自动化任务并使用各种形式的 AI 补充现有员工工作的公司，生产力提高了。\n\
  *   更具定制化或质量更高的数字化及 AI 增强型商品和服务的可用导致了客户需求的增加。\n\n## 9.3 边缘端实时数据分析\n\n数据的指数级增长为当今飞速的技术领域带来了机遇和挑战。由无数设备和传感器产生的数据在体量、速度和多样性方面，为数据处理和分析的新方法铺平了道路。在这些方法中，边缘分析变得非常流行。为了实现实时洞察和快速行动，边缘分析涉及在网络边缘或靠近网络边缘（更靠近数据源）的地方处理和分析数据。在本文，我们将深入探讨边缘分析以及它将如何变革许多行业。\n\
  \n边缘分析并不完全依赖中心化的云或数据中心基础设施，而是在网络外围（通常在边缘设备或网关上）对数据进行处理、分析和推理。边缘分析通过在靠近产生点的本地进行处理，减轻了将数据发送到云端处理带来的带宽负担和延迟。在及时反应至关重要的情况下，这种方法非常出色，因为它允许在接近实时的情况下分析和决策。\n\
  \n### 9.3.1 边缘分析的优势\n\n边缘分析的主要优势包括降低延迟、优化带宽以及增强数据隐私和安全。\n\n由于边缘分析，组织现在可以利用网络边缘的实时洞察，这意味着数据处理和分析发生了巨大变化。通过使用边缘计算能力，企业可以提高数据隐私安全性，克服延迟和带宽限制，在远程或不稳定网络环境下离线运行，并克服传统的以云为中心的局限。边缘分析在物联网、智能城市、医疗保健和零售等许多不同领域的广泛应用带来了巨大的优势和革命性的可能。\n\
  \n边缘计算技术的改进（例如边缘更高的处理能力和机器学习能力）将随着其持续扩展而显著提升边缘分析的潜力。5G 网络的引入和边缘设备的广泛使用预计导致边缘产生的数据量剧增。为了有效管理并从这一数据洪水中获取价值，边缘分析将至关重要。\n\
  \n\n\n\n\n在网络边缘存储和分析运营数据，而非依赖中心化的云端解决方案，具有许多优势。通过在网络边缘存储数据，我们可以规避地理分散型网络的带宽限制，并消除消除运营粒度的需求。对数据传输和丢弃的判断往往是由于数据过滤所迫使的，而这些判断总是基于对被删除数据可能具有的价值了解不足。相比之下，通过在边缘收集和存储数据，所有内容都可能为了未来可能的分析而被保留。在边缘无限保留数据可以被视为对现有“存储并转发”要求的扩展，因为即使在具有过滤并将其发送到中央云的架构中，仍然存在存储和转发数据的需求。这是因为当网络连接失败时，数据无法立即从边缘点传输。\n\
  \n如图 9.4 所示，边缘计算在水平上扩展到 IIoT 子系统，在垂直上跨越了从设备到云端的整个栈。新的分布式计算模型可以适应各种通信和交互范式，例如：\n\n\
  ![图 9.4 IIoT 子系统的全栈。](img/fig9_4.jpg)\n\n图图 9.4 IIoT 子系统的全栈。\n\n*   P2P 网络，其中摄像摄像头交换其视野内物体的信息；\n\
  *   边缘设备之间的协作，例如远程风力涡电机机群或自组织车辆；\n*   跨越存储在设备、云或其任何组合中的数据进行分布式查询；\n*   分布式数据管理，涉及数据存储的位置、类型和持续时间；\n\
  *   数据治理，涵盖数据安全、隐私、可发现性和可用性。\n\n具有独特计算计算的行业（如制造业、农业和物流）将从边缘计算中获益匪浅。这些部门处理重型机械、IT\
  \ 网络以及 IIoT 设备产生的海量数据。\n\nIoT 设备通常收集数据并将其发送云端。存储在云端的数据随后可能会被用户访问和分析。表 9.3 给出了 AI\
  \ 与边缘计算及应用的优势。\n\n表 9.3 AI 与边缘计算及应用的优势\n\n| 技术 || 优势 || 示例 |\n| --- | --- | ---\
  \ |\n| **用于预测性分析的机器学习** | | |\n*   识别隐藏的模式和趋势\n*   预测未来结果\n*   优化流程和资源分配 | | |\n\
  *   预测设备故障以进行主动维护\n*   预测需求以实现高效的库存管理\n*   分析客户数据用于个性化营销 |\n| **用于增强自动化的深度学习** |\
  \ | |\n*   用于图像和语音识别开发复杂模型\n*   以高精度和高适应性自动执行任务\n*   改进质量控制并减少错误 | | |\n*   机器人识别生产线上的缺陷产品\n\
  *   自动驾驶汽车在复杂的交通环境中导航\n*   医学影像系统自动检测异常 |\n| **AI 驱动的机器人和智能机器** | | |\n*   与人类协作并在危险或远程环境中执行任务\n\
  *   增强能力并执行需要灵敏度或高精度的任务\n*   增加对变化状况的适应性和响应能力 | | |\n*   协作机器人协助人类在制造业中进行重型或重复性任务\n\
  *   手术机器人以更高的精度执行微创手术\n*   智能无人机在偏远地区检查基础设施或交付货物 |\n| **用于安全高效数据处理的边缘 AI** | | |\n\
  *   通过在靠近源头处理数据降低延迟并提高响应速度\n*   减少对云基础设施的依赖以提高安全性和隐私\n*   减少带宽需求和网络拥塞 | | |\n* \
  \  工业传感器的实时异常检测以便立即采取纠正措施\n*   设备端面部识别用于安全访问控制系统\n*   用于智能城市优化管理的去中心化分析 |\n\n在边缘计算架构中，三个主要组件是传感器或边缘设备、边缘网关以及中央服务器或云。当数据流过这些层级时，每一层也有助于决策。所有这些内容在下方都有详细描述.^(\\\
  )[¹³^(\\])\n\n### 9.3.1.1 测量设备\n\n智能传感器或边缘设备中的嵌入式微处理器从其连接的传感器网络中收集关键测量值。\n\n在这些设备能够收集数据的许多微操作中，包括时间戳、运行小时、连接、校准合规性等许多。它还可以独立运行，具备电源并在连接丢失时同步数据的能力，从而保证数据的连续性。此外，智能传感器能够生成各种本地控制输出，范围从警告到执行。\n\
  \n### 9.3.1.2 能量侧网关\n\n边缘网关将边缘设备连接到云端。它与另一个边缘网关同步，并作为边缘设备数据的中央仓库。所有连接到边缘网关的边缘设备都通过它作为其守护者，确保它们经过安全的身份验证和配置。向云端用于分析和建模的数据传输仅限于高阶处理。\n\
  \n尽管边缘网关没有直接连接到云，但它们被设计成模拟云的许多功能并自主运行。在大型制造布局中，可以安装许多边缘网关，每个网关关注不同的数据指标。这些网关可以在云端进行同步和统一。这允许进行密集的数据处理计算，而不影响邻附近的网关或边缘设备。\n\
  \n一个例子是“云”，它实际上只是基于互联网的连接虚拟计算机网络，提供各种在线服务。边缘网关经过处理、分析和存储的高阶数据位于此处.^(\\)[¹⁴^,¹⁵^(\\\
  ])\n\n## 9.4 IIoT 和边缘计算中的安全挑战与解决方案\n\n数据的指数级增长为当今快速发展的技术领域带来了机遇和挑战。由于各种设备和传感器产生的数据速度、多样性和数量，需要新的数据处理和分析方法。在这些方法中，边缘分析变得越来越流行。为了实现实时洞察和快速行动，边缘分析涉及在靠近数据源的边缘处进行处理和分析。在本文中，我们将深入边缘分析以及它将如何变革许多行业.^(\\\
  )[¹⁶^(\\])\n\n\n\n\n\n边缘分析并非完全依赖于中心化的云或数据中心基础设施，而是在网络边缘（通常是边缘设备或网关）对数据进行处理、分析和推断。通过在靠近数据产生点进行本地处理，边缘分析减轻了由于将数据发送到云端处理而造成的带宽和延迟负担。在需要快速响应的情况下，这种方法尤为出色，因为它允许在近乎实时的情况下进行分析和决策。表\
  \ 9.4 总结了构建 AI、边缘和 IIoT 应用时面临的安全挑战。\n\n表 9.4 AI、边缘计算和 IIoT 环境中的安全挑战\n\n| 主题 | 安全挑战描述\
  \ |\n| --- | --- |\n| 需要可靠的数据协议 | 在有线 IIoT 部署中，`Profinet`、`EtherNet/IP` 和 `Modbus\
  \ TCP/IP` 等 `Ethernet` 协议促进了数据交换。 |\n| | 使用 `TLS/SSL` 或安全网关可以增强数据加密。 |\n| | `OPC\
  \ UA` 为有线和无线 IIoT 解决方案提供端到端加密和设备认证。 |\n| | 无线 IIoT 系统通常使用具有加密能力的现代协议，如 `MQTT`、`COAP`、`AMQP`、`WebSockets`\
  \ 或 `RESTful APIs`。 |\n| 需要安全的网络协议 | 定义设备连接和数据传输规则的网络协议对 IIoT 安全至关重要。 |\n| | 根据网络架构和用例选择\
  \ `DDS`、`LoRaWAN`、`Zigbee`、`WirelessHART` 和 `NB-IoT` 等协议。 |\n| | 选择合适的协议时，考虑信息物理系统的类型、数据传输范围和功耗至关重要。\
