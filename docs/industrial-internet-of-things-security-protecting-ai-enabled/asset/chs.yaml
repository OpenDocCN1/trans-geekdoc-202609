  \ BIBD 的结构，每个成员都可以确定预期消息的发送者。\n\n\n\n\n\n本部分将首先介绍协议的系统模型，这将有助于更好地理解本文中描述的协议，然后描述攻击者模型，最后总结主动攻击者的能力。系统的架构如图图\
  \ 6.1 所示。\n\n![图 6.1 系统架构。](img/fig6_1.jpg)\n\n图 6.1 系统架构。\n\n### 6.4.1 系统架构\n\n\
  本章的系统架构由三部分组成：用户、服务提供者和认证中心。用户之间进行通信以获取群会话密钥；服务提供者负责注册用户和认证中心，以确保协议中的实体是合法的；认证中心为用户初始化密钥材料并颁发证书以验证用户身份。下文将对每个部分提供详细的阐释：\n\
  \n#### 用户\n\n在该协议中，考虑到存在不遵守群通信规则的恶意用户，此类用户的目标是使不同成员的轻量级安全密钥认证方案发生失效，从而破坏群通信的安全性和可靠性。根据该协议，在群密钥协商协议期间，群成员通过检查成员身份来防止非法情况发生。\n\
  \n#### 服务提供者\n\n服务提供者是诚实但好奇的实体。根据该协议，由于服务提供者无法获取其他成员的私钥或群私钥，因此他们无法访问群通信的内容。\n\n\
  #### 认证中心\n\n认证中心是完全信任的实体，负责为每个成员构建密钥材料并发布数字证书以验证用户身份的合法性。尽管无法计算任何成员的私钥，认证中心可以计算轻量级安全密钥认证方案。此外，认证中心不能冒充任何成员，以确保协议的安全性和可靠性。在物联网（IIoT）中，认证中心可以由具有证书发放资质的大机构运营。由于认证中心是完全信任的实体，与其相关的通道也是轻量级安全密钥认证方案。一旦建立了该方案通道，它就能抵抗中间人攻击。随着时间戳的引入，中间人攻击者的任何尝试所需的时间将超过实际通信延迟，从而能够检测到此类攻击。\n\
  \n### 6.4.2 攻击者模型\n\n通信通道是开放的，信息在通信过程中面临被动攻击和主动攻击。被动攻击是指攻击者窃听通信通道以获取轻量级安全密钥认证方案的知识，而主动攻击涉及攻击者试图通过中断会话或冒充成员来破坏群通信。\n\
  \n攻击者模型定义了主动攻击者的能力，包括：\n\n1. 攻击者可以通过冒充成员并使用成员的长期私钥与其他参与者通信，获取群会话密钥。\n\n2. 攻击者可以获取之前的会话密钥并获取新成员密钥信息。因此，他们可以冒充新成员和其他成员进行通信。\n\
  \n3. 攻击者可以获取成员的私钥。随后，他们尝试计算之前的群会话密钥以访问之前的通信内容。\n\n## 6.5 群信息交互模型\n\n假设有 `M` 个成员，令\
