  \n图 6.5 协议整体计算开销对比。\n\n## 6.9 结论\n\n针对现有组密钥协商协议灵活性差和计算开销高的问题，本文提出了一种基于平衡不完全块设计的组密钥协商协议，该协议不需要配对操作，从而实现了轻量级的组密钥协商。借助块设计结构的数学属性和避免配对操作的技术，本文进一步减少了组密钥协商协议的计算和通信开销。在下一阶段的研究中，将重点解决认证中心密钥管理中的漏洞问题。\n\
