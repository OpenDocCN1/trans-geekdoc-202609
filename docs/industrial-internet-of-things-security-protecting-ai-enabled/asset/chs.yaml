  \ |\n| | 提倡使用基于 `AWS IoT Device Management` 或 `Azure IoT Hub` 等云平台进行空中软件更新 (`OTA`)\
  \ 以实现高效管理。 |\n| | 正确配置的设备管理平台可以优化更新发布、跟踪设备群并在紧急情况下通知 IT 团队。 |\n\n为了确保应用程序安全，必须解决以下漏洞：\n\
  \n* 数据存储与保护：在边缘侧收集和处理的信息缺乏在中心化场所存储数据时的物理安全性。从边缘资源中取出磁盘驱动器或将数据移动到内存棒上会对关键信息造成风险。由于本地资源有限，提供可靠的数据备份可能会更加困难。\n\
  * 安全代码和验证方法：许多边缘设备的密码限制较弱，而且经常被关注安全的运维人员忽视。网络犯罪分子已经开发了复杂的技巧来破解密码保护系统。2017 年，某大学校园曾遭受一次“僵尸网络攻击”，该攻击在五个不同网络的\
  \ 5,000 台 IoT 设备上寻找弱密码。\n\n公司正在安装越来越多的边缘设备来监控更多类型的活动，但由于数据蔓延，监控变得越来越困难。设备最终超过了边缘的限制，可能会导致带宽滥用和许多设备上的潜在安全泄露。未经处理的数据传输可能会危及安全，而且随着\
  \ IoT 流量的增长，延迟变得变得更加明显。\n\n## 9.5 构建安全的边缘和 IIoT 架构\n\n如果现代工业系统必须具有韧性和可靠性，则构建安全的边缘和\
  \ IIoT 架构是强制性的。在整个设计阶段，保护敏感信息和关键任务流程应该是重中之重。这需要仔细选择数据协议，重点关注如 `OPC UA` 等等提供端到端认证和加密的协议。此外，在选择安全的网络协议（如\
  \ `DDS` 或 `LoRaWAN`）时，应考虑具体的用例和网络设计。考虑到 IIoT 设备的局限性，人们认为通过软件升级维护安全性可能是挑战性的。为了应对这一，实施由\
  \ `AWS IoT Device Management` 或 `Azure IoT Hub` 等云解决方案启用的 `OTA` 更新至关重要。为了领先于新威胁，全面的安全计划除了防止未经授权的访问外，还要考虑数据完整性、设备管理和持续监控。面对工业领域不断变化的网络安全威胁，需要对构建安全的\
  \ IIoT 和边缘基础设施这一复杂工作采取主动且灵活的方法。图 9.5 为此目的提供了一个框架。表 9.5  概述了用于构建商业应用的安全技术。\n\n![图\
  \ 9.5 最小化 IIoT、AI 和边缘环境中的安全威胁。[21]](images/fig9_5.jpg)\n\n图 9.5 最小化 IIoT、AI 和边缘环境中的安全威胁。\n\
