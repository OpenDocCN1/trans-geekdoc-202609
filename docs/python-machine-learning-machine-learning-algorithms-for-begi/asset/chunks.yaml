  trans: '


    相关性分析可以应用于解决冗余数据问题。准确的数据集成能够生成一个冗余和不一致性较少的数据集。这非常有益，因为它提高了学习速度和质量。数据集成步骤，连同之前的数据清洗步骤，能够生成具有可靠条目的数据集。


    # 2.3.2 数据转换


    有时，以特定格式处理数据集比以另一种格式更方便。数据转换正是为此而出现的。数据转换的目标是将数据值转换为其他格式或单位，使数据分析更具意义（例如，将非线性模型转换为线性模型）。根据所需分析的性质，决定是否需要进行转换。常见的转换方式包括：


    - 聚合：这是一种汇总方式，其中同一变量的一组值可以表示/聚合为一个单一值。例如，多个类别可以分组为一个类别。


    - 归一化：当我们希望使用特定范围来表示一组数据时，会采用这种数据转换方式。即，数据被缩放到一个小的、指定的范围内。例如，在通信系统中，工程师有时更倾向于以归一化功率形式表示基站的功率。他们将功率值缩放到
    0 到 1 的范围内。常见的归一化方式有：1) 最小-最大归一化，2) Z-分数归一化，以及 3) 小数缩放归一化。是否对数据进行归一化以及选择最佳的归一化方式取决于所处理数据的性质。


    - 泛化：从汇总概念的角度来看，它可以被视为另一种聚合方式。其思想是将低级别的属性转换为高级别的属性。这一过程也称为：层级爬升。


    - 属性构造：为了简化分析，可以从已给出的属性中提取新属性。这就是属性构造的含义。


    # 2.3.3 数据缩减


    数据准备的最后一步是数据缩减。任何数据集分析的目标都是获得有意义的输出，以简单的语言或数值描述数据集中的大量信息，这些数值随后可用于感兴趣的应用。大型数据集的分析复杂且可能耗时很长。有时，可能会出现不可行的结果。这就是数据缩减原则产生的原因。输入数据通过引入数据集的有效表示来缩减，而不会影响原始输入数据的准确性。数据缩减通过去除噪声和冗余记录，使数据更容易被分析，从而使学习算法的任务更加有效。数据缩减步骤有一些必须考虑的优缺点：


    - 优点：降低数据复杂性，关注最重要的属性，减少许多算法的计算复杂性，并使结果更易于理解。


    - 缺点：取决于数据集的性质，可能不需要数据缩减。另一个主要缺点是，在缩减过程中可能会丢失一些主要数据。例如，当将多个值表示为平均值时。


    关于数据准备步骤最后可以这样说：有三条基本规则使我们能够判断数据集是否干净并准备好由机器学习算法处理。1) 每个变量都有一列数据，2) 每个观察都有一行，3)
    每个值都有自己的单元格。干净且准备好的数据集更容易被可视化并由统计分析处理。


    # 2.4 使用 - 折技术的交叉验证


    交叉验证是应用于数据样本的一种统计步骤，用于检查机器学习模型的有效性。在机器学习中，交叉验证技术主要用于评估和预期机器学习模型的性能。使用此方法的好处是利用一小部分数据来预期机器学习算法在应用于未在模型训练步骤中使用的新数据时将如何表现。


    在 - 折交叉验证技术中，数据集被分为测试数据和训练数据。数据集被划分为大小大致相等的折。第一个折被视为测试集，而其余 − 1 个折是训练集。- 折交叉验证方法优于其他验证方法，因为它：1)
    易于实现。2) 易于理解。3) 其结果的偏差低于其他方法。


    参数 表示数据集将被划分的集合数量。这就是该方法得名 - 折的原因。当选择某个特定值时，它可能替换  所以名称变为：例如，如果选择  为 10，则为 10-折交叉验证。现在，划分过程中的问题是，每个折（无论是测试折还是训练折）都力求包含尽可能多的数据点，如图
    2.1 所示。当测试集中的数据点数量增加时，验证会更好。同样，对于训练集，当其数据点数量增加时，我们会获得更好的学习结果。因此，两个集合之间存在权衡。因此，每个从训练集移出到测试集的数据点对训练集来说是一种损失，反之亦然。这就是交叉验证发挥作用的地方。


    ![image](img/image033.png)


    图 2.1 将数据集分割为测试和训练折


    基本思想是将数据集划分为大小相等的集合。例如，如果我们有一个大小为 400 的数据集，且  = 10 个折，那么每个折中的数据点数量为 40。如图 2.2
    所示，我们选择一个折作为测试折，其余的作为训练折。在 - 折交叉验证中，我们运行独立的学习实验。在这些子集中，我们选择一个作为测试集。其余 -1 个集合被合并为训练集。然后，我们训练一个机器学习算法，并在测试集上测试其性能。


    交叉验证的关键特征是我们多次运行算法，如前例中运行 10 次。然后我们计算十个不同保留集的十个不同测试集性能的平均值。即，我们计算这些实验测试结果的平均值。这显然需要更多的计算时间，因为我们必须运行独立的学习实验，但学习算法的评估将更加准确。此外，所有数据都用于训练和测试。这意味着每个数据样本都有机会被用于测试集
    1 次，并用于训练模型 -1 次。


    ![image](img/image068.png)


    图 2.2 10-折交叉验证示例


