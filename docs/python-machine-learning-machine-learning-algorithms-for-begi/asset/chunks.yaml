    # 2.3.2 Data Transformation


    ![image](d2d_images/chapter_title_below.png)


    Sometimes it is more convenient to deal with dataset in a specific format, rather
    than another. Here where the data transformation comes into picture. The goal
    of the data transformation is to switch the data values to other format or unit
    that makes the data analysis more meaningful (e.g. transforming a non-linear model
    into a linear one). Depending on the nature of the analysis required, it is decided
    whether a transformation is needed or not. Common transformation ways are:


    \-  Aggregation: It is a way of summarization, in which a group of values of the
    same variable can be expresses/aggregated in a single value. For example, multiple
    categories can be grouped into one category.


    \-  Normalization: This way of data transformation is followed when we want to
    express a group of data using a specific range. i.e., the data is scaled to fall
    within a small, specified range. This way is used, for example, in the communication
    systems where the Engineers prefer sometimes to express the base station’s power
    in a normalized power form. They scale the power values to lie within the range
    of 0 to 1. Common normalization ways are: 1) min-max normalization, 2) z-score
    normalization, and 3) normalization by decimal scaling. Choosing whether to normalize
    the data or not and the best ways of normalization depends on the nature of data
    you are dealing with.  


    \-  Generalization: It can be considered as another way of aggregation, from the
    summarization concept view. The idea is that the attributes that fall in low level
    are transformed to higher-level attributes. This process is also called: the hierarchy
    climbing.


    \-  Attribute construction: To simplify analysis, new attributes can be extracted
    from the already given attributes. This is what meant by attribute construction.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


