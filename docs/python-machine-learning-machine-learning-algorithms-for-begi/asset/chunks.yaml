    在“bias”命名的阶段中，如图 4.3 所示，我们可以注意到权重被求和并添加了一个偏置。这个和随后通过一个激活函数。激活函数形成一个开合的门。激活函数可以输出
    1 或 0，基于阈值进行判断，或者生成概率。关于概率部分，它可能使用 sigmoid 或整流线性函数。关于激活函数的更多内容将在本章后面讨论。


    激活函数的输出是神经网络的加权、预测输出。它在上图中表示为 ![image](img/image047.png)。![image](img/image047.png)可能是回归、二进制或分类值，具体取决于数据集的性质和所需的输出。


    | ![image](img/chapter_title_corner_decoration_left.png) ||  || ![image](img/chapter_title_corner_decoration_right.png)
    |


    | --- | --- | --- |


    ![image](img/chapter_title_above.png)


    # 5.4 激活函数


    ![image](img/chapter_title_below.png)


    在本节中，我们将快速回顾用于 ANN 的常见激活函数。


    \- 阈值或阶跃函数：如果权重和输入的和低于特定阈值，则为零；如果高于阈值，则为一。回顾我们之前讨论的门类比。


    \- Sigmoid 函数：它是最广泛使用的激活函数。它看起来像阈值函数，但更平滑。Sigmoid 激活函数适合生成概率。这意味着该函数的输出范围始终在零和一之间。例如，如果我们正在调查一张图片，输出将是它是猫还是狗的概率？！


    \- 双曲正切：这个函数是 sigmoid 函数的拉伸版本，因为它的范围是 -1 到 1。当我们需要更深的梯度和更陡的导数时，会选择这个函数。因此，sigmoid
    函数和双曲正切函数之间的选择取决于梯度强度要求。


    \- 整流线性单元 (RELU)：这个函数通常应用于强化学习应用。从其名称来看，它是一个经过整流的线性函数。这意味着它在负域中的值为零，并且线性增加，即对于正输入
    x，它给出输出 x，否则为零。RELU 的一个主要优点是与双曲正切和 sigmoid 函数相比的简单性。这是设计深度神经网络时需要考虑的一个主要点。


    根据我们试图近似的函数的特征，我们可以选择能实现更快近似的激活函数，这意味着更快的学习过程。例如，sigmoid 函数在分类问题中表现优于 RELU。这意味着更快的训练过程和更快的收敛。可以使用自定义函数。但是，如果我们试图学习的函数的性质不太清楚，那么最好从
    RELU 作为通用近似器开始，然后逆向工作。表 4.1 总结了所提及的激活函数及其图形表示和方程。


    | 激活函数 || 方程 || 图形 |


    | --- | --- | --- |


    | 阶跃单元 || ![image](img/image087.png) || ![image](img/image043.png) |


    | Tanh || ![image](img/image112.png) || ![image](img/image070.png) |


    | Sigmoid || ![image](img/image072.png) || ![image](img/image006.png) |


    | 双曲正切 || ![image](img/image014.png) || ![image](img/image029.png) |


    | 平滑 ReLU || ![image](img/image100.png) || ![image](img/image118.png) |


    表 5.1 激活函数


