    # 5.7.1 Gradient Descent


    ![image](d2d_images/chapter_title_below.png)


    In gradient decent, we focus on making accurate predictions in much less time
    than the case of estimating all of the possibilities, as mentioned before. The
    first step is to provide the neural network with initial values of weights. Then,
    we can pass in our data following the forward propagation way. Our mission now
    is to estimate the output ![image](d2d_images/image047.png)and compare it to the
    actual output . In most cases, the predictions resulted from the first run are
    not very accurate, i.e., we have a high error value.


    Assume we have a cost function for a specific value of . To make it simple we
    will assume numerical values. If the weight is 1.6 and the resulted cost function
    value, , is 3.2. We need to adapt the weight in the next run to reduce the value
    of the cost function. The question is: what if we could discover the way whether
    to make larger or smaller, in order to decrease the cost function?!


    What we are going to do is to test the cost function to the left and to the right
    at a specific test point. Then, we check which one of the two ways produces smaller
    cost function value. This method is called numerical gradient estimation. It is
    a good approach, but if we look back at the cost function equation (4.1), we can
    think in smarter way by utilizing derivatives, i.e., proceeding to the gradient
    decent concept. We want to know which way is downhill, leads the function to the
    minimum value. And in other words, we are going to check the rate of change of
    with respect to .


    What we need to do at this stage is to derive the of ![image](d2d_images/image018.png)which
    will give us the rate of change of with respect to . Then, at any value of if
    we have ![image](d2d_images/image018.png) positive then the cost function is directed
    uphill. Whereas if ![image](d2d_images/image018.png)is negative, the cost function
    is directed downhill. This mean that we now know which direction decreases the
    cost function. So that, we are able to speed up the tuning process. This is because
    we saved all the time needed in searching for values in wrong directions. Moreover,
    additional computational time is saved by taking steps iteratively at the direction
    that minimize the cost function and then stopping when the cost function is not
    getting smaller any more. This is the conceptual and practical realization of
    the gradient descent scheme. we may think of the gradient descent optimization
    as a hiker. The weight in this case is to climb down the hill towards the valley,
    which is the cost minimum. Following this analogy, we can determine each step
    by the slope steepness, the gradient, and the step distance of pay growth which
    is the analogy to the learning rate at this case.


    In the gradient decent, we have high and low learning rates. In our hiking analogy,
    the high learning rate is the case when we take big steps towards the valley before
    checking our position. This may end to the case where we never reach the minima
    of the cost function. On the hand, when small steps are taken, we boost up our
    opportunity in reaching the minima. However, this may take very long time. So
    that, we need to tune the learning rate empirically until we reach the minima.
    A smart solution is to think about the adaptive learning rate utilizing the gradient
    concept. That is, the steeper the gradient, the higher the learning rate and the
    smaller the gradient the smaller steps it takes to reach the final value.


    The gradient decent may not seem very special in one dimensional problems. However,
    it significantly decreases the time required to tune the neural network’s weights
    in higher dimensional datasets.


    An important issue to take care about when solving using the gradient decent is
    the convexity of the data. Sometimes the dataset we are dealing with may be a
    non-convex. This means that the cost function doesn''t always decrease while going
    in the same direction. Literally, the cost function in this case decreases and
    then increases again. This behavior is known mathematically as non-convex function.
    Example is shown in figure 4.5. In non-convex functions, the gradient decent method
    is not able to give accurate predictions any more since it will stick in local
    minima instead of spotting the global minima.


    ![C:\\Users\\Ahmed\\AppData\\Local\\Temp\\SNAGHTML2311786c.PNG](d2d_images/image083.png)


    Figure ‎5.5 Non-Convex data


    Here the reason of having a squared cost function is revealed. The sum of the
    squared error values enables us to utilize the convexity nature of the quadratic
    functions. Therefore, as the cost function equals the squared values of , then
    the plot of is a convex parabola.


    A main point to mention before finalizing our talk about the gradient decent is
    that the practical convexity of a dataset depends on how we deal with the data.
    Sometimes we can follow the principal: “one at a time instead of all at once sometimes”.
    In this case, we are not very interested in the overall convexity issue of the
    dataset. This talk leads to our discussion in the next section about the stochastic
    gradient descent.


