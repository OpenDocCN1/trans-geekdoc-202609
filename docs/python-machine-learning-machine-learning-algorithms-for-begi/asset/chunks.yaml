    ![image](d2d_images/chapter_title_above.png)


    # 2.3.3 Data Reduction


    ![image](d2d_images/chapter_title_below.png)


    The final step of data preparation is the data reduction. The aim of any dataset
    analysis is to get meaningful outputs that describe the large amount of dataset’s
    information, in simple words, or even in numerical values that can be then employed
    in the applications of interest. Large datasets analysis is complex and may take
    very long time. Sometimes, infeasible results may appear. That is why the principle
    of data reduction arises. The input data is reduced by introducing an effective
    representation of the dataset without affecting the accuracy of the original input
    data. Data reduction makes data easier to be analyzed by removing noise and the
    redundant records, so that, the task of the learning algorithms becomes more effective.
    The data reduction step has some pros and cons that have to be taken into account:


    \-  Pros: Decreases the data complexity, focuses on the most important attributes,
    reduces computational complexity of many algorithms and makes the results easier
    to be understood.


    \-  Cons: Depending on the nature of the dataset, the data reduction may not be
    needed. Another main disadvantage is that some of the main data may be thrown
    during the reduction process. Example, when representing multiple values as an
    average value.


    Last words that can be said about the data preparation step is that there are
    three basic rules which enable us to judge if a dataset is clean and prepared
    to be processed by a machine learning algorithm or not. 1) Every variable has
    a column of data, 2) Every observation has a row and 3) Every value has its own
    cell. Clean and prepared dataset are more easily to be visualized and processed
    by statistical analysis.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    | --- | --- | --- |


    ![image](d2d_images/chapter_title_above.png)


    # 2.4 Cross Validation Using -fold Technique


    ![image](d2d_images/chapter_title_below.png)


    Cross-validation is a statistical step applied on a data sample in order to check
    the validity of a machine learning model. In machine learning, the cross-validation
    technique is mainly utilized to evaluate and expect the performance of a machine
    learning model. The benefit of using this method is exploiting a small sample
    of data to expect how the machine learning algorithm is going to behave when applied
    to a new data that has not been used in the model training step.


    In the -Fold cross validation technique, a dataset is divided into a testing and
    a training data. The dataset is partitioned into folds of approximately equal
    size. The first fold is considered as a testing set, whereas the remaining − 1
    folds are the training sets. The -fold cross validation method is preferred over
    other validation method, since It is: 1) Easy to implement. 2) Easy to understand.
    3) Its results have lower bias than other methods.


    The parameter represents the number of sets that the dataset is to be divided
    into. That is how this method got the name -fold. When a certain value of is selected,
    it may replace the so the name becomes: for example, 10-fold cross validation
    if we choose to be 10. Now, the problem in the division process is that each fold,
    both testing and training folds, seeks to contain the max. number of data points,
    as seen in figure 2.1. when the number of data points in the testing set increase,
    the validation becomes better. Similarly, for the training set in which we get
    better learning results, when the number of its data points increases. Therefore,
    a trade-off exists between both of the sets. So that, each data point taken out
    of the training set into the testing set is a loss for the training set, and vice
    versa. This is where the cross-validation comes into the scene.


    ![image](d2d_images/image033.png)


    Figure ‎2.1 splitting dataset into testing and training folds


    The basic idea is to partition the dataset into sets of equal sizes. For example,
    if we have a dataset of the size of 400 and = 10 folds, then the number of data
    points in each of the 10 folds is 40. As seen in figure 2.2, we pick one of the
    folds as a testing fold and the other then as a training fold. In -fold cross-validation,
    we run separate learning experiment. In each of those subsets, we pick one as
    a testing set. The remaining -1 sets are put together into the training set. Then,
    we train out a machine algorithm and then the performance is tested on the testing
    set.


    The key feature in cross-validation is that we run the algorithm multiple times,
    10 times in the previous example. Then we calculate the average of ten different
    testing set performances for the ten different hold-out sets. i.e. we calculate
    the average of the test results from those experiments. This obviously takes more
    computing time since we have to run separate learning experiments, but the evaluation
    of the learning algorithm will be more accurate. Moreover, all data have been
    used for training and also for testing. This means that each sample of data is
    given the chance to be used in the testing set 1 time and used to train the model
    -1 times.


    ![image](d2d_images/image068.png)


    Figure 2.2 10-fold cross-validation example'
