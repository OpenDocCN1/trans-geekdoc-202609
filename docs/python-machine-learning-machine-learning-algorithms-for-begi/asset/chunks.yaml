- raw: 'Human power is normally limited. The heaviest weight ever lifted by a human
    being was 6,270 Ib (2,840 Kg)^(\[2\]). That was a great record compared to the
    average human power. However, it is nothing when compared to the power of machines,
    which had been invented by human himself to lift tens of tons of kilograms. This
    is a simple analogy to the realization of “machine learning” power and its capabilities.
    To imagine the situation, it is known that the data analysis and processing capabilities
    of a well-trained human is limited in terms of the amount of data being processed,
    time consumption and also the probability of making errors. On the other hand,
    the machines/computers designed, built and programmed by human can process a massive
    amount of data in much less time than human with almost no errors. Besides, electronic
    machine never takes a break and never let its own opinion affect its analyzing
    process and results.


    To grasp the concept of machine learning, take a corporate or a governmental distributed
    building for example, in which seeking the optimal energy consumption is the main
    goal. The building consists of walls, floors, doors, windows, furniture, a roof,
