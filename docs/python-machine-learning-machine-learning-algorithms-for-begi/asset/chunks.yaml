    # 5.6 The learning process (How the weights work)


    ![image](d2d_images/chapter_title_below.png)


    We normally need machines to be learnt since we have large amounts of data to
    be processed and analyzed. Therefore, is we have a large dataset, we feed its
    inputs into the neural network to make predictions. The first step is to determine
    the neurons weights. They can be determined based on initial assumption or they
    can be predefined based on the application features and the required output.


    The normal flow of the neural network is towards the output ![image](d2d_images/image047.png).
    That is, the input features are fed to the hidden layer where the calculations
    are performed. Then, the network flow continues until we have the desired output.
    This kind flow is known as: Forward Propagation. At this point, the smart error
    handling appears. The resulted ![image](d2d_images/image047.png)is compared to
    the actual value of . The target is to make the difference between them as small
    as possible, i.e. minimizing the error. This can be clearer if we imagine the
    analogy of a child learning math. If he answered a specific question with 8 while
    the accurate answer is 5, then we have an error of 3. In this case, the calculations
    have to be re-performed until we converge as close as possible to 8.'
