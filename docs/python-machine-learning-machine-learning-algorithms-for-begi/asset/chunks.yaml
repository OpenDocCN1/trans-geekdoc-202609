    # 2.4.2 How to fold, using Python


    ![image](d2d_images/chapter_title_below.png)


    Suppose that we have the following set of observations:


    ![image](d2d_images/image119.png)


    In order to divide this set, we need first to choose a value for . for this example,
    we will choose a value of =5. This means that we are going to divide the data
    into five partitions, in which each group will contain two observations, as follows:


    1-  Fold#1: \[0 2\]


    2-  Fold#2: \[4 6\]


    3-  Fold#3: \[8 10\]


    4-  Fold#4: \[12 14\]


    5-  Fold#5: \[16 18\]


    Therefore, with each fold, five models are trained and tested. Each fold has the
    chance to be a testing fold for the 5 separate learning experiments. That is,
    if we set fold#1 as testing set, then we have folds#2:5 as training set. In the
    next run, we have, for example, fold#2 as the testing set, so that, folds#1 &
    folds#3:5 are the training set, and so on. Now, these steps can be simply programmed
    using Python, utilizing the scikit-learn library. The code 2-7, performs the previously
    explained steps. The KFold command was imported from the scikit-learn library.
    It took two arguments: The value of , 5; and if a shuffle will be performed to
    the data. In our case we set the shuffle option to “False”.


    ![image](d2d_images/image027.png)![image](d2d_images/image073.png)


    If a shuffle is to be done, means “True”, a third argument has to be added to
    indicate the seed of the pseudorandom number generator. The “split” function is
    called repeatedly to return the groups of testing and training sets on each iteration.
    The output of the five folding process is as follows:


    ![image](d2d_images/image032.png)


    ––––––––


    ![image](d2d_images/scene_break.png)


    It is advisable to use the KFold to partition a dataset before modeling. All of
    the models shall then exploit the same partitions of the data. This is of main
    concern if we are processing massive amounts of data. Moreover, the employment
    of the same data partitions across the models is good for future statistical work
    that may be done later on the data.


