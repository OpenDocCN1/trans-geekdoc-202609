    # 5.4 activation function


    ![image](d2d_images/chapter_title_below.png)


    In this section, we will make a quick review for common activation functions used
    for the ANN.


    \-  Threshold or step function: If the sum of the weights and inputs is below
    a specific threshold it is zero and if it is above, it is one. Recall the gate
    analogy we talked about.  


    \-  Sigmoid function: It is the most widely used activation function. It looks
    like the threshold function but it is smoother. Sigmoid activation function is
    suitable for making probabilities. This means that the output range of the function
    will be always between zero and one. For example, if we are investigating a picture,
    the output will be the probability whether it is for a cat or a dog?!


    \-  Hyperbolic Tangent: This function is a stretched version of the sigmoid function,
    as it ranges from -1 to 1. This function is chosen when we want deeper gradient
    and steeper derivative. Therefore, the choice between the sigmoid or the hyperbolic
    tangent functions depends on the gradient strength requirements.


    \-  Rectifier Linear Unit (RELU): This function is normally applied in the reinforcement
    learning application.  From its name, it is a linear function that has been rectified.
    This means that it has the value of zero in the negative domain and it increments
    linearly, i.e. it for a positive input x, it gives an output x and it is zero
    otherwise. One major advantage of RELU is its simplicity compared to the hyperbolic
    tangent and the sigmoid functions. This is a main point to consider in designing
    the deep neural networks.  


    According to the characteristics of the function we are trying to approximate,
    we can choose the activation function that achieves faster approximation, which
    means faster learning process. The sigmoid function, for example, shows a better
    performance in classification problems than the RELU. This means a faster training
    process and also a faster convergence. One may use his own custom function. However,
    if the nature of the function we are trying to learn is not very clear, then it
    is preferable to start with RELU as a general approximator and then work backwards.
    Table 4.1 summarizes the mentioned activation functions along with their graphical
    representations and equations.  


