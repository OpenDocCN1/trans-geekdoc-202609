- raw: "Equation (4) is known as the linear regression equation. The values 0.2385\
    \ and 68.43 are called regression weights. The calculation process of these weights\
    \ is known as regression. Once we calculated the weights, we can utilize the regression\
    \ learning algorithms to make new predictions, given an unseen values/dataset.\
    \ This can be easily achieved by multiplying the inputs by the regression weights\
    \ and then adding them together to get a prediction. To grasp what have been done,\
    \ you may export this table into an excel sheet, then generate the scatter plot\
    \ of dataset in table 3.1. Then, the linear equation is plotted. The resulted\
    \ plot is as follows, in figure 3.1:\n\n![image](d2d_images/image020.png)\n\n\
    Figure ‎3.1 The scatter data and the linear regression equation plot\n\nThe line\
    \ generated by this equation is called: the trend line. An online linear regression\
    \ calculator is available on the link in the lower margin^(\\[8\\]).\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \ ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png) |\n\n\
    | --- | --- | --- |\n\n![image](d2d_images/chapter_title_above.png)\n\n# 3.1.2\
    \ Testing with ![image](d2d_images/image045.png)correlation:\n\n![image](d2d_images/chapter_title_below.png)\n\
    \nCorrelation is to estimate how close the trend line to fit the data points that\
    \ you have in your dataset. In other words, an estimation of the success of the\
    \ model. It can be somehow estimated by eye from the scatter plot, as we mentioned\
    \ before, but to make an exact decision we utilize the correlation coefficient;\
    \ named: ![image](d2d_images/image044.png). Normally, the closer ![image](d2d_images/image044.png)is\
    \ to 1, the better the line fits the data points. If ![image](d2d_images/image044.png)is\
    \ far from 1, the line definitely, will not fit the data. The correlation factor\
    \ equation is:\n\n![image](d2d_images/image004.png)\n\nUtilizing this equation\
    \ helps engineer or data scientist to make an exact expectation of the accuracy\
    \ of applying the regression algorithm.\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \ ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png) |\n\n\
    | --- | --- | --- |\n\n![image](d2d_images/chapter_title_above.png)\n\n# 3.2 Classification\
    \ Using Decision Tree\n\n![image](d2d_images/chapter_title_below.png)\n\nA lot\
    \ of resources discuss the classification and concentrate on the K-nearest neighbor\
    \ method. We will talk about it briefly whenever we need it in this book. However,\
    \ in this chapter that cares mainly about the supervised learning we are presenting\
    \ the decision tree classification as an example of the supervised machine learning\
    \ algorithms.\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \ ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png) |\n\n\
    | --- | --- | --- |\n\n![image](d2d_images/chapter_title_above.png)\n\n# 3.2.1\
    \ Introduction to the Decision Tree \n\n![image](d2d_images/chapter_title_below.png)\n\
    \nHave you ever accessed the “Ask Akinator” online game? For those who do not\
    \ have a close understanding of the datasets and the data science concept, this\
    \ game will appear like a kind of magic or paranormal power! In this game, you\
    \ have to think about a specific character. Then, the Blue Genie will start to\
    \ ask you a series of questions like: “Is your character a YouTuber”? “Does your\
    \ character really exist?” and so on. What the game does is a successful splitting\
    \ of the set of characters it can deduce. If you repeat the game for different\
    \ characters you will notice that things are working in a branching principal.\
    \ i.e., every answer leads to a specific set of questions that shrink the circle\
    \ around the possible answer and cancel a new portion of possibilities. For example,\
    \ if you answer the first question with “Yes”, the game will exclude the Non-YouTuber\
    \ persons from its potential decision. The decision tree technique works just\
    \ like the Akinator game; you give it a set of data and it generates answers to\
    \ the game.\n\nThe decision tree is a famous and a widely used classification\
    \ technique. The decision tree concept is simple and the “How it works” can be\
    \ illustrated even to people with almost no knowledge about the machine learning.\
    \ You may have already seen a decision tree application without knowing it is\
    \ a decision tree based. In figure 3.2 a flow chart example of the decision tree.\
    \ You can notice that the flow goes in a branching manner, where finally you reach\
    \ to a decision. In this particular example, the algorithm checks the domain of\
    \ the sent email and classifies it depending on its domain. This example is a\
    \ hypothetical system. So that, if the domain is equal to MyOffice.com, the algorithm\
    \ will classify it as “Urgent”. If it is not, it makes another check to ensure\
    \ if the email includes the word “University”. If the text contains the word “University”,\
    \ then this email is categorized as “Important”. If not, the algorithm checks\
    \ for the word: “Advertisement”. If the email contains it, the email will be classified\
    \ as “Spam”. Otherwise, it will end to the category: “To be Read later”. \n\n\
    ![image](d2d_images/image056.png)In this section, our decision tree algorithm\
    \ will have the ability to deal with the input datasets and draw, implicitly,\
    \ a tree like shown in figure 3.2. The decision tree makes a good job of translating\
    \ general data into a useful knowledge. The decision tree machine learning algorithm\
    \ creates rules that classify the unfamiliar datasets. Decision trees are common\
    \ in expert systems, and they give perfect results compared to those produced\
    \ by human expert with long periods of experience in a certain field.\n\n––––––––\n\
    \n![image](d2d_images/scene_break.png)\n\nFigure ‎3.2 Decision tree flow chart\n\
    \nNote: In this figure, the diamonds are decisions that are upon some conditions.\
    \ The ovals are terminations.\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \ ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png) |\n\n\
    | --- | --- | --- |\n\n![image](d2d_images/chapter_title_above.png)\n\n# 3.2.2\
    \ Decision Tree Construction\n\n![image](d2d_images/chapter_title_below.png)\n\
    \nBefore applying the decision tree algorithm to a dataset, we need first to specify\
    \ the feature the splitting process will be based on. If you do not have a clear\
    \ idea about the most feature that rule the dataset, you may try different suggested\
    \ features until you get the best results. This results in subsets out of the\
    \ original dataset. Practically, each subset represents a desired feature. Therefore,\
    \ the subsets keep splitting depending on the features as they travel down the\
    \ branches. When the data on the branches is the same class, we have classified\
    \ it and we do not have to continue the splitting process. Else, the algorithm\
    \ has to be repeated until we have classified all the data. The decision tree\
    \ algorithm is summarized in table 3.3. From the table, you can notice the recursive\
    \ nature of the algorithm; as it calls itself until all data is classified. A\
    \ python code will be written throughout our talk about the decision tree section.\
    \ \n\n| Decision Tree Algorithm |\n\n| --- |\n\n| \n\n\\-  Each object in the\
    \ given dataset is in the same class/category. \n\n |\n\n| \n\n\\-  If Yes, return\
    \ the name/label of the category\n\n |\n\n| \n\n\\-  Else, try another feature\
    \ to divide the dataset\n\n |\n\n| \n\n\\-  Make a new a branch node \n\n |\n\n\
    | \n\n\\-  For every divide iteration \n\nCall the “decision tree algorithm” and\
    \ add the results to the new branch node\n\nReturn branch node\n\n |\n\nTable\
    \ ‎3.3 Summary of the Decision Tree Algorithm\n\nA common way of splitting data\
    \ in the decision tree is the binary split. But suppose that we have followed\
