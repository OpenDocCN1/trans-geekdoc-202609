    \- Results are affected significantly by the initial choice of labels. Moreover,
    the algorithm may converge at local minima. Suggested solution is to restart the
    clustering algorithm multiple times with different random labels.


    \- Slow on very large datasets. This can be solved using sampling.


    \- High sensitivity to outliers.


    \- When the values are very large, the mean may be skewed. In this case, the median
    can be used instead of mean.


    The -means method approach can be summarized in the following three steps:


    1- Choose, randomly, a number of centers for the cluster.


    2- Assign every point in the given data to its closest cluster’s center. The assignment
    continues until finding the nearest centroid using methods such as Euclidean distance.


    3- The centroids are all then updated by moving each of them to the average of
    its assigned points.


    4- The steps two and three are repeated, till a convergence reached. i.e. when
    the cluster assignment change becomes less than a specific threshold.


    The flow chart in figure 4.1 explains how the code of the algorithm looks.


    Figure 4.1 -mean clustering algorithm, flow chart


    # 4.2 Bias and Variance


    Prediction models’ errors can be caused by three main components: bias, variance
    and irreducible errors. In large datasets, there might be a number of undefined
    variables. These variables may affect the input to output mapping relationship.
    Therefore, the irreducible error is resulted. As can be understood from its name,
    there is no way to decrease the irreducible error, whatever learning algorithm
    is employed. Therefore, we care here mainly about: bias and variance errors, since
    there is a tradeoff between a machine learning model''s capability to minimize
    bias and variance. investigating the two errors helps us in expecting model results
    and avoiding the problems of overfitting or underfitting.


