    # 5.5 Working Example


    ![image](d2d_images/chapter_title_below.png)


    In this section we are giving an example that translates some of the concepts
    that explained in the previous sections. Suppose that we have a trained neural
    network, figure 4.4. This means that we have the weights optimized as seen in
    the figure. The input layer contains a group of features: age, distance to the
    hospital, gender and income. The output on the other hand, is the variable that
    is dependent on the input features. It is the probability that a person will be
    hospitalized. If we take the age, for example, we can state that the older the
    person, the more likely he/she will be hospitalized. In terms of gender, statistically
    men are more likely to be hospitalized than women. The data collected can be utilized
    to make several predictions depending on the input features and this is the realization
    of the neural networks job. The hidden layer in this example was considered as
    a black box which contains the neurons and weights that result in the hospitality
    probability. The machine can be trained to predict the relation between the distance
    to the hospital and the probability of being hospitalized. Therefore, the neural
    network has to try first to find patterns in the data and figure out the relations
    between these different patterns. This is a kind of understanding data before
    making other processing or decisions. once trained, we are able to input different
    features extracted from the targeted dataset. For example, one record can be something
    like that: Age is 65 years old, gender is female, moderate distance to the hospital
    and high income. The neural network is a magical method that expect and predict
    the desired results after processing the features in a smart way that mimics the
    human neuron.


    The neural network estimates the different combinations of the input features
    to identify patterns in the dataset based on the neural network architecture.
    It may be seen as a black box, but a deeper look allows us to see patterns amongst
    the weights, inputs and hidden layers.


    ![image](d2d_images/image061.png)


    Figure ‎5.4 Neural Network, Hospitality Probability Example


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
