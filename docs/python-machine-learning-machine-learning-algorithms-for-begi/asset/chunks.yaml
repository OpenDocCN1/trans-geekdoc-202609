    # 1.3 Machine Learning Categories


    ![image](d2d_images/chapter_title_below.png)


    The categorization of the machine learning algorithms depends normally on the
    purpose of processing a specific data. Therefore, it is important to identify
    the learning categories to be able to choose the more suitable way. The machine
    learning models are divided in general into: supervised and unsupervised learning.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
