    to the algorithm/network and the required output is known. In neural networks,
    the weights are tuned till the output meets the desired value. In the unsupervised
    learning we have a data that we are trying to understand and extract its features.
    Therefore, in neural networks, the input data is utilized to train the network
    with a known output. The network then clusters the data and adjust the weights
    by extracting the features from the input data. In the Reinforcement Learning,
    we do not know the output. However, the neural network can give a feedback telling
    if the input is right or wrong. This type of learning is also called a semi-supervised
    learning. Offline, or batch, learning makes the required tuning to the weights
    and to the threshold only after employing the training dataset to the network.
    Finally, in the Online learning, opposite to the offline learning, the tuning
    process of the weights and the threshold is made after employing each string example
    to the network.


    # 5.9 Neural Networks Applications


    A lot of things we encounter daily use the recognition of patterns and exploit
    this results in making decisions. Therefore, neural networks have the ability
    to be adopted in daily life applications and missions. Examples of using neural
    networks are in stock market, weather predictions, radar systems to detect the
    enemies’ aircrafts or ships. It can be also used to doctors in diagnosing complex
    diseases on the basis of their symptoms. Neural networks are in our computers
    or smart phones. They can be programmed to identify images or handwritings. certain
    neural network can monitor some parameters to spot the characters you are typing,
    such as: the lines you are making, your fingers’ movements and the order of your
    movements. Voice recognition programs are another example that significantly utilize
    the neural networks technique. Some email programs or tools have the ability to
    separate the genuine emails out from the spam emails. These programs also use
    neural networks. Neural networks have shown a high efficiency in text translation,
    from language to another. Google online translator is one of the famous tools
    that employs neural networks over the last years to enhance the machine performance
    in converting/translating words from language to another.


    # CHAPTER Six


    # BUILDING A MACHINE LEARNING MODEL


    # 6.1 How to Develop a Machine Learning Application


    The basic approach to develop a machine learning model can be summarized in the
    following steps:


    1- Data Collection: Data or samples can be collected from the internet, RSS feeds
    or API. Researchers may have collective devices that record test results such
    as: wind speed data, blood glucose level, salts or minerals in water, or any other
    data of interest. There are almost endless options. However, sometimes using available
    samples may save a lot of time and effort. Examples of publicly available datasets
    repositories are shown in Appendix B.


    2- Input Data Preparation: Once we got our data, we need to check if it is read
    and in a useable format. This step guarantees that our data is ready to be used
    in the learning algorithm. In chapter two, we discussed the data preparation methods
    in detail and showed how to clean it from noise and how to solve the missing data
    problem, and other necessary methods that make the dataset able to give meaningful
    results. The data preparation and scrubbing are usually non-trivial compared to
    collecting data.


    3- Input data analysis and human involvement: This is a manual analysis step.
    For example, we need to check that the previous two steps worked fine and no empty
    values exist. An estimation of the data may be done in order to recognize if there
    are some patterns that can describe the data or data values that are obviously
    different from the other points in the dataset. Sometimes, creating data plots
    in either two or three dimensions may be very useful. However, there are normally
    more than three dimensions/features that describe the data and one cannot generate
    the data plots across all the dimensions easily, at a one time. Therefore, dimension
    compression methods can be employed to compress the multiple dimensions to two
    or three in which the data can be visualized. Considering the human involvement,
    for automated systems and trusted data sources, it may be very limited or unneeded.
    For example, if the data source is from a production system and we have an idea
    how the data is going to behave, this step can be skipped. The main benefit of
    this step is that it enables us to check that there is no garbage in the dataset.

