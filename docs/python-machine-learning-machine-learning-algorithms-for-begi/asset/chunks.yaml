    of a machine learning model and the correct value which we are seeking to know.
    If we have only one model, speaking about average means that we have to run the
    model multiple times, then compare the average of the resulted values out of those
    runs with the correct value we are trying to predict. In general, machine learning
    algorithms which concern themselves with numeric analysis and results, called
    parametric algorithms, encounter high bias. These kinds of algorithms are simple
    and they learn fast. On the other hand, in complex problems, the parametric algorithms
    have poor predictive abilities, which make them less flexible. The difference
    between low and high bias algorithms, is that the first makes low number of assumptions
    about the required output. On the other hand, the latter makes more assumptions.
    Common examples of the low bias learning algorithms are: the k-Nearest Neighbors
    and the Decision Tree. Linear Regression and Discriminant Analysis are examples
    of the high bias learning algorithms.


