    ![image](d2d_images/chapter_title_above.png)


    # 1.3.1  Supervised Learning


    ![image](d2d_images/chapter_title_below.png)


    When a machine has a set of inputs that lead to an output, in which the output
    nature had been determined by a supervisor, this machine basically follows a supervised
    learning algorithm. The supervision term does not necessarily mean human intervention.
    It means that the computer has a target and he needs to create and tune functions
    that pave the way to this target. This kind of algorithms is also called: predictive
    algorithm. This is because there is an output that is being predicted depending
    on set of inputs. Being predictive does not only relate to future talk. It also
    includes the cases when an algorithm infers a current or even a previous event.
    An obvious example about the present case is the traffic lights, which can be
    optimally controlled depending on a related dataset following a predictive algorithm.
    In the past events prediction scenario, for example, doctors can predict the specific
    date of a pregnancy knowing the mother''s current level of hormone.


    Common algorithms of supervised machine learning are Classification and Regression.
    In classification, the mission is to determine what category a group of data or
    observations should belong to. The use of classification is very wide in machine
    learning problems. For example, in cellular communication system, the classifier
    technique can be used to divide a geographical area into femtocell, picocell or
    micro cell according to the number of users, nature of the area, number of building,
    signal fading, etc.


    Regression, on the other hand, is employed whenever we want to predict a numeric
    data. This way of supervised learning can be utilized, for example, to predict
    certain test scores, lab results, the price of second-hand cars, etc. Figures
    1 and 2 shows examples of classification and regression schemes. Classification
    and regression algorithms will be discussed later in this book.


