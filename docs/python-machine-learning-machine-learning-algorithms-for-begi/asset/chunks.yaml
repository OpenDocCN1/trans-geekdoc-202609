    # 1.4 Benefits of Applying Python in Machine Learning Programming


    ![image](d2d_images/chapter_title_below.png)


    For machine learning algorithms, we must have a programming language that is clear
    and easy to be understood by a large portion of data researchers and scientists.
    A language with libraries that are useful for different types of work and in matrix
    math in specific will be preferable. Moreover, it is of a very good advantage
    to use a language with a large number of active developers. These features make
    the arrow point to the Python as the best choice. The main advantages of Python
    can be summarized in the following points:


    \-  Its syntax is clear.


    \-  Easy to manipulate texts.


    \-  It is used by a high number of people and communities.


    \-  Possibility of programing in different styles: object-oriented, procedural,
    functional, etc.


    \-  Ideal for processing non-numeric data.


    \-  Ability to extract data from HTML.


    \-  Common in the scientific and also the financial communities. Therefore, there
    is a seamless connection between the two fields especially in the machine learning
    as the financial field is one of the main sources of the datasets.


    \-  Contains useful libraries such as SciPy and NumPy which enables us to perform
    operations on vectors and matrices. The installation of Python and also adding
    these libraries and other, are shown in Appendix A.


