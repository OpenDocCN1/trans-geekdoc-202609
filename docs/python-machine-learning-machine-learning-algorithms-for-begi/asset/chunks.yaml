- raw: 'The neural network utilizes the weights in its task to minimize the resulted
    error. It reduces the weights of the neurons that makes significant contribution
    to the error. This process is known as: Back Propagation.  This is because in
    this tuning process we travel back from the output to the neurons and input, in
    order to locate where exactly the error happens. Here is where the importance
    of the activation functions comes to the surface. The activation functions are
    differentiable and this helps in performing the backpropagation process through
    the neural network; by computing the gradients. Hence the weights are adjusted.
    The simultaneous adjusting process of the weights continues until we have a neural
    network output that is close to the actual output. The weights are slightly adjusted
    in each iteration to have a smaller error at each run. The process is repeated
    for all the inputs and outputs possibilities of the training dataset until the
    error is significantly small and acceptable by the application.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    | --- | --- | --- |


    ![image](d2d_images/chapter_title_above.png)


    # 5.7 How the back propagation is performed?!


    ![image](d2d_images/chapter_title_below.png)


    The following equation is a representation of the simplified cost function in
    a neural network:


    ![image](d2d_images/image120.png)(4.1)


    in equation (4.1) is the squared error between the predicted output ![image](d2d_images/image047.png)and
    the actual output . Conceptually, we can produce a plot between the error and
    the predicted output ![image](d2d_images/image047.png). Then, all the possibilities
    of the weights in the network can be tried using methods like the Brute-Force
    technique. This is supposed to produce a result like a parabola of data. However,
    this easy approach requires imaginational computing power for large dataset to
    examine all the probabilities. To clarify it, for a moderate sized dataset we
    may need hundreds of years to tune the weights and get the results! Here where
    weights optimizing techniques comes to the surface.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


