    # 5.9  Neural Networks Applications


    ![image](d2d_images/chapter_title_below.png)


    A lot of things we encounter daily use the recognition of patterns and exploit
    this results in making decisions. Therefore, neural networks have the ability
    to be adopted in daily life applications and missions. Examples of using neural
    networks are in stock market, weather predictions, radar systems to detect the
    enemies’ aircrafts or ships. It can be also used to doctors in diagnosing complex
    diseases on the basis of their symptoms. Neural networks are in our computers
    or smart phones. They can be programmed to identify images or handwritings. certain
    neural network can monitor some parameters to spot the characters you are typing,
    such as: the lines you are making, your fingers’ movements and the order of your
    movements. Voice recognition programs are another example that significantly utilize
    the neural networks technique. Some email programs or tools have the ability to
    separate the genuine emails out from the spam emails. These programs also use
    neural networks. Neural networks have shown a high efficiency in text translation,
    from language to another. Google online translator is one of the famous tools
    that employs neural networks over the last years to enhance the machine performance
    in converting/translating words from language to another.


