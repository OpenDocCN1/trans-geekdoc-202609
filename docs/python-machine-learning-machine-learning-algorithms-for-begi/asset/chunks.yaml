    # 5.2 Artificial Neural Networks


    ![image](d2d_images/chapter_title_below.png)


    An Artificial Neural Network (ANN), is a computational model benefits the idea
    of the biological neural networks, as depicted previously. The artificial neural
    network is a machine learning way that mimics the human intelligence in dealing
    with data. Neural networks are a remarkable class of supervised machine learning
    algorithms. They are employed in both regression and classification. In this chapter,
    we will discuss the basics of neural networks, and show a practical example at
    the last section. Other known types, uses according to the data to be analyzed,
    are convolutional and recurrent neural networks. The first showed very good performance
    in image processing. Recurrent networks, on the other hand, achieved a very well
    level of performance in sequential data related problems such as dynamic system
    modeling and natural language analysis.


    There are, mainly, three different layers in neural networks:


    1.  The input Layer.


    2.  The hidden Layers: In this layer, the inputs received from the previous layer
    are processed. The hidden layer can contain more than one layer.


    3.  The output Layer: After having the data processed, it becomes available in
    this layer.


    Figure 4.1 shows a graphical representation of the neural networks’ three layers.
    It can be noticed that the variables are represented by nodes. The network layers
    are distinguished via colors: red, green, blue, for input, hidden and output layers,
    respectively. Let us define X0 and H0 as dummy variables. They always take the
    value of one. The dummy variables are shaded in figure 4.1.


    ![image](d2d_images/image024.png)


    Figure ‎5.2 Neural Network layers


    1-  Input Layer:


    The Input layer rule is to interact with the external environment. It deals with
    the inputs come from the data sources. The input is then transferred to the hidden
    layer. Each input represents an independent variable which affects the output
    of the network. The inputs are some features such as: Height, Age, weight, image
    data or hours of sleep.


    2-  Hidden Layer


    The hidden layer is the intermediate layer, lies between the input and the output
    layers. It consists of the group of neurons that have activation function applied
    on it. The job of the hidden layer is to deal with and process the inputs got
    from the previous layer. Therefore, its responsibility is to extract features
    of interest from the input data. The hidden layer can include more than one hidden
    layer. So that, one of the problems to be considered is the choice of the number
    of the hidden layers depending on the learning category. If the input data can
    be linearly separated, then we can skip the hidden layer. This is because the
    activation function can be designed to input layer that is able to solve the problem.
    In the problems that have complex decisions to make, three to five hidden layers
    can be used. In the case of multiple hidden layers, the symbol will have a superscript
    that indicates the hidden layer number. A neural network with more than one hidden
    layer is also referred to as deep learning or a deep neural network


    The choice of the number of hidden layers depends on the problem complexity or
    on the level of the required accuracy. Of course, this does not mean that if one
    keeps increasing the number of hidden layers makes the neural network becomes
    more accurate. The algorithm will reach a level in which adding extra hidden layer
    will not affect its steady state output, or sometimes may cause the results to
    fall below the best reached performance. This means that the accurate calculation
    of the number of neurons per network is a very important step, either to meet
    the dataset’s complexity or to avoid overfitting. 


    3-  Output layer


    The output layer is the stage where we got the values that we want to predict.
    A good benefit of the neural networks is that the output pattern can be traced
    back to the input layer. This means that there should be a logical relation between
    the number of neurons in output layer and the type of work performed by the neural
    network. The number of neurons in the output layer is related to the intended
    use of the neural network.


    \-  Latent variables


    In the neural networks, the latent variable term is common. However, it is not
    very new to the reader of this book. Recalling from the chapter three, the Regression
    analysis section, when we looked at the relationship between the dependent and
    independent variables. Latent variables are functions of the inputs. This relation
    is expressed by edges, in neural networks. each edge flows from left to right,
    which means that every variable that receives and edge is a function of the variable
    from which the edge comes and also the weight associated with this edge. From
    figure 4.1, we can notice that each variable in the hidden and the output layers
    is a function of all previous layer variables, except the bias variable H0 which
    has the value of 1.


    \-  Deep Learning and Deep Neural Networks


    As said before, the number of the hidden layers may be more than one layer. This
    results in, mainly, two types of neural networks depending on the number of hidden
    layers: deep and shallow neural networks. Of course, the deep category refers
    to the neural networks that have more than one hidden layer. This distinguish
    is essential because we cannot use the non-linear transformations that fit the
    shallow neural networks in deep networks; as that may result in poor performance.
    In the hidden layer, it is common to use functions that are known as activation
    functions. In section 4.4, we present famous activation functions. As will be
    noticed, they are all almost non-linear function of the weighted sum of the variables
    in the layer. Using these functions to produce a hidden layer means that a non-linear
    transformation is needed. In deep neural networks, we surely have more than one
    hidden layer which means that we have to perform some feature transformations
    on the original input features.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    | --- | --- | --- |


    ![image](d2d_images/chapter_title_above.png)


    # 5.3 The Flow in the Neural Network


    ![image](d2d_images/chapter_title_below.png)


    Every neuron, in the ANN, represents an activation node. The activation node is
    connected to the input nodes in order to apply learning algorithms to calculate
    the weighted sum. The weighted sum is then passed to an activation function which
    leads to predict the results. Here where we have the concept of “a perceptron”
    arises.  Perceptron means things that take many inputs that lead to one output.


    In figure 4.3, we have inputs that are direct independent variables or outputs
    from other neurons. Every input has a weight of . The importance of weights is
    that they are indications of the significance of inputs. In other words, as a
    weight goes higher, the input has a greater contribution to the output results,
    and vice-versa.  As can be seen from figure 4.3, every perceptron has a bias that
    is an indication of the flexibility of a perceptron. The bias can be compared
    to the constant in the famous line equation: , as it enables us to adapt the line
    either up or down to have better prediction results. As known from simple elementary
    algebra rules, if we do not have the constant ,  the line will always pass through
    the origin point and in our case in machine learning, we will have poor results.
     


    ![image](d2d_images/image048.png)


    Figure ‎5.3 Detailed Neural Network'
