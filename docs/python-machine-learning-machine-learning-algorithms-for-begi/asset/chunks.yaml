    # 1.2 Machine Learning and Classical Programming


    ![image](d2d_images/chapter_title_below.png)


    It is very common to know a programmer who implements an algorithm via a programming
    language. The programmer gives the chip/machine specific program commands, containing
    the input parameters and the expected kind of outputs. The program then runs and
    processes the data, while being restricted by the code entered by the programmer.
    This kind of programming does not contain the realization of “Learning” which
    means the ability to develop solution based on background examples, experience
    or statics. A machine equipped with a learning algorithm is able to take different
    decisions that is suitable for every situation.  


    Practically, in machine learning, the computer concludes automatically to an algorithm
    that can process the dataset to produce the desired output. whereas, the concept
    is different in classical machine programming. Take, for example, the sorting
    algorithm. We have already many sorting algorithms that can deal with our inputs
    and give us a sorted output. Our mission here is just to choose the best sorting
    algorithm that can do the work efficiently. On the other hand, in machine learning,
    there exists many applications in which we do not have classical algorithms that
    are totally ready to give us the desired output. Instead, we have what is called:
    example data. In the machine learning era, no instructions are given to the computers
    telling them what to do. The computers have to interact with datasets, develop
    algorithms and make their own decisions like when a human analysis a problem,
    but with much more scenarios and faster processing!  


