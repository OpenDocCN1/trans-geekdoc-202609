    # 5.5 工作示例


    ![image](img/chapter_title_below.png)


    在本节中，我们将给出一个示例，翻译前几节中解释的一些概念。假设我们有一个训练好的神经网络，如图 4.4 所示。这意味着我们有优化后的权重，如图所示。输入层包含一组特征：年龄、到医院的距离、性别和收入。另一方面，输出是依赖于输入特征的变量。它是一个人住院的概率。如果我们以年龄为例，可以说人越老，越有可能住院。就性别而言，统计上男性比女性更有可能住院。收集的数据可以用于根据输入特征进行多种预测，这就是神经网络工作的实现。本示例中的隐藏层被视为一个黑盒，包含产生住院概率的神经元和权重。机器可以被训练以预测到医院的距离与住院概率之间的关系。因此，神经网络必须首先尝试在数据中找到模式，并找出这些不同模式之间的关系。这是在进行其他处理或决策之前对数据的一种理解。一旦训练完成，我们就可以输入从目标数据集中提取的不同特征。例如，一条记录可以是这样的：年龄
    65 岁，性别为女性，到医院的距离适中，收入高。神经网络是一种神奇的方法，它以一种模仿人类神经元的聪明方式处理特征后，来预期和预测所需的结果。


    神经网络根据神经网络架构估计输入特征的不同组合，以识别数据集中的模式。它可以被视为一个黑盒，但更深入的观察使我们能够看到权重、输入和隐藏层之间的模式。


    ![image](img/image061.png)


    图 5.4 神经网络，住院概率示例


    | ![image](img/chapter_title_corner_decoration_left.png) ||  || ![image](img/chapter_title_corner_decoration_right.png)
    |


    | --- | --- | --- |


    ![image](img/chapter_title_above.png)


    # 5.6 学习过程（权重如何工作）


    ![image](img/chapter_title_below.png)


    我们通常需要机器学习，因为我们有大量数据需要处理和分析。因此，如果我们有一个大型数据集，我们将其输入馈入神经网络以进行预测。第一步是确定神经元的权重。它们可以基于初始假设确定，也可以根据应用特征和所需输出预定义。


    神经网络的正常流向输出 ![image](img/image047.png)。也就是说，输入特征被馈入隐藏层，在那里进行计算。然后，网络流继续，直到我们得到所需的输出。这种流被称为：前向传播。此时，智能错误处理出现。得到的
    ![image](img/image047.png)与实际值进行比较。目标是使它们之间的差异尽可能小，即最小化错误。如果我们想象一个孩子学习数学的类比，这会更清晰。如果他对一个特定问题回答
    8，而准确答案是 5，那么我们就有 3 的错误。在这种情况下，计算必须重新执行，直到我们尽可能接近 8。


