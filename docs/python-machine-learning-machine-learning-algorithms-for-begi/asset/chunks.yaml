    # 4.2.3 Graphical Explanation of the Bias and Variance


    ![image](d2d_images/chapter_title_below.png)


    A friendly and simple graphical explanation of bias and variance can be created
    using a bulls-eye diagram. Let the center of the eye represent the correct values
    of a specific models. The further we go from the eye center, the worse are the
    prediction results. In the bull-eyes shown in figure 4.2 below, every black dot
    represents an individual run of the model. In case of low bias, the model realizations,
    dots, are very close to the center of the bull-eye. On the other hand, in case
    of low variance, the model realizations are very close to each other, regardless
    of their distance from the center of the bull-eye. When we have a good distributed
    training data, we predict very well and we are close to the bulls-eye. In turn,
    when the training data full of outliers or noisy data, the predictions will be
    far from the bull’s eye.


    ![image](d2d_images/image015.png)


