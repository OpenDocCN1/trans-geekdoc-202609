    # 4.2.4 Trade-Off Between Bias and Variance


    ![image](d2d_images/chapter_title_below.png)


    The machine learning algorithms aim to attain low bias and variance outputs. However,
    as we seen in sections one and two of this chapter, there is a trade of between
    the variance and the bias in the machine learning algorithm. Figure 4.3 summarized
    this idea.


    ![image](d2d_images/image053.png)


    Figure ‎4.3 Trade-off between variance and bias


    In machine learning, there is no escaping the relationship between bias and variance.
    That is, as shown in Figure 4.3, increasing the bias will decrease the variance
    and vice versa. Therefore, the process of choosing the suitable parameters for
    a machine learning algorithm is usually a struggle to balance between bias and
    variance. As an example of the bias-variance trade-off for the -nearest neighbors
    algorithms are as follows:


    \-  The -nearest neighbors (KNN) is a common supervised machine learning algorithm.
    It shows low bias and high variance. However, if the value of the neighbors increases,
    the trade-off situation becomes different. In other words, the increase in the
    number of neighbors increases the contribution to the prediction process and hence
    increases the bias of the model.


    This indicates that a careful configuration should be done to the selected machine
    learning algorithm in order to achieve a balance in this trade-off for the learning
    problem. Bias and variance are important methods to have an acceptable guide and
    impression about the predictive performance of machine learning algorithms.


