    # 2.1 Data Scrubbing  


    ![image](d2d_images/chapter_title_below.png)


    Data scrubbing, also called data cleansing, is a very important step before applying
    any machine learning algorithm. Dataset are normally drawn from real world sources
    which produce large amounts of messy datasets. Examples of sources are statistics,
    or massive amounts of records generated from organizations that work in data-intensive
    fields such as banking, communication systems, insurance, or transportation. These
    messy data might have noisy entries, missing data or have records that contradicts
    with each other. There are several reasons for why this may happen. Noise usually
    affects the data because of the hardware limitations and problems, as these can
    act as noise sources. For example, if a blood sample is tested by a medical device
    that encounters a problem, the device measurements may be affected and vary on
    each run for the same sample. If the device is connected to a database via a network,
    the unstable readings may be transferred automatically to the database regardless
    of the erroneous that happened. Noisy data can also be generated by human when
    he makes faults. Missing data problem, on the other hand, may occur due to technical
    issues, such as a server or a network hang during data transfer, or because of
    manual data entry. These errors combined; noisy data and missing data problems,
    may lead also to a third class of messy data, called: data contradiction. Based
    on that, the data scrubbing step is very important before starting the learning
    process.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    | --- | --- | --- |


    ![image](d2d_images/chapter_title_above.png)


    # 2.1.1 Noisy Data


    ![image](d2d_images/chapter_title_below.png)


    When there is a difference between the model and the measurements, there exists
    a “noise” that causes an error or variance. Examples of methods that deal with
    noisy datasets are as follows^(\[3\])^,^(\[4\]): 


    Binning methods:


    In this method, the data is sorted and then smoothed by considering its neighborhood
    or surrounding values. This is called a local smoothing.


    Clustering:


