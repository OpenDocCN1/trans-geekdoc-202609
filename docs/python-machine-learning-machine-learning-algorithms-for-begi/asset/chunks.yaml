    # 5.8 Understanding Machine Learning Categories in the Context of Neural Networks


    ![image](d2d_images/chapter_title_below.png)


    First, let us make a quick review of the datasets types and how it is reacting
    with the neural networks. Mainly, we have three types of dataset:


    \-  A training dataset: it is a group of data samples that are utilized for the
    learning process. Therefore, in the neural networks at this stage.


    \-  A validation dataset: a set of samples which is used to adjust the network
    parameters. For example, in the neural network, it can be used to choose the number
    of hidden layers.


    \-  A test dataset: This set is a group of examples that are used to check the
    performance of the neural network after having it fully built. Moreover, it can
    be used to predict the output whose input is known. It is also used to ensure
    that we do not overfit our data.


    We know from the supervised learning that we have a training data as the input
    to the algorithm/network and the required output is known. In neural networks,
    the weights are tuned till the output meets the desired value. In the unsupervised
    learning we have a data that we are trying to understand and extract its features.
    Therefore, in neural networks, the input data is utilized to train the network
    with a known output. The network then clusters the data and adjust the weights
    by extracting the features from the input data. In the Reinforcement Learning,
    we do not know the output. However, the neural network can give a feedback telling
    if the input is right or wrong. This type of learning is also called a semi-supervised
    learning. Offline, or batch, learning makes the required tuning to the weights
    and to the threshold only after employing the training dataset to the network.
    Finally, in the Online learning, opposite to the offline learning, the tuning
    process of the weights and the threshold is made after employing each string example
    to the network.


