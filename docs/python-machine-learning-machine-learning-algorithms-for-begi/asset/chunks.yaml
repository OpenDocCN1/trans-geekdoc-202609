    # 2.4.1 value selection


    ![image](d2d_images/chapter_title_below.png)


    The value of has to be chosen carefully to avoid having unclear idea of the machine
    learning model performance. The followings are common ways to determine the value
    of :


    1-   Choosing the value of in a way that guarantee that every train/test set is
    sufficiently large to represent statistics of the original full dataset, which
    has to be processed.


    2-  It is found, from empirical results, that choosing = 10 folds gives model
    performance predictions with low bias.


    3-  Choose the value of to be equal to the dataset size. This gives each testing
    set the chance to be used as a training set and vice versa. This way of cross
    validation is known as: leave-one-out.


    The value choice affects the algorithm bias and variance. In other word, the larger
    is the value of , the smaller is the size difference between the training group
    and the resampling sub-groups. The algorithm’s bias reduces as that difference
    becomes smaller. This means that there exists a trade-off between choosing the
    value of and the algorithm bias and variance behavior.


