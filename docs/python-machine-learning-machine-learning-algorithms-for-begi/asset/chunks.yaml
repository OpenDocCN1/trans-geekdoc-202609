    # CLUSTERING, BIAS AND VARIANCE


    ![image](d2d_images/chapter_title_below.png)


    In the previous chapter, we talked about regression as an example of the supervised
    learning algorithms. In this chapter we will deal with an unsupervised learning
    algorithm, which is clustering. In unsupervised learning, we don’t have a target
    variable. Instead, we need to get a description about input dataset. For example,
    in supervised learning, the main aim is to get an output for a set of data, .
    on the other hand, in unsupervised learning, we are interested in what the machine
    can tell us about the dataset . For instance, we may ask the machine to tell us
    about the best three clusters that we can make out of a given dataset or what
    are the most repeated four features in the dataset. In this chapter, we will study
    one type of clustering algorithm called -means algorithm. The reason that it is
    called “-means” is that the algorithm tries to form unique and different clusters,
    in which the cluster center is the mean value in that cluster.  


    Clustering is a type of unsupervised learning that finds groups of similar observation.
    In fact, everything can be clustered. Clustering is more efficient when the most
    similar items are located in the same cluster. The key difference between the
    classification, supervised learning, and the clustering algorithms is that in
    classification we are looking for ways that distinguish pre-classified groups.
    In clustering, on the other hand, no classes are available, and we want to make
    some natural classing of instances. Clustering is sometimes called: unsupervised
    classification. This is because it works like the classification in the supervised
    learning, but without having predefined classes. In other words, it produces classes.


    Some applications of the clustering:


    \-  Genomics: Forming clusters of genes with similar expressions.


    \-  Astronomy: Stars, for example, can be distinguished based on their colors,
    sizes, distances, materials, etc. clustering can be applied to find groups of
    similar stars and also galaxies.


    \-  Earthquake investigations: Detected earth quake epicenters should be clustered
    along continent cracks.


    \-  Marketing: Identify customer groups and utilize this for targeted marketing
    and re-organization.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    | --- | --- | --- |


    ![image](d2d_images/chapter_title_above.png)


    # 4.1 The -means clustering algorithm 


    ![image](d2d_images/chapter_title_below.png)


    \-means clustering is a machine learning algorithm that tries to form groups/clusters
    for a given data. The number of the clusters is determined by the user. Every
    cluster is described by its centroid which is a single point that is located at
    the center of all the points in the cluster, and here where the name comes from;
    -mean. The -means algorithm works with numeric values, means symbolic are excluded.
    The main advantages and disadvantages of the algorithm is as follows:


    Advantages:


    \-  Easy to implement.


    \-  Fast, simple and easy to be understood.


    \-  The objects are assigned to the clusters automatically.


    Disadvantages:


    \-  The number of clusters has to be picked in advance. This can be solved by
    trying the algorithm, -mean, with different ’s, then choose the clustering that
    has the best quality.


    \-  Results are affected significantly by the initial choice of labels. Moreover,
    the algorithm may converge at local minima. Suggested solution is to restart the
    clustering algorithm multiple times with different random labels.


    \-  Slow on very large datasets. This can be solved using sampling.


    \-  High sensitivity to outliers.


    \-  When the values are very large, the mean may be skewed. In this case, the
    median can be used instead of mean.


    The -means method approach can be summarized in the following three steps:


    1-  Choose, randomly, a number of centers for the cluster.


    2-  Assign every point in the given data to its closest cluster’s center. The
    assignment continues until finding the nearest centroid using methods such as
    Euclidean distance.


    3-  The centroids are all then updated by moving each of them to the average of
    its assigned points.


    4-  The steps two and three are repeated, till a convergence reached. i.e. when
    the cluster assignment change becomes less than a specific threshold.


    ![image](d2d_images/image000.png)The flow chart in figure 4.1 explains how the
    code of the algorithm looks.


    Figure ‎4.1 -mean clustering algorithm, flow chart


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


