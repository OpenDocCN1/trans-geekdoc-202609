    此外，还有其他与特定领域相关的资源和库。换句话说，可以通过面部识别、计算生物学、语音识别等标题来限制研究。新的数据集不断添加到互联网以及上述的库和网站中。正如我们在本书各章中所见，不同的算法在不同的任务上表现更好。因此，最好牢记一个应用程序，并拥有一些针对该应用程序的大型数据集，以便在针对该特定任务时研究不同的算法。


    此外，机器学习研究人员和数据科学家不断在可通过互联网访问的期刊上发表他们的论文。一个推荐的搜索起点是 NEC Research Index，位于 [`http://citeseer.ist.psu.edu`](http://citeseer.ist.psu.edu)。此外，大量机器学习算法可通过
    Web 获得，这些算法是使用不同的程序和工具设计的，例如 `Weka`、`Python` 和 `MATLAB`。


