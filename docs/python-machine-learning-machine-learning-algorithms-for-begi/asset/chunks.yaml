- raw: 'The decision tree algorithm works with both numeric and nominal values. It
    is simple in terms of computational complexity and of understanding the learnt
    results. Moreover, it is robust against missing values and can handle features
    that are irrelevant. However, the main disadvantage of the decision tree algorithm
    is that it is prone to overfitting. Overfitting is a common defect in the decision
    tree and other classification algorithms. It occurs when make multiple hypothesis
    about the training data, i.e. assigning meaningful values to noise. This indeed
    reduces the errors in the training dataset but at the expense of the testing dataset.
    In other words, an overfit model is too specific to its training data. So that,
    when it deals with a new data, its prediction error in this new data is at risk
    of being very high.  


