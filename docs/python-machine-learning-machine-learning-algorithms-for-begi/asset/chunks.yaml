    # 2.3 Data Preparation


    In the two previous sections, we talked about the first step in data preparation,
    which is data scrubbing. However, further preprocessing steps must be applied
    to the data, before heading to the learning process. In this section we describe
    briefly the common preparation methods.


    # 2.3.1 Data integration


    In this process, the data derived from multiple resources, such as different datasets
    or distributed records, that belongs to a one place is gathered and integrated
    into one dataset. During the data integration process, some considerations have
    to be taken into account. For example, in a dataset, we may encounter different
    attribute values for the same real-world entity. This happens when data are obtained
    from different sources. The reason may be that every source uses different representation
    or scale such as: metric vs. British units. Moreover, data sources can sometimes
    refer to different standards. For instance, some variables can be referred by
    means of different IDs, in more than one source.


    An important problem that may appear during data integration from different sources
    is the redundant data. The common reasons are:


    - The existence of a variable/attribute that is already a derived variable in
    another dataset, example, when we are talking about annual revenue.

    - The same attribute has different names in different datasets.

