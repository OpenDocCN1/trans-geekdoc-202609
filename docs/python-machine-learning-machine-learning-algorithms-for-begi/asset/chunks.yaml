    这种治愈包含缺失值的数据集的方法被认为是高效的，当一条数据记录包含许多具有缺失值的属性时。但是，当每个变量的缺失值数量变化显著时，此方案不再有效。当由机器未定义的来源产生数据规范时，该方法的效率会降低。机器会将此类数据视为缺失数据。例如，当患者因异常情况被收治时。


