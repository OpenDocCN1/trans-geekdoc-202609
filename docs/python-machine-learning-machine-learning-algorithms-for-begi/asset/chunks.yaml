    # 6.1 How to Develop a Machine Learning Application


    ![image](d2d_images/chapter_title_below.png)


    The basic approach to develop a machine learning model can be summarized in the
    following steps:  


    1-  Data Collection: Data or samples can be collected from the internet, RSS feeds
    or API. Researchers may have collective devices that record test results such
    as: wind speed data, blood glucose level, salts or minerals in water, or any other
    data of interest. There are almost endless options. However, sometimes using available
    samples may save a lot of time and effort. Examples of publicly available datasets
    repositories are shown in Appendix B.


    2-  Input Data Preparation: Once we got our data, we need to check if it is read
    and in a useable format. This step guarantees that our data is ready to be used
    in the learning algorithm. In chapter two, we discussed the data preparation methods
    in detail and showed how to clean it from noise and how to solve the missing data
    problem, and other necessary methods that make the dataset able to give meaningful
    results.  The data preparation and scrubbing are usually non-trivial compared
    to collecting data.


    3-  Input data analysis and human involvement: This is a manual analysis step.
    For example, we need to check that the previous two steps worked fine and no empty
    values exist. An estimation of the data may be done in order to recognize if there
    are some patterns that can describe the data or data values that are obviously
    different from the other points in the dataset. Sometimes, creating data plots
    in either two or three dimensions may be very useful. However, there are normally
    more than three dimensions/features that describe the data and one cannot generate
    the data plots across all the dimensions easily, at a one time. Therefore, dimension
    compression methods can be employed to compress the multiple dimensions to two
    or three in which the data can be visualized. Considering the human involvement,
    for automated systems and trusted data sources, it may be very limited or unneeded.
    For example, if the data source is from a production system and we have an idea
    how the data is going to behave, this step can be skipped. The main benefit of
    this step is that it enables us to check that there is no garbage in the dataset.'
