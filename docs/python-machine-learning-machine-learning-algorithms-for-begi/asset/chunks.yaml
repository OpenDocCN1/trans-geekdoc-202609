    # 4.2.2 Error due to Variance


    ![image](d2d_images/chapter_title_below.png)


    If we can repeat a whole machine learning model running process multiple times.
    The variance is how much the prediction of the target function is going to alter
    between different running’s of the model at the same given point. A machine learning
    algorithm is applied to predict the target function from the training dataset.
    Therefore, it is expected that the algorithm will show variance. If the machine
    learning algorithm has a good ability to discover the implicit relationship between
    the input dataset and the output variables, the target function should not change
    too much from one training dataset to the next. The difference between low and
    high variances machine learning algorithms can be clarified as follows:


    \-  Low Variance Algorithm: In this algorithm, when changes are made to the training
    dataset, small variations occur to the prediction of the target function.


    \-  High Variance Algorithms: In this algorithm, when changes are made to the
    training dataset, large variations occur to the prediction of the target function.


    In general, non-numeric machine learning algorithms, also called non-parametric
    algorithms, show high flexibility. However, they are high variance algorithms.
    Common examples of the low-variance learning algorithms are: Linear Regression
    and Discriminant Analysis. The -Nearest Neighbors and the Decision Tree are examples
    of the high-variance learning algorithms.


