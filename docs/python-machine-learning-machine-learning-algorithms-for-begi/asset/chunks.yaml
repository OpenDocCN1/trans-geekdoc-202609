- raw: 'It happens that we have a massive amount of data and we want to make a kind
    of regulation for such an input. This is the main aim of the of the unsupervised
    learning. A dataset can be processed, following unsupervised algorithm, to tell
    what patterns happen more frequently than others, what occurs and what does not.
    This kind of learning models is also sometimes called: descriptive model. This
    is because an unsupervised algorithm makes a summarizing output that describes
    the data and presents it in a new way. Compared with supervised learning, where
    a prediction of a target is the main aim, there is not a single feature that is
    more important than another in the descriptive model. This type of learning is
    applied in data mining application.


    Common algorithms of unsupervised learning are: clustering, density estimation,
    compressing and data reduction. Clustering algorithm is employed to a dataset
    to have each collection of similar data grouped together. A famous method of clustering
    is the K-mean algorithm, which will be discussed in details later in this book.
    The second algorithm, density estimation, is applied to a dataset when the goal
    is to produce statistical output of that dataset. Sometimes the aim is to visualize
    and present a large dataset information in a summarized and informative way. This
    brings up the compressing and data reduction algorithms that learn and produce
    the required summaries without the loss of information. In this algorithm, the
    key feature is to reduce the dimensionality of a dataset. Reducing the dimensionality
    of a dataset is also useful in reducing the complexity of other inferring algorithms
    that may applied later on.


    Table 1.1 shows some common supervised and unsupervised machine learning algorithms
    used to perform the corresponding tasks.


    | Learning Category || Learning method |


    | --- | --- |


    | Supervised Learning |


    | \-Nearest Neighbor || Classification |


    | Decision Trees || Classification |


    | Classification Rule Learners || Numeric prediction |


    | Linear Regression || Numeric prediction |


    | Regression Trees || Numeric prediction |


    | Unsupervised Learning |


    | Association Rules || Pattern detection |


    | \-means clustering || Clustering |


    Table ‎1.1 Common supervised and unsupervised machine learning algorithms


