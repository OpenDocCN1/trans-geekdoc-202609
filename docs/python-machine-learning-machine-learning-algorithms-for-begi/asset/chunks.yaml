  trans: '


    神经网络利用其任务中的权重来最小化产生的误差。它减少了对误差有重大贡献的神经元的权重。这个过程被称为：反向传播。这是因为在这个调谐过程中，我们从输出向神经元和输入方向回溯，以定位错误究竟发生在哪里。正是在这里，激活函数的重要性凸显出来。激活函数是可微的，这有助于通过计算梯度在神经网络中执行反向传播过程；从而计算梯度。因此，权重被调整。权重的同步调整过程持续进行，直到神经网络输出接近实际输出。在每次迭代中，权重会被微调，以便在每次运行中获得更小的误差。该过程针对训练数据集的所有输入和输出可能性重复，直到误差显著减小并被应用程序所接受。


    # 5.7 如何执行反向传播？！


    以下方程是神经网络中简化代价函数的表示：


    ![image](img/image120.png)(4.1)


    在方程 (4.1) 中，是预测输出 ![image](img/image047.png) 与实际输出 之间的平方误差。从概念上讲，我们可以在误差和预测输出
    ![image](img/image047.png) 之间绘制一张图。然后，可以使用诸如暴力枚举法之类的方法尝试网络中所有可能的权重。这应该会产生类似抛物线的数据结果。然而，这种简单的方法对于大型数据集来说需要难以想象的计算能力来检查所有可能性。为了说明这一点，对于中等规模的数据集，我们可能需要数百年时间来调整权重并获得结果！这时，权重优化技术就派上用场了。


    # 5.7.1 梯度下降


    在梯度下降中，我们专注于在比之前估计所有可能性所需时间少得多的时间内进行准确预测。第一步是为神经网络提供初始权重值。然后，我们可以按照前向传播的方式传入数据。我们现在的任务是估计输出
    ![image](img/image047.png) 并将其与实际输出 进行比较。在大多数情况下，第一次运行产生的预测并不十分准确，即，我们有较高的误差值。


    假设我们有一个针对特定值  的代价函数。为了简单起见，我们将假设数值。如果权重为 1.6，而产生的代价函数值  为 3.2。我们需要在下一次运行中调整权重以减小代价函数的值。问题是：如果我们能发现是增大还是减小权重，以便降低代价函数，那该多好？！


    我们要做的是在特定测试点处测试代价函数的左侧和右侧。然后，我们检查哪一方向产生更小的代价函数值。这种方法称为数值梯度估计。这是一种好的方法，但如果我们回顾代价函数方程
    (4.1)，我们可以通过利用导数，即进入梯度下降概念，以更聪明的方式思考。我们想知道哪个方向是下坡，能使函数达到最小值。换句话说，我们将检查  对  的变化率。


    在这个阶段，我们需要做的是对 ![image](img/image018.png) 求导，这将给出  对  的变化率。然后，对于  的任何值，如果 ![image](img/image018.png)
    为正，则代价函数指向上坡。而如果 ![image](img/image018.png) 为负，则代价函数指向下坡。这意味着我们现在知道哪个方向可以减小代价函数。因此，我们能够加快调谐过程。这是因为我们节省了在错误方向搜索值所需的所有时间。此外，通过沿着减小代价函数的方向迭代采取步骤，并在代价函数不再减小时停止，节省了额外的计算时间。这就是梯度下降方案的概念和实际实现。我们可以将梯度下降优化比作一名徒步旅行者。在这种情况下，权重是向山谷（即代价最小值）爬下山丘。根据这个类比，我们可以根据坡度陡峭程度（即梯度）和步长（类似于学习率）来确定每一步。


    在梯度下降中，有高学习率和低学习率之分。在我们的徒步类比中，高学习率是指在检查位置之前向山谷迈出大步。这可能导致我们永远无法到达代价函数的最小值。另一方面，当采取小步时，我们增加了到达最小值的机会。然而，这可能需要很长时间。因此，我们需要经验性地调整学习率，直到到达最小值。一个聪明的解决方案是考虑利用梯度概念的自适应学习率。也就是说，梯度越陡峭，学习率越高，梯度越小，达到最终值所需的步骤就越小。


    梯度下降在一维问题中可能看起来并不特别。然而，它显著减少了在高维数据集中调整神经网络权重所需的时间。


    在使用梯度下降求解时，需要注意的一个重要问题是数据的凸性。有时我们处理的数据集可能是非凸的。这意味着代价函数在同一方向上并不总是减小。从字面上讲，在这种情况下，代价函数先减小后又增加。这种行为在数学上被称为非凸函数。图
    4.5 显示了一个示例。在非凸函数中，梯度下降方法无法再给出准确的预测，因为它会陷入局部最小值，而不是找到全局最小值。


    ![C:\\Users\\Ahmed\\AppData\\Local\\Temp\\SNAGHTML2311786c.PNG](img/image083.png)


    图 5.5 非凸数据


    正是在这里，使用平方代价函数的原因得以揭示。平方误差值的总和使我们能够利用二次函数的凸性特性。因此，由于代价函数等于  的平方值，则  的图是一个凸抛物线。


    在结束关于梯度下降的讨论之前，有一个主要点需要提及，即数据集的实际凸性取决于我们如何处理数据。有时我们可以遵循“一次一个而不是一次全部”的原则。在这种情况下，我们不太关心数据集的整体凸性问题。这引出了我们在下一节中关于随机梯度下降的讨论。


    # 5.7.2 随机梯度下降


