    within the business by providing reliability and security for different applications
    such as file sharing, video conferencing, credit card processing, Ethernet VOIP
    and data back-up. It can be structured to carry video, internet, voice and data
    services collectively over the same connection of EPL services. EPL service also
    termed as Metro Ethernet, Point-to-point Ethernet or Carrier Ethernet Service. '
