  fmt: '

    # Conclusion


    Thank you for making it through to the end of *Computer Networking First-Step:
    An Introductory Guide to Understanding Wireless and Cloud Technology, Basic Communications
    Services and Network Security for Beginners*, let’s hope it was informative and
    able to provide you with all of the tools you need to achieve your goals whatever
    they may be.


    The next step is to take in all this knowledge and start thinking about it deeply.
    Once you have completely understood all the chapters, only then should you move
    on to the next book otherwise you can easily get overwhelmed with such an immense
    pool of knowledge.


    The meaning of networking is quite simple in the world of computers and that is
    the linking of separate devices together in order to transmit messages. A particular
    combination of hardware and software can together form one network. There are
    some books in the market which are so technical that it becomes almost impossible
    for a beginner to understand all of it. That is why my main aim in this book was
    to help you get a hold of the world of computer networking so that you can take
    the next step with confidence.


    In this book, I have tried breaking down the topics of computer networking into
    their simplest forms and if you have gone through all the chapters and understood
    them completely, then you are definitely ready for the next book. Finally, if
    you found this book useful in any way, a review on Amazon is always appreciated!

    '
  trans: '


    # 结


    感谢你读完《计算机网络入门：理解无线与云技术、基础通信服务及初学者网络安全指南》一书。希望这本书能为你提供有益的信息，并为你提供实现目标目标所需的所有工具，无论你的目标是什么。


    下一步是吸收所有这些知识，并开始进行深层思考。只有当你完全理解了所有章节后，才应该继续阅读下一本书，否则，你很容易被如此庞大的知识库所淹没。


    在计算机世界中，联网的含义非常简单，即将各个独立的设备连接在一起以传输信息。硬件和软件的特定组合共同构成一个网络。市面上的某些书籍技术性极强，对于初学者来说几乎无法理解其全部内容。这就是为什么我这本书的主要目标是帮助你掌握计算机网络世界，以便你能够充满自信地迈向下一步。


    在本书中，我尝试将计算机网络的主题拆解为最简单的形式。如果你已经读完所有章节并完全理解，那么你绝对已经准备好阅读下一本书了。最后，如果你觉得这本书在任何方面对你有帮助，我们将非常感谢你在
    Amazon 上的评价！

    '
