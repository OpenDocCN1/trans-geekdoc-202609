    \ two or more offices, an ethernet hub plays the role of a medium that connects\
    \ all the computers in the wireless infrastructure. The hub enables multiple domains\
    \ to improve effective transmission performances among users. Management System\
    \ Like any other infrastructure, wireless network infrastructure also needs an\
    \ effective management procedure that can ensure that the wireless network skeleton\
    \ and the people involved in it can meet the need of the users. \n\n*   Security\
    \ : Security management comprises safety measures of the network components and\
    \ resources. It enforces the security policy related to the configuration of the\
    \ network infrastructure to encounter various issues that may compromise the wireless\
    \ signals. The security policy should include strong encryption to protect the\
    \ system from the mischievous persons let not allow to steal the data of the users.\
    \ Else the users will lose their trust in the access point of the wireless network\
    \ infrastructure.\n\n*   Help desk : Helping the users in case of any primary\
    \ problem associated with a wireless connection is the main objective of a help\
    \ desk. So, a help desk must have a communicative interface to reach the users’\
    \ needs.\n\n*   Configuration Management : An enterprise must have a prominent\
    \ policy in place to review the wireless network skeleton that comprises, access\
    \ points, channels of RF, security settings, etc. Configuration management must\
    \ ensure prompt and dynamic action towards any updating or up-gradation of the\
    \ skeleton system and configure the system accordingly whenever necessary.\n\n\
    *   Network Monitoring : Monitoring of wireless network infrastructure is a huge\
    \ task and it needs a proactive plan to manage the network functions successfully.\
    \ The key role of a network monitoring management is to ensure mitigating the\
    \ risk involved in accessing the user’s data at the access point. The monitoring\
    \ management further demands the user’s growth to the access point of the network\
    \ traffic without compromising the security of the network and users as well.\
    \ The monitoring simplifies the operation support system and provides coverage\
    \ for the overlapping of the base stations that might result in lower performance\
    \ at the access point.\n\n*   Reporting : The reporting system includes various\
    \ important factors of the wireless network performances including its data usage\
    \ statistics and notifications of a security breach. These factors are responsible\
    \ for deciding on any operational change that requires encountering the potential\
    \ threat to the access point and its utilization. This information must be made\
    \ available to all the support teams like help desk, engineers, and maintenance.\n\
    \n*   Engineering : An engineering team is essentially important at the time of\
    \ installation of wireless network backbone but their role does not remain restricted\
    \ to the installation only. The necessity of an engineering team is essentially\
    \ more important to keep the system run effectively and flawlessly. To run a network\
    \ system smoothly the engineers should be a vigil on the structural design and\
    \ functional design of the network skeleton. They should continuously monitor\
    \ the performance of the network system and develop newer technology to increase\
    \ the traffic flow with effective security measures based on zero compromises\
    \ with any security threat.\n\n*   Maintenance : The maintenance part of the wireless\
    \ network infrastructure deals with the repair of different components like antennae,\
    \ channel points. The maintenance team evaluates RF propagation, install extra\
    \ access point wherever and whenever it is necessary. So, the maintenance team\
    \ acts as an extended support team of the engineering team."
