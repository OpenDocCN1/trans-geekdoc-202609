    # Chapter 4: Wireless Network Applications


    ![Avvio, Business, Persone, Studenti, Ufficio, Strategia](Image00005.jpg)


    Coined in the 19th century, the term wireless communications has left a huge impact
    on the world and over the years, the technology has undergone several major changes
    which have, in turn, made it even more developed. When it comes to transferring
    information from one device to another, the importance of the wireless medium
    is indispensable and it has also acquired the position of being the most important
    medium of transmission as well. As you must already know, in wireless communication,
    the information is not transferred with the help of any physical object but through
    air and no electronic conductors are required. Astonishing, right? The only thing
    that is used is the electromagnetic waves like `RF`, `IR`, and satellite. In today’s
    era, wireless communication is not limited to a few devices but has expanded itself
    over a plethora of items from computers to smartphones, laptops, tabs and so on.
    `Bluetooth` technology is also a part of it. In this chapter, you will get an
    overview of the various applications of the wireless network in today’s world
    and how hugely it has impacted our day-to-day work. When it comes to communicating
    from remote operated areas, wireless communication comes of great help.


    ## Types of Wireless Communication


    Here are some of the common types of wireless communication and a brief intro
    of what they are.


    ### Satellite Communication

    Being one of the most advanced forms of telecommunication infrastructure, satellite
    communication is a self-contained technology. With this technology, you can be
    connected to anyone you want and also anywhere on this planet. This is a type
    of communication that operates universally. Those who rely on this type of communication
    usually take the help of a commercial vendor who has a geostationary satellite
    in his or her reach. Now you must be wondering what geostationary satellites are.
    Well, they are a type of satellite that matches the rotational velocity of the
    earth thus having the same orbital period. It is because of this that the satellites
    always remain at the same point in the sky. A beam of modulated microwave acts
    as the signal in this type of communication and when the signal comes in proximity
    to the satellite, it gets amplified. Then that amplified signal will be sent to
    the respective antenna whose location is somewhere on the earth. Thus there are
    two main segments of the satellite communication. One is located on the ground
    and the other in the space. Mobile or fixed transmission, ancillary equipment,
    and reception are all a part of the ground segment whereas the space segment consists
    mainly of the satellite. The pace and pattern of world communications have undergone
    a complete change after the advent of satellite communications.


    ### Infrared Communication

    Next, we come to infrared wireless communications whose basic component is the
    `IR` radiations. For those who are not aware of what `IR` is, it is a type of
    electromagnetic energy whose wavelength is more than that of red light. The communication
    of this category can happen between a fixed device and a portable device and also
    between two portable devices. There are two basic types of infrared communication
    which are explained below –


    *   **Diffuse Point** – A line of sight between the receiver and transmitter is
    not required in this case and the link maintenance is done by bouncing or reflecting
    of signals. This is done through surfaces like roofs or ceilings. A very common
    example of this system is wireless `LAN` communication.

    *   **Point to Point** – In this case, a line of sight becomes mandatory. This
    means that the receiver and the transmitter should be placed or arranged in a
    way that they point towards each other and in between them, care should be taken
    that there are no obstacles present. Remote control communication is a common
    example of this type of infrared communication.


    If you are wondering what the advantages of infrared communication are, then let
    me elaborate that to you –


    *   For starters, the high directionality of infrared communication is its biggest
    advantage. The various sources involved here do not emit the same radiation but
    different ones with differing frequencies and thus, identifying the source becomes
    way easier. So, any risk involving the diffusion of information is eliminated.

    *   There is no chance of harm to human beings from `IR` radiation and thus, you
    do not have to think twice before using it at someplace.

    *   If you are sending video signals or anything that requires high-speed communication,
    then you should definitely go for infrared communication as the transfer speeds
    can go as high as `1Gbps`.

