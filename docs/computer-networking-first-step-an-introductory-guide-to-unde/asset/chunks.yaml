    # Chapter 2: Wireless Network Components ![Coder, Computer, Scrivania, Display,
    Elettronica](Image00003.jpg)


    By now, you probably might have come to know that a wireless network needs several
    supporting and compatible components to work on the system properly. Although
    the system is called wireless, some components in the network are there which
    are connected by wire in the network. So, a question may come to your mind about
    why the system is called a wireless network. The answer to this question is a
    wireless network system is an augmentation of the wired network rather than replacing
    the wire. The purpose of such an augmented wired network is to extend a wireless
    network between end-users. By and large, the end users like you are the most important
    target users of the entire wireless infrastructure. The network as a whole uses
    radiofrequency to work on either to transmit or receive data through the air.
    That is why the last few steps of the wireless infrastructure are free of wire
    connectivity. This procedure gives freedom to the user to get access to the internet
    at any time at any place. So, to start the discussion with the components used
    or required in a wireless network system let’s begin with the role and importance
    of the users in the system.


    ## Role and Importance of End-User


    A user in a wireless network refers to either a person or an entity. However,
    it is generally referring to a person. Suppose you are a businessman who travels
    frequently for business purposes. While you are waiting at the airport for your
    flight, you need to access the internet to check some urgent mail. What will you
    do then? You must access the airport’s public wireless LAN to check and reply
    to the mail. Here, you are a user of the airport’s wireless network.


    Many times, the user may not be a human being. Suppose you are using the public
    wireless network of the airport to send an instruction to your central server.
    According to your instruction, the central server of your office uses the wireless
    network settings in your office. The server forwards the same instruction to your
    manufacturing unit where a robot receives that signal and it acts according to
    the message sent. Here, the user is a robot. So, the main purpose of the wireless
    network is to provide services to its end-users.


    Now perhaps it is clear that the user is one of the major components of the wireless
    network that gets benefits from the system. That is why the user is one of the
    important parts of the wireless network infrastructure. The user is the final
    authority to decide when to use the wireless network and when terminate it. So,
    that makes sense of the appropriateness of the term end-user. Generally, as a
    user, you can use a computer to perform various activities by using different
    application software in addition to a specific wireless network interface. Different
    application software helps you to perform your job on a computer and wireless
    network interface helps you to communicate both ways from server to the client
    and vice versa. So, as a user of a wireless network interface, your role here
    is a communicator.


    A user of a wireless network may be mobile or stationary. A mobile network is
    ideal if you need to travel a lot. Suppose you are in the seminar, and you need
    to receive e-mails and send reply-mails through your PDA. Here, you need continual
    support of the wireless network interface. Sometimes, a user may need a portable
    wireless network interface. Suppose you are in a conference, and you need to discuss
    an analytical project using a wireless network for a particular time. Here, you
    can use a laptop and discuss the project before the audience with the help of
    a wireless network.


    Other users of the wireless network are stationary. It means the people who sit
    in a particular place say an office and work from there and use the wireless network
    for an unspecified time. Suppose, you work on a BPO where you access wireless
    network platform for 24x7 hours. So, here the network is stationary. The main
    difference between a mobile and a stationary wireless network is roaming functionality.


    ## Computer Device


    Do you know that computer devices can be used in different ways in a wireless
    network system? Many times, it can be used as a client-server computing system
    in a wireless network infrastructure. In a client-server computing concept both
    the client and server computers interface each other. Generally, the client computer
    sends a request to the server computer to share the resources it needs. There
    may be several client computers attached to the server computer to get access
    to the shareable resources. So, a server computer serves multiple client computers
    connected to it. The wireless network infrastructure acts as a liaison between
    the client and server computers. The best example of a client-server network system
    is a web server that returns the demanded web pages to its clients according to
    their requests.


    Unlike the client-server computing system, many times a computer is used as an
    end system within the same wireless network infrastructure. It includes websites,
    servers, databases. For example, you can see news of your preferred news channel
    accessing it from a public wireless LAN from a railway station, airport lounge,
    or a hotel. Similarly, a staff sitting in the office can access the warehouse
    management procedure to interface with the staff of the warehouse using the wireless
    network. The warehouse computer system here acts as an end system.


    As a user, you can also install a computer device like a network interface card
    (`NIC`) in your laptop to work and interface in a wireless network environment.
    A computer or a laptop can use an operating system like `LINUX`, `Windows XP`,
    or `MAC OS` as a software platform to run the wireless network application. Some
    of the OSs provide built-in features to access wireless networks. `Windows XP`
    is one of the OSs that can work on the wireless network by identifying the wireless
    LAN.


    ## Network Devices


    As the wireless network grows to become larger, the network performance goes down.
    This is happened due to heavy traffic congestion in the network. Congestion in
    the network is caused due to the transmission of too many data packets. The network
    performances may even degrade to no transfer of data. So, to avoid such incidents,
    a huge network is fragmented into several segments of a small network. Breaking
    off such a large network into several small network segments is defined as subnetting.
    Subnetting is done by using different network devices like the `hub`, `bridge`,
    `switch`, and `router`. Let’s get into each part to know more detail.


    *   **Hub**: It is a basic device used to bring every computer to be connected
    to a network. Computers are connected to the ports of the `hub` and work like
    a single segment of the network. The `hub` transfers all data to the computers
    that are connected to it. The `hub` has no own intelligence to work on.


    All the computers that are connected to a `hub` can find each other. That is why
    the chances of data collision in the network increase with the increase of several
    ports available in the `hub` and if all the ports are connected to computers.
    When a `hub` works on layer `1` network of the Open Systems Interconnection (`OSI`)
    model, the `hub` can detect the error due to the collision of data.

    '
