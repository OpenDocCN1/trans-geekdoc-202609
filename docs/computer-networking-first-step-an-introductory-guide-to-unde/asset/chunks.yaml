    # Chapter 9: Network Security


    ![Dati Personali, Wi-Fi Pubblico, Hacking, Computer](Image00010.jpg)


    Network security is a method to involve physical as well as software-based preventive
    measures for the protection of underlying networking configuration against misuse,
    modification, malfunction, destruction, unauthorized access, and improper disclosure.
    Presently, most people depend on the internet to perform their social, professional
    and personal activities. Some dishonest people attempt to violate the privacy
    of others by destroying internet-connected computers.


    Network security is executed by using tasks and tools to resist unauthorized programs
    and people to access your devices and networks connected to them. Sometimes, hackers
    make public mistrust and negative image of an organization by stealing detail
    information of a customer and sell them to be applied within a fraud case. The
    attackers mainly target on the data and communication of users within a network
    system. They also manipulate the system to get facilities by physical access or
    damage the device of the users.


    ## Basics of Network Security


    Basics of network security follow the strategies of protection, detection, and
    reaction. You should structure your system of the network as accurately as possible
    when you follow the strategy of protection. You will have to keep the ability
    to detect any changes in your structured network or the indication of network
    traffic issues when you will follow the strategy of detection. You will have to
    respond instantly and arrange a safe state as soon as possible after the detection
    of security issues. Basics of network security services are followed to secure
    data, resources or information from any type of malicious use and to provide protection
    to information, data or resources within your personal computer or laptop used
    as personal or public domain network area.


    ## Why do You Need Network Security?


    When you connect your device with the internet or other network services, you
    will get opportunities to be connected with different possibilities within the
    world. You will be able to utilize the opportunities without keeping permanently
    within your device. You also can allow others to be connected with you to work
    jointly or other purposes. But, there are lots of hackers and attackers who are
    always active in misuse or access within an unauthorized way.


    There are many reasons to use network security services and these are as follows:


    - It protects data, resources or information from being a misuse

    - It provides safeguard information or data from being unnecessarily delayed within
    the route followed for the delivery of data to the required place within the desired
    time.

    - It protects the data from any unwanted change.

    - It prohibits a specific user within the network to send messages or e-mail hiding
    the identification of the real sources of the sender.

    - It protects hardware such as laptops, hard disk of PC and laptop from being
    attacked by viruses or malware to destroy the system or to corrupt or delete all
    of the stored data and content within the devices.

