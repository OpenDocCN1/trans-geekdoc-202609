  trans: '


    # 关闭即插用

    即插即用程序允许设备检测您家中的网络，并连接到制造商以获取供应和固件更新。UPnP（通用即插用）是创建与互联网相关内容的重要元素。它对于制造智能家用电器非常有利。然而，UPnP
    同时也为黑客攻击提供了通道。UPnP 有助于建立支持网络的智能家居设备与路由器之间的协作关系。黑客可以通过将您的家庭设备包含在僵尸网络中重定向访问请求，从而攻击或感染您的家庭设备。在不使用设备时，你应该关闭即插用。通过这种方式，你可以维护设备的网络安全。


    # 更改您的默认 IP 地址

    当你将任何设备（包括路由器）连接到互联网时，IP 地址都是关重要的。路由器还有另一个 IP 地址，用于连接通过路由器使用互联网的设备。在某些情况下，更改 IP
    地址是必须的，这些情况如下：


    - 当网络服务用户意外配置了无效 IP 地址，例如设置了涉及错误数字范围的静态 IP 地址。

    - 如果你安装了新路由器并使用其默认 IP 地址范围重新配置你的家庭网络，你将不得不更改你的默认 IP 地址。


    IP 地址主要有两种类型：静态 IP 地址和动态地址。静态 IP 地址有很多优点。通过使用静态 IP 地址，你的计算机可以从任何地方定位服务器。此外，它可以帮助不同的计算机运行不同的操作系统以访问主机系统，并且每次找到相同的地址。你可以轻松地分配和处理静态
    IP 地址。


    #禁用其他网络上的文件共享

    在使用拨号上网连接到互联网后，你将能够通过 `TCP`（传输控制协议）或 `IP`（互联网协议）连接互联网共享文件和打印机。你可以通过禁用文件共享来防止未经授权对你的打印机、文件和网络的访问。你无法确定在线来源的文件是否没有恶意软件。通常，黑客的目标是文件共享应用程序并使用恶意软件感染它们。当你下载这些内容时，可能会存在安全风险。如果你对安全没有足够的保护，将导致许多安全泄露。有时，文件共享接口会在用户不知情的情况下暴露用户的计算机目录。结果是黑客可以获取用于攻击的信息。文件共享有很多技术，其中一些文件共享技术如下：


    - **移除存储介质**：它涉及移动式存储设备，如优存盘、内存卡、光盘、移动硬盘等。移动式存储介质的用户可以向他人共享文件，接收者可以连接服务来传输文件。

    - **FTP**（文件传输协议）：它有助于通过互联网共享文件。所有现代操作系统都可用，包括内置网络。当你想要访问它时，必须设置有效的登录名和密码。

    - **点对点网络**：这是一种非常流行的文件共享方式，主要用于音乐和视频。点对点软件的示例有 `uTorrent` 和 `Bit Torrent`。

    - **在线存储网站或文件托管服务**：`Google Drive` 和 `Drop-box` 是在线存储网站或文件托管服务的示例。成员可以使用网络浏览器上传文档、照片等。


    有时，当你为计算机连接移动存储介质时，计算机可能会通过受感染的系统被感染。如果你使用 `FTP` 传输官方文件，你的计算机数据可能会暴露并产生安全风险，因为
    `FTP` 不包含传输数据的加密。有时，文件托管服务的用户不够警惕，将机密数据放在公共访问的文件夹中。禁用另一个网络上的文件共享可以帮助你避免上述问题或风险。


    # 禁用 DHCP

    DHCP（动态主机配置协议）为网络服务内的 IP 地址共享提供了自动、快速和集中的管理。DHCP 有助于配置设备上的默认网关、子网掩码和 `DNS`（域名系统）服务器信息。通常，在家庭或小型企业中，路由器充当
    DHCP。当用户通过路由器请求 IP 地址时，主机分配一个可用的 IP 地址并帮助用户通过网络服务进行通信。当带有 DHCP 服务器的设备启动与带有 DHCP
    服务器的网络通信时，它有助于向服务器发送名为 `DHCPDISCOVER` 的请求。在收到 `DISCOVER` 包后，DHCP 服务器会保留一个供设备使用的
    IP 地址。然后，它向用户提供带有 `DHCPREQUEST` 的 DHCP 服务器 IP 地址以供接受它。服务器通过发送 `ACK`（确认代码）向用户确认其特定的
    IP 地址，并说明设备用户可以使用该地址的时间范围。DHCP 有助于轻松管理网络。设备用户可以自动获取 IP 地址，并且用户可以在 DHCP 促成的网络设置中自由移动。


    # 定期升级路由器固件

    路由器固件升级对于升级你的设备固件至关重要。固件升级可以提供新功能和高级安全性。有不同类型的路由器，但路由器固件的升级程序几乎相同。你应该始终查看制造商网站上的用户手册，以根据你的设备型号获取升级路由器的特定说明。有时，路由器所有者面临恶意软件用户或黑客的威胁。当创建任何设备时，硬件设计及其开发是主要阶段。固件确保硬件组件运行正常。通常，设备的系统性能会由于同时在设备上运行多个程序而降低。它还会降低操作速度，人们会考虑使用新部件更换磨损的硬件组件。路由器固件的升级有助于提高设备性能。如果你想升级路由器固件，你将需要确定路由器型号。你可以通过路由器的型号数字检查制造商网站，以获取更新路由器的可用程序。通常，路由器的更新是通过路由器的管理面板下载的。如果你可以下载更新的固件文件，你可以将其下载并保存到桌面上。否则，你将需要使用管理面板从计算机更新路由器。你还需要知道路由器的
    IP 地址。有时，路由器具有自动固件更新功能。Amped 路由器是游戏玩家最喜欢的路由器之一。你可以方便地更新 Amped 路由器的固件。你可以访问 Amped
    无线网站的支持部分来更新 Amped 路由器的固件。


    '
