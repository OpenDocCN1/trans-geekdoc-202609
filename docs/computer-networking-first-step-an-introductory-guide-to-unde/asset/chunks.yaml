    \ Description \n\nIntroduction Congratulations on purchasing Computer Networking\
    \ First-Step: An Introductory Guide to Understanding Wireless and Cloud Technology,\
    \ Basic Communications Services and Network Security for Beginners and thank you\
    \ for doing so. The following chapters will discuss the basics of computer networking.\
    \ In today’s world where the internet is ruling on top of everything, it is important\
    \ for you to know the basics otherwise; you won’t be able to stay ahead of others.\
    \ Although it has been 40 years or so since the advent of the internet, wireless\
    \ standards are attaining great heights even today. The purpose of this book is\
    \ to provide you with a concise overview of what the world of computer networking\
    \ is like and some of the major topics that will help you get started. You will\
    \ learn about a variety of transmission methods and also some of the common security\
    \ threats that need to be dealt with. This is quite a fascinating field and I\
    \ have tried to place it all in a way that it doesn’t seem jargon to you. When\
    \ it comes to establishing new infrastructure in the world of networking, wireless\
    \ networks have a big role to play and you will understand it once you read the\
    \ entire book. This particular sector of computer networking has received a considerable\
    \ amount of attention from the R & D sectors as well. There are plenty of books\
    \ on this subject on the market, thanks again for choosing this one! Every effort\
    \ was made to ensure it is full of as much useful information as possible, please\
    \ enjoy! "
