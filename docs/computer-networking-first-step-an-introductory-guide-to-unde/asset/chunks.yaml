    # 传输路径


    在无线通信中，传输路径的某些部分如下——复用、调制、加密和编码器。`Source Encoder`（源编码器）是信号源自源通过的地方。为了使信号处理技术正常工作，需要根据信号创建一个合适的格式，这是通过
    `source encoder` 自身完成的。如果信号中包含任何冗余信息，这些信息将会被立即移除。这确保了资源的最化利用。接着是 `Encryption Standard`（加密标准）的工作，它负责信号加密。这确保了所有内容都以安全的形式传输，且不允许任何类型的未经授权访问。当你通过
    `channel encoding`（信道编码）时，信号中的干扰、噪声等所有类型的损伤都会从信号中消除。在此过程中还会进行另一件事，即为了使信号具有更强的抗噪声能力，引入少量的冗余。然后，使用合适的调制技术，如
    `FSK`、`PSK` 或 `QPSK`。这使得信号能够通过天线进行传输。接着是各种复用技术的作用，如 `FDM`（频分复用 `Frequency Division
    Multiping`）和 `TDM`（时分复用 `Time Division Multiplexing`），它们有助于共享宝贵的带宽。


    ## 信道


    正如你从术语本身所理解的那样，无线通信网络中的信道是传输介质，在这种情况下是开放空间。这在本质上可能是高度变化且不可预测的。它也相当随机性。这种信道受到散射、噪声、失真、干扰等许多因素的影响。结果是多个错误开始充斥信号。


    ## 接收路径


    从特定信道收集信号是接收机的任务。然后，同一个信号会被复制以作为源信号。`Demultiplexing demodulation`（解复用调制）是无线通信系统中接收路径的一部分。其他一些部分包括
    `source decoding`（源解码）、`decryption`（解密）和 `channel decoding`（信道解码）。现在，如果你仔细研究这些方面，你就会理解接收机和发射器的任务是完全相反的。`demultiplexer`（解复用器）负责从信道接收信号。该特定信号还会与其他所有信号分离。然后实施各种
    `demodulation`（解调）技术来对单个信号进行解调。完成所有这些之后，最终恢复原始信号。随后，`channel decoder`（信道解码器）从信号移除任何或所有冗余位。现在，你必须理解你接收的消息是加密格式的，因此必须进行
    `decryption`（解密）。这样，安全措施被移除，并从加密信号中提取出简单的序列。然后 `source decoder`（源解码器）介入，解密后的信号被交给它。最后，检索原始传输的消息。


    # 无线信号


    在我们进入细节之前，你首先需要什么是无线信号。无线信号是负责视频、音频或任何其他形式数据传输的，它们在没有任何线的情况下完成这一切。但所有类型无线信号的一个共同点是，它们都是通过空气传播的电磁波。现在，你可能在想这些波是如何形成的。嗯，当使用某种金属传输电能时，在该金属周围就会产生波。这些波被称为电磁波。取决于该能量的强度，波可以传输一段距离。现在，我们来看不同类型的无线信号。有些你可能已经非常熟悉，并且在上一章中已经简要讨论过了——电视、`AM`
