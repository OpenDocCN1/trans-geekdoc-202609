    must have a communicative interface to reach the users’ needs.

    *   **Configuration Management**: An enterprise must have a prominent policy in
    place to review the wireless network skeleton that comprises, access points, channels
    of RF, security settings, etc. Configuration management must ensure prompt and
    dynamic action towards any updating or up gradation of the skeleton system and
    configure the system accordingly whenever necessary.

    *   **Network Monitoring**: Monitoring of wireless network infrastructure is a
    huge task and it needs a proactive plan to manage the network functions successfully.
    The key role of a network monitoring management is to ensure mitigating the risk
    involved in accessing the user’s data at the access point. The monitoring management
    further demands the user’s growth to the access point of the network traffic without
    compromising the security of the network and users as well. The monitoring simplifies
    the operation support system and provides coverage for the overlapping of the
    base stations that might result in lower performance at the access point.

    *   **Reporting**: The reporting system includes various important factors of
