- raw: "*   Bridge : A bridge, unlike a hub has a single source and a single destination\
    \ to send the data packets that it receives. So, a bridge is a two-way interface\
    \ device. On receiving the data from a particular network interface, it transfers\
    \ the same to another network interface which is, of course, connected to it.\
    \ Therefore, a bridge generates two separate collision domains. Based on the features\
    \ of a bridge’s functionality it is sometimes defined as a smart hub that can\
    \ detect the target point at which the data has to be sent.\n\nThe work of the\
    \ bridge may be best explained with the example of emails. An email is only delivered\
    \ at the email address of its recipient and not in any other recipient’s account\
    \ else. For example, if you send an email to your friend at [John@xyz.com](mailto:John@xyz.com)\
    \ , the wireless network system will search the email on the web. If that email\
    \ ID exists, the system will deliver the same at that particular email address\
    \ else it will fail to deliver. Such is the function of a bridge in the network\
    \ system. \n\n*   Switch : A switch acts as a hub but performs the job intelligently.\
    \ When a switch receives a request for the first time, it delivers the data to\
    \ all computers that are connected to it. As soon as a computer responds to that\
    \ data, the switch locates the port in which that computer is connected. At the\
    \ same time, the switch instantly learns the media access control (MAC) address\
    \ of the computer along with its port that responds. As a result, in case of any\
    \ subsequent request received from the same source computer the switch responds\
    \ directly because the switch already knows the source computer with its MAC address.\n\
    \nFor instance, three computers named Computer X, Y, and Z are connected to the\
    \ switch. The switch receives a request which is destined for the computer X.\
    \ The switch transfers the data requested to all three computers named X, Y, and\
    \ Z. The moment at which the Computer X responds to the data, the switch keeps\
    \ the path in its memory and sends data to Computer X in all future references\
    \ which are destined for the Computer X. The switch performs this function on\
    \ a network layer 1 of the Open Systems Interconnection (OSI) model. However,\
    \ the switch creates many collision domains of its own on each port of the same\
    \ network segment. \n\n*   Router : A router possesses the highest level of intelligence\
    \ among any other network devices so far available in the market. It is one of\
    \ the most efficient devices that can be preset to transfer the data to the destination\
    \ computers. The routers are used to operate on a layer 3 network of the Open\
    \ System Interconnection (OSI) model. A router is also able to transfer the data\
    \ from a network to another network by detecting the IP address of the target\
    \ computer. However, a router does not forward anything by default.\n\nThe router\
    \ creates a distinct segment for its every port and also creates a distinct collision\
    \ domain. So, a router has several segments and as well as several collision domains.\
    \ However, although a router creates distinct collision domains, it acts within\
    \ the same domains. A router’s functions include detecting the path, filtering\
    \ the packet for each path, switching each packet, and work on the internet. For\
    \ doing such function, routers consider all devices separately and break broadcasting\
    \ domains from segment to segment. This implies that when a message is sent to\
    \ a segment, the devices connected to that particular segment can get that message\
    \ without intervening in other segments within that network. The routers do the\
    \ packet filtering by using the access list and logical addressing to switch the\
    \ packet to work on the internet. It also creates a map of the internetwork, selects\
    \ the path, and sends the data packets to several remote networks. NICs A network\
    \ interface card (NIC) typically functions as a liaison between wireless network\
    \ infrastructure and a computer device. A NIC is attached with a computer device\
    \ whereas a network adopter is plugged in externally outside the computer device.\
    \ Now, you may think, how the NIC works. NIC works by following the standard protocol\
    \ that has been set by the American Institute of Electrical and Electronics Engineers\
    \ (IEEE). Suppose the NIC which will implement the IEEE 802.11b standard implies\
    \ That the NIC will be able to interact with the wireless infrastructure that\
    \ complies only with the protocol of the IEEE 802.11b standard. Therefore, as\
    \ a user, you must check to make sure if the specification of NIC chosen matches\
    \ the specification of the wireless network infrastructure that you need to access.\
    \ Apart from the NICs that work internally, there are NICs that can be set externally\
    \ to a computer called external NICs. An external NIC is suitable for a stationary\
    \ computer though it has some sort of mobility too in some wireless applications.\
    \ Wireless Network Infrastructures The main purpose of wireless network infrastructure\
    \ is to establish and ensure a flawless interconnection between its users and\
    \ its end systems. The infrastructure consists of four components viz, 1) base\
    \ stations, 2) access controllers, 3) application connectivity software, and 4)\
    \ distribution system which help to enhance wireless communications. \n\n*   Base\
    \ Stations : Basically, a base station is an infrastructural component that enables\
    \ the users to access network services like web browsers, emails, database applications,\
    \ etc. It contains the same technology found in a wireless NIC. Here, the base\
    \ station interfaces the communication signals from one access point to another\
    \ access point that moves through the air.\n\n*   Access Controllers : As the\
    \ name suggests, the access controllers control the traffic between the resources\
    \ and the open side of the wireless network. It is a hardwired device put between\
    \ an access point and the open side of the network connected through a wire. It\
    \ strengthens the wireless system by providing a centralized intelligent solution\
    \ to the access control mechanism. Access controller also allows its administrator\
    \ to arrange a per-user basis application to ensure access to a particular port\
    \ or block the port. For instance, when you put your user ID and password to browse\
    \ a web page, the access controller verifies, authenticates, and validates your\
    \ identity through a server.\n\n*   Application Connectivity Software : The connectivity\
    \ in network infrastructure, in general, defines the ability to connect an application\
    \ software or a system else you cannot access the required database or any application.\
    \ It implies, when you try to access a database or application software that hosts\
    \ on a system through your computer, you need an application connectivity software\
    \ that can interface between your computer and the host server.\n\nThe application\
    \ programs are generally written in several separate programming languages. On\
    \ the other hand, the processors run several separate operating systems and may\
    \ be located in different places. Here, application connectivity software plays\
    \ a key role in establishing the communications between a computer of the user\
    \ and a server that hosts the database or application software. The access points\
    \ and the controllers are as well required along with application connectivity\
    \ software to facilitate the communication system between the two ends. \n\n*\
    \   Distribution System : The wireless network itself functions without any wire\
    \ but its infrastructure needs wire to bind its distribution system that includes\
    \ server, access controller, and access point to hold together. However, the distribution\
    \ system is defined as an interconnection made between an access point and a Wireless\
    \ LAN following the standard protocol of IEEE 802.11."
