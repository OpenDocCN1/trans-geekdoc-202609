    # 第 7 章：Wi-Fi 与互联网故障排除 ![Senza Fili, Internet, Router, Accesso, Torre, Wave](img/Image00008.jpg)


    Wi-Fi 是现代时期一项重要的技术发展。它是一种无线网络技术，通过无线传输技术连接大量的数字设备、硬件和接入点。对于任何消费者来说都非常方便。它的覆盖距离比红外或蓝牙更远，且功率低于无障碍式技术。它兼容许多操作系统、高级打印机以及您的设备。它是智能手机、笔记本电脑、平板电脑等便携设备连接互联网的完美选择。Wi-Fi
    联盟（Wi-Fi Alliance）是一个制造商协会，他们规定标准定义和产品认证，并管理 Wi-Fi。Wi-Fi 网络服务多个等级，涉及不同的功率需求和速度。Wi-Fi
    网络系统的早期标准是 `802.11b`。随后，它升级到了 `802.11a` 和 `802.11g`。Wi-Fi 网络系统的最新标准是 `802.11n`。


    ## Wi-Fi 是如何工作的？


    Wi-Fi 网络利用无线电波在网络系统之间传输数据或信息。计算机必须包含一个无线适配器，将通过无线电信号发送的数据进行翻译。该信号将通过天线传输到名为 `router`（路由器）的解码器。然后，数据或信息将通过有线以太网连接到互联网。由于
    Wi-Fi 提供双向流量，从互联网接收的数据将通过 `router` 编码在无线信号中，以便被计算机的无线适配器接收。Wi-Fi 在您的办公室或家中建立一个网络，让您的计算机可以获取宽带上网。


    ## 如何设置 Wi-Fi？


    如果您想使用 Wi-Fi，需要特定的设备，这些是名为 `WAP`（无线接入点）的无线传输器和 Wi-Fi 适配器。许多 ISP（互联网服务提供商）从一开始就为新客户安装
    Wi-Fi 设施。如果您想在家里设置 Wi-Fi，您需要一个无线路由器，并且必须访问 `router` 的管理页面来安排完美的设置，例如密码、Wi-Fi 通道和网络名称。有时，设备内部没有内置无线适配器，您可以购买
    Wi-Fi USB 适配器。您可以从电脑创建无线热点，与其他设备共享互联网连接。Wi-Fi 连接广泛应用于机场、咖啡馆和许多公共建筑。


    ## 排除无线网络问题问题的 10 个步骤


    与无线网络问题相关的因素有很多种。这里解释了排除无线网络问题问题的 10 个步骤。在指向正确方向之前，请先开启它：有时，很难在网络系统中找到故障最明显的原因。大多数时候，都会做出错误的假设。当您的
    Wi-Fi 网络连接无法工作时，遵循最基础是最佳选择，这些是：


    *   您应该检查无线适配器是否已连接，无需考虑您正在使用的设备类型。

    *   您应该确保您的平板电脑或手机没有开启飞行模式。

    *    WLAN 环境涉及多个服务集标识符（SSID），所有这些都并不能帮助您到达理想的地方。当您的 Wi-Fi 网络连接激活状态时，您将没有任何选项来检查您是否选择了正确的网络服务以到达目标位置。某些无线互联网连接涉及特定用途的“死胡同”，在这些地方无法连接互联网。

    *   有时，考虑到您想要连接的网络服务类型，获得使用 Wi-Fi 的协调许可是关重要的。如果您在建立网络连接时忽略这一状况而没有遵循此步骤，您将无法获得网络服务。


    ### 尝试理解问题的程度


    如果您想解决网络连接问题，您必须了解问题扩散得有多远。您应该遵循以下步骤来理解它。


    *   您有已连接的相对设备吗？例如，您可以使用笔记本电脑连接，但无法使用智能手机？您能将您的网络连接与靠近您的人联系起来吗？

    *   如果您理解问题与用户、单设备或密码有关，您可以寻求帮助台的协助以进行妥善安排。

    *   任何客户端的设备或用户的账户都可能出现问题，无论您是使用高质量的 Apple 产品，还是作为 C 级员工工作，每个人通常都会面临 Wi-Fi 网络问题。

    *   当多个用户面临网络问题时，您可以向 IT 提供更详细的说明，并以更快的方式获得解决方案。


    ### 遵循基础诊断


    当您的 Wi-Fi 网络连接无法工作时，智能手机、笔记本电脑和平板电脑可以显示并帮助您获取基础级的信息。但是，您必须了解您正试图寻找什么。不要根据少量的信息做出决定。


    *   信号条通常指示网络连接强度。如果信号条不可见或太弱，则表示您的网络连接存在问题。

    *   有时，用户的设备漫游性能并不完美。由于设备性能差，可能会获得糟糕的网络信号。

    *   `ping` 目标是最有效的网络故障排除步骤之一。它将帮助您判断目标设备是否活跃以维持双向网络连接。但是，`ping` 可能由于主机防火墙设置到整个网络路径的过滤等原因而失效。

    *   您可以包含 `DNS`（域名系统）测试来发现 `DNS` 问题。`DNS` 测试是一个简单的程序，并解释许多问题。

    *   大多数标准网络系统包含标签系统。如果您的接入点有问题，在报告问题时请记录规格和可见的 LED 颜色。


    ### 尝试理解故障点


    大多数 WLAN 框架比 Wi-Fi 网络连接复杂。但是，要了解连接框架的常见标准故障点。不同类型的自动化工具有助于提供良好管理的网络连接。


    '
