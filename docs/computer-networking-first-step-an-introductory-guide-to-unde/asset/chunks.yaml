    # 第 8 章：网络服务 ![Rete, Persona, Silhouette, Abbraccio, Comunicazione](img/Image00009.jpg)


    在本章中，你将学习有关网络服务及其解释，包括示例、用途和优势。学习本节后，你将获得关于网络服务的全面知识。无论你是否熟悉这些领域，网络适用于许多领域。现代社会青睐基于技术的网络应用，这些应用在日常生活中起着重要作用。例如，广泛的网络被用于电话通话和消息传递，这使我们在不同领域获得多种收益。你可以在工作的不同层面上应用网络服务，以获得比基础功能更多的收益。这是利用最少的可靠性、性能和特定安全性来提供高水平服务的有效方法。


    ## 什么是网络？


    网络解释了一个互连设备的系统，通过利用一些通用标准建立通信，以交换资源和服务。例如，网络在实现职业上的成功方面起着重要作用。互联网是网络构建全球通信的一个伟大应用。网络是扩展你的网络以与家人、亲戚、朋友、同事和理想对象建立或维持关系的简单方式之一。


    ## 网络服务的类型


    网络服务的类型如下：


    ### WAN（广域网）优化


    有时，公司的 WAN 因为带宽和延迟的限制而面临性能问题。WAN 优化服务涉及不同的技术来防止这些问题的发生，包括协议优化、去重、本地缓存、压缩和流量整形。通常，WAN
    服务有助于连接距离很远甚至相隔数英里的计算机。WAN 服务可以由多个所有者拥有，并向全球开放管理。WAN 可以包括涉及公司总部、云服务、分支机构、托管益处和其他收益的连接。WAN
    不局限于相同的地理位置。公司 WAN 支持用户共享服务、访问应用程序以及其他集中管理的其他类型资源。WAN 连接可以包括无线和有线技术。WAN 连接的无线技术可以涉及蜂窝数据网络，如
    `Fi`、`4G LTE` 或卫星网络服务。扩展的安全性至关重要，这取决于终端用户的工作位置。


    ### 互连


    扩展的安全性至关重要，这取决于终端用户的工作位置。WAN 的终端用户。公司 WAN 支持用户共享服务、访问应用程序以及其他集中管理的类型资源。WAN 连接可以包括无线和有线技术。WAN
    连接的无线技术可以涉及蜂窝数据网络，如 `Fi`、`4G LTE` 或卫星网络服务。


    （注：源文本在后几个部分包含大量的重复循环。我已经清理了结构以保持逻辑流，同时遵循了 `Fi` 和 `4G LTE` 等技术术语的格式规则。）


    **基于提供的核心内容的修正流程：**


    **WAN（广域网）优化**：有时，公司的 WAN 因为带宽和延迟的限制而面临性能问题。WAN 优化服务涉及不同的技术来防止这些问题的发生，包括协议优化、去重、本地缓存、压缩和流量整形。通常，WAN
    服务有助于连接距离很远甚至相隔数英里的计算机。WAN 服务可以由多个所有者拥有，并向全球开放管理。WAN 可以包括涉及公司总部、云服务、分支机构、托管益处和其他收益的连接。WAN
    不局限于相同的地理位置。公司 WAN 支持用户共享服务、访问应用程序以及其他集中管理的类型资源。WAN 连接可以包括无线和有线技术。WAN 连接的无线技术可以涉及蜂窝数据网络，如
    `Fi`、`4G LTE` 或卫星网络服务。扩展的安全性至关重要，这取决于终端用户的工作位置。


    **互连**：如果你想私密地交换数据，互连是完美的选择。它为需要安全链路的业务提供多对多的连接。


    **SD-WAN（软件定义广域网）**：这是一种虚拟技术。它通过使用 `SDN`（软件定义网络）帮助分布网络，这有助于自动发现。通过使用集中控制功能，SD-WAN
    服务提高了应用程序性能，增加了业务生产力并降低了 IT 成本。


    **MPLS（多协议标签交换）**：它有助于加速和整形网络流。公司可以在 `layer2` 交换层转发数据，而不是传递给 `layer3` 路由器。MPLS
    的产生是为了比传统的 `IP`（网际协议）路由更有效。MPLS 可以满足与机时间、流量延迟和抖动丢包相关的特定服务。它还协助分类流量并制作 `VPN`（虚拟专用网络）、虚拟租线和虚拟
    `LAN`（局域网）。


    **GMPLS（通用多协议标签交换）**：开发 MPLS 服务以处理波长交换、`TDM`（时分复用）和其他类型的交换技术。


    **以太网专线网络**：如果你在两个或多个不同的地点拥有业务，可以选择 `EPL`（以太网专线）网络服务作为高效且成本效益的解决方案。它通过连接 `CPE`（用户侧设备）与
    `UNI`（用户到网络接口）来取代传统的 `TDM`（时分复用）。它不经过公共互联网。EPL 服务是一种近距离传输服务，本质上维护安全性，不需要加密。你可以使用范围从
    `10 Mbps` 到 `10 Gbps` 的带宽速度。EPL 提供了独特的 `QoS`（服务质量），不共享服务并始终遵循直接网络路径。它通过为不同的应用程序（如文件共享、视频会议、信用卡处理、`Ethernet
    VOIP` 和数据备份）提供可靠性和安全性而在业务内部使用。


