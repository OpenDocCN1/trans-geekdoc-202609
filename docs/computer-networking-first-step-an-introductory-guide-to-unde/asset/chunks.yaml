    ## Management System


    Like any other infrastructure, wireless network infrastructure also needs an effective
    management procedure that can ensure that the wireless network skeleton and the
    people involved in it can meet the need of the users.


    *   **Security**: Security management comprises safety measures of the network
    components and resources. It enforces the security policy related to the configuration
    of the network infrastructure to encounter various issues that may compromise
