    # 第 9 章：网络安全


    ![Dati Personali, Wi-Fi Pubblico, Hacking, Computer](img/Image00010.jpg)


    网络安全是一种涉及物理及软件预防措施的方法，旨在保护底层网络配置免受误用、篡改、故障、破坏、未经授权的访问和不当披露。目前，大多数人依赖互联网来完成他们的社交、职业和个人活动。一些不诚实的人试图通过破坏连接互联网的计算机来侵犯他人隐私。


    网络安全通过使用任务和工具来实现，防止未经授权的程序和人员访问你的设备以及连接的网络。有时，黑客通过窃取客户的详细信息并将其出售用于欺诈案件，从而对组织产生公众的不信任和负面形象。攻击者的主要目标是网络系统内用户的数据和通信。他们还通过物理访问获取设施或通过损坏用户设备来操纵系统。


    ## 网络安全基础


    网络安全的基础遵循保护、检测和反应的策略。当你遵循保护策略时，你应该尽可能准确地构建你的网络系统。当你遵循检测策略时，你必须保持检测结构化网络中任何变化或网络流量问题迹象的能力。在发现安全问题后，你必须立即做出响应并尽快安排安全状态。网络安全服务的基础旨在保护数据、资源或信息免受任何类型的恶意使用，并对用作个人或公共网络区域的个人计算机或笔记本电脑中的信息、数据或资源提供保护。


    ## 为什么你需要网络安全？


    当你将设备连接到互联网或其他网络服务时，你将获得与世界上各种可能性建立连接的机会。你可以利用这些机会，而无需将其永久保存在你的设备中。你也可以允许他人与你连接以共同工作或其他目的。但是，有很多黑客和攻击者始终活跃在误用或未经授权的方式进行访问。


    使用网络服务的理由有很多，如下：


    - 它保护数据、资源或信息免受误用。

    - 它保护信息或数据避免在向规定时间内传输到所需地点的路径中发生不必要的延迟。

    - 它保护数据免受任何意外更改。

    - 它禁止网络内的特定用户在隐藏发送者真实身份的情况下发送消息或电子邮件。

    - 它保护硬件（如笔记本电脑、PC 和笔记本硬盘）免受病毒或恶意软件的攻击，防止破坏系统或损坏/删除设备中所有存储的数据和内容。


    '
