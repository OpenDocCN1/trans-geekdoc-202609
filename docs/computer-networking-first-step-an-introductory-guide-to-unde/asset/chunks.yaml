    # Chapter 5: Wireless Communication Technology


    ![Dito, Tocco, Mano, Struttura, Internet](Image00006.jpg)


    In the previous chapter, I had given you a brief introduction to the different
    types of wireless communication technology that exists. Here, I am going to explain
    to you in detail what are the different aspects of wireless communication technologies
    and what special characters do they have. It all started with the invention of
    the radio and now, wireless communication has attained great heights. The society
    has been transformed with the power of instant communication even over long distances.
    The world has now literally become a much small place.


    ## Advantages of Wireless Communication


    The list of advantages for wireless communication is endless but I have tried
    to mention all of them in a concise way here –


    ### Mobility

    There is a great deal of mobility associated with types of wireless network. They
    do not face any barriers because communication is done in the form of various
    waves through air. There are no wires involved. For example, you can listen to
    your radio while you are driving your car through the woods. Yes, there are certain
    factors that can affect the signal strength but in any case, there is no question
    about the extent of mobility you are getting.


    ### Convenience

    For the wired connections to work, the presence of a physical connection becomes
    necessary and this, in turn, can create a lot of hassle. On the other hand, wireless
    communication does not require any such physical object. The signal strength is
    the only deciding factor. If that is working, you do not need to worry about anything
    else. All you need is a password to protect your network and you can instantly
    connect your devices to the network without worrying about any hackers.


    ### Flexibility

    Wireless networks operate through thin air and thus they can penetrate walls.
    You do not have to think twice about the location of installation. You can install
    them anywhere you want and they will still be performing efficiently. The flexibility
    is definitely one of the greatest advantages of a wireless network.


    ### Cost-Effective

    Installing a wireless network can save huge costs on your side. It is very cheap
    to install especially when you compare it with wired systems. In the case of wired
    systems, the cable cost is huge and you have to pay for it in terms of per-foot
    wire required. This also involves separate labor and time for the complete installations
    which, in turn, incurs additional charges. Also, if you want any changes to the
    plan of wiring for installing these cables, that will fetch you even more costs.
    But yes some small amount of wiring is sometimes required to set up wireless connections
    on a large scale but that is way less than that of wired systems.


    ## Basic Elements Present in a Wireless Communication System


    There are typically three elements present in most wireless communication systems
    and these are as follows –


    - Transmitter

    - Channel

    - Receiver

    '
