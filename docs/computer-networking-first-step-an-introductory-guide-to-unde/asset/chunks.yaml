    ### Bridge（网桥）

    `Bridge` : 桥与集线器不同，它具有单一源和单一目的，用于发送接收的数据包。因此，桥是一种双向接口设备。当从特定的网络接口接收到数据时，它会将数据传输到另一个网络接口（该接口显然是连接在它上面的）。因此，桥会产生两个独立的冲突域。根据桥功能的特征，它有时被定义为智能集线器，能够检测数据必须发送的目标点。


    桥的工作可以通过电子邮件的示例来完美解释。电子邮件只会投递到收件者的电子邮件地址，而不会发送到任何其他收件者的账户。例如，如果你向朋友 `John@xyz.com`
    发送封邮件，无线网络系统将在网上搜索该邮件。如果该邮件 ID 存在，系统将将其投送到该特定的电子邮件地址，否则将发送失败。这就是桥在网络系统中的功能。


    ### Switch（交换机）

    `Switch` : 交换机的作用类似于集线器，但执行工作更加智能。当交换机第一次接收请求时，它会将数据发送到所有连接到它的计算机。一旦计算机对该数据做出响应，交换机就会定位该计算机连接的端口。同时，交换机会立即学习响应的计算机的媒体访问控制（`MAC`）地址及其端口。因此，当从同一源计算机接收到任何后续请求时，交换机会直接响应，因为交换机已经知道了源计算机及其
    MAC 地址。


    例如，三台名为 `Computer X`、`Y` 和 `Z` 的计算机连接到交换机。交换机接收到一个目标为 `computer X` 的请求。交换机将请求的数据传输给名为
    `X`、`Y` 和 `Z` 的三台计算机。在 `Computer X` 响应数据的瞬间，交换机将路径保存在内存中，并在未来所有指向 `Computer X`
    的引用中将数据发送到 `Computer X`。交换机在开放系统互连（OSI）模型的网络层第一层执行此功能。然而，交换机在同一网段的每个端口上都会创建自己的冲突域。


    ### Router（路由器）

    `Router` : 在目前市场上提供的任何网络设备中，路由具有最高水平的智能性。它是可以预设将数据传输到目标计算机的高效设备之一。路由器用于在开放系统互连（OSI）模型的第
    3 层网络上操作。路由器还可以通过检测目标计算机的 `IP` 地址将数据从一个网络传输到另一个网络。然而，路由器默认不会转发任何内容。


    路由器为其每个端口创建一个独立的网段，并同时创建一个独立的冲突域。因此，路由器拥有多个网段和多个冲突域。然而，尽管路由器创建了不同的冲突域，但它在相同的域内运行。路由器的功能包括检测路径、为每条路径过滤数据包、交换每个数据包以及在互联网上工作。为了实现此类功能，路由器单独考虑所有设备，并将广播域从一个网段隔离开。这意味着当消息发送到某个网段时，连接到该特定网段的设备可以获取消息，而不会干预网络中的其他网段。路由器通过使用访问列表和逻辑地址进行数据包过滤，以交换数据并在互联网上运行。


    ### Wireless Network Infrastructures（无线网络基础设施）

    无线基础设施的主要目的是建立并确保其用户和终端系统。该基础设施由四个部分组成：1) 基站，2) 控制器，3) 应用连接软件以及 4) 分配系统。


    #### Base Stations（基站）

    `Base Stations` : 基本上，基站是一种基础设施组件，使用户能够访问网络浏览器、电子邮件、数据库应用程序等网络服务。它包含了无线网络网卡（NIC）中找到的技术。在这里，基站负责将通信信号从一个接入点接口到另一个接入点，信号通过空气传输。


    #### Access Controllers（访问控制器）

    `Access Controllers` : 如名称所示，访问控制器控制资源与无线网络开放侧之间的流量。它是一个位于接入点和通过电线连接的网络开放侧之间的硬接线设备。它通过为访问控制机制提供中心化的智能解决方案，增强了无线系统的安全性。访问控制器还允许管理员根据用户为基准安排应用程序，以确保访问特定端口或阻塞该端口。例如，当您输入用户
    ID 和密码浏览网页时，访问控制器会通过服务器验证、身份确认并校验您的身份。


    #### Application Connectivity Software（应用连接软件）

    `Application Connectivity Software` : 网络基础设施中的连接通常定义了连接应用程序软件或系统的能力，否则您无法访问所需的数据库或任何应用程序。这意味着，当你尝试通过计算机访问托管在系统上的数据库或应用软件时，你需要一个可以在你的计算机和主机服务器之间建立接口的应用连接软件。


    应用程序通常用几种不同的独立编程语言编写。另一方面，处理器运行多个多个独立的操作系统，并可能位于不同的地方。在这里，应用连接软件在用户计算机与托管数据库或应用程序的服务器之间建立通信方面起着关键作用。


    #### Distribution System（分配系统）

    `Distribution System` : 无线网络本身在没有电线的情况下运行，但其基础设施需要电线来绑定其分配系统，将服务器、访问控制器接入点整合在一起。然而，分配系统被定义为遵循
    `IEEE 802.11` 标准协议的接入点与无线局域网（Wireless LAN）之间的互连。


