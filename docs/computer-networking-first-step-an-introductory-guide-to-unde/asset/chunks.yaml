    also important to note `PSK` transmission is polar whereas the `ASK` signal is
    non-polar. `PSK` represents a non-linear modulation scheme whereas `ASK` represents
    a linear modulation. `PSK` works better than `Ask`.


    #### QPSK (Quadrate Phase-Shift Keying)

    The above-mentioned methods of digital modulation are not spectrally efficient
    as the available channel bandwidth is not completely utilized. `OPSPSK` helps
    to improve spectral efficiency. It involves two types of message sources. In this
    method, modulation carriers create the output waveform by combining within the
    quadrature phase. In `QPSK`, modulation gains and the amplitude of the modulator
    waveform are formed about equally.


    #### DPSK (Differential Phase-Shift Keying)

    There is no need to involve synchronous carrier for identification of `PSK` signals
    within `OPSK` modification of `PS`. It is an igneous method in which the derivation
    of carrier reference is made from the received waveform within the foregoing bit
    interval by an application of a `1-bit delay`.


    ### Data Transmission Involving Pack Switching

    The supply of different addressed packets with interconnection for having a conversation
    is done by the packet switching process.


    #### SMS (Short Message Service)

    Digital cellular networks such as `GSM`, `EDGE`, `IS-136` and `PDC` (packet data
    service) support short message service which is one of the most common packet
    services. It represents a store-and-forward or packet mode service and it offers
    inter-working involving the different services and applications within a fixed
    network. Signaling and control channels are usually utilized for data transmission
    due to message transfer between applicable network services.


    #### GPRS (General Packet Radio Service)

    `GPRS` is very important to represent add-on capabilities regarding the basic
    voice-optimized cellular network system to handle important properties of radio-access
    technology.


    #### EDGE (Enhanced Data Rates for GSM Evolution)

    You will have to modify the radio-access part when you want to enhance the capabilities
    for the data handling of `2G` service. `EDGE` is the form of modification and
    it has evolved in Europe. It helps to adopt a mechanism for link selecting the
    best modulation combination and encoding schemes considering the time varying
    quality of the link. `EDGE` concept involves both packet mode as well as circuit
    mode and is also enough generic to use within other digital cellular systems.


    #### Spread Spectrum

    A spread spectrum is a specific communication method that involves more radio
    frequency purposefully. It is essential to improve the signal-to-noise ratio.
    It helps to prevent intentional jamming and secure communication.


    #### Frequency Hopping

    In the frequency hopping method, the transmitted frequency is converted pre-assigned
    channel by spreading the narrowband signal as a function of pseudo-random.


    #### Direct Sequence

    In the direct sequence method, the signal is expanded over broadband part of the
    radio by using `PN` (pseudo noise) code generated locally. Spread spectrum signals
    have a large number of different formats and they are used to communicate symbols.
    As a result of this, although the receiver can identify one of these formats through
    a single message.


    #### CDMA (Code Division Multiple Access)

    `CDMA` is a type of direct sequence involving spread spectrum technology. It helps
    many users engage the same frequency and time allocations. `CDMA` offers more
    analogue capacity than `AMPS` and more calling capacity than `TDMA` by assigning
    unique spreading code for each user.


    #### PCS (Personal Communication System)

    `PCS` involves a combination of intelligent networks and cellular networks. It
    represents `SST` (super simple transfer) into protocol. As the North American
    implementation, `PCS` follows `GSM` standard and offers expanded capacity and
    specific services such as call forwarding and short messaging. The secondary frequency
    band was specialized. This band comprises two domains ranging from `1710 MHz`
    to `1785 MHz` and from `1805 MHz` to `1880 MHz`.


    #### DECT (Digital Enhanced Cordless Telecommunication)

    `ETSI` (European Standard Institute) developed `DECT` which is a type of `PCS`.
    It requires minimal access to open a closed environment. It involves `TDD` or
    frame structure using `24 slots` equally to operate uplink and downlink. It helps
    to specify both duplex and simplex operation. It utilizes multilevel modulation
    to achieve a high level of data rates.


    #### GSM (Global System Mobile)

    The Group Special Mobile developed `GSM` and it is considered an initiative of
    `CEPT` (Conference of European Post and Telecommunication) administration. The
    primary band of `GSM` involves `900 MHz` including two sub-bands of `25 MHz`.
    `GSM` systems such as `ICO`, `Globalstar`, and `Iridium` utilize `LEO` (low-earth
    orbit) constellations or `MEO` (medium-earth orbit) satellites and continue operations
    for existing `PCS` networks and cellular networks. These systems extend the network
    services to any location of the earth’s surface utilizing dual-mode.


    #### PCSS (personal communication satellite)

    `PCS` incorporates `QPSK` modulation and both `TDMA` and `FDMA` to utilize `LEO`
    satellite repeaters. International roaming and features such as frequency hopping,
    short message service, privacy and encryption, and discontinuous transmission
    are the major advantages of `GSM`. Other benefits are teleconferencing. The basic
    architecture includes base station sub-system, system interworking, network sub-system,
    mobile stations, and system interfaces. The activation and operation of a `GSM`
    terminal require `SIM` (subscriber identity module).


    ### New Developments of Mobile Communication

    #### GPS (Global Positioning System)

    `GPS` helps in reliable navigation within any position of the earth and the operation
    is allowed within all kinds of weather conditions of the day. Airborne, marine
    and land users can utilize the `GPS` system which was developed in 1983. It includes
    three segments such as space segment, user segment, and control segment.


    #### Space Segment

    `GPS` involves `24 NAVSTAR` satellites including three spare satellites that are
    positioned within the orbit at a distance of `20,200 km`. Considering six circular
    orbital planes involving a 12 hour orbital period for each orbit. These satellites
    broadcast continuously navigational signals named coarse acquisition code by operating
    `L1` band with `1.5 GHz` frequency. Anyone can receive these codes to decode and
    find navigational parameters such as latitude, velocity, longitude and time.


    #### Control Segment

    The control segment has the `MCS` (master control system) and many smaller earth
    stations named monitoring stations positioned at various places within the world.
    `MCS` receives measured data which is delivered by monitoring stations by tracking
    satellites. `MCS` returns satellite parameters to the satellite by computing them.
    As a result of this, all `GPS` receivers get broadcast service.


    #### User Segment

    The user segment includes all stationary and moving objects along with `GPS` receivers.
    As `GPS` receiver computes its velocity and position in every second as it is
    a multi-channel satellite.


    #### Bluetooth

    Bluetooth technology can be compared to `WLAN` technology. It aims for piconets
    that are within the local-area network involving limited coverage and eliminating
    the requirement of infrastructure. A collection of Bluetooth devices termed as
    `piconet` and synchronized to the same hopping sequence. One Bluetooth device
    within the `piconet` performs as master and all other Bluetooth devices perform
    under it. The master device selects the hopping pattern and other Bluetooth devices
    synchronized to the selected pattern. The master device uses the `device ID`,
    which is `48 bit` a unique identifier in the world, to select the hopping pattern.
    It also assigns the address of a `3-bit` active member for all active devices.
    All parked devices utilize the address of an `8-bit` parked member and there is
    no need for an address when the devices. The available bandwidth is `2.4 GHz`
    and it uses frequency hopping.


    #### 3.5G System

    The `3.5G` system helps in speed and high-level of through-put at packet data
    rates of `14.4 Mbps` to support the high-level of data requirements of consumers.

