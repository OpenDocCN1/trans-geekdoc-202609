    # 第 5 章：无线通信技术


    ![Dito, Tocco, Mano, Struttura, Internet](img/Image00006.jpg)


    在上一章中，我曾向您简要介绍了存在的不同类型的无线通信技术。在这里，我将为您详细解释无线通信技术的不同方面以及它们具有哪些特性。这一切始于无线电的发明，而现在，无线通信已经达到了极高的高度。即使是远距离通信，社会也发生了变革。世界现在从字面上变成了一个小得多的。


    ## 无线通信的优势


    无线通信的优势列表无穷无尽，但我在这里尝试用简洁的方式列出所有这些优势——


    ### 移动性

    各种类型的无线网络具有极大的移动性。它们不会遇到任何障碍，因为通信是通过空气中各种波的形式完成的，不涉及任何电线。例如，你可以在开车穿过森林时听收广播节目。是的，某些因素可能会影响信号强度，但无论如何，你所获得的移动性范围是不容置疑的。


    ### 便捷性

    为了使有线连接工作，物理连接的存在变得必不可少，这反而会产生很多麻烦。另一方面，无线通信不需要任何物理物体。信号强度是唯一的决定因素。如果它工作正常，你就不需要担心其他任何事情。你只需要密码来保护你的网络，就可以将设备立即连接到网络，而无需担心任何黑客。


    ### 灵活性

    无线网络通过空气运行，因此它们可以穿透墙壁。你不需要对安装位置反复考虑。你可以在你想要的任何地方安装它们，它们仍然将保持高效运行。灵活性无疑是无线网络最大的优势之一。


    ### 成本效益

    安装无线网络可以节省你方面的巨大成本。特别是与有线系统相比时，安装非常廉。。在有线系统的情况下，电缆成本是巨大的，你必须根据所需的每英尺线支付费用。这还涉及完成整个安装所需的单独的人力和时间，从而产生额外费用。此外，如果你想对安装这些电缆的布线计划进行任何更改，将产生更多成本。但是确实，有时在大规模上建立无线连接时仍需要少量的布线，但这远少于有线系统的成本。


    ## 无线通信系统中存在的基本元素


    大多数无线通信系统中通常存在三个元素，如下：


    - 发送器

    - 信道

    - 接收器


    '
