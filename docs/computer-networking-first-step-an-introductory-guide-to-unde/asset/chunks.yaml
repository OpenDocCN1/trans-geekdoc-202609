- raw: "Chapter 1: Introduction to Wireless Technology ![Segnale Wireless, Icona,\
    \ Immagine, Vettoriale, Azzurro](Image00002.jpg)The present time might have let\
    \ you allowed to be familiar with the term wireless technology. The term “wireless\
    \ technology” has a wide circumference to cover in. However, in short, it can\
    \ be described as connecting people or devices to communicate with each other\
    \ or transfer data or power without any cable or wire, the technology is called\
    \ wireless technology. So, to begin with, this new technology, let’s know about\
    \ its brief history over the past decades. Small History of Wireless Technology\
    \ The root of wireless technology was contained with Heinrich Hertz, a German\
    \ physicist’s discovery of electromagnetic waves. When he was experimenting with\
    \ electromagnetic waves between 1885 and 1889, he observed the following: \n\n\
    *   the length and velocity of the wave and\n\n*   the nature of vibration and\
    \ susceptibility of the wave to reflection and refraction were similar to that\
    \ of the heat and light waves.\n\nWith his findings, he proved that heat and light\
    \ are electromagnetic waves. This electromagnetic wave was called the Hertzian\
    \ wave after the name of Heinrich Hertz and later on, it was told as a radio wave.\
    \ The First Wireless Communication Alexander Graham Bell and Charles Sumner Tainter\
    \ invented the first photophone in 1880. The photophone was a type of telephone\
    \ which was conducted through modulated light beams to communicate audio conversation.\
    \ Wireless Telegraphy with Long-distance Radio transmission Italian electrical\
    \ engineer, Guglielmo Marconi is a pioneer, who worked for a long-time on the\
    \ long-distance radio transmission. Finally, Marconi worked with German physicist\
    \ Karl Ferdinand Braun and developed their milestone invention of long-distance\
    \ wireless telegraphy and they jointly shared the Nobel Prize in 1909. The Radio,\
    \ Television, and Satellite With the development of Marconi’s long-distance radio\
    \ transmission, the radio has emerged at the beginning of the 20th century. Later\
    \ on, television has come which receives the broadcasted audio-visual communication\
    \ without any wire. Satellite is also an example of wireless technology. Wireless\
    \ Technology in Today’s Era Wireless technology today has become a part of everybody’s\
    \ life. If you ask anyone what they know about wireless technology, they will\
    \ answer you exemplifying the use of a smartphone, tablet, laptop, modem, etc.\
    \ However, today, wireless technology is used under two broad categories. They\
    \ are: \n\n*   Wi-Fi Technology – Wi-Fi technology connects two devices through\
    \ radio frequencies (RF) or radio waves. It is commonly used to attach internet\
    \ router with devices like laptops, tablets, computers, mobile phones to communicate\
    \ with each other. In fact, Wi-Fi technology is a wireless local area network\
    \ (WLAN) that runs 802.11 protocols which are developed by the Institute of Electrical\
    \ and Electronics Engineers (IEEE). The specification that the “802.11 families”\
    \ use is the Ethernet protocol and the protocol shares its path by following Carrier\
    \ Sense Multiple Access (CSMA) with Collision Avoidance (CA) mechanism.\n\nWi-Fi\
