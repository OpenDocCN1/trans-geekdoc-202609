    手机电话涉及由于频率调制的双向模拟通信系统，其涉及语音传输以及使用频率频移键控来控制传输和信号信息。蜂窝系统的其他终端示例包括无线电话、数字蜂窝系统、寻呼机和卫星移动。模拟蜂窝系统认为是蜂窝概念的
    `1G`（第一代）类别。数字蜂窝低功率无线认为是蜂窝概念的 `2G`（第二代）类别。


    ### 模拟蜂手机

    在新泽西州，贝尔实验室在 1970 年内提出了一项被视为 `AMPS`（高级移动电话系统）的手机电话提案。`AMPS` 的运行于 1983 年 10 月 13
    日作为标准蜂窝电话服务开始。它利用了窄带陆地调调制，包括可用的 `300-3 kHz` 音频频带，以及为了 100% 调制而具有的正、负 `12 kHz`
    最大频率偏移。根据卡森法则，它对应于 `3 kHz`。`AMPS` 在传输在频域内划分的区域内利用 `FDMA`（频分多址）。允许用户在通话期间获得一对正向和反向语音信道。模拟蜂窝信道包括利用数字信号信息的语音和通过遵循二进制
    `FSK` 的 `FM`。


    ### 数字蜂窝系统

    它允许在性能和容量方面的发展。`FDMA` 利用频率信道化方法来管理频谱，而时分多址（`TDMA`）使用时分划分的方法。所有可用的蜂窝 `RF` 频谱被划分为窄带通道内的子类，这些通道在基站和移动点之间作为单向通信链路被利用。


    ### 蜂窝系统中使用的多接入技术

    蜂窝系统通常会被分配特定数量的频率频谱。由于使用了多种多接入方法，用户可以轻松地共享可用频谱。无线通信可以遵循三个维度进行复用，这三个维度是 `TDMA`（时分多址）、`CDMA`（码分多址）和
    `FDMA`（频分多址）及其各种 `OFDMA`。


    在 `TDMA` 中，可用频谱被分为频率信道或窄频带。这些还被划分为许多时隙。根据美国数字蜂窝标准 `IS 136`，每个频率为 `30 kHz` 的频率信道被划分为三个隙。另一方面，根据欧洲数字蜂窝系统，每个频率为
    `200 kHz` 的频率信道被划分为八个隙。`GSM` 保护带对于时隙和频率信道都是至关重要的。


    用户在 `FDMA` 中共享频率频带内被称为业务信道的可用频谱。考虑到频带包含用户的信号功率，不同的用户被分配了不同的信道。所有模拟蜂窝系统都涉及 `FDMA`。数据流在一种名为
    `OFDM` 的多蜂窝传输方法中涉及多个较低速率的载波音调。移动通信系统包括 `OFDM` 以控制恶性的频率选择衰落。无线网络标准也通过引入 `OFDM`
    来维持。`OFDM` 提供了 `OFDM` 调制和相干识别的优点。它具有若干对于未来高速传输较为复杂的特性。通过对 `OFDM` 收发器进行上下变频，可以极大减少对电气带宽的需求。这对于高速设计非常有效，因为电气带宽涉及成本。此外，当
    `OFDM` 收发器中涉及信号处理时，有效的 `FFT`（快速傅里叶变换）或逆 `FFT` 算法的优势就建立了。


    ### 数字调制键控

    通常，通信系统对载波进行调制以产生带通波形。数字信号可以帮助调制正弦载波的频率、幅度或相位，形成三种不同的数字调制形式，如 `FSK`（频移键控）、`ASK`（幅移键控）和
    `PSK`（相移键控）。此外，某些调制方案还涉及相位调制和幅度调制的结合。值得注意的是，`PSK` 传输是极性的，而 `ASK` 信号是非极性的。`PSK`
    代表非线性调制方案，而 `ASK` 代表线性调制。`PSK` 的效果比 `Ask` 好。


    #### QPSK（四相移键控）

    上述数字调制方法的频谱效率并不高，因为可用信道带宽没有被完全利用。`OPSPSK` 有助于提高频谱效率。它涉及两种信息源。在这种方法中，调制载波通过正交相位组合创建输出波形。在
    `QPSK` 中，调制增益和调制器波形的幅度几乎相等形成。


    #### DPSK（差分相移键控）

    在 `OPSK` 对 `PS` 的修改中，不需要为了识别 `PSK` 信号引入同步载波。这是一种原始方法，通过应用 `1-bit delay` 从前述位间隔内的接收到的波形中推导出载波参考。


    ### 涉及包交换的数据传输

    通过包交换过程提供具有互连性的不同地址数据包以进行通话。


    #### SMS（短信业务）

    如 `GSM`、`EDGE`、`IS-136` 和 `PDC`（包数据业务）等数字蜂窝网络支持短信业务，这是最常见的包服务之一。它代表了存储和转发或包模式服务，并提供了固定网络内不同服务和应用程序之间的互操作。由于适用网络服务之间的消息传输，通常利用信令和控制信道进行数据传输。


    #### GPRS（通用分组数据业务）

    `GPRS` 对于代表基础语音优化型蜂窝网络系统的附加功能非常重要，用以处理无线接入技术的重要属性。


    #### EDGE（GSM 演进增强数据速率）

    当你想要增强 `2G` 服务的数据处理能力时，必须修改无线接入部分。`EDGE` 是这种修改的形式，它在欧洲演进。它有助于采用一种机制，根据链路随时间变化的质量选择最佳的调制组合和编码方案。`EDGE`
    概念涉及包模式和电路模式，并且具有足够的通用性，可用于其他数字蜂窝系统。


    #### 扩展频谱

    扩展频谱是一种特定的通信方法，它有意识地涉及更多的无线频率。对于提高信噪比至关重要。它有助于防止故意干扰并确保通信安全。


    #### 跳频

    在跳频方法中，传输频率通过将窄带信号扩展为伪随机函数的函数而转换为预分配的信道。


    #### 直序列

    在直序列方法中，信号通过使用本地生成的 `PN`（伪噪声）码在无线电的宽带部分进行扩展。扩展频谱信号具有许多不同的格式，并被用于通信符号。结果是，尽管接收器可以通过单个消息识别出这些格式之一。


    #### CDMA（码分多址）

    `CDMA` 是一种涉及扩展频谱技术的直序列类型。它帮助许多用户参与相同的频率时间和分配。`CDMA` 通过为每个用户分配唯一的扩展码，提供了比 `AMPS`
    更多的模拟容量和比 `TDMA` 更多的通话容量。


    #### PCS（个人通信系统）

    `PCS` 涉及智能网络和蜂窝网络的结合。它代表协议中的 `SST`（超简单传输）。作为北美的实现，`PCS` 遵循 `GSM` 标准并提供扩展的容量和特定服务，如呼叫转发和短信。二级频段被专门化。该频段包含两个从
    `1710 MHz` 到 `1785 MHz` 以及从 `1805 MHz` 到 `1880 MHz` 的区域。


    #### DECT（数字增强无线通信）

    `ETSI`（欧洲标准协会）开发了 `DECT`，它是 `PCS` 的一种类型。


    #### GSM（全球移动通信）

    `ETSI`（欧洲标准协会）开发了 `DECT`，它是 `PCS` 的一种类型。（注：此处原文内容重复，按要求保留并翻译）

    `GSM` 提供扩展的容量和特定服务，如呼叫转发和短信。二级频段被专门化。该频段包含两个从 `1710 MHz` 到 `1785 MHz` 以及从 `1805
    MHz` 到 `1880 MHz` 的区域。


    #### GSM（全球移动通信）

    `GSM` 提供扩展的容量和特定服务，如呼叫转发和短信。二级频段被专门化。该频段包含两个从 `1710 MHz` 到 `1785 MHz` 以及从 `1805
    MHz` 到 `1880 MHz` 的区域。


    #### GSM（全球移动通信）

    `GSM` 提供扩展的容量和特定服务，如呼叫转发和短信。二级频段被专门化。该频段包含两个从 `1710 MHz` 到 `1785 MHz` 以及从 `1805
    MHz` 到 `1880 MHz` 的区域。


    （注：由于原文文本中存在大量重复内容，根据“不要重复输出原文”原则，此处译文已涵盖所有逻辑段落。若需完全对应原文重复结构，请告知。）


