    \ a one-to-one system to permit two simultaneous transmissions. Every mobile unit\
    \ includes a specific number to maintain privacy.\n\n### Recent and Previous Mobile\
    \ Communication\nFrom the year of 1983, the commercial application of `AMPS` (advanced\
    \ mobile phone system) has enhanced the growth of the mobile communication system.\
    \ The cellular concept was a great breakthrough.\n\n### Cellular Concept\nThe\
    \ advent of cellular operation has developed exponential growth within the personal\
    \ communication system involving different advancements such as wireless access,\
    \ integrated circuits, digital signal processing, increased battery life, and\
    \ so on. The cellular system acts by following the steps below:\n\n*   An available\
    \ frequency spectrum is separated into discrete channels to assign within groups\
    \ to the geographic area where cellular service will cover.\n*   The discrete\
    \ channels have the capability to be reused within different cells ranging from\
    \ 2 km. to 50 km.\n*   An `RF` (radio frequency) transmitter is used within the\
    \ service area when adjacent cells avoid interference by the operation on different\
    \ frequencies.\n"
  trans: "\n\n## 2.4 GHz\n2.4 GHz – 这是两个频率中较低的一个，但它也是 Wi-Fi 技术中更常用的频率。市场上有许多设备在使用这个频率。它也有一个缺点：使用特定频率的设备数量越多，该频率就变得越拥挤。因此，信号传输中会出现干扰，所以速度并不总是很快。但它可以轻松地穿过墙壁和窗户。\n\
    \n## 5 GHz\n接下来我们来看两个频率中较高的一个。这个频率没有前一个那么流行，因此使用它的设备也少得多。所以，如果某个设备在使用这个频率，因为拥的人较少，它可以实现更高的速度。但它也有一个缺点，即这个频率穿透墙壁和窗户的效率不如前者。这就是为什么\
    \ 5GHz 技术受到限制的原因。\n\n## Wi-Fi 频段\n因此，Wi-Fi 可以分为两个类型的频段或频率带。在 Wi-Fi 的每个频段中都有几个不同的通道。你可以将这些通道想象成一个举办派对的房屋里的独立房间。当一个房间里的人太多时，你无法在里面进行交流。这时你就必须去另一个房间，但过一段时间后，那个房间也会变得拥挤。很快，你会发现整栋楼都变得拥挤，这时你最终放弃了发起对话，因为在那个拥挤的地方已经不再可能。\n\
    \n### 2.4 GHz 频段\n首先，我们将讨论这个 Wi-Fi 频段。该频段总共有 14 个通道，但并非所有通道都是唯一或独立的。其中有几个通道是重叠的，你能猜到后果是什么吗？嗯，它们无法同时使用。如果你正在考虑建立网状网络（mesh\
    \ network），有些是你是你知道的。同一个通道必须包含所有的网状链路。根据你所处的地理位置，可用的通道数量会有不同。例如，如果你来自美国，那么通道 14、13\
    \ 和 12 是无法供 Wi-Fi 使用的，因为它们被用于卫星和电视服务业务。因此，为了建立网络，你可以使用 1 到 11 之间的任何通道。对于世界其他地区，1\
    \ 到 13 之间的通道通常可用于构建网络，但在某些地方你甚至可以使用通道 14。除了我上面提到的内容外，在 2.4 GHz 频段中，在美国最好用的通道是\
    \ 1、6 和 11。存在某些部分重叠的 Wi-Fi 信号，但如果你坚持使用这些通道，将面临非常少的干扰。你还应该记住，为网络使用其他通道是完全没问题的，只要它们之间隔开\
    \ 5 个通道，例如 3、8、13。但这不是一个最佳选择，因为通道 13 在世界上许多地方并不是可行的选项，而且你没有利用到通道 1 和 2。无论你在世界的哪个地方，做一下小小的研究，你就会了解该地区最常用的通道，然后你需要相应制定计划，以免你的网络产生重叠。\n\
    \n### 5 GHz 频段\n由于这是一个较高的频率，它比 2.4 GHz 频段宽得多。因此，它拥有更多的通道。最棒的一点是，这些通道不像 2.4 GHz\
    \ 频段那样重叠，因此没有所谓的非标准通道。在有这么多通道的情况下，在这种选择一个不会引起任何干扰的通道是非常容易的。在美国构建网状网络的可用通道有 165、161、157、153、149、48、44、40\
    \ 和 36。但这些之外，其他通道可用于其他形式的社区网络或接入点，但当涉及到网状网络时，那些通道无法工作。你可以在线查看你所在地区哪些有效，哪些无效。\n\
    \n## 天线\n接下来我们来看天线。无线路由器使用不同类型的天线。但在某些路由器中，天线并不总是独立的，因为它们是内置的。另一方面，还有其他类型的路由器，你可以选择想要连接什么种类型的天线。天线有很多类型，但如果你考虑基础知识，有三种，下文解释——\n\
    \n*   **全向天线 (Omnidirectional Antennas)**：该术语本身表示了这种天线的类型。它负责向所有方向均匀地发送信号。通过这些天线，在任何方向建立连接都是可能的。\n\
    *   **定向天线 (Directional Antennas)**：与全向天线的主要区别在于它们只向一个方向发送信号。这些天线的用处是你可以增加信号传输的距离。它们可以进一步分为两类：\n\
    \    *   **聚焦天线 (Focused Antenna)**：这种类型的天线以窄束的形式发送信号，宽度通常在 5 到 10 度之间。\n    *\
    \   **扇区天线 (Sector Antenna)**：它们以扇形的形式发送信号。宽度可以高达 120 度。\n\n## 第 6 章：移动通信系统\n\
    ![Bar, Ipad, Mockup, Business](img/Image0007.jpg)\n移动通信技术允许你使用无线网络与他人通信。无线电波用于创建无线电话。该系统涉及不同的类型。公共无线电、移动双向无线、业余无线电和手机是不同类型的示例。公共无线电用于消防、警察和市政机构，包括\
    \ `FM`（调频）无线系统。该系统的能力限制在小的地理区域内。移动双向无线有助于创建半双工模式的通信系统。`CB`（民用频率）无线是这种类型最常见的例子之一，它利用\
    \ `AM`（幅度调制）在 26.271 MHz 到 27 MHz 的频率范围内运行，涉及 40 个通道。它使用按下通讲开关，因为它不是商业服务。移动电话提供全双工传输。它涉及一对一系统，允许同时进行传输。每个移动单元都包含一个特定的号码以维护隐私。\n\
    \n### 近期与之前的移动通信\n自 1983 年以来，`AMPS`（先进移动电话系统）的商业应用促进了移动通信系统的增长。小区概念是一个巨大的突破。\n\
    \n### 小区概念\n小区业务的出现促进了个人通信系统的指数级增长，涉及无线接入、集成电路、数字信号处理、电池寿命延长等不同进步。小区系统通过遵循以下步骤运行：\n\
    \n*   将可用频谱划分为离散通道，分配到覆盖蜂窝服务的地理区域内。\n*   离散通道可以在 2 公里到 50 公里的不同范围内重用。\n*   当相邻小区在不同频率上运行时，服务区域内的\
    \ `RF`（射频）发射器可以避免干扰。\n\n"
