    \ and that is, this frequency is not efficient in passing through walls and windows\
    \ as the previous one. That is why the technology of 5GHz is limited.\n\nWi-Fi\
    \ can thus be categorized into two types of bands or frequency bands. There are\
    \ several different channels in each of the frequency bands of Wi-Fi. You can\
    \ think of these channels as separate rooms in a house where a party is happening.\
    \ When there are too many people in one room, you cannot really conduct a conversation\
    \ there. That is when you have to go to another room but after some time, that\
    \ room can get crowded as well. Very soon, you will find that the entire building\
    \ is becoming crowded and that is when you finally give up on initiating a conversation\
    \ simply because it is no longer possible in that crowded place. 2.4 GHz Band\
    \ – First, we will discuss this band of Wi-Fi. There are a total of 14 channels\
    \ in this band but not all these channels are unique or separate. There are several\
    \ of them which are overlapping and can you guess the consequence of it? Well,\
    \ they cannot be used at the same time. If you are thinking about setting up a\
    \ mesh network, there is something that you should know about it. The same channel\
    \ has to contain all of the mesh links. Depending on your location in the world,\
    \ the available channel number will vary. For example, if you are from the US,\
    \ then channels 14, 13 and 12 are not available for the use of Wi-Fi because they\
    \ are used for the purpose of satellite and TV services. So, in order to build\
    \ a network, you can use channels anywhere between 1 and 11. For the rest of the\
    \ world, the channels between 1 and 13 are usually available for building a network\
    \ but there are some places where you can even use channel 14. Apart from what\
    \ I have mentioned above, in the 2.4 GHz band, the channels that are the best\
    \ for use in the US are those of 1, 6 and 11. There are certain partially overlapping\
    \ Wi-Fi signals but if you stick to these channels, you will face very little\
    \ interference. You should also keep in mind that using other channels for your\
    \ network is totally fine as long as they are 5 channels away from each other,\
    \ for example, 3, 8, 13. But this is not an optimal option as channel 13 is not\
    \ a viable option for many places around the world and you are not putting Channels\
    \ 1 and 2 to use. No matter where you are in the world, do a small research and\
    \ you will get to know about the channels that are mostly used in that region\
    \ and then you need to plan accordingly so that your network is not overlapping.\
    \ 5 GHz Band – Since this is of a higher frequency, it is much wider than the\
    \ 2.4 GHz band. Consequently, it holds a greater number of channels too. The best\
    \ thing is that these channels are not overlapping as in the case of the 2.4 GHz\
    \ band and so there is nothing such as a non-standard channel. With the presence\
    \ of so many channels, choosing a channel that doesn’t cause any interference\
    \ is pretty easy in this case. The channels available for building a mesh network\
    \ in the US are those of 165, 161, 157, 153, 149, 48, 44, 40 and 36. But apart\
    \ from these, the other channels are available for other forms of community networks\
    \ or access points but when it comes to a mesh network, those channels are not\
    \ going to work. You can check online for what works in your area and what doesn’t.\
    \ Antennas Next, we come to the antennas. There are different types of antennas\
    \ in use by wireless routers. But in some of the routers, the antennas are not\
    \ always separate because they are built-in. On the other hand, there are other\
    \ types of routers where the choice will be yours regarding what type of antenna\
    \ you want to attach. Antennas can be of many types but if you consider the basics,\
    \ then there are three and they are explained below – \n\n*   Omnidirectional\
    \ Antennas – The term itself signifies the type of antennas this is. It is responsible\
    \ for sending out signals in all directions but equally. With these antennas,\
    \ the creation of a connection in any direction is possible.\n\n*   Directional\
    \ Antennas – The main difference with that of omnidirectional antennas is that\
    \ these send out signals only in one direction. The benefit of these antennas\
    \ is that you can increase the distance the signal has to travel. They can be\
    \ further classified into two –\n\n\\-          Focused Antenna – This type of\
    \ antennas sends out a signal in the form of a narrow beam which is usually between\
    \ 5 to 10 degrees in width. \\-          Sector Antenna – These send out signals\
    \ in the form of a wedge. They can be as high as 120 degrees in width. \n\nChapter\
    \ 6: Mobile Communication System ![Bar, Ipad, Mockup, Business, Computer](Image00007.jpg)Mobile\
    \ communication technology allows you to communicate with others using a wireless\
    \ network system. Radio waves are used within a radiotelephone creating a mobile\
    \ communication system. This system involves different types of facilities. Public\
    \ land mobile radio, a mobile two-way radio, amateur radio, and mobile phone are\
    \ examples of different types of mobile communication systems. Public land mobile\
    \ radio is used in fire agencies, police and municipal agencies including a two\
    \ way FM (Frequency Modulation) radio system. The capability of this system is\
    \ restricted within a small geographical area. A mobile two-way radios help to\
    \ create a one-to-many communication system to operate within a half-duplex mode.\
    \ CB (citizen band) radio is one of the most common examples of this type of radios\
    \ and it utilizes AM (amplitude modulation) to operate within the frequency ranging\
    \ from 26.271 MHz to 10 kHz involving 40 channels. It utilizes a press-to-talk\
    \ switch as it is not a commercial service. It may be available as amplitude modulated\
    \ with a single-sideband or double sideband suppressed carrier. Amateur (HAM)\
    \ radios can cover a broad frequency band ranging from 1.8 MHz to 30 MHz including\
    \ CW (continuous wave), FM, AM, HF slow-scan still picture TV, facsimile, radio\
    \ teleprinter, UHF or VHF slow scan or fast-scan TV, amplitude-shift keying and\
    \ frequency-shift keying. The mobile telephone provides full-duplex transmission.\
    \ It involves a one-to-one system to permit two simultaneous transmissions. Every\
    \ mobile unit includes a specific number to maintain privacy. Recent and Previous\
    \ Mobile Communication From the year of 1983, the commercial application of AMPS\
    \ (advanced mobile phone system) has enhanced the growth of the mobile communication\
    \ system. The cellular concept was a great breakthrough. Cellular Concept The\
    \ advent of cellular operation has developed exponential growth within the personal\
    \ communication system involving different advancements such as wireless access,\
    \ integrated circuits, digital signal processing, increased battery life, and\
    \ so on. The cellular system acts by following the steps below. \n\n*   An available\
    \ frequency spectrum is separated into discrete channels to assign within groups\
    \ to the geographic area where cellular service will cover.\n\n*   The discrete\
    \ channels have the capability to be reused within different cells ranging from\
    \ 2 km. to 50 km.\n\n*   An RF (radio frequency) transmitter is used within the\
    \ service area when adjacent cells avoid interference by the operation on different\
    \ frequencies."
