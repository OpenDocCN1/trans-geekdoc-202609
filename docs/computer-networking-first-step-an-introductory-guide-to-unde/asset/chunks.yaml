    # 第 3 章：什么是互联网？


    ![Terra, Internet, Globalizzazione, Tecnologia, Rete](img/Image00004.jpg)


    简单来说，互联网是一个全球性的计算机网络。它提供了通信设施以及信息共享等其他功能。全球网的骨架通过标准通信协议相互连接。它作为一个“网络之网络”而运行，全球所有的
    Web 服务器都互联联，形成一个国际网络。例如，你正在你的电脑或笔记本电脑上工作，而这些设备正运行在网络上。你可以从另一台运行在独立网络上的计算机获取任何信息、消息和数据。如果你对他人计算机的网络具有访问权限，这种信息共享就可以发生。互联网的概念最早于
    1969 年由美国国防部下属国防高级研究计划局（`DARPA`）提出的。该机构旨在建立一个网络，以便在发生军事攻击或此类破坏时，将信息从防御系统的一台计算机传输到另一台计算机。然而，这项设施现在已扩展到全球，全球每个角落的公民都可以访问。


    ## 互联网的历史


    在 1969 年 `DARPA` 发明了革命性的互联网之后，它的使用被局限于美国的防御系统中。近一个半世纪后，即 1983 年，一种名为 `TCP/IP`
    的新型网络协议技术演变出来。`TCP/IP` 代表传输控制协议/网络协议，它由一组用于开放式套件的标准协议组成。1985 年，美国科学基金会网络（`NSFN`）开发了一种新的网络设计，使所有的计算机科学部门能够在范围内连接它们的计算机。1989
    年，随着超文本传输协议（`HTTP`）的开发，互联网通信得到了极大改进。`HTTP` 的发展为互联网世界带来了巨大的变化。它提供了各种计算机平台到互联网上相同站点的连接能力。1993
    年，当 Web 浏览器 `Mosaic` 演变时，互联网网络进一步扩大。然而，互联网在全球范围内不断发展其强大的存在性。例如，互联网协议第 6（`IPv6`）是由互联网工程任务组（`IETF`）开发的，它实现了数据包交换。数据交换简化了网络中两台计算机之间的数据接收和发送。互联网的发展开启了其商业化和竞争的必要性。然而在
    20 世纪 80 初，一些供应商已将 `TCP/IP` 整合到他们的业务产品线中。这种发生并不是因为供应商想要启动网络，而是因为客户在接触网络。因此，供应商的组织也开始接触消费产品的网络化。然而，1988
    年当 `Interop` 贸易展会开始时，满足消费者论坛和供应商组织的需求变得可能了。互联网的商业化已使其成为一种商品，现在它已成为全球范围内信息共享的骨干和支持全球商业活动的支柱。


    ## 互联网是如何工作的？


    互联网的功能分为两个部分。一个是物理部分，另一个是技术部分。互联网的物理部分根据现行的电信过程原理工作。技术部分处理 `TCP/IP`，它使用一组数据传输指南。当你深入研究互联网时，你会发现两个作为整个互联网基础设施支柱的两个组件。第一个支柱是网络协议，第二个支柱是硬件。


    第一个组件网络协议（如 `TCP/IP`），它由一组规则组成，指导设备执行以完成任务。没有这些公共规则集，机器将无法执行任务。使用这些协议集的目的是将数据中使用的、数字和其他符号翻译成电子信号。这些电子信号在互联网上传输。最后，当信号到达终端用户时，信号会被重新翻译回其原始文本形式。


    互联网基础设施的第二个支柱是它的硬件部分。它包含了在网络中两台计算机之间传输信息的电缆。还包括路由器、卫星、手机塔等其他硬件。所有硬件都连接到网络。智能手机、电脑等设备被称为“客户端”。客户端-服务器架构分配了跨设备的计算。互联网的通信线路可能有两种类型。一种是通过手机塔或卫星发送的无线信号。另一种是像光纤这样的物理连接。跨设备的数据传输取决于无连接网络中的包交换。当你尝试通过互联网向某人发送数据时，每个数据包会被分配一个名为端口号的数字。因此，你的数据包具有两个特征。其之一是唯一的
    IP 地址，另一个是端口号。唯一的 IP 地址和端口号从字母数字文本翻译成电子信号。


    现在信号在通信模型的层之间传递。信号从应用层移动到物理层。然后信息通过互联网提供商（`ISP`）的路由器进行传输。路由器检查分配给每个数据包的接收者地址并确定发送路径。数据包到达客户端后，执行反向过程，将信号翻译成原始数据的字母数字形式。当信号从
    `OSI` 模型的下层移动到上层时，该过程开始。在此过程中，通过检测 IP 地址和端口号从数据包中剥离字母数字数据，从而完成数据传输过程。


    ## 互联网的用途


    虽然全球几乎每个人都在使用互联网，但了解互联网的用途是非常重要的。它通常用于将信息从一个地方共享到另一个地方（全球范围内）。以下是互联网用途的一些重要例子：


    -   访问即时消息、电子邮件、互联网相对聊天、电话、视频会议、社交媒体；

    -   利用在线教育计划以获得学位、参加研讨会和不同的技能培训；

    -   两端获得工作的机会，例如，雇主发布职位机会，工作申请者可以申请空缺职位。招聘者和申请者都可以在像 `LinkedIn` 这样的共同社交媒体平台上找到彼此；

    -   研究工作的可扩展性以及下载下载；

    -   开发在线小组论坛的能力；

    -   阅读杂志、报纸和期刊的能力。


    '
