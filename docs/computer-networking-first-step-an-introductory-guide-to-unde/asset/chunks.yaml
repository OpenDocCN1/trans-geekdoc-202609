    # Chapter 3: What is the Internet?


    ![Terra, Internet, Globalizzazione, Tecnologia, Rete](Image00004.jpg)


    The internet, in simple words, is a global network of computers. It provides communication
    facilities and other facilities like the sharing of information. The skeleton
    of the global network is interconnected using a standard communication protocol.
    It works as a network of all networks in which all web servers of the globe are
    interconnected to form an international network. For example, you are working
    on your computer or laptop which is functioning on a network. You can get any
    information, message, and data from another computer which is working on a separate
    network. This sharing of information can take place if you have accessibility
    to a network of someone else computer. The concept of the internet was first conceived
    in 1969 by the Defense Advanced Research Projects Agency (`DARPA`) under the US
    Government’s Department of Defense. The agency aimed to set a network to transfer
    messages from one computer to another computer of the defense system in case of
    any military attack or such destruction. However, the facility has now been spread
    worldwide and accessible to all citizens from all corners of the globe.


    ## History of the Internet


    After `DARPA`’s revolutionary invention of the internet in 1969, the use of it
    was confined within the defense system of the USA. Nearly one and half decades
    later, in 1983, a new technology of network protocol was evolved as open network
    protocol termed as `TCP/IP`. `TCP/IP` stands for Transmission Control Protocol/Internet
    Protocol which consists of a set of standard protocol used in an open suit. National
    Science Foundation Network (`NSFN`) in 1985 developed a new design of network
    which enables all computer science departments to connect their computers countrywide.
    Internet communications were improved largely in 1989 when the HyperText Transfer
    Protocol (`HTTP`) was developed. The development of `HTTP` had brought a sea change
    in the internet world. It provided the connectivity ability of various computer
    platforms to the same site on the internet. The internet network was further expanded
    in 1993 when the web browser `Mosaic` had evolved. However, the internet has been
    continually developed its powerful existence all over the world. Internet Protocol
    version 6 (`IPv6`), for instance, has been developed by the Internet Engineering
    Task Force (`IETF`) that enables packet switching of data. Data switching eases
    data receiving and sending between two computers in a network. The development
    of the internet had opened the necessity of its commercialization and competitiveness.
    At the beginning of the 1980s, however, some vendors had incorporated `TCP/IP`
    for their business product lines. This was happened not because the vendors wanted
    to initiate the networking but because the customers who approached the networking.
    Thus, the vendors’ organization also approached to the networking of consumer
    products. Meeting the demand of both consumers forum and vendors organization,
    however, made possible in 1988 when the `Interop` trade show was started to begin.
    Commercialization of the internet has made it a commodity and now it has begun
    the backbone of information sharing and support commercial activities across the
    globe.


    ## How Does the Internet Work?


    The function of the internet has two parts. One is physical and the other one
    is technical. The physical part of the internet works on the principle of the
    prevailing telecommunication process. The technical part deals with `TCP/IP` which
    uses a set of data transmission guidelines. When you dig deep into the internet,
    you will find two main components that act as pillars of the entire internet infrastructure.
    The first such pillar is the network protocols and the second one is the hardware.


    The first component, the network protocol like `TCP/IP` comprises a set of rules
    that directs a device carries out to accomplish the task. Without these common
    sets of rules, a machine would not carry out the task. The purpose of using the
    sets of protocols is to translate the alphabetic, numeric, and other symbols used
    in data into the electronic signals. Those electronic signals are transmitted
    across the internet. Then, finally, the signals are retranslated to its original
    text form when it reaches to its end-user.


    The second pillar of the internet infrastructure is its hardware part. It includes
    a smartphone, computer to even a cable that transfers information between the
    devices. There are some other types of hardware such as servers, routers, satellites,
    cell phone towers, radios, etc. All the above hardware is somehow connected to
    the network. The devices like smartphones, computers, laptops, etc. are called
    `clients`, or `endpoints`. While a machine that provides a program for the functioning
    of other devices termed as “clients” is called a server. This client-server architecture
    distributes overall computation across multiple devices.


    The communication lines responsible for exchanging the data across the internet
    may be of two types. One is wireless signals that have been sent either through
    cell phone towers or satellites. The other one may be a physical connection like
    fiber optics through which the signals can be sent. Data transfer from a device
    to another device relies on a connectionless network called packet switching.
    Whenever you try to connect the internet through your computer, a unique `IP address`
    is allotted to your computer to identify it for all future reference. Similarly,
    when you try to send some data to someone over the internet, your data is managed
    in the form of packets. Each such packet is allotted a number called the `port
    number` which is used to connect the receiver of it. So, a packet of your data
    has two features. One is its unique `IP address` and another one is its `port
    number`. Both unique `IP address` and `port number` are translated from their
    alpha-numeric text into the electronic signals.


    Now the signals pass between the layers of the Open System Interconnection (`OSI`)
    model of communication. The signals move from the top of the application layer
    to the bottom of the physical layer. Then the message is transferred over the
    internet where the signals are received by the router of the Internet Service
    Provider (`ISP`). The router examines the receiver’s address that has been allotted
    to every packet and determines the path for sending the packet. After reaching
    the data packet to the client the reverse process is executed to translate the
    signals into an alpha-numeric text form of the original data. The process begins
    when the signal moves from the bottom of the lower layer to the top of the upper
    layer of the `OSI` model. During the process, the alpha-numeric data is stripped
    from the data packet by detecting the `IP address` and `port number` and this
    way complete the data transmission process.


    ## Uses of the Internet


    While almost everyone from across the globe is using the internet, it is pertinent
    to know the purposes for which the internet can be used for. It is generally used
    for the sharing of information from one place to another place that may be across
    the world. However, some important examples of uses of the internet are mentioned
    below:


    *   Accessibility for instant messaging, emails, internet relay chat, telephony,
    video conferencing, social media;

    *   Attainability for online educational programs for acquiring a degree, attending
    workshops and different skill development training;

    *   Opportunity for the job from both ends, for instance, an employer posts job
    opportunity, a job applicant can apply for the position vacant. Both recruiters
    and applicants can find themselves in a common social media platform like `LinkedIn`;

    *   Scalability of research work and downloading of files;

    *   Capability to develop forums for online group discussion;

    *   Ability to read magazines, newspapers, and journals;

    '
