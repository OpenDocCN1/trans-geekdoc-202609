    # Chapter 7: Wi-Fi And Internet Troubleshooting ![Senza Fili, Internet, Router,
    Accesso, Torre, Wave](Image00008.jpg)


    Wi-Fi is an essential technological development of the modern period. It is a
    wireless network technology to connect a wide range of digital devices, hardware
    and accesses points involving a radio transmission technology. It is convenient
    to use for any consumers. It actives over more distance than infrared or Bluetooth
    and is also below the power of unobtrusive technology. It is compatible with many
    operating systems, advanced printers, and your devices. It is a perfect option
    for portable devices such as smartphones, laptops, tablets, and so on to connect
    the internet. Wi-Fi Alliance is an association manufacturer and they regulate
    standard definition and product certification and they also govern Wi-Fi. There
    are many levels of Wi-Fi network services involving different power requirements
    and speeds. The earliest level of the Wi-Fi network system was `802.11b`. Then,
    it was upgraded to `802.11a` and `802.11g`. The latest standard of the Wi-Fi network
    system is `802.11n`.


    ## How Does Wi-Fi Work?


    Wi-Fi network involves radio waves to transmit data or information across a network
    system. The computer will have to include a wireless adapter to translate data
    sent within a radio signal. This same signal will be transmitted using an antenna
    to a decoder named as the `router`. Then, the data or information will be delivered
    to the internet by using a wired Ethernet connection. As Wi-Fi serves for two-way
    traffic, the received data from the internet will pass by using the `router` to
    be coded within a radio signal for being accepted by the wireless adapter of the
    computer. Wi-Fi makes a network within your office or home where your computers
    will get broadband internet.


    ## How Can You Set Up Wi-Fi?


    There is need specific equipment if you want to use Wi-Fi and these are a wireless
    transmitter named `WAP` (Wireless Access Point) and a Wi-Fi adapter. There are
    many ISPss (Internet Service Providers) who set up new customers including Wi-Fi
    facilities from the outset. If you want to set up Wi-Fi at home, you will have
    to need a wireless router and you will also have to access the admin management
    pages of the `router` to arrange the perfect setting such as password, Wi-Fi channel
    and network name. Sometimes, wireless adapter built-in is not available within
    the device and you can purchase a Wi-Fi USB adapter. You can make a wireless hotspot
    from your computer to share the internet connection with the other devices. Wi-Fi
    connection is widely used within airports, cafes and many public buildings.


    ## 10 Steps for Troubleshooting of Wireless Networking Issues


    There are various factors related to wireless networking issues. 1o Steps for
    troubleshooting of wireless networking issues have been explained here. Before
    pointing it within the proper direction, turn it on: Sometimes, it is difficult
    to find out the most obvious reason of trouble within the network system. Most
    of the time, faulty assumptions are made. When your Wi-Fi network connection doesn’t
    work, it will be the best option to follow the absolute basics and these are:


    *   You should check whether the wireless adapter is connected without thinking
    about the type of device that you are using.

    *   You should ensure that your tablet or phone is not in Airplane Mode.

    *   There are many WLAN environments that involve multiple service set identifiers
    and all of them will not help you to reach your desired place. When your Wi-Fi
    network connection is active, you will not get any option to check whether you
    have selected the right network services to reach your desired location. Some
    wireless internet connection involves dead ends for specific purpose dead ends
    where internet connection is not available.

    *   Sometimes, it is essential to take coordinated permission for using Wi-Fi
    considering the type of network services which you want to connect. If you over-look
    this condition to follow this step at the time of making a network connection,
    you will not get network service.


    ### Try to Understand the Level of The Issue


    If you want to solve the issues for your network connection, you will have to
    understand how far the issues have been spread. You should follow the steps below
    to understand it.


    *   Do you have a connected relative device? For example, can you make a connection
    using your laptop, but not using your smartphone? Can you relate your network
    connection with anyone closer to you?

    *   If you understand that the issue is related to the user, single device or
    password, you can take the assistance of the help desk to get arrangements properly.

    *   Devices of any client or ant accounts of a user may have the issues whether
    you are using a high-quality Apple product or you are working as a C-level employee,
    everyone usually faces Wi-Fi networking issues.

    *   When multiple users face network problems, you can give more explanations
    to IT and you will get the solution within a faster way.


    ### Follow the basic diagnostics


    When your Wi-Fi network connection doesn’t work, smartphones, laptops, and tablets
    can display and help you to get information on a basic level. But, you will have
    to understand what you are trying to find out. Don’t make decisions by considering
    scant information.


    *   The signal bar usually indicates the network connection strength. If the signal
    bar is not visible or too weak, it represents that there are some issues within
    your network connection.

    *   Sometimes, the users’ devices are not perfect at roaming. You can get a poor
    network connection signal due to the poor performance of your device.

    *   To `ping`, a destination is one of the most effective network troubleshooting
    steps. It will help you to understand whether the target device is active to maintain
    both directions network connection path between the destination and the source.
    But, `ping` may be inactive for many reasons starting from the firewall setting
    of the host to filtering throughout the networking path.

    *   You can include `DNS` (Domain Name System) test to find out `DNS` issues.
    `DNS` test is an easy procedure and explains lots of things for troubleshooting.

    *   Most standard network systems include labeling system. If you have an issue
    for the access point, you will note down the specification of labeling and the
    visible LED color when you are reporting for the issue.


    ### Try to Understand the framework of Failure Point


    Most of the framework of WLAN is complicated than a Wi-Fi network connection.
    But, if you understand common high-standard failure points regarding the framework
    of the connection. Different types of automated tools help to offer a well-administered
    network connection.


    *   Wireless network access points get failure and stop working for different
    reasons. The network connection component can be failed due to physical damage
    or firmware corruption.

    *   Sometimes, the access point of wireless internet connection can be overwhelmed
    due to high client counts or using high bandwidth applications by a few clients.
    Otherwise, when you are trying to get an internet connection within a crowded
    access point, your internet connection may be slow or inactive.

    *   Your network connection can be slow or hampered when there is a problem within
    a switch that supplies power to many access points.

    *   Sometimes, many access points are managed by a controller. When the controller
    gets damaged or fails to do work, there create big issues within the network system.

