- raw: 'Transmission Path Some of the parts of a transmissions path in case of wireless
    communication are as follows – multiplexing, modulation, encryption, and encoder.
    The Source Encoder is through which the signal originating from a source is passed
    through. In order to make the signal processing techniques work, a suitable form
    is created from the signal and that is done with the help of the source encoder
    itself. If the signal contains any redundant information, then that is immediately
    removed. This ensures that the maximum utilization of resources is done. Then
    comes the work of the Encryption Standard which is responsible for the signal
    encryption. This ensures that everything is transmitted in a secure form and no
    type of unauthorized access is entertained. All types of impairments in a signal
    like interference, noise and so on are all removed from the signal the moment
    you make it go through channel encoding. There is another thing that is done during
    this process, that is, in order to make the signal strong against noise, there
    is an introduction of a small amount of redundancy. Then, a suitable technique
    of modulation like FSK, PSK or QPSK is used. This enables the signal to be transmitted
    with the help of an antenna. Then comes the role of various multiplexing techniques
    like FDM or Frequency Division Multiplexing and TDM or Time Division Multiplexing
    and they help in the sharing of the valuable bandwidth. The Channel As you must
    have understood from the term itself, a channel in the case of a wireless communication
    network is the medium of transmission which, in this case, is open space. This
    can be highly variable and unpredictable in nature. It is also quite random. This
    channel suffers from a lot of things like scattering, noise, distortion, interference
    and so on. The result is that several errors begin cluttering in the signal. The
    Reception Path The collection of the signal from a particular channel is the task
    of the receiver. Then that same signal is reproduced to serve as the source signal.
    Demultiplexing demodulation is a part of the reception path in the case of a wireless
    communication system. Some other parts include source decoding, decryption, and
    channel decoding. Now, if you study these aspects carefully, you will understand
    that the task of the receiver and the transmitter are completely opposite to that
    of each other. The demultiplexer is the one that is responsible for receiving
    the signal from the channel. That particular signal is also separated from all
    other signals. The various demodulation techniques are then implemented to demodulate
    the individual signals. After all this, the original signal is finally recovered.
    The channel decoder then removed any or all of the redundant bits from the signal.
    Now, you must understand that the message you receive is in encrypted formatted
    so decryption has to be done as well. Thus, the security measures are removed
    and a simple sequence is extracted from that encrypted signal. Then the source
    decoder comes into play and the signal after decryption is given to it. Finally,
    the original transmitted message is retrieved.               Wireless Signal Before
    we go into the details, you first need to understand what a wireless signal is.
    The wireless signals are those who are responsible for the transfer of video,
    audio or any other form of data and they do it all without the presence of any
    kind of wires. But one thing that is universal to all types of wireless signals
    is that they are all electromagnetic waves that travel through air. Now, you must
    be wondering how these waves form. Well, when some type of metal is used for the
    transfer of electric energy, then there are waves that are generated around that
    piece of metal. These waves are known by the term of electromagnetic waves. Depending
    on what the strength of that energy is, the waves can travel certain distances.
    Now, we come to the different types of wireless signals that exist. There are
    some you must be pretty familiar with and they have been already discussed in
    gist in the previous chapter – television, AM and FM radio, Bluetooth, Wi-Fi and
    satellite connections. But all of them are different from each other in some form
    or the other. Frequency So, we start with some of the common aspects of wireless
    communication because, in order to fully understand it, you need to start with
    the basics. There is a specific spectrum assigned to every wireless signal. This
    spectrum is of a wide range which is calculated in terms of frequencies. But in
    simpler terms, the rate of vibration of a signal is termed to be its frequency.
    The signal is said to be of a low frequency if it vibrates very softly or almost
    negligibly. But consequently, the signal is said to have a high frequency, if
    it vibrates with greater energy. The measurement of frequency is done in Hertz
    and by this amount, you will come to know how quickly that particular signal is
    changing. Or, to put it simply, a signal changes every second but the frequency
    will help you understand how the signal has changed. An example should make it
    clearer to you. In the case of radio, FM signals have been proved to vibrate for
    over 100 million times per day. And in most cases, the frequency of wireless communication
    is mentioned in such high frequencies. This makes the process of stating the frequencies
    in their actual state a bit difficult because of so many zeros attached. Thus,
    they are abbreviated and thus, there is a term called Gigahertz. It is of greater
    value. Modulation The way in which a wireless network conveys information is also
    different from signal to the other. In order for you to send a message, this wireless
    signal often needs to be changed of modulated other you will not be able to send
    information to someone. Among the different types of modulation available, people
    can use any of them that suit their specifications. The two of them are known
    as FM and AM and in both these cases, the M stands for modulation. Both of them
    are different from each other based on the type of modulation they undergo. In
    the case of AM, the M is modulation but the A stands for amplitude. This means
    that it will depend upon the energy of the signal or its strength that is operating
    on a single frequency. Then there is the FM where again M stands for modulation
    but F stands for frequency. This means that the modulation is done with respect
    to the vibration of the wave per second. The different types of modulations implemented
    by the different technologies usually differ and are sometimes not compatible.
    Think about the satellite equipment. Can it speak directly to your phone or laptop?
    No, right? Your phone or laptop uses Wi-Fi in order to receive or send information.
    This is because various devices have certain fixed frequencies and modulations
    that they can listen to and not anything else. For example, you will get certain
    broadcast radio receivers that can switch between the FM and AM signals and this
    is done for two reasons. The first and the obvious one is that two frequencies
    are being used for transmission and secondly, the modulation type used is also
    different. If a radio is in FM mode and you try to listen to an AM signal through
    it, it won’t be giving you anything. The same is the case when you try to listen
    to an FM signal when, in fact, the radio is in AM mode. The receiver won’t be
    able to make sense of anything when the signals are so conflicting. Thus, the
    usage of the same frequencies as well as modulation types between receivers and
    transmitters is essential for the communication to be done effectively. Nearly
    every device that you have in your daily life has some different types of modulation
    and frequency. Thus, the conclusion is clear. Most devices can understand a very
