- raw: "Turn Off The Plug ‘n Play The plug ‘n play procedure allows devices to detect\
    \ the network within your home and connect to the manufacturer for supplies and\
    \ firmware updates. UPnP (Universal Plug ‘n Play) is an important element to create\
    \ things related to the internet. It is advantageous to make the smart household\
    \ appliance. UPnP is also advantageous to make a channel for hacking. UPnP helps\
    \ to build cooperation between networking supported smart household gadgets and\
    \ router. The hackers can hack or infect your household devices by including them\
    \ within botnets which direct the access requests. You should turn off the plug\
    \ ‘n play when you do not use the devices. As a result of this, you can maintain\
    \ network security for the devices. Change Your Default IP Address An IP address\
    \ is essential when you connect any device to the internet including the router.\
    \ The router also has another IP address to connect the devices which use the\
    \ internet through the router. There are some conditions when changing IP addresses\
    \ is essential and these conditions are as follows. \n\n*   When the user of network\
    \ services accidentally configures invalid IP address such as the setting of static\
    \ IP addresses involving the wrong numeric range.\n\n*   If you install a new\
    \ router and reconfigure your home network by using its default IP address range,\
    \ you will have to change your default IP Address.\n\nThere are mainly two types\
    \ of IP addresses such as static IP address and dynamic address. There are many\
    \ advantages to static IP addresses. By using a static IP address, your computer\
    \ can locate the server from anywhere. Moreover, it helps different computers\
    \ to run different operating systems to access the host systems and to find out\
    \ the same address every time. You can assign and handle the static IP address\
    \ easily. Disable File Sharing on Other Networks After connecting to the internet\
    \ using Dial-Up networking, you will be able to share files and printers on the\
    \ TCP (Transmission Control Protocol) or IP (Internet Protocol) connection to\
    \ the internet. You can prevent unauthorized access to your printers, files, and\
    \ network by disabling file sharing. You will not be sure that online sourced\
    \ files are malware-free. Generally, hackers target file-sharing application and\
    \ infect them by using malware. When you download these contents, there may be\
    \ a risk of security. It results in many security breaches if you have not strong\
    \ protection for security. Sometimes, file sharing interfaces reveal the computer\
    \ directory of the users without knowing them. As a result of this, hackers can\
    \ get information for hacking. There are many techniques for file-sharing and\
    \ some of the file-sharing techniques are as follows. \n\n*   Removal storage\
    \ media: It involves removable storage devices such as memory sticks, memory cards,\
    \ optical disks, removable hard disks and so on. A user of removable storage media\
    \ can share files to another person and the receiver can connect the services\
    \ to transfer files.\n\n*   FTP (File Transfer Protocol): It helps to share files\
    \ through the internet. All modern operating systems are available including built-in\
    \ networks. You will have to fix a valid login and password when you will want\
    \ to access it.\n\n*   Peer-to-peer network: It is a very popular way to share\
    \ files mainly for music and videos. The examples of peer-to-peer software are\
    \ uTorrent and Bit Torrent.\n\n*   Online storage websites or file hosting services:\
    \ Google Drive and Drop-box are examples of online storage websites or file hosting\
    \ services. A member can upload documents, photos and so on by using a web browser.\n\
    \nSometimes, your computer may be infected by malware through a malware-infected\
    \ system when you connect removable storage media for your computer. If you transfer\
    \ official files using FTP, your computer data can be exposed and create security\
    \ risk as FTP doesn’t include encryption for transferring data. Sometimes, when\
    \ users of file hosting services are not vigilant and they keep confidential data\
    \ within publicly accessible folders. By disabling file sharing on another network\
    \ can help you to avoid above mentioned issues or risks. Disable DHCP DHCP (Dynamic\
    \ Host Configuration Protocol) offers automatic, quick and central management\
    \ for sharing IP addresses within a network service. DHCP helps to configure the\
    \ default gateway, subnet mask and DNS (Domain Name System) server information\
    \ on the devices. Usually, in homes or small businesses, the router plays the\
    \ role of DHCP. When a user requests an IP address through a router, the host\
    \ allots an available IP address and helps the user to communicate by using network\
    \ services. When a device with DHCP server is turned on and communicated to a\
    \ network with DHCP server, it helps for sending a request to the server named\
    \ a DHCPDISCOVER request. After receiving the DISCOVER packet, the DHCP server\
    \ keeps to an IP address to be used by the device. Then, it provides the user\
    \ the IP address with the DHCP server including DHCPREQUEST to accept it. The\
    \ server confirms the user for having a specific IP address by sending an ACK\
    \ (acknowledgment code) and also explains the range of time which the user of\
    \ the device can use. DHCP helps to manage the network easily. The user of the\
    \ device can achieve IP address automatically and the user of the can move freely\
    \ within the network set up facilitated with DHCP. Upgrade Your Router’s Firmware\
    \ From Time To Time Router’s firmware upgrade is essential to upgrade your device’s\
    \ firmware. An upgrade firmware provides new features and advanced security. There\
    \ are different types of router, but the upgrading procedure of the router’s firmware\
    \ is nearly the same. You should always check the user manual available on the\
    \ manufacturer’s website for specific instructions to upgrade the router according\
    \ to your device model. Sometimes, router owners have to face threats from malware\
    \ users or hackers. When any device is created, the design of hardware and its\
    \ development is the primary phase. The firmware confirms that the hardware components\
    \ are functioning properly. Generally, the system performance of the device is\
    \ degraded due to the running of multiple programs through the device at a time.\
    \ It will also degrade the speed of operation and people think to replace the\
    \ worn-out hardware component by using new parts. Upgrade of router’s firmware\
    \ helps to speed up the device performance. If you want to upgrade the router’s\
    \ firmware, you will determine the router model. You can check the manufacturer’s\
    \ website by using the model number of your router to get the available procedure\
    \ to update the router. Generally, the update of the router is downloaded by using\
    \ the router’s admin panel. If you can download the updates firmware file, you\
    \ will download it and save it within your desktop. Otherwise, you will have to\
    \ use the admin panel to update the router from your computer. You will also have\
    \ to know your router’s IP address. Sometimes, the routers have an automatic firmware\
    \ update. Amped wireless router is one of the most favorite routers for gamers.\
    \ You can update the amped wireless router’s firmware conveniently. You can visit\
    \ the support section for an amped wireless website to update the firmware of\
    \ the amped wireless router. By clicking on the drop-down menu, you will have\
    \ to select the model number of your router. Then, click on the download option\
    \ and select firmware. You can choose the Linksys router or TP-Link router which\
    \ involves update firmware automatically. "
