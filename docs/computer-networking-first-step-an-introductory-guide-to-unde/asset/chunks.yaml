    # Types of Network Security


    There are several specific types of network security and some of these types of
    network security are as follows.


    ## Access control

    It helps you to prevent unauthorized devices and users from accessing your network.
    It only allows users who have permission to access a limited set of resources
    authentically. Access control systems act to identify the authentication and authorization
    of the users. It also helps to reduce the risk of unauthorized users by controlling
    the fundamental elements of a security program which help to ensure whether the
    policies of access control and security technology are in the right place for
    the protection of secret information such as customer details.


    Generally, the companies have configuration and process which restrict assess
    of network application, computer, system, file and confidential data such as intellectual
    property and personal information for identification. In the case of large businesses
    there are lots of employees and it is difficult to identify an employee. Then,
    the access control system helps to prevent strangers and to allow the employees.
    Moreover, it allows a business to restrict access to specific areas. It reduces
    accidents and thefts within the business by increasing safety.


    ## Anti-malware

    Anti-malware software resists infections caused by different types of malware
    such as all kinds of viruses, ransomware, rootkits, and spyware. It can be used
    in personal computing devices, network appliances or gateway servers. It is also
    useful for cloud services. Moreover, it scans all incoming network data used in
    malicious software and it also blocks any threat if it can detect. It can identify
    malware of advanced level and provides significant protection from the attack
    of ransomware. It resists users to visit websites that are known for spreading
    malicious code. It also resists the distribution of malware viruses when one device
    gets infected. It creates and follows up metrics about the quantity of infection
    and the required time to clear those infections. Sometimes, it assists the administrators
    to understand in what way the malware has attacked the compromised network or
    device.


    ## Application security

    It explains security measures when you apply it aiming to resist code or data
    within the app from being hijacked or stolen. It is a method of improving, adding
    and checking security features within applications to resist vulnerabilities.
    Presently, applications are frequently available within different networks and
    connected to the cloud. As a result of this, threats and breaches of security
    increase within the applications. Checking of application security can find out
    weakness at the level of the application by assisting to resist attacks of hackers.


    There are several types of application security such as authentication, encryption,
    authorization, logging, and application security testing. Application security
    of authentication helps to identify authorized users. The user will have to provide
    a user name and password at the time of logging in to a specific application.


    ## Behavioral Analytics

    It involves software tools to identify a pattern of unauthorized data transferring
    within a network. Tools of behavioral analytics follow up and report anomalies
    to judge considering the basics of normal behavior. A software product of behavioral
    analytics security can be marked as `BTA` (behavior threat analysis) product or
    `UBA` (user behavior analysis) product. Some products involve behavioral biometrics
    features for mapping significant behavior such as typing style. It has software
    to scan the deviation from the normal baseline. It also helps to decide intelligently
    whether an anomaly can be harmful or not.


    ## Data Loss Prevention (DLP)

    It includes a set of procedures and tools to be sure that confidential data is
    not misused, lost or accessed by unauthorized users. DLP software of network security
    helps to classify confidential, regulated and business-critical data and to detect
    policy violations termed by companies or within an already defined policy pack.
    Generally, DLP is advantageous for mainly three objectives and these are compliance,
    IP (intellectual property) safeguard, personal information safeguard, and data
    visibility. It controls and monitors the flow of sensitive information within
    a network. Some sensitive data of business are source code, product design reports,
    process documentation, financial reports, and so on.


    ## Email Security

    It explains different techniques to keep confidential data within email communication
    and also prevents unauthorized access, compromise or loss. Email is a common medium
    to expand spam, malware and phishing attacks. Generally, phishing attacks aim
    to the business department which maintains confidential data or financial information.
    Sometimes, email messages sent by malware may be destructive. A phishing email
    can contain malware within attachments structured to appear like valid documents.
    A phishing email can include hyperlinks of websites that act as malware. Moreover,
    phishing emails target to steal information by asking recipients for confirmation
    of their passwords, login information, bank account number, social security number,
    and even.


    ## Firewalls

    It monitors outgoing and incoming traffic and blocks malicious traffic such as
    reaching your network. Packet-filtering firewalls are one of the most common.
    They can be classified into two types as `stateful` and `stateless`.


    ## Intrusion Detection

    It scans for suspicious or or activities within the network. If you set up properly
    intrusion detection, it will help you identify what is happening. The intrusion
    detection system can be categorized into `NIDS` (Network Intrusion Detection)
    and `HIDS` (Host Intrusion Detection). `NIDS` observes passing traffic while `HIDS`
    monitors behavior.


    ## Network Segmentation

    It helps to divide a computer network into smaller parts improving network security.
    It decreases network congestion and prevents harmful traffic from reaching unprotected
    devices. It allows for only authorized users to access important resources.


    ## Security Information and Event Management (SIEM)

    It offers a holistic view of happenings within network services at the right moment
    and assists IT teams in being more proactive in the fight against security threats.
    The application of `SIEM` system is advantageous to protect companies of any size.
    It helps to increase efficiency and reduces costs and the effect of security breaches.
    It helps to make better reports and log analysis.


    ## VPN

    It builds an encrypted and safe connection to protect less secured network connections
    such as public internet. It involves tunneling protocols. There are several types
    of protocols used in `VPN` such as `IP`, `PPTP`, `SSL`, `L2TP`, `TLS`, and `OpenVPN`.


    If you want to use a limited resource by using a `VPN`, you will have to be authorized
    for using the `VPN` app and you will also have to submit one or more documents
    such as biometric data, password, or security token. Anyone can protect data transferring
    on their mobile devices or can visit geographically limited websites by using
    `VPN` apps. It is advantageous for remote corporate employees, business travelers,
    and freelance workers. There are several types of `VPN` such as `remote access
    VPN`, `mobile VPN`, `site-to-site VPN`, `hardware VPN`, `MPVPN`, and `VPN appliance`.


    ## Web Security

    It involves protocols and protection measures for the protection of web applications
    or websites. It prevents hackers or unauthorized users from entering or using
    your websites or web applications. There are various types of technologies used
    to maintain high-levels of security. Some common technical solutions to check,
    build and prevent threats involve Fuzzing tools, `Web application firewalls`,
    `password cracking tools`, `black box testing tools`, `vulnerability scanners`,
    and `white box testing tools`.

    '
  trans: '


    # 网络安全类型


    有几种特定的网络安全类型，其中一些如下。


    ## 访问控制

    它可以帮助您防止未经授权的设备和用户访问您的网络。它仅允许具有权限的用户真实地访问有限的资源。访问控制系统的作用是对用户进行身份验证和授权。它还通过控制安全计划的基本要素，帮助降低未经授权用户带来的风险，这有助于确保访问控制策略和安全技术能够到位，以保护客户详情等机密信息。


    通常，公司拥有配置和流程，以限制对网络应用程序、计算机、系统、文件以及如知识产权和个人信息等机密数据的身份识别访问。在大型企业中，员工很多，很难识别员工。此时，访问控制系统可以防止陌生人进入并允许员工进入。此外，它允许企业限制对特定区域的访问。通过提高安全性，减少企业内部的事故和盗窃。


    ## 反恶意软件

    反恶意软件抵抗由不同类型恶意软件引起的感染，例如各种病毒、勒索软件、根内核和间谍软件。它可以用于个人计算设备、网络设备或网关服务器。它对云服务也有用。此外，它会扫描所有用于恶意软件的入站网络数据，并在检测到任何威胁时进行拦截。它可以识别高级恶意软件，并针对勒索软件攻击提供重大保护。它阻止用户访问已知的传播恶意代码的网站。当一个设备被感染时，它还能阻止恶意病毒的传播。它会创建并跟踪有关感染数量以及清除这些感染所需的时间。有时，它可以协助管理员了解恶意软件是如何攻击受损的网络或设备的。


    ## 应用安全

    它解释了在应用程序时的安全措施，旨在防止应用内的代码或数据被劫持或盗取。这是一种改进、添加和检查应用程序安全功能以抵抗漏洞的方法。目前，应用程序频繁出现在不同的网络中并连接到云端。结果是应用程序内部的威胁和安全泄露增加。应用程序安全检查可以通过协助抵抗黑客攻击，发现应用程序层面的缺陷。


    应用安全有多种类型，如身份验证、加密、授权、日志和应用安全测试。身份验证的应用安全有助于识别已授权的用户。用户在登录特定应用程序时必须提供用户名和密码。


    ## 行为分析

    它涉及使用软件工具来识别网络内未经授权的数据传输模式。行为分析工具通过根据正常行为的基础进行跟踪并报告异常以做出判断。行为分析安全软件产品可以标记为 `BTA`（行为威胁分析）产品或
    `UBA`（用户行为分析）产品。某些产品涉及生物识别特征，用于映射打字风格等重要行为。它有软件可以扫描偏离正常基准的情况。它有助于智能地判断异常是否具有危害。


    ## 数据泄露防护 (DLP)

    它包含一套程序和工具，确保机密数据不被误用、丢失或被未经授权的用户访问。网络安全 DLP 软件有助于分类机密、受监管和业务关键数据，并检测公司定义或已定义策略包内违反策略的行为。通常，DLP
    对于主要三个目标有利，分别是合规性、IP（知识产权）保护、个人信息保护以及数据可见性。它控制并监控网络内部敏感信息的流动。企业的某些敏感数据包括源代码、产品设计报告、流程文档、财务报告等。


    ## 邮件安全

    它解释了在电子邮件通信中保持机密数据的不同技术，并防止未经授权的访问、破解或丢失。电子邮件是传播垃圾邮件、恶意软件和钓鱼攻击的常见媒介。通常，钓鱼攻击针对维护机密数据或财务信息的部门。有时，恶意软件发送的邮件可能具有破坏性。钓鱼邮件的附件可能包含伪装成有效文档的恶意软件。钓鱼邮件可能包含作为恶意软件的网站链接。此外，钓鱼邮件通过要求收件者确认其密码、登录信息、银行账户、社会安全号码等来窃取信息。


    ## 防火墙

    它监控出站和入站流量并拦截恶意流量（如到达您的网络）。包过滤防火墙是最常见的类型之一。它们可以分为 `stateful`（有状态）和 `stateless`（无状态）。


    ## 入侵检测

    它扫描网络内的可疑活动。如果你正确设置了入侵检测，它将帮助你识别发生了什么。入侵检测系统可以分为 `NIDS`（网络入侵检测）和 `HIDS`（主机入侵检测）。`NIDS`
    观察流量，而 `HIDS` 监控行为。


    ## 网络分

    它有助于将计算机网络分成更小的部分以提高网络安全性。它减少了网络拥塞并防止有害流量到达未受保护的设备。它允许授权用户访问访问资源。


    ## 安全信息和事件管理 (SIEM)

    它提供了特定时刻网络服务内部事件的全局视图，并帮助 IT 团队在对抗安全威胁方面更加主动。`SIEM` 系统的应用对任何规模的公司都有益。它有助于提高效率并降低成本以及安全泄露的影响。它有助于制作更好的报告和日志分析。


    ## VPN

    它建立加密且安全的连接，以保护安全性较低的网络连接（如公共互联网）。它涉及隧道协议。`VPN` 中使用了多种协议，如 `IP`、`PPTP`、`SSL`、`L2TP`、`TLS`
    和 `OpenVPN`。


    如果你想通过 `VPN` 使用有限资源，你需要获得使用 `VPN` 应用的授权，并且需要提交一个或多个文件，如生物识别、密码或安全令牌。任何人都可以使用 `VPN`
    应用保护移动设备上的数据传输，或访问地理限制的网站。它对于远程公司员工、出差人员和自由职业工作者有利。`VPN` 有多种类型，如`远程访问 VPN`、`移动
    VPN`、`对点 VPN`、`硬件 VPN`、`MPVPN` 和 `VPN 设备`。


    ## Web 安全

    它涉及保护 Web 应用或网站的协议和保护措施。它防止黑客或未经授权的用户进入或使用您的网站或 Web 应用。使用了多种维护高水平安全性的技术。用于检查、构建和预防威胁的常用技术解决方案包括
    Fuzzing 工具、`Web 应用防火墙`、`密码破解工具`、`黑盒测试工具`、`漏洞扫描器`和`白盒测试工具`。


    '
