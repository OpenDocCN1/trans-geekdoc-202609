  mdcn: '

    闪电网络的采用稳步增长，许多钱包和交易所都在整合闪电功能。像 **Strike** 这样的平台通过实现低成本的即时跨境支付，展示了该网络在汇款方面的潜力。通过利用闪电网络，比特币作为交换媒介变得更加实用，弥合了其最初愿景与其当前作为价值存储角色之间的差距。


    其他 **Layer 2 解决方案** 通过解决比特币可扩展性和可用性的不同方面来补充闪电网络。例如，像 Liquid 和 RSK 这样的 **侧链** 允许在卸载主区块链活动的同时实现智能合约和代币化资产等专业功能。一起，这些创新扩展了比特币的能力，为各种用例的更广泛采用铺平了道路。


    ## 减半事件在比特币价值中的作用


    比特币的 **减半事件** 对其货币政策至关重要，并影响其价值的形成。减半大约每四年发生一次，将矿工为向区块链添加区块而获得的奖励减半。这种系统性的供应发行减少旨在模拟黄金等有限资源的稀缺性，随着时间的推移创造出通缩的动态。


    第一次减半于 2012 年进行，将区块奖励从 50 个比特币减少到 25 个。此后 2016 年和 2020 年的减半分别将奖励降至 12.5 和 6.25
    个比特币。这种逐渐下降确保新比特币以递减的速度引入市场，总供应量上限为 2100 万枚。最后的比特币预计在 2140 年左右被开采，减半将持续到那时。


    减半事件直接影响 **比特币的通胀率**。在传统的法币体系中，中央银行可以随意印钞，这往往导致通胀，甚至在极端情况下导致恶性通胀。比特币的减半计划随着时间的推移降低其年通胀率，使其成为现存最稀缺的资产之一。例如，在
    2020 年减半后，比特币的通胀率降至 2% 以下，与黄金相当。这种可控的稀缺性使许多人将比特币视为 **价值存储**，类似于数字黄金。


    历史上，减半事件后往往伴随着显著的价格上涨。这在很大程度上归因于供需关系。当进入市场的比特币新供应量减半，而需求保持不变或增加时，价格往往会上涨。例如，在
    2012 年第一次减半后，比特币价格从约 12 美元飙升至 2013 年底超过 1,000 美元。同样，2016 年的减半使比特币价格从约 650 美元上涨至
    2017 年牛市期间近 20,000 美元。


    2020 年的减半强化了这一模式，比特币价格从约 8,000 美元攀升至 2021 年超过 64,000 美元的历史新高。虽然相关性不等于因果关系，但这些价格走势的时机使许多人相信减半在比特币的市场周期中至关重要。投资者通常会提前预期这些事件，在减半前数月推动投机性需求。


    除了价格之外，减半还影响 **挖矿经济**。随着区块奖励减少，矿工必须更多地依赖交易费来覆盖成本。这促使矿工优先考虑高效运营和高价值交易。随着时间的推移，随着比特币网络成熟和采用增长，交易费预计将在维持网络方面发挥更大作用。然而，在价格低迷或竞争激烈时期，一些矿工可能难以保持盈利，导致网络算力波动。


    减半事件也影响市场心理。比特币发行计划的可预测性为投资者创造了可靠性和信任感。与可由中央银行操纵供应的法币不同，比特币的货币政策是透明且不可变的。这种对系统的信任吸引了重视比特币通缩性质及其抵御通胀压力能力的长期投资者。


    减半的批评者认为它们加剧了比特币的波动性。供应量的急剧减少可能放大价格波动，因为市场参与者对不断变化的动态做出反应。然而，支持者认为这种波动是比特币成长的自然组成部分，反映了其从小众资产向全球价值存储的转变。


    ## 第 4 章：山寨币与加密生态系统


    ### 主流山寨币概述


    Altcoins，即“替代币”，是比特币之外的加密货币。它们被创建出来是为了改进比特币的局限性或满足特定用途。有些专注于更快的交易，有些专注于隐私，还有许多引入了全新的功能。山寨币市场庞大，流通的币种数以千计，但少数币种因其受欢迎程度、创新性或广泛采用而脱颖而出。


    **以太坊** 毫无疑问是最突出的山寨币，通常被视为市值第二大的加密货币。与主要作为价值存储和支付网络的比特币不同，以太坊被设计为构建 **去中心化应用**
    的平台。其核心创新是使用 **智能合约**，即编码在区块链上并在预定义条件满足时运行的自我执行协议。这些合约消除了中介的需要，使去中心化金融、不可替代代币
    和无数其他应用成为可能。


    另一款知名山寨币是 **Cardano (ADA)**，它将自己定位为以太坊更可持续和可扩展的版本。它使用名为 **Ouroboros** 的 PoS 共识机制，并强调学术研究和同行评审开发。Cardano
    专注于为智能合约和 dApp 创建安全、可扩展的生态系统，目标应用包括金融、教育和治理。其分层架构将结算层与计算层分离，允许在不中断网络的情况下实现灵活性和升级。


    **币安币 (BNB)** 最初是币安交易所的实用代币，币安是全球最大的加密货币交易平台之一。最初基于以太坊构建，BNB 后来迁移到自己的区块链币安链。虽然它最初是为了降低币安平台的交易费用，但
    BNB 已发展成为多用途代币。它为币安智能链 上的交易提供动力，币安智能链 以低费用和快速交易速度著称，使其成为 DeFi 项目和 dApp 的热门选择。


    **Ripple (XRP)** 是一种专为跨境支付和国际汇款设计的加密货币。与依赖挖矿的比特币和以太坊不同，Ripple 使用一种名为 **XRP Ledger
    共识协议** 的共识算法来验证交易。这使得 XRP 能够以极低的能源消耗每秒处理数千笔交易。Ripple 与银行和金融机构密切合作，将自己定位为全球交易的桥梁货币。它与
    Santander 和美国运通等公司的合作展示了其在现代化传统金融方面的潜力。


    **莱特币 (LTC)** 常被称为“比特币黄金的白银”。由 Charlie Lee 于 2011 年创建，莱特币旨在改进比特币的交易速度和成本。它通过使用比特币代码的修改版本以及相比比特币
    10 分钟更快的 2.5 分钟区块时间来实现这一点。莱特币还使用 **Scrypt** 算法进行挖矿，该算法比比特币的 SHA-256 消耗资源更少。虽然莱特币没有引入突破性的新功能，但其稳定性、速度和持久性使其成为最受信任的加密货币之一。


    对于优先考虑隐私的人来说，**门罗币 (XMR)** 脱颖而出，成为领先的山寨币。2014 年推出，门罗币专注于匿名性和可替代性，使交易几乎无法追踪。它使用
    **环签名** 和 **隐形地址** 来模糊发送者和接收者的详细信息。这种隐私性使门罗币成为寻求财务保密的用户最爱，尽管由于其在非法活动中的使用，它也引起了监管机构的审查。


    **Polkadot (DOT)** 通过实现不同区块链之间的 **互操作性** 采取了独特的方法。由以太坊联合创始人 Gavin Wood 创建，Polkadot
    通过其 **平行链** 系统允许多个区块链协同运行。开发者可以创建共享安全并与其它网络无缝交互的定制区块链。Polkadot 的设计旨在解决区块链生态系统中的碎片化问题，其中大多数区块链孤立运行。


    **Solana (SOL)** 因其高速交易和低费用而受到广泛关注。被誉为潜在的“以太坊杀手”，Solana 利用其 **历史证明 (PoH)** 机制结合
    PoS 每秒可处理超过 65,000 笔交易。这种可扩展性使其成为 DeFi、NFT 市场和游戏平台的热门选择。然而，Solana 的批评者指出偶尔的网络中断以及由于依赖较少数量的验证者而对去中心化的担忧。


    **Chainlink (LINK)** 是另一款有影响力的山寨币，但其重点是连接区块链与现实世界。它提供去中心化的 **预言机**，即用于在智能合约中获取和验证外部数据的系统。例如，Chainlink
    预言机可以提供实时天气数据来触发保险赔付或在 DeFi 平台中更新股票价格。通过实现区块链与外部系统之间的无信任连接，Chainlink 扩展了区块链网络的功能。


    **Avalanche (AVAX)** 专为可扩展性和效率而设计，提供三个不同的区块链用于不同目的：用于资产创建的 **X-Chain**、用于智能合约的
    **C-Chain** 以及用于质押和验证者的 **P-Chain**。这种架构使 Avalanche 能够实现高吞吐量和低交易费用。对于寻求以太坊替代方案的开发者来说，它极具吸引力，并且兼容基于以太坊的
    dApp。

    '
