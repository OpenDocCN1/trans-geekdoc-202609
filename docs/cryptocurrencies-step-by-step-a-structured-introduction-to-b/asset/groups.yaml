  mdcn: '

    加密货币的另一个重要类别是 **稳定币**，其旨在降低与比特币和山寨币等资产相关的波动性。稳定币锚定于稳定资产，例如法币（如美元）、商品（如黄金）或甚至其他加密货币。这种锚定机制确保其价值保持相对恒定，使其在日常交易、汇款以及去中心化金融平台中的交换媒介方面具有吸引力。


    法币支持的稳定币，如 **Tether (USDT)** 和 **USD Coin (USDC)**，是最广泛使用的稳定币之一。这些稳定币通过在银行账户或其他流动资产中持有基础法币储备来维持锚定。例如，每个
    USDT 或 USDC 代币旨在由储备中持有的 1 美元支持。这些稳定币为加密货币市场提供流动性，充当数字资产与传统金融系统之间的桥梁。它们还为交易者提供了一种对冲市场波动的方法，而无需将资金兑换回法币。


    商品支持的稳定币，如 **Paxos Gold (PAXG)**，与黄金等有形资产挂钩。这些代币代表对特定数量资产的所有权，将传统投资的稳定性与加密货币的灵活性相结合。用户可以在没有与实物商品相关的后勤挑战的情况下交易、转移或存储这些稳定币。


    算法稳定币采用不同的方法，使用 **智能合约** 和算法来维持其价值。它们不持有储备，而是根据市场需求调整供应。例如，**DAI** 是在以太坊区块链上发行的稳定币，锚定美元，但由超额抵押的加密货币存款支持。如果
    DAI 的价值偏离其锚定价，系统会自动激励用户铸造或赎回 DAI，以恢复平衡。虽然算法稳定币具有创新性，但在极端市场波动期间维持稳定方面面临挑战，正如 2022
    年 **TerraUSD (UST)** 崩溃所见。


    稳定币在 DeFi 生态系统中至关重要。像 **Aave** 和 **Compound** 这样的平台允许用户借贷稳定币，在不依赖传统银行的情况下赚取利息或利用其持仓。稳定币还促进了去中心化交易所（DEX）上的无缝交易，用户可以在无需法币的情况下交换代币。其稳定性使其成为
    DeFi 应用的基石，能够在高度波动的市场中实现可预测且低风险的交易。


    中央银行数字货币（CBDC）的出现代表了与稳定币密切相关的另一项发展。虽然在传统意义上不被归类为加密货币，但 CBDC 在其数字形式和基于区块链的基础设施方面具有相似之处。由中央银行发行和监管，CBDC
    旨在将加密货币的好处——如更快的支付和更低的交易成本——与政府支持的法币的稳定性和信任相结合。中国通过其 **数字人民币** 以及欧洲和美国的试点项目凸显了将数字货币整合到传统货币体系中的日益增长的兴趣。


    比特币、山寨币和稳定币之间的关系反映了加密货币格局的复杂性和创新性。比特币作为去中心化、抗审查资产的角色为更广泛的生态系统提供了基础，而山寨币则通过智能合约、可扩展性和隐私功能扩展功能。稳定币反过来解决了经常阻碍加密货币采用的波动性，为日常使用提供实用解决方案。共同而言，这些类型的加密货币代表了一个多方面的系统，有可能重塑价值在全球范围内转移、存储和利用的方式。


    ## 关键术语：钱包、挖矿和交易


    钱包是与加密货币交互的重要工具。它是允许用户安全存储、发送和接收数字资产的软件应用程序或硬件设备。然而，钱包在物理意义上并不存储加密货币。相反，它们管理访问和在区块链上转移资金所需的私钥和公钥。私钥是每个钱包独有的加密代码，授予用户对其加密货币的控制权。它必须保持安全，因为丢失它意味着失去对资金的访问权限。另一方面，公钥是从私钥派生而来，用于生成钱包地址，这些地址可以公开共享以接收资金。


    钱包主要有两种形式：热钱包和冷钱包。热钱包连接互联网，使其便于频繁交易，但更容易受到黑客攻击。示例包括移动应用程序、桌面应用程序以及像 MetaMask 或
    Coinbase Wallet 这样的基于网络的钱包。冷钱包，如硬件钱包（例如 Ledger Nano 或 Trezor）和纸钱包，是离线存储选项。由于它们免疫于在线攻击，因此被认为更适合长期持有。选择合适的钱包取决于用户计划交易的频率及其对安全性的需求。


    挖矿是加密货币中的另一个关键概念，特别是对于使用工作量证明共识机制的加密货币。挖矿是在同时铸造新币的同时验证交易并将其添加到区块链的过程。矿工竞争解决需要大量计算能力的复杂数学问题。第一个解决问题的矿工获得将区块添加到区块链的权利，并获得比特币等加密货币作为奖励。此过程不仅通过使篡改区块链在计算上变得昂贵来保护网络，还确保在达到供应上限之前以一致的方式发行新币。


    用于挖矿的设备随着时间的推移而演变。在比特币早期，挖矿可以使用普通计算机的中央处理器（CPU）完成。随着网络的增长和竞争的加剧，矿工转向更高效的硬件，如图形处理器（GPU）和专为挖矿而设计的
    **专用集成电路（ASICs）**。ASICs 高效但昂贵，为个人矿工创造了进入壁垒。如今，挖矿通常由称为 **矿场** 的大规模运营主导，这些运营由数千台机器组成，运行在电费低廉的地区。


    挖矿并不仅限于比特币。许多其他加密货币，如莱特币和狗狗币，也依赖挖矿来保护其网络。然而，由于其高能耗，一些加密货币正在远离 PoW。像权益证明和混合机制这样的替代方案旨在在减少挖矿对环境影响的同时保持安全性和去中心化。


    交易是任何加密货币网络的基本构建块。其核心是交易涉及从一个钱包地址向另一个钱包地址转移价值，并记录在区块链上。当用户发起交易时，他们使用私钥对其进行签名。此签名证明发送者有权转移资金。交易一旦创建，就会广播到网络中，节点在将其包含在区块中之前对其进行验证。


    加密货币交易与传统支付在几个方面有所不同。首先，它们是 **点对点** 的，这意味着没有像银行或支付处理器这样的中介。其次，交易是 **无国界** 的；它们可以发送到世界任何地方，而无需货币兑换或额外费用。最后，一旦交易得到确认并添加到区块链中，它就是
    **不可变** 的，意味着它无法被撤销或更改。


    交易费用是过程中的一个重要方面。当用户发送加密货币时，他们通常会包含费用以激励矿工或验证者优先处理其交易。费用金额可能根据网络拥堵和交易大小而变化。在繁忙时期，可能需要更高的费用以确保快速确认，尤其对于比特币和以太坊等需求可能大幅波动的网络。


    交易的 speed 也因加密货币而异。例如，比特币交易通常需要大约 10 分钟才能得到确认，因为这是挖出一个区块的平均时间。以太坊交易更快，通常在几秒到几分钟内确认。其他加密货币，如
    Solana 或 Ripple，专为高速交易而设计，确认只需几秒钟。


    共同而言，钱包、挖矿和交易构成了加密货币运作的基础。钱包使用户能够管理其资金，挖矿保护网络并增加新币，交易促进价值的流动。这些组件虽然各不相同，但深度互联，并依赖区块链技术无缝运行。

