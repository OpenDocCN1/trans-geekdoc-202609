    ## 第7章：加密货币交易与交易所


    ### 中心化与去中心化交易所


    加密货币交易所是用户买卖和交易加密货币的平台。这些平台主要有两种形式：**中心化交易所 (CEXs)** 和 **去中心化交易所 (DEXs)**。它们各自服务于不同的目的，具有独特的功能、优势和风险。了解它们的工作原理有助于用户根据自身需求和目标选择最佳方案。


    **中心化交易所** 作为买家和卖家之间的中介运营。它们由监督交易流程、提供流动性并保障用户资金的组织管理。一些最大的 CEX，如 **Binance**、**Coinbase**
    和 **Kraken**，因其易用性、速度和广泛的服务而主导市场。这些交易所通常支持法币兑换加密货币交易，允许用户存入美元或欧元等传统货币并兑换为加密货币。


    CEX 最大的优势之一是其 **用户友好的界面**。对于新手来说，CEX 提供了简单直接的开始交易方式。大多数平台提供市场图表、实时订单簿和一键买卖等功能。此外，它们在内部处理交易撮合和结算，这意味着交易能够快速执行。诸如保证金交易和期货合约等高级功能也使
    CEX 对经验丰富的交易者具有吸引力。


    CEX 还提供 **托管服务**，将用户资金存放在中心化钱包中。这很方便，因为用户无需自行管理私钥。然而，这种便利伴随着风险。将资金存储在中心化服务器上，使
    CEX 成为黑客的理想目标。例如 2014 年的 **Mt. Gox 攻击** 和 2016 年的 **Bitfinex 泄露事件** 就导致数亿美元的损失。为降低此风险，许多交易所现在使用
    **冷存储** 保存大部分资金，并采用多重签名钱包和保险政策。


    监管是 CEX 的另一个关键方面。大多数在严格遵守当地法律下运营，要求用户完成 **了解你的客户 (KYC)** 和反洗钱 (AML) 验证流程。虽然这有助于建立信任并防止欺诈，但它会损害用户隐私，因为个人信息存储在中心化服务器上。对于重视匿名性的人来说，这可能是一个重大缺点。


    相比之下，**去中心化交易所** 无需中介运行。基于区块链技术构建，DEX 使用户之间能够直接进行点对点交易。像 **Uniswap**、**SushiSwap**
    和 **PancakeSwap** 这样的平台依靠智能合约自动执行交易。这些交易所不持有用户资金，因此是非托管的，对针对中心化服务器的黑客攻击具有天然更高的安全性。


    DEX 的主要优势之一是其 **无需许可的特性**。用户无需创建账户、进行 KYC 检查或依赖中央机构即可交易。这吸引了重视隐私并希望完全控制资产的人。在
    DEX 上，交易者保留自己的私钥，确保他们是资金的唯一托管人。然而，这也意味着如果用户丢失钱包或私钥访问权限，其资金将无法恢复。


    DEX 在提供各种代币访问方面表现出色，包括新推出或鲜为人知的加密货币。与通常需要严格上市流程的 CEX 不同，DEX 允许符合其协议标准的任何代币进行交易。这种开放性促进了创新，但也带来了风险。许多在
    DEX 上列出的代币缺乏充分审查，增加遇到诈骗或低流动性项目的可能性。


    CEX 与 DEX 之间的一个关键区别是交易执行方式。CEX 使用 **订单簿**，买家和卖家在其中放置出价和要价，由交易所撮合。而 DEX 则使用 **自动化做市商
    (AMMs)**。AMM 依赖流动性池——由用户提供的代币池——来促进交易。交易不是通过撮合订单执行，而是针对这些池子执行，价格由基于供需的算法决定。该系统确保了持续的流动性，但可能导致
    **滑点**，即由于大额订单或池子储备不足，实际交易价格与预期价格出现偏差。


    流动性是许多 DEX 面临的挑战。虽然顶级平台如 Uniswap 拥有强大的流动性池，但较小的 DEX 通常难以吸引足够用户以维持有竞争力的价格。这与 CEX
    形成对比，后者通常通过机构合作和做市服务提供深厚的流动性。对于处理大额交易或寻求最佳价格的交易者来说，CEX 可能提供更可靠的体验。


    安全性是 DEX 的优势所在。由于资金存储在用户钱包而非中心化服务器上，交易所整体被黑的风险几乎被消除。然而，DEX 并非完全没有风险。智能合约中的漏洞曾被利用，导致重大损失。例如，2016
    年以太坊上的 **DAO 攻击** 展示了智能合约缺陷如何被利用。用户必须谨慎行事，确保与信誉良好的 DEX 和经过审计的智能合约交互。


    DEX 还面临与 **网络费用** 和交易速度相关的问题。由于交易在区块链上进行，用户必须为每次交易支付 gas 费用。在以太坊等网络上，拥堵期间 gas
    费用可能高得令人望而却步。Layer 2 解决方案和替代区块链，如 **Arbitrum, Optimism, and Binance Smart Chain**，正在帮助降低这些成本并改善交易时间。


    虽然 DEX 越来越受欢迎，但它们仍不如 CEX 用户友好。管理钱包、理解 AMM 以及处理 gas 费用对初学者来说可能令人望而生畏。然而，像 **WalletConnect**
    等工具的普及以及改进的界面设计正在使 DEX 对更广泛的受众更易于使用。


    CEX 与 DEX 之间的选择最终取决于用户优先级。CEX 提供便利性、速度和针对专业交易者的服务，但伴随着安全和隐私风险。DEX 优先考虑去中心化、控制和匿名性，但需要更高的技术知识，并且在流动性和可扩展性方面存在局限。许多交易者同时使用两者，利用
    CEX 进行法币入口和大额交易，同时转向 DEX 以获得隐私、细分代币和去中心化金融机会。


    ### 理解交易对


    在加密货币交易中，**交易对** 指的是相互交易的两项资产。当你在交易所看到像 **BTC/USD** 或 **ETH/BTC** 这样的交易对时，意味着你可以分别用美元交易比特币或用比特币交易以太坊。交易对至关重要，因为它们确定了两种资产之间的汇率，使交易者能够确定可以用另一种货币交换到多少货币。


    大多数加密货币交易所将交易对分为两大类：**法币兑换加密货币** 和 **加密货币兑换加密货币**。法币兑换加密货币交易对，如 BTC/USD 或 ETH/EUR，允许用户将加密货币与传统货币交易。这些交易对对于引导新用户进入加密领域特别有用，因为它们提供了使用现金直接购买数字资产的方式。加密货币兑换加密货币交易对，如
    BTC/ETH 或 ADA/USDT，涉及一种加密货币兑换另一种加密货币。这些交易对非常适合已持有加密货币并希望分散投资或投机价格走势的用户。


    稳定币如 **USDT (Tether)** 和 **USDC (USD Coin)** 为加密货币定价提供了稳定的参考点，在许多交易所充当法币的替代品。例如，交易者可能会使用
    BTC/USDT 而不是交易 BTC/USD。稳定币减少了频繁法币兑换的需求，尤其是在不支持直接法币交易的交易所上。


    交易对的顺序很重要。在 BTC/ETH 这样的交易对中，比特币是 **基础货币**，以太坊是 **报价货币**。这意味着显示的价格代表购买一个单位基础货币（BTC）所需的报价货币（ETH）数量。如果
    BTC/ETH 的价格为 15，则意味着一个比特币可以兑换 15 个以太坊。理解这一区别对于正确阅读价格图表和下单至关重要。

    '
