    **跨境支付** 是加密货币与传统银行系统相交的另一个领域。像 **Ripple** 这样的加密货币已展示出通过消除中介需求来降低成本并加快国际交易的潜力。银行正在采用区块链技术来现代化其支付系统，在特定走廊中整合加密货币进行结算。例如，**Santander**
    已推出使用 Ripple 技术 的支付平台，实现比传统方法成本更低的当日跨境转账。


