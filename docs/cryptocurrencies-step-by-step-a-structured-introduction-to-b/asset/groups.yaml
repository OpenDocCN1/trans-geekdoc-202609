    +   - **51% Attack:** A scenario where a malicious entity gains control of more
    than half of a blockchain''s computational power, enabling fraudulent activity
    like double-spending.

    +   - **Address:** A unique identifier used to send and receive cryptocurrencies
    on a blockchain.

    +   - **Airdrop:** The distribution of free cryptocurrency tokens to users, often
