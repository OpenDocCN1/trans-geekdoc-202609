    主动为恢复做好准备是防止损失的最佳防御。安全地将助记词存储在多个位置，例如防火保险箱或安全 deposit box。避免将其数字存储以降低被黑客攻击的风险。如果你的钱包允许额外的安全功能，如
    PIN 码或密码短语，请确保它们也得到安全备份并仔细记录。定期验证备份是否完整且可访问，因为丢失物理备份会使你的恢复工作失效。


    ## Multi-Signature Wallets and Shared Ownership


    **Multi-signature wallets**（或 multi-sig wallets）是一种需要多个私钥来授权交易的加密钱包。与依赖单一密钥不同，这些钱包将控制权分配给多个参与方，增加了一层额外的安全性和共享所有权。多签钱包广泛用于协作环境，例如企业、去中心化组织，甚至管理集体加密货币持有的家庭。


    最常见的配置是 **2-of-3 multi-sig**，其中生成三个私钥，但只有两个需要批准交易。这种设置提供了冗余，同时确保没有单个人可以单方面行动。例如，如果一个密钥丢失或被泄露，剩余的两个密钥仍可授权交易。其他配置，如
    3-of-5 或甚至 5-of-7，用于拥有更多参与者的较大组织。


    多签钱包有助于增强 **security**。通过要求多重批准，它们降低了单点故障的风险。即使一个私钥被盗，攻击者也无法在没有其他密钥的情况下访问资金，这使其成为保护大量加密货币免受盗窃或欺诈的有效解决方案。


    共享所有权是多签钱包的另一个重要用例。在商业环境中，多签钱包可以将责任分配给高管或团队成员。例如，公司金库可能会使用 3-of-5 钱包，其中三名董事必须批准任何支出交易。这确保了问责制并防止资金被滥用。类似地，去中心化自治组织通常依赖多签钱包来管理社区资金，治理代币持有者选举签名人代表团体。


    多签钱包还解决了协作场景中的信任问题。当两个或多个方共同管理资金时，例如合伙或联合投资，多签钱包确保没有人可以独立行动。例如，两名商业伙伴可能会使用 2-of-2
    钱包，要求双方对交易进行签名。但如果一方变得无法联系或不合作，则存在风险。


    设置多签钱包涉及生成多个私钥并将其分配给指定的参与者。像 **Electrum**、**Gnosis Safe** 和 **Casa** 这样的钱包提供多签功能，各自针对不同的技术专业水平和组织需求。钱包软件提供了一种安全分发密钥并配置交易批准所需阈值的方式。


    尽管有优势，多签钱包也存在挑战。设置和管理复杂性可能对技术水平较低的用户构成障碍。丢失多个密钥可能导致钱包无法访问，尤其是在没有冗余的配置中。例如，在 2-of-2
    设置中，丢失任一密钥都会永久锁定资金。为了解决这个问题，参与者应备份其密钥并考虑使用硬件钱包以增加安全性。


    签名人之间的协调是另一个挑战。所有必需的各方必须可用以批准交易，这可能会延迟紧急转账。在企业或 DAO 环境中，清晰的沟通协议和应急计划对于避免瓶颈是必要的。此外，多签钱包的去中心化特性意味着如果丢失了所需数量的密钥，则没有恢复机制，不像托管解决方案提供账户恢复。


    对于家庭而言，多签钱包可以作为 **crypto inheritance plan**，确保资产在所有者生前保持安全的同时可供继承人访问。2-of-3 钱包可能包括由所有者、受信任的家庭成员和法律执行人持有的密钥。这种设置确保资金受到保护，并且只能在约定的条件下访问。


    多签技术的进步不断提高可用性和可访问性。像 **Casa** 这样的钱包提供引导式设置，允许用户在没有深入技术知识的情况下实施多签。一些服务提供 **key
    management solutions**，其中第三方在保持隐私和去中心化的同时安全地保存备份密钥。


    ## CHAPTER 6: CRYPTOCURRENCY MINING


    ### Mining Basics


    加密货币挖矿是验证交易并将其添加到区块链的过程。从核心来看，挖矿保护网络、确保数据完整性并将新币引入流通。与传统金融系统中的银行验证交易不同，挖矿依赖于被称为节点的去中心化计算机网络来执行此任务。这些节点作为共识机制的一部分解决复杂的数学难题，最常见的是
    **proof of work**。


    当交易发起时，它会广播到网络并与其他交易分组到一个 **block** 中。这个区块就像数字账本中的一页，在添加到区块链之前必须经过验证。矿工竞争解决基于密码学哈希的计算问题。这个问题不是关于数学技巧，而是蛮力——反复尝试不同的输入，直到解决方案匹配目标值。该目标值由网络的
    **difficulty level** 决定，该难度会根据区块的开采速度动态调整。


    密码学难题涉及使用哈希算法从区块数据生成哈希——由数字和字母组成、长度固定的字符串。如前所述，在比特币中使用的算法是 **SHA-256**。哈希唯一对应输入数据，即使数据发生细微变化也会完全改变哈希。矿工的目标是找到以特定数量零开头的哈希，这由难度级别决定。实现这一点需要将一个随机值，称为
    **nonce**，附加到区块数据并反复对其进行哈希处理，直到找到所需结果。


    首先成功解决难题的矿工获得将区块添加到区块链的权利。作为奖励，他们会收到 **newly minted cryptocurrency**（区块奖励）以及区块中包含的交易费用。对于比特币，该奖励最初为每个区块
    50 BTC，但会随着每 210,000 个区块，或大约每四年一次的 **halving events** 而随时间递减。


    为了保持竞争力，挖矿需要专用硬件。在比特币早期，爱好者可以使用个人电脑的 **CPUs** 进行挖矿。然而，随着网络的增长，挖矿难度也随之增加。矿工转向 **GPUs**（图形处理单元），它们在哈希方面更快、更高效。今天，**ASICs**（**application-specific
    integrated circuits**）主导着比特币挖矿。这些设备专门用于挖矿，远比 GPU 或 CPU 更强大。虽然 ASIC 高效，但它们价格昂贵且消耗大量电力。我们将在下一节中更详细地介绍挖矿。

