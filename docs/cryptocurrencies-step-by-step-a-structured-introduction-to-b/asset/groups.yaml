    ## 第 13 章：加密货币的隐私与安全


    ### 隐私币与匿名性


    隐私币是一类专门的加密货币，旨在增强数字交易中的匿名性和机密性。与比特币和以太坊不同，后者的所有交易在区块链上公开可见，而隐私币使用先进的密码学技术来隐藏参与者的身份、交易金额和其他细节。这一功能吸引了对监视、数据泄露以及数字世界中金融隐私丧失感到担忧的用户。


    **门罗币（XMR）**是最知名的隐私币之一。它结合了**环签名**、**隐形地址**和**RingCT（环机密交易）**来确保匿名性。环签名将用户的交易与其他交易混合，使得几乎无法追踪原始发送者。隐形地址为每笔交易生成独特的一次性地址，隐藏接收者的身份。同时，RingCT
    隐藏交易金额，确保没有人能确定发送了多少。这些技术共同使门罗币成为一种高度安全和私密的加密货币。


    另一个著名的隐私币是**Zcash（ZEC）**，它为用户提供透明交易和屏蔽交易之间的选择。透明交易类似于比特币上的交易，在区块链上可见，而屏蔽交易使用**zk-SNARKs（零知识简洁非交互式知识论证）**。这种密码学方法允许一方证明交易的有效性，而无需透露任何细节。Zcash
    的可选隐私功能吸引了那些希望根据情况灵活选择透明和匿名的用户。


    **达世币（Dash）**虽然最初被宣传为隐私币，但与门罗币和 Zcash 相比，其匿名功能有限。其**PrivateSend**功能允许用户将交易与他人的交易混合，从而掩盖交易来源。然而，由于这种方法依赖混币服务，它不如门罗币和
    Zcash 使用的密码学技术强大。随着时间的推移，Dash 已将重点转向成为快速、用户友好的数字支付系统，而不是强调隐私。


