- raw: "Crypto.com:  This is one of the fastest growing altcoin projects that is also\
    \ an exchange or CeFi. Its native coin is called Cro or Cronos which transact\
    \ on its Cronos blockchain.  [ ](https://www.google.com/url?q=https://crypto.com/us/app&sa=D&source=editors&ust=1661372152441264&usg=AOvVaw0uCZ21A8Pyph6hrk2Dt_Jz)\
    \   [https://crypto.com/us/app](https://www.google.com/url?q=https://crypto.com/us/app&sa=D&source=editors&ust=1661372152441598&usg=AOvVaw3md2fKeAMDbEWgQAwED2LP)\
    \    \n\nCryptocurrency:  It is an encrypted internet money. The first cryptographic-currency\
    \ is Bitcoin followed by Ethereum and the rest of other Altcoins. Some people\
    \ call it internet money or electronic money which lives on the blockchain. It\
    \ is a peer to peer (P2P) decentralized system that utilizes blockchain technology\
    \ to send and receive payments without the need for a bank to trust and verify\
    \ the transaction. So no government, bank or third party maintains or controls\
    \ it hence why it's decentralized.  \n\nAny person can transact with an unknown\
    \ person without worrying about trust. The software coded in the blockchain technology\
    \ is immutable and tamper proof which Satoshi Nakamoto invented has withstood\
    \ the test of time and has been running for more than a decade now. Warning!!!\
    \ Be wary of many altcoins that are flooding the cryptoverse because they are\
    \ scams and rug pull. Always DYOR do your own research and invest money you can\
    \ afford to lose. \n\nCryptography:  Originated from the Greek word Krypto's meaning\
    \ hidden. It is the science technique used to secure information utilizing code\
    \ encryption and decryption. This technique allows for the sender and recipient\
    \ to communicate anonymously and securely. \n\nCryptoverse:  Considered the new\
    \ frontier and the evolution of the internet. It is also known as the Cryptocosmo’s\
    \ or Web-3. It is the combination of two words which is Crypto and Verse. Crypto\
    \ refers to cryptography, the science technique used to secure information utilizing\
    \ encrypted and decrypted codes. Verse refers to the Universe in the form of a\
    \ new cosmic world of Blockchain Technology and Distributed Ledger Technology\
    \ innovations that is evolving into Defi, NFT’s and many more ways the human mind\
    \ can imagine.  \n\nD:  \n\nDAO:  The abbreviation or acronym stands for Decentralized\
    \ Autonomous Organization. Blockchain Technology not only revolutionized the way\
    \ we look at money but it also revolutionized the way we control it. The saying\
    \ “ By the people for the people” holds truth to what a DAO system can do. A fully\
    \ autonomous and automated system that operates on the blockchain technology platform\
    \ which cannot be corrupted or manipulated by a few.  \n\nSince its inception\
    \ in 2016 by some DEVs utilizing the Ethereum blockchain it went through its first\
    \ trial by fire and it burned. The idea of a DAO is still well and alive through\
    \ the cryptoverse in a lot of the new altcoin projects. It is still in its infancy\
    \ stage as of this writing and it will only get better as we move forward. \n\n\
    Dapps:   The abbreviation or acronym stands for Decentralized Applications. Just\
    \ as you know how Apps run on any computer system or smartphone it is also the\
    \ same as Dapps except they run on decentralized blockchain technology. Some of\
    \ the examples you can see in the cryptoverse are Defi exchanges like Uniswap\
    \ Dex, Pancake Swap Dex, VVS Dex and more.  \n\nDaaS:  The abbreviation or acronym\
    \ stands for  D ecentralized Finance  a s  a   S ervice.  \n\nDCA:  The abbreviation\
    \ or acronym stands for  D ollar  C ost  A veraging. This means that you have\
    \ to set a dollar amount and deposit it to your favorite coin or token daily,\
    \ weekly or monthly without worrying about the ups and down of the market. This\
    \ method of investing works if you do not care about the short term value of your\
    \ fiat account but only focus on accumulating more of the coin or token in cryptocurrency\
    \ value for the long term. \n\nDeFi:  The abbreviation or acronym stands for \
    \ De centralized  Fi nance. Satoshi Nakamoto introduced Bitcoin and Blockchain\
    \ technology to the world where we learned that we no longer need a middleman\
    \ in the case of money transfer between two individuals. This is the new world\
    \ of finance where we no longer need a bank to hold our money and charges us a\
    \ fee for holding it.  \n\nAny financial services built on blockchain technology\
    \ that rewards its miners in the case of proof of work (POW) or stakeholders in\
    \ the case of proof of stake (POS) and keeping the protocol secure is a Decentralized\
    \ Finance. You will learn that there is a saying in the cryptoverse and I quote\
    \ “ Not your Keys not your cryptos”. You alone are in charge of your money, not\
    \ the bank.  \n\nDecentralized:  It means no more central control or authority\
    \ like Banks, Board of directors of an institution or Government. Blockchain technology\
    \ which cryptocurrency runs on is autonomous from any central control. Every computer\
    \ or nodes in the network owns the distributed ledger and all recorded transactions\
    \ are verified by all. The network system will not stop if one node is offline\
    \ or a few computers lose power; it will continue to operate because of its decentralization.\
    \ \n\nDogecoin:  An Alt-coin born out of the meme culture to make fun of Bitcoin\
    \ and its blockchain technology. It is a picture of a Shiba Inu Dog that was created\
    \ out of a joke but eventually became the fad for the meme culture and its following\
    \ on social media.    [https://dogecoin.com/](https://www.google.com/url?q=https://dogecoin.com/&sa=D&source=editors&ust=1661372152448087&usg=AOvVaw3EWX2Znt_uyfjzFD_RPNDu)\
    \    \n\nDox:  The word dox, doxxing or doxxed derived its originality from the\
    \ word doc or documents. As it was known in the 1990’s and used by hackers to\
    \ reveal one's true identity. It has been adopted in the cryptoverse in the same\
    \ manner but in a good faith as an assurance to the community that its crypto\
    \ coin or token project will not be rug pulled. By revealing the true identities\
    \ of the people behind the projects makes it more legit and it gives the investors\
    \ a solid guarantee to their investments.  \n\nDYOR:   The abbreviation or acronym\
    \ stands for  D o  Y our  O wn  R esearch. You will have to do your due diligence\
    \ and verify from all different sources online that the cryptocurrency that you\
    \ are about to invest in will not be a rug pull. Sometimes it's even hard to make\
    \ a decision after all the research you have done so maybe your gut feeling would\
    \ also help. Just be careful and always remember to spend only the money you are\
    \ willing to lose and don't be greedy.  \n\nDip:  Adopted from the stock market\
    \ charts and seen as a valley on the price charts. This means that the value in\
    \ price of your cryptocurrency experienced a decline and it's usually caused by\
    \ investors selling their positions followed by a mass panic sell by others. Always\
    \ have extra money available to buy the dip on your favorite project or cryptocurrency.\
    \ Don’t be greedy either because sometimes you buy the dip and the dip keeps dipping.\
    \ Timing the market is never a good thing to do.  \n\nDistributed Ledger:  In\
    \ the cryptoverse this is the recorded transactions secured by full nodes in the\
    \ network system. These recorded transactions are immutable electronic data which\
    \ are called ledgers and are distributed throughout the whole network of nodes\
    \ forming a blockchain. \n\nDLT:  The abbreviation or acronym stands for Distributed\
    \ Ledger Technology.  In the cryptoverse this is the recorded transactions secured\
    \ by full nodes in the network system. These immutable recorded transactions of\
    \ electronic data are called ledgers and are distributed throughout the whole\
    \ network of nodes forming a blockchain. \n\nE:   "
  fmt: "\n# Crypto.com\n\nCrypto.com 是增长最快的替代币项目之一，同时也是一家交易所或 CeFi。其原生代币称为 Cro 或 Cronos，在其\
    \ Cronos 区块链上进行交易。  \n[https://crypto.com/us/app](https://www.google.com/url?q=https://crypto.com/us/app&sa=D&source=editors&ust=1661372152441598&usg=AOvVaw3md2fKeAMDbEWgQAwED2LP)\n\
    \n# Cryptocurrency\n\n加密货币是一种加密的互联网货币。第一种加密货币是比特币，随后是以太坊以及其他替代币。有些人称其为互联网货币或电子货币，它存在于区块链上。这是一种点对点（P2P）去中心化系统，利用区块链技术发送和接收付款，无需银行来信任和验证交易。因此，没有政府、银行或第三方维护或控制它，这就是它去中心化的原因。\n\
    \n任何人都可以与陌生人进行交易，而无需担心信任问题。区块链技术中编码的软件是不可更改且防篡改的，由中本聪发明，经受住了时间的考验，并已运行十多年。Warning!!!\
    \ 警惕充斥加密世界的许多替代币，因为它们是诈骗和跑路项目。始终 DYOR，自行研究，并只投资你承受得起损失的资金。\n\n# Cryptography\n\
    \n密码学源自希腊语 Krypto，意为隐藏。它是利用代码加密和解密来保护信息的科学技术。这种技术允许发送者和接收者匿名且安全地通信。\n\n# Cryptoverse\n\
    \n加密世界被视为新的边疆和互联网的演进。它也被称为 Cryptocosmo 或 Web-3。它是由 Crypto 和 Verse 两个词组合而成。Crypto\
    \ 指的是密码学，即利用加密和解密代码来保护信息的科学技术。Verse 指的是宇宙，以区块链技术和分布式账本技术创新的新宇宙世界形式存在，正在演进为 DeFi、NFT\
    \ 以及人类想象力所能及的更多方式。\n\n# D\n\n# DAO\n\nDAO 是去中心化自治组织（Decentralized Autonomous Organization）的缩写或首字母缩写。区块链技术不仅彻底改变了我们看待金钱的方式，也彻底改变了我们控制金钱的方式。“由人民，为人民”的说法体现了\
    \ DAO 系统所能做到的一切。这是一个完全自主和自动化的系统，运行在区块链技术平台上，不会被少数人腐化或操纵。\n\n自 2016 年由一些 DEVs 利用以太坊区块链创立以来，它经历了第一次火中考验并遭受了损失。DAO\
    \ 的理念在加密世界的许多新替代币项目中依然存在。截至撰写本文时，它仍处于起步阶段，并且随着我们向前发展，只会变得更好。\n\n# Dapps\n\nDapps\
    \ 是去中心化应用程序（Decentralized Applications）的缩写或首字母缩写。正如你知道的，Apps 在任何计算机系统或智能手机上运行，Dapps\
    \ 也是如此，只是它们运行在去中心化的区块链技术上。你在加密世界中可以看到的一些示例包括 DeFi 交易所，如 Uniswap Dex、Pancake Swap\
    \ Dex、VVS Dex 等。\n\n# DaaS\n\nDaaS 是去中心化金融即服务（Decentralized Finance as a Service）的缩写或首字母缩写。\n\
    \n# DCA\n\nDCA 是定投法（Dollar Cost Averaging）的缩写或首字母缩写。这意味着你需要设定一个美元金额，并每天、每周或每月将其存入你喜欢的币或代币，而无需担心市场的涨跌。如果你不关心法币账户的短期价值，而只关注长期积累更多加密货币价值的币或代币，那么这种投资方法是有效的。\n\
    \n# DeFi\n\nDeFi 是去中心化金融（Decentralized Finance）的缩写或首字母缩写。中本聪向世界引入了比特币和区块链技术，我们了解到在两个人之间进行资金转移时，不再需要中间人。这是金融的新世界，我们不再需要银行来持有我们的资金并向我们收取持有费用。\n\
    \n任何基于区块链技术构建的金融服务，在工作量证明（POW）情况下奖励其矿工，在权益证明（POS）情况下奖励其质押者，并保持协议安全，即为去中心化金融。你会了解到加密世界中有一句名言，我引用：“Not\
    \ your Keys not your cryptos”。你自己掌管你的资金，而不是银行。\n\n# Decentralized\n\n去中心化意味着不再有中央控制或权威，如银行、机构董事会或政府。加密货币运行的区块链技术独立于任何中央控制。网络中的每台计算机或节点都拥有分布式账本，所有记录的交易都由所有节点验证。如果一个节点离线或几台计算机断电，网络系统不会停止，它将因其去中心化特性而继续运行。\n\
    \n# Dogecoin\n\n狗狗币是一种源自模因文化的替代币，旨在嘲讽比特币及其区块链技术。它是一只柴犬的图片，最初是个玩笑，但最终成为模因文化的时尚，并在社交媒体上拥有追随者。\
    \  \n[https://dogecoin.com/](https://www.google.com/url?q=https://dogecoin.com/&sa=D&source=editors&ust=1661372152448087&usg=AOvVaw3EWX2Znt_uyfjzFD_RPNDu)\n\
    \n# Dox\n\nDox、doxxing 或 doxxed 这个词源自 doc 或 documents。正如在 1990 年代黑客所用的那样，用于揭露一个人的真实身份。它在加密世界中以同样的方式被采用，但出于善意，作为向社区保证其加密货币或代币项目不会跑路的一种担保。通过揭示项目背后人员的真实身份，使其更具合法性，并为投资者提供投资的坚实保障。\n\
    \n# DYOR\n\nDYOR 是自行研究（Do Your Own Research）的缩写或首字母缩写。你需要进行尽职调查，并从所有不同的在线来源验证你即将投资的加密货币不会是跑路项目。有时即使在完成所有研究后，做出决定也很困难，所以也许你的直觉也会有所帮助。请小心，并始终记住只花你愿意损失的钱，不要贪婪。\n\
    \n# Dip\n\nDip 这个词源自股市图表，在价格图表中表现为一个谷底。这意味着你的加密货币价格价值出现下降，通常是由投资者抛售头寸，随后其他人大规模恐慌抛售引起的。始终准备好额外资金，在你喜欢的项目或加密货币出现下跌时买入。也不要贪婪，因为有时你买入下跌，但下跌还会继续下跌。择时交易从来都不是好事。\n\
    \n# Distributed Ledger\n\n在加密世界中，分布式账本是网络系统中由全节点保护的记录交易。这些记录的交易是不可更改的电子数据，称为账本，分布在整个节点网络中，形成区块链。\n\
    \n# DLT\n\nDLT 是分布式账本技术（Distributed Ledger Technology）的缩写或首字母缩写。在加密世界中，这是网络系统中由全节点保护的记录交易。这些不可更改的记录交易的电子数据称为账本，分布在整个节点网络中，形成区块链。\n\
    \n# E\n"
