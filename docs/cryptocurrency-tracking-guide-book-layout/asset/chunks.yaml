    ## 献词


    献给我最亲爱的妻子马丽莎和我的儿子海文和布赖森。献给我的父母、家人和朋友。多年来，我对你们的爱与支持深表感激。感谢上帝赐予丰盛的祝福。


    ## 引言


    如果你在 2009 年比特币创始之初就买入并一直持有（HODL），你可能已经成为百万富翁；但如果你在 2017 年比特币达到历史高点（ATH）时因害怕错过（FOMO）而买入，你可能已经被套牢（rekt）并损失了所有资金。这就是为什么在进入任何加密货币项目之前进行自主研究（DYOR）非常重要。好消息是，你有了第二次机会，因为在撰写本文时，比特币、以太坊和所有替代币都处于熊市，你可以趁机建仓。如果你相信该项目，请长期持有（HODL），并在过程中适时获利了结。


    你现在可能在挠头，因为你根本不明白刚才读了什么，并且已经失去了兴趣。但请放心，这本书将帮助你理解这种新语言，将其作为你的追踪指南，从 A 到 Z 深入了解这些缩写和术语的含义。如果你想成为
    Web3 新进化的一部分，这是你千载难逢的机会，你不应该像其他人一样继续站在场边。我还在本书中整理了 10 个加密货币网站链接作为奖励，你可以使用本指南在复杂的加密货币世界中导航时追踪它们。


    ## 提供背景


    2013 年，我在电视上看到一名大学生举着一块写着“比特币换午餐”的牌子。我当时很好奇，但也仅此而已，之后再也没有想过。你可能会以为我买入或持有过一些比特币，但答案是否定的。我直到
    2019 年才跟进此事，甚至从未谈论过，那也是我进入加密货币世界的开始。那时，我开始在 YouTube 和所有讨论加密货币的社交媒体上查找信息。


    当我深入加密世界时，由于所使用的语言对我来说是陌生的，我感到迷失。花了整整一年时间，我才学会并使用个人电脑挖出了第一批代币。请记住，我本身既不是计算机程序员也不是开发者，但我决心不要再像
    2013 年那样错过机会。我挖掘加密货币不仅是为了加密货币奖励，还希望为区块链共识的安全性做出贡献。


    那么，为什么你要关心学习或挖掘加密货币呢？还记得 Netflix 如何击败 Blockbuster 以及直播流媒体的演变吗？我分享这些是因为很多人不愿了解或参与其中。加密货币只是加密世界的一部分，该世界还涉及
    DeFi、DLT、NFT 和区块链技术。这只是更大事物的开始，我希望你能成为其中一员。


    最后，不要因为听别人说他们亏钱了或者这是骗局就继续站在场边。要知道他们说的是他们自己的经历，而不是你的。现在就开始你的旅程，使用本指南在加密货币世界中边追踪边学习。我相信你会为自己踏上这段旅程、深入加密世界而感到高兴。永远记住，我们人生中最大的遗憾就是没有采取行动。现在就采取大规模行动。


    ## A


    ADA：Cardano 区块链由 Charles Hoskinson 于 2015 年创立，他是以太坊区块链的前联合创始人，是加密世界中最大的权益证明（proof
    of stake）替代币协议之一。其原生加密货币是 ADA，以 19 世纪的女性数学家 Ada Lovelace 命名。她也被公认为计算机编程的先驱之一。一
    Ada 等于一百万个 Lovelace。


