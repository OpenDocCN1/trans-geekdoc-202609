    ## Dedication


    To Marissa my dearest wife and my boys Haven and Bricen. To my Parents, families
    and friends. I am truly grateful for your love and support throughout the years.
    Thank you God for his abundant blessings.


    ## Introduction


    Apeing into Bitcoin during its inception back in 2009 would have made you a millionaire
    if you still HODL a bag, but if you FOMOed in early 2017 during its ATH you would
    have been rekt and lost all your money. That is why it is very important to DYOR
    before jumping into any cryptocurrency projects. The good news is you have a second
    chance because we are in a Bear market for Bitcoin, Ethereum and all the Altcoins
    as of this writing to fill your bags. HODL it for the long run if you believe
    in the project and always take some profits on the way.


    Now you are probably scratching your head because you have no clue what you just
    read and already lost interest. But rest assured this book will help you understand
    this new language, use it as your tracking guide into the deeper meaning from
    A to Z of the acronyms and terminologies. If you want to be part of the new evolution
    of Web3, this is your chance of a lifetime and you should not continue to stand
    on the sideline like everyone else. I have also assembled 10 cryptocurrencies
    weblinks as bonuses within this book, for you to track down using this guide as
    you navigate your way through the sophisticated world of Cryptocurrency.


    ## Providing Context


    It was back in 2013 that I saw a college student on T.V holding up a sign that
    says, “Bitcoin for lunch”. I was very curious about it but that was it, and I
    never thought about it anymore. Now you might think that I have bought in or held
    a few Bitcoins but the answer is No. I did not follow up with it or even spoke
    about it until 2019 and that is when my journey into the world of cryptocurrency
    started. At that time I started to look up information on YouTube and all the
    social media that discusses cryptocurrency.


    As I dove deep in the Cryptoverse, I was lost due to the fact that the language
    spoken was foreign to me. It only took me a whole year to learn and be able to
    mine my first coins using a personal computer. Now keep in mind that I am no computer
    programmer or a developer myself, but I was determined not to miss out like I
    did back in 2013. I mined cryptocurrency not only for the cryptocurrency rewards
    but I also wanted to contribute to the security of the blockchain consensus.


    So, why do you have to care about learning or mining cryptocurrencies? Remember
    the story of how Netflix killed Blockbuster, and the evolution of live streaming?
    I am sharing this with you because a lot of people do not bother to learn about
    it or get involved with it. Cryptocurrency is only part of the Cryptoverse which
    involves DeFi, DLT, NFT and Blockchain Technology. This is only the beginning
    of something much bigger, and I want you to be part of it.


    Lastly, don’t continue to stay on the side line because you heard from others
    how they lost money or it’s a scam. Know what they said are their own experiences,
    not yours. So start your journey now and learn as you track along in the world
    of Cryptocurrency using this guide. I am sure you will feel better that you have
    taken the journey and dove into the Cryptoverse. Always remember that our biggest
    regrets in life are that we did not take action. Take massive action, now.


    ## A


    ADA: The Cardano Blockchain founded by Charles Hoskinson in 2015 a former co-founder
    of the Ethereum Blockchain is one of the largest Altcoin proof of stake protocols
    in the cryptoverse. Its native cryptocurrency is ADA named after a female mathematician
    Ada Lovelace from the 19th-century. She was also recognized as one of the pioneers
    of computer programming. One Ada equals one million Lovelace''s.

