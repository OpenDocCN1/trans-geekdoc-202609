  fmt: '

    # ADDRESS


    An address is very similar to having a home address or email address. Since the
    inception of the internet 1.0 we started using email addresses to send and receive
    informational data online but now we are being introduced to cryptoverse addresses
    to send and receive cryptocurrencies. These addresses consist of alphanumeric
    characters and they are very specific to each blockchain and its native coins
    or tokens.


    The majority of blockchain addresses are public and can be seen on the blockchain
    explorer confirming the transactions going in and out of any address. An exception
    to these public addresses are the privacy-based blockchains like Grin and Monero.
    It is impossible for any human to read, memorize and process the long random strings
    of alphanumeric lines of a blockchain address but rest assured that a computer
    has no problems processing it.


    Addresses are unique and anonymous even though they are public, the owners of
    the addresses'' real identification is never revealed. Although this case is true
    for the majority of people dealing with cryptocurrency, the real identity of founders
    and co-founders of major token projects and exchanges are actually revealed. One
    example is the founder of Ethereum Vitalik Buterin where his public address is
    known by all who work on the Ethereum Blockchain network.


    # Airdrop


    An airdrop is the term given to things like supplies or propaganda leaflets being
    dropped from the sky by a plane. The strategy is also used in the cryptoverse
    by a new cryptocurrency project for its native coins or tokens. It is electronically
    distributed to early adopters of the project to create visibility and buzz which
    in turn provide more demand by the mass. All you need to have is a compliant wallet
    which is capable of receiving the airdrop on the scheduled released time and date.
    You need to register for any airdrop.


    # Altcoin


    Alt-coin or Alternative coin is the name given to all other coins that came after
    Bitcoin. These coins are native to their own blockchain software code and they
    were soft fork or hard fork of Bitcoin in layman''s terms they are copies of the
    original. Bitcoin Cash, Litecoin and Raven coin to name a few altcoins that were
    forked from the original bitcoin code. Other coins like Ethereum have their own
    code or blockchains which were created to solve some of the problems or issues
    that Bitcoin cannot solve.


    One major improvement by the Ethereum Blockchain is the introduction of smart
    contracts and smart properties. Altcoins were born out of necessity to solve the
    problems other coins have like scalability to handle the need for speed to process
    a transaction and lessen the fees charged for such transactions. The popularity
    of meme culture, some coins were also produced just to poke fun against Bitcoin.
    One particular altcoin that gave birth to this meme culture is Dogecoin.


    # ASIC


    The abbreviation or acronym stands for Application-Specific Integrated Circuits.
    These specific integrated circuits are designed on silicon chips to perform only
    one special task and that is to mine and validate certain codes. In the case of
    Bitcoin the asic processes SHA-256 with regards to proof of work protocols to
    mine and validate every transaction.


    # ASIC MINER


    An asic miner is when all the specific integrated circuits are connected together
    with other hardware like power supply to make a special computer that does only
    one task and that is to mine for cryptocurrencies utilizing the proof of work
    protocols. These asic miners are connected to the internet and tend to make a
    lot of noise in comparison to a regular home computer when turned on. Because
    they run the proof of work protocols they tend to consume a tremendous amount
    of electricity energy.


    # ATH


    The abbreviation or acronym All Time High refers to how high a cryptocurrency’s
    value peaked according to its price and market capitalization. This usually happens
    when people FOMO into a new project speculating it will rocket to the moon and
    make them filthy rich. It''s no longer a secret that a cryptocurrency will hit
    All Time High once it is listed to any of the top 5 exchanges in the cryptoverse.


    # ATL


    The abbreviation or acronym All Time Low refers to how low a cryptocurrency’s
    value dips according to its price and market capitalization. This usually happens
    when there is a panic sell amongst the investors and when certain influences of
    the news media, wall street''s tend to leak into the cryptoverse. It is always
    safe to buy and hold rather than panic and sell at a loss.


    # Apeing


    This happens when people find a new project or cyprotcurreny that is about to
    launch or it''s only days or weeks old and they FOMO in by buying as much as they
    can. They usually buy in without taking the time to do a thorough research or
    background check on the particular cryptocurrency project. It is the fastest way
    to get rekted and lose money in the cryptoverse. This is not investing, it''s
    called gambling.


    # API


    The abbreviation or acronym stands for Application Programming Interface. This
    set of protocols are software applications programming interfaces. These application''s
    protocols interact in a specific manner on how to use the data and what actions
    it needs to execute.


    # AMM


    The abbreviation or acronym stands for Automated Market Maker in Layman’s terms
    it is a software code utilized by an exchange protocol that operates autonomously
    on a decentralized exchange (DEX). An example of such Automated Market Maker is
    the Uniswap exchange launched in 2018.


    # B


    # Bitcoin


    Bit-coin is the first coin in the Cryptoverse created by Satoshi Nakamoto in 2009.
    This coin is the first crypto-currency native to the Bitcoin blockchain and is
    rewarded to the miners for verifying the cryptography code by solving a block.
    This open computer software code was developed by Satoshi Nakamoto to solve the
    problem of trust between peer to peer exchanges of money electronically. Bitcoin
    is a new technologically positive disruptor not only for the financial system
    but the tech world as a whole.


    There are an estimated 21 million Bitcoins in the whole world and the year 2140
    is predicted to be the year the last Bitcoin will be mined. Even though Bitcoin
    is a decade old this innovative tech is still in its infancy stage which puts
    you in a great position to learn, invest and create great wealth for you and your
    family. As of the publication of this book Bitcoin as many in the cryptoverse
    sees it as a great storage of value in comparison to precious metals like gold.
    Its value derives from its scarcity, supply and demand.


    # Bitcoin Cash


    An Altcoin and hard fork of the Bitcoin original code created in 2017 by some
    Developers (DEVs) and cryptocurrency miners. Bitcoin Cash was forked to solve
    the problems of block speed and scalability that Bitcoin original code lacks.
    BCH’s code increased the block sizes from 1MB to 8MB which was recently upgraded
    to 32MB in 2021 to adapt to an ever-increasing transaction speed and processing
    time.


    This is one example of an Altcoin that was forked to address some of the problems
    that the original Bitcoin code Satoshi Nakamoto created. There are many other
    Altcoins that you will come across of similar stories as you dive deep into the
    cryptoverse.

    '
  trans: '


    # ADDRESS


    地址与家庭地址或电子邮件地址非常相似。自互联网 1.0 诞生以来，我们就开始使用电子邮件地址在线发送和接收信息数据，但现在我们被引入加密世界地址来发送和接收加密货币。这些地址由字母数字字符组成，并且与每个区块链及其原生币或代币非常特定。


    大多数区块链地址是公开的，可以在区块链浏览器上查看，以确认任何地址进出的交易。这些公开地址的例外是基于隐私的区块链，如 Grin 和 Monero。任何人都无法阅读、记忆和处理区块链地址的长随机字母数字字符串，但请放心，计算机处理它没有任何问题。


    地址是唯一且匿名的，尽管它们是公开的，地址所有者的真实身份永远不会被揭示。尽管对于大多数处理加密货币的人来说情况确实如此，但主要代币项目和交易所的创始人和联合创始人的真实身份实际上是被揭示的。一个例子是以太坊的创始人
    Vitalik Buterin，所有在以太坊区块链网络工作的人都知道他的公开地址。


    # Airdrop


    空投是给从飞机上空投的物资或宣传传单等事物的术语。该策略也被加密世界中的新加密货币项目用于其原生币或代币。它以电子方式分发给项目的早期采用者，以创造可见性和热度，进而带来大众的更多需求。你只需要有一个符合要求的钱包，能够在计划发布的时间和日期接收空投。你需要为任何空投注册。


    # Altcoin


    Alt-coin 或替代币是给比特币之后出现的所有其他币的名称。这些币原生于其自己的区块链软件代码，在通俗的说法中，它们是比特币的软分叉或硬分叉，即原始代码的副本。比特币现金、莱特币和
    Raven 币是从原始比特币代码分叉出的几个替代币的例子。其他币如以太坊有自己的代码或区块链，这些代码或区块链是为了解决比特币无法解决的一些问题或问题而创建的。


    以太坊区块链的一项重大改进是引入智能合约和智能属性。替代币诞生于解决其他币存在的问题的必要性，例如可扩展性以处理交易处理速度的需求并减少此类交易收取的费用。由于迷因文化的流行，一些币也只是为了嘲讽比特币而产生。催生这种迷因文化的特定替代币是狗狗币。


    # ASIC


    缩写或首字母缩写代表 Application-Specific Integrated Circuits。这些特定的集成电路设计在硅芯片上，只执行一项特殊任务，即挖矿和验证某些代码。在比特币的情况下，asic
    处理 SHA-256 与工作量证明协议有关，以挖矿和验证每笔交易。


    # ASIC MINER


    asic 矿机是将所有特定集成电路与其他硬件（如电源）连接在一起，制成一台只执行一项任务的特殊计算机，即利用工作量证明协议挖取加密货币。这些 asic 矿机连接到互联网，与普通家用计算机相比，开机时往往会产生很大噪音。因为它们运行工作量证明协议，所以往往会消耗大量电能。


    # ATH


    缩写或首字母缩写 All Time High 指的是加密货币的价值根据其价格和市值达到的最高点。这通常发生在人们 FOMO 进入新项目，投机它将飞向月球并让他们变得非常富有时。不再是秘密，加密货币一旦在加密世界的前
    5 个交易所上市，就会达到 All Time High。


    # ATL


    缩写或首字母缩写 All Time Low 指的是加密货币的价值根据其价格和市值下跌的最低点。这通常发生在投资者中出现恐慌抛售，以及新闻媒体、华尔街的某些影响倾向于泄露到加密世界时。买入并持有总是比恐慌亏损出售更安全。


    # Apeing


    这种情况发生在人们发现一个即将推出或只有几天或几周历史的新项目或加密货币，并通过购买尽可能多的代币而 FOMO 进入时。他们通常在购买时不花时间对特定的加密货币项目进行彻底的研究或背景调查。这是在加密世界中最快被
    rekted 并亏钱的方式。这不是投资，这被称为赌博。


    # API


    缩写或首字母缩写代表 Application Programming Interface。这一组协议是软件应用程序编程接口。这些应用程序的协议以特定方式交互，规定如何使用数据以及需要执行什么操作。


    # AMM


    缩写或首字母缩写代表 Automated Market Maker，通俗地说，它是交易所协议使用的软件代码，在去中心化交易所（DEX）上自主运行。这种 Automated
    Market Maker 的一个例子是 2018 年推出的 Uniswap 交易所。


    # B


    # Bitcoin


    比特币是加密世界中第一个币，由中本聪于 2009 年创建。这个币是原生于比特币区块链的第一个加密货币，作为矿工通过解决区块来验证加密代码的奖励。这种开放计算机软件代码由中本聪开发，以解决电子点对点货币交易中的信任问题。比特币不仅对金融系统，而且对整个技术世界来说，都是一个技术上积极的颠覆者。


    全世界估计有 2100 万个比特币，预计 2140 年将是最后一个比特币被挖出的年份。尽管比特币已有十年历史，但这项创新技术仍处于起步阶段，这让你处于一个很好的位置，可以为你和你的家人学习、投资并创造巨大的财富。截至本书出版，比特币在加密世界许多人看来，与黄金等贵金属相比，是一种极好的价值储存手段。其价值源于其稀缺性、供需关系。


    # Bitcoin Cash


    一个 Altcoin，是 2017 年由一些开发者（DEVs）和加密货币矿工创建的比特币原始代码的硬分叉。比特币现金分叉是为了解决比特币原始代码缺乏的区块速度和可扩展性问题。BCH
    的代码将区块大小从 1MB 增加到 8MB，并于 2021 年最近升级到 32MB，以适应不断增加的交易速度和处理时间。


    这是一个 Altcoin 的例子，它被分叉以解决中本聪创建的原始比特币代码的一些问题。当你深入加密世界时，你会遇到许多其他具有类似故事的 Altcoin。


    '
