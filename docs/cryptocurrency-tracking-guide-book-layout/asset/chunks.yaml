    \n# Ravencoin\n\nRavencoin: 这是一个山寨币和比特币的硬分叉。它继续通过其矿工使用工作量证明共识。Ravencoin 项目不允许使用\
    \ ASIC 来挖掘其区块，不像比特币，这意味着任何拥有体面计算机的人都可以挖掘 Ravencoin。  \n[https://ravencoin.org/](https://www.google.com/url?q=https://ravencoin.org/&sa=D&source=editors&ust=1661372152480778&usg=AOvVaw0-HMDO6XuVKp5aeSpau0uB)\n\
    \n# S\n\n# Satoshi\n\nSatoshi: 这是比特币的最小单位。\n\n# Soft Fork\n\nSoft Fork: 软分叉是对原始区块链源代码所做的更改，这些更改较小且彼此仍然兼容。这通常是为了帮助改善某些功能并添加新的修改，而无需对区块链结构进行重大更改。这种软分叉的一个例子是比特币\
    \ Segwit 升级。\n\n# Shiba Inu Token\n\nShiba Inu Token: 迷因币项目中最大的市值之一，旨在击败狗狗币。 \
