    \n# Token\n\nToken: 代币或加密货币代币没有自己的区块链，除非它被构建并迁移到自己的区块链上运行。一旦它迁移到自己的区块链，它就成为该区块链的原生代币，不再是代币，而是代币。令人困惑，是的，我打赌你是，让我给你一个例子。比特币是代币而不是代币，因为它是其自身区块链的原生代币。\n\
    \n以太坊的代币称为 Ether (Eth)，它原生于以太坊区块链，但还有其他项目利用智能合约在以太坊区块链之上构建。这个项目使用所谓的 ERC-20 代币，这意味着它们与\
    \ Ether 代币兼容或绑定。这样的代币示例包括 Chainlink (Link)、Basic attention token (BAT)、USDT (Tether)\
    \ 等。\n\n# Turing Complete\n\nTuring Complete: 这意味着一个计算机系统能够解决复杂的算法计算语言，只要它有时间、强大的内存、必要的指令和可用资源来做到这一点。\n\
    \n# U\n\n# Unconfirmed Transaction\n\nUnconfirmed Transaction: 未确认交易是任何正在等待或内存池（即\
    \ memory pool）中等待确认的交易。一旦交易由节点确认和验证，它将被添加到区块链中。\n\n这通常发生在某些区块链上，例如以太坊网络，因为费用昂贵。因此，如果你发送一笔交易，例如出售或购买某个代币，你需要支付足够的\
