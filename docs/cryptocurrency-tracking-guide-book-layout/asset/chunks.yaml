    # WAGMI


    WAGMI: 这个缩写或首字母缩略词代表 We Are Gonna Make It。加密货币圈的投资者总是追逐下一个能让他们瞬间致富的币或代币。实际上，他们会被套牢并损失比预期更多的钱，并继续使用这些词语来缓解对加密货币市场的恐惧、不确定性和疑虑（FUD）。这就是为什么在进入加密货币圈之前，进行
    DYOR 并学习非常重要。


    # Wallet


    Wallet: 就像你用来携带身份证和法币的普通钱包一样，这是一个电子钱包。它是一个存储你用于访问加密货币的公钥和私钥的电子钱包。钱包可以是热存储，意味着你已连接到互联网；也可以是冷钱包，意味着你未连接到互联网。你也可以将其写在一张纸上并安全地存放在某个地方。


    # Whales


    Whales: 这个名称指代持有大量比特币或山寨币的个人或投资者群体。他们在加密货币市场的任何波动都会对币价产生巨大影响。他们被视为加密货币市场波动性的操纵者。


    # Y


    # YOLO


    YOLO: 这个缩写或首字母缩略词代表 You Only Live Once。这是许多社交媒体用户的口头禅，也已进入加密货币圈。当它与把握当下、享受每一刻相关时，可以用于好的方面；但如果用来为加密货币投资中的情绪化决策辩护，则可能是不好的。


    也许你仅仅因为直觉就在一个新项目中 YOLO，这可能会带来财富和不幸，但如果是好运，那一切都值得。不要为自己的决定责怪任何人。这就是为什么在任何加密货币中
    FOMO 和 YOLO 之前，进行 DYOR 非常重要。


    # Z


    # Zero Confirmation Txn


    Zero Confirmation Txn: 这与未确认交易相同。


    # Conclusion


    现在你已经通过学习一些缩写迈出了第一步，你走到了这一步，或者也许你只是跳到了最后因为你好奇，这里就是。我将指导你如何打开一个电子钱包，也称为热钱包。点击这个链接
    [https://metamask.io/](https://metamask.io/) 这将带你进入 Metamask 钱包网站。你可以下载钱包并将其添加到你的浏览器。Metamask
    有大量的 YouTube 视频来教导和指导你。我分享这个是因为我自 2019 年以来一直在使用 Metamask 钱包。


    这是你通过拥有一个钱包来保存你的币，从而参与加密货币圈的第二步。你也可以使用你的 Metamask 通过将其连接到你的银行信用卡或借记卡来购买任何加密货币。有许多其他钱包，但我认为一个就足够了。请记住不要与任何人分享你的私钥。一句忠告，大多数
    DeFi 钱包对你的币没有控制权，也没有权限来修复你的钱包，所以小心不要丢失你的私钥。


    这本书是一本活的书，我将继续添加更多新词汇，因为加密货币圈将继续向前发展。与个人电脑和互联网的早期相比，我们在加密货币圈仍然非常早期。加密货币圈仍处于其幼年阶段，我很高兴你花时间来了解它。你是加密货币圈的真正先驱，所以继续关注。敬请期待我将在下一本书中为你揭晓的下一个
    10 枚币，供你投资。


    如果你喜欢这本加密货币追踪指南，请留下评论！


