- raw: "Ethereum:   An Altcoin introduced by Vitalik Buterin with its whitepaper in\
    \ 2013 and launched in 2015 with one of its co-founder Joe Lubin. It shares similarities\
    \ as Bitcoin which is the utilization of Blockchain Technology but is very much\
    \ different in its code consensus protocols. Bitcoins blockchain was designed\
    \ only for bitcoin as a storage of value cryptocurrency.  \n\nEthereum on the\
    \ other hand is considered the programmable blockchain where developers and programmers\
    \ can build on top of it any defi application protocol utilizing smart contracts.\
    \ Ethereum is a Blockchain designed with the purpose to expand the views of not\
    \ only cryptocurrencies, smart properties but the transformation of all sorts\
    \ of centralized applications into decentralized applications.  \n\nThe Ethereum\
    \ Blockchain rewards its miners with Eth, its native coin and because of its smart\
    \ contract applications users can also create, publish and monetize any defi Dapps\
    \ where they can exchange their tokens for Eth coins and vice versa. Since its\
    \ inception it has grown so fast that the majority of the tokens in the cryptoverse\
    \ mainly reside on the Ethereum network. These tokens are called ERC20 tokens\
    \ which are compatible with anyone that uses an Ethereum Wallet.  [ ](https://www.google.com/url?q=https://ethereum.org/en/&sa=D&source=editors&ust=1661372152452323&usg=AOvVaw0ubRcAyNCs5BSZ-QnQiD6d)\
    \   [https://ethereum.org/en/](https://www.google.com/url?q=https://ethereum.org/en/&sa=D&source=editors&ust=1661372152452613&usg=AOvVaw3pj2WcMx7FmEg1XwhBUSr0)\
    \    \n\nERC20:  It is a token that is created by a Decentralized Application\
    \ protocol utilizing smart contracts on the Ethereum blockchain network. It stands\
    \ for Ethereum Request for Comment of rules and guidelines to be followed by any\
    \ new project that is developed utilizing smart contracts on the Ethereum blockchain\
    \ for their new tokens.  \n\nAll ERC20 compliant tokens are supported by Ethereum\
    \ Wallets. Examples of the ERC20 tokens are Basic Attention Token BAT, Maker MKR,\
    \ Crypto.com CRO, HOGE and many more \n\nEVM:   The abbreviation or acronym stands\
    \ for  E thereum  V irtual  M achine. All nodes that are connected to the Ethereum\
    \ network run the Ethereum Virtual Machine. They are basically Turing complete\
    \ runtime environments which support all  Dapps  built on the Ethereum Blockchain\
    \ utilizing the smart contract software code. \n\nExchange:  An exchange is either\
    \ a CEFI centralized application or DEFI decentralized application where you can\
    \ trade, sell or buy any cryptocurrency. Some exchanges have mobile application\
    \ versions of their websites which makes it more convenient for any individual\
    \ to buy using bitcoin, altcoin or fiat money. Examples of some exchanges are\
    \ Coinbase, FTX, Crypto.com, Binance and more. \n\nF:  \n\nFlippening:  This refers\
    \ to a new cryptocurrency overtaking the old cryptocurrency by price market value\
    \ and is widely used by investor analysts as a speculative colloquial since 2017\
    \ between Bitcoin and Ethereum. As of this writing Bitcoin is trading at 21k while\
    \ Ethereum is trading at 1.6k. Speculative investors are betting the flippening\
    \ will happen once Eth2.0 is up and running. \n\nFull Node:  A full node is a\
    \ computer connected to the internet with enough memory that can support and run\
    \ a complete copy of the blockchain software code. The complete copy meaning it\
    \ consists of the Block Header and Block transactions. They verify every transaction\
    \ throughout the network by enforcing the consensus rules and also validate each\
    \ block before they chain it together.  \n\nFinTech:  The abbreviation and acronym\
    \ stands for Financial Technology. As the rapid changes and growth of emerging\
    \ technology in finances evolved so as the need for adapting newer efficient ways.\
    \ To help serve the rising needs of consumers, old financial institutions are\
    \ very slow and reluctant to adapt as in the example of Cryptocurrency. Here are\
    \ just a few new FinTech companies that made the move into the cryptoverse to\
    \ help with consumer demands. Crypto.com, Coinbase, Robinhood.. and more \n\n\
    FOMO:  The abbreviation and acronym stands for  F ear  O f  M issing  O ut. It\
    \ usually happens to investors or anyone that comes across an article on YouTube,\
    \ news, a blog post or word of mouth from a friend without taking the time to\
    \ DYOR they start to have overwhelming emotions and jump right in. Greed is also\
    \ a major contribution to these emotions and is a great recipe for disaster.  \n\
    \nFOMO Buying:  This is also called panic buying due to the overwhelming emotions\
    \ of greed and without any control over such emotions. This FOMO buying happens\
    \ a lot to new investors that might have come into a particular cryptocurrency\
    \ late but now want to get more in their bags. It also creates the opposite when\
    \ the price of their cryptocurrency and bags start to dip, they will panic sell\
    \ and they will lose money. \n\nG:  \n\nGas:   The Ethereum blockchain charges\
    \ a transaction fee, these fees are called gas and are measured in Gwei.  \n\n\
    Gwei:  This is the smallest denomination of Ether. This blend of words stands\
    \ for G -giga and Wei - Wei Dai the founder of B-money and predecessor to Bitcoin\
    \ who brought about the concept of modern cryptocurrencies.  \n\nGenesis Block:\
    \   This is the first block of any blockchain platform. It is also the zero block\
    \ or block zero which refers to zero blocks preceding it. First genesis block\
    \ belongs to the Bitcoin blockchain, in which Satoshi Nakamoto wrote a message\
    \ in the Bitcoin genesis block: “ The Time 03/Jan/2009 Chancellor on brink of\
    \ second bailout for banks”. \n\nGPU Mining:  The abbreviation or acronym stands\
    \ for Graphics Processing Unit or simply just a graphics card used for mining.\
    \ GPU mining is mainly used to mine the majority of Altcoins and because its process\
    \ hashes is much faster than CPU mining. Certain cryptocurrency algorithm code\
    \ allows both GPU and CPU mining which can be profitable for the miners. The difficulty\
    \ of mining Bitcoin is so high a GPU miner cannot compete with an ASIC miner.\
    \  \n\nGaming Pc’s are perfect computers for mining if you are interested in learning\
    \ how to mine because it comes with one GPU that can do the job. You can also\
    \ build a dedicated mining machine with three or more GPUs for optimum mining\
    \ results. Keep in mind that Cryptocurrency mining is not cheap and it will cost\
    \ you a lot of money not only for the components to build a miner you have to\
    \ take into consideration the amount of electricity it will cost to run it. DYOR\
    \ before you start. \n\nH:  \n\nHalving:  This is the process by which mining\
    \ rewards are cut in half. An example would be the miners getting rewarded hundred\
    \ coins for finding a block and then the halving happens after four years now\
    \ the miners will only receive fifty coins. This is written in the source code\
    \ of the Blockchain and it is immutable. As the difficulty of finding a block\
    \ rises the less and less the rewards are given to the miners. This is also one\
    \ way to control the supply of cryptocurrency entering the cryptoverse. \n\nHard\
    \ Fork:  When the legacy protocol source code gives birth to a new one by way\
    \ of implementing new changes to the code. It can be related to the results of\
    \ a disagreement on how they can move the project forward within the DEVs and\
    \ miners of any cryptocurrency. Some examples are Bitcoin Cash and Ravencoin;\
    \ they are both hard fork of Bitcoin.  \n\nEthereum Classic is the hard fork example\
    \ of the Ethereum Blockchain. Without getting too in depth in the technical aspects\
    \ of the subject it's important to know that a Hard Fork happens when new and\
    \ permanent changes are made to the old blockchain source code which are incompatible\
    \ to the original consensus rules. \n\nHash:  In layman's terms it is a computational\
    \ mathematical process of taking an input message and turning it into a fixed\
    \ output message.  "
  fmt: '

    # Ethereum


    Ethereum 是由 Vitalik Buterin 在 2013 年发布白皮书并推出的一种替代币（Altcoin），其联合创始人之一为 Joe Lubin，于
    2015 年正式启动。它与比特币（Bitcoin）一样都利用了区块链技术，但在代码共识协议方面有很大不同。比特币的区块链最初仅设计用于作为价值存储的加密货币。


    与之不同，Ethereum 被视为可编程区块链，开发者和程序员可以在其之上构建任何利用智能合约的去中心化金融（DeFi）应用协议。Ethereum 是一种为扩展加密货币、智能属性的视野，并将各类中心化应用转变为去中心化应用而设计的区块链。


    Ethereum 区块链以其原生代币 Eth 奖励矿工，由于其智能合约应用，用户还可以创建、发布和货币化任何 DeFi DApp，从而允许他们将代币兑换为
    Eth 代币，反之亦然。自诞生以来，它发展迅速，加密世界中大多数代币主要部署在 Ethereum 网络上。这些代币称为 ERC20 代币，与任何使用 Ethereum
    钱包的人都兼容。


    [https://ethereum.org/en/](https://ethereum.org/en/)


    # ERC20


    ERC20 是在 Ethereum 区块链网络上利用智能合约的去中心化应用协议创建的代币。它代表“Ethereum Request for Comment”，即任何在
    Ethereum 区块链上利用智能合约开发新代币的新项目都应遵循的规则和指南。


    所有符合 ERC20 标准的代币都受到 Ethereum 钱包的支持。ERC20 代币的示例包括 Basic Attention Token (BAT)、Maker
    (MKR)、Crypto.com (CRO)、HOGE 等。


    # EVM


    EVM 是 Ethereum Virtual Machine 的缩写或首字母缩略词。连接到 Ethereum 网络的所有节点都运行 Ethereum Virtual
    Machine。它们基本上是支持在 Ethereum 区块链上利用智能合约软件代码构建的所有 DApp 的图灵完备运行时环境。


    # Exchange


    交易所（Exchange）可以是中心化交易所（CEFI）或去中心化交易所（DEFI），用户可以在其中交易、出售或购买任何加密货币。一些交易所拥有其网站的移动应用程序版本，这使得任何个人都可以更方便地使用比特币、替代币或法定货币进行购买。一些交易所的示例包括
    Coinbase、FTX、Crypto.com、Binance 等。


    # F


    ## Flippening


    Flippening 指的是一种新的加密货币按市场价格超越旧加密货币的现象，自 2017 年以来，投资分析师广泛将其用于比特币和以太坊之间的投机性口语。截至撰写本文时，比特币交易价格为
    21k，而以太坊交易价格为 1.6k。投机投资者押注，一旦 Eth2.0 上线运行，Flippening 就会发生。


    ## Full Node


    全节点（Full Node）是一台连接到互联网、拥有足够内存以支持和运行完整区块链软件代码副本的计算机。完整副本意味着它包含区块头和区块交易。它们通过强制执行共识规则来验证网络中的每一笔交易，并在将区块链在一起之前验证每个区块。


    ## FinTech


    FinTech 是 Financial Technology 的缩写和首字母缩略词。随着金融领域新兴技术的快速变化和发展，适应更新、更高效方式的需求也随之增加。为了满足消费者不断增长的需求，传统金融机构反应迟缓且不愿适应，就像加密货币的例子一样。以下是一些进入加密世界以帮助满足消费者需求的新
    FinTech 公司：Crypto.com、Coinbase、Robinhood 等。


    ## FOMO


    FOMO 是 Fear Of Missing Out 的缩写和首字母缩略词。它通常发生在投资者或任何在 YouTube、新闻、博客文章或朋友口头传闻中看到文章而没有花时间进行
    DYOR 的人身上，他们开始产生压倒性的情绪并立即投入。贪婪也是这些情绪的主要促成因素，是导致灾难的绝佳配方。


    ## FOMO Buying


    FOMO Buying 也称为恐慌性购买，是由于贪婪等压倒性情绪以及无法控制此类情绪而引起的。这种 FOMO Buying 经常发生在新投资者身上，他们可能进入某种加密货币较晚，但现在想要在他们的持仓中增加更多。当其加密货币和持仓的价格开始下跌时，也会产生相反的情况，他们会恐慌性抛售并亏损。


    # G


    ## Gas


    Ethereum 区块链收取交易费，这些费用称为 Gas，并以 Gwei 计量。


    ## Gwei


    Gwei 是以太币（Ether）的最小面额。这个混合词代表 G - giga 和 Wei - Wei Dai，后者是 B-money 的创始人，也是比特币的前身，带来了现代加密货币的概念。


    ## Genesis Block


    创世区块（Genesis Block）是任何区块链平台的第一个区块。它也是零区块或区块零，指的是其前面没有区块。第一个创世区块属于比特币区块链，其中 Satoshi
    Nakamoto 在比特币创世区块中写道：“The Time 03/Jan/2009 Chancellor on brink of second bailout
    for banks”。


    ## GPU Mining


    GPU Mining 是 Graphics Processing Unit（图形处理单元）的缩写或首字母缩略词，简单来说就是用于挖矿的显卡。GPU Mining
    主要用于挖掘大多数替代币，因为其哈希处理速度比 CPU Mining 快得多。某些加密货币算法代码允许 GPU Mining 和 CPU Mining 同时进行，这对矿工来说可能是有利可图的。比特币挖矿的难度如此之高，以至于
    GPU 矿工无法与 ASIC 矿工竞争。


    如果你有兴趣学习如何挖矿，游戏电脑（Gaming PC''s）是完美的挖矿电脑，因为它配备了一块可以完成工作的 GPU。你也可以构建一台配备三个或更多 GPU
    的专用挖矿机器以获得最佳挖矿效果。请记住，加密货币挖矿并不便宜，不仅需要为构建矿机的组件花费大量资金，还需要考虑运行它所需的电力成本。在开始之前请先进行 DYOR。


    # H


    ## Halving


    减半（Halving）是挖矿奖励减半的过程。例如，矿工找到一个区块原本获得一百枚代币奖励，四年后发生减半，矿工只能获得五十枚代币。这写在区块链的源代码中，是不可更改的。随着寻找区块难度的增加，给予矿工的奖励越来越少。这也是控制进入加密世界的加密货币供应量的一种方式。


    ## Hard Fork


    硬分叉（Hard Fork）是指旧协议源代码通过实施新代码更改而诞生新协议的过程。这可能与加密货币的开发者（DEVs）和矿工在如何推进项目方面存在分歧的结果有关。一些示例包括
    Bitcoin Cash 和 Ravencoin，它们都是比特币的硬分叉。


    Ethereum Classic 是 Ethereum 区块链的硬分叉示例。无需过多深入技术细节，重要的是要知道，当对旧区块链源代码进行新的永久更改且与原始共识规则不兼容时，就会发生硬分叉。


    ## Hash


    通俗地说，哈希（Hash）是一种计算数学过程，将输入消息转换为固定输出消息。

    '
