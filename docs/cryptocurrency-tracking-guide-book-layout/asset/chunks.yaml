    Retrieved August 22, 2022, from [https://web.archive.org/web/20190111200340/http://acronymsandslang.com/](https://web.archive.org/web/20190111200340/http://acronymsandslang.com/)


    Bitcoin - Open source P2P money. (2022). [https://bitcoin.org/en/](https://bitcoin.org/en/).
