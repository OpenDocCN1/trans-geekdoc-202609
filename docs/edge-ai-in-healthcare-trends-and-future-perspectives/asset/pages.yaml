    # ### 11.1 INTRODUCTION


    As the cases of COVID-19 are rising tremendously worldwide, governments are taking
    the necessary steps to mitigate the pandemic''s impact, such as asking people
    to self-isolate if they are experiencing any symptoms. Numerous apps help people
    with their health management, remote monitoring, and overall'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'health maintenance. These apps relieve the burden on the National Health Service
    (NHS) during peak demand times, but they also help the participants protect themselves
    and other people from any unnecessary risk (Vaidyam et al. 2019). Many AI chatbots
    use evidence-based cognitive-behavioral techniques (CBT) to make people feel understood
    (Abd-Alrazaq et al. 2020). When these chatbots are combined with professional
    human support, they provide high-quality mental health support 24/7. Multiple
    chatbots are offering early mental well-being assistance by elevating human mental
    connections with them. Many AI systems also integrate natural language understanding
    with clinical assurance for assisting everyone to develop skills that can be used
    to manage their mental health in the time of the new normal (Dosovitsky et al.
    2020). By combining the science and art of an effective therapy within a portfolio
    of digital therapeutics (Daley et al. 2020), tools and applications that automate
    both the process and content of the therapy also create a technology that can
    establish trusting relationships with the people to fill the gaps in their entire
    healthcare journey from symptom monitoring to episode management. The study identifies
    and analyses four global themes (epidemiology characteristic of mental health,
    types of chatbots. benefits of using chatbots, future implications) and ten organising
    themes (characteristic, impact, symptoms, prevention, types of chatbots and sources,
    feasibility, ease of use, solving complex problems, trust, future implications).


    This research paper is divided into six sections: Section 11.2 presents a review
    of the subject''s literature, Section 11.3 illustrates the research objectives
    and methodologies, and Section 11.4 provides analysis and discussion, whereas
    Section 11.5 contains findings and recommendations and Section 11.6 contains conclusions
    and implications.


    # 11.2 LITERATURE REVIEW


    After an initial overview of related work, the researcher examined the available
    literature and found many studies had been done related to artificial intelligence
    (AI), chatbots, and machine learning (ML), related to tourism, education, online
    shopping, and other sectors. According to the latest study in 2021, healthcare
    during the pandemic also utilised this technology to maintain the vaccination
    records that would have taken longer without it (Srivastava 2021). At this time,
    chatbots were also used by the healthcare sector for various other purposes, including
    the maintenance of the mental health of participants by keeping them interactive
    and engaged (Romanovskyi et al. 2021). Artificial intelligence is not limited
    to the economic and professional setup but also makes the daily life of individuals
    easy and more convenient with the help of smart gadgets like Alexa and Siri (Tariq
    et al. 2021; Tariq & Abonamah 2021; Maher et al. 2020). This adoption of the technology
    for daily life was termed “easy artificial intelligence” by Tariq et al. (2021),
    whereas professionally used artificial intelligence technology was considered
    a problematic framework. AI helped in many aspects and made the transactions of
    major stakeholders (customers) very easy and convenient, and hence, the significant
    contribution of chatbots was found in booking flights, rail reservations, and
    hotels (Suanpang et al. 2021). All the previous studies had proven the successful'
  merge: -1
  img_proc: true
- pgno: 154
  md: communication between the chatbot and users’ perception, but it failed to handle
    the sentimental and complicated elements. This gap was found due to machine-learning
    technology’s lack of natural language, the second stage of chatbot conversation
    (Suta et al. 2020). In a variety of industries, eBay used ShopBot and Taco Bell’s
    use of the chatbot “Tacobot” to take orders from the menu. Construction company
    Keyes used Roof.ai Chatbot to ask questions; in travel sectors, there are many
    chatbots like Expedia, Facebook and Messenger chatbots; Skyscanner, Facebook,
    and Messenger chatbots and many others have gained popularity in healthcare (in
    general) and mental health (in particular) over the past five years, in addition
    to the previously stated industries (Vyas & Gupta 2022). The earlier research
    was more related to the participant-friendly and convenient nature of chatbots
    for timely response to customers (Sahaja et al. 2019). The chatbots were also
    found to be effective in extracting information, like the search engines that
    also helped chatbots in effective conversations (Suresh et al. 2020; Maher et
    al. 2020). The technology of chatbots has evolved to that level with the aid of
    deep learning so that they can mimic the person to develop greater human feeling
    and more convenient ways like Google Maps and Siri to give a human voice (Verma
    et al. 2019; Jwala et al. 2019; Um et al. 2020; Ukpabi et al. 2019). However,
    in the same industry, technological advances aside, the primary negative effect
    of traditional agent services was observed, which hinders customers’ intention
    to adopt and grow chatbot backend services ( Pillai, R., & Sivathanu, B. (2020).
    This trust for the agent and adherence to the traditional process also affects
    the willingness of customers to adopt the technology in the tourism industry.
    In the e-commerce industry, sales decreased due to replacing human–human interaction
    with human–computer interaction, backed with customers’ perception that machines
    cannot respond like a human (Xueming Luo et al. 2019). This problem was separated
    from the benefit of having more purchase options based on customers’ choices that
    can ease customers’ shopping (Hidayatullah et al. 2019). Chatbot technology lacks
    machine language and works on natural language, and the new technology, called
    "verbot", could be developed to work on the computer language (Gaikwad 2018).
    In the healthcare sector, these chatbots, with the help of AI, perform various
    functions, including entertainment and providing directions to other departments.
    The participant can easily and quickly access the status of their appointment
    and reports, which helps save on customer service costs (Athota et al. 2020).
    The healthcare professionals also developed a particular chatbot for pandemic
    situations that was proven to be effective in managing the mental shock of participants
    during and after quarantine by providing a communication platform for updating
    the status of pandemic risk and recovery (Ouerhani et al. 2020). Patient engagement
    is beneficial for keeping the patient mentally positive (Battineni et al. 2020),
    but the avoidance behavior of participants toward AI-supported chatbots can challenge
    the practice of patient engagement, and that may cause deterioration of the system
    by which mental healthcare professionals keep the patient stress free and occupied
    in some interactions (Athota et al. 2020). The traditional viewers and participants
    with poor technical knowledge were also studied as the significant receptors to
    accepting chatbots in hospitals and other health facilities (Battineni et al.
    2020). The emergence of chatbots and AI in the healthcare sector was initiated
  merge: -1
  img_proc: true
- pgno: 155
  md: 'in combination with yoga, meditation, weight-loss solutions, the latter guiding
    the diet plans through regular interactions via the online system and chatbots
    (Verma et al. 2019). Over time, AI was utilised to delight the participant, with
    timely appointments and reminders of upcoming medical tests to help them schedule
    their visits accordingly (Suresh et al. 2020). The major players of the healthcare
    industry were also found to be effective at managing the vast customer base with
    the help of system-led services through AI-backed chatbots (Pillai et al. 2020).
    The pandemic has proved to be an opportunity for chatbots in the healthcare industry,
    especially in departments of mental health, as teams of psychiatrists in India
    found its usage to be effective at balancing the mental health of suffering participants
    at the time of treatment and quarantine (Huang et al. 2019). Chatbots were also
    suggested as the better tool for controlling infections at the time of pandemic
    through virtual assistance by registered doctors and healthcare professionals
    and maintenance of psychological balance at the time of a hostile and depressive
    environment (Battineni et al. 2020). There are many factors that can increase
    the acceptance of chatbots in the healthcare sector. However, some critical factors,
    like trust in the doctors in virtual mode, acceptability of technology-driven
    assistance, in-human interface for human interaction, are suggested to be studied
    for increasing the effectiveness of artificial intelligence in the healthcare
    sector (Athota et al. 2020; Vyas & Bhargava 2021). Mental health is found to be
    more critical for the young generation due to various life factors, demanding
    regular interaction and sharing of thoughts through human interactions (Oh et
    al. 2017). These aspects of AI-led chatbot adoption are found with a broader scope
    to study the acceptance and adaptability of chatbots in the healthcare sector.
    We know that the demand of the healthcare industry is increasing rapidly nowadays,
    especially after the COVID-19 pandemic (Vyas 2023).


    # 11.3 RESEARCH PROBLEM AND AIM


    The adoption of the chatbot for mental health issues depends upon human engagement
    with AI-enabled chatbots. Previous research (Abd-Alrazaq et al. 2020; Lucas et
    al. 2017; Anthes 2016) investigated only users'' adoption and perceptions, but
    the user experience with chatbot was neglected. The literature offers no clear
    methodology to study the user experience with the chatbot, and this is an area
    that requires further exploration. Therefore, in the current study, the qualitative
    approach was utilised to determine the themes of user experience, so, in the future,
    a conceptual model can be constructed, where the main research objective is to
    identify the global themes of user experience.


    # 11.4 RESEARCH METHODOLOGY


    # 11.4.1 RESEARCH DESIGN


    In this study, validated methods were used to identify the chatbots using understanding
    of natural language with clinical assurance for helping humans improve'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'their mental health; through thematical analysis, researchers could identify
    the

    themes of current human sharing with chatbots. When it comes to identifying

    the theme, thematical analysis involves identifying, analysing, and finding patterns

    in data (Braun et al. 2006). Qualitative research is required to study human

    behavior, attitude, beliefs, and opinions toward some objects and preferences
    and

    choices. On the contrary note, the purpose of quantitative methods is to have
    sta-

    tistical values like ratios, averages, percentages of the sample population which

    the researcher want to study. Even when the researcher aims to study the relation-

    ship between the attitude and behavior between two variables (Beeson et al.

    2011). For the current study, a qualitative approach was selected to study how

    chatbots could help humans improve their mental health.


    # 11.4.2 SAMPLE INSTRUMENT


    This study is focused on how humans interact with chatbots which understand

    natural language in order to improve mental health conditions. For collecting

    qualitative data, unstructured, open-ended interviews were taken to identify dif-

    ferent types of chatbots used by humans to resolve mental health issues and cur-

    rently identify themes in a trend that humans are sharing with chatbots.


    # 11.4.3 SAMPLE


    The sample populations were the clients who came for consulting to the

    Department of Psychology of SGT University, Gurugram, India., Purposive sam-

    pling techniques were used to select the sample population. A total of 15 samples

    of clients were taken for the current study.


    # 11.4.4 DATA COLLECTION METHOD


    For the current study, qualitative interviews were conducted to collect the data
    to

    identify the different types of chatbots used and identify themes in a trend that

    humans are sharing with chatbots. The phenomenological interview technique

    (Cypress 2018) was adapted to collect participants'' personal experiences while

    using chatbots and how it was different from human interaction. To conduct the

    qualitative interview, telephone, WhatsApp, and Skype were used as the medium.


    # 11.4.5 DATA ANALYSIS


    For data analysis, NVivo software was used to identify themes and patterns. NVivo

    offers many advantages and significantly improves study quality (Hilal et al.
    2013;

    Hilal & Alabri 2013). Qualitative data analysis has become more accessible and

    more professional than before. The program minimises handling responsibilities

    considerably and offers the researcher more time to detect trends, identify issues,

    and draw conclusions. Altogether, it is highly recommended that the qualitative

    researcher follows this software''s processes to alleviate the confused, untimely,'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'and time-consuming duty (). A qualitative approach is intended to develop in
    line with rapid progress in computer-assisted/quality data analysis (CAQDAS).


    # # 11.5 DATA ANALYSIS AND INTERPRETATION


    The thematic analysis process can be divided into six broader subcategories. All
    six steps were necessary because a colossal amount of text was generated during
    qualitative data collection, and processing texts for analysis was complex. In
    the current study, ten organizing themes and 51 basic themes were identified based
    on (a) mental health condition, its symptoms and how the patient identified the
    mental health, and (b) how the chatbot helped in improving mental health. The
    15 transcripts were collected from the 15 participants who were contacted for
    counseling in the SGT University Department of Psychology. The entire study consisted
    of a 55-minute unstructured interview for each participant. These were then transcribed
    verbatim. The study investigated how participants interpret feedback and how they
    use it. The discussions focused on how participants felt about their mental health
    they had survived COVID-19: how they found the symptoms, to what degree participants
    had taken precautionary steps, and whether they had used chatbots. Everyone who
    took part in an interview from which the extracted information was collected,
    agreed that the transcript extract could be used in the analysis. It was of interest
    to notice that participants reported their experiences and points of view. An
    essential component of the research is data collection and analysis, and the corresponding
    top-down or theoretical thematic analysis (Braun, V., & Clarke, V. (2006)), driven
    by the specific research question(s) and the analyst''s focus, is distinguished
    from bottom-up or inductive analysis, which is driven more by the data. The study''s
    primary goal was to come up with a clear and simple example that could be utilized
    as a reference for assessing qualitative data. The qualitative material''s thematic
    network analysis has six-phase guidance (Braun, V., & Clarke, V. (2006)), a highly
    effective foundation for undertaking this type of study. The analytic method offered
    makes use of well-established and well-known methodologies. It suggests that topic
    analysis can be helped and presented more effectively using thematic networks.
    Thematic networks are a web-like structure that summarises texts into significant
    themes (Attride-Stirling 2001). The first stage is to understand the participant''s
    mental health issues, symptoms, and assessment steps. All fifteen transcripts
    were read to understand the text and correctly interpret the result (Braun, V.,
    & Clarke, V. (2006)). The result of the sample work is given in Table 11.1, and
    potential words were identi- fied from the transcripts.


    Interesting patterns emerged when examining all transcripts, such as re-occurring
    words, ideas, symptoms, chatbot importance, and future implication (). All the
    texts were read carefully and coded accordingly. Each subsequent transcript reading
    brought new insight into how chatbots helping to reduce mental health issues and
    how participants found chatbots in communication.


    Initially, 51 codes were identified from the transcript, so no critical informa-
    tion was missed during the final analysis. All codes were consolidated into basic'
