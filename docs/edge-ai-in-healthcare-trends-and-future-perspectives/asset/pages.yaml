    be accessed through the interface and assessment of these models, which are accessed
    using their original framework, usually working on a laptop/PC or on cloud services.
    It can also work on their microprocessor built using components for custom processing
    libraries. This evaluation of the process may lead to retraining of these models.
    It may also provide recommendations in terms of these important extensions and
    optimisations on the microprocessor. For example, rehabilitation can be improved
    upon by evaluating the model or the collected data. The models which are generally
    available are trained on these datasets which may require adjustment for these
