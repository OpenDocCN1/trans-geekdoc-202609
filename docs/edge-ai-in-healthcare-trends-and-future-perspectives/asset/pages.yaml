  md: 'The goal of the research described in this chapter is to undertake a thorough
    analysis of current studies that have used applications of cutting-edge technologies
    for data authentication. The work is divided into three main sections: Section
    7.2 investigates prior research on data authentication, using new technology applications,
    notably in the healthcare industry. The purpose of Section 7.3''s validation of
    the review, using word cloud analysis, is to confirm the literature''s relevance
    to the current investigation. Finally, the Conclusion section (Section 7.4) provides
    a summary of the current study.


    # 7.2 A DETAILED REVIEW: EDGE-AI-BASED SMART HEALTHCARE SYSTEM


    Kamruzzaman et al. (2022) suggest that the use of edge-AI and the Internet of
    Medical Things (IoMT), two complex ideas, is increasingly widespread in Smart
    Cities healthcare. These technologies may be used to measure and manage networked
    healthcare, which may also be very helpful since it minimises the amount of human
    labour and increases management effectiveness. The researchers conducted a review-based
    study to investigate the challenges and opportunities with edge-AI for network-based
    healthcare in smart cities. The authors carefully considered various study modalities
    and divided them into two categories. Following a review of the studies, it was
    found that it is increasingly important for healthcare personnel to manage data,
    acknowledge difficulties or challenges, manage emergency cases, monitor patient
    histories, diagnose and treat diseases that manifest differently in patients,
    and treat illnesses that are spreading more widely and affecting a larger population.
    Instead, solutions like edge-AI, IoMT, 5G, fog computing, and cloud computing
    have been emphasised as means to address these expanding problems. But where the
    most recent technologies have been used, the outcomes have improved. The researchers
    also noted that these implementations produced favorable results from the standpoints
    of both patients and healthcare professionals. A detailed study also highlighted
    the need for further verification and application of the numerous models that
    have been proposed in various types of research to confirm their effectiveness
    and guarantee that they may be applied successfully in a variety of contexts (Rajasekar
    et al. 2021). A method for securely authenticating a distant user involves a remote
    server confirming a user''s identity over a dependable communication network.
    Since then, several remote user authentication methods have been developed, but
    each has advantages and disadvantages of its own. The proposed authentication
    systems have a significant impact on the strengths and weaknesses of real-time
    applications such as e-health, telemedicine, the Internet of Things, the cloud,
    and multi-server apps. One of the weak systems that continues to provide access
    by unwanted parties to personal information is Transaction and Management Information
    Systems (TMISS). Meanwhile, remote user authentication, one of the strategies,
    has proven essential in accelerating IoT. Security is a major issue, even if the
    IoT provides secure access to remote securities. Data are shared among many end
    users via cloud computing services and a multi-server architecture, which calls
    for a high level of'
