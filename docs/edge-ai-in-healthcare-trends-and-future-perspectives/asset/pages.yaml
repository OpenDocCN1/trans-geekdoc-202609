    World Health Organization, 80% of the global population with disabilities live
    in middle- and low-income nations, although this percentage is likely overestimated.
    People with disabilities need access to primary healthcare just like everyone
    else. In addition, some disabilities are linked to underlying medical conditions
    where, should patients contract COVID-19, symptoms would be worse. People with
    disabilities are more likely to get inadequate medical attention, given their
    poorer access to facilities, capital constraints, and poorer access to transportation
    in low- and middle-income countries (Disability and Health 2020). Furthermore,
    because they depend on direct physical contact for support and lack access to
    essential public health information, people with disabilities find it difficult
    to employ preventative measures like social distancing that try to stop the coronavirus
    from spreading.


    # 8.2.1 Obstacles faced during the pandemic to facilitate disabled


    Reports have noted difficulties suffered by the disabled in terms of acquiring
    food, necessities, and life-saving medical procedures during the lockdown, in
    addition to the difficulty accessing information and helplines. Furthermore, the
    organisations that maintain the response during these health crises have made
    varied and tenacious efforts. However, the difficulties that health officials
    faced involved some of the following situations.


    +   - Ensuring information is available, ensuring that lockout restrictions should
    not apply to caregivers, and employees with certain disabilities should not be
    allowed to perform essential service-related work.

    +   - Offering disabled people in quarantine necessary services, giving precedence
    in treatment to those with disabilities. One of the most difficult tasks the administration
    has been striving to do is immunization of the residents of rural and village
    areas.

    +   - Teaching emergency response professionals about, among other things, the
    needs of people with disabilities.


    These recommendations are optional, thus there hasn''t been much progress in putting
    them into practice. People are more conscious of social protection''s importance
    in fostering resilience and healing because of the epidemic. In India, the National
    Social Assistance Program (NSAP) offers a monthly pension to those with severe
    and numerous impairments who are living below the poverty level, according to
    the NSAP. The COVID-19 epidemic offers a chance for social institutions to change
    and heal as well as for formerly divided communities to come together. People
    with impairments, for instance, have long looked for flexible and work-from-home
    choices, but have largely been unsuccessful. If we want to build environments
    that are more friendly to everyone, it is crucial that we comprehend the significance
    of workplace accommodations.


