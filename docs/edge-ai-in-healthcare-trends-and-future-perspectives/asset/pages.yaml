    # 13.1 INTRODUCTION


    Medical imaging (MI) engenders more intelligent, diversified, and useful representations
    of the human body’s internal organs for clinical investigation and effective medical
    intervention. MI makes internal structures visible and reveals problems buried
    by the layers of bones and skin, helping in diagnosis and treatment. The influential
    non-invasive MI characteristics from Computed Tomography (CT) and Magnetic Resonance
    (MR) Imaging achieve accurate, compelling health scrutiny and interpretation (Ogawa
    & Lee 1990). Body parts, like tissues, bones, heart, brain, muscles, and tumors,
    can be observed. However, low spatial resolution is an unrelenting problem (Onesimu
    & Karthikeyan 2020; Ayubi et al. 2015; Andrew 2020, affecting the diagnosis process
    and post-processing. Image acquisition time and equipment are the limited MI spatial
    resolution constraints. High-quality images are often challenging due to long
    sampling times, patient discomfort, stronger magnetic field, and higher expenses.
    Thus, to address these associated problems without affecting the hardware and
    scanning process, super-resolution'
