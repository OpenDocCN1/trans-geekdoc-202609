  md: '# 16.7 BLOCKCHAIN CONCEPT


    Blockchain is termed as a secure, transparent, and robust system for information
    sharing. Blockchain includes digital ledger technology, bitcoins, and secure transactions
    distributed across the network (Wood 2021).


    Nofer et al. also describe blockchain technology, which provides secure and immutable
    data storage and exploits the distributed ledger technology (DLT) to record transactions
    (Nofer et al. 2017).


    Blockchain plays a significant role in the healthcare domain, most specifically
    medical tourism. The medical tourist’s data are stored in the Electronic Health
    Record (EHR) or Electronic Medical Record (EMR) (Gupta 2017; Ahram et al. 2017;
    Dagher et al. 2018; Ekblaw et al. 2016; Fan et al. 2018; Jiang et al. 2018; Roehrs
    et al. 2017). The patient data have to be secure and shared with hospitals. To
    ensure data privacy, the digital ledger technology in blockchain ensures secure
    remote patient monitoring and data transfer of EHR or EMR of the patients (Zhang
    et al. 2018).


    In blockchain, features such as decentralisation, confidentiality, and security
    ensure secure access to EHRs with hospitals across the globe, doctors, ministries,
    and insurance companies (Ben Fekih & Lahami 2020).


    In medical tourism, patient data is vulnerable at various places. Hence, it is
    necessary to store their personal data securely and confidentially. The blockchain
    ensures its secure storage, accuracy, and transparency (Daley 2021). In medical
    tourism, blockchain caters patient-centric interoperability, accessibility, and
    privacy. With blockchain technology, the patients can access and share tag information
    of medical data/EMR with outbound hospitals over private blockchain. At the same
    time, they can make their general information such as medical reactions/ drug
    sensitivity, etc., over public blockchain (Sharma et al. 2021).


    # 16.8 BLOCKCHAIN IN MEDICAL TOURISM: SCOPE, ROLE, AND IMPACT


    With advent of technology, hospitality, healthcare, and tourism witnessed significant
    growth in the field of multi-disciplinary sectors – medical tourism. The technology
    provides opportunities for the patients to search global options for medical treatment,
    hospitals, doctors, and healthcare solutions through the internet. At the same
    time, trust and the quality of healthcare are equally important as hospital facilities,
    doctors, country-specific procedures, health hazards, risk transparency, and privacy
    of medical data. The blockchain technology is one of the facilitators for this
    move in healthcare industry. Blockchain features answers to all these concerns
    by providing decentralisation, immutability, distribution, encryption and validation
    of data, transparency, trust, interoperability, privacy and inconsistency without
    any intervention of brokers. The blockchain technology expedites medical tourists
    to make informed decisions while selecting their outbound country. At the same
    point, the transparency feature of blockchain ensures hassle-free movement of
    patients abroad (Yoon 2019; Rejeb et al. 2020).'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'Blockchain also provides solutions to various potential challenges to medical
    tourism, such as wastage of money, logistics issues, insecure record exchanges
    among stakeholders, and threat to data breach in the inbound (destination) country.
    At the same point, for medical mobility, a lack of access to the patient’s EMR
    not only slows down the healthcare procedures, it can also ruin the reputation
    of the facilitators. With the decentralised record system of blockchain, it ensures
    secure and smooth share of medical data/patient’s personal records without any
    geographical barriers. Patients’ smart contracts withstand the ownership of their
    data and prevention of data breach. Patients can provide authentication and accessibility
    to any healthcare provider across the globe. Another important element of medical
    tourism is insurance and claims. Blockchain technology also takes care of broker-free
    automation of insurance claims and payment process, payment tracking, and the
    audit of bills (Rejeb et al. 2019).


    # 16.9 BLOCKCHAIN TECHNOLOGIES FOR THE MEDICAL TOURISM ECOSYSTEM


    This section discusses the use of blockchain techniques to convey the needed information
    to the respective healthcare professional based on the grounds of cross-border
    data sharing. This section primarily focuses on four characteristics of blockchain,
    namely no-middlemen, data transparency and trust, digitisation and inter-operability,
    and confidentiality, that directly influence medical tourism. Medical tourism
    raised the need for mediators or brokers to connect tourist patients with healthcare
    service providers (Stephano 2019). The patients have to compromise their personal
    information and health data with intermediaries to get facilities such as a visa,
    hospitality, accommodation, travel arrangement, and pre-and post-medical treatment
    (https://www.magazine.medicaltourism.com/article/blockchain-technology-medical-tourism;
    Vyas et al. 2022). The blockchain technology facilitates various value-added services
    such as optimised searching of suitable medical service providers, credible medical
    and non-medical information, connecting patients directly with medical care providers
    (Aghaei et al. 2021), negotiating medical packages, document verification of medical
    professionals, and the patient’s information and health data, inclusive assessment
    of a person’s health, payment settlement through cryptocurrency, minimising transaction
    cost (Connell 2006); and providing secure access and control over their own health
    data. The blockchain technologies protect a patient’s personal data by eliminating
    mediators, ensuring transparency and trust among patients and service providers,
    enhancing digitisation and safeguarding the security of patient data.


    # 16.10 EDGE-AI-EMPOWERED BLOCKCHAIN


    Medical tourism is dependent upon medical data, which has to be privacy critical,
    sensitive, and delay free. Data privacy and security are ensured by blockchain
    technologies, as mentioned in previous sections. At the same time, delays can
    be minimised with inclusion of artificial intelligence-based edge computing.'
  merge: -1
  img_proc: true
- pgno: 251
  md: 'Edge-AI ensures massive decision-making with low latency. At the same time,
    the security at edge devices is ensured through blockchain architecture (Gupta
    et al. 2021). The edge-AI-based blockchain architecture can keep track of patient
    data and its analysis, using distributed databases (Nawaz et al. 2019). Also,
    the edge-AI-empowered blockchain technologies strengthen the Internet of Medical
    Things for monitoring medical data (Dai et al. 2021).


    # ## 16.11 CONCLUSION


    The main reasons for patients to choose medical tourism are limited medical facilities
    and accessibility to healthcare services in their home country; low-cost medical
    treatments in destination countries; ease of mobility; growth of medical services
    worldwide; and access to technology such as edge-AI and blockchain (Vyas 2023).
    However, medical tourism also do have a few issues, such as lack of follow-up
    procedures; cultural and language barriers; fear of organ trafficking, improper
    healthcare infrastructure such as lack of water, hygiene, power supply and limited
    food options; lack of trust of medical tourism due to non-uniform medical procedures,
    rules and regulations, and gaps in the law (Kelley 2013). Hence, with the advent
    of edge-AI-empowered blockchain, medical tourism has great potential to grow as
    a strong market player.


