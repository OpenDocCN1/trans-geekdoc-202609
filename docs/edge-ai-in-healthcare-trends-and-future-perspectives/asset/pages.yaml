    # 15.1 INTRODUCTION


    Insuring people’s health is a major obligation of the healthcare systems, which
    are essential to both healthy societies and people. Such systems have existed
    ever since people began attempting to maintain their health and treat illnesses.
    Donev et al. (2013) assert that there are two fundamental goals for healthcare:
    finding the correct diagnosis and specifying an appropriate course of action.
    In Sweden, a wrong, delayed, or indeterminate diagnosis is the root of 10 to 20%
    of all major injuries treated by healthcare professionals. The emergency room
    is where diagnostic mistakes are most common, and it’s a known stressful place
    to work (Kubota et al. 2016). High patient flow and longer stays are associated
    with higher mortality, decreased patient safety, more misdiagnoses, higher risk
    of comorbidities, and lower patient satisfaction (Chen & Decary 2020). Reporting
    incidents that may have caused or may have seriously injured a patient is referred
    to as “lex Maria”. Cases from the emergency room and primary care make up between
    40 and 50% of total lex Maria registrations (Kubota et al. 2016). AI simply refers
    to the intelligence of machines and the branch of computer science that aims to
    generate it (Boden 1998). AI has the potential to better organise patient flow
    or therapeutic strategies and give doctors virtually all the data they require
    to make intelligent medical and healthcare decisions (Fogel & Kvedar 2018). Healthcare
    is just beginning to undergo a dramatic change as a result of AI, starting with
    the design of treatment strategies and moving through the augmentation of repetitive
    tasks through medication management or drug creation (Ranganath et al. 2014).
    Doctors no longer need to memorise nearly as much information as they did fifty
    years ago. Doctors, nurses, and researchers may now devote more mental energy
    to patient care and higher-level cognitive work, thanks to digital technology
    (Murali & Sivakumaran 2018). AI is prepared to advance this to the next stage.
    “Thinking” time was used to set oneself up for thought, decision-making, and research
    (Shulman & Bostrom 2012). Information was discovered or acquired, not digested,
    far more quickly. To get the data into comparable form, more than a few hours
    of computation were needed. The decision was made quickly when'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'they were in a comparable condition (Ramesh 2004). Digital technologies have
    made it possible to manage complex networks effectively by enhancing factors like
    connectivity, communication, and information flow (Belliger & Krieger 2018). Despite
    these developments in technology, misdiagnosis and missed diagnoses continue to
    plague the field, particularly in the emergency room. AI technology has been demonstrated
    to provide significant advantages in several fields, including healthcare. However,
    it has difficulties in at least three areas: technical, moral, and legal issues
    (Morley 2019). Healthcare AI guarantees patients'' honourable remuneration. Researchers
    must assess comprehensive patient data along with more general aspects to track
    and identify sick and generally healthy people to decide on the best approach
    for customising medicine (Ahmed & Zeeshan 2020). AI has the potential to manage
    a range of patient care functions as well as administrative processes involving
    suppliers, payers, and pharmaceutical companies (Thomas et al. 2020).


    # 15.1.1 Healthcare types, services, sectors


    Medical imaging and (electronic) health records are just two examples of the traditional,
    data-intensive clinical health sectors on which the advances in AI can have a
    significant positive impact. According to WHO (2017), fewer than three nurses
    and midwives are addressed in less than one-half of WHO Member Countries, and
    fewer than one nurse and midwife are reported in less than one-quarter of WHO
    Member Countries. In addition, nurses are more prone to exhaustion, burnout, and
    job discontent as daily working hours exceed ten (Massaro 2017). According to
    another study, nurses reported more decision error reports due to weariness, daytime
    sleepiness, difficulty to recover between shifts, and poor sleep quality than
    nurses who were well rested (Lee et al. 2018; Massaro 2017). According to research,
    the development of AI-supported health information technology would aid nurses
    in multitasking work environments, such as vital sign checking and data gathering,
    prescription management, infectious disease supervision, and other tasks. Nurse
    workloads can be reduced by assigning non-value-added nursing activities and duties
    to others involved in the healthcare delivery process. Nurses'' responsibilities
    will shift, and they''ll spend more time with patients. With the use of technology,
    nurses will deliver healthcare in a more effective and efficient manner (Yen &
    Kelkye 2018)


    # 15.1.2 The insufficiency of the healthcare system


    Global public health has always been deeply concerned with patient safety. A patient
    has a good likelihood of experiencing non-lethal damage while receiving treatment.
    It is one of the key causes of the burden of sickness on the entire planet. Feedback
    provided from patients regarding any inaccuracies also makes it easier for practitioners
    to improve serives (Bell et al. 2017). Innovations in the electronic healthcare
    record decreased the amount of clicking required and streamlined the handling
    of medical data. As a result of spending more time with patients, medical'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'staff burnout has decreased, and patient safety has increased. Adverse occurrences
    not only compromise the health of the patients but also squander a significant
    amount of medical expenditure. With the advancement of machine learning (ML) technology
    and the large amount of medical data related to physiology, behavior, lab testing,
    and medical images, both patients and medical professionals can profit more (Howard
    2019). According to a study by OECD nations, some administrative procedures were
    useless. There is no obvious correlation between health system performance and
    the roughly 14% of health costs that make up administrative costs in OECD nations,
    compared to the 3% global average. This indicates that 11% or so of costs have
    no value. An e-health telemedicine platform system can send the patient’s evaluated
    data from home to a clinic while emphasising homecare assistance and decreasing
    hospital-based expenditure (Massaro & Maritati 2018). The cloud-based electronic
    medical record system significantly improves the integrity of antenatal data and
    makes it possible for outpatient clinics, hospitals, and public health agencies
    to communicate high-quality and comprehensive medical information, supporting
    informed health decisions (Haskew et al. 2015). Additionally, it promotes early
    treatment for HIV patients and closes HIV care gaps in western Kenya (Haskew et
    al. 2015). Based on AI, expert systems can help clinicians, in areas with a shortage
    of medical resources, diagnose patients, develop treatment plans, and even take
    the role of a human doctor if one is not available (Reis et al. 2004).


    # 15.1.3 Artificial Intelligence


    It is stated that the phrase “artificial intelligence” is widely used to describe
    creating systems that have human-like abilities, such as the capacity for reasoning,
    i.e., discovery, generalisation, or learning from prior experience (Honavar 2019;
    Copeland 2020).


    # 15.1.4 Expert system, NLP


    Statistical NLP is based on ML, specifically deep-learning (DL) neural networks,
    and has helped to improve the recognition of accuracy recently (Lee & Logsdon
    2018). The generation, comprehension, and classification of clinical documentation
    and published research are the primary applications of NLP in the field of healthcare.
    NLP systems are able to conduct conversational AI, create reports (for example,
    on radiological examinations), analyse unstructured clinical notes on patients,
    and record patient interactions (Hussain & Malik 2014).


    # 15.1.5 ML-DL


    ML is a technique where a programme trains and learns from data without using
    conventional programming by using mathematical models based on statistics and
    probability. The learning algorithm or software can then be fed unlabeled data
    to create predictions once the labeled data have been utilised as a foundation'
  merge: -1
  img_proc: true
- pgno: 226
  md: '(Bohr & Memarzadeh 2020). The input layer, hidden layer, and output layer are
    the three layers that make up an artificial neural network (ANN). The input layer
    collects the data and sends them to the hidden layer, where mathematical models
    are used to extract patterns. The output layer is where the outcome is produced
    and shown after the data have been processed in the hidden layer (Shahid et al.
    2019). The benefit of ANN is the ability to link and integrate both experimental
    and literature-based data. It can also function with missing information, generalise
    to analogous undiscovered data, and learn with an inductive technique from training
    data (Agatonovic-Kustrin & Beresford 2000). The algorithm can then effectively
    identify a nodule in an image once the system has had enough training. Particularly
    for data like images, audio, and video, DL is adequate (Bohr & Memarzadeh 2020).
    A study that combined data from electric health records (EHRs) and mammograms
    presented a deep-learning-based algorithm for predicting breast cancer. Because
    of its accuracy, the Assuta Medical Center recommended their technique as a backup
    tool for radiologists. To increase the model''s accuracy, the authors of the study
    suggest that more data be included (Habib 2021).


    # 15.1.6 ROBOTICS


    More recently, robots have improved their ability to work cooperatively with people
    and are simpler to teach by having them perform a desired activity. Additionally,
    they are developing greater intelligence as additional AI capabilities are integrated
    into their "brains" (really, their operating systems). It would appear reasonable
    that, over time, physical robots would include the same advances in intelligence
    that we have seen in other branches of AI (Etienne & Harry 2020). Surgical robots
    give surgeons "superpowers", enhancing their vision, capacity to make precise,
    minimally invasive incisions, close wounds, and other surgical procedures. Robots
    can protect the economy and infrastructure, in addition to the medical profession,
    by working for staff of significant businesses like factories, waste management,
    or power generation. A robot named "Mitra" has been created by an Indian business
    called Invento Robotics, Bengaluru, to help patients connect with their loved
    ones (Singh et al. 2021). Medical robots can assist with supported living, social
    contact, assisted surgery, and more. AI-assisted surgical robots are among the
    most frequently utilised medical robots because they can physically direct a surgeon''s
    tool in real time during an operation by analysing data from pre-operative medical
    records (Crawford 2019). Robots have also been employed to deliver medical supplies
    and equipment, assist in the care of the elderly, and aid in the rehabilitation
    of stroke patients (Chen & Decary 2020). It is logical to assume that, someday,
    machines will be able to keep track of a patient''s vital signs and respond appropriately
    when necessary (Weng 2001). Robotic process automation (RPA) primarily uses server-based
    software rather than actual robots (Schaal 1999). They are employed in the healthcare
    industry for routine duties like billing, prior authorisation, and patient record
    updates (Etienne 2020). They can be used to extract data from, say, faxed photographs
    and feed it into'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'transactional systems when paired with other technologies, like image recognition
    (Robert 2019).


    Through incisions, surgeons can execute a variety of surgical procedures, using
    robot-assisted surgical equipment. This kind of surgery can assist in reducing
    pain, blood loss, scars, infections, and post-operative recovery time when compared
    with typical surgical procedures (Hussain 2014). Robotic technology development
    has transformed controlled access surgery by addressing some of the drawbacks
    of the laparoscopic method (Thomas et al. 2020). Robotic systems offer the capabilities
    to increase flexibility and ergonomic performance; they do not, however, replace
    the surgeon or perform tasks independently. They are (a) the master console, which
    has a user port that enables the operator to view a 3D representation of the operating
    area, manipulators for monitoring instruments, and a monitor panel for adjusting
    camera position and focus; and (b) the slave unit, which is mounted on the patient’s
    side and houses the connected instruments and camera and is controlled by robotic
    arms (Singh et al. 2021).


    # 15.2 TRANSFORMATION OF HEALTHCARE


    Life expectancy has increased, as have expectations for healthcare itself, thanks
    to significant advances in scientific understanding, public health, disease prevention,
    healthcare delivery, and technology. We must deliver care that is better, faster,
    and more cost-effective, and we must offer more and better services to more people
    as healthcare prices continue to climb exponentially and outpace GDP growth. According
    to the WHO, there will be a 9.9 million shortage of doctors, nurses, and midwives
    worldwide by 2030 (Sinha & Al Huraimel 2020). Automation and AI have the power
    to completely change the way healthcare is provided, meeting the need for better,
    more cost-effective treatment as well as helping to make up some of the staffing
    shortages. AI can contribute and hasten new biomedical discoveries, diagnosis,
    and therapy access in such a setting (Vyas & Bhargava 2021). The potential for
    AI to transform healthcare holds true for all aspects of the framework, including
    self-care and prevention, triage and diagnosis, clinical decision-making support,
    care delivery in hospitals or at home, chronic care management, population health,
    operational improvement, and advancing healthcare innovation, such as in R&D (Sinha
    & Al Huraimel 2020).


    +   - The initial stage involves designing and developing AI solutions for the
    appropriate challenges, utilising a human-centered AI and experimentation methodology
    while involving the necessary stakeholders, particularly the healthcare consumers
    themselves (Andrews et al. 2011)

    +   - A multidisciplinary team is created with computer and social scientists,
    operational and research mentorship, clinical stakeholders (physicians, caregivers,
    patients), and subject experts (for example, biomedical scientists). The technical,
    strategic, and operational expertise needed to'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'establish issues, objectives, success indicators, and interim milestones is
    brought about by a multi-stakeholder team (Junaid & Usman 2021).


    +   • A human-centred AI strategy integrates AI with an ethnographic understanding
    of healthcare systems. Understanding the main issues through user-designed research
    is the first step. The next stage after defining critical challenges is to determine
    which problems AI can address effectively and whether there are any relevant datasets
    available to create and later evaluate AI (Junaid & Usman 2021).


    +   • The development of new step-wise experiments should be the primary focus,
    with strong feedback effects from stakeholders enabling quick experiential learning
    and gradual modifications. The experiments would enable the simultaneous testing
    of several novel concepts to determine which one works and to discover what works
    and why. The expected end-users and the potential negative and ethical ramifications
    of the AI system for them (for example, data privacy, security, equity, and safety)
    will be clarified through experimentation and feedback (Davahli & Waldemar 2021).


    +   • The predictions made by the AI tool must then be iteratively evaluated and
    validated to see how well the tool is performing. Assessment is based on three
    criteria: statistical validity, clinical utility, and economic utility. Understanding
    the performance of AI on parameters like accuracy, dependability, robustness,
    stability, and calibration is statistical validity (Davahli & Waldemar 2021).


    +   • Based on the patient population unique to that region and environment, many
    AI systems are initially developed to tackle a problem at one healthcare system.
    When scaling up AI systems, deployment methods, model updates, the regulatory
    system, system differences, and the reimbursement environment demand special consideration
    (Nachev & Herron 2019).


    +   • Collecting and analysing the pertinent datasets for AI performance, clinical
    and safety-related concerns, and adverse events requires collaboration between
    healthcare organisations, regulatory agencies, and AI developers (Nachev & Herron
    2019).


    # 15.2.1 CURRENT TRENDS IN HEALTHCARE


    # 15.2.1.1 Prediction of disease “data mining” with AI


    In the age of pervasive technology, data play a crucial role in fostering creativity.
    To extract insights and patterns from huge databases, data mining is used. Patient
    records are collected in vast quantities by the healthcare sector. The healthcare
    industry can handle a variety of disorders before they are manifest by the proper
    analysis of these data, utilising ML methods. Medical records are mined for data
    or decoded to retrieve the information, including voice- and non-voice-based interactions
    between doctors and patients (Mindfields 2018).'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# 15.2.1.2 AI in “medical imaging” for diagnosis


    AI has significantly advanced in the fields of medical imaging and diagnostics
    during the past few years, allowing medical researchers and practitioners to provide
    faultless clinical practice (Vyas 2023). Additionally, AI is enhancing medical
    imaging evaluation to identify conditions like cancer and diabetic retinopathy
    (DR). Recently, General Electric (GE) Healthcare, in comparison with traditional
    cardiac magnetic resonance (MR) scans, has integrated advanced technologies into
    the cardiac assessment process, allowing them to be completed in a fraction of
    the time (Mindfields 2018).


    # 15.2.1.3 AI in “lifestyle management”


    Increased digitalisation makes it possible for people to take control of their
    own comfort and health. The data produced by digitization power future AI technology.
    A start-up company called Fedo just discovered a way to address people’s risks
    for lifestyle diseases. They have created an algorithm for risk classification,
    to determine a person''s risk of seven non-communicable diseases (Jason 2017).


    # 15.2.1.4 AI in “nutrition”


    Nutritional apps can provide personalised recommendations and suggestions based
    on a person''s interests and habits, with the incorporation of AI. The London-based
    start-up VITL uses AI to identify patients'' dietary demands and inadequacies.
    It also offers consumers a personalised diet plan and daily vitamin pack in addition
    to the diagnosis. The start-up uses an AI engine dubbed LANA (Live and Adaptive
    Nutritional Advisor), which makes use of a variety of lifestyle and dietary data
    points, to simulate the reasoning and thought processes of human nutrition experts
    (Jason 2017).


    # 15.2.1.5 AI in emergency room and surgery


    The FDA approved the da Vinci Surgery System as the first surgical robot for general
    use. The newest surgical robots are currently being developed. powered by AI and
    ML. To answer a surgeon''s questions, IBM Watson possesses cutting-edge medical
    cognitive and NLP skills. Additionally, similar AI tools help with real-time blood
    monitoring, recognising the body''s physiological reaction to pain, and helping
    navigation during arthroscopy and open surgery (Nordlinger et al. 2020).


    # 15.2.1.6 AI in hospital information system (HIS)


    Most hospitals and clinics currently use HIS software to manage appointment scheduling,
    treatment follow-up, and other administrative tasks by linking with patient EHRs.
    These systems have significant potential for providing excellent healthcare. Additionally,
    AI in healthcare helps clinicians with real-time predictive analytics and resolves
    operational issues across all hospital activities. Additionally, it eliminates
    paper-based operations, saves staff time, and automates data gathering, analysis,
    reporting, and communication (Nordlinger et al. 2020).'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# 15.2.1.7 AI in research


    Healthcare professionals can now digitally profile patients, thanks to AI. This
    may aid in the understanding of the immune sequence and lead to the development
    of a new class of immunological diagnostics for oncology. Additionally, it is
    being utilised to carry out repeatable research in the fields of genetics, life
    science, and bioinformatics (Nachev & Herron 2019).


    # 15.2.1.8 AI in mental health


    Mental problems are one of the main causes of disability and poor health in our
    society. Some of the most significant advances in AI have recently occurred in
    the field of healthcare, a sector which has been somewhat hesitant to adopt new
    technology, including the early diagnosis of mental health issues. Wysa, an emotionally
    intelligent AI-based penguin created by Touchkin, can chat, listen, and assist
    users in developing mental toughness. Within three months, Wysa has helped 50,000
    individuals overcome mental health issues while carrying out a million talks with
    them. Some of these individuals had attempted suicide, while others suffered from
    PTSD, social anxiety disorder (SAD), depression, or bipolar disorder (Nachev &
    Herron 2019).


    # 15.2.1.9 AI in pharma


    The approach by which pharmaceutical companies develop novel medications is being
    revolutionised by AI. To understand how a medicine may impact a patient’s tissues
    or cells, AI probes biological systems. An AI platform developed by the pharmaceutical
    start-up BERG analyses biological data to track how healthy cells become cancerous.
    The software makes use of nearly 14 trillion data points in a single tissue, as
    well as data from the 2003 Human Genome Project. Through this study, BERG was
    able to create a brand-new cancer medication with the potential to stop this progression
    (Sunarti & Rahman 2021).


    # 15.2.1.10 AI in virtual assistant


    AI and virtual assistants are being developed to support and improve human-like
    interactions and save time and costs. For the 500,000 physicians who use Dragon
    Medical every day for their clinical paperwork, Nuance, a business that has created
    a Medical Virtual Assistant, improves clinical operations. It makes it possible
    for those who use specialist medical terminology to communicate naturally and
    accurately (Sunarti & Rahman 2021).


    # 15.2.1.11 Wearables with AI


    Wearables like smartwatches, clothing, and shoes will become increasingly popular
    soon because of the forthcoming trend in AI applications of miniaturisation. The
    data from a product would be worthless to the user without an AI engine. As a
    result, AI engines are being incorporated into the product''s health solutions
    to gather personal health insights. Therefore, consumers can consult a doctor
    or choose an AI doctor if clinical grade wearable technology detects an issue
    (Sunarti & Rahman 2021).'
  merge: -1
  img_proc: true
- pgno: 231
  md: '# 15.2.2 VIRTUAL AND IN-PERSON SERVICES


    Numerous factors make it possible for doctors in any specialism to gain from integrating
    AI into their daily routines. First, even though medical knowledge is doubling
    every few months and growing tremendously, doctors don’t have enough free time
    to read and keep their knowledge up to speed. AI is a potential “partner” in learning.
    Second, AI can facilitate organisation and the treatment of chronic illnesses
    in many people, particularly because they have more pertinent information from
    several sources, including genetic sequencing and wearable technology (Chang 2020).
    Digital health and medicine are ushering in an era of technological advancements
    that include applications, wearable technology and remote monitoring, telemedicine
    and communication tools, and other diagnostic tools to improve care quality and
    speed-up response times under any circumstance (Banaee et al. 2013). The sensor-based,
    quantifiable, unambiguous, and user-friendly Parkinson’s disease assessment system
    has the potential to displace current qualitative and interpretive human assessments
    (Steven & Topol 2016). The central subjects in AI-enabled data capture and interpretation
    in digital health and medicine are organising, storing, and understanding the
    enormous volumes of data collected by the devices to facilitate acute and chronic
    disease diagnosis and management (Kubota et al. 2016).


    # 15.2.3 ADVANCED PRECISION MEDICINE


    Like other fields, precision medicine is expanding quickly. Initially, the National
    Research Council described the development as based on “a new taxonomy of human
    disease”, via molecular biology, or the start of a healthcare revolution by using
    information from the human genome sequence. Healthcare professionals can now use
    precision medicine to find and communicate data that can either confirm or change
    the course of a medical choice from one that is based on the evidence for the
    average patient to one that is based on the individual’s unique traits (Ziegelstein
    2017). Early disease detection and the development of individualised treatments
    are two examples of how advances in precision medicine have a real-world impact
    on healthcare (Johnson et al. 2021). Genotype-guided therapy is now one of the
    effects of precision medicine on healthcare that has perhaps received the most
    research. Genotype data have been used by clinicians, for example, as a guide
    to assist in establishing the ideal warfarin dose. When precision medicine is
    applied to healthcare, it can produce more accurate diagnoses, identify disease
    risks before symptoms appear, and create specialised treatment regimens that maximize
    efficiency and safety (Haskew et al. 2015). Although AI and precision medicine
    have a lot of potential, more work needs to be done to evaluate, validate, and
    alter current treatment methods. The adoption of unified data formats, such as
    Fast Healthcare Interoperability Resources, the acquiring of enough high-quality
    labeled data for algorithm training, and meeting sociocultural, legal, and regulatory
    standards are hurdles for researchers (Caudle & Klein 2014).'
