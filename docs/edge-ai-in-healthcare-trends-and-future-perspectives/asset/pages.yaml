    # 13.4 DISCUSSION AND FUTURE WORK


    As DL models knowledge from information, profound data comprehension and representation
    are vital to building data-driven intelligent medical cyber-physical systems in
    particular applications. Realistically speaking, evidence comes in various forms:


    +   (i) Images entail vectors, matrices, and tensors, representing pixels, voxels,
    depth, and deformations, which are essential traits or fundamental parameters
    in MI. The first category can represent MI in 1D, 2D, 3D, 4D, and even higher-dimensional
    tensors if one considers hyperspectral images.


    +   (ii) Sequential data are records where the order is relevant, i.e., a collection
    of sequences like text, streaming, audio fragments, video clips, and time-series
    data. The successive nature of input data must be accounted for while building
    a model.


    +   (iii) Tabular datasets hold columnar information as in a database table. Each
    field (column) must include a name. Each column only has a defined data type.
    It is a logically organised data arrangement, encompassing rows and columns, built
    on information properties or features. DL models can learn effectively on tabular
    data and permit one to craft data-driven intelligent systems.


    DL typically depends on big data(BD) to foster a data-driven model aimed at a
    certain condition. Scarce data hinder DL algorithms, but this caveat can be circumvented
    via pre-processing steps, such as data augmentation and meta-heuristics. A Graphical
    Processing Unit (GPU) works mostly to optimise the'
  merge: -1
