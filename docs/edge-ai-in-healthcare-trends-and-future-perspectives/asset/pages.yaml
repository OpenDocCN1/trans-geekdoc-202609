- pgno: 7
  md: '# Preface


    *Edge-AI in Healthcare: Trends and Future Perspectives* is an inclusive guide
    to the edge-Artificial Intelligence concept, with the emphasis on healthcare.


    The purpose of this book is to make readers aware of the concepts and issues in
    edge-AI and the future developments of edge-AI with machine learning, deep learning,
    IoT, and blockchain. The organisation of the book covers the explanation of complex
    issues in a fairly easy-to-understand manner.


    The book comprises 17 chapters and covers various facets of edge-AI, enhancing
    access of the visually impaired through the smart cane, an automated wheelchair
    for the physically challenged, intrusion detection in healthcare IoT, human mental
    experience through Chatbot, early diagnosis of cardiac disease, super-resolution
    in medical imaging applications, and medical tourism.


    The book begins (Chapter 1) with an introduction to the edge-AI concept in healthcare,
    while Chapter 2 discusses the different edge-AI tools and techniques for healthcare.
    In addition, different machine-learning and deep-learning approaches to edge-AI
    are highlighted in Chapters 3 and 4, respectively. Further chapters include case-specific
    problem statements and address different edge-AI solutions, such as support for
    the visually impaired through the development of the Smart Cane, authentication
    of the edge-AI-based Smart Health Care System, development of an automated wheelchair
    for the physically challenged with AIoT modules, early diagnosis of cardiac disease
    using feature optimisation, and solution to intrusion detection and stroke prediction.
    The chapters in the latter half of the book highlight the contemporary role of
    edge-AI in IoT and IoE in healthcare and digital marketing. The last few chapters
    cover the human mental experience through Chatbot, and human engagement with evidence-based
    cognitive-behavioural techniques. The book concludes with legal and ethical implications
    of an edge-AI-enabled IoT healthcare monitoring system and the use of blockchain
    for edge-AI.'
