  md: '![](img/28baab106dba0e70a2f26ab75f61f184_114_0.png)


    # FIGURE 8.5 The embedded systems whitebox perspective (Sun et al. 2021).


    network technology. Information technology involves a program which will be installed
    on your phone, which receives the data. In accordance with the information, it
    receives your GPS coordinates and the app will start the air conditioning. A simple
    IT infrastructure serves as the basis for mobile apps.


    Internet of Thing = IT + ET + NT


    For example, consider that, in your house, you have a smart air conditioning unit
    that is connected to the internet. This “object” is internet-connected. Imagine
    that you have just returned from work on a scorching summer day. When you enter
    your home, you want it to be cool enough. As a result, you might utilise a mobile
    device to switch on your home’s air conditioning when you return home from work.
    Additionally, when you leave the office, your phone will send a notification to
    your home’s air conditioner. This scenario is plausible, given that your phone
    can track your GPS locations, detect your movement, and control the air conditioning
    based on the temperature outdoors. You will receive an alert on your phone only
    when the air conditioning is on.


    # 8.7 FUTURE OF INDUSTRY 4.0: SMART WHEELCHAIR WITH AIOT


    The development of a low-cost smart wheelchair seeks to combine a health-monitoring
    system powered by a microcontroller with a standard wheelchair,'
