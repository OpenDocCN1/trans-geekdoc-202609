  md: '# 15.2.4 REMOTE MONITORING


    Remote patient monitoring satisfies the desire to observe the signals and actions
    of those with chronic illnesses, who are susceptible to acute symptoms. The patient
    benefits from better treatment, certainty that sudden health attacks are being
    tracked, and a decrease in hospital visits. Real-time and ongoing symptom monitoring,
    early illness identification or prevention, lower healthcare expenses, more knowledge
    about health concerns, and finally, more opportunities for service and emergency
    medical care are just a few of the benefits of doing remote monitoring (Vegesna
    & Melody 2017; Malasinghe et al. 2019).


    As Figure 15.1 indicates, remote patient monitoring can benefit a range of medical
    problems, including diabetes, cardiovascular disease, and neurological illnesses,
    by lowering mortality, preventing hospitalisation, and delivering better care
    and services (Klersy & Annalisa 2009). Lack of monitoring after treatment episodes
    is likely to raise the risk of readmission as well as morbidity for persons with
    heart failure. Compared with professional visits in person, remote patient monitoring
    is a more affordable option. ECG, blood pressure, heart rate, and weight measures
    are frequently combined with telephone monitoring and consultations to form the
    monitoring process. Some of these rely on telemonitoring, whereas others rely
    on videoconferencing or monitoring and interventions using mobile phones (Jeddì
    & Bohr 2020).


    ![](img/28baab106dba0e70a2f26ab75f61f184_232_0.png)


    FIGURE 15.1 Remote patient monitoring.'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# 15.2.5 AI ADAPTATION


    AI comprises systems that can analyse patterns in unstructured data. Production,
    marketing, supply chain, human resources, and financial choices are made in SMEs.
    AI employs algorithms to analyze both organized and unstructured data collections.
    Studies from the past confirm that AI technologies enhance organisational effectiveness
    and efficiency. Small- and medium-sized businesses are the backbone of the nation''s
    economy, yet they fall far behind in the use of AI. The effects of AI adaptability
    have been the subject of extensive investigation in the past. However, because
    SMEs operate in various environments, generalised findings cannot be applied to
    them (Ingalagi et al. 2021).


    # 15.3 ML/DL IN HEALTHCARE


    Numerous health-related applications of ML solutions include helping clinicians
    find various patient-specific medications and treatments, as well as helping patients
    determine when or whether they need to schedule follow-up consultations (Bhardwajet
    al. 2017). There is currently a vast amount of information available in the healthcare
    industry. It includes elctronic medical records (EMRs) that are made up of information,
    both structured and unstructured. Most of the medical information is as unstructured
    data; among the many different types are fully diverse auditory, visual, and musical
    notes; records, reports, and summaries of discharge. A conversation between a
    provider and a patient is very difficult to quantify and analyse because it is
    very individualised and could go in a lot of different directions (Hauskrecht
    2010; Shailaja & Jabbar 2019).


    # 15.3.1 DIFFERENT TECHNIQUES USED BY ML


    +   - Support vector machine (SVM). With this technique, a variety of training
    samples are provided, and each sample is broken down into various categories.
    SVMs are typically employed to solve classification and regression issues (Sukanya
    & Kumar 2017).

    +   - Naive Bayes classification. The best illustration of a Bayesian classifier
    is a statistical classifier. Based on a given class label, Naive Bayes calculates
    the probabilities of class membership. Data are scanned just once, making classification
    simple (Hazra et al. 2016).

    +   - Decision tree. The decision tree (DT), which has one interior node and one
    leaf node with a class label, is the most-used strategy for classification. The
    decision tree''s root nodes are the highest nodes. The creation of the decision
    tree is fairly straightforward and doesn''t require any parameters, making it
    quite popular (Hazra et al. 2016).

    +   - K-nearest neighbor. The K-nearest neighbour method is a popular one for
    classifying samples. This method allows us to calculate the distance measure,
    using N training samples (Yadav 2019).'
  merge: -1
  img_proc: true
- pgno: 234
  md: '+   - **Fuzzy logic.** Fuzzy set theory gives rise to fuzzy logic. These numbers
    fall between 0 and 1. It is a technique that is frequently utilised in engineering
    applications (Yadav 2019).


    +   - **Classification and regression tree methodology (CART).** The goal variable
    is expressed as a continuous and categorical variable in classification and regression
    trees. To forecast values in the tree, these variables are needed (Shailaja 2019).


    # ### 15.3.2 DEEP-LEARNING ARCHITECTURES IN THE HEALTHCARE SECTOR


    +   - **Neural Network.** Nodes make up the layers in neural networks. A node
    is a location where processing takes place and is loosely modeled after a neuron
    in the human brain. Nodes fire when they receive enough stimuli. A node will provide
    significant inputs in relation to the method it is trying to learn by combining
    input from the data with weights that can either amplify or dampen the input (Manne
    & Kantheti 2021).


    +   - **Convolutional Neural Network (CNN).** CNNs are used to classify, segment,
    and recognise images. CNNs’ primary responsibilities include classifying visual
    content, recognising items that are fed into it, and grouping the detected objects
    into clusters. CNNs use subsampling after relying on connections and weights among
    the units. One convolutional layer, a pooling layer, and occasionally fully linked
    layers for supervised prediction make up the fundamental components of CNN architecture
    (Manne & Kantheti 2021).


    +   - **Input layer.** The image’s data should be in the CNN’s input layer. Images
    are nothing more than three-dimensional matrices that must first be converted
    into a single column before being submitted. Each layer’s output will be fed into
    the one below it (Murali & Sivakumaran 2018).


    +   - **Convolutional layer.** The activity starts in the convolutional layer.
    This layer describes the characteristics of a picture, such as color, shape, and
    object elements, etc. The ReLu layer is a CNN extension layer. This layer increases
    the nonlinearity of the image. At this layer, improved feature extraction is accomplished.
    Following the convolutional layer, the pooling layer lowers the spatial volume
    of the input image (Murali & Sivakumaran 2018).


    +   - **Fully connected layer.** Weights, neurons, and biases are all present
    in this layer.Using completely connected layers, neurons in one layer are connected
    to neurons in another layer. At this layer, categories are created for images
    using training data (Samyuktha & Geetha 2020)


    +   - **Output layer.** The fully connected (FC) layer is just below the Softmax
    layer, which is utilised for binary classification. CNN is used in the healthcare
    industry for medical image analysis. Using CNN for medical image classification,
    it is possible to precisely identify anomalies in MRI and X-ray pictures (Samyuktha
    & Geetha 2020)'
  merge: -1
  img_proc: true
