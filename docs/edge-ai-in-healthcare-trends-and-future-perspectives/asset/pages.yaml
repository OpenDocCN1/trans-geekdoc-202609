    # 17.1 INTRODUCTION


    Bandwidth constraints, unstable networks, and latency problems can have a negative
    impact on results when processing healthcare and life science data remotely. When
    timing is crucial, such delays can be critical. Innovative healthcare companies
    are implementing edge computing, which allow data to be examined and used right
    away, to allay these worries. By bringing data processing and storage closer to
    the point of origin and giving clinical and research teams access to real-time
    insights, AI-powered instruments, medical devices, and edge technologies are revolutionising
    healthcare and the life sciences. On-demand insights support teams in making critical
    choices concerning patients, which is crucial for the delivery of healthcare (Vyas
    & Gupta 2022). The use of edge-AI computing has become popular in recent years.
    In 2020, the market was already worth US$9 billion and, by 2030, it was expected
    to reach US$60 billion (Allied Market Research).


    Edge-AI outperforms the more prevalent cloud AI as a solution. The numerous advantages
    it offers serve to highlight its superiority. Consider real-time data'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'analysis as an example. Edge-AI performs local data analysis. Because the data
    do not need to be sent to the cloud, there is less latency, allowing for real-time
    decision-making. This skill may be essential for factory robots, self-driving
    automobiles, and other devices. In comparison with cloud AI, edge-AI can result
    in significantly lower costs for data communication because it doesn''t require
    a connection. The same holds true for energy usage. This makes it possible to
    develop better wearable technology, which has a lot of potential for application
    in hospitals. Additionally, this has a privacy concept. There is less privacy
    risk because most of the data remains on the premises. Because data is transmitted
    and stored in the cloud with cloud AI, vulnerabilities may arise (Gundi 2022).


    The goal of edge computing, which has become a popular computing paradigm, is
    to reduce the time for data transfer between end users and the cloud. The low
    latency provided by edge computing benefits a variety of artificial intelligence
    applications.


    # 17.2 APPLICATION OF EDGE-AI IN THE HEALTHCARE SECTOR


    The contemporary healthcare sector is being shaped in part by edge computing.
    Adopting edge-AI has numerous advantages, as was already mentioned. It may be
    crucial in the healthcare sector for both patients and healthcare professionals.
    Some of the strong arguments that make edge-AI the obvious choice for this sector
    are described in the following sub-sections.


    # 17.2.1 AUTONOMOUS HOSPITAL ROOM MONITORING


    The ability to automate processes is one of AI''s main selling points in general.
    A wide range of sensors can be used to gather data that AI systems can then analyse
    to determine the best course of action. Edge-AI takes this to the next level.
    It provides autonomous monitoring of hospital rooms and patients by utilising
    computer vision and data from other sensors.


    # 17.2.2 NEW RADIOLOGY APPLICATIONS


    The DICOM (Digital Imaging and Communications) images used in radiology are quite
    huge. Therefore, sending these photos to the cloud or a central server for processing
    and receiving the machine-learning inference can be quite expensive and time consuming.
    However, edge-AI makes it possible for the analysis to take place locally, which
    results in a considerably quicker diagnosis.


    # 17.2.3 RURAL HEALTH


    Providing high-quality healthcare in isolated rural regions has always been a
    difficulty. Despite developments in telemedicine and more freely available health
    information, medical professionals still struggle to provide quick, high-quality
    care to patients who reside far from hospitals and have a limited internet connection.
    Due to connectivity constraints, standard healthcare databases face'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'significant obstacles, but the combination of edge computing applications and
    IoT medical devices made it easier to overcome such obstacles. Medical workers
    can access vital patient information, even in areas with poor connectivity, thanks
    to IoT healthcare equipment, which can increase the reach of existing networks
    (Kamruzzaman et al. 2022).


    # 17.3 RELEVANT WORK


    Due to issues with speed, cost, and privacy, advancing the AI frontier to the
    edge ecosystem that exists at the last mile of the internet is extremely difficult.
    When compared with the conventional cloud-based computing paradigm, the physical
    proximity of the sources for computing and information generation promises several
    advantages, such as context awareness, low latency, energy efficiency, and privacy
    protection (Zhou et al. 2019). In contrast to AI, which aims to imitate intelligent
    human behavior in devices and computers through learning from data, edge computing
    aims to organise many collaborating edge devices and servers to process the generated
    data locally. Pushing AI to the edge offers additional benefits to one another
    in addition to the benefits of edge computing generally. Edge intelligence may
    function in a cloud-edge-device coordination manner via data offloading rather
    than implying that the AI model is fully trained or inferred at the edge. Figure
    17.1 illustrates how data dumping volume and path length reduce as edge intelligence
    increases.


    The industrial, government, and healthcare groups are devoting a lot of consideration
    to the development of smart sensors, artificial intelligence, and edge analytics
    with the integration of cloud computing and their linkage with healthcare. For
    this analysis, several studies that were recently published – between 2016 and
    2021 – were chosen. The objective of a study conducted by researchers S. U. Amin
    and M. S. Hossain was to analyse the most recent and innovative edge computing
    frameworks. The objective of this chapter is to thoroughly investigate


