    # 9.5 CLASSIFICATION ALGORITHMS


    Logistic regression. This is a component of several machine-learning algorithms
    that are employed in the solution of classification issues. It works on the principles
    of the famous mathematical concept of probability. The main point that distinguishes
    a linear and a logistic regression model is that logistic regression model uses
    a more complex cost function, i.e., the ''sigmoid function''. According to the
    hypothesis, the result of the cost function in logistic regression is between
    0 and 1. It provides various measures, such as accuracy, F1 score, precision,
    recall, confusion matrix, etc. (Anbuselvan 2020).


    K-nearest neighbor. This is a part of various supervised machine-learning algorithms
    used in solving problems related to regression and classification (Limbitote et
    al. 2020). Here, ‘K’ means the number of nearest neighbors. In this, mathematical
    equations like Manhattan distance, Euclidean distance, etc., are used for calculating
    least-distant ‘k’ points. When training data are supplied to this algorithm, the
    algorithm does not train itself at all. It memorises the training dataset, which
    is a much better approach than learning a function from the training data (Kumar
    et al. 2020; Vyas 2023).


    Decision tree. This resides in the category of supervised machine-learning algorithms
    (Rakshit & Shrestha 2021). Being a tree-structured classifier, decision trees
    are among the most significant methods used to handle high-dimensional'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'data (Sudha et al. 2012). It is used to build a training model which can evaluate
    the target variable accurately just by learning some easy rules achieved using
    the training data (Shah & Bharti 2020; Sudha et al. 2012).


    *Random forest classifier.* This comes under the classification of a supervised
    machine-learning algorithm. Being a combination of numerous decision trees, it
    is used in solving regression and classification problems. Bagging is used to
    train the forest produced by the random forest algorithm. Bagging is basically
    an ensemble meta-algorithm that is used for increasing the accuracy of algorithms.
    This algorithm predicts by taking the mean of the output from various decision
    trees. The accuracy varies in accordance with the number of decision trees: the
    more decision trees, the greater the accuracy (D’Agostino et al. 2008).


    *Naïve Bayes.* Naïve Bayes classifiers are grouped under the classification of
    machine-learning algorithms. It is based on the well-known Bayes’ Theorem; all
    these algorithms work under the same philosophy that each set of features that
    is being sorted doesn’t depend on the others (Rajdhan et al. 2020; Sudha et al.
    2012)


    *Support vector machine.* This belongs to the category of algorithms for supervised
    machine learning. Its primary usage lies in solving regression problems. The main
    idea behind using this algorithm is plotting a decision boundary so that the n-dimensional
    space can be separated into classes. Such a boundary is referred to as a hyperplane.
    The algorithm basically selects the extreme points (support vectors) which assist
    in making the hyperplane. This is the reason the algorithm has been termed the
    support vector Machine (Kumar et al. 2020; Lumley et al. 2002).


    *XGBoost.* Extreme gradient boosting, also known as XGBoost, falls under the category
    of ensemble machine-learning techniques. Using the decision tree as a foundation,
    it performs particularly well with small- to medium-sized tabular data. It’s frequently
    used in solving problems related to regression, classification, ranking, and user-defined
    prediction (Horn & Horn 1986).


    *MLP Classifier.* Multilayer perceptron (MLP) is an addition to the feed-forward
    neural network (Sudha et al. 2012). It comprises three layers. The first one is
    the input layer which absorbs the input signal for its processing. The second
    is the output layer which performs activities such as classification and prediction.
    The third is the hidden layer that controls the movement of data in a forward
    direction (data flow from input to output layer) (Bergstra et al. 2011). The neurons
    present in the MLP are trained by the help of an algorithm, named the “Back-propagation
    learning algorithm”. Pattern recognition, prediction, classification, and approximation
    are its main uses.


    *Convolutional neural network (CNN).* This is a type of artificial neural network
    that is used to process images. CNN comprises three major types of layers, namely
    the pooling layers, convolutional layers, and the fully connected layers. Stacking
    all these layers forms a CNN architecture, using a special technique known as
    convolution (Oh et al. 2019; Katz et al. 1963).


    *Long short-term memory.* It is a type of recurrent neural network. It is used
    to process single data points (such as images) in addition to full sequences of
    data'
  merge: -1
  img_proc: true
