    # ### 13.2.2 Fast SRCNN (FSRCNN)


    The upgraded SRCNN version is the fast SRCNN (FSRCNN). The HR reconstruction speed
    increases in FSRCNN, the structure of which consists of five elements: feature
    extraction, shrinking, mapping, expanding, and de-convolution. Figure 13.2 shows
    the FSRCNN structure. Not enlarging the input image size improves the speed and
    reduces computation.


    # ### 13.2.3 VERY DEEP SR CONVOLUTIONAL NETWORKS (VDSR)


    VDSR reveals extra improvements in SR performance. Higher-depth networks influence
    convergence significantly. Learning residuals are better since LR and HR images
    convey more information, improving performance and speed as shown in Figure 13.3.


    # ### 13.2.4 DEEPLY RECURSIVE CONVOLUTIONAL NETWORKS (DRCN)


    DRCN gives SR reconstruction with deep recursive layers. Depth might improve performance;
    paradoxically, convolution layers prevent an increase in parameters. The reconstruction
    results from weighing the average fallouts from the recursive convolution layers.
    The DRCN network structure from Figure 13.4 represents the SR for MRI and was
    conducted by Fiat (2001) to achieve the following:


    +   (1) For a 2D image from a 3D slice of 3D/4D MRI, the in-plane enhancement
    of the resolution (Holden 2000; Malczewski 2008) provides a solution for resolution
    information that is missed (cf. Table 13.2); and

    +   (2) Among several 3D/4D MRI slices, the through-plane resolution enhancement
    (Jiang 2007; Rousseau 2005) eliminates alias and reduces the slice depth. In comparison,
    the in-plane resolution for multiple slice 2d acquisitions is higher than the
    through-plane resolutions for 3D acquisitions.


    # ### 13.3 DL-BASED SR METHODS


    MI processing uses DL-based SR to produce high spatial and high-quality resolution
    images without extra scans. CNN-reliant SR applies to MI, for example, retinal
    images (Reeth 2012; Zhang 2019) and MRIs (Pham 2017; Chaudhari 2020), due to rapid
    DL development. The studies in Pham (2017, 2019) utilised SRCNN for brain MRI
    analysis (Deshpande and Patavardhan 2016a, 2016b, 2016c). An SR network for brain
    MRIs, inspired by a densely connected network (Mahapatra 2018), was reported by
    Chen (2018). Fast SR for retina images and efficient SR for knee MRIs appear in
    Mahapatra (2018), using the network with the same structure, with three SRCNN
    hidden layers and a convolutional layer of sub-pixels'
