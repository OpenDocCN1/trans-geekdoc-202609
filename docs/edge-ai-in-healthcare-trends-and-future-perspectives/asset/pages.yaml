    ```


    Here, ‘j’ is the dimension. If male of ‘i’ is selected for mating, then \(SU_i=1\),
    otherwise \(SU_i=0\).


    \(N_R\) represents the resident males in a pride, \(\chi\) is a random number
    with a uniform distribution with mean value is 0.5, and standard deviation is
    0.1.


    By mating, the lion algorithm shares the data between genders, while the new cubs
    acquire characters from the two parents.


    **Step 6: Updating using PSO.** To enhance the performance of the lion optimisation
    algorithm, the position of each lion is further updated, using the PSO algorithm.
    The position of each lion is updated in the search space using 12.14.


    ```

    \(LP_i^{New} = LP_i + V_i^{New} \quad \text{(12.14)}\)

    ```


    ```

    \(V_i^{new} = V_i + \phi_1.r_1.(pbest_i - LP_i) + \phi_2.r_2.(gbest_i - LP_i)
