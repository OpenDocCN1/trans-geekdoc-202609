  md: '# 12.5 CONCLUSION


    Heart disease is one of the leading causes of death worldwide. Predicting heart
    disease at an early stage is a challenging task for physicians, clinicians, and
    scientists. In this study, cardiac image-based automatic heart disease diagnostic
    systems, using deep neural networks, have been discussed. The proposed approach
    largely involves two stages, namely feature selection using LPSO and classification
    using DNN. The mathematical expression of both the classification and feature
    selection stages is clearly illustrated. The performance and error rate of the
    classification system are evaluated. The results show that the effectiveness of
    the proposed LPSO+DNN approach is superior to that of other methods. The proposed
    in-depth learning model predicts all types of heart diseases with accuracy. This
    model provides accurate results and helps with patients being prescribed the correct
    meditation. More research needs to be done to broaden the results to different
    approaches.


