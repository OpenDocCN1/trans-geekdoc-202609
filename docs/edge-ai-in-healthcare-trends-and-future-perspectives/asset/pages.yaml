    # 2.9 MACHINE LEARNING AND IOT IN HEALTHCARE FRAMEWORKS


    Machine Learning (ML) has been used by a variety of researchers all around the
    world for a variety of applications and areas. Machine learning has recently attracted
    the interest of researchers in the healthcare IoT. ML is a phenomenon in the field
    of artificial intelligence. ML allows a machine to automatically analyse and interpret
    a set of inputs as an experience without the need for any further assistance (Amin
    et al. 2019; Qadri et al. 2020). In recent years, machine-learning algorithms
    have become popular in healthcare applications. To improve medical applications,
    some clinical decision-support systems use machine-learning techniques to create
    advanced learning models. These models are used in many cancer classification
    applications to enable accurate cancer type detection. These algorithms analyse
    data collected from sensor devices and other data sources and identify patient
    behavioral tendencies and health problems (Tuli et al. 2020). Machine learning
    is gaining in popularity by using IoT-based smart sensors to diagnose and predict
    cardiac arrest in patients with heart disease. For patients with heart disease,
    ECG data are continuously monitored, noise is filtered out, and then the data
    are sent to a machine-learning algorithm for feature extraction (Qadri et al.
    2020). Using edge and cloud computing architectures, ML has been used to detect
    patient falls. Researchers in the AI field use ML to track patient sleep patterns.
    A multimodal dataset consisting of electrocardiogram (EEG), elektrokardiogram
    (EKG), or electrooculogram (EOG) is used to analyse sleep patterns. With advances
    in prostheses, ML is currently being utilised for post-accident and injury assistance.
    It is also used to recognize and classify emotions, enabling robots to recognize
    human emotions (Hossain & Muhammad 2016). This allows people to control the robot
    with their own mind without doing anything. As a result, machine learning-based
    healthcare solutions are being deployed to help patients with severe disabilities
    lead a normal life.'
