    requires minor changes (Nguyen Gia et al. 2020). For such, healthcare providers
    can utilise the existing monitoring tools, such as temperature monitors, to identify
    irregularities in patient physical behavior (Rathi et al. 2021). The essence is
    that such data will be transmitted to a linked hospital, allowing it to start
    treatment immediately (Rathi et al. 2021). This would be very helpful in stopping
    the disease’s impact and further spread on a large scale. The question arises
    of how such edge-AI works.


    The AI-enabled Internet of Things (IoT) is a highly regarded technology tool that
    provides a way to integrate different electronic gadgets (Sodhro & Zahid 2021).
    The gadgets have the ability to communicate and collect data while also causing
    other devices to take appropriate actions (Sodhro & Zahid 2021). It has numerous
    uses in various industries, including agriculture (Gupta et al. 2020), manufacturing
    (Wan et al. 2021), and inventory management (Oosthuizen et al. 2021). Numerous
    sensors may be used in the healthcare industry to gather information about a patient’s
    health (including images of the patient), and, when necessary, an emergency reaction
    can be initiated (Zhu et al. 2019). It is reasonably simple to check someone’s
    health remotely and offer aid with these gadgets (Rathi et al. 2021). The IoT
    and AI-built smart technologies have shown to be incredibly beneficial in the
    healthcare industry (Rathi et al. 2021). Edge-enabled IoT, in which a sizable
    portion of sensing and IoT applications link to deliver various services to the
    healthcare industry, has the potential to treat chronic illnesses by diagnosing
    and detecting conditions at earlier stages to enable convenient cures (Verma &
    Fatima 2020). Additionally, the associated medical expenses decrease (Verma &
    Fatima 2020). Hence, edge-AI and IoT convergence can categorise and cluster an
    enormous volume of IoT data, predict outcomes, and provide preliminary insights.
    This might deal with the anticipated pandemics and provide fast and effective
    solutions.


    Nevertheless, there remain legal and regulatory challenges when it comes to edge-AI
    implementation in healthcare, mainly in terms of consumer protection, data protection,
    intellectual property, cybersecurity, and liabilities. Hence, this chapter evaluates
    the existing legal and regulatory challenges of an edge-AI-enabled IoT healthcare
    monitoring system and provides insights that can make both theoretical and practical
    contributions to ensure the timeliness of the technology in healthcare. Therefore,
    this study possesses the potential to greatly impact upon the policy-making process
    in strengthening the health infrastructure through comprehensive legal and regulatory
    considerations.


    # **14.2 ETHICAL DEBATE ON EDGE-AI-ENABLED IOT HEALTHCARE MONITORING SYSTEMS**


    The use of AI for decision-making in the medical field will have a significant
    impact in the future on how diagnoses and treatments are carried out. In fact,
    some individuals now view AI as a co-diagnostic partner with doctors (Yin et al.
    2021). Nevertheless, AI may even create a new medical standard (Savadjiev'
