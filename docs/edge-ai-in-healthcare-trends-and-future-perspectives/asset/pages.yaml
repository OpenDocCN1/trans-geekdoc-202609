    peak productivity in the next ten years. The benefits of edge computing in bridging
    the concluding mile of AI have been confirmed by several significant businesses
    and technological pioneers, including Google, Microsoft, IBM, and Intel (Chopra
    & Whig 2022). Deep-learning applications need more than the cloud to run due to
    the tremendous benefits of deep learning in the disciplines of computer vision
