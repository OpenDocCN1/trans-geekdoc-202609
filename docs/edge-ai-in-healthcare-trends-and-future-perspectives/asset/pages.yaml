- pgno: 118
  md: 'between people who are present nearby. Instead of actively emitting energy
    into the environment, the sensor passively absorbs it by detecting infrared light.
    The pyroelectric device sends out a warning when the infrared radiation of any
    living object (or a hot particle) impacts on the optical system. The OCTIOT microwave
    (MW) sensor can be employed in these types of situations. This sensor can identify
    human presence over a small space to preserve social distance. Security is one
    of the main applications for the PIR system. PIR sensors detect the presence of
    people and animals via bodily heat radiation. This might be utilised for activities
    like recording video or unlocking doors, among others. PIR sensors are frequently
    utilised because of how little electricity they use. Because of all its advantages,
    the OCTIOT sensor is a very practical and reliable option for adding to the Smart
    Wheelchair.


    # 8.9.2 EERG HEADSETS AND ROBOTIC ARM MODULE


    The need for a brain-controlled wheelchair is necessary for those who are incapable
    of utilising a motorised wheelchair because of various cognitive shortcomings,
    i.e., motor issues, sensory issues, etc. For accurate recording of readings and
    signal interpretation, conductive gel must be applied to the skin around the electrodes
    of electroencephalography (EEG) sensors. EEG is an example of a technique for
    measuring brain activity. EEG is a tool used to capture the electrical activity
    generated by brain neurons firing along the scalp. With the aid of several electrodes
    on the head, EEG is the recording of the electrical activity of the brain over
    a short period of time. Additionally, the program has access to these data on
    the cloud (Huang et al. 2012). The creation of EEG is a function of the neurons.
    When the potential generated by neurons travels through nerve fibers, neurotransmitters
    are formed. The benefit of using a portable EEG brainwave headset is that it uses
    dry active sensor technology to read brain electric activity.


    An electroencephalogram is a visual representation of brain activity. Since EEG
    signals are a mirror of person-dependent inner mental activity, they are private
    and difficult to mimic. The information generated is highly confidential since
    brain activity is closely associated with a person''s stress and mood (Abiyev
    et al. 2016). The EEG signal serves as a representation of the number of signals
    that the brain outputs (Mtshali & Khubisa 2019). It is possible to take a non-invasive
    measurement using scalp electrodes. Such electrical activities originate from
    neurons when they work as a part of the nervous system. These four impulses can
    be retrieved by the EEG and processed later. A wheelchair, with an EEG installed
    on top, is shown in Figure 8.8. Figure 8.9 illustrates the functioning of the
    brain-computer interface (BCI). The signal processing and the process of extracting
    features from the BCI after signal acquisition work to detect movement direction.
    Once a direction has been selected, the control actions are engaged, ordering
    the robotic arm to move in one of four directions, i.e., right, left, up, or down,
    enabling it to grab real-world tangible objects.'
