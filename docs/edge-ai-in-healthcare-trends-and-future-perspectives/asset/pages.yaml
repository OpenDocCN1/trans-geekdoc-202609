  md: 'where \( b_p \) is the bias of \( p^{th} \), the hidden node, \( W_{ij} \)
    is the interconnection weight between the \( (n-1)^{th} \) hidden layer and the
    \( (n)^{th} \) hidden layer with \( K \) hidden nodes.


    The activation function, which is the output of the \( n^{th} \) hidden layer,
    is given as:


    \( F\left(C_{H_{-n}}(i)\right) = \frac{1}{(1 + e^{-C_{H_{-n}}(i)})} \quad (12.19)
    \)


    Step 8: At the output layer, the output of \( n^h \), the hidden layer, is again
    multiplied with the interconnection weights (i.e., weight between the \( n^{th}
    \) hidden layer and the output layer) and then summed up with the bias (\( b_q
    \)) as:


    \( C(k) = F\left( \sum_{j=1}^{K} W_{jk}^o f\left(C_{H_{-y}}(j)\right) + b_q \right)
    \quad (12.20) \)


    where \( W_{jk} \) represents the interconnection weight at the \( n^{th} \) hidden
    layer and the output layer having \( j^{th} \) and \( k^{th} \) nodes, respectively.
    The activation function at the output layer acts as the output of the whole model.


    Step 9: After the output calculation, the network error is calculated. The error
    calculation is given in equation (12.21).


    \( \text{Error}(m) = \frac{1}{M} \sum_{m=1}^{M} \left(\text{Actual}(C_m) - \text{Target}(C_m)\right)^2
    \quad (12.21) \)


    where Target \( (C_m) \) is the estimated network output and Actual \( (C_m) \)
    is the actual output. The error must be minimised for obtaining the optimal network
    structure. Hence, the weighting values must be adjusted until the error decreases
    at each iteration. By calculating this error function, input features of patients
    are classified as either normal or abnormal. In this approach, the value of 1
    is set as a target for classifying normal data, and 0 is set as a target for classifying
    abnormal data.


