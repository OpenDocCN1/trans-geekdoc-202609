    # 1.3 EDGE-AI TOOLS AND TECHNIQUES FOR HEALTHCARE


    # 1.3.1 TOOLS AND TECHNIQUES OF EDGE-AI


    Traditionally, AI solutions were cloud-driven due to the high demand for high-quality
    hardware able to execute deep learning, computing jobs, and the ability to scale-up
    the resources in the cloud. But there are certain limitations to the cloud, which
    could be obviated by the need to move computing tasks closer to the data generation
    site, i.e., to the edge of the network. The impact of AI and its applications
    to various industries all over the globe have significantly improved. Today, numerous
    applications make use of AI, which raise the technical requirements of the data
    center, generating high costs. The cloud may not always be a feasible option.
    This ushers in the need for cloud computing which helps minimise service delivery
    latency and yields the required computing power. In today’s data-centric landscape,
    cloud computing is being used in almost every field to match the growing data
    needs of the corporate world, becoming an integral part of AI. Edge-AI is an amalgamation
    of edge computing and AI, which uses machine learning to deploy intelligent solutions
    on hardware devices and which has innumerable potential uses.


    Edge computing comprises numerous techniques, like collection, analysis, and processing,
    that help bring data to the edge of a network instead of at remote locations,
    hence reducing time latency. Basically, processes are dispersed and take place
    in a more sensible physical location. A much-needed rise in the need for greater
    intelligence, computing power, and advanced services at the network edge to help
    boost the role of edge devices has been enabled by the Internet of Things (IoT)
    and cloud computing. Edge devices use machine-learning algorithms to sort, filter,
    and analyse data generated by this hardware device and makes decisions in real
    time. It controls data flow at the extremities between two networks. Transmission,
    routing, processing, monitoring, filtering, translation, and storage of data passing
    between networks are some of the functions of edge devices. Edge-AI offers great
    flexibility, which allows for smart devices to support various industries. Since
    data are handled at the local level on an edge computer, this diminishes the possibility
    of the data being at risk of manipulation, a risk which would be increased were
    it to be sitting somewhere in the cloud. This also makes the computers more responsive.
    The most significant advantage of real-time data processing makes it possible
    to utilise AI applications directly'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'on field devices. Edge inference and training is another advantage as the application
    of training models and inference happens directly on edge devices. Edge-AI also
    provides improved levels of automation. Automatic tasks can be performed by machines
    trained at the edge. Industrial automation and edge-AI technology is rapidly growing
    and is being employed extensively worldwide. From self-driving vehicles like Tesla
    to automation of cardiovascular tests, like X-rays, the use of artificial intelligence
    is expanding at an exponential rate in various sectors.


    # 1.3.2 IMPLEMENTATION IN HEALTHCARE


    One such sector is healthcare. An up-and-coming technology is the development
    of healthcare service robots. Dealing with patients suffering from chronic or
    psychological illnesses requires the long-term, around-the-clock attention of
    a nurse or caregiver. Scientists are exploring ways to provide constant chaperoning
    to provide “a mobile healthcare robot”. These robots hold the potential to learn
    and gain experience from human medical professionals and experts, and go on to
    give an even more accurate diagnosis than a human caregiver as it will not be
    prone to any human errors. The mobility of the robot gives an added advantage.
    The sensor-equipped robot does not miss the minutest details about the environment
    and the patient and allows the robot to be more dexterous in repetitive work.
    This helps to capture important information about the patient, which might help
    them recover faster. The sensor acts as a dispatcher of direct information to
    some other edge device or to the cloud, when required (Islam et al. 2022), thus
    allowing each edge device to process information and carry out its role rather
    than sending all its data to a centralised server. AI has boomed in the cardiovascular
    imaging field, helping radiologists and pathologists with medical imaging to identify
    and diagnose a range of conditions. MRI, CT scans, and X-ray images allow doctors
    to see the inner workings of the human body. However, it can be difficult and
    time consuming for anyone to evaluate the huge amount of complex data which these
    images often contain. AI tools can act as clinical decision supports and hence
    help enhance care delivery by supporting the workflow of radiologists and pathologists
    (Mazzanti et al. 2018). A clinical cardiac MRI (CMR) scan calls for approximately
    one hour of imaging time, followed by significant time for post-processing of
    the image obtained. Although clinical use of completely automated methods for
    analysing CMR analysis has not yet materialised, CMR stands to benefit much from
    automated segmentation because of the current latency of manual image post-processing.
    Various CMR pulse chronologies, scanning variables, and imaging protocols – each
    of which needs to be fashioned according to each patient and the medical issue
    – are a barrier to automation of scanning and analysis. There is a lot of ongoing
    research work underway to overcome these challenges, despite such limitations.
    The use of edge-AI in the healthcare sector has demonstrated great potential in
    the near future to provide doctors and physicians with completely automated and
    accurate tools for both diagnostic purposes and to improve patient treatment.'
  merge: -1
  img_proc: true
