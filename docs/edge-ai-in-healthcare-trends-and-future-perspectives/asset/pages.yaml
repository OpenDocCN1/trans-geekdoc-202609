    # 5.1 INTRODUCTION


    Human–computer interaction has been a continuous issue of concern for accessing
    computer systems by people with visual impairment, hearing impairment, speech
    impairment, dyslexia, autism, etc. The three groups of disability, which are blindness
    and visual impairment, deafness and hearing impairment, and autism spectrum disorders,
    affect different organs of the body and their functioning and have extremely different
    outcomes and impacts on the individual during social events and life in general.
    But they also have two factors in common. They all affect the sensory system and
    are only sometimes immediately apparent. The sensory system is the body’s system
    of sense organs. The five important and major senses are vision, hearing, taste,
    smell, and touch (Smith et al. 2018). To come up with solutions, using technologies,
    for the visually disabled, we must first understand the challenges people with
    this disability face and the frequency of these disabilities across the planet.
    With the growth of technology and its implementation in every field possible,
    the scale of human interactions with technologies has increased greatly. Thus,
    human–computer interaction comes into play in a multitude of fields. Human–computer
    interaction, or HCI, is a multidisciplinary field of study that focuses on the
    design of computer technology and the interaction of the users (humans) with the
    technology. Initially, this field only focused on computers but has expanded its
    scope to cover all types of technology design and is a part of every field, whether
    small or huge. The field of HCI ranges from wearable devices to household gadgets
    to architectural devices. HCI not only increases our chances of accessing our
    gadgets more easily, making life easier, but also increases the chance of changing
    the lives of millions of people with disabilities on this planet. The aim of HCI
    is to produce usable and advanced technology which can serve its purpose for every
    individual: highly advanced technology for people who do not need assistance and
    highly assistive technology interactions for those who need assistance and support.


    # 5.2 GLOBAL STATISTICS OF DISABILITIES FACED BY PEOPLE


    As of 1 December 2020, there are around one billion people around the globe who
    live with a disability. This is around 15% of the world’s population; there are
    around 190 million people, or 3.8%, who are 15 years of age and older, and who
    require health care for their disabilities (World Health Organization (WHO) 2022)
    (Figure 5.1).


    Globally, it is said that two in ten adults live with a disability. As of 7 April
    2020, the most common disability was seen to be difficulty walking/climbing stairs
    (30.6 million) which could be due to old age or a physical disability of some
    sort. This is followed by disabilities where people require constant assistance'
