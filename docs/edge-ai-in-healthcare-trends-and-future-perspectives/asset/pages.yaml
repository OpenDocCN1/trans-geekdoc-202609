    and edge device layers interact via a short-range, low-power wireless communication
    technology like ZigBee, Bluetooth, or Wi-Fi. The edge device layer includes users’
    gadgets such as smartphones, tablets, and smartwatches that can perform some functions
    and store data in the short term. Bluetooth, Wi-Fi, or the internet are used to
    transport data from the devices to the edge servers’ layer. The edge servers’
    layer is made up of tiny data centers that can handle and store more data. The
    sole difference between the devices and the servers is that the server layer has
    more storage capacity than the device layer. Cloud data centers at this tier have
    more powerful Central Processing Units (CPUs) and can store massive volumes of
