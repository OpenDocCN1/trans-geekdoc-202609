  md: 'and HR images from a training database. Multiple-image SR (MISR) algorithms
    typically assume a targeted HR image, and the LR observations include equivalent
    geometric or photometric shifts from the intended HR image. In general, these
    algorithms use the differences between the LR observations to rebuild the desired
    HR picture, i.e., they are reconstruction-based SR algorithms. Reconstruction-based
    SR algorithms consider the SR issue to be inverted. Consequently, as with other
    inverse situations, a forward-imaging model is required.


    The latest performance achieved with deep-learning (DL) algorithms has facilitated
    super-resolving LR images. The primary DL aim is to learn an often-superior representation
    of data hierarchy compared to other machine-learning (ML) algorithms. A few existing
    SR frameworks constructed via convolutional neural networks (CNNs) appear in Section
    13.2. DL-based SR procedures emerge in Section 13.3, whereas Sections 13.4 and
    13.5 cover the discussion and conclusion of the chapter, respectively.


    # 13.2 SUPER-RESOLUTION CONVOLUTIONAL NEURAL NETWORK (SRCNN) ARCHITECTURES


    A convolutional neural network (CNN) is a type of artificial neural network used
    in image recognition and processing that is specifically designed to process pixel
    data.


    # 13.2.1 SRCNN


    The first DL SISR method is the SRCNN. Thus, LR and HR images are directly learned
    in end-to-end mapping.


