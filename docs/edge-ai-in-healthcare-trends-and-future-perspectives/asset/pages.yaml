  md: '# # 1.4 ARCHITECTURES, FRAMEWORKS, AND MODELS FOR EDGE-AI IN HEALTHCARE


    # ## 1.4.1 ARCHITECTURE OF EDGE-AI (XU ET AL. 2020)


    Edge-AI enables visual, location, and analytical solutions for various industries
    like healthcare, manufacturing, energy, etc. These solutions are deployed on edge
    devices which help to reduce latency, allowing offline and online execution, and
    providing strong results and security. Edge-AI leverages the fact that training
    and deployment processes for a machine-learning (ML) model are completely decoupled.
    It allows a trained ML model to be embedded in devices with limited memory and
    computational resources – enabling their execution in an offline fashion. The
    architecture of edge-AI is shown in Figure 1.1.


    Edge-AI is an architecture which is a distributed on the cloud.


    +   1) Cloud layer. The cloud layer is one of the most important layers as it
    stores all the edge-AI data which may be required presently or in the future.
    The cloud helps us to access data remotely and from anywhere. Edge-AI is based
    upon the principles of AI, machine learning, Internet of Things, and cloud computing.
    I n healthcare, we use these principles to achieve precise results.


    +   2) Edge layer. This layer comprises of the devices, sensors, Local Area Networks/Wide
    Area Networks (LANs/WANs), etc. In this layer, the data are collected and stored
    for further processing. They have the functionality of internet bandwidth, storing
    the memory, processing ability, and computing resources to collect, process, store,
    and analyse data with very little help from other parts of the network.


    +   3) Device layer. This is one of the most important layers of any edge-AI network.
    We need to collect various components that will serve the


    ![](img/28baab106dba0e70a2f26ab75f61f184_18_0.png)


    FIGURE 1.1 Architecture for edge-AI.'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'unique needs of a network for a given problem. However, a network happens to
    comprise many devices, like cloud service, servers, sensors, etc. Some examples
    are medical devices, ambient devices, interactive devices, etc.


    # 1.4.2 Edge-AI BENEFITS


    +   1) Low latency. Running AI models on the cloud means a round-trip latency
    of at least a few milliseconds, which can potentially go up to a few seconds,
    depending on network connectivity.


    +   2) Privacy. Processing data locally, on the device itself, implies that we
    do not need to send it back to the cloud for processing. This becomes increasingly
    relevant as smart devices (e.g., cameras, speakers) start being deployed in shops,
    hospitals, offices, factories, etc., coupled with growing user distrust pertaining
    to how enterprises are storing and processing their personal data, including images,
    audio, video, location, and shopping history.


    +   3) Reduced costs. Real-time processing at the edge not only enables low latency
    and achieves privacy protection, but it also acts as a “filter”, ensuring that
    only relevant data gets transmitted to the cloud for further processing, saving
    bandwidth. Fewer data transferred to the cloud also implies less storage and processing
    costs on the cloud.


    # 1.4.3 Frameworks for edge-AI


    While ML models have traditionally been embedded in cameras, mobiles, drones,
    self-driving cars, etc., the growing adoption of edge-AI has led to the development
    of specialised devices capable of performing AI inferencing efficiently. The framework
    for edge-AI is represented in Figure 1.2.


    +   1) Model design and model compression. The goal is to reduce the model’s inference
    time on the device. Deep neural networks (DNNs) often require storage of and access
    to many parameters that are used to describe the architecture of the edge model.
    Edge devices have limitations not only in terms of computational resources, but
    also memory. There are mainly two ways to perform neural network (NN) compression:
    lowering precision or fewer weights (pruning).


    +   2) Software and hardware implementation. This is further forwarded to the
    software and hardware phase. Based upon the model design and parameter, we design
    software/hardware which is further forwarded for deployment.


    +   3) Deployment of edge device. Based upon information and deployment, the hardware
    and software are deployed in devices, which are further used in various industries.'
  merge: -1
  img_proc: true
