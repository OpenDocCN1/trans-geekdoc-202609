- pgno: 27
  md: 'emergencies as quickly as possible. High response times in data centers are
    key hazards in smart health systems that might result in irreparable damage. In
    light of these facts, Internet of Things (IoT) and artificial intelligence (AI)
    are the most useful solutions to these problems. Adopting a hybrid of these two
    technologies, in particular, can help address a variety of problems in the field
    of smart healthcare (Gaba & Raw 2020; He et al. 2014; Kruse et al. 2016). With
    the Internet of Things, it is possible to generate and exchange data across a
    network device. In terms of medical facility improvement, this means that a traditional
    hospital can be transformed into an innovative hospital (Azimi et al. 2017). Instead
    of transmitting all data to cloud data centers, edge technology allows smart healthcare
    systems to execute procedures and store data closer to end users. As a result,
    smart healthcare systems would simply need to transfer raw data to cloud data
    centers located far away (Azimi et al. 2017; Bierzynski et al. 2017). Furthermore,
    by imitating human intellect in data processing by using intricate algorithms,
    AI can smooth the process of calculating conclusions without the direct involvement
    of humans (Chiang & Zhang 2016). Based on patient data, AI oversees looking into
    the associations between illness treatment, prevention, and detection measures.
    Because of the resource limits at the edge, new and lightweight approaches are
    required to execute them there (Abdollatif et al. 2019)


    # 2.2 EDGE COMPUTING


    Edge computing falls under a system that puts business use closer to IoT devices
    and local edge servers. At its inception, this closeness to data can provide significant
    business benefits, such as faster insights and shorter response times. Connected
    devices generate a vast quota of untapped data. With edge computing, you can maximise
    their potential by discovering new business options to serve our consumers with
