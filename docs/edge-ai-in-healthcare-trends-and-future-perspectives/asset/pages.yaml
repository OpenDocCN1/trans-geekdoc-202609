    # 16.5 MAPPING THE MARKET FOR MEDICAL TRAVELERS


    A report from the Maximize Market Research Company describes the global medical
    tourism market in regions such as North America, Europe, Asia-Pacific, the Middle
    East, Africa, and South America. The report forecasts that the medical tourism
    market would grow by Compound Annual Growth Rate of ~10% in the next five years,
