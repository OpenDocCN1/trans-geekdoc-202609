  md: '# ## 8.1 INTRODUCTION


    Disability is a state in which a person''s capacity to do daily tasks is significantly
    hampered. Due to a variety of circumstances, people with disabilities have impaired
    bodily functioning. Nearly 1 billion people worldwide could be considered impaired.
    According to Figure 8.1, approximately 15% of the world''s population, or nearly
    1.2 billion individuals, experience severe functioning impairments, necessitating
    the use of healthcare services. As the population ages and chronic health issues
    become more common, there are more people living with disabilities. Disabilities
    can take on a variety of forms and dimensions. Whereas some health issues associated
    with disabilities are associated with poor health and high levels of healthcare
    consumption, others are not. On the other hand, people with disabilities are in
    need of mainstream healthcare services because they suffer from the same general
    healthcare needs as the general population. The right to the finest healthcare
    accessible without discrimination is guaranteed by Article 25 of the United Nations
    Convention on the Rights of Persons with Disabilities. In spite of this, few nations
    offer people with disabilities adequate help. Only a small number of nations gather
    data in the health field that enables handicap disaggregation. This was notably
    clear during the COVID-19 pandemic, when authorities neglected to consider handicaps
    when deciding the response to the pandemic. In addition to experiencing worse
    health situations during and after the pandemic, individuals with disabilities
    are now three times more likely than the general public to contract COVID-19,
    experience severe COVID-19 symptoms, or die because of the sickness.


    # ## 8.2 IMPLICATIONS OF COVID-19 ON DIFFERENTLY ABLED INDIVIDUALS


    We are continually learning more about COVID-19, a novel disease, including who
    is more prone to contract it. Most people who have disabilities are more likely
    to catch COVID-19 or become seriously ill from it. People with significant underlying
    chronic medical conditions, such as chronic lung disease, a serious cardiac condition,
    or a compromised immune system, tend to be more susceptible to becoming unwell
    from COVID-19. According to Figure 8.1, official estimates indicate that


    ![](img/28baab106dba0e70a2f26ab75f61f184_107_0.png)


    FIGURE 8.1 Distribution of individuals with different disabilities. (Source: 2016
    Social Statistics Profile, Ministry of Statistics and Programme Implementation,
    Govt. of India).'
