    # ## 2.4 SCOPE OF EDGE-AI IN HEALTHCARE


    The modern healthcare industry is being shaped by edge computing technology. As
    previously stated, there are various advantages to implementing edge-AI. It can
    be highly beneficial for patients, healthcare practitioners, and workers in the
    healthcare industry.


    +   • **Autonomous monitoring of hospital rooms.** The potential to automate tasks
    is one of AI''s most fascinating selling points in general. Artificial intelligence
    programs may collect data from various sensors and analyse them to choose the
    best course of action. This is where edge AI comes in. It allows autonomous monitoring
    of hospital rooms and patients by combining computer vision and data from various
    sensors. Consider the case of fall detection. Many wearables now include the capacity
    to detect if a person falls suddenly by utilizing specific technology. The edge-AI
    of these devices can be trained to detect falls in real time and even notify caregivers.
    In most circumstances, this can save a person''s life. The fall detection feature
    on Apple Watch is an example of this.


    +   • **New applications in radiology.** DICOM (Digital Imaging and Communications)
    images in radiology are pretty huge. As a result, sending these photos to the
    cloud or a central server for processing and receiving machine-learning inferences
    can be quite costly and time consuming. On the other hand, edge-AI allows the
    analysis to take place locally, resulting in a considerably faster diagnosis.


    +   • **Cardiovascular abnormalities detection.** The total automation of cardiovascular
    abnormalities in routine imaging tests, such as chest X-rays, should mean faster
    decision-making and fewer diagnostic errors. The application of artificial intelligence
    to the notion of imaging data can also aid in detecting significant issues such
    as muscle thickening, monitoring changes in total blood flow in the heart, and
    so on. Detection of fractures and other musculoskeletal injuries, using artificial
    intelligence to detect hairline fractures, soft tissue injuries, and dislocations,
    can help surgeons feel more confident about their treatment options.


    +   • **Rural medicine.** Providing high-quality healthcare in rural regions has
    always been difficult. Despite advances in telemedicine and more'
