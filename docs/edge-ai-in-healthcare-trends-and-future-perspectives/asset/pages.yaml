    +   10.3 Related work .................................................... 134

    +   10.4 Proposed edge computing-based IDS for healthcare IoT ....... 136

    +   10.4.1 Building deep-learning-based IDS at the cloud system ...... 137

    +   10.4.2 Containerising the built model at edge nodes .............. 137

    +   10.5 Conclusion and future work .................................... 138

    +   References ........................................................... 138


    # 10.1 INTRODUCTION


    The digitization era empowers the healthcare systems to use the breakthroughs
    of the technology revolution. Digitisation in healthcare systems are focused toward
    harnessing medical data, enhancing patient-care service, and minimising the cost
    of medical service (Velthoven et al. 2019). The technologies involved in digital
    healthcare include the Internet of Things (IoT), artificial intelligence, cloud
    computing, and edge computing. These pioneering technologies have also brought
    about multifaceted changes in healthcare applications and modified the medical
    application pattern from disease-focused to patient-focused application. It has
    also moved the focus from treatment of diseases toward preventive healthcare (Jayaratre
    et al. 2019). These technologies have also made remarkable changes by focusing
    on regional-level personalised data management along with general'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'clinical data management (Hassanalieragh et al. 2015). The changes made by
    these technologies at all levels of healthcare applications has improved the quality
    and efficacy of healthcare systems to a more advanced level.


    The Internet of Things (IoT) is playing a key role in digitising healthcare systems
    by deploying intelligent sensors and communicating through the Internet Protocol
    (IP) to provide a pervasive environment. Vast amounts of research are being conducted
    in IoT for healthcare applications (Farahani et al. 2020; Negash et al. 2018;
    Strielkina et al.2018). The integration of IoT has accelerated the transformation
    of the healthcare system and improved people’s standard of living, toward a healthy
    life.


    The IoT facilitates real-time remote patient monitoring using IoT devices worn
    by patients to support physicians to achieve effective treatment. A wide variety
    of body sensors and IoT healthcare devices have been invented and used for various
    healthcare applications, such as remote patient monitoring (Archip et al. 2016),
    smart pills (Goffredo et al. 2015), wearable IoT devices (), disease diagnostics
    and treatment using robots (Cianchetti et al. 2017), etc. A complete contextual
    analysis and detailed insights are provided about patients’ health by the data
    harnessed from the healthcare IoT devices which help the physicians in terms of
    treatment and support for medical research. The major application of IoT in healthcare
    is remote patient monitoring which provides real-time personalised healthcare
    with reduced costs and time (Kumar 2017). The wearable devices, such as heart
    rate monitoring devices, fitness bands, sleep analysers, blood pressure measuring
    devices, glucometers, etc., are used to monitor patients in real time (Khan et
    al. 2016). It is useful in predicting risks in advance by tracking the health
    and well-being of elderly people.


    The data harnessed from IoT medical devices and sensors have great potential in
    healthcare. The patient data are available to the doctors at all times when needed,
    facilitating faster diagnostics and treatment. Using the clinical insights from
    the data, precise dosages of drugs can be provided by the doctor. These data allow
    the identification of risks and benefits of various combinations of drugs. The
    data support physicians and healthcare professionals to make fast and reliable
    decisions and actions. Governments uses healthcare system data to predict the
    spread of disease, to prioritise medical research, and to direct funding for health
    services.


    The major challenge faced by healthcare systems in integrating IoT is data privacy
    and security. Real-time patient data are collected, processed, and stored using
    the IoT-based medical devices which are vulnerable to security and privacy threats
    (Chacko et al. 2018). Security and privacy must be ensured in the collection and
    management of patient data because attacks on healthcare IoT devices may be catastrophic
    (Devi et al. 2016). Cybercriminals may compromise IoT healthcare devices to take
    control of the device or use the patient data for fraudulent activities. Any modification
    in the patient data can lead to false diagnostics, delays in treatment, or sometimes
    lead to causalities under emergency conditions (Gopalan et al. 2020). IoT healthcare
    devices involve heterogeneous technologies which are growing but not completely
    standardised, in potential privacy and security threats. Increasing the number
    of connected healthcare IoT devices involved in critical tasks leads to more potential
    vulnerabilities than ever (Hathaliya et al. 2020). The integration of heterogeneous
    IoT devices in decentralised architecture'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'with insufficient security designs leads to many security problems in healthcare
    IoT. Hence, healthcare IoT needs a widely distributed security mechanism with
    a collaborative security process between different IoT healthcare devices (Mutlag
    et al. 2019). Various intrusion detection systems (IDS) have been designed for
    IoT (Prabavathy et al. 2018; Ge et al. 2019; Almiani et al. 2020) but very few
    IDS are specifically available for healthcare IoT (Thamilarasu et al. 2020). The
    state-of-the-art IDS for healthcare IoT are based on cloud technology. These IDS
    suffer from latency and are unsuited for the healthcare sector which involves
    heterogeneous devices generating huge volumes of real-time data from a dynamic
    environment and requiring a timely response (Khattak et al. 2015). To satisfy
    this requirement, IDS should be implemented near to the physical system, so that
    the data from the IoT devices are collected, processed, and stored at the edge.
    Implementing IDS at the edge network analyses the data quickly, identifies the
    threats and attacks, and makes actionable decisions at a faster rate. Edge computing
    provides a distributed service for computational offloading in IDS but healthcare
    IoT need an intelligent IDS for detecting threats and attacks from large numbers
    of heterogeneous medical IoT devices. The traditional machine-learning algorithms
    are not efficient for IDS in healthcare IoT. The traditional machine-learning
    algorithms involve shallow learning and cannot detect unforeseen attacks in high-dimensional
    massive data from healthcare IoT devices. Healthcare IoT needs an intelligent
    IDS which has the powerful learning ability of artificial intelligence and which
    can analyse enormous volumes of data from heterogeneous devices to detect the
    attacks more accurately and efficiently (Pande et al. 2021). To meet this requirement
    of healthcare IoT, deep-learning algorithms can be used in IDS for healthcare
    IoT. Deep learning has the ability to process and analyse vast amounts of IoT
    data to identify the potential vulnerabilities and cyber-attacks in IoT applications.
    Unfortunately, deep-learning algorithms are computationally intensive and require
    more resources. Most of the edge nodes are resource-constrained devices which
    are inadequate to implement deep-learning algorithms. Container-based virtualization
    can be used to implement deep-learning-based IDS at the edge nodes. Container-based
    virtualisation is a lightweight implementation of the hypervisor-based virtualisation
    of cloud computing. In container-based virtualisation, the process is isolated
    at the operating system level of the host machine (Roberto et al. 2016). A software
    containerisation platform like Docker (Boettiger et al. 2015) Kubernetes (Burns
    et al. 2016) can be used to containerise the deep-learning-based IDS. The objective
    of the proposed work is to develop a containerised intrusion detection system
    using a deep-learning algorithm at the edge nodes to detect attacks on healthcare
    IoT.


    # 10.2 BACKGROUND


    # 10.2.1 EDGE COMPUTING


    Edge computing allows computation and data storage near to the source of the data
    with the architecture of distributed computing technology. An edge node refers
    to any computing or networking resource in the track from IoT devices at'
  merge: -1
  img_proc: true
- pgno: 141
  md: '![](img/28baab106dba0e70a2f26ab75f61f184_141_0.png)


    # FIGURE 10.1 Edge computing architecture


    the end to the cloud data centers. It processes the upstream data for IoT devices
    and processes downstream data for cloud services. For example, a network gateway
    device act as an edge node in smart home applications between the home appliances
    and the cloud (Shi et al. 2016). Edge computing processes the data near to the
    source, hence it reduces the amount of data transmitted and the transmission latency
    for streaming the data up to the cloud for processing. The computing is close
    to the data sources in edge computing so that the analysis and processing are
    done quickly and cost effectively by reducing the data streaming cost in the cloud.
    In addition, edge computing supports IoT applications by providing location awareness
    to IoT devices, handling the heterogeneity issues by enabling interoperability
    and flexibility, using uniform programmable interfaces by virtualisation (Hassan
    et al. 2018). Its distributed paradigm provides high availability and greater
    scalability for large-scale IoT applications. The architecture of edge computing
    is shown in Figure 10.1.


    # 10.2.2 Deep learning for IoT


    Deep learning is a subset of machine learning that allows computers to learn from
    experience. It is also an advanced artificial neural network. It is the advancement
    of artificial neural networks that can imitate human cognition (Pouyanfar et al.
    2018). Simple artificial neural networks (ANN) were limited by computing power
    and lacked accuracy. In order to improve the accuracy, the number of layers in
    ANN were increased and this led to deep neural network. Since it has more layers
    of connected networks, it can extract complex patterns from multiple simple features
    with minimal knowledge. This increase in accuracy made many'
  merge: -1
  img_proc: true
- pgno: 142
  md: '![](img/28baab106dba0e70a2f26ab75f61f184_142_0.png)


    # FIGURE 10.2 Deep-learning classification


    safety-critical IoT applications to meet its expectations. In order to produce
    accurate results, deep learning systems need a high computation resource and large
    amounts of data for training the model. The deep neural networks are able to classify
    data from the output obtained from a series of “true or false” questions, involving
    complex mathematical calculations. Deep-learning algorithms are categorised into
    supervised learning and unsupervised learning, as shown in Figure 10.2. Supervised
    deep learning includes artificial neural network (ANN), convolutional neural network
    (CNN), recurrent neural network (RNN), and self-organising map (SOM). Unsupervised
    deep learning includes the Boltzmann machine and the autoencoder. The major applications
    of deep learning are driverless cars, Chabot, medical imaging diagnosis, facial
    recognition in social media, etc.


    # 10.2.3 Containerisation


    Containerisation is a software development approach which packs an application,
    along with its dependencies and environment, as an image and deploys it on a host-operating
    system. A container is a portable operating environment with the required resources
    to run an application. A container runs the application in an isolated manner
    without using the resources of other containers, like a separate physical computer
    or a virtual machine. The container technology is different from virtual machine
    technology; containers hold the application and its dependencies, but the operating
    system is shared whereas a virtual machine holds'
  merge: -1
  img_proc: true
- pgno: 143
  md: '![](img/28baab106dba0e70a2f26ab75f61f184_143_0.png)


    FIGURE 10.3 Containerisation of applications


    the application and its dependencies along with the full guest-operating system.
    Hence, containers need fewer resources than virtual machines. In container-based
    virtualisation, the hardware infrastructure is divided into unique virtual divisions
    and the operating system is shared by multiple containers (Bhardwaj et al. 2021).
    The major advantage of containers is that they enable fast scale-up of applications
    by instancing new containers quickly and avoid the inconsistency problems in environmental
    set-up during deployment. The major concepts of containerisation are container
    host, container image, container, and container repository. The container host
    is the physical machine or virtual machine which will run the containers. The
    container image is a lightweight executable package of software required to execute
    an application, including code, libraries, system tools, and settings. The container
    is a runtime instance of container image. The container repository stores the
    image and its dependencies when a container is created. It can be made as a public
    or private registry. Figure 10.3 represents the application of containerisation.


    # 10.3 RELATED WORK


    A vast number of studies have shown the importance of privacy and security requirements
    in healthcare IoT (Awotunde et al. 2021; Karunarathne et al. 2021; Velthoven et
    al. 2019; Jayaratne et al. 2019; Hassanalieragh et al. 2015). Some attacks on
    healthcare IoT, such as inducing errors in diagnostic inferences will lead to
    physical injuries or sometimes death (Xie et al. 2021; Farahani et al. 2020).
    Another important attack on healthcare IoT is routing attacks on wireless body
    area network to drop the critical information or eavesdrop the data (Hajar et
    al. 2021; Negash et al. 2018; Strielkina et al. 2018). Various research studies
    have been carried out to'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'provide security to healthcare IoT (Ullah et al. 2021; Archip et al. 2016;
    Goffredo et al. 2015; Cianchetti & Menciassi 2017) but research on intrusion detection
    systems for healthcare IoT is still in its infancy. Most of the existing IDS for
    IoT uses traditional machine-learning algorithms such as K-nearest neighbor, random
    forest, support vector machine, and others (Ahmad et al. 2021; Kumar 2017). These
    IDS were not effective because the IDS for healthcare IoT should build security
    instincts by analysing vast amounts of heterogeneous data from healthcare IoT
    devices (Manhas et al. 2021; Khan et al. 2016). This requirement can be satisfied
    by using deep-learning algorithms for IDS which can overcome the difficulties
    of IDS in feature selection and representation with limited labeled datasets (Thakkar
    et al. 2021; Chacko & Hayajneh 2018). A network IDS called self-taught learning
    was designed using autoencoder with softmax regression (Sekhar 2021; Devi & Muthuselvi
    2016). This system was tested in a Network Security Laboratory-Knowledge Discovery
    in Databases (NSL-KDD) dataset. A flow-based anomaly detection system was implemented
    using a deep neural network in software defined network (SDN) (Alzahrani et al.
    2021; Gopalan et al. 2021). The results of these deep-learning approaches outperformed
    traditional machine methods but, in these, deep learning is used only for pre-training
    but not for classification.


    A deep neural network (DNN) was proposed to identify advanced persistent threats,
    was evaluated using a KDD dataset, and claimed RNN and (Long Short-Term Memory
    (LSTM) are required to improve the future defenses (Do Xuan et al. 2021; Hathaliya
    & Tanwar 2020). A deep neural network with three hidden layers, containing autoencoder
    and softmax regression, was proposed and the results were not accurate on some
    classes because of the fewer layers (Potluri et al. 2021; Mutlag et al. 2019).
    An unsupervised deep belief network which is used to train parameters was proposed,
    resulting in fewer errors in classification (Kang & Kang 2016; Prabavathy et al.
    2018). A comprehensive survey on notable Network-based Intrusion Detection System
    (NIDS) approaches, that use deep and shallow learning, was carried out which concluded
    that deep learning outperforms shallow learning in detection accuracy (Hodo et
    al. 2017). The majority of the existing security solutions for IoT applications
    involves cloud technologies which are constrained by the number of devices, latency,
    and bandwidth (Alam et al. 2021; Zhou et al. 2017; Ge et al. 2019; Almiani et
    al. 2020). The number of devices in the healthcare environment is increasing exponentially
    and security is a major problem in cloud-based IoT applications. Edge computing
    can be an effective replacement for handling security issues in cloud-based IoT
    applications (Hassan et al. 2018; He et al. 2019). An IDS using edge computing
    for detecting selective forwarding attack on a mobile wireless sensor network
    was proposed by Yaseen et al. (2018) but this IDS can detect only selective forwarding
    attacks (Yaseen et al. 2018; Thamilarasu et al. 2020). Extreme Learning Machine
    (ELM)-based IDS was designed on the edge network for IoT applications in which
    training the model is performed at edge nodes, which are inappropriate for resource-constrained
    devices (Khattak et al. 2015; Prabavathy et al. 2018). In edge computing, the
    edge devices are heterogeneous in terms of computational capacities, power specifications,
    and operating system (Ozcan, M.O., Odaci, F. and Ari, I., 2019; Pande et al. 2021).
    To overcome this issue in implementing'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'IDS at edge node, containerisation can be used. Containers at edge devices
    are used to manage the applications without difficulty. Containerisation is applied
    in edge computing for various applications like smart homes (Ozcan, M.O., Odaci,
    F. and Ari, I.; Morabito 2016), vehicular networks (Sami et al. 2020; Boettiger
    2015), and industrial IoT (Okwuibe et al. 2020; Burns et al. 2016), but not applied
    in intrusion detection systems at edge nodes. Containerisation of security systems
    at fog node networks was proposed for a software defined network (SDN) (Prabavathy
    & Supriya 2021), but this system is specific to SDN and it performs behavior analysis
    for anomaly detection.


    The proposed IDS is novel as it implements intrusion detection for healthcare
    IoT using deep-learning algorithms which are containerised and executed at the
    edge nodes to rapidly detect attacks from a vast amount of data from healthcare
    IoT devices.


    # 10.4 PROPOSED EDGE COMPUTING-BASED IDS FOR HEALTHCARE IOT


    The proposed IDS for healthcare IoT involves two major parts: 1. Building a deep-learning-based
    IDS at the cloud system; and 2. Containerizing the built model at the edge, as
    depicted in Figure 10.4.


    ![](img/28baab106dba0e70a2f26ab75f61f184_145_0.png)


    # FIGURE 10.4 Proposed containerised edge-based IDS architecture'
  merge: -1
  img_proc: true
- pgno: 146
  md: '![](img/28baab106dba0e70a2f26ab75f61f184_146_0.png)


    # FIGURE 10.5 Deep-learning-based IDS


    # 10.4.1 BUILDING DEEP-LEARNING-BASED IDS AT THE CLOUD SYSTEM


    The distributed nature of healthcare IoT requires a distributed intrusion detection
    system for timely detection of attacks closer to the end devices. To achieve this
    goal, IDSs are placed at the edge nodes. Deep learning is used in developing the
    IDS for healthcare IoT. The deep-learning models will critically analyse the data
    to provide clear insights into the data, which is greatly needed in real-time
    critical applications like the healthcare sector. Building a deep-learning model
    needs more resource which can be provided by the cloud system. In the proposed
    system, the deep-learning-based IDS will be developed at the cloud and then it
    will be containerised to use at the edge nodes. The initial step in building the
    deep-learning model is to identify the suitable model and model parameters. Once
    the model is identified, the model is trained using healthcare IoT data. The data
    from various IoT healthcare devices are collected and preprocessed at the cloud
    storage system. The preprocessed data will be classified into training data and
    test data. The deep-learning model for detecting attacks on healthcare IoT are
    trained using these preprocessed training data at the cloud. The trained model
    is tested using the test data to check the accuracy of the developed model, and
    the model parameters are adjusted to reach the maximum accuracy. The deep-learning
    model with fine-tuned model parameters of maximum accuracy are containerized to
    be implemented at the edge nodes. Figure 10.5 shows an IDS based on deep learning.


    # 10.4.2 CONTAINERISING THE BUILT MODEL AT EDGE NODES


    Any device which possesses computing capability can be modeled as edge nodes,
    such as routers, switches, access points, servers, etc. Based on the computing
    and communication requirements, edge nodes can be added to or removed from the
    IoT network. The edge nodes connect the healthcare IoT devices to the'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'cloud network. The proposed IDS is implemented at the edge nodes for efficient
    resource utilisation and to reduce network latency in detecting the attack. The
    edge nodes are considered as Docker clients to implement container-based virtualisation
    and implement deep-learning-based IDS by running the Docker host. The image of
    the deep-learning-based IDS is published in the Docker registry for the edge to
    access. The Docker client searches the deep-learning-based IDS in the Docker daemon
    and creates a container to run the IDS if it was found; otherwise, it obtains
    the image from the local Docker registry near to the edge nodes and builds the
    container to run the deep-learning-based IDS. The data traffic from healthcare
    IoT devices, such as temperature sensors, pressure sensors, etc., to high-end
    medical devices like MRI scanners, etc., are analysed by deep-learning-based IDS
    at edge nodes for timely detection of attacks.


    # 10.5 CONCLUSION AND FUTURE WORK


    In this chapter, edge-computing-based-containerised IDS, using deep-learning models,
    was proposed for healthcare IoT. The deep-learning model critically analyses the
    healthcare data to provide clear insights into the attacks on healthcare IoT.
    The containerisation allows the high-resource-consuming deep-learning-based IDS
    to be virtualised at the resource-constrained edge nodes. The implementation of
    IDS at the edges provides intelligence to edge nodes to learn and detect the cyber-attacks
    quickly and with greater accuracy. The proposed system can detect the attack quickly
    with high accuracy nearer to the source of attack, which is essential for critical
    applications like healthcare IoT. Future work will be implement and evaluate the
    proposed system in a real-time healthcare environment and to identify the attackers’
    plan in advance to protect the healthcare IoT proactively


