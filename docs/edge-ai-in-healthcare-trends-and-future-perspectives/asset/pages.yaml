    stores the patient’s data before collecting and transmitting it to the edge servers
    for additional processing. The efficiency of the suggested framework for IoT-driven
    healthcare systems was assessed using computer-based simulations. The authors
    created an experimental set-up, a simulation scenario, performance evaluation
    measures, and finally an analysis of the simulation findings before running the
    simulation on a variety of settings. For the proposed scheme, the performance
    evaluation metrics include the computation of average reaction time, packet delivery
    ratio, average delay, throughput, and control head. For both edge and cloud servers,
    average response time was measured and compared in terms of upload and download
    times, waiting times, and system load. Other parameters of performance evaluation
    metrics, i.e., packet delivery ratio, average delay, throughput, and control head
    was performed for traditional network, edge computing network, and software-defined
    networking-based edge computing networks. The authors indicated that, based on
    simulation outputs for three different situations, it has been validated that
    the proposed system is efficient, and that the proposed method can be improved
    to ensure patients’ data privacy (Xu et al. 2020).


    As a new computing paradigm that provides many solutions to the problems faced
    by traditional clouds, edge computing (EC) will greatly boost the expansion of
    the IoT industry and increase the variety of its application ecosystem. It is
    vital to apply privacy protection as well as those techniques that can enhance
    the security and dependability of EC for high-quality IoT services. This paper
    provided a survey of the application of AI and EC in IoT security. First, the
    basic concepts and vocabulary were presented. Then, EC was linked with the IoT
    service'
