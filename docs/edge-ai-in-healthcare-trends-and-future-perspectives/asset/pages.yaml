    # 1.1 INTRODUCTION


    In models, the algorithms are proposed and processed locally without dependence
    on the cloud, internet, etc. They use the data that they have generated themselves
    for training purposes, storing it locally and taking quick decisions when needed.
    Such techniques are model trains on various client devices. The model updates
    and the curated data are then sent to the remote server periodically. The implementation
    of such models saves backhauling costs and bandwidth requirements. In a field
    such as healthcare where even a second''s delay can result in death, reduced latency
    is a major point to be considered. The analytics methods utilised by the edge-AI
    (edge-artificial intelligence) techniques to locally curate, analyse, and produce
    results, include advanced analytics methods like artificial intelligence and machine
    learning, edge computing techniques like machine vision, video analytics, and
    sensor fusion, and methods incorporating location intelligence. The hardware support
    consists of electronics and devices that enable edge computing. The power efficiency
    and scalability reduce costs, increase real-time performance, and achieve accurate
    analytics which, along with the greater'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'reach, make this technique more lucrative. Such techniques can enable medical
    workers to obtain information about critical patients even in regions where the
    connectivity is inadequate. Detection, identification, and diagnosis of musculoskeletal
    injuries, fractures, cardiovascular abnormalities, and even some neurological
    diseases will be possible, even in remote locations, with the help of edge-AI.
    The impact of AI and its applications in various industries all over the world
    has significantly improved. Nowadays, cloud computing is being used in almost
    every field in the face of the growing data needs of the corporate world, thereby
    becoming an integral part of AI. Edge-AI, regarded as the future of AI, is a combination
    of AI and edge computing that uses machine learning to deploy intelligent solutions
    on hardware devices. These hardware devices are known as edge devices and use
    machine-learning algorithms to sort, filter, and analyse data which are generated
    by this device, and make decisions in real time. Edge AI processes data locally,
    directly on a server or device, which reduces time latency as the data doesn’t
    have to be transferred to the cloud. This shift from the cloud to the edge is
    quite beneficial. Another advantage of edge AI is that it doesn’t need internet
    connectivity to analyse data in real time. The role of AI in improving the systems
    and enhancing technology in different industrial sectors in recent years is commendable.
    Healthcare is one of the leading industries driven by AI technology and edge computing
    (Fasciano & Vitulano 2020). AI has the potential to automate processes and has
    become extremely useful in enabling autonomous monitoring of hospital rooms and
    patients, enhanced by edge-AI. This is achieved by various AI algorithms which
    use a host of sensors to gather and process data in order to respond appropriately.
    There have been a lot of different innovations and developments in transforming
    the present-day healthcare landscape by automation of cardiovascular tests like
    X-rays, and much more. The increasing global population brings many problems and
    challenges surrounding the quality of life for people of all ages. This is mainly
    affecting the healthcare sector. With the help of AI-based techniques directly
    on the edge, a faster, more private, and more precise result is enabled which
    directly works on edge computing.


    With the growth of technology and the increased longevity of human life, patients
    require more sophisticated and faster results, which help them to achieve rapid
    treatment of any conditions. The exploitation of AI technology, aiming to promote
    improved health in society, which is very necessary in today’s world, is a challenge
    because of poor knowledge, social and economic issues, and lack of communication.
    In this chapter, we focus on the architecture, framework, and models for edge-AI
    tools and techniques in healthcare. AI-based techniques will help us to achieve
    a more empowering society and community, using edge-AI, which has the potential
    to impact millions of patients and health providers by improving health systems
    and reducing costs. From better analysis to improved decision support, edge-AI
    can achieve wonders when it is adopted.


    With the help of simulation, we can have an environment and a model which will
    help us identify which healthcare systems are useful and will help to take better
    care of patients. By integrating the AI models with our healthcare system, we
    can identify and analyse the problem swiftly, and can also help propose good'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'solutions which can help save the lives of patients. We can train models in
    such a way that they can derive insights with regard to the level of disease risk
    from the datasets of a patient''s medical and social history. The models will
    also be useful as they will allow the technical team to evaluate and modify the
    model and workflow to normal clinical practice. Edge-AI is going to be prove extremely
    useful to patients and doctors as it ensures affordable prices and healthcare.


    # 1.2 DATA USAGE, ANALYTICS, AND APPLICATIONS OF EDGE-AI IN HEALTHCARE


    Edge systems can be thought of as real-time control engines or deterministic embedded
    communication systems present at the ends of a network, in proximity to the physical
    world and the industrial environment. One of the main contributors to the advent
    of edge-AI was the momentous advances of the Internet of Things (IoT) devices
    with which the web partners transmit data and information between the device and
    the cloud.


    Data collection is achieved through devices like motion controllers, programmable
    logic controllers, sensors, etc., residing at the boundary of the network. All
    these devices have analytic capability which enables them to perform analysis
    and produce results at the edge itself, being connected to the running system
    as close as possible to the site where the data are being produced, instead of
    the cloud. Integration of AI at the edge nodes only allows real-time operations,
    decision-making, data creation, and storage within the same device. Using an inferencing
    model, AI models are shifted from the cloud to closer to the edge by edge-AI.
    If any action needs to be taken, the device takes care of it, based on the analysis
    that it performs. In order to analyse the larger picture, transmission of the
    relevant data takes place from the devices at the edge to the cloud which are
    then aggregated.


    Machine-learning methods are used by the edge-AI systems for processing the data
    generated at the local level by the hardware devices. Based on the data collected
    by the device, AI algorithms are proposed on the hardware devices locally. The
    devices store the results locally and afterward the information is sent to the
    cloud for further processing and storage. The llocal computing resources and devices
    used in edge-AI are optimised for AI and integrated directly. This makes it ideal
    to analyse and process vast amounts of data in real time on site. The reduced
    amount of data that must be transmitted further reduces the cost of data communication.
    The vulnerability arising from the privacy perspective can also be avoided as
    data do not have to be transmitted and stored in the cloud. Let''s take the example
    of sensor data generated to monitor and analyse the status of equipment at some
    remote healthcare facility. Millions of data points can be created in such an
    environment per second. It will be impractical to transmit the raw data to a remote
    data center without filtering and processing it first. The situation gets worse
    if there''s poor network connectivity or inconsistent bandwidth. There are a few
    cases where, in the absence of edge technology, the data must be collected in
    storage media and physically shipped via trucks to the data centers. This adds
    latency which, in turn, results in the loss of signals which might prove to be
    useful'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'in finalising the procedure for a patient’s diagnosis or a medical instrument’s
    need for immediate repair or replacement. All this can be avoided as, in edge-AI,
    the latency and bandwidth requirements are dramatically reduced because much of
    the process takes place next to the sensors. IoT devices have limitations when
    it comes to on-device AI as they usually can’t store, compute, label, and analyse
    large amounts of data. Furthermore, for the outcomes to be accurate and usable,
    massive amounts of aggregated data from several devices need to be executing the
    machine-learning algorithms. It is not feasible to rely on the cloud to analyse
    and process data for real-time decision-making. When big data analytics are held
    at the end device, only the updates to the algorithms are sent back to the cloud
    to keep the multiple sites in sync, saving expensive backhaul and cloud storage
    costs.


    Machine-learning and intelligence processes are quite resource heavy. Deep learning
    algorithms need to be fed data, ultimately to train the deep neural network (DNN).
    After a DNN framework is established, it is deployed at the edge device for inference.
    So, basically, the computer collects all the data on an object from the sensors
    and then utilises it to make accurate predictions. Generally, edge-AI is used
    for inferencing, whereas, for training new algorithms, the cloud is used. The
    processing power and capability required for inferencing algorithms is significantly
    less than that required for training algorithms (Vyas 2023). Hence, at times,
    the inferencing algorithms are run on Central Processing Units (CPUs) or less
    efficient microcontrollers on edge devices. In some cases, the inference power
    is improved along with a reduction in power by using highly efficient AI chips.
    A proper edge-AI microchip can make autonomous decisions based on the data it
    acquires even in the absence of the cloud or even internet connection. These microchips
    can even have a sub-millisecond latency as the data are processed inside the device
    itself. Machine-learning algorithms can run autonomously due to the decentralised
    nature of technology. The risk of internet outages or poor network reception is
    eliminated. The data that the cloud receives has already been highly processed
    by the edge device, reducing energy consumption by 30–40%. With the 5G rollout,
