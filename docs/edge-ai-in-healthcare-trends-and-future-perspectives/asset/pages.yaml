    the study revealed how to employ such an architecture to deliver multi-modal data
    reduction and edge-based feature extraction for event recognition. The former
    makes effective and inexpensive compression possible, but the latter offers great
    dependability and prompt response in an emergency. Lastly, we talk about the main
    problems and opportunities that edge computing may present, as well as possible
    directions for future research.


