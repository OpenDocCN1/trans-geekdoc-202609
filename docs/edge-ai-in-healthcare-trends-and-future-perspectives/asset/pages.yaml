  md: 'et al. 2019). However, humans always doubted and still will have doubts about
    AI''s behavior and the rationale behind the decision-making process (Rigby 2019).
    That is why AI may not substitute for the whole existing system; rather, it can
    provide collaborative support that extends beyond the manual check of the physicians
    to provide an overall effective support system.


    AI solutions have a major positive impact on the medical and healthcare industries.
    They enable the collection, processing, and use of patient records, medical data,
    diagnosis discoveries, and medical research in a way that enhances the public
    health system and boosts prevention and treatment of diseases (Islam 2021). AI
    technology may also be used for patient monitoring, considering the national demographics
    (Rathi et al. 2021). With e-health, which includes the use of information and
    communication technology for health, new areas of health services are emerging,
    particularly mobile health apps (m-health) (Istepanian 2022). The implementation
    of a trustworthy AI regulatory framework should include participation in research
    funded by the government (Stix 2021). Additionally, coordination of general AI
    ethical guidelines with appropriate legislative measures is vital to respond to
    the changing technological environment (Stahl et al. 2021).


    Then again, the drastic need to educate citizens on the new risks, benefits, and
    ethical concerns of AI on the medical and health sector should not be discounted
    either (Stahl et al. 2021). Different governments are planning to create a shared
    library of health data that will be used to understand better and treat chronic
    diseases (Sodhro & Zahid 2021). Linking genomic libraries and creating rare illness
    registries will become a dimension that medical science is aiming for (Rath et
    al. 2012). In these situations, AI could be used as a tool to help clinical research,
    improve diagnoses, and support decision-making. Additionally, the information
    at the core of AI systems used in medicine is regarded as having a sensitive nature,
    pertaining to the most private and intimate parts of the patient''s life. Additionally,
    there are worries about the judgments made by the AI-based software''s interpretability.


    The mediated function of AI in the diagnostic environment calls for attention.
    For instance, when presented with an alternate interpretation from an AI system,
    doctors – especially less experienced ones – may be reluctant to challenge the
    machine''s authority. It is certainly challenging. The ability to interface with
    an AI system, train it, and achieve ongoing maintenance and result verification
    are all steps that must be taken before the system can be trusted as a diagnostic
    partner. Additionally, AI systems engage with patients largely as disembodied
    measurable statistics. Patients themselves must be vocal about their unique histories
    and contextual circumstances to ensure that their experiences do not get lost
    in the mountains of data, even while this increases the doctor''s obligation to
    actively search for aspects not recommended by the AI decision assistance.


    It''s crucial that AI laws serve to specify the boundaries of such partnerships
    to firmly ground doctors and patients in their relationship with this technology,
    even when institutional and legal discourse promotes human-AI collaboration rather
    than AI replacing the human decision-making process. The fundamental concept of
    human-AI collaboration requires digital literacy, namely the capacity'
