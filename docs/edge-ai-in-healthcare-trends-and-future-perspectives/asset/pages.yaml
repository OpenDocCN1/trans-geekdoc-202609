    # 5.3.2 NEED FOR ASSISTIVE TECHNOLOGIES FOR PEOPLE WITH A DISABILITY


    There are several assistive technologies available for the disabled society with
    the help of HCI; these assistive technologies fall under the following categories:


    +   - Assistive products required for personal medical treatment. These can include
    any personal medical equipment required by the disabled user without the help
    of another person.

    +   - Assistive products for training in skills. These can include technological
    devices and gadgets used by the disabled user for improvement training regarding
    his/her personal, mental, or social abilities.

    +   - Orthoses and prostheses. Orthoses are devices applied externally and are
    used for modifying the structure or functions of the neuro-muscular and skeletal
    systems. Prostheses, on the other hand, are external devices used to replace a
    body part wholly or partially.

    +   - Assistive products which can be used for personal care and protection. These
    can include assistive technology, which helps the disabled user dress, eat, or
    drink.

    +   - Assistive products for mobility. These can include technology required for
    moving from one place to another and gadgets required to move one object from
    one workplace to another.

    +   - Assistive products for communication and information. These can include
    technological devices for communication, using sight, hearing, speech, etc.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '+   * Assistive products for recreation. These can include user-friendly devices
    for the disabled which can be used for playing games, watching videos, listening
    to music, etc.

    +   * Assistive products for housekeeping. These can include technological gadgets
    that help around the house, for example, cooking and cleaning, switching on the
    lights or the fan, etc.

    +   * Assistive products for environmental improvement. These can include gadgets
    that help in getting familiar with the environment the disabled person is in,
    to help them navigate around it.

    +   * Assistive products for employment and school. These can include technological
    gadgets that help in learning for the disabled and help in carrying around and
    accomplishing tasks in the workplace or at school.


    # ## 5.4 DESIGNING FOR PEOPLE WITH VISUAL DISABILITIES


    Visual disabilities are by far the most challenging of challenges to overcome
    when designing a technological gadget that is suitable for these types of users.
    The results of various studies are available to improve the various aspects of
    disability, such as low vision (Shukla & Verma 2019), with help of smart glasses
    (Nazim et al. 2022). Technology plays an important role to deliver these services,
    such as the Internet of Things, which combines the real world and computer-generated
    content (Trayush et al. 2021; Komal et al. 2021) and blockchain technologies (Vyas
    et al. 2022). Some inventions and ideas for technology for the visually disabled
    are described in the following subsections:


    # ## 5.4.1 USING DATA THAT MAKE A SPECIFIC SOUND WHEN A TASK IS UNDERWAY OR ACCOMPLISHED


    Every website component should make a specific sound and include metadata. For
    example, every image, graphic, heading, etc., should contain all text, a comment,
    or a piece of text describing the shown image or graphic. This is important because
    visually disabled users use screen readers, and it becomes easy for them to understand
    when such descriptions are present for every image and graphic.


    # ## 5.4.2 ADOPTING THE BRAILLE CODE


    Braille is a widely used form of obtaining information for the visually disabled
    society from technological gadgets. This could make the keyboard easily understandable
    for the visually impaired user and be used by someone with no visual impairment,
    thus following the principle of design for all. This is where the refreshable
    braille display comes into play. This electronic braille display is a great example
    of using haptics or touch in HCI design for the visually impaired (UX Collective
    2022).'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# 5.4.3 Using speech recognition


    This involves recognising speech by technological devices using various methods,
    such as pattern recognition, Hidden Markov Model (HMM), neural networks, etc.


    # 5.4.4 Using standard HTML to design websites


    This allows screen readers to navigate easily through the website and understand
    the text. It is also important to use the right structure: H1 for the heading,
    H2 for the subheading, and the headings in the heading tab, etc., so that the
    screen reader can easily understand and communicate such information to the impaired
    user.


    # 5.4.5 Using screen readers such as Job Access with Speech (JAWS)


    These are the devices most widely used by those who are visually impaired. They
    work by using a text-to-speech engine, which reads out all the textual data and
    the menus present on the device. It also repeats all the keystrokes the user makes
    so they know what they are clicking on. These can be even more useful when used
    along with the braille code mentioned above so the user can hear and feel the
    data, giving the user the best experience.


    # 5.4.6 Using auditory icons


    With auditory icons, every action performed can have a specific sound associated
    with it. For example, when deleting something, it can have the sound of glass
    smashing, or when closing a tab, it can have a whoosh sound. The SonicFinder for
    Macintosh has specific sounds for a variety of tasks like folders having a papery
    sound, moving the files having a dragging sound, big files having a louder sound
    than small files, etc.


    # 5.4.7 CAPTCHA (Completely Automated Public Turing Test to tell Computers and
    Humans Apart)


    CAPTCHA tools could be used with an audio function present on every site. Nowadays,
    every site requires us to prove we are not a robot, and this becomes difficult
    for the visually impaired. Hence, the CAPTCHA option should come with audio for
    every website present.


    # 5.4.8 Website design


    Website design should avoid too many scattered links on their pages because this
    makes it difficult for the screen reader to identify what the data are. The links
    should come with a description before them, so that the visually impaired user
    will know what the link leads to when he/she uses the screen reader on that page.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# 5.4.9  Use earcons


    Earcons are brief descriptive sounds used to describe or communicate an event.

    They are synthetic sounds that convey information (Banerjee et al. 2020).


    # 5.4.10  Zoom option


    The devices should have the option to zoom into text and change its colour so

    people with low vision can see the larger text and colour-blind people can change

    the colour to see the text. iPhones have an accessibility feature that makes all
    the

    icons larger. Keyboards exist where we can zoom into the keypad to see the tiny

    letters and easily recognise them.


    # 5.4.11  The bionic eye


    This is one of the most advanced and expensive HCI devices designed yet for the

    visually impaired and must be surgically implanted into the user’s eye (Kasowski

    &B eyeler 2022).


    # 5.5  SMART CANE PROTOTYPE FOR THE VISUALLY IMPAIRED


    The field of human–computer interaction has come up with various devices for

    the disabled society. The device or prototype we have put forward in this chapter

    is a smart cane for the visually impaired, using infrared sensors and speakers
    to

    alert the visually impaired user to the obstacle in front of them. When the visu-

    ally impaired user points this stick while moving around and the sensor detects
    an

    object, it sends a signal to the buzzer, which sets off an alarm and alerts the
    user

    to the obstacle in front of them. This lets the user stay safe and gives them
    a sense

    of independence because they don’t need to ask for help from anyone or require

    assistance. It is also an effective and excellent device that can be used by anyone,

    regardless of age or ability, when it is dark, or when the power source is not
    work-

    ing. We can easily use this device to indicate any obstacles in case we need to
    go

    from one room to another (Vyas & Bhargava 2021)


    # 5.5.1  Introduction to proximity sensors


    Proximity sensors have been successful in industrial, medical, aerospace, and

    other fields, and now they have witnessed another success in the consumer elec-

    tronics market. Proximity sensors, based upon their fundamental principle, have

    been divided into inductance type, capacitive type, magnetic inductive type, pho-

    toelectric type, and ultrasonic type, etc. Traditional practice is to use a large
    cur-

    rent to drive LEDs and increase the luminous intensity of LEDs, or keep the chip

    working under low temperature, thus inevitably increasing the power or limiting

    the chip’s scope (Treeratanaporn et al. 2021). Based on the environmental noise

    problems of background light and dark current of the infrared (IR) proximity'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'sensor, this chapter puts forward the application of proximity IR sensors into
    making an automatic device that is lightweight and useful for visually impaired
    people worldwide.


    The working of an IR-based proximity sensor is conducted by an object detection-based
    method. In this type of detection of objects, any second when an object is detected
    within the line-of-sight (LOS) of the sensor working on IR, there will be a reflection
    using a signal in the direction of the infrared sensor. This type of reflected
    signal is often known as an echo signal (Junsheng 2013). Now, if we use a proximity
    sensor that works on IR and which is used for a working model for object detection,
    the presence of the object when it comes near the sensor will disturb or block
    the LOS of the IR signal, which will then give an echo signal, showing that an
    object has been detected and will trigger the 5V buzzer attached inside the dispenser
    to give off an alarm and inform the user of the obstacle. Similarly, the absence
    of an object here will not give out an echo-based signal. Thus, this method uses
    proximity-based sensors working on IR to detect the presence of an object to warn
    the visually impaired user of an obstacle in their way (Siraj & Shukla 2020).


