    # ## 9.1 INTRODUCTION


    Stroke is a great burden in the World today. It is the second greatest cause of
    death. According to a study done by the WHO, almost 15 million people suffer a
    stroke globally every year. Europe has a mean of approximately 650,000 stroke
    deaths each year. Many population-based studies for the stroke disorder have been
    conducted over the past years to determine the types and the fatality rates (Anbuselvan
    2020). The risk of stroke increases with heart disease and stroke-related deaths'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'are predicted to increase to 5 million in upcoming years, compared with 3 million
    in 1998. Causes of mortality from stroke are an outcome of comorbidities and/or
    complications. The onset of stroke and the following first month after it is the
    most crucial time for survival of a patient, with a large number of deaths in
    the very first week. Hypertension, fever, urinary tract infection, hypotension,
    cerebral edema, aspiration pneumonia, herniation, hyperglycemia, and hypoglycemia
    are some of the complications of stroke (Wolf et al. 1991). If a patient is able
    to survive the first week, even then death can happen due to various complications
    that result from relative immobility like sepsis, pneumonia, and pulmonary embolism.
    Stroke doesn''t differentiate between people on the basis of race, gender, or
    age, though it will be right to say that the probability of getting a stroke increases
    manifold for a patient with certain risk factors that may cause a stroke. It becomes
    extremely important for a person to protect themselves and others also by realising
    personal risk and how it needs to be managed (Lee et al. 2018). It is scientifically
    proven that 80% of strokes can be prevented by following this method. There are
    some factors that can cause strokes which represent bad habits such as smoking,
    drinking alcohol and physical inactivity. These factors can be reduced by changing
    the lifestyle itself, i.e., by adopting good habits like early to bed and early
    to rise, going for a morning walk, doing physical exercises on a regular basis,
    eating healthy food, etc. On the other hand, some factors can usually be cured
    only by appropriate treatment. A study showed that there are a total of ten factors
    that are related to 90% of stroke risk and approximately half of these can be
    modified. On the other hand, though, non-modifiable risk factors cannot be controlled
    (Rajora et al. 2021). These days, machine learning has made a place for itself
    among the most demanding fields in modern technology. A machine-learning model
    can easily predict the outcomes with minimal human intervention, thereby reducing
    human effort and increasing the accuracy of prediction. It is a form of the domain
    known as artificial intelligence. Stroke prediction can also be done by using
    several machine-learning techniques. The factors present in the dataset used for
    stroke prediction include age, gender, heart disease, work type, BMI, smoking
    status, etc. (Flueckiger et al. 2018). The proposed model uses different algorithms
    such as logistic regression, KNN, random forest, decision tree, SVM, Naïve Bayes,
    XGBoost, MLP Classifier, CNN, and LSTM to predict stroke among individuals based
    on the above-mentioned input factors present in the dataset on which different
    algorithms are applied. Furthermore, all these algorithms are compared with each
    other and the algorithm with the greatest accuracy is identified.


