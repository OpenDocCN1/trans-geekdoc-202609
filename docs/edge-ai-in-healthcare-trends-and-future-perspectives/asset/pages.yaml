    # ### 12.1 INTRODUCTION


    Heart disease describes a range of condition that affects the heart. The term
    “cardiac disease” is regularly used with cardiovascular disease (CVD). The blood
    to the heart is supplied by coronary supply routes and narrowing of coronary arteries
    is the major cause of heart failure. In the data analysis, assessing cardiovascular'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'disease risk is a significant task. The major cause of heart attack in United
    States is coronary artery disease. Cardiac disorder is more frequent among males
    than females. A survey carried out by the World Health Organization (WHO) estimated
    that 24% of deaths in India were due to cardiac disorder (WHO 2017). In 2015,
    over 30% of global deaths were due to CVD, leading to over 17 million deaths worldwide,
    a global health burden. Of those deaths, over 7 million were caused by heart disease,
    and greater than 75% of deaths due to CVD were in developing countries. In the
    United States alone, 25% of deaths were attributed to heart disease, killing over
    630,000 Americans annually. Among heart disease conditions, coronary heart disease
    is the most common, causing over 360,000 American deaths as a result of heart
    attacks in 2015. Many people who die of a heart attack experienced symptoms that
    were previously undiscovered or simply ignored. It is time to predict heart disease
    before its actual occurrence, as suggested by Hajar (2017). There are several
    main factor risks of heart disease, including high cholesterol level, high blood
    pressure, smoking, use of alcoholic drinks, high sugar, lack of physical activities,
    CVD, and a hypertensive heart (Ali et al. 2019).


    Feature extraction and selection are important steps for heart disease prediction.
    An optimum feature set should have effective and discriminating features, while
    mostly reducing the redundancy of features to avoid the “curse of dimensionality”
    problem as explained by Gu et al. (2018). Feature selection strategies are often
    used to explore the effect of irrelevant features on the performance of classifier
    systems (Suganya et al. 2016; Liu & Tang 2013). In this phase, an optimal subset
    of features, that are necessary and sufficient for solving the problem, is selected.
    Feature selection improves the accuracy of algorithms in reducing the dimensionality
    and removing irrelevant features, as discussed by Shen et al. (2012) and Singh
    et al. (2015). The orientation of the histogram feature provides the orientation
    of edges in the image, as demonstrated by Jeong et al. (2012). Textures are one
    of the most important features used in many applications. Texture features have
    been widely used in heart disease classification. The texture features are the
    ability to distinguish between abnormal and normal cases, as illustrated by Shen
    et al. (2012). Texture measures are two types: first order and second order. In
    the first order, texture measure is statistically calculated from an individual
    pixel. In the second order, the texture measure takes into account the relationship
    between neighbors, as shown by Pham et al. (2020) and Esteva et al. (2019). Texture
    features have been extracted and used as parameters to enhance the classification
    result.


    Many predictive approaches are used for heart disease classification system, namely
    decision tree, K-nearest neighbor (KNN), support vector machine (SVM), Naïve Bayes
    (NB), and artificial neural network (ANN) approaches, and it also deploys more
    clustering techniques (Javier et al. 2019; Vivan et al. 2019; Rajakumar & George
    2013; Pradhan & Bhuiyan 2023) to achieve effective prediction. Nowadays, deep-learning
    (DL) algorithms are mainly used for classification problems. Some of the main
    research areas into DL in the field of healthcare are the detection of phenotypic
    patterns from serum uric acid concentration,'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'determination of physiologic patterns, and predicting the severity level of
    various diseases (Esteva et al. 2019; Pham et al. 2020; Pradhan 2023).


    The main objective of this approach is to achieve cardiac image-based automatic
    heart disease diagnosis, using DNN with LPSO. The proposed research mainly consists
    of four stages, namely preprocessing, feature extraction, feature selection, and
    classification. Here, the feature extraction is done using a median filter. After
    feature extraction, the GLCM features are extracted from each cardiac image. To
    reduce the complexity and increase the classification accuracy, the important
    features are selected using the LPSO algorithm. After that, the selected features
    are provided to the classifier to classify an image as either normal or abnormal.
    The characteristics of the research are listed below:


    +   - Initially, to remove the noise present in the image, a median filter is
    utilised.

    +   - Then, the GLCM features are extracted from each image.

    +   - To reduce the complexity and increase the accuracy, the important features
    are selected using the lion particle swarm optimisation (LPSO) algorithm. The
    LPSO is a combination of the lion optimisation algorithm (LOA) and the particle
    swarm optimisation (PSO) algorithm.

    +   - Then, the selected features are given to the input of a deep neural network
    (DNN) classifier to classify an image as either normal or abnormal.

    +   - The performance of the proposed approach is analysed in terms of different
    metrics, namely accuracy, sensitivity, and specificity.


    The rest of this chapter is organised as follows; the literature review is presented
    in Section 12.2 and the proposed heart disease prediction system is explained
    in Section 12.3. The experimental results are analysed in Section 12.4 and the
    conclusion is presented in Section 12.5.


    # 12.2 LITERATURE SURVEY


    Many researchers have developed heart disease prediction systems, using cardiac
    images. Among them, some of the studies are analysed here. Rojas-Albarracin et
    al. (2019) developed a heart attack detection system with color images, using
    convolution neural network (CNN). Initially, they collect the images for training,
    validation, and testing. Then, the heart images are transferred to the CNN structure.
    The CNN directly classifies an image as either normal or abnormal. Their system
    was given a maximum accuracy of 91.75% or a sensitivity of 92.85%. Moreover, Garate-Escalina
    et al. (2020) developed a heart disease prediction system, using principle component
    analysis (PCA) and the random forest algorithm. Initially, the data are collected
    from the unique client identifier (UCI) Machine-Learning Repository. Then, the
    dimension of the dataset is reduced, using PCA. After that, the reduced dataset
    was given to the CNN classifier to classify the data as either normal or abnormal.
    The proposed approach attained a maximum accuracy of'
  merge: -1
  img_proc: true
- pgno: 171
  md: '98.7% for Cleveland, 99.0% for Hungarian, and 99.4% for Cleveland-Hungarian
    (CH) datasets.


    Thanga Selvi and Muthulakshmi (2020) developed a heart disease classification
    system, using optimal artificial neural network (OANN). The OANN consist of two
    major processes, namely distance-based misclassified instance removal (DBMIR)
    and teaching and learning-based optimisation (TLBO) algorithms for artificial
    neural network (ANN), called TLBO-ANN. This system was designed based on a big
    data framework like Apache Spark. Moreover, this system works on two phases, namely
    offline prediction and online prediction. For offline prediction, they utilised
    a benchmark dataset, whereas, for online prediction, they utilised a real-time
    dataset. The performance of the presented OANN model has been tested using a benchmark
    heart disease dataset from the UCI Repository. Oliver et al. (2021) developed
    an accurate system for prediction of heart disease based on a biosystem, using
    a regressive learning-based neural network classifier (RLNNC). The RLNNC system
    was a fully automated algorithm. The results of this system were accurate for
    patients with heart disease and the drug benefits of detecting and analysing heart
    disease. Analysis has shown that the RLNNC-based techniques promote greater efficiency
    and higher accuracy than traditional methods.


    Similarly, Jiao et al. (2020) developed a one-dimensional CNN-based pulse recognition
    system for detecting patients with cardiovascular disease. Initially, the original
    data are divided and normalised. The divided dataset is then assigned for training
    and testing process. Then, the pulse signal is inputted to CNN, which automatically
    extracts the features (Vyas et al. 2022), which are characterised by a fully attached
    layer. The final classification accuracy ratio can reach 97.14%, which is better
    than traditional machine-learning classification methods, such as SVM and KNN,
    providing new ideas and methods for the classification and objectification of
    pulse signals.


    Alkhodari and Fraiwan (2021) developed a valve heart disease prediction system,
    using convolutional and recurrent neural networks (RNN) in phonocardiogram recordings.
    Initially, the signal is pre-processed, using the maximal overlap discrete wavelet
    transform (MODWT) smoothing algorithm. Then, the signal is transferred to the
    combination of CNN and RNN, based on bi-directional long short-term memory (BiLSTM).
    The model is trained and tested following the k-fold cross-validation scheme of
    10-folds, using the CNN-BiLSTM network as well as the CNN and BiLSTM networks
    individually. The highest performance was achieved using the CNN-BiLSTM network
    with an overall Cohen’s kappa, accuracy, sensitivity, and specificity measures
    of 97.87%, 99.32%, 98.30%, and 99.58%, respectively. Dutta et al. (2020) developed
    a CNN-based coronary heart disease prediction system. Here, the forecast variables
    are determined using a less complete abstract and select operator (LASO)-based
    filtering system. Subsample methods are implemented to calculate high-class inequalities.
    The classifier achieves higher class-wise accuracies than traditional models.
    The introduced framework was used as a transfer learning model for new data. This
    method attained a maximum accuracy of 79.5%.'
