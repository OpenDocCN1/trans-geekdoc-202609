    easier. The ability of OCTIOT sensors to be easily installed is also quite helpful.
    According to this, the wheelchair''s maneuverability and smoothness of action
    are maintained. The range of this sensor makes it even more suitable. A common
    IoT sensor has a range of 5–8 meters (Chi et al. 2017). This goes a long way toward
    maintaining social distance in a crowded setting. The typical range for the OCTIOT
    sensor''s power consumption is 0.4–0.7 W. The overall system efficiency is maintained
    when the sensor is attached to the wheelchair.


    The PIR sensor on the OCTIOT keeps the handicapped person at a social distance
    from anyone nearby. Figure 8.7 shows how PIR sensors can identify human movement
    within a specific range. They function by using the parameters listed for the
    sensor. The majority of PIR sensors use a binary Yes/No technique to generate
    findings and are employed to identify the presence of people, animals, and other
    objects. In essence, we can use PIR sensors to detect the presence of any living
    being near the wheelchair and to calculate the distance'
  merge: -1
