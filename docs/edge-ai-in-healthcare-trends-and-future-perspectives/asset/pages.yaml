    # ## 9.2 PROBLEM STATEMENT


    Nowadays, stroke has emerged as one of the major causes of death globally. It
    has basically two categories of risk factors associated with it, namely modifiable
    and non-modifiable risk factors. Stress, heart diseases, smoking, drinking alcohol,
    and high cholesterol are some of the examples of modifiable risk factors. The
    central goal of our project is to fabricate a model to predict stroke accurately
    based on patient risk variables that may be modified with the help of various
    machine-learning and deep-learning techniques over a dataset taken from the Kaggle
    website.


    # ## 9.3 LITERATURE SURVEY


    To gain the required knowledge regarding the various concepts which are related
    to the present research, the existing literature was studied thoroughly. Following
    are some of the key conclusions that were drawn from them.


    In Rakshit and Shrestha (2021), the proposed model evaluated the most efficient
    algorithm for stroke prediction by comparing the accuracy scores of various machine-learning
    models. Among all the algorithms tested, the decision tree algorithm emerged victorious
    with an accuracy score of 100%.


    In Shashank et al. (2020), the model proposed here made use of several prediction
    algorithms such as neural network, Naïve Bayes, and decision tree. Therefore,
    this project helps to predict the risk of stroke using prediction models, and
    provides personalised warnings, along with lifestyle correction messages with
    the help of a web application.


    In Wolf et al. (1991), stroke prediction was achieved by developing a health risk
    appraisal function using the Framingham Heart Study cohort.


    In Limbitote et al. (2020), the research paper consists of a survey on the different
    machine- learning algorithms that can predict heart diseases. The authors have
    drawn a summary of the various algorithms and further found the most efficient
    algorithm by analyzing their different features.


    In Rajdhan et al. (2020), the authors of the paper have used Naïve Bayes and genetic
    algorithms to predict heart diseases. A UCI dataset has been used here to train
    the model with attributes that include age, gender, old peak, blood pressure,
    cholesterol level, etc. Also, a web-based machine-learning application has been
    deployed for the user to input his/her medical details, using purely these factors
    for predicting the presence of a heart disease.


    In Lee et al. (2018), the authors calculated the probability of stroke prediction
    for a data of ten years and then divided the individual probabilities of users
    suffering a stroke into five different categories.


    In Sudha et al. (2012), neural network, Naïve Bayes, and decision tree algorithms
    have been used for detection of patients suffering from stroke disease.'
