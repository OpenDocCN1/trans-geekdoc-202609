    # 11.6 LIMITATIONS AND FUTURE SCOPE


    The focus of this review was on chatbots that can only be utilised with stand-alone
    software and a web browser. This review was restricted to a chatbot that human
    operators do not control. As a result, patients'' perceptions and views regarding
    chatbots and chatbots with various delivery modalities may differ from their perceptions
    and opinions about chatbots found in this review. Patients in different sections
    or regions of India may have varied perspectives and opinions about mental health
    chatbots, so the findings of this review may not be generalisable in every part
    of India. The researchers have conducted the study in the Delhi-National Capital
    Region, and, due to a lack of time, other states were not included. The current
    study has included some identified themes of people''s behavior towards chatbots,
    and the rest were excluded. The principle of generalisation adds to the limitation
    of the study that describes the variation of results on different samples, and
    the findings of this study cannot be generalised for the entire population. The
    study has reflected various experiences of people toward chatbots during COVID-19,
    but the results at some other time in different situations may also vary. To be
    perceived as inspiring and engaging, a mental health'
