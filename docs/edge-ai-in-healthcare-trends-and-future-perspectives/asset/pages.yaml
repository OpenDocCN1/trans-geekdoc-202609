  md: '# 6.3.1 CPU-BASED EDGE DEVICES


    CPUs represent a critical component while considering dispensation, in addition
    to control systems. CPU-centered edge devices offer the benefits of adaptability,
    low power, low cost, multitasking, and effortless programming. They are considered
    for universal instruction sequences as they follow inadequate parallelism. Multi-core
    devices include the Nvidia Jetson group (Alvarado et al. 2020), the AMD Ryzen
    group (Naffziger et al. 2021), and the Arm Mali GPUs (Gronquist et al. 2018).


    # 6.3.2 FPGA-BASED EDGE DEVICES


    FPGAs (field-programmable gate arrays) are incorporated circuits constituted via
    an architecture focusing on improvement of parallelism, through CPU-centered hardware
    devices, which are good for enormous parallel computations. CPU-based edge devices
    include the Arm Cortex-M (Alkim et al. 2016), the Raspberry Pi series (Severance
    2013), the Nano Pi series (Ma’anf et al. 2021), and the Speed MAX series (Hao
    et al. 2021).


    # 6.3.3 GPU-BASED EDGE DEVICES


    GPUs were initially considered in terms of image dispensation, apart from computation
    in respect to a parallel structure, yet are now progressively being used in accelerating
    AI jobs which have immense computing requirements. High enactment is achieved
    via parallelism and programmability; entrenched GPUs are unambiguously designed
    to have low power and be low cost, apart from which they predominate in numerous
    edge devices involved in deep-learning errands. GPU-based edge devices are a group
    of programmable logic blocks, which are quite effective in terms of application
    flexibility, for example, subsidiary subjective bit-width and conventional numerical
    set-ups (Darvish et al. 2020). They can accomplish more sophisticated tasks than
    CPUs (Biookaghazadeh et al. 2018; Nurvitadhi et al. 2017; Cass 2019). FPGAs frequently
    outpace GPUs in terms of low-latency intentions specifically for time-limited
    jobs (Shi et al. 2020) plus require fewer commands than CPUs or GPUs while delivering
    similar throughput. FPGAs though, are limited in terms of on-chip memory, while
    also exhibiting from low programmability. ASICs (application-specific integrated
    circuits) can apparently outpace other processors, with a considerable sophisticated
    computational output in addition to lower power consumption. ASICs are aimed at
    savings in terms of offsetting with the implementation of quality design and substantiation
    costs. ASICs, which are restricted to edge-AI applications, include Google Edge
    TPU (Liang 2020) and Ascend 310 AI processor (Reuther et al. 2020).


