    # ## 8.6 DICHOTOMY BETWEEN THE INTERNET OF THINGS (IOT) AND EMBEDDED SYSTEMS


    The Internet of Things should not be mistaken for embedded systems, as clearly
    seen in Figure 8.4. One may be confused at first appearance of the two domains
    but, after careful consideration, it becomes clear that they are completely different.


    # ### 8.6.1 EMBEDDED SYSTEMS


    With real-time processing limitations in some circumstances, embeded systems are
    controllers that serve a single operation as a part of a bigger mechanical or
    electrical system. Embedded systems are typically found as a component of a larger
    device that involves both physical and mechanical parts, as well as software and
    hardware implementation. Figure 8.5 shows the relationship between embedded systems
    and the Internet of Things. Many contemporary devices are under the control of
    embedded systems. Embedded systems employ more than 90% of the microprocessors
    that have been created. Microcontrollers, which are microprocessors with built-in
    memory and peripheral interfaces, are more frequently employed in contemporary
    embedded systems than are ordinary microprocessors, which need peripheral interface
    circuits and external memories (Noorpuri 2015).


    # ### 8.6.2 The Internet of Things (IoT)


    IoT, which stands for the Internet of Things, represents embeded technology (ET),
    network technology (NT), and information technology (IT). All that is required
    is the installation of NT and IT infrastructure to convert your embedded device
    into an IoT system. Your smart air conditioning system will have an embedded system
    called an ES (embedded system) that uses a WiFi module to transmit temperature
    data to the cloud (the internet) from a sensor. You need an embedded system like
    this. The WiFi network and the cloud are the two components of your'
  merge: -1
  img_proc: true
