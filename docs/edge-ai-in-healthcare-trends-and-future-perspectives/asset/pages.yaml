    # 2.3 UNDERSTANDING EDGE-AI


    The processing of artificial intelligence algorithms on the edge, that is, on
    the devices of users, is referred to as edge-AI. Its concept is founded on the
    same premise as edge computing: data are stored, processed, and managed directly
    at IoT endpoints. Because the data are processed locally for machine learning,
    the device does not need to be connected to edge-AI. The cloud model''s communication
    costs are considerably reduced as a result of this. In other words, it moves data
    and processes them to the user''s nearest point of dealings, whether it''s a computer,
    an IoT device, or an edge server (Gaba & Raw 2020; He et al. 2014; Kruse et al.
    2016). An example of this technology is The Google Homepod, Alexa, and Apple Homepod
    speakers. They use machine learning to learn words and phrases, which they then
    save locally on the device. When a user speaks with an AI assistant, such as Siri
    or Google, the audio recording is transferred to an edge network, where it is
    transformed to text, using AI algorithms, and returned to the user. Edge-AI addresses
    the privacy concerns associated with transmitting and storing massive amounts
    of data on the cloud platform and the bandwidth and latency limitations that limit
    data transmission capability. Many industries rely on edge technology; for example,
    driverless cars will reduce power usage by improving battery durability. It will
    also work with robots and surveillance systems (Azimi et al. 2017; Bierzynski
    et al. 2017). Artificial intelligence is transforming and improving a variety
    of essential processes in healthcare, and the potential is even more diversified
    and astounding. Chatbots and computer-aided detection (CAD) for diagnosis and
    analysis can assist physicians in better understanding illnesses and managing
