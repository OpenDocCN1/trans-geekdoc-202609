    # ## 2.1 INTRODUCTION


    Smart health monitoring frameworks provide services in many fields, such as hospitals,
    workplaces, and residences, to drastically reduce the cost of doctor visits while
    also improving overall patient care quality. Innovative healthcare services enable
    doctors to forecast, detect, diagnose, and treat diseases through intelligent
    remote handling and response to medical requests, reducing hospitalisation and
    supporting patients. Artificial intelligence (AI) can be used to prevent and control
    the spread of dangerous illnesses like as Ebola, avian influenza, and, most recently,
    the COVID-19 epidemic. Given the challenges, the development of effective, innovative
    healthcare services will surely promote the health of our society (Akmandon &
    Jha 2017). Intelligent healthcare systems integrate a variety of smart devices
    to meet the demands of many consumers. As a result, a vast volume of medical records
    created by smart devices must be accurately analysed. For this to happen, there
    needs to be effective communication between the intelligent healthcare data centers,
    so as to provide real-time responses to health'
