  md: '# 12.3.4 DEEP-NEURAL-NETWORK-BASED HEART DISEASE PREDICTION


    After the feature selection process, the selected features are given to the DNN
    classifier to classify data as either normal or abnormal. The DNN classifier is
    a typical structure that follows an ANN, which is a complex network model. But
    it can represent hierarchies in a simple form to create the model. Having ‘n’
    hidden layers, it processes the elements of data from the previous layer, that
    is the input layer. After each epoch, with the help of the learning rate “alpha”,
    the error of the input will be reduced gradually by weight adjustment of each
    node. This continued by back-propagation of the network when there is an error
    followed by fine-tuning until better results are achieved. Input can have any
    number of input nodes and there is no limit because the increase in input nodes
    will increase the learning process. As there are output nodes in the output layer,
    the number of outputs can be known individually. The step-by-step process of the
    deep neural network classifier is as follows:


    +   Step 1: Read the number of ‘n’ input nodes (F1, F2, F3 ... Fn) for the input
    layer. The number of input nodes is the same as the number of selected features.

    +   Step 2: Assign the number of layers in the hidden layer that need to be trained
    with data. The input layer and the hidden layer connected with the help of the
    weighted value which is represented as Wij^H . Similarly, the weight between hidden
    layer and output layer is represented as Wij^o .

    +   Step 3: Initialise the bias and learning rate values for each node and the
    weighting will be selected arbitrarily in forward-propagation.

    +   Step 4: Define the number of epochs to make values of the back-propagation
    from the output to the input direction.

    +   Step 5: In the first hidden layer, the weighted values of input are provided
    to the summing function with the bias of the neuron as in Equation 12.16.


    ```

    C_{H\_1}(i=1,2..,K) = \left( \sum_{m=1}^{M} W_{ij}^h R_m \right) + b_x \quad (12.16)

    ```


    Step 6: The activation function is applied to the output of the first hidden layer
    as:


    ```

    F \left( C_{H\_1}(i) \right) = \frac{1}{\left( 1 + e^{-C_{H\_1}(i)} \right)} \quad
    (12.17)

    ```


    where F(*) is the sigmoid activation function.


    Step 7: Similarly, the operation of n^th hidden layer output is calculated as
    follows:


    ```

    C_{H\_n}(i) = \left( \sum_{z=1}^{K} W_{ij}^o F \left( C_{H\_(n-1)}(z) \right)
    \right) + b_p \quad (12.18)

    ```'
