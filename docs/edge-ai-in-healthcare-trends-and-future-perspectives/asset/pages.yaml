  md: '# 7 Authentication of edge-AI-based smart healthcare system

    A review-based study


    Akanksha Upadhyay, Bhajneet Kaur


    # CONTENTS


    +   7.1 Introduction .................................................... 85

    +   7.2 A detailed review: Edge-AI-based smart healthcare system....... 86

    +   7.3 Conclusion .................................................... 93

    +   References............................................................ 94


    # 7.1 INTRODUCTION


    Artificial intelligence (AI) uses expert systems that can mimic human intelligence
    without requiring human input. In order to solve challenging challenges, AI is
    used to learn from prior experiences (Gupta & Nagpal 2020; Han & Han 2021). Most
    Internet of Things (IoT) applications have relied on cloud computing for data
    processing and storage to handle the enormous amounts of data generated by IoT
    devices on a regular basis (Yassine et al. 2019). One practical option for enabling
    IoT systems turns out to be multi-access edge computing, which offers storage
    and processing resources at the edge networks for low-latency and real-world applications
    (Porambage et al. 2018). Furthermore, EoT, or Edge-of-Things, for smart healthcare
    systems, was produced by the union of multi-access edge computing (MEC) and IoT.
    It has been discovered that blockchain, as a new paradigm, is more reliable and
    secure in lowering the risk of user or patient data being compromised (Pan et
    al. 2019). Utilising emerging technologies like Blockchain Edge of Things (BEoT),
    EoT, and IoT, cloud computing offers patient data tracking, health monitoring,
    drug inventory and management, among other services (Mutlag et al. 2019). Another
    emerging technology is the IoT, where data are transferred from edge computers
    to cloud servers to enable safe and optimal resource utilisation (Li et al. 2020).
    Security and authentication in modern technologies are among the most challenging
    issues. These systems now have the capacity to make decisions, and a breach might
    cause tremendous harm. In the healthcare sector, privacy is also a key consideration.'
