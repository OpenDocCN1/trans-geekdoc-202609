    a mental health chatbot is insufficient. Methods must contain patient-specific
    information that can be gleaned from medical records.


    # 11.7 CONCLUSION


    This study was used to identify different types of chatbots and identify the current
    themes of humans sharing with chatbots. The study was based on the qualitative
    approach, and a phenomenological unstructured, open-ended questionnaire technique
    was used to study the phenomenon. Thematical analysis was done to identify the
    themes and patterns for the study. The resulting sample identified seven themes,
    and four different chatbots which participants used to chat and discuss mental
    health.


