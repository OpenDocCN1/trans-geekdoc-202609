    An edge computing environment, combined with 5G speed and contemporary computing
    techniques, is one of the alternatives for enhancing performance and lowering
    power consumption for real-time data collection and analysis for healthcare (Vyas
    et al. 2022, 2023). Studies done in the past on healthcare have concentrated more
    on new fog architecture and sensors, ignoring the problem of best practices in
    computing utilised in on-device deployment in edge computing architecture. The
    primary goals of the study were to describe the device needs and concerns for
    various use cases, as well as to analyse current and new edge computing architectures
    and approaches for healthcare applications (Vyas et al. 2021, 2022). The suggested
