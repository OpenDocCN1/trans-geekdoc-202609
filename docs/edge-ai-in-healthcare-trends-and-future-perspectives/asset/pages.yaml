    computing:


    +   • **Performance of the backbone network.** Distributed edge computing nodes
    can handle a variety of calculation activities without transferring the underlying
    data to the cloud. This makes it possible to optimise the network’s traffic burden
    (Vyas et al. 2022).


    +   • **Agile service response.** Deployed edge-based intelligent applications
    (Artificial Intelligence of Things, AIoT) may dramatically speed up reaction times
    and reduce transmission delays.


    +   • **Strong cloud backup.** The cloud may offer strong processing power and
    vast, scalable storage under circumstances when the edge cannot afford it.


    Since data are being generated at the network’s edge more often, processing it
    there would be more effective. Edge computing, with its benefits of lessening
    the burden on cloud computing, lowering service latency, and minimising data transfer,
    is therefore a crucial option to break the bottleneck of developing technologies
    (Anand et al. 2022).


