    +   - \( P_F \rightarrow \) Position of female lion,

    +   - \( D_d \rightarrow \) Distance between the female lion and the point chosen
    by tournament selection among the pride territory,

    +   - \(\{SP_1\} \rightarrow \) Previous location of female lion and its direction
    is towards the selected point,

    +   - \(\{SP_2\} \rightarrow \) Perpendicular to \(\{SP_1\}\).


    **Step 4: Roaming operation.** Roaming is a solid local search and helps the lion
    optimisation algorithm to search for a solution to enhance it. The lion pushes
    towards the chosen region of region by ’n’ units, where ’n’ is a random number
    with uniform distribution.


    ```

    \( n \sim U_d(0, 2 \times D) \) (12.9)

    ```


    ''D'' indicates the distance between male lion position and the selected area
    of territory.


    Also, nomad lions move haphazardly in search of space. The new position of nomad
    lions is produced as follows:


    ```

    \( L_{ij} = \left\{ \begin{array}{ll} L_{ij} \text{ if } rand_j > prob_i \\ RAND_j
    \text{ otherwise} \end{array} \right. \) (12.10)

    ```


    Where \( L_{ij} \) is the current position of the nomad lions and \( rand_j \)
    is the uniform random number between [0, 1].


    \( rand(j) \) is the random generated vector and \( prob_i \) is the probability
    value.


    The probability value ia calculated for every nomad lion independently as described
    in 12.11:


    ```

    \( prob_i = 0.1 + min \left( 0.5, \frac{(N_{O_i} - Bst_{N_{O_i}})}{Bst_{N_{O_i}}}
    \right) i = 1, 2, ... M \) (12.11)

    ```'
