  md: 'Simulation is a useful analysis approach for developing, maintaining, evaluating,
    and improving a system or process. There are numerous instances where we have
    leveraged modeling and simulation techniques for edge-AI in healthcare. Some of
    them are briefly explained below.


    +   1) Reduce transportation time and accelerate assignment to hospital during
    serious crisis. Natural disasters have devastating consequences, necessitating
    a quick evacuation response to mitigate the severity of the consequences. The
    main objective of this research is to reduce overall transfer time of the injured
    in order to reduce human losses (Vyas et al. 2019). They manage the “Integrated
    Problem of Ambulance Scheduling and Resource Assignment”, also known as IPASRA,
    in case of a disaster. They present a mathematical model to succeed by a branch
    and cut algorithm under the CPLEX solver, with a resolution that performs better
    than the meta-heuristic method and is based on grounding of a hybrid algorithm
    based on tabu search and “Greedy Randomised Adaptive Search Procedure”, also known
    as GRASP. The problem is divided into two subparts: the first is concerned with
    treating and scheduling the problem statement, wheras the second one focuses on
    resource assignment for the problem. Tabu search works on the principle of penalising
    movements that transport the solution to previously searched areas. GRASP is a
    meta-heuristic method which is often used to solve combinational optimisation
    issues. It can generate optimal solutions within seconds, and this speaks for
    its capability and reliability.


    +   2) Carbon footprints in emergency departments. By considering shortening the
    standby time and length of stay as limits to leveling up patient satisfaction,
    the OptQuest optimisation approach has been used to reduce greenhouse gases and
    carbon footprint in patient flow to the emergency department. Evaluation and optimisation
    of the Carbon Foot Prints (CFP) in the patient flow is the main motivation for
    this research, so medical supplies and the time spent using medical practices
    at every care unit are considered during the treatment process. Discrete-event
    simulation (DES) is used to make decisions about patient flow in the examined
    hospital, and the Arena14.0 package is used to simulate the system.


    +   3) Distinct event representation in healthcare system. This is one the most
    powerful and versatile tool for examining a variety of challenges in healthcare
    systems, involving dimensioning of capacity, flow management of patients, allocation
    of staff, and scheduling of activities. However, in practice, it is facing failure
    due to the features and environment of implementation. The focus of it in healthcare
    is on healthcare features that are sources of uncertainty.


    +   4) A robust operating theater scheduling algorithm. In order to assist operating
    room administrators in creating reliable schedules, this study developed a robust
    bi-objective algorithm that takes into consideration the uncertainty of surgery
    and recovery times. It is susceptible to data inconsistency to a small extent.
    It allows minimisation of two goals'
  merge: -1
  img_proc: true
