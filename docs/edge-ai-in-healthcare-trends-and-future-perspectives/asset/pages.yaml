  md: 'incorporation of a fully functional crypto coprocessor, secure element, or
    trusted execution environment would be the ultimate step. This kind of secure
    element can carry out all security and cryptographic operations inside its own,
    trusted zone of security. It’s a constant struggle for designers to incorporate
    more security modules into a single system. When updating an old product or creating
    a whole new product line, design architects frequently opt for the simplest but
    most comprehensive option to integrate. With first-generation designs, integrating
    several IPs is essentially unavoidable, since the size and feature sets of such
    security modules/IP will vary depending on the chosen degree of protection. This
    frequently results in security being seen as top-down, starting with cryptographic
    algorithms, and concluding with key storage as the final component. However, this
    strategy poses some significant issues.


    When IPs come from different providers, there is additional integration work to
    be done in addition to creating and maintaining a security border covering multiple
    IPs.


    Even with an edge-AI SoC, ease of integration is crucial when adding security
    to a system. Power consumption, however, is a special and significant factor for
    edge-AI-Driven Security Operations (AISoCs) because edge devices are deployed
    in the field. Unfortunately, this goes directly against the demand for increasingly
    complex computation-related functions that must be performed at the edge. As a
    result, people looking for greater performance and reduced power consumption are
    increasingly drawn to using more advanced process technologies (Hayyolalam et
    al. 2021).


    A growing number of edge-AI SoC designs are using 12/16 nm process nodes, which
    hit the sweet spot for computation power, current consumption, and cost, according
    to current market trends. The two significant difficulties previously identified
    are addressed by PUFsecurity’s PUFcc secure crypto-coprocessor IP. PUFcc is built
    on a hardware root-of-trust (HRoT) that incorporates secure storage and entropy
    sources. NIST-CAVP- and OSCCA-certified crypto engines are then added, and everything
    is protected by an anti-tampered shell. Due to PUFcc’s ability to offload secure
    processes that would otherwise burden the main core, system performance is enhanced
    while power usage is reduced. Figure 17.3


