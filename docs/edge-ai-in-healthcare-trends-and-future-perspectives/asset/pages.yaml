    # 8.10 CONCLUSION AND FUTURE WORK


    The Smart Wheelchair is a practical response to the requirement of society for
    sophisticated and intelligent Assistive Technology that is both useful in general
    and specific circumstances, such as pandemics. It made use of infrared sensors
    during the pandemic emergency to carry out social seclusion and obstacle avoidance
    techniques. If the wheelchair user''s temperature and heart rate rise beyond a
    set normal threshold, an alert message is transmitted to the selected people.
    The AIoT enables these processes to be performed with the least possible latency.
    Smart Wheelchairs can be employed inside now that access to drop-off areas is
    more constrained. The first usable Smart Wheelchair will be marketed as a tool
    that can function on its own inside but needs assistance outside or in unmodified
    interior situations. More areas will be accessible to Smart Wheelchairs as sensor
    technology develops. Therefore, it makes sense to consider usability, mobility,
    and affordability as key components for future developments in Smart Wheelchairs.
    The Internet of Things has helped to tackle many issues, and new AIoT innovations
    are expected to boost Smart Wheelchair technology and help the disabled during
    emergencies, like pandemics. To support the disabled during pandemics'
