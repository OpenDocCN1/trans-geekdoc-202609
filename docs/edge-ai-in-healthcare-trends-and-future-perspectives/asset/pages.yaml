    # 8.8 MODULES COMMON TO THE AUTOMATED WHEELCHAIR AND THE SMART WHEELCHAIR


    The Department of Scientific and Industrial Research (DSIR) of the Government
    of

    India approved the “Automated Wheelchair (AWC) for the Physically Challenged”

    project, which is what gave rise to the “Smart Wheelchair” study. Following the

    COVID-19 outbreak, the Ministry of Social Justice and Empowerment published

    regulations on 27 March 2020to prevent the infection of individuals with dis-

    abilities. Despite this, the lockdown was extremely difficult for persons with
    dis-

    abilities. There have been several examples encountered during the COVID-19

    lockdown that served as inspiration for the design of the Smart Wheelchair. This

    project aims to keep disabled individuals in the public eye and aid them in their

    fight against COVID-19. Smart Wheelchair concentrates on offering aid and assis-

    tance particularly to disabled people suffering from COVID-19 or any pandemic

    in general, in contrast to AWC (Automated Wheelchair), which is made for gen-

    eral use by the disabled. The approved AWC project helps quadriplegics become

    independent. People who are quadriplegics are unable to move all four limbs.

    Automated Wheelchair (AWC) is the basic tenet upon which Smart Wheelchairs

    are built. Several typical modules include:


    +   1) Global Positioning System (GPS) and Bluetooth

    +   2) GPS-based real-time positioning

    +   3) Accelerometer for a wiper motor

    +   4) Module for head motion recognition

    +   5) Module for detecting obstacles

    +   6) Sensor-based module


    The modules mentioned above are present in both SWC and AWC. To accumulate

    the smart features that can make the SWC useful in aiding the disabled, several

    AIoT-related modules are also overlaid on the device.'
