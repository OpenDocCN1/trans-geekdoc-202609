    # 17.5 IOT HEALTHCARE MONITORING SYSTEM WITH EDGE-AI


    Healthcare edge networks have undergone substantial innovation and progress. Based
    on the literature, we have determined certain fundamental needs and problems that
    arise when constructing such systems. These same issues are what our solution
    aims to solve.


    Security. Information about a healthcare scenario refers to people''s particular
    medical conditions. These data must be secured since they are extremely important
    and pose a privacy risk. Even if the IoT devices are believed to be reliable,
    there is a potential that the data could be intercepted or falsified during transmission
    over the network. Therefore, it is essential to find a solution to the system''s
    security problem.


    Ownership. The information must originate from the legitimate source and not from
    a hostile device. A system for authentication is therefore required. IoT devices
    have limited processing and storage capacity. These gadgets contain embedded sensors,
    but they lack sufficient processing power for data analysis and memory to store
    the vast volumes of data produced. These duties require outsourcing (Vyas & Gupta
    2022).


    Response. Health data must be constantly tracked, and any emergency scenario must
    be quickly discovered and reported to a doctor for prompt treatment. In urgent
    or dangerous circumstances, such as a heart attack or paralytic stroke, time is
    particularly crucial. So that he/she can swiftly recommend a plan of action, the
    doctor must be informed as soon as possible. Therefore, it is best to keep the
    overall time needed for data transfer, processing, notification, and resolution
    to a minimum (Vyas et al. 2022).


    Data analysis. To find patterns, make diagnoses, and recommend treatments, an
    intelligent system must be created.


    Data communication. For other practitioners to make use of a single system, it
    is crucial to share the data as well as any crucial conclusions or models produced.
    High-quality sensors are required to efficiently capture data on heart rate, body
    temperature, respiration, images, speech, and other factors. Data collection from
    diverse IoT devices is standardised because each one has different hardware, which
    also affects the data formats. It''s important to comprehend and send the accurate
    values of data obtained from IoT devices. In this direction, it is vital to standardise
    the data format.


    # 17.6 CONCLUSION


    The cutting-edge technologies edge-AI and the Internet of Medical Things (IoMT)
    are currently being used in numerous connected healthcare applications in smart
    cities. The usage of these technologies for linked healthcare monitoring and management
    can also be very advantageous because it can decrease the'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'amount of labor-intensive human work and improve management performance.

    The difficulties, possibilities, and uses of edge-AI for linked healthcare in
    smart

    cities have been thoroughly analysed in this study. An edge IoT healthcare monitoring

    system with edge-AI capabilities is the suggested solution for future systems

    (Vyas 2023). The system’s main purpose is to schedule patients in real time.

    In addition to allocating resources according to a person’s health or category,
    it

    prioritises the provision of resources, including doctors, medications, ambulance

    services, blood, intensive care units, and medical equipment like X-ray machines.

    IoT devices with AI capabilities that are attached to the patient first collect
    vital

    indicators. These data can be analyzed and stored on the edge server because it

    has the processing power and memory needed. The edge node launches a sched-

    uler, immediately monitors the data, and releases medical resources as necessary.

    If the desired resources are not accessible, an edge controller receives the request

    and uses peer nodes linked to other hospitals to provide the requested resources.

    The design makes the resources instantaneously and securely available in this

    way.


