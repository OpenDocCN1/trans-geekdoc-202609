  md: 'been gathered incidentally for their primary goal. In this situation, the data
    collector must get extra consent from the data subjects to comply with data protection
    regulations. Then again, the data minimisation rule poses another challenge. Finally,
    transparency and the right to information are the two issues that provide the
    greatest challenge to data protection compliance (Asan et al. 2020).


    Many scholars believe the solution is simple as they state that, in the involvement
    of automated data process, the data controller must give the data subject meaningful
    information about the logic involved, as well as the significance and the anticipated
    consequences of the processing of the personal data (Murdoch 2021). However, the
    right to explanation, in principle, is not that simple to comprehend. The question
    here is how to convey the message to the data subject as to what amount of “relevant”
    information regarding the underlying logic should be disclosed to the data subject.
    What will happen if the hackers understand the system and the patterns of AI?
    Are there more threats to data security if the information of AI processing is
    disclosed with the data subject? These questions should be evaluated from the
    viewpoint of the person requesting the information as it is somewhat subjective
    in nature. Hence, when striving to adhere to international data protection standards,
    healthcare practitioners who use personal information for AI may experience difficulties
    (Murdoch 2021).


    Several nations even have stringent data protection regulations that prohibit
    the use of AI and automated decision-making when making decisions concerning personal
    data (Wachter et al. 2017). Healthcare providers trying to adhere to the fairness
    principle may face difficulties due to the intricacy of the AI approaches being
    deployed. Also, skewed results may be caused by inadequate data, data oddities,
    and algorithmic mistakes. An algorithm that uses information from one region of
    the world, for instance, might not work well elsewhere. As a result, the GDPR
    advises organisations using automated data processing, such as AI, to take certain
    precautions, such as using the right mathematical or statistical techniques for
    profiling, putting in place organisational and technical measures to address causes
    of inaccurate personal information, and reducing the likelihood of errors (Casey
    et al. 2019). The Federal Trade Commission (FTC) Guidance mandates that healthcare
    industries using AI must ensure that their decisions are fair, requiring them
    to give patients/consumers access to and control over information used in decision-making
    and implement access controls and other safeguards to protect their algorithms
    from unauthorised use (Wagner 2020).


    # 14.3.2 LIABILITY REGIME


    The liability and the legal obligations of people involved in developing AI technologies
    remain as one the fundamental questions when analysing the legal framework for
    edge-AI. There is a general belief among legal practitioners that investors or,
    more generally, producers acting on behalf of investors, should be held firmly
    accountable for any flaws in AI technology (Čerka et al. 2015). That should also
    be taken to mean that they are responsible even if the flaws are discovered after
    the product has been used, providing they are in charge of technical'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'software updates (Čerka et al. 2015). Hence, in most cases, strict liability
    will be imposed on the producer of the edge-AI products, regardless of whether
    those defects are based on hardware or software.


    Edge-AI innovations and products will also be subject to the general rule of product
    liability. The general principles related to product liability dictate a fair
    distribution of risks and benefits resulting from commercial production, which
    calculates the costs of individual harm and an attributable responsibility for
    the prevention of harm (Schönberger 2019). This means that, if it is established
    that a specific AI product has caused harm, the burden of proving that the producer/
    investors have done everything appropriate to prevent harm lies with them. In
    any case, the investor is still liable if the flaw stems from software, hardware,
    or service offered with the product (Bathaee 2020). Hence, the responsibility
    of timely updates, of both software and hardware, lies with the producer/investor
    even after the release of the edge-AI system to maintain the required level of
    safety and efficacy. In the case of edge-AI, it is always challenging to forecast
    a product’s performance due to the interconnectedness of appliances and cybersecurity
    concerns. As the edge-AI system connects different devices, the system will have
    to accommodate different devices manufactured by different companies/manufacturers.
    Hence, applying product or strict liability provides a broad framework but does
    not specify specific legal/practical concerns.


    It is also hard to perceive the level of safety a user is entitled to anticipate
    due to the unpredictable nature of edge-AI systems. The same holds true for determining
    anything that may be categorised as a failure to achieve the desired degree of
    safety in the system. These traits may lead to circumstances in which it is simpler
    for the producer to substantiate important data. The imbalance between the investor,
    the producer acting in their capacity, and the user (healthcare providers) supports
    shifting the burden of proof to the user to prove that the system failed to perform
    with the standard criteria. Additionally, the user’s/healthcare provider’s responsibility
    to decide on the edge-AI system outcome relies on the probable accurate function
    of the system. Hence, if the system fails, the medical decision taken by the user
    will also fail, so that it will be easier for the aggrieved party (patient) to
    bring a legal suit against the healthcare provider rather than bringing a lawsuit
    against the producer/manufacturer/investor. (Reed 2018). Producers must therefore
    ensure that the design, description, and marketing of edge-AI devices enable operators
    to carry out their responsibilities. The rules requiring operators to perform
    their duties comprehensively have been implemented in several jurisdictions under
    tort law, mainly in common law countries (Cabral 2020; Sullivan & Schweikart 2019).
    Software developers should be held accountable for the harm caused by flaws in
    their services, much like manufacturers of digital technology goods and services
    (Schönberger 2019). Hence, there are three main aspects of liability in this edge-AI
    environment that ought to be considered for implementation.


    First, there should be a mandatory liability to ensure that victims may obtain
    compensation and that prospective tortfeasors are protected from the danger of
    liability in situations where there is a possibility that third parties may be
    exposed'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'to an elevated risk of injury. Second, as healthcare is a sensitive industry,
    a more refined duty of care should be imposed on the manufacturer, user, operator,
    and developer, which will eventually help the victims with the claim of damages.
    Third, the burden of proof should initially lie with the manufacturer, operator,
    and developer that they have taken standard measures to ensure the safety of the
    system and the patient, and, if they fail as such to prove, the victim/aggrieved
    party should receive compensable damage.


    The appropriate and just response of law and regulatory requirements to the liability
    questions should be worked out regardless of the complications imposed by the
    edge-AI in healthcare. Nevertheless, the policymakers should not hesitate to make
    any essential modifications and alterations to the current liability regimes to
    introduce a more comprehensive legal and regulatory structure of edge-AI. It may
    be necessary to develop several solutions rather than a single, all-encompassing
    one, taking into account a wide range of dangers linked with edge- AI and its
    numerous intricacies. However, notwithstanding the diversity of available options,
    identical risks should be covered by equivalent liability structures. These rules
    should eventually make it apparent whether losses are recoverable and to what
    amount. Both product and strict liability should continue to exist, as with other
    available remedies. That ought to make it possible for a victim to file claims
    for damages against many defendants. Rules on numerous tortfeasors should thus
    apply. Additionally, contractual liability or other compensation regimes may apply
    alongside or in place of tortious responsibility.


    # 14.3.3 CONSUMER PROTECTION


    In AI-driven healthcare, the patients as customers/consumers need special consideration.
    In many scholarly discussions on patient empowerment and involvement, the terms
    “patient” and “consumer” are sometimes used interchangeably (Goldstein & Bowers
    2015). However, the question arises whether the two phrases represent the same
    thing, or is a “consumer” an informed, deliberate decision- maker and a “patient”
    a passive player in the healthcare system? However, the recent commercialisation
    of healthcare dictates that the two words correspond to one another. Hence, when
    we talk about AI-driven impact on patients, we should also understand how patients
    as a consumer would fit into the technological transition. Generally, there are
    several concerns about the consumer’s position in the algorithmic environment,
    which include the increased vulnerability in biased decision-making, invasion
    of privacy, deception, commercialisation, and exploitation.


    Consumer protection through EU legislation primarily aims to protect consumers
    by taking control over the decision-making process with adequate information (Busch
    et al. 2016). The law also enshrines the principles of transparency, freedom of
    choice, equality, etc. (Busch et al. 2016). Most of the consumer protection laws
    address specific consumer protection issues in banking, real estate, tourism,
    or other financial institutions. There are, however, additional regulations that
    are more general in nature and that, regardless of how particular they are,'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'must be implemented in all AI-enabled systems, even the healthcare industry.
    For example, in the EU, directive 2019/216/EU on better enforcement of consumer
    protection, directive 2011/83/EU on consumer rights, and directive 2005/29/EC
    on unfair commercial practices (UCPD) may be similarly applicable for edge-AI-driven
    healthcare system.


    Our goal is not to analyse these legal acts in-depth but rather to pinpoint the
    pertinent concerns from the consumer’s or user’s perspective of edge-AI-based
    healthcare services or products and place them within the context of the current
    legal framework, which is meant to offer some guidance on the moral and legal
    use of algorithmic systems. The following broad principles of consumer law should
    be advantageous to patients, with protection of the weaker party, controlled autonomy,
    non-discrimination (equal treatment), and privacy. Autonomy and privacy data protection
    seem to be the most crucial ones when we talk about edge-AI in healthcare.


    The term “autonomous consumer” refers to a person who makes decisions independently
    and considers all available information and possibilities (Jablonowska & Palka
    2020). Consumers should receive clear information on the usage, features, and
    qualities of acquired items when it comes to edge-AI-enabled healthcare services,
    just like they would in any other type of transaction. That means that even an
    edge-AI healthcare system should provide a patient with the option to choose whether
    he or she wants to be admitted to a hospital or, if yes, which one he/she wants
    to choose. It is not always that the physician will be notified by the AI system
    that his patient is in a vulnerable condition, and the physician can take automatic
    medical decisions on behalf of the patient. It is also important that the patient
    provides consent to be the subject of algorithmic analysis, which is based on
    the data provided by the patient. If the researchers require to save the data
    and reuse it for research purposes, it is equally important that they have taken
    the consent from the patient.


    # 14.3.4 INTELLECTUAL PROPERTY


    There are several ways in which intellectual property law, AI, and healthcare
    are closely related. AI-related products’ patentability may significantly affect
    how businesses in the healthcare industry safeguard their intellectual property,
    particularly their patents. Recent healthcare-related choices have made the problem
    even more complicated. The various intricacies involved in patenting AI and ideas
    produced by AI are highlighted by a recent Western District of Texas ruling in
    the US regarding machine-learning technology (Ben-Ari et al. 2017). A Texas court
    ruled in Health Discovery Corp. v. Intel Corp. that two patents covering the use
    of extremely sophisticated machine-learning systems, to aid humans in intelligently
    and automatically analysing and finding patterns in genes and other biological
    systems, were directed to non-patentable subject matter under 35 U.S.C. 101. In
    Alice Corp. Pty. v. CLS Bank Int’l, 573 U.S. 208 (2014), the Supreme Court outlined
    multiple processes for deciding whether a patent application asserts an unpatentable
    idea (Hsiao 2019). The Court must look at whether a'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'claim of the patent is classified under the natural laws or it is just an abstract
    concept; if it is an abstract idea, then the Court must analyse the claim''s character
    and its usefulness sufficiently to qualify as a patent-eligible application (Hsiao
    2019). The second phase is often met when a patent claim is made for the healthcare
    industry (Hsiao 2019). Due to the difficulty in determining whether a patent actually
    covers invalid subject matter or not, Alice Corp.''s application by the courts
    remains unpredictable and inconsistent, especially in the case of the healthcare
    industry (Hsiao 2019).


    Health Discovery Corp. contributes to further guidance on Alice''s application
    to AI, despite the fact that patenting in healthcare industry is still challenging
    (Hsiao 2019). When it comes to AI, a claim must be made that “improves an existing
    technical or computer feature” in order for it to be patentable (Hsiao 2019).
    For instance, just enhancing a process with computer capabilities to make it faster
    or more effective does not make an otherwise abstract notion patentable. Furthermore,
    a claimed invention does not automatically become patentable only because it produces
    better data quality or accurate information as compared with traditional techniques.
    In reality, a judge is more likely to agree that a machine-learning invention
    qualifies for patent protection when the claims are expressed as an advancement
    of a novel idea, such as a new piece of hardware or software (Hsiao 2019). However,
    where the claims are made in terms of improvements to a mathematical algorithm
    rather than improvements to a technology that uses a mathematical algorithm, as
    was the case in Health Discovery Corp., the invention is more likely to be deemed
    to be just an improvement of an abstract concept.


    According to conventional wisdom, patents promote inventive and creative labor
    by granting inventors monopoly (or exclusive) rights over their ideas for predetermined
    amounts of time. The patent system plays a significant role in fostering technical
    advancement. There is also a different viewpoint, which states that the societal
    costs connected to patent rights have largely been overlooked while the incentives
    they give have been greatly overstated (Roin 2014). Nevertheless, whatever it
    is, we cannot deny that the major technology players will not jump to edge-AI
    in healthcare and develop the overall technology if they do not see the commercial
    benefits. By limiting access to individual ideas, patents effectively provide
    the effort that is needed to achieve their full potential value. In the fast-paced,
    knowledge-driven, and highly interconnected world, novel ideas and inventions
    tend to have very short shelf lives. Hence, it will need the combined efforts
    of a sizable network of participants to access one another''s knowledge and ideas
    to realise commercial value from these discoveries in a reasonable amount of time.
    The era of innovation requires an easy patent process to safeguard the information-driven
    healthcare industry. However, the establishment of a seamless patent process remains
    a monumental aspiration and challenge for the healthcare industry.


    # 14.4 POLICY RECOMMENDATIONS


    Generally, the existing legal provisions worldwide ignore historical disparities
    that have impeded the development of AI technologies and led to uneven access'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'to digital resources (Mohamed et al. 2020). Legal implementation of edge-AI
    also has further technical challenges. For example, it is important to understand
    how the law would work when healthcare providers over-rely on or over-interpret
    AI; how patients perceive the utilisation of edge-AI; how data are collected,
    analysed, and updated to achieve the best possible performance, etc. Some of the
    policy recommendations in the following subsections might answer some of the above
    questions.


    # 14.4.1 AI AND LAW LITERACY


    Ethical and legal principles of AI mandate that healthcare providers inform the
    patients directly about automated data processing. For instance, Articles 13 and
    14 of the GDPR mandate that healthcare providers notify people when automated
    decision-making, such as profiling, is being used and where such decision-making
    may have substantial implications for the data subject''s rights or other interests.
    Regulators have not yet provided instructions on how much data users of AI must
    disclose about their algorithms. Most of the time, firms can give people enough
    information regarding AI and other automated processing. Organisations are seen
    to gain more credibility and face less objection to their use of personal information
    if they are more open about how AI functions and the functions it serves. This
    situation will be like the healthcare services as well. When developing edge-AI,
    healthcare providers may encounter difficulties defining the purpose of processing
    because it is impossible to foresee what algorithms will learn and how the resulting
    data will be used. For instance, algorithms could find unexpected relationships
    that allow for new uses of the data. Healthcare providers must constantly evaluate
    whether they are using personal data in AI for the same or similar reasons to
    those that were communicated to the data subject when the data were being collected.
    They must amend their privacy notifications to reflect the new processing purpose
    and take one or more steps if the new processing is incompatible with the original
    purpose, which are gaining renewed consent and discovering a different legal justification
    for the processing. Healthcare providers must determine in advance the range of
    data that will be important and essential for creating an effective algorithm.
    Overall, an appropriate and just response of law and regulatory implementation
    to data protection, liability, consumer protection, and intellectual property
    are required in relation to edge-AI in healthcare.


    # 14.4.2 STANDARDISATION


    Standards for AI-based products have been published or established by international
    standards organisations (ISO and IEC, CEN/CENELEC) (Sharkov et al. 2021). Work
    on standardisation covers topics including software testing for AI, ethics and
    human issues, and neural network robustness (Sharkov et al. 2021). These standardisations
    aim to establish more rigorous criteria that may apply to a wide range of AI application
    fields, not just healthcare. Furthermore, a lot of well-known general standards,
    including those for quality management (ISO9000'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'series), medical software lifecycle standards (IEC 62304), software testing,
    health software safety and security (IEC 82304), human usability of medical devices
    (IEC 62366), and medical device risk management (ISO 14971), contain some content
    that is highly pertinent to the development of AI-based products and conformity
    evaluations.


    # 14.4.3 RESEARCH


    Even while the ethical disparities brought on by AI are receiving attention, such
    as the potential for AI to either eliminate or raise inequalities or racial prejudices
    in healthcare with new paradigms, the legal implications have not yet been examined
    or addressed. However, it is vital to remember that the legal challenges of health
    AI or edge-AI in healthcare are not entirely different from the legal challenges
    of AI implementation in other industries.


    # 14.5 CONCLUSION


    Edge-AI in healthcare still needs human interaction, which might cause problems,
    even if it depends on computers, math, and technology to function. Additionally,
    AI models might be faulty, just like any other digital health technology, posing
    dangers to patient safety. These flaws may result from a variety of sources, including
    errors with the data needed to create the algorithm, the decisions made by programmers
    while creating and training the model, and the final implementation of the AI-enabled
    program – all of which include human participation. We still need to understand
    the effects of edge-AI on healthcare, as the technology is still relatively new.
    The extent to which healthcare providers must inform patients about the intricacies
    of AI, particularly the types of data inputs and the potential for biases or other
    flaws in the data being utilised, is a crucial ethical question to be considered
    in this context. Developers must ensure two critical factors in order to fully
    exploit the potential of edge AI: (1) The authenticity and trustworthiness of
    the data sets; and (2) Transparency. The datasets must first be valid and dependable.
    The performance of AI will improve with greater testing and training. Transparency
    is crucial, too. Although, in a perfect world, all data and algorithms would be
    made available to the public, there are real concerns about safeguarding healthcare
    data as they are sensitive in nature, while also avoiding an increase in cybersecurity
    risk. Additionally, AI software developers must be sufficiently open and honest
    about the types of data utilised and any software flaws.


