    # ## 14.1 INTRODUCTION: BACKGROUND AND DRIVING FORCES


    The introduction of artificial intelligence (AI) and its recent developments have
    fundamentally changed how society functions. It brings up a wide range of possibilities
    for enhancing the quality of life in all spheres, from education to healthcare
    to banking and financial industries, by ensuring efficient automation and control
    over technological factors. AI has several advantages for the healthcare industry,
    including better monitoring with intelligent sensors, instant access to vital
    signs, remote health monitoring, and effective disease diagnosis (Davenport &
    Kalakota 2019).


    Pandemic conditions like COVID-19 provide us with a dimension to prepare for a
    new healthcare era (Naudé 2020), in which the healthcare service providers need
    to utilise technologies for early illness diagnosis, which eventually will lead
    to effective treatments capable of saving lives (Islam 2021). It can be done even'
