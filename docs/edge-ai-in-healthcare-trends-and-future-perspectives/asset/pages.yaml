    for immediate medical attention if you have first- or second-degree contact with
    a COVID-19-infected person. The self-assessment test can also be used to determine
    infection risks.


    # ## 8.3.3 CHALLENGES FACED BY AAROGYA SETU TO ASSIST QUADRIPLEGICS


    To aid customers in better managing their own health, large numbers of mobile
    health (mHealth) apps have been developed during the past ten years. But very
    few of these mHealth apps were created with the disabled group in mind, and even
    fewer have had their accessibility for people with disabilities tested. Because
    of this, it might be challenging for those with impairments to use many of these
    mHealth apps (Zhou et al. 2020). Unfortunately, those who are blind or deaf'
