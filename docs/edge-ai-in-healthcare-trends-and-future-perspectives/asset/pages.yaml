  md: '# TABLE 15.1

    Classification of robots used in healthcare (Fosch-Villaronga & Drukarch 2021)


    | Sl. No | Robots used in healthcare | Examples |

    |---|---|---|

    | 1. | Surgical robots | Surgery robots, surgery automation, telesurgery robots
    |

    | 2. | Socially assistive robots | Therapeutic robots, care robots |

    | 3. | Physically assistive robots | Rehabilitation robots, nurse-assisted robots
    |

    | 4. | Healthcare service robots | Routine task robots, nurse-assisted robots,
    disinfectant robots |


    # 15.4 ROBOTICS IN HEALTHCARE


    In healthcare contexts, physical robotic devices are integrated with cloud-based
    services. The legal and regulatory ramifications of the increasing interaction
    and interdependence between physical and virtual elements in cyberphysical systems
    for use in healthcare are becoming more apparent (Fosch-Villaronga & Drukarch
    2021). The need to increase access to healthcare and the desire to enhance patient
    outcomes and prevention are the two main social objectives for better health care
    that robotic technology can address. Robotic technology has demonstrated a significant
    potential for accelerating the development of novel treatments for a wide range
    of diseases and disorders, expanding the quality and accessibility of care, and
    improving patient outcomes (Fosch-Villaronga & Drukarch 2021). The usage of robots
    in the healthcare industry spans a range of autonomy levels and also includes
    associated technology, such as sensor systems, data-processing algorithms, and
    cloud services as listed in Table 15.1 (Fosch-Villaronga & Albo-Canals 2019).


    # 15.5 MONITORING HEALTH THROUGH WEARABLES AND PERSONAL DEVICES


    Wearables are electronic technology or devices built into clothing that can be
    comfortably worn on the body. Wearable technology is a general phrase for such
    electronics. These wearable tech gadgets are used to track data in real time,
    as shown in Figure 15.2. They have motion sensors that capture an image of your
    daily activity and sync it with laptops or mobile devices. Although there are
    many kinds of wearable technology, activity trackers and smart watches are among
    the gadgets most often used. Apple Watch, Fitbit, chest straps, shoes, helmets,
    glasses, lenses, rings, patches, textiles, hearing aids, etc., act as administrators
    of healthcare or as professionals keeping an eye out for worrying patterns that
    call for treatment (Chawla 2020).'
  merge: -1
  img_proc: true
- pgno: 236
  md: '![](img/28baab106dba0e70a2f26ab75f61f184_236_0.png)


    # FIGURE 15.2 Wearable device application model.


    Some gadgets merely urge users to update friends and colleagues on their health
    progress via social media platforms, whereas a patient''s physical changes can
    be immediately detected by a wearable medical gadget. Numerous industries have
    been impacted by wearable technology, but the healthcare industry has benefited
    the most (Chawla 2020). Figure 15.3 demonstrates how wearable device can predict
    health problem.


    Hospitals and clinics can benefit on a variety of levels and in a variety of roles
    by implementing wearable technologies. Some of these advantages are outlined in
    the following subsections.


    # 15.5.1 PROMOTES PREVENTIVE HEALTHCARE


    There is promise of a more pro-active approach to healthcare with wearable technology.
    This is because wearables can be used to act before health issues become serious
    rather than reacting to them after they have already started to cause difficulties.
    Health abnormalities can be found in those who are already predisposed to them
    before they become concerns (Sabry & Tamer 2022).'
  merge: -1
  img_proc: true
- pgno: 237
  md: '![](img/28baab106dba0e70a2f26ab75f61f184_237_0.png)


    FIGURE 15.3 Wearable devices can predict health problems


    # 15.5.2 Ensures patient engagement


    If people can utilise wearable technology to monitor themselves, they will be
    considerably more interested in their own health. Users will have access to real-time
    data that is continuously gathered through a wearable device, allowing them to
    be informed about their own health situation (Sabry & Tamer 2022).


    # 15.5.3 Monitors patients who are at risk


    Wearable technology can be used by healthcare professionals to monitor vulnerable
    people who are more likely to have medical problems. Wearable technology can be
    used to keep an eye on them at home if they are in danger but not seriously unwell
    enough to be in hospital (Sabry & Tamer 2022).


    # 15.5.4 Enhance patient satisfaction and care


    Wearable technology gives surgeons and doctors the vital information they need
    to make better decisions while expanding the chance to connect with patients,
    such as the use of smart glasses to monitor patient vitals and pertinent data
    while carrying out surgery without looking away from the patient (Sabry & Tamer
    2022).


    # 15.5.5 Benefits for employers and healthcare providers


    The potential advantages for healthcare professionals of wearable technology are
    significant. Medical personnel can gain a more comprehensive understanding of'
