    The successful improvement of the healthcare system is the top priority of every
    government on the globe. It can be difficult to offer flexible services to consumers
    at the most affordable price, however. The most promising possibilities for delivering
    smart healthcare are the future wireless technologies and edge computing, which
    can enable real-time and affordable patient remote monitoring. The authors have
    discussed their research perspectives for employing MEC for applications in smart
