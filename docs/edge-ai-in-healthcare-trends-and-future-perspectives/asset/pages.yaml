    challenging in such an environment, and no one can provide secure communication
    without overcoming these issues. Without a solid authentication process, you can’t
    ensure data integrity, authorisation, nonrepudiation, user validity, or information
    verification. We used Wireless Multimedia Sensor Network (WMSN) to develop strong,
    lightweight authentication for IoMT. The proposed approach addresses all the literature
    flaws. ProVerif2.00 and BAN were used to test the protocol’s resilience. The evaluation
