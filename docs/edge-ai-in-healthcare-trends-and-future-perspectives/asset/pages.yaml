    # ## 14.3 LEGAL AND REGULATORY CHALLENGES


    With every dramatic transition of new technologies, edge-AI poses a range of legal
    concerns to the healthcare industry. Legal concerns vary from data privacy to
    liability and consumer protection to intellectual property, based on the nature
    and scope of the AI applications. Some of the legal concerns of edge-AI relating
    to healthcare are highlighted in this section.


    # ### 14.3.1 DATA PROTECTION


    All algorithmic technologies – and machine learning in particular – are data-driven
    and necessitate a well-functioning data ecosystem underpinned by a solid legislative
    framework that fosters trust and data accessibility while preserving privacy rights.
    By enacting personal data protection laws in so many jurisdictions, policymakers
    have played a crucial role in establishing the desired perspective on data privacy
    as a fundamental human right. General Data Protection Regulation (GDPR) is such
    an example, and it serves not only Europe but also the entire world. With a focus
    on individual liberties, European ideals, and trust, it has set a new global norm
    (Rustad & Koenig 2019).


    Most privacy laws worldwide consider six major principles. First and foremost,
    personal data must be handled honestly, legally, and transparently. Second, it
    must be gathered for clear, stated, and legal reasons. Third, the “data minimisation”
    principle requires that personal data be sufficient, relevant, and restricted
    to what is required for the processing purpose. Fourth, personal information must
    be relevant and correct. Fifth, it must only be stored for the time that is necessary.
    Finally, the processing of personal data should be conducted with the utmost integrity
    and secrecy, allowing for the necessary level of security and protection against
    improper or unlawful processing. However, it could be particularly challenging
    to satisfy the standards of specific data protection laws in an edge-AI-driven
    healthcare system.


    To begin with, using skewed health data raises questions about data security and
    accuracy. It must be emphasised that developing AI will be a multidisciplinary
    effort. A restriction on the purpose of the data may provide another difficulty
    (Xiang & Cai 2021). AI systems frequently make use of data that has'
  merge: -1
  img_proc: true
