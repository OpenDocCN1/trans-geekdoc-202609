  md: '# 10 Edge computing-based containerized deep-learning approach for intrusion
    detection in healthcare IoT


    S. Prabavathy


    # CONTENTS


    +   10.1 Introduction .................................................... 129

    +   10.2 Background ...................................................... 131

    +   10.2.1 Edge computing ................................................ 131

    +   10.2.2 Deep learning for IoT ......................................... 132

