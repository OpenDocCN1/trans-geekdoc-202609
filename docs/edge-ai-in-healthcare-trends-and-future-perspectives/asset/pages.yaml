  md: '# ## 8.9 SMART WHEELCHAIR (SWC) MODULES


    It is vital to remember that the goal of the Smart Wheelchair (SWC) is to protect
    disabled persons, especially quadriplegics, from COVID-19 by integrating three
    additional modules into the AWC. These modules are the Alexa Assistant Module,
    the Robotic Arm Module (Saponara et al. 2021), integrated with smart phone handsets,
    and the Module for Maintaining Social Distancing (Kim et al. 2021).


    # ### 8.9.1 SOCIAL DISTANCING MODULE


    Because preserving social isolation is one of the most crucial components of remaining
    safe during pandemics, this built-in module is crucial. The World Health Organisation
    states that keeping a predefined distance between two individuals is one method
    for preventing physical contact with potential COVID-19 carriers. The influenza
    virus and SARS-CoV-2 propagate similarly to other respiratory viruses. It is believed
    that avoiding contact with people may help prevent the spread of common respiratory
    infections. Therefore, long-term social exclusion may be one of the most successful
    methods to stop a respiratory virus pandemic (Al-barrak et al. 2017). Passive
    infrared (PIR) sensors, which are specifically made for motion sensing, have a
    wide range of applications. The OCTIOT PIR sensor is recommended in this paper
    (Chi et al. 2017) because of its efficiency, simplicity of use, and remote controllable
    capabilities. In Figure 8.6, a typical OCTIOT PIT sensor is illustrated. Utilising
    OCTi-Sense Technology, OCTIOT sensor systems enable precise motion detection,
    as well as being energy efficient during installation (Chi et al. 2017).


    ![](img/28baab106dba0e70a2f26ab75f61f184_116_0.png)


