    # 16.6 MARKET PLAYERS IN MEDICAL TOURISM


    The market forecasts for medical tourism are encouraging, although only a few
    countries around the globe are cashing in on this opportunity. For example, China,
    one of the business giants, is far behind Malaysia in terms of medical tourism.
    The flourishing medical tourism has now become the driving force for growth across
    the globe (Tewari 2020).


    Developing countries are strengthening their medical facilities and infrastructure,
    healthcare centres, alliance between private and private hospitals, and other
    different healthcare solutions and packages to attract medical tourists (IMF 2021).


    The major market players in Indian medical tourism include Aditya Birla Memorial
    Hospital, Apollo Hospitals, Asian Heart Institute, Fortis Healthcare, KPJ Healthcare
    Berhad, Prince Court Medical Centre, Samitivej etc., to name but a few. These
    healthcare providers carry out cosmetic surgery, dental care, cardiac surgery,
    orthopedic and fertility treatments (Vara 2021).'
