    # ### 16.1 INTRODUCTION


    The term “Tourism” is usually associated with leisure and traveling to local or
    foreign locations; however, when combined with the term “Medical”, its focus changes
    from leisure travel to means of medical care. Formerly, medical tourism was associated
    with the medical treatment of patients from richer/developed countries to cheaper/less
    developed countries. The term “Medical Tourism” is all about patient mobility,
    where the medical tourists/travelers seek pocket-friendly healthcare/medical care
    services outside their country of residence. During their stay, they also leverage
    the traditional tourism activities, such as sightseeing, city tours, leisure,
    etc. For the past two decades, the majority of developed countries raised their
    cost of healthcare such as medical treatment, drug prices, medical procedures,
    and medical'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'insurance billing. For example, a typical heart bypass surgery is 30–70% cheaper
    in less-developed than in developed countries like the US (OECD Report 2011).
    At the same time, these countries ensure the quality of services, medical tourist
    satisfaction, target market segmenting, quality assessment, laid-down procedures,
    and risk management. Medical tourism provides cost-effective alternatives for
    medical tourists, such as low-cost treatments, inexpensive travel, advertising
    and marketing, medical-tour packages, online platforms, and cultural exchanges
    and leisure trips. The reason is that medical tourism has now become a billion-dollar
    industry, gaining popularity among medical tourists, hospitality and tourism industries,
    policymakers, government agencies, researchers, and advertising and media. The
    coronavirus pandemic interrupted the tourism and travel industry and also medical
    tourism. With the advent of blockchain, medical tourism is also looking for alternatives
    to raise their business (Benowitz n.d.).


    # 16.2 WHAT IS MEDICAL TOURISM?


    There are various definitions of medical tourism, depending upon the country and
    their healthcare regulations. The following are a few definitions, imposing restrictions
    upon medical treatments, such as dental, cosmetic surgery, health spa and wellness,
    and accidental cases (Bhattacharjee 2019):


    +   - A report from OECD (2011) defined a medical tourist as one who seeks out
    overseas options for dental, cosmetic, and fertility treatments.


    +   - McKinsey (2008) defined a medical tourist as an individual who seeks medicinal
    treatment in overseas countries. The definition excludes emergency, health, and
    wellness tourism.


    +   - Pollard in International Medical Tourism Journal in 2011 defined medical
    traveler as an individual who travels abroad for medical treatment (Bhattacharjee
    2019).


    The World Health Organization also emphasised the policy and guidelines for medical
    tourism and transplant tourism (WHO Resolution WHA59.26 2006) (Etemad 2010). In
    contrast, the medical tourist prefers medical tourism for treatment of dental
    care; cardiac, orthopedic and cosmetic surgery; organ, stem cell, and tissue transplantation;
    cancer treatment; and reproductive technologies, such as surrogate pregnancy,
    in-vitro fertilization (IVF), to name but a few. During the pandemic, medical
    tourism also offered medical tour packages includes vaccination (Marketdataforecast.com
    2021; Kelley 2013). Popular medical tourism destinations include countries in
    Europe and Asia. The travelers need to follow country-specific norms, official
    approvals/license, patient data process, security policies, and quality of drugs/clinical
    products (CDC.gov n.d.). Medical tourism provides destination countries with improved
    prospects in terms of economic growth, better job opportunities, improved healthcare
    services and solutions, emerging technologies, advanced quality of life contributing
    to global healthcare, information, social and cultural exchanges, increasing foreign
    revenues,'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'patient-tailored 24/7 medical treatment, support for m-Visa, language translators,
    local SIM cards, loading and boarding, appointment management and post-treatment
    follow-ups (Bhattacharjee 2019).


    # 16.3 CATEGORIES OF MEDICAL TOURISM


    Medical tourism focuses on treatment, healthcare solutions, and services and covers
    preventive to therapeutic, and rehabilitation healthcare services. Medical tourism
    can be broadly categorised as international or domestic classes as mentioned in
    the following sub-sections (Bhattacharjee 2019):


    # 16.3.1 INTERNATIONAL MEDICAL TOURISM


    It includes inbound and outbound international travel for the purpose of medical
    treatment. International medical tourism is about receiving better healthcare
    services in a foreign country as compared with his/her own country. The patient
    prefers this option due to its cost-effectiveness and high quality.


    +   - Inbound medical tourism. When a patient belongs to outside origin/foreign
    country and is entering a particular country, say “X”, for medical treatment,
    then the patient will be inbound in nature for country “X”.


    +   - Outbound Medical Tourism. When a patient from native country, say “X”, travels
    to an outside origin/foreign country for medical treatment, then the patient will
    be outbound for country “X”.


    In other words, the patient, leaving his native country, say “A”, to foreign country,
    say “B”, is outbound for country “A” and inbound for country “B”. This type of
    medical tourism includes risk-prone treatments, which are usually costly and need
    specialisation or better facilities (Bhattacharjee 2019).


    International medical tourism includes dental care or dentistry; orthopedics and
    musculoskeletal treatment; cosmetic/plastic surgery; cardiology such as bypass
    surgery, electrophysiology, inborn heart diseases, or coronary-artery disease;
    weight loss or bariatric surgery; reproductive treatments such as IVF; surgery
    for eyes, nose, ears, throat; organ or tissue transplantation and rehabilitation
    (Meštrović 2018; Vyas & Gupta 2022).


    # 16.3.2 DOMESTIC/INTRA-COUNTRY-BOUND MEDICAL TOURISM


    This type of medical tourism has no international travel. It belongs to interstate,
    intercity, or inter-region travel of patients within their native country. When
    a patient belonging to their home city/state/region travels to another city/state/region
    in his/her country, it is called domestic medical tourism. Usually, domestic medical
    tourism is preferred by citizens to get better-quality, more reliable, faster
    or more affordable healthcare services, such as medical, surgical, or dental care
    etc., than in their home city/state/region. For example, during the COVID-19'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'pandemic, India witnessed a scarcity of hospitals beds and oxygen in almost
    all big/metro cities. At this moment, many patients traveled to nearby cities/states
    for better treatment or availability of beds or oxygen supply. In a few cases,
    they had to travel to small cities/regions to find the availability of such life-saving
    options (Meštrović 2018).


    # 16.4 MEDICAL TOURISM: PRE- AND POST-PANDEMIC


    Pre-pandemic, the study by the Global Wellness Institute (GWI) shows that the
    medical tourism industry introduced 800+ health & wellness tours, the majority
    of them in the Asia- Pacific region (e.g., China, Japan, India, Thailand, Indonesia,
    Malaysia, and the Philippines) and raised its business value to US$639 billioin
    2017. Before the pandemic, global data forecast the health and wellness tourism
    business to reach (7.5% yearly) to reach $919 billion in 2022. . The COVID-19
    pandemic disrupted medical tourism badly, and the sector has been struggling hard
    to recover. In a survey conducted on 441 respondents by a pharmaceutical technology
    website, more than 52% of respondents felt that this industry would take the next
    three years to restore its business to its pre-pandemic level. To combat this
    disruption and recover the economy in this sector, several reforms in medical
    tourism have already been initiated in medical tourism in markets such as Sri
    Lanka and Thailand (Xu et al. 2021).


    Post-pandemic, to deal with this decline in the economy of the sector, the medical
    tourism industry shifted its focus to health and wellness, Ayurveda and yoga,
    local job creation, and conservation, redirecting from medical treatment to ecotourism
    along with the offer of vaccination. With the advent of technology, the sector
    also added several new offerings for the medical tourist, such as an online/digital
    platform, ensuring patient-data security, contact-less service delivery, social
    distancing, healthcare and hygiene, locally produced food, artisan products and
    handicrafts, and entertainment (Tourism Notes 2020).


    Post-pandemic, people are more health conscious and looking for high-quality healthcare
    solutions. A report from the World Health Organization (WHO) mentions that around
    40% of people prefer medical tourism because of the cost-effective healthcare
    solutions combined with advanced technology. On the contrary, a report from the
    British Association of Plastic Reconstructive and Aesthetic Surgery mentions that
    around 37% of medical tourists faced issues such as contamination and post-treatment
    remedial problem. On the other hand, the countries are facing problems of an inadequate
    workforce, enormous pressure on medical professionals, cancellation of domestic/international
    flights, and insufficient adoption of technology. In turn, this has an adverse
    effect on medical tourism. The need is to take these factors into consideration
    to strengthen the medical tourism market globally. Now, many countries have started
    investing in medical tourism in the form of inviting members of the medical faculty
    from Harvard, Cleveland, and Mayo, to name but a few, to their countries. At this
    moment, countries like Singapore, Thailand, and India have an opportunity in terms
    of medical tourism, due to their comparatively low cost of medical care (Bhattacharjee
    2019).'
