    A blockchain is a continuously increasing collection of encrypted and connected
    data called blocks. Blocks are linked to each other by encryption. In short, blockchain
    is a simple yet great way to move data from point A to point B in a fully automated
    and secure way. At the start of the process, a block is created on one side of
    the transaction. This block has been validated by thousands of computers around
    the world. The validated block is added to the chain maintained throughout the
    Internet, making it a record that is not only unique, but also has a unique history
    (Xie et al. 2019) Blockchain is a peer-to-peer network that reduces the cost of
    setting up and maintaining centralised clouds, data centers, and network devices
    by distributing computing and storage requirements across all network devices
    (Makhdoom et al. 2019). The blockchain contains all medical records of the patient.
    This vast amount of data is stored in a data lake that can contain a variety of
    health data. Intelligent edge-based algorithms, such as deep learning, access
    data lakes and enable a wide range of data searches. In addition, these data are
    encrypted and validated. When the data are stored, a pointer is created on the
    blockchain with the patient’s unique ID (Hossain, & Muhammad 2017). Patients will
    be notified when new data related to the patient are uploaded. Patients can securely
    upload validated health data to the data lake using edge devices, such as smartphones
    and body sensors.


