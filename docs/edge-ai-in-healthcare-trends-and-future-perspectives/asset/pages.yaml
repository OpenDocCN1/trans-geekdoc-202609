    the boundaries of artificial intelligence to their full advantage to fully realise
    the promise of big data. Control computation is a potential idea to achieve calculations
    based on artificial intelligence applications to realise this trend (Whig et al.
    2022). Edge-intelligence, also known as edge-AI, is a hybrid of artificial intelligence
    and edge computing that allows ML algorithms to be beneficially deployed to where
    the data are created. Superiority intellect can offer artificial intelligence
    to every individual and business, wherever they may be (Whig et al. 2022).


    # ## 3.2 EDGE COMPUTING


    Edge computing defined the idea behind edge calculation, in order to gather, store,
    process, and analyse information closer to the point of use to speed up reaction
    times and conserve bandwidth. Edge computation is a dispersed calculation system
    that enables requests to be run closer to data sources such as edge servers, IoT
    devices, and local endpoints, as shown in Figure 3.1. The idea behind edge computing
    is that processing should take place close to the data sources (Whig et al. 2022).
    Therefore, we believe that edge computing might have a similar significant influence
    on society as cloud computing has had.'
