    # 17.4 SECURITY OF EDGE-BASED AI SYSTEMS


    Data protection is still essential to guaranteeing the security of AI system operations,
    regardless of whether computing takes place in the cloud or at the edge. For instance,
    secure boot updates and integrity checks are unquestionably mission critical.
    Furthermore, a successful assault would not only have an impact on the security
    of the data set for applications that directly influence people''s lives, like
    healthcare, but it may also put lives in danger. When preparing for system security,
    AI system developers must take the training phase into account. This implies that
    additional associated attack surfaces must be considered in addition to the hardware
    itself (including the neural network accelerator). These risks include altering
    or stealing training data; altering or stealing an AI model that has been trained;
    altering or stealing input data; stealing inference results; or altering outcomes
    that are utilised for retraining. Malicious assaults can be lessened with the
    careful application of security measures that use privacy and integrity cryptographic
    functions. Figure 17.2 shows a representation of an edge-AI system''s training
    through implementation phases.


    Interference and stealing of information based with the trained model results
    in a major loss of company resources and confidential information because the
    entire training process needs a non-trivial amount of time and effort for the
    acquisition of training data (and for the training period itself). It should therefore
    come as no surprise that today''s designers must prioritise security from the
    very beginning of the design cycle, given the significance of security for edge-AI
    in IOT healthcare and the wide range of attack surfaces available to a determined
    hacker. Additionally, just as AI systems are constantly changing, their security
    must likewise advance to continue thwarting increasingly sophisticated threats
    as AI systems become more complex.


    A typical first step in enhancing system security is swapping out One-Time Programmable
    (OTP) memory that uses give off with anti-fuse OTP. Installing a root-of-trust,
    which typically consists of protected storage, an entropy source (using Physically
    Unclonable Functions (PUF) and True Random Number Generators (TRNG)), and a unique
    identity, would be the next, intermediate stage (acting as the foundation for
    a secure boot flow) as shown in Figure 17.2. The


    ![](img/28baab106dba0e70a2f26ab75f61f184_258_0.png)


    FIGURE 17.2 Phases of system training.'
