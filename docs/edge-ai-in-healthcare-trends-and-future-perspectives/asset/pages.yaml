    It’s more critical now than ever to enhance authentication processes to reduce
    assaults and security vulnerabilities that limit application performance due to
    the rapid adoption of cloud computing and IoT. In this study, the researchers
    introduced a novel IoT-based cloud computing authentication technique. The authors
    contend that the scheme protocol developed by Zhou et al. (2019) is neither secure
    nor safe. They asserted that, after looking over the protocol, they found some
    security holes and other issues that made the system unstable. Researchers suggest
    a new version with three steps to increase security. The user must log in during
    the first step, after which mutual authentication will take place and key agreement
    will follow. Additionally, they added a sub-phase known as “proof of connection”
    attempt, which confirms user participation before the server participates. According
    to the research, the new technique is an upgrade over earlier attempts because
    it satisfies the security requirements and is effectively resistant to the majority
    of common and well-known assaults. Also, the performance research shows that the
    registration and login phases of the new system require less communication cost
    than older authentication protocols (Dhillon & Kalra 2019). Patients can now obtain
    healthcare services from home thanks to the development of cloud computing and
    the Internet of Things (IoT) technologies, which allow remote medical specialists
    to monitor patients in real time. In some cases, patient information is kept at
    a centralised healthcare facility where a doctor can access it on a regular basis.
    However, the public WiFi situation raises fundamental questions about patient
    privacy. Recently, several authentication methods for healthcare care services
    have been reported in the literature. Nevertheless, most of these methods have
    been proven not to meet the security requirements. Additionally, it was stated
    that they failed to consider how a doctor might access information kept on a cloud
    server. In this research, researchers introduced a multi-factor authentication
    method based on the cryptographic elliptic curve approach that permits authorised
    medical professionals to access patient health data stored on a cloud server.
    The proposed methodology is confirmed to be secure against several attacks, including
