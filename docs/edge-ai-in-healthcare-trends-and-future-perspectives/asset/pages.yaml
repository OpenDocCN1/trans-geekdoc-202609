  md: '# ## 9.7 EXPERIMENTAL SET-UP


    To perform this study, we used Google Colab, which is a Jupyter Notebook environment
    that runs on the cloud. This enabled all our team members to work on the project
    at the same time. We used different algorithms to predict stroke, and, to compare
    these algorithms, we calculated different parameters such as precision, accuracy,
    F1-Score and recall (Chilamkurthy et al. 2018; Freire & de Arruda 2016). In essence,
    accuracy can be defined as the ratio of the number of accurate forecasts to the
    total number of predictions made. Precision is a phrase used to describe the ratio
    of positive samples that have been correctly classified to all positive samples,
    regardless of whether the classification was accurate or not. Recall is the proportion
    of positive samples that were correctly identified as positive to all available
    positive samples. The precision and recall measurements are combined to form the
    F1 score. The F1 score performs reasonably well on uneven data.


