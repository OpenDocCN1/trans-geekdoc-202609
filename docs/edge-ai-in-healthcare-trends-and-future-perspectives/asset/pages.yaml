    # # 1.6 EDGE-AI, MACHINE LEARNING, AND DEEP LEARNING APPROACHES FOR HEALTHCARE


    Machine learning (ML) can be defined as the study of algorithms which can improve
    autonomous training and use of data. It comes under the aegis of AI. ML and deep
    learning (DL) are preferred due to their superior performance and use in predictions
    to diagnose various diseases. ML/DL techniques have shown tremendous results as
    they require less input and less time to process data, making them incredibly
    fast. It is expected that soon ML/DL are going to help doctors and nurses during
    major surgery and scanning (Plastiras et al. 2018). Some of the research even
    shows that ML models have surpassed human physicians on average. ML can give us
    predictive outcomes that are highly accurate and can even attain human-focused
    intelligence (Vyas et al. 2019). We can now think of providing healthcare services
    in remote rural areas because of ML. A huge amount of clinical data was ignored
    in the past, because of the complexity and size of these data, and because there
    was no way for storing such data. Hence, these data were undervalued and not used.
    ML provides much-needed options to tackle this problem of storage and analysis.
    Some of the applications of machine-learning techniques in healthcare are as follows:


    +   1. Classification.

    +   2. Clustering.

    +   3. Prediction.

    +   4. Anomaly detection.

    +   5. Recommendation.

    +   6. Automation.

    +   7. Ranking.


    To save time (and lives, in healthcare) we need smart devices. The application
    of IoT to the healthcare industry is rapidly increasing. The IoT helps connect
    with the patients proactively. Many researchers are in the process of making devices'
