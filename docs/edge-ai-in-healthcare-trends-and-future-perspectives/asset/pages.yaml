    as IoT, but computers that learn from data and experience are referred to as

    AI. Artificial intelligence gives “dumb” objects a “brain”, whereas the Internet

    of Things connects them to the internet. The Internet of Things serves as the

    “brain”, and AI serves as the “body”, to construct intelligent, interconnected

    systems. The decision-making skills of AI are advantageous for IoT systems

