  - 对抗机器学习：通信的新范式
- - '##'
  - 2.1 引言
- - '###'
  - 2.1.1 范围与背景
- - '##'
  - 2.2 对抗机器学习
- - '###'
  - '`成员推断攻击`：成员推断攻击的目标是推断感兴趣的数据样本是否已用于机器学习算法的训练数据。这种私有信息可用于发起后续攻击。在无线领域，成员推断攻击可以发现有关波形、信道和设备特征的信息
    [58, 59]]，如果这些信息泄露，攻击者可以利用它们来识别机器学习模型的漏洞（例如渗透物理层）。'
- - '###'
  - '`模型反转攻击`：模型反转攻击的目标是在攻击者 get 机器学习模型和某些隐私信息的情况下，通过观察机器学习模型的输入和出来推断额外的隐私信息 [60]]。在无线领域，攻击者可能获得某些信息（如波形特征），然后可能旨在推断额外的信息（如射电硬件特征）。'
- - '###'
  - '`针对强化学习的攻击`：基于对抗机器学习的攻击也已针对强化学习算法，始于计算机视觉 [61]]。最近，这些攻击扩展到了无线通信。针对信道接入的对抗攻击已在
    [62]–64]]中考虑。此外，这些攻击也被应用于 [65, 66]]中针对 5G 网络切片中使用强化学习的情况发起攻击 [67, 68]]。主要目标是操纵强化学习算法的输入，导致即使在攻击停止后，底层性能也需要长时间才能恢复（因为强化学习算法会适应变化）。'
