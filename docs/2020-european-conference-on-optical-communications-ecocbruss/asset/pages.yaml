    # Evaluation Setup


    **Topology and Traffic Generation.** The proposed soft failure localization mechanisms
    on the 14-node NSFNet[19], assume a static scenario. In our case, with a 4.8-THz
    optical link spectrum, corresponding to 96 50-GHz frequency signals (FS). We generate,
    with 0.2 dB/km attenuation, except for the last span, distributed source patterns
    and bandwidth distributed between 1 to 4 Fs. The Dijkstra''s algorithm[20] performs
    routing, and wavelength assignment the first-fit algorithm[21]. We accept 1,000
    demands, a total of 380 km spans with 0.2 dB capacity for last, which could be
    shorter than the required span. The final topology has 581 optical spans, with
    536 in-line amplifiers, 44 pre-amplifiers, and 44 boosters. We use (B&RS) configurable
    add-drop multiplexers for a per-channel control loop implemented with optical
    channel monitors (OCMs) and wavelength selective switches (WSS). The control loop
    ensures a power of -1 dB channel. The 360 demands are supported by 772 transponders,
    bidirectional connectivity. The system parameters are summarized in Fig. 1, where
    $N$ is the node degree, and $L$ is the fiber length span.


    **Monitoring Data.** The simulated traffic generation scenarios features 3064
    monitoring parameters. In amplifiers, we monitor 1,248 input and output values.
    In transponders, we monitor 2,316 parameters of optical signal to noise ratio
    (OSNR), assume that SNR can be estimated from the pre-forward error correction
    (FEC) bit rate (BER). We use 1,978 devices that may fail, including 772 transponders,
    624 amplifiers (pre-booster, and in-line amplifiers), and 580 unidirectional fiber
    spans.


    **Telemetry Setup.** We assume that the down-


    stream network nodes collects TD from amplifiers via an supervisory channel. The
    transmitter and amplifier monitoring data are streamed by a telemetry server per
    node. As gNMI streams, each of the 14 NSF nodes streams every second to the STC
    which utilizes the SDN information base embedded in influxDB. The ANN module processes
    the TD to update telemetry a faulty device.


    # Failure Localization Results


    **ANN Design and Training.** Failure localization is carried out by a ANN composed
    of 3 layers[25]. The first layer has 3,564 inputs (corresponding to all collected
    TD), the hidden-layer has 1,000 linear neurons, and the output-layer has 1,978
    nonlinear neurons with the softmax activation function, controlling of all network
    elements that may fail. Z-normalization[23] is applied at the input to control
    the process and improve numerical stability. The output adds up to one, representing
    a probability that the faulty element has failed. We use a categorical entropy
    loss function to address the ANN output error. The adaptive method of infinite
    order (Adam[24]) is applied to the backpropagation process. A network element
    is identified if its output exceeds 0.5. Training is performed in x86 server (Intel)
    Xeon Silver 411 CPU at 2.20 GHz, 46-GB RAM and 10 cores.


    **Hard failure.** We first train only the hard failures, i.e., a transfer power
    equals 0 W, the attenuation of a fiber link goes to infinity, or an amplifier
    gain equals 0 dB. After 12 training epochs (30-min ANN training cycles), the ANN
    algorithm reaches a categorical accuracy of 99.75%. After the training phase,
    we test the ANN to analyze localize soft failures. The results are presented in
    Figs. 2a, 2b, and 2c.'
