  md: '![](img/218531b133796e51c6f6d28537050d3e_2_0.png)


    shows three curves each, corresponding to the cases where the correct device is
    identified as faulty, the incorrect device is identified as faulty, and no failure
    is identified. Fig. 2 shows that, if the gain of the amplifier is degraded by
    more than 5 dB, the ANN is able to correctly identify the faulty amplifier with
    over 50%. Probability of incorrect detection remains zero. Fig. 2b indicates that,
    upon a fiber soft link (a), 6 dB loss, in the wrong device is identified with
    high probability. Fig. 2c shows the results for a soft failure where there reduces
    the output power of an amplifier. Clearly, the ANN is only able to localize soft
    failures corresponding to high losses. Figs. 2b and 2c show that training on hard
    failures is not sufficient to localize soft failures. Hard and soft failure localization.
    To circumvent the observed limitations, we train the ANN to localize some soft
    failures: (i) amplifier gain degradation of 3 dB and 10 dB, (ii) transom power
    degradation of 3 dB, and (iii) fiber attenuation of 3 dB. Similarly, after 120
    epochs (min dataset), the ANN achieves a correct accuracy of 99.5%. Figs. 2d,
    2e and 2f show the performance of the ANN trained for these soft failure scenarios.
    Fig. 2d shows that the ANN correctly identifies all soft failures in amplifier
    degradations greater than 3 dB. Fig. 2e also shows that it localizes all soft
    failures in fiber links causing greater than 3 dB. Likewise, Fig. 2f shows that
    all transponders are correctly localized when their power is greater than 2 dB.


    ![](img/218531b133796e51c6f6d28537050d3e_2_1.png)


    Emulation results. Fig. 3 presents the results from the complete soft failure
    localization framework implemented in the emulation environment. We emulate a
    gain degradation in the 5th node in the link connecting SDN nodes 1 and 2 with
    nominal value of 16 dB and neglecting propagation latency. The green line with
    crosses shows the time in the link. The orange line shows the output of the ANN,
    after processing telemetry and database processing. Soft failure localization
    is achieved when the amplifier gains 14 dB. The entire process of streaming telemetry,
    database processing, and ANN processing takes less than 1.4 seconds.


    Conclusions. The obtained results demonstrate a suitable performance in soft failure
    localization training an ANN with hard and soft soft failure scenarios. Performance
    insights from the implemented environments indicate appropriate performance.


