  md: '# # Soft Failure Localization Using Machine Learning with SDN-based Network-wide
    Telemetry


    Kayol S. Mayer(1*), Jonathan Soares(1), Rossano P. Pinto(2), Christian E. Rotenberg(2),
    Dalton S. Arantes(1), and Darli A. A Mello(1)


    (1) DECOM, DCA, University of Campinas, 404 Albert Einstein Ave., Campinas, 13083-52,
    SP, Brazil.

    (*) kayol@decom.unicamp.br


    Targeting soft failure localization, we present a machine learning approach using
    SDN streaming telemetry of network-wide parameters. The artificial neural network
    only requires a few scenarios to achieve adequate interpolation performance. The
    implementation is validated using gNMI telemetry in an emulated FSNet topology.


    # Introduction


    Machine-learning (ML) techniques are increasingly used to address several problems
    in operational networking[1][2]. Among them, fault management is one of the most
    pressing. Recently, tackling soft failures[3][4] have become an active research.
    Soft failures are degradations that cause identifications by network parameters,
    but serve not to cause alarms and disrupt the service. Eternity, soft failures
    may evolve into hard failures. Therefore, localization of soft failure continues
    to be avoiding service disruptions and potentially device repairs.


    Different approaches have been proposed to solve soft failure management. Barzeg
    et al.[5] monitor the performance of established lights, to detect anomalies,
    and localize failure. Vela et al.[6] identify soft failures during commissioning
    and light operation by monitoring optical analyzers and test channels. We et al.[7]
    propose a soft failure identification scheme based on a convolutional network
    and receiver DSP. Shahkarani et al.[8] identify soft failures in an experimental
    link by monitoring the BER. Varughese et al.[9] identify the type of soft failure
    by applying soft switches. We address the problem of localization[3]. A soft failure
    (e.g., an amplifier with degrading gain) may eventually trigger anomalies in series-


    ters of the network, and localizing the failure in a network-wide[14] process.
    Recent data-driven SDN-based optical networks[12][15] are able to collect monitoring
    parameters generated by a potentially vast number of network elements, such as
    transponders and amplifiers, and process large volumes of monitoring data with
    metrics[16][17].


    In this paper, we propose an approach to localize soft faults by an artificial
    neural network (ANN) applied to network-wide parameters collected by an SDN-based
    gNMI[16] streaming telemetry architecture. We experimentally validate the proposed
    framework in a large-scale emulated network scenario.


    # Network-wide Soft Failure Localization


    Figure 1 presents the proposed framework. The failure workflow starts by creating
    a snapshot of the current SDN state, including network status, topology, routed
    paths, and telemetry data (TD). The information is sent to a failure simulation
    machine, which produces TD for scenarios considering any possible failure in the
    network as to train the ANN used for localization. This training process must
    be carried out wherever there is a change in the network topology. Elements streaming
    telemetry to an SDN controller (using the gNMI protocol, a gRPC service). The
    ST processes and stores the collected data into InfluxDB time-series data. The
    ANN is continuously with the TD from InfluxDB to localize potential failures effectively
    and timely. Standardized OpenConfig/YANG models are used to exchange messages
    and maintain the SDN information.'
