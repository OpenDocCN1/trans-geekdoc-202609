    Store $(s_t, a_t, r_t, s_{t+1})$ in replay memory\nCalculate $y_t = r_t + \\gamma\
    \ \\max_{a'} Q'(s_{t+1}, a')$ if episode terminates at $t$\nUpdate $\\theta$ using\
    \ gradient descent with weight $y_t$\nEnd\n```\n\nFig. 4. DQN algorithm\n\n##\
