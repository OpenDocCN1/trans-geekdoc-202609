    \n## D. Energy Storage System Operating Constraints and Penalty Costs\n\nThe reliability\
    \ of algorithm is limited by its operating constraints. In this paper, battery\
    \ group is used as energy storage element. The charge-discharge of ESS can be\n\
    \n```\n$P_{ESS} = P_{pv} + P_w - P_{load},$\n```\n\nWhere, $P_{ESS}$ indicates\
    \ that ESS is in discharging state; negative value means ESS is in charging state.\n\
    \n![](img/c9ea3afe465f52c87757df956199f24a_2_0.png)\n\nFig. 2. Energy system control\
    \ model of combined wind-solar system.\n\nThe training of the deep reinforcement\
    \ learning network, mapping the relationship between the state and the value is\
    \ fixed by the neural network, so that the agent can process the complex state\
    \ space. The experience learns continuously. That, samples are sampled randomly\
    \ with equal probability as neural network training sets. This mechanism makes\
    \ the correlation between the state and action of deep learning and reinforcement\
    \ learning, and ensures the convergence.\n\nThe iterative process of Q value is\
    \ shown in Equation (2). After the Q value iteration, DQN trains the network based\
    \ on the difference of Q values between before and after iteration, which is called\
    \ temporal difference error (TD error). The difference is used as the loss function\
    \ of deep neural network, so as to make the Q value converge finally, as shown\
    \ in Equation (3). The agent dynamically selects the action in the action space\
    \ that can bring the highest expected long-term reward, according to different\
    \ states. The algorithm of DQN is shown as follows:\n\n```\n$Q(s_t, a_t) \\leftarrow\
    \ Q(s_t, a_t) + \\alpha [r_t + \\gamma \\max_{a} Q(s_{t+1}, a) - Q(s_t, a_t)]\
    \ \\quad (2)$\n```\n\n```\n$Loss(\\theta) = TD-Error^2 = (r_t + \\gamma \\max_{a}\
    \ Q(s_{t+1}, a) - Q(s_t, a_t))^2 \\quad (3)$\n```\n\nWhere, $Q(s_t, a_t)$ is the\
    \ Q value of action $a_t$, the current state $s_t$; $\\theta$ is the network parameter\
    \ of the target network; $\\alpha$ is the learning rate; $r$ is the current reward\
    \ value; $\\gamma$ is the attention coefficient.\n\n## Algorithm Deep Q-Learning\
    \ with experience replay\n\n```\nInitialize replay memory to capacity N\nInitialize\
    \ action-value function with weights $\\theta$\nInitialize target action-value\
    \ function with weights $\\theta'$\nFor each episode $i$:\nSample sequence $s\
    \ = (s_t, a_t, r_t, s_{t+1})$ from replay memory\nWith probability select a random\
    \ action, or otherwise selecting the best action $(\\epsilon$-greedy policy)\n\
