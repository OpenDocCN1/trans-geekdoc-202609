    摘要—风电、光伏和储能系统（ESS）在电力市场中的协同运行可以有效提高可再生能源的利用率。传统的电力调度从预测开始然后进行调度，这会导致信息丢失和建模误差。为了解决这一问题，本文提出了一种基于深度强化学习的风风光储一体化系统能量控制策略。引入了DQN（深度Q网络）算法来调节风电和光伏电的控制，以实现可再生能源发电人在电力市场利益最大化。


    关键词—储能；光伏；风电；深度强化学习；控制方法方法能量调度控制系统及外备。


    由于风电和光伏具有不确定性，随机优化方法经常用于处理电力市场运行研究中风电、太阳能和能量-储能系统组件的不确定性。在[1]中，建立了两阶段随机规划模型来处理由电价和功率需求引起的风能不确定性。使用基于CI的聚类方法对风能的分布特征进行建模。所提出的增强方案随着历史数据的增加被用于跟踪真实分布[2-3]。电力市场中风光电能量的整合问题在不同阶段得到了处理。提出了一种基于需求驱动预测和基于在线模型控制（MPC）的电力市场协调的调度算法，可以抵消光伏发电。在[6]中，将MPC方法作为光伏-储能系统参与市场的运行策略，以降低电池成本并实现运行效益。[7]中提出了一种基于鲁棒模型预测控制（MPC）的策略方法。在[8]中，对具有多天跨度的电池充电系统进行建模以处理光伏功率的不确定性，并采用日前滚动优化策略来优化充电站充放调度以最小化成本。


    # I. 引言


    随着化石能源的枯竭以及能源利用对环境的负面影响，全球调整正转向可再生能源。风电和光伏发电在可再生能源的发展和利用中发挥着日益重要的作用。事实上，风电和光伏发电站的发电不可避免将影响电力市场的建立。再生能源供应商的收益取决于电力市场的波动。由于发电输出不可控且价格随时间变化，电力市场发电的收益是多样化且不稳定的。配备可行储能的可再生能源使得可再生能源电站的输出可以在一定范围内控制，从而实现长期利益。这项工作受到中国国有集团科技项目的资助（编号为20000000X），以及中国自然科学基金的资助（编号为Zebra
    21773118，通讯作者：杨明）。


    在研究中，首先在预测电站功率的基础上解决了风光功率的不确定性问题，然后基于最大化或最小化成本的优化进行ESS调度。在解决过程中，假设分布与实际分布之间的差异影响后续优化。另一方面，可再生能源电站的高维气象建模在特征提取过程中也会丢失，这将影响优化结果，从而影响可再生能源的收益。


    为了解决传统电网调度的问题，一些学者引入了强化学习（RL）作为整体的预测控制，并在每次调度中不断学习不确定性的经验。决策算法广泛应用于处理电力系统中市场竞争和AGC控制等不确定性的策略中[9–11]；然而，DRL在处理具有高维约束的状态方面表现得更好。在[13]中构建了一个代理DRL，用于逐渐体现风储混合储能系统的充放电学习过程。提出了一种基于RL
    Rainbow算法的端到端调度模型用于风光复合能量策略。


    RL的计算量将大大增加。因此，在RL的基础上，DRL引入神经网络来建立RL中状态与值之间的映射，以解决多场景下大数据空间的计算问题。


    DRL用于风光储一体化系统状态数据，原始测量数据用于驱动ESS和ESS的控制输出。调度模型通过ESS的控制动作有效处理可再生能源发电预测的不确定性，以解决预测策略中有效信息的丢失。


    ![](img/c9ea3afe465f52c87757df956199f24a_1_0.png)


    图 1. 强化学习方案。


    # III. 风光复合系统的能量系统策略


    ### A. 基于强化学习的能量系统控制模型


    在传统的调度方法中，只有预测和决策。在预测中，输入包括风电和光伏功率的实时、历史和预测气象数据，以及电站在未来时刻的实时和预测输出功率值。获得结果后，将其用于决策过程。能量系统根据电池电量（SOC）调度充放电功率。


    在传统的调度方法中，预测阶段由算法本身确认，优化过程限于ESS的决策。两个阶段的相同调度过程没有协作。其次，很难表示可再生能源发电预测的不确定性。由于优化算法将其属性描述为已知问题属性，如果算法对实际发电规律的产生是不确定的，优化的实际效果将受到影响。质量的。


    RL的基本原理是代理通过在环境中的试验学习实现最优目标的过程，通过观察状态和来自环境的反馈。图1显示了示意图来描述学习。当代理经过训练后，代理知道如何根据以前试验的经验获得最优奖励。


    在RL的学习过程中，我们描述并更新当前状态的值。对于连续输入，连续状态必须离散化。如果适用，这样信息就容易被丢弃。另一方面，面对需要处理的大状态数据空间时，计算量


    整体调度效果。系统控制模型将两个独立的阶段合并为一个统一调度，如图2所示。调度后，风光储一体化系统并入电网的功率是系统实际输出功率的


