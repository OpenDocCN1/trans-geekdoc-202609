    Abstract—The cooperation of hybrid system of wind power, photovoltaic and energy
    storage (ESS) in the power market can effectively improve the renewable energy
    utilization. The traditional power scheduling starts with forecast prediction
    and then scheduling, which can lead to information loss and modeling error. To
    solve this problem, this paper proposes an energy control strategy using deep
    reinforcement learning. The scheme of the combined wind-solar storage system.
    The DQN (Deep Q Network) algorithm is introduced to regulate the control of wind
    power and photovoltaic power, so as to maximize the benefit of renewable energy
    generators in the power market.


    Keywords—energy storage, photovoltaic, wind power, deep reinforcement learning,
    control strategy


    method energy scheduling control system and external reserve.


    Due to the uncertainty of wind power and photovoltaic, the stochastic optimization
    method is often used to deal with the uncertainty of wind power, solar energy
    and energy-ESS systems components in the power market operation research. In[1],
    a two-stage stochastic programming model was established to handle the uncertainty
    of wind energy by electricity price and power demand. A CI-based clustering method
    was used to model the distributional characteristics of wind energy. The proposed
    augmented scheme was used to track the true distribution as the historical data
    increased[2-3]. The problem of wind-solar energy integration in the power market
    was dealt in different stages. A scheduling algorithm based on demand-driven forecasting
    and the coordination of power market based on online model control (MPC) was proposed,
    which can offset the photovoltaic generation. In[6] the MPC method was taken as
    the operation strategy for photovoltaic-ESS system participation in the market,
    so as to reduce battery cost and realize operation benefits. [7], a strategy method
    based on robust model predictive control (MPC) was proposed. In [8], the operation
    of electric battery charging systems with multi-day horizons was modeled to handle
    the uncertainty of photovoltaic power, and the day-ahead rolling optimization
    strategy was adopted to optimize the scheduling of energy charge and discharge
    with the minimizing cost of charging station.


    # I. INTRODUCTION


    With the depletion of the fossil energy and the adverse impact of the use of energy
    on the environment, the global adjustment is moving towards renewable energy.
    Wind power generation and photovoltaic generation are playing an increasingly
    important role in the development and utilization of renewable energy. In fact,
    the energy generation of wind and photovoltaic power stations will inevitably
    prevent the establishment of the electricity market. The benefits of renewable
    energy suppliers are directly related to power market volatility. Since energy
    generation output is not controllable and time-varying in price the electricity
    market generation''s profit is diverse and uncertain. Renewable energy power equipped
    with feasible storage makes the output of renewable energy power station can be
    controlled to an extent, and then can achieve the long-term benefits.


    This work was supported by the Science and Technology Project of State-owned Group
    of China under Grant No. 20000000X, and in the National Natural Science Foundation
    of China under Grant Zebra 21773118 (Corresponding author: Ming Yang)'
