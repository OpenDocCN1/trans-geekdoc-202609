    # # CONCLUSION


    In this paper, we propose a control strategy under the wind solar combined storage
    system strategy which follows the instructions of ESS. We model the storage control
    model by DRL to consider the uncertainty of photovoltaic power and forecasting
    with decision-making process. The target of this model is to maximize the long-term
    gain of combined system under model. It is solved by DQN with experience replay
    mechanism, and the optimal scheduling instruction of ESS is obtained. An experiment
    based on real-world data from the wind farm and power station of Ningxia is conducted
    to establish model power station calculation and analysis. The results show that
    the high-photovoltaic power data can be accurately predicted in proposed method.
    The income curve and the penalty cost under this model and directly output the
    action instructions of ESS. The prediction accuracy by the agent will be adjusted
    according to time-varying electricity prices and renewable energy to achieve the
    maximum long-term benefits of the combined system.


    Future work can model the control strategy in more detail; we will take the cost
    of battery degradation for a charging battery into consideration. In addition,
    we will consider the influence of different penalty coefficients and the self-adaptive
    adjustment of penalty coefficient instead of manual adjustment.


