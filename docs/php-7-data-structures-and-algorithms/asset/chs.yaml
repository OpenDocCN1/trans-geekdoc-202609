  \n## 使用递归查找文件和目录\n\n我们经常需要查找目录内的所有文件。这包括其内部的所有子目录，以及这些子目录内的目录。因此，我们需要一个递归解决方案来获取给定目录下的文件列表。以下示例将展示一个简单的递归函数，用于列出目录中的所有文件：\n\
  \n```php\nfunction showFiles(string $dirName, array &$allFiles = []) {\n    $files\
  \ = scandir($dirName);\n\n    foreach ($files as $key => $value) {\n        $path\
  \ = realpath($dirName . DIRECTORY_SEPARATOR . $value);\n        if (!is_dir($path))\
  \ {\n            $allFiles[] = $path;\n        } elseif ($value != \".\" && $value\
  \ != \"..\") {\n            showFiles($path, $allFiles);\n            $allFiles[]\
  \ = $path;\n        }\n    }\n    return;\n}\n\n$files = [];\nshowFiles(\".\", $files);\n\
  ```\n\n`showFiles` 函数接收一个目录，首先扫描该目录以列出其下的所有文件和目录。然后通过 `foreach` 循环遍历每个文件和目录。如果是目录，则再次调用\
  \ `showFiles()` 函数列出其下的文件和目录。此过程持续直到遍历完所有文件和目录。现在，所有文件都在 `$files` 数组中。现在，让我们用 `foreach`\
  \ 循环顺序显示这些文件：\n\n```php\nforeach ($files as $file) {\n    echo $file . \"\\n\";\n\
  }\n```\n\n这将在命令行产生如下输出：\n\n```\n/home/mizan/packtbook/chapter_1_1.php\n/home/mizan/packtbook/chapter_1_2.php\n\
  /home/mizan/packtbook/chapter_2_1.php\n/home/mizan/packtbook/chapter_2_2.php\n/home/mizan/packtbook/chapter_3_.php\n\
  /home/mizan/packtbook/chapter_3_1.php\n/home/mizan/packtbook/chapter_3_2.php\n/home/mizan/packtbook/chapter_3_4.php\n\
  /home/mizan/packtbook/chapter_4_1.php\n/home/mizan/packtbook/chapter_4_10.php\n\
  /home/mizan/packtbook/chapter_4_11.php\n/home/mizan/packtbook/chapter_4_2.php\n\
  /home/mizan/packtbook/chapter_4_3.php\n/home/mizan/packtbook/chapter_4_4.php\n/home/mizan/packtbook/chapter_4_5.php\n\
  /home/mizan/packtbook/chapter_4_6.php\n/home/mizan/packtbook/chapter_4_7.php\n/home/mizan/packtbook/chapter_4_8.php\n\
  /home/mizan/packtbook/chapter_4_9.php\n/home/mizan/packtbook/chapter_5_1.php\n/home/mizan/packtbook/chapter_5_2.php\n\
  /home/mizan/packtbook/chapter_5_3.php\n/home/mizan/packtbook/chapter_5_4.php\n/home/mizan/packtbook/chapter_5_5.php\n\
  /home/mizan/packtbook/chapter_5_6.php\n/home/mizan/packtbook/chapter_5_7.php\n/home/mizan/packtbook/chapter_5_8.php\n\
  /home/mizan/packtbook/chapter_5_9.php\n```\n\n这些是我们在开发中面临的一些常见挑战的解决方案。然而，还有其他地方会大量使用递归，例如二分查找、树、分治算法等。我们将在后续章节中讨论它们。\n\
  \n## 分析递归算法\n\n递归算法的分析取决于我们使用的递归类型。如果是线性递归，复杂度会不同；如果是二叉递归，复杂度又会不同。因此，递归算法没有通用的复杂度。我们必须逐个案例分析。这里我们将分析阶乘序列。首先，让我们关注阶乘部分。如果回顾本节内容，我们对于阶乘递归有如下代码：\n\
  \n```php\nfunction factorial(int $n): int {\n    if ($n == 0)\n        return 1;\n\
  \    return $n * factorial($n - 1);\n}\n```\n\n假设计算阶乘（`$n`）需要 `T(n)`。我们将重点关注如何用大\
  \ O 表示法表示此 `T(n)`。每次调用 `factorial` 函数都涉及特定步骤：\n\n1. 每次都检查基本情况。\n2. 每次循环调用 `factorial($n-1)`。\n\
  3. 每次循环与 `$n` 相乘。\n4. 返回结果。\n\n现在，如果用 `T(n)` 表示，则可表述为：\n\n* `T(n) = a` 当 `n = 0`\
  \ 时\n* `T(n) = T(n-1) + b` 当 `n > 0` 时\n\n此处 `a` 和 `b` 均为常数。现在，让我们建立 `a`、`b` 与 `n`\
  \ 的关系。可以轻松写出如下方程：\n\n* `T(0) = a`\n* `T(1) = T(0) + b = a + b`\n* `T(2) = T(1) +\
  \ b = a + b + b = a + 2b`\n* `T(3) = T(2) + b = a + 2b + b = a + 3b`\n* `T(4) =\
  \ T(3) + b = a + 3b + b = a + 4b`\n\n可以看到此处出现了一个模式。因此可以确定：\n\n* `T(n) = a + n *\
  \ b`\n\n或者简单地说 `T(n) = O(n)`。\n\n因此，阶乘递归具有 `O(n)` 的线性复杂度。\n\n递归实现的斐波那契数列复杂度约为 `O(2^n)`。计算过程非常详尽，因为我们必须同时考虑大\
  \ O 表示法的下界和上界。在后续章节中，我们还将分析二分查找和归并排序等二叉递归。我们将在这些章节中更多地关注递归分析。\n\n## PHP 中的最大递归深度\n\
  \n既然递归是函数调用自身的过程，我们脑海中可能会出现一个合理的问题：“我们能递归多深？”。让我们做一个小程序测试一下：\n\n```php\nfunction\
  \ maxDepth() {\n    static $i = 0;\n    print ++$i . \"\\n\";\n    maxDepth();\n\
  }\n\nmaxDepth();\n```\n\n我们能猜到最大深度吗？在耗尽内存限制前，深度达到了 917,056 层。如果启用了 `XDebug`，则限制将比这低得多。这也取决于你的内存、操作系统以及\
  \ PHP 设置，如 `memory_limit` 和 `max_execution_time`。\n\n\n\n虽然我们可以选择让递归非常深入，但请务必牢记，我们必须对递归函数保持控制。我们应该了解基本条件以及递归必须在何处结束。否则，可能会产生错误的结果或突然终止。\n\
  \n## 使用 SPL 递归迭代器\n\n标准 PHP 库 (SPL) 拥有许多用于递归目的的内置迭代器。我们可以根据需要使用它们，而无需从头实现的痛苦。以下是迭代器列表及其功能：\n\
  \n*   **`RecursiveArrayIterator`**：此递归迭代器允许遍历任何类型的数组或对象，并修改键或值或将其取消设置。它还允许遍历当前迭代器条目。\n\
  \n*   **`RecursiveCallbackFilterIterator`**：如果我们希望将回调函数递归地应用于任何数组或对象，此迭代器将非常有用。\n\
  \n*   **`RecursiveDirectoryIterator`**：此迭代器允许遍历任何目录或文件系统。它使目录列表变得非常简单。例如，我们可以使用此迭代器轻松重写本章编写的目录列表程序：\n\
  \n```\n$path = realpath('.'); \n\n$files = new RecursiveIteratorIterator( \n   new\
  \ RecursiveDirectoryIterator($path), RecursiveIteratorIterator::SELF_FIRST); \n\n\
  foreach ($files as $name => $file) { \n    echo \"$name\\n\"; \n}\n```\n\n*   **`RecursiveFilterIterator`**：如果我们在递归迭代中寻找过滤选项，可以使用此抽象迭代器来实现过滤部分。\n\
  \n*   **`RecursiveIteratorIterator`**：如果我们想遍历任何递归迭代器，可以使用此迭代器。它已内置，我们可以轻松应用。有关其用法的示例显示在\
  \ `RecursiveDirectoryIterator` 部分的目录迭代器一节中。\n\n*   **`RecursiveRegexIterator`**：如果您想应用正则表达式来过滤迭代器，可以将此迭代器与其他迭代器一起使用。\n\
  \n*   **`RecursiveTreeIterator`**：递归树迭代器允许我们为任何目录或多维数组创建类似树的图形表示。例如，以下足球队列表数组将生成树结构：\n\
  \n```\n$teams = array( \n    'Popular Football Teams', \n    array( \n        'La\
  \ Lega', \n        array('Real Madrid', 'FC Barcelona', 'Athletico Madrid', 'Real\
  \ Betis', 'Osasuna') \n    ), \n    array( \n        'English Premier League', \n\
  \        array('Manchester United', 'Liverpool', 'Manchester City', 'Arsenal', 'Chelsea')\
  \ \n    ) \n); \n\n$tree = new RecursiveTreeIterator( \n    new RecursiveArrayIterator($teams),\
  \ null, null, RecursiveIteratorIterator::LEAVES_ONLY \n); \n\nforeach ($tree as\
  \ $leaf) \n    echo $leaf . PHP_EOL;\n```\n\n输出将如下所示：\n\n```\n|-Popular Football\
  \ Teams\n| |-La Lega\n|   |-Real Madrid\n|   |-FC Barcelona\n|   |-Athletico Madrid\n\
  |   |-Real Betis\n|   \\-Osasuna\n|-English Premier League\n    |-Manchester United\n\
  \    |-Liverpool\n    |-Manchester City\n    |-Arsenal\n    \\-Chelsea\n```\n\n\
