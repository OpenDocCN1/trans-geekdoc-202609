  \n### 前言\n\n数据结构和算法是软件应用开发不可或缺的一部分。无论我们是构建基于 Web 的应用程序、CMS，还是使用 PHP 构建独立的后端系统，我们都需要时刻应用算法和数据结构。有时，我们在不知不觉中这样做，有时则是没有给予足够的重视。大多数开发人员认为这两个主题非常困难，而且没必要关注细节，因为\
  \ PHP 拥有大量对数据结构和算法的内置支持。在本书中，我们将专注于 PHP 数据结构和算法的基础知识和实际示例，以便我们了解什么是数据结构、为什么要选择它们，以及在哪里应用哪种算法。本书专为初学者和有经验的\
  \ PHP 程序员设计。本书从基础主题开始，逐步深入到更高级的主题。我们尝试在本书中容纳大量带有图片和解释的示例，以便您能够通过可视化形式和实际示例正确理解这些概念。\n\
  \n### 本书涵盖内容\n\n**第 1 章**，*数据结构与算法简介*，重点介绍不同的数据结构、它们的定义、属性和示例。本章还包括我们分析算法并找出其复杂度的方法，并特别强调大\
  \ O (`O`) 表示法。\n\n**第 2 章**，*理解 PHP 数组*，重点介绍 PHP 中一个非常基础且内置的数据结构——PHP 数组。这也涵盖了我们可以通过\
  \ PHP 数组实现的功能及其优缺点。我们重点介绍如何使用数组来实现其他数据结构。\n\n\n\n\n\n## 章节概览\n\n- Chapter 3 , *Using\
  \ Linked Lists* , 涵盖不同类型的链表。重点介绍链表不同变体的分类及其构建过程，并附带示例。\n- Chapter 4 , *Constructing\
  \ Stacks and Queues* , 重点介绍本章中最重要的两个数据结构——栈和队列。我们将了解如何使用不同方法构建栈和队列，并通过示例讨论它们的操作和用法。\n\
  - Chapter 5 , *Applying Recursive Algorithms - Recursion* , 重点介绍算法中的一个重要主题——递归。我们将介绍使用递归算法解决问题的不同方式，以及使用该技术的优缺点。我们还将介绍一些可以使用递归解决的基本日常编程问题。\n\
  - Chapter 6 , *Understanding and Implementing Trees* , 谈论一种非层级数据结构——树。我们将介绍树的属性及其构建方法，并理解树数据结构在哪些情况下对我们很重要。\n\
  - Chapter 7 , *Using Sorting Algorithms* , 演示如何实现不同的排序算法及其复杂度，因为排序是编程世界中非常重要的主题，对高效排序算法的探索从未停止。在本章末尾，我们还将介绍\
  \ PHP 内置的排序算法。\n- Chapter 8 , *Exploring Search Options* , 说明搜索在编程世界中的重要性。在本章中，我们将重点介绍不同的搜索技术以及何时使用哪种算法。我们还将讨论是否应该在搜索前进行排序。本章包含大量不同算法的示例和实现。\n\
  - Chapter 9 , *Putting Graphs into Action* , 解释图算法是编程范式中应用最广泛的算法之一。在本章中，我们将重点介绍不同的图相关问题，并使用不同算法求解。我们将通过示例和解释介绍最短路径算法和最小生成树的实现。\n\
  - Chapter 10 , *Understanding and Using Heaps* , 谈论本书中最后一个数据结构主题——堆。它是一种非常高效的数据结构，在现实世界的许多实现中都有使用。我们将展示如何构建堆及其用途，包括堆排序算法的实现。\n\
  - Chapter 11 , *Solving Problems with Advanced Techniques* , 重点介绍解决问题的不同技术。我们将重点讨论备忘录模式、动态规划、贪心算法和回溯等主题，并附带实际问题的示例和解决方案。\n\
  - Chapter 12 , *PHP’s Built-In Support for Data Structures and Algorithms* , 展示\
  \ PHP 对数据结构和算法的内置支持。我们将介绍 PHP 的函数、PECL 库，以及一些在线资源参考。\n- Chapter 13 , *Functional\
  \ Data Structures with PHP* , 揭示函数式编程和使用 PHP 的函数式数据结构，因为函数式编程近来备受关注。我们将介绍一个名为 Tarsana\
  \ 的函数式编程库，并展示使用它的不同示例。\n\n## 本书所需环境\n\n您只需在机器上安装最新版本的 PHP（最低要求为 PHP 7.x）即可。您可以从命令行运行示例，这不需要\
  \ Web 服务器。不过，如果您愿意，也可以安装 Apache 或 Nginx，或以下组件：\n\n*   PHP 7.x+\n*   Nginx/Apache（可选）\n\
