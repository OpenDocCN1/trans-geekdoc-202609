  \n*   电子书搜索下载\n*   电子书打包资源分享\n*   学习资源分享\n\n## 总结\n\n在本章中，我们将讨论重点放在 PHP 数组上，以及使用\
  \ PHP 数组作为数据结构可以做什么。在接下来的章节中，我们将继续探索数组的特性。在下一章中，我们将重点关注链表数据结构及其不同变体。我们还将探讨关于链表的不同类型的实际示例及其最佳用法。\n\
  \n## 使用链表\n\n我们已经对数组有了很多了解。现在，我们将把重点转移到一种称为*列表*的新型数据结构上。它是编程世界中最常用的数据结构之一。在大多数编程语言中，数组是固定大小的结构。因此，它无法动态增长，从固定大小的数组中缩减或移除项目也很成问题，因为我们必须移动数组项来填补空缺。因此，许多开发人员更喜欢列表而不是数组。考虑到每个数组元素可能有一些额外字节的开销，在内存效率是主要因素的情况下可以使用链表。在本章中，我们将探讨\
  \ PHP 中不同类型的链表及其实现。我们还将研究可以使用链表解决的实际问题。\n\n## 什么是链表？\n\n链表是称为节点的对象的集合。每个节点通过一个链接连接到下一个节点，该链接只不过是一个对象引用。如果我们考虑下图，每个框代表一个节点。箭头表示节点之间的链接。这是一个单向链表的示例。最后一个节点包含指向\
  \ `NULL` 的下一个链接，以标记列表的结束：\n\n![](img/Image00021.gif)\n\n节点是一个对象，意味着它可以存储任何数据类型，简单如字符串、整数或浮点数，或复杂如数组、数组的数组、对象或对象数组。我们可以根据需要存储任何内容。\n\
  \n我们还可以对链表执行各种操作，例如以下操作：\n\n*   检查列表是否为空\n*   显示列表中的所有项目\n*   在列表中搜索项目\n*   获取列表的大小\n\
  *   在列表的开头或末尾插入新项目\n*   从列表的开头或末尾移除项目\n\n\n\n## 链表操作与实现\n\n*   在特定位置或某个项目之前/之后插入新项目\n\
  *   反转列表\n\n这些只是可以在链表上执行的部分操作。\n\n让我们编写一个简单的链表来存储一些名称：\n\n```php\nclass ListNode\
  \ { \n\n    public $data = NULL; \n\n    public $next = NULL; \n\n\n\n    public\
  \ function __construct(string $data = NULL) { \n\n        $this->data = $data; \n\
  \n    } \n\n}\n```\n\n我们之前提到过，链表由节点组成。我们已经为节点创建了一个简单的类。`ListNode` 类有两个属性：一个用于存储数据，另一个用于存储称为\
  \ `next` 的链接。现在，我们将使用 `ListNode` 类来实现一个链表。为简单起见，我们将只实现两个操作：`insert` 和 `display`：\n\
  \n```php\nclass LinkedList { \n\n    private $_firstNode = NULL; \n\n    private\
  \ $_totalNodes = 0; \n\n\n\n    public function insert(string $data = NULL) { \n\
  \n       $newNode = new ListNode($data); \n\n\n\n        if ($this->_firstNode ===\
  \ NULL) {           \n\n            $this->_firstNode = &$newNode;             \n\
  \n        } else { \n\n            $currentNode = $this->_firstNode; \n\n      \
  \      while ($currentNode->next !== NULL) { \n\n                $currentNode =\
  \ $currentNode->next; \n\n            } \n\n            $currentNode->next = $newNode;\
  \ \n\n        } \n\n       $this->_totalNode++; \n\n        return TRUE; \n\n  \
  \  } \n\n\n\n    public function display() { \n\n      echo \"Total book titles:\
  \ \".$this->_totalNode.\"\\n\"; \n\n        $currentNode = $this->_firstNode; \n\
  \n        while ($currentNode !== NULL) { \n\n            echo $currentNode->data\
  \ . \"\\n\"; \n\n            $currentNode = $currentNode->next; \n\n        } \n\
  \n    } \n\n} \n```\n\n前面的代码实际上实现了我们针对 `insert` 和 `display` 节点的两个基本操作。在 `LinkedList`\
  \ 类中，我们有两个私有属性：`$_firstNode` 和 `$_totalNodes`。它们的默认值分别为 `NULL` 和 `0`。我们需要标记头节点或第一个节点，以便始终知道从哪里开始。我们也可以称之为前端节点。无论我们提供什么名称，它主要用于指示链表的起始位置。现在，让我们继续查看\
  \ `insert` 操作的代码。\n\n`insert` 方法接受一个参数，即数据本身。我们将使用 `ListNode` 类通过数据创建一个新节点。在将书名插入链表之前，我们必须考虑两种可能性：\n\
  \n*   列表为空，我们正在插入第一个标题\n*   列表不为空，标题将被添加到末尾\n\n为什么我们需要考虑这两种情况？答案非常简单。如果我们不知道列表是否为空，我们的操作可能会得到不同的结果。我们还可能在节点之间创建无效的链接。因此，思路是：如果列表为空，我们插入的项目将成为列表的第一个项目。这正是代码的第一部分所做的事情：\n\
  \n```php\n$newNode = new ListNode($data); \n\n\n\nif ($this->_firstNode === NULL)\
  \ {             \n\n          $this->_firstNode = &$newNode; \n\n}\n```\n\n从前面的代码片段中我们可以看到，我们正在用数据创建一个新节点，并将该节点对象命名为\
  \ `$newNode`。之后，它检查 `$_firstNode` 是否为 `NULL`。如果是 `NULL`，则列表为空。如果为空，则将 `$newNode`\
  \ 对象赋值给 `$_firstNode` 属性。现在，`insert` 方法的剩余部分代表我们的第二个条件，即列表不为空，我们必须在列表末尾添加新项目：\n\n\
  ```php\n$currentNode = $this->_firstNode;    \n\nwhile ($currentNode->next !== NULL)\
  \ { \n\n  $currentNode = $currentNode->next; \n\n} \n\n$currentNode->next = $newNode;\
  \ \n```\n\n在这里，我们从 `$_firstNode` 属性获取列表的第一个节点。现在，我们将从第一个节点迭代到列表的末尾。我们将通过检查当前节点的下一个链接是否不为\
  \ `NULL` 来确保这一点。如果它是 `NULL`，则我们已到达列表的末尾。为了确保我们不会一直循环在同一个节点上，我们在迭代过程中将当前节点的下一个节点设置为当前项目。`while`\
  \ 循环代码实现了这一逻辑。一旦我们退出 `while` 循环，我们将链表的最后一个节点设置为 `$currentNode`。现在，我们必须将当前最后一个节点的下一个链接分配给新创建的名为\
  \ `$newNode` 的节点，因此我们只需将该对象放入节点的下一个链接中。此对象引用将作为两个节点对象之间的链接。最后，我们还通过后置递增 `$_totalNode`\
  \ 属性将总节点计数值加 1。\n\n我们本可以轻松地为列表创建另一个属性来跟踪最后一个节点。这本可以使我们免于每次插入新节点时都要遍历整个列表。我们有意忽略了这个选项，以便讲解链表的基本理解。在本章后面，我们将实现该功能以实现更快的操作。\n\
  \n如果我们看一下 `display` 方法，可以看到我们使用了几乎相似的逻辑来遍历每个节点并显示其内容。我们首先获取链表的头部项目。然后，我们遍历列表直到列表项目为\
  \ `NULL`。在循环内部，我们通过显示其 `$data` 属性来显示节点数据。现在，我们有了一个用于为链表创建单个节点的节点类 `ListNode`，以及一个用于执行基本\
  \ `insert` 和 `display` 操作的 `LinkedList` 类。让我们编写一小段代码来利用 `LinkedList` 类创建一个书名链表：\n\
  \n```php\n$BookTitles = new LinkedList(); \n\n$BookTitles->insert(\"Introduction\
  \ to Algorithm\"); \n\n$BookTitles->insert(\"Introduction to PHP and Data structures\"\
  ); \n\n$BookTitles->insert(\"Programming Intelligence\"); \n\n$BookTitles->display();\
  \ \n```\n\n在这里，我们为 `LinkedList` 创建一个新对象并将其命名为 `$BookTitles`。然后，我们使用 `insert` 方法插入新的书籍项目。我们添加了三本书，然后使用\
  \ `display` 方法显示书名。如果我们运行前面的代码，将看到以下输出：\n\n```\nTotal book titles: 3\n\n\n\nIntroduction\
  \ to Algorithm\n\n\n\nIntroduction to PHP and Data structures\n\n\n\nProgramming\
  \ Intelligence\n```\n\n正如我们所见，第一行有一个计数器，显示我们有三个书名，以及它们的名称。如果我们仔细观察，会发现书名的显示顺序与我们输入的顺序相同。这意味着我们实现的链表实际上保持了顺序。这是因为我们总是在列表末尾输入新节点。如果我们想要，本可以采用不同的方式。作为我们的第一个示例，我们已经涵盖了关于链表及其构建方法的许多内容。在接下来的章节中，我们将探索更多关于如何创建不同类型的链表以及更复杂的示例。现在，我们将重点关注不同类型的链表。\n\
  \n## 链表的不同类型\n\n到目前为止，我们处理的列表被称为单向链表，或线性链表。然而，根据涉及的操作，还有其他几种不同类型的链表：\n\n*   双向链表\n\
  *   循环链表\n*   多重链表\n\n## 双向链表\n\n在双向链表中，每个节点上有两个链接：一个指向下一个节点，另一个指向前一个节点。单向链表是单向的，而双向链表是双向的。我们可以在列表中毫无问题地向前或向后移动。下图显示了一个双向链表的示例。稍后，在\
  \ *用 PHP 实现双向链表* 部分，我们将探讨如何实现双向链表：\n\n![](img/Image00022.gif)\n\n## 循环链表\n\n\n\n\
  在单向或双向链表中，最后一个节点之后没有节点，因此最后一个节点没有任何后续节点可供迭代。如果我们允许最后一个节点指向第一个节点，就形成了一个环。这样的链表称为循环链表。单向链表和双向链表都可以作为循环链表。我们将在本章中实现一个循环链表。下图描绘了一个循环链表：\n\
  \n![](img/Image00023.gif)\n\n## 多重链表\n\n多重链表是一种特殊类型的链表，它拥有两个或更多链接将每个节点链接到另一个节点。根据链表的目的，它可以多方向增长。例如，如果我们以学生名单为例，每个学生是一个具有姓名、年龄、性别、系别、专业等属性的节点，那么我们不仅可以将每个学生的节点与下一个和上一个节点链接，还可以按年龄、性别、系别和专业进行链接。虽然使用这种链表需要对链表概念有很好的理解，但我们可以在需要时使用这种特殊的链表。下图描绘了一个多重链表：\n\
  \n![](img/Image00024.jpg)\n\n## 插入、删除和搜索项目\n\n到目前为止，我们只看到了插入节点和显示所有节点内容的操作。现在，我们将探索链表中可用的其他操作。我们将主要关注以下操作：\n\
  \n*   在第一个节点处插入\n*   搜索节点\n*   在特定节点前插入\n*   在特定节点后插入\n*   删除第一个节点\n*   删除最后一个节点\n\
  *   搜索并删除一个节点\n*   反转链表\n*   获取第 N 个位置的元素\n\n## 在第一个节点处插入\n\n当我们在前端（即头部）添加节点时，必须考虑两种简单的可能性。列表可以为空，因此新节点即为头节点。这种可能性简单明了。然而，如果列表已经有头节点，则必须执行以下操作：\n\
  \n1.  创建新节点。\n2.  将新节点设为第一个节点或头节点。\n3.  将之前的头节点或第一个节点指定为新创建的第一个节点的下一个节点。\n\n以下是实现代码：\n\
  \n```\npublic function insertAtFirst(string $data = NULL) { \n\n    $newNode = new\
  \ ListNode($data); \n\n    if ($this->_firstNode === NULL) {             \n\n  \
  \      $this->_firstNode = &$newNode;             \n\n    } else { \n\n        $currentFirstNode\
  \ = $this->_firstNode; \n\n        $this->_firstNode = &$newNode; \n\n        $newNode->next\
  \ = $currentFirstNode;            \n\n    } \n\n    $this->_totalNode++; \n\n  \
  \  return TRUE; \n\n} \n```\n\n## 读累了记得休息一会哦~\n\n**公众号：古德猫宁李**\n\n*   电子书搜索下载\n\
  *   书单分享\n*   书友学习交流\n\n**网站：**[沉金书屋 https://www.chenjin5.com](https://www.chenjin5.com)\n\
  \n*   电子书搜索下载\n*   电子书打包资源分享\n*   学习资源分享\n\n### 搜索节点\n\n搜索节点非常简单。我们需要遍历每个节点，并检查目标数据是否与节点数据匹配。如果找到数据，则返回该节点；否则返回\
  \ `FALSE`。实现如下所示：\n\n```\npublic function search(string $data = NULL) { \n\n   \
  \ if ($this->_totalNode) { \n\n        $currentNode = $this->_firstNode; \n\n  \
  \      while ($currentNode !== NULL) { \n\n            if ($currentNode->data ===\
  \ $data) { \n\n                return $currentNode; \n\n            } \n\n     \
  \       $currentNode = $currentNode->next; \n\n        } \n\n    } \n\n    return\
  \ FALSE; \n} \n```\n\n### 在特定节点前插入\n\n此过程类似于我们之前查看的第一个操作。主要区别在于我们需要找到特定节点，然后在其前面插入新节点。当找到目标节点时，我们可以将新创建节点的\
  \ `next` 指向目标节点，并将前一个节点的 `next` 指向新创建的节点。这在下图中展示：\n\n![](img/Image00025.jpg)\n\n\
  以下是实现上述逻辑的代码：\n\n```\npublic function insertBefore(string $data = NULL, string $query\
  \ = NULL) { \n\n    $newNode = new ListNode($data); \n\n\n\n    if ($this->_firstNode)\
  \ { \n\n        $previous = NULL; \n\n        $currentNode = $this->_firstNode;\
  \ \n\n        while ($currentNode !== NULL) { \n\n            if ($currentNode->data\
  \ === $query) { \n\n                $newNode->next = $currentNode; \n\n        \
  \        $previous->next = $newNode; \n\n                $this->_totalNode++; \n\
  \n                break; \n\n            } \n\n            $previous = $currentNode;\
  \ \n\n            $currentNode = $currentNode->next; \n\n        } \n\n    } \n\n\
  } \n```\n\n如果我们检查前面的代码，可以看到逻辑非常直接。此方法有两个参数：一个是 `data`，一个是 `query`。我们遍历每个节点。在此过程中，我们还跟踪当前节点和前一个节点。跟踪前一个节点很重要，因为当找到目标节点时，我们将把前一个节点的\
  \ `next` 设置为新创建的节点。\n\n### 在特定节点后插入\n\n此过程类似于在目标节点前插入节点。区别在于我们需要在目标节点后插入新节点。在这里，我们需要同时考虑目标节点及其指向的下一个节点。当找到目标节点时，我们可以将新创建节点的\
  \ `next` 指向目标节点原本的下一个节点，并将目标节点的 `next` 指向新创建的节点。以下是实现此操作的代码：\n\n```\npublic function\
  \ insertAfter(string $data = NULL, string $query = \n\n    NULL) { \n\n    $newNode\
  \ = new ListNode($data); \n\n\n\n    if ($this->_firstNode) { \n\n        $nextNode\
  \ = NULL; \n\n        $currentNode = $this->_firstNode; \n\n        while ($currentNode\
  \ !== NULL) { \n\n            if ($currentNode->data === $query) { \n\n        \
  \        if($nextNode !== NULL) { \n\n                    $newNode->next = $nextNode;\
  \ \n\n                } \n\n                $currentNode->next = $newNode; \n\n\
  \                $this->_totalNode++; \n\n                break; \n\n          \
  \  } \n\n            $currentNode = $currentNode->next; \n\n            $nextNode\
  \ = $currentNode->next; \n\n        } \n\n    } \n\n} \n```\n\n### 删除第一个节点\n\n删除节点仅意味着取出该节点并重新排列前一个和后一个节点的链接。如果我们只是移除一个节点，并将前一个节点的\
  \ `next` 链接与被删除节点的下一个节点连接起来，删除操作就完成了。请看下面的示例：\n\n![](img/Image00026.jpg)\n\n当我们删除第一个节点时，只需将第二个节点设为头节点或第一个节点。我们可以通过以下代码轻松实现：\n\
  \n```\npublic function deleteFirst() { \n\n    if ($this->_firstNode !== NULL) {\
  \ \n\n        if ($this->_firstNode->next !== NULL) { \n\n            $this->_firstNode\
  \ = $this->_firstNode->next; \n\n        } else { \n\n            $this->_firstNode\
  \ = NULL; \n\n        } \n\n        $this->_totalNode--; \n\n        return TRUE;\
  \ \n\n    } \n\n    return FALSE; \n\n} \n```\n\n现在，我们必须考虑一种特殊情况，即将总节点数减一。\n\n###\
  \ 删除最后一个节点\n\n删除最后一个节点要求我们将倒数第二个节点的 `next` 链接设为 `NULL`。我们将迭代直到最后一个节点，并在过程中跟踪前一个节点。一旦到达最后一个节点，将前一个节点的\
  \ `next` 属性设为 `NULL`，如下例所示：\n\n\n\n```\npublic function deleteLast() { \n\n    if\
  \ ($this->_firstNode !== NULL) { \n\n        $currentNode = $this->_firstNode; \n\
  \n        if ($currentNode->next === NULL) { \n\n            $this->_firstNode =\
  \ NULL; \n\n        } else { \n\n            $previousNode = NULL; \n\n\n\n    \
  \        while ($currentNode->next !== NULL) { \n\n                $previousNode\
  \ = $currentNode; \n\n                $currentNode = $currentNode->next; \n\n  \
  \          } \n\n\n\n            $previousNode->next = NULL; \n\n            $this->_totalNode--;\
  \ \n\n            return TRUE; \n\n        } \n\n    } \n\n    return FALSE; \n\n\
  } \n```\n\n首先，我们检查列表是否为空。然后，我们检查列表是否有多个节点。根据结果，我们遍历到最后一个节点并跟踪前一个节点。接着，我们将前一个节点的\
  \ next 链接赋值为 `NULL`，以便从列表中移除最后一个节点。\n\n## 搜索并删除节点\n\n我们可以使用搜索和删除操作从列表中删除任意节点。首先，我们在列表中搜索该节点，然后通过移除该节点的引用来删除它。以下是实现此功能的代码：\n\
  \n```\npublic function delete(string $query = NULL) { \n\n    if ($this->_firstNode)\
  \ { \n\n        $previous = NULL; \n\n        $currentNode = $this->_firstNode;\
  \ \n\n        while ($currentNode !== NULL) { \n\n            if ($currentNode->data\
  \ === $query) { \n\n                if ($currentNode->next === NULL) { \n\n    \
  \                $previous->next = NULL; \n\n                } else { \n\n     \
  \               $previous->next = $currentNode->next; \n\n                } \n\n\
  \n\n                $this->_totalNode--; \n\n                break; \n\n       \
  \     } \n\n            $previous = $currentNode; \n\n            $currentNode =\
  \ $currentNode->next; \n\n        } \n\n    } \n\n} \n```\n\n## 反转列表\n\n反转链表有很多方法。我们将采用一种简单的方法来反转列表，称为原地反转。我们遍历节点并将下一个节点改为前一个节点、前一个节点改为当前节点、当前节点改为下一个节点。该逻辑的伪代码算法如下所示：\n\
  \n```\nprev   = NULL; \n\ncurrent = first_node; \n\nnext = NULL; \n\nwhile (current\
  \ != NULL) \n\n{ \n\n  next  = current->next;   \n\n  current->next = prev;    \n\
  \n  prev = current; \n\n  current = next; \n\n} \n\nfirst_node = prev; \n```\n\n\
  如果我们根据此伪代码实现反转函数，将如下所示：\n\n```\npublic function reverse() { \n\n    if ($this->_firstNode\
  \ !== NULL) { \n\n        if ($this->_firstNode->next !== NULL) { \n\n         \
  \   $reversedList = NULL; \n\n            $next = NULL; \n\n            $currentNode\
  \ = $this->_firstNode; \n\n            while ($currentNode !== NULL) { \n\n    \
  \            $next = $currentNode->next; \n\n                $currentNode->next\
  \ = $reversedList; \n\n                $reversedList = $currentNode; \n\n      \
  \          $currentNode = $next; \n\n            } \n\n            $this->_firstNode\
  \ = $reversedList; \n\n        } \n\n    } \n\n} \n```\n\n## 获取第 N 个位置的元素\n\n由于列表不同于数组，无法直接通过位置获取元素。为了获取第\
  \ N 个位置的元素，我们必须遍历到该位置并获取元素。以下是该方法的代码示例：\n\n```\npublic function getNthNode(int $n\
  \ = 0) { \n\n    $count = 1; \n\n    if ($this->_firstNode !== NULL) { \n\n    \
  \    $currentNode = $this->_firstNode; \n\n        while ($currentNode !== NULL)\
  \ { \n\n            if ($count === $n) { \n\n                return $currentNode;\
  \ \n\n            } \n\n            $count++; \n\n            $currentNode = $currentNode->next;\
  \ \n\n        } \n\n    } \n\n} \n```\n\n我们现在已经为 `LinkedList` 类编写了所有必需的操作。现在，让我们使用不同的操作运行程序。如果我们运行以下程序，将涵盖我们编写的大多数操作：\n\
  \n```\n$BookTitles = new LinkedList(); \n\n$BookTitles->insert(\"Introduction to\
  \ Algorithm\"); \n\n$BookTitles->insert(\"Introduction to PHP and Data structures\"\
  ); \n\n$BookTitles->insert(\"Programming Intelligence\"); \n\n$BookTitles->insertAtFirst(\"\
  Mediawiki Administrative tutorial guide\"); \n\n$BookTitles->insertBefore(\"Introduction\
  \ to Calculus\", \"Programming Intelligence\"); \n\n$BookTitles->insertAfter(\"\
  Introduction to Calculus\", \"Programming Intelligence\"); \n\n$BookTitles->display();\
  \ \n\n$BookTitles->deleteFirst(); \n\n$BookTitles->deleteLast(); \n\n$BookTitles->delete(\"\
  Introduction to PHP and Data structures\"); \n\n$BookTitles->reverse(); \n\n$BookTitles->display();\
  \ \n\necho \"2nd Item is: \".$BookTitles->getNthNode(2)->data; \n```\n\n上述代码的输出将如下所示：\n\
  \n```\nTotal book titles: 6\n\n\n\nMediawiki Administrative tutorial guide\n\n\n\
  \nIntroduction to Algorithm\n\n\n\nIntroduction to PHP and Data structures\n\n\n\
  \nIntroduction to Calculus\n\n\n\nProgramming Intelligence\n\n\n\nIntroduction to\
  \ Calculus\n\n\n\nTotal book titles: 3\n\n\n\nProgramming Intelligence\n\n\n\nIntroduction\
  \ to Calculus\n\n\n\nIntroduction to Algorithm\n\n\n\n2nd Item is: Introduction\
  \ to Calculus\n```\n\n现在我们有了一个使用 PHP 7 实现的完整链表。到目前为止我们了解到的一点是：与数组的实现不同，我们必须通过编写代码手动执行大量操作。我们还必须记住一点：这并不是实现链表的唯一方法。许多人倾向于同时跟踪列表的首尾节点，以获得更好的插入操作。现在，我们将探讨链表操作在平均和最坏情况下的复杂度。\n\
  \n## 理解链表的复杂度\n\n以下是链表操作的最佳、最坏和平均情况复杂度：\n\n| **操作** | **时间复杂度：最坏情况** | **时间复杂度：平均情况**\
  \ |\n| --- | --- | --- |\n| 在开头或结尾插入 | `O(1)` | `O(1)` |\n| 在开头或结尾删除 | `O(1)` |\
  \ `O(1)` |\n| 搜索 | `O(n)` | `O(n)` |\n| 访问 | `O(n)` | `O(n)` |\n\n通过记录最后一个节点（就像我们在示例中记录第一个节点一样），我们可以在链表末尾实现\
  \ `O(1)` 的插入复杂度。这将帮助我们直接跳转到链表的最后一个节点，而无需任何迭代。\n\n## 读累了记得休息一会哦~\n\n**公众号：古德猫宁李**\n\
  \n*   电子书搜索下载\n*   书单分享\n*   书友学习交流\n\n**网站：**[沉金书屋 https://www.chenjin5.com](https://www.chenjin5.com)\n\
  \n*   电子书搜索下载\n*   电子书打包资源分享\n*   学习资源分享\n\n## 使链表可迭代\n\n到目前为止，我们已经看到可以在方法内部使用 `while`\
  \ 循环遍历链表的每个节点。如果我们需要从外部仅使用链表对象进行迭代怎么办？这完全可以实现。PHP 有一个非常直观的迭代器接口，允许任何外部迭代器在内部遍历对象。`Iterator`\
  \ 接口提供以下方法：\n\n*   **Current**：返回当前元素\n*   **Next**：移动到下一个元素\n*   **Key**：返回当前元素的键\n\
  *   **Rewind**：将 `Iterator` 重置到第一个元素\n*   **Valid**：检查当前位置是否有效\n\n我们现在将在 `LinkedList`\
  \ 类中实现这些方法，以便直接通过对象遍历节点。为了在迭代期间跟踪列表中的当前节点和当前位置，我们的 `LinkedList` 类将需要两个新属性：\n\n```\n\
  private $_currentNode = NULL; \n\nprivate $_currentPosition = 0; \n```\n\n`$_currentNode`\
  \ 属性将在迭代期间跟踪当前节点，`$_currentPosition` 将在迭代期间跟踪当前位置。我们还需要确保我们的 `LinkedList` 类实现了 `Iterator`\
  \ 接口。它将如下所示：\n\n\n\n## 实现可迭代的链表\n\n```\nclass LinkedList implements Iterator { \n\
  } \n```\n\n现在，让我们实现这五个新方法，使我们的链表对象可迭代。这五个方法非常直接且易于实现。代码如下：\n\n```\npublic function\
  \ current() { \n    return $this->_currentNode->data; \n} \n\npublic function next()\
  \ { \n    $this->_currentPosition++; \n    $this->_currentNode = $this->_currentNode->next;\
  \ \n} \n\npublic function key() { \n    return $this->_currentPosition; \n} \n\n\
  public function rewind() { \n    $this->_currentPosition = 0; \n    $this->_currentNode\
  \ = $this->_firstNode; \n} \n\npublic function valid() { \n    return $this->_currentNode\
  \ !== NULL; \n} \n```\n\n现在，我们拥有了一个可迭代的列表。这意味着现在我们可以使用 `foreach` 循环或任何其他我们希望遵循的迭代过程来遍历我们的链表对象。因此，如果我们编写以下代码，将看到所有书名：\n\
  \n```\nforeach ($BookTitles as $title) { \n    echo $title . \"\\n\"; \n}\n```\n\
  \n另一种方法是使用可迭代接口中的 `rewind()`、`valid()`、`next()` 和 `current()` 方法。它将产生与前面代码相同的输出：\n\
  \n```\nfor ($BookTitles->rewind(); $BookTitles->valid(); $BookTitles->next()) {\
  \ \n    echo $BookTitles->current() . \"\\n\"; \n}\n```\n\n## 构建循环链表\n\n构建循环链表并不像其名称听起来那么难。到目前为止，我们已经看到在末尾添加新节点非常简单；我们将最后一个节点的\
  \ `next` 引用设置为 `NULL`。在循环链表中，最后一个节点的 `next` 引用实际上会指向第一个节点，从而创建一个循环列表。让我们编写一个简单的循环链表，其中节点将插入到列表末尾：\n\
  \n```\nclass CircularLinkedList { \n    private $_firstNode = NULL; \n    private\
  \ $_totalNode = 0; \n\n    public function insertAtEnd(string $data = NULL) { \n\
  \        $newNode = new ListNode($data); \n        if ($this->_firstNode === NULL)\
  \ { \n            $this->_firstNode = &$newNode; \n        } else { \n         \
  \   $currentNode = $this->_firstNode; \n            while ($currentNode->next !==\
  \ $this->_firstNode) { \n                $currentNode = $currentNode->next; \n \
  \           } \n            $currentNode->next = $newNode; \n        } \n      \
  \  $newNode->next = $this->_firstNode; \n        $this->_totalNode++; \n       \
  \ return TRUE; \n    } \n}\n```\n\n如果我们仔细观察前面的代码，它看起来完全像我们的单向链表实现。唯一的区别是我们不检查列表的末尾，而是确保当前节点不与第一个节点相同。此外，在以下代码行中，我们将新创建节点的\
  \ `next` 引用赋值为列表的第一个节点：\n\n```\n$newNode->next = $this->_firstNode; \n```\n\n当我们实现这一点时，新节点被添加到列表的后端。我们所需要做的就是将新节点的\
  \ `next` 引用设置为列表中的第一个节点。通过这样做，我们实际上创建了一个循环链表。我们必须确保不会陷入无限循环。这就是为什么我们将 `$currentNode->next`\
  \ 与 `$this->_firstNode` 进行比较。当我们显示循环链表中的所有元素时，同样的原则也适用。我们需要确保在显示标题时不会陷入无限循环。以下是显示循环链表中所有标题的代码：\n\
  \n```\npublic function display() { \n    echo \"Total book titles: \" . $this->_totalNode\
  \ . \"\\n\"; \n    $currentNode = $this->_firstNode; \n    while ($currentNode->next\
  \ !== $this->_firstNode) { \n        echo $currentNode->data . \"\\n\"; \n     \
  \   $currentNode = $currentNode->next; \n    } \n    if ($currentNode) { \n    \
  \    echo $currentNode->data . \"\\n\"; \n    } \n}\n```\n\n到目前为止，我们已经构建了一个单向链表并实现了一个循环链表。现在，我们将使用\
  \ PHP 实现一个双向链表。\n\n## 在 PHP 中实现双向链表\n\n我们已经从双向链表的定义中知道，双向链表节点将有两个链接：一个指向下一个节点，另一个指向前一个节点。此外，当我们添加新节点或删除新节点时，我们需要为每个受影响的节点设置\
  \ `next` 和 `prev` 两个引用。我们在单向链表实现中看到了一种不同的方法，那里我们没有跟踪最后一个节点，因此每次都必须使用迭代器来到达最后一个节点。这一次，我们将跟踪最后一个节点，以及我们的插入和删除操作，以确保我们的插入、删除和末端操作具有\
  \ `O(1)` 复杂度。\n\n以下是带有两个链接指针的新节点类的样子，随后是双向链表类的基本结构：\n\n```\nclass ListNode {\n \
  \   public $data = NULL; \n    public $next = NULL; \n    public $prev = NULL; \n\
  \n    public function __construct(string $data = NULL) {\n        $this->data =\
  \ $data;\n    }\n}\n\nclass DoublyLinkedList {\n    private $_firstNode = NULL;\n\
  \    private $_lastNode = NULL;\n    private $_totalNode = 0;\n}\n```\n\n在下一节中，我们将探讨双向链表的不同操作，以便我们了解单向链表和双向链表之间的基本区别。\n\
  \n## 双向链表操作\n\n我们将在双向链表实现中探讨以下操作。虽然它们听起来与单向链表中使用的操作相似，但它们的实现有重大区别：\n\n*   在第一个节点处插入\n\
  *   在最后一个节点处插入\n*   在特定节点之前插入\n*   在特定节点之后插入\n*   删除第一个节点\n*   删除最后一个节点\n*   搜索并删除一个节点\n\
  *   正向显示列表\n*   反向显示列表\n\n## 在第一个节点处插入\n\n当我们在前端或头部添加节点时，我们必须检查列表是否为空。如果列表为空，第一个节点和最后一个节点都将指向新创建的节点。然而，如果列表已经有一个头节点，则必须执行以下操作：\n\
  \n1.  创建新节点。\n2.  将新节点设为第一个节点或头节点。\n3.  将之前的头节点或第一个节点作为 `next`，使其跟随新创建的第一个节点。\n\
  4.  将之前第一个节点的 `prev` 链接指向新的第一个节点。\n\n代码如下：\n\n```\npublic function insertAtFirst(string\
  \ $data = NULL) {\n    $newNode = new ListNode($data);\n    if ($this->_firstNode\
  \ === NULL) {\n        $this->_firstNode = &$newNode;\n        $this->_lastNode\
  \ = $newNode; \n    } else {\n        $currentFirstNode = $this->_firstNode; \n\
  \        $this->_firstNode = &$newNode; \n        $newNode->next = $currentFirstNode;\
  \ \n        $currentFirstNode->prev = $newNode; \n    }\n    $this->_totalNode++;\
  \ \n    return TRUE;\n}\n```\n\n## 在最后一个节点处插入\n\n由于我们现在正在跟踪最后一个节点，因此在末尾插入新节点会更容易。首先，我们需要检查列表是否不为空。如果为空，则新节点同时成为第一个和最后一个节点。然而，如果列表已经有一个最后一个节点，则必须执行以下操作：\n\
  \n1.  创建新节点。\n2.  将新节点设为最后一个节点。\n3.  将之前的最后一个节点作为当前最后一个节点的 `prev` 链接。\n4.  将之前最后一个节点的\
  \ `next` 链接指向新最后一个节点的 `prev` 链接。\n\n代码如下：\n\n\n\n```\npublic function insertAtLast(string\
  \ $data = NULL) { \n\n    $newNode = new ListNode($data);\n\n    if ($this->_firstNode\
  \ === NULL) {\n\n        $this->_firstNode = &$newNode; \n\n        $this->_lastNode\
  \ = $newNode; \n\n    } else {\n\n        $currentNode = $this->_lastNode; \n\n\
  \        $currentNode->next = $newNode; \n\n        $newNode->prev = $currentNode;\
  \ \n\n        $this->_lastNode = $newNode; \n\n    }\n\n    $this->_totalNode++;\
  \ \n\n    return TRUE;\n\n}\n```\n\n### 在特定节点前插入\n\n在特定节点前插入要求我们先找到该节点，并根据其位置，我们需要为新节点、目标节点以及目标节点前的节点更改后继和前驱节点，如下所示：\n\
  \n```\npublic function insertBefore(string $data = NULL, string $query = NULL) {\n\
  \n    $newNode = new ListNode($data); \n\n    if ($this->_firstNode) { \n      \
  \  $previous = NULL; \n        $currentNode = $this->_firstNode; \n        while\
  \ ($currentNode !== NULL) { \n            if ($currentNode->data === $query) { \n\
  \                $newNode->next = $currentNode; \n                $currentNode->prev\
  \ = $newNode; \n                $previous->next = $newNode; \n                $newNode->prev\
  \ = $previous; \n                $this->_totalNode++; \n                break; \n\
  \            }\n\n            $previous = $currentNode; \n            $currentNode\
  \ = $currentNode->next; \n        }\n    }\n}\n```\n\n### 在特定节点后插入\n\n在特定节点后插入类似于我们刚才讨论的方法。在这里，我们需要为新节点、目标节点以及目标节点后的节点更改后继和前驱节点。代码如下：\n\
  \n```\npublic function insertAfter(string $data = NULL, string $query = NULL) {\
  \ \n\n    $newNode = new ListNode($data);\n\n    if ($this->_firstNode) { \n   \
  \     $nextNode = NULL; \n        $currentNode = $this->_firstNode; \n        while\
  \ ($currentNode !== NULL) { \n            if ($currentNode->data === $query) { \n\
  \                if ($nextNode !== NULL) { \n                    $newNode->next\
  \ = $nextNode; \n                } \n                if ($currentNode === $this->_lastNode)\
  \ { \n                    $this->_lastNode = $newNode; \n                } \n  \
  \              $currentNode->next = $newNode; \n                $nextNode->prev\
  \ = $newNode; \n                $newNode->prev = $currentNode; \n              \
  \  $this->_totalNode++; \n                break; \n            } \n\n          \
  \  $currentNode = $currentNode->next; \n            $nextNode = $currentNode->next;\
  \ \n        }\n    }\n}\n```\n\n### 删除第一个节点\n\n当我们从双向链表中移除第一个节点时，只需将第二个节点设为第一个节点。将新第一个节点的前驱节点设为\
  \ `NULL` 并减少总节点计数，就像下面的代码一样：\n\n```\npublic function deleteFirst() { \n    if ($this->_firstNode\
  \ !== NULL) { \n        if ($this->_firstNode->next !== NULL) { \n            $this->_firstNode\
  \ = $this->_firstNode->next; \n            $this->_firstNode->prev = NULL; \n  \
  \      } else { \n            $this->_firstNode = NULL; \n        } \n        $this->_totalNode--;\
  \ \n        return TRUE; \n    } \n    return FALSE; \n}\n```\n\n## 读累了记得休息一会哦~\n\
